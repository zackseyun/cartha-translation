base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: de
  text: Die Sache wurde untersucht und bestätigte sich; daraufhin wurden die beiden an einem Baum aufgehängt[a]. Dies wurde im Buch der Chroniken in Gegenwart des Königs niedergeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einem Pfahl aufgehängt“ oder „an einem Pfahl aufgespießt“. Wörtlich: „an einem Baum“. Die genaue persische Hinrichtungsart ist nicht sicher; sie kann Aufspießen oder öffentliches Aufhängen umfasst haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: Als die Sache untersucht worden war
  rationale: Die passive Form von בקש bezeichnet hier die Untersuchung des gemeldeten Anschlags. „untersucht“ gibt den gerichtlichen Sinn in natürlichem Deutsch wieder.
- source_word: וַיִּמָּצֵא
  choice: und sich bestätigt hatte
  rationale: Die Form besagt in diesem Zusammenhang, dass sich die Meldung als zutreffend erwies. Die deutsche Wendung macht den im Hebräischen vorausgesetzten Bezug klar.
- source_word: וַיִּתָּלוּ
  choice: wurden … aufgehängt
  rationale: תלה bezeichnet das Aufhängen beziehungsweise öffentliche Zur-Schau-Stellen. Die Übersetzung bleibt gegenüber der möglichen persischen Hinrichtungsart bewusst unspezifisch.
- source_word: שְׁנֵיהֶם
  choice: die beiden
  rationale: Die Form hebt beide zuvor genannten Verschwörer gemeinsam hervor und wird so knapp und natürlich wiedergegeben.
- source_word: עַל עֵץ
  choice: an einem Holz
  rationale: עֵץ kann einen Baum, Holz oder einen hölzernen Pfahl beziehungsweise ein Holzgerüst bezeichnen. „an einem Holz“ bewahrt die Unbestimmtheit des hebräischen Ausdrucks besser als eine Festlegung auf „Baum“ oder „Pfahl“.
- source_word: וַיִּכָּתֵב
  choice: Das wurde … niedergeschrieben
  rationale: Die passive Form von כתב bezeichnet die schriftliche Aufnahme des Vorgangs in das amtliche Register.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chronik
  rationale: Die Wendung bezeichnet das offizielle annalistische Hofregister. „Buch der Chronik“ ist verständlich und bleibt nahe an der hebräischen Konstruktion.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: in Gegenwart des Königs
  rationale: לִפְנֵי bedeutet hier „vor“ beziehungsweise „in Gegenwart von“ und verweist auf die offizielle Aufzeichnung am Königshof.
