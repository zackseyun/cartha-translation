    rationale: Die hebräische Wendung bezeichnet ein annalistisches Hofregister. Der Plural „Buch der Chroniken“ ist im Deutschen hierfür idiomatischer und vermeidet den Eindruck eines bestimmten Werktitels.
  - severity: low
