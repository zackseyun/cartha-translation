  source_fidelity: Die Wiedergabe trifft die Abfolge und die passivischen Verben im Wesentlichen. „an einem Holz“ ist jedoch im heutigen Standarddeutsch als Bezeichnung des Hinrichtungsobjekts ungewöhnlich und kann missverständlich sein; עֵץ ist hier am besten mit „Baum“ wiederzugeben, während die historische Ausführungsart in der Anmerkung offenbleiben kann.
  naturalness: „Als die Sache untersucht worden war und sich bestätigt hatte“ ist grammatisch möglich, aber unnötig umständlich. Die narrative Form „Die Sache wurde untersucht und bestätigte sich“ ist klarer und wahrt die hebräische Verknüpfung. „Buch der Chronik“ klingt zudem wie der Titel eines einzelnen biblischen Buches; für das persische Hofarchiv ist „Buch der Chroniken“ idiomatischer und genauer.
  terminology: „aufgehängt“ für תלה bleibt angemessen vorsichtig. „Die beiden“ gibt שְׁנֵיהֶם korrekt wieder. Die Anmerkung sollte die Hauptlesart „Baum“ widerspiegeln und die Möglichkeit von Pfahl/Aufspießen als historische beziehungsweise lexikalische Alternative kennzeichnen.
