  text: וַ/תִּיטַ֨ב הַ/נַּעֲרָ֣ה בְ/עֵינָי/ו֮ וַ/תִּשָּׂ֣א חֶ֣סֶד לְ/פָנָי/ו֒ וַ֠/יְבַהֵל אֶת תַּמְרוּקֶ֤י/הָ וְ/אֶת מָנוֹתֶ֨/הָ֙ לָ/תֵ֣ת לָ֔/הּ וְ/אֵת֙ שֶׁ֣בַע הַ/נְּעָר֔וֹת הָ/רְאֻי֥וֹת לָֽ/תֶת לָ֖/הּ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְשַׁנֶּ֧/הָ וְ/אֶת נַעֲרוֹתֶ֛י/הָ לְ/ט֖וֹב בֵּ֥ית הַ/נָּשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: de
  text: Die junge Frau gefiel ihm und fand Gunst bei ihm. Er ließ ihr unverzüglich ihre Schönheitspflege und ihre Verpflegung zuteilen sowie sieben geeignete junge Dienerinnen aus dem Palast des Königs. Er brachte sie und ihre Dienerinnen an den besten Platz im Frauenhaus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: die junge Frau
  rationale: Gibt die Bezeichnung für eine junge weibliche Person natürlich und würdevoll wieder, ohne sie als Kind erscheinen zu lassen oder altertümlich zu klingen.
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: gefiel ihm
  rationale: Entspricht idiomatisch dem wörtlichen Ausdruck »war gut in seinen Augen«, ohne zusätzliche romantische oder sexuelle Nuancen einzutragen.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: fand Gunst bei ihm
  rationale: Bewahrt die höfische Bedeutung des Idioms, wonach sie sein Wohlwollen und seine bevorzugte Behandlung erlangte.
- source_word: וַיְבַהֵל
  choice: ließ ... unverzüglich ... zukommen
  rationale: Bringt sowohl die Eile als auch das im Kontext folgende Geben der Behandlungen und Zuteilungen zum Ausdruck.
- source_word: תַּמְרוּקֶיהָ
  choice: ihre Schönheitspflege
  rationale: Bezeichnet die kosmetischen beziehungsweise körperpflegenden Behandlungen im Vorbereitungsvorgang verständlich und ohne unnötige Spezifizierung einzelner Mittel.
- source_word: מָנוֹתֶיהָ
  choice: ihre Verpflegung
  rationale: Das Wort bezeichnet zugeteilte Portionen, besonders Nahrung oder Versorgung; »Verpflegung« ist im höfischen Kontext klares modernes Deutsch.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: sieben geeignete junge Dienerinnen
  rationale: »Geeignet« gibt das passive Partizip angemessen wieder; »Dienerinnen« macht ihre aus dem Palast zugewiesene Funktion deutlich, ohne einen höheren Rang anzunehmen.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: aus dem Palast des Königs
  rationale: Im königlichen Zusammenhang bezeichnet »Haus des Königs« den Palast beziehungsweise dessen Hofstaat; »Palast« ist die natürliche deutsche Wiedergabe.
- source_word: וַיְשַׁנֶּהָ
  choice: brachte er sie
  rationale: Der Zusammenhang spricht für einen Wechsel ihres Platzes innerhalb des Frauenhauses. Die Formulierung wahrt dies, ohne eine formelle Beförderung zu behaupten.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: an den besten Platz im Frauenhaus
  rationale: Folgt der wahrscheinlichsten syntaktischen Deutung als bevorzugter Ort innerhalb des Frauenhauses und vermeidet das stärker interpretierende Wort »Harem«.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Der lange hebräische Satz ist zur besseren Lesbarkeit gegliedert. »Frauenhaus« bleibt als sachnahe Bezeichnung erhalten; das interpretierendere »Harem« wird vermieden.
