revisions:
- from: Die junge Frau gefiel ihm und fand Gunst bei ihm. Daher ließ er ihr unverzüglich ihre Schönheitspflege und ihre Verpflegung zukommen, ebenso sieben geeignete junge Dienerinnen aus dem Palast des Königs. Dann brachte er sie und ihre Dienerinnen an den besten Platz im Frauenhaus.[a]
  to: Die junge Frau gefiel ihm und fand Gunst bei ihm. Er ließ ihr unverzüglich ihre Schönheitspflege und ihre Verpflegung zuteilen sowie sieben geeignete junge Dienerinnen aus dem Palast des Königs. Er brachte sie und ihre Dienerinnen an den besten Platz im Frauenhaus.
  rationale: Die Revision entfernt die nicht im Hebräischen ausgedrückte Folgerung »Daher«, fasst die Zuteilungen mit »zuteilen« präzise zusammen und streicht die irreführende Fußnote. Die Aussage über den besten Platz im Frauenhaus bleibt als kontextuell und syntaktisch naheliegende Übersetzung erhalten.
