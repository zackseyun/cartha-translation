  text: וַ/תִּלָּקַ֨ח אֶסְתֵּ֜ר אֶל הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ אֶל בֵּ֣ית מַלְכוּת֔/וֹ בַּ/חֹ֥דֶשׁ הָ/עֲשִׂירִ֖י הוּא חֹ֣דֶשׁ טֵבֵ֑ת בִּ/שְׁנַת שֶׁ֖בַע לְ/מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: de
  text: Ester wurde zum König Ahasveros in seinen königlichen Palast gebracht[a], im zehnten Monat – das ist der Monat Tebet[b] – im siebten Jahr seiner Herrschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum König Ahasveros genommen“. Das hebräische Verb steht im Passiv und betont, dass Ester nicht selbst handelt, sondern die Handlung an ihr geschieht.'
    reason: lexical_alternative
  - marker: b
    text: Tebet ist die babylonische Bezeichnung für den zehnten Monat.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: wurde ... gebracht
  rationale: Das Nifal ist passiv und stellt Ester als diejenige dar, an der gehandelt wird. „Gebracht“ klingt im Deutschen natürlicher als „genommen“, ohne die passive Aussage abzuschwächen.
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: zum König Ahasveros
  rationale: „Zu“ gibt die Bewegung auf den König hin direkt wieder; Titel und Eigenname stehen in natürlicher deutscher Reihenfolge.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: in seinen Königspalast
  rationale: Wörtlich bezeichnet die Wendung das „Haus seines Königtums“. Im Zusammenhang ist die königliche Residenz gemeint; „Königspalast“ ist klar, würdig und modern.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: im zehnten Monat
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: das ist der Monat Tebet
  rationale: Bewahrt die erläuternde Identifikation des zehnten Monats durch seinen Namen.
- source_word: טֵבֵת
  choice: Tebet
  rationale: Gebräuchliche deutsche Transliteration des hebräischen Monatsnamens.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: im siebten Jahr seiner Herrschaft
  rationale: Natürliche deutsche Wiedergabe der Formel für das Regierungsjahr; „Herrschaft“ entspricht hier dem zeitlichen Gebrauch von מַלְכוּת.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Perspektive des Hebräischen bleibt erhalten; die eingeschobene Kalendererklärung wird durch Gedankenstriche klar kenntlich gemacht.
