  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: de
  text: Nach diesen Ereignissen, als sich der Zorn des Königs Ahasveros gelegt hatte, erinnerte er sich an Waschti, an das, was sie getan hatte, und an das, was gegen sie verfügt worden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die zeitliche Übergangsformel wird in natürlichem Deutsch wiedergegeben; „Ereignisse“ bezeichnet hier die zuvor erzählten Vorgänge.
- source_word: כְּשֹׁךְ חֲמַת
  choice: als sich der Zorn … gelegt hatte
  rationale: שׁכך bezeichnet das Abklingen oder Zur-Ruhe-Kommen; die deutsche Wendung bewahrt das Bild eines nachlassenden heftigen Zorns.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: des Königs Ahasveros
  rationale: Titel und Eigenname bleiben erhalten; „Ahasveros“ ist die im Deutschen eingebürgerte Form des Namens.
- source_word: זָכַר אֶת וַשְׁתִּי
  choice: er erinnerte sich an Waschti
  rationale: זכר wird direkt mit „sich erinnern an“ wiedergegeben; der Name folgt der geläufigen deutschen Umschrift.
- source_word: וְאֵת אֲשֶׁר עָשָׂתָה
  choice: an das, was sie getan hatte
  rationale: Die Vorvergangenheit macht deutlich, dass Waschtis Handlung dem späteren Erinnern vorausging.
- source_word: וְאֵת אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: an das, was gegen sie verfügt worden war
  rationale: Das passive נִגְזַר bezeichnet eine verbindliche Entscheidung oder Verfügung; „gegen sie“ wahrt den nachteiligen Sinn von עָלֶיהָ, ohne mehr über die konkrete Rechtsform auszusagen als der hebräische Text.
