  text: וַ/יֹּאמְר֥וּ נַעֲרֵֽי הַ/מֶּ֖לֶךְ מְשָׁרְתָ֑י/ו יְבַקְשׁ֥וּ לַ/מֶּ֛לֶךְ נְעָר֥וֹת בְּתוּל֖וֹת טוֹב֥וֹת מַרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: de
  text: 'Da sagten die jungen Männer des Königs, die ihm dienten: „Man soll für den König junge, gut aussehende Jungfrauen suchen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „junge Frauen, Jungfrauen, gut von Aussehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das narrative Wayyiqtol führt die Handlung fort; „Da“ gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: die jungen Männer des Königs
  rationale: נַעַר bezeichnet hier junge Männer; die folgende Partizipialwendung benennt ihre Funktion gesondert, sodass die lexikalische Unterscheidung erhalten bleibt.
- source_word: מְשָׁרְתָיו
  choice: die ihm dienten
  rationale: Das Partizip von שׁרת beschreibt den persönlichen Dienst beim König. Ein Relativsatz ist im Deutschen klar und natürlich.
- source_word: יְבַקְשׁוּ
  choice: Man soll ... suchen
  rationale: Die aktive Jussivform bezeichnet einen Vorschlag beziehungsweise Auftrag mit nicht ausdrücklich genanntem Handlungsträger. Die deutsche Man-Konstruktion bewahrt dies natürlicher als ein Passiv.
- source_word: לַמֶּלֶךְ
  choice: für den König
  rationale: Die einfache Zweck- beziehungsweise Vorteilsangabe wird ohne interpretierenden Zusatz wiedergegeben.
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: junge ... Jungfrauen
  rationale: Die Verbindung bezeichnet junge Frauen im heiratsfähigen Alter und hebt ausdrücklich ihre Jungfräulichkeit hervor.
- source_word: טוֹבוֹת מַרְאֶה
  choice: gut aussehende
  rationale: Die hebräische Wendung bedeutet wörtlich „gut von Aussehen“ und bezeichnet körperliche Attraktivität; „gut aussehend“ bleibt dem Ausdruck nahe und klingt modern.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Bezeichnung „junge Männer“ wird nicht vorschnell zu „Diener“ verallgemeinert, da ihre Dienstfunktion im anschließenden Relativsatz eigens ausgedrückt ist.
