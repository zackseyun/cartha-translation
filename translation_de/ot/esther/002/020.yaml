base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: de
  text: Esther gab ihre Herkunft und ihr Volk[a] weiterhin nicht bekannt, wie Mordechai es ihr geboten hatte. Sie befolgte Mordechais Weisung weiterhin, wie schon damals, als sie bei ihm aufwuchs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Abstammung“. Das hebräische Wort kann Herkunft, Abstammung oder Verwandtschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als sie unter seiner Obhut war“. Das Hebräische erinnert an die Zeit, in der Mordechai Esther aufzog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... מַגֶּדֶת
  choice: gab ... weiterhin nicht bekannt
  rationale: Die Verbindung aus אֵין und Partizip bezeichnet hier einen fortdauernden Zustand beziehungsweise ein anhaltendes Verhalten. „Weiterhin nicht bekannt“ gibt diesen Verlauf im Erzählkontext natürlich wieder.
- source_word: מוֹלַדְתָּהּ
  choice: ihre Herkunft
  rationale: Das Substantiv kann Geburt, Abstammung oder Verwandtschaft bezeichnen. „Herkunft“ ist im modernen Deutschen verständlich und lässt den genauen Bezug bewusst offen.
- source_word: עַמָּהּ
  choice: ihr Volk
  rationale: עַם bezeichnet hier Esthers ethnisch-nationale Zugehörigkeit. „Ihr Volk“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ
  choice: wie Mordechai es ihr geboten hatte
  rationale: צוה bezeichnet ein verbindliches Gebot, nicht bloß einen Rat. Der Plusquamperfekt ordnet Mordechais Anweisung zeitlich vor Esthers fortgesetztem Schweigen ein.
- source_word: מַאֲמַר מָרְדֳּכַי
  choice: Mordechais Weisung
  rationale: מַאֲמַר kann Wort, Ausspruch oder Anweisung bedeuten. „Weisung“ bewahrt den verbindlichen Sinn im Kontext, ohne die vorherige Formulierung „geboten“ wörtlich zu wiederholen.
- source_word: עֹשָׂה
  choice: befolgte ... weiterhin
  rationale: Das Partizip bezeichnet fortgesetztes oder gewohnheitsmäßiges Handeln. „Weiterhin“ macht deutlich, dass Esther sich auch als Königin beständig nach Mordechais Weisung richtete.
- source_word: בְאָמְנָה אִתּוֹ
  choice: als sie bei ihm aufwuchs
  rationale: Die Wendung von אמן bezeichnet Esthers frühere Erziehung durch Mordechai. „Bei ihm aufwuchs“ gibt das Pflege- und Erziehungsverhältnis idiomatisch wieder, ohne dessen rechtliche Gestalt näher festzulegen.
