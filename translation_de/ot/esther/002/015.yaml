  text: וּ/בְ/הַגִּ֣יעַ תֹּר אֶסְתֵּ֣ר בַּת אֲבִיחַ֣יִל דֹּ֣ד מָרְדֳּכַ֡י אֲשֶׁר֩ לָקַֽח ל֨/וֹ לְ/בַ֜ת לָ/ב֣וֹא אֶל הַ/מֶּ֗לֶךְ לֹ֤א בִקְשָׁה֙ דָּבָ֔ר כִּ֠י אִ֣ם אֶת אֲשֶׁ֥ר יֹאמַ֛ר הֵגַ֥י סְרִיס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וַ/תְּהִ֤י אֶסְתֵּר֙ נֹשֵׂ֣את חֵ֔ן בְּ/עֵינֵ֖י כָּל רֹאֶֽי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: de
  text: Als Ester an die Reihe kam, zum König hineinzugehen – sie war die Tochter Abihails, des Onkels Mordechais, der sie als Tochter zu sich genommen hatte[a] –, verlangte sie nichts außer dem, was Hegai, der Eunuch[b] des Königs und Aufseher über die Frauen, ihr empfahl. Ester fand Gunst in den Augen aller, die sie sahen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hatte sie sich zur Tochter genommen“. Gemeint ist, dass Mordechai Ester in seine Obhut nahm und sie wie eine Tochter aufzog; ein förmliches Adoptionsverfahren wird nicht ausdrücklich beschrieben.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann allgemeiner auch „Hofbeamter“ bedeuten; im Umfeld der königlichen Frauengemächer liegt hier jedoch die Bedeutung „Eunuch“ nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: Als … an die Reihe kam
  rationale: Die Präposition mit Infinitiv leitet einen Temporalsatz ein; תֹּר bezeichnet hier Esters festgelegte Position in der Abfolge der Frauen.
- source_word: דֹּד מָרְדֳּכַי
  choice: des Onkels Mordechais
  rationale: דֹּד bezeichnet hier aufgrund des bereits in Ester 2,7 genannten Verwandtschaftsverhältnisses Mordechais Onkel.
- source_word: לָקַח לוֹ לְבַת
  choice: hatte sie als seine Tochter angenommen
  rationale: Die hebräische Wendung beschreibt, dass Mordechai Ester in die Stellung einer Tochter aufnahm, ohne zwingend ein bestimmtes förmliches Adoptionsverfahren vorauszusetzen.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: zum König hineinzugehen
  rationale: Die Formulierung bewahrt die zurückhaltende höfische Ausdrucksweise und macht den im Kontext möglichen intimen Unterton nicht ausdrücklicher als der hebräische Text.
- source_word: לֹא בִקְשָׁה דָּבָר
  choice: verlangte sie nichts
  rationale: בקש bezeichnet hier das Erbitten beziehungsweise Verlangen nach Gegenständen oder Vorbereitungen für die Begegnung mit dem König.
- source_word: כִּי אִם אֵת אֲשֶׁר יֹאמַר
  choice: außer dem, was … ihr empfahl
  rationale: כִּי אִם markiert die einzige Ausnahme. יֹאמַר bedeutet wörtlich „sagen“; im Zusammenhang mit Hegais sachkundiger Auswahl ist „empfehlen“ im Deutschen die natürliche kontextuelle Wiedergabe.
- source_word: סְרִיס
  choice: Eunuch
  rationale: Das Wort kann einen königlichen Hofbeamten bezeichnen, meint im Umfeld der Frauengemächer hier aber wahrscheinlich spezifisch einen Eunuchen.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: Aufseher über die Frauen
  rationale: Die Partizipialwendung bezeichnet Hegais verantwortliche Aufsicht über die Frauen in den königlichen Gemächern.
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן
  choice: Ester fand Gunst
  rationale: Die hebräische Redewendung „Gunst tragen“ bedeutet, bei anderen Wohlwollen beziehungsweise Gunst zu finden.
- source_word: בְּעֵינֵי כָּל רֹאֶיהָ
  choice: in den Augen aller, die sie sahen
  rationale: Die Wiedergabe erhält das verständliche hebräische Bild und gibt die substantivierte Partizipialform natürlich wieder.
