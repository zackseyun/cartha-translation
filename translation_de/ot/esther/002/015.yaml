translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht bewahrter biblischer Bildsprache („Gunst in den Augen“). Die eingeschobene Erklärung zu Mordechais Verhältnis zu Ester folgt der komplexen hebräischen Satzstruktur, wird durch Gedankenstriche aber lesbar gehalten.
