  register: Modernes, würdiges Standarddeutsch. Die auffordernde Abfolge des hebräischen Vorschlags bleibt erhalten. „Frauenhaus“ wird wegen seiner heutigen möglichen Assoziation durch eine erklärende Fußnote kontextualisiert; der Haupttext folgt dennoch der konkreten hebräischen Bezeichnung.
