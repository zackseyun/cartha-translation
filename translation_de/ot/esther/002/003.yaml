revisions:
- from: Der König soll in allen Provinzen seines Reiches Beauftragte einsetzen. Sie sollen alle jungen, schönen Jungfrauen in die Festung Susa bringen lassen, in das Frauenhaus[a], unter die Aufsicht Hegais, des Eunuchen des Königs und Hüters der Frauen. Und man soll ihnen ihre Schönheitspflege zukommen lassen.[b]
  to: Der König soll in allen Provinzen seines Reiches Beauftragte einsetzen. Sie sollen alle jungen Jungfrauen von schönem Aussehen nach Susa, der Zitadelle, in das Haus der Frauen[a] zusammenbringen, in die Obhut Hegais, des Eunuchen des Königs und Hüters der Frauen. Und ihnen sollen ihre Schönheitsmittel gegeben werden.[b]
  rationale: Die Änderungen präzisieren die Rollen der Beauftragten und die appositionelle Ortsbezeichnung, vermeiden eine moderne Fehlassoziation bei „Frauenhaus“ und geben die kosmetischen Präparate im Haupttext konkret wieder, ohne die breitere Bedeutung des hebräischen Ausdrucks aufzugeben.
