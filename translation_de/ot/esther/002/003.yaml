source:
  edition: WLC
  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: de
  text: Der König soll in allen Provinzen seines Reiches Beauftragte einsetzen. Sie sollen alle jungen Jungfrauen von schönem Aussehen nach Susa, der Zitadelle, in das Haus der Frauen[a] zusammenbringen, in die Obhut Hegais, des Eunuchen des Königs und Hüters der Frauen. Und ihnen sollen ihre Schönheitsmittel gegeben werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Harem“. Wörtlich steht im Hebräischen „in das Haus der Frauen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihnen sollen Schönheitsbehandlungen gewährt werden.“ Der hebräische Ausdruck kann sowohl Schönheitsmittel als auch Schönheitsbehandlungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד ... פְּקִידִים
  choice: Beauftragte einsetzen
  rationale: Die Kombination bezeichnet die Einsetzung königlicher Funktionsträger für eine bestimmte Aufgabe. „Beauftragte“ vermeidet einen militärischen Beiklang.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: Provinzen seines Reiches
  rationale: Dies entspricht der imperialen Verwaltungssprache des Esterbuches und ist im Deutschen natürlich.
- source_word: וְיִקְבְּצוּ
  choice: bringen lassen
  rationale: Das Verb bedeutet sammeln oder zusammenbringen; im Kontext königlicher Beauftragter gibt „bringen lassen“ den Vorgang idiomatisch wieder, ohne Freiwilligkeit anzudeuten.
- source_word: כָּל נַעֲרָה בְתוּלָה טוֹבַת מַרְאֶה
  choice: alle jungen, schönen Jungfrauen
  rationale: „jung“ gibt נַעֲרָה, „Jungfrauen“ בְתוּלָה und „schön“ die Wendung טוֹבַת מַרְאֶה wieder.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: die Festung Susa
  rationale: הַבִּירָה bezeichnet den befestigten königlichen Bezirk beziehungsweise die Zitadelle. „Festung Susa“ ist verständlich und bewahrt diesen Akzent.
- source_word: בֵּית הַנָּשִׁים
  choice: Frauenhaus
  rationale: Die wörtliche Bezeichnung bleibt erhalten; eine Fußnote nennt die kontextuelle Deutung „Harem“.
- source_word: אֶל יַד הֵגֶא
  choice: unter die Aufsicht Hegais
  rationale: Die hebräische Wendung „in die Hand“ bezeichnet hier Zuständigkeit oder Obhut.
- source_word: סְרִיס
  choice: Eunuch
  rationale: Obwohl das Wort auch einen Hofbeamten bezeichnen kann, passt die Grundbedeutung im Kontext des Frauenhauses besonders gut.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: Hüter der Frauen
  rationale: Die partizipiale Amtsbezeichnung wird knapp und nahe am Hebräischen wiedergegeben.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: man soll ihnen ihre Schönheitspflege zukommen lassen
  rationale: תַּמְרוּקִים kann kosmetische Mittel oder umfassendere Schönheitsbehandlungen bezeichnen. „Schönheitspflege“ bewahrt diese Bedeutungsbreite.
