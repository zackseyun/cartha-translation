  naturalness: Die Revision verwendet modernes, verständliches Standarddeutsch. „Haus der Frauen“ ist gegenüber dem kompakten, heute missverständlichen „Frauenhaus“ klarer und zugleich näher an der hebräischen Wortgruppe. Die Satzfolge bewahrt den auffordernden Charakter des Vorschlags.
  terminology: „Beauftragte“, „Jungfrauen“, „Zitadelle“, „Eunuch“ und „Obhut“ sind hier angemessen. „Schönheitsmittel“ gibt תַּמְרוּקֵיהֶן konkret wieder; die Fußnote bewahrt die weitere Bedeutungsmöglichkeit von Schönheitsbehandlungen.
