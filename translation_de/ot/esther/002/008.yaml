  text: וַ/יְהִ֗י בְּ/הִשָּׁמַ֤ע דְּבַר הַ/מֶּ֨לֶךְ֙ וְ/דָת֔/וֹ וּֽ/בְ/הִקָּבֵ֞ץ נְעָר֥וֹת רַבּ֛וֹת אֶל שׁוּשַׁ֥ן הַ/בִּירָ֖ה אֶל יַ֣ד הֵגָ֑י וַ/תִּלָּקַ֤ח אֶסְתֵּר֙ אֶל בֵּ֣ית הַ/מֶּ֔לֶךְ אֶל יַ֥ד הֵגַ֖י שֹׁמֵ֥ר הַ/נָּשִֽׁים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: de
  text: Als der Befehl des Königs und sein Erlass bekannt wurden und viele junge Frauen nach Susa, in die Zitadelle, unter die Aufsicht Hegais[a] zusammengebracht wurden, wurde auch Ester in das Haus des Königs[b] gebracht, unter die Aufsicht Hegais, des Aufsehers über die Frauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Hand Hegais“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in das Haus des Königs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: Befehl
  rationale: Im Zusammenhang mit dem königlichen Erlass bezeichnet das Wort eine amtliche Anordnung; „Befehl“ ist hier präziser als das allgemeinere „Wort“.
- source_word: דָת
  choice: Erlass
  rationale: Im persischen Hofkontext ist eine amtliche Rechtsbestimmung gemeint. „Erlass“ klingt im Deutschen natürlich und lässt deren genaue rechtliche Reichweite offen.
- source_word: נְעָרוֹת רַבּוֹת
  choice: viele junge Frauen
  rationale: Die Wendung bezeichnet zahlreiche junge Frauen im heiratsfähigen Alter. Sie sagt in diesem Vers für sich genommen nicht ausdrücklich „Jungfrauen“.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: die Zitadelle Susa
  rationale: הַבִּירָה bezeichnet hier den befestigten königlichen Komplex; „Zitadelle“ gibt dies genauer wieder als die allgemeine Bezeichnung „Stadt“.
- source_word: אֶל יַד
  choice: unter der Aufsicht
  rationale: Die wörtliche Wendung „in die Hand“ bezeichnet die Unterstellung unter Hegais Verantwortung und Verfügungsgewalt. „Unter der Aufsicht“ ist im Deutschen idiomatisch, ohne den institutionellen Rahmen zu beschönigen.
- source_word: וַתִּלָּקַח
  choice: wurde ... gebracht
  rationale: Die Passivform zeigt, dass Ester nicht selbst die Initiative ergriff. Die deutsche Passivkonstruktion bewahrt dies, ohne mit „ergriffen“ oder „verschleppt“ einen nicht ausdrücklich bezeichneten Grad an Gewalt festzulegen.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Palast des Königs
  rationale: Wörtlich steht „Haus des Königs“; im Kontext bezeichnet die Wendung den königlichen Palast- beziehungsweise Hofkomplex.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: Aufseher über die Frauen
  rationale: Das Partizip bezeichnet den für Bewachung und Betreuung Zuständigen. „Aufseher“ wahrt den amtlichen und potenziell kontrollierenden Charakter besser als das fürsorglicher klingende „Beschützer“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Die doppelten Zeitangaben des Hebräischen werden durch „Als ... und ...“ bewahrt; „da“ kennzeichnet den folgenden Hauptsatz. Die passive Rolle Esters und die institutionelle Verfügungsgewalt Hegais bleiben erkennbar.
