    rationale: Der Kontext erlaubt zwar „Palast“, doch die hebräische Formulierung lautet wörtlich „Haus des Königs“. Die formnähere deutsche Wiedergabe bleibt verständlich und wahrt die Ausdrucksweise des Textes.
