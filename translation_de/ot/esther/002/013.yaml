  text: וּ/בָ/זֶ֕ה הַֽ/נַּעֲרָ֖ה בָּאָ֣ה אֶל הַ/מֶּ֑לֶךְ אֵת֩ כָּל אֲשֶׁ֨ר תֹּאמַ֜ר יִנָּ֤תֵֽן לָ/הּ֙ לָ/ב֣וֹא עִמָּ֔/הּ מִ/בֵּ֥ית הַ/נָּשִׁ֖ים עַד בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: de
  text: 'Und so kam die junge Frau zum König: Alles, worum sie bat,[a] wurde ihr gegeben, um es aus dem Haus der Frauen[b] in das Haus des Königs mitzunehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alles, was sie sagte“; im Zusammenhang ist gemeint: alles, worum sie bat.'
    reason: lexical_alternative
  - marker: b
    text: „Haus der Frauen“ gibt den hebräischen Ausdruck formal wieder; gemeint ist das Frauenquartier des Palastes.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: Und so
  rationale: Die Wendung leitet die zuvor beschriebene Verfahrensweise idiomatisch ein; „Und so“ ist im Deutschen natürlich und prägnant.
- source_word: הַנַּעֲרָה
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet eine junge weibliche Person. „Junge Frau“ ist modern und vermeidet sowohl die kindliche Nebenbedeutung von „Mädchen“ als auch den altertümlichen Klang von „Jungfrau“.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: ging ... zum König
  rationale: בוא mit אֶל bezeichnet hier das Hingehen zum König; „ging zum König“ entspricht der erzählten Perspektive und klingt natürlich.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: Alles, worum sie bat
  rationale: Wörtlich steht „alles, was sie sagte“. Im Zusammenhang bezeichnet das Gesagte jedoch ihre Bitte um Dinge, die sie mitnehmen durfte; die Fußnote bewahrt den formalen Wortlaut.
- source_word: יִנָּתֵן לָהּ
  choice: wurde ihr gegeben
  rationale: Der Nifal von נתן ist passiv. Das Imperfekt beschreibt hier die übliche Verfahrensweise; im deutschen Erzählzusammenhang gibt das Präteritum dies angemessen wieder.
- source_word: לָבוֹא עִמָּהּ
  choice: damit sie es ... mit ... nehmen konnte
  rationale: Der Infinitiv von בוא mit עִם drückt aus, dass das Gewährte sie bei ihrem Gang begleitete. Im Deutschen wird dies idiomatisch als Mitnehmen formuliert.
- source_word: מִבֵּית הַנָּשִׁים
  choice: aus dem Frauenhaus
  rationale: Die formale Wiedergabe erhält das hebräische Bild „Haus der Frauen“. Eine Fußnote erklärt, dass die Frauenabteilung gemeint ist, und vermeidet das interpretativ stärker beladene „Harem“.
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: in den Königspalast
  rationale: Wörtlich „bis zum Haus des Königs“. Im Kontext bezeichnet die Wendung den königlichen Palast; „Königspalast“ ist im modernen Deutsch eindeutig und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Ablauf, während „worum sie bat“ und „mitnehmen konnte“ den Sinn idiomatisch ausdrücken. Die Marker [a] und [b] stehen unmittelbar bei den erläuterten Ausdrücken.
