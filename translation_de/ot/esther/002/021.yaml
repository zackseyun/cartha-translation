base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: de
  text: In jenen Tagen, als Mordechai am Tor des Königs saß, wurden Bigtan und Teresch, zwei Eunuchen[a] des Königs aus der Gruppe der Wächter am Eingang, zornig und suchten Hand an König Ahasveros zu legen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hofbeamte“. Das hebräische Wort kann allgemein königliche Amtsträger bezeichnen; in diesem Hofkontext sind jedoch wahrscheinlich Eunuchen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Hand gegen König Ahasveros auszustrecken“; gemeint ist, ihn anzugreifen oder zu ermorden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Die übliche hebräische Zeitangabe wird natürlich und ohne zeitliche Überpräzisierung wiedergegeben.
- source_word: יֹשֵׁב
  choice: saß
  rationale: Das Partizip beschreibt die andauernde Begleitsituation; im Zusammenhang mit dem Königstor ist „saß“ die naheliegende Bedeutung.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: am Tor des Königs
  rationale: Gemeint ist der offizielle Tor- und Verwaltungsbereich des Palastes; „am Tor“ ist im Deutschen natürlich und wahrt das konkrete Bild.
- source_word: קָצַף
  choice: wurden ... zornig
  rationale: Das vor dem zusammengesetzten Subjekt stehende Verb ist morphologisch Singular, bezieht sich aber auf beide Männer. „Zornig“ gibt die Stärke wieder, ohne sie zu steigern.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: Eunuchen des Königs
  rationale: סָרִיס kann allgemein einen königlichen Hofbeamten bezeichnen, meint in diesem persischen Hofkontext aber wahrscheinlich Eunuchen; die weitere Bedeutung steht in der Fußnote.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: die zu den Wächtern an der Schwelle gehörten
  rationale: Die Wendung bezeichnet ihre Aufgabe unter dem Palastpersonal. „Schwelle“ bewahrt das konkrete Bild des hebräischen Ausdrucks.
- source_word: וַיְבַקְשׁוּ
  choice: suchten
  rationale: Die Wiedergabe bleibt nahe an „suchen/beabsichtigen“ und legt den genauen Stand ihres Vorhabens nicht stärker fest als der Ausgangstext.
- source_word: לִשְׁלֹחַ יָד
  choice: Hand ... zu legen
  rationale: Die deutsche Wendung bewahrt das hebräische Hand-Bild und bringt zugleich die feindliche, gewaltsame Absicht verständlich zum Ausdruck.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Der Personenname wird nach seiner hebräischen Form wiedergegeben und nicht durch die historische Identifizierung „Xerxes“ ersetzt.
