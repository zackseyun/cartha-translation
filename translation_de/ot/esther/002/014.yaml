source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: de
  text: Am Abend ging sie hinein[a], und am Morgen kehrte sie in das zweite Frauenhaus zurück, in die Obhut Schaaschgas’, des Eunuchen des Königs, der die Nebenfrauen beaufsichtigte. Sie ging nicht wieder zum König hinein, es sei denn, der König hatte Gefallen an ihr und sie wurde mit Namen gerufen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zum König hineingehen“ ist eine hebräische Ausdrucksweise für das Betreten seiner Gemächer beziehungsweise das persönliche Aufsuchen des Königs; der Zusammenhang schließt geschlechtlichen Umgang ein, ohne ihn ausdrücklich zu benennen.
    reason: cultural_note
  - marker: b
    text: 'Das heißt: Sie wurde ausdrücklich und persönlich vorgeladen.'
    reason: clarification
lexical_decisions:
- source_word: בָּעֶרֶב הִיא בָאָה
  choice: Am Abend ging sie hinein
  rationale: Die Zeitangabe wird schlicht wiedergegeben. Das formal als „sie kam“ mögliche בָאָה bezeichnet hier im Erzählzusammenhang ihr Hineingehen zum König; der iterative Ablauf ergibt sich aus dem Kontext.
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: und am Morgen kehrte sie … zurück
  rationale: Bewahrt die einfache zeitliche Abfolge und die Grundbedeutung von שׁוב, „zurückkehren“.
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: das zweite Frauenhaus
  rationale: Gibt die hebräische Bezeichnung möglichst direkt und zugleich verständlich wieder. „Zweiter Harem“ wäre stärker deutend.
- source_word: אֶל יַד
  choice: in die Obhut
  rationale: Die Wendung „in die Hand von“ bezeichnet hier die Unterstellung unter die Aufsicht beziehungsweise Fürsorge einer zuständigen Person.
- source_word: שַׁעֲשְׁגַז
  choice: Schaaschgas
  rationale: Der Personenname wird in einer dem Hebräischen angenäherten deutschen Form wiedergegeben.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: des Eunuchen des Königs
  rationale: סָרִיס kann einen Hofbeamten oder spezifischer einen Eunuchen bezeichnen; im Zusammenhang der Frauenhäuser ist „Eunuch“ wahrscheinlich und sachgerecht.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: der die Nebenfrauen beaufsichtigte
  rationale: Das Partizip שֹׁמֵר bezeichnet den mit Bewachung beziehungsweise Aufsicht Betrauten. „Nebenfrauen“ ist eine natürliche deutsche Wiedergabe von פִּילַגְשִׁים.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: Sie durfte nicht wieder zum König hineingehen
  rationale: Die modale deutsche Formulierung bringt die geregelte Zugangsbeschränkung zum Ausdruck. „Hineingehen“ bewahrt die zurückhaltende Ausdrucksweise des Hebräischen.
- source_word: כִּי אִם
  choice: es sei denn
  rationale: Kennzeichnet natürlich und präzise die einzige Ausnahme.
- source_word: חָפֵץ בָּהּ
  choice: hatte Gefallen an ihr
  rationale: חָפֵץ בְּ kann Gefallen, Wohlgefallen oder Verlangen bezeichnen. Diese Wiedergabe lässt die Spannweite offen und verengt sie nicht auf sexuelles Begehren.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: und sie wurde mit Namen gerufen
  rationale: Nahe Wiedergabe der passiven Formulierung; gemeint ist eine ausdrückliche persönliche Vorladung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die institutionellen und sexuellen Gegebenheiten des persischen Hofes werden weder beschönigt noch expliziter formuliert als im Hebräischen. „Frauenhaus“ hält die konkrete Bildsprache des Ausgangstextes fest; „Nebenfrauen“ ist im heutigen Deutsch verständlicher als „Konkubinen“.
