  source_fidelity: 'Die Übersetzung gibt den hebräischen Satzbau und Sinn zuverlässig wieder: הַנַּעֲרָה als „die junge Frau“, die Gefallensformel als „die dem König gefällt“, תִּמְלֹךְ im Kontext treffend als „Königin werden“, תַּחַת im substitutiven Sinn als „anstelle“, sowie die abschließende Erzählformel וַיַּעַשׂ כֵּן als entsprechendes Handeln. „Dieser Vorschlag“ ist für הַדָּבָר kontextgerecht.'
