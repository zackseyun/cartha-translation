  terminology: „Waschti“ entspricht der etablierten deutschen biblischen Namensform. „Königin werden“ macht die im Kontext und in der femininen Verbform liegende Funktion klar, ohne den Grundsinn von מלך unzulässig einzuengen. Die Fußnoten markieren die wörtlichere Herrschaftsnuance und die Bildlichkeit der Idiome sachgerecht.
