  text: וְ/הַֽ/נַּעֲרָ֗ה אֲשֶׁ֤ר תִּיטַב֙ בְּ/עֵינֵ֣י הַ/מֶּ֔לֶךְ תִּמְלֹ֖ךְ תַּ֣חַת וַשְׁתִּ֑י וַ/יִּיטַ֧ב הַ/דָּבָ֛ר בְּ/עֵינֵ֥י הַ/מֶּ֖לֶךְ וַ/יַּ֥עַשׂ כֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: de
  text: Und die junge Frau, die dem König gefällt[a], soll anstelle Waschti Königin werden[b]. Dieser Vorschlag gefiel dem König[c], und er handelte danach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die in den Augen des Königs gut ist“; auch: „die in den Augen des Königs Gefallen findet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „soll anstelle Waschti herrschen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Diese Sache erschien dem König gut.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet eine junge weibliche Person. „Junge Frau“ ist modernes, natürliches Deutsch und vermeidet sowohl das möglicherweise zu junge „Mädchen“ als auch das altertümliche „Jungfrau“.
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: die dem König gefällt
  rationale: Die hebräische Wendung bedeutet wörtlich, dass sie „in den Augen des Königs gut ist“, und bezeichnet hier sein Gefallen oder positives Urteil. „Dem König gefällt“ gibt dies knapp und idiomatisch wieder.
- source_word: תִּמְלֹךְ
  choice: soll Königin werden
  rationale: Das Verb מלך bedeutet formal „herrschen/regieren“. Im Zusammenhang mit der Nachfolge Waschtis bezeichnet es die Einsetzung der ausgewählten Frau als Königin; „Königin werden“ ist im Deutschen natürlich, während die wörtlichere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: תַּחַת וַשְׁתִּי
  choice: anstelle Waschti
  rationale: תַּחַת bezeichnet hier Ersatz beziehungsweise Nachfolge, nicht eine räumliche Position.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: Dieser Vorschlag gefiel dem König
  rationale: דָּבָר kann „Wort“, „Sache“ oder kontextuell „Vorschlag“ bedeuten. Gemeint ist der unmittelbar zuvor empfohlene Handlungsplan. Die wiederholte Wendung mit „in den Augen“ wird entsprechend als „gefiel“ wiedergegeben.
- source_word: וַיַּעַשׂ כֵּן
  choice: und er handelte danach
  rationale: Die Erzählformel besagt, dass der König dem Vorschlag entsprechend vorging. „Er handelte danach“ ist klar und würdevoll und vermeidet das im Deutschen potenziell missverständliche „er tat so“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die parallele hebräische Gefallensformel wird in beiden Satzhälften mit „gefallen“ wiedergegeben; ihre Bildlichkeit bleibt in den Fußnoten sichtbar. Der Name וַשְׁתִּי folgt der im Deutschen etablierten biblischen Form „Waschti“.
