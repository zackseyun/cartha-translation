  yaml_path: translation/ot/esther/002/019.yaml
  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: de
  text: Als die Jungfrauen zum zweiten Mal[a] versammelt wurden, saß Mordechai im Tor des Königs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wieder«. Wörtlich heißt es im Hebräischen: »zum zweiten Mal«.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Tor des Königs« ist wahrscheinlich der Torbereich des königlichen Palastes gemeint, der als Ort amtlicher Dienste und Verwaltung diente.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: Als ... versammelt wurden
  rationale: Die Verbindung aus ו, ב und dem Infinitivus constructus im Nifal leitet einen temporalen Nebensatz ein. Das Passiv „versammelt wurden“ entspricht der hebräischen Verbform; ein zusätzliches „nun“ ist im Ausgangstext nicht ausdrücklich vorhanden.
- source_word: בְּתוּלוֹת
  choice: die Jungfrauen
  rationale: Das Wort bezeichnet hier ausdrücklich unverheiratete junge Frauen mit Jungfrauenstatus. „Junge Frauen“ wäre flüssiger, würde diese Bedeutungsnuance aber abschwächen.
- source_word: שֵׁנִית
  choice: zum zweiten Mal
  rationale: Das Adverb bedeutet wörtlich „ein zweites Mal“ beziehungsweise „zum zweiten Mal“. Die gewählte Form ist im Deutschen natürlich und bewahrt die ausdrückliche Zählung.
- source_word: וּמָרְדֳּכַי
  choice: Mordechai
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: יֹשֵׁב
  choice: saß
  rationale: Das Qal-Partizip beschreibt einen andauernden Zustand. Im deutschen Erzählstil bringt das Präteritum „saß“ diesen Zustand natürlich zum Ausdruck.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: am Tor des Königs
  rationale: Die Wendung bezeichnet den Torbereich der königlichen Palastanlage. „Am Tor“ ist im Deutschen idiomatisch; der kulturelle und administrative Sinn wird in einer Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die konkrete Bezeichnung „Jungfrauen“ sowie die zeitliche Angabe „zum zweiten Mal“ bleiben erhalten; die Torformel wird knapp und natürlich wiedergegeben.
