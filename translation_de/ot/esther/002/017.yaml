base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: de
  text: Der König liebte Ester mehr als alle Frauen, und bei ihm erlangte sie mehr Gunst und Wohlwollen als alle Jungfrauen.[a] Da setzte er ihr die Königskrone auf und machte sie anstelle von Waschti zur Königin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische unterscheidet zwischen »Frauen« im ersten Satzteil und dem spezifischeren Ausdruck »Jungfrauen« im zweiten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: liebte
  rationale: אהב bezeichnet hier unmittelbar Liebe beziehungsweise Zuneigung; »liebte« gibt den klaren Erzählsinn wieder, ohne ihn zu bloßer Bevorzugung abzuschwächen.
- source_word: מִכָּל הַנָּשִׁים
  choice: mehr als alle anderen Frauen
  rationale: Die Vergleichskonstruktion מן + כל wird im Deutschen natürlich mit »mehr als alle anderen« wiedergegeben; נָשִׁים ist der allgemeine Ausdruck für Frauen.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד לְפָנָיו
  choice: sie fand bei ihm mehr Gunst und Wohlwollen
  rationale: Das wörtliche Bild des Tragens von חֵן und חֶסֶד ist im Deutschen nicht idiomatisch. »Gunst und Wohlwollen« bewahrt beide Begriffe und vermeidet, חֶסֶד hier unnötig bundestheologisch aufzuladen; לְפָנָיו wird natürlich als »bei ihm« ausgedrückt.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: als alle anderen Jungfrauen
  rationale: בְּתוּלֹת ist spezifischer als נָשִׁים und bezeichnet hier Jungfrauen; die unterschiedliche Wortwahl des Hebräischen bleibt erhalten.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת בְּרֹאשָׁהּ
  choice: Da setzte er ihr die Königskrone auf
  rationale: כֶּתֶר מַלְכוּת bedeutet eine Krone des Königtums beziehungsweise eine Königskrone. Die deutsche Wendung gibt auch das Aufsetzen auf ihren Kopf knapp und natürlich wieder.
- source_word: וַיַּמְלִיכֶהָ
  choice: machte sie … zur Königin
  rationale: Der Hifil von מלך bedeutet, jemanden zum Herrscher beziehungsweise zur Herrscherin zu machen; im Kontext ist »zur Königin machen« eindeutig und idiomatisch.
- source_word: תַּחַת וַשְׁתִּי
  choice: anstelle von Waschti
  rationale: תַּחַת bezeichnet in diesem Nachfolgekontext Ersatz beziehungsweise Einsetzung an der Stelle einer anderen Person.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der Vergleichsstruktur und der Unterschied zwischen »Frauen« und »Jungfrauen« werden bewahrt; »Gunst und Wohlwollen« gibt die beiden hebräischen Substantive unterscheidbar und idiomatisch wieder.
