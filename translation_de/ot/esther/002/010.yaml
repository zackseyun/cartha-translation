source:
  edition: WLC
  text: לֹא הִגִּ֣ידָה אֶסְתֵּ֔ר אֶת עַמָּ֖/הּ וְ/אֶת מֽוֹלַדְתָּ֑/הּ כִּ֧י מָרְדֳּכַ֛י צִוָּ֥ה עָלֶ֖י/הָ אֲשֶׁ֥ר לֹא תַגִּֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: de
  text: Esther hatte weder ihr Volk noch ihre Herkunft[a] bekannt gegeben, denn Mordechai hatte ihr befohlen, es nicht bekannt zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Abstammung“ beziehungsweise „ihre Verwandtschaft“. Das hebräische Wort kann die familiäre Herkunft, die Abstammung oder den Verwandtschaftskreis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: hatte … bekannt gegeben
  rationale: Das Hifil von נגד bedeutet „bekannt machen, mitteilen“. Das Plusquamperfekt gibt den erzählerischen Hintergrund natürlich wieder.
- source_word: עַמָּהּ
  choice: ihr Volk
  rationale: עַם bezeichnet hier Esthers ethnische beziehungsweise nationale Gemeinschaft; „ihr Volk“ bewahrt diese umfassende Bedeutung.
- source_word: מוֹלַדְתָּהּ
  choice: ihre Herkunft
  rationale: מוֹלֶדֶת kann Verwandtschaft, Abstammung oder Herkunft bezeichnen. Neben „ihr Volk“ ist „ihre Herkunft“ natürlich und lässt die lexikalische Bedeutungsbreite bestehen.
- source_word: צִוָּה עָלֶיהָ
  choice: hatte ihr befohlen
  rationale: צוה bezeichnet ein verbindliches Gebot; die Verbindung mit עַל wird im Deutschen idiomatisch mit dem Dativ wiedergegeben.
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: es nicht bekannt zu geben
  rationale: Der Satz nennt den Inhalt von Mordechais Befehl. „Es“ nimmt die beiden zuvor genannten Angaben zusammenfassend auf; die Wiederholung von „bekannt geben“ entspricht der Wiederholung desselben hebräischen Verbs.
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: מָרְדֳּכַי
  choice: Mordechai
  rationale: Der Personenname folgt der im modernen Deutschen gebräuchlichen biblischen Namensform.
