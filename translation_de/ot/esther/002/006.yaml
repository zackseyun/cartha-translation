base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: de
  text: der[a] aus Jerusalem verschleppt worden war, zusammen mit den Verschleppten, die mit Jechonja, dem König von Juda, verschleppt worden waren, den Nebukadnezar, der König von Babylon, verschleppt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Der Relativsatz kann sich auf Kisch, Mordechais Vorfahren, statt auf Mordechai selbst beziehen, da die Verbannung Jechonjas mehrere Generationen früher stattfand.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר הָגְלָה
  choice: der … verschleppt worden war
  rationale: Die Relativkonstruktion wird passiv wiedergegeben und lässt die erzwungene Deportation klar erkennen. „Verschleppt“ ist im modernen Deutschen natürlich und prägnant.
- source_word: מִירוּשָׁלַיִם
  choice: aus Jerusalem
  rationale: Direkte Wiedergabe von Präposition und Ortsname.
- source_word: עִם הַגֹּלָה
  choice: zusammen mit den Verschleppten
  rationale: Das Kollektiv bezeichnet die deportierte Menschengruppe; die konkrete Personenbezeichnung ist im Deutschen klarer als das abstrakte „Gefangenschaft“.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: die … in die Verbannung geführt worden waren
  rationale: Das feminine Singularverb stimmt mit dem hebräischen Kollektivum überein. Im Deutschen wird dessen pluralischer Sinn natürlich aufgenommen; die passive Form bewahrt den Deportationskontext.
- source_word: יְכָנְיָה
  choice: Jechonja
  rationale: Nahe Umschrift der hier belegten Namensform יְכָנְיָה und im Deutschen gebräuchlich.
- source_word: מֶלֶךְ יְהוּדָה
  choice: dem König von Juda
  rationale: Natürliche deutsche Wiedergabe der Status-constructus-Verbindung; der Dativ folgt auf „mit“.
- source_word: אֲשֶׁר הֶגְלָה
  choice: die … verschleppt hatte
  rationale: Nebukadnezar bleibt ausdrücklich der handelnde Urheber der Deportation. Das Relativpronomen bezieht sich grammatisch auf die Verschleppten.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Etablierte deutsche Namensform.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Übliche und klare deutsche Wiedergabe der hebräischen Genitivverbindung.
theological_decisions:
- issue: Bezugswort des ersten Relativsatzes in Ester 2,6
  choice: Der Haupttext lässt den Relativsatz entsprechend dem unmittelbaren syntaktischen Anschluss auf Mordechai zurückweisen.
  alternative: Der Relativsatz kann auf Kisch, Mordechais Vorfahren, bezogen werden.
  rationale: Der hebräische Text nennt hier kein neues Bezugswort; im fortlaufenden Satzbau liegt Mordechai näher. Wegen des zeitlichen Abstands zur Verbannung Jechonjas bleibt der Bezug auf Kisch jedoch eine ernsthafte Möglichkeit und wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Deportationsmotivs wird bewahrt, ohne die im Deutschen schwerfällige dreifache Wiederholung derselben Formulierung zu erzwingen. Der Vers ist als fortlaufender Relativsatz zu Ester 2,5 formuliert.
