base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: de
  text: Alle Diener des Königs, die am Königstor waren, knieten nieder und warfen sich vor Haman nieder[a], denn so hatte es der König in Bezug auf ihn befohlen[b]. Mordechai aber wollte weder niederknien noch sich vor Haman niederwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „huldigten Haman“. Das hebräische Verb bezeichnet ein Sich-Niederwerfen und kann, wenn Gott das Gegenüber ist, auch mit „anbeten“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn so hatte es ihm der König befohlen“. Wahrscheinlicher bezieht sich das Pronomen jedoch auf Haman: Der Befehl galt der Ehre, die ihm erwiesen werden sollte.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: Diener
  rationale: עֶבֶד bezeichnet hier das zum königlichen Hof gehörende Personal. „Diener“ bewahrt die Breite des hebräischen Ausdrucks, ohne einen rechtlichen Sklavenstatus oder ein bestimmtes Amt vorauszusetzen.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: am Königstor
  rationale: Die Wendung bezeichnet den konkreten, zugleich administrativ bedeutsamen Bereich des königlichen Tores; „am Königstor“ ist im modernen Deutsch natürlich und anschaulich.
- source_word: כֹּרְעִים
  choice: knieten nieder
  rationale: Das Partizip beschreibt ein übliches beziehungsweise fortgesetztes Verhalten. Im erzählenden deutschen Kontext gibt „knieten nieder“ die körperliche Unterordnung klar wieder.
- source_word: וּמִשְׁתַּחֲוִים
  choice: warfen sich … nieder
  rationale: השתחוה kann Niederwerfung, Huldigung oder in anderen Kontexten Anbetung bezeichnen. Die körperlich-konkrete Wiedergabe bewahrt hier die Mehrdeutigkeit des Gestus, ohne ausdrücklich religiöse Anbetung zu behaupten.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: denn so hatte es der König in Bezug auf ihn befohlen
  rationale: 'Das Pronomen לוֹ wird am ehesten auf Haman bezogen: Der königliche Befehl betraf die ihm zu erweisende Ehre. Die Formulierung lässt die grammatisch mögliche andere Zuordnung in einer Fußnote sichtbar.'
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: kniete nicht nieder und warf sich nicht vor ihm nieder
  rationale: Die Imperfektformen bezeichnen im Zusammenhang Mordechais beharrliche Weigerung. Die wiederholte Wortwahl hält den deutlichen Gegensatz zum Verhalten der anderen Diener aufrecht.
theological_decisions:
- issue: Ob הִשְׁתַּחֲוָה ausdrücklich als religiöse Anbetung wiederzugeben ist
  choice: Körperlich und kontextoffen mit „sich vor jemandem niederwerfen“ wiedergegeben
  alternative: „Haman huldigen“ oder „Haman anbeten“
  rationale: Das Verb kann sowohl menschliche Huldigung als auch Gottesverehrung bezeichnen. Da Haman das Objekt ist und der Text an dieser Stelle die religiöse Bedeutung nicht ausdrücklich festlegt, vermeidet die Übersetzung eine vorschnelle theologische Festlegung und bewahrt die Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen körperlichen Verben bilden die hebräische Doppelung ab; „warf sich vor ihm nieder“ vermeidet eine unnötig konfessionelle Deutung und bleibt für heutige Leser verständlich.
