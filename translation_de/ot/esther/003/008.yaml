base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: de
  text: 'Da sagte Haman zu König Ahasveros: „Es gibt ein bestimmtes Volk, verstreut und abgesondert unter den Völkern in allen Provinzen deines Königreichs. Seine Gesetze unterscheiden sich von denen jedes anderen Volkes, und die Gesetze des Königs befolgt es nicht. Deshalb ist es für den König nicht von Vorteil, es in Ruhe zu lassen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es gewähren zu lassen“ oder „es weiterhin zu dulden“. Das hebräische Verb kann bedeuten, jemanden unbehelligt zu lassen oder ihm zu erlauben, weiterzubestehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: Es gibt ein bestimmtes Volk
  rationale: Die Wendung führt ein nicht näher bezeichnetes, aber gezielt hervorgehobenes Volk ein. „Ein bestimmtes Volk“ gibt Hamans bewusst vage und zugleich insinuierende Ausdrucksweise natürlicher wieder als das allzu zahlenbetonte „ein einziges Volk“.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: verstreut und abgesondert
  rationale: Beide Partizipien werden wiedergegeben. „Abgesondert“ bezeichnet das Getrennt- beziehungsweise Anderssein unter den übrigen Völkern, ohne eine innere Spaltung dieses Volkes zu behaupten.
- source_word: בֵּין הָעַמִּים
  choice: unter den Völkern
  rationale: Der Ausdruck meint die ethnischen Bevölkerungsgruppen des Perserreichs; „Völker“ wahrt diesen Plural besser als „Nationen“.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: in allen Provinzen deines Königreichs
  rationale: מְדִינוֹת bezeichnet im Esterbuch die Verwaltungsprovinzen des Reiches. Die direkte Anrede „deines“ folgt dem Hebräischen.
- source_word: דָתֵיהֶם
  choice: seine Gesetze
  rationale: דָּת bezeichnet hier Gesetze beziehungsweise verbindliche Ordnungen. Der Singular „seine“ nimmt das grammatisch singularische „Volk“ im Deutschen natürlich auf.
- source_word: שֹׁנוֹת מִכָּל עָם
  choice: unterscheiden sich von denen jedes anderen Volkes
  rationale: Verglichen werden die Gesetze dieses Volkes mit denen aller anderen Völker. „Denen“ verdeutlicht den im Hebräischen knapper ausgedrückten Vergleich, ohne den Sinn zu erweitern.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: und die Gesetze des Königs befolgt es nicht
  rationale: עָשָׂה in Verbindung mit Gesetzen bedeutet sie auszuführen, einzuhalten oder zu befolgen. „Befolgen“ ist in modernem Deutsch klar und idiomatisch.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: Deshalb ist es für den König nicht von Vorteil
  rationale: Die Wendung bezeichnet fehlenden Nutzen oder Vorteil. Die Wiedergabe bewahrt Hamans zweckorientierten Appell und den Wechsel von der direkten Anrede zur Bezeichnung „der König“.
- source_word: לְהַנִּיחָם
  choice: dieses Volk gewähren zu lassen
  rationale: Das Hifil von נוח kann hier bedeuten, jemanden in Ruhe zu lassen oder unbehelligt fortbestehen zu lassen. „Gewähren lassen“ erhält diese Bedeutungsbreite; „dieses Volk“ verdeutlicht den pluralischen Rückbezug des Hebräischen in idiomatischem Deutsch.
