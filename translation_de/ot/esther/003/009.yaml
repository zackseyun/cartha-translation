base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: de
  text: Wenn es dem König gefällt[a], soll schriftlich angeordnet werden, sie zu vernichten. Und ich werde zehntausend Talente Silber[b] abwiegen und es denen übergeben, die die Arbeit ausführen[c], damit sie es in die Schatzkammern des Königs bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn es der König für gut hält.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zehntausend Talente Silber“; gemeint ist eine außerordentlich große, nach Gewicht bemessene Silbermenge, nicht ein Betrag in Münzen.'
    reason: cultural_note
  - marker: c
    text: 'Die hebräische Wendung kann auch bedeuten: „durch diejenigen, die die Arbeit ausführen“, also durch ihre Vermittlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Wenn es dem König gefällt
  rationale: Die höfische Wendung bezeichnet die Zustimmung beziehungsweise das Wohlgefallen des Königs. Die deutsche Formulierung ist natürlich und wahrt den idiomatischen Sinn.
- source_word: יִכָּתֵב
  choice: soll schriftlich angeordnet werden
  rationale: Die Nifal-Form bedeutet wörtlich „es werde geschrieben“. Im persischen Hofkontext geht es um eine verbindliche schriftliche Anordnung; die Wiedergabe macht diese Funktion verständlich, ohne ausdrücklich einen bestimmten Urkundentyp festzulegen.
- source_word: לְאַבְּדָם
  choice: sie zu vernichten
  rationale: Der Infinitiv mit Objektsuffix benennt den Inhalt der schriftlichen Anordnung und bringt die beabsichtigte vollständige Tötung nüchtern zum Ausdruck.
- source_word: כִּכַּר כֶּסֶף
  choice: Talente Silber
  rationale: כִּכָּר bezeichnet hier eine große Gewichtseinheit. Die traditionelle Bezeichnung „Talent“ vermeidet eine unsichere Umrechnung in moderne Gewichts- oder Geldwerte.
- source_word: אֶשְׁקוֹל
  choice: werde ich … abwiegen
  rationale: שׁקל bezeichnet konkret das Abwiegen. So bleibt erkennbar, dass Silber nach Gewicht bemessen wurde, statt als geprägte Währung gezählt zu werden.
- source_word: עַל יְדֵי
  choice: in die Hände derer
  rationale: Die Wendung kann sowohl Übergabe als auch Vermittlung beziehungsweise Ausführung durch Beauftragte ausdrücken. Die bildhafte Wiedergabe bewahrt diese Bedeutungsbreite.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: die die Arbeit ausführen
  rationale: Die Formulierung bleibt hinsichtlich der genauen Stellung dieser Personen ebenso offen wie der hebräische Ausdruck und legt sie nicht vorschnell als bestimmte Amtsträger fest.
- source_word: לְהָבִיא
  choice: damit sie es … bringen
  rationale: Der Infinitiv drückt hier den Zweck der Übergabe aus. Das Pronomen „es“ bezieht sich im Deutschen natürlich auf das zuvor genannte Silber.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: die Schatzkammern des Königs
  rationale: Der Plural des hebräischen Ausdrucks wird beibehalten; zugleich klingt die Formulierung in modernem Deutsch natürlich.
