translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Eingangsformel bleibt knapp; die grausame Forderung wird ohne beschönigende oder dramatisierende Zusätze wiedergegeben. Die etwas bildhafte Wendung „in die Hände … abwiegen“ bewahrt die Mehrdeutigkeit von Übergabe und Vermittlung im Hebräischen.
