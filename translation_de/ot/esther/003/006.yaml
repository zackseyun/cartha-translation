  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: de
  text: Doch es erschien ihm zu gering, an Mordechai allein Hand zu legen, denn man hatte ihm gesagt, welchem Volk Mordechai angehörte. Daher suchte Haman alle Juden im ganzen Königreich des Ahasveros zu vernichten – Mordechais Volk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: es war in seinen Augen zu gering
  rationale: Die Wendung bezeichnet eine verächtliche Geringschätzung. Die Formulierung bewahrt das hebräische Bild und macht zugleich deutlich, dass Mordechai allein Haman als zu unbedeutendes Ziel erschien.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: Hand anzulegen an
  rationale: Die deutsche Wendung bewahrt das konkrete Bild des Hebräischen und bezeichnet hier einen gewaltsamen Angriff.
- source_word: לְבַדּוֹ
  choice: nur
  rationale: Im Kontext hebt das Wort die Beschränkung auf Mordechai als Einzelnen hervor und bereitet den Gegensatz zum gesamten Volk vor.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: denn man hatte ihm gesagt
  rationale: Das unbestimmte Subjekt im Plural wird im natürlichen Deutschen mit „man“ wiedergegeben; das Plusquamperfekt bildet die zeitliche Vorordnung ab.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: welchem Volk Mordechai angehörte
  rationale: Der wörtliche Ausdruck „Mordechais Volk“ bezeichnet hier seine ethnische Volkszugehörigkeit. Die explizite Formulierung verhindert das Missverständnis, Mordechai sei dessen Herrscher.
- source_word: וַיְבַקֵּשׁ
  choice: trachtete danach
  rationale: בקש bezeichnet hier entschlossene Absicht und zielgerichtetes Streben, ohne schon den Erfolg der Tat zu behaupten.
- source_word: לְהַשְׁמִיד
  choice: zu vernichten
  rationale: Die Hifil-Form von שׁמד bezeichnet vollständige Zerstörung. „Vernichten“ gibt die Schwere des geplanten Vorgehens im Deutschen deutlicher wieder als das allgemeinere „zerstören“.
- source_word: כָּל הַיְּהוּדִים
  choice: alle Juden
  rationale: Im Esterbuch bezeichnet יְהוּדִים das jüdische Volk in der persischen Diaspora und nicht bloß Bewohner Judas.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: im ganzen Königreich des Ahasveros
  rationale: Die Formulierung gibt die umfassende geografische Reichweite des Plans idiomatisch wieder.
- source_word: עַם מָרְדֳּכָי
  choice: Mordechais Volk
  rationale: Die abschließende Apposition bewahrt die rhetorische Wiederholung des hebräischen Textes und identifiziert die Juden ausdrücklich als Mordechais Volk.
