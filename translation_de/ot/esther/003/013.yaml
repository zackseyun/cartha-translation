  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: de
  text: Schreiben wurden durch die Kuriere in alle Provinzen des Königs gesandt[a], um alle Juden auszurotten, zu töten und zu vernichten[b], von Jung bis Alt, Kinder und Frauen[c], an einem einzigen Tag, am dreizehnten Tag des zwölften Monats, das heißt des Monats Adar, und ihre Habe zu plündern[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand der Läufer“; gemeint sind königliche Kuriere.'
    reason: lexical_alternative
  - marker: b
    text: Die drei Verben „ausrotten“, „töten“ und „vernichten“ bilden im Hebräischen eine bewusste, eindringliche Häufung.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vom jungen Mann bis zum alten Mann, Kinder und Frauen“. Die Einzahl wird verallgemeinernd gebraucht.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „und ihre Beute zu plündern“; gemeint ist, ihre Habe als Beute an sich zu nehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: Die Schreiben wurden ... gesandt
  rationale: Die unpersönlich-passive Form wird im Deutschen natürlich mit dem ausdrücklich genannten Subjekt „die Schreiben“ wiedergegeben; „Schreiben“ passt zum persischen Verwaltungskontext.
- source_word: בְּיַד הָרָצִים
  choice: durch die Kuriere
  rationale: Die hebräische Wendung lautet wörtlich „durch die Hand der Läufer“. Gemeint sind königliche Eilboten; „Kuriere“ ist im Deutschen klar und historisch passend.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: auszurotten, zu töten und zu vernichten
  rationale: Die dreifache, steigernde Formulierung des hebräischen Erlasses bleibt erhalten und wird nicht zu einem einzigen Verb verkürzt.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: vom jungen bis zum alten Mann
  rationale: Die distributiv gebrauchten maskulinen Singularformen werden formal bewahrt; zusammen mit „Kinder und Frauen“ bezeichnet die Wendung die gesamte Bevölkerung.
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: „Einzigen“ hebt wie der Kontext die Konzentration der angeordneten Gewalt auf nur einen Tag hervor.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: ihren Besitz als Beute zu rauben
  rationale: Die Wiedergabe bezeichnet sowohl die Güter der Opfer als auch deren angeordnete Plünderung und klingt im Deutschen natürlicher als eine tautologische Formulierung wie „ihre Beute zu erbeuten“.
