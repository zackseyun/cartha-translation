source:
  edition: WLC
  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: de
  text: Die Eilboten zogen aus, auf Befehl des Königs zur Eile gedrängt. Der Erlass wurde in der Festung Susa verkündet.[a] Der König und Haman aber setzten sich zum Trinken nieder, während die Stadt Susa bestürzt war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wurde in der Festung Susa gegeben«. Das zugrunde liegende Wort kann in diesem persischen Verwaltungskontext »Gesetz« oder »Erlass« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »war verwirrt«, »war ratlos« oder »geriet in Unruhe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: die Eilboten
  rationale: Bezeichnet die königlichen Überbringer amtlicher Schreiben. »Eilboten« gibt sowohl ihre Funktion als auch die mit רוץ verbundene Schnelligkeit natürlich wieder.
- source_word: דְחוּפִים
  choice: zur Eile gedrängt
  rationale: 'Bewahrt den passiven Sinn: Die Boten handeln unter äußerem Druck und werden durch den königlichen Befehl angetrieben.'
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: auf Befehl des Königs
  rationale: דבר bezeichnet hier im amtlichen Zusammenhang eine verbindliche königliche Anordnung, nicht bloß ein gesprochenes Wort.
- source_word: הַדָּת
  choice: der Erlass
  rationale: Im persischen Verwaltungskontext des Esterbuches bezeichnet דָּת eine amtliche rechtliche Verfügung. »Erlass« ist im Deutschen klar und angemessen würdevoll.
- source_word: נִתְּנָה
  choice: wurde verkündet
  rationale: Das Verb bedeutet wörtlich »wurde gegeben«; zusammen mit einem Erlass bezeichnet es hier dessen amtliche Bekanntgabe. Die wörtliche Möglichkeit bleibt in der Fußnote sichtbar.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: die Festung Susa
  rationale: בִּירָה bezeichnet den befestigten Residenz- beziehungsweise Palastbezirk. »Festung Susa« gibt die hebräische Apposition knapp und verständlich wieder.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: setzten sich zum Trinken nieder
  rationale: Nahe Wiedergabe der hebräischen Wendung; sie bewahrt den scharfen erzählerischen Gegensatz zwischen dem Erlass und dem Verhalten des Königs und Hamans.
- source_word: נָבוֹכָה
  choice: war bestürzt
  rationale: Das Nifal beschreibt Verwirrung, Ratlosigkeit und innere Erschütterung. »Bestürzt« ist natürlich und lässt offen, ob vor allem Verwirrung oder Unruhe gemeint ist.
- source_word: וְ
  choice: während
  rationale: Das letzte וְ verbindet formal mit »und«, stellt erzählerisch jedoch die trinkenden Machthaber der betroffenen Stadt gegenüber. »Während« macht diesen zeitlichen und kontrastiven Zusammenhang deutlich, ohne einen ausdrücklichen Gegensatz stärker als nötig festzulegen.
