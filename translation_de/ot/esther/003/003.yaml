base_translation:
  language: en
  yaml_path: translation/ot/esther/003/003.yaml
  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: de
  text: 'Da sagten die Diener des Königs, die am Königstor waren, zu Mordechai: „Warum verstößt du gegen den Befehl des Königs?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Da sagten“ gibt diese Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: die Diener des Königs
  rationale: עֶבֶד kann Diener oder Sklave bezeichnen. Im höfischen Zusammenhang sind königliche Bedienstete gemeint; „Diener“ bewahrt die Grundbedeutung, ohne ihren rechtlichen Status zu präzisieren.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: die am Königstor waren
  rationale: Die Formulierung bezeichnet ihren Aufenthaltsort. „Am Königstor“ ist im Deutschen natürlich und lässt offen, ob sie dort lediglich anwesend oder dienstlich eingesetzt waren.
- source_word: לְמָרְדֳּכָי
  choice: zu Mordechai
  rationale: Die Präposition kennzeichnet den Adressaten der Rede; „zu Mordechai“ ist die übliche deutsche Wiedergabe.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das Fragewort verlangt nach dem Grund und wird unmittelbar mit „Warum“ wiedergegeben.
- source_word: עוֹבֵר אֵת מִצְוַת הַמֶּלֶךְ
  choice: verstößt du gegen den Befehl des Königs
  rationale: עבר mit einem Gebot als Objekt bedeutet hier, eine gesetzte Grenze zu überschreiten beziehungsweise einen Befehl zu verletzen. „Gegen … verstoßen“ gibt das idiomatisch und zugleich präzise wieder; „Befehl“ passt zum königlichen Hofkontext besser als das religiös klingende „Gebot“.
theological_decisions: []
