source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הָמָ֔ן הַ/כֶּ֖סֶף נָת֣וּן לָ֑/ךְ וְ/הָ/עָ֕ם לַ/עֲשׂ֥וֹת בּ֖/וֹ כַּ/טּ֥וֹב בְּ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: de
  text: 'Da sagte der König zu Haman: »Das Silber sei dir überlassen, ebenso das Volk, damit du mit ihm tust, was in deinen Augen gut ist.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Silber« kann hier auch »Geld« bedeuten. Die Worte des Königs können entweder heißen, dass Haman über das angebotene Geld verfügen darf, oder dass der König darauf verzichtet.
    reason: lexical_alternative_and_contextual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ לְהָמָן
  choice: Da sagte der König zu Haman
  rationale: Das Waw mit der Erzählform führt die Handlung fort; »Da« gibt die zeitliche Abfolge natürlich wieder. Der hebräische Titel wird als »der König« bewahrt.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: כֶּסֶף bezeichnet wörtlich »Silber« und kann erweitert »Geld« bedeuten. »Silber« wahrt hier die konkrete Ausdrucksweise des Hebräischen.
- source_word: נָתוּן לָךְ
  choice: sei dir überlassen
  rationale: Die passive Partizipialkonstruktion bezeichnet, dass etwas Haman zur Verfügung gestellt wird. Der deutsche Konjunktiv in der direkten Rede gibt die Verfügung des Königs idiomatisch wieder.
- source_word: וְהָעָם
  choice: ebenso das Volk
  rationale: Die Konjunktion verbindet das Volk als weiteren Gegenstand der königlichen Verfügung mit dem Silber; »ebenso« macht diese Zuordnung im Deutschen klar.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: damit du mit ihm tust
  rationale: Das singularische Pronomen בּוֹ bezieht sich grammatisch passend auf das kollektive Singularwort »Volk«. Die Zweckangabe wird mit »damit« natürlich wiedergegeben.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: was in deinen Augen gut ist
  rationale: Die deutsche Form bewahrt das hebräische Bild und lässt offen, ob es um Hamans Urteil oder Gefallen geht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die hebräische Bildsprache »in deinen Augen« und der kollektive Singular »Volk … mit ihm« bleiben erhalten; dadurch wird die genuine Mehrdeutigkeit nicht vorschnell aufgelöst.
