  text: וַ/יָּ֧סַר הַ/מֶּ֛לֶךְ אֶת טַבַּעְתּ֖/וֹ מֵ/עַ֣ל יָד֑/וֹ וַֽ/יִּתְּנָ֗/הּ לְ/הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י צֹרֵ֥ר הַ/יְּהוּדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: de
  text: Da zog der König seinen Siegelring von seiner Hand und gab ihn Haman, dem Sohn Hammedatas, dem Agagiter, dem Feind der Juden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“. Das hebräische Wort יְהוּדִים kann allgemein das jüdische Volk oder in manchen Zusammenhängen Menschen aus Juda beziehungsweise Judäa bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: zog … von …
  rationale: Das Verb bezeichnet das Entfernen oder Abnehmen. Zusammen mit „von seiner Hand“ gibt „zog … von seiner Hand“ die konkrete Handlung natürlich und quellennah wieder.
- source_word: טַבַּעְתּוֹ
  choice: seinen Siegelring
  rationale: Im höfischen Zusammenhang dient der Ring als amtliches Siegel und Vollmachtszeichen; „Siegelring“ macht diese Funktion verständlich.
- source_word: מֵעַל יָדוֹ
  choice: von seiner Hand
  rationale: Die Formulierung bewahrt das hebräische Bild und ist im Deutschen klar, ohne festzulegen, an welchem Finger der Ring getragen wurde.
- source_word: וַיִּתְּנָהּ
  choice: und gab ihn
  rationale: Das pronominale Suffix bezieht sich auf den Ring; „gab ihn“ ist schlicht und formal nah am Hebräischen.
- source_word: לְהָמָן
  choice: Haman
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶּן הַמְּדָתָא
  choice: dem Sohn Hammedatas
  rationale: Die patronymische Konstruktion wird wörtlich und in natürlichem Deutsch wiedergegeben.
- source_word: הָאֲגָגִי
  choice: dem Agagiter
  rationale: Die Herkunfts- oder Abstammungsbezeichnung wird bewahrt, ohne ihren möglichen Bezug zu Agag weiter auszudeuten.
- source_word: צֹרֵר
  choice: dem Feind
  rationale: Das substantivisch gebrauchte Partizip bezeichnet einen feindseligen Gegner; „Feind“ ist im Kontext natürlich und kraftvoll.
- source_word: הַיְּהוּדִים
  choice: der Juden
  rationale: Im Estherbuch bezeichnet der Ausdruck hier das als Volk verfolgte Kollektiv. „Juden“ entspricht dem Kontext und dem üblichen deutschen Sprachgebrauch; die mögliche Wiedergabe „Judäer“ wird in einer Fußnote offengehalten.
- source_word: וַ
  choice: Da
  rationale: Das einleitende Waw führt die Erzählung fort und markiert hier zugleich die Folge des vorausgehenden Geschehens; „Da“ klingt in modernem, würdigem Erzähldeutsch natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die höfische Funktion des Rings wird durch „Siegelring“ verdeutlicht; Herkunftsbezeichnungen und die mögliche Bedeutungsbreite von יְהוּדִים bleiben erhalten.
