  text: וַ/יְהִ֗י ב/אמר/ם אֵלָי/ו֙ י֣וֹם וָ/י֔וֹם וְ/לֹ֥א שָׁמַ֖ע אֲלֵי/הֶ֑ם וַ/יַּגִּ֣ידוּ לְ/הָמָ֗ן לִ/רְאוֹת֙ הֲ/יַֽעַמְדוּ֙ דִּבְרֵ֣י מָרְדֳּכַ֔י כִּֽי הִגִּ֥יד לָ/הֶ֖ם אֲשֶׁר ה֥וּא יְהוּדִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: de
  text: Als sie Tag für Tag auf ihn einredeten und er nicht auf sie hörte, sagten sie Haman davon. Sie wollten sehen, ob Mordechais Worte Bestand hätten[a], denn er hatte ihnen gesagt, dass er Jude war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ob Mordechais Worte stehen würden“. Gemeint sein kann, ob seine Begründung gelten oder ob seine Haltung unter Druck bestehen würde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: Als sie … auf ihn einredeten
  rationale: Die Konstruktion וַיְהִי mit ב plus Infinitiv leitet einen zeitlichen Nebensatz ein. אמר אל bezeichnet hier im Zusammenhang wiederholtes Zureden; „auf ihn einredeten“ gibt die beharrliche Aufforderung natürlich wieder.
- source_word: יוֹם וָיוֹם
  choice: Tag für Tag
  rationale: Die verdoppelte Zeitangabe bezeichnet eine täglich wiederkehrende, anhaltende Handlung.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: und er nicht auf sie hörte
  rationale: שׁמע אל bedeutet „auf jemanden hören“ und schließt hier das Nichtbefolgen ihres Zuredens ein.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: sagten sie Haman davon
  rationale: Das Hifil von נגד bedeutet „mitteilen, berichten“. „Davon sagen“ ist im Deutschen natürlich und lässt den im Hebräischen unausgesprochenen Gegenstand aus dem Zusammenhang hervorgehen.
- source_word: לִרְאוֹת
  choice: Sie wollten sehen
  rationale: Der Infinitiv bezeichnet den Zweck ihres Berichts. Ein eigener Satz vermeidet im Deutschen eine schwerfällige Satzkonstruktion und bewahrt den Sinn.
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: ob Mordechais Worte Bestand hätten
  rationale: Die wörtliche Metapher, dass Worte „stehen“, bezeichnet hier, ob Mordechais Aussage, Begründung oder Haltung sich als tragfähig erweisen würde. „Bestand hätten“ bewahrt diese Offenheit.
- source_word: כִּי הִגִּיד לָהֶם
  choice: denn er hatte ihnen gesagt
  rationale: כִּי begründet, weshalb sie Haman berichteten. Das Plusquamperfekt verdeutlicht, dass Mordechais Mitteilung vorausging.
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: dass er Jude war
  rationale: יְהוּדִי ist eine ethnisch-religiöse Identitätsbezeichnung; die substantivische Wiedergabe entspricht der hebräischen Prädikatskonstruktion.
theological_decisions:
- issue: Bezug von „Mordechais Worten“
  choice: Die bildhafte und mehrdeutige Formulierung „Bestand hätten“ bleibt im Haupttext erhalten.
  alternative: Die Wendung ausdrücklich als Mordechais Begründung für seine Weigerung oder als sein Durchhalten unter Druck deuten.
  rationale: Der hebräische Text legt nicht eindeutig fest, ob seine erklärte Begründung anerkannt werden würde oder ob seine Haltung dauerhaft bestehen könnte; diese Spannung soll nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die logische Zweckbeziehung zu verändern. „Tag für Tag“ und „Bestand hätten“ bewahren die Eindringlichkeit und Bildhaftigkeit des Hebräischen.
