base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: de
  text: Im ersten Monat – das heißt, im Monat Nisan –, im zwölften Jahr des Königs Ahasveros, warf man vor Haman das Pur – das heißt das Los – aus, von Tag zu Tag und von Monat zu Monat, bis zum zwölften Monat, dem Monat Adar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von Tag zu Tag und von Monat zu Monat, zwölf, das heißt der Monat Adar“. Gemeint ist wahrscheinlich, dass das Losen sich in der Abfolge der Tage und Monate bis zum zwölften Monat erstreckte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Im ersten Monat
  rationale: Die Präposition בְּ bezeichnet hier den Zeitpunkt; die Wendung gibt den kalendarischen Rahmen natürlich und genau wieder.
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: das ist der Monat Nisan
  rationale: Das Pronomen mit der Apposition erläutert, welcher Monatsname gemeint ist.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: im zwölften Jahr des Königs Ahasveros
  rationale: Diese Formulierung entspricht der hebräischen Regierungsjahr-Datierung und klingt im Deutschen natürlich.
- source_word: הִפִּיל פּוּר
  choice: warf man ... das Pur ... aus
  rationale: Die unpersönliche Konstruktion mit „man“ vermeidet einen im Hebräischen nicht genannten Handelnden; „das Los auswerfen“ gibt das Idiom der Losentscheidung wieder.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: 'das Pur – das heißt: das Los'
  rationale: Der persische Ausdruck wird wie im Ausgangstext bewahrt und unmittelbar durch das geläufige hebräische Wort erklärt; zugleich bleibt die Verbindung zum späteren Namen Purim sichtbar.
- source_word: לִפְנֵי הָמָן
  choice: vor Haman
  rationale: Die knappe Formulierung kann sowohl räumlich als auch im Sinn von „in Hamans Gegenwart“ verstanden werden und bewahrt damit die Aussagebreite.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: von Tag zu Tag und von Monat zu Monat
  rationale: Die parallele Struktur des Hebräischen und die fortschreitende Prüfung möglicher Termine werden bewahrt.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: bis zum zwölften Monat, dem Monat Adar
  rationale: „Bis zum“ macht den im Kontext naheliegenden Zielpunkt der Abfolge verständlich; die Apposition benennt den zwölften Monat.
