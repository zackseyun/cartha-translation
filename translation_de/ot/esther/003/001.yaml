  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה גִּדַּל֩ הַ/מֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י וַֽ/יְנַשְּׂאֵ֑/הוּ וַ/יָּ֨שֶׂם֙ אֶת כִּסְא֔/וֹ מֵ/עַ֕ל כָּל הַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: de
  text: Nach diesen Ereignissen[a] erhob König Ahasveros Haman, den Sohn Hammedatas, den Agagiter[b], zeichnete ihn besonders aus und setzte seinen Thron über alle Beamten, die bei dem König waren.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Nach diesen Dingen.«'
    reason: lexical_alternative
  - marker: b
    text: »Agagiter« gibt die hebräische Bezeichnung wieder. Sie kann auf eine Abstammung oder eine andere Verbindung mit Agag hinweisen.
    reason: cultural_note
  - marker: c
    text: 'Oder: »setzte seinen Sitz über alle Beamten, die bei ihm waren«. »Thron« kann hier den Sitz bzw. die Stellung der Autorität bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die zeitliche Erzählformel wird in natürlichem Deutsch wiedergegeben; »Dingen« bleibt als formnähere Alternative in der Fußnote erhalten.
- source_word: גִּדַּל
  choice: erhob
  rationale: Im höfischen Zusammenhang bezeichnet das Verb die Beförderung zu höherem Rang. »Erhob« ist würdevoll, verständlich und lässt die anschließende zusätzliche Auszeichnung sprachlich bestehen.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: König Ahasveros
  rationale: Die im Deutschen übliche Titelfolge wird verwendet; die traditionelle deutsche Namensform bleibt erhalten.
- source_word: הָמָן בֶּן הַמְּדָתָא
  choice: Haman, den Sohn Hammedatas
  rationale: Name und Patronym werden ausdrücklich und in natürlicher deutscher Form wiedergegeben.
- source_word: הָאֲגָגִי
  choice: den Agagiter
  rationale: Die hebräische Herkunfts- oder Gruppenzuweisung wird bewahrt, ohne ihre geschichtliche Bedeutung im Haupttext festzulegen.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: Er zeichnete ihn aus
  rationale: Das Verb verstärkt die Erhöhung Hamans. Die Formulierung vermeidet im Deutschen eine schwerfällige Wiederholung von »erheben« und bewahrt den Gedanken besonderer Ehre.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ מֵעַל כָּל הַשָּׂרִים
  choice: wies ihm einen Rang über allen führenden Beamten ... zu
  rationale: »Thron/Sitz über« ist ein Bild für amtlichen Vorrang. Die Wiedergabe macht diesen Sinn für heutige Leser klar; die formnähere Lesart steht in der Fußnote.
- source_word: אֲשֶׁר אִתּוֹ
  choice: in seinem Dienst
  rationale: Das Pronomen bezieht sich im Kontext am ehesten auf den König und bezeichnet die ihm zugeordneten Amtsträger. Die Übersetzung macht den höfischen Bezug verständlich.
theological_decisions:
- issue: Bedeutung der Bezeichnung הָאֲגָגִי
  choice: Agagiter
  alternative: Nachkomme Agags / Angehöriger einer mit Agag verbundenen Gruppe
  rationale: Der Text bezeichnet Haman als Agagiter, legt aber die genaue genealogische oder politische Beziehung zu Agag nicht ausdrücklich fest. Diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der höfische Rangaufstieg wird idiomatisch ausgedrückt; die Bildsprache des hebräischen Wortlauts und die mögliche Mehrdeutigkeit von »Agagiter« bleiben durch Fußnoten zugänglich.
