source:
  edition: WLC
  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: de
  text: 'Da wurden im ersten Monat, am dreizehnten Tag dieses Monats, die Schreiber des Königs einberufen, und es wurde alles so geschrieben, wie Haman es befohlen hatte: an die Satrapen des Königs, an die Statthalter über die einzelnen Provinzen und an die Obersten der einzelnen Völker – an jede Provinz in ihrer eigenen Schrift[a] und an jedes Volk in seiner eigenen Sprache. Im Namen des Königs Ahasveros wurde es geschrieben und mit dem Siegelring des Königs versiegelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Schrift“ ist hier das jeweils verwendete Schriftsystem gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ
  choice: wurden … gerufen
  rationale: Die passive Form bezeichnet die Einberufung der königlichen Schreiber; „gerufen“ ist natürlich und bleibt nah am Hebräischen.
- source_word: סֹפְרֵי הַמֶּלֶךְ
  choice: die Schreiber des Königs
  rationale: Im höfischen Zusammenhang sind amtliche Schreiber gemeint. Die transparente Wiedergabe vermeidet die stärker deutende Bezeichnung „Sekretäre“.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: am dreizehnten Tag dieses Monats
  rationale: Das Pronomen bezieht sich auf den ersten Monat; die ausdrückliche Wiederaufnahme ist im Deutschen klarer als „am dreizehnten Tag darin“.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: Alles, was Haman befohlen hatte, wurde niedergeschrieben
  rationale: Die Formulierung erhält das Passiv und gibt כְּכָל als vollständige Übereinstimmung mit Hamans Anweisung wieder, ohne einen im Hebräischen unausgesprochenen Gegenstand wie „Erlass“ einzuführen.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: die Satrapen des Königs
  rationale: „Satrapen“ ist die etablierte und präzise Bezeichnung für das persische Verwaltungsamt.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: die Statthalter über die einzelnen Provinzen
  rationale: Die distributive Wiederholung wird idiomatisch mit „die einzelnen“ ausgedrückt; „Statthalter“ unterscheidet das Amt von den Satrapen.
- source_word: שָׂרֵי עַם וָעָם
  choice: die Obersten der einzelnen Völker
  rationale: שָׂרִים kann Amtsträger, Führende oder Fürsten bezeichnen. „Oberste“ bewahrt den Rangbegriff, ohne eine spezifisch monarchische Stellung festzulegen.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: jede Provinz in ihrer eigenen Schrift
  rationale: כְּתָב bezeichnet hier im mehrsprachigen Reich die jeweilige Schrift beziehungsweise das Schriftsystem.
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: jedes Volk in seiner eigenen Sprache
  rationale: Die distributive Form und die Bedeutung von לָשׁוֹן als Sprache werden in natürlichem Deutsch wiedergegeben.
- source_word: נֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: mit dem Siegelring des Königs versiegelt
  rationale: Die Wendung bezeichnet die amtliche Beglaubigung mit dem königlichen Siegelring.
