  source_fidelity: Die Übersetzung gibt die temporale Einleitung, die fortdauernd verneinten Partizipien sowie die Unterscheidung der beiden Gesten zuverlässig wieder. »sich verbeugen« für כֹּרֵעַ und »sich niederwerfen« für מִשְׁתַּחֲוֶה bewahren den unterschiedlichen körperlichen Nachdruck. »vor ihm« ist für לוֹ im Kontext der Ehrerbietung idiomatisch und sachgerecht. »von Zorn erfüllt« bildet das hebräische Erfülltwerden mit חֵמָה angemessen ab.
