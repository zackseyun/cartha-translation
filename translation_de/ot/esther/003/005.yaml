  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣רְא הָמָ֔ן כִּי אֵ֣ין מָרְדֳּכַ֔י כֹּרֵ֥עַ וּ/מִֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יִּמָּלֵ֥א הָמָ֖ן חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: de
  text: Als Haman sah, dass Mordechai sich vor ihm weder verbeugte noch niederwarf[a], wurde Haman von Zorn erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich weder verbeugte noch ihm seine Ehrerbietung erwies«. Im Hebräischen stehen zwei verwandte, aber unterschiedliche Verben für körperliche Akte der Ehrerbietung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als Haman sah
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; im Zusammenhang gibt die temporale Wiedergabe mit »als« den natürlichen deutschen Erzählfluss wieder.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: dass Mordechai sich ... weder ... noch ...
  rationale: אֵין mit den Partizipien bezeichnet Mordechais fortdauerndes Unterlassen. Die deutsche weder-noch-Konstruktion gibt die Verneinung beider Handlungen idiomatisch wieder.
- source_word: כֹּרֵעַ
  choice: sich verbeugte
  rationale: כרע bezeichnet das Beugen beziehungsweise Niederbeugen, auch der Knie. »Sich verbeugen« passt zum höfischen Kontext, ohne ausdrücklich ein Knien festzulegen.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: noch niederwarf
  rationale: השתחוה bezeichnet häufig das Sich-Niederwerfen als körperlichen Akt der Ehrerbietung. »Sich niederwerfen« bewahrt gegenüber »sich verbeugen« die stärkere körperliche Bedeutung.
- source_word: לוֹ
  choice: vor ihm
  rationale: Wörtlich steht »ihm/zu ihm«; bei körperlichen Ehrbezeugungen ist »vor ihm« im Deutschen natürlich und gibt die Ausrichtung der Handlung treffend wieder.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: wurde Haman von Zorn erfüllt
  rationale: Die Formulierung bewahrt das hebräische Bild des Erfülltwerdens und klingt zugleich würdig und verständlich.
- source_word: חֵמָה
  choice: Zorn
  rationale: חֵמָה bezeichnet hier heftigen, aufwallenden Ärger. »Zorn« ist im Deutschen prägnant und verlangt keine speziell göttliche Konnotation.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden hebräischen Verben werden durch »sich verbeugen« und »sich niederwerfen« körperlich und unterscheidbar wiedergegeben; die Fußnote nennt die funktionale Alternative »Ehrerbietung erweisen«.
