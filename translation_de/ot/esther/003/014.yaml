source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָֽ/עַמִּ֑ים לִ/הְי֥וֹת עֲתִדִ֖ים לַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: de
  text: Eine Abschrift des Schriftstücks sollte in jeder einzelnen Provinz[a] als Gesetz erlassen und allen Völkern bekannt gemacht werden, damit sie für diesen Tag[b] bereit wären.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in jeder Provinz und Provinz«; die Wiederholung betont, dass ausnahmslos jede Provinz gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für jenen Tag«, also für den im Erlass festgesetzten Tag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: Abschrift
  rationale: Das persische Lehnwort bezeichnet die Abschrift beziehungsweise Wiedergabe eines amtlichen Schriftstücks.
- source_word: הַכְּתָב
  choice: des Schriftstücks
  rationale: Die Grundbedeutung ist »das Geschriebene/Schriftstück«; der amtliche Zusammenhang wird durch »als Gesetz erlassen« hinreichend deutlich.
- source_word: לְהִנָּתֵן דָּת
  choice: sollte … als Gesetz erlassen werden
  rationale: Die passive Infinitivkonstruktion bezeichnet die amtliche Inkraftsetzung; »als Gesetz erlassen« gibt sowohl den Vorgang als auch die bindende Rechtskraft wieder.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: in jeder einzelnen Provinz
  rationale: Die distributive Wiederholung von »Provinz« wird in natürlichem Deutsch durch »jeder einzelnen« nachgebildet.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: allen Völkern bekannt gemacht
  rationale: גָּלוּי bezeichnet hier die öffentliche Bekanntmachung; »Völker« bewahrt den Bezug auf die verschiedenen Volksgruppen im Reich.
- source_word: לִהְיוֹת עֲתִדִים
  choice: damit sie … bereit wären
  rationale: Die Konstruktion drückt den Zweck der Bekanntmachung aus.
- source_word: לַיּוֹם הַזֶּה
  choice: für diesen Tag
  rationale: Dies entspricht formal dem hebräischen Demonstrativ; kontextuell ist der im Erlass festgesetzte Tag gemeint.
