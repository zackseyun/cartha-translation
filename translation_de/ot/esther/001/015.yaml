source:
  edition: WLC
  text: כְּ/דָת֙ מַֽה לַּ/עֲשׂ֔וֹת בַּ/מַּלְכָּ֖ה וַשְׁתִּ֑י עַ֣ל אֲשֶׁ֣ר לֹֽא עָשְׂתָ֗ה אֶֽת מַאֲמַר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ בְּ/יַ֖ד הַ/סָּרִיסִֽים־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: de
  text: „Was ist nach dem Gesetz mit Königin Waschti zu tun, weil sie den Befehl des Königs Ahasveros, der ihr durch die Eunuchen[a][b] übermittelt wurde, nicht ausgeführt hat[c]?“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand der Eunuchen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch allgemeiner Hofbeamte bezeichnen; „Eunuchen“ ist die direktere Wiedergabe.
    reason: cultural_note
  - marker: c
    text: 'Oder: „weil sie dem Befehl des Königs Ahasveros nicht gehorcht hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  choice: nach dem Gesetz
  rationale: דָּת bezeichnet im persischen Hofkontext des Esterbuches gewöhnlich ein Gesetz oder eine rechtskräftige Verordnung. „Nach dem Gesetz“ bewahrt den förmlich-rechtlichen Rahmen.
- source_word: מַה לַּעֲשׂוֹת
  choice: Was ist … zu tun
  rationale: Die Infinitivkonstruktion formuliert eine beratende Frage nach der gebotenen Maßnahme; die deutsche Wendung erhält den unpersönlichen Rechtston.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: mit Königin Waschti
  rationale: Die Präposition mit עשה bezeichnet hier das Vorgehen in Bezug auf eine Person. „Mit … zu tun“ ist im Deutschen natürlich und legt nicht unnötig eine feindselige Maßnahme fest.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: weil sie … nicht ausgeführt hat
  rationale: עַל אֲשֶׁר nennt den Grund; עשה bedeutet wörtlich „tun/ausführen“. Die Formulierung passt zu einem Befehl, ohne ausdrücklich das stärker deutende Verb „gehorchen“ in den Haupttext einzutragen.
- source_word: מַאֲמַר
  choice: Befehl
  rationale: מַאֲמַר kann Wort, Ausspruch oder Anordnung bedeuten; im königlichen Kontext gibt „Befehl“ die verbindliche Autorität angemessen wieder.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: König Ahasveros
  rationale: Der Titel wird übersetzt und der Eigenname in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בְּיַד הַסָּרִיסִים
  choice: durch die Eunuchen übermittelt
  rationale: Wörtlich steht „durch die Hand der Eunuchen“, eine Wendung für Vermittlung oder Beauftragung. Die Übersetzung gibt diese Funktion in natürlichem Deutsch wieder und bewahrt סָרִיסִים direkt als „Eunuchen“.
