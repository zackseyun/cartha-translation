  text: וְ/הַשְׁקוֹת֙ בִּ/כְלֵ֣י זָהָ֔ב וְ/כֵלִ֖ים מִ/כֵּלִ֣ים שׁוֹנִ֑ים וְ/יֵ֥ין מַלְכ֛וּת רָ֖ב כְּ/יַ֥ד הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: de
  text: Die Getränke wurden in goldenen Gefäßen gereicht, wobei ein Gefäß anders war als das andere. Königlichen Wein gab es in Fülle, entsprechend der Freigebigkeit des Königs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: Die Getränke wurden … gereicht
  rationale: Die Infinitivkonstruktion bezeichnet hier das Ausschenken beziehungsweise Darreichen von Getränken; die unpersönliche Passivform gibt den erzählenden Sinn im Deutschen natürlich wieder.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: wobei ein Gefäß anders war als das andere
  rationale: Die ungewöhnliche distributive Wendung wird verständlich wiedergegeben und bewahrt die Aussage, dass die Gefäße nicht einheitlich gestaltet waren.
- source_word: וְיֵין מַלְכוּת רָב
  choice: Königlichen Wein gab es in Fülle
  rationale: מַלְכוּת kennzeichnet den Wein als königlich beziehungsweise zum Königshof gehörig; רָב bezeichnet die große Menge.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: entsprechend der Freigebigkeit des Königs
  rationale: Die wörtliche Wendung ‚gemäß der Hand des Königs‘ ist ein Idiom für die Mittel, Großzügigkeit oder Freigebigkeit des Königs; die gewählte Formulierung trifft den Sinn im Kontext des Festmahls.
theological_decisions: []
