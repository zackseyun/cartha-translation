base_translation:
  language: en
  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: de
  text: 'Da sagte der König zu den Weisen, die die Zeiten kannten – denn so war das Vorgehen des Königs vor allen, die Gesetz und Recht kannten –:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: die sich auf die Zeiten verstanden
  rationale: Die Wendung bezeichnet Sachkundige, die mit den Zeitumständen beziehungsweise den dafür maßgeblichen Gepflogenheiten vertraut waren. Die Übersetzung bewahrt die offene Bedeutung von עִתִּים, ohne vorschnell Astrologie oder bloße Terminplanung anzunehmen.
- source_word: דְּבַר הַמֶּלֶךְ
  choice: die Angelegenheit des Königs
  rationale: דָּבָר kann Wort, Sache oder Angelegenheit bedeuten. Im vorliegenden Beratungskontext ist „Angelegenheit“ natürlich und lässt offen, ob vor allem die königliche Anfrage oder der zu verhandelnde Fall gemeint ist.
- source_word: דָּת וָדִין
  choice: Gesetz und Recht
  rationale: דָּת bezeichnet hier das geltende Gesetz beziehungsweise die Rechtsordnung; דִּין bezeichnet Recht, Rechtsentscheidung oder gerichtliches Urteil. „Gesetz und Recht“ gibt die Paarung knapp und würdig wieder.
- source_word: לִפְנֵי
  choice: vorgelegt
  rationale: Wörtlich „vor“. Zusammen mit דְּבַר bezeichnet die Formulierung, dass königliche Angelegenheiten vor sachkundige Berater gebracht wurden. Das Verb macht die im Hebräischen elliptische Verfahrensweise im Deutschen verständlich.
