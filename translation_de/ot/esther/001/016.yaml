  text: וַ/יֹּ֣אמֶר מומכן לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/הַ/שָּׂרִ֔ים לֹ֤א עַל הַ/מֶּ֨לֶךְ֙ לְ/בַדּ֔/וֹ עָוְתָ֖ה וַשְׁתִּ֣י הַ/מַּלְכָּ֑ה כִּ֤י עַל כָּל הַ/שָּׂרִים֙ וְ/עַל כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֕ר בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: de
  text: 'Da sagte Memuchan vor dem König und den hohen Beamten: „Königin Waschti hat nicht nur am König Unrecht getan, sondern auch an allen hohen Beamten und allen Völkern, die in allen Provinzen des Königs Ahasveros sind.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: מומכן
  choice: Memuchan
  rationale: Der Personenname wird in einer im Deutschen geläufigen, quellennahen Form wiedergegeben.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier das Reden in Gegenwart des Königs und der Würdenträger; „vor“ ist knapp und idiomatisch.
- source_word: הַשָּׂרִים
  choice: die hohen Beamten
  rationale: שׂרים bezeichnet ranghohe Amtsträger am persischen Hof. „Hohe Beamte“ ist modern und verständlich, ohne den irreführenden erblichen Titel „Fürsten“ vorauszusetzen.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ ... כִּי עַל
  choice: nicht nur am König ... sondern an
  rationale: 'Die deutsche Korrelativkonstruktion bildet die hebräische Erweiterung der Verneinung natürlich ab: nicht allein gegen den König, sondern auch gegen die übrigen Genannten.'
- source_word: עָוְתָה
  choice: hat ... Unrecht getan
  rationale: Das Verb bezeichnet verkehrtes oder schuldhaftes Handeln. „Unrecht tun“ bewahrt die moralische Wertung, ohne die Art des Vergehens enger festzulegen.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Königin Waschti
  rationale: Im Deutschen steht der Titel gewöhnlich vor dem Namen; „Waschti“ entspricht der etablierten deutschen Namensform.
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: an allen hohen Beamten und an allen Völkern
  rationale: Die Wiederholung von „an“ wahrt den Parallelismus. „Völker“ erhält den Plural und passt zum Vielvölkerreich.
- source_word: אֲשֶׁר בְּכָל מְדִינוֹת
  choice: in sämtlichen Provinzen
  rationale: Die knappe deutsche Fügung gibt die reichsweite Verteilung wieder; der Bezug auf Amtsträger und Völker bleibt aus dem Zusammenhang erkennbar.
- source_word: מְדִינוֹת
  choice: Provinzen
  rationale: „Provinzen“ ist die übliche Bezeichnung für die Verwaltungsgebiete des persischen Reiches im Esterbuch.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Verwendet wird die im Deutschen traditionsreiche und quellennah transliterierte Namensform.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Rede bleibt als Behauptung Memuchans erkennbar und wird nicht als Urteil des Erzählers dargestellt. Keine Fußnote ist nötig, da die mögliche alternative Wortstellung des englischen Beratungstextes im Deutschen keinen Bedeutungsunterschied erzeugt.
