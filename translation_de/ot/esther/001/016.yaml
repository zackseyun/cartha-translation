    issue: Der Geltungsbereich von „in sämtlichen Provinzen des Königs Ahasveros“ ist im Deutschen nicht ganz eindeutig.
    rationale: אֲשֶׁר בְּכָל מְדִינוֹת bezieht sich auf beide vorangehenden Gruppen, die hohen Amtsträger und die Völker. Ein Relativsatz nach beiden Substantivgruppen bildet dies eindeutiger ab.
