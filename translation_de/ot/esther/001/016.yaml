review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Sinn des hebräischen Satzes insgesamt zutreffend wieder: Memuchan spricht in Gegenwart des Königs und der hohen Amtsträger, und Waschti wird ein Unrecht zugeschrieben, das nach seiner Darstellung über den König hinaus auch Amtsträger und Völker im gesamten Reich betrifft. Die Korrelativform „nicht nur … sondern auch“ gibt die durch לֹא … לְבַדּוֹ und כִּי eingeleitete Erweiterung klar wieder.'
  naturalness: 'Der Stil ist modern, würdevoll und gut lesbar. Eine geringfügige Umstellung macht den Bezug der Ortsangabe eindeutiger: In der vorliegenden Fassung kann „in sämtlichen Provinzen“ unmittelbar nur die „Völker“ näher bestimmen, während der hebräische Relativsatz sowohl die hohen Amtsträger als auch die Völker umfasst.'
  terminology: „Memuchan“, „Königin Waschti“, „Ahasveros“, „hohe Beamte“, „Völker“ und „Provinzen“ sind angemessen. „Unrecht getan“ bewahrt die moralische Wertung von עָוְתָה, ohne die nicht näher bezeichnete Verfehlung zu konkretisieren.
  issues:
