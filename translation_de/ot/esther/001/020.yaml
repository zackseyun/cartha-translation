  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: de
  text: Und wenn der Erlass, den der König verkündet, in seinem ganzen Reich bekannt wird – denn es ist groß –, werden alle Frauen ihren Männern Ehre erweisen[a], vom Großen bis zum Kleinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Männern Respekt erweisen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: Und wenn ... bekannt wird
  rationale: Das Nifal von שׁמע ist passiv und lässt sich hier als zeitliche Voraussetzung für die folgende Wirkung verstehen. „Bekannt wird“ gibt die reichsweite Verbreitung im Deutschen natürlich wieder.
- source_word: פִּתְגָם הַמֶּלֶךְ אֲשֶׁר יַעֲשֶׂה
  choice: der Erlass, den der König verkündet
  rationale: פִּתְגָם bezeichnet im persischen Hofkontext einen amtlichen Ausspruch oder Erlass. Bei einem Erlass gibt „verkündet“ die Verbindung mit עשה idiomatischer wieder als das wörtliche „macht“.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: in seinem ganzen Reich
  rationale: Die Formulierung bezeichnet die gesamte Ausdehnung des königlichen Herrschaftsgebiets und ist in modernem Deutsch klar und knapp.
- source_word: כִּי רַבָּה הִיא
  choice: denn es ist groß
  rationale: רַבָּה beschreibt hier wahrscheinlich die gewaltige Ausdehnung des Reiches. „Groß“ bewahrt die breite Bedeutung des Hebräischen, ohne sie unnötig auf „weitläufig“ festzulegen.
- source_word: וְכָל הַנָּשִׁים
  choice: alle Frauen
  rationale: Die Übersetzung wahrt den generischen Plural; der anschließende Bezug auf ihre Männer zeigt, dass verheiratete Frauen gemeint sind.
- source_word: יִתְּנוּ יְקָר
  choice: werden ... Ehre erweisen
  rationale: Die Wendung bedeutet wörtlich, Ehre oder Wertschätzung zu geben. „Ehre erweisen“ ist im Deutschen würdig und verständlich und bleibt näher am Bild als lediglich „respektieren“.
- source_word: לְבַעְלֵיהֶן
  choice: ihren Männern
  rationale: בעל kann Herr oder Besitzer bedeuten, bezeichnet in diesem häuslichen Zusammenhang jedoch die Ehemänner. „Ihren Männern“ ist natürlich und vermeidet eine sachlich unpassende Verschärfung.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: vom Höchsten bis zum Geringsten
  rationale: Die idiomatische Wendung umfasst sämtliche gesellschaftlichen Ränge. Durch den maskulinen Singular wird im Deutschen klar, dass sie sich auf die Männer bezieht.
