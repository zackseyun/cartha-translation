base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: de
  text: Dann sandte er Schreiben an alle Provinzen des Königs, an jede Provinz in ihrer eigenen Schrift und an jedes Volk in seiner eigenen Sprache,[a] dass jeder Mann Herr in seinem eigenen Haus sei[b] und die Sprache seines Volkes spreche.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an jede Provinz gemäß ihrer Schrift und an jedes Volk gemäß seiner Sprache“. Der Erlass wurde somit in den jeweils gebräuchlichen Schriften und Sprachen verbreitet.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „dass jeder Ehemann in seinem Haus herrsche“. Im Hebräischen steht „jeder Mann“; im Zusammenhang geht es um die Stellung des Mannes in Ehe und Haushalt.'
    reason: lexical_alternative
  - marker: c
    text: Die Schlussklausel kann bedeuten, dass jeder Mann die Sprache seines eigenen Volkes sprechen sollte. Möglicherweise besagt sie weitergehend, dass im Haushalt die sprachliche Identität des Mannes maßgebend sein sollte.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Dann sandte er
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Dann“ gibt diesen narrativen Fortgang im Deutschen natürlich wieder.
- source_word: סְפָרִים
  choice: Schreiben
  rationale: Im königlich-administrativen Zusammenhang sind offizielle schriftliche Mitteilungen gemeint. „Schreiben“ ist würdig und weiter als „Briefe“.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: alle Provinzen des Königs
  rationale: Die Konstruktion bezeichnet die Provinzen des königlichen Herrschaftsgebiets und wird eng am Hebräischen wiedergegeben.
- source_word: אֶל מְדִינָה וּמְדִינָה
  choice: in jede Provinz
  rationale: 'Die Wiederholung des Singulars hat distributive Bedeutung: jede einzelne Provinz.'
- source_word: כִּכְתָבָהּ
  choice: in ihrer eigenen Schrift
  rationale: Gemeint ist die jeweils gebräuchliche Schrift beziehungsweise Schreibweise einer Provinz.
- source_word: וְאֶל עַם וָעָם
  choice: und an jedes Volk
  rationale: Die distributive Wiederholung wird mit „jedes Volk“ knapp und natürlich ausgedrückt.
- source_word: כִּלְשׁוֹנוֹ
  choice: in seiner eigenen Sprache
  rationale: לָשׁוֹן bezeichnet hier im mehrsprachigen Verwaltungskontext eindeutig die Sprache eines Volkes.
- source_word: לִהְיוֹת כָּל אִישׁ שֹׂרֵר
  choice: damit jeder Mann Herr ... sei
  rationale: Der Infinitiv bezeichnet Zweck oder Inhalt des Erlasses; שֹׂרֵר drückt Herrschaft beziehungsweise maßgebliche Stellung aus.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Die Formulierung bewahrt den häuslichen Bereich des hebräischen Ausdrucks; „Haus“ kann dabei auch den Haushalt bezeichnen.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: und die Sprache seines Volkes spreche
  rationale: Die grammatisch knappe Schlussklausel wird entsprechend ihrer naheliegenden sprachlichen Bedeutung wiedergegeben, ohne ihre mögliche weitergehende soziale Aussage im Haupttext festzulegen.
theological_decisions:
- issue: Bedeutung von כָּל אִישׁ im Zusammenhang des Erlasses
  choice: jeder Mann
  alternative: jeder Ehemann
  rationale: Der hebräische Ausdruck lautet allgemein „jeder Mann“, während der Kontext besonders die Autorität des Mannes in Ehe und Haushalt betrifft. Die Übersetzung bewahrt die Formulierung des Ausgangstextes; die kontextuelle Alternative wird in einer Fußnote genannt.
- issue: Deutung der Schlussklausel וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: und die Sprache seines Volkes spreche
  alternative: und in der Sprache seines Volkes bestimme / der Haushalt solle sich nach seiner sprachlichen Identität richten
  rationale: Der unmittelbare Wortsinn betrifft das Sprechen der Sprache des eigenen Volkes. Da die knappe Klausel möglicherweise eine umfassendere häusliche Vorrangstellung ausdrückt, wird diese Spannung nicht im Haupttext aufgelöst, sondern in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Schreiben“ und „Herr“ passen zum königlich-rechtlichen Kontext, ohne unnötig altertümlich zu wirken. Die Syntax bleibt nahe am hebräischen Aufbau, wird aber für flüssiges Deutsch geordnet.
