  text: וּ/בִ/מְל֣וֹאת הַ/יָּמִ֣ים הָ/אֵ֗לֶּה עָשָׂ֣ה הַ/מֶּ֡לֶךְ לְ/כָל הָ/עָ֣ם הַ/נִּמְצְאִים֩ בְּ/שׁוּשַׁ֨ן הַ/בִּירָ֜ה לְ/מִ/גָּ֧דוֹל וְ/עַד קָטָ֛ן מִשְׁתֶּ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/חֲצַ֕ר גִּנַּ֥ת בִּיתַ֖ן הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: de
  text: Als diese Tage vorüber waren, veranstaltete der König für alle Menschen, die sich in der Burg Susa befanden, vom Großen bis zum Kleinen[a], ein siebentägiges Festmahl[b] im Hof des Gartens des königlichen Palasts[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Großen bis zum Kleinen“; gemeint sind Menschen jeden Ranges.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet ein Fest oder Gelage, bei dem das Trinken eine wichtige Rolle spielen kann.
    reason: lexical_alternative
  - marker: c
    text: Das letzte Wort kann auch „Pavillon“ oder „Haus“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: Als diese Tage vorüber waren
  rationale: Die Präposition ב mit dem Infinitiv von מלא bezeichnet den Zeitpunkt, an dem die zuvor genannten Tage vollendet waren. Die Formulierung ist natürliches Deutsch und bewahrt den Rückbezug.
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: veranstaltete ... ein Festmahl
  rationale: עשה bedeutet hier in Verbindung mit משתה idiomatisch, ein Festmahl auszurichten. „Veranstaltete“ gibt dies in modernem Deutsch treffend wieder.
- source_word: מִשְׁתֶּה
  choice: Festmahl
  rationale: Das Wort bezeichnet ein Fest beziehungsweise Gelage, häufig mit besonderem Gewicht auf dem Trinken. „Festmahl“ passt zum königlichen Rahmen, ohne den Trinkaspekt einseitig hervorzuheben.
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: für das ganze Volk, das sich ... befand
  rationale: עם bezeichnet hier umfassend die anwesende Bevölkerung; das Nifal-Partizip von מצא bedeutet in diesem Zusammenhang „anwesend sein“ oder „sich befinden“.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: in der Residenz Susa
  rationale: בירה bezeichnet die befestigte königliche Anlage beziehungsweise Residenzstadt. „Residenz Susa“ ist im Deutschen verständlich und wahrt die mögliche Bezugnahme auf den königlichen beziehungsweise befestigten Bezirk.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: vom Vornehmsten bis zum Geringsten
  rationale: Die feste Wendung schließt Menschen aller gesellschaftlichen Ränge ein. Die deutsche Formulierung gibt den sozialen Sinn klar wieder.
- source_word: שִׁבְעַת יָמִים
  choice: ein siebentägiges
  rationale: Die Dauerangabe wird im Deutschen knapp und natürlich als Adjektiv wiedergegeben.
- source_word: בַּחֲצַר גִּנַּת
  choice: im Hof des Gartens
  rationale: Die hebräische Constructus-Verbindung beschreibt einen Hof, der zum Garten gehört; die räumliche Zuordnung bleibt erhalten.
- source_word: בִּיתַן הַמֶּלֶךְ
  choice: am königlichen Palast
  rationale: ביתן ist ein persisches Lehnwort mit unsicherer genauer Bedeutung, etwa Haus, Palast oder Pavillon. „Palast“ passt zum königlichen Kontext; die Fußnote bewahrt die lexikalische Offenheit.
