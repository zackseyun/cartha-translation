base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: de
  text: Am siebten Tag, als das Herz des Königs vom Wein beschwingt war,[a] sagte er zu Mehuman, Biseta, Harbona, Bigta, Abagta, Setar und Karkas, den sieben Eunuchen,[b] die vor König Ahasveros dienten —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „als das Herz des Königs durch den Wein gut war“. Gemeint ist eine vom Wein hervorgerufene heitere Stimmung; ausdrücklich von Trunkenheit spricht der hebräische Text nicht.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann in manchen Zusammenhängen auch allgemein königliche Hofbeamte bezeichnen; hier ist seine direktere Bedeutung „Eunuchen“ beibehalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Die Zeitangabe wird natürlich und ohne den im Vers nicht ausdrücklich genannten Zusatz „des Festes“ wiedergegeben.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: als das Herz des Königs vom Wein beschwingt war
  rationale: Die Formulierung bewahrt das hebräische Herz-Motiv und bezeichnet die durch Wein hervorgerufene heitere Stimmung, ohne Trunkenheit ausdrücklich zu behaupten.
- source_word: אָמַר לִ
  choice: sagte er zu
  rationale: Das gewöhnliche Verb „sagen“ wird formal nah wiedergegeben; der Inhalt der Äußerung folgt erst im nächsten Vers.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: zu Mehuman, Biseta, Harbona, Bigta, Abagta, Setar und Karkas
  rationale: Die Personennamen werden in lesbaren, dem Hebräischen angenäherten deutschen Transliterationen wiedergegeben.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: den sieben Eunuchen
  rationale: „Eunuchen“ gibt den direkten lexikalischen Sinn von סָרִיס wieder; die mögliche weitere Bedeutung „Hofbeamte“ wird in einer Fußnote genannt.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: die im persönlichen Dienst ... standen
  rationale: Die Wendung bezeichnet den unmittelbaren Dienst in der Gegenwart des Königs und wird idiomatisch in modernes Deutsch übertragen.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: des Königs Ahasveros
  rationale: Titel und Name werden in der im Deutschen üblichen Form verbunden; „Ahasveros“ entspricht der etablierten deutschen Namensform.
