source:
  edition: WLC
  text: לְ֠/הָבִיא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ בְּ/כֶ֣תֶר מַלְכ֑וּת לְ/הַרְא֨וֹת הָֽ/עַמִּ֤ים וְ/הַ/שָּׂרִים֙ אֶת יָפְיָ֔/הּ כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: de
  text: Königin Waschti vor den König zu bringen, mit der Königskrone[a], um den Völkern und den Würdenträgern ihre Schönheit zu zeigen; denn sie war schön anzusehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Königskrone tragend“. Die hebräische Präposition lässt offen, ob ausdrücklich das Tragen der Krone gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: zu bringen
  rationale: Der Hifil-Infinitiv von בוא bezeichnet hier das Veranlassen, dass Waschti vor den König kommt; „zu bringen“ gibt dies direkt und natürlich wieder.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Königin Waschti
  rationale: Die appositionelle Verbindung wird in natürlichem Deutsch als Titel mit Namen wiedergegeben.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor den König
  rationale: לִפְנֵי bedeutet hier „vor, in die Gegenwart von“; wegen des Bewegungsverbs ist im Deutschen der Akkusativ idiomatisch.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: mit der Königskrone
  rationale: Die Wiedergabe wahrt die Mehrdeutigkeit der Präposition ב und macht nicht ausdrücklich, dass Waschti die Krone tragen sollte.
- source_word: לְהַרְאוֹת
  choice: um … zu zeigen
  rationale: 'Der Hifil-Infinitiv von ראה drückt den Zweck aus: andere sollen ihre Schönheit sehen.'
- source_word: הָעַמִּים
  choice: den Völkern
  rationale: Der Plural wird bewahrt und passt zum Vielvölkerreich Persiens.
- source_word: וְהַשָּׂרִים
  choice: den Würdenträgern
  rationale: שׂרים bezeichnet hochgestellte Amtsträger oder Große; „Würdenträger“ ist hier präziser als das potenziell dynastisch missverständliche „Fürsten“.
- source_word: יָפְיָהּ
  choice: ihre Schönheit
  rationale: Das Substantiv mit Suffix wird transparent und unmittelbar wiedergegeben.
- source_word: כִּי טוֹבַת מַרְאֶה הִיא
  choice: denn sie war schön anzusehen
  rationale: „Schön anzusehen“ gibt das hebräische Idiom wörtlichkeitsnah und zugleich in natürlichem Deutsch als Aussage über ihr äußeres Erscheinungsbild wieder.
theological_decisions: []
