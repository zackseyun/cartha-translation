  register: Modernes, würdiges Standarddeutsch. Der Satz ist als Fortsetzung des Befehls aus dem vorherigen Vers formuliert. Der Plural „Völker“ und die Unbestimmtheit von „mit der Königskrone“ bleiben erhalten.
