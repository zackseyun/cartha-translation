id: EST.1.1
reference: Esther 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֖י בִּ/ימֵ֣י אֲחַשְׁוֵר֑וֹשׁ ה֣וּא אֲחַשְׁוֵר֗וֹשׁ הַ/מֹּלֵךְ֙ מֵ/הֹ֣דּוּ וְ/עַד כּ֔וּשׁ שֶׁ֛בַע וְ/עֶשְׂרִ֥ים וּ/מֵאָ֖ה מְדִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: de
  text: Es geschah zur Zeit des Ahasveros[a] – des Ahasveros, der von Indien bis Kusch[b] über 127 Provinzen herrschte –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Xerxes«, wenn Ahasveros mit dem historisch als Xerxes bekannten persischen König identifiziert wird, statt den hebräischen Namen wiederzugeben.
    reason: alternative_reading
  - marker: b
    text: »Kusch« ist die antike Bezeichnung einer Region; manche Übersetzungen geben den Namen mit »Äthiopien« wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Es geschah
  rationale: Die übliche hebräische Eröffnung einer Erzählung wird knapp und würdig wiedergegeben; ein zusätzliches »nun« würde ein im Ausgangstext nicht ausdrücklich vorhandenes Zeitwort eintragen.
- source_word: בִּימֵי
  choice: zur Zeit des
  rationale: Dies gibt die temporale Wendung im heutigen Standarddeutsch natürlich wieder.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Die im Deutschen etablierte Form des hebräischen Namens bleibt näher am Ausgangstext als die historische Identifizierung »Xerxes«.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: jenes Ahasveros
  rationale: Die Wiederholung samt Pronomen kennzeichnet näher, welcher Träger dieses Namens gemeint ist.
- source_word: הַמֹּלֵךְ
  choice: der … herrschte
  rationale: Das Partizip bezeichnet den König durch den Umfang seiner Herrschaft; ein Relativsatz ist im Deutschen die natürliche Form.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: von Indien bis Kusch
  rationale: Hoddu wird konventionell als Indien verstanden; Kusch bleibt als antike Regionalbezeichnung erhalten, um eine Verwechslung mit dem heutigen Staat Äthiopien zu vermeiden.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: '127'
  rationale: Die Zahl wird entsprechend der deutschen Reihenfolge wiedergegeben; Ziffern sorgen bei der Verwaltungsangabe für unmittelbare Lesbarkeit.
- source_word: מְדִינָה
  choice: Provinzen
  rationale: Im persischen Reichskontext ist »Provinzen« die verständliche und übliche Bezeichnung für diese Verwaltungsgebiete.
theological_decisions:
- issue: Historische Identität des Ahasveros
  choice: Der hebräische Name wird als »Ahasveros« wiedergegeben.
  alternative: Xerxes
  rationale: Die verbreitete historische Identifizierung ist plausibel, aber nicht mit der Namensform des hebräischen Textes gleichzusetzen; die Übersetzung lässt diese Frage daher offen und nennt die Alternative in einer Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Gedankenstriche bewahren den im folgenden Vers weiterlaufenden Satzbau. Die wiederholte Namensnennung bleibt als bewusste Identifizierung sichtbar.
