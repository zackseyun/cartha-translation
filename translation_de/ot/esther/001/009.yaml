  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: de
  text: Auch Königin Waschti veranstaltete für die Frauen ein Festmahl[a] im Palast König Ahasveros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Trinkgelage«; das hebräische Wort kann ein Festmahl bezeichnen, das mit Trinken verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »im Haus des Königtums«; gemeint ist der königliche Palast.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Kennzeichnet die Ergänzung zum zuvor beschriebenen Festmahl des Königs.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Königin Waschti
  rationale: Natürliche deutsche Stellung von Titel und Eigenname; »Waschti« entspricht der etablierten deutschen Namensform.
- source_word: עָשְׂתָה
  choice: veranstaltete
  rationale: Gibt das idiomatische Veranstalten eines Festmahls wieder, statt das hebräische »machte« unnötig wörtlich abzubilden.
- source_word: מִשְׁתֵּה
  choice: Festmahl
  rationale: Bezeichnet ein festliches Mahl, häufig mit Wein; »Festmahl« ist im Deutschen klar und würdig, ohne den Trinkaspekt überzubetonen.
- source_word: נָשִׁים
  choice: für die Frauen
  rationale: Gibt die Gruppe wieder, für die Waschti das Festmahl veranstaltete.
- source_word: בֵּית הַמַּלְכוּת
  choice: im königlichen Palast
  rationale: Die wörtliche Wendung »Haus des Königtums« bezeichnet hier natürlich den königlichen Palast; die Fußnote bewahrt die formale Alternative.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: der König Ahasveros gehörte
  rationale: Bewahrt den possessiven Sinn des hebräischen Relativsatzes, auch wenn die Angabe im Deutschen etwas ausdrücklich wirkt.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Verwendet die im modernen deutschen Bibelgebrauch etablierte Form des persischen Königsnamens.
