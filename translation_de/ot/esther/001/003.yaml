  text: בִּ/שְׁנַ֤ת שָׁלוֹשׁ֙ לְ/מָלְכ֔/וֹ עָשָׂ֣ה מִשְׁתֶּ֔ה לְ/כָל שָׂרָ֖י/ו וַ/עֲבָדָ֑י/ו חֵ֣יל פָּרַ֣ס וּ/מָדַ֗י הַֽ/פַּרְתְּמִ֛ים וְ/שָׂרֵ֥י הַ/מְּדִינ֖וֹת לְ/פָנָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: de
  text: Im dritten Jahr seiner Herrschaft veranstaltete er für alle seine Fürsten und Diener ein Festmahl[a] — das Heer Persiens und Mediens, die Adligen und die Fürsten der Provinzen vor ihm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ein Fest, bei dem auch das Trinken eine wichtige Rolle spielte.
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: in seiner Gegenwart.'
    reason: clarification
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: Im dritten Jahr seiner Herrschaft
  rationale: Die Zeitangabe bezeichnet idiomatisch das dritte Regierungsjahr; „Herrschaft“ gibt לְמָלְכוֹ natürlich und präzise wieder.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: veranstaltete … ein Festmahl
  rationale: עָשָׂה bedeutet wörtlich „machen“, bezeichnet mit מִשְׁתֶּה jedoch idiomatisch das Ausrichten eines festlichen, vom Trinken geprägten Mahls.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: für alle seine Fürsten und Diener
  rationale: שָׂרִים bezeichnet hochrangige Amtsträger oder Fürsten; עֲבָדִים meint im höfischen Zusammenhang die Diener beziehungsweise Funktionsträger des Königs, ohne hier zwingend Sklaven zu bezeichnen.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: das Heer Persiens und Mediens
  rationale: חֵיל kann Heer, Streitmacht, Stärke oder Macht bezeichnen. Im politischen Hofkontext ist „Heer“ eine klare, natürliche Wiedergabe, während die Bedeutungsbreite in einer Fußnote erhalten bleibt.
- source_word: הַפַּרְתְּמִים
  choice: die Vornehmen
  rationale: Das persische Lehnwort bezeichnet hochrangige Adlige; „die Vornehmen“ ist verständlich und bewahrt den höfischen Rang, ohne einen zu spezifischen Amtstitel einzuführen.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: und die Fürsten der Provinzen
  rationale: Die Wendung bezeichnet führende Amtsträger der Provinzen. „Fürsten“ hält die Verbindung zum zuvor verwendeten שָׂרִים sichtbar und vermeidet die engere Festlegung auf „Statthalter“.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die wörtliche und im Deutschen verständliche Wendung bewahrt das höfische Bild; gemeint ist die Anwesenheit vor dem König.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die masoretische Gliederung nach „Diener“ wird durch zwei Sätze nachvollzogen. Im zweiten, hebräischen Nominalsatz wird das im Deutschen erforderliche Verb „waren“ ergänzt, ohne eine zusätzliche Handlung einzuführen.
