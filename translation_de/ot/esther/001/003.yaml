  to: Im dritten Jahr seiner Herrschaft veranstaltete er für alle seine Fürsten und Diener ein Festmahl[a] — das Heer Persiens und Mediens, die Adligen und die Fürsten der Provinzen vor ihm[c].
  rationale: 'Die Revision stellt die hebräische Satz- und Aufzählungsstruktur im Deutschen wieder her, ohne den Sinn zu verändern. „Die Adligen“ ist eine klarere moderne Wiedergabe der persischen Hochrangigen. Fußnote b wird sprachlich bereinigt; ihr Anker bleibt bei „Heer“ implizit zu ergänzen: Im revidierten Text wird sie als „Heer[b]“ gesetzt.'
