source:
  edition: WLC
  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: de
  text: 'Wenn es dem König gefällt[a], soll von ihm ein königlicher Erlass ausgehen und in die Gesetze Persiens und Mediens aufgenommen werden und nicht widerrufen werden[b]: Waschti darf nicht vor König Ahasveros erscheinen, und der König soll ihre königliche Stellung[c] einer anderen Frau geben, die besser ist als sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn es dem König gut erscheint.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und nicht geändert werden darf“ oder „und nicht übertreten werden darf“. Die hebräische Wendung bezeichnet hier die feste Rechtskraft des Erlasses.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ihr Königtum“; gemeint ist hier ihr Rang oder Amt als Königin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Wenn es dem König gefällt
  rationale: Die höfische Formel bringt ehrerbietig die Zustimmung des Königs als Voraussetzung zum Ausdruck. Die deutsche Wendung ist natürlich und bewahrt diesen Sinn.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: soll von ihm ein königlicher Erlass ausgehen
  rationale: דְבַר מַלְכוּת bezeichnet hier eine amtliche königliche Anordnung. „Von ihm … ausgehen“ gibt מִלְּפָנָיו als Ergehen aufgrund der königlichen Autorität wieder.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: und in die Gesetze Persiens und Mediens aufgenommen werden
  rationale: Das Niederschreiben bezeichnet die formelle Aufnahme in den anerkannten Gesetzesbestand; die Reihenfolge Persien–Medien folgt dem Hebräischen.
- source_word: וְלֹא יַעֲבוֹר
  choice: sodass er nicht aufgehoben werden kann
  rationale: Im rechtlichen Zusammenhang geht es um die bleibende Geltung des Erlasses. Die Übersetzung wahrt dies, während eine Fußnote die möglichen Nuancen „geändert“ und „übertreten“ nennt.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי
  choice: Waschti darf nicht … erscheinen
  rationale: Die Inhaltsklausel des Erlasses hat verbietende Kraft. „Darf nicht“ gibt sie klar wieder, ohne das im Hebräischen nicht ausdrücklich vorhandene „wieder“ oder „mehr“ einzufügen.
- source_word: לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: vor König Ahasveros
  rationale: Die übliche deutsche Stellung des Herrschertitels vor dem Namen ist natürlich und gibt Titel wie Eigennamen vollständig wieder.
- source_word: וּמַלְכוּתָהּ
  choice: ihre königliche Stellung
  rationale: מַלְכוּת bezeichnet hier nicht ein Herrschaftsgebiet, sondern Waschtis königlichen Rang beziehungsweise ihr Amt als Königin.
- source_word: לִרְעוּתָהּ
  choice: einer anderen Frau
  rationale: רְעוּתָהּ kann ihre Gefährtin oder Nächste bezeichnen; im Zusammenhang ihrer Ersetzung ist „einer anderen Frau“ die klare, idiomatische Wiedergabe.
- source_word: הַטּוֹבָה מִמֶּנָּה
  choice: die besser ist als sie
  rationale: Die offene vergleichende Wertung des Hebräischen bleibt erhalten, ohne näher zu bestimmen, in welcher Hinsicht die andere Frau „besser“ sei.
