source:
  edition: WLC
  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: de
  text: 'Denn die Sache der Königin wird allen Frauen bekannt werden, sodass sie ihre Männer in ihren Augen verachten, wenn sie sagen: »König Ahasveros sagte, man solle Königin Waschti vor ihn bringen, aber sie kam nicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: die Sache der Königin
  rationale: Das mehrdeutige דָּבָר kann hier eine Angelegenheit, Begebenheit oder ein Verhalten bezeichnen. „Sache“ bewahrt diese Offenheit, ohne den Text ausdrücklich als moralisches Urteil über Waschtis Verhalten auszulegen.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: wird allen Frauen bekannt werden
  rationale: Wörtlich geht die Sache „hinaus zu/über alle Frauen“; idiomatisches Deutsch gibt die gemeinte öffentliche Verbreitung mit „bekannt werden“ wieder.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: sodass sie ihre Männer in ihren Augen verachten
  rationale: Die ungewöhnliche hebräische Wendung „in ihren Augen“ bleibt erhalten; sie bezeichnet die Geringschätzung aus Sicht der Frauen und bewahrt den Ton der Rede Memuchans.
- source_word: אָמַר לְהָבִיא
  choice: sagte, man solle ... bringen
  rationale: אָמַר bedeutet „sagte“, nicht ausdrücklich „befahl“. Die deutsche Infinitivkonstruktion wird natürlich als indirekte Aufforderung wiedergegeben, ohne die Aussage zu „befahl“ zu verstärken.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform gibt den hebräischen Namen אֲחַשְׁוֵרוֹשׁ wieder.
- source_word: וַשְׁתִּי
  choice: Waschti
  rationale: Die deutsche Transliteration „Waschti“ bildet den hebräischen Namen verständlich und traditionsgemäß ab.
theological_decisions:
- issue: Bewertung von Waschtis Handeln
  choice: „Sache der Königin“
  alternative: „Verhalten der Königin“ oder „Ungehorsam der Königin“
  rationale: Der hebräische Ausdruck legt keine eindeutige moralische Bewertung fest. Die Übersetzung schreibt Memuchans Deutung nicht als objektives Urteil des Erzählers fest.
- issue: Stärke der königlichen Äußerung
  choice: „sagte, man solle ... bringen“
  alternative: „befahl, ... zu bringen“
  rationale: Die Übersetzung folgt dem allgemeinen Verb אָמַר und vermeidet eine interpretierende Verstärkung, während der auffordernde Sinn der Konstruktion erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; auffällige hebräische Perspektivsprache („in ihren Augen“) wurde bewusst beibehalten. Keine Fußnoten erforderlich.
