  source_fidelity: 'Die Übersetzung gibt den hebräischen Sinn zuverlässig wieder: דְבַר הַמַּלְכָּה bleibt mit „die Sache der Königin“ angemessen offen; die Verbreitung an alle Frauen, die daraus folgende Geringschätzung der Ehemänner und der Inhalt der angeführten Rede sind vollständig erfasst. „sagte, man solle ... bringen“ wahrt die geringere explizite Stärke von אָמַר gegenüber „befahl“.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Formulierung „ihre Männer in ihren Augen verachten“ ist leicht hebraisierend, aber im Deutschen klar verständlich und erhält die im Ausgangstext markierte Perspektive der Frauen.
  terminology: „Ahasveros“ und „Waschti“ sind im deutschen Bibelgebrauch etablierte Namensformen. „Sache der Königin“ vermeidet es zutreffend, dem mehrdeutigen Ausdruck eine moralisch wertende Deutung wie „Ungehorsam“ oder „Verhalten“ aufzuzwingen.
