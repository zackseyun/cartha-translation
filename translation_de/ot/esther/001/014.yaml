  to: Ihm am nächsten standen Karschena, Schetar, Admata, Tarschisch, Meres, Marsena und Memuchan, die sieben führenden Beamten Persiens und Mediens, die das Angesicht des Königs sahen[a] und im Reich die ersten Plätze einnahmen.[b]
