  - severity: low
    issue: Namensform »Tarsis«
    rationale: Für תַּרְשִׁישׁ ist »Tarschisch« die hebraischnähere und im deutschen Bibelgebrauch übliche Umschrift; »Tarsis« kann zudem eher als geographische Bezeichnung gelesen werden.
