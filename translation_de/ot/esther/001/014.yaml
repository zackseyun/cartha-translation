id: EST.1.14
reference: Esther 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: de
  text: Ihm am nächsten standen Karschena, Schetar, Admata, Tarschisch, Meres, Marsena und Memuchan, die sieben führenden Beamten Persiens und Mediens, die das Angesicht des Königs sahen[a] und im Reich die ersten Plätze einnahmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die das Angesicht des Königs sahen«; ein höfischer Ausdruck für Amtsträger mit unmittelbarem Zugang zur Gegenwart des Königs.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »und im Reich den ersten Rang einnahmen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרוֹב אֵלָיו
  choice: Ihm am nächsten standen
  rationale: Obwohl הַקָּרוֹב morphologisch singularisch ist, führt die Wendung eine Gruppe von sieben Männern ein und wird daher kollektiv im Plural wiedergegeben. Die Formulierung ist natürlich und bewahrt den Gedanken besonderer Nähe zum König.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: Karschena, Schetar, Admata, Tarsis, Meres, Marsena und Memuchan
  rationale: Die Personennamen werden in einer im Deutschen üblichen, eng an den hebräischen Formen orientierten Umschrift wiedergegeben.
- source_word: שִׁבְעַת שָׂרֵי
  choice: die sieben führenden Beamten
  rationale: שָׂרִים bezeichnet hier hochrangige Amtsträger am Hof. »Führende Beamte« macht Rang und amtliche Funktion deutlich, ohne erblichen Adel vorauszusetzen.
- source_word: פָּרַס וּמָדַי
  choice: Persiens und Mediens
  rationale: Die Genitivform bezeichnet die beiden Teile des persisch-medischen Herrschaftsbereichs und entspricht natürlichem modernem Deutsch.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: Sie durften das Angesicht des Königs sehen
  rationale: Die konkrete Bildsprache des höfischen Ausdrucks bleibt erhalten; »durften« verdeutlicht knapp, dass privilegierter Zugang zur Gegenwart des Königs gemeint ist.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: nahmen die höchsten Plätze im Reich ein
  rationale: Die Übersetzung bewahrt die Sitz- beziehungsweise Rangmetapher und gibt רִאשֹׁנָה idiomatisch als höchsten Vorrang innerhalb des Reiches wieder.
theological_decisions: []
