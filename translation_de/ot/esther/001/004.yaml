  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: de
  text: Als er viele Tage lang den Reichtum der Herrlichkeit seines Königreichs und die kostbare Pracht seiner Größe zur Schau stellte – hundertachtzig Tage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהַרְאֹתוֹ
  choice: Dabei stellte er … zur Schau
  rationale: Die Infinitivkonstruktion bezeichnet den begleitenden Vorgang; „zur Schau stellen“ gibt das absichtliche Vorzeigen im Kontext natürlich wieder.
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: den Reichtum und die Herrlichkeit seines Königreichs
  rationale: Die hebräische Status-constructus-Kette ist mehrdeutig. Die koordinierte Wiedergabe bewahrt beide Leitbegriffe verständlich, ohne eine schwerfällige Häufung von Genitiven.
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: die kostbare Pracht seiner Größe
  rationale: יְקָר trägt hier den Sinn von Kostbarkeit/Wert, תִּפְאֶרֶת bezeichnet Pracht oder Glanz und גְּדוּלָּה die königliche Größe. Die Formulierung wahrt die emphatische Häufung.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: viele Tage lang … hundertachtzig Tage
  rationale: Die Wiederholung des Zeitbegriffs und die anschließende genaue Zahl werden wie im Hebräischen beibehalten.
