    rationale: „den Reichtum und die Herrlichkeit seines Königreichs“ kann zwei gleichrangige Gegenstände nahelegen. Der hebräische Text bezeichnet den „Reichtum der Herrlichkeit seines Königreichs“ und sollte diese Beziehung möglichst bewahren.
  - severity: low
    issue: „Dabei“ bildet den temporalen Charakter von בְּהַרְאֹתוֹ nur abgeschwächt ab.
    rationale: Die Konstruktion bedeutet hier „als/während er zeigte“. „Als er … zur Schau stellte“ ist im Deutschen zugleich natürlicher und präziser.
