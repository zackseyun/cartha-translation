  variant: modern standard German
source:
  edition: WLC
  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: de
  text: Doch Königin Waschti weigerte sich, auf den Befehl des Königs hin zu kommen, den die Eunuchen überbracht hatten.[a] Da wurde der König sehr zornig, und sein Grimm entbrannte in ihm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand der Eunuchen“; die hebräische Wendung bedeutet, dass sie den Befehl übermittelten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sein Zorn brannte in ihm.“ Das Hebräische beschreibt heftigen Zorn bildlich als ein Feuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: weigerte sich
  rationale: Das Verb bezeichnet eine bewusste Weigerung und wird im Deutschen direkt und natürlich wiedergegeben.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: Königin Waschti
  rationale: Titel und Eigenname werden in der im Deutschen üblichen Form verbunden.
- source_word: לָבוֹא
  choice: zu kommen
  rationale: Die Grundbedeutung von בוא bleibt erhalten und passt zur Vorladung an den königlichen Hof.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: auf den Befehl des Königs hin
  rationale: דבר bezeichnet hier nicht bloß ein Wort, sondern den verbindlichen Befehl des Königs; die Präposition wird idiomatisch wiedergegeben.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: den die Eunuchen überbracht hatten
  rationale: Die hebräische Wendung „durch die Hand“ bezeichnet die Vermittlung oder Überbringung. „Eunuchen“ bewahrt die konkrete Bezeichnung der persischen Hofbediensteten.
- source_word: וַיִּקְצֹף הַמֶּלֶךְ מְאֹד
  choice: Da wurde der König sehr zornig
  rationale: Die Übersetzung gibt sowohl den Eintritt der heftigen Reaktion als auch die Verstärkung durch מְאֹד in natürlichem Deutsch wieder.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: und sein Grimm entbrannte in ihm
  rationale: „Entbrannte“ erhält das hebräische Feuerbild; „in ihm“ gibt den inneren Bezug von בוֹ wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bewahrt den scharfen Gegensatz zwischen Waschtis Weigerung und der heftigen Reaktion des Königs; das hebräische Feuerbild bleibt erhalten.
