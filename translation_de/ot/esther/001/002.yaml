lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Zu jener Zeit
  rationale: Die hebräische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben; der rückverweisende Charakter von הָהֵם bleibt erhalten.
- source_word: כְּשֶׁבֶת
  choice: als … saß
  rationale: כְּ mit dem Infinitiv constructus von ישׁב leitet einen temporalen Nebensatz ein. „Als … saß“ ist im erzählenden Zusammenhang idiomatisch und wahrt den zeitlichen Sinn.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: König Ahasveros
  rationale: Der im Deutschen etablierte biblische Name „Ahasveros“ wird mit dem vorangestellten Titel verbunden.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: auf seinem Königsthron
  rationale: Wörtlich bezeichnet die Wendung den „Thron seiner Königsherrschaft/seines Königtums“. „Sein Königsthron“ ist knapp, natürlich und bewahrt den königlichen Sinn sowie das Possessivsuffix.
- source_word: אֲשֶׁר
  choice: der sich … befand
  rationale: Das Relativpronomen bezieht sich grammatisch auf den Thron. Mit „sich befand“ wird die Ortsangabe im Deutschen eindeutig und natürlich angeschlossen, ohne eine zusätzliche Handlung einzuführen.
- source_word: בְּשׁוּשַׁן
  choice: in … Susa
  rationale: „Susa“ ist die im modernen Deutschen geläufige Form des Ortsnamens; die näher am Hebräischen liegende Form wird in der Fußnote genannt.
- source_word: הַבִּירָה
  choice: der Festung
  rationale: בִּירָה bezeichnet hier den befestigten königlich-administrativen Bezirk beziehungsweise die Zitadelle. „Festung“ ist verständlich und lässt die genaue Ausdehnung offen.
