  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: de
  text: Noch heute werden die vornehmen Frauen von Persien und Medien, die von der Sache der Königin gehört haben, allen Würdenträgern des Königs davon erzählen[a]. Und es wird Verachtung und Zorn zur Genüge geben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werden … sagen“. Der hebräische Ausdruck „die Sache/das Wort der Königin“ kann ihre Aussage, aber auch die sie betreffende Angelegenheit meinen. „Davon erzählen“ gibt den im Deutschen erforderlichen Bezug wieder, ohne den Inhalt näher festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil ist im Hebräischen verkürzt, etwa: „und Verachtung und Zorn zur Genüge“. „Es wird … geben“ ist zur Verdeutlichung ergänzt.'
    reason: textual_ellipsis
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: Noch heute
  rationale: Die Wendung bezeichnet den gegenwärtigen Tag und unterstreicht im Zusammenhang die unmittelbare Ausbreitung der Nachricht.
- source_word: תֹּאמַרְנָה
  choice: werden … reden
  rationale: Das Qal-Imperfekt 3. Person feminin Plural von אמר ist hier als Vorhersage zu verstehen. Mit dem aus dem Zusammenhang ergänzten „ebenso“ wird der gemeinte Inhalt natürlich wiedergegeben, ohne ihn näher festzulegen.
- source_word: שָׂרוֹת
  choice: vornehmen Frauen
  rationale: Das feminine Substantiv bezeichnet hochgestellte Frauen. Diese Wiedergabe vermeidet die mögliche Fehlannahme, es handle sich zwingend um Königstöchter.
- source_word: פָּרַס וּמָדַי
  choice: von Persien und Medien
  rationale: Die etablierten deutschen Ländernamen sind sachgerecht und geben die Zugehörigkeit der hochgestellten Frauen natürlich wieder.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: die … gehört haben
  rationale: Das Perfekt bezeichnet ein bereits erfolgtes Hören mit Auswirkung auf die angekündigte Reaktion.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: von der Sache der Königin
  rationale: דָּבָר kann Wort, Aussage, Angelegenheit oder Vorfall bedeuten. Im Zusammenhang ist wohl das bekannt gewordene Verhalten beziehungsweise der Vorfall um die Königin gemeint; „Sache“ bewahrt diese Breite.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: zu allen Würdenträgern des Königs
  rationale: שָׂרִים bezeichnet hochrangige Amtsträger oder führende Männer. „Würdenträger“ passt zum höfischen Zusammenhang, ohne erbliche Prinzenwürde vorauszusetzen.
- source_word: וּכְדַי
  choice: So wird es … zur Genüge geben
  rationale: Der hebräische Schluss ist elliptisch und bezeichnet ein ausreichendes beziehungsweise reichliches Maß. Für klares Deutsch wird ein Existenzverb ergänzt.
- source_word: בִּזָּיוֹן
  choice: Verachtung
  rationale: Das Substantiv bezeichnet Geringschätzung oder verächtliche Behandlung und passt zur befürchteten Missachtung der Ehemänner.
- source_word: וָקָצֶף
  choice: und Zorn
  rationale: קֶצֶף bezeichnet heftigen Ärger oder Zorn. „Zorn“ wahrt die Stärke des Ausdrucks in würdigem, gegenwärtigem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem höfischem Ton. „Vornehme Frauen“ und „Würdenträger“ vermitteln den hohen gesellschaftlichen Rang ohne irreführende dynastische Festlegung. Die beiden Ellipsen des Hebräischen werden im Haupttext behutsam aufgelöst und in den Fußnoten kenntlich gemacht.
