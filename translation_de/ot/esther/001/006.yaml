  text: ח֣וּר כַּרְפַּ֣ס וּ/תְכֵ֗לֶת אָחוּז֙ בְּ/חַבְלֵי ב֣וּץ וְ/אַרְגָּמָ֔ן עַל גְּלִ֥ילֵי כֶ֖סֶף וְ/עַמּ֣וּדֵי שֵׁ֑שׁ מִטּ֣וֹת זָהָ֣ב וָ/כֶ֗סֶף עַ֛ל רִֽצְפַ֥ת בַּהַט וָ/שֵׁ֖שׁ וְ/דַ֥ר וְ/סֹחָֽרֶת׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: de
  text: Da waren Vorhänge aus weißem Baumwollstoff und blauem Stoff, befestigt mit Schnüren aus feinem Leinen und purpurfarbenen Schnüren an silbernen Ringen[a] und Marmorsäulen. Liegen[b] aus Gold und Silber standen auf einem Boden aus Alabaster, Marmor, Perlmutt und kostbarem Gestein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „silbernen Stäben“. Das hebräische Wort kann allgemein etwas Rundes oder Gerolltes aus Silber bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Liegen, auf denen man sich beim Festmahl niederließ, nicht gewöhnliche Schlafbetten.
    reason: cultural_note
  - marker: c
    text: Die genaue Bestimmung der vier Materialien des Bodens ist unsicher. Die hebräischen Wörter werden unter anderem auch mit „Porphyr“, „weißem Marmor“ oder „dunklem Gestein“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס
  choice: weißer Baumwollstoff
  rationale: חוּר bezeichnet hier am ehesten die Farbe Weiß, כַּרְפַּס wahrscheinlich einen kostbaren Baumwollstoff; zusammen bilden sie ein natürliches deutsches Stoffattribut.
- source_word: תְכֵלֶת
  choice: blauer Purpur
  rationale: Der Ausdruck bezeichnet einen kostbaren blauen bis blauvioletten Farbstoff beziehungsweise damit gefärbten Stoff. „Blauer Purpur“ bewahrt Farbe und Luxuskonnotation.
- source_word: אָחוּז
  choice: befestigt
  rationale: Das passive Partizip beschreibt, wie die Vorhänge angebracht beziehungsweise gehalten waren.
- source_word: חַבְלֵי בוּץ
  choice: Schnüre aus feinem Leinen
  rationale: בּוּץ bezeichnet feines Leinen; „Schnüre“ passt besser zur dekorativen Befestigung als das schwerer wirkende „Seile“.
- source_word: אַרְגָּמָן
  choice: roter Purpur
  rationale: Der Luxusfarbstoff wird zur Unterscheidung von תְכֵלֶת als roter Purpur wiedergegeben; gemeint können auch purpurne Fäden oder Schnüre sein.
- source_word: גְּלִילֵי כֶסֶף
  choice: silberne Ringe
  rationale: Das Substantiv bezeichnet etwas Rundes oder Gerolltes. Im Zusammenhang der Befestigung sind Ringe plausibel, doch die genaue Form bleibt unsicher und wird angemerkt.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: Marmorsäulen
  rationale: שֵׁשׁ bezeichnet hier einen weißen Schmuckstein, wahrscheinlich Marmor; die genaue Gesteinsart ist nicht sicher.
- source_word: מִטּוֹת
  choice: Ruhebetten
  rationale: Im Festkontext sind Liegen zum Zurücklehnen gemeint, nicht gewöhnliche Schlafbetten. „Ruhebetten“ ist würdig und im Deutschen verständlich.
- source_word: רִצְפַת
  choice: Boden
  rationale: Der Ausdruck bezeichnet eine befestigte Bodenfläche; „Boden“ ist natürlich und vermeidet die möglicherweise zu enge Deutung „Mosaik“.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: Alabaster, Marmor, Perlmutt und kostbares Gestein
  rationale: Die seltenen Materialbezeichnungen sind teilweise unsicher. Die gewählten deutschen Entsprechungen folgen verbreiteten Identifikationen, während eine Fußnote die Unsicherheit offenlegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Nominalsatz des Hebräischen wird in zwei Sätze gegliedert, um die reiche Ausstattung klar lesbar zu machen. Die seltenen Farbstoff- und Gesteinsbezeichnungen werden nicht technisch überpräzisiert; echte lexikalische Unsicherheiten stehen in den Fußnoten.
