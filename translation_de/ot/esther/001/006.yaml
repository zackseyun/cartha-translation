revisions:
- from: Da waren Vorhänge aus weißem Baumwollstoff und blauem Purpur, befestigt mit Schnüren aus feinem Leinen und rotem Purpur an silbernen Ringen[a] und Marmorsäulen. Ruhebetten[b] aus Gold und Silber standen auf einem Boden aus Alabaster, Marmor, Perlmutt und kostbarem Gestein.[c]
  to: Da waren Vorhänge aus weißem Baumwollstoff und blauem Stoff, befestigt mit Schnüren aus feinem Leinen und purpurfarbenen Schnüren an silbernen Ringen[a] und Marmorsäulen. Liegen[b] aus Gold und Silber standen auf einem Boden aus Alabaster, Marmor, Perlmutt und kostbarem Gestein.[c]
  rationale: Die Revision beseitigt die im Deutschen missverständliche und quellenlich zu enge Gegenüberstellung „blauer Purpur“ und „roter Purpur“. Sie bewahrt die Reihung der luxuriösen Textilien sowie die überlieferte Unsicherheit bei den Architektur- und Bodenmaterialien. Die Fußnotenanker bleiben an den jeweils relevanten Textstellen erhalten.
