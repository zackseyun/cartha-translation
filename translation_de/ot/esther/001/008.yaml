source:
  edition: WLC
  text: וְ/הַ/שְּׁתִיָּ֥ה כַ/דָּ֖ת אֵ֣ין אֹנֵ֑ס כִּי כֵ֣ן יִסַּ֣ד הַ/מֶּ֗לֶךְ עַ֚ל כָּל רַ֣ב בֵּית֔/וֹ לַ/עֲשׂ֖וֹת כִּ/רְצ֥וֹן אִישׁ וָ/אִֽישׁ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: de
  text: 'Das Trinken geschah gemäß der Vorschrift: Es gab keinen Zwang.[a] Denn so hatte der König alle Verantwortlichen seines Hauses angewiesen, sich nach dem Wunsch jedes Einzelnen zu richten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Es gab keinen Zwang.« Gemeint ist, dass niemand zum Trinken gezwungen wurde. Das mit »Vorschrift« wiedergegebene hebräische Wort kann auch »Gesetz«, »Erlass« oder »Regelung« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nach dem Wunsch eines Mannes und eines Mannes«; diese hebräische Ausdrucksweise bedeutet »nach dem Wunsch jedes Einzelnen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: Beim Trinken
  rationale: Das Substantiv bezeichnet hier konkret das Trinken während des Festmahls. Die deutsche Wendung ist natürlich und grenzt den Vorgang vom gesamten Fest ab.
- source_word: כַדָּת
  choice: galt die Regel
  rationale: דָּת kann Gesetz, Erlass oder verbindliche Regelung bedeuten. Im unmittelbaren Festkontext bezeichnet es am ehesten die festgelegte Verfahrensregel.
- source_word: אֵין אֹנֵס
  choice: Niemand wurde zum Trinken gedrängt
  rationale: Die Wendung verneint Zwang. Die Ergänzung „zum Trinken“ verdeutlicht den im Hebräischen aus dem Kontext erschlossenen Bezug, ohne eine Trinkpflicht zu unterstellen.
- source_word: כִּי כֵן
  choice: Denn
  rationale: Die Partikelverbindung führt die Begründung für die zuvor genannte Regel an; ihre demonstrative Nuance wird im folgenden Inhalt der Anweisung ausgedrückt.
- source_word: יִסַּד
  choice: hatte ... angewiesen
  rationale: Das Verb bedeutet grundsätzlich „festsetzen, begründen“. Im administrativen Zusammenhang bezeichnet es die verbindliche Festlegung beziehungsweise Anweisung des Königs.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: alle Verantwortlichen seines Hauses
  rationale: רַב bezeichnet hier leitende Personen im königlichen Haus. „Verantwortliche“ ist verständlich und bewahrt die administrative Funktion, während „Haus“ die mögliche Spannweite zwischen Haushalt und Palast offenhält.
- source_word: לַעֲשׂוֹת כִּרְצוֹן
  choice: sich nach dem Wunsch ... zu richten
  rationale: Die idiomatische deutsche Form gibt das Handeln gemäß dem Willen beziehungsweise Wunsch eines jeden Gastes wieder.
- source_word: אִישׁ וָאִישׁ
  choice: jedes Einzelnen
  rationale: Die hebräische Wiederholungsform ist distributiv und meint jeden Einzelnen. Im Deutschen gibt diese Form den Sinn präzise und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit leicht umgeformt. „Regel“ vermeidet die im Festkontext möglicherweise zu eng juristische Wirkung von „Gesetz“, während die Fußnote die Bedeutungsbreite wahrt. Der explizite Hinweis auf das Trinken klärt den Bezug des verneinten Zwangs.
