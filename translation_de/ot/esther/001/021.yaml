- from: Der Vorschlag gefiel dem König und den Würdenträgern, und der König handelte nach Memuchans Worten.[a]
  to: Die Angelegenheit gefiel dem König und den Würdenträgern, und der König handelte nach dem Wort Memuchans.[a]
  rationale: Die Revision erhält die natürliche deutsche Wiedergabe des Idioms („gefiel“), vermeidet aber bei הַדָּבָר eine unnötige Einengung auf einen „Vorschlag“. Der Singular „Wort“ entspricht dem hebräischen דְּבַר und lässt dessen Bedeutungsspektrum offen. Die Fußnote dokumentiert die formnähere Alternative, ohne den Sinn stärker auszulegen.
