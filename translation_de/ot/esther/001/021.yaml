    rationale: Das Wort bezeichnet hier kontextuell die vorgetragene Sache, kann aber nicht ausschließlich als formaler Vorschlag festgelegt werden. „Die Angelegenheit“ ist idiomatisch und semantisch offener.
  - severity: low
    issue: „Memuchans Worten“ steht im Plural.
    rationale: Das Hebräische hat כִּדְבַר, „gemäß dem Wort/der Aussage“. Der Singular bewahrt die Form und die offene Bedeutung besser.
  - severity: low
    issue: Die Fußnote bietet eine nicht erforderliche, stärker ausdeutende Alternative.
    rationale: „Der König führte Memuchans Vorschlag aus“ macht aus der im Text offenen „Sache“ ausdrücklich einen Vorschlag und aus dem Handeln ein Ausführen. Eine knappe Fußnote zur wörtlichen Formulierung genügt.
