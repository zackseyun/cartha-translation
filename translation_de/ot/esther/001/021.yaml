  text: וַ/יִּיטַב֙ הַ/דָּבָ֔ר בְּ/עֵינֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יַּ֥עַשׂ הַ/מֶּ֖לֶךְ כִּ/דְבַ֥ר מְמוּכָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: de
  text: Die Angelegenheit gefiel dem König und den Würdenträgern, und der König handelte nach dem Wort Memuchans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der König tat nach dem Wort Memuchans.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: Der Vorschlag gefiel
  rationale: Die hebräische Wendung bedeutet wörtlich, dass die Sache »gut in den Augen« der Genannten war. »Der Vorschlag gefiel« gibt das Idiom natürlich wieder und bezieht הַדָּבָר im unmittelbaren Zusammenhang auf Memuchans zuvor vorgetragenen Vorschlag.
- source_word: הַמֶּלֶךְ
  choice: dem König
  rationale: Direkte und kontextgemäße Wiedergabe von מֶלֶךְ.
- source_word: וְהַשָּׂרִים
  choice: und den Würdenträgern
  rationale: שָׂרִים bezeichnet hier hochrangige Männer am persischen Hof. »Würdenträger« ist in diesem monarchischen Kontext präziser als das allgemeinere »Beamte« und vermeidet das missverständliche »Fürsten«.
- source_word: וַיַּעַשׂ הַמֶּלֶךְ
  choice: und der König handelte
  rationale: עָשָׂה bedeutet grundsätzlich »tun, machen«. Mit כִדְבַר ist »handelte nach« im Deutschen natürlich und wahrt den Sinn, dass der König Memuchans Äußerung entsprechend vorging.
- source_word: כִּדְבַר מְמוּכָן
  choice: nach Memuchans Worten
  rationale: Die Formulierung bleibt nahe beim Hebräischen »gemäß dem Wort Memuchans«, klingt aber in modernem Deutsch idiomatisch. Der Plural »Worten« kann eine Äußerung beziehungsweise einen Rat als Ganzes bezeichnen, ohne דָּבָר vorschnell ausschließlich als »Rat« festzulegen.
- source_word: מְמוּכָן
  choice: Memuchan
  rationale: Der Personenname wird in einer im Deutschen etablierten Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das hebräische Idiom wird im ersten Satzteil natürlich wiedergegeben; im zweiten bleibt die Mehrdeutigkeit von דָּבָר als Wort, Äußerung oder Rat durch »Worten« erhalten.
