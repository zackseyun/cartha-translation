base_translation:
  language: en
  yaml_path: translation/ot/esther/004/002.yaml
  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: de
  text: Er kam bis vor das Tor des Königs; denn niemand durfte in Sacktuch gekleidet das Tor des Königs betreten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formeller: „Denn es war nicht erlaubt, das Tor des Königs in Sacktuch gekleidet zu betreten.“ Sacktuch wurde als Zeichen der Trauer getragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Er kam
  rationale: Das narrative Wayyiqtol von בוא beschreibt Mordechais Annäherung; „Er kam“ ist im Deutschen natürlich und wahrt die Bewegungsrichtung.
- source_word: עַד לִפְנֵי
  choice: bis vor
  rationale: Die Verbindung bezeichnet den Endpunkt seiner Annäherung unmittelbar vor dem Tor und macht deutlich, dass er nicht hineinging.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: das Tor des Königs
  rationale: Die formnahe Wiedergabe der Status-constructus-Verbindung ist klar und bezeichnet das Tor zum königlichen Bereich.
- source_word: כִּי אֵין לָבוֹא
  choice: denn niemand durfte … betreten
  rationale: אין mit Infinitiv bezeichnet hier im Kontext nicht bloß eine faktische Unmöglichkeit, sondern ein geltendes Zutrittsverbot; die deutsche Formulierung gibt diese praktische Bedeutung natürlich wieder.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: das Tor des Königs … betreten
  rationale: אֶל kann eine Bewegung zu oder in einen Bereich ausdrücken. Mit „betreten“ wird hier idiomatisch der Zutritt zum Torbereich bezeichnet.
- source_word: בִּלְבוּשׁ שָׂק
  choice: in einem Trauergewand aus Sacktuch
  rationale: Wörtlich handelt es sich um „Kleidung aus Sacktuch“. „Trauergewand“ vermittelt die kulturelle Funktion, während „aus Sacktuch“ das konkrete Material ausdrücklich bewahrt.
