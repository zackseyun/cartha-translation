  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: de
  text: 'Alle Diener des Königs und die Bevölkerung in den Provinzen des Königs wissen: Wer zum König in den inneren Hof kommt – ob Mann oder Frau –, ohne gerufen worden zu sein[a], für den gilt ein und dasselbe Gesetz[b]: Er wird getötet. Ausgenommen ist nur, wem der König das goldene Zepter entgegenstreckt; der bleibt am Leben. Ich aber bin seit dreißig Tagen nicht zum König gerufen worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne vorgeladen worden zu sein“. Das hebräische Passiv bedeutet wörtlich „ohne gerufen worden zu sein“ und bezeichnet hier das offizielle Rufen in die Gegenwart des Königs.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein Gesetz ist eines“. Gemeint ist eine einzige, feststehende Rechtsfolge für einen solchen Fall.'
    reason: idiom_clarification
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: Diener des Königs
  rationale: עֶבֶד bezeichnet hier allgemein Menschen im Dienst des persischen Königs. „Diener“ wahrt die Breite des Ausdrucks, ohne einen Sklavenstatus oder ausschließlich hohe Amtsstellungen vorauszusetzen.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: und die Bevölkerung in den Provinzen des Königs
  rationale: עַם ist kollektiv gebraucht und umfasst die Menschen im gesamten Reich; „Bevölkerung“ ist im modernen Deutsch natürlicher als die wörtliche Wendung „das Volk der Provinzen“.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Wer … – ob Mann oder Frau –
  rationale: Diese Formulierung bewahrt die ausdrückliche Nennung beider Geschlechter und gibt zugleich die distributive Bedeutung des hebräischen Singulars in natürlichem Deutsch wieder.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: zum König in den inneren Hof kommt
  rationale: Die doppelte Richtungsangabe beschreibt das Eintreten in den beschränkten inneren Hof, um sich dem König zu nähern.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: ohne gerufen worden zu sein
  rationale: Der passive Ausdruck bezeichnet eine offizielle Vorladung oder Einladung zum König. Die relativ formale Wendung „gerufen worden“ bleibt nah am Hebräischen; „vorgeladen“ könnte fälschlich einen gerichtlichen Zwang nahelegen.
- source_word: אַחַת דָּתוֹ
  choice: für den gilt ein und dasselbe Gesetz
  rationale: Die hebräische Wendung betont, dass in jedem solchen Fall eine einzige, unveränderliche Rechtsfolge gilt. „Ein und dasselbe Gesetz“ gibt diese Festigkeit idiomatisch wieder.
- source_word: לְהָמִית
  choice: Er wird getötet
  rationale: Der Infinitiv bezeichnet die von staatlicher Seite vollstreckte Todesstrafe, nicht lediglich das Sterben der betreffenden Person.
- source_word: לְבַד מֵאֲשֶׁר
  choice: Ausgenommen ist nur, wem
  rationale: Die Formulierung markiert die einzige Ausnahme von der zuvor genannten Rechtsfolge.
- source_word: יוֹשִׁיט לוֹ
  choice: entgegenstreckt
  rationale: Das Hifil beschreibt das Ausstrecken des Zepters zu der betreffenden Person hin; „entgegenstreckt“ macht diese gerichtete Geste im Deutschen deutlich.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: das goldene Zepter
  rationale: Dies ist die natürliche deutsche Bezeichnung für das Zeichen königlicher Gunst und Begnadigung.
- source_word: וְחָיָה
  choice: der bleibt am Leben
  rationale: Die Wendung gibt das Ergebnis der königlichen Geste klar wieder, ohne über den hebräischen Text hinaus eine besondere rechtliche oder theologische Deutung einzutragen.
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: seit dreißig Tagen
  rationale: Die hebräische Zeitangabe bezeichnet einen bis zur Gegenwart reichenden Zeitraum; „seit dreißig Tagen“ ist dafür die natürliche deutsche Wiedergabe.
