  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: de
  text: Er gab ihm auch eine Abschrift[a] des Erlasstextes, der in Susa zu ihrer Vernichtung erlassen worden war, damit er sie Ester zeige, ihr den Inhalt mitteile und ihr auftrage, zum König zu gehen, ihn um Gnade anzuflehen und bei ihm für ihr Volk zu bitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das persische Lehnwort kann auch den Wortlaut eines amtlichen Schriftstücks bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: eine Abschrift des schriftlichen Erlasses
  rationale: Das persische Lehnwort kann eine Abschrift oder den Wortlaut eines amtlichen Schriftstücks bezeichnen. „Abschrift“ passt zum Überbringen und Vorzeigen des Dokuments; die Bedeutungsbreite wird in einer Fußnote festgehalten.
- source_word: הַדָּת
  choice: Erlass
  rationale: Im persischen Hofkontext des Esterbuchs bezeichnet das Wort häufig eine amtliche königliche Verfügung. „Erlass“ ist im modernen Deutschen natürlicher und genauer als das allgemeinere „Gesetz“.
- source_word: נִתַּן בְּשׁוּשָׁן לְהַשְׁמִידָם
  choice: der in Susa zu ihrer Vernichtung erlassen worden war
  rationale: Das Passiv wird im Verwaltungskontext idiomatisch mit „erlassen“ wiedergegeben; der Infinitiv bezeichnet Ziel beziehungsweise Inhalt der Verfügung. Das Plusquamperfekt verdeutlicht natürlich, dass der Erlass bereits vor der Übergabe vorlag.
- source_word: נָתַן לוֹ
  choice: Er gab ihm auch
  rationale: „Auch“ gibt den anschließenden Charakter der Handlung im Kontext wieder, ohne eine zusätzliche inhaltliche Behauptung einzuführen.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: Er sollte sie Ester zeigen und ihr erklären
  rationale: Das feminine Pronomen „sie“ bezieht sich klar auf die Abschrift. „Erklären“ gibt im Zusammenhang das Bekanntmachen des Inhalts verständlich wieder.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: und ihr nachdrücklich auftragen
  rationale: צוה hat hier eine stärkere Weisungskraft als bloßes Unterrichten. „Nachdrücklich auftragen“ bewahrt die Dringlichkeit, ohne Mordechais Stellung durch das schroffere „befehlen“ zu überzeichnen.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: zum König zu gehen
  rationale: Die natürliche deutsche Formulierung wahrt den Sinn; die gefährliche Audienzsituation ergibt sich aus dem Kontext.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: ihn um Gnade anzuflehen
  rationale: Der Hitpael von חנן bezeichnet eindringliches Flehen um Gunst oder Gnade. Die Wiedergabe erhält beide Bedeutungsaspekte.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: und vor ihm für ihr Volk zu bitten
  rationale: „Vor ihm“ bewahrt die höfische Gegenwartsaussage von מִלְּפָנָיו, während „für ihr Volk bitten“ die Fürsprache von עַל עַמָּהּ klar und idiomatisch ausdrückt.
