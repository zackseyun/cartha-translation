  to: Er gab ihm auch eine Abschrift[a] des Erlasstextes, der in Susa zu ihrer Vernichtung erlassen worden war, damit er sie Ester zeige, ihr den Inhalt mitteile und ihr auftrage, zum König zu gehen, ihn um Gnade anzuflehen und bei ihm für ihr Volk zu bitten.
  rationale: Die Revision beseitigt die deutsche Doppelung „Abschrift des schriftlichen Erlasses“ und verbindet die Handlungszwecke wieder unmittelbar mit der Dokumentübergabe. „Ihr den Inhalt mitteile“ bleibt näher bei להגיד („mitteilen, bekannt machen“) als das stärker interpretierende „ihr erklären“. Die Bedeutung und die bestehende lexikalische Fußnote bleiben erhalten.
