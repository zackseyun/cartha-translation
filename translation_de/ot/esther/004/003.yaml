base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: de
  text: Und in jeder Provinz, an jedem Ort, den das Wort des Königs und sein Erlass erreichten, herrschte unter den Juden große Trauer, mit Fasten, Weinen und Klagen; Sack und Asche wurden für viele ausgebreitet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sack und Asche wurden von vielen verwendet.« Die knappe hebräische Formulierung kann entweder besagen, dass Sack und Asche für viele ausgebreitet waren, oder allgemeiner, dass viele Menschen sie als Trauerzeichen gebrauchten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: in jeder Provinz
  rationale: Die distributive Wiederholung »Provinz und Provinz« wird im modernen Deutschen idiomatisch mit »in jeder Provinz« wiedergegeben.
- source_word: מְקוֹם אֲשֶׁר
  choice: überall, wohin
  rationale: Die Formulierung bezeichnet jeden Ort, den die königliche Mitteilung erreichte, und bewahrt die räumlich-distributive Aussage.
- source_word: דְּבַר הַמֶּלֶךְ
  choice: das Wort des Königs
  rationale: »Wort« wahrt die konkrete hebräische Ausdrucksweise; der folgende »Erlass« verdeutlicht den amtlich-rechtlichen Zusammenhang.
- source_word: וְדָתוֹ
  choice: und sein Erlass
  rationale: דת bezeichnet im Esterbuch eine amtliche rechtliche Verfügung. »Erlass« ist im persischen Hofkontext natürlich und präzise.
- source_word: מַגִּיעַ
  choice: gelangten
  rationale: Das Partizip beschreibt, wie Wort und Erlass die einzelnen Orte erreichen; wegen des zusammengesetzten Subjekts steht im Deutschen der Plural.
- source_word: אֵבֶל גָּדוֹל
  choice: große Trauer
  rationale: אבל bezeichnet intensive, auch äußerlich vollzogene Trauer angesichts drohenden Unheils.
- source_word: לַיְּהוּדִים
  choice: unter den Juden
  rationale: Die Wendung bezeichnet die betroffene Gemeinschaft; »unter den Juden« gibt dies im Deutschen natürlich wieder.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: mit Fasten, Weinen und Klagen
  rationale: Die drei Substantive entfalten die Formen der Trauer. »Klagen« bezeichnet den hörbaren beziehungsweise öffentlichen Trauervollzug, ohne künstlich altertümlich zu wirken.
- source_word: שַׂק וָאֵפֶר
  choice: Sack und Asche
  rationale: Die traditionelle biblische Wendung bezeichnet sichtbare Zeichen der Trauer und Demütigung. »Sack« meint grobes Sacktuch.
- source_word: יֻצַּע לָרַבִּים
  choice: wurden für viele ausgebreitet
  rationale: Der Hophal von יצע bedeutet wörtlich »wurde ausgebreitet/hingelegt«. Das knappe לָרַבִּים wird formal als »für viele« bewahrt; eine mögliche alternative Deutung wird in der Fußnote genannt.
