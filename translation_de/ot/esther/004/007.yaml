    rationale: In „für die Vernichtung der Juden zugunsten der Schatzkammern des Königs abzuwiegen“ kann die Präpositionalgruppe semantisch zur Vernichtung gelesen werden. Im Hebräischen bezieht sich גִּנְזֵי הַמֶּלֶךְ auf die Zahlung bzw. das Abwiegen der Geldsumme, nicht auf die Vernichtung.
  - severity: low
    issue: „zugunsten“ ist für die Einzahlung weniger unmittelbar als „für die Schatzkammern“
    rationale: Die hebräische Formulierung bezeichnet die für die königlichen Schatzkammern bestimmte Zahlung. „Für die Schatzkammern“ ist im Deutschen knapper und bindet sich klarer an „abzuwiegen“.
