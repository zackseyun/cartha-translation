  text: וַ/יַּגֶּד ל֣/וֹ מָרְדֳּכַ֔י אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וְ/אֵ֣ת פָּרָשַׁ֣ת הַ/כֶּ֗סֶף אֲשֶׁ֨ר אָמַ֤ר הָמָן֙ לִ֠/שְׁקוֹל עַל גִּנְזֵ֥י הַ/מֶּ֛לֶךְ ב/יהודיים לְ/אַבְּדָֽ/ם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: de
  text: Mordechai teilte ihm alles mit, was ihm widerfahren war, sowie die genaue Geldsumme[a], die Haman für die Schatzkammern des Königs abzuwiegen zugesagt hatte, um die Juden zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die genaue Abrechnung über das Geld“ beziehungsweise „die Geldsumme“. Der hebräische Ausdruck bezeichnet die näher bestimmte Summe, die Haman zu entrichten angeboten hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: berichtete
  rationale: Der Hifil von נגד bedeutet „mitteilen, bekannt machen“. „Berichtete“ passt natürlich dazu, dass Mordechai Hatach den gesamten Sachverhalt darlegt.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: alles, was ihm widerfahren war
  rationale: Die Form קָרָהוּ bezeichnet ausdrücklich, was Mordechai widerfahren war. „Widerfahren“ bewahrt den Bezug des Pronominalsuffixes und entspricht dem würdevollen Erzählstil.
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: die genaue Höhe der Geldsumme
  rationale: פָּרָשָׁה kann eine genaue Angabe, nähere Darlegung oder festgelegte Summe bezeichnen. Im Zusammenhang ist die konkret bezifferte Geldleistung Hamans gemeint.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: abzuwiegen zugesagt hatte
  rationale: Die Formulierung bewahrt sowohl den Äußerungscharakter von אָמַר als auch das konkrete Abwiegen des Silbers, während sie im Deutschen natürlich klingt.
- source_word: לִשְׁקוֹל
  choice: abzuwiegen
  rationale: Silber wurde nach Gewicht bemessen. „Abwiegen“ erhält dieses konkrete wirtschaftliche Bild besser als das allgemeinere „bezahlen“.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: zugunsten der Schatzkammern des Königs
  rationale: Die Wendung bezeichnet die vorgesehene Zuführung an den königlichen Schatz. Der Plural גִּנְזֵי wird mit „Schatzkammern“ erhalten.
- source_word: ביהודיים לְאַבְּדָם
  choice: für die Vernichtung der Juden
  rationale: Der Infinitiv im Piel bezeichnet das Vernichten; das Suffix bezieht sich auf die Juden. Die deutsche Fügung gibt Ziel und Betroffene klar wieder.
