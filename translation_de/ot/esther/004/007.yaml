  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist überwiegend getroffen: Mordechai berichtet Hatach, was ihm zugestoßen ist, und nennt die von Haman für die königlichen Schatzkammern vorgesehene Geldsumme im Zusammenhang mit der Vernichtung der Juden. In der vorliegenden deutschen Satzstellung wird jedoch „zugunsten der Schatzkammern“ leicht an „Vernichtung der Juden“ statt an das Abwiegen der Summe angebunden. Die Revision stellt die Bezüge eindeutig her und bewahrt das konkrete „abwiegen“.'
  naturalness: „Alles, was ihm widerfahren war“ ist modernes, würdiges Standarddeutsch. Die revidierte Konstruktion mit „teilte ihm ... mit“ ist idiomatisch und verhindert die etwas schwere Wiederholung von „ihm“.
  terminology: „Mordechai“, „Haman“, „Juden“ und „Schatzkammern des Königs“ sind passend. „Genaue Geldsumme“ gibt פָּרָשַׁת הַכֶּסֶף angemessen wieder; die Fußnote hält die lexikalische Bandbreite offen. „Vernichten“ ist eine sachgerechte, nicht übersteigernde Wiedergabe von לְאַבְּדָם.
  issues:
