revisions:
- from: Mordechai berichtete ihm alles, was ihm widerfahren war, und nannte ihm die genaue Höhe der Geldsumme[a], die Haman für die Vernichtung der Juden zugunsten der Schatzkammern des Königs abzuwiegen zugesagt hatte.
  to: Mordechai teilte ihm alles mit, was ihm widerfahren war, sowie die genaue Geldsumme[a], die Haman für die Schatzkammern des Königs abzuwiegen zugesagt hatte, um die Juden zu vernichten.
  rationale: Die Satzglieder wurden so umgestellt, dass die Schatzkammern eindeutig Ziel der zugesagten Geldzahlung sind. Die Zweckangabe der Vernichtung der Juden bleibt erhalten, ohne die konkrete Vorstellung des Abwiegens oder die Pluralform „Schatzkammern“ aufzugeben.
