base_translation:
  language: en
  yaml_path: translation/ot/esther/004/009.yaml
  text: So Hathach came and told Esther the words of Mordecai[a].
translation:
  language: de
  text: Da kam Hatach zurück und berichtete Ester, was Mordechai gesagt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Worte Mordechais“; auch: „Mordechais Botschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֖וֹא
  choice: Da kam … zurück
  rationale: בוא kann je nach Perspektive „kommen“ oder „gehen“ bedeuten. Der Zusammenhang zeigt, dass Hatach nach seinem Gespräch mit Mordechai zu Ester zurückkehrt; „zurück“ macht diese im Deutschen natürliche Erzählperspektive deutlich.
- source_word: הֲתָ֑ךְ
  choice: Hatach
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: וַיַּגֵּ֣ד
  choice: berichtete
  rationale: Das Hifil von נגד bedeutet „mitteilen, berichten“. „Berichtete“ passt zum Überbringen einer Botschaft und zum erzählerischen Register.
- source_word: לְאֶסְתֵּ֔ר
  choice: Ester
  rationale: Die mit לְ markierte Empfängerin wird im Deutschen als Dativobjekt wiedergegeben.
- source_word: אֵ֖ת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt keinen eigenen lexikalischen Gehalt und wird durch die deutsche Syntax ausgedrückt.
- source_word: דִּבְרֵ֥י מָרְדֳּכָֽי
  choice: was Mordechai gesagt hatte
  rationale: Wörtlich „die Worte Mordechais“. Die gewählte Formulierung gibt den Sinn im modernen Deutschen natürlich wieder, ohne festzulegen, ob einzelne Worte oder die gesamte Botschaft gemeint sind.
