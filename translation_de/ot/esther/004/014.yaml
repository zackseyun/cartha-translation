source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: de
  text: Denn wenn du zu dieser Zeit ganz und gar schweigst, werden den Juden von anderer Stelle Erleichterung und Rettung zuteilwerden; du aber und das Haus deines Vaters, ihr werdet umkommen. Und wer weiß, ob du für eine Zeit wie diese zur Königswürde gelangt bist?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Die Verbindung leitet eine begründende Bedingung ein und knüpft an den vorherigen Vers an.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: ganz und gar schweigst
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Schweigen; die deutsche Wendung gibt diesen Nachdruck natürlich wieder.
- source_word: בָּעֵת הַזֹּאת
  choice: in dieser Zeit
  rationale: Die Formulierung bezeichnet die gegenwärtige Krisenzeit und stellt zugleich den Bezug zur entsprechenden Wendung am Versende her.
- source_word: רֶוַח וְהַצָּלָה
  choice: Erleichterung und Rettung
  rationale: רֶוַח bezeichnet hier Erleichterung oder Aufatmen aus der Bedrängnis, הַצָּלָה die konkrete Rettung; beide Begriffe bleiben unterscheidbar.
- source_word: יַעֲמוֹד
  choice: zuteilwerden
  rationale: Das wörtliche „aufstehen“ bezeichnet in diesem Zusammenhang das Eintreten beziehungsweise Hervortreten von Hilfe. „Zuteilwerden“ ist im Deutschen idiomatisch und bewahrt die Aussage, dass Rettung für die Juden entstehen wird.
- source_word: מִמָּקוֹם אַחֵר
  choice: von einem anderen Ort her
  rationale: Die örtliche und bewusst unbestimmte Ausdrucksweise des Hebräischen bleibt erhalten, ohne den nicht ausdrücklich genannten Urheber der Rettung einzusetzen.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: du aber und das Haus deines Vaters
  rationale: „Haus deines Vaters“ bewahrt den hebräischen Verwandtschafts- und Sippenbegriff; „aber“ gibt den sachlichen Gegensatz im Zusammenhang wieder.
- source_word: תֹּאבֵדוּ
  choice: ihr werdet umkommen
  rationale: Das Verb kann Tod und Untergang bezeichnen. „Umkommen“ gibt die ernste Warnung wieder, ohne sie unnötig einzuengen.
- source_word: וּמִי יוֹדֵעַ
  choice: Und wer weiß
  rationale: Die feste rhetorische Wendung eröffnet eine Möglichkeit, ohne Gewissheit zu behaupten.
- source_word: אִם לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת
  choice: ob du für eine Zeit wie diese zur Königswürde gelangt bist
  rationale: „Ob“ bewahrt die offene Möglichkeit von אִם. „Zur Königswürde gelangt“ gibt das Erreichen der königlichen Stellung natürlich wieder, ohne einen ausdrücklich genannten göttlichen Zweck hinzuzufügen.
theological_decisions:
- issue: Angedeutete Vorsehung in „von einem anderen Ort her“ und „für eine Zeit wie diese“
  choice: Die indirekte Ausdrucksweise bleibt bestehen; Gott wird im Haupttext nicht ausdrücklich genannt.
  alternative: „von Gott“ beziehungsweise „für diesen von Gott bestimmten Zeitpunkt“
  rationale: Der Zusammenhang legt göttliche Vorsehung nahe, doch der hebräische Vers nennt Gott nicht ausdrücklich. Die Übersetzung bewahrt diese theologische Spannung und Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „in dieser Zeit“ / „für eine Zeit wie diese“ bildet die zeitliche Rahmung des hebräischen Verses ab. Die leicht feierliche Wendung „zur Königswürde gelangt“ passt zum höfischen Kontext, bleibt aber allgemein verständlich.
