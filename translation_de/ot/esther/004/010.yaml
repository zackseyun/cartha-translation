  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: de
  text: Da sagte Ester zu Hatach und beauftragte ihn, zu Mordechai zu gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da sagte Ester zu Hatach und beauftragte ihn zu Mordechai.“ Gemeint ist, dass Hatach zu Mordechai gehen sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das konsekutive וַ führt die Erzählung weiter; „Da“ gibt diesen Fortgang natürlich wieder. אמר wird mit seinem gewöhnlichen Sinn „sagen“ übersetzt.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Schreibweise.
- source_word: לַהֲתָךְ
  choice: zu Hatach
  rationale: Die Präposition ל kennzeichnet den Adressaten von Esters Worten; der Name wird nach gebräuchlicher deutscher Konvention wiedergegeben.
- source_word: וַתְּצַוֵּהוּ
  choice: und beauftragte ihn
  rationale: Das Piel von צוה bezeichnet ein verbindliches Anweisen oder Beauftragen. „Beauftragte“ bewahrt die Verbindlichkeit und klingt im Deutschen in diesem Botenkontext natürlich; das Suffix „ihn“ bezieht sich auf Hatach.
- source_word: אֶל
  choice: zu gehen
  rationale: אֶל bezeichnet die Richtung „zu/auf … zu“. Da im Hebräischen nach „beauftragte ihn“ nur die Zielangabe folgt, wird das im Deutschen notwendige „zu gehen“ aus dem Zusammenhang ergänzt.
- source_word: מָרְדֳּכָי
  choice: Mordechai
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Schreibweise.
