  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: de
  text: Da ging Mordechai weg und tat alles, was Ester ihm befohlen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da ging Mordechai weiter“ oder „Da zog Mordechai fort“. Das hebräische Verb bedeutet wörtlich „hinübergehen“ oder „vorübergehen“; hier bezeichnet es wahrscheinlich Mordechais Aufbruch, um Esters Anweisung auszuführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: ging … weg
  rationale: עבר bezeichnet wörtlich ein Hinüber- oder Vorübergehen. Im Erzählzusammenhang ist wahrscheinlich gemeint, dass Mordechai fortging, um Esters Anweisung auszuführen; „ging weg“ gibt dies natürlich wieder, ohne eine konkrete Überquerung anzunehmen.
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עשה ist das gewöhnliche Verb für „tun/machen“. „tat“ bewahrt den schlichten Erzählstil und vermeidet die stärkere Auslegung „führte aus“.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles, was
  rationale: Die deutsche Wendung gibt sowohl die umfassende Bedeutung von כֹּל als auch die Übereinstimmung mit Esters Auftrag idiomatisch wieder.
- source_word: צִוְּתָה
  choice: befohlen hatte
  rationale: צוה bedeutet „befehlen/anweisen“. Das Plusquamperfekt kennzeichnet Esters vorausgehenden Auftrag; „befohlen“ erhält die Autorität des Verbs.
- source_word: עָלָיו
  choice: ihm
  rationale: Bei צוה kennzeichnet על die Person, der etwas befohlen wird. Im Deutschen ist dafür der Dativ „ihm“ idiomatisch.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Der Personenname wird in der im modernen deutschen Bibelgebrauch üblichen Form „Ester“ wiedergegeben.
