base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: de
  text: Als Mordechai alles erfuhr, was geschehen war, zerriss er seine Kleider, zog ein Gewand aus Sacktuch an und bedeckte sich mit Asche. Dann ging er hinaus in die Mitte der Stadt und stieß einen lauten, bitteren Klageschrei aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „schrie einen großen und bitteren Schrei“. Im Hebräischen stehen ein Verb und ein davon abgeleitetes Substantiv zusammen, um den Ausdruck zu verstärken.'
    reason: Die hebräische figura etymologica und die wörtliche Bedeutung von גְדֹלָה lassen sich im natürlichen deutschen Haupttext nicht vollständig zugleich abbilden.
lexical_decisions:
- source_word: יָדַע
  choice: erfuhr
  rationale: Das Verb bezeichnet hier, dass Mordechai von den Vorgängen Kenntnis erhielt. „Erfuhr“ gibt diesen ingressiven Sinn im Deutschen natürlich wieder.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: alles, was geschehen war
  rationale: Die Formulierung bewahrt den umfassenden Bezug und passt als Vorvergangenheit zur Erzählfolge. Das hebräische Passiv kann in diesem Zusammenhang sowohl Geschehenes als auch Getanes umfassen.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: zerriss er seine Kleider
  rationale: Dies ist eine klare, gegenwärtige Wiedergabe der damaligen Trauergeste, ohne altertümliche Ausdrucksweise.
- source_word: שַׂק וָאֵפֶר
  choice: zog ein Gewand aus Sacktuch an und bedeckte sich mit Asche
  rationale: Die Wiedergabe macht die beiden Zeichen von Trauer und Erniedrigung für heutige Leser verständlich, ohne „Sacktuch“ durch eine allgemeinere Deutung zu ersetzen.
- source_word: בְּתוֹךְ הָעִיר
  choice: mitten in die Stadt
  rationale: Die räumliche Bedeutung „in die Mitte/inmitten der Stadt“ wird bewahrt; die Satzstellung mit „hinaus“ ergibt natürliches Deutsch.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: stieß einen lauten, bitteren Klageschrei aus
  rationale: „Klageschrei“ bringt die emotionale Situation zum Ausdruck, „laut“ gibt die hörbare Intensität von גְדֹלָה idiomatisch wieder, und „bitter“ bewahrt die starke Wertung des Ausgangstextes. Die figura etymologica wird in der Fußnote kenntlich gemacht.
