lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging … hinaus
  rationale: Die Wayyiqtol-Form erzählt eine abgeschlossene Handlung; „hinausgehen“ bewahrt die Richtungsnuance des Verlassens des inneren Bereichs.
- source_word: הֲתָךְ
  choice: Hatach
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, hebräisch orientierten Form wiedergegeben.
- source_word: אֶל מָרְדֳּכָי
  choice: zu Mordechai
  rationale: אֶל bezeichnet hier das Ziel der Bewegung; „zu Mordechai“ ist im Deutschen natürlich und genau.
- source_word: אֶל רְחוֹב הָעִיר
  choice: auf den freien Platz der Stadt
  rationale: רְחוֹב meint hier eine breite, öffentliche Freifläche beziehungsweise einen Platz und nicht notwendig eine Straße im heutigen Sinn.
- source_word: אֲשֶׁר לִפְנֵי
  choice: vor
  rationale: Die knappe räumliche Angabe gibt die Lage des Platzes unmittelbar vor dem Tor idiomatisch wieder.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: Tor des Königs
  rationale: Die Genitivverbindung entspricht dem hebräischen Konstrukt und wahrt den wiederkehrenden Ausdruck im Esterbuch.
