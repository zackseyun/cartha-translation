lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da wies ... an
  rationale: Das Narrativ-Waw führt die Handlung weiter. In Verbindung mit dem folgenden Infinitiv gibt „wies ... an“ den beauftragenden Sinn im Deutschen natürlich wieder.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Gebräuchliche deutsche Form des Eigennamens.
- source_word: לְהָשִׁיב
  choice: zu antworten
  rationale: Der Hifil-Infinitiv von שוב bedeutet hier idiomatisch, eine Antwort zurückgehen zu lassen, also zu antworten. Die Formulierung bewahrt den Bezug auf die vorausgehende Botschaft.
- source_word: אֶל
  choice: Mordechai zu
  rationale: Die Präposition bezeichnet die Richtung auf Mordechai hin und wird bei „antworten“ im Deutschen durch die Dativkonstruktion wiedergegeben.
- source_word: מָרְדֳּכָי
  choice: Mordechai
  rationale: Gebräuchliche deutsche Form des Eigennamens.
