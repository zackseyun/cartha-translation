base_translation:
  language: en
  yaml_path: translation/ot/esther/004/013.yaml
  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: de
  text: 'Da sagte Mordechai, man solle Ester antworten: „Bilde dir nicht ein, du allein von allen Juden könntest im Haus des Königs entkommen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב
  choice: Da sagte Mordechai, man solle … antworten
  rationale: Die knappe hebräische Konstruktion mit לְ plus Infinitiv wird im Deutschen natürlich als indirekter Auftrag wiedergegeben; ein ausdrückliches Objekt wie „ihnen“ steht im Vers nicht.
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: Bilde dir nicht ein
  rationale: Die idiomatische Wendung bezeichnet eine Vorstellung oder innere Annahme; die deutsche Formulierung gibt das natürlich und mit dem warnenden Ton des Originals wieder.
- source_word: לְהִמָּלֵט בֵּית הַמֶּלֶךְ
  choice: im Haus des Königs entkommen
  rationale: בֵּית הַמֶּלֶךְ bezeichnet den königlichen Haushalt beziehungsweise Palastbereich. „Haus des Königs“ bewahrt die Bildsprache und lässt den institutionellen Sinn offen.
- source_word: מִכָּל הַיְּהוּדִים
  choice: du allein von allen Juden
  rationale: 'Das vergleichende מִן ist hier im Sinn einer Ausnahme beziehungsweise eines Sonderstatus zu verstehen: Ester soll nicht meinen, sie werde anders als alle übrigen Juden verschont. „Du allein von allen“ macht diesen Sinn im Deutschen klar.'
theological_decisions:
- issue: Esters mögliche Sonderstellung im Königshaus
  choice: „du allein von allen Juden“
  alternative: „eher als alle Juden“ / „mehr als alle Juden“
  rationale: Der Satz bestreitet, dass Esters Stellung im Königshaus ihr als einziger Jüdin Rettung sichern werde. Die Übersetzung beschränkt sich auf diese Aussage und nimmt die Begründung des folgenden Verses nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mordechai“ folgt der im Deutschen verbreiteten Namensform; „Ester“ entspricht der heutigen deutschen Bibelschreibung. Die direkte Rede bleibt eindringlich, ohne altertümliche Wendungen.
