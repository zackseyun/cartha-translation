lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: Da überbrachten sie
  rationale: Das Hifil-Wayyiqtol von נגד führt die nächste Handlung der Erzählung ein. „Überbrachten“ gibt die Weitergabe der Äußerung natürlich wieder und lässt das im Hebräischen unbestimmte Subjekt im Plural als „sie“ stehen.
- source_word: לְמָרְדֳּכָי
  choice: Mordechai
  rationale: Die Präposition לְ kennzeichnet den Empfänger; im Deutschen wird dies hier durch den Akkusativ bei „überbringen“ ausgedrückt. Der Personenname wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: אֵת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung; seine Funktion kommt im Satzbau zum Ausdruck.
- source_word: דִּבְרֵי
  choice: Worte
  rationale: Der Status constructus Plural von דָּבָר kann „Worte“, „Botschaft“ oder kontextuell „Antwort“ bedeuten. „Worte“ ist formal transparent und bewahrt den Bezug auf Esters Äußerung.
- source_word: אֶסְתֵּר
  choice: Esters
  rationale: Die Constructus-Verbindung wird im Deutschen durch den vorangestellten Genitiv des Namens ausgedrückt.
