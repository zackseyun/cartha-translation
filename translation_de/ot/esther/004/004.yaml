  text: וַ֠/תָּבוֹאינָה נַעֲר֨וֹת אֶסְתֵּ֤ר וְ/סָרִיסֶ֨י/הָ֙ וַ/יַּגִּ֣ידוּ לָ֔/הּ וַ/תִּתְחַלְחַ֥ל הַ/מַּלְכָּ֖ה מְאֹ֑ד וַ/תִּשְׁלַ֨ח בְּגָדִ֜ים לְ/הַלְבִּ֣ישׁ אֶֽת מָרְדֳּכַ֗י וּ/לְ/הָסִ֥יר שַׂקּ֛/וֹ מֵ/עָלָ֖י/ו וְ/לֹ֥א קִבֵּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: de
  text: Esters Dienerinnen[a] und ihre Eunuchen[b] kamen und berichteten ihr davon. Da geriet die Königin in große Bestürzung. Sie schickte Kleider, um Mordechai damit zu bekleiden und ihm sein Sacktuch[c] abzunehmen; doch er nahm sie nicht an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „junge Frauen“; gemeint sind hier Esters weibliche Bedienstete.'
    reason: lexical_alternative
  - marker: b
    text: „Eunuchen“ kann in manchen Zusammenhängen auch allgemeiner königliche Hofbeamte bezeichnen; am persischen Königshof ist hier wahrscheinlich die konkretere Bedeutung gemeint.
    reason: cultural_note
  - marker: c
    text: Ein Sacktuch war ein Gewand aus grobem Stoff, das als Zeichen von Trauer, Leid oder Demütigung getragen wurde.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: Dienerinnen
  rationale: Im höfischen Zusammenhang bezeichnet das Wort die jungen Frauen, die Esther dienten. „Dienerinnen“ gibt ihre Funktion in natürlichem modernem Deutsch wieder; die wörtlichere Alternative „junge Frauen“ bleibt in der Fußnote erhalten.
- source_word: וְסָרִיסֶיהָ
  choice: und ihre Eunuchen
  rationale: סָרִיס bezeichnet am Königshof gewöhnlich Eunuchen, kann aber auch allgemeiner Hofbeamte meinen. Der konkrete Ausdruck wahrt hier den historisch und lexikalisch naheliegenden Sinn.
- source_word: וַיַּגִּידוּ לָהּ
  choice: kamen und berichteten ihr davon
  rationale: Die Formulierung bewahrt sowohl das Herbeikommen als auch die Mitteilung. „Davon“ nimmt idiomatisch auf Mordechais zuvor geschildertes Verhalten Bezug.
- source_word: וַתִּתְחַלְחַל ... מְאֹד
  choice: geriet ... in große Bestürzung
  rationale: Das Verb bezeichnet heftige innere Erschütterung oder ein Erbeben. Die deutsche Wendung vermittelt die starke emotionale Reaktion, ohne die Bedeutung unnötig auf körperliches Zittern festzulegen.
- source_word: בְּגָדִים
  choice: Kleider
  rationale: „Kleider“ bezeichnet hier Kleidung und passt zum würdevollen Erzählstil, ohne altertümlich zu wirken.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: damit man Mordechai anzog
  rationale: Der hebräische Infinitiv drückt den Zweck der Sendung aus. Die unpersönliche Konstruktion ist im Deutschen natürlicher als die missverständliche Formulierung, Esther habe ihn selbst ankleiden wollen.
- source_word: שַׂקּוֹ
  choice: sein Trauergewand
  rationale: שַׂק meint das grobe Tuch beziehungsweise das daraus gefertigte Gewand, das als Zeichen von Trauer getragen wurde. „Trauergewand“ vermittelt die Funktion unmittelbar; die Fußnote erläutert Material und Brauch.
- source_word: וְלֹא קִבֵּל
  choice: doch er nahm sie nicht an
  rationale: Das nicht ausdrücklich genannte Objekt sind die gesandten Kleider. Das Pronomen „sie“ macht diesen Bezug deutlich und „nahm ... nicht an“ gibt die Verweigerung idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssigem Erzählrhythmus. Die Wiederaufnahme mit „Da“ trennt Esters Reaktion klar vom Bericht ihrer Bediensteten. Alle Fußnotenmarker stehen unmittelbar bei dem erläuterten Ausdruck.
