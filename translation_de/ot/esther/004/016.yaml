source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: de
  text: Geh, versammle alle Juden, die sich in Susa befinden, und fastet für mich.[a] Esst und trinkt drei Tage lang nichts, weder bei Nacht noch bei Tag. Auch ich und meine Dienerinnen[b] werden ebenso fasten. Danach werde ich zum König gehen, obwohl es gegen das Gesetz ist.[c] Und wenn ich umkomme, dann komme ich um.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »fastet meinetwegen« beziehungsweise »fastet für mein Anliegen«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch »junge Frauen« oder »weibliche Bedienstete« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »obwohl es nicht dem Gesetz entspricht«.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: »Und wenn ich umkommen muss, komme ich um.« Die hebräische Formulierung ist knapp und nachdrücklich und bringt Esters Bereitschaft zum Ausdruck, das Risiko auf sich zu nehmen.'
    reason: ambiguity
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: Geh, versammle
  rationale: Die beiden Imperative werden direkt und in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: alle Juden, die sich in Susa befinden
  rationale: Die Formulierung bewahrt die Bedeutung des Partizips הנמצאים als »sich befinden/anwesend sein«, ohne im Deutschen künstlich zu wirken.
- source_word: וְצוּמוּ עָלַי
  choice: und fastet für mich
  rationale: עַל bezeichnet hier Esters Person und Anliegen als Bezug des Fastens; »für mich« ist knapp und natürlich.
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: Esst und trinkt drei Tage lang nichts, weder bei Nacht noch bei Tag
  rationale: Die beiden Verbote und die ununterbrochene Dauer werden idiomatisch und vollständig ausgedrückt.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי אָצוּם כֵּן
  choice: Auch ich und meine Dienerinnen werden ebenso fasten
  rationale: נערות bezeichnet hier wahrscheinlich Esters weibliches Dienst- oder Begleitpersonal; »Dienerinnen« ist im Kontext präziser als das allgemeinere »junge Frauen«.
- source_word: וּבְכֵן אָבוֹא אֶל הַמֶּלֶךְ
  choice: Danach werde ich zum König gehen
  rationale: ובכן markiert hier den zeitlichen und folgernden Übergang nach dem Fasten.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: obwohl es gegen das Gesetz ist
  rationale: Der Relativsatz hat im Zusammenhang eine konzessive Funktion; »gegen das Gesetz« gibt לא כדת klar und knapp wieder.
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: Und wenn ich umkomme, dann komme ich um
  rationale: Die Wiederholung bleibt erhalten und vermittelt die knappe, entschlossene Annahme des tödlichen Risikos; כאשר kann hier konditional verstanden werden.
theological_decisions:
- issue: Bedeutung des Fastens für Ester
  choice: fastet für mich
  alternative: fastet meinetwegen / für mein Anliegen
  rationale: Der Text nennt weder Gebet noch ausdrücklich eine Bitte an Gott. Die Übersetzung wahrt diese auffällige Zurückhaltung des Esterbuches und ergänzt keine theologische Deutung.
- issue: Modalität von וְכַאֲשֶׁר אָבַדְתִּי
  choice: wenn ich umkomme
  alternative: wenn ich umkommen muss / sobald ich umkomme
  rationale: Die hebräische Wendung ist knapp und kann konditional oder stärker eventual verstanden werden. Die Hauptfassung bewahrt die geläufige konditionale Lesart, während die Fußnote die Nuance erläutert.
translation_notes:
  register: Modernes Standarddeutsch mit direkter, würdiger Rede. Die imperativische Dringlichkeit und die emphatische Schlusswiederholung bleiben erhalten; veraltete Ausdrücke wie »Mägde« werden vermieden.
