base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: de
  text: Dann ließ Ester Hatach[a] rufen, einen von den Eunuchen des Königs, den dieser zu ihrem Dienst bestellt hatte. Sie beauftragte ihn, in Bezug auf Mordechai herauszufinden, was das sei und warum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen von den Hofbeamten des Königs“. Das hebräische Wort kann einen Eunuchen im engeren Sinn oder, je nach Zusammenhang, allgemeiner einen königlichen Beamten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא ... לַהֲתָךְ
  choice: Dann ließ Ester Hatach rufen
  rationale: Das Wayyiqtol führt die Erzählung weiter. Die deutsche Wendung „jemanden rufen lassen“ gibt die Einbestellung Hatachs natürlich wieder.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: einen von den Eunuchen des Königs
  rationale: סָרִיס bezeichnet häufig konkret einen Eunuchen am Königshof, kann aber auch allgemeiner einen Hofbeamten meinen; die konkrete Grundbedeutung steht im Haupttext, die weitere Möglichkeit in der Fußnote.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: den dieser zu ihrem Dienst bestellt hatte
  rationale: „Dieser“ nimmt als natürlichstes Subjekt den König auf. Die Formulierung vermittelt sowohl die offizielle Zuweisung als auch den persönlichen Dienst, ohne das hebräische Bild „vor sie gestellt“ unnatürlich nachzuahmen.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: Sie beauftragte ihn, in Bezug auf Mordechai
  rationale: צוה besitzt verpflichtende Kraft; „beauftragte“ passt hier zu einer dienstlichen Anweisung. עַל kennzeichnet die Angelegenheit, auf die sich der Auftrag bezieht.
- source_word: לָדַעַת מַה זֶּה וְעַל מַה זֶּה
  choice: herauszufinden, was dies sei und aus welchem Grund
  rationale: Der Zwecksatz bezeichnet eine Erkundigung. Die Übersetzung bewahrt die Unterscheidung zwischen der Frage nach dem Sachverhalt und der Frage nach seinem Grund; die Ellipse im zweiten Glied bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweiteilige Schlussfrage bleibt bewusst knapp und leicht offen, damit die hebräische Ausdrucksweise nicht auf Mordechais Verhalten oder eine bestimmte Deutung des Geschehens verengt wird.
