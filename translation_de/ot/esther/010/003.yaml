base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: de
  text: Denn Mordechai, der Jude, war der Zweite nach König Ahasveros. Er war angesehen unter den Juden und bei der Menge seiner Brüder[a] beliebt. Er suchte das Wohl seines Volkes und sprach allen seinen Nachkommen Frieden zu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei der Mehrheit seiner Brüder“. Mit „Brüdern“ sind hier seine jüdischen Volksgenossen gemeint. Das Hebräische kann eine Menge oder eine Mehrheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu all seinem Samen“. „Samen“ ist im Hebräischen ein Kollektivbegriff und kann Nachkommen beziehungsweise Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorangehende Zusammenfassung und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: הַיְּהוּדִי
  choice: der Jude
  rationale: Die Bezeichnung markiert Mordechais ethnisch-religiöse Zugehörigkeit im persischen Umfeld; „der Jude“ ist hier klarer und kontextgemäßer als „der Judäer“.
- source_word: מִשְׁנֶה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: der Zweite nach König Ahasveros
  rationale: Die Formulierung bezeichnet den zweithöchsten Rang nach dem König, ohne einen bestimmten Amtstitel wie „Wesir“ in den Text einzutragen.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: angesehen unter den Juden
  rationale: „Angesehen“ vermittelt Mordechais hohe gesellschaftliche Stellung in natürlichem modernem Deutsch; wörtlich steht „groß“.
- source_word: וְרָצוּי
  choice: beliebt
  rationale: Das Wort bezeichnet wohlwollende Annahme beziehungsweise Zustimmung innerhalb der Gemeinschaft.
- source_word: לְרֹב אֶחָיו
  choice: bei der großen Mehrheit seiner Brüder
  rationale: רֹב kann „Menge“ oder „Mehrheit“ bedeuten. „Große Mehrheit“ bewahrt die mögliche, im Zusammenhang bemerkenswerte Einschränkung, dass die Zustimmung nicht notwendig ausnahmslos war.
- source_word: אֶחָיו
  choice: seiner Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext erhalten; der gemeinschaftliche Sinn „jüdische Volksgenossen“ wird in einer Fußnote erläutert.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: Er suchte das Wohl seines Volkes
  rationale: „Das Wohl suchen“ gibt die aktive Ausrichtung auf das Gute für das Volk eng und zugleich idiomatisch wieder.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: und sprach Frieden
  rationale: Die bewusst offene hebräische Wendung bleibt erhalten; שָׁלוֹם umfasst Frieden, Wohlergehen und Unversehrtheit.
- source_word: לְכָל זַרְעוֹ
  choice: zu allen ihren Nachkommen
  rationale: Das Suffix bezieht sich grammatisch am natürlichsten auf עַמּוֹ, „sein Volk“; deshalb ist kollektiver Nachwuchs beziehungsweise die Nachkommenschaft seines Volkes gemeint. „Nachkommen“ gibt זֶרַע in diesem Zusammenhang verständlich wieder.
