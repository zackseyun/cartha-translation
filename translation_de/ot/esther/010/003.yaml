translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit geteilt. Die ungewöhnliche Wendung „sprach Frieden“ bewahrt die Bild- und Bedeutungsbreite des Hebräischen. Die Mehrdeutigkeit von רֹב und der mögliche Bezug des maskulinen Suffixes in זַרְעוֹ werden nicht stillschweigend eingeebnet, sondern in den Fußnoten offengelegt.
