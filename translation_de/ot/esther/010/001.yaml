  text: וַ/יָּשֶׂם֩ הַ/מֶּ֨לֶךְ אחשרש מַ֛ס עַל הָ/אָ֖רֶץ וְ/אִיֵּ֥י הַ/יָּֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: de
  text: König Ahasveros legte dem Land und den Inseln des Meeres[a] eine Abgabe[b] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Küstenländern«. Das hebräische Wort kann Inseln oder Küstengebiete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen Tribut« beziehungsweise »eine Steuer«. Das hebräische Wort kann in manchen Zusammenhängen auch Frondienst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: legte … auf
  rationale: Die Verbindung שׂוּם מַס עַל bezeichnet das Auferlegen einer Abgabe. Die deutsche Wendung ist idiomatisch und bleibt nahe am hebräischen Bild.
- source_word: הַמֶּלֶךְ אחשרש
  choice: König Ahasveros
  rationale: Vor einem Eigennamen steht der Titel im Deutschen natürlich ohne Artikel. »Ahasveros« ist die im Deutschen etablierte biblische Namensform.
- source_word: מַס
  choice: Abgabe
  rationale: Das Wort kann eine Steuer, einen Tribut oder Frondienst bezeichnen. »Abgabe« lässt die genaue fiskalisch-politische Ausgestaltung offen; die weiteren Möglichkeiten werden in einer Fußnote genannt.
- source_word: הָאָרֶץ
  choice: dem Land
  rationale: Im Zusammenhang ist das Herrschaftsgebiet gemeint, nicht die gesamte Erde. »Land« bewahrt die geografische Weite, ohne sie näher festzulegen.
- source_word: וְאִיֵּי הַיָּם
  choice: und den Inseln des Meeres
  rationale: Die formnahe Wiedergabe erhält den geografischen Ausdruck; אִיִּים kann daneben auch Küstenländer bezeichnen, was die Fußnote festhält.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich deutsch; zugleich bleiben die imperiale Reichweite und die lexikalische Mehrdeutigkeit der Abgabe sichtbar.
