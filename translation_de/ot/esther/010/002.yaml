  register: Moderne, würdevolle Standardsprache mit annalistischem Ton. Die rhetorische Frage und die gehobene Paarformel „Macht und Stärke“ bleiben erhalten; unnötige konfessionelle oder interpretierende Zusätze wurden vermieden.
