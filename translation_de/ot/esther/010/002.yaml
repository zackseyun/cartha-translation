source:
  edition: WLC
  text: וְ/כָל מַעֲשֵׂ֤ה תָקְפּ/וֹ֙ וּ/גְב֣וּרָת֔/וֹ וּ/פָרָשַׁת֙ גְּדֻלַּ֣ת מָרְדֳּכַ֔י אֲשֶׁ֥ר גִּדְּל֖/וֹ הַ/מֶּ֑לֶךְ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֨פֶר֙ דִּבְרֵ֣י הַ/יָּמִ֔ים לְ/מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: de
  text: Und alle Taten seiner Macht und Stärke und der ausführliche Bericht über Mordechais Größe, zu der ihn der König erhoben hatte – sind sie nicht im Buch der Chronik der Könige von Medien und Persien aufgezeichnet?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: Taten
  rationale: Der Ausdruck bezeichnet allgemein das, was vollbracht wurde; „Taten“ passt zum Stil eines königlichen Geschichtsabrisses.
- source_word: תָקְפּוֹ
  choice: seiner Macht
  rationale: Das Substantiv bezeichnet Kraft, Geltung oder wirksame Macht und verweist hier auf die politische Macht des Königs.
- source_word: גְבוּרָתוֹ
  choice: Stärke
  rationale: Neben תָקְפּוֹ bezeichnet das Wort Stärke oder machtvolle Tüchtigkeit; „Stärke“ bewahrt die Paarung, ohne sie völlig zu verdoppeln.
- source_word: וּפָרָשַׁת
  choice: der ausführliche Bericht
  rationale: Das seltene Substantiv bezeichnet eine nähere beziehungsweise ausführliche Darlegung; die Formulierung ist im Deutschen klar und natürlich.
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: Mordechais Größe
  rationale: Die Wendung kann Größe, hohe Stellung oder Ansehen bezeichnen. „Größe“ erhält die Breite und den formellen Ton des Hebräischen.
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: zu der ihn der König erhoben hatte
  rationale: Das Piel von גדל bedeutet hier, jemanden groß zu machen beziehungsweise in Rang und Ansehen zu erhöhen. Die relative Formulierung wahrt den Bezug auf Mordechais Größe.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: sind sie nicht ... aufgezeichnet?
  rationale: Die rhetorische Frage wird beibehalten; „aufgezeichnet“ klingt bei amtlichen Annalen im modernen Deutschen natürlicher als das wörtliche „geschrieben“.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chronik
  rationale: Die Wendung bezeichnet ein amtliches Geschichts- oder Annalenwerk. „Buch der Chronik“ bewahrt die Buchbezeichnung und ist verständlich.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: der Könige von Medien und Persien
  rationale: Das לְ kennzeichnet hier wahrscheinlich die Zuordnung des Chronikwerks zu den Königen; der deutsche Genitiv gibt dies idiomatisch wieder.
theological_decisions: []
