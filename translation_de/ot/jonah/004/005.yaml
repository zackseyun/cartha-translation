base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/005.yaml
  text: Then Jonah went out from the city and sat east of the city[b][a]. There he made himself a shelter and sat under it in the shade until he would see what would happen in the city.
translation:
  language: de
  text: Jona ging aus der Stadt hinaus und setzte sich östlich der Stadt nieder. Dort baute er sich eine Laubhütte[a] und setzte sich darunter in den Schatten, bis er sehen würde, was in der Stadt geschehen würde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „eine Hütte“ beziehungsweise „einen Unterstand“. Das hebräische Wort bezeichnet eine vorübergehende Schutzkonstruktion, oft aus Zweigen oder Laub.
    reason: lexical_alternative
  - marker: b
    text: Oder „was aus der Stadt werden würde“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... מִן־הָעִיר
  choice: ging aus der Stadt hinaus
  rationale: יצא mit מן bezeichnet das Hinausgehen beziehungsweise Verlassen eines Ortes. Die Formulierung ist im Deutschen natürlich und bildet die räumliche Bewegung ausdrücklich ab.
- source_word: וַיֵּשֶׁב מִקֶּדֶם לָעִיר
  choice: setzte sich östlich der Stadt nieder
  rationale: ישׁב kann sowohl „sitzen“ als auch „sich niederlassen/bleiben“ bedeuten; hier passt „sich niederlassen“ zu Jonas längerem Aufenthalt. מִקֶּדֶם לָעִיר bezeichnet am wahrscheinlichsten einen Ort östlich der Stadt.
- source_word: וַיַּעַשׂ לוֹ שָׁם סֻכָּה
  choice: Dort baute er sich eine Laubhütte
  rationale: Das benefaktive לוֹ wird mit „sich“ wiedergegeben. סֻכָּה bezeichnet eine einfache, vorübergehende Schutzkonstruktion, typischerweise aus Zweigen oder Laub; „Laubhütte“ ist konkret und quellennah.
- source_word: וַיֵּשֶׁב תַּחְתֶּיהָ בַּצֵּל
  choice: setzte sich darunter in den Schatten
  rationale: Das feminine Suffix verweist auf die Laubhütte. צֵל meint hier den schützenden Schatten vor der Sonne; „Schatten“ ist im Deutschen idiomatisch.
- source_word: עַד אֲשֶׁר יִרְאֶה
  choice: bis er sehen konnte
  rationale: Die Konstruktion beschreibt Jonas abwartende Haltung mit Blick auf ein noch ausstehendes Ergebnis. „Bis er sehen konnte“ bewahrt diese zeitliche und prospektive Bedeutung in natürlichem Deutsch.
- source_word: מַה יִּהְיֶה בָּעִיר
  choice: was in der Stadt geschehen würde
  rationale: Die Wendung fragt offen nach dem künftigen Geschehen beziehungsweise Ausgang. Die Übersetzung wahrt diese Offenheit, ohne ausdrücklich eine Vernichtung oder Rettung vorwegzunehmen.
theological_decisions:
- issue: Jonas erwarteter Ausgang für Ninive
  choice: 'Der Ausgang bleibt unbestimmt: „was in der Stadt geschehen würde“.'
  alternative: Eine erwartete Vernichtung der Stadt ausdrücklich nennen.
  rationale: Der hebräische Text nennt an dieser Stelle nur das künftige Geschehen und legt Jonas konkrete Erwartung nicht ausdrücklich fest. Die Übersetzung ergänzt daher keine theologische oder psychologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Wiederholung von וַיֵּשֶׁב wird durch „setzte sich … nieder“ und „setzte sich“ erkennbar gehalten, ohne im Deutschen unnötig schwerfällig zu wirken. Sämtliche Fußnotenmarker stehen unmittelbar an den erläuterten Textstellen.
