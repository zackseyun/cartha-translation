  source_fidelity: 'Die Wiedergabe von קִיקָיוֹן als „Kikajonpflanze“ und die Fußnote bewahren die unsichere botanische Identifikation angemessen. „Not“ ist für רָעָתוֹ im Kontext vertretbar und legt keine moralische Bedeutung fest. Die bisherige Verbindung „bestimmte eine Kikajonpflanze“ bildet מנה zwar formal nach, ist im Deutschen jedoch semantisch und idiomatisch unklar: Eine Pflanze wird nicht ohne Ergänzung „bestimmt“.'
