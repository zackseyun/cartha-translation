  text: וַ/יְמַ֣ן יְהוָֽה אֱ֠לֹהִים קִיקָי֞וֹן וַ/יַּ֣עַל מֵ/עַ֣ל לְ/יוֹנָ֗ה לִֽ/הְי֥וֹת צֵל֙ עַל רֹאשׁ֔/וֹ לְ/הַצִּ֥יל ל֖/וֹ מֵ/רָֽעָת֑/וֹ וַ/יִּשְׂמַ֥ח יוֹנָ֛ה עַל הַ/קִּֽיקָי֖וֹן שִׂמְחָ֥ה גְדוֹלָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/006.yaml
  text: And Yahweh God appointed a qiqayon plant[a], and it grew up over Jonah to be a shade over his head, to deliver him from his discomfort. And Jonah rejoiced over the qiqayon plant with great joy.
translation:
  language: de
  text: Da ließ Jahwe Gott eine Kikajonpflanze über Jona emporwachsen, damit sie über seinem Kopf Schatten spendete und ihn aus seiner Not rettete. Über die Kikajonpflanze freute sich Jona mit großer Freude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch kikajon; um welche Pflanze es sich handelt, ist unsicher. Traditionell wurde auch „Ranke“ übersetzt; häufig wird an eine Rizinuspflanze gedacht.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  choice: bestimmte
  rationale: Das Verb מנה bezeichnet im Jonabuch Gottes gezieltes Bestimmen beziehungsweise Beauftragen des Fisches, der Pflanze, des Wurms und des Ostwinds. „Bestimmte“ bewahrt dieses absichtsvolle göttliche Handeln, ohne das altertümlichere „bestellte“ zu verwenden.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; zusammen mit אֱלֹהִים ergibt sich die natürliche Verbindung „Jahwe Gott“.
- source_word: קִיקָיוֹן
  choice: Kikajonpflanze
  rationale: Die botanische Bestimmung ist unsicher. Die eingedeutschte Umschrift bewahrt die Besonderheit des hebräischen Ausdrucks; „Pflanze“ macht die Bedeutung im Deutschen unmittelbar verständlich.
- source_word: וַיַּעַל מֵעַל לְיוֹנָה
  choice: Sie wuchs über Jona empor
  rationale: עלה beschreibt hier das Aufkommen beziehungsweise Emporwachsen der Pflanze. Die Formulierung gibt zugleich ihre Lage über Jona wieder.
- source_word: לִהְיוֹת צֵל עַל רֹאשׁוֹ
  choice: um seinem Kopf Schatten zu geben
  rationale: Die Zweckkonstruktion und das konkrete Bild des Schattens über Jonas Kopf werden in natürlichem modernem Deutsch wiedergegeben.
- source_word: לְהַצִּיל לוֹ מֵרָעָתוֹ
  choice: und ihn aus seiner Not zu retten
  rationale: רָעָה kann Unheil, Not, Elend oder Böses bezeichnen. „Not“ passt zur körperlichen Bedrängnis der Szene, bleibt aber weiter und weniger verengend als „Unbehagen“; „retten“ bewahrt die Stärke von נצל.
- source_word: וַיִּשְׂמַח ... שִׂמְחָה גְדוֹלָה
  choice: freute sich ... mit großer Freude
  rationale: Die bewusst nachdrückliche Verbindung von Verb und stammverwandtem Substantiv wird erhalten, statt sie zu dem glatteren „freute sich sehr“ abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Bedeutungsumfang von רָעָתוֹ
  choice: seiner Not
  alternative: seinem Unheil / seinem Unbehagen / seinem Bösen
  rationale: Im unmittelbaren Zusammenhang lindert der Schatten Jonas körperliche Bedrängnis. „Not“ trägt diesem Kontext Rechnung, ohne die mögliche weitere Bedeutung von רָעָה unnötig auf bloßes körperliches Unbehagen zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „freute sich … mit großer Freude“ ist absichtlich beibehalten, um den Nachdruck des hebräischen Ausdrucks hörbar zu machen. „Kikajonpflanze“ vermeidet eine botanisch unsichere Festlegung.
