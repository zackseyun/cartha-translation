  rationale: Die Revision ersetzt lediglich die im Deutschen unklare Konstruktion „bestimmte eine Kikajonpflanze“ durch eine idiomatische kausative Formulierung. Sie wahrt die Aussage, dass Jahwe Gott das Aufwachsen der Pflanze gezielt veranlasste, und erhält Wachstum, Schattenzweck, Rettung aus der Not sowie den hebräischen Nachdruck in Jonas Freude. Der Fußnotenanker wird an die lexikalisch unsichere Bezeichnung „Kikajonpflanze“ gesetzt.
