id: JON.4.3
reference: Jonah 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה קַח נָ֥א אֶת נַפְשִׁ֖/י מִמֶּ֑/נִּי כִּ֛י ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/003.yaml
  text: And now[a], Yahweh, please take my life from me, for my dying is better than my living.
translation:
  language: de
  text: Und nun, Jahwe, nimm doch mein Leben von mir; denn mein Tod ist besser als mein Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „Denn es ist besser für mich zu sterben als zu leben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die anknüpfende Konjunktion als auch die zeitliche Unmittelbarkeit von Jonas Bitte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: קַח נָא
  choice: nimm doch
  rationale: Der Imperativ קַח bedeutet „nimm“; נָא verleiht der Bitte einen flehentlichen Ton, den das natürliche deutsche „doch“ passend ausdrückt.
- source_word: אֶת נַפְשִׁי מִמֶּנִּי
  choice: mein Leben von mir
  rationale: נֶפֶשׁ bezeichnet hier Jonas Leben, nicht eine vom Körper getrennte Seele; מִמֶּנִּי drückt die Trennung aus.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für Jonas Bitte ein.
- source_word: טוֹב ... מִן
  choice: besser als
  rationale: Die Verbindung von טוֹב mit der Vergleichspräposition מִן bildet einen Komparativ.
- source_word: מוֹתִי ... מֵחַיַּי
  choice: mein Tod ... als mein Leben
  rationale: Die substantivische Parallelität des Hebräischen wird in natürlichem Deutsch bewahrt; die Formen beziehen Tod und Leben ausdrücklich auf den Sprecher.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers verwendet ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ erhält den persönlichen Gottesnamen, ohne ihn durch den traditionellen Hoheitstitel zu ersetzen.
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele
  rationale: Jonas Bitte zielt hier auf das Ende seines Lebens. „Seele“ könnte im heutigen Deutsch eine nicht beabsichtigte anthropologische Aussage nahelegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nimm doch“ vermittelt die flehentliche Kraft von נָא, ohne altertümlich zu wirken; das Semikolon macht den engen Zusammenhang zwischen Bitte und Begründung sichtbar.
