source:
  edition: WLC
  text: וַֽ/אֲנִי֙ לֹ֣א אָח֔וּס עַל נִינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה אֲשֶׁ֣ר יֶשׁ בָּ֡/הּ הַרְבֵּה֩ מִֽ/שְׁתֵּים עֶשְׂרֵ֨ה רִבּ֜וֹ אָדָ֗ם אֲשֶׁ֤ר לֹֽא יָדַע֙ בֵּין יְמִינ֣/וֹ לִ/שְׂמֹאל֔/וֹ וּ/בְהֵמָ֖ה רַבָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/011.yaml
  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
translation:
  language: de
  text: Und ich sollte kein Erbarmen haben mit Ninive[a], der großen Stadt, in der es mehr als hundertzwanzigtausend Menschen gibt, die nicht zwischen rechts und links zu unterscheiden wissen[b], und dazu viele Tiere?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Und ich sollte Ninive nicht verschonen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „nicht zwischen rechts und links zu unterscheiden wissen“ kann sich besonders auf kleine Kinder beziehen oder allgemeiner auf Menschen, denen es an Urteilsvermögen fehlt.
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוּס
  choice: Erbarmen haben
  rationale: חוּס kann Mitleid bzw. Erbarmen empfinden und daraus folgend verschonen bedeuten. „Erbarmen haben“ bringt im Zusammenhang Gottes barmherzige Anteilnahme zum Ausdruck, ohne die mögliche Folge des Verschonens auszuschließen.
- source_word: עַל
  choice: mit
  rationale: Die Präposition kennzeichnet bei חוּס das Ziel des Erbarmens und wird im Deutschen idiomatisch durch „Erbarmen haben mit“ wiedergegeben.
- source_word: הָעִיר הַגְּדוֹלָה
  choice: der großen Stadt
  rationale: Die Apposition bewahrt die im Jonabuch wiederkehrende Bezeichnung Ninives als „große Stadt“ und stimmt im Deutschen nach „mit Ninive“ im Dativ.
- source_word: יֶשׁ בָּהּ
  choice: in der es … gibt
  rationale: Diese Formulierung gibt die hebräische Existenzkonstruktion klar und natürlich wieder.
- source_word: הַרְבֵּה מִשְׁתֵּים עֶשְׂרֵה רִבּוֹ
  choice: mehr als hundertzwanzigtausend
  rationale: Wörtlich sind es „mehr als zwölf Zehntausende“; die ausgeschriebene deutsche Zahl ist die natürliche Entsprechung.
- source_word: אָדָם
  choice: Menschen
  rationale: Hier bezeichnet אָדָם die gezählte menschliche Bevölkerung der Stadt, ohne Einschränkung auf männliche Personen.
- source_word: אֲשֶׁר לֹא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ
  choice: die nicht zwischen rechts und links zu unterscheiden wissen
  rationale: Die idiomatische Wendung bleibt bildhaft und deutungsoffen. Die Formulierung legt weder ausschließlich kleine Kinder noch ausschließlich moralisch urteilsunfähige Erwachsene als Referenten fest.
- source_word: וּבְהֵמָה רַבָּה
  choice: und dazu viele Tiere
  rationale: בְּהֵמָה bezeichnet Tiere, häufig Haus- oder Nutztiere. „Tiere“ vermeidet eine unnötige Verengung auf Rinder; „dazu“ bindet sie natürlich in die fortlaufende Existenzangabe ein.
theological_decisions:
- issue: Wer mit denen gemeint ist, die rechts und links nicht unterscheiden können
  choice: Die bildhafte Aussage bleibt ohne nähere Bestimmung stehen.
  alternative: Gemeint sein könnten speziell kleine Kinder oder allgemeiner Menschen ohne ausreichendes sittliches beziehungsweise geistiges Urteilsvermögen.
  rationale: Der hebräische Wortlaut entscheidet nicht eindeutig zwischen diesen Deutungen. Die Übersetzung bewahrt daher die echte Mehrdeutigkeit.
- issue: Gottes Haltung in אָחוּס
  choice: „Erbarmen haben“ betont Gottes mitfühlende und barmherzige Zuwendung.
  alternative: „Ninive verschonen“ betont stärker das Absehen von der angekündigten Vernichtung.
  rationale: Im Zusammenhang wird Gottes Sorge für Ninive der Sorge Jonas um die Pflanze gegenübergestellt. Zugleich ist „verschonen“ lexikalisch möglich und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die lange Satzbewegung des Hebräischen bleiben erhalten. „Hundertzwanzigtausend“ wird ausgeschrieben; die mehrdeutige Rechts-links-Wendung wird nicht auslegend vereindeutigt.
