  text: וַ/יְמַ֤ן הָֽ/אֱלֹהִים֙ תּוֹלַ֔עַת בַּ/עֲל֥וֹת הַ/שַּׁ֖חַר לַֽ/מָּחֳרָ֑ת וַ/תַּ֥ךְ אֶת הַ/קִּֽיקָי֖וֹן וַ/יִּיבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/007.yaml
  text: But God appointed a worm at the rising of dawn the next day[a], and it struck the plant so that it withered.
translation:
  language: de
  text: Doch Gott bestimmte am nächsten Tag, als die Morgenröte aufstieg, einen Wurm. Der Wurm griff die Pflanze[a] an, sodass sie verdorrte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch qiqajon; möglicherweise eine Rizinusstaude. Um welche Pflanze es sich genau handelt, ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  choice: bestimmte
  rationale: Das Verb bezeichnet hier Gottes absichtsvolle Bestimmung eines Geschöpfs zu einer Aufgabe und bewahrt das wiederkehrende Motiv göttlichen Handelns im Jonabuch.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der hebräische Text verwendet אֱלֹהִים und nicht den Gottesnamen JHWH.
- source_word: תּוֹלַעַת
  choice: einen Wurm
  rationale: Der Ausdruck bezeichnet allgemein ein wurmartiges Tier; eine genauere Artbestimmung wäre nicht gesichert.
- source_word: בַּעֲלוֹת הַשַּׁחַר לַמָּחֳרָת
  choice: als am nächsten Tag die Morgenröte aufstieg
  rationale: Die Formulierung gibt sowohl das Aufsteigen der Morgenröte als auch den Bezug auf den folgenden Tag wieder und folgt der hebräischen Bildsprache.
- source_word: וַתַּךְ
  choice: griff … an
  rationale: נכה bedeutet wörtlich „schlagen“; bei einem Wurm und einer Pflanze gibt „angreifen“ die schädigende Einwirkung natürlich wieder, ohne eine konkrete Fraßweise in den Text einzutragen.
- source_word: הַקִּיקָיוֹן
  choice: die Pflanze
  rationale: Die genaue botanische Identität des קִיקָיוֹן ist unsicher. Die allgemeinere Wiedergabe vermeidet falsche Genauigkeit; die mögliche traditionelle Bestimmung wird in der Fußnote genannt.
- source_word: וַיִּיבָשׁ
  choice: sodass sie verdorrte
  rationale: Das Verb bedeutet „vertrocknen, verdorren“. Die resultative Verbindung macht im Deutschen den Zusammenhang mit dem Angriff des Wurms klar.
theological_decisions:
- issue: Göttliches Handeln bei den Umständen Jonas
  choice: Gott bestimmt den Wurm absichtsvoll.
  alternative: Gott lässt lediglich zu, dass ein Wurm erscheint.
  rationale: וַיְמַן beschreibt aktives göttliches Bestimmen und entspricht dem wiederkehrenden Muster, nach dem Gott im Jonabuch Pflanze, Wurm und Wind einsetzt. Die Übersetzung schwächt dies nicht zu bloßer Zulassung ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Morgenröte aufstieg“ bewahrt das hebräische Bild, während „griff … an“ die ungewöhnliche Verbindung von „schlagen“ mit einem Wurm natürlich ausdrückt. Der Fußnotenmarker steht unmittelbar bei dem erklärten Pflanzennamen.
