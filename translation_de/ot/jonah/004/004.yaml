  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הַ/הֵיטֵ֖ב חָ֥רָה לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/004.yaml
  text: And Yahweh said[a], “Is it right for you to be angry?”
translation:
  language: de
  text: 'Da sagte Jahwe: „Ist es recht, dass du zornig bist?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ ist im modernen deutschen Erzählstil natürlich und wahrt den Anschluss an den vorausgehenden Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֲהֵיטֵב
  choice: Ist es recht
  rationale: Das Fragepräfix mit dem Hifil-Infinitivus absolutus von יטב fragt idiomatisch nach der Berechtigung beziehungsweise Angemessenheit von Jonas Zorn.
- source_word: חָרָה
  choice: zornig bist
  rationale: חרה bezeichnet wörtlich ein Entbrennen, wird hier aber idiomatisch für Zorn gebraucht. Die deutsche Wiedergabe gibt den gemeinten Gefühlszustand natürlich wieder.
- source_word: לָךְ
  choice: dass du
  rationale: Die Präposition mit Suffix bezeichnet die betroffene Person. In Verbindung mit der deutschen Konstruktion „Ist es recht, dass du …?“ wird dies idiomatisch ausgedrückt, ohne einen zusätzlichen Bedeutungsgehalt einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen als gebräuchliche deutsche Transkription wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- issue: Aussagekraft der Frage הֲהֵיטֵב חָרָה לָךְ
  choice: „Ist es recht, dass du zornig bist?“
  alternative: „Tust du gut daran, zornig zu sein?“
  rationale: Die Frage prüft die Berechtigung oder Angemessenheit von Jonas Zorn. Die gewählte Fassung erhält den tadelnden, wertenden Charakter, ohne die Antwort ausdrücklich vorwegzunehmen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die knappe rhetorische Frage des Hebräischen bleibt erhalten; eine Fußnote ist nicht nötig, da die formellere Alternative keinen wesentlichen zusätzlichen Bedeutungsgehalt erschließt.
