  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל יוֹנָ֔ה הַ/הֵיטֵ֥ב חָרָֽה לְ/ךָ֖ עַל הַ/קִּֽיקָי֑וֹן וַ/יֹּ֕אמֶר הֵיטֵ֥ב חָֽרָה לִ֖/י עַד מָֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/009.yaml
  text: Then God said to Jonah[a], “Is it right for you to be angry about the plant?” And he said, “It is right for me to be angry, even to death.”
translation:
  language: de
  text: 'Da sagte Gott zu Jona: „Ist es recht, dass du wegen der Pflanze[a] zornig bist?“ Er antwortete: „Es ist recht, dass ich zornig bin – bis zum Tod!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch קִיקָיוֹן (qiqajon): eine Pflanze ungewisser Art; traditionelle Übersetzungen haben unter anderem „Kürbis“ oder „Weinrebe“, manche sehen darin eine Rizinuspflanze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֵיטֵב חָרָה לְךָ
  choice: Ist es recht, dass du … zornig bist?
  rationale: Die hebräische Verbindung fragt wertend, ob Jonas Zorn angemessen oder gerechtfertigt ist. Die Formulierung ist natürliches modernes Deutsch und bewahrt die ethische Zuspitzung.
- source_word: חָרָה
  choice: zornig sein
  rationale: Das Verb bezeichnet in dieser Wendung Zorn, nicht ein buchstäbliches Brennen. „Zornig sein“ passt zum würdigen Erzählregister und gibt das Motiv im Kontext präzise wieder.
- source_word: עַל
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise Gegenstand von Jonas Zorn. „Wegen“ ist im Deutschen knapp und idiomatisch.
- source_word: הַקִּיקָיוֹן
  choice: die Pflanze
  rationale: Die genaue Pflanzenart ist unsicher. Der Oberbegriff vermeidet botanische Scheingenauigkeit; mögliche Bestimmungen werden in der Fußnote genannt.
- source_word: הֵיטֵב חָרָה לִי
  choice: Es ist recht, dass ich zornig bin
  rationale: Jonas Antwort greift Gottes Frage sprachlich auf und behauptet ausdrücklich die Berechtigung seines Zorns. Die parallele deutsche Formulierung erhält diese Spiegelung.
- source_word: עַד מָוֶת
  choice: bis zum Tod
  rationale: 'Die knappe Wiedergabe bewahrt die starke, zugleich nicht vollständig eindeutige Aussage: Sie kann Zorn bis an die Todesgrenze oder eine todbezogene Zuspitzung ausdrücken, ohne dies näher festzulegen.'
- source_word: וַיֹּאמֶר
  choice: Da sagte / Er antwortete
  rationale: „Da sagte“ führt den nächsten Erzählzug natürlich weiter. Beim zweiten Vorkommen verdeutlicht „antwortete“ die Gesprächsfunktion, ohne dem Inhalt etwas hinzuzufügen.
theological_decisions:
- issue: Moralische Bewertung von Jonas Zorn
  choice: Die Wendung als Frage nach der Berechtigung des Zorns wiedergeben.
  alternative: „Tut es dir gut, zornig zu sein?“ oder formal „Ist dein Zorn gut?“
  rationale: Der Kontext und die hebräische Idiomatik betreffen die Angemessenheit von Jonas Zorn. „Ist es recht“ erhält Gottes ethische Konfrontation und Jonas trotzige Selbstrechtfertigung.
- issue: Bestimmung des קִיקָיוֹן
  choice: Im Haupttext den allgemeinen Ausdruck „Pflanze“ verwenden.
  alternative: „Rizinus“, „Kürbisgewächs“, „Ranke“ oder die Transliteration „Kikajon“
  rationale: Die botanische Art lässt sich nicht sicher bestimmen. Eine allgemeine Wiedergabe wahrt die Aussage des Textes ohne unbegründete Festlegung.
- issue: Deutung von עַד מָוֶת
  choice: Die offene Formulierung „bis zum Tod“ bewahren.
  alternative: „so zornig, dass ich sterben möchte“ oder „zu Tode“
  rationale: Der hebräische Ausdruck ist extrem, legt aber nicht eindeutig fest, ob Jona sterben will, vor Zorn sterben könnte oder seinen Zorn als bis zum Tod reichend beschreibt. Die Übersetzung löst diese Spannung nicht auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „Es ist recht“ bildet die hebräische Parallelität ab; der Gedankenstrich hebt Jonas heftige Zuspitzung hervor.
