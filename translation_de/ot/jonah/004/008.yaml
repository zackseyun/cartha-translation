base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/008.yaml
  text: When the sun rose[a], God appointed a scorching east wind, and the sun beat down on Jonah’s head so that he grew faint. And he asked that he might die, and said[b], “My death is better than my life.”
translation:
  language: de
  text: 'Als die Sonne aufging, bestimmte Gott einen sengenden Ostwind[a]. Die Sonne brannte auf Jonas Kopf nieder, sodass er ganz schwach wurde. Da wünschte er sich den Tod und sagte: „Mein Tod ist besser als mein Leben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einen schwülen Ostwind“, „einen heftigen Ostwind“ oder „einen stillen Ostwind“. Das hebräische Eigenschaftswort ist selten und in seiner Bedeutung unsicher; „sengend“ entspricht dem Zusammenhang bedrückender Hitze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: Als die Sonne aufging
  rationale: Die hebräische Erzählformel mit כ plus Infinitiv bezeichnet hier den Zeitpunkt. Die knappe deutsche Wiedergabe ist natürlich und bewahrt die zeitliche Abfolge.
- source_word: וַיְמַן
  choice: bestimmte
  rationale: Das Verb bezeichnet im Jonabuch wiederholt Gottes gezieltes Einsetzen geschaffener Mittel. „Bestimmte“ bringt diese absichtsvolle göttliche Verfügung zum Ausdruck, ohne mehr auszusagen als der Text.
- source_word: רוּחַ קָדִים חֲרִישִׁית
  choice: einen sengenden Ostwind
  rationale: רוּחַ קָדִים ist ein Wind aus Osten. Das seltene und schwierige חֲרִישִׁית wird aufgrund des Zusammenhangs als Hinweis auf die bedrückende Hitze verstanden; die bestehende Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וַתַּךְ הַשֶּׁמֶשׁ עַל רֹאשׁ יוֹנָה
  choice: Die Sonne brannte auf Jonas Kopf nieder
  rationale: נכה enthält die Vorstellung eines Schlages. „Brannte ... nieder“ ist im Deutschen eine natürliche, kräftige Beschreibung der unmittelbaren Einwirkung intensiver Sonne.
- source_word: וַיִּתְעַלָּף
  choice: sodass er ganz schwach wurde
  rationale: Die Form beschreibt, wie Jona überwältigt beziehungsweise kraftlos wird. Die Wiedergabe vermeidet die nicht zwingende Behauptung, er habe das Bewusstsein vollständig verloren.
- source_word: וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  choice: Da wünschte er sich den Tod
  rationale: Die hebräische Wendung ist wörtlich schwer ins Deutsche zu übertragen und bezeichnet Jonas Verlangen zu sterben. Die Formulierung bleibt idiomatisch und legt keinen ausdrücklich genannten Adressaten seiner Bitte fest.
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: Mein Tod ist besser als mein Leben
  rationale: Die knappe, verblose Vergleichsaussage des Hebräischen wird nahezu formal entsprechend wiedergegeben und behält ihre schroffe Wirkung.
theological_decisions:
- issue: Göttliches Handeln in וַיְמַן אֱלֹהִים
  choice: Gott bestimmte
  alternative: Gott ließ ... kommen / Gott bereitete
  rationale: Der Erzähler stellt Gott als denjenigen dar, der den Wind gezielt einsetzt. „Bestimmte“ wahrt diese unmittelbare göttliche Initiative, ohne eine über den Vers hinausgehende Lehrentscheidung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die Wiederholung von „Sonne“ folgt der Struktur des Ausgangstextes; die direkte Rede bewahrt Jonas zugespitzte Formulierung.
