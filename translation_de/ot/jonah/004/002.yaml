  to: 'Und er betete zu Jahwe und sagte: »Ach, Jahwe! War es nicht genau das, was ich sagte, als ich noch in meinem Land war? Darum floh ich nach Tarschisch, um dem zuvorzukommen.[a] Denn ich wusste, dass du ein gnädiger und barmherziger Gott bist, langsam zum Zorn und reich an beständiger Liebe,[b] und dass du vom Unheil ablässt.[c]«'
