source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל אֶל יְהוָ֜ה וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ הֲ/לוֹא זֶ֣ה דְבָרִ֗/י עַד הֱיוֹתִ/י֙ עַל אַדְמָתִ֔/י עַל כֵּ֥ן קִדַּ֖מְתִּי לִ/בְרֹ֣חַ תַּרְשִׁ֑ישָׁ/ה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל חַנּ֣וּן וְ/רַח֔וּם אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/002.yaml
  text: And he prayed to Yahweh and said[a], “Please, Yahweh, was this not what I said while I was still in my own land? That is why I acted first to flee to Tarshish, because I knew that you are a gracious and compassionate God, slow to anger and abundant in steadfast love[c][b], and relenting concerning the disaster.”
translation:
  language: de
  text: 'Und er betete zu Jahwe und sagte: »Ach, Jahwe! War es nicht genau das, was ich sagte, als ich noch in meinem Land war? Darum floh ich nach Tarschisch, um dem zuvorzukommen.[a] Denn ich wusste, dass du ein gnädiger und barmherziger Gott bist, langsam zum Zorn und reich an beständiger Liebe,[b] und dass du vom Unheil ablässt.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Darum beeilte ich mich, nach Tarschisch zu fliehen« beziehungsweise: »Darum floh ich Tarschisch zuvorkommend entgegen.« Das hebräische Verb bezeichnet ein vorausgehendes oder vorgreifendes Handeln.'
    reason: lexical_alternative
  - marker: b
    text: Für »beständige Liebe« steht hebräisch ḥesed, das auch mit »Güte« oder »treue Liebe« wiedergegeben werden kann. Die ganze Beschreibung klingt an Exodus 34,6 an.
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: 'Oder: »und dich hinsichtlich des Unheils umstimmst«. Mit »Unheil« ist hier das angedrohte Gericht gemeint, nicht moralisch Böses in Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: er betete
  rationale: Das Hitpael von פלל bezeichnet gewöhnlich das Beten; trotz des klagenden Tons bleibt die Äußerung ein an Gott gerichtetes Gebet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָנָּה
  choice: Ach
  rationale: Die Partikel kann Bitte oder emotionalen Ausruf ausdrücken; in Jonas vorwurfsvollem Gebet ist »Ach« natürlich und wahrt den Ausrufcharakter.
- source_word: הֲלוֹא זֶה דְבָרִי
  choice: War es nicht genau das, was ich sagte
  rationale: Die rhetorische Frage erwartet Zustimmung; »was ich sagte« gibt דְבָרִי idiomatisch wieder, und »genau das« verdeutlicht das rückverweisende זֶה.
- source_word: עַד הֱיוֹתִי עַל אַדְמָתִי
  choice: als ich noch in meinem Land war
  rationale: Die Wendung blickt auf Jonas Aufenthalt in seiner Heimat vor seiner Abreise zurück.
- source_word: עַל כֵּן קִדַּמְתִּי לִבְרֹחַ
  choice: Darum kam ich dem zuvor, indem ich … floh
  rationale: קדם bezeichnet hier ein vorgreifendes, zuvorkommendes Handeln. Die Formulierung wahrt diesen ungewöhnlichen Sinn, ohne ihn bloß als Eile wiederzugeben.
- source_word: חַנּוּן וְרַחוּם
  choice: gnädig und barmherzig
  rationale: Die traditionelle und weiterhin verständliche Wortpaarung entspricht der Gottesbeschreibung, die unter anderem Exodus 34,6 aufnimmt.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Dies ist eine klare idiomatische Wiedergabe des hebräischen Bildes und bezeichnet Geduld beziehungsweise Zurückhaltung im Zorn.
- source_word: רַב חֶסֶד
  choice: reich an beständiger Liebe
  rationale: חֶסֶד umfasst treue, verlässliche Güte und Liebe; »beständige Liebe« hält die relationale und dauerhafte Dimension offen.
- source_word: וְנִחָם עַל הָרָעָה
  choice: dass du dich des Unheils gereuen lässt
  rationale: Die Formulierung bewahrt die spannungsreiche Aussage über Gottes Abkehr von angekündigtem Unheil, ohne moralisches Böses in Gott hineinzulesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; »Jahwe« wahrt ihn als solchen.
- issue: Gottes Reaktion in וְנִחָם עַל הָרָעָה
  choice: du lässt dich des Unheils gereuen
  alternative: du nimmst das Unheil zurück
  rationale: Die gewählte Fassung bewahrt die anthropopathische und theologische Spannung des Verbs נחם. »Unheil« bezeichnet hier das angedrohte Gericht, nicht moralisch Böses, das Gott begangen hätte.
- issue: Bedeutungsbreite von חֶסֶד
  choice: beständige Liebe
  alternative: Güte; Bundestreue
  rationale: »Beständige Liebe« gibt die treue, relationale Zuwendung wieder, ohne die Bedeutung auf einen ausdrücklich genannten Bund zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede behält Jonas emotionalen, beinahe vorwurfsvollen Gebetston. »Jahwe« steht als Gottesname; ungewöhnliche beziehungsweise theologisch spannungsreiche Formulierungen werden nicht geglättet, sondern bei Bedarf durch Fußnoten erläutert.
