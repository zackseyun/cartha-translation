  text: וַ/יֵּ֥רַע אֶל יוֹנָ֖ה רָעָ֣ה גְדוֹלָ֑ה וַ/יִּ֖חַר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/001.yaml
  text: But it was greatly displeasing to Jonah[a], and he became angry.
translation:
  language: de
  text: Doch das missfiel Jona sehr[a], und er wurde zornig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Es war böse für Jona – ein großes Übel.« Im Hebräischen wird Jonas Reaktion durch ein Wortspiel mit »böse/schlecht« beschrieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע אֶל־יוֹנָה
  choice: Doch Jona missfiel das
  rationale: רעע mit אֶל und einer Person bezeichnet hier idiomatisch, dass das zuvor berichtete Handeln Gottes Jona als schlecht beziehungsweise anstößig erschien. „Missfiel“ gibt diese subjektive Reaktion in natürlichem Deutsch wieder, ohne Gottes Erbarmen als objektiv böse zu bezeichnen. Das einleitende וַ wird wegen des scharfen Gegensatzes zum vorherigen Vers mit „Doch“ wiedergegeben.
- source_word: רָעָה גְדוֹלָה
  choice: sehr
  rationale: Die Verbindung „ein großes Übel“ verstärkt das verwandte Verb וַיֵּרַע. Die adverbiale Wiedergabe „sehr“ bewahrt die Intensität in idiomatischem Deutsch; das hebräische Wortspiel wird in der Fußnote erläutert.
- source_word: וַיִּחַר לוֹ
  choice: und er wurde zornig
  rationale: Die Wendung חרה mit ל bedeutet wörtlich etwa „es entbrannte ihm“ und bezeichnet aufkommenden beziehungsweise heftigen Zorn. „Er wurde zornig“ ist klar, gegenwärtig und semantisch genau.
- source_word: יוֹנָה
  choice: Jona
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions:
- issue: Ob רָעָה eine objektive moralische Wertung des Erbarmens Gottes oder Jonas subjektive Reaktion ausdrückt
  choice: 'Jonas subjektives Missfallen: „Jona missfiel das sehr“'
  alternative: „Es war für Jona ein großes Übel“
  rationale: Der Zusammenhang beschreibt Jonas Reaktion auf Gottes Verschonung Ninives; der Erzähler bestätigt Jonas Urteil nicht. Die gewählte Formulierung lässt die theologische Spannung zwischen Gottes Erbarmen und Jonas Bewertung bestehen, ohne dessen Bewertung zur Erzählerstimme zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Doch“ markiert den Gegensatz zum Erbarmen Gottes im vorherigen Vers; „missfiel“ vermeidet sowohl Umgangssprache als auch eine irreführende objektive Verurteilung dieses Erbarmens.
