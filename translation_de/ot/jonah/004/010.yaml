source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אַתָּ֥ה חַ֨סְתָּ֙ עַל הַ/קִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא עָמַ֥לְתָּ בּ֖/וֹ וְ/לֹ֣א גִדַּלְתּ֑/וֹ שֶׁ/בִּן לַ֥יְלָה הָיָ֖ה וּ/בִן לַ֥יְלָה אָבָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/010.yaml
  text: Then Yahweh said[a], "You had compassion on the plant, for which you did not labor and which you did not make grow, which came up in a night and perished in a night."
translation:
  language: de
  text: 'Da sagte Jahwe: »Du hattest Mitleid mit der Pflanze[a], um die du dich nicht abgemüht und die du nicht großgezogen hast. In einer Nacht entstand sie, und in einer Nacht ging sie zugrunde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »der qiqajon«; welche Pflanzenart damit genau gemeint ist, ist unsicher. Häufig wird an den Wunderbaum beziehungsweise Rizinus gedacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die narrative Verbform führt die Handlung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen übliche wissenschaftliche Transkription.
- source_word: חַסְתָּ עַל
  choice: du hattest Mitleid mit
  rationale: חוס bezeichnet hier schonende, mitleidige Anteilnahme. »Mitleid haben mit« ist idiomatisch und erhält die für Vers 11 wichtige Parallele, ohne ein tatsächliches Verschonen der Pflanze zu behaupten.
- source_word: הַקִּיקָיוֹן
  choice: die Pflanze
  rationale: Die genaue Pflanzenart ist unsicher. Der allgemeine Ausdruck vermeidet eine unbelegte Festlegung; die Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: אֲשֶׁר לֹא עָמַלְתָּ בּוֹ
  choice: um die du dich nicht abgemüht hast
  rationale: עמל bezeichnet Mühe und beschwerliche Arbeit; mit ב wird hier die Pflanze bezeichnet, der Jonas Mühe nicht galt. Die deutsche Formulierung ist natürlich und bewahrt den Aufwandsgedanken.
- source_word: וְלֹא גִדַּלְתּוֹ
  choice: und die du nicht großgezogen hast
  rationale: Die Piel-Form von גדל bedeutet, etwas wachsen zu lassen beziehungsweise aufzuziehen. »Großgezogen« bewahrt Jonas fehlende Beteiligung am Wachstum und klingt im Deutschen natürlicher als »wachsen gemacht«.
- source_word: שֶׁבִּן־לַיְלָה הָיָה
  choice: In einer Nacht entstand sie
  rationale: Die wörtliche Wendung »Sohn einer Nacht« bezeichnet hier die äußerst kurze Zeit ihres Entstehens beziehungsweise Bestehens. »Entstand« folgt הָיָה, ohne eine bestimmte Art des Wachstums hinzuzufügen.
- source_word: וּבִן־לַיְלָה אָבָד
  choice: und in einer Nacht ging sie zugrunde
  rationale: אבד bezeichnet Vergehen oder Zugrundegehen. Die wiederholte Formulierung »in einer Nacht« bildet die prägnante Symmetrie des Hebräischen ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm als persönlichen Gottesnamen. Die Wiedergabe als »Jahwe« macht dies sichtbar, ohne den Namen durch einen Titel zu ersetzen.
- issue: Bezug von חוס in der Parallele zu Vers 11
  choice: Mitleid haben
  alternative: verschonen
  rationale: Die Formulierung hält sowohl Jonas emotionale Anteilnahme als auch die folgende göttliche Gegenüberstellung offen. »Verschonen« könnte irreführend nahelegen, Jona habe die Pflanze aktiv retten können.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden kurzen Nachtsätze bewahren die rhetorische Symmetrie des Hebräischen. »Mitleid« ist allgemein verständlich; »qiqajon« wird wegen der unsicheren botanischen Bestimmung nur in der Fußnote genannt.
