  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des hebräischen Textes zuverlässig wieder: Jahwes Rede, Jonas Mitleid mit der Pflanze, seine fehlende Arbeit an ihr und die antithetisch-parallele Aussage über ihr Entstehen und Vergehen in je einer Nacht. »Entstand« wahrt gegenüber einer botanisch engeren Formulierung wie »wuchs auf« die Offenheit von הָיָה.'
