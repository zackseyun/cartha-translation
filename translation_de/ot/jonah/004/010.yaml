  terminology: »Jahwe« ist eine angemessene deutsche Wiedergabe des Tetragramms. »Mitleid mit« gibt חוּס in diesem Kontext passend wieder, ohne die aktivere Bedeutung »verschonen« unzulässig festzulegen. »Pflanze« vermeidet eine ungesicherte botanische Identifikation. Die Fußnote kennzeichnet die Unsicherheit ausreichend; der Hinweis auf Wunderbaum/Rizinus ist als Vorschlag, nicht als Festlegung formuliert.
