  text: וַ/יַּחְתְּר֣וּ הָ/אֲנָשִׁ֗ים לְ/הָשִׁ֛יב אֶל הַ/יַּבָּשָׁ֖ה וְ/לֹ֣א יָכֹ֑לוּ כִּ֣י הַ/יָּ֔ם הוֹלֵ֥ךְ וְ/סֹעֵ֖ר עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/013.yaml
  text: But the men rowed hard to return to the dry land[a], but they could not[c][b], because the sea kept growing more and more stormy against them.
translation:
  language: de
  text: Die Männer ruderten mit aller Kraft, um wieder ans Land[a] zu gelangen, aber sie schafften es nicht; denn das Meer tobte immer heftiger gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum trockenen Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְתְּרוּ
  choice: ruderten mit aller Kraft
  rationale: Das Verb חתר bedeutet wörtlich „graben“, bezeichnet hier im nautischen Zusammenhang aber angestrengtes Rudern. Die Formulierung bewahrt sowohl die konkrete Tätigkeit als auch ihre Intensität.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das Hebräische verwendet die allgemeine Bezeichnung „die Männer“, nicht den spezielleren Ausdruck „Seeleute“.
- source_word: לְהָשִׁיב
  choice: um ... zurückzukehren
  rationale: Der Hifil von שוב kann „zurückbringen“ bedeuten; ohne ausdrücklich genanntes Objekt ist hier idiomatisch das Zurückgelangen der Männer beziehungsweise des Schiffes zum Land gemeint.
- source_word: הַיַּבָּשָׁה
  choice: Festland
  rationale: יבשה bezeichnet das trockene Land im Gegensatz zum Meer. „Festland“ gibt diesen Kontrast im Deutschen natürlich wieder; die wörtlichere Form steht in der Fußnote.
- source_word: וְלֹא יָכֹלוּ
  choice: Aber sie schafften es nicht
  rationale: Die Wendung drückt schlicht ihr Unvermögen aus und bildet einen deutlichen Gegensatz zu ihrem kraftvollen Versuch.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung dafür ein, weshalb ihr Versuch scheiterte.
- source_word: הַיָּם
  choice: das Meer
  rationale: Dies ist die gewöhnliche und kontextuell passende Bedeutung.
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: wurde ... immer stürmischer
  rationale: Die Verbindung von הוֹלֵךְ mit einem Partizip beschreibt eine fortschreitende Entwicklung; das Meer nahm also an Heftigkeit zu.
- source_word: עֲלֵיהֶם
  choice: ihnen gegenüber
  rationale: Die Formulierung bewahrt die auf die Männer gerichtete, beinahe gegnerische Kraft des Meeres, ohne sie stärker zu personifizieren als der hebräische Text.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Ruderten mit aller Kraft“ macht das nautische Bild und die Anstrengung deutlich; „Festland“ ist im Deutschen natürlicher als „trockenes Land“, während die Fußnote die konkrete hebräische Formulierung bewahrt.
