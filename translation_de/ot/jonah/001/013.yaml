revisions:
- from: Doch die Männer ruderten mit aller Kraft, um zum Festland zurückzukehren[a]. Aber sie schafften es nicht, denn das Meer wurde ihnen gegenüber immer stürmischer.
  to: Die Männer ruderten mit aller Kraft, um wieder ans Land[a] zu gelangen, aber sie schafften es nicht; denn das Meer tobte immer heftiger gegen sie.
  rationale: Die Revision beseitigt die unidiomatische und abgeschwächte Wiedergabe von עֲלֵיהֶם, gibt die fortschreitende Heftigkeit von הוֹלֵךְ וְסֹעֵר mit „immer heftiger“ wieder und glättet die deutsche Satzverknüpfung. Die Anstrengung des Ruderns, die Unfähigkeit zurückzukehren und die wörtliche Nuance von „trockenem Land“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:54:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Hebräischen weitgehend korrekt wieder: angestrengtes Rudern, erfolgloser Versuch und die zunehmend tobende See. „Ihnen gegenüber“ schwächt jedoch עֲלֵיהֶם ab; die Präposition beschreibt hier die gegen die Männer bzw. ihr Schiff gerichtete Gewalt der See.'
  naturalness: „Doch … Aber“ ist im Deutschen als direkte Satzfolge unnötig doppelt kontrastierend. Zudem klingt „das Meer wurde ihnen gegenüber immer stürmischer“ unidiomatisch. Eine Formulierung mit „tobte immer heftiger gegen sie“ ist natürlich und bewahrt die progressive Aussage von הוֹלֵךְ וְסֹעֵר.
  terminology: „Die Männer“ entspricht הָאֲנָשִׁים. „Ans Land“ ist im maritimen deutschen Erzählen idiomatisch; die Fußnote sichert die wörtlichere Nuance von הַיַּבָּשָׁה („das trockene Land“).
  issues:
  - severity: medium
    issue: „ihnen gegenüber“ für עֲלֵיהֶם
    rationale: Die Wendung bedeutet eher „gegen sie“ und bezeichnet die bedrängende, gegen sie gerichtete Wirkung der See. „Ihnen gegenüber“ ist semantisch abgeschwächt und im Zusammenhang mit „stürmischer“ nicht idiomatisch.
  - severity: low
    issue: 'Doppelter Gegensatz: „Doch“ und „Aber“'
    rationale: Die Verbindung ist zwar verständlich, wirkt in moderner deutscher Prosa aber stilistisch schwerfällig. Ein einzelnes „aber“ bildet den hebräischen Kontrast ausreichend ab.
  revised_text: Die Männer ruderten mit aller Kraft, um wieder ans Land[a] zu gelangen, aber sie schafften es nicht; denn das Meer tobte immer heftiger gegen sie.
  revised_footnotes:
