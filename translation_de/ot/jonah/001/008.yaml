  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הַגִּידָ/ה נָּ֣א לָ֔/נוּ בַּ/אֲשֶׁ֛ר לְ/מִי הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ מַה מְּלַאכְתְּ/ךָ֙ וּ/מֵ/אַ֣יִן תָּב֔וֹא מָ֣ה אַרְצֶ֔/ךָ וְ/אֵֽי מִ/זֶּ֥ה עַ֖ם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/008.yaml
  text: Then they said to him[a], “Please tell us on whose account this trouble has come upon us. What is your occupation, and where do you come from? What is your land[b], and from what people are you?”
translation:
  language: de
  text: 'Da sagten sie zu ihm: „Sag uns doch, wegen wessen dieses Unglück über uns gekommen ist.[a] Was ist dein Beruf, und woher kommst du? Welches ist dein Land,[b] und zu welchem Volk gehörst du?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch wen dieses Unheil über uns gekommen ist“. Das hebräische Wort רָעָה bezeichnet hier das drohende Unglück, das die Seeleute trifft, nicht notwendig moralisch Böses.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Was ist dein Land?“ Das hebräische אֶרֶץ kann auch „Landstrich“ oder „Land“ im Sinn von „Landesgebiet“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Da sagten sie zu ihm
  rationale: Das Narrativ-Waw führt die Handlung weiter. „Da“ gibt die zeitliche Abfolge im modernen deutschen Erzählstil natürlich wieder.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Sag uns doch
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun“; נָא verleiht der Aufforderung einen bittenden oder dringlichen Ton. „doch“ wahrt diese Nuance knapp und idiomatisch.
- source_word: בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ
  choice: wegen wessen dieses Unglück über uns gekommen ist
  rationale: Die schwierige, knappe Konstruktion fragt nach der Person, deretwegen die Notlage eingetreten ist. „Wegen wessen“ erhält diesen Personenbezug, ohne ausdrücklich moralische Schuld zuzuschreiben. Das im Deutschen ergänzte „gekommen ist“ gibt die im Hebräischen elliptisch ausgedrückte Situation wieder.
- source_word: מַה מְּלַאכְתְּךָ
  choice: Was ist dein Beruf
  rationale: מְלָאכָה bezeichnet hier Arbeit, Tätigkeit oder Beruf. „Beruf“ ist in der Reihe von Fragen nach Jonas Herkunft und Identität knapp und natürlich.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: und woher kommst du
  rationale: מֵאַיִן fragt nach Herkunft oder Ausgangsort. Die Formulierung entspricht natürlichem modernem Deutsch.
- source_word: מָה אַרְצֶךָ
  choice: Welches ist dein Land
  rationale: אֶרֶץ kann „Land“ oder „Gebiet“ bezeichnen. Die Formulierung bleibt nahe am Hebräischen und vermeidet die modernen staatsrechtlichen Nebenbedeutungen von „Staat“.
- source_word: וְאֵי מִזֶּה עַם אָתָּה
  choice: und zu welchem Volk gehörst du
  rationale: עַם bezeichnet eine Volks- oder Herkunftsgemeinschaft. Die idiomatische deutsche Wendung macht die Frage nach der ethnischen beziehungsweise nationalen Zugehörigkeit verständlich, ohne einen modernen Nationalstaatsbegriff einzutragen.
theological_decisions:
- issue: Bedeutung von רָעָה im Zusammenhang mit dem Sturm
  choice: Unglück
  alternative: Böses; Unheil
  rationale: Im Kontext bezeichnet רָעָה zunächst die bedrohliche Katastrophe, welche die Seeleute trifft. „Unglück“ vermeidet eine unbegründete Festlegung auf moralisches Böses, lässt aber die Frage nach Verantwortung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt durch kurze, aufeinanderfolgende Fragen lebendig. Die ungewöhnliche Kausalfrage wird nicht zu einer eindeutigen Schuldzuweisung umformuliert; damit bleiben die Knappheit und die Spannung des Hebräischen erhalten.
