  text: וַ/יִּשְׂאוּ֙ אֶת יוֹנָ֔ה וַ/יְטִלֻ֖/הוּ אֶל הַ/יָּ֑ם וַ/יַּעֲמֹ֥ד הַ/יָּ֖ם מִ/זַּעְפּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/015.yaml
  text: So they picked up Jonah and threw him into the sea[a], and the sea ceased from its raging.
translation:
  language: de
  text: Sie hoben Jona auf und warfen ihn ins Meer, und das Meer hörte auf zu wüten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: Da nahmen sie
  rationale: נשׂא bezeichnet hier das körperliche Aufnehmen bzw. Hochheben Jonas. „nahmen sie“ ist im Deutschen natürlich und leitet unmittelbar zum Überbordwerfen über, ohne eine zusätzliche Nuance wie gewaltsames „Packen“ einzutragen.
- source_word: וַיְטִלֻהוּ
  choice: warfen ihn
  rationale: טול bedeutet werfen bzw. schleudern. „warfen ihn“ gibt die Handlung klar und gegenwartssprachlich wieder; „schleuderten ihn“ wäre stärker, als der Kontext zwingend verlangt.
- source_word: אֶל הַיָּם
  choice: ins Meer
  rationale: Bei einem Verb des Werfens bezeichnet אֶל hier die Bewegung in das Meer hinein. „ins Meer“ ist die idiomatische deutsche Wiedergabe.
- source_word: וַיַּעֲמֹד הַיָּם
  choice: Da hörte das Meer auf
  rationale: עמד bedeutet wörtlich „stehen“ bzw. „stillstehen“, bezeichnet mit מִן hier aber das Aufhören der stürmischen Bewegung. Die Formulierung bewahrt den verbalen Vorgang, ohne das Ergebnis mit „wurde ruhig“ auszudeuten.
- source_word: מִזַּעְפּוֹ
  choice: zu wüten
  rationale: זעף bezeichnet heftige Erregung, Grimm oder Toben. Auf das Meer bezogen gibt „wüten“ die lebendige Personifikation natürlich wieder.
theological_decisions:
- issue: Personifikation des Meeres
  choice: „das Meer [hörte] auf zu wüten“
  alternative: „das Meer wurde ruhig“
  rationale: Der hebräische Text stellt die heftige Bewegung des Meeres als dessen זעף, sein Toben oder Wüten, dar. Die gewählte Fassung erhält dieses Bild, ohne daraus eine weitergehende theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei kurze Hauptsätze bilden die rasche Abfolge von Jonas Hineinwerfen und dem unmittelbaren Ende des Wütens ab.
