  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ מַה נַּ֣עֲשֶׂה לָּ֔/ךְ וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עָלֵ֑י/נוּ כִּ֥י הַ/יָּ֖ם הוֹלֵ֥ךְ וְ/סֹעֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/011.yaml
  text: Then they said to him[b][a], “What should we do to you so that the sea may quiet down for us?” For the sea was growing more and more stormy.
translation:
  language: de
  text: 'Da sagten sie zu ihm: „Was sollen wir mit dir tun, damit sich das Meer beruhigt und von uns ablässt[a]?“ Denn das Meer wurde immer stürmischer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „damit das Meer von über uns still wird“. Die hebräische Wendung stellt das Meer als eine auf ihnen lastende Bedrohung dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָּךְ
  choice: Was sollen wir mit dir tun
  rationale: 'Die Frage ist deliberativ: Die Seeleute fragen, welche Maßnahme sie in Bezug auf Jona ergreifen sollen. „Mit dir tun“ ist im heutigen Deutsch natürlich und gibt לְךָ in diesem Zusammenhang treffend wieder.'
- source_word: וְיִשְׁתֹּק הַיָּם
  choice: damit das Meer … ablässt
  rationale: שׁתק bezeichnet das Ruhig- oder Stillwerden. Zusammen mit מֵעָלֵינוּ drückt „von uns ablässt“ idiomatisch aus, dass die Bedrohung durch das Meer aufhören soll; „damit“ macht den im Zusammenhang erkennbaren Zwecksinn des waw deutlich.
- source_word: מֵעָלֵינוּ
  choice: von uns
  rationale: Die Verbindung aus מִן und עַל lautet wörtlich „von über/auf uns weg“ und zeichnet das Meer als eine auf ihnen lastende Bedrohung. Im Haupttext wird dies natürlich mit „von uns ablässt“ wiedergegeben; die Bildhaftigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet die Begründung für die dringliche Frage der Seeleute ein.
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: wurde immer stürmischer
  rationale: Die Verbindung von הֹלֵךְ mit einem Partizip bezeichnet hier eine fortschreitende Steigerung. „Immer stürmischer“ gibt diese zunehmende Intensität klar und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Bildhaftigkeit von מֵעָלֵינוּ wird im idiomatischen Haupttext nicht künstlich nachgebildet, sondern durch die Fußnote bewahrt; die progressive Steigerung des Sturms wird ausdrücklich wiedergegeben.
