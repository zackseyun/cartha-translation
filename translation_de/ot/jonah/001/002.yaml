  text: ק֠וּם לֵ֧ךְ אֶל נִֽינְוֵ֛ה הָ/עִ֥יר הַ/גְּדוֹלָ֖ה וּ/קְרָ֣א עָלֶ֑י/הָ כִּֽי עָלְתָ֥ה רָעָתָ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/002.yaml
  text: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
translation:
  language: de
  text: Mach dich auf, geh nach Ninive, der großen Stadt, und rufe gegen sie aus[a]; denn ihre Bosheit[b] ist vor mich heraufgestiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verkünde über sie“. Die hebräische Formulierung kann allgemeiner verstanden werden; in diesem Zusammenhang liegt jedoch eine gegen Ninive gerichtete Gerichtsankündigung nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Schlechtigkeit“, „ihr böses Treiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֠וּם
  choice: Mach dich auf
  rationale: Der Imperativ eröffnet den Auftrag mit einem nachdrücklichen Aufruf zum Handeln. „Mach dich auf“ bewahrt diesen Ton, ohne zwingend ein buchstäbliches Aufstehen aus sitzender Lage anzunehmen.
- source_word: לֵ֧ךְ אֶל נִֽינְוֵ֛ה
  choice: geh nach Ninive
  rationale: Für eine Bewegung zu einer Stadt ist „nach“ im modernen Deutschen die natürliche Entsprechung von אֶל; „Ninive“ folgt der üblichen deutschen Namensform.
- source_word: הָעִ֥יר הַגְּדוֹלָ֖ה
  choice: in die große Stadt
  rationale: Die Apposition bezeichnet Ninive als große beziehungsweise bedeutende Stadt. Die wiederholte Richtungsangabe ist im Deutschen idiomatisch und macht die Apposition eindeutig.
- source_word: וּקְרָ֣א עָלֶ֑יהָ
  choice: und rufe gegen sie aus
  rationale: קרא bezeichnet hier eine öffentliche, nachdrückliche Verkündigung. עַל hat angesichts der folgenden Begründung wahrscheinlich eine gegen die Stadt gerichtete Bedeutung; die allgemeinere Lesart wird in der Fußnote bewahrt.
- source_word: כִּֽי
  choice: denn
  rationale: Die Partikel leitet die Begründung des Auftrags ein. „Denn“ verbindet die Aussage würdig und natürlich mit dem vorausgehenden Befehl.
- source_word: עָלְתָ֥ה
  choice: ist … heraufgestiegen
  rationale: Die Übersetzung erhält das räumliche Bild des hebräischen Verbs עלה, wonach Ninives Bosheit in Gottes Gegenwart hinaufsteigt.
- source_word: רָעָתָ֖ם
  choice: ihre Bosheit
  rationale: רָעָה bezeichnet hier aufgrund des göttlichen Anklagezusammenhangs moralische Verwerflichkeit. „Bosheit“ ist im Deutschen präziser als das substantivierte „Böse“, ohne den Sinn unnötig einzuengen.
- source_word: לְפָנָֽי
  choice: zu mir
  rationale: Wörtlich steht „vor mein Angesicht/vor mich“. In Verbindung mit dem Bild des Heraufsteigens gibt „zu mir“ die Bewegung in Gottes Gegenwart in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung des prophetischen Auftrags וּקְרָא עָלֶיהָ
  choice: Eine gegen Ninive gerichtete öffentliche Verkündigung
  alternative: Eine Verkündigung über Ninive oder an Ninive ohne ausdrücklich gegnerischen Sinn
  rationale: Die Verbindung von קרא und עַל sowie die unmittelbar folgende Begründung mit der Bosheit der Einwohner sprechen für eine Ankündigung des Gerichts. Da die Präposition auch allgemeiner verstanden werden kann, bleibt diese Möglichkeit in einer Fußnote sichtbar.
- issue: Bezug von רָעָתָם
  choice: Moralische Bosheit der Einwohner Ninives
  alternative: Ihr Unheil oder ihre Not
  rationale: Als Grund dafür, dass Gott Jona gegen die Stadt aussendet, bezeichnet das Wort hier am ehesten das schuldhafte Verhalten ihrer Bewohner. Der Wechsel vom grammatisch weiblichen Singular der Stadt zum Pluralsuffix „ihre“ richtet den Blick auf die Menschen in Ninive.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mach dich auf“ bewahrt den knappen prophetischen Aufruf, während „geh nach“ und „zu mir“ für heutige Leser natürlich bleiben. Das Semikolon trennt Auftrag und Begründung klar. Die Bildsprache des Heraufsteigens wird erhalten.
