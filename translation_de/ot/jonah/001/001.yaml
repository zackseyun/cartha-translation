lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: Die Erzählform von הָיָה eröffnet den Bericht und bildet zusammen mit דְּבַר יְהוָה die feste prophetische Wendung. „Erging“ ist im Deutschen natürlich und bewahrt deren feierlichen Charakter, ohne ein nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der Verbindung דְּבַר יְהוָה bezeichnet das Wort die von Gott kommende Offenbarung. „Wort“ erhält die konkrete Bedeutung und die prophetischen Bezüge besser als das dynamischere „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt und nicht durch den Titel „der HERR“ ersetzt wird.
- source_word: אֶל
  choice: an
  rationale: Bei der deutschen Wendung „das Wort erging“ bezeichnet „an“ idiomatisch den Empfänger der Offenbarung.
- source_word: יוֹנָה
  choice: Jona
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: בֶן אֲמִתַּי
  choice: den Sohn Amittais
  rationale: Die Apposition gibt die hebräische Herkunftsangabe präzise und in natürlichem Deutsch wieder.
- source_word: לֵאמֹר
  choice: 'Es lautete:'
  rationale: Der Infinitiv leitet die unmittelbar folgende Rede ein. Ein eigener kurzer Satz mit Doppelpunkt gibt diese Funktion im heutigen Deutsch klar und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Personbezug in לֵאמֹר
  choice: 'unpersönlich: „Es lautete“'
  alternative: „indem er sagte“
  rationale: Die hebräische Einleitungsformel legt im Deutschen nicht eindeutig nahe, ob das Sprechen ausdrücklich Jahwe oder seinem „Wort“ grammatisch zugeordnet werden soll. Die unpersönliche Form wahrt die Funktion als Redeeinleitung, ohne diese Spannung unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste prophetische Wendung „das Wort … erging an“ bleibt erhalten; die schwerfällige wörtliche Erzählöffnung wird in einer Fußnote dokumentiert. Der Doppelpunkt weist unmittelbar auf die Rede im nächsten Vers voraus.
