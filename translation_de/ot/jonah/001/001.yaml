  text: Das Wort Jahwes erging[a] an Jona, den Sohn Amittais, mit den Worten:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt das Hebräische: „Und es geschah: Das Wort Jahwes erging …“ Die Wendung ist eine übliche Eröffnung einer Erzählung.'
    reason: lexical_alternative
  - marker: b
