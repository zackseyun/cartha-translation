  text: וַ/יִּקְרַ֤ב אֵלָי/ו֙ רַ֣ב הַ/חֹבֵ֔ל וַ/יֹּ֥אמֶר ל֖/וֹ מַה לְּ/ךָ֣ נִרְדָּ֑ם ק֚וּם קְרָ֣א אֶל אֱלֹהֶ֔י/ךָ אוּלַ֞י יִתְעַשֵּׁ֧ת הָ/אֱלֹהִ֛ים לָ֖/נוּ וְ/לֹ֥א נֹאבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/006.yaml
  text: So the captain came near to him and said to him[a], “What do you mean, sleeper? Get up, call on your god. Perhaps the god will give thought to us[c][b], so that we may not perish.”
translation:
  language: de
  text: 'Da trat der Kapitän[a] zu ihm und sagte: „Was ist mit dir, dass du schläfst?[b] Steh auf, ruf deinen Gott an! Vielleicht wird der Gott an uns denken[c], damit wir nicht umkommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: der Oberste der Seeleute; auch: der Schiffsführer.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Zurechtweisung ist äußerst knapp, wörtlich etwa: „Was ist mit dir, Schlafender?“ Gemeint ist: „Wie kannst du jetzt schlafen?“'
    reason: lexical_alternative
  - marker: c
    text: 'Das seltene hebräische Verb kann auch bedeuten: „uns beachten“ oder „sich um uns kümmern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלָיו
  choice: Da trat ... zu ihm
  rationale: Gibt die Annäherung im erzählenden Zusammenhang natürlich und zugleich quellennah wieder.
- source_word: רַב הַחֹבֵל
  choice: der Kapitän
  rationale: Die Wendung bezeichnet wörtlich den Obersten der Seeleute; „Kapitän“ ist dafür die klare, heutige Standardbezeichnung.
- source_word: מַה לְּךָ נִרְדָּם
  choice: Was ist mit dir, du Schläfer?
  rationale: Bewahrt die knappe, scharfe Form der hebräischen Zurechtweisung und gibt נִרְדָּם als direkte Bezeichnung des Schlafenden wieder.
- source_word: קוּם
  choice: Steh auf
  rationale: Natürliche und dringliche Wiedergabe des Imperativs.
- source_word: קְרָא אֶל אֱלֹהֶיךָ
  choice: ruf deinen Gott an
  rationale: „Anrufen“ bezeichnet im Deutschen idiomatisch den an eine Gottheit gerichteten Hilferuf.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt die im Ausgangstext ausgedrückte Unsicherheit und Hoffnung.
- source_word: יִתְעַשֵּׁת
  choice: denkt ... an
  rationale: Das seltene Verb kann ein aufmerksames Bedenken oder Beachten ausdrücken. „An uns denken“ bleibt bewusst zurückhaltend und behauptet noch kein bestimmtes Eingreifen.
- source_word: הָאֱלֹהִים
  choice: der Gott
  rationale: Der bestimmte Artikel wird bewahrt; im Mund des heidnischen Kapitäns bezeichnet die Wendung den zuvor genannten Gott Jonas, ohne ihn ausdrücklich mit dem Gottesnamen Israels zu benennen.
- source_word: וְלֹא נֹאבֵד
  choice: sodass wir nicht untergehen
  rationale: Gibt den erhofften Ausgang idiomatisch wieder und passt zum unmittelbaren Kontext der Seenot.
theological_decisions:
- issue: Bezug von אֱלֹהֶיךָ und הָאֱלֹהִים in der Rede des heidnischen Kapitäns
  choice: „deinen Gott“ und anschließend „der Gott“
  alternative: „deinen Gott ... Gott“ oder „deine Gottheit ... die Gottheit“
  rationale: Der Sprecher fordert Jona auf, dessen eigenen Gott anzurufen, ohne hier bereits den HERRN beim Namen zu nennen oder ein ausdrückliches Bekenntnis zu ihm abzulegen. Anders als im Englischen kann die deutsche Großschreibung bei „Gott“ nicht zur Unterscheidung zwischen Eigenname und Gattungsbezeichnung dienen; Possessiv und Artikel tragen daher die kontextuelle Offenheit.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper erzählerischer Bewegung und dringlicher direkter Rede. Die ungewöhnliche Schärfe von „du Schläfer“ bewahrt bewusst die Ausdrucksform des Hebräischen; die Fußnoten erläutern echte lexikalische Alternativen, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
