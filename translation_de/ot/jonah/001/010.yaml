source:
  edition: WLC
  text: וַ/יִּֽירְא֤וּ הָֽ/אֲנָשִׁים֙ יִרְאָ֣ה גְדוֹלָ֔ה וַ/יֹּאמְר֥וּ אֵלָ֖י/ו מַה זֹּ֣את עָשִׂ֑יתָ כִּֽי יָדְע֣וּ הָ/אֲנָשִׁ֗ים כִּֽי מִ/לִּ/פְנֵ֤י יְהוָה֙ ה֣וּא בֹרֵ֔חַ כִּ֥י הִגִּ֖יד לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/010.yaml
  text: Then the men were greatly afraid[a], and they said to him, “What is this that you have done?” For the men knew that he was fleeing from the presence of Yahweh, because he had told them.
translation:
  language: de
  text: 'Da fürchteten sich die Männer sehr[a] und sagten zu ihm: »Was hast du da getan?« Denn die Männer wussten, dass er vor dem Angesicht Jahwes floh, weil er es ihnen erzählt hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Da fürchteten die Männer eine große Furcht.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: Da fürchteten sich die Männer sehr
  rationale: Der hebräische verwandte Akkusativ („sie fürchteten eine große Furcht“) verstärkt die Aussage. „fürchteten sich ... sehr“ gibt diese Intensität in natürlichem Deutsch wieder; die wörtlichere Form steht in der Fußnote.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das Substantiv bezeichnet hier wörtlich „die Männer“. Dass sie Seeleute sind, ergibt sich aus dem Zusammenhang, wird aber an dieser Stelle nicht ausdrücklich gesagt.
- source_word: מַה זֹּאת עָשִׂיתָ
  choice: Was hast du da getan?
  rationale: Das demonstrative זֹּאת wird durch „da“ knapp und idiomatisch wiedergegeben; zugleich bleibt der vorwurfsvolle Ausrufcharakter erhalten.
- source_word: מִלִּפְנֵי יְהוָה
  choice: vor dem Angesicht Jahwes
  rationale: Die Wendung bewahrt das Bild des Hebräischen („vom Angesicht/von der Gegenwart“) und damit die theologische Spannung des Versuchs, aus Gottes Gegenwart zu fliehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Standarddeutsch etablierte Form der wissenschaftlichen Umschrift.
- source_word: בֹרֵחַ
  choice: floh
  rationale: Das Partizip beschreibt Jonas im Verlauf befindliche Flucht. Im deutschen Nebensatz gibt „floh“ den fortdauernden Vorgang natürlich wieder, ohne ihn als bloß abgeschlossene Einzelhandlung festzulegen.
- source_word: כִּי ... כִּי
  choice: Denn ... weil
  rationale: Das erste כִּי leitet die Erklärung ein, das zweite nennt den Grund für das Wissen der Männer. Die unterschiedliche Wiedergabe macht die syntaktischen Funktionen im Deutschen klar.
- source_word: הִגִּיד לָהֶם
  choice: er es ihnen erzählt hatte
  rationale: Der Plusquamperfekt verdeutlicht, dass Jonas Mitteilung ihrem Wissen und ihrer Reaktion vorausging. Das im Deutschen nötige „es“ nimmt den Sachverhalt seiner Flucht auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen und nicht den Titel אֲדֹנָי. Die Wiedergabe als „Jahwe“ bewahrt diesen Unterschied, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Flucht מִלִּפְנֵי יְהוָה
  choice: vor dem Angesicht Jahwes floh
  alternative: vor Jahwe floh
  rationale: Die bildhafte Formulierung wahrt die Spannung, dass Jona aus der Gegenwart des allgegenwärtigen Gottes zu fliehen versucht, ohne diese Spannung erklärend aufzulösen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, während „Was hast du da getan?“ und die verbale Intensivierung natürlich deutsch formuliert sind.
