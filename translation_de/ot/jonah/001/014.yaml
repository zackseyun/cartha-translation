base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/014.yaml
  text: Then they cried out to Yahweh and said[a], “Please, Yahweh, do not let us perish on account of this man's life, and do not put innocent blood on us, for you, Yahweh[b], have done as you pleased.”
translation:
  language: de
  text: 'Da riefen sie zu Jahwe und sagten: „Ach, Jahwe, lass uns doch nicht wegen des Lebens dieses Mannes[a] umkommen, und lege uns kein unschuldiges Blut zur Last[b]! Denn du, Jahwe, hast getan, wie es dir gefiel.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegen der Seele dieses Mannes“; gemeint sein kann auch: „dafür, dass wir diesem Mann das Leben nehmen“ oder „wegen dieses Mannes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „rechne uns nicht die Schuld am Tod eines Unschuldigen zu“ beziehungsweise „mach uns nicht an unschuldigem Blut schuldig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־יְהוָה
  choice: Da riefen sie zu Jahwe
  rationale: קרא אל bezeichnet hier einen dringlichen Hilferuf an Gott. „Zu Jahwe rufen“ ist im Deutschen natürlich und bewahrt die Unmittelbarkeit der Notlage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlich üblichen Wiedergabe des Tetragramms.
- source_word: אָנָּה ... נָא
  choice: Ach ... doch
  rationale: Beide Partikeln unterstreichen die dringende Bitte. Die Verbindung „Ach ... doch“ gibt den flehentlichen Ton in natürlichem, würdigem Deutsch wieder.
- source_word: אַל־נָא נֹאבְדָה
  choice: lass uns doch nicht ... umkommen
  rationale: Der verneinte Kohortativ formuliert eine inständige Bitte. Diese Wiedergabe legt nicht unnötig fest, ob Jahwe das Umkommen aktiv bewirken oder lediglich zulassen würde.
- source_word: בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: wegen des Lebens dieses Mannes
  rationale: נפש bezeichnet hier das Leben des Mannes. Die bewusst quelltextnahe Formulierung wahrt die mögliche Beziehung sowohl zu Jonas Leben als auch dazu, dass die Seeleute es nehmen.
- source_word: וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא
  choice: und lade uns kein unschuldiges Blut auf
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des auf jemanden gelegten Blutes und lässt zugleich den Gedanken der Blutschuld erkennen.
- source_word: כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ
  choice: hast getan, wie es dir gefiel
  rationale: Die Formulierung gibt sowohl das vollzogene Handeln als auch Gottes freien Willen wieder, ohne spätere dogmatische Begriffe einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ wahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: wegen des Lebens dieses Mannes
  alternative: dafür, dass wir diesem Mann das Leben nehmen
  rationale: Die Hauptfassung bewahrt die knappe und etwas mehrdeutige hebräische Beziehung. Die Alternative macht den im Zusammenhang naheliegenden Gedanken des Tötens ausdrücklich, ist aber stärker auslegend.
- issue: Ausdrückliche Benennung der Blutschuld
  choice: lade uns kein unschuldiges Blut auf
  alternative: rechne uns nicht die Schuld am Tod eines Unschuldigen zu
  rationale: Das Bild des Ausgangstextes bleibt erhalten und ist auf Deutsch verständlich. Die Alternative erklärt den rechtlich-moralischen Sinn deutlicher, erweitert aber den Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ach ... doch“ erhält den flehentlichen Ton, während „lade uns kein unschuldiges Blut auf“ das hebräische Rechts- und Schuld bild verständlich bewahrt.
