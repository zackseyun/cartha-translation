base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/012.yaml
  text: And he said to them[a], “Pick me up and throw me into the sea, and the sea will become calm for you[c][b], for I know that this great storm is upon you because of me.”
translation:
  language: de
  text: 'Da sagte er zu ihnen: »Nehmt mich und werft[a] mich ins Meer! Dann wird sich das Meer beruhigen und euch in Ruhe lassen.[b] Denn ich weiß, dass dieser große Sturm wegen mir[c] über euch ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schleudert mich ins Meer.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Dann wird das Meer von über euch weg still werden.«'
    reason: literal_rendering
  - marker: c
    text: 'Oder: »aufgrund von mir«; die Wendung bezeichnet hier die Ursache bzw. Jonas’ Verantwortung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Hebt mich hoch
  rationale: נשא bezeichnet hier das körperliche Anheben Jonas, bevor er über Bord geworfen wird. Die Wiedergabe ist konkret, natürlich und wahrt die Abfolge der Handlungen.
- source_word: וַהֲטִילֻנִי
  choice: werft mich
  rationale: Der Hifil von טול bedeutet „werfen, schleudern“. „Werft mich“ ist im heutigen Deutsch klar und gibt die Handlung ohne unnötige Steigerung wieder.
- source_word: הַיָּם
  choice: das Meer
  rationale: יָם bedeutet regulär „Meer“; eine genauere geografische Festlegung wäre nicht durch den Vers begründet.
- source_word: וְיִשְׁתֹּק
  choice: wird sich … beruhigen
  rationale: Das Verb bedeutet wörtlich „still sein/werden“. Bei einem stürmischen Meer bezeichnet es das Ende des Tobens; „sich beruhigen“ ist dafür eine natürliche deutsche Entsprechung.
- source_word: מֵעֲלֵיכֶם
  choice: für euch
  rationale: Die wörtliche räumliche Formulierung „von über euch weg“ ist im Deutschen schwerfällig. „Für euch“ vermittelt idiomatisch, dass das Meer von ihnen ablässt; die hebräische Bildsprache wird in einer Fußnote kenntlich gemacht.
- source_word: יוֹדֵעַ אָנִי
  choice: ich weiß
  rationale: Partizip und Personalpronomen bilden eine nachdrückliche Wissensaussage. Das deutsche „ich weiß“ trägt den Sinn, ohne die Betonung künstlich zu verstärken.
- source_word: בְשֶׁלִּי
  choice: meinetwegen
  rationale: Die Wendung bezeichnet Ursache beziehungsweise Verantwortlichkeit. „Meinetwegen“ bewahrt diese Bedeutungsweite und lässt im Zusammenhang Jonas Eingeständnis seiner Verantwortung erkennen.
- source_word: הַסַּעַר הַגָּדוֹל הַזֶּה
  choice: dieser gewaltige Sturm
  rationale: „Gewaltig“ gibt die Größe und Heftigkeit von גָּדוֹל in diesem Sturmkontext natürlich wieder, ohne das Substantiv סַעַר zu überbestimmen.
- source_word: עֲלֵיכֶם
  choice: über euch gekommen ist
  rationale: Die hebräische Präposition zeichnet den Sturm als auf den Seeleuten lastend. Die deutsche Wendung „über euch gekommen“ bewahrt dieses Bild in idiomatischer Form.
theological_decisions:
- issue: Jonas Eingeständnis seiner Verantwortung für den Sturm
  choice: „meinetwegen“
  alternative: „aufgrund meiner Anwesenheit“
  rationale: בְשֶׁלִּי bezeichnet hier Ursache beziehungsweise Verantwortlichkeit, nicht bloß eine neutrale Verbindung. Die Übersetzung bewahrt Jonas klares Eingeständnis, ohne über den Wortlaut hinaus die genaue Art seiner Schuld auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich; eine schwerfällige wörtliche Wiedergabe von מֵעֲלֵיכֶם wird in die Fußnote verlagert.
