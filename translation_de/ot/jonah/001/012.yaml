    issue: Zeitform bei עֲלֵיכֶם
    rationale: '„… über euch gekommen ist“ macht den Sturm zu einem bereits eingetretenen Ereignis. Der hebräische Nominalsatz lautet wörtlich: „dieser große Sturm [ist] über euch“.'
