  to: 'Da sagte er zu ihnen: »Nehmt mich und werft[a] mich ins Meer! Dann wird sich das Meer beruhigen und euch in Ruhe lassen.[b] Denn ich weiß, dass dieser große Sturm wegen mir[c] über euch ist.«'
