source:
  edition: WLC
  text: וַ/יָּ֤קָם יוֹנָה֙ לִ/בְרֹ֣חַ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָ֑ה וַ/יֵּ֨רֶד יָפ֜וֹ וַ/יִּמְצָ֥א אָנִיָּ֣ה בָּאָ֣ה תַרְשִׁ֗ישׁ וַ/יִּתֵּ֨ן שְׂכָרָ֜/הּ וַ/יֵּ֤רֶד בָּ/הּ֙ לָ/ב֤וֹא עִמָּ/הֶם֙ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/003.yaml
  text: But Jonah rose to flee to Tarshish from the presence of Yahweh[a]. He went down to Joppa and found a ship going to Tarshish. He paid its fare and went down into it to go with them to Tarshish[c][b], away from the presence of Yahweh.
translation:
  language: de
  text: Doch Jona machte sich auf, um nach Tarsis zu fliehen, fort von Jahwes Angesicht[a]. Er ging hinab nach Joppe und fand ein Schiff, das nach Tarsis fuhr[b]. Er bezahlte den Fahrpreis und ging hinab in das Schiff[c], um mit ihnen nach Tarsis zu fahren, fort von Jahwes Angesicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weg von Jahwe“; wörtlich: „fort vom Angesicht Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann die hebräische Wendung auch als „ein nach Tarsis kommendes Schiff“ wiedergegeben werden; gemeint ist ein Schiff mit dem Ziel Tarsis.
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen wird „hinabgehen“ wiederholt. Diese Wiederholung prägt die Abwärtsbewegung der Erzählung in diesem Kapitel.
    reason: literary_feature
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: Die Wendung gibt das Aufstehen und den Beginn der Handlung in natürlichem, würdigem Deutsch wieder, ohne die narrative Abfolge zu glätten.
- source_word: לִבְרֹחַ
  choice: zu fliehen
  rationale: ברח bezeichnet eine bewusste Flucht; „fliehen“ bewahrt den Ernst von Jonas Versuch.
- source_word: תַּרְשִׁישָׁה
  choice: nach Tarsis
  rationale: Das Richtungs-ה bezeichnet eine Bewegung auf Tarsis zu; im Deutschen ist „nach Tarsis“ idiomatisch.
- source_word: מִלִּפְנֵי יְהוָה
  choice: vor Jahwes Angesicht / fort von Jahwes Angesicht
  rationale: Die konkrete Wendung mit פנים wird bewahrt; beim zweiten Vorkommen verdeutlicht „fort von“ die Bewegungsrichtung, ohne die Wiederholung von „Angesicht“ aufzugeben.
- source_word: יָפוֹ
  choice: Jafo
  rationale: „Jafo“ ist eine unmittelbare deutsche Wiedergabe des hebräischen Ortsnamens; die traditionelle Form „Joppe“ ist ebenfalls geläufig.
- source_word: אָנִיָּה
  choice: Schiff
  rationale: Das Wort bezeichnet hier ein seetüchtiges Fahrzeug; „Schiff“ ist die natürliche deutsche Entsprechung.
- source_word: בָּאָה תַרְשִׁישׁ
  choice: das nach Tarsis fuhr
  rationale: בוא kann in einer Reiseangabe die Bewegung zu einem Ziel ausdrücken. „Fuhr“ ist im Zusammenhang eines Schiffes natürlich, während die wörtlichere Perspektive in der Fußnote angezeigt wird.
- source_word: שְׂכָרָהּ
  choice: den Fahrpreis
  rationale: שׂכר bezeichnet Lohn, Miete oder Entgelt; im Kontext einer Schiffsreise passt „Fahrpreis“, ohne festzulegen, dass Jona das ganze Schiff mietete.
- source_word: וַיֵּרֶד בָּהּ
  choice: ging in das Schiff hinab
  rationale: Die wiederholte Abwärtsbewegung mit ירד bleibt ausdrücklich erhalten und wird nicht zu „stieg ein“ verflacht.
- source_word: לָבוֹא עִמָּהֶם
  choice: um mit ihnen ... zu fahren
  rationale: „Fahren“ entspricht im Deutschen der Reise mit dem Schiff und gibt die Zweckkonstruktion natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִלִּפְנֵי יְהוָה
  choice: vor/fort von Jahwes Angesicht
  alternative: weg von Jahwe
  rationale: Die bildhafte Rede vom Angesicht beziehungsweise von der Gegenwart Gottes bleibt bestehen. So wird die theologische Spannung von Jonas Fluchtversuch nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die konkrete Rede von Jahwes „Angesicht“ und die Wiederholung des Hinabgehens wurden wegen ihrer literarischen und theologischen Bedeutung bewahrt.
