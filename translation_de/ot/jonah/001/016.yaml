source:
  edition: WLC
  text: וַ/יִּֽירְא֧וּ הָ/אֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת יְהוָ֑ה וַ/יִּֽזְבְּחוּ זֶ֨בַח֙ לַֽ/יהוָ֔ה וַֽ/יִּדְּר֖וּ נְדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/016.yaml
  text: Then the men feared Yahweh with great fear[a], and they offered a sacrifice to Yahweh and made vows.
translation:
  language: de
  text: Da bekamen die Männer große Furcht vor Jahwe[a]. Sie brachten Jahwe ein Schlachtopfer dar und legten Gelübde ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Die Männer fürchteten eine große Furcht vor Jahwe.“ Gemeint sein können große Angst, tiefe Ehrfurcht oder beides zugleich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: bekamen ... große Furcht
  rationale: 'Die Verbindung aus ירא und dem stammverwandten Substantiv יִרְאָה verstärkt die Aussage (wörtlich etwa: „sie fürchteten eine große Furcht“). Die gewählte Formulierung bewahrt die starke Furchtsprache, ohne sie ausschließlich als Schrecken oder ausschließlich als Ehrfurcht festzulegen.'
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das gewöhnliche Substantiv bezeichnet hier „die Männer“. Obwohl der Kontext sie als Seeleute ausweist, wird die Formulierung des hebräischen Textes beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּזְבְּחוּ זֶבַח
  choice: brachten ... ein Schlachtopfer dar
  rationale: Die figura etymologica aus Verb und Substantiv bezeichnet idiomatisch das Darbringen eines Opfers. „Schlachtopfer darbringen“ ist im Deutschen natürlich und wahrt den kultischen Sinn.
- source_word: וַיִּדְּרוּ נְדָרִים
  choice: legten Gelübde ab
  rationale: Die Verbindung aus נדר und נְדָרִים bezeichnet das feierliche Eingehen religiöser Verpflichtungen. „Gelübde ablegen“ ist eine geläufige deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt seinen Charakter als Eigenname.
- issue: Bedeutungsumfang der Furcht vor Jahwe
  choice: große Furcht vor Jahwe
  alternative: große Ehrfurcht vor Jahwe / große Angst vor Jahwe
  rationale: Der Kontext verbindet die Reaktion auf das Stillwerden des Meeres mit Opfer und Gelübden. Daher kann die Furcht Schrecken und ehrfürchtige Gottesverehrung umfassen; die Übersetzung legt sie nicht einseitig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die starke hebräische Furchtsprache bleibt erkennbar, wird jedoch in eine natürliche deutsche Satzform übertragen. „Schlachtopfer“ macht den kultischen Charakter deutlicher als das allgemeinere „Opfer“.
