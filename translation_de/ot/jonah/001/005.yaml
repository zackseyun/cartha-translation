  terminology: „Seeleute“, „sein Gott“ und „Jona“ sind angemessen. „Geräte“ ist als breite Wiedergabe von כֵּלִים möglich; die Fußnote muss die kontextuell naheliegende Bedeutung „Ladung“ transparent machen. Die Fußnotenanker sind korrekt platziert.
