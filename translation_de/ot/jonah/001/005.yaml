  text: וַ/יִּֽירְא֣וּ הַ/מַּלָּחִ֗ים וַֽ/יִּזְעֲקוּ֮ אִ֣ישׁ אֶל אֱלֹהָי/ו֒ וַ/יָּטִ֨לוּ אֶת הַ/כֵּלִ֜ים אֲשֶׁ֤ר בָּֽ/אֳנִיָּה֙ אֶל הַ/יָּ֔ם לְ/הָקֵ֖ל מֵֽ/עֲלֵי/הֶ֑ם וְ/יוֹנָ֗ה יָרַד֙ אֶל יַרְכְּתֵ֣י הַ/סְּפִינָ֔ה וַ/יִּשְׁכַּ֖ב וַ/יֵּרָדַֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/005.yaml
  text: Then the sailors were afraid[a], and each cried out to his god. They threw the cargo that was in the ship into the sea to lighten it for themselves. But Yonah had gone down into the innermost parts of the vessel[b], and he lay down and fell fast asleep.
translation:
  language: de
  text: Da fürchteten sich die Seeleute, und jeder schrie zu seinem Gott. Sie warfen die Geräte[a], die sich im Schiff befanden, ins Meer, um sich zu entlasten. Jona aber war in die hintersten Bereiche des Schiffes[b] hinabgestiegen, hatte sich hingelegt und war fest eingeschlafen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ausrüstung“ oder „die Gegenstände“; im Zusammenhang wahrscheinlich „die Ladung“. Das hebräische Wort ist weit gefasst und kann Gegenstände, Geräte oder Ausrüstung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in die innersten Winkel des Schiffes“ beziehungsweise „in den Laderaum“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הַמַּלָּחִים
  choice: Da fürchteten sich die Seeleute
  rationale: Gibt die durch die Gefahr ausgelöste Furcht schlicht und in natürlichem modernem Deutsch wieder; „Seeleute“ bezeichnet die Schiffsbesatzung ohne altertümlichen Klang.
- source_word: וַיִּזְעֲקוּ אִישׁ אֶל אֱלֹהָיו
  choice: und jeder schrie zu seinem Gott
  rationale: זעק bezeichnet einen eindringlichen Hilferuf; אִישׁ wird distributiv mit „jeder“ wiedergegeben, und der Singular mit Suffix bleibt als „sein Gott“ erhalten.
- source_word: וַיָּטִלוּ אֶת הַכֵּלִים
  choice: Sie warfen die Geräte
  rationale: כֵּלִים ist weiter als „Ladung“ und kann Gegenstände, Geräte oder Ausrüstung bezeichnen. „Geräte“ bewahrt diese lexikalische Breite; die wahrscheinliche maritime Bedeutung wird in der Fußnote erläutert.
- source_word: אֲשֶׁר בָּאֳנִיָּה אֶל הַיָּם
  choice: die sich im Schiff befanden, ins Meer
  rationale: Die Relativkonstruktion wird idiomatisch ausgedrückt; „ins Meer“ bildet die Zielrichtung des Werfens natürlich ab.
- source_word: לְהָקֵל מֵעֲלֵיהֶם
  choice: um es für sich leichter zu machen
  rationale: הקל bedeutet „leicht machen/erleichtern“. Das Pronomen „es“ nimmt sinngemäß das Schiff auf; „für sich“ bewahrt den auf die Seeleute bezogenen Nutzen, ohne ausdrücklich „die Last“ hinzuzufügen.
- source_word: וְיוֹנָה יָרַד
  choice: Jona aber war ... hinabgestiegen
  rationale: „Aber“ macht den erzählerischen Gegensatz zur hektischen Tätigkeit der Seeleute deutlich. Das Plusquamperfekt stellt Jonas vorheriges Hinabsteigen als Hintergrund dar; „Jona“ ist die etablierte deutsche Namensform.
- source_word: אֶל יַרְכְּתֵי הַסְּפִינָה
  choice: in den hintersten Raum des Schiffes
  rationale: יַרְכְּתֵי bezeichnet den abgelegenen, tief im Inneren liegenden Bereich. Die Wiedergabe bleibt räumlich und vermeidet die technisch engere Festlegung auf den „Laderaum“.
- source_word: וַיִּשְׁכַּב וַיֵּרָדַם
  choice: hatte sich hingelegt und war fest eingeschlafen
  rationale: Die beiden aufeinanderfolgenden Handlungen werden vollständig wiedergegeben. „Fest eingeschlafen“ vermittelt die intensive Verbform und Jonas tiefen Schlaf.
theological_decisions:
- issue: Bezeichnung der von den Seeleuten angerufenen Gottheiten (אֱלֹהָיו)
  choice: jeder schrie zu seinem Gott
  alternative: jeder schrie zu seinen Göttern
  rationale: Das distributive אִישׁ und das Suffix der dritten Person Singular sprechen dafür, dass jeder Seemann seine eigene Gottheit anruft. Die Formulierung identifiziert diese nicht mit dem Gott Israels.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Satzfolge stellt die verzweifelte Aktivität der Seeleute Jonas Rückzug und tiefem Schlaf gegenüber. Lexikalische Unschärfen bei כֵּלִים und יַרְכְּתֵי werden im Haupttext nicht unnötig verengt und durch Fußnoten transparent gemacht.
