  to: Da fürchteten sich die Seeleute, und jeder schrie zu seinem Gott. Sie warfen die Geräte[a], die sich im Schiff befanden, ins Meer, um sich zu entlasten. Jona aber war in die hintersten Bereiche des Schiffes[b] hinabgestiegen, hatte sich hingelegt und war fest eingeschlafen.
  rationale: Die Revision beseitigt die unzulässige Singularisierung der „hintersten Bereiche“ und klärt die deutsche Zielangabe beim Entlasten. Die lexikalische Offenheit von כֵּלִים und die mögliche, aber nicht im Haupttext festgelegte Deutung als Laderaum bleiben durch Fußnoten erhalten.
