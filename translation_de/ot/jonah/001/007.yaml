  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ לְכוּ֙ וְ/נַפִּ֣ילָה גֽוֹרָל֔וֹת וְ/נֵ֣דְעָ֔ה בְּ/שֶׁ/לְּ/מִ֛י הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ וַ/יַּפִּ֨לוּ֙ גּֽוֹרָל֔וֹת וַ/יִּפֹּ֥ל הַ/גּוֹרָ֖ל עַל יוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/007.yaml
  text: And they said[a], each man to his companion, “Come, let us cast lots, so that we may know on whose account this evil has come upon us.” So they cast lots, and the lot fell on Jonah.
translation:
  language: de
  text: 'Da sagten sie zueinander: »Kommt, lasst uns Lose werfen, damit wir erfahren, um wessentwillen dieses Unheil[a] über uns gekommen ist.« Sie warfen also Lose, und das Los fiel auf Jona.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses Böse« oder »dieses Unglück«. Das hebräische Wort kann je nach Zusammenhang Böses, Unheil oder Unglück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: einer zum anderen
  rationale: Die distributive hebräische Wendung beschreibt, wie die Männer sich gegenseitig ansprechen. »Einer zum anderen« gibt dies im Deutschen natürlich und knapp wieder.
- source_word: לְכוּ
  choice: Kommt
  rationale: Das Verb dient hier idiomatisch als auffordernde Einleitung zu einem gemeinsamen Vorhaben; »Kommt« bewahrt Imperativ und Gesprächsdynamik.
- source_word: וְנַפִּילָה גוֹרָלוֹת
  choice: lasst uns Lose werfen
  rationale: Der Kohortativ drückt einen gemeinsamen Entschluss aus. »Lose werfen« bezeichnet die Handlung im heutigen Deutsch klar.
- source_word: וְנֵדְעָה
  choice: damit wir erfahren
  rationale: Der zweite Kohortativ bezeichnet hier das Ziel des Loswerfens. »Erfahren« ist in diesem Zusammenhang natürlicher als das wörtlichere »wissen«.
- source_word: בְּשֶׁלְּמִי
  choice: um wessentwillen
  rationale: Die Formulierung fragt nach der Person, deretwegen das Unheil eingetreten ist, ohne bereits ausdrücklich moralische Schuld festzustellen.
- source_word: הָרָעָה הַזֹּאת
  choice: dieses Unheil
  rationale: רָעָה kann moralisch Böses oder erfahrbares Unglück und Unheil bezeichnen. Im Kontext des Sturms steht die konkrete Notlage im Vordergrund; eine Fußnote bewahrt die weitere Bedeutungsbreite.
- source_word: לָנוּ
  choice: über uns gekommen ist
  rationale: Das Hebräische enthält hier kein ausdrückliches Verb für »kommen«; die deutsche Ergänzung gibt den situativen Sinn des Dativs idiomatisch wieder.
- source_word: וַיַּפִּלוּ גוֹרָלוֹת
  choice: Sie warfen also Lose
  rationale: Die Erzählform führt die Handlung als Umsetzung des Vorschlags fort; »also« macht diesen Zusammenhang natürlich deutlich.
- source_word: וַיִּפֹּל הַגּוֹרָל עַל יוֹנָה
  choice: das Los fiel auf Jona
  rationale: Dies ist die übliche deutsche Wiedergabe des hebräischen Idioms und bezeichnet eindeutig das Ergebnis.
theological_decisions:
- issue: Wiedergabe von רָעָה im Zusammenhang einer als verursacht verstandenen Katastrophe
  choice: dieses Unheil
  alternative: dieses Böse; dieses Unglück
  rationale: Der unmittelbare Bezug ist der lebensbedrohliche Sturm, daher ist »Unheil« kontextgerecht. Da das hebräische Wort zugleich »Böses« bedeuten kann, wird diese Spannung in der Fußnote offengelegt, ohne eine Aussage über moralische Schuld oder Gottes Charakter in den Text hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher direkter Rede. Die traditionelle Handlung des Loswerfens bleibt ohne erklärende Erweiterung im Haupttext stehen. Der Name wird nach moderner deutscher Bibelkonvention als »Jona« wiedergegeben.
