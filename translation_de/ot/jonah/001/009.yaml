id: JON.1.9
reference: Jonah 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם עִבְרִ֣י אָנֹ֑כִי וְ/אֶת יְהוָ֞ה אֱלֹהֵ֤י הַ/שָּׁמַ֨יִם֙ אֲנִ֣י יָרֵ֔א אֲשֶׁר עָשָׂ֥ה אֶת הַ/יָּ֖ם וְ/אֶת הַ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/009.yaml
  text: He said to them[a], “I am a Hebrew, and I fear Yahweh, the God of heaven[b], who made the sea and the dry land.”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Ich bin ein Hebräer, und ich fürchte[a] Jahwe[b], den Gott des Himmels, der das Meer und das trockene Land gemacht hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verehre«; das hebräische Wort kann hier ehrfürchtige Gottesverehrung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH, der Gottesname.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Er sagte zu ihnen
  rationale: Gibt die hebräische Erzählform natürlich wieder; das einleitende וַ wird im Deutschen nicht eigens mit „und“ wiedergegeben.
- source_word: עִבְרִי
  choice: Hebräer
  rationale: Die geläufige deutsche Bezeichnung für Jonas ethnische Selbstidentifikation.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: der Gott des Himmels
  rationale: Natürliche deutsche Wiedergabe der hebräischen Konstruktverbindung; der morphologische Plural שָׁמַיִם wird in dieser festen Wendung idiomatisch mit „Himmel“ übersetzt.
- source_word: יָרֵא
  choice: fürchte
  rationale: Bewahrt den unmittelbaren Wortsinn und die Spannung zwischen Jonas Bekenntnis und seinem Verhalten; ehrfürchtige Verehrung klingt im Kontext mit an.
- source_word: עָשָׂה
  choice: gemacht hat
  rationale: Entspricht dem allgemeinen Verb עשה genauer als das interpretativ stärkere „erschaffen hat“.
- source_word: הַיָּם
  choice: das Meer
  rationale: Die übliche und im Seefahrtskontext passende Wiedergabe.
- source_word: הַיַּבָּשָׁה
  choice: das trockene Land
  rationale: Bewahrt den ausdrücklichen Gegensatz zum Meer.
- source_word: אָנֹכִי ... אֲנִי
  choice: Ich bin ... und ich fürchte
  rationale: Die zweimalige ausdrückliche Ich-Form wird in natürlichem Deutsch durch ein eigenes „ich“ in beiden Satzteilen abgebildet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht stillschweigend durch einen Titel.
- issue: Bedeutungsumfang von יָרֵא in Jonas Selbstbeschreibung
  choice: fürchte
  alternative: verehre; bete an
  rationale: „Fürchte“ lässt sowohl Furcht als auch ehrfürchtige Gottesverehrung anklingen und bewahrt die im Kontext auffällige Spannung zwischen Jonas Bekenntnis und seinem Handeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt klar und mündlich sprechbar; die theologische Spannung des Verbs יָרֵא wird nicht geglättet.
