  text: וַֽ/יהוָ֗ה הֵטִ֤יל רֽוּחַ גְּדוֹלָה֙ אֶל הַ/יָּ֔ם וַ/יְהִ֥י סַֽעַר גָּד֖וֹל בַּ/יָּ֑ם וְ/הָ֣/אֳנִיָּ֔ה חִשְּׁבָ֖ה לְ/הִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
translation:
  language: de
  text: Doch Jahwe schleuderte einen gewaltigen Wind auf das Meer[a], und auf dem Meer entstand ein gewaltiger Sturm. Das Schiff drohte auseinanderzubrechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Jahwe schleuderte einen gewaltigen Wind auf das Meer.“ Das hebräische Bindewort kann schlicht mit „und“ wiedergegeben werden; „doch“ hebt hier den Gegensatz zu Jonas Flucht hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Das Schiff dachte, zerbrochen zu werden.“ Der hebräische Text personifiziert das Schiff und beschreibt so anschaulich, dass es auseinanderzubrechen drohte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Doch Jahwe
  rationale: Das Waw führt die Erzählung weiter, hat nach Jonas Flucht aber zugleich eine kontrastierende Wirkung. „Doch“ bildet diesen Umschwung natürlich ab; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הֵטִיל
  choice: schleuderte
  rationale: Das Verb bezeichnet ein kraftvolles Werfen. „Schleuderte“ bewahrt die Bildhaftigkeit und betont Jahwes unmittelbares Handeln.
- source_word: רוּחַ גְּדוֹלָה
  choice: einen gewaltigen Wind
  rationale: Im Zusammenhang von Meer und Sturm bedeutet רוּחַ eindeutig „Wind“. „Gewaltig“ gibt גָּדוֹל idiomatisch wieder und ermöglicht die Wiederholung desselben Adjektivs beim Sturm.
- source_word: אֶל הַיָּם
  choice: auf das Meer
  rationale: אֶל bezeichnet hier bei einem Verb des Werfens die Richtung auf ein Ziel hin. „Auf das Meer“ bewahrt diese dynamische Bedeutung.
- source_word: וַיְהִי סַעַר גָּדוֹל בַּיָּם
  choice: und auf dem Meer entstand ein gewaltiger Sturm
  rationale: Die Formulierung gibt das Eintreten des durch den Wind hervorgerufenen Zustands in natürlichem Deutsch wieder und bewahrt die Wiederholung von גָּדוֹל als „gewaltig“.
- source_word: וְהָאֳנִיָּה חִשְּׁבָה לְהִשָּׁבֵר
  choice: Das Schiff drohte auseinanderzubrechen
  rationale: 'Wörtlich wird das Schiff personifiziert: Es „dachte“, zerbrochen zu werden. Die deutsche Wendung „drohte auseinanderzubrechen“ vermittelt die unmittelbar bevorstehende Gefahr klar; die Personifikation wird in einer Fußnote offengelegt.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige Bildsprache des hebräischen Textes bleibt durch „schleuderte“ und die Wiederholung von „gewaltig“ erhalten; die schwer übertragbare Personifikation wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
