  naturalness: Die amtliche Rede ist insgesamt gut getroffen. „Weder … noch“ strukturiert die aufgezählten Gruppen klarer, und der Verzicht auf „und sagen“ ergibt eine natürliche moderne deutsche Erlassformel.
  terminology: „Ninive“, „seiner Großen“, „Vieh“, „Rinder“ und „Kleinvieh“ sind angemessen. „Seine Großen“ erhält die im Hebräischen offene Bezeichnung der führenden Personen und legt weder Adel noch Amtsfunktion fest.
