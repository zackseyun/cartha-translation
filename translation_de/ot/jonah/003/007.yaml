  text: וַ/יַּזְעֵ֗ק וַ/יֹּ֨אמֶר֙ בְּ/נִֽינְוֵ֔ה מִ/טַּ֧עַם הַ/מֶּ֛לֶךְ וּ/גְדֹלָ֖י/ו לֵ/אמֹ֑ר הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה הַ/בָּקָ֣ר וְ/הַ/צֹּ֗אן אַֽל יִטְעֲמוּ֙ מְא֔וּמָה אַ֨ל יִרְע֔וּ וּ/מַ֖יִם אַל יִשְׁתּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/007.yaml
  text: 'And he proclaimed and said in Nineveh[a], by decree of the king and his nobles: “Let neither man nor beast, herd nor flock, taste anything. Let them not graze[b], and let them not drink water.”'
translation:
  language: de
  text: 'Und er ließ in Ninive ausrufen: „Auf Befehl des Königs und seiner Großen: Weder Menschen noch Vieh, weder Rinder noch Kleinvieh sollen irgendetwas kosten. Sie sollen nicht weiden und kein Wasser trinken.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּזְעֵק וַיֹּאמֶר
  choice: er ließ … ausrufen und sagen
  rationale: זעק bezeichnet hier das öffentliche Ausrufen eines Erlasses; die Verbindung mit ויאמר wird bewusst beibehalten, ohne im Deutschen einen unnatürlichen Subjektwechsel zu erzeugen.
- source_word: בְּנִינְוֵה
  choice: in Ninive
  rationale: Die Ortsangabe bezeichnet den Bereich, in dem die Bekanntmachung ergeht.
- source_word: מִטַּעַם
  choice: auf Befehl
  rationale: טעם bezeichnet im administrativen Zusammenhang eine verbindliche königliche Anordnung. „Auf Befehl“ ist im modernen Deutschen natürlich und bewahrt den amtlichen Charakter.
- source_word: הַמֶּלֶךְ וּגְדֹלָיו
  choice: des Königs und seiner Großen
  rationale: „Seine Großen“ bildet die wörtliche Bezeichnung der führenden Männer am Hof ab, ohne ihre genaue Funktion stärker als der hebräische Text festzulegen.
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: Menschen und Vieh
  rationale: האדם ist kollektiv gebraucht und steht den Tieren gegenüber. Der deutsche Plural „Menschen“ gibt diesen generischen Sinn klar wieder; בהמה bezeichnet hier das domestizierte Vieh.
- source_word: הַבָּקָר וְהַצֹּאן
  choice: Rinder und Kleinvieh
  rationale: בקר bezeichnet Rindvieh, צאן die Herden aus Schafen und Ziegen. „Kleinvieh“ bewahrt diese breitere Bedeutung besser als nur „Schafe“.
- source_word: אַל יִטְעֲמוּ מְאוּמָה
  choice: sollen nichts zu sich nehmen
  rationale: טעם bedeutet wörtlich „kosten“; im Fastengebot bezeichnet die Wendung allgemein das Aufnehmen von Nahrung. Die deutsche Formulierung ist natürlich und lässt den umfassenden Charakter bestehen.
- source_word: אַל יִרְעוּ
  choice: Sie sollen nicht weiden
  rationale: רעה bedeutet hier vom Vieh gesagt „weiden“ beziehungsweise „grasen“.
- source_word: וּמַיִם אַל יִשְׁתּוּ
  choice: und kein Wasser trinken
  rationale: Die ausdrückliche Nennung des Wassers und das Verbot des Trinkens werden direkt wiedergegeben.
theological_decisions:
- issue: Kollektiver Gebrauch von הָאָדָם im Gegensatz zu den Tieren
  choice: Menschen
  alternative: der Mensch
  rationale: Der Vers regelt das Verhalten aller Bewohner. „Menschen“ macht den kollektiven Bezug in modernem Deutsch eindeutig, ohne eine Aussage über Geschlecht oder eine besondere anthropologische Lehre einzutragen.
- issue: Identität der גְדֹלָיו
  choice: seine Großen
  alternative: seine Vornehmen / seine Beamten
  rationale: Der Text nennt ranghohe Personen beim König, legt aber nicht eindeutig fest, ob ihr Rang adlig oder amtlich bestimmt ist. Die formnahe Wiedergabe erhält diese Offenheit.
translation_notes:
  register: Dignischer, öffentlich-amtlicher Ton mit natürlicher moderner Syntax. Die Wiederholung der beiden hebräischen Verkündungsverben bleibt in „ausrufen und sagen“ sichtbar. Keine Fußnoten sind nötig, da die relevanten Offenheiten im Haupttext bewahrt werden.
