  text: מִֽי יוֹדֵ֣עַ יָשׁ֔וּב וְ/נִחַ֖ם הָ/אֱלֹהִ֑ים וְ/שָׁ֛ב מֵ/חֲר֥וֹן אַפּ֖/וֹ וְ/לֹ֥א נֹאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/009.yaml
  text: Who knows? God may turn and relent[a], and turn from the burning of his anger[b], so that we do not perish.
translation:
  language: de
  text: Wer weiß? Gott könnte umkehren, seinen Entschluss ändern[a] und sich von der Glut seines Zorns abwenden[b], sodass wir nicht zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »es sich gereuen lassen« oder »vom angekündigten Gericht ablassen«. Gemeint ist hier, dass Gott das angedrohte Urteil nicht vollstreckt.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »sich von seinem heftigen Zorn abwenden«. Wörtlich spricht das Hebräische von der »Glut seines Zorns«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Wer weiß?
  rationale: Die idiomatische Frage drückt Ungewissheit und zugleich Hoffnung aus und bewahrt die rhetorische Kraft des Hebräischen.
- source_word: יָשׁוּב
  choice: Vielleicht kehrt Gott um
  rationale: Nach »Wer weiß?« bezeichnet die Verbform eine erhoffte Möglichkeit, keine Gewissheit. »Umkehren« bewahrt zudem die Grundbedeutung von שוב.
- source_word: וְנִחַם
  choice: und lässt es sich gereuen
  rationale: נחם bezeichnet hier Gottes Abstehen vom angekündigten Gericht. Die Formulierung bewahrt die Aussage von Gottes Reaktion, ohne sie als Eingeständnis eines moralischen Fehlers zu deuten.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Die bestimmte Form des üblichen Gottesbegriffs wird im Kontext sachgemäß mit »Gott« wiedergegeben.
- source_word: וְשָׁב
  choice: vielleicht kehrt er ... um
  rationale: Die Wiederholung von שוב wird auch im Deutschen durch die erneute Verwendung von »umkehren« sichtbar gehalten.
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: von der Glut seines Zorns
  rationale: Die Wendung bezeichnet heftigen Zorn; »Glut« erhält das hebräische Bild von Hitze und Brennen.
- source_word: וְלֹא נֹאבֵד
  choice: sodass wir nicht zugrunde gehen
  rationale: Die Formulierung gibt die erhoffte Folge des göttlichen Einlenkens natürlich wieder und bewahrt die erste Person Plural.
theological_decisions:
- issue: Darstellung von Gottes Reue beziehungsweise Einlenken (נחם)
  choice: Gott »lässt es sich gereuen«
  alternative: Gott »ändert seinen Entschluss« oder »lässt vom angekündigten Gericht ab«
  rationale: Der Vers äußert die Hoffnung, dass Gott das angekündigte Gericht nicht vollstreckt. Die gewählte Wiedergabe erhält die echte Aussage göttlicher Reaktion, ohne die theologische Spannung durch Aussagen über Irrtum oder mangelndes Vorwissen aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Verwendung von »umkehren« bildet die Wiederholung desselben hebräischen Verbs ab. »Es sich gereuen lassen« ist bewusst etwas gehoben, bleibt aber verständlich und wahrt die theologische Spannung des Ausgangstextes.
