revisions:
- from: Als Gott ihre Taten sah, nämlich dass sie von ihrem bösen Weg umgekehrt waren, da gereute Gott[a] das Unheil[b], von dem er gesagt hatte, er werde es ihnen antun, und er tat es nicht.
  to: Als Gott sah, wie sie handelten und dass sie von ihrem bösen Weg umgekehrt waren, ließ Gott von dem Unheil[a] ab, das er ihnen anzutun angekündigt hatte, und tat es nicht.
  rationale: Die Revision ersetzt die im modernen Deutsch unübliche Formulierung „gereute Gott das Unheil“ durch „ließ Gott von dem Unheil ab“ und dokumentiert die mögliche wörtlichere Lesart in einer Fußnote. Sie glättet außerdem die Satzfügung und gibt die angekündigte Handlung idiomatisch als „anzutun angekündigt hatte“ wieder. Die Anker der Wortspiel-Fußnote werden beibehalten, indem sie bei „Unheil“ gesetzt wird; der zweite Fußnotentext erläutert weiterhin beide Vorkommen von רָעָה.
