source:
  edition: WLC
  text: וַ/יַּ֤רְא הָֽ/אֱלֹהִים֙ אֶֽת מַ֣עֲשֵׂי/הֶ֔ם כִּי שָׁ֖בוּ מִ/דַּרְכָּ֣/ם הָ/רָעָ֑ה וַ/יִּנָּ֣חֶם הָ/אֱלֹהִ֗ים עַל הָ/רָעָ֛ה אֲשֶׁר דִּבֶּ֥ר לַ/עֲשׂוֹת לָ/הֶ֖ם וְ/לֹ֥א עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/010.yaml
  text: When God saw their deeds[a], that they had turned from their evil way, God relented concerning the disaster that he had spoken to bring on them[b], and he did not do it.
translation:
  language: de
  text: Als Gott sah, wie sie handelten und dass sie von ihrem bösen Weg umgekehrt waren, ließ Gott von dem Unheil[a] ab, das er ihnen anzutun angekündigt hatte, und tat es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort, das hier mit „ließ … ab“ wiedergegeben wird, kann auch „es gereute Gott“ oder „Gott änderte seinen Entschluss“ bedeuten. Es beschreibt Gottes Reaktion auf Ninives Umkehr, ohne damit ein moralisches Versagen Gottes auszusagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das erzählende ראה wird schlicht und unmittelbar mit „sah“ wiedergegeben, ohne es auf bloße Kenntnisnahme einzuengen.
- source_word: מַעֲשֵׂיהֶם
  choice: ihre Taten
  rationale: „Taten“ gibt die konkreten Handlungen und ihr moralisches Gewicht natürlich wieder.
- source_word: כִּי שָׁבוּ
  choice: nämlich dass sie … umgekehrt waren
  rationale: כִּי erläutert hier, worin die von Gott gesehenen Taten bestanden; das Plusquamperfekt ordnet die Umkehr vor Gottes Reaktion ein.
- source_word: מִדַּרְכָּם הָרָעָה
  choice: von ihrem bösen Weg
  rationale: Die Einzahl und das Bild des moralischen Weges bleiben erhalten; רָעָה bezeichnet hier sittliches Böses.
- source_word: וַיִּנָּחֶם
  choice: da gereute Gott
  rationale: „Gereuen“ bewahrt die auffällige Aussage über Gottes wirkliche Reaktion und vermeidet zugleich die eindeutige Unterstellung einer sündhaften Reue oder eines Irrtums.
- source_word: עַל הָרָעָה
  choice: das Unheil
  rationale: Die zweite Verwendung von רָעָה bezeichnet im Zusammenhang das angekündigte Strafgericht beziehungsweise die Katastrophe, nicht moralisches Böses.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  choice: von dem er gesagt hatte, er werde es ihnen antun
  rationale: Die Formulierung bleibt nahe an „gesagt“ und „tun“, ist aber in modernem Deutsch klar und idiomatisch.
- source_word: וְלֹא עָשָׂה
  choice: und er tat es nicht
  rationale: Die knappe Wiederaufnahme des angekündigten Unheils entspricht der Kürze des Hebräischen.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang ist eindeutig der handelnde Gott gemeint; „Gott“ ist die übliche deutsche Wiedergabe.
theological_decisions:
- issue: Anthropopathische Rede von Gottes Reaktion in וַיִּנָּחֶם
  choice: „da gereute Gott“
  alternative: „Gott änderte seinen Entschluss“, „Gott ließ davon ab“ oder „Gott bereute es“
  rationale: Die Übersetzung hält fest, dass Gott auf Ninives Umkehr hin das angekündigte Gericht nicht vollzieht. Sie löst die Spannung nicht durch eine rein handlungsbezogene Umschreibung auf, schreibt Gott aber auch weder Sünde noch Irrtum ausdrücklich zu.
- issue: Die beiden Bedeutungen von רָעָה im selben Vers
  choice: „böser Weg“ für moralisches Böses und „Unheil“ für das angedrohte Gericht
  alternative: Beide Vorkommen einheitlich mit „Böses“ wiederzugeben
  rationale: Dasselbe hebräische Wort hat hier kontextbedingt zwei unterschiedliche Bedeutungen. Die deutsche Differenzierung verhindert, dass Gottes angekündigtes Gericht als moralisch böse bezeichnet wird; eine Fußnote dokumentiert das Wortspiel.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit schlichter Erzählstruktur. „Gereuen“ ist bewusst etwas feierlicher, bleibt jedoch verständlich und bewahrt die theologische Spannung des hebräischen Verbs.
