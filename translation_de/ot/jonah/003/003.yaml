source:
  edition: WLC
  text: וַ/יָּ֣קָם יוֹנָ֗ה וַ/יֵּ֛לֶךְ אֶל נִֽינְוֶ֖ה כִּ/דְבַ֣ר יְהוָ֑ה וְ/נִֽינְוֵ֗ה הָיְתָ֤ה עִיר גְּדוֹלָה֙ לֵֽ/אלֹהִ֔ים מַהֲלַ֖ךְ שְׁלֹ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/003.yaml
  text: So Jonah arose and went to Nineveh[a], according to the word of Yahweh. Now Nineveh was an exceedingly great city before God[b], a journey of three days.
translation:
  language: de
  text: Da machte sich Jona auf und ging nach Ninive, gemäß dem Wort Jahwes. Ninive aber war eine außerordentlich große Stadt vor Gott[a], eine Reise von drei Tagen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine außerordentlich große Stadt“. Wörtlich steht im Hebräischen „eine große Stadt für/vor Gott“; die Wendung kann außergewöhnliche Größe ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „eine Reise von drei Tagen“. Die Wendung kann die Zeit bezeichnen, die man zum Durchqueren der Stadt oder für einen vollständigen Weg durch sie benötigte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: קום leitet Jonas gehorsame Reaktion ein. „Machte sich auf“ ist im modernen Deutschen natürlich und bewahrt den erzählerischen Anklang an 1,3 und 3,2–3.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: הלך ist das gewöhnliche Verb für „gehen“. Die schlichte Wiedergabe erhält die klare Abfolge der Handlungen.
- source_word: כִּדְבַר יְהוָה
  choice: gemäß dem Wort Jahwes
  rationale: Die Formulierung gibt כִּדְבַר möglichst direkt wieder und bezeichnet Jonas Handeln als Übereinstimmung mit dem göttlichen Auftrag.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen deutschen Sprachraum üblichen Transkription des Tetragramms.
- source_word: עִיר גְּדוֹלָה לֵאלֹהִים
  choice: eine außerordentlich große Stadt vor Gott
  rationale: „Außerordentlich groß“ bringt die mögliche steigernde Funktion von לֵאלֹהִים zum Ausdruck; „vor Gott“ bewahrt zugleich den ausdrücklichen Gottesbezug und damit die Spannung der hebräischen Wendung.
- source_word: מַהֲלַךְ שְׁלֹשֶׁת יָמִים
  choice: eine Wegstrecke von drei Tagen
  rationale: מהלך kann einen Weg, eine Reisedauer oder eine zurückzulegende Strecke bezeichnen. Die Wiedergabe lässt offen, ob damit die Durchquerung, der Umfang oder ein vollständiger Besuch der Stadt gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לֵאלֹהִים in עִיר גְּדוֹלָה לֵאלֹהִים
  choice: eine außerordentlich große Stadt vor Gott
  alternative: eine außerordentlich große Stadt; eine große Stadt für Gott
  rationale: Die Hauptfassung bewahrt sowohl den möglichen Superlativsinn als auch den ausdrücklichen Gottesbezug. Die Fußnote macht transparent, dass die hebräische Konstruktion mehrdeutig ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Machte sich auf“ folgt natürlichem deutschem Erzählstil; „gemäß dem Wort Jahwes“ bewahrt die formale biblische Ausdrucksweise. Die schwer deutbare Größenangabe wird im Haupttext nicht auf eine bestimmte geografische Berechnung verengt.
