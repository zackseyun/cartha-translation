base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/001.yaml
  text: Then the word of Yahweh came to Jonah a second time[a], saying,
translation:
  language: de
  text: 'Da kam das Wort Jahwes zum zweiten Mal[a] zu Jona:

    '
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wieder“. Das Hebräische kennzeichnet ausdrücklich die Wiederholung nach Jonas früherem Auftrag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Erzählform führt die Handlung weiter. Zusammen mit דְבַר יְהוָה ergibt „Da kam“ eine natürliche und zugleich formnahe deutsche Wiedergabe.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die feste prophetische Formel und ihren kanonischen Klang; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֶל יוֹנָה
  choice: zu Jona
  rationale: אֶל bezeichnet hier den Empfänger des göttlichen Wortes; „zu Jona“ entspricht der üblichen deutschen Ausdrucksweise dieser Formel.
- source_word: שֵׁנִית
  choice: zum zweiten Mal
  rationale: Die Wendung bezeichnet ausdrücklich die Wiederholung und hebt Jonas erneute Beauftragung hervor.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den folgenden Redeinhalt ein. Im heutigen Deutsch führt ein Doppelpunkt die direkte Rede natürlicher ein als das formale „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel „das Wort Jahwes kam zu …“ bleibt erkennbar; der Doppelpunkt gibt לֵאמֹר idiomatisch wieder und leitet Vers 2 ein.
