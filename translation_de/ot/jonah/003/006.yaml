  text: וַ/יִּגַּ֤ע הַ/דָּבָר֙ אֶל מֶ֣לֶך נִֽינְוֵ֔ה וַ/יָּ֨קָם֙ מִ/כִּסְא֔/וֹ וַ/יַּעֲבֵ֥ר אַדַּרְתּ֖/וֹ מֵֽ/עָלָ֑י/ו וַ/יְכַ֣ס שַׂ֔ק וַ/יֵּ֖שֶׁב עַל הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/006.yaml
  text: When the message reached the king of Nineveh[a], he rose from his throne, removed his robe, covered himself with sackcloth[c][b], and sat in the ashes.
translation:
  language: de
  text: Als die Botschaft den König von Ninive erreichte[a], stand er von seinem Thron auf, legte sein Obergewand ab[b], hüllte sich in Sacktuch und setzte sich in die Asche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als die Nachricht den König von Ninive erreichte«; auch: »die Sache« oder »das Wort« statt »die Botschaft«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »legte seinen Mantel ab«. Das hebräische Wort bezeichnet ein prächtiges oder vornehmes äußeres Kleidungsstück.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »setzte sich auf die Asche«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע הַדָּבָר
  choice: Als die Botschaft … erreichte
  rationale: נגע mit אֶל bezeichnet hier idiomatisch das Gelangen einer Nachricht zum Empfänger; דָּבָר kann »Wort«, »Sache«, »Bericht« oder »Botschaft« bedeuten. »Botschaft« passt im Zusammenhang zu Jonas Verkündigung und klingt im Deutschen natürlich.
- source_word: מֶלֶךְ נִינְוֵה
  choice: den König von Ninive
  rationale: Die hebräische Status-constructus-Verbindung wird klar und konventionell wiedergegeben.
- source_word: וַיָּקָם מִכִּסְאוֹ
  choice: stand er von seinem Thron auf
  rationale: כִּסֵּא kann Sitz oder Thron bedeuten; beim König ist »Thron« sachlich und kontextuell angemessen.
- source_word: וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו
  choice: legte sein Obergewand ab
  rationale: Der Hifil von עבר bedeutet hier entfernen oder ablegen. אַדֶּרֶת bezeichnet ein markantes, teils vornehmes äußeres Kleidungsstück; »Obergewand« bewahrt diesen Sinn ohne altertümlich zu wirken.
- source_word: וַיְכַס שַׂק
  choice: hüllte sich in Sacktuch
  rationale: כסה bedeutet bedecken oder einhüllen; das reflexive »hüllte sich« gibt die im Kontext vorausgesetzte Selbstbekleidung idiomatisch wieder. שַׂק ist das grobe Trauergewand Sacktuch.
- source_word: וַיֵּשֶׁב עַל הָאֵפֶר
  choice: setzte sich in die Asche
  rationale: Das Hebräische hat wörtlich »saß/setzte sich auf die Asche«. Im Deutschen ist »sich in die Asche setzen« eine natürliche Wiedergabe des Trauerbildes; die wörtliche Präposition bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Königliche Erniedrigung und Zeichen von Trauer beziehungsweise Umkehr
  choice: Die Handlungen werden ohne ausdrückliche theologische Deutung erzählt.
  alternative: Die Gesten im Haupttext ausdrücklich als Buße oder Umkehr bezeichnen.
  rationale: Die beschriebenen Gesten tragen im Kontext diese Bedeutung, doch der Vers selbst nennt lediglich die Handlungen. Die Übersetzung vermeidet daher eine über den Wortlaut hinausgehende dogmatische Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Abfolge der knappen hebräischen Handlungen bleibt erhalten; unnötig altertümliche Wörter werden vermieden.
