  variant: modern standard German
source:
  edition: WLC
  text: וְ/יִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽ/אָדָם֙ וְ/הַ/בְּהֵמָ֔ה וְ/יִקְרְא֥וּ אֶל אֱלֹהִ֖ים בְּ/חָזְקָ֑ה וְ/יָשֻׁ֗בוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וּ/מִן הֶ/חָמָ֖ס אֲשֶׁ֥ר בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/008.yaml
  text: Let both man and beast be covered with sackcloth[a], and let them call out mightily to God[c][b], and let each man turn from his evil way and from the violence that is in their hands.
translation:
  language: de
  text: Mensch und Vieh sollen sich in Sacktuch hüllen[a] und mit aller Kraft zu Gott rufen[b]. Jeder[c] soll von seinem bösen Weg umkehren und von der Gewalt, die in ihren Händen ist[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „sollen mit Sacktuch bekleidet werden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Stärke“; gemeint sein kann auch: „mit Nachdruck“ oder „inständig“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „jeder Mann“; die Form ist distributiv und meint jede einzelne Person.'
    reason: lexical_alternative
  - marker: d
    text: Der hebräische Text wechselt hier vom Singular „jeder … sein“ zum Plural „ihren Händen“ und nimmt damit die Menschen als Gesamtheit wieder auf.
    reason: textual_clarification
lexical_decisions:
- source_word: וְיִתְכַּסּוּ שַׂקִּים
  choice: sollen sich in Sacktuch hüllen
  rationale: Die Hitpael-Form kann reflexiv oder medial verstanden werden. „Sich in Sacktuch hüllen“ ist im Deutschen natürlich, bewahrt das Bild und gibt den auffordernden Charakter wieder.
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: Mensch und Vieh
  rationale: Die beiden Singularformen bezeichnen hier Klassen. „Vieh“ passt zu den im Kontext genannten Haustieren und erhält den markanten Gegensatz zwischen Mensch und Tierbestand.
- source_word: וְיִקְרְאוּ אֶל אֱלֹהִים בְּחָזְקָה
  choice: und mit aller Kraft zu Gott rufen
  rationale: קרא אל bezeichnet hier eindringliches Anrufen; בְּחָזְקָה drückt Stärke oder Intensität aus. „Mit aller Kraft“ bleibt bildnah und ist zugleich idiomatisches modernes Deutsch.
- source_word: וְיָשֻׁבוּ
  choice: soll ... umkehren
  rationale: שׁוב bedeutet grundlegend „umkehren/zurückkehren“. „Umkehren“ vermittelt die sittliche Abkehr, ohne das konkretere hebräische Bewegungsbild durch den theologischen Fachbegriff „Buße tun“ zu ersetzen.
- source_word: אִישׁ
  choice: Jeder
  rationale: Der distributive Singular bedeutet, dass jede einzelne Person gemeint ist. „Jeder“ gibt die maskuline Form und ihre stellvertretende, allgemeine Funktion im Deutschen knapp und natürlich wieder.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: von seinem bösen Weg
  rationale: „Weg“ bewahrt die geläufige hebräische Metapher für Lebensführung; „böse“ ist die direkte Wiedergabe von רָעָה.
- source_word: וּמִן הֶחָמָס
  choice: und von der Gewalt
  rationale: חָמָס bezeichnet Gewalt beziehungsweise gewaltsames Unrecht. „Gewalt“ ist hier die direkte und kontextgerechte Wiedergabe.
- source_word: אֲשֶׁר בְּכַפֵּיהֶם
  choice: die in ihren Händen ist
  rationale: Die Form „ihren Händen“ ist im Hebräischen pluralisch und nimmt die Gesamtheit der Menschen wieder auf, obwohl unmittelbar zuvor der distributive Singular steht. Das hebräische Bild wird unverändert erhalten.
theological_decisions:
- issue: Umkehrsprache in שׁוב
  choice: „umkehren“
  alternative: „Buße tun“ oder „sich bekehren“
  rationale: Der Zusammenhang fordert eine moralische Abkehr, doch das Verb selbst verwendet das weitere, konkrete Bild des Umkehrens. Die Übersetzung bewahrt dieses Bild und legt keinen engeren theologischen Fachbegriff in den Text.
- issue: Sind Mensch und Vieh Subjekt des Rufens zu Gott?
  choice: Das Pronomen „sie“ bleibt auf „Mensch und Vieh“ bezogen.
  alternative: Nur die Menschen als Subjekt des Rufens verstehen.
  rationale: Die hebräische Satzfolge nennt kein neues ausdrückliches Subjekt. Obwohl das Rufen der Tiere ungewöhnlich wirkt, sollte diese grammatische und erzählerische Spannung nicht stillschweigend beseitigt werden.
- issue: Numeruswechsel zwischen אִישׁ und כַפֵּיהֶם
  choice: „Jeder ... ihren Händen“
  alternative: „Jeder ... seinen Händen“
  rationale: Der hebräische Text wechselt vom distributiven Singular „jeder“ zum pluralischen Suffix „ihren“. Die Übersetzung erhält diesen auffälligen Wechsel, statt ihn harmonisierend zu singularisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Verkündigungssprache wird in zwei gut verständliche Sätze gegliedert. „Sacktuch“, „umkehren“ und „in ihren Händen“ erhalten die zentralen Bilder des Hebräischen; ungewohnte grammatische Spannungen werden nicht geglättet.
