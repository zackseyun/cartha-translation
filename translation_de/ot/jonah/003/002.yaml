review_pass:
  verdict: approve
  source_fidelity: Der Text bildet die Imperative קוּם und לֵךְ angemessen ab und gibt Ninive als Apposition zur „großen Stadt“ wieder. „Verkünde ihr“ wahrt die in diesem Vers verwendete Präposition אֶל („zu/ihr“) und trägt nicht das „gegen“ aus Jona 1,2 ein. „Die Botschaft, die ich dir sage“ gibt den Inhalt der קְרִיאָה und das partizipiale דֹבֵר idiomatisch und ohne unzulässige zeitliche Festlegung wieder.
  naturalness: „Mach dich auf, geh nach Ninive, der großen Stadt“ ist würdiges, gut verständliches modernes Standarddeutsch. Der Satzfluss ist klar; „verkünde ihr“ ist für einen öffentlichen göttlichen Auftrag angemessen.
  terminology: Ninive entspricht der deutschen Namenskonvention. „Große Stadt“ bewahrt die Bedeutungsweite von גדול. „Botschaft“ ist eine natürliche Wiedergabe von קְרִיאָה; die Fußnote erläutert die im Deutschen nicht vollständig nachbildbare Wortverwandtschaft mit קרא. Der Fußnotenanker steht sinnvoll bei „ihr“, wo die relevante Präposition im Haupttext umgesetzt ist.
