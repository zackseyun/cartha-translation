id: JON.3.2
reference: Jonah 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ק֛וּם לֵ֥ךְ אֶל נִֽינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה וִּ/קְרָ֤א אֵלֶ֨י/הָ֙ אֶת הַ/קְּרִיאָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/002.yaml
  text: Arise[a], go to Nineveh, the great city, and proclaim to it the proclamation that I speak to you.
translation:
  language: de
  text: Mach dich auf, geh nach Ninive, der großen Stadt, und verkünde ihr[a] die Botschaft, die ich dir sage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „rufe ihr den Ausruf zu“. Anders als in Jona 1,2 steht hier im Hebräischen „zu ihr“, nicht „gegen sie“.'
    reason: Die Fußnote macht sowohl die Wortverwandtschaft von קרא und קְרִיאָה als auch den bedeutsamen Wechsel der Präposition sichtbar.
lexical_decisions:
- source_word: ק֛וּם
  choice: Mach dich auf
  rationale: Der Imperativ von קום leitet den dringlichen göttlichen Auftrag ein. „Mach dich auf“ gibt die Aufforderung in würdigem, noch gut verständlichem Deutsch wieder.
- source_word: לֵ֥ךְ
  choice: geh
  rationale: הלך bezeichnet hier als Imperativ die gerichtete Bewegung; „geh“ ist die natürliche deutsche Entsprechung.
- source_word: נִֽינְוֵ֖ה
  choice: Ninive
  rationale: Der Ortsname folgt der etablierten deutschen Schreibweise.
- source_word: הָעִ֣יר הַגְּדוֹלָ֑ה
  choice: der großen Stadt
  rationale: גדול kann sowohl räumliche Größe als auch Bedeutung ausdrücken. „groß“ bewahrt diese Offenheit und die Wiederholung innerhalb des Jonabuchs.
- source_word: וּקְרָ֤א אֵלֶ֨יהָ֙
  choice: und verkünde ihr
  rationale: קרא bezeichnet hier das öffentliche Ausrufen oder Verkünden. Der Dativ „ihr“ bildet אֶל („zu“) ab, ohne das „gegen“ aus Jona 1,2 in diesen Vers einzutragen.
- source_word: אֶת הַקְּרִיאָ֔ה
  choice: die Botschaft
  rationale: Das von קרא abgeleitete Substantiv bezeichnet hier den auszurufenden Inhalt. „Botschaft“ ist im Deutschen natürlicher als das formale, aber schwerfällige „Verkündigung“ und vermeidet die missverständliche Wiedergabe „Ruf“.
- source_word: אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽיךָ
  choice: die ich dir sage
  rationale: דבר אֶל bedeutet „zu jemandem sprechen“. Die präsentische Form „ich dir sage“ wahrt den imperfektiven Charakter des Partizips und vermeidet, ohne textlichen Zwang ein Futur einzusetzen.
theological_decisions:
- issue: Verhältnis der Botschaft zu Ninive
  choice: verkünde ihr
  alternative: rufe gegen sie aus
  rationale: In diesem Vers steht אֶל („zu“), anders als עַל („gegen“) in Jona 1,2. Die Wiedergabe bewahrt diesen Unterschied und lässt offen, welchen genauen Charakter die anschließend verkündete Botschaft hat.
- issue: Zeitbezug von Gottes Mitteilung an Jona
  choice: die ich dir sage
  alternative: die ich dir sagen werde
  rationale: Das hebräische Partizip kann im Kontext auf die nun erfolgende beziehungsweise bevorstehende Mitteilung weisen. Das Präsens folgt der Form eng und legt den Zeitbezug nicht unnötig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mach dich auf“ trägt den feierlich-dringlichen Ton des Auftrags; der übrige Satz bleibt klar und alltagssprachlich verständlich. Die leicht markierte Formulierung „die ich dir sage“ bewahrt die Nähe zum hebräischen Sprechen, ohne ein zukünftiges „werde“ hinzuzufügen.
