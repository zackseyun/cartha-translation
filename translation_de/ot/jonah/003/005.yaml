  text: וַֽ/יַּאֲמִ֛ינוּ אַנְשֵׁ֥י נִֽינְוֵ֖ה בֵּֽ/אלֹהִ֑ים וַ/יִּקְרְאוּ צוֹם֙ וַ/יִּלְבְּשׁ֣וּ שַׂקִּ֔ים מִ/גְּדוֹלָ֖/ם וְ/עַד קְטַנָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/005.yaml
  text: And the people of Nineveh believed God[a], and they proclaimed a fast and put on sackcloth, from their greatest to their least.
translation:
  language: de
  text: Da glaubten die Menschen von Ninive Gott[a]. Sie riefen ein Fasten aus und zogen Sacktuch an, vom Größten bis zum Kleinsten unter ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vertrauten auf Gott“ beziehungsweise „glaubten an Gott“. Die hebräische Wendung kann sowohl ausdrücken, dass man Gott Glauben schenkt, als auch, dass man auf ihn vertraut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: glaubten
  rationale: Das Hifil von אמן bezeichnet hier mit der Präposition ב das Glauben an beziehungsweise Vertrauen auf eine Person. „Glaubten“ gibt die unmittelbare Reaktion auf Gottes Botschaft knapp und natürlich wieder, ohne sie ausdrücklich als Bekehrung oder rettenden Glauben zu deuten.
- source_word: אַנְשֵׁי נִינְוֵה
  choice: die Menschen von Ninive
  rationale: אַנְשֵׁי bedeutet formal „Männer/Leute von“, bezeichnet hier aber kollektiv die Einwohner Ninives. „Menschen von Ninive“ entspricht dem umfassenden Zusammenhang und vermeidet die missverständliche Beschränkung auf erwachsene Männer.
- source_word: בֵּאלֹהִים
  choice: Gott
  rationale: Bei אמן mit ב kann das Objekt im Deutschen direkt bei „glauben“ stehen. „Gott glauben“ betont, dass die Menschen seine durch Jona ausgerichtete Botschaft ernst nahmen; die ebenfalls mögliche Nuance des Vertrauens wird in der Fußnote bewahrt.
- source_word: וַיִּקְרְאוּ צוֹם
  choice: Sie riefen ein Fasten aus
  rationale: קרא mit צום bezeichnet die öffentliche Anordnung oder Bekanntgabe eines gemeinsamen Fastens. „Ein Fasten ausrufen“ ist im Deutschen klar und idiomatisch.
- source_word: וַיִּלְבְּשׁוּ שַׂקִּים
  choice: zogen Sacktuch an
  rationale: שַׂקִּים meint grobe Sackstoffgewänder als Zeichen der Trauer und Demütigung. Die traditionelle, verständliche Wendung „Sacktuch anziehen“ bildet die Handlung ab, ohne ihre Bedeutung erklärend in den Haupttext einzutragen.
- source_word: מִגְּדוֹלָם וְעַד קְטַנָּם
  choice: vom Größten bis zum Kleinsten unter ihnen
  rationale: Die meristische Formulierung umfasst alle gesellschaftlichen Ränge beziehungsweise alle Einwohner. „Unter ihnen“ gibt die hebräischen Pronominalsuffixe ausdrücklich wieder.
theological_decisions:
- issue: Art der Reaktion Ninives auf Gott
  choice: Die Reaktion wird als „Gott glauben“ wiedergegeben.
  alternative: „an Gott glauben“, „auf Gott vertrauen“ oder eine ausdrückliche Deutung als Umkehr beziehungsweise Bekehrung
  rationale: Der Vers nennt Glauben, Fasten und Sacktuch. Er legt damit Umkehr nahe, bezeichnet sie hier aber nicht ausdrücklich als Bekehrung oder rettenden Glauben. Die Übersetzung wahrt zudem die Bedeutungsbreite der hebräischen Konstruktion durch eine Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze bilden die zügige hebräische Erzählweise ab. „Sacktuch“ bewahrt das konkrete alte Trauerzeichen; die kollektive Formulierung „Menschen von Ninive“ ist im heutigen Deutsch natürlich und im Kontext umfassend.
