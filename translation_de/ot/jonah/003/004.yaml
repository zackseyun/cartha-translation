base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/004.yaml
  text: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
translation:
  language: de
  text: 'Jona begann, eine Tagesreise weit in die Stadt hineinzugehen. Er rief aus und sagte: »Noch vierzig Tage[a], und Ninive wird umgestürzt[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »In vierzig Tagen«. Der hebräische Ausdruck bezeichnet die noch verbleibende Zeit bis zum angekündigten Ereignis.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann »umgestürzt«, »überwältigt« oder »vernichtet« bedeuten, aber auch allgemeiner eine grundlegende Umkehrung oder Veränderung bezeichnen. So bleibt neben dem Gerichtssinn eine weitergehende Bedeutungsmöglichkeit offen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: begann
  rationale: Das Hifil von חלל bildet hier zusammen mit dem Infinitiv לָבוֹא eine idiomatische Wendung für den Beginn einer Handlung. »Begann« ist im Deutschen natürlich und genau.
- source_word: לָבוֹא בָעִיר
  choice: in die Stadt hineinzugehen
  rationale: בוא mit ב bezeichnet die Bewegung in einen Ort hinein. Die Formulierung bewahrt diesen Bewegungssinn und verbindet sich natürlich mit der Angabe der Tagesreise.
- source_word: מַהֲלַךְ יוֹם אֶחָד
  choice: eine Tagesreise weit
  rationale: Die Konstruktverbindung bezeichnet die Strecke, die man an einem Tag zurücklegt. »Eine Tagesreise weit« gibt im Satz sowohl das räumliche Ausmaß als auch die idiomatische Bedeutung wieder.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: Er rief aus und sagte
  rationale: Beide Verben der hebräischen Erzählfolge bleiben erhalten. »Rief aus« vermittelt die öffentliche und eindringliche Verkündigung, während »und sagte« die direkte Rede einleitet.
- source_word: עוֹד אַרְבָּעִים יוֹם
  choice: Noch vierzig Tage
  rationale: עוֹד kennzeichnet hier die verbleibende Zeit bis zum angekündigten Ereignis. »Noch vierzig Tage« ist eine knappe und natürliche deutsche Wiedergabe des Countdowns.
- source_word: נֶהְפָּכֶת
  choice: wird umgestürzt
  rationale: Das Nifal von הפך kann ein Umstürzen oder eine grundlegende Umkehr bezeichnen. »Wird umgestürzt« trägt den unmittelbaren Gerichtssinn, ohne die breitere Umkehrbedeutung des hebräischen Wortes völlig auszuschließen; diese wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutungsumfang von נֶהְפָּכֶת in Jonas Warnruf
  choice: wird umgestürzt
  alternative: wird umgekehrt / erfährt eine völlige Umkehr
  rationale: Im unmittelbaren Zusammenhang kündigt das Verb den Sturz Ninives als Gericht an. Zugleich kann הפך eine umfassendere Umkehr oder Verwandlung bezeichnen, was im Fortgang der Erzählung literarische Spannung erzeugt. Die Hauptübersetzung gibt den Warncharakter wieder, während die Fußnote die weiter reichende Mehrdeutigkeit bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Abfolge »rief aus und sagte« wurde bewusst nicht geglättet. Der Warnruf bleibt knapp und eindringlich; die echte Mehrdeutigkeit des Schlussverbs wird nicht einseitig auf Vernichtung festgelegt.
