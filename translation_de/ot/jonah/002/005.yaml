source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי נִגְרַ֖שְׁתִּי מִ/נֶּ֣גֶד עֵינֶ֑י/ךָ אַ֚ךְ אוֹסִ֣יף לְ/הַבִּ֔יט אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/005.yaml
  text: And I said[a], ‘I have been driven out from before your eyes; yet I will again look toward your holy temple.’
translation:
  language: de
  text: 'Und ich sagte: »Ich bin aus deinem Blick verstoßen worden[a]. Doch ich werde wieder auf deinen heiligen Tempel blicken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weg von vor deinen Augen“; auch möglich: „aus deinem Blick“ oder, deutender, „aus deiner Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: Und ich sagte
  rationale: Die einfache Fortführung mit betontem Pronomen bleibt erhalten. אָמַרְתִּי bedeutet gewöhnlich „ich sagte“, kann im poetischen Gebet aber auch inneres Sprechen bezeichnen.
- source_word: נִגְרַשְׁתִּי
  choice: ich bin … hinweg vertrieben
  rationale: Der Nifal von גרש bezeichnet ein Wegtreiben oder Verstoßen. Die Formulierung bewahrt den passiven und bildhaften Charakter, ohne eine rechtliche Verbannung einzutragen.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: von deinen Augen hinweg
  rationale: Die konkrete Rede von Gottes Augen wird bewahrt; „hinweg“ vermittelt die räumliche Entfernung, ohne das Bild vollständig als „Gegenwart“ auszudeuten.
- source_word: אַךְ
  choice: dennoch
  rationale: Die Partikel markiert hier den starken Umschwung von empfundener Verwerfung zu neuer Hoffnung.
- source_word: אוֹסִיף לְהַבִּיט
  choice: werde ich wieder … blicken
  rationale: יסף mit Infinitiv kann eine Wiederholung oder Fortsetzung ausdrücken. Im Zusammenhang passt „wieder“ gut, lässt aber die erneute Hinwendung im Vordergrund stehen.
- source_word: אֶל הֵיכַל קָדְשֶׁךָ
  choice: zu deinem heiligen Tempel
  rationale: הֵיכָל bezeichnet hier Gottes Tempel; der Genitiv „deiner Heiligkeit“ wird im Deutschen idiomatisch durch „dein heiliger Tempel“ wiedergegeben. אֶל bezeichnet die Blickrichtung.
theological_decisions:
- issue: Ob מִנֶּגֶד עֵינֶיךָ räumlich-bildhaft oder ausdrücklich als Ausschluss aus Gottes Gegenwart wiederzugeben ist
  choice: von deinen Augen hinweg
  alternative: aus deinem Blick / aus deiner Gegenwart
  rationale: Der Haupttext erhält das konkrete hebräische Bild der göttlichen Augen. Die Deutung als Ausschluss aus Gottes Gegenwart ist naheliegend, soll die Bildsprache jedoch nicht stillschweigend ersetzen.
- issue: Ob אוֹסִיף eine erneute oder eine fortgesetzte Hinwendung bezeichnet
  choice: werde ich wieder … blicken
  alternative: werde ich weiterhin … blicken
  rationale: Beides ist sprachlich möglich. Der Übergang von der Klage zur Hoffnung spricht hier eher für eine erneute Hinwendung, ohne dass die alternative Nuance ausgeschlossen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Bildsprache. „Von deinen Augen hinweg“ ist bewusst etwas gehobener, bleibt aber verständlich und näher am hebräischen Bild als eine rein deutende Wiedergabe.
