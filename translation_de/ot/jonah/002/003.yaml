source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר קָ֠רָאתִי מִ/צָּ֥רָה לִ֛/י אֶל יְהוָ֖ה וַֽ/יַּעֲנֵ֑/נִי מִ/בֶּ֧טֶן שְׁא֛וֹל שִׁוַּ֖עְתִּי שָׁמַ֥עְתָּ קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/003.yaml
  text: And he said[a], “I called to Yahweh out of my distress, and he answered me. From the belly of Sheol I cried out[b]; you heard my voice.”
translation:
  language: de
  text: 'Und er sagte: „Aus meiner Bedrängnis rief ich zu Jahwe, und er antwortete mir. Aus dem Bauch[a] des Scheol[b] schrie ich um Hilfe; du hörtest meine Stimme.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mutterleib“. Das hebräische Wort kann „Bauch“ oder „Mutterleib“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Scheol ist die hebräische Bezeichnung für den Bereich der Toten; stärker deutend könnte man „Totenreich“ oder „Grab“ übersetzen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die narrative Wayyiqtol-Form wird schlicht wiedergegeben, ohne eine stärkere zeitliche Folgerung hineinzulesen.
- source_word: קָרָאתִי מִצָּרָה לִי
  choice: Aus meiner Bedrängnis rief ich
  rationale: קרא bezeichnet hier das an Gott gerichtete Rufen; צָרָה wird idiomatisch und zugleich poetisch mit „Bedrängnis“ wiedergegeben.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Die Richtung des Rufens wird durch „zu“ ausgedrückt; der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: וַיַּעֲנֵנִי
  choice: und er antwortete mir
  rationale: Die Antwort auf das Gebet und das ausdrückliche Objektsuffix der ersten Person werden vollständig bewahrt.
- source_word: מִבֶּטֶן שְׁאוֹל
  choice: Aus dem Bauch des Scheol
  rationale: בֶּטֶן bezeichnet Bauch oder Mutterleib; „Bauch“ bewahrt das körperhafte poetische Bild und klingt im Zusammenhang mit Jona besonders eindringlich. שְׁאוֹל wird transliteriert, um den Begriff nicht vorschnell auf Grab oder Hölle festzulegen.
- source_word: שִׁוַּעְתִּי
  choice: schrie ich um Hilfe
  rationale: Das Verb bezeichnet spezifisch einen Hilferuf; „um Hilfe schreien“ gibt diesen Bedeutungsgehalt präziser wieder als das allgemeinere „aufschreien“.
- source_word: שָׁמַעְתָּ קוֹלִי
  choice: du hörtest meine Stimme
  rationale: Die konkrete Wendung und der unvermittelte Wechsel von der dritten zur zweiten Person bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab; Hölle
  rationale: „Scheol“ bewahrt die alttestamentliche Bedeutungsbreite und vermeidet eine vorschnelle Gleichsetzung mit dem einzelnen Grab oder späteren Vorstellungen von Hölle.
- issue: Wechsel von Gottesrede in der dritten zur zweiten Person
  choice: „er antwortete mir … du hörtest meine Stimme“
  alternative: durchgehend dritte oder zweite Person
  rationale: Der auffällige poetische Personenwechsel steht ausdrücklich im Hebräischen und wird nicht harmonisiert.
translation_notes:
  register: Moderne, würdige Gebetssprache mit knapper poetischer Satzführung. Das Präteritum passt zur erzählenden und poetischen Rückschau. Die Semikolon-Struktur markiert die enge Parallelität der beiden Aussagen, ohne den Personenwechsel zu glätten.
