source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה לַ/דָּ֑ג וַ/יָּקֵ֥א אֶת יוֹנָ֖ה אֶל הַ/יַּבָּשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/011.yaml
  text: Then Yahweh spoke to the fish[a], and it vomited Jonah onto the dry land.
translation:
  language: de
  text: Da sprach Jahwe zu dem Fisch[a], und er erbrach Jona auf das trockene Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sagte zu dem Fisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: אמר bedeutet wörtlich „sagen“. Mit dem Dativ „zu dem Fisch“ ist „sprach“ im Deutschen natürlich und bewahrt die Aussage, ohne sie zum ausdrücklichen Befehl zu verstärken; „Da“ führt die Erzählung zeitlich weiter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: לַדָּג
  choice: zu dem Fisch
  rationale: דג bezeichnet hier schlicht einen „Fisch“; das in diesem Vers nicht vorhandene Adjektiv „groß“ wird nicht aus dem früheren Kontext ergänzt.
- source_word: וַיָּקֵא
  choice: und er erbrach
  rationale: קיא bezeichnet das Erbrechen. „Erbrach“ gibt den körperlich deutlichen Ausdruck direkt und in würdigem Standarddeutsch wieder; das Subjekt ist der Fisch.
- source_word: אֶת יוֹנָה
  choice: Jona
  rationale: את kennzeichnet Jona als bestimmtes direktes Objekt und wird entsprechend der deutschen Syntax nicht eigens wiedergegeben.
- source_word: אֶל הַיַּבָּשָׁה
  choice: auf das trockene Land
  rationale: יַבָּשָׁה bezeichnet trockenes Land im Gegensatz zum Meer. „Auf“ gibt zusammen mit dem Akkusativ die gerichtete Bewegung im Kontext natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen in der heute üblichen wissenschaftlich begründeten deutschen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Rede Jahwes zum Fisch
  choice: sprach zu
  alternative: befahl
  rationale: Der Kontext lässt göttliche Autorität und eine wirksame Anweisung erkennen, doch das hebräische אמר bedeutet formal „sagen/sprechen“. Die Übersetzung macht daraus daher nicht ausdrücklich „befehlen“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbrach“ bewahrt die kräftige Bildlichkeit des hebräischen Verbs, ohne umgangssprachlich zu wirken. Der kurze Satzbau folgt dem zügigen Abschluss der Erzählung.
