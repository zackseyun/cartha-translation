id: JON.2.1
reference: Jonah 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְמַ֤ן יְהוָה֙ דָּ֣ג גָּד֔וֹל לִ/בְלֹ֖עַ אֶת יוֹנָ֑ה וַ/יְהִ֤י יוֹנָה֙ בִּ/מְעֵ֣י הַ/דָּ֔ג שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/001.yaml
  text: And Yahweh appointed a great fish to swallow Jonah[d][c][b][a], and Jonah was in the belly of the fish three days and three nights.
translation:
  language: de
  text: Und Jahwe bestimmte einen großen Fisch dazu, Jona zu verschlingen.[a][b] Und Jona war drei Tage und drei Nächte im Bauch des Fisches.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ließ einen großen Fisch bereitstehen« bzw. »stellte einen großen Fisch bereit«.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht allgemein »großer Fisch«, nicht ausdrücklich »Wal«.
    reason: alternative_reading
  - marker: c
    text: Die Wendung »drei Tage und drei Nächte« wird entsprechend dem hebräischen Wortlaut wiedergegeben, ohne die Frage einer inklusiven Zeitrechnung zu entscheiden.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְמַן
  choice: bestimmte … dazu
  rationale: Das Verb bezeichnet hier Jahwes gezieltes Anordnen bzw. Beauftragen. Die Formulierung ist im modernen Deutschen natürlich und bewahrt die Vorstellung bewussten göttlichen Handelns.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דָּג גָּדוֹל
  choice: einen großen Fisch
  rationale: דָּג ist die allgemeine Bezeichnung für einen Fisch; der Text legt keine bestimmte Tierart wie etwa einen Wal fest.
- source_word: לִבְלֹעַ
  choice: zu verschlingen
  rationale: בלע bedeutet schlucken bzw. verschlingen. In Verbindung mit einem großen Fisch gibt „verschlingen“ den Vorgang würdig und idiomatisch wieder, ohne zu behaupten, Jona sei getötet worden.
- source_word: בִּמְעֵי הַדָּג
  choice: im Bauch des Fisches
  rationale: מֵעֶה bezeichnet die inneren Teile bzw. Eingeweide. „Im Bauch“ ist die natürliche deutsche Entsprechung und vermeidet unnötig klinische oder drastische Sprache.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: drei Tage und drei Nächte
  rationale: Die hebräische Zeitangabe wird unmittelbar wiedergegeben, ohne sie durch eine Auslegung zur inklusiven Zählweise zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Art des Meerestieres
  choice: großer Fisch
  alternative: Wal
  rationale: Der Ausgangstext nennt allgemein einen Fisch und bestimmt dessen zoologische Art nicht näher.
- issue: Zeitangabe „drei Tage und drei Nächte“
  choice: wörtliche Beibehaltung der Zeitangabe
  alternative: für Teile von drei Tagen
  rationale: Die Übersetzung bewahrt die Formulierung und ihre mögliche Spannung, ohne Fragen der inklusiven Zeitrechnung im Haupttext zu entscheiden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge des Hebräischen bleibt erkennbar; zugleich wird die Ortsangabe im zweiten Satz an die im Deutschen natürlichere Position gestellt. Sämtliche Fußnotenmarker stehen unmittelbar an der jeweils einschlägigen Aussage.
