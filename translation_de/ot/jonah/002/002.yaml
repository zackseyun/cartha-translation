base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/002.yaml
  text: Then Jonah prayed to Yahweh his God from the belly of the fish[a].
translation:
  language: de
  text: Da betete Jona aus dem Bauch des Fisches zu Jahwe, seinem Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus dem Inneren des Fisches“; „Bauch“ ist hier eine dem Zusammenhang entsprechende natürliche Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: Da betete
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder; das Hitpael von פלל bedeutet hier „beten“.
- source_word: יוֹנָה
  choice: Jona
  rationale: Der Personenname wird entsprechend der etablierten deutschen Form wiedergegeben.
- source_word: אֶל
  choice: zu
  rationale: Bei „beten“ ist „zu“ die natürliche deutsche Entsprechung der gerichteten Präposition.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֱלֹהָיו
  choice: seinem Gott
  rationale: Das Substantiv mit Suffix der 3. Person Singular maskulin bezeichnet eindeutig „seinen Gott“.
- source_word: מִמְּעֵי
  choice: aus dem Bauch
  rationale: מֵעֶה kann die inneren Teile, den Bauch oder den Mutterleib bezeichnen. Im Zusammenhang mit dem Fisch ist „Bauch“ die klare und natürliche Wiedergabe; „aus“ bewahrt die Präposition מִן.
- source_word: הַדָּגָה
  choice: des Fisches
  rationale: Der hebräische Text sagt hier lediglich „der Fisch“. Die grammatisch feminine Form erfordert im Deutschen keine Kennzeichnung; „groß“ wird aus dem vorherigen Kontext nicht ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ erhält den persönlichen Gottesnamen und vermeidet seine Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise des Hebräischen bleibt erhalten; die Wortstellung wurde für natürliches Deutsch angepasst.
