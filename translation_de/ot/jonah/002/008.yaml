source:
  edition: WLC
  text: בְּ/הִתְעַטֵּ֤ף עָלַ/י֙ נַפְשִׁ֔/י אֶת יְהוָ֖ה זָכָ֑רְתִּי וַ/תָּב֤וֹא אֵלֶ֨י/ךָ֙ תְּפִלָּתִ֔/י אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/008.yaml
  text: When my life was fainting away within me[a], I remembered Yahweh, and my prayer came to you[b], into your holy temple.
translation:
  language: de
  text: Als mein Leben in mir dahinschwand[a], erinnerte ich mich an Jahwe, und mein Gebet kam zu dir – hinein in deinen heiligen Tempel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als meine Seele in mir schwach wurde.“ Das hebräische Wort nefesch kann je nach Zusammenhang „Leben“, „Seele“ oder die eigene Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dein heiliger Palast“ beziehungsweise „dein heiliges Heiligtum“. Das hebräische Wort kann einen königlichen Palast oder einen Tempel bezeichnen; hier legt der Gebetskontext „Tempel“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף
  choice: Als … dahinschwand
  rationale: Der Infinitiv im Hitpael mit בְּ leitet einen temporalen Nebensatz ein. In einer Lage äußerster Not bezeichnet עטף ein Schwachwerden oder Hinschwinden; „dahinschwand“ gibt den fortschreitenden Verlust der Lebenskraft wieder.
- source_word: עָלַי נַפְשִׁי
  choice: mein Leben in mir
  rationale: נפשׁ bezeichnet hier im Zusammenhang mit Todesnot am ehesten das Leben beziehungsweise die lebendige Person. עָלַי gehört zu einer hebräischen Wendung für das innere Zusammenbrechen; idiomatisches Deutsch verlangt hier „in mir“ statt des wörtlichen „über mir“.
- source_word: אֶת־יְהוָה
  choice: an Jahwe
  rationale: אֵת kennzeichnet das direkte Objekt von „erinnern“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: זָכָרְתִּי
  choice: erinnerte ich mich
  rationale: Das Qal-Perfekt bedeutet schlicht „ich erinnerte mich“. Die deutsche reflexive Konstruktion mit „an“ gibt dies natürlich wieder, ohne bereits das folgende Gebet hineinzudeuten.
- source_word: וַתָּבוֹא אֵלֶיךָ
  choice: und mein Gebet kam zu dir
  rationale: בוא bedeutet grundsätzlich „kommen“. Die direkte Formulierung bewahrt das Bild, dass das Gebet Gott erreicht, ohne „erhört werden“ interpretierend vorwegzunehmen.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: תפלה ist die übliche Bezeichnung für ein Gebet; die direkte deutsche Entsprechung passt zum Kontext.
- source_word: אֶל־הֵיכַל קָדְשֶׁךָ
  choice: hinein in deinen heiligen Tempel
  rationale: אֶל bezeichnet die Richtung auf ein Ziel hin. „hinein in“ bewahrt das räumliche Bild des Gebets, das in Gottes Heiligtum gelangt. היכל kann Palast oder Tempel bedeuten; im Gebetskontext ist „Tempel“ die naheliegende Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: mein Leben
  alternative: meine Seele; mein Selbst
  rationale: Im Kontext von Jonas Todesnot bezeichnet נֶפֶשׁ das bedrohte Leben beziehungsweise die ganze lebendige Person. „Mein Leben“ passt zum konkreten Zusammenhang und vermeidet eine unnötige Festlegung auf eine bestimmte Lehre über die Seele.
- issue: Ort des heiligen Tempels
  choice: nicht näher festgelegt
  alternative: der irdische Tempel in Jerusalem; Gottes himmlisches Heiligtum
  rationale: Der Vers sagt nicht ausdrücklich, ob der irdische Tempel oder Gottes himmlische Wohnung gemeint ist. Die Übersetzung „dein heiliger Tempel“ bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dahinschwand“ ist leicht gehoben, bleibt aber allgemein verständlich und passt zur poetischen Gebetssprache. Der Gedankenstrich macht die Zielbewegung „hinein in deinen heiligen Tempel“ klar, ohne die hebräische Satzstruktur unnötig zu glätten.
