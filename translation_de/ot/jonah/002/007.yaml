source:
  edition: WLC
  text: לְ/קִצְבֵ֤י הָרִים֙ יָרַ֔דְתִּי הָ/אָ֛רֶץ בְּרִחֶ֥י/הָ בַעֲדִ֖/י לְ/עוֹלָ֑ם וַ/תַּ֧עַל מִ/שַּׁ֛חַת חַיַּ֖/י יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/007.yaml
  text: I went down to the roots of the mountains[a]; the earth with its bars was around me forever, but you brought up my life from the pit[c][b], O Yahweh my God.
translation:
  language: de
  text: Zu den Gründen der Berge stieg ich hinab[a]; die Erde schloss mich mit ihren Riegeln für immer ein[b]. Doch du hast mein Leben aus der Grube heraufgeführt[c], Jahwe, mein Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bis an die äußersten Enden“ beziehungsweise „bis an die Fundamente der Berge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Die Erde – ihre Riegel waren hinter mir für immer.“ Das hebräische Bild stellt die Erde als Gefängnis dar, dessen Riegel sich hinter dem Beter schließen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aus dem Grab“ beziehungsweise „aus dem Verderben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִצְבֵי הָרִים
  choice: zu den Gründen der Berge
  rationale: קֶצֶב bezeichnet Ende, äußersten Rand oder Begrenzung. Im Zusammenhang des Abstiegs sind die untersten Bereiche beziehungsweise Fundamente der Berge gemeint. „Gründe der Berge“ bewahrt das poetische Tiefenbild, ohne die im Hebräischen nicht ausdrücklich genannten „Wurzeln“ in den Haupttext einzutragen.
- source_word: יָרַדְתִּי
  choice: stieg ich hinab
  rationale: Das Qal Perfekt 1. Person Singular von ירד bezeichnet die vollzogene Abwärtsbewegung. „stieg … hinab“ ist im Deutschen natürlich und poetisch angemessen.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Berge, Riegel und Grube ergeben hier ein kosmisches Todes- und Gefangenschaftsbild, für das „Erde“ besser passt.
- source_word: בְּרִחֶיהָ בַעֲדִי
  choice: schloss mich mit ihren Riegeln ein
  rationale: בְּרִיחַ bezeichnet einen Riegel oder Verschlussbalken; בַּעַד kann räumliche Abschließung ausdrücken. Die Formulierung gibt das Gefangenschaftsbild verständlich wieder, während die syntaktische Alternative in einer Fußnote erhalten bleibt.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet eine unabsehbare oder dauerhafte Zeit. Hier drückt es die vom Beter empfundene Endgültigkeit des Todes aus.
- source_word: וַתַּעַל
  choice: du hast … heraufgeführt
  rationale: Der Hifil von עלה bedeutet „hinaufbringen/heraufführen“. Das Verb hält die Gegenbewegung zu Jonahs Abstieg deutlich fest.
- source_word: מִשַּׁחַת
  choice: aus der Grube
  rationale: שַׁחַת kann Grube, Grab oder Verderben bezeichnen. „Grube“ bewahrt das konkrete räumliche Bild und lässt zugleich die Todesbedeutung anklingen.
- source_word: חַיַּי
  choice: mein Leben
  rationale: Die wörtliche Wiedergabe bewahrt die hebräische Ausdrucksweise und betont, dass Gott Jonah dem Tod entreißt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die Possessivform wird unmittelbar wiedergegeben und bewahrt die persönliche Anrede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext gebraucht den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von לְעוֹלָם im Todesgebet
  choice: für immer
  alternative: auf unabsehbare Zeit
  rationale: Die Formulierung bewahrt die empfundene Endgültigkeit der Todesnähe, ohne daraus eine systematische Aussage über eine endlose Dauer des Totenreichs abzuleiten.
- issue: Bedeutung von שַׁחַת
  choice: Grube
  alternative: Grab oder Verderben
  rationale: Die konkrete Tiefenmetaphorik wird erhalten; die mögliche Todes- oder Verderbensbedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Rhythmus. Der Parallelismus von Abstieg und Heraufführung sowie das Gefangenschaftsbild der Erdriegel bleiben erhalten. Die mehrdeutigen Begriffe קֶצֶב, בַּעַד und שַׁחַת werden im Haupttext verständlich wiedergegeben und in den Fußnoten offengehalten.
