  terminology: „Jahwe“ gibt den Gottesnamen als Namen wieder. „Erde“, „Riegel“, „Grube“ und „mein Leben“ sind quellentreu und im Kontext treffend. Die Fußnoten bewahren die lexikalischen Alternativen bei קֶצֶב, בַּעַד und שַׁחַת, ohne die Mehrdeutigkeit dogmatisch aufzulösen.
