base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/004.yaml
  text: You cast me into the deep[a], into the heart of the seas, and the current surrounded me; all your breakers and your waves passed over me.
translation:
  language: de
  text: Du hast mich in die Tiefe geworfen, ins Herz der Meere; die Strömung[a] umgab mich. All deine Brecher und Wogen gingen über mich hinweg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Strom“. Das hebräische Wort bedeutet gewöhnlich „Fluss“; hier bezeichnet es im poetischen Zusammenhang wahrscheinlich die Meeresströmung oder eine Flut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  choice: Du hast mich ... geworfen
  rationale: Das Verb שלך bezeichnet das Werfen oder Schleudern. Die direkte Anrede in der 2. Person Singular bleibt erhalten und gibt Gottes im Gebet ausgesprochene Handlung wieder.
- source_word: מְצוּלָה
  choice: in die Tiefe
  rationale: Bezeichnet hier die Meerestiefe. „In die Tiefe“ ist knapp, natürlich und bewahrt das Bild des Hinabgeworfenwerdens.
- source_word: בִּלְבַב יַמִּים
  choice: mitten ins Herz der Meere
  rationale: לְבַב bedeutet wörtlich „Herz“ und zugleich „Mitte“. Die Formulierung bewahrt die hebräische Metapher sowie den Plural „Meere“, während „mitten“ im Deutschen den räumlichen Sinn verdeutlicht.
- source_word: וְנָהָר
  choice: die Strömung
  rationale: נָהָר bedeutet gewöhnlich „Fluss“, kann im maritimen poetischen Zusammenhang aber die strömende Wassermasse bezeichnen. „Strömung“ passt zum Meeresszenario, ohne die lexikalische Alternative zu verschweigen.
- source_word: יְסֹבְבֵנִי
  choice: umgab mich
  rationale: סבב bedeutet „umgeben, umringen“. „Umgab mich“ ist modernes, klares Deutsch.
- source_word: מִשְׁבָּרֶיךָ
  choice: deine Brandungswellen
  rationale: מִשְׁבָּר bezeichnet sich brechende Wellen beziehungsweise Brandung. „Brandungswellen“ gibt das kraftvolle konkrete Bild verständlich wieder.
- source_word: וְגַלֶּיךָ
  choice: und deine Wogen
  rationale: גַּל bezeichnet eine Welle. „Wogen“ vermeidet eine unbeholfene Wiederholung nach „Brandungswellen“ und entspricht dem gehobenen poetischen Gebetsregister.
- source_word: עָלַי עָבָרוּ
  choice: gingen über mich hinweg
  rationale: Die Wiedergabe bleibt nahe am hebräischen Ausdruck und vermittelt das Überwältigtwerden, ohne durch „überspülten“ zusätzliche Dynamik einzutragen.
theological_decisions:
- issue: Göttliches Handeln bei Jonas Sturz ins Meer
  choice: 'Die direkte Anrede Gottes bleibt erhalten: „Du hast mich ... geworfen“ sowie „deine Brandungswellen und deine Wogen“.'
  alternative: Die Seeleute als eigentlich Handelnde hervorheben oder Gottes Handeln abschwächen.
  rationale: Das Hebräische verwendet ausdrücklich die 2. Person Singular und entsprechende Possessivsuffixe. So deutet Jona das durch Menschen ausgeführte Geschehen zugleich als Gottes Handeln; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildhaftigkeit. Die hebräischen Bilder „Herz der Meere“ und die direkte Gottesrede bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser verständlich.
