base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/009.yaml
  text: Those who cling to worthless idols forsake their own mercy[a].
translation:
  language: de
  text: Die an nichtigen Götzen festhalten, geben ihre Treue preis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die an nichtigen Götzen festhalten, geben die ihnen erwiesene Güte preis.“ Das hebräische Wort kann Treue, beständige Güte oder Erbarmen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁמְּרִים
  choice: die sich … halten
  rationale: שׁמר bedeutet gewöhnlich „bewahren“, „hüten“ oder „beachten“. In Verbindung mit nichtigen Götzen bezeichnet es hier anhaltende Hinwendung und Bindung; „sich an … halten“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: הַבְלֵי שָׁוְא
  choice: nichtige Götzen
  rationale: הֶבֶל bezeichnet Hauch, Leere oder Nichtigkeit, שָׁוְא zusätzlich Falschheit und Wertlosigkeit. In diesem prophetischen Sprachgebrauch sind wirkungslose, trügerische Götzen gemeint; „nichtige Götzen“ macht den Bezug verständlich, ohne ihnen irgendeine Wirksamkeit zuzuschreiben.
- source_word: חַסְדָּם
  choice: ihre Treue
  rationale: חֶסֶד kann loyale Treue, beständige Güte, Huld oder Erbarmen bezeichnen; das Suffix bedeutet „ihre“. „Ihre Treue“ bewahrt den relationalen Sinn und lässt zunächst offen, ob ihre eigene Treue oder die ihnen zugehörige beziehungsweise gewährte Güte gemeint ist. Die Fußnote nennt die wichtige alternative Deutung.
- source_word: יַעֲזֹבוּ
  choice: geben … preis
  rationale: עזב bedeutet „verlassen“ oder „aufgeben“. „Preisgeben“ drückt das bewusste Aufgeben in natürlichem, feierlichem Deutsch aus und verbindet sich idiomatisch mit „Treue“.
theological_decisions:
- issue: Bezug und Bedeutung von חַסְדָּם
  choice: Im Haupttext bezeichnet „ihre Treue“ die loyale, beständige Treue, die sie durch ihre Bindung an Götzen aufgeben.
  alternative: Gemeint sein kann auch Gottes ihnen geltende Gnade oder beständige Güte, die sie dadurch verwirken.
  rationale: Das hebräische חֶסֶד umfasst Treue, Güte, Huld und Erbarmen. Das Possessivsuffix lässt mehrere relationale Deutungen zu. Daher wird die Mehrdeutigkeit nicht dogmatisch aufgelöst, sondern die verbreitete alternative Lesart in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivierte Pluralkonstruktion „Die sich … halten“ folgt der knappen hebräischen Aussage. „Nichtige Götzen“ ist verständlich und bewahrt den prophetischen Ton; die Fußnote erhält die echte Bedeutungsbreite von חֶסֶד.
