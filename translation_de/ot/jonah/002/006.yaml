  text: אֲפָפ֤וּ/נִי מַ֨יִם֙ עַד נֶ֔פֶשׁ תְּה֖וֹם יְסֹבְבֵ֑/נִי ס֖וּף חָב֥וּשׁ לְ/רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/006.yaml
  text: Waters closed in around me to my very life[a]; the deep surrounded me[b]; seaweed was wrapped around my head.
translation:
  language: de
  text: Wasser umschlossen mich bis zur Lebensgefahr[a]; die Tiefe umgab mich; Seetang[b] war um meinen Kopf geschlungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „bis an die Seele“; das hebräische Wort kann hier das Leben oder die ganze Person bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Schilf“ oder „Binsen“ bedeuten; im Zusammenhang mit Jona unter Wasser liegt „Seetang“ nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: umschlossen mich
  rationale: Das Verb bezeichnet ein bedrohliches Umringen oder Einschließen. „Umschlossen mich“ ist im Deutschen anschaulich, würdevoll und erhält die poetische Wirkung.
- source_word: מַיִם
  choice: die Wasser
  rationale: Der poetische Plural bewahrt die hebräische Bildsprache bedrohlicher Wassermassen; das singularische „Wasser“ wäre im heutigen Deutsch geläufiger, aber weniger formnah.
- source_word: עַד נֶפֶשׁ
  choice: bis ans Leben
  rationale: נֶפֶשׁ bezeichnet hier das Leben beziehungsweise die eigene Person, nicht notwendig eine vom Körper getrennte Seele. „Bis ans Leben“ bewahrt die knappe, äußerste Bedrohung ausdrückende Formulierung, ohne die konkretere Deutung „bis an die Kehle“ in den Haupttext einzutragen.
- source_word: תְּהוֹם
  choice: die Tiefe
  rationale: „Die Tiefe“ gibt die gewaltige Meerestiefe wieder und vermeidet die späteren theologischen Nebenbedeutungen von „Abgrund“ oder „Abyss“.
- source_word: יְסֹבְבֵנִי
  choice: umgab mich
  rationale: Die Wiedergabe erhält den Parallelismus mit dem ersten Satzglied, variiert aber natürlich gegenüber „umschlossen mich“.
- source_word: סוּף
  choice: Seetang
  rationale: Das Wort kann Schilf oder Binsen bezeichnen; in der geschilderten Situation unter dem Meer passt „Seetang“ am besten zum unmittelbaren Kontext.
- source_word: חָבוּשׁ
  choice: war ... geschlungen
  rationale: Das passive Partizip beschreibt etwas, das gebunden oder gewunden ist. „War ... geschlungen“ ergibt zusammen mit „um meinen Kopf“ ein natürliches und lebendiges deutsches Bild.
- source_word: לְרֹאשִׁי
  choice: um meinen Kopf
  rationale: Die Präposition wird gemäß der durch חָבוּשׁ ausgedrückten Umschlingung idiomatisch mit „um“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele
  rationale: Im Zusammenhang geht es um Jonas bedrohtes Leben beziehungsweise seine ganze Person. Die Wiedergabe vermeidet, dem hebräischen Ausdruck eine spezifische Leib-Seele-Anthropologie aufzuzwingen, und nennt die wörtlichere Alternative in der Fußnote.
translation_notes:
  register: Moderne, würdige und knapp poetische Standardsprache. Der ungewöhnliche poetische Plural „die Wasser“ und die Wendung „bis ans Leben“ bewahren Form und Spannung des Hebräischen; die Fußnoten erläutern die maßgeblichen lexikalischen Alternativen.
