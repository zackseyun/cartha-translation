source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/ק֤וֹל תּוֹדָה֙ אֶזְבְּחָה לָּ֔/ךְ אֲשֶׁ֥ר נָדַ֖רְתִּי אֲשַׁלֵּ֑מָה יְשׁוּעָ֖תָ/ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/010.yaml
  text: But as for me[a], with the voice of thanksgiving I will sacrifice to you; what I have vowed I will pay. Salvation belongs to Yahweh.
translation:
  language: de
  text: Ich aber will dir mit Dankesworten Opfer darbringen; was ich gelobt habe, will ich erfüllen. Die Rettung gehört Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Die Rettung kommt von Jahwe“ oder: „Das Heil kommt von Jahwe.“ Das hebräische Wort kann im Zusammenhang konkrete Rettung oder Befreiung bezeichnen, aber auch den umfassenderen Sinn „Heil“ tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das selbstständige Pronomen hebt Jona kontrastierend hervor; die im Deutschen natürliche Nachstellung von „aber“ bewahrt diesen Gegensatz.
- source_word: בְּקוֹל תּוֹדָה
  choice: mit lautem Dank
  rationale: קוֹל bezeichnet die hörbare Stimme beziehungsweise den Klang, תּוֹדָה den Dank. „Mit lautem Dank“ gibt die hörbare Danksagung natürlich wieder, ohne das Bild auf stummen Dank zu reduzieren.
- source_word: אֶזְבְּחָה לָּךְ
  choice: will dir … Opfer darbringen
  rationale: זבח bezeichnet das Darbringen eines Opfers; לָּךְ nennt Gott als Empfänger. Die deutsche Wendung ist würdevoll und macht den im Hebräischen impliziten Opferbegriff verständlich.
- source_word: אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה
  choice: was ich gelobt habe, will ich erfüllen
  rationale: Im Zusammenhang mit einem Gelübde bedeutet das Piel von שלם dessen Erfüllung beziehungsweise Bezahlung. „Erfüllen“ ist im heutigen Deutsch klarer als „bezahlen“ und bewahrt den bindenden Charakter des Gelübdes.
- source_word: יְשׁוּעָתָה לַיהוָה
  choice: Die Rettung kommt von Jahwe
  rationale: יְשׁוּעָה bezeichnet hier konkret Rettung, kann aber weiterreichend auch Heil bedeuten. Das לַיהוָה kann in der knappen Bekenntnisformel Zugehörigkeit oder Ursprung ausdrücken; „kommt von“ passt zu Jonas erfahrener Befreiung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
theological_decisions:
- issue: Bedeutung der Schlussformel יְשׁוּעָתָה לַיהוָה
  choice: Die Rettung kommt von Jahwe
  alternative: Die Rettung gehört Jahwe; das Heil kommt von Jahwe
  rationale: Die Hauptfassung betont Jahwe als Ursprung der Rettung im unmittelbaren Zusammenhang, während die Fußnote die mögliche Zugehörigkeitsaussage und die umfassendere Bedeutung „Heil“ offenhält.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als Eigenname bewahrt den Charakter des offenbarten Bundesnamens, ohne eine konfessionelle Sonderdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mit lautem Dank“ vermeidet die im Deutschen schwerfällige wörtliche Form „mit der Stimme des Dankes“, bewahrt aber deren hörbaren Charakter. Die parallelen Formen „will ich …“ geben die entschlossene Selbstverpflichtung der hebräischen Verbformen wieder.
