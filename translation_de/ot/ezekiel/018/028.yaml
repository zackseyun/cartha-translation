base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/028.yaml
  text: Because he considered and turned back from all his transgressions that he had committed[a], he will surely live[b]; he will not die.
translation:
  language: de
  text: Denn er sah ein[a] und kehrte um von all seinen Vergehen, die er begangen hatte. Er wird ganz gewiss leben; er wird nicht sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn/und er sah“. Das hebräische Verb bedeutet wörtlich „sehen“ und kann hier ein Erkennen oder Bedenken ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶה
  choice: Denn er sah ein
  rationale: ראה bedeutet wörtlich „sehen“, bezeichnet hier aber im Zusammenhang moralisches Erkennen oder Bedenken. „sah ein“ bewahrt das Bild des Wahrnehmens und klingt im Deutschen natürlich; das ו wird im argumentativen Zusammenhang begründend mit „Denn“ wiedergegeben.
- source_word: וישוב
  choice: kehrte um
  rationale: שׁוב bedeutet „umkehren/zurückkehren“. „kehrte um“ erhält das konkrete Bild einer Abwendung von den Vergehen, ohne es durch einen stärker dogmatisch geprägten Fachbegriff zu ersetzen.
- source_word: מִכָּל פְּשָׁעָיו
  choice: von all seinen Vergehen
  rationale: פֶּשַׁע bezeichnet Vergehen beziehungsweise Auflehnung. „Vergehen“ ist verständlich und wahrt den moralischen Ernst; „Auflehnungen“ wäre ebenfalls möglich, würde den rebellischen Aspekt aber stärker hervorheben.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er begangen hatte
  rationale: עשה heißt allgemein „tun/machen“; in Verbindung mit Vergehen ist „begehen“ idiomatisches Deutsch. Das Plusquamperfekt verdeutlicht, dass die Vergehen seiner Umkehr vorausgingen.
- source_word: חָיוֹ יִחְיֶה
  choice: Er wird ganz gewiss leben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. „ganz gewiss“ gibt diese Emphase in natürlichem modernem Deutsch wieder.
- source_word: לֹא יָמוּת
  choice: er wird nicht sterben
  rationale: Die direkte Verneinung des Imperfekts wird schlicht wiedergegeben und bewahrt den pointierten Gegensatz zu „leben“.
theological_decisions:
- issue: Reichweite der Aussage über Leben und Tod
  choice: Die unmittelbare Zusage „Er wird ganz gewiss leben; er wird nicht sterben“ bleibt ohne nähere Bestimmung stehen.
  alternative: Die Aussage ausdrücklich auf körperliches Überleben, bundesgerichtliches Leben, geistliches Leben oder eschatologisches Leben beziehen.
  rationale: Der hebräische Text legt hier nicht ausdrücklich fest, in welchem Sinn „leben“ und „sterben“ gemeint sind. Die Übersetzung bewahrt daher die theologische Spannung und vermeidet eine systematische Einengung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Die konkrete Umkehr-Metapher und die emphatische Lebenszusage des Hebräischen bleiben erhalten; die genaue Art des zugesagten Lebens wird nicht festgelegt.
