  text: וְ/אִישׁ֙ לֹ֣א יוֹנֶ֔ה חֲבֹלָת֥/וֹ חוֹב֙ יָשִׁ֔יב גְּזֵלָ֖ה לֹ֣א יִגְזֹ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב יִתֵּ֔ן וְ/עֵירֹ֖ם יְכַסֶּה בָּֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/007.yaml
  text: He does not oppress anyone[a], but restores the debtor’s pledge; he does not commit robbery[c][b]; he gives his bread to the hungry and covers the naked with a garment.
translation:
  language: de
  text: Er unterdrückt niemanden, gibt das Pfand für eine Schuld zurück[a], begeht keinen Raub, gibt dem Hungrigen sein Brot[b] und bedeckt den Nackten mit einem Gewand[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Er gibt die als Sicherheit für eine Schuld genommene Sache zurück.'
    reason: lexical_alternative
  - marker: b
    text: „Brot“ kann hier allgemein Nahrung bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bekleidet den Nackten“. Gemeint sein kann auch jemand, der nur unzureichend bekleidet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנֶה
  choice: unterdrückt
  rationale: Der Hifil von ינה bezeichnet hier die ungerechte soziale oder wirtschaftliche Bedrückung eines anderen Menschen. „Unterdrückt“ gibt diesen ethischen Sinn prägnant wieder.
- source_word: אִישׁ
  choice: niemanden
  rationale: אִישׁ ist hier generisch gebraucht. In Verbindung mit der Verneinung ist „niemanden“ natürliches, modernes Deutsch.
- source_word: חֲבֹלָתוֹ חוֹב יָשִׁיב
  choice: gibt das Pfand für eine Schuld zurück
  rationale: Die Wendung beschreibt die Rückgabe einer Sache, die als Sicherheit für eine Schuld genommen wurde. „Pfand“ bewahrt den rechtlich-wirtschaftlichen Sinn, ohne unnötige Ergänzungen.
- source_word: גְּזֵלָה לֹא יִגְזֹל
  choice: raubt nichts
  rationale: Die Verbindung des stammverwandten Substantivs und Verbs betont gewaltsame oder widerrechtliche Aneignung. „Raubt nichts“ ist im Deutschen knapp, kräftig und idiomatisch.
- source_word: לַחְמוֹ
  choice: sein Brot
  rationale: „Brot“ bewahrt das konkrete Bild des hebräischen Textes, kann hier jedoch zugleich allgemein für Nahrung stehen.
- source_word: לְרָעֵב
  choice: dem Hungrigen
  rationale: Das substantivierte Adjektiv wird im Deutschen natürlich als „dem Hungrigen“ wiedergegeben und bezeichnet repräsentativ einen hungernden Menschen.
- source_word: עֵירֹם
  choice: den Nackten
  rationale: Das Wort bezeichnet jemanden, dem Kleidung fehlt oder der unzureichend bekleidet ist. „Den Nackten“ ist die direkte und im Zusammenhang verständliche Wiedergabe.
- source_word: יְכַסֶּה בָּגֶד
  choice: bedeckt ... mit einem Gewand
  rationale: Die Formulierung erhält sowohl das hebräische Verb „bedecken“ als auch das ausdrücklich genannte Kleidungsstück und bleibt dabei im Deutschen natürlich.
theological_decisions:
- issue: Generisch-männliche ethische Einzelfigur
  choice: Er unterdrückt niemanden ...
  alternative: Ein solcher Mensch unterdrückt niemanden ...
  rationale: Der Vers setzt die Beschreibung des gerechten Menschen in der dritten Person Singular fort. „Er“ wahrt diese grammatische Fortführung; „niemanden“, „dem Hungrigen“ und „den Nackten“ sind inhaltlich allgemein und schränken die Aussage nicht auf Männer ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung kurzer Verben bewahrt den markanten ethischen Katalog des hebräischen Textes. Konkrete Bilder wie „Brot“, „bedeckt“ und „Gewand“ bleiben erhalten; erläuternde Alternativen stehen in den Fußnoten.
