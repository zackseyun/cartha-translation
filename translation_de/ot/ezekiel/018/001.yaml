  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an mich[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, traditionell mit »der HERR« wiedergegeben; hier als »Jahwe« transkribiert.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form dient als übliche narrative Einleitung. Die feste deutsche Wendung „das Wort … erging“ gibt den Fortgang idiomatisch und zugleich formnah wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְבַר־יְהוָה bezeichnet der Ausdruck eine konkrete göttliche Mitteilung; „das Wort“ bewahrt zudem die wiederkehrende Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֵלַי
  choice: an mich
  rationale: Die Präposition mit Suffix bezeichnet hier den Empfänger der göttlichen Mitteilung. In der deutschen Formel ist „erging an mich“ natürlich und präzise.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die nachfolgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als das formale „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst, nicht den Titel אֲדֹנָי. Die Umschrift bewahrt diese Unterscheidung; eine Fußnote weist auf die traditionelle Wiedergabe hin.
- issue: Wiedergabe von לֵאמֹר
  choice: Doppelpunkt
  alternative: und sprach
  rationale: Das Hebräische markiert die Einführung der folgenden Rede, ohne ausdrücklich ein neues finites Verb mit eigenem Subjekt zu setzen. Der Doppelpunkt gibt diese Funktion knapp wieder und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „das Wort Jahwes erging an mich“ verbindet formale Nähe mit natürlicher deutscher Ausdrucksweise; der Doppelpunkt leitet die in Vers 2 folgende Rede ein.
