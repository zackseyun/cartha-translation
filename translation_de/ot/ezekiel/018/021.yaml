  text: וְ/הָ/רָשָׁ֗ע כִּ֤י יָשׁוּב֙ מִ/כָּל חטאת/ו אֲשֶׁ֣ר עָשָׂ֔ה וְ/שָׁמַר֙ אֶת כָּל חֻקּוֹתַ֔/י וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה חָיֹ֥ה יִחְיֶ֖ה לֹ֥א יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/021.yaml
  text: But if the wicked man turns back from all his sins that he has committed[a], and keeps all my statutes, and does justice and righteousness, he shall surely live; he shall not die.
translation:
  language: de
  text: Doch wenn der Gottlose von allen seinen Sünden umkehrt[a], die er begangen hat, und alle meine Satzungen hält und Recht und Gerechtigkeit übt, wird er ganz gewiss leben; er wird nicht sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Buße tut“. Das hebräische Verb bedeutet wörtlich „umkehren/zurückkehren“ und beschreibt hier die Abkehr von der Sünde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv ist grammatisch maskulin Singular und bezeichnet hier einen einzelnen Menschen, dessen Handeln als gottlos beziehungsweise schuldig gekennzeichnet ist.
- source_word: כִּי
  choice: wenn
  rationale: Im Zusammenhang leitet כִּי einen Bedingungsfall ein; zusammen mit dem vorausgehenden וְ ergibt sich natürlich „Doch wenn“.
- source_word: יָשׁוּב
  choice: umkehrt
  rationale: שׁוּב bedeutet grundsätzlich „umkehren/zurückkehren“. Mit מִן und den Sünden als Ausgangspunkt bezeichnet es hier die Abkehr vom bisherigen sündigen Verhalten, ohne den Begriff auf eine dogmatische Fachbedeutung zu verengen.
- source_word: מִכָּל חטאתו אֲשֶׁר עָשָׂה
  choice: von allen seinen Sünden … die er begangen hat
  rationale: Der distributive Ausdruck wird im Deutschen natürlich im Plural wiedergegeben; עשה verlangt in Verbindung mit „Sünden“ idiomatisch „begehen“.
- source_word: וְשָׁמַר אֶת כָּל חֻקּוֹתַי
  choice: und alle meine Satzungen hält
  rationale: שׁמר bezeichnet bei Rechtsbestimmungen deren Einhaltung; „Satzungen“ bewahrt die rechtlich-bundestheologische Färbung von חֻקּוֹת.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: und Recht und Gerechtigkeit übt
  rationale: Die beiden gewichtigen ethischen Substantive bleiben unterscheidbar erhalten. „üben“ ist im Deutschen eine natürliche Verbindung und gibt das handelnde עשה wieder.
- source_word: חָיֹה יִחְיֶה
  choice: wird er ganz gewiss leben
  rationale: Infinitivus absolutus plus Imperfekt verstärkt die Aussage. „ganz gewiss“ bildet diese Emphase klar ab.
- source_word: לֹא יָמוּת
  choice: er wird nicht sterben
  rationale: Die schlichte Verneinung bleibt erhalten und bildet den feierlichen Gegensatz zur zugesicherten Lebensverheißung.
theological_decisions:
- issue: Wiedergabe von שׁוּב als ausdrücklich theologischer Begriff „Buße tun“
  choice: umkehrt
  alternative: Buße tut
  rationale: „umkehrt“ erhält das konkrete hebräische Bild der Abkehr von Sünden und vermeidet eine unnötige Verengung auf spätere theologische Terminologie.
- issue: Bedeutungsumfang von חָיֹה יִחְיֶה
  choice: wird er ganz gewiss leben
  alternative: wird er am Leben bleiben
  rationale: Die Übersetzung lässt offen, ob das Leben hier vor allem physisches Weiterleben, Leben im Bund oder eine weiterreichende Heilswirklichkeit bezeichnet, und bewahrt damit die Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt quellennah, ohne unnatürliche hebräische Syntax nachzuahmen. „Recht und Gerechtigkeit übt“ erhält die lexikalische Paarung; die maskuline Einzelform „der Gottlose“ entspricht dem grammatischen Profil des Ausgangstextes.
