  text: עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנָ֔ה גְּזֵל֣וֹת גָּזָ֔ל חֲבֹ֖ל לֹ֣א יָשִׁ֑יב וְ/אֶל הַ/גִּלּוּלִים֙ נָשָׂ֣א עֵינָ֔י/ו תּוֹעֵבָ֖ה עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/012.yaml
  text: He has oppressed the poor and needy[a], committed robbery, not returned a pledge, lifted up his eyes to the idols, and done an abomination.
translation:
  language: de
  text: Er hat Arme und Bedürftige unterdrückt, Raub begangen, ein Pfand nicht zurückgegeben, seine Augen zu den Götzen[a] erhoben und eine Abscheulichkeit verübt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck גִּלּוּלִים für „Götzen“ ist bewusst verächtlich und polemisch gefärbt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי וְאֶבְיוֹן
  choice: Arme und Bedürftige
  rationale: Das feste Wortpaar bezeichnet sozial und wirtschaftlich schutzbedürftige Menschen. Die gewählte Formulierung ist im modernen Deutschen klar und bewahrt beide Aspekte.
- source_word: הוֹנָה
  choice: hat ... unterdrückt
  rationale: Das Verb bezeichnet bedrückende, ausbeuterische Misshandlung; im Zusammenhang mit Armen und Bedürftigen gibt „unterdrückt“ die soziale und wirtschaftliche Dimension angemessen wieder.
- source_word: גְּזֵלוֹת גָּזָל
  choice: Raub begangen
  rationale: Die Verbindung aus stammverwandtem Substantiv und Verb hebt die widerrechtliche Aneignung hervor. „Raub begangen“ bildet diese Nachdrücklichkeit in natürlichem Deutsch ab.
- source_word: חֲבֹל לֹא יָשִׁיב
  choice: ein Pfand nicht zurückgegeben
  rationale: חֲבֹל bezeichnet einen zur Sicherung einer Schuld genommenen Pfandgegenstand; „Pfand“ ist präzise und verständlich, „zurückgegeben“ entspricht dem Kontext.
- source_word: וְאֶל־הַגִּלּוּלִים נָשָׂא עֵינָיו
  choice: seine Augen zu den Götzen erhoben
  rationale: Die hebräische Bildsprache bleibt erhalten, ohne die darin angedeutete Hinwendung oder Verehrung ausdrücklich auszudeuten.
- source_word: הַגִּלּוּלִים
  choice: die Götzen
  rationale: „Götzen“ ist die klare deutsche Haupttextwiedergabe für den polemischen Ausdruck; dessen besonders verächtliche Färbung wird in einer Fußnote erläutert.
- source_word: תּוֹעֵבָה עָשָׂה
  choice: etwas Abscheuliches getan
  rationale: Die Wendung gibt den moralisch und kultisch verwerflichen Charakter verständlich und würdevoll wieder, ohne im Deutschen die unnatürliche Formulierung „einen Gräuel getan“ zu erzwingen.
theological_decisions:
- issue: Bildhafte Wendung für die Hinwendung zu Götzen und ihre moralische Tragweite
  choice: „seine Augen zu den Götzen erhoben“ und „etwas Abscheuliches getan“
  alternative: „die Götzen angebetet“ beziehungsweise „einen Gräuel begangen“
  rationale: Das Erheben der Augen deutet im Zusammenhang eine religiöse Hinwendung an, nennt jedoch nicht ausdrücklich den Akt der Anbetung. Die Übersetzung bewahrt dieses Bild und löst seine Bedeutung nicht enger auf, als es der hebräische Wortlaut verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Aufzählungsstruktur und die Bildsprache des Hebräischen bleiben erhalten; schwerfällige Hebraismen werden vermieden.
