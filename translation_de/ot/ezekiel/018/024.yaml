source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְקָת/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל כְּ/כֹ֨ל הַ/תּוֹעֵב֜וֹת אֲשֶׁר עָשָׂ֧ה הָ/רָשָׁ֛ע יַעֲשֶׂ֖ה וָ/חָ֑י כָּל צדקת/ו אֲשֶׁר עָשָׂה֙ לֹ֣א תִזָּכַ֔רְנָה בְּ/מַעֲל֧/וֹ אֲשֶׁר מָעַ֛ל וּ/בְ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א בָּ֥/ם יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/024.yaml
  text: But when a righteous man turns away from his righteousness and does injustice[a], doing all the abominations that the wicked man does, shall he live? None of the righteous deeds that he has done will be remembered. In the treachery by which he has acted treacherously[c][b], and in the sin that he has committed—in them he shall die.
translation:
  language: de
  text: Wenn aber ein Gerechter sich von seiner Gerechtigkeit abwendet, Unrecht tut und all die Gräuel[a] begeht, die der Gottlose begeht – wird er dann leben? An keine seiner gerechten Taten wird man sich erinnern. In seiner Untreue, mit der er treulos gehandelt hat,[b] und in seiner Sünde, die er begangen hat, wird er sterben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all die abscheulichen Dinge“.'
    reason: lexical_alternative
  - marker: b
    text: „Untreue“ kann auch mit „Treuebruch“ oder „Verfehlung“ wiedergegeben werden. Im Hebräischen unterstreicht eine Verbindung aus stammverwandtem Nomen und Verb den begangenen Treuebruch.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „In ihnen wird er sterben“; „ihnen“ bezieht sich auf die eben genannte Untreue und Sünde.'
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: Wenn aber ... sich ... abwendet
  rationale: Die Verbindung aus Konjunktion und Infinitiv leitet hier einen konditional-temporalen Gegensatz zum vorherigen Vers ein. שׁוב mit מִן bezeichnet das Abwenden von einem bisherigen Zustand.
- source_word: צַדִּיק / מִצִּדְקָתוֹ
  choice: ein Gerechter / von seiner Gerechtigkeit
  rationale: Die substantivierte Einzahl wird als repräsentative Person wiedergegeben; „Gerechtigkeit“ bewahrt die Wortverbindung und bezeichnet hier gerechtes Verhalten beziehungsweise den entsprechenden moralischen Stand.
- source_word: וְעָשָׂה עָוֶל
  choice: Unrecht tut
  rationale: עָוֶל bezeichnet Unrecht oder Ungerechtigkeit. Die geläufige deutsche Wendung bleibt nah an der hebräischen Verbindung aus עשה und Nomen.
- source_word: כְּכֹל הַתּוֹעֵבוֹת
  choice: all die Gräuel begeht
  rationale: תּוֹעֵבוֹת ist ein starker moralisch-bundestheologischer Ausdruck. „Gräuel“ bewahrt Gewicht und innerbiblische Anklänge; „begeht“ ergibt mit Handlungen natürliches Deutsch.
- source_word: יַעֲשֶׂה וָחָי
  choice: sollte er am Leben bleiben?
  rationale: Die rhetorische Frage bestreitet, dass ein solcher Mensch leben wird. Die vorausgehenden Taten sind im Deutschen bereits ausdrücklich genannt, sodass ihre Wiederholung entfallen kann.
- source_word: כָּל צִדְקֹתָו ... לֹא תִזָּכַרְנָה
  choice: An keine seiner gerechten Taten wird man sich erinnern
  rationale: Die Negation mit „alle“ bedeutet kontextuell, dass keine einzige frühere gerechte Tat erinnert wird. Die unpersönliche deutsche Form gibt das hebräische Passiv idiomatisch wieder, ohne die gerichtliche Aussage auszudeuten.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: Wegen seiner Untreue, durch die er treulos gehandelt hat
  rationale: Der verwandte Nomen-Verb-Ausdruck aus מעל betont einen Treuebruch. Die deutsche Wiederaufnahme mit „Untreue/treulos“ erhält diesen Nachdruck, ohne den Sinn auf einen technischen Rechtsbegriff festzulegen.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר חָטָא ... בָּם יָמוּת
  choice: und wegen seiner Sünde, die er begangen hat, wird er sterben
  rationale: „Sünde ... begangen“ gibt die hebräische figura etymologica in natürlichem Deutsch wieder. „Wegen“ macht den im Hebräischen durch בְּ ausgedrückten Zusammenhang verständlich; die wörtlichere Form wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Frühere Gerechtigkeit und gegenwärtige Abkehr
  choice: Die früheren gerechten Taten werden bei der Abkehr zur Gottlosigkeit nicht erinnert, und der Betreffende stirbt wegen seiner Untreue und Sünde.
  alternative: Die Aussage als Verlust angesammelter Verdienste oder als bloß zeitliche Folge zu deuten.
  rationale: Der Vers formuliert individuelle göttliche Verantwortlichkeit. Die Übersetzung bewahrt diese gerichtliche Aussage, ohne spätere Lehrsysteme über Verdienst, Abfall oder Beharrung einzutragen.
- issue: Bedeutung des angekündigten Todes
  choice: „wird er sterben“ bleibt ohne nähere dogmatische Bestimmung stehen.
  alternative: Den Tod ausdrücklich als körperlichen, geistlichen oder ewigen Tod zu kennzeichnen.
  rationale: Der einzelne Vers spezifiziert die Art beziehungsweise Reichweite des Todes nicht; die vorhandene theologische Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die repräsentativen maskulinen Singularformen des Hebräischen bleiben erhalten. Stark belastete Schlüsselbegriffe werden verständlich formuliert, ohne ihre moralische und bundestheologische Schärfe abzuschwächen.
