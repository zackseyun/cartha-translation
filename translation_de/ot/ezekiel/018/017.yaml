  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵ/עָנִ֞י הֵשִׁ֣יב יָד֗/וֹ נֶ֤שֶׁךְ וְ/תַרְבִּית֙ לֹ֣א לָקָ֔ח מִשְׁפָּטַ֣/י עָשָׂ֔ה בְּ/חֻקּוֹתַ֖/י הָלָ֑ךְ ה֗וּא לֹ֥א יָמ֛וּת בַּ/עֲוֺ֥ן אָבִ֖י/ו חָיֹ֥ה יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/017.yaml
  text: He has withheld his hand from the poor[a], has not taken interest or profit, has carried out my judgments, and has walked in my statutes. He will not die for his father's iniquity[c][b]; he will surely live.
translation:
  language: de
  text: Er hat seine Hand von dem Armen zurückgehalten[a], weder Zins noch Aufschlag genommen, meine Rechtsbestimmungen befolgt und nach meinen Satzungen gelebt. Er wird nicht wegen der Schuld seines Vaters sterben[b]; er wird ganz gewiss leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hat seine Hand von dem Armen zurückgezogen«. Gemeint ist, dass er davon absieht, den Armen zu schädigen oder auszubeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: »Er wird nicht in der Schuld seines Vaters sterben.« Im Zusammenhang ist gemeint, dass er nicht wegen der Schuld seines Vaters sterben wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעָנִי הֵשִׁיב יָדוֹ
  choice: Er hat seine Hand von dem Armen zurückgehalten
  rationale: Die Wiedergabe bewahrt das hebräische Bild des Zurückziehens beziehungsweise Zurückhaltens der Hand. Im rechtlich-sozialen Zusammenhang bezeichnet es den Verzicht darauf, einen Armen zu schädigen oder auszubeuten.
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: Zins noch Aufschlag
  rationale: נֶשֶׁךְ bezeichnet den Zins auf ein Darlehen; תַרְבִּית den darüber entstehenden Zuwachs oder Aufschlag. Die beiden deutschen Begriffe bleiben unterscheidbar und passen in den wirtschaftlichen Kontext.
- source_word: מִשְׁפָּטַי עָשָׂה
  choice: meine Rechtsbestimmungen befolgt
  rationale: Wörtlich steht hier »meine Rechtsentscheide getan«. »Rechtsbestimmungen befolgt« wahrt den rechtlichen Charakter und klingt im heutigen Deutsch natürlich.
- source_word: בְּחֻקּוֹתַי הָלָךְ
  choice: nach meinen Satzungen gelebt
  rationale: Das hebräische Bild lautet wörtlich »in meinen Satzungen gegangen«. Die deutsche Form gibt die gemeinte Lebensführung natürlich wieder, während »Satzungen« den rechtlich-bundestheologischen Ton erhält.
- source_word: בַּעֲוֺן אָבִיו
  choice: wegen der Schuld seines Vaters
  rationale: Die Präposition ב kann hier die Ursache beziehungsweise Grundlage des Sterbens angeben. »Wegen« macht den im Kapitelzusammenhang naheliegenden Bezug auf persönliche Verantwortlichkeit klar, ohne die Schuld des Vaters dem Sohn zuzuschreiben.
- source_word: חָיֹה יִחְיֶה
  choice: er wird ganz gewiss leben
  rationale: Der absolute Infinitiv vor der finiten Verbform verstärkt die Aussage. »Ganz gewiss« bildet diese emphatische Konstruktion in natürlichem Deutsch ab.
theological_decisions:
- issue: Persönliche Verantwortung und die Schuld des Vaters
  choice: Der Sohn stirbt nicht wegen der Schuld seines Vaters, sondern wird aufgrund seines hier beschriebenen Handelns leben.
  alternative: 'Wörtlicher: »Er wird nicht in der Schuld seines Vaters sterben.«'
  rationale: Der unmittelbare Zusammenhang von Ezechiel 18 betont die persönliche Verantwortlichkeit. »Wegen« gibt den kausalen Sinn der Präposition wieder, ohne weitergehende Aussagen über generationenübergreifende Folgen von Sünde einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Wortwahl des Verses bleibt in »Rechtsbestimmungen« und »Satzungen« erkennbar; schwer verständliche Hebraismen werden behutsam natürlich wiedergegeben. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
