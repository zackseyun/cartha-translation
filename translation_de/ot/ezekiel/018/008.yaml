base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/008.yaml
  text: He does not lend at interest or take profit[a]; he keeps his hand back from injustice[c][b]; he executes true justice between one man and another.
translation:
  language: de
  text: Er leiht nicht gegen Zins aus und nimmt keinen Zuwachs[a]; er hält seine Hand von Unrecht zurück[b] und übt zwischen Mensch und Mensch gerechtes Recht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nimmt keinen Gewinn“. Die beiden hebräischen Begriffe bezeichnen verwandte Formen des Gewinns aus einem Darlehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „er wendet seine Hand vom Unrecht zurück“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zwischen Mann und Mann“; eine Rechtsformel für die unparteiische Rechtsprechung zwischen zwei Parteien.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ לֹא יִתֵּן
  choice: Er leiht nicht gegen Zins
  rationale: יִתֵּן bedeutet für sich genommen „gibt“, bezeichnet zusammen mit נֶשֶׁךְ jedoch das Verleihen gegen Zins. „Gegen Zins leihen“ gibt diesen wirtschaftlich-rechtlichen Sinn in natürlichem Deutsch wieder.
- source_word: וְתַרְבִּית לֹא יִקָּח
  choice: und nimmt keinen Aufschlag
  rationale: תַרְבִּית bezeichnet einen Zuwachs oder Mehrbetrag und steht hier neben נֶשֶׁךְ. „Aufschlag“ wahrt die begriffliche Nähe, ohne beide Wörter unterschiedslos mit „Zins“ wiederzugeben.
- source_word: מֵעָוֶל יָשִׁיב יָדוֹ
  choice: er hält seine Hand von Unrecht zurück
  rationale: Die bildhafte Wendung lautet wörtlich, dass er seine Hand vom Unrecht zurückwendet. Die gewählte Form bewahrt das Handmotiv und bezeichnet verständlich die Enthaltung von unrechtem Handeln.
- source_word: מִשְׁפַּט אֱמֶת
  choice: gerechtes Urteil
  rationale: Die Verbindung bezeichnet ein Urteil, das der Wahrheit und dem Recht entspricht. „Gerechtes Urteil“ ist im deutschen Rechts- und Alltagssprachgebrauch natürlich, während eine Fußnote die wörtlichere Möglichkeit „Urteil der Wahrheit“ nicht erfordert.
- source_word: יַעֲשֶׂה
  choice: übt
  rationale: Das Verb heißt grundsätzlich „tun“ oder „vollziehen“. In Verbindung mit einem Urteil bringt „übt“ die tatsächliche Rechtsprechung knapp und idiomatisch zum Ausdruck.
- source_word: בֵּין אִישׁ לְאִישׁ
  choice: zwischen dem einen und dem anderen
  rationale: Die hebräische Rechtsformel lautet wörtlich „zwischen Mann und Mann“, meint aber die unparteiische Entscheidung zwischen zwei Streitparteien. Die deutsche Form bewahrt die Paarstruktur, ohne das generische אִישׁ unnötig auf männliche Beteiligte zu verengen.
theological_decisions:
- issue: Verhältnis von נֶשֶׁךְ und תַרְבִּית
  choice: Zwei verwandte Begriffe werden als „Zins“ und „Aufschlag“ unterschieden.
  alternative: Beide als „Zins“ wiedergeben oder „Wucherzins und Zuwachs“ schreiben.
  rationale: Der hebräische Parallelismus verbindet zwei nahe wirtschaftliche Begriffe, ohne ihre genaue technische Abgrenzung eindeutig festzulegen. Die Übersetzung wahrt sowohl ihre Nähe als auch ihre Verschiedenheit und legt nicht fest, dass nur ein nach modernem Verständnis überhöhter Wucherzins gemeint sei.
- issue: Rechtsformel בֵּין אִישׁ לְאִישׁ
  choice: zwischen dem einen und dem anderen
  alternative: zwischen einem Mann und einem anderen oder zwischen zwei Menschen
  rationale: אִישׁ steht in einer allgemeinen Rechtsformel für die beteiligten Parteien. Die gewählte Fassung gibt deren allgemeinen Anwendungsbereich wieder und lässt das Geschlecht der Streitparteien offen.
- issue: מִשְׁפַּט אֱמֶת
  choice: gerechtes Urteil
  alternative: wahres Urteil oder Urteil der Wahrheit
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit und Rechtschaffenheit bezeichnen. Im gerichtlichen Zusammenhang vermittelt „gerecht“ den Sinn eines der Wahrheit entsprechenden Urteils, ohne eine besondere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht rechtssprachlichem Ton. Die Satzstruktur folgt dem hebräischen Dreischritt; konkrete Bilder werden soweit möglich bewahrt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
