base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/022.yaml
  text: None of the transgressions that he has committed will be remembered against him[a]; by the righteousness that he has practiced[b], he will live.
translation:
  language: de
  text: Keines seiner Vergehen, die er begangen hat, wird ihm angerechnet werden[a]; wegen der Gerechtigkeit, die er geübt hat[b], wird er leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet wörtlich etwa: „wird ihm nicht gedacht werden“; auch: „wird ihm nicht vorgehalten werden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „in seiner Gerechtigkeit“ oder „durch seine Gerechtigkeit“; die hebräische Präposition lässt hier mehrere eng miteinander verwandte Deutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּשָׁעָיו
  choice: Keines seiner Vergehen
  rationale: In Verbindung mit der Verneinung gibt „keines“ die umfassende Aussage von כָּל idiomatisch wieder. „Vergehen“ bewahrt den moralisch-rechtlichen Charakter von פֶּשַׁע, ohne die Bedeutung unnötig auf offene Rebellion einzuengen.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er begangen hat
  rationale: Bei Vergehen ist „begehen“ im Deutschen die natürliche Verbindung und entspricht hier dem vollendeten Handeln.
- source_word: לֹא יִזָּכְרוּ לוֹ
  choice: wird ihm angerechnet werden
  rationale: Das passive „erinnert werden“ mit לֹא und לוֹ hat hier gerichtlichen Sinn. „Angerechnet werden“ gibt diesen Sinn natürlich wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: בְּצִדְקָתוֹ
  choice: Wegen der Gerechtigkeit
  rationale: בְּ kann hier kausal, instrumental oder sphärisch verstanden werden. „Wegen“ passt zum Zusammenhang, ohne die eng verwandten Alternativen auszuschließen.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er geübt hat
  rationale: Mit צְדָקָה bezeichnet עָשָׂה praktizierte gerechte Lebensführung. „Gerechtigkeit üben“ ist verständlich und bleibt dem hebräischen Ausdruck nahe.
- source_word: יִחְיֶה
  choice: wird er leben
  rationale: Die Form bezeichnet das zugesagte Leben als Folge; „wird leben“ bewahrt diese Zukunfts- bzw. Ergebnisnuance.
theological_decisions:
- issue: Verdienstliche Selbstrechtfertigung oder Bundes- und Gerichtsgrundsatz persönlicher Verantwortlichkeit
  choice: 'Die Aussage wird in Hesekiels eigenen gerichtlichen Begriffen wiedergegeben: Frühere Vergehen werden nicht angerechnet, und der Betreffende wird wegen seiner geübten Gerechtigkeit leben.'
  alternative: Eine dogmatisch verstärkte Rechtfertigungsformulierung oder eine Abschwächung von „leben“ auf bloßes zeitliches Wohlergehen.
  rationale: Der Vers soll weder in spätere Lehrkategorien eingeordnet noch in seiner Aussage abgeschwächt werden. Die theologische Spannung des hebräischen Textes bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich und bewahrt zugleich den gerichtlichen Ton sowie die Mehrdeutigkeit der Präposition בְּ.
