reference: Ezekiel 18:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֣יא תָמ֑וּת בֵּ֞ן לֹא יִשָּׂ֣א בַּ/עֲוֺ֣ן הָ/אָ֗ב וְ/אָב֙ לֹ֤א יִשָּׂא֙ בַּ/עֲוֺ֣ן הַ/בֵּ֔ן צִדְקַ֤ת הַ/צַּדִּיק֙ עָלָ֣י/ו תִּֽהְיֶ֔ה וְ/רִשְׁעַ֥ת רשע עָלָ֥י/ו תִּֽהְיֶֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/020.yaml
  text: The person who sins—he shall die[a]. A son shall not bear the iniquity of the father, and a father shall not bear the iniquity of the son. The righteousness of the righteous shall be upon him[b], and the wickedness of the wicked shall be upon him.
translation:
  language: de
  text: Der Mensch, der sündigt, wird sterben.[a] Ein Sohn wird nicht die Schuld des Vaters tragen, und ein Vater wird nicht die Schuld des Sohnes tragen. Die Gerechtigkeit des Gerechten wird auf ihm sein, und die Bosheit des Bösen wird auf ihm sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Die Seele, die sündigt, sie wird sterben.“ Das hebräische Wort nefesch bezeichnet hier den einzelnen Menschen als Person.'
    reason: lexical_alternative
  - marker: b
    text: '„Schuld tragen“ ist eine hebräische Rechtswendung. Sie kann sowohl die Schuld selbst als auch die damit verbundene Haftung beziehungsweise deren Folgen einschließen. Wörtlich lautet der letzte Satzteil: „Die Gerechtigkeit des Gerechten wird auf ihm sein, und die Bosheit des Bösen wird auf ihm sein.“'
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: der Mensch
  rationale: נֶפֶשׁ bezeichnet hier im rechtlich-prophetischen Zusammenhang die einzelne Person, nicht eigens einen vom Körper trennbaren Seelenteil. „Mensch“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: הַחֹטֵאת
  choice: der sündigt
  rationale: Das Partizip bezeichnet allgemein die Person, die sündigt; der Relativsatz ist im modernen Deutsch klar und idiomatisch.
- source_word: הִיא תָמוּת
  choice: der muss sterben
  rationale: Das feminine הִיא stimmt grammatisch mit נֶפֶשׁ überein und hebt dieselbe Person hervor. „Muss sterben“ bewahrt den bestimmten, rechtlichen Aussagecharakter von תָמוּת besser als ein bloßes Futur.
- source_word: בֵּן
  choice: ein Sohn
  rationale: Die maskuline Einzahl und die Vater-Sohn-Parallele werden entsprechend der hebräischen Rechtsformulierung erhalten.
- source_word: יִשָּׂא בַּעֲוֺן
  choice: die Schuld … tragen
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des Tragens und lässt zu, dass עָוֺן sowohl Vergehen beziehungsweise Schuld als auch die daraus erwachsende Haftung umfasst.
- source_word: צִדְקַת הַצַּדִּיק
  choice: die Gerechtigkeit des Gerechten
  rationale: Die Wiedergabe erhält die prägnante Wortstammverbindung und den moralisch-rechtlichen Parallelismus.
- source_word: עָלָיו תִּהְיֶה
  choice: kommt ihm selbst zugute / fällt auf ihn selbst zurück
  rationale: Das schwerfällige wörtliche „wird auf ihm sein“ wird kontextgerecht und parallel wiedergegeben. „Selbst“ verdeutlicht den im Vers betonten persönlichen Bezug, ohne die Aussage auf bloßen Besitz zu verengen.
- source_word: וְרִשְׁעַת רשע
  choice: und die Bosheit des Bösen
  rationale: Die Wiedergabe bewahrt die Wortstammfigur und die Symmetrie mit „Gerechtigkeit des Gerechten“; das Ketiv רשע ist entsprechend dem Sinn als רָשָׁע verstanden.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: „Mensch“ statt „Seele“ im Haupttext
  alternative: „Die Seele, die sündigt“
  rationale: Der Vers behandelt die persönliche moralische Verantwortlichkeit und formuliert keine technische Lehre über die Trennbarkeit der Seele. Die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Individuelle Verantwortlichkeit in der Vater-Sohn-Formel
  choice: Die maskulinen Einzelrollen „Sohn“ und „Vater“ bleiben erhalten
  alternative: „Kind“ und „Elternteil“
  rationale: So bleiben Form, Gegenüberstellung und konkrete Generationenbeziehung des hebräischen Rechtssatzes erhalten, ohne die Aussage konfessionell auszudeuten.
- issue: Bedeutungsumfang von עָוֺן
  choice: „Schuld“ mit erläuternder Fußnote
  alternative: „Missetat“, „Sündenstrafe“ oder „Strafe“
  rationale: „Schuld“ ist verständlich und kann sowohl die schuldhafte Tat als auch die daraus folgende Verantwortlichkeit umfassen. Eine reine Strafübersetzung würde die genuine Bedeutungsbreite vorschnell einschränken.
- issue: Bedeutung von עָלָיו תִּהְיֶה
  choice: idiomatisch als persönliche Folge wiedergegeben
  alternative: „wird auf ihm sein“ oder „wird ihm gehören“
  rationale: Die hebräische Formulierung bleibt hinsichtlich der genauen Art des Auf-jemand-Seins knapp. Die parallelen deutschen Wendungen markieren die persönliche Zuordnung, ohne daraus eine bestimmte Lehre von Verdienst oder zugerechneter Gerechtigkeit abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Rechtssatz bleibt knapp und parallel gebaut. „Muss sterben“ vermittelt die bestimmte Rechtsfolge; „Schuld tragen“ bewahrt das hebräische Bild. Die Schlussglieder werden zur natürlichen Verständlichkeit idiomatisch formuliert, während die wörtliche Struktur in Fußnote [b] dokumentiert ist.
