revisions:
- from: Der Mensch, der sündigt, der muss sterben.[a] Ein Sohn soll nicht die Schuld seines Vaters tragen, und ein Vater soll nicht die Schuld seines Sohnes tragen. Die Gerechtigkeit des Gerechten kommt ihm selbst zugute, und die Bosheit des Bösen fällt auf ihn selbst zurück.[b]
  to: Der Mensch, der sündigt, wird sterben.[a] Ein Sohn wird nicht die Schuld des Vaters tragen, und ein Vater wird nicht die Schuld des Sohnes tragen. Die Gerechtigkeit des Gerechten wird auf ihm sein, und die Bosheit des Bösen wird auf ihm sein.[b]
  rationale: Die Revision beseitigt die zusätzliche Modalnuance bei „muss sterben“ und stellt im Schlusssatz die identische hebräische Zuordnungsformel auf beiden Seiten wieder her. Damit bleiben deren knappe Aussage und der rhetorisch-moralische Parallelismus erhalten, ohne eine bestimmte Theorie von Vergeltung, Verdienst oder Zurechnung einzutragen. Die vorhandenen Fußnoten bleiben inhaltlich passend und sind an den vollständigen revidierten Text angepasst.
