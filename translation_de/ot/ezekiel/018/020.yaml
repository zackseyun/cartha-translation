  naturalness: „Der Mensch, der sündigt“ und „Schuld tragen“ sind in modernem Standarddeutsch klar und angemessen. „Wird auf ihm sein“ ist zwar gehoben, aber als absichtlich quellennaher Rechtssatz verständlich; die Fußnote erläutert diese knappe Formel. Die Ersetzung von „muss“ durch „wird“ ist zugleich idiomatisch und genauer.
  terminology: „Mensch“ für נֶפֶשׁ, „Schuld“ für עָוֺן sowie „Gerechtigkeit des Gerechten“ und „Bosheit des Bösen“ sind vertretbar. „Schuld“ sollte durch die bestehende Anmerkung weiterhin in ihrer Bedeutung von Tat und Haftung erläutert werden. Der Ausdruck „selbst“ ist nicht erforderlich und wird entfernt, da er gegenüber der hebräischen Formulierung zusätzlich akzentuiert.
