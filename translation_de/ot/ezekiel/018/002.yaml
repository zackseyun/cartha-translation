reference: Ezekiel 18:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַה לָּ/כֶ֗ם אַתֶּם֙ מֹֽשְׁלִים֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אָבוֹת֙ יֹ֣אכְלוּ בֹ֔סֶר וְ/שִׁנֵּ֥י הַ/בָּנִ֖ים תִּקְהֶֽינָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/002.yaml
  text: What do you mean, that you keep repeating this proverb in the land of Israel[a], saying, ‘The fathers eat sour grapes, and the children’s teeth are set on edge’?”
translation:
  language: de
  text: 'Was soll das, dass ihr immer wieder dieses Sprichwort über das Land Israel gebraucht: »Die Väter essen unreife Trauben, und den Kindern werden die Zähne stumpf[a]«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und den Kindern werden die Zähne pelzig«; das hebräische Verb bedeutet wörtlich »stumpf werden« beziehungsweise »abstumpfen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּכֶם
  choice: Was soll das
  rationale: Die hebräische Wendung ist eine tadelnde, herausfordernde Frage. »Was soll das« gibt diesen Ton in natürlichem modernem Deutsch wieder.
- source_word: מֹשְׁלִים
  choice: immer wieder ... gebraucht
  rationale: Das Partizip bezeichnet hier ein fortdauerndes oder wiederholtes Verwenden eines Sprichworts; »immer wieder« macht diesen Aspekt deutlich.
- source_word: הַמָּשָׁל הַזֶּה
  choice: dieses Sprichwort
  rationale: מָשָׁל bezeichnet hier einen sprichwörtlichen Ausspruch, keine erzählende Parabel.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: im Land Israel
  rationale: Obwohl עַל auch »über/betreffend« bedeuten kann und אֲדָמָה wörtlich »Erdboden« heißt, bezeichnet die Wendung hier am natürlichsten den Ort, an dem das Sprichwort im Umlauf ist.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Die deutsche Zeichensetzung leitet den Inhalt des zitierten Sprichworts natürlich ein, ohne ein schwerfälliges zusätzliches »indem ihr sagt«.
- source_word: אָבוֹת
  choice: die Väter
  rationale: Die ausdrücklich männliche Bezeichnung wird quellentreu als »Väter« wiedergegeben.
- source_word: יֹאכְלוּ בֹסֶר
  choice: essen unreife Trauben
  rationale: בֹסֶר bezeichnet unreife und daher saure Trauben. »Unreife Trauben« benennt die konkrete Bedeutung präzise; der deutsche Präsenssatz bewahrt den allgemeinen Charakter des Sprichworts.
- source_word: שִׁנֵּי הַבָּנִים
  choice: den Kindern ... die Zähne
  rationale: בָּנִים kann im Gegensatz zur Vätergeneration die Nachkommen insgesamt bezeichnen. Die deutsche Dativkonstruktion ist idiomatisch.
- source_word: תִּקְהֶינָה
  choice: werden ... stumpf
  rationale: Das Verb beschreibt, dass die Zähne durch die sauren Trauben stumpf beziehungsweise empfindlich werden. Die Formulierung bleibt bildhaft und verständlich.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnungen im Sprichwort
  choice: »Väter« beibehalten, בָּנִים jedoch als »Kinder« wiedergeben
  alternative: »Die Väter essen unreife Trauben, und den Söhnen werden die Zähne stumpf.«
  rationale: אָבוֹת nennt ausdrücklich die Väter. בָּנִים steht hier dagegen repräsentativ für die nachfolgende Generation; »Kinder« verhindert die unbeabsichtigte Aussage, nur männliche Nachkommen seien betroffen.
- issue: Bezug von עַל אַדְמַת יִשְׂרָאֵל
  choice: 'örtlich: »im Land Israel«'
  alternative: 'inhaltlich: »über das Land Israel«'
  rationale: Beide Bezüge sind sprachlich möglich. Im Zusammenhang richtet sich der Vorwurf jedoch am ehesten gegen ein im Land gebrauchtes Sprichwort; die Übersetzung wahrt die kontextuell stärkere Lesart, während die Alternative dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlich tadelndem Frageton. Das überlieferte Bild bleibt erhalten; »immer wieder« gibt den fortdauernden Gebrauch des Sprichworts wieder.
