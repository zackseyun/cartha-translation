  text: בְּ/חֻקּוֹתַ֧/י יְהַלֵּ֛ךְ וּ/מִשְׁפָּטַ֥/י שָׁמַ֖ר לַ/עֲשׂ֣וֹת אֱמֶ֑ת צַדִּ֥יק הוּא֙ חָיֹ֣ה יִֽחְיֶ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/009.yaml
  text: He walks in my statutes and keeps my judgments[a], acting faithfully; he is righteous; he shall surely live, declares the Lord GOD.
translation:
  language: de
  text: Er richtet sein Leben nach meinen Satzungen und hält meine Rechtsbestimmungen, indem er treu handelt.[a] Er ist gerecht; er wird ganz gewiss leben – Ausspruch des Herrn Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um Wahrheit zu tun“; gemeint ist, wahrhaftig oder treu zu handeln.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise und macht das Bedeutungsspektrum von אֱמֶת sichtbar.
lexical_decisions:
- source_word: בְּחֻקּוֹתַי יְהַלֵּךְ
  choice: Er richtet sein Leben nach meinen Satzungen
  rationale: הלך bezeichnet hier bildhaft die Lebensführung. Die natürliche deutsche Wendung gibt das Idiom verständlich wieder; „Satzungen“ bewahrt den Charakter verbindlicher göttlicher Vorschriften.
- source_word: וּמִשְׁפָּטַי שָׁמַר
  choice: und hält meine Rechtsbestimmungen
  rationale: שׁמר bedeutet im rechtlichen Zusammenhang „halten, beachten“. מִשְׁפָּטַי bezeichnet Gottes verbindliche Rechtsordnungen; „Rechtsbestimmungen“ bewahrt den juridischen Klang.
- source_word: לַעֲשׂוֹת אֱמֶת
  choice: indem er treu handelt
  rationale: Wörtlich steht „Wahrheit/Treue tun“. אֱמֶת bezeichnet hier verlässliches, wahrhaftiges beziehungsweise treues Handeln. Die modale Wiedergabe passt syntaktisch und bleibt im Deutschen natürlich.
- source_word: צַדִּיק הוּא
  choice: Er ist gerecht
  rationale: צַדִּיק bezeichnet den im ethisch-rechtlichen Sinn Gerechten. Die knappe Aussage erhält das Urteil des hebräischen Textes.
- source_word: חָיֹה יִחְיֶה
  choice: er wird ganz gewiss leben
  rationale: Der Infinitivus absolutus vor dem finiten Verb verstärkt die Zusage. „Ganz gewiss“ bildet diese emphatische Konstruktion deutlich und idiomatisch ab.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: נְאֻם kennzeichnet eine feierliche göttliche Erklärung. „Herr Yahweh“ unterscheidet אֲדֹנָי vom als Eigennamen wiedergegebenen Tetragramm.
theological_decisions:
- issue: Bedeutung der Lebenszusage חָיֹה יִחְיֶה
  choice: er wird ganz gewiss leben
  alternative: er wird ganz gewiss am Leben bleiben
  rationale: Die Übersetzung lässt den Umfang von „leben“ offen und legt nicht fest, ob ausschließlich das gegenwärtige leibliche Leben oder eine weiterreichende Lebenszusage gemeint ist.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die Wiedergabe erhält sowohl den Herrschaftstitel אֲדֹנָי als auch den offenbarten Eigennamen יהוה, ohne beide durch denselben deutschen Titel zu verschmelzen.
- issue: Verhältnis von gerechtem Handeln und Gottes Lebenszusage
  choice: Die Satzfolge des Hebräischen bleibt ohne erklärenden Zusatz erhalten.
  alternative: Eine ausdrückliche kausale Verbindung wie „deshalb wird er leben“
  rationale: Der Text stellt gerechte Lebensführung, das Urteil „gerecht“ und die Lebenszusage nebeneinander, formuliert hier aber keine ausgearbeitete Lehre über Verdienst, Gnade oder ewiges Leben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der hebräische Wandel-Metapher wird zugunsten einer für heutige Leser natürlichen Wendung aufgelöst. Der Gedankenstrich hebt die feierliche Schlussformel ab; der Gottesname wird als „Yahweh“ wiedergegeben.
