source:
  edition: WLC
  text: וְ/הִנֵּה֙ הוֹלִ֣יד בֵּ֔ן וַ/יַּ֕רְא אֶת כָּל חַטֹּ֥את אָבִ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּרְאֶ֕ה וְ/לֹ֥א יַעֲשֶׂ֖ה כָּ/הֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/014.yaml
  text: But behold[a], he fathers a son, and he sees all the sins that his father has done; he sees them[b], and he does not do likewise.
translation:
  language: de
  text: 'Doch sieh: er zeugt einen Sohn. Dieser sieht alle Sünden, die sein Vater begangen hat; er sieht sie[a] und handelt nicht ebenso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische wiederholt zur Hervorhebung „er sieht“: „Dieser sieht …; er sieht und handelt nicht ebenso.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Doch sieh
  rationale: Leitet anschaulich einen kontrastierenden neuen Fall ein. „Doch“ markiert den Gegensatz, „sieh“ bewahrt die hinweisende Kraft von הִנֵּה in modernem Deutsch.
- source_word: הוֹלִיד בֵּן
  choice: er zeugt einen Sohn
  rationale: Der Hifil von ילד bezeichnet hier das Zeugen eines Kindes. „Zeugt“ ist im Deutschen präzise, verständlich und idiomatischer als eine Umschreibung mit „wird Vater“.
- source_word: וַיַּרְא ... וַיִּרְאֶה
  choice: Dieser sieht ...; er sieht sie
  rationale: Das Präsens passt zum beispielhaften Fall und erhält dessen Anschaulichkeit. Die auffällige Wiederholung von ראה bleibt als Hervorhebung erhalten.
- source_word: כָּל חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה
  choice: alle Sünden, die sein Vater begangen hat
  rationale: חַטֹּאת ist hier pluralisch zu verstehen. „Sünden begehen“ gibt den konkreten moralischen Vollzug natürlich wieder und ordnet den Relativsatz eindeutig dem Vater zu.
- source_word: וְלֹא יַעֲשֶׂה כָּהֵן
  choice: und handelt nicht ebenso
  rationale: כָּהֵן verweist vergleichend auf das zuvor beschriebene sündige Tun. „Handelt nicht ebenso“ gibt diesen Rückbezug knapp und natürlich wieder.
theological_decisions:
- issue: Individuelle moralische Verantwortung im Beispielfall
  choice: Der Sohn nimmt die Sünden seines Vaters wahr, ahmt dessen Verhalten aber nicht nach.
  alternative: Der Sohn trägt ungeachtet seines abweichenden Handelns die Schuld des Vaters.
  rationale: Der Satz stellt dem sündigen Tun des Vaters ausdrücklich das andere Handeln des Sohnes gegenüber. Die Übersetzung wahrt diesen Kontrast, ohne weitergehende Lehrfolgerungen in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel von „er“ zu „Dieser“ macht ohne inhaltliche Ergänzung klar, dass nach der Zeugung der Sohn das Subjekt der folgenden Verben ist. Die Wiederholung des Sehens und die argumentative Spannung des hebräischen Textes bleiben erhalten.
