source:
  edition: WLC
  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם יִֽהְיֶ֨ה לָ/כֶ֜ם ע֗וֹד מְשֹׁ֛ל הַ/מָּשָׁ֥ל הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/003.yaml
  text: As I live[a], declares the Lord GOD[b], this proverb shall no longer be used by you in Israel.
translation:
  language: de
  text: 'So wahr ich lebe,[a] spricht der Herr Yahweh: Ihr werdet dieses Sprichwort in Israel nicht länger gebrauchen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die hebräische Schwurformel: »Wenn dieses Sprichwort bei euch in Israel noch gebraucht werden wird …«; gemeint ist nachdrücklich: Es wird gewiss nicht länger gebraucht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Die hebräische Schwurformel wird im Deutschen mit ihrer feierlichen und bekräftigenden Kraft natürlich wiedergegeben.
- source_word: נְאֻם
  choice: spricht
  rationale: Die feste prophetische Formel bezeichnet eine autoritative göttliche Äußerung; »spricht« ist im Deutschen würdig und geläufig.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Wiedergabe unterscheidet אֲדֹנָי als Titel von יהוה als Gottes Eigenname und vermeidet die missverständliche Verdoppelung »Herr HERR«.
- source_word: אִם יִהְיֶה ... עוֹד
  choice: nicht länger
  rationale: אִם steht innerhalb der Schwurformel elliptisch und trägt den Sinn einer nachdrücklichen Verneinung; עוֹד bezeichnet hier das künftige Fortbestehen des Gebrauchs.
- source_word: לָכֶם
  choice: ihr sollt ... gebrauchen
  rationale: Das Dativpronomen bezeichnet hier die angesprochenen Israeliten als diejenigen, bei denen beziehungsweise durch die das Sprichwort weiter im Gebrauch wäre.
- source_word: מְשֹׁל הַמָּשָׁל הַזֶּה
  choice: dieses Sprichwort ... gebrauchen
  rationale: Der Infinitiv von משל bezeichnet das Anführen oder Verwenden eines Sprichworts; die deutsche Verbindung bewahrt diese Bedeutung idiomatisch.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präpositionalphrase bezeichnet den gesellschaftlichen und räumlichen Bereich, in dem das Sprichwort umläuft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: »Yahweh« macht den im Ausgangstext stehenden Eigennamen sichtbar, während »Herr« den vorausgehenden Titel אֲדֹנָי wiedergibt. Damit bleibt die Unterscheidung beider Elemente erhalten.
- issue: Aussageform des Schwurs
  choice: direkte, nachdrückliche Verneinung
  alternative: 'wörtliche Bedingungsform: »Wenn dieses Sprichwort euch noch ... sein wird«'
  rationale: Die mit אִם gebildete Schwurformel enthält eine konventionell ausgelassene Strafandrohung und bedeutet in diesem Zusammenhang »gewiss nicht«. Die Übersetzung gibt den tatsächlichen Aussagegehalt wieder, ohne eine zusätzliche Sanktion einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die feierliche Schwurformel am Anfang; »Sprichwort gebrauchen« ist allgemein verständlich und bildet den hebräischen Gebrauchsausdruck präzise ab.
