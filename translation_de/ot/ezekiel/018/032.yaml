  text: כִּ֣י לֹ֤א אֶחְפֹּץ֙ בְּ/מ֣וֹת הַ/מֵּ֔ת נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָשִׁ֖יבוּ וִֽ/חְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/032.yaml
  text: For I take no pleasure in the death of the one who dies[a], declares the Lord GOD[c][b]. Therefore turn back and live.
translation:
  language: de
  text: Denn ich habe kein Gefallen am Tod dessen, der stirbt[a] – Ausspruch Yahwehs, des Herrn[b]. Kehrt darum um und lebt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „am Tod des Sterbenden“ oder „am Sterben dessen, der stirbt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch אֲדֹנָי יְהוִה (Adonaj JHWH); traditionell auch: „Gott, der HERR“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet den vorausgehenden Aufruf und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: לֹא אֶחְפֹּץ
  choice: ich habe kein Gefallen
  rationale: חפץ bezeichnet Gefallen, Freude oder Verlangen. „Kein Gefallen haben“ passt zur Verbindung mit בְּ und bewahrt die Aussage über Gottes Haltung, ohne sie auf bloßes Wollen zu verengen.
- source_word: בְּמוֹת הַמֵּת
  choice: am Tod dessen, der stirbt
  rationale: Die Formulierung gibt sowohl מוֹת („Tod/Sterben“) als auch das substantivierte Partizip הַמֵּת („der Sterbende/der stirbt“) wieder. Sie vermeidet die kontextuelle, aber im Vers nicht ausdrücklich vorhandene Ergänzung „des Gottlosen“.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Die feste prophetische Formel wird knapp und feierlich wiedergegeben; „Ausspruch“ wahrt ihren Orakelcharakter besser als ein neutrales „sagt“.
- source_word: אֲדֹנָי יְהוִה
  choice: des Herrn Yahweh
  rationale: 'Beide Bestandteile des Gottesnamens werden sichtbar wiedergegeben: אֲדֹנָי als „Herr“ und das Tetragramm als „Yahweh“.'
- source_word: וְהָשִׁיבוּ
  choice: Kehrt also um
  rationale: שוב bezeichnet die Umkehr oder Rückkehr. „Umkehren“ bewahrt das konkrete Bild und trägt im Kontext zugleich den ethischen Ruf zur Abkehr vom Unrecht. „Also“ verdeutlicht die folgernde Verbindung.
- source_word: וִחְיוּ
  choice: und lebt
  rationale: Die knappe koordinierte Aufforderung des Hebräischen bleibt erhalten; der Imperativ kann sowohl als Aufruf als auch als verheißene Folge der Umkehr gehört werden.
theological_decisions:
- issue: Gegenstand von Gottes Missfallen
  choice: am Tod dessen, der stirbt
  alternative: am Tod des Gottlosen
  rationale: Der Zusammenhang handelt vom Gottlosen, der hebräische Wortlaut dieses Verses nennt jedoch ausdrücklich nur „den, der stirbt“. Die Übersetzung übernimmt daher nicht stillschweigend die kontextuelle Deutung und erhält die größere Aussageweite.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form macht den im Hebräischen stehenden Bundesnamen erkennbar und übersetzt zugleich אֲדֹנָי. Die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Verhältnis von Umkehr und Leben
  choice: Kehrt also um und lebt!
  alternative: Kehrt um, damit ihr lebt!
  rationale: Die parataktische Form wahrt die zwei hebräischen Aufforderungsformen und lässt offen, ob „lebt“ vor allem als Befehl, Einladung oder verheißene Folge zu hören ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel „Ausspruch des Herrn Yahweh“ hält den feierlichen Ton; der abschließende kurze Imperativ bleibt eindringlich. Der Gedankenstrich trennt die eingeschobene Botenformel lesefreundlich vom Hauptsatz.
