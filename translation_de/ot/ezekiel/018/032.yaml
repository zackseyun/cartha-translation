  naturalness: „Ausspruch des Herrn Yahweh“ ist als deutsche Nominalgruppe unnötig sperrig und kann wie ein unanalysierter zusammengesetzter Eigenname wirken. „Ausspruch Yahwehs, des Herrn“ ist modernes, würdevolles Deutsch und macht zugleich beide hebräischen Bestandteile klar erkennbar.
  terminology: „Yahweh“ gibt יהוה entsprechend wieder; „des Herrn“ gibt אֲדֹנָי wieder, ohne einen Bestandteil auszulassen. „Kehrt darum um und lebt!“ bewahrt die knappe koordinierte Aufforderung und ihre folgernde Funktion.
