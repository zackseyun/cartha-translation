  text: וְ/אִישׁ֙ לֹ֣א הוֹנָ֔ה חֲבֹל֙ לֹ֣א חָבָ֔ל וּ/גְזֵלָ֖ה לֹ֣א גָזָ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב נָתָ֔ן וְ/עֵר֖וֹם כִּסָּה בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/016.yaml
  text: He has not oppressed anyone[a], has not taken a pledge, and has not robbed[b]; he has given his bread to the hungry and covered the naked with a garment.
translation:
  language: de
  text: Er hat niemanden unterdrückt, kein Pfand genommen und keinen Raub begangen; sein Brot hat er dem Hungrigen gegeben und den Nackten mit einem Gewand bedeckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ לֹא הוֹנָה
  choice: Er hat niemanden unterdrückt
  rationale: אִישׁ steht im verneinten Satz generisch; „niemanden“ gibt dies im Deutschen natürlich wieder. הוֹנָה bezeichnet hier soziales Unterdrücken oder Misshandeln.
- source_word: חֲבֹל לֹא חָבָל
  choice: kein Pfand genommen
  rationale: Die figura etymologica aus Nomen und Verb bezeichnet das Nehmen eines Pfandes bzw. einer Sicherheit von einem Schuldner. Die knappe Formulierung bewahrt den rechtlich-wirtschaftlichen Sinn.
- source_word: וּגְזֵלָה לֹא גָזָל
  choice: keinen Raub begangen
  rationale: Die Verbindung aus גְזֵלָה und גָזָל bezeichnet Raub beziehungsweise widerrechtliches gewaltsames Aneignen. „Raub begangen“ bildet auch die verstärkende Nomen-Verb-Verbindung erkennbar ab.
- source_word: לַחְמוֹ
  choice: sein Brot
  rationale: Die konkrete Bedeutung „Brot“ und das Possessivsuffix werden beibehalten; gemeint sein kann zugleich Nahrung im weiteren Sinn.
- source_word: לְרָעֵב
  choice: dem Hungrigen
  rationale: Das substantivierte Adjektiv bezeichnet einen hungrigen Menschen; der deutsche Singular entspricht der exemplarischen Ausdrucksweise des Hebräischen.
- source_word: וְעֵרוֹם כִּסָּה בָגֶד
  choice: und den Nackten mit einem Gewand bedeckt
  rationale: Die Wiedergabe erhält die konkrete Bildsprache von „bedecken“ und „Gewand“, statt sie zum bloßen „kleiden“ zu verdichten.
