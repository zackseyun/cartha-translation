  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Aussagen des Hebräischen zuverlässig wieder: niemanden unterdrücken, kein Pfand nehmen, keinen Raub begehen, dem Hungrigen eigenes Brot geben und den Nackten mit einem Gewand bedecken. Die generische Bedeutung von אִישׁ ist mit „niemanden“ idiomatisch getroffen.'
