base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/030.yaml
  text: Therefore I will judge each man according to his ways[a], O house of Israel, declares the Lord GOD. Repent and turn away from all your transgressions, so that iniquity may not become a stumbling block to you.
translation:
  language: de
  text: Darum werde ich jeden von euch nach seinen Wegen richten, Haus Israel, spricht Gott, der HERR. Kehrt um und wendet euch von allen euren Vergehen ab, damit euch die Schuld nicht zum Stolperstein wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit eure Schuld euch nicht zum Verderben wird“. Die knappe hebräische Wendung kann entweder die Schuld selbst als Stolperstein oder die durch sie herbeigeführte Vernichtung hervorheben.'
    reason: lexikalische Alternative und echte syntaktisch-semantische Mehrdeutigkeit
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Darlegung knapp und natürlich.
- source_word: אִישׁ כִּדְרָכָיו
  choice: jeden nach seinen Wegen
  rationale: Gibt den distributiven Sinn von אִישׁ wieder und bewahrt mit „Wegen“ das wiederkehrende hebräische Bild für die Lebensführung.
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: werde ich euch … richten
  rationale: שׁפט ist hier forensisch gebraucht; „richten“ wahrt den direkten Gerichtscharakter.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Bewahrt die feste prophetische Anrede; die Stellung nach „euch“ macht den Vokativ im Deutschen klar.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: so spricht GOTT, der Herr
  rationale: Gibt die prophetische Botenformel idiomatisch wieder und unterscheidet zugleich die beiden Bestandteile des Gottesnamens beziehungsweise Herrschertitels.
- source_word: שׁוּבוּ וְהָשִׁיבוּ
  choice: Kehrt um und wendet euch ab
  rationale: Erhält die zweifache Aufforderung und das gemeinsame Bild der Richtungsänderung, ohne im Deutschen schwerfällig zu wiederholen.
- source_word: מִכָּל פִּשְׁעֵיכֶם
  choice: von all euren Vergehen
  rationale: „Vergehen“ ist verständlich und trägt den Sinn schuldhafter Übertretung; „all“ bewahrt die umfassende Forderung.
- source_word: וְלֹא יִהְיֶה לָכֶם לְמִכְשׁוֹל עָוֺן
  choice: damit euch die Schuld nicht zum Fallstrick wird
  rationale: Die Zweck- beziehungsweise Folgebeziehung wird natürlich ausgedrückt. „Schuld“ und „Fallstrick“ halten die knappe hebräische Formulierung sichtbar, ohne ihre Mehrdeutigkeit vorschnell aufzulösen.
theological_decisions:
- issue: Individuelle Verantwortung innerhalb der gemeinschaftlichen Anrede
  choice: euch … jeden nach seinen Wegen richten
  alternative: jeden von euch nach seinem Verhalten richten
  rationale: Die Formulierung hält sowohl die Anrede an das ganze Haus Israel als auch die ausdrücklich distributive Beurteilung jedes Einzelnen fest.
- issue: Bedeutung von עָוֺן und מִכְשׁוֹל im Schlusssatz
  choice: damit euch die Schuld nicht zum Fallstrick wird
  alternative: damit eure Schuld euch nicht zum Verderben wird
  rationale: עָוֺן kann Schuld, Verfehlung oder deren Folge bezeichnen; מִכְשׁוֹל kann den Stolperstein beziehungsweise den daraus folgenden Sturz oder Untergang hervorheben. Der Haupttext bewahrt das Bild, die Fußnote nennt die mögliche Ergebnisbedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kehrt um“ ist geläufig und verständlich; „Fallstrick“ bewahrt das konkrete Bild, ohne insgesamt einen altertümlichen Ton zu erzeugen. Die Gedankenstrichkonstruktion hebt die prophetische Redeeinleitung natürlich ab.
