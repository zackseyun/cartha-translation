  terminology: »Recht und Gerechtigkeit«, »Satzungen«, »beachtet« und »ausgeführt« sind für die hebräischen Rechts- und Gehorsamsbegriffe treffend. Die Fußnote wird leicht gestrafft, damit die alternative Wiedergabe nicht irreführend als stärker wörtlich als die Hauptfassung erscheint.
