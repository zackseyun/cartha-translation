base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/019.yaml
  text: Yet you say[a], ‘Why does the son not bear the iniquity of the father?’ Because the son has done justice and righteousness, has kept all my statutes, and has done them; he shall surely live.
translation:
  language: de
  text: 'Doch ihr fragt: »Warum trägt der Sohn nicht die Schuld des Vaters?«[a] Weil der Sohn Recht und Gerechtigkeit geübt, alle meine Satzungen beachtet und sie ausgeführt hat, wird er ganz gewiss leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Verfehlung des Vaters“. Die hebräische Wendung „Schuld tragen“ kann sowohl die Schuld selbst als auch deren Folgen beziehungsweise Strafe einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Doch ihr fragt
  rationale: Die Konjunktion mit dem Perfekt der 2. Person Plural führt den Einwand der Angeredeten ein. „Doch“ gibt den adversativen Zusammenhang wieder; „fragt“ entspricht im Deutschen natürlich der folgenden direkten Frage.
- source_word: לֹא נָשָׂא ... בַּעֲוֺן הָאָב
  choice: trägt ... nicht die Schuld des Vaters
  rationale: נשׂא עון ist eine feste Wendung für das Tragen von Schuld samt möglichen Folgen. „Schuld tragen“ ist im modernen Deutschen idiomatisch und bewahrt die Offenheit zwischen Schuld und Strafwirkung; die Fußnote erläutert dies.
- source_word: מִשְׁפָּט וּצְדָקָה עָשָׂה
  choice: Recht und Gerechtigkeit geübt
  rationale: Die feste Wortverbindung bleibt als Paar erhalten. „geübt“ bezeichnet hier natürlich ein entsprechendes Handeln und vermeidet das schwerfällige „getan“.
- source_word: חֻקּוֹתַי שָׁמַר
  choice: alle meine Satzungen beachtet
  rationale: חֻקּוֹת bezeichnet verbindliche göttliche Bestimmungen; „Satzungen“ wahrt den rechtlich-bundestheologischen Klang. שמר bedeutet in diesem Zusammenhang „beachten/befolgen“.
- source_word: וַיַּעֲשֶׂה אֹתָם
  choice: und sie ausgeführt hat
  rationale: Die Formulierung bewahrt die hebräische Betonung, dass die Satzungen nicht nur beachtet, sondern tatsächlich umgesetzt wurden.
- source_word: חָיֹה יִחְיֶה
  choice: soll er ganz gewiss leben
  rationale: Infinitivus absolutus und Imperfekt verstärken die Zusage. „ganz gewiss“ gibt diese Emphase in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von „die Schuld des Vaters tragen“
  choice: Die deutsche Wendung „die Schuld des Vaters tragen“ wird beibehalten und durch eine Fußnote als semantisch offen erläutert.
  alternative: „die Strafe für die Schuld des Vaters tragen“
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Strafwirkungen bezeichnen. Der Kontext betont persönliche Verantwortlichkeit, legt aber nicht eindeutig fest, welcher Aspekt der Wendung im Vordergrund steht.
- issue: Logischer Anschluss der Begründung
  choice: „Weil der Sohn ...“
  alternative: „Der Sohn aber ...“
  rationale: Der zweite Satzteil begründet, weshalb der Sohn die Schuld des Vaters nicht trägt. „Weil“ macht diese im hebräischen Zusammenhang erkennbare Erklärungsfunktion deutlich, ohne eine zusätzliche Lehraussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die Vater-Sohn-Gegenüberstellung bleiben erhalten. Rechtssprachliche Begriffe wie „Satzungen“ sichern den Charakter des Abschnitts, während „beachtet“ und „ausgeführt“ für heutige Leser verständlich bleiben.
