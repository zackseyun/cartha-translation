source:
  edition: WLC
  text: וְ/הוֹלִ֥יד בֵּן פָּרִ֖יץ שֹׁפֵ֣ךְ דָּ֑ם וְ/עָ֣שָׂה אָ֔ח מֵ/אַחַ֖ד מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/010.yaml
  text: But if he fathers a violent son[a], one who sheds blood and does any one of these things,
translation:
  language: de
  text: Wenn er aber einen gewalttätigen Sohn zeugt, der Blut vergießt und einem Bruder auch nur eines von diesen Dingen antut[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schlusswendung ist schwer verständlich. Andere verstehen sie: „und irgendeines von diesen Dingen tut“.'
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: וְהוֹלִיד
  choice: Wenn er aber … zeugt
  rationale: 'Das Hifil von ילד bedeutet „zeugen“. Die konditionale und kontrastierende Wiedergabe ergibt sich aus dem Zusammenhang: Dem zuvor beschriebenen gerechten Mann wird nun der Fall eines gewalttätigen Sohnes gegenübergestellt.'
- source_word: בֵּן
  choice: einen … Sohn
  rationale: בן bezeichnet hier ausdrücklich einen Sohn und nicht allgemein ein Kind.
- source_word: פָּרִיץ
  choice: gewalttätigen
  rationale: פריץ bezeichnet einen gewalttätigen, brutalen oder gesetzlosen Menschen. „Gewalttätig“ passt unmittelbar zur folgenden Aussage über das Blutvergießen.
- source_word: שֹׁפֵךְ דָּם
  choice: der Blut vergießt
  rationale: Die partizipiale Wendung wird idiomatisch und zugleich quellennah wiedergegeben, ohne sie auf einen engeren juristischen Mordbegriff festzulegen.
- source_word: וְעָשָׂה
  choice: und … antut
  rationale: עשה bedeutet grundsätzlich „tun“. Mit der als betroffenem Objekt verstandenen Angabe אָח ist „jemandem etwas antun“ im Deutschen natürlich.
- source_word: אָח
  choice: einem Bruder
  rationale: Die masoretische Vokalisierung אָח bedeutet „Bruder“. Obwohl der Satzbau schwierig ist, wird dieses im WLC bezeugte Wort im Haupttext nicht ausgelassen.
- source_word: מֵאַחַד מֵאֵלֶּה
  choice: auch nur eines von diesen Dingen
  rationale: Die Wendung bezeichnet eines aus der Gruppe der zuvor genannten Vergehen; „auch nur“ bringt die einzelne Auswahl idiomatisch zum Ausdruck.
theological_decisions:
- issue: Konditionale und adversative Funktion der einleitenden Konjunktion
  choice: Wenn er aber
  alternative: Und er zeugt
  rationale: Das hebräische וְ ist formal eine Konjunktion, führt im Zusammenhang jedoch den kontrastierenden hypothetischen Fall ein. Die Wiedergabe macht den Gedankengang deutlich, ohne eine theologische Folgerung hinzuzufügen.
- issue: Deutung der schwierigen Schlusswendung אָח מֵאַחַד מֵאֵלֶּה
  choice: einem Bruder auch nur eines von diesen Dingen antut
  alternative: irgendeines von diesen Dingen tut
  rationale: Der Haupttext bewahrt die masoretische Lesung אָח („Bruder“). Da Syntax und Textverständnis umstritten sind und manche Übersetzungen אָח nicht eigenständig wiedergeben, wird die alternative Auffassung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeugt“ wahrt den männlich-spezifischen Sinn, während der Relativsatz den langen hebräischen Satz natürlich gliedert. Die Interpunktion lässt erkennen, dass der Gedanke im folgenden Vers weitergeführt wird.
