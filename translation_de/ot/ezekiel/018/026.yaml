  text: בְּ/שׁוּב צַדִּ֧יק מִ/צִּדְקָת֛/וֹ וְ/עָ֥שָׂה עָ֖וֶל וּ/מֵ֣ת עֲלֵי/הֶ֑ם בְּ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/026.yaml
  text: When a righteous man turns away from his righteousness and does injustice[a], and dies because of them[b], he shall die for the injustice that he has done.
translation:
  language: de
  text: Wenn ein Gerechter sich von seiner Gerechtigkeit abwendet und Unrecht tut[a] und ihretwegen stirbt[b], dann stirbt er wegen des Unrechts, das er getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Böses tut“ bzw. „Ungerechtigkeit begeht“. Das hebräische Wort kann Unrecht, Ungerechtigkeit oder verwerfliches Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihretwegen“; im Hebräischen steht ein Pluralpronomen. Es kann sich auf die zuvor genannten Verfehlungen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Wenn ... sich ... abwendet
  rationale: ב mit dem Infinitiv von שׁוב leitet hier einen temporalen Bedingungsfall ein; zusammen mit מִן bezeichnet שׁוב das Abwenden von einem bisherigen Zustand.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet die einzelne Person des Fallbeispiels. „Ein Gerechter“ ist knapp, würdig und entspricht der grammatischen Form.
- source_word: מִצִּדְקָתוֹ
  choice: von seiner Gerechtigkeit
  rationale: צְדָקָה bezeichnet hier ethische Gerechtigkeit beziehungsweise gerechtes Verhalten. Die direkte Wiedergabe bewahrt zudem den bewussten Gegensatz zum folgenden Unrecht.
- source_word: וְעָשָׂה עָוֶל
  choice: und Unrecht tut
  rationale: עָוֶל umfasst Unrecht, Ungerechtigkeit und verwerfliches Handeln. „Unrecht tun“ bildet die hebräische Verbindung natürlich und ohne altertümliche Sprache ab.
- source_word: וּמֵת עֲלֵיהֶם
  choice: und deswegen stirbt
  rationale: עֲלֵיהֶם hat hier kausale Bedeutung. Das deutsche „deswegen“ verweist idiomatisch auf die zuvor genannte Abwendung und das Unrechttun; eine wörtliche Pluralform wäre im Deutschen missverständlich.
- source_word: בְּעַוְלוֹ אֲשֶׁר עָשָׂה יָמוּת
  choice: dann stirbt er wegen des Unrechts, das er getan hat
  rationale: Das zweite ב wird kausal wiedergegeben. Das Imperfekt יָמוּת formuliert die sichere Folge des geschilderten Handelns; im Deutschen drückt das Präsens diese allgemeine Rechts- und Lebensregel natürlich aus.
theological_decisions:
- issue: Ob die Aussage spätere Lehrdebatten über Abfall oder Beharren entscheiden soll
  choice: Die Warnung wird als tatsächlicher moralischer Bedingungsfall übersetzt, ohne eine weitergehende systematisch-theologische Folgerung einzutragen.
  alternative: Die Formulierung ausdrücklich als endgültigen Glaubensabfall deuten oder die Wirklichkeit des Abwendens abschwächen.
  rationale: Der hebräische Text beschreibt einen Gerechten, der sich von seiner Gerechtigkeit abwendet, Unrecht tut und aufgrund dessen stirbt. Weitergehende Fragen werden im Vers nicht entschieden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „Gerechtigkeit“ und „Unrecht“ bewahrt den ethischen Kontrast des hebräischen Textes; „dann“ macht die Folgestruktur im Deutschen deutlich.
