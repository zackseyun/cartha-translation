  text: וּ/בְ/שׁ֣וּב רָשָׁ֗ע מֵֽ/רִשְׁעָת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יַּ֥עַשׂ מִשְׁפָּ֖ט וּ/צְדָקָ֑ה ה֖וּא אֶת נַפְשׁ֥/וֹ יְחַיֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/027.yaml
  text: And when a wicked man turns away from the wickedness that he has done and does justice and righteousness[a], he will preserve his life.
translation:
  language: de
  text: Wenn aber ein Gottloser von dem gottlosen Tun umkehrt, das er begangen hat, und Recht und Gerechtigkeit übt, wird er sein Leben bewahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird sich selbst am Leben erhalten“; wörtlich lässt sich der hebräische Ausdruck auch mit „wird seine Seele am Leben erhalten“ wiedergeben. Das Wort néfesch kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: Wenn aber ... umkehrt
  rationale: Die Verbindung aus Konjunktion, Präposition und Infinitivus constructus bezeichnet hier den zeitlich-bedingenden Umstand. „Wenn aber“ stellt natürlich den Kontrast zum vorausgehenden Fall her; „umkehrt“ gibt שוב im Sinn einer Abkehr vom bisherigen Verhalten wieder.
- source_word: רָשָׁע
  choice: ein Gottloser
  rationale: Das substantivierte maskuline Adjektiv bezeichnet den einzelnen Menschen, dessen Handeln als böse beziehungsweise schuldig gilt. „Ein Gottloser“ bewahrt die repräsentative Einzahl und den gewichtigen ethisch-religiösen Ton.
- source_word: מֵרִשְׁעָתוֹ אֲשֶׁר עָשָׂה
  choice: von dem gottlosen Tun, das er begangen hat
  rationale: רִשְׁעָה bezeichnet Bosheit, Schuld oder gottloses Verhalten. Da die Relativkonstruktion wörtlich von der „Gottlosigkeit, die er getan hat“ spricht, ist „gottloses Tun“ im Deutschen idiomatisch und wahrt den Bezug auf konkrete frühere Taten.
- source_word: וַיַּעַשׂ
  choice: und ... übt
  rationale: עשה bedeutet grundsätzlich „tun“. Mit den abstrakten Objekten „Recht und Gerechtigkeit“ ist „üben“ eine natürliche deutsche Verbindung und bezeichnet hier eine gelebte Praxis.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  rationale: Die feste Wortverbindung wird mit zwei unterscheidbaren Begriffen wiedergegeben. מִשְׁפָּט bezeichnet hier rechtmäßiges beziehungsweise gerechtes Handeln, צְדָקָה normgerechtes, rechtes Verhalten.
- source_word: הוּא אֶת־נַפְשׁוֹ יְחַיֶּה
  choice: wird er sein Leben bewahren
  rationale: נֶפֶשׁ meint im Zusammenhang des Gegensatzes von Leben und Tod vor allem das Leben beziehungsweise die eigene Person. Das Piel von חיה bedeutet hier „am Leben erhalten, bewahren“. Die deutsche Wortstellung gibt die Aussage klar wieder, auch wenn die ausdrückliche hebräische Hervorhebung durch הוּא nur begrenzt abgebildet wird.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang von Verhalten und Gericht
  choice: sein Leben
  alternative: seine Seele; sich selbst
  rationale: Das Kapitel stellt Leben und Tod als Folgen des Handelns gegenüber. „Sein Leben“ trifft daher den kontextuellen Sinn, ohne נֶפֶשׁ auf eine vom Körper getrennte Seele einzuengen. Eine Fußnote hält die im hebräischen Ausdruck vorhandene Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gottloser“ und „Gerechtigkeit“ bewahren den gewichtigen biblisch-ethischen Ton; „gottloses Tun“ vermeidet die im Deutschen unnatürliche Wendung „Gottlosigkeit tun“. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
