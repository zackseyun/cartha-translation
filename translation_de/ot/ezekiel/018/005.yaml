source:
  edition: WLC
  text: וְ/אִ֖ישׁ כִּי יִהְיֶ֣ה צַדִּ֑יק וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/005.yaml
  text: But if a man is righteous and does justice and righteousness,[a]
translation:
  language: de
  text: Wenn aber ein Mann gerecht ist und Recht und Gerechtigkeit übt,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und wenn ein Mann …« oder: »Wenn nun ein Mann …«; die hebräische Konjunktion kann sowohl eine einfache Fortsetzung als auch einen Gegensatz beziehungsweise Übergang kennzeichnen.'
    reason: Lexikalische Alternative zur Aussagefunktion von וְ.
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: wenn aber ein Mann
  rationale: אִישׁ bezeichnet hier einen einzelnen Mann als repräsentativen Fall. Das vorangestellte וְ wird als »aber« wiedergegeben, weil der Vers einen neuen bedingten Fall im Gedankengang eröffnet; eine bloße Fortsetzung mit »und« oder ein Übergang mit »nun« bleiben möglich.
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet zusammen mit dem folgenden Imperfekt eine Bedingung ein. Im Deutschen ist »wenn« dafür die natürliche Entsprechung.
- source_word: יִהְיֶה
  choice: ist
  rationale: Das Imperfekt von היה steht in einer allgemein formulierten Bedingung und wird im Deutschen idiomatisch mit dem Präsens »ist« wiedergegeben.
- source_word: צַדִּיק
  choice: gerecht
  rationale: צַדִּיק beschreibt einen Menschen als gerecht beziehungsweise rechtschaffen. »Gerecht« bewahrt den moralischen und gemeinschaftsbezogenen Sinn und nimmt zugleich die Wortverwandtschaft mit צְדָקָה auf.
- source_word: וְ/עָשָׂה
  choice: und … übt
  rationale: עשה bezeichnet mit den nachfolgenden Abstrakta das Tun oder Praktizieren. Die feste deutsche Verbindung »Recht und Gerechtigkeit üben« klingt würdig und natürlich und hält den ethischen Handlungscharakter fest.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: מִשְׁפָּט meint in dieser ethischen Paarung rechtmäßiges, gerechtes Handeln. »Recht« wahrt die Unterscheidung zum folgenden צְדָקָה und entspricht einer geläufigen biblischen Wendung.
- source_word: וּ/צְדָקָה
  choice: Gerechtigkeit
  rationale: צְדָקָה bezeichnet hier gerechtes beziehungsweise rechtschaffenes Handeln. »Gerechtigkeit« bewahrt den hebräischen Leitbegriff, ohne ihn mit מִשְׁפָּט zusammenfallen zu lassen.
theological_decisions:
- issue: Generisches Beispiel in grammatisch männlicher Einzahl
  choice: ein Mann
  alternative: jemand; ein Mensch
  rationale: Das Hebräische verwendet ausdrücklich אִישׁ in der männlichen Einzahl. »Ein Mann« bildet diese Form genau ab, während der Zusammenhang den Mann als beispielhaften Einzelfall vorstellt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geläufige Wortverbindung »Recht und Gerechtigkeit üben« erhält die beiden hebräischen Begriffe getrennt. Die Satzstellung folgt natürlichem deutschem Bedingungssatzbau.
