review_pass:
  verdict: revise
  source_fidelity: Die rhetorische Frage, die anschließende Verneinung, die emphatische passive Todesformel und die Rechtsformel zum Blut werden grundsätzlich getroffen. „Sollte er am Leben bleiben?“ schwächt jedoch die hebräische Zukunfts-/Urteilsfrage unnötig ab; „Sein Blut komme über ihn selbst“ gibt יִהְיֶה („wird sein“) nicht korrekt wieder.
  naturalness: „Gegen Zins leihen“ ist verständlich. „Aufschlag nehmen“ wirkt im heutigen Deutsch jedoch vor allem wie ein Preisaufschlag und ist im Kontext eines Darlehens weniger klar. Die vorgeschlagene Fassung ist modernes, würdiges Standarddeutsch und bewahrt den rechtlich-prophetischen Ton.
  terminology: „Zins“ und „Gewinn“ geben נֶשֶׁךְ und תַרְבִּית als unterschiedene, eng zusammengehörige Erträge aus einem Darlehen angemessen wieder. „Gräuel“ bewahrt die starke prophetische Wertung von תּוֹעֵבוֹת, ohne die spezifischere moderne Konnotation von „Gräueltaten“ einzutragen. Die passive Formulierung „wird gewiss getötet werden“ entspricht מוֹת יוּמָת besser als „muss ... getötet werden“.
  issues:
  - severity: medium
    issue: Abgeschwächte rhetorische Frage
    rationale: „Sollte er am Leben bleiben?“ klingt im Deutschen hypothetisch bzw. vorsichtig. וָחָי fragt rhetorisch nach seinem künftigen Leben bzw. Fortleben; „Wird er leben?“ gibt dies unmittelbarer wieder.
  - severity: medium
    issue: Unzutreffende Wiedergabe der Blutformel
    rationale: יִהְיֶה bedeutet hier „wird auf ihm sein“, nicht „komme über ihn“. Außerdem macht „über ihn selbst“ den Bezug stärker reflexiv als die hebräische Formulierung; die idiomatische Erklärung gehört in die Fußnote.
  - severity: low
    issue: „Aufschlag“ ist im Darlehenskontext missverständlich
    rationale: Im modernen Deutsch bezeichnet „Aufschlag“ gewöhnlich einen Preiszuschlag. „Gewinn“ bleibt als Wiedergabe von תַרְבִּית im Kontext der vorangehenden Zinsgabe verständlich und wahrt die begriffliche Paarung.
  revised_text: Er leiht gegen Zins und nimmt Gewinn – wird er leben? Er wird nicht leben. All diese Gräuel hat er begangen; er wird gewiss getötet werden.[a] Sein Blut wird auf ihm sein.[b]
