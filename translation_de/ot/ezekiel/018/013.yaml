revisions:
- from: Er leiht gegen Zins und nimmt Aufschlag – sollte er am Leben bleiben? Er soll nicht am Leben bleiben. Alle diese Gräueltaten hat er begangen; er muss gewiss getötet werden.[a] Sein Blut komme über ihn selbst.[b]
  to: Er leiht gegen Zins und nimmt Gewinn – wird er leben? Er wird nicht leben. All diese Gräuel hat er begangen; er wird gewiss getötet werden.[a] Sein Blut wird auf ihm sein.[b]
  rationale: Die Revision stellt die rhetorische Zukunftsfrage und die Zukunftsform der abschließenden Rechtsformel wieder her, präzisiert die passive Todesformel und ersetzt das im modernen Darlehenskontext missverständliche „Aufschlag“. Die Aussage über den Vollzug des Todesurteils bleibt bewusst offen.
