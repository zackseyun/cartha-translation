  text: בַּ/נֶּ֧שֶׁךְ נָתַ֛ן וְ/תַרְבִּ֥ית לָקַ֖ח וָ/חָ֑י לֹ֣א יִֽחְיֶ֗ה אֵ֣ת כָּל הַ/תּוֹעֵב֤וֹת הָ/אֵ֨לֶּה֙ עָשָׂ֔ה מ֣וֹת יוּמָ֔ת דָּמָ֖י/ו בּ֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/013.yaml
  text: He lends at interest and takes profit—and shall he live? He shall not live[a]. He has done all these abominations; he shall surely be put to death[c][b]; his blood shall be upon him.
translation:
  language: de
  text: Er leiht gegen Zins und nimmt Gewinn – wird er leben? Er wird nicht leben. All diese Gräuel hat er begangen; er wird gewiss getötet werden.[a] Sein Blut wird auf ihm sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird gewiss sterben.“ Die hebräische Wendung ist eine nachdrückliche Todesformel.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Sein Blut wird auf ihm sein.“ Diese Rechtsformel besagt, dass er selbst die Verantwortung für seinen Tod trägt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ
  choice: gegen Zins
  rationale: נֶשֶׁךְ bezeichnet Zins auf ein Darlehen, in diesem rechtlich-prophetischen Zusammenhang als verwerfliche Kreditpraxis. „Gegen Zins“ ist im modernen Deutsch klar und legt nicht durch „Wucherzins“ fest, dass nur ein überhöhter Zinssatz gemeint sei.
- source_word: וְתַרְבִּית
  choice: und nimmt Aufschlag
  rationale: תַּרְבִּית steht neben נֶשֶׁךְ und bezeichnet den aus dem Darlehen gezogenen Mehrertrag. „Aufschlag“ bewahrt die begriffliche Unterscheidung von „Zins“, ohne eine wirtschaftlich neutrale Gewinnerzielung nahezulegen.
- source_word: וָחָי לֹא יִחְיֶה
  choice: – sollte er am Leben bleiben? Er soll nicht am Leben bleiben.
  rationale: Die Folge wird als rhetorische Frage mit nachdrücklicher Verneinung verstanden. Die deutsche Formulierung erhält sowohl die Fragekraft als auch den Urteilston.
- source_word: אֵת כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: Alle diese Gräueltaten
  rationale: תּוֹעֵבוֹת bezeichnet moralisch und kultisch verabscheute Handlungen. „Gräueltaten“ gibt die starke prophetische Wertung in verständlichem, würdigem Deutsch wieder.
- source_word: מוֹת יוּמָת
  choice: er muss gewiss getötet werden
  rationale: Infinitivus absolutus und passives Verb bilden eine nachdrückliche Todesformel. „Muss gewiss getötet werden“ wahrt die passive, urteilsmäßige Aussage; die Fußnote nennt die mögliche allgemeinere Wiedergabe.
- source_word: דָּמָיו בּוֹ יִהְיֶה
  choice: Sein Blut komme über ihn selbst
  rationale: Die hebräische Rechtsformel weist ihm die Verantwortung für seinen Tod zu. „Über ihn selbst“ macht den reflexiven Bezug natürlich verständlich, während das Bild vom Blut erhalten bleibt.
theological_decisions:
- issue: Art des Todesurteils in prophetisch-rechtlicher Rede
  choice: Die passive, nachdrückliche Formel wird als „er muss gewiss getötet werden“ wiedergegeben, ohne den menschlichen oder göttlichen Vollzug näher zu bestimmen.
  alternative: „Er muss gewiss sterben.“
  rationale: Das hebräische Passiv trägt Urteilscharakter, doch der Vers nennt keinen Vollstrecker und kein Verfahren. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-rechtlichem Ernst. Die Satzfolge bewahrt die rhetorische Frage und die emphatische Todesformel. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Aussagen.
