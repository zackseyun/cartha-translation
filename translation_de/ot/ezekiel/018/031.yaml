base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/031.yaml
  text: Cast away from yourselves all your transgressions by which you have transgressed[a], and make for yourselves a new heart and a new spirit. Why should you die, O house of Israel?
translation:
  language: de
  text: Werft alle eure Vergehen, die ihr begangen habt, von euch und schafft euch ein neues Herz und einen neuen Geist. Warum sollt ihr sterben, Haus Israel?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁלִיכוּ מֵעֲלֵיכֶם
  choice: Werft … von euch
  rationale: Der pluralische Imperativ bezeichnet ein kraftvolles Wegwerfen oder Abschütteln. Die Wendung bewahrt das Bild des Hebräischen und klingt im modernen Deutschen natürlich.
- source_word: כָּל־פִּשְׁעֵיכֶם אֲשֶׁר פְּשַׁעְתֶּם בָּם
  choice: alle eure Vergehen, mit denen ihr euch vergangen habt
  rationale: „Vergehen“ und „euch vergangen“ bilden im Deutschen eine erkennbare Wortverbindung und geben so die hebräische Wiederholung der Wurzel פשע wieder. Zugleich bleibt „Auflehnung“ als mögliche Bedeutungsnuance in der Fußnote sichtbar.
- source_word: וַעֲשׂוּ לָכֶם
  choice: und schafft euch
  rationale: עשה mit לָכֶם fordert dazu auf, etwas für sich selbst hervorzubringen bzw. zu erlangen. „Schafft euch“ ist knapp, idiomatisch und erhält den Imperativ.
- source_word: לֵב חָדָשׁ
  choice: ein neues Herz
  rationale: „Herz“ bewahrt das zentrale Bild für das innere Wollen und die Gesinnung, ohne es einengend zu paraphrasieren.
- source_word: רוּחַ חֲדָשָׁה
  choice: einen neuen Geist
  rationale: „Geist“ erhält die Begrifflichkeit Ezechiels und die bewusste Verbindung mit dem neuen Herzen.
- source_word: וְלָמָּה תָמֻתוּ
  choice: Warum wollt ihr sterben
  rationale: Die rhetorische Frage ist ein eindringlicher Appell. „Wollt ihr“ gibt diese exhortative Nuance im Deutschen natürlicher wieder als das missverständliche „solltet ihr“, ohne den Tod als bloße Vorhersage darzustellen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle und sachlich genaue Bezeichnung für das angesprochene Volk bleibt in der direkten Anrede erhalten.
theological_decisions:
- issue: Menschliche Verantwortung und göttliches Handeln beim neuen Herzen und neuen Geist
  choice: Den direkten Imperativ „schafft euch ein neues Herz und einen neuen Geist“ beibehalten.
  alternative: Die Aufforderung im Blick auf Ezechiel 36 abschwächen oder als ausschließlich göttliches Handeln umformulieren.
  rationale: Der hebräische Text spricht hier ausdrücklich die menschliche Verantwortung an. Die Spannung zu Stellen, an denen Gott Herz und Geist erneuert, wird nicht harmonisierend aufgelöst.
- issue: Bedeutungsumfang und Wortspiel von פשע
  choice: „Vergehen … vergangen“ mit einer Fußnote zur möglichen Wiedergabe „Auflehnungen … aufgelehnt“.
  alternative: Im Haupttext „Auflehnungen, mit denen ihr euch aufgelehnt habt“.
  rationale: „Vergehen“ ist im modernen Standarddeutsch breit verständlich; die verwandte Verbform hält die rhetorische Wiederholung hörbar. Die stärker rebellische Nuance wird als echte lexikalische Alternative kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftigen Imperativen. Die direkte Anrede „Haus Israel“ bleibt ohne altertümliches „o“. Die Formulierung wahrt die markante Wortwiederholung und die theologische Spannung des Verses.
