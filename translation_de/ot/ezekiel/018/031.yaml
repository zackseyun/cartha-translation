    rationale: »mit denen ihr euch vergangen habt« ist im Deutschen nicht die übliche Rektion von »sich vergehen« und stellt die Beziehung von פשע und dem Verb פשע nicht klar dar. Die natürliche Wiedergabe »die ihr begangen habt« gibt den Sachverhalt wieder; die Wurzelwiederholung wird in einer Anmerkung transparent gemacht.
  - severity: medium
    issue: »Warum wollt ihr sterben?« kann eine nicht vorhandene Willensnuance nahelegen
    rationale: Das hebräische תמתו ist ein Imperfekt in rhetorischer Frage und bezeichnet nicht ausdrücklich den Wunsch zu sterben. »Warum sollt ihr sterben?« gibt im Deutschen die appellative Frage wieder, ohne freiwillige Absicht zu unterstellen.
