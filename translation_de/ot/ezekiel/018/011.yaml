source:
  edition: WLC
  text: וְ/ה֕וּא אֶת כָּל אֵ֖לֶּה לֹ֣א עָשָׂ֑ה כִּ֣י גַ֤ם אֶל הֶֽ/הָרִים֙ אָכַ֔ל וְ/אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/011.yaml
  text: But he has done none of all these things; instead, he has even eaten on the mountains and defiled his neighbor’s wife.
translation:
  language: de
  text: Er aber hat nichts von alledem getan; stattdessen hat er sogar auf den Bergen gegessen[a] und die Frau seines Nächsten entehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich die Teilnahme an Opfermahlzeiten an den Höhenheiligtümern.
    reason: Die wörtliche Wendung ist für heutige Leser ohne den kultischen Hintergrund leicht missverständlich.
lexical_decisions:
- source_word: וְהוּא
  choice: Er aber
  rationale: Das selbstständige Pronomen hebt die betreffende Person hervor; „aber“ gibt den Gegensatz im Zusammenhang natürlich wieder.
- source_word: אֶת כָּל אֵלֶּה לֹא עָשָׂה
  choice: hat nichts von alledem getan
  rationale: Gibt die Stellung der Verneinung vor „getan“ idiomatisch wieder. Die unmittelbar folgende Aufzählung gegenteiliger Taten erzeugt im Hebräischen eine schwierige Spannung, die nicht durch Ergänzungen aufgelöst wird.
- source_word: כִּי גַם
  choice: stattdessen … sogar
  rationale: Im vorliegenden gegensätzlichen Zusammenhang leitet die Wendung eine steigernde Gegenaussage ein; „sogar“ bewahrt die verstärkende Funktion von גַם.
- source_word: אֶל הֶהָרִים אָכַל
  choice: auf den Bergen gegessen
  rationale: Die knappe kultische Redeweise des Hebräischen bleibt erhalten; eine erklärende Ergänzung steht nur in der Fußnote.
- source_word: טִמֵּא
  choice: entehrt
  rationale: Das Verb bedeutet wörtlich „unrein machen/verunreinigen“; im Zusammenhang mit der Frau des Nächsten bezeichnet es sexuelle Schändung beziehungsweise Ehebruch. „Entehrt“ ist verständlich und bewahrt den gewichtigen Ton.
theological_decisions:
- issue: Bezug des Subjekts und Spannung zwischen „nichts von alledem“ und den folgenden Vergehen
  choice: Die hebräische Satzfolge wird ohne eingefügten Subjektwechsel wiedergegeben.
  alternative: „Obwohl sein Vater nichts von alledem getan hatte, hat er sogar …“
  rationale: Der hebräische Text nennt an dieser Stelle nicht ausdrücklich „sein Vater“. Eine solche Ergänzung würde eine schwierige syntaktische und referenzielle Spannung zugunsten einer bestimmten Deutung auflösen.
- issue: Kultische Bedeutung des Essens auf den Bergen
  choice: Im Haupttext bleibt die bildhafte Formulierung „auf den Bergen gegessen“ stehen.
  alternative: „an den Opfermahlzeiten auf den Höhen teilgenommen“
  rationale: Der kultische Bezug ist aus dem Kontext wahrscheinlich, doch das Objekt und die genaue Handlung werden im Vers nicht ausdrücklich genannt; die Fußnote erklärt, ohne den Haupttext zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze, harte Reihung des hebräischen Textes bleibt gewahrt; eine erklärende Glättung des schwierigen Subjektbezugs wird vermieden.
