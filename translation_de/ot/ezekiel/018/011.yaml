  terminology: „Berge“ entspricht הֶהָרִים; die Fußnote erläutert den wahrscheinlichen Bezug auf Höhenheiligtümer vorsichtig mit „wahrscheinlich“. „Frau seines Nächsten“ ist eine angemessene, registergerechte Wiedergabe von אֵשֶׁת רֵעֵהוּ. „Entehrt“ ist im deutschen Bibelregister für die sexuelle Verunreinigung/Schändung ausreichend präzise, ohne eine über den Text hinausgehende Einzelbeschreibung festzulegen.
