source:
  edition: WLC
  text: אֶל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל וְ/אֶת אֵ֤שֶׁת רֵעֵ֨/הוּ֙ לֹ֣א טִמֵּ֔א וְ/אֶל אִשָּׁ֥ה נִדָּ֖ה לֹ֥א יִקְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/006.yaml
  text: he does not eat on the mountains[a], does not lift up his eyes to the idols of the house of Israel, does not defile his neighbor’s wife[c][b], and does not approach a woman during her menstrual impurity.
translation:
  language: de
  text: Er isst nicht auf den Bergen[a], richtet seinen Blick nicht auf die Götzen[b] des Hauses Israel, verunreinigt nicht die Frau seines Nächsten und nähert sich[c] keiner Frau während ihrer Monatsblutung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das Essen bei Opfermahlzeiten an den Kultstätten auf den Bergen.
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort ist eine stark verächtliche Bezeichnung für Götzen.
    reason: lexical_alternative
  - marker: c
    text: „Sich nähern“ ist hier eine verhüllende Wendung für Geschlechtsverkehr; die Monatsblutung steht dabei im Zusammenhang der kultischen Reinheitsbestimmungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־הֶהָרִים ... אָכָל
  choice: isst nicht auf den Bergen
  rationale: Die räumliche Bildsprache des Hebräischen bleibt erhalten; gemeint ist im Zusammenhang die Teilnahme an Opfermahlzeiten auf den Kulthöhen. Eine Fußnote erläutert diese kultische Bedeutung.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: erhebt seine Augen nicht zu
  rationale: Die hebräische Wendung kann Hinwendung, Begehren oder Verehrung ausdrücken. Die relativ formnahe deutsche Fassung bewahrt diese Bedeutungsbreite.
- source_word: גִּלּוּלֵי
  choice: Götzen
  rationale: „Götzen“ ist im Deutschen verständlich und gibt die abwertende Bezeichnung falscher Götter wieder, wenn auch nicht deren volle derbe Bildkraft.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die prophetische Kollektivbezeichnung wird entsprechend der ausdrücklichen hebräischen Form beibehalten.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: die Frau seines Nächsten
  rationale: רֵעַ bezeichnet den Nächsten, Gefährten oder Mitmenschen. Diese Fassung entspricht natürlicher deutscher Rechtssprache und engt den Bezug nicht unnötig ein.
- source_word: לֹא טִמֵּא
  choice: entweiht nicht
  rationale: Das Piel von טמא verbindet hier Ehebruch mit moralischer und kultischer Verunreinigung. „Entweihen“ bewahrt beide Anklänge besser als eine ausschließlich sexuelle Paraphrase.
- source_word: אִשָּׁה נִדָּה
  choice: eine Frau während ihrer Monatsblutung
  rationale: Die Formulierung bezeichnet eine Frau in dem durch die Menstruation bestimmten Unreinheitszustand. Die deutsche Fassung benennt den konkreten Zustand verständlich, ohne ihn bloß als moderne Hygienevorstellung zu deuten.
- source_word: לֹא יִקְרָב
  choice: nähert sich keiner
  rationale: Das Verb bedeutet wörtlich „sich nähern“, dient hier jedoch als Euphemismus für Geschlechtsverkehr. Die Bildsprache bleibt im Haupttext erhalten und wird in der Fußnote erklärt.
theological_decisions:
- issue: Soll der kultische Sinn des Essens auf den Bergen im Haupttext ausdrücklich gemacht werden?
  choice: Die wörtliche Bildsprache „isst nicht auf den Bergen“ bleibt im Haupttext.
  alternative: „isst nicht an den Heiligtümern auf den Bergen“ beziehungsweise „nimmt nicht an Opfermahlzeiten auf den Kulthöhen teil“
  rationale: Die formnahe Wiedergabe bewahrt die prophetische Ausdrucksweise; die kultische Bedeutung wird erläutert, ohne sie als Paraphrase in den Text einzutragen.
- issue: Soll טמא rein moralisch oder zugleich kultisch wiedergegeben werden?
  choice: „entweiht“ bewahrt moralische und kultische Anklänge.
  alternative: „macht nicht unrein“, „schändet nicht“ oder ausdrücklich „begeht keinen Ehebruch mit“
  rationale: Der Vers verbindet eheliche Moral mit Reinheitskategorien. Die Übersetzung soll diese Spannung nicht zugunsten nur einer Kategorie auflösen.
- issue: Soll das sexuelle Euphemismus bei לֹא יִקְרָב aufgelöst werden?
  choice: „nähert sich keiner“ bleibt im Haupttext stehen und wird durch eine Fußnote erklärt.
  alternative: „hat keinen Geschlechtsverkehr mit“
  rationale: So bleibt die zurückhaltende Ausdrucksweise des Hebräischen erhalten, während moderne Leser die gemeinte Handlung eindeutig erschließen können.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Satzglieder folgen der aufzählenden Struktur des Hebräischen. „Monatsblutung“ ist allgemeinverständlich; die Fußnote macht den sexuellen Euphemismus und den Reinheitsbezug sichtbar.
