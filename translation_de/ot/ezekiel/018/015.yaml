reference: Ezekiel 18:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ לֹ֥א טִמֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/015.yaml
  text: He has not eaten on the mountains[a], nor lifted up his eyes to the idols of the house of Israel[b]; he has not defiled his neighbor’s wife.
translation:
  language: de
  text: Er hat auf den Bergen nicht gegessen[a] und seine Augen nicht zu den Götzen des Hauses Israel erhoben[b]; die Frau seines Nächsten hat er nicht verunreinigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklicher: Er hat an den Höhenheiligtümern keine Opfermahlzeiten eingenommen; gemeint ist die Teilnahme an götzendienerischem Kult.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Götzen“ ist verächtlich und kann die Nuance von „schmutzigen“ oder „ekelhaften Götzen“ haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הֶהָרִים ... אָכָל
  choice: auf den Bergen nicht gegessen
  rationale: Die bildhafte hebräische Wendung bleibt erhalten; im Zusammenhang bezeichnet sie die Teilnahme an kultischen Mahlzeiten auf den Höhen. Die Fußnote macht diesen Sinn ausdrücklich.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: seine Augen nicht ... erhoben
  rationale: Die im Deutschen verständliche Körpermetapher bewahrt die Ausdrucksweise des Hebräischen und bezeichnet hier die Hinwendung zu den Götzen.
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: die Götzen des Hauses Israel
  rationale: „Götzen“ gibt den polemischen Charakter deutlicher wieder als das neutralere „Götterbilder“, ohne die mögliche Schmutz- oder Ekelkonnotation im Haupttext zu überzeichnen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die traditionelle, im Deutschen verständliche Bundes- und Volksbezeichnung bewahrt Ezechiels charakteristische Formulierung.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: die Frau seines Mitmenschen
  rationale: „Mitmensch“ gibt רֵעַ hier als Angehörigen der sozialen Gemeinschaft wieder und vermeidet die im heutigen Deutsch oft rein räumliche Engführung von „Nachbar“.
- source_word: לֹא טִמֵּא
  choice: hat ... nicht entehrt
  rationale: Im Zusammenhang mit der Frau eines anderen bezeichnet das Verb die durch Ehebruch bewirkte Verunreinigung. „Entehrt“ ist natürliches Deutsch und bewahrt die moralische Schwere, während eine Fußnote die wörtlichere Kultsprache erläutert.
theological_decisions:
- issue: Kultisches Essen auf den Bergen
  choice: Die konkrete Wendung „auf den Bergen gegessen“ bleibt im Haupttext stehen und wird als Teilnahme an Opfermahlzeiten auf Höhenheiligtümern erläutert.
  alternative: Die Bedeutung direkt als „an den Höhenheiligtümern Opfermahlzeiten gehalten“ in den Haupttext aufnehmen.
  rationale: Der Zusammenhang mit den Götzen macht die kultische Bedeutung erkennbar; die formale Bildsprache soll jedoch nicht stillschweigend durch eine Auslegung ersetzt werden.
- issue: Sexuelle Verunreinigung der Frau eines anderen
  choice: „Die Frau seines Mitmenschen hat er nicht entehrt.“
  alternative: „Die Frau seines Mitmenschen hat er nicht unrein gemacht.“
  rationale: Das Hebräische beschreibt Ehebruch mit Reinheits- und Verunreinigungssprache, behauptet aber nicht ausdrücklich Zwang. „Entehrt“ vermeidet diese Überdeutung; die Fußnote bewahrt die wörtlichere Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehender Bewahrung der hebräischen Bildsprache. Die kultische Bedeutung der Bergmahlzeiten und der stark abwertende Klang von גִּלּוּלִים werden in Fußnoten erläutert. Die Satzfolge folgt dem Hebräischen, ohne im Deutschen unnötig steif zu wirken.
