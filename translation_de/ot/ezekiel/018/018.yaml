  text: אָבִ֞י/ו כִּֽי עָ֣שַׁק עֹ֗שֶׁק גָּזַל֙ גֵּ֣זֶל אָ֔ח וַ/אֲשֶׁ֥ר לֹא ט֛וֹב עָשָׂ֖ה בְּ/ת֣וֹךְ עַמָּ֑י/ו וְ/הִנֵּה מֵ֖ת בַּ/עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
translation:
  language: de
  text: 'Was seinen Vater betrifft: Weil er Unterdrückung verübte[a], einen Bruder beraubte[b] und inmitten seines Volkes tat, was nicht gut war – siehe[c], er stirbt in seiner Schuld[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Unterdrückung unterdrückte“; die Verbindung von Verb und verwandtem Substantiv dient der Verstärkung. Auch möglich: „Erpressung verübte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen Bruder beraubte“. „Bruder“ kann hier allgemein einen Angehörigen derselben Gemeinschaft bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „siehe“; ein nachdrücklicher Hinweis auf die folgende Konsequenz.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „Er wird wegen seiner Schuld sterben“ oder „Er ist in seiner Schuld gestorben“. Das hebräische Perfekt stellt den Ausgang als gewiss dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  choice: Sein Vater aber
  rationale: Der Ausdruck greift kontrastierend den Vater gegenüber dem gerechten Sohn auf; „aber“ macht den im Zusammenhang vorhandenen Gegensatz natürlich sichtbar.
- source_word: כִּי
  choice: weil
  rationale: Leitet den Grund für das Todesurteil ein und wahrt die kausale Struktur.
- source_word: עָשַׁק עֹשֶׁק
  choice: andere schwer unterdrückte
  rationale: Die figura etymologica aus Verb und Substantiv verstärkt die Aussage. „schwer unterdrückte“ gibt die Intensität in natürlichem Deutsch wieder; „andere“ bleibt allgemein und bezeichnet die Betroffenen, ohne eine bestimmte Gruppe hinzuzufügen.
- source_word: גָּזַל גֵּזֶל אָח
  choice: einen Bruder beraubte
  rationale: Bewahrt „Bruder“ und damit die gemeinschaftliche Beziehung; der unbestimmte Ausdruck kann einen Mitmenschen beziehungsweise ein Mitglied des Volkes bezeichnen. Das verstärkende Verb-Substantiv-Gefüge wird idiomatisch mit „beraubte“ wiedergegeben.
- source_word: וַאֲשֶׁר לֹא טוֹב עָשָׂה
  choice: und ... tat, was nicht gut war
  rationale: Erhält die zurückhaltende hebräische Formulierung, statt sie deutend zu „Böses tat“ zu verstärken.
- source_word: בְּתוֹךְ עַמָּיו
  choice: mitten unter seinen Leuten
  rationale: Gibt die soziale Verortung innerhalb seiner Gemeinschaft in verständlichem modernem Deutsch wieder.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: Bewahrt den emphatischen prophetischen Diskursmarker in würdigem, bibelsprachlich vertrautem Deutsch.
- source_word: מֵת
  choice: er wird ... sterben
  rationale: Das morphologische Perfekt stellt das Ergebnis als gewiss dar; im deutschen gerichtlichen und prophetischen Zusammenhang bringt das Futur diese Konsequenz natürlich zum Ausdruck.
- source_word: בַּעֲוֹנוֹ
  choice: wegen seiner eigenen Schuld
  rationale: „Schuld“ umfasst den moralischen und haftungsbezogenen Sinn von עָוֹן. „eigene“ verdeutlicht den ausdrücklich persönlichen Suffix im Argument des Kapitels, ohne eine fremde Schuld einzutragen.
theological_decisions:
- issue: Persönliche Verantwortung für Sünde in Hesekiel 18
  choice: Der Vater stirbt wegen seiner eigenen Schuld; die persönlichen Bezüge und die kausale Aussage bleiben ausdrücklich erhalten.
  alternative: Er stirbt „in seiner Schuld“, wobei stärker sein schuldhafter Zustand als die Begründung des Urteils hervorgehoben wird.
  rationale: Der unmittelbare Zusammenhang betont persönliche Verantwortlichkeit. Die Übersetzung gibt dies wieder, ohne eine weitergehende systematisch-theologische Aussage über Tod und Strafe einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gemäßigter Nähe zur hebräischen Satzführung. „Siehe“ erhält bewusst den prophetischen Nachdruck; die übrige Formulierung vermeidet unnötig altertümliche Sprache. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
