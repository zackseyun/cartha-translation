source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י הַ/דְּרָכַ֞/י לֹ֤א יִתָּֽכְנּוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/029.yaml
  text: Yet the house of Israel says[a], ‘The way of the Lord is not just.’ Are my ways not just, O house of Israel? Is it not your ways that are not just?
translation:
  language: de
  text: 'Doch das Haus Israel sagt[a]: »Der Weg des Herrn ist nicht gerecht.« Sind etwa meine Wege nicht gerecht, Haus Israel? Sind es nicht eure Wege, die nicht gerecht sind?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Weg des Herrn ist nicht richtig« beziehungsweise »nicht recht«. Das hebräische Verb bezeichnet, was richtig bemessen oder geordnet ist; hier geht es um die moralische Richtigkeit des Handelns des Herrn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Doch ... sagt
  rationale: Das Perfekt führt im Zusammenhang den fortdauernden Einwand Israels an. Das deutsche Präsens ist für diese wiedergegebene Äußerung natürlich; »Doch« bringt den adversativen Zusammenhang zum Ausdruck.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt die korporative Bezeichnung des hebräischen Textes, ohne sie zu »Israel« zu verkürzen.
- source_word: לֹא יִתָּכֵן
  choice: ist/sind nicht gerecht
  rationale: Das Nifal von תכן bezeichnet hier, was richtig bemessen, geordnet beziehungsweise moralisch recht ist. »Gerecht« passt zur ethischen Beurteilung des Handelns Gottes und Israels; dieselbe Wiedergabe in allen drei Vorkommen erhält die rhetorische Symmetrie.
- source_word: דֶּרֶךְ / דְּרָכַי / דַרְכֵיכֶם
  choice: Weg / meine Wege / eure Wege
  rationale: »Weg« bewahrt das wiederholte Bild sowohl für die Handlungsweise des Herrn als auch für die Lebensführung des Volkes; Singular und Plural folgen jeweils dem Hebräischen.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Entspricht der üblichen deutschen Wiedergabe des göttlichen Titels in dieser Verbindung.
- source_word: הֲלֹא
  choice: Sind etwa ... nicht? / Sind es nicht ...?
  rationale: Gibt die rhetorischen Fragen wieder, die Zustimmung erwarten und Israels Vorwurf zurückweisen.
theological_decisions:
- issue: Moralischer Bewertungsbegriff im Vorwurf gegen Gott
  choice: יִתָּכֵן durchgehend mit »gerecht« wiedergeben
  alternative: »richtig«, »recht« oder »angemessen«
  rationale: »Gerecht« erhält den ethisch-forensischen Nachdruck des Kapitels, ohne die Aussage auf bloß subjektiv empfundene Fairness zu verengen. Die konsequente Wortwahl bewahrt zudem die dreifache Gegenüberstellung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von »gerecht« sowie das Wortspiel mit »Weg/Wege« bleiben erhalten. Die direkte Anrede »Haus Israel« bewahrt den feierlichen prophetischen Ton.
