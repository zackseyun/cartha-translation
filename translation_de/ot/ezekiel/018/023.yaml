base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/023.yaml
  text: Do I take any pleasure at all in the death of the wicked? declares the Lord GOD[c][b][a]. Is it not rather in his turning from his ways and living?
translation:
  language: de
  text: Habe ich etwa Gefallen am Tod des Gottlosen[a]? – Ausspruch Gottes, des HERRN[b]. Habe ich nicht vielmehr Gefallen daran, dass er von seinen Wegen umkehrt und lebt[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Habe ich wirklich Freude am Tod des Gottlosen?“ Das hebräische Verb kann Gefallen, Freude oder Verlangen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Ausspruch des Herrn JHWH“ (אֲדֹנָי יְהוִה). Die Verbindung wird im Deutschen konventionell als „Gott, der HERR“ wiedergegeben; „HERR“ steht für den Gottesnamen JHWH.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Habe ich nicht vielmehr Gefallen daran, wenn er von seinen Wegen umkehrt und lebt?“'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָפֹץ אֶחְפֹּץ
  choice: Habe ich etwa Gefallen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Frage. „Habe ich etwa Gefallen“ gibt ihre emphatische, eine Verneinung erwartende Kraft in natürlichem Deutsch wieder.
- source_word: מוֹת רָשָׁע
  choice: am Tod eines Gottlosen
  rationale: מוֹת bezeichnet den Tod, und רָשָׁע steht substantivisch für einen gottlosen bzw. schuldigen Menschen. Der unbestimmte Singular bewahrt den repräsentativen Einzelfall des Hebräischen.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: In der prophetischen Formel bezeichnet das Wort einen autoritativen göttlichen Ausspruch. Die nominale Wiedergabe bleibt der hebräischen Form nahe und ist im Deutschen verständlich.
- source_word: אֲדֹנָי יְהוִה
  choice: des Herrn, HERRN
  rationale: אֲדֹנָי wird als „Herr“ und der Gottesname יהוה traditionsgemäß als „HERR“ wiedergegeben. Das Komma hält beide Bezeichnungen erkennbar auseinander, ohne den Gottesnamen durch einen anderen Titel zu ersetzen.
- source_word: הֲלוֹא
  choice: Nicht vielmehr
  rationale: Die Fragepartikel erwartet eine bejahende Antwort und stellt die positive Alternative der vorherigen Frage gegenüber. „Vielmehr“ macht diesen Kontrast idiomatisch sichtbar.
- source_word: בְּשׁוּבוֹ מִדְּרָכָיו
  choice: dass er von seinen Wegen umkehrt
  rationale: Der Infinitiv mit ב kann zeitlich („wenn“) oder als Gegenstand des Gefallens verstanden werden. Im deutschen Fragesatz ist „daran, dass“ natürlich; „von seinen Wegen umkehrt“ bewahrt das Wegbild und die Umkehrbewegung.
- source_word: וְחָיָה
  choice: und lebt
  rationale: Die finite Verbform wird direkt wiedergegeben. So bleibt offen, ob das Leben als Folge beziehungsweise Ziel der Umkehr oder als damit verbundene Wirklichkeit hervorgehoben wird.
theological_decisions:
- issue: Gottes Haltung zum Tod des Gottlosen
  choice: „Gefallen haben“ wahrt die affektive und volitive Bedeutungsbreite von חפץ, ohne sie auf eine systematische Aussage über Gottes Willen festzulegen.
  alternative: „den Tod wollen“ oder „sich am Tod freuen“
  rationale: Der Vers verneint rhetorisch Gottes Gefallen am Tod und stellt dem die Umkehr und das Leben gegenüber. Die Übersetzung erhält die Spannung zwischen Gericht und Erbarmen, statt sie dogmatisch aufzulösen.
- issue: Verhältnis von Umkehr und Leben
  choice: „dass er … umkehrt und lebt“ verbindet beide Aussagen eng, ohne eine ausdrückliche Zweck- oder Kausalbeziehung einzufügen.
  alternative: „wenn er … umkehrt, sodass er lebt“ oder „damit er lebt“
  rationale: Das hebräische וְחָיָה kann im Zusammenhang als Folge, Ziel oder koordinierte Aussage verstanden werden. Die gewählte Fassung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen und das biblische Wegbild bleiben erhalten. „Gottloser“ wird als geläufiger substantivischer Ausdruck verwendet; die Gottesbezeichnung folgt der deutschen Konvention Herr/HERR.
