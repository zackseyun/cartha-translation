  to: 'Sieh: Jedes Leben gehört mir. Das Leben des Vaters gehört mir ebenso wie das Leben des Sohnes. Die Person, die sündigt – sie wird sterben.[a]'
  rationale: Die Revision glättet ausschließlich den deutschen Schlusssatz und präzisiert die Fußnote. Der Gedankenstrich mit der Wiederaufnahme „sie“ spiegelt die identifizierende Betonung des hebräischen Pronomens הִיא, ohne dessen grammatisches Femininum als Aussage über das Geschlecht der betreffenden Person zu missverstehen. Aussagegehalt, Ambiguität hinsichtlich der Art des Todes und die kontextuelle Wiedergabe von נֶפֶשׁ bleiben erhalten.
