base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/004.yaml
  text: Look[a], every life belongs to me. The life of the father is like the life of the son—both belong to me. The person who sins is the one who will die.
translation:
  language: de
  text: 'Sieh: Jedes Leben gehört mir. Das Leben des Vaters gehört mir ebenso wie das Leben des Sohnes. Die Person, die sündigt – sie wird sterben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alternativ mit „Seele“: „Alle Seelen gehören mir ... die Seele, die sündigt, sie wird sterben.“ Das hebräische Wort נֶפֶשׁ kann je nach Zusammenhang „Seele“, „Leben“, „Selbst“ oder „Person“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Leitet eine nachdrückliche Erklärung ein und bewahrt als heutiges Aufmerksamkeitssignal die Funktion des hebräischen Ausdrucks.
- source_word: כָּל הַנְּפָשׁוֹת
  choice: jedes Leben
  rationale: נֶפֶשׁ kann Leben, Person, Selbst oder Seele bezeichnen. Hier hebt der distributive Singular hervor, dass jedes einzelne menschliche Leben Gott gehört.
- source_word: לִי הֵנָּה
  choice: gehört mir
  rationale: Gibt die wörtliche Besitzanzeige „sind mein“ in natürlichem Deutsch wieder.
- source_word: כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן
  choice: Das Leben des Vaters gehört mir ebenso wie das Leben des Sohnes
  rationale: Die parallelen כְּ-Formulierungen stellen Vater und Sohn hinsichtlich ihrer Zugehörigkeit zu Gott gleich; „ebenso wie“ bildet diese Gleichordnung natürlich ab.
- source_word: הַנֶּפֶשׁ
  choice: der Mensch
  rationale: Im Schlusssatz bezeichnet נֶפֶשׁ den einzelnen handelnden und verantwortlichen Menschen, nicht zwingend einen vom Körper getrennten Seelenteil.
- source_word: הַחֹטֵאת
  choice: der sündigt
  rationale: Bewahrt den verbalen Charakter des Partizips und vermeidet die statische Etikettierung „Sünder“.
- source_word: הִיא
  choice: ist es, der
  rationale: Das feminine Pronomen stimmt grammatisch mit נֶפֶשׁ überein und hebt identifizierend hervor, dass genau der sündigende Mensch sterben wird; es bezeichnet nicht notwendig eine Frau.
- source_word: תָמוּת
  choice: sterben wird
  rationale: Gibt das Imperfekt als angekündigte Folge beziehungsweise als Gerichtsaussage in modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von נֶפֶשׁ in einer anthropologisch und theologisch bedeutsamen Aussage
  choice: In den Besitzsätzen „Leben“, im Verantwortlichkeitssatz „Mensch“
  alternative: Durchgehend „Seele“
  rationale: Der Vers betont Gottes Anspruch auf jedes menschliche Leben und die persönliche Verantwortung des Sündigenden. „Seele“ wäre lexikalisch möglich, könnte im heutigen Deutsch jedoch vorschnell eine bestimmte Leib-Seele-Lehre nahelegen, die der hebräische Ausdruck hier nicht festlegt.
- issue: Bedeutung des Todesurteils im Schlusssatz
  choice: Die Aussage ohne nähere Bestimmung der Art oder Reichweite des Todes wiedergeben
  alternative: Den Tod ausdrücklich als körperlichen, geistlichen oder ewigen Tod bestimmen
  rationale: Der hebräische Text sagt lediglich, dass der sündigende Mensch sterben wird. Eine genauere dogmatische Festlegung würde die im Vers selbst verbleibende Offenheit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ bewahrt den nachdrücklichen Auftakt. Die Wiederholung von „gehört mir“ vermeidet eine missverständliche Aussage, das Leben des Vaters sei dem Leben des Sohnes lediglich ähnlich, und stellt die gleiche Zugehörigkeit beider zu Gott klar.
