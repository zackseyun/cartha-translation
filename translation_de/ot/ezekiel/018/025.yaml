source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י שִׁמְעוּ נָא֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/דַרְכִּ/י֙ לֹ֣א יִתָּכֵ֔ן הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/025.yaml
  text: 'Yet you say[a], ‘The way of the Lord is not just.’ Hear now, house of Israel: Is my way not just? Is it not your ways that are not just?'
translation:
  language: de
  text: 'Doch ihr sagt[a]: »Der Weg des Herrn ist nicht gerecht.« Hört doch, Haus Israel! Ist etwa mein Weg nicht gerecht? Sind es nicht eure Wege, die nicht gerecht sind?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »richtig« beziehungsweise »fair«; entsprechend auch bei den weiteren Vorkommen von »nicht gerecht«. Das hebräische Wort bezeichnet hier, was angemessen oder billig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Doch ihr sagt
  rationale: Das Waw mit der Verbform führt im Zusammenhang Israels Einwand mit adversativem Ton ein. „Doch“ gibt diesen Gegensatz im modernen Deutschen natürlich wieder.
- source_word: יִתָּכֵן
  choice: gerecht sein
  rationale: Im Streitgespräch bezeichnet das Nifal von תכן das moralisch Angemessene und Billige. „Gerecht“ bewahrt das ethisch-forensische Gewicht und lässt zugleich die möglichen Nuancen „richtig“ und „fair“ erkennen.
- source_word: דֶּרֶךְ / דַרְכִּי / דַרְכֵיכֶם
  choice: Weg / mein Weg / eure Wege
  rationale: „Weg“ erhält die hebräische Metapher für Verhalten und Handlungsweise. Der Wechsel vom Singular bei Gottes Weg zum Plural bei Israels Wegen bleibt erhalten.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Der göttliche Titel אֲדֹנָי wird in gehobenem, allgemein verständlichem Deutsch mit „der Herr“ wiedergegeben.
- source_word: שִׁמְעוּ נָא
  choice: Hört doch
  rationale: Der Imperativ mit נָא ist eine eindringliche Aufforderung. „Hört doch“ gibt Nachdruck und appellativen Ton wieder, ohne altertümlich zu klingen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle kollektive Anrede wird formal nah und im prophetischen Register verständlich wiedergegeben.
- source_word: הֲדַרְכִּי לֹא יִתָּכֵן
  choice: Ist etwa mein Weg nicht gerecht?
  rationale: „Etwa“ markiert die rhetorische Frage, ohne ihre Herausforderung aufzulösen.
- source_word: הֲלֹא דַרְכֵיכֶם לֹא יִתָּכֵנוּ
  choice: Sind es nicht eure Wege, die nicht gerecht sind?
  rationale: Die Spaltsatzkonstruktion hebt wie im Hebräischen „eure Wege“ hervor und bewahrt den Kontrast zu „mein Weg“ sowie den Plural.
theological_decisions:
- issue: Moralische Bewertung von Gottes Handeln angesichts des Vorwurfs Israels
  choice: יִתָּכֵן durchgehend mit „gerecht“ wiedergeben
  alternative: „richtig“, „fair“ oder „angemessen“
  rationale: Das Kapitel verhandelt Gottes Gerechtigkeit und persönliche Verantwortlichkeit. „Gerecht“ erhält das moralische und gerichtliche Gewicht sowohl des Vorwurfs als auch der Erwiderung, ohne die Aussage konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Direktheit. Die Weg-Metapher, die rhetorischen Fragen und der Singular-Plural-Kontrast des Hebräischen bleiben erhalten.
