source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י לִֽשְׁכ֨וֹת הַ/צָּפ֜וֹן לִֽשְׁכ֣וֹת הַ/דָּרוֹם֮ אֲשֶׁ֣ר אֶל פְּנֵ֣י הַ/גִּזְרָה֒ הֵ֣נָּה לִֽשְׁכ֣וֹת הַ/קֹּ֗דֶשׁ אֲשֶׁ֨ר יֹאכְלוּ שָׁ֧ם הַ/כֹּהֲנִ֛ים אֲשֶׁר קְרוֹבִ֥ים לַֽ/יהוָ֖ה קָדְשֵׁ֣י הַ/קֳּדָשִׁ֑ים שָׁ֞ם יַנִּ֣יחוּ קָדְשֵׁ֣י הַ/קֳּדָשִׁ֗ים וְ/הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם כִּ֥י הַ/מָּק֖וֹם קָדֹֽשׁ־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/013.yaml
  text: Then he said to me[a], “The north chambers, the south chambers, which are opposite the separate area—they are the holy chambers, where the priests who draw near to Yahweh shall eat the most holy things. There they shall place the most holy things, the grain offering, the sin offering, and the guilt offering[d][c][b], for the place is holy.”
translation:
  language: de
  text: 'Dann sagte er zu mir: „Die Räume im Norden und die Räume im Süden, die gegenüber dem abgesonderten Bereich liegen,[a] sind die heiligen Räume. Dort sollen die Priester, die sich Jahwe nahen, die hochheiligen Gaben[b] essen. Dort sollen sie die hochheiligen Gaben niederlegen: das Speiseopfer, das Sündopfer[c] und das Schuldopfer,[d] denn der Ort ist heilig.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die dem abgesonderten Bereich zugewandt sind“. Der hebräische Ausdruck bezeichnet ihre Lage oder Ausrichtung gegenüber dem abgetrennten Teil der Tempelanlage.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Heiligstes der Heiligkeiten“. Gemeint sind hier Opfergaben der höchsten Heiligkeitsstufe, nicht der innerste Tempelraum, das Allerheiligste.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Reinigungsopfer“.'
    reason: alternative_reading
  - marker: d
    text: 'Auch möglich: „Wiedergutmachungsopfer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁכוֹת
  choice: Räume
  rationale: Im Zusammenhang der Tempelanlage bezeichnet das Wort baulich abgegrenzte Räume. „Räume“ ist im modernen Deutschen natürlich und klar; „Kammern“ wäre möglich, wirkt aber altertümlicher.
- source_word: הַצָּפוֹן / הַדָּרוֹם
  choice: die Räume im Norden und die Räume im Süden
  rationale: Die Richtungsangaben werden als Lagebezeichnungen verstanden. Diese Formulierung ist idiomatisch und lässt offen, ob primär Lage oder Ausrichtung gemeint ist.
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: die gegenüber dem abgesonderten Bereich liegen
  rationale: אֶל־פְּנֵי bezeichnet hier die räumliche Gegenüberlage oder Ausrichtung. גִּזְרָה ist ein abgetrennter beziehungsweise gesonderter Bereich der Tempelanlage, ohne dass er vorschnell als Hof bestimmt werden sollte.
- source_word: לִשְׁכוֹת הַקֹּדֶשׁ
  choice: die heiligen Räume
  rationale: Die Wendung kennzeichnet die Räume als dem heiligen Dienst vorbehalten. „Heilig“ hält die wiederholte קדשׁ-Terminologie sichtbar.
- source_word: קְרוֹבִים לַיהוָה
  choice: die sich Jahwe nahen
  rationale: Das Partizip bezeichnet den kultischen Zugang der Priester zu Gott, nicht bloß räumliche Nähe. „Sich nahen“ bewahrt diesen priesterlichen Bedeutungsgehalt in würdigem Deutsch.
- source_word: קָדְשֵׁי הַקֳּדָשִׁים
  choice: die hochheiligen Gaben
  rationale: Die unmittelbar folgende Aufzählung zeigt, dass Opfergaben der höchsten Heiligkeitsstufe gemeint sind, nicht der innerste Tempelraum. „Hochheilig“ gibt den hebräischen Intensitätsausdruck knapp wieder; „Gaben“ macht den sachlichen Bezug verständlich.
- source_word: יַנִּיחוּ
  choice: niederlegen
  rationale: Der Hifil von נוח bezeichnet hier das Ablegen beziehungsweise Deponieren an dem dafür bestimmten Ort. „Niederlegen“ ist konkret, ohne eine über den Text hinausgehende Lagerfunktion festzulegen.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: מִנְחָה ist in diesem kultischen Zusammenhang die etablierte Opferkategorie. „Speiseopfer“ ist im deutschen Bibelwortschatz verständlich und umfassender als „Getreideopfer“, da die Kategorie auch verarbeitete Getreidegaben einschließt.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: „Sündopfer“ ist die geläufige Bezeichnung dieser Opferkategorie. Die mögliche funktionale Nuance eines Reinigungsopfers wird in einer Fußnote bewahrt.
- source_word: הָאָשָׁם
  choice: das Schuldopfer
  rationale: „Schuldopfer“ ist die traditionelle und weiterhin verständliche Bezeichnung. Die alternative Wiedergabe „Wiedergutmachungsopfer“ betont einen realen Bedeutungsaspekt und wird deshalb in einer Fußnote genannt.
- source_word: כִּי הַמָּקוֹם קָדֹשׁ
  choice: denn der Ort ist heilig
  rationale: כִּי begründet, weshalb die Opfergaben dort abgelegt werden. „Denn“ stellt diesen erklärenden Zusammenhang natürlich und würdig her.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen im modernen Deutschen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von קָדְשֵׁי הַקֳּדָשִׁים
  choice: die hochheiligen Gaben
  alternative: das Hochheilige / die allerheiligsten Dinge
  rationale: Hier bezeichnet die Wendung Opfergaben der höchsten Heiligkeitsstufe. Die nachfolgende Nennung von Speise-, Sünd- und Schuldopfer schließt eine Deutung auf das Allerheiligste als Raum aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Tempel- und Opfersprache. „Räume“ vermeidet das heute leicht altertümliche „Kammern“; „sich nahen“ bleibt bewusst gehoben, weil es den kultischen Vorgang präzise bezeichnet. Alle sachlich relevanten Mehrdeutigkeiten werden in Fußnoten offengehalten.
