  text: מָדַ֛ד ר֥וּחַ הַ/קָּדִ֖ים בִּ/קְנֵ֣ה הַ/מִּדָּ֑ה חֲמֵשׁ אמות קָנִ֛ים בִּ/קְנֵ֥ה הַ/מִּדָּ֖ה סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/016.yaml
  text: 'He measured the east side with the measuring reed: five hundred reeds by the measuring reed[a], all around.'
translation:
  language: de
  text: 'Er maß die Ostseite mit der Messrute: fünfhundert Ruten mit der Messrute, ringsum.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet wörtlich etwa: „fünf Ellen, Ruten“. Im Zusammenhang wird dies meist als „fünfhundert Ruten“ verstanden, entsprechend den Maßangaben in den Versen 16–19. Einige Handschriften und alte Übersetzungen geben dies deutlicher wieder.'
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  choice: Er maß
  rationale: Das Qal Perfekt 3. Person Singular von מדד bezeichnet hier schlicht den vollzogenen Messvorgang.
- source_word: רוּחַ הַקָּדִים
  choice: die Ostseite
  rationale: Im Zusammenhang der Vermessung bezeichnet רוּחַ mit einer Himmelsrichtung die entsprechende Seite beziehungsweise Richtung, nicht den Wind.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: mit der Messrute
  rationale: Die Präposition ב ist instrumental gebraucht; „Messrute“ ist die natürliche deutsche Bezeichnung für das verwendete Messgerät.
- source_word: חֲמֵשׁ אמות קָנִים
  choice: fünfhundert Ruten
  rationale: Der überlieferte hebräische Wortlaut ist schwierig und lautet wörtlich etwa „fünf Ellen, Ruten“. Nach dem unmittelbaren Kontext und der wiederkehrenden Maßformel ist „fünfhundert Ruten“ wahrscheinlich gemeint; die textliche Schwierigkeit wird in der Fußnote offengelegt.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet hier die umlaufende beziehungsweise umfassende Vermessung und wird knapp und idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Wiederholung „nach der Messrute“ bewahrt die Maßformel des Hebräischen; die schwer verständliche Textüberlieferung wird nicht stillschweigend geglättet, sondern in einer Fußnote ausgewiesen.
