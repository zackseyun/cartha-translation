  text: Facing the length of one hundred cubits was the north entrance[a], and the width was fifty cubits.
translation:
  language: de
  text: Vor der Länge von hundert Ellen befand sich der Eingang nach Norden, und die Breite betrug fünfzig Ellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Eingang nach Norden lag gegenüber der Länge von hundert Ellen.« Die hebräische räumliche Wendung ist knapp und kann eine Lage vor der Länge oder eine darauf bezogene Ausrichtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל פְּנֵי
  choice: gegenüber
  rationale: Die kompakte räumliche Wendung bezeichnet hier die Lage beziehungsweise Ausrichtung im Verhältnis zu der gemessenen Längsseite. »Gegenüber« ist natürliches Deutsch, ohne die räumliche Beziehung unnötig festzulegen.
- source_word: אֹרֶךְ אַמּוֹת הַמֵּאָה
  choice: der hundert Ellen langen Seite
  rationale: אֹרֶךְ bezeichnet im architektonischen Zusammenhang die Längsausdehnung. Die attributive Wiedergabe ergibt einen verständlichen deutschen Satz und bewahrt das Maß von hundert Ellen.
- source_word: אַמּוֹת
  choice: Ellen
  rationale: Die antike Maßeinheit wird beibehalten und nicht in ein modernes Maß umgerechnet.
- source_word: פֶּתַח הַצָּפוֹן
  choice: der Eingang auf der Nordseite
  rationale: פֶּתַח bezeichnet eine Öffnung beziehungsweise einen Zugang. Im Baukontext ist »Eingang« passend; הַצָּפוֹן wird räumlich als »auf der Nordseite« wiedergegeben.
- source_word: וְהָרֹחַב
  choice: und die Breite betrug
  rationale: רֹחַב bezeichnet die Querausdehnung. Das im Hebräischen fehlende Verb wird für einen natürlichen deutschen Maßsatz mit »betrug« ergänzt.
- source_word: חֲמִשִּׁים אַמּוֹת
  choice: fünfzig Ellen
  rationale: Die Zahlenangabe und die historische Maßeinheit werden direkt und konsistent wiedergegeben.
