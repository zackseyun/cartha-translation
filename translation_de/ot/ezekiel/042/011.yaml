  text: וְ/דֶ֨רֶךְ֙ לִ/פְנֵי/הֶ֔ם כְּ/מַרְאֵ֣ה הַ/לְּשָׁכ֗וֹת אֲשֶׁר֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן כְּ/אָרְכָּ֖/ן כֵּ֣ן רָחְבָּ֑/ן וְ/כֹל֙ מוֹצָ֣אֵי/הֶ֔ן וּ/כְ/מִשְׁפְּטֵי/הֶ֖ן וּ/כְ/פִתְחֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/011.yaml
  text: And before them was a passage[a], like the appearance of the chambers that faced north; as was their length, so was their width, and all their exits, their arrangements[b], and their entrances were alike.
translation:
  language: de
  text: Vor ihnen verlief ein Gang[a], der dem Erscheinungsbild der Kammern auf der Nordseite entsprach. In Länge und Breite entsprachen sie ihnen; auch alle ihre Ausgänge, ihre Anordnungen[b] und ihre Eingänge waren entsprechend gestaltet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vor ihnen war ein Weg.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Vorschriften“, „festgelegte Weise“ oder „Bauweise“ bedeuten; hier ist wahrscheinlich die vorgeschriebene bauliche Anordnung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֶרֶךְ
  choice: ein Gang
  rationale: דֶּרֶךְ bezeichnet grundsätzlich Weg oder Pfad; im architektonischen Zusammenhang ist „Gang“ eine natürliche, räumlich passende Wiedergabe, ohne die Bauform unnötig festzulegen.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die Präposition bezeichnet hier die räumliche Lage vor den zuvor genannten Kammern.
- source_word: כְּמַרְאֵה
  choice: entsprechend dem Aussehen
  rationale: מַרְאֶה bezeichnet die sichtbare Gestalt oder Erscheinung; die Formulierung bewahrt den ausdrücklich visuellen Vergleich.
- source_word: הַלְּשָׁכוֹת
  choice: der Kammern
  rationale: לְשָׁכָה bezeichnet im Tempel- und Gebäudekontext einen Nebenraum beziehungsweise eine Kammer; „Kammern“ wahrt das architektonische Register.
- source_word: אֲשֶׁר דֶּרֶךְ הַצָּפוֹן
  choice: auf der Nordseite
  rationale: Die wörtlich schwierige Wendung lokalisiert beziehungsweise orientiert die Kammern nach Norden; „auf der Nordseite“ lässt offen, ob primär Lage oder Ausrichtung gemeint ist.
- source_word: כְּאָרְכָּן כֵּן רָחְבָּן
  choice: Ihre Länge und ihre Breite waren gleich
  rationale: Die korrelative Konstruktion besagt im Zusammenhang am ehesten, dass Länge und Breite dieser Kammern denen der nördlichen Kammern entsprachen. Die knappe deutsche Formulierung kann jedoch auch missverständlich als Gleichheit von Länge und Breite untereinander gelesen werden; der Satzkontext und die anschließende Übereinstimmung lenken auf den Vergleich der beiden Kammergruppen.
- source_word: וְכֹל מוֹצָאֵיהֶן
  choice: auch alle ihre Ausgänge
  rationale: מוֹצָא bezeichnet einen Ort des Hinausgehens und ist im Baukontext am klarsten mit „Ausgänge“ wiedergegeben.
- source_word: וּכְמִשְׁפְּטֵיהֶן
  choice: ihre Anordnungen
  rationale: מִשְׁפָּט kann Recht, Vorschrift oder festgelegte Weise bedeuten; hier verweist es wahrscheinlich auf die vorgeschriebene bauliche Anlage oder Gestaltung.
- source_word: וּכְפִתְחֵיהֶן
  choice: ihre Eingänge
  rationale: פֶּתַח bezeichnet eine Öffnung oder einen Eingang; „Eingänge“ passt zum architektonischen Zusammenhang.
- source_word: implicit comparison across final clauses
  choice: stimmten überein
  rationale: Das Hebräische reiht Vergleichselemente ohne abschließendes finites Verb aneinander. „Stimmten überein“ ergänzt im Deutschen den durchgängigen Vergleich, ohne neue Sachinformation einzuführen.
