base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/009.yaml
  text: And below these chambers was the entrance from the east[a], as one enters them from the outer court.
translation:
  language: de
  text: Und unterhalb dieser Kammern befand sich der Eingang von Osten her[a], wenn man vom äußeren Vorhof zu ihnen hineinging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »von Osten her«; die Wendung kann entweder die östliche Lage des Eingangs oder die Annäherung aus östlicher Richtung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתַּחְתֶּה
  choice: Und unterhalb
  rationale: Gibt die räumliche Beziehung zum zuvor beschriebenen Bau wieder, ohne die architektonische Anordnung genauer festzulegen, als es der hebräische Text tut.
- source_word: לְשָׁכוֹת הָאֵלֶּה
  choice: dieser Kammern
  rationale: „Kammern“ ist im Tempelkontext eine verständliche und sachlich passende Wiedergabe von לְשָׁכוֹת.
- source_word: הַמָּבוֹא
  choice: der Eingang
  rationale: Bezeichnet hier den Zugang beziehungsweise die Stelle, durch die man den beschriebenen Bereich betritt.
- source_word: מֵהַקָּדִים
  choice: von Osten her
  rationale: Bewahrt die wörtliche Richtungsangabe des Hebräischen und lässt offen, ob damit die Lage des Eingangs im Osten oder die Annäherung aus östlicher Richtung gemeint ist.
- source_word: בְּבֹאוֹ
  choice: wenn man … hineinging
  rationale: Die Konstruktion beschreibt den Vorgang des Eintretens. Das unpersönliche „man“ vermeidet im Deutschen einen unnötig bestimmten männlichen Handlungsträger.
- source_word: לָהֵנָּה
  choice: zu ihnen hinein
  rationale: Das feminine Pluralpronomen verweist auf die Kammern; „zu ihnen hinein“ bringt zugleich den Richtungsbezug natürlich zum Ausdruck.
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  choice: vom äußeren Vorhof
  rationale: „Äußerer Vorhof“ entspricht der üblichen deutschsprachigen Bezeichnung für diesen Bereich der Tempelanlage.
