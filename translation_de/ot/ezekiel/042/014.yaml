  text: בְּ/בֹאָ֣/ם הַ/כֹּהֲנִ֗ים וְ/לֹֽא יֵצְא֤וּ מֵ/הַ/קֹּ֨דֶשׁ֙ אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָ֔ה וְ/שָׁ֞ם יַנִּ֧יחוּ בִגְדֵי/הֶ֛ם אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ן כִּֽי קֹ֣דֶשׁ הֵ֑נָּה ילבשו בְּגָדִ֣ים אֲחֵרִ֔ים וְ/קָרְב֖וּ אֶל אֲשֶׁ֥ר לָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/014.yaml
  text: When the priests enter[a], they shall not go out from the holy place into the outer court, but there they shall leave their garments in which they minister, for they are holy. They shall put on other garments, and then approach what belongs to the people.
translation:
  language: de
  text: Wenn die Priester hineingehen, dürfen sie nicht aus dem heiligen Bereich in den äußeren Vorhof hinausgehen, sondern sollen dort ihre Gewänder ablegen, in denen sie den Dienst verrichten, denn sie sind heilig. Sie sollen andere Gewänder anziehen und sich dann dem nähern, was für das Volk bestimmt ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem, was für das Volk ist“; der hebräische Ausdruck ist verkürzt und kann sich auf einen Bereich beziehen, der dem Volk zugänglich ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֹאָם הַכֹּהֲנִים
  choice: Wenn die Priester hineingehen
  rationale: ב mit Infinitivus constructus und Suffix bildet einen Temporalsatz. „Wenn … hineingehen“ gibt diesen Sinn natürlich wieder; „hinein“ entspricht dem räumlichen Zusammenhang.
- source_word: וְלֹא יֵצְאוּ
  choice: dürfen sie nicht … hinausgehen
  rationale: Das Imperfekt hat in dieser Tempelordnung vorschreibende Kraft. „dürfen nicht“ klingt im modernen Deutschen klar und verbindlich.
- source_word: מֵהַקֹּדֶשׁ
  choice: aus dem heiligen Bereich
  rationale: קֹדֶשׁ bezeichnet hier den geheiligten inneren Bereich im Gegensatz zum äußeren Vorhof. Die Wiedergabe vermeidet die mögliche Engführung von „Heiligtum“ auf ein einzelnes Gebäude.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: in den äußeren Vorhof
  rationale: Die Wendung bezeichnet die gerichtete Bewegung in den äußeren Hof.
- source_word: וְשָׁם יַנִּיחוּ
  choice: Dort sollen sie vielmehr … ablegen
  rationale: נוּחַ im Hifil bedeutet hier, die Kleidung dort niederzulegen beziehungsweise zurückzulassen. „vielmehr“ macht den Gegensatz zum verbotenen Hinausgehen deutlich, ohne neuen Inhalt einzuführen.
- source_word: בִגְדֵיהֶם אֲשֶׁר יְשָׁרְתוּ בָהֶן
  choice: ihre Gewänder …, in denen sie den Dienst verrichten
  rationale: „Gewänder“ ist würdig und neutral; שׁרת bezeichnet im priesterlichen Zusammenhang den kultischen Dienst. Die Präposition bei den Kleidern wird idiomatisch mit „in denen“ wiedergegeben.
- source_word: כִּי קֹדֶשׁ הֵנָּה
  choice: denn sie sind heilig
  rationale: Das feminine Pluralpronomen הֵנָּה verweist auf die Gewänder. Das deutsche Pronomen erhält den knappen Kausalzusammenhang.
- source_word: יִלְבְּשׁוּ בְּגָדִים אֲחֵרִים
  choice: Sie sollen andere Gewänder anziehen
  rationale: Direkte und natürliche Wiedergabe der vorgeschriebenen Handlung.
- source_word: וְקָרְבוּ
  choice: und sich dann … nähern
  rationale: קרב bedeutet „sich nähern/herantreten“. „dann“ verdeutlicht die Abfolge nach dem Kleidungswechsel.
- source_word: אֶל אֲשֶׁר לָעָם
  choice: dem nähern, was für das Volk bestimmt ist
  rationale: Der hebräische Ausdruck ist elliptisch und nennt keinen ausdrücklichen Bezugsgegenstand. Diese Wiedergabe bewahrt die Offenheit eher, als ausdrücklich „Bereich“ oder „Ort“ einzusetzen.
theological_decisions:
- issue: Heiligkeit der priesterlichen Gewänder
  choice: Die Gewänder selbst werden aufgrund ihres priesterlichen Gebrauchs ausdrücklich als heilig bezeichnet und vom dem Volk zugänglichen Bereich getrennt gehalten.
  alternative: Die Aussage könnte rein funktional als Vorschrift für den Wechsel zwischen räumlichen Zonen paraphrasiert werden.
  rationale: Der hebräische Text begründet die Kleiderordnung ausdrücklich mit כִּי קֹדֶשׁ הֵנָּה („denn sie sind heilig“); diese theologische Begründung darf nicht auf bloße Verfahrenspraxis reduziert werden.
- issue: Bezug von אֲשֶׁר לָעָם
  choice: Die Ellipse bleibt als „was für das Volk bestimmt ist“ bestehen.
  alternative: Gemeint sein könnte ausdrücklich der dem Volk zugängliche Bereich beziehungsweise Ort.
  rationale: Da im Hebräischen kein Substantiv steht, sollte die Übersetzung den räumlichen Bezug nicht als völlig sicher festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Vorschriftssprache. Der Satzbau bleibt quellennah, wird jedoch für gewöhnliche heutige Leser gegliedert. Die räumliche und theologische Spannung zwischen heiligem Bereich und Volkssphäre bleibt erhalten.
