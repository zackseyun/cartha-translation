  yaml_path: translation/ot/ezekiel/042/019.yaml
  text: He turned to the west side and measured five hundred reeds with the measuring reed[a][b].
translation:
  language: de
  text: Dann wandte er sich der Westseite zu[a] und maß fünfhundert Ruten[b] mit der Messrute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Richtung des Meeres“; damit ist im Hebräischen der Westen gemeint.'
    reason: cultural_note
  - marker: b
    text: Einige Übersetzungen und Ausleger geben die Maßeinheit in diesem Messzusammenhang als „Ellen“ wieder; der hebräische Text hat hier jedoch „Ruten“.
    reason: alternative_reading
lexical_decisions:
- source_word: סָבַב
  choice: wandte er sich … zu
  rationale: Das Verb kann „sich wenden“ oder „herumgehen“ bedeuten. In der fortlaufenden Vermessung bezeichnet es hier am natürlichsten den Übergang zur nächsten Seite.
- source_word: אֶל רוּחַ הַיָּם
  choice: der Westseite zu
  rationale: Wörtlich steht „zur Richtung des Meeres“. Da das Meer im hebräischen geografischen Sprachgebrauch den Westen bezeichnet und eine Seite der Anlage vermessen wird, gibt „Westseite“ den Sinn klar wieder.
- source_word: מָדַד
  choice: maß
  rationale: Die übliche und kontextgerechte Wiedergabe des Verbs bei der Vermessung einer Anlage.
- source_word: חֲמֵשׁ מֵאוֹת קָנִים
  choice: fünfhundert Ruten
  rationale: קָנִים bezeichnet hier Messruten. „Ruten“ bewahrt die im masoretischen Text ausdrücklich genannte Maßeinheit und unterscheidet sie von Ellen.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: mit der Messrute
  rationale: Die Präposition ב ist instrumental gebraucht; die Wendung bezeichnet das Messgerät, mit dem die Strecke bestimmt wurde.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dann“ macht den Fortgang der Vermessung natürlich deutlich; „wandte er sich … zu“ bewahrt die Bewegungsbedeutung, ohne ein vollständiges Umrunden anzudeuten. Sämtliche Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
