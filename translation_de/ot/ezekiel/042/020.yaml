base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/020.yaml
  text: He measured it on the four sides[a]; it had a wall all around, five hundred cubits long and five hundred cubits wide[b], to make a separation between the holy and the common.
translation:
  language: de
  text: Er maß es an den vier Seiten[a]. Es hatte ringsum eine Mauer, fünfhundert lang und fünfhundert breit, um das Heilige vom Gewöhnlichen zu trennen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die vier Himmelsrichtungen“. Wörtlich: „zu den vier Winden“; im Zusammenhang der Vermessung sind die vier Seiten beziehungsweise Richtungen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: '„Das Gewöhnliche“ bezeichnet hier, was nicht als heilig abgesondert ist; auch: „das Profane“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: nach den vier Himmelsrichtungen hin
  rationale: רוּחוֹת bedeutet wörtlich „Winde“, kann aber auch die Richtungen bezeichnen. Im Zusammenhang der Vermessung gibt „Himmelsrichtungen“ den räumlichen Sinn natürlich wieder und bewahrt mit „hin“ die durch לְ ausgedrückte Ausrichtung.
- source_word: מְדָדוֹ
  choice: Er maß es
  rationale: Die Qal-Perfektform mit Suffix der 3. Person Singular bezeichnet hier am natürlichsten die Vermessung des zuvor beschriebenen Gesamtbereichs.
- source_word: חוֹמָה לוֹ סָבִיב סָבִיב
  choice: Es hatte ringsherum eine Mauer
  rationale: Die Wiederholung von סָבִיב verstärkt den Gedanken, dass die Mauer den Bereich vollständig umgab. „ringsherum“ gibt dies idiomatisch wieder.
- source_word: אֹרֶךְ חֲמֵשׁ מֵאוֹת וְרֹחַב חֲמֵשׁ מֵאוֹת
  choice: fünfhundert Ellen lang und fünfhundert Ellen breit
  rationale: Der Vers nennt Länge und Breite jeweils mit fünfhundert. Die Maßeinheit steht hier nicht erneut ausdrücklich, ist aber aus der unmittelbar vorausgehenden Messszene erschließbar; „Ellen“ macht die Maßangabe für heutige Leser verständlich.
- source_word: לְהַבְדִּיל
  choice: um … zu trennen
  rationale: Der Infinitiv mit לְ drückt den Zweck der umgebenden Mauer aus. Die deutsche Zweckkonstruktion ist präzise und natürlich.
- source_word: בֵּין הַקֹּדֶשׁ לְחֹל
  choice: das Heilige vom gewöhnlichen Bereich
  rationale: קֹדֶשׁ und חֹל bilden einen kultischen Gegensatz zwischen dem Abgesonderten und dem nicht als heilig Abgesonderten. „gewöhnlicher Bereich“ vermeidet die heute leicht moralisch abwertende Bedeutung von „profan“ und macht den räumlichen Bezug deutlich.
theological_decisions:
- issue: Kultischer Gegensatz zwischen קֹדֶשׁ und חֹל
  choice: das Heilige vom gewöhnlichen Bereich
  alternative: das Heilige vom Profanen
  rationale: חֹל bezeichnet hier das Nichtheilige beziehungsweise den gewöhnlichen Bereich, nicht notwendig etwas Sündiges oder Entweihtes. Die Übersetzung wahrt diese kultische Unterscheidung, ohne eine moralische Wertung einzutragen.
- issue: Implizite Maßeinheit
  choice: Ellen im Haupttext ergänzen
  alternative: fünfhundert lang und fünfhundert breit
  rationale: Obwohl die Maßeinheit in diesem Satz nicht wiederholt wird, ergibt sie sich aus dem Messkontext. Die Ergänzung schafft im Deutschen eine vollständige, verständliche Maßangabe; die implizite Natur der Einheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die architektonische Beschreibung bleibt knapp; „gewöhnlicher Bereich“ verdeutlicht den räumlich-kultischen Gegensatz, ohne חֹל moralisch abzuwerten.
