base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/015.yaml
  text: When he had finished measuring the inner house[a], he brought me out by way of the gate that faced east[b], and he measured it all around.
translation:
  language: de
  text: Als er die Vermessung des inneren Hauses[a] abgeschlossen hatte, führte er mich durch das Tor hinaus, das nach Osten ausgerichtet war[b], und maß es ringsum aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Tempelvision bezeichnet „Haus“ das heilige Bauwerk.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dessen Vorderseite in Richtung Osten war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה אֶת מִדּוֹת
  choice: Als er die Vermessung … abgeschlossen hatte
  rationale: כּלה bezeichnet das Beenden oder Vollenden; zusammen mit מִדּוֹת („Maße/Messungen“) gibt die temporale Formulierung die abgeschlossene Handlung vor dem Hinausführen natürlich und genau wieder.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: des inneren Tempelgebäudes
  rationale: בַּיִת bedeutet wörtlich „Haus“, bezeichnet hier im Zusammenhang der Tempelvision jedoch das heilige Bauwerk. „Tempelgebäude“ macht diesen Bezug im modernen Deutschen klar, ohne den Ausdruck auf einen bestimmten Gebäudeteil festzulegen.
- source_word: וְהוֹצִיאַנִי
  choice: führte er mich … hinaus
  rationale: Der Hifil von יצא bedeutet, jemanden hinausgehen zu lassen beziehungsweise hinauszuführen. „führte … hinaus“ ist im erzählerischen Zusammenhang natürlich.
- source_word: דֶּרֶךְ הַשַּׁעַר
  choice: durch das Tor
  rationale: דֶּרֶךְ bezeichnet hier den Weg oder die Route. Im Deutschen bringt „durch das Tor“ die konkrete Bewegungsrichtung idiomatisch zum Ausdruck.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: das nach Osten ausgerichtet war
  rationale: Wörtlich ist vom „Gesicht“ beziehungsweise der Vorderseite des Tores die Rede, die in Richtung Osten weist. Die gewählte Formulierung bewahrt die räumliche Orientierung in natürlichem Deutsch.
- source_word: וּמְדָדוֹ
  choice: und maß es … aus
  rationale: Das maskuline Suffix verweist am ehesten auf das zuvor genannte Bauwerk beziehungsweise den Tempelbereich. Das deutsche neutrale Pronomen „es“ stimmt mit „Tempelgebäude“ überein und lässt den genauen Umfang des Bezugs offen.
- source_word: סָבִיב סָבִיב
  choice: ringsherum
  rationale: Die Wiederholung verstärkt den Gedanken, dass die Messung auf allen Seiten beziehungsweise entlang des gesamten Umfangs erfolgte. „ringsherum“ gibt dies knapp und idiomatisch wieder.
theological_decisions:
- issue: Bezugsgröße der abschließenden Messung
  choice: „es“ mit Bezug auf das Tempelgebäude beziehungsweise den zuvor genannten Bereich
  alternative: „ihn“ mit ausdrücklichem Bezug auf den Tempelbau oder den gesamten Tempelbezirk
  rationale: Das hebräische maskuline Suffix nennt seinen Bezug nicht ausdrücklich. Die Übersetzung vermeidet daher eine nähere theologische oder architektonische Festlegung und bewahrt die mögliche Weite des Bezugs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem hebräischen Erzählgang, während „Vermessung abgeschlossen“ und „durch das Tor hinaus“ idiomatisches Deutsch gewährleisten. Die Fußnoten sichern die konkreteren hebräischen Bildausdrücke „Haus“ und „Vorderseite/Gesicht“.
