base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/004.yaml
  text: Before the chambers was a walkway ten cubits wide toward the inner court[a], and a passage one cubit wide[b]; and their entrances faced north.
translation:
  language: de
  text: Vor den Kammern verlief ein zehn Ellen breiter Gang in Richtung der Innenseite[a] und ein Weg von einer Elle Breite[b]; ihre Eingänge waren nach Norden ausgerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „zu der inneren [Seite/dem inneren Bereich] hin“; das Bezugswort wird im Hebräischen nicht genannt. Manche Übersetzungen ergänzen „Vorhof“.
    reason: alternative_reading
  - marker: b
    text: Der hebräische Text ist in diesem Satzteil schwierig. Möglich ist „ein Weg von einer Elle“; nach einer anderen Lesart beziehungsweise Überlieferung steht hier „hundert Ellen“.
    reason: textual_variant
lexical_decisions:
- source_word: לִפְנֵי
  choice: Vor
  rationale: Die räumliche Präposition bezeichnet das, was sich vor den Kammern befand.
- source_word: הַלְּשָׁכוֹת
  choice: den Kammern
  rationale: לשכה bezeichnet im Tempel- und Gebäudekontext Kammern oder Räume; „Kammern“ wahrt den gehobenen architektonischen Ton.
- source_word: מַהֲלַךְ
  choice: Gang
  rationale: Das Substantiv bezeichnet einen begehbaren Bereich oder Durchgang. „Gang“ ist im Deutschen natürlich, ohne die Bauform unnötig festzulegen.
- source_word: עֶשֶׂר אַמּוֹת רֹחַב
  choice: zehn Ellen breiter
  rationale: Die übliche Maßangabe wird idiomatisch wiedergegeben und das biblische Längenmaß „Elle“ beibehalten.
- source_word: אֶל הַפְּנִימִית
  choice: zur Innenseite hin
  rationale: Das substantivierte feminine Adjektiv „die innere“ steht ohne ausdrücklich genanntes Bezugswort. Die Wiedergabe vermeidet, „Vorhof“ in den Text einzutragen.
- source_word: דֶּרֶךְ
  choice: Zugang
  rationale: Im architektonischen Zusammenhang bezeichnet דרך hier wohl einen Weg oder Zugang. „Zugang“ unterscheidet ihn verständlich von dem zuvor genannten מַהֲלַךְ.
- source_word: אַמָּה אֶחָת
  choice: eine Elle breiter
  rationale: „Breit“ wird aus der vorangehenden Maßkonstruktion sinngemäß ergänzt, damit die Maßangabe im Deutschen verständlich ist.
- source_word: וּפִתְחֵיהֶם
  choice: ihre Eingänge
  rationale: פתח kann Öffnung, Türöffnung oder Eingang bedeuten; „Eingänge“ passt natürlich zu den Kammern und bewahrt den Plural mit Suffix.
- source_word: לַצָּפוֹן
  choice: lagen nach Norden
  rationale: Die Wendung gibt die Ausrichtung der Eingänge an. „Lagen nach Norden“ ist eine natürliche architektonische Formulierung.
