base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/001.yaml
  text: Then he brought me out into the outer court by the way toward the north[b][a], and he brought me to the chamber that was opposite the separate area and opposite the building to the north.
translation:
  language: de
  text: Dann führte er mich hinaus in den äußeren Vorhof, auf dem Weg nach Norden[a], und brachte mich zu der Kammer, die gegenüber dem abgesonderten Bereich[b] und gegenüber dem Gebäude nach Norden hin lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „den Weg, den Weg des Nordens“; die Wiederholung ist eine hebräische Richtungsangabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem abgetrennten Ort“. Das hebräische Wort bezeichnet in Hesekiels Tempelvision einen eigens abgegrenzten Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: Dann führte er mich hinaus
  rationale: Der Hifil von יצא bezeichnet das Hinausführen bzw. Hinausbringen. „Führte … hinaus“ ist im Deutschen natürlich und gibt die fortlaufende Erzählung mit „Dann“ wieder.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: in den äußeren Vorhof
  rationale: חָצֵר bezeichnet hier den Hof der Tempelanlage; „Vorhof“ ist der geläufige deutsche Ausdruck in diesem architektonischen Zusammenhang.
- source_word: הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן
  choice: auf dem Weg nach Norden
  rationale: Die Wiederholung von דֶּרֶךְ ist eine hebräische Richtungsangabe. Die gewählte Formulierung erhält sowohl den Weg- als auch den Richtungssinn, ohne im Deutschen unnatürlich zu wirken.
- source_word: וַיְבִאֵנִי
  choice: und brachte mich zu
  rationale: Der Hifil von בוא bedeutet „bringen“ oder „hinführen“. „Brachte mich zu“ bezeichnet das Erreichen des nächsten Ortes, ohne ein Betreten der Kammer vorauszusetzen.
- source_word: הַלִּשְׁכָּה
  choice: zu der Kammer
  rationale: לִשְׁכָּה bezeichnet in Tempelbeschreibungen eine Kammer oder einen Raum. Der Singular des masoretischen Textes bleibt erhalten.
- source_word: נֶגֶד
  choice: gegenüber
  rationale: Das zweimalige נֶגֶד beschreibt die räumliche Lage im Verhältnis zu den beiden genannten Bauteilen; „gegenüber“ passt an beiden Stellen.
- source_word: הַגִּזְרָה
  choice: dem abgesonderten Bereich
  rationale: גִּזְרָה bezeichnet in Hesekiels Tempelvision einen abgegrenzten, besonders ausgesonderten Teil der Anlage. „Abgesonderter Bereich“ wahrt diese Bedeutung, ohne seine genaue Funktion festzulegen.
- source_word: הַבִּנְיָן
  choice: dem Gebäude
  rationale: בִּנְיָן ist eine allgemeine Bezeichnung für ein Gebäude oder Bauwerk; „Gebäude“ ist hier klar und sachlich.
- source_word: אֶל הַצָּפוֹן
  choice: nach Norden hin
  rationale: Die abschließende Richtungsangabe wird eng am hebräischen Wortlaut wiedergegeben. Ihre syntaktische Zuordnung bleibt, wie im Ausgangstext, etwas offen.
