  register: Modernes, würdiges Standarddeutsch mit knapper architektonischer Ausdrucksweise. Die ungewöhnliche räumliche Verdichtung und die Wiederholung von »gegenüber« bleiben erhalten; »Kammern« passt zum formellen Tempelkontext.
