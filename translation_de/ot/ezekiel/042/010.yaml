  text: בְּ/רֹ֣חַב גֶּ֣דֶר הֶ/חָצֵ֗ר דֶּ֧רֶךְ הַ/קָּדִ֛ים אֶל פְּנֵ֧י הַ/גִּזְרָ֛ה וְ/אֶל פְּנֵ֥י הַ/בִּנְיָ֖ן לְשָׁכֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/010.yaml
  text: Along the width of the court wall toward the east[a], facing the separate area and facing the building[b], were chambers.
translation:
  language: de
  text: Entlang der Breite der Hofmauer nach Osten hin, gegenüber dem abgetrennten Bereich und gegenüber dem Gebäude[a], lagen Kammern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Der abgetrennte Bereich« gibt einen Fachausdruck aus Hesekiels Tempelvision wieder, der einen von den umliegenden Bauten abgesonderten Teil der Anlage bezeichnet.
    reason: cultural_note
lexical_decisions:
- source_word: בְּרֹחַב
  choice: an der Breite
  rationale: Die Wendung bezeichnet Lage oder Ausdehnung in Bezug auf die Breite. Die knappe Formulierung bewahrt die räumliche Verdichtung des Hebräischen.
- source_word: גֶּדֶר הֶחָצֵר
  choice: der Hofmauer
  rationale: גֶּדֶר bezeichnet eine Mauer, Einfriedung oder Begrenzung. Im architektonischen Zusammenhang ist »Hofmauer« klar und natürlich.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: nach Osten hin
  rationale: דֶּרֶךְ mit einer Himmelsrichtung kann Richtung oder Lage angeben. »Nach Osten hin« erhält diese Offenheit.
- source_word: אֶל פְּנֵי
  choice: gegenüber
  rationale: Die zweimalige Wendung beschreibt hier die räumliche Ausrichtung zu den genannten Teilen der Anlage; »gegenüber« ist im Deutschen prägnant und architektonisch verständlich.
- source_word: הַגִּזְרָה
  choice: dem abgetrennten Bereich
  rationale: Der Ausdruck ist in Hesekiels Tempelvision eine technische Bezeichnung für einen abgesonderten Teil der Anlage. »Abgetrennter Bereich« wahrt die Grundbedeutung ohne unnötigen Fachjargon.
- source_word: הַבִּנְיָן
  choice: dem Gebäude
  rationale: Das Substantiv bedeutet allgemein »Gebäude« oder »Bauwerk«; »Gebäude« ist die unmittelbarste Entsprechung.
- source_word: לְשָׁכוֹת
  choice: lagen Kammern
  rationale: לְשָׁכוֹת bezeichnet Kammern beziehungsweise Nebenräume. Der hebräische Satz ist verblos und elliptisch; »lagen« ergänzt im Deutschen idiomatisch die räumliche Aussage.
