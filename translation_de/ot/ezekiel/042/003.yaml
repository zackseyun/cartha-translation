base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/003.yaml
  text: Opposite the twenty cubits that belonged to the inner court[a], and opposite the pavement that belonged to the outer court[b], gallery faced gallery in the third story.
translation:
  language: de
  text: Gegenüber den zwanzig Ellen, die zum inneren Vorhof gehörten, und gegenüber dem Pflaster, das zum äußeren Vorhof gehörte, lag Galerie gegenüber Galerie[a], in drei Geschossen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »Galerie« wiedergegebene hebräische Wort ist ein seltener architektonischer Ausdruck. Gemeint sein könnte auch ein Säulengang, eine Vorhalle oder ein ähnlicher oberer Gebäudeteil.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf der dritten Ebene«. Die hebräische Form wird unterschiedlich gedeutet; sie kann die Anordnung in drei Geschossen bzw. Ebenen oder eine dritte Ebene bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגֶד
  choice: gegenüber
  rationale: Die Präposition bezeichnet hier die räumliche Lage auf der anderen Seite beziehungsweise in direkter Gegenlage und passt zur architektonischen Beschreibung.
- source_word: הָעֶשְׂרִים
  choice: den zwanzig Ellen
  rationale: Im Hebräischen steht nur »den zwanzig«; aus dem Bau- und Messkontext ist jedoch eine Strecke von zwanzig Ellen gemeint. Die ergänzte Maßeinheit macht den Satz verständlich.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: die zum inneren Vorhof gehörten
  rationale: Die Präposition ל bezeichnet hier wahrscheinlich die Zuordnung der gemessenen Fläche zum inneren Vorhof. Die Formulierung gibt diese Beziehung in natürlichem Deutsch wieder.
- source_word: רִצְפָה
  choice: Steinpflaster
  rationale: Das Wort bezeichnet im Tempelbereich eine befestigte beziehungsweise gepflasterte Fläche. »Steinpflaster« ist konkret und unterscheidet die Fläche von einem bloßen Fußboden.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: das zum äußeren Vorhof gehörte
  rationale: Wie in der vorherigen Wendung drückt ל hier die räumliche Zuordnung zum Vorhof aus.
- source_word: אַתִּיק
  choice: Galerie
  rationale: Der seltene architektonische Ausdruck bezeichnet wahrscheinlich einen vorspringenden oder offenen oberen Gebäudeteil. »Galerie« ist im Kontext plausibel, doch die genaue Bauform bleibt unsicher und wird in einer Fußnote offengehalten.
- source_word: אֶל־פְּנֵי
  choice: gegenüber
  rationale: Die Wendung beschreibt die Ausrichtung einer Galerie zur anderen. Die Wiederholung »Galerie gegenüber Galerie« bewahrt die knappe räumliche Aussage des Hebräischen.
- source_word: בַּשְּׁלִשִׁים
  choice: im dritten Stockwerk
  rationale: Im Zusammenhang der mehrstöckigen Kammerbauten bezeichnet die Wendung wahrscheinlich die dritte Gebäudeebene. Da auch eine Beziehung zu drei Ebenen möglich ist, wird die Unsicherheit in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Sachlich-gehobene, aber gut verständliche Architektursprache. Die ungewöhnliche Wiederholung »Galerie gegenüber Galerie« wurde beibehalten, weil sie die knappe räumliche Anordnung des Ausgangstextes wiedergibt. Ergänzungen wie »Ellen« und »Stockwerk« sind kontextuell begründet; echte lexikalische Unsicherheiten werden nicht verdeckt, sondern in den Fußnoten ausgewiesen.
