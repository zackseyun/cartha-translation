  text: וְ/הַ/לְּשָׁכ֥וֹת הָ/עֶלְיוֹנֹ֖ת קְצֻר֑וֹת כִּֽי יוֹכְל֨וּ אַתִּיקִ֜ים מֵ/הֵ֗נָה מֵֽ/הַ/תַּחְתֹּנ֛וֹת וּ/מֵ/הַ/תִּֽכֹנ֖וֹת בִּנְיָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/005.yaml
  text: And the upper chambers were narrower[a], because the galleries took away from them, more than from the lower and the middle parts of the building.
translation:
  language: de
  text: Und die oberen Kammern waren schmaler,[a] denn die Galerien nahmen ihnen mehr Raum weg als den unteren und mittleren Kammern des Gebäudes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kürzer“. Der seltene hebräische Ausdruck für „Galerien“ (אַטִּיקִים) kann möglicherweise auch Terrassen, Säulengänge oder Vorsprünge bezeichnen; das genaue Bauelement ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: die Kammern
  rationale: לשכה bezeichnet im Tempel- und Gebäudekontext Nebenräume oder Kammern; „Kammern“ wahrt den architektonischen und kultischen Zusammenhang.
- source_word: הָעֶלְיוֹנֹת
  choice: die oberen
  rationale: Das Adjektiv bezeichnet die obere Ebene im Gegensatz zu den unteren und mittleren Bereichen.
- source_word: קְצֻרוֹת
  choice: waren schmaler
  rationale: Obwohl die Wurzel grundsätzlich „kurz“ bedeuten kann, legt der räumliche Vergleich nahe, dass die oberen Kammern in ihrer Ausdehnung eingeschränkt waren; „schmaler“ gibt dies im Deutschen verständlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die geringere Breite der oberen Kammern ein.
- source_word: יוֹכְלוּ
  choice: nahmen … Raum
  rationale: Die Form von אכל bedeutet wörtlich „verzehrten“; hier beschreibt sie bildlich, dass ein Bauelement Raum beanspruchte.
- source_word: אַתִּיקִים
  choice: die Galerien
  rationale: Der seltene architektonische Ausdruck ist nicht sicher bestimmbar. „Galerien“ ist eine konventionelle, im Kontext plausible Wiedergabe; die Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: מֵהֵנָה
  choice: ihnen
  rationale: Das Pronomen verweist auf die oberen Kammern, denen durch die Galerien Raum entzogen wurde.
- source_word: מֵהַתַּחְתֹּנוֹת וּמֵהַתִּכֹנוֹת
  choice: als den unteren und den mittleren Teilen
  rationale: Die Präpositionalfolge hat im Kontext vergleichende Funktion und stellt die obere Ebene den unteren und mittleren Bereichen gegenüber.
- source_word: בִּנְיָן
  choice: des Gebäudes
  rationale: Der Ausdruck bezeichnet zusammenfassend das errichtete Bauwerk; „Gebäude“ ist klar und sachlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz bleibt nahe an der hebräischen architektonischen Beschreibung, während „nahmen ihnen mehr Raum“ die wörtliche Metapher „verzehrten von ihnen“ verständlich ausdrückt. Die lexikalische Unsicherheit bei קְצֻרוֹת und אַתִּיקִים bleibt durch die Fußnote sichtbar.
