  terminology: „Mauer“, „Kammern“, „äußerer Vorhof“ und „Ellen“ sind für Hesekiels Tempelbeschreibung passend, konsistent und registergerecht. Die Fußnote zu „gegenüber“ hält die mögliche Bedeutung einer parallelen bzw. korrespondierenden Anordnung offen, ohne eine umstrittene räumliche Rekonstruktion festzulegen.
