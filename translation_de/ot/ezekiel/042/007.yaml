  source_fidelity: 'Der Entwurf gibt die Bestandteile des Hebräischen vollständig und in ihrer räumlich-architektonischen Funktion wieder: גָדֵר als „Mauer“, לַחוּץ als Außenlage, לְעֻמַּת als „gegenüber“, die Richtungsangabe zum äußeren Vorhof, אֶל־פְּנֵי als „vor den Kammern“ sowie die Längenangabe von fünfzig Ellen. Die im Hebräischen etwas dichte und aus heutiger Perspektive nicht vollständig eindeutige Abfolge der Lageangaben wird nicht harmonisierend aufgelöst.'
