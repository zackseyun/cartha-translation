  text: וְ/גָדֵ֤ר אֲשֶׁר לַ/חוּץ֙ לְ/עֻמַּ֣ת הַ/לְּשָׁכ֔וֹת דֶּ֛רֶךְ הֶ/חָצֵ֥ר הַ/חִֽצוֹנָ֖ה אֶל פְּנֵ֣י הַ/לְּשָׁכ֑וֹת אָרְכּ֖/וֹ חֲמִשִּׁ֥ים אַמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/007.yaml
  text: And the wall that was outside[a], alongside the chambers, toward the outer court, in front of the chambers—its length was fifty cubits.
translation:
  language: de
  text: Und die Mauer, die außen verlief, den Kammern gegenüber[a], zum äußeren Vorhof hin, vor den Kammern, war fünfzig Ellen lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »parallel zu den Kammern«. Die hebräische Präposition kann eine gegenüberliegende oder eine räumlich entsprechende Ausrichtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָדֵר
  choice: Mauer
  rationale: Im architektonischen Zusammenhang bezeichnet das Wort eine begrenzende oder abtrennende bauliche Struktur; »Mauer« ist natürlicher und angemessener als »Zaun«.
- source_word: לַחוּץ
  choice: außen verlief
  rationale: Die Wendung bezeichnet die Lage außerhalb der Kammern; mit »verlief« wird die räumliche Beschreibung im Deutschen idiomatisch an »Mauer« angeschlossen.
- source_word: לְעֻמַּת
  choice: den Kammern gegenüber
  rationale: Die Präposition bezeichnet eine gegenüberliegende oder korrespondierende Lage. »Gegenüber« wahrt diese räumliche Bedeutung, ohne die genauere Anordnung als zwingend parallel festzulegen.
- source_word: לְּשָׁכוֹת
  choice: Kammern
  rationale: In Hesekiels Tempelvision sind damit eigens bestimmte Räume des Tempelkomplexes gemeint; »Kammern« bewahrt den gehobenen architektonischen Sprachgebrauch.
- source_word: דֶּרֶךְ הֶחָצֵר הַחִיצוֹנָה
  choice: zum äußeren Vorhof hin
  rationale: דֶּרֶךְ hat hier räumliche Funktion und bezeichnet die Richtung beziehungsweise Seite des äußeren Vorhofs.
- source_word: אֶל־פְּנֵי
  choice: vor
  rationale: Die idiomatische Verbindung bezeichnet eine Lage vor beziehungsweise gegenüber den Kammern; »vor« gibt sie knapp und räumlich wieder.
- source_word: אָרְכּוֹ חֲמִשִּׁים אַמָּה
  choice: war fünfzig Ellen lang
  rationale: Die deutsche Prädikativkonstruktion gibt die Maßangabe natürlich wieder und behält die antike Maßeinheit bei.
theological_decisions: []
