base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/018.yaml
  text: 'He measured the south side: five hundred reeds by the measuring reed[a].'
translation:
  language: de
  text: 'Er maß die Südseite: fünfhundert Ruten mit der Messrute.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und alte Übersetzungen lesen in diesem Messzusammenhang „Ellen“ statt „Ruten“; der masoretische Text hat „Ruten“.
    reason: textual_variant
lexical_decisions:
- source_word: ר֥וּחַ הַ/דָּר֖וֹם
  choice: die Südseite
  rationale: רוּחַ kann Wind, Richtung oder Seite bezeichnen. Im Zusammenhang der Grenzvermessung ist die südliche Seite gemeint.
- source_word: מָדָ֑ד
  choice: Er maß
  rationale: מדד bedeutet hier schlicht „messen“. Das Subjekt ist der bereits zuvor genannte Vermesser.
- source_word: חֲמֵשׁ מֵא֥וֹת
  choice: fünfhundert
  rationale: Wiedergabe der gewöhnlichen hebräischen Kardinalzahl.
- source_word: קָנִ֖ים
  choice: Ruten
  rationale: קָנֶה bezeichnet ein Rohr beziehungsweise eine Messrute und dient in Hesekiels Tempelvision als Maßeinheit. „Ruten“ gibt die masoretische Lesart natürlich wieder, ohne sie mit der Variante „Ellen“ zu vermischen.
- source_word: בִּ/קְנֵ֥ה הַ/מִּדָּֽה
  choice: mit der Messrute
  rationale: 'Die Präposition ב ist instrumental: Gemessen wird mithilfe der festgelegten Messrute.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Südseite“ ist im architektonischen Zusammenhang klar; „Ruten“ bewahrt die Maßeinheit des masoretischen Textes. Der Fußnotenmarker steht unmittelbar nach der betreffenden Messangabe.
