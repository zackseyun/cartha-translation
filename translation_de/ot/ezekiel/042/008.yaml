  source_fidelity: 'Die Übersetzung gibt die hebräische Konstruktion sachgerecht wieder: Die Kammern beim äußeren Vorhof haben eine Länge von fünfzig Ellen; der zum Tempel hin gelegene bzw. ihm zugewandte Abschnitt wird mit hundert Ellen angegeben. „Dem Tempel zugewandte Seite“ macht die elliptische räumliche Gegenüberstellung verständlich, ohne eine übermäßig genaue bauliche Rekonstruktion festzulegen.'
  naturalness: Modernes, gut lesbares Standarddeutsch. „Äußerer Vorhof“, „Kammern“ und „Ellen“ passen zum sachlich-sakralen Register des Ezechielbuches. Die Ergänzung „lang“ im zweiten Teilsatz ist im Deutschen sinnvoll.
  terminology: „Kammern“ für לְשָׁכוֹת, „äußerer Vorhof“ für חָצֵר הַחִיצוֹנָה und „Ellen“ für אַמָּה sind konsistent und fachlich angemessen. Die Wiedergabe von עַל־פְּנֵי הַהֵיכָל als „dem Tempel zugewandte Seite“ bleibt innerhalb der räumlichen Mehrdeutigkeit des Hebräischen und stimmt mit dem englischen Audit-Trail („the part facing the temple“) überein.
