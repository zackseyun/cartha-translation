base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/008.yaml
  text: For the length of the chambers that were by the outer court was fifty cubits, and behold, the part facing the temple was a hundred cubits.
translation:
  language: de
  text: Denn die Länge der Kammern am äußeren Vorhof betrug fünfzig Ellen; und siehe, die dem Tempel zugewandte Seite war hundert Ellen lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשָׁכוֹת
  choice: Kammern
  rationale: Bezeichnet die Nebenräume des Tempelkomplexes; „Kammern“ ist sachlich und im baulichen Kontext verständlich.
- source_word: לֶחָצֵר הַחִצוֹנָה
  choice: am äußeren Vorhof
  rationale: Gibt die räumliche Zuordnung knapp und natürlich wieder; חָצֵר bezeichnet hier den äußeren Hofbereich.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: dem Tempel zugewandte Seite
  rationale: Die Wendung ist räumlich, aber im knappen hebräischen Satz nicht völlig eindeutig. Diese Wiedergabe entspricht dem baulichen Vergleich, ohne eine präzisere Geometrie zu behaupten, als der Text bietet.
- source_word: אַמָּה
  choice: Elle
  rationale: Bewahrt die antike Maßeinheit, statt eine unsichere moderne Umrechnung in den Haupttext einzutragen.
