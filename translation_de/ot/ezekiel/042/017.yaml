base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/017.yaml
  text: 'He measured the north side: five hundred reeds[a], by the measuring reed all around.'
translation:
  language: de
  text: 'Er maß die Nordseite: fünfhundert Messruten[a], mit der Messrute ringsum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „fünfhundert Messruten“. Einige Handschriften und alte Übersetzungen bieten eine Lesart, die in manchen Übersetzungen als „fünfhundert Ellen“ wiedergegeben wird. Der Haupttext folgt hier dem masoretischen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  choice: Er maß
  rationale: Das Qal Perfekt 3. Person Singular beschreibt in der fortlaufenden Vision die Messhandlung; das deutsche Präteritum passt zum Erzählzusammenhang.
- source_word: רוּחַ הַצָּפוֹן
  choice: die Nordseite
  rationale: רוּחַ kann Wind, Richtung oder Seite bedeuten. Im architektonischen Zusammenhang bezeichnet die Verbindung die nördliche Seite beziehungsweise Richtung, nicht den Nordwind.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: fünfhundert
  rationale: Direkte Wiedergabe der hebräischen Kardinalzahl.
- source_word: קָנִים
  choice: Messruten
  rationale: קָנֶה bezeichnet ein Rohr beziehungsweise eine Rute und hier die als Maßeinheit dienende Messrute. „Messruten“ macht diese Funktion im Deutschen deutlich und bewahrt den masoretischen Wortlaut gegenüber der Variante „Ellen“.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: mit der Messrute
  rationale: Das instrumentale ב bezeichnet das Mittel beziehungsweise den Maßstab der Messung. „Mit der Messrute“ ist im modernen Deutsch natürlich und sachlich genau.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet die umlaufende beziehungsweise allseitige Messung; „ringsum“ gibt dies knapp und idiomatisch wieder.
theological_decisions: []
