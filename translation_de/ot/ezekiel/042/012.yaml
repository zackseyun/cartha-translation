translation_notes:
  register: Modernes, würdiges Standarddeutsch mit architektonisch verständlicher Wortwahl. Die ungewöhnliche Wiederholung von „Weg“ und die räumliche Mehrdeutigkeit des hebräischen Textes werden nicht durch eine zu konkrete Rekonstruktion eingeebnet.
