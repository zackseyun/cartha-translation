base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/012.yaml
  text: And corresponding to the doorways of the chambers that were toward the south[a], there was a doorway at the head of the way, the way in front of the protective wall, toward the east[b], as one enters them.
translation:
  language: de
  text: Entsprechend den Eingängen der Kammern, die nach Süden lagen, gab es einen Eingang am Anfang eines Weges, eines Weges vor der Schutzmauer[a], eines Weges nach Osten hin, wenn man in sie hineinging.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Schutzmauer“ wiedergegebene hebräische Wort ist selten. Gemeint sein kann auch eine Einfriedungs- oder Sichtschutzmauer.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Satzbau ist hier unsicher. Besonders die mehrfach verwendete Bezeichnung „Weg“ und die genaue Zuordnung von „nach Osten hin“ lassen verschiedene Rekonstruktionen der Anlage zu.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּכְפִתְחֵי
  choice: Entsprechend den Eingängen
  rationale: Das vergleichende כ kennzeichnet eine Entsprechung zu der zuvor beschriebenen Anlage; „entsprechend“ gibt diesen Zusammenhang natürlicher wieder als ein bloßes „wie“.
- source_word: הַלְּשָׁכוֹת
  choice: der Kammern
  rationale: לשכה bezeichnet im Zusammenhang der Tempelanlage Nebenräume oder Kammern; „Kammern“ ist präzise und architektonisch passend.
- source_word: אֲשֶׁר דֶּרֶךְ הַדָּרוֹם
  choice: die nach Süden lagen
  rationale: Die elliptische Richtungsangabe beschreibt Lage oder Ausrichtung, ohne eindeutig festzulegen, ob die Eingänge nach Süden zeigten oder die Kammern auf der Südseite lagen.
- source_word: פֶּתַח
  choice: ein Eingang
  rationale: פתח bezeichnet die Öffnung beziehungsweise den Zugang und nicht zwingend ein bewegliches Türblatt.
- source_word: בְּרֹאשׁ דָּרֶךְ
  choice: am Anfang des Weges
  rationale: ראש bezeichnet hier den Anfang oder Ausgangspunkt eines Weges. „Anfang“ ist im Deutschen klarer als das formal nähere „Kopfende“.
- source_word: דֶּרֶךְ דֶּרֶךְ
  choice: des Weges – des Weges
  rationale: Die auffällige Wiederholung von דרך im Hebräischen wird sichtbar bewahrt; der Gedankenstrich macht die appositionelle Erläuterung auf Deutsch lesbar.
- source_word: בִּפְנֵי הַגְּדֶרֶת הֲגִינָה
  choice: vor der Schutzmauer
  rationale: בפני bedeutet „vor“ beziehungsweise „gegenüber“. גדרת bezeichnet eine Mauer, Einfriedung oder Barriere; das seltene הגינה wird wahrscheinlich funktional als „schützend“ verstanden.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: nach Osten hin
  rationale: Die Wendung gibt eine östliche Richtung oder Orientierung an. Die lockere Anfügung wahrt die syntaktische Unschärfe des schwierigen hebräischen Satzes.
- source_word: בְּבוֹאָן
  choice: wenn man zu ihnen hineinging
  rationale: Der Infinitiv von בוא mit feminin-pluralischem Suffix bezieht sich am ehesten auf die Kammern. Die unpersönliche Formulierung gibt den Vorgang idiomatisch wieder.
