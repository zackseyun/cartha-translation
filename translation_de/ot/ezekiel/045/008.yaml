  text: לָ/אָ֛רֶץ יִֽהְיֶה לּ֥/וֹ לַֽ/אֲחֻזָּ֖ה בְּ/יִשְׂרָאֵ֑ל וְ/לֹא יוֹנ֨וּ ע֤וֹד נְשִׂיאַ/י֙ אֶת עַמִּ֔/י וְ/הָ/אָ֛רֶץ יִתְּנ֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/שִׁבְטֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/008.yaml
  text: This land shall belong to him as a possession in Israel. And my princes shall no longer oppress my people[a], but they shall give the land to the house of Israel according to their tribes.
translation:
  language: de
  text: Dieses Land soll ihm als Besitz in Israel gehören. Meine Fürsten sollen mein Volk nicht länger unterdrücken, und sie sollen das Land dem Haus Israel nach seinen Stämmen zuteilen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָאָרֶץ
  choice: Dieses Land
  rationale: Die vorangestellte Wendung mit ל markiert das Land als Thema. Im Zusammenhang verweist sie auf den zuvor beschriebenen Landanteil; „Dieses Land“ gibt diesen Bezug natürlich wieder.
- source_word: יִהְיֶה לּוֹ
  choice: soll ihm gehören
  rationale: Die hebräische Konstruktion „ihm sein“ drückt Besitz aus; „ihm gehören“ ist im modernen Deutschen idiomatisch und bedeutungsgenau.
- source_word: לַאֲחֻזָּה
  choice: als Besitz
  rationale: אֲחֻזָּה bezeichnet einen dauerhaften Landbesitz beziehungsweise einen zugewiesenen Grundbesitz. „Als Besitz“ bleibt verständlich und vermeidet unnötige Fachsprache.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: 'Die Präposition ist hier örtlich zu verstehen: Der Besitz liegt innerhalb Israels.'
- source_word: יוֹנוּ
  choice: unterdrücken
  rationale: Die Hifil-Form von ינה bezeichnet bedrückendes, ausbeuterisches Handeln. Im politischen Zusammenhang trifft „unterdrücken“ den Sinn.
- source_word: עוֹד
  choice: nicht länger
  rationale: Mit der Verneinung bezeichnet עוֹד das Ende eines bisherigen Zustands oder Verhaltens.
- source_word: נְשִׂיאַי
  choice: meine Fürsten
  rationale: נָשִׂיא ist in Hesekiel ein Herrschertitel. „Fürsten“ bewahrt den Bezug zum Fürsten des unmittelbaren Zusammenhangs und die politische Färbung.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die geläufige und sachlich genaue Wiedergabe der Bundesbezeichnung.
- source_word: וְהָאָרֶץ יִתְּנוּ
  choice: sondern das Land … überlassen
  rationale: 'Das ו verbindet hier zwei gegensätzliche Handlungen: Statt das Volk zu unterdrücken, sollen die Fürsten ihm das Land zukommen lassen. „Sondern“ macht diesen im Zusammenhang angelegten Gegensatz natürlich deutlich; „überlassen“ wahrt die offene Bedeutung von נתן besser als das möglicherweise technischere „zuteilen“.'
- source_word: לְבֵית יִשְׂרָאֵל
  choice: dem Haus Israel
  rationale: „Haus Israel“ bewahrt die charakteristische prophetische Bezeichnung und ist im biblischen Deutsch verständlich.
- source_word: לְשִׁבְטֵיהֶם
  choice: nach seinen Stämmen
  rationale: Die Wendung bezeichnet die Verteilung entsprechend der Stammesgliederung. Das grammatische Bezugswort „Haus Israel“ ist im Deutschen singularisch, daher „seinen“.
theological_decisions:
- issue: Bezug des Pronomens „ihm“ im ersten Satz
  choice: Das Pronomen bleibt unaufgelöst und verweist im Zusammenhang auf den Fürsten.
  alternative: Explizit „dem Fürsten“ einsetzen oder das Herrscheramt kollektiv verstehen.
  rationale: Der unmittelbare Kontext handelt vom Landanteil des Fürsten. Die pronominale Wiedergabe folgt jedoch der Form des hebräischen Textes und vermeidet eine unnötige Ausdeutung.
- issue: Verhältnis zwischen dem Ende der Unterdrückung und der Landüberlassung
  choice: Die beiden Aussagen werden mit „sondern“ als inhaltlicher Gegensatz verbunden.
  alternative: Das hebräische ו neutral mit „und“ wiedergeben.
  rationale: Der masoretische Text enthält beide Aussagen als Teil desselben Verses; im Zusammenhang bildet die ordnungsgemäße Landüberlassung den Gegensatz zum herrscherlichen Missbrauch. Die Übersetzung löst keine theologische Spannung auf, sondern macht den pragmatischen Kontrast im Deutschen sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bezeichnung „Haus Israel“ und dem Herrschertitel „Fürsten“. Der Satzbau ist klar und für heutige Leser verständlich; die Landrechtsterminologie bleibt bewusst untechnisch.
