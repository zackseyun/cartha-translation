base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/019.yaml
  text: And the priest shall take some of the blood of the sin offering and put it on the doorposts of the temple[a], on the four corners of the altar ledge, and on the doorposts of the gate of the inner court.
translation:
  language: de
  text: Und der Priester soll etwas von dem Blut des Sündopfers[a] nehmen und es an den Türpfosten des Tempels, an die vier Ecken des Altarabsatzes und an den Türpfosten des Tores des inneren Vorhofs streichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort kann in Opferzusammenhängen das mit Sünde und ritueller Reinigung verbundene Opfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: soll … nehmen
  rationale: Die Verbform setzt im Zusammenhang die kultische Anweisung fort; die deutsche Soll-Form gibt diesen verpflichtenden Zukunfts- bzw. Anweisungscharakter natürlich wieder.
- source_word: מִדַּם הַחַטָּאת
  choice: etwas von dem Blut des Sündopfers
  rationale: מִן bezeichnet hier eine Teilmenge des Blutes; חַטָּאת benennt im Opferkontext das Opfer, das mit Sünde und Reinigung verbunden ist.
- source_word: וְנָתַן אֶל
  choice: und es … streichen
  rationale: נתן bedeutet grundsätzlich setzen oder anbringen. Im Zusammenhang der rituellen Blutanwendung ist „streichen“ im Deutschen konkret und natürlich, ohne eine zusätzliche Zeremonie vorauszusetzen.
- source_word: מְזוּזַת הַבַּיִת
  choice: an den Türpfosten des Tempels
  rationale: מְזוּזָה bezeichnet den Türpfosten beziehungsweise die seitlichen Pfosten eines Eingangs. הַבַּיִת meint in der Tempelvision das Tempelgebäude.
- source_word: אַרְבַּע פִּנּוֹת הָעֲזָרָה לַמִּזְבֵּחַ
  choice: an die vier Ecken des Altarsockels
  rationale: פִּנּוֹת sind die vier Ecken. עֲזָרָה bezeichnet hier wahrscheinlich den umlaufenden Absatz, Sockel oder die Einfassung des Altars; „Altarsockel“ ist eine knappe, verständliche Wiedergabe, bleibt jedoch architektonisch nicht völlig sicher.
- source_word: מְזוּזַת שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: an den Türpfosten des Tores zum inneren Vorhof
  rationale: Die Formulierung bezeichnet den Pfosten beziehungsweise die Pfosten des Tores, das zum inneren Tempelvorhof gehört; „zum“ macht die deutsche Beziehung klar, ohne eine zusätzliche Ortsangabe einzuführen.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ ist die geläufige und lexikalisch vertretbare Bezeichnung. „Reinigungsopfer“ hebt stärker die reinigende Funktion des Ritus hervor; die bedeutsame Alternative wird in der Fußnote bewahrt.
- issue: Architektonische Deutung von עֲזָרָה beim Altar
  choice: Altarsockel
  alternative: Altarabsatz / Altareinfassung
  rationale: Der Ausdruck bezeichnet in diesem Kontext am ehesten einen Teil der Altararchitektur, dessen vier Ecken mit Blut versehen werden. Da die genaue Bauform unsicher ist, wird keine weitergehende symbolische oder kultische Deutung eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Anweisung. „Tempel“ und „innerer Vorhof“ folgen dem architektonischen Zusammenhang der Vision. Der Fußnotenmarker [a] steht unmittelbar nach dem erklärten Ausdruck.
