- from: Und der Priester soll etwas von dem Blut des Sündopfers[a] nehmen und es an den Türpfosten des Tempels, an die vier Ecken des Altarsockels und an den Türpfosten des Tores zum inneren Vorhof streichen.
  to: Und der Priester soll etwas von dem Blut des Sündopfers[a] nehmen und es an den Türpfosten des Tempels, an die vier Ecken des Altarabsatzes und an den Türpfosten des Tores des inneren Vorhofs streichen.
  rationale: Die Revision vermeidet mit „Altarabsatz“ eine übermäßig bestimmte Rekonstruktion der unsicher identifizierten Altararchitektur und gibt die Zugehörigkeitsbeziehung des Tores zum inneren Vorhof quellennäher wieder. Aussage, Register, Fußnotenanker und die lexikalische Alternative zu חַטָּאת bleiben erhalten.
