source:
  edition: WLC
  text: וּ/בְ/הַפִּֽילְ/כֶ֨ם אֶת הָ/אָ֜רֶץ בְּ/נַחֲלָ֗ה תָּרִימוּ֩ תְרוּמָ֨ה לַ/יהוָ֥ה קֹדֶשׁ֮ מִן הָ/אָרֶץ֒ אֹ֗רֶךְ חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וְ/רֹ֖חַב עֲשָׂ֣רָה אָ֑לֶף קֹדֶשׁ ה֥וּא בְ/כָל גְּבוּלָ֖/הּ סָבִֽיב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/001.yaml
  text: 'And when you divide the land as an inheritance[a], you shall set apart a contribution to Yahweh, a holy portion from the land: twenty-five thousand cubits in length and ten thousand in width[b]. It shall be holy within all its surrounding boundary.'
translation:
  language: de
  text: 'Wenn ihr das Land als Erbbesitz zuteilt[a], sollt ihr für Jahwe eine Abgabe absondern, einen heiligen Teil des Landes: 25.000 Ellen lang und 10.000 Ellen breit[b]. Dieser Bereich soll in seinem ganzen Umfang heilig sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Los als Erbbesitz zuteilt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht nur: „25.000 lang und 10.000 breit“; die Maßeinheit „Ellen“ ist aus dem Zusammenhang ergänzt.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהַפִּילְכֶם
  choice: Wenn ihr … zuteilt
  rationale: Der Hifil von נפל bezeichnet im Zusammenhang der Landverteilung das Zuteilen von Anteilen, wahrscheinlich durch das Los. „Zuteilt“ ist im Deutschen natürlich; das mögliche Losverfahren bleibt in einer Fußnote erhalten.
- source_word: בְּנַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet einen erblich zugewiesenen Besitzanteil. „Erbbesitz“ bewahrt den Zusammenhang von Landzuteilung und bleibendem Besitz.
- source_word: תָּרִימוּ תְרוּמָה
  choice: sollt ihr … eine Abgabe absondern
  rationale: Die Verbindung von רום und תְּרוּמָה meint eine eigens herausgenommene und geweihte Abgabe. „Absondern“ gibt den Vorgang wieder, „Abgabe“ passt hier besser als ein kultisch enger verstandenes „Opfer“, da ein Landstück gemeint ist.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet die Widmung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: קֹדֶשׁ מִן הָאָרֶץ
  choice: einen heiligen Teil des Landes
  rationale: קֹדֶשׁ steht substantivisch für einen geheiligten Bereich. „Teil des Landes“ macht den räumlichen Bezug klar, ohne den Ausdruck unnötig als Verwaltungsbezirk zu bestimmen.
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וְרֹחַב עֲשָׂרָה אָלֶף
  choice: 25.000 Ellen lang und 10.000 Ellen breit
  rationale: Die wiederholte Längenangabe wird in natürliches Deutsch geglättet. Die im Hebräischen nicht ausdrücklich genannte Maßeinheit „Ellen“ wird aus dem Messkontext ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: קֹדֶשׁ הוּא בְכָל גְּבוּלָהּ סָבִיב
  choice: Das ganze Gebiet innerhalb seiner ringsum verlaufenden Grenze soll heilig sein
  rationale: Die Formulierung erfasst die Heiligkeit des gesamten abgegrenzten Landstücks. „Soll … sein“ entspricht dem anweisenden Zukunftsbezug des Abschnitts.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תְרוּמָה im Zusammenhang einer Landzuteilung
  choice: Abgabe
  alternative: Opfergabe
  rationale: Hier wird ein Landstück für Jahwe ausgesondert. „Abgabe“ wahrt den Gedanken einer gewidmeten Zuweisung und vermeidet die unnötige Festlegung auf ein am Altar dargebrachtes Opfer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe an der hebräischen Rechts- und Zuteilungssprache, wird jedoch für heutige Leser geglättet. Fachlich missverständliche Archaismen wie „Hebopfer“ werden vermieden.
