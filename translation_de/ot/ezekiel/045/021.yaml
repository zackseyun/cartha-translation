base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/021.yaml
  text: In the first month[a], on the fourteenth day of the month, you shall have the Passover, a feast of seven days[b]; unleavened bread shall be eaten.
translation:
  language: de
  text: Im ersten Monat, am vierzehnten Tag des Monats, soll für euch das Passa[a] sein, ein Fest von sieben Tagen[b]; ungesäuertes Brot soll gegessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: »das Passa, ein Fest von sieben Tagen«. An anderen Stellen können das Passa und das Fest der ungesäuerten Brote unterschieden werden; hier werden sie unmittelbar zusammen dargestellt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »für sieben Tage«. Die hebräische Wendung lautet wörtlich »Wochen von Tagen« und ist ungewöhnlich; im Kontext wird sie meist als Bezeichnung eines siebentägigen Zeitraums verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשׁוֹן
  choice: Im ersten Monat
  rationale: Im kalendarischen Zusammenhang bezeichnet die Wendung den ersten Monat; »Monat« wird aus der anschließenden Datumsangabe sinngemäß ergänzt.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am vierzehnten Tag des Monats
  rationale: Dies gibt die hebräische Datumsformel präzise und in natürlichem Standarddeutsch wieder.
- source_word: יִהְיֶה לָכֶם
  choice: soll für euch … sein
  rationale: Die Formulierung bewahrt die hebräische Konstruktion und ihren anordnenden Charakter, ohne durch »feiern« eine im Verb nicht ausdrücklich enthaltene Handlung einzutragen.
- source_word: הַפָּסַח
  choice: das Passafest
  rationale: »Passafest« ist im Deutschen eine klare und etablierte Bezeichnung für die kultische Feier; der bestimmte Artikel des Hebräischen bleibt erhalten.
- source_word: חָג
  choice: ein Fest
  rationale: Das Wort bezeichnet hier ein religiöses Fest und steht als nähere Bestimmung zu »Passafest«.
- source_word: שְׁבֻעוֹת יָמִים
  choice: von sieben Tagen
  rationale: Die ungewöhnliche hebräische Wendung bezeichnet im Kontext einen Zeitraum von sieben Tagen; die mögliche wörtlichere Wiedergabe wird in einer Fußnote dokumentiert.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Die Wiedergabe ist im Passakontext sachlich genau und im Deutschen allgemein verständlich.
- source_word: יֵאָכֵל
  choice: soll gegessen werden
  rationale: Das passive Verb und der anordnende Ton des hebräischen Imperfekts werden gewahrt.
theological_decisions:
- issue: Verhältnis des Passa zum siebentägigen Fest
  choice: »das Passafest …, ein Fest von sieben Tagen«
  alternative: Passatag und Fest der ungesäuerten Brote in der Übersetzung deutlich voneinander trennen
  rationale: Der hebräische Text stellt »das Passa« und »ein Fest von sieben Tagen« unmittelbar nebeneinander. Die Übersetzung bewahrt diese Spannung und harmonisiert die Aussage nicht mit Stellen, an denen beide unterschieden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Nähe zum Hebräischen bewahrt die ungewöhnliche Verbindung von Passa und siebentägigem Fest; die passive Schlussformulierung erhält den kultisch-anordnenden Ton.
