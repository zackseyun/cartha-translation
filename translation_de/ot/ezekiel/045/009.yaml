source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה רַב לָ/כֶם֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל חָמָ֤ס וָ/שֹׁד֙ הָסִ֔ירוּ וּ/מִשְׁפָּ֥ט וּ/צְדָקָ֖ה עֲשׂ֑וּ הָרִ֤ימוּ גְרֻשֹֽׁתֵי/כֶם֙ מֵ/עַ֣ל עַמִּ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/009.yaml
  text: 'Thus says the Lord GOD: Enough from you[a], princes of Israel! Remove violence and plunder, and do justice and righteousness. Put away your evictions from my people, declares the Lord GOD.'
translation:
  language: de
  text: 'So spricht Gott, Yahweh: Genug von euch[a], ihr Fürsten Israels! Schafft Gewalttat und Raub fort und übt Recht und Gerechtigkeit. Hört auf, mein Volk zu vertreiben[b], spricht Gott, Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr seid zu weit gegangen“. Der hebräische Ausdruck ist eine scharfe Zurechtweisung: Es ist genug mit dem, was von euch ausgeht.'
    reason: Die knappe hebräische Wendung רַב לָכֶם lässt sich im Deutschen unterschiedlich idiomatisch wiedergeben.
  - marker: b
    text: 'Wörtlicher: „Entfernt eure Vertreibungen von meinem Volk.“ Gemeint sein können auch gewaltsame Verdrängungen oder Enteignungen, besonders von Land und Besitz.'
    reason: Das seltene hebräische Wort גְרֻשֹׁתֵיכֶם bezeichnet ein Forttreiben oder Vertreiben und ist kontextuell nicht auf einen einzigen modernen Rechtsvorgang festgelegt.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Yahweh
  rationale: Die Verbindung aus Herrentitel und Gottesnamen wird unterscheidbar wiedergegeben; „Yahweh“ bewahrt den im hebräischen Text stehenden Eigennamen.
- source_word: רַב לָכֶם
  choice: Genug von euch
  rationale: Die knappe Zurechtweisung wahrt sowohl den Ausruf „Genug!“ als auch das auf die Fürsten bezogene לָכֶם.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: Fürsten Israels
  rationale: „Fürsten“ bewahrt die politische und rangbezogene Bedeutung von נָשִׂיא im Ezechielbuch.
- source_word: חָמָס וָשֹׁד
  choice: Gewalttat und Raub
  rationale: Das Begriffspaar bezeichnet gewaltsames Unrecht und räuberische Aneignung; „Raub“ ist im Deutschen natürlicher und prägnanter als „Plünderung“ als abstrakte Regierungspraxis.
- source_word: הָסִירוּ
  choice: Schafft … fort
  rationale: Der Imperativ fordert, diese Missstände zu beseitigen beziehungsweise einzustellen.
- source_word: מִשְׁפָּט וּצְדָקָה עֲשׂוּ
  choice: übt Recht und Gerechtigkeit
  rationale: „Recht und Gerechtigkeit“ hält die beiden ethischen Leitbegriffe auseinander; „übt“ gibt das idiomatische עֲשׂוּ im Deutschen natürlich wieder.
- source_word: הָרִימוּ גְרֻשֹׁתֵיכֶם מֵעַל עַמִּי
  choice: Hört auf, mein Volk zu vertreiben
  rationale: Die Formulierung gibt den geforderten Abbruch der von den Herrschern ausgehenden Vertreibungen natürlich wieder, ohne den seltenen Ausdruck ausschließlich auf rechtstechnische Zwangsräumungen einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in אֲדֹנָי יְהוִה
  choice: der Herr, Yahweh
  alternative: Gott, der HERR
  rationale: Der Eigenname wird sichtbar bewahrt, während אֲדֹנָי als Herrentitel wiedergegeben wird. Die Apposition vermeidet das missverständliche „Herr HERR“.
- issue: Verhältnis von מִשְׁפָּט und צְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: Recht und das Rechte
  rationale: Die traditionelle und inhaltlich gewichtige Begriffspaarung bleibt erhalten, ohne beide hebräischen Wörter zu einem einzigen modernen Konzept zu verschmelzen.
- issue: Reichweite von גְרֻשֹׁתֵיכֶם
  choice: mein Volk zu vertreiben
  alternative: eure Zwangsräumungen von meinem Volk wegzunehmen
  rationale: Der seltene Ausdruck kann Vertreibungen, Verdrängung oder Enteignung einschließen. Der Haupttext wahrt die breite Grundbedeutung; die kontextuell mögliche Land- und Eigentumsdimension wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Direktheit. Die Anrede „ihr Fürsten Israels“ macht den Adressatenwechsel natürlich hörbar. Der seltene Ausdruck für Vertreibungen wird im Haupttext verständlich verbalisiert und in der Fußnote semantisch offengehalten.
