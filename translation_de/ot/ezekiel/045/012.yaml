  text: וְ/הַ/שֶּׁ֖קֶל עֶשְׂרִ֣ים גֵּרָ֑ה עֶשְׂרִ֨ים שְׁקָלִ֜ים חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים שְׁקָלִ֗ים עֲשָׂרָ֤ה וַ/חֲמִשָּׁה֙ שֶׁ֔קֶל הַ/מָּנֶ֖ה יִֽהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/012.yaml
  text: And the shekel shall be twenty gerahs[a]; twenty shekels, twenty-five shekels[b], and fifteen shekels shall be your mina.
translation:
  language: de
  text: Der Schekel soll zwanzig Gera[a] haben. Eure Mine soll zwanzig Schekel, fünfundzwanzig Schekel und fünfzehn Schekel[b] betragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Gera war eine kleine Gewichts- und Geldeinheit; zwanzig Gera entsprachen nach diesem Vers einem Schekel.
    reason: cultural_note
  - marker: b
    text: Wörtlich auch „Mane“. Die genannten Beträge ergeben zusammen sechzig Schekel. Diese Festsetzung weicht von anderen antiken Standards für die Mine ab und bezeichnet wahrscheinlich den besonderen Standard dieser Tempelordnung.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: הַשֶּׁקֶל
  choice: der Schekel
  rationale: Die herkömmliche deutsche Bezeichnung für die antike Gewichts- und Geldeinheit; der bestimmte Artikel kennzeichnet hier den verbindlichen Standardschekel.
- source_word: גֵּרָה
  choice: Gera
  rationale: Die kleinere antike Gewichts- beziehungsweise Geldeinheit wird transliteriert, statt durch einen ungenauen modernen Wert ersetzt zu werden. Nach einer Zahl bleibt die Einheitsbezeichnung im Deutschen idiomatisch unverändert.
- source_word: שְׁקָלִים / שֶׁקֶל
  choice: Schekel
  rationale: Die Einheitsbezeichnung wird in der gesamten Zahlenreihe einheitlich wiedergegeben; im Deutschen lautet der Plural ebenfalls „Schekel“.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים
  choice: fünfundzwanzig
  rationale: Natürliche moderne deutsche Wiedergabe der Zahl.
- source_word: עֲשָׂרָה וַחֲמִשָּׁה
  choice: fünfzehn
  rationale: Natürliche moderne deutsche Wiedergabe der Zahl.
- source_word: הַמָּנֶה
  choice: eine Mine
  rationale: „Mine“ ist die etablierte deutsche Bezeichnung der größeren antiken Gewichts- und Geldeinheit. Der unbestimmte Artikel fügt sich in die deutsche Ergebniskonstruktion ein.
- source_word: יִהְיֶה לָכֶם
  choice: sollen bei euch … ergeben
  rationale: Die Formulierung drückt einen für die Angesprochenen geltenden verbindlichen Standard aus und gibt zugleich den summierenden Sinn der aufgezählten Schekelwerte natürlich wieder.
theological_decisions:
- issue: Ungewöhnliche Zusammensetzung der Mine
  choice: Die drei überlieferten Werte zwanzig, fünfundzwanzig und fünfzehn werden unverändert als Summe von sechzig Schekel wiedergegeben.
  alternative: Die Zahlen nach anderen antiken Maßsystemen oder aufgrund vermuteter Textkorrekturen angleichen.
  rationale: Der masoretische Text ist eindeutig überliefert, auch wenn diese Rechnung von anderen antiken Festsetzungen der Mine abweicht. Eine Harmonisierung würde die Eigenart von Ezechiels Vorschrift beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antiken Maßeinheiten bleiben unmodernisiert. Zwei kurze Hauptsätze vermeiden eine schwer verständliche Nachbildung der gedrängten hebräischen Reihung, ohne deren ungewöhnliche Zahlenfolge zu glätten.
