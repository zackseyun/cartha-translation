source:
  edition: WLC
  text: וְ/לַ/נָּשִׂ֡יא מִ/זֶּ֣ה וּ/מִ/זֶּה֩ לִ/תְרוּמַ֨ת הַ/קֹּ֜דֶשׁ וְ/לַ/אֲחֻזַּ֣ת הָ/עִ֗יר אֶל פְּנֵ֤י תְרֽוּמַת הַ/קֹּ֨דֶשׁ֙ וְ/אֶל פְּנֵי֙ אֲחֻזַּ֣ת הָ/עִ֔יר מִ/פְּאַת יָ֣ם יָ֔מָּ/ה וּ/מִ/פְּאַת קֵ֖דְמָ/ה קָדִ֑ימָ/ה וְ/אֹ֗רֶךְ לְ/עֻמּוֹת֙ אַחַ֣ד הַ/חֲלָקִ֔ים מִ/גְּב֥וּל יָ֖ם אֶל גְּב֥וּל קָדִֽימָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/007.yaml
  text: And for the prince there shall be land on both sides of the holy district and the property of the city[a], adjoining the holy district and adjoining the property of the city, from the west side westward and from the east side eastward; and in length corresponding to one of the tribal portions[b], from the western border to the eastern border.
translation:
  language: de
  text: 'Und für den Fürsten soll Land auf beiden Seiten des heiligen Bezirks und des Grundbesitzes der Stadt liegen[a], angrenzend an den heiligen Bezirk und an den Grundbesitz der Stadt: von der Westseite nach Westen und von der Ostseite nach Osten. Seine Länge soll der eines der Stammesanteile entsprechen, von der Westgrenze bis zur Ostgrenze.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann der Ausdruck auch „heilige Abgabe“ oder „heiliger Anteil“ heißen. Hier bezeichnet er die für das Heiligtum ausgesonderte Landfläche.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Westen“ lautet hier wörtlich „Meer“. In Ezechiels Gebietsbeschreibungen dient „Meer“ als Richtungsangabe für Westen.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּשִׂיא
  choice: für den Fürsten
  rationale: נָשִׂיא bezeichnet bei Ezechiel gewöhnlich den staatlichen Herrscher. „Fürst“ wahrt diesen etablierten Sprachgebrauch, ohne eine genauere Amtsform festzulegen.
- source_word: מִזֶּה וּמִזֶּה
  choice: auf beiden Seiten
  rationale: Die idiomatische Wendung bezeichnet die Flächen zu beiden Seiten des heiligen Bezirks und des städtischen Grundbesitzes.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: heiliger Bezirk
  rationale: תְּרוּמָה meint hier im Zusammenhang der Landverteilung eine ausgesonderte Landfläche, nicht eine Geld- oder Sachgabe.
- source_word: אֲחֻזַּת הָעִיר
  choice: Grundbesitz der Stadt
  rationale: אֲחֻזָּה bezeichnet einen dauerhaften Besitz, besonders Landbesitz; „Grundbesitz“ passt zum vermessungsrechtlichen Kontext.
- source_word: אֶל־פְּנֵי ... וְאֶל־פְּנֵי
  choice: angrenzend an ... und an
  rationale: Die Wendung bedeutet wörtlich „vor dem Angesicht von“, bezeichnet in dieser Grenzbeschreibung aber die räumliche Nachbarschaft.
- source_word: מִפְּאַת יָם יָמָּה
  choice: von der Westseite nach Westen
  rationale: יָם bedeutet wörtlich „Meer“, dient in den territorialen Beschreibungen jedoch als Richtungsangabe für Westen. Die Wiederholung der Richtungsangabe wird bewahrt.
- source_word: וּמִפְּאַת קֵדְמָה קָדִימָה
  choice: von der Ostseite nach Osten
  rationale: Die spiegelbildliche Grenzformel wird entsprechend der hebräischen Wiederholung wiedergegeben.
- source_word: וְאֹרֶךְ
  choice: Seine Länge soll
  rationale: Der knappe Nominalsatz wird im Deutschen für eine klare und natürliche Maßangabe verbal ergänzt.
- source_word: לְעֻמּוֹת אַחַד הַחֲלָקִים
  choice: der eines der Stammesanteile entsprechen
  rationale: לְעֻמּוֹת drückt Entsprechung beziehungsweise parallele Ausrichtung aus; aus dem Kontext sind mit den Anteilen die Stammesgebiete gemeint.
- source_word: מִגְּבוּל יָם אֶל־גְּבוּל קָדִימָה
  choice: von der Westgrenze bis zur Ostgrenze
  rationale: Die Grenzformel bezeichnet die vollständige Ausdehnung zwischen der westlichen und östlichen Grenze.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Kataster- und Grenzsprache. Die formelhafte Ost-West-Symmetrie des Hebräischen bleibt erhalten; übermäßig wörtliche und im Deutschen missverständliche Wendungen werden behutsam idiomatisiert.
