source:
  edition: WLC
  text: הָ/אֵיפָ֣ה וְ/הַ/בַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָ/שֵׂ֕את מַעְשַׂ֥ר הַ/חֹ֖מֶר הַ/בָּ֑ת וַ/עֲשִׂירִ֤ת הַ/חֹ֨מֶר֙ הָֽ/אֵיפָ֔ה אֶל הַ/חֹ֖מֶר יִהְיֶ֥ה מַתְכֻּנְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/011.yaml
  text: The ephah and the bath shall be of one measure[a], so that the bath may hold a tenth of a homer, and the ephah a tenth of a homer[c][b]; their standard shall be according to the homer.
translation:
  language: de
  text: Das Efa und das Bat sollen das gleiche Maß haben, sodass das Bat ein Zehntel eines Homers fasst und das Efa ein Zehntel eines Homers.[a] Ihr Maß soll sich nach dem Homer richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Homer war ein größeres Hohlmaß; Efa (für trockene Güter) und Bat (für Flüssigkeiten) entsprachen jeweils einem Zehntel davon. »Kor« ist eine traditionelle Alternativbezeichnung für das Homer.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיפָה
  choice: Efa
  rationale: Bezeichnet ein antikes Trockenmaß ohne genaues modernes Äquivalent; die im Deutschen geläufige Transliteration bewahrt den Fachbegriff.
- source_word: בַּת
  choice: Bat
  rationale: Bezeichnet ein antikes Flüssigkeitsmaß; die Transliteration wahrt die spezifische Maßeinheit.
- source_word: תֹּכֶן אֶחָד
  choice: das gleiche Maß
  rationale: Die Wendung bezeichnet hier eine übereinstimmende festgelegte Größe beziehungsweise Kapazität beider Maße.
- source_word: לָשֵׂאת
  choice: fasst
  rationale: Im Zusammenhang mit Hohlmaßen bezeichnet der Infinitiv idiomatisch die Aufnahmekapazität.
- source_word: מַעְשַׂר / עֲשִׂירִת
  choice: ein Zehntel
  rationale: Beide parallelen Ausdrücke bezeichnen quantitativ jeweils den zehnten Teil und nicht einen kultischen Zehnten.
- source_word: חֹמֶר
  choice: Homer
  rationale: Die größere Bezugsmaßeinheit wird entsprechend der hebräischen Form transliteriert; »Kor« ist eine traditionelle Alternativbezeichnung.
- source_word: אֶל הַחֹמֶר ... מַתְכֻּנְתּוֹ
  choice: Ihr Maß soll sich nach dem Homer richten
  rationale: Gibt den Homer als maßgebenden Bezugsstandard wieder. Das grammatisch singularische Suffix wird sinngemäß auf die gemeinsam behandelten Maße Efa und Bat bezogen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antiken Maßeinheiten werden transliteriert, während ihre Beziehung zueinander im Haupttext klar formuliert und in der Fußnote erläutert wird.
