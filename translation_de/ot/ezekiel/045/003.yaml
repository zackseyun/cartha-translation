  text: וּ/מִן הַ/מִּדָּ֤ה הַ/זֹּאת֙ תָּמ֔וֹד אֹ֗רֶךְ חמש וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֣רֶת אֲלָפִ֑ים וּ/בֽ/וֹ יִהְיֶ֥ה הַ/מִּקְדָּ֖שׁ קֹ֥דֶשׁ קָדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/003.yaml
  text: From this measured area you shall measure a length of twenty-five thousand and a width of ten thousand[a], and in it shall be the sanctuary, the most holy place.
translation:
  language: de
  text: Von diesem abgemessenen Gebiet sollst du eine Länge von 25.000 und eine Breite von 10.000 abmessen. Darin soll das Heiligtum sein, das Allerheiligste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Hochheiliges“ bzw. „hochheilig“. Die Wendung kann das Heiligtum als „Allerheiligstes“ bezeichnen oder seine höchste Heiligkeit hervorheben.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וּמִן הַמִּדָּה הַזֹּאת
  choice: Von diesem abgemessenen Gebiet
  rationale: מִדָּה kann eine Messung oder einen abgemessenen Anteil bezeichnen. Im Zusammenhang der Landzuteilung ist „abgemessenes Gebiet“ konkreter und natürlicher als „Maß“.
- source_word: תָּמֹד
  choice: sollst du … abmessen
  rationale: Das Qal-Imperfekt 2. Person Maskulin Singular von מדד gibt hier eine an den Seher gerichtete Anweisung wieder.
- source_word: אֹרֶךְ חמש וְעֶשְׂרִים אֶלֶף וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: der 25.000 Ellen lang und 10.000 Ellen breit ist
  rationale: Die substantivischen Maßangaben werden in natürliches modernes Deutsch übertragen. „Ellen“ ist aus dem Zusammenhang ergänzt und durch eine Fußnote kenntlich gemacht.
- source_word: וּבוֹ
  choice: Darin
  rationale: Das Präpositionalgefüge verweist unmittelbar auf den zuvor abgemessenen Bereich zurück.
- source_word: הַמִּקְדָּשׁ
  choice: das Heiligtum
  rationale: מִקְדָּשׁ bezeichnet den heiligen Ort beziehungsweise Heiligtumsbereich und wird im Kontext von Ezechiels Tempelvision angemessen mit „Heiligtum“ wiedergegeben.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: das Hochheilige
  rationale: Die hebräische Steigerungsform bezeichnet etwas von höchster Heiligkeit. „Das Hochheilige“ bewahrt hier eher als das feststehende „Allerheiligste“ die mögliche appositionelle oder prädikative Beziehung zum Heiligtum.
theological_decisions:
- issue: Beziehung von קֹדֶשׁ קָדָשִׁים zu הַמִּקְדָּשׁ
  choice: das Heiligtum … das Hochheilige
  alternative: das Heiligtum, das Allerheiligste / das Heiligtum, das hochheilig ist
  rationale: Der knappe hebräische Wortlaut lässt offen, ob קֹדֶשׁ קָדָשִׁים das Heiligtum appositionell bezeichnet oder seine höchste Heiligkeit aussagt. Die gewählte Form bewahrt diese Spannung, während die traditionelle Wiedergabe in einer Fußnote genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anweisung an den Seher bleibt erhalten; die Maßangaben sind idiomatisch formuliert, und die kultische Steigerungsform wird ohne konfessionelle Festlegung wiedergegeben.
