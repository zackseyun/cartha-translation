revisions:
- from: Von diesem abgemessenen Gebiet sollst du einen Bereich abmessen, der 25.000 Ellen lang und 10.000 Ellen breit ist.[a] Darin soll das Heiligtum liegen, das Hochheilige.[b]
  to: Von diesem abgemessenen Gebiet sollst du eine Länge von 25.000 und eine Breite von 10.000 abmessen. Darin soll das Heiligtum sein, das Allerheiligste.[a]
  rationale: Die Revision entfernt die nicht im hebräischen Text genannte und in ihrer Bestimmung unsichere Maßeinheit sowie den zusätzlichen „Bereich“. Sie bewahrt die Anweisung, die Dimensionsangaben und den Rückverweis „darin“. „Das Allerheiligste“ ist die idiomatische deutsche Wiedergabe der kultischen Superlativform; die Fußnote hält die knappe, syntaktisch nicht weiter markierte hebräische Form offen.
