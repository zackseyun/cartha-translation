    issue: Unbelegte Maßeinheit im Text und in Fußnote a
    rationale: Der hebräische Vers nennt keine Maßeinheit. Ob die großen Landmaße als Ellen oder anders zu verstehen sind, wird im Kontext und in der Forschung unterschiedlich beurteilt. „Ellen“ im Lauftext und die Festlegung in der Fußnote gehen über den Wortlaut hinaus.
  - severity: medium
    issue: Zusatz „einen Bereich“
    rationale: תָּמֹד regiert unmittelbar die Längen- und Breitenangabe. Ein zusätzlicher „Bereich“ ist möglich als erläuternde Umschreibung, legt aber einen abgetrennten Teilbereich innerhalb des gemessenen Gebiets nahe.
  - severity: low
