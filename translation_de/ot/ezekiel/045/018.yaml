  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ תִּקַּ֥ח פַּר בֶּן בָּקָ֖ר תָּמִ֑ים וְ/חִטֵּאתָ֖ אֶת הַ/מִּקְדָּֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/018.yaml
  text: 'Thus says the Lord GOD: In the first month[a], on the first day of the month, you shall take a bull from the herd without blemish, and you shall purify the sanctuary.'
translation:
  language: de
  text: 'So spricht Gott, der HERR: Im ersten Monat, am ersten Tag des Monats, sollst du einen makellosen Stier aus der Rinderherde nehmen und das Heiligtum reinigen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Heiligtum Sühne vollziehen“. Das hebräische Verb ist hier ein Ausdruck für rituelle Reinigung beziehungsweise für die Beseitigung einer durch Sünde verursachten Verunreinigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die feste Verbindung des Herrentitels mit dem Gottesnamen wird in einer im Deutschen geläufigen und würdigen Form wiedergegeben; die Schreibung „GOTT“ kennzeichnet, dass hier JHWH steht, und vermeidet die schwer verständliche Doppelung „Herr HERR“.
- source_word: בָּרִאשׁוֹן
  choice: Im ersten Monat
  rationale: Obwohl das Substantiv „Monat“ erst im folgenden Datumsausdruck erscheint, ist der kalendarische Bezug eindeutig. Im Deutschen muss er für einen natürlichen Satz ausdrücklich genannt werden.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Wörtlich steht „am Einen des Monats“; dies ist die übliche hebräische Datumsangabe für den ersten Monatstag.
- source_word: תִּקַּח
  choice: sollst du … nehmen
  rationale: Das Imperfekt hat in dieser kultischen Anweisung auffordernde beziehungsweise verpflichtende Kraft. „Sollst du“ gibt dies in natürlichem deutschem Regelungsstil wieder.
- source_word: פַּר בֶּן בָּקָר
  choice: einen Stier aus der Rinderherde
  rationale: Die Wortgruppe bezeichnet einen männlichen Vertreter des Rindviehs. Die Wiedergabe vermeidet eine nicht zwingend festgelegte Altersangabe.
- source_word: תָּמִים
  choice: der ohne Makel ist
  rationale: Im Opferkontext bezeichnet das Wort die kultische Fehlerlosigkeit des Tieres. „Ohne Makel“ ist dafür die klare und etablierte deutsche Wendung.
- source_word: וְחִטֵּאתָ
  choice: und … reinigen[a]
  rationale: Der Piel-Stamm von חטא bezeichnet hier eine rituelle Beseitigung von Sünde beziehungsweise Verunreinigung. „Reinigen“ ist verständlich, ohne so zu klingen, als habe das Heiligtum selbst gesündigt; die alternative Sühnebedeutung bleibt in der Fußnote sichtbar.
- source_word: הַמִּקְדָּשׁ
  choice: das Heiligtum
  rationale: מִקְדָּשׁ bezeichnet den geheiligten Ort beziehungsweise den sakralen Bereich. „Heiligtum“ bewahrt diesen umfassenden Bezug, ohne ihn unnötig auf ein einzelnes Gebäude einzuengen.
theological_decisions:
- issue: Wiedergabe des rituellen Verbs חטא mit dem Heiligtum als Objekt
  choice: das Heiligtum reinigen
  alternative: für das Heiligtum Sühne vollziehen; das Heiligtum entsündigen
  rationale: Der hebräische Ausdruck beschreibt eine kultische Handlung, durch die Sünde oder ihre verunreinigende Wirkung vom Heiligtum entfernt wird. „Reinigen“ gibt die Funktion klar wieder; die Fußnote bewahrt die ebenfalls mögliche und theologisch bedeutsame Sühneterminologie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die kultischen Begriffe „ohne Makel“ und „Heiligtum“ bleiben erhalten, während unnötig altertümliche Formulierungen vermieden werden. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ritualverb.
