base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/015.yaml
  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
translation:
  language: de
  text: und ein Stück Kleinvieh von je zweihundert aus den gut bewässerten Weidegebieten Israels[a] – für Speiseopfer, Brandopfer und Friedensopfer, um für sie Sühne zu erwirken –, Spruch des Herrn Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem bewässerten Land Israels“; möglicherweise auch: „aus dem ertragreichen Weideland Israels“. Der hebräische Ausdruck bezieht sich wahrscheinlich auf gut bewässertes Weideland.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֶׂה אַחַת
  choice: und ein Stück Kleinvieh
  rationale: שֶׂה bezeichnet ein einzelnes Tier vom Kleinvieh, also ein Schaf oder eine Ziege, ohne hier Alter, Geschlecht oder Tierart eindeutig festzulegen. „Ein Stück Kleinvieh“ bewahrt diese Bedeutungsbreite.
- source_word: מִן הַצֹּאן מִן הַמָּאתַיִם
  choice: von je zweihundert
  rationale: 'Die Konstruktion gibt ein Abgabenverhältnis an: ein Tier aus jeweils zweihundert Tieren der Herde.'
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  choice: aus den gut bewässerten Weidegebieten Israels
  rationale: מַשְׁקֶה hängt mit Tränken oder Bewässern zusammen und bezeichnet hier wahrscheinlich das bewässerte Land, aus dem die Herdentiere stammen. Die Wiedergabe macht den landwirtschaftlichen Zusammenhang verständlich, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: לְמִנְחָה
  choice: für das Speiseopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang gewöhnlich das unblutige Speise- beziehungsweise Getreideopfer. „Speiseopfer“ ist im Deutschen als Opferbezeichnung etabliert.
- source_word: וּלְעוֹלָה
  choice: das Brandopfer
  rationale: עוֹלָה ist die übliche Bezeichnung für das vollständig verbrannte Opfer.
- source_word: וְלִשְׁלָמִים
  choice: die Friedensopfer
  rationale: שְׁלָמִים bezeichnet Opfer des Wohlergehens oder Friedens. „Friedensopfer“ bewahrt die traditionelle kultische Benennung und vermeidet die engere Deutung „Gemeinschaftsopfer“.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: um für sie Sühne zu erwirken
  rationale: Die Formulierung gibt die kultische Funktion von כפר wieder, ohne eine bestimmte Theorie der Sühne festzulegen. „Für sie“ wahrt den Bezug des hebräischen Pronomens.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Jahwe
  rationale: נְאֻם ist eine göttliche Ausspruchsformel. אֲדֹנָי wird mit „der Herr“ wiedergegeben, während der Eigenname יהוה als „Jahwe“ erscheint, sodass beide Bestandteile sichtbar bleiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und vermeidet die schwer verständliche Doppelung „Herr HERR“. Sie macht zugleich sichtbar, dass im Ausgangstext der Eigenname steht.
- issue: Bedeutung von כפר
  choice: Sühne erwirken
  alternative: entsühnen; für sie Sühne schaffen
  rationale: Die Formulierung erhält die kultisch-theologische Tragweite des Verbs, ohne den Mechanismus der Sühne näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der elliptische hebräische Anschluss der Opferbestimmungen wird durch „Diese Abgaben sollen … bestimmt sein“ verständlich entfaltet. „Ein Stück Kleinvieh“ wahrt die im Hebräischen offene Zuordnung zu Schaf oder Ziege.
