source:
  edition: WLC
  text: קֹ֣דֶשׁ מִן הָ/אָ֜רֶץ ה֗וּא לַ/כֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַ/מִּקְדָּשׁ֙ יִֽהְיֶ֔ה הַ/קְּרֵבִ֖ים לְ/שָׁרֵ֣ת אֶת יְהוָ֑ה וְ/הָיָ֨ה לָ/הֶ֤ם מָקוֹם֙ לְ/בָ֣תִּ֔ים וּ/מִקְדָּ֖שׁ לַ/מִּקְדָּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/004.yaml
  text: It is a holy portion of the land; it shall be for the priests[a], the ministers of the sanctuary, who draw near to minister to Yahweh. And it shall be for them as a place for houses and as a holy place for the sanctuary.
translation:
  language: de
  text: Ein heiliger Teil des Landes soll den Priestern gehören, die im Heiligtum Dienst tun und herantreten, um Jahwe zu dienen. Er soll ihnen als Platz für Häuser und als heiliger Bezirk für das Heiligtum dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als heiliger Ort für das Heiligtum“. Der hebräische Ausdruck ist knapp und kann einen geweihten Bereich bezeichnen, der zum Heiligtum gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ מִן־הָאָרֶץ
  choice: ein heiliger Teil des Landes
  rationale: קֹדֶשׁ bezeichnet im Zusammenhang der Landzuteilung einen ausgesonderten heiligen Anteil; מִן ist partitiv zu verstehen.
- source_word: מְשָׁרְתֵי הַמִּקְדָּשׁ
  choice: die im Heiligtum Dienst tun
  rationale: Die verbale Formulierung ist im modernen Deutschen natürlicher als „Diener des Heiligtums“ und bewahrt den kultischen Dienstbezug.
- source_word: הַקְּרֵבִים
  choice: die herantreten
  rationale: „Herantreten“ erhält die priesterlich-kultische Bedeutung des Nahens vor Gott.
- source_word: לְשָׁרֵת אֶת־יְהוָה
  choice: um Jahwe zu dienen
  rationale: „Dienen“ ist idiomatisch und erfasst hier den priesterlichen Dienst; der Gottesname wird als Jahwe wiedergegeben.
- source_word: מָקוֹם לְבָתִּים
  choice: Platz für Häuser
  rationale: Die Wendung bezeichnet den den Priestern zugewiesenen Wohnraum und bleibt eng am hebräischen Wortlaut.
- source_word: וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: und als heiliger Bezirk für das Heiligtum
  rationale: Die knappe, schwierige Wendung wird als geweihter Bereich verstanden, der zum Heiligtum gehört; „Bezirk“ vermeidet die nicht ausdrücklich genannte Ergänzung „Land“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ gibt den persönlichen Bundesnamen wieder.
- issue: Bezug von וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: heiliger Bezirk für das Heiligtum
  alternative: heiliger Ort für das Heiligtum
  rationale: Die Formulierung wahrt den sakralen Charakter, ohne festzulegen, ob ein Gebäude oder das geweihte Areal gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Sprache bleibt erkennbar, wird aber ohne unnötig altertümliche Amtsbezeichnungen formuliert.
