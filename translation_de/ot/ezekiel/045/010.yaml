  text: Ihr sollt gerechte Waagen, ein gerechtes Efa[a] und ein gerechtes Bat[b] haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Efa war ein althebräisches Hohlmaß für trockene Güter.
