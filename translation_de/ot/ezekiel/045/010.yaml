lexical_decisions:
- source_word: מֹאזְנֵי
  choice: Waage
  rationale: Die hebräische Dual-/Pluralform bezeichnet ein Wägeinstrument. Im modernen Deutschen ist „Waage“ die natürliche Sammelbezeichnung.
- source_word: צֶדֶק
  choice: ehrlich
  rationale: Das dreimal wiederholte Wort bezeichnet hier die Rechtmäßigkeit und Verlässlichkeit von Handelsmaßen. „Ehrlich“ gibt die ethische und praktische Aussage idiomatisch wieder; formal wäre auch „gerecht“ möglich.
- source_word: אֵיפַת
  choice: Efa
  rationale: Bezeichnet ein bestimmtes althebräisches Hohlmaß, besonders für trockene Güter. Die Umschrift bewahrt die konkrete Maßeinheit; eine Fußnote erklärt sie.
- source_word: בַת
  choice: Bat
  rationale: Bezeichnet ein bestimmtes althebräisches Hohlmaß, besonders für Flüssigkeiten. Die Umschrift bewahrt die Parallelität mit Efa; eine Fußnote erklärt die Einheit.
- source_word: יְהִי לָכֶם
  choice: Ihr sollt … haben
  rationale: Die Jussivform mit לָכֶם hat in diesem Rechtszusammenhang verpflichtenden Charakter. „Ihr sollt … haben“ ist klar, würdig und natürlich.
