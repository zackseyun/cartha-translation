source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/נָּשִׂיא֙ בַּ/יּ֣וֹם הַ/ה֔וּא בַּעֲד֕/וֹ וּ/בְעַ֖ד כָּל עַ֣ם הָ/אָ֑רֶץ פַּ֖ר חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/022.yaml
  text: On that day the prince shall provide[a], for himself and for all the people of the land, a bull as a sin offering.
translation:
  language: de
  text: An jenem Tag soll der Fürst für sich und für das ganze Volk des Landes einen Stier als Sündopfer[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann das Opfer bezeichnen, das Sünde oder Unreinheit beseitigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: soll … darbringen
  rationale: עשׂה bedeutet grundsätzlich „tun/machen“, bezeichnet im Opferkontext aber idiomatisch das Zubereiten oder Darbringen eines Opfers. „Darbringen“ gibt die kultische Handlung im Deutschen natürlich und präzise wieder.
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: נָשִׂיא bezeichnet bei Ezechiel regelmäßig den politischen Amtsträger innerhalb der Tempelvision. „Fürst“ bewahrt diese besondere Amtsbezeichnung.
- source_word: בַּיּוֹם הַהוּא
  choice: An diesem Tag
  rationale: Die Zeitangabe wird in modernem Standarddeutsch unmittelbar und idiomatisch wiedergegeben.
- source_word: בַּעֲדוֹ
  choice: für sich
  rationale: בעד mit Pronominalsuffix bezeichnet hier, zu wessen Gunsten beziehungsweise stellvertretend das Opfer dargebracht wird.
- source_word: וּבְעַד כָּל עַם הָאָרֶץ
  choice: und für das ganze Volk des Landes
  rationale: Die Wendung bezeichnet hier umfassend die Bevölkerung des Landes, für die der Fürst das Opfer darbringt.
- source_word: פַּר
  choice: einen Stier
  rationale: פַּר bezeichnet im Opferkontext einen Stier; ein bestimmtes junges Alter wird im Vers nicht ausdrücklich angegeben.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im Zusammenhang mit dem Stier bezeichnet חַטָּאת eindeutig eine Opferart. „Sündopfer“ ist die geläufige deutsche Bezeichnung; die mögliche kultische Nuance eines Reinigungsopfers wird in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im kultischen Zusammenhang
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Das Wort bezeichnet hier nicht abstrakt die Sünde, sondern das Opfer, das Sünde oder Unreinheit beseitigt. „Sündopfer“ wahrt den vertrauten biblischen Begriff, während die Fußnote die sachlich mögliche Alternative nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält den Fürsten als handelnde Person und die doppelte Zweckangabe klar hervor; „darbringen“ entspricht dem kultischen Kontext, ohne die Bedeutung unnötig auszuweiten.
