base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/014.yaml
  text: And the fixed due of oil shall be one bath of oil from each cor[a], from ten baths, that is, one homer[c][b], for ten baths are one homer.
translation:
  language: de
  text: Und die festgesetzte Abgabe an Öl beträgt ein Zehntel eines Bat je Kor. Zehn Bat sind ein Homer, denn zehn Bat sind ein Homer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bat, Kor und Homer sind altisraelitische Maße. Der hebräische Text schreibt ein Zehntel eines Bat Öl je Kor vor und erklärt: Zehn Bat entsprechen einem Homer.'
    reason: cultural_note
lexical_decisions:
- source_word: חֹק
  choice: festgesetzte Abgabe
  rationale: Im Zusammenhang der vorgeschriebenen Abgaben bezeichnet חֹק den verbindlich festgelegten Anteil, nicht ein Gesetz im abstrakten Sinn.
- source_word: שֶּׁמֶן
  choice: Öl
  rationale: Das Wort bezeichnet Öl, im damaligen Kontext gewöhnlich Olivenöl; da die Ölsorte nicht ausdrücklich genannt wird, bleibt die allgemeinere Wiedergabe erhalten.
- source_word: הַבַּת הַשֶּׁמֶן
  choice: nach Bat bemessen
  rationale: Die knappe hebräische Maßformel wird als Angabe der Bemessungsweise verstanden. So bleibt der Bezug auf das Bat als Flüssigkeitsmaß klar, ohne eine im Deutschen missverständliche Wiederholung zu erzeugen.
- source_word: מַעְשַׂר הַבַּת מִן הַכֹּר
  choice: ein Zehntel Bat von jedem Kor
  rationale: מַעְשַׂר bedeutet ausdrücklich ein Zehntel. Die Wiedergabe bewahrt daher die im masoretischen Text vorgeschriebene Menge von einem Zehntel Bat je Kor und macht daraus nicht ein ganzes Bat.
- source_word: כֹּר
  choice: Kor
  rationale: Das alte Hohlmaß wird transliteriert, statt durch einen unsicheren modernen Näherungswert ersetzt zu werden.
- source_word: עֲשֶׂרֶת הַבַּתִּים
  choice: zehn Bat
  rationale: Die schlichte Zahlenangabe erklärt das Verhältnis der antiken Maßeinheiten.
- source_word: חֹמֶר
  choice: Homer
  rationale: Das technische Maßwort wird transliteriert; der Vers selbst erläutert sein Verhältnis zum Bat.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier eine begründende beziehungsweise erläuternde Wiederholung der Maßgleichung ein. „Denn“ erhält diesen Zusammenhang und glättet die Wiederholung nicht weg.
