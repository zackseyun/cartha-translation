  text: All the people of the land shall give this contribution to the prince in Israel[a][b].
translation:
  language: de
  text: Das ganze Volk des Landes soll dem Fürsten in Israel diese Abgabe leisten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Das ganze Volk des Landes soll zu dieser Abgabe für den Fürsten in Israel sein.“ Gemeint ist wahrscheinlich, dass das Volk die festgesetzte Abgabe für den Fürsten bereitstellen soll.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „Abgabe“ übersetzte hebräische Wort terumah bezeichnet einen ausgesonderten Anteil oder eine Gabe. Je nach Betonung sind auch „Beitrag“, „Opfergabe“ oder „Tribut“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעָם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die Wendung bezeichnet die Gesamtheit der Bevölkerung des Landes. „Volk des Landes“ bewahrt den hebräischen Ausdruck und passt zum rechtlich-prophetischen Zusammenhang.
- source_word: יִהְיוּ אֶל
  choice: soll … leisten
  rationale: Wörtlich steht „soll … zu/für … sein“. Im Zusammenhang einer festgesetzten Abgabe bezeichnet die idiomatische Wendung die Verpflichtung, diese bereitzustellen. „Leisten“ gibt den verlangten Vorgang natürlich wieder, ohne den Pflichtcharakter zu überzeichnen.
- source_word: הַתְּרוּמָה
  choice: Abgabe
  rationale: תְּרוּמָה ist ein ausgesonderter Anteil beziehungsweise eine Gabe für heilige oder amtliche Zwecke. Hier verbindet der Kontext kultische und öffentliche Aspekte; „Abgabe“ ist verständlich und lässt beide anklingen.
- source_word: הַזֹּאת
  choice: diese
  rationale: Das Demonstrativpronomen verweist auf die zuvor näher bestimmte Abgabe.
- source_word: לַנָּשִׂיא
  choice: für den Fürsten
  rationale: נָשִׂיא bezeichnet bei Ezechiel den Fürsten beziehungsweise politischen Herrscher, ohne ihn ausdrücklich „König“ zu nennen. Das ל bezeichnet hier den Empfänger beziehungsweise den Zweck der Bereitstellung.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Wiedergabe erhält die hebräische Präposition ב und beschreibt den Herrschafts- oder Wirkungsbereich des Fürsten.
