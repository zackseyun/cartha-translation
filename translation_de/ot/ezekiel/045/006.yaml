  text: וַ/אֲחֻזַּ֨ת הָ/עִ֜יר תִּתְּנ֗וּ חֲמֵ֤שֶׁת אֲלָפִים֙ רֹ֔חַב וְ/אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ לְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/006.yaml
  text: And as the city's property[a], you shall give an area five thousand wide and twenty-five thousand long, alongside the holy contribution[b]; it shall belong to the whole house of Israel.
translation:
  language: de
  text: Als Grundbesitz der Stadt sollt ihr ein Gebiet geben, das fünftausend breit und fünfundzwanzigtausend lang ist, entsprechend der heiligen Abgabe[a]. Es soll dem ganzen Haus Israel[b] gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „neben der heiligen Abgabe“ oder „parallel zur heiligen Abgabe“. Der hebräische Ausdruck kann sowohl räumliche Ausrichtung als auch Entsprechung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Haus Israel“ ist eine Sammelbezeichnung für das Volk Israel.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזַּת הָעִיר
  choice: Grundbesitz der Stadt
  rationale: אֲחֻזָּה bezeichnet einen Besitz, besonders zugewiesenen Landbesitz. „Grundbesitz der Stadt“ ist im Zusammenhang der Landverteilung präzise und in modernem Deutsch natürlich.
- source_word: תִּתְּנוּ
  choice: sollt ihr … geben
  rationale: נתן bedeutet gewöhnlich „geben“. Die Soll-Form gibt den anordnenden Charakter des Abschnitts wieder, ohne das Verb unnötig zu spezialisieren.
- source_word: חֲמֵשֶׁת אֲלָפִים רֹחַב
  choice: fünftausend breit
  rationale: Die knappe Maßangabe des Hebräischen wird beibehalten. Da der Vers selbst keine Maßeinheit nennt, wird im Haupttext keine ergänzt.
- source_word: וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: fünfundzwanzigtausend lang
  rationale: Die koordinierte Längenangabe wird klar und nah an der hebräischen Formulierung wiedergegeben.
- source_word: לְעֻמַּת
  choice: parallel zu
  rationale: לְעֻמַּת kann räumliche Gegenüberstellung, Ausrichtung oder Entsprechung bezeichnen. „Parallel zu“ passt zur Lage des städtischen Landstreifens und wahrt den Gedanken gleicher Ausrichtung; die weitere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: heilige Landabgabe
  rationale: תְּרוּמָה bezeichnet etwas Abgesondertes bzw. als Abgabe Dargebrachtes; hier ist konkret ein geweihter Landanteil gemeint. „Landabgabe“ erhält sowohl den kultischen als auch den räumlichen Sinn.
- source_word: לְכָל בֵּית יִשְׂרָאֵל יִהְיֶה
  choice: Es soll dem ganzen Haus Israel gehören
  rationale: Das Dativgefüge mit היה drückt hier Zugehörigkeit aus. „Haus Israel“ bewahrt die feste kollektive Bezeichnung, während „gehören“ den Sinn in idiomatischem Deutsch ausdrückt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Maßeinheit bleibt wie im hebräischen Vers unausgesprochen. Die knappen Maßangaben werden leicht syntaktisch entfaltet, damit der Satz auf Deutsch klar lesbar bleibt.
