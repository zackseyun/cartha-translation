  text: וְ/עַֽל הַ/נָּשִׂ֣יא יִהְיֶ֗ה הָ/עוֹל֣וֹת וְ/הַ/מִּנְחָה֮ וְ/הַ/נֵּסֶךְ֒ בַּ/חַגִּ֤ים וּ/בֶ/חֳדָשִׁים֙ וּ/בַ/שַּׁבָּת֔וֹת בְּ/כָֽל מוֹעֲדֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֽוּא יַעֲשֶׂ֞ה אֶת הַ/חַטָּ֣את וְ/אֶת הַ/מִּנְחָ֗ה וְ/אֶת הָֽ/עוֹלָה֙ וְ/אֶת הַ/שְּׁלָמִ֔ים לְ/כַפֵּ֖ר בְּעַ֥ד בֵּֽית יִשְׂרָאֵֽל־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/017.yaml
  text: And the burnt offerings[a], the grain offering, and the drink offering at the feasts, at the new moons, and at the Sabbaths—at all the appointed times of the house of Israel—shall be the prince’s responsibility. He shall provide the sin offering, the grain offering, the burnt offering, and the peace offerings[b], to make atonement for the house of Israel.
translation:
  language: de
  text: Der Fürst ist verantwortlich für die Brandopfer, das Speisopfer und das Trankopfer bei den Festen, den Neumonden und den Sabbaten – bei allen Festzeiten des Hauses Israel. Er soll das Sündopfer[a], das Speisopfer, das Brandopfer und die Friedensopfer[b] bereitstellen, um für das Haus Israel Sühne zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gemeinschaftsopfer“ beziehungsweise „Heilsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַנָּשִׂיא יִהְיֶה
  choice: fallen dem Fürsten zu
  rationale: עַל mit היה bezeichnet hier eine dem Fürsten auferlegte Zuständigkeit. Die deutsche Wendung gibt diese Verpflichtung natürlich wieder, ohne zu behaupten, dass er die priesterlichen Handlungen persönlich vollzieht.
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: נָשִׂיא bezeichnet in diesem Abschnitt den politischen beziehungsweise gesellschaftlichen Leiter. „Fürst“ wahrt den Sprachgebrauch in Ezechiel, ohne ihn als König zu bestimmen.
- source_word: הָעוֹלוֹת / הָעוֹלָה
  choice: die Brandopfer / das Brandopfer
  rationale: עוֹלָה bezeichnet das vollständig verbrannte Opfer. Numerus und generischer Gebrauch des hebräischen Textes werden beibehalten.
- source_word: הַמִּנְחָה
  choice: das Speisopfer
  rationale: מִנְחָה bezeichnet im Opferkontext die unblutige, vor allem aus Getreide bestehende Opfergabe. „Speisopfer“ ist im Deutschen präzise und etabliert.
- source_word: הַנֵּסֶךְ
  choice: das Trankopfer
  rationale: נֶסֶךְ ist eine ausgegossene Opfergabe; „Trankopfer“ ist die klare und geläufige deutsche Entsprechung.
- source_word: בַּחַגִּים וּבֶחֳדָשִׁים וּבַשַּׁבָּתוֹת
  choice: an den Festen, Neumonden und Sabbaten
  rationale: Die kultischen Kalenderbegriffe werden direkt und in natürlichem Deutsch wiedergegeben.
- source_word: בְּכָל מוֹעֲדֵי בֵּית יִשְׂרָאֵל
  choice: an allen festgesetzten Zeiten des Hauses Israel
  rationale: מוֹעֲדִים bezeichnet festgesetzte Zeiten beziehungsweise Termine. „Festgesetzte Zeiten“ erhält den weiteren Sinn und vermeidet eine Gleichsetzung ausschließlich mit den bereits genannten Festen.
- source_word: הוּא יַעֲשֶׂה
  choice: Er soll … bereitstellen
  rationale: עשה kann im Opferkontext das Bereiten oder Beschaffen der Opfer bezeichnen. Im Zusammenhang mit der Zuständigkeit des Fürsten drückt „bereitstellen“ seine Verantwortung aus, ohne ihm ausdrücklich eine priesterliche Funktion zuzuschreiben.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: חַטָּאת bezeichnet hier die Opferart. Die traditionelle Wiedergabe ist verständlich; die mögliche funktionale Nuance „Reinigungsopfer“ wird in einer Fußnote bewahrt.
- source_word: הַשְּׁלָמִים
  choice: die Friedensopfer
  rationale: שְׁלָמִים wird traditionell als „Friedensopfer“ wiedergegeben. Weitere Bedeutungsaspekte wie Gemeinschaft und Wohlergehen werden in der Fußnote genannt.
- source_word: לְכַפֵּר בְּעַד
  choice: um für … Sühne zu erwirken
  rationale: כפר bezeichnet im Opferkontext den Vollzug beziehungsweise die Bewirkung von Sühne. Die Formulierung wahrt die kultische Aussage, ohne eine spätere Sühnetheorie einzutragen.
theological_decisions:
- issue: Rolle des Fürsten beim Opferdienst
  choice: Der Fürst trägt die Verantwortung, die vorgeschriebenen Opfer bereitzustellen.
  alternative: Der Fürst vollzieht die Opfer persönlich in priesterlicher Funktion.
  rationale: Die Konstruktion legt dem Fürsten die Verpflichtung auf; עשה kann hier das Bereitstellen umfassen. Der Text zwingt nicht zu der Annahme, er führe eigenhändig priesterliche Handlungen aus.
- issue: Bedeutung der Sühneaussage
  choice: Die kultische Sprache von Sühne für das Haus Israel bleibt stehen.
  alternative: Die Aussage wird durch eine bestimmte spätere systematisch-theologische Erklärung paraphrasiert.
  rationale: Der hebräische Text spricht im Rahmen der Tempelvision von כפר. Die Übersetzung erhält diese Aussage, ohne ihre theologische Spannung durch zusätzliche Lehrbegriffe aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit etablierter Opfersprache. Der Gedankenstrich gliedert die Aufzählung, ohne die hebräische Satzstruktur unnötig zu verflachen. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Opferbezeichnungen.
