source:
  edition: WLC
  text: זֹ֥את הַ/תְּרוּמָ֖ה אֲשֶׁ֣ר תָּרִ֑ימוּ שִׁשִּׁ֤ית הָֽ/אֵיפָה֙ מֵ/חֹ֣מֶר הַֽ/חִטִּ֔ים וְ/שִׁשִּׁיתֶם֙ הָֽ/אֵיפָ֔ה מֵ/חֹ֖מֶר הַ/שְּׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/013.yaml
  text: 'This is the contribution that you shall offer: one-sixth of an ephah from each homer of wheat[a], and one-sixth of an ephah from each homer of barley.'
translation:
  language: de
  text: 'Dies ist die Abgabe, die ihr entrichten sollt: ein Sechstel Efa von jedem Homer Weizen[a] und ein Sechstel Efa von jedem Homer Gerste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa und Homer sind antike Hohlmaße für trockene Güter; vorgeschrieben ist eine feste Getreideabgabe von einem Sechstel Efa je Homer.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמָה
  choice: Abgabe
  rationale: Im administrativ-kultischen Zusammenhang bezeichnet das Wort einen ausgesonderten und dargebrachten Anteil. „Abgabe“ gibt den fest bemessenen Charakter natürlich und präzise wieder.
- source_word: תָּרִימוּ
  choice: die ihr entrichten sollt
  rationale: Der Hifil von רום bildet mit תְּרוּמָה eine feste Verbindung für das Darbringen einer Abgabe. „Entrichten“ passt im Deutschen zu einer festgesetzten Abgabe, ohne das wörtliche Bild des Hochhebens aufzudrängen.
- source_word: שִׁשִּׁית
  choice: ein Sechstel
  rationale: Der Ausdruck bezeichnet hier eindeutig den sechsten Teil einer Maßeinheit.
- source_word: אֵיפָה
  choice: Efa
  rationale: Die Transliteration bewahrt die genaue Bezeichnung des antiken Hohlmaßes.
- source_word: חֹמֶר
  choice: Homer
  rationale: Die Transliteration gibt das im Hebräischen verwendete antike Hohlmaß direkt wieder.
- source_word: מֵחֹמֶר
  choice: von jedem Homer
  rationale: Die Präposition bezeichnet die aus einer Maßeinheit zu entnehmende Menge; „jedem“ verdeutlicht den in der Regelung vorausgesetzten distributiven Sinn.
- source_word: הַחִטִּים
  choice: Weizen
  rationale: Bei Getreidebezeichnungen steht im natürlichen Deutschen in einer Maßangabe kein Artikel.
- source_word: וְשִׁשִּׁיתֶם
  choice: und ein Sechstel
  rationale: Die ungewöhnliche Form steht in klarer Parallele zur ersten Bruchangabe und wird entsprechend wiedergegeben.
- source_word: הַשְּׂעֹרִים
  choice: Gerste
  rationale: Die artikellose Wiedergabe entspricht dem natürlichen deutschen Sprachgebrauch bei Maßangaben.
