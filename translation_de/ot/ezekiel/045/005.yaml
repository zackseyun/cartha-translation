  text: וַ/חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים רֹ֑חַב יהיה לַ/לְוִיִּם֩ מְשָׁרְתֵ֨י הַ/בַּ֧יִת לָ/הֶ֛ם לַ/אֲחֻזָּ֖ה עֶשְׂרִ֥ים לְשָׁכֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/005.yaml
  text: And an area twenty-five thousand long and ten thousand wide shall be for the Levites[a], the ministers of the house, for their possession[b], with twenty chambers.
translation:
  language: de
  text: Und ein Gebiet, 25.000 lang und 10.000 breit, soll den Leviten, die am Haus[a] Dienst tun, als Grundbesitz gehören, mit zwanzig Kammern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist hier der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder möglicherweise: „als ihr Grundbesitz für zwanzig Kammern/Räume“. Die Schlussphrase ist im Hebräischen syntaktisch schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַחֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ
  choice: 25.000 lang
  rationale: Die hebräische Zahlenfolge wird in der im Deutschen üblichen Reihenfolge wiedergegeben. אֹרֶךְ bezeichnet hier die Längenausdehnung; eine Maßeinheit wird nicht ergänzt, da sie in diesem Vers nicht ausdrücklich steht.
- source_word: וַעֲשֶׂרֶת אֲלָפִים רֹחַב
  choice: 10.000 breit
  rationale: רֹחַב bezeichnet die Breitenausdehnung. Die adjektivische Formulierung ist im Deutschen natürlich und entspricht der parallelen Maßangabe.
- source_word: יהיה לַלְוִיִּם
  choice: soll den Leviten … gehören
  rationale: Das Imperfekt weist das Gebiet in der visionären Ordnung den Leviten zu. „Soll … gehören“ verbindet den zuweisenden Sinn mit natürlichem modernem Deutsch.
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: die am Haus Dienst tun
  rationale: Die Partizipialverbindung bezeichnet die Leviten durch ihren kultischen Dienst. „Dienst tun“ vermeidet die mögliche moderne kirchenamtliche Nebenbedeutung von „Diener“ oder „Amtsträger“.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die wörtliche Bezeichnung „Haus“ bleibt im Haupttext erhalten; im Zusammenhang ist damit der Tempel gemeint, was die Fußnote erläutert.
- source_word: לָהֶם לַאֲחֻזָּה
  choice: als Grundbesitz gehören
  rationale: אֲחֻזָּה bezeichnet einen dauerhaften Land- oder Grundbesitz. Die Formulierung gibt sowohl die Zuweisung an die Leviten als auch den Charakter des Besitzes idiomatisch wieder.
- source_word: עֶשְׂרִים לְשָׁכֹת
  choice: mit zwanzig Kammern
  rationale: לְשָׁכֹת bezeichnet Kammern oder Räume, besonders im Umfeld des Heiligtums. Das vorangestellte „mit“ gibt eine mögliche Anbindung der syntaktisch schwierigen Schlussphrase wieder, ohne ihre Unsicherheit zu verschweigen.
theological_decisions:
- issue: Bezug von „Haus“
  choice: Die wörtliche Bezeichnung „Haus“ bleibt im Text; der Tempelbezug wird in einer Fußnote erklärt.
  alternative: „Tempel“ unmittelbar im Haupttext
  rationale: So bleibt die Bild- und Wortwahl des Hebräischen sichtbar, während der kultische Bezug für heutige Leser eindeutig erläutert wird.
- issue: Anbindung der Schlussphrase עֶשְׂרִים לְשָׁכֹת
  choice: „mit zwanzig Kammern“
  alternative: „als Besitz für zwanzig Kammern/Räume“
  rationale: Die hebräische Syntax ist ungewöhnlich und lässt die genaue Beziehung der Schlussphrase offen. Die Hauptfassung ist lesbar; die alternative Anbindung wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Maßangaben bleiben ohne ergänzte Maßeinheit, da der hebräische Vers keine nennt. „Am Haus Dienst tun“ ist verständlich und kultisch passend, ohne ein späteres kirchliches Amt einzutragen. Die echte syntaktische Unsicherheit am Versende wird nicht geglättet, sondern in der Fußnote offengelegt.
