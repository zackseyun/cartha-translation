  text: בַּ/שְּׁבִיעִ֡י בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בֶּ/חָ֔ג יַעֲשֶׂ֥ה כָ/אֵ֖לֶּה שִׁבְעַ֣ת הַ/יָּמִ֑ים כַּֽ/חַטָּאת֙ כָּ/עֹלָ֔ה וְ/כַ/מִּנְחָ֖ה וְ/כַ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/025.yaml
  text: 'In the seventh month[a], on the fifteenth day of the month, at the feast, he shall provide the same offerings for seven days: the sin offering, the burnt offering, the grain offering[b], and the oil.'
translation:
  language: de
  text: 'Im siebten Monat, am fünfzehnten Tag des Monats, beim Fest[a], soll er sieben Tage lang dieselben Opfer[b] bereitstellen: das Sündopfer, das Brandopfer, das Getreideopfer und das Öl.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »während des Festes« beziehungsweise »am Fest«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »soll er sieben Tage lang dergleichen tun, wie beim Sündopfer, beim Brandopfer, beim Getreideopfer und beim Öl«; gemeint sind die zuvor vorgeschriebenen Opfergaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁבִיעִי
  choice: Im siebten Monat
  rationale: Die Ordinalzahl ist hier zusammen mit der folgenden Datumsangabe zeitlich zu verstehen; »Monat« wird im Deutschen zur Klarheit ergänzt.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am fünfzehnten Tag des Monats
  rationale: Dies entspricht der üblichen hebräischen Datumsformel und ist zugleich natürliches, gehobenes Deutsch.
- source_word: בֶּחָג
  choice: beim Fest
  rationale: חָג bezeichnet ein Fest, insbesondere ein Wallfahrtsfest. »Beim Fest« wahrt die knappe zeitliche Einordnung; auch »während des Festes« ist möglich.
- source_word: יַעֲשֶׂה כָאֵלֶּה
  choice: soll er ... dieselben Opfer bereitstellen
  rationale: Wörtlich steht »soll er dergleichen tun«. Im Opferkontext verweist die Wendung auf die zuvor festgelegten Gaben. »Bereitstellen« entspricht der Verantwortung des Fürsten, ohne ihm ausdrücklich die priesterliche Darbringung zuzuschreiben.
- source_word: שִׁבְעַת הַיָּמִים
  choice: sieben Tage lang
  rationale: Die Wendung bezeichnet die Dauer des Festzeitraums; die deutsche Formulierung gibt sie idiomatisch wieder.
- source_word: כַּחַטָּאת
  choice: das Sündopfer
  rationale: חַטָּאת ist hier die etablierte Opferbezeichnung. Das Präfix כ markiert innerhalb der Aufzählung die entsprechende Regelung und muss im Deutschen nicht bei jedem Glied eigens wiedergegeben werden.
- source_word: כָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; »Brandopfer« ist die geläufige deutsche Fachbezeichnung.
- source_word: וְכַמִּנְחָה
  choice: das Speisopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang das unblutige, meist aus Getreide bestehende Opfer. »Speisopfer« ist die eingebürgerte und prägnante deutsche Bezeichnung.
- source_word: וְכַשָּׁמֶן
  choice: und das Öl
  rationale: Der bestimmte Artikel im Hebräischen verweist auf das vorgeschriebene begleitende Öl; die Bestimmtheit bleibt erhalten.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von יַעֲשֶׂה
  choice: »er« bezieht sich im unmittelbaren Zusammenhang auf den Fürsten
  alternative: ein nicht näher bestimmter Opfernder oder Kultdiener
  rationale: Der vorangehende Abschnitt weist dem Fürsten wiederholt die Versorgung mit den Opfergaben zu. Das bloße Pronomen »er« bewahrt dennoch die Ausdrucksweise des Hebräischen.
- issue: Handlung des Fürsten im Opferdienst
  choice: »bereitstellen«
  alternative: »darbringen« oder wörtlicher »tun«
  rationale: »Bereitstellen« gibt seine im Kontext beschriebene Verantwortung wieder, ohne ihm eine priesterliche Funktion zuzuschreiben; »tun« wäre im Deutschen an dieser Stelle unklar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe »Sündopfer«, »Brandopfer« und »Speisopfer« bleiben erhalten. Die etwas dunkle hebräische Wendung יַעֲשֶׂה כָאֵלֶּה wird im Haupttext verständlich aufgelöst und in der Fußnote formal näher abgebildet.
