base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
translation:
  language: de
  text: Ebenso sollst du es am siebten Tag des Monats wegen eines Menschen tun, der sich unwissentlich verfehlt, und wegen eines Unerfahrenen.[a] So sollt ihr Sühne für das Haus[b] erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen jedes Menschen, der sich unabsichtlich oder aus Unerfahrenheit verfehlt“. Das Hebräische kann entweder zwei Personengruppen unterscheiden oder die Unerfahrenheit als Art des Fehlgehens beschreiben.'
    reason: syntaktische und lexikalische Alternative
  - marker: b
    text: 'Wörtlich: „das Haus“. Gemeint ist der Tempel beziehungsweise das Heiligtum.'
    reason: Erläuterung des hebräischen Ausdrucks „das Haus“
lexical_decisions:
- source_word: וְכֵן
  choice: Ebenso
  rationale: Das Wort knüpft an die zuvor angeordnete Reinigungshandlung an und leitet eine entsprechende Wiederholung ein.
- source_word: תַּעֲשֶׂה
  choice: sollst du es tun
  rationale: Das häufige Verb bezeichnet hier die Durchführung der vorgeschriebenen Ritualhandlung; das ergänzte „es“ stellt den Rückbezug im Deutschen natürlich her.
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  choice: am siebten Tag des Monats
  rationale: Die hebräische Wendung ist elliptisch; „Tag“ wird für klares, idiomatisches Deutsch ergänzt.
- source_word: מֵאִישׁ שֹׁגֶה
  choice: wegen eines Menschen, der sich unwissentlich verfehlt
  rationale: מִן bezeichnet hier den Anlass der Reinigung. שׁגה meint ein irrtümliches beziehungsweise nicht vorsätzliches Fehlgehen; „sich unwissentlich verfehlen“ wahrt sowohl den Irrtumsaspekt als auch den kultisch-rechtlichen Zusammenhang.
- source_word: וּמִפֶּתִי
  choice: und wegen eines Unerfahrenen
  rationale: Die wiederholte Präposition und das Substantiv sprechen zunächst für eine zweite Personenbezeichnung. „Unerfahrener“ gibt den naiven, unkundigen oder einfältigen Menschen wieder, ohne unnötig abwertend zu klingen.
- source_word: וְכִפַּרְתֶּם
  choice: So sollt ihr … entsühnen
  rationale: כפר bezeichnet bei einem Heiligtum dessen kultische Reinigung beziehungsweise Entsühnung. Die deutsche Formulierung gibt zudem den im Hebräischen auffälligen Wechsel vom Singular „du“ zum Plural „ihr“ wieder.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: Wörtlich steht „das Haus“; im Zusammenhang von Ezechiels Vision ist damit der Tempel beziehungsweise das Heiligtum gemeint. Die wörtliche Bildsprache bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
theological_decisions:
- issue: Bezug von מֵאִישׁ שֹׁגֶה וּמִפֶּתִי
  choice: 'Zwei parallel bezeichnete Personengruppen: ein sich unwissentlich Verfehlender und ein Unerfahrener'
  alternative: Eine Person, die sich unabsichtlich oder aus Unerfahrenheit verfehlt
  rationale: Die wiederholte Präposition מִן vor פֶּתִי begünstigt die Unterscheidung zweier Gruppen, doch die knappe Syntax lässt auch eine modale Deutung zu. Diese bleibt in der Fußnote ausdrücklich erhalten.
- issue: Ziel der Entsühnung
  choice: Das Haus beziehungsweise der Tempel wird entsühnt
  alternative: Für das Haus wird Sühne erwirkt
  rationale: הַבָּיִת ist das direkte Objekt von כפר. Die Übersetzung hält daher den auf das Heiligtum gerichteten Vollzug fest, ohne weiter auszuführen, wie die Verfehlungen der Menschen es verunreinigen.
- issue: Numeruswechsel der Anrede
  choice: „sollst du“ und anschließend „sollt ihr“
  alternative: Durchgehend Singular oder durchgehend Plural zur stilistischen Glättung
  rationale: Der masoretische Text wechselt unvermittelt vom Singular תַּעֲשֶׂה zum Plural וְכִפַּרְתֶּם. Da dieser Wechsel textlich echt und möglicherweise bedeutsam ist, wird er nicht stillschweigend vereinheitlicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt im kultischen Zusammenhang verständlich, bewahrt aber mit „das Haus“ die hebräische Bezeichnung. Der auffällige Wechsel von Singular zu Plural wird bewusst erhalten.
