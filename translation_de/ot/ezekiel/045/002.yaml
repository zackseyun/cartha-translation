  text: יִהְיֶ֤ה מִ/זֶּה֙ אֶל הַ/קֹּ֔דֶשׁ חֲמֵ֥שׁ מֵא֛וֹת בַּ/חֲמֵ֥שׁ מֵא֖וֹת מְרֻבָּ֣ע סָבִ֑יב וַ/חֲמִשִּׁ֣ים אַמָּ֔ה מִגְרָ֥שׁ ל֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/002.yaml
  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
translation:
  language: de
  text: Davon soll für den heiligen Bereich[a] ein Quadrat von fünfhundert mal fünfhundert abgemessen sein, und eine Freifläche[b] von fünfzig Ellen soll ihn ringsum umgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Heiligtum“. Das hebräische Wort קֹדֶשׁ kann hier allgemein den heiligen Bereich bezeichnen und muss nicht allein das Heiligtumsgebäude meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Weideland“ oder „Gemeindeland“. Gemeint ist die umliegende offene Fläche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּה
  choice: Davon
  rationale: Die Wendung verweist auf das zuvor beschriebene Landstück und bezeichnet den Anteil, der daraus genommen beziehungsweise zugewiesen wird.
- source_word: אֶל הַקֹּדֶשׁ
  choice: für den heiligen Bereich
  rationale: Die Präposition bezeichnet hier die Zuweisung. קֹדֶשׁ kann in diesem Vermessungszusammenhang den gesamten geheiligten Bezirk und nicht nur das Heiligtumsgebäude meinen.
- source_word: חֲמֵשׁ מֵאוֹת בַּחֲמֵשׁ מֵאוֹת
  choice: fünfhundert mal fünfhundert Ellen
  rationale: Die deutsche Maßformel „mal“ gibt die beiden Abmessungen natürlich wieder. „Ellen“ ist im ersten Satzteil sinngemäß ergänzt, da die Maßeinheit im unmittelbaren Zusammenhang ausdrücklich genannt wird.
- source_word: מְרֻבָּע סָבִיב
  choice: ein ringsum quadratisches Stück
  rationale: Die Formulierung bewahrt die geometrische Aussage und macht im Deutschen deutlich, dass ein abgegrenztes Flächenstück gemeint ist.
- source_word: מִגְרָשׁ
  choice: Freifläche
  rationale: Das Wort bezeichnet unbebautes beziehungsweise offenes Land um einen abgegrenzten Ort. „Freifläche“ ist gegenwärtig verständlich und legt weder ausschließlich Weideland noch moderne Vorstadtbebauung nahe.
- source_word: לוֹ סָבִיב
  choice: ringsum soll ihm … zugeordnet sein
  rationale: Das Pronomen bezieht sich auf den heiligen Bereich beziehungsweise das quadratische Stück; die Wiedergabe erhält den Gedanken der Zugehörigkeit und der umlaufenden Lage.
theological_decisions:
- issue: Umfang von קֹדֶשׁ
  choice: heiliger Bereich
  alternative: Heiligtum
  rationale: Der Landvermessungskontext lässt einen heiligen Bezirk als Ganzes erkennen, ohne die mögliche engere Bedeutung „Heiligtum“ auszuschließen; diese bleibt in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur wurde für gute Verständlichkeit gegliedert; die wiederholte Angabe „ringsum“ bleibt erhalten. Die im ersten Maßpaar implizite Einheit „Ellen“ wurde zur Klarheit ergänzt.
