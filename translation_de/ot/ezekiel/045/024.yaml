base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/024.yaml
  text: And as the grain offering[a], he shall provide an ephah for each bull and an ephah for each ram, and a hin of oil for each ephah.
translation:
  language: de
  text: Als Speisopfer soll er für jeden Stier ein Efa und für jeden Widder ein Efa bereitstellen[a], dazu ein Hin Öl für jedes Efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll er zubereiten“ oder „soll er darbringen“. Das hebräische Verb bedeutet wörtlich „tun/machen“ und kann im Opferzusammenhang das Zubereiten oder Bereitstellen des vorgeschriebenen Opfers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: Speisopfer
  rationale: Im kultischen Zusammenhang bezeichnet מִנְחָה gewöhnlich das aus Getreide bestehende Opfer. „Speisopfer“ ist die geläufige, prägnante deutsche Fachbezeichnung.
- source_word: אֵיפָה
  choice: Efa
  rationale: Die hebräische Trockenmaßeinheit bleibt erhalten, um die kultische Maßangabe nicht durch eine unsichere moderne Näherung zu ersetzen.
- source_word: לַפָּר
  choice: für jeden Stier
  rationale: Die Präposition ל bezeichnet die Zuordnung; der Artikel ist in dieser Opfervorschrift generisch. Die distributive Wiedergabe macht die Menge je Tier deutlich.
- source_word: לָאַיִל
  choice: für jeden Widder
  rationale: 'Wie bei לַפָּר ist im Vorschriftenkontext eine distributive Zuordnung gemeint: ein Efa je Widder.'
- source_word: יַעֲשֶׂה
  choice: soll er bereitstellen
  rationale: עשה bedeutet wörtlich „tun/machen“, kann im Opferkontext aber das Zubereiten oder Bereitstellen des vorgeschriebenen Opfers bezeichnen. „Bereitstellen“ klingt natürlich und wahrt den Vorschriftscharakter.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Der hebräische Text nennt lediglich Öl. „Olivenöl“ wäre zwar kulturgeschichtlich wahrscheinlich, würde aber eine nicht ausdrücklich genannte Präzisierung eintragen.
- source_word: הִין
  choice: Hin
  rationale: Die hebräische Flüssigmaßeinheit wird als kultischer Fachbegriff beibehalten, statt sie ungenau in ein modernes Maß umzurechnen.
- source_word: לָאֵיפָה
  choice: für jedes Efa
  rationale: Die Formulierung gibt das Verhältnis der Ölmenge zur Getreidemenge distributiv und verständlich wieder.
theological_decisions: []
