  text: וְ/שִׁבְעַ֨ת יְמֵֽי הֶ/חָ֜ג יַעֲשֶׂ֧ה עוֹלָ֣ה לַֽ/יהוָ֗ה שִׁבְעַ֣ת פָּ֠רִים וְ/שִׁבְעַ֨ת אֵילִ֤ים תְּמִימִם֙ לַ/יּ֔וֹם שִׁבְעַ֖ת הַ/יָּמִ֑ים וְ/חַטָּ֕את שְׂעִ֥יר עִזִּ֖ים לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/023.yaml
  text: During the seven days of the feast he shall provide as a burnt offering to Yahweh seven bulls and seven rams without blemish each day for the seven days[b][a], and as a sin offering one male goat each day.
translation:
  language: de
  text: An den sieben Tagen des Festes[a] soll er Jahwe an jedem der sieben Tage sieben Stiere und sieben Widder, alle fehlerlos, als Brandopfer bereitstellen und täglich einen Ziegenbock als Sündopfer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Festzeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Reinigungsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָג
  choice: des Festes
  rationale: חַג bezeichnet hier ein kultisches Wallfahrtsfest. „Fest“ ist im modernen Deutschen natürlich und wahrt den kultischen Zusammenhang.
- source_word: יַעֲשֶׂה
  choice: soll er … bereitstellen
  rationale: עָשָׂה bedeutet grundsätzlich „tun/machen“, kann im Opferkontext aber das Herrichten oder Bereitstellen eines Opfers bezeichnen. „Bereitstellen“ passt zur Verantwortung des Fürsten, ohne den Vollzug der Opferhandlung zwingend ihm selbst zuzuschreiben.
- source_word: עוֹלָה
  choice: Brandopfer
  rationale: Etablierte deutsche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition bezeichnet die Ausrichtung beziehungsweise Widmung des Opfers; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: פָּרִים
  choice: Stiere
  rationale: פַּר bezeichnet im Opferkontext einen Stier; ein bestimmtes Jungtieralter ist hier nicht ausdrücklich angegeben.
- source_word: אֵילִים
  choice: Widder
  rationale: אֵיל bezeichnet im kultischen Sprachgebrauch ein männliches Schaf.
- source_word: תְּמִימִם
  choice: fehlerlose
  rationale: Das Adjektiv bezeichnet die kultische Unversehrtheit und Opfertauglichkeit der Tiere. Die Wiederholung im Deutschen macht deutlich, dass sowohl Stiere als auch Widder gemeint sind.
- source_word: לַיּוֹם
  choice: täglich
  rationale: 'Die Wendung ist in diesem Opferplan distributiv zu verstehen: Die angegebene Zahl gilt für jeden einzelnen Tag.'
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: חַטָּאת ist die traditionelle und allgemein verständliche Bezeichnung dieses Opfertyps; der Begriff kann zugleich dessen reinigende Funktion hervorheben.
- source_word: שְׂעִיר עִזִּים
  choice: einen Ziegenbock
  rationale: Die Verbindung bezeichnet einen männlichen Ziegenbock. Der deutsche Singular mit „einen“ gibt im aufzählenden Zusammenhang ein Tier pro Tag wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Beide Wiedergaben erfassen einen Aspekt des kultischen Begriffs. „Sündopfer“ bleibt als Haupttext konventionell und verständlich; die funktionale Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter kultischer Terminologie. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber durch „täglich“ und „sieben Tage lang“ idiomatisch gegliedert; die Wiederholung von „fehlerlose“ verhindert eine unbeabsichtigte Beschränkung auf die Widder.
