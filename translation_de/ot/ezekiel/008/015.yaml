  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה תּוֹעֵב֥וֹת גְּדֹל֖וֹת מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/015.yaml
  text: Then he said to me, “Have you seen this, son of man? You will see again still greater abominations than these.”
translation:
  language: de
  text: 'Dann sagte er zu mir: »Hast du das gesehen, Menschensohn? Du wirst noch größere Abscheulichkeiten sehen als diese.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die traditionelle und im Ezechielbuch wiederkehrende Anrede gibt das hebräische »Sohn des Menschen/Menschensohn« knapp und würdig wieder.
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: Du wirst noch … sehen
  rationale: Die idiomatische deutsche Fassung bewahrt den Fortgang der Schau; תָּשׁוּב hat hier zusammen mit עוֹד wiederholende beziehungsweise weiterführende Bedeutung und verlangt kein wörtliches »zurückkehren«.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: größere Abscheulichkeiten
  rationale: Der Komparativ ergibt sich aus מֵאֵלֶּה (»als diese«). »Abscheulichkeiten« bewahrt die starke kultisch-moralische Wertung von תּוֹעֵבוֹת.
theological_decisions:
- issue: Bedeutung von תּוֹעֵבוֹת im Kontext der Tempelvision
  choice: Abscheulichkeiten
  alternative: Gräuel
  rationale: »Abscheulichkeiten« macht die starke göttliche Verurteilung verständlich, ohne die im weiteren Kontext beschriebenen Handlungen durch eine konfessionelle Deutung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Wiederholung von »sehen« entspricht dem hebräischen Aufbau und verbindet Rückfrage und Ankündigung.
