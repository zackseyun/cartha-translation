  text: וַ/יֹּ֖אמֶר אֵלָ֑/י ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה תּוֹעֵב֥וֹת גְּדֹל֖וֹת אֲשֶׁר הֵ֥מָּה עֹשִֽׂים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/013.yaml
  text: Then he said to me, “You will again see greater abominations that they are doing.”
translation:
  language: de
  text: 'Dann sagte er zu mir: »Du wirst wieder große Gräueltaten sehen, die sie begehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: größere Gräueltaten
  rationale: 'תּוֹעֵבוֹת bezeichnet verabscheuungswürdige, besonders kultisch anstößige Handlungen. »Gräueltaten« gibt die starke Wertung natürlich wieder. גְּדֹלוֹת wird im fortschreitenden Visionszusammenhang komparativ verstanden: »größere«.'
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: du wirst noch … sehen
  rationale: Die Verbindung von עוֹד und שׁוב kündigt eine weitere Schau an. Im Deutschen drückt »noch« dies idiomatisch aus, ohne das schwerfällige »wiederum wirst du sehen«.
- source_word: עֹשִׂים
  choice: begehen
  rationale: Bei verwerflichen Handlungen ist »begehen« im Deutschen idiomatischer und präziser als das allgemeinere »tun«.
theological_decisions:
- issue: Grad oder bloße Größe der folgenden Gräueltaten
  choice: größere Gräueltaten
  alternative: große Gräueltaten
  rationale: Obwohl גְּדֹלוֹת formal positivisch »groß« ist, legt die wiederholte Steigerungsformel der Vision (vgl. den unmittelbar vorausgehenden Zusammenhang) eine vergleichende Bedeutung nahe. Die Spannung bleibt insofern erhalten, als kein Zusatz wie »noch schlimmere« eingeführt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp gehalten; »Gräueltaten« bewahrt die starke moralisch-kultische Verurteilung des hebräischen Ausdrucks.
