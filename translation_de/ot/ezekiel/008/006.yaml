source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/רֹאֶ֥ה אַתָּ֖ה מ/הם עֹשִׂ֑ים תּוֹעֵב֨וֹת גְּדֹל֜וֹת אֲשֶׁ֥ר בֵּֽית יִשְׂרָאֵ֣ל עֹשִׂ֣ים פֹּ֗ה לְ/רָֽחֳקָה֙ מֵ/עַ֣ל מִקְדָּשִׁ֔/י וְ/עוֹד֙ תָּשׁ֣וּב תִּרְאֶ֔ה תּוֹעֵב֖וֹת גְּדֹלֽוֹת־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/006.yaml
  text: And he said to me[a], “Son of man, do you see what they are doing, the great abominations that the house of Israel is doing here[b], to drive me far from my sanctuary? Yet you will see even greater abominations.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Menschensohn, siehst du, was sie tun – die großen Gräuel, die das Haus Israel hier begeht, um mich weit von meinem Heiligtum fortzutreiben?[a] Doch du wirst noch weitere große Gräuel sehen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um mich weit von meinem Heiligtum zu entfernen«; möglicherweise auch: »fern von meinem Heiligtum«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich wiederholt das Hebräische »große Gräuel«; der Zusammenhang lässt eine Steigerung erkennen, die auch mit »noch größere Gräuel« wiedergegeben werden kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die in Hesekiel wiederkehrende, wörtlich geprägte Anrede und ist im deutschen Bibelregister fest verankert.
- source_word: הֲרֹאֶה אַתָּה
  choice: siehst du
  rationale: Gibt die hebräische Frage mit Partizip idiomatisch und gegenwartsbezogen wieder.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: große Gräuel
  rationale: „Gräuel“ bewahrt die starke kultisch-religiöse Wertung von תּוֹעֵבָה; „groß“ entspricht גָּדוֹל, ohne beim zweiten Vorkommen einen im Hebräischen nicht ausdrücklich vorhandenen Komparativ einzuführen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Formnahe Wiedergabe der kollektiven Bundesbezeichnung im prophetischen Sprachgebrauch.
- source_word: פֹּה
  choice: hier
  rationale: Natürliche und genaue Wiedergabe des lokalen Adverbs.
- source_word: לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: sodass ich mich weit von meinem Heiligtum entfernen muss
  rationale: Gibt den wahrscheinlich gemeinten Abstand Gottes von seinem Heiligtum wieder, kennzeichnet die Folge der Gräuel aber weniger stark kausal als „mich vertreiben“ und bewahrt die syntaktische Mehrdeutigkeit in einer Fußnote.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: „Heiligtum“ entspricht מִקְדָּשׁ genauer als das engere „Tempel“.
- source_word: וְעוֹד תָּשׁוּב תִּרְאֶה
  choice: Doch du wirst noch weitere … sehen
  rationale: Gibt die Fortsetzung und Steigerung der Vision natürlich wieder, ohne תָּשׁוּב unidiomatisch als eigenständiges „zurückkehren“ zu übersetzen.
theological_decisions:
- issue: Bezieht sich לְרָחֳקָה מֵעַל מִקְדָּשִׁי auf Gottes Entfernung vom Heiligtum oder auf eine andere Art der Distanzierung?
  choice: Die Gräuel führen dazu, dass Gott sich von seinem Heiligtum entfernt.
  alternative: '„um mich weit von meinem Heiligtum zu entfernen“; möglicherweise auch unpersönlicher: „fern von meinem Heiligtum“'
  rationale: Der Kontext von Hesekiels Tempelvision und das Suffix „mein“ legen Gottes Entfernung nahe. Da die knappe hebräische Konstruktion Subjekt und Kausalität nicht vollständig ausformuliert, wird die Alternative in der Fußnote offengehalten.
- issue: Ist das zweite תּוֹעֵבוֹת גְּדֹלוֹת komparativ als „größere Gräuel“ wiederzugeben?
  choice: „weitere große Gräuel“
  alternative: „noch größere Gräuel“
  rationale: Der Kontext zeigt eine Steigerung, doch der hebräische Wortlaut wiederholt formal „große Gräuel“. „Weitere große Gräuel“ bewahrt diese Form und lässt die eskalierende Wirkung aus dem Zusammenhang hervorgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem Ausdruck „Menschensohn“, der kollektiven Bezeichnung „Haus Israel“ und dem kultisch starken Wort „Gräuel“. Die Satzführung bleibt verständlich, ohne die Mehrdeutigkeit der Entfernungsklausel oder die nur kontextuell erschlossene Steigerung am Versende zu verdecken.
