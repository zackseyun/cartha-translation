  text: Then he brought me to the entrance of the court[a], and I looked, and behold[b], there was a hole in the wall.
translation:
  language: de
  text: Dann brachte er mich zum Eingang des Hofes[a]. Ich sah, und da war ein Loch in der Mauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorhofs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Dann brachte er
  rationale: Der Hifil-Wayyiqtol von בוא bezeichnet das Hinbringen; „Dann“ gibt den erzählerischen Fortgang im modernen Deutschen natürlich wieder.
- source_word: אֹתִי
  choice: mich
  rationale: Das Suffix bezeichnet den direkten Gegenstand des Verbs.
- source_word: אֶל
  choice: zum
  rationale: Die Präposition bezeichnet die Bewegung auf den Eingang zu, ohne ausdrücklich ein Hineingehen auszusagen.
- source_word: פֶּתַח
  choice: Eingang
  rationale: פֶּתַח bezeichnet eine Öffnung oder einen Eingang; hier passt „Eingang“ zur räumlichen Anlage des Vorhofs.
- source_word: הֶחָצֵר
  choice: des Vorhofs
  rationale: חָצֵר bezeichnet einen Hof. Im Tempelzusammenhang ist „Vorhof“ die geläufige und präzise deutsche Bezeichnung.
- source_word: וָאֶרְאֶה
  choice: Ich sah hin
  rationale: ראה kann sowohl das Hinschauen als auch das Wahrnehmen bezeichnen. In der Abfolge vor הִנֵּה bringt „sah hin“ die gerichtete Wahrnehmung natürlich zum Ausdruck.
- source_word: וְהִנֵּה
  choice: und da war
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die überraschend wahrgenommene Gegebenheit. „Da war“ bewahrt diese präsentierende Funktion in natürlichem modernem Deutsch.
- source_word: חֹר אֶחָד
  choice: ein Loch
  rationale: חֹר bezeichnet ein Loch oder eine Öffnung; אֶחָד fungiert hier idiomatisch wie ein unbestimmter Artikel, ohne erkennbare Betonung der Zahl eins.
- source_word: בַּקִּיר
  choice: in der Mauer
  rationale: קִיר bezeichnet eine Wand oder Mauer. Bei der baulichen Begrenzung eines Tempelvorhofs ist „Mauer“ im Deutschen anschaulich und sachgerecht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Vorhof“ entspricht dem Tempelkontext; „und da war“ gibt die aufmerksamkeitslenkende Funktion von הִנֵּה natürlicher wieder als das heute altertümliche „siehe“. Die im englischen Beratungstext offenbar vertauschten Fußnotenzuordnungen wurden nicht übernommen.
