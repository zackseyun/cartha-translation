  text: וְ/גַם אֲנִי֙ אֶעֱשֶׂ֣ה בְ/חֵמָ֔ה לֹֽא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל וְ/קָרְא֤וּ בְ/אָזְנַ/י֙ ק֣וֹל גָּד֔וֹל וְ/לֹ֥א אֶשְׁמַ֖ע אוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/018.yaml
  text: And I also will act in wrath; my eye will not spare[a], nor will I have compassion. Though they cry in my ears with a loud voice, I will not hear them.
translation:
  language: de
  text: 'Und auch ich werde im Zorn handeln: Mein Auge wird nicht schonen, und ich werde kein Mitleid haben. Auch wenn sie mit lauter Stimme in meine Ohren schreien, werde ich sie nicht hören.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Und auch ich
  rationale: Gibt die additive Verbindung und die Betonung des ausdrücklich gesetzten Pronomens knapp und natürlich wieder.
- source_word: אֶעֱשֶׂה בְחֵמָה
  choice: werde im Zorn handeln
  rationale: „Handeln“ entspricht dem weiten Sinn von עשה im Gerichtskontext; „im Zorn“ bewahrt die starke affektive Sprache von חֵמָה.
- source_word: לֹא תָחוֹס עֵינִי
  choice: Mein Auge wird keine Rücksicht nehmen
  rationale: Bewahrt das anthropomorphe Bild des Auges und gibt חס als Verschonen beziehungsweise rücksichtsvolles Schonverhalten wieder.
- source_word: וְלֹא אֶחְמֹל
  choice: und ich werde kein Mitleid haben
  rationale: Unterscheidet חמל vom vorangehenden חס und erhält dadurch die Nuance von Erbarmen beziehungsweise Mitgefühl.
- source_word: וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל
  choice: Auch wenn sie mir mit lauter Stimme in die Ohren schreien
  rationale: „Auch wenn“ macht die im Zusammenhang erkennbare konzessive Beziehung deutlich; die konkrete Wendung „in die Ohren“ und das Substantiv „Stimme“ bleiben erhalten.
- source_word: וְלֹא אֶשְׁמַע אוֹתָם
  choice: werde ich sie nicht erhören
  rationale: „Erhören“ bringt in diesem Gebets- und Hilferufkontext die Bedeutung von שמע als nicht nur akustischem Hören, sondern verweigerter Antwort idiomatisch zum Ausdruck.
theological_decisions:
- issue: Unverhüllte Sprache des göttlichen Gerichts
  choice: Zorn, das nicht rücksichtsvolle Auge und fehlendes Mitleid bleiben als direkte Gottesrede stehen.
  alternative: Die Aussage abstrakt als harte Bestrafung oder verweigerte Gnade umschreiben.
  rationale: Der hebräische Text formuliert Gottes Gericht persönlich, drastisch und anthropomorph; diese Spannung darf nicht abgeschwächt werden.
- issue: Bedeutung von שמע im Schlusssatz
  choice: „nicht erhören“
  alternative: „nicht hören“ oder „nicht auf sie hören“
  rationale: Im Kontext lauten Hilferufens bezeichnet die Aussage die verweigerte Beachtung und Antwort. „Erhören“ gibt dies im Deutschen natürlich wieder, ohne zu behaupten, Gott nehme den Schall nicht wahr.
- issue: Konzessive Beziehung des letzten Satzes
  choice: „Auch wenn sie … schreien“
  alternative: „Und sie werden … schreien, aber …“
  rationale: Die hebräischen Konjunktionen sind formal allgemein; der Kontext erlaubt sowohl eine koordinierende als auch eine konzessive Wiedergabe. Die konzessive Fassung macht den Sinnzusammenhang im Deutschen klar, ohne zusätzliche Lehraussage.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die drastische Gerichtssprache und das konkrete anthropomorphe Bild bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
