source:
  edition: WLC
  text: וָ/אָבוֹא֮ וָֽ/אֶרְאֶה֒ וְ/הִנֵּ֨ה כָל תַּבְנִ֜ית רֶ֤מֶשׂ וּ/בְהֵמָה֙ שֶׁ֔קֶץ וְ/כָל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל מְחֻקֶּ֥ה עַל הַ/קִּ֖יר סָבִ֥יב סָבִֽיב־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/010.yaml
  text: So I went in and looked[a], and behold, every form of creeping thing and detestable beast, and all the idols of the house of Israel, were engraved on the wall all around.
translation:
  language: de
  text: 'Da ging ich hinein und sah mich um, und siehe: Darstellungen aller Arten von Kriechtieren und abscheulichen Tieren sowie alle Götzen[a] des Hauses Israel waren ringsum in die Wand eingeritzt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort für „Götzen“ ist stark verächtlich; sinngemäß auch: „Mistgötzen“ oder „Dreckgötzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבוֹא
  choice: Da ging ich hinein
  rationale: Das Wayyiqtol führt die Erzählung weiter; „da“ und „ging ich hinein“ geben Fortgang und Eintritt natürlich wieder.
- source_word: וָאֶרְאֶה
  choice: und sah mich um
  rationale: Im Zusammenhang bezeichnet ראה das betrachtende Wahrnehmen nach dem Eintritt. „Sah mich um“ vermeidet eine schwerfällige Doppelung mit „siehe“ und passt zur ringsum sichtbaren Szene.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die Präsentationspartikel vergegenwärtigt das überraschend Sichtbare; „siehe“ bewahrt den würdevollen prophetischen Ton.
- source_word: כָל תַּבְנִית
  choice: allerlei Darstellungen von
  rationale: תַּבְנִית kann Form, Abbild oder Darstellung bedeuten. Da die Motive in die Wand eingeritzt sind, ist „Darstellungen“ sachgerecht; „allerlei“ gibt die umfassende Vielfalt idiomatisch wieder.
- source_word: רֶמֶשׂ
  choice: Kriechtieren
  rationale: רֶמֶשׂ bezeichnet kriechende oder sich am Boden bewegende Kleintiere; „Kriechtiere“ ist verständlich und kontextgerecht.
- source_word: וּבְהֵמָה שֶׁקֶץ
  choice: und abscheulichen Tieren
  rationale: בְּהֵמָה ist hier allgemein „Tier“, während שֶׁקֶץ die dargestellten Tiere als abscheulich beziehungsweise kultisch anstößig bewertet. Die attributive Wiedergabe folgt der naheliegenden syntaktischen Zuordnung, ohne die mögliche kultische Konnotation auf „unrein“ zu verengen.
- source_word: גִּלּוּלֵי
  choice: Götzen
  rationale: „Götzen“ gibt den Bezug auf verehrte Bilder verständlich und bereits abwertend wieder; die besonders verächtliche Bildlichkeit des hebräischen Ausdrucks wird in der Fußnote erläutert.
- source_word: בֵּית יִשְׂרָאֵל
  choice: des Hauses Israel
  rationale: Die feststehende prophetische Bezeichnung wird formal bewahrt und nicht zu „Israel“ verkürzt.
- source_word: מְחֻקֶּה עַל הַקִּיר
  choice: waren in die Wand eingeritzt
  rationale: Das passive Partizip von חקק bezeichnet Eingraviertes oder Eingeritztes. Im Deutschen ist bei bildlichen Wanddarstellungen „in die Wand eingeritzt“ präzise und natürlich.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Das wiederholte סָבִיב betont die vollständige Ausdehnung auf allen Seiten; „ringsum“ gibt dies knapp und idiomatisch wieder.
theological_decisions:
- issue: Verächtliche Bedeutung der Götzenbezeichnung גִּלּוּלִים
  choice: Im Haupttext „Götzen“, mit Erläuterung der besonders verächtlichen Nuance in einer Fußnote.
  alternative: Mistgötzen; Dreckgötzen
  rationale: Der hebräische Ausdruck ist bewusst verächtlich. „Götzen“ wahrt im modernen Deutschen die negative Wertung, während wörtlichere Bildungen unnötig befremdlich wirken könnten; die Fußnote macht die stärkere Ausdruckskraft transparent.
- issue: Bezug von שֶׁקֶץ
  choice: 'Als Attribut zu בְהֵמָה: „abscheulichen Tieren“.'
  alternative: 'Appositionell: „Tieren – abscheulichen Dingen“; oder kultisch spezifiziert: „unreinen Tieren“'
  rationale: Die unmittelbare Wortfolge unterstützt die attributive Verbindung. „Abscheulich“ erhält die wertende Breite von שֶׁקֶץ, ohne sie ausschließlich als kultische Unreinheit auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Anschaulichkeit. „Und siehe“ bewahrt den markierten Präsentationsruf; ansonsten wurde auf natürliche Satzführung und allgemein verständlichen Wortschatz geachtet.
