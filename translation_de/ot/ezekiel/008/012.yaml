  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ אֲשֶׁ֨ר זִקְנֵ֤י בֵֽית יִשְׂרָאֵל֙ עֹשִׂ֣ים בַּ/חֹ֔שֶׁךְ אִ֖ישׁ בְּ/חַדְרֵ֣י מַשְׂכִּית֑/וֹ כִּ֣י אֹמְרִ֗ים אֵ֤ין יְהוָה֙ רֹאֶ֣ה אֹתָ֔/נוּ עָזַ֥ב יְהוָ֖ה אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/012.yaml
  text: Then he said to me[a], “Have you seen, son of man, what the elders of the house of Israel are doing in the darkness, each man in the rooms of his carved image? For they are saying, ‘Yahweh does not see us[c][b]; Yahweh has abandoned the land.’”
translation:
  language: de
  text: 'Dann sagte er zu mir: »Hast du gesehen, Menschensohn, was die Ältesten des Hauses Israel im Dunkeln tun, jeder in den Kammern seines Bildwerks?[a] Denn sie sagen: ›Jahwe sieht uns nicht; Jahwe hat das Land verlassen.[b]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Kammern seiner Bilder“. Das hebräische Wort kann gestaltete, eingravierte oder geschnitzte Darstellungen bezeichnen, hier wahrscheinlich Götzenbilder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe hat das Land im Stich gelassen.“ Mit „Land“ ist hier wahrscheinlich das Land Israel/Juda gemeint; möglich ist auch die Übersetzung „Erde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Dann sagte er zu mir
  rationale: Das konsekutive Waw führt die Visionserzählung weiter; „Dann“ gibt die Abfolge in natürlichem Deutsch wieder.
- source_word: הֲרָאִיתָ
  choice: Hast du gesehen
  rationale: Das Fragepartikel mit der Qatalform bezieht sich auf das soeben in der Vision Gezeigte.
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische, wiederkehrende Anrede und ihre literarische Funktion.
- source_word: זִקְנֵי בֵית יִשְׂרָאֵל
  choice: die Ältesten des Hauses Israel
  rationale: Die volle Konstruktverbindung bleibt erhalten, da „Haus Israel“ bei Ezechiel eine bedeutende feste Wendung ist.
- source_word: עֹשִׂים בַּחֹשֶׁךְ
  choice: im Dunkeln tun
  rationale: Die Formulierung bewahrt sowohl die konkrete Dunkelheit der Vision als auch den Beiklang heimlichen Handelns.
- source_word: אִישׁ
  choice: jeder
  rationale: Gibt den distributiven Singular idiomatisch wieder; der Kontext nennt zuvor ausdrücklich die männlichen Ältesten.
- source_word: בְּחַדְרֵי מַשְׂכִּיתוֹ
  choice: in den Kammern seines Bildwerks
  rationale: „Kammern“ entspricht den inneren Räumen; „Bildwerk“ lässt offen, ob מַשְׂכִּית geschnitzte, gravierte oder anderweitig dargestellte Bilder bezeichnet, und bewahrt das possessive Suffix.
- source_word: כִּי אֹמְרִים
  choice: Denn sie sagen
  rationale: כִּי begründet ihr verborgenes Handeln; der präsentische Ausdruck gibt ihre fortdauernde Einstellung natürlich wieder.
- source_word: אֵין יְהוָה רֹאֶה אֹתָנוּ
  choice: Jahwe sieht uns nicht
  rationale: Idiomatiche Wiedergabe der negierten Partizipialkonstruktion bei direkter Wiedergabe des Gottesnamens.
- source_word: עָזַב יְהוָה אֶת הָאָרֶץ
  choice: Jahwe hat das Land verlassen
  rationale: „Verlassen“ gibt עָזַב natürlich wieder, ohne stärker als nötig zwischen räumlichem Weggehen und preisgebendem Verlassen zu entscheiden; „das Land“ bewahrt den wahrscheinlichen Bezug auf Israel/Juda.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, wodurch seine Funktion als offenbarter Gottesname sichtbar bleibt.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: das Land
  alternative: die Erde
  rationale: Der exilische und tempelbezogene Kontext legt Israel/Juda nahe; „das Land“ erhält zugleich die im Hebräischen vorhandene mögliche Weite.
- issue: Aussage עָזַב יְהוָה אֶת הָאָרֶץ
  choice: Jahwe hat das Land verlassen
  alternative: Jahwe hat das Land im Stich gelassen
  rationale: Die neutralere Formulierung bewahrt die Spannung zwischen vermeintlicher Abwesenheit und Preisgabe, ohne die Aussage der Ältesten theologisch zu bestätigen oder zu verschärfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber natürlich lesbar gehalten. „Menschensohn“ und „Haus Israel“ bewahren Ezechiels charakteristische Ausdrucksweise; „Bildwerk“ erhält die lexikalische Unschärfe von מַשְׂכִּית.
