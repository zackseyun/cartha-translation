  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה דְמוּת֙ כְּ/מַרְאֵה אֵ֔שׁ מִ/מַּרְאֵ֥ה מָתְנָ֛י/ו וּ/לְ/מַ֖טָּה אֵ֑שׁ וּ/מִ/מָּתְנָ֣י/ו וּ/לְ/מַ֔עְלָ/ה כְּ/מַרְאֵה זֹ֖הַר כְּ/עֵ֥ין הַ/חַשְׁמַֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/002.yaml
  text: 'Then I looked[a], and behold, a form with the appearance of fire: from what appeared to be his waist and downward, fire; and from his waist and upward, like the appearance of brightness, like gleaming amber.'
translation:
  language: de
  text: 'Da sah ich, und siehe: eine Gestalt, die wie Feuer aussah. Von dem, was wie seine Hüften aussah, abwärts war Feuer; und von seinen Hüften aufwärts war es wie strahlender Glanz, wie der Anblick von Elektron.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist selten und seine genaue Bedeutung unsicher. Es wird traditionell mit „Elektron“ (einer Gold-Silber-Legierung) wiedergegeben; möglich sind auch ein anderer hell leuchtender Stoff oder glühendes Metall.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Dann sah ich
  rationale: Das Narrativ-Waw führt die Visionshandlung weiter; die Wendung ist natürlich und bewahrt den visuellen Bericht in der ersten Person.
- source_word: וְהִנֵּה
  choice: Da war
  rationale: Gibt die hinweisende und überraschende Kraft von הִנֵּה in gegenwärtigem, würdigem Deutsch wieder, ohne das heute stark altertümliche „siehe“ zu erzwingen.
- source_word: דְמוּת
  choice: eine Gestalt
  rationale: Bezeichnet eine visionär wahrgenommene Form oder Ähnlichkeit, ohne deren Identität genauer festzulegen.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: die aussah wie Feuer
  rationale: Bewahrt mit „wie“ die ausdrückliche Vergleichssprache von כ und מַרְאֶה und identifiziert die Gestalt nicht unmittelbar mit Feuer.
- source_word: מִמַּרְאֵה מָתְנָיו
  choice: Von dem, was wie seine Hüften erschien
  rationale: Die schwierige elliptische Formulierung wird verständlich wiedergegeben; zugleich bleibt die visionäre Einschränkung durch מַרְאֶה erhalten.
- source_word: וּלְמַטָּה אֵשׁ
  choice: abwärts war Feuer
  rationale: Gibt die knappe, verblose und räumlich gerichtete Aussage anschaulich wieder.
- source_word: וּמִמָּתְנָיו וּלְמַעְלָה
  choice: und von seinen Hüften aufwärts
  rationale: Bewahrt den Parallelismus und verwendet eine heute verständliche anatomische Bezeichnung.
- source_word: כְּמַרְאֵה זֹהַר
  choice: etwas wie strahlender Glanz
  rationale: זֹהַר bezeichnet leuchtende Helligkeit oder Strahlkraft; die Formulierung wahrt zugleich die Vergleichsstruktur.
- source_word: כְּעֵין הַחַשְׁמַלָה
  choice: wie der Schimmer von Elektron
  rationale: חַשְׁמַל ist ein seltenes, unsicher bestimmbares Wort für einen glänzenden Stoff, wahrscheinlich eine Metalllegierung; „Elektron“ ist die fachlich präzisere traditionelle Bezeichnung und die Fußnote erklärt sie.
theological_decisions:
- issue: Visionäre Beschreibung der Gestalt
  choice: Die wiederholte Sprache des Aussehens und Vergleichens wird ausdrücklich bewahrt.
  alternative: Die Gestalt unmittelbar als Feuer oder als leuchtendes Metall identifizieren.
  rationale: Ezechiel beschreibt zurückhaltend, was ihm ähnlich oder als etwas erscheint. Diese sprachliche Distanz verhindert eine ontologische Überbestimmung und erhält die Spannung der Vision.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze Eröffnung und der Parallelismus der beiden Körperhälften erhalten den eindringlichen Charakter der Vision; unnötig altertümliche Ausdrücke werden vermieden.
