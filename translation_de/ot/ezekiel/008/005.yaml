base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/005.yaml
  text: Then he said to me[a], “Son of man, please lift up your eyes toward the north.” So I lifted up my eyes toward the north, and behold, north of the gate of the altar was this image of jealousy at the entrance.
translation:
  language: de
  text: 'Da sagte er zu mir: „Menschensohn, erhebe doch deine Augen nach Norden!“ Da erhob ich meine Augen nach Norden, und siehe: Nördlich vom Tor des Altars befand sich am Eingang dieses Bild der Eifersucht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Götzenbild der Eifersucht“; oder: „dieses Bild, das Eifersucht hervorruft“. Die knappe hebräische Wendung kann entweder das Bild näher kennzeichnen oder seine Wirkung bezeichnen, nämlich göttliche Eifersucht hervorzurufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels charakteristische göttliche Anrede und die hebräische Bildsprache in einer im Deutschen etablierten, würdevollen Form.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: erhebe doch deine Augen
  rationale: Gibt die anschauliche Wendung „die Augen erheben“ wieder; „doch“ lässt die höflich auffordernde Nuance von נָא anklingen, ohne eine Bitte zu stark zu markieren.
- source_word: דֶּרֶךְ צָפוֹנָה
  choice: nach Norden
  rationale: Natürliche deutsche Richtungsangabe, die sowohl דֶּרֶךְ als auch die Direktivendung angemessen wiedergibt.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Erhält die hinweisende Kraft und visionäre Unmittelbarkeit der prophetischen Erzählung.
- source_word: מִצָּפוֹן
  choice: nördlich von
  rationale: Bezeichnet hier am natürlichsten die räumliche Lage relativ zum Tor und keine Bewegung aus nördlicher Richtung.
- source_word: לְשַׁעַר הַמִּזְבֵּחַ
  choice: vom Tor des Altars
  rationale: Bewahrt die formale Genitivbeziehung, ohne die nicht näher bestimmte architektonische Funktion des Tores auszudeuten.
- source_word: סֵמֶל
  choice: Bild
  rationale: Gibt den allgemeinen Sinn „Bildnis/Figur“ wieder, ohne den kultischen und götzendienerischen Charakter stärker zu explizieren, als es das einzelne Wort tut.
- source_word: הַקִּנְאָה
  choice: der Eifersucht
  rationale: Bewahrt die knappe nominale Konstruktion und ihre Mehrdeutigkeit zwischen Kennzeichnung des Bildes und seiner Wirkung, göttliche Eifersucht hervorzurufen.
- source_word: בַּבִּאָה
  choice: am Eingang
  rationale: Ist eine natürliche räumliche Wiedergabe des Substantivs für Eingang oder Zugang.
theological_decisions:
- issue: Wie ausdrücklich סֵמֶל הַקִּנְאָה auszulegen ist
  choice: „dieses Bild der Eifersucht“ im Haupttext
  alternative: „dieses Götzenbild der Eifersucht“ oder „dieses Bild, das Eifersucht hervorruft“
  rationale: Der Zusammenhang weist klar auf Götzendienst hin, der Gottes Eifersucht hervorruft. Die hebräische Formulierung bleibt jedoch knapp und nominal; deshalb wahrt der Haupttext ihre Spannung, während die Fußnote mögliche Verdeutlichungen nennt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit prophetischer Anschaulichkeit. „Menschensohn“ und „siehe“ erhalten die literarische Prägung des Textes; Satzbau und Richtungsangaben bleiben zugleich gut verständlich.
