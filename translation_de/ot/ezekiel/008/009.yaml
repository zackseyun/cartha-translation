lexical_decisions:
- source_word: הַתּוֹעֵבוֹת הָרָעוֹת
  choice: die schlimmen Abscheulichkeiten
  rationale: תּוֹעֵבוֹת bezeichnet verabscheuungswürdige, häufig kultisch anstößige Handlungen; »Abscheulichkeiten« wahrt diese starke Wertung. Das attributive רָעוֹת wird mit »schlimmen« wiedergegeben, sodass es nicht mit einem unnatürlichen »bösen Abscheulichkeiten« verschmilzt.
- source_word: עֹשִׂים
  choice: begehen
  rationale: Bei verwerflichen Handlungen klingt »begehen« im Deutschen natürlicher und präziser als das allgemeinere »tun«.
- source_word: פֹּה
  choice: hier
  rationale: Direkte örtliche Entsprechung des hebräischen Adverbs.
theological_decisions:
- issue: Stärke und kultische Färbung von תּוֹעֵבוֹת
  choice: Abscheulichkeiten
  alternative: Gräuel
  rationale: »Abscheulichkeiten« vermittelt die starke moralisch-kultische Verurteilung, ohne durch die heute teils altertümliche Wirkung von »Gräuel« unnötig Distanz zu schaffen.
translation_notes:
  register: Moderne, würdige Standardsprache; direkte Rede klar und eindringlich. Die Kombination aus תּוֹעֵבוֹת und רָעוֹת bleibt semantisch sichtbar, wird aber idiomatisch formuliert.
