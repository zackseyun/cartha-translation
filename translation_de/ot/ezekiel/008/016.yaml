  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל חֲצַ֣ר בֵּית יְהוָה֮ הַ/פְּנִימִית֒ וְ/הִנֵּה פֶ֜תַח הֵיכַ֣ל יְהוָ֗ה בֵּ֤ין הָֽ/אוּלָם֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ כְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ אֲחֹ֨רֵי/הֶ֜ם אֶל הֵיכַ֤ל יְהוָה֙ וּ/פְנֵי/הֶ֣ם קֵ֔דְמָ/ה וְ/הֵ֛מָּה מִשְׁתַּחֲוִיתֶ֥ם קֵ֖דְמָ/ה לַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/016.yaml
  text: Then he brought me into the inner court of the house of Yahweh[a], and behold, at the entrance of the temple of Yahweh, between the porch and the altar, were about twenty-five men, with their backs toward the temple of Yahweh and their faces toward the east[b]; and they were bowing down toward the east to the sun.
translation:
  language: de
  text: Dann brachte er mich in den inneren Vorhof des Hauses Jahwes. Und siehe, am Eingang zum Tempel Jahwes, zwischen der Vorhalle und dem Altar, standen etwa fünfundzwanzig Männer, mit dem Rücken zum Tempel Jahwes und mit dem Gesicht nach Osten; sie warfen sich nach Osten hin vor der Sonne nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung bezeichnet eine kultische Niederwerfung; sinngemäß: „Sie beteten die Sonne an.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Dann brachte er mich
  rationale: Das Wayyiqtol führt die Abfolge der Vision weiter; „Dann“ gibt diesen erzählerischen Fortgang im Deutschen natürlich wieder.
- source_word: חֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: in den inneren Vorhof des Hauses Jahwes
  rationale: חָצֵר bezeichnet den Hof; „Vorhof“ ist im Tempelzusammenhang geläufig. בֵּית יְהוָה wird nahe am hebräischen Ausdruck als „Haus Jahwes“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Tetragramms bewahrt den Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung lenkt die Aufmerksamkeit lebhaft auf das nun Wahrgenommene; „Und sieh“ erhält diese deiktische Funktion in gegenwärtigem Deutsch.
- source_word: פֶּתַח הֵיכַל יְהוָה
  choice: am Eingang der Tempelhalle Jahwes
  rationale: פֶּתַח ist der Eingang; הֵיכָל bezeichnet hier das eigentliche Tempelgebäude beziehungsweise dessen Haupthalle und wird zur Unterscheidung vom gesamten „Haus Jahwes“ als „Tempelhalle“ übersetzt.
- source_word: בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ
  choice: zwischen der Vorhalle und dem Altar
  rationale: אוּלָם bezeichnet die vorgelagerte Halle des Tempelgebäudes; „Vorhalle“ ist präzise und allgemein verständlich.
- source_word: כְּעֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: etwa fünfundzwanzig Männer
  rationale: Das vorangestellte כ־ kennzeichnet die Zahl als ungefähr; אִישׁ steht nach der Zahl kollektiv.
- source_word: אֲחֹרֵיהֶם אֶל הֵיכַל יְהוָה וּפְנֵיהֶם קֵדְמָה
  choice: Sie kehrten der Tempelhalle Jahwes den Rücken zu und ihr Gesicht nach Osten
  rationale: Die Übersetzung erhält den scharfen räumlichen Gegensatz zwischen dem abgewandten Rücken und dem nach Osten gerichteten Gesicht.
- source_word: מִשְׁתַּחֲוִיתֶם קֵדְמָה לַשָּׁמֶשׁ
  choice: nach Osten hin warfen sie sich vor der Sonne nieder
  rationale: Die Form von שׁחה bezeichnet eine körperliche Niederwerfung, häufig als Kulthandlung. Die konkrete Handlung sowie Richtung und Bezugsobjekt bleiben ausdrücklich erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Kultische Bedeutung von מִשְׁתַּחֲוִיתֶם
  choice: warfen sie sich vor der Sonne nieder
  alternative: beteten sie die Sonne an
  rationale: Der Haupttext bewahrt zunächst die konkrete körperliche Handlung. Der Zusammenhang macht ihren kultischen und götzendienerischen Charakter deutlich, ohne die bildhafte Ausdrucksweise durch eine rein deutende Wiedergabe zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vorhof“, „Vorhalle“ und „Tempelhalle“ unterscheiden die räumlichen Bereiche klar. Der Aufmerksamkeitspartikel wird mit dem natürlichen, aber weiterhin feierlichen „Und sieh“ wiedergegeben.
