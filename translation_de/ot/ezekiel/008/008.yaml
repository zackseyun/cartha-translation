  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֖ם חֲתָר נָ֣א בַ/קִּ֑יר וָ/אֶחְתֹּ֣ר בַּ/קִּ֔יר וְ/הִנֵּ֖ה פֶּ֥תַח אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/008.yaml
  text: Then he said to me[a], “Son of man, please dig into the wall.” So I dug into the wall, and behold, there was an opening.
translation:
  language: de
  text: 'Dann sagte er zu mir: „Menschensohn, durchbrich bitte die Wand.“[a] Da durchbrach ich die Wand, und siehe, da war eine Öffnung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Grabe in die Wand.“ Das hebräische Verb kann sowohl graben als auch eine Wand durchbrechen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die wörtliche, in Hesekiel wiederkehrende Anrede, ohne ihr an dieser Stelle einen messianischen Titelanspruch zuzuschreiben.
- source_word: חֲתָר
  choice: durch die Wand brechen
  rationale: Das Verb bezeichnet hier das Graben beziehungsweise Durchbrechen einer Wand. Im Deutschen beschreibt „durch die Wand brechen“ die beabsichtigte Herstellung eines Zugangs natürlicher als „in der Wand graben“ und lässt sich bei der Wiederholung des Verbs beibehalten.
- source_word: נָא
  choice: bitte
  rationale: Gibt die auffordernde beziehungsweise abmildernde Funktion der Partikel in natürlichem modernem Deutsch wieder.
- source_word: קִּיר
  choice: Wand
  rationale: Die übliche und kontextuell passende Wiedergabe für eine bauliche Wand.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Bewahrt das Signal einer plötzlichen Wahrnehmung und die lebhafte Erzählweise des Hebräischen.
- source_word: פֶּתַח אֶחָד
  choice: eine Öffnung
  rationale: פֶּתַח bezeichnet eine Öffnung oder einen Eingang. אֶחָד fungiert hier idiomatisch als unbestimmte Einzelangabe; „eine Öffnung“ ist natürlich und bewahrt den Singular, ohne unmotiviert „eine einzige Öffnung“ zu betonen.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Menschenkind
  rationale: „Menschensohn“ erhält die maskuline Singularform und das wiederkehrende literarische Leitwort des Buches. Die Stelle selbst wird dadurch nicht als messianischer Titelanspruch gedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; „und siehe“ erhält bewusst die markante Wahrnehmungsformel. Die Fußnote steht an der mehrdeutigen Zielbezeichnung, während die Handlung als Durchbrechen der Wand wiedergegeben wird.
