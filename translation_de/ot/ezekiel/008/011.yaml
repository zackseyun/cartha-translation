lexical_decisions:
- source_word: שִׁבְעִים אִישׁ
  choice: siebzig Männer
  rationale: Die gezählte, ausdrücklich männliche Gruppe wird im Deutschen klar und quellennah wiedergegeben.
- source_word: מִזִּקְנֵי בֵית יִשְׂרָאֵל
  choice: aus den Ältesten des Hauses Israel
  rationale: מִן bezeichnet hier die Auswahl aus einer größeren Gruppe. Die hebräische Wendung „Haus Israel“ bleibt erhalten.
- source_word: יַאֲזַנְיָהוּ בֶן שָׁפָן
  choice: Jaasanja, der Sohn Schafans
  rationale: Die Personennamen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: עֹמֵד בְּתוֹכָם
  choice: Unter ihnen stand
  rationale: בְּתוֹךְ bezeichnet die Stellung innerhalb beziehungsweise inmitten der Gruppe; die deutsche Formulierung ist natürlich und räumlich eindeutig.
- source_word: עֹמְדִים לִפְנֵיהֶם
  choice: standen vor ihnen
  rationale: Der hebräische Plural des Pronomens wird bewahrt, ohne seinen Bezug im Haupttext interpretierend festzulegen.
- source_word: מִקְטַרְתּוֹ
  choice: seine Räucherpfanne
  rationale: Das Wort bezeichnet ein Gerät, in dem Räucherwerk verbrannt wird. „Räucherpfanne“ ist im kultischen Zusammenhang präzise und verständlich.
- source_word: וַעֲתַר עֲנַן הַקְּטֹרֶת
  choice: eine dichte Weihrauchwolke
  rationale: עֲתַר vermittelt Fülle beziehungsweise Dichte; die kompakte deutsche Wendung gibt das starke sichtbare Aufsteigen des Räucherwerks natürlich wieder.
- source_word: עֹלֶה
  choice: stieg auf
  rationale: Das Partizip beschreibt den in der Vision fortdauernden Vorgang; das deutsche Präteritum mit „aufsteigen“ fügt sich natürlich in die erzählte Schau.
theological_decisions:
- issue: Bezug von לִפְנֵיהֶם („vor ihnen“)
  choice: Das pluralische Pronomen bleibt im Haupttext als „ihnen“ stehen.
  alternative: Den Bezug ausdrücklich als „vor den Bildern an der Wand“ wiedergeben.
  rationale: Im Zusammenhang sind wahrscheinlich die in Vers 10 dargestellten Gestalten gemeint. Da der hebräische Text den Bezug jedoch nur durch ein Pronomen ausdrückt, wird er nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde für bessere Lesbarkeit leicht gegliedert, ohne die Bestandteile oder die fortlaufende Szene des hebräischen Textes zu verändern. Kultische Begriffe bleiben konkret, aber allgemein verständlich.
