  text: And seventy men from the elders of the house of Israel[a], with Jaazaniah the son of Shaphan standing among them, were standing before them, each man with his censer in his hand[d][c][b]; and the thick cloud of incense was going up.
translation:
  language: de
  text: Und siebzig Männer aus den Ältesten des Hauses Israel standen vor ihnen[b]. In ihrer Mitte[a] stand Jaasanja, der Sohn Schafans. Jeder hatte seine Räucherpfanne[c] in der Hand, und eine dichte Weihrauchwolke[d] stieg auf.
