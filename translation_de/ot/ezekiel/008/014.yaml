source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל פֶּ֨תַח֙ שַׁ֣עַר בֵּית יְהוָ֔ה אֲשֶׁ֖ר אֶל הַ/צָּפ֑וֹנָ/ה וְ/הִנֵּה שָׁם֙ הַ/נָּשִׁ֣ים יֹֽשְׁב֔וֹת מְבַכּ֖וֹת אֶת הַ/תַּמּֽוּז־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/014.yaml
  text: Then he brought me to the entrance of the gate of the house of Yahweh that faces north[a], and behold, there the women were sitting[b], weeping for Tammuz.
translation:
  language: de
  text: 'Dann brachte er mich zum Eingang des Nordtores am Haus Jahwes. Und sieh: Dort saßen die Frauen und weinten[b] um Tammus[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tammus war eine mesopotamische Gottheit, mit der jahreszeitliche Klageriten verbunden waren; die Frauen werden hier beim Klagen um ihn dargestellt.
    reason: cultural_note
  - marker: b
    text: 'Oder: „trauerten um Tammus“. Das hebräische Verb bedeutet wörtlich „weinen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: Dann brachte er mich
  rationale: Der Hifil von בוא bezeichnet hier das Herbeibringen; „dann“ gibt den erzählenden Anschluss natürlich wieder.
- source_word: פֶּתַח שַׁעַר בֵּית יְהוָה אֲשֶׁר אֶל הַצָּפוֹנָה
  choice: zum Eingang des Nordtores am Haus Jahwes
  rationale: Die kompakte Formulierung gibt die Tempelarchitektur und die nördliche Lage des Tores idiomatisch wieder. „Haus“ bewahrt die konkrete Ausgangsmetapher, statt sie mit „Tempel“ auszudeuten.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung bewahrt die aufmerksamkeitslenkende, anschauliche Funktion von הִנֵּה in heutiger, würdiger Sprache.
- source_word: הַנָּשִׁים יֹשְׁבוֹת
  choice: die Frauen … saßen
  rationale: Das Partizip schildert die Frauen als sitzend in der gesehenen Szene; im Deutschen ist das Präteritum die natürliche Erzählform.
- source_word: מְבַכּוֹת אֶת הַתַּמּוּז
  choice: weinten um Tammus
  rationale: בכה bedeutet konkret „weinen“; „um“ macht im Deutschen deutlich, dass Tammus Gegenstand der Klage ist, ohne den Ausdruck bloß als allgemeines Trauern zu paraphrasieren.
- source_word: תַּמּוּז
  choice: Tammus
  rationale: „Tammus“ ist die im Deutschen geläufige Form des Eigennamens; der Name wird nicht durch eine erklärende Bezeichnung im Haupttext erweitert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die geläufige deutsche Wiedergabe des göttlichen Eigennamens und bewahrt ihn als Namen statt ihn durch den Titel „HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die deutsche Namensform „Jahwe“ bewahrt diesen Unterschied gegenüber einem ersetzenden Titel.
- issue: Deutung von תַּמּוּז
  choice: Tammus
  alternative: der Gott Tammus
  rationale: Im Haupttext bleibt der Eigenname ohne erklärenden Zusatz stehen. Die kultgeschichtliche Einordnung erfolgt in einer Fußnote, damit die Übersetzung nicht mehr sagt als der hebräische Wortlaut.
- issue: Charakter der Handlung מְבַכּוֹת
  choice: weinten um
  alternative: trauerten um
  rationale: Die konkrete Bedeutung „weinen“ bleibt erhalten, während „um“ den aus dem Zusammenhang erkennbaren Klagebezug ausdrückt. Die kultische Dimension wird nicht stillschweigend in das Verb hineingelesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Und sieh“ erhält die szenische Hervorhebung, ohne das altertümlichere „siehe“ zu verwenden. Die Fußnotenmarker stehen unmittelbar bei der Wendung, auf die sich beide Anmerkungen beziehen.
