source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שִּׁשִּׁ֗ית בַּ/שִּׁשִּׁי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ אֲנִי֙ יוֹשֵׁ֣ב בְּ/בֵיתִ֔/י וְ/זִקְנֵ֥י יְהוּדָ֖ה יוֹשְׁבִ֣ים לְ/פָנָ֑/י וַ/תִּפֹּ֤ל עָלַ/י֙ שָׁ֔ם יַ֖ד אֲדֹנָ֥/י יְהֹוִֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/001.yaml
  text: And it happened in the sixth year[a], in the sixth month, on the fifth day of the month, as I was sitting in my house and the elders of Judah were sitting before me[b], that the hand of the Lord GOD fell upon me there.
translation:
  language: de
  text: 'Und es geschah im sechsten Jahr, im sechsten Monat, am fünften Tag des Monats: Während ich in meinem Haus saß und die Ältesten Judas vor mir saßen, fiel dort[a] die Hand des Herrn Jahwe[b] auf mich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „dort“. Manche Übersetzungen verstehen das Wort zeitlich im Sinn von „da“ oder „dann“; das hebräische Adverb ist gewöhnlich örtlich.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch אֲדֹנָי יְהוִה (Adonaj JHWH), eine Verbindung aus dem Titel „Herr“ und dem Gottesnamen; auch übersetzt: „Gott, der HERR“ oder „Herr JHWH“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die erzählende Einleitungsformel eröffnet eine neue Szene. „Und es geschah“ wahrt ihre Funktion und den würdevollen biblischen Erzählton, ohne veraltet zu wirken.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: im sechsten Jahr
  rationale: Die knappe Datumsangabe wird nicht durch die im Kontext naheliegende, aber hier unausgesprochene Ergänzung „der Verbannung“ erweitert.
- source_word: בַּשִּׁשִּׁי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: im sechsten Monat, am fünften Tag des Monats
  rationale: Dies gibt die hebräische Datumsformel präzise und in natürlichem Deutsch wieder.
- source_word: אֲנִי יוֹשֵׁב בְּבֵיתִי
  choice: Während ich in meinem Haus saß
  rationale: Das Partizip beschreibt den andauernden Hintergrund der folgenden Handlung; „während“ macht dieses Verhältnis im Deutschen deutlich.
- source_word: וְזִקְנֵי יְהוּדָה
  choice: und die Ältesten Judas
  rationale: „Älteste“ bezeichnet die anerkannten führenden Männer; der Genitiv „Judas“ bildet die hebräische Verbindung transparent ab.
- source_word: יוֹשְׁבִים לְפָנַי
  choice: vor mir saßen
  rationale: Die Wendung bezeichnet ihre räumliche Anwesenheit bei Ezechiel und lässt zugleich die mögliche Audienzsituation offen.
- source_word: וַתִּפֹּל עָלַי
  choice: fiel … auf mich
  rationale: Die wörtliche, bildhafte Ausdrucksweise des Hebräischen wird bewahrt; im prophetischen Zusammenhang weist sie auf ein machtvolles göttliches Ergreifen hin, ohne dieses im Text auszudeuten.
- source_word: שָׁם
  choice: dort
  rationale: Das Adverb ist seinem gewöhnlichen Sinn nach örtlich. „Dort“ bewahrt diesen Bezug, statt ihn zu einem bloß zeitlichen „da/dann“ umzudeuten.
- source_word: יַד
  choice: die Hand
  rationale: Das zentrale prophetische Bild „die Hand … auf mir“ bleibt erhalten und wird nicht interpretierend durch „Macht“ ersetzt.
- source_word: אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  rationale: Die Verbindung aus dem Titel אֲדֹנָי und dem Gottesnamen יהוה wird als Titel plus Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: Gott, der HERR; Herr JHWH
  rationale: Der hebräische Text enthält ausdrücklich den Titel „Herr“ und den Gottesnamen. „Herr Jahwe“ hält beides auseinander und vermeidet sowohl die Doppelung „Herr HERR“ als auch das Ersetzen des Namens durch einen weiteren Titel.
- issue: Bedeutung der „Hand“ des Herrn
  choice: Bildhafte Formulierung unverändert bewahren
  alternative: die Macht des Herrn ergriff mich
  rationale: Der Ausdruck kann göttliche Macht, Einwirkung oder prophetischen Zwang bezeichnen. Die Übersetzung legt sich nicht auf nur eine dieser Deutungen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzperiode folgt der hebräischen Szeneneröffnung, wird aber durch Doppelpunkt und Nebensatz für heutige Leser übersichtlich gegliedert. Die wiederholten Zeitangaben und das zweimalige „saß/saßen“ bleiben erhalten, weil sie Struktur und Gleichzeitigkeit des Ausgangstextes tragen.
