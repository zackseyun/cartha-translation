source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ הֲ/נָקֵל֙ לְ/בֵ֣ית יְהוּדָ֔ה מֵ/עֲשׂ֕וֹת אֶת הַ/תּוֹעֵב֖וֹת אֲשֶׁ֣ר עָֽשׂוּ פֹ֑ה כִּֽי מָלְא֨וּ אֶת הָ/אָ֜רֶץ חָמָ֗ס וַ/יָּשֻׁ֨בוּ֙ לְ/הַכְעִיסֵ֔/נִי וְ/הִנָּ֛/ם שֹׁלְחִ֥ים אֶת הַ/זְּמוֹרָ֖ה אֶל אַפָּֽ/ם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/017.yaml
  text: Then he said to me[a], “Have you seen, son of man? Is it too trivial a thing for the house of Judah to do the abominations that they have done here, that they should also fill the land with violence and turn again to provoke me? And behold[b], they are putting the branch to their nose.”
translation:
  language: de
  text: 'Da sagte er zu mir: „Hast du das gesehen, Menschensohn? Ist es dem Haus Juda zu wenig, die Gräuel zu verüben, die sie hier verübt haben, dass sie auch noch das Land mit Gewalt füllen und wieder dazu übergehen, mich zum Zorn zu reizen? Und sieh: Sie halten den Zweig an ihre Nase[a][b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einigen alten Textzeugen: „an meine Nase“. Im hebräischen Text steht: „an ihre Nase“.'
    reason: textual_variant
  - marker: b
    text: Die Wendung „den Zweig an ihre Nase halten“ ist unklar. Möglicherweise bezeichnet sie eine Geste bei einem Götzenritual.
    reason: cultural_note
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Hast du das gesehen
  rationale: Das Qal Perfekt mit Fragepartikel verweist rhetorisch auf das, was Ezechiel soeben gezeigt wurde.
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die charakteristische und im Ezechielbuch wiederkehrende prophetische Anrede in geläufiger deutscher Form.
- source_word: הֲנָקֵל
  choice: Ist es … etwa eine Kleinigkeit
  rationale: Gibt die rhetorische Frage und den Gedanken von Leichtigkeit beziehungsweise Geringfügigkeit natürlich wieder, ohne ihn erklärend aufzulösen.
- source_word: לְבֵית יְהוּדָה
  choice: für das Haus Juda
  rationale: Erhält den kollektiven Ausdruck בית יהודה statt ihn zu „Juda“ oder „Volk von Juda“ zu vereinfachen.
- source_word: הַתּוֹעֵבוֹת
  choice: die abscheulichen Dinge
  rationale: Vermittelt die starke religiös-moralische Wertung von תועבות in verständlichem Gegenwartsdeutsch.
- source_word: מָלְאוּ אֶת הָאָרֶץ חָמָס
  choice: sie haben das Land mit Gewalt erfüllt
  rationale: חמס bezeichnet hier gewaltsames, rücksichtsloses Unrecht; „Gewalt“ ist knapp und im prophetischen Kontext sachgerecht.
- source_word: וַיָּשֻׁבוּ לְהַכְעִיסֵנִי
  choice: reizen mich immer wieder zum Zorn
  rationale: „Immer wieder“ bringt den wiederholenden Sinn von וישבו zur Geltung; „zum Zorn reizen“ gibt die Kausativform von כעס idiomatisch wieder.
- source_word: וְהִנָּם
  choice: Und sieh
  rationale: Bewahrt die aufmerksamkeitslenkende, anschauliche Funktion der Wendung in natürlichem modernem Deutsch.
- source_word: שֹׁלְחִים אֶת הַזְּמוֹרָה
  choice: Sie halten den Zweig
  rationale: „Halten“ beschreibt die erkennbare Geste zurückhaltend, ohne die unsichere kultische Bedeutung festzulegen; זמורה bleibt mit dem allgemeinen „Zweig“ bewusst unspezifisch.
- source_word: אֶל אַפָּם
  choice: an ihre Nase
  rationale: Folgt transparent dem masoretischen Text mit dem Suffix der 3. Person Plural, obwohl die Wendung schwierig ist.
theological_decisions:
- issue: Textlich und sachlich unklare Schlussgeste
  choice: „Sie halten den Zweig an ihre Nase“ nach dem masoretischen Text
  alternative: „Sie halten den Zweig an meine Nase“ beziehungsweise eine ausdrücklich als Götzenritual bezeichnete Geste
  rationale: Die Hauptfassung bewahrt den überlieferten hebräischen Wortlaut und seine echte Deutungsoffenheit. Die alte Textvariante und die mögliche kultische Bedeutung werden in Fußnoten genannt, aber nicht stillschweigend in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt deutlich; die Satzfolge wird gegenüber einer langen hypotaktischen Konstruktion gegliedert. Der rätselhafte Schluss wird bewusst nicht erklärt oder konfessionell gedeutet.
