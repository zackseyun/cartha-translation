  to: 'Da sagte er zu mir: „Hast du das gesehen, Menschensohn? Ist es dem Haus Juda zu wenig, die Gräuel zu verüben, die sie hier verübt haben, dass sie auch noch das Land mit Gewalt füllen und wieder dazu übergehen, mich zum Zorn zu reizen? Und sieh: Sie halten den Zweig an ihre Nase[a][b].“'
  rationale: 'Die Revision stellt die rhetorische Satzstruktur des hebräischen Textes wieder her: Auf die Frage, ob die bisherigen Gräuel nicht schon genügen, folgt die Steigerung „dass sie auch noch“ Gewalt und erneute Provokation hinzufügen. Der rätselhafte Schluss, einschließlich der masoretischen Lesart „ihre Nase“ und der textkritischen Alternative, bleibt unverändert transparent.'
