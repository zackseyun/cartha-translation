revisions:
- from: Dann streckte er etwas aus, das wie eine Hand aussah[a], und packte mich an einer Haarsträhne meines Kopfes. Der Geist[b] hob mich empor zwischen Erde und Himmel und brachte mich in Visionen Gottes nach Jerusalem, an den Eingang des inneren Tores, das nach Norden weist. Dort befand sich das Bild der Eifersucht, das Eifersucht erregt.
  to: Dann streckte er etwas aus, das wie eine Hand aussah[a], und ergriff mich an einer Haarsträhne. Der Geist[b] hob mich empor zwischen Erde und Himmel und brachte mich in Visionen Gottes nach Jerusalem, an den Eingang des inneren Tores, das nach Norden weist, wo sich der Sitz des Bildes der Eifersucht befand, das Eifersucht erregt.
  rationale: Die Revision ergänzt den im Hebräischen ausdrücklich genannten Sitz bzw. Standort des Bildes und glättet zwei stilistische Formulierungen. Die Mehrdeutigkeit von רוּחַ und von „Visionen Gottes“ sowie die nicht ausdrücklich benannte Person, deren Eifersucht erregt wird, bleiben unverändert erhalten.
