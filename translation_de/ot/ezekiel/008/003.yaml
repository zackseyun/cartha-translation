id: EZK.8.3
reference: Ezekiel 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ תַּבְנִ֣ית יָ֔ד וַ/יִּקָּחֵ֖/נִי בְּ/צִיצִ֣ת רֹאשִׁ֑/י וַ/תִּשָּׂ֣א אֹתִ֣/י ר֣וּחַ בֵּֽין הָ/אָ֣רֶץ וּ/בֵ֣ין הַ/שָּׁמַ֡יִם וַ/תָּבֵא֩ אֹתִ֨/י יְרוּשָׁלְַ֜מָ/ה בְּ/מַרְא֣וֹת אֱלֹהִ֗ים אֶל פֶּ֜תַח שַׁ֤עַר הַ/פְּנִימִית֙ הַ/פּוֹנֶ֣ה צָפ֔וֹנָ/ה אֲשֶׁר שָׁ֣ם מוֹשַׁ֔ב סֵ֖מֶל הַ/קִּנְאָ֥ה הַ/מַּקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/003.yaml
  text: Then he stretched out what looked like a hand and took me by a lock of my head[a], and the Spirit lifted me up between the earth and the heavens and brought me to Jerusalem in visions of God, to the entrance of the inner gate that faces north[b], where the seat of the image of jealousy that provokes jealousy was.
translation:
  language: de
  text: Dann streckte er etwas aus, das wie eine Hand aussah[a], und ergriff mich an einer Haarsträhne. Der Geist[b] hob mich empor zwischen Erde und Himmel und brachte mich in Visionen Gottes nach Jerusalem, an den Eingang des inneren Tores, das nach Norden weist, wo sich der Sitz des Bildes der Eifersucht befand, das Eifersucht erregt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Gestalt einer Hand“ oder „das Abbild einer Hand“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Geist“; auch „Wind“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית יָד
  choice: etwas, das wie eine Hand aussah
  rationale: תַּבְנִית bezeichnet Gestalt, Form oder Abbild. Die Formulierung gibt die sichtbare Ähnlichkeit im ausdrücklich visionären Zusammenhang natürlich wieder, ohne eine buchstäbliche Hand vorauszusetzen.
- source_word: בְּצִיצִת רֹאשִׁי
  choice: an einer Haarsträhne meines Kopfes
  rationale: צִיצִת bezeichnet hier eine Franse, einen Büschel oder eine Strähne. „Haarsträhne“ ist im modernen Deutsch anschaulich und verständlich; „meines Kopfes“ bewahrt die hebräische Ausdrucksweise.
- source_word: רוּחַ
  choice: der Geist
  rationale: רוּחַ kann Wind, Geist oder den göttlichen Geist bedeuten. Der visionäre Transport und der weitere Sprachgebrauch Ezechiels sprechen hier eher für einen göttlichen Akteur; die Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: zwischen Erde und Himmel
  rationale: Dies ist die natürliche deutsche Entsprechung der hebräischen Wendung. שָׁמַיִם ist formal eine Pluralform, wird im Deutschen in dieser festen kosmischen Gegenüberstellung jedoch idiomatisch mit „Himmel“ wiedergegeben.
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: in Visionen Gottes
  rationale: Der Plural von מַרְאָה bleibt erhalten. Der Genitiv „Gottes“ lässt offen, ob Herkunft („von Gott“) oder Qualität („göttlich“) betont ist.
- source_word: פֶּתַח שַׁעַר הַפְּנִימִית
  choice: an den Eingang des inneren Tores
  rationale: Die Wendung bildet die Beziehung zwischen Eingang und Tor klar und natürlich ab. Das feminine הַפְּנִימִית bezieht sich syntaktisch auf שַׁעַר in der hier vorliegenden Konstruktion.
- source_word: הַפּוֹנֶה צָפוֹנָה
  choice: das nach Norden weist
  rationale: Die Richtungsangabe wird idiomatisch und zugleich bildnah wiedergegeben.
- source_word: מוֹשַׁב
  choice: dort befand sich
  rationale: מוֹשַׁב kann Sitz, Aufenthaltsort oder Standort bezeichnen. Die verbale deutsche Wiedergabe bezeichnet den festen Standort des Bildes, ohne ihm unnötig personale Eigenschaften zuzuschreiben.
- source_word: סֵמֶל
  choice: Bild
  rationale: סֵמֶל bezeichnet ein Bildwerk beziehungsweise Götzenbild. „Bild“ bewahrt die relative Neutralität des Nomens; sein anstößiger Charakter wird durch die folgende Bezeichnung erklärt.
- source_word: הַקִּנְאָה ... הַמַּקְנֶה
  choice: der Eifersucht, das Eifersucht erregt
  rationale: Die Wiederholung von „Eifersucht“ erhält das hebräische Wortspiel zwischen קִנְאָה und der kausativen Partizipialform הַמַּקְנֶה.
theological_decisions:
- issue: Ob רוּחַ beim visionären Transport „Wind“, „ein Geist“ oder „der Geist“ bedeutet
  choice: der Geist
  alternative: Wind; ein Geist
  rationale: Der Zusammenhang beschreibt übernatürlichen prophetischen Transport und legt daher den göttlichen Geist als Handelnden nahe. Da das hebräische Wort die anderen Bedeutungen weiterhin zulässt, werden sie in der Fußnote genannt.
- issue: Wessen Eifersucht das Bild erregt
  choice: nicht ausdrücklich ergänzt
  alternative: das Gottes Eifersucht erregt
  rationale: Der Kontext legt Gottes Eifersucht nahe, doch der hebräische Vers nennt den Betroffenen nicht ausdrücklich. Die Übersetzung erhält diese Offenheit und vermeidet eine erklärende Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulicher, aber nicht umgangssprachlicher Ausdrucksweise. Die Satzstruktur wurde für gute Lesbarkeit leicht gegliedert. Visionäre Mehrdeutigkeiten und das hebräische Wortspiel um „Eifersucht“ bleiben erhalten.
