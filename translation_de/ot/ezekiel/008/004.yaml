source:
  edition: WLC
  text: וְ/הִ֨נֵּה שָׁ֔ם כְּב֖וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֑ל כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי בַּ/בִּקְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/004.yaml
  text: And behold[a], there was the glory of the God of Israel, like the appearance that I had seen in the valley.
translation:
  language: de
  text: 'Und sieh: Dort war die Herrlichkeit des Gottes Israels, wie die Erscheinung, die ich in der Ebene[a] gesehen hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Tal. Das hebräische Wort kann eine Ebene oder ein breites Tal bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die lebendige, aufmerksamkeitslenkende Kraft von הִנֵּה in einer heute verständlichen, leicht gehobenen prophetischen Sprache.
- source_word: שָׁם
  choice: dort war
  rationale: Gibt sowohl die örtliche Bedeutung von שָׁם als auch die im Deutschen natürliche Satzkonstruktion wieder.
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: Ist die etablierte und sachlich angemessene Wiedergabe für כָּבוֹד bei einer sichtbaren Offenbarung Gottes, ohne zusätzliche Deutung einzutragen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Bildet die hebräische Genitivverbindung unmittelbar ab und bewahrt die ausdrückliche Zuordnung zu Israel.
- source_word: כַּמַּרְאֶה
  choice: wie die Erscheinung
  rationale: Bewahrt den Vergleich mit der zuvor gesehenen sichtbaren Erscheinung; „Erscheinung“ lässt offen, ob Form, Anblick oder visionäre Manifestation im Vordergrund steht.
- source_word: אֲשֶׁר רָאִיתִי
  choice: die ich … gesehen hatte
  rationale: Das Plusquamperfekt macht den Rückbezug auf eine frühere Schau im natürlichen deutschen Erzählstil deutlich.
- source_word: בַּבִּקְעָה
  choice: in der Talebene
  rationale: „Talebene“ bildet die Bedeutungsbreite von בִּקְעָה als breites Tal beziehungsweise Ebene möglichst knapp ab; eine alternative Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Art der Gottesoffenbarung in „Herrlichkeit des Gottes Israels“
  choice: Die Aussage wird ohne erklärenden Zusatz als wahrnehmbare Erscheinung der Herrlichkeit Gottes wiedergegeben.
  alternative: „der sichtbare Glanz der Gegenwart Gottes“ oder „eine theophanische Erscheinung“
  rationale: Der hebräische Text bezeichnet das Wahrgenommene als Gottes Herrlichkeit und vergleicht es mit einer früheren Erscheinung, erklärt aber deren genaues Wesen nicht. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, prophetischem Ton. „Und sieh“ erhält die visionäre Unmittelbarkeit, ohne das heute stark altertümlich wirkende „siehe“ zu verwenden. Der Doppelpunkt strukturiert den deiktischen Auftakt natürlich.
