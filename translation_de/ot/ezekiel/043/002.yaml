base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/002.yaml
  text: And behold[a], the glory of the God of Israel was coming from the way of the east, and his voice was like the sound of many waters[b], and the earth shone from his glory.
translation:
  language: de
  text: Und siehe, die Herrlichkeit des Gottes Israels kam aus östlicher Richtung[a]. Seine Stimme war wie das Rauschen vieler Wasser[b], und die Erde leuchtete von seiner Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Weg des Ostens“; auch: „von Osten her“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie der Schall vieler Wasser“; auch: „wie das Tosen vieler Wasser“. Statt „seine Stimme“ ist grammatisch auch „ihr Schall“ möglich, bezogen auf die Herrlichkeit.'
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt die anschauliche, aufmerksamkeitslenkende Kraft der hebräischen Visionsformel und den plötzlichen Eindruck der Erscheinung.
- source_word: כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: die Herrlichkeit des Gottes Israels
  rationale: „Herrlichkeit“ ist in diesem theophanischen Zusammenhang die sachlich und theologisch angemessene Wiedergabe von כָּבוֹד; die Genitivverbindung gibt die hebräische Konstruktverbindung natürlich wieder.
- source_word: בָּא
  choice: kam
  rationale: Das Qatal wird als Teil des rückblickend erzählten Visionsgeschehens wiedergegeben. Das Deutsche benötigt hier keine Verlaufsform; „kam“ lässt die Bewegung dennoch klar erkennen.
- source_word: מִדֶּרֶךְ הַקָּדִים
  choice: aus östlicher Richtung
  rationale: Gibt die Richtungsangabe idiomatisch wieder. דֶּרֶךְ bedeutet wörtlich „Weg“, kann hier aber die Richtung bezeichnen; die wörtlichere Form wird in der Fußnote dokumentiert.
- source_word: וְקוֹלוֹ
  choice: Seine Stimme
  rationale: קוֹל kann „Stimme“, „Laut“ oder „Schall“ bedeuten. Die persönliche Wiedergabe passt zur Erscheinung des Gottes Israels, ohne die grammatische Bezugsmöglichkeit auf „Herrlichkeit“ zu verschweigen.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: wie das Tosen gewaltiger Wassermassen
  rationale: Vermittelt das mächtige akustische Bild in natürlichem modernem Deutsch. „Tosen“ konkretisiert den hier gemeinten Schall; „Wassermassen“ gibt den idiomatischen Sinn des hebräischen Plurals מַיִם mit רַבִּים wieder.
- source_word: וְהָאָרֶץ
  choice: und die Erde
  rationale: Im umfassenden Bild der Gotteserscheinung ist „Erde“ wahrscheinlicher als das ebenfalls mögliche „Land“.
- source_word: הֵאִירָה מִכְּבֹדוֹ
  choice: leuchtete von seiner Herrlichkeit
  rationale: Die Hifil-Form beschreibt das Hellwerden beziehungsweise Leuchten; מִן bezeichnet am natürlichsten die Herrlichkeit als Quelle des Lichts.
theological_decisions:
- issue: Persönlicher oder unpersönlicher Bezug der Suffixe in וְקוֹלוֹ und מִכְּבֹדוֹ
  choice: „seine Stimme“ und „seiner Herrlichkeit“
  alternative: „ihr Schall“ und „ihrer Herrlichkeit“, jeweils auf die Herrlichkeit bezogen
  rationale: Grammatisch kann die zuvor genannte Herrlichkeit als Bezug dienen; im Kontext verkörpert sie jedoch die persönliche Gegenwart des Gottes Israels. Die persönliche Form ist im Deutschen natürlicher, während die Fußnote die sprachliche Mehrdeutigkeit offenhält.
- issue: Umfang von הָאָרֶץ
  choice: „die Erde“
  alternative: „das Land“
  rationale: Die Lichtwirkung der Gotteserscheinung legt ein umfassendes Bild nahe. Da das hebräische Wort beide Bedeutungen zulässt, wird die Alternative nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Anschaulichkeit. „Und siehe“ erhält bewusst den markanten Visionston; die übrige Syntax ist flüssig und allgemein verständlich.
