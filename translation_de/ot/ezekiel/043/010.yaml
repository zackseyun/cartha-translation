id: EZK.43.10
reference: Ezekiel 43:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
translation:
  language: de
  text: Du aber, Menschensohn, beschreibe dem Haus Israel den Tempel[a], damit sie sich ihrer Vergehen schämen; und sie sollen den Bauplan[b] vermessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Haus“. Gemeint ist hier das Heiligtum beziehungsweise der Tempel in Hesekiels Vision.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die Anlage“, „die Gestalt“ oder „das Muster“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels charakteristische göttliche Anrede und ihre literarische Kontinuität, ohne sie deutend als „Sterblicher“ wiederzugeben.
- source_word: הַגֵּד
  choice: beschreibe
  rationale: נגד bezeichnet hier die angeordnete Mitteilung dessen, was Hesekiel in der Vision gesehen hat. „Beschreibe“ ist im Zusammenhang eines Tempelentwurfs natürlich und gibt den Aufforderungscharakter wieder.
- source_word: בֵּית יִשְׂרָאֵל
  choice: dem Haus Israel
  rationale: Die feste prophetische Kollektivbezeichnung bleibt erhalten; „dem Volk Israel“ wäre verständlicher, aber stärker auslegend.
- source_word: הַבַּיִת
  choice: den Tempel
  rationale: Wörtlich steht „das Haus“, doch in Hesekiel 40–43 ist eindeutig das visionäre Heiligtum gemeint. „Tempel“ bezeichnet den Referenten im heutigen Deutsch klar.
- source_word: וְיִכָּלְמוּ
  choice: damit sie sich … schämen
  rationale: Die Verbform nach dem Imperativ lässt sich sinnvoll als Zweck oder beabsichtigte Folge verstehen. Die deutsche Fassung bewahrt diese Funktion.
- source_word: מֵעֲוֺנוֹתֵיהֶם
  choice: ihrer Vergehen
  rationale: עָוֹן bezeichnet schuldhaftes Fehlverhalten und kann zugleich die damit verbundene Schuld einschließen. „Vergehen“ bewahrt das moralische Gewicht, ohne den Begriff unnötig einzuengen.
- source_word: וּמָדְדוּ
  choice: und sie sollen … vermessen
  rationale: Die Form wird als auffordernde Fortsetzung verstanden. „Sollen“ gibt diese jussivische Nuance natürlicher wieder als ein bloßes Futur.
- source_word: תָּכְנִית
  choice: den Bauplan
  rationale: Das Wort bezeichnet hier Gestalt, Anlage oder Entwurf des Tempels. „Bauplan“ macht den architektonischen Bezug deutlich; mögliche Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Bezug von הַבַּיִת in der Tempelvision
  choice: Tempel
  alternative: Haus
  rationale: Im unmittelbaren Zusammenhang bezeichnet „das Haus“ das visionäre Heiligtum. „Tempel“ klärt den sachlichen Bezug, ohne zusätzliche kultische oder eschatologische Festlegungen einzutragen.
- issue: Funktion der Verben nach dem Imperativ
  choice: 'Zweck und anschließende Aufforderung: „damit sie …; und sie sollen …“'
  alternative: 'Einfache Folge: „und sie werden sich schämen und … vermessen“'
  rationale: Die Syntax lässt eine Zweck- beziehungsweise Ergebnisnuance und anschließend auffordernde Fortführung zu. Da eine rein futurische Lesart ebenfalls möglich ist, wird sie nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Sprachklang. „Menschensohn“ und „Haus Israel“ erhalten zentrale hebräische Wendungen; „Tempel“ und „Bauplan“ sorgen im visionär-architektonischen Zusammenhang für unmittelbare Verständlichkeit.
