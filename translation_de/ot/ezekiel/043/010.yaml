  terminology: „Menschensohn“ und „Haus Israel“ bewahren die wiederkehrende Sprache Hesekiels. „Tempel“ verdeutlicht den kontextuellen Referenten, ohne über den Text hinauszugehen; Fußnote a dokumentiert transparent die wörtliche Alternative. „Vergehen“ ist für עָוֹן etwas weniger fachsprachlich als „Schuld“ oder „Missetaten“, trägt hier aber die erforderliche moralische Bedeutung. Die Alternativen zu תָּכְנִית sind korrekt an Fußnote b verankert.
