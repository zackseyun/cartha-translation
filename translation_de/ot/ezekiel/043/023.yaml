  text: בְּ/כַלּוֹתְ/ךָ֖ מֵֽ/חַטֵּ֑א תַּקְרִיב֙ פַּ֣ר בֶּן בָּקָ֣ר תָּמִ֔ים וְ/אַ֥יִל מִן הַ/צֹּ֖אן תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/023.yaml
  text: When you have finished making purification[c][b][a], you shall present a flawless young bull and a flawless ram from the flock.
translation:
  language: de
  text: Wenn du die Reinigung[a] vollendet hast, sollst du einen makellosen[c] jungen Stier[b] und einen makellosen Widder aus der Herde darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Entsündigung“, „Sühne“ oder „Reinigung von Sünde“. Das hebräische Verb kann im Opferkult die rituelle Reinigung beziehungsweise Entsündigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einen Stier, einen Sohn des Rindes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „fehlerlosen“ beziehungsweise „ohne Fehler“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכַלּוֹתְךָ
  choice: Wenn du … vollendet hast
  rationale: Die Präposition ב mit dem Infinitivus constructus von כלה und dem Suffix der 2. Person Maskulin Singular leitet einen temporalen Nebensatz ein. Die Formulierung gibt den Abschluss der Handlung natürlich und würdig wieder.
- source_word: מֵחַטֵּא
  choice: die Reinigung
  rationale: Die intensive Verbform von חטא kann im Opfer- und Heiligtumskontext das Entfernen von Sünde beziehungsweise Unreinheit bezeichnen. „Reinigung“ wahrt den kultischen Sinn, ohne ihn einseitig auf Sühne festzulegen.
- source_word: תַּקְרִיב
  choice: sollst du … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Opfergabe. „Darbringen“ ist im Deutschen klar, angemessen feierlich und kontextgerecht.
- source_word: פַּר בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: Die Wendung bezeichnet einen Stier aus dem Rinderbestand und hebt wahrscheinlich sein Alter hervor. „Junger Stier“ ist idiomatisch und vermeidet eine unnatürliche wörtliche Wiedergabe.
- source_word: תָּמִים
  choice: makellosen
  rationale: Bei Opfertieren bezeichnet תמים das Freisein von körperlichen Fehlern. „Makellos“ gibt diese kultische Anforderung prägnant und verständlich wieder und wird bei beiden Tieren gleich übersetzt.
- source_word: וְאַיִל
  choice: und einen … Widder
  rationale: אַיִל ist die übliche Bezeichnung für einen Widder.
- source_word: מִן הַצֹּאן
  choice: aus der Herde
  rationale: צאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Aus der Herde“ ist im Zusammenhang knapp und natürlich.
theological_decisions:
- issue: Bedeutung von חטא im Zusammenhang der Altarweihe
  choice: Reinigung
  alternative: Entsündigung; Sühne; Reinigung von Sünde
  rationale: Das Verb bezeichnet hier die rituelle Beseitigung von Sünde beziehungsweise Unreinheit. „Reinigung“ erhält die kultische Bedeutung und die begriffliche Offenheit, ohne die Stelle vorschnell auf eine bestimmte Sühnetheorie festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem kultischem Register. „Darbringen“ wahrt den Opferkontext; „Reinigung“ ist natürlicher als ein technischer Neologismus und lässt die semantische Spannung des hebräischen Verbs durch die Fußnote sichtbar.
