  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: die zeitliche Fortführung, die Anrede im Singular, den fehlerlosen Ziegenbock, dessen Bestimmung als חַטָּאת, die rituelle Reinigung des Altars und den Vergleich mit dem zuvor verwendeten Stier. Das anaphorische „ihn“ ist sinnvoll auf den Altar bezogen. Das Perfekt „gereinigt haben“ entspricht dem rückblickenden Bezug des hebräischen Perfekts auf den vorher beschriebenen Ritus.'
