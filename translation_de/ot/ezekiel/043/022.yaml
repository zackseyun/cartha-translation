source:
  edition: WLC
  text: וּ/בַ/יּוֹם֙ הַ/שֵּׁנִ֔י תַּקְרִ֛יב שְׂעִיר עִזִּ֥ים תָּמִ֖ים לְ/חַטָּ֑את וְ/חִטְּאוּ֙ אֶת הַ/מִּזְבֵּ֔חַ כַּ/אֲשֶׁ֥ר חִטְּא֖וּ בַּ/פָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/022.yaml
  text: And on the second day you shall present a male goat without blemish for a sin offering[a], and they shall purify the altar just as they purified it with the bull.
translation:
  language: de
  text: Und am zweiten Tag sollst du einen fehlerlosen Ziegenbock als Sündopfer[a] darbringen. Dann sollen sie den Altar reinigen, wie sie ihn mit dem Stier gereinigt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Reinigungsopfer“. Das hebräische Wort חַטָּאת kann sowohl ein Sündopfer als auch ein Opfer bezeichnen, das der Beseitigung kultischer Unreinheit dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: Und am zweiten Tag
  rationale: Die Wiedergabe bewahrt sowohl die zeitliche Angabe als auch den durch ו angezeigten Anschluss an die vorherige Anweisung.
- source_word: תַּקְרִיב
  choice: sollst du ... darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das kultische Darbringen; die deutsche Verbklammer ergibt eine natürliche Satzstellung.
- source_word: שְׂעִיר עִזִּים
  choice: einen Ziegenbock
  rationale: Die hebräische Opferbezeichnung meint einen männlichen Ziegenbock; diese Formulierung ist im modernen Deutsch präzise und geläufig.
- source_word: תָּמִים
  choice: fehlerlosen
  rationale: Im Opferkontext bezeichnet תמים ein Tier ohne körperlichen Makel. „Fehlerlos“ ist verständlich und wahrt den kultischen Sinn.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חטאת bezeichnet hier aufgrund des Opferkontexts das Opfer. „Sündopfer“ ist die etablierte deutsche Bezeichnung; die mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in der Fußnote genannt.
- source_word: וְחִטְּאוּ אֶת־הַמִּזְבֵּחַ
  choice: Dann sollen sie den Altar reinigen
  rationale: Der Piel von חטא bedeutet bei einem kultischen Gegenstand, ihn rituell zu entsündigen beziehungsweise zu reinigen. „Reinigen“ vermeidet die falsche Vorstellung moralischer Schuld des Altars. „Dann“ gibt den fortführenden Zusammenhang idiomatisch wieder.
- source_word: כַּאֲשֶׁר חִטְּאוּ בַּפָּר
  choice: wie sie ihn mit dem Stier gereinigt haben
  rationale: כַּאֲשֶׁר leitet den Vergleich mit dem vorherigen Ritus ein; ב ist instrumental. Das Pronomen „ihn“ nimmt den Altar natürlich wieder auf.
theological_decisions:
- issue: Wiedergabe der Wörter חטאת und חטא im Zusammenhang kultischer Reinigung
  choice: Für das Substantiv steht „Sündopfer“, für das auf den Altar bezogene Verb „reinigen“.
  alternative: Das Substantiv kann als „Reinigungsopfer“ wiedergegeben werden, um die reinigende Funktion ausdrücklich hervorzuheben.
  rationale: Das Hebräische verwendet denselben Wortstamm für das Opfer und die am Altar vollzogene Handlung. Im Deutschen ist eine unterschiedliche Wiedergabe nötig, damit deutlich bleibt, dass der Altar rituell gereinigt wird und nicht selbst moralisch gesündigt hat. Die Fußnote bewahrt die echte Bedeutungsbreite des Opferbegriffs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger kultischer Terminologie. Die Satzteilung verbessert die Verständlichkeit, ohne die Abfolge oder den logischen Zusammenhang des Hebräischen zu verändern.
