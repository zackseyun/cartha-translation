  text: בְּ/תִתָּ֨/ם סִפָּ֜/ם אֶת סִפִּ֗/י וּ/מְזֽוּזָתָ/ם֙ אֵ֣צֶל מְזוּזָתִ֔/י וְ/הַ/קִּ֖יר בֵּינִ֣/י וּ/בֵֽינֵי/הֶ֑ם וְ/טִמְּא֣וּ אֶת שֵׁ֣ם קָדְשִׁ֗/י בְּ/תֽוֹעֲבוֹתָ/ם֙ אֲשֶׁ֣ר עָשׂ֔וּ וָ/אֲכַ֥ל אֹתָ֖/ם בְּ/אַפִּֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/008.yaml
  text: When they set their threshold beside my threshold and their doorposts beside my doorposts[a], with only the wall between me and them, they defiled my holy name by the abominations that they committed[c][b]; so I consumed them in my anger.
translation:
  language: de
  text: Als sie ihre Schwelle[a] neben meine Schwelle und ihre Türpfosten[b] neben meine Türpfosten setzten und die Mauer zwischen mir und ihnen stand, entweihten sie meinen heiligen Namen durch die Gräueltaten, die sie begingen; und ich verzehrte sie in meinem Zorn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Sohle neben meine Sohle“. Das hebräische Wort kann eine Schwelle oder Sohle bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Türrahmen neben meine Türrahmen“. Das hebräische Wort bezeichnet den Pfosten beziehungsweise die seitliche Einfassung einer Tür.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Und ich aß sie.“ Im Zusammenhang des Gerichts bedeutet das hebräische Bild, dass Gott sie verzehrte beziehungsweise vernichtete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִתָּם
  choice: Als sie … setzten
  rationale: Die Präposition ב mit dem Infinitiv von נתן bildet hier einen temporalen Begleitsatz. „Als sie … setzten“ gibt diesen Sinn natürlich wieder.
- source_word: סִפָּם / סִפִּי
  choice: ihre Schwelle / meine Schwelle
  rationale: סַף bezeichnet im baulichen Zusammenhang eine Schwelle beziehungsweise Türschwelle. „Schwelle“ bewahrt das architektonische Bild knapp und verständlich.
- source_word: מְזוּזָתָם / מְזוּזָתִי
  choice: ihre Türpfosten / meine Türpfosten
  rationale: מְזוּזָה bezeichnet einen Türpfosten oder eine Türlaibung. „Türpfosten“ ist im modernen Standarddeutsch klar und anschaulich.
- source_word: אֵצֶל
  choice: neben
  rationale: Die Präposition bezeichnet unmittelbare räumliche Nähe; „neben“ ist präzise und idiomatisch.
- source_word: וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  choice: wobei nur die Mauer zwischen mir und ihnen war
  rationale: Der verblosen hebräischen Aussage entspricht ein deutscher Begleitsatz. „Nur“ macht die im Zusammenhang hervorgehobene minimale Trennung deutlich, ohne eine weitergehende räumliche Deutung einzuführen.
- source_word: וְטִמְּאוּ אֶת שֵׁם קָדְשִׁי
  choice: entweihten sie meinen heiligen Namen
  rationale: Das Piel von טמא bedeutet verunreinigen oder entweihen. Beim heiligen Namen Gottes trifft „entweihen“ den kultischen und moralischen Zusammenhang natürlich.
- source_word: בְּתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: durch die Gräueltaten, die sie begingen
  rationale: ב bezeichnet hier das Mittel beziehungsweise den Grund der Entweihung. „Gräueltaten“ erhält die starke religiös-moralische Wertung von תּוֹעֵבָה; zu diesem Substantiv ist „begingen“ im Deutschen idiomatisch.
- source_word: וָאֲכַל אֹתָם
  choice: Da verzehrte ich sie
  rationale: אכל bedeutet wörtlich „essen“, wird in Gerichtsaussagen jedoch bildhaft im Sinn von verzehren oder vernichten gebraucht. „Verzehrte“ bewahrt das Bild und die Härte der Aussage.
- source_word: בְּאַפִּי
  choice: in meinem Zorn
  rationale: אַף bezeichnet wörtlich auch Nase beziehungsweise Schnauben, ist hier aber die geläufige Wendung für Zorn. „In meinem Zorn“ ist klar, würdig und gegenwärtig.
theological_decisions:
- issue: Bildhafte Gerichtssprache in וָאֲכַל אֹתָם
  choice: „Da verzehrte ich sie“
  alternative: „Da vernichtete ich sie“ oder wörtlich „Da aß ich sie“
  rationale: „Verzehrte“ lässt die anthropomorphe Metapher des hebräischen Verbs erkennen, ohne sie als grob wörtliche Aussage misszuverstehen oder durch das abstraktere „vernichtete“ ganz aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer architektonischer Bildsprache. Die kultische Dimension von טמא wird durch „entweihten“ bewahrt; die drastische Gerichtssprache bleibt in „verzehrte“ erkennbar. Die Satzstruktur folgt dem hebräischen Gedankengang, ohne im Deutschen schwerfällig zu wirken.
