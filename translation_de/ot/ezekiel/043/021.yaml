base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/021.yaml
  text: Then you shall take the bull of the sin offering and burn it in the appointed place of the house[b][a], outside the sanctuary.
translation:
  language: de
  text: Dann sollst du den Stier des Sündopfers[a] nehmen, und man soll ihn an dem dafür bestimmten Ort des Hauses[b] außerhalb des Heiligtums verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Stier für das Sündopfer“; auch „den Stier des Reinigungsopfers“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „am bestimmten Ort des Hauses“. Mit „Haus“ ist hier der Tempel beziehungsweise die Tempelanlage gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann sollst du … nehmen
  rationale: Das Waw mit Qatal setzt die Abfolge der Ritualanweisungen fort. „Dann“ verdeutlicht diesen Ablauf, während „sollst du“ den anweisenden Charakter wahrt.
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet einen Stier beziehungsweise Jungstier; „Stier“ gibt den Ausdruck natürlich wieder, ohne eine im Kontext nicht ausdrücklich bestimmte Altersangabe hinzuzufügen.
- source_word: הַחַטָּאת
  choice: des Sündopfers
  rationale: חַטָּאת bezeichnet hier im Opferkontext das Opfer für Sünde. „Sündopfer“ ist der geläufige kultische Ausdruck; die mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: וּשְׂרָפוֹ
  choice: man soll ihn … verbrennen
  rationale: Die hebräische Form steht in der 3. Person Singular mit maskulinem Objektsuffix und wechselt damit von der direkten Anrede zu einem nicht ausdrücklich genannten Ausführenden. Die unpersönliche deutsche Form bewahrt diesen Wechsel, ohne einen bestimmten männlichen Handelnden einzuführen.
- source_word: בְּמִפְקַד הַבַּיִת
  choice: an dem dafür bestimmten Ort des Hauses
  rationale: מִפְקָד bezeichnet hier einen zugewiesenen oder bestimmten Ort. „Haus“ entspricht הַבַּיִת formal und bezeichnet in diesem Zusammenhang den Tempel beziehungsweise die Tempelanlage; dies wird in der Fußnote erläutert.
- source_word: מִחוּץ לַמִּקְדָּשׁ
  choice: außerhalb des Heiligtums
  rationale: Die Wendung bezeichnet einen Ort außerhalb des geheiligten Bereichs; „Heiligtum“ ist eine klare und kultisch angemessene Wiedergabe von מִקְדָּשׁ.
theological_decisions:
- issue: Wiedergabe des Opferbegriffs חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Beide Benennungen erfassen Aspekte des hebräischen Kultbegriffs. Der Haupttext verwendet den vertrauten Ausdruck „Sündopfer“, während die Fußnote die sachlich mögliche Alternative nennt und so die begriffliche Spannung nicht verdeckt.
- issue: Personenwechsel bei וּשְׂרָפוֹ
  choice: man soll ihn verbrennen
  alternative: du sollst ihn verbrennen
  rationale: Der masoretische Text hat nach der Anrede in der 2. Person eine Verbform der 3. Person Singular. Statt diesen Wechsel stillschweigend zu glätten, gibt die unpersönliche Konstruktion ihn in natürlichem Deutsch wieder, ohne die Identität des Ausführenden festzulegen.
- issue: Bedeutung von הַבַּיִת
  choice: Haus im Haupttext, mit Erklärung als Tempel beziehungsweise Tempelanlage
  alternative: Tempel
  rationale: „Haus“ wahrt das konkrete hebräische Bild und die formale Entsprechung. Da es hier nicht ein gewöhnliches Wohnhaus meint, erläutert die Fußnote den kultisch-architektonischen Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wahrt den anweisenden Ritualstil, den Personenwechsel des Hebräischen und die kultische Fachsprache, erklärt jedoch potenziell missverständliches „Haus“ in einer Fußnote.
