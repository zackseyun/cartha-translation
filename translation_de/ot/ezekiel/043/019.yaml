source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶל הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֡ם אֲשֶׁ֣ר הֵם֩ מִ/זֶּ֨רַע צָד֜וֹק הַ/קְּרֹבִ֣ים אֵלַ֗/י נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה לְ/שָֽׁרְתֵ֑/נִי פַּ֥ר בֶּן בָּקָ֖ר לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/019.yaml
  text: And you shall give to the Levitical priests who are from the offspring of Zadok[a], who draw near to me to minister to me, declares the Lord GOD, a bull from the herd for a sin offering.
translation:
  language: de
  text: Und du sollst den levitischen Priestern, die von Zadok abstammen und sich mir nahen, um mir zu dienen – Spruch des Herrn Yahweh –, einen jungen Stier[a] als Sündopfer geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Stier, einen Sohn des Rindviehs“; auch möglich: „einen Stier aus der Rinderherde“.'
    reason: Die Fußnote dokumentiert die appositionelle hebräische Formulierung פַּר בֶּן־בָּקָר, während „junger Stier“ im Haupttext idiomatisches Deutsch bietet.
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Und du sollst … geben
  rationale: Das Qal-Perfekt mit וְ hat im anweisenden Zusammenhang verpflichtenden Zukunfts- bzw. Befehlscharakter. Die Formulierung bewahrt zugleich die Verbindung zum vorherigen Vers.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: den levitischen Priestern
  rationale: Die Wendung bezeichnet Priester, die zu Levi gehören, nicht unterschiedslos alle Leviten. „Levitische Priester“ ist im Deutschen knapp und sachgerecht.
- source_word: אֲשֶׁר הֵם מִזֶּרַע צָדוֹק
  choice: die von den Nachkommen Zadoks sind
  rationale: מִזֶּרַע bezeichnet genealogische Herkunft. „Nachkommen Zadoks“ gibt den Sinn natürlich wieder, ohne die im Deutschen missverständliche wörtliche Metapher „Same“ zu verwenden.
- source_word: הַקְּרֹבִים אֵלַי
  choice: die sich mir nahen
  rationale: קרב bezeichnet hier das kultische Herantreten an Gott. „Sich nahen“ bewahrt sowohl die räumliche Bildsprache als auch den priesterlichen Unterton.
- source_word: לְשָׁרְתֵנִי
  choice: um mir zu dienen
  rationale: שרת meint in diesem Zusammenhang den priesterlich-liturgischen Dienst. „Mir dienen“ ist verständlich und lässt diesen durch den Kontext bestimmten Sinn bestehen.
- source_word: פַּר בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: Die feste Tierbezeichnung, wörtlich etwa „ein Stier, ein Sohn des Rindes/der Rinderherde“, bezeichnet idiomatisch einen jungen Stier. Eine Fußnote dokumentiert die konkrete hebräische Ausdrucksweise.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet im Opferkontext das Sündopfer und nicht lediglich die abstrakte Sünde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: אֲדֹנָי wird als „Herr“ und der ausdrücklich gesetzte Gottesname יהוה als „Yahweh“ wiedergegeben. So bleiben Titel und Eigenname unterscheidbar, ohne die Aussage konfessionell auszudeuten.
- issue: Bedeutung des Sich-Nahens der zadokidischen Priester
  choice: sich mir nahen, um mir zu dienen
  alternative: zu mir kommen, um mir zu dienen
  rationale: Die Übersetzung bewahrt den kultisch-priesterlichen Klang von קרב, ohne daraus eine weitergehende Lehraussage über geistliche Nähe abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Abfolge, wird jedoch durch Gedankenstriche um die prophetische Redeformel lesbar gegliedert. „Sich nahen“ ist bewusst leicht gehoben, da es den kultischen Gehalt präziser wahrt als das allgemeinere „herankommen“.
