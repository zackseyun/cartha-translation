source:
  edition: WLC
  text: וּ/כְ/מַרְאֵ֨ה הַ/מַּרְאֶ֜ה אֲשֶׁ֣ר רָאִ֗יתִי כַּ/מַּרְאֶ֤ה אֲשֶׁר רָאִ֨יתִי֙ בְּ/בֹאִ/י֙ לְ/שַׁחֵ֣ת אֶת הָ/עִ֔יר וּ/מַרְא֕וֹת כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי אֶל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/003.yaml
  text: And the appearance of what I saw was like the appearance that I had seen when I came to destroy the city[a], and the visions were like the appearance that I had seen by the Kebar Canal[b]; and I fell on my face.
translation:
  language: de
  text: Und das Aussehen der Erscheinung, die ich sah, glich der Erscheinung, die ich gesehen hatte, als ich kam, um die Stadt zu zerstören[a]. Die Visionen glichen der Erscheinung, die ich am Kebar-Kanal[b] gesehen hatte. Da fiel ich mit dem Gesicht zur Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als er kam, um die Stadt zu zerstören“. Im hebräischen Text steht „als ich kam“; dies kann Hesekiels Beteiligung an der Vision von der Zerstörung Jerusalems ausdrücken, ohne dass er selbst die Stadt buchstäblich zerstörte.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: „am Fluss Kebar“; wahrscheinlich handelte es sich um einen bedeutenden Kanal in Babylonien und nicht um einen natürlichen Fluss.'
    reason: cultural_note
lexical_decisions:
- source_word: מַרְאֶה / מַרְאוֹת
  choice: Erscheinung / Visionen
  rationale: Die singularischen Formen werden mit „Erscheinung“, der Plural mit „Visionen“ wiedergegeben. So bleiben sowohl die auffällige Wiederholung des hebräischen Ausdrucks als auch der Numeruswechsel erkennbar, ohne dass der deutsche Satz unnatürlich wirkt.
- source_word: רָאִיתִי
  choice: ich sah / ich gesehen hatte
  rationale: Im einleitenden Relativsatz steht natürliches deutsches Präteritum; in den rückblickenden Vergleichen verdeutlicht das Plusquamperfekt die zeitliche Abfolge.
- source_word: בְּבֹאִי
  choice: als ich kam
  rationale: Der Infinitiv mit Suffix der ersten Person hat hier temporale Bedeutung. Die erste Person wird trotz ihrer inhaltlichen Schwierigkeit bewahrt.
- source_word: לְשַׁחֵת
  choice: um … zu zerstören
  rationale: Die finale Konstruktion und die starke Bedeutung des Verbs שׁחת werden direkt und klar wiedergegeben.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Der hebräische Text nennt Jerusalem nicht ausdrücklich, sondern sagt lediglich „die Stadt“; diese Offenheit bleibt erhalten.
- source_word: אֶל נְהַר כְּבָר
  choice: am Kebar-Kanal
  rationale: Das Gewässer Kebar war wahrscheinlich ein bedeutender Kanal in Babylonien. „Am“ gibt die örtliche Beziehung im Deutschen idiomatisch wieder.
- source_word: וָאֶפֹּל אֶל־פָּנַי
  choice: Da fiel ich mit dem Gesicht zur Erde
  rationale: Die Formulierung bewahrt die körperliche Haltung von Ehrfurcht und Überwältigung, klingt dabei natürlicher und moderner als „auf mein Angesicht“.
theological_decisions:
- issue: Handelnde Person in „als ich kam, um die Stadt zu zerstören“
  choice: Die erste Person des masoretischen Textes bleibt im Haupttext erhalten.
  alternative: „als er kam, um die Stadt zu zerstören“
  rationale: Der hebräische Text lautet „als ich kam“ und kann auf Hesekiels Beteiligung am visionären Geschehen von Jerusalems Gericht verweisen, ohne ihn zwingend als buchstäblichen Zerstörer darzustellen. Die Spannung wird nicht durch eine stillschweigende Änderung der Person beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Rede von der „Erscheinung“ bildet die bewusste Wiederholung im Hebräischen ab; kurze Satzglieder verhindern dabei unnötige Schwerfälligkeit. Die schwierige erste Person bei der Zerstörung der Stadt sowie die geografische Bezeichnung Kebars werden durch Fußnoten erläutert.
