  text: וְ/אֵ֨לֶּה מִדּ֤וֹת הַ/מִּזְבֵּ֨חַ֙ בָּֽ/אַמּ֔וֹת אַמָּ֥ה אַמָּ֖ה וָ/טֹ֑פַח וְ/חֵ֨יק הָ/אַמָּ֜ה וְ/אַמָּה רֹ֗חַב וּ/גְבוּלָ֨/הּ אֶל שְׂפָתָ֤/הּ סָבִיב֙ זֶ֣רֶת הָ/אֶחָ֔ד וְ/זֶ֖ה גַּ֥ב הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/013.yaml
  text: 'And these are the measurements of the altar in cubits (the cubit being a cubit and a handbreadth): its gutter shall be one cubit[a], and one cubit its width, and its border on its rim all around shall be one span[c][b]. And this shall be the base of the altar.'
translation:
  language: de
  text: Und dies sind die Maße des Altars in Ellen – wobei eine Elle eine Elle und eine Handbreit beträgt:[a] Die Vertiefung misst eine Elle[b] und ist eine Elle breit. Ihr Rand an ihrer Kante ringsum misst eine Spanne. Dies ist die Erhebung des Altars.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die längere Elle, die aus einer gewöhnlichen Elle und einer Handbreit besteht.
    reason: cultural_note
  - marker: b
    text: Oder „Rinne“, „Graben“ oder „Unterbau“; welches Bauteil mit dem hebräischen Wort חֵיק genau gemeint ist, ist unsicher.
    reason: lexical_alternative
  - marker: c
    text: Oder „Dies ist der Rücken (oder der Sockel) des Altars.“ Die Bedeutung des hebräischen Wortes גַּב in dieser Baubeschreibung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹת
  choice: Maße
  rationale: Das Substantiv bezeichnet hier die Maßangaben für den Altar; „Maße“ ist im Deutschen natürlich und technisch passend.
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  choice: in Ellen – jede Elle entspricht einer Elle und einer Handbreit
  rationale: Die Wendung erläutert die hier verwendete längere Elle. Die Gedankenstriche geben den erklärenden Einschub klar und lesbar wieder.
- source_word: חֵיק
  choice: Vertiefung
  rationale: Das seltene architektonische Wort bezeichnet wahrscheinlich einen vertieften unteren Bereich oder eine rinnenartige Einfassung. „Vertiefung“ bleibt konkret, ohne die genaue Bauform festzulegen.
- source_word: רֹחַב
  choice: breit
  rationale: Die adjektivische Form fügt sich natürlich in die deutsche Maßbeschreibung ein und entspricht der ausdrücklich genannten Breite.
- source_word: גְּבוּלָהּ
  choice: Rand
  rationale: Gemeint ist eine begrenzende oder umlaufende Einfassung; „Rand“ ist in diesem architektonischen Zusammenhang verständlich.
- source_word: שְׂפָתָהּ
  choice: Kante
  rationale: Wörtlich bedeutet das Wort „Lippe“; bei einem Baukörper bezeichnet „Kante“ den gemeinten Abschluss idiomatischer.
- source_word: זֶרֶת
  choice: Spanne
  rationale: „Spanne“ ist die herkömmliche deutsche Bezeichnung für das kleine, von der Hand abgeleitete Längenmaß.
- source_word: גַּב
  choice: Sockel
  rationale: Im Zusammenhang bezeichnet das Wort wahrscheinlich den erhöhten Unterbau beziehungsweise die tragende Grundstruktur des Altars. „Sockel“ passt zur baulichen Beschreibung, während die Unsicherheit in einer Fußnote erhalten bleibt.
- source_word: הַמִּזְבֵּחַ
  choice: Altar
  rationale: Dies ist die übliche und sachlich eindeutige Wiedergabe der Opferstätte.
theological_decisions:
- issue: Seltene und architektonisch unsichere Fachbegriffe in der Beschreibung des Altars
  choice: חֵיק mit „Vertiefung“ und גַּב mit „Sockel“ wiedergeben, ohne die genaue Bauform näher festzulegen
  alternative: חֵיק als „Rinne“, „Graben“ oder „Unterbau“ und גַּב als „Höhe“, „Rückseite“ oder „Unterbau“ verstehen
  rationale: Der Vers enthält technische Maßangaben, deren genaue bauliche Referenten nicht sicher bestimmbar sind. Der Haupttext bietet verständliche räumliche Begriffe; die Fußnoten bewahren die echten lexikalischen Alternativen und vermeiden eine künstliche Sicherheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer technischer Satzführung. Der erläuternde Einschub zur Maßeinheit wird typografisch abgesetzt. Bei den seltenen Baubegriffen wahrt die Übersetzung die Unsicherheit des Hebräischen, ohne den Haupttext unnötig schwer verständlich zu machen.
