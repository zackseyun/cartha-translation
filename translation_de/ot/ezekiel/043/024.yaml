source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֖/ם לִ/פְנֵ֣י יְהוָ֑ה וְ/הִשְׁלִ֨יכוּ הַ/כֹּהֲנִ֤ים עֲלֵי/הֶם֙ מֶ֔לַח וְ/הֶעֱל֥וּ אוֹתָ֛/ם עֹלָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/024.yaml
  text: You shall present them before Yahweh[a], and the priests shall throw salt on them and offer them up as a burnt offering to Yahweh.
translation:
  language: de
  text: Du sollst sie vor Jahwe bringen. Dann sollen die Priester Salz auf sie werfen[a] und sie Jahwe als Brandopfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich „werfen“ oder „schleudern“; im Zusammenhang kann das Aufstreuen des Salzes gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּם
  choice: Du sollst sie … bringen
  rationale: Der Hifil von קרב bezeichnet das Heranbringen beziehungsweise Vorführen. Zusammen mit לִפְנֵי יְהוָה gibt „vor Jahwe bringen“ den Vorgang natürlich wieder, ohne ihn mit dem später genannten Darbringen als Opfer gleichzusetzen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier die räumlich-relationale Stellung vor beziehungsweise in der Gegenwart Jahwes. „Vor Jahwe“ ist knapp und im kultischen Zusammenhang verständlich.
- source_word: וְהִשְׁלִיכוּ
  choice: sollen … werfen
  rationale: שלך bedeutet gewöhnlich „werfen, schleudern“. Die formal nähere Wiedergabe „werfen“ bewahrt die Ausdrucksweise des Hebräischen; die Fußnote weist darauf hin, dass im rituellen Vollzug auch ein Aufstreuen gemeint sein kann.
- source_word: מֶלַח עֲלֵיהֶם
  choice: Salz auf sie
  rationale: מֶלַח bedeutet „Salz“, und עַל mit Suffix bezeichnet dessen Aufbringen auf die Opfertiere.
- source_word: וְהֶעֱלוּ אוֹתָם עֹלָה
  choice: und sie … als Brandopfer darbringen
  rationale: Der Hifil von עלה wird im Opferkontext für das Darbringen verwendet; עֹלָה ist der Fachausdruck für das vollständig verbrannte Brandopfer. „Als Brandopfer darbringen“ ist im Deutschen klar und idiomatisch.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition לְ kennzeichnet Ziel beziehungsweise Widmung des Opfers. Mit „Jahwe … darbringen“ wird diese Beziehung im Deutschen durch den Dativ natürlich ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Yahweh; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֹלָה
  choice: Brandopfer
  alternative: Ganzopfer; Aufstiegsopfer
  rationale: „Brandopfer“ ist die etablierte und allgemein verständliche deutsche Bezeichnung. Die mögliche etymologische Vorstellung des Aufsteigens wird nicht zusätzlich ausgedeutet, da der Vers selbst sie nicht erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich konkrete Wortwahl „Salz auf sie werfen“ bewahrt die lexikalische Stärke des hebräischen Verbs; die Fußnote macht die mögliche kultische Nuance transparent. Der zweite Satz beginnt zur natürlichen Gliederung mit „Dann“, ohne die Abfolge über das Hebräische hinaus zu präzisieren.
