base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/027.yaml
  text: When the days are completed[a], then from the eighth day onward the priests shall offer on the altar your burnt offerings and your peace offerings, and I will accept you, declares the Lord GOD.
translation:
  language: de
  text: Wenn die Tage vollendet sind, werden die Priester vom achten Tag an auf dem Altar eure Brandopfer und eure Heilsopfer[a] darbringen, und ich werde euch annehmen, spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gemeinschaftsopfer.'
    reason: Lexikalische Alternative für שְׁלָמִים, dessen Bedeutungsfeld Heil, Frieden und Gemeinschaft einschließt.
lexical_decisions:
- source_word: וִיכַלּוּ אֶת־הַיָּמִים
  choice: Wenn diese Tage vollendet sind
  rationale: Das Verb כלה bezeichnet hier den Abschluss der zuvor angeordneten siebentägigen Altarweihe. Die passive deutsche Form bewahrt die Tage als inhaltliches Subjekt; „diese“ stellt den Rückbezug im Zusammenhang natürlich her.
- source_word: בַיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: vom achten Tag an
  rationale: Die Wendung bezeichnet sowohl den achten Tag als Beginn als auch die anschließende fortlaufende Opferpraxis.
- source_word: יַעֲשׂוּ
  choice: darbringen
  rationale: Das allgemeine Verb „machen/tun“ hat mit Opfern auf dem Altar kultische Bedeutung. „Darbringen“ ist im Deutschen idiomatisch und präzise.
- source_word: עוֹלֹתֵיכֶם
  choice: eure Brandopfer
  rationale: עוֹלָה bezeichnet das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte und verständliche deutsche Bezeichnung.
- source_word: שַׁלְמֵיכֶם
  choice: eure Heilsopfer
  rationale: שְׁלָמִים bezeichnet Opfer, die mit Heil, Frieden und Gemeinschaft verbunden sind. „Heilsopfer“ ist eine traditionelle, relativ formnahe Wiedergabe; die ebenfalls mögliche Deutung „Gemeinschaftsopfer“ wird in der Fußnote genannt.
- source_word: וְרָצִאתִי אֶתְכֶם
  choice: Dann werde ich euch annehmen
  rationale: Das direkte Objekt sind die angesprochenen Menschen, nicht nur ihre Opfer. „Euch annehmen“ bewahrt diese relationale Aussage, ohne sie näher auszudeuten.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם wird als prophetische Botenformel natürlich mit „spricht“ wiedergegeben. „Herr“ bildet אֲדֹנָי ab, während „Yahweh“ den Gottesnamen transparent wiedergibt.
theological_decisions:
- issue: Bezug von Gottes Annahme
  choice: euch annehmen
  alternative: eure Opfer annehmen
  rationale: Der hebräische Text nennt ausdrücklich die Menschen als Objekt. Eine Beschränkung auf die Opfer würde die Aussage theologisch verengen.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom ausdrücklich gesetzten Gottesnamen יהוה und vermeidet, diesen durch einen weiteren Titel zu ersetzen.
- issue: Bedeutung von שְׁלָמִים
  choice: Heilsopfer
  alternative: Gemeinschaftsopfer
  rationale: Der Begriff umfasst Aspekte von Heil, Frieden und Gemeinschaft. Der Haupttext verwendet die etablierte deutsche Opferbezeichnung, während die Fußnote eine sachlich mögliche Alternative bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde für natürliche deutsche Informationsfolge in zwei Sätze gegliedert. Die kultischen Fachbegriffe bleiben erkennbar, während veraltete oder unnötig wörtliche Wendungen vermieden werden.
