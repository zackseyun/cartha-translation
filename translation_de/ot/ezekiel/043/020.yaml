base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/020.yaml
  text: And you shall take some of its blood and put it on its four horns[a], on the four corners of the ledge, and on the border all around; so you shall purify it and make atonement for it.
translation:
  language: de
  text: Du sollst etwas von seinem Blut nehmen und es an seine vier Hörner, an die vier Ecken des Absatzes[a] und an den Rand ringsum streichen. So sollst du den Altar reinigen und für ihn Sühne erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Einfassung. Das seltene hebräische Wort bezeichnet hier offenbar einen umlaufenden Absatz oder eine Plattform des Altars.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּמוֹ
  choice: etwas von seinem Blut
  rationale: Das partitive מִן bezeichnet hier einen Teil des Blutes; die Formulierung ist im Deutschen natürlich und sachlich genau.
- source_word: קַרְנֹתָיו
  choice: seine vier Hörner
  rationale: קֶרֶן bezeichnet bei einem Altar die hornartigen Vorsprünge an seinen Ecken; »Hörner« ist die übliche kultische Bezeichnung.
- source_word: פִּנּוֹת
  choice: Ecken
  rationale: Das Substantiv bezeichnet Ecken beziehungsweise äußerste Eckpunkte und ist hier architektonisch zu verstehen.
- source_word: הָעֲזָרָה
  choice: Absatz
  rationale: Im Zusammenhang mit dem Altar in Ezechiels Vision bezeichnet das seltene Wort offenbar ein umlaufendes Bauteil beziehungsweise eine Plattform. »Absatz« gibt diese bauliche Funktion verständlich wieder, ohne eine spätere Bedeutung als Tempelvorhof einzutragen.
- source_word: הַגְּבוּל סָבִיב
  choice: den Rand ringsum
  rationale: גְּבוּל bezeichnet hier die Begrenzung oder den Rand des Altarbauteils; סָבִיב macht deutlich, dass er ringsherum verläuft.
- source_word: וְנָתַתָּה
  choice: streichen
  rationale: Wörtlich steht »geben/anbringen«. Beim Auftragen von Blut auf Hörner, Ecken und Rand gibt »streichen« den konkreten Vorgang in natürlichem Deutsch wieder.
- source_word: וְחִטֵּאתָ אֹתוֹ
  choice: ihn reinigen
  rationale: Das Piel von חטא bezeichnet im Opferritus das Befreien von kultischer Verunreinigung beziehungsweise Schuld, nicht ein Veranlassen zur Sünde.
- source_word: וְכִפַּרְתָּהוּ
  choice: für ihn Sühne erwirken
  rationale: כפר trägt in priesterlich-kultischer Sprache die Bedeutung des Sühnens. Die Formulierung bewahrt diesen theologischen Gehalt, ohne eine bestimmte Sühnetheorie festzulegen.
theological_decisions:
- issue: Unterscheidung der beiden Ritualverben חטא (Piel) und כפר
  choice: ihn reinigen und für ihn Sühne erwirken
  alternative: ihn entsündigen und ihn entsühnen
  rationale: Der hebräische Text nennt zwei zusammengehörige, aber unterscheidbare kultische Handlungen. Zwei verschiedene deutsche Ausdrücke erhalten diese Spannung; zugleich vermeidet die gewählte Fassung die heute schwer verständlichen Neubildungen »entsündigen« und »entsühnen«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe »Hörner« und »Sühne« bleiben erhalten; seltene oder missverständliche Architektursprache wird im Haupttext verständlich und in der Fußnote offen wiedergegeben.
