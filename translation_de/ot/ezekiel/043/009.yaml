source:
  edition: WLC
  text: עַתָּ֞ה יְרַחֲק֧וּ אֶת זְנוּתָ֛/ם וּ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם מִמֶּ֑/נִּי וְ/שָׁכַנְתִּ֥י בְ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/009.yaml
  text: Now let them put far from me their prostitution and the corpses of their kings[b][a], and I will dwell in their midst forever.
translation:
  language: de
  text: Nun sollen sie ihre Hurerei[a] und die Leichname ihrer Könige[b] weit von mir entfernen. Dann werde ich für immer mitten unter ihnen wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das Wort auch mit „Prostitution“ wiedergegeben werden. Die Propheten verwenden dieses Bild für die Untreue gegenüber dem Bund mit Gott, die sich oft im Götzendienst zeigt.
    reason: lexical_alternative
  - marker: b
    text: Mit den „Leichnamen ihrer Könige“ können buchstäblich die sterblichen Überreste von Königen gemeint sein; möglicherweise geht es weiter gefasst um verunreinigende königliche Grabanlagen oder Gedenkstätten in der Nähe des Heiligtums.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Leitet als zeitlicher und folgernder Diskursmarker die jetzt geforderte Veränderung ein; „Nun“ ist knapp, würdig und im Deutschen natürlich.
- source_word: יְרַחֲקוּ
  choice: sollen sie … weit … entfernen
  rationale: Der Hifil von רחק ist kausativ („fern machen“, „entfernen“). Die Soll-Form gibt den im Kontext naheliegenden auffordernden bzw. jussivischen Sinn wieder.
- source_word: זְנוּתָם
  choice: ihre Hurerei
  rationale: Bewahrt das drastische prophetische Bild sexueller Käuflichkeit für den Bundesbruch, der sich häufig im Götzendienst zeigt. „Untreue“ wäre interpretierend und würde die Metapher abschwächen.
- source_word: פִגְרֵי מַלְכֵיהֶם
  choice: die Leichname ihrer Könige
  rationale: פגר bezeichnet einen Leichnam oder toten Körper. Die konkrete Formulierung bleibt erhalten, ohne den umstrittenen historischen Bezug im Haupttext festzulegen.
- source_word: מִמֶּנִּי
  choice: weit von mir
  rationale: Die Präposition bezeichnet die Entfernung von Gottes Gegenwart beziehungsweise Heiligtum und verbindet sich im Deutschen natürlich mit „weit … entfernen“.
- source_word: וְשָׁכַנְתִּי
  choice: Dann werde ich … wohnen
  rationale: „Wohnen“ erhält den für Gottes bleibende Gegenwart wichtigen Sinn von שכן. „Dann“ macht im Deutschen den sachlichen Anschluss an die vorausgehende Forderung natürlich deutlich.
- source_word: בְתוֹכָם
  choice: mitten unter ihnen
  rationale: Gibt sowohl die räumliche Vorstellung als auch die gemeinschaftliche Nähe der göttlichen Gegenwart idiomatisch wieder.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Bezeichnet in diesem Wiederherstellungszusammenhang eine bleibende, unaufhörliche Dauer; „für immer“ ist klares modernes Standarddeutsch.
theological_decisions:
- issue: Bedeutung von זְנוּתָם im prophetischen Zusammenhang
  choice: Die Metapher wird mit „ihre Hurerei“ bewahrt.
  alternative: „ihre Untreue“, „ihren Götzendienst“ oder „ihre sexuelle Unmoral“
  rationale: Der hebräische Ausdruck schildert den Bundesbruch in einer sexuellen Metapher, häufig mit Blick auf Götzendienst. Eine abstrakte Wiedergabe würde das Bild auflösen; eine rein sexuelle Deutung würde es verengen.
- issue: Aussageweise von יְרַחֲקוּ
  choice: 'Auffordernd bzw. jussivisch: „sollen sie … entfernen“'
  alternative: 'Vorhersagend: „sie werden entfernen“'
  rationale: Nach עַתָּה und im Zusammenhang der göttlichen Forderung liegt eine Aufforderung näher als eine bloße Zukunftsaussage.
- issue: Referenz der „Leichname ihrer Könige“
  choice: Die konkrete hebräische Wendung bleibt im Haupttext stehen.
  alternative: Deutende Wiedergabe als königliche Grabanlagen, Denkmäler oder götzendienerische Überreste
  rationale: Der genaue historische Bezug ist unsicher. Die Übersetzung bewahrt deshalb die Spannung des Wortlauts und erläutert mögliche Bezüge nur in der Fußnote.
- issue: Verhältnis der beiden Satzhälften
  choice: „Dann“ gibt den folgernden Anschluss idiomatisch wieder.
  alternative: 'Reihend: „und ich werde“'
  rationale: Das hebräische ו kann hier den Anschluss der göttlichen Verheißung an die geforderte Entfernung ausdrücken. „Dann“ macht diesen Zusammenhang lesbar, ohne eine weitergehende dogmatische Bedingungslehre zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. „Hurerei“ ist bewusst bildkräftig und prophetisch scharf, ohne archaische Syntax. Die konkrete und historisch mehrdeutige Wendung „Leichname ihrer Könige“ wird nicht im Haupttext ausgelegt.
