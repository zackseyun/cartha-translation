  text: וַ/יּוֹלִכֵ֖/נִי אֶל הַ/שָּׁ֑עַר שַׁ֕עַר אֲשֶׁ֥ר פֹּנֶ֖ה דֶּ֥רֶךְ הַ/קָּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/001.yaml
  text: Then he brought me to the gate[a], the gate that faces east.
translation:
  language: de
  text: Dann führte er mich zu dem Tor, dem Tor, das nach Osten weist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wird „Tor“ wiederholt: „zu dem Tor, dem Tor, das nach Osten weist“. Die Wiederholung präzisiert und betont vermutlich, welches Tor gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: Dann führte er mich
  rationale: Die Hifil-Form von הלך mit Suffix der 1. Person Singular bedeutet, jemanden gehen zu lassen bzw. zu führen. „Führte er mich“ ist im Zusammenhang einer geführten Besichtigung natürlich; „Dann“ gibt die erzählerische Abfolge des Waw-Konsekutivs wieder.
- source_word: אֶל הַשָּׁעַר
  choice: zu dem Tor
  rationale: אֶל bezeichnet die Richtung bzw. das Ziel, und הַשָּׁעַר ist ein bestimmtes Tor. „Zu dem Tor“ bildet beides klar ab.
- source_word: שַׁעַר
  choice: dem Tor
  rationale: 'Die zweite Nennung steht als Apposition zur ersten. Die Wiederholung bleibt erhalten, wird im Deutschen aber durch den Dativ syntaktisch eingebunden: „zu dem Tor, dem Tor …“'
- source_word: אֲשֶׁר פֹּנֶה
  choice: das … weist
  rationale: אֲשֶׁר leitet den Relativsatz ein; das Partizip פֹּנֶה beschreibt die Ausrichtung. „Nach Osten weist“ ist für ein Bauwerk idiomatisch und präzise.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: nach Osten
  rationale: Die Verbindung bezeichnet hier die Richtung Osten, nicht den Ostwind. „Nach Osten“ gibt die adverbiale Richtungsangabe natürlich wieder.
