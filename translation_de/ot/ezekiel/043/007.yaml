source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ אֶת מְק֣וֹם כִּסְאִ֗/י וְ/אֶת מְקוֹם֙ כַּפּ֣וֹת רַגְלַ֔/י אֲשֶׁ֧ר אֶשְׁכָּן שָׁ֛ם בְּ/ת֥וֹךְ בְּנֵֽי יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם וְ/לֹ֣א יְטַמְּא֣וּ ע֣וֹד בֵּֽית יִ֠שְׂרָאֵל שֵׁ֣ם קָדְשִׁ֞/י הֵ֤מָּה וּ/מַלְכֵי/הֶם֙ בִּ/זְנוּתָ֔/ם וּ/בְ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם בָּמוֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/007.yaml
  text: And he said to me[a], “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel forever. And the house of Israel shall no longer defile my holy name, neither they nor their kings, by their prostitution and by the corpses of their kings on their high places.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Menschensohn, dies ist der Ort meines Thrones und der Ort meiner Fußsohlen. Hier werde ich für immer mitten unter den Israeliten wohnen. Und das Haus Israel wird meinen heiligen Namen nicht länger verunreinigen, weder sie selbst noch ihre Könige, durch ihre Prostitution und durch die Leichname ihrer Könige auf ihren Kulthöhen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „und durch die Leichname ihrer Könige bei ihrem Tod“. Das letzte hebräische Wort wird traditionell als „ihre Kulthöhen“ gelesen, kann aber auch auf den Tod der Könige bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel etablierte deutsche Wiedergabe bewahrt die hebräische Anredeformel und ihren Bezug auf den menschlichen Propheten.
- source_word: מְקוֹם כִּסְאִי
  choice: der Ort meines Thrones
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Constructusverbindung.
- source_word: מְקוֹם כַּפּוֹת רַגְלַי
  choice: der Ort meiner Fußsohlen
  rationale: Bewahrt das konkrete Bild des Hebräischen; „Fußschemel“ wäre eine interpretierende Umformung.
- source_word: אֲשֶׁר אֶשְׁכָּן שָׁם
  choice: Hier werde ich … wohnen
  rationale: Das Imperfekt wird im visionären Zusammenhang zukünftig verstanden; „hier“ nimmt das ausdrücklich gesetzte שָׁם natürlich auf.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: mitten unter den Israeliten
  rationale: „Mitten unter“ erhält die räumliche Nähe von בְּתוֹךְ; „Israeliten“ ist im modernen Deutsch natürlicher als „Kinder/Söhne Israels“.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Natürliche moderne Wiedergabe der unbegrenzten Dauer im Kontext.
- source_word: יְטַמְּאוּ
  choice: wird … nicht länger verunreinigen
  rationale: „Verunreinigen“ bewahrt die kultische Unreinheitssemantik von טמא und passt zum Objekt „mein heiliger Name“.
- source_word: שֵׁם קָדְשִׁי
  choice: meinen heiligen Namen
  rationale: Idiomatiche und genaue Wiedergabe der hebräischen Verbindung.
- source_word: הֵמָּה וּמַלְכֵיהֶם
  choice: weder sie noch ihre Könige
  rationale: Die koordinierte Wendung wird unter der vorausgehenden Verneinung im Deutschen durch „weder … noch“ eindeutig und natürlich ausgedrückt.
- source_word: בִּזְנוּתָם
  choice: durch ihre Prostitution
  rationale: Bewahrt die scharfe prophetische Bildsprache sowie ihre möglichen sexuellen und bundestheologischen Bezüge, ohne sie auf eine bloße Erklärung zu reduzieren.
- source_word: וּבְפִגְרֵי מַלְכֵיהֶם
  choice: und durch die Leichname ihrer Könige
  rationale: פגר bezeichnet einen toten Körper beziehungsweise Leichnam; die Formulierung wahrt den Zusammenhang kultischer Verunreinigung.
- source_word: בָּמוֹתָם
  choice: auf ihren Kulthöhen
  rationale: Folgt der masoretischen Vokalisierung als „ihre Höhen“ und macht den kultischen Sinn im modernen Deutsch deutlich; die mögliche alternative Deutung wird in der Fußnote erhalten.
theological_decisions:
- issue: Art der Verunreinigung im Schlusssatz
  choice: Kultische und bundestheologische Verunreinigung durch Prostitution und die Leichname der Könige auf den Kulthöhen
  alternative: „durch die Leichname ihrer Könige bei ihrem Tod“
  rationale: Der Tempel- und Heiligkeitskontext sowie die masoretische Lesung von בָּמוֹתָם stützen die Deutung als Kulthöhen. Da die Konsonanten auch anders verstanden worden sind, wird die Spannung nicht beseitigt, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die inhaltlichen Beziehungen des Hebräischen aufzulösen. „Haus Israel“ bleibt als traditionelle korporative Bezeichnung erhalten; „Kulthöhen“ verdeutlicht den kultischen Gebrauch von בָּמוֹת.
