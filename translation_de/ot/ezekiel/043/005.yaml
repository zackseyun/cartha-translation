  edition: WLC
  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וַ/תְּבִיאֵ֕/נִי אֶל הֶֽ/חָצֵ֖ר הַ/פְּנִימִ֑י וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/005.yaml
  text: Then the Spirit lifted me up and brought me into the inner court[a], and behold[b], the glory of Yahweh filled the house.
translation:
  language: de
  text: Da hob mich der Geist[a] empor und brachte mich in den inneren Vorhof. Und siehe, die Herrlichkeit Jahwes erfüllte das Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Geist“ oder „Wind“. Das hebräische Wort רוּחַ kann diese Bedeutungen haben; im Zusammenhang von Ezechiels Visionen ist wahrscheinlich der göttliche Geist gemeint.'
    reason: alternative_reading
  - marker: b
    text: Gemeint ist der Tempel; wörtlich steht hier „das Haus“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂאֵנִי
  choice: hob mich empor
  rationale: Die Form von נשׂא bezeichnet hier das Aufheben beziehungsweise Emportragen des Propheten. „Hob mich empor“ bewahrt sowohl die Aufwärtsbewegung als auch den visionären Charakter.
- source_word: רוּחַ
  choice: der Geist
  rationale: רוּחַ kann „Wind“, „Geist“ oder „ein Geist“ bedeuten. In Ezechiels Berichten von visionärer Entrückung liegt der göttliche Geist als handelndes Subjekt am nächsten; die echte lexikalische Mehrdeutigkeit wird in Fußnote [a] bewahrt.
- source_word: וַתְּבִיאֵנִי
  choice: brachte mich
  rationale: Der Hifil von בוא drückt ein Hineinbringen aus. „Brachte mich“ ist im Deutschen natürlich und gibt die verursachte Bewegung in den Vorhof präzise wieder.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: den inneren Vorhof
  rationale: חָצֵר bezeichnet hier den umgrenzten Hof des Tempelbezirks. „Innerer Vorhof“ ist die geläufige und architektonisch passende deutsche Bezeichnung.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf den überraschenden Anblick. „Und siehe“ wahrt die feierliche prophetische Sprache, ohne den Ausdruck unnötig auszudeuten.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Das Prädikat bezeichnet, dass die Herrlichkeit das Haus ganz ausfüllte. „Erfüllte“ gibt diesen resultativen Sinn idiomatisch wieder.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die sichtbar offenbarte göttliche Herrlichkeit. Die Genitivverbindung gibt den hebräischen Status constructus klar und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlichen Umschrift und vermeidet die Ersetzung durch einen Titel.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet im Zusammenhang das Tempelgebäude. Die wörtliche Bezeichnung bewahrt Ezechiels Sprachgebrauch; „Tempel“ wird als verständliche Alternative in Fußnote [b] genannt.
theological_decisions:
- issue: Bezug von רוּחַ bei Ezechiels visionärer Entrückung
  choice: der Geist als göttlich handelnde Größe
  alternative: Wind oder ein Geist
  rationale: Der Zusammenhang mit Ezechiels wiederkehrenden Entrückungsvisionen spricht am stärksten für den göttlichen Geist. Da der hebräische Ausdruck an sich mehrdeutig und nicht mit dem bestimmten Artikel versehen ist, werden die anderen möglichen Lesarten ausdrücklich in Fußnote [a] festgehalten.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ bewahrt den Namenscharakter, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener prophetischer Aufmerksamkeitsformel „Und siehe“. „Vorhof“ folgt dem etablierten deutschen Tempelwortschatz. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
