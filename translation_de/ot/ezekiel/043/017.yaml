  text: And the ledge was fourteen cubits long by fourteen cubits wide at its four sides, and the rim around it was half a cubit, and its base was a cubit all around; and its steps faced east.
translation:
  language: de
  text: Die Plattform war vierzehn Ellen lang und vierzehn Ellen breit, auf ihren vier Seiten. Der Rand ringsum war eine halbe Elle breit, und ihr Sockel maß ringsum eine Elle. Ihre Stufen waren nach Osten gerichtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲזָרָה
  choice: die obere Einfassung
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich den oberen, quadratischen Teil beziehungsweise die Einfassung des Altars. „Obere Einfassung“ ist im baulichen Zusammenhang verständlich, ohne es mit dem Rand oder Sockel gleichzusetzen.
- source_word: הַגְּבוּל
  choice: der Rand
  rationale: Das Wort bezeichnet eine Begrenzung oder Umrandung; „Rand“ passt zur umlaufenden, eine halbe Elle messenden Begrenzung.
- source_word: הַחֵיק
  choice: ihr Sockel
  rationale: Im Zusammenhang des Altars bezeichnet חֵיק wahrscheinlich den unteren Absatz beziehungsweise Sockel; diese Wiedergabe folgt der architektonischen Funktion.
- source_word: מַעֲלֹתֵהוּ
  choice: ihre Stufen
  rationale: מַעֲלוֹת bezeichnet Stufen oder einen Aufgang. Der Plural „Stufen“ wird direkt wiedergegeben.
- source_word: פְּנוֹת קָדִים
  choice: waren nach Osten gerichtet
  rationale: Die Wendung beschreibt die Ausrichtung der Stufen zur Ostseite.
