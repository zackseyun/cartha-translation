  text: וּ/כְב֥וֹד יְהוָ֖ה בָּ֣א אֶל הַ/בָּ֑יִת דֶּ֣רֶךְ שַׁ֔עַר אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/004.yaml
  text: And the glory of Yahweh came into the house by way of the gate that faces east[a][b].
translation:
  language: de
  text: Und die Herrlichkeit Jahwes kam durch das nach Osten ausgerichtete Tor in das Haus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „das Haus“; in dieser Vision ist damit das Tempelgebäude gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und die Herrlichkeit Jahwes kam in das Haus durch das Tor, das nach Osten ausgerichtet ist.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְב֥וֹד
  choice: Und die Herrlichkeit
  rationale: כָּבוֹד bezeichnet hier die sichtbar offenbarte Herrlichkeit beziehungsweise Gegenwart Gottes, nicht bloß Ehre. Das vorangestellte וּ wird im fortlaufenden Bericht mit „Und“ wiedergegeben.
- source_word: יְהוָ֖ה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben; der Genitiv fügt sich natürlich in „die Herrlichkeit Jahwes“ ein.
- source_word: בָּ֣א
  choice: kam … in
  rationale: בוא bezeichnet das Kommen beziehungsweise Eintreten. Die Verbindung mit אֶל und dem Haus macht die Bewegung hinein deutlich.
- source_word: אֶל הַ/בָּ֑יִת
  choice: in das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet im Zusammenhang dieser Vision das Tempelgebäude. Die Präposition wird wegen der gerichteten Bewegung mit „in … hinein“ beziehungsweise idiomatisch „in“ wiedergegeben.
- source_word: דֶּ֣רֶךְ שַׁ֔עַר
  choice: durch das Tor
  rationale: דֶּרֶךְ kennzeichnet hier den Weg oder die Route. Im Deutschen gibt „durch das Tor“ die räumliche Bewegung natürlicher wieder als das schwerfälligere „auf dem Weg des Tores“.
- source_word: אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים
  choice: das nach Osten weist
  rationale: Die Wendung mit פָּנִים beschreibt die Ausrichtung der Vorderseite des Tores. „Nach Osten weist“ ist knapp, gegenwartssprachlich und wahrt die architektonische Orientierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כָּבוֹד
  choice: Herrlichkeit
  alternative: Ehre
  rationale: Im Kontext der Tempelvision ist Gottes wahrnehmbare, machtvolle Gegenwart gemeint. „Herrlichkeit“ bewahrt diesen theologischen Sinn, ohne genauer festzulegen, wie diese Gegenwart erscheint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung macht die Bewegungsrichtung klar und vermeidet unnötig schwerfällige Nachbildung der hebräischen Wortfolge. „Haus“ bewahrt das Bildwort des Ausgangstextes; die kontextuelle Bedeutung „Tempel“ wird in der Fußnote erläutert.
