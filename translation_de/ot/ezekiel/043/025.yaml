source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּעֲשֶׂ֥ה שְׂעִיר חַטָּ֖את לַ/יּ֑וֹם וּ/פַ֧ר בֶּן בָּקָ֛ר וְ/אַ֥יִל מִן הַ/צֹּ֖אן תְּמִימִ֥ים יַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/025.yaml
  text: For seven days you shall offer a goat as a sin offering each day[a], and they shall offer a bull, a son of the herd, and a ram from the flock[b], without blemish.
translation:
  language: de
  text: Sieben Tage lang sollst du täglich einen Ziegenbock als Sündopfer[a] darbringen; außerdem sollen sie[b] einen Jungstier[c] und einen Widder aus der Herde darbringen, beide ohne Fehler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort kann sowohl „Sünde“ als auch die damit verbundene Opferart bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen wechselt die Form hier von „sollst du darbringen“ zur Mehrzahl „sollen sie darbringen“.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „einen Stier, einen Sohn des Rindviehs“; dies ist eine feste Opferbezeichnung für einen Jungstier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Die Wendung bezeichnet eine Zeitdauer; „Sieben Tage lang“ gibt sie im Deutschen natürlich und genau wieder.
- source_word: תַּעֲשֶׂה / יַעֲשׂוּ
  choice: sollst du … darbringen / sollen sie … darbringen
  rationale: עשה bedeutet grundsätzlich „tun/machen“, bezeichnet im Opferkontext aber das Vollziehen beziehungsweise Darbringen eines Opfers. Die unterschiedlichen Personen und Numeri der beiden Verbformen bleiben erhalten.
- source_word: שְׂעִיר חַטָּאת
  choice: einen Ziegenbock als Sündopfer
  rationale: שְׂעִיר bezeichnet hier ausdrücklich ein männliches Tier. חַטָּאת ist im kultischen Zusammenhang der Name einer Opferart; „Sündopfer“ ist die geläufige deutsche Wiedergabe.
- source_word: לַיּוֹם
  choice: täglich
  rationale: Die Wendung verlangt die Wiederholung an jedem der sieben Tage; „täglich“ drückt dies knapp und eindeutig aus.
- source_word: פַּר בֶּן בָּקָר
  choice: einen Jungstier
  rationale: Die wörtliche Fügung „Stier, Sohn des Rindes“ ist eine feste Op Bezeichnung. „Jungstier“ gibt ihren gemeinten Referenten in natürlichem Deutsch wieder; die wörtliche Form wird in einer Fußnote dokumentiert.
- source_word: אַיִל מִן הַצֹּאן
  choice: einen Widder aus der Herde
  rationale: אַיִל ist ein Widder; מִן־הַצֹּאן bezeichnet seine Herkunft aus der Kleinviehherde. „Aus der Herde“ ist hier verständlich und idiomatisch.
- source_word: תְּמִימִים
  choice: beide ohne Fehler
  rationale: Im Opferkontext bezeichnet תמים Tiere ohne körperlichen Makel. Der Plural bezieht sich auf Jungstier und Widder; „beide“ macht diesen grammatischen Bezug im Deutschen deutlich.
theological_decisions:
- issue: Wechsel des grammatischen Subjekts innerhalb der Opferanweisung
  choice: Der Wechsel von der 2. Person Singular („sollst du“) zur 3. Person Plural („sollen sie“) wird im Haupttext bewahrt.
  alternative: Beide Teilsätze könnten zur Einzahl („sollst du“) oder zur Mehrzahl („sollen sie“) vereinheitlicht werden.
  rationale: Der hebräische Text verwendet ausdrücklich תַּעֲשֶׂה und danach יַעֲשׂוּ. Wer mit „sie“ gemeint ist, wird in diesem Vers nicht erklärt; daher wird die Spannung nicht stillschweigend geglättet.
- issue: Bezeichnung des Opfers חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ ist die etablierte deutsche Bezeichnung und passt zum kultischen Kontext. „Reinigungsopfer“ hebt eine ebenfalls vertretene Deutung der Funktion dieses Opfers hervor; die Alternative wird deshalb in der Fußnote genannt, ohne die lexikalische Frage im Haupttext zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darbringen“ wahrt den kultischen Ton, bleibt aber allgemein verständlich. Das Semikolon verdeutlicht die Satzstruktur, ohne den auffälligen Subjektwechsel zu beseitigen.
