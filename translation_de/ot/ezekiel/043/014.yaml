  text: וּ/מֵ/חֵ֨יק הָ/אָ֜רֶץ עַד הָ/עֲזָרָ֤ה הַ/תַּחְתּוֹנָה֙ שְׁתַּ֣יִם אַמּ֔וֹת וְ/רֹ֖חַב אַמָּ֣ה אֶחָ֑ת וּ/מֵ/הֳ/עֲזָרָ֨ה הַ/קְּטַנָּ֜ה עַד הָ/עֲזָרָ֤ה הַ/גְּדוֹלָה֙ אַרְבַּ֣ע אַמּ֔וֹת וְ/רֹ֖חַב הָ/אַמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/014.yaml
  text: And from the ledge of the ground to the lower platform shall be two cubits[a], with a width of one cubit; and from the smaller platform to the larger platform shall be four cubits[c][b], with a width of one cubit.
translation:
  language: de
  text: Und von der Einfassung am Boden[a] bis zum unteren Absatz[b] sind es zwei Ellen, bei einer Breite von einer Elle; und vom kleineren Absatz bis zum größeren Absatz sind es vier Ellen, bei einer Breite von einer Elle.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck bedeutet wörtlich „Schoß der Erde“ und kann hier die Basis, eine Vertiefung oder eine Einfassung auf Bodenniveau bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete hebräische Wort bezeichnet offenbar abgestufte Bauebenen des Altars. Möglich sind auch Wiedergaben wie „Stufe“, „Plattform“ oder „Vorsprung“.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich lautet der Schluss „und die Breite der Elle“. Gemeint ist wahrscheinlich, parallel zur ersten Angabe, eine Breite von einer Elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיק הָאָרֶץ
  choice: Einfassung am Boden
  rationale: חֵיק bedeutet wörtlich „Schoß“ und kann auch eine Vertiefung oder Einfassung bezeichnen. Im baulichen Zusammenhang ist eine bodennahe Einfassung oder Basis gemeint; die Übersetzung wahrt den konkreten Sinn, ohne die genaue Konstruktion zu stark festzulegen.
- source_word: עֲזָרָה
  choice: Absatz
  rationale: Das Wort bezeichnet hier offenbar eine der abgestuften Ebenen beziehungsweise vorspringenden Stufen des Altars. „Absatz“ ist im modernen Deutschen als architektonische Bezeichnung verständlich und passt sowohl zur unteren als auch zur größeren Ebene.
- source_word: הַתַּחְתּוֹנָה
  choice: unteren
  rationale: Die Form kennzeichnet die tiefer gelegene Ebene. „Unter“ wahrt die räumliche Relation, ohne zwingend einen absoluten Superlativ auszudrücken.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: zwei Ellen
  rationale: Der hebräische Text nennt nur das Maß; dass es sich um die vertikale Distanz handelt, ergibt sich aus der Konstruktion „von … bis …“.
- source_word: וְרֹחַב אַמָּה אֶחָת
  choice: bei einer Breite von einer Elle
  rationale: רֹחַב bezeichnet die Breite. Die gewählte Formulierung ist natürliches Deutsch und erhält die Maßangabe genau.
- source_word: הֳעֲזָרָה הַקְּטַנָּה
  choice: vom kleineren Absatz
  rationale: „Kleiner“ gibt die relationale Gegenüberstellung zum folgenden größeren Absatz wieder.
- source_word: הָעֲזָרָה הַגְּדוֹלָה
  choice: zum größeren Absatz
  rationale: „Größer“ macht die im Kontext naheliegende Gegenüberstellung der beiden baulichen Ebenen deutlich.
- source_word: אַרְבַּע אַמּוֹת
  choice: vier Ellen
  rationale: Wie zuvor bleibt die vertikale Dimension implizit und ergibt sich aus „von … bis …“.
- source_word: וְרֹחַב הָאַמָּה
  choice: bei einer Breite von einer Elle
  rationale: Wörtlich steht „und die Breite der Elle“. Im Parallelismus zur ersten Maßangabe ist wahrscheinlich erneut eine Breite von einer Elle gemeint; dies wird im Text lesbar wiedergegeben und in einer Fußnote offengelegt.
theological_decisions: []
