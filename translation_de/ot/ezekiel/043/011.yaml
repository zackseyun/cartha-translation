  to: 'Und wenn sie sich all dessen schämen, was sie getan haben, dann mache ihnen die Gestalt des Hauses bekannt: seine Anordnung, seine Ausgänge und seine Eingänge, all seine Formen, all seine Satzungen, seine ganze Gestalt[a] und all seine Weisungen[b]. Schreibe es vor ihren Augen nieder, damit sie seine ganze Gestalt und all seine Satzungen bewahren und danach handeln.'
