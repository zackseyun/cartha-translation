source:
  edition: WLC
  text: וְ/אִֽם נִכְלְמ֞וּ מִ/כֹּ֣ל אֲשֶׁר עָשׂ֗וּ צוּרַ֣ת הַ/בַּ֡יִת וּ/תְכוּנָת֡/וֹ וּ/מוֹצָאָ֡י/ו וּ/מוֹבָאָ֣י/ו וְֽ/כָל צֽוּרֹתָ֡/ו וְ/אֵ֣ת כָּל חֻקֹּתָי/ו֩ וְ/כָל צורת/י וְ/כָל תורת/ו הוֹדַ֣ע אוֹתָ֔/ם וּ/כְתֹ֖ב לְ/עֵֽינֵי/הֶ֑ם וְ/יִשְׁמְר֞וּ אֶת כָּל צוּרָת֛/וֹ וְ/אֶת כָּל חֻקֹּתָ֖י/ו וְ/עָשׂ֥וּ אוֹתָֽ/ם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/011.yaml
  text: And if they are ashamed of all that they have done[a], make known to them the design of the house, its arrangement, its exits, its entrances, all its forms, all its statutes, and all its laws; and write it before their eyes[b], so that they may keep its whole design and all its statutes and do them.
translation:
  language: de
  text: 'Und wenn sie sich all dessen schämen, was sie getan haben, dann mache ihnen die Gestalt des Hauses bekannt: seine Anordnung, seine Ausgänge und seine Eingänge, all seine Formen, all seine Satzungen, seine ganze Gestalt[a] und all seine Weisungen[b]. Schreibe es vor ihren Augen nieder, damit sie seine ganze Gestalt und all seine Satzungen bewahren und danach handeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet mehrfach Wörter aus der Wortgruppe צורָה („Gestalt“, „Form“, „Muster“) und nennt nach den Satzungen nochmals die Gestalt des Hauses. Die Wiederholung betont dessen bauliche Form beziehungsweise sein Muster.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „all seine Gesetze“. Das hebräische תּוֹרוֹת kann sowohl verbindliche Weisungen als auch Gesetze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְלְמוּ
  choice: sich schämen
  rationale: Das Nifal von כלם bezeichnet hier Scham über das bisherige Handeln; die reflexive deutsche Wendung gibt die innere Reaktion natürlich wieder.
- source_word: צוּרַת הַבַּיִת / צֻרוֹתָיו / צוּרָתוֹ
  choice: die Gestalt des Hauses / all seine Formen / seine ganze Gestalt
  rationale: Die wiederholte Wortgruppe von צורָה bezeichnet im Zusammenhang der Tempelvision die bauliche Form oder das Muster. Die Wiedergabe bewahrt die auffällige Wiederholung des Hebräischen weitgehend.
- source_word: תְכוּנָתוֹ
  choice: seine Anordnung
  rationale: Das Substantiv bezeichnet die geordnete beziehungsweise bemessene Anlage des Hauses, ohne ausschließlich Proportionen oder Grundriss zu meinen.
- source_word: מוֹצָאָיו / מוֹבָאָיו
  choice: seine Ausgänge / seine Eingänge
  rationale: Das Wortpaar hat hier einen klaren architektonischen Sinn und wird im Deutschen entsprechend parallel wiedergegeben.
- source_word: חֻקֹּתָיו
  choice: seine Satzungen
  rationale: חֻקּוֹת bezeichnet verbindliche Festsetzungen; „Satzungen“ bewahrt ihren normativen Charakter.
- source_word: תּוֹרֹתָיו
  choice: seine Weisungen
  rationale: תּוֹרָה bedeutet grundlegend Weisung oder Unterweisung. „Weisungen“ wahrt diese Breite und unterscheidet den Ausdruck von den unmittelbar vorher genannten Satzungen.
- source_word: הוֹדַע אוֹתָם
  choice: gib ihnen … bekannt
  rationale: Die Kausativform von ידע bedeutet „wissen lassen/bekannt machen“; die deutsche Formulierung ist würdig und idiomatisch.
- source_word: וּכְתֹב לְעֵינֵיהֶם
  choice: Schreibe es vor ihren Augen nieder
  rationale: Die Wendung bewahrt das anschauliche „vor ihren Augen“ und bringt zugleich den Sinn eines sichtbaren schriftlichen Festhaltens zum Ausdruck.
- source_word: וְיִשְׁמְרוּ … וְעָשׂוּ אוֹתָם
  choice: damit sie … beachten und sie ausführen
  rationale: שׁמר bezeichnet hier sorgfältiges Beachten; עשׂה fordert die praktische Ausführung. Das Pronomen „sie“ nimmt im Deutschen natürlich die Satzungen auf.
theological_decisions:
- issue: Architektonischer Plan oder umfassenderes visionäres Muster
  choice: Architektonische Begriffe werden mit normativen Begriffen verbunden, ohne die Gestalt des Hauses auf einen bloßen Bauplan oder ein ausschließlich symbolisches Bild festzulegen.
  alternative: Durchgehend „Bauplan“ oder „Muster“ verwenden.
  rationale: Der hebräische Text verbindet konkrete Elemente wie Ein- und Ausgänge mit Satzungen und Weisungen. Die Übersetzung lässt diese Spannung bestehen.
- issue: Wiederholung der צורָה-Begriffe in der Aufzählung
  choice: 'Die Wiederholung wird im Haupttext erhalten: „Gestalt“, „Formen“, „ganze Gestalt“.'
  alternative: Die zweite Nennung aus stilistischen Gründen auslassen oder sämtliche Vorkommen identisch wiedergeben.
  rationale: Der WLC enthält nach den Satzungen nochmals צורתו. Auch wenn die Folge schwerfällig wirkt und textgeschichtlich Fragen aufwirft, darf die belegte Wiederholung nicht stillschweigend entfernt werden.
- issue: Bezug des abschließenden Pluralobjekts אוֹתָם
  choice: „sie“ wird im Deutschen am natürlichsten auf die Satzungen bezogen, während das Beachten sowohl Gestalt als auch Satzungen umfasst.
  alternative: Explizit „all dies“ oder „diese Dinge“ schreiben.
  rationale: Das hebräische Maskulinum Plural lässt den Bezug in der komplexen Aufzählung nicht völlig eindeutig erscheinen. Die deutsche Form wahrt den Vollzugscharakter, ohne zusätzliche Gegenstände einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt bewusst ausführlich und bewahrt die ungewöhnliche Wiederholung des hebräischen Textes; „niederschreiben“, „beachten“ und „ausführen“ sind allgemein verständlich, ohne umgangssprachlich zu wirken.
