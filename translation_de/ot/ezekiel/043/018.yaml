  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֵ֚לֶּה חֻקּ֣וֹת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הֵעָֽשׂוֹת֑/וֹ לְ/הַעֲל֤וֹת עָלָי/ו֙ עוֹלָ֔ה וְ/לִ/זְרֹ֥ק עָלָ֖י/ו דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/018.yaml
  text: 'And he said to me[a], “Son of man, thus says the Lord GOD: These are the statutes of the altar on the day it is made[c][b], for offering burnt offerings on it and for sprinkling blood on it.”'
translation:
  language: de
  text: 'Und er sagte zu mir: „Menschensohn, so spricht der Herr Jahwe: Dies sind die Bestimmungen für den Altar am Tag, an dem er hergestellt wird[a], um auf ihm Brandopfer[b] darzubringen und Blut auf ihn zu sprengen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tag seines Gemachtwerdens“; die Wendung kann auch allgemeiner „wenn er hergestellt wird“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Brandopfer“; der hebräische Singular kann hier kollektiv gebraucht sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Blut auf ihn zu schleudern“ beziehungsweise „zu werfen“; das hebräische Verb kann eine kräftigere rituelle Anwendung des Blutes bezeichnen, als „sprengen“ vermuten lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Dies ist in Ezechiel die wiederkehrende Anrede des Propheten. „Menschensohn“ bewahrt das hebräische Bild und seine literarische Wiederholung.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Die Wiedergabe bildet sowohl den Titel אֲדֹנָי als auch den Gottesnamen יְהוִה ab, ohne beide zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: חֻקּוֹת הַמִּזְבֵּחַ
  choice: Bestimmungen für den Altar
  rationale: חֻקּוֹת bezeichnet festgesetzte Vorschriften. Im Deutschen macht „für den Altar“ deutlich, dass es um die für ihn geltenden kultischen Bestimmungen geht.
- source_word: בְּיוֹם הֵעָשׂוֹתוֹ
  choice: an dem Tag, an dem er errichtet wird
  rationale: Die Formulierung erhält den ausdrücklichen Zeitbezug von בְּיוֹם und gibt עשה im Zusammenhang mit dem Bau beziehungsweise der Herstellung des Altars natürlich mit „errichten“ wieder.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה
  choice: Auf ihm sollen Brandopfer dargebracht werden
  rationale: Der Hifil von עלה bezeichnet im Opferkontext das Darbringen. Das singularische עוֹלָה kann hier kollektiv verstanden werden.
- source_word: וְלִזְרֹק עָלָיו דָּם
  choice: und Blut an ihn gesprengt werden
  rationale: זרק bezeichnet die rituelle Anwendung des Blutes am Altar. „Sprengen“ ist der etablierte deutsche Opferbegriff und lässt eine kräftigere Bewegung als bloßes Besprengen zu.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: Gott, der HERR
  rationale: „Herr Jahwe“ hält Titel und Eigenname erkennbar auseinander und gibt den im hebräischen Text stehenden Gottesnamen wieder. Die traditionelle Ersatzlesung „Gott, der HERR“ bleibt möglich, verdeckt jedoch den Eigennamen.
- issue: Numerus von עוֹלָה
  choice: Brandopfer
  alternative: ein Brandopfer
  rationale: Der hebräische Singular kann in einer allgemeinen Kultvorschrift kollektiv gebraucht sein. Die deutsche Pluralform entspricht diesem allgemeinen Bezug, ohne ein einzelnes Opfer zwingend auszuschließen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kultisch-rechtlichem Ton. Die Satzstruktur wurde nach dem Doppelpunkt leicht ins natürliche deutsche Passiv umgestellt; Zweck und Bezug auf den Altar bleiben erhalten. Alle textkritisch beziehungsweise lexikalisch relevanten Alternativen werden in den Fußnoten offengehalten.
