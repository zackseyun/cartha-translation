  yaml_path: translation/ot/ezekiel/043/015.yaml
  text: And the altar hearth shall be four cubits[a], and from the altar hearth and upward, four horns.
translation:
  language: de
  text: Und der Altarherd[a] soll vier Ellen hoch sein; vom Altarherd nach oben ragen die vier Hörner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Ausdrücke har'el und ari'el sind hier schwer zu deutende Bezeichnungen am Altar. Wörtlicher könnte man „Gottesherd“ übersetzen oder „Ariel“ unübersetzt lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְאֵל
  choice: der Altarherd
  rationale: Im Zusammenhang der Altarmaße bezeichnet der schwierige Ausdruck wahrscheinlich die obere Feuerstelle des Altars. „Altarherd“ gibt die kultische Funktion verständlich wieder, ohne die unsichere Etymologie zum Haupttext zu machen.
- source_word: אַרְבַּע אַמּוֹת
  choice: vier Ellen hoch
  rationale: Die antike Maßeinheit wird beibehalten. „hoch“ ergibt sich aus der vertikalen Beschreibung des Altars im Kontext und macht die knappe Maßangabe im Deutschen verständlich.
- source_word: מֵהָאֲרִאֵיל
  choice: vom Altarherd
  rationale: Die verwandte Form אֲרִאֵיל wird parallel zu הַרְאֵל verstanden und deshalb einheitlich wiedergegeben; מִן wird mit „von“ ausgedrückt.
- source_word: וּלְמַעְלָה
  choice: nach oben
  rationale: Die Wendung bezeichnet die vertikale Richtung vom Altarherd aus.
- source_word: הַקְּרָנוֹת אַרְבַּע
  choice: ragen vier Hörner
  rationale: Gemeint sind die vier vorspringenden Altarhörner. Das Verb „ragen“ ist im knappen Hebräisch nicht ausdrücklich gesetzt, erschließt aber die räumliche Konstruktion idiomatisch und ohne zusätzliche theologische Deutung.
