  text: And the altar hearth was twelve cubits long by twelve wide[b][a], square on its four sides.
translation:
  language: de
  text: Und die Altarfeuerstelle war zwölf Ellen lang und zwölf Ellen breit[b], nach allen vier Seiten hin quadratisch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu ihren vier Vierteln hin“; auch möglich: „an ihren vier Ecken“.'
    reason: lexical_alternative
  - marker: b
    text: Die Maßeinheit „Ellen“ ist aus dem Zusammenhang der vorausgehenden Altarmaße ergänzt.
    reason: cross_reference
lexical_decisions:
- source_word: הָאֲרִיאֵל
  choice: die Altarfeuerstelle
  rationale: Das Wort bezeichnet hier die obere Feuerstelle beziehungsweise Herdplatte des Altars, nicht allgemein den ganzen Altar. „Altarfeuerstelle“ gibt den baulich-kultischen Sinn verständlich wieder.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: zwölf
  rationale: Die reguläre Wiedergabe der Kardinalzahl.
- source_word: אֹרֶךְ
  choice: lang
  rationale: In der deutschen Maßformel ist „zwölf Ellen lang“ natürlich und genau.
- source_word: בִּשְׁתֵּים עֶשְׂרֵה רֹחַב
  choice: zwölf Ellen breit
  rationale: Die Präposition leitet das entsprechende Breitenmaß ein; im Deutschen ist die parallele Formulierung mit „breit“ idiomatisch.
- source_word: רָבוּעַ
  choice: quadratisch
  rationale: Das Adjektiv bezeichnet die quadratische Form der Altarfeuerstelle.
- source_word: אֶל אַרְבַּעַת רְבָעָיו
  choice: nach ihren vier Seiten hin
  rationale: Die Formulierung bewahrt die Richtungsbedeutung von אֶל und gibt רְבָעִים räumlich als Seiten beziehungsweise Bereiche wieder, ohne die mögliche Deutung als Ecken stillschweigend festzulegen.
- source_word: אַמּוֹת (aus dem Kontext ergänzt)
  choice: Ellen
  rationale: Die Maßeinheit steht in diesem Satz nicht ausdrücklich, ergibt sich aber aus den unmittelbar vorausgehenden Altarmaßen und wird für ein verständliches deutsches Maßgefüge ergänzt.
