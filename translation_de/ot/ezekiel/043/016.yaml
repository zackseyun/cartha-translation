translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die technische Bezeichnung „Altarfeuerstelle“ ist genauer als das allgemeinere „Altar“. Die ungewöhnliche hebräische Wendung am Versende wird in natürlichem Deutsch wiedergegeben, während ihre räumliche Mehrdeutigkeit in der Fußnote erhalten bleibt.
