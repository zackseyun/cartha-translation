  text: וָ/אֶשְׁמַ֛ע מִדַּבֵּ֥ר אֵלַ֖/י מֵ/הַ/בָּ֑יִת וְ/אִ֕ישׁ הָיָ֥ה עֹמֵ֖ד אֶצְלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/006.yaml
  text: Then I heard one speaking to me from the house[b][a], while a man was standing beside me.
translation:
  language: de
  text: Dann hörte ich, wie jemand aus dem Haus[b] zu mir sprach[a], während ein Mann neben mir stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann hörte ich eine Stimme aus dem Haus zu mir sprechen.“ Im Hebräischen steht weder ausdrücklich das Wort „Stimme“, noch wird der Sprecher in diesem Vers benannt.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus“ ist hier das Tempelgebäude in Hesekiels Vision gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Dann hörte ich
  rationale: Das Wayyiqtol von שׁמע führt die Erzählung weiter; „Dann hörte ich“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: מִדַּבֵּר
  choice: wie jemand … sprach
  rationale: Die Form bezeichnet hier ein im Verlauf wahrgenommenes Sprechen. „Wie jemand … sprach“ ist idiomatisches Deutsch und ergänzt nur das grammatisch nötige unbestimmte Subjekt, ohne ausdrücklich eine „Stimme“ einzutragen.
- source_word: אֵלַי
  choice: zu mir
  rationale: אֶל bezeichnet die Richtung auf den Propheten hin; „zu mir“ entspricht dem unmittelbar.
- source_word: מֵהַבָּיִת
  choice: aus dem Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet im Zusammenhang das Tempelgebäude. „Haus“ bewahrt die hebräische Ausdrucksweise.
- source_word: וְאִישׁ
  choice: während ein Mann
  rationale: אִישׁ ist nicht determiniert und wird daher mit „ein Mann“ wiedergegeben. „Während“ macht die Gleichzeitigkeit im Deutschen klar.
- source_word: הָיָה עֹמֵד
  choice: stand
  rationale: Die Verbindung aus היה und Partizip beschreibt einen andauernden Zustand in der Vergangenheit; im Deutschen bringt das idiomatische Präteritum „stand“ diesen Verlauf ausreichend zum Ausdruck.
- source_word: אֶצְלִי
  choice: neben mir
  rationale: אֵצֶל bezeichnet räumliche Nähe; „neben mir“ passt natürlich zur Szene.
theological_decisions:
- issue: Identität des Sprechenden aus dem Tempelhaus
  choice: „wie jemand aus dem Haus zu mir sprach“ ohne Identifizierung des Sprechenden
  alternative: „wie er aus dem Haus zu mir sprach“ oder „wie eine Stimme aus dem Haus zu mir sprach“
  rationale: Der hebräische Wortlaut nennt in diesem Vers weder ausdrücklich das Substantiv „Stimme“ noch identifiziert er den Sprecher. Die unbestimmte Wiedergabe bewahrt diese Offenheit, auch wenn der weitere Zusammenhang auf den göttlichen Sprecher weisen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und erhält zugleich die Unbestimmtheit des Sprechers sowie die Gleichzeitigkeit des danebenstehenden Mannes.
