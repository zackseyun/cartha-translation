source:
  edition: WLC
  text: זֹ֖את תּוֹרַ֣ת הַ/בָּ֑יִת עַל רֹ֣אשׁ הָ֠/הָר כָּל גְּבֻל֞/וֹ סָבִ֤יב סָבִיב֙ קֹ֣דֶשׁ קָדָשִׁ֔ים הִנֵּה זֹ֖את תּוֹרַ֥ת הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/012.yaml
  text: 'This is the law of the house: on the top of the mountain[a], all its surrounding territory is most holy. Behold[b], this is the law of the house.'
translation:
  language: de
  text: 'Dies ist die Weisung für das Haus: auf dem Gipfel des Berges ist sein ganzes Gebiet ringsum hochheilig.[a] Siehe, dies ist die Weisung für das Haus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „heilig der Heiligkeiten“; das heißt: „höchstheilig“. גְּבוּל kann hier auch „Grenze“ bedeuten: „Seine ganze Grenze ringsum ist höchstheilig.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  choice: die Weisung für das Haus
  rationale: תּוֹרָה bezeichnet Gesetz oder Weisung. Hier geht es um die maßgebende Bestimmung für das Heiligtum und sein Gebiet. „Weisung“ klingt im modernen Deutsch natürlich und vermeidet eine unnötige Verengung auf ein einzelnes Gesetz; „Haus“ bewahrt die Bildsprache von בַּיִת.
- source_word: עַל רֹאשׁ הָהָר
  choice: auf dem Gipfel des Berges
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet topografisch aber den Gipfel oder die Höhe. „Auf dem Gipfel des Berges“ ist idiomatisch und präzise.
- source_word: כָּל גְּבֻלוֹ סָבִיב סָבִיב
  choice: sein gesamtes Gebiet ringsum
  rationale: גְּבוּל kann sowohl Grenze als auch das abgegrenzte Gebiet bezeichnen. Im Zusammenhang ist das ganze Umfeld des Hauses gemeint. „ringsum“ gibt die umfassende Wirkung der Wiederholung סָבִיב סָבִיב wieder.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Steigerungsform bedeutet hier „höchstheilig“. „Hochheilig“ ist eine knappe, würdige deutsche Wiedergabe und macht deutlich, dass das gesamte Gebiet diesen Heiligkeitsstatus besitzt.
- source_word: הִנֵּה
  choice: Siehe
  rationale: הִנֵּה lenkt feierlich die Aufmerksamkeit auf die abschließende Wiederholung. „Siehe“ bewahrt diese Funktion, ohne den Satz erklärend umzudeuten.
- source_word: זֹאת ... זֹאת
  choice: Dies ... dies
  rationale: Die wiederholte Demonstrativform rahmt den Vers. Ihre Wiederholung wird zur Wahrung von Nachdruck und Struktur beibehalten.
theological_decisions:
- issue: Bezug des Ausdrucks קֹדֶשׁ קָדָשִׁים
  choice: Er beschreibt das gesamte ringsum gelegene Gebiet als „hochheilig“.
  alternative: Den Ausdruck als Bezeichnung allein für das Allerheiligste im Tempel verstehen.
  rationale: Syntax und Wortstellung beziehen die Heiligkeitsaussage auf כָּל גְּבֻלוֹ, das gesamte Gebiet beziehungsweise seine ganze Begrenzung ringsum, nicht nur auf den innersten Heiligtumsraum.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rahmende Wiederholung wird bewahrt. „Weisung“ hält das Bedeutungsspektrum von תּוֹרָה offen; „hochheilig“ gibt die hebräische Steigerungsform verständlich wieder. Der einzige Fußnotenmarker [a] steht unmittelbar bei der betroffenen Aussage.
