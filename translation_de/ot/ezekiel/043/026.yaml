source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יְכַפְּרוּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/טִֽהֲר֖וּ אֹת֑/וֹ וּ/מִלְא֖וּ יד/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/026.yaml
  text: For seven days they shall make atonement for the altar and cleanse it[a], and they shall consecrate it.
translation:
  language: de
  text: Sieben Tage lang sollen sie den Altar entsühnen und reinigen und ihn für den Dienst weihen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Hand füllen“; eine kultische Wendung für die Einsetzung oder Weihe zum Dienst.'
    reason: Die ungewöhnliche hebräische Wendung wird im Haupttext sinngemäß wiedergegeben; die Fußnote macht ihre wörtliche Form und mögliche Bedeutungsbreite transparent.
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Der Akkusativ bezeichnet die Dauer der Handlungen. „Sieben Tage lang“ gibt dies im Deutschen natürlich und eindeutig wieder.
- source_word: יְכַפְּרוּ אֶת־הַמִּזְבֵּחַ
  choice: sollen sie den Altar entsühnen
  rationale: כפר bezeichnet hier im priesterlich-rituellen Zusammenhang die durch Sühneriten bewirkte Reinigung beziehungsweise Entsühnung des Altars. „Entsühnen“ bewahrt sowohl den kultischen Bezug als auch die direkte Beziehung zum Altar.
- source_word: וְטִהֲרוּ אֹתוֹ
  choice: und reinigen
  rationale: טהר bezeichnet rituelle Reinigung. „Reinigen“ ist im modernen Deutsch verständlich und lässt den kultischen Sinn im Kontext erkennen.
- source_word: וּמִלְאוּ יָדוֹ
  choice: und ihn für den Dienst weihen
  rationale: Wörtlich steht „seine Hand füllen“, eine kultische Wendung für Einsetzung oder Weihe. Da sie hier ungewöhnlicherweise auf den Altar bezogen ist, gibt „für den Dienst weihen“ die Funktionsbestimmung verständlich wieder, ohne die Wendung mit einer nur auf Personen passenden Formulierung wie „ordinieren“ wiederzugeben.
theological_decisions:
- issue: Bedeutung der kultischen Wendung וּמִלְאוּ יָדוֹ beim Altar
  choice: ihn für den Dienst weihen
  alternative: seine Hand füllen; ihn einsetzen; ihn weihen
  rationale: Die wörtliche Wendung bleibt bildlich und in Bezug auf einen Altar ungewöhnlich. Die Übersetzung deutet sie als kultische Indienststellung, ohne genauer festzulegen, worin diese besteht; die wörtliche Form wird in der Fußnote offengelegt.
- issue: Verhältnis von כפר und טהר
  choice: entsühnen und reinigen
  alternative: Sühne für ihn erwirken und ihn reinigen; ihn entsühnen und läutern
  rationale: Die beiden Verben werden getrennt wiedergegeben, damit ihre kultische Spannung und die im Hebräischen vorhandene Doppelhandlung nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entsühnen“ ist bewusst als präziser kultischer Fachausdruck gewählt; die übrige Syntax bleibt einfach und gut verständlich.
