  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: Und das Wort Jahwes kam zu mir:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch fügt die redeeinleitende Wendung „sagend“ hinzu.
    reason: Der Doppelpunkt gibt לֵאמֹר im Deutschen idiomatisch wieder; die Anmerkung weist auf die im Hebräischen ausdrücklich vorhandene redeeinleitende Form hin.
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Offenbarungsformel ויהי דבר־יהוה אלי gibt „kam“ die Wendung im Deutschen natürlich und zugleich quellennah wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier die göttliche Mitteilung. „Das Wort“ bewahrt den traditionellen prophetischen Sprachgebrauch und bleibt weniger auslegend als „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person bezeichnet Ezechiel als Empfänger der Offenbarung; „zu mir“ ist die direkte, idiomatische Wiedergabe.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Der hebräische Infinitiv לֵאמֹר leitet die nachfolgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, anstatt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Explizite Wiedergabe von לֵאמֹר
  choice: syntaktisch durch einen Doppelpunkt
  alternative: und sprach / mit den Worten
  rationale: לֵאמֹר kündigt die in Vers 16 folgende Gottesrede an. Der Doppelpunkt bewahrt diese Funktion in natürlichem Deutsch, ohne bereits ein zusätzliches Subjekt für „sprach“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „das Wort Jahwes kam zu mir“ bleibt erhalten; der Doppelpunkt leitet knapp und natürlich zur direkten Rede des folgenden Verses über.
