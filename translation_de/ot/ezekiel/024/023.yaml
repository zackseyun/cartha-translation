  text: וּ/פְאֵרֵ/כֶ֣ם עַל רָאשֵׁי/כֶ֗ם וְ/נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם לֹ֥א תִסְפְּד֖וּ וְ/לֹ֣א תִבְכּ֑וּ וּ/נְמַקֹּתֶם֙ בַּ/עֲוֺנֹ֣תֵי/כֶ֔ם וּ/נְהַמְתֶּ֖ם אִ֥ישׁ אֶל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/023.yaml
  text: Your turbans will be on your heads and your sandals on your feet[a]; you will not mourn and you will not weep[c][b], but you will waste away in your iniquities and groan to one another.
translation:
  language: de
  text: Euer Kopfschmuck wird auf euren Köpfen sein und eure Sandalen an euren Füßen.[a] Ihr werdet weder Totenklage halten noch weinen, sondern in euren Vergehen dahinschwinden[b] und einer wird dem anderen zustöhnen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eure Turbane“ beziehungsweise „Eure Kopfbünde“. Das hebräische Wort bezeichnet einen schmückenden Kopfputz.'
    reason: lexical_alternative
  - marker: b
    text: „In euren Vergehen“ kann auch „wegen eurer Vergehen“, „in eurer Schuld“ oder „unter den Folgen eurer Schuld“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ein Mann zu seinem Bruder“.'
    reason: literal_rendering
lexical_decisions:
- source_word: פְאֵרֵיכֶם
  choice: euer Kopfschmuck
  rationale: פְּאֵר bezeichnet hier einen schmückenden Kopfputz, wahrscheinlich einen Turban oder Kopfbund. „Kopfschmuck“ bewahrt den weiteren Bedeutungsumfang und passt zum ausdrücklichen Zusatz „auf euren Köpfen“.
- source_word: נַעֲלֵיכֶם
  choice: eure Sandalen
  rationale: נַעַל ist die gewöhnliche Bezeichnung für Fußbekleidung; „Sandalen“ entspricht dem antiken Lebensumfeld genauer als „Schuhe“.
- source_word: תִסְפְּדוּ
  choice: Totenklage halten
  rationale: ספד bezeichnet häufig die förmliche Klage um einen Verstorbenen. Die Wendung macht den Bezug zu den untersagten Trauerriten deutlich, ohne ihn zu überdehnen.
- source_word: תִבְכּוּ
  choice: weinen
  rationale: Eine direkte, natürliche Wiedergabe von בכה in würdigem modernem Deutsch.
- source_word: נְמַקֹּתֶם
  choice: dahinschwinden
  rationale: מקק beschreibt Verfall oder allmähliches Aufgeriebenwerden. „Dahinschwinden“ gibt den bildhaften inneren und äußeren Verfall wieder, ohne unnötig drastisch „verfaulen“ zu formulieren.
- source_word: בַּעֲוֺנֹתֵיכֶם
  choice: in euren Vergehen
  rationale: Die Präposition ב wird mit „in“ bewahrt. עָוֹן kann Vergehen, Schuld oder deren Folge bezeichnen; „Vergehen“ hält im Haupttext zunächst die Tatseite fest, während die Fußnote die weitere Spannbreite nennt.
- source_word: נְהַמְתֶּם
  choice: stöhnen
  rationale: נהם bezeichnet einen tiefen Laut der Bedrängnis oder Qual. „Stöhnen“ passt zur unterdrückten Trauer unter dem Gericht.
- source_word: אִישׁ אֶל אָחִיו
  choice: jeder … seinem Bruder gegenüber
  rationale: Die distributive und ausdrücklich männlich formulierte Wendung wird erhalten. Die deutsche Satzbildung ist natürlicher als das starre „ein Mann zu seinem Bruder“.
theological_decisions:
- issue: Bedeutungsumfang von עָוֹן im Gerichtszusammenhang
  choice: in euren Vergehen
  alternative: wegen eurer Vergehen; in eurer Schuld; unter den Folgen eurer Schuld
  rationale: Der hebräische Ausdruck kann Sünde, Schuld und deren Gerichtsfolge ineinanderblenden. Die Übersetzung bewahrt mit „in“ die knappe, nicht eindeutig kausale Formulierung und erläutert die Mehrdeutigkeit in der Fußnote.
- issue: Geschlechtsspezifische Beziehungsbezeichnung
  choice: jeder wird seinem Bruder gegenüber stöhnen
  alternative: ihr werdet einander gegenüber stöhnen
  rationale: אִישׁ אֶל אָחִיו verwendet eine männliche distributive Form und das Verwandtschaftswort „Bruder“. Diese Markierung wird nicht stillschweigend neutralisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Totenklage halten“ benennt den formellen Trauerritus präziser als das allgemeinere „trauern“. Die ungewöhnliche Wendung „in euren Vergehen“ bleibt bewusst stehen, um die hebräische Spannung zwischen Vergehen, Schuld und Gerichtsfolge nicht aufzulösen.
