base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/002.yaml
  text: 'Son of man[a], write down for yourself the name of the day[c][b], this very day: the king of Babylon has laid siege against Jerusalem on this very day.'
translation:
  language: de
  text: 'Menschensohn, schreib dir das Datum auf[a], genau diesen Tag[b]: Der König von Babel hat genau an diesem Tag die Belagerung Jerusalems begonnen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Namen des Tages«. Gemeint ist: »das Datum«.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung »genau dieser Tag/genau an diesem Tag« wird im Hebräischen zur Betonung wiederholt.
    reason: lexical_alternative
  - marker: c
    text: 'Oder näher am hebräischen Wortlaut: »Der König von Babel ist gegen Jerusalem angerückt.« Im militärischen Zusammenhang bezeichnet das Verb den Beginn der Belagerung.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die im Buch Ezechiel herkömmliche und kontextgerechte Wiedergabe bewahrt die hebräische Anrede und ihre repräsentativ-menschliche Bedeutung.
- source_word: כתוב לְךָ
  choice: schreib dir … auf
  rationale: Gibt den Imperativ כתוב und die persönliche beziehungsweise reflexive Nuance von לְךָ in natürlichem Deutsch wieder.
- source_word: אֶת שֵׁם הַיּוֹם
  choice: das Datum
  rationale: Die wörtliche Wendung »den Namen des Tages« bezeichnet im Kontext die kalendarische Datumsangabe; »das Datum« ist im Deutschen klar und idiomatisch.
- source_word: אֶת עֶצֶם הַיּוֹם הַזֶּה
  choice: genau diesen Tag
  rationale: עֶצֶם verstärkt hier die Identität und Genauigkeit des bezeichneten Tages.
- source_word: סָמַךְ
  choice: hat … die Belagerung … begonnen
  rationale: Das Verb bedeutet grundsätzlich »sich anlehnen/andrängen«; im militärischen Zusammenhang bezeichnet es hier den Beginn der Belagerung, wie auch die Datierung des Ereignisses nahelegt.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Direkte Wiedergabe der Constructusverbindung; »Babel« entspricht der üblichen deutschen biblischen Namensform.
- source_word: אֶל יְרוּשָׁלִַם
  choice: Jerusalems
  rationale: Die deutsche Genitivverbindung mit »Belagerung« gibt die gegen Jerusalem gerichtete militärische Handlung natürlich wieder.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: genau an diesem Tag
  rationale: Bewahrt die wiederholte emphatische Datumsangabe und die präzise Gleichzeitigkeit.
