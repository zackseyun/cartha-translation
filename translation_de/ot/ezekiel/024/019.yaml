  yaml_path: translation/ot/ezekiel/024/019.yaml
  text: And the people said to me, “Will you not tell us what these things mean for us, that you are doing them?”
translation:
  language: de
  text: 'Da sagte das Volk zu mir: »Willst du uns nicht sagen, was diese Dinge, die du tust, für uns bedeuten?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה אֵלֶּה לָנוּ
  choice: was das … für uns bedeutet
  rationale: Die knappe hebräische Wendung fragt idiomatisch nach der Bedeutung der Handlungen für das Volk; die deutsche Formulierung gibt diesen Sinn natürlich wieder.
- source_word: כִּי אַתָּה עֹשֶׂה
  choice: was du da tust
  rationale: Das demonstrative »da« greift die beobachteten Zeichenhandlungen auf und bewahrt den Bezug der hebräischen Konstruktion, ohne das Verhältnis durch »weil« vorschnell kausal festzulegen.
- source_word: הָעָם
  choice: das Volk
  rationale: Entspricht dem üblichen kollektiven Sinn des hebräischen Ausdrucks im Kontext.
theological_decisions:
- issue: Bedeutung von Hesekiels Zeichenhandlung
  choice: Die Frage bleibt offen und bittet den Propheten um Deutung.
  alternative: Die Handlung bereits als bestimmtes Gerichtssymbol ausdeuten.
  rationale: Der Vers selbst nennt die Deutung noch nicht; sie folgt erst in der anschließenden prophetischen Antwort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte Frage wurde idiomatisch geordnet; »da« weist auf das unmittelbar beobachtete Verhalten des Propheten zurück.
