source:
  edition: WLC
  text: אֱסֹ֤ף נְתָחֶ֨י/הָ֙ אֵלֶ֔י/הָ כָּל נֵ֥תַח ט֖וֹב יָרֵ֣ךְ וְ/כָתֵ֑ף מִבְחַ֥ר עֲצָמִ֖ים מַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/004.yaml
  text: Gather its pieces into it[a], every good piece—the thigh and the shoulder[b]; fill it with choice bones.
translation:
  language: de
  text: Sammle seine Fleischstücke in ihn[a], jedes gute Stück – Keule und Schulter[b]; fülle ihn mit ausgewählten Knochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihn“; gemeint ist der zuvor genannte Topf.'
    reason: grammatical_clarity
  - marker: b
    text: 'Oder: „jedes ausgewählte Stück“. „Gut“ bezeichnet hier begehrte oder ausgesuchte Fleischstücke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹף
  choice: Sammle
  rationale: Der Imperativ von אסף fordert dazu auf, die Stücke im Topf zusammenzubringen; „Sammle“ bewahrt die Befehlsform und klingt natürlich.
- source_word: נְתָחֶיהָ
  choice: ihre Fleischstücke
  rationale: נתח bezeichnet zerlegte Stücke, besonders Fleischstücke. Die ausdrückliche Wiedergabe mit „Fleischstücke“ macht das Schlacht- und Kochbild im Deutschen klar.
- source_word: אֵלֶיהָ
  choice: in ihr
  rationale: Das feminine Pronomen bezieht sich auf den im Kontext genannten Topf. Da „Topf“ im Deutschen maskulin ist, wirkt die feminine Rückbeziehung innerhalb dieses Einzelverses ungewöhnlich; sie bewahrt jedoch die Form des hebräischen Bezugs. Die Fußnote nennt die idiomatisch kontextbezogene Alternative.
- source_word: כָּל נֵתַח טוֹב
  choice: jedes gute Stück
  rationale: Die Formulierung bewahrt sowohl das distributive כָּל als auch das wertende טוֹב, ohne die Bedeutung vorschnell zum Superlativ zu steigern.
- source_word: יָרֵךְ וְכָתֵף
  choice: Hüfte und Schulter
  rationale: „Hüfte“ und „Schulter“ geben die bezeichneten Körper- beziehungsweise Fleischpartien knapp und verständlich wieder.
- source_word: מִבְחַר עֲצָמִים
  choice: ausgewählten Knochen
  rationale: Der Ausdruck bezeichnet eine Auswahl beziehungsweise erlesene Knochen. „Ausgewählt“ wahrt die qualitative Aussage, ohne einen im Hebräischen nicht eindeutigen Superlativ einzuführen.
- source_word: מַלֵּא
  choice: fülle sie
  rationale: Der Imperativ von מלא wird direkt wiedergegeben; das ergänzte Objekt verweist auf den Topf, wie es der Zusammenhang verlangt.
