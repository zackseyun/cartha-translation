base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/020.yaml
  text: So I said to them[a], “The word of Yahweh came to me, saying,”
translation:
  language: de
  text: 'Da sagte ich zu ihnen: „Das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Der Qal-Wayyiqtol führt die nächste Handlung in der Erzählfolge ein. „Da sagte ich“ klingt im Deutschen natürlich und bewahrt den Fortgang der Erzählung.
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: Die Präposition אֶל mit dem Suffix der 3. Person maskulin Plural bezeichnet die Adressaten.
- source_word: דְּבַר יְהוָה
  choice: Das Wort Jahwes
  rationale: „Wort“ bewahrt die feste prophetische Formel und ihre innerbiblischen Bezüge; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הָיָה אֵלַי
  choice: kam zu mir
  rationale: Wörtlich steht „war zu mir“; in dieser prophetischen Formel ist „kam zu mir“ die natürliche deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv dient als Einleitung der folgenden direkten Rede. Ein Doppelpunkt gibt diese Funktion in natürlichem modernem Deutsch präzise wieder, ohne das schwerfällige „folgendermaßen sprechend“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste prophetische Wendung „Das Wort Jahwes kam zu mir“ bleibt erhalten; לֵאמֹר wird idiomatisch durch einen Doppelpunkt ausgedrückt. Das öffnende Anführungszeichen leitet die Rede ein, die im Folgevers weitergeführt wird.
