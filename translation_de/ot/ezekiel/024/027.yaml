  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִפָּ֤תַח פִּ֨י/ךָ֙ אֶת הַ/פָּלִ֔יט וּ/תְדַבֵּ֕ר וְ/לֹ֥א תֵֽאָלֵ֖ם ע֑וֹד וְ/הָיִ֤יתָ לָ/הֶם֙ לְ/מוֹפֵ֔ת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/027.yaml
  text: On that day your mouth will be opened when the fugitive comes to you[a], and you will speak and no longer be mute. So you will be a sign to them, and they will know that I am Yahweh.
translation:
  language: de
  text: An jenem Tag wird sich dein Mund öffnen, wenn der Entkommene zu dir kommt[a]. Du wirst reden und nicht länger stumm sein. So wirst du ihnen zu einem Zeichen werden, und sie werden erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dem Entkommenen«. Die hebräische Wendung ist schwierig; sie kann die Öffnung von Hesekiels Mund mit der Ankunft des entkommenen Boten in Verbindung bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitangabe.
- source_word: יִפָּתַח פִּיךָ
  choice: wird dein Mund geöffnet werden
  rationale: Bewahrt das Passiv des Nifal und den Rückbezug auf Hesekiels auferlegte Stummheit.
- source_word: אֶת הַפָּלִיט
  choice: wenn der Flüchtling zu dir kommt
  rationale: Die hebräische Konstruktion mit אֶת ist schwierig. Im Zusammenhang bezeichnet הַפָּלִיט den entkommenen Boten, dessen Ankunft mit der Öffnung von Hesekiels Mund verbunden ist; die Ergänzung 'zu dir kommt' wird durch Vers 26 und 33,21–22 gestützt.
- source_word: וּתְדַבֵּר וְלֹא תֵאָלֵם עוֹד
  choice: Dann wirst du reden und nicht länger stumm sein
  rationale: אלם bezeichnet hier tatsächliche Stummheit beziehungsweise Sprachunfähigkeit, nicht bloß freiwilliges Schweigen. 'Dann' macht den zeitlichen Fortgang natürlich deutlich.
- source_word: וְהָיִיתָ לָהֶם לְמוֹפֵת
  choice: So wirst du ihnen zu einem Zeichen werden
  rationale: מוֹפֵת bezeichnet ein Zeichen oder Vorzeichen; 'Zeichen' ist im Deutschen klar und bewahrt die symbolische Funktion des Propheten.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: und sie werden erkennen, dass ich Jahwe bin
  rationale: Bewahrt die wiederkehrende Erkenntnisformel des Buches und gibt den Gottesnamen als 'Jahwe' wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. 'Jahwe' gibt ihn im modernen deutschen Bibelkontext unmittelbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Ende von Hesekiels Stummheit
  choice: konkrete Wiederherstellung seiner Sprache in Verbindung mit der Ankunft des Flüchtlings
  alternative: allgemeines oder rein bildliches Ende seines Schweigens
  rationale: Der unmittelbare Zusammenhang in 24,26 sowie 33,21–22 verbindet Hesekiels erneutes Reden mit der Nachricht vom Fall Jerusalems, ohne die genaue syntaktische Beziehung völlig eindeutig zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wörtliche Wendung 'dein Mund wird geöffnet' bleibt wegen ihres erzählerischen und theologischen Rückbezugs erhalten. 'Flüchtling' bezeichnet hier den aus Jerusalem entkommenen Nachrichtenboten, nicht notwendig einen Flüchtling im heutigen rechtlichen Sinn.
