  text: תְּאֻנִ֖ים הֶלְאָ֑ת וְ/לֹֽא תֵצֵ֤א מִמֶּ֨/נָּה֙ רַבַּ֣ת חֶלְאָתָ֔/הּ בְּ/אֵ֖שׁ חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/012.yaml
  text: With toil she has wearied herself[a], yet her abundant corrosion does not go out from her[b]; her corrosion remains in the fire.
translation:
  language: de
  text: Sie hat sich mit Mühen erschöpft[a], doch ihr großer Rostbelag kommt nicht aus ihr heraus; ihr Rost ins Feuer![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Mit Mühen hat sie sich abgemüht.« Die hebräische Formulierung ist selten und knapp.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schluss ist eine verblose Wortgruppe, wörtlich etwa: »im/durch Feuer ihr Rost«. Seine genaue Verbindung ist umstritten. Möglich sind etwa: »Ihr Rost bleibt im Feuer« oder, wie im Text elliptisch wiedergegeben: »Ihr Rost ins Feuer!«'
    reason: textual_ambiguity
lexical_decisions:
- source_word: תְּאֻנִים
  choice: mit Mühen
  rationale: Der seltene Plural bezeichnet Mühen bzw. anstrengende Bemühungen. Die adverbiale Wendung ist im Deutschen natürlich und bewahrt den Gedanken vergeblicher Anstrengung, ohne ihn ausdrücklich in den Text einzutragen.
- source_word: הֶלְאָת
  choice: sie hat sich erschöpft
  rationale: Die feminine Verbform entspricht dem personifizierten Topf beziehungsweise der dadurch dargestellten Stadt. Die reflexive Wiedergabe drückt das Ergebnis der Mühen idiomatisch aus.
- source_word: וְלֹא תֵצֵא מִמֶּנָּה
  choice: doch ... geht nicht aus ihr heraus
  rationale: Die räumliche Bildsprache von יצא und מן bleibt erhalten; zugleich klingt die Formulierung im Deutschen verständlich.
- source_word: רַבַּת חֶלְאָתָהּ
  choice: ihr starker Rost
  rationale: רַבַּת beschreibt hier das große Ausmaß der fest sitzenden Verunreinigung. »Starker Rost« ist im Bild eines Metalltopfes verständlich, während die Fußnote den weiteren Bedeutungsumfang von חֶלְאָה offenhält.
- source_word: בְּאֵשׁ חֶלְאָתָהּ
  choice: ins Feuer mit ihrem Rost!
  rationale: Die hebräische Schlusswendung ist verblos und mehrdeutig. Als knapper Ausruf verstanden, bezeichnet בְּ den Bereich beziehungsweise das Ziel der Feuerbehandlung; diese Wiedergabe bewahrt die Ellipse, statt ungekennzeichnet ein Verb wie »bleibt« zu ergänzen.
theological_decisions:
- issue: Deutung der elliptischen Schlusswendung בְּאֵשׁ חֶלְאָתָהּ
  choice: 'als knapper Ausruf: »ins Feuer mit ihrem Rost!«'
  alternative: »ihr Rost bleibt im Feuer« oder »durch Feuer gegen ihren Rost«
  rationale: Der masoretische Text enthält kein Verb für »bleiben«. Die ausrufartige Wiedergabe hält die Gerichtsszene und die syntaktische Offenheit fest; die Fußnote nennt die wichtigsten möglichen Auffassungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das feminine Pronomen folgt der Personifikation im Hebräischen, obwohl »Topf« im Deutschen maskulin ist; im Zusammenhang kann es zugleich auf die dargestellte Stadt verweisen. Die harte, knappe Schlusswendung spiegelt die Ellipse des Ausgangstextes.
