base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/005.yaml
  text: Take the choicest of the flock[a], and also pile the bones under it; bring it to a boil, boil it well[b], and let its bones be cooked in it.
translation:
  language: de
  text: Nimm das Beste aus der Herde und schichte auch die Knochen unter dem Topf auf.[a] Lass ihn kräftig aufkochen,[b] und lass auch die Knochen darin gar werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „aufschichten“ wiedergegebene hebräische Wort ist selten; die genaue Bedeutung ist unsicher. Gemeint ist offenbar, dass die Knochen unter den Topf gelegt werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Lass sein Kochen kochen“; die stammverwandten Wörter verstärken die Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְחַר הַצֹּאן
  choice: das Beste von der Herde
  rationale: מִבְחַר bezeichnet das Ausgewählte oder Beste. Die Formulierung lässt offen, ob ein einzelnes ausgewähltes Tier oder allgemein das beste Vieh gemeint ist.
- source_word: לָקֹוחַ
  choice: Nimm
  rationale: Die Form steht hier in der Folge der Anweisungen mit auffordernder Kraft; „Nimm“ ist im Deutschen knapp und natürlich.
- source_word: וְגַם דּוּר הָעֲצָמִים תַּחְתֶּיהָ
  choice: und schichte auch die Knochen unter ihr auf
  rationale: דּוּר ist selten und bezeichnet hier wahrscheinlich das Aufschichten oder Anordnen. „Unter ihr“ bezieht sich auf den zuvor genannten Topf; die genaue Nuance wird in einer Fußnote offengehalten.
- source_word: רַתַּח רְתָחֶיהָ
  choice: Lass sie kräftig aufkochen
  rationale: Die Verbindung von Verb und stammverwandtem Substantiv verstärkt den Kochvorgang. „Kräftig aufkochen“ gibt diese Intensivierung in natürlichem Deutsch wieder.
- source_word: גַּם בָּשְׁלוּ עֲצָמֶיהָ בְּתוֹכָהּ
  choice: und lass auch ihre Knochen darin gar werden
  rationale: Die Perfektform steht innerhalb einer auffordernden Anweisungsfolge und kann entsprechend wiedergegeben werden. „Gar werden“ beschreibt das vollständige Gekochtwerden, ohne eine im Hebräischen nicht ausdrücklich markierte Zweck- oder Folgebeziehung einzuführen.
