  text: בְּ/טֻמְאָתֵ֖/ךְ זִמָּ֑ה יַ֤עַן טִֽהַרְתִּי/ךְ֙ וְ/לֹ֣א טָהַ֔רְתְּ מִ/טֻּמְאָתֵ/ךְ֙ לֹ֣א תִטְהֲרִי ע֔וֹד עַד הֲנִיחִ֥/י אֶת חֲמָתִ֖/י בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/013.yaml
  text: In your uncleanness is lewdness[a]. Because I cleansed you, but you were not cleansed from your uncleanness[b], you will not be cleansed anymore until I have satisfied my wrath against you.
translation:
  language: de
  text: In deiner Unreinheit liegt schändliches Treiben.[a] Weil ich dich gereinigt habe, du aber von deiner Unreinheit nicht rein geworden bist, wirst du nicht mehr rein werden, bis ich meinen Zorn an dir zur Ruhe gebracht habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In deiner Unreinheit liegt Schandtat.“ Das hebräische Wort kann schamloses, häufig sexuell gefärbtes verwerfliches Treiben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: bis Gottes Zorn sich an dir vollständig ausgewirkt hat. Wörtlich: „bis ich meinen Zorn an dir zur Ruhe gebracht habe“.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּטֻמְאָתֵךְ
  choice: In deiner Unreinheit
  rationale: טֻמְאָה bezeichnet Unreinheit mit kultischen und moralischen Bezügen. Die Wiedergabe bewahrt die Präposition ב und lässt die in Hesekiel beabsichtigte Bedeutungsüberlagerung bestehen.
- source_word: זִמָּה
  choice: schändliche Zuchtlosigkeit
  rationale: זִמָּה kann in Hesekiel schamlose, häufig sexuell gefärbte Verworfenheit bezeichnen. „Schändliche Zuchtlosigkeit“ ist deutlicher als das allgemeine „Bosheit“, ohne die Bedeutung auf einen einzelnen sexuellen Akt zu verengen.
- source_word: יַעַן
  choice: Weil
  rationale: יַעַן leitet hier den Grund für das folgende Gerichtswort ein. „Weil“ bildet diesen Zusammenhang knapp und natürlich ab.
- source_word: טִהַרְתִּיךְ
  choice: ich dich gereinigt habe
  rationale: Das Piel-Perfekt wird formal als vollzogene Handlung wiedergegeben. Die Spannung zum anschließenden Ausbleiben des Reinwerdens bleibt erhalten, statt durch „ich versuchte“ oder „ich wollte“ erklärend aufgelöst zu werden.
- source_word: וְלֹא טָהַרְתְּ
  choice: du aber … nicht rein geworden bist
  rationale: Die Zustands- beziehungsweise Ergebnisbedeutung wird im Deutschen idiomatisch mit „rein geworden“ ausgedrückt und klar von Gottes vorausgehender Reinigungshandlung unterschieden.
- source_word: לֹא תִטְהֲרִי עוֹד
  choice: wirst du nicht mehr rein werden
  rationale: Die zukünftige Verneinung und עוֹד werden mit einer natürlichen deutschen Zukunftsform und „nicht mehr“ wiedergegeben.
- source_word: עַד הֲנִיחִי אֶת־חֲמָתִי בָּךְ
  choice: bis ich meinen Zorn an dir zur Ruhe gebracht habe
  rationale: Die Formulierung bewahrt das hebräische Bild, nach dem Gott seinen Zorn zur Ruhe bringt, und gibt בָּךְ im Gerichtszusammenhang idiomatisch mit „an dir“ wieder.
theological_decisions:
- issue: Verhältnis zwischen Gottes Reinigungshandlung und Jerusalems ausbleibender Reinigung
  choice: „ich dich gereinigt habe, du aber … nicht rein geworden bist“
  alternative: „ich versucht habe, dich zu reinigen“ oder „ich dich reinigen wollte“
  rationale: Der hebräische Text stellt eine aktive Reinigung Gottes und das dennoch ausbleibende Reinwerden Jerusalems nebeneinander. Die Übersetzung erhält diese theologische und sprachliche Spannung; eine Deutung als bloßer Versuch oder Wunsch wird nur in der Fußnote genannt.
- issue: Vollendung des göttlichen Zorns
  choice: „meinen Zorn an dir zur Ruhe gebracht habe“
  alternative: „meinen Zorn an dir ausgelassen habe“
  rationale: Die gewählte Fassung bewahrt die Bildsprache von נוח und bezeichnet das vollständige Ergehen des Gerichts, ohne eine technische sühnentheologische Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Anrede bezieht sich auf Jerusalem. Die Wiederholung von „Unreinheit“ und „rein“ bildet die hebräische Wortführung bewusst nach; die ungewöhnliche Spannung zwischen „gereinigt“ und „nicht rein geworden“ bleibt erhalten.
