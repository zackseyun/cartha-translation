base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/018.yaml
  text: So I spoke to the people in the morning[a], and my wife died in the evening. Then in the morning I did as I had been commanded.
translation:
  language: de
  text: Ich redete am Morgen zum Volk[a], und am Abend starb meine Frau. Am Morgen tat ich, wie mir befohlen worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich redete am Morgen zum Volk … und am Morgen tat ich, wie mir befohlen worden war.“ Im Hebräischen sind die Verben wiederholt mit waw („und“) verbunden; die Übersetzung gibt den Erzählfortgang in natürlichem Deutsch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: So redete ich
  rationale: Das waw-verbundene Verb führt die Erzählung weiter. „So“ gibt den fortschreitenden beziehungsweise folgernden Zusammenhang in natürlichem Deutsch wieder.
- source_word: אֶל הָעָם
  choice: zum Volk
  rationale: עָם bezeichnet hier kollektiv das Volk; mit אֶל ist „zum Volk“ eine natürliche und sachlich genaue Wiedergabe.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Die Präpositionalverbindung bezeichnet den Zeitpunkt von Ezechiels Rede. „Am Morgen“ ist idiomatisches Standarddeutsch.
- source_word: וַתָּמָת
  choice: starb
  rationale: מות ist das gewöhnliche Verb für „sterben“; die direkte Wiedergabe vermeidet eine im Hebräischen nicht angelegte Beschönigung.
- source_word: אִשְׁתִּי
  choice: meine Frau
  rationale: אִשָּׁה mit dem Suffix der ersten Person Singular bezeichnet im ehelichen Zusammenhang eindeutig „meine Frau“.
- source_word: בָּעָרֶב
  choice: am Abend
  rationale: Die Zeitangabe steht parallel zu „am Morgen“ und wird ebenso knapp und natürlich wiedergegeben.
- source_word: וָאַעַשׂ
  choice: tat ich
  rationale: עשה bezeichnet hier die Ausführung des erteilten Befehls. „tat ich“ bewahrt die allgemeine Formulierung, während der folgende Satzteil ihren Maßstab nennt.
- source_word: כַּאֲשֶׁר
  choice: was
  rationale: Im Deutschen gibt die Verbindung „tat ich, was mir befohlen worden war“ die Übereinstimmung des Handelns mit dem Befehl natürlicher wieder als ein formales „wie“.
- source_word: צֻוֵּיתִי
  choice: mir befohlen worden war
  rationale: Die Passivform bezeichnet Ezechiel als Empfänger eines Befehls. Das Plusquamperfekt verdeutlicht natürlich, dass der Befehl seinem Handeln vorausging.
