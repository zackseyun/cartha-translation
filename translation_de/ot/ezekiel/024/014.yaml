language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲנִ֨י יְהוָ֤ה דִּבַּ֨רְתִּי֙ בָּאָ֣ה וְ/עָשִׂ֔יתִי לֹֽא אֶפְרַ֥ע וְ/לֹא אָח֖וּס וְ/לֹ֣א אֶנָּחֵ֑ם כִּ/דְרָכַ֤יִ/ךְ וְ/כַ/עֲלִילוֹתַ֨יִ/ךְ֙ שְׁפָט֔וּ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/014.yaml
  text: I[a], Yahweh, have spoken; it is coming[b], and I will do it. I will not hold back, nor will I spare, nor will I relent. According to your ways and according to your deeds they will judge you[c], declares the Lord GOD.
translation:
  language: de
  text: Ich, Jahwe, habe gesprochen. Es kommt, und ich werde es tun. Ich werde nicht davon ablassen[a], ich werde nicht verschonen und meinen Entschluss nicht ändern[b]. Nach deinen Wegen und nach deinen Taten werden sie dich richten[c] — Ausspruch des Herrn Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde mich nicht zurückhalten“ beziehungsweise „nicht davon abrücken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde nicht nachgeben“ beziehungsweise „mich nicht umstimmen lassen“.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht „sie werden dich richten“. Wer damit gemeint ist, bleibt unbestimmt; es können diejenigen sein, die Jahwes Gericht vollstrecken.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Das Perfekt bezeichnet die abgeschlossene, weiterhin gültige göttliche Aussage.
- source_word: בָּאָה
  choice: Es kommt
  rationale: Das feminine Verb hat wahrscheinlich das angekündigte Gericht beziehungsweise Unheil als unausgesprochenes Subjekt; die knappe Form erhält diese Offenheit.
- source_word: וְעָשִׂיתִי
  choice: und ich werde es tun
  rationale: Das Perfekt ist in der prophetischen Abfolge auf die bevorstehende Ausführung des angekündigten Gerichts bezogen.
- source_word: אֶפְרַע
  choice: davon ablassen
  rationale: Die Wendung bezeichnet, dass Jahwe sich von der Ausführung des Gerichts nicht zurückhalten oder davon abbringen lassen wird.
- source_word: אָחוּס
  choice: verschonen
  rationale: Im Gerichtskontext bedeutet das Verb, jemanden aus Mitleid zu schonen.
- source_word: אֶנָּחֵם
  choice: nachgeben
  rationale: Die Wiedergabe bezeichnet hier das Abstehen von einem angekündigten Gericht, ohne die mögliche Nuance einer Sinnesänderung völlig auszublenden.
- source_word: כִּדְרָכַיִךְ
  choice: Nach deinen Wegen
  rationale: Die Wegmetapher für Lebensführung und Verhalten bleibt erhalten.
- source_word: וְכַעֲלִילוֹתַיִךְ
  choice: und nach deinen Taten
  rationale: „Taten“ gibt die moralisch bewerteten Handlungen natürlich und gewichtig wieder.
- source_word: שְׁפָטוּךְ
  choice: werden sie dich richten
  rationale: Die aktive dritte Person Plural und die nicht genannten Vollstrecker des Gerichts bleiben erhalten.
- source_word: אֲדֹנָי יְהֹוִה
  choice: der Herr Jahwe
  rationale: Sowohl der Titel אֲדֹנָי als auch der unmittelbar folgende Gottesname werden sichtbar wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Übersetzung bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נָחַם im Zusammenhang mit göttlichem Gericht
  choice: nicht nachgeben
  alternative: meinen Sinn nicht ändern / es mich nicht gereuen lassen
  rationale: „Nicht nachgeben“ bezeichnet das Nichtabstehen vom angekündigten Gericht, während eine Fußnote die echte Bedeutungsbreite einschließlich einer möglichen Sinnesänderung wahrt.
- issue: Nicht genannte Richter in שְׁפָטוּךְ
  choice: werden sie dich richten
  alternative: wirst du gerichtet werden
  rationale: Die hebräische Aktivform mit unbestimmtem Pluralsubjekt wird bewahrt, ohne die handelnden Personen näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, feierlicher Satzfolge. Das feminine Gegenüber ist wie im Hebräischen durch „deinen/dich“ formal nicht eigens markiert. Die unbestimmten Bezüge in „Es kommt“ und „sie werden dich richten“ bleiben bewusst bestehen.
