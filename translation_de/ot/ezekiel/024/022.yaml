  text: וַ/עֲשִׂיתֶ֖ם כַּ/אֲשֶׁ֣ר עָשִׂ֑יתִי עַל שָׂפָם֙ לֹ֣א תַעְט֔וּ וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/022.yaml
  text: 'And you will do as I have done: you will not cover your mustache[b][a], and you will not eat the bread of men.'
translation:
  language: de
  text: 'Und ihr werdet tun, wie ich getan habe: Ihr werdet eure Oberlippe nicht bedecken[b] und das Brot der Menschen nicht essen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist damit „Trauerbrot“ gemeint, also Speise, die andere Menschen den Trauernden zum Trost bringen.
    reason: lexical_alternative
  - marker: b
    text: Die Oberlippe beziehungsweise der Bereich des Schnurrbarts zu bedecken war ein übliches Zeichen der Trauer oder der Unreinheit.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Und ihr werdet tun
  rationale: Die Form führt im Zusammenhang die prophetische Ankündigung fort. Das Futur gibt diese Funktion im modernen Deutschen natürlich wieder; „Und“ bewahrt die Verknüpfung durch וַ.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: wie ich getan habe
  rationale: Die Wendung vergleicht das bevorstehende Verhalten des Volkes mit Hesekiels bereits vollzogener Zeichenhandlung. Das Perfekt stellt diesen Bezug natürlich her.
- source_word: עַל שָׂפָם לֹא תַעְטוּ
  choice: Ihr werdet euren Schnurrbart nicht verhüllen
  rationale: שָׂפָם bezeichnet hier den Bereich des Schnurrbarts beziehungsweise der Oberlippe; עטה meint ein Bedecken oder Verhüllen. Die Formulierung bleibt nah am Bild und ist zugleich verständlich.
- source_word: לֶחֶם אֲנָשִׁים
  choice: das Brot der Menschen
  rationale: Dies gibt die ungewöhnliche hebräische Wendung formal wieder, ohne ihre wahrscheinlich auf Trauerkost bezogene Bedeutung im Haupttext festzulegen; die mögliche idiomatische Deutung steht in der Fußnote.
- source_word: לֹא תֹאכֵלוּ
  choice: nicht essen
  rationale: Das Futur der vorangehenden Verbform gilt auch für den parallelen zweiten Satzteil und entspricht dem voraussagenden Sinn im Kontext.
theological_decisions:
- issue: Bedeutung von לֶחֶם אֲנָשִׁים
  choice: Die wörtliche und mehrdeutige Wendung „das Brot der Menschen“ bleibt im Haupttext erhalten.
  alternative: „Trauerbrot“ oder „Speise, die andere den Trauernden bringen“
  rationale: Der Ausdruck wird häufig als von anderen gebrachte Speise für Trauernde verstanden, doch diese Deutung ist im Hebräischen nicht ausdrücklich ausformuliert. Die Übersetzung bewahrt daher die Spannung und erläutert die wahrscheinliche Bedeutung in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Futurform erhält den prophetisch-voraussagenden Charakter. Das kulturell fremde Bild und die lexikalische Mehrdeutigkeit werden nicht geglättet, sondern knapp durch Fußnoten erschlossen.
