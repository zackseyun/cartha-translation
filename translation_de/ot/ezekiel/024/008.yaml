  text: לְ/הַעֲל֤וֹת חֵמָה֙ לִ/נְקֹ֣ם נָקָ֔ם נָתַ֥תִּי אֶת דָּמָ֖/הּ עַל צְחִ֣יחַ סָ֑לַע לְ/בִלְתִּ֖י הִכָּסֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/008.yaml
  text: To stir up wrath[a], to take vengeance, I have set her blood on a bare rock[b], so that it would not be covered.
translation:
  language: de
  text: Um Zorn aufsteigen zu lassen und Rache zu nehmen[a], habe ich ihr Blut[b] auf einen kahlen Felsen gelegt, damit es nicht bedeckt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Rache zu nehmen“; das Hebräische verbindet ein Verb mit einem stammverwandten Substantiv und verstärkt dadurch die Aussage.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr Blut“ kann im Zusammenhang auch ihr Blutvergießen oder ihre Blutschuld bezeichnen; wörtlich steht jedoch „ihr Blut“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: aufsteigen zu lassen
  rationale: Der Hifil-Infinitiv von עלה bezeichnet mit חֵמָה das Verursachen beziehungsweise Hervorrufen von Zorn. Die deutsche Formulierung bewahrt das Bild des aufsteigenden Zorns und den kausativen Sinn.
- source_word: חֵמָה
  choice: Zorn
  rationale: Das Wort bezeichnet im prophetischen Gerichtskontext heftigen Zorn. „Zorn“ ist im heutigen Standarddeutsch klar, würdig und weniger stilistisch übersteigert als „Grimm“.
- source_word: לִנְקֹם נָקָם
  choice: Rache zu üben
  rationale: Die Verbindung eines Infinitivs mit einem stammverwandten Substantiv verstärkt die Aussage. „Rache üben“ gibt die Handlung idiomatisch wieder; die hebräische Emphase wird in einer Fußnote erläutert.
- source_word: נָתַתִּי
  choice: habe ich … gelegt
  rationale: נתן bedeutet hier mit der Ortsangabe „auf den kahlen Fels“ ein bewusstes Platzieren. „Gelegt“ erhält das konkrete Bild des offen daliegenden Blutes.
- source_word: דָּמָהּ
  choice: ihr Blut
  rationale: Die konkrete hebräische Bildsprache wird beibehalten. Im Zusammenhang kann das Wort zugleich auf ihr Blutvergießen oder ihre Blutschuld hinweisen, ohne dass diese Deutung in den Haupttext eingetragen wird.
- source_word: צְחִיחַ סָלַע
  choice: den kahlen Fels
  rationale: Die Wortgruppe bezeichnet eine unbedeckte, frei liegende Felsfläche. „Kahler Fels“ macht verständlich, dass das Blut sichtbar bleibt und weder versickert noch verborgen wird.
- source_word: לְבִלְתִּי הִכָּסוֹת
  choice: damit es nicht bedeckt wird
  rationale: Die Konstruktion drückt Zweck beziehungsweise beabsichtigtes Ergebnis aus. Die Formulierung wahrt diesen Sinn und bezieht das unpersönliche Passiv wie im Hebräischen auf das Blut.
theological_decisions:
- issue: Urheberschaft und Gerichtszweck der öffentlichen Zurschaustellung des Blutes
  choice: Der Sprecher legt das Blut absichtlich offen hin, um Zorn hervorzurufen und Rache zu üben.
  alternative: Die Aussage könnte allgemeiner als Beschreibung offen daliegenden Blutes verstanden werden, ohne die göttliche Absicht hervorzuheben.
  rationale: Die erste Person נָתַתִּי („habe ich gelegt“) und die vorangestellten Infinitive weisen auf eine bewusste gerichtliche Handlung des Sprechers hin. Zugleich wird nicht ergänzt, wessen Zorn aufsteigt, sodass die im Vers vorhandene Offenheit bestehen bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung erhält die beiden vorangestellten Zweckangaben; „aufsteigen zu lassen“ bewahrt zudem das hebräische Bild, ohne unnatürlich zu klingen.
