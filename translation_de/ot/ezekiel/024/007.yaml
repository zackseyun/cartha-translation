  text: כִּ֤י דָמָ/הּ֙ בְּ/תוֹכָ֣/הּ הָיָ֔ה עַל צְחִ֥יחַ סֶ֖לַע שָׂמָ֑תְ/הוּ לֹ֤א שְׁפָכַ֨תְ/הוּ֙ עַל הָ/אָ֔רֶץ לְ/כַסּ֥וֹת עָלָ֖י/ו עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/007.yaml
  text: For her blood is in her midst[a]; she set it on a bare rock[b]. She did not pour it out on the ground to cover it with dust.
translation:
  language: de
  text: Denn ihr Blut ist in ihrer Mitte[a]; sie hat es auf einen kahlen Felsen gelegt[b]. Sie hat es nicht auf den Erdboden gegossen, um es mit Staub zu bedecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Blutschuld“. Wörtlich steht im Hebräischen „ihr Blut“; das konkrete Bild kann hier die Schuld aus Gewalttaten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Vergossenes Blut mit Erde zu bedecken bedeutet, es nicht offen liegen zu lassen. Hier bleibt es auf dem kahlen Felsen für alle sichtbar.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für das vorausgehende Gerichtsbild ein.
- source_word: דָמָהּ
  choice: ihr Blut
  rationale: Gibt das konkrete Bild wörtlich wieder; zugleich kann das Blut für die durch Gewalttat entstandene Blutschuld stehen.
- source_word: בְּתוֹכָהּ
  choice: mitten in ihr
  rationale: Bewahrt den räumlichen Ausdruck und die Darstellung Jerusalems als weiblich personifizierte Stadt.
- source_word: הָיָה
  choice: ist
  rationale: Das Perfekt beschreibt hier einen bestehenden Zustand; das deutsche Präsens erhält die Unmittelbarkeit der prophetischen Aussage.
- source_word: עַל צְחִיחַ סֶלַע
  choice: auf einen kahlen Felsen
  rationale: צְחִיחַ bezeichnet eine kahle, unbedeckte Fläche; das Blut bleibt auf dem Felsen sichtbar und kann nicht in Erde einsickern.
- source_word: שָׂמָתְהוּ
  choice: sie hat es ... gelegt
  rationale: Natürliche Wiedergabe von שׂים mit Objektsuffix; das feminine Subjekt bezieht sich auf die personifizierte Stadt.
- source_word: לֹא שְׁפָכַתְהוּ
  choice: Sie hat es nicht ... gegossen
  rationale: Bewahrt die konkrete Bedeutung von שׁפך und den Gegensatz zwischen dem Ablegen auf Fels und dem Ausgießen auf Erde.
- source_word: עַל הָאָרֶץ
  choice: auf den Erdboden
  rationale: Bezeichnet hier konkret den Boden, auf dem das Blut mit Erde oder Staub hätte bedeckt werden können.
- source_word: לְכַסּוֹת עָלָיו עָפָר
  choice: um es mit Staub zu bedecken
  rationale: Gibt Zweck und Bild eng wieder. Das pronominale עָלָיו wird im Deutschen idiomatisch auf das Blut bezogen.
theological_decisions:
- issue: Deutung des offen liegenden Blutes
  choice: Das konkrete Bild des unbedeckten Blutes bleibt im Haupttext erhalten.
  alternative: „Blutschuld“ oder „Blutvergießen“ ausdrücklich in den Haupttext aufnehmen.
  rationale: 'Das Hebräische trägt die Aussage durch das sichtbare Blutbild: Jerusalems Gewaltschuld liegt offen zutage. Eine erklärende Abstraktion würde die Bildspannung abschwächen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierende feminine Rede über Jerusalem sowie das konkrete und bewusst anstößige Blutbild bleiben erhalten.
