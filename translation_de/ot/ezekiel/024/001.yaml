source:
  edition: WLC
  text: וַ/יְהִי֩ דְבַר יְהוָ֨ה אֵלַ֜/י בַּ/שָּׁנָ֤ה הַ/תְּשִׁיעִית֙ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י בֶּ/עָשׂ֥וֹר לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/001.yaml
  text: And the word of Yahweh came to me in the ninth year[a], in the tenth month, on the tenth day of the month, saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an mich im neunten Jahr[a], im zehnten Monat, am zehnten Tag des Monats:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht nur „im neunten Jahr“. Ezechiels Datierungen beziehen sich gewöhnlich auf die Jahre seit der Wegführung des Königs Jojachin.
    reason: Kultur- und Kontexthinweis zur unausgesprochenen Bezugsgröße der Jahresangabe.
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: Und das Wort Jahwes erging an mich
  rationale: Die im Deutschen geläufige prophetische Formel gibt die narrative Konstruktion mit היה idiomatisch wieder; „Wort“ bewahrt das Gewicht von דָּבָר, und „erging an mich“ entspricht der Richtung von אֵלַי.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. Die Form „Jahwe“ ist im modernen Deutschen geläufig.
- source_word: בַּשָּׁנָה הַתְּשִׁיעִית
  choice: im neunten Jahr
  rationale: Der hebräische Text nennt den Bezugspunkt des Jahres hier nicht ausdrücklich; deshalb wird „der Verbannung“ nicht in den Haupttext eingefügt.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: im zehnten Monat
  rationale: חֹדֶשׁ bezeichnet in dieser Datierungsformel den Kalendermonat.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: am zehnten Tag des Monats
  rationale: Die hebräische Wendung bezeichnet eindeutig den zehnten Tag innerhalb des Monats; die ausgeschriebene Form ist klar und würdevoll.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt im natürlichen modernen Deutsch die unmittelbar folgende Gottesrede ein und erfüllt hier dieselbe diskursive Funktion wie das hebräische לֵאמֹר, ohne das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen; „der HERR“ ersetzt ihn durch einen Titel, während „Jehova“ auf einer späteren Mischlesung beruht.
- issue: Bezugspunkt des „neunten Jahres“
  choice: im Haupttext unbestimmt lassen
  alternative: im neunten Jahr der Verbannung Jojachins
  rationale: Obwohl Ezechiels Datierungssystem gewöhnlich von der Verbannung König Jojachins ausgeht, steht dieser Bezug in diesem Vers nicht ausdrücklich. Die Ergänzung gehört daher in eine Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Wendung „das Wort Jahwes erging an mich“ bleibt verständlich und wahrt den formelhaften Charakter. Der Doppelpunkt führt die in Vers 2 folgende Rede natürlich ein.
