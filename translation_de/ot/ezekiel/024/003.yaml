  text: וּ/מְשֹׁ֤ל אֶל בֵּית הַ/מֶּ֨רִי֙ מָשָׁ֔ל וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה שְׁפֹ֤ת הַ/סִּיר֙ שְׁפֹ֔ת וְ/גַם יְצֹ֥ק בּ֖/וֹ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/003.yaml
  text: 'And speak a proverb to the rebellious house[a], and say to them, ‘Thus says the Lord GOD: Set on the pot; set it on, and also pour water into it.’'
translation:
  language: de
  text: 'Und trage dem widerspenstigen Haus ein Gleichnis[a] vor und sage zu ihnen: »So spricht Jahwe, der Herr: Setz den Topf auf, setz ihn auf und gieß auch Wasser hinein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Spruch« beziehungsweise »eine Bildrede«. Das hebräische Wort מָשָׁל kann einen Spruch, ein Gleichnis oder eine bildhafte Rede bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשֹׁל ... מָשָׁל
  choice: trage ... ein Gleichnis vor
  rationale: Die figura etymologica des Hebräischen lässt sich im Deutschen nicht natürlich wörtlich wiedergeben. „Ein Gleichnis vortragen“ gibt die verbale Handlung und den bildhaften Charakter der folgenden Topfszene klar wieder.
- source_word: בֵּית הַמֶּרִי
  choice: dem widerspenstigen Haus
  rationale: „Haus“ bewahrt die prägende prophetische Bezeichnung; „widerspenstig“ drückt die beharrliche Auflehnung aus und klingt im modernen Deutsch natürlich.
- source_word: מָשָׁל
  choice: ein Gleichnis
  rationale: מָשָׁל kann Spruch, Gleichnis oder bildhafte Rede bedeuten. Da hier ein ausgeführtes Topfbild folgt, ist „Gleichnis“ im Deutschen am verständlichsten; die weitere Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Verbindung unterscheidet den Herrschaftstitel אֲדֹנָי vom Gottesnamen יהוה. „Der Herr, Jahwe“ bewahrt beides, ohne das missverständliche „Herr HERR“.
- source_word: שְׁפֹת הַסִּיר שְׁפֹת
  choice: Stell den Topf auf, stell ihn auf
  rationale: Die Wiederholung des Imperativs wird als Ausdruck von Nachdruck und Dringlichkeit erhalten. „Aufstellen“ passt hier zum Aufsetzen eines Kochgefäßes.
- source_word: וְגַם יְצֹק בּוֹ מָיִם
  choice: und gieß auch Wasser hinein
  rationale: „Gieß ... hinein“ entspricht dem konkreten Verb יצק; „auch“ bewahrt die additive Kraft von גם, ohne ein vollständiges Füllen des Topfes vorauszusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR / der Herr HERR
  rationale: Der Text enthält sowohl den Titel אֲדֹנָי als auch den Eigennamen יהוה. Die gewählte Form wahrt diese Unterscheidung und vermeidet, den Gottesnamen durch einen zweiten Herrschaftstitel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der prophetische Ausdruck „Haus“ und die eindringliche Wiederholung „stell ... auf“ bleiben erhalten; Satzbau und Imperative sind zugleich gut verständlich.
