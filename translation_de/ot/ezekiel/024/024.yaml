id: EZK.24.24
reference: Ezekiel 24:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֨ה יְחֶזְקֵ֤אל לָ/כֶם֙ לְ/מוֹפֵ֔ת כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה תַּעֲשׂ֑וּ בְּ/בֹאָ֕/הּ וִֽ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/024.yaml
  text: And Ezekiel will be a sign for you; according to all that he has done, you will do. When it comes, then you will know that I am the Lord GOD.
translation:
  language: de
  text: Hesekiel wird euch zum Zeichen sein. Ganz so, wie er es getan hat, werdet ihr es tun. Wenn es eintrifft, werdet ihr erkennen, dass ich der Herr, JHWH, bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „der Herr JHWH“; JHWH ist der Eigenname Gottes.'
    reason: Erklärt die ungewohnte, aber quellennah beibehaltene Verbindung von Titel und Gottesname.
lexical_decisions:
- source_word: מוֹפֵת
  choice: Zeichen
  rationale: Das hebräische Wort bezeichnet hier ein bedeutungsvolles, prophetisches Zeichen beziehungsweise Vorzeichen; „Zeichen“ ist natürlich und bewahrt die Funktion Hesekiels als sichtbares Sinnbild.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: Ganz so, wie er es getan hat
  rationale: Gibt die Vergleichsformel vollständig und idiomatisch wieder, ohne den umfassenden Sinn von כְּכֹל abzuschwächen.
- source_word: בְּבֹאָהּ
  choice: Wenn es eintrifft
  rationale: Das feminine Suffix verweist grammatisch wahrscheinlich auf ein aus dem Kontext erschlossenes Geschehen beziehungsweise die angekündigte Katastrophe. Das unbestimmte „es“ bewahrt diesen Rückbezug, ohne ihn enger festzulegen.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, JHWH
  rationale: Unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und gibt beide Bestandteile der hebräischen Verbindung sichtbar wieder.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr, JHWH
  alternative: GOTT, der Herr
  rationale: Die gewählte Form wahrt den Unterschied zwischen Titel und Eigenname und vermeidet, dass der Gottesname hinter einer typografischen Konvention verschwindet.
- issue: Unbestimmter Bezug von בְּבֹאָהּ
  choice: Wenn es eintrifft
  alternative: Wenn dies eintrifft / Wenn sie kommt
  rationale: Der unmittelbare Vers nennt das Bezugswort nicht ausdrücklich. Die neutrale deutsche Form erhält die kontextuelle Offenheit, statt die angekündigte Belagerung oder Katastrophe explizit einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Aussagesätze folgen der eindringlichen prophetischen Rede; „eintreffen“ klingt bei einem angekündigten Ereignis natürlicher als das wörtlichere „kommen“.
