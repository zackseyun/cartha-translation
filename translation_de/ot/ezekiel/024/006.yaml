source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אוֹי֮ עִ֣יר הַ/דָּמִים֒ סִ֚יר אֲשֶׁ֣ר חֶלְאָתָ֣/ה בָ֔/הּ וְ/חֶ֨לְאָתָ֔/הּ לֹ֥א יָצְאָ֖ה מִמֶּ֑/נָּה לִ/נְתָחֶ֤י/הָ לִ/נְתָחֶ֨י/הָ֙ הוֹצִיאָ֔/הּ לֹא נָפַ֥ל עָלֶ֖י/הָ גּוֹרָֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/006.yaml
  text: 'Therefore thus says the Lord GOD: Woe to the city of bloodshed[a], the pot whose rust is in it, and whose rust has not gone out from it! Bring it out piece by piece[b]; no lot has fallen on it.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Wehe der Stadt des Blutvergießens, dem Topf, an dem sein Belag[a] haftet und von dem sein Belag nicht abgegangen ist! Nimm die Stücke heraus, eines nach dem anderen[b]; auf ihn ist kein Los gefallen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Rost“ oder „Schmutzkruste“. Das hebräische Wort bezeichnet einen unreinen oder korrosiven Rückstand, der am Topf haftet.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: Die Stücke werden einzeln herausgenommen, ohne dass durch das Los eine Auswahl getroffen wird.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Funktion der Partikel im Zusammenhang des vorausgehenden Zeichenhandelns knapp und natürlich wieder.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die geläufige prophetische Botenformel in würdigem, verständlichem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt beide Bestandteile des Gottesnamens wieder und bewahrt Yahweh als den im Hebräischen ausdrücklich stehenden Eigennamen.
- source_word: אוֹי
  choice: Wehe
  rationale: Erhält sowohl den Klage- als auch den Gerichtscharakter des prophetischen Ausrufs.
- source_word: עִיר הַדָּמִים
  choice: Stadt des Blutvergießens
  rationale: Der Plural דמים bezeichnet hier schuldhaftes Blutvergießen beziehungsweise Bluttaten, nicht lediglich Blut als Stoff.
- source_word: סִיר
  choice: Topf
  rationale: Bewahrt das konkrete Bild des Zeichenhandelns und ist im Deutschen unmittelbarer als eine stärker festlegende Bezeichnung wie „Kessel“.
- source_word: חֶלְאָה
  choice: Belag
  rationale: Der seltene Ausdruck bezeichnet den am Topf haftenden unreinen beziehungsweise korrosiven Rückstand. „Belag“ bewahrt die lexikalische Spannweite besser als das engere „Rost“.
- source_word: לֹא יָצְאָה מִמֶּנָּה
  choice: von dem ... nicht abgegangen ist
  rationale: Hält an der Bewegungsmetapher des hebräischen Verbs fest, ohne sie abstrakt als Reinigung auszudeuten.
- source_word: לִנְתָחֶיהָ לִנְתָחֶיהָ הוֹצִיאָהּ
  choice: Hol seine Stücke heraus, eines nach dem anderen
  rationale: Die Wiederholung hat distributive Kraft. Die deutsche Formulierung gibt das einzelne Herausnehmen der Fleischstücke natürlich wieder.
- source_word: לֹא נָפַל עָלֶיהָ גּוֹרָל
  choice: über ihn ist kein Los gefallen
  rationale: Bewahrt das Bild des fallenden Loses und vermeidet es, die genaue Funktion des Losens im Haupttext weiter auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form gibt sowohl den Herrentitel als auch den im Ausgangstext ausdrücklich vorhandenen Eigennamen wieder, ohne beide Elemente miteinander zu verschmelzen.
- issue: Bezug des Topfbildes auf die Stadt
  choice: dem Topf
  alternative: die ein Topf ist
  rationale: Die Apposition bewahrt die dichte Bildsprache des Hebräischen, ohne das Verhältnis zwischen Stadt und Topf stärker als im Ausgangstext zu erklären.
- issue: Bedeutung des fehlenden Loses
  choice: wörtliches Losbild im Haupttext, Erläuterung in der Fußnote
  alternative: ohne Auswahl werden alle herausgenommen
  rationale: So bleibt die knappe, potenziell mehrdeutige Gerichtssprache erhalten; die naheliegende Bedeutung wird lediglich als Erklärung angeboten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel und der Weheruf bleiben markant; seltene oder kulturell erklärungsbedürftige Bilder werden nicht im Haupttext geglättet, sondern knapp in Fußnoten erläutert.
