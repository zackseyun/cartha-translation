source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנְ/נִ֨י לֹקֵ֧חַ מִמְּ/ךָ֛ אֶת מַחְמַ֥ד עֵינֶ֖י/ךָ בְּ/מַגֵּפָ֑ה וְ/לֹ֤א תִסְפֹּד֙ וְ/לֹ֣א תִבְכֶּ֔ה וְ/ל֥וֹא תָב֖וֹא דִּמְעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/016.yaml
  text: Son of man[a], behold, I am taking from you the delight of your eyes with a blow, yet you shall not mourn or weep[c][b], nor shall your tears come.
translation:
  language: de
  text: Menschensohn, siehe, ich nehme dir die Freude deiner Augen[a] durch einen Schlag[b]. Doch du sollst keine Totenklage halten und nicht weinen; auch soll dir keine Träne kommen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das Verlangen deiner Augen“. Die Wendung bezeichnet, was Ezechiel besonders lieb und kostbar ist; im Zusammenhang ist seine Frau gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „durch eine Plage“ oder „durch einen Schlag“. Das hebräische Wort kann einen Schlag oder eine plageartige Heimsuchung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Deine Träne soll nicht kommen.“'
    reason: literal_rendering
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die im Buch Ezechiel feststehende Anrede wird als hebräische Wendung bewahrt; sie bezeichnet den angesprochenen Menschen, hier den Propheten.
- source_word: הִנְנִי לֹקֵחַ
  choice: 'sieh: Ich nehme'
  rationale: הִנְנִי lenkt feierlich die Aufmerksamkeit auf die folgende Ankündigung; das Partizip לֹקֵחַ vermittelt unmittelbar bevorstehendes, bereits entschlossenes Handeln.
- source_word: מַחְמַד עֵינֶיךָ
  choice: die Freude deiner Augen
  rationale: Die bildhafte Wendung bezeichnet, was Ezechiel besonders lieb und kostbar ist. Die Formulierung bleibt im Haupttext erhalten, ohne die im Zusammenhang erkennbare Ehefrau ausdrücklich einzusetzen.
- source_word: בְּמַגֵּפָה
  choice: durch einen Schlag
  rationale: מַגֵּפָה kann einen vernichtenden Schlag oder eine Plage bezeichnen. „Schlag“ wahrt im persönlichen Zusammenhang die Plötzlichkeit, ohne eine bestimmte Krankheit festzulegen.
- source_word: תִסְפֹּד
  choice: Totenklage halten
  rationale: Das Verb bezeichnet hier nicht nur inneres Trauern, sondern die erkennbare beziehungsweise förmliche Totenklage.
- source_word: תִבְכֶּה
  choice: weinen
  rationale: „Weinen“ gibt den körperlich-emotionalen Ausdruck wieder und bleibt von der förmlichen Totenklage unterschieden.
- source_word: וְלֹא תָבוֹא דִּמְעָתֶךָ
  choice: auch deine Träne soll nicht kommen
  rationale: Die ungewöhnliche Bildsprache des Hebräischen wird mit dem Singular „Träne“ und dem Verb „kommen“ möglichst transparent bewahrt.
theological_decisions:
- issue: Soll die „Freude deiner Augen“ ausdrücklich als Ezechiels Frau benannt werden?
  choice: Die bildhafte Wendung bleibt im Haupttext ohne ausdrückliche Nennung der Frau stehen.
  alternative: deine geliebte Frau
  rationale: Der folgende Zusammenhang identifiziert die Person, doch der vorliegende Vers verwendet bewusst die bildhafte Wendung. Ihre Beibehaltung vermeidet eine erklärende Ergänzung im Haupttext.
- issue: Soll בְּמַגֵּפָה eindeutig als Krankheit oder Plage bestimmt werden?
  choice: durch einen Schlag
  alternative: durch eine Plage
  rationale: Der hebräische Ausdruck lässt sowohl einen vernichtenden Schlag als auch eine plageartige Heimsuchung zu. Die Übersetzung legt die Todesart nicht enger fest als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Menschensohn“ bewahrt die feste Anrede des Buches; „Totenklage halten“ macht den rituell-sozialen Aspekt von ספד verständlich. Die auffällige Schlusswendung bleibt bewusst quellennah und wird in der Fußnote erläutert.
