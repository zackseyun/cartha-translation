  text: On that day the fugitive will come to you to make your ears hear[a].
translation:
  language: de
  text: An jenem Tag wird der Entkommene zu dir kommen und dir die Nachricht zu Gehör bringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „um die Ohren hören zu lassen“; die hebräische Wendung kann auch bedeuten: „dir Nachricht bringen“ oder „dich unterrichten“. Sie hebt hervor, dass Ezechiel den Bericht unmittelbar hören wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die natürliche deutsche Zeitangabe bewahrt den bestimmten zukünftigen Zeitpunkt und die demonstrative Kraft von הַהוּא.
- source_word: יָבוֹא
  choice: wird … kommen
  rationale: Das Qal-Imperfekt bezeichnet im prophetischen Zusammenhang ein zukünftiges Geschehen.
- source_word: הַפָּלִיט
  choice: der Entkommene
  rationale: Das Substantiv bezeichnet hier denjenigen, der der Katastrophe entkommen ist und anschließend Nachricht bringt. „Entkommene“ wahrt diesen konkreten Sinn besser als das im Deutschen leicht kriminalisierende „Flüchtige“.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Richtungsangabe und die männliche Singularanrede an Ezechiel werden unmittelbar wiedergegeben.
- source_word: לְהַשְׁמָעוּת אָזְנָיִם
  choice: dir die Nachricht zu Gehör bringen
  rationale: Die idiomatische Wendung betont, dass Ezechiel den mündlichen Bericht tatsächlich hören wird. Die Übersetzung erhält das Hörmotiv, ohne die im Deutschen unnatürliche Formulierung „deine Ohren hören lassen“ zu übernehmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Der Entkommene“ ist kontextgerecht und vermeidet die mögliche Fehlassoziation von „der Flüchtige“ mit einem Verfolgten oder Straftäter. Die leicht bildhafte Formulierung „zu Gehör bringen“ bewahrt das auditive Element des Hebräischen.
