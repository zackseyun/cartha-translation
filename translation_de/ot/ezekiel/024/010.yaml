  text: Pile up the wood[a], kindle the fire, cook the flesh thoroughly, and boil the broth[d][c][b]; and let the bones be charred.
translation:
  language: de
  text: Häufe das Holz auf[a], entfache das Feuer, gare das Fleisch vollständig[b] und bereite das Gemisch zu[c]; die Knochen sollen versengt werden[d].
  philosophy: optimal-equivalence
  footnotes:
