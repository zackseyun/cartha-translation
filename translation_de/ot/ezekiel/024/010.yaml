lexical_decisions:
- source_word: הַרְבֵּה הָעֵצִים
  choice: Häuft das Holz auf
  rationale: Die kausative Imperativform von רבה fordert dazu auf, die Holzmenge zu vergrößern. Im Deutschen gibt „aufhäufen“ dies im Zusammenhang mit Feuerholz natürlich und bildkräftig wieder.
- source_word: הַדְלֵק הָאֵשׁ
  choice: entfacht das Feuer
  rationale: Der kausative Imperativ von דלק bezeichnet das Anzünden beziehungsweise Entfachen. „Entfacht“ bewahrt den energischen Charakter der Befehlsfolge.
- source_word: הָתֵם הַבָּשָׂר
  choice: gart das Fleisch vollständig
  rationale: תמם bedeutet hier, den Garvorgang zu vollenden. „Vollständig“ gibt den Ergebnisaspekt wieder; „Fleisch“ bewahrt zugleich die Härte des prophetischen Bildes besser als eine bloß kulinarische Umschreibung.
- source_word: וְהַרְקַח הַמֶּרְקָחָה
  choice: und bereitet das Gemisch
  rationale: רקח bezeichnet das Mischen oder Zubereiten eines Gemenges, teils auch unter Verwendung von Gewürzen; מֶרְקָחָה ist das daraus bereitete Gemisch. Die Wiedergabe hält die im seltenen Ausdruck liegende Mehrdeutigkeit offen, statt eindeutig „Brühe“, „Eintopf“ oder „Gewürze“ festzulegen.
- source_word: וְהָעֲצָמוֹת יֵחָרוּ
  choice: die Knochen sollen versengt werden
  rationale: Die Niphalform von חרר beschreibt das Versengt- oder Verbranntwerden durch starke Hitze. Der deutsche Sollsatz bildet den Wechsel von den Imperativen zur hebräischen Verbform im Präfixkonjugationsmuster ab.
theological_decisions: []
translation_notes:
  register: Kurze, aufeinanderfolgende Befehle bewahren den drängenden Ton des Hebräischen. Die Sprache ist modern und verständlich, bleibt mit „Fleisch“, „Gemisch“ und „versengt“ jedoch bewusst herb. Die seltene und umstrittene Verbindung וְהַרְקַח הַמֶּרְקָחָה wird im Haupttext nicht enger bestimmt, als es die hebräische Wortbildung sicher erlaubt.
