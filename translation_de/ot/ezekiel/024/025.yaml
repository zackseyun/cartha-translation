  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/ל֗וֹא בְּ/י֨וֹם קַחְתִּ֤/י מֵ/הֶם֙ אֶת מָ֣עוּזָּ֔/ם מְשׂ֖וֹשׂ תִּפְאַרְתָּ֑/ם אֶת מַחְמַ֤ד עֵֽינֵי/הֶם֙ וְ/אֶת מַשָּׂ֣א נַפְשָׁ֔/ם בְּנֵי/הֶ֖ם וּ/בְנוֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/025.yaml
  text: And you[a], son of man, will it not be that on the day when I take from them their stronghold, the joy of their glory, the delight of their eyes[b], and the desire of their soul—their sons and their daughters—
translation:
  language: de
  text: Und du, Menschensohn, wird es nicht so sein, dass ich ihnen an dem Tag, an dem ich ihnen ihre Schutzburg wegnehme – die Freude ihrer Pracht, das Entzücken ihrer Augen[a] und das Verlangen ihrer Seele[b], ihre Söhne und ihre Töchter –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Begehren ihrer Augen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: das, wonach sich ihre Seele sehnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel wiederkehrende göttliche Anrede wird traditionsgemäß und formal entsprechend wiedergegeben.
- source_word: הֲלוֹא
  choice: Wird es nicht so sein
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet, und fügt sich natürlich in den deutschen Satzbau ein.
- source_word: בְּיוֹם
  choice: an dem Tag, an dem
  rationale: Gibt die ausdrückliche Zeitangabe verständlich und quellennah wieder.
- source_word: קַחְתִּי מֵהֶם
  choice: ich ihnen … nehme
  rationale: Das Verb bezeichnet hier ein Wegnehmen; die offene Formulierung legt die genaue Art des Verlustes nicht über den Ausgangstext hinaus fest.
- source_word: מָעוּזָּם
  choice: ihre Zuflucht
  rationale: מָעוֹז bezeichnet einen Ort oder Grund von Schutz und Stärke. „Zuflucht“ erhält den konkreten wie übertragenen Sinn, ohne den Bezug ausdrücklich als Tempel oder Jerusalem auszudeuten.
- source_word: מְשׂוֹשׂ תִּפְאַרְתָּם
  choice: die Freude ihrer Pracht
  rationale: Die kompakte hebräische Fügung aus Freude und Pracht wird beibehalten, statt sie zu einer eindeutigeren Deutung wie „ihr herrlicher Stolz“ aufzulösen.
- source_word: מַחְמַד עֵינֵיהֶם
  choice: die Lust ihrer Augen
  rationale: Bezeichnet das, was den Augen begehrenswert und kostbar ist. Die würdevolle deutsche Wendung bewahrt sowohl Freude als auch Begehren.
- source_word: מַשָּׂא נַפְשָׁם
  choice: das Verlangen ihrer Seele
  rationale: Die schwierige Wendung wird im Zusammenhang als das verstanden, worauf die Seele gerichtet ist. „Verlangen“ wahrt die emotionale Intensität und die mögliche Bedeutungsnähe zu einem inneren Sehnen.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ihre Söhne und ihre Töchter
  rationale: Gibt beide ausdrücklich genannten Gruppen wieder und glättet sie nicht zum Oberbegriff „Kinder“.
theological_decisions:
- issue: Bezug der Reihe von Zuflucht, Pracht und Begehrtem
  choice: Die bildhaften Bezeichnungen bleiben unaufgelöst.
  alternative: Die Zuflucht ausdrücklich mit dem Heiligtum oder Jerusalem identifizieren.
  rationale: Der nähere Zusammenhang legt diesen Bezug nahe, doch der Vers selbst nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt daher die Bildsprache und ihre Spannung.
- issue: Deutung von מַשָּׂא נַפְשָׁם
  choice: das Verlangen ihrer Seele
  alternative: die Last ihrer Seele
  rationale: Obwohl מַשָּׂא gewöhnlich „Last“ bedeuten kann, spricht die parallele Reihe von geliebten und begehrten Dingen hier eher für das, worauf die Seele gerichtet ist. Die Fußnote wahrt eine idiomatische Alternative innerhalb dieser Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich am Versende bleibt stehen, weil der Satz in Vers 26 weitergeführt wird. Die rhetorische Frage und die dichterisch verdichtete Aufzählung des Hebräischen werden bewahrt.
