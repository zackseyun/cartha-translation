  text: אֱמֹ֣ר לְ/בֵ֣ית יִשְׂרָאֵ֗ל כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מְחַלֵּ֤ל אֶת מִקְדָּשִׁ/י֙ גְּא֣וֹן עֻזְּ/כֶ֔ם מַחְמַ֥ד עֵֽינֵי/כֶ֖ם וּ/מַחְמַ֣ל נַפְשְׁ/כֶ֑ם וּ/בְנֵי/כֶ֧ם וּ/בְנֽוֹתֵי/כֶ֛ם אֲשֶׁ֥ר עֲזַבְתֶּ֖ם בַּ/חֶ֥רֶב יִפֹּֽלוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/021.yaml
  text: 'Say to the house of Israel[a], ‘Thus says the Lord GOD: Behold, I am about to profane my sanctuary, the pride of your strength, the delight of your eyes, and the desire of your soul[c][b]; and your sons and your daughters whom you left behind will fall by the sword.’'
translation:
  language: de
  text: 'Sag zum Haus Israel: »So spricht der Herr Jahwe: Siehe, ich werde mein Heiligtum entweihen, den Stolz eurer Stärke, die Freude eurer Augen und das, was euch lieb und teuer ist.[a] Eure Söhne und Töchter, die ihr zurückgelassen habt, werden durch das Schwert fallen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »das, was eure Seele schont oder hegt«; das seltene hebräische Wort kann etwas bezeichnen, das man innig schätzt oder mit dem man Mitleid hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לְבֵית יִשְׂרָאֵל
  choice: Sag zum Haus Israel
  rationale: Bewahrt die kollektive Bundesbezeichnung und gibt den singularischen Imperativ an Ezechiel natürlich wieder.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr, Jahwe
  rationale: Die geläufige prophetische Botenformel bleibt erhalten; אדני wird mit „Herr“ und der Gottesname יהוה als „Jahwe“ wiedergegeben.
- source_word: הִנְנִי מְחַלֵּל
  choice: Seht, ich werde … entweihen
  rationale: „Seht“ markiert die feierliche göttliche Ankündigung; die Verbindung mit dem Partizip bezeichnet hier eine bevorstehende Handlung.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: „Heiligtum“ entspricht dem kultischen Begriff genauer als das kontextuell mögliche „Tempel“.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: den Stolz eurer Stärke
  rationale: Die ungewöhnliche hebräische Genitivverbindung wird eng am Wortlaut bewahrt und bezeichnet das Heiligtum als Gegenstand stolzer Zuversicht.
- source_word: מַחְמַד עֵינֵיכֶם
  choice: die Freude eurer Augen
  rationale: Gibt den emotionalen Wert idiomatisch wieder und nimmt die Ausdrucksweise von Ezechiel 24,16 auf.
- source_word: וּמַחְמַל נַפְשְׁכֶם
  choice: das, was euch lieb und teuer ist
  rationale: Das seltene מַחְמַל hängt mit Schonen bzw. Erbarmen zusammen und bezeichnet hier parallel zu den vorigen Wendungen etwas innerlich Geschätztes; eine Fußnote bewahrt die lexikalische Unsicherheit.
- source_word: וּבְנֵיכֶם וּבְנוֹתֵיכֶם
  choice: Eure Söhne und Töchter
  rationale: Bewahrt das ausdrücklich genannte Paar, ohne es zu „Kinder“ zu verallgemeinern.
- source_word: אֲשֶׁר עֲזַבְתֶּם
  choice: die ihr zurückgelassen habt
  rationale: Passt zum Zusammenhang von Wegführung und den in Jerusalem verbliebenen Angehörigen, ohne das stärker wertende „verlassen“ im Sinn von preisgeben aufzuzwingen.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: werden durch das Schwert fallen
  rationale: Bewahrt die geläufige hebräische Wendung für gewaltsamen Tod.
theological_decisions:
- issue: Wiedergabe von יהוה nach אדני
  choice: der Herr, Jahwe
  alternative: GOTT, der Herr
  rationale: Die Wiedergabe unterscheidet אדני („Herr“) vom ausdrücklich gesetzten Gottesnamen יהוה und vermeidet, diesen im Deutschen zu verdecken.
- issue: Gott als Handelnder bei der Entweihung des Heiligtums
  choice: ich werde mein Heiligtum entweihen
  alternative: ich lasse mein Heiligtum entweihen
  rationale: Der hebräische Text schreibt die Handlung unmittelbar Gott zu. Eine kausative Abschwächung würde die theologische Spannung stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. „Seht“ spricht das Haus Israel als Kollektiv an. Die markierte Wendung „Stolz eurer Stärke“ bleibt wegen ihrer bildhaften Prägnanz bewusst nahe am Hebräischen; die seltene und mehrdeutige Formulierung מַחְמַל נַפְשְׁכֶם wird im Text natürlich und in der Fußnote quellengetreu erläutert.
