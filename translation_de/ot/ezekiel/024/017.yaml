source:
  edition: WLC
  text: הֵאָנֵ֣ק דֹּ֗ם מֵתִים֙ אֵ֣בֶל לֹֽא תַֽעֲשֶׂ֔ה פְאֵֽרְ/ךָ֙ חֲב֣וֹשׁ עָלֶ֔י/ךָ וּ/נְעָלֶ֖י/ךָ תָּשִׂ֣ים בְּ/רַגְלֶ֑י/ךָ וְ/לֹ֤א תַעְטֶה֙ עַל שָׂפָ֔ם וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/017.yaml
  text: Groan silently[a]; do not make mourning for the dead. Bind your turban on yourself, and put your sandals on your feet. Do not cover over your mustache[b], and do not eat the bread of men.
translation:
  language: de
  text: Stöhne still; halte keine Totenklage. Binde dir deinen Turban um und zieh deine Sandalen an. Verhülle deine Oberlippe[a] nicht und iss kein Brot von Menschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Schnurrbart“. Das hebräische Wort kann den Schnurrbart oder allgemein den Bereich der Oberlippe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Brot von Menschen“ ist wahrscheinlich Speise gemeint, die andere einem Trauernden bringen, also Trauerbrot.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאָנֵק דֹּם
  choice: Stöhne still
  rationale: הֵאָנֵק bezeichnet einen hörbaren Ausdruck von Schmerz oder Trauer; דֹּם schränkt ihn paradox wirkend auf Stille beziehungsweise Zurückhaltung ein. Die knappe deutsche Form bewahrt diese Spannung.
- source_word: מֵתִים אֵבֶל לֹא תַעֲשֶׂה
  choice: halte keine Totenklage
  rationale: עשה אבל meint hier das Vollziehen üblicher Trauerhandlungen. „Totenklage halten“ ist im Deutschen natürlich und lässt den rituellen Charakter erkennen, ohne einzelne Bräuche hinzuzufügen.
- source_word: פְאֵרְךָ
  choice: deinen Turban
  rationale: פְאֵר bezeichnet hier eine würdevolle Kopfbedeckung, die im Gegensatz zu sichtbaren Trauerzeichen getragen bleiben soll. „Turban“ ist konkret und im Kontext Ezechiels gut verständlich.
- source_word: חֲבוֹשׁ עָלֶיךָ
  choice: Binde dir … um
  rationale: חבש bezeichnet das Binden oder Anlegen einer Kopfbedeckung. Die reflexive deutsche Wendung gibt עָלֶיךָ idiomatisch wieder.
- source_word: וּנְעָלֶיךָ תָּשִׂים בְּרַגְלֶיךָ
  choice: zieh deine Sandalen an
  rationale: Die idiomatische deutsche Form gibt die konkrete Aufforderung wieder, die Sandalen an den Füßen zu behalten beziehungsweise anzulegen, und vermeidet unnötige Redundanz.
- source_word: וְלֹא תַעְטֶה עַל שָׂפָם
  choice: Verhülle deinen Bart nicht
  rationale: שָׂפָם kann den Schnurrbart beziehungsweise den Bereich der Oberlippe bezeichnen. „Bart“ ist eine natürliche traditionelle Wiedergabe für den verhüllten unteren Gesichtsbereich; die genauere lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל
  choice: iss kein Brot von Menschen
  rationale: Die ungewöhnlich knappe Genitivverbindung bleibt im Haupttext erhalten. Wahrscheinlich ist von Speise die Rede, die andere Menschen einem Trauernden bringen; diese Deutung wird nicht stillschweigend in den Text eingesetzt.
theological_decisions:
- issue: Darstellung der untersagten Trauerbräuche
  choice: Die Befehle werden als konkrete Verbote üblicher Trauerhandlungen übersetzt, ohne ihre jeweilige religiöse Bedeutung weiter auszudeuten.
  alternative: Die einzelnen Handlungen ausdrücklich als priesterliche Vorschriften oder ausschließlich als Reinheitszeichen deuten.
  rationale: Der Vers nennt sichtbare Trauerbräuche im Rahmen einer prophetischen Zeichenhandlung, erklärt aber nicht für jede Handlung eine besondere lehrmäßige oder kultische Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Imperative und die ungewöhnlichen Formulierungen „Stöhne still“ und „Brot von Menschen“ bewahren die sprachliche Spannung und Mehrdeutigkeit des Hebräischen; Fußnoten erläutern die beiden lexikalisch unsicheren Wendungen.
