source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה א֖וֹי עִ֣יר הַ/דָּמִ֑ים גַּם אֲנִ֖י אַגְדִּ֥יל הַ/מְּדוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/009.yaml
  text: 'Therefore thus says the Lord Yahweh: Woe to the city of bloodshed! I also will make the firewood pile great[a][b].'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Wehe der Stadt des Blutvergießens![a] Auch ich werde den Holzstoß vergrößern.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Stadt des Blutes“; der hebräische Plural kann Blutvergießen oder Blutschuld bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Auch ich werde den Scheiterhaufen vergrößern.“'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Gerichtswort knapp und idiomatisch wieder.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Die im Deutschen geläufige und zugleich quellennah bleibende prophetische Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne beide miteinander zu verschmelzen.
- source_word: אוֹי
  choice: Wehe
  rationale: Bewahrt den Charakter als Klage- und Gerichtsruf.
- source_word: עִיר הַדָּמִים
  choice: Stadt des Blutvergießens
  rationale: Der hebräische Plural דָּמִים bezeichnet hier idiomatisch Blutvergießen beziehungsweise Blutschuld; die Formulierung bewahrt die Anklage und bleibt verständlich.
- source_word: גַּם אֲנִי
  choice: Auch ich
  rationale: Erhält die betonte göttliche Beteiligung an der angekündigten Handlung.
- source_word: אַגְדִּיל
  choice: werde ... vergrößern
  rationale: Entspricht dem kausativen Sinn des Hifil von גדל und ist bei einem Holzstoß natürliches Deutsch.
- source_word: הַמְּדוּרָה
  choice: den Holzstoß
  rationale: Bezeichnet im Bildzusammenhang den aufgeschichteten Brennstoff für das Feuer; „Holzstoß“ ist konkret und vermeidet die mögliche funeräre Engführung von „Scheiterhaufen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom ausdrücklich vorhandenen Gottesnamen יהוה und macht beide Bestandteile sichtbar.
- issue: Art der angekündigten göttlichen Handlung
  choice: Auch ich werde den Holzstoß vergrößern
  alternative: Auch ich werde den Scheiterhaufen vergrößern
  rationale: Der Text stellt Yahwehs eigenes Handeln emphatisch heraus. „Holzstoß“ wahrt das Koch- und Feuerbild des Zusammenhangs, ohne eine im Hebräischen nicht zwingend vorhandene Bestattungsbedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „so spricht“ bleibt erhalten; ansonsten ist die Syntax unmittelbar und allgemein verständlich.
