  text: וְ/הַעֲמִידֶ֥/הָ עַל גֶּחָלֶ֖י/הָ רֵקָ֑ה לְמַ֨עַן תֵּחַ֜ם וְ/חָ֣רָה נְחֻשְׁתָּ֗/הּ וְ/נִתְּכָ֤ה בְ/תוֹכָ/הּ֙ טֻמְאָתָ֔/הּ תִּתֻּ֖ם חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/011.yaml
  text: Then set it empty on its coals[a], so that it may become hot and its bronze may glow, and its uncleanness within it may be melted, and its corrosion consumed.
translation:
  language: de
  text: Stell ihn dann leer auf seine Kohlen, damit er heiß wird und seine Bronze glüht, damit seine Unreinheit in ihm schmilzt und sein Rost[a] verzehrt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Korrosion“, „sein Schmutz“ oder „sein Abschaum“. Das hebräische Wort kann einen Belag oder Korrosion an Metall und in diesem Zusammenhang zugleich den widerwärtigen Rückstand bezeichnen, der für Jerusalems moralische Unreinheit steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמִידֶהָ
  choice: Dann stell den Topf
  rationale: Der Hifil-Imperativ von עמד mit femininem Suffix fordert dazu auf, das zuvor genannte Gefäß hinzustellen. Das ausdrückliche „den Topf“ ist im Deutschen klarer als ein bloßes Pronomen; „Dann“ gibt die Abfolge im Zusammenhang wieder.
- source_word: עַל גֶּחָלֶיהָ
  choice: auf seine glühenden Kohlen
  rationale: גֶּחָלִים bezeichnet Kohlen oder Glut. „Glühende Kohlen“ macht die zum Erhitzen nötige Glut natürlich und konkret verständlich; das Suffix wird auf den Topf beziehungsweise die ihm zugeordnete Feuerstelle bezogen.
- source_word: רֵקָה
  choice: leer
  rationale: Das feminine Adjektiv beschreibt den Topf nach dem Entfernen seines Inhalts.
- source_word: לְמַעַן תֵּחַם
  choice: damit er heiß wird
  rationale: Die Zweckkonstruktion mit חם beschreibt das Heißwerden des Gefäßes.
- source_word: וְחָרָה נְחֻשְׁתָּהּ
  choice: und sein Bronze-Metall glüht
  rationale: חָרָה bezeichnet hier das intensive Erhitzen. „glüht“ passt zu erhitztem Metall, ohne nahezulegen, dass das Metall selbst verbrennt. נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; „Bronze-Metall“ hält den traditionellen Werkstoffbezug fest und klingt bei einem Gefäß verständlich.
- source_word: וְנִתְּכָה בְתוֹכָהּ טֻמְאָתָהּ
  choice: damit seine Unreinheit in seinem Innern schmilzt
  rationale: נתך kann Schmelzen beziehungsweise Verflüssigen ausdrücken. „Unreinheit“ bewahrt neben dem stofflichen Bild auch die moralisch-kultische Bedeutung von טֻמְאָה.
- source_word: תִּתֻּם חֶלְאָתָהּ
  choice: und sein Rost verzehrt wird
  rationale: תִּתֻּם bezeichnet das vollständige Zu-Ende-Gehen beziehungsweise Aufgebrauchtwerden. חֶלְאָה kann Rost, Korrosion, Schmutz oder Abschaum bezeichnen; „Rost“ erhält hier das Metallbild und bleibt anschaulich.
theological_decisions:
- issue: Das Bild des verschmutzten Metalltopfes bezeichnet zugleich Jerusalems moralische Unreinheit.
  choice: Die konkrete Sprache des Erhitzens, Schmelzens und Rosts wird mit dem theologisch aufgeladenen Wort „Unreinheit“ verbunden.
  alternative: Das Bild entweder vollständig kulinarisch mit „Abschaum“ oder abstrakt mit „Sünde“ beziehungsweise „Schuld“ wiederzugeben.
  rationale: Der hebräische Text lässt das reale Gefäßbild und seine prophetisch-symbolische Bedeutung zugleich bestehen. Die Übersetzung soll diese Spannung nicht zugunsten nur einer Ebene auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der gestuften Zweckfolge des Hebräischen, wird aber durch die Wiederholung von „damit“ im Deutschen klar gegliedert. Der Fußnotenmarker [a] steht unmittelbar bei dem mehrdeutigen Ausdruck „Rost“.
