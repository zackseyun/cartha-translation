revisions:
- from: Dann stell den Topf leer auf seine glühenden Kohlen, damit er heiß wird und sein Bronze-Metall glüht, damit seine Unreinheit in seinem Innern schmilzt und sein Rost[a] verzehrt wird.
  to: Stell ihn dann leer auf seine Kohlen, damit er heiß wird und seine Bronze glüht, damit seine Unreinheit in ihm schmilzt und sein Rost[a] verzehrt wird.
  rationale: Die Überarbeitung beseitigt die unidiomatische und sachlich redundante Verbindung „Bronze-Metall“, verzichtet auf die nicht ausdrücklich gesetzte Verstärkung „glühenden“ und folgt mit dem Pronomen der Ausdrucksweise des hebräischen Textes. Das mehrschichtige Gefäß- und Unreinheitsbild sowie die lexikalische Ambiguität von חֶלְאָה bleiben erhalten.
