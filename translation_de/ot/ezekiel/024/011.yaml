  source_fidelity: 'Der Entwurf gibt die Abfolge und das Bild des hebräischen Textes im Wesentlichen zutreffend wieder: das leere Gefäß wird auf seine Kohlen gesetzt, erhitzt, seine Unreinheit wird geschmolzen, und die חֶלְאָה wird aufgezehrt. „Glühende“ ergänzt jedoch eine im Ausgangstext nicht ausdrücklich vorhandene Bestimmung, und „Bronze-Metall“ ist keine sachgerechte Wiedergabe von נְחֻשְׁתָּהּ.'
  naturalness: „Bronze-Metall“ ist im modernen Standarddeutsch redundant und unnatürlich. Die pronominale Aufnahme des im Kontext bereits eingeführten Topfes („ihn“) ist zudem näher am hebräischen Suffix und vermeidet eine unnötige Wiederholung.
  terminology: „Bronze“ ist als kontextuell naheliegende Wiedergabe von נְחֹשֶׁת angemessen; eine Fußnote ist hierfür nicht erforderlich. „Unreinheit“ bewahrt die rituell-moralische Konnotation von טֻמְאָה. „Rost“ ist als Haupttextwahl für חֶלְאָה vertretbar, sofern die Fußnote die breitere Bedeutungsspanne einschließlich Korrosion und Abschaum ausweist.
  issues:
