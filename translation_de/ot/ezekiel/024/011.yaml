  - severity: low
    issue: „glühenden Kohlen“
    rationale: Das hebräische גֶּחָלִים bedeutet „Kohlen/Glut“, ohne das Adjektiv „glühend“ ausdrücklich zu setzen. „seine Kohlen“ ist ausreichend und vermeidet eine nicht notwendige Ausmalung.
  - severity: low
    issue: Explizites „den Topf“
    rationale: Der Topf ist aus dem Kontext eindeutig, im vorliegenden Vers steht jedoch ein Suffix. „Stell ihn dann …“ ist quellentreuer und im Deutschen flüssig.
