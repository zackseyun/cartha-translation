  text: וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/מִצְרָ֑יִם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/019.yaml
  text: Thus I will execute judgments on Egypt[a], and they will know that I am Yahweh.
translation:
  language: de
  text: So werde ich an Ägypten Gerichte vollstrecken, und sie werden erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: So werde ich … vollstrecken
  rationale: עשה bedeutet grundsätzlich »tun/machen«; mit שְׁפָטִים bezeichnet es idiomatisch das Vollstrecken von Gerichten. »So« gibt das וְ im Zusammenhang als folgernden Übergang wieder.
- source_word: שְׁפָטִים
  choice: Gerichte
  rationale: Der Plural bezeichnet im prophetischen Kontext richterliche Entscheidungen beziehungsweise Strafgerichte. »Gerichte« bewahrt die formale und prophetische Ausdrucksweise.
- source_word: בְּמִצְרָיִם
  choice: an Ägypten
  rationale: Die Präposition בְ ist örtlich mit »in« wiedergebbar, bezeichnet hier aber idiomatisch den Bereich beziehungsweise Empfänger des göttlichen Gerichtshandelns. »An Ägypten« ist im Deutschen natürlich und wahrt diese Spannung besser als das stärker deutende »gegen Ägypten«.
- source_word: וְיָדְעוּ
  choice: und sie werden erkennen
  rationale: Die für Hesekiel typische Erkenntnisformel bleibt erhalten. »Erkennen« gibt ידע in seinem offenbarenden und relationalen Gewicht angemessener wieder als bloßes »wissen«.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Die wiederkehrende Erkenntnisformel wird direkt wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. »Jahwe« gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. Die knappe Satzstruktur und die hesekieltypische Erkenntnisformel bleiben gewahrt.
