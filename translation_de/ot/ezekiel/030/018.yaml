  text: וּ/בִֽ/תְחַפְנְחֵס֙ חָשַׂ֣ךְ הַ/יּ֔וֹם בְּ/שִׁבְרִ/י שָׁם֙ אֶת מֹט֣וֹת מִצְרַ֔יִם וְ/נִשְׁבַּת בָּ֖/הּ גְּא֣וֹן עֻזָּ֑/הּ הִ֚יא עָנָ֣ן יְכַסֶּ֔/נָּה וּ/בְנוֹתֶ֖י/הָ בַּ/שְּׁבִ֥י תֵלַֽכְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/018.yaml
  text: And in Tahpanhes the day will grow dark when I break there the bars of Egypt[a], and the pride of her strength will cease in her. As for her, a cloud will cover her[b], and her daughters will go into captivity.
translation:
  language: de
  text: Und in Tachpanhes wird der Tag sich verfinstern, wenn ich dort die Jochstangen Ägyptens[a] zerbreche; und der Stolz ihrer Macht wird in ihr aufhören. Eine Wolke wird sie bedecken, und ihre Töchter[b] werden in die Gefangenschaft ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stangen Ägyptens“. Das hebräische Bild kann die tragenden Stützen der Macht oder Herrschaft Ägyptens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihre Töchter“. Gemeint sind im prophetischen Sprachgebrauch meist die von einer Stadt abhängigen Orte oder die umliegenden Siedlungen.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבִתְחַפְנְחֵס
  choice: Und in Tachpanhes
  rationale: Der Ortsname wird in einer im Deutschen geläufigen biblichen Form wiedergegeben; ב bezeichnet hier den Ort.
- source_word: חָשַׂךְ הַיּוֹם
  choice: wird der Tag sich verfinstern
  rationale: Die Formulierung bewahrt das Bild hereinbrechender Dunkelheit und gibt den hebräischen Verbalsinn natürlich wieder.
- source_word: בְּשִׁבְרִי שָׁם
  choice: wenn ich dort … zerbreche
  rationale: Der Infinitiv mit Suffix wird temporal wiedergegeben; שָׁם bleibt als Ortsbetonung erhalten.
- source_word: מֹטוֹת מִצְרַיִם
  choice: die Jochstangen Ägyptens
  rationale: מֹטוֹת kann Stangen beziehungsweise Jochstangen bezeichnen. Im Zusammenhang des gebrochenen Machtanspruchs bewahrt „Jochstangen“ die konkrete und politische Metapher.
- source_word: וְנִשְׁבַּת בָּהּ גְּאוֹן עֻזָּהּ
  choice: Dann wird der Stolz auf seine Stärke dort ein Ende haben
  rationale: Das Nifal von שבת bezeichnet das Aufhören. Das erste feminine Suffix wird räumlich auf Tachpanhes bezogen, während „seine“ bei Stärke die mögliche Rückbindung an das unmittelbar genannte Ägypten offenhält.
- source_word: הִיא עָנָן יְכַסֶּנָּה
  choice: Über die Stadt wird sich eine Wolke legen
  rationale: Die hervorgehobene feminine Referenz wird im Deutschen expliziert, um den Wechsel von Ägypten zur Stadt verständlich zu machen; das Wolkenbild bleibt unverändert.
- source_word: וּבְנוֹתֶיהָ
  choice: ihre Tochterstädte
  rationale: Wörtlich „ihre Töchter“; im prophetischen Sprachgebrauch sind damit abhängige Orte oder umliegende Siedlungen gemeint. „Tochterstädte“ bewahrt das Bild und vermittelt zugleich den Sinn.
- source_word: בַּשְּׁבִי תֵלַכְנָה
  choice: werden in die Gefangenschaft ziehen
  rationale: Die Wiedergabe erhält sowohl die Gefangenschaft als auch die im Verb ausgedrückte Bewegung der Deportation.
theological_decisions:
- issue: Bezug der femininen Formen in der zweiten Vershälfte
  choice: Die Ortsangabe בָּהּ sowie הִיא und die folgenden femininen Formen werden auf Tachpanhes als personifizierte Stadt bezogen; das Suffix in עֻזָּהּ kann dagegen auf das unmittelbar genannte Ägypten zurückweisen.
  alternative: Alle femininen Formen beziehen sich entweder durchgehend auf Tachpanhes oder auf das personifizierte Ägypten.
  rationale: Der Ortsname am Versanfang und die Rede von den „Töchtern“ sprechen für die Stadt als Bezugspunkt der letzten Sätze. Zugleich erlaubt der unmittelbare Anschluss von עֻזָּהּ an „Ägypten“ eine Rückbindung an Ägypten. Die Übersetzung wahrt diese Spannung, statt sämtliche Pronomen einem einzigen Referenten zuzuweisen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tachpanhes“ folgt der geläufigen deutschen Schreibweise. Die Satzstruktur bleibt bildhaft und relativ nah am Hebräischen, während unklare pronominale Bezüge nur so weit expliziert werden, wie es für verständliches Deutsch nötig ist.
