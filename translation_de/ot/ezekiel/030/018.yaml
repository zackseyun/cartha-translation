revisions:
- from: Und in Tachpanhes wird der Tag sich verfinstern, wenn ich dort die Jochstangen Ägyptens[a] zerbreche. Dann wird der Stolz auf seine Stärke dort ein Ende haben. Über die Stadt wird sich eine Wolke legen, und ihre Tochterstädte[b] werden in die Gefangenschaft ziehen.
  to: Und in Tachpanhes wird der Tag sich verfinstern, wenn ich dort die Jochstangen Ägyptens[a] zerbreche; und der Stolz ihrer Macht wird in ihr aufhören. Eine Wolke wird sie bedecken, und ihre Töchter[b] werden in die Gefangenschaft ziehen.
  rationale: Die Revision erhält die Metapher der Jochstangen und die Deportationsaussage, korrigiert aber die syntaktische Wiedergabe von „Stolz ihrer Macht“ und vermeidet eine unnötige Festlegung des umstrittenen pronominalen Bezugs auf die Stadt. Die Wiederaufnahme mit „sie/ihre“ wahrt die feminine Bildsprache des Hebräischen; die Fußnote erläutert „Töchter“, ohne den Haupttext zu interpretieren.
  reviewer_model: gpt-5.6-terra
