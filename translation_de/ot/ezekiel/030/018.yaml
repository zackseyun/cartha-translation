review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die zentralen Bilder sind zutreffend wiedergegeben. Die Explikation „über die Stadt“ legt jedoch einen in der hebräischen Formulierung nicht abschließend geklärten Bezug fest. Auch „Stolz auf seine Stärke“ verschiebt die hebräische Konstruktion „Stolz ihrer Stärke/Macht“ und der Wechsel zu „seine“ erzeugt einen nicht erforderlichen Referentenwechsel.
  naturalness: Das Deutsch ist überwiegend flüssig und würdig. „Der Stolz ihrer Macht wird in ihr aufhören“ ist zugleich idiomatisch genug und näher an der kompakten hebräischen Aussage als die vorliegende Umschreibung.
  terminology: „Tachpanhes“, „Jochstangen“, „Wolke“ und „in die Gefangenschaft ziehen“ sind angemessen. „Ihre Töchter“ sollte im Haupttext stehen bleiben; die Fußnote kann die idiomatische Bedeutung als abhängige Orte erläutern, ohne diese Deutung in den Text vorzuziehen.
  issues:
  - severity: medium
    issue: „Über die Stadt wird sich eine Wolke legen“ expliziert den Bezug der femininen Pronomen.
    rationale: Das hebräische הִיא ... יְכַסֶּנָּה verwendet feminine Formen; im Kontext ist Tahpanhes als Stadt plausibel, doch ein weiter gefasster Bezug auf das personifizierte Ägypten wird dadurch nicht eindeutig ausgeschlossen. Die deutsche Übersetzung sollte diese Auslegung nicht erzwingen.
  - severity: medium
    issue: „Dann wird der Stolz auf seine Stärke dort ein Ende haben“ verändert Konstruktion und Bezüge.
    rationale: גְּאוֹן עֻזָּהּ ist wörtlich der Stolz ihrer Stärke/Macht; „Stolz auf seine Stärke“ macht daraus eine andere syntaktische Beziehung. „Dann“ ist nicht erforderlich, und „dort“ ersetzt das feminine בָּהּ durch eine stärker festgelegte Ortsangabe.
  - severity: low
    issue: „Tochterstädte“ deutet den Ausdruck bereits im Haupttext aus.
    rationale: בְנוֹתֶיהָ lautet wörtlich „ihre Töchter“. Die kulturell-prophetische Bedeutung kann, wie vorgesehen, in der Fußnote erklärt werden.
