  text: וַ/הֲשִׁמֹּתִי֙ אֶת פַּתְר֔וֹס וְ/נָתַ֥תִּי אֵ֖שׁ בְּ/צֹ֑עַן וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/נֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/014.yaml
  text: I will make Pathros desolate[a], and I will set fire in Zoan[c][b], and I will execute judgments on No.
translation:
  language: de
  text: Ich werde Patros verwüsten[a], in Zoan ein Feuer anzünden[b] und an No Strafgerichte vollstrecken[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Patros zur Einöde machen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Zoan Feuer legen“. Wörtlich: „in Zoan Feuer geben“.'
    reason: lexical_alternative
  - marker: c
    text: No ist die ägyptische Stadt, die auch als Theben bekannt ist.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: Ich werde … verwüsten
  rationale: Das kausative Verb von שׁמם bezeichnet, dass ein Ort wüst oder verwüstet gemacht wird. „Verwüsten“ gibt die bewirkte Verödung in natürlichem, würdigem Deutsch wieder.
- source_word: פַּתְרוֹס
  choice: Patros
  rationale: Der ägyptische Orts- beziehungsweise Regionsname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וְנָתַתִּי אֵשׁ
  choice: Feuer legen
  rationale: Wörtlich steht „Feuer geben“. Die idiomatische Wendung meint das Herbeiführen eines zerstörerischen Brandes; „Feuer legen“ bewahrt die direkte göttliche Verursachung und klingt im Deutschen natürlich.
- source_word: בְּצֹעַן
  choice: in Zoan
  rationale: Die Präposition בְּ bezeichnet hier am naheliegendsten den Ort des Brandes. „Zoan“ ist die etablierte deutsche Form des Ortsnamens.
- source_word: וְעָשִׂיתִי שְׁפָטִים
  choice: Strafgerichte vollstrecken
  rationale: Die hebräische Verbindung „Gerichte tun“ bezeichnet konkrete richterliche, hier strafende Handlungen. „Strafgerichte vollstrecken“ erhält sowohl den gerichtlichen als auch den vollziehenden Sinn.
- source_word: בְּנֹא
  choice: an No
  rationale: Bei „Strafgerichte vollstrecken“ kennzeichnet „an“ im Deutschen idiomatisch die Stadt als Ziel der gerichtlichen Handlungen, ohne die hebräische Präposition unnötig räumlich festzulegen.
theological_decisions:
- issue: Art des göttlichen Handelns in der Gerichtsankündigung
  choice: 'Die Verben werden als unmittelbare Handlungen Gottes wiedergegeben: „Ich werde … verwüsten“, „Feuer legen“ und „Strafgerichte vollstrecken“.'
  alternative: Die Aussagen so abschwächen, dass Gott das Unheil lediglich zulässt.
  rationale: Der hebräische Text stellt den göttlichen Sprecher ausdrücklich als handelndes Subjekt dar. Diese theologische Spannung darf nicht durch eine permissive Umschreibung aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die drei parallelen göttlichen Handlungen bleiben knapp und unmittelbar; die Eigennamen werden in gängigen deutschen Bibelformen wiedergegeben.
