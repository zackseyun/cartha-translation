base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/017.yaml
  text: The young men of Aven and Pi-beseth will fall by the sword[b][a], and these cities will go into captivity.
translation:
  language: de
  text: Die jungen Männer von Awen[a] und Pi-Beset[b] werden durch das Schwert fallen, und diese Städte werden in die Gefangenschaft ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Awen bezeichnet wahrscheinlich On, also Heliopolis in Ägypten.
    reason: alternative_reading
  - marker: b
    text: Pi-Beset wird gewöhnlich mit Bubastis gleichgesetzt.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּח֥וּרֵי
  choice: die jungen Männer von
  rationale: בַּחוּרִים bezeichnet gewöhnlich junge Männer im kräftigen Alter. Die Wiedergabe passt zum Zusammenhang von Krieg und Gericht, ohne eine besondere Elitetruppe vorauszusetzen.
- source_word: אָ֛וֶן
  choice: Awen
  rationale: Der Ortsname wird in einer dem Hebräischen entsprechenden deutschen Form wiedergegeben. Die wahrscheinliche Gleichsetzung mit On beziehungsweise Heliopolis wird in einer Fußnote genannt.
- source_word: וּ/פִי בֶ֖סֶת
  choice: und Pi-Beset
  rationale: Der hebräische Ortsname wird transliteriert; die verbreitete historische Identifizierung mit Bubastis bleibt in einer Fußnote erhalten.
- source_word: בַּ/חֶ֣רֶב
  choice: durch das Schwert
  rationale: Die Formulierung bewahrt den instrumentalen Sinn und die im Zusammenhang von Krieg und Gericht übliche Schwertmetaphorik.
- source_word: יִפֹּ֑לוּ
  choice: werden fallen
  rationale: נפל bedeutet wörtlich „fallen“ und bezeichnet hier den Tod im Kampf. Die deutsche Wiedergabe erhält dieses Bild.
- source_word: וְ/הֵ֖נָּה
  choice: und diese Städte
  rationale: Das feminine Pluralpronomen verweist auf die beiden zuvor genannten Städte. Der Bezug wird im Deutschen zur Klarheit ausdrücklich genannt.
- source_word: בַּ/שְּׁבִ֥י
  choice: in die Gefangenschaft
  rationale: Das Substantiv bezeichnet den Zustand der Gefangenschaft beziehungsweise Verschleppung. Die gewählte Formulierung ist direkt und wahrt die hebräische Konstruktion.
- source_word: תֵלַֽכְנָה
  choice: werden gehen
  rationale: הלך bedeutet grundsätzlich „gehen“. Zusammen mit „in die Gefangenschaft“ bezeichnet es die bevorstehende Verschleppung, ohne das Verb unnötig zu spezifizieren.
theological_decisions: []
