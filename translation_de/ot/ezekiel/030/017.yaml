  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. Die Ortsnamen folgen den hebräischen Formen; historische Identifizierungen stehen in den Fußnoten. Der feminine Rückverweis wird zur natürlichen deutschen Verständlichkeit als „diese Städte“ verdeutlicht.
