  text: וַ/הֲפִצוֹתִ֥י אֶת מִצְרַ֖יִם בַּ/גּוֹיִ֑ם וְ/זֵרִיתִ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/023.yaml
  text: And I will scatter Egypt among the nations[a], and I will disperse them among the lands.
translation:
  language: de
  text: Und ich werde Ägypten unter die Völker zerstreuen[a] und sie über die Länder verstreuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht im ersten Satzteil „Ägypten“, im zweiten dagegen „sie“; der Ländername steht für seine Bevölkerung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: Und ich werde … zerstreuen
  rationale: Die Hifil-Form von פוץ bezeichnet ein bewirktes Zerstreuen. „Ich werde … zerstreuen“ gibt Gottes Handeln natürlich und präzise wieder; das anlautende וַ wird mit „Und“ aufgenommen.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der hebräische Text nennt den Ländernamen „Ägypten“. Er steht hier metonymisch für seine Bevölkerung; die Bezeichnung wird beibehalten, statt sie erklärend in „die Ägypter“ aufzulösen.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: גּוֹיִם bedeutet hier „Völker“ beziehungsweise „Nationen“. In Verbindung mit einem Verb des Zerstreuens bringt „unter die Völker“ die Zielrichtung der Verbannung idiomatisch zum Ausdruck.
- source_word: וְזֵרִיתִם
  choice: und sie … verstreuen
  rationale: זרה bedeutet „streuen, zerstreuen“ und kann auch das Worfeln bezeichnen. „Verstreuen“ wahrt die Variation zum ersten Verb und gibt das pluralische Suffix ausdrücklich mit „sie“ wieder.
- source_word: בָּאֲרָצוֹת
  choice: über die Länder
  rationale: Der Plural אֲרָצוֹת bezeichnet verschiedene Länder. „Über die Länder“ drückt die weiträumige Verteilung im Deutschen natürlich aus und entspricht dem Kontext der Zerstreuung.
theological_decisions:
- issue: Wechsel vom Ländernamen „Ägypten“ zum pluralischen Suffix „sie“
  choice: „Ägypten“ im ersten Satzglied beibehalten und das pluralische Suffix im zweiten mit „sie“ wiedergeben.
  alternative: Durchgehend „die Ägypter“ verwenden.
  rationale: Der hebräische Text verbindet den Ländernamen mit einem späteren Pluralpronomen und lässt so Ägypten für seine Bevölkerung stehen. Die Übersetzung bewahrt diesen metonymischen Wechsel, statt ihn stillschweigend zu glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verben „zerstreuen“ und „verstreuen“ bilden die hebräische Variation ab; „unter die Völker“ und „über die Länder“ lesen sich idiomatisch und bewahren die räumliche Bewegung.
