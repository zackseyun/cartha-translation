  source_fidelity: 'Der Entwurf gibt die hebräische Datierungsformel vollständig und in ihrer Reihenfolge wieder: elftes Jahr, erster Monat, siebter Tag des Monats. „Das Wort Jahwes erging an mich“ entspricht der prophetischen Formel הָיָה דְבַר־יְהוָה אֵלַי idiomatisch und sachgerecht. Die einleitende Funktion von וַיְהִי ist im deutschen, datierten Hauptsatz hinreichend aufgenommen; ein zusätzliches „Und es geschah“ wäre möglich, aber für modernes Deutsch nicht erforderlich.'
