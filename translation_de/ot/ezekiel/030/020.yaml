id: EZK.30.20
reference: Ezekiel 30:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/שִׁבְעָ֣ה לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/020.yaml
  text: And it happened in the eleventh year, in the first month, on the seventh day of the month, that the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Im elften Jahr, im ersten Monat, am siebten Tag des Monats, erging das Wort Jahwes an mich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Im elften Jahr … erging
  rationale: Das narrative וַיְהִי eröffnet hier eine datierte prophetische Mitteilung. Im Deutschen lässt sich seine Eröffnungsfunktion natürlich durch die vorangestellte Zeitangabe und das Hauptverb „erging“ wiedergeben; ein zusätzliches „Und es geschah“ wäre möglich, aber schwerfälliger.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: im elften Jahr
  rationale: Die hebräische Kardinalzahlkonstruktion bezeichnet idiomatisch das elfte Jahr; die deutsche Ordinalform ist die natürliche Entsprechung.
- source_word: בָּרִאשׁוֹן
  choice: im ersten Monat
  rationale: „Im ersten“ steht in der Datierungsformel substantivisch und meint den ersten Monat. Das im Hebräischen vorausgesetzte Substantiv wird zur Klarheit ergänzt.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: am siebten Tag des Monats
  rationale: Die hebräische Datierungsformel bedeutet den siebten Tag des Monats. Die ausgeschriebene deutsche Form ist klar und präzise.
- source_word: הָיָה דְבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: Die feste prophetische Formel wird im Deutschen idiomatisch und würdevoll mit „das Wort … erging an“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen etablierte Form.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit „erging“ ist „an mich“ die natürliche deutsche Wiedergabe der Zielrichtung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im heutigen Deutschen natürlicher als das wörtliche „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt seinen Charakter als Eigenname und entspricht der etablierten deutschen Transliteration, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Datierungsformel bleibt erhalten; der Doppelpunkt zeigt an, dass die Botschaft im folgenden Vers beginnt.
