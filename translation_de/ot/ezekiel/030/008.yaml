source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ/י אֵ֣שׁ בְּ/מִצְרַ֔יִם וְ/נִשְׁבְּר֖וּ כָּל עֹזְרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/008.yaml
  text: Then they will know that I am Yahweh[a], when I set fire to Egypt and all her helpers are broken.
translation:
  language: de
  text: Dann werden sie erkennen, dass ich Jahwe bin, wenn ich in Ägypten Feuer entfache und alle seine Helfer[a] zerschlagen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine Verbündeten«. Wörtlich steht im Hebräischen »alle seine Helfer«; gemeint sein können Völker oder Streitkräfte, die Ägypten unterstützen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Das einleitende וְ kann schlicht »und« bedeuten; im Zusammenhang bezeichnet es jedoch die Folge des angekündigten Gerichts. »Dann« gibt diesen Zusammenhang natürlich wieder. Für ידע ist hier »erkennen« im Sinn eines durch das Geschehen gewonnenen Wissens passend.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was erkannt werden wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתִתִּי אֵשׁ בְּמִצְרַיִם
  choice: wenn ich in Ägypten Feuer lege
  rationale: Die Präposition בְּ am Infinitiv bezeichnet den zeitlichen Umstand; בְּמִצְרַיִם ist örtlich zu verstehen. Die Formulierung »Feuer legen« ist im Deutschen idiomatisch und wahrt das Bild des hebräischen Textes.
- source_word: וְנִשְׁבְּרוּ
  choice: und … zerschlagen werden
  rationale: Der Nifal von שׁבר bezeichnet ein Zerbrechen oder Zerschlagen. Auf Helfer beziehungsweise unterstützende Mächte bezogen ist »zerschlagen werden« natürlich und bewahrt die Gerichtssprache.
- source_word: כָּל עֹזְרֶיהָ
  choice: alle seine Helfer
  rationale: עֹזְרֶיהָ bedeutet wörtlich »ihre Helfer«. Da »Ägypten« im Deutschen grammatisch sächlich ist, lautet der Rückbezug »seine«; »Helfer« hält die mögliche Bezugnahme auf verbündete Völker, Truppen oder sonstige Unterstützer offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch den Titel »HERR« zu ersetzen.
- issue: Identität der Helfer Ägyptens
  choice: Helfer
  alternative: Verbündete
  rationale: Der Text nennt sie allgemein »Helfer«. Im geschichtlichen Zusammenhang können damit Verbündete oder unterstützende Streitkräfte gemeint sein; diese Deutung wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der prophetischen Folge von Gericht und Erkenntnis. Die personifizierende Rede von Ägyptens »Helfern« bleibt erhalten, während das grammatische Geschlecht im Deutschen angepasst wird.
