source:
  edition: WLC
  text: כִּֽי קָר֣וֹב י֔וֹם וְ/קָר֥וֹב י֖וֹם לַֽ/יהוָ֑ה י֣וֹם עָנָ֔ן עֵ֥ת גּוֹיִ֖ם יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/003.yaml
  text: For the day is near[a], yes, the day of Yahweh is near; it will be a day of clouds[c][b], a time of nations.
translation:
  language: de
  text: Denn der Tag ist nahe, ja, der Tag Jahwes ist nahe[a]; ein Tag der Wolke[b] wird er sein, eine Zeit der Völker.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Tag Jahwes“ ist eine prophetische Bezeichnung für einen Tag, an dem Jahwe eingreift, hier im Zusammenhang des Gerichts.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „ein Tag der Wolke“; der hebräische Ausdruck steht im Singular.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „eine Zeit für die Völker“. Der knappe hebräische Ausdruck bezeichnet eine entscheidende Zeit, die die Völker betrifft, ohne die genaue Beziehung näher festzulegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Klageruf ein und bewahrt den Zusammenhang, ohne die Verknüpfung unnötig zu verstärken.
- source_word: קָרוֹב יוֹם
  choice: der Tag ist nahe
  rationale: Gibt die prädikative Aussage über das unmittelbar bevorstehende Geschehen in natürlichem Deutsch wieder.
- source_word: וְקָרוֹב יוֹם לַיהוָה
  choice: ja, der Tag Jahwes ist nahe
  rationale: Das wiederholte קָרוֹב יוֹם wirkt nachdrücklich. „Ja“ bringt diese Verstärkung idiomatisch zum Ausdruck; לַיהוָה bezeichnet hier die Beziehung des Tages zu Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des ausdrücklich stehenden Gottesnamens bewahrt dessen Eigenname-Charakter.
- source_word: יוֹם עָנָן
  choice: ein Tag der Wolken
  rationale: Bewahrt das knappe Bild des hebräischen Ausdrucks und klingt zugleich natürlich; die Wolken tragen im Zusammenhang einen unheilvollen Charakter, ohne dass dieser erklärend in den Text eingefügt wird.
- source_word: עֵת גּוֹיִם
  choice: eine Zeit der Völker
  rationale: Die Genitivfügung hält die knappe und mehrdeutige Beziehung zu den Völkern offen, statt sie ausdrücklich als Zeit „für“ oder „gegen“ sie festzulegen.
- source_word: יִהְיֶה
  choice: wird es sein
  rationale: Gibt die zukünftige Kopula wieder und bezieht sie verständlich auf den angekündigten Tag.
theological_decisions:
- issue: Prophetische Wendung יוֹם לַיהוָה
  choice: der Tag Jahwes
  alternative: der Tag des HERRN; ein Jahwe gehörender Tag
  rationale: Der Eigenname steht im Ausgangstext ausdrücklich. Die Formulierung wahrt die bekannte prophetische Wendung, ohne bereits im Haupttext zu erklären, welche konkrete Gestalt das göttliche Eingreifen annimmt.
- issue: Bedeutung von עֵת גּוֹיִם
  choice: eine Zeit der Völker
  alternative: eine Zeit für die Völker; die Zeit der Völker
  rationale: Der hebräische Ausdruck ist knapp und ohne Artikel. Die gewählte Fassung bewahrt sowohl die Unbestimmtheit als auch die offene Frage, ob eine Zeit über, für oder hinsichtlich der Völker gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Tag“ und „nahe“ bleibt als rhetorischer Nachdruck erhalten. „Völker“ vermeidet die moderne staatsrechtliche Engführung von „Nationen“ und entspricht hier dem üblichen prophetischen Sprachgebrauch.
