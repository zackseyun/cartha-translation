reference: Ezekiel 30:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַחֲזַקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וּ/זְרֹע֥וֹת פַּרְעֹ֖ה תִּפֹּ֑לְנָה וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בְּ/תִתִּ֤/י חַרְבִּ/י֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/נָטָ֥ה אוֹתָ֖/הּ אֶל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/025.yaml
  text: I will strengthen the arms of the king of Babylon[a], but Pharaoh’s arms will fall. Then they will know that I am Yahweh[b], when I put my sword into the hand of the king of Babylon and he stretches it out against the land of Egypt.
translation:
  language: de
  text: Ich werde die Arme des Königs von Babylon stärken, doch die Arme des Pharaos werden fallen.[a] Dann werden sie erkennen, dass ich Jahwe bin,[b] wenn ich mein Schwert in die Hand des Königs von Babylon gebe und er es gegen das Land Ägypten ausstreckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden versagen“. Wörtlich steht im Hebräischen „werden fallen“; damit bleibt das Bild eines militärischen Zusammenbruchs erhalten.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit „der HERR“ wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲזַקְתִּי
  choice: Ich werde … stärken
  rationale: Der Hifil von חזק bezeichnet hier das Verleihen von Stärke. „Stärken“ ist im Deutschen natürlich und bewahrt den Kontrast zum Zusammenbruch der Macht des Pharaos.
- source_word: זְרֹעוֹת
  choice: die Arme
  rationale: Die konkrete Körpermetapher des Hebräischen wird beibehalten; sie steht hier zugleich für militärische Kraft und Handlungsfähigkeit.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Die Konstruktverbindung wird direkt und in modernem Standarddeutsch wiedergegeben.
- source_word: וּזְרֹעוֹת פַּרְעֹה תִּפֹּלְנָה
  choice: doch die Arme des Pharaos werden fallen
  rationale: „Doch“ macht den sachlich adversativen Gegensatz zur Stärkung Babylons deutlich. „Fallen“ bewahrt das anschauliche Verb נפל und deutet die Metapher nicht vorschnell als bloßes Versagen aus.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: „Dann“ gibt die Folge der zuvor angekündigten Machttaten idiomatisch wieder; „erkennen“ trägt dem gewichtigen Erkenntnismotiv der Formel Rechnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ בָּבֶל
  choice: wenn ich mein Schwert in die Hand des Königs von Babylon gebe
  rationale: נתן kann „geben“ oder „legen“ bedeuten. Die gewählte Formulierung ist natürlich und bewahrt das Bild, dass der babylonische König Gottes Gerichtswerkzeug erhält.
- source_word: חַרְבִּי
  choice: mein Schwert
  rationale: Das konkrete Bild für Jahwes Gerichtsmacht bleibt unverändert erhalten.
- source_word: וְנָטָה אוֹתָהּ
  choice: und er es … ausstreckt
  rationale: נטה bedeutet hier „ausstrecken/ausrichten“. Das Pronomen wird eindeutig auf das Schwert bezogen, ohne das markante prophetische Bild durch „führen“ oder „einsetzen“ aufzulösen.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: gegen das Land Ägypten
  rationale: אֶל bezeichnet grundsätzlich die Richtung; im feindlichen militärischen Zusammenhang gibt „gegen“ die beabsichtigte Stoßrichtung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Babylon als Werkzeug des göttlichen Gerichts
  choice: Jahwe gibt sein Schwert in die Hand des Königs von Babylon
  alternative: eine allgemeinere Formulierung, die das instrumentale Verhältnis abschwächt
  rationale: Der Text verbindet Jahwes eigenes Schwert ausdrücklich mit der Hand des babylonischen Königs. Die Übersetzung wahrt sowohl Jahwes Urheberschaft am angekündigten Gericht als auch das Handeln des Königs, ohne darüber hinausgehende Aussagen einzutragen.
- issue: Bezug von וְנָטָה („und er wird ausstrecken“)
  choice: Der König von Babylon streckt das Schwert aus
  alternative: Jahwe streckt das Schwert aus
  rationale: Das nächstliegende Subjekt ist der unmittelbar zuvor genannte König von Babylon; das feminine Objektpronomen bezieht sich auf חֶרֶב („Schwert“), das im Hebräischen feminin ist. Zugleich bleibt durch „mein Schwert“ Jahwes übergeordnete Gerichtsvollmacht sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrten Körper- und Schwertmetaphern. Der Satzbau folgt der hebräischen Gedankenfolge, bleibt aber flüssig. „Babylon“ ist für heutige Leser geläufiger als das in manchen deutschen Bibeltraditionen verwendete „Babel“.
