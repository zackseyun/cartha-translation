  text: וְ/נָשַׁ֕מּוּ בְּ/ת֖וֹךְ אֲרָצ֣וֹת נְשַׁמּ֑וֹת וְ/עָרָ֕י/ו בְּ/תוֹךְ עָרִ֥ים נַחֲרָב֖וֹת תִּֽהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/007.yaml
  text: They will be desolated among desolated lands[a], and its cities will be among ruined cities.
translation:
  language: de
  text: Sie werden inmitten verwüsteter Länder verwüstet sein, und seine Städte werden inmitten zerstörter Städte sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: sie werden verwüstet sein
  rationale: Der Niphal von שׁמם bezeichnet hier den eingetretenen Zustand der Verwüstung. Die Formulierung bewahrt sowohl den passiven/resultativen Sinn als auch die Zukunftsaussage.
- source_word: בְּתוֹךְ
  choice: unter
  rationale: בְּתוֹךְ bezeichnet die Lage inmitten einer Gruppe. „Unter“ ist im modernen Deutschen knapp und natürlich; die räumlich ausdrücklichere Wiedergabe steht in der Fußnote.
- source_word: אֲרָצוֹת נְשַׁמּוֹת
  choice: verwüsteten Ländern
  rationale: אֲרָצוֹת meint hier Länder oder Gebiete. „Verwüstet“ erhält die bewusste Wortverbindung zur vorangehenden Form desselben Stammes שׁמם.
- source_word: וְעָרָיו
  choice: und seine Städte
  rationale: Das Suffix der dritten Person Maskulinum Singular verweist auf den zuvor genannten singularischen Bezug, im Kontext Ägypten. „Seine“ bewahrt diesen auffälligen Wechsel vom pluralischen Verb zum singularischen Possessivbezug.
- source_word: עָרִים נַחֲרָבוֹת
  choice: zerstörten Städten
  rationale: נַחֲרָבוֹת beschreibt Städte als verheert oder in Trümmer gelegt. „Zerstört“ ist verständlich und unterscheidet den Stamm חרב sprachlich von שׁמם.
- source_word: תִּהְיֶינָה
  choice: werden … sein
  rationale: Die feminine Pluralform von היה stimmt mit „Städte“ überein und wird als schlichte zukünftige Zustandsaussage wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Hebräischen auffällige Wiederholung von שׁמם wird durch „verwüstet … verwüsteten“ bewahrt; ebenso bleibt der Wechsel zwischen pluralischem „sie“ und singularischem „seine“ sichtbar, ohne den Bezug stillschweigend zu glätten.
