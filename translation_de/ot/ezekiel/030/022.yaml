source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנְ/נִי֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וְ/שָֽׁבַרְתִּי֙ אֶת זְרֹ֣עֹתָ֔י/ו אֶת הַ/חֲזָקָ֖ה וְ/אֶת הַ/נִּשְׁבָּ֑רֶת וְ/הִפַּלְתִּ֥י אֶת הַ/חֶ֖רֶב מִ/יָּדֽ/וֹ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/022.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against Pharaoh king of Egypt, and I will break his arms, both the strong one and the broken one, and I will make the sword fall from his hand.'
translation:
  language: de
  text: 'Darum spricht der Herr Yahweh: Siehe, ich stelle mich gegen den Pharao, den König von Ägypten. Ich werde seine Arme brechen, sowohl den starken als auch den gebrochenen[a], und das Schwert aus seiner Hand fallen lassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den starken und den gebrochenen“. Die beiden femininen Singularformen beziehen sich jeweils auf einen der zuvor genannten Arme.'
    reason: Die knappe hebräische Form lässt „Arm“ bei beiden Bezeichnungen unausgesprochen und sagt nicht ausdrücklich, wann der eine Arm gebrochen wurde.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Gerichtsankündigung und klingt im modernen Deutschen natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feierliche prophetische Botenformel in einer geläufigen deutschen Wendung.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne beide zu einem einzigen Titel zu verschmelzen.
- source_word: הִנְנִי אֶל
  choice: Siehe, ich stelle mich gegen
  rationale: „Siehe“ erhält den nachdrücklichen prophetischen Hinweis; „ich stelle mich gegen“ bringt die feindliche Ausrichtung von אֶל in diesem Zusammenhang idiomatisch zum Ausdruck.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: den Pharao, den König von Ägypten
  rationale: Die Apposition wird im Deutschen durch Kommas klar und natürlich wiedergegeben.
- source_word: וְשָׁבַרְתִּי אֶת זְרֹעֹתָיו
  choice: Ich werde seine Arme brechen
  rationale: Bewahrt das konkrete Bild der Arme als Sinnbild militärischer Kraft und setzt den hebräischen Verbalsatz als eigenständigen deutschen Satz fort.
- source_word: אֶת הַחֲזָקָה וְאֶת הַנִּשְׁבָּרֶת
  choice: den starken ebenso wie den gebrochenen
  rationale: Die beiden femininen Singularformen werden auf jeweils einen der zuvor genannten Arme bezogen. Die Formulierung erhält die Spannung, dass sogar der schon gebrochene Arm nochmals Gegenstand des Gerichts ist, ohne den zeitlichen Aspekt ausdrücklich auszudeuten.
- source_word: וְהִפַּלְתִּי אֶת הַחֶרֶב מִיָּדוֹ
  choice: und das Schwert aus seiner Hand fallen lassen
  rationale: Gibt den Kausativ von נפל natürlich wieder und bewahrt das anschauliche Bild des Macht- und Waffenverlusts.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung macht sowohl den Titel „Herr“ als auch den im Ausgangstext stehenden Gottesnamen sichtbar; die Alternative folgt einer verbreiteten deutschen Ersatzlesung, verdeckt jedoch den Eigennamen.
- issue: Bezug der starken und der gebrochenen Form
  choice: jeweils auf einen von Pharaos Armen bezogen
  alternative: abstrakt auf Pharaos gesamte Stärke bezogen
  rationale: Genus und Numerus der hebräischen Formen verweisen grammatisch auf זְרוֹעַ „Arm“. Das konkrete Bild soll deshalb nicht vorschnell in eine abstrakte Aussage aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „So spricht“ und das aufmerksamkeitslenkende „Siehe“ erhalten den feierlichen Ton; die übrige Syntax bleibt klar und gegenwärtig.
