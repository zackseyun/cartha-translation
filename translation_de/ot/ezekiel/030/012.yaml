id: EZK.30.12
reference: Ezekiel 30:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י יְאֹרִים֙ חָֽרָבָ֔ה וּ/מָכַרְתִּ֥י אֶת הָ/אָ֖רֶץ בְּ/יַד רָעִ֑ים וַ/הֲשִׁמֹּתִ֞י אֶ֤רֶץ וּ/מְלֹאָ/הּ֙ בְּ/יַד זָרִ֔ים אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/012.yaml
  text: And I will make the Nile channels dry[a], and I will sell the land into the hand of evil men; and I will devastate the land and its fullness by the hand of foreigners. I am Yahweh[c][b]; I have spoken.
translation:
  language: de
  text: Und ich werde die Nilarme austrocknen[a] und das Land in die Hand böser Menschen verkaufen[b]. Ich werde das Land und alles, was es erfüllt[c], durch die Hand von Fremden verwüsten. Ich, Jahwe, habe gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kanäle“ oder „die Flüsse“; im ägyptischen Zusammenhang sind wahrscheinlich die Wasserläufe des Nils gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „das Land ausliefern“; das hebräische Verb bedeutet wörtlich „verkaufen“ und beschreibt hier die Übergabe an eine feindliche Macht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Land und alles, was darin ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרִים
  choice: Nilarme
  rationale: Im ägyptischen Zusammenhang bezeichnet der Plural die Wasserläufe beziehungsweise Verzweigungen des Nils; „Nilarme“ ist präzise und natürlich.
- source_word: חָרָבָה
  choice: austrocknen
  rationale: Mit נתן bezeichnet das Wort hier das Trockenlegen der Wasserläufe; die verbale Wiedergabe ist im Deutschen idiomatisch.
- source_word: וּמָכַרְתִּי
  choice: verkaufen
  rationale: Die wörtliche Bedeutung des Verbs bleibt als eindringliches Gerichtsbild erhalten; gemeint ist die Auslieferung an feindliche Gewalt.
- source_word: בְּיַד רָעִים
  choice: in die Hand böser Menschen
  rationale: Bewahrt sowohl das hebräische Machtidiom „in die Hand“ als auch den substantivischen Sinn des maskulinen Plurals.
- source_word: וַהֲשִׁמֹּתִי
  choice: verwüsten
  rationale: Gibt die kausative Bedeutung des Hifil von שמם in würdigem, modernem Deutsch wieder.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: das Land und alles, was es erfüllt
  rationale: Bewahrt das Bild der „Fülle“ des Landes, bleibt aber verständlicher als das im Deutschen ungewöhnliche „seine Fülle“.
- source_word: בְּיַד זָרִים
  choice: durch die Hand von Fremden
  rationale: Die Hand-Metapher wird entsprechend dem Hebräischen wiederholt; זָרִים bezeichnet hier fremde Eindringlinge beziehungsweise Ausländer.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Entspricht der prophetischen Schlussformel und unterstreicht die Gewissheit des angekündigten Gerichts.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen; „Jahwe“ bewahrt diese Funktion.
- issue: Das Bild des Verkaufens
  choice: das Land verkaufen
  alternative: das Land ausliefern
  rationale: „Verkaufen“ wahrt das konkrete und theologisch spannungsreiche Gerichtsbild des hebräischen Verbs, während eine Fußnote dessen übertragene Bedeutung erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Hand-Formulierungen und das markante Gerichtsbild des Verkaufens bleiben erhalten; schwer verständliche Wörtlichkeit wird durch knappe Fußnoten aufgefangen.
