  source_fidelity: Die Übersetzung gibt die Abfolge der drei göttlichen Gerichtshandlungen und die hebräischen Machtidiome zuverlässig wieder. „Nilarme“ ist im ägyptischen Kontext für יְאֹרִים gut begründet; „verkaufen“ bewahrt die bildhafte, wörtliche Kraft von מכר. „Ich, Jahwe, habe gesprochen“ entspricht der emphatischen Schlussformel אָנִי יְהוָה דִּבַּרְתִּי.
  naturalness: Modernes, würdiges Standarddeutsch. Die Formulierungen sind klar und behalten den bewusst gehobenen prophetischen Registerton bei. „Durch die Hand von Fremden“ ist leicht formal, aber als absichtliche Wiedergabe des wiederholten hebräischen Handidioms verständlich und vertretbar.
  terminology: „Jahwe“ gibt den Gottesnamen als Eigennamen wieder. „Böse Menschen“, „Fremde“ und „verwüsten“ sind semantisch angemessene und nicht unnötig spezifizierende Entsprechungen. Die Fußnoten erläutern die wesentlichen lexikalischen Alternativen, ohne den Text zu überladen.
