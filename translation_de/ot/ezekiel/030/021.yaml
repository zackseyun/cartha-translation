source:
  edition: WLC
  text: בֶּן אָדָ֕ם אֶת זְר֛וֹעַ פַּרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם שָׁבָ֑רְתִּי וְ/הִנֵּ֣ה לֹֽא חֻ֠בְּשָׁה לָ/תֵ֨ת רְפֻא֜וֹת לָ/שׂ֥וּם חִתּ֛וּל לְ/חָבְשָׁ֥/הּ לְ/חָזְקָ֖/הּ לִ/תְפֹּ֥שׂ בֶּ/חָֽרֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/021.yaml
  text: Son of man[a], I have broken the arm of Pharaoh king of Egypt, and behold, it has not been bound up to apply remedies, to put on a bandage, to bind it, to strengthen it so that it may grasp the sword.
translation:
  language: de
  text: Menschensohn, ich habe den Arm des Pharaos, des Königs von Ägypten, gebrochen. Siehe, er ist nicht verbunden worden, um Heilmittel anzuwenden, eine Binde anzulegen, ihn zu verbinden und zu stärken, damit er das Schwert ergreifen kann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische, wiederkehrende Anrede und ist im Deutschen als biblischer Ausdruck verständlich.
- source_word: זְרוֹעַ
  choice: Arm
  rationale: Die konkrete Körperbezeichnung erhält das Bild eines gebrochenen Arms; die politische und militärische Bedeutung erschließt sich aus dem Zusammenhang.
- source_word: שָׁבָרְתִּי
  choice: ich habe … gebrochen
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung, deren Folge – der unbehandelte gebrochene Arm – fortbesteht.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Gibt den hervorhebenden, Aufmerksamkeit weckenden Diskursmarker unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: חֻבְּשָׁה
  choice: ist nicht verbunden worden
  rationale: Erhält die passive Form und das medizinische Bild, ohne das nachfolgende Substantiv für die Binde vorwegzunehmen.
- source_word: לָתֵת רְפֻאוֹת
  choice: um Heilmittel anzuwenden
  rationale: Der Plural רְפֻאוֹת bezeichnet hier heilende Mittel oder Behandlungen für den gebrochenen Arm; „anwenden“ entspricht im Deutschen dem medizinischen Vorgang.
- source_word: חִתּוּל
  choice: eine Binde
  rationale: Bezeichnet eine Umhüllung beziehungsweise einen Verband; „Binde“ ist konkret und lässt sich natürlich mit „anlegen“ verbinden.
- source_word: לְחָבְשָׁהּ
  choice: ihn zu umwickeln
  rationale: Gibt die erneute verbale Beschreibung des Verbindens wieder und vermeidet im Deutschen eine schwerfällige unmittelbare Wiederholung von „verbinden“.
- source_word: לְחָזְקָהּ
  choice: damit er wieder stark wird
  rationale: Drückt den beabsichtigten Erfolg der Behandlung natürlich aus; „wieder“ ist durch die Wiederherstellung des gebrochenen Arms sachlich nahegelegt.
- source_word: לִתְפֹּשׂ בֶּחָרֶב
  choice: das Schwert ergreifen kann
  rationale: Bewahrt das konkrete Bild vom Ergreifen des Schwertes und damit von wiederhergestellter militärischer Handlungsfähigkeit.
theological_decisions:
- issue: Bildhafte Bedeutung des gebrochenen Arms
  choice: Das konkrete medizinische und militärische Bild bleibt im Haupttext unaufgelöst.
  alternative: Den Arm ausdrücklich als Macht oder militärische Stärke des Pharaos deuten.
  rationale: Der hebräische Text spricht bildhaft vom Arm. Eine erklärende Ersetzung würde die Metapher verengen und mehr auslegen als übersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lebhafte Aufforderung „Und sieh“ sowie das ausgedehnte medizinische Bild des hebräischen Textes werden bewahrt; die Infinitivfolge wird behutsam gegliedert, damit der Satz für heutige Leser verständlich bleibt.
