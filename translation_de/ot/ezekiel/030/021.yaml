  naturalness: Die überarbeitete Infinitivreihe ist im modernen Standarddeutsch klar und natürlich. „Siehe“ bewahrt den markierten prophetischen Aufmerksamkeitsruf in einer im Bibelregister geläufigen Form.
  terminology: „Menschensohn“, „Arm“, „Pharao“, „Heilmittel“, „Binde/Verband“, „verbinden“, „stärken“ und „das Schwert ergreifen“ sind angemessen. „Verbinden“ gibt das medizinische Verb präziser wieder als „umwickeln“ und darf trotz der Wiederaufnahme des Begriffs stehen bleiben.
