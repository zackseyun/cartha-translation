  text: וּ/בָאָ֥ה חֶ֨רֶב֙ בְּ/מִצְרַ֔יִם וְ/הָיְתָ֤ה חַלְחָלָה֙ בְּ/כ֔וּשׁ בִּ/נְפֹ֥ל חָלָ֖ל בְּ/מִצְרָ֑יִם וְ/לָקְח֣וּ הֲמוֹנָ֔/הּ וְ/נֶהֶרְס֖וּ יְסוֹדֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/004.yaml
  text: And a sword will come against Egypt[a], and there will be anguish in Cush, when the slain fall in Egypt, and they take away her wealth[c][b], and her foundations are torn down.
translation:
  language: de
  text: Und ein Schwert wird über Ägypten kommen, und in Kusch[a] wird Angst herrschen, wenn Erschlagene in Ägypten fallen. Man wird seinen Reichtum[b] wegnehmen, und seine Fundamente werden niedergerissen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kusch bezeichnet das Gebiet südlich von Ägypten und entspricht ungefähr dem antiken Nubien, nicht dem heutigen Staat Äthiopien.
    reason: cultural_note
  - marker: b
    text: 'Oder: „seine Volksmenge“ beziehungsweise „seine Fülle“. Das hebräische Wort kann eine große Menschenmenge, Fülle oder Reichtum bezeichnen; hier ist es im Sinn erbeuteter Güter wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה חֶרֶב בְּמִצְרַיִם
  choice: Und ein Schwert wird über Ägypten kommen
  rationale: Das prophetische Perfekt wird futurisch wiedergegeben. „Schwert“ bleibt als Bild für Krieg und Invasion erhalten; „über Ägypten kommen“ vermittelt den feindlichen Einbruch natürlich, ohne die Präposition unnötig einzuengen.
- source_word: וְהָיְתָה חַלְחָלָה
  choice: wird Angst herrschen
  rationale: חַלְחָלָה bezeichnet erschütternde Angst, Zittern oder qualvolles Beben angesichts einer Katastrophe. „Angst“ ist verständlich und bewahrt die emotionale Dimension.
- source_word: בְּכוּשׁ
  choice: in Kusch
  rationale: Der historische Eigenname wird transliteriert und nicht mit dem modernen Staat Äthiopien gleichgesetzt.
- source_word: בִּנְפֹל חָלָל
  choice: wenn Erschlagene ... fallen
  rationale: Die Infinitivkonstruktion wird als temporaler Nebensatz wiedergegeben; חָלָל bezeichnet im Kriegskontext gewöhnlich einen Erschlagenen.
- source_word: וְלָקְחוּ הֲמוֹנָהּ
  choice: Dann wird man seinen Reichtum wegnehmen
  rationale: הָמוֹן kann Menge, Fülle oder Reichtum bedeuten. Im Eroberungskontext ist „Reichtum“ als Beute plausibel; das unbestimmte „man“ bewahrt das nicht ausdrücklich genannte Subjekt.
- source_word: וְנֶהֶרְסוּ יְסוֹדֹתֶיהָ
  choice: seine Fundamente werden niedergerissen
  rationale: Der Nifal bezeichnet das Niedergerissenwerden. „Fundamente“ erhält die mögliche wörtliche wie auch bildliche Bedeutung.
