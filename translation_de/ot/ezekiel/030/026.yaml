source:
  edition: WLC
  text: וַ/הֲפִצוֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצ֑וֹת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/026.yaml
  text: I will scatter Egypt among the nations[a], and I will disperse them through the lands. Then they will know that I am Yahweh.
translation:
  language: de
  text: Ich werde Ägypten unter die Völker zerstreuen[a] und sie über die Länder verstreuen. Dann werden sie erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wird zunächst „Ägypten“ genannt; das anschließende „sie“ bezieht sich auf die Menschen Ägyptens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: Ich werde … zerstreuen
  rationale: פוץ bezeichnet das Zerstreuen oder Auseinandertreiben. Die Zukunftsform gibt den angekündigten Gerichtsvollzug im Deutschen natürlich wieder.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der Eigenname bezeichnet hier die Nation kollektiv. Die Wiedergabe als „Ägypten“ bewahrt die hebräische Form; das folgende pluralische Pronomen bezieht sich auf die Menschen Ägyptens.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: גּוֹיִם bedeutet gewöhnlich „Völker“ oder „Nationen“. „Unter die Völker“ entspricht dem Kontext von Zerstreuung und Fremde.
- source_word: וְזֵרִיתִי
  choice: und … verstreuen
  rationale: זרה kann „zerstreuen“, „verstreuen“ oder bildlich „worfeln“ bedeuten. „Verstreuen“ bewahrt das Bild räumlicher Zerstreuung und variiert den unmittelbar vorhergehenden Ausdruck leicht.
- source_word: אוֹתָם
  choice: sie
  rationale: Das pluralische Pronomen nimmt die Menschen der kollektiv bezeichneten Nation Ägypten auf. Diese grammatische Verschiebung bleibt im Deutschen sichtbar.
- source_word: בָּאֲרָצוֹת
  choice: über die Länder hin
  rationale: Der Plural אֲרָצוֹת bezeichnet Länder oder Landgebiete. „Über die Länder hin“ bringt die weiträumige Verteilung idiomatisch zum Ausdruck.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Das Waw verbindet die Erkenntnis mit dem vorausgehenden Gerichtsgeschehen. „Dann“ gibt diese zeitlich-folgernde Beziehung natürlich wieder, ohne eine stärkere Kausalität festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bezug des pluralischen Pronomens nach „Ägypten“
  choice: „sie“ bezieht sich auf die Menschen Ägyptens
  alternative: Ägypten als grammatisch singularisches „es“ behandeln
  rationale: Der hebräische Text wechselt ausdrücklich vom Namen מִצְרַיִם zum pluralischen אוֹתָם und versteht die Nation damit kollektiv als ihre Bevölkerung. Diese Spannung wird nicht eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verben „zerstreuen“ und „verstreuen“ spiegeln die zwei verwandten, aber unterschiedlichen hebräischen Verben. Der Wechsel von „Ägypten“ zu „sie“ bleibt bewusst erhalten und wird durch die Fußnote erläutert.
