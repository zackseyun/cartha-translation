  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה וְ/הִשְׁבַּתִּי֙ אֶת הֲמ֣וֹן מִצְרַ֔יִם בְּ/יַ֖ד נְבוּכַדְרֶאצַּ֥ר מֶלֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/010.yaml
  text: 'Thus says the Lord GOD: I will put an end to the multitude of Egypt by the hand of Nebuchadnezzar king of Babylon[a][b].'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Ich werde der Menge Ägyptens durch Nebukadnezar, den König von Babylon, ein Ende machen.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „durch die Hand Nebukadnezars“; die hebräische Wendung bedeutet hier „durch“ oder „mithilfe von“.
    reason: lexical_alternative
  - marker: b
    text: Auch „Nebukadrezar“; diese Form entspricht der hebräischen Schreibweise an dieser Stelle genauer.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in natürlichem, würdigem Deutsch mit Präsens wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die Wiedergabe unterscheidet den Herrschertitel vom Gottesnamen und vermeidet die schwer verständliche Doppelung „Herr HERR“; die Großschreibung signalisiert den Gottesnamen.
- source_word: וְהִשְׁבַּתִּי
  choice: Ich werde … ein Ende machen
  rationale: 'Die Hifil-Form von שׁבת hat kausative Bedeutung: Der Sprecher bewirkt, dass etwas aufhört.'
- source_word: הֲמוֹן מִצְרַיִם
  choice: der Menge Ägyptens
  rationale: הָמוֹן kann die große Menschenmenge, Volksmasse oder Fülle eines Landes bezeichnen. „Menge“ bewahrt diese Breite, ohne einseitig Bevölkerung, Heer oder Reichtum festzulegen.
- source_word: בְּיַד
  choice: durch die Hand
  rationale: Die hebräische Wendung bezeichnet hier das handelnde Mittel beziehungsweise den menschlichen Vollstrecker und wird im Haupttext bildhaft beibehalten.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die im Deutschen geläufige Namensform gewährleistet Wiedererkennbarkeit; eine quellnähere Umschrift wird in der Fußnote genannt.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babylon
  rationale: Die Apposition gibt Titel und Herrschaftsgebiet eindeutig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in der Verbindung אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr Yahweh
  rationale: Die gewählte Form macht den Unterschied zwischen Titel und Eigenname sichtbar, bleibt für deutschsprachige Leser vertraut und vermeidet „Herr HERR“. „Herr Yahweh“ wäre unmittelbarer, ist im heutigen Standarddeutsch jedoch weniger idiomatisch.
- issue: Bezug von הֲמוֹן im Gerichtsorakel
  choice: Menge
  alternative: Volksmasse; Heerhaufen; Reichtum
  rationale: Der Kontext legt Ägyptens zahlreiche Menschen beziehungsweise Machtfülle nahe, bestimmt den Ausdruck aber nicht so eng, dass nur Bevölkerung, Militär oder Besitz gemeint sein müsste.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar prophetischem Ton. Die hebräische Bildsprache „durch die Hand“ bleibt im Text erhalten und wird erklärt; Satzbau und Apposition sind für heutige Leser geglättet.
