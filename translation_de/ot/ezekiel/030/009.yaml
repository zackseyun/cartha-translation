source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֨וּ מַלְאָכִ֤ים מִ/לְּ/פָנַ/י֙ בַּ/צִּ֔ים לְ/הַחֲרִ֖יד אֶת כּ֣וּשׁ בֶּ֑טַח וְ/הָיְתָ֨ה חַלְחָלָ֤ה בָ/הֶם֙ בְּ/י֣וֹם מִצְרַ֔יִם כִּ֥י הִנֵּ֖ה בָּאָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/009.yaml
  text: On that day messengers will go out from before me in ships to terrify Cush[a], secure as she is, and trembling will come upon them on the day of Egypt, for behold[c][b], it is coming.
translation:
  language: de
  text: 'An jenem Tag werden Boten[a] von meiner Gegenwart aus auf Schiffen losziehen, um Kusch[b], das sich sicher fühlt, in Schrecken zu versetzen. Am Tag Ägyptens wird Zittern über seine Bewohner kommen; denn seht: Es kommt!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gesandte“. Das hebräische Wort kann auch „Engel“ bedeuten; hier sind wahrscheinlich menschliche Boten gemeint, die die Nachricht vom Fall Ägyptens überbringen.
    reason: lexical_alternative
  - marker: b
    text: Traditionell auch „Äthiopien“. Kusch bezeichnet ein Gebiet südlich von Ägypten, vor allem im Bereich des heutigen Sudan.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im Zusammenhang dieses Gerichtswortes sind menschliche Nachrichtenüberbringer oder Gesandte wahrscheinlicher als Engel. „Boten“ wahrt zugleich die Bedeutungsbreite des hebräischen Wortes.
- source_word: מִלְּפָנַי
  choice: von mir aus
  rationale: Die Wendung bezeichnet den Ausgangspunkt beim göttlichen Sprecher. „Von mir aus“ klingt im modernen Deutschen natürlich und bewahrt, dass die Boten in seinem Auftrag und aus seinem Bereich aufbrechen.
- source_word: בַּצִּים
  choice: auf Schiffen
  rationale: Das seltene Substantiv bezeichnet hier Wasserfahrzeuge; „auf Schiffen“ ist im Deutschen die natürliche Ausdrucksweise für die Art ihrer Reise.
- source_word: לְהַחֲרִיד
  choice: in Schrecken zu versetzen
  rationale: Der Hifil drückt das Verursachen von Furcht oder panischem Erbeben aus. Die Wendung gibt diese kausative Kraft idiomatisch wieder.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Der überlieferte Ortsname wird transliteriert, statt ihn mit einer nur annähernden modernen geografischen Bezeichnung gleichzusetzen.
- source_word: בֶּטַח
  choice: das sich sicher fühlt
  rationale: Das Wort bezeichnet Sicherheit oder sorgloses Vertrauen. Die Formulierung macht den ironischen Gegensatz zwischen empfundener Sicherheit und kommendem Schrecken deutlich.
- source_word: חַלְחָלָה
  choice: Zittern
  rationale: Das Substantiv umfasst körperliches Beben und angstvolle Erschütterung. „Zittern“ hält beide Aspekte offen und greift das Motiv des Erschreckens auf.
- source_word: בָהֶם
  choice: Sie werden … von Zittern erfasst werden
  rationale: Das maskuline Pluralpronomen bezieht sich sinngemäß auf die Menschen in Kusch. Die deutsche Passivkonstruktion gibt das Überkommen des Zitterns natürlich wieder, ohne Kusch als modernes Staatsgebilde zu definieren.
- source_word: בְּיוֹם מִצְרַיִם
  choice: am Tag Ägyptens
  rationale: Die knappe hebräische Wendung bleibt erhalten; der Zusammenhang bezeichnet den Zeitpunkt, an dem das Gericht über Ägypten hereinbricht.
- source_word: כִּי הִנֵּה בָּאָה
  choice: 'denn seht: Es kommt!'
  rationale: „Seht“ bewahrt den prophetischen Aufmerksamkeitsruf. Das unbestimmte „Es“ erhält die im Hebräischen nicht ausdrücklich benannte Bezugsgröße—den angekündigten Tag, das Zittern oder das kommende Unheil—und vermittelt zugleich die Gewissheit seines unmittelbaren Eintreffens.
theological_decisions:
- issue: Perspektive des göttlichen Sprechers im Gerichtswort
  choice: Die Boten ziehen „von mir aus“ los; Gott bleibt der unmittelbar sprechende Urheber des angekündigten Geschehens.
  alternative: Die Gegenwartsformel ausführlicher als „aus meiner Gegenwart“ wiedergeben.
  rationale: Der hebräische Text stellt das Gericht nicht als unpersönlichen historischen Vorgang dar, sondern als ein Geschehen, das vom göttlichen Sprecher ausgeht. „Von mir aus“ bewahrt dies, ohne im Deutschen eine unnatürlich räumliche Vorstellung festzuschreiben.
- issue: Unbestimmter Bezug der femininen Verbform בָּאָה
  choice: „Es kommt“ lässt den Bezug offen.
  alternative: 'Explizit formulieren: „Der Tag kommt“ oder „Das Unheil kommt“.'
  rationale: Der hebräische Satz nennt das Subjekt an dieser Stelle nicht ausdrücklich. Eine Festlegung auf den Gerichtstag oder das Unheil würde die echte Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bewegung. „An jenem Tag“ und „denn seht“ bewahren den feierlichen Ton, während „das sich sicher fühlt“ und „in Schrecken zu versetzen“ für heutige Leser unmittelbar verständlich bleiben. Die Fußnotenmarker stehen jeweils direkt an der erläuterten Stelle.
