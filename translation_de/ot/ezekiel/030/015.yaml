source:
  edition: WLC
  text: וְ/שָׁפַכְתִּ֣י חֲמָתִ֔/י עַל סִ֖ין מָע֣וֹז מִצְרָ֑יִם וְ/הִכְרַתִּ֖י אֶת הֲמ֥וֹן נֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/015.yaml
  text: And I will pour out my wrath on Sin[a], the stronghold of Egypt[b], and I will cut off the multitude of No.
translation:
  language: de
  text: Und ich werde meinen Zorn über Sin[a], die Festung Ägyptens, ausgießen und die Menge von No[b] vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sin wird gewöhnlich mit Pelusium gleichgesetzt, einer befestigten Stadt an der nordöstlichen Grenze Ägyptens.
    reason: cross_reference
  - marker: b
    text: No wird gewöhnlich mit Theben gleichgesetzt.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Und ich werde … ausgießen
  rationale: Die Wendung bewahrt das Bild des hebräischen Verbs שׁפך und entspricht natürlichem deutschem Sprachgebrauch bei Zorn.
- source_word: חֲמָתִי
  choice: meinen Zorn
  rationale: חֵמָה bezeichnet hier den heftigen göttlichen Zorn; „Zorn“ ist würdig, verständlich und vermeidet eine unnötig emotionale Zuspitzung.
- source_word: עַל סִין
  choice: über Sin
  rationale: „Über … ausgießen“ gibt die räumliche Metapher mit עַל im Deutschen idiomatisch wieder; der hebräische Ortsname bleibt im Haupttext erhalten.
- source_word: מָעוֹז מִצְרָיִם
  choice: die Festung Ägyptens
  rationale: מָעוֹז bezeichnet einen befestigten Ort beziehungsweise ein Bollwerk. „Festung“ passt hier zur Grenzstadt und gibt die Apposition knapp wieder.
- source_word: וְהִכְרַתִּי
  choice: und … vernichten
  rationale: Das Hifil von כרת bedeutet wörtlich „abschneiden“ und bezeichnet im Gerichtskontext die vollständige Beseitigung. Bei einer Menschenmenge ist „vernichten“ im Deutschen klarer und natürlicher als „abschneiden“.
- source_word: אֶת הֲמוֹן
  choice: die Menge
  rationale: הָמוֹן kann Menge, Volksmenge, Getümmel oder Fülle bedeuten. „Menge“ erhält die lexikalische Offenheit, ohne ausdrücklich Bevölkerung, Reichtum oder Heer festzulegen.
- source_word: נֹא
  choice: 'No'
  rationale: Der im hebräischen Text stehende Ortsname wird transliteriert; die verbreitete Identifikation mit Theben erscheint in einer Fußnote.
theological_decisions:
- issue: Unmittelbarkeit und Stärke des göttlichen Gerichts
  choice: „meinen Zorn … ausgießen“ und „vernichten“ als direkte Handlungen Gottes
  alternative: Die Gerichtssprache durch „Ärger“ oder eine unpersönliche Umschreibung abzumildern
  rationale: Der hebräische Text stellt Gottes Gericht ausdrücklich und kraftvoll dar. Die Übersetzung wahrt diese Aussage, ohne sie dogmatisch auszubauen.
- issue: Bezugswort von מָעוֹז מִצְרָיִם
  choice: 'Als Apposition zu Sin: „Sin, die Festung Ägyptens“'
  alternative: 'Als eigenständiges oder weiter gefasstes Objekt: „gegen die Festung Ägyptens“'
  rationale: Die unmittelbare Wortstellung legt eine appositionelle Beschreibung Sins nahe; die Übersetzung folgt dieser wahrscheinlichsten syntaktischen Verbindung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Gerichtssprache. Die Ortsnamen des hebräischen Textes bleiben erhalten und werden in den Fußnoten historisch eingeordnet. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Namen.
