base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/016.yaml
  text: And I will set fire in Egypt[a]; Sin will writhe in anguish, and No will be broken open[d][c][b], and Noph will have enemies by day.
translation:
  language: de
  text: Und ich werde in Ägypten Feuer legen; Sin[a] wird sich vor Qual winden, No[b] wird aufgebrochen werden, und Nof[c] wird bei Tag Feinde haben.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sin ist eine ägyptische Stadt, die gewöhnlich mit Pelusium gleichgesetzt wird.
    reason: cross_reference
  - marker: b
    text: No wird gewöhnlich mit Theben gleichgesetzt.
    reason: cross_reference
  - marker: c
    text: Nof wird gewöhnlich mit Memphis gleichgesetzt.
    reason: cross_reference
  - marker: d
    text: 'Oder: „Nof wird tagsüber Bedränger haben.“ Der hebräische Satz ist sehr knapp und kann einen offenen oder fortwährenden Angriff hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֵשׁ בְּמִצְרַיִם
  choice: Und ich werde in Ägypten Feuer legen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“; zusammen mit „Feuer“ und einer Ortsangabe bezeichnet die Wendung das Legen beziehungsweise Entfachen zerstörerischen Feuers. „In Ägypten“ gibt die Präposition ב unmittelbar wieder.
- source_word: חוּל תחיל
  choice: wird sich vor Qual winden
  rationale: חול kann Zittern, Sichwinden oder Wehen bezeichnen. Die Formulierung bewahrt hier das eindringliche Bild körperlich erfahrbarer Angst und Not.
- source_word: סִין
  choice: Sin
  rationale: Der hebräische Ortsname wird transliteriert; die verbreitete Identifizierung mit Pelusium steht in einer Fußnote.
- source_word: וְנֹא
  choice: 'No'
  rationale: Der hebräische Ortsname wird beibehalten, statt die historische Identifizierung Theben in den Haupttext einzutragen.
- source_word: תִּהְיֶה לְהִבָּקֵעַ
  choice: wird aufgebrochen werden
  rationale: בקע bezeichnet ein Spalten oder gewaltsames Aufbrechen. Bei einer angegriffenen Stadt gibt „aufgebrochen“ das konkrete Bild einer durchbrochenen Befestigung wieder.
- source_word: וְנֹף
  choice: Nof
  rationale: Der hebräische Name wird in einer dem Deutschen entsprechenden Umschrift wiedergegeben; die übliche Identifizierung mit Memphis wird angemerkt.
- source_word: צָרֵי יוֹמָם
  choice: wird am helllichten Tag Feinde haben
  rationale: צָרֵי wird als „Feinde, Bedränger“ und יוֹמָם als „bei Tag“ verstanden. Das im knappen hebräischen Nominalsatz ergänzte „wird … haben“ wahrt dessen Aussage, während „am helllichten Tag“ den Gedanken eines offenen Angriffs ausdrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Ortsnamen bleiben im Haupttext erhalten; ihre verbreiteten historischen Identifizierungen stehen in Fußnoten. Der ungewöhnlich knappe letzte Satzteil wird lesbar ergänzt, ohne seine lexikalische Unsicherheit zu verdecken.
