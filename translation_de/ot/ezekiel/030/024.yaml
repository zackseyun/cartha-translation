id: EZK.30.24
reference: Ezekiel 30:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נָתַתִּ֥י אֶת חַרְבִּ֖/י בְּ/יָד֑/וֹ וְ/שָׁבַרְתִּי֙ אֶת זְרֹע֣וֹת פַּרְעֹ֔ה וְ/נָאַ֛ק נַאֲק֥וֹת חָלָ֖ל לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/024.yaml
  text: And I will strengthen the arms of the king of Babylon[a], and I will put my sword into his hand; but I will break the arms of Pharaoh, and he will groan before him with the groanings of a slain man.
translation:
  language: de
  text: Und ich werde die Arme des Königs von Babel stärken und mein Schwert in seine Hand geben. Doch die Arme des Pharaos werde ich brechen, und er wird vor ihm[a] stöhnen wie ein tödlich Verwundeter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor mir“, falls sich das letzte Pronomen auf den HERRN und nicht auf den König von Babel bezieht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: Und ich werde … stärken
  rationale: Das mit וְ verbundene Perfekt hat im prophetischen Zusammenhang Zukunftsbedeutung. „Stärken“ bewahrt das konkrete Bild militärischer Macht.
- source_word: זְרֹעוֹת
  choice: die Arme
  rationale: 'Die wörtliche Wiedergabe erhält das durchgehende Bild: Die Arme des Königs von Babel werden gestärkt, die des Pharaos gebrochen.'
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Natürliche Wiedergabe der hebräischen Status-constructus-Verbindung; ein Eigenname wird nicht ergänzt.
- source_word: וְנָתַתִּי אֶת חַרְבִּי בְּיָדוֹ
  choice: und mein Schwert in seine Hand geben
  rationale: Die Formulierung bleibt nahe am Hebräischen und macht deutlich, dass Babel als Werkzeug des göttlichen Gerichts handelt.
- source_word: וְשָׁבַרְתִּי
  choice: Doch … werde ich brechen
  rationale: „Brechen“ entspricht dem wiederkehrenden Bild des gebrochenen Arms. „Doch“ gibt den inhaltlichen Gegensatz natürlich wieder.
- source_word: וְנָאַק נַאֲקוֹת
  choice: und er wird … stöhnen
  rationale: Das deutsche Verb „stöhnen“ gibt den Ausdruck von Schmerz natürlich wieder; die hebräische figura etymologica wird nicht steif verdoppelt, sondern durch den anschließenden Vergleich verdeutlicht.
- source_word: חָלָל
  choice: ein tödlich Verwundeter
  rationale: חָלָל bezeichnet einen im Kampf Durchbohrten bzw. Erschlagenen. Da ein bereits Erschlagener nicht stöhnt, wahrt „tödlich Verwundeter“ Bild und Sinn des Vergleichs.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Der nächstliegende Bezug ist der König von Babel; die Mehrdeutigkeit des Pronomens wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Bezug des Pronomens in לְפָנָיו
  choice: „vor ihm“ bezieht sich im Haupttext auf den König von Babel.
  alternative: 'Das Pronomen kann auf den HERRN bezogen werden: „vor mir“.'
  rationale: Der König von Babel ist im unmittelbaren Zusammenhang der naheliegende Bezugspunkt, und die Aussage schildert die Erniedrigung des Pharaos vor seinem Eroberer. Da ein Bezug auf den HERRN sprachlich möglich bleibt, wird diese echte Mehrdeutigkeit nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Arm- und Schwertmetaphorik bleibt erhalten; unnötig altertümliche oder erklärende Zusätze werden vermieden.
