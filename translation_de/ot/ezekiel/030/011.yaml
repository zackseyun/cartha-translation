  text: ה֠וּא וְ/עַמּ֤/וֹ אִתּ/וֹ֙ עָרִיצֵ֣י גוֹיִ֔ם מֽוּבָאִ֖ים לְ/שַׁחֵ֣ת הָ/אָ֑רֶץ וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל מִצְרַ֔יִם וּ/מָלְא֥וּ אֶת הָ/אָ֖רֶץ חָלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/011.yaml
  text: He and his people with him—the ruthless of the nations—will be brought in to destroy the land[a]. They will draw their swords against Egypt and fill the land with the slain.
translation:
  language: de
  text: Er und sein Volk mit ihm – die Gewalttätigsten der Völker[a] – werden herbeigeführt, um das Land zu verwüsten. Sie werden ihre Schwerter gegen Ägypten ziehen und das Land mit Erschlagenen füllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Gewalttätige der Völker“; auch möglich: „die Rücksichtslosesten der Völker“ oder „die Schrecken verbreitenden Männer der Völker“. Der hebräische Ausdruck bezeichnet besonders brutale, furchterregende Invasoren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוֹ אִתּוֹ
  choice: sein Volk mit ihm
  rationale: „Volk“ gibt עַם direkt wieder, ohne die Begleiter enger als „Heer“ oder „Truppen“ zu bestimmen. Die leicht markierte Wiederholung bewahrt die emphatische hebräische Formulierung.
- source_word: עָרִיצֵי גוֹיִם
  choice: Gewalttätige unter den Völkern
  rationale: עָרִיץ bezeichnet gewalttätige, rücksichtslose oder Schrecken verbreitende Menschen. Die Wiedergabe vermeidet einen im Hebräischen nicht ausdrücklich markierten Superlativ und klingt im Deutschen natürlicher als „Gewalttätige der Völker“.
- source_word: מוּבָאִים
  choice: werden herbeigebracht
  rationale: Das Hophal-Partizip von בוא drückt verursachtes Kommen aus. Das Futur entspricht dem prophetischen Zusammenhang und den folgenden Verbformen.
- source_word: לְשַׁחֵת הָאָרֶץ
  choice: um das Land zu verwüsten
  rationale: שׁחת bezeichnet hier die zerstörerische Einwirkung auf das Land Ägypten. „Verwüsten“ ist im militärischen Zusammenhang natürlich und gibt die Zerstörung eines Landes treffend wieder.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם עַל־מִצְרַיִם
  choice: Sie werden ihre Schwerter gegen Ägypten ziehen
  rationale: Die Verbindung von ריק mit „Schwertern“ ist eine militärische Wendung für das Ziehen beziehungsweise Zücken der Waffen.
- source_word: וּמָלְאוּ אֶת־הָאָרֶץ חָלָל
  choice: und das Land mit Erschlagenen füllen
  rationale: חָלָל bezeichnet im Krieg Getötete. „Erschlagene“ wahrt den konkreten und zugleich würdigen Ausdruck.
theological_decisions: []
