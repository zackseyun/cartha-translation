  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche bilden die appositionelle hebräische Wortfolge ab; der bewusst knappe Ausdruck „sein Volk mit ihm“ bewahrt deren Nachdruck, ohne „Volk“ vorschnell als ausschließlich militärische Truppe festzulegen.
