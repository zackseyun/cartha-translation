base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/002.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Wail[b], “Alas for the day!”’'
translation:
  language: de
  text: 'Menschensohn, weissage und sprich: »So spricht der Herr Yahweh: Heult[a]: ›Ach, der Tag!‹[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Jammert“ oder „klagt laut“. Gemeint ist ein lauter Klageruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ach über den Tag!“ Der hebräische Ausruf bringt Klage oder Schrecken angesichts des kommenden Tages zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Ezechiel regelmäßig gebrauchte Anrede wird in ihrer hebräischen Bildform und als wiederkehrender Leitbegriff bewahrt.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Der Imperativ von נבא fordert Ezechiel auf, eine prophetische Botschaft auszurichten; „weissage“ ist die knappe und sachlich genaue deutsche Entsprechung.
- source_word: וְאָמַרְתָּ
  choice: und sprich
  rationale: Die Form führt den zweiten Auftrag nach „weissage“ fort und bewahrt so die zweigliedrige Befehlsfolge.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in ihrer im Deutschen vertrauten, feierlichen Form wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die Wiedergabe unterscheidet Titel und Gottesnamen und vermeidet das missverständliche doppelte „Herr“; die Großschreibung von „GOTT“ zeigt an, dass hier der Gottesname steht.
- source_word: הֵילִילוּ
  choice: Jammert
  rationale: Der Pluralimperativ bezeichnet lautes Klagen in Bedrängnis. „Jammert“ ist im heutigen Deutsch natürlich und bewahrt die Stärke des Ausdrucks, ohne die möglicherweise tierisch klingende Nebenbedeutung von „heult“ in den Vordergrund zu stellen.
- source_word: הָהּ
  choice: Ach
  rationale: Die Interjektion drückt Klage und Schrecken aus. „Ach“ wahrt den Ausrufcharakter, ohne ihn vorschnell zu einer feststehenden Weheformel zu machen.
- source_word: לַיּוֹם
  choice: der Tag
  rationale: In Verbindung mit dem Klageruf richtet die Präposition ל den Ausruf auf den Tag. Die knappe Form „Ach, der Tag!“ bewahrt die abgerissene, unheilvolle Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: Herr Yahweh
  rationale: Der Text verbindet den Herrschaftstitel אֲדֹנָי mit dem Gottesnamen יהוה. „GOTT, der Herr“ folgt einer verständlichen deutschen Konvention und macht durch die typografische Hervorhebung kenntlich, dass „GOTT“ den Gottesnamen vertritt; die mögliche direkte Wiedergabe „Yahweh“ bleibt als Alternative bestehen.
- issue: Charakter des Ausrufs הָהּ לַיּוֹם
  choice: Ach, der Tag!
  alternative: Wehe über den Tag!
  rationale: הָהּ ist zunächst ein Klage- oder Schreckensruf. Die Übersetzung hält diesen offenen Ausruf fest und legt ihn nicht eindeutig als formelhafte Gerichtsansage aus, obwohl der Zusammenhang den kommenden Gerichtstag erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Botenformel. Die kurzen Imperative und der abgerissene Klageruf bilden die Dringlichkeit des hebräischen Textes nach. Die verschachtelten deutschen Anführungszeichen kennzeichnen Gottes Rede und den darin angeordneten Klageruf.
