lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Die Form führt die Erzählung fort. Im Deutschen wird das Verb natürlich in die feste prophetische Wendung „das Wort … kam“ aufgenommen; „Und“ bewahrt die Verknüpfung mit dem vorhergehenden Zusammenhang.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְבַר יְהוָה bezeichnet der Ausdruck eine konkrete göttliche Mitteilung. „Das Wort“ wahrt zugleich die wiederkehrende Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit dem Suffix der ersten Person Singular bezeichnet die Richtung zum Propheten; „zu mir“ ist die natürliche deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den unmittelbar folgenden Inhalt der Rede ein. Im heutigen Deutsch übernimmt ein Doppelpunkt diese Funktion idiomatischer als das schwerfällige „indem er sprach“ oder ein vorangestelltes „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute prophetische Botenformel bleibt erkennbar; לֵאמֹר wird entsprechend natürlichem deutschem Sprachgebrauch durch den Doppelpunkt dargestellt.
