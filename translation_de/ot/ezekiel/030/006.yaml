id: EZK.30.6
reference: Ezekiel 30:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה וְ/נָֽפְלוּ֙ סֹמְכֵ֣י מִצְרַ֔יִם וְ/יָרַ֖ד גְּא֣וֹן עֻזָּ֑/הּ מִ/מִּגְדֹּ֣ל סְוֵנֵ֗ה בַּ/חֶ֨רֶב֙ יִפְּלוּ בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/006.yaml
  text: 'Thus says Yahweh: The supporters of Egypt will fall[a], and the pride of her strength will come down. From Migdol to Syene they will fall by the sword within her[c][b], declares the Lord GOD.'
translation:
  language: de
  text: 'So spricht Jahwe: Die Ägypten stützen, werden fallen, und der Stolz seiner Macht[a] wird niedersinken. Von Migdol bis Syene[b] werden sie darin durch das Schwert fallen[c] – Spruch des Herrn Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Pracht seiner Macht.'
    reason: lexical_alternative
  - marker: b
    text: Migdol und Syene markieren Ägyptens Ausdehnung von Norden nach Süden.
    reason: cultural_note
  - marker: c
    text: 'Oder: werden sie durch das Schwert in ihm fallen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige prophetische Botenformel wird knapp und würdevoll wiedergegeben; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: סֹמְכֵי מִצְרַיִם
  choice: die Ägypten stützen
  rationale: Das Partizip von סמך bezeichnet Menschen oder Mächte, die Ägypten stützen. Die verbale Formulierung bleibt offen, ob Verbündete, Hilfstruppen oder andere Unterstützer gemeint sind.
- source_word: גְּאוֹן עֻזָּהּ
  choice: der Stolz seiner Macht
  rationale: גאון kann Stolz, Hoheit oder Pracht bezeichnen, עז Stärke oder Macht. Die Formulierung bewahrt den Genitivzusammenhang und bezieht das feminine Suffix sinngemäß auf Ägypten, das im Deutschen sächlich ist.
- source_word: וְיָרַד
  choice: wird niedersinken
  rationale: Die intransitive Bewegung nach unten bleibt erhalten; eine zusätzliche passive Ursache wird nicht eingeführt.
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: Von Migdol bis Syene
  rationale: Die beiden Ortsnamen bezeichnen die geografische Ausdehnung Ägyptens von Norden nach Süden.
- source_word: בַּחֶרֶב יִפְּלוּ בָהּ
  choice: werden sie darin durch das Schwert fallen
  rationale: „Durch das Schwert fallen“ ist eine verständliche deutsche Wendung für gewaltsamen Tod im Krieg. „Darin“ wahrt den Rückbezug des femininen בָהּ auf Ägypten beziehungsweise das Land.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Spruch des Herrn Jahwe
  rationale: Die Orakelformel נְאֻם wird als „Spruch“ wiedergegeben; אֲדֹנָי und der Gottesname bleiben beide erkennbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration macht den im Hebräischen ausdrücklich stehenden Eigennamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Referent der Stützenden Ägyptens
  choice: offen als „die Ägypten stützen“
  alternative: Ägyptens militärische Verbündete
  rationale: Der hebräische Ausdruck bezeichnet Unterstützende, legt ihre politische oder militärische Rolle aber nicht genauer fest.
- issue: Bedeutung von גְּאוֹן
  choice: Stolz
  alternative: Pracht/Hoheit
  rationale: Im Gerichtskontext ist „Stolz“ naheliegend; die mögliche positive Bedeutung „Pracht“ oder „Hoheit“ wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. „Niedersinken“ hebt den Gegensatz zu Ägyptens stolzer Macht hervor; „darin“ vermeidet das im Deutschen missverständliche Geschlecht des hebräischen Rückverweises.
