  source_fidelity: 'Die Übersetzung folgt dem hebräischen Text genau: Die aktiv Ägypten Stützenden fallen; Ägyptens stolze Macht sinkt herab; der räumliche Rahmen »von Migdol bis Syene« sowie das Fallen durch das Schwert im Land werden bewahrt. »Spruch des Herrn Jahwe« gibt נְאֻם אֲדֹנָי יְהוִה angemessen wieder.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. »Die Ägypten stützen« ist eine leicht gehobene, aber für prophetische Sprache natürliche verkürzte Relativkonstruktion. »Darin« nimmt verständlich auf das sächliche »Ägypten« Bezug.
