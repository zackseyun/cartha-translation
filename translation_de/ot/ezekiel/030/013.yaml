source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה וְ/הַאֲבַדְתִּ֨י גִלּוּלִ֜ים וְ/הִשְׁבַּתִּ֤י אֱלִילִים֙ מִ/נֹּ֔ף וְ/נָשִׂ֥יא מֵ/אֶֽרֶץ מִצְרַ֖יִם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/נָתַתִּ֥י יִרְאָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/013.yaml
  text: 'Thus says the Lord GOD: I will destroy the idols and put an end to the images from Noph[a], and there will no longer be a prince from the land of Egypt[b]; and I will put fear in the land of Egypt.'
translation:
  language: de
  text: 'So spricht der Herr Jahwe: Ich werde die Götzen vernichten und die Götterbilder aus Nof[a] beseitigen. Und es wird keinen Fürsten aus dem Land Ägypten mehr geben[b], und ich werde im Land Ägypten Furcht hervorrufen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof ist der hebräische Name der ägyptischen Stadt, die unter ihrem griechischen Namen Memphis bekannter ist.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Es wird keinen Herrscher aus dem Land Ägypten mehr geben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Verbindung aus Titel und Gottesnamen wird transparent als „der Herr Jahwe“ wiedergegeben. Die deutsche Form „Jahwe“ bezeichnet das im Hebräischen ausdrücklich stehende Tetragramm, ohne es durch einen zweiten Titel zu ersetzen.
- source_word: וְהַאֲבַדְתִּי גִלּוּלִים
  choice: Ich werde die Götzen vernichten
  rationale: Der Hifil von אבד bezeichnet hier die entschiedene Vernichtung beziehungsweise Beseitigung. „Götzen“ gibt den verächtlichen Bezug von גִלּוּלִים verständlich wieder, ohne eine etymologisierende Grobheit in den Text einzutragen.
- source_word: וְהִשְׁבַּתִּי אֱלִילִים
  choice: den Götterbildern … ein Ende machen
  rationale: Der Hifil von שׁבת bedeutet „aufhören lassen“. „Ein Ende machen“ bewahrt diesen kausativen Sinn; „Götterbilder“ unterscheidet אֱלִילִים im Deutschen von den unmittelbar zuvor genannten גִלּוּלִים.
- source_word: מִנֹּף
  choice: in Nof
  rationale: Der hebräische Ortsname wird als „Nof“ beibehalten; eine Fußnote nennt den geläufigeren griechischen Namen Memphis. Das מִן bezeichnet im Zusammenhang die Entfernung der Kultbilder aus Nof, wird aber im natürlichen deutschen Ausdruck „den … in Nof ein Ende machen“ idiomatisch aufgenommen.
- source_word: וְנָשִׂיא מֵאֶרֶץ מִצְרַיִם לֹא יִהְיֶה עוֹד
  choice: Keinen Fürsten aus dem Land Ägypten wird es mehr geben
  rationale: נָשִׂיא kann „Fürst“, „Anführer“ oder „Herrscher“ bedeuten. „Fürst“ wahrt die traditionelle politische Bezeichnung, während die deutsche Satzstellung den hebräischen Existenzsatz natürlich wiedergibt.
- source_word: וְנָתַתִּי יִרְאָה בְּאֶרֶץ מִצְרָיִם
  choice: ich werde Furcht über das Land Ägypten bringen
  rationale: נתן mit יִרְאָה beschreibt das Herbeiführen von Furcht. „Furcht … bringen“ ist im Deutschen natürlicher als die wörtliche Form „Furcht geben“; „über das Land“ vermittelt die räumliche Wirkung, ohne ausdrücklich „überall“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Der Ausgangstext enthält neben אֲדֹנָי ausdrücklich den Gottesnamen יהוה. Die gewählte Form bewahrt sowohl den Herrschaftstitel als auch den Eigennamen und vermeidet, beide unterschiedslos als Titel wiederzugeben.
- issue: Reichweite der Aussage über den ägyptischen נָשִׂיא
  choice: Keinen Fürsten aus dem Land Ägypten wird es mehr geben
  alternative: Keinen Herrscher aus dem Land Ägypten wird es mehr geben
  rationale: Die Übersetzung legt nicht näher fest, ob ein königlicher, einheimischer oder allgemeiner politischer Machthaber gemeint ist. Die lexikalische Alternative „Herrscher“ wird deshalb in einer Fußnote offengehalten.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Text mit klarer prophetischer Rede. Die Satzstruktur bleibt quellennah, wird aber für flüssiges Deutsch leicht geglättet. „Jahwe“ folgt der im Deutschen üblichen Form des Gottesnamens; „Nof“ bleibt als hebräische Namensform stehen und wird erläutert.
