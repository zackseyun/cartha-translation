  text: כּ֣וּשׁ וּ/פ֤וּט וְ/לוּד֙ וְ/כָל הָ/עֶ֣רֶב וְ/כ֔וּב וּ/בְנֵ֖י אֶ֣רֶץ הַ/בְּרִ֑ית אִתָּ֖/ם בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/005.yaml
  text: Cush and Put and Lud and all the mixed people and Cub and the sons of the land of the covenant—with them they will fall by the sword[a][b][c].
translation:
  language: de
  text: Kusch, Put und Lud, das ganze Mischvolk[a], Kub[b] und die Söhne des Landes des Bundes[c] – sie werden mit ihnen durchs Schwert fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ganz Arabien«, »alle Söldner« oder »die ganze gemischte Schar«; die Bedeutung des hebräischen Wortes עֶרֶב ist hier umstritten.'
    reason: lexical_alternative
  - marker: b
    text: »Kub« ist ein seltener Orts- oder Volksname; seine Identifizierung ist unsicher.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »die Bewohner des Landes des Bundes«. Die Wendung kann Menschen bezeichnen, die durch einen Vertrag verbündet waren; manche beziehen sie auf Judäer, die in Ägypten lebten.'
    reason: alternative_reading
lexical_decisions:
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Der Eigenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben; »Äthiopien« wäre eine interpretierende geografische Gleichsetzung.
- source_word: פּוּט
  choice: Put
  rationale: Transliteration des Völker- beziehungsweise Ländernamens ohne weitergehende Identifizierung.
- source_word: לוּד
  choice: Lud
  rationale: Die hebräische Namensform bleibt erhalten; eine Wiedergabe als »Lydien« oder »Lydier« würde eine unsichere Identifizierung voraussetzen.
- source_word: כָל הָעֶרֶב
  choice: das ganze Mischvolk
  rationale: עֶרֶב bezeichnet hier wahrscheinlich eine gemischte Bevölkerung oder Schar. Die umstrittenen Alternativen werden in der Fußnote bewahrt.
- source_word: כּוּב
  choice: Kub
  rationale: Der seltene und nicht sicher identifizierte Orts- oder Volksname wird nahe an den hebräischen Konsonanten transliteriert.
- source_word: בְנֵי אֶרֶץ הַבְּרִית
  choice: die Söhne des Landes des Bundes
  rationale: Die formal nahe Wiedergabe bewahrt sowohl die Bildsprache von בְנֵי als auch die Unklarheit darüber, welches Land und welche Bundesbeziehung gemeint sind.
- source_word: אִתָּם
  choice: zusammen mit ihnen
  rationale: Die Wendung drückt die Gemeinschaft mit den zuvor genannten Gruppen aus und wird im deutschen Satz zur Verdeutlichung der Beziehung ausgeschrieben.
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Die traditionelle prophetische Bildsprache für den Tod in Krieg und Gericht bleibt erhalten.
- source_word: יִפֹּלוּ
  choice: sie werden fallen
  rationale: Die Grundbedeutung von נפל wird bewahrt; im Zusammenhang bezeichnet das Fallen den Tod durch das Schwert.
theological_decisions:
- issue: Identität der »Söhne des Landes des Bundes«
  choice: Die mehrdeutige Formulierung bleibt im Haupttext erhalten.
  alternative: »die Bewohner des Landes des Bundes« beziehungsweise eine ausdrückliche Identifizierung mit in Ägypten lebenden Judäern
  rationale: Der hebräische Text benennt den Bezug nicht eindeutig; eine bestimmte historische oder theologische Zuordnung soll nicht in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener prophetischer Schwertmetapher. Die Reihung der Völker folgt dem Hebräischen; ein Gedankenstrich gliedert die lange Aufzählung. Seltene Namen werden transliteriert, und echte lexikalische sowie historische Unsicherheiten erscheinen in den Fußnoten.
