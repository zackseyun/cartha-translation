source:
  edition: WLC
  text: בְּֽ/שַׁלְּחִ֡/י אֶת חִצֵּי֩ הָ/רָעָ֨ב הָ/רָעִ֤ים בָּ/הֶם֙ אֲשֶׁ֣ר הָי֣וּ לְ/מַשְׁחִ֔ית אֲשֶׁר אֲשַׁלַּ֥ח אוֹתָ֖/ם לְ/שַֽׁחֶתְ/כֶ֑ם וְ/רָעָב֙ אֹסֵ֣ף עֲלֵי/כֶ֔ם וְ/שָׁבַרְתִּ֥י לָ/כֶ֖ם מַטֵּה לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/016.yaml
  text: When I send against them the deadly arrows of famine[a], which are for destruction, which I will send to destroy you[b], then I will add famine upon you and break for you the staff of bread.
translation:
  language: de
  text: Wenn ich gegen sie die unheilvollen Pfeile des Hungers sende[a], die zur Vernichtung dienen und die ich aussenden werde, um euch zu vernichten, werde ich Hunger über euch häufen und euch den Stab des Brotes zerbrechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die schlimmen/verheerenden Pfeile des Hungers“.'
    reason: Das Adjektiv הָרָעִים kann hier „schlimm“, „verheerend“, „schädlich“ oder „unheilvoll“ bezeichnen.
  - marker: b
    text: „Der Stab des Brotes“ ist ein hebräisches Bild für die tragende Versorgung mit Brot beziehungsweise Nahrung.
    reason: Die wörtlich bewahrte Metapher ist im modernen Deutschen nicht ohne Weiteres verständlich.
lexical_decisions:
- source_word: בְּשַׁלְּחִי
  choice: Wenn ich … sende
  rationale: Die Präposition בְּ mit dem Infinitivus constructus leitet hier einen temporalen Nebensatz ein. „Wenn ich … sende“ ist im Deutschen natürlich und bewahrt den vorausblickenden Sinn.
- source_word: חִצֵּי הָרָעָב
  choice: die Pfeile des Hungers
  rationale: 'Die Constructusverbindung wird wörtlich-metaphorisch wiedergegeben: Der Hunger erscheint als von Gott eingesetzte Waffe.'
- source_word: הָרָעִים
  choice: unheilvollen
  rationale: רַע bezeichnet hier die verheerende Wirkung der Hungerpfeile, nicht notwendig moralische Bosheit. „Unheilvoll“ bewahrt die negative Wertung, ohne sie vorschnell ausschließlich als „tödlich“ festzulegen.
- source_word: בָּהֶם
  choice: gegen sie
  rationale: Im Zusammenhang mit dem Senden von Pfeilen bezeichnet בְּ die Zielrichtung. Der Wechsel von „sie“ zu „euch“ im folgenden Satzteil bleibt entsprechend dem Hebräischen erhalten.
- source_word: לְמַשְׁחִית
  choice: die zum Verderben bestimmt sind
  rationale: Die Form bezeichnet den zerstörerischen Zweck beziehungsweise die zerstörerische Wirkung. Die deutsche Fassung stellt den Bezug auf die Pfeile klar.
- source_word: לְשַׁחֶתְכֶם
  choice: um euch zu vernichten
  rationale: Der Infinitiv mit dem Suffix der zweiten Person Plural drückt den Zweck aus. „Vernichten“ gibt die Härte der Gerichtsankündigung direkt wieder.
- source_word: וְרָעָב אֹסֵף עֲלֵיכֶם
  choice: dann werde ich noch mehr Hunger über euch bringen
  rationale: אָסַף hat hier den Sinn „hinzufügen, vermehren“. „Noch mehr Hunger … bringen“ ist natürliches Deutsch und bewahrt mit „über euch“ das Bild eines hereinbrechenden Gerichts.
- source_word: וְשָׁבַרְתִּי לָכֶם מַטֵּה לָחֶם
  choice: und euch den Stab des Brotes zerbrechen
  rationale: Die Quellmetapher wird im Haupttext erhalten. Das Dativpronomen „euch“ gibt לָכֶם idiomatisch wieder; eine Fußnote erläutert die Bedeutung des Bildes.
theological_decisions:
- issue: Göttliches Handeln im Gericht
  choice: 'Die erste Person bleibt durchgehend ausdrücklich: Gott sendet, bringt Hunger und zerbricht.'
  alternative: Unpersönliche Formulierungen wie „Hunger wird kommen“.
  rationale: Der hebräische Text schreibt das Gericht wiederholt und unmittelbar dem redenden Gott zu. Diese Aussage wird weder abgeschwächt noch umgedeutet.
- issue: Bildsprache des Gerichts
  choice: Die Bilder „Pfeile des Hungers“ und „Stab des Brotes“ bleiben im Haupttext erhalten.
  alternative: Vollständig deutende Wiedergaben wie „tödlicher Hunger“ und „Brotversorgung“.
  rationale: Die Metaphern tragen wesentlich zur Aussage bei. Die schwerer verständliche Wendung „Stab des Brotes“ wird deshalb nicht ersetzt, sondern in einer Fußnote erläutert.
- issue: Wechsel zwischen dritter und zweiter Person
  choice: Der Wechsel von „gegen sie“ zu „euch“ wird bewahrt.
  alternative: Beide Pronomen zur sprachlichen Glättung einheitlich als „euch“ wiedergeben.
  rationale: Der Pronomenwechsel steht im hebräischen Text und kann rhetorisch bedeutsam sein. Eine Vereinheitlichung würde eine echte Spannung der Formulierung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Gerichtssprache und die Wiederholung des Sendens bleiben erhalten. Ungebräuchliche biblische Bildsprache wird nur dort im Haupttext bewahrt, wo sie inhaltlich prägend ist, und durch eine knappe Fußnote erschlossen.
