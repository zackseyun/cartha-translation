  - severity: low
    issue: Die Fußnote setzt Umschrift und Übersetzung gleich
    rationale: „Adonaj JHWH“ ist eine Wiedergabe der hebräischen Wortfolge, während „Herr Jahwe“ die deutsche Übersetzung bzw. Namenswiedergabe ist. Die Erläuterung sollte dies klar trennen.
