  verdict: revise
  source_fidelity: Die Übersetzung gibt die Folgerung, die prophetische Botenformel, die emphatische Selbstankündigung Gottes, die gegen Jerusalem gerichtete Haltung, den pluralischen Vollzug von Strafgerichten sowie deren öffentliche Wahrnehmung durch die Völker sachgerecht wieder. „mitten in dir“ bewahrt die feminine Einzahlanrede der Stadt.
  naturalness: Der Vers ist verständliches, würdiges modernes Standarddeutsch. Die Verbindung „Darum, so spricht“ ist jedoch im heutigen Deutsch unnötig stockend; „Darum spricht“ ist natürlicher und behält die Botenformel bei.
  terminology: „der Herr Jahwe“ bildet sowohl אֲדֹנָי als auch den Gottesnamen ab und ist im gegebenen Namensgebrauch vertretbar. „Gerichte vollstrecken“ ist im Kontext für וְעָשִׂיתִי ... מִשְׁפָּטִים angemessen. Die Fußnote sollte allerdings nicht behaupten, „Adonaj JHWH“ heiße einfach „Herr Jahwe“; sie sollte die hebräische Form und die gewählte Wiedergabe präzise unterscheiden.
