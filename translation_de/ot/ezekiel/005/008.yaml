  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ גַּם אָ֑נִי וְ/עָשִׂ֧יתִי בְ/תוֹכֵ֛/ךְ מִשְׁפָּטִ֖ים לְ/עֵינֵ֥י הַ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I myself am against you, and I will execute judgments in your midst before the eyes of the nations.'
translation:
  language: de
  text: 'Darum spricht der Herr Jahwe: Siehe, ich selbst bin gegen dich, und ich werde mitten in dir vor den Augen der Völker Gerichte vollstrecken.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als Folgerung aus der vorausgehenden Anklage die angekündigte Konsequenz ein und klingt im modernen Deutsch natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die traditionelle prophetische Botenformel in einer würdigen und allgemein verständlichen Form.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Gibt אֲדֹנָי als Titel „Herr“ und den Gottesnamen יהוה als „Jahwe“ wieder, ohne beide Elemente miteinander zu verschmelzen.
- source_word: הִנְנִי
  choice: Siehe
  rationale: Kennzeichnet die feierliche göttliche Ankündigung; „Siehe“ erhält den prophetischen Nachdruck besser als ein umgangssprachliches „Schau“.
- source_word: עָלַיִךְ גַּם אָנִי
  choice: ich selbst bin gegen dich
  rationale: Im Gerichtskontext bezeichnet עַל feindliche Gegenstellung. „Ich selbst“ bringt die emphatische Kraft von גַּם אָנִי idiomatisch zum Ausdruck.
- source_word: וְעָשִׂיתִי ... מִשְׁפָּטִים
  choice: ich werde ... Gerichte vollstrecken
  rationale: Die Wendung bedeutet hier, konkrete richterliche Strafurteile auszuführen. Der Plural „Gerichte“ wahrt den hebräischen Plural und seine konkreten Folgen.
- source_word: בְתוֹכֵךְ
  choice: mitten in dir
  rationale: Jerusalem wird als weibliche Einzahl angesprochen; die Formulierung bewahrt diese Personifizierung und bezeichnet das Geschehen innerhalb der Stadt.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: vor den Augen der Völker
  rationale: Gibt die bildhafte Wendung eng wieder und betont, dass das Gericht öffentlich und für die umliegenden Völker sichtbar erfolgt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Der Ausgangstext enthält neben dem Titel אֲדֹנָי ausdrücklich den Gottesnamen יהוה. „Der Herr Jahwe“ hält Titel und Eigenname auseinander und vermeidet die missverständliche Verdoppelung „Herr HERR“.
- issue: Art und Ort des angekündigten Gerichts
  choice: Gerichte mitten in Jerusalem vollstrecken
  alternative: allgemein über Jerusalem urteilen
  rationale: Der Plural מִשְׁפָּטִים bezeichnet im Zusammenhang konkrete Strafgerichte, während בְתוֹכֵךְ ausdrücklich deren Vollzug innerhalb der personifiziert angeredeten Stadt verortet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Formel. Die feminine Anrede Jerusalems bleibt durch „mitten in dir“ erkennbar; „Siehe“ erhält den feierlichen Ankündigungscharakter.
