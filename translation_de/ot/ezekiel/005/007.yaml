  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה יַ֤עַן הֲמָנְ/כֶם֙ מִן הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִיבֽוֹתֵי/כֶ֔ם בְּ/חֻקּוֹתַ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וְ/אֶת מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם לֹ֥א עֲשִׂיתֶֽם־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/007.yaml
  text: 'Therefore thus says the Lord GOD: Because you have been more turbulent than the nations that are around you[a], you have not walked in my statutes, and you have not carried out my judgments; and you have not even acted according to the judgments of the nations that are around you.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Weil ihr ungestümer wart als die Völker rings um euch[a], seid ihr nicht nach meinen Satzungen gegangen und habt meine Rechtsbestimmungen nicht befolgt; nicht einmal nach den Rechtsbestimmungen der Völker rings um euch habt ihr gehandelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ihr habt mehr getobt“, „ihr wart widerspenstiger“ oder vielleicht „ihr wart zahlreicher als die Völker rings um euch“. Das hebräische Wort ist schwer zu deuten; der Haupttext gibt es im Sinn eines übermäßigen, ungeordneten Aufbegehrens wieder, was zum Zusammenhang passt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen geläufige Wiedergabe des zusammengesetzten Gottestitels vermeidet die missverständliche Verdoppelung „Herr HERR“ und bewahrt sowohl den Herrschaftstitel als auch die besondere Kennzeichnung des Gottesnamens.
- source_word: יַעַן
  choice: Weil
  rationale: Leitet den Grund für das folgende Gerichtswort klar und idiomatisch ein.
- source_word: הֲמָנְכֶם
  choice: ihr ungestümer wart
  rationale: Der schwierige Ausdruck bezeichnet hier wahrscheinlich ein übermäßiges Aufbegehren, Toben oder ungeordnetes Verhalten. „Ungestümer“ bewahrt den Vergleich und legt die Bedeutung nicht vorschnell auf eine bestimmte moralische Kategorie fest.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: als die Völker rings um euch
  rationale: מִן wird nach dem vorausgehenden Ausdruck komparativ verstanden; die knappe Formulierung gibt diesen Vergleich natürlich wieder.
- source_word: בְּחֻקּוֹתַי לֹא הֲלַכְתֶּם
  choice: seid ihr nicht nach meinen Satzungen gegangen
  rationale: Bewahrt das hebräische Bild des Gehens als Lebensführung, bleibt aber im heutigen Deutsch verständlich.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: Gibt den normativen Sinn von מִשְׁפָּט wieder und erhält durch dieselbe Wortwahl im zweiten Vorkommen die bewusste Gegenüberstellung zu den Rechtsbestimmungen der Völker.
- source_word: לֹא עֲשִׂיתֶם
  choice: habt ... nicht befolgt
  rationale: Im Zusammenhang mit Gottes Rechtsbestimmungen drückt „befolgt“ die praktische Umsetzung idiomatisch aus.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם ... לֹא עֲשִׂיתֶם
  choice: nicht einmal nach den Rechtsbestimmungen der Völker rings um euch habt ihr gehandelt
  rationale: כ wird als Übereinstimmung („nach“) wiedergegeben. „Nicht einmal“ verdeutlicht die rhetorische Steigerung, ohne den im masoretischen Text ausdrücklich vorhandenen verneinten Satz umzukehren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens im Titel אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr Yahweh
  rationale: „Gott, der HERR“ ist eine würdevolle und weithin verständliche deutsche Wiedergabe der festen prophetischen Titelformel. Die Schreibung HERR kennzeichnet, dass im hebräischen Text der Gottesname steht, während „Gott“ hier den vorangestellten Herrschaftstitel wiedergibt.
- issue: Verhältnis Israels zu den Maßstäben der umliegenden Völker
  choice: 'Die doppelte Verneinung des masoretischen Textes bleibt erhalten: Israel befolgte weder Gottes Bestimmungen noch die der Völker.'
  alternative: Israel befolgte statt Gottes Bestimmungen die Bestimmungen der Völker.
  rationale: Der vorgelegte WLC-Text enthält auch im letzten Satz ausdrücklich לֹא. Die rhetorische Spannung wird nicht anhand abweichender Überlieferungen oder theologischer Erwartungen geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der feierlichen Form eines prophetischen Gerichtsworts, bleibt aber gut lesbar. „Rings um euch“ nimmt die wiederholte räumliche Formel knapp und natürlich auf; „Satzungen“ und „Rechtsbestimmungen“ unterscheiden die beiden hebräischen Rechtstermini.
