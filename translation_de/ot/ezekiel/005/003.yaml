base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/003.yaml
  text: And you shall take from there a few in number and bind them in the folds of your garment[a].
translation:
  language: de
  text: Und du sollst von dort einige wenige nehmen und sie in die Zipfel deines Gewandes[a] einbinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in deine Flügel“. Das hebräische Wort kann bei einem Gewand dessen Zipfel, Ecken oder Ränder bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Und du sollst … nehmen
  rationale: Das Qal Perfekt mit וְ setzt die prophetische Handlungsanweisung fort. Die deutsche Soll-Form bewahrt sowohl den Zukunftsbezug als auch den verpflichtenden Charakter.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die Ortsangabe wird formal entsprechend dem Hebräischen wiedergegeben und verweist im Zusammenhang auf die zuvor behandelten Haare.
- source_word: מְעַט בְּמִסְפָּר
  choice: einige wenige
  rationale: Die Formulierung bringt die ausdrücklich geringe Anzahl natürlich zum Ausdruck, ohne das Hebräische unnötig mit „wenige an Zahl“ nachzuahmen.
- source_word: וְצַרְתָּ
  choice: einbinden
  rationale: Das Verb bezeichnet hier ein festes Einbinden oder Umschließen. „Einbinden“ passt sowohl zu den wenigen Haaren als auch zum Saum des Gewandes.
- source_word: אוֹתָם
  choice: sie
  rationale: Das Pronomen verweist auf die wenigen zuvor genommenen Haare.
- source_word: בִּכְנָפֶיךָ
  choice: in den Saum deines Gewandes
  rationale: כָּנָף kann den Flügel sowie den Rand oder Zipfel eines Kleidungsstücks bezeichnen. Im Kontext der Zeichenhandlung ist der Gewandsaum gemeint; die Fußnote bewahrt die bildhafte und räumliche Spannweite des Ausdrucks.
