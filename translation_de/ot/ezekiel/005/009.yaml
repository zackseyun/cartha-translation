source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי בָ֗/ךְ אֵ֚ת אֲשֶׁ֣ר לֹֽא עָשִׂ֔יתִי וְ/אֵ֛ת אֲשֶֽׁר לֹֽא אֶעֱשֶׂ֥ה כָמֹ֖/הוּ ע֑וֹד יַ֖עַן כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/009.yaml
  text: And I will do in you what I have not done[a], and the like of which I will never do again, because of all your abominations.
translation:
  language: de
  text: Und ich werde in dir etwas tun, was ich noch nie getan habe und was ich nie wieder in gleicher Weise tun werde, wegen all deiner Gräueltaten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dir“ beziehungsweise „gegen dich“ statt „in dir“. Die hebräische Präposition bedeutet wörtlich „in“, kann in diesem Gerichtszusammenhang jedoch auch anders aufgefasst werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Und ich werde … tun
  rationale: Das breite Verb עשה wird schlicht mit „tun“ wiedergegeben; so bleibt die unerbittliche Gerichtsaussage erhalten, ohne die Handlung näher zu bestimmen als der hebräische Text.
- source_word: בָךְ
  choice: in dir
  rationale: Die Grundbedeutung der Präposition ב wird bewahrt. Im Zusammenhang ist Jerusalem als der Ort angesprochen, in dem das Gericht vollzogen wird; „gegen dich“ wäre bereits stärker auslegend.
- source_word: אֵת אֲשֶׁר לֹא עָשִׂיתִי
  choice: was ich noch nie getan habe
  rationale: Das Perfekt verneint eine entsprechende frühere Handlung. „Noch nie“ gibt diese zeitliche Rückschau im Deutschen natürlich wieder.
- source_word: וְאֵת אֲשֶׁר לֹא אֶעֱשֶׂה כָמֹהוּ עוֹד
  choice: und was ich in dieser Art nie wieder tun werde
  rationale: 'Die Formulierung bringt sowohl die verneinte künftige Wiederholung als auch den Vergleich כָמֹהוּ zum Ausdruck: Nichts dieser Art wird erneut geschehen.'
- source_word: יַעַן
  choice: wegen
  rationale: יַעַן leitet hier den Grund des angekündigten Gerichts ein; „wegen“ verbindet sich im Deutschen unmittelbar und natürlich mit der folgenden Nominalgruppe.
- source_word: כָל תּוֹעֲבֹתָיִךְ
  choice: all deiner abscheulichen Taten
  rationale: תּוֹעֵבָה bezeichnet etwas religiös oder moralisch Abscheuliches. „Abscheuliche Taten“ ist gegenwärtiges, verständliches Deutsch und macht deutlich, dass Praktiken beziehungsweise Handlungen gemeint sind.
theological_decisions:
- issue: Beispiellose Art des Gerichts
  choice: Die absolute Aussage über ein zuvor nie vollzogenes und künftig nie wiederholtes Gericht bleibt ungeschwächt stehen.
  alternative: Die Aussage lediglich als besonders schweres Gericht zu umschreiben.
  rationale: Der hebräische Wortlaut betont ausdrücklich die Einmaligkeit des Gerichts. Eine Abschwächung würde die rhetorische und theologische Spannung des Verses verringern.
- issue: Bedeutung von בָךְ bei Gottes Gerichtshandeln
  choice: „in dir“
  alternative: „gegen dich“ oder „an dir“
  rationale: Die wörtliche räumliche Aussage lässt offen, wie genau das göttliche Handeln zur Stadt in Beziehung steht, und bewahrt zugleich das Bild eines innerhalb Jerusalems vollzogenen Gerichts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede Jerusalems bleibt im Singular feminin („dir“, „deiner“). „Abscheuliche Taten“ vermeidet das im heutigen Allgemeingebrauch ungewohntere „Gräuel“, ohne die starke Wertung des hebräischen Begriffs abzuschwächen.
