base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/004.yaml
  text: And from them you shall take some more[a], and throw them into the midst of the fire and burn them in the fire. From it a fire will go out to all the house of Israel.
translation:
  language: de
  text: Und von ihnen sollst du noch einige nehmen, sie mitten ins Feuer werfen und sie im Feuer verbrennen. Von ihm[a] wird ein Feuer ausgehen zum ganzen Haus Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihm“. Das singularische Pronomen bezieht sich wahrscheinlich auf das zuvor genannte Feuer; manche verstehen den Ausdruck im Zusammenhang der Zeichenhandlung als „von ihnen“.'
    reason: Gibt die Singularform von מִמֶּנּוּ wieder, benennt den wahrscheinlichsten Bezug und bewahrt die abweichende Deutung als solche.
lexical_decisions:
- source_word: וּמֵהֶם עוֹד תִּקָּח
  choice: Und von ihnen sollst du noch einige nehmen
  rationale: „Von ihnen“ gibt den partitiven Bezug auf die zuvor zurückbehaltenen Haare wieder. „Noch einige“ drückt die zusätzliche Entnahme natürlich aus; „sollst du“ bewahrt den anweisenden Ton.
- source_word: וְהִשְׁלַכְתָּ אוֹתָם אֶל תּוֹךְ הָאֵשׁ
  choice: sie mitten ins Feuer werfen
  rationale: „Mitten ins Feuer“ erhält die ausdrückliche Bedeutung von תּוֹךְ und die Eindringlichkeit der Zeichenhandlung.
- source_word: וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ
  choice: und im Feuer verbrennen
  rationale: Die Formulierung folgt dem räumlichen Sinn der Präposition und vermeidet die unnötige Wiederholung des Pronomens im Deutschen.
- source_word: מִמֶּנּוּ
  choice: Von dort[a]
  rationale: Die räumliche Wiedergabe lässt den Bezug des singularischen Suffixes auf das unmittelbar geschilderte Feuer beziehungsweise Verbrennungsgeschehen offen, statt ihn im Deutschen durch ein geschlechtsspezifisches Pronomen vorschnell festzulegen.
- source_word: תֵצֵא אֵשׁ
  choice: wird ein Feuer ausgehen
  rationale: „Ausgehen“ bewahrt das hebräische Bild eines Feuers, das seinen Ausgang von der Zeichenhandlung nimmt.
- source_word: אֶל כָּל בֵּית יִשְׂרָאֵל
  choice: zum ganzen Haus Israel
  rationale: „Zum“ entspricht der Richtungsangabe אֶל genauer als „gegen“. „Haus Israel“ bleibt als national-bundestheologischer Ausdruck erhalten.
theological_decisions:
- issue: Ausgangspunkt des Feuers, das das ganze Haus Israel erreicht
  choice: Der Text lässt offen, ob das Feuer genauer vom bereits genannten Feuer oder vom gesamten Verbrennungsgeschehen ausgeht.
  alternative: Das Feuer geht ausdrücklich von den verbrannten Haaren aus.
  rationale: Das singularische מִמֶּנּוּ legt keinen pluralischen Rückbezug auf die Haare nahe, bestimmt seinen Bezug im Kontext aber nicht so eindeutig, dass die symbolische Mechanik in der Übersetzung festgelegt werden sollte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah an der hebräischen Zeichenhandlung, während „Von dort“ eine im Deutschen natürliche Formulierung bietet und den unsicheren Pronomenbezug nicht künstlich festlegt.
