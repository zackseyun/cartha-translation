  text: וְ/כָלָ֣ה אַפִּ֗/י וַ/הֲנִחוֹתִ֧י חֲמָתִ֛/י בָּ֖/ם וְ/הִנֶּחָ֑מְתִּי וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה דִּבַּ֨רְתִּי֙ בְּ/קִנְאָתִ֔/י בְּ/כַלּוֹתִ֥/י חֲמָתִ֖/י בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/013.yaml
  text: So my anger will be spent[a], and I will cause my wrath to rest on them, and I will be comforted. Then they will know that I, Yahweh, have spoken in my jealousy[b], when I spend my wrath against them.
translation:
  language: de
  text: Mein Zorn wird sich erschöpfen, und ich werde meinen Grimm auf ihnen ruhen lassen; und ich werde Trost finden.[a] Dann werden sie erkennen, dass ich, Jahwe, in meiner Eifersucht[b] gesprochen habe, wenn ich meinen Grimm an ihnen vollende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich werde Erleichterung finden“. Das hebräische Verb kann Trost oder Erleichterung nach vollzogenem Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in meinem Eifer“. Das hebräische Wort kann sowohl Eifersucht als auch leidenschaftlichen Eifer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָלָה אַפִּי
  choice: So wird sich mein Zorn erschöpfen
  rationale: כלה mit אַף bezeichnet, dass der Zorn vollständig auswirkt beziehungsweise an sein Ende gelangt. „Sich erschöpfen“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: וַהֲנִחוֹתִי חֲמָתִי בָּם
  choice: ich werde meinen Grimm auf ihnen ruhen lassen
  rationale: Der Hifil von נוח bedeutet hier, den Grimm auf ihnen zur Ruhe kommen zu lassen. Die Formulierung bleibt näher am hebräischen Bild als eine Deutung wie „meinen Grimm stillen“.
- source_word: וְהִנֶּחָמְתִּי
  choice: dann werde ich Genugtuung finden
  rationale: Der Nifal von נחם kann Trost, Erleichterung oder Genugtuung nach vollzogenem Gericht ausdrücken. „Genugtuung finden“ ist im Deutschen verständlich und wahrt den Zusammenhang, ohne das Verb als Abkehr vom Gericht zu deuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּקִנְאָתִי
  choice: in meiner Eifersucht
  rationale: קִנְאָה kann Eifersucht oder Eifer bedeuten. „Eifersucht“ bewahrt hier die relationale, bundestheologische Spannung.
- source_word: בְּכַלּוֹתִי חֲמָתִי בָּם
  choice: wenn ich meinen Grimm an ihnen vollende
  rationale: Der Infinitiv von כלה bezeichnet die vollständige Durchführung des Grimms; „an ihnen“ gibt ב als Ziel des Gerichtshandelns wieder.
theological_decisions:
- issue: Göttliche Gefühls- und Gerichtssprache
  choice: Zorn, Grimm, Eifersucht und Genugtuung werden als persönliche Aussagen beibehalten.
  alternative: Die Ausdrücke durch abstraktere Wendungen wie „Strafe“ oder „Gerechtigkeit“ abschwächen.
  rationale: Der hebräische Text formuliert Gottes Gericht ausdrücklich in emotionaler und relationaler Sprache. Die Übersetzung wahrt diese Spannung, statt sie systematisch aufzulösen.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname macht sichtbar, dass im Ausgangstext der persönliche Gottesname steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Begriffe „Zorn“ und „Grimm“ erhalten die lexikalische Unterscheidung zwischen אַף und חֵמָה. Die ungewöhnliche Bildsprache „Grimm auf ihnen ruhen lassen“ wurde bewusst bewahrt.
