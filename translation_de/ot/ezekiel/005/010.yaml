  text: לָ/כֵ֗ן אָב֞וֹת יֹאכְל֤וּ בָנִים֙ בְּ/תוֹכֵ֔/ךְ וּ/בָנִ֖ים יֹאכְל֣וּ אֲבוֹתָ֑/ם וְ/עָשִׂ֤יתִי בָ/ךְ֙ שְׁפָטִ֔ים וְ/זֵרִיתִ֥י אֶת כָּל שְׁאֵרִיתֵ֖/ךְ לְ/כָל רֽוּחַ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/010.yaml
  text: Therefore fathers will eat sons in your midst[a], and sons will eat their fathers[b]; and I will execute judgments on you and scatter all your remnant to every wind.
translation:
  language: de
  text: Darum werden Väter in deiner Mitte Söhne essen, und Söhne werden ihre Väter essen. Ich werde an dir Gerichte vollstrecken und deinen ganzen Rest[a] in alle Winde[b] zerstreuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle deine Überlebenden“ oder „alles, was von dir übrig ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu jedem Wind“; gemeint ist die vollständige Zerstreuung in alle Richtungen.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die folgende Ankündigung als Konsequenz aus der vorausgehenden Anklage und ist im modernen Deutsch natürlich und nachdrücklich.
- source_word: אָבוֹת ... בָנִים
  choice: Väter ... ihre Söhne
  rationale: Bewahrt die konkreten männlichen Verwandtschaftsbezeichnungen des Hebräischen und die erschütternde Umkehr familiärer Bindungen. Das Possessivpronomen ist im Deutschen zur eindeutigen, natürlichen Zuordnung ergänzt.
- source_word: בְּתוֹכֵךְ
  choice: in deiner Mitte
  rationale: Gibt die feminine Singularanrede an die Stadt beziehungsweise Gemeinschaft idiomatisch wieder.
- source_word: וּבָנִים יֹאכְלוּ אֲבוֹתָם
  choice: und Söhne werden ihre Väter essen
  rationale: Erhält die wechselseitige Aussage und übersetzt אכל mit dem gewöhnlichen Verb „essen“, ohne den Kannibalismus durch eine abschwächende Umschreibung zu verhüllen.
- source_word: וְעָשִׂיתִי בָךְ שְׁפָטִים
  choice: Ich werde an dir Gerichte vollstrecken
  rationale: Bewahrt den gerichtlichen Charakter der Wendung עשה + שפטים; „Gerichte vollstrecken“ bezeichnet hier Gottes konkrete Strafgerichte.
- source_word: כָּל שְׁאֵרִיתֵךְ
  choice: deinen ganzen Rest
  rationale: Gibt שְׁאֵרִית knapp wieder, ohne dem Ausdruck hier eine positive Hoffnungsaussage beizulegen. Eine Fußnote nennt die möglichen kontextuellen Verständnisse.
- source_word: וְזֵרִיתִי ... לְכָל רוּחַ
  choice: in alle Winde zerstreuen
  rationale: „Zerstreuen“ gibt זרה im Zusammenhang von Gericht und Vertreibung klar wieder; „in alle Winde“ erhält das hebräische Bild einer vollständigen Zerstreuung in sämtliche Richtungen.
theological_decisions:
- issue: Bedeutung von שְׁאֵרִית im Gerichtszusammenhang
  choice: Rest
  alternative: Überlebende; alles, was von dir übrig ist
  rationale: Der Ausdruck kann andernorts mit Hoffnung verbunden sein, bezeichnet hier jedoch das nach dem Gericht Verbliebene, das noch weiter zerstreut wird. „Rest“ bewahrt die lexikalische Offenheit, während der unmittelbare Zusammenhang jede unberechtigte positive Deutung verhindert.
- issue: Gerichtssprache in וְעָשִׂיתִי בָךְ שְׁפָטִים
  choice: Gerichte vollstrecken
  alternative: Strafen über dich bringen
  rationale: Die gewählte Fassung erhält die forensische Dimension des hebräischen Ausdrucks und verengt ihn nicht auf eine rein allgemeine Bezeichnung für Strafe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Aussage wird ohne Beschönigung wiedergegeben. Die feminine Singularanrede bleibt in „deiner“ und „dir“ erkennbar. Die Fußnotenmarker stehen an den tatsächlich erläuterten Ausdrücken.
