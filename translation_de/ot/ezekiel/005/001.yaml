  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם קַח לְ/ךָ֣ חֶ֣רֶב חַדָּ֗ה תַּ֤עַר הַ/גַּלָּבִים֙ תִּקָּחֶ֣/נָּה לָּ֔/ךְ וְ/הַעֲבַרְתָּ֥ עַל רֹאשְׁ/ךָ֖ וְ/עַל זְקָנֶ֑/ךָ וְ/לָקַחְתָּ֥ לְ/ךָ֛ מֹאזְנֵ֥י מִשְׁקָ֖ל וְ/חִלַּקְתָּֽ/ם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/001.yaml
  text: And you[a], son of man, take for yourself a sharp sword; take it as a barber’s razor, and pass it over your head and over your beard[b]. Then take for yourself scales for weighing and divide the hair.
translation:
  language: de
  text: Und du, Menschensohn, nimm dir ein scharfes Schwert. Nimm es dir als Rasiermesser[a] und fahre damit über deinen Kopf und deinen Bart. Dann nimm dir eine Waage zum Abwiegen und teile die Haare auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Rasiermesser der Barbiere«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische, wörtlich an die hebräische Wendung angelehnte Anrede und ist im Deutschen vertraut.
- source_word: חֶרֶב חַדָּה
  choice: ein scharfes Schwert
  rationale: Gibt Substantiv und Adjektiv direkt, klar und idiomatisch wieder.
- source_word: תַּעַר הַגַּלָּבִים
  choice: Rasiermesser
  rationale: Bezeichnet natürlich und verständlich das Messer eines Barbiers; die nähere hebräische Bestimmung wird in der Fußnote ausgewiesen.
- source_word: תִּקָּחֶנָּה לָּךְ
  choice: Benutze es
  rationale: Die Wiederholung von לקח leitet hier funktional zum Einsatz des Schwertes als Rasiermesser über. Die deutsche Formulierung macht den Handlungsablauf natürlich verständlich, ohne den Sinn zu erweitern.
- source_word: וְהַעֲבַרְתָּ עַל רֹאשְׁךָ וְעַל זְקָנֶךָ
  choice: fahre damit über deinen Kopf und deinen Bart
  rationale: Gibt das ausdrückliche Verb עבר samt der Präposition עַל wieder und lässt die symbolische Rasurhandlung konkret hervortreten.
- source_word: מֹאזְנֵי מִשְׁקָל
  choice: eine Waage zum Abwiegen
  rationale: Gibt die konkrete Waage beziehungsweise Balkenwaage in verständlichem modernem Deutsch wieder und erhält den Zweck des Wägens.
- source_word: וְחִלַּקְתָּם
  choice: teile die Haare auf
  rationale: Das pronominale Objekt bezieht sich kontextuell auf die durch das Rasieren gewonnenen Haare. Die ausdrückliche Nennung verhindert im Deutschen einen unklaren Bezug.
