id: EZK.5.14
reference: Ezekiel 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶתְּנֵ/ךְ֙ לְ/חָרְבָּ֣ה וּ/לְ/חֶרְפָּ֔ה בַּ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ לְ/עֵינֵ֖י כָּל עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/014.yaml
  text: And I will make you a ruin and a reproach among the nations that are around you[b][a], in the sight of everyone who passes by.
translation:
  language: de
  text: Ich werde dich zu einer Trümmerstätte[a] und zur Schmach[b] unter den Völkern rings um dich machen, vor den Augen aller, die vorübergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einer Einöde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Gegenstand des Hohns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵךְ
  choice: Ich werde dich … machen
  rationale: נתן bedeutet wörtlich „geben, setzen, stellen“, bezeichnet hier mit den durch לְ eingeleiteten Zustandsangaben jedoch idiomatisch das Versetzen Jerusalems in einen bestimmten Zustand. „Machen“ gibt diese Wirkung im Deutschen natürlich wieder.
- source_word: לְחָרְבָּה
  choice: zu einer Trümmerstätte
  rationale: חָרְבָּה bezeichnet einen verwüsteten, in Trümmern liegenden Ort beziehungsweise Zustand. „Trümmerstätte“ bewahrt das konkrete Bild einer zerstörten Stadt.
- source_word: וּלְחֶרְפָּה
  choice: und zur Schmach
  rationale: חֶרְפָּה kann Schmach, Hohn oder einen Gegenstand des Spotts bezeichnen. „Schmach“ bleibt knapp, quellennah und bewahrt die Spannung zwischen öffentlicher Entehrung und dem Spott der Umstehenden.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם meint hier die umliegenden Völker; „unter den Völkern“ ist kontextgerecht und vermeidet eine unangebrachte spezielle Juden-Heiden-Gegenüberstellung.
- source_word: אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: rings um dich
  rationale: Die Wendung bezeichnet die Völker, die Jerusalem umgeben. Die knappe deutsche Form ist natürlich und erhält den räumlichen Bezug.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die hebräische Redewendung hebt die öffentliche Sichtbarkeit des Gerichts hervor; die bildhafte Form lässt sich im Deutschen unmittelbar bewahren.
- source_word: כָּל עוֹבֵר
  choice: aller, die vorübergehen
  rationale: Das substantivierte Partizip bezeichnet jeden Vorübergehenden. Die Pluralform nach „aller“ klingt im modernen Deutsch natürlich und bewahrt den umfassenden Sinn von כָּל.
theological_decisions:
- issue: Personifizierung Jerusalems in der femininen Singularanrede
  choice: Die direkte Anrede „dich“ bleibt ohne ausdrückliche Ergänzung des Namens Jerusalem erhalten.
  alternative: Den Namen „Jerusalem“ erklärend in den Haupttext einsetzen.
  rationale: Das Hebräische redet die Stadt in der zweiten Person Femininum Singular direkt an. Die Beibehaltung der Anrede wahrt die prophetische Personifizierung und fügt kein im Vers fehlendes Substantiv ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die direkte Gerichtsankündigung zusammen; „Trümmerstätte“ ist anschaulich, während „Schmach“ die knappe und theologisch offene Ausdrucksweise des Hebräischen bewahrt.
