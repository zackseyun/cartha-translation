source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א יַ֚עַן אֶת מִקְדָּשִׁ֣/י טִמֵּ֔את בְּ/כָל שִׁקּוּצַ֖יִ/ךְ וּ/בְ/כָל תּוֹעֲבֹתָ֑יִ/ךְ וְ/גַם אֲנִ֤י אֶגְרַע֙ וְ/לֹא תָח֣וֹס עֵינִ֔/י וְ/גַם אֲנִ֖י לֹ֥א אֶחְמֽוֹל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, surely because you have defiled my sanctuary with all your detestable things and with all your abominations, I also will diminish you; my eye will not spare, and I also will show no pity.
translation:
  language: de
  text: 'Darum: So wahr ich lebe – Ausspruch des Herrn Jahwe –, weil du mein Heiligtum mit all deinen widerwärtigen Dingen und all deinen Gräueln verunreinigt hast, werde auch ich dich vermindern[a]. Mein Auge wird keine Schonung kennen, und auch ich werde kein Mitleid haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet „vermindern, wegnehmen“; sein Objekt wird im Hebräischen nicht ausdrücklich genannt.
    reason: Bewahrt die lexikalische und syntaktische Offenheit des knappen Ausdrucks אֶגְרַע, obwohl das Deutsche für die gewählte kontextuelle Wiedergabe „dich“ ergänzt.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als Folgerung aus dem vorausgehenden Zusammenhang die Gerichtsankündigung ein.
- source_word: חַי אָ֗נִי
  choice: so wahr ich lebe
  rationale: Gibt die feierliche göttliche Schwurformel in natürlichem, gehobenem Deutsch wieder.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: „Ausspruch“ wahrt den prophetischen Offenbarungscharakter von נְאֻם; „Jahwe“ gibt den Gottesnamen wieder und vermeidet die Verdopplung „Herr HERR“.
- source_word: אִם לֹא
  choice: in die deutsche Schwurformel „so wahr ich lebe“ einbezogen
  rationale: In einem Schwur wirkt אִם לֹא als nachdrückliche Bekräftigung, nicht als gewöhnlicher Bedingungssatz.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: Bezeichnet den geheiligten Kultort, ohne die Bedeutung unnötig auf das Bauwerk als Ganzes zu verengen.
- source_word: טִמֵּאת
  choice: verunreinigt hast
  rationale: Bewahrt sowohl die kultische als auch die sittliche Dimension des Verbs.
- source_word: שִׁקּוּצַיִךְ
  choice: deinen widerwärtigen Dingen
  rationale: Der Ausdruck kann verabscheute Gegenstände, besonders Kultobjekte, bezeichnen; die breite Wiedergabe vermeidet eine nicht ausdrücklich genannte Festlegung auf Götzenbilder.
- source_word: תּוֹעֲבֹתָיִךְ
  choice: deinen Gräueltaten
  rationale: Gibt die starke Wertung verabscheuungswürdiger religiöser oder sittlicher Vergehen wieder und unterscheidet den Ausdruck vom vorausgehenden שִׁקּוּצַיִךְ.
- source_word: אֶגְרַע
  choice: werde auch ich dich vermindern
  rationale: Bewahrt die Grundbedeutung „mindern, verringern“ und kennzeichnet durch die Fußnote, dass das knappe Hebräisch kein ausdrückliches Objekt nennt.
- source_word: לֹא תָחוֹס עֵינִי
  choice: Mein Auge wird keine Schonung kennen
  rationale: Erhält das hebräische Bild des Auges und formuliert es zugleich verständlich auf Deutsch.
- source_word: לֹא אֶחְמוֹל
  choice: auch ich werde kein Mitleid haben
  rationale: Bewahrt den Parallelismus und die ausdrückliche Verneinung göttlichen Erbarmens in diesem Gerichtswort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom ausdrücklich gesetzten Gottesnamen יהוה und vermeidet die unnatürliche Doppelung „Herr HERR“.
- issue: Reichweite des Gerichtsverbs אֶגְרַע
  choice: ich werde dich vermindern
  alternative: ich werde wegnehmen / ich werde dich niederhauen
  rationale: Das Verb ist knapp und sein Objekt bleibt im Hebräischen unausgesprochen. Die Übersetzung folgt der Grundbedeutung, ohne das Gericht auf den Entzug von Schutz oder auf eine bestimmte Art der Vernichtung festzulegen; die grammatische Ergänzung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlicher Schwur- und Prophetensprache. Die Gedankenstriche markieren die eingeschobene Botenformel; die beiden unterschiedlichen Ausdrücke für verabscheuungswürdige Dinge und Taten bleiben unterschieden.
