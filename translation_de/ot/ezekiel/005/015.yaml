  text: וְֽ/הָ֨יְתָ֜ה חֶרְפָּ֤ה וּ/גְדוּפָה֙ מוּסָ֣ר וּ/מְשַׁמָּ֔ה לַ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ בַּ/עֲשׂוֹתִ/י֩ בָ֨/ךְ שְׁפָטִ֜ים בְּ/אַ֤ף וּ/בְ/חֵמָה֙ וּ/בְ/תֹכְח֣וֹת חֵמָ֔ה אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/015.yaml
  text: And you shall become a reproach and a taunt[a], a warning and a horror, to the nations that are around you, when I execute judgments on you in anger and in wrath and with wrathful rebukes. I am Yahweh[c][b]; I have spoken.
translation:
  language: de
  text: Und du wirst für die Völker rings um dich zu Schmach und Spott, zu einer Warnung[a] und zum Entsetzen[b] werden, wenn ich in Zorn und Grimm und mit grimmigen Zurechtweisungen[c] Gerichte an dir vollstrecke. Ich, Jahwe, habe gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zur Unterweisung, Zucht oder Zurechtweisung. Gemeint ist hier, dass Jerusalem für die umliegenden Völker zu einem mahnenden Beispiel wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: zum Gegenstand des Entsetzens; das hebräische Wort kann auch Verwüstung oder bestürzte Erstarrung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: mit Zurechtweisungen des Grimms.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Und du wirst … zum Gegenstand
  rationale: Die feminine Singularform bezieht sich auf das direkt angeredete Jerusalem. Die deutsche Anrede mit „du“ bewahrt diese Personifizierung.
- source_word: חֶרְפָּה
  choice: Schmach
  rationale: „Schmach“ umfasst öffentliche Beschämung und Verachtung und passt zum prophetischen Gerichtswort.
- source_word: וּגְדוּפָה
  choice: Lästerung
  rationale: Das Substantiv bezeichnet Schmähung beziehungsweise beleidigendes Reden. „Lästerung“ hält diesen sprachlichen Aspekt von „Schmach“ unterscheidbar.
- source_word: מוּסָר
  choice: Warnung
  rationale: Im Zusammenhang wird Jerusalem durch das an ihm vollzogene Gericht zu einem mahnenden Beispiel für die Nachbarvölker. Eine Fußnote wahrt die weiteren Bedeutungen „Unterweisung“, „Zucht“ und „Zurechtweisung“.
- source_word: מְשַׁמָּה
  choice: Entsetzen
  rationale: Das Wort kann sowohl Verwüstung als auch die dadurch ausgelöste Bestürzung bezeichnen. In der Aufzählung dessen, wozu Jerusalem für die Völker wird, ist „Entsetzen“ natürlich und kontextgerecht.
- source_word: לַגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: für die Völker rings um dich
  rationale: Die Formulierung gibt sowohl die Beziehung zu den Völkern als auch ihre geografische Nähe knapp und idiomatisch wieder.
- source_word: בַּעֲשׂוֹתִי בָךְ שְׁפָטִים
  choice: wenn ich … Gericht an dir übe
  rationale: Die Infinitivkonstruktion ist zeitlich zu verstehen. Der Singular „Gericht“ ist im Deutschen idiomatisch und bewahrt den richterlichen Charakter, ohne vorschnell nur „Strafen“ zu sagen.
- source_word: בְּאַף וּבְחֵמָה
  choice: in Zorn und Grimm
  rationale: Die beiden Ausdrücke werden unterscheidbar wiedergegeben; „Grimm“ vermittelt die Steigerung von חֵמָה in würdigem, verständlichem Deutsch.
- source_word: וּבְתוֹכְחוֹת חֵמָה
  choice: und mit grimmigen Zurechtweisungen
  rationale: Die Wiedergabe bewahrt sowohl תוֹכְחוֹת („Zurechtweisungen“) als auch das qualifizierende חֵמָה („grimmig“).
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: Ich, Jahwe, habe gesprochen
  rationale: Die emphatische Selbstbezeichnung und die feierliche Abschlussformel bleiben erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מוּסָר in der Gerichtsaufzählung
  choice: Warnung
  alternative: Unterweisung; Zucht; Zurechtweisung
  rationale: Jerusalem wird durch das göttliche Gericht zu einem mahnenden Beispiel für die umliegenden Völker. Die lexikalische Spannweite wird in der Fußnote offengehalten.
- issue: Nuance von מְשַׁמָּה
  choice: Entsetzen
  alternative: Verwüstung; Gegenstand des Entsetzens; Erstarrung
  rationale: Die Konstruktion beschreibt, was Jerusalem für die Völker sein wird. „Entsetzen“ hebt deren Reaktion hervor, ohne die mögliche Verwüstungsnuance zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Viererreihe des Hebräischen bleibt erkennbar; „zum Gegenstand“ wird nur bei den ersten Gliedern ausdrücklich gesetzt und bei den folgenden sinngemäß mitgeführt. Die Häufung der Gerichtssprache und die Unterscheidung zwischen Zorn, Grimm und grimmigen Zurechtweisungen werden bewahrt.
