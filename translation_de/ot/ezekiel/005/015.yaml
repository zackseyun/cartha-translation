revisions:
- from: Und du wirst für die Völker rings um dich zum Gegenstand der Schmach und der Lästerung, zur Warnung[a] und zum Entsetzen[b], wenn ich in Zorn und Grimm und mit grimmigen Zurechtweisungen[c] Gericht an dir übe. Ich, Jahwe, habe gesprochen.
  to: Und du wirst für die Völker rings um dich zu Schmach und Spott, zu einer Warnung[a] und zum Entsetzen[b] werden, wenn ich in Zorn und Grimm und mit grimmigen Zurechtweisungen[c] Gerichte an dir vollstrecke. Ich, Jahwe, habe gesprochen.
  rationale: Die Revision ersetzt das missverständlicher religiös konnotierte „Lästerung“ durch „Spott“, stellt die vier Prädikatsnomen der hebräischen Reihe syntaktisch gleichmäßig dar und gibt die pluralischen „Gerichte“ ausdrücklich wieder. Aussagegehalt, Register, Gottesname und Fußnotenanker bleiben erhalten.
