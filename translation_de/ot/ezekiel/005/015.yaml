  naturalness: Die Fassung ist insgesamt würdig und gut verständlich. „Zu Schmach und Spott, zu einer Warnung und zum Entsetzen werden“ bildet die hebräische Aufzählung natürlicher und klarer ab als die Umschreibung „zum Gegenstand der Schmach und der Lästerung“.
  terminology: „Jahwe“, „Schmach“, „Warnung“, „Entsetzen“, „Zorn“, „Grimm“ und „Zurechtweisungen“ sind angemessen. Die Änderung zu „Spott“ vermeidet eine im modernen Deutsch ungewollt spezifisch religiöse Konnotation von „Lästerung“.
