  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה זֹ֚את יְר֣וּשָׁלִַ֔ם בְּ/ת֥וֹךְ הַ/גּוֹיִ֖ם שַׂמְתִּ֑י/הָ וּ/סְבִיבוֹתֶ֖י/הָ אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/005.yaml
  text: 'Thus says the Lord GOD: This is Jerusalem. I have set her in the midst of the nations[a], with lands all around her.'
translation:
  language: de
  text: 'So spricht der Herr Jahwe[a]: Das ist Jerusalem. Ich habe sie mitten unter die Völker gesetzt, und rings um sie her liegen Länder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Adonaj JHWH“, das heißt: „Herr Jahwe“; JHWH ist der Eigenname Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch und würdevoll im Präsens wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen vertraute Wiedergabe vermeidet das schwer verständliche „Herr HERR“; die Fußnote macht den hebräischen Wortlaut und den Gottesnamen transparent.
- source_word: זֹאת יְרוּשָׁלִַם
  choice: Das ist Jerusalem
  rationale: Das Demonstrativpronomen bezeichnet Jerusalem nachdrücklich und unmittelbar.
- source_word: בְּתוֹךְ הַגּוֹיִם
  choice: mitten unter die Völker
  rationale: „Mitten unter“ bewahrt die räumliche Vorstellung einer zentralen Platzierung stärker als das bloße „unter“.
- source_word: שַׂמְתִּיהָ
  choice: Ich habe sie … gesetzt
  rationale: Das Verb bezeichnet ein Setzen oder Platzieren; das feminine Pronomen erhält die im Hebräischen als weiblich behandelte Stadt.
- source_word: וּסְבִיבוֹתֶיהָ אֲרָצוֹת
  choice: und rings um sie her liegen Länder
  rationale: Die knappe hebräische Nominalfügung wird als natürlicher deutscher Satz wiedergegeben, ohne ein nicht ausdrücklich vorhandenes „alle“ einzufügen.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr Yahweh
  rationale: Die Hauptfassung folgt einer verständlichen deutschen Bibelkonvention, während die Fußnote offenlegt, dass im Hebräischen der Titel Adonaj mit dem Gottesnamen JHWH verbunden ist. So wird weder die Identität des Gottesnamens verschwiegen noch die deutsche Zeile durch „Herr HERR“ belastet.
- issue: Personifizierung Jerusalems
  choice: sie
  alternative: es
  rationale: Das feminine Suffix des Hebräischen stellt Jerusalem als weiblich vorgestellte Stadt dar; „sie“ bewahrt diese Personifizierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit dem würdevollen Ton einer prophetischen Gottesrede. Die Satzstellung hebt wie der hebräische Text Gottes Setzen Jerusalems hervor.
