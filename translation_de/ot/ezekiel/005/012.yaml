revisions:
- from: Ein Drittel von dir wird an der Pest sterben und in deiner Mitte vom Hunger verzehrt werden. Ein weiteres Drittel wird rings um dich durch das Schwert fallen. Das letzte Drittel werde ich in alle Winde zerstreuen[a], und hinter ihnen werde ich das Schwert ziehen[b].
  to: Ein Drittel von dir wird an einer Seuche sterben und durch Hungersnot in deiner Mitte aufgerieben werden. Ein Drittel wird rings um dich durch das Schwert fallen. Ein Drittel werde ich in alle Winde zerstreuen[a], und ich werde das Schwert hinter ihnen her ziehen[b].
  rationale: Die Revision stellt die dreifache, im Hebräischen gleichförmige Drittelgliederung wieder her und vermeidet damit die nicht belegte Nuance von „letzte“. „Hungersnot“ präzisiert רָעָב; „Seuche“ ist eine moderne, nicht zu eng spezifizierende Wiedergabe von דֶּבֶר. Das Schwertbild und die personifizierte Anrede bleiben unverändert erhalten. Die Fußnoten bleiben an den einschlägigen Bildern verankert.
