source:
  edition: WLC
  text: שְׁלִשִׁתֵ֞/יךְ בַּ/דֶּ֣בֶר יָמ֗וּתוּ וּ/בָֽ/רָעָב֙ יִכְל֣וּ בְ/תוֹכֵ֔/ךְ וְ/הַ֨/שְּׁלִשִׁ֔ית בַּ/חֶ֖רֶב יִפְּל֣וּ סְבִיבוֹתָ֑יִ/ךְ וְ/הַ/שְּׁלִישִׁית֙ לְ/כָל ר֣וּחַ אֱזָרֶ֔ה וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/012.yaml
  text: A third of you will die by pestilence and be consumed by famine in your midst[a], and a third will fall by the sword all around you, and a third I will scatter to every wind[b], and I will draw out a sword after them.
translation:
  language: de
  text: Ein Drittel von dir wird an einer Seuche sterben und durch Hungersnot in deiner Mitte aufgerieben werden. Ein Drittel wird rings um dich durch das Schwert fallen. Ein Drittel werde ich in alle Winde zerstreuen[a], und ich werde das Schwert hinter ihnen her ziehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu jedem Wind“; gemeint ist: in alle Richtungen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „und ich werde das Schwert hinter ihnen her aus der Scheide ziehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁתֵיךְ / הַשְּׁלִשִׁית / הַשְּׁלִישִׁית
  choice: ein Drittel / ein weiteres Drittel / das letzte Drittel
  rationale: Die dreifache Gliederung in gleich große Teile bleibt deutlich. Die leichte Variation ist im modernen Deutschen natürlicher und macht die Abfolge unmissverständlich.
- source_word: דֶּבֶר
  choice: Pest
  rationale: Im prophetischen Gerichtskontext bezeichnet das Wort eine tödliche Seuche. „Pest“ ist im Deutschen eine etablierte, prägnante Wiedergabe dieser Gerichtssprache, ohne zwingend nur die historische Beulenpest zu meinen.
- source_word: רָעָב
  choice: Hunger
  rationale: In Verbindung mit dem Verzehrtwerden bezeichnet das Wort tödlichen Hunger infolge einer Hungersnot. „Hunger“ ergibt hier die natürlichere deutsche Fügung, während die objektive Notlage im Kontext erhalten bleibt.
- source_word: יִכְלוּ
  choice: verzehrt werden
  rationale: Die Form bezeichnet das Aufgerieben- oder Vollständig-zu-Ende-Gebrachtwerden. „Verzehrt werden“ bewahrt die Härte und passt idiomatisch zu Hunger.
- source_word: בְּתוֹכֵךְ
  choice: in deiner Mitte
  rationale: Die feminine Singularform richtet sich an die personifizierte Stadt. Die Wendung bewahrt sowohl die direkte Anrede als auch den räumlichen Sinn innerhalb der Stadt.
- source_word: חֶרֶב
  choice: das Schwert
  rationale: Das konkrete Bild für gewaltsamen Tod im Krieg wird beibehalten und nicht zum abstrakten Begriff „Krieg“ verflacht.
- source_word: סְבִיבוֹתָיִךְ
  choice: rings um dich
  rationale: Die Form bezeichnet die Umgebung auf allen Seiten. „Rings um dich“ ist knapp, würdig und idiomatisch.
- source_word: לְכָל רוּחַ
  choice: in alle Winde
  rationale: Die hebräische Wendung lautet wörtlich „zu jedem Wind“ und meint eine Zerstreuung in alle Richtungen. Die entsprechende deutsche Bildrede bewahrt beides.
- source_word: אֱזָרֶה
  choice: werde ich zerstreuen
  rationale: Das Verb kann das Zerstreuen beziehungsweise Worfeln bezeichnen. Hier ist „zerstreuen“ klar und erhält die im Windbild angelegte Bewegung.
- source_word: אָרִיק
  choice: werde ich ... ziehen
  rationale: Beim Schwert bezeichnet das Verb dessen Herausziehen, also das Ziehen aus der Scheide. Die Formulierung bleibt nah am konkreten Bild und vermeidet eine erklärende Paraphrase.
theological_decisions:
- issue: Personifizierte Adressatin des Gerichts
  choice: Die feminine Anrede wird mit „dir“, „deiner“ und „dich“ beibehalten, ohne Jerusalem im Vers ausdrücklich einzufügen.
  alternative: Den Namen „Jerusalem“ erklärend in den Haupttext aufnehmen.
  rationale: Der hebräische Text spricht die Stadt unmittelbar als weiblich personifizierte Adressatin an. Eine ausdrückliche Identifizierung würde ergänzen, was in diesem Vers nicht steht.
- issue: Konkrete prophetische Gerichtsbilder
  choice: „Pest“, „Schwert“ und „alle Winde“ bleiben als konkrete Bilder erhalten.
  alternative: Dynamisch mit „Seuche“, „Krieg“ und „in alle Richtungen“ wiedergeben.
  rationale: Die Bilder sind im Deutschen verständlich und tragen die rhetorische Kraft des Textes. Ihre Bewahrung vermeidet eine theologische oder literarische Einebnung.
- issue: Fortdauernde Verfolgung nach der Zerstreuung
  choice: „Hinter ihnen werde ich das Schwert ziehen“ bleibt als bildhafte göttliche Gerichtsankündigung stehen.
  alternative: 'Explizit paraphrasieren: „Ich werde sie auch dort mit Krieg verfolgen.“'
  rationale: Der Ausgangstext lässt das konkrete Schwertbild für sich sprechen. Eine Paraphrase würde dessen Mehrdeutigkeit und Intensität unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Rhythmik. Die drei Drittel werden durch drei Sätze übersichtlich gegliedert. Die personifizierende feminine Anrede und die konkreten Gerichtsbilder des Hebräischen bleiben erhalten.
