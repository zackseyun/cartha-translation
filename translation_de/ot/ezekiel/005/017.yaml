  text: וְ/שִׁלַּחְתִּ֣י עֲ֠לֵי/כֶם רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וְ/שִׁכְּלֻ֔/ךְ וְ/דֶ֥בֶר וָ/דָ֖ם יַעֲבָר בָּ֑/ךְ וְ/חֶ֨רֶב֙ אָבִ֣יא עָלַ֔יִ/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/017.yaml
  text: And I will send famine and wild beasts against you[a], and they will bereave you; and pestilence and bloodshed will pass through you, and I will bring a sword upon you. I, Yahweh[d][c][b], have spoken.
translation:
  language: de
  text: Und ich werde Hungersnot und wilde Tiere[a] gegen euch schicken, und sie werden dich[d] deiner Kinder berauben[b]. Pest und Blut[c] werden durch dich hindurchziehen, und ich werde das Schwert über dich bringen. Ich, Jahwe, habe gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „böse“ oder „schlimme Tiere“; gemeint sind bedrohliche, wilde Tiere.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie werden dich kinderlos machen“. Das hebräische Verb bezeichnet gewöhnlich den Verlust von Kindern oder Nachkommen.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische hat „Blut“; gemeint sein kann hier Blutvergießen.
    reason: lexical_alternative
  - marker: d
    text: Im Hebräischen wechselt die Anrede von „euch“ am Versanfang zu „dich“ für das als Frau personifizierte Jerusalem.
    reason: textual_feature
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי עֲלֵיכֶם
  choice: Und ich werde … gegen euch schicken
  rationale: Das Piel bezeichnet Gottes aktives Senden der Gerichte; עַל hat hier feindliche Zielrichtung. Der Wechsel zum Plural „euch“ entspricht dem Hebräischen.
- source_word: רָעָב
  choice: Hunger
  rationale: Im Gerichtszusammenhang ist eine Hungersnot gemeint; „Hunger“ ist im Deutschen in einer Aufzählung von Gerichten natürlich und umfasst diese Bedeutung.
- source_word: וְחַיָּה רָעָה
  choice: und wilde Tiere
  rationale: Wörtlich steht „böses/schlimmes Getier“. „Wilde Tiere“ gibt die konkrete Bedrohung im heutigen Deutsch klar wieder, ohne die Tiere moralisch zu qualifizieren.
- source_word: וְשִׁכְּלֻךְ
  choice: und sie werden dich deiner Kinder berauben
  rationale: שׁכל bezeichnet häufig den Verlust von Kindern beziehungsweise Nachkommen. Die feminine Singularform „dich“ richtet sich an das personifizierte Jerusalem; „deiner Kinder“ macht den im Verb liegenden Sinn verständlich.
- source_word: וְדֶבֶר
  choice: Pest
  rationale: דֶּבֶר bezeichnet in prophetischen Gerichtsreihen eine tödliche Seuche. „Pest“ bewahrt den ernsten biblischen Ton und ist allgemein verständlich.
- source_word: וָדָם
  choice: und Blut
  rationale: Die Übersetzung hält die konkrete und mehrdeutige Bildsprache des hebräischen דָם fest; im Zusammenhang kann damit Blutvergießen gemeint sein.
- source_word: יַעֲבָר בָּךְ
  choice: werden durch dich hindurchziehen
  rationale: Die Stadt wird feminin singularisch angesprochen. Der deutsche Plural folgt den beiden koordinierten Größen „Pest und Blut“, während das Bild des Hindurchziehens erhalten bleibt.
- source_word: וְחֶרֶב אָבִיא עָלַיִךְ
  choice: und ich werde das Schwert über dich bringen
  rationale: Das konkrete Gerichtsbild „Schwert“ wird nicht zu „Krieg“ verallgemeinert. „Über dich bringen“ entspricht der deutschen prophetischen Redeweise.
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: Ich, Jahwe, habe gesprochen
  rationale: Das betonte Pronomen und die feierliche Abschlussformel bleiben erhalten. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher sichtbar gemacht; „Jahwe“ ist die geläufige deutsche Form der wissenschaftlich üblichen Rekonstruktion.
- issue: Bedeutungsumfang von שׁכל
  choice: dich deiner Kinder berauben
  alternative: dich kinderlos machen / dich berauben
  rationale: Der häufige Bezug des Verbs auf den Verlust von Kindern wird ausgedrückt, ohne festzulegen, welches einzelne Gericht diesen Verlust verursacht.
- issue: Wiedergabe von דָם
  choice: Blut
  alternative: Blutvergießen
  rationale: Die wörtliche Bildsprache und ihre mögliche Mehrdeutigkeit bleiben im Haupttext erhalten; die wahrscheinliche Bedeutung „Blutvergießen“ wird in der Fußnote genannt.
- issue: Numeruswechsel in der Anrede
  choice: euch … dich
  alternative: durchgehend „dich“ oder „euch“
  rationale: Der auffällige Wechsel vom maskulinen Plural עֲלֵיכֶם zum femininen Singular in den folgenden Suffixen wird bewahrt und nicht harmonisiert; der Singular richtet sich an Jerusalem als personifizierte Stadt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter prophetischer Bildsprache. Der Wechsel zwischen pluralischer und singularischer Anrede sowie die Mehrdeutigkeit von „Blut“ werden nicht stillschweigend geglättet.
