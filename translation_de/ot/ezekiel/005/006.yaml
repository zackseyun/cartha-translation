  text: וַ/תֶּ֨מֶר אֶת מִשְׁפָּטַ֤/י לְ/רִשְׁעָה֙ מִן הַ/גּוֹיִ֔ם וְ/אֶ֨ת חֻקּוֹתַ֔/י מִן הָ/אֲרָצ֖וֹת אֲשֶׁ֣ר סְבִיבוֹתֶ֑י/הָ כִּ֤י בְ/מִשְׁפָּטַ/י֙ מָאָ֔סוּ וְ/חֻקּוֹתַ֖/י לֹא הָלְכ֥וּ בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/006.yaml
  text: And she rebelled against my judgments with wickedness more than the nations[a], and against my statutes more than the lands that are around her; for they rejected my judgments[b], and they did not walk in my statutes.
translation:
  language: de
  text: Doch sie lehnte sich in ihrer Bosheit stärker gegen meine Rechtsbestimmungen auf als die Völker[a] und gegen meine Satzungen stärker als die Länder rings um sie. Denn sie verwarfen meine Rechtsbestimmungen und lebten nicht nach meinen Satzungen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch sie verkehrte meine Rechtsbestimmungen ins Böse, mehr als die Völker.“ Das hebräische Verb kann hier als Auflehnung oder als verderbliche Veränderung des von Gott Gegebenen verstanden werden; der Haupttext folgt dem im Bundeskontext naheliegenden Sinn „sich auflehnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie gingen nicht in ihnen.“ Das hebräische Bild meint, sein Leben nach den Satzungen auszurichten.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֶּמֶר
  choice: sie lehnte sich … auf
  rationale: Die Form wird im Bundeskontext am besten von מרה im Sinn von Auflehnung und Ungehorsam verstanden. Das feminine Singular bewahrt die Personifikation Jerusalems.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet hier verbindliche göttliche Rechtsnormen. „Rechtsbestimmungen“ erhält den juristischen Klang und bleibt von חֻקּוֹתַי unterschieden.
- source_word: לְרִשְׁעָה
  choice: in ihrer Bosheit
  rationale: Die Wendung kennzeichnet die Auflehnung als böse beziehungsweise frevelhaft. Die deutsche Formulierung gibt den adverbialen Sinn natürlich wieder, ohne die zugrunde liegende Substantivform ganz aufzulösen.
- source_word: מִן הַגּוֹיִם
  choice: stärker … als die Völker
  rationale: מִן hat im Satzgefüge komparative Funktion. „Völker“ gibt גּוֹיִם im prophetischen Kontext angemessen wieder.
- source_word: חֻקּוֹתַי
  choice: meine Satzungen
  rationale: „Satzungen“ ist eine etablierte, würdige Wiedergabe des gesetzlichen Bundesbegriffs und wahrt die Unterscheidung von מִשְׁפָּטַי.
- source_word: מִן הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ
  choice: stärker als die Länder rings um sie
  rationale: Auch hier ist מִן komparativ. „Länder“ bewahrt den territorialen Sinn von אֲרָצוֹת; das feminine Suffix bezieht sich auf die personifizierte Stadt.
- source_word: מָאָסוּ
  choice: sie verwarfen
  rationale: מאס bezeichnet entschiedene, oft geringschätzige Zurückweisung. „Verwarfen“ trifft den gehobenen prophetischen und rechtlich-bundeshaften Ton.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: lebten nicht nach meinen Satzungen
  rationale: Das hebräische Bild vom „Gehen in“ den Satzungen bezeichnet die praktische Lebensführung nach ihnen. Die idiomatische deutsche Wiedergabe ist unmittelbar verständlich.
theological_decisions:
- issue: Personifiziertes Jerusalem und Wechsel zum Plural
  choice: Das feminine „sie“ bleibt im ersten Satz für Jerusalem erhalten; im Begründungssatz bleibt der hebräische Plural „sie“ für die Bewohner bestehen.
  alternative: Jerusalem ausdrücklich nennen oder beide Verbformen grammatisch angleichen.
  rationale: 'Der grammatische Wechsel gehört zur prophetischen Darstellung: Die Stadt wird zunächst als weibliche Person angesprochen, danach treten ihre Bewohner als handelnde Gemeinschaft hervor.'
- issue: Unterscheidung der beiden Rechtstermini
  choice: מִשְׁפָּטַי wird mit „Rechtsbestimmungen“, חֻקּוֹתַי mit „Satzungen“ wiedergegeben.
  alternative: Beide Begriffe unterschiedslos mit „Gesetze“ übersetzen.
  rationale: Die differenzierte Wiedergabe erhält die parallele rechtlich-bundeshafte Begrifflichkeit des hebräischen Textes, ohne einen künstlich scharfen theologischen Gegensatz zu behaupten.
- issue: Deutung von וַתֶּמֶר
  choice: Auflehnung gegen Gottes Rechtsbestimmungen.
  alternative: Veränderung beziehungsweise Verkehrung der Rechtsbestimmungen ins Böse.
  rationale: Der Zusammenhang stützt die Bedeutung „sich widersetzen“, doch die Form und ältere Übersetzungstraditionen lassen die alternative Deutung als Veränderung oder Verkehrung zu; diese bleibt deshalb in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-rechtlichem Klang. Die Personifikation Jerusalems, der anschließende Numeruswechsel und die Unterscheidung der beiden hebräischen Rechtstermini bleiben erhalten. Die schwerfällige hebräische Vergleichskonstruktion wurde mit „stärker … als“ natürlich, aber strukturell eng wiedergegeben.
