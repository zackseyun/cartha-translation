source:
  edition: WLC
  text: שְׁלִשִׁ֗ית בָּ/א֤וּר תַּבְעִיר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר כִּ/מְלֹ֖את יְמֵ֣י הַ/מָּצ֑וֹר וְ/לָֽקַחְתָּ֣ אֶת הַ/שְּׁלִשִׁ֗ית תַּכֶּ֤ה בַ/חֶ֨רֶב֙ סְבִ֣יבוֹתֶ֔י/הָ וְ/הַ/שְּׁלִשִׁית֙ תִּזְרֶ֣ה לָ/ר֔וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/002.yaml
  text: A third you shall burn in the fire in the midst of the city[a], when the days of the siege are completed; and you shall take a third and strike it with the sword all around the city, and a third you shall scatter to the wind[c][b], and I will draw out a sword after them.
translation:
  language: de
  text: Ein Drittel sollst du im Feuer mitten in der Stadt verbrennen, wenn die Tage der Belagerung vollendet sind[a]. Dann sollst du ein Drittel nehmen und es rings um die Stadt mit dem Schwert schlagen. Ein Drittel sollst du in den Wind zerstreuen[b], und ich werde hinter ihnen her das Schwert ziehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wenn die Tage der Belagerung erfüllt sind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „in alle Winde zerstreuen“; im Hebräischen steht „Wind“ im Singular.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „und ich werde hinter ihnen her das Schwert zücken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁית / הַשְּׁלִשִׁית
  choice: ein Drittel
  rationale: Die substantivisch gebrauchte Form bezeichnet jeweils einen der drei Teile des geteilten Haars; „ein Drittel“ ist im modernen Deutsch klar und bewahrt die dreifache Gliederung.
- source_word: בָּאוּר תַּבְעִיר
  choice: im Feuer … verbrennen
  rationale: Der Hifil von בער bezeichnet das Verursachen des Brennens. Die Wendung gibt sowohl das Feuer als Mittel beziehungsweise Ort als auch die aktive Handlung natürlich wieder.
- source_word: בְּתוֹךְ הָעִיר
  choice: mitten in der Stadt
  rationale: Die Formulierung bewahrt die räumliche Anschaulichkeit von תּוֹךְ und klingt zugleich gegenwärtig und würdig.
- source_word: כִּמְלֹאת יְמֵי הַמָּצוֹר
  choice: wenn die Tage der Belagerung vollendet sind
  rationale: כ mit dem Infinitiv constructus bezeichnet hier den Zeitpunkt, an dem die festgesetzte Belagerungszeit ihr Ende beziehungsweise volles Maß erreicht.
- source_word: תַּכֶּה בַחֶרֶב
  choice: mit dem Schwert schlagen
  rationale: נכה bezeichnet hier das Schlagen mit einer Waffe; das instrumentale ב wird natürlich mit „mit“ wiedergegeben.
- source_word: סְבִיבוֹתֶיהָ
  choice: rings um die Stadt
  rationale: Das feminine Suffix verweist auf die Stadt. Die ausdrückliche Wiederaufnahme vermeidet im Deutschen ein unklares Pronomen und erhält die räumliche Aussage.
- source_word: תִּזְרֶה לָרוּחַ
  choice: in den Wind zerstreuen
  rationale: זרה kann „zerstreuen“ oder „worfeln“ bedeuten. Im Zeichenakt steht die Verteilung beziehungsweise Vertreibung im Vordergrund; der Singular „Wind“ entspricht dem Hebräischen.
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: und ich werde ein Schwert hinter ihnen her ziehen
  rationale: Die Wendung bewahrt das Bild des gezogenen Schwertes, die feindliche Verfolgungsrichtung von אַחֲרֵיהֶם und den auffälligen Wechsel zur ersten Person Gottes.
theological_decisions:
- issue: Sprecherwechsel im letzten Satzteil
  choice: 'Die erste Person bleibt ausdrücklich erhalten: „ich werde …“'
  alternative: Die Aussage unpersönlich als allgemeines Gerichtsgeschehen formulieren
  rationale: אָרִיק steht in der ersten Person Singular. Der Wechsel von den Anweisungen an Ezechiel zum Handeln Gottes zeigt, dass das angekündigte Gericht letztlich von Gott ausgeht, ohne die Aussage weiter dogmatisch auszudeuten.
- issue: Bezug des pluralischen Suffixes in אַחֲרֵיהֶם
  choice: „hinter ihnen her“
  alternative: Den Bezug durch „hinter den Zerstreuten her“ ausdrücklich festlegen
  rationale: Das Hebräische verwendet ein maskulines Pluralsuffix, dessen Bezug im Bildzusammenhang verständlich, aber nicht ausdrücklich benannt ist. Das Pronomen bewahrt diese Form und die Spannung des Textes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die wiederholte Formulierung „ein Drittel“ bildet den dreiteiligen Zeichenakt deutlich ab. Kurze Hauptsätze vermeiden unnötige Altertümlichkeit; „vollendet“ und das Bild vom gezogenen Schwert erhalten zugleich die feierliche Schärfe des Ausgangstextes.
