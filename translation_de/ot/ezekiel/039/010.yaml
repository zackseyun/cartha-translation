base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/010.yaml
  text: They will not carry wood from the field[a], nor cut it from the forests, because they will make fires with the weapons. They will plunder those who plundered them and loot those who looted them[b], declares the Lord Yahweh.
translation:
  language: de
  text: Sie werden weder Holz vom Feld holen noch in den Wäldern Holz schlagen, denn mit den Waffen werden sie Feuer unterhalten.[a] Sie werden ihre Plünderer ausplündern und ihre Räuber berauben.[b] – Ausspruch des Herrn Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und ungewohnt: „Denn mit den Waffen werden sie Feuer brennen lassen“; gemeint ist, dass die Waffen der Eindringlinge als Brennmaterial dienen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen werden jeweils Wörter desselben Stammes wiederholt: „Sie werden ihre Plünderer ausplündern und ihre Räuber berauben.“ Dadurch werden Umkehrung und Vergeltung hervorgehoben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ עֵצִים מִן הַשָּׂדֶה
  choice: Holz vom Feld holen
  rationale: נשא bezeichnet hier das Herbeischaffen von Brennholz. „Holen“ ist im Deutschen natürlicher als „tragen“ und lässt offen, ob das Holz gesammelt oder von anderswo gebracht wird; שדה steht singularisch und kollektiv.
- source_word: יַחְטְבוּ מִן הַיְּעָרִים
  choice: in den Wäldern schlagen
  rationale: חטב bezeichnet das Schlagen beziehungsweise Hauen von Holz. Die deutsche Wendung „Holz im Wald schlagen“ gibt den gemeinten Vorgang idiomatisch wieder und bewahrt den Plural „Wälder“.
- source_word: כִּי בַנֶּשֶׁק יְבַעֲרוּ אֵשׁ
  choice: denn mit den Waffen werden sie Feuer machen
  rationale: כִּי begründet, warum kein Brennholz benötigt wird. בַנֶּשֶׁק ist instrumental; die Waffen der Angreifer dienen als Brennmaterial. Die Formulierung bleibt nahe am ungewöhnlichen hebräischen Ausdruck.
- source_word: וְשָׁלְלוּ אֶת שֹׁלְלֵיהֶם
  choice: Sie werden die ausplündern, die sie ausgeplündert haben
  rationale: Die Wiederholung desselben deutschen Verbstamms bildet die hebräische figura etymologica nach und betont die Umkehrung zwischen Plünderern und Geplünderten.
- source_word: וּבָזְזוּ אֶת בֹּזְזֵיהֶם
  choice: und die berauben, die sie beraubt haben
  rationale: Auch beim zweiten hebräischen Wortpaar wird die Stammwiederholung erhalten. „Berauben“ unterscheidet dieses Paar vom vorangehenden שלל, ohne die enge Bedeutungsnähe zu verdecken.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. „Herr“ gibt אֲדֹנָי wieder, während „Jahwe“ den Gottesnamen יהוה als Namen erkennbar hält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der Herr
  rationale: Die direkte Wiedergabe als „Herr Jahwe“ unterscheidet Titel und Eigenname und entspricht damit der hebräischen Form, ohne beide zu einem einzigen traditionellen Ersatztitel zu verschmelzen.
- issue: Umkehrung von Plünderung und Raub
  choice: Die beiden parallelen Vergeltungsaussagen bleiben ohne zusätzliche moralische Deutung stehen.
  alternative: Eine erläuternde Wiedergabe als ausdrückliche göttliche Vergeltung
  rationale: Der Text stellt die Umkehrung eindrücklich dar, bezeichnet sie in diesem Vers aber nicht ausdrücklich mit einem theologischen Fachbegriff. Eine solche Auslegung wird daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am prophetischen Hebräisch, während „Holz holen“, „Holz schlagen“ und „Feuer machen“ gegenwärtig und allgemein verständlich sind. Die beiden hebräischen Stammwiederholungen werden im Deutschen bewusst nachgebildet.
