revisions:
- from: Sie werden kein Holz vom Feld holen und keines in den Wäldern schlagen, denn mit den Waffen werden sie Feuer machen.[a] Sie werden die ausplündern, die sie ausgeplündert haben, und die berauben, die sie beraubt haben.[b] – Ausspruch des Herrn Jahwe.
  to: Sie werden weder Holz vom Feld holen noch in den Wäldern Holz schlagen, denn mit den Waffen werden sie Feuer unterhalten.[a] Sie werden ihre Plünderer ausplündern und ihre Räuber berauben.[b] – Ausspruch des Herrn Jahwe.
  rationale: Die Revision beseitigt die deutsche Bezugsmehrdeutigkeit im zweiten Satz durch die dem Hebräischen entsprechende Formulierung mit „ihre Plünderer“ und „ihre Räuber“. Zugleich wird die Brennstofffunktion der Waffen mit „Feuer unterhalten“ klar und idiomatisch ausgedrückt. Gottesname, prophetische Formel, Parallelismus und die beiden hebräischen Stammwiederholungen bleiben erhalten.
