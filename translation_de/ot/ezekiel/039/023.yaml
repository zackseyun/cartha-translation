  naturalness: Die Sprache ist insgesamt würdig und modern verständlich. Auf „das Haus Israel wegen seiner Schuld“ folgt derzeit „weil sie … brachen“; dieser Wechsel ist im modernen Standarddeutsch störend. Die revidierte Fassung führt den Kollektivbegriff zunächst im Singular und greift beim abschließenden „alle“ die im Hebräischen vorliegende plurale Gesamtheit auf.
