  to: Und die Nationen werden erkennen, dass das Haus Israel wegen seiner Schuld in die Verbannung ging, weil es mir die Treue brach[a]. Darum verbarg ich mein Angesicht vor ihm und gab es in die Hand seiner Bedränger[b], und alle fielen durch das Schwert.
  rationale: Die Revision behebt den störenden Wechsel zwischen singularischem „Haus Israel“ und pluralischem Personalpronomen, ohne die Bedeutung zu verändern. Das abschließende „alle“ bleibt als Wiedergabe von כֻּלָּם erhalten und bezieht sich, wie im Hebräischen, auf die Angehörigen des kollektiven „Hauses Israel“. Die Fußnote zu a wurde entsprechend dem singularischen deutschen Bezug angepasst.
