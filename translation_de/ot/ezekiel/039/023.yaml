  text: וְ/יָדְע֣וּ הַ֠/גּוֹיִם כִּ֣י בַ/עֲוֺנָ֞/ם גָּל֣וּ בֵֽית יִשְׂרָאֵ֗ל עַ֚ל אֲשֶׁ֣ר מָֽעֲלוּ בִ֔/י וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶ֑ם וָֽ/אֶתְּנֵ/ם֙ בְּ/יַ֣ד צָרֵי/הֶ֔ם וַ/יִּפְּל֥וּ בַ/חֶ֖רֶב כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/023.yaml
  text: And the nations will know that the house of Israel went into exile for their iniquity[a], because they acted unfaithfully against me; so I hid my face from them and gave them into the hand of their adversaries[b], and they all fell by the sword.
translation:
  language: de
  text: Und die Nationen werden erkennen, dass das Haus Israel wegen seiner Schuld in die Verbannung ging, weil es mir die Treue brach[a]. Darum verbarg ich mein Angesicht vor ihm und gab es in die Hand seiner Bedränger[b], und alle fielen durch das Schwert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil es treulos gegen mich handelte“ / „weil es an mir treulos handelte“. Das hebräische Verb bezeichnet einen Treue- oder Vertrauensbruch, häufig im Rahmen der Beziehung zu Gott.'
    reason: lexical_alternative
  - marker: b
    text: „In die Hand“ ist ein hebräisches Bild dafür, der Macht oder Verfügungsgewalt eines anderen ausgeliefert zu sein.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיָדְעוּ הַגּוֹיִם
  choice: Und die Nationen werden erkennen
  rationale: Die prophetische Verbform wird zukunftsbezogen wiedergegeben. „Erkennen“ bewahrt das für Ezechiel wichtige Motiv, dass die Nationen durch Gottes Handeln zu einer Einsicht gelangen.
- source_word: בַעֲוֺנָם
  choice: wegen ihrer Schuld
  rationale: עָוֹן kann sowohl die schuldhafte Verfehlung als auch die daraus erwachsende Schuld bezeichnen. „Schuld“ wahrt die moralische und rechtliche Tragweite und passt idiomatisch zur Begründung der Verbannung.
- source_word: גָּלוּ בֵית יִשְׂרָאֵל
  choice: das Haus Israel … in die Verbannung ging
  rationale: Die aktive Form „ging in die Verbannung“ folgt dem Qal des hebräischen Verbs, ohne den geschichtlichen Zwang zur Deportation zu leugnen. „Haus Israel“ erhält die kollektive, bundestheologische Bezeichnung.
- source_word: מָעֲלוּ בִי
  choice: sie mir die Treue brachen
  rationale: מעל bezeichnet einen treulosen Vertrauens- oder Bundesbruch. Die Wendung ist im modernen Deutschen klar und bewahrt stärker als das allgemeine „untreu handeln“ den Gedanken eines gebrochenen Treueverhältnisses.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: Darum verbarg ich mein Angesicht vor ihnen
  rationale: Das bedeutungsvolle biblische Bild vom Verbergen des Angesichts bleibt erhalten. „Darum“ macht den im Zusammenhang erkennbaren Folgezusammenhang deutlich.
- source_word: וָאֶתְּנֵם בְּיַד צָרֵיהֶם
  choice: und gab sie in die Hand ihrer Bedränger
  rationale: Die hebräische Hand-Metapher für Macht und Verfügungsgewalt wird im Haupttext bewahrt. צָר bezeichnet hier feindliche Bedränger oder Widersacher.
- source_word: וַיִּפְּלוּ בַחֶרֶב כֻּלָּם
  choice: sodass sie alle durch das Schwert fielen
  rationale: „Durch das Schwert fallen“ gibt das hebräische Bild für gewaltsamen Tod in Krieg und Gericht würdig und verständlich wieder; „alle“ erhält die umfassende Aussage.
theological_decisions:
- issue: Zusammenhang zwischen Israels Schuld, Gottes verborgenem Angesicht und dem Gericht
  choice: Die Verbannung und der Tod durch das Schwert werden als Folge von Israels Schuld und Treuebruch dargestellt; zugleich wird Gottes aktives Übergeben an die Feinde ausdrücklich bewahrt.
  alternative: Eine rein historische oder passive Darstellung der Verbannung, die Gottes Gerichtshandeln in den Hintergrund treten lässt.
  rationale: Der hebräische Text verbindet Israels Schuld und Treuebruch ausdrücklich mit Gottes Verbergen seines Angesichts und seinem Übergeben Israels in feindliche Gewalt. Die Übersetzung wahrt sowohl menschliche Verantwortung als auch göttliches Handeln.
- issue: Beziehungsdimension von מָעֲלוּ בִי
  choice: „sie mir die Treue brachen“
  alternative: „sie vergingen sich an mir“ oder „sie handelten treulos gegen mich“
  rationale: Die gewählte Formulierung macht den im Verb angelegten Treuebruch sichtbar, ohne eine bestimmte konfessionelle Bundestheologie über den Wortlaut hinaus festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionellen und theologisch gewichtigen Bilder „Haus Israel“, „mein Angesicht verbergen“, „in die Hand geben“ und „durch das Schwert fallen“ bleiben erhalten; weniger geläufige Bedeutungsaspekte werden knapp in Fußnoten erläutert.
