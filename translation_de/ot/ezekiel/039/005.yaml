  text: עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה תִּפּ֑וֹל כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/005.yaml
  text: You will fall on the open field[a], for I have spoken[c][b], declares the Lord GOD.
translation:
  language: de
  text: Auf freiem Feld wirst du fallen[a]; denn ich habe gesprochen – Spruch des Herrn Jahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf der Oberfläche des Feldes“; gemeint ist draußen auf offenem Feld.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: Adonaj JHWH; Adonaj bedeutet „Herr“, JHWH ist der Gottesname, hier mit „Jahwe“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: auf freiem Feld
  rationale: Die Wendung bedeutet wörtlich „auf der Oberfläche des Feldes“, bezeichnet hier aber idiomatisch das offene, ungeschützte Feld. „Auf freiem Feld“ ist natürliches Deutsch und bewahrt diesen Sinn.
- source_word: תִּפּוֹל
  choice: wirst du fallen
  rationale: Das Verb ist ein Imperfekt in der 2. Person maskulin Singular und richtet sich an Gog. Die Zukunftsform gibt die prophetische Ankündigung klar und ohne unnötig altertümlichen Klang wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund beziehungsweise die Bekräftigung der vorausgehenden Ankündigung ein. „Denn“ passt zum gehobenen prophetischen Sprachregister.
- source_word: דִבַּרְתִּי
  choice: ich habe gesprochen
  rationale: Das hebräische Perfekt betont hier die bereits ausgesprochene und damit feststehende göttliche Entscheidung.
- source_word: נְאֻם
  choice: so spricht
  rationale: Die feste prophetische Botenformel wird mit der im Deutschen natürlichen und würdevollen Wendung „so spricht“ wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: אֲדֹנָי wird als Titel „der Herr“ wiedergegeben; der Eigenname יהוה bleibt als „Jahwe“ erkennbar, statt beide Bestandteile zu einem doppelten Herrentitel anzugleichen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr; der Herr, der HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und vermeidet dadurch sowohl eine Verschleierung des Namens als auch die unnatürliche Wiederholung „Herr HERR“.
- issue: Gewissheit der prophetischen Ankündigung
  choice: wirst du fallen
  alternative: du sollst fallen; du fällst
  rationale: Die Formulierung stellt den Fall Gogs als sichere zukünftige Folge des göttlichen Wortes dar, ohne dem Imperfekt ausdrücklich einen Gebotscharakter zuzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung hebt den angekündigten Fall hervor; der Gedankenstrich markiert die abschließende Gottesredeformel. Archaische Formen und konfessionell geprägte Sonderterminologie werden vermieden.
