  text: וְ/גַ֥ם שֶׁם עִ֛יר הֲמוֹנָ֖ה וְ/טִהֲר֥וּ הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/016.yaml
  text: And the name of the city will also be Hamonah[a]. Thus they will cleanse the land.
translation:
  language: de
  text: Und auch der Name der Stadt lautet Hamona[a]. So werden sie das Land reinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hamona ist ein Ortsname, der wahrscheinlich mit dem hebräischen Wort für eine Menge oder Horde zusammenhängt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Die Verbindung aus Konjunktion und Adverb fügt dem vorherigen Zusammenhang eine weitere Angabe hinzu; „Und auch“ bewahrt diese additive Wirkung natürlich.
- source_word: שֶׁם עִיר
  choice: der Name der Stadt
  rationale: Die Konstruktverbindung bezeichnet den Namen der im Zusammenhang bestimmten Stadt.
- source_word: הֲמוֹנָה
  choice: Hamona
  rationale: Das Wort wird als Ortsname transliteriert, statt seine wahrscheinliche Anspielung auf eine Menge oder Horde im Haupttext aufzulösen.
- source_word: וְטִהֲרוּ
  choice: So werden sie ... reinigen
  rationale: 'Das Piel-Perfekt mit ו steht im Zusammenhang resultativ und zukunftsbezogen: Durch den beschriebenen Vorgang wird das Land gereinigt.'
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist hier das betroffene Gebiet, nicht die gesamte Erde.
