  text: וְ/לֹֽא אַסְתִּ֥יר ע֛וֹד פָּנַ֖/י מֵ/הֶ֑ם אֲשֶׁ֨ר שָׁפַ֤כְתִּי אֶת רוּחִ/י֙ עַל בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/029.yaml
  text: And I will no longer hide my face from them, when I have poured out my Spirit on the house of Israel, declares the Lord GOD.
translation:
  language: de
  text: Und ich werde mein Angesicht nicht länger vor ihnen verbergen, weil ich meinen Geist über das Haus Israel ausgegossen habe, spricht Gott, der HERR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַסְתִּיר ... פָּנַי
  choice: mein Angesicht ... verbergen
  rationale: Bewahrt das hebräische Bild des abgewandten beziehungsweise verborgenen Angesichts in würdiger, geläufiger biblischer Sprache.
- source_word: אֲשֶׁר
  choice: wenn
  rationale: Die flexible Relativpartikel bezeichnet hier plausibel den mit der Geistausgießung verbundenen Zeitpunkt beziehungsweise Sachzusammenhang; „wenn“ wahrt die im Kontext naheliegende zeitliche Beziehung, ohne sie als bloße Begründung festzulegen.
- source_word: שָׁפַכְתִּי
  choice: ausgegossen habe
  rationale: Gibt das Perfekt in der von „wenn“ eröffneten zukünftigen Perspektive als vollendetes Geschehen wieder und erhält zugleich das konkrete Bild des Ausgießens.
- source_word: רוּחִי
  choice: meinen Geist
  rationale: „Geist“ gibt רוּחַ im Zusammenhang göttlichen Handelns angemessen wieder; das Possessivpronomen bleibt ausdrücklich erhalten.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt die kollektive Bezeichnung Israels und die feste hebräische Wendung.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht Gott, der HERR
  rationale: Gibt die prophetische Botenformel natürlich wieder und unterscheidet אֲדֹנָי von dem Gottesnamen יהוה, der nach deutscher Bibelkonvention als HERR erscheint.
theological_decisions:
- issue: Verhältnis zwischen dem Nicht-mehr-Verbergen des Angesichts und der Ausgießung des Geistes
  choice: zeitlich mit „wenn“ verbunden
  alternative: 'kausal: „weil ich meinen Geist ... ausgegossen habe“'
  rationale: אֲשֶׁר kann mehrere Beziehungen ausdrücken. Der unmittelbare Zusammenhang erlaubt eine zeitliche Lesart; „wenn“ lässt die enge sachliche Verbindung bestehen, ohne sie ausschließlich kausal zu bestimmen.
- issue: Bezeichnung des göttlichen Geistes
  choice: „mein Geist“ mit Großschreibung
  alternative: „meinen Geist/Wind/Atem“ mit kontextuell allgemeinerer Wiedergabe
  rationale: Der Sprecher ist Gott, und der Kontext beschreibt seine erneuernde Gegenwart und Wirksamkeit über Israel. Die Großschreibung entspricht im Deutschen der personal-göttlichen Referenz, ohne zusätzliche trinitarische Formulierungen einzutragen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit bewusst würdigem prophetischem Ton. „Angesicht“, „Haus Israel“ und „spricht Gott, der HERR“ erhalten zentrale Bilder und Formeln des hebräischen Textes, ohne unnötige Archaismen.
