  source_fidelity: Die Übersetzung gibt die Anrede בן אדם, den zusammengesetzten Gottesnamen אדני יהוה, die universale Anrede an Vögel und wilde Tiere, die doppelte Aufforderung zum Zusammenkommen, das Opferbild und die abschließende Aussage zutreffend wieder. »zu meinem Opfer, das ich für euch opfere« bewahrt die hebräische Nomen-Verb-Wiederholung. »für euch« ist hier im Sinn der Einladung zu dem für sie bestimmten Opfer angemessen, ohne eine soteriologische Deutung einzutragen.
