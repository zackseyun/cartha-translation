  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אֱמֹר֩ לְ/צִפּ֨וֹר כָּל כָּנָ֜ף וּ/לְ/כֹ֣ל חַיַּ֣ת הַ/שָּׂדֶ֗ה הִקָּבְצ֤וּ וָ/בֹ֨אוּ֙ הֵאָסְפ֣וּ מִ/סָּבִ֔יב עַל זִבְחִ֗/י אֲשֶׁ֨ר אֲנִ֜י זֹבֵ֤חַ לָ/כֶם֙ זֶ֣בַח גָּד֔וֹל עַ֖ל הָרֵ֣י יִשְׂרָאֵ֑ל וַ/אֲכַלְתֶּ֥ם בָּשָׂ֖ר וּ/שְׁתִ֥יתֶם דָּֽם־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/017.yaml
  text: 'And you[a], son of man, thus says the Lord GOD: Say to every bird of every wing and to every beast of the field, ‘Gather yourselves and come; assemble from all around to my sacrifice that I am sacrificing for you, a great sacrifice on the mountains of Israel[b], and you shall eat flesh and drink blood.’'
translation:
  language: de
  text: 'Du aber, Menschensohn, so spricht der Herr Yahweh: Sag zu allen Vögeln jeder Art[a] und zu allen wilden Tieren: »Versammelt euch und kommt! Findet euch von ringsum ein zu meinem Opfer, das ich für euch opfere[b] – zu einem großen Opfer auf den Bergen Israels. Ihr werdet Fleisch fressen und Blut trinken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »zu jedem Vogel jedes Flügels«; gemeint sind Vögel aller Art.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »zu meinem Opfermahl, das ich für euch bereite«. Im Hebräischen stehen das Substantiv »Opfer« und das verwandte Verb »opfern« nebeneinander; dadurch wird die Opferszene betont.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels wiederkehrende prophetische Anrede und entspricht der hebräischen Form, ohne sie erklärend aufzulösen.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt beide Bestandteile des Titels wieder und bewahrt den offenbarten Gottesnamen als Eigennamen.
- source_word: צִפּוֹר כָּל כָּנָף
  choice: alle Vögel jeder Art
  rationale: Gibt die umfassende Bedeutung der wörtlichen Wendung »Vogel jedes Flügels« in natürlichem Deutsch wieder.
- source_word: חַיַּת הַשָּׂדֶה
  choice: alle wilden Tiere
  rationale: Die feste Wendung bezeichnet die frei lebenden Landtiere; »wilde Tiere« ist im Deutschen klarer als das wörtliche »Tiere des Feldes«.
- source_word: הִקָּבְצוּ ... הֵאָסְפוּ
  choice: Versammelt euch ... Findet euch ... ein
  rationale: Bewahrt die Folge zweier nahezu gleichbedeutender Aufforderungen und damit ihre rhetorische Verstärkung.
- source_word: מִסָּבִיב
  choice: von ringsum
  rationale: Bezeichnet das Herbeikommen aus allen umliegenden Richtungen.
- source_word: עַל זִבְחִי אֲשֶׁר אֲנִי זֹבֵחַ לָכֶם
  choice: zu meinem Opfer, das ich für euch opfere
  rationale: Erhält die auffällige Wiederholung des verwandten Nomens und Verbs sowie die gerichtete Bewegung zum Opfer hin.
- source_word: זֶבַח גָּדוֹל
  choice: ein großes Opfer
  rationale: Bewahrt den kultisch-sakrificialen Rahmen; der mitgemeinte Opfermahlcharakter wird durch das folgende Fressen und Trinken deutlich und in einer Fußnote genannt.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: die Berge Israels
  rationale: Direkte und in Hesekiel wiederkehrende geografische Bezeichnung.
- source_word: וַאֲכַלְתֶּם בָּשָׂר וּשְׁתִיתֶם דָּם
  choice: Ihr werdet Fleisch fressen und Blut trinken
  rationale: »Fressen« entspricht im Deutschen der Anrede an Vögel und wilde Tiere; »Fleisch« und »Blut« bewahren die drastische Gerichtsszene.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung unterscheidet Titel und Eigenname und gibt das Tetragramm als »Yahweh« wieder, statt es durch einen weiteren Herrentitel zu ersetzen.
- issue: Opfer oder Opfermahl in זֶבַח
  choice: Opfer
  alternative: Opfermahl
  rationale: »Opfer« hält die kultische und zugleich ironisch-gerichtliche Bildsprache offen; der Mahlaspekt ist kontextuell vorhanden, soll aber nicht an die Stelle der Opferbedeutung treten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. Die gehäuften Aufforderungen und die drastische Schlussaussage bleiben erhalten; unnötige Archaismen werden vermieden.
