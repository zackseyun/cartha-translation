  text: וּ/שְׂבַעְתֶּ֤ם עַל שֻׁלְחָנִ/י֙ ס֣וּס וָ/רֶ֔כֶב גִּבּ֖וֹר וְ/כָל אִ֣ישׁ מִלְחָמָ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/020.yaml
  text: And you will be filled at my table with horse and chariot[a], mighty man and every man of war[b], declares the Lord GOD.
translation:
  language: de
  text: An meinem Tisch werdet ihr euch satt essen von Pferd und Streitwagen, von Helden und allen Kriegsleuten, spricht der Herr Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂבַעְתֶּם
  choice: werdet ihr euch satt essen
  rationale: שׂבע bezeichnet hier das Sattwerden durch Essen. Die reflexive deutsche Wendung macht im Zusammenhang des Opfermahls den Vorgang natürlich und anschaulich wieder.
- source_word: עַל שֻׁלְחָנִי
  choice: an meinem Tisch
  rationale: Bei einem Mahl ist „an meinem Tisch“ die idiomatische deutsche Entsprechung; das Bild des von Gott bereiteten Mahls bleibt erhalten.
- source_word: סוּס וָרֶכֶב
  choice: an Pferd und Streitwagen
  rationale: Die singularischen Formen werden eng am Hebräischen als kollektive militärische Größen wiedergegeben. Eine Deutung von רֶכֶב als Reiter oder Wagenkämpfer wird nicht stillschweigend in den Haupttext aufgenommen.
- source_word: גִּבּוֹר
  choice: an Held
  rationale: „Held“ bewahrt die lexikalische Eigenständigkeit von גִּבּוֹר gegenüber dem folgenden אִישׁ מִלְחָמָה, auch wenn im Kontext ein kampfstarker Mann gemeint ist.
- source_word: וְכָל אִישׁ מִלְחָמָה
  choice: und jedem Kriegsmann
  rationale: Die Wiedergabe folgt der konkreten Bedeutung „jeder Mann des Krieges“ und bezeichnet hier ausdrücklich antike männliche Kämpfer.
- source_word: נְאֻם
  choice: spricht
  rationale: „Spricht“ ist die traditionelle, zugleich verständliche deutsche Wiedergabe der feierlichen prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „Jahwe“ den Gottesnamen יהוה als Namen erkennbar erhält und eine Verdoppelung von „Herr“ vermeidet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr / der Herr HERR
  rationale: Der Eigenname יהוה wird als „Jahwe“ kenntlich gemacht, während אֲדֹנָי mit „Herr“ wiedergegeben wird. So bleiben beide Bestandteile der hebräischen Gottesbezeichnung unterscheidbar.
- issue: Gegenstände und Menschen als Speise am Tisch Gottes
  choice: die drastische Opfermahl-Metapher unverändert stehen lassen
  alternative: die Aufzählung erklärend auf Fleisch von Tieren und Kriegern beschränken
  rationale: Der Zusammenhang schildert ein Gericht als Mahl für Vögel und wilde Tiere. Die spannungsreiche Formulierung „Pferd und Streitwagen“ wird nicht harmonisiert oder vergeistigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt bewusst knapp und nahe an der hebräischen Syntax; die ungewöhnlichen singularischen Kollektiva werden in den Fußnoten erläutert.
