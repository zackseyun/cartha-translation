  text: וּ/קְבָרוּ/ם֙ בֵּ֣ית יִשְׂרָאֵ֔ל לְמַ֖עַן טַהֵ֣ר אֶת הָ/אָ֑רֶץ שִׁבְעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/012.yaml
  text: The house of Israel will bury them for seven months[a], in order to cleanse the land.
translation:
  language: de
  text: Das Haus Israel wird sie sieben Monate lang begraben, um das Land zu reinigen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land kultisch zu reinigen“. Das hebräische Verb kann das Reinigen im kultischen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְבָרוּם
  choice: wird sie … begraben
  rationale: Das Qal-Perfekt mit vorangestelltem וּ steht in der prophetischen Abfolge mit Zukunftsbedeutung; das Objektsuffix wird durch „sie“ wiedergegeben.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Das Haus Israel
  rationale: Die feste prophetische Kollektivbezeichnung bleibt erhalten und bewahrt ihren gemeinschaftlichen, bundesbezogenen Klang.
- source_word: לְמַעַן
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion gibt den Zweck natürlich und eindeutig wieder.
- source_word: טַהֵר
  choice: reinigen
  rationale: Das Piel von טהר bezeichnet das Reinigen beziehungsweise kultische Reinmachen; „reinigen“ lässt sowohl die konkrete als auch die rituelle Dimension offen.
- source_word: אֶת־הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist Israels Land als das durch die Leichen verunreinigte Gebiet gemeint, nicht die ganze Erde.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: sieben Monate lang
  rationale: Die Zeitdauer wird im modernen Deutschen idiomatisch mit „lang“ ausgedrückt.
theological_decisions:
- issue: Art der Reinigung des Landes
  choice: „reinigen“ mit einer Fußnote zur möglichen kultischen Bedeutung
  alternative: „rituell rein machen“ oder „läutern“
  rationale: Der Kontext verbindet die Beseitigung von Leichen mit der Wiederherstellung der Reinheit des Landes. Die Wiedergabe wahrt die konkrete und die kultische Dimension, ohne einen späteren theologischen Mechanismus einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Wendung „Haus Israel“ wurde bewusst beibehalten; Satzbau und Zeitangabe sind zugleich natürlich deutsch.
