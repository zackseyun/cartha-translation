source:
  edition: WLC
  text: וְ/נָשׂוּ֙ אֶת כְּלִמָּתָ֔/ם וְ/אֶת כָּל מַעֲלָ֖/ם אֲשֶׁ֣ר מָעֲלוּ בִ֑/י בְּ/שִׁבְתָּ֧/ם עַל אַדְמָתָ֛/ם לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/026.yaml
  text: They will bear their shame and all their unfaithfulness by which they were unfaithful to me[a], when they dwell securely on their land with no one to make them afraid.
translation:
  language: de
  text: Sie werden ihre Schande und all ihre Untreue tragen, mit der sie mir untreu geworden sind,[a] wenn sie sicher in ihrem Land wohnen und niemand sie aufschreckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie werden ihre Schande und all ihre Untreue vergessen.« Einige Übersetzungen geben das Verb, auch unter dem Einfluss alter Übersetzungen, in diesem Zusammenhang so wieder; im Hebräischen bedeutet es am unmittelbarsten »tragen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָשׂוּ
  choice: sie werden … tragen
  rationale: נשׂא bedeutet gewöhnlich »heben, tragen«. Zusammen mit »Schande« und »Untreue« gibt »tragen« den hebräischen Wortlaut am unmittelbarsten wieder und bewahrt die Spannung zwischen Wiederherstellung und fortbestehendem Bewusstsein der Schuld.
- source_word: כְּלִמָּתָם
  choice: ihre Schande
  rationale: כְּלִמָּה bezeichnet Schande oder Schmach. »Schande« ist im heutigen Standarddeutsch direkt und verständlich.
- source_word: מַעֲלָם / מָעֲלוּ
  choice: ihre Untreue … sie untreu geworden sind
  rationale: Substantiv und Verb aus מעל bezeichnen einen Treuebruch, besonders im Verhältnis zu Gott. Die Wiederholung des Wortstamms bildet die hebräische Ausdrucksweise natürlich nach.
- source_word: בִי
  choice: mir
  rationale: Bei מעל bezeichnet ב die Person, der gegenüber der Treuebruch begangen wird. »Mir untreu geworden« ist relational und idiomatisch; »gegen mich« wäre ebenfalls möglich.
- source_word: בְּשִׁבְתָּם
  choice: wenn sie … wohnen
  rationale: Der Infinitiv mit בְּ kennzeichnet hier einen zeitlichen beziehungsweise begleitenden Umstand.
- source_word: עַל אַדְמָתָם
  choice: in ihrem Land
  rationale: אֲדָמָה kann Boden, Land oder Erdboden bedeuten. Im Zusammenhang der Rückkehr und Ansiedlung ist »in ihrem Land« im Deutschen natürlich.
- source_word: לָבֶטַח
  choice: sicher
  rationale: Die adverbiale Wendung bezeichnet ein Leben in Sicherheit, ohne Bedrohung.
- source_word: וְאֵין מַחֲרִיד
  choice: und niemand sie aufschreckt
  rationale: Das Partizip מַחֲרִיד bezeichnet jemanden, der Schrecken auslöst. »Niemand sie aufschreckt« bewahrt den persönlichen Verursacher und ist knappes, natürliches Deutsch.
theological_decisions:
- issue: Bedeutung von וְנָשׂוּ im Zusammenhang von Wiederherstellung und früherer Schuld
  choice: Den unmittelbaren hebräischen Sinn »tragen« beibehalten
  alternative: »Sie werden ihre Schande und all ihre Untreue vergessen«
  rationale: 'Der hebräische Wortlaut spricht am direktesten vom Tragen, nicht vom Vergessen. Die alternative Wiedergabe wird durch den Kontext und alte Übersetzungen gestützt, ist aber stärker deutend. »Tragen« wahrt die theologische Spannung: Das Volk lebt wieder sicher und trägt dennoch seine frühere Schande beziehungsweise das Bewusstsein davon.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verwandten Formen »Untreue« und »untreu geworden« bilden die hebräische Stammwiederholung verständlich nach. Der Fußnotenmarker steht unmittelbar nach der Aussage über die Untreue.
