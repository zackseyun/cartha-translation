source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מָג֔וֹג וּ/בְ/יֹשְׁבֵ֥י הָ/אִיִּ֖ים לָ/בֶ֑טַח וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/006.yaml
  text: And I will send fire on Magog and on those who live securely in the coastlands[a], and they will know that I am Yahweh.
translation:
  language: de
  text: Und ich werde Feuer über Magog und über die senden, die sicher auf den Küstenländern wohnen, und sie werden erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Und ich werde … senden
  rationale: Das Hifil-Perfekt mit vorangestelltem ו wird in diesem prophetischen Gotteswort natürlich futurisch wiedergegeben. „Senden“ entspricht dem Verb direkt und ist mit „Feuer“ idiomatisch.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die wörtliche Bedeutung und das prophetische Gerichtsbild bleiben erhalten; eine deutende Erweiterung wie „Gericht“ wird vermieden.
- source_word: בְּמָגוֹג
  choice: über Magog
  rationale: Bei gesandtem, vernichtendem Feuer bezeichnet ב das Ziel. „Feuer über Magog senden“ ist im Deutschen natürlich und wahrt die Bildsprache.
- source_word: וּבְיֹשְׁבֵי הָאִיִּים לָבֶטַח
  choice: und über die, die sicher auf den Küstenländern wohnen
  rationale: יֹשְׁבֵי wird als substantiviertes Partizip wiedergegeben; לָבֶטַח beschreibt am natürlichsten die Sicherheit der Bewohner. הָאִיִּים kann Inseln oder entferntere maritime Küstengebiete bezeichnen.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: „Erkennen“ gibt das in Ezechiel wiederkehrende Erkenntnismotiv angemessen wieder. „Dann“ verdeutlicht die resultative Abfolge, ohne den Sinn zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Transliteration bewahrt den Charakter als Eigenname.
- issue: Bezug von לָבֶטַח
  choice: 'auf die Bewohner der Küstenländer: „die sicher … wohnen“'
  alternative: 'lockerer Bezug auf den ganzen Satzteil: „in Sicherheit“'
  rationale: Syntaktisch qualifiziert das Adverb am natürlichsten das Wohnen der genannten Bewohner und beschreibt ihre Sicherheit vor dem Gericht.
- issue: Bedeutungsumfang von הָאִיִּים
  choice: Küstenländer
  alternative: Inseln
  rationale: Der Ausdruck kann in prophetischen Texten sowohl Inseln als auch entferntere Küsten- und Meeresländer bezeichnen. Die Hauptfassung wählt den breiteren geographischen Ausdruck und dokumentiert die engere Möglichkeit in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch einen Satzpunkt vor der Erkenntnisformel lesbarer. „Jahwe“ bewahrt den Gottesnamen; „Küstenländer“ hält die geographische Weite des prophetischen Ausdrucks offen.
