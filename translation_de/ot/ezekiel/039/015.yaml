source:
  edition: WLC
  text: וְ/עָבְר֤וּ הָ/עֹֽבְרִים֙ בָּ/אָ֔רֶץ וְ/רָאָה֙ עֶ֣צֶם אָדָ֔ם וּ/בָנָ֥ה אֶצְל֖/וֹ צִיּ֑וּן עַ֣ד קָבְר֤וּ אֹת/וֹ֙ הַֽ/מְקַבְּרִ֔ים אֶל גֵּ֖יא הֲמ֥וֹן גּֽוֹג־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
translation:
  language: de
  text: Und die, die durch das Land ziehen, werden es durchziehen. Wenn einer einen menschlichen Knochen[a] sieht, wird er daneben ein Zeichen aufstellen, bis die mit dem Begraben Beauftragten ihn im Tal Hamon-Gog[b] begraben haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Knochen eines Menschen“. Das hebräische adam kann „Mensch“ allgemein oder „Mann“ bedeuten; hier passt die allgemeine Bedeutung zum beschriebenen Bestattungsverfahren.'
    reason: lexical_alternative
  - marker: b
    text: Hamon-Gog bedeutet wahrscheinlich „Gogs Menge“ oder „die Menge Gogs“; hier ist der Ausdruck als Ortsname wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים
  choice: Und die, die durch das Land ziehen, werden es durchziehen
  rationale: Die Wiederholung der Wurzel עבר wird im Deutschen bewahrt. „Es“ nimmt idiomatisch „das Land“ auf und vermeidet eine schwerfällige wörtliche Doppelung.
- source_word: בָּאָרֶץ
  choice: durch das Land
  rationale: Der Zusammenhang bezeichnet das betreffende Land beziehungsweise Gebiet, nicht die ganze Erde.
- source_word: וְרָאָה
  choice: Wenn einer ... sieht
  rationale: Die maskuline Singularform bezeichnet hier generisch jeweils eine einzelne Person aus der zuvor genannten Gruppe und leitet den nächsten Verfahrensschritt ein.
- source_word: עֶצֶם אָדָם
  choice: einen menschlichen Knochen
  rationale: עֶצֶם bedeutet „Knochen“; אָדָם bezeichnet hier allgemein einen Menschen und nicht eigens einen Mann.
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
  choice: wird er daneben ein Zeichen aufstellen
  rationale: בנה heißt wörtlich „bauen“, bezeichnet zusammen mit ציון hier aber das Errichten einer Kennzeichnung. „Daneben“ gibt אצלו knapp und natürlich wieder.
- source_word: עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים
  choice: bis die Bestatter ihn ... begraben haben
  rationale: הַמְקַבְּרִים bezeichnet die mit der Bestattung Beauftragten. „Bestatter“ ist im modernen Deutsch natürlicher als eine substantivierte Form wie „die Begrabenden“; „ihn“ bezieht sich grammatisch auf den Knochen.
- source_word: אֶל גֵּיא הֲמוֹן גּוֹג
  choice: im Tal Hamon-Gog
  rationale: Nach „begraben“ ist „im Tal“ idiomatisches Deutsch, obwohl אֶל grundsätzlich eine Zielrichtung ausdrücken kann. Der Ausdruck wird als Ortsname transliteriert.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: menschlich
  alternative: eines Mannes
  rationale: Im Verfahren zur Beseitigung der Gebeine geht es allgemein um menschliche Überreste; eine Beschränkung auf männliche Tote ist im Kontext nicht angezeigt.
- issue: Deutung von הֲמוֹן גּוֹג
  choice: Hamon-Gog als Ortsname beibehalten
  alternative: Gogs Menge / die Menge Gogs
  rationale: Der Ausdruck benennt im Kontext das Tal. Die Transliteration erhält den Ortsnamen, während die mögliche Bedeutung in einer Fußnote offengelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von עבר bleibt erkennbar, ohne unnatürliche Syntax zu erzeugen. „Bestatter“ ist verständlich und sachlich; der Ortsname wird nicht deutend in den Haupttext übersetzt.
