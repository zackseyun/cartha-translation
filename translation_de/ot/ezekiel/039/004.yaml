  source_fidelity: 'Der Haupttext gibt die hebräische Satzfolge und die zentralen Elemente zutreffend wieder: das Fallen auf den Bergen Israels, die militärisch verstandenen „Flügel“/Verbände, die begleitenden Völker sowie die Preisgabe als Nahrung für Vögel und Feldtiere. „Habe ich dich zum Fraß gegeben“ bildet das hebräische Perfekt נְתַתִּיךָ angemessen ab, ohne dessen prophetische Gewissheit in eine bloß zukünftige Aussage umzudeuten. „Allen Arten von Raubvögeln“ ist eine idiomatische Wiedergabe der umfassenden, im Hebräischen etwas bildhafteren Vogelbezeichnung; die Fußnote dokumentiert die engere Formulierung.'
