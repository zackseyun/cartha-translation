source:
  edition: WLC
  text: עַל הָרֵ֨י יִשְׂרָאֵ֜ל תִּפּ֗וֹל אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֖ים אֲשֶׁ֣ר אִתָּ֑/ךְ לְ/עֵ֨יט צִפּ֧וֹר כָּל כָּנָ֛ף וְ/חַיַּ֥ת הַ/שָּׂדֶ֖ה נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/004.yaml
  text: On the mountains of Israel you will fall—you and all your troops and the peoples who are with you[b][a]. I have given you as food to every kind of bird of prey and to the wild animals of the field.
translation:
  language: de
  text: Auf den Bergen Israels wirst du fallen, du und alle deine Heeresverbände[a] und die Völker, die bei dir sind. Allen Arten von Raubvögeln[b] und den wilden Tieren des Feldes habe ich dich zum Fraß gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle deine Flügel“; vermutlich ein Bild für Gogs militärische Flügel, Abteilungen oder angeschlossene Streitkräfte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Raubvögeln jedes Flügels“; die hebräische Wendung betont die Gesamtheit der verschiedenen Aas- und Raubvögel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפּוֹל
  choice: wirst du fallen
  rationale: נפל bedeutet konkret „fallen“. Im Gerichtszusammenhang schließt es Niederlage und Tod ein, doch die bildhafte und prophetisch bestimmte Aussage bleibt so erhalten.
- source_word: אֲגַפֶּיךָ
  choice: deine Heeresverbände
  rationale: Das Wort bezeichnet wörtlich „Flügel“, kann hier aber metaphorisch militärische Flügel, Abteilungen oder angeschlossene Streitkräfte meinen. „Heeresverbände“ ist im Deutschen klar und bewahrt den militärischen Sinn.
- source_word: עַמִּים אֲשֶׁר אִתָּךְ
  choice: die Völker, die bei dir sind
  rationale: עַמִּים bezeichnet im Plural Völker und sollte nicht auf bloße Truppenteile eingeengt werden.
- source_word: לְעֵיט צִפּוֹר כָּל כָּנָף
  choice: allen Arten von Raubvögeln
  rationale: Die hebräische Wendung verbindet den Raub- beziehungsweise Aasvogel mit „Vogel jedes Flügels“ und umfasst damit die ganze Vielfalt solcher Vögel. Die gewählte Form gibt diese Gesamtheit in natürlichem Deutsch wieder.
- source_word: חַיַּת הַשָּׂדֶה
  choice: den wilden Tieren des Feldes
  rationale: Die feste Wendung bezeichnet wild lebende Landtiere; „des Feldes“ erhält das biblische Landschaftsbild.
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: habe ich dich zum Fraß gegeben
  rationale: Die Konstruktion beschreibt die Übergabe als Nahrung. „Zum Fraß“ ist idiomatisch, anschaulich und entspricht dem drastischen Gerichtsbild.
theological_decisions:
- issue: Göttliches Handeln im Gerichtsbild
  choice: habe ich dich zum Fraß gegeben
  alternative: werde ich dich zum Fraß geben
  rationale: 'נְתַתִּיךָ ist formal ein Perfekt der 1. Person Singular: „Ich habe dich gegeben.“ Im prophetischen Kontext kann es eine gewiss eintretende Zukunft bezeichnen. Das deutsche Perfekt wahrt die Form und unterstreicht, dass das Urteil bereits feststeht, ohne den Zukunftsbezug auszuschließen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Fall-Metapher und das drastische Gerichtsbild bleiben erhalten; schwer verständliche militärische und ornithologische Wendungen werden im Haupttext idiomatisch wiedergegeben und in den Fußnoten formal näher erläutert.
