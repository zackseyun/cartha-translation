  text: וְ/קָֽבְרוּ֙ כָּל עַ֣ם הָ/אָ֔רֶץ וְ/הָיָ֥ה לָ/הֶ֖ם לְ/שֵׁ֑ם י֚וֹם הִכָּ֣בְדִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/013.yaml
  text: All the people of the land will bury them[a], and it will be to their renown on the day I glorify myself[b], declares the Lord GOD.
translation:
  language: de
  text: Das ganze Volk des Landes wird sie begraben, und das wird ihnen zum Ruhm gereichen an dem Tag, an dem ich verherrlicht werde[a], spricht der Herr Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dem Tag, an dem ich meine Herrlichkeit erweise“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָבְרוּ
  choice: wird sie begraben
  rationale: Das Qal-Perfekt mit וְ hat im prophetischen Zusammenhang Zukunftsbedeutung; die konkrete Bestattungshandlung bleibt erhalten.
- source_word: כָּל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Im örtlichen Zusammenhang sind die Bewohner des Landes gemeint, nicht die gesamte Menschheit. Der kollektive Singular עַם wird als „Volk“ wiedergegeben.
- source_word: וְהָיָה לָהֶם לְשֵׁם
  choice: das wird ihnen Ruhm einbringen
  rationale: Die Wendung לְשֵׁם, wörtlich „zu einem Namen“, bezeichnet hier Ansehen oder Ruhm; die natürliche deutsche Formulierung gibt den idiomatischen Sinn wieder.
- source_word: יוֹם הִכָּבְדִי
  choice: an dem Tag, an dem ich mich verherrliche
  rationale: Die Nifal-Form kann reflexiv beziehungsweise als göttliche Selbstoffenbarung verstanden werden. Die Wiedergabe bewahrt diesen Sinn, ohne die ebenfalls mögliche passive Lesart zu verschweigen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr, Jahwe
  rationale: נְאֻם wird mit der geläufigen prophetischen Formel „spricht“ wiedergegeben. אֲדֹנָי bleibt „der Herr“, während der Gottesname יהוה als „Jahwe“ erscheint.
theological_decisions:
- issue: Bedeutung von הִכָּבְדִי
  choice: an dem Tag, an dem ich mich verherrliche
  alternative: an dem Tag, an dem ich verherrlicht werde; an dem Tag, an dem ich meine Herrlichkeit zeige
  rationale: Der hebräische Ausdruck lässt sowohl eine reflexive als auch eine passive beziehungsweise manifestative Nuance zu. Der Haupttext folgt der kontextuell starken reflexiven Lesart; die Fußnote bewahrt die echte Mehrdeutigkeit.
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der Herr; der Herr HERR
  rationale: Die getrennte Wiedergabe von אֲדֹנָי und יהוה macht sowohl den Herrentitel als auch den persönlichen Gottesnamen sichtbar und vermeidet eine konfessionell geprägte Auflösung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ruhm einbringen“ vermittelt die hebräische Wendung „zu einem Namen werden“ verständlich; die prophetische Schlussformel bleibt knapp und feierlich.
