review_pass:
  verdict: revise
  source_fidelity: 'Die Zukunftsaussage über die Bestattung und die lokale Bezugnahme von כָּל־עַם הָאָרֶץ sind zutreffend wiedergegeben. Bei יוֹם הִכָּבְדִי ist jedoch die Nifalform vorrangig passiv zu verstehen: „am Tag, an dem ich verherrlicht werde“. Die reflexive Haupttextfassung „an dem ich mich verherrliche“ geht über die Form hinaus. Die englische Audit-Begründung, die eine reflexive Lesart bevorzugt, ist daher gegenüber dem Hebräischen nicht maßgeblich.'
  naturalness: „Das ganze Volk des Landes“ und „wird sie begraben“ sind verständlich und angemessen. „Zum Ruhm gereichen“ ist für die hebräische Namens-/Ansehensidiomatik etwas näher und zugleich idiomatisches modernes Standarddeutsch. Die Formel „spricht der Herr, Jahwe“ wird ohne das Komma als feste Anrede-/Titelverbindung flüssiger gelesen.
  terminology: „Jahwe“ gibt den Gottesnamen wieder. „der Herr Jahwe“ bildet אֲדֹנָי יְהוִה klar und würdig ab, ohne den Namen durch eine bloße Ersatzschreibung zu verdecken. Die Fußnote soll die passive Grundbedeutung nicht als bloße Alternative behandeln, sondern nur die mögliche manifestative Umschreibung nennen.
  issues:
  - severity: medium
    issue: Die Haupttextwiedergabe von הִכָּבְדִי ist unzutreffend reflexiv.
    rationale: הִכָּבְדִי ist eine Nifalform mit Suffix der ersten Person Singular und bedeutet im unmittelbaren Sinn „mein Verherrlichtwerden“ bzw. „dass ich verherrlicht werde“. Eine reflexive Wiedergabe kann die kontextuelle Gottesmanifestation umschreiben, sollte aber nicht den Haupttext bestimmen.
  - severity: low
    issue: Die Fußnote bietet die direkte passive Bedeutung als Alternative, obwohl sie die formnähere Hauptlesart ist.
    rationale: Nach der Korrektur des Haupttextes kann die Fußnote sinnvoll eine manifestative, interpretierende Umschreibung dokumentieren.
  - severity: low
    issue: Komma in „der Herr, Jahwe“ wirkt unnötig abgesetzt.
    rationale: „der Herr Jahwe“ ist im Deutschen als Wiedergabe der Titelfolge natürlicher und bewahrt beide Elemente.
  revised_text: Das ganze Volk des Landes wird sie begraben, und das wird ihnen zum Ruhm gereichen an dem Tag, an dem ich verherrlicht werde[a], spricht der Herr Jahwe.
