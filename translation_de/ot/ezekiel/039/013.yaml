- from: Das ganze Volk des Landes wird sie begraben, und das wird ihnen Ruhm einbringen an dem Tag, an dem ich mich verherrliche[a], spricht der Herr, Jahwe.
  to: Das ganze Volk des Landes wird sie begraben, und das wird ihnen zum Ruhm gereichen an dem Tag, an dem ich verherrlicht werde[a], spricht der Herr Jahwe.
  rationale: Die Nifalform הִכָּבְדִי wird im Haupttext passiv und damit form- und sinngetreu wiedergegeben. Die Fußnote bewahrt eine mögliche kontextuelle Umschreibung als Offenbarung göttlicher Herrlichkeit, ohne die grammatische Grundrichtung zu verdrängen. „Zum Ruhm gereichen“ bildet לְשֵׁם idiomatisch und semantisch präzise ab; die Gottesformel wurde nur stilistisch geglättet.
