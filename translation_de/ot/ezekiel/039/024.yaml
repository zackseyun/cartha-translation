source:
  edition: WLC
  text: כְּ/טֻמְאָתָ֥/ם וּ/כְ/פִשְׁעֵי/הֶ֖ם עָשִׂ֣יתִי אֹתָ֑/ם וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/024.yaml
  text: According to their uncleanness and according to their transgressions I dealt with them[a], and I hid my face from them.
translation:
  language: de
  text: Entsprechend ihrer Unreinheit und ihren Vergehen behandelte ich sie[a], und ich verbarg mein Angesicht vor ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Entsprechend ihrer Unreinheit und ihrer Auflehnung verfuhr ich mit ihnen.“'
    reason: Lexikalische Alternativen für פֶּשַׁע und die idiomatische Wendung עָשִׂיתִי אֹתָם.
lexical_decisions:
- source_word: כְּטֻמְאָתָם
  choice: Entsprechend ihrer Unreinheit
  rationale: Das Präfix כְּ bezeichnet hier den Maßstab bzw. die Entsprechung. טֻמְאָה umfasst bei Ezechiel kultische wie moralische Unreinheit; „Unreinheit“ bewahrt diese breite biblische Kategorie.
- source_word: וּכְפִשְׁעֵיהֶם
  choice: und ihren Vergehen
  rationale: פֶּשַׁע bezeichnet schuldhafte Übertretung und kann den Beiklang von Auflehnung tragen. „Vergehen“ ist im Deutschen verständlich und lässt den Grad ausdrücklicher Rebellion offen.
- source_word: עָשִׂיתִי אֹתָם
  choice: behandelte ich sie
  rationale: Die Verbindung עשה mit direktem Objekt bedeutet hier kontextuell nicht „ich machte sie“, sondern „ich verfuhr mit ihnen / behandelte sie“.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: und ich verbarg mein Angesicht vor ihnen
  rationale: Die hebräische Metapher für den Entzug von Gegenwart oder Gunst im Gericht bleibt erhalten; „Angesicht“ trägt dem würdevollen prophetischen Sprachregister Rechnung.
theological_decisions:
- issue: Deutung der Wendung „mein Angesicht verbergen“
  choice: Die Metapher im Haupttext bewahren
  alternative: „Ich wandte mich von ihnen ab“ oder „ich entzog ihnen meine Gunst“
  rationale: Die bildhafte Aussage ist verständlich und theologisch vielschichtig. Eine Paraphrase würde sie auf eine einzelne Deutung verengen.
- issue: Bedeutungsumfang von טֻמְאָה
  choice: „Unreinheit“
  alternative: „Unreinheit/Verunreinigung“ oder „Befleckung“
  rationale: Der Ausdruck kann bei Ezechiel kultische und moralische Verunreinigung zugleich bezeichnen; „Unreinheit“ hält diesen Umfang offen.
- issue: Bedeutungsnuance von פֶּשַׁע
  choice: „Vergehen“ im Haupttext, „Auflehnung“ als Fußnotenalternative
  alternative: „Übertretungen“ oder „Auflehnungen“ im Haupttext
  rationale: Der hebräische Begriff kann sowohl die schuldhafte Übertretung als auch ihren rebellischen Charakter hervorheben. Haupttext und Fußnote bewahren diese Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele hebräische Konstruktion wird knapp wiedergegeben; „Angesicht“ bewahrt bewusst den prophetisch-biblischen Bildgehalt, ohne die Aussage auszudeuten.
