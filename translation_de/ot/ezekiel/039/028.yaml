base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/028.yaml
  text: Then they will know that I am Yahweh their God[a], when I exiled them among the nations and then gathered them onto their own land, and I will leave none of them there any longer.
translation:
  language: de
  text: Dann werden sie erkennen, dass ich, Jahwe, ihr Gott, sie unter die Völker verbannt und in ihr eigenes Land gesammelt habe und keinen von ihnen mehr dort zurücklassen werde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sie werden erkennen, dass ich Jahwe, ihr Gott, bin, wenn/nachdem ich sie unter die Völker verbannt und in ihr eigenes Land gesammelt habe.“ Die hebräische Präposition vor „ich sie verbanne“ kann den Zeitpunkt oder das Mittel des Erkennens bezeichnen; auch die einfache Anknüpfung mit „und“ ist möglich.'
    reason: Die Fußnote erhält die syntaktische Mehrdeutigkeit von בְּהַגְלוֹתִי und bietet eine explizit temporale Wiedergabe, ohne die instrumentale Lesart auszuschließen.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: ידע bezeichnet hier ein durch Gottes Handeln gewonnenes Erkennen. „Dann“ gibt den Folgezusammenhang im Kontext natürlich wieder, ohne die mögliche schlichte Anknüpfung mit „und“ auszuschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihr Gott
  rationale: Die Konstruktverbindung mit Pronominalsuffix bedeutet wörtlich und idiomatisch „ihr Gott“.
- source_word: בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם
  choice: Ich habe sie unter die Völker verbannt
  rationale: Das Infinitivkonstrukt von גלה mit Suffix bezeichnet Gottes Verursachung des Exils. „Unter die Völker verbannen“ gibt Ziel und Zerstreuung in natürlichem Deutsch wieder. Die Präposition ב kann temporal oder instrumental verstanden werden; diese Mehrdeutigkeit wird in der Fußnote festgehalten.
- source_word: וְכִנַּסְתִּים עַל אַדְמָתָם
  choice: und sie wieder in ihrem eigenen Land gesammelt
  rationale: כנס bedeutet „sammeln, zusammenbringen“. „Wieder“ verdeutlicht den im Kontext liegenden Gegensatz zur Zerstreuung; עַל אַדְמָתָם bezeichnet die Rückführung in ihr eigenes Land.
- source_word: וְלֹא אוֹתִיר עוֹד מֵהֶם שָׁם
  choice: keinen von ihnen werde ich länger dort zurücklassen
  rationale: הותיר im Hifil bedeutet „übrig lassen, zurücklassen“. Die Zukunftsform gibt den Verheißungscharakter der prophetischen Aussage wieder; „dort“ verweist im unmittelbaren Gegensatz auf die Völker beziehungsweise den Ort des Exils.
theological_decisions:
- issue: Funktion von בְּ vor dem Infinitiv בְּהַגְלוֹתִי
  choice: Die Hauptextfassung stellt Exil und Sammlung als die Taten dar, an denen Israel Jahwe erkennt.
  alternative: „wenn ich sie … verbannt und … gesammelt habe“ oder „indem ich sie … verbanne und … sammle“
  rationale: Die hebräische Konstruktion kann temporal oder instrumental gelesen werden. Die deutsche Hauptfassung wahrt den Zusammenhang, während die Fußnote die grammatische Alternative ausdrücklich nennt.
- issue: Zeitbezug der Verbalformen
  choice: Das Verbannen und Sammeln werden als aus der Perspektive des Erkennens vollzogene Taten formuliert; das Nicht-Zurücklassen als verbindliche Zukunftsverheißung.
  alternative: Alle koordinierten Perfektformen als abgeschlossene Zukunft beziehungsweise prophetisches Perfekt wiedergeben.
  rationale: Die prophetische Rede blickt auf Exil und Sammlung als sichere göttliche Handlungen. Beim letzten Glied macht der Kontext die Zusage deutlich, dass künftig niemand im Exil verbleiben wird.
- issue: Bezug von שָׁם („dort“)
  choice: „dort“ bezieht sich auf die Völker beziehungsweise den Ort des Exils.
  alternative: Ein allgemeiner Ortsverweis ohne ausdrücklich bestimmtes Bezugswort.
  rationale: Der unmittelbare Kontrast zwischen der Verbannung unter die Völker und der Sammlung im eigenen Land spricht dafür, dass niemand am Ort des Exils zurückbleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jahwe“ bewahrt den Gottesnamen; „unter die Völker verbannt“ und „zurücklassen“ sind allgemein verständlich und zugleich dem prophetischen Register angemessen.
