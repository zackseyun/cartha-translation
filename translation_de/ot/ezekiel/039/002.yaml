base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/002.yaml
  text: I will turn you around[a], lead you on, bring you up from the far north[b], and bring you against the mountains of Israel.
translation:
  language: de
  text: Ich werde dich umlenken und dich weitertreiben[a], dich aus dem äußersten Norden[b] heraufführen und dich gegen die Berge Israels führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die schwierige hebräische Verbform wird auch mit „nur ein Sechstel von dir übrig lassen“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „aus den fernsten Bereichen des Nordens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּיךָ
  choice: Ich werde dich herumlenken
  rationale: Die Form wird hier kausativ im Sinn einer von Gott bewirkten Richtungsänderung verstanden. „Herumlenken“ bewahrt den Gedanken göttlicher Kontrolle, ohne zwingend eine Rückkehr an einen früheren Ort zu behaupten.
- source_word: וְשִׁשֵּׁאתִיךָ
  choice: und dich weitertreiben[a]
  rationale: Das schwierige Verb wird entsprechend der Abfolge von Bewegungsverben als erzwungenes Weiterführen verstanden. „Weitertreiben“ ist im Deutschen natürlich und erhält den drohenden Ton; die traditionsreiche abweichende Deutung wird in der Fußnote genannt.
- source_word: וְהַעֲלִיתִיךָ
  choice: Ich werde dich ... heraufführen
  rationale: Der Hifil von עלה bezeichnet das Veranlassen einer Aufwärtsbewegung. „Heraufführen“ gibt Richtung und göttliches Handeln knapp wieder.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: aus dem äußersten Norden[b]
  rationale: Die Wendung bezeichnet die entlegenen Bereiche beziehungsweise äußersten Winkel des Nordens. „Aus dem äußersten Norden“ ist idiomatisch und bewahrt die geografische Ferne.
- source_word: וַהֲבִאוֹתִיךָ עַל הָרֵי יִשְׂרָאֵל
  choice: und dich gegen die Berge Israels führen
  rationale: עַל erhält im militärischen Zusammenhang die feindliche Zielrichtung. „Gegen“ macht diese Bewegung deutlich, während „führen“ das göttlich bestimmte Heranbringen ausdrückt.
theological_decisions:
- issue: Deutung des schwierigen Verbs וְשִׁשֵּׁאתִיךָ
  choice: 'Bewegungsverb: „dich weitertreiben“'
  alternative: 'Teilungs- beziehungsweise Restdeutung: „nur ein Sechstel von dir übrig lassen“'
  rationale: Die unmittelbare Folge handelt durchgehend davon, wie Gott Gogs Bewegung lenkt, ihn heraufführt und gegen Israel bringt. Die Bewegungsdeutung erhält diesen Zusammenhang. Da die numerische Deutung eine bedeutsame Übersetzungstradition besitzt, wird sie als echte Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Sätze vermeiden eine schwerfällige Reihung gleichartiger Verben. „Herumlenken“, „weitertreiben“ und „führen“ machen Gottes bestimmendes Handeln verständlich, ohne die schwierige Lesart dogmatisch festzulegen.
