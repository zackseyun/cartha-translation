  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עַתָּ֗ה אָשִׁיב֙ אֶת שבית יַֽעֲקֹ֔ב וְ/רִֽחַמְתִּ֖י כָּל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/קִנֵּאתִ֖י לְ/שֵׁ֥ם קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/025.yaml
  text: 'Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob[a], and I will have compassion on the whole house of Israel[b], and I will be jealous for my holy name.'
translation:
  language: de
  text: 'Darum, so spricht der Herr, Jahwe: Jetzt werde ich das Geschick Jakobs wenden[a] und mich über das ganze Haus Israel erbarmen; ich werde für meinen heiligen Namen eifern[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gefangenen Jakobs zurückbringen“. Die hebräische Wendung kann die Rückkehr aus Gefangenschaft oder allgemeiner die Wiederherstellung eines Volkes bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mit Eifer für meinen heiligen Namen eintreten“. Das hebräische Verb kann auch die Nuance eifersüchtiger Ausschließlichkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang knapp und natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die geläufige prophetische Botenformel in würdigem, verständlichem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Gibt אֲדֹנָי als „Herr“ wieder und bewahrt den Gottesnamen יהוה als „Jahwe“; das Komma macht die Verbindung im Deutschen lesbar.
- source_word: עַתָּה
  choice: Jetzt
  rationale: Markiert den entscheidenden Übergang zum angekündigten göttlichen Handeln.
- source_word: אָשִׁיב אֶת שבית יַעֲקֹב
  choice: werde ich das Geschick Jakobs wenden
  rationale: Die deutsche Wendung gibt die hebräische Wiederherstellungsformel idiomatisch wieder, ohne sie ausschließlich auf eine Rückkehr aus Gefangenschaft festzulegen.
- source_word: וְרִחַמְתִּי
  choice: und mich ... erbarmen
  rationale: Gibt das tiefe Erbarmen von רחם natürlich wieder und bewahrt zugleich dessen theologisches Gewicht.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Bewahrt den kollektiven Bundesausdruck „Haus Israel“ und die umfassende Bedeutung von כָּל.
- source_word: וְקִנֵּאתִי
  choice: Und ich werde mit Eifer ... eintreten
  rationale: קנא bezeichnet hier Gottes leidenschaftlichen, eifersüchtigen Eifer für seinen Namen. Die Hauptfassung ist im heutigen Deutsch natürlich und vermeidet die mögliche Fehlassoziation sündhaften Neids.
- source_word: לְשֵׁם קָדְשִׁי
  choice: für meinen heiligen Namen
  rationale: Gibt die Ausrichtung des göttlichen Eifers auf die Heiligkeit seines Namens prägnant wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der Herr, Jahwe
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Der Eigenname wird als „Jahwe“ sichtbar bewahrt, während אֲדֹנָי eigenständig mit „Herr“ wiedergegeben wird.
- issue: Bedeutung der Wiederherstellungsformel אֶת שבית יעקב
  choice: das Geschick Jakobs wenden
  alternative: die Gefangenen Jakobs zurückbringen
  rationale: Die Formel kann eine umfassende Wiederherstellung oder konkreter die Rückführung aus Gefangenschaft bezeichnen. Die Hauptfassung lässt den weiteren Sinn stehen; die engere Möglichkeit erscheint in der Fußnote.
- issue: Nuance von קנא bei Gottes heiligem Namen
  choice: mit Eifer für meinen heiligen Namen eintreten
  alternative: um meinen heiligen Namen eifern; eifersüchtig über meinen heiligen Namen wachen
  rationale: Die Formulierung bewahrt den leidenschaftlichen göttlichen Eifer, ohne קנא auf menschlichen Neid zu verengen. Die Fußnote nennt eine formal nähere Alternative.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Register. „So spricht“ erhält die biblische Botenformel, während „das Geschick wenden“ und „mit Eifer ... eintreten“ für heutige Leser verständlich bleiben. Sämtliche Fußnotenmarker stehen im Haupttext.
