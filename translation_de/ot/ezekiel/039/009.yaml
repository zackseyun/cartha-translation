  text: וְֽ/יָצְא֞וּ יֹשְׁבֵ֣י עָרֵ֣י יִשְׂרָאֵ֗ל וּ/בִעֲר֡וּ וְ֠/הִשִּׂיקוּ בְּ/נֶ֨שֶׁק וּ/מָגֵ֤ן וְ/צִנָּה֙ בְּ/קֶ֣שֶׁת וּ/בְ/חִצִּ֔ים וּ/בְ/מַקֵּ֥ל יָ֖ד וּ/בְ/רֹ֑מַח וּ/בִעֲר֥וּ בָ/הֶ֛ם אֵ֖שׁ שֶׁ֥בַע שָׁנִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/009.yaml
  text: Then the inhabitants of the cities of Israel will go out and make fires with the weapons and burn them—the small shield and the large shield[a], the bow and the arrows[c][b], the hand-club and the spear—and they will make fires with them for seven years.
translation:
  language: de
  text: 'Dann werden die Bewohner der Städte Israels hinausgehen und mit den Waffen Feuer machen und sie verbrennen: den kleinen Schild und den großen Schild[a], Bogen und Pfeile, den Handstab[b] und den Speer. Sie werden sieben Jahre lang mit ihnen Feuer machen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen hier zwei verschiedene Schildbezeichnungen, wahrscheinlich für einen kleineren Schild und einen großen Körperschild.
    reason: cultural_note
  - marker: b
    text: Wörtlich etwa „Stab der Hand“. In dieser Waffenliste ist vermutlich eine in der Hand geführte Schlagwaffe gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: werden … hinausgehen
  rationale: Gibt die Grundbedeutung von יצא und die zukünftige Erzählfolge natürlich wieder.
- source_word: יֹשְׁבֵי עָרֵי יִשְׂרָאֵל
  choice: die Bewohner der Städte Israels
  rationale: Bewahrt die konkrete Bezeichnung der Stadtbewohner in natürlichem modernem Deutsch.
- source_word: וּבִעֲרוּ וְהִשִּׂיקוּ בְּנֶשֶׁק
  choice: mit den Waffen Feuer machen und sie verbrennen
  rationale: Die Verbindung der beiden Verben ist schwierig; der Kontext zeigt, dass die Waffen als Brennmaterial verwendet werden. Die Formulierung bewahrt beide Verbalideen, ohne eine unsichere technische Nuance festzulegen.
- source_word: מָגֵן וְצִנָּה
  choice: den kleinen und den großen Schild
  rationale: Macht die wahrscheinliche Unterscheidung zwischen einem kleineren Schild und einem großen Körperschild verständlich sichtbar.
- source_word: קֶשֶׁת וּבְחִצִּים
  choice: Bogen und Pfeile
  rationale: Entspricht den üblichen Bedeutungen und ist im Deutschen als Waffenpaar idiomatisch.
- source_word: מַקֵּל יָד
  choice: die Handkeule
  rationale: Die wörtliche Verbindung ‚Stab der Hand‘ bezeichnet in dieser Waffenliste wahrscheinlich eine in der Hand geführte Schlagwaffe; die Fußnote erhält die lexikalische Unsicherheit.
- source_word: רֹמַח
  choice: den Speer
  rationale: Natürliche Standardentsprechung für die militärische Waffe.
- source_word: וּבִעֲרוּ בָהֶם אֵשׁ שֶׁבַע שָׁנִים
  choice: Sie werden sieben Jahre lang mit ihnen Feuer machen
  rationale: Bewahrt die instrumentale Wendung בָהֶם und die ausdrücklich genannte Dauer.
