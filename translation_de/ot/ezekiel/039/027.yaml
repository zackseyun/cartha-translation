  text: בְּ/שׁוֹבְבִ֤/י אוֹתָ/ם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֹתָ֔/ם מֵֽ/אַרְצ֖וֹת אֹֽיְבֵי/הֶ֑ם וְ/נִקְדַּ֣שְׁתִּי בָ֔/ם לְ/עֵינֵ֖י הַ/גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/027.yaml
  text: when I bring them back from the peoples and gather them from the lands of their enemies[a], and I am shown holy through them before the eyes of many nations.
translation:
  language: de
  text: Wenn ich sie aus den Völkern zurückbringe und sie aus den Ländern ihrer Feinde sammle, werde ich mich an ihnen vor den Augen vieler Nationen als heilig erweisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „werde ich an ihnen geheiligt werden“. Das Hebräische kann hier auch die Nuance „durch sie“ haben. Gemeint ist, dass Gottes Heiligkeit durch sein Handeln an ihnen öffentlich sichtbar wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹבְבִי
  choice: Wenn ich … zurückbringe
  rationale: Die Präposition ב mit dem Infinitivus constructus und dem Suffix der 1. Person Singular ist hier temporal; der Hifil von שוב bezeichnet das Veranlassen der Rückkehr aus dem Exil.
- source_word: הָעַמִּים
  choice: den Völkern
  rationale: „Völker“ gibt עמים wieder und wahrt die lexikalische Unterscheidung zum späteren גוים.
- source_word: וְקִבַּצְתִּי
  choice: und … sammle
  rationale: Das Verb קבץ bedeutet „sammeln, zusammenbringen“; im temporalen Satzgefüge wird die hebräische Perfektform natürlich dem ersten Verb beigeordnet.
- source_word: מֵאַרְצוֹת אֹיְבֵיהֶם
  choice: aus den Ländern ihrer Feinde
  rationale: Die Form bewahrt sowohl den Plural „Länder“ als auch die Genitivbeziehung zu „ihren Feinden“.
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: werde ich mich durch sie … als heilig erweisen
  rationale: Der Nifal von קדש bezeichnet bei Gott die öffentliche Offenbarung beziehungsweise Bestätigung seiner Heiligkeit. „Durch sie“ gibt בם als Mittel oder Sphäre des göttlichen Handelns verständlich wieder, ohne anzudeuten, Gott werde erst heilig.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die geläufige Wendung bewahrt das hebräische Bild öffentlicher Sichtbarkeit.
- source_word: הַגּוֹיִם רַבִּים
  choice: vieler Nationen
  rationale: „Nationen“ bezeichnet hier die internationale Völkerwelt; „vieler“ gibt רבים idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe der Aussage von Gottes Heiligung
  choice: werde ich mich durch sie als heilig erweisen
  alternative: werde ich durch sie geheiligt werden / werde ich mich an ihnen als heilig erweisen
  rationale: Die gewählte Formulierung wahrt den passiv-reflexiven Sinn des hebräischen Nifal und macht zugleich deutlich, dass Gottes bereits bestehende Heiligkeit öffentlich sichtbar wird. Die Präposition ב lässt sowohl „durch sie“ als auch „an/in ihnen“ zu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Völker“ und „Nationen“ halten die Unterscheidung zwischen עמים und גוים fest; die traditionelle Bildsprache „vor den Augen“ bleibt erhalten.
