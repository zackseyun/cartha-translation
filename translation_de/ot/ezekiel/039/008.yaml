base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/008.yaml
  text: Behold[a], it is coming, and it will happen, declares the Lord GOD. This is the day of which I have spoken.
translation:
  language: de
  text: Siehe[a], es kommt und wird geschehen – Ausspruch des Herrn Jahwe. Das ist der Tag, von dem ich gesprochen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann man auch übersetzen: „Siehe, es ist gekommen, es ist geschehen.“ Die hebräischen Formen können ein zukünftiges Ereignis als so gewiss darstellen, dass davon wie von etwas bereits Vollendetem gesprochen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt den prophetischen Aufmerksamkeitsruf und den feierlichen Ton; im heutigen Deutsch ist die Wendung weiterhin verständlich.
- source_word: בָאָה
  choice: es kommt
  rationale: Die morphologische Perfektform kann im prophetischen Sprachgebrauch ein zukünftiges Geschehen als gewiss darstellen. Das sächliche Pronomen gibt die nicht ausdrücklich genannte Sache wieder, ohne aus dem grammatischen Femininum eine weibliche Person abzuleiten.
- source_word: וְנִהְיָתָה
  choice: und wird geschehen
  rationale: Gibt das Eintreten des angekündigten Geschehens in natürlichem Deutsch wieder und wahrt zugleich die Zukunftsorientierung des Zusammenhangs.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Gibt die feste prophetische Botenformel knapp und würdevoll wieder; der anschließende Genitiv entspricht der Form des Hebräischen.
- source_word: אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  rationale: Gibt sowohl den Herrentitel als auch den offenbarten Gottesnamen wieder. Die im Deutschen übliche Schreibweise „Jahwe“ vermeidet die Verwechslung beider Bestandteile.
- source_word: הוּא הַיּוֹם
  choice: Das ist der Tag
  rationale: Die Formulierung bewahrt die nachdrückliche Identifizierung des angekündigten Tages.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: von dem ich gesprochen habe
  rationale: Natürliches modernes Deutsch, das den Rückbezug auf Gottes frühere prophetische Ankündigung deutlich macht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr; der Herr, der HERR
  rationale: Der Text verbindet ausdrücklich den Titel אֲדֹנָי mit dem Gottesnamen יהוה. „Der Herr Jahwe“ hält beide auseinander und lässt den Eigennamen sichtbar, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Zeitbezug der beiden Perfektformen בָאָה und נִהְיָתָה
  choice: 'zukünftig als gewiss angekündigt: „es kommt und wird geschehen“'
  alternative: 'als bereits vollendet: „es ist gekommen und geschehen“'
  rationale: Der Zusammenhang weist auf den angekündigten Tag hin. Zugleich bleibt die formale Möglichkeit einer Darstellung als bereits vollendete Gewissheit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem Signalwort „Siehe“. Der Gedankenstrich gliedert die Botenformel, ohne den knappen Nachdruck des hebräischen Satzes abzuschwächen.
