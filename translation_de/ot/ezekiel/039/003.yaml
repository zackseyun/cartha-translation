  text: וְ/הִכֵּיתִ֥י קַשְׁתְּ/ךָ֖ מִ/יַּ֣ד שְׂמֹאולֶ֑/ךָ וְ/חִצֶּ֕י/ךָ מִ/יַּ֥ד יְמִינְ/ךָ֖ אַפִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/003.yaml
  text: And I will strike your bow from your left hand[a], and I will make your arrows fall from your right hand.
translation:
  language: de
  text: Ich werde dir den Bogen aus deiner linken Hand schlagen und deine Pfeile aus deiner rechten Hand fallen lassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: Ich schlage … aus
  rationale: Das Hiphil von נכה bezeichnet hier ein Schlagen, durch das die Waffe aus der Hand gelöst wird. Die deutsche Verbindung „jemandem etwas aus der Hand schlagen“ gibt Handlung und Ergebnis natürlich wieder; das einleitende וְ wird im fortlaufenden deutschen Satz nicht eigens mit „und“ wiedergegeben.
- source_word: קַשְׁתְּךָ
  choice: dir den Bogen
  rationale: קֶשֶׁת bezeichnet den Bogen. Der Besitzsuffix der 2. Person maskulin Singular wird in der idiomatischen Konstruktion „dir den Bogen aus der Hand schlagen“ durch „dir“ ausgedrückt.
- source_word: מִיַּד שְׂמֹאולֶךָ
  choice: aus deiner linken Hand
  rationale: Die wörtliche Vorstellung „aus der Hand deiner Linken“ wird in natürlichem Deutsch konkret und unter Wahrung des Parallelismus wiedergegeben.
- source_word: וְחִצֶּיךָ
  choice: und … deine Pfeile
  rationale: חֵץ steht hier im Plural mit dem Besitzsuffix der 2. Person maskulin Singular; die Konjunktion wird mit „und“ beibehalten.
- source_word: מִיַּד יְמִינְךָ
  choice: aus deiner rechten Hand
  rationale: Die Formulierung bewahrt das Körperbild und den Parallelismus zur linken Hand.
- source_word: אַפִּיל
  choice: lasse … fallen
  rationale: Das Hiphil von נפל ist kausativ. „Lasse … fallen“ drückt aus, dass Gott bewirkt, dass die Pfeile aus der Hand fallen, ohne eine darüber hinausgehende Zerstörung der Pfeile vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „aus der Hand schlagen“ wahrt die kräftige Bildsprache des Hebräischen; die zweite Hälfte bleibt enger an der kausativen Form des Ausgangstextes.
