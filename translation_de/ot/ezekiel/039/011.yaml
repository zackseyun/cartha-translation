  text: וְ/הָיָ֣ה בַ/יּ֣וֹם הַ/ה֡וּא אֶתֵּ֣ן לְ/גוֹג֩ מְקֽוֹם שָׁ֨ם קֶ֜בֶר בְּ/יִשְׂרָאֵ֗ל גֵּ֤י הָ/עֹֽבְרִים֙ קִדְמַ֣ת הַ/יָּ֔ם וְ/חֹסֶ֥מֶת הִ֖יא אֶת הָ/עֹֽבְרִ֑ים וְ/קָ֣בְרוּ שָׁ֗ם אֶת גּוֹג֙ וְ/אֶת כָּל הֲמוֹנֹ֔/ה וְ/קָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/011.yaml
  text: And it will be in that day that I will give Gog a burial place there in Israel[a], the Valley of the Travelers, east of the sea; and it will block the travelers. There they will bury Gog and all his multitude[c][b], and they will call it the Valley of Hamon-gog.
translation:
  language: de
  text: 'An jenem Tag werde ich Gog dort in Israel eine Grabstätte geben: das Tal der Durchziehenden,[a] östlich des Meeres.[b] Es wird die Durchziehenden aufhalten. Dort wird man Gog und seine ganze Schar begraben, und man wird das Tal »Hamon-Gog« nennen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »das Tal der Vorüberziehenden«; gemeint sind Menschen, die dort hindurch- oder vorbeiziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor dem Meer«; der hebräische Ausdruck kann eine räumliche Orientierung bezeichnen und muss nicht ausschließlich eine genaue Himmelsrichtung angeben.'
    reason: lexical_alternative
  - marker: c
    text: Hamon-Gog bedeutet wahrscheinlich »Gogs Menge«.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם שָׁם קֶבֶר
  choice: dort … eine Grabstätte
  rationale: Gibt sowohl das lokative שָׁם als auch den Begräbnisbezug von קֶבֶר in natürlichem Deutsch wieder.
- source_word: גֵּי הָעֹבְרִים
  choice: das Tal der Durchziehenden
  rationale: Das substantivierte Partizip von עבר bezeichnet Menschen, die hindurch- oder vorüberziehen. „Durchziehende“ bewahrt diesen Vorgang und eignet sich zugleich als Ortsbezeichnung.
- source_word: קִדְמַת הַיָּם
  choice: östlich des Meeres
  rationale: In geografischem Zusammenhang ist dies die wahrscheinlichste Bedeutung; die mögliche Orientierung „vor dem Meer“ bleibt in einer Fußnote erhalten.
- source_word: וְחֹסֶמֶת הִיא אֶת הָעֹבְרִים
  choice: Es wird die Durchziehenden aufhalten
  rationale: חסם bedeutet blockieren oder aufhalten. Die Formulierung folgt dem hebräischen Objekt, ohne einen nicht ausdrücklich genannten Weg einzufügen.
- source_word: הֲמוֹנוֹ
  choice: seine ganze Menge
  rationale: הָמוֹן bezeichnet eine Menge, Masse oder Schar. „Menge“ bleibt bewusst weit und verengt den Ausdruck nicht ausdrücklich auf ein Heer.
- source_word: גֵּיא הֲמוֹן גּוֹג
  choice: das Tal »Hamon-Gog«
  rationale: Da die Wendung als neu vergebener Ortsname dient, wird sie transliteriert; ihre wahrscheinliche Bedeutung wird in der Fußnote erklärt.
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Bewahrt die prophetische Zeitformel in knapper, würdiger und heute natürlicher Sprache.
- source_word: אֶתֵּן לְגוֹג
  choice: werde ich Gog … geben
  rationale: נתן mit ל bezeichnet hier das Geben beziehungsweise Zuweisen einer Grabstätte.
theological_decisions:
- issue: Wiedergabe des abschließenden Ortsnamens
  choice: Transliteration als „Hamon-Gog“ im Haupttext
  alternative: Semantische Übersetzung als „Gogs Menge“
  rationale: Die Wendung fungiert als Ortsname. Die Transliteration wahrt diesen Namenscharakter, während die Fußnote die Bedeutung zugänglich macht.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur bleibt quellennah, vermeidet jedoch altertümliche Formeln. Die wiederholten „Durchziehenden“ und „Menge“ bewahren zentrale hebräische Wortbezüge.
