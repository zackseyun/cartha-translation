source:
  edition: WLC
  text: וְ/אַנְשֵׁ֨י תָמִ֤יד יַבְדִּ֨ילוּ֙ עֹבְרִ֣ים בָּ/אָ֔רֶץ מְקַבְּרִ֣ים אֶת הָ/עֹבְרִ֗ים אֶת הַ/נּוֹתָרִ֛ים עַל פְּנֵ֥י הָ/אָ֖רֶץ לְ/טַֽהֲרָ֑/הּ מִ/קְצֵ֥ה שִׁבְעָֽה חֳדָשִׁ֖ים יַחְקֹֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/014.yaml
  text: And they will set apart men continually[a], who will pass through the land burying those who pass through, those left on the surface of the land, to cleanse it[c][b]. At the end of seven months they will make a search.
translation:
  language: de
  text: Und sie werden Männer dauerhaft[a] absondern, die das Land durchziehen und dabei die Durchziehenden[b] begraben, nämlich die, die auf der Fläche des Landes übrig geblieben sind, um es zu reinigen. Nach Ablauf von sieben Monaten werden sie Nachforschungen anstellen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Männer der Beständigkeit“; gemeint ist wahrscheinlich eine fortlaufende oder regelmäßig wahrgenommene Beauftragung.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische wiederholt hier das Verb „durchziehen“. Im Zusammenhang sind wahrscheinlich die Toten gemeint, die im Land liegen geblieben sind; der Wortlaut ist jedoch schwierig und kann bewusst an das Durchziehen der Suchenden anknüpfen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sie werden gründlich suchen“ beziehungsweise „sie werden Nachforschungen durchführen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי תָמִיד
  choice: Männer für den ständigen Dienst
  rationale: Die konstruktive Verbindung bedeutet wörtlich etwa „Männer der Beständigkeit“. Die gewählte Formulierung bezeichnet verständlich eine fortlaufende Beauftragung, ohne תָמִיד lediglich als Häufigkeitsangabe zum Aussondern zu lesen.
- source_word: יַבְדִּילוּ
  choice: sie werden … aussondern
  rationale: Der Hifil von בדל bedeutet „absondern, aussondern“. Im Zusammenhang schließt dies die Bestimmung zu einer besonderen Aufgabe ein, ohne dass das allgemeinere Verb zu „ernennen“ verengt wird.
- source_word: עֹבְרִים בָּאָרֶץ
  choice: die das Land durchziehen
  rationale: Das Partizip von עבר bezeichnet die Bewegung durch das Land. Ein deutscher Relativsatz gibt die Funktion der beauftragten Männer natürlich wieder.
- source_word: מְקַבְּרִים
  choice: und dabei … begraben
  rationale: Das Partizip beschreibt die begleitende Tätigkeit der Männer beim Durchziehen des Landes.
- source_word: הָעֹבְרִים
  choice: die Durchziehenden
  rationale: Die schwierige Wiederholung derselben Wurzel עבר wird durch „durchziehen/Durchziehenden“ sichtbar erhalten. Der Zusammenhang weist auf die zurückgebliebenen Toten, doch diese Deutung wird nicht lautlos in den Haupttext eingesetzt.
- source_word: הַנּוֹתָרִים עַל־פְּנֵי הָאָרֶץ
  choice: die, die auf der Fläche des Landes übrig geblieben sind
  rationale: Die Wendung bezeichnet Zurückgebliebene auf der Oberfläche des Landes. „Land“ vermeidet hier die mögliche, aber unpassende Globalisierung durch „Erde“.
- source_word: לְטַהֲרָהּ
  choice: um es zu reinigen
  rationale: טהר umfasst in diesem Zusammenhang die Reinigung des durch Leichen verunreinigten Landes und lässt sowohl die kultische als auch die praktische Dimension offen.
- source_word: מִקְצֵה שִׁבְעָה חֳדָשִׁים
  choice: Nach Ablauf von sieben Monaten
  rationale: Die Präposition מן mit קצה bezeichnet hier den Zeitpunkt nach Vollendung des siebenmonatigen Zeitraums.
- source_word: יַחְקֹרוּ
  choice: sie werden Nachforschungen anstellen
  rationale: חקר bezeichnet gründliches Suchen oder Untersuchen. Die Formulierung lässt das im Hebräischen nicht ausdrücklich genannte Objekt offen und vermittelt den organisierten Charakter der Suche.
theological_decisions:
- issue: Art der Reinigung des Landes
  choice: „reinigen“ bewahrt sowohl die kultische als auch die praktische Bedeutung
  alternative: ausschließlich rituell „entsühnen/rein machen“ oder ausschließlich praktisch „säubern“
  rationale: Die Bestattung der offen liegenden Toten hat in Hesekiel eine Verunreinigungsdimension, doch der Vers beschränkt die Reinigung nicht ausdrücklich auf nur eine Kategorie.
- issue: Identität der „Durchziehenden“
  choice: Die schwierige Wiederholung von עבר bleibt im Haupttext erhalten und wird in einer Fußnote erläutert
  alternative: direkte Wiedergabe als „die Toten“ oder „die Gefallenen“
  rationale: Der Zusammenhang legt Leichen nahe, aber die ungewöhnliche hebräische Formulierung soll nicht durch eine eindeutige, im Wortlaut nicht vorhandene Identifikation ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt trotz der schwierigen Partizipialfolge lesbar; „nämlich“ kennzeichnet die wahrscheinliche Apposition. Die Wiederholung von עבר und die Mehrdimensionalität von טהר werden bewahrt.
