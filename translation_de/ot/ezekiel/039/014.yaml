  to: Und sie werden Männer dauerhaft[a] absondern, die das Land durchziehen und dabei die Durchziehenden[b] begraben, nämlich die, die auf der Fläche des Landes übrig geblieben sind, um es zu reinigen. Nach Ablauf von sieben Monaten werden sie Nachforschungen anstellen[c].
