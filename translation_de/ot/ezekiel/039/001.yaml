source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ הִנָּבֵ֣א עַל גּ֔וֹג וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/001.yaml
  text: 'And you[a], son of man, prophesy against Gog, and say: Thus says the Lord GOD: Behold, I am against you, Gog, prince of Rosh, Meshech, and Tubal.'
translation:
  language: de
  text: 'Und du, Menschensohn, weissage gegen Gog und sage: So spricht der Herr Jahwe: Siehe, ich bin gegen dich, Gog, oberster Fürst von Meschech und Tubal.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürst von Rosch, Meschech und Tubal.“ Das hebräische Wort rosch kann „oberster“ bedeuten oder als Eigenname verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels charakteristische göttliche Anrede und ihre literarische Kontinuität, ohne sie paraphrasierend aufzulösen.
- source_word: הִנָּבֵא עַל
  choice: weissage gegen
  rationale: Der Imperativ bezeichnet prophetisches Reden; עַל hat im vorliegenden Gerichtswort eine gegen den Adressaten gerichtete Bedeutung.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Gibt beide Bestandteile des Gottestitels wieder und bewahrt den im Hebräischen ausdrücklich genannten Gottesnamen in der im Deutschen üblichen Form „Jahwe“.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Siehe, ich gehe gegen dich vor
  rationale: „Siehe“ erhält den feierlichen Nachdruck von הִנְנִי; „ich gehe gegen dich vor“ gibt die feindliche Gerichtsformel in natürlichem Deutsch wieder.
- source_word: נְשִׂיא רֹאשׁ
  choice: oberster Fürst
  rationale: Liest רֹאשׁ als Gattungswort, das den Rang des Fürsten bezeichnet; dies ergibt eine natürliche hebräische Konstruktion. Die mögliche Lesung als Eigenname wird in der Fußnote erhalten.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Meschech und Tubal
  rationale: Die Eigennamen werden in ihren geläufigen deutschen biblischen Formen wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung macht sowohl den Herrschaftstitel als auch den ausdrücklich gesetzten Bundesnamen sichtbar, ohne beide zu einem einzigen Titel zusammenzuziehen.
- issue: Deutung von רֹאשׁ in נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל
  choice: oberster Fürst von Meschech und Tubal
  alternative: Fürst von Rosch, Meschech und Tubal
  rationale: רֹאשׁ lässt sich syntaktisch gut als Rangbezeichnung zu נְשִׂיא verstehen. Da die Deutung als Eigenname ernsthaft möglich und traditionsreich ist, wird sie ausdrücklich in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem prophetischem Sprachklang. „Siehe“ und „Menschensohn“ erhalten zentrale Formen des hebräischen Buchstils; die übrige Syntax bleibt klar und gegenwärtig.
