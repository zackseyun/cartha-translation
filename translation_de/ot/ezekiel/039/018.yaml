source:
  edition: WLC
  text: בְּשַׂ֤ר גִּבּוֹרִים֙ תֹּאכֵ֔לוּ וְ/דַם נְשִׂיאֵ֥י הָ/אָ֖רֶץ תִּשְׁתּ֑וּ אֵילִ֨ים כָּרִ֤ים וְ/עַתּוּדִים֙ פָּרִ֔ים מְרִיאֵ֥י בָשָׁ֖ן כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/018.yaml
  text: You will eat the flesh of mighty men[a], and you will drink the blood of the princes of the earth—rams, lambs, male goats, and bulls[b], all of them fattened ones of Bashan.
translation:
  language: de
  text: 'Ihr werdet das Fleisch von Kriegern essen und das Blut der Fürsten der Erde trinken: Widder, Lämmer, Ziegenböcke und Stiere[a] – allesamt Masttiere aus Baschan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Tierbezeichnungen sind Opferbildsprache für die erschlagenen Herrscher und Krieger.
    reason: cultural_note
  - marker: b
    text: 'Baschan war für sein fruchtbares Weideland und sein wohlgenährtes Vieh bekannt. Möglich ist auch: „gemästete Tiere aus Baschan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר גִּבּוֹרִים
  choice: das Fleisch von Kriegshelden
  rationale: בָּשָׂר bezeichnet hier leibliches Fleisch und bewahrt die drastische Opfermahlbildsprache. גִּבּוֹרִים meint im militärischen Zusammenhang starke, kampferprobte Männer; „Kriegshelden“ ist präzise und im heutigen Deutsch verständlich.
- source_word: תֹּאכֵלוּ … תִּשְׁתּוּ
  choice: ihr werdet … essen … trinken
  rationale: Die Imperfektformen der 2. Person Plural wirken im prophetischen Zusammenhang als Ankündigung dessen, was die herbeigerufenen Gäste tun werden.
- source_word: דַם נְשִׂיאֵי הָאָרֶץ
  choice: das Blut der Fürsten der Erde
  rationale: „Blut“ wahrt die ungemilderte Schlacht- und Opfersprache. נְשִׂיאִים bezeichnet Fürsten, Oberhäupter oder Anführer; „Fürsten“ erhält das gehobene Register. הָאָרֶץ wird hier angesichts des internationalen Horizonts mit „der Erde“ wiedergegeben.
- source_word: אֵילִים כָּרִים וְעַתּוּדִים פָּרִים
  choice: Widder, Lämmer, Ziegenböcke und Stiere
  rationale: Die konkreten Tierbezeichnungen erhalten das Opferbild. „Lämmer“ unterscheidet כָּרִים verständlich von den zuvor genannten Widdern, während „Ziegenböcke“ das männliche Geschlecht von עַתּוּדִים ausdrückt.
- source_word: מְרִיאֵי בָשָׁן כֻּלָּם
  choice: allesamt Masttiere aus Baschan
  rationale: מְרִיאִים bezeichnet gemästete beziehungsweise wohlgenährte Tiere. „Masttiere“ ist knapp und anschaulich; „allesamt“ bezieht die Aussage deutlich auf die gesamte vorausgehende Tierliste.
theological_decisions:
- issue: Verhältnis der Tierliste zu den getöteten Kriegern und Fürsten
  choice: Die Tiere werden wörtlich benannt, während Doppelpunkt und Zusammenhang ihre metaphorische Gleichsetzung mit den menschlichen Opfern erkennen lassen.
  alternative: Die Tiernamen unmittelbar als Bezeichnungen menschlicher Machthaber auflösen.
  rationale: Der hebräische Text entfaltet bewusst ein Opfermahlbild. Eine erklärende Auflösung im Haupttext würde die drastische Bildsprache glätten und die Spannung zwischen menschlichen Gefallenen und Opfertieren beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Körper- und Blutmetaphorik wird nicht abgeschwächt. Der Gedankenstrich markiert die zusammenfassende Apposition, ohne die Bildsprache erklärend aufzulösen.
