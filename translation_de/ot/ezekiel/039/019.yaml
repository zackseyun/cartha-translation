  text: וַ/אֲכַלְתֶּם חֵ֣לֶב לְ/שָׂבְעָ֔ה וּ/שְׁתִ֥יתֶם דָּ֖ם לְ/שִׁכָּר֑וֹן מִ/זִּבְחִ֖/י אֲשֶׁר זָבַ֥חְתִּי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/019.yaml
  text: You will eat fat until you are full[a], and you will drink blood to drunkenness, from my sacrifice that I have sacrificed for you.
translation:
  language: de
  text: Ihr werdet Fett essen, bis ihr satt seid, und Blut trinken, bis ihr berauscht seid, von meinem Schlachtopfer, das ich für euch geschlachtet habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »von meinem Opfermahl, das ich für euch bereitet habe«. Im Hebräischen steht wörtlich Opfersprache (»mein Schlachtopfer, das ich geschlachtet habe«); aus dem Zusammenhang geht hervor, dass es sich um ein Mahl an den Erschlagenen handelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Ihr werdet essen
  rationale: Das Wayyiqtol der 2. Person Plural setzt in der prophetischen Ankündigung die zukünftige Handlung der angesprochenen Vögel und Tiere fort.
- source_word: חֵלֶב
  choice: Fett
  rationale: Die direkte Entsprechung bewahrt die konkrete und kultisch geprägte Bildsprache; »Fettstücke« wäre bereits ausdeutend.
- source_word: לְשָׂבְעָה
  choice: bis ihr satt seid
  rationale: Die Wendung bezeichnet Sättigung beziehungsweise das volle Maß und wird so in natürlichem modernem Deutsch wiedergegeben.
- source_word: וּשְׁתִיתֶם דָּם לְשִׁכָּרוֹן
  choice: und Blut trinken, bis ihr berauscht seid
  rationale: »Blut« bleibt als bewusst drastisches Bild ausdrücklich stehen. »Bis ihr berauscht seid« gibt den erreichten Zustand idiomatisch wieder, ohne ihn auf gewöhnlichen Alkoholrausch zu verengen.
- source_word: מִזִּבְחִי
  choice: von meinem Schlachtopfer
  rationale: »Schlachtopfer« bewahrt sowohl den Opferbegriff als auch den Zusammenhang des geschlachteten Heeres und ist im Deutschen präziser als das allgemeinere »Opfer«.
- source_word: אֲשֶׁר זָבַחְתִּי לָכֶם
  choice: das ich für euch geschlachtet habe
  rationale: Die Wiedergabe erhält die bewusste Wiederholung des hebräischen Opferwortfeldes zwischen זֶבַח und זבח sowie die düstere Ironie des für die Tiere bereiteten Mahls.
theological_decisions:
- issue: Opfersprache als Bild für Gottes Gericht
  choice: 'Die ausdrückliche Opfersprache bleibt im Haupttext erhalten: »mein Schlachtopfer, das ich für euch geschlachtet habe«.'
  alternative: »mein Opfermahl, das ich für euch bereitet habe«
  rationale: Der Zusammenhang beschreibt das Gericht über Gogs Heer als ein von Gott zugerichtetes Opfermahl für Vögel und Tiere. Die wörtliche Wiederholung bewahrt die theologische Spannung und die Härte des Gerichtsbildes, während die kontextuelle Deutung in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Gerichts- und Opfersprache wird nicht abgeschwächt. »Berauscht« ist idiomatisch und lässt die bildhafte Wirkung von Blut als berauschendem Trank bestehen.
