id: EZK.39.22
reference: Ezekiel 39:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם מִן הַ/יּ֥וֹם הַ/ה֖וּא וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/022.yaml
  text: And the house of Israel will know that I am Yahweh their God from that day onward[a].
translation:
  language: de
  text: Und das Haus Israel wird von jenem Tag an erkennen, dass ich Jahwe, ihr Gott, bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von jenem Tag an und weiterhin“.'
    reason: Das hebräische וָהָלְאָה bezeichnet ausdrücklich die Fortdauer, die im Deutschen bereits idiomatisch in „von jenem Tag an“ enthalten ist.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und … wird … erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang zukünftige beziehungsweise resultative Bedeutung. „Erkennen“ umfasst hier mehr als bloßes Wissen und lässt den Gedanken der Bundesbeziehung anklingen, ohne ausdrücklich „anerkennen“ oder „bekennen“ einzutragen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die feste kollektive Bezeichnung wird formal bewahrt; sie hebt Israel als Gemeinschaft hervor.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Israel erkennen wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihr Gott
  rationale: Die idiomatische deutsche Wiedergabe des Nomens mit Suffix bewahrt die bundesbezogene Aussage.
- source_word: מִן הַיּוֹם הַהוּא וָהָלְאָה
  choice: von jenem Tag an
  rationale: Die natürliche deutsche Wendung bezeichnet sowohl den Ausgangspunkt als auch die von וָהָלְאָה ausdrücklich angezeigte Fortdauer. Eine Fußnote dokumentiert die formnähere Ausdrucksweise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von ידע
  choice: erkennen
  alternative: wissen; anerkennen
  rationale: „Erkennen“ wahrt die Spannung zwischen tatsächlicher Erkenntnis und beziehungsbezogener Anerkennung. „Wissen“ wäre enger kognitiv, „anerkennen“ würde den Sinn stärker festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Kollektivausdruck „Haus Israel“ und der Gottesname „Jahwe“ bleiben erhalten; die Zeitangabe wird idiomatisch vor das Verb gestellt.
