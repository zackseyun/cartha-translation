source:
  edition: WLC
  text: וְ/אֶת שֵׁ֨ם קָדְשִׁ֜/י אוֹדִ֗יעַ בְּ/תוֹךְ֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/לֹֽא אַחֵ֥ל אֶת שֵׁם קָדְשִׁ֖/י ע֑וֹד וְ/יָדְע֤וּ הַ/גּוֹיִם֙ כִּי אֲנִ֣י יְהוָ֔ה קָד֖וֹשׁ בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/007.yaml
  text: And I will make my holy name known in the midst of my people Israel[a], and I will no longer let my holy name be profaned; and the nations will know that I am Yahweh[b], the Holy One in Israel.
translation:
  language: de
  text: Und ich werde meinen heiligen Namen inmitten meines Volkes Israel bekannt machen und nicht länger zulassen, dass mein heiliger Name entweiht wird[a]. Und die Völker werden erkennen, dass ich Yahweh bin, heilig in Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Ich werde meinen heiligen Namen nicht länger entweihen.“ Das hebräische Verb kann so wiedergegeben werden; im Zusammenhang ist wahrscheinlich gemeint, dass Yahweh nicht länger zulässt, dass sein Name entweiht wird.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „dass ich Yahweh bin, der Heilige in Israel.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם קָדְשִׁי
  choice: meinen heiligen Namen
  rationale: Die hebräische Genitivverbindung bedeutet idiomatisch „mein heiliger Name“ und bezeichnet Gottes offenbarten Namen samt seinem heiligen Ansehen.
- source_word: אוֹדִיעַ
  choice: werde ... bekannt machen
  rationale: Der Hifil von ידע hat kausative Bedeutung. Da „meinen heiligen Namen“ ausdrücklich als Objekt genannt wird, ist „bekannt machen“ sachlich und sprachlich passend.
- source_word: בְּתוֹךְ עַמִּי יִשְׂרָאֵל
  choice: mitten in meinem Volk Israel
  rationale: „Mitten in“ bewahrt die räumlich-gemeinschaftliche Bildhaftigkeit von בְּתוֹךְ; „mein Volk Israel“ gibt die knappe Apposition natürlich wieder.
- source_word: וְלֹא אַחֵל אֶת שֵׁם קָדְשִׁי עוֹד
  choice: Ich werde meinen heiligen Namen nicht länger entweihen lassen
  rationale: Der Hifil von חלל kann aktiv oder permissiv-kausativ verstanden werden. Im Zusammenhang der öffentlichen Heiligung des göttlichen Namens ist die permissive Wiedergabe natürlich; die formal direktere Lesart bleibt in der Fußnote erhalten.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Der Ausdruck bezeichnet hier die nichtisraelitischen Nationen allgemein; „die Völker“ ist im Deutschen kontextgemäßer als „die Heiden“.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: der Heilige in Israel
  rationale: Diese Wiedergabe versteht קָדוֹשׁ substantivisch-prädikativ und wahrt den Bezug zu Israel. Die ebenfalls mögliche Lesart „heilig in Israel“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; seine Wiedergabe als „Yahweh“ bewahrt diesen Unterschied gegenüber einem bloßen Herrschaftstitel.
- issue: Subjektwirkung bei אַחֵל
  choice: nicht länger entweihen lassen
  alternative: meinen heiligen Namen nicht länger entweihen
  rationale: Die permissive Deutung passt zum Kontext, in dem Gott die weitere Entweihung seines Namens beendet. Weil die hebräische Form auch eine unmittelbare aktive Wiedergabe zulässt, wird diese Spannung nicht verschwiegen.
- issue: Syntaktische Zuordnung von קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: der Heilige in Israel
  alternative: heilig in Israel
  rationale: Das Hebräische erlaubt sowohl eine substantivische als auch eine adjektivisch-prädikative Auffassung. Der Haupttext verwendet die im Deutschen flüssigere substantivische Lesart, während die Alternative dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge des Hebräischen zu verändern. „Dann“ gibt das folgerichtige וְ natürlich wieder. Beide Fußnotenmarker stehen unmittelbar an den betreffenden Aussagen im Haupttext.
