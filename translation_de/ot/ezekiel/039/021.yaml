source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִ֑ם וְ/רָא֣וּ כָל הַ/גּוֹיִ֗ם אֶת מִשְׁפָּטִ/י֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/אֶת יָדִ֖/י אֲשֶׁר שַׂ֥מְתִּי בָ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/021.yaml
  text: And I will set my glory among the nations[a], and all the nations will see my judgment that I have executed[b], and my hand that I have laid on them.
translation:
  language: de
  text: Ich werde meine Herrlichkeit unter den Völkern sichtbar machen, und alle Völker werden mein Gericht sehen, das ich vollstreckt habe, und meine Hand, die ich auf sie gelegt habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Meine Hand“ ist ein hebräisches Bild für Gottes wirksame Macht und sein Eingreifen, hier besonders im Gericht.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־כְּבוֹדִי
  choice: Ich werde meine Herrlichkeit … sichtbar machen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, anbringen“. Mit כָּבוֹד und angesichts des folgenden Sehens bezeichnet es hier, dass Gott seine Herrlichkeit unter den Völkern erkennbar werden lässt. „Sichtbar machen“ ist im Deutschen natürlicher als „setzen“ und hält den Zusammenhang mit dem folgenden Satz fest.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Die Präposition ב kann hier den Bereich bezeichnen, in dem Gottes Herrlichkeit offenbar wird. „Unter den Völkern“ ist idiomatisches Deutsch und vermeidet neutestamentlich geprägte Nebenbedeutungen von „Heiden“.
- source_word: וְרָאוּ כָל־הַגּוֹיִם
  choice: und alle Völker werden … sehen
  rationale: Die Verbfolge bezeichnet im prophetischen Zusammenhang das künftige Ergebnis von Gottes Handeln. „Werden sehen“ ist klares modernes Deutsch.
- source_word: מִשְׁפָּטִי אֲשֶׁר עָשִׂיתִי
  choice: mein Gericht …, das ich vollstreckt habe
  rationale: מִשְׁפָּט kann Gericht, Recht oder richterliche Entscheidung bedeuten. Im Kontext ist Gottes vollzogene Strafentscheidung gemeint; „Gericht vollstrecken“ gibt die Verbindung mit dem allgemeinen Verb עשה sachgerecht und idiomatisch wieder.
- source_word: וְאֶת־יָדִי אֲשֶׁר שַׂמְתִּי בָהֶם
  choice: und meine Hand, die ich auf sie gelegt habe
  rationale: Die konkrete Metapher „meine Hand“ bleibt erhalten. שׂים mit ב wird räumlich als „auf sie legen“ wiedergegeben und bezeichnet hier Gottes wirksames Eingreifen im Gericht.
theological_decisions:
- issue: Bedeutung von Gottes Herrlichkeit unter den Völkern
  choice: Gottes Herrlichkeit wird durch sein geschichtliches Gerichtshandeln vor den Völkern sichtbar.
  alternative: „Herrlichkeit“ lediglich als abstrakte Ehre oder Ansehen verstehen.
  rationale: Das anschließende Sehen von Gottes Gericht und Hand verbindet die Herrlichkeit mit einem wahrnehmbaren göttlichen Handeln, ohne sie auf bloßen Ruf oder abstrakte Ehre zu reduzieren.
- issue: Bedeutung von „meine Hand“
  choice: Die Körpermetapher bleibt im Haupttext stehen und bezeichnet Gottes wirksame Macht im Gericht.
  alternative: Die Metapher im Haupttext direkt durch „meine Macht“ oder „mein Eingreifen“ ersetzen.
  rationale: Das hebräische Bild ist anschaulich und theologisch aussagekräftig. Eine Fußnote erläutert die idiomatische Bedeutung, ohne die Bildsprache einzuebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Parallelstruktur, wird jedoch durch „sichtbar machen“ idiomatisch geglättet. Die Gerichts- und Handmetaphorik bleibt bewusst erhalten.
