revisions:
- from: 'Und sag zu ihnen: »So spricht der Herr Jahwe: An dem Tag, als ich Israel erwählte, erhob ich den Nachkommen des Hauses Jakob gegenüber meine Hand[a] und gab mich ihnen im Land Ägypten zu erkennen. Ich erhob ihnen gegenüber meine Hand und sagte: ›Ich bin Jahwe, euer Gott.‹«'
  to: 'Und sag zu ihnen: »So spricht der Herr Jahwe: An dem Tag, als ich Israel erwählte, erhob ich meine Hand[a] für die Nachkommen des Hauses Jakob und gab ich mich ihnen im Land Ägypten zu erkennen. Ich erhob meine Hand für sie und sagte: ›Ich bin Jahwe, euer Gott.‹«'
