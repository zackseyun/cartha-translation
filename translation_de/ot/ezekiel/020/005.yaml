source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/יוֹם֙ בָּחֳרִ֣/י בְ/יִשְׂרָאֵ֔ל וָ/אֶשָּׂ֣א יָדִ֗/י לְ/זֶ֨רַע֙ בֵּ֣ית יַֽעֲקֹ֔ב וָ/אִוָּדַ֥ע לָ/הֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אֶשָּׂ֨א יָדִ֤/י לָ/הֶם֙ לֵ/אמֹ֔ר אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/005.yaml
  text: 'And say to them[a], ‘Thus says the Lord GOD: On the day when I chose Israel, I lifted up my hand to the offspring of the house of Jacob and made myself known to them in the land of Egypt; I lifted up my hand to them, saying, “I am Yahweh your God.”’'
translation:
  language: de
  text: 'Und sag zu ihnen: »So spricht der Herr Jahwe: An dem Tag, als ich Israel erwählte, erhob ich meine Hand[a] für die Nachkommen des Hauses Jakob und gab ich mich ihnen im Land Ägypten zu erkennen. Ich erhob meine Hand für sie und sagte: ›Ich bin Jahwe, euer Gott.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »erhob ich meine Hand«; die Wendung bezeichnet häufig das Schwören eines Eides oder eine feierliche Verpflichtung.
    reason: Die Fußnote erklärt die idiomatische Bedeutung, während der Haupttext das hebräische Bild bewahrt.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die zusammengesetzte Gottesbezeichnung gibt sowohl אֲדֹנָי („Herr“) als auch den Eigennamen יהוה („Jahwe“) wieder, ohne beide Elemente miteinander zu verschmelzen.
- source_word: בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל
  choice: An dem Tag, als ich Israel erwählte
  rationale: Die Zeitangabe בְּיוֹם bleibt ausdrücklich erhalten; „erwählte“ gibt den Sinn von בחר würdig und ohne zusätzliche systematisch-theologische Festlegung wieder.
- source_word: וָאֶשָּׂא יָדִי
  choice: erhob ich … gegenüber meine Hand
  rationale: Die konkrete hebräische Wendung wird bewahrt. Die deutsche Fassung macht mit „gegenüber“ zugleich die durch ל bezeichnete Ausrichtung auf die betreffende Personengruppe deutlich; der Eidcharakter wird in der Fußnote erläutert.
- source_word: לְזֶרַע בֵּית יַעֲקֹב
  choice: den Nachkommen des Hauses Jakob gegenüber
  rationale: „Nachkommen“ ist eine natürliche kollektive Wiedergabe von זֶרַע. „Haus Jakob“ erhält die ausdrückliche Abstammungs- und Gemeinschaftsbezeichnung des Hebräischen.
- source_word: וָאִוָּדַע לָהֶם
  choice: und gab mich ihnen … zu erkennen
  rationale: Die Form von ידע bezeichnet hier Gottes Selbstkundgabe. „Gab mich zu erkennen“ bewahrt diese Nuance, ohne sie stärker als nötig als Offenbarungsereignis auszudeuten.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die ausdrückliche Ortsbezeichnung אֶרֶץ wird gegenüber dem kürzeren „in Ägypten“ beibehalten.
- source_word: לֵאמֹר אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 'und sagte: ›Ich bin Jahwe, euer Gott.‹'
  rationale: Die Bundesformel wird unmittelbar und klar wiedergegeben; יהוה erscheint als Gottesname „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift wahrt den Charakter des Tetragramms als Gottes Eigenname. In der Verbindung אֲדֹנָי יְהוִה steht daher „der Herr Jahwe“, in der Selbstvorstellung „Ich bin Jahwe“.
- issue: Deutung von וָאֶשָּׂא יָדִי als Eidformel
  choice: Das Bild „die Hand erheben“ bleibt im Haupttext erhalten; der Eid- beziehungsweise Verpflichtungssinn wird in einer Fußnote erklärt.
  alternative: ich schwor / ich verpflichtete mich feierlich
  rationale: Die Wendung bezeichnet in diesem Zusammenhang sehr wahrscheinlich einen Eid oder eine feierliche Zusage. Das konkrete Bild des Ausgangstextes soll jedoch nicht stillschweigend durch seine Deutung ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Gedankengang, wird aber durch deutsche Zeichensetzung und abgestufte Anführungszeichen gut lesbar gemacht.
