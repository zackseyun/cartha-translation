review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Gehalt des Hebräischen zuverlässig wieder: Gottes Auswahl Israels, die Zuwendung an die Nachkommen des Hauses Jakob, seine Selbstkundgabe in Ägypten und die Selbstvorstellung als Jahwe, ihr Gott. „Jahwe“ entspricht dem Gottesnamen יהוה und „der Herr Jahwe“ gibt אֲדֹנָי יהוה vollständig wieder. Die Hand-erheben-Wendung wird zu Recht nicht im Haupttext zu „schwören“ aufgelöst.'
  naturalness: „Jemandem gegenüber die Hand erheben“ ist im heutigen Deutschen unglücklich, da es leicht das drohende oder gewaltsame Erheben einer Hand gegen jemanden bedeuten kann. „Die Hand für jemanden erheben“ ist hier klarer als feierliche, auf die Begünstigten bezogene Geste; die Fußnote sichert den Eidcharakter.
  terminology: „erwählte“, „Nachkommen des Hauses Jakob“, „gab ich mich … zu erkennen“, „Land Ägypten“ und „Jahwe, euer Gott“ sind sachgerecht, verständlich und im würdigen modernen Standarddeutsch formuliert. Die Fußnote erklärt die idiomatische Bedeutung ohne eine konfessionell geprägte Deutung aufzuzwingen.
  issues:
  - severity: medium
    issue: Die Formulierung „den Nachkommen des Hauses Jakob gegenüber meine Hand“ beziehungsweise „ihnen gegenüber meine Hand“ ist missverständlich.
    rationale: Im modernen Deutsch kann „jemandem gegenüber die Hand erheben“ eine gegen die Person gerichtete, potenziell gewaltsame Geste nahelegen. Das hebräische לְ markiert hier die Ausrichtung der eidlichen Handerhebung auf die Empfänger der Zusage.
