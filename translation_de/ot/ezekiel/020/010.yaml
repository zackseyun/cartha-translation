  text: So I brought them out from the land of Egypt and brought them into the wilderness.
translation:
  language: de
  text: Und ich führte sie aus dem Land Ägypten heraus und brachte sie in die Wüste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹוצִיאֵם
  choice: So führte ich sie … heraus
  rationale: Die Hifil-Form von יצא bezeichnet das Veranlassen des Hinausgehens. „führte … heraus“ gibt die göttliche Führung natürlich wieder; „So“ markiert den folgernden Fortgang aus dem vorherigen Zusammenhang.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Übersetzung bewahrt das ausdrücklich genannte אֶרֶץ („Land“) und die vertraute Exodus-Wendung.
- source_word: וָאֲבִאֵם
  choice: und brachte sie
  rationale: Das Hifil von בוא bedeutet hier „bringen“. Die Wiedergabe wahrt die Bewegung vom Herausführen zum Hineinbringen.
- source_word: אֶל הַמִּדְבָּר
  choice: in die Wüste
  rationale: מִדְבָּר bezeichnet in diesem Exodus-Kontext die Wüste beziehungsweise Wildnis. „in die Wüste“ ist im modernen Standarddeutsch natürlich und gibt die gerichtete Bewegung wieder.
