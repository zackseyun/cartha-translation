  verdict: revise
  source_fidelity: Die Schwurformel, der prophetische Ausspruch, die emphatische Schwurbekräftigung, die dreifache Exodus-Bildsprache und die Aussage göttlicher Königsherrschaft sind zutreffend wiedergegeben. Die Fassung „als König über euch herrschen“ macht die königliche Nuance zwar sichtbar, erweitert und verdoppelt jedoch die Aussage des Verbs unnötig.
  naturalness: „Als König über euch herrschen“ ist im heutigen Standarddeutsch weniger idiomatisch als „über euch herrschen“. Die königliche Bedeutung kann im Fußnotenhinweis dokumentiert werden. „Ausgegossenem Zorn“ ist zudem die im Deutschen für dieses biblische Bild üblichere und natürlichere Verbindung.
  terminology: „der Herr Yahweh“ gibt die Titel-Namens-Verbindung אֲדֹנָי יְהוִה nachvollziehbar wieder und bleibt mit der vorgegebenen Namenspraxis vereinbar. „Herrschen“ bewahrt die Herrschafts- bzw. Königsaussage von מלך; die Fußnote hält die ausdrücklich königliche Alternative fest.
  issues:
