  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם לֹ֠א בְּ/יָ֨ד חֲזָקָ֜ה וּ/בִ/זְר֧וֹעַ נְטוּיָ֛ה וּ/בְ/חֵמָ֥ה שְׁפוּכָ֖ה אֶמְל֥וֹךְ עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/033.yaml
  text: As I live[a], declares the Lord GOD, surely with a strong hand and an outstretched arm and with wrath poured out, I will reign over you.
translation:
  language: de
  text: »So wahr ich lebe«, spricht der Herr Yahweh, »mit starker Hand, mit ausgestrecktem Arm und mit ausgegossenem Zorn werde ich ganz gewiss über euch herrschen.[a]«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »über euch regieren« oder »als König über euch herrschen«. Das hebräische Verb bezeichnet ausdrücklich königliches Herrschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Die prophetische Schwurformel wird im Deutschen idiomatisch und zugleich formnah wiedergegeben.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם leitet feierlich einen göttlichen Ausspruch ein. אֲדֹנָי wird als Titel „der Herr“ und יהוה als der Gottesname „Yahweh“ wiedergegeben.
- source_word: אִם לֹא
  choice: ganz gewiss
  rationale: In Verbindung mit einem Schwur ist die Wendung keine gewöhnliche Bedingung, sondern eine nachdrückliche Bekräftigung.
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Die instrumentale Bedeutung und das an den Exodus erinnernde Bild bleiben erhalten.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: mit ausgestrecktem Arm
  rationale: Die feste biblische Bildsprache göttlicher Machtausübung wird unmittelbar bewahrt.
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: mit ausgeschüttetem Zorn
  rationale: Die Übersetzung bewahrt sowohl die Intensität von חֵמָה als auch das Bild des ausgegossenen beziehungsweise ausgeschütteten Zorns.
- source_word: אֶמְלֹךְ עֲלֵיכֶם
  choice: als König über euch herrschen
  rationale: Das Verb מלך bezeichnet königliches Herrschen. Die Formulierung macht diese im Deutschen sonst leicht abgeschwächte königliche Bedeutung deutlich.
theological_decisions:
- issue: Wiedergabe der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Fassung unterscheidet den Herrschaftstitel von dem im Text ausdrücklich stehenden Gottesnamen, ohne beide zu einem bloßen Titel zu verschmelzen.
- issue: Königliche Tragweite von אֶמְלֹךְ
  choice: als König über euch herrschen
  alternative: über euch regieren / über euch herrschen
  rationale: Die königliche Aussage des Verbs bleibt ausdrücklich hörbar. Zugleich wird die Spannung bewahrt, dass Yahweh seine Herrschaft über ein widerstrebendes Volk durch Macht und Zorngericht durchsetzt.
translation_notes:
  register: Feierliche, moderne Standardsprache. Die dreifache Instrumentalangabe wird parallel gebaut; die Exodus-Bildsprache und der harte Zusammenhang von Königtum, Macht und Zorn bleiben erhalten.
