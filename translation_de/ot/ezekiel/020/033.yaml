    rationale: Das Partizip שְׁפוּכָה bedeutet zwar „ausgegossen/ausgeschüttet“, doch „ausgegossenem Zorn“ ist im feierlichen biblischen Deutsch die geläufigere Formulierung und erhält das Bild präzise.
