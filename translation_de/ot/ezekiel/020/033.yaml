  rationale: Die Revision beseitigt eine stilistisch doppelte Ausformulierung der Königsherrschaft und verwendet die im Deutschen etablierte Bildverbindung „ausgegossener Zorn“. Aussagegehalt, feierliches Register, emphatische Schwurformel und die Mehrdeutigkeit zwischen herrschen, regieren und König sein bleiben erhalten.
