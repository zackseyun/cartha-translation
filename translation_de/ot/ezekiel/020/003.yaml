source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֞ר אֶת זִקְנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/לִ/דְרֹ֥שׁ אֹתִ֖/י אַתֶּ֣ם בָּאִ֑ים חַי אָ֨נִי֙ אִם אִדָּרֵ֣שׁ לָ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/003.yaml
  text: 'Son of man[a], speak to the elders of Israel and say to them, Thus says the Lord GOD: Is it to inquire of me that you have come? As I live, I will not be inquired of by you[b], declares the Lord GOD.'
translation:
  language: de
  text: 'Menschensohn, sprich zu den Ältesten Israels und sage zu ihnen: So spricht der Herr Jahwe: Seid ihr gekommen, um mich zu befragen?[a] So wahr ich lebe: Ich lasse mich von euch nicht befragen[b], spricht der Herr Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid ihr gekommen, um mich um Auskunft zu bitten?“ Das Verb kann das Einholen eines göttlichen Bescheids bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „So wahr ich lebe, wenn ich mich von euch befragen lasse.“ In dieser Schwurformel drückt „wenn“ eine nachdrückliche Verneinung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel wiederkehrende Anrede wird als vertraute hebräische Wendung bewahrt; sie bezeichnet den Propheten als Menschen, ohne die Formulierung unnötig auszudeuten.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Bezeichnet die anerkannte Führungsgruppe Israels und gibt die Genitivverbindung direkt wieder.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr, Jahwe
  rationale: Bewahrt die prophetische Botenformel und unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה. Das Komma macht deutlich, dass „Herr“ und „Jahwe“ zusammengehören.
- source_word: הֲלִדְרֹשׁ אֹתִי ... בָּאִים
  choice: Seid ihr gekommen, um mich zu befragen?
  rationale: דרשׁ bezeichnet hier die Befragung Gottes beziehungsweise das Einholen göttlicher Auskunft. Die Zweckkonstruktion gibt die hebräische Frage natürlich wieder.
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Natürliche und feierliche deutsche Wiedergabe der göttlichen Schwurformel.
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: Ich lasse mich von euch nicht befragen
  rationale: אִם hat nach der Schwurformel die Kraft einer nachdrücklichen Verneinung. Die reflexiv-passive Formulierung gibt das Niphal verständlich wieder und erhält die Verbindung zum vorherigen „befragen“.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: erklärt der Herr, Jahwe
  rationale: „Erklärt“ vermittelt die autoritative prophetische Schlussformel in gegenwärtigem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: GOTT, der Herr; der Herr HERR
  rationale: „Jahwe“ gibt den im Ausgangstext stehenden Eigennamen wieder, während „Herr“ den Titel אֲדֹנָי bezeichnet. So werden beide Bestandteile sichtbar, ohne sie zu einem doppelten „Herr“ einzuebnen.
- issue: Bedeutung der Schwurformel mit אִם
  choice: 'So wahr ich lebe: Ich lasse mich von euch nicht befragen'
  alternative: So wahr ich lebe, wenn ich mich von euch befragen lasse …
  rationale: Die formal bedingte hebräische Schwurformel drückt idiomatisch eine starke Verneinung aus. Die direkte Negation vermittelt diese Aussage auf Deutsch, ohne einen unvollständigen Bedingungssatz zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Boten- und Schwurformel bleibt feierlich; „befragen“ ist allgemein verständlich und bewahrt zugleich den Bezug auf das Einholen göttlicher Auskunft.
