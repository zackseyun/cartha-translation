source:
  edition: WLC
  text: וְ/גַ֤ם אֶת שַׁבְּתוֹתַ/י֙ נָתַ֣תִּי לָ/הֶ֔ם לִ/הְי֣וֹת לְ/א֔וֹת בֵּינִ֖/י וּ/בֵֽינֵי/הֶ֑ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/012.yaml
  text: I also gave them my Sabbaths to be a sign between me and them[a], so that they might know that I am Yahweh who sanctifies them.
translation:
  language: de
  text: Auch meine Sabbate gab ich ihnen als Zeichen zwischen mir und ihnen, damit sie erkennen, dass ich Jahwe bin, der sie heiligt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sie heilig macht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Die Verbindung aus Konjunktion und Adverb fügt einen weiteren Punkt in der Reihe hinzu; „Auch“ gibt diese additive Funktion im Deutschen natürlich wieder.
- source_word: שַׁבְּתוֹתַי
  choice: meine Sabbate
  rationale: Die Pluralform mit Suffix der 1. Person Singular wird direkt wiedergegeben und kann sowohl die einzelnen Sabbattage als auch die wiederkehrende Sabbatordnung bezeichnen.
- source_word: נָתַתִּי לָהֶם
  choice: gab ich ihnen
  rationale: Dies ist eine direkte und idiomatische Wiedergabe von נתן mit indirektem Objekt.
- source_word: לִהְיוֹת לְאוֹת
  choice: als Zeichen
  rationale: Die Infinitivkonstruktion bezeichnet Zweck beziehungsweise Funktion. „Als Zeichen“ ist im Deutschen natürlicher als eine streng formale Wiedergabe mit „um ein Zeichen zu sein“.
- source_word: בֵּינִי וּבֵינֵיהֶם
  choice: zwischen mir und ihnen
  rationale: Die relationale Formulierung wird unmittelbar bewahrt und kennzeichnet den Sabbat als Zeichen der Beziehung zwischen Jahwe und Israel.
- source_word: לָדַעַת
  choice: damit sie erkennen
  rationale: Der Infinitiv mit ל drückt hier den Zweck aus. „Erkennen“ kann neben dem Wissen auch das verstehende Anerkennen bezeichnen, ohne diese Nuance zu erzwingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְקַדְּשָׁם
  choice: der sie heiligt
  rationale: Das Partizip der Pi'el-Form von קדשׁ mit Suffix bezeichnet Jahwe als den, der sie heilig macht beziehungsweise heiligt. „Heiligt“ bewahrt die theologische und kultische Prägung des Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von קדשׁ im Bundeszusammenhang
  choice: der sie heiligt
  alternative: der sie heilig macht
  rationale: „Heiligt“ lässt offen, welche Aspekte des göttlichen Absonderns und Heiligmachens im Vordergrund stehen, und wahrt den theologischen Zusammenhang. Die verständlichere Entfaltung wird in der Fußnote genannt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit natürlicher deutscher Satzstellung. „Sabbate“ erhält den hebräischen Plural; „Jahwe“ gibt den Gottesnamen direkt wieder. Die Fußnote erläutert „heiligt“, ohne die im hebräischen Ausdruck angelegte Weite im Haupttext einzuengen.
