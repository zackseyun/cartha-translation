base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/017.yaml
  text: But my eye spared them from destroying them[a], and I did not make a complete end of them in the wilderness.
translation:
  language: de
  text: Doch mein Auge hatte Mitleid mit ihnen und bewahrte sie davor, sie zu vernichten; ich machte in der Wüste nicht vollständig ein Ende mit ihnen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mein Auge hatte Mitleid mit ihnen, sie nicht zu vernichten.“ „Mein Auge“ ist ein hebräisches Bild für erbarmendes Verschonen; „nicht vollständig ein Ende mit ihnen machen“ bedeutet, sie nicht völlig zu vernichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחָס
  choice: hatte Erbarmen
  rationale: חוס bezeichnet mitleidiges Verschonen oder Erbarmen. In Verbindung mit „mein Auge“ gibt „hatte Erbarmen“ die mitfühlende Zurückhaltung natürlich und würdevoll wieder.
- source_word: עֵינִי
  choice: mein Auge
  rationale: Der Singular wird beibehalten, um das anschauliche anthropomorphe Bild des Hebräischen nicht zu einem bloßen „ich“ zu verflachen.
- source_word: עֲלֵיהֶם
  choice: mit ihnen
  rationale: Die Präposition עַל kennzeichnet bei חוס diejenigen, denen das Erbarmen gilt; im Deutschen ist „Erbarmen mit ihnen“ die idiomatische Entsprechung.
- source_word: מִשַּׁחֲתָם
  choice: bewahrte sie vor der Vernichtung
  rationale: Die Verbindung aus מִן und dem Infinitiv von שׁחת mit Suffix drückt das Zurückhalten von ihrer Vernichtung aus. Die Formulierung wahrt diesen Sinn in natürlichem Deutsch.
- source_word: וְלֹא עָשִׂיתִי אוֹתָם כָּלָה
  choice: ich machte ihnen kein völliges Ende
  rationale: Die Wendung עשה כלה bezeichnet die vollständige Vernichtung. „Kein völliges Ende machen“ erhält den hebräischen Ausdruck und bleibt im gehobenen modernen Deutsch verständlich.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist im Deutschen die natürliche und traditionsübergreifend verständliche Bezeichnung für den Schauplatz der Wüstenwanderung.
theological_decisions:
- issue: Anthropomorphe Darstellung des göttlichen Erbarmens
  choice: Das Bild „mein Auge hatte Erbarmen“ wird beibehalten.
  alternative: „Ich verschonte sie“ oder „Ich blickte mitleidig auf sie“
  rationale: Der hebräische Text stellt Gottes erbarmende Zurückhaltung bewusst durch das Bild seines Auges dar. Die Übersetzung bewahrt diese Bildkraft, ohne daraus weitergehende Aussagen über Gottes Wesen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das markante Bild „mein Auge“ und die Wendung „kein völliges Ende“ bewahren die Bildhaftigkeit und den Nachdruck des Hebräischen; der erste Teilsatz wird für natürliche deutsche Verständlichkeit leicht entfaltet.
