source:
  edition: WLC
  text: וּ/בִ/שְׂאֵ֣ת מַתְּנֹֽתֵי/כֶ֡ם בְּֽ/הַעֲבִיר֩ בְּנֵי/כֶ֨ם בָּ/אֵ֜שׁ אַתֶּם֩ נִטְמְאִ֤֨ים לְ/כָל גִּלּֽוּלֵי/כֶם֙ עַד הַ/יּ֔וֹם וַ/אֲנִ֛י אִדָּרֵ֥שׁ לָ/כֶ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם אִדָּרֵ֖שׁ לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/031.yaml
  text: And when you present your gifts[a], when you make your sons pass through the fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, declares the Lord GOD[c][b], I will not be inquired of by you.
translation:
  language: de
  text: 'Wenn ihr eure Gaben[a] darbringt und eure Söhne durchs Feuer gehen lasst[b], macht ihr euch bis zum heutigen Tag mit all euren Götzen unrein. Sollte ich mich da von euch befragen lassen, Haus Israel? So wahr ich lebe – Ausspruch des Herrn Jahwe –: Ich werde mich von euch ganz gewiss nicht befragen lassen![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Opfergaben“.'
    reason: lexical_alternative
  - marker: b
    text: „Die Söhne durchs Feuer gehen lassen“ bezeichnet hier ein mit Götzendienst verbundenes Kinderopfer; die Formulierung legt die genaue Durchführung des Rituals nicht näher fest.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich steht im Hebräischen nach der Schwurformel ein Satz mit „wenn“. In diesem Zusammenhang ist das eine nachdrückliche Verneinung: „Ganz gewiss werde ich mich nicht von euch befragen lassen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׂאֵת מַתְּנֹתֵיכֶם
  choice: Wenn ihr eure Gaben darbringt
  rationale: נשׂא bezeichnet zusammen mit מַתָּנוֹת hier nicht nur ein körperliches Hochheben, sondern das kultische Darbringen. „Gaben“ gibt das Substantiv direkt wieder, während „darbringen“ den Zusammenhang natürlich ausdrückt.
- source_word: בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ
  choice: eure Söhne durchs Feuer gehen lasst
  rationale: Die Formulierung bewahrt das hebräische Bild und die ausdrücklich männliche Bezeichnung „Söhne“, ohne die genaue Durchführung des mit Götzendienst verbundenen Opferrituals über den Wortlaut hinaus festzulegen.
- source_word: אַתֶּם נִטְמְאִים
  choice: macht ihr euch … unrein
  rationale: Das Niphal bezeichnet das Unreinwerden; die reflexive deutsche Form macht in diesem Zusammenhang sowohl die Folge als auch die eigene Beteiligung der Angesprochenen deutlich.
- source_word: לְכָל גִּלּוּלֵיכֶם
  choice: mit all euren Götzen
  rationale: „Götzen“ gibt den stark abwertenden Gebrauch von גִּלּוּלִים bei Ezechiel angemessen und verständlich wieder.
- source_word: וַאֲנִי אִדָּרֵשׁ לָכֶם
  choice: Sollte ich mich da von euch befragen lassen?
  rationale: דרשׁ im Niphal bezeichnet hier das Befragen oder Aufsuchen Gottes um Weisung. Die rhetorische Frage leitet zur nachfolgenden entschiedenen Verweigerung über.
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Dies ist die natürliche deutsche Entsprechung der feierlichen göttlichen Schwurformel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: „Ausspruch“ bewahrt die prophetische Formel נְאֻם; „Herr Jahwe“ gibt sowohl אֲדֹנָי als Titel als auch den Gottesnamen יהוה wieder.
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: Ich werde mich von euch ganz gewiss nicht befragen lassen!
  rationale: אִם steht nach der Schwurformel elliptisch und drückt eine nachdrückliche Verneinung aus. Eine wörtliche Wiedergabe mit „wenn“ wäre im Deutschen missverständlich.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und lässt den im Ausgangstext ausdrücklich verwendeten Gottesnamen sichtbar.
- issue: Geschlechtsgenaue Wiedergabe von בְּנֵיכֶם
  choice: eure Söhne
  alternative: eure Kinder
  rationale: Der hebräische Text verwendet ausdrücklich das maskuline Pluralwort „Söhne“. Die Übersetzung erhält diese Form, ohne weitergehende Annahmen über mögliche Opfer vorzunehmen.
- issue: Aussagekraft der abschließenden Schwurformel
  choice: Ich werde mich von euch ganz gewiss nicht befragen lassen!
  alternative: Wenn ich mich von euch befragen lasse …
  rationale: Die hebräische Konstruktion lässt den negativen Schwur elliptisch. Die deutsche Fassung gibt dessen sichere Verneinung wieder, statt durch eine isolierte Bedingungsformel Unklarheit zu erzeugen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzfolge und die rhetorische Spannung des Hebräischen bleiben erhalten; ungebräuchliche Wörtlichkeit wird nur dort vermieden, wo sie die Aussage im Deutschen verdunkeln würde.
