source:
  edition: WLC
  text: וָ/אֲבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לָ/הֶ֑ם וַ/יִּרְאוּ֩ כָל גִּבְעָ֨ה רָמָ֜ה וְ/כָל עֵ֣ץ עָבֹ֗ת וַ/יִּזְבְּחוּ שָׁ֤ם אֶת זִבְחֵי/הֶם֙ וַ/יִּתְּנוּ שָׁם֙ כַּ֣עַס קָרְבָּנָ֔/ם וַ/יָּשִׂ֣ימוּ שָׁ֗ם רֵ֚יחַ נִיח֣וֹחֵי/הֶ֔ם וַ/יַּסִּ֥יכוּ שָׁ֖ם אֶת נִסְכֵּי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/028.yaml
  text: So I brought them into the land that I had lifted up my hand to give to them[a], and they saw every high hill and every leafy tree, and there they sacrificed their sacrifices, and there they presented the provocation of their offering, and there they set their pleasing aromas[c][b], and there they poured out their drink offerings.
translation:
  language: de
  text: Da brachte ich sie in das Land, das ich ihnen mit erhobener Hand zu geben geschworen hatte.[a] Sie sahen jeden hohen Hügel und jeden dicht belaubten Baum,[b] und dort schlachteten sie ihre Schlachtopfer. Dort brachten sie ihre anstößige Opfergabe dar,[c] ließen dort ihren besänftigenden Opferduft aufsteigen und gossen dort ihre Trankopfer aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Land, für das ich meine Hand erhoben hatte, um es ihnen zu geben“. Das Erheben der Hand ist eine Geste des Schwörens.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: „jeden hohen Hügel und jeden grünen Baum“. Das hebräische Wort beschreibt einen dicht belaubten oder üppigen Baum.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „die Provokation ihrer Opfergabe“. Die Wendung bezeichnet ihre Opfergabe als anstößig und Zorn hervorrufend, ohne im hebräischen Satz ausdrücklich zu sagen, wen sie provoziert.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲבִיאֵם
  choice: So brachte ich sie
  rationale: Der Hifil von בוא bedeutet „hineinbringen/br ingen“. „So“ gibt die fortlaufende, folgernde Erzählbewegung des Waw wieder, ohne im Deutschen hölzern zu wirken.
- source_word: נָשָׂאתִי אֶת־יָדִי לָתֵת אֹתָהּ לָהֶם
  choice: das ich ihnen zu geben mit erhobener Hand geschworen hatte
  rationale: Die Wendung „die Hand erheben“ bezeichnet einen Schwur. Die Übersetzung nennt den Schwursinn und bewahrt zugleich das konkrete hebräische Bild.
- source_word: כָל גִּבְעָה רָמָה
  choice: jeden hohen Hügel
  rationale: Die Formulierung ist hier beschreibend und verwendet nicht das technische Substantiv für eine Kulthöhe. „Hoher Hügel“ erhält das konkrete Bild und seinen kultischen Beiklang.
- source_word: וְכָל עֵץ עָבֹת
  choice: jeden dicht belaubten Baum
  rationale: עָבֹת bezeichnet etwas Dichtes oder Üppiges. „Dicht belaubt“ ist präzise, anschaulich und im modernen Deutschen natürlich.
- source_word: וַיִּזְבְּחוּ שָׁם אֶת־זִבְחֵיהֶם
  choice: schlachteten sie dort ihre Schlachtopfer
  rationale: Die Wiedergabe erhält die hebräische Wortstammwiederholung von Verb und Substantiv und benennt den Opferakt genauer als das allgemeinere „opfern“.
- source_word: וַיִּתְּנוּ שָׁם כַּעַס קָרְבָּנָם
  choice: Dort brachten sie ihre provozierende Opfergabe dar
  rationale: כַּעַס bezeichnet Provokation beziehungsweise den hervorgerufenen Zorn. Die attributive Fassung macht die stark verdichtete hebräische Wendung verständlich, ohne ein im Satz nicht ausdrücklich genanntes Objekt wie „mich“ einzufügen.
- source_word: וַיָּשִׂימוּ שָׁם רֵיחַ נִיחוֹחֵיהֶם
  choice: ließen dort den Duft ihrer wohlgefälligen Opfer aufsteigen
  rationale: רֵיחַ נִיחוֹחַ ist eine feste Opferformel für einen wohlgefälligen beziehungsweise beruhigenden Duft. Wegen des Suffixes bezieht sich die Wendung auf ihre Opfer; die deutsche Formulierung vermeidet das unnatürliche „setzten ihre Düfte“.
- source_word: וַיַּסִּיכוּ שָׁם אֶת־נִסְכֵּיהֶם
  choice: gossen dort ihre Trankopfer aus
  rationale: נסך bezeichnet im Opferkontext das Ausgießen von Libationen. „Trankopfer ausgießen“ ist die klare und etablierte deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe der Schwurformel נָשָׂא יָד
  choice: mit erhobener Hand geschworen hatte
  alternative: meine Hand erhoben hatte, um es ihnen zu geben
  rationale: Der idiomatische Sinn ist ein feierlicher Schwur. Die gewählte Fassung macht diesen Sinn ausdrücklich, erhält aber durch „mit erhobener Hand“ die Bildsprache und vermeidet so sowohl Undeutlichkeit als auch eine vollständige Einebnung des Idioms.
- issue: Kultische Beschreibung der unerlaubten Verehrungsstätten
  choice: jeden hohen Hügel und jeden dicht belaubten Baum
  alternative: jede Kulthöhe und jeden grünen Baum
  rationale: Der hebräische Text gebraucht konkrete Beschreibungen, nicht das technische Wort für „Kulthöhe“. Daher bleibt die landschaftliche Bildsprache erhalten, ohne die im Zusammenhang erkennbare Götzenverehrung konfessionell oder interpretierend auszubauen.
- issue: Spannung zwischen der Opferformel „wohlgefälliger Duft“ und dem Götzendienst
  choice: Duft ihrer wohlgefälligen Opfer
  alternative: beruhigender Duft ihrer Opfer
  rationale: 'Die traditionelle Opferformel wird als von den Opfernden beanspruchte kultische Kategorie erkennbar belassen. Der unmittelbar vorausgehende Ausdruck „provozierende Opfergabe“ erhält die theologische Spannung: Diese Opfer ahmen legitimen Kult nach, sind Gott aber anstößig.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die wiederholte Ortsangabe „dort“ bildet den anklagenden Rhythmus des Hebräischen nach. Fachlich-kultische Begriffe wie „Schlachtopfer“ und „Trankopfer“ bleiben erhalten, sind aber im Satz klar eingebettet. Die ungewöhnliche Wendung „provozierende Opfergabe“ bewahrt die Schärfe und Verdichtung des Ausgangstextes; eine Fußnote erläutert sie.
