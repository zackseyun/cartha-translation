revisions:
- from: So brachte ich sie in das Land, das ich ihnen zu geben mit erhobener Hand geschworen hatte.[a] Als sie jeden hohen Hügel und jeden dicht belaubten Baum sahen,[b] schlachteten sie dort ihre Schlachtopfer. Dort brachten sie ihre provozierende Opfergabe dar,[c] ließen dort den Duft ihrer wohlgefälligen Opfer aufsteigen und gossen dort ihre Trankopfer aus.
  to: Da brachte ich sie in das Land, das ich ihnen mit erhobener Hand zu geben geschworen hatte.[a] Sie sahen jeden hohen Hügel und jeden dicht belaubten Baum,[b] und dort schlachteten sie ihre Schlachtopfer. Dort brachten sie ihre anstößige Opfergabe dar,[c] ließen dort ihren besänftigenden Opferduft aufsteigen und gossen dort ihre Trankopfer aus.
  rationale: 'Die Revision verbessert die deutsche Erzählführung und klärt zwei komprimierte kultische Wendungen, ohne die Aussage auszubauen: Der Eid wird weiterhin ausdrücklich als Eid mit erhobener Hand wiedergegeben; die Opfergabe bleibt als anstößig charakterisiert, ohne ein Objekt einzufügen; und die feste Opferduftformel wird näher an ihrer hebräischen Bezugsstruktur formuliert. Alle Fußnotenanker sind im Text vorhanden und die Fußnoten erläutern die jeweiligen textlichen Entscheidungen.'
  reviewer_model: gpt-5.6-terra
