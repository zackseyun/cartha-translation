revisions:
- from: Doch ich handelte um meines Namens willen[a], damit er vor den Augen der Völker, in deren Mitte sie lebten, nicht entweiht würde[b]. Vor ihren Augen hatte ich mich ihnen zu erkennen gegeben[c], indem ich sie aus dem Land Ägypten herausführte.
  to: Doch ich handelte um meines Namens willen[a], damit er vor den Augen der Völker, in deren Mitte sie lebten, nicht entweiht würde[b]—der Völker, denen ich mich vor ihren Augen zu erkennen gegeben hatte, indem ich die Israeliten aus dem Land Ägypten herausführte[c].
  rationale: Die Revision bewahrt die Wiederholung von „vor den Augen“ und die Bezugnahme auf die Völker als Empfänger und Zeugen der Selbstkundgabe Gottes. „Die Israeliten“ macht beim Herausführen ausdrücklich kenntlich, wer aus Ägypten geführt wurde; dies ergibt sich eindeutig aus dem unmittelbaren Kontext und verhindert eine deutsche Fehllektüre, nach der die Völker herausgeführt worden wären. Der Gedankenstrich stellt die nachgestellte Erläuterung lesbar an den vorangehenden Satz an, ohne die quellenbedingte Verknüpfung aufzugeben.
