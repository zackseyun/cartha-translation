  terminology: „um meines Namens willen“ und „entweiht“ sind für den sakralen und öffentlichen Sinn des Verses treffend. „Völker“ ist für גּוֹיִם passend. „mich ... zu erkennen gegeben“ ist eine natürliche und quellennahe Wiedergabe von נוֹדַעְתִּי.
