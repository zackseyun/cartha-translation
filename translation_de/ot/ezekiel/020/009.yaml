  text: וָ/אַ֨עַשׂ֙ לְמַ֣עַן שְׁמִ֔/י לְ/בִלְתִּ֥י הֵחֵ֛ל לְ/עֵינֵ֥י הַ/גּוֹיִ֖ם אֲשֶׁר הֵ֣מָּה בְ/תוֹכָ֑/ם אֲשֶׁ֨ר נוֹדַ֤עְתִּי אֲלֵי/הֶם֙ לְ/עֵ֣ינֵי/הֶ֔ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/009.yaml
  text: But I acted for the sake of my name[a], so that it should not be profaned in the sight of the nations among whom they were[c][b], to whom I had made myself known in their sight by bringing them out of the land of Egypt.
translation:
  language: de
  text: Doch ich handelte um meines Namens willen[a], damit er vor den Augen der Völker, in deren Mitte sie lebten, nicht entweiht würde[b]—der Völker, denen ich mich vor ihren Augen zu erkennen gegeben hatte, indem ich die Israeliten aus dem Land Ägypten herausführte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für meinen Namen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nicht entehrt würde“; das hebräische Wort bezeichnet hier die Entweihung dessen, was heilig ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „war ich ihnen bekannt geworden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: Doch ich handelte
  rationale: עשה ist weit gefasst; im Gegensatz zum vorausgehenden Ungehorsam bezeichnet es hier Gottes entschlossenes Eingreifen. „Doch“ gibt den adversativen Zusammenhang wieder.
- source_word: לְמַעַן שְׁמִי
  choice: um meines Namens willen
  rationale: Die geläufige deutsche Wendung bewahrt den Gedanken, dass Gottes Handeln der Heiligkeit und öffentlichen Ehre seines offenbarten Namens gilt.
- source_word: לְבִלְתִּי הֵחֵל
  choice: damit er … nicht entweiht würde
  rationale: 'חלל trägt hier einen sakralen Sinn: Gottes Name soll nicht als unheilig behandelt oder öffentlich entehrt werden. Das Pronomen nimmt „mein Name“ auf.'
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: vor den Augen der Völker
  rationale: Die Formulierung erhält die Bildlichkeit und betont, dass das Geschehen öffentlich wahrnehmbar ist.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: in deren Mitte sie lebten
  rationale: Wörtlich steht „in deren Mitte sie waren“. „Lebten“ gibt den gemeinten Aufenthalt in natürlichem Deutsch wieder.
- source_word: אֲשֶׁר נוֹדַעְתִּי אֲלֵיהֶם
  choice: hatte ich mich ihnen zu erkennen gegeben
  rationale: Der Nifal von ידע lässt ein Bekanntwerden beziehungsweise eine Selbstoffenbarung Gottes zu. Die gewählte Formulierung bewahrt Gottes aktives Sich-Kundgeben, ohne die mögliche Nuance bloßen Bekanntwerdens zu verdecken.
- source_word: לְעֵינֵיהֶם
  choice: Vor ihren Augen
  rationale: Die Wiederholung des Augenmotivs im Hebräischen wird ausdrücklich bewahrt und zugleich in einen natürlichen deutschen Satzbau überführt.
- source_word: לְהוֹצִיאָם
  choice: indem ich sie … herausführte
  rationale: Der Infinitiv kann Mittel beziehungsweise Umstand des Sich-zu-erkennen-Gebens ausdrücken; „indem“ bildet diese Beziehung klar ab.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die traditionelle und sachlich genaue Bezeichnung wahrt das Exodusmotiv.
theological_decisions:
- issue: Gottes Handeln um seines Namens willen
  choice: Die Wendung bleibt als Namensmotiv stehen und bezeichnet die Wahrung der Heiligkeit und öffentlichen Ehre seines offenbarten Namens.
  alternative: Eine erklärende Paraphrase wie „um seinen Ruf zu schützen“.
  rationale: Eine Paraphrase mit „Ruf“ könnte das Motiv auf bloße Reputation verengen; „Name“ bewahrt seine umfassende theologische Spannung.
- issue: Bedeutung von חלל in Bezug auf Gottes Namen
  choice: „entweiht“
  alternative: „entehrt“ oder „befleckt“
  rationale: „Entweiht“ erhält den für Ezechiel wichtigen Gegensatz von heilig und profan; „entehrt“ wäre verständlicher, aber weniger präzise sakral.
- issue: Art der göttlichen Selbstkundgabe
  choice: „mich ihnen zu erkennen gegeben“
  alternative: „ihnen bekannt geworden“ oder „mich ihnen offenbart“
  rationale: Die Übersetzung lässt sowohl den Nifal-Sinn des Bekanntwerdens als auch die kontextuelle Selbstkundgabe anklingen und vermeidet eine stärker systematisch geprägte Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wendung mit den „Augen“ wird bewusst erhalten. Zur Vermeidung eines schwer verständlichen Schachtelsatzes beginnt die zweite Relativinformation als eigener Satz; die inhaltliche Verknüpfung bleibt bestehen.
