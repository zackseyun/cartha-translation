id: EZK.20.16
reference: Ezekiel 20:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יַ֜עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֗סוּ וְ/אֶת חֻקּוֹתַ/י֙ לֹא הָלְכ֣וּ בָ/הֶ֔ם וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ כִּ֛י אַחֲרֵ֥י גִלּוּלֵי/הֶ֖ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/016.yaml
  text: because they rejected my judgments[a], and did not walk in my statutes, and profaned my Sabbaths; for their heart went after their idols.
translation:
  language: de
  text: weil sie meine Rechtsbestimmungen verwarfen, nicht nach meinen Satzungen lebten und meine Sabbate entweihten; denn ihr Herz ging ihren Götzen[a] nach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort גִלּוּלִים ist eine verächtliche Bezeichnung für Götzen und kann möglicherweise an Unrat oder Kot anklingen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: weil
  rationale: Leitet den Grund für das im Zusammenhang angekündigte Gericht ein und ist im modernen Deutsch die natürlichste kausale Verbindung.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: Bewahrt den rechtlichen Sinn von מִשְׁפָּט und bleibt zugleich von חֻקּוֹתַי unterschieden.
- source_word: מָאָסוּ
  choice: verwarfen
  rationale: Drückt eine bewusste Zurückweisung aus, ohne die mögliche emotionale Nebenbedeutung von „verachteten“ festzuschreiben.
- source_word: חֻקּוֹתַי
  choice: meine Satzungen
  rationale: Gibt den festgesetzten, verbindlichen Charakter der חֻקִּים wieder und erhält die Unterscheidung von den Rechtsbestimmungen.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: nicht nach meinen Satzungen lebten
  rationale: Überträgt die hebräische Wegmetapher idiomatisch als Lebensführung; ein wörtliches „in ihnen gingen“ wäre im modernen Deutsch missverständlich.
- source_word: שַׁבְּתוֹתַי
  choice: meine Sabbate
  rationale: Bewahrt den ausdrücklich gebrauchten Plural und die etablierte deutsche Bezeichnung.
- source_word: חִלֵּלוּ
  choice: entweihten
  rationale: Bezeichnet treffend die Behandlung des Heiligen als unheilig oder gewöhnlich.
- source_word: גִלּוּלֵיהֶם
  choice: ihren Götzen
  rationale: „Götzen“ ist verständlich und bereits abwertend; die noch schärfere, möglicherweise mit Unrat verbundene Färbung des hebräischen Ausdrucks wird in der Fußnote erläutert.
- source_word: אַחֲרֵי גִלּוּלֵיהֶם לִבָּם הֹלֵךְ
  choice: ihr Herz ging ihren Götzen nach
  rationale: Erhält sowohl das singularische „Herz“ als Zentrum der inneren Ausrichtung als auch die Bewegungsmetapher des hebräischen Ausdrucks.
theological_decisions:
- issue: Unterscheidung der Begriffe des Bundesrechts
  choice: מִשְׁפָּטַי wird mit „meine Rechtsbestimmungen“, חֻקּוֹתַי mit „meine Satzungen“ wiedergegeben.
  alternative: Beide Begriffe unterschiedslos mit „meine Gesetze“ wiedergeben.
  rationale: Der hebräische Text verwendet zwei verschiedene Rechtsbegriffe. Ihre Unterscheidung bewahrt die sprachliche Struktur, ohne ihnen eine über den Text hinausgehende dogmatische Systematik aufzuerlegen.
- issue: Anthropologische Metapher in לִבָּם הֹלֵךְ
  choice: „ihr Herz ging ihren Götzen nach“
  alternative: „sie waren ihren Götzen ergeben“ oder „ihre Herzen folgten ihren Götzen“
  rationale: Die Formulierung bewahrt das Herz als inneres Zentrum der Ausrichtung, den auffälligen Singular und die Wegmetapher, statt sie als abstrakte Hingabe auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem begründenden Charakter des hebräischen Verses; „nach meinen Satzungen lebten“ vermeidet ein unnatürliches wörtliches Deutsch, während „ihr Herz ging … nach“ die zentrale hebräische Metapher bewusst erhält.
