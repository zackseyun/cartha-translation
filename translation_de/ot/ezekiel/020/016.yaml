  source_fidelity: Der deutsche Text gibt die kausale Einleitung יַעַן, die Zurückweisung der משפטים, das Nichtleben nach den חֻקּוֹת, die Entweihung der Sabbate und die anhaltende Herzensausrichtung auf die Götzen zuverlässig wieder. Der Singular „ihr Herz“ und die Nachfolge-Metapher sind erhalten.
  naturalness: „Weil sie meine Rechtsbestimmungen verwarfen, nicht nach meinen Satzungen lebten und meine Sabbate entweihten; denn ihr Herz ging ihren Götzen nach“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die syntaktische Wiederaufnahme mit „denn“ ist trotz der vorangestellten Kausalpartikel idiomatisch und bildet die hebräische Begründung angemessen ab.
  terminology: „Rechtsbestimmungen“ und „Satzungen“ halten die beiden unterschiedlichen hebräischen Rechtstermini sinnvoll auseinander. „Entweihten“, „Sabbate“ und „Götzen“ sind treffend und im Register passend. Die Fußnote gibt die pejorative Konnotation von גִלּוּלִים vorsichtig wieder, ohne eine unsichere Etymologie als Gewissheit auszugeben.
