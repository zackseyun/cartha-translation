  text: אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/חֻקּוֹתַ֖/י לֵ֑כוּ וְ/אֶת מִשְׁפָּטַ֥/י שִׁמְר֖וּ וַ/עֲשׂ֥וּ אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/019.yaml
  text: I am Yahweh your God; walk in my statutes[a], and keep my judgments and do them.
translation:
  language: de
  text: Ich bin Jahwe, euer Gott. Lebt nach meinen Satzungen, haltet meine Rechtsbestimmungen[a] ein und setzt sie um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Rechtsordnungen«.'
    reason: Lexikalische Alternative für מִשְׁפָּטַי; das Wort kann rechtliche Bestimmungen beziehungsweise Ordnungen bezeichnen.
lexical_decisions:
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ich bin Jahwe, euer Gott
  rationale: Die verblos formulierte Selbstvorstellung wird im Deutschen natürlich mit »bin« wiedergegeben. Das selbstständige Pronomen אֲנִי unterstreicht die Aussage; der Gottesname יְהוָה bleibt als »Jahwe« erhalten, und אֱלֹהֵיכֶם bezeichnet im Bundeszusammenhang singularisch »euren Gott«.
- source_word: בְּחֻקּוֹתַי לֵכוּ
  choice: Lebt nach meinen Satzungen
  rationale: הלך mit ב und חֻקּוֹת ist eine feste Wendung für eine an Gottes Satzungen ausgerichtete Lebensführung. »Lebt nach« vermittelt diesen Sinn in natürlichem modernem Deutsch, ohne das Bild durch das missverständliche wörtliche »geht in« zu belasten.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Regelungen. »Rechtsbestimmungen« bewahrt den juridischen Gehalt und lässt sich klar von »Satzungen« unterscheiden.
- source_word: שִׁמְרוּ
  choice: achtet auf
  rationale: שׁמר bedeutet im rechtlich-bundestheologischen Zusammenhang, Gebote aufmerksam zu bewahren und einzuhalten. »Achtet auf« erhält diese Komponente und lässt der folgenden Aufforderung zum tatsächlichen Tun eigenes Gewicht.
- source_word: וַעֲשׂוּ אוֹתָם
  choice: und setzt sie in die Tat um
  rationale: עשה mit dem Objektpronomen fordert die konkrete Ausführung der Rechtsbestimmungen. »In die Tat umsetzen« gibt diesen Vollzugsaspekt idiomatisch und deutlich wieder.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen; »Jehova« beruht auf einer späteren Mischlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Lebenswandel-Metapher wird mit »Lebt nach« natürlich wiedergegeben; die Abfolge von Bewahren und Tun bleibt durch »achtet auf« und »setzt … in die Tat um« erkennbar.
