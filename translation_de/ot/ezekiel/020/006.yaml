  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָשָׂ֤אתִי יָדִ/י֙ לָ/הֶ֔ם לְ/הֽוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל אֶ֜רֶץ אֲשֶׁר תַּ֣רְתִּי לָ/הֶ֗ם זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/006.yaml
  text: On that day I raised my hand to them[a], to bring them out from the land of Egypt into a land that I had searched out for them, flowing with milk and honey[c][b]; it is the glory of all lands.
translation:
  language: de
  text: An jenem Tag erhob ich ihnen gegenüber meine Hand[a], um sie aus dem Land Ägypten herauszuführen in ein Land, das ich für sie erkundet hatte[b], ein Land, in dem Milch und Honig fließen; es ist die Zierde aller Länder[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Erheben der Hand ist hier eine Schwurgeste; sinngemäß: »ich schwor ihnen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das ich für sie ausgewählt hatte«; das hebräische Verb bedeutet wörtlich »erkunden« oder »auskundschaften«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »die Schönheit« beziehungsweise »die Pracht aller Länder«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: ich erhob ihnen gegenüber meine Hand
  rationale: Die konkrete hebräische Gebärde bleibt erhalten; der Zusatz „ihnen gegenüber“ gibt לָהֶם natürlich wieder. Im Zusammenhang bezeichnet das Erheben der Hand eine eidliche Zusage.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: um sie aus dem Land Ägypten herauszuführen
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszuführen oder herauszubringen. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt die Exodus-Sprache.
- source_word: אֲשֶׁר תַּרְתִּי לָהֶם
  choice: das ich für sie erkundet hatte
  rationale: תור bezeichnet das Erkunden oder Auskundschaften. „Erkundet“ bewahrt die anschauliche und anthropomorphe Ausdrucksweise, ohne den militärischen Beiklang von „ausspioniert“ aufzudrängen.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die geläufige biblische Wendung drückt Fruchtbarkeit und Überfluss aus. Die Wiederaufnahme von „Land“ sorgt im Deutschen für einen klaren Bezug.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: es ist die Zierde aller Länder
  rationale: צְבִי kann Schönheit, Pracht, Herrlichkeit oder Zierde bezeichnen. „Zierde“ bewahrt das bildhafte Lob und die gehobene prophetische Sprache, ohne die Aussage in einen bloßen Superlativ umzudeuten.
theological_decisions:
- issue: Anthropomorphe Rede von Gott in תַּרְתִּי
  choice: das ich für sie erkundet hatte
  alternative: das ich für sie ausgewählt hatte
  rationale: Die Übersetzung erhält die ungewöhnliche, anschauliche Redeweise des Hebräischen, statt sie zu einer abstrakten Aussage über Auswahl zu glätten. Sie trifft keine weitergehende Aussage über Gottes Wissen.
- issue: Eidcharakter der erhobenen Hand
  choice: erhob ich ihnen gegenüber meine Hand
  alternative: schwor ich ihnen
  rationale: Die konkrete Bildsprache des Ausgangstextes wird im Haupttext bewahrt; die Fußnote erläutert die idiomatische Bedeutung als Schwur oder eidliche Zusage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener hebräischer Bildsprache. „Zierde aller Länder“ ist bewusst leicht gehoben und entspricht dem prophetischen Register; die Fußnoten halten wesentliche lexikalische Alternativen offen.
