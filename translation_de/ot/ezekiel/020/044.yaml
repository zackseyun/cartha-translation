source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/עֲשׂוֹתִ֥/י אִתְּ/כֶ֖ם לְמַ֣עַן שְׁמִ֑/י לֹא֩ כְ/דַרְכֵי/כֶ֨ם הָ/רָעִ֜ים וְ/כַ/עֲלִילֽוֹתֵי/כֶ֤ם הַ/נִּשְׁחָתוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/044.yaml
  text: Then you will know that I am Yahweh[a], when I deal with you for the sake of my name, not according to your evil ways or according to your corrupt deeds, O house of Israel[b], declares the Lord GOD.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich Yahweh bin, wenn ich um meines Namens willen[b] an euch handle[a] – nicht nach euren bösen Wegen und euren verdorbenen Taten, Haus Israel –, spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich mit euch handle“. Das Hebräische ist weit gefasst und bestimmt die Art von Gottes Handeln hier nicht näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: um der Ehre und des Ansehens seines Namens willen.'
    reason: cultural_note
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das mit וְ verbundene Perfekt hat im prophetischen Zusammenhang Zukunfts- und Folgecharakter. „Dann“ gibt die Folgerelation natürlich wieder; „erkennen“ bewahrt den gewichtigen Erkenntnischarakter der Formel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּעֲשׂוֹתִי אִתְּכֶם
  choice: wenn ich mit euch handle
  rationale: עשה mit אֵת bezeichnet hier allgemein Yahwehs Handeln an beziehungsweise gegenüber Israel. Die Formulierung lässt offen, ob Gericht, Wiederherstellung oder beides im Vordergrund steht.
- source_word: לְמַעַן שְׁמִי
  choice: um meines Namens willen
  rationale: Die geläufige deutsche Wendung bewahrt die theologische Aussage, dass Yahweh im Interesse seines Namens und dessen Ansehens handelt.
- source_word: לֹא כְדַרְכֵיכֶם הָרָעִים
  choice: nicht nach euren bösen Wegen
  rationale: „Wege“ kann wie im Hebräischen sowohl das Verhalten als auch die Lebensführung bezeichnen; „nach“ gibt den durch כְּ ausgedrückten Maßstab wieder.
- source_word: וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת
  choice: und euren verdorbenen Taten
  rationale: עֲלִילוֹת bezeichnet Handlungen oder Taten; הַנִּשְׁחָתוֹת kennzeichnet sie moralisch als verdorben. Das deutsche „und“ entspricht der hebräischen Verbindung und steht gemeinsam im Geltungsbereich der Verneinung.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle, verständliche Bezeichnung bewahrt die kollektive Anrede; die deutsche Wortstellung macht den Vokativ auch ohne ein altertümliches „o“ deutlich.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: „Spricht“ gibt die prophetische Botenformel idiomatisch wieder. אֲדֹנָי bleibt als Titel „der Herr“ erhalten, während יְהוִה als Eigenname „Yahweh“ erscheint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Art des göttlichen Handelns in בַּעֲשׂוֹתִי אִתְּכֶם
  choice: wenn ich mit euch handle
  alternative: wenn ich an euch handle
  rationale: Der Ausdruck legt nicht eindeutig fest, ob das Handeln strafend, rettend oder beides ist. Die breite Formulierung bewahrt diese Spannung.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Gottesnamen יְהוִה und lässt zugleich beide Bestandteile der hebräischen Verbindung sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am prophetischen Ausgangstext, wird aber durch Gedankenstriche lesbar gegliedert. Das altertümlich wirkende vokativische „o“ wurde vermieden; „Haus Israel“ bleibt als biblische Kollektivbezeichnung erhalten.
