  text: וְ/הָֽ/עֹלָה֙ עַל ר֣וּחֲ/כֶ֔ם הָי֖וֹ לֹ֣א תִֽהְיֶ֑ה אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִֽהְיֶ֤ה כַ/גּוֹיִם֙ כְּ/מִשְׁפְּח֣וֹת הָ/אֲרָצ֔וֹת לְ/שָׁרֵ֖ת עֵ֥ץ וָ/אָֽבֶן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/032.yaml
  text: What is coming up in your mind will certainly not happen—that you say[a], ‘We will be like the nations, like the clans of the lands[d][c][b], serving wood and stone.’
translation:
  language: de
  text: 'Was euch in den Sinn kommt, wird ganz gewiss nicht Wirklichkeit werden – das, was ihr sagt: »Wir werden wie die Nationen sein, wie die Sippen der Länder, und Holz und Stein dienen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָעֹלָה עַל רוּחֲכֶם
  choice: Was euch in den Sinn kommt
  rationale: Die Wendung bezeichnet idiomatisch einen Gedanken oder eine Absicht, die im Inneren aufkommt. »In den Sinn kommen« ist natürliches modernes Deutsch und bewahrt zugleich das Bild des Aufkommens.
- source_word: הָיוֹ לֹא תִהְיֶה
  choice: wird ganz gewiss nicht geschehen
  rationale: Der vorangestellte absolute Infinitiv verstärkt die verneinte finite Verbform. »Ganz gewiss nicht« gibt diese nachdrückliche Zurückweisung wieder.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: Ihr sagt nämlich
  rationale: Der Relativsatz erläutert den zuvor genannten Gedanken durch das folgende Zitat. »Nämlich« macht diesen Bezug im Deutschen klar, ohne den Inhalt zu erweitern.
- source_word: נִהְיֶה
  choice: Wir wollen … sein
  rationale: Das Imperfekt bezeichnet hier im Zusammenhang einer erklärten Absicht ein angestrebtes künftiges Sein. »Wir wollen« bringt den intentionalen Sinn natürlicher zum Ausdruck als eine bloße Zukunftsform.
- source_word: כַגּוֹיִם
  choice: wie die Nationen
  rationale: גּוֹיִם bezeichnet hier die Israel umgebenden Völker beziehungsweise Nationen. »Nationen« vermeidet die später geprägte religiöse Bezeichnung »Heiden«.
- source_word: כְּמִשְׁפְּחוֹת הָאֲרָצוֹת
  choice: wie die Sippen der Länder
  rationale: מִשְׁפָּחוֹת meint soziale Verwandtschaftsgruppen und wird treffend mit »Sippen« wiedergegeben; der Plural הָאֲרָצוֹת bleibt als »Länder« erhalten.
- source_word: לְשָׁרֵת
  choice: dienen
  rationale: Das Verb bedeutet grundsätzlich »dienen«. Der religiöse, götzendienerische Sinn ergibt sich aus dem Zusammenhang, ohne dass die Übersetzung ihn im Haupttext auf »anbeten« verengt.
- source_word: עֵץ וָאָבֶן
  choice: Holz und Stein
  rationale: Die konkrete Materialbezeichnung verweist polemisch auf daraus gefertigte Götzenbilder. Die wörtliche Wiedergabe bewahrt diese Ausdruckskraft.
theological_decisions:
- issue: Götzendienstliche Bedeutung von לְשָׁרֵת
  choice: Holz und Stein dienen
  alternative: Holz und Stein anbeten
  rationale: »Dienen« entspricht dem hebräischen Verb unmittelbar und lässt dessen umfassenderen Bedeutungsbereich bestehen; der Zusammenhang macht deutlich, dass religiöser Dienst an Götzen gemeint ist.
- issue: Innere Instanz רוּחַ
  choice: in den Sinn
  alternative: in eurem Geist
  rationale: רוּחַ bezeichnet in dieser Wendung den inneren Gedanken beziehungsweise die Absicht. »Sinn« gibt das Idiom verständlich wieder, ohne eine besondere anthropologische oder theologische Deutung von »Geist« einzutragen.
- issue: Modalität von נִהְיֶה
  choice: Wir wollen … sein
  alternative: Wir werden … sein
  rationale: Im Zitat wird eine erklärte Absicht Israels formuliert. Die voluntative deutsche Wiedergabe bringt diese kontextuelle Nuance zur Geltung, ohne sie als Befehl oder bloße Vorhersage festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax wurde für gute Verständlichkeit in zwei aufeinander bezogene Sätze gegliedert. »Nationen«, »Sippen« und »dienen« bewahren die konkreten hebräischen Begriffe; die Fußnoten dokumentieren die wörtlichere Form und die religiöse Bedeutung.
