source:
  edition: WLC
  text: הֲ/תִשְׁפֹּ֣ט אֹתָ֔/ם הֲ/תִשְׁפּ֖וֹט בֶּן אָדָ֑ם אֶת תּוֹעֲבֹ֥ת אֲבוֹתָ֖/ם הוֹדִיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/004.yaml
  text: Will you judge them? Will you judge[b][a], son of man? Make known to them the abominations of their fathers.
translation:
  language: de
  text: Willst du sie richten? Willst du richten, Menschensohn[a]? Mach ihnen die Abscheulichkeiten ihrer Väter[b] bekannt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sohn eines Menschen“; „Menschensohn“ ist in Ezechiel die regelmäßige Anrede des Propheten. Möglich wären auch „Menschenkind“ oder „Sterblicher“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihrer Vorfahren“. Das Hebräische sagt wörtlich „ihrer Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁפֹּט / הֲתִשְׁפּוֹט
  choice: Willst du sie richten? Willst du sie richten
  rationale: שׁפט im Qal bezeichnet hier das richterliche Urteilen. Die auffällige Wiederholung der rhetorischen Frage wird beibehalten und nicht stilistisch geglättet.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen verweist im Zusammenhang auf die Ältesten Israels und wird unmittelbar wiedergegeben.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Ezechiel regelmäßig gebrauchte göttliche Anrede wird als etablierte deutsche prophetische Wendung bewahrt. Sie bezeichnet hier den menschlichen Propheten und wird nicht messianisch ausgedeutet.
- source_word: תּוֹעֲבוֹת
  choice: Abscheulichkeiten
  rationale: Das Wort trägt bei Ezechiel starkes moralisches und kultisches Gewicht, besonders im Blick auf Götzendienst und Verunreinigung. „Abscheulichkeiten“ erhält diese Schärfe, ohne die gemeinten Handlungen unnötig einzuengen.
- source_word: אֲבוֹתָם
  choice: ihrer Väter
  rationale: Die wörtliche, männliche und genealogische Bezeichnung wird im Haupttext erhalten; „Vorfahren“ bleibt als mögliche kontextuelle Wiedergabe in der Fußnote.
- source_word: הוֹדִיעֵם
  choice: Mach ihnen … bekannt
  rationale: 'Der Hifil von ידע hat kausative Bedeutung: jemanden etwas wissen lassen beziehungsweise etwas bekannt machen. Die deutsche Formulierung gibt den Imperativ klar und natürlich wieder.'
theological_decisions:
- issue: Bedeutung der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Sterblicher; Menschenkind
  rationale: Die Wendung ist hier Ezechiels typische prophetische Anrede und keine ausdrückliche messianische Titelaussage. Die Übersetzung wahrt das hebräische Bild, ohne spätere christologische Bedeutungen in den Vers hineinzulesen.
- issue: Wiedergabe von אֲבוֹתָם
  choice: ihrer Väter
  alternative: ihrer Vorfahren
  rationale: „Väter“ bewahrt die konkrete familiäre und genealogische Rhetorik des hebräischen Textes. „Vorfahren“ ist sachlich möglich, aber weiter gefasst.
- issue: Forensische Tragweite von שׁפט
  choice: richten
  alternative: verurteilen; zur Rechenschaft ziehen
  rationale: „Richten“ lässt offen, ob der Schwerpunkt auf dem Verfahren, dem Urteil oder der Verurteilung liegt, und bewahrt dadurch die genuine Bedeutungsbreite des Verbs in der prophetischen Herausforderung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte rhetorische Frage und der anschließende Imperativ folgen der markanten Struktur des Hebräischen. „Abscheulichkeiten“ ist bewusst kräftig und etwas gehoben, da ein neutraleres Wort das moralische und kultische Gewicht des Ausgangstextes abschwächen würde.
