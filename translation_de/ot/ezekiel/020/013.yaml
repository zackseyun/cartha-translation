source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֨/י בֵֽית יִשְׂרָאֵ֜ל בַּ/מִּדְבָּ֗ר בְּ/חֻקּוֹתַ֨/י לֹא הָלָ֜כוּ וְ/אֶת מִשְׁפָּטַ֣/י מָאָ֗סוּ אֲשֶׁר֩ יַעֲשֶׂ֨ה אֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם וְ/אֶת שַׁבְּתֹתַ֖/י חִלְּל֣וּ מְאֹ֑ד וָ/אֹמַ֞ר לִ/שְׁפֹּ֨ךְ חֲמָתִ֧/י עֲלֵי/הֶ֛ם בַּ/מִּדְבָּ֖ר לְ/כַלּוֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/013.yaml
  text: But the house of Israel rebelled against me in the wilderness[a]. They did not walk in my statutes, and they rejected my judgments, which if a person does them, he will live by them. They greatly profaned my Sabbaths. Then I said I would pour out my wrath on them in the wilderness[c][b], to put an end to them.
translation:
  language: de
  text: Doch das Haus Israel lehnte sich in der Wüste gegen mich auf. Sie richteten sich nicht nach meinen Satzungen und verwarfen meine Rechtsbestimmungen[a], die der Mensch befolgt und durch die er lebt.[b][c] Meine Sabbate entweihten sie schwer. Da sagte ich, ich werde meinen Zorn über sie in der Wüste ausgießen und sie vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Rechtsordnungen“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier „der Mensch“ im Singular; gemeint ist jeder Mensch, der diese Bestimmungen befolgt.
    reason: generic_singular_clarification
  - marker: c
    text: Diese Formulierung greift Levitikus 18,5 auf.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: lehnte sich gegen mich auf
  rationale: מרה mit ב bezeichnet eine gegen Gott gerichtete Auflehnung. Die Wendung gibt den aktiven und bundesbezogenen Widerstand in natürlichem Deutsch wieder.
- source_word: בֵית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die prophetische Kollektivbezeichnung wird beibehalten und nicht zu „Israel“ verkürzt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist die übliche und kontextgerechte Wiedergabe von מִדְבָּר für den Ort der Wüstenwanderung.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: Sie richteten sich nicht nach meinen Satzungen
  rationale: Das hebräische Bild des Gehens bezeichnet die Lebensführung. „Sich nach etwas richten“ vermittelt dieses Idiom in modernem, natürlichem Deutsch, während „Satzungen“ den rechtlich-bundestheologischen Charakter wahrt.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Anordnungen. „Rechtsbestimmungen“ bewahrt die juristische Nuance und unterscheidet den Ausdruck von חֻקּוֹתַי.
- source_word: מָאָסוּ
  choice: verwarfen
  rationale: „Verwarfen“ gibt die bewusste Zurückweisung wieder, ohne über den Text hinaus einen bestimmten Gefühlszustand zu behaupten.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם
  choice: dabei wird der Mensch, der sie befolgt, durch sie leben
  rationale: Die Formulierung erhält den generischen Singular, den Zukunfts- beziehungsweise Verheißungscharakter und die offene Bedeutung von „leben“. „Befolgen“ gibt das idiomatische Tun von Geboten im Deutschen natürlich wieder.
- source_word: שַׁבְּתֹתַי
  choice: meine Sabbate
  rationale: Der Plural des Hebräischen bleibt erhalten und bewahrt die besondere Bedeutung der Sabbate als Bundeszeichen.
- source_word: חִלֵּלוּ מְאֹד
  choice: entweihten sie schwer
  rationale: „Entweihen“ entspricht dem Piel von חלל; „schwer“ gibt den verstärkenden Sinn von מְאֹד in idiomatischem Deutsch wieder.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: ich werde meinen Zorn über sie ... ausgießen
  rationale: Die feste Metapher des Ausgießens bleibt erhalten; „Zorn“ gibt חֵמָה im Gerichtskontext klar und würdig wieder.
- source_word: לְכַלּוֹתָם
  choice: sie vernichten
  rationale: Im Zusammenhang des ausgegossenen Zorns bezeichnet כלה die vollständige Beseitigung; „vernichten“ gibt die Schärfe der angekündigten Strafe prägnant wieder.
theological_decisions:
- issue: Generischer Singular הָאָדָם in der Lebensformel
  choice: der Mensch, der sie befolgt
  alternative: wer sie befolgt
  rationale: „Der Mensch“ bewahrt den ausdrücklich singularischen und repräsentativen Ausdruck des Hebräischen, bleibt im Deutschen jedoch allgemein auf jeden Menschen bezogen.
- issue: Bedeutung der Lebenszusage וָחַי בָּהֶם
  choice: wird ... durch sie leben
  alternative: wird dadurch am Leben bleiben
  rationale: Die gewählte Fassung lässt offen, welchen Umfang „leben“ hier hat, und bewahrt dadurch die theologische Spannung sowie den Anklang an Levitikus 18,5, ohne die Aussage auf bloßes physisches Überleben einzuengen.
- issue: Verhältnis von menschlichem Tun und Leben
  choice: der sie befolgt, [wird] durch sie leben
  alternative: der sie tun soll, damit er durch sie lebt
  rationale: Die Fassung gibt die Abfolge von Tun und Leben wieder, ohne durch eine Zweckkonstruktion oder eine systematische Deutung ein bestimmtes theologisches Modell in den Text einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Hebräische Rechtsbegriffe werden erkennbar unterschieden, unnötig altertümliche Wendungen wie „in den Satzungen wandeln“ jedoch vermieden. Die Wiederholung von „in der Wüste“ bleibt entsprechend dem Ausgangstext erhalten.
