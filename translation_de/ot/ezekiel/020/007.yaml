base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/007.yaml
  text: And I said to them[a], ‘Each man, throw away the detestable things before his eyes, and do not defile yourselves with the idols of Egypt[b]. I am Yahweh your God.’
translation:
  language: de
  text: 'Und ich sagte zu ihnen: »Jeder von euch soll die abscheulichen Dinge, die ihm vor Augen stehen, wegwerfen[a] und sich nicht durch die Götzen Ägyptens verunreinigen[b]. Ich bin Jahwe, euer Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »die Abscheulichkeiten seiner Augen«. Gemeint sind wohl verabscheuungswürdige Kultgegenstände, die jeder Einzelne vor Augen hat oder nach denen er verlangt.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »Götzen« übersetzte hebräische Wort ist besonders bei Ezechiel stark verächtlich; möglich wäre auch »widerliche Götzen«, sehr wörtlich etwa »Kotgötzen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵהֶם
  choice: Und ich sagte zu ihnen
  rationale: Das Waw mit der Vergangenheitsform führt die Erzählung fort; die schlichte deutsche Koordination bewahrt diesen Ablauf.
- source_word: אִישׁ
  choice: Jeder
  rationale: 'אִישׁ wird hier distributiv gebraucht: Jede einzelne angesprochene Person soll handeln. „Jeder“ ist im Deutschen natürlich und gibt diese Funktion klar wieder.'
- source_word: שִׁקּוּצֵי עֵינָיו
  choice: die abscheulichen Dinge, auf die seine Augen gerichtet sind
  rationale: Die Wendung bedeutet wörtlich ungefähr „die Abscheulichkeiten seiner Augen“. Die Übersetzung bewahrt das Augenbild und macht zugleich verständlich, dass es um verabscheute Gegenstände geht, denen sich der Einzelne zuwendet; im Kontext sind wohl Kultbilder gemeint.
- source_word: הַשְׁלִיכוּ
  choice: wegwerfen
  rationale: Der Imperativ verlangt eine entschiedene Beseitigung beziehungsweise Abkehr. „Wegwerfen“ ist gegenwärtiges, kräftiges Deutsch.
- source_word: גִלּוּלֵי מִצְרַיִם
  choice: den Götzen Ägyptens
  rationale: גִלּוּלִים bezeichnet besonders bei Ezechiel Götzen in stark verächtlicher Weise. „Götzen“ gibt den Kern klar wieder; die grob abwertende Färbung wird in der Fußnote erläutert.
- source_word: אַל תִּטַּמָּאוּ
  choice: verunreinigt euch nicht
  rationale: Die reflexive Form und der kultisch-moralische Sinn werden durch „sich verunreinigen“ präzise wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Im Zusammenhang mit Jahwe ist die Form eindeutig singularisch und bezeichnet Israels Gott im Bundesverhältnis.
theological_decisions:
- issue: Deutung von שִׁקּוּצֵי עֵינָיו
  choice: die abscheulichen Dinge, auf die seine Augen gerichtet sind
  alternative: die abscheulichen Götzen, die jeder ansieht oder begehrt
  rationale: Der Kontext legt götzendienerische Gegenstände nahe, doch die ungewöhnliche Augen-Wendung soll nicht vollständig in eine eindeutige Auslegung aufgelöst werden. Die Übersetzung wahrt sowohl das Bild als auch dessen mögliche Nuance von Hinwendung oder Begehren.
- issue: Wiedergabe des polemischen Ausdrucks גִלּוּלִים
  choice: Götzen
  alternative: Kotgötzen / widerliche Götzen
  rationale: Das Grundreferat ist eindeutig, die genaue Bildherkunft beziehungsweise volle grobe Wirkung des Ausdrucks lässt sich im flüssigen Haupttext jedoch schwer abbilden. Daher steht die stärkere abwertende Nuance in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Ablauf, ohne unnatürlich zu wirken. Das Augenbild wird erhalten, aber durch einen Relativsatz verständlich gemacht; die besonders derbe Polemik des Götzenbegriffs wird in einer Fußnote offengelegt.
