  source_fidelity: Der Entwurf gibt den narrativen Anschluss, die distributive Anrede, die Aufforderung zur Abkehr, die kultisch-moralische Verunreinigung und die Selbstvorstellung Jahwes insgesamt zutreffend wieder. Die Wendung zu den „Abscheulichkeiten“ wahrt sinnvoll die im Hebräischen bildhafte und nicht völlig eindeutige Augen-Metaphorik. Die Präposition bei den Götzen wird jedoch mit „sich an den Götzen verunreinigen“ im Deutschen weder idiomatisch noch klar genug wiedergegeben; „durch die Götzen“ bildet den Zusammenhang der Verunreinigung durch Götzendienst angemessen ab.
  naturalness: „Sich an den Götzen … verunreinigen“ ist im modernen Standarddeutsch unnatürlich. Außerdem ist „Jeder soll“ zwar verständlich, aber „Jeder von euch soll“ stellt die pluralische Adressatenschaft und die distributive hebräische Konstruktion klarer heraus. „Die ihm vor Augen stehen“ ist eine knappe, natürliche Wiedergabe des Augenbildes.
  terminology: „Jahwe“ ist als Wiedergabe von יהוה konsequent. „Gott“ für אֱלֹהֵיכֶם und „Götzen“ für גִּלּוּלִים sind sachgerecht. Die Fußnote zu גִּלּוּלִים bewahrt zutreffend die besonders polemische Konnotation, ohne deren umstrittene konkrete Bildherkunft dem Haupttext aufzuzwingen.
