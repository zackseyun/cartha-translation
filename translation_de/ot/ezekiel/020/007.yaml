  to: 'Und ich sagte zu ihnen: »Jeder von euch soll die abscheulichen Dinge, die ihm vor Augen stehen, wegwerfen[a] und sich nicht durch die Götzen Ägyptens verunreinigen[b]. Ich bin Jahwe, euer Gott.«'
