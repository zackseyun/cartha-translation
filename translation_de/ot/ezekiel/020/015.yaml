  text: וְ/גַם אֲנִ֗י נָשָׂ֧אתִי יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/בִלְתִּי֩ הָבִ֨יא אוֹתָ֜/ם אֶל הָ/אָ֣רֶץ אֲשֶׁר נָתַ֗תִּי זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/015.yaml
  text: Yet I myself also raised my hand to them in the wilderness[a], that I would not bring them into the land that I had given them, flowing with milk and honey[b], the glory of all lands.
translation:
  language: de
  text: 'Doch auch ich erhob ihnen gegenüber in der Wüste meine Hand zum Schwur[a]: Ich würde sie nicht in das Land bringen, das ich ihnen gegeben hatte – ein Land, in dem Milch und Honig fließen, die Zierde aller Länder.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Erheben der Hand ist hier eine Schwurgeste; sinngemäß: „schwor ich ihnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Schönheit“, „die Pracht“ oder „der Schmuck aller Länder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Doch auch ich
  rationale: Bewahrt die additive Bedeutung von גַם und gibt zugleich den leichten Gegensatz beziehungsweise Fortgang gegenüber dem vorherigen Zusammenhang natürlich wieder.
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: erhob ... vor ihnen meine Hand zum Schwur
  rationale: Erhält das konkrete Bild des Handerhebens und macht zugleich die im Hebräischen idiomatisch enthaltene Eidesbedeutung für heutige Leser verständlich. לָהֶם bezeichnet hier die Personen, denen gegenüber der Schwur erfolgt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Die übliche und sachlich passende Bezeichnung für Israels Aufenthaltsgebiet; sie setzt nicht ausschließlich eine Sandwüste voraus.
- source_word: לְבִלְתִּי הָבִיא אוֹתָם
  choice: Ich würde sie nicht ... bringen
  rationale: Gibt den Inhalt des Schwurs in natürlichem Deutsch und mit der im Zusammenhang liegenden zukünftigen Willensbekundung wieder.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי
  choice: das Land, das ich ihnen gegeben hatte
  rationale: Das Plusquamperfekt kennzeichnet die vorausgehende Gabe beziehungsweise Zusage des Landes aus der Perspektive des späteren Wüstenschwurs. Das im Zusammenhang erschlossene indirekte Objekt wird im Deutschen ausdrücklich genannt.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die eingebürgerte deutsche Wendung bildet das hebräische Bild verständlich und würdig ab.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: die Zierde aller Länder
  rationale: צְבִי bezeichnet hier begehrenswerte Schönheit, Pracht oder Vorzüglichkeit. „Zierde“ bewahrt die poetische, gehobene Aussage, ohne sie ausdrücklich zu einem grammatischen Superlativ umzuformen.
theological_decisions:
- issue: Soll die Eidesbedeutung von נָשָׂאתִי יָדִי ausdrücklich gemacht werden?
  choice: Das Bild des Handerhebens bleibt erhalten und wird durch „zum Schwur“ erklärt.
  alternative: Nur idiomatisch mit „ich schwor ihnen“ übersetzen oder ausschließlich wörtlich „ich erhob meine Hand“ schreiben.
  rationale: Die Fassung verbindet Quellennähe mit unmittelbarer Verständlichkeit und legt über die im Idiom enthaltene Eideshandlung hinaus keine besondere theologische Deutung fest.
- issue: Zeitliche Bedeutung von נָתַתִּי beim Land
  choice: „gegeben hatte“
  alternative: „gab“ oder „gegeben habe“
  rationale: Das Plusquamperfekt bringt die dem Wüstenschwur vorausgehende Gabe beziehungsweise Zusage zur Geltung, ohne zwischen rechtlicher Gabe, Verheißung und späterem Besitz unnötig dogmatisch zu unterscheiden.
- issue: Bedeutung von צְבִי im Verhältnis zu allen Ländern
  choice: „die Zierde aller Länder“
  alternative: „das schönste“, „die Pracht“ oder „der Schmuck aller Länder“
  rationale: Die gewählte Form wahrt die poetische Wertung und die mögliche Spannung zwischen Schönheit, Herrlichkeit und besonderer Begehrtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt kennzeichnet den Inhalt des Schwurs; der Gedankenstrich hebt die beschreibende Apposition zum Land hervor. Das traditionelle Bild von Milch und Honig bleibt erhalten.
