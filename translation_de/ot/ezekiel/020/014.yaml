  terminology: „Name“, „entweiht“ und „Völker“ sind sachgerecht. „Entweiht“ trifft חלל im Kontext besser als eine bloß soziale oder reputationsbezogene Umschreibung. Die Fußnoten sind korrekt verankert und erläutern die relevanten lexikalischen Aspekte ohne den Haupttext zu überladen.
