source:
  edition: WLC
  text: וָ/אֶעֱשֶׂ֖ה לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁ֥ר הוֹצֵאתִ֖י/ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/014.yaml
  text: But I acted for the sake of my name[a], so that it would not be profaned in the sight of the nations[b], in whose sight I had brought them out.
translation:
  language: de
  text: Doch ich handelte um meines Namens willen[a], damit er vor den Augen der Völker nicht entweiht würde[b], vor deren Augen ich sie herausgeführt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „meines Namens wegen“.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „entweiht“ wiedergegebene Verb bedeutet, etwas Heiliges wie etwas Gewöhnliches zu behandeln oder zu schänden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱשֶׂה
  choice: Doch ich handelte
  rationale: עשה ist ein breites Verb für „tun, machen, handeln“. Im Gegensatz zur zuvor angekündigten Strafe gibt „Doch ich handelte“ sowohl die Handlung als auch den adversativen Zusammenhang natürlich wieder.
- source_word: לְמַעַן שְׁמִי
  choice: um meines Namens willen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Idiom und dessen Bezug auf Gottes offenbarten Charakter und öffentliche Ehre.
- source_word: לְבִלְתִּי הֵחֵל
  choice: damit er … nicht entweiht würde
  rationale: Die Konstruktion drückt Zweck beziehungsweise Verhinderung aus. חלל bezeichnet hier das Entweihen dessen, was heilig ist; das Pronomen „er“ nimmt „mein Name“ auf.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: vor den Augen der Völker
  rationale: Die Wendung erhält das konkrete Bild der Augen und betont, dass Gottes Handeln öffentlich wahrgenommen wird.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die umgebenden Völker; „Heiden“ würde eine im Kontext nicht erforderliche religiöse Wertung eintragen.
- source_word: אֲשֶׁר הוֹצֵאתִים
  choice: vor deren Augen ich sie herausgeführt hatte
  rationale: Die Hifil-Form bedeutet „herausführen“. Das Suffix verweist auf Israel, und das Plusquamperfekt macht die zeitlich vorausgehende Handlung deutlich.
- source_word: לְעֵינֵיהֶם
  choice: vor deren Augen
  rationale: Die Wiederholung von „vor den Augen“ bildet die bewusste Wiederholung des Hebräischen ab und erhält den Nachdruck auf dem öffentlichen Zeugnis.
theological_decisions:
- issue: Gottes Handeln „um meines Namens willen“
  choice: Die idiomatische Formulierung bleibt stehen und bezeichnet die Wahrung der Heiligkeit und öffentlichen Ehre seines Namens unter den Völkern.
  alternative: Die Wendung als bloße Sorge um Ansehen oder Ruf auszuformulieren.
  rationale: „Name“ umfasst in diesem Zusammenhang Gottes offenbarten Charakter und seine Bundes­ehre. Eine erklärende Verengung im Haupttext würde die theologische Dichte des hebräischen Ausdrucks vermindern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Wendung „vor den Augen“ bewahrt die auffällige hebräische Wiederholung und den Gedanken öffentlicher Wahrnehmung; die Pronomenbezüge bleiben klar.
