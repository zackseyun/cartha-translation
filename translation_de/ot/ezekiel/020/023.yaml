base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/023.yaml
  text: Moreover[a], I also raised my hand to them in the wilderness, to scatter them among the nations and disperse them through the lands.
translation:
  language: de
  text: 'Auch ich erhob ihnen in der Wüste meine Hand[a]: Ich würde sie unter die Völker zerstreuen und über die Länder verstreuen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Erheben der Hand ist hier eine Geste des Schwörens. Daher auch: „Auch ich schwor ihnen in der Wüste, dass ich sie unter die Völker zerstreuen und über die Länder verstreuen würde.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Auch ich
  rationale: Gibt die additive Hervorhebung knapp und natürlich wieder; das betonte Pronomen bleibt erkennbar.
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: erhob ... meine Hand
  rationale: Bewahrt das konkrete hebräische Bild der Eidesgeste, während die Fußnote dessen idiomatische Bedeutung erklärt.
- source_word: לָהֶם
  choice: gegen sie
  rationale: Im Zusammenhang des angekündigten Gerichts bezeichnet לְ die Personen, auf die sich der Schwur richtet; deutsches „gegen sie“ macht diese belastende Stoßrichtung natürlich verständlich.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Ist die übliche und kontextgerechte deutsche Bezeichnung für Israels Aufenthaltsraum in der Geschichtsrückschau.
- source_word: לְהָפִיץ
  choice: zerstreuen
  rationale: Gibt den kausativen Sinn des Hifil im Gerichtskontext wieder.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: Bezeichnet die fremden Völker ohne die möglichen späteren Konnotationen von „Heiden“.
- source_word: וּלְזָרוֹת
  choice: und ... verstreuen
  rationale: Bewahrt die parallele, semantisch verwandte zweite Aussage, ohne beide hebräischen Verben völlig gleich wiederzugeben.
- source_word: בָּאֲרָצוֹת
  choice: über die Länder
  rationale: Erhält den Plural und bringt die räumliche Verteilung auf verschiedene Gebiete idiomatisch zum Ausdruck.
theological_decisions:
- issue: Ob die Eidesformel ausdrücklich mit „schwören“ oder bildhaft übersetzt werden soll
  choice: Das Bild „meine Hand erheben“ bleibt im Haupttext erhalten.
  alternative: Auch ich schwor ihnen in der Wüste, dass ich sie unter die Völker zerstreuen und über die Länder verstreuen würde.
  rationale: Die hebräische Wendung bezeichnet einen Schwur, trägt aber zugleich ein bewusstes körperliches und feierliches Bild. Der Haupttext wahrt dieses Bild; die Fußnote erschließt die idiomatische Bedeutung.
- issue: Zeitliches Verhältnis zwischen Schwur und angekündigter Zerstreuung
  choice: Die Infinitive werden als Inhalt beziehungsweise Ziel des Schwurs mit „Ich würde ...“ wiedergegeben.
  alternative: „um sie ... zu zerstreuen“
  rationale: Im Kontext kündigt Gott in der Wüste eine spätere Zerstreuung an. Die deutsche Konstruktion mit Doppelpunkt und „würde“ macht dies klar, ohne den Gerichtssinn abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Eidesmetapher bleibt erhalten; der Doppelpunkt erschließt ihren Inhalt. Die parallelen Verben werden mit „zerstreuen“ und „verstreuen“ differenziert wiedergegeben.
