revisions:
- from: Als wohlgefälligen Duft werde ich euch annehmen, wenn ich euch aus den Völkern herausführe und euch aus den Ländern sammle, in die ihr zerstreut worden seid. So werde ich mich durch euch vor den Augen der Nationen als heilig erweisen.
  to: Mit wohlgefälligem Duft werde ich euch annehmen, wenn ich euch aus den Völkern herausführe und euch aus den Ländern sammle, in die ihr zerstreut worden seid; und ich werde mich an euch vor den Augen der Nationen als heilig erweisen.
