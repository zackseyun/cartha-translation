review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Aussagen des Hebräischen sind zutreffend wiedergegeben. Die Präposition ב in בְּרֵיחַ נִיחֹחַ bezeichnet jedoch eher den kultischen Rahmen bzw. die Begleitumstände der Annahme („mit/bei wohlgefälligem Duft“) als eine Gleichsetzung des Volkes mit einem Duft. Bei וְנִקְדַּשְׁתִּי בָכֶם ist „durch euch“ möglich, legt die instrumentale Deutung aber stärker fest als nötig; „an euch“ gibt die im Kontext sichtbare Heiligung Gottes an seinem Volk genauer und idiomatisch wieder.
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Standarddeutsch. „Als wohlgefälligen Duft werde ich euch annehmen“ ist zwar verständlich, klingt aber im Deutschen so, als würden die Angesprochenen selbst als Duft angenommen. Die revidierte Formulierung bewahrt das kultische Bild ohne diese unnötige Verschiebung.
  terminology: „wohlgefälliger Duft“, „Völker“, „Länder“ und „Nationen“ sind passend. „An euch ... als heilig erweisen“ wahrt die Selbstheiligung Gottes, ohne eine bestimmte instrumentale oder lokale Auslegung von בָכֶם festzulegen.
  issues:
  - severity: medium
    issue: „Als wohlgefälligen Duft werde ich euch annehmen“ verschiebt die Beziehung des Duftbildes zur Annahme.
    rationale: Das hebräische בְּרֵיחַ נִיחֹחַ steht adverbial bei „ich werde euch annehmen“. Die deutsche Als-Konstruktion kann die Menschen selbst zum Duft machen. „Mit wohlgefälligem Duft“ erhält die kultische Bildsprache und die syntaktische Beziehung besser.
  - severity: low
    issue: „durch euch“ legt בָכֶם bei וְנִקְדַּשְׁתִּי zu eng instrumental aus.
    rationale: Die Präposition kann je nach Kontext auch „an euch“ bzw. „unter euch“ bedeuten. „An euch“ ist im Deutschen natürlich und lässt die Aussage offen, dass Gott seine Heiligkeit in seinem Handeln an dem gesammelten Volk vor den Nationen erweist.
  revised_text: Mit wohlgefälligem Duft werde ich euch annehmen, wenn ich euch aus den Völkern herausführe und euch aus den Ländern sammle, in die ihr zerstreut worden seid; und ich werde mich an euch vor den Augen der Nationen als heilig erweisen.
