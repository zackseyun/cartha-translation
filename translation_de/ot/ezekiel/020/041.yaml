  text: בְּ/רֵ֣יחַ נִיחֹחַ֮ אֶרְצֶ֣ה אֶתְ/כֶם֒ בְּ/הוֹצִיאִ֤/י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצֹתֶ֖ם בָּ֑/ם וְ/נִקְדַּשְׁתִּ֥י בָ/כֶ֖ם לְ/עֵינֵ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/041.yaml
  text: I will accept you like a pleasing aroma when I bring you out from the peoples and gather you from the lands where you have been scattered, and I will show myself holy through you before the eyes of the nations.
translation:
  language: de
  text: Mit wohlgefälligem Duft werde ich euch annehmen, wenn ich euch aus den Völkern herausführe und euch aus den Ländern sammle, in die ihr zerstreut worden seid; und ich werde mich an euch vor den Augen der Nationen als heilig erweisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֵיחַ נִיחֹחַ
  choice: Als wohlgefälligen Duft
  rationale: Die kultische Wendung bezeichnet einen Duft, der Wohlgefallen hervorruft. „Wohlgefälliger Duft“ bewahrt das Opferbild und klingt im modernen Deutschen würdig und verständlich.
- source_word: אֶרְצֶה אֶתְכֶם
  choice: werde ich euch annehmen
  rationale: רצה bezeichnet hier das gnädige beziehungsweise wohlgefällige Annehmen; die Formulierung hält den unmittelbaren Personenbezug fest.
- source_word: בְּהוֹצִיאִי
  choice: wenn ich euch ... herausführe
  rationale: 'Die temporale Wiedergabe des Infinitivs mit ב passt zum Zusammenhang: Gottes Annahme zeigt sich im Herausführen und Sammeln.'
- source_word: וְנִקְדַּשְׁתִּי בָכֶם
  choice: So werde ich mich durch euch ... als heilig erweisen
  rationale: 'Der Nifal von קדש ist selbstbezogen: Gott erweist beziehungsweise offenbart sich als heilig. בָכֶם kann instrumentale Bedeutung haben, „durch euch“, was auch der öffentlichen Wahrnehmung durch die Nationen entspricht.'
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: vor den Augen der Nationen
  rationale: Die bildhafte und öffentliche Dimension der hebräischen Wendung wird formal bewahrt.
theological_decisions:
- issue: Wie Gott in beziehungsweise durch Israel geheiligt wird
  choice: durch euch
  alternative: an euch / unter euch
  rationale: Die Präposition ב ist mehrdeutig. „Durch euch“ bewahrt die Aussage, dass Gottes Heiligkeit vermittels seines Handelns an seinem gesammelten Volk vor den Nationen sichtbar wird, ohne Israel zur Quelle dieser Heiligkeit zu machen.
- issue: Verhältnis von Annahme und Opferduft
  choice: Als wohlgefälligen Duft werde ich euch annehmen
  alternative: Wegen des wohlgefälligen Duftes werde ich euch annehmen
  rationale: Die knappe hebräische Konstruktion verbindet die Annahme der Menschen mit dem kultischen Duftbild. Die gewählte Wiedergabe vermeidet die zusätzliche Behauptung, ein bestimmtes Opfer sei ausdrücklich der Grund ihrer Annahme.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kultische Bild bleibt sichtbar; „Nationen“ gibt גויים sachlich wieder und vermeidet die heute missverständliche Bezeichnung „Heiden“.
