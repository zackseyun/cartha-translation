  text: לָ/כֵ֞ן דַּבֵּ֨ר אֶל בֵּ֤ית יִשְׂרָאֵל֙ בֶּן אָדָ֔ם וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה ע֗וֹד זֹ֚את גִּדְּפ֤וּ אוֹתִ/י֙ אֲב֣וֹתֵי/כֶ֔ם בְּ/מַעֲלָ֥/ם בִּ֖/י מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
translation:
  language: de
  text: 'Darum rede zum Haus Israel, Menschensohn, und sage zu ihnen: »So spricht der Herr Yahweh: Auch darin haben eure Väter mich gelästert[a], indem sie mir die Treue brachen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mich geschmäht« oder »mich verächtlich behandelt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »indem sie treulos gegen mich handelten« oder »indem sie mir gegenüber einen Treuebruch begingen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt den folgernden Anschluss an den vorausgehenden Gedankengang knapp und natürlich wieder.
- source_word: דַּבֵּר אֶל בֵּית יִשְׂרָאֵל
  choice: rede zum Haus Israel
  rationale: Bewahrt die prophetische Anredeformel und den kollektiven Bundesausdruck »Haus Israel«.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die in Ezechiel wiederkehrende, wörtlich geprägte Anrede, ohne sie hier christologisch auszudeuten.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahweh
  rationale: Gibt die Botenformel idiomatisch wieder und lässt den in der Vorlage ausdrücklich stehenden Gottesnamen erkennbar.
- source_word: עוֹד זֹאת
  choice: Auch darin
  rationale: Bewahrt sowohl die additive Bedeutung von עוֹד als auch den rück- beziehungsweise vorausweisenden Bezug des Demonstrativums זֹאת.
- source_word: גִּדְּפוּ אוֹתִי
  choice: haben eure Väter mich gelästert
  rationale: »Lästern« erfasst den schweren, gegen Gott gerichteten Affront; andere Nuancen wie Schmähung oder Verachtung bleiben in der Fußnote sichtbar.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Väter
  rationale: Entspricht dem maskulinen Verwandtschaftsbegriff der Vorlage und bewahrt dessen familiäre Ausdrucksweise.
- source_word: בְּמַעֲלָם בִּי מָעַל
  choice: dass sie mir die Treue brachen
  rationale: Drückt den durch die hebräische Wortwiederholung hervorgehobenen Treuebruch in natürlichem Deutsch aus und erhält seine relationale beziehungsweise bundestheologische Spannung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der Herr
  rationale: Die gewählte Fassung unterscheidet אֲדֹנָי von dem ausdrücklich gesetzten Eigennamen יְהוָה und vermeidet, den Namen in einen Titel aufzulösen.
- issue: Wiedergabe von בֶּן אָדָם in Ezechiel
  choice: Menschensohn
  alternative: Menschenkind
  rationale: »Menschensohn« bewahrt die wiederkehrende Form der hebräischen Anrede. Der Kontext selbst, nicht die Übersetzung, bestimmt ihre Bedeutung hier.
- issue: Charakter von מַעַל
  choice: Treuebruch
  alternative: Untreue beziehungsweise Verrat
  rationale: Die Formulierung lässt den zwischenmenschlich und bundestheologisch gewichtigen Beziehungsbruch erkennen, ohne eine bestimmte konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Formel. »Rede« und »So spricht« halten den feierlichen Ton, während »mir die Treue brachen« den schwierigen hebräischen Stamm מעל verständlich wiedergibt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
