source:
  edition: WLC
  text: וְ/אֶת שַׁבְּתוֹתַ֖/י קַדֵּ֑שׁוּ וְ/הָי֤וּ לְ/אוֹת֙ בֵּינִ֣/י וּ/בֵֽינֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/020.yaml
  text: Keep my Sabbaths holy[a], and let them be a sign between me and you, so that you may know that I am Yahweh your God.
translation:
  language: de
  text: Haltet meine Sabbate heilig, und sie sollen ein Zeichen zwischen mir und euch sein, damit ihr erkennt, dass ich Jahwe, euer Gott, bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּתוֹתַי
  choice: meine Sabbate
  rationale: Der Plural mit Suffix der 1. Person Singular bezeichnet die wiederkehrenden Sabbattage als Gottes Sabbate; der Plural bleibt erhalten.
- source_word: קַדֵּשׁוּ
  choice: Haltet … heilig
  rationale: Der Piel-Imperativ fordert dazu auf, die Sabbate als heilig zu achten; „heilig halten“ ist im modernen Deutschen natürlich und sachlich genau.
- source_word: וְהָיוּ
  choice: und sie sollen … sein
  rationale: Die Verbform führt die Aufforderung mit einer sollenden beziehungsweise folgernden Nuance fort. „Sollen“ bewahrt diese Spannung besser als ein bloßes Futur.
- source_word: לְאוֹת
  choice: ein Zeichen
  rationale: אוֹת bezeichnet hier ein sichtbares Bundeszeichen beziehungsweise Erkennungszeichen.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: zwischen mir und euch
  rationale: Die feste relationale Wendung bezeichnet die wechselseitige Bundesbeziehung.
- source_word: לָדַעַת
  choice: damit ihr erkennt
  rationale: Der Infinitiv mit לְ drückt den Zweck aus. „Erkennen“ gibt neben dem Wissen auch den relationalen Sinn im Kontext angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen stehende Eigenname sichtbar bleibt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: אֱלֹהִים bezeichnet hier trotz seiner pluralischen Form den einen Gott Israels; das Suffix markiert die Bundesbeziehung zu den Angeredeten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Sabbate als Zeichen
  choice: ein Zeichen zwischen mir und euch
  alternative: ein Bundeszeichen
  rationale: „Bundeszeichen“ wäre kontextuell erklärend, doch der hebräische Text sagt lediglich אוֹת, „Zeichen“. Die Übersetzung vermeidet daher eine ausdrückliche Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, klingt aber natürlich. „Sabbate“ bewahrt den markanten Plural; „erkennt“ trägt dem relationalen Erkenntnissinn Rechnung.
