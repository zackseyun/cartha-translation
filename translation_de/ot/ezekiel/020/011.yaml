source:
  edition: WLC
  text: וָ/אֶתֵּ֤ן לָ/הֶם֙ אֶת חֻקּוֹתַ֔/י וְ/אֶת מִשְׁפָּטַ֖/י הוֹדַ֣עְתִּי אוֹתָ֑/ם אֲשֶׁ֨ר יַעֲשֶׂ֥ה אוֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֥י בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/011.yaml
  text: I gave them my statutes[a], and I made my judgments known to them, which, if a man does them, he will live by them.
translation:
  language: de
  text: Ich gab ihnen meine Satzungen und machte ihnen meine Rechtsbestimmungen bekannt. Wenn ein Mensch[a] sie befolgt, wird er durch sie leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Mensch“; die hebräische Einzahl steht hier stellvertretend für Menschen allgemein.'
    reason: Die repräsentative Bedeutung des hebräischen הָאָדָם wird erläutert, während der Haupttext natürliches modernes Deutsch verwendet.
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Ich gab
  rationale: נתן bezeichnet hier schlicht das Geben bzw. Bereitstellen der göttlichen Satzungen.
- source_word: חֻקּוֹתַי
  choice: meine Satzungen
  rationale: חֻקִּים meint festgesetzte Vorschriften; „Satzungen“ wahrt den rechtlich-bundestheologischen Ton.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Ordnungen. „Rechtsbestimmungen“ unterscheidet den Ausdruck von חֻקּוֹת und ist im modernen Deutsch verständlicher als „Rechtssprüche“.
- source_word: הוֹדַעְתִּי אוֹתָם
  choice: machte ihnen … bekannt
  rationale: Der Hifil von ידע bedeutet „wissen lassen/bekannt machen“; die Formulierung bleibt näher am Ausgangstext als das stärker deutende „lehrte sie“.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם
  choice: Wenn … sie befolgt
  rationale: Das Tun der Vorschriften wird im Deutschen idiomatisch mit „befolgen“ wiedergegeben. Die Wenn-Konstruktion macht die im Zusammenhang liegende Bedingung klar, ohne ihren theologischen Umfang festzulegen.
- source_word: הָאָדָם
  choice: ein Mensch
  rationale: Der bestimmte Singular „der Mensch“ hat hier repräsentative, allgemeine Bedeutung. „Ein Mensch“ gibt diese generische Aussage natürlich und geschlechtsübergreifend wieder.
- source_word: וָחַי בָּהֶם
  choice: wird er durch sie leben
  rationale: „Durch sie“ bewahrt die mögliche instrumentale Bedeutung von ב und lässt offen, welche zeitliche, gemeinschaftliche oder eschatologische Dimension dieses Leben hat.
theological_decisions:
- issue: Bedeutungsumfang des Lebens aufgrund des Befolgens der Gebote
  choice: Die offene Formulierung „wird er durch sie leben“ bleibt erhalten.
  alternative: Das Leben ausdrücklich als irdisches Wohlergehen, Leben im Bund oder ewiges Leben bestimmen.
  rationale: Der Vers selbst legt den vollen Umfang des verheißenen Lebens nicht fest. Die Übersetzung soll die Spannung zwischen zeitlicher, gemeinschaftlicher und eschatologischer Deutung nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Klang. „Satzungen“ und „Rechtsbestimmungen“ halten die beiden hebräischen Rechtsbegriffe auseinander; der zweite Satz vermeidet schwerfällige Relativsatzsyntax.
