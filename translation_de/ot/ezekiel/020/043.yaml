  source_fidelity: Die Übersetzung gibt die Zukunftsaussage, den Rückblick auf »Wege« und »Taten«, die durch diese bewirkte Verunreinigung sowie den starken Selbstabscheu zutreffend wieder. Die kausale Wiedergabe von בְּכָל ist angemessen. Die Formulierung »vor euch selbst ekeln« bildet בִּפְנֵיכֶם jedoch weder idiomatisch noch semantisch so klar ab wie eine Formulierung mit Selbstverabscheuung; die idiomatische Nuance »in euren eigenen Augen« sollte in der Anmerkung kenntlich sein.
  naturalness: »Sich vor sich selbst ekeln« ist im modernen Standarddeutsch deutlich weniger natürlich als »sich selbst verabscheuen« bzw. »Abscheu vor sich selbst empfinden«. Außerdem ist »sich unrein machen« zwar verständlich, aber gegenüber dem kultisch-moralisch tragfähigen »sich verunreinigen« weniger präzise.
  terminology: »Wege« und »Taten« erhalten die Unterscheidung von Lebenswandel und einzelnen Handlungen. »Verunreinigt« wahrt die kultisch-moralische Bedeutungsbreite von נטמא. »Verabscheuen« gibt die starke Bedeutung von קוט angemessen wieder, ohne über den Text hinauszugehen.
