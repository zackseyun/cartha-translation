revisions:
- from: Dort werdet ihr euch an eure Wege und an all eure Taten erinnern, durch die ihr euch unrein gemacht habt. Und ihr werdet euch vor euch selbst ekeln[a] wegen all der bösen Dinge, die ihr getan habt.
  to: Dort werdet ihr euch an eure Wege und an alle eure Taten erinnern, durch die ihr euch verunreinigt habt. Und ihr werdet euch selbst verabscheuen[a] wegen all des Bösen, das ihr getan habt.
  rationale: Die Revision ersetzt die unidiomatische Wendung »vor euch selbst ekeln« durch eine natürliche, starke Wiedergabe von קוט und hält die Nuance von בִּפְנֵיכֶם in der Fußnote fest. »Verunreinigt« präzisiert die kultisch-moralische Sprache des hebräischen Verbs. »All des Bösen« gibt die umfassende Pluralform רָעוֹת idiomatisch wieder, ohne die Aussage zu verändern.
