base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/043.yaml
  text: There you will remember your ways and all your deeds by which you defiled yourselves[b][a], and you will loathe yourselves in your own sight for all the evils that you have done.
translation:
  language: de
  text: Dort werdet ihr euch an eure Wege und an alle eure Taten erinnern, durch die ihr euch verunreinigt habt. Und ihr werdet euch selbst verabscheuen[a] wegen all des Bösen, das ihr getan habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor euren Gesichtern«; gemeint ist: »in euren eigenen Augen«. Oder: »ihr werdet Abscheu vor euch selbst empfinden«. Das hebräische Verb bezeichnet starken Selbstabscheu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכַרְתֶּם שָׁם
  choice: Dort werdet ihr euch erinnern
  rationale: Die Verbform bezeichnet im prophetischen Zusammenhang ein zukünftiges Erinnern; שָׁם verweist auf den zuvor genannten Ort der Wiederherstellung.
- source_word: דַּרְכֵיכֶם
  choice: eure Wege
  rationale: Bewahrt das hebräische Bild für Lebensführung und Verhalten, das auch im modernen Deutschen verständlich ist.
- source_word: עֲלִילוֹתֵיכֶם
  choice: all eure Taten
  rationale: Bezeichnet konkrete Handlungen und bleibt von den umfassenderen »Wegen« unterscheidbar.
- source_word: אֲשֶׁר נִטְמֵאתֶם בָּם
  choice: durch die ihr euch unrein gemacht habt
  rationale: Das Niphal von טמא kann das Unreinwerden bezeichnen; die reflexive deutsche Form gibt im moralischen Zusammenhang die eigene Beteiligung wieder, während »unrein« die kultisch-moralische Bedeutungsbreite wahrt.
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: ihr werdet euch vor euch selbst ekeln
  rationale: קוט drückt starken Abscheu aus. בִּפְנֵיכֶם bedeutet wörtlich »vor euren Gesichtern«; »vor euch selbst« bewahrt diese ungewöhnliche Perspektive natürlicher als eine rein deutende Wiedergabe.
- source_word: בְּכָל רָעוֹתֵיכֶם אֲשֶׁר עֲשִׂיתֶם
  choice: wegen all der bösen Dinge, die ihr getan habt
  rationale: Die Präposition wird kausal verstanden. רָעוֹת bezeichnet hier böse Taten beziehungsweise Übel; die Formulierung vermeidet die schwerfällige Wiederholung von »Taten«.
theological_decisions:
- issue: Art der Reaktion Israels nach der Wiederherstellung
  choice: Starker Selbstabscheu angesichts der eigenen früheren Sünden
  alternative: Bloßes Bedauern oder allgemeine Scham
  rationale: Die starke Bedeutung von קוט und das Erinnern an die verunreinigenden Taten sprechen für tiefen moralischen Abscheu. Eine weitergehende dogmatische Deutung wird nicht in den Text eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wegmetapher bleibt erhalten; »unrein gemacht« wahrt die kultisch-moralische Spannung. Die ungewöhnliche Wendung »vor euch selbst« lehnt sich an das wörtliche »vor euren Gesichtern« an und wird durch eine Fußnote zur Stärke des Verbs ergänzt.
