    rationale: Während das Hebräische im Hifil eindeutig eine Veranlassung ausdrückt, kann »jemanden gehen lassen« bedeuten, ihn nicht aufzuhalten. »Hindurchführen« macht die verursachende bzw. führende Handlung deutlich und bleibt im Bildfeld des unter dem Stab Vorbeiziehens.
  revised_text: Ich werde euch unter dem Stab hindurchführen[a] und euch in die Bindung des Bundes[b] bringen.
