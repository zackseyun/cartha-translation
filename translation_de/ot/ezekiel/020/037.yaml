source:
  edition: WLC
  text: וְ/הַעֲבַרְתִּ֥י אֶתְ/כֶ֖ם תַּ֣חַת הַ/שָּׁ֑בֶט וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם בְּ/מָסֹ֥רֶת הַ/בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/037.yaml
  text: I will make you pass under the rod[b][a], and I will bring you into the bond of the covenant.
translation:
  language: de
  text: Ich werde euch unter dem Stab hindurchführen[a] und euch in die Bindung des Bundes[b] bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild vom Hindurchgehen unter dem Stab erinnert wahrscheinlich daran, wie eine Herde beim Vorbeiziehen unter dem Hirtenstab gezählt oder geprüft wurde.
    reason: cultural_note
  - marker: b
    text: 'Oder: »in die Fessel / Verpflichtung des Bundes«. Das hier mit »Bindung« wiedergegebene hebräische Wort ist selten und vermittelt den Gedanken, im Verhältnis zum Bund gebunden oder verpflichtet zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: Ich werde ... hindurchgehen lassen
  rationale: Der Hifil von עבר ist kausativ. Die Formulierung gibt diese Bedeutung natürlich wieder und passt zum Bild einer Herde, die unter dem Stab hindurchgeht.
- source_word: תַּחַת הַשָּׁבֶט
  choice: unter dem Stab
  rationale: שֵׁבֶט kann »Stab«, »Stock« oder »Zepter« bedeuten. Im Zusammenhang liegt der Hirtenstab nahe, unter dem Tiere zur Zählung oder Prüfung hindurchgeführt wurden.
- source_word: וְהֵבֵאתִי
  choice: und ... bringen
  rationale: Der Hifil von בוא bedeutet gewöhnlich »bringen«; die Wiedergabe erhält außerdem den Parallelismus zum ersten Satzteil.
- source_word: בְּמָסֹרֶת
  choice: in die Bindung
  rationale: Das seltene מָסֹרֶת bezeichnet wahrscheinlich etwas Bindendes oder eine Fessel. »Bindung« bewahrt sowohl das Bild des Gebundenseins als auch den Bezug auf die Verpflichtung des Bundes, ohne zwischen beiden fest zu entscheiden.
- source_word: הַבְּרִית
  choice: des Bundes
  rationale: בְּרִית ist der übliche hebräische Ausdruck für einen Bund und behält hier seine etablierte theologische Bedeutung.
theological_decisions:
- issue: Bedeutung des Bildes von Prüfung und Bundesbindung
  choice: Der Text stellt Gottes souveräne Prüfung des Volkes und dessen bindende Unterstellung unter den Bund dar, ohne den Akzent eindeutig auf Strafe oder Wiederherstellung zu legen.
  alternative: Vorwiegend strafende Einschränkung oder vorwiegend wiederherstellende Aufnahme in die Bundesgemeinschaft.
  rationale: Das Hindurchgehen unter dem Stab kann Zählung und Prüfung ausdrücken; die Bindung des Bundes kann sowohl verpflichtende Begrenzung als auch erneuerte Zugehörigkeit bezeichnen. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hindurchgehen lassen« erhält die kausative Verbform; »Bindung des Bundes« lässt die ungewöhnliche und mehrdeutige Metapher bewusst stehen. Die Fußnotenmarker folgen ihrer Reihenfolge im deutschen Haupttext.
