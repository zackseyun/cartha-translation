  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפוֹצֹתֶ֖ם בָּ֑/ם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/חֵמָ֖ה שְׁפוּכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/034.yaml
  text: I will bring you out from the peoples and gather you from the lands where you have been scattered[c][b][a], with a strong hand and an outstretched arm and with wrath poured out.
translation:
  language: de
  text: Ich werde euch aus den Völkern herausführen und euch aus den Ländern sammeln, in denen ihr zerstreut worden seid, mit starker Hand und ausgestrecktem Arm und mit ausgegossenem Zorn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Ich werde ... herausführen
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszuführen bzw. herauszubringen. „Herausführen“ ist natürliches Deutsch und bewahrt den Anklang an den Exodus.
- source_word: הָעַמִּים
  choice: den Völkern
  rationale: עַמִּים bezeichnet hier die verschiedenen Völker, unter denen Israel zerstreut ist. „Völker“ ist im Deutschen präziser und idiomatischer als „Nationen“.
- source_word: וְקִבַּצְתִּי
  choice: und ... sammeln
  rationale: קבץ ist das übliche Verb für die Sammlung Zerstreuter und Exilierter. „Sammeln“ bewahrt diesen vertrauten biblischen Sinn.
- source_word: הָאֲרָצוֹת
  choice: den Ländern
  rationale: Der Plural אֲרָצוֹת meint die verschiedenen Gebiete oder Länder der Zerstreuung; „Länder“ gibt den geografischen Sinn natürlich wieder.
- source_word: אֲשֶׁר נְפוֹצֹתֶם בָּם
  choice: in die ihr zerstreut worden seid
  rationale: 'Das Niphal von פוץ ist passiv: „zerstreut werden“. Wegen der Bewegungsverben „herausführen“ und „sammeln“ gibt das deutsche „in die“ das Ziel der vorausgegangenen Zerstreuung idiomatisch wieder.'
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Dies entspricht dem Wortlaut und erhält zugleich die Exodusformel. „Mit mächtiger Hand“ wäre traditionell möglich, ist aber weniger unmittelbar.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: und ausgestrecktem Arm
  rationale: „Ausgestreckter Arm“ ist die sachlich genaue und im Deutschen etablierte Wiedergabe der festen biblischen Wendung.
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: und mit ausgegossenem Zorn
  rationale: חֵמָה bezeichnet heftigen Zorn; das Partizip שְׁפוּכָה beschreibt ihn als ausgegossen. Die Formulierung bewahrt das eindringliche Gerichtsbild.
theological_decisions:
- issue: Exodusbild in einem Zusammenhang von Sammlung und Gericht
  choice: Die Exodusformel „mit starker Hand und ausgestrecktem Arm“ sowie „mit ausgegossenem Zorn“ werden beide ungemildert beibehalten.
  alternative: Die Aussage als reine Rettung zu formulieren oder den Gerichtscharakter durch eine mildere Wiedergabe von חֵמָה abzuschwächen.
  rationale: Der Vers verbindet die Sammlung Israels bewusst mit machtvollem göttlichem Gericht. Die Übersetzung darf diese Spannung zwischen Wiederherstellung und Zorn nicht einseitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Abfolge, bleibt aber flüssig. Die wiederholte Präposition „mit“ strukturiert die drei machtvollen Begleitumstände klar; vor „ausgestrecktem Arm“ wird sie im Deutschen idiomatisch nicht wiederholt.
