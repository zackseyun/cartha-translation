base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/026.yaml
  text: And I defiled them through their gifts[a], by making every firstborn pass through the fire, so that I might devastate them[d][c][b], so that they might know that I am Yahweh.
translation:
  language: de
  text: Und ich machte sie durch ihre Gaben unrein, indem sie jeden Erstgeborenen hindurchziehen ließen[a], damit ich sie verwüste[b], damit sie erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeden, der den Mutterschoß öffnet“. Gemeint ist jeder Erstgeborene. Das „Hindurchziehenlassen“ bezeichnet einen Ritus, der hier wahrscheinlich auf Kinderopfer anspielt; „Feuer“ wird in diesem Vers jedoch nicht ausdrücklich genannt. Der hebräische Infinitiv nennt sein Subjekt nicht ausdrücklich und kann syntaktisch auch auf Gottes Handeln bezogen werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit ich sie in Schrecken versetze“ beziehungsweise „damit ich sie veröden lasse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲטַמֵּא
  choice: Und ich machte sie … unrein
  rationale: Der Hifil von טמא bezeichnet hier ein Verunreinigen beziehungsweise Unreinmachen. Die Formulierung bewahrt die ausdrücklich erste Person und die kultisch-moralische Bedeutung, ohne die göttliche Wirksamkeit abzuschwächen.
- source_word: בְּמַתְּנוֹתָם
  choice: durch ihre Gaben
  rationale: מַתָּנוֹת bedeutet wörtlich „Gaben“ und kann im kultischen Zusammenhang Opfergaben bezeichnen. „Durch“ gibt das instrumentale בְּ wieder.
- source_word: בְּהַעֲבִיר כָּל פֶּטֶר רָחַם
  choice: indem sie jeden Erstgeborenen hindurchgehen ließen
  rationale: פֶּטֶר רָחַם ist die feste Wendung für den Erstgeborenen, wörtlich „jeder, der den Mutterschoß öffnet“. הַעֲבִיר bezeichnet ein Hindurchgehenlassen in einem kultischen Ritus. Da „Feuer“ in diesem Vers nicht ausdrücklich steht, wird es nicht in den Haupttext eingefügt.
- source_word: לְמַעַן אֲשִׁמֵּם
  choice: damit ich sie verwüstete
  rationale: Der Hifil von שמם kann „verwüsten“, „veröden lassen“ oder „entsetzen“ bedeuten. „Verwüstete“ bewahrt die zerstörerische Gerichtsbedeutung, ohne die mögliche emotionale Bedeutung als einziges Verständnis festzulegen.
- source_word: לְמַעַן אֲשֶׁר יֵדְעוּ
  choice: damit sie erkannten
  rationale: Die Formulierung gibt die für Ezechiel typische Erkenntnisformel und ihren Zweckcharakter natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Göttliches Handeln bei Israels Verunreinigung
  choice: Die direkte Aussage „ich machte sie … unrein“ bleibt bestehen.
  alternative: „Ich überließ sie der Unreinheit“ oder eine rein zulassende Umschreibung.
  rationale: Der hebräische Text spricht in der ersten Person mit einer kausativen Verbform. Diese theologische Spannung darf nicht durch eine abschwächende Paraphrase aufgelöst werden.
- issue: Subjekt des infinitivischen „Hindurchgehenlassens“
  choice: 'Im Haupttext wird das Volk als handelndes Subjekt verstanden: „indem sie … hindurchgehen ließen“.'
  alternative: 'Syntaktisch ist auch der Anschluss an Gottes Handeln möglich: „indem ich … hindurchgehen ließ“.'
  rationale: Der unmittelbare kultische Zusammenhang der „Gaben“ und der sonstige Gebrauch der Wendung bei Ezechiel sprechen für das Handeln der Israeliten; da der Infinitiv selbst kein ausdrückliches Subjekt nennt, wird die andere syntaktische Möglichkeit in der Fußnote offengehalten.
- issue: Bezug auf das Erstgeborenenritual
  choice: Der Haupttext sagt „jeden Erstgeborenen hindurchgehen ließen“, ohne „durch das Feuer“ ausdrücklich einzufügen.
  alternative: „jeden Erstgeborenen durch das Feuer gehen ließen“ beziehungsweise ausdrücklich „opferten“.
  rationale: Der Zusammenhang weist wahrscheinlich auf ein mit Kinderopfern verbundenes Ritual, doch das Wort „Feuer“ steht in diesem Vers nicht. Der Haupttext wahrt daher die Quellennähe, während die Fußnote den kulturellen Bezug erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält die zweimalige Zweckangabe des Hebräischen fest. „Unrein machen“ bewahrt den kultischen Klang; „Gaben“ lässt den Opferkontext erkennen, ohne ihn lexikalisch zu überbestimmen.
