  terminology: „Rechtsbestimmungen“ wahrt den rechtlichen Charakter von מִשְׁפָּטִים; „Satzungen“ für חֻקּוֹת und „entweihten“ für חִלֵּלוּ sind passend. „Der Mensch“ gibt הָאָדָם als generischen bestimmten Singular angemessen wieder, ohne eine weitergehende theologische Deutung aufzuerlegen. Die Fußnotenanker sind sinnvoll gesetzt; Anmerkung b verweist sachlich auf das erkennbare Echo von 3. Mose 18,5.
