source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֣/י הַ/בָּנִ֗ים בְּ/חֻקּוֹתַ֣/י לֹֽא הָ֠לָכוּ וְ/אֶת מִשְׁפָּטַ֨/י לֹא שָׁמְר֜וּ לַ/עֲשׂ֣וֹת אוֹתָ֗/ם אֲשֶׁר֩ יַעֲשֶׂ֨ה אוֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֥וֹת אַפִּ֛/י בָּ֖/ם בַּ/מִּדְבָּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
translation:
  language: de
  text: Doch die Kinder lehnten sich gegen mich auf. Sie lebten nicht nach meinen Satzungen und hielten meine Rechtsbestimmungen nicht, um sie zu befolgen – Bestimmungen, durch die der Mensch leben wird, wenn er sie befolgt.[a][b] Meine Sabbate entweihten sie. Da sagte ich, ich würde meinen Zorn über sie ausgießen und meinen Grimm an ihnen in der Wüste vollends auslassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mensch“. Das hebräische „der Mensch“ ist eine generische Einzahl und meint einen Menschen unabhängig vom Geschlecht.'
    reason: lexical_alternative
  - marker: b
    text: Diese Aussage greift 3. Mose 18,5 auf.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: lehnten sich gegen mich auf
  rationale: מרה mit ב bezeichnet eine gegen Gott gerichtete Auflehnung. Die Formulierung bewahrt die Stärke und den Bundesbezug des Ausdrucks, ohne unnötig fremdsprachlich zu wirken.
- source_word: הַבָּנִים
  choice: die Kinder
  rationale: Wörtlich steht „die Söhne“; im Zusammenhang ist jedoch kollektiv die nachfolgende Generation Israels gemeint, nicht ausschließlich deren männliche Angehörige.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: Sie lebten nicht nach meinen Satzungen
  rationale: Das hebräische Bild des Gehens beschreibt die Lebensführung. „Nach meinen Satzungen leben“ gibt dieses Bundesidiom in natürlichem modernem Deutsch wieder.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier Gottes verbindliche rechtliche Anordnungen. „Rechtsbestimmungen“ wahrt den juridischen Sinn besser als das im Deutschen missverständliche „Gerichte“.
- source_word: לֹא שָׁמְרוּ לַעֲשׂוֹת אוֹתָם
  choice: hielten meine Rechtsbestimmungen nicht, um sie zu befolgen
  rationale: Die Verbindung von שׁמר mit dem Infinitiv עשׂה umfasst sowohl das Bewahren beziehungsweise Einhalten als auch die praktische Ausführung. Die deutsche Fassung lässt beide Aspekte erkennen.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם
  choice: Bestimmungen, durch die der Mensch, wenn er sie befolgt, leben wird
  rationale: Die konditionale Aussage und die Präposition ב („durch sie“) bleiben erhalten. „Befolgen“ ist bei Rechtsbestimmungen natürlicher als das formale „tun“ und gibt עשׂה sachgerecht wieder.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Der bestimmte Singular wird generisch für einen Menschen gebraucht. „Der Mensch“ bewahrt Numerus und Form, ohne die Aussage auf Männer zu beschränken.
- source_word: אֶת שַׁבְּתוֹתַי חִלֵּלוּ
  choice: Meine Sabbate entweihten sie
  rationale: חלל im Piel bedeutet, etwas Heiliges zu entweihen. Die vorangestellte Wortgruppe spiegelt die Hervorhebung im Hebräischen.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: meinen Zorn über sie ausgießen
  rationale: Die feste deutsche Wendung bewahrt sowohl das Bild des Ausgießens als auch die Intensität von חֵמָה.
- source_word: לְכַלּוֹת אַפִּי בָּם
  choice: meinen Grimm an ihnen vollends auslassen
  rationale: כלה mit אַף bezeichnet, den Grimm bis zu seinem vollen Ende beziehungsweise Ausmaß zur Wirkung kommen zu lassen. „Vollends auslassen“ ist idiomatisch und bewahrt diese Vollendungsnuance.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Im Exoduszusammenhang bezeichnet מִדְבָּר die Wüstenregion; „Wüste“ ist die natürliche und traditionsfähige deutsche Wiedergabe.
theological_decisions:
- issue: Generischer Gebrauch von הָאָדָם in der Aussage über Leben durch Gehorsam
  choice: der Mensch
  alternative: ein Mensch / wer sie befolgt
  rationale: Das Hebräische verwendet den bestimmten Singular generisch. „Der Mensch“ bewahrt diese Form und macht zugleich deutlich, dass die Aussage allgemein menschlich und nicht männlich-exklusiv ist.
- issue: Verhältnis von Befolgung und Leben
  choice: wenn er sie befolgt, leben wird
  alternative: sie tun soll und durch sie leben wird
  rationale: Die Formulierung gibt die im Hebräischen und in Levitikus 18,5 angelegte Verknüpfung wieder, ohne weiter zu bestimmen, ob „leben“ ausschließlich zeitliches, gemeinschaftliches oder umfassenderes Leben bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Archaisches „wandeln“ und das missverständliche „Gerichte“ wurden vermieden; zugleich bleiben die doppelte Aussage von Bewahren und Tun, die konditionale Lebensverheißung sowie die starke Sprache des göttlichen Zorns erkennbar.
