  source_fidelity: Der Hauptsatz gibt וְגַם, das betonte אֲנִי, נָתַתִּי sowie die beiden Rechtstermini sachgerecht wieder. Für לֹא יִחְיוּ בָּהֶם ist „würden nicht leben“ im Deutschen jedoch unnötig hypothetisch und weniger idiomatisch; „nicht leben konnten“ bringt die negative, resultative/modal verstandene Aussage klarer zum Ausdruck, ohne die theologische Spannung zu harmonisieren.
  naturalness: „Und auch ich selbst“ ist möglich und die rechtliche Diktion ist angemessen. „Durch die sie nicht leben konnten“ ist im modernen Standarddeutsch natürlicher als „durch die sie nicht leben würden“.
  terminology: „Satzungen“ und „Rechtsbestimmungen“ sind für חֻקִּים und מִשְׁפָּטִים ein stimmiges, unterscheidendes Begriffspaar. Die Fußnoten bewahren sowohl die mögliche gerichtliche Deutung als auch den Bezug auf 3. Mose 18,5, ohne ihn in den Haupttext einzutragen.
