source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ נָתַ֣תִּי לָ/הֶ֔ם חֻקִּ֖ים לֹ֣א טוֹבִ֑ים וּ/מִ֨שְׁפָּטִ֔ים לֹ֥א יִֽחְי֖וּ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/025.yaml
  text: Moreover[b][a], I myself gave them statutes that were not good and ordinances by which they could not live.
translation:
  language: de
  text: Und auch ich selbst gab ihnen Satzungen, die nicht gut waren, und Rechtsbestimmungen, durch die sie nicht leben konnten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutend: „Ich gab sie Satzungen preis, die nicht gut waren.“ So wird das Geben als Gerichtshandeln verstanden und nicht als Erlass moralisch mangelhafter Gesetze durch Gott.'
    reason: alternative_reading
  - marker: b
    text: Die Wendung „durch sie leben“ erinnert an die Aussage, dass der Mensch durch das Befolgen von Gottes Satzungen lebt (vgl. 3. Mose 18,5). Hier wird diese Wendung bewusst ins Gegenteil verkehrt.
    reason: cross_reference
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Bewahrt die additive und verstärkende Funktion der hebräischen Verbindung und knüpft unmittelbar an den vorherigen Gedankengang an.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen verstärkt das bereits in der Verbform enthaltene Subjekt.
- source_word: נָתַתִּי
  choice: gab
  rationale: Gibt die lexikalische Grundbedeutung von נתן direkt wieder, ohne die theologische Spannung durch eine interpretierende Abschwächung aufzulösen.
- source_word: חֻקִּים
  choice: Satzungen
  rationale: Ein geläufiger, würdevoller Ausdruck für verbindliche Festsetzungen im rechtlich-bundestheologischen Zusammenhang.
- source_word: לֹא טוֹבִים
  choice: die nicht gut waren
  rationale: Bewahrt die ausdrückliche Verneinung des Hebräischen; „schlecht“ wäre stärker und würde die Formulierung unnötig zuspitzen.
- source_word: וּמִשְׁפָּטִים
  choice: und Rechtsbestimmungen
  rationale: Erhält das rechtliche Register und unterscheidet מִשְׁפָּטִים angemessen von חֻקִּים.
- source_word: לֹא יִחְיוּ בָּהֶם
  choice: durch die sie nicht leben würden
  rationale: Bewahrt den instrumentalen Sinn der Präposition ב und den bewusst umgekehrten Bundesausdruck vom Leben durch die Gebote; der deutsche Konjunktiv gibt die resultative Aussage natürlich wieder.
theological_decisions:
- issue: Ob Gottes „Geben“ nicht guter Satzungen als bloßes Zulassen oder gerichtliches Preisgeben wiederzugeben ist
  choice: Die direkte Aussage „ich selbst gab ihnen“ bleibt im Haupttext erhalten.
  alternative: „Ich gab sie Satzungen preis, die nicht gut waren“ beziehungsweise „Ich ließ ihnen Satzungen, die nicht gut waren“.
  rationale: Der hebräische Text verwendet ausdrücklich נתן („geben“) mit Gott als Subjekt. Eine permissive oder gerichtliche Deutung ist im Kontext möglich, darf aber die lexikalisch direkte Aussage im Haupttext nicht ersetzen.
- issue: Verhältnis der Aussage zur andernorts bezeugten Güte von Gottes Gesetz
  choice: „nicht gut“ wird ohne harmonisierenden Zusatz übersetzt.
  alternative: Die Satzungen als fremde, götzendienerische Vorschriften oder als Mittel eines gerichtlichen Preisgebens erklären.
  rationale: Der Vers formuliert eine echte theologische Spannung. Die Übersetzung bewahrt sie, während mögliche kontextuelle Deutungen in einer Fußnote genannt werden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem rechtlichem Register. „Satzungen“ und „Rechtsbestimmungen“ bilden das hebräische Begriffspaar differenziert ab. Die Fußnotenmarker stehen unmittelbar nach dem vollständigen Satz, auf den beide Hinweise Bezug nehmen.
