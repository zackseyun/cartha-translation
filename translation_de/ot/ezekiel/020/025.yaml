- from: Und auch ich selbst gab ihnen Satzungen, die nicht gut waren, und Rechtsbestimmungen, durch die sie nicht leben würden.[a][b]
  to: Und auch ich selbst gab ihnen Satzungen, die nicht gut waren, und Rechtsbestimmungen, durch die sie nicht leben konnten.[a][b]
  rationale: Die einzige notwendige Änderung betrifft die Wiedergabe von לֹא יִחְיוּ בָּהֶם. „Nicht leben konnten“ formuliert im Deutschen die negative Ergebnis- beziehungsweise Möglichkeitsaussage natürlich und präzise. Die direkte Aussage, dass Gott ihnen diese Satzungen gab, bleibt unverändert; die alternative gerichtliche Deutung bleibt ausdrücklich auf die Fußnote beschränkt.
