source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/הֲבִיאִ֥/י אֶתְ/כֶ֖ם אֶל אַדְמַ֣ת יִשְׂרָאֵ֑ל אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לַ/אֲבֽוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/042.yaml
  text: Then you will know that I am Yahweh[a], when I bring you into the land of Israel, into the land that I lifted up my hand to give to your fathers.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich Jahwe bin, wenn ich euch in das Land Israel bringe, in das Land, das ich euren Vätern unter erhobener Hand zu geben zugesagt habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Land, für das ich meine Hand erhoben habe, um es euren Vätern zu geben“. Das Erheben der Hand ist eine Schwurgeste; gemeint ist: das Land, das ich euren Vätern zu geben geschworen habe.'
    reason: Die Fußnote bewahrt die konkrete hebräische Bildsprache und erklärt zugleich den idiomatischen Sinn der Schwurformel.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem ו hat im prophetischen Zusammenhang Zukunfts- und Folgesinn. „Dann“ macht den Zusammenhang mit dem zuvor angekündigten Handeln Gottes im Deutschen natürlich deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und behält so seine bundesbezogene Aussagekraft.
- source_word: בַּהֲבִיאִי
  choice: wenn ich euch … bringe
  rationale: Der Infinitivus constructus mit ב bezeichnet hier den Zeitpunkt beziehungsweise Umstand des Erkennens.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: das Land Israel
  rationale: אַדְמָה bezeichnet in diesem Wiederherstellungszusammenhang nicht bloß den Erdboden, sondern das Gebiet Israels.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist konkret das verheißene Land. Die Wiederholung bewahrt die Parallelität des Hebräischen.
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: mit erhobener Hand … geschworen hatte
  rationale: Das hebräische Bild bezeichnet eine Schwurgeste. Da „die Hand erheben“ allein im heutigen Deutschen den Eidsinn nicht zuverlässig vermittelt, verbindet die Wiedergabe das konkrete Bild mit seiner idiomatischen Bedeutung.
- source_word: לָתֵת אֹתָהּ
  choice: zu geben
  rationale: Der feminine Objektbezug gilt dem Land; ein zusätzliches Pronomen ist im Deutschen nicht erforderlich.
- source_word: לַאֲבוֹתֵיכֶם
  choice: euren Vätern
  rationale: Die Wiedergabe entspricht der konkreten Bezeichnung des hebräischen Textes; „Vorfahren“ wäre möglich, aber weniger formnah.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt dessen Charakter als offenbarter Bundesname.
- issue: Wiedergabe der Schwurformel נָשָׂאתִי אֶת־יָדִי
  choice: mit erhobener Hand … geschworen hatte
  alternative: meine Hand erhoben hatte
  rationale: Die deutsche Fassung bewahrt sowohl die Schwurgeste als auch deren Bedeutung. Eine rein wörtliche Wiedergabe könnte im heutigen Deutsch missverstanden werden, während „ich schwor“ allein das Bild beseitigen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „in das Land“ folgt der hebräischen Hervorhebung. „Erkennen“ wahrt gegenüber bloßem „wissen“ den Zusammenhang von Erfahrung und Anerkennung.
