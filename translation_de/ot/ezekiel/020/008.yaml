  to: Doch sie widersetzten sich mir und weigerten sich, auf mich zu hören. Keiner von ihnen warf die abscheulichen Dinge vor seinen Augen[a] weg oder gab die Götzen[b] Ägyptens auf. Da sagte ich, ich würde meinen Grimm über sie ausgießen, um meinen Zorn an ihnen zu Ende zu bringen, mitten im Land Ägypten.
