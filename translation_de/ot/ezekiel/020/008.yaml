  text: וַ/יַּמְרוּ בִ֗/י וְ/לֹ֤א אָבוּ֙ לִּ/שְׁמֹ֣עַ אֵלַ֔/י אִ֣ישׁ אֶת שִׁקּוּצֵ֤י עֵֽינֵי/הֶם֙ לֹ֣א הִשְׁלִ֔יכוּ וְ/אֶת גִּלּוּלֵ֥י מִצְרַ֖יִם לֹ֣א עָזָ֑בוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֤וֹת אַפִּ/י֙ בָּ/הֶ֔ם בְּ/ת֖וֹךְ אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/008.yaml
  text: But they rebelled against me and refused to listen to me. None of them cast away the detestable things before their eyes[a] or abandoned the idols[b] of Egypt. So I said that I would pour out my wrath on them, bringing my anger against them to its full measure in the midst of the land of Egypt.
translation:
  language: de
  text: Doch sie widersetzten sich mir und weigerten sich, auf mich zu hören. Keiner von ihnen warf die abscheulichen Dinge vor seinen Augen[a] weg oder gab die Götzen[b] Ägyptens auf. Da sagte ich, ich würde meinen Grimm über sie ausgießen, um meinen Zorn an ihnen zu Ende zu bringen, mitten im Land Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die abscheulichen Dinge ihrer Augen“. Das Hebräische kann sich auf abscheuliche Gegenstände vor ihren Augen beziehen und zugleich andeuten, dass ihr Blick begehrlich oder verehrend auf sie gerichtet war.'
    reason: alternative_reading
  - marker: b
    text: Das hier mit „Götzen“ wiedergegebene hebräische Wort ist bewusst verächtlich und lässt an etwas Schmutziges oder Widerwärtiges denken.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: sie widersetzten sich mir
  rationale: מרה mit ב bezeichnet bewusste Auflehnung gegen jemanden. „Sich widersetzen“ ist im modernen Deutschen natürlich und bewahrt die Schärfe des Ausdrucks.
- source_word: וְלֹא אָבוּ לִשְׁמֹעַ אֵלַי
  choice: sie weigerten sich, auf mich zu hören
  rationale: Die verneinte Willensäußerung bezeichnet nicht bloß unterbliebenes Hören, sondern bewusste Weigerung.
- source_word: אִישׁ
  choice: Keiner von ihnen
  rationale: אִישׁ wird hier distributiv gebraucht. „Keiner von ihnen“ gibt diesen Sinn präzise und idiomatisch wieder.
- source_word: שִׁקּוּצֵי עֵינֵיהֶם
  choice: die abscheulichen Dinge vor seinen Augen
  rationale: Die schwierige Genitivverbindung kann Gegenstände im Blickfeld bezeichnen und zugleich eine begehrliche oder kultische Fixierung andeuten. Die Hauptfassung bleibt bewusst zurückhaltend; die Mehrdeutigkeit wird in der Fußnote erläutert.
- source_word: הִשְׁלִיכוּ
  choice: warf ... weg
  rationale: Das Verb bezeichnet ein entschiedenes Wegwerfen beziehungsweise Verstoßen. „Wegwerfen“ ist kräftig und gegenwärtig.
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: die Götzen Ägyptens
  rationale: גִּלּוּלִים ist Hesekiels verächtliche Bezeichnung für Götzenbilder. „Götzen“ ist im Haupttext klar und trägt bereits eine negative Wertung; die besonders grobe Färbung des hebräischen Wortes wird angemerkt.
- source_word: עָזָבוּ
  choice: gab ... auf
  rationale: עזב bedeutet hier, die ägyptischen Götzen zu verlassen beziehungsweise ihnen zu entsagen. „Aufgeben“ passt natürlich zur fortgesetzten Bindung an sie.
- source_word: וָאֹמַר
  choice: Da sagte ich, ich würde
  rationale: Die Form führt die Erzählung zur göttlichen Reaktion weiter, ohne ausdrücklich festzulegen, ob es sich um hörbare Rede oder einen inneren Entschluss handelt.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: meinen Grimm über sie ausgießen
  rationale: Das Bild des Ausgießens wird bewahrt. „Grimm“ gibt die intensive Färbung von חֵמָה wieder und ermöglicht die Unterscheidung vom folgenden אַף.
- source_word: לְכַלּוֹת אַפִּי בָּהֶם
  choice: meinen Zorn an ihnen vollenden
  rationale: כלה bezeichnet das Zu-Ende-Führen. Die Formulierung wahrt die gerichtliche Vollendung des Zorns, statt sie auf bloßes emotionales Abreagieren zu reduzieren.
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: mitten im Land Ägypten
  rationale: „Mitten im“ bewahrt die räumliche Aussage von בְּתוֹךְ und die formelle geografische Wendung.
theological_decisions:
- issue: Anthropopathische Sprache über Gottes Gericht
  choice: „Grimm“ und „Zorn“ als zwei eng verwandte Ausdrücke beibehalten
  alternative: Beide Begriffe zu „Zorn“ vereinheitlichen oder zu „Strafe“ abschwächen
  rationale: Der hebräische Text verwendet חֵמָה und אַף unmittelbar nebeneinander und steigert damit die Aussage. Die Übersetzung bewahrt diese Spannung, ohne eine systematische Unterscheidung einzutragen, die der Vers selbst nicht erklärt.
- issue: Distributive Bedeutung des maskulinen Singulars אִישׁ
  choice: „Keiner von ihnen“
  alternative: „Kein Mann“ oder „Nicht einer“
  rationale: Der Singular bezieht sich verallgemeinernd auf jedes Mitglied der genannten Gruppe. „Keiner von ihnen“ bildet diese distributive Kraft im heutigen Standarddeutsch genau ab, ohne eine ausschließlich männliche Referenz zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Rede von „Grimm“ und „Zorn“ bleibt bewusst kräftig; „an ihnen vollenden“ erhält den Abschlussgedanken des Hebräischen. Archaische Formen wie „forschen“, „darob“ oder „inmitten des Landes“ werden vermieden.
