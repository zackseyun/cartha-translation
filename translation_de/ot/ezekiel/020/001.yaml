source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ית בַּֽ/חֲמִשִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ בָּ֧אוּ אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י יִשְׂרָאֵ֖ל לִ/דְרֹ֣שׁ אֶת יְהוָ֑ה וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/001.yaml
  text: And it happened in the seventh year[a], in the fifth month, on the tenth day of the month, that some of the elders of Israel came to inquire of Yahweh[b], and they sat before me.
translation:
  language: de
  text: Im siebten Jahr, im fünften Monat, am zehnten Tag des Monats kamen einige der Ältesten Israels, um Jahwe zu befragen[a], und sie setzten sich vor mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe zu suchen“ beziehungsweise „Jahwe um Auskunft zu bitten“. Gemeint ist hier wahrscheinlich das förmliche Einholen einer göttlichen Antwort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Im siebten Jahr … kamen
  rationale: Die hebräische Eröffnungsformel leitet einen datierten Erzählabschnitt ein. Im Deutschen lässt sie sich natürlich in die Zeitangabe und den Hauptsatz integrieren, ohne das altertümliche „Und es geschah“ zu erzwingen.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִית
  choice: im siebten Jahr
  rationale: Der Vers nennt nur das siebte Jahr; der wahrscheinlich vorausgesetzte Bezug auf Jojachins Verbannung wird nicht ergänzt.
- source_word: בַּחֲמִשִׁי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: im fünften Monat, am zehnten Tag des Monats
  rationale: Die förmliche hebräische Datumsangabe wird eng am Ausgangstext und zugleich in idiomatischem Deutsch wiedergegeben.
- source_word: בָּאוּ אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: kamen einige von den Ältesten Israels
  rationale: Das wörtliche „Männer aus den Ältesten Israels“ bezeichnet am ehesten eine nicht näher bestimmte Auswahl oder Abordnung aus dem Kreis der Ältesten. „Einige von den Ältesten“ gibt dies verständlich wieder, ohne die ganze Gruppe vorauszusetzen.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: um Jahwe zu befragen
  rationale: דרש bezeichnet hier das formelle Suchen einer göttlichen Auskunft, vermutlich durch den Propheten. „Befragen“ trifft diesen konkreten Zusammenhang besser als das allgemeinere „suchen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: וַיֵּשְׁבוּ לְפָנָי
  choice: und sie setzten sich vor mich
  rationale: Die Formulierung bezeichnet sowohl die körperliche Handlung als auch ihr förmliches Erscheinen vor dem Propheten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher Bezug des „siebten Jahres“
  choice: Den nicht ausdrücklich genannten Bezug offenlassen
  alternative: im siebten Jahr der Verbannung Jojachins
  rationale: Obwohl der Buchzusammenhang wahrscheinlich auf Jojachins Verbannung verweist, spezifiziert dieser Vers die Epoche nicht. Die Übersetzung ergänzt diese historische Deutung daher nicht.
- issue: Charakter der Handlung לדרש את־יהוה
  choice: Jahwe befragen
  alternative: Jahwe suchen
  rationale: Im erzählerischen Zusammenhang kommen Älteste zum Propheten, um eine göttliche Antwort einzuholen. Zugleich bleibt die breitere Bedeutung „suchen“ in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Eröffnungsformel ist syntaktisch in den deutschen Hauptsatz integriert. Die förmliche Datierung und das Sitzen vor dem Propheten bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
