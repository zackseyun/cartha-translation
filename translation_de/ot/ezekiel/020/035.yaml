  text: וְ/הֵבֵאתִ֣י אֶתְ/כֶ֔ם אֶל מִדְבַּ֖ר הָֽ/עַמִּ֑ים וְ/נִשְׁפַּטְתִּ֤י אִתְּ/כֶם֙ שָׁ֔ם פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/035.yaml
  text: I will bring you into the wilderness of the peoples[b][a], and there I will enter into judgment with you face to face.
translation:
  language: de
  text: Ich werde euch in die Wüste der Völker[a] bringen und dort von Angesicht zu Angesicht mit euch ins Gericht gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Wüste der Völker“ kann einen wüstenartigen Ort unter den Völkern bezeichnen, zu denen Israel zerstreut worden war.
    reason: cultural_note
  - marker: b
    text: 'Oder: „euch dort von Angesicht zu Angesicht richten“. Das hebräische Verb kann einfacher mit „richten“ wiedergegeben werden, bezeichnet hier aber auch das Eintreten in eine gerichtliche Auseinandersetzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Ich werde ... bringen
  rationale: Der Hifil von בוא bedeutet gewöhnlich „bringen“; die deutsche Zukunftsform gibt die angekündigte Handlung natürlich wieder.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Das Suffix bezeichnet das direkte Objekt in der 2. Person maskulin Plural.
- source_word: אֶל
  choice: in die
  rationale: Bei einer Zielangabe bezeichnet אֶל die Bewegung zu einem Ort hin; „in die Wüste“ ist im Deutschen idiomatisch und vermittelt das Hineinbringen.
- source_word: מִדְבַּר
  choice: Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, unbebautes Land. „Wüste“ ist die geläufige biblische Entsprechung und bewahrt den möglichen Anklang an den Exodus.
- source_word: הָעַמִּים
  choice: der Völker
  rationale: Der Plural von עַם wird präzise mit „Völker“ wiedergegeben; die ungewöhnliche Verbindung bleibt erhalten, statt deutend durch „unter den Völkern“ ersetzt zu werden.
- source_word: וְנִשְׁפַּטְתִּי אִתְּכֶם
  choice: mit euch ins Gericht gehen
  rationale: Der Nifal von שׁפט mit אֵת drückt hier einen direkten Rechtsstreit beziehungsweise ein gerichtliches Vorgehen gegen das Gegenüber aus. Die deutsche Wendung bewahrt diese forensische und relationale Nuance.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf die zuvor genannte Wüste.
- source_word: פָּנִים אֶל פָּנִים
  choice: von Angesicht zu Angesicht
  rationale: Die feste, würdevolle deutsche Wendung erhält das hebräische Bild und betont die unmittelbare persönliche Konfrontation.
theological_decisions:
- issue: Gerichtliche Nuance des göttlichen Handelns
  choice: mit euch ins Gericht gehen
  alternative: euch richten
  rationale: Die hebräische Konstruktion bezeichnet mehr als nur das Fällen eines Urteils und lässt an eine unmittelbare gerichtliche Auseinandersetzung denken. Die Übersetzung bewahrt den feierlichen Ton des Bundesgerichts, ohne ein modernes förmliches Verfahren vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „Wüste der Völker“ und das Bild „von Angesicht zu Angesicht“ bleiben erhalten; „ins Gericht gehen“ vermittelt die rechtliche Nuance in verständlicher, gehobener Sprache.
