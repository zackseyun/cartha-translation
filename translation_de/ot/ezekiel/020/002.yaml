lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Form führt das nächste Ereignis in der Erzählfolge ein. „Da kam“ gibt die geläufige prophetische Eingangsformel natürlich und knapp wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: In der festen Verbindung דְבַר יְהוָה bezeichnet der Ausdruck eine konkrete göttliche Mitteilung; „das Wort“ bewahrt zugleich die wiederkehrende Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Präposition mit dem Suffix der ersten Person Singular.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den Inhalt der folgenden Rede ein. Im heutigen Deutsch erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen; die Fußnote weist auf die traditionelle Wiedergabe hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Botenformel bleibt erkennbar; der Doppelpunkt gibt לֵאמֹר idiomatisch wieder. Das Leerzeichen vor dem Fußnotenmarker verbessert die Lesbarkeit.
