  text: וָ/אֹמַ֣ר אֲלֵ/הֶ֔ם מָ֣ה הַ/בָּמָ֔ה אֲשֶׁר אַתֶּ֥ם הַ/בָּאִ֖ים שָׁ֑ם וַ/יִּקָּרֵ֤א שְׁמָ/הּ֙ בָּמָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/029.yaml
  text: Then I said to them, ‘What is this high place where you are going?’ So its name is called Bamah to this day.
translation:
  language: de
  text: 'Ich sagte zu ihnen: »Was ist das für eine Kulthöhe, zu der ihr hingeht?« Und man nannte sie Bama; so heißt sie bis heute.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bama ist das hebräische Wort für »Kulthöhe«. Im Hebräischen besteht zudem ein Wortklang zwischen der Frage »Was ist die Kulthöhe …?« (mah habbama) und dem Namen Bama.
    reason: Die Namensgebung und das hebräische Wortspiel sind in deutscher Übersetzung sonst nur teilweise erkennbar.
lexical_decisions:
- source_word: הַבָּמָה (habbāmāh)
  choice: die Kulthöhe
  rationale: בָּמָה bezeichnet hier eine erhöhte Kultstätte. »Kulthöhe« ist im Deutschen verständlich und bewahrt den religiösen Bezug.
- source_word: הַבָּאִים שָׁם (habbāʾîm šām)
  choice: zu der ihr geht
  rationale: Wörtlich etwa »zu der ihr dorthin kommt«. Die gewählte Formulierung gibt die Zielbewegung natürlich wieder, ohne ein im Deutschen schwerfälliges »dorthin«.
- source_word: וַיִּקָּרֵא שְׁמָהּ בָּמָה (wayyiqqārēʾ šəmāh bāmāh)
  choice: Daher heißt sie … Bama
  rationale: Die idiomatische deutsche Benennung bewahrt den Ortsnamen und gibt die bis in die Gegenwart des Erzählers fortbestehende Bezeichnung wieder.
theological_decisions:
- issue: Bewertung der Kulthöhe
  choice: Keine zusätzliche ausdrückliche Verurteilung eingefügt
  alternative: Die Stätte als »heidnische« oder »verbotene« Kulthöhe bezeichnen
  rationale: Der weitere Kontext bewertet den Kult negativ, doch dieser Vers selbst formuliert eine Frage und eine Namensangabe. Die Übersetzung soll diese Spannung nicht durch zusätzliche Wertungen auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. »Was ist das für …?« gibt die hebräische Frage natürlich wieder; »bis heute« entspricht der geläufigen deutschen Form der Zeitangabe. Der Ortsname Bama bleibt transliteriert und wird in der Fußnote erklärt.
