  text: כַּ/אֲשֶׁ֤ר נִשְׁפַּ֨טְתִּי֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/מִדְבַּ֖ר אֶ֣רֶץ מִצְרָ֑יִם כֵּ֚ן אִשָּׁפֵ֣ט אִתְּ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/036.yaml
  text: Just as I entered into judgment with your fathers in the wilderness of the land of Egypt[a], so I will enter into judgment with you, declares the Lord GOD.
translation:
  language: de
  text: Wie ich mit euren Vorfahren in der Wüste des Landes Ägypten ins Gericht gegangen bin, so werde ich mit euch ins Gericht gehen, spricht der Herr Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ich eure Vorfahren in der Wüste des Landes Ägypten gerichtet habe, so werde ich euch richten, spricht der Herr Jahwe.“ Das hebräische Verb kann einfacher mit „richten“ wiedergegeben werden; „ins Gericht gehen“ hebt seine förmliche, rechtliche Nuance hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Wie ... so
  rationale: Die korrelative deutsche Wendung bildet den Vergleich zwischen dem früheren und dem künftigen Handeln Gottes klar und natürlich ab.
- source_word: נִשְׁפַּטְתִּי ... אִשָּׁפֵט
  choice: bin ... ins Gericht gegangen ... werde ... ins Gericht gehen
  rationale: Die feste Wendung bewahrt gegenüber dem schlichteren „richten“ die förmliche, rechtliche Nuance des Niphal und hält die Parallelität beider Verbformen aufrecht.
- source_word: אֶת אֲבוֹתֵיכֶם ... אִתְּכֶם
  choice: mit euren Vorfahren ... mit euch
  rationale: „Mit jemandem ins Gericht gehen“ entspricht dem hebräischen gerichtlichen Verhältnis, ohne das zweite Glied durch „gegen euch“ stärker adversativ festzulegen.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Vorfahren
  rationale: „Vorfahren“ ist im heutigen Standarddeutsch verständlicher und bezeichnet hier sachgerecht die frühere Exodusgeneration; „Väter“ bleibt als wörtlichere Alternative möglich.
- source_word: בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  choice: in der Wüste des Landes Ägypten
  rationale: Die Formulierung bewahrt sämtliche Bestandteile des ungewöhnlichen hebräischen Ausdrucks, ohne ihn geografisch zu vereinfachen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr, Jahwe
  rationale: „Spricht“ gibt die prophetische Botenformel idiomatisch wieder; „der Herr, Jahwe“ unterscheidet den Titel אֲדֹנָי vom ausdrücklich gesetzten Gottesnamen יהוה.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Form gibt sowohl den Herrschertitel als auch den Gottesnamen erkennbar wieder und vermeidet, den Eigennamen durch einen zweiten Titel zu ersetzen.
- issue: Gerichtliche Bedeutung der Niphalformen von שׁפט
  choice: mit jemandem ins Gericht gehen
  alternative: jemanden richten
  rationale: Die förmliche Rechtsnuance wird bewahrt, ohne näher zu bestimmen, ob der Schwerpunkt auf Verhandlung, Auseinandersetzung oder Urteil liegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Ortsangabe wird aus Quellentreue beibehalten. Die Wendung „ins Gericht gehen“ ist gehoben, aber allgemein verständlich und für die prophetische Gerichtssprache angemessen.
