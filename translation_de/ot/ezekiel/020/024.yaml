source:
  edition: WLC
  text: יַ֜עַן מִשְׁפָּטַ֤/י לֹֽא עָשׂוּ֙ וְ/חֻקּוֹתַ֣/י מָאָ֔סוּ וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וְ/אַחֲרֵי֙ גִּלּוּלֵ֣י אֲבוֹתָ֔/ם הָי֖וּ עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/024.yaml
  text: because they did not practice my judgments[a], and they rejected my statutes, and they profaned my Sabbaths, and their eyes were after the idols of their fathers.
translation:
  language: de
  text: weil sie meine Rechtsbestimmungen nicht befolgten, meine Satzungen verwarfen und meine Sabbate entweihten und ihre Augen auf die Götzen[a] ihrer Väter gerichtet waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist eine stark verächtliche Bezeichnung für Götzen; es kann auch mit „abscheuliche Götzen“ oder „Kotgötzen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: weil
  rationale: Die Konjunktion leitet den Grund für das zuvor angekündigte göttliche Handeln ein. „Weil“ gibt diese kausale Funktion im modernen Deutsch unmittelbar wieder.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּט bezeichnet hier verbindliche Rechtssätze des Bundes. „Rechtsbestimmungen“ bewahrt den rechtlichen Sinn und bleibt von חֻקּוֹתַי unterscheidbar.
- source_word: לֹא עָשׂוּ
  choice: nicht befolgten
  rationale: Bei rechtlichen Bestimmungen bezeichnet עשה deren praktische Ausführung. „Befolgen“ ist natürliches Deutsch und gibt den gemeinten Gehorsam präziser wieder als das wörtliche „tun“.
- source_word: חֻקּוֹתַי
  choice: meine Satzungen
  rationale: „Satzungen“ ist eine etablierte, verständliche Wiedergabe des bundesrechtlichen Begriffs und wahrt die begriffliche Unterscheidung zu מִשְׁפָּטַי.
- source_word: מָאָסוּ
  choice: verwarfen
  rationale: Das Verb bezeichnet bewusste Ablehnung oder Verwerfung. „Verwarfen“ erhält die entschiedene Aussage des Hebräischen.
- source_word: שַׁבְּתוֹתַי
  choice: meine Sabbate
  rationale: Der Plural bezieht sich auf die Israel gebotenen Sabbatfeiern. „Sabbate“ ist die direkte und im Deutschen geläufige Wiedergabe.
- source_word: חִלֵּלוּ
  choice: entweihten
  rationale: Im kultischen Zusammenhang bedeutet das Piel von חלל, etwas Heiliges als gemein zu behandeln. „Entweihten“ gibt diese Bedeutung klar und würdig wieder.
- source_word: הָיוּ עֵינֵיהֶם אַחֲרֵי
  choice: ihre Augen auf … gerichtet waren
  rationale: Die hebräische Wendung beschreibt die begehrende Ausrichtung auf etwas. Die deutsche Formulierung bewahrt das Bild der Augen, ohne die unnatürliche Konstruktion „ihre Augen waren hinter … her“ zu erzwingen.
- source_word: גִּלּוּלֵי
  choice: die Götzen
  rationale: „Götzen“ bezeichnet die falschen Kultbilder klar; die stark verächtliche Färbung des für Ezechiel typischen Ausdrucks wird in einer Fußnote kenntlich gemacht.
- source_word: אֲבוֹתָם
  choice: ihrer Väter
  rationale: Das Hebräische verwendet ausdrücklich das maskuline Verwandtschaftswort „Väter“. Die Übersetzung erhält diese konkrete Bezeichnung.
theological_decisions:
- issue: Verächtliche Färbung von גִּלּוּלִים
  choice: Götzen im Haupttext mit erläuternder Fußnote
  alternative: Scheusale; Kotgötzen; abscheuliche Götzen
  rationale: Der Ausdruck ist bewusst verächtlich und kann etymologisch beziehungsweise im Gebrauch an etwas Widerwärtiges oder Kotartiges anklingen. Eine stark ausdeutende Form im Haupttext könnte die genaue Nuance zu eng festlegen; die Fußnote bewahrt sie transparent.
- issue: Masculine Familienbezeichnung אֲבוֹתָם
  choice: ihrer Väter
  alternative: ihrer Vorfahren
  rationale: „Väter“ entspricht der konkreten maskulinen Form des Ausgangstextes. Eine Verallgemeinerung zu „Vorfahren“ ist hier für die Verständlichkeit nicht erforderlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Begründung vom vorausgehenden Kontext abhängig. Das wiederholte „und“ spiegelt die Reihung der Anklagepunkte; vor dem letzten Glied wird „weil“ zur syntaktischen Klarheit wiederholt. Der Fußnotenmarker steht unmittelbar bei dem tatsächlich erläuterten Wort „Götzen“.
