source:
  edition: WLC
  text: כִּ֣י בְ/הַר קָדְשִׁ֞/י בְּ/הַ֣ר מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה שָׁ֣ם יַעַבְדֻ֜/נִי כָּל בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖/ה בָּ/אָ֑רֶץ שָׁ֣ם אֶרְצֵ֔/ם וְ/שָׁ֞ם אֶדְר֣וֹשׁ אֶת תְּרוּמֹֽתֵי/כֶ֗ם וְ/אֶת רֵאשִׁ֛ית מַשְׂאוֹתֵי/כֶ֖ם בְּ/כָל קָדְשֵׁי/כֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/040.yaml
  text: For on my holy mountain[a], on the high mountain of Israel, declares the Lord GOD, there all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your contributions and the firstfruits of your offerings[c][b], with all your holy things.
translation:
  language: de
  text: Denn auf meinem heiligen Berg, auf Israels hohem Berg, wird mir das ganze Haus Israel, sie alle im Land, dienen – Ausspruch des Herrn Yahweh. Dort werde ich sie wohlgefällig annehmen, und dort werde ich eure Abgaben und die Erstlingsgaben unter euren Opfergaben[a] samt all euren heiligen Dingen[b] einfordern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Erste eurer Gaben“; der hebräische Ausdruck kann das Erste beziehungsweise den Anfang der dargebrachten Gaben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „samt all euren heiligen Gaben“; wörtlich steht ein weiter gefasster Ausdruck für alles, was geheiligt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְהַר קָדְשִׁי
  choice: auf meinem heiligen Berg
  rationale: Die Präposition בְ ist hier lokal zu verstehen; im Deutschen ist bei einem Berg „auf“ natürlich und bewahrt den kultischen Schauplatz.
- source_word: בְהַר מְרוֹם יִשְׂרָאֵל
  choice: auf Israels hohem Berg
  rationale: מְרוֹם bezeichnet Höhe oder Erhabenheit. Die Formulierung erhält den Parallelismus zum heiligen Berg.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: נְאֻם bezeichnet eine prophetische Ausspruchsformel. „Herr Yahweh“ gibt sowohl אֲדֹנָי als auch den Gottesnamen wieder, ohne die Doppelung „Herr HERR“.
- source_word: יַעַבְדֻנִי
  choice: wird mir dienen
  rationale: עבד umfasst hier kultischen Dienst und Anbetung. „dienen“ bewahrt den weiteren Bedeutungsumfang und passt zu den anschließend genannten Gaben.
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: das ganze Haus Israel, sie alle
  rationale: Die doppelte Totalitätsaussage des Hebräischen wird beibehalten und so ihre Betonung hörbar gemacht.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Der bestimmte Ausdruck bezeichnet in diesem Kontext das Land Israels und nicht allgemein irgendein Land.
- source_word: אֶרְצֵם
  choice: werde ich sie wohlgefällig annehmen
  rationale: רצה bezeichnet im kultischen und relationalen Zusammenhang ein günstiges, wohlgefälliges Annehmen. Die Ergänzung „wohlgefällig“ macht diese Nuance sichtbar.
- source_word: אֶדְרוֹשׁ
  choice: werde ich … einfordern
  rationale: דרש kann suchen, verlangen oder fordern bedeuten. Bei Gott zustehenden Gaben bringt „einfordern“ die Verbindlichkeit ohne unnötige Härte zum Ausdruck.
- source_word: תְּרוּמֹתֵיכֶם
  choice: eure Abgaben
  rationale: תְּרוּמָה bezeichnet einen für Gott ausgesonderten und dargebrachten Anteil. „Abgaben“ unterscheidet den Ausdruck von den folgenden מַשְׂאוֹת, ohne die technische Wendung „Hebopfer“ zu verwenden.
- source_word: רֵאשִׁית מַשְׂאוֹתֵיכֶם
  choice: das Erste eurer Gaben
  rationale: רֵאשִׁית bedeutet zunächst „Anfang/Erstes“ und kann kultisch Erstlingsgaben bezeichnen; מַשְׂאוֹת sind hier gebrachte beziehungsweise erhobene Gaben. Die Wiedergabe erhält die mögliche Mehrdeutigkeit zwischen dem ersten und dem besten Anteil.
- source_word: בְּכָל קָדְשֵׁיכֶם
  choice: samt all euren heiligen Dingen
  rationale: קָדְשֵׁיכֶם ist ein breiter Ausdruck für geheiligte beziehungsweise geweihte Dinge. Die Übersetzung verengt ihn nicht ausschließlich auf Opfergaben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Wiedergabe nennt den im hebräischen Text stehenden Eigennamen Yahweh und übersetzt zugleich den vorangehenden Titel אֲדֹנָי. Sie vermeidet eine schwer verständliche deutsche Doppelung.
- issue: Umfang von „ganz Israel“
  choice: das ganze Haus Israel, sie alle
  alternative: das Haus Israel
  rationale: Die emphatische Wiederholung כָּל … כֻּלֹּה wird nicht abgeschwächt. Zugleich wird nicht näher bestimmt, wie diese umfassende Aussage heilsgeschichtlich auszulegen ist.
- issue: Art der Annahme Israels
  choice: sie wohlgefällig annehmen
  alternative: Gefallen an ihnen haben
  rationale: 'Die Übersetzung hält die kultische und personale Spannung von רצה offen: Angenommen werden hier die Menschen, während der Zusammenhang zugleich von ihren heiligen Gaben spricht.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel ist durch Gedankenstriche abgesetzt. Der betonte Totalitätsausdruck und die kultische Begrifflichkeit bleiben erkennbar; seltene Fachwörter wie „Hebopfer“ werden im Haupttext vermieden.
