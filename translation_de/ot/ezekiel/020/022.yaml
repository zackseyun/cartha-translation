  text: וַ/הֲשִׁבֹ֨תִי֙ אֶת יָדִ֔/י וָ/אַ֖עַשׂ לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/022.yaml
  text: But I held back my hand[a], and I acted for the sake of my name, so that it would not be profaned in the sight of the nations[b], before whose eyes I had brought them out.
translation:
  language: de
  text: Doch ich hielt meine Hand zurück[a] und handelte um meines Namens willen, damit er vor den Augen der Völker nicht entweiht würde[b], vor deren Augen ich sie herausgeführt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Ich wandte meine Hand zurück“ oder „Ich zog meine Hand zurück.“ Die hebräische Wendung bezeichnet hier das Zurückhalten des angekündigten Gerichts.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um [ihn] nicht zu entweihen“; das unausgesprochene Objekt ist Gottes Name.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי אֶת־יָדִי
  choice: ich hielt meine Hand zurück
  rationale: Die Wendung bezeichnet wörtlich ein Zurückwenden der Hand und meint im Zusammenhang, dass Gott das angekündigte Gericht nicht vollstreckte. „Meine Hand zurückhalten“ bewahrt das Bild und drückt die Zurückhaltung im heutigen Deutsch natürlich aus.
- source_word: וָאַעַשׂ
  choice: und handelte
  rationale: עשה ist hier allgemein „tun/handeln“. „Handelte“ bleibt bewusst offen und bezieht sich auf Gottes Vorgehen um seines Namens willen, ohne zusätzliche Einzelheiten einzutragen.
- source_word: לְמַעַן שְׁמִי
  choice: um meines Namens willen
  rationale: Die Formulierung bewahrt „mein Name“ als gewichtige biblische Aussage über Gottes öffentlich wahrgenommene Ehre und gibt die Zweck- beziehungsweise Beweggrundangabe prägnant wieder.
- source_word: לְבִלְתִּי הֵחֵל
  choice: damit er … nicht entweiht würde
  rationale: חלל im Piel bedeutet „entweihen, profanieren“. Das im Hebräischen ausgelassene Objekt wird aus „mein Name“ erschlossen; das Pronomen „er“ macht diesen Bezug im Deutschen klar, ohne „mein Name“ unnötig zu wiederholen.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: vor den Augen der Völker
  rationale: Die bildhafte Orts- und Wahrnehmungsangabe wird direkt bewahrt. „Völker“ gibt גּוֹיִם hier natürlich wieder und unterstreicht den öffentlichen Charakter des Geschehens.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: vor deren Augen ich sie herausgeführt hatte
  rationale: Das Hifil von יצא bedeutet „herausführen“. Das Plusquamperfekt kennzeichnet die Herausführung als vorausliegendes Geschehen; „sie“ bewahrt den maskulinen Pluralbezug des hebräischen Textes.
- source_word: לְעֵינֵיהֶם
  choice: vor deren Augen
  rationale: Die Wiederholung des Augenmotivs aus dem Hebräischen bleibt sichtbar und verbindet die Völker ausdrücklich mit ihrer Zeugenschaft bei der Herausführung.
theological_decisions:
- issue: Gottes Zurückhaltung nach angekündigtem Gericht
  choice: Gott hielt seine Hand zurück
  alternative: Gott wandte seine Hand zurück / zog seine Hand zurück
  rationale: Die Übersetzung versteht die Handwendung kontextgemäß als Abstandnehmen von der Vollstreckung des angekündigten Gerichts, bewahrt jedoch das hebräische Handbild und fügt keine weitergehende dogmatische Erklärung hinzu.
- issue: Bedeutung von „mein Name“
  choice: Die Wendung „um meines Namens willen“ bleibt im Haupttext erhalten
  alternative: um meiner Ehre / meines Ansehens willen
  rationale: Der hebräische Text nennt ausdrücklich Gottes Namen. Seine öffentliche Ehre ist im Zusammenhang mitgemeint, doch eine Ersetzung durch „Ehre“ oder „Ansehen“ würde die biblische Ausdrucksweise und ihre theologische Spannung verengen.
- issue: Subjekt und Objekt bei לְבִלְתִּי הֵחֵל
  choice: 'Passiv formuliert: Gottes Name sollte nicht entweiht werden'
  alternative: 'Aktiv und formnäher: um [ihn] nicht zu entweihen'
  rationale: Der hebräische Infinitiv nennt das Objekt nicht ausdrücklich. Aus dem unmittelbar vorausgehenden „mein Name“ ergibt sich der Bezug; die deutsche Passivform macht den Sinn verständlich, ohne einen menschlichen oder göttlichen Täter der Entweihung ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „vor den Augen“ bildet die auffällige Wiederholung im Hebräischen ab. „Um meines Namens willen“ wahrt den biblischen Klang, bleibt aber allgemein verständlich.
