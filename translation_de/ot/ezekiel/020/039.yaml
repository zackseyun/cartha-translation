source:
  edition: WLC
  text: וְ/אַתֶּ֨ם בֵּֽית יִשְׂרָאֵ֜ל כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אִ֤ישׁ גִּלּוּלָי/ו֙ לְכ֣וּ עֲבֹ֔דוּ וְ/אַחַ֕ר אִם אֵינְ/כֶ֖ם שֹׁמְעִ֣ים אֵלָ֑/י וְ/אֶת שֵׁ֤ם קָדְשִׁ/י֙ לֹ֣א תְחַלְּלוּ ע֔וֹד בְּ/מַתְּנֽוֹתֵי/כֶ֖ם וּ/בְ/גִלּוּלֵי/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/039.yaml
  text: 'But as for you[a], house of Israel, thus says the Lord GOD: Go, each man, serve his idols—if afterward you will not listen to me[b]; but you shall no longer profane my holy name with your gifts and with your idols.'
translation:
  language: de
  text: 'Ihr aber, Haus Israel – so spricht Gott, der HERR: Geht, dient jeder seinen Götzen[a] – wenn ihr danach nicht auf mich hört[b]. Doch meinen heiligen Namen sollt ihr nicht länger durch eure Gaben und eure Götzen entweihen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Götzen“ ist stark verächtlich; mögliche Wiedergaben sind etwa „Kotgötzen“ oder „Mistgötzen“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder bei anderer Gliederung: „Geht, dient jeder seinen Götzen; aber danach, wenn ihr nicht auf mich hört …“ Die hebräische Satzfügung nach „dient“ ist schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt Israel kontrastierend hervor; „Ihr aber“ ist im Deutschen knapp und natürlich.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Bewahrt die korporative, bundestheologische Anrede in ihrer etablierten deutschen Form.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die traditionelle deutsche Wiedergabe vermeidet die schwerfällige Doppelung „Herr HERR“ und kennzeichnet den Gottesnamen durch Kapitälchen.
- source_word: אִישׁ גִּלּוּלָיו
  choice: jeder seinen Götzen
  rationale: אִישׁ ist hier distributiv; „jeder“ gibt die individuelle Verantwortlichkeit natürlich wieder. Das Possessivpronomen bleibt entsprechend singularisch.
- source_word: גִּלּוּלִים
  choice: Götzen
  rationale: „Götzen“ ist verständlich und bereits abwertend; die besonders verächtliche Färbung des hebräischen Ausdrucks wird in einer Fußnote erläutert.
- source_word: לְכוּ עֲבֹדוּ
  choice: Geht nur, dient
  rationale: Die beiden Imperative bleiben erhalten. „nur“ signalisiert im Kontext die scharfe, richterliche Preisgabe, ohne den Imperativ als Billigung des Götzendienstes umzudeuten.
- source_word: וְאַחַר אִם אֵינְכֶם שֹׁמְעִים אֵלָי
  choice: wenn ihr auch weiterhin nicht auf mich hört
  rationale: Die schwierige Folge וְאַחַר אִם wird idiomatisch temporal-konditional wiedergegeben. „auf mich hört“ wahrt sowohl den Hör- als auch den Gehorsamsaspekt von שׁמע.
- source_word: שֵׁם קָדְשִׁי
  choice: meinen heiligen Namen
  rationale: Entspricht der natürlichen deutschen Ausdrucksweise und bewahrt die theologische Bedeutung des göttlichen Namens.
- source_word: לֹא תְחַלְּלוּ עוֹד
  choice: sollt ihr nicht länger ... entweihen
  rationale: Gibt die nachdrückliche prohibitive beziehungsweise deklarative Kraft wieder; „entweihen“ passt im Deutschen besonders zur Verletzung der Heiligkeit des Namens.
- source_word: בְּמַתְּנוֹתֵיכֶם
  choice: durch eure Gaben
  rationale: „Gaben“ ist die direkte lexikalische Entsprechung und lässt offen, um welche kultischen Opfergaben es sich genau handelt.
- source_word: וּבְגִלּוּלֵיכֶם
  choice: und eure Götzen
  rationale: Das gemeinsame „durch“ regiert beide parallelen Ausdrücke und bezeichnet die Mittel beziehungsweise Zusammenhänge der Entweihung.
theological_decisions:
- issue: Kraft der einleitenden Imperative
  choice: 'Richterliche Preisgabe mit ironischer Schärfe: Israel soll seinen Götzen dienen, wenn es weiterhin nicht auf Gott hört.'
  alternative: Eine Billigung des fortgesetzten Götzendienstes oder eine rein sarkastische Aussage ohne echten Imperativ.
  rationale: Der Kontext schließt eine göttliche Billigung des Götzendienstes aus. Zugleich werden die hebräischen Imperative nicht abgeschwächt; die Spannung zwischen Aufforderung und anschließender Untersagung der Namensentweihung bleibt bestehen.
- issue: Syntaktische Zuordnung von וְאַחַר אִם
  choice: 'Temporal-konditional auf die Weigerung zu hören bezogen: „wenn ihr auch weiterhin nicht auf mich hört“.'
  alternative: „Geht, dient jeder seinen Götzen; aber danach, wenn ihr nicht auf mich hört …“
  rationale: Die hebräische Syntax ist schwierig und erlaubt verschiedene Interpunktionen. Der Haupttext bietet eine verständliche Lesart, während die Fußnote die alternative Gliederung offenhält.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr JHWH / der Herr Jahwe
  rationale: Diese im Deutschen etablierte Wiedergabe unterscheidet Titel und Eigenname, vermeidet „Herr HERR“ und legt keine bestimmte Aussprache des Tetragramms fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Schärfe. „Geht nur“ macht die richterlich-ironische Färbung hörbar; die beiden Fußnoten bewahren die lexikalische Härte und die syntaktische Mehrdeutigkeit des Hebräischen.
