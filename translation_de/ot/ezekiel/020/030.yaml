  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הַ/בְּ/דֶ֥רֶךְ אֲבֽוֹתֵי/כֶ֖ם אַתֶּ֣ם נִטְמְאִ֑ים וְ/אַחֲרֵ֥י שִׁקּוּצֵי/הֶ֖ם אַתֶּ֥ם זֹנִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/030.yaml
  text: 'Therefore say to the house of Israel[a], Thus says the Lord Yahweh: Are you defiling yourselves in the way of your fathers[b], and whoring after their detestable things?'
translation:
  language: de
  text: 'Darum sage zum Haus Israel: So spricht Yahweh, der Herr: Verunreinigt ihr euch auf dem Weg eurer Vorfahren und hurt ihr ihren abscheulichen Dingen nach?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Werdet ihr auf dem Weg eurer Vorfahren unrein und prostituiert ihr euch, indem ihr ihren abscheulichen Dingen nachlauft?“ Mit den „abscheulichen Dingen“ können im Zusammenhang besonders Götzen gemeint sein.'
    reason: Bewahrt die mögliche intransitive Nuance von נִטְמְאִים, bietet eine weniger bildhafte Alternative für זֹנִים und erläutert, ohne den Ausdruck im Haupttext einzuengen, den möglichen Bezug von שִׁקּוּצֵיהֶם auf Götzen.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Abschnitt knapp und natürlich wieder.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Bewahrt die korporative und bundesgeschichtliche Bezeichnung des hebräischen Textes.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahweh
  rationale: Entspricht der prophetischen Botenformel und unterscheidet אֲדֹנָי von dem ausdrücklich genannten Gottesnamen יהוה.
- source_word: הַבְּדֶרֶךְ אֲבוֹתֵיכֶם
  choice: auf dem Weg eurer Vorfahren
  rationale: Bewahrt das Bild vom Weg als übernommener Lebens- und Verhaltensweise; „Vorfahren“ ist im heutigen Deutsch inklusiver und natürlicher als „Väter“.
- source_word: אַתֶּם נִטְמְאִים
  choice: Macht ihr euch unrein
  rationale: Gibt den rhetorischen Fragesinn und die kultisch-moralische Verunreinigung wieder, ohne sie auf bloße Befleckung zu verengen.
- source_word: שִׁקּוּצֵיהֶם
  choice: ihren abscheulichen Dingen
  rationale: Bewahrt den weiten Ausdruck für verabscheuungswürdige Gegenstände oder Praktiken; im Kontext sind besonders Götzenbilder gemeint, doch der Text wird nicht unnötig eingeengt.
- source_word: אַתֶּם זֹנִים
  choice: hurt ihr ... hinterher
  rationale: Erhält die drastische prophetische Metapher sexueller Untreue für Israels Abfall zu fremden Kulten.
theological_decisions:
- issue: Wiedergabe von יהוה nach אֲדֹנָי
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form macht sowohl den Titel אֲדֹנָי als auch den persönlichen Gottesnamen יהוה sichtbar und vermeidet, beide mit demselben deutschen Wort wiederzugeben.
- issue: Deutung von זנה im Götzendienstkontext
  choice: huren
  alternative: sich untreu verhalten
  rationale: Die konkrete und anstößige Metapher des hebräischen Textes wird bewahrt; die abgeschwächte Alternative würde die prophetische Schärfe und den Gedanken der Bundesuntreue teilweise verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage, das Weg-Bild und die bewusst drastische Untreue-Metapher bleiben erhalten. „Hinter ... herhuren“ wurde zugunsten der natürlicheren getrennten Formulierung „hurt ... hinter ... her“ vermieden.
