  text: וּ/בָרוֹתִ֣י מִ/כֶּ֗ם הַ/מֹּרְדִ֤ים וְ/הַ/פּֽוֹשְׁעִים֙ בִּ֔/י מֵ/אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ אוֹצִ֣יא אוֹתָ֔/ם וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָב֑וֹא וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/038.yaml
  text: I will purge from among you the rebels and those who transgress against me[a]. I will bring them out of the land where they sojourn, but they will not enter the land of Israel[c][b]. Then you will know that I am Yahweh.
translation:
  language: de
  text: Ich werde die Aufrührer und diejenigen, die sich gegen mich vergehen, aus eurer Mitte aussondern.[a] Ich werde sie aus dem Land herausführen, in dem sie als Fremde leben,[b] aber sie werden nicht in das Land Israel hineinkommen.[c] Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus eurer Mitte aussieben“. Das hebräische Verb bezeichnet ein trennendes Ausscheiden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus dem Land ihrer Fremdlingsaufenthalte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen steht das Verb im Singular: „wird er nicht hineinkommen“; es ist hier kollektiv oder auf jeden Einzelnen der Gruppe bezogen.'
    reason: source_form
lexical_decisions:
- source_word: וּבָרוֹתִי מִכֶּם
  choice: Ich werde … aus eurer Mitte aussondern
  rationale: Das Verb ברר bezeichnet hier ein trennendes Ausscheiden; מן markiert die Entfernung aus der Gemeinschaft. „Aussondern“ bewahrt das Bild gerichtlicher Scheidung, ohne eine darüber hinausgehende Vernichtungsbedeutung einzutragen.
- source_word: הַמֹּרְדִים
  choice: die Aufrührer
  rationale: Das substantivierte Partizip bezeichnet Menschen in fortdauernder Auflehnung. „Aufrührer“ gibt den aktiven Widerstand wieder und unterscheidet sich sprachlich vom folgenden פשע.
- source_word: וְהַפּוֹשְׁעִים בִּי
  choice: alle, die sich gegen mich vergehen
  rationale: פשע bezeichnet eine schwere Übertretung beziehungsweise Auflehnung; בִּי macht die persönliche Ausrichtung gegen Gott deutlich. Die Formulierung vermeidet eine unnötige Wiederholung von „aufrühren“.
- source_word: מֵאֶרֶץ מְגוּרֵיהֶם
  choice: aus dem Land …, in dem sie als Fremde leben
  rationale: מָגוּר bezeichnet den Aufenthaltsort des Fremdlings beziehungsweise einen nicht dauerhaft eigenen Wohnort. Die Wendung ist in modernem Deutsch verständlich und erhält den Exil- und Fremdlingsaspekt.
- source_word: אוֹצִיא אוֹתָם
  choice: Ich werde sie … herausführen
  rationale: Der Hifil von יצא bedeutet, jemanden hinaus- oder herauszuführen. „Herausführen“ ist natürlich und wahrt den kausativen Sinn.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: das Land Israel
  rationale: אַדְמָה bedeutet wörtlich „Erdboden“, dient hier jedoch als territoriale Bezeichnung. „Land Israel“ ist im Deutschen idiomatisch.
- source_word: לֹא יָבוֹא
  choice: werden sie nicht kommen
  rationale: Die hebräische Verbform steht im Singular, bezieht sich jedoch kollektiv beziehungsweise distributiv auf die zuvor genannte Gruppe. Im Deutschen ist dafür der Plural erforderlich.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das waw verbindet die Erkenntnis als Folge mit dem vorausgehenden Gerichtshandeln. „Erkennen“ entspricht der häufigen erkenntnisbezogenen Formel bei Ezechiel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Reichweite des Gerichtsausdrucks וּבָרוֹתִי
  choice: aussondern
  alternative: ausfegen / läutern
  rationale: Der hebräische Ausdruck betont das trennende Entfernen der Aufrührer aus der Gemeinschaft. „Aussondern“ erhält die richterliche Schärfe, legt aber weder Vernichtung noch innere Läuterung fest.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Hoheitstitel.
- issue: Singular von לֹא יָבוֹא bei pluralischer Bezugsgruppe
  choice: werden sie nicht kommen
  alternative: keiner von ihnen wird kommen
  rationale: Der Singular kann kollektiv oder distributiv verstanden werden. Der deutsche Plural bewahrt den Gruppenbezug; die Fußnote weist auf die Form des Hebräischen hin, ohne die Nuance dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufrührer“ und „sich gegen mich vergehen“ halten die beiden benachbarten Begriffe מרד und פשע unterscheidbar. Die Satzfolge bleibt eng am Hebräischen; die Fußnoten markieren echte lexikalische und grammatische Alternativen.
