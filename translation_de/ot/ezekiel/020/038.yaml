  to: Ich werde die Aufrührer und diejenigen, die sich gegen mich vergehen, aus eurer Mitte aussondern.[a] Ich werde sie aus dem Land herausführen, in dem sie als Fremde leben,[b] aber sie werden nicht in das Land Israel hineinkommen.[c] Dann werdet ihr erkennen, dass ich Jahwe bin.
  rationale: Die Revision entfernt den nicht ausdrücklich vorhandenen Zusatz „alle“ und präzisiert den Eintrittssinn von בוא mit „hineinkommen“. Alle übrigen Formulierungen und Fußnoten werden beibehalten, da sie den hebräischen Text, seine kollektive Singularform und den modernen deutschen Registeranspruch angemessen wiedergeben.
