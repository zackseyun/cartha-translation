source:
  edition: WLC
  text: וָ/אֹמַ֤ר אֶל בְּנֵי/הֶם֙ בַּ/מִּדְבָּ֔ר בְּ/חוּקֵּ֤י אֲבֽוֹתֵי/כֶם֙ אַל תֵּלֵ֔כוּ וְ/אֶת מִשְׁפְּטֵי/הֶ֖ם אַל תִּשְׁמֹ֑רוּ וּ/בְ/גִלּוּלֵי/הֶ֖ם אַל תִּטַּמָּֽאוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/018.yaml
  text: And I said to their children in the wilderness[a], ‘Do not walk in the statutes of your fathers, and do not keep their judgments, and do not defile yourselves with their idols.’
translation:
  language: de
  text: 'Und ich sagte zu ihren Kindern in der Wüste: »Lebt nicht nach den Satzungen eurer Väter, befolgt ihre Rechtsbestimmungen nicht und verunreinigt euch nicht an ihren Götzen[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort גִּלּוּלִים ist eine stark verächtliche Bezeichnung für Götzen; möglich wären etwa „Dreckgötzen“ oder, noch drastischer, „Mistgötzen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Das Wayyiqtol von אמר führt die Erzählung mit einer weiteren vergangenen Handlung fort; „Und ich sagte“ bewahrt diese schlichte Abfolge.
- source_word: בְּנֵיהֶם
  choice: ihren Kindern
  rationale: בנים kann Söhne im engeren Sinn oder Kinder beziehungsweise Nachkommen bezeichnen. Hier ist die nächste Generation Israels gemeint, weshalb „Kinder“ den generationellen Bezug natürlich wiedergibt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet hier das Wüstengebiet der Exoduszeit; „in der Wüste“ ist im Deutschen die geläufige und sachlich passende Wiedergabe.
- source_word: בְּחֻקֵּי
  choice: nach den Satzungen
  rationale: חֻקִּים bezeichnet festgesetzte Vorschriften. Die Formulierung „nach den Satzungen leben“ gibt die hebräische Verbindung mit הלך verständlich wieder und wahrt den rechtlich-bundestheologischen Klang.
- source_word: אֲבוֹתֵיכֶם
  choice: eurer Väter
  rationale: Der Ausdruck ist ausdrücklich maskulin und bezeichnet die vorangegangene Generation. „Väter“ bewahrt Wortlaut und generationellen Gegensatz.
- source_word: אַל תֵּלֵכוּ
  choice: Lebt nicht nach
  rationale: הלך bedeutet in dieser Verbindung, sein Verhalten an Vorschriften auszurichten. „Nach … leben“ überträgt die hebräische Weg-Metapher idiomatisch, ohne den Sinn auf bloßes Befolgen zu verengen.
- source_word: מִשְׁפְּטֵיהֶם
  choice: ihre Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Regelungen. „Rechtsbestimmungen“ hält den Ausdruck von חֻקִּים („Satzungen“) unterscheidbar.
- source_word: תִּשְׁמֹרוּ
  choice: befolgt
  rationale: שׁמר bedeutet bei Geboten und Rechtsbestimmungen, sie einzuhalten beziehungsweise zu befolgen. „Befolgt“ ist in modernem Deutsch klar und natürlich.
- source_word: גִּלּוּלֵיהֶם
  choice: ihren Götzen
  rationale: גִּלּוּלִים ist eine stark verächtliche Bezeichnung für Götzen. Im Haupttext bleibt die klare, geläufige Wiedergabe „Götzen“ stehen; die drastische Nebenbedeutung wird in der Fußnote dokumentiert.
- source_word: תִּטַּמָּאוּ
  choice: verunreinigt euch nicht
  rationale: Die reflexive Form beschreibt, dass die Angesprochenen sich durch den Umgang mit den Götzen kultisch und moralisch verunreinigen. Die deutsche reflexive Form wahrt diesen Aspekt.
theological_decisions:
- issue: Wiedergabe der Vorfahrenbezeichnung אֲבוֹתֵיכֶם
  choice: eurer Väter
  alternative: eurer Vorfahren
  rationale: Der hebräische Ausdruck ist maskulin plural und stellt die angesprochene Generation ihren Vätern gegenüber. „Väter“ bewahrt diese konkrete generationelle Gegenüberstellung, ohne sie zu verallgemeinern.
- issue: Verächtliche Aussagekraft von גִּלּוּלִים
  choice: Götzen
  alternative: Dreckgötzen / Mistgötzen
  rationale: Das hebräische Wort trägt echte, möglicherweise mit Kot oder Unrat verbundene Verachtung. Eine entsprechend drastische deutsche Neubildung würde im Haupttext jedoch leicht paraphrastisch oder künstlich wirken; deshalb steht dort „Götzen“, während die Fußnote die Spannung offenlegt.
- issue: Art der Verunreinigung durch die Götzen
  choice: verunreinigt euch nicht an ihren Götzen
  alternative: verunreinigt euch nicht durch ihre Götzen
  rationale: Die Präposition ב kann die Sphäre oder den Anlass der Verunreinigung bezeichnen. „An ihren Götzen“ lässt offen, ob der Umgang, die Verehrung oder eine andere Verbindung mit ihnen die Verunreinigung bewirkt, und legt den Vorgang nicht enger fest als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verbote bleiben erkennbar, werden aber mit idiomatischen deutschen Wendungen formuliert. „Satzungen“ und „Rechtsbestimmungen“ bewahren die Unterscheidung der beiden hebräischen Rechtsbegriffe.
