review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur, die Kausalsätze und das Wortspiel mit זכר sind zutreffend erfasst. Allerdings ist „mit der Hand ergriffen“ im Deutschen keine natürliche Wiedergabe von בַּכַּף תִּתָּפֵשׂוּ und kann fälschlich das Mittel statt das Bild des Zugriffs bezeichnen. Die Perfektform „sichtbar geworden sind“ ist zudem gegenüber dem hebräischen Infinitiv weniger passend als eine ergebnisbezogene Gegenwartsform.
  naturalness: Die prophetische Satzperiode ist insgesamt gut lesbar. „in Erinnerung gekommen seid“ ist verständlich, aber „in Erinnerung gerufen worden seid“ klingt im Deutschen natürlicher und wahrt zugleich die passive Nuance. „in die Hand genommen werden“ gibt die Bildsprache idiomatisch wieder.
  terminology: „Schuld“, „Vergehen“, „Sünden“ und „Taten“ sind angemessen differenziert. „der Herr Yahweh“ erhält Titel und Gottesnamen; die Fassung wird beibehalten. Die Anmerkung a wiederholt bislang jedoch nahezu wörtlich die bereits gewählte Übersetzung und bietet daher keine sinnvolle Alternative.
  issues:
  - severity: medium
    issue: „mit der Hand ergriffen werden“ ist idiomatisch und semantisch ungenau.
    rationale: בַּכַּף bezeichnet wörtlich die Hand bzw. den Griff; im Zusammenhang mit תפשׂ geht es um Ergreifen oder Gefangennahme. „Mit der Hand“ klingt im Deutschen primär instrumental. „In die Hand genommen“ bewahrt das Bild und ist idiomatischer.
  - severity: low
    issue: „sichtbar geworden sind“ verschiebt die infinitivische Ergebnisangabe in ein abgeschlossenes Perfekt.
    rationale: לְהֵרָאוֹת drückt hier das Sichtbarwerden bzw. Offenbarwerden der Sünden aus. „sichtbar werden“ folgt der hebräischen Satzbewegung enger.
  - severity: low
    issue: Fußnote a bietet als Alternative dieselbe Aussage wie der Haupttext.
    rationale: Eine Fußnote sollte die mögliche aktivere Lesart bzw. die fehlende ausdrückliche Angabe des Handelnden erläutern, nicht die gewählte Formulierung wiederholen.
