source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ יַ֗עַן הַזְכַּרְ/כֶם֙ עֲוֺ֣נְ/כֶ֔ם בְּ/הִגָּל֣וֹת פִּשְׁעֵי/כֶ֗ם לְ/הֵֽרָאוֹת֙ חַטֹּ֣אותֵי/כֶ֔ם בְּ/כֹ֖ל עֲלִילֽוֹתֵי/כֶ֑ם יַ֚עַן הִזָּ֣כֶרְ/כֶ֔ם בַּ/כַּ֖ף תִּתָּפֵֽשׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/029.yaml
  text: 'Therefore thus says the Lord GOD: Because you have brought your guilt to remembrance by uncovering your transgressions[a], so that your sins are seen in all your deeds, because you have come to remembrance[b], you will be seized by the hand.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Weil ihr eure Schuld in Erinnerung gebracht habt, bei der Aufdeckung eurer Vergehen[a], sodass eure Sünden in all euren Taten sichtbar werden, und weil ihr selbst in Erinnerung gerufen worden seid, werdet ihr in die Hand genommen werden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem ihr eure Vergehen aufdeckt“. Das Hebräische verwendet eine passive Form; der Handelnde wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werdet ihr in der Hand ergriffen“. Gemeint ist, dass sie gepackt oder gefangen genommen und damit in die Gewalt eines Feindes gebracht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן כֹּה אָמַר
  choice: Darum, so spricht
  rationale: Bewahrt die prophetische Folgerungs- und Botenformel in einer geläufigen, würdevollen deutschen Wendung.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne beide zu demselben deutschen Titel einzuebnen.
- source_word: הַזְכַּרְכֶם עֲוֺנְכֶם
  choice: ihr eure Schuld in Erinnerung gebracht habt
  rationale: Die kausative Form von זכר wird ausdrücklich wiedergegeben; עָוֹן bezeichnet hier im Zusammenhang mit Vergehen und Sünden am ehesten Schuld.
- source_word: בְּהִגָּלוֹת פִּשְׁעֵיכֶם
  choice: indem eure Vergehen aufgedeckt wurden
  rationale: Die passive Form von גלה bleibt erhalten; die Wendung bezeichnet den Umstand bzw. das Mittel, durch das die Schuld wieder ins Gedächtnis tritt.
- source_word: לְהֵרָאוֹת חַטֹּאותֵיכֶם
  choice: sodass eure Sünden ... sichtbar geworden sind
  rationale: Gibt die resultative Bedeutung und die passive Sichtbarkeit der Sünden in natürlichem Deutsch wieder.
- source_word: בְּכֹל עֲלִילוֹתֵיכֶם
  choice: in all euren Taten
  rationale: עֲלִילוֹת bezeichnet Handlungen oder Taten und trägt hier durch den Kontext eine negative Färbung.
- source_word: הִזָּכֶרְכֶם
  choice: ihr selbst in Erinnerung gekommen seid
  rationale: Nimmt die Wiederholung der Wurzel זכר hörbar auf und unterscheidet zwischen der erinnerten Schuld und den Menschen, die nun selbst in den Blick des Gerichts geraten.
- source_word: בַּכַּף תִּתָּפֵשׂוּ
  choice: ihr mit der Hand ergriffen werden
  rationale: Bewahrt sowohl das passive Ergriffenwerden als auch das konkrete Bild der Hand; der Zusammenhang lässt zugleich die idiomatische Bedeutung des Gefangenwerdens erkennen.
theological_decisions:
- issue: Wiedergabe der zusammengesetzten Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; Gott, der HERR
  rationale: Die gewählte Fassung hält Herrschertitel und Eigenname auseinander und lässt den im Hebräischen ausdrücklich stehenden Gottesnamen sichtbar.
- issue: Wer oder was in Erinnerung kommt
  choice: Zuerst wird die Schuld in Erinnerung gebracht; danach kommen die Angeredeten selbst in Erinnerung.
  alternative: Beide Wendungen lediglich als Aussage über die Erinnerung an ihre Schuld verstehen.
  rationale: Der Wechsel von עֲוֺנְכֶם als Objekt der kausativen Form zu הִזָּכֶרְכֶם wird beibehalten. So bleibt die rhetorische Wiederholung samt ihrer möglichen Steigerung zum Gericht über die Personen erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Formel. Die Wiederholung von „Erinnerung“ bildet das zweimalige Wortspiel mit זכר nach. Die längere Satzperiode folgt der argumentativen Steigerung des hebräischen Verses, ohne altertümliche Syntax zu erzwingen.
