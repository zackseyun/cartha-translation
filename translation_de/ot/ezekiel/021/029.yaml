revisions:
- from: 'Darum, so spricht der Herr Yahweh: Weil ihr eure Schuld in Erinnerung gebracht habt, indem eure Vergehen aufgedeckt wurden[a], sodass eure Sünden in all euren Taten sichtbar geworden sind, und weil ihr selbst in Erinnerung gekommen seid, werdet ihr mit der Hand ergriffen werden.[b]'
  to: 'Darum, so spricht der Herr Yahweh: Weil ihr eure Schuld in Erinnerung gebracht habt, bei der Aufdeckung eurer Vergehen[a], sodass eure Sünden in all euren Taten sichtbar werden, und weil ihr selbst in Erinnerung gerufen worden seid, werdet ihr in die Hand genommen werden.[b]'
  rationale: Die Revision bewahrt die wiederholte זכר-Wortfamilie mit „in Erinnerung gebracht“ und „in Erinnerung gerufen“, ohne den im Hebräischen nicht ausdrücklich genannten Erinnernden zu bestimmen. Sie gibt die passive bzw. unbestimmt bleibende Aufdeckung der Vergehen neutral wieder, hält das Sichtbarwerden als Ergebnis fest und ersetzt die unnatürliche instrumentale Formulierung beim abschließenden Bild durch „in die Hand genommen“.
  reviewer_model: gpt-5.6-terra
