id: EZK.21.14
reference: Ezekiel 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֖ה אָמַ֣ר אֲדֹנָ֑/י אֱמֹ֕ר חֶ֥רֶב חֶ֛רֶב הוּחַ֖דָּה וְ/גַם מְרוּטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/014.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Say, “A sword, a sword, sharpened and also polished.”’'
translation:
  language: de
  text: 'Menschensohn, weissage und sage: »So spricht der Herr: Sprich: ›Ein Schwert, ein Schwert, geschärft und auch poliert[a]!‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »blank gemacht«. Das hebräische Wort beschreibt ein geglättetes, glänzend gemachtes Schwert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische Anrede und bildet die hebräische Verbindung formal und im deutschen Bibelstil verständlich ab.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Der Imperativ von נבא bezeichnet die prophetische Verkündigung; »weissage« ist die etablierte, präzise deutsche Wiedergabe.
- source_word: וְאָמַרְתָּ
  choice: und sage
  rationale: Gibt den aufeinanderfolgenden Auftrag direkt wieder und bewahrt die Verbindung der beiden Imperative.
- source_word: כֹּה אָמַר אֲדֹנָי
  choice: So spricht der Herr
  rationale: Entspricht der prophetischen Botenformel. Der vorgelegte hebräische Text bietet אֲדֹנָי ohne das Tetragramm; daher ist »der Herr« genauer als »GOTT, der Herr«.
- source_word: אֱמֹר
  choice: Sprich
  rationale: Bewahrt den zweiten Imperativ und die auffällige Wiederholung der Wurzel אמר.
- source_word: חֶרֶב חֶרֶב
  choice: Ein Schwert, ein Schwert
  rationale: Erhält die emphatische Wiederholung; der unbestimmte Artikel ergibt im Deutschen einen natürlichen Ausruf.
- source_word: הוּחַדָּה
  choice: geschärft
  rationale: Die passive Form von חדד besagt, dass das Schwert scharf gemacht worden ist.
- source_word: וְגַם
  choice: und auch
  rationale: Bewahrt sowohl die Verknüpfung als auch den additiven Nachdruck.
- source_word: מְרוּטָה
  choice: poliert
  rationale: Bezeichnet hier ein geglättetes beziehungsweise glänzend gemachtes Schwert; »poliert« ist gegenwärtig und allgemein verständlich.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: der Herr
  alternative: GOTT, der Herr
  rationale: Im angegebenen WLC-Text steht אֲדֹנָי allein. Die Übersetzung fügt deshalb kein im Ausgangstext nicht vorhandenes Tetragramm hinzu und wahrt zugleich den feierlichen Charakter der Botenformel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholungen von »sage/spricht/sprich« und »ein Schwert, ein Schwert« bleiben als bewusste Merkmale der prophetischen Rede erhalten; verschachtelte deutsche Anführungszeichen verdeutlichen die Redeebenen.
