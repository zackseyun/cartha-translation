lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Offenbarungsformel gibt „kam“ den hebräischen Ausdruck idiomatisch und zugleich formnah wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: „Das Wort“ bewahrt die etablierte prophetische Formel und bezeichnet hier die göttliche Mitteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit Suffix bezeichnet die Richtung zum Propheten und wird im Deutschen natürlich mit „zu mir“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv führt die unmittelbar folgende Gottesrede ein; im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion ohne ein schwerfälliges „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als Gottesnamen; die traditionelle Titelwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt erkennbar; לֵאמֹר wird idiomatisch durch den die folgende Rede eröffnenden Doppelpunkt wiedergegeben.
