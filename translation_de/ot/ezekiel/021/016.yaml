  text: וַ/יִּתֵּ֥ן אֹתָ֛/הּ לְ/מָרְטָ֖ה לִ/תְפֹּ֣שׂ בַּ/כָּ֑ף הִֽיא הוּחַ֤דָּה חֶ֨רֶב֙ וְ/הִ֣יא מֹרָ֔טָּה לָ/תֵ֥ת אוֹתָ֖/הּ בְּ/יַד הוֹרֵֽג־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/016.yaml
  text: It is given to be polished[a], to be grasped in the hand. It is sharpened—the sword—and it is polished[c][b], to put it into the hand of a slayer.
translation:
  language: de
  text: Man gab es zum Polieren[a], um es in die Hand zu nehmen[b]. Geschärft ist es – das Schwert –, und poliert, um es einem Tötenden in die Hand zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Blankmachen“; gemeint ist das glänzende Herrichten der Klinge.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um es mit der Handfläche zu fassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָהּ
  choice: Man gab es
  rationale: Das hebräische Verb ist aktiv, 3. Person Singular, doch sein Subjekt wird nicht genannt. Das unpersönliche „man“ wahrt diese Unbestimmtheit besser als ein Passiv und bezieht das feminine Suffix sinngemäß auf „das Schwert“.
- source_word: לְמָרְטָה / מֹרָטָּה
  choice: zum Polieren / poliert
  rationale: מרט bezeichnet hier das Polieren oder Blankmachen einer Klinge. „Polieren“ ist im heutigen Deutsch klar und bewahrt in beiden Satzhälften die hebräische Wiederholung.
- source_word: לִתְפֹּשׂ בַּכָּף
  choice: damit die Hand es ergreifen kann
  rationale: תפש bedeutet „ergreifen, fassen“, כּף wörtlich „Handfläche“. Die Formulierung erhält das konkrete Bild und macht das Schwert eindeutig zum ergriffenen Gegenstand.
- source_word: הוּחַדָּה חֶרֶב
  choice: Geschärft ist es – das Schwert –
  rationale: 'Die markierte Wortstellung gibt die abrupte, appositionelle Form des Hebräischen wieder: Erst wird das Schwert durch ein Pronomen bezeichnet, dann ausdrücklich genannt.'
- source_word: לָתֵת אוֹתָהּ בְּיַד
  choice: um es … in die Hand zu geben
  rationale: נתן mit בְּיַד bezeichnet die Übergabe in jemandes Hand oder Gewalt. Die konkrete Wendung bleibt erhalten, ohne sie abstrakt als „Gewalt“ aufzulösen.
- source_word: הוֹרֵג
  choice: einem, der tötet
  rationale: Das aktive Partizip bezeichnet einen Tötenden. Die verbale Umschreibung wahrt den Vorgangscharakter und vermeidet sowohl das altertümliche „Totschläger“ als auch zusätzliche moralische Wertung durch „Mörder“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper, bildhafter Syntax. Die abrupte Apposition „das Schwert“ und die Wiederholung von „poliert“ spiegeln den eindringlichen Stil des Schwertorakels; das nicht genannte Subjekt des ersten Verbs wird nicht bestimmt.
