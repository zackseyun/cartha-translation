  to: Man gab es zum Polieren[a], um es in die Hand zu nehmen[b]. Geschärft ist es – das Schwert –, und poliert, um es einem Tötenden in die Hand zu geben.
  rationale: Die Revision korrigiert die syntaktische Rolle von „Handfläche/Hand“ bei לִתְפֹּשׂ בַּכָּף, ohne das offene Subjekt des Verses zu bestimmen. Die knappe Apposition „das Schwert“, die Wiederholung von „poliert“ und die konkrete Übergabe „in die Hand“ bleiben erhalten.
