  text: דֶּ֣רֶךְ תָּשִׂ֔ים לָ/ב֣וֹא חֶ֔רֶב אֵ֖ת רַבַּ֣ת בְּנֵֽי עַמּ֑וֹן וְ/אֶת יְהוּדָ֥ה בִ/ירוּשָׁלִַ֖ם בְּצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/025.yaml
  text: You shall set a road for the sword to come to Rabbah of the Ammonites[b][a], and to Judah in fortified Jerusalem.
translation:
  language: de
  text: Du sollst einen Weg anlegen, damit das Schwert nach Rabba der Ammoniter[a] und nach Juda gelangt, nach Jerusalem, der befestigten Stadt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabba war die Hauptstadt der Ammoniter.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Du sollst einen Weg anlegen, damit das Schwert gegen Rabba der Ammoniter und gegen Juda, gegen Jerusalem, die befestigte Stadt, vorrückt.“ Die hebräische Konstruktion kann sowohl die Bewegung zu diesen Orten als auch den feindlichen Angriff gegen sie ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: einen Weg
  rationale: Das Substantiv bezeichnet einen Weg oder eine Route. „Weg“ ist im Deutschen natürlich und passt zur militärischen Wegweisung für das heranziehende Schwert.
- source_word: תָּשִׂים
  choice: du sollst … festlegen
  rationale: Die Form von שׂים bedeutet „setzen, bestimmen, anlegen“. „Festlegen“ gibt im Zusammenhang das Markieren beziehungsweise Bestimmen der Route verständlich wieder.
- source_word: לָבוֹא
  choice: auf dem … kommen kann
  rationale: 'Der Infinitiv von בוא bezeichnet hier Zweck oder Ergebnis: Der Weg wird so festgelegt, dass das Schwert darauf herankommen kann.'
- source_word: חֶרֶב
  choice: das Schwert
  rationale: Das Schwert erscheint in diesem prophetischen Kriegsbild als bekannte, personifizierte Macht des Gerichts; der bestimmte Artikel ist im Deutschen idiomatisch.
- source_word: אֵת רַבַּת בְּנֵי עַמּוֹן
  choice: nach Rabba der Ammoniter
  rationale: Rabba ist der Eigenname der ammonitischen Hauptstadt. „Der Ammoniter“ gibt בְּנֵי עַמּוֹן in natürlichem modernem Deutsch wieder; „nach“ stellt Rabba als Ziel des Vorrückens dar.
- source_word: וְאֶת יְהוּדָה
  choice: und nach Juda
  rationale: Juda steht parallel zu Rabba als weiteres Ziel beziehungsweise Angriffsziel des Schwertes.
- source_word: בִירוּשָׁלַם
  choice: ins … Jerusalem
  rationale: 'Die Präposition ב bezeichnet hier die nähere örtliche Bestimmung Judas: Das Ziel ist Jerusalem. „Ins“ verbindet Ort und Bewegungsrichtung im Deutschen natürlich.'
- source_word: בְּצוּרָה
  choice: befestigte
  rationale: Das Adjektiv beschreibt Jerusalem als befestigt beziehungsweise festungsartig und wird attributiv wiedergegeben.
theological_decisions:
- issue: Syntaktische Funktion der mit אֵת markierten Ortsangaben nach „das Schwert … kommen“
  choice: Rabba und Juda beziehungsweise Jerusalem werden parallel als Ziele des heranziehenden Schwertes dargestellt.
  alternative: Die Richtungsangaben können ausdrücklich feindlich mit „gegen Rabba … und gegen Juda“ wiedergegeben werden.
  rationale: Der Zusammenhang handelt von den zwei möglichen Marschrouten des babylonischen Schwertes. Die Übersetzung mit „nach“ wahrt die räumliche Bildsprache; eine Fußnote hält den im Kontext eindeutigen feindlichen Sinn offen, ohne ihn in die Syntax hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht das Bild einer festgelegten militärischen Route verständlich. „Rabba der Ammoniter“ bewahrt die knappe Ortsbezeichnung des Hebräischen; die historische Einordnung steht in der Fußnote.
