base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/026.yaml
  text: 'For the king of Babylon stands at the mother of the road[a], at the head of the two roads, to practice divination: he shakes the arrows, he consults the teraphim[c][b], he examines the liver.'
translation:
  language: de
  text: 'Denn der König von Babylon steht an der Weggabelung[a], am Beginn der beiden Wege, um Wahrsagung zu betreiben: Er schüttelt die Pfeile, befragt die Terafim[b] und untersucht die Leber[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an der Mutter des Weges“; gemeint ist der Verzweigungspunkt, an dem die beiden Wege beginnen.'
    reason: lexical_alternative
  - marker: b
    text: Terafim waren kultische Bilder, die unter anderem zur Orakelbefragung verwendet wurden.
    reason: cultural_note
  - marker: c
    text: Gemeint ist die Leberschau, also das Deuten einer Tierleber zur Gewinnung eines Orakels.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Erklärung des vorausgehenden prophetischen Wortes ein und bewahrt dessen begründende Funktion.
- source_word: עָמַד
  choice: steht
  rationale: Das deutsche Präsens gibt die anschauliche Gegenwärtigkeit der prophetischen Szene natürlich wieder.
- source_word: אֵם הַדֶּרֶךְ
  choice: am Ausgangspunkt des Weges
  rationale: Das hebräische Bild lautet wörtlich „Mutter des Weges“ und bezeichnet hier den Punkt, von dem die beiden Wege ausgehen; „Ausgangspunkt“ vermittelt den Sinn verständlich, ohne vorschnell eine bestimmte Form der Weggabelung festzulegen.
- source_word: בְּרֹאשׁ שְׁנֵי הַדְּרָכִים
  choice: am Anfang der beiden Wege
  rationale: Gibt das räumliche Bild von רֹאשׁ als Anfang beziehungsweise Beginn wieder und bildet eine natürliche Parallele zum vorhergehenden Ausdruck.
- source_word: לִקְסָם קָסֶם
  choice: um ein Orakel einzuholen
  rationale: Die Verbindung aus Infinitiv und stammverwandtem Substantiv bezeichnet die Ausübung von Wahrsagung. „Ein Orakel einholen“ passt zu der folgenden Entscheidungssuche durch mehrere konkrete Verfahren.
- source_word: קִלְקַל בַּחִצִּים
  choice: Er schüttelt die Pfeile
  rationale: Bewahrt die konkrete, vermutlich auf Losorakel zielende Handlung, ohne das nicht vollständig gesicherte Verfahren näher auszudeuten.
- source_word: שָׁאַל בַּתְּרָפִים
  choice: befragt die Terafim
  rationale: Behält den kultischen Fachbegriff bei; „befragt“ gibt die Verwendung dieser Bilder zur Orakelerkundung wieder.
- source_word: רָאָה בַּכָּבֵד
  choice: untersucht die Leber
  rationale: Bezeichnet im Kontext die Leberschau; „untersucht“ macht die gezielte Prüfung deutlich, ohne die Handlung im Haupttext auszuerklären.
theological_decisions:
- issue: Darstellung heidnischer Wahrsagepraktiken
  choice: Die einzelnen Praktiken mit Pfeilen, Terafim und Leber werden konkret benannt.
  alternative: Die Reihe zusammenfassend als bloßes „Zeichendeuten“ oder „Orakelsuchen“ wiederzugeben.
  rationale: Der hebräische Text nennt die Verfahren ausdrücklich. Ihre konkrete Wiedergabe bewahrt den historischen und prophetischen Gehalt, ohne sie zu billigen oder zusätzliche Polemik einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die anschauliche Abfolge des Hebräischen; seltene kulturgeschichtliche Begriffe und Praktiken werden knapp in Fußnoten erläutert.
