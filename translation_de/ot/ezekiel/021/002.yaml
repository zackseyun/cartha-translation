base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
translation:
  language: de
  text: Menschensohn, richte dein Gesicht nach Süden[a], predige gegen den Süden[b][c] und weissage gegen den Wald des offenen Landes im Negev.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen hier nacheinander drei verwandte Süd-Bezeichnungen: Teman, Darom und Negev. Die Wiederholung verstärkt die Ausrichtung der Botschaft auf das südliche Land.'
    reason: lexical_alternative
  - marker: b
    text: Das mit »predige« wiedergegebene Verb bedeutet wörtlich »träufeln« oder »tropfen lassen«; es ist ein hebräisches Bild für prophetisches Reden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »predige zum Süden hin«. Das hebräische Verhältniswort kann sowohl die Richtung als auch das Ziel der Botschaft bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die feste, im Ezechielbuch wiederkehrende Anrede und die singularische männliche Form des Hebräischen.
- source_word: שִׂים פָּנֶיךָ
  choice: richte dein Gesicht
  rationale: Gibt das hebräische Bild für die entschlossene Hinwendung zu einem Ziel formal und zugleich verständlich wieder.
- source_word: דֶּרֶךְ תֵּימָנָה
  choice: nach Süden
  rationale: תֵּימָנָה ist hier am ehesten eine Richtungsangabe; die Wiedergabe leitet zugleich die Folge dreier verschiedener Süd-Bezeichnungen ein.
- source_word: וְהַטֵּף
  choice: predige
  rationale: Das Verb bedeutet wörtlich »träufeln/tropfen lassen«, bezeichnet im prophetischen Sprachgebrauch jedoch das Verkünden einer Botschaft. »Predige« vermittelt die Funktion, während die Fußnote das Bild offenlegt.
- source_word: אֶל דָּרוֹם
  choice: gegen den Süden
  rationale: אֶל kann »zu/auf … hin« bedeuten; im Zusammenhang der angekündigten Gerichtsbotschaft ist die adversative Wiedergabe »gegen« naheliegend, ohne die Alternative zu verschweigen.
- source_word: וְהִנָּבֵא
  choice: weissage
  rationale: Entspricht der üblichen Bedeutung des Verbs נבא in einem prophetischen Beauftragungswort.
- source_word: אֶל יַעַר הַשָּׂדֶה נֶגֶב
  choice: gegen den Wald des offenen Landes im Negev
  rationale: »Wald des offenen Landes« bildet die ungewöhnliche Verbindung יַעַר הַשָּׂדֶה verständlich, aber bildhaft ab; »im Negev« versteht נֶגֶב hier als Bezeichnung der südlichen Region.
- source_word: נֶגֶב
  choice: Negev
  rationale: Die Umschrift bewahrt gegenüber den beiden vorherigen Süd-Bezeichnungen die mögliche regionale Bedeutung und vermeidet eine Einebnung der dreifachen Wortfolge.
theological_decisions:
- issue: Richtung oder Ziel einer feindlichen prophetischen Rede bei אֶל דָּרוֹם
  choice: gegen den Süden
  alternative: zum Süden hin
  rationale: Der Gerichtskontext und die Parallele zur folgenden Weissagung sprechen für eine gegen den Süden gerichtete Botschaft; die grammatisch mögliche Richtungsangabe bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste Ezechiel-Anrede »Menschensohn« und das konkrete Gesichtsbild bleiben erhalten. Die ungewöhnliche Waldlandschaft wird nicht allegorisch aufgelöst; die drei verschiedenen hebräischen Süd-Bezeichnungen werden durch »Süden«, erneut »Süden« und »Negev« soweit möglich erkennbar gehalten.
