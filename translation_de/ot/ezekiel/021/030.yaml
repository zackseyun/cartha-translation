  text: And you[a], slain wicked one, prince of Israel, whose day has come at the time of the punishment of the end[b],
translation:
  language: de
  text: Und du, erschlagener Frevler, Fürst Israels[a], dessen Tag gekommen ist, wenn die Schuld ihr Ende erreicht hat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erschlagener“ kann auch „tödlich Verwundeter“ bedeuten. Manche verstehen das hebräische Wort hier als „entweihter“.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „zur Zeit der Schuld des Endes“. Die Wendung kann von Schuld sprechen, die ihr Vollmaß bzw. Ende erreicht hat, oder von der abschließenden Strafe dafür.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלָל
  choice: erschlagener
  rationale: Das Wort bezeichnet hier im Gerichtszusammenhang am ehesten einen Durchbohrten beziehungsweise Erschlagenen. Die prophetische Anrede stellt das verhängte Geschick als gewiss dar; die mögliche Bedeutung „entweiht“ wird in der Fußnote bewahrt.
- source_word: רָשָׁע
  choice: Frevler
  rationale: Das Adjektiv ist substantivisch und im Vokativ gebraucht. „Frevler“ gibt die moralische Verurteilung knapp, würdig und deutlich wieder.
- source_word: נְשִׂיא יִשְׂרָאֵל
  choice: Fürst Israels
  rationale: „Fürst“ bewahrt den formellen Herrschertitel und den prophetischen Sprachton besser als das allgemeinere „Anführer“.
- source_word: אֲשֶׁר בָּא יוֹמוֹ
  choice: dessen Tag gekommen ist
  rationale: Die Formulierung erhält das hebräische Bild vom eingetroffenen, bestimmten Gerichtstag.
- source_word: בְּעֵת
  choice: zur Zeit
  rationale: Dies entspricht der temporalen Wendung knapp und idiomatisch.
- source_word: עֲוֺן קֵץ
  choice: der letzten Schuld
  rationale: Die stark verdichtete Wendung wird bewusst nicht eindeutig auf „Strafe“ festgelegt. עָוֹן kann Schuld oder deren Straffolge bezeichnen; „letzte Schuld“ bewahrt die grammatische Nähe und die mögliche Vorstellung einer Schuld, die an ihr Ende beziehungsweise Vollmaß gelangt.
theological_decisions:
- issue: Bedeutung von עֲוֺן in der Gerichtsformel
  choice: „Schuld“ im Haupttext
  alternative: „Strafe“ beziehungsweise „letzte Bestrafung“
  rationale: Da עָוֹן sowohl die Verfehlung und Schuld als auch deren Folge oder Strafe bezeichnen kann, wahrt „Schuld“ die genuine Spannung des Hebräischen. Die punitive Deutung wird in der Fußnote ausdrücklich genannt.
- issue: Bedeutung von חָלָל
  choice: „erschlagener“
  alternative: „entweihter“ oder „tödlich Verwundeter“
  rationale: Im unmittelbaren Todes- und Gerichtskontext ist die passive Bedeutung „durchbohrt/erschlagen“ wahrscheinlich. Weil die Form auch anders verstanden worden ist, wird die Alternative offengelegt, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst prophetischem Klang. Die Satzstruktur bleibt wegen des fortlaufenden Zusammenhangs offen und endet wie der Ausgangstext mit einem Komma. Der Fußnotenmarker steht unmittelbar bei der schwierigen Schlusswendung und erläutert beide wesentlichen lexikalischen Mehrdeutigkeiten.
