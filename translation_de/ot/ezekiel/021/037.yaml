source:
  edition: WLC
  text: לָ/אֵ֤שׁ תִּֽהְיֶה֙ לְ/אָכְלָ֔ה דָּמֵ֥/ךְ יִהְיֶ֖ה בְּ/ת֣וֹךְ הָ/אָ֑רֶץ לֹ֣א תִזָּכֵ֔רִי כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/037.yaml
  text: You will be fuel for the fire; your blood will be in the midst of the land. You will not be remembered[a], for I, Yahweh, have spoken.
translation:
  language: de
  text: Du wirst dem Feuer zum Fraß werden; dein Blut[a] wird mitten im Land sein. An dich wird man sich nicht erinnern; denn ich, Jahwe, habe gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Blutschuld“. Das Hebräische lautet wörtlich „dein Blut“ und kann im Zusammenhang auch Blutvergießen oder Blutschuld bezeichnen.'
    reason: lexikalische Alternative und bewahrte Mehrdeutigkeit
lexical_decisions:
- source_word: לָאֵשׁ ... לְאָכְלָה
  choice: dem Feuer zum Fraß
  rationale: Die beiden ל-Präpositionen bezeichnen Bestimmung bzw. Ergebnis. „Dem Feuer zum Fraß“ gibt das Bild des Verzehrtwerdens natürlich und würdevoll wieder, ohne das im Hebräischen nicht ausdrücklich stehende Wort „Brennstoff“ einzufügen.
- source_word: תִּהְיֶה
  choice: du wirst ... werden
  rationale: Das Qal-Imperfekt steht in der 2. Person Femininum Singular und redet die personifizierte Größe direkt an.
- source_word: דָּמֵךְ
  choice: dein Blut
  rationale: Dies entspricht dem unmittelbaren Wortlaut und lässt offen, ob im Kontext zugleich Blutvergießen oder Blutschuld mitschwingt.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: mitten im Land
  rationale: Die Wendung bewahrt die räumliche Hervorhebung von בְּתוֹךְ und klingt im modernen Deutsch natürlicher als „inmitten des Landes“.
- source_word: לֹא תִזָּכֵרִי
  choice: an dich wird man sich nicht mehr erinnern
  rationale: Die unpersönliche deutsche Form gibt das passive Niphal idiomatisch wieder. „Nicht mehr“ bringt das endgültige Vergessen im Kontext zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Das Perfekt in der prophetischen Gerichtsformel vermittelt die feierliche Endgültigkeit des Ausspruchs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; die Transliteration bewahrt den persönlichen Namen.
- issue: Bedeutungsumfang von דָּמֵךְ
  choice: dein Blut
  alternative: deine Blutschuld
  rationale: Der Haupttext bleibt beim konkreten Wortlaut und entscheidet nicht stillschweigend, ob hier Blut, Blutvergießen oder Blutschuld gemeint ist. Die mögliche forensisch-moralische Bedeutung wird in der Fußnote genannt.
- issue: Niphal von זכר
  choice: an dich wird man sich nicht mehr erinnern
  alternative: du wirst nicht mehr erwähnt werden
  rationale: „Erinnern“ bildet die Grundbedeutung von זכר ab; „erwähnen“ ist möglich, würde den Sinn jedoch stärker auf sprachliche Nennung beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Femininum Singular. Die bildhafte Gerichtssprache bleibt erhalten; altertümliche Syntax und unnötige Explikation wurden vermieden.
