base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/022.yaml
  text: And I too will strike my hands together[a], and I will satisfy my wrath. I, Yahweh[b], have spoken.
translation:
  language: de
  text: Auch ich werde meine Hände zusammenschlagen[a] und meinen Zorn zur Ruhe bringen[b]. Ich, Jahwe, habe gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Hand gegen meine Hand schlagen“; gemeint ist ein nachdrückliches Zusammenschlagen der Hände als Zeichen des Gerichts.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Zorn stillen“. Das hebräische Bild bezeichnet, dass der Zorn durch den vollständigen Vollzug des Gerichts zur Ruhe kommt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Auch ich
  rationale: Gibt die additive und zugleich betonte Wendung im natürlichen Deutschen wieder.
- source_word: אַכֶּה כַפִּי אֶל כַּפִּי
  choice: werde meine Hände zusammenschlagen
  rationale: Bewahrt das körperliche Bild und die nachdrückliche, nicht freudige Handlung des hebräischen Ausdrucks.
- source_word: וַהֲנִחֹתִי חֲמָתִי
  choice: werde meinen Zorn zur Ruhe bringen
  rationale: Gibt die Kausativform von נוח eng wieder und bewahrt, statt sie aufzulösen, die spannungsvolle Vorstellung, dass der Zorn durch den Vollzug des Gerichts zur Ruhe kommt.
- source_word: חֲמָתִי
  choice: meinen Zorn
  rationale: Natürliches, würdevolles Deutsch für den heftigen göttlichen Zorn im Gerichtskontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Bewahrt die feierliche prophetische Bekräftigungsformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Zur-Ruhe-Kommen des göttlichen Zorns
  choice: meinen Zorn zur Ruhe bringen
  alternative: meinen Zorn stillen
  rationale: Die gewählte Formulierung wahrt die hebräische Bildsprache und lässt offen erkennbar, dass der Zorn durch das vollzogene Gericht zur Ruhe gebracht wird; „stillen“ wäre glatter, aber stärker deutend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Auch ich“ erhält die Betonung des hebräischen Pronomens; „zur Ruhe bringen“ bewahrt die auffällige Bildsprache des Ausgangstextes.
