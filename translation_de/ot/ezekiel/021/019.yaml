  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Anrede, den prophetischen Gestus, die Wiederholung von „Schwert“ und den konkreten Singular „des großen Erschlagenen“ grundsätzlich gut. Die Hauptfassung „soll sich verdoppeln, ja verdreifachen“ legt jedoch eine fortlaufende Steigerung fest, die der schwierigen Form שְׁלִישִׁתָה nicht sicher entspricht. Sie sollte als „zum dritten Mal“ wiedergegeben und die Alternative in der Anmerkung belassen werden.
  naturalness: „Prophezeie“ ist im modernen Standarddeutsch natürlicher als „weissage“, ohne den würdigen prophetischen Registerton zu verlieren. „Zum dritten Mal verdoppelt werden“ ist zudem verständlicher und syntaktisch näher am hebräischen Ausdruck als die gegenwärtige Steigerungsformel.
  terminology: „Menschensohn“, „Schwert“, „Erschlagene“ und „der große Erschlagene“ sind beizubehalten. Die feminine Relativform „die“ nimmt eindeutig auf „das Schwert“ Bezug. Die Alternativen zum abschließenden Partizip sollen dessen Bedeutungsspielraum nicht unnötig einengen.
