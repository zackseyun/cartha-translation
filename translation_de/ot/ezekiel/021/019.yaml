- from: Und du, Menschensohn, weissage und schlag Handfläche gegen Handfläche.[a] Das Schwert soll sich verdoppeln, ja verdreifachen[b] — das Schwert der Erschlagenen. Es ist das Schwert des großen Erschlagenen, das auf sie eindringt.[c]
