  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֕א וְ/הַ֖ךְ כַּ֣ף אֶל כָּ֑ף וְ/תִכָּפֵ֞ל חֶ֤רֶב שְׁלִישִׁ֨תָ/ה֙ חֶ֣רֶב חֲלָלִ֔ים הִ֗יא חֶ֚רֶב חָלָ֣ל הַ/גָּד֔וֹל הַ/חֹדֶ֖רֶת לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/019.yaml
  text: And you[a], son of man, prophesy and strike palm to palm, and let the sword be doubled a third time—the sword of the slain. It is the sword of the great slain one[c][b], the one that presses in on them.
translation:
  language: de
  text: Und du, Menschensohn, prophezeie und schlag Handfläche gegen Handfläche.[a] Das Schwert soll zum dritten Mal verdoppelt werden[b] – das Schwert der Erschlagenen. Es ist das Schwert des großen Erschlagenen, die auf sie eindringt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „klatsche in die Hände“. Wörtlich: „schlag Handfläche gegen Handfläche“; es handelt sich um eine prophetische Gebärde.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist mehrdeutig. Sie kann auch bedeuten: „Das Schwert soll dreifach werden“ oder „zum dritten Mal verdoppelt werden“.'
    reason: textual_ambiguity
  - marker: c
    text: 'Oder: „die in sie eindringt“, „die sie bedrängt“ oder „die sie umschließt“. Das hebräische Partizip kann Eindringen, Vordringen oder Umschließen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel typische hebräische Anredeformel in ihrer im Deutschen vertrauten, formal transparenten Gestalt.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Der Nifal-Imperativ von נבא bezeichnet hier den prophetischen Auftrag; da in diesem Satz kein Objekt genannt ist, bleibt die Wiedergabe ohne Ergänzung.
- source_word: וְהַךְ כַּף אֶל כָּף
  choice: schlag Handfläche gegen Handfläche
  rationale: Gibt die konkrete prophetische Gebärde nah am hebräischen Wortlaut wieder; die idiomatischere Alternative „klatsche in die Hände“ steht in der Fußnote.
- source_word: וְתִכָּפֵל חֶרֶב שְׁלִישִׁתָה
  choice: Das Schwert soll sich verdoppeln, ja verdreifachen
  rationale: Die passive beziehungsweise jussivische Aussage und die schwer deutbare Verbindung mit שְׁלִישִׁתָה werden in natürlichem Deutsch als Steigerung wiedergegeben, ohne die mögliche Bedeutung „zum dritten Mal“ zu verschweigen.
- source_word: חֶרֶב חֲלָלִים
  choice: das Schwert der Erschlagenen
  rationale: Bewahrt die nominale Konstruktverbindung und ihre mögliche Zuordnung zu den durch das Schwert Erschlagenen.
- source_word: חֶרֶב חָלָל הַגָּדוֹל
  choice: das Schwert des großen Erschlagenen
  rationale: Nimmt חָלָל als konkreten Singular und erhält damit die auffällige Spannung zwischen den zuvor genannten Erschlagenen im Plural und dem großen Erschlagenen im Singular.
- source_word: הַחֹדֶרֶת לָהֶם
  choice: das auf sie eindringt
  rationale: Gibt die feindliche, eindringende Bewegung des Partizips von חדר wieder, ohne festzulegen, ob ein körperliches Durchbohren oder ein bedrängendes Vordringen gemeint ist.
theological_decisions:
- issue: Bezug des Ausdrucks חָלָל הַגָּדוֹל
  choice: 'konkreter Singular: „des großen Erschlagenen“'
  alternative: 'kollektive oder abstrakte Deutung: „des großen Gemetzels“'
  rationale: Die grammatische Singularform mit bestimmtem Adjektiv wird bewahrt; eine bestimmte historische oder messianische Identifikation wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung von „Schwert“ und „Erschlagenen“ sowie die knappe prophetische Befehlsform bleiben erhalten. Die schwer deutbare Steigerung „verdoppeln/verdreifachen“ wird lesbar formuliert und zugleich durch eine Fußnote offengehalten.
