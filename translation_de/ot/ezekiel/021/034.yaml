base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/034.yaml
  text: while they see false visions for you and divine lies for you[a], to place you on the necks of the slain wicked[c][b], whose day has come at the time of the punishment of the end.
translation:
  language: de
  text: Während man für dich Trug schaut und für dich Lügen wahrsagt,[a] um dich an die Hälse der erschlagenen Frevler zu legen,[b] deren Tag zur Zeit der Schuld am Ende gekommen ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn man für dich Falsches schaut und für dich Täuschung wahrsagt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an die Hälse der erschlagenen Frevler“; das Bild ist schwer zu deuten. Möglicherweise bedeutet es, dich unter die bereits Erschlagenen zu bringen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zur Zeit der Strafe des Endes“; auch möglich: „zur Zeit der Schuld des Endes“ beziehungsweise „zur Zeit der endgültigen Schuld“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲזוֹת לָךְ שָׁוְא
  choice: Während man dir Nichtiges schaut
  rationale: Der Infinitiv mit ב wird temporal wiedergegeben. Das unbestimmte „man“ lässt das im Kontext vorausgesetzte Subjekt offen. „Nichtiges“ bewahrt bei שָׁוְא die Spannweite von Unwahrem, Leerem und Wertlosem.
- source_word: בִּקְסָם לָךְ כָּזָב
  choice: und dir Lüge wahrsagt
  rationale: Die parallele Infinitivkonstruktion bezeichnet mantische Tätigkeit. „Lüge wahrsagen“ ist verständlich und erhält die zugespitzte Verbindung von Weissagung und Falschheit.
- source_word: לָתֵת אוֹתָךְ
  choice: sollst du … gelegt werden
  rationale: Der lamed-Infinitiv drückt hier die Zielrichtung bzw. Folge der falschen Schau aus. Das Passiv passt zum angesprochenen Schwert und zum folgenden Ortsbild.
- source_word: אֶל צַוְּארֵי חַלְלֵי רְשָׁעִים
  choice: an die Nacken der erschlagenen Frevler
  rationale: Die schwierige konkrete Metapher wird nicht aufgelöst. אֶל wird mit „an“ wiedergegeben; חַלְלֵי רְשָׁעִים bezeichnet am ehesten Frevler, die erschlagen wurden.
- source_word: אֲשֶׁר בָּא יוֹמָם
  choice: deren Tag gekommen ist
  rationale: Bewahrt die ausdrückliche Tagesmetaphorik und den Gerichtston.
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: zur Zeit der Schuld am Ende
  rationale: Die knappe und mehrdeutige hebräische Fügung bleibt in der Hauptfassung bewusst offen. עָוֺן kann Schuld, Sünde oder deren Strafe bezeichnen; קֵץ kann attributiv oder als Genitivbezug verstanden werden.
theological_decisions:
- issue: Bedeutung von עֲוֺן in der Gerichtsformel
  choice: Schuld
  alternative: Strafe beziehungsweise endgültige Schuld
  rationale: „Schuld“ bewahrt die primäre moralisch-juristische Bedeutung, ohne den möglichen Folgesinn „Strafe“ auszuschließen. Die Alternativen werden in der Fußnote genannt.
- issue: Das Bild von den Nacken der Erschlagenen
  choice: Das konkrete Bild wird beibehalten
  alternative: dich unter die erschlagenen Frevler bringen
  rationale: Da die genaue Bildlogik unsicher ist, soll die Übersetzung sie nicht durch eine eindeutige Deutung ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. Die ungewöhnlichen Wendungen „Lüge wahrsagen“ und „an die Nacken“ spiegeln bewusst die prägnante beziehungsweise schwierige hebräische Ausdrucksweise; Fußnoten sichern die Verständlichkeit und die echten Deutungsalternativen.
