source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנָּבֵ֤א וְ/אָֽמַרְתָּ֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה אֶל בְּנֵ֥י עַמּ֖וֹן וְ/אֶל חֶרְפָּתָ֑/ם וְ/אָמַרְתָּ֗ חֶ֣רֶב חֶ֤רֶב פְּתוּחָה֙ לְ/טֶ֣בַח מְרוּטָ֔ה לְ/הָכִ֖יל לְמַ֥עַן בָּרָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/033.yaml
  text: 'And you[a], son of man, prophesy and say, ‘Thus says the Lord GOD concerning the sons of Ammon and concerning their reproach’: And you shall say, ‘A sword, a sword, drawn for slaughter, polished for devouring[c][b], so that it flashes like lightning.’'
translation:
  language: de
  text: 'Du aber, Menschensohn, weissage und sage: »So spricht Herr Yahweh über die Ammoniter[a] und über ihren Hohn[b]. Sage: ›Ein Schwert, ein Schwert, gezückt zum Schlachten, blank gemacht zum Verzehren, damit es wie ein Blitz funkelt.[c]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Ammons«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »über ihre Schmähung« oder »über ihre Schmach«.'
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Formulierung ist knapp; auch möglich: »blank gemacht, um zu verzehren und wie ein Blitz zu funkeln«.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels wiederkehrende göttliche Anrede und ihre literarische Prägekraft, ohne sie deutend aufzulösen.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Gibt sowohl den Herrentitel als auch den im Ausgangstext stehenden Gottesnamen wieder und vermeidet eine Verdoppelung von »Herr«.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Ist im heutigen Deutsch die natürliche Bezeichnung für das Volk; die wörtliche Form wird in einer Fußnote bewahrt.
- source_word: חֶרְפָּתָם
  choice: ihren Hohn
  rationale: Das Substantiv kann Hohn, Schmähung oder Schmach bezeichnen. »Hohn« passt zum feindseligen Spott im Zusammenhang, ohne die Bezugsrichtung genauer festzulegen als der hebräische Text.
- source_word: חֶרֶב חֶרֶב
  choice: Ein Schwert, ein Schwert
  rationale: Bewahrt die emphatische Wiederholung des hebräischen Textes.
- source_word: פְּתוּחָה
  choice: gezückt
  rationale: Bei einem Schwert bezeichnet das Wort idiomatisch den Zustand des Herausgezogen- oder Entblößtseins.
- source_word: לְטֶבַח
  choice: zum Schlachten
  rationale: Gibt die Zweckbestimmung knapp wieder und bewahrt die Härte des Bildes.
- source_word: מְרוּטָה
  choice: blank gemacht
  rationale: Bezeichnet hier das Polieren oder Blankmachen der Klinge, das ihr blitzartiges Funkeln ermöglicht.
- source_word: לְהָכִיל
  choice: zum Verzehren
  rationale: Im gewaltsamen Zusammenhang ist zerstörendes Aufzehren gemeint; die bildhafte und leicht ungewöhnliche Ausdrucksweise des Ausgangstextes bleibt erhalten.
- source_word: לְמַעַן בָּרָק
  choice: damit es wie ein Blitz funkelt
  rationale: Macht die knappe, elliptische Wendung verständlich und bewahrt das Bild des blitzartigen Glanzes der polierten Klinge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Der Eigenname wird als »Yahweh« wiedergegeben, während אֲדֹנָי mit »Herr« erhalten bleibt; dadurch sind beide Elemente der hebräischen Verbindung sichtbar.
- issue: Bezugsrichtung von חֶרְפָּתָם
  choice: über ihren Hohn
  alternative: über ihre Schmach
  rationale: »Ihr Hohn« kann den von den Ammonitern ausgehenden Spott bezeichnen, während die Präposition »über« die Aussage nicht ausdrücklich in »gegen« umdeutet. Die alternative Bedeutung »ihre Schmach« bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener prophetischer Wiederholung. »Weissage« und »Menschensohn« sichern den wiederkehrenden Sprachduktus Hesekiels; »Ammoniter« und »blank gemacht« bleiben zugleich allgemein verständlich.
