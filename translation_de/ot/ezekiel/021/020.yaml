base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/020.yaml
  text: so that the heart may melt and the stumbling blocks may be many[a]. At all their gates I have set the flash of the sword. Ah! It is made for lightning[b], drawn for slaughter.
translation:
  language: de
  text: damit die Herzen verzagen und die Stolpersteine sich mehren.[a] An all ihren Toren habe ich den Glanz des Schwertes gesetzt. Ach! Es ist zum Blitzen gemacht, zum Schlachten geschärft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und viele kommen zu Fall“. Das hebräische Substantiv kann Stolpersteine, das Straucheln oder den daraus folgenden Sturz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Wortlaut der Schlusszeile ist schwierig. Statt „zum Schlachten geschärft“ sind auch Deutungen wie „zum Schlachten gezogen“, „poliert“ oder allgemein „zugerichtet“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן לָמוּג לֵב
  choice: damit jedes Herz verzagt
  rationale: Die Wendung bezeichnet den Verlust von Mut und Entschlossenheit. „Verzagt“ gibt die idiomatische Bedeutung in natürlichem Deutsch wieder; „jedes“ macht den kollektiv gebrauchten Singular verständlich.
- source_word: וְהַרְבֵּה הַמִּכְשֹׁלִים
  choice: und viele zu Fall kommen
  rationale: מִכְשׁוֹל kann den Stolperstein, das Straucheln oder den daraus folgenden Sturz bezeichnen. Im Gerichtskontext ist der verbreitete Zusammenbruch gemeint; die gegenständlichere Alternative bleibt in der Fußnote erhalten.
- source_word: עַל כָּל שַׁעֲרֵיהֶם
  choice: An allen ihren Toren
  rationale: Die Präpositionalphrase lokalisiert die drohende Gegenwart des Schwertes an sämtlichen Toren.
- source_word: נָתַתִּי
  choice: habe ich ... aufgestellt
  rationale: Im Kontext bezeichnet das Verb ein gezieltes Platzieren; „aufgestellt“ wirkt beim bedrohlich bereitstehenden Schwert natürlich.
- source_word: אִבְחַת חָרֶב
  choice: das Blitzen des Schwertes
  rationale: Das seltene Substantiv wird hier als Glanz oder Aufblitzen verstanden, passend zum folgenden בָרָק.
- source_word: אָח
  choice: Ach!
  rationale: Die Interjektion bewahrt den abrupten emotionalen Ausruf, ohne ihn eindeutig als Klage oder Triumph festzulegen.
- source_word: עֲשׂוּיָה לְבָרָק
  choice: Zum Blitzen ist es bereit
  rationale: בָרָק bezeichnet Blitz oder Aufleuchten. Die Wiedergabe vermittelt, dass das Schwert so zugerichtet ist, dass es blitzend aufleuchtet, und vermeidet das im Deutschen missverständliche „für den Blitz gemacht“.
- source_word: מְעֻטָּה לְטָבַח
  choice: zum Schlachten geschärft
  rationale: Die seltene Form ist textlich und lexikalisch schwierig. Der Zusammenhang verlangt eine für das Töten zugerichtete Waffe; „geschärft“ ist verständlich, während alternative Deutungen in der Fußnote genannt werden.
