  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם שִׂים לְ/ךָ֣ שְׁנַ֣יִם דְּרָכִ֗ים לָ/בוֹא֙ חֶ֣רֶב מֶֽלֶךְ בָּבֶ֔ל מֵ/אֶ֥רֶץ אֶחָ֖ד יֵצְא֣וּ שְׁנֵי/הֶ֑ם וְ/יָ֣ד בָּרֵ֔א בְּ/רֹ֥אשׁ דֶּֽרֶךְ עִ֖יר בָּרֵֽא־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/024.yaml
  text: And you[a], son of man, set for yourself two roads for the sword of the king of Babylon to come by; both of them shall go out from one land. And make a signpost[b]; make it at the head of the road to the city.
translation:
  language: de
  text: Und du, Menschensohn, lege dir zwei Wege an, auf denen das Schwert des Königs von Babylon kommen soll. Beide sollen von einem Land ausgehen. Fertige einen Wegweiser[a] an; fertige ihn am Anfang des Weges zu einer Stadt[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Hand“; hier wahrscheinlich ein Richtungszeichen oder Wegweiser.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Kopf des Weges zur Stadt“; gemeint sein kann der Beginn des Weges oder seine Hauptabzweigung.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel feststehende Anredeformel wird idiomatisch und traditionsnah wiedergegeben und wahrt den Gegensatz zwischen dem menschlichen Propheten und Gott.
- source_word: שִׂים לְךָ שְׁנַיִם דְּרָכִים
  choice: lege dir zwei Wege fest
  rationale: Die Formulierung bewahrt den Bezug von לְךָ und beschreibt verständlich die symbolische Festlegung zweier Routen, ohne eine bestimmte Ausführungsweise vorauszusetzen.
- source_word: לָבוֹא חֶרֶב מֶלֶךְ בָּבֶל
  choice: auf denen das Schwert des Königs von Babylon kommen soll
  rationale: Das Schwert bleibt als prophetische Metonymie für den militärischen Angriff erhalten; der Relativsatz verbindet sein Kommen im Deutschen natürlich mit den Wegen.
- source_word: מֵאֶרֶץ אֶחָד יֵצְאוּ שְׁנֵיהֶם
  choice: Beide sollen von ein und demselben Land ausgehen
  rationale: Die gemeinsame Herkunft der beiden Wege wird klar ausgedrückt; „ein und dasselbe“ gibt den kontrastiven Sinn von אֶחָד im Kontext natürlich wieder.
- source_word: יָד
  choice: Wegweiser
  rationale: Wörtlich bedeutet das Wort „Hand“, bezeichnet hier aber wahrscheinlich ein Richtungszeichen an der Wegteilung. „Wegweiser“ vermittelt die Funktion, während die Fußnote die wörtliche Bedeutung nennt.
- source_word: בָּרֵא
  choice: fertige … an
  rationale: Das selten gebrauchte Verb bezeichnet hier wahrscheinlich ein Herstellen oder Formen. Die allgemeine Wiedergabe vermeidet eine unbelegte Festlegung auf Schneiden oder Einritzen.
- source_word: בְּרֹאשׁ דֶּרֶךְ עִיר
  choice: am Anfang des Weges zu einer Stadt
  rationale: „Anfang“ gibt רֹאשׁ formal wieder, ohne die mögliche Bedeutung als Hauptabzweigung stillschweigend festzulegen. Das artikellose עִיר wird als „einer Stadt“ wiedergegeben.
theological_decisions:
- issue: Das Schwert als handelndes Subjekt
  choice: Das Bild vom kommenden Schwert wird wörtlich bewahrt.
  alternative: Den Ausdruck als Anmarsch des babylonischen Heeres erklären.
  rationale: Die personifizierende, gerichtstheologische Bildsprache des hebräischen Textes soll nicht durch eine ausdeutende Paraphrase ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Schwertmetapher und die knappe Anweisung bleiben erhalten; seltene oder mehrdeutige Wegterminologie wird nicht unnötig präzisiert.
