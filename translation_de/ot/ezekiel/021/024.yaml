  to: Und du, Menschensohn, lege dir zwei Wege an, auf denen das Schwert des Königs von Babylon kommen soll. Beide sollen von einem Land ausgehen. Fertige einen Wegweiser[a] an; fertige ihn am Anfang des Weges zu einer Stadt[b] an.
  rationale: Die Revision ersetzt lediglich die im Deutschen abstrakte Formulierung „Wege festlegen“ durch „Wege anlegen“ und ordnet die zweite, wiederholte Herstellungsanweisung direkter. Sie bewahrt die metaphorische Darstellung des Schwertes, die Unbestimmtheit von „einer Stadt“ und die in den Fußnoten dokumentierten lexikalischen bzw. syntaktischen Alternativen.
