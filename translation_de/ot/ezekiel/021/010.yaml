source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל בָּשָׂ֔ר כִּ֚י אֲנִ֣י יְהוָ֔ה הוֹצֵ֥אתִי חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ לֹ֥א תָשׁ֖וּב עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/010.yaml
  text: And all flesh will know that I[a], Yahweh, have drawn my sword from its sheath; it will not return again.
translation:
  language: de
  text: Und alles Fleisch[a] wird erkennen, dass ich, Jahwe, mein Schwert aus seiner Scheide gezogen habe; es wird nicht mehr zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die ganze Menschheit; alle Menschen. Wörtlich: alles Fleisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und … wird erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang Zukunfts- bzw. Folgesinn. Der Singular entspricht im Deutschen dem Kollektivausdruck »alles Fleisch«.
- source_word: כָּל בָּשָׂר
  choice: alles Fleisch
  rationale: Die wörtliche Wiedergabe bewahrt die eindringliche biblische Wendung und ihre über Israel hinausreichende Bedeutung; verständlichere Umschreibungen werden in der Fußnote genannt.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich, Jahwe,
  rationale: כִּי leitet hier den Inhalt des Erkennens ein. Die Apposition hebt den Sprecher und seinen Namen hervor, ohne das Hebräische zum anders gebauten Satz »dass ich Jahwe bin« umzuformen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als im Deutschen geläufige Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוֹצֵאתִי חַרְבִּי
  choice: mein Schwert … gezogen habe
  rationale: הוֹצֵאתִי bedeutet wörtlich »herausgebracht habe«; in Verbindung mit Schwert und Scheide ist »gezogen habe« die natürliche deutsche Formulierung.
- source_word: מִתַּעְרָהּ
  choice: aus seiner Scheide
  rationale: »Scheide« ist die übliche Bezeichnung für die Hülle eines Schwertes. Das deutsche Possessivpronomen richtet sich grammatisch nach »Schwert«.
- source_word: לֹא תָשׁוּב עוֹד
  choice: es wird nicht mehr zurückkehren
  rationale: Das feminine Verb bezieht sich auf das Schwert, im Deutschen daher »es«. »Nicht mehr« gibt die Verbindung von Negation und עוֹד natürlich wieder, ohne sie unnötig zu »niemals« zu verstärken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als persönlichen Namen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Umfang von כָּל בָּשָׂר
  choice: alles Fleisch
  alternative: alle Menschen
  rationale: Die bildhafte Kollektivbezeichnung bleibt erhalten und wird nicht stillschweigend auf eine bestimmte Gruppe eingeengt; die gemeinte menschliche Gesamtheit wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Erkenntnisformel und das Bild vom gezogenen Schwert bleiben bewusst deutlich und knapp.
