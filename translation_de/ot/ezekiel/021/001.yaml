  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Eingangsformel wird וַיְהִי im Deutschen natürlich mit „kam“ wiedergegeben; ein wörtlicheres „war“ wäre unnötig steif.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier die von Gott ausgehende Mitteilung. „Das Wort“ bewahrt die geprägte prophetische Formel und bleibt näher am Hebräischen als das deutendere „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen wissenschaftlichen Transkription des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person bezeichnet die Richtung zum Propheten und entspricht unmittelbar dem deutschen „zu mir“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende Gottesrede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion präzise, ohne das schwerfällige „indem er sprach“ oder „mit den Worten“ einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch den Titel „der HERR“ zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „Das Wort Jahwes kam zu mir“ bleibt erhalten. לֵאמֹר wird idiomatisch durch den die folgende Rede eröffnenden Doppelpunkt ausgedrückt.
