id: EZK.21.17
reference: Ezekiel 21:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זְעַ֤ק וְ/הֵילֵל֙ בֶּן אָדָ֔ם כִּי הִיא֙ הָיתָ֣ה בְ/עַמִּ֔/י הִ֖יא בְּ/כָל נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל מְגוּרֵ֤י אֶל חֶ֨רֶב֙ הָי֣וּ אֶת עַמִּ֔/י לָ/כֵ֖ן סְפֹ֥ק אֶל יָרֵֽךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/017.yaml
  text: Cry out and wail[a], son of man, for it has come upon my people; it is upon all the princes of Israel. They are given over to the sword along with my people[b]; therefore strike your thigh.
translation:
  language: de
  text: Schrei auf und klage laut, Menschensohn! Denn es ist über mein Volk gekommen; es ist über alle Fürsten Israels gekommen. Dem Schwert[a] preisgegeben sind sie zusammen mit meinem Volk. Darum schlag dir auf den Schenkel[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieses Satzteils ist schwierig. Möglich ist auch: »Schrecken vor dem Schwert sind über mein Volk gekommen.«'
    reason: alternative_reading
  - marker: b
    text: Sich auf den Schenkel zu schlagen war eine Gebärde der Trauer, des Entsetzens oder der Klage.
    reason: cultural_note
lexical_decisions:
- source_word: זְעַק
  choice: Schrei auf
  rationale: Der Imperativ bezeichnet einen kräftigen Schrei aus Not. »Schrei auf« gibt diese Intensität in natürlichem Deutsch wieder.
- source_word: וְהֵילֵל
  choice: und klage laut
  rationale: ילל bezeichnet laute Toten- oder Unheilsklage. »Klage laut« wahrt den Sinn, ohne das im Deutschen leicht animalisch oder umgangssprachlich wirkende »heule« zu verwenden.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Dies ist die charakteristische Anrede Ezechiels. Die etablierte deutsche Wiedergabe bleibt verständlich und bildet die hebräische Form knapp ab.
- source_word: כִּי הִיא הָיְתָה בְעַמִּי
  choice: Denn es ist über mein Volk gekommen
  rationale: Das feminine Pronomen verweist im Zusammenhang wahrscheinlich auf das Schwert oder das hereinbrechende Gericht. Das deutsche neutrale »es« bewahrt diese Offenheit; »über … gekommen« drückt das Eintreffen des Unheils aus.
- source_word: הִיא בְּכָל נְשִׂיאֵי יִשְׂרָאֵל
  choice: es ist über alle Fürsten Israels gekommen
  rationale: Die Wiederholung des Pronomens und die Parallelität zum vorigen Satzteil werden erhalten. »Fürsten« bezeichnet hier die politisch führenden Personen Israels.
- source_word: מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: Dem Schwert preisgegeben sind sie
  rationale: Der schwierige hebräische Ausdruck wird als Auslieferung beziehungsweise schutzlose Preisgabe an das Schwert verstanden. Die vorangestellte Formulierung erhält den Nachdruck des Satzes; eine andere Deutung wird in der Fußnote genannt.
- source_word: אֶת עַמִּי
  choice: zusammen mit meinem Volk
  rationale: 'אֶת wird hier assoziativ verstanden: Die Fürsten teilen das Geschick des Volkes.'
- source_word: סְפֹק אֶל יָרֵךְ
  choice: schlag dir auf den Schenkel
  rationale: Die konkrete Gebärde der Trauer und Bestürzung wird unmittelbar und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezug des femininen Pronomens הִיא
  choice: Wiedergabe mit dem offenen deutschen Pronomen »es«, das im Zusammenhang auf das Schwert oder allgemeiner auf das hereinbrechende Gericht weisen kann.
  alternative: Das Bezugswort ausdrücklich als »das Schwert« oder »das Unheil« einsetzen.
  rationale: Der hebräische Text nennt in diesem Vers kein neues ausdrückliches Bezugswort. Die pronominale Wiedergabe vermeidet, die genuine Spannung zwischen Schwert und allgemeinerem Gericht unnötig festzulegen.
- issue: Deutung von מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: Die Fürsten sind zusammen mit dem Volk dem Schwert preisgegeben.
  alternative: »Schrecken vor dem Schwert sind über mein Volk gekommen.«
  rationale: Die Hauptfassung ergibt im unmittelbaren Zusammenhang einen verständlichen Parallelismus und bewahrt das gemeinsame Gericht über Fürsten und Volk. Wegen der erheblichen sprachlichen Unsicherheit wird die alternative Deutung ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Dringlichkeit. Die Wiederholung in den beiden הִיא-Sätzen bleibt erhalten. »Klage laut« vermeidet sowohl altertümliches »wehklage« als auch das leicht missverständliche »heule«; »preisgegeben« und »Fürsten« wahren den gehobenen, aber allgemein verständlichen Ton.
