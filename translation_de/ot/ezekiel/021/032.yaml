base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/032.yaml
  text: A ruin[a], a ruin, a ruin—I will make it. This also shall not be, until he comes whose right it is[b], and I will give it to him.
translation:
  language: de
  text: Trümmer, Trümmer, Trümmer[a] werde ich daraus machen. Auch dies wird keinen Bestand haben, bis der kommt, dem das Recht zusteht[b]; ihm werde ich es geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Umsturz, Umsturz, Umsturz werde ich daraus machen.“ Das Hebräische wiederholt das Substantiv dreimal zur Verstärkung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „dem das Gericht gehört“ oder „dem es rechtmäßig zusteht“. Die Formulierung wird oft als Anspielung auf 1. Mose 49,10 und damit als Hinweis auf den Messias verstanden; der hebräische Text benennt die Person jedoch nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַוָּה עַוָּה עַוָּה
  choice: Trümmer, Trümmer, Trümmer
  rationale: Die dreifache nominale Wiederholung kündigt nachdrücklich völlige Zerstörung beziehungsweise Umwälzung an. „Trümmer“ bewahrt die Substantivform und wirkt im modernen Deutschen als eindringlicher Ausruf natürlich.
- source_word: אֲשִׂימֶנָּה
  choice: werde ich daraus machen
  rationale: שׂים bedeutet „setzen, machen, versetzen“. Die idiomatische Wendung nimmt das angekündigte Trümmerbild auf, ohne den im Hebräischen nicht ausdrücklich genannten Gegenstand näher festzulegen.
- source_word: גַּם זֹאת לֹא הָיָה
  choice: Auch dies wird keinen Bestand haben
  rationale: Das prophetische Perfekt wird zukunftsbezogen verstanden. „Keinen Bestand haben“ gibt das wörtliche „nicht sein“ in verständlichem Deutsch wieder, ohne eine endgültige Vernichtung über den Wortlaut hinaus festzuschreiben.
- source_word: עַד בֹּא
  choice: bis der kommt
  rationale: Die Formulierung bewahrt die offene persönliche Bezugnahme, die durch den folgenden Relativsatz näher bestimmt wird.
- source_word: אֲשֶׁר לוֹ הַמִּשְׁפָּט
  choice: dem das Recht zusteht
  rationale: מִשְׁפָּט kann Gericht, Recht oder rechtmäßigen Anspruch bezeichnen. Im Zusammenhang der Herrschaftsnachfolge bringt „dem das Recht zusteht“ den Anspruch zum Ausdruck, ohne die Person ausdrücklich zu identifizieren.
- source_word: וּנְתַתִּיו
  choice: ihm werde ich es geben
  rationale: Das Objekt bleibt wie im Hebräischen nur aus dem Zusammenhang erschließbar; die Übersetzung wahrt diese Offenheit und gibt den göttlichen Akt der Übertragung natürlich wieder.
theological_decisions:
- issue: Messianischer oder unmittelbar historischer Bezug dessen, „dem das Recht zusteht“
  choice: Die Person bleibt im Haupttext unbenannt; die Formulierung bezeichnet lediglich ihren rechtmäßigen Anspruch.
  alternative: Ausdrückliche Identifizierung als kommender messianischer König aus dem Haus Davids oder als zeitnaher historischer Herrscher.
  rationale: Der Wortlaut kann an 1. Mose 49,10 erinnern und messianisch verstanden werden, nennt die betreffende Person jedoch nicht. Die offene Formulierung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter dreifacher Wiederholung. Die Satzstellung im Schlusssatz hebt wie der hebräische Text den künftigen rechtmäßigen Empfänger hervor; unklare Bezugsgrößen werden nicht unnötig konkretisiert.
