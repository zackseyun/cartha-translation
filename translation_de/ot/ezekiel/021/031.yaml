  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָסִיר֙ הַ/מִּצְנֶ֔פֶת וְ/הָרִ֖ים הָֽ/עֲטָרָ֑ה זֹ֣את לֹא זֹ֔את הַ/שָּׁפָ֣לָה הַגְבֵּ֔הַ וְ/הַ/גָּבֹ֖הַ הַשְׁפִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/031.yaml
  text: 'Thus says the Lord GOD: Remove the turban[a], and take off the crown. This will not remain the same: exalt the lowly[b], and humble the exalted.'
translation:
  language: de
  text: 'So spricht Jahwe, der Herr: Nimm den Turban[b] ab und entferne die Krone! So wird es nicht bleiben:[a] Erhöhe das Niedrige und erniedrige das Hohe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „Dies nicht dies.“ Auch möglich: „Dies soll nicht mehr sein“ oder „Dies wird nicht sein wie zuvor.“ Die Wendung kündigt eine Umkehrung der bisherigen Ordnung an.'
    reason: alternative_reading
  - marker: b
    text: Der „Turban“ kann besonders die priesterliche Kopfbedeckung bezeichnen, die „Krone“ königliche Herrschaft. Der Text verkündet die Beseitigung bestehender Rang- und Herrschaftszeichen.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Verbindung gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne die beiden Elemente zu verschmelzen.
- source_word: הָסִיר הַמִּצְנֶפֶת
  choice: Nimm den Turban ab
  rationale: Der Hifil-Imperativ fordert zur Entfernung auf; מִצְנֶפֶת bezeichnet eine gewundene Kopfbedeckung, häufig den priesterlichen Turban.
- source_word: וְהָרִים הָעֲטָרָה
  choice: und entferne die Krone
  rationale: רום bedeutet im Hifil wörtlich „emporheben“; im Zusammenhang ist das Abheben und damit Entfernen der Krone gemeint. „Entferne“ klingt im Deutschen bei einer Krone natürlicher als „hebe ab“.
- source_word: זֹאת לֹא זֹאת
  choice: So wird es nicht bleiben
  rationale: Die knappe, elliptische Wendung kündigt an, dass der bestehende Zustand keinen Bestand hat, ohne die genaue Art der Veränderung über das Hebräische hinaus festzulegen.
- source_word: הַשָּׁפָלָה הַגְבֵּהַ
  choice: Das Niedrige werde erhöht
  rationale: Die substantivierten Adjektive und der Hifil-Imperativ werden formal nah wiedergegeben; „das Niedrige“ lässt offen, ob Personen, Rang oder Ordnung im Blick sind.
- source_word: וְהַגָּבֹהַ הַשְׁפִּיל
  choice: und das Hohe erniedrigt
  rationale: Die spiegelbildliche Formulierung bewahrt das Motiv der völligen Umkehrung und die sachliche Offenheit des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR
  rationale: „der Herr, Jahwe“ macht Titel und Eigenname jeweils sichtbar und vermeidet die missverständliche Doppelung „der Herr HERR“.
- issue: Bezug von Turban und Krone
  choice: Im Haupttext nicht ausdrücklich Priestertum und Königtum zuordnen
  alternative: Priesterlichen Turban und Königskrone ausdrücklich benennen
  rationale: Die Gegenstände können priesterliche beziehungsweise königliche Autorität symbolisieren, doch der Vers selbst nennt ihre Träger nicht. Die mögliche Bedeutung wird deshalb nur in der Fußnote erläutert.
- issue: Modus der Umkehrungsbefehle
  choice: Das Niedrige werde erhöht und das Hohe erniedrigt
  alternative: Erhöhe das Niedrige und erniedrige das Hohe
  rationale: Die hebräischen Imperative lassen sich als prophetische Befehle verstehen. Die deutsche Jussivform bewahrt ihren feierlichen Dekretcharakter, ohne einen ausdrücklich genannten menschlichen Adressaten einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gottesrede bleibt knapp und eindringlich; die elliptische hebräische Aussage wird lesbar gemacht, ihre Mehrdeutigkeit jedoch in einer Fußnote bewahrt.
