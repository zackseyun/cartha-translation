  source_fidelity: Die Übersetzung gibt die hebräische Konstruktion und die Abfolge der militärischen Vorbereitungen zuverlässig wieder. „In seiner rechten Hand war das Losorakel für Jerusalem“ wahrt die konkrete Bildlichkeit von בִּימִינוֹ und den divinatorischen Befund, ohne die im Kontext vorausgehenden Verfahren unnötig auszudeuten. Die Wiederholung von „Rammböcke aufzustellen“ entspricht der Wiederholung von לָשׂוּם כָּרִים. Die Wiedergaben „gegen die Tore“, „eine Belagerungsrampe aufzuschütten“ und „ein Belagerungswerk zu bauen“ treffen den Belagerungskontext und lassen bei דָּיֵק die sachliche Unbestimmtheit bestehen.
