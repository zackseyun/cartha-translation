  terminology: „Losorakel“ ist im gegebenen Divinationskontext präzise; „Rammböcke“, „Belagerungsrampe“ und „Belagerungswerk“ sind fachlich angemessen. „Belagerungswerk“ vermeidet bei דָּיֵק eine nicht abgesicherte Einengung auf Wall oder Turm. Die Fußnoten sind korrekt verankert und benennen echte lexikalisch-sachliche Alternativen, ohne den Haupttext zu überladen.
