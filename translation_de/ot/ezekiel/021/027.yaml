  text: בִּֽ/ימִינ֞/וֹ הָיָ֣ה הַ/קֶּ֣סֶם יְרוּשָׁלִַ֗ם לָ/שׂ֤וּם כָּרִים֙ לִ/פְתֹּ֤חַ פֶּה֙ בְּ/רֶ֔צַח לְ/הָרִ֥ים ק֖וֹל בִּ/תְרוּעָ֑ה לָ/שׂ֤וּם כָּרִים֙ עַל שְׁעָרִ֔ים לִ/שְׁפֹּ֥ךְ סֹלְלָ֖ה לִ/בְנ֥וֹת דָּיֵֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/027.yaml
  text: 'In his right hand was the divination for Jerusalem: to set battering rams[a], to open the mouth with slaughter, to raise the voice with a battle cry, to set battering rams against the gates, to heap up a siege ramp[b], to build a siege wall.'
translation:
  language: de
  text: 'In seiner rechten Hand war das Losorakel für Jerusalem: Rammböcke aufzustellen, den Mund zum Gemetzel zu öffnen[a], die Stimme zum Schlachtruf zu erheben, Rammböcke gegen die Tore aufzustellen, eine Belagerungsrampe aufzuschütten und ein Belagerungswerk zu bauen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „den Mund zum Töten zu öffnen“. Gemeint sein kann der ausgerufene Befehl oder Schrei, der den Angriff und das Töten eröffnet.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine Belagerungsanlage; möglich sind je nach Bauart auch „Belagerungswall“ oder „Belagerungsturm“.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימִינוֹ
  choice: in seiner rechten Hand
  rationale: Die Wendung bezeichnet im Zusammenhang der Losbefragung konkret die rechte Hand des Königs und bewahrt das räumliche Bild des Hebräischen.
- source_word: הַקֶּסֶם
  choice: das Losorakel
  rationale: קֶסֶם bezeichnet hier die Wahrsagung beziehungsweise deren Orakelergebnis. „Losorakel“ passt zur vorausgehenden Entscheidungsszene und lässt offen, wie genau das Zeichen ermittelt wurde.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: לָשׂוּם כָּרִים
  choice: Rammböcke aufzustellen
  rationale: כָּרִים bezeichnet im Belagerungskontext Rammböcke; „aufzustellen“ gibt לָשׂוּם verständlich und sachgerecht wieder.
- source_word: לִפְתֹּחַ פֶּה בְּרֶצַח
  choice: den Mund zum Gemetzel zu öffnen
  rationale: Die ungewöhnliche Bildsprache „den Mund öffnen“ bleibt erhalten. „Gemetzel“ vermittelt die brutale Tötungsgewalt von רֶצַח im Belagerungskontext, ohne das Wort auf einen modernen juristischen Mordbegriff zu verengen.
- source_word: לְהָרִים קוֹל בִּתְרוּעָה
  choice: die Stimme zum Schlachtruf zu erheben
  rationale: Die Wiedergabe bewahrt das akustische Bild und verdeutlicht den militärischen Sinn von תְּרוּעָה.
- source_word: עַל שְׁעָרִים
  choice: gegen die Tore
  rationale: „Gegen“ bringt im Belagerungszusammenhang die Angriffsrichtung der Rammböcke natürlich zum Ausdruck.
- source_word: לִשְׁפֹּךְ סֹלְלָה
  choice: eine Belagerungsrampe aufzuschütten
  rationale: סֹלְלָה ist ein aufgeschütteter Belagerungsdamm beziehungsweise eine Angriffsrampe; „aufschütten“ entspricht dem konkreten Bauvorgang.
- source_word: לִבְנוֹת דָּיֵק
  choice: ein Belagerungswerk zu bauen
  rationale: דָּיֵק bezeichnet allgemein eine Belagerungsanlage; die bewusst umfassende Wiedergabe vermeidet eine unbelegte Festlegung auf Mauer oder Turm.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihe militärischer Infinitive und die eindringliche Wiederholung der Rammböcke bleiben erhalten; die ungewöhnliche Wendung vom Öffnen des Mundes wird nicht stillschweigend paraphrasiert.
