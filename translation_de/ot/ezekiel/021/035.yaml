source:
  edition: WLC
  text: הָשַׁ֖ב אֶל תַּעְרָ֑/הּ בִּ/מְק֧וֹם אֲשֶׁר נִבְרֵ֛את בְּ/אֶ֥רֶץ מְכֻרוֹתַ֖יִ/ךְ אֶשְׁפֹּ֥ט אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/035.yaml
  text: Return to your sheath[a]. In the place where you were created, in the land of your origins[b], I will judge you.
translation:
  language: de
  text: Kehre in deine Scheide zurück[a]. An dem Ort, an dem du erschaffen wurdest, im Land deiner Herkunft[b], werde ich dich richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Steck es wieder in seine Scheide.“ Wörtlich steht im Hebräischen: „Kehre zurück zu ihrer Scheide“; das Schwert ist dort grammatisch feminin und wird personifiziert.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Land deiner Geburt“ beziehungsweise „deines Ursprungs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁב אֶל תַּעְרָהּ
  choice: Kehre in deine Scheide zurück
  rationale: Die knappe Aufforderung bewahrt die unmittelbare Anrede und das Bild des personifizierten Schwertes. Das Deutsche verwendet wegen der direkten Anrede idiomatisch „deine Scheide“; die abweichende Person des hebräischen Suffixes und die mögliche transitive Auffassung werden in der Fußnote kenntlich gemacht.
- source_word: בִּמְקוֹם
  choice: An dem Ort
  rationale: Natürliche und genaue Wiedergabe der lokalen Bestimmung, die den Ort des kommenden Gerichts hervorhebt.
- source_word: נִבְרֵאת
  choice: du erschaffen wurdest
  rationale: Die Nifal-Form von ברא wird formal mit „erschaffen werden“ wiedergegeben. Die ungewöhnliche Anwendung auf ein Schwert bleibt erhalten und wird nicht deutend zu „geschmiedet“ verengt.
- source_word: בְּאֶרֶץ מְכֻרוֹתַיִךְ
  choice: im Land deiner Herkunft
  rationale: „Herkunft“ gibt den Bedeutungsbereich von Geburt, Ursprung und Abstammung in natürlichem modernem Deutsch wieder und passt sowohl zum Bild des Schwertes als auch zu dem dadurch bezeichneten Gemeinwesen.
- source_word: אֶשְׁפֹּט אֹתָךְ
  choice: werde ich dich richten
  rationale: „Richten“ bewahrt die gerichtliche Aussage von שפט knapp und würdevoll, ohne sie durch „Gericht vollstrecken“ stärker auszulegen.
theological_decisions:
- issue: Bezug der angeredeten Gestalt
  choice: Die unmittelbare Anrede gilt dem personifizierten Schwert; zugleich bleibt offen, wie unmittelbar das Gericht dem durch das Schwert dargestellten Volk oder Herrscher gilt.
  alternative: Die Anrede gilt direkt dem ammonitischen Volk oder seinem Herrscher, während das Schwert nur als Bild vorausgesetzt ist.
  rationale: Die Scheide und die grammatische Personifizierung stützen das Schwert als unmittelbaren Bildträger. Die Übersetzung löst die prophetische Bildsprache jedoch nicht vorschnell auf und bewahrt so die Spannung zwischen Bild und bezeichnetem Gerichtsempfänger.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Direktheit. Die ungewöhnliche Formulierung „erschaffen“ bleibt bewusst stehen, um die Bildspannung des Hebräischen nicht durch „geschmiedet“ oder eine andere Deutung aufzulösen.
