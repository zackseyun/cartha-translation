base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/015.yaml
  text: So that it may slaughter a slaughter[a], it is sharpened; so that it may have a flash, it is polished[b]. Or shall we rejoice? The scepter of my son despises every tree.
translation:
  language: de
  text: Damit es ein Gemetzel anrichtet, ist es geschärft; damit es aufblitzt[a], ist es poliert. Oder sollten wir uns freuen? Das Zepter meines Sohnes verachtet jeden Baum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit es einen Blitzschein bekommt« beziehungsweise »damit es glänzt«. Die hebräische Wendung ist verkürzt und beschreibt den Glanz des polierten Schwertes.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Schluss ist schwer verständlich. »Meines Sohnes« folgt dem masoretischen Text; manche beziehen die Worte weiter gefasst auf Juda oder auf Gottes Volk. »Jeden Baum« kann auch jeden hölzernen Stab oder jede hölzerne Waffe meinen.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן טְבֹחַ טֶבַח
  choice: damit es ein Gemetzel anrichtet
  rationale: Die Verbindung aus Infinitiv und stammverwandtem Substantiv verstärkt das Töten. »Ein Gemetzel anrichten« gibt diese Intensität in natürlichem modernem Deutsch wieder, ohne die im Deutschen schwer verständliche Wortwiederholung mechanisch nachzubilden.
- source_word: הוּחַדָּה
  choice: ist es geschärft
  rationale: Das feminine Suffix bezieht sich im Kontext auf das Schwert; die passive Form wird direkt wiedergegeben.
- source_word: הֱיֵה לָהּ בָּרָק
  choice: damit es aufblitzt
  rationale: Die hebräische Wendung ist elliptisch und kann einen Blitz, Lichtschein oder blitzartigen Glanz bezeichnen. »Aufblitzen« bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: מֹרָטָה
  choice: ist es poliert
  rationale: Das Wort bezeichnet das Glätten oder Polieren einer Klinge, sodass sie glänzt.
- source_word: אוֹ נָשִׂישׂ
  choice: Oder sollten wir uns freuen?
  rationale: Die abrupte rhetorische Wendung und die erste Person Plural bleiben erhalten.
- source_word: שֵׁבֶט
  choice: Zepter
  rationale: »Zepter« bringt im königlichen Gerichtskontext Herrschaft und Autorität zum Ausdruck; die ebenfalls mögliche Bedeutung »Stab« wird in der Fußnote genannt.
- source_word: בְּנִי
  choice: meines Sohnes
  rationale: Dies folgt der vokalisierten masoretischen Lesart, ohne die schwierige Stelle interpretierend auf Juda oder Gottes Volk festzulegen.
- source_word: מֹאֶסֶת
  choice: verachtet
  rationale: Das Verb bezeichnet verächtliche Zurückweisung; die syntaktische Zuordnung innerhalb der schwierigen Schlussklausel wird nicht geglättet.
- source_word: כָּל עֵץ
  choice: jeden Baum
  rationale: Die konkrete hebräische Formulierung bleibt im Haupttext erhalten; mögliche metaphorische Bezüge auf Holzstäbe oder Waffen werden in der Fußnote erläutert.
theological_decisions:
- issue: Deutung der textlich und syntaktisch schwierigen Schlussklausel
  choice: 'Die masoretische Lesart wird eng wiedergegeben: »Das Zepter meines Sohnes verachtet jeden Baum.«'
  alternative: Möglich sind Deutungen auf den Herrscherstab Judas beziehungsweise Gottes Volkes oder eine Konstruktion, in der das Schwert jeden hölzernen Stab oder jede hölzerne Waffe verwirft.
  rationale: Die Stelle ist in Syntax und Bildsprache unsicher, ohne dass eine Lehrfrage eine eindeutige Auflösung verlangt. Der Haupttext bewahrt deshalb die Spannung der masoretischen Überlieferung, während die Fußnote wichtige Deutungsmöglichkeiten offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ersten beiden Satzglieder sind rhythmisch parallel gestaltet. Die schwer verständliche Schlussklausel bleibt bewusst relativ formal; erklärende Alternativen stehen in den Fußnoten.
