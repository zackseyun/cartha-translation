  terminology: „Stöhnen“, „Nachricht“, „Herz“, „Hände“, „Geist“ und „Yahweh“ sind sachgerecht. Die Fußnote zur Knie-Wasser-Wendung bewahrt die textliche und physiologische Mehrdeutigkeit, ohne eine einzelne Deutung als sicher auszugeben.
