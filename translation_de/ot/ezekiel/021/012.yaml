source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמְר֣וּ אֵלֶ֔י/ךָ עַל מָ֖ה אַתָּ֣ה נֶאֱנָ֑ח וְ/אָמַרְתָּ֡ אֶל שְׁמוּעָ֣ה כִֽי בָאָ֡ה וְ/נָמֵ֣ס כָּל לֵב֩ וְ/רָפ֨וּ כָל יָדַ֜יִם וְ/כִהֲתָ֣ה כָל ר֗וּחַ וְ/כָל בִּרְכַּ֨יִם֙ תֵּלַ֣כְנָה מַּ֔יִם הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/012.yaml
  text: And it shall be[a], when they say to you, ‘Why are you groaning?’ that you shall say, ‘Because of the news, for it is coming.’ Then every heart will melt, all hands will grow weak, every spirit will faint, and all knees will run with water. Look, it is coming, and it will happen[b], declares the Lord GOD.
translation:
  language: de
  text: 'Und wenn sie dich fragen: »Warum stöhnst du?«, sollst du antworten: »Wegen der Nachricht[b], denn sie kommt.« Dann wird jedes Herz zerschmelzen, alle Hände werden erschlaffen, jeder Geist wird ermatten, und an allen Knien wird Wasser herablaufen[a]. Sieh, es kommt, und es wird geschehen – Spruch des Herrn Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Alle Knie werden Wasser laufen lassen.“ Das drastische Bild bezeichnet den Zusammenbruch vor Angst; es kann als kraftlos werdende Knie oder als Verlust der Körperkontrolle verstanden werden.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Wegen der Meldung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָח
  choice: stöhnst
  rationale: Das Verb bezeichnet ein hörbares Seufzen oder Stöhnen aus Schmerz. „Stöhnst“ bewahrt die körperliche und emotionale Stärke des Ausdrucks.
- source_word: שְׁמוּעָה
  choice: Nachricht
  rationale: Gemeint ist die eintreffende Kunde vom bevorstehenden Unheil. „Nachricht“ ist im heutigen Deutsch natürlich; „Meldung“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: וְנָמֵס כָּל לֵב
  choice: jedes Herz verzagen
  rationale: Die Formulierung gibt den Verlust von Mut wieder und behält zugleich das hebräische Bild des Herzens bei, ohne im Deutschen unnatürlich zu wirken.
- source_word: וְרָפוּ כָל יָדַיִם
  choice: alle Hände werden kraftlos
  rationale: Das körperliche Bild bezeichnet den Verlust von Kraft und Handlungsfähigkeit. „Kraftlos“ ist klar und nahe am hebräischen Ausdruck.
- source_word: וְכִהֲתָה כָּל רוּחַ
  choice: jeder Geist wird matt
  rationale: רוּחַ kann hier innere Kraft, Mut oder Geist bezeichnen. „Geist“ bewahrt die Mehrdeutigkeit, während „matt“ den Zusammenbruch der inneren Widerstandskraft ausdrückt.
- source_word: וְכָל בִּרְכַּיִם תֵּלַכְנָה מַּיִם
  choice: an allen Knien wird Wasser herablaufen
  rationale: Die ungewöhnliche, drastische Körpermetapher wird bewahrt und nicht vorschnell als bloße Knieschwäche oder als Verlust der Körperkontrolle festgelegt.
- source_word: הִנֵּה
  choice: Sieh
  rationale: „Sieh“ gibt den dringlichen, hinweisenden Charakter der Partikel in würdigem, verständlichem Deutsch wieder.
- source_word: וְנִהְיָתָה
  choice: es wird geschehen
  rationale: Die Wendung bestätigt die sichere Verwirklichung des angekündigten Ereignisses und bleibt zugleich nahe am Hebräischen.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „Yahweh“ den im Text stehenden Gottesnamen erkennbar bewahrt und die Doppelung „Herr HERR“ vermeidet.
theological_decisions:
- issue: Bedeutung der Wasser-Wendung bei den Knien
  choice: Das konkrete hebräische Bild bleibt im Haupttext stehen.
  alternative: „Alle Knie werden weich wie Wasser“ oder eine ausdrückliche Deutung als Verlust der Körperkontrolle.
  rationale: Der Ausdruck kann lähmende Angst und körperlichen Zusammenbruch bezeichnen; seine genaue physiologische Vorstellung ist umstritten. Die Übersetzung legt sich deshalb nicht auf nur eine Deutung fest.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und macht transparent, dass der hebräische Text ausdrücklich den Gottesnamen enthält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. Körperbilder des Hebräischen werden soweit möglich erhalten; schwer verständliche oder mehrdeutige Bilder werden durch Fußnoten erläutert, nicht im Haupttext vereinheitlicht.
