source:
  edition: WLC
  text: יַ֛עַן אֲשֶׁר הִכְרַ֥תִּי מִמֵּ֖/ךְ צַדִּ֣יק וְ/רָשָׁ֑ע לָ֠/כֵן תֵּצֵ֨א חַרְבִּ֧/י מִ/תַּעְרָ֛/הּ אֶל כָּל בָּשָׂ֖ר מִ/נֶּ֥גֶב צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/009.yaml
  text: Because I will cut off from you both the righteous and the wicked[b][a], therefore my sword will go out from its sheath against all flesh from south to north.
translation:
  language: de
  text: Weil ich aus dir Gerechte und Frevler ausrotten werde[a], darum wird mein Schwert aus seiner Scheide hervorgehen gegen alles Fleisch[b], vom Süden bis zum Norden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgerottet habe“. Die hebräische Perfektform kann eine abgeschlossene Handlung oder im prophetischen Zusammenhang eine zukünftige, als gewiss dargestellte Handlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Alles Fleisch“ ist eine verbreitete hebräische Bezeichnung für alle sterblichen Menschen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Die Wortverbindung leitet den Grund für das angekündigte Gericht ein. „Weil“ gibt den kausalen Sinn in natürlichem modernem Deutsch wieder.
- source_word: הִכְרַתִּי
  choice: ich … ausrotten werde
  rationale: כרת bedeutet hier, Menschen „abzuschneiden“ beziehungsweise zu beseitigen. Die Perfektform kann im prophetischen Zusammenhang eine sicher bevorstehende Handlung bezeichnen; „ausrotten werde“ ist im Deutschen verständlich und bewahrt den ernsten Gerichtston.
- source_word: מִמֵּךְ
  choice: aus dir
  rationale: Die feminine Singularform richtet sich an das zuvor angesprochene Land. „Aus dir“ übersetzt die Präposition direkt, ohne ausdrücklich „aus deiner Mitte“ hinzuzufügen.
- source_word: צַדִּיק וְרָשָׁע
  choice: Gerechte und Frevler
  rationale: Das Gegensatzpaar bezeichnet beide Gruppen ohne Ausnahme. „Gerechte“ und „Frevler“ sind prägnant, würdevoll und theologisch nicht weiter ausdeutend.
- source_word: לָכֵן
  choice: darum
  rationale: Das Wort kennzeichnet die Folge des vorangehenden Grundes. „Darum“ stellt den logischen Zusammenhang klar und natürlich her.
- source_word: תֵּצֵא חַרְבִּי
  choice: mein Schwert … wird … fahren
  rationale: Die Formulierung erhält das lebendige Bild, dass Gottes Schwert selbst aus der Scheide hervorgeht, statt es lediglich passiv als „gezogen“ zu beschreiben.
- source_word: מִתַּעְרָהּ
  choice: aus seiner Scheide
  rationale: „Scheide“ ist die geläufige deutsche Bezeichnung für die Hülle eines Schwertes; das Suffix bezieht sich auf das Schwert.
- source_word: אֶל כָּל בָּשָׂר
  choice: gegen alles Fleisch
  rationale: Die wörtliche Wendung bewahrt das biblische Bild für sterbliche Menschen. „Gegen“ entspricht der feindlichen Zielrichtung des Schwertes.
- source_word: מִנֶּגֶב צָפוֹן
  choice: vom Süden bis zum Norden
  rationale: Die beiden Richtungsangaben bezeichnen die ganze Ausdehnung des Landes. Die Wiedergabe als Himmelsrichtungen ist hier natürlicher als die Deutung von נגב als Eigenname „Negev“.
theological_decisions:
- issue: Das Gericht trifft Gerechte und Frevler
  choice: Die Aussage bleibt uneingeschränkt stehen, dass das kommende Schwert Gerechte wie Frevler im Land trifft.
  alternative: „Gerechte“ als nur scheinbar Gerechte deuten oder ausdrücklich zwischen zeitlichem Gericht und endgültiger Verdammnis unterscheiden.
  rationale: Der hebräische Text beschreibt die umfassenden Folgen eines geschichtlichen Gerichts, ohne an dieser Stelle eine theologische Einschränkung vorzunehmen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Bildsprache. Die ungewöhnliche Wendung „alles Fleisch“ bleibt im Haupttext stehen und wird in der Fußnote erläutert; die Spannung zwischen Gerechten und Frevlern wird nicht geglättet.
