  text: And the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Das Wayyiqtol von היה eröffnet hier die nächste Mitteilung in der üblichen prophetischen Erzählformel. Im Deutschen wird die Wendung natürlich zusammen mit דְבַר … אֵלַי als „Und das Wort … kam zu mir“ wiedergegeben.
- source_word: דְבַר
  choice: das Wort
  rationale: Im Status-constructus-Ausdruck דְבַר יְהוָה bezeichnet das Substantiv die von Jahwe ausgehende prophetische Mitteilung. „Wort“ bewahrt sowohl die feste Formel als auch ihre theologische Prägung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im modernen Deutschen etablierten Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bezeichnet die Richtung zum Propheten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende Gottesrede ein. Ein Doppelpunkt erfüllt diese Funktion im natürlichen modernen Deutsch präziser als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen und verwendet die im Deutschen geläufige Transkription, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel bleibt erkennbar; לֵאמֹר wird idiomatisch durch den die folgende direkte Rede ankündigenden Doppelpunkt ausgedrückt.
