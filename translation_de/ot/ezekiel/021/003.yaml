source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לְ/יַ֣עַר הַ/נֶּ֔גֶב שְׁמַ֖ע דְּבַר יְהוָ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה הִנְ/נִ֣י מַֽצִּית בְּ/ךָ֣ אֵ֡שׁ וְ/אָכְלָ֣ה בְ/ךָ֣ כָל עֵֽץ לַח֩ וְ/כָל עֵ֨ץ יָבֵ֤שׁ לֹֽא תִכְבֶּה֙ לַהֶ֣בֶת שַׁלְהֶ֔בֶת וְ/נִצְרְבוּ בָ֥/הּ כָּל פָּנִ֖ים מִ/נֶּ֥גֶב צָפֽוֹנָ/ה־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/003.yaml
  text: 'And say to the forest of the Negev[a], ‘Hear the word of Yahweh. Thus says the Lord GOD: Behold, I am kindling a fire in you, and it will consume in you every green tree and every dry tree. The blazing flame will not be quenched[b], and by it every face from south to north will be scorched.’'
translation:
  language: de
  text: 'Und sage zum Wald des Südlands[a]: »Höre das Wort Jahwes! So spricht der Herr Jahwe: Sieh, ich werde in dir ein Feuer entzünden. Es wird in dir jeden grünen und jeden dürren Baum verzehren. Die lodernde Flamme wird nicht erlöschen, und durch sie werden alle Gesichter vom Süden bis zum Norden versengt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Wald des Negev“. Das hebräische negev kann „Süden/Südland“ bedeuten oder die Negevregion bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַר הַנֶּגֶב
  choice: Wald des Südlands
  rationale: יַעַר bedeutet „Wald/Waldland“, während נֶגֶב sowohl den Süden bzw. das Südland als auch die Negevregion bezeichnen kann. „Südland“ erhält die Richtungsbedeutung und lässt den geografischen Bezug offen; die Alternative „Negev“ steht in der Fußnote.
- source_word: שְׁמַע דְּבַר יְהוָה
  choice: Höre das Wort Jahwes
  rationale: Der Imperativ wird als feierlicher prophetischer Aufruf direkt wiedergegeben. „Höre“ bewahrt gegenüber „Hör zu“ den würdevollen, aber verständlichen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ transliteriert, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Verbindung aus אֲדֹנָי und dem Gottesnamen wird transparent als Titel plus Eigenname wiedergegeben und vermeidet typografische Ersatzlösungen.
- source_word: הִנְנִי מַצִּית בְּךָ אֵשׁ
  choice: Sieh, ich werde in dir ein Feuer entzünden
  rationale: הִנְנִי leitet eine nachdrückliche göttliche Ankündigung ein. Die deutsche Futurform gibt die unmittelbar bevorstehende Handlung natürlich wieder; „in dir“ wahrt den räumlichen Bezug des hebräischen בְּךָ.
- source_word: וְאָכְלָה בְךָ
  choice: Es wird in dir … verzehren
  rationale: Das feminine Verb bezieht sich auf das Feuer. „Verzehren“ ist im Deutschen die natürliche und bildkräftige Verbindung mit Feuer.
- source_word: כָל עֵץ לַח וְכָל עֵץ יָבֵשׁ
  choice: jeden grünen und jeden dürren Baum
  rationale: לַח bezeichnet hier einen feuchten, frischen beziehungsweise grünen Baum; יָבֵשׁ den trockenen oder dürren. „Grün“ und „dürr“ bilden im Zusammenhang mit einem Waldbrand einen klaren natürlichen Gegensatz.
- source_word: לֹא תִכְבֶּה לַהֶבֶת שַׁלְהֶבֶת
  choice: Die lodernde Flamme wird nicht erlöschen
  rationale: Die emphatische Flammenformulierung wird idiomatisch mit „lodernde Flamme“ wiedergegeben. „Nicht erlöschen“ bewahrt das Bild eines unaufhaltsamen Gerichtsfeuers, ohne einen ausdrücklich handelnden Löscher einzutragen.
- source_word: וְנִצְרְבוּ בָהּ כָּל פָּנִים
  choice: durch sie werden alle Gesichter … versengt
  rationale: Das seltene Verb bezeichnet Versengen oder Verbrennen durch Hitze. „Gesichter“ übersetzt פָּנִים konkret und erhält die auffällige Bildsprache, statt sie als Landoberfläche oder Menschenmenge auszudeuten.
- source_word: מִנֶּגֶב צָפוֹנָה
  choice: vom Süden bis zum Norden
  rationale: Die knappe hebräische Richtungsangabe wird im Deutschen idiomatisch als umfassende Ausdehnung vom Süden zum Norden formuliert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn als solchen und unterscheidet ihn vom Titel אֲדֹנָי.
- issue: Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form bildet sowohl den Herrschertitel als auch den Gottesnamen sichtbar ab, ohne die traditionelle Ersatzlesung in den Haupttext einzutragen.
- issue: Deutung des Waldbrandes
  choice: Die konkrete Wald- und Feuerbildsprache bleibt erhalten
  alternative: Den Wald im Vers ausdrücklich als Juda deuten
  rationale: Der Vers selbst formuliert ein prophetisches Bild. Seine geschichtliche beziehungsweise theologische Referenz soll nicht erläuternd in die Übersetzung eingebaut werden.
- issue: Bedeutung von כָּל פָּנִים
  choice: alle Gesichter
  alternative: die ganze Oberfläche / alle Menschen
  rationale: Die wörtliche Bildform ist im Kontext auffällig, aber verständlich. Eine Festlegung auf Landfläche oder Bevölkerung würde die mögliche Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Kurze, klare Sätze tragen die Ankündigung; konkrete Bilder und Wiederholungen des Hebräischen bleiben erhalten. „Sieh“ ist gegenüber dem archaischeren „Siehe“ gewählt, während „Jahwe“ den Gottesnamen transparent wiedergibt.
