    rationale: Die passive Partizipialform מֻעָדוֹת beschreibt hier die festgelegte bzw. ausgerichtete Richtung. „Gerichtet ist“ ist eine naheliegende, idiomatische Wiedergabe und wird auch von der vorhandenen Alternativfußnote gestützt.
