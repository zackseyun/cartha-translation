source:
  edition: WLC
  text: הִתְאַחֲדִ֥י הֵימִ֖נִי הָשִׂ֣ימִי הַשְׂמִ֑ילִי אָ֖נָה פָּנַ֥יִ/ךְ מֻעָדֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/021.yaml
  text: Gather yourself[a]; go to the right; set yourself to the left[c][b], wherever your face is appointed.
translation:
  language: de
  text: Sammle dich[a], geh nach rechts, stell dich nach links, wohin auch immer dein Gesicht gerichtet ist[b][c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Vereinige dich“, „fasse dich zusammen“ oder im Zusammenhang „konzentriere dich“. Das seltene reflexive hebräische Verb bezeichnet wahrscheinlich ein Sammeln oder Konzentrieren vor dem Zuschlagen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „dein Gesicht“; damit kann im Hebräischen auch die Richtung gemeint sein, in die man gewandt ist.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wohin auch immer dein Gesicht festgelegt ist“ oder „wohin auch immer dein Gesicht bestimmt ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְאַחֲדִי
  choice: Sammle dich
  rationale: Der seltene reflexive Imperativ in der 2. Person Singular Femininum bezeichnet hier wahrscheinlich ein Sich-Sammeln oder Konzentrieren vor dem Zuschlagen. „Sammle dich“ bewahrt die reflexive Form und passt zur personifizierten Waffe im Zusammenhang.
- source_word: הֵימִנִי
  choice: geh nach rechts
  rationale: Der Imperativ ist von der Bezeichnung für die rechte Seite gebildet. „Geh nach rechts“ gibt die knappe Richtungsanweisung in natürlichem Deutsch wieder.
- source_word: הָשִׂימִי הַשְׂמִילִי
  choice: stell dich nach links
  rationale: הָשִׂימִי bezeichnet ein Setzen oder Stellen, während הַשְׂמִילִי die Richtung nach links angibt. Die reflexive deutsche Wendung entspricht der Folge femininer Singularimperative.
- source_word: אָנָה
  choice: wohin auch immer
  rationale: Das Richtungsadverb leitet hier eine offene Zielangabe ein. „Wohin auch immer“ ist gegenwärtiges, idiomatisches Deutsch und erhält die Unbestimmtheit.
- source_word: פָּנַיִךְ
  choice: dein Gesicht
  rationale: Die wörtliche Körpermetapher bleibt erhalten; „Gesicht“ kann im Hebräischen zugleich die Richtung bezeichnen, in die jemand oder etwas gewandt ist.
- source_word: מֻעָדוֹת
  choice: bestimmt ist
  rationale: Die passive Form von יעד vermittelt, dass die Ausrichtung festgesetzt, zugewiesen oder gelenkt ist. „Bestimmt ist“ wahrt den passiven Sinn, ohne festzulegen, ob Befehl, Zielsetzung oder göttliche Verfügung gemeint ist.
theological_decisions:
- issue: Personifizierte Adressatin und kriegerisches Bild
  choice: Die femininen Singularimperative werden unmittelbar an die im Kontext personifizierte Waffe gerichtet, ohne im Vers selbst „Schwert“ einzufügen.
  alternative: „Schwert“ ausdrücklich als Anrede ergänzen oder die Befehle auf ein Heer beziehen.
  rationale: Im hebräischen Vers steht keine ausdrückliche Anrede, doch der unmittelbare Zusammenhang personifiziert das Schwert. Der knappe Wortlaut lässt den Kontext die Adressatin bestimmen und vermeidet eine erklärende Ergänzung.
translation_notes:
  register: Knappe, befehlende und militärisch gespannte Sprache in modernem Standarddeutsch. Die ungewöhnliche Folge von Rechts- und Linksbefehl sowie die Metapher vom „Gesicht“ bleiben bewusst stehen; der Gedankenstrich markiert lediglich den Übergang zur Zielangabe.
