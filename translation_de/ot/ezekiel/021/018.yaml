base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/018.yaml
  text: For there is a testing[b][a]; and what if even the scepter that despises will not remain? declares the Lord GOD.
translation:
  language: de
  text: Denn es ist eine Prüfung;[a] und was, wenn selbst das Zepter, das verachtet, nicht mehr bestehen wird?[b] – Ausspruch Yahwehs, des Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut dieses Verses ist ungewöhnlich knapp und besonders im folgenden Satzteil schwer zu deuten.
    reason: textual_difficulty
  - marker: b
    text: 'Andere mögliche Wiedergabe: »Und was, wenn selbst das verachtende Zepter nicht mehr sein wird?« Das hebräische Wort für »Zepter« kann auch »Stab« oder »Stamm« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt die begründende oder erläuternde Verbindung zum vorausgehenden Zusammenhang.
- source_word: בֹחַן
  choice: es ist eine Prüfung
  rationale: Gibt die knappe, elliptische Form wieder, ohne einen nicht genannten Prüfenden oder Gegenstand zu ergänzen.
- source_word: וּמָה אִם גַּם
  choice: und was, wenn selbst
  rationale: Erhält den schwer verständlichen rhetorisch-konditionalen Charakter und die Verstärkung durch גַּם.
- source_word: שֵׁבֶט
  choice: Zepter
  rationale: Im Kontext des Gerichts und der Herrschaft liegt die königliche beziehungsweise richterliche Bedeutung näher als »Stab« oder »Stamm«.
- source_word: מֹאֶסֶת
  choice: das verachtet
  rationale: Bewahrt den aktiven Sinn des femininen Partizips und bezieht ihn grammatisch auf das im Deutschen sächliche »Zepter«.
- source_word: לֹא יִהְיֶה
  choice: nicht mehr bestehen wird
  rationale: Gibt das wörtliche »nicht sein wird« im Kontext als Aufhören beziehungsweise Nichtfortbestehen wieder, ohne die Aussage unnötig festzulegen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: Eine formnahe und im prophetischen Register würdige Wiedergabe der Botenformel; der Gottesname bleibt als Yahweh erkennbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr, der HERR
  rationale: »Yahweh« bewahrt den offenbarten Eigennamen und vermeidet die missverständliche Doppelung »Herr HERR«.
- issue: Bezug und Sinn von שֵׁבֶט מֹאֶסֶת
  choice: das Zepter, das verachtet
  alternative: das verachtete Zepter; das Zepter der Verwerfung; der Stamm, der verachtet
  rationale: Der schwierige hebräische Wortlaut wird nicht theologisch geglättet. Die aktive Bedeutung des Partizips bleibt im Haupttext erhalten; andere mögliche Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper prophetischer Diktion. Die im Hebräischen echte syntaktische und semantische Unsicherheit wird im Haupttext bewahrt und durch Fußnoten kenntlich gemacht.
