base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/005.yaml
  text: Then I said[a], “Ah, Lord GOD! They are saying of me[b], ‘Is he not a speaker of parables?’”
translation:
  language: de
  text: 'Da sagte ich: „Ach, Herr Yahweh! Sie sagen über mich[a]: ‚Redet er nicht in Gleichnissen[b]?‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sagen zu mir: ‚Redet er nicht in Gleichnissen?‘“ Das Hebräische kann sowohl bezeichnen, was man Ezechiel sagt, als auch was man über ihn sagt.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: memaschel meschalim, eine Verbindung aus Verb und Substantiv derselben Wortwurzel. Gemeint sein kann auch bildhafte, sprichwortartige oder rätselhafte Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da sagte ich“ gibt die Abfolge im modernen Deutsch natürlich wieder.
- source_word: אֲהָהּ
  choice: Ach
  rationale: Die Interjektion drückt Klage oder Bestürzung aus; „Ach“ ist im Deutschen natürlich und würdevoll.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Die Wiedergabe bewahrt sowohl den Herrentitel als auch den Gottesnamen und vermeidet das missverständliche „Herr HERR“.
- source_word: הֵמָּה אֹמְרִים לִי
  choice: Sie sagen über mich
  rationale: לִי kann formal „zu mir“ heißen, bezeichnet hier aber wahrscheinlich, wie die Leute Ezechiel charakterisieren. Die alternative syntaktische Auffassung wird in Fußnote [a] erhalten.
- source_word: הֲלֹא
  choice: Redet er nicht
  rationale: Die rhetorische Frage erwartet Zustimmung; die deutsche Negativfrage bewahrt diese Wirkung.
- source_word: מְמַשֵּׁל מְשָׁלִים
  choice: redet … ständig in Gleichnissen
  rationale: Die figura etymologica aus Verb und Substantiv bezeichnet das Vortragen bildhafter, sprichwortartiger oder rätselhafter Rede. „In Gleichnissen reden“ ist verständlich; „ständig“ vermittelt im Kontext den abwertenden Unterton, ohne „nur“ ausdrücklich in den hebräischen Wortlaut einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Herr GOTT
  rationale: „Herr Yahweh“ unterscheidet Titel und Eigenname transparent. Eine typografische Ersatzform wie „Herr GOTT“ ist traditionsgebunden und verdeckt den im Hebräischen vorhandenen Namen.
- issue: Art der von Ezechiel gebrauchten Rede
  choice: Gleichnisse
  alternative: Rätsel / Sprichwörter
  rationale: מָשָׁל hat ein breites Bedeutungsspektrum. „Gleichnisse“ passt zum unmittelbaren Vorwurf, während die Fußnote die mögliche figurative, sprichwortartige oder rätselhafte Nuance offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Rede bleibt lebendig; „ständig“ lässt den spöttisch-abwertenden Vorwurf erkennen. Sämtliche Fußnotenmarker stehen im Haupttext.
