  text: וְ/שָׁפַכְתִּ֤י עָלַ֨יִ/ךְ֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י אָפִ֣יחַ עָלָ֑יִ/ךְ וּ/נְתַתִּ֗י/ךְ בְּ/יַד֙ אֲנָשִׁ֣ים בֹּֽעֲרִ֔ים חָרָשֵׁ֖י מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/036.yaml
  text: And I will pour out my indignation on you[a]; with the fire of my wrath I will blow on you, and I will give you into the hand of brutal men[b], craftsmen of destruction.
translation:
  language: de
  text: Und ich werde meinen Zorn über dich ausgießen; mit dem Feuer meines Grimms werde ich dich anblasen. Ich werde dich in die Hand brutaler Männer[a] geben, die Verderben schmieden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hitziger Männer; wörtlich möglicherweise: brennender Männer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Meister der Vernichtung; wörtlich: Handwerker des Verderbens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Und ich werde … ausgießen
  rationale: Die geläufige Metapher des Ausgießens göttlichen Zorns bleibt erhalten und klingt im Deutschen natürlich.
- source_word: זַעְמִי
  choice: meinen Zorn
  rationale: „Zorn“ gibt die starke, gerichtliche Empörung wieder, ohne die Intensität durch eine unnötige Paraphrase zu steigern.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: mit dem Feuer meines Grimms
  rationale: „Grimm“ unterscheidet עֶבְרָה von זַעַם und bewahrt zugleich das intensive Feuerbild.
- source_word: אָפִיחַ עָלָיִךְ
  choice: werde ich dich anblasen
  rationale: Die konkrete Blasemetapher und ihr möglicher Bezug zum Anfachen eines Feuers bleiben sichtbar; das feminine Singularobjekt wird im Deutschen mit „dich“ wiedergegeben.
- source_word: וּנְתַתִּיךְ בְּיַד
  choice: Ich werde dich in die Hand … geben
  rationale: Die hebräische Wendung für die Auslieferung in fremde Gewalt wird formal und dennoch verständlich bewahrt.
- source_word: אֲנָשִׁים בֹּעֲרִים
  choice: roher Männer
  rationale: „Roh“ vermittelt die im Kontext gemeinte brutale, unbarmherzige Art der Männer. Die mögliche wörtliche Deutung als „brennend“ bleibt in einer Fußnote erhalten.
- source_word: חָרָשֵׁי מַשְׁחִית
  choice: die Verderben schmieden
  rationale: Die Formulierung bewahrt das Bild fachkundiger Handwerker und gibt zugleich idiomatisch wieder, dass diese Männer gezielt Vernichtung hervorbringen.
theological_decisions:
- issue: Unterscheidung der beiden unmittelbar aufeinanderfolgenden Begriffe für göttlichen Zorn
  choice: זַעַם wird mit „Zorn“, עֶבְרָה mit „Grimm“ wiedergegeben.
  alternative: Beide Begriffe einheitlich mit „Zorn“ oder „Wut“ wiedergeben.
  rationale: Die verschiedenen, semantisch verwandten hebräischen Wörter verstärken einander. Zwei überlappende deutsche Begriffe erhalten diese rhetorische Spannung, ohne eine zusätzliche dogmatische Unterscheidung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftigen Gerichtsbilder des Ausgießens, Feuers, Anblasens und Schmiedens werden bewahrt; ungewöhnliche hebräische Ausdrücke werden im Haupttext verständlich formuliert und in den Fußnoten offengehalten.
