revisions:
- from: Und alle Menschen werden erkennen, dass ich, Jahwe, es angezündet habe. Es wird nicht erlöschen.
  to: Und alle Menschen[a] werden sehen, dass ich, Jahwe, es entzündet habe; es wird nicht erlöschen.
  rationale: Die Übersetzung ersetzt die interpretierende Wiedergabe »erkennen« durch das textnähere und natürliche »sehen«. Eine Fußnote dokumentiert die wörtliche hebräische Wendung, ohne den flüssigen deutschen Haupttext zu beeinträchtigen. Die übrigen Entscheidungen des Entwurfs, insbesondere »Jahwe«, die Feuermetaphorik und die futurische Formulierung, bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:02Z'
review_pass:
  verdict: revise
  source_fidelity: Die futurische Wiedergabe ist zutreffend, ebenso die Bezugnahme des femininen Suffixes in בִּעַרְתִּיהָ auf das Feuer im Kontext. »Erkennen« geht jedoch über וְרָאוּ hinaus, dessen konkrete Grundbedeutung hier »sehen« ist. Die Aussage, dass die Menschen daraus Erkenntnis gewinnen, bleibt als Implikation erhalten, sollte aber nicht anstelle des Verbs übersetzt werden.
  naturalness: »Und alle Menschen werden sehen, dass ich, Jahwe, es entzündet habe; es wird nicht erlöschen« ist modernes, klares und zugleich dem prophetischen Register angemessenes Standarddeutsch. Das Semikolon bildet die enge Verknüpfung der beiden hebräischen Teilsätze besser ab als ein harter Satzbruch.
  terminology: »Jahwe« gibt יהוה angemessen als Eigenname wieder. »Alle Menschen« ist eine natürliche idiomatische Wiedergabe von כָּל־בָּשָׂר; die wörtliche Formulierung sollte in einer Anmerkung dokumentiert werden. »entzündet« und »erlöschen« bewahren die Feuerbildlichkeit ohne zusätzliche Auslegung.
