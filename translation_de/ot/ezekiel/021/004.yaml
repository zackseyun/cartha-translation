  text: וְ/רָאוּ֙ כָּל בָּשָׂ֔ר כִּ֛י אֲנִ֥י יְהוָ֖ה בִּֽעַרְתִּ֑י/הָ לֹ֖א תִּכְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/004.yaml
  text: And all flesh will see that I[a], Yahweh, have kindled it; it will not be quenched.
translation:
  language: de
  text: Und alle Menschen[a] werden sehen, dass ich, Jahwe, es entzündet habe; es wird nicht erlöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: alles Fleisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Und ... werden erkennen
  rationale: Das Qal-Perfekt mit וְ steht im prophetischen Zusammenhang futurisch. »Erkennen« gibt hier die über das bloße Sehen hinausgehende Einsicht in Jahwes Urheberschaft natürlich wieder.
- source_word: כָּל בָּשָׂר
  choice: alle Menschen
  rationale: Die wörtliche Wendung »alles Fleisch« ist ein hebräisches Idiom für die gesamte Menschheit. »Alle Menschen« vermittelt den Sinn im modernen Deutschen klar und ohne eine unnatürliche Formulierung.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was alle erkennen werden, nicht primär eine Begründung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die übliche deutsche Form.
- source_word: בִּעַרְתִּיהָ
  choice: es angezündet habe
  rationale: בער bezeichnet das Entzünden oder In-Brand-Setzen. Das feminine Suffix nimmt das im Kontext genannte Feuer auf; das deutsche Pronomen richtet sich daher nach »Feuer«.
- source_word: לֹא תִּכְבֶּה
  choice: Es wird nicht erlöschen
  rationale: Das intransitive Verb כבה bezeichnet das Ausgehen beziehungsweise Erlöschen eines Feuers. Die aktive deutsche Form wahrt diese Nuance genauer als das passive »wird nicht gelöscht«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Umschrift als Eigenname bewahrt diese Unterscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das hebräische Idiom »alles Fleisch« wird verständlich als »alle Menschen« wiedergegeben; die knappe prophetische Aussage und die Bildsprache des unauslöschlichen Feuers bleiben erhalten.
