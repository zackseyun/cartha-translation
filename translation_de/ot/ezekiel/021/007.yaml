  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַטֵּ֖ף אֶל מִקְדָּשִׁ֑ים וְ/הִנָּבֵ֖א אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/007.yaml
  text: Son of man[a], set your face toward Jerusalem, and preach toward the sanctuaries, and prophesy against the land of Israel.
translation:
  language: de
  text: Du Mensch[a], richte deinen Blick auf Jerusalem, sprich gegen die Heiligtümer[b] und weissage gegen das Land Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Menschensohn“ beziehungsweise „Menschenskind“; eine feste Anrede an Ezechiel, die seine menschliche Stellung hervorhebt.'
    reason: Der hebräische Ausdruck wird erläutert, ohne seine idiomatische Bedeutung auf die missverständliche deutsche Form „Sohn eines Menschen“ zu verengen.
  - marker: b
    text: 'Hebräisch wörtlich etwa: „lass gegen die Heiligtümer tropfen/träufeln“; ein Bild für prophetisches Reden.'
    reason: Die Fußnote bewahrt das ungewöhnliche Bild von נטף, während der Haupttext dessen verständliche kommunikative Funktion wiedergibt.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Du Mensch
  rationale: Die feste Anrede an Ezechiel wird in natürlichem modernem Deutsch wiedergegeben. Sie bezeichnet hier seine menschliche Stellung und prophetische Berufung, nicht einen messianischen Titel.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: richte dein Gesicht auf
  rationale: Bewahrt das hebräische Bild einer bewussten, entschlossenen Hinwendung zur prophetischen Konfrontation.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: וְהַטֵּף
  choice: lass deine Worte … strömen
  rationale: נטף bedeutet wörtlich „tropfen/träufeln“ und bezeichnet hier bildhaft prophetisches Reden. „Worte strömen lassen“ hält das Quellbild erkennbar und vermittelt zugleich den Sprechakt.
- source_word: מִקְדָּשִׁים
  choice: die Heiligtümer
  rationale: Gibt den morphologischen Plural und den kultischen Sinn wieder, ohne die Referenz vorschnell auf mehrere Tempel einzuengen.
- source_word: וְהִנָּבֵא
  choice: weissage gegen
  rationale: Direkte Wiedergabe des Imperativs von נבא; „gegen“ macht in diesem Gerichtswort die feindliche Ausrichtung deutlich.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: das Land Israel
  rationale: In diesem territorial-nationalen Zusammenhang ist „Land“ natürlicher und treffender als „Erdboden“ oder „Ackerboden“.
theological_decisions:
- issue: Bedeutung des prophetischen Ausdrucks וְהַטֵּף im Gerichtswort
  choice: Das Bild mit „lass deine Worte … strömen“ im Haupttext bewahren
  alternative: „predige gegen“ oder wörtlicher „lass [deine Worte] träufeln“
  rationale: Die bildhafte Ausdrucksweise des Hebräischen bleibt hörbar, während die Ergänzung „deine Worte“ den gemeinten prophetischen Sprechakt verständlich macht. Die Ergänzung wird in einer Fußnote offengelegt.
- issue: Richtung der Präposition אֶל bei den Heiligtümern
  choice: „gegen die Heiligtümer“
  alternative: „zu den Heiligtümern hin“
  rationale: אֶל bezeichnet zunächst die Ausrichtung auf ein Ziel; im Zusammenhang des angekündigten Gerichts ist die konfrontative Bedeutung „gegen“ sachgerecht, ohne die grundsätzliche Richtungsbedeutung zu leugnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bewahrt die dreigliedrige Befehlsstruktur und die eindringliche Wiederholung der Zielrichtung. „Du Mensch“ ist verständlicher als das im Deutschen missverständliche „Menschensohn“; das hebräische Idiom wird in der Fußnote dokumentiert.
