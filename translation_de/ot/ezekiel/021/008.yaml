source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ לְ/אַדְמַ֣ת יִשְׂרָאֵ֗ל כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֣י אֵלַ֔יִ/ךְ וְ/הוֹצֵאתִ֥י חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ צַדִּ֥יק וְ/רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/008.yaml
  text: 'And say to the land of Israel[a], ‘Thus says Yahweh: Behold, I am against you, and I will draw my sword from its sheath and cut off from you both righteous and wicked.’'
translation:
  language: de
  text: 'Und sage zum Land Israel: »So spricht Jahwe: Siehe, ich bin gegen dich! Ich werde mein Schwert aus seiner Scheide ziehen und sowohl den Gerechten als auch den Frevler aus dir ausrotten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen beide Bezeichnungen im Singular: »den Gerechten und den Frevler«. Die Formulierung nennt ausdrücklich beide Gruppen und unterstreicht damit den umfassenden Charakter der angekündigten Gerichtsaussage.'
    reason: Die Anmerkung erläutert die hebräische Singularform und die Reichweite der Paarformel, ohne die Spannung der Aussage theologisch aufzulösen.
lexical_decisions:
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: Land Israel
  rationale: אַדְמָה bezeichnet den Erdboden bzw. das Land. Da hier das Gebiet personifiziert angeredet wird, ist »Land Israel« im Deutschen natürlich und sachgerecht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: הִנְנִי אֵלַיִךְ
  choice: Siehe, ich bin gegen dich!
  rationale: Die Wendung drückt nachdrücklich Jahwes feindliche Zuwendung bzw. sein Entgegentreten aus; »Siehe« erhält zugleich das hervorhebende Signal הִנְנִי.
- source_word: וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  choice: Ich werde mein Schwert aus seiner Scheide ziehen
  rationale: הוציא bedeutet wörtlich »herausbringen«; bei einem Schwert und seiner Scheide ist »ziehen« die idiomatische deutsche Entsprechung.
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: und aus dir … ausrotten
  rationale: Das Hifil von כרת bedeutet hier »abschneiden, beseitigen, ausrotten«. In Bezug auf Menschen gibt »ausrotten« die Härte des angekündigten Gerichts natürlich wieder.
- source_word: צַדִּיק וְרָשָׁע
  choice: Gerechte wie Frevler
  rationale: Die beiden substantivisch gebrauchten Singularformen bezeichnen Vertreter beider Gruppen. Die deutsche Pluralform ist natürlich und »wie« unterstreicht, dass das angekündigte Schwert beide Gruppen erfasst.
theological_decisions:
- issue: Umfang des Gerichts über Gerechte und Frevler
  choice: Die Übersetzung sagt unverändert, dass das Schwert Gerechte wie Frevler aus dem Land ausrotten wird.
  alternative: Die Aussage könnte korporativ oder als Beschreibung der unterschiedslosen Auswirkungen des Gerichts verstanden werden, ohne damit Gottes gerechtes Urteil über den Einzelnen zu verneinen.
  rationale: Der hebräische Text nennt beide Gruppen ausdrücklich und erklärt an dieser Stelle nicht, wie dies zu anderen Aussagen über die individuelle Gerechtigkeit Gottes steht. Diese Spannung wird nicht durch eine deutende Paraphrase aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« und »Frevler« bewahren den prophetisch-feierlichen Ton, bleiben aber allgemein verständlich. Die direkte Anrede des personifizierten Landes und das drastische Bild des gezogenen Schwertes bleiben erhalten.
