base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/028.yaml
  text: And it will be to them like a false divination in their eyes; they have sworn sworn oaths to them[a], but he brings guilt to remembrance, so that they may be captured.
translation:
  language: de
  text: Ihnen wird es wie eine trügerische Wahrsagung erscheinen, obwohl sie ihnen feierliche Eide geschworen haben[a]. Doch er bringt Schuld in Erinnerung, sodass sie ergriffen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „durch Eide Geschworene für sie/ihnen“. Die hebräische Wendung ist stark verkürzt und schwer zu deuten. Sie kann auf ihnen gegenüber geleistete Eide, auf für sie geltende Eide oder auf „Eide über Eide“ bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird es … sein
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang Zukunfts- bzw. Folgesinn. Die Wiedergabe bewahrt diesen Sinn in natürlichem Deutsch.
- source_word: כקסום שוא
  choice: wie eine falsche Wahrsagung
  rationale: קסום bezeichnet Wahrsagung oder Orakeldeutung; שוא kann Falschheit, Nichtigkeit oder Wertlosigkeit ausdrücken. „Falsche Wahrsagung“ gibt die verächtliche Einschätzung der Betroffenen klar wieder.
- source_word: בעיניהם
  choice: in ihren Augen
  rationale: Die wörtliche, auch im Deutschen verständliche Wendung bezeichnet ihre Wahrnehmung und Beurteilung.
- source_word: שבעי שבעות להם
  choice: obwohl ihnen feierliche Eide geschworen wurden
  rationale: Die stark verdichtete und umstrittene Formulierung verbindet eine passive Form von שבע mit „Eiden“ und לָהֶם. Die Wiedergabe versteht sie als Hinweis auf ihnen gegenüber geleistete, feierliche Eide und macht den im Zusammenhang naheliegenden Gegensatz sichtbar, ohne die schwierige Stelle als sicher auszugeben.
- source_word: וְהוּא
  choice: Doch er
  rationale: Das maskuline Pronomen nimmt wahrscheinlich den zuvor genannten König von Babylon auf. „Doch“ gibt den Gegensatz zwischen der Einschätzung der Betroffenen und der wirksamen Folge wieder.
- source_word: מַזְכִּיר עָוֹן
  choice: bringt Schuld in Erinnerung
  rationale: Das Hifil von זכר bedeutet „in Erinnerung bringen“; עון umfasst Schuld und Vergehen. Ohne ein im Hebräischen nicht vorhandenes Possessivpronomen bleibt offen, wessen Schuld ausdrücklich gemeint ist.
- source_word: לְהִתָּפֵשׂ
  choice: sodass sie ergriffen werden
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. „Ergriffen werden“ bewahrt das passive Bild des Gefasst- bzw. Gefangenwerdens.
theological_decisions:
- issue: Bezug der in Erinnerung gebrachten Schuld
  choice: 'Kein Possessivpronomen ergänzt: „Schuld“'
  alternative: „ihre Schuld“
  rationale: Der hebräische Text nennt bei עון keinen Besitzer. Die offenere Formulierung verhindert, dass eine mögliche, aber nicht ausdrücklich markierte Zuordnung dogmatisch oder auslegerisch festgeschrieben wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Wendung „in ihren Augen“ bleibt erhalten. Die schwierige Eidesformel wird im Haupttext verständlich wiedergegeben und in der Fußnote mit ihrer echten sprachlichen Unsicherheit offengelegt.
