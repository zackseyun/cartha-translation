  to: Ihnen wird es wie eine trügerische Wahrsagung erscheinen, obwohl sie ihnen feierliche Eide geschworen haben[a]. Doch er bringt Schuld in Erinnerung, sodass sie ergriffen werden.
  rationale: Die Revision korrigiert allein die syntaktisch und kontextuell problematische passive Deutung der Eidesformel. Sie folgt der im englischen Audit-Trail bevorzugten Richtung („sie haben ihnen ... Eide geschworen“), ohne die umstrittene hebräische Konstruktion als eindeutig auszugeben. Alle übrigen Formulierungen bewahren die offene Referenz der Pronomen und die gerichtliche Bildsprache des Ausgangstextes.
