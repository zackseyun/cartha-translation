source:
  edition: WLC
  text: וְ/אַתָּ֥ה בֶן אָדָ֖ם הֵֽאָנַ֑ח בְּ/שִׁבְר֤וֹן מָתְנַ֨יִם֙ וּ/בִ/מְרִיר֔וּת תֵּֽאָנַ֖ח לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/011.yaml
  text: And you[a], son of man, groan with breaking loins, and in bitterness you shall groan before their eyes.
translation:
  language: de
  text: Und du, Menschensohn, stöhne mit gebrochenen Lenden[a], und in Bitterkeit sollst du vor ihren Augen stöhnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit einem Brechen der Lenden“; auch möglich: „mit gebrochenen Lenden“. Das hebräische Bild drückt heftige, den ganzen Körper erfassende Qual aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Dies ist Gottes typische Anrede an Ezechiel. „Menschensohn“ bewahrt die wiederkehrende hebräische Wendung und ist im Deutschen als prophetische Anrede verständlich.
- source_word: הֵאָנַח / תֵּאָנַח
  choice: stöhne / sollst du … stöhnen
  rationale: אנח bezeichnet hörbares Seufzen oder Stöhnen aus Schmerz und Kummer. „Stöhnen“ gibt die körperliche Intensität besser wieder als das schwächere „Seufzen“. Beim zweiten Verb bildet „sollst du“ die anweisende Funktion des Imperfekts ab.
- source_word: בְּשִׁבְרוֹן מָתְנַיִם
  choice: mit gebrochenen Hüften
  rationale: שִׁבְרוֹן bezeichnet Brechen, Zerschmetterung oder Zusammenbruch; מָתְנַיִם meint Hüften, Lenden oder den Bereich der Taille. Die Formulierung bewahrt das drastische Körperbild, bleibt aber natürlicher als das wörtliche „mit einem Brechen der Hüften“.
- source_word: וּבִמְרִירוּת
  choice: und in Bitterkeit
  rationale: Die abstrakte Bedeutung „Bitterkeit“ bleibt erhalten, ohne sie enger als Trauer, Verzweiflung oder Schmerz festzulegen.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: 'Die deutsche Wendung gibt das anschauliche hebräische Idiom genau und natürlich wieder: Das Stöhnen soll öffentlich in ihrer Gegenwart geschehen.'
theological_decisions:
- issue: Bedeutung der Anrede „Menschensohn“
  choice: Als wiederkehrende prophetische Anrede an Ezechiel wiedergegeben
  alternative: „Sterblicher“ oder „Menschenkind“
  rationale: Im vorliegenden Zusammenhang ist die Wendung eine Anrede an den Propheten; die Übersetzung sollte sie weder messianisch aufladen noch ihre feste Rolle im Buch Ezechiel verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Form von „stöhnen“ und das konkrete Körperbild wurden entsprechend dem Hebräischen beibehalten; die ungewöhnliche Wendung wird durch eine Fußnote erläutert.
