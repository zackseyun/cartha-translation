  text: 'Und das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: In der festen prophetischen Wortereignisformel gibt „erging“ das Eintreffen des göttlichen Wortes idiomatisch und zugleich quellenah wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: Im Status-constructus-Ausdruck דְבַר יְהוָה ist „das Wort“ die präzise und in prophetischen Texten etablierte Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ transliteriert, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der deutschen Formel „das Wort erging“ bezeichnet „an mich“ natürlich und genau den Empfänger.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv führt die folgende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das hebraisierende „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als Namen; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „das Wort Jahwes erging an mich“ wahrt den formelhaften Charakter des Hebräischen, während der Doppelpunkt die folgende Rede ohne unnötige Hebraismen einführt.
