revisions:
- from: Dann werde ich dich zu denen hinabbringen, die in die Grube hinabsteigen, zum Volk der Vorzeit[a]. Ich werde dich im Land tief unten wohnen lassen[b], wie die Trümmerstätten aus uralter Zeit, bei denen, die in die Grube hinabsteigen, damit du nicht mehr bewohnt wirst. Doch im Land der Lebenden werde ich Pracht schaffen[c].
  to: Dann werde ich dich zusammen mit denen, die in die Grube hinabsteigen, zum Volk der Vorzeit[a] hinabbringen; ich werde dich zusammen mit denen, die in die Grube hinabsteigen, im Land der Tiefe[b] wohnen lassen, wie die Trümmerstätten aus uralter Zeit, damit du nicht bewohnt wirst. Doch ich werde im Land der Lebenden Pracht verleihen[c].
  rationale: Die Revision klärt die zweimalige Zugehörigkeitsbeziehung zu den zur Grube Hinabsteigenden, glättet die deutsche Formulierung des unteren Landes und gibt נתן im Schlusssatz näher am Grundsinn wieder. Die semantische Offenheit von צְבִי und der schwer bestimmbare Bezug des letzten Satzes bleiben gewahrt.
