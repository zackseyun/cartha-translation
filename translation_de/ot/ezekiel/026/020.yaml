  text: וְ/הוֹרַדְתִּי/ךְ֩ אֶת י֨וֹרְדֵי ב֜וֹר אֶל עַ֣ם עוֹלָ֗ם וְ֠/הוֹשַׁבְתִּי/ךְ בְּ/אֶ֨רֶץ תַּחְתִּיּ֜וֹת כָּ/חֳרָב֤וֹת מֵֽ/עוֹלָם֙ אֶת י֣וֹרְדֵי ב֔וֹר לְמַ֖עַן לֹ֣א תֵשֵׁ֑בִי וְ/נָתַתִּ֥י צְבִ֖י בְּ/אֶ֥רֶץ חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/020.yaml
  text: Then I will bring you down with those who go down to the pit[a], to the people of long ago; and I will make you dwell in the land below, like ruins from ancient times, with those who go down to the pit, so that you will not be inhabited[c][b]. But I will set beauty in the land of the living.
translation:
  language: de
  text: Dann werde ich dich zusammen mit denen, die in die Grube hinabsteigen, zum Volk der Vorzeit[a] hinabbringen; ich werde dich zusammen mit denen, die in die Grube hinabsteigen, im Land der Tiefe[b] wohnen lassen, wie die Trümmerstätten aus uralter Zeit, damit du nicht bewohnt wirst. Doch ich werde im Land der Lebenden Pracht verleihen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Volk aus uralter Zeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Land der unteren Bereiche“; auch möglich: „in den tiefsten Regionen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Schönheit“, „Zierde“ oder „Herrlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַדְתִּיךְ
  choice: Dann werde ich dich hinabbringen
  rationale: Der Hifil von ירד mit femininem Objektsuffix ist kausativ. „Hinabbringen“ bewahrt die räumliche Bewegung, ohne die Art des Gerichts stärker auszudeuten.
- source_word: יֹרְדֵי בוֹר
  choice: die in die Grube hinabsteigen
  rationale: Die partizipiale Wendung wird im Deutschen verbal wiedergegeben. „Grube“ erhält das konkrete Bild und lässt dessen Bezug auf Grab und Totenreich offen.
- source_word: עַם עוֹלָם
  choice: Volk der Vorzeit
  rationale: עוֹלָם bezeichnet hier am ehesten die ferne Vergangenheit. „Vorzeit“ ist knapp, würdig und verweist auf Menschen früherer Generationen, ohne ewige Existenz zu behaupten.
- source_word: וְהוֹשַׁבְתִּיךְ
  choice: Ich werde dich … wohnen lassen
  rationale: Die Form ist ein Hifil von ישׁב. „Wohnen lassen“ gibt die kausative Bedeutung unmittelbar wieder.
- source_word: בְּאֶרֶץ תַּחְתִּיּוֹת
  choice: im Land tief unten
  rationale: Die hebräische Wendung spricht von einem Land der unteren beziehungsweise tiefsten Bereiche. Diese Wiedergabe bleibt anschaulich und vermeidet einen späteren technischen Begriff für das Totenreich.
- source_word: כָּחֳרָבוֹת מֵעוֹלָם
  choice: wie die Trümmerstätten aus uralter Zeit
  rationale: „Wie“ bildet das vergleichende כ ab; „aus uralter Zeit“ wahrt die zeitliche Bedeutung von מֵעוֹלָם.
- source_word: לְמַעַן לֹא תֵשֵׁבִי
  choice: damit du nicht mehr bewohnt wirst
  rationale: Wörtlich ist die Stadt feminin als „du“ angesprochen und soll nicht wohnen. Auf eine Stadt bezogen drückt das im Deutschen natürlich aus, dass sie nicht mehr bewohnt sein wird.
- source_word: וְנָתַתִּי צְבִי
  choice: Doch … werde ich Pracht schaffen
  rationale: צְבִי kann Schönheit, Zierde, Pracht oder Herrlichkeit bezeichnen. „Pracht“ wahrt die positive, sichtbare Qualität, ohne den knappen Satz auf eine bestimmte Wiederherstellung festzulegen; „schaffen“ gibt נתן in diesem Zusammenhang idiomatisch wieder.
- source_word: בְּאֶרֶץ חַיִּים
  choice: im Land der Lebenden
  rationale: Die feste Wendung bezeichnet den Bereich des irdischen Lebens im Gegensatz zur Grube und lässt sich im Deutschen ebenso klar wiedergeben.
theological_decisions:
- issue: Bedeutung des Schlusssatzes וְנָתַתִּי צְבִי בְּאֶרֶץ חַיִּים
  choice: Allgemein als Gottes Schaffen von „Pracht“ im Land der Lebenden wiedergegeben.
  alternative: „Ich werde Herrlichkeit/Schönheit im Land der Lebenden schaffen“ oder eine ausdrückliche Aussage über Wiederherstellung.
  rationale: Der hebräische Satz ist knapp und sein genauer Bezug umstritten. Die Übersetzung erhält den Gegensatz zwischen dem Hinabsteigen der Stadt und Gottes Handeln im Land der Lebenden, ohne dessen Gegenstand oder heilsgeschichtliche Bedeutung näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bewegung zur „Grube“, die Anrede der Stadt in der zweiten Person und der schwer deutbare Kontrast zum „Land der Lebenden“ bleiben erhalten. Die Fußnoten stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
