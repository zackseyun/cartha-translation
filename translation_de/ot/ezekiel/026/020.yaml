    issue: „bei denen, die in die Grube hinabsteigen“
    rationale: Das zweite אֶת־יוֹרְדֵי בוֹר bezeichnet die Gemeinschaft, mit der die Stadt in das untere Land versetzt wird. „bei denen“ kann sich im Deutschen auf die unmittelbar vorausgehenden Trümmerstätten beziehen und verwischt diese Beziehung.
  - severity: low
    issue: „im Land tief unten“
    rationale: Die Formulierung ist verständlich, aber stilistisch sperrig. „im Land der Tiefe“ gibt die Bildsprache von אֶרֶץ תַּחְתִּיּוֹת natürlich wieder, ohne den Begriff technisch als Unterwelt festzulegen.
  - severity: low
    issue: „Pracht schaffen“
    rationale: נתן bedeutet hier primär geben, setzen oder verleihen. „verleihen“ ist idiomatisch und vermeidet die zusätzliche Aussage eines Schöpfungsakts.
  revised_text: Dann werde ich dich zusammen mit denen, die in die Grube hinabsteigen, zum Volk der Vorzeit[a] hinabbringen; ich werde dich zusammen mit denen, die in die Grube hinabsteigen, im Land der Tiefe[b] wohnen lassen, wie die Trümmerstätten aus uralter Zeit, damit du nicht bewohnt wirst. Doch ich werde im Land der Lebenden Pracht verleihen[c].
