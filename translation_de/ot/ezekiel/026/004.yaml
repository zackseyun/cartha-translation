base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/004.yaml
  text: They will destroy the walls of Tyre and tear down her towers[a], and I will scrape her dust away from her and make her a bare rock.
translation:
  language: de
  text: Sie werden die Mauern von Tyrus zerstören und seine Türme niederreißen, und ich werde ihm den Erdboden[a] wegschaben und es zu einem kahlen Felsen machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Staub“. Das hebräische Wort kann Staub, lose Erde oder Erdboden bezeichnen. Gemeint ist, dass die Stadt bis auf den Fels abgetragen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁחֲתוּ
  choice: sie werden … zerstören
  rationale: שׁחת bezeichnet hier die Zerstörung der Stadtbefestigung; „zerstören“ ist im Deutschen klar und idiomatisch.
- source_word: חֹמוֹת צֹר
  choice: die Mauern von Tyrus
  rationale: Die Konstruktverbindung bezeichnet die Befestigungsmauern der Stadt; „Tyrus“ ist die übliche deutsche Namensform.
- source_word: וְהָרְסוּ
  choice: niederreißen
  rationale: הרס bezeichnet das Einreißen von Bauwerken und bewahrt den Unterschied zum vorausgehenden „zerstören“.
- source_word: מִגְדָּלֶיהָ
  choice: seine Türme
  rationale: מִגְדָּל bezeichnet gewöhnlich einen Turm, hier wahrscheinlich einen Wehrturm. Das grammatische Femininum des hebräischen Stadtnamens wird im natürlichen Deutschen mit dem sächlichen Pronomen für Tyrus wiedergegeben.
- source_word: וְסִחֵיתִי
  choice: ich werde … wegschaben
  rationale: Das seltene Verb vermittelt in diesem Zusammenhang das Abtragen der lockeren Oberflächenschicht bis auf den Fels; „wegschaben“ erhält dieses konkrete Bild.
- source_word: עֲפָרָהּ
  choice: seinen Erdboden
  rationale: עָפָר kann Staub, lose Erde oder Erdboden bezeichnen. Im Bild einer bis auf den Fels abgetragenen Stadt macht „Erdboden“ die gemeinte Oberflächenschicht verständlich, ohne die mögliche Bedeutung „Staub“ auszuschließen.
- source_word: מִמֶּנָּה
  choice: von ihm
  rationale: Die Präposition drückt Entfernung vom Ort aus. Das Pronomen richtet sich im Deutschen nach dem sächlichen Städtenamen Tyrus.
- source_word: וְנָתַתִּי אֹתָהּ
  choice: ich werde es … machen
  rationale: נתן mit einem resultativen Prädikat bezeichnet hier das Versetzen in einen neuen Zustand; „zu … machen“ ist dafür natürliches Deutsch.
- source_word: לִצְחִיחַ סָלַע
  choice: zu einem kahlen Felsen
  rationale: Die Wendung beschreibt eine freigelegte, unbedeckte Felsfläche; „kahler Felsen“ bewahrt das anschauliche Bild vollständiger Entblößung.
