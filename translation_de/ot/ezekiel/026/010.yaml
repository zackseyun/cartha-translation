  text: מִ/שִּׁפְעַ֥ת סוּסָ֖י/ו יְכַסֵּ֣/ךְ אֲבָקָ֑/ם מִ/קּוֹל֩ פָּרַ֨שׁ וְ/גַלְגַּ֜ל וָ/רֶ֗כֶב תִּרְעַ֨שְׁנָה֙ חֽוֹמוֹתַ֔יִ/ךְ בְּ/בֹא/וֹ֙ בִּ/שְׁעָרַ֔יִ/ךְ כִּ/מְבוֹאֵ֖י עִ֥יר מְבֻקָּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/010.yaml
  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
translation:
  language: de
  text: Von der Menge seiner Pferde wird ihr Staub dich bedecken. Beim Lärm von Reitern, Rädern und Streitwagen werden deine Mauern erbeben, wenn er durch deine Tore einzieht – so wie man in eine Stadt einzieht, deren Befestigungen durchbrochen sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wie die Eingänge/Zugänge einer aufgebrochenen Stadt«. Die hebräische Wendung ist schwer verständlich; gemeint ist offenbar das Einziehen in eine Stadt, deren Befestigungen durchbrochen sind.'
    reason: Die hebräische Pluralform מְבוֹאֵי (»Eingänge/Zugänge«) ergibt wörtlich eine im Deutschen schwer verständliche Wendung.
lexical_decisions:
- source_word: מִשִּׁפְעַת סוּסָיו
  choice: Von der Menge seiner Pferde
  rationale: שִׁפְעָה bezeichnet eine große Fülle oder Menge. »Menge« gibt hier natürlich wieder, dass die zahlreichen Pferde den Staub verursachen; מִן hat dabei kausal-quellhaften Sinn.
- source_word: יְכַסֵּךְ אֲבָקָם
  choice: wird ihr Staub dich bedecken
  rationale: כסה bedeutet »bedecken«; das Suffix in אֲבָקָם bezieht sich auf die Pferde. Die direkte Anrede der als weiblich vorgestellten Stadt bleibt erhalten.
- source_word: מִקּוֹל פָּרַשׁ וְגַלְגַּל וָרֶכֶב
  choice: Beim Lärm von Reitern, Rädern und Streitwagen
  rationale: קוֹל kann »Laut«, »Schall« oder »Lärm« bedeuten; im militärischen Zusammenhang ist »Lärm« passend. Die hebräischen Singularformen haben kollektiven Sinn und werden im Deutschen idiomatisch im Plural wiedergegeben. רֶכֶב bezeichnet hier den Streitwagen beziehungsweise die Streitwagenverbände.
- source_word: תִּרְעַשְׁנָה חוֹמוֹתַיִךְ
  choice: werden deine Mauern erbeben
  rationale: רעשׁ bezeichnet heftiges Erschüttern oder Beben. »Erbeben« bewahrt die Kraft des Bildes und den Plural »deine Mauern«.
- source_word: בְּבֹאוֹ בִּשְׁעָרַיִךְ
  choice: wenn er durch deine Tore einzieht
  rationale: Die Präposition בְּ mit dem Infinitiv bildet eine Zeitangabe. »Durch deine Tore einzieht« ist im Deutschen die natürliche Wiedergabe des Eindringens in die Stadt.
- source_word: כִּמְבוֹאֵי עִיר מְבֻקָּעָה
  choice: so wie man in eine Stadt einzieht, deren Mauer durchbrochen ist
  rationale: מְבוֹאֵי bedeutet formal »Eingänge/Zugänge«, doch die Wendung beschreibt vergleichend das Einziehen in eine aufgebrochene Stadt. Die unpersönliche Form »man« vermeidet eine unbelegte Festlegung auf bestimmte Handelnde; die durchbrochene Mauer macht das Bild für heutige Leser verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher militärischer Sprache. Die feminine Anrede der Stadt wird durch »dich« und »deine« bewahrt; kollektive hebräische Singularformen werden idiomatisch als deutsche Plurale wiedergegeben.
