revisions:
- from: Und ihre Tochterstädte[a] auf dem Land[b] werden mit dem Schwert getötet werden. Dann werden sie erkennen, dass ich Jahwe bin.
  to: Und ihre Töchter[a], die auf dem Feld[b] sind, werden durch das Schwert getötet, und sie werden erkennen, dass ich Jahwe bin.
  rationale: Die Revision stellt die lexikalisch-metaphorische Offenheit von »ihre Töchter« und die räumliche Offenheit von »auf dem Feld« im Haupttext wieder her. Die im Kontext naheliegenden Deutungen bleiben klar, aber vorsichtig in den Fußnoten dokumentiert. Satzverbindung, Gottesname und Erkenntnisformel folgen eng dem Hebräischen.
