    issue: Interpretative Festlegung durch »Tochterstädte« im Haupttext
    rationale: בנותיה bedeutet zunächst »ihre Töchter«. Im Kontext sind abhängige Orte sehr wahrscheinlich, doch die metaphorische bzw. geografische Auslegung sollte nicht den Wortlaut im Haupttext ersetzen.
  - severity: medium
    issue: Interpretative Festlegung durch »auf dem Land«
    rationale: בשדה lautet wörtlich »auf/im Feld«. »Auf dem Land« kann den Kontext gut treffen, verengt aber die Formulierung stärker als der hebräische Text.
  - severity: low
    issue: Schwerfälliges Futurpassiv
    rationale: »werden mit dem Schwert getötet werden« ist grammatisch möglich, aber unnötig schwerfällig. »werden durch das Schwert getötet« ist in diesem Kontext natürlich und eindeutig zukünftig.
  - severity: low
    issue: »Dann« verstärkt die zeitlich-resultative Verbindung
    rationale: Das einfache ו wird am besten mit »und« wiedergegeben; der Zusammenhang ergibt sich aus dem Kontext, ohne eine zusätzliche zeitliche Nuance einzutragen.
  revised_text: Und ihre Töchter[a], die auf dem Feld[b] sind, werden durch das Schwert getötet, und sie werden erkennen, dass ich Jahwe bin.
