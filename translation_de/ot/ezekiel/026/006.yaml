  text: וּ/בְנוֹתֶ֨י/הָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/חֶ֖רֶב תֵּהָרַ֑גְנָה וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
translation:
  language: de
  text: Und ihre Töchter[a], die auf dem Feld[b] sind, werden durch das Schwert getötet, und sie werden erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »ihre Töchter«. Im Zusammenhang kann dies die von Tyrus abhängigen Ortschaften oder Dörfer bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »auf dem Feld«. Gemeint sind wahrscheinlich Siedlungen auf dem Festland oder im Umland.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  choice: ihre Tochterstädte
  rationale: Wörtlich »ihre Töchter«; im geografisch-prophetischen Sprachgebrauch bezeichnet der Ausdruck abhängige Ortschaften einer Mutterstadt. »Tochterstädte« bewahrt das Bild und macht den Bezug im Deutschen verständlich.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: auf dem Land
  rationale: Wörtlich »die auf dem Feld sind«. Im Gegensatz zur Inselstadt Tyrus sind wahrscheinlich die zugehörigen Siedlungen auf dem Festland beziehungsweise im Umland gemeint. »Auf dem Land« gibt diese räumliche Gegenüberstellung natürlich wieder; die wörtliche Form steht in der Fußnote.
- source_word: בַּחֶרֶב
  choice: mit dem Schwert
  rationale: Gängige hebräische Wendung für das Töten im Krieg; »mit dem Schwert« wahrt den instrumentalen Sinn.
- source_word: תֵּהָרַגְנָה
  choice: werden getötet werden
  rationale: Nifal Imperfekt, 3. Person feminin Plural, mit passiver Bedeutung. Die Formulierung ist klar und bildet den Zukunftsbezug ab.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Die Konjunktion bezeichnet hier natürlich die Folge des angekündigten Gerichts. »Erkennen« passt zur wiederkehrenden Erkenntnisformel bei Ezechiel und kann mehr als bloßes Faktenwissen ausdrücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bezug von »ihre Töchter« im Gerichtswort gegen Tyrus
  choice: Abhängige Ortschaften von Tyrus, im Haupttext als »Tochterstädte« wiedergegeben
  alternative: Wörtlich »ihre Töchter«; auch »ihre Dörfer« beziehungsweise »ihre Ortschaften«
  rationale: Der Zusammenhang handelt von Tyrus und den ihm zugehörigen Siedlungen. Der Ausdruck »Tochterstädte« bewahrt die Stadtmetapher, ohne im Deutschen den irreführenden Eindruck leiblicher Töchter zu erwecken.
- issue: Räumlicher Sinn von בַּשָּׂדֶה
  choice: auf dem Land, wahrscheinlich auf dem Festland oder im Umland
  alternative: wörtlich »auf dem Feld«
  rationale: Bei der Inselstadt Tyrus liegt ein Kontrast zu den abhängigen Siedlungen auf dem Festland nahe. Da »Feld« zugleich allgemein offenes Land bezeichnen kann, bleibt die genaue räumliche Einordnung in der Fußnote vorsichtig formuliert.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Transliteration bewahrt den persönlichen Namen und vermeidet die Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geografische Metapher wird mit »Tochterstädte« transparent und verständlich wiedergegeben. »Dann« drückt den resultativen Zusammenhang der bei Ezechiel häufigen Erkenntnisformel natürlich aus.
