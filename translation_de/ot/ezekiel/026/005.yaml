  text: מִשְׁטַ֨ח חֲרָמִ֤ים תִּֽהְיֶה֙ בְּ/ת֣וֹךְ הַ/יָּ֔ם כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיְתָ֥ה לְ/בַ֖ז לַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/005.yaml
  text: She will become a place for spreading nets in the midst of the sea[a], for I have spoken, declares the Lord GOD, and she will become plunder for the nations.
translation:
  language: de
  text: Sie wird mitten im Meer zu einem Platz werden, auf dem man Netze ausbreitet[a]. Denn ich habe gesprochen – Ausspruch des Herrn Jahwe –, und sie wird den Nationen zur Beute werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Fläche zum Ausbreiten von Fischernetzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁטַח חֲרָמִים
  choice: ein Platz, auf dem man Netze ausbreitet
  rationale: מִשְׁטַח bezeichnet einen Platz oder eine Fläche zum Ausbreiten; zusammen mit חֲרָמִים ist eine zum Ausbreiten von Fischernetzen genutzte Stelle gemeint. Die verbale Formulierung ist im Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: בְּתוֹךְ הַיָּם
  choice: mitten im Meer
  rationale: Die knappe, idiomatische Wiedergabe entspricht der räumlichen Bedeutung von בְּתוֹךְ und erhält den maritimen Schauplatz.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: Denn ich habe gesprochen
  rationale: Das Perfekt unterstreicht die Gewissheit des angekündigten Gerichts aufgrund des bereits ergangenen göttlichen Wortes.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: נְאֻם wird als prophetische Botenformel wiedergegeben; אֲדֹנָי wird mit „Herr“ und der Gottesname יְהוִה transparent mit „Jahwe“ wiedergegeben.
- source_word: וְהָיְתָה לְבַז לַגּוֹיִם
  choice: und sie wird den Nationen zur Beute werden
  rationale: Die Konstruktion mit לְבַז bezeichnet das Preisgegebenwerden als Beute. „Nationen“ gibt גּוֹיִם ohne spätere theologische Einengung wieder.
- source_word: תִּהְיֶה ... וְהָיְתָה
  choice: Sie wird ... sein ... und sie wird ... werden
  rationale: Die femininen Singularformen beziehen sich auf die zuvor genannte Stadt Tyrus. Das feminine Pronomen bewahrt diese literarische Personifikation.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יְהוִה und macht beides im Deutschen sichtbar, ohne den Gottesnamen durch einen zweiten Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache des hebräischen Textes und die feminine Personifikation der Stadt Tyrus bleiben erhalten; die Satzstellung wurde für natürliche deutsche Lesbarkeit leicht geglättet.
