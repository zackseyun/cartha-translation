base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/019.yaml
  text: 'For thus says the Lord GOD: When I make you a ruined city[a], like the cities that are not inhabited, when I bring up the deep over you and the great waters cover you[b],'
translation:
  language: de
  text: 'Denn so spricht Jahwe, der Herr: Wenn ich dich zu einer verwüsteten Stadt mache, den Städten gleich, die nicht bewohnt sind, wenn ich die Tiefe über dich heraufkommen lasse und die gewaltigen Wasser dich bedecken,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Verbindung aus Herrentitel und Gottesnamen wird unterschieden wiedergegeben; „Jahwe“ bewahrt den Eigennamen, ohne die im Deutschen unnatürliche Verdopplung „Herr HERR“.
- source_word: בְּתִתִּי אֹתָךְ עִיר נֶחֱרֶבֶת
  choice: Wenn ich dich zu einer verwüsteten Stadt mache
  rationale: נתן hat in dieser Konstruktion mit prädikativem Ergänzungsausdruck den Sinn „zu etwas machen“; נֶחֱרֶבֶת bezeichnet den Zustand der Verwüstung.
- source_word: כֶּעָרִים אֲשֶׁר לֹא נוֹשָׁבוּ
  choice: den Städten gleich, die nicht bewohnt sind
  rationale: Die Formulierung folgt dem passiven Sinn des Nifal von ישב und wahrt den gehobenen prophetischen Ton.
- source_word: בְּהַעֲלוֹת עָלַיִךְ אֶת תְּהוֹם
  choice: wenn ich die Tiefe über dich heraufkommen lasse
  rationale: Der Hifil-Infinitiv von עלה drückt hier aus, dass Gott die Tiefe aufsteigen beziehungsweise heraufkommen lässt; „die Tiefe“ bewahrt das gewichtige Meeres- und Chaosbild von תְּהוֹם.
- source_word: וְכִסּוּךְ הַמַּיִם הָרַבִּים
  choice: und die gewaltigen Wasser dich bedecken
  rationale: רַבִּים kann bei Wasser sowohl Menge als auch Größe beziehungsweise Macht bezeichnen. „Gewaltige Wasser“ gibt im Deutschen die bedrohliche Wucht des Bildes natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und vermeidet eine konfessionell geprägte Ersetzung oder die unnatürliche Verdopplung „Herr HERR“.
- issue: Bildgehalt von תְּהוֹם
  choice: die Tiefe
  alternative: der Abgrund; die Urflut
  rationale: „Die Tiefe“ lässt offen, ob vor allem Meerestiefe, Flut oder kosmische Chaoswasser im Blick stehen, und löst die Bildspannung nicht voreilig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Bildwelt des Hebräischen. Der Vers bleibt entsprechend dem Ausgangstext syntaktisch offen und endet mit Komma, da der Gedanke im folgenden Vers weitergeführt wird.
