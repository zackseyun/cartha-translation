  text: בַּלָּה֥וֹת אֶתְּנֵ֖/ךְ וְ/אֵינֵ֑/ךְ וּֽ/תְבֻקְשִׁ֗י וְ/לֹֽא תִמָּצְאִ֥י עוֹד֙ לְ/עוֹלָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/021.yaml
  text: I will make you a terror[a], and you will be no more. Though you are sought, you will never again be found[b], declares the Lord GOD.
translation:
  language: de
  text: Ich werde dich zu einem Schrecken machen, und du wirst nicht mehr sein. Man wird dich suchen, aber du wirst nie wieder gefunden werden[a] – Ausspruch des Herrn Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Auch wenn man dich sucht, wirst du nie wieder gefunden werden.« Das Hebräische kann die beiden Aussagen schlicht nebeneinanderstellen oder als konzessiven Zusammenhang verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּלָּהוֹת
  choice: zum Schrecken
  rationale: Der Plural kann hier abstrakt oder intensiv gebraucht sein. »Zum Schrecken« gibt die Wirkung auf natürliche Weise wieder, ohne einen unpassenden deutschen Plural zu erzwingen.
- source_word: אֶתְּנֵךְ
  choice: Ich mache dich
  rationale: נתן bedeutet wörtlich »geben«, bezeichnet mit einem Prädikatsnomen hier aber idiomatisch das Machen zu etwas.
- source_word: וְאֵינֵךְ
  choice: und du wirst nicht mehr sein
  rationale: Die verblos negative Wendung beschreibt das Ende der Existenz beziehungsweise des Vorhandenseins; die Zukunft ergibt sich aus dem Zusammenhang.
- source_word: וּתְבֻקְשִׁי
  choice: Man wird dich suchen
  rationale: Das feminine Passiv des Imperfekts bleibt inhaltlich erhalten, während das unpersönliche »man« im Deutschen natürlicher klingt und die Suchenden nicht näher bestimmt.
- source_word: וְלֹא תִמָּצְאִי עוֹד לְעוֹלָם
  choice: aber du wirst nie wieder gefunden werden
  rationale: Das Niphal von מצא ist passiv. »Nie wieder« bündelt idiomatisch die verstärkende Verbindung עוֹד לְעוֹלָם und bezeichnet die endgültige Dauer des Gerichts.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. »Herr Yahweh« bewahrt sowohl den Titel אֲדֹנָי als auch den persönlichen Gottesnamen יהוה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die Wiedergabe »Yahweh« macht den im Hebräischen ausdrücklich stehenden Eigennamen sichtbar; »Herr« gibt אֲדֹנָי wieder, ohne beide Bestandteile zu einem einzigen Titel zu verschmelzen.
- issue: Verhältnis der letzten beiden Zukunftssätze
  choice: koordinativ mit adversativem »aber«
  alternative: 'konzessiv: »Auch wenn man dich sucht, wirst du …«'
  rationale: Das Hebräische verbindet beide Sätze jeweils mit וְ und markiert die Konzession nicht ausdrücklich. »Aber« wahrt den sachlichen Gegensatz, ohne die syntaktische Beziehung stärker als nötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt feminin singular und bezieht sich auf Tyrus. Der Gedankenstrich hebt die prophetische Schlussformel ab.
