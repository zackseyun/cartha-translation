  yaml_path: translation/ot/ezekiel/026/013.yaml
  text: And I will put an end to the noise of your songs[a], and the sound of your lyres will be heard no more.
translation:
  language: de
  text: Und ich werde dem Lärm deiner Lieder ein Ende machen, und der Klang deiner Leiern[a] wird nicht mehr zu hören sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Harfen“. Das hebräische Wort כִּנּוֹר bezeichnet ein Saiteninstrument und wird häufig mit „Leier“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Und ich werde … ein Ende machen
  rationale: 'Der Hifil von שׁבת hat hier kausative Bedeutung: Gott bewirkt, dass etwas aufhört. Die Wendung ist im modernen Deutschen natürlich und wahrt die Entschiedenheit des Gerichts.'
- source_word: הֲמוֹן שִׁירָיִךְ
  choice: dem Lärm deiner Lieder
  rationale: הֲמוֹן bezeichnet im Zusammenhang mit Liedern eher lautes Geräusch oder Getöse als eine Menge. „Lärm“ erhält den negativen Gerichtston; שִׁירָיִךְ ist der Plural mit femininem Suffix und bezieht sich auf Tyrus.
- source_word: וְקוֹל
  choice: und der Klang
  rationale: קוֹל bedeutet allgemein „Stimme, Laut, Klang“; bei Musikinstrumenten ist „Klang“ die natürliche deutsche Entsprechung.
- source_word: כִּנּוֹרַיִךְ
  choice: deiner Leiern
  rationale: כִּנּוֹר bezeichnet ein Saiteninstrument, das nach heutigem Kenntnisstand am ehesten als Leier zu bestimmen ist. „Harfe“ ist die traditionelle, aber weniger genaue Alternative.
- source_word: לֹא יִשָּׁמַע עוֹד
  choice: wird nicht mehr zu hören sein
  rationale: Der Nifal von שׁמע ist hier passiv („gehört werden“); עוֹד mit Negation bezeichnet das endgültige Aufhören. Die gewählte Formulierung ist idiomatisch und inhaltlich präzise.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die feminine Anrede des Hebräischen bezieht sich auf die Stadt Tyrus. Die Wiederholung der Klangbegriffe wird beibehalten, um den poetischen Parallelismus und den Kontrast zwischen gegenwärtigem Lärm und künftigem Schweigen hörbar zu machen.
