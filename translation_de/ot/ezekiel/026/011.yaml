base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/011.yaml
  text: With the hoofs of his horses he will trample all your streets[a]; he will kill your people with the sword[b], and the pillars of your strength will come down to the ground.
translation:
  language: de
  text: Mit den Hufen seiner Pferde wird er alle deine Straßen[a] niedertrampeln. Dein Volk wird er mit dem Schwert töten, und die Säulen deiner Macht[b] werden zu Boden fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle deine offenen Plätze“ beziehungsweise „alle deine Stadtplätze“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Denkmäler deiner Macht“. Das Hebräische kann auf markante Säulen oder aufgerichtete Denkmäler hinweisen, die mit der Macht von Tyrus verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפַרְסוֹת סוּסָיו
  choice: Mit den Hufen seiner Pferde
  rationale: בְּ bezeichnet hier das Mittel, פַרְסוֹת die Hufe und סוּסָיו seine Pferde. Die deutsche Formulierung ist direkt und natürlich.
- source_word: יִרְמֹס
  choice: wird er ... zerstampfen
  rationale: רמס bezeichnet ein Niedertreten oder Zerstampfen. „Zerstampfen“ bewahrt in Verbindung mit Pferdehufen die gewaltsame Bildsprache.
- source_word: כָּל חוּצוֹתָיִךְ
  choice: alle deine Straßen
  rationale: חוּצוֹת kann Straßen, freie Plätze oder Stadtplätze bezeichnen. Im Zusammenhang der Eroberung ist „Straßen“ die natürliche breite Wiedergabe; die Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: עַמֵּךְ בַּחֶרֶב יַהֲרֹג
  choice: Dein Volk wird er mit dem Schwert töten
  rationale: Die vorangestellte Objektphrase wird im Deutschen durch diese Wortstellung hervorgehoben; „mit dem Schwert töten“ bewahrt das konkrete hebräische Bild.
- source_word: וּמַצְּבוֹת עֻזֵּךְ
  choice: und die Säulen deiner Macht
  rationale: מַצְּבוֹת bezeichnet aufgerichtete Steine, Säulen oder Denkmäler; עֹז bezeichnet Stärke oder Macht. Die Wiedergabe wahrt die mögliche konkrete und symbolische Bedeutung, ohne militärische Anlagen vorauszusetzen.
- source_word: לָאָרֶץ תֵּרֵד
  choice: werden zu Boden stürzen
  rationale: Wörtlich heißt die Wendung „zur Erde hinabgehen“. „Zu Boden stürzen“ gibt im Deutschen den Zusammenbruch von Säulen natürlich und anschaulich wieder.
