  text: בֶּן אָדָ֗ם יַ֠עַן אֲשֶׁר אָ֨מְרָה צֹּ֤ר עַל יְרוּשָׁלִַ֨ם֙ הֶאָ֔ח נִשְׁבְּרָ֛ה דַּלְת֥וֹת הָ/עַמִּ֖ים נָסֵ֣בָּה אֵלָ֑/י אִמָּלְאָ֖ה הָחֳרָֽבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
translation:
  language: de
  text: 'Menschensohn, weil Tyrus über Jerusalem gesagt hat: »Ha! Zerbrochen ist das Tor der Völker[a]; es hat sich mir zugewandt. Ich werde voll werden – sie ist verwüstet!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »die Türen (oder: Torflügel) der Völker«. Die knappe hebräische Wendung kann Jerusalem als Zugang oder Knotenpunkt für viele Völker darstellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede an Ezechiel wird als etablierte, die hebräische Bildsprache bewahrende Wendung wiedergegeben.
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet unmittelbar den Grund für den folgenden Gottesspruch ein.
- source_word: צֹר
  choice: Tyrus
  rationale: Dies ist die gebräuchliche deutsche Namensform der phönizischen Stadt.
- source_word: עַל יְרוּשָׁלִַם
  choice: über Jerusalem
  rationale: Bei einem Verb des Sagens bezeichnet עַל hier zunächst den Gegenstand der Äußerung; deren feindseliger Charakter ergibt sich aus ihrem Inhalt.
- source_word: הֶאָח
  choice: Ha!
  rationale: Die Interjektion bringt schadenfrohes Triumphieren knapp und natürlich zum Ausdruck.
- source_word: נִשְׁבְּרָה
  choice: zerbrochen ist
  rationale: Die resultative Passivbedeutung wird bewahrt und durch die Voranstellung im Ausruf hervorgehoben.
- source_word: דַּלְתוֹת הָעַמִּים
  choice: das Tor der Völker
  rationale: Obwohl דַּלְתוֹת formal Plural ist und Torflügel oder Türen bezeichnet, meint die verdichtete Metapher funktional ein Tor beziehungsweise einen Zugang. Die alternative formnähere Wiedergabe wird in der Fußnote dokumentiert.
- source_word: נָסֵבָּה אֵלַי
  choice: nun hat es sich mir zugewandt
  rationale: Das feminine Verb bezieht sich wahrscheinlich auf das zuvor genannte Torbild. Das ergänzte »nun« verdeutlicht den im Kontext liegenden Umschwung, ohne dessen wirtschaftliche Folgen in den Haupttext hineinzulesen.
- source_word: אִמָּלְאָה
  choice: Ich werde reichlich gefüllt werden
  rationale: Die passive Fülle-Metapher bleibt erhalten. »Reichlich« macht im Deutschen die erwartete Fülle verständlich, ohne sie ausdrücklich auf Handel oder Gewinn festzulegen.
- source_word: הָחֳרָבָה
  choice: weil sie verwüstet ist
  rationale: Das feminine Subjekt ist Jerusalem. Der Zustandscharakter der Verwüstung und der ursächliche Zusammenhang mit der erwarteten Fülle werden natürlich wiedergegeben.
theological_decisions:
- issue: Metaphorische Bezeichnung Jerusalems als דַּלְתוֹת הָעַמִּים
  choice: das Tor der Völker
  alternative: die Türen der Völker; die Torflügel der Völker; die Tore der Völker
  rationale: Die hebräische Wendung ist formal pluralisch und semantisch verdichtet. Der Singular »das Tor« gibt ihre wahrscheinliche Funktion als Bild für Jerusalem als Zugang oder Knotenpunkt verständlich wieder; die echte lexikalische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
- issue: Bezug und Sinn von נָסֵבָּה אֵלַי
  choice: nun hat es sich mir zugewandt
  alternative: sie hat sich mir zugewandt; es ist auf mich übergegangen
  rationale: Die Übersetzung erhält das Torbild als wahrscheinliches grammatisches Bezugswort und vermeidet es, Handel, Verkehr oder Vorherrschaft ausdrücklich in den Haupttext einzutragen. Die erwartete materielle Begünstigung von Tyrus wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der schadenfrohe Ton der Rede von Tyrus bleibt durch »Ha!« und die zugespitzte Wortstellung hörbar. Die ungewöhnliche passive Fülle-Metapher wurde bewusst bewahrt; Fußnoten erläutern nur, ohne die Mehrdeutigkeit des Haupttexts aufzulösen.
