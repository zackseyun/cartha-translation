source:
  edition: WLC
  text: וּ/נְתַתִּ֞י/ךְ לִ/צְחִ֣יחַ סֶ֗לַע מִשְׁטַ֤ח חֲרָמִים֙ תִּֽהְיֶ֔ה לֹ֥א תִבָּנֶ֖ה ע֑וֹד כִּ֣י אֲנִ֤י יְהוָה֙ דִּבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
translation:
  language: de
  text: Und ich mache dich zu einem kahlen Felsen[a]. Zu einem Ort zum Ausbreiten von Fischernetzen wirst du werden. Du wirst nicht wieder aufgebaut werden; denn ich, Jahwe[b], habe gesprochen. So lautet der Ausspruch des Herrn Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem blanken Felsen«. Das hebräische Wort bezeichnet eine kahle, entblößte oder blanke Felsfläche.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Gottesname JHWH wird traditionell mit »der HERR« wiedergegeben. Die Schlussformel lautet wörtlich: »Ausspruch des Herrn JHWH«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתִּיךְ
  choice: Ich mache dich
  rationale: נתן mit prädikativer Ergänzung bezeichnet hier, dass Tyrus in einen bestimmten Zustand versetzt wird. »Ich mache dich« gibt diese kausative Bedeutung im Deutschen natürlich wieder.
- source_word: לִצְחִיחַ סֶלַע
  choice: zu einem kahlen Felsen
  rationale: Die Wortgruppe bezeichnet eine entblößte, unbedeckte Felsfläche. »Kahler Felsen« bewahrt das konkrete Bild der völligen Verwüstung.
- source_word: מִשְׁטַח חֲרָמִים
  choice: zu einem Platz, auf dem man Fischernetze ausbreitet
  rationale: מִשְׁטַח bezeichnet eine Fläche oder einen Ort zum Ausbreiten; חֲרָמִים sind hier Fischernetze. Die Formulierung ist klar und erhält das anschauliche Bild.
- source_word: תִּהְיֶה
  choice: du wirst … werden
  rationale: Die Kopula verbindet Tyrus mit dem zweiten Prädikat. Im Deutschen wird sie zusammen mit der vorangehenden Konstruktion idiomatisch als zukünftiger Zustand wiedergegeben.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: Du wirst nicht wieder aufgebaut werden
  rationale: 'Der Niphal von בנה ist passiv: »aufgebaut/wieder aufgebaut werden«. עוֹד bedeutet hier »wieder« beziehungsweise »noch einmal«; die Übersetzung vermeidet eine über die Formulierung hinausgehende Verstärkung.'
- source_word: כִּי אֲנִי יְהוָה דִּבַּרְתִּי
  choice: denn ich, Jahwe, habe gesprochen
  rationale: כִּי gibt den Grund für die Gewissheit der Ankündigung an. Das Perfekt דִּבַּרְתִּי wird in der feierlichen prophetischen Bekräftigung passend mit »habe gesprochen« wiedergegeben.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: So lautet der Ausspruch des Herrn Jahwe
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. »Ausspruch« wahrt deren nominalen Charakter; »Herr Jahwe« bildet beide Bestandteile des hebräischen Titels ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit sein Charakter als Gottesname erkennbar bleibt. Die Fußnote nennt die traditionelle deutsche Wiedergabe.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: »Der Herr Jahwe« bildet sowohl אֲדֹנָי als Titel als auch יְהוָה als Eigenname transparent ab und vermeidet die unnatürliche Doppelung »Herr HERR«.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die konkreten Bilder von Felsen und ausgebreiteten Fischernetzen bleiben erhalten; die göttliche Bekräftigungsformel wird feierlich, aber nicht altertümlich formuliert.
