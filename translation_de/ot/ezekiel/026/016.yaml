  text: וְֽ/יָרְד֞וּ מֵ/עַ֣ל כִּסְאוֹתָ֗/ם כֹּ֚ל נְשִׂיאֵ֣י הַ/יָּ֔ם וְ/הֵסִ֨ירוּ֙ אֶת מְעִ֣ילֵי/הֶ֔ם וְ/אֶת בִּגְדֵ֥י רִקְמָתָ֖/ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת יִלְבָּ֨שׁוּ֙ עַל הָ/אָ֣רֶץ יֵשֵׁ֔בוּ וְ/חָֽרְדוּ֙ לִ/רְגָעִ֔ים וְ/שָׁמְמ֖וּ עָלָֽיִ/ךְ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/016.yaml
  text: Then all the princes of the sea will come down from their thrones[a], remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble moment by moment[b], and be appalled at you.
translation:
  language: de
  text: Dann werden alle Fürsten des Meeres[a] von ihren Thronen herabsteigen. Sie werden ihre Mäntel ablegen und ihre bestickten Gewänder ausziehen. Sie werden sich mit Zittern bekleiden[b], auf dem Boden sitzen, von Augenblick zu Augenblick erbeben und über dich entsetzt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Oberhäupter des Meeres“. Gemeint sind Herrscher von Seemächten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Zittern werden sie anziehen“ – ein Bild, in dem das Zittern wie ein Kleid erscheint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ מֵעַל כִּסְאוֹתָם
  choice: von ihren Thronen herabsteigen
  rationale: יָרַד bezeichnet das Hinabsteigen; מֵעַל markiert die Bewegung von den Thronen weg. „Herabsteigen“ wahrt sowohl die räumliche Bewegung als auch die symbolische Erniedrigung der Herrscher.
- source_word: כֹּל נְשִׂיאֵי הַיָּם
  choice: alle Fürsten des Meeres
  rationale: נָשִׂיא kann einen Fürsten, Anführer oder Stammesobersten bezeichnen. Die wörtliche Wendung „Fürsten des Meeres“ bleibt erhalten und verweist im Zusammenhang auf Herrscher mit maritimer Macht.
- source_word: מְעִילֵיהֶם
  choice: ihre Mäntel
  rationale: מְעִיל bezeichnet ein Obergewand oder einen Mantel. „Mäntel“ ist gegenwärtiges, verständliches Deutsch und passt zur würdevollen Kleidung der Herrscher.
- source_word: בִּגְדֵי רִקְמָתָם יִפְשֹׁטוּ
  choice: ihre bestickten Gewänder ausziehen
  rationale: רִקְמָה bezeichnet Stick- oder Buntwirkarbeit; פשט wird beim Ablegen von Kleidung für „ausziehen“ gebraucht. Die Wiedergabe bewahrt den Hinweis auf kostbare Kleidung.
- source_word: חֲרָדוֹת יִלְבָּשׁוּ
  choice: In Zittern werden sie sich kleiden
  rationale: Wörtlich werden „Zitteranfälle“ wie Kleidung angezogen. Die Formulierung erhält das eindrückliche Kleidungsbild, ohne es zu einem bloßen Ausdruck von Angst aufzulösen.
- source_word: עַל הָאָרֶץ יֵשֵׁבוּ
  choice: auf dem Boden sitzen
  rationale: הָאָרֶץ kann Erde, Land oder Boden bedeuten. Bei dieser Körperhaltung ist „Boden“ im Deutschen am natürlichsten und bringt die Erniedrigung zum Ausdruck.
- source_word: וְחָרְדוּ לִרְגָעִים
  choice: von Augenblick zu Augenblick erbeben
  rationale: חרד bezeichnet Zittern oder Erbeben. לִרְגָעִים beschreibt ein wiederholtes Geschehen in einzelnen Augenblicken; „von Augenblick zu Augenblick“ erhält diese iterative Nuance.
- source_word: וְשָׁמְמוּ עָלָיִךְ
  choice: über dich entsetzt sein
  rationale: שׁמם kann in Gerichtszusammenhängen das Entsetzt- oder Erstarrtsein bezeichnen. „Über dich entsetzt sein“ lässt offen, ob sich die Reaktion unmittelbar auf Tyrus oder auf sein Geschick richtet.
