source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֧י מֵבִ֣יא אֶל צֹ֗ר נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל מִ/צָּפ֖וֹן מֶ֣לֶךְ מְלָכִ֑ים בְּ/ס֛וּס וּ/בְ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים וְ/קָהָ֥ל וְ/עַם רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/007.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am bringing against Tyre Nebuchadnezzar king of Babylon from the north, king of kings, with horses and chariots and horsemen, and an assembly and a numerous people.'
translation:
  language: de
  text: 'Denn so spricht der Herr Jahwe: Siehe, ich bringe Nebukadnezar[a], den König von Babel, von Norden her gegen Tyrus, einen König der Könige, mit Pferden, Streitwagen und Reitern, mit einem Aufgebot und zahlreichem Volk.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Namensform entspricht genauer „Nebukadrezar“; im Deutschen ist traditionell „Nebukadnezar“ gebräuchlich.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise nähere Entfaltung des vorausgehenden Gerichtswortes ein.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Entspricht der festen prophetischen Botenformel und klingt im Deutschen natürlich und würdig.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Gibt אֲדֹנָי als „Herr“ wieder und bewahrt den Gottesnamen יְהוָה in der im Deutschen geläufigen Form „Jahwe“.
- source_word: הִנְנִי
  choice: Siehe
  rationale: Bewahrt den feierlichen Hinweischarakter der göttlichen Selbstankündigung.
- source_word: מֵבִיא אֶל
  choice: ich bringe … gegen
  rationale: Das Partizip bezeichnet die unmittelbar angekündigte Handlung; אֶל erhält im militärischen Gerichtskontext idiomatisch die Bedeutung „gegen“.
- source_word: צֹר
  choice: Tyrus
  rationale: Geläufige deutsche Form des Städtenamens.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Verwendet die im Deutschen traditionelle und weithin bekannte Namensform; die näher am hebräischen Konsonantenbestand liegende Form wird in der Fußnote genannt.
- source_word: מֶלֶךְ בָּבֶל
  choice: den König von Babel
  rationale: Natürliche Wiedergabe der hebräischen Status-constructus-Verbindung; „Babel“ ist die geläufige biblische deutsche Ortsbezeichnung.
- source_word: מִצָּפוֹן
  choice: von Norden her
  rationale: Gibt Herkunft und Bewegungsrichtung der Invasion idiomatisch wieder.
- source_word: מֶלֶךְ מְלָכִים
  choice: einen König der Könige
  rationale: Die appositionelle Wendung bezeichnet Nebukadnezars imperiale Vorrangstellung, ohne ihn als den einen absoluten „König der Könige“ festzulegen.
- source_word: בְּסוּס וּבְרֶכֶב וּבְפָרָשִׁים
  choice: mit Pferden, Streitwagen und Reitern
  rationale: Die kollektiven militärischen Bezeichnungen werden im Deutschen natürlich als Mehrzahl wiedergegeben.
- source_word: וְקָהָל וְעַם רָב
  choice: mit einem Heeresaufgebot und zahlreichem Kriegsvolk
  rationale: Der militärische Zusammenhang bestimmt קָהָל als aufgebotene Streitmacht; „Kriegsvolk“ verdeutlicht, dass עַם hier die große mitziehende Truppenmenge meint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und macht den im hebräischen Text ausdrücklich stehenden Gottesnamen sichtbar, ohne die beiden Bestandteile zu verschmelzen.
- issue: Bedeutung von מֶלֶךְ מְלָכִים für Nebukadnezar
  choice: einen König der Könige
  alternative: den König der Könige
  rationale: Der Ausdruck beschreibt hier den Oberherrn über untergeordnete Könige. Der unbestimmte Artikel verhindert, dass die spätere absolute theologische Titelfunktion unbemerkt in den Text eingetragen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Ton. „Siehe“ und „so spricht“ tragen das feierliche Register; die militärischen Ausdrücke sind für heutige Leser verständlich formuliert.
