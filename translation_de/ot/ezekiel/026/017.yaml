  text: וְ/נָשְׂא֨וּ עָלַ֤יִ/ךְ קִינָה֙ וְ/אָ֣מְרוּ לָ֔/ךְ אֵ֣יךְ אָבַ֔דְתְּ נוֹשֶׁ֖בֶת מִ/יַּמִּ֑ים הָ/עִ֣יר הַ/הֻלָּ֗לָה אֲשֶׁר֩ הָיְתָ֨ה חֲזָקָ֤ה בַ/יָּם֙ הִ֣יא וְ/יֹשְׁבֶ֔י/הָ אֲשֶׁר נָתְנ֥וּ חִתִּיתָ֖/ם לְ/כָל יוֹשְׁבֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
translation:
  language: de
  text: 'Sie werden ein Klagelied über dich anstimmen und zu dir sagen: »Wie bist du zugrunde gegangen, die du von den Meeren her besiedelt warst[a], du gerühmte Stadt[b], die mächtig war im Meer, sie und ihre Bewohner, die allen ihren Bewohnern Schrecken einflößten[c]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „von den Meeren her bewohnt/besiedelt“. Die schwierige hebräische Wendung kann bedeuten, dass Tyrus aus den Seegebieten Bevölkerung oder Versorgung erhielt. Andere verstehen sie stärker örtlich, etwa: „am Zugang zum Meer gelegen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „gepriesene Stadt“ oder „berühmte Stadt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die allen ihren Bewohnern ihren Schrecken gaben“. Der Bezug des letzten „ihren“ ist im Hebräischen auffällig und bleibt unsicher; gemeint sein kann, dass Tyrus und seine Bewohner ringsum Schrecken verbreiteten.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: ein Klagelied ... anstimmen
  rationale: Die Verbindung von נשׂא mit קִינָה bezeichnet das Anheben oder Vortragen einer Totenklage. „Ein Klagelied anstimmen“ ist im Deutschen natürlich und bewahrt den poetischen Charakter.
- source_word: אָבַדְתְּ
  choice: bist du zugrunde gegangen
  rationale: אבד bezeichnet hier im Ton der Klage das Untergehen oder Vernichtetwerden. Die gewählte Form gibt sowohl den Ausruf mit אֵיךְ als auch die direkte Anrede wieder.
- source_word: נוֹשֶׁבֶת מִיַּמִּים
  choice: die du von den Meeren her besiedelt warst
  rationale: Der masoretische Text bietet eine schwierige passive Partizipialfügung mit מִן und dem Plural „Meere“. „Besiedelt“ wahrt die passive Bedeutung und lässt offen, ob Bevölkerung oder Versorgung aus den Seegebieten gemeint ist.
- source_word: הָעִיר הַהֻלָּלָה
  choice: du gerühmte Stadt
  rationale: Das passive Partizip von הלל bedeutet hier „gerühmt/gepriesen“. „Gerühmt“ ist im heutigen Deutsch natürlicher als „gepriesen“, bleibt aber eng am Wortlaut.
- source_word: חֲזָקָה בַיָּם
  choice: mächtig war im Meer
  rationale: חזק bezeichnet Stärke oder Macht; בַיָּם wird bewusst direkt mit „im Meer“ wiedergegeben, statt die maritime Lage stärker auszudeuten.
- source_word: הִיא וְיֹשְׁבֶיהָ
  choice: sie und ihre Bewohner
  rationale: Die feminine Personifikation der Stadt und der Wechsel von direkter Anrede zur dritten Person werden bewahrt, auch wenn die Fügung im Deutschen auffällig bleibt.
- source_word: נָתְנוּ חִתִּיתָם
  choice: ihren Schrecken ... brachten
  rationale: Die wörtliche Wendung „ihren Schrecken geben“ meint, anderen Furcht einzuflößen. „Ihren Schrecken über ... bringen“ erhält das aktive Bild, ohne es völlig zu glätten.
- source_word: לְכָל יוֹשְׁבֶיהָ
  choice: über alle ihre Bewohner
  rationale: Das feminine Suffix wird formal auf die personifizierte Stadt bezogen. Da dies inhaltlich so wirken kann, als hätten Tyrus und seine Bewohner die eigenen Bewohner erschreckt, wird die Schwierigkeit in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Personifikation der Stadt Tyrus
  choice: Feminine Personenbezüge („sie und ihre Bewohner“) beibehalten
  alternative: Die Stadt sachlich mit „es“ wiedergeben oder vollständig in die zweite Person umformen
  rationale: Die hebräischen femininen Formen und die prophetische Personifikation tragen die poetische Wirkung der Totenklage. Ihre Bewahrung fügt keine konfessionelle Deutung hinzu.
- issue: Mehrdeutiger Bezug des letzten femininen Suffixes
  choice: Formal mit „ihre Bewohner“ wiedergeben und die sachliche Schwierigkeit erläutern
  alternative: Sinngemäß „alle Bewohner der Küsten“ oder „alle, die ringsum wohnten“ schreiben
  rationale: Der masoretische Wortlaut bietet keinen ausdrücklichen anderen Bezugsgegenstand. Eine eindeutige geographische Ergänzung würde die Spannung des Textes stillschweigend auflösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem Ton eines prophetischen Klagelieds. Auffällige Appositionen und Bezugswechsel des Hebräischen werden nicht vollständig geglättet; drei Fußnoten sichern Verständlichkeit und markieren echte lexikalische beziehungsweise syntaktische Unsicherheit.
