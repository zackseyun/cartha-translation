  text: בְּנוֹתַ֥יִ/ךְ בַּ/שָּׂדֶ֖ה בַּ/חֶ֣רֶב יַהֲרֹ֑ג וְ/נָתַ֨ן עָלַ֜יִ/ךְ דָּיֵ֗ק וְ/שָׁפַ֤ךְ עָלַ֨יִ/ךְ֙ סֹֽלְלָ֔ה וְ/הֵקִ֥ים עָלַ֖יִ/ךְ צִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/008.yaml
  text: He will kill your daughters in the field with the sword[a], set up a siege wall against you, throw up a siege ramp against you[b], and raise a large shield against you.
translation:
  language: de
  text: Deine Tochterstädte auf dem offenen Land wird er mit dem Schwert töten[a]. Gegen dich wird er einen Belagerungswall errichten, eine Belagerungsrampe aufschütten und einen großen Schild aufrichten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deine Töchter auf dem Feld«. Gemeint sein können die von Tyrus abhängigen Ortschaften im Umland, möglicherweise besonders die Siedlungen auf dem Festland.'
    reason: lexical_alternative
  - marker: b
    text: Der »große Schild« kann hier auch eine bei der Belagerung verwendete Schutzvorrichtung bezeichnen, etwa einen beweglichen Schutzschirm oder ein gedecktes Schutzdach.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹתַיִךְ
  choice: deine Tochterstädte
  rationale: Wörtlich »deine Töchter«; im Zusammenhang einer Stadt bezeichnet die Wendung deren abhängige Ortschaften. »Tochterstädte« bewahrt das hebräische Bild und macht zugleich den gemeinten Siedlungsbezug deutlich.
- source_word: בַּשָּׂדֶה
  choice: auf dem offenen Land
  rationale: שָׂדֶה bezeichnet Feld, Flur oder offenes Land. Hier stehen die außerhalb der befestigten beziehungsweise insularen Kernstadt gelegenen Siedlungen im Blick; die Formulierung vermeidet jedoch die nicht ausdrücklich im Text stehende Festlegung auf das Festland.
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: wird er mit dem Schwert töten
  rationale: Die instrumentale Wendung und die zukünftige Aussage des prophetischen Zusammenhangs werden direkt und in modernem Deutsch wiedergegeben.
- source_word: דָּיֵק
  choice: Belagerungswall
  rationale: Das Wort bezeichnet eine Belagerungsanlage; »Belagerungswall« gibt den Singular und die militärische Funktion wieder, ohne eine unnötig technische Bezeichnung zu verwenden.
- source_word: סֹלְלָה
  choice: Belagerungsrampe
  rationale: Gemeint ist eine gegen die Stadt aufgeschüttete Erd- oder Angrifframpe. Das Verb »aufschütten« bildet zugleich die konkrete Vorstellung von שׁפך idiomatisch ab.
- source_word: צִנָּה
  choice: Großschild
  rationale: צִנָּה bezeichnet gewöhnlich einen großen Schild. Im Belagerungskontext kann damit auch eine größere schirmende Schutzvorrichtung gemeint sein; diese Möglichkeit wird in der Fußnote offengehalten.
- source_word: וְנָתַן ... וְשָׁפַךְ ... וְהֵקִים
  choice: wird ... errichten, ... aufschütten und ... aufrichten
  rationale: Die Verbfolge führt die angekündigten Belagerungsmaßnahmen mit Zukunftsbezug fort. Unterschiedliche, sachlich passende deutsche Verben erhalten die konkreten Handlungen.
