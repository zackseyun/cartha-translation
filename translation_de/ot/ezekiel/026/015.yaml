base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/015.yaml
  text: 'Thus says the Lord GOD to Tyre: Will not the coastlands quake at the sound of your fall[a], when the wounded groan[b], when the slaughter is carried out in your midst?'
translation:
  language: de
  text: 'So spricht Gott, Jahwe, zu Tyrus: Werden nicht die Küstenländer[a] beim Geräusch deines Falls erbeben, wenn die Verwundeten[b] stöhnen, wenn in deiner Mitte ein Gemetzel angerichtet wird?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Inseln. Das hebräische Wort kann Inseln oder allgemeiner Küstenländer und Seegebiete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: die Erschlagenen. Das hebräische Wort bezeichnet einen Durchbohrten oder tödlich Verwundeten; das hier erwähnte Stöhnen spricht für „Verwundete“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen geläufige Wiedergabe des zusammengesetzten Gottestitels vermeidet das schwer verständliche „Herr HERR“ und kennzeichnet JHWH durch Kapitälchen als Gottes Eigennamen.
- source_word: לְצוֹר
  choice: zu Tyrus
  rationale: Standarddeutsche Form des Städtenamens; die Präposition kennzeichnet die Stadt als Adressatin des Gotteswortes.
- source_word: הֲלֹא
  choice: Sollten nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet, und klingt im Deutschen natürlich.
- source_word: מִקּוֹל מַפַּלְתֵּךְ
  choice: beim Dröhnen deines Falls
  rationale: קוֹל bezeichnet hier das hörbare Geräusch des Zusammenbruchs; „Dröhnen“ macht diesen akustischen Auslöser deutlicher als das abstraktere „Klang“.
- source_word: בֶּאֱנֹק חָלָל
  choice: wenn die Verwundeten stöhnen
  rationale: חָלָל kann Verwundete oder Erschlagene bezeichnen. Da die Betroffenen stöhnen, ist „Verwundete“ im unmittelbaren Zusammenhang die verständlichste Wiedergabe.
- source_word: בֵּהָרֵג הֶרֶג
  choice: wenn … ein Gemetzel angerichtet wird
  rationale: Die Verbindung eines Verbs mit einem stammverwandten Substantiv verstärkt die Tötungsaussage. „Ein Gemetzel anrichten“ gibt die massive Gewalt idiomatisch wieder.
- source_word: בְּתוֹכֵךְ
  choice: in deiner Mitte
  rationale: Bewahrt die direkte Anrede der als weiblich gedachten Stadt und bezeichnet das Geschehen innerhalb von Tyrus.
- source_word: יִרְעֲשׁוּ
  choice: erbeben
  rationale: Das Verb bezeichnet heftiges Beben oder Erschüttertwerden und lässt sowohl die bildlich-politische als auch die emotionale Wirkung offen.
- source_word: הָאִיִּים
  choice: die Küstenländer
  rationale: אִיִּים kann Inseln oder allgemeiner die Länder und Gebiete an den Küsten bezeichnen. Im Umfeld der Seestadt Tyrus erfasst „Küstenländer“ die größere geografische Reichweite.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr JHWH / der Herr Jahwe
  rationale: Die gewählte Form folgt einer etablierten deutschen Bibelkonvention, hält den Titel und den Gottesnamen unterscheidbar und vermeidet die missverständliche Doppelung „Herr HERR“, ohne eine bestimmte konfessionelle Deutung einzutragen.
- issue: Ob חָלָל hier Verwundete oder bereits Erschlagene bezeichnet
  choice: die Verwundeten
  alternative: die Erschlagenen
  rationale: Das begleitende Stöhnen spricht im Satzkontext für noch lebende Verwundete; die mögliche tödliche Bedeutung des Wortes wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter rhetorischer Frage. Die feminine Anrede von Tyrus wird in „deines Falls“ und „deiner Mitte“ erhalten; die Gewaltsprache bleibt deutlich, aber idiomatisch.
