  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֛י בְּ/עַשְׁתֵּֽי עֶשְׂרֵ֥ה שָׁנָ֖ה בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/001.yaml
  text: And it happened in the eleventh year[a], on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Im elften Jahr, am ersten Tag des Monats, erging das Wort Jahwes an mich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Im elften Jahr … erging
  rationale: Das narrative וַיְהִי eröffnet die datierte Offenbarung. Im Deutschen lässt sich seine Diskursfunktion natürlich durch den einleitenden Datumsrahmen und das finite „erging“ wiedergeben; ein zusätzliches „Und es geschah“ wäre schwerfälliger.
- source_word: בְּעַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: Im elften Jahr
  rationale: Idiomatiche und genaue Wiedergabe der hebräischen Datierungsformel.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Die wörtlich knappe Formulierung „am Ersten des Monats“ bezeichnet in der üblichen Datierungsformel den ersten Monatstag. Die ausgeschriebene Form ist im heutigen Deutsch eindeutig.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: erging das Wort Jahwes an mich
  rationale: „Das Wort … erging an“ ist eine natürliche, würdige deutsche Entsprechung der prophetischen Offenbarungsformel, deren hebräisches Verb wörtlich „war/geschah“ bedeutet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im deutschen Text in der etablierten deutschen Schreibweise „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die im nächsten Vers folgende direkte Rede im modernen Deutsch natürlicher ein als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen und vermeidet die nicht ausdrücklich im Hebräischen stehende Ersetzung durch den Titel „der HERR“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die hebräische Satzöffnung wird ohne archaisches „Und es geschah“ in eine flüssige deutsche Datierungs- und Offenbarungsformel überführt. Keine Fußnote ist nötig, da „am ersten Tag des Monats“ die Datierung bereits eindeutig erklärt.
