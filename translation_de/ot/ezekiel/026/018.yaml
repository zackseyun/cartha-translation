source:
  edition: WLC
  text: עַתָּה֙ יֶחְרְד֣וּ הָֽ/אִיִּ֔ן י֖וֹם מַפַּלְתֵּ֑/ךְ וְ/נִבְהֲל֛וּ הָ/אִיִּ֥ים אֲשֶׁר בַּ/יָּ֖ם מִ/צֵּאתֵֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/018.yaml
  text: Now the coastlands will tremble on the day of your downfall[b][a], and the islands that are in the sea will be terrified at your departure.
translation:
  language: de
  text: Nun werden die Küstenländer[a] am Tag deines Sturzes zittern, und die Inseln im Meer werden über deinen Weggang[b] erschrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Inseln«. Das hebräische Wort kann Inseln oder Küstenländer beziehungsweise maritime Gebiete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »wegen deines Hinausgehens« oder »bei deinem Hinausgehen«. Gemeint sein kann das Verschwinden von Tyrus infolge des Gerichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Das Zeitadverb bezeichnet die nun eintretende Folge von Tyrus’ Untergang; »nun« ist natürlich und behält den prophetischen Erzählfluss bei.
- source_word: יֶחְרְדוּ
  choice: werden … zittern
  rationale: חרד verbindet körperliches Zittern mit Furcht; »zittern« bewahrt beide Aspekte, ohne sie näher auszudeuten.
- source_word: הָאִיִּן
  choice: die Küstenländer
  rationale: אִי kann Inseln oder maritime Küstengebiete bezeichnen. Im ersten Satzglied gibt »Küstenländer« den möglichen weiteren geografischen Sinn wieder; die Alternative »Inseln« wird in der Fußnote genannt.
- source_word: יוֹם מַפַּלְתֵּךְ
  choice: am Tag deines Sturzes
  rationale: Die Konstruktion bezeichnet den Zeitpunkt des Zusammenbruchs von Tyrus. »Sturz« ist knapp, würdevoll und nah am Bild des hebräischen מַפֶּלֶת.
- source_word: וְנִבְהֲלוּ
  choice: werden … erschrecken
  rationale: Das Nifal von בהל drückt heftigen Schrecken, Bestürzung oder panische Unruhe aus. »Erschrecken« unterscheidet sich sprachlich von »zittern«, ohne die Intensität unnötig festzulegen.
- source_word: הָאִיִּים אֲשֶׁר בַּיָּם
  choice: die Inseln im Meer
  rationale: Die nähere Bestimmung »im Meer« legt hier den konkreten Sinn »Inseln« nahe und bewahrt damit die mögliche Bedeutungsabstufung gegenüber dem ersten Vorkommen.
- source_word: מִצֵּאתֵךְ
  choice: über deinen Weggang
  rationale: Die Form bedeutet wörtlich etwa »wegen/bei deinem Hinausgehen«. »Weggang« bewahrt das Bild, ohne ausdrücklich festzulegen, ob Verschwinden, Untergang oder Abtransport gemeint ist.
theological_decisions:
- issue: Bezug von מִצֵּאתֵךְ
  choice: deinen Weggang
  alternative: dein Verschwinden / dein Untergang
  rationale: Der Kontext spricht für das Verschwinden von Tyrus infolge des Gerichts, doch das hebräische Wort bezeichnet zunächst ein Hinausgehen. Die Übersetzung erhält diese Spannung, statt die Metapher auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Die beiden Vorkommen von אִיִּים werden entsprechend ihrer jeweiligen näheren Bestimmung differenziert wiedergegeben. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
