base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/012.yaml
  text: They will plunder your wealth and loot your merchandise. They will tear down your walls and demolish your splendid houses. They will throw your stones[a], your timbers, and your dust into the midst of the waters.
translation:
  language: de
  text: Sie werden deinen Reichtum plündern und deine Handelswaren rauben. Sie werden deine Mauern niederreißen und deine prächtigen Häuser zerstören. Deine Steine, deine Balken und deinen Schutt[a] werden sie mitten ins Wasser werfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Staub“ beziehungsweise „deine Erde“. Das hebräische Wort kann Staub, Erde oder hier den Schutt der zerstörten Stadt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְלוּ חֵילֵךְ
  choice: deinen Reichtum plündern
  rationale: חַיִל kann Stärke, Heer oder Vermögen bezeichnen; parallel zu den Handelswaren ist hier der wirtschaftliche Sinn am wahrscheinlichsten. שׁלל bezeichnet das Erbeuten im Krieg.
- source_word: וּבָזְזוּ רְכֻלָּתֵךְ
  choice: deine Handelswaren rauben
  rationale: רְכֻלָּה bezeichnet Handels- bzw. Kaufmannswaren. „Rauben“ gibt die gewaltsame Wegnahme wieder und vermeidet die unmittelbare Wiederholung von „plündern“.
- source_word: וְהָרְסוּ חוֹמוֹתַיִךְ
  choice: deine Mauern niederreißen
  rationale: הרס bezeichnet hier das Einreißen eines Bauwerks; „niederreißen“ ist im Deutschen präzise und anschaulich.
- source_word: וּבָתֵּי חֶמְדָּתֵךְ יִתֹּצוּ
  choice: deine prächtigen Häuser zerstören
  rationale: בָּתֵּי חֶמְדָּה sind begehrenswerte, kostbare oder prachtvolle Häuser. נתץ bezeichnet das Niederbrechen bzw. Zerstören von Bauten.
- source_word: אֲבָנַיִךְ וְעֵצַיִךְ
  choice: deine Steine, deine Balken
  rationale: אֲבָנִים sind die Steine der abgebrochenen Bauten. עֵצִים bedeutet wörtlich Holz; im baulichen Zusammenhang bezeichnet „Balken“ das Material natürlich und konkret.
- source_word: וַעֲפָרֵךְ
  choice: deinen Schutt
  rationale: עָפָר bedeutet Staub oder Erde, kann im Zusammenhang mit dem Abbruch einer Stadt jedoch den staubigen Bauschutt bezeichnen. „Schutt“ passt zur Reihe aus Steinen und Balken, während die wörtlicheren Möglichkeiten in der Fußnote erhalten bleiben.
- source_word: בְּתוֹךְ מַיִם יָשִׂימוּ
  choice: mitten ins Wasser werfen
  rationale: Wörtlich heißt es „in die Mitte von Wasser setzen/legen“. Bei Abbruchmaterial ist „werfen“ natürlich; der deutsche Kollektivsingular „Wasser“ gibt den hebräischen Plural מַיִם idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die feminine Anrede an Tyrus wird durch die Formen „deinen/deine“ im Deutschen nicht eigens markiert. Die parallelen Verben und die dreigliedrige Aufzählung des Abbruchmaterials bleiben erhalten.
