id: EZK.26.3
reference: Ezekiel 26:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ צֹ֑ר וְ/הַעֲלֵיתִ֤י עָלַ֨יִ/ךְ֙ גּוֹיִ֣ם רַבִּ֔ים כְּ/הַעֲל֥וֹת הַ/יָּ֖ם לְ/גַלָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/003.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against you, Tyre, and I will bring up many nations against you, as the sea brings up its waves.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh[a]: Siehe, ich bin gegen dich, Tyrus! Ich lasse viele Völker gegen dich heraufziehen, wie das Meer seine Wellen aufsteigen lässt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Adonaj Yahweh“ (אֲדֹנָי יְהוִה), eine Verbindung des Titels „Herr“ mit dem Gottesnamen Yahweh.'
    reason: Erläuterung des zusammengesetzten Gottesnamens und der gewählten Wiedergabe.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt den folgernden Anschluss an den vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feste prophetische Botenformel in würdigem, geläufigem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: הִנְנִי עָלַיִךְ
  choice: Siehe, ich bin gegen dich
  rationale: „Siehe“ erhält den feierlich-emphatischen Ankündigungscharakter; „gegen dich“ bringt im Gerichtskontext die feindliche Ausrichtung der Präposition zum Ausdruck.
- source_word: צֹר
  choice: Tyrus
  rationale: Übliche deutsche Namensform der phönizischen Stadt.
- source_word: וְהַעֲלֵיתִי עָלַיִךְ גּוֹיִם רַבִּים
  choice: Ich lasse viele Völker gegen dich heraufziehen
  rationale: Die kausative Form von עלה wird mit „lasse … heraufziehen“ wiedergegeben; das erhält sowohl die militärische Bewegung als auch die Verbindung zum folgenden Wellenbild.
- source_word: כְּהַעֲלוֹת הַיָּם לְגַלָּיו
  choice: wie das Meer seine Wellen aufsteigen lässt
  rationale: Bewahrt die kausative Formulierung und den sprachlichen Widerhall von עלה, ohne die Wellen ausdrücklich mit den Völkern gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Der hebräische Text verbindet den Titel אֲדֹנָי mit dem Eigennamen יהוה. „Der Herr Yahweh“ macht beide Bestandteile sichtbar und folgt der vorgegebenen Entscheidung, den Gottesnamen als „Yahweh“ wiederzugeben.
- issue: Bedeutung von הִנְנִי עָלַיִךְ
  choice: Siehe, ich bin gegen dich
  alternative: Siehe, ich komme über dich
  rationale: Im Gerichtswort bezeichnet die Wendung Gottes feindliche Zuwendung gegen Tyrus. Die gewählte Fassung wahrt die direkte göttliche Konfrontation, ohne eine zusätzliche Bewegungsnuance einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Formel. „Siehe“ wird wegen der feierlichen Emphase beibehalten. Der Parallelklang zwischen dem Heraufziehen der Völker und dem Aufsteigen der Wellen wird nach Möglichkeit gewahrt.
