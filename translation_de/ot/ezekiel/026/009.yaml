source:
  edition: WLC
  text: וּ/מְחִ֣י קָֽבָלּ֔/וֹ יִתֵּ֖ן בְּ/חֹֽמוֹתָ֑יִ/ךְ וּ/מִ֨גְדְּלֹתַ֔יִ/ךְ יִתֹּ֖ץ בְּ/חַרְבוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/009.yaml
  text: He will direct the blow of his battering ram against your walls[a], and with his axes he will tear down your towers.
translation:
  language: de
  text: Er wird den Stoß seines Rammbocks gegen deine Mauern richten und deine Türme mit seinen Schwertern[a] niederreißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „mit seinen Äxten“ oder „mit seinen Eisenwerkzeugen“. Der hebräische Text lautet wörtlich „mit seinen Schwertern“; wegen des Zusammenhangs denken manche jedoch allgemeiner an Werkzeuge oder Belagerungsgerät.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחִי
  choice: Stoß
  rationale: Das Substantiv bezeichnet einen Schlag oder Stoß; im Zusammenhang mit einem Rammbock gibt „Stoß“ die konkrete Einwirkung auf die Mauer natürlich wieder.
- source_word: קָבַלּוֹ
  choice: seines Rammbocks
  rationale: Das seltene Wort bezeichnet hier aufgrund des Belagerungskontexts eine Vorrichtung zum Einrammen von Mauern. „Rammbock“ ist im heutigen Deutsch eindeutig und anschaulich.
- source_word: יִתֵּן
  choice: wird … richten
  rationale: Wörtlich bedeutet das Verb „geben, setzen“. Zusammen mit „Stoß“ und der Präposition wird die idiomatische Bedeutung durch „gegen … richten“ treffend ausgedrückt.
- source_word: בְּחֹמוֹתָיִךְ
  choice: gegen deine Mauern
  rationale: Die Präposition bezeichnet hier das Ziel des feindlichen Stoßes; „gegen“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: וּמִגְדְּלֹתַיִךְ
  choice: deine Türme
  rationale: Das Wort bezeichnet die Türme der städtischen Befestigungsanlage.
- source_word: יִתֹּץ
  choice: niederreißen
  rationale: Das Verb bedeutet „abbrechen, niederreißen“ und beschreibt die Zerstörung befestigter Bauwerke.
- source_word: בְּחַרְבוֹתָיו
  choice: mit seinen Schwertern
  rationale: Der masoretische Text bietet die reguläre Pluralform von חֶרֶב, „Schwert“. Die kontextuelle Schwierigkeit, Türme mit Schwertern niederzureißen, wird nicht stillschweigend beseitigt, sondern in einer Fußnote kenntlich gemacht.
