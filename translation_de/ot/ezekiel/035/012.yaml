source:
  edition: WLC
  text: וְֽ/יָדַעְתָּ֮ כִּֽי אֲנִ֣י יְהוָה֒ שָׁמַ֣עְתִּי אֶת כָּל נָאָֽצוֹתֶ֗י/ךָ אֲשֶׁ֥ר אָמַ֛רְתָּ עַל הָרֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֣ר שממה לָ֥/נוּ נִתְּנ֖וּ לְ/אָכְלָֽה־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
translation:
  language: de
  text: 'Dann wirst du erkennen, dass ich Jahwe bin. Ich habe all deine Schmähungen[a] gehört, die du gegen die Berge Israels ausgesprochen hast, als du sagtest: »Sie sind verwüstet; sie sind uns zum Fraß gegeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »all deine verächtlichen Worte«; auch möglich: »all deine Lästerungen«.'
    reason: Lexikalische Alternativen für נָאָצוֹתֶיךָ, dessen Bedeutung zwischen verächtlichen Worten, Schmähungen und im religiösen Kontext Lästerungen liegt.
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Dann wirst du erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem Waw hat im prophetischen Zusammenhang eine zukünftige, folgernde Bedeutung. »Dann« macht diese Konsequenz im Deutschen natürlich sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Umschrift.
- source_word: שָׁמַעְתִּי
  choice: Ich habe … gehört
  rationale: 'Das Perfekt bezeichnet ein abgeschlossenes Hören mit gegenwärtiger Bedeutung: Jahwe hat die Worte wahrgenommen und wird darauf reagieren.'
- source_word: נָאָצוֹתֶיךָ
  choice: all deine Schmähungen
  rationale: Das Wort bezeichnet verächtliche, feindselige Äußerungen. »Schmähungen« bewahrt deren Schärfe, ohne sie enger als ausdrückliche Gotteslästerungen festzulegen.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: gegen die Berge Israels
  rationale: עַל bezeichnet hier angesichts des feindseligen Redens die Zielrichtung; daher ist »gegen« treffender als das neutralere »über«.
- source_word: לֵאמֹר
  choice: als du sagtest
  rationale: Die quotative Wendung wird idiomatisch mit dem vorausgehenden Reden verbunden.
- source_word: שָׁמֵמָה
  choice: Sie sind verwüstet
  rationale: Die formal feminine Singularform bezieht sich kollektiv auf das Gebirge beziehungsweise Land Israels. Der deutsche Plural nimmt die unmittelbar genannten Berge auf.
- source_word: נִתְּנוּ לָנוּ לְאָכְלָה
  choice: sie sind uns zum Fraß gegeben
  rationale: Die Formulierung bewahrt das Bild des Essens beziehungsweise Verschlingens. »Zum Fraß« klingt im Deutschen bildhaft und feindselig, ohne das Bild zu einer bloßen Besitznahme abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. Die Wiedergabe »Jahwe« bewahrt den Namen und entspricht der heute verbreiteten deutschen Umschrift.
- issue: Bezeichnung der feindseligen Worte als Schmähungen oder Lästerungen
  choice: Schmähungen
  alternative: Lästerungen
  rationale: Die Worte richten sich ausdrücklich gegen die Berge Israels. »Schmähungen« gibt die Verachtung wieder, ohne stillschweigend festzulegen, dass נאצות hier unmittelbar Gotteslästerungen im engeren Sinn bezeichnet; der Zusammenhang lässt dennoch erkennen, dass Jahwe sie auf sich und sein Land bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede steht entsprechend dem maskulinen Singular des Hebräischen im vertraulichen »du«. »Zum Fraß gegeben« bewahrt das kräftige Bild der Quelle; »Schmähungen« vermeidet eine unnötig konfessionell oder dogmatisch verengte Deutung.
