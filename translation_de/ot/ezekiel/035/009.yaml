  text: שִֽׁמְמ֤וֹת עוֹלָם֙ אֶתֶּנְ/ךָ֔ וְ/עָרֶ֖י/ךָ לֹ֣א תישבנה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/009.yaml
  text: I will make you an everlasting desolation[a], and your cities will not be inhabited; then you will know that I am Yahweh.
translation:
  language: de
  text: Ich mache dich zu einer ewigen Einöde[a], und deine Städte werden nicht bewohnt sein. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ewigen Verwüstungen“. Im Hebräischen steht „Verwüstungen“ im Plural, möglicherweise zur Verstärkung des Gerichtswortes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְמוֹת עוֹלָם
  choice: für immer zur Einöde
  rationale: Der hebräische Plural שִׁמְמוֹת kann das Ausmaß der Verwüstung verstärken; im natürlichen Deutschen gibt die singularische Zustandsbezeichnung „Einöde“ die Aussage klar und würdig wieder. עוֹלָם bezeichnet hier eine in die unabsehbare Zukunft reichende Dauer.
- source_word: אֶתֶּנְךָ
  choice: Ich mache dich
  rationale: נתן bedeutet wörtlich „geben/setzen“, bezeichnet mit dem prädikativen Substantiv hier aber das Versetzen in einen Zustand; „machen“ ist dafür idiomatisches Deutsch.
- source_word: וְעָרֶיךָ לֹא תישבנה
  choice: und deine Städte werden nicht mehr bewohnt sein
  rationale: Die Städte sind das Subjekt des qalischen Verbs ישׁב. Im Deutschen wird der Sinn natürlich passivisch ausgedrückt. „Nicht mehr“ verdeutlicht den künftig fortbestehenden Zustand im Gerichtszusammenhang.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das vorangestellte ו kann hier folgernd verstanden werden. Der Wechsel vom singularischen „dich/deine“ zum pluralischen Verb „ihr werdet erkennen“ wird entsprechend dem Hebräischen bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname, das Tetragramm, wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. „Jahwe“ bewahrt dessen Funktion als Eigenname, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Dauer der Verwüstung
  choice: für immer
  alternative: auf Dauer; zu ewigen Verwüstungen
  rationale: עוֹלָם bezeichnet in diesem Gerichtswort eine unabsehbar fortdauernde Verwüstung. Die Übersetzung lässt die Reichweite der Aussage stehen, ohne sie systematisch näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierte Anrede des Gebirges Seïr wird beibehalten. Der auffällige Numeruswechsel von der singularischen Anrede („dich“, „deine“) zum pluralischen „ihr“ folgt dem hebräischen Text und wird nicht harmonisiert.
