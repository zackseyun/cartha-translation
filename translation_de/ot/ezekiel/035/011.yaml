  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ וְ/עָשִׂ֗יתִי כְּ/אַפְּ/ךָ֙ וּ/כְ/קִנְאָ֣תְ/ךָ֔ אֲשֶׁ֣ר עָשִׂ֔יתָה מִ/שִּׂנְאָתֶ֖י/ךָ בָּ֑/ם וְ/נוֹדַ֥עְתִּי בָ֖/ם כַּ/אֲשֶׁ֥ר אֶשְׁפְּטֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will deal with you according to your anger and according to your jealousy, which you acted out because of your hatred against them; and I will make myself known through them when I judge you.
translation:
  language: de
  text: 'Darum – so wahr ich lebe –, spricht der Herr Jahwe: Ich werde mit dir entsprechend deinem Zorn und deinem Neid verfahren, die du aus Hass gegen sie gezeigt hast. Und ich werde mich unter ihnen[a] zu erkennen geben, wenn ich dich richte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich werde unter ihnen bekannt werden“ oder: „Ich werde mich durch sie zu erkennen geben.“'
    reason: Die Niphalform von ידע und die Präposition ב lassen sowohl ein Bekanntwerden unter ihnen als auch eine Selbstkundgabe durch sie beziehungsweise im Zusammenhang mit ihnen zu.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet knapp und natürlich die Konsequenz aus der vorherigen Anklage ein.
- source_word: חַי אָנִי
  choice: so wahr ich lebe
  rationale: Bewahrt die feierliche göttliche Schwurformel in idiomatischem modernem Deutsch.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Jahwe
  rationale: Die prophetische Botenformel wird konventionell mit „spricht“ wiedergegeben; der Gottesname bleibt als Jahwe erkennbar.
- source_word: וְעָשִׂיתִי
  choice: Ich werde mit dir … verfahren
  rationale: Im Gerichtszusammenhang gibt „verfahren“ das absolut gebrauchte עשה natürlicher wieder als ein bloßes „tun“; der Bezug auf das angeredete Gegenüber ist aus den Suffixen und dem Schluss des Satzes erschlossen.
- source_word: כְאַפְּךָ וּכְקִנְאָתְךָ
  choice: entsprechend deinem Zorn und deiner Eifersucht
  rationale: כְ bezeichnet hier die Entsprechung beziehungsweise das Maß der vergeltenden Handlung; קִנְאָה meint im feindseligen Kontext eher Eifersucht als positiven Eifer.
- source_word: אֲשֶׁר עָשִׂיתָה
  choice: die du … ausgelebt hast
  rationale: Die Formulierung bringt zum Ausdruck, dass Zorn und Eifersucht in feindseliges Handeln umgesetzt wurden, ohne einen zusätzlichen konkreten Akt einzutragen.
- source_word: מִשִּׂנְאָתֶיךָ בָּם
  choice: aus Hass gegen sie
  rationale: מן bezeichnet Ursprung oder Beweggrund; בָּם erhält angesichts des feindseligen Zusammenhangs die adversative Bedeutung „gegen sie“.
- source_word: וְנוֹדַעְתִּי בָם
  choice: Und ich werde mich unter ihnen zu erkennen geben
  rationale: Die Niphalform kann göttliches Bekanntwerden beziehungsweise Selbstoffenbarung ausdrücken; „unter ihnen“ bewahrt eine naheliegende lokale/soziale Bedeutung von ב und lässt andere Nuancen in der Fußnote offen.
- source_word: כַאֲשֶׁר אֶשְׁפְּטֶךָ
  choice: wenn ich dich richte
  rationale: 'כַאֲשֶׁר ist hier am natürlichsten temporal zu verstehen: Gottes Bekanntwerden geschieht beim Gericht über das angeredete Edom.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR; der Herr JHWH
  rationale: „Jahwe“ wahrt den offenbarten Eigennamen, während „Herr“ אֲדֹנָי wiedergibt und die unnatürliche Doppelung „Herr HERR“ vermeidet.
- issue: Bedeutung von וְנוֹדַעְתִּי בָם
  choice: ich werde mich unter ihnen zu erkennen geben
  alternative: ich werde unter ihnen bekannt werden; ich werde mich durch sie zu erkennen geben
  rationale: Die gewählte Fassung bewahrt die aktive Nuance göttlicher Selbstkundgabe, ohne die mehrdeutige Niphalform und die Funktion der Präposition ב abschließend auf einen einzigen Mechanismus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel bleibt feierlich; unnötig archaische Wortstellung wird vermieden. Der Gedankenstrich hebt die eingeschobene Schwurformel hervor.
