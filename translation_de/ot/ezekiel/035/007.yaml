  to: Ich werde das Gebirge Seïr zu einer Einöde und Wüstenei machen und jeden, der hindurchzieht und zurückkehrt,[a] daraus ausrotten.
  rationale: Die Revision glättet die deutsche Satzstellung und setzt den Fußnotenanker direkt an die mehrdeutige hebräische Partizipienfolge. Die mögliche meristische Lesart wird in der Fußnote präziser erläutert. Die Wiedergabe erhält sowohl die Doppelung der Verwüstungsbegriffe als auch die offene Nuance von עֹבֵר וָשָׁב.
