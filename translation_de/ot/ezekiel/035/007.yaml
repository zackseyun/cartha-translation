  - severity: low
    issue: Fußnotenanker steht zu weit vom mehrdeutigen Ausdruck entfernt
    rationale: Die Fußnote betrifft עֹבֵר וָשָׁב („der hindurchzieht und zurückkehrt“). Der Marker sollte direkt nach diesem Ausdruck gesetzt werden.
