  text: וְ/נָֽתַתִּי֙ אֶת הַ֣ר שֵׂעִ֔יר לְ/שִֽׁמְמָ֖ה וּ/שְׁמָמָ֑ה וְ/הִכְרַתִּ֥י מִמֶּ֖/נּוּ עֹבֵ֥ר וָ/שָֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/007.yaml
  text: I will make Mount Seir a desolation and a waste[a], and I will cut off from it those who pass through and return.
translation:
  language: de
  text: Ich werde das Gebirge Seïr zu einer Einöde und Wüstenei machen und jeden, der hindurchzieht und zurückkehrt,[a] daraus ausrotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die beiden hebräischen Partizipien können als Merismus jede Bewegung durch das Land bezeichnen: jeden, der ein- und ausgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ich werde … machen
  rationale: נתן bedeutet wörtlich „geben/setzen“, bezeichnet hier mit Zielangabe jedoch idiomatisch das Versetzen in einen Zustand. „machen“ gibt dies im Deutschen natürlich wieder.
- source_word: הַר שֵׂעִיר
  choice: das Gebirge Seïr
  rationale: הַר kann einen einzelnen Berg oder ein Bergland bezeichnen. Bei Seïr ist die regionale Bedeutung „Gebirge“ im Deutschen sachgerecht; die Schreibung „Seïr“ vermeidet eine irreführende Aussprache.
- source_word: לְשִׁמְמָה וּשְׁמָמָה
  choice: zu einer Einöde und Wüstenei
  rationale: Die beiden nahezu gleichbedeutenden Substantive werden getrennt wiedergegeben, damit die eindringliche Häufung des Hebräischen erhalten bleibt.
- source_word: וְהִכְרַתִּי
  choice: und … vertilgen
  rationale: Das Hifil von כרת bedeutet „abschneiden, ausrotten“. Im Zusammenhang mit Personen gibt „vertilgen“ das Gerichtswort natürlich und deutlich wieder, ohne die konkrete Todesart festzulegen.
- source_word: מִמֶּנּוּ
  choice: daraus
  rationale: Das Suffix bezieht sich auf das Gebirge beziehungsweise Gebiet Seïr; „daraus“ drückt die Entfernung aus diesem Raum knapp aus.
- source_word: עֹבֵר וָשָׁב
  choice: jeden …, der hindurchzieht und zurückkehrt
  rationale: Die substantivierten Partizipien bezeichnen Personen in fortdauernder oder typischer Bewegung. „jeden“ macht den generischen Sinn natürlich, während die beiden Bewegungsverben formal erhalten bleiben.
theological_decisions:
- issue: Gerichtsidiom der beiden Bezeichnungen für Verwüstung
  choice: Beide Substantive werden als „Einöde und Wüstenei“ wiedergegeben.
  alternative: Verdichtung zu „völliger Verwüstung“ oder „gänzlicher Einöde“
  rationale: Die doppelte Formulierung trägt die Intensität des Gerichtswortes und sollte nicht zu einem einzigen Ausdruck zusammengezogen werden.
- issue: Umfang der Wendung עֹבֵר וָשָׁב
  choice: Wörtlich-nahe Wiedergabe als „jeden …, der hindurchzieht und zurückkehrt“
  alternative: Meristische Deutung als „allen Verkehr hinein und hinaus“ oder „jeden, der kommt und geht“
  rationale: Die Übersetzung bewahrt die konkrete Ambiguität der Partizipien; die mögliche umfassende Bedeutung für jegliche Bewegung durch das Land wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einöde und Wüstenei“ wahrt die rhetorische Doppelung; „vertilgen“ entspricht dem ernsten Register des Gerichtswortes. Der Fußnotenmarker steht nach dem gesamten mehrdeutigen Ausdruck.
