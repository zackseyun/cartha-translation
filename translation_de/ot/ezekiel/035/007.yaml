  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: Gott macht das Gebirge Seïr zur Verwüstung und beseitigt die dort Durchziehenden bzw. Zurückkehrenden. Die Doppelung „Einöde und Wüstenei“ bewahrt die hebräische Intensivierung. „vertilgen“ ist jedoch mit der Stellung „jeden daraus vertilgen“ im heutigen Deutsch syntaktisch und idiomatisch weniger gelungen als eine Umstellung mit „ausrotten“ bzw. „abschneiden“.'
  naturalness: „jeden daraus vertilgen“ klingt im modernen Standarddeutsch sperrig, da „daraus“ zwischen Objekt und Verb eine unnatürliche Verbindung bildet. „Jeden … daraus ausrotten“ ist klar, natürlich und behält die lokale Ergänzung bei. Der Fußnotenmarker soll unmittelbar bei der mehrdeutigen Partizipienwendung stehen, nicht erst nach dem Satz.
  terminology: „Gebirge Seïr“ ist für den regionalen Bezug von הַר שֵׂעִיר angemessen; die Schreibung „Seïr“ ist im deutschen biblischen Register etabliert. „Einöde und Wüstenei“ gibt die zwei hebräischen Substantive unterscheidbar wieder. „Ausrotten“ ist hier als gerichtssprachliche Wiedergabe von הִכְרַתִּי vertretbar, ohne eine konkrete Art der Vernichtung festzulegen.
