  text: יַ֗עַן הֱי֤וֹת לְ/ךָ֙ אֵיבַ֣ת עוֹלָ֔ם וַ/תַּגֵּ֥ר אֶת בְּנֵֽי יִשְׂרָאֵ֖ל עַל יְדֵי חָ֑רֶב בְּ/עֵ֣ת אֵידָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/005.yaml
  text: Because you had an everlasting enmity and delivered the sons of Israel over to the power of the sword at the time of their disaster[a], at the time of the punishment of the end[b],
translation:
  language: de
  text: Weil du ewige Feindschaft hegtest und die Söhne Israels der Gewalt des Schwertes preisgabst zur Zeit ihres Unglücks[a], zur Zeit der Strafe des Endes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ oder „das Volk Israel“. Hebräisch: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Zeit der Schuld des Endes“ beziehungsweise „zur Zeit, als die Schuld ihr Ende erreichte“. Die hebräische Wendung ist schwierig und kann sich entweder auf Sünde beziehungsweise Schuld oder auf deren Strafe beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: Weil
  rationale: Gibt die kausale Funktion der einleitenden Partikel im Zusammenhang des angekündigten Gerichts natürlich und genau wieder.
- source_word: הֱיוֹת לְךָ אֵיבַת עוֹלָם
  choice: du ewige Feindschaft hegtest
  rationale: Die Konstruktion bezeichnet eine Edom dauerhaft eigene feindselige Haltung. „Feindschaft hegen“ ist im Deutschen natürlich; „ewig“ bewahrt die zeitliche Weite von עוֹלָם.
- source_word: וַתַּגֵּר
  choice: preisgabst
  rationale: Der Hifil bezeichnet hier wahrscheinlich ein Ausliefern oder Preisgeben. Zusammen mit der Gewalt des Schwertes vermittelt „preisgeben“ die tödliche Gefährdung prägnant.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die ausdrücklich familiale und korporative Formulierung des Hebräischen; die idiomatischen Kollektivbezeichnungen stehen in der Fußnote.
- source_word: עַל יְדֵי חָרֶב
  choice: der Gewalt des Schwertes
  rationale: Das wörtliche Bild „in die Hände des Schwertes“ ist im Deutschen ungewöhnlich. „Der Gewalt des Schwertes“ erhält sowohl die Personifikation als auch den Sinn tödlicher Gewalt.
- source_word: בְּעֵת אֵידָם
  choice: zur Zeit ihres Unglücks
  rationale: אֵיד bezeichnet Unheil, Unglück oder Katastrophe. „Unglück“ ist verständlich, würdig und passt zum prophetischen Kontext.
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: zur Zeit der Strafe am Ende
  rationale: Die verdichtete hebräische Wendung ist schwierig. עָוֹן kann Schuld, Sünde oder deren Strafe bezeichnen; die Hauptfassung folgt im Gerichtskontext dem Sinn „Strafe“, ohne die Unsicherheit zu verbergen.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; das Volk Israel
  rationale: Die Hauptfassung erhält das familiale Kollektivbild des Ausgangstextes. Die idiomatischeren deutschen Alternativen werden genannt, ohne die Quellform stillschweigend zu ersetzen.
- issue: Bedeutung von עֲוֺן in בְּעֵת עֲוֺן קֵץ
  choice: Strafe
  alternative: Schuld; endgültige Sünde; die Zeit, als die Schuld ihr Ende erreichte
  rationale: עָוֹן umfasst sowohl Verfehlung beziehungsweise Schuld als auch deren Folge oder Strafe. Der Gerichtskontext stützt „Strafe“, doch die syntaktisch und semantisch echte Mehrdeutigkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum Hebräischen. Die Satzform bleibt als Begründungssatz offen, weil der Vers syntaktisch in den folgenden Gerichtsspruch hineinführt. Beide Fußnotenmarker stehen unmittelbar an den betreffenden Wendungen im Haupttext.
