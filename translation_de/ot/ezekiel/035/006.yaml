base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/006.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will make you blood, and blood will pursue you. Surely you have not hated blood[b], so blood will pursue you.
translation:
  language: de
  text: Darum – so wahr ich lebe, spricht der Herr Yahweh – werde ich dich zu Blut machen,[a] und Blut wird dich verfolgen. Du hast Blut ja nicht gehasst,[b] darum wird Blut dich verfolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werde ich dich zu Blut machen“. Die wiederholte Rede von „Blut“ lässt zugleich an Blutvergießen und Blutschuld denken.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Blut“ ist hier wahrscheinlich Blutvergießen gemeint. Die wörtliche Wiedergabe bewahrt jedoch das Wortspiel des hebräischen Textes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und natürlich wieder und verbindet das Gericht mit der vorangehenden Anklage.
- source_word: חַי אָנִי
  choice: so wahr ich lebe
  rationale: Natürliche deutsche Wiedergabe der feierlichen göttlichen Schwurformel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: „spricht“ entspricht der prophetischen Botenformel; „Herr Yahweh“ unterscheidet אֲדֹנָי vom Gottesnamen יְהוִה und gibt beide Bestandteile wieder.
- source_word: לְדָם אֶעֶשְׂךָ
  choice: werde ich dich zu Blut machen
  rationale: Bewahrt die auffällige Kürze und das vierfache Wortspiel mit דָם, ohne die mögliche Bedeutung vorschnell auf Blutvergießen oder Blutschuld festzulegen.
- source_word: דָם
  choice: Blut
  rationale: Die einheitliche Wiedergabe erhält die eindringliche Wiederholung und lässt die Bedeutungsanklänge an Blutvergießen und Blutschuld bestehen.
- source_word: יִרְדֲּפֶךָ
  choice: wird dich verfolgen
  rationale: Entspricht der gewöhnlichen Bedeutung von רדף und passt zur personifizierten Darstellung des Blutes als Gerichtsmacht.
- source_word: אִם לֹא
  choice: Weil ... nicht
  rationale: 'Im Zusammenhang ist die Wendung am besten kausal beziehungsweise bekräftigend zu verstehen: Das folgende Gericht gründet darin, dass Edom Blut nicht verabscheute.'
- source_word: דָם שָׂנֵאתָ
  choice: du Blut nicht gehasst hast
  rationale: Bewahrt das wiederholte דָם und die absichtlich harte Formulierung; eine Fußnote erläutert die wahrscheinliche Beziehung auf Blutvergießen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott der HERR / der Herr, der HERR
  rationale: Die Formulierung gibt sowohl den Titel אֲדֹנָי als auch den Eigennamen יְהוִה wieder, ohne beide miteinander zu verschmelzen.
- issue: Deutung der vierfachen Wiederholung von דָם
  choice: durchgehend „Blut“ im Haupttext
  alternative: je nach Kontext „Blutvergießen“ oder „Blutschuld“
  rationale: Die durchgehende Wiedergabe erhält das hebräische Wortspiel und die theologische Spannung zwischen vergossenem Blut, Gewalttat, Schuld und vergeltendem Gericht.
- issue: Funktion von אִם לֹא
  choice: 'kausal: „Weil ... nicht“'
  alternative: 'bekräftigend: „Fürwahr, du hast ... nicht“'
  rationale: Der kausale Anschluss macht den Zusammenhang von Schuld und Gericht deutlich; die hebräische Konstruktion kann jedoch auch bekräftigend verstanden werden.
translation_notes:
  register: Moderne, würdige prophetische Sprache. Die Gedankenstriche markieren die eingeschobene Schwur- und Redeeinleitung. Die bewusst ungewohnte Wendung „zu Blut machen“ erhält die Härte und Mehrdeutigkeit des Hebräischen; die Fußnoten sichern die Verständlichkeit.
