source:
  edition: WLC
  text: כְּ/שִׂמְחָ֨תְ/ךָ֜ לְ/נַחְלַ֧ת בֵּֽית יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה לָּ֑/ךְ שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר שֵׂעִיר֙ וְ/כָל אֱד֣וֹם כֻּלָּ֔/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
translation:
  language: de
  text: 'Wie du dich darüber gefreut hast, dass der Erbbesitz des Hauses Israel verwüstet dalag[a], so werde ich mit dir verfahren: Zur Einöde wirst du werden, Berg Seïr, und ganz Edom, ganz und gar[b]. Dann werden sie erkennen, dass ich Jahwe bin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „weil er verödet war“. Das hebräische Wort beschreibt einen verwüsteten, menschenleeren Zustand.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „und ganz Edom, ganz es“. Die Wiederholung betont, dass Edom vollständig gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  choice: Wie du dich … gefreut hast
  rationale: Die Präposition כְּ bezeichnet den Vergleich; die substantivische Wendung wird im Deutschen natürlich als verbaler Vergleichssatz wiedergegeben.
- source_word: לְנַחְלַת בֵּית יִשְׂרָאֵל
  choice: darüber …, dass der Erbbesitz des Hauses Israel
  rationale: נַחֲלָה bezeichnet den ererbten beziehungsweise zugewiesenen Besitz. Die Konstruktion mit לְ nennt hier den Gegenstand beziehungsweise Anlass der Freude.
- source_word: עַל אֲשֶׁר שָׁמֵמָה
  choice: dass … verwüstet dalag
  rationale: עַל אֲשֶׁר gibt den Grund beziehungsweise Anlass der Schadenfreude an; שָׁמֵמָה beschreibt den verwüsteten, verödeten Zustand des Erbbesitzes.
- source_word: כֵּן אֶעֱשֶׂה לָּךְ
  choice: so werde ich mit dir verfahren
  rationale: כֵּן stellt die entsprechende Vergeltung heraus. „Mit dir verfahren“ gibt עשה mit לְ idiomatisch wieder, ohne die knappe Gerichtsansage abzuschwächen.
- source_word: שְׁמָמָה תִהְיֶה
  choice: Zur Einöde wirst du werden
  rationale: שְׁמָמָה ist ein Substantiv („Einöde/Verwüstung“), das prädikativ gebraucht wird. Die nominale Wiedergabe bewahrt die stärkere Bildsprache gegenüber dem bloßen Adjektiv „verwüstet“.
- source_word: הַר שֵׂעִיר
  choice: Berg Seïr
  rationale: „Berg Seïr“ ist die im Deutschen natürliche geografische Bezeichnung; die Trema-Schreibung macht die getrennte Aussprache der Vokale sichtbar.
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  choice: und ganz Edom, ja, das ganze Land
  rationale: Das wiederholte Totalitätsmotiv כָל … כֻּלָּהּ ist emphatisch. „Ja, das ganze Land“ bewahrt die Verstärkung und macht den femininen Rückbezug verständlich.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: 'Das וְ kann hier folgernd verstanden werden: Die Erkenntnis folgt auf das angekündigte Gericht.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im deutschen Text als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Wiedergabe des Eigennamens und vermeidet die Ersetzung durch einen Titel.
- issue: Bezug der Erkenntnisformel וְיָדְעוּ
  choice: Dann werden sie erkennen
  alternative: Und ihr werdet erkennen
  rationale: Die masoretische Form ist dritte Person Plural („sie werden erkennen“), auch wenn zuvor der Berg Seïr beziehungsweise Edom direkt angeredet wird. Der grammatische Wechsel bleibt erhalten und wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Vergeltungsstruktur „Wie …, so …“ und die emphatische Wiederholung bei ganz Edom bleiben erhalten; ungewöhnliche hebräische Formulierungen werden nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
