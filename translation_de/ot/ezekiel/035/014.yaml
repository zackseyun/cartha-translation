source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה כִּ/שְׂמֹ֨חַ֙ כָּל הָ/אָ֔רֶץ שְׁמָמָ֖ה אֶעֱשֶׂה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/014.yaml
  text: 'Thus says the Lord GOD: As the whole earth rejoiced[b][a], I will make you desolate.'
translation:
  language: de
  text: 'So spricht der Herr, Yahweh: Wenn die ganze Erde sich freut[a][b], werde ich dich zur Einöde machen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie die ganze Erde sich freut“ oder, bei vergangenheitsbezogenem Verständnis, „Als die ganze Erde sich freute“. Das hebräische Infinitivgefüge kann temporal oder vergleichend verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „das ganze Land“. Das hebräische Wort kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch im Präsens wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: „Herr“ gibt אֲדֹנָי wieder; der Gottesname יהוה bleibt als „Yahweh“ erkennbar und wird nicht zu „Herr Herr“ verdoppelt.
- source_word: כִּשְׂמֹחַ
  choice: Während … sich freut
  rationale: Die Präposition כ mit dem Infinitiv bezeichnet hier am ehesten den zeitlichen beziehungsweise begleitenden Umstand. Das hebräische Infinitivgefüge legt für sich genommen keine grammatische Zeit fest.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang der umfassenden Freude wird die breitere Bedeutung im Haupttext gewählt; die örtlich begrenzte Lesart steht in der Fußnote.
- source_word: שְׁמָמָה אֶעֱשֶׂה לָּךְ
  choice: werde ich dich zur Einöde machen
  rationale: Die nominale Form שְׁמָמָה wird bewahrt, und die deutsche resultative Wendung gibt עשה mit ל natürlich wieder.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der Herr
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und lässt den im Ausgangstext ausdrücklich stehenden Gottesnamen sichtbar, ohne eine konfessionelle Auslegung hinzuzufügen.
- issue: Zeitbezug von כִּשְׂמֹחַ
  choice: Während die ganze Erde sich freut
  alternative: Als die ganze Erde sich freute
  rationale: Das Infinitivgefüge markiert keine eigene Zeitstufe. Das Präsens im Haupttext wahrt die offene, anschauliche Aussage; die mögliche vergangenheitsbezogene und die stärker vergleichende Wiedergabe werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zur Einöde machen“ erhält das kräftige nominale Bild des Hebräischen; „verwüsten“ wäre flüssiger, würde dieses Bild aber abschwächen.
