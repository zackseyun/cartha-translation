  yaml_path: translation/ot/ezekiel/035/002.yaml
  text: Son of man[a], set your face against Mount Seir and prophesy against it.
translation:
  language: de
  text: Menschensohn[a], richte dein Angesicht gegen das Gebirge Seïr und prophezeie gegen es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sterblicher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede Gottes an Ezechiel wird formal und in ihrer buchinternen Wiederholung bewahrt. Das Deutsche verfügt mit „Menschensohn“ über eine etablierte, verständliche Wiedergabe des hebräischen Ausdrucks.
- source_word: שִׂים פָּנֶיךָ
  choice: richte dein Gesicht
  rationale: Die Wiedergabe erhält das konkrete hebräische Bild. Im Zusammenhang mit „gegen“ bezeichnet die Wendung eine entschlossene, feindliche Ausrichtung.
- source_word: עַל
  choice: gegen
  rationale: 'In beiden Vorkommen verlangt der Kontext eine adversative Bedeutung: Ezechiel soll sich gegen Seïr richten und ein Gerichtswort gegen es aussprechen.'
- source_word: הַר שֵׂעִיר
  choice: das Gebirge Seïr
  rationale: הַר kann bei einer Landschaftsbezeichnung ein Bergland oder Gebirge meinen. Seïr bezeichnet hier das edomitische Bergland; „Gebirge Seïr“ ist im Deutschen geografisch natürlicher und genauer als die Bezeichnung eines einzelnen Berges.
- source_word: וְהִנָּבֵא
  choice: und weissage
  rationale: Der Niphal-Imperativ von נבא bezeichnet die prophetische Verkündigung. „Weissage“ bewahrt den Fachbegriff und den Imperativ.
- source_word: עָלָיו
  choice: gegen es
  rationale: Das hebräische Pronomen ist maskulin Singular und bezieht sich grammatisch auf הַר. Im Deutschen richtet sich das Pronomen nach dem sächlichen „Gebirge“; „gegen“ bewahrt den feindlichen Sinn.
theological_decisions:
- issue: Bedeutung der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Sterblicher Mensch
  rationale: Die traditionelle formale Wiedergabe bewahrt Ezechiels charakteristische Gottesrede, ohne die mögliche Betonung menschlicher Sterblichkeit zur alleinigen Deutung zu machen. Die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener prophetischer Bildsprache. „Richte dein Gesicht gegen“ klingt markiert, bildet aber die wiederkehrende hebräische Wendung transparent ab. Die Schreibweise „Seïr“ verhindert, dass die Vokalfolge als Diphthong gelesen wird.
