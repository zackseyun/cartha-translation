source:
  edition: WLC
  text: וַ/תַּגְדִּ֤ילוּ עָלַ/י֙ בְּ/פִי/כֶ֔ם וְ/הַעְתַּרְתֶּ֥ם עָלַ֖/י דִּבְרֵי/כֶ֑ם אֲנִ֖י שָׁמָֽעְתִּי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/013.yaml
  text: And with your mouth you magnified yourselves against me[a], and multiplied your words against me[b]; I myself have heard.
translation:
  language: de
  text: Ihr habt euch mit eurem Mund gegen mich großgetan[a] und eure Worte gegen mich gehäuft[b]. Ich selbst habe es gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen mich geprahlt“; wörtlich ist davon die Rede, sich gegen Gott großzumachen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eure Worte gegen mich vermehrt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגְדִּילוּ
  choice: ihr habt euch großgetan
  rationale: Der Hifil von גדל bezeichnet hier im Zusammenhang feindseliger Rede ein Sich-groß-Machen gegenüber Gott. „Sich großtun“ bewahrt das Bild und klingt im heutigen Deutsch natürlich; „prahlen“ wäre dynamischer, aber weniger formnah.
- source_word: עָלַי
  choice: gegen mich
  rationale: עַל bezeichnet bei feindseliger Rede hier die gegen Gott gerichtete Haltung, nicht nur das Thema der Äußerungen.
- source_word: בְּפִיכֶם
  choice: mit eurem Mund
  rationale: Die konkrete instrumentale Wendung des Hebräischen bleibt erhalten und bildet einen passenden Parallelismus zu „eure Worte“.
- source_word: וְהַעְתַּרְתֶּם
  choice: und ... gehäuft
  rationale: Der Hifil von עתר bedeutet hier wahrscheinlich „zahlreich machen, vermehren“. Bei Worten gibt „häufen“ die Vorstellung reichlicher, sich steigernder Rede natürlich wieder, ohne den Sinn weiter auszudeuten.
- source_word: דִּבְרֵיכֶם
  choice: eure Worte
  rationale: Die Grundbedeutung von דבר passt unmittelbar und bewahrt die konkrete Anklage wegen ihrer Äußerungen.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen ist emphatisch; „ich selbst“ bildet diese Hervorhebung im Deutschen ab.
- source_word: שָׁמָעְתִּי
  choice: habe es gehört
  rationale: Das Perfekt wird als abgeschlossenes Wahrnehmen mit gegenwärtiger Relevanz wiedergegeben. Das ergänzte „es“ nimmt die zuvor genannten Worte idiomatisch auf.
theological_decisions:
- issue: Wiedergabe der gegen Gott gerichteten überheblichen Rede
  choice: 'Die Aussage wird als direkte göttliche Anklage wiedergegeben: Die Angesprochenen haben sich in ihrer Rede gegen Gott großgetan und ihre Worte gegen ihn gehäuft.'
  alternative: Die Rede könnte allgemeiner als stolzes Reden über Gott verstanden und wiedergegeben werden.
  rationale: Das zweimalige עָלַי sowie das Sich-groß-Machen und Häufen von Worten weisen im Kontext auf antagonistische, gegen Gott gerichtete Rede. Die Übersetzung wahrt diese Schärfe, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich großtun“ bewahrt die hebräische Bildlichkeit in geläufiger Sprache; „Worte häufen“ gibt den parallelen Vorwurf knapp und verständlich wieder. Die Satzteilung hebt Gottes abschließende, emphatische Feststellung hervor.
