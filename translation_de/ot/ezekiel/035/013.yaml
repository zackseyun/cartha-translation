  source_fidelity: Die Übersetzung gibt die beiden perfektischen Vorwürfe sowie die emphatische Schlussfeststellung zuverlässig wieder. „Mit eurem Mund“ entspricht בְּפִיכֶם, „gegen mich“ trifft die in diesem Kontext feindselige Ausrichtung von עָלַי, und „Ich selbst habe es gehört“ bildet das explizite אֲנִי und das Perfekt שָׁמַעְתִּי angemessen ab. Das ergänzende „es“ verweist natürlich auf die zuvor genannte Rede.
