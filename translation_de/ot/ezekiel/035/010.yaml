source:
  edition: WLC
  text: יַ֣עַן אֲ֠מָרְ/ךָ אֶת שְׁנֵ֨י הַ/גּוֹיִ֜ם וְ/אֶת שְׁתֵּ֧י הָ/אֲרָצ֛וֹת לִ֥/י תִהְיֶ֖ינָה וִֽ/ירַשְׁנ֑וּ/הָ וַֽ/יהוָ֖ה שָׁ֥ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/010.yaml
  text: Because you said[a], ‘These two nations and these two lands will be mine[b], and we will possess them’—though Yahweh was there—
translation:
  language: de
  text: 'Weil du gesagt hast: »Die beiden Völker und die beiden Länder werden mir gehören, und wir werden sie in Besitz nehmen« – obwohl Jahwe dort war[a] –,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und Jahwe war dort“ oder „während Jahwe dort war“. Die hebräische Verbindung kann unterschiedlich verstanden werden; die Übersetzung gibt sie hier konzessiv wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲמָרְךָ
  choice: Weil du gesagt hast
  rationale: יַעַן leitet den Grund für das folgende Gerichtswort ein; die nominale Verbform mit Suffix wird im Deutschen natürlich als finiter Nebensatz wiedergegeben.
- source_word: שְׁנֵי הַגּוֹיִם
  choice: die beiden Völker
  rationale: Der bestimmte Artikel wird direkt mit „die“ wiedergegeben. Der Kontext macht die gemeinten Völker bestimmt, ohne dass sie im Vers ausdrücklich benannt werden.
- source_word: שְׁתֵּי הָאֲרָצוֹת
  choice: die beiden Länder
  rationale: אֲרָצוֹת bezeichnet hier territoriale Gebiete; „Länder“ ist im Deutschen die natürliche Entsprechung und bewahrt die Parallelität zu „Völker“.
- source_word: לִי תִהְיֶינָה
  choice: sollen mir gehören
  rationale: Die Wendung drückt den beanspruchten künftigen Besitz aus. „Sollen mir gehören“ gibt zugleich Anspruch und Zukunftsbezug idiomatisch wieder.
- source_word: וִירַשְׁנוּהָ
  choice: und wir werden sie in Besitz nehmen
  rationale: ירשׁ bezeichnet das Erlangen beziehungsweise Antreten von Besitz, häufig mit dem Hintergrund der Verdrängung bisheriger Besitzer. Das feminine Singularsuffix nimmt das Landgebiet kollektiv auf; das deutsche „sie“ bezieht sich verständlich auf die beiden Länder.
- source_word: וַיהוָה שָׁם הָיָה
  choice: obwohl Jahwe dort war
  rationale: 'Die bloße waw-Verknüpfung erhält im Kontext plausibel einen konzessiven Sinn: Edom erhob seinen Besitzanspruch trotz Jahwes Gegenwart. Der Gottesname wird als „Jahwe“ wiedergegeben.'
theological_decisions:
- issue: Sinn der Schlussklausel וַיהוָה שָׁם הָיָה
  choice: obwohl Jahwe dort war
  alternative: und Jahwe war dort; während Jahwe dort war
  rationale: Der konzessive Anschluss macht im Kontext die Vermessenheit des Anspruchs deutlich. Da die hebräische Konjunktion auch rein koordinierend oder temporal verstanden werden kann, wird die Mehrdeutigkeit in einer Fußnote offengelegt.
- issue: Bezug der beiden Völker und Länder
  choice: im Haupttext nicht namentlich bestimmt
  alternative: Israel und Juda samt ihren Gebieten
  rationale: Der Kontext legt eine konkrete Identifikation nahe, doch der Vers selbst nennt die beiden Größen nicht. Die Übersetzung wahrt diese Ausdrücklichkeitsebene.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bestimmten Formen des Hebräischen werden formal als „die beiden“ wiedergegeben; ein zusätzliches deiktisches „diese“ ist im Deutschen nicht erforderlich. Der Vers bleibt als begründender, syntaktisch noch nicht abgeschlossener Satz mit Schlusskomma stehen.
