source:
  edition: WLC
  text: וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י אֵלֶ֖י/ךָ הַר שֵׂעִ֑יר וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/ךָ שְׁמָמָ֥ה וּ/מְשַׁמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/003.yaml
  text: 'and say to it[a], ‘Thus says the Lord GOD: Behold, I am against you, Mount Seir, and I will stretch out my hand against you and make you a desolation and a waste.’'
translation:
  language: de
  text: 'und sag zu ihm: »So spricht Gott, der HERR: Siehe, ich bin gegen dich, Berg Seïr! Ich werde meine Hand gegen dich ausstrecken und dich zu einer Einöde und einer Verwüstung[a] machen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einer Einöde und zu einem Gegenstand des Entsetzens«. Das zweite Substantiv kann eine Verwüstung bezeichnen, die Entsetzen oder Bestürzung hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ לּוֹ
  choice: und sag zu ihm
  rationale: Das maskuline Pronomen bezieht sich auf den personifiziert angeredeten Berg Seïr; im Deutschen ist daher „ihm“ sowohl grammatisch als auch sachlich passend.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen vertraute Wiedergabe des zusammengesetzten Gottesnamens vermeidet das schwer verständliche „Herr HERR“ und kennzeichnet JHWH durch Kapitälchen als Gottes Eigennamen.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Siehe, ich bin gegen dich
  rationale: „Siehe“ bewahrt den feierlichen prophetischen Nachdruck; in diesem Gerichtszusammenhang bezeichnet die Präposition feindliche Gegenüberstellung.
- source_word: הַר שֵׂעִיר
  choice: Berg Seïr
  rationale: Die direkte Anrede und die Personifikation des geografischen Gebiets bleiben erhalten; die Trema-Schreibung unterstützt die korrekte Aussprache.
- source_word: וְנָטִיתִי יָדִי עָלֶיךָ
  choice: Ich werde meine Hand gegen dich ausstrecken
  rationale: Die geläufige biblische Gerichtsmetapher wird formal bewahrt und ist im Deutschen verständlich.
- source_word: וּנְתַתִּיךָ
  choice: dich … machen
  rationale: In Verbindung mit den folgenden Zustandsbezeichnungen drückt das Verb aus, dass der Angeredete in einen Zustand völliger Verwüstung versetzt wird.
- source_word: שְׁמָמָה
  choice: Einöde
  rationale: Das Wort bezeichnet einen verwüsteten, menschenleeren Zustand; „Einöde“ ist prägnant und würdevoll.
- source_word: וּמְשַׁמָּה
  choice: und einer Wüste
  rationale: Die Wiedergabe erhält die verstärkende Reihung zweier eng verwandter Verwüstungsbegriffe; die mögliche Bedeutung „Gegenstand des Entsetzens“ wird in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr JHWH / der Herr Jahwe
  rationale: Die gewählte deutsche Konvention ist verständlich und unterscheidet den Gottesnamen typografisch von dem Titel אֲדֹנָי, ohne eine bestimmte Aussprache des Tetragramms im Haupttext festzulegen.
- issue: Art der angekündigten göttlichen Gegnerschaft
  choice: ich bin gegen dich
  alternative: ich komme gegen dich
  rationale: Der hebräische Ausdruck erklärt eindeutig Gottes feindliche Stellung im Gericht, legt aber nicht zwingend den zusätzlichen Bewegungsaspekt „kommen“ fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter prophetischer Direktheit. „Siehe“ und die Metapher vom Ausstrecken der Hand bleiben wegen ihres feierlichen Gerichtscharakters erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
