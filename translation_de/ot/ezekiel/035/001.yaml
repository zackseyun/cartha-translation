  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an mich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Form führt die nächste prophetische Mitteilung im Erzählfluss ein. Im Deutschen gibt die feste Wendung „das Wort … erging“ die Funktion natürlich und würdig wieder, ohne das schwerfällige „und es geschah“.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel bezeichnet דְבַר eine bestimmte göttliche Mitteilung. „Das Wort“ bewahrt die wiederkehrende Formel und bleibt näher am Hebräischen als „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt; dies entspricht der im modernen Deutschen üblichen wissenschaftlichen Umschrift.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit der deutschen Formel „das Wort erging“ ist „an mich“ die idiomatische Entsprechung von אֵלַי.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Gottesnamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „das Wort Jahwes erging an mich“ wahrt den hebräischen Charakter; der Doppelpunkt leitet knapp und natürlich die in Vers 2 folgende Rede ein.
