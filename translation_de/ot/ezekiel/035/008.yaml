  text: וּ/מִלֵּאתִ֥י אֶת הָרָ֖י/ו חֲלָלָ֑י/ו גִּבְעוֹתֶ֤י/ךָ וְ/גֵאוֹתֶ֨י/ךָ֙ וְ/כָל אֲפִיקֶ֔י/ךָ חַלְלֵי חֶ֖רֶב יִפְּל֥וּ בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/008.yaml
  text: And I will fill its mountains with its slain; on your hills[a], in your valleys, and in all your ravines, those slain by the sword will fall.
translation:
  language: de
  text: Und ich werde seine Berge mit seinen Erschlagenen füllen. Auf deinen Hügeln, in deinen Tälern und in all deinen Schluchten werden vom Schwert Erschlagene fallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִלֵּאתִי
  choice: Und ich werde … füllen
  rationale: Das mit waw verbundene Qal-Perfekt steht in prophetischer Gerichtsaussage und wird im Deutschen natürlich futurisch wiedergegeben; „Und“ bildet die Satzverknüpfung ausdrücklich ab.
- source_word: הָרָיו / חֲלָלָיו
  choice: seine Berge / seine Erschlagenen
  rationale: Die maskulinen Suffixe beziehen sich auf den zuvor genannten, personifiziert angesprochenen Berg Seïr beziehungsweise sein Gebiet. Die dritte Person des hebräischen Textes bleibt erhalten, bevor der Text zur direkten Anrede in der zweiten Person zurückkehrt.
- source_word: גִּבְעוֹתֶיךָ
  choice: deinen Hügeln
  rationale: Das Wort bezeichnet hier topografisch Hügel; „Höhen“ könnte unnötig kultische Vorstellungen wecken.
- source_word: גֵאוֹתֶיךָ
  choice: deinen Tälern
  rationale: Im Zusammenhang der Aufzählung von Geländeformen ist die Bedeutung „Täler“ sachgerecht und ergibt zusammen mit Hügeln und Schluchten ein stimmiges Landschaftsbild.
- source_word: אֲפִיקֶיךָ
  choice: deinen Schluchten
  rationale: Das Wort kann Rinnen, Bachbetten oder Schluchten bezeichnen. „Schluchten“ passt zum Gelände und setzt kein fließendes Wasser voraus.
- source_word: חַלְלֵי חֶרֶב
  choice: vom Schwert Erschlagene
  rationale: Die Formulierung bewahrt sowohl den gewaltsamen Tod als auch das Schwert als dessen Mittel.
- source_word: יִפְּלוּ בָהֶם
  choice: Auf …, in … und in … werden … fallen
  rationale: Das Pronomen „in ihnen“ verweist auf die zuvor genannten Geländeformen. Die deutsche Voranstellung der einzelnen Ortsangaben gibt diesen Bezug vollständig und idiomatisch wieder, ohne ein redundantes Schlusspronomen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der auffällige Wechsel von der dritten Person („seine“) zur direkten Anrede („deinen“) wurde als Eigenart des hebräischen Textes bewahrt. „Erschlagene“ erhält den militärisch-gewaltsamen Charakter des Verses.
