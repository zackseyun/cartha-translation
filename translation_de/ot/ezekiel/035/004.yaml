source:
  edition: WLC
  text: עָרֶ֨י/ךָ֙ חָרְבָּ֣ה אָשִׂ֔ים וְ/אַתָּ֖ה שְׁמָמָ֣ה תִֽהְיֶ֑ה וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/004.yaml
  text: I will make your cities ruins[a], and you will become a desolation; then you will know that I am Yahweh.
translation:
  language: de
  text: Deine Städte werde ich zu Ruinen machen, und du selbst wirst zur Einöde werden. Dann wirst du erkennen, dass ich Jahwe[a] bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֶיךָ
  choice: deine Städte
  rationale: Der Plural von עִיר mit dem Suffix der 2. Person Maskulin Singular bezeichnet die zum angesprochenen Berg Seïr beziehungsweise zu Edom gehörenden bewohnten Orte; „Städte“ ist im Deutschen die natürliche Wiedergabe.
- source_word: חָרְבָּה
  choice: zu Ruinen
  rationale: Das Substantiv bezeichnet einen verwüsteten, zerstörten Zustand. In Verbindung mit שׂים und dem pluralischen Objekt „Städte“ gibt „zu Ruinen machen“ die Aussage idiomatisch wieder.
- source_word: אָשִׂים
  choice: werde ich … machen
  rationale: שׂים bedeutet hier „setzen/machen“ und bildet mit dem prädikativen Substantiv eine Veränderungskonstruktion. Die Futurform entspricht der noch bevorstehenden Gerichtsankündigung.
- source_word: וְאַתָּה
  choice: und du selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen hebt den Adressaten gegenüber seinen Städten hervor. „Du selbst“ bewahrt diese Betonung, ohne sie unnötig auszubauen.
- source_word: שְׁמָמָה
  choice: zur Einöde
  rationale: Das Substantiv bezeichnet einen Zustand oder Ort völliger Verwüstung. Die nominale Formulierung „zur Einöde werden“ erhält die Bildkraft und Struktur des Hebräischen.
- source_word: תִהְיֶה
  choice: wirst … werden
  rationale: היה kann „sein“ oder „werden“ bedeuten. Im Zusammenhang der angekündigten Verwandlung in einen verwüsteten Zustand ist „werden“ treffend.
- source_word: וְיָדַעְתָּ
  choice: Dann wirst du erkennen
  rationale: Das vorangestellte ו verbindet die Erkenntnis als Folge mit dem angekündigten Gericht. „Dann“ macht diesen Zusammenhang in natürlichem Deutsch deutlich; „erkennen“ trägt dem gewichtigen Erkenntnissinn der prophetischen Formel Rechnung.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Die Formulierung ist die für Ezechiel typische Erkenntnisformel. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder; die traditionelle deutsche Ersatzlesung „der HERR“ wird in einer Fußnote genannt.
- issue: Bedeutungsnuance von וְיָדַעְתָּ
  choice: Dann wirst du erkennen
  alternative: Und du wirst wissen
  rationale: Die Aussage lässt die durch das Gericht herbeigeführte Anerkennung von Jahwes Identität hervortreten. „Erkennen“ bewahrt das theologische Gewicht, ohne eine freiwillige oder rettende Gotteserkenntnis hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Gerichtsansage. „Du selbst“ wahrt die hebräische Hervorhebung; „Ruinen“ und „Einöde“ sind allgemein verständlich und erhalten zugleich die Bildsprache. Der Fußnotenmarker steht unmittelbar beim Gottesnamen, auf den sich die Anmerkung bezieht.
