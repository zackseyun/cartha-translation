  naturalness: '„Die Herzen vieler Völker“ ist im modernen Standarddeutsch deutlich natürlicher als „das Herz vieler Völker“. Die ansonsten leicht gespannte Formulierung „deinen Untergang unter die Nationen bringen“ kann stehen bleiben: Sie bildet die ungewöhnliche, absichtlich nicht weiter erklärte Konstruktion des Ausgangstextes ab, ohne eine nicht ausgedrückte „Nachricht“ einzuführen.'
  terminology: „Völker“ gegenüber „Nationen“ bildet die Unterscheidung von עַמִּים und גּוֹיִם sinnvoll ab. „Untergang“ und die Alternativen in den Anmerkungen sind theologisch neutral und quellenbezogen. Die Fußnoten sollten am unmittelbar erläuterten Ausdruck bzw. vor dem Satzschluss verankert werden.
