  text: וְ/הִ֨כְעַסְתִּ֔י לֵ֖ב עַמִּ֣ים רַבִּ֑ים בַּ/הֲבִיאִ֤/י שִׁבְרְ/ךָ֙ בַּ/גּוֹיִ֔ם עַל אֲרָצ֖וֹת אֲשֶׁ֥ר לֹֽא יְדַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/009.yaml
  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
translation:
  language: de
  text: Und ich werde die Herzen vieler Völker beunruhigen[a], wenn ich deinen Untergang[b] unter die Nationen bringe, in Länder, die du nicht gekannt hast[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erzürnen“; oder: „betrüben“. Das hebräische Verb kann Zorn, Kummer oder innere Unruhe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zusammenbruch“. Das hebräische Wort kann einen Bruch oder ein Zerbrechen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „über Länder, die du nicht gekannt hast“. Die Präposition kann auch „auf“ oder „über“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְעַסְתִּי
  choice: ich werde … beunruhigen
  rationale: Der Hifil von כעס kann ein Versetzen in Zorn, Kummer oder innere Unruhe bezeichnen. In Verbindung mit לֵב gibt „beunruhigen“ die emotionale Erschütterung wieder, ohne sie ausschließlich als Zorn oder Trauer festzulegen.
- source_word: לֵב עַמִּים רַבִּים
  choice: das Herz vieler Völker
  rationale: Der hebräische Singular „Herz“ wird bewahrt und bezeichnet kollektiv das Innere beziehungsweise Empfinden vieler Völker. „Völker“ unterscheidet עַמִּים von dem folgenden גּוֹיִם.
- source_word: בַּהֲבִיאִי
  choice: wenn ich … bringe
  rationale: Der Infinitivus constructus mit בְּ bezeichnet hier den zeitlichen Umstand; „wenn ich“ ist im Deutschen natürlich und quellennah.
- source_word: שִׁבְרְךָ
  choice: deinen Untergang
  rationale: שֶׁבֶר bezeichnet wörtlich Bruch oder Zerbrechen und kann daraus folgend Zusammenbruch, Verderben oder Untergang meinen. „Untergang“ passt zum Gericht über den angesprochenen Pharao beziehungsweise Ägypten.
- source_word: בַּגּוֹיִם
  choice: unter die Nationen
  rationale: Die Präposition steht hier in einer Bewegungskonstruktion mit „bringen“. „Unter die Nationen“ bewahrt diese Richtung und gibt zugleich die internationale Bekanntmachung des Untergangs wieder.
- source_word: עַל אֲרָצוֹת
  choice: in Länder
  rationale: עַל kann „auf/über“ bedeuten, bezeichnet hier aber im Anschluss an das Verb des Bringens das Ziel beziehungsweise die räumliche Ausdehnung. „In Länder“ ergibt einen klaren deutschen Satz.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: die du nicht gekannt hast
  rationale: ידע bezeichnet hier Bekanntschaft oder Erfahrung. Das pluralische Suffix bezieht sich auf die Länder; die Formulierung wahrt die direkte Anrede und den perfektischen Rückblick.
theological_decisions:
- issue: Emotionale Wirkung des göttlichen Gerichts auf die Völker
  choice: Gott versetzt das Innere vieler Völker in Unruhe.
  alternative: Gott macht viele Völker zornig oder betrübt sie.
  rationale: כעס lässt Zorn, Kummer und Beunruhigung als Bedeutungsnuancen zu. „Beunruhigen“ hält die innere Erschütterung fest, ohne die im Hebräischen offene konkrete Gefühlsreaktion einzuengen.
- issue: Gegenstand, den Gott zu den Nationen bringt
  choice: Der Untergang des angesprochenen Herrschers beziehungsweise Ägyptens selbst wird zu den Nationen gebracht.
  alternative: Die Nachricht vom Untergang wird zu den Nationen gebracht.
  rationale: Der Kontext kann an die öffentliche Bekanntmachung des Untergangs denken lassen, doch „Nachricht“ steht nicht ausdrücklich im hebräischen Text und wird daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Singular „das Herz“ folgt bewusst dem Hebräischen; die ungewöhnliche Wendung „den Untergang … bringen“ bleibt erhalten, damit die im Ausgangstext mögliche Spannung zwischen dem Untergang selbst und seiner Bekanntmachung nicht stillschweigend aufgelöst wird.
