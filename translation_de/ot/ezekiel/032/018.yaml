  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אָדָ֕ם נְהֵ֛ה עַל הֲמ֥וֹן מִצְרַ֖יִם וְ/הוֹרִדֵ֑/הוּ א֠וֹתָ/הּ וּ/בְנ֨וֹת גּוֹיִ֧ם אַדִּרִ֛ם אֶל אֶ֥רֶץ תַּחְתִּיּ֖וֹת אֶת י֥וֹרְדֵי בֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/018.yaml
  text: Son of man[a], wail over the multitude of Egypt, and bring her down, her and the daughters of mighty nations, to the land beneath[c][b], with those who go down to the pit.
translation:
  language: de
  text: Menschensohn[a], wehklage über die Volksmenge Ägyptens und führe sie hinab[b], sie und die Töchter mächtiger Völker[c], in das Land in der Tiefe[d], zusammen mit denen, die in die Grube hinabsteigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Sohn des Menschen“. Dies ist die für Hesekiel typische Anrede; auch „Menschenkind“ oder „Sterblicher“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: Die überlieferte Form von „führe ihn hinab“ hat ein maskulines Suffix; unmittelbar danach steht jedoch ausdrücklich das feminine „sie“ für das personifizierte Ägypten.
    reason: textual_note
  - marker: c
    text: „Töchter mächtiger Völker“ ist ein bildhafter Ausdruck; gemeint sind wohl personifizierte Völker oder Volksgruppen, die mit Ägypten verbunden sind.
    reason: cultural_note
  - marker: d
    text: Auch „das Land der Tiefen“ oder „die Unterwelt“. Die Wendung bezeichnet den unten vorgestellten Bereich der Toten.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel wiederkehrende prophetische Anrede wird in ihrer hebräischen Bildform bewahrt. Im Deutschen ist „Menschensohn“ verständlich und traditionsübergreifend etabliert, ohne die Anrede hier vorschnell christologisch auszulegen.
- source_word: נְהֵה
  choice: klage
  rationale: Das Verb bezeichnet laute, trauerliedartige Klage. „Klage“ ist im modernen Deutschen würdig und unmittelbar; der Bestattungs- und Gerichtskontext vermittelt die Intensität.
- source_word: הֲמוֹן מִצְרַיִם
  choice: die Menge Ägyptens
  rationale: הָמוֹן bezeichnet häufig eine große Menschenmenge oder ein lärmendes Gedränge. Hier liegt Ägyptens zahlreiche Bevölkerung beziehungsweise Volksmasse näher als die ebenfalls mögliche Bedeutung „Reichtum“.
- source_word: וְהוֹרִדֵהוּ / אוֹתָהּ
  choice: und bring sie hinab
  rationale: Der Hifil-Imperativ fordert dazu auf, Ägypten hinabzubringen. Das folgende ausdrückliche feminine אוֹתָהּ bezieht sich auf Ägypten als personifiziertes Land; die auffällige maskuline Suffixform im vorausgehenden Wort wird in einer Fußnote kenntlich gemacht.
- source_word: וּבְנוֹת גּוֹיִם אַדִּרִם
  choice: sie und die Töchter mächtiger Völker
  rationale: „Töchter“ erhält das hebräische Bild personifizierter oder Ägypten zugeordneter Völker. אַדִּירִם wird seinem Macht- und Hoheitsgehalt entsprechend mit „mächtig“ wiedergegeben.
- source_word: אֶרֶץ תַּחְתִּיּוֹת
  choice: das Land tief unten
  rationale: Die Wendung bezeichnet wörtlich ein Land der unteren Bereiche. Die Formulierung bewahrt die räumliche Tiefenmetaphorik, ohne sie mit einer später systematisierten Jenseitsvorstellung gleichzusetzen.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: zusammen mit denen, die in die Grube hinabsteigen
  rationale: אֶת wird hier assoziativ verstanden. Die Wendung bezeichnet die Gemeinschaft der Toten, zu denen Ägypten hinabgebracht wird.
- source_word: בּוֹר
  choice: die Grube
  rationale: „Grube“ bewahrt das konkrete Bild und dessen Grabes- und Totenreichanklang, ohne die Aussage auf „Grab“, „Scheol“ oder „Hölle“ zu verengen.
theological_decisions:
- issue: Bedeutung der Unterweltsbilder אֶרֶץ תַּחְתִּיּוֹת und בּוֹר
  choice: Konkrete Wiedergabe als „das Land tief unten“ und „die Grube“
  alternative: „Unterwelt“, „Scheol“ oder „Hölle“
  rationale: Der poetische Gerichtstext schildert den Bereich der Toten durch räumliche Bilder. Die Übersetzung wahrt diese Bildsprache und lässt ihre theologische Reichweite offen, statt eine spätere Lehre vom Jenseits einzutragen.
- issue: Personifizierung Ägyptens und grammatisches Geschlecht
  choice: Ägypten wird mit dem femininen Pronomen „sie“ personifiziert
  alternative: Neutrales „es“ oder maskulines „ihn“ entsprechend dem auffälligen Suffix in וְהוֹרִדֵהוּ
  rationale: Das unmittelbar folgende אוֹתָהּ ist eindeutig feminin und die anschließenden „Töchter“ führen die Personifizierung fort. Die formale Unregelmäßigkeit wird dennoch nicht verschwiegen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzführung. Die wiederholte Tiefenbewegung („hinab“, „tief unten“, „hinabsteigen“) wird als prägendes poetisches Motiv erhalten. Bildhafte Ausdrücke werden im Haupttext nicht aufgelöst, sondern knapp erläutert.
