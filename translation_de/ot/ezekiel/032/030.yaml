source:
  edition: WLC
  text: שָׁ֣מָּ/ה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖/ם וְ/כָל צִֽדֹנִ֑י אֲשֶׁר יָרְד֣וּ אֶת חֲלָלִ֗ים בְּ/חִתִּיתָ֤/ם מִ/גְבֽוּרָתָ/ם֙ בּוֹשִׁ֔ים וַ/יִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת חַלְלֵי חֶ֔רֶב וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/030.yaml
  text: There are all the princes of the north[a], all of them, and all the Sidonians, who went down with the slain in the terror they caused by their might, ashamed. They lie uncircumcised with those slain by the sword[c][b], and they bear their disgrace with those who go down to the pit.
translation:
  language: de
  text: Dort sind alle Fürsten des Nordens[a], sie alle, und alle Sidonier, die mit den Erschlagenen hinabgestiegen sind, beschämt wegen des Schreckens, den sie durch ihre Macht verbreiteten[b]. Unbeschnitten[c] liegen sie bei den vom Schwert Erschlagenen und tragen ihre Schande zusammen mit denen, die in die Grube hinabfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Dort sind sie, alle Fürsten des Nordens.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in/bei ihrem Schrecken aus ihrer Macht“. Die knappe hebräische Verbindung kann den mit ihnen verbundenen oder von ihrer Macht ausgehenden Schrecken bezeichnen; im Zusammenhang liegt der Schrecken nahe, den sie durch ihre militärische Stärke verbreiteten.'
    reason: lexical_alternative
  - marker: c
    text: „Unbeschnitten“ ist hier ein bewusst beibehaltener Ausdruck der Schmach in Hesekiels Gerichtssprache.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: Dort sind
  rationale: Das Ortsadverb weist auf den Bereich der Toten, der im Zusammenhang beschrieben wird. „Dort sind“ ist im Deutschen natürlich und bewahrt den hinweisenden Charakter.
- source_word: נְסִיכֵי צָפוֹן
  choice: Fürsten des Nordens
  rationale: נְסִיךְ bezeichnet hochgestellte Herrscher oder Anführer; „Fürsten“ wahrt den gehobenen politischen Sinn, ohne eine bestimmte Staatsform festzulegen.
- source_word: כֻּלָּם
  choice: alle
  rationale: Die umfassende Aussage des Hebräischen wird ausdrücklich wiedergegeben, ohne das im Deutschen schwerfällige „sie alle“ zusätzlich einzuschieben.
- source_word: וְכָל צִדֹנִי
  choice: und alle Sidonier
  rationale: Die singularische Volksbezeichnung wird kollektiv gebraucht; der deutsche Plural gibt dies natürlich wieder.
- source_word: יָרְדוּ אֶת חֲלָלִים
  choice: Sie sind mit den Erschlagenen hinabgestiegen
  rationale: „Hinabsteigen“ bewahrt das wiederkehrende Bild vom Abstieg ins Totenreich. אֶת wird hier dem Zusammenhang entsprechend begleitend als „mit“ verstanden.
- source_word: בְּחִתִּיתָם מִגְבוּרָתָם
  choice: trotz des Schreckens, den sie durch ihre Macht verbreiteten
  rationale: Die knappe hebräische Verbindung bedeutet wörtlich etwa „bei/in ihrem Schrecken aus ihrer Macht“. Im Kontext bezeichnet der Schrecken wahrscheinlich den von ihrer militärischen Stärke ausgehenden Schrecken; „trotz“ macht den Gegensatz zwischen früherer Macht und gegenwärtiger Beschämung verständlich, wird aber wegen der formalen Mehrdeutigkeit in einer Fußnote erläutert.
- source_word: בּוֹשִׁים
  choice: beschämt
  rationale: Das Partizip bezeichnet ihren Zustand nach dem Hinabsteigen und nimmt die spätere „Schande“ auf.
- source_word: וַיִּשְׁכְּבוּ
  choice: liegen sie
  rationale: Im Katalog der Unterwelt beschreibt das Verb ihren fortdauernden Zustand; das deutsche Präsens ist dafür idiomatisch.
- source_word: עֲרֵלִים
  choice: Unbeschnitten
  rationale: Der konkrete, in Hesekiels Gerichtssprache schmachvolle Ausdruck wird erhalten und nicht durch eine theologische Deutung ersetzt.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: bei den vom Schwert Erschlagenen
  rationale: אֶת wird auch hier assoziativ verstanden. Die Formulierung ist klar und wahrt das ausdrückliche Schwertmotiv.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם אֶת יֹרְדֵי בוֹר
  choice: und tragen ihre Schande zusammen mit denen, die in die Grube hinabgestiegen sind
  rationale: „Ihre Schande tragen“ entspricht dem hebräischen Bild. Das zweite אֶת wird als Bezeichnung der Gemeinschaft mit den übrigen Toten wiedergegeben.
theological_decisions:
- issue: Wiedergabe von עֲרֵלִים im Gerichtszusammenhang
  choice: Unbeschnitten
  alternative: außerhalb des Bundes / entehrt
  rationale: Der wörtliche Ausdruck trägt in Hesekiel kulturelle und bundesbezogene Schamkonnotationen. Die Übersetzung bewahrt das konkrete Bild, ohne diese Bedeutungen auf eine einzige theologische Auslegung zu verengen.
- issue: Bezug von בְּחִתִּיתָם מִגְבוּרָתָם
  choice: der von ihrer Macht ausgehende und von ihnen verbreitete Schrecken
  alternative: 'der Schrecken, den sie selbst wegen ihrer Macht empfanden; wörtlich: „in ihrem Schrecken aus ihrer Macht“'
  rationale: Im Kontext der früher gefürchteten Völker liegt verursachter Schrecken nahe. Da Syntax und Präpositionen knapp und mehrdeutig sind, wird die Unsicherheit in der Fußnote offengelegt.
- issue: Zeitliche Wiedergabe von וַיִּשְׁכְּבוּ
  choice: liegen sie (Präsens)
  alternative: und sie legten sich / lagen
  rationale: Die Vision katalogisiert den gegenwärtig geschauten Zustand der Toten. Das Präsens wahrt diese Darstellungsfunktion, obwohl die hebräische Erzählform formal vergangenheitsbezogen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an Bildwelt und Satzbewegung des Hebräischen. Die langen hebräischen Glieder wurden maßvoll in deutsche Sätze gegliedert. Konkrete Gerichtsbilder wie „unbeschnitten“, „Schwert“ und „Grube“ bleiben erhalten; die syntaktische Mehrdeutigkeit der Schreckensformel wird nicht verschwiegen.
