revisions:
- from: Dort sind alle Fürsten des Nordens[a] und alle Sidonier. Sie sind mit den Erschlagenen hinabgestiegen, beschämt trotz des Schreckens, den sie durch ihre Macht verbreiteten[b]. Unbeschnitten liegen sie bei den vom Schwert Erschlagenen[c] und tragen ihre Schande zusammen mit denen, die in die Grube hinabgestiegen sind.
  to: Dort sind alle Fürsten des Nordens[a], sie alle, und alle Sidonier, die mit den Erschlagenen hinabgestiegen sind, beschämt wegen des Schreckens, den sie durch ihre Macht verbreiteten[b]. Unbeschnitten[c] liegen sie bei den vom Schwert Erschlagenen und tragen ihre Schande zusammen mit denen, die in die Grube hinabfahren.
