  text: כָּל מְא֤וֹרֵי אוֹר֙ בַּ/שָּׁמַ֔יִם אַקְדִּירֵ֖/ם עָלֶ֑י/ךָ וְ/נָתַ֤תִּי חֹ֨שֶׁךְ֙ עַֽל אַרְצְ/ךָ֔ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/008.yaml
  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
translation:
  language: de
  text: Alle Lichtträger am Himmel werde ich über dir verdunkeln[a], und ich werde Finsternis über dein Land legen – Ausspruch des Herrn, Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »alle Lichtquellen des Lichts am Himmel«; gemeint sind die leuchtenden Himmelskörper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Alle
  rationale: Der Quantor bezeichnet die Gesamtheit der himmlischen Lichtquellen.
- source_word: מְאוֹרֵי אוֹר
  choice: Lichtträger
  rationale: Die wörtliche Verbindung »Lichtquellen des Lichts« bezeichnet die leuchtenden Himmelskörper. »Lichtträger« ist im Deutschen verständlich und bewahrt den konkreten Bezug, während die Fußnote die ungewöhnliche hebräische Formulierung dokumentiert.
- source_word: בַּשָּׁמַיִם
  choice: am Himmel
  rationale: Im Deutschen bezeichnet »am Himmel« natürlich den Bereich der Himmelskörper und gibt den hebräischen Plural idiomatisch wieder.
- source_word: אַקְדִּירֵם
  choice: werde ich … verdunkeln
  rationale: Die Kausativform von קדר besagt, dass Gott die Lichtträger dunkel werden lässt.
- source_word: עָלֶיךָ
  choice: über dir
  rationale: Die räumliche Wiedergabe bewahrt das Bild der über dem Angeredeten verdunkelten Himmelskörper.
- source_word: וְנָתַתִּי חֹשֶׁךְ
  choice: und … werde ich Finsternis legen
  rationale: »Legen« erhält die konkrete Ausdrucksweise von נתן und klingt zusammen mit »Finsternis« würdig und verständlich.
- source_word: עַל אַרְצְךָ
  choice: über dein Land
  rationale: אֶרֶץ meint hier das Herrschaftsgebiet des Angeredeten; עַל führt das Motiv einer darüber ausgebreiteten Dunkelheit fort.
- source_word: נְאֻם
  choice: spricht
  rationale: »Spricht« ist eine etablierte, feierliche deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und bewahrt beide Bestandteile, ohne »Herr HERR« zu bilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR
  rationale: Der Text enthält sowohl den Herrentitel als auch den Eigennamen. »Der Herr, Jahwe« macht diese Unterscheidung sichtbar und vermeidet eine konfessionell geprägte Ersetzung des Namens.
- issue: Reichweite der kosmischen Verdunkelung
  choice: konkrete prophetische Bildsprache beibehalten
  alternative: als bloßes Sinnbild politischen Untergangs ausdeuten
  rationale: Der Vers nennt himmlische Lichtträger und Finsternis über dem Land. Die Übersetzung legt nicht fest, ob die Sprache wörtlich, symbolisch oder zugleich beides zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildkraft. Die Satzstellung stellt wie im Hebräischen zunächst die Gesamtheit der himmlischen Lichtträger heraus.
