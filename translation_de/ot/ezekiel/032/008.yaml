  rationale: Die Übersetzung behält die tragfähige Wiedergabe »Lichtträger« samt erklärender Fußnote bei. Nur die Wortstellung des zweiten Teils und die Wiedergabe der prophetischen Formel werden für bessere Quellengenauigkeit und idiomatisches modernes Deutsch angepasst. Die kosmische Bildsprache bleibt ohne zusätzliche Deutung erhalten.
