    issue: Ungebräuchliche Wortstellung bei »Finsternis legen«
    rationale: Die Stellung des Zielausdrucks direkt beim Verb ist im modernen Standarddeutsch flüssiger und lässt zugleich die konkrete Bildlichkeit von נתן ... עַל bewahren.
  - severity: medium
    issue: »spricht der Herr, Jahwe« gibt נְאֻם nicht optimal wieder
    rationale: נְאֻם ist eine prophetische Ausspruchs- bzw. Orakelformel, nicht einfach ein finites Redeverb. Eine nominale Ausspruchsformel ist quellennäher und im deutschen Prophetenstil natürlich.
