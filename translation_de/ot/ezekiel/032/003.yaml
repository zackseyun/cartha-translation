  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/פָרַשְׂתִּ֤י עָלֶ֨י/ךָ֙ אֶת רִשְׁתִּ֔/י בִּ/קְהַ֖ל עַמִּ֣ים רַבִּ֑ים וְ/הֶעֱל֖וּ/ךָ בְּ/חֶרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/003.yaml
  text: 'Thus says the Lord GOD: I will spread my net over you with an assembly of many peoples[b][a], and they will haul you up in my dragnet.'
translation:
  language: de
  text: 'So spricht der Herr Jahwe: Ich werde mein Netz über dir ausbreiten durch eine Versammlung vieler Völker[a], und sie werden dich in meinem Schleppnetz heraufziehen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „inmitten einer Versammlung vieler Völker“ oder „mit einer Versammlung vieler Völker“. Die Völker können als Mittel verstanden werden, durch das Gott sein Netz ausbreitet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie werden dich mit meinem Fangnetz heraufziehen“. Im Hebräischen steht hier ein anderes Wort für ein Fischernetz als zuvor bei „mein Netz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen vertraute ehrerbietige Wiedergabe kennzeichnet den Gottesnamen durch HERR und vermeidet die schwer verständliche Doppelung „Herr HERR“. Der Titel bleibt als feierliche Gottesbezeichnung erkennbar.
- source_word: וּפָרַשְׂתִּי
  choice: Ich werde … ausbreiten
  rationale: פרשׂ bezeichnet das Ausbreiten oder Ausspannen; beim Netz ist „ausbreiten“ natürlich und bleibt näher am Bild als das stärker deutende „auswerfen“.
- source_word: רִשְׁתִּי
  choice: mein Netz
  rationale: רֶשֶׁת ist die allgemeine Bezeichnung für ein Netz; das Possessivsuffix wird ausdrücklich wiedergegeben.
- source_word: בִּקְהַל עַמִּים רַבִּים
  choice: durch die versammelte Menge vieler Völker
  rationale: קהל bezeichnet eine versammelte Gemeinschaft oder Menge. „Durch“ gibt die im Kontext wahrscheinliche instrumentale Funktion von ב wieder; die Fußnote bewahrt die auch mögliche räumliche oder begleitende Lesart.
- source_word: וְהֶעֱלוּךָ
  choice: und sie werden dich … heraufziehen
  rationale: Der Hifil von עלה bedeutet „hinaufbringen“; im Fangbild trifft „heraufziehen“ die Bewegung, ohne das Bild unnötig auszubauen.
- source_word: בְּחֶרְמִי
  choice: in meinem Schleppnetz
  rationale: חֶרֶם bezeichnet hier ein Fang- beziehungsweise Fischernetz und ist ein anderes Wort als רֶשֶׁת. „Schleppnetz“ bewahrt diesen lexikalischen Wechsel und passt zum Heraufziehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr JHWH / Herr Jahwe
  rationale: Die Hauptfassung folgt einer weithin verständlichen deutschen Ehrfurchtskonvention, bei der HERR den zugrunde liegenden Gottesnamen signalisiert. Sie vermeidet zugleich die unnatürliche Form „Herr HERR“, ohne den Titel mit einer konfessionell geprägten Auslegung anzureichern.
- issue: Handelnde Völker als Werkzeug des göttlichen Gerichts
  choice: durch die versammelte Menge vieler Völker
  alternative: inmitten der Versammlung vieler Völker / zusammen mit einer Versammlung vieler Völker
  rationale: 'Das instrumentale Verständnis von ב passt zum folgenden pluralischen Subjekt „sie“: Die Völker führen das angekündigte Gericht aus. Da die Präposition auch räumlich oder begleitend verstanden werden kann, wird diese Spannung in der Fußnote offengehalten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Bildsprache. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch „die versammelte Menge“ idiomatisch geglättet. Die beiden unterschiedlichen Netzbegriffe werden im Haupttext unterschieden.
