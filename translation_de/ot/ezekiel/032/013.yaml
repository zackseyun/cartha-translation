revisions:
- from: Und ich werde all ihre Tiere an den reichen Wassern vernichten.[a] Kein Menschenfuß wird sie mehr trüben,[b] und auch Tierhufe werden sie nicht trüben.
  to: Und ich werde all ihre Tiere bei den vielen Wassern vernichten.[a] Kein menschlicher Fuß wird sie mehr trüben,[b] und auch die Hufe der Tiere werden sie nicht trüben.
  rationale: Die räumliche Wendung wurde zu einer im Deutschen natürlichen Form geändert, die den Bereich der vielen Wasser weiterhin klar mit einbezieht. Die generische Personenbezeichnung wurde geglättet. Die parallele Wiederholung von „trüben“ sowie die Bildsprache von Fuß und Hufen bleiben erhalten.
