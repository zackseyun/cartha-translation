  text: וְ/הַֽאֲבַדְתִּי֙ אֶת כָּל בְּהֶמְתָּ֔/הּ מֵ/עַ֖ל מַ֣יִם רַבִּ֑ים וְ/לֹ֨א תִדְלָחֵ֤/ם רֶֽגֶל אָדָם֙ ע֔וֹד וּ/פַרְס֥וֹת בְּהֵמָ֖ה לֹ֥א תִדְלָחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/013.yaml
  text: And I will destroy all its beasts from beside its abundant waters[a], and no human foot will muddy them anymore[b], nor will the hooves of beasts muddy them.
translation:
  language: de
  text: Und ich werde all ihre Tiere bei den vielen Wassern vernichten.[a] Kein menschlicher Fuß wird sie mehr trüben,[b] und auch die Hufe der Tiere werden sie nicht trüben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei den wasserreichen Gewässern“.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb bezeichnet das Trüben oder Schlammigmachen des Wassers durch Tritte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: Und ich werde … vernichten
  rationale: Das Hifil von אבד bezeichnet hier das Verursachen des Untergangs bzw. die Beseitigung. „Vernichten“ gibt den Gerichtskontext klar und würdig wieder.
- source_word: בְּהֶמְתָּהּ
  choice: all ihre Tiere
  rationale: בְּהֵמָה kann Vieh oder Tiere allgemein bezeichnen. „Tiere“ bewahrt die mögliche Bedeutungsbreite; das Suffix der 3. Person Singular feminin wird mit „ihre“ wiedergegeben und bezieht sich auf das personifizierte Ägypten bzw. sein Land.
- source_word: מֵעַל מַיִם רַבִּים
  choice: an den reichen Wassern
  rationale: מֵעַל bezeichnet hier den Bereich, von dem die Tiere beseitigt werden; im Deutschen gibt „an“ die Lage bei den Wassern natürlich wieder. רַבִּים beschreibt deren große bzw. reichliche Menge, daher „reiche Wasser“.
- source_word: תִדְלָחֵם
  choice: wird sie … trüben
  rationale: דלח bezeichnet hier das Trüb- oder Schlammigmachen des Wassers durch Tritte. „Trüben“ ist knapp, präzise und lässt die im Kontext erkennbare Art der Einwirkung bestehen. Das Suffix verweist auf die Wasser.
- source_word: רֶגֶל אָדָם
  choice: Menschenfuß
  rationale: אָדָם ist hier generisch und bezeichnet einen Menschen, nicht den Eigennamen Adam. „Menschenfuß“ wahrt den Singular und gibt den allgemeinen Sinn ohne geschlechtliche Verengung wieder.
- source_word: עוֹד
  choice: mehr
  rationale: 'In Verbindung mit der Verneinung bezeichnet עוֹד das Ende eines bisherigen Geschehens: „nicht mehr“.'
- source_word: וּפַרְסוֹת בְּהֵמָה
  choice: und auch Tierhufe
  rationale: פַּרְסוֹת bezeichnet Hufe, insbesondere gespaltene Hufe. „Tierhufe“ ist im Deutschen natürlich und hält die Parallele zum Menschenfuß aufrecht.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: Menschenfuß
  alternative: Mannesfuß
  rationale: Das Wort bezeichnet in diesem Zusammenhang die Menschheit allgemein und nicht ausdrücklich einen männlichen Einzelnen. Die gewählte Form gibt diesen generischen Bezug präzise wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Parallelität. „Reiche Wasser“ bewahrt die bildhafte Sprache des Gerichtswortes; „Menschenfuß“ und „Tierhufe“ bilden eine klare, natürliche Gegenüberstellung.
