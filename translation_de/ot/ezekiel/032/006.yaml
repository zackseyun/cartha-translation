  yaml_path: translation/ot/ezekiel/032/006.yaml
  text: I will drench the land with your flowing blood up to the mountains[c][b][a], and the ravines will be filled with you.
translation:
  language: de
  text: Ich werde das Land mit deinem Blut tränken, bis hin zu den Bergen[a], und die Täler werden sich mit dir füllen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck vor „von deinem Blut“ ist schwierig und seine genaue Bedeutung unsicher. Er kann sich auf ein Ausströmen oder eine Überflutung beziehen; daher ist auch möglich: „Ich werde das Land mit deinem ausströmenden Blut tränken.“'
    reason: lexical_alternative
  - marker: b
    text: '„Täler“ kann hier auch „Rinnen“, „Bachläufe“, „Flussbetten“ oder „Schluchten“ bedeuten. Wörtlich: „und die Täler werden von dir gefüllt werden“; gemeint sind wahrscheinlich dein Blut, dein Körper oder deine Überreste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקֵיתִי
  choice: Ich werde … tränken
  rationale: Der Hifil von שׁקה bedeutet wörtlich „trinken lassen“ beziehungsweise „bewässern“. „Tränken“ bewahrt das Bild und trägt im Gerichtskontext die gewaltsame Sättigung des Landes mit Blut.
- source_word: אֶרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das betroffene Gebiet und seine Landschaft; „Land“ ist daher natürlicher als „Erde“ oder „Boden“.
- source_word: צָפָתְךָ מִדָּמְךָ
  choice: mit deinem ausströmenden Blut
  rationale: צָפָתְךָ ist textlich und lexikalisch schwierig. Zusammen mit מִדָּמְךָ liegt wahrscheinlich das aus dem Erschlagenen hervorströmende Blut vor. „Ausströmendes Blut“ gibt diesen wahrscheinlichen Sinn wieder, ohne ihn als einzig mögliche Analyse auszugeben.
- source_word: אֶל הֶהָרִים
  choice: bis zu den Bergen
  rationale: אֶל bezeichnet hier wahrscheinlich die räumliche Ausdehnung des Blutes bis an die Berge.
- source_word: וַאֲפִקִים
  choice: die Täler
  rationale: אֲפִיקִים kann Rinnen, Flussbetten oder Schluchten bezeichnen. „Täler“ ist im Deutschen als Landschaftsbegriff verständlich; die engeren Möglichkeiten werden in der Fußnote genannt.
- source_word: יִמָּלְאוּן מִמֶּךָּ
  choice: werden sich mit dir füllen
  rationale: Der Nifal von מלא bezeichnet das Gefülltwerden. Das wörtlichere „von dir“ ist im Deutschen unklar; „mit dir“ bewahrt die direkte, personifizierte Anrede und lässt offen, ob Blut, Körper oder Überreste gemeint sind.
