  naturalness: Die revidierte Fassung bleibt modern und würdig. „Schar“ ist im kriegerisch-gerichtlichen Kontext eine natürliche, bewusst breite Wiedergabe von הָמוֹן und kann sowohl die große Menschenmasse als auch die militärisch geprägte Masse bezeichnen. Die appositionale Erläuterung nach dem Gedankenstrich stellt den Bezug auf die Krieger klar.
