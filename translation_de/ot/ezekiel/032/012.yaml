source:
  edition: WLC
  text: בְּ/חַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔/ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם וְ/שָֽׁדְדוּ֙ אֶת גְּא֣וֹן מִצְרַ֔יִם וְ/נִשְׁמַ֖ד כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/012.yaml
  text: By the swords of mighty men I will make your multitude fall— all of them the ruthless ones of the nations[a]. They will plunder the pride of Egypt[b], and all her multitude will be destroyed.
translation:
  language: de
  text: Durch die Schwerter von Kriegern lasse ich deine Schar fallen – sie alle, die Rücksichtslosen der Völker. Sie werden den Stolz Ägyptens[a] plündern, und seine ganze Schar wird vernichtet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Hoheit Ägyptens“ beziehungsweise „die Pracht Ägyptens“; das hebräische Wort kann sowohl Stolz als auch Größe und Pracht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַרְבוֹת
  choice: Durch die Schwerter von
  rationale: Die Präposition בְּ bezeichnet hier das Mittel. „Durch die Schwerter“ bewahrt das konkrete Kriegsbild und klingt im Deutschen natürlich.
- source_word: גִּבּוֹרִים
  choice: Helden
  rationale: גִּבּוֹרִים bezeichnet starke, kampferprobte Männer. „Helden“ ist knapp und würdig und behält die traditionelle martialische Bedeutung bei, ohne das allgemeinere Wort ausdrücklich auf „Krieger“ einzuengen.
- source_word: אַפִּיל
  choice: lasse ich … fallen
  rationale: Der Hifil von נפל ist kausativ. Die Formulierung gibt sowohl die Verursachung als auch das Fallmotiv unmittelbar wieder.
- source_word: הֲמוֹנֶךָ
  choice: deine Menge
  rationale: הָמוֹן kann eine Menschenmenge, Volksmasse oder Heerschar bezeichnen. „Menge“ bleibt breit genug und ermöglicht die bewusste Wiederholung am Versende.
- source_word: עָרִיצֵי גוֹיִם כֻּלָּם
  choice: sie alle sind Gewalttäter unter den Völkern
  rationale: עָרִיץ bezeichnet gewalttätige, rücksichtslose oder tyrannische Menschen. „Gewalttäter“ bringt den Kern der Gewalttätigkeit zum Ausdruck; „unter den Völkern“ gibt die Zuordnung durch den Genitiv wieder, ohne ein politisches Amt vorauszusetzen.
- source_word: וְשָׁדְדוּ
  choice: Sie werden … ausplündern
  rationale: שׁדד bezeichnet Plündern oder Berauben. „Ausplündern“ passt zum direkten Objekt und zum militärischen Gerichtskontext.
- source_word: גְּאוֹן מִצְרַיִם
  choice: den Stolz Ägyptens
  rationale: גָּאוֹן kann Stolz, Hoheit oder Pracht meinen. „Stolz“ passt zum Gerichtswort und kann zugleich das bezeichnen, worauf Ägypten stolz ist.
- source_word: וְנִשְׁמַד
  choice: wird vernichtet werden
  rationale: Der Nifal von שׁמד drückt vollständige Zerstörung aus. „Vernichtet werden“ ist stark, klar und wahrt das Passiv.
- source_word: כָּל הֲמוֹנָהּ
  choice: seine ganze Menge
  rationale: Das feminine Suffix bezieht sich auf Ägypten; im Deutschen ist der Landesname grammatisch sächlich. Die Wiederholung von „Menge“ spiegelt die Wiederholung von הָמוֹן.
theological_decisions:
- issue: Bedeutung von גְּאוֹן im Gerichtswort
  choice: Stolz Ägyptens
  alternative: Hoheit oder Pracht Ägyptens
  rationale: Im Zusammenhang der Erniedrigung Ägyptens liegt „Stolz“ nahe, doch das Wort kann zugleich seine Größe und Pracht bezeichnen. Diese weitere Möglichkeit wird in der Fußnote offengehalten.
- issue: Charakterisierung der עָרִיצֵי גוֹיִם
  choice: Gewalttäter unter den Völkern
  alternative: Tyrannen der Völker
  rationale: Der Ausdruck hebt vor allem Rücksichtslosigkeit und Gewalt hervor. „Gewalttäter“ vermeidet die unbelegte Festlegung auf politische Herrscher, während die Alternative die mögliche tyrannische Nuance dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Bildsprache und Parallelstruktur. Die zweimalige Wiedergabe von הָמוֹן mit „Menge“ bewahrt die rhetorische Wiederholung; die Fußnoten markieren echte lexikalische Mehrdeutigkeiten.
