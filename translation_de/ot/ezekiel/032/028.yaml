  text: וְ/אַתָּ֗ה בְּ/ת֧וֹךְ עֲרֵלִ֛ים תִּשָּׁבַ֥ר וְ/תִשְׁכַּ֖ב אֶת חַלְלֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/028.yaml
  text: But you[a], in the midst of the uncircumcised, will be broken and will lie with those slain by the sword.
translation:
  language: de
  text: Du aber wirst mitten unter den Unbeschnittenen zerbrochen werden und mit den vom Schwert Erschlagenen liegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen eröffnet eine betonte direkte Anrede und markiert im Zusammenhang einen Gegensatz beziehungsweise Übergang zu Pharao; „Du aber“ gibt dies natürlich wieder.
- source_word: בְּתוֹךְ
  choice: mitten unter
  rationale: Die Wendung bezeichnet die Stellung innerhalb einer Gruppe. „Mitten unter“ bewahrt sowohl die räumliche Vorstellung als auch den feierlich-poetischen Ton.
- source_word: עֲרֵלִים
  choice: den Unbeschnittenen
  rationale: Die konkrete körperlich-kulturelle und bundestheologische Bezeichnung bleibt erhalten; eine Deutung als „Unreine“, „Gottlose“ oder „Heiden“ würde den Ausdruck verallgemeinern.
- source_word: תִּשָּׁבַר
  choice: wirst … zerbrochen werden
  rationale: Der Nifal-Imperfekt von שׁבר bezeichnet hier passiv Niederlage und Untergang. „Zerbrochen werden“ ist quellennah und lässt die Bildsprache unangetastet.
- source_word: וְתִשְׁכַּב
  choice: und … liegen
  rationale: שׁכב bezeichnet im Kontext das Liegen im Tod beziehungsweise im Grab. Das schlichte „liegen“ bleibt würdig und wird durch die folgende Gruppe der Erschlagenen eindeutig.
- source_word: אֶת חַלְלֵי חָרֶב
  choice: bei den vom Schwert Erschlagenen
  rationale: אֵת kann nach שׁכב begleitend verstanden werden. „Bei den vom Schwert Erschlagenen“ ist idiomatisches Deutsch und bewahrt zugleich das Schwertmotiv der hebräischen Status-constructus-Verbindung.
theological_decisions:
- issue: Bedeutung von עֲרֵלִים in der Totenklage über die Völker
  choice: die konkrete Bezeichnung „die Unbeschnittenen“ beibehalten
  alternative: die Unreinen; die Gottlosen; die Heiden
  rationale: Der hebräische Text verwendet ausdrücklich den körperlichen und kulturell-bundestheologischen Ausdruck. In Hesekiel 32 kennzeichnet er die Schande im Tod; die wörtliche Wiedergabe bewahrt diese Spannung, ohne eine allgemeinere Lehrkategorie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. „Mitten unter“ klingt natürlicher als „inmitten der“, während „zerbrochen werden“ die ungewöhnliche, harte Bildsprache des Ausgangstextes bewusst bewahrt.
