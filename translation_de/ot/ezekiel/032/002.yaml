source:
  edition: WLC
  text: בֶּן אָדָ֗ם שָׂ֤א קִינָה֙ עַל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וְ/אָמַרְתָּ֣ אֵלָ֔י/ו כְּפִ֥יר גּוֹיִ֖ם נִדְמֵ֑יתָ וְ/אַתָּה֙ כַּ/תַּנִּ֣ים בַּ/יַּמִּ֔ים וַ/תָּ֣גַח בְּ/נַהֲרוֹתֶ֗י/ךָ וַ/תִּדְלַח מַ֨יִם֙ בְּ/רַגְלֶ֔י/ךָ וַ/תִּרְפֹּ֖ס נַהֲרוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/002.yaml
  text: 'Son of man[a], raise a lament over Pharaoh king of Egypt, and say to him: You compared yourself to a young lion among the nations, but you were like the monster in the seas; you burst forth in your rivers, and muddied the waters with your feet[c][b], and fouled their rivers.'
translation:
  language: de
  text: 'Menschensohn, stimm ein Klagelied über den Pharao, den König von Ägypten, an und sag zu ihm: Du hast dich einem jungen Löwen unter den Völkern gleichgestellt[a]; doch du warst wie das Ungeheuer in den Meeren[b]. Du brachst in deinen Strömen hervor, wühltest mit deinen Füßen das Wasser auf und zertratest ihre Ströme[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wurdest einem jungen Löwen unter den Völkern gleichgestellt.“ Die hebräische Verbform kann reflexiv oder passiv verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort bezeichnet hier wahrscheinlich ein großes Wasserwesen; möglich sind auch „Drache“ oder „Seeungeheuer“.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb bedeutet wörtlich „treten“ oder „zertrampeln“; im Wasserbild kann damit gemeint sein, dass die Ströme aufgewühlt oder verschmutzt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die im Ezechielbuch feststehende Anrede wird idiomatisch und traditionsgerecht wiedergegeben, ohne אָדָם auf bloße Sterblichkeit zu verengen.
- source_word: שָׂא קִינָה
  choice: stimm ein Klagelied … an
  rationale: Gibt die prophetische Aufforderung zur Erhebung einer Totenklage in natürlichem, gehobenem Gegenwartsdeutsch wieder.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: den Pharao, den König von Ägypten
  rationale: Bewahrt Titel und Herrschaftsbezeichnung; die Apposition entspricht natürlichem Deutsch.
- source_word: כְּפִיר גּוֹיִם
  choice: einem jungen Löwen unter den Völkern
  rationale: כְּפִיר bezeichnet einen jungen, kräftigen Löwen; „unter den Völkern“ gibt die relationale Einordnung wieder.
- source_word: נִדְמֵיתָ
  choice: hast du dich … gleichgestellt
  rationale: Die reflexive Deutung des Nifal passt zum spöttischen Kontext, während die mögliche passive Deutung in Fußnote [a] ausdrücklich erhalten bleibt.
- source_word: כַּתַּנִּים בַּיַּמִּים
  choice: wie das Ungeheuer in den Meeren
  rationale: Der aquatische Zusammenhang spricht für ein großes, bedrohliches Wasserwesen und gegen „Schakal“; der bestimmte Artikel wird mit „das“ bewahrt.
- source_word: וַתָּגַח בְּנַהֲרוֹתֶיךָ
  choice: Du brachst in deinen Strömen hervor
  rationale: Gibt die heftige, stoßende Bewegung des Verbs innerhalb der Wasserbildsprache verständlich wieder, ohne sie auf ein wörtliches „mit den Hörnern stoßen“ zu beschränken.
- source_word: וַתִּדְלַח מַיִם בְּרַגְלֶיךָ
  choice: wühltest mit deinen Füßen das Wasser auf
  rationale: Drückt anschaulich aus, dass das Wasser durch die Füße bewegt und getrübt wird.
- source_word: וַתִּרְפֹּס נַהֲרוֹתָם
  choice: zertratest ihre Ströme
  rationale: Bewahrt die konkrete Bedeutung „treten/zertrampeln“ und das maskuline Pluralsuffix „ihre“; die Wirkung auf das Wasser wird in Fußnote [c] erläutert.
theological_decisions:
- issue: Handlungsträger bei נִדְמֵיתָ
  choice: 'Reflexive Haupttextfassung: Der Pharao stellt sich einem jungen Löwen gleich.'
  alternative: 'Passive Fassung: Er wurde mit einem jungen Löwen verglichen beziehungsweise einem solchen gleichgeachtet.'
  rationale: Das Nifal erlaubt hier eine reflexive oder passive Auffassung. Der Spott- und Gerichtskontext stützt die reflexive Lesart, doch die grammatische Mehrdeutigkeit wird nicht dogmatisch entschieden, sondern in Fußnote [a] offengelegt.
- issue: Mythische oder zoologische Bestimmung von תַּנִּים
  choice: Ungeheuer
  alternative: Drache, Seeungeheuer oder großes Wassertier
  rationale: Die Übersetzung lässt offen, ob ein konkretes Tier oder ein chaotisch-mythisches Wasserwesen im Blick ist, und vermeidet dadurch eine unnötige theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-poetischem Klang. Die Satzfolge bleibt bildkräftig und quellennah; ungewöhnliche Wasserbilder werden nicht geglättet. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
