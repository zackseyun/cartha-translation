  text: וְ/לֹ֤א יִשְׁכְּבוּ֙ אֶת גִּבּוֹרִ֔ים נֹפְלִ֖ים מֵ/עֲרֵלִ֑ים אֲשֶׁ֣ר יָרְדֽוּ שְׁא֣וֹל בִּ/כְלֵֽי מִלְחַמְתָּ/ם֩ וַ/יִּתְּנ֨וּ אֶת חַרְבוֹתָ֜/ם תַּ֣חַת רָאשֵׁי/הֶ֗ם וַ/תְּהִ֤י עֲוֺֽנֹתָ/ם֙ עַל עַצְמוֹתָ֔/ם כִּֽי חִתִּ֥ית גִּבּוֹרִ֖ים בְּ/אֶ֥רֶץ חַיִּֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/027.yaml
  text: And they do not lie with the mighty, the fallen from among the uncircumcised[a], who went down to Sheol with their weapons of war, whose swords were placed under their heads, and whose iniquities were upon their bones[e][d][c][b]; for the terror of the mighty was in the land of the living.
translation:
  language: de
  text: Und sie liegen nicht bei den Helden, den Gefallenen aus den Unbeschnittenen,[a] die mit ihren Kriegswaffen ins Totenreich[b] hinabstiegen; sie legten ihre Schwerter unter ihre Köpfe, und ihre Vergehen[c] lagen auf ihren Gebeinen. Denn der Schrecken der Helden war im Land der Lebenden.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sie werden nicht bei den gefallenen Helden aus den Unbeschnittenen liegen.“ Die hebräische Konstruktion ist schwierig; außerdem kann die Verbform hier futurisch verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Scheol“, der Bereich der Toten; auch mit „Unterwelt“ oder „Grab“ wiedergegeben.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch „Schuld“ oder „Strafe für ihre Vergehen“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: 'Der hebräische Schlusssatz ist schwierig. Möglich ist auch: „Denn sie verbreiteten als Helden Schrecken im Land der Lebenden.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא יִשְׁכְּבוּ
  choice: Und sie liegen nicht
  rationale: Das Verb bezeichnet im Bestattungskontext das Liegen der Toten. Das Yiqtol nach Negation wird in der anschaulichen Klage präsentisch wiedergegeben; eine futurische Nuance bleibt möglich und wird in der Fußnote genannt.
- source_word: אֶת גִּבּוֹרִים נֹפְלִים מֵעֲרֵלִים
  choice: bei den Helden, den Gefallenen aus den Unbeschnittenen
  rationale: אֶת wird in der schwierigen Konstruktion assoziativ als „bei“ verstanden. Die Apposition erhält die mögliche partitive Beziehung von מֵעֲרֵלִים, ohne „Helden“ unnötig auf Krieger einzuengen.
- source_word: שְׁאוֹל
  choice: Totenreich
  rationale: „Totenreich“ vermittelt im heutigen Deutsch den Bereich der Toten, ohne den Begriff auf ein einzelnes Grab oder auf die spätere Vorstellung der Hölle festzulegen.
- source_word: בִּכְלֵי מִלְחַמְתָּם
  choice: mit ihren Kriegswaffen
  rationale: Die Formulierung gibt die militärische Ausrüstung natürlich und knapp wieder und bewahrt das Bild einer ehrenvollen Kriegerbestattung.
- source_word: וַיִּתְּנוּ אֶת חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם
  choice: denen man ihre Schwerter unter den Kopf legte
  rationale: Die unpersönliche deutsche Konstruktion folgt dem aktiven hebräischen Verb, ohne festzulegen, wer die Schwerter niederlegte. Das Bestattungsbild bleibt deutlich.
- source_word: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
  choice: deren Vergehen auf ihren Gebeinen lagen
  rationale: „Vergehen“ hält den moralischen Sinn von עָוֹן fest, während eine Fußnote die ebenfalls möglichen Aspekte Schuld und Strafe nennt. „Gebeine“ passt zum würdevollen Grabkontext.
- source_word: כִּי חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים
  choice: denn der Schrecken der Helden war im Land der Lebenden
  rationale: Die knappe und schwierige hebräische Nominalfügung wird bewusst nicht eindeutig kausativ aufgelöst. So bleibt offen, ob es um den Schrecken geht, der von den Helden ausging, oder um eine andere Zuordnung.
theological_decisions:
- issue: Bedeutungsumfang von עָוֹן im Gerichtskontext
  choice: „Vergehen“ im Haupttext; Schuld und Strafe als Alternativen in der Fußnote
  alternative: „Schuld“ oder „Strafe für ihre Vergehen“
  rationale: Der hebräische Ausdruck kann Tat, Schuld und deren Folge umfassen. Die Übersetzung legt die theologische Beziehung zwischen Sünde, Schuld und Gericht nicht stillschweigend auf nur einen Aspekt fest.
- issue: Identität und Bestattungsrang der gefallenen Helden
  choice: Apposition „bei den Helden, den Gefallenen aus den Unbeschnittenen“
  alternative: „bei den gefallenen Helden aus den Unbeschnittenen“
  rationale: Die Syntax des Hebräischen ist schwierig. Die Hauptfassung wahrt die partitive Deutung; die enger verbundene Lesart wird in der Fußnote offengelegt.
- issue: Urheberschaft des Schreckens in der Schlussklausel
  choice: „der Schrecken der Helden war“
  alternative: „sie verbreiteten als Helden Schrecken“
  rationale: Die elliptische Formulierung wird nicht zu einer eindeutigen Aussage über das Handeln der Toten erweitert; die wahrscheinlich kausative Deutung erscheint als Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Totenreich“ und „Gebeine“ bewahren den feierlich-düsteren Ton, bleiben aber allgemein verständlich. Die syntaktischen Härten und theologischen Mehrdeutigkeiten des Hebräischen werden durch knappe Fußnoten sichtbar gemacht.
