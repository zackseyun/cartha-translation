base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/005.yaml
  text: And I will put your flesh on the mountains[a], and I will fill the valleys with your carcass.
translation:
  language: de
  text: Ich werde dein Fleisch auf die Berge legen und die Täler mit deiner mächtigen Gestalt[a] füllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist schwierig. Wörtlicher kann es an „deine Höhe“ oder „deine Erhabenheit“ denken lassen; im Zusammenhang ist wohl die gewaltige Gestalt, also der gefallene Leib beziehungsweise Leichnam des Pharaos, gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ich werde … legen
  rationale: נתן kann „geben“, „setzen“ oder „legen“ bedeuten. Im Bild des über das Gelände hingestreckten Leibes ist „legen“ im Deutschen natürlich und bewahrt Gottes unmittelbares Handeln.
- source_word: בְּשָׂרְךָ
  choice: dein Fleisch
  rationale: בשר bezeichnet wörtlich „Fleisch“. Die konkrete, drastische Gerichtssprache wird nicht zum allgemeineren „Körper“ abgeschwächt.
- source_word: עַל הֶהָרִים
  choice: auf die Berge
  rationale: הרים bedeutet gewöhnlich „Berge“; die Wiedergabe erhält das topografische Gegenstück zu den Tälern.
- source_word: וּמִלֵּאתִי
  choice: und … füllen
  rationale: מלא im Piel bedeutet hier schlicht „füllen“ und vermittelt das gewaltige Ausmaß des Bildes.
- source_word: הַגֵּאָיוֹת
  choice: die Täler
  rationale: גיא kann „Tal“ oder „Schlucht“ bezeichnen. „Täler“ ist hier idiomatisch und passt zum Parallelismus mit den Bergen.
- source_word: רָמוּתֶךָ
  choice: deine hochragende Masse
  rationale: Die ungewöhnliche Form ist mit Höhe oder Erhabenheit verbunden, bezeichnet im Zusammenhang aber offenbar die gewaltige, nun gefallene Körpermasse des Pharaos. „Hochragende Masse“ bewahrt sowohl den Anklang an Höhe als auch das konkrete Bild, ohne die schwierige Lesart stillschweigend auf „Leichnam“ festzulegen.
theological_decisions:
- issue: Darstellung des gewaltsamen göttlichen Gerichts
  choice: Das konkrete Bild von Fleisch auf den Bergen und einer die Täler füllenden Körpermasse bleibt erhalten.
  alternative: Die Formulierung durch „Körper“ oder „Überreste“ abmildern.
  rationale: Der prophetische Gerichtsspruch schildert Erniedrigung und Niederlage bewusst drastisch. Eine beschönigende Wiedergabe würde die Aussagekraft des Hebräischen abschwächen.
- issue: Deutung von רָמוּתֶךָ
  choice: Die Mehrdeutigkeit wird im Text durch „hochragende Masse“ und in einer Fußnote kenntlich gemacht.
  alternative: Eindeutig „dein Leichnam“ oder formal „deine Höhe“ übersetzen.
  rationale: Der Kontext legt den gefallenen Leib des Pharaos nahe, während die Wortform selbst auf Höhe beziehungsweise Erhabenheit verweist. Die Übersetzung soll weder den Kontext verdunkeln noch die lexikalische Schwierigkeit verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und parallel; die drastische Körperlichkeit des hebräischen Gerichtswortes wird bewahrt. Das ungewöhnliche „hochragende Masse“ ist bewusst gewählt und durch die Fußnote erläutert.
