  to: Mitten unter den Erschlagenen bereitete man ihr ein Lager, zusammen mit ihrer ganzen Menge[a]. Ihre Gräber sind rings um ihn. Sie alle sind unbeschnitten, vom Schwert erschlagen; denn ihr Schrecken wurde im Land der Lebenden gesetzt[b]. So trugen sie ihre Schmach zusammen mit denen, die in die Grube hinabsteigen. Mitten unter den Erschlagenen wurde er beigesetzt[c].
