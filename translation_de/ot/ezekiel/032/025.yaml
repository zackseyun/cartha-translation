source:
  edition: WLC
  text: בְּ/ת֣וֹךְ חֲ֠לָלִים נָתְנ֨וּ מִשְׁכָּ֥ב לָ/הּ֙ בְּ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתֶ֑/הָ כֻּלָּ֣/ם עֲרֵלִ֣ים חַלְלֵי חֶ֡רֶב כִּֽי נִתַּ֨ן חִתִּיתָ֜/ם בְּ/אֶ֣רֶץ חַיִּ֗ים וַ/יִּשְׂא֤וּ כְלִמָּתָ/ם֙ אֶת י֣וֹרְדֵי ב֔וֹר בְּ/ת֥וֹךְ חֲלָלִ֖ים נִתָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/025.yaml
  text: Among the slain they made a bed for her with all her multitude[a]; her graves are all around her. All of them are uncircumcised, slain by the sword, because their terror was set in the land of the living. So they bore their disgrace with those who go down to the pit[c][b]; she was placed among the slain.
translation:
  language: de
  text: Mitten unter den Erschlagenen bereitete man ihr ein Lager, zusammen mit ihrer ganzen Menge[a]. Ihre Gräber sind rings um ihn. Sie alle sind unbeschnitten, vom Schwert erschlagen; denn ihr Schrecken wurde im Land der Lebenden gesetzt[b]. So trugen sie ihre Schmach zusammen mit denen, die in die Grube hinabsteigen. Mitten unter den Erschlagenen wurde er beigesetzt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text wechselt in diesem Vers zwischen femininen Formen („ihr“, „ihre“) und maskulinen Formen („ihn“, „er“). Möglicherweise wechselt der Blick zwischen der personifizierten Macht und ihrem männlichen Repräsentanten.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „denn ihr Schrecken wurde im Land der Lebenden gesetzt“. Möglich ist auch: „denn sie verbreiteten ihren Schrecken im Land der Lebenden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das hebräische Verb ist hier maskulin Singular: „wurde er beigesetzt“. Einige Übersetzungen beziehen die Aussage auf die zuvor feminin personifizierte Macht und geben sie mit „wurde sie beigesetzt“ wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹךְ חֲלָלִים
  choice: Mitten unter den Erschlagenen
  rationale: בְּתוֹךְ bezeichnet die Mitte beziehungsweise das Sein unter einer Gruppe; חֲלָלִים meint hier im Krieg Getötete. Die Formulierung bewahrt zugleich das wiederholte Leitmotiv des Verses.
- source_word: נָתְנוּ מִשְׁכָּב לָהּ
  choice: bereitete man ihr ein Lager
  rationale: Der unbestimmte Plural נָתְנוּ lässt sich im Deutschen natürlich mit einem unpersönlichen „man“ wiedergeben. „Lager“ erhält das Bild eines Ruheplatzes im Totenreich, ohne es vorschnell zu „Grab“ zu verengen.
- source_word: בְּכָל הֲמוֹנָהּ
  choice: zusammen mit ihrer ganzen Menge
  rationale: הָמוֹן bezeichnet hier die große, der personifizierten Macht zugehörige Menschenmenge. „Menge“ bleibt breit und vermeidet die zusätzliche militärische Wertung von „Horden“.
- source_word: סְבִיבוֹתָיו קִבְרֹתֶהָ
  choice: Ihre Gräber sind rings um ihn
  rationale: Die Übersetzung bewahrt den auffälligen Wechsel vom femininen Suffix in קִבְרֹתֶהָ („ihre Gräber“) zum maskulinen Suffix in סְבִיבוֹתָיו („um ihn“), statt ihn stillschweigend zu glätten.
- source_word: כֻּלָּם עֲרֵלִים חַלְלֵי חֶרֶב
  choice: Sie alle sind unbeschnitten, vom Schwert erschlagen
  rationale: „Unbeschnitten“ gibt den ausdrücklichen Bundes- und Schandbegriff עֲרֵלִים konkret wieder. חַלְלֵי חֶרֶב ist die übliche Bezeichnung für durch das Schwert Getötete.
- source_word: כִּי נִתַּן חִתִּיתָם בְּאֶרֶץ חַיִּים
  choice: denn ihr Schrecken wurde im Land der Lebenden verbreitet
  rationale: נִתַּן ist ein Passiv von נתן. In Verbindung mit חִתִּיתָם bezeichnet es idiomatisch, dass ihr Schrecken wirksam gemacht oder verbreitet wurde. Das Passiv und die fehlende ausdrückliche handelnde Person bleiben erhalten.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם אֶת יֹרְדֵי בוֹר
  choice: So trugen sie ihre Schmach zusammen mit denen, die in die Grube hinabsteigen
  rationale: נשא mit כְלִמָּה bedeutet Schmach tragen. אֶת wird hier im Sinn der Gemeinschaft mit den übrigen Toten verstanden; „Grube“ bewahrt das Bild der Unterwelt.
- source_word: בְּתוֹךְ חֲלָלִים נִתָּן
  choice: Mitten unter den Erschlagenen wurde er beigesetzt
  rationale: Das abschließende נִתָּן ist grammatisch maskulin Singular. „Beigesetzt“ gibt im Bestattungskontext das Platzieren unter den Toten natürlich wieder, ohne die maskuline Form zu beseitigen.
theological_decisions:
- issue: Bezeichnung der Toten als „unbeschnitten“
  choice: Sie alle sind unbeschnitten
  alternative: Sie alle sind unreine Außenseiter
  rationale: Der hebräische Text gebraucht den konkreten Begriff עֲרֵלִים, der in Ezechiels Gerichtssprache Schande und den Status außerhalb des Bundes aufruft. Eine abstrakte Umschreibung würde diesen Gehalt abschwächen.
- issue: Wechsel zwischen femininen und maskulinen Bezügen
  choice: ihr … ihrer … ihre … ihn … er
  alternative: Alle Bezüge durchgehend feminin oder durchgehend maskulin wiedergeben
  rationale: Der masoretische Text wechselt innerhalb des Verses tatsächlich das grammatische Geschlecht. Dies kann zwischen der personifizierten politischen Größe und einem männlichen Repräsentanten wechseln. Die Übersetzung bewahrt diese Spannung und erläutert sie, statt sie zu harmonisieren.
- issue: Bedeutung des passiven נִתַּן bei „Schrecken“
  choice: ihr Schrecken wurde … verbreitet
  alternative: ihr Schrecken wurde … gesetzt
  rationale: Die gewählte Form gibt die idiomatische Wirkung des Ausdrucks verständlich wieder, behält aber das Passiv bei und benennt keinen im Hebräischen unausgesprochenen Urheber.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bestattungs- und Unterweltsmetaphorik bleibt sichtbar. Der ungewöhnliche Genuswechsel des hebräischen Textes wird im Haupttext bewusst bewahrt und durch Fußnoten verständlich gemacht.
