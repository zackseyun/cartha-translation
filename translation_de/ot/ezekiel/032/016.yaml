revisions:
- from: Dies ist ein Klagelied[a]; stimmt es als Klage an! Die Töchter der Völker[b] sollen es anstimmen. Über Ägypten und seine ganze Volksmenge[c] sollen sie es anstimmen – Ausspruch des Herrn Yahweh.
  to: Dies ist ein Klagelied[a]; die Töchter der Völker[b] werden es als Klage vortragen. Über Ägypten und über seine ganze Menge[c] werden sie es vortragen – Ausspruch des Herrn Yahweh.
  rationale: Die Revision beseitigt die grammatisch nicht gedeckte Imperativdeutung des ersten Verbs und gibt beide Formen von קונן als Aussagen über die „Töchter der Völker“ wieder. Die Wiederholung des Vortragens bewahrt die rhetorische Wiederholung des hebräischen Textes und den Bezug der Suffixe auf das Klagelied. Die Fußnoten bleiben inhaltlich zutreffend und sind an den jeweiligen Ausdrücken verankert.
