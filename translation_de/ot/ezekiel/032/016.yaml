  text: קִינָ֥ה הִיא֙ וְ/ק֣וֹנְנ֔וּ/הָ בְּנ֥וֹת הַ/גּוֹיִ֖ם תְּקוֹנֵ֣נָּה אוֹתָ֑/הּ עַל מִצְרַ֤יִם וְ/עַל כָּל הֲמוֹנָ/הּ֙ תְּקוֹנֵ֣נָּה אוֹתָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/016.yaml
  text: This is a lamentation[a], and the daughters of the nations will lament over her. They will lament over Egypt and over all her multitude[b], declares the Lord GOD.
translation:
  language: de
  text: Dies ist ein Klagelied[a]; die Töchter der Völker[b] werden es als Klage vortragen. Über Ägypten und über seine ganze Menge[c] werden sie es vortragen – Ausspruch des Herrn Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Totenklage“. Das hebräische Wort bezeichnet ein Klage- oder Totenlied.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: die Frauen der Völker; wörtlich: „die Töchter der Völker“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann eine große Menschenmenge, die Bevölkerung oder den lärmenden Tross eines Volkes bezeichnen.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: קִינָה
  choice: Klagelied
  rationale: Das Wort bezeichnet ein feierliches Klage- oder Totenlied. „Klagelied“ ist im heutigen Deutsch verständlich und lässt den genauen Anlass offen.
- source_word: וְקֹנְנוּהָ
  choice: stimmt es als Klage an
  rationale: Die Form ist ein Imperativ im Plural; das feminine Objektsuffix bezieht sich am natürlichsten auf das zuvor genannte Klagelied. Die Wiedergabe erhält daher sowohl den Aufforderungscharakter als auch das Lied als Objekt.
- source_word: בְּנוֹת הַגּוֹיִם
  choice: die Töchter der Völker
  rationale: Die wörtliche Bildsprache des Hebräischen bleibt erhalten; gemeint sein können die Frauen der fremden Völker, möglicherweise als Klagefrauen.
- source_word: תְּקוֹנֵנָּה אוֹתָהּ
  choice: sollen es anstimmen
  rationale: Der feminine Plural passt zum Subjekt „Töchter“; das Objektsuffix verweist auf das Klagelied. „Sollen“ gibt den im Zusammenhang naheliegenden auffordernden Sinn des Imperfekts wieder.
- source_word: עַל מִצְרַיִם
  choice: über Ägypten
  rationale: עַל kennzeichnet hier den Gegenstand der Totenklage; „über“ entspricht der deutschen Klagesprache.
- source_word: כָּל הֲמוֹנָהּ
  choice: seine ganze Volksmenge
  rationale: הָמוֹן bezeichnet die große, mit Ägypten verbundene Menschenmenge oder Bevölkerung. „Volksmenge“ wahrt die kollektive Weite, ohne den Ausdruck ausschließlich militärisch zu deuten.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: „Ausspruch“ bildet die prophetische Formel knapp und würdig ab. אֲדֹנָי wird als „Herr“ und der Gottesname יהוה als „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Bezug der femininen Objektsuffixe in וְקֹנְנוּהָ und אוֹתָהּ
  choice: 'Bezug auf das Klagelied: „es … anstimmen“'
  alternative: 'Bezug auf Ägypten: „über sie klagen“'
  rationale: Das unmittelbar vorausgehende feminine Substantiv קִינָה ist der grammatisch naheliegende Bezug; außerdem bezeichnet קונן das Vortragen eines Klagelieds. Der Gegenstand der Klage wird anschließend mit עַל ausdrücklich genannt.
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom persönlichen Gottesnamen יהוה und vermeidet die Doppelung „Herr HERR“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „anstimmen“ bildet die bewusste Wiederholung des hebräischen Verbs ab. Der Imperativ des ersten Verbs und der auffordernde Sinn der folgenden Imperfektformen bleiben unterscheidbar; die wörtliche Wendung „Töchter der Völker“ wird im Haupttext bewahrt und in der Fußnote erläutert.
