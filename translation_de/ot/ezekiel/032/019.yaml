  text: מִ/מִּ֖י נָעָ֑מְתָּ רְדָ֥/ה וְ/הָשְׁכְּבָ֖/ה אֶת עֲרֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/019.yaml
  text: Whom do you surpass in beauty? Go down[b][a], and lie with the uncircumcised.
translation:
  language: de
  text: Wen übertriffst du an Schönheit?[a] Steig hinab und lass dich bei den Unbeschnittenen niederlegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schöner als wen bist du?“ Das Hebräische formuliert einen rhetorischen Vergleich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und leg dich zu den Unbeschnittenen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּי
  choice: Wen …?
  rationale: Die Verbindung der Präposition מִן mit מִי drückt hier einen rhetorischen Vergleich aus. Zusammen mit dem Verb ergibt „Wen übertriffst du …?“ im Deutschen eine natürliche und genaue Wiedergabe.
- source_word: נָעָמְתָּ
  choice: übertriffst du an Schönheit
  rationale: נעם bezeichnet Anmut, Wohlgefälligkeit oder Schönheit. Im durch מִמִּי markierten Vergleich ist nicht bloß „angenehm sein“, sondern ein Übertreffen an Schönheit gemeint.
- source_word: רְדָה
  choice: Steig hinab
  rationale: Der Imperativ von ירד bezeichnet hier den Abstieg in die Totenwelt. „Steig hinab“ ist bildhaft, würdevoll und im Deutschen idiomatisch.
- source_word: וְהָשְׁכְּבָה
  choice: und lass dich … legen
  rationale: 'Die Form von שׁכב hat hier passiven beziehungsweise kausativ-passiven Sinn: Der Angeredete soll bei den Toten hingelegt werden. Die Formulierung vermeidet den zusätzlichen Gedanken einer friedlichen Ruhe.'
- source_word: אֶת
  choice: zu
  rationale: Nach שׁכב bezeichnet אֶת hier die Gemeinschaft oder Zuordnung beim Liegen. Im Deutschen bringt „zu den … legen“ diese Beziehung natürlich zum Ausdruck.
- source_word: עֲרֵלִים
  choice: den Unbeschnittenen
  rationale: Die konkrete Bezeichnung für Menschen ohne das Bundeszeichen der Beschneidung bleibt erhalten. So wird die mit Schande verbundene Bildsprache des Gerichtswortes nicht zu „Heiden“ oder „Unreinen“ verallgemeinert.
theological_decisions:
- issue: Bedeutung von עֲרֵלִים im Gerichtswort
  choice: die Unbeschnittenen
  alternative: die Heiden; die Unreinen
  rationale: Der hebräische Ausdruck benennt ausdrücklich die fehlende Beschneidung und trägt im Kontext zugleich den Beiklang von Schande. Die konkrete Wiedergabe bewahrt diese Spannung, ohne eine allgemeinere religiöse Kategorie einzutragen.
- issue: Vergleichende rhetorische Frage
  choice: Wen übertriffst du an Schönheit?
  alternative: Schöner als wen bist du?; Wem bist du an Anmut überlegen?
  rationale: Die rhetorische Frage stellt die behauptete Schönheit Ägyptens infrage. Die gewählte Fassung wahrt den Vergleich, ohne eine eindeutige Antwort in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Steig hinab“ bewahrt das Bild des Abstiegs; „lass dich … legen“ hält den Todes- und Bestattungskontext fest, ohne das im Hebräischen nicht ausdrücklich genannte „zur Ruhe“ hinzuzufügen.
