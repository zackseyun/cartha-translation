source:
  edition: WLC
  text: אֲשֶׁ֨ר נִתְּנ֤וּ קִבְרֹתֶ֨י/הָ֙ בְּ/יַרְכְּתֵי ב֔וֹר וַ/יְהִ֣י קְהָלָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֤/ם חֲלָלִים֙ נֹפְלִ֣ים בַּ/חֶ֔רֶב אֲשֶׁר נָתְנ֥וּ חִתִּ֖ית בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/023.yaml
  text: whose graves were set in the remotest parts of the pit[a], and her assembly was around her grave—all of them slain, fallen by the sword[b], who spread terror in the land of the living.
translation:
  language: de
  text: Deren Gräber wurden in den entlegensten Winkeln der Grube angelegt[a]. Ihre Schar war rings um ihr Grab; sie alle waren Erschlagene, durchs Schwert Gefallene – sie, die im Land der Lebenden Schrecken verbreiteten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den hintersten Bereichen der Grube«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Schrecken verursachten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתְּנוּ
  choice: wurden … angelegt
  rationale: Das Passiv von נתן bezeichnet hier die Platzierung der Gräber. „Gräber wurden angelegt“ ist im Deutschen idiomatisch und bewahrt den passiven Sinn.
- source_word: קִבְרֹתֶיהָ
  choice: deren Gräber
  rationale: Der feminine Singularsuffix wird durch das Relativpronomen aufgenommen; so bleibt die personifizierende Bezugnahme erhalten, ohne im Deutschen schwerfällig zu wirken.
- source_word: בְּיַרְכְּתֵי בוֹר
  choice: in den entlegensten Winkeln der Grube
  rationale: יַרְכְּתֵי bezeichnet die äußersten, abgelegenen Bereiche. „Grube“ gibt בוֹר wieder, ohne es deutend mit „Totenreich“ oder „Scheol“ gleichzusetzen.
- source_word: קְהָלָהּ
  choice: ihre Schar
  rationale: קהל bezeichnet hier die zu ihr gehörende versammelte Gruppe. „Schar“ passt zum militärisch-funeralen Zusammenhang und klingt natürlicher als „Versammlung“.
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: rings um ihr Grab
  rationale: Die räumliche Aussage wird knapp und direkt wiedergegeben; „Grab“ entspricht der Bestattungsbildsprache.
- source_word: כֻּלָּם חֲלָלִים
  choice: sie alle waren Erschlagene
  rationale: חֲלָלִים bezeichnet gewaltsam Getötete, besonders Kriegsopfer; „Erschlagene“ erhält diese Nuance.
- source_word: נֹפְלִים בַּחֶרֶב
  choice: durchs Schwert Gefallene
  rationale: Das Partizip steht beschreibend neben חֲלָלִים. Die traditionelle deutsche Wendung bewahrt das kriegerische Bild, ohne die Aussage abzuschwächen.
- source_word: נָתְנוּ חִתִּית
  choice: Schrecken verbreiteten
  rationale: Die Verbindung נתן mit חִתִּית bedeutet, Schrecken hervorzurufen oder zu verbreiten. Diese Fassung ist idiomatisch und lässt die genaue Wirkungsweise offen.
- source_word: בְּאֶרֶץ חַיִּים
  choice: im Land der Lebenden
  rationale: Die feste Wendung bezeichnet die Welt der Lebenden im Gegensatz zur Grube und wird im Deutschen transparent wiedergegeben.
theological_decisions:
- issue: Personifizierung durch feminine Singularsuffixe
  choice: Die femininen Bezüge werden mit „ihre“ und „ihr“ bewahrt.
  alternative: Neutrale Wiedergabe mit „seine“ beziehungsweise „dessen“, bezogen auf ein politisches Gebilde.
  rationale: Die hebräischen femininen Suffixe setzen die prophetische Personifizierung fort. Die deutsche Fassung erhält diese literarische Gestalt, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Unterweltsbild von בוֹר
  choice: „Grube“
  alternative: „Totenreich“, „Scheol“ oder „Grab“
  rationale: Im Hebräischen steht בוֹר und nicht שְׁאוֹל. „Grube“ bewahrt das konkrete Bild sowie dessen Offenheit und vermeidet eine präzisierende Gleichsetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bildhaft und relativ nah am Hebräischen, wird aber durch zwei Hauptsätze und eine Gedankenstrich-Apposition für heutige Leser übersichtlich gestaltet.
