id: EZK.32.1
reference: Ezekiel 32:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בִּ/שְׁנֵי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/001.yaml
  text: And it happened in the twelfth year[a], in the twelfth month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Im zwölften Jahr, im zwölften Monat, am ersten Tag des Monats, geschah es: Das Wort Jahwes[a] kam zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: geschah es
  rationale: Gibt die eröffnende narrative und zeitliche Funktion natürlich wieder, ohne die altertümliche Wendung »es begab sich« zu verwenden.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: im zwölften Jahr
  rationale: Entspricht der hebräischen Datierungsformel; ein nicht ausdrücklich genannter Bezugspunkt wie »der Verbannung« wird nicht ergänzt.
- source_word: בִּשְׁנֵי עָשָׂר חֹדֶשׁ
  choice: im zwölften Monat
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Kalenderangabe.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Die wörtliche Form »am Eins des Monats« ist eine hebräische Datumsformel und bezeichnet den ersten Monatstag.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: Das Wort Jahwes kam zu mir
  rationale: Natürliche deutsche Wiedergabe der prophetischen Offenbarungsformel; das wörtliche »war zu mir« wäre unidiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen; »Jahwe« ist die im Deutschen etablierte Form.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt im modernen Deutschen die im nächsten Vers folgende direkte Rede knapp und idiomatisch ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« bewahrt den Eigennamen, während »der HERR« ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Datierung bleibt klar gegliedert; der Doppelpunkt ersetzt ein schwerfälliges »indem er sprach« und weist auf die Fortsetzung im nächsten Vers voraus.
