source:
  edition: WLC
  text: וַ/הֲשִׁמּוֹתִ֨י עָלֶ֜י/ךָ עַמִּ֣ים רַבִּ֗ים וּ/מַלְכֵי/הֶם֙ יִשְׂעֲר֤וּ עָלֶ֨י/ךָ֙ שַׂ֔עַר בְּ/עוֹפְפִ֥/י חַרְבִּ֖/י עַל פְּנֵי/הֶ֑ם וְ/חָרְד֤וּ לִ/רְגָעִים֙ אִ֣ישׁ לְ/נַפְשׁ֔/וֹ בְּ/י֖וֹם מַפַּלְתֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
translation:
  language: de
  text: Ich werde viele Völker über dich in Entsetzen versetzen, und ihre Könige werden über dich vor Entsetzen erschauern[a], wenn ich mein Schwert vor ihnen schwinge[b]. Am Tag deines Sturzes werden sie jeden Augenblick zittern[c], jeder um sein eigenes Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verbindet ein Verb mit einem stammverwandten Substantiv und verstärkt so den Ausdruck heftigen Entsetzens.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wenn ich mein Schwert vor ihnen fliegen lasse“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von Augenblick zu Augenblick“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמּוֹתִי
  choice: Ich werde … entsetzen
  rationale: Der Hifil von שמם bezeichnet hier, mit den Völkern als Objekt, das Versetzen in Bestürzung oder Entsetzen. Die Wiedergabe passt zum anschließenden Erschauern und bewahrt die kausative Aussage.
- source_word: עַמִּים רַבִּים
  choice: viele Völker
  rationale: „Völker“ gibt die kollektiven Menschengruppen wieder, ohne den modernen staatsrechtlichen Begriff „Nationen“ aufzudrängen.
- source_word: יִשְׂעֲרוּ עָלֶיךָ שַׂעַר
  choice: werden deinetwegen vor Entsetzen erschauern
  rationale: Verb und stammverwandtes Substantiv bilden eine intensive Wendung für heftigen Schauder. „Vor Entsetzen erschauern“ gibt die Verstärkung in natürlichem Deutsch wieder; „deinetwegen“ erfasst עָלֶיךָ hier kausal, während die Fußnote die Ausdrucksweise erläutert.
- source_word: בְּעוֹפְפִי חַרְבִּי עַל־פְּנֵיהֶם
  choice: wenn ich mein Schwert vor ihren Augen schwinge
  rationale: עוּף bedeutet wörtlich „fliegen“. Beim Schwert bezeichnet die kausative Form dessen rasche Bewegung; „schwinge“ bewahrt das lebendige Kampfesbild, und „vor ihren Augen“ gibt עַל־פְּנֵיהֶם idiomatisch wieder.
- source_word: וְחָרְדוּ
  choice: Sie werden … zittern
  rationale: חרד verbindet körperliches Zittern mit Furcht; „zittern“ erhält beide Aspekte.
- source_word: לִרְגָעִים
  choice: jeden Augenblick
  rationale: Die Pluralform mit ל kann wiederholte Zeitpunkte bezeichnen. „Jeden Augenblick“ drückt die fortdauernde Angst natürlich aus; die Alternative „von Augenblick zu Augenblick“ wird in der Fußnote bewahrt.
- source_word: אִישׁ לְנַפְשׁוֹ
  choice: jeder um sein eigenes Leben
  rationale: אִישׁ ist distributiv gebraucht, und נֶפֶשׁ bezeichnet im Zusammenhang tödlicher Gefahr das Leben. Die Formulierung ist präzise und idiomatisch.
- source_word: בְּיוֹם מַפַּלְתֶּךָ
  choice: am Tag deines Sturzes
  rationale: מַפָּלָה bezeichnet den Fall oder Untergang im Gericht. „Sturz“ bewahrt das Bild und klingt im Deutschen würdig und natürlich.
theological_decisions:
- issue: Göttliches Handeln im Gerichtsbild
  choice: Gott spricht in der ersten Person und bezeichnet das geschwungene Schwert als sein eigenes.
  alternative: Das Schwert kann historisch durch Babylon als Werkzeug Gottes geführt werden.
  rationale: Die Formen „Ich werde“ und „mein Schwert“ stellen Gottes unmittelbare Urheberschaft heraus. Die Übersetzung wahrt dies, ohne eine geschichtliche Vermittlung des Gerichts auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt im Singular auf Ägypten beziehungsweise den Pharao bezogen. Die intensive hebräische figura etymologica wird idiomatisch wiedergegeben und durch eine Fußnote transparent gemacht.
