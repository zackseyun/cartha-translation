source:
  edition: WLC
  text: בְּ/תִתִּ/י֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם שְׁמָמָ֣ה וּ/נְשַׁמָּ֗ה אֶ֚רֶץ מִ/מְּלֹאָ֔/הּ בְּ/הַכּוֹתִ֖/י אֶת כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/015.yaml
  text: When I make the land of Egypt a desolation[a], and the land is stripped of all that fills it, when I strike down all who dwell in it, then they will know that I am Yahweh.
translation:
  language: de
  text: Wenn ich das Land Ägypten zur Einöde mache und das Land verwüstet und seiner ganzen Fülle beraubt ist, wenn ich alle schlage, die darin wohnen, dann werden sie erkennen, dass ich Jahwe bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und das Land von allem entleert ist, was es erfüllt …“'
    reason: Die Wendung kann die Entleerung des Landes gegenüber der wiederholten Bezeichnung seiner Verwüstung stärker hervorheben.
lexical_decisions:
- source_word: בְּתִתִּי
  choice: Wenn ich … mache
  rationale: ב mit dem Infinitivus constructus von נתן leitet hier einen temporalen Nebensatz ein; zusammen mit dem Ergebnisprädikat bedeutet נתן idiomatisch „zu etwas machen“.
- source_word: אֶרֶץ מִצְרַיִם
  choice: das Land Ägypten
  rationale: Die hebräische Verbindung wird im Deutschen natürlich und quellenah wiedergegeben.
- source_word: שְׁמָמָה
  choice: zur Einöde
  rationale: Das Substantiv bezeichnet einen verwüsteten, verlassenen Zustand; „zur Einöde machen“ bewahrt die nominale Ausdrucksweise.
- source_word: וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  choice: und das Land von allem entblößt ist, was es erfüllt
  rationale: Die Form נְשַׁמָּה beschreibt weitere Verwüstung; מִמְּלֹאָהּ bezeichnet das, wovon das Land geleert oder entblößt wird. Die Wiedergabe vermeidet eine schwerfällige Wiederholung von „verwüsten“ und erhält das Bild der Entleerung.
- source_word: בְּהַכּוֹתִי
  choice: wenn ich … schlage
  rationale: ב mit dem Infinitivus constructus ist erneut temporal. „Schlagen“ lässt den genauen Grad der Gewalt so offen wie das hebräische נכה, während der Gerichtskontext die Schwere erkennen lässt.
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: alle, die darin wohnen
  rationale: Nahe und zugleich idiomatische Wiedergabe der substantivierten Partizipialkonstruktion.
- source_word: וְיָדְעוּ
  choice: dann werden sie erkennen
  rationale: „Dann“ verdeutlicht die resultative Folge der vorausgehenden Gerichtshandlungen; „erkennen“ passt zur wiederkehrenden Erkenntnisformel im Ezechielbuch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als persönlichen Gottesnamen; „Jahwe“ bewahrt diese Funktion.
- issue: Tödliche Tragweite von נכה
  choice: schlage
  alternative: erschlage
  rationale: Obwohl der Gerichtskontext eine tödliche Wirkung nahelegt, kann נכה für sich genommen „schlagen“ bedeuten. Die Übersetzung macht die Tötung nicht ausdrücklicher als die hebräische Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der zweifachen temporalen Rahmung des Hebräischen. „Einöde“ ist gehoben, aber allgemein verständlich; „entblößt“ erhält das Bild eines Landes, dem sein gesamter Inhalt genommen wurde. Der Fußnotenmarker steht im Haupttext.
