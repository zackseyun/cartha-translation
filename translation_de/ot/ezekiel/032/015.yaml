revisions:
- from: Wenn ich das Land Ägypten zur Einöde mache und das Land von allem entblößt ist, was es erfüllt, wenn ich alle schlage, die darin wohnen, dann werden sie erkennen, dass ich Jahwe bin.[a]
  to: Wenn ich das Land Ägypten zur Einöde mache und das Land verwüstet und seiner ganzen Fülle beraubt ist, wenn ich alle schlage, die darin wohnen, dann werden sie erkennen, dass ich Jahwe bin.[a]
  rationale: Die Revision ersetzt die unidiomatische Konstruktion „von allem entblößt ist, was es erfüllt“ durch eine klare Wiedergabe, die die Verwüstung (נְשַׁמָּה) und den Verlust der Fülle bzw. des Inhalts des Landes (מִמְּלֹאָהּ) zusammen ausdrückt. Der Fußnotentext wird auf die tatsächliche lexikalische Alternative beschränkt.
