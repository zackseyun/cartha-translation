base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/031.yaml
  text: Pharaoh will see them and be comforted over all his multitude[a], Pharaoh and all his army, slain by the sword, declares the Lord GOD.
translation:
  language: de
  text: 'Pharao wird sie sehen und sich angesichts seiner ganzen Schar trösten[a] – der vom Schwert Erschlagenen: Pharao und sein ganzes Heer. So spricht der Herr, Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich darüber trösten lassen“ beziehungsweise „daraus Trost schöpfen“. Das hebräische Verb kann in anderen Zusammenhängen auch „bereuen“ oder „sich leid tun lassen“ bedeuten. Hier bezeichnet es wahrscheinlich den düsteren Trost, dass andere Pharaos Untergang teilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹתָם
  choice: sie
  rationale: Das direkte Objekt verweist auf die zuvor genannten Könige und Völker in der Unterwelt; das schlichte Pronomen erhält diesen Rückbezug.
- source_word: יִרְאֶה
  choice: wird sehen
  rationale: Das Imperfekt hat im prophetischen Zusammenhang Zukunftsbedeutung; die deutsche Futurform ist hier klar und natürlich.
- source_word: וְנִחַם
  choice: und sich trösten
  rationale: נחם bezeichnet hier am ehesten das Finden von Trost angesichts anderer, die dasselbe Unheil teilen. Die Formulierung bewahrt den makabren, ironischen Unterton.
- source_word: עַל כָּל הֲמוֹנוֹ
  choice: über sein ganzes Gefolge
  rationale: הָמוֹן bezeichnet hier die große Schar der Menschen beziehungsweise Streitkräfte des Pharaos. „Gefolge“ ist im Deutschen breit genug und vermeidet das unnatürliche „seine ganze Menge“; עַל wird nach „sich trösten“ idiomatisch mit „über“ wiedergegeben.
- source_word: חַלְלֵי חֶרֶב
  choice: die vom Schwert erschlagen wurden
  rationale: Die hebräische Wendung bezeichnet gewaltsam, insbesondere im Kampf, Getötete. Die deutsche Relativkonstruktion macht den Bezug auf Pharao und sein Heer verständlich.
- source_word: פַּרְעֹה וְכָל חֵילוֹ
  choice: der Pharao und sein ganzes Heer
  rationale: חַיִל meint in diesem Zusammenhang die militärische Streitmacht; „Heer“ ist eine präzise und würdige Wiedergabe.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: So spricht Gott, der HERR
  rationale: Die prophetische Schlussformel wird im Deutschen natürlich mit „So spricht“ wiedergegeben. „Gott, der HERR“ unterscheidet אֲדֹנָי und den Gottesnamen, ohne die schwer verständliche Doppelung „Herr HERR“ zu erzeugen.
theological_decisions:
- issue: Die Bedeutung von נחם angesichts des Untergangs Pharaos
  choice: sich trösten
  alternative: es bereuen / Mitleid empfinden
  rationale: Obwohl das Verb andernorts „bereuen“ oder „sich leid tun lassen“ bedeuten kann, legt die Präposition עַל zusammen mit dem Unterweltskontext nahe, dass Pharao eine düstere Art von Trost darin findet, andere in demselben Schicksal zu sehen. Die Fußnote hält die lexikalische Spannweite offen.
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr Jahwe
  rationale: Die gewählte traditionelle deutsche Form kennzeichnet den Gottesnamen typografisch und vermeidet eine missverständliche Wiederholung von „Herr“. „Der Herr Jahwe“ wäre eine mögliche stärker formale Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich markiert die nachgestellte Präzisierung des Gefolges, ohne die gedrängte hebräische Apposition völlig aufzulösen. „Gefolge“ bleibt bewusst weiter als „Heer“, da der folgende Ausdruck die militärische Streitmacht eigens nennt.
