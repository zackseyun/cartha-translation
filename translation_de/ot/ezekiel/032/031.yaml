  naturalness: Die Relativkonstruktion „der Pharao und sein ganzes Heer, die vom Schwert erschlagen wurden“ ist zwar verständlich, aber als nachgestellte Apposition schwerfällig. Eine Umstellung mit „die vom Schwert Erschlagenen“ macht die gedankliche Zuordnung und die hebräische Verdichtung im Deutschen klarer. „Angesichts“ ist hier eine natürliche, nicht überinterpretierende Wiedergabe von עַל bei „sich trösten“.
