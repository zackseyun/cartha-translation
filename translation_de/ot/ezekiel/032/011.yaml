reference: Ezekiel 32:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב מֶֽלֶךְ בָּבֶ֖ל תְּבוֹאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/011.yaml
  text: 'For thus says the Lord GOD: The sword of the king of Babylon will come upon you[a].'
translation:
  language: de
  text: 'Denn so spricht der Herr Jahwe: Das Schwert des Königs von Babylon wird über dich kommen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wird zu dir kommen“; dem Gerichtszusammenhang entsprechend kann es heißen: „wird gegen dich kommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die unmittelbar vorausgehende Gerichtsankündigung und bewahrt so den Zusammenhang des hebräischen Textes.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Die geläufige deutsche Prophetenformel gibt die hebräische Botenformel würdig und natürlich wieder; das Präsens entspricht ihrer spruchhaften Funktion.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Wiedergabe erhält beide Bestandteile des zusammengesetzten Gottestitels und gibt den Gottesnamen als Jahwe wieder, ohne ihn mit dem Titel Herr zu verschmelzen.
- source_word: חֶרֶב מֶלֶךְ בָּבֶל
  choice: Das Schwert des Königs von Babylon
  rationale: Die deutsche Genitivkonstruktion bildet die hebräische Status-constructus-Verbindung transparent ab; der Kontext kennzeichnet das Schwert als das bestimmte Instrument des angekündigten Gerichts.
- source_word: תְּבוֹאֶךָ
  choice: wird über dich kommen
  rationale: Die Form bezeichnet das zukünftige Kommen des Schwertes zum angesprochenen Pharao; „über dich kommen“ bewahrt das Bild und lässt seine feindliche Gerichtsrichtung erkennen.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: „Der Herr Jahwe“ folgt der Reihenfolge des Hebräischen und unterscheidet Titel und Eigenname. Die Alternative ist im Deutschen kirchlich vertrauter, stellt die Bestandteile jedoch um und ersetzt den Namen durch einen Titel.
- issue: Richtung des angekündigten Kommens des Schwertes
  choice: wird über dich kommen
  alternative: wird gegen dich kommen
  rationale: Die gewählte Formulierung wahrt die Bildhaftigkeit und die lexikalische Breite von בוא; der Gerichtskontext macht die feindliche Bedeutung deutlich, während die Fußnote die engere Alternative nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der geläufigen prophetischen Formel „so spricht“. „Babylon“ entspricht der üblichen deutschen Namensform. Die Anrede bleibt im Singular, wie im Hebräischen.
