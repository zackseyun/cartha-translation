  text: בְּ/ת֥וֹךְ חַלְלֵי חֶ֖רֶב יִפֹּ֑לוּ חֶ֣רֶב נִתָּ֔נָה מָשְׁכ֥וּ אוֹתָ֖/הּ וְ/כָל הֲמוֹנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/020.yaml
  text: They will fall among those slain by the sword[a]. The sword is given; drag her away[b], and all her multitude.
translation:
  language: de
  text: Mitten unter den vom Schwert Erschlagenen werden sie fallen. Das Schwert ist gegeben[a]; schleppt sie und ihre ganze Menge fort![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ein Schwert ist bestimmt.“ Der hebräische Satz ist sehr knapp und kann ausdrücken, dass ein Schwert zum Gericht bereitgestellt oder bestimmt ist.'
    reason: alternative_reading
  - marker: b
    text: Das feminine „sie“ bezieht sich auf das personifizierte Ägypten; mitgemeint ist seine gesamte Volksmenge.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ חַלְלֵי חֶרֶב
  choice: Mitten unter den vom Schwert Erschlagenen
  rationale: בְּתוֹךְ bezeichnet die Einordnung in die Gemeinschaft der Erschlagenen; „mitten unter“ ist im Deutschen idiomatisch und bewahrt die räumlich-kollektive Bildsprache. חַלְלֵי חֶרֶב meint die im Kampf durch das Schwert Getöteten.
- source_word: יִפֹּלוּ
  choice: werden sie fallen
  rationale: Das Qal-Imperfekt hat im prophetischen Zusammenhang voraussagende Kraft. Die deutsche Futurform gibt dies klar und gegenwärtig wieder.
- source_word: חֶרֶב נִתָּנָה
  choice: Das Schwert ist gegeben
  rationale: Die knappe Passivkonstruktion wird bewusst nah am Hebräischen wiedergegeben, damit ihre Ellipse und Mehrdeutigkeit nicht vorschnell aufgelöst werden.
- source_word: מָשְׁכוּ
  choice: schleppt ... hinab
  rationale: Der Pluralimperativ verlangt eine gewaltsame Bewegung. „Schleppt“ entspricht dem Kontext des gewaltsamen Hinabführens zu den Toten; „hinab“ macht das im weiteren Kontext vorausgesetzte Ziel im Deutschen verständlich.
- source_word: אוֹתָהּ
  choice: sie
  rationale: Das feminine Singularpronomen bezieht sich im Zusammenhang am ehesten auf das personifizierte Ägypten.
- source_word: וְכָל הֲמוֹנֶיהָ
  choice: sie und ihre ganze Menge
  rationale: Die koordinierende Konjunktion wird mit „und“ bewahrt. Die Wiederaufnahme „sie“ macht im Deutschen deutlich, dass sowohl Ägypten als auch seine gesamte Volksmenge Objekt des Befehls sind. הָמוֹן bezeichnet hier die große Menschenmenge des Landes.
theological_decisions:
- issue: Bezug des femininen Pronomens אוֹתָהּ
  choice: 'Bezug auf das personifizierte Ägypten: „sie“'
  alternative: Ein abstrakter Bezug oder eine Verbindung mit dem vorangehenden Schwertsatz
  rationale: Der größere Zusammenhang behandelt Ägypten als weiblich personifizierte Größe. Diese Wiedergabe erhält die Bildsprache, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Deutung von חֶרֶב נִתָּנָה
  choice: „Das Schwert ist gegeben“
  alternative: „Ein Schwert ist bestimmt“ oder „Das Schwert ist preisgegeben“
  rationale: Der hebräische Satz ist äußerst gedrängt. Die formnahe Übersetzung bewahrt die Spannung zwischen Übergabe, Bereitstellung und Bestimmung zum Gericht.
- issue: Ergänzung der Bewegungsrichtung bei מָשְׁכוּ
  choice: „schleppt sie hinab“
  alternative: „zieht sie fort“ oder schlicht „schleppt sie“
  rationale: Das Hinabführen entspricht dem unmittelbaren literarischen Kontext des Abstiegs in die Unterwelt. Die Ergänzung dient der natürlichen deutschen Verständlichkeit, wird aber wegen ihres impliziten Charakters durch eine Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Härte. Die abrupte Schwertklausel bleibt bewusst wörtlich und spannungsvoll; die Objektkoordination wird idiomatisch verdeutlicht.
