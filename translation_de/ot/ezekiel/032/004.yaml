  text: וּ/נְטַשְׁתִּ֣י/ךָ בָ/אָ֔רֶץ עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה אֲטִילֶ֑/ךָ וְ/הִשְׁכַּנְתִּ֤י עָלֶ֨י/ךָ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/הִשְׂבַּעְתִּ֥י מִמְּ/ךָ֖ חַיַּ֥ת כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/004.yaml
  text: I will cast you onto the land[a]; I will throw you down on the open field, and I will cause every bird of the heavens to settle on you[b], and I will satisfy the beasts of all the earth with you.
translation:
  language: de
  text: Ich werfe dich aufs Land[a], schleudere dich aufs freie Feld und lasse alle Vögel des Himmels sich auf dir nieder. Mit dir sättige ich die wilden Tiere der ganzen Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich lasse dich auf dem Land liegen.“ Das hebräische Verb kann „verlassen“, „preisgeben“ oder „wegwerfen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Von dir sättige ich die wilden Tiere der ganzen Erde“; gemeint ist, dass sie sich von dir satt fressen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Ich werfe dich aufs Land
  rationale: נטשׁ kann „verlassen“, „preisgeben“ oder „wegwerfen“ bedeuten. Im Zusammenhang mit dem anschließenden Schleudern aufs Feld und dem Fraß durch Aasfresser bringt „werfe“ die gewaltsame Beseitigung zur Geltung, ohne die Bedeutungsalternative zu verschweigen.
- source_word: בָאָרֶץ
  choice: aufs Land
  rationale: אֶרֶץ bezeichnet hier aufgrund der Parallele zum freien Feld den festen Erdboden beziehungsweise das Land, auf das der Gestürzte geworfen wird.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: aufs freie Feld
  rationale: Die Wendung bedeutet wörtlich „auf die Oberfläche des Feldes“. „Aufs freie Feld“ gibt die schutzlose, offen daliegende Lage natürlich und prägnant wieder.
- source_word: אֲטִילֶךָ
  choice: schleudere dich
  rationale: Die Hifil-Form von טול bezeichnet ein Werfen oder Schleudern. „Schleudere“ bewahrt die Wucht des Bildes und vermeidet eine unmittelbare Wiederholung von „werfe“.
- source_word: וְהִשְׁכַּנְתִּי עָלֶיךָ
  choice: lasse ... sich auf dir nieder
  rationale: Die kausative Form von שכן bedeutet „sich niederlassen lassen“. Bei Vögeln, die auf einen Kadaver herabkommen, ist diese Formulierung idiomatisch und quellennah.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: alle Vögel des Himmels
  rationale: עוֹף ist eine Sammelbezeichnung für fliegende Tiere. Die traditionelle, würdevolle Wendung „Vögel des Himmels“ bleibt im modernen Deutsch verständlich.
- source_word: וְהִשְׂבַּעְתִּי
  choice: sättige ich
  rationale: Das Hifil von שׂבע bedeutet, jemanden satt zu machen. „Sättigen“ bewahrt sowohl die Fülle als auch den gehobenen prophetischen Ton.
- source_word: מִמְּךָ
  choice: mit dir
  rationale: Wörtlich steht „von/aus dir“. Im Deutschen drückt „mit dir sättige ich“ natürlich aus, dass der Angeredete den Tieren als Nahrung dient; die wörtlichere Form wird in der Fußnote erläutert.
- source_word: חַיַּת כָּל הָאָרֶץ
  choice: die wilden Tiere der ganzen Erde
  rationale: חַיָּה bezeichnet hier Tiere, im Aasfraßkontext besonders wilde Tiere. „Der ganzen Erde“ erhält die umfassende Aussage des hebräischen Ausdrucks.
theological_decisions:
- issue: Reichweite von אֶרֶץ beziehungsweise הָאָרֶץ im Gerichtswort
  choice: Die erste Stelle mit „Land“, die Schlusswendung mit „ganze Erde“ wiedergeben
  alternative: Beide Vorkommen einheitlich mit „Land“ oder einheitlich mit „Erde“ übersetzen
  rationale: Die erste Stelle wird durch das parallele „freie Feld“ örtlich konkretisiert. Die Schlusswendung hat dagegen eine umfassende, formelhafte Wirkung. Die unterschiedliche Wiedergabe erhält diese kontextuelle Spannung, ohne den geografischen Umfang dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger prophetischer Bildsprache. Die Satzfolge bleibt knapp und parallel; „schleudere“ und „sättige“ erhalten die Gewalt und das makabre Gerichtsmotiv des Ausgangstextes.
