  text: וְ/כִסֵּיתִ֤י בְ/כַבּֽוֹתְ/ךָ֙ שָׁמַ֔יִם וְ/הִקְדַּרְתִּ֖י אֶת כֹּֽכְבֵי/הֶ֑ם שֶׁ֚מֶשׁ בֶּ/עָנָ֣ן אֲכַסֶּ֔/נּוּ וְ/יָרֵ֖חַ לֹא יָאִ֥יר אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/007.yaml
  text: When I extinguish you[a], I will cover the heavens and darken their stars; I will cover the sun with a cloud, and the moon will not give its light.
translation:
  language: de
  text: Wenn ich dich auslösche[a], werde ich den Himmel bedecken und seine Sterne verdunkeln. Die Sonne werde ich mit einer Wolke bedecken, und der Mond wird sein Licht nicht leuchten lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wenn du erlöschst“ oder „wenn du ausgelöscht wirst“. Das Hebräische gebraucht das Bild eines Lichts oder Feuers, das erlischt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִסֵּיתִי
  choice: werde ich den Himmel bedecken
  rationale: כסה bedeutet „bedecken, verhüllen“. Das Futur gibt die Abfolge der prophetischen Gerichtsaussage im Deutschen natürlich wieder.
- source_word: בְכַבּוֹתְךָ
  choice: wenn ich dich auslösche
  rationale: כבה bezeichnet das Erlöschen oder Auslöschen eines Lichts beziehungsweise Feuers. Die aktive deutsche Fassung passt zum göttlichen Sprecher und bewahrt das Bild des Auslöschens; die grammatisch mögliche weniger ausdrücklich agensbezogene Lesart wird in der Fußnote genannt.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Das hebräische Pluralwort bezeichnet hier den sichtbaren Himmelsraum. Der deutsche Singular „Himmel“ ist idiomatisch und verbindet sich natürlich mit dem singularischen Rückbezug „seine Sterne“.
- source_word: וְהִקְדַּרְתִּי
  choice: und seine Sterne verdunkeln
  rationale: Die Kausativform von קדר bedeutet „dunkel machen, verdunkeln“.
- source_word: כֹּכְבֵיהֶם
  choice: seine Sterne
  rationale: Das Suffix bezieht sich auf שָׁמַיִם. Da „Himmel“ im Deutschen idiomatisch singularisch steht, lautet der natürliche Rückbezug „seine“.
- source_word: שֶׁמֶשׁ בֶּעָנָן אֲכַסֶּנּוּ
  choice: Die Sonne werde ich mit einer Wolke bedecken
  rationale: Die Präposition ב bezeichnet hier das Mittel der Verhüllung. Die Wiederholung von „bedecken“ entspricht der Wiederholung von כסה.
- source_word: וְיָרֵחַ לֹא יָאִיר אוֹרוֹ
  choice: und der Mond wird sein Licht nicht leuchten lassen
  rationale: Die Hifilform von אור hat kausative Bedeutung. „Sein Licht nicht leuchten lassen“ bildet diese Nuance genauer ab als das bloße „nicht leuchten“.
theological_decisions:
- issue: Charakter der kosmischen Gerichtssprache
  choice: Die Verdunkelung von Himmel, Sonne, Mond und Sternen wird als Bildaussage des Textes unmittelbar wiedergegeben.
  alternative: Die Sprache ausschließlich als wörtliche kosmische Katastrophe oder ausschließlich als politische Metapher auslegen.
  rationale: Der hebräische Text lässt das Verhältnis zwischen kosmischem Geschehen und prophetischer Bildsprache offen; die Übersetzung soll diese Spannung nicht auflösen.
- issue: Agens beim Auslöschen des Angeredeten
  choice: 'Im Haupttext wird Gott als handelndes Subjekt ausgedrückt: „wenn ich dich auslösche“.'
  alternative: „wenn du erlöschst“ oder „wenn du ausgelöscht wirst“.
  rationale: Die umgebenden Verben haben den göttlichen Sprecher als Subjekt, doch die Infinitivkonstruktion selbst nennt das Agens nicht ausdrücklich. Deshalb wird die grammatische Offenheit in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die kosmische Bildwelt und die Wiederholung von „bedecken“ bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
