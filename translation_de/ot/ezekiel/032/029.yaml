source:
  edition: WLC
  text: שָׁ֣מָּ/ה אֱד֗וֹם מְלָכֶ֨י/הָ֙ וְ/כָל נְשִׂיאֶ֔י/הָ אֲשֶׁר נִתְּנ֥וּ בִ/גְבוּרָתָ֖/ם אֶת חַלְלֵי חָ֑רֶב הֵ֛מָּה אֶת עֲרֵלִ֥ים יִשְׁכָּ֖בוּ וְ/אֶת יֹ֥רְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/029.yaml
  text: There is Edom[a], her kings and all her princes, who were laid among those slain by the sword despite their might[b]. They lie with the uncircumcised and with those who go down to the pit.
translation:
  language: de
  text: Dort ist Edom mit seinen Königen und all seinen Fürsten. In ihrer Macht[a] wurden sie unter die vom Schwert Erschlagenen gelegt. Sie liegen bei den Unbeschnittenen und bei denen, die in die Grube hinabsteigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mit ihrer Macht“. Die genaue Nuance des hebräischen Ausdrucks ist unsicher; der Zusammenhang stellt ihre Macht ihrem Untergang gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: Die „Grube“ ist im Hebräischen ein geläufiges Bild für das Grab oder den Bereich der Toten.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: Dort ist
  rationale: Die deiktische Wendung weist innerhalb der wiederkehrenden Totenreichsszene auf ein weiteres Volk hin; „Dort ist“ klingt im Deutschen natürlich und bewahrt diesen Zeigegestus.
- source_word: אֱדוֹם מְלָכֶיהָ וְכָל נְשִׂיאֶיהָ
  choice: Edom mit seinen Königen und all seinen Fürsten
  rationale: „Edom“ bleibt als geläufiger Völkername erhalten. Die Zugehörigkeit der Könige und Fürsten wird im Deutschen mit „seinen“ natürlich ausgedrückt; „Fürsten“ bewahrt den gehobenen politischen Ton von נְשִׂיאִים.
- source_word: אֲשֶׁר נִתְּנוּ
  choice: wurden sie ... gelegt
  rationale: Der Nifal von נתן ist passiv und bedeutet hier „wurden gesetzt/gelegt“. Im Zusammenhang mit den Toten ist „gelegt“ idiomatisch, ohne das Passiv aufzulösen.
- source_word: בִגְבוּרָתָם
  choice: Trotz ihrer Macht
  rationale: Der Kontext stellt ihre frühere Stärke ihrem Fall gegenüber. Die konzessive Wiedergabe macht diese Ironie verständlich; die formal möglichen Lesarten „mit/in ihrer Macht“ bleiben in der Fußnote sichtbar.
- source_word: אֶת חַלְלֵי חָרֶב
  choice: zu den vom Schwert Erschlagenen
  rationale: Die feste Wendung bezeichnet gewaltsam, besonders im Kampf, Getötete. „Vom Schwert Erschlagene“ bewahrt Bild und feierlichen Klagecharakter.
- source_word: עֲרֵלִים
  choice: die Unbeschnittenen
  rationale: Die wörtliche Wiedergabe erhält die bundestheologische und zugleich entehrende Konnotation des prophetischen Ausdrucks.
- source_word: יִשְׁכָּבוּ
  choice: Sie liegen
  rationale: Das Imperfekt beschreibt hier in der Vision ihren Zustand im Totenreich; das deutsche Präsens gibt die Szene natürlich wieder.
- source_word: יֹרְדֵי בוֹר
  choice: die in die Grube hinabsteigen
  rationale: „Grube“ bewahrt die hebräische Metapher für Grab beziehungsweise Totenreich und ihre prophetischen Anklänge.
theological_decisions:
- issue: Bedeutung von עֲרֵלִים im Gerichtswort
  choice: die Unbeschnittenen
  alternative: die entehrten Toten / die Völker
  rationale: Die wörtliche Wiedergabe erhält sowohl den Bundesbezug als auch die Schandkonnotation, ohne den Ausdruck auf nur eine seiner Bedeutungsdimensionen zu verengen.
- issue: Deutung von בִגְבוּרָתָם
  choice: Trotz ihrer Macht
  alternative: mit ihrer Macht / in ihrer Macht
  rationale: Der unmittelbare Zusammenhang hebt die wirkungslose Stärke der Herrscher ironisch hervor. Da die Präposition formal auch anders verstanden werden kann, wird die Mehrdeutigkeit ausdrücklich in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem klagenden und bildhaften Ton des Abschnitts. Die Satzteilung erleichtert das Verständnis, ohne die wiederkehrende Struktur der Totenreichsvision oder ihre Schlüsselbegriffe einzuebnen.
