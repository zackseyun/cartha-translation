id: EZK.32.14
reference: Ezekiel 32:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֚ז אַשְׁקִ֣יעַ מֵֽימֵי/הֶ֔ם וְ/נַהֲרוֹתָ֖/ם כַּ/שֶּׁ֣מֶן אוֹלִ֑יךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/014.yaml
  text: Then I will let their waters settle[a], and I will make their rivers flow like oil[b], declares the Lord GOD.
translation:
  language: de
  text: Dann werde ich ihre Wasser zur Ruhe kommen lassen[a] und ihre Ströme wie Öl dahinfließen lassen[b], spricht der Herr Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Wasser absinken/sich setzen lassen“. Das hebräische Verb kann bezeichnen, dass Wasser absinkt, sich setzt oder zur Ruhe kommt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „ihre Ströme wie Öl führen“, das heißt, sie so gleichmäßig dahinfließen lassen wie Öl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das temporale Adverb bezeichnet den daraus folgenden Zeitpunkt und wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: אַשְׁקִיעַ
  choice: werde ... zur Ruhe kommen lassen
  rationale: Der Hifil von שׁקע bezeichnet ein Veranlassen des Sinkens oder Sichsetzens. Bei Wasser gibt die Formulierung das Bild von abklingender Bewegung wieder, ohne die lexikalische Alternative des Absinkens auszuschließen; diese wird in der Fußnote genannt.
- source_word: מֵימֵיהֶם
  choice: ihre Wasser
  rationale: Der poetische Plural des hebräischen Ausdrucks bleibt erhalten.
- source_word: וְנַהֲרוֹתָם
  choice: und ihre Ströme
  rationale: נְהָרוֹת kann Flüsse oder Ströme bezeichnen. „Ströme“ passt zur poetischen Rede und zum großräumigen Gewässerbild des Zusammenhangs.
- source_word: כַּשֶּׁמֶן
  choice: wie Öl
  rationale: Die knappe Vergleichsform bleibt erhalten; eine ausdrückliche Bestimmung als Olivenöl wäre eine nicht im Text stehende Präzisierung.
- source_word: אוֹלִיךְ
  choice: werde ... dahinfließen lassen
  rationale: Der Hifil von הלך bedeutet „gehen lassen/führen“. Auf Ströme bezogen gibt „dahinfließen lassen“ die verursachte, gleichmäßige Bewegung idiomatisch wieder.
- source_word: נְאֻם
  choice: spricht
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Charakter der göttlichen Aussage.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „Jahwe“ den im hebräischen Text ausdrücklich stehenden Gottesnamen bezeichnet und die beiden Bestandteile des Titels unterscheidbar hält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR; der Herr, HERR
  rationale: Die gewählte Form gibt sowohl den Titel אֲדֹנָי als auch den Gottesnamen יהוה erkennbar wieder, ohne den Doppelausdruck zu einem einzigen Titel zusammenzuziehen oder die unnatürliche Folge „Herr HERR“ zu erzeugen.
- issue: Bild der wie Öl dahinfließenden Ströme
  choice: als Bild einer glatten, ruhigen Bewegung offenlassen
  alternative: ausdrücklich als langsames Fließen oder als gereinigtes Wasser deuten
  rationale: Der Text nennt nur den Vergleich mit Öl. Tempo, Reinheit und weitere symbolische Bedeutungen werden daher nicht festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. Der poetische Plural „Wasser“ und der Ölvergleich bleiben erhalten; schwer verständliche Wörtlichkeit wird nur dort idiomatisiert, wo das Deutsche sie verlangt.
