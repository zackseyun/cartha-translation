  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בַּ/חֲמִשָּׁ֥ה עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/017.yaml
  text: And it happened in the twelfth year[a], on the fifteenth day of the month, that the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Und es geschah im zwölften Jahr, am fünfzehnten Tag des Monats[a], dass das Wort Jahwes[b] an mich erging:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text wird nicht angegeben, welcher Monat gemeint ist.
    reason: textual_clarity
  - marker: b
    text: Der Gottesname lautet im Hebräischen „JHWH“, wahrscheinlich „Jahwe“ ausgesprochen; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: divine_name
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die narrative Einleitungsformel wird würdig und zugleich verständlich wiedergegeben; sie leitet hier eine datierte prophetische Mitteilung ein.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: im zwölften Jahr
  rationale: Entspricht der üblichen deutschen Form einer Jahresangabe und bewahrt die ordinale Struktur des Hebräischen.
- source_word: בַּחֲמִשָּׁה עָשָׂר לַחֹדֶשׁ
  choice: am fünfzehnten Tag des Monats
  rationale: Das im Hebräischen vorausgesetzte Wort „Tag“ wird für natürliches und eindeutiges Deutsch ergänzt. Welcher Monat gemeint ist, bleibt wie im masoretischen Text offen.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Formel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אֵלַי
  choice: an mich
  rationale: Natürliche deutsche Wiedergabe der Präposition mit dem Suffix der ersten Person.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt übernimmt im Deutschen idiomatisch die Funktion des hebräischen Infinitivs „indem er sprach/folgendermaßen“ und leitet die unmittelbar folgende Gottesrede ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt seinen Charakter als Eigenname; eine Fußnote nennt die traditionelle deutsche Wiedergabe.
- issue: Nicht genannter Monat
  choice: Die Unbestimmtheit im Haupttext bewahren
  alternative: einen bestimmten Monat ergänzen
  rationale: Der WLC nennt lediglich den fünfzehnten Tag „des Monats“, ohne den Monat zu bestimmen. Eine Ergänzung würde über die vorliegende hebräische Textgrundlage hinausgehen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der vertrauten prophetischen Formel „das Wort … erging an mich“. Die hebräische Datierungsform bleibt erhalten, ohne den nicht genannten Monat zu ergänzen; der abschließende Doppelpunkt vermeidet das im Deutschen schwerfällige „indem er sprach“.
