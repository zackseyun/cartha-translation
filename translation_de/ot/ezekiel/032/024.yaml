    rationale: Die Formulierung ist zwar semantisch möglich, klingt im modernen Standarddeutsch jedoch konstruiert. »die Tiefen der Erde« wahrt das Bild von אֶרֶץ תַּחְתִּיּוֹת und liest sich natürlicher.
