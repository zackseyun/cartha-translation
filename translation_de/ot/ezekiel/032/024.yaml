source:
  edition: WLC
  text: שָׁ֤ם עֵילָם֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֣/ם חֲלָלִים֩ הַ/נֹּפְלִ֨ים בַּ/חֶ֜רֶב אֲֽשֶׁר יָרְד֥וּ עֲרֵלִ֣ים אֶל אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ חִתִּיתָ/ם֙ בְּ/אֶ֣רֶץ חַיִּ֔ים וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/024.yaml
  text: There is Elam and all her multitude[a], all around her grave, all of them slain, fallen by the sword, who went down uncircumcised to the land below, who spread their terror in the land of the living; and they bore their shame with those who go down to the pit.
translation:
  language: de
  text: 'Dort ist Elam mit seiner ganzen Menge[a] rings um sein Grab: allesamt Erschlagene, gefallen durch das Schwert. Unbeschnitten stiegen sie hinab in die Tiefen der Erde[b]. Sie verbreiteten ihren Schrecken im Land der Lebenden und trugen ihre Schande zusammen mit denen, die in die Grube hinabsteigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wird Elam hier mit weiblichen Pronomen personifiziert: wörtlich »ihre ganze Menge« und »ihr Grab«.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlich etwa: »in das Land der unteren Bereiche«. Die Formulierung ist ein Bild für den Bereich der Toten und kann auch »untere Erde« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם עֵילָם
  choice: Dort ist Elam
  rationale: Bewahrt den hinweisenden Charakter von שָׁם und führt Elam als nächste Gestalt der Unterweltszene ein.
- source_word: וְכָל הֲמוֹנָהּ
  choice: mit seiner ganzen Menge
  rationale: הָמוֹן bezeichnet hier die Elam zugehörige große Menschen- oder Heeresmenge. Das grammatische Femininum des Hebräischen bezieht sich auf das als Land beziehungsweise Volksgemeinschaft personifizierte Elam; im natürlichen Deutschen wird der Eigenname sächlich behandelt.
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: rings um sein Grab
  rationale: Gibt die räumliche Anordnung um Elams Grab knapp und anschaulich wieder.
- source_word: כֻּלָּם חֲלָלִים הַנֹּפְלִים בַּחֶרֶב
  choice: Sie alle sind Erschlagene, die durch das Schwert gefallen sind
  rationale: חֲלָלִים bezeichnet gewaltsam Getötete; die traditionelle Schwertformel bleibt erkennbar.
- source_word: יָרְדוּ עֲרֵלִים
  choice: Unbeschnitten sind sie hinabgestiegen
  rationale: Die wörtliche Wiedergabe erhält die in Ezechiels Völkersprüchen wichtige Kennzeichnung von Schande und Fremdheit.
- source_word: אֶל אֶרֶץ תַּחְתִּיּוֹת
  choice: in das Land der Tiefen
  rationale: Bewahrt das räumliche Bild eines unterhalb gelegenen Totenreichs, ohne eine ausgearbeitete Jenseitslehre einzutragen.
- source_word: נָתְנוּ חִתִּיתָם
  choice: verbreiteten ihren Schrecken
  rationale: Idiومatische deutsche Wiedergabe der Wendung, wörtlich etwa »gaben/setzten ihren Schrecken«.
- source_word: בְּאֶרֶץ חַיִּים
  choice: im Land der Lebenden
  rationale: Transparente und im Deutschen verständliche Wiedergabe des Gegensatzes zum Bereich der Toten.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: tragen nun ihre Schande
  rationale: נשא mit כְלִמָּה bezeichnet das Tragen beziehungsweise Erleiden der eigenen Schmach; »nun« verdeutlicht lediglich den im Kontext liegenden Gegensatz zwischen früherem Schrecken und gegenwärtiger Schande.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: mit denen, die in die Grube hinabsteigen
  rationale: אֵת wird hier im Sinn der Gemeinschaft mit den übrigen Toten verstanden; »Grube« erhält das Grab- und Unterweltsbild.
theological_decisions:
- issue: Wiedergabe von עֲרֵלִים im Gerichtszusammenhang
  choice: Unbeschnitten
  alternative: Unreine / Ungeweihte
  rationale: Die konkrete körperliche und zugleich schambesetzte Bezeichnung wird nicht vergeistigt oder konfessionell umgedeutet.
- issue: Deutung von אֶרֶץ תַּחְתִּיּוֹת
  choice: Land der Tiefen
  alternative: Unterwelt / unterste Erde
  rationale: Die Formulierung wahrt das poetisch-räumliche Bild und lässt offen, wie der Bereich der Toten systematisch zu verstehen ist.
- issue: Geschlecht der Personifikation Elams
  choice: 'deutsche Neutrumbezüge: »seiner«, »sein«'
  alternative: 'weibliche Personifikation: »ihrer«, »ihr«'
  rationale: Das Hebräische personifiziert Elam grammatisch feminin. Im modernen Deutschen ist »Elam« als Land- und Volksname jedoch gewöhnlich sächlich; eine Fußnote macht die Form des Ausgangstextes sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die langen hebräischen Satzglieder wurden behutsam in mehrere Sätze gegliedert, ohne die Abfolge von Tod, früherem Schrecken und gegenwärtiger Schande zu verändern. Beide Fußnotenmarker erscheinen im Haupttext.
