- from: Dort ist Elam mit seiner ganzen Menge[a] rings um sein Grab. Sie alle sind Erschlagene, die durch das Schwert gefallen sind. Unbeschnitten sind sie hinabgestiegen in das Land der Tiefen[b]. Sie verbreiteten ihren Schrecken im Land der Lebenden und tragen nun ihre Schande mit denen, die in die Grube hinabsteigen.
  to: 'Dort ist Elam mit seiner ganzen Menge[a] rings um sein Grab: allesamt Erschlagene, gefallen durch das Schwert. Unbeschnitten stiegen sie hinab in die Tiefen der Erde[b]. Sie verbreiteten ihren Schrecken im Land der Lebenden und trugen ihre Schande zusammen mit denen, die in die Grube hinabsteigen.'
  rationale: Die Revision beseitigt den nicht im hebräischen Wortlaut enthaltenen Gegenwartsakzent »nun« und stellt die Folge der hebräischen Vergangenheitsformen einheitlich dar. Sie verbessert zugleich die idiomatische deutsche Wiedergabe von אֶרֶץ תַּחְתִּיּוֹת und glättet die Apposition zu den Erschlagenen, ohne die Bildsprache oder die Ambiguität des Totenbereichs einzuengen.
