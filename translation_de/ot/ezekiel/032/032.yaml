    rationale: Die Konjunktion verbindet die Aussagen; ein adversatives „Doch“ ist im hebräischen Wortlaut nicht markiert. Der Kontrast kann aus dem Zusammenhang hervorgehen, soll aber nicht zusätzlich eingeführt werden.
