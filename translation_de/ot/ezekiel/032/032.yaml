  text: כִּֽי נָתַ֥תִּי אֶת חתית/ו בְּ/אֶ֣רֶץ חַיִּ֑ים וְ/הֻשְׁכַּב֩ בְּ/ת֨וֹךְ עֲרֵלִ֜ים אֶת חַלְלֵי חֶ֗רֶב פַּרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/032.yaml
  text: For I put his terror in the land of the living[a], and he will be laid among the uncircumcised, with those slain by the sword—Pharaoh and all his multitude, declares the Lord GOD.
translation:
  language: de
  text: Denn ich setzte seinen Schrecken im Land der Lebenden[a], und er wird mitten unter die Unbeschnittenen gelegt werden, zu den vom Schwert Erschlagenen – der Pharao und seine ganze Menge. So spricht der Herr Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einigen alten Textzeugen: „meinen Schrecken im Land der Lebenden“. Der hebräische Text lautet hier „seinen Schrecken“.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorausgehenden Gerichtswort ein.
- source_word: נָתַתִּי
  choice: ich verbreitete
  rationale: נתן bedeutet grundsätzlich „geben, setzen, bringen“. Zusammen mit „Schrecken“ gibt „verbreitete“ die gemeinte Wirkung im Land der Lebenden in natürlichem Deutsch wieder, ohne die Urheberschaft Gottes abzuschwächen.
- source_word: חֲתִיתוֹ
  choice: seinen Schrecken
  rationale: Der masoretische Text weist mit dem Suffix der 3. Person Singular auf den Schrecken hin, der von Pharao ausging. Die abweichende alte Lesart „meinen Schrecken“ wird in der Fußnote bewahrt.
- source_word: בְּאֶרֶץ חַיִּים
  choice: im Land der Lebenden
  rationale: Die feste Wendung bezeichnet den Bereich der Lebenden im Gegensatz zur Totenwelt.
- source_word: וְהֻשְׁכַּב
  choice: Doch er wird … gelegt werden
  rationale: Die passive Hofal-Form von שׁכב wird als zukünftiges Gerichtsgeschehen wiedergegeben. „Doch“ macht den im Kontext liegenden Gegensatz zwischen seinem früheren Schrecken und seinem Ende verständlich.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: mitten unter die Unbeschnittenen
  rationale: Bewahrt sowohl die räumliche Aussage als auch den in Ezechiel mit Schande und Bundesferne verbundenen Ausdruck.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: zu den vom Schwert Erschlagenen
  rationale: אֶת bezeichnet hier die Gemeinschaft beziehungsweise Zuordnung; die Formulierung erhält das gewaltsame Todesbild.
- source_word: פַּרְעֹה וְכָל הֲמוֹנוֹ
  choice: der Pharao und seine ganze Menge
  rationale: Die nachgestellte Apposition identifiziert den zuvor mit „er“ Bezeichneten und alle, die zu ihm gehören. „Menge“ wahrt die Breite von הָמוֹן, ohne es unnötig auf ein Heer einzuengen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: So spricht der Herr Jahwe
  rationale: Gibt die prophetische Spruchformel idiomatisch wieder und bewahrt zugleich den offenbarten Gottesnamen.
theological_decisions:
- issue: Bezugsrichtung von חֲתִיתוֹ
  choice: seinen Schrecken
  alternative: meinen Schrecken
  rationale: Der vorliegende masoretische Text hat ein maskulines Suffix der 3. Person Singular und bezieht den Schrecken daher am natürlichsten auf den Pharao. Einige alte Textzeugen stützen jedoch die erste Person; diese bedeutsame Variante wird nicht stillschweigend beseitigt, sondern in einer Fußnote genannt.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der Herr
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet, den Gottesnamen durch einen zweiten Titel zu ersetzen.
- issue: Schicksal des Pharao unter den עֲרֵלִים
  choice: unter die Unbeschnittenen gelegt
  alternative: unter den Unbeschnittenen begraben
  rationale: „Gelegt“ bewahrt die passive Form des Hebräischen und die Spannung des Todesbildes, ohne die Aussage ausdrücklich auf eine reguläre Bestattung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gerichtssprache und die wiederkehrende Ezechiel-Terminologie bleiben deutlich; unnötig altertümliche Formen werden vermieden.
