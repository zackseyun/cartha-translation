revisions:
- from: Denn ich verbreitete seinen Schrecken im Land der Lebenden[a]. Doch er wird mitten unter die Unbeschnittenen gelegt werden, zu den vom Schwert Erschlagenen – der Pharao und seine ganze Menge. So spricht der Herr Jahwe.
  to: Denn ich setzte seinen Schrecken im Land der Lebenden[a], und er wird mitten unter die Unbeschnittenen gelegt werden, zu den vom Schwert Erschlagenen – der Pharao und seine ganze Menge. So spricht der Herr Jahwe.
  rationale: Die Revision ersetzt die interpretierende Vergangenheitsform „verbreitete“ durch das quellennähere „setzte“ und entfernt den nicht ausdrücklich markierten Gegensatz „Doch“. Alle übrigen Formulierungen, einschließlich der Fußnote zur textkritisch belegten Lesart, können bestehen bleiben.
