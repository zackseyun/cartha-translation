  source_fidelity: 'Die Grundbezüge des hebräischen Textes sind richtig wiedergegeben: חֲתִיתוֹ als „seinen Schrecken“, die passive Zukunftsform von וְהֻשְׁכַּב, die Zuordnung zu den Unbeschnittenen und Schwerterschlagenen sowie die abschließende Gottesformel. Die Wiedergabe von נָתַתִּי als „verbreitete“ ist jedoch gegenüber dem gewöhnlichen, hier räumlich bestimmten „gab/setzte“ zu interpretierend. Außerdem hat das einleitende וְ keinen ausdrücklich adversativen Sinn, sodass „Doch“ nicht angezeigt ist.'
  naturalness: „Ich setzte seinen Schrecken im Land der Lebenden“ ist modernes, würdiges Deutsch und bildet die konkrete hebräische Ausdrucksweise genauer ab als „verbreitete“. Die Folge „wird ... gelegt werden, mitten unter die Unbeschnittenen, zu den vom Schwert Erschlagenen“ ist verständlich und bewahrt die gerichtliche Bildsprache.
  terminology: „Unbeschnittene“, „vom Schwert Erschlagene“, „Pharao“ und „Jahwe“ sind angemessen. „So spricht der Herr Jahwe“ gibt die prophetische Formel natürlich wieder, ohne den Gottesnamen zu ersetzen. Die textkritische Fußnote bewahrt die relevante Lesart „meinen Schrecken“ und ist korrekt verankert.
