  text: שָׁ֤ם אַשּׁוּר֙ וְ/כָל קְהָלָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתָ֑י/ו כֻּלָּ֣/ם חֲלָלִ֔ים הַ/נֹּפְלִ֖ים בֶּ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/022.yaml
  text: There is Assyria and all her assembly[a], with his graves all around him; all of them are slain, fallen by the sword.
translation:
  language: de
  text: Dort ist Assyrien mit ihrer ganzen Schar[a]; seine Gräber liegen rings um ihn. Sie alle sind Erschlagene, die durch das Schwert gefallen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wechselt die Personifikation: Auf das feminine »ihre ganze Schar« folgen maskuline Formen bei »seine Gräber« und »um ihn«. Dieser Wechsel bleibt in der Übersetzung erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Dort ist
  rationale: Die Ortsangabe führt im Bild der Unterwelt die nächste Macht ein; »Dort ist« bewahrt den hinweisenden Charakter in natürlichem Deutsch.
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Der Name bezeichnet hier das assyrische Reich als personifizierte Größe; »Assyrien« ist die geläufige moderne deutsche Bezeichnung.
- source_word: וְכָל־קְהָלָהּ
  choice: mit ihrer ganzen Schar
  rationale: קהל bezeichnet eine versammelte Gesamtheit. »Schar« ist hier natürlich und legt die Gruppe nicht ausschließlich militärisch fest. »Ihrer« gibt den femininen hebräischen Suffix wieder; »mit« bildet die koordinierende Darstellung idiomatisch ab.
- source_word: קִבְרֹתָיו סְבִיבוֹתָיו
  choice: seine Gräber liegen rings um ihn
  rationale: »Gräber« entspricht קברות unmittelbar; »rings um ihn« gibt die adverbiale Ortsangabe wieder. Die maskulinen Bezüge werden trotz des vorangehenden femininen Bezugs bewusst erhalten.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die zusammenfassende Formulierung bezieht sich auf die gesamte zuvor genannte Schar und ist im Deutschen idiomatisch.
- source_word: חֲלָלִים
  choice: Erschlagene
  rationale: Das Substantiv bezeichnet gewaltsam Getötete, besonders im Krieg; »Erschlagene« bewahrt den ernsten prophetischen Ton.
- source_word: הַנֹּפְלִים בֶּחָרֶב
  choice: die durch das Schwert gefallen sind
  rationale: Die partizipiale Kennzeichnung und die übliche Kriegsformel werden eng am Hebräischen und zugleich verständlich wiedergegeben.
theological_decisions:
- issue: Wechsel der grammatischen Personifikation Assyriens
  choice: Der Wechsel von femininem »ihrer« zu maskulinem »seine … ihn« wird im Haupttext bewahrt und erläutert.
  alternative: Alle Bezüge nach deutschem Sprachgebrauch vereinheitlichen, etwa »seiner ganzen Schar; seine Gräber rings um es« oder durchgehend feminin personifizieren.
  rationale: Der hebräische Text wechselt tatsächlich von einem femininen Suffix bei קְהָלָהּ zu maskulinen Suffixen bei קִבְרֹתָיו und סְבִיבוֹתָיו. Eine Glättung würde diese auffällige Spannung verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schar« vermeidet einen unnötig kirchlichen Klang von »Versammlung«. Die auffälligen Pronomen sind aufgrund des hebräischen Genuswechsels bewusst nicht geglättet.
