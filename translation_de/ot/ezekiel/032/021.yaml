source:
  edition: WLC
  text: יְדַבְּרוּ ל֞/וֹ אֵלֵ֧י גִבּוֹרִ֛ים מִ/תּ֥וֹךְ שְׁא֖וֹל אֶת עֹֽזְרָ֑י/ו יָֽרְד֛וּ שָׁכְב֥וּ הָ/עֲרֵלִ֖ים חַלְלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/021.yaml
  text: 'The mighty among the chiefs will speak to him from the midst of Sheol[a], with his helpers: ‘They have gone down; they lie still, the uncircumcised[c][b], slain by the sword.’'
translation:
  language: de
  text: 'Die Mächtigen unter den Kriegern[a] werden aus der Mitte des Scheols[b] zu ihm reden, zusammen mit seinen Helfern[c]: »Sie sind hinabgestiegen, sie liegen da – die Unbeschnittenen, vom Schwert Erschlagenen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Starken unter den Helden«; die hebräische Wortverbindung ist schwierig und lautet wörtlicher etwa »die Mächtigen der Krieger«.'
    reason: lexical_alternative
  - marker: b
    text: Scheol ist die hebräische Bezeichnung für das Totenreich; der Begriff ist nicht gleichbedeutend mit »Hölle«.
    reason: cultural_note
  - marker: c
    text: 'Oder: »zu ihm samt seinen Verbündeten«. Das Hebräische lässt offen, ob seine Helfer mitreden oder ihn im Tod begleiten und ebenfalls angesprochen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבְּרוּ לּוֹ
  choice: werden … zu ihm reden
  rationale: Das Piel-Imperfekt wird in der prophetisch geschauten Szene futurisch wiedergegeben; לּוֹ bezeichnet am natürlichsten den Adressaten der Rede.
- source_word: אֵלֵי גִבּוֹרִים
  choice: die Mächtigen unter den Kriegern
  rationale: Die schwierige Verbindung wird kontextgemäß auf herausragende menschliche Krieger im Totenreich bezogen. Die Formulierung bleibt näher am Hebräischen als ein eindeutiger Rangtitel und vermeidet die hier weniger wahrscheinliche Deutung als Götter.
- source_word: מִתּוֹךְ שְׁאוֹל
  choice: aus der Mitte des Scheols
  rationale: Die räumliche Bildhaftigkeit bleibt erhalten. Der hebräische Begriff wird beibehalten, da weder „Grab“ noch „Hölle“ seinen Bedeutungsumfang genau wiedergibt.
- source_word: אֶת עֹזְרָיו
  choice: zusammen mit seinen Helfern
  rationale: אֶת wird assoziativ als „mit“ verstanden. Wegen der syntaktischen Offenheit wird in einer Fußnote die mögliche Zuordnung der Helfer zum angesprochenen Pharao genannt.
- source_word: יָרְדוּ
  choice: sie sind hinabgestiegen
  rationale: Das Perfekt bezeichnet den vollendeten Abstieg in das Totenreich und bereitet den folgenden Zustand vor.
- source_word: שָׁכְבוּ
  choice: sie liegen da
  rationale: Im Todeskontext bezeichnet das Verb das reglose Liegen der Toten; „liegen da“ ist natürlich und wahrt die Bildsprache.
- source_word: הָעֲרֵלִים
  choice: die Unbeschnittenen
  rationale: Die übliche sachliche Wiedergabe bewahrt die mit dem Ausdruck verbundene Schande im Kontext von Ezechiels Völkerworten.
- source_word: חַלְלֵי חָרֶב
  choice: vom Schwert Erschlagene
  rationale: Die feste Wendung wird idiomatisch und mit ihrem kriegerischen Ton wiedergegeben.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab; Hölle
  rationale: „Scheol“ bewahrt die alttestamentliche Begriffswelt, ohne den Ausdruck auf ein einzelnes Grab zu verengen oder mit späteren Vorstellungen von der Hölle gleichzusetzen.
- issue: Deutung von אֵלֵי גִבּוֹרִים
  choice: herausragende menschliche Krieger
  alternative: Götter der Krieger beziehungsweise göttliche Wesen
  rationale: Der unmittelbare Zusammenhang handelt von gefallenen Völkern und Kriegern im Scheol. Die menschliche Deutung ist daher wahrscheinlicher, während die lexikalische Schwierigkeit in der Fußnote kenntlich bleibt.
- issue: Zuordnung von עֹזְרָיו
  choice: Die Helfer reden zusammen mit den Mächtigen
  alternative: Die Rede gilt ihm samt seinen Helfern beziehungsweise Verbündeten
  rationale: Die assoziative Bedeutung von אֶת erlaubt „mit“, doch die syntaktische Anbindung bleibt mehrdeutig; die alternative Zuordnung wird nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die nachgestellte Bezeichnung der Toten hervor. Fachsprachliche oder konfessionell geprägte Zusätze werden vermieden; die drei echten sprachlichen Unklarheiten werden durch knappe Fußnoten offengehalten.
