source:
  edition: WLC
  text: שָׁ֣ם מֶ֤שֶׁךְ תֻּבַל֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרוֹתֶ֑י/הָ כֻּלָּ֤/ם עֲרֵלִים֙ מְחֻ֣לְלֵי חֶ֔רֶב כִּֽי נָתְנ֥וּ חִתִּיתָ֖/ם בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/026.yaml
  text: There are Meshech and Tubal[a], and all her multitude; their graves are all around him. All of them are uncircumcised, slain by the sword, because they spread their terror in the land of the living.
translation:
  language: de
  text: Dort sind Meschech und Tubal und ihre ganze Menge; rings um ihn liegen ihre Gräber.[a] Sie alle sind unbeschnitten, vom Schwert erschlagen, denn sie verbreiteten ihren Schrecken im Land der Lebenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ihre ganze Menge; rings um ihn ihre Gräber“. Die hebräische poetische Zeile wechselt zwischen femininen und maskulinen Singularsuffixen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Dort sind
  rationale: Das deiktische Adverb bedeutet „dort“. Für den verblosen hebräischen Satz wird im Deutschen passend „sind“ ergänzt.
- source_word: מֶשֶׁךְ תֻּבַל
  choice: Meschech und Tubal
  rationale: Die Namen von Völkern beziehungsweise Gebieten werden in ihrer herkömmlichen deutschen Form wiedergegeben.
- source_word: וְכָל הֲמוֹנָהּ
  choice: und ihre ganze Menge
  rationale: הָמוֹן bezeichnet die zugehörige Menschenmenge. „Menge“ bewahrt den kollektiven Sinn, ohne die Gruppe ausschließlich als Heer zu deuten.
- source_word: סְבִיבוֹתָיו קִבְרוֹתֶיהָ
  choice: rings um ihn liegen ihre Gräber
  rationale: Die Übersetzung bewahrt den auffälligen Wechsel zwischen dem maskulinen Singularsuffix („ihn“) und dem femininen Possessivsuffix („ihre“); das im Hebräischen fehlende Verb wird für natürliches Deutsch ergänzt.
- source_word: כֻּלָּם
  choice: Sie alle
  rationale: Die Form greift die zuvor genannte Gesamtgruppe wieder auf.
- source_word: עֲרֵלִים
  choice: unbeschnitten
  rationale: Die wörtliche Wiedergabe erhält die Bundes- und Schandkonnotationen, die in diesem Totenklagelied eine wesentliche Rolle spielen.
- source_word: מְחֻלְלֵי חֶרֶב
  choice: vom Schwert erschlagen
  rationale: Die Wendung bezeichnet hier Menschen, die durch das Schwert tödlich getroffen wurden, und entspricht einer wiederkehrenden Formel des Kapitels.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für ihr schmachvolles Geschick ein.
- source_word: נָתְנוּ חִתִּיתָם
  choice: sie hatten ihren Schrecken … verbreitet
  rationale: Die hebräische Wendung „ihren Schrecken geben/setzen“ bedeutet, anderen Schrecken einzujagen beziehungsweise Schrecken zu verbreiten. Das Plusquamperfekt verdeutlicht im Deutschen, dass dies ihrem Tod vorausging.
- source_word: בְּאֶרֶץ חַיִּים
  choice: im Land der Lebenden
  rationale: Die feste Wendung bezeichnet den Bereich des irdischen Lebens im Gegensatz zur Unterwelt.
theological_decisions:
- issue: Bundesbezogene Schandsprache im Gericht über die Toten
  choice: unbeschnitten
  alternative: entehrt
  rationale: Die konkrete Bezeichnung wird nicht durch eine allgemeine Deutung ersetzt; so bleiben die bundesgeschichtliche Bildwelt und die rhetorische Schärfe des Textes erhalten.
- issue: Wechselnde pronominale Bezüge in der poetischen Zeile
  choice: „ihre ganze Menge; rings um ihn … ihre Gräber“ beibehalten und durch eine Fußnote erläutern
  alternative: sämtliche Bezüge zu einem einheitlichen Plural glätten
  rationale: Der hebräische Text wechselt in dichterischer Verdichtung Genus und Bezug. Die deutsche Fassung wahrt diese Spannung, statt eine einzige Identifikation des Bezugsträgers festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählungsform und die wiederkehrende Gerichtssprache des Kapitels bleiben erhalten; lediglich das für einen vollständigen deutschen Satz erforderliche Verb wird ergänzt.
