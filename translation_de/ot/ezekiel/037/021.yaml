- from: 'Und sag zu ihnen: »So spricht der Herr Jahwe: Siehe, ich hole die Israeliten[a] aus den Völkern heraus, zu denen sie gezogen sind. Ich sammle sie von ringsum und bringe sie in ihr eigenes Land.«'
