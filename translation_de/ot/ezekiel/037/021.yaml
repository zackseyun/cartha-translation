  rationale: Die Revision vereinheitlicht die Wiedergabe des Gottesnamens mit der vorgegebenen Entscheidung, vermeidet bei der Zerstreuung eine nicht belegte Freiwilligkeitsnuance und glättet die Richtungsangabe idiomatisch. Die anschauliche Präsensform, die prophetische Formel und die sonstige Satzstruktur bleiben erhalten.
