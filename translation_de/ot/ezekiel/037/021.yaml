    rationale: „gezogen“ kann eine nicht im hebräischen Text angelegte Nuance freiwilliger Migration vermitteln. Das neutrale „gegangen“ wahrt die Offenheit des Textes.
  - severity: medium
    issue: „Jahwe“ weicht von der festgelegten Namensform ab
    rationale: Der Audit Trail legt für יהוה die Transliteration „Yahweh“ fest; diese Form sollte auch im zusammengesetzten Titel konsistent verwendet werden.
  - severity: low
    issue: „von ringsum“
    rationale: Die Formulierung ist verständlich, aber „von überallher“ ist gegenwärtiger und natürlicher, ohne den Sinn von מִסָּבִיב zu verändern.
