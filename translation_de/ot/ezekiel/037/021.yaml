  text: וְ/דַבֵּ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֨ה אֲנִ֤י לֹקֵ֨חַ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/בֵּ֥ין הַ/גּוֹיִ֖ם אֲשֶׁ֣ר הָֽלְכוּ שָׁ֑ם וְ/קִבַּצְתִּ֤י אֹתָ/ם֙ מִ/סָּבִ֔יב וְ/הֵבֵאתִ֥י אוֹתָ֖/ם אֶל אַדְמָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/021.yaml
  text: 'Then say to them[a], ‘Thus says the Lord GOD: Behold, I am taking the children of Israel from among the nations where they have gone[b], and I will gather them from all around and bring them to their own land.’'
translation:
  language: de
  text: 'Und sag zu ihnen: »So spricht der Herr Yahweh: Siehe, ich hole die Israeliten[a] aus den Völkern, unter die sie gegangen sind, und sammle sie von überallher und bringe sie in ihr eigenes Land.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; gemeint sind die Angehörigen des Volkes Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדַבֵּר אֲלֵיהֶם
  choice: Und sag zu ihnen
  rationale: Der Imperativ führt die prophetische Anweisung fort. „Sag“ gibt דַבֵּר in diesem Kontext natürlich und unmittelbar wieder.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel bleibt in würdigem, vertrautem Deutsch erhalten.
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: Siehe, ich hole
  rationale: הִנֵּה lenkt feierlich die Aufmerksamkeit auf das folgende Handeln; das Partizip לֹקֵחַ wird als anschaulich einsetzendes beziehungsweise unmittelbar bevorstehendes Handeln wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche deutsche Volksbezeichnung ist im Kontext klar; die wörtliche familiäre Form wird in einer Fußnote bewahrt.
- source_word: מִבֵּין הַגּוֹיִם
  choice: aus den Völkern heraus
  rationale: Die Wendung bezeichnet die fremden Völker, unter denen Israel zerstreut ist; „heraus“ bildet die Bewegung aus ihrer Mitte ab.
- source_word: אֲשֶׁר הָלְכוּ שָׁם
  choice: zu denen sie gezogen sind
  rationale: Die Relativkonstruktion benennt idiomatisch die Völker als Ziel der vorausgegangenen Zerstreuung, ohne zu entscheiden, ob der Weg freiwillig oder erzwungen war.
- source_word: וְקִבַּצְתִּי אֹתָם מִסָּבִיב
  choice: Ich sammle sie von ringsum
  rationale: מִסָּבִיב beschreibt eine umfassende Sammlung aus allen umliegenden Richtungen; das Präsens bewahrt die lebendige Gewissheit der göttlichen Zusage.
- source_word: וְהֵבֵאתִי אוֹתָם אֶל אַדְמָתָם
  choice: und bringe sie in ihr eigenes Land
  rationale: אַדְמָה bezeichnet hier Israels eigenes Land beziehungsweise seinen heimatlichen Boden. „In ihr eigenes Land“ ist im Deutschen eine natürliche Zielangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי („Herr“) vom Gottesnamen יהוה und macht den im hebräischen Text ausdrücklich stehenden Namen sichtbar, ohne die beiden Bestandteile zu verschmelzen.
- issue: Zeitform der göttlichen Sammlung und Rückführung
  choice: 'anschauliches Präsens: „ich hole … ich sammle … und bringe“'
  alternative: 'Futur: „ich werde … holen/sammeln/bringen“'
  rationale: Das Präsens gibt die durch הִנֵּה und das Partizip eröffnete lebendige, als gewiss dargestellte Handlung wieder. Es leugnet nicht den Verheißungscharakter der folgenden Perfektformen mit וְ.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdig-prophetischem Klang. „Siehe“ bleibt als bewusst gehobenes Aufmerksamkeitssignal erhalten; Satzbau und Verben sind ansonsten gegenwärtig und natürlich.
