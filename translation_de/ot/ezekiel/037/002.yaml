  text: וְ/הֶעֱבִירַ֥/נִי עֲלֵי/הֶ֖ם סָבִ֣יב סָבִ֑יב וְ/הִנֵּ֨ה רַבּ֤וֹת מְאֹד֙ עַל פְּנֵ֣י הַ/בִּקְעָ֔ה וְ/הִנֵּ֖ה יְבֵשׁ֥וֹת מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/002.yaml
  text: And he led me around among them[a], all around; and behold, there were very many on the surface of the valley, and behold[b], they were very dry.
translation:
  language: de
  text: 'Er führte mich ringsum an ihnen vorbei[a]. Und sieh: Es lagen sehr viele auf der Fläche der Talebene, und sieh: Sie waren sehr trocken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er ließ mich ringsum über sie hinweggehen.“ Die hebräische Formulierung kann räumlich auch so wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִירַנִי
  choice: Er führte mich … hindurch
  rationale: Der Hifil von עבר bezeichnet hier ein veranlasstes beziehungsweise geführtes Hindurchgehen. Die Formulierung gibt die Führung in der Vision natürlich wieder, ohne die Bewegung unnötig festzulegen.
- source_word: עֲלֵיהֶם
  choice: zwischen ihnen
  rationale: Die Präposition bedeutet formal „über/auf ihnen“. Im Zusammenhang mit den in der Talebene liegenden Knochen bezeichnet sie wahrscheinlich die räumliche Bewegung inmitten beziehungsweise zwischen ihnen; die formale Alternative bleibt in der Fußnote erhalten.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die Wiederholung verstärkt die Vorstellung einer umfassenden Bewegung rings um die Knochen. „ringsum“ ist knapp, gegenwärtig und würdevoll.
- source_word: וְהִנֵּה
  choice: und sieh
  rationale: Die Aufmerksamkeitspartikel hebt in der Vision jeweils eine auffällige Wahrnehmung hervor. „sieh“ bewahrt diese rhetorische Funktion besser als eine bloße Erzählverknüpfung.
- source_word: רַבּוֹת מְאֹד
  choice: sehr viele
  rationale: Das feminine Pluraladjektiv bezieht sich auf die aus dem Vorvers erschlossenen Knochen. „sehr viele“ erhält die starke Mengenangabe.
- source_word: עַל־פְּנֵי הַבִּקְעָה
  choice: über die Fläche der Talebene verstreut
  rationale: Wörtlich steht „auf dem Angesicht der Talebene“. Die gewählte Fassung vermittelt idiomatisch, dass die zahlreichen Knochen sichtbar über deren Fläche verteilt lagen; „Talebene“ gibt בִּקְעָה genauer wieder als das allgemeinere „Tal“.
- source_word: יְבֵשׁוֹת מְאֹד
  choice: völlig ausgetrocknet
  rationale: Die Knochen sind nicht nur trocken, sondern durch מְאֹד nachdrücklich als sehr trocken bezeichnet. „völlig ausgetrocknet“ drückt ihren extremen Zustand im Deutschen natürlich aus, ohne über die Aussage hinauszugehen.
