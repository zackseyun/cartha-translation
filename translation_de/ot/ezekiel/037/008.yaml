base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/008.yaml
  text: And I looked[a], and behold, there were sinews on them, and flesh had come up, and skin covered them from above; but there was no breath in them.
translation:
  language: de
  text: 'Und ich sah: Siehe, Sehnen waren auf ihnen, Fleisch wuchs heran, und Haut überzog sie von oben; doch kein Atem[a] war in ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ruach kann „Atem“, „Wind“ oder „Geist“ bedeuten. Hier passt „Atem“ zu den noch leblosen Körpern; im weiteren Abschnitt klingen jedoch alle drei Bedeutungen an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Und ich sah
  rationale: ראה bezeichnet hier im fortlaufenden Visionsbericht das Wahrnehmen des Propheten; „ich sah“ ist im Deutschen natürlich und quellentreu.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit lebhaft auf das plötzlich wahrgenommene Bild; „Siehe“ wahrt den würdevollen visionären Ton.
- source_word: גִּדִים
  choice: Sehnen
  rationale: גִּידִים bezeichnet das verbindende Gewebe der neu entstehenden Körper; „Sehnen“ ist anschaulich und weniger klinisch als „Tendons“.
- source_word: וּבָשָׂר עָלָה
  choice: Fleisch wuchs heran
  rationale: בָּשָׂר ist hier leibliches Fleisch; עָלָה beschreibt, wie es auf den Knochen entsteht beziehungsweise heranwächst.
- source_word: וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה
  choice: und Haut zog sich von oben über sie
  rationale: קרם beschreibt das Überziehen beziehungsweise Bilden einer äußeren Schicht; die Formulierung bewahrt sowohl das Bedecken als auch מִלְמָעְלָה „von oben“.
- source_word: וְרוּחַ אֵין בָּהֶם
  choice: doch Atem war nicht in ihnen
  rationale: רוּחַ meint in dieser unmittelbaren Szene am ehesten den Lebensatem, dessen Fehlen die zusammengesetzten Körper leblos lässt; „doch“ gibt den inhaltlichen Gegensatz idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von רוּחַ in der Vision von den Totengebeinen
  choice: Atem
  alternative: Wind; Geist
  rationale: Im unmittelbaren Zusammenhang sind die Körper bereits wiederhergestellt, aber noch ohne Leben, weshalb „Atem“ am besten passt. Das weitere Kapitel spielt jedoch bewusst mit dem Bedeutungsspektrum Atem, Wind und Geist; diese Spannung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. „Siehe“ bewahrt die Hervorhebung des hebräischen Diskursmarkers; ansonsten wird unnötig altertümliche oder medizinisch-technische Sprache vermieden.
