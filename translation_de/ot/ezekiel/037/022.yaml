source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי אֹ֠תָ/ם לְ/ג֨וֹי אֶחָ֤ד בָּ/אָ֨רֶץ֙ בְּ/הָרֵ֣י יִשְׂרָאֵ֔ל וּ/מֶ֧לֶךְ אֶחָ֛ד יִֽהְיֶ֥ה לְ/כֻלָּ֖/ם לְ/מֶ֑לֶךְ וְ/לֹ֤א יהיה עוֹד֙ לִ/שְׁנֵ֣י גוֹיִ֔ם וְ/לֹ֨א יֵחָ֥צוּ ע֛וֹד לִ/שְׁתֵּ֥י מַמְלָכ֖וֹת עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/022.yaml
  text: And I will make them one nation in the land[a], on the mountains of Israel, and one king will be king over all of them. They will no longer be two nations[b], and they will no longer be divided into two kingdoms.
translation:
  language: de
  text: Ich werde sie zu einer einzigen Nation im Land machen, auf den Bergen Israels[a]. Ein einziger König wird König über sie alle sein. Sie werden nicht länger zwei Nationen sein und nie mehr in zwei Königreiche geteilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Bergland Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד
  choice: Ich werde sie zu einer einzigen Nation machen
  rationale: Die Konstruktion עשה mit Objekt und לְ bezeichnet das Machen zu etwas. „Zu einer einzigen Nation machen“ gibt sowohl die göttliche Verursachung als auch das betonte אֶחָד natürlich wieder.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: הָאָרֶץ bezeichnet hier das Land Israels, nicht allgemein die Erde. Der bestimmte Ausdruck „im Land“ bewahrt diesen geografischen und verheißungsgeschichtlichen Bezug.
- source_word: בְּהָרֵי יִשְׂרָאֵל
  choice: auf den Bergen Israels
  rationale: Die formnahe Wiedergabe erhält eine für Ezechiel charakteristische Wendung. Eine idiomatischere topografische Alternative wird in der Fußnote genannt.
- source_word: וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ
  choice: Ein einziger König wird König über sie alle sein
  rationale: Die Wiederholung von מֶלֶךְ wird bewahrt, weil sie die Einheit des Königtums betont. „Über sie alle“ gibt die Funktion des Königs im Deutschen natürlich wieder.
- source_word: וְלֹא יהיה עוֹד לִשְׁנֵי גוֹיִם
  choice: Sie werden nicht länger zwei Nationen sein
  rationale: Obwohl das masoretische היה formal Singular ist, bezieht sich die Aussage sinngemäß auf das zuvor genannte Kollektiv. Der Plural ist im Deutschen eindeutig und natürlich.
- source_word: וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת עוֹד
  choice: und nie mehr in zwei Königreiche geteilt werden
  rationale: Das Nifal von חצה hat hier passiven Sinn. „Nie mehr“ bringt die durch das wiederholte עוֹד nachdrücklich zugesagte Endgültigkeit idiomatisch zum Ausdruck.
theological_decisions:
- issue: Art der verheißenen Wiedervereinigung Israels
  choice: Die Verheißung wird unmittelbar in nationalen, territorialen und königlichen Begriffen wiedergegeben.
  alternative: Den König ausdrücklich als Messias bezeichnen oder die Wiedervereinigung ausschließlich vergeistigen.
  rationale: Der Vers selbst spricht von einer Nation, dem Land und einem König, identifiziert diesen König hier aber nicht ausdrücklich als Messias. Die Übersetzung lässt deshalb weiterführende messianische Deutungen offen, ohne sie in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einzige“ verdeutlicht jeweils die betonte Einheit. Die Wiederholung von „König“ spiegelt bewusst die hebräische Emphase; die abschließende Wiederholung von עוֹד wird dagegen idiomatisch durch „nie mehr“ gebündelt.
