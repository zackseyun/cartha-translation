  to: Ich werde mit ihnen einen Friedensbund schließen; es wird ein ewiger Bund mit ihnen sein. Ich werde sie ansiedeln[a] und sie zahlreich machen, und ich werde mein Heiligtum für immer mitten unter ihnen errichten.
  rationale: Die Revision beseitigt die über das Hebräische hinausgehende Aussage „einen festen Platz geben“, bewahrt die im Kontext plausible Wiederherstellungsnuance mit „ansiedeln“ und hält die formnähere Alternative in der Fußnote fest. Die Stellung des Heiligtums wird als dauerhafte Gegenwart „mitten unter ihnen“ formuliert. „Errichten“ ist hier als natürliche Wiedergabe von נתן bei einem Heiligtum gewählt, ohne den Referenten auf einen bestimmten Tempelbau zu verengen.
