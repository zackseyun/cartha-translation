source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם בְּרִ֥ית עוֹלָ֖ם יִהְיֶ֣ה אוֹתָ֑/ם וּ/נְתַתִּי/ם֙ וְ/הִרְבֵּיתִ֣י אוֹתָ֔/ם וְ/נָתַתִּ֧י אֶת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/026.yaml
  text: I will make with them a covenant of peace[a]; it will be an everlasting covenant with them. And I will place them and multiply them[c][b], and I will set my sanctuary in their midst forever.
translation:
  language: de
  text: Ich werde mit ihnen einen Friedensbund schließen; es wird ein ewiger Bund mit ihnen sein. Ich werde sie ansiedeln[a] und sie zahlreich machen, und ich werde mein Heiligtum für immer mitten unter ihnen errichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde sie setzen/platzieren.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: Ich werde ... einen Bund schließen
  rationale: Die hebräische Wendung „einen Bund schneiden“ wird im modernen Deutschen idiomatisch mit „einen Bund schließen“ wiedergegeben.
- source_word: בְּרִית שָׁלוֹם
  choice: Friedensbund
  rationale: Die kompakte deutsche Zusammensetzung bewahrt den Bundesbegriff und lässt bei „Frieden“ den umfassenden Sinn von Wohlergehen und Ganzheit offen.
- source_word: בְּרִית עוֹלָם
  choice: ein ewiger Bund
  rationale: „Ewig“ gibt die unbegrenzte Dauer des Bundes in natürlichem biblischem Deutsch wieder.
- source_word: יִהְיֶה אוֹתָם
  choice: wird es mit ihnen sein
  rationale: Die Formulierung bewahrt die relationale Bedeutung von אֵת und die Wiederaufnahme des Bundes, ohne sie stärker als Besitz- oder Nutzenaussage festzulegen.
- source_word: וּנְתַתִּים
  choice: ich werde ihnen einen festen Platz geben
  rationale: נתן mit einem Personenobjekt bezeichnet hier wahrscheinlich ein beständiges Einsetzen oder Ansiedeln; die Wiedergabe ist verständlich, ohne die schwierige Kurzform „sie setzen“ zu verwenden.
- source_word: וְהִרְבֵּיתִי אוֹתָם
  choice: sie zahlreich machen
  rationale: Die Hifil-Form bezeichnet das Vermehren beziehungsweise Viele-Machen des Volkes.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: „Heiligtum“ entspricht dem Begriff präziser und ist weniger eng als „Tempel“.
- source_word: בְּתוֹכָם
  choice: in ihre Mitte
  rationale: Die Wendung bezeichnet die räumlich-gemeinschaftliche Gegenwart unter dem Volk und legt keine individuelle Innerlichkeit nahe.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die natürliche deutsche Wendung bringt die dauerhafte Geltung klar zum Ausdruck.
theological_decisions:
- issue: Bundessprache im Zusammenhang der Wiederherstellung
  choice: „Friedensbund“ und „ewiger Bund“ ausdrücklich beibehalten
  alternative: Die Ausdrücke allgemein als dauerhaften Frieden oder Segen umschreiben
  rationale: Der Vers beschreibt Gottes bindende Bundesbeziehung; eine bloße Segensparaphrase würde diese theologische Struktur abschwächen.
- issue: Ort des Heiligtums Gottes
  choice: „in ihre Mitte“ als gemeinschaftliche Gegenwart
  alternative: „in ihnen“ als vorwiegend innere oder individuelle Gegenwart
  rationale: בְּתוֹכָם weist hier am natürlichsten auf das Heiligtum inmitten des wiederhergestellten Volkes; spätere Kategorien persönlicher Innewohnung sollen nicht in den Text eingetragen werden.
- issue: Bedeutung von וּנְתַתִּים
  choice: beständige Ansiedlung durch „ihnen einen festen Platz geben“ ausdrücken
  alternative: formal „sie setzen/stellen“ oder deutend „sie fest gründen“
  rationale: Die gewählte Fassung vermittelt im Wiederherstellungskontext eine stabile Platzierung, während die Fußnote die formnähere Möglichkeit sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Bundessprache und die dauerhafte Gegenwart des Heiligtums bleiben deutlich; schwer verständliches wörtliches Deutsch wird nur dort geglättet, wo eine Fußnote die lexikalische Offenheit bewahrt.
