source:
  edition: WLC
  text: וְ/נִבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צֻוֵּ֑יתִי וַֽ/יְהִי ק֤וֹל כְּ/הִנָּֽבְאִ/י֙ וְ/הִנֵּה רַ֔עַשׁ וַ/תִּקְרְב֣וּ עֲצָמ֔וֹת עֶ֖צֶם אֶל עַצְמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/007.yaml
  text: So I prophesied as I was commanded[a], and as I prophesied, there was a sound, and behold, a rattling, and the bones came together[b], bone to its bone.
translation:
  language: de
  text: 'Da weissagte ich, wie mir befohlen worden war. Und während ich weissagte, entstand ein Geräusch – und siehe: ein Rasseln![a] Da rückten die Knochen zusammen, jeder Knochen zu dem Knochen, der zu ihm gehörte.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Erschütterung“ beziehungsweise „ein Beben“. Das hebräische רַעַשׁ kann verschiedene Arten heftiger Bewegung oder entsprechenden Lärms bezeichnen; im Zusammenhang der sich zusammenfügenden Knochen liegt „Rasseln“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Knochen zu seinem Knochen“. Die hebräische Einzahl ist distributiv gebraucht: Jeder Knochen fügte sich an den zu ihm gehörenden Knochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֵּאתִי
  choice: ich weissagte
  rationale: Das Nifal von נבא bezeichnet bei Ezechiel regelmäßig prophetisches Reden. „Weissagen“ ist die etablierte, knappe deutsche Wiedergabe.
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  choice: wie mir befohlen worden war
  rationale: Die Passivform von צוה zeigt, dass Ezechiel einen Befehl empfangen hatte; die deutsche Vorvergangenheit stellt diesen vor das anschließende Weissagen.
- source_word: וַיְהִי קוֹל
  choice: es entstand ein Geräusch
  rationale: קוֹל bezeichnet hier zunächst ein hörbares Phänomen, dessen Art erst durch רַעַשׁ näher bestimmt wird. „Geräusch“ wahrt diese Abstufung.
- source_word: כְּהִנָּבְאִי
  choice: während ich weissagte
  rationale: Der Infinitiv mit כְּ bezeichnet hier zeitliche Gleichzeitigkeit; „während“ gibt den fortlaufenden Vorgang natürlich wieder.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die traditionelle Aufmerksamkeitsformel bewahrt die Anschaulichkeit und prophetische Unmittelbarkeit von הִנֵּה.
- source_word: רַעַשׁ
  choice: ein Rasseln
  rationale: Das Wort kann Erschütterung, Beben oder ein dröhnendes beziehungsweise rasselndes Geräusch bezeichnen. Im unmittelbaren Zusammenhang der sich zusammenfügenden Knochen ist „Rasseln“ besonders anschaulich, ohne die weiteren Möglichkeiten zu verschweigen.
- source_word: וַתִּקְרְבוּ עֲצָמוֹת
  choice: da rückten die Knochen zusammen
  rationale: קרב bedeutet wörtlich „sich nähern“. Hier bewegen sich die Knochen zueinander und fügen sich passend zusammen; „zusammenrücken“ gibt Bewegung und Ergebnis wieder.
- source_word: עֶצֶם אֶל עַצְמוֹ
  choice: jeder Knochen zu dem Knochen, der zu ihm gehörte
  rationale: Die distributive Singularform meint, dass jeder Knochen zu seinem jeweils passenden Gegenstück gelangt. Die Wiedergabe macht diesen Sinn in natürlichem Deutsch deutlich.
