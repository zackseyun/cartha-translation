  text: וְ/יָשְׁב֣וּ עַל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָתַ֨תִּי֙ לְ/עַבְדִּ֣/י לְ/יַֽעֲקֹ֔ב אֲשֶׁ֥ר יָֽשְׁבוּ בָ֖/הּ אֲבֽוֹתֵי/כֶ֑ם וְ/יָשְׁב֣וּ עָלֶ֡י/הָ הֵ֠מָּה וּ/בְנֵי/הֶ֞ם וּ/בְנֵ֤י בְנֵי/הֶם֙ עַד עוֹלָ֔ם וְ/דָוִ֣ד עַבְדִּ֔/י נָשִׂ֥יא לָ/הֶ֖ם לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/025.yaml
  text: They will dwell in the land that I gave to my servant Jacob[a], where your fathers dwelt; and they will dwell on it, they and their sons and their sons' sons, forever[c][b]. And David my servant will be prince for them forever.
translation:
  language: de
  text: Sie werden in dem Land wohnen, das ich meinem Diener Jakob gegeben habe, in dem eure Väter wohnten. Sie werden darin wohnen, sie selbst, ihre Söhne und die Söhne ihrer Söhne, für immer. Und David, mein Diener, wird für immer ihr Fürst[a] sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Anführer« oder »Herrscher«. Das hebräische Wort lautet »Fürst«, nicht »König«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »David« kann der verheißene davidische Herrscher gemeint sein. Der Text legt nicht fest, ob der historische David selbst oder eine künftige Gestalt aus seiner Linie gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשְׁבוּ עַל הָאָרֶץ
  choice: Sie werden in dem Land wohnen
  rationale: Bei ישׁב mit אֶרֶץ ist „in dem Land wohnen“ im Deutschen idiomatisch; das territoriale Moment von עַל bleibt im Zusammenhang erhalten.
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: das ich meinem Diener Jakob gegeben habe
  rationale: Das Perfekt wird als abgeschlossene, für die Gegenwart relevante Landgabe wiedergegeben; „mein Diener Jakob“ bewahrt die Bundesbezeichnung.
- source_word: אֲשֶׁר יָשְׁבוּ בָהּ אֲבוֹתֵיכֶם
  choice: in dem eure Väter wohnten
  rationale: „Väter“ bildet das ausdrücklich maskuline אֲבוֹתֵיכֶם formal ab; der Relativsatz wird natürlich an „Land“ angeschlossen.
- source_word: וְיָשְׁבוּ עָלֶיהָ
  choice: Sie werden darin wohnen
  rationale: Das feminine Pronomen verweist auf das Land. „Darin“ ist im modernen Deutschen natürlicher als das formal mögliche „darauf“ und bewahrt die Wiederholung von „wohnen“.
- source_word: הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: sie selbst, ihre Söhne und die Söhne ihrer Söhne
  rationale: Die emphatische Form הֵמָּה wird mit „sie selbst“ erkennbar gemacht; die wörtliche Generationenfolge „Söhne“ und „Söhne ihrer Söhne“ bleibt erhalten.
- source_word: עַד עוֹלָם / לְעוֹלָם
  choice: für immer
  rationale: Die Formulierung gibt an beiden Stellen die dauerhafte, unabsehbare Geltung wieder und bewahrt die Wiederholung.
- source_word: וְדָוִד עַבְדִּי
  choice: Und David, mein Diener
  rationale: Der Name bleibt ohne christologische oder historische Ausdeutung stehen; die Apposition ist im Deutschen durch Kommas klar gekennzeichnet.
- source_word: נָשִׂיא
  choice: Fürst
  rationale: „Fürst“ wahrt die Unterscheidung vom hebräischen Königstitel מֶלֶךְ und bezeichnet einen Herrscher, ohne „König“ einzutragen.
- source_word: לָהֶם
  choice: ihr Fürst
  rationale: Die deutsche possessive Fügung drückt die relationale Zuordnung der ל-Präposition natürlich aus, ohne das im Hebräischen nicht stehende עַל ausdrücklich als „über sie“ einzutragen.
theological_decisions:
- issue: Identität von „David, mein Diener“
  choice: Der Name „David“ bleibt im Haupttext ohne interpretierende Erweiterung stehen.
  alternative: der wiederhergestellte historische David; ein künftiger davidischer Herrscher; der Messias als davidischer König
  rationale: Der hebräische Text entscheidet nicht ausdrücklich zwischen diesen Deutungen. Die Übersetzung bewahrt diese Spannung; eine Fußnote nennt die wesentliche Alternative, ohne sie festzulegen.
- issue: Wiedergabe von אֲבוֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Die formal maskuline Ausgangsform wird transparent wiedergegeben, ohne ihren möglichen weiteren Bezug im Haupttext festzulegen.
- issue: Wiedergabe von נָשִׂיא
  choice: Fürst
  alternative: Anführer; Herrscher
  rationale: „Fürst“ bewahrt die terminologische Abgrenzung zu „König“ und lässt Rang und genaue politische Ausgestaltung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Aufbau, wird aber für natürliche Lesbarkeit in zwei Hauptsätze gegliedert. Wiederholungen von „wohnen“ und „für immer“ bleiben als rhetorische Merkmale erhalten.
