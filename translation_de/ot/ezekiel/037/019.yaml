  source_fidelity: 'Die Zeichenhandlung, die wiederkehrende Hand-Metaphorik und die Einheit zu einem Holzstab sind grundsätzlich treffend wiedergegeben. In der Wiedergabe von וְנָתַתִּי אוֹתָם עָלָיו אֶת־עֵץ יְהוּדָה ist jedoch „zu ihm, zum Holzstab Judas“ syntaktisch missverständlich: Es kann den Holzstab Josefs mit dem Holzstab Judas gleichsetzen. Die markierte, schwierige hebräische Bezugnahme lässt sich genauer als kataphorisches „darauf, auf den Holzstab Judas“ wiedergeben.'
