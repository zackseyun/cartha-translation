revisions:
- from: 'Sag zu ihnen: So spricht der Herr Yahweh: Seht, ich nehme den Holzstab Josefs, der in der Hand Ephraims ist, samt den Stämmen Israels, die mit ihm verbunden sind.[a] Ich lege sie zu ihm, zum Holzstab Judas,[b] und mache sie zu einem einzigen Holzstab; sie werden eins sein in meiner Hand.'
  to: 'Sag zu ihnen: So spricht Yahweh, der Herr: Seht, ich nehme den Holzstab Josefs, der in der Hand Ephraims ist, samt den Stämmen Israels, die mit ihm verbunden sind.[a] Ich lege sie darauf, auf den Holzstab Judas,[b] und mache sie zu einem einzigen Holzstab; sie werden eins sein in meiner Hand.'
  rationale: Die Revision beseitigt eine deutsche Mehrdeutigkeit, die die beiden symbolischen Holzstäbe ungewollt identifizieren könnte, und bewahrt zugleich die schwierige Abfolge des hebräischen Satzes. Die Gottesbezeichnung wird in idiomatischer deutscher Wortstellung wiedergegeben, ohne den Gottesnamen zu ersetzen. Die Fußnotenanker und ihre Reihenfolge bleiben unverändert.
