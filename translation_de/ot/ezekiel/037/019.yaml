source:
  edition: WLC
  text: דַּבֵּ֣ר אֲלֵ/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י לֹקֵ֜חַ אֶת עֵ֤ץ יוֹסֵף֙ אֲשֶׁ֣ר בְּ/יַד אֶפְרַ֔יִם וְ/שִׁבְטֵ֥י יִשְׂרָאֵ֖ל חבר/ו וְ/נָתַתִּי֩ אוֹתָ֨/ם עָלָ֜י/ו אֶת עֵ֣ץ יְהוּדָ֗ה וַֽ/עֲשִׂיתִ/ם֙ לְ/עֵ֣ץ אֶחָ֔ד וְ/הָי֥וּ אֶחָ֖ד בְּ/יָדִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/019.yaml
  text: 'tell them[a], ‘Thus says the Lord GOD: Behold, I am taking the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and I will place them with it, with the stick of Judah, and make them one stick[b], and they will be one in my hand.’'
translation:
  language: de
  text: 'Sag zu ihnen: So spricht Yahweh, der Herr: Seht, ich nehme den Holzstab Josefs, der in der Hand Ephraims ist, samt den Stämmen Israels, die mit ihm verbunden sind.[a] Ich lege sie darauf, auf den Holzstab Judas,[b] und mache sie zu einem einzigen Holzstab; sie werden eins sein in meiner Hand.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die ihm zugehörigen Stämme Israels“ oder „die mit ihm vereinten Stämme Israels“. Die schwierige hebräische Form bezeichnet wahrscheinlich die mit Josef beziehungsweise Ephraim verbundenen Stämme.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Ich lege sie auf ihn, den Holzstab Judas.“ Die hebräische Satzfügung und die Bezüge der Fürwörter sind ungewöhnlich. Der Wortlaut beschreibt das Zusammenfügen der symbolischen Holzstäbe.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: דַּבֵּר אֲלֵהֶם
  choice: Sag zu ihnen
  rationale: Der Imperativ mit אֶל leitet die direkte prophetische Mitteilung ein; die Formulierung ist klar und bewahrt den Befehlscharakter.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahweh
  rationale: Die traditionelle Botenformel wird würdig und knapp wiedergegeben; Yahweh gibt den im hebräischen Text stehenden Gottesnamen ausdrücklich wieder.
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: Seht, ich nehme
  rationale: הִנֵּה lenkt feierlich die Aufmerksamkeit auf das unmittelbar dargestellte Handeln; das Partizip לֹקֵחַ erhält dabei lebendige Gegenwartsbedeutung.
- source_word: עֵץ
  choice: Holzstab
  rationale: Im Zusammenhang der Zeichenhandlung bezeichnet עֵץ ein handhabbares Stück Holz. „Holzstab“ ist eindeutiger als „Holz“ und vermeidet die naheliegende Bedeutung „Baum“.
- source_word: אֲשֶׁר בְּיַד אֶפְרַיִם
  choice: der in der Hand Ephraims ist
  rationale: Die konkrete Hand-Metaphorik bleibt erhalten und nimmt zugleich den Schluss des Verses vorweg, wo beide Teile in Gottes Hand eins sind.
- source_word: וְשִׁבְטֵי יִשְׂרָאֵל חברו
  choice: samt den Stämmen Israels, die mit ihm verbunden sind
  rationale: Die schwierige Form חברו wird relational von חבר, „sich verbinden/verbunden sein“, verstanden. „Mit ihm verbunden“ lässt offen, ob politische Zugehörigkeit oder bildhafte Verbindung gemeint ist.
- source_word: וְנָתַתִּי אוֹתָם עָלָיו אֶת עֵץ יְהוּדָה
  choice: Ich lege sie zu ihm, zum Holzstab Judas
  rationale: Die ungewöhnliche hebräische Konstruktion und ihre Pronomenbezüge werden nicht vollständig geglättet. „Zu ihm“ gibt die räumliche Verbindung wieder; die nachgestellte Nennung des Holzstabs Judas folgt der markierten Quelltextsyntax.
- source_word: וַעֲשִׂיתִם לְעֵץ אֶחָד
  choice: und mache sie zu einem einzigen Holzstab
  rationale: עשה mit ל bezeichnet hier das Machen zu etwas; „einzigen“ verdeutlicht die im Zeichen dargestellte Einheit, ohne die Mehrzahl der zuvor genannten Teile zu beseitigen.
- source_word: וְהָיוּ אֶחָד בְּיָדִי
  choice: sie werden eins sein in meiner Hand
  rationale: Das singularische Prädikat אֶחָד wird mit „eins“ bewahrt; zugleich bleibt der bewusste Gegensatz zwischen Ephraims Hand und Gottes Hand sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die Übersetzung nennt den im Ausgangstext ausdrücklich verwendeten Bundesnamen und unterscheidet zugleich אֲדֹנָי als Titel „Herr“ davon.
- issue: Art der dargestellten Einheit
  choice: zu einem einzigen Holzstab; sie werden eins sein
  alternative: zu einem vereinigten Volk
  rationale: Der Vers selbst beschreibt zunächst die symbolische Zeichenhandlung. Ihre nationale und theologische Deutung wird nicht vorwegnehmend in den Wortlaut eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel und Hand-Metaphorik. „Holzstab“ hält das Zeichenobjekt anschaulich; die schwierige Syntax des Verbindungsvorgangs wird im Haupttext lesbar gemacht, aber durch die Fußnote nicht als eindeutig ausgegeben.
