  terminology: Josef, Ephraim, Juda und Israel sind korrekt. „Yahweh, der Herr“ wahrt die Unterscheidung von אֲדֹנָי und יהוה ohne die im Deutschen schwerfällige Formulierung „der Herr Yahweh“. Die Fußnoten sollten die unsichere syntaktische Verknüpfung erläutern, ohne die symbolische Vereinigung als bloße Deutung an die Stelle des Wortlauts zu setzen.
