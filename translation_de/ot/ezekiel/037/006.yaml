source:
  edition: WLC
  text: וְ/נָתַתִּי֩ עֲלֵי/כֶ֨ם גִּדִ֜ים וְֽ/הַעֲלֵתִ֧י עֲלֵי/כֶ֣ם בָּשָׂ֗ר וְ/קָרַמְתִּ֤י עֲלֵי/כֶם֙ ע֔וֹר וְ/נָתַתִּ֥י בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶ֑ם וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/006.yaml
  text: I will put sinews on you[a], and I will bring flesh up over you, and I will cover you with skin, and I will put breath in you, and you will live. Then you will know that I am Yahweh.
translation:
  language: de
  text: Ich werde euch Sehnen anlegen, Fleisch über euch wachsen lassen und euch mit Haut überziehen. Ich werde euch Atem[a] einhauchen, und ihr werdet leben. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Geist“ oder „Wind“. Das hebräische Wort רוּחַ kann alle drei Bedeutungen haben; Hesekiel 37 spielt mit diesem Bedeutungsspektrum.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדִים
  choice: Sehnen
  rationale: Die Bezeichnung meint hier das verbindende Gewebe an den Knochen. „Sehnen“ ist im Deutschen verständlich, anatomisch passend und weniger eng als eine stärker spezialisierte Wiedergabe.
- source_word: וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר
  choice: lasse Fleisch über euch wachsen
  rationale: Die kausative Form von עלה beschreibt, wie Fleisch über den Knochen hervorkommt. Die Wiedergabe erhält die schrittweise, anschauliche Wiederherstellung und klingt zugleich natürlich.
- source_word: וְקָרַמְתִּי עֲלֵיכֶם עוֹר
  choice: überziehe euch mit Haut
  rationale: Das Verb bezeichnet ein Bedecken oder Überziehen. Die Formulierung bildet den Abschluss der körperlichen Wiederherstellung klar ab.
- source_word: רוּחַ
  choice: Atem
  rationale: Auf die Gabe von רוּחַ folgt unmittelbar das Leben; daher passt „Atem“ im örtlichen Zusammenhang am besten. Die Bedeutungen „Geist“ und „Wind“ bleiben wegen des Wortspiels im Kapitel in der Fußnote erhalten.
- source_word: וִחְיִיתֶם
  choice: ihr werdet leben
  rationale: Die knappe Ergebnisformulierung entspricht unmittelbar dem Hebräischen und vermeidet eine unnötige Ausdeutung.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Dann werdet ihr erkennen, dass ich Jahwe bin
  rationale: „Dann“ verdeutlicht die Folge der zuvor angekündigten Wiederherstellung. „Erkennen“ gibt ידע in der feierlichen Erkenntnisformel angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Umschrift gibt den Eigennamen als solchen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Mehrdeutigkeit von רוּחַ zwischen Atem, Geist und Wind
  choice: Atem
  alternative: Geist oder Wind
  rationale: Die unmittelbare Abfolge von Körperbildung, רוּחַ und Leben legt hier „Atem“ nahe. Da das gesamte Kapitel bewusst mit allen drei Bedeutungsbereichen arbeitet, werden die anderen Möglichkeiten nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Abfolge der Wiederherstellung bleibt erhalten; kurze Hauptsätze bewahren den prophetischen Rhythmus. Der Gottesname wird als „Jahwe“ wiedergegeben.
