source:
  edition: WLC
  text: וְ/כַֽ/אֲשֶׁר֙ יֹאמְר֣וּ אֵלֶ֔י/ךָ בְּנֵ֥י עַמְּ/ךָ֖ לֵ/אמֹ֑ר הֲ/לֽוֹא תַגִּ֥יד לָ֖/נוּ מָה אֵ֥לֶּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/018.yaml
  text: And when the sons of your people say to you[a], ‘Will you not tell us what these things are to you?’
translation:
  language: de
  text: 'Und wenn die Angehörigen deines Volkes zu dir sagen: »Willst du uns nicht erklären, was diese Dinge für dich bedeuten?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכַאֲשֶׁר
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Geschehen als auch den zeitlichen Sinn.
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: zu dir sagen
  rationale: Gibt das gewöhnliche Verb אָמַר textnah wieder; der folgende Wortlaut macht den Fragecharakter deutlich.
- source_word: בְּנֵי עַמְּךָ
  choice: die Angehörigen deines Volkes
  rationale: Die hebräische Wendung lautet formal »Söhne deines Volkes«, bezeichnet hier aber Mitglieder des Volkes. »Angehörige« ist im Deutschen natürlich und vermeidet die irreführende Einschränkung auf leibliche Söhne oder ausschließlich männliche Personen.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt und die direkte Rede wiedergegeben
  rationale: Der Infinitiv dient als Redeeinleitung; ein zusätzliches »indem sie sagen« wäre im modernen Deutschen unnötig schwerfällig.
- source_word: הֲלוֹא
  choice: Willst du … nicht
  rationale: Die Formulierung wahrt die erwartungsvolle, rhetorische Kraft der hebräischen Frage.
- source_word: תַגִּיד לָנוּ
  choice: uns erklären
  rationale: Das Hifil von נגד bedeutet »mitteilen, kundtun«. Im Zusammenhang erbitten die Leute die Deutung der Zeichenhandlung; »erklären« bringt dies in natürlichem Deutsch zum Ausdruck.
- source_word: מָה אֵלֶּה לָּךְ
  choice: was diese Dinge für dich bedeuten
  rationale: Wörtlich lautet die knappe hebräische Wendung »was diese für dich [sind]«. Im Kontext fragt sie nach der Bedeutung der von Ezechiel vollzogenen Zeichenhandlung; die gewählte Fassung gibt diesen idiomatischen Sinn verständlich wieder, ohne den Inhalt der Deutung vorwegzunehmen.
theological_decisions:
- issue: Bedeutung der Zeichenhandlung
  choice: Die Frage wird als Bitte um Erklärung dessen wiedergegeben, was die Gegenstände beziehungsweise die Handlung bedeuten.
  alternative: »was diese Dinge für dich sind«
  rationale: Die elliptische hebräische Form bleibt mehrdeutig, doch der unmittelbare Kontext legt eine Frage nach der Bedeutung der symbolischen Handlung nahe. Die Übersetzung erklärt nicht bereits, worin diese Bedeutung besteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte Rede mit deutschen Anführungszeichen; klare Syntax ohne unnötigen Hebraismus.
