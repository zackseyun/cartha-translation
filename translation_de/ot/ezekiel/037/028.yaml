source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ הַ/גּוֹיִ֔ם כִּ֚י אֲנִ֣י יְהוָ֔ה מְקַדֵּ֖שׁ אֶת יִשְׂרָאֵ֑ל בִּ/הְי֧וֹת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/028.yaml
  text: Then the nations will know that I am Yahweh who sanctifies Israel[c][b][a], when my sanctuary is in their midst forever.
translation:
  language: de
  text: Dann[a] werden die Völker erkennen, dass ich Jahwe bin, der Israel heiligt[b], wenn mein Heiligtum für immer in Israels Mitte ist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Völker werden erkennen.“ Die hebräische Konjunktion kann schlicht „und“ bedeuten; hier bezeichnet sie wahrscheinlich eine Folge der vorhergehenden Verheißungen der Wiederherstellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heilig macht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in ihrer Mitte“; gemeint ist Israel. Oder: „unter Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Dann werden … erkennen
  rationale: Das Präfix וְ kann schlicht mit „und“ wiedergegeben werden; im Zusammenhang drückt es wahrscheinlich die Folge der zuvor angekündigten Wiederherstellung aus. Das prophetische Perfekt wird zukunftsbezogen übersetzt.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die Völker außerhalb Israels. „Völker“ ist im Deutschen die natürliche und kontextgemäße Wiedergabe.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Die Formulierung bewahrt die für Ezechiel typische Erkenntnisformel und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: מְקַדֵּשׁ
  choice: der … heiligt
  rationale: Das Partizip beschreibt Jahwes kennzeichnendes Handeln an Israel. „Heiligt“ wahrt die Verbindung zwischen Gottes Heiligung Israels und seinem Heiligtum.
- source_word: בִּהְיוֹת מִקְדָּשִׁי
  choice: wenn mein Heiligtum … ist
  rationale: Der Infinitiv mit בְּ bezeichnet hier den zeitlichen beziehungsweise begleitenden Umstand. „Heiligtum“ bleibt weiter gefasst als „Tempel“.
- source_word: בְּתוֹכָם
  choice: in ihrer Mitte
  rationale: Die Wendung bezeichnet Gottes räumliche und gemeinschaftliche Gegenwart mitten unter seinem Volk.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Im Zusammenhang der dauerhaften Wiederherstellung ist dies die klare, idiomatische Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst; „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מְקַדֵּשׁ für Israel
  choice: der Israel heiligt
  alternative: der Israel heilig macht; der Israel weiht
  rationale: „Heiligt“ bewahrt die theologische und sprachliche Beziehung zum Heiligtum, ohne den Sinn auf eine rein rituelle Weihe einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der hebräischen Erkenntnisformel, bleibt aber natürlich lesbar. „Heiligtum“ und „heiligt“ erhalten die beabsichtigte Wort- und Themenverbindung.
