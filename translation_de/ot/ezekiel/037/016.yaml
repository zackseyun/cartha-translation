  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם קַח לְ/ךָ֙ עֵ֣ץ אֶחָ֔ד וּ/כְתֹ֤ב עָלָי/ו֙ לִֽ/יהוּדָ֔ה וְ/לִ/בְנֵ֥י יִשְׂרָאֵ֖ל חבר/ו וּ/לְקַח֙ עֵ֣ץ אֶחָ֔ד וּ/כְת֣וֹב עָלָ֗י/ו לְ/יוֹסֵף֙ עֵ֣ץ אֶפְרַ֔יִם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל חבר/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/016.yaml
  text: And you[a], son of man, take for yourself one stick and write on it, ‘For Judah and for the sons of Israel, his companions.’ Then take one stick and write on it, ‘For Joseph, the stick of Ephraim, and all the house of Israel[c][b], his companions.’
translation:
  language: de
  text: 'Du aber, Menschensohn, nimm dir ein Stück Holz[a] und schreibe darauf: »Für Juda und für die Israeliten[b], die mit ihm verbunden sind[c].« Dann nimm noch ein Stück Holz und schreibe darauf: »Für Josef – das Holz Ephraims – und für das ganze Haus Israel, seine Verbundenen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Stab«. Möglich ist auch: »eine Holztafel«; diese Wiedergabe legt die Form des Gegenstands jedoch stärker fest.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Söhne Israels«; traditionell auch: »die Kinder Israels«.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »seine Gefährten«, »seine Verbündeten« oder »die ihm Zugeordneten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה בֶן־אָדָם
  choice: Du aber, Menschensohn
  rationale: Das ausdrücklich gesetzte Pronomen wird mit »du aber« hervorgehoben. »Menschensohn« bewahrt Hesekiels wiederkehrende prophetische Anrede und ist im Deutschen verständlich und würdevoll.
- source_word: קַח־לְךָ
  choice: nimm dir
  rationale: Das ethische beziehungsweise reflexive לְךָ wird knapp und natürlich durch »dir« wiedergegeben.
- source_word: עֵץ אֶחָד
  choice: ein Stück Holz
  rationale: עֵץ bezeichnet hier einen beschreibbaren hölzernen Gegenstand. »Stück Holz« wahrt die gegenständliche Unbestimmtheit besser als das zu spezielle »Holztafel«; »Stab« bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: וּכְתֹב עָלָיו
  choice: und schreibe darauf
  rationale: Die Formulierung gibt den konkreten Zeichenakt klar und unmittelbar wieder.
- source_word: לִיהוּדָה / לְיוֹסֵף
  choice: Für Juda / Für Josef
  rationale: Die Präposition ל wird als Wortlaut der jeweiligen Aufschrift verstanden und entsprechend mit »für« wiedergegeben.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung vermittelt die gemeinte Zugehörigkeit zu Israel natürlich; die wörtliche Form »Söhne Israels« wird in einer Fußnote dokumentiert.
- source_word: חֲבֵרָיו
  choice: die mit ihm verbunden sind
  rationale: Die Umschreibung bewahrt sowohl die Zugehörigkeits- beziehungsweise Verbindungsbedeutung des Nomens als auch den maskulinen Singularbezug des Suffixes »mit ihm«, ohne diesen als bloße Geselligkeit misszuverstehen.
- source_word: עֵץ אֶפְרַיִם
  choice: das Holz Ephraims
  rationale: Die Genitivverbindung bleibt unmittelbar erhalten und kennzeichnet den für Josef bestimmten Gegenstand näher durch Ephraim.
- source_word: כָּל־בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Die feste prophetische Wendung »Haus Israel« bleibt erhalten; כָּל wird idiomatisch mit »das ganze« wiedergegeben.
theological_decisions:
- issue: Darstellung der beiden geteilten israelitischen Gruppierungen im Zeichenakt
  choice: Juda wird der Gruppierung Josef/Ephraim gegenübergestellt; die Bezeichnungen und ihre jeweiligen Verbündeten bleiben sprachlich unterschieden.
  alternative: Alle Bezeichnungen zu zwei allgemein formulierten Gruppen von Israeliten zusammenzufassen oder Josef und Ephraim als bloße Wiederholung zu glätten.
  rationale: Der hebräische Text nennt bewusst Juda einerseits und Josef beziehungsweise Ephraim andererseits. Die Übersetzung erhält diese geschichtlich und prophetisch bedeutsame Gegenüberstellung, ohne eine spätere konfessionelle Deutung in den Vers einzutragen.
- issue: Bezugswort des singularischen Suffixes in חֲבֵרָיו
  choice: Das »ihm« wird im ersten Satz auf Juda und im zweiten auf Josef beziehungsweise den durch Ephraim bezeichneten Stammesverband bezogen.
  alternative: Den Singular zu einem unbestimmten Plural zu glätten oder ausdrücklich auf den hölzernen Gegenstand zu beziehen.
  rationale: Das maskuline Singularsuffix ist im Ausgangstext auffällig und sollte sichtbar bleiben. Zugleich lässt die Formulierung den genauen Umfang der jeweils verbundenen Gruppen offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Inschriften sind typografisch als direkte Aufschriften markiert. »Dann« und »ein zweites Stück Holz« machen die Abfolge im Deutschen klar; »zweites« gibt dabei den im Kontext eindeutig wiederholten Gegenstand idiomatisch wieder, ohne eine zusätzliche theologische Aussage einzuführen.
