  to: 'Du aber, Menschensohn, nimm dir ein Stück Holz[a] und schreibe darauf: »Für Juda und für die Israeliten[b], die mit ihm verbunden sind[c].« Dann nimm noch ein Stück Holz und schreibe darauf: »Für Josef – das Holz Ephraims – und für das ganze Haus Israel, seine Verbundenen[c].«'
