source:
  edition: WLC
  text: וְ/נָתַתִּ֨י רוּחִ֤/י בָ/כֶם֙ וִ/חְיִיתֶ֔ם וְ/הִנַּחְתִּ֥י אֶתְ/כֶ֖ם עַל אַדְמַתְ/כֶ֑ם וִ/ידַעְתֶּ֞ם כִּי אֲנִ֧י יְהוָ֛ה דִּבַּ֥רְתִּי וְ/עָשִׂ֖יתִי נְאֻם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/014.yaml
  text: I will put my Spirit within you[a], and you will live, and I will settle you on your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
translation:
  language: de
  text: 'Ich werde meinen Geist in euch geben[a], und ihr werdet leben. Ich werde euch auf eurem eigenen Land ansiedeln. Dann werdet ihr erkennen: Ich, Yahweh, habe gesprochen und es getan – Ausspruch Yahwehs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meinen Atem«; das hebräische Wort kann auch »Wind« bedeuten. In Hesekiel 37 klingt dieses Bedeutungsspektrum bewusst an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: meinen Geist
  rationale: רוּחַ kann »Geist«, »Atem« oder »Wind« bedeuten. Der Gottesbezug durch das Suffix der 1. Person Singular stützt hier »meinen Geist«; eine Fußnote bewahrt zugleich das im Kapitel beabsichtigte Bedeutungsspiel.
- source_word: וִחְיִיתֶם
  choice: ihr werdet leben
  rationale: Die schlichte Wiedergabe wahrt sowohl das unmittelbare Bild des Lebendigwerdens als auch die weiter gefasste Verheißung der Wiederherstellung.
- source_word: וְהִנַּחְתִּי אֶתְכֶם עַל אַדְמַתְכֶם
  choice: Ich werde euch auf eurem eigenen Land zur Ruhe kommen lassen
  rationale: Die Kausativform bezeichnet ein Zur-Ruhe-Bringen, Niederlassen oder Ansiedeln. Die gewählte Formulierung erhält die Nuance der Ruhe, ohne den Wiederherstellungskontext zu verdecken.
- source_word: אַדְמַתְכֶם
  choice: eurem eigenen Land
  rationale: אֲדָמָה kann Boden, Grund oder Land bezeichnen; hier meint es im Wiederherstellungskontext das Land des Volkes. »eigenen« gibt das Possessivsuffix idiomatisch wieder.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Dann werdet ihr erkennen, dass ich, Yahweh, ...
  rationale: »Dann« macht die resultative Abfolge im Deutschen natürlich deutlich. Die Konstruktion mit eingeschobenem Gottesnamen führt grammatisch in die anschließende Aussage über Reden und Handeln weiter.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: geredet und es getan habe
  rationale: Die Perfektformen stellen Gottes Reden und Handeln als gewiss und vollendet dar. Das deutsche Perfekt im abhängigen Satz gibt dies natürlich wieder; »es« ergänzt das im Hebräischen nicht ausdrücklich genannte Objekt.
- source_word: נְאֻם יְהוָה
  choice: so spricht Yahweh
  rationale: Dies ist eine natürliche, würdige deutsche Wiedergabe der prophetischen Botenformel.
theological_decisions:
- issue: Ob רוּחִי als »mein Atem« oder »mein Geist« wiederzugeben ist
  choice: meinen Geist
  alternative: meinen Atem; meinen Lebenshauch
  rationale: Das gesamte Kapitel nutzt bewusst das Bedeutungsspektrum von רוּחַ. »meinen Geist« trägt dem göttlichen Geber und dem Wiederherstellungskontext Rechnung; die Fußnote hält die echte lexikalische Mehrdeutigkeit offen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der persönliche Gottesname wird als »Yahweh« transliteriert statt durch einen Titel ersetzt.
- issue: Aspekt der prophetischen Perfektformen in דִּבַּרְתִּי וְעָשִׂיתִי
  choice: als gewiss vollendetes Reden und Tun
  alternative: 'futurisch-resultativ: »ich werde es tun«'
  rationale: Die hebräischen Perfektformen dürfen nicht stillschweigend in ein bloßes Futur umgedeutet werden. Die deutsche Perfektform bewahrt die Spannung zwischen angekündigter Wiederherstellung und ihrer durch Gottes Wort verbürgten Vollendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zur Ruhe kommen lassen« bewahrt gegenüber dem glatteren »ansiedeln« eine wichtige Nuance des hebräischen Verbs. Die Zeichensetzung verbindet »dass ich, Yahweh« mit den beiden folgenden Perfektformen und vermeidet einen unnatürlichen deutschen Satzabbruch.
