  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge von Gabe des göttlichen רוּחַ, Leben, Wiederansiedlung und Erkenntnis grundsätzlich zutreffend wieder. Die Schlussklausel sollte jedoch die hebräische Selbstbekräftigung klarer abbilden: אָנִי יְהוָה ist mit den anschließenden Perfektformen verbunden, nicht bloß ein eingeschobener Name in einem deutschen dass-Satz.'
  naturalness: „Zur Ruhe kommen lassen“ ist in diesem transitiven Zusammenhang weniger idiomatisch und kann ein bloßes Erlauben statt Gottes bewirkendes Niederlassen nahelegen. „Ansiedeln“ ist modernes Standarddeutsch und gibt die restaurative Ortsbestimmung natürlich wieder. Die Schlussformel wird mit Doppelpunkt und „Ausspruch Yahwehs“ klar und würdig.
  terminology: „Geist“, „Yahweh“ und „eigenes Land“ sind angemessen. Die Fußnote bewahrt die relevante Bedeutungsweite von רוּחַ; „Lebenshauch“ ist als mögliche deutsche Umschreibung vertretbar, aber „Atem“ ist die nähere lexikalische Alternative.
  issues:
  - severity: medium
    issue: Die Wiedergabe „auf eurem eigenen Land zur Ruhe kommen lassen“ ist semantisch und idiomatisch nicht optimal.
    rationale: וְהִנַּחְתִּי bezeichnet Gottes bewirkendes Niederlassen bzw. Ansiedeln auf dem Land. Die deutsche Formulierung kann eher bedeuten, er lasse sie lediglich zur Ruhe kommen. „Ansiedeln“ gibt Handlung und Wiederherstellungskontext direkt wieder.
  - severity: low
    issue: „so spricht Yahweh“ gibt die abschließende Formel נְאֻם יְהוָה nicht präzise wieder.
    rationale: Die Formel ist ein nominaler prophetischer Bekräftigungsausdruck, nicht primär eine Präsensredeeinleitung. „Ausspruch Yahwehs“ bewahrt Form und Nachdruck besser.
  - severity: low
    issue: Der eingeschobene Name in „dass ich, Yahweh, geredet und es getan habe“ ist im Deutschen schwerfällig.
    rationale: Ein Doppelpunkt nach „Dann werdet ihr erkennen“ bildet die hebräische Selbstdeklaration klarer und natürlicher ab, ohne eine theologisch spezifizierende Kopula ergänzen zu müssen.
  revised_text: 'Ich werde meinen Geist in euch geben[a], und ihr werdet leben. Ich werde euch auf eurem eigenen Land ansiedeln. Dann werdet ihr erkennen: Ich, Yahweh, habe gesprochen und es getan – Ausspruch Yahwehs.'
