  text: וְ/הִנַּבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צִוָּ֑/נִי וַ/תָּבוֹא֩ בָ/הֶ֨ם הָ/ר֜וּחַ וַ/יִּֽחְי֗וּ וַ/יַּֽעַמְדוּ֙ עַל רַגְלֵי/הֶ֔ם חַ֖יִל גָּד֥וֹל מְאֹד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/010.yaml
  text: So I prophesied as he commanded me[a], and the breath entered into them, and they lived and stood on their feet, an exceedingly great army.
translation:
  language: de
  text: Da weissagte ich, wie er mir geboten hatte, und der Atem[a] kam in sie. Sie wurden lebendig und stellten sich auf die Füße – ein überaus großes Heer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Geist«. Das hebräische Wort רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנַּבֵּאתִי
  choice: ich weissagte
  rationale: Das Hitpael von נבא bezeichnet hier Ezechiels prophetisches Reden gemäß dem empfangenen Befehl; „weissagte“ ist knapp und entspricht dem wiederkehrenden Ausdruck im Kontext.
- source_word: כַּאֲשֶׁר צִוָּנִי
  choice: wie er mir geboten hatte
  rationale: Die Formulierung gibt Vergleichspartikel und Verb direkt wieder. Das im Hebräischen nur aus dem Kontext erschließbare Subjekt bleibt als „er“ stehen, statt ausdrücklich „der HERR“ einzufügen.
- source_word: וַתָּבוֹא בָהֶם
  choice: kam in sie
  rationale: בוא mit ב bezeichnet das Hineinkommen. Die deutsche Wendung bewahrt das Bewegungsbild und klingt in diesem Zusammenhang natürlich.
- source_word: הָרוּחַ
  choice: der Atem
  rationale: רוּחַ kann „Atem“, „Wind“ oder „Geist“ bedeuten. Hier belebt er die Toten, weshalb „Atem“ im Haupttext naheliegt; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: וַיִּחְיוּ
  choice: sie wurden lebendig
  rationale: Das Qal von חיה bezeichnet hier den Übergang zum Leben. „Wurden lebendig“ ist im Deutschen natürlicher und präziser als das missverständliche „sie lebten“.
- source_word: וַיַּעַמְדוּ עַל רַגְלֵיהֶם
  choice: stellten sich auf ihre Füße
  rationale: Die Wendung bildet das konkrete Aufstehen und Stehen auf den eigenen Füßen anschaulich ab, ohne das Bild zu glätten.
- source_word: חַיִל
  choice: Heer
  rationale: חַיִל bezeichnet hier eine große, geordnete Streitmacht. „Heer“ ist im Deutschen würdig, konkret und für die visionäre Szene passend.
- source_word: גָּדוֹל מְאֹד מְאֹד
  choice: überaus groß
  rationale: Das doppelte מְאֹד verstärkt das Adjektiv außerordentlich. „Überaus groß“ gibt diese starke Intensivierung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Mehrdeutigkeit von רוּחַ in der Vision
  choice: der Atem
  alternative: der Geist; der Wind
  rationale: In der unmittelbaren Handlung kommt die belebende Lebenskraft in die Getöteten, daher steht „Atem“ im Haupttext. Zugleich spielt der Abschnitt bewusst mit den Bedeutungen Atem, Wind und Geist; die Fußnote bewahrt diese theologische und literarische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der dynamischen Abfolge des Hebräischen; der Gedankenstrich markiert die abschließende, eindrucksvolle Identifikation als Heer.
