source:
  edition: WLC
  text: וְ/עַבְדִּ֤/י דָוִד֙ מֶ֣לֶךְ עֲלֵי/הֶ֔ם וְ/רוֹעֶ֥ה אֶחָ֖ד יִהְיֶ֣ה לְ/כֻלָּ֑/ם וּ/בְ/מִשְׁפָּטַ֣/י יֵלֵ֔כוּ וְ/חֻקֹּתַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֥וּ אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/024.yaml
  text: My servant David will be king over them[a], and there will be one shepherd for all of them. They will walk in my judgments[b], and they will keep my statutes and do them.
translation:
  language: de
  text: Mein Knecht David wird König über sie sein[a], und für sie alle wird es einen einzigen Hirten geben.[b] Sie werden nach meinen Rechtsbestimmungen leben, meine Satzungen halten und sie befolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »David« kann den historischen David, einen künftigen Herrscher aus Davids Linie oder typologisch den Messias bezeichnen. Die Übersetzung lässt die Deutung offen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und er wird für sie alle der eine Hirte sein.« Die hebräische Formulierung kann die Hirtenaussage unmittelbar auf David beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: mein Knecht
  rationale: עֶבֶד kann »Knecht«, »Diener« oder »Sklave« bedeuten. Hier ist es die ehrenvolle Bundes- und Königsbezeichnung Davids; »mein Knecht« bewahrt diesen etablierten biblischen Sinn und die possessive Beziehung.
- source_word: דָוִד
  choice: David
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben, ohne seine Identität auszudeuten.
- source_word: מֶלֶךְ עֲלֵיהֶם
  choice: wird König über sie sein
  rationale: מֶלֶךְ bezeichnet ausdrücklich einen König; עַל mit Suffix bezeichnet seine Herrschaft über sie.
- source_word: וְרֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  choice: und für sie alle wird es einen einzigen Hirten geben
  rationale: »Hirte« erhält das königlich-pastorale Bild. Die unpersönliche deutsche Konstruktion gibt die hebräische Prädikatskonstruktion natürlich wieder und betont die eine gemeinsame Leitung; die mögliche direkte Rückbeziehung auf David wird in einer Fußnote erhalten.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּט bezeichnet hier Gottes verbindliche rechtliche Ordnungen. »Rechtsbestimmungen« ist im modernen Deutsch verständlicher als »Rechtssprüche« und wahrt die juristische Nuance.
- source_word: יֵלֵכוּ
  choice: werden … leben
  rationale: הלך wird hier bildlich für Lebensführung und Verhalten gebraucht. Die deutsche Wendung »nach … leben« vermittelt dieses Idiom natürlich, ohne den ethischen Sinn abzuschwächen.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקּוֹת bezeichnet festgesetzte Vorschriften. »Satzungen« wahrt den gesetzlich-bundestheologischen Ton und unterscheidet den Ausdruck von מִשְׁפָּטַי.
- source_word: יִשְׁמְרוּ
  choice: halten
  rationale: שׁמר bedeutet in Gesetzeskontexten, Vorschriften zu beachten beziehungsweise einzuhalten; »halten« ist knapp und entspricht dem gehobenen biblischen Register.
- source_word: וְעָשׂוּ אוֹתָם
  choice: und sie befolgen
  rationale: עשה mit dem Objektpronomen fordert die praktische Ausführung der Satzungen. »Sie befolgen« ist natürliches modernes Deutsch und erhält den Handlungsaspekt.
theological_decisions:
- issue: Identität Davids in der Wiederherstellungsweissagung
  choice: »David« bleibt im Haupttext ohne deutende Erweiterung stehen.
  alternative: Gemeint sein könnten der wiederkehrende historische David, ein künftiger davidischer Herrscher beziehungsweise Nachkomme oder typologisch der Messias als davidischer Hirtenkönig.
  rationale: Der hebräische Text nennt schlicht David. Die Übersetzung entscheidet die historische, dynastische oder messianische Deutung nicht vorweg und bewahrt so die theologische Spannung.
- issue: Bezug des einen Hirten auf David
  choice: Die Hauptfassung formuliert die Hirtenaussage als Existenzsatz.
  alternative: 'Das Subjekt kann unmittelbar David sein: »und er wird für sie alle der eine Hirte sein«.'
  rationale: Im Hebräischen kann die zweite Aussage als eigenständige Prädikatskonstruktion oder in direktem Bezug auf David verstanden werden. Die Fußnote bewahrt die syntaktisch und theologisch bedeutsame Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll bewahrter biblischer Rechtssprache. Bildhafte und rechtlich-bundestheologische Schlüsselbegriffe bleiben erkennbar; schwerfällige hebräische Idiomatik wird dort natürlich wiedergegeben, wo eine wörtliche Form im Deutschen missverständlich oder unüblich wäre.
