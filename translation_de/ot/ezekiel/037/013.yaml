base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/013.yaml
  text: Then you will know that I am Yahweh[a], when I open your graves and bring you up from your graves[b], O my people.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich Jahwe bin, wenn ich eure Gräber öffne und euch aus euren Gräbern heraufführe[a], mein Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und euch aus euren Gräbern heraufbringe“; das hebräische Verb bedeutet wörtlich „hinaufgehen lassen“ oder „hinaufführen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem Waw bezeichnet im prophetischen Zusammenhang eine zukünftige Folge. „Dann“ macht den Folgezusammenhang deutlich; „erkennen“ gibt ידע in der geläufigen Erkenntnisformel angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: בְּפִתְחִי
  choice: wenn ich … öffne
  rationale: ב mit Infinitivus constructus und Suffix hat hier temporale Bedeutung; die deutsche Nebensatzform ist natürlich und genau.
- source_word: קִבְרוֹתֵיכֶם
  choice: eure Gräber
  rationale: קבר bezeichnet ein Grab beziehungsweise eine Begräbnisstätte. „Gräber“ bewahrt die konkrete Bildsprache.
- source_word: וּבְהַעֲלוֹתִי
  choice: und euch … heraufführe
  rationale: Der Hifil von עלה bedeutet „hinaufführen/heraufführen“ beziehungsweise „heraufbringen“. „Heraufführe“ bewahrt die konkrete, kausative Bewegung aus den Gräbern, ohne die Aussage ausdrücklich auf eine bestimmte Auferstehungslehre festzulegen.
- source_word: מִקִּבְרוֹתֵיכֶם
  choice: aus euren Gräbern
  rationale: מן bezeichnet den Ausgangspunkt; im Deutschen entspricht „aus“ der Bewegung aus den geöffneten Gräbern besonders natürlich.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die direkte Anrede bezeichnet die Angesprochenen als Gottes Volk. Die nachgestellte Form bewahrt den emphatischen Anredecharakter, ohne ein im heutigen Deutsch unnatürliches „o“ einzufügen.
theological_decisions:
- issue: Ob die Graböffnung ausschließlich als Bild für nationale Wiederherstellung oder ausdrücklich als leibliche Auferstehung wiederzugeben ist
  choice: Die konkrete Sprache vom Öffnen der Gräber und vom Heraufführen aus ihnen bleibt unverändert bildhaft stehen.
  alternative: Die Aussage entweder als Rückkehr aus dem Exil umschreiben oder ausdrücklich als Auferweckung deuten.
  rationale: Der hebräische Text verwendet im Zusammenhang der Wiederherstellungsvision konkrete, auferstehungsartige Bilder. Eine direkte Wiedergabe bewahrt die theologische Spannung und engt den Sinn nicht interpretierend ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt gut verständlich und bewahrt zugleich die prophetische Erkenntnisformel, den Gottesnamen sowie die konkrete Grab- und Aufstiegsbildsprache.
