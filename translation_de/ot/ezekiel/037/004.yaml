  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א עַל הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם הָ/עֲצָמוֹת֙ הַ/יְבֵשׁ֔וֹת שִׁמְע֖וּ דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/004.yaml
  text: Then he said to me[a], “Prophesy over these bones, and say to them, ‘Dry bones, hear the word of Yahweh.’”
translation:
  language: de
  text: 'Dann sagte er zu mir: „Prophezeie über diese Gebeine und sage zu ihnen: Ihr trockenen Gebeine, hört das Wort Jahwes[a]!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: Die Fußnote erläutert die Form und die traditionelle Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Dann sagte er zu mir
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: הִנָּבֵא
  choice: Weissage
  rationale: Der Imperativ des Niphal von נבא bezeichnet den ausdrücklichen Auftrag, prophetisch zu reden; „weissage“ ist knapp und präzise.
- source_word: עַל
  choice: über
  rationale: Die Präposition kann bei נבא unter anderem „über“, „gegen“ oder „betreffs“ bedeuten. Hier richtet sich die prophetische Rede an die vor dem Propheten liegenden Gebeine; „über“ bewahrt sowohl das räumliche Bild als auch die sachliche Offenheit.
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: diese Gebeine
  rationale: „Gebeine“ bezeichnet menschliche Knochen in würdigem, verständlichem Deutsch. „Vertrocknet“ wird hier nicht vorweggenommen, da es erst in der folgenden Anrede ausdrücklich steht.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: und sage zu ihnen
  rationale: Die schlichte Formulierung gibt אמר und die ausdrückliche Anrede der Gebeine direkt wieder.
- source_word: הָעֲצָמוֹת הַיְבֵשׁוֹת
  choice: Ihr vertrockneten Gebeine
  rationale: Der Artikel markiert hier die direkte Anrede. „Ihr“ macht den Vokativ im Deutschen natürlich kenntlich; „vertrocknet“ bringt den Zustand der Gebeine anschaulicher zum Ausdruck als das allgemeinere „trocken“.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Pluralimperativ wird unmittelbar wiedergegeben und bewahrt den feierlich-prophetischen Klang.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר steht in einer prophetischen Formel und wird daher als „Wort“ wiedergegeben. Der Gottesname wird als „Jahwe“ transliteriert statt durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote genannt, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst prophetischem Klang. „Gebeine“ ist gegenüber „Knochen“ gehobener, im Zusammenhang aber allgemein verständlich. Der Fußnotenmarker steht unmittelbar beim Gottesnamen, auf den sich die Anmerkung bezieht.
