  yaml_path: translation/ot/ezekiel/037/017.yaml
  text: Then bring them near to each other for yourself as one stick[b][a], so that they may become one in your hand.
translation:
  language: de
  text: Dann füge sie, einen an den anderen, für dich zu einem einzigen Holzstab[a] zusammen, sodass sie in deiner Hand eins werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als einen einzigen Holzstab“. Die hebräische Wendung kann sowohl das Ergebnis („zu einem einzigen Holzstab“) als auch den Zustand („als einen einzigen Holzstab“) bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַב
  choice: Dann füge … zusammen
  rationale: Die Hifil-Imperativform fordert Ezechiel auf, die beiden Holzstäbe zueinanderzubringen. Im Deutschen gibt „füge … zusammen“ die konkrete Zeichenhandlung natürlich wieder, ohne deren spätere Deutung vorwegzunehmen.
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektpronomen verweist auf die beiden im vorherigen Vers genannten Holzstäbe.
- source_word: אֶחָד אֶל אֶחָד
  choice: zusammen
  rationale: Die Wendung bedeutet wörtlich „einen zum anderen“. Zusammen mit dem Verb wird der wechselseitige Bezug im Deutschen knapp und idiomatisch ausgedrückt.
- source_word: לְךָ
  choice: für dich
  rationale: Der Dativ bezeichnet Ezechiels persönliche Beteiligung an der Zeichenhandlung und wird formal bewahrt.
- source_word: לְעֵץ אֶחָד
  choice: zu einem einzigen Holzstab
  rationale: עֵץ bezeichnet hier aufgrund des Zusammenhangs einen beschrifteten Holzstab. Die Präposition לְ kann das Ergebnis der Handlung ausdrücken; „zu einem einzigen Holzstab“ wahrt diese resultative Lesart.
- source_word: וְהָיוּ
  choice: sodass sie … werden
  rationale: Im Anweisungszusammenhang bezeichnet die Form die beabsichtigte Folge der Handlung. „Sodass“ gibt diesen Folgesinn natürlich wieder.
- source_word: לַאֲחָדִים
  choice: eins
  rationale: Die ungewöhnliche Pluralbildung zu אֶחָד wird prädikativ gebraucht und bezeichnet, dass die beiden eine Einheit bilden. Deutsches „eins“ erhält die knappe Einheitsaussage.
- source_word: בְיָדֶךָ
  choice: in deiner Hand
  rationale: Die wörtliche Wiedergabe bewahrt das sichtbare Bild der prophetischen Zeichenhandlung.
theological_decisions:
- issue: Art der durch die beiden Holzstäbe dargestellten Einheit
  choice: Die konkrete Zeichenhandlung wird als Einswerden der Holzstäbe wiedergegeben.
  alternative: Die Aussage unmittelbar als politische oder heilsgeschichtliche Vereinigung Israels auslegen.
  rationale: Der weitere Zusammenhang erklärt die Bedeutung des Zeichens; dieser Vers selbst beschreibt zunächst Ezechiels Handlung. Die Übersetzung lässt daher die konkrete Bildsprache stehen und nimmt die Auslegung nicht vorweg.
- issue: Deutung von לְעֵץ אֶחָד
  choice: 'resultativ: „zu einem einzigen Holzstab“'
  alternative: 'zuständlich: „als einen einzigen Holzstab“'
  rationale: Die Präposition לְ lässt hier sowohl eine resultative als auch eine zuständliche Nuance zu. Der Handlungsablauf begünstigt die resultative Wiedergabe, während die echte Alternative in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Holzstab“ hält die konkrete Zeichenhandlung anschaulich und vermeidet das missverständliche „Stock“. Die Satzstruktur bleibt klar und gut vorlesbar.
