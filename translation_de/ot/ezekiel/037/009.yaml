  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א אֶל הָ/ר֑וּחַ הִנָּבֵ֣א בֶן אָ֠דָם וְ/אָמַרְתָּ֨ אֶל הָ/ר֜וּחַ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה מֵ/אַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָ/ר֔וּחַ וּ/פְחִ֛י בַּ/הֲרוּגִ֥ים הָ/אֵ֖לֶּה וְ/יִֽחְיֽוּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/009.yaml
  text: 'Then he said to me[a], “Prophesy to the breath; prophesy, son of man, and say to the breath, ‘Thus says the Lord GOD: Come from the four winds, O breath, and breathe on these slain, so that they may live.’”'
translation:
  language: de
  text: 'Da sagte er zu mir: »Weissage dem Atem[a]! Weissage, Menschensohn, und sag zum Atem: ›So spricht Gott, der HERR: Komm von den vier Winden, du Atem, und hauche diese Erschlagenen an, damit sie lebendig werden!‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten. Hier steht im Singular »Atem« und in der Wendung »vier Winde« der Plural »Winde«; ebenso kann »Geist« mitgehört werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּבֵא
  choice: Weissage
  rationale: Der Imperativ von נבא bezeichnet den prophetischen Sprechakt. »Weissage« ist im Deutschen die knappe, etablierte und kontextgemäße Wiedergabe.
- source_word: הָרוּחַ / רוּחוֹת
  choice: Atem / Winde
  rationale: רוּחַ kann Atem, Wind oder Geist bedeuten. Beim lebenspendenden Anhauchen passt im Singular »Atem« am unmittelbarsten; der Plural in מֵאַרְבַּע רוּחוֹת bezeichnet idiomatisch die vier Winde. Die bewusste Mehrdeutigkeit wird in der Fußnote festgehalten.
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Dies ist die charakteristische Anrede Ezechiels und gibt das hebräische Idiom knapp und traditionsgemäß wieder, ohne es hier christologisch umzudeuten.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Diese im Deutschen geläufige Wiedergabe vermeidet die unnatürliche Doppelung »Herr HERR« und kennzeichnet den Gottesnamen durch Kapitälchen.
- source_word: בֹּאִי
  choice: Komm
  rationale: Der feminine Singularimperativ stimmt mit רוּחַ überein; »Komm« ist die natürliche direkte Anrufung.
- source_word: וּפְחִי
  choice: hauche ... an
  rationale: נפח bedeutet »blasen, hauchen«. Mit der Präposition ב lässt sich der Vorgang natürlich als »jemanden anhauchen« ausdrücken und die Atemmetaphorik bleibt erhalten.
- source_word: בַּהֲרוּגִים הָאֵלֶּה
  choice: diese Erschlagenen
  rationale: הֲרוּגִים bezeichnet Getötete beziehungsweise Erschlagene. Die Formulierung bewahrt das eindringliche Schlachtfeldbild.
- source_word: וְיִחְיוּ
  choice: damit sie lebendig werden
  rationale: Das Imperfekt mit וְ bezeichnet hier den beabsichtigten Ausgang. »Lebendig werden« gibt im Zusammenhang der Totenbelebung den Sinn natürlicher wieder als bloßes »leben«.
theological_decisions:
- issue: Mehrdeutigkeit von רוּחַ in der Vision vom Tal
  choice: Die singularischen Vorkommen werden mit »Atem«, der Plural mit »Winde« wiedergegeben; »Geist« wird als mögliche Bedeutung in der Fußnote bewahrt.
  alternative: Alle Vorkommen einheitlich mit »Geist« oder einheitlich mit »Wind« wiedergeben.
  rationale: Der Vers nutzt bewusst das Bedeutungsspektrum von רוּחַ. »Atem« entspricht unmittelbar der Belebung, während »vier Winde« die natürliche deutsche Wendung ist. Die Fußnote verhindert, dass die geistliche Dimension der Bildsprache ausgeschlossen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Befehlsform und die direkte Rede bleiben erhalten. »Weissage« und »Menschensohn« sind biblisch geprägt, aber allgemein verständlich; die Mehrdeutigkeit des Schlüsselworts רוּחַ wird nicht vereinseitigt.
