source:
  edition: WLC
  text: לָ/כֵן֩ הִנָּבֵ֨א וְ/אָמַרְתָּ֜ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י פֹתֵ֜חַ אֶת קִבְרֽוֹתֵי/כֶ֗ם וְ/הַעֲלֵיתִ֥י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּ֑/י וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/012.yaml
  text: 'Therefore prophesy and say to them[a], ‘Thus says the Lord GOD: Behold, I am opening your graves and will bring you up from your graves, my people[b], and I will bring you into the land of Israel.’'
translation:
  language: de
  text: 'Darum weissage und sag zu ihnen: »So spricht Gott, der HERR: Seht, ich öffne eure Gräber und lasse euch aus euren Gräbern heraufkommen[a], mein Volk, und ich bringe euch in das Land Israel.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und führe euch aus euren Gräbern herauf«; auch möglich: »und lasse euch aus euren Gräbern aufsteigen«.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild kann Israels Wiederherstellung aus dem Exil als Öffnung von Gräbern beschreiben und zugleich an die spätere Hoffnung auf Auferstehung anklingen.
    reason: cross_reference
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den Folgeschluss aus der vorausgehenden Vision und klingt im modernen Deutschen natürlich.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Gibt den an Ezechiel gerichteten Imperativ präzise und in der vertrauten prophetischen Sprache wieder.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: und sag zu ihnen
  rationale: Bewahrt die Redeeinleitung, ohne unnötig altertümlich zu klingen.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Entspricht der konventionellen prophetischen Botenformel und ist im Deutschen geläufig.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Gibt beide Bestandteile des hebräischen Gottestitels wieder und vermeidet die unnatürliche Doppelung „Herr HERR“.
- source_word: הִנֵּה אֲנִי
  choice: Seht, ich
  rationale: Markiert die nachdrückliche Ankündigung göttlichen Handelns in verständlicher, würdiger Sprache.
- source_word: פֹתֵחַ
  choice: öffne
  rationale: Der partizipiale Ausdruck mit הִנֵּה stellt das Handeln anschaulich und unmittelbar vor Augen.
- source_word: קִבְרוֹתֵיכֶם
  choice: eure Gräber
  rationale: Ist die direkte und natürliche Entsprechung für die konkrete Bildsprache.
- source_word: וְהַעֲלֵיתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם
  choice: und lasse euch aus euren Gräbern heraufkommen
  rationale: Bewahrt die kausative Bedeutung und die im Hebräischen ausgedrückte Aufwärtsbewegung, ohne die Aussage ausdrücklich auf eine bestimmte Auferstehungslehre festzulegen.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Bewahrt die direkte, bundesbezogene Anrede; die Kommas kennzeichnen den Vokativ.
- source_word: וְהֵבֵאתִי אֶתְכֶם
  choice: und ich bringe euch
  rationale: Gibt das Hiphil von בוא direkt wieder und führt das Motiv der Wiederherstellung fort.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: in das Land Israel
  rationale: Gibt אַדְמָה im Zusammenhang der Rückführung territorial und zugleich idiomatisch wieder.
theological_decisions:
- issue: Bedeutung des Öffnens der Gräber
  choice: Die konkrete, an Auferstehung erinnernde Bildsprache bleibt erhalten, ohne sie ausschließlich als nationale Wiederherstellung oder als vollständige Lehraussage über die leibliche Auferstehung zu bestimmen.
  alternative: Ausschließlich bildhafte Rückkehr aus dem Exil; oder unmittelbare Vorhersage der individuellen leiblichen Auferstehung.
  rationale: Der Vers verbindet Gräber, Heraufkommen und die Rückführung in das Land Israel. Die Übersetzung bewahrt diese Spannung und legt die Bildsprache nicht einseitig aus.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr, HERR; Herr JHWH
  rationale: Die gewählte Form gibt den zusammengesetzten Titel würdig und verständlich wieder, ohne eine schwer lesbare Doppelung oder eine im Fließtext ungewohnte Umschrift.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter prophetischer Sprachform. „Weissage“ und „So spricht“ bewahren den feierlichen Charakter; „Seht“ ist verständlicher und gegenwärtiger als „Siehe“. Beide Fußnotenmarker stehen im Haupttext.
