  text: And the sticks on which you write will be in your hand before their eyes[a].
translation:
  language: de
  text: Und die Holzstücke, die du beschriftest, sollen vor ihren Augen in deiner Hand sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stäbe“. Das hebräische Wort kann allgemein Holz oder einen hölzernen Gegenstand bezeichnen; hier sind die beschrifteten Holzstücke des Zeichenhandelns gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Und ... sollen ... sein
  rationale: Das Qal Perfekt mit vorangestelltem וְ beschreibt hier im Rahmen der prophetischen Anweisung den auszuführenden beziehungsweise daraus folgenden Zustand. „Sollen … sein“ gibt den Anweisungscharakter im Deutschen natürlich wieder.
- source_word: הָעֵצִים
  choice: die Holzstücke
  rationale: עֵץ kann Baum, Holz oder einen hölzernen Gegenstand bezeichnen. Im Zeichenhandeln sind beschriftete, in der Hand gehaltene Holzstücke gemeint; „Holzstücke“ ist klar, ohne ihre genaue Form stärker festzulegen als der hebräische Ausdruck.
- source_word: אֲשֶׁר תִּכְתֹּב עֲלֵיהֶם
  choice: die du beschriftest
  rationale: Das deutsche Verb „beschriften“ gibt das Schreiben auf den Holzstücken idiomatisch und prägnant wieder. Das Präsens entspricht der unmittelbaren prophetischen Anweisung.
- source_word: בְּיָדְךָ
  choice: in deiner Hand
  rationale: Der hebräische Singular wird bewahrt und bezeichnet das sichtbare Halten der Holzstücke, nicht die Urheberschaft einer Handlung.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die anschauliche hebräische Wendung wird formal nah und zugleich idiomatisch wiedergegeben; sie betont, dass das Zeichen für die Betrachter sichtbar ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Holzstücke“ wahrt die lexikalische Breite besser als das formbestimmtere „Stäbe“; die Fußnote nennt diese im Kontext ebenfalls mögliche Wiedergabe. Die Wortstellung stellt „vor ihren Augen“ neben das sichtbare Halten, ohne den Sinn zu glätten.
