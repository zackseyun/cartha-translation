  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִחְיֶ֖ינָה הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וָ/אֹמַ֕ר אֲדֹנָ֥/י יְהוִ֖ה אַתָּ֥ה יָדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/003.yaml
  text: And he said to me[a], “Son of man, can these bones live?” And I said, “Lord GOD, you know.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Menschensohn, können diese Knochen lebendig werden[a]?« Ich antwortete: »Herr Yahweh, du weißt es.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Werden diese Knochen lebendig?« Das Hebräische kann sowohl nach der Möglichkeit als auch nach dem künftigen Geschehen fragen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Und“ bewahrt den schlichten hebräischen Erzählfluss; אֵלַי wird direkt mit „zu mir“ wiedergegeben.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Dies ist die für Ezechiel typische göttliche Anrede. „Menschensohn“ bewahrt das hebräische Bild und seine literarische Wiedererkennbarkeit, ohne an dieser Stelle eine spätere christologische Bedeutung einzutragen.
- source_word: הֲתִחְיֶינָה
  choice: können … lebendig werden
  rationale: Die Frage mit dem Imperfekt kann hier Möglichkeit oder zukünftiges Geschehen betreffen. „Lebendig werden“ gibt bei bereits toten Knochen die intransitive Bedeutung von חיה natürlich wieder; „können“ passt zur zurückhaltenden Antwort des Propheten.
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: diese Knochen
  rationale: Der Vers selbst sagt nur „diese Knochen“. Das im Kontext genannte Vertrocknetsein wird nicht in diesen Satz hineingetragen. „Knochen“ ist im heutigen Deutsch natürlicher als „Gebeine“.
- source_word: וָאֹמַר
  choice: Ich antwortete
  rationale: In diesem Dialog gibt „antwortete“ die Funktion des hebräischen „und ich sagte“ idiomatisch und ohne inhaltliche Erweiterung wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: אֲדֹנָי wird als „Herr“ und der ausdrücklich stehende Gottesname יְהוִה transparent als „Yahweh“ wiedergegeben. So wird die unnatürliche Form „Herr HERR“ vermieden.
- source_word: אַתָּה יָדָעְתָּ
  choice: du weißt es
  rationale: Das Perfekt von ידע hat hier präsentisch-stative Bedeutung. Das Objekt „es“ ist im Deutschen idiomatisch aus der vorausgehenden Frage zu ergänzen; „allein“ wird nicht hinzugefügt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: GOTT, der Herr; Herr HERR
  rationale: Die Formulierung enthält sowohl den Herrentitel als auch den Gottesnamen. „Herr Yahweh“ macht beides sichtbar, vermeidet eine missverständliche Verdoppelung und folgt unmittelbar dem hebräischen Wortlaut.
- issue: Bedeutung der Frage הֲתִחְיֶינָה
  choice: können … lebendig werden
  alternative: werden … lebendig werden
  rationale: Das hebräische Imperfekt lässt sowohl eine Frage nach der Möglichkeit als auch nach dem zukünftigen Ausgang zu. Der Haupttext folgt der im Zusammenhang naheliegenden Möglichkeitsfrage; die Alternative wird in einer Fußnote erhalten.
- issue: Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: „Menschensohn“ bewahrt Ezechiels wiederkehrende Anrede und ihre Spannung zwischen menschlicher Begrenztheit und göttlicher Beauftragung, ohne sie durch eine erklärende Umschreibung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Knochen“ ist bewusst gegen das altertümlichere „Gebeine“ gewählt; „Menschensohn“ bleibt als prägende literarische Anrede erhalten. Die direkte Rede ist klar und schlicht gestaltet.
