  text: וְ/הָיָ֤ה מִשְׁכָּנִ/י֙ עֲלֵי/הֶ֔ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵֽ/אלֹהִ֑ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/027.yaml
  text: My dwelling place will be over them[a], and I will be their God, and they will be my people.
translation:
  language: de
  text: Meine Wohnstätte wird über ihnen sein[a], und ich werde ihr Gott sein, und sie werden mein Volk sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Zelt wird über ihnen sein“; auch: „Meine Wohnung wird über ihnen sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: meine Wohnstätte
  rationale: מִשְׁכָּן bezeichnet einen Wohnort beziehungsweise eine heilige Wohnstätte und kann auch das Zelt der Gottesgegenwart meinen. „Wohnstätte“ gibt den konkreten räumlichen Sinn in natürlichem, würdigem Deutsch wieder, ohne die Aussage vorschnell auf das mosaische Heiligtumszelt einzuengen.
- source_word: עֲלֵיהֶם
  choice: über ihnen
  rationale: עַל bedeutet hier am unmittelbarsten „über/auf“. Die Wiedergabe „über ihnen“ bewahrt das räumliche Bild des hebräischen Textes, statt es deutend zu „bei ihnen“ zu glätten.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: und ich werde ihr Gott sein
  rationale: Die idiomatische deutsche Formulierung erhält die vertraute Gestalt und den Bundesklang der hebräischen Wendung.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: und sie werden mein Volk sein
  rationale: Diese natürliche deutsche Entsprechung bewahrt die wechselseitige Bundesformel und ihre biblische Wiedererkennbarkeit.
- source_word: וְהָיָה
  choice: wird … sein
  rationale: Die Verbform bezeichnet in diesem prophetischen Zusammenhang einen zukünftigen Zustand. Das einfache Futur ist klar und vermeidet eine unnötig altertümliche oder ausschmückende Wiedergabe.
theological_decisions:
- issue: Bundesformel
  choice: „Ich werde ihr Gott sein, und sie werden mein Volk sein.“
  alternative: „Ich werde ihnen zum Gott sein, und sie werden mir zum Volk sein.“
  rationale: Die gewählte Form ist im Deutschen natürlich und hält zugleich die bekannte Gestalt der biblischen Bundesformel fest, ohne dem Text eine weitergehende dogmatische Deutung aufzuerlegen.
- issue: Räumliche Aussage über Gottes Wohnstätte
  choice: „über ihnen“
  alternative: „bei ihnen“
  rationale: Die Übersetzung bewahrt die auffällige Präposition und damit die mögliche räumliche beziehungsweise schützende Bildwirkung. Sie löst die Spannung nicht stillschweigend in eine allgemeinere Aussage über Gottes Gegenwart auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die wiederholte Struktur „ich werde … sein / sie werden … sein“ erhält den feierlichen Parallelismus. Das ungewohnte „über ihnen“ ist bewusst quellentreu beibehalten und durch die Fußnote nicht geglättet.
