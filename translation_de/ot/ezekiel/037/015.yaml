  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der prophetischen Formel וַיְהִי דְבַר־יְהוָה gibt „kam“ den idiomatischen Sinn natürlich wieder; ein wörtliches „und es geschah“ wäre im Deutschen schwerfällig.
- source_word: דְבַר
  choice: das Wort
  rationale: „Das Wort“ bezeichnet hier die göttliche Mitteilung und bewahrt zugleich die geprägte prophetische Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit dem Suffix der ersten Person bezeichnet die Richtung der göttlichen Mitteilung zum Propheten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv führt den nachfolgenden Redeinhalt ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt dieselbe Funktion besser als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Wortereignisformel bleibt erkennbar, wird aber nicht unnötig wörtlich nachgebildet. Der Doppelpunkt bereitet die in den folgenden Versen einsetzende direkte Rede natürlich vor.
