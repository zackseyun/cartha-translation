base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/011.yaml
  text: Then he said to me, “Son of man, these bones are the whole house of Israel. Look, they are saying, ‘Our bones have dried up, and our hope has perished; we are cut off.’”
translation:
  language: de
  text: 'Dann sagte er zu mir: „Menschensohn, diese Gebeine sind das ganze Haus Israel. Siehe, sie sagen: ‚Unsere Gebeine sind vertrocknet, unsere Hoffnung ist verloren, und wir sind abgeschnitten.[a]‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das abschließende hebräische Wort kann wörtlich etwa „für uns/uns selbst“ bedeuten; seine Funktion in dieser ungewöhnlichen Wendung ist unsicher.
    reason: Die Anmerkung dokumentiert die schwierige hebräische Formulierung נִגְזַרְנוּ לָנוּ, ohne ihre Bedeutung über den Text hinaus festzulegen.
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Menschensohn
  rationale: Die traditionelle, prägnante Wiedergabe der hebräischen Anrede bewahrt ihren wiederkehrenden Charakter im Buch Ezechiel.
- source_word: עֲצָמוֹת
  choice: Gebeine
  rationale: Im Zusammenhang der Vision bezeichnet das Wort menschliche Knochen; „Gebeine“ ist würdevoll, anschaulich und idiomatisch.
- source_word: כָּל־בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Bewahrt das kollektive Bild und die formale Ausdrucksweise des Hebräischen.
- source_word: הִנֵּה אֹמְרִים
  choice: Sie sagen
  rationale: הִנֵּה lenkt hier die Aufmerksamkeit auf die nun angeführte Klage. Im natürlichen Deutschen erfüllt die direkte Einführung „Sie sagen“ diese Funktion, ohne ein schwerfälliges „Siehe“.
- source_word: יָבְשׁוּ
  choice: sind vertrocknet
  rationale: Gibt den vollendeten Zustand der ausgetrockneten Gebeine plastisch wieder.
- source_word: אָבְדָה תִקְוָתֵנוּ
  choice: unsere Hoffnung ist dahin
  rationale: Natürliches, starkes Deutsch für die Vorstellung, dass die Hoffnung verloren bzw. zugrunde gegangen ist.
- source_word: נִגְזַרְנוּ לָנוּ
  choice: wir sind abgeschnitten
  rationale: Bewahrt das Bild der Trennung und Aussonderung; das ungewöhnliche לָנוּ verstärkt wahrscheinlich die auf die Sprecher selbst bezogene Endgültigkeit.
theological_decisions:
- issue: Identität der Gebeine
  choice: „diese Gebeine sind das ganze Haus Israel“
  alternative: Eine Deutung ausschließlich als einzelne Verstorbene oder als eine bestimmte Teilgruppe Israels
  rationale: Der Vers identifiziert die Gebeine ausdrücklich kollektiv mit dem ganzen Haus Israel; die Übersetzung lässt die weitere Spannung zwischen nationaler Wiederherstellung und Auferstehungsbild bestehen.
- issue: Art der Hoffnungslosigkeit
  choice: Die dreigliedrige Klage wird ohne erklärende Zusätze wiedergegeben.
  alternative: Die Hoffnung ausdrücklich als politische, geistliche oder jenseitige Hoffnung bestimmen
  rationale: Der hebräische Text legt die Dimension der Hoffnung hier nicht abschließend fest; eine engere Auslegung würde die echte Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebeine“ und „Haus Israel“ erhalten den gehobenen biblischen Ton, während Satzbau und direkte Rede gut verständlich bleiben.
