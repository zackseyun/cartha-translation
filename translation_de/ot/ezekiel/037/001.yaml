id: EZK.37.1
reference: Ezekiel 37:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָיְתָ֣ה עָלַ/י֮ יַד יְהוָה֒ וַ/יּוֹצִאֵ֤/נִי בְ/ר֨וּחַ֙ יְהוָ֔ה וַ/יְנִיחֵ֖/נִי בְּ/ת֣וֹךְ הַ/בִּקְעָ֑ה וְ/הִ֖יא מְלֵאָ֥ה עֲצָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/001.yaml
  text: The hand of Yahweh was upon me[a], and he brought me out by the Spirit of Yahweh and set me down in the middle of the valley[b]; it was full of bones.
translation:
  language: de
  text: Jahwes Hand kam über mich, und er brachte mich durch den Geist Jahwes[a] hinaus und ließ mich mitten in der Talebene[b] nieder. Sie war voller Knochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Geist Jahwes«. Die hebräische Wendung kann sowohl das Mittel (»durch den Geist«) als auch die Sphäre oder den Zustand (»im Geist«) bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Tal« oder »weite Ebene«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  choice: Jahwes Hand
  rationale: Die konkrete prophetische Bildsprache der »Hand« bleibt erhalten; die Wendung bezeichnet Jahwes machtvolles, bestimmendes Einwirken auf den Propheten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיּוֹצִאֵנִי
  choice: er brachte mich hinaus
  rationale: 'Die Hifil-Form von יצא hat kausativen Sinn: Jemanden hinausbringen. Die Formulierung lässt offen, auf welche Weise der prophetische Transport geschah.'
- source_word: בְרוּחַ יְהוָה
  choice: durch den Geist Jahwes
  rationale: רוּחַ bezeichnet hier im Zusammenhang prophetischer Entrückung am ehesten den Geist als göttlich Handelnden. »Durch« gibt das בְּ instrumental wieder; die ebenfalls mögliche Auffassung als Sphäre oder Zustand wird in der Fußnote bewahrt.
- source_word: וַיְנִיחֵנִי
  choice: ließ mich … nieder
  rationale: Das Hifil von נוח beschreibt, dass Ezechiel an einem Ort zur Ruhe beziehungsweise zum Stillstand gebracht wird. In Verbindung mit »mitten in der Talebene« ist »ließ mich … nieder« natürlich und anschaulich.
- source_word: בְּתוֹךְ הַבִּקְעָה
  choice: mitten in der Talebene
  rationale: בִּקְעָה bezeichnet eine breite, ebene Senke oder Talebene. »Mitten in« gibt בְּתוֹךְ klar wieder.
- source_word: מְלֵאָה עֲצָמוֹת
  choice: voller Knochen
  rationale: Die knappe deutsche Wendung bewahrt die schroffe, unmittelbare Bildwirkung des hebräischen Nominalsatzes.
theological_decisions:
- issue: Bedeutung von רוּחַ bei der prophetischen Entrückung
  choice: Geist Jahwes
  alternative: Wind Jahwes; im Geist Jahwes
  rationale: Der Zusammenhang göttlicher Offenbarung und prophetischer Versetzung spricht für »Geist«. Die Präposition בְּ kann jedoch sowohl das Mittel als auch die Sphäre beziehungsweise den Zustand bezeichnen; diese echte Mehrdeutigkeit wird durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. Der Eigenname »Jahwe« wird konsequent verwendet. Kurze Hauptsätze erhalten die eindringliche Erzählbewegung des Verses.
