  text: וְ/לֹ֧א יִֽטַמְּא֣וּ ע֗וֹד בְּ/גִלּֽוּלֵי/הֶם֙ וּ/בְ/שִׁקּ֣וּצֵי/הֶ֔ם וּ/בְ/כֹ֖ל פִּשְׁעֵי/הֶ֑ם וְ/הוֹשַׁעְתִּ֣י אֹתָ֗/ם מִ/כֹּ֤ל מוֹשְׁבֹֽתֵי/הֶם֙ אֲשֶׁ֣ר חָטְא֣וּ בָ/הֶ֔ם וְ/טִהַרְתִּ֤י אוֹתָ/ם֙ וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/023.yaml
  text: They will no longer defile themselves with their idols[a], with their detestable things, or with any of their transgressions. I will save them from all their dwelling places in which they sinned, and I will cleanse them. Then they will be my people[b], and I will be their God.
translation:
  language: de
  text: Sie werden sich nicht mehr durch ihre Götzen[a], durch ihre abscheulichen Dinge und durch all ihre Vergehen verunreinigen. Ich werde sie aus all ihren Wohnorten retten, an denen sie gesündigt haben[b], und ich werde sie reinigen. Dann werden sie mein Volk sein, und ich werde ihr Gott sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete hebräische Wort für „Götzen“ ist eine ausgesprochen verächtliche Bezeichnung für falsche Götter.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nach dem masoretischen Text: „aus all ihren Wohnorten, an denen sie gesündigt haben“. Die Formulierung ist im Zusammenhang schwierig; manche Deutungen verstehen sie allgemeiner als Rettung aus den Orten oder Verhältnissen, die mit ihrer Sünde verbunden waren. Eine Wiedergabe mit „Abtrünnigkeiten“ setzt eine Textänderung voraus.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַמְּאוּ
  choice: sich verunreinigen
  rationale: Die reflexive Verbform bezeichnet hier Selbstverunreinigung; die Wiedergabe bewahrt sowohl die kultische als auch die moralische Dimension.
- source_word: גִּלּוּלֵיהֶם
  choice: ihre Götzen
  rationale: Das Wort ist Hesekiels stark verächtliche Bezeichnung für Götzen. „Götzen“ ist im Haupttext klar und würdig; die besondere Geringschätzung wird in Fußnote [a] erläutert.
- source_word: שִׁקּוּצֵיהֶם
  choice: ihre abscheulichen Dinge
  rationale: Der Ausdruck bezeichnet verabscheute, besonders mit Götzendienst verbundene Gegenstände oder Praktiken, ohne hier eindeutig nur eines von beidem festzulegen.
- source_word: פִּשְׁעֵיהֶם
  choice: ihre Vergehen
  rationale: פשע kann Auflehnung gegen rechtmäßige Autorität bezeichnen. „Vergehen“ ist verständlich und lässt den Bundeszusammenhang die rebellische Nuance mittragen.
- source_word: וְהוֹשַׁעְתִּי
  choice: Ich werde sie retten
  rationale: Das Verb bezeichnet Retten oder Befreien; „retten“ bewahrt die unmittelbare wie auch die theologische Tragweite.
- source_word: מוֹשְׁבֹתֵיהֶם
  choice: ihre Wohnorte
  rationale: Der masoretische Text bezeichnet wörtlich Orte des Wohnens. Die Wiedergabe erhält dieses schwierige Bild, statt die kontextuell naheliegende Deutung „Abtrünnigkeiten“ in den Haupttext einzusetzen.
- source_word: אֲשֶׁר חָטְאוּ בָהֶם
  choice: an denen sie gesündigt haben
  rationale: Der Relativsatz wird am natürlichsten auf die Wohnorte bezogen. Die deutsche Form ist idiomatisch und bewahrt die räumliche Verknüpfung des masoretischen Textes.
- source_word: וְטִהַרְתִּי
  choice: ich werde sie reinigen
  rationale: „Reinigen“ umfasst in diesem Wiederherstellungszusammenhang sowohl kultische als auch moralische Reinigung.
- source_word: וְהָיוּ לִי לְעָם
  choice: sie werden mein Volk sein
  rationale: Die feste Bundesformel wird in natürlichem, geläufigem Deutsch wiedergegeben.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: ich werde ihr Gott sein
  rationale: Die entsprechende Bundesformel wird knapp und ihrem hebräischen Sinn gemäß wiedergegeben.
theological_decisions:
- issue: Verhältnis der Rettungsaussage zu Sünde, Abfall und Exil
  choice: Der Haupttext folgt dem masoretischen Wortlaut und spricht von Rettung aus den Wohnorten, an denen Israel sündigte; darauf folgen Reinigung und die erneuerte Bundesbeziehung.
  alternative: Aufgrund des schwierigen Zusammenhangs wird bisweilen „von all ihren Abtrünnigkeiten, durch die sie gesündigt haben“ verstanden oder durch eine Konjektur hergestellt.
  rationale: Die Lesart des WLC soll nicht stillschweigend durch eine theologisch oder kontextuell glattere Form ersetzt werden. Die Fußnote wahrt die echte textliche und interpretative Schwierigkeit, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Satzstruktur und die abschließende Bundesformel bleiben erhalten. Die Fußnotenmarker sind den tatsächlich erläuterten Ausdrücken zugeordnet.
