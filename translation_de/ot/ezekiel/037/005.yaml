source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לָ/עֲצָמ֖וֹת הָ/אֵ֑לֶּה הִנֵּ֨ה אֲנִ֜י מֵבִ֥יא בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/005.yaml
  text: 'Thus says the Lord GOD to these bones: Behold[a], I am bringing breath into you, and you shall live.'
translation:
  language: de
  text: 'So spricht der Herr Yahweh zu diesen Knochen: Siehe, ich bringe Atem[a] in euch, und ihr werdet leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort רוּחַ kann auch »Geist« oder »Wind« bedeuten. Hier passt »Atem« zum unmittelbaren Bild, in dem leblose Knochen Leben empfangen; im weiteren Verlauf des Kapitels bleibt die Mehrdeutigkeit jedoch bedeutsam.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen natürlich und würdevoll im Präsens wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Wiedergabe bewahrt sowohl den Herrentitel als auch den im Ausgangstext stehenden Gottesnamen und vermeidet das missverständliche »Herr HERR«.
- source_word: לָעֲצָמוֹת הָאֵלֶּה
  choice: zu diesen Knochen
  rationale: Die Präposition kennzeichnet hier die Knochen als Adressaten der göttlichen Rede.
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Aufmerksamkeitsruf bleibt ausdrücklich erhalten; »Seht« ist im modernen Deutschen verständlicher als das altertümliche »Siehe« und passt zur Anrede im Plural.
- source_word: אֲנִי מֵבִיא
  choice: ich bringe
  rationale: Das Partizip zusammen mit הִנֵּה und dem ausdrücklichen Pronomen bezeichnet ein unmittelbar bevorstehendes beziehungsweise einsetzendes Handeln.
- source_word: בָכֶם רוּחַ
  choice: Atem in euch
  rationale: Mit dem Bewegungsverb ist »in euch bringen« idiomatisch; »Atem« entspricht im unmittelbaren Bild der Belebung lebloser Knochen, ohne die weiteren Bedeutungen von רוּחַ zu verschweigen.
- source_word: וִחְיִיתֶם
  choice: und ihr werdet leben
  rationale: Die Form bezeichnet das künftige Ergebnis des göttlichen Handelns; die schlichte Zukunft ist in heutigem Deutsch natürlich und bewahrt die Zusage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Der Eigenname wird als »Yahweh« erkennbar gehalten, während אֲדֹנָי mit »Herr« wiedergegeben wird. So werden Titel und Name nicht miteinander verschmolzen.
- issue: Mehrdeutigkeit von רוּחַ
  choice: Atem im Haupttext, mit Fußnote
  alternative: Geist; Wind
  rationale: Im unmittelbaren Zusammenhang passt »Atem« zur Belebung der Knochen. Die für das Kapitel bedeutsame Mehrdeutigkeit zwischen Atem, Geist und Wind wird in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel. Der Aufmerksamkeitsruf wird verständlich, aber nicht umgangssprachlich formuliert; die Mehrdeutigkeit des Schlüsselworts רוּחַ bleibt durch die Fußnote sichtbar.
