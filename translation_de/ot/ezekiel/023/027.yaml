  text: וְ/הִשְׁבַּתִּ֤י זִמָּתֵ/ךְ֙ מִמֵּ֔/ךְ וְ/אֶת זְנוּתֵ֖/ךְ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִשְׂאִ֤י עֵינַ֨יִ/ךְ֙ אֲלֵי/הֶ֔ם וּ/מִצְרַ֖יִם לֹ֥א תִזְכְּרִי עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/027.yaml
  text: So I will put an end to your lewdness from you[a], and your prostitution from the land of Egypt; and you will not lift up your eyes to them[b], and you will remember Egypt no more.
translation:
  language: de
  text: So werde ich deinem schamlosen Treiben ein Ende machen und deiner aus dem Land Ägypten stammenden Hurerei.[a] Du wirst deine Augen nicht zu ihnen erheben,[b] und du wirst dich nicht mehr an Ägypten erinnern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und deiner Hurerei aus dem Land Ägypten“. Die knappe hebräische Fügung bezeichnet am ehesten ihre Herkunft aus Ägypten; im Zusammenhang kann sie auch die Hurerei im Verhältnis zu Ägypten anklingen lassen.'
    reason: Die Beziehung von „aus dem Land Ägypten“ zu „deiner Hurerei“ ist elliptisch und soll nicht überdeutet werden.
  - marker: b
    text: Die hebräische Wendung kann bedeuten, sich begehrend, aufmerksam oder Hilfe suchend jemandem zuzuwenden.
    reason: Die Bildrede hat mehrere mögliche Bedeutungsnuancen, die im Haupttext nicht auf eine einzige verengt werden sollen.
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: So werde ich … ein Ende machen
  rationale: Der Hifil von שׁבת bezeichnet hier das Verursachen eines Aufhörens. Die deutsche Wendung gibt die kausative Aussage natürlich und deutlich wieder.
- source_word: זִמָּתֵךְ
  choice: deinem schamlosen Treiben
  rationale: זִמָּה bezeichnet in diesem sexualisierten Gerichtskontext nicht allgemein Bosheit, sondern schamloses, sexuell anstößiges Verhalten. „Schamloses Treiben“ wahrt die Schärfe, ohne altertümlich zu klingen.
- source_word: מִמֵּךְ
  choice: bei dir
  rationale: Die Präposition bezeichnet die Beseitigung dessen, was an beziehungsweise in der personifizierten Stadt vorhanden ist. „Bei dir“ klingt im Deutschen natürlicher als das wörtliche „von dir weg“.
- source_word: וְאֶת זְנוּתֵךְ
  choice: und deiner Hurerei
  rationale: זְנוּת bezeichnet Hurerei beziehungsweise Prostitution. „Hurerei“ hält die bewusst drastische prophetische Metaphorik fest und passt syntaktisch zu „ein Ende machen“.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: die aus dem Land Ägypten stammt
  rationale: Der hebräische Ausdruck nennt ausdrücklich das Land Ägypten und kennzeichnet Ägypten als Herkunft dieser Hurerei. Die Relativkonstruktion macht den elliptischen hebräischen Parallelismus im Deutschen verständlich.
- source_word: לֹא תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם
  choice: Du wirst deine Augen nicht mehr zu ihnen erheben
  rationale: Die hebräische Bildrede wird bewahrt, weil sie je nach Kontext Begehren, Aufmerksamkeit oder Abhängigkeit ausdrücken kann und nicht auf nur eine dieser Bedeutungen verengt werden sollte.
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: Das maskuline Pluralpronomen verweist am ehesten auf die Ägypter beziehungsweise die als Liebhaber dargestellten Männer.
- source_word: וּמִצְרַיִם לֹא תִזְכְּרִי עוֹד
  choice: und an Ägypten wirst du nicht mehr denken
  rationale: Die Formulierung gibt das Ende des Erinnerns beziehungsweise des sehnsüchtigen Zurückdenkens wieder und wahrt die Hervorhebung von Ägypten.
theological_decisions:
- issue: Sexualisierte Sprache der prophetischen Anklage
  choice: Die Metapher wird mit „schamlosem Treiben“ und „Hurerei“ unmittelbar wiedergegeben.
  alternative: Verallgemeinerung zu „Unmoral“ oder „Untreue“.
  rationale: Der Ausgangstext setzt bewusst drastische sexuelle Sprache für Jerusalems religiöse und politische Untreue ein. Eine Verallgemeinerung würde die prophetische Gerichtsrede abschwächen.
- issue: Bedeutung der Wendung „die Augen zu ihnen erheben“
  choice: Das hebräische Bild bleibt im Haupttext erhalten.
  alternative: Deutende Wiedergaben wie „bei ihnen Hilfe suchen“ oder „sich nach ihnen sehnen“.
  rationale: Die Wendung kann Begehren, Zuwendung oder Abhängigkeit bezeichnen. Der Kontext erlaubt diese Nuancen, erzwingt aber keine einzige davon.
- issue: Bezug von מֵאֶרֶץ מִצְרָיִם
  choice: Die Hurerei wird als aus Ägypten stammend wiedergegeben.
  alternative: „deiner Hurerei mit dem Land Ägypten“ als Bezeichnung ihres Gegenübers.
  rationale: Die Präposition מִן bezeichnet am unmittelbarsten Herkunft oder Ausgangspunkt. Wegen der knappen hebräischen Ellipse wird die mögliche relationale Deutung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische prophetische Sexualmetaphorik bleibt erkennbar; der elliptische erste Satz wird für gewöhnliche Leser syntaktisch erschlossen, während echte Mehrdeutigkeit durch Fußnoten bewahrt wird.
