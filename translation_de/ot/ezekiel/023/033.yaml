  yaml_path: translation/ot/ezekiel/023/033.yaml
  text: You will be filled with drunkenness and grief, with a cup of horror and desolation, the cup of your sister Samaria.
translation:
  language: de
  text: Du wirst von Trunkenheit und Kummer erfüllt sein, mit dem Becher des Entsetzens und der Verwüstung, dem Becher deiner Schwester Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכָּרוֹן
  choice: Trunkenheit
  rationale: Gibt den Zustand des Berauschtseins direkt wieder und bewahrt das Bild vom zu trinkenden Becher.
- source_word: יָגוֹן
  choice: Kummer
  rationale: Bezeichnet tiefen seelischen Schmerz; „Kummer“ ist im heutigen Deutsch natürlich und entspricht dem hebräischen Ausdruck, ohne ihn unnötig zuzuspitzen.
- source_word: שַׁמָּה
  choice: Entsetzen
  rationale: Das Wort kann Entsetzen beziehungsweise Grauen bezeichnen; hier passt „Entsetzen“ zur Wirkung des Gerichtsbechers.
- source_word: שְׁמָמָה
  choice: Verwüstung
  rationale: Bewahrt den konkreten Aspekt von Zerstörung und Verödung.
- source_word: תִּמָּלֵאִי
  choice: du wirst … erfüllt sein
  rationale: Gibt die feminine zweite Person Singular und den passivischen Sinn der Verbform wieder.
theological_decisions:
- issue: Bild des Gerichtsbechers
  choice: Die Bechermetapher wird unverändert beibehalten.
  alternative: Den Becher erklärend als Gottes Gericht wiedergeben.
  rationale: Der hebräische Text nennt Gott in diesem Vers nicht ausdrücklich und lässt das poetische Gerichtsbild selbst wirken.
- issue: Beziehung zu Samaria
  choice: „deiner Schwester Samaria“
  alternative: „deiner Schwester, der Stadt Samaria“
  rationale: Die knappe Personifikation des Ausgangstextes wird bewahrt; aus dem Kontext ist die metaphorische Verwandtschaft verständlich.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallele Folge „Trunkenheit und Kummer“ sowie „Entsetzen und Verwüstung“ bewahrt Rhythmus und Bildsprache des hebräischen Verses.
