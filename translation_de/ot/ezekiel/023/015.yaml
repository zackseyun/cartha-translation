  text: חֲגוֹרֵ֨י אֵז֜וֹר בְּ/מָתְנֵי/הֶ֗ם סְרוּחֵ֤י טְבוּלִים֙ בְּ/רָ֣אשֵׁי/הֶ֔ם מַרְאֵ֥ה שָׁלִשִׁ֖ים כֻּלָּ֑/ם דְּמ֤וּת בְּנֵֽי בָבֶל֙ כַּשְׂדִּ֔ים אֶ֖רֶץ מוֹלַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/015.yaml
  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
translation:
  language: de
  text: mit Gürteln um die Hüften, mit herabhängenden Turbanen auf ihren Köpfen; alle von ihnen sahen aus wie Offiziere[a], wie Söhne Babels[b], Chaldäer, deren Heimatland das Land ihrer Geburt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hauptleute“. Das hebräische Wort שָׁלִשִׁים kann hochrangige oder besonders ausgezeichnete Militärangehörige bezeichnen; „Offiziere“ lässt den genauen Rang offen.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne Babels“ ist eine hebräische Zugehörigkeitsbezeichnung für Babylonier.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגוֹרֵי אֵזוֹר בְּמָתְנֵיהֶם
  choice: mit Gürteln um die Hüften
  rationale: Die konkrete Kleidung und die Körperstelle werden in natürlichem modernem Deutsch wiedergegeben; das umständliche „mit einem Gürtel gegürtet“ wird vermieden.
- source_word: סְרוּחֵי טְבוּלִים בְּרָאשֵׁיהֶם
  choice: mit herabhängenden Turbanen auf dem Kopf
  rationale: „Herabhängend“ bewahrt den Sinn von סְרוּחֵי als lang herabreichend oder schleppend; „Turbane“ ist hier die etablierte Bezeichnung für die Kopfbedeckung.
- source_word: מַרְאֵה שָׁלִשִׁים כֻּלָּם
  choice: allesamt dem Aussehen nach Offiziere
  rationale: Die Formulierung erhält sowohl den visuellen Eindruck als auch die ausdrückliche Gesamtheit. „Offiziere“ gibt den militärischen Rang wieder, ohne einen unsicheren antiken Dienstgrad zu präzisieren.
- source_word: דְּמוּת בְּנֵי בָבֶל
  choice: Abbilder der Söhne Babels
  rationale: „Abbilder“ bildet דְּמוּת konkret ab; „Söhne Babels“ bewahrt die hebräische Zugehörigkeitsformel, deren Bedeutung in der Fußnote erläutert wird.
- source_word: כַּשְׂדִּים אֶרֶץ מוֹלַדְתָּם
  choice: Chaldäer aus dem Land ihrer Geburt
  rationale: Die eigenständige ethnische Bezeichnung „Chaldäer“ bleibt erhalten. Die Herkunftsangabe wird eng am Hebräischen und zugleich verständlich formuliert.
