source:
  edition: WLC
  text: עָשֹׂ֥ה אֵ֖לֶּה לָ֑/ךְ בִּ/זְנוֹתֵ/ךְ֙ אַחֲרֵ֣י גוֹיִ֔ם עַ֥ל אֲשֶׁר נִטְמֵ֖את בְּ/גִלּוּלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/030.yaml
  text: These things are done to you because of your prostitution after the nations[a], because you defiled yourself with their idols.
translation:
  language: de
  text: Dies wird dir angetan, weil du den Nationen nachgehurt hast und weil du dich mit ihren Götzen[a] verunreinigt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Götzen“ ist eine verächtliche Bezeichnung; es wird mitunter auch als „Mistgötzen“ oder „widerliche Götzen“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשֹׂה אֵלֶּה לָךְ
  choice: Dies wird dir angetan
  rationale: Die ungewöhnliche Infinitivkonstruktion blickt auf die zuvor geschilderten Strafhandlungen zurück. Die unpersönliche Passivform gibt den Sinn wieder, ohne ein im Satz nicht genanntes Subjekt einzuführen; das singularische „Dies“ fasst das Geschehen natürlich zusammen.
- source_word: בִּזְנוֹתֵךְ אַחֲרֵי גוֹיִם
  choice: weil du den Nationen nachgehurt hast
  rationale: Die Präposition ב wird kausal verstanden. „Nachhuren“ bewahrt sowohl die sexuelle Metapher von זנה als auch die durch אַחֲרֵי ausgedrückte Bewegung des Hinterhergehens. „Nationen“ entspricht גוֹיִם, ohne den politischen und religiösen Zusammenhang auf eine einzige Bedeutung zu verengen.
- source_word: עַל אֲשֶׁר
  choice: und weil
  rationale: Die Wendung führt einen weiteren Grund für das Gericht an. „Und weil“ macht die Parallelität der beiden kausalen Aussagen im Deutschen deutlich.
- source_word: נִטְמֵאת
  choice: du dich … verunreinigt hast
  rationale: Der Niphal kann ein Unreinwerden oder Verunreinigtwerden bezeichnen. Die reflexive deutsche Form bewahrt hier die kultische Verunreinigung und die eigene Verantwortlichkeit der Angeredeten.
- source_word: בְּגִלּוּלֵיהֶם
  choice: mit ihren Götzen
  rationale: „Götzen“ ist eine klare, bereits abwertende Wiedergabe des verächtlichen Ausdrucks גִּלּוּלִים. Die Präposition ב wird als Mittel beziehungsweise Verbindung mit dem Verunreinigenden wiedergegeben.
theological_decisions:
- issue: Sexuelle Metapher für Bundesbruch und Götzendienst
  choice: weil du den Nationen nachgehurt hast
  alternative: weil du den Nationen untreu gefolgt bist / wegen deines Götzendienstes mit den Nationen
  rationale: Ezechiels bewusst anstößige sexuelle Bildsprache wird nicht zu einer bloßen Erklärung wie „Untreue“ oder „Götzendienst“ abgeschwächt. Zugleich verdeutlicht der folgende Satzteil den Bezug auf fremde Götter.
- issue: Verächtlicher Charakter von גִּלּוּלִים
  choice: Götzen[a]
  alternative: Mistgötzen / widerliche Götzen
  rationale: „Götzen“ ist im Deutschen verständlich und abwertend, gibt aber die möglicherweise besonders grobe Nebenbedeutung nicht vollständig wieder. Diese wird daher in einer Fußnote ausgewiesen, ohne sie als einzig sichere etymologische Deutung in den Haupttext zu setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachhuren“ ist bewusst kräftig und ungewöhnlich, entspricht aber der drastischen Bildsprache des hebräischen Textes. Die Anrede bleibt feminin singular, ist im deutschen Wortlaut jedoch nur aus dem Zusammenhang erkennbar.
