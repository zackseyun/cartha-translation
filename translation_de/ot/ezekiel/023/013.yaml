source:
  edition: WLC
  text: וָ/אֵ֖רֶא כִּ֣י נִטְמָ֑אָה דֶּ֥רֶךְ אֶחָ֖ד לִ/שְׁתֵּי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/013.yaml
  text: And I saw that she had become unclean[b][a]; both of them followed the same way.
translation:
  language: de
  text: Und ich sah, dass sie unrein geworden war[a]; beide gingen denselben Weg.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sie verunreinigt war“; auch: „dass sie sich verunreinigt hatte“.'
    reason: Das hebräische Verb kann eher zuständlich oder im Zusammenhang reflexiv-resultativ verstanden werden.
  - marker: b
    text: 'Wörtlich: „Ein Weg war für sie beide.“'
    reason: Die Fußnote bewahrt die knappe und mehrdeutige Nominalkonstruktion des Hebräischen.
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Und ich sah
  rationale: Das Qal-Wayyiqtol in der 1. Person Singular führt die Wahrnehmung in der Erzählfolge fort; „Und ich sah“ bewahrt sowohl die Verknüpfung als auch die Ich-Perspektive.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was der Sprecher sah, und ist daher als Ergänzungssatz wiederzugeben.
- source_word: נִטְמָאָה
  choice: sie unrein geworden war
  rationale: Das Nifal Perfekt kann einen Zustand oder das Eintreten von Verunreinigung bezeichnen. „Unrein geworden war“ bewahrt die resultative Bedeutung, ohne die Form eindeutig reflexiv oder rein passiv festzulegen.
- source_word: דֶּרֶךְ אֶחָד
  choice: denselben Weg
  rationale: Wörtlich steht „ein Weg“. Im Zusammenhang bezeichnet die Wendung den beiden gemeinsamen Lebenswandel; „denselben Weg“ gibt dies im Deutschen natürlich wieder.
- source_word: לִשְׁתֵּיהֶן
  choice: beide
  rationale: Die Form bezieht den einen gemeinsamen Weg auf beide Schwestern. „Beide“ drückt diesen Bezug knapp und idiomatisch aus.
theological_decisions:
- issue: Verunreinigung im Gleichnis von Ohola und Oholiba
  choice: „unrein geworden war“ als moralisch-kultische Verunreinigung im Bild ehelicher und sexueller Untreue
  alternative: „sich verunreinigt hatte“ oder „verunreinigt worden war“
  rationale: Die Formulierung wahrt die Schwere der im Kapitel dargestellten Bundesuntreue, legt aber die grammatisch mögliche Zustands-, Passiv- oder Reflexivnuance nicht unnötig eindeutig fest.
- issue: Der gemeinsame Weg beider Schwestern
  choice: „beide gingen denselben Weg“
  alternative: „ein Weg war für sie beide“
  rationale: Die idiomatische Wiedergabe macht den gemeinsamen schuldhaften Lebenswandel deutlich, ohne zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, während „beide gingen denselben Weg“ die gemeinsame Lebensführung idiomatisch ausdrückt. Die Fußnoten erhalten die echte grammatische und syntaktische Mehrdeutigkeit.
