source:
  edition: WLC
  text: וְ/עָשׂ֨וּ אוֹתָ֜/ךְ בְּ/שִׂנְאָ֗ה וְ/לָקְחוּ֙ כָּל יְגִיעֵ֔/ךְ וַ/עֲזָב֖וּ/ךְ עֵירֹ֣ם וְ/עֶרְיָ֑ה וְ/נִגְלָה֙ עֶרְוַ֣ת זְנוּנַ֔יִ/ךְ וְ/זִמָּתֵ֖/ךְ וְ/תַזְנוּתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/029.yaml
  text: They will deal with you in hatred[a], and they will take all your wealth, and leave you naked and bare; and the nakedness of your prostitutions will be uncovered[c][b], your lewdness and your acts of prostitution.
translation:
  language: de
  text: Sie werden dich voller Hass behandeln und dir alles nehmen, was du dir erarbeitet hast[a]. Sie werden dich nackt und bloß zurücklassen. Dann werden die Blöße deiner Hurereien, deine Schandtat und deine Hurereien aufgedeckt werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „all deine Mühe“. Gemeint sein kann auch der gesamte Ertrag deiner Arbeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dann werden die Schande deiner Hurereien, deine Schandtat und deine Hurereien bloßgestellt.“ „Blöße“ bezeichnet hier zugleich die beschämende Entblößung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ אוֹתָךְ בְּשִׂנְאָה
  choice: Sie werden dich voller Hass behandeln
  rationale: Die Wendung עשה + Objekt + בְּ bezeichnet die Art der Behandlung. „Voller Hass“ gibt die feindselige Haltung natürlich und deutlich wieder.
- source_word: וְלָקְחוּ כָּל יְגִיעֵךְ
  choice: dir alles nehmen, was du dir erarbeitet hast
  rationale: 'יְגִיעַ bezeichnet Mühe oder Arbeit und kann metonymisch deren Ertrag meinen. Die Formulierung bewahrt beides: die geleistete Arbeit und den daraus gewonnenen Besitz.'
- source_word: וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה
  choice: Sie werden dich nackt und bloß zurücklassen
  rationale: Das geläufige deutsche Wortpaar bewahrt die verstärkende Doppelung und vermittelt sowohl Entblößung als auch völlige Mittellosigkeit.
- source_word: וְנִגְלָה
  choice: So wird ... aufgedeckt
  rationale: Das Verb führt im Zusammenhang die zukünftige Folge weiter. „Aufgedeckt“ wahrt das Bild der erzwungenen Entblößung.
- source_word: עֶרְוַת זְנוּנַיִךְ
  choice: die Blöße deiner Hurerei
  rationale: עֶרְוָה bedeutet wörtlich „Blöße“ und trägt die Konnotation schändlicher Entblößung. זְנוּנִים bezeichnet hier im prophetischen Bild prostitutionartige Untreue; „Hurerei“ bewahrt die drastische Metapher.
- source_word: וְזִמָּתֵךְ
  choice: deine Schandtat
  rationale: זִמָּה kann eine schändliche, insbesondere sexuell anstößige Tat oder Gesinnung bezeichnen. „Schandtat“ erhält die moralische Schwere, ohne den Ausdruck unnötig einzuengen.
- source_word: וְתַזְנוּתָיִךְ
  choice: deine Hurereien
  rationale: Der Plural gibt die wiederholten Handlungen wieder und erhält die bewusste Häufung ähnlicher Ausdrücke im Hebräischen.
theological_decisions:
- issue: Sexualisierte Metapher für die Untreue Samarias und Jerusalems
  choice: Die ausdrückliche Bildsprache von Blöße und Hurerei bleibt erhalten.
  alternative: Die Metapher zu „Untreue“, „Unmoral“ oder „Abfall“ abschwächen.
  rationale: Ezechiels bewusst schockierende Sprache stellt Bundesuntreue als Prostitution und das Gericht als öffentliche Entblößung dar. Eine Verallgemeinerung würde die prophetische Rhetorik und ihre theologische Spannung abschwächen.
- issue: Syntaktisches Verhältnis der abschließenden Nominalgruppen
  choice: „deine Schandtat und deine Hurereien“ wird durch einen Gedankenstrich als erläuternde Apposition zur aufgedeckten Blöße verstanden.
  alternative: Die Ausdrücke als weitere, eigenständige Dinge auffassen, die zusätzlich aufgedeckt werden.
  rationale: Das singuläre וְנִגְלָה stimmt unmittelbar mit dem singulären עֶרְוַת überein; die folgenden Nominalgruppen lassen sich daher gut als nähere Erläuterung verstehen. Da die Reihung auch lockerer gelesen werden kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Härte. „Hurerei“ ist bewusst drastisch und biblisch geprägt, aber weiterhin allgemein verständlich; es vermeidet eine euphemistische Einebnung der Vorlage. Kurze Sätze machen die Abfolge von feindseliger Behandlung, Enteignung, Entblößung und öffentlicher Schande klar.
