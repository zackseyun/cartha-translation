base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/047.yaml
  text: And the assembly will stone them with stones and cut them down with their swords. They will kill their sons and their daughters[a], and burn their houses with fire.
translation:
  language: de
  text: Und die Versammlung wird sie mit Steinen steinigen und mit ihren Schwertern niederhauen.[a] Sie wird ihre Söhne und Töchter töten und ihre Häuser mit Feuer verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zerhauen“ oder „in Stücke hauen“.'
    reason: Das seltene Verb ברא bezeichnet hier ein Hauen mit Schwertern; wie stark das Ergebnis der Handlung lexikalisch auszudrücken ist, bleibt offen.
lexical_decisions:
- source_word: וְרָגְמוּ עֲלֵיהֶן אֶבֶן
  choice: wird sie mit Steinen steinigen
  rationale: רגם bezeichnet hier eine gewaltsame beziehungsweise gerichtliche Steinigung. Das singularische אֶבֶן ist kollektiv-instrumental gebraucht und wird im Deutschen natürlich mit dem Plural „Steinen“ wiedergegeben.
- source_word: קָהָל
  choice: die Versammlung
  rationale: קָהָל bezeichnet eine zusammengekommene Gruppe. „Versammlung“ bewahrt den formellen, kollektiven Charakter besser als „Menschenmenge“ oder „Pöbel“.
- source_word: וּבָרֵא אוֹתְהֶן
  choice: und sie … niederhauen
  rationale: Das seltene Verb ברא hat hier im Zusammenhang mit Schwertern den Sinn von hauen beziehungsweise zerhauen. „Niederhauen“ ist verständlich, bildkräftig und lässt den genauen Grad der Zerstückelung offen.
- source_word: בְּחַרְבוֹתָם
  choice: mit ihren Schwertern
  rationale: Das ב ist instrumental; der Plural mit Suffix bezeichnet die Schwerter der angreifenden Gruppe.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ihre Söhne und Töchter
  rationale: Der hebräische Text nennt beide Gruppen ausdrücklich; die Übersetzung fasst sie daher nicht lediglich als „Kinder“ zusammen.
- source_word: יַהֲרֹגוּ
  choice: werden sie töten
  rationale: הרג ist das gewöhnliche Verb für töten. Die Formulierung ist direkt und entspricht modernem Standarddeutsch.
- source_word: וּבָתֵּיהֶן בָּאֵשׁ יִשְׂרֹפוּ
  choice: und ihre Häuser im Feuer verbrennen
  rationale: Die konkrete Bezeichnung „Häuser“ bleibt erhalten; „im Feuer verbrennen“ gibt die ausdrücklich genannte Brandvernichtung natürlich wieder.
theological_decisions:
- issue: Bezug der femininen Pluralpronomen
  choice: Wiedergabe mit „sie“ und „ihre“, ohne die beiden Frauen erneut zu benennen
  alternative: „diese Frauen“ beziehungsweise ausdrückliche Nennung von Ohola und Oholiba
  rationale: Die femininen Pluralformen verweisen im Gleichnis auf Ohola und Oholiba. Die pronominale Wiedergabe bewahrt den Textzusammenhang, ohne eine erklärende Identifizierung in den Vers einzufügen.
- issue: Numerus der angreifenden Versammlung
  choice: „die Versammlung wird“ als grammatisch singularisches Kollektiv, danach pluralisches „sie“ für deren Mitglieder
  alternative: 'Durchgehend pluralisch: „Die Versammelten werden“'
  rationale: Der hebräische Text verbindet קָהָל mit pluralischen Handlungen beziehungsweise denkt die Gruppe samt ihren Mitgliedern. Der Wechsel im Deutschen wahrt sowohl das Kollektivnomen als auch die Mehrzahl der Handelnden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Darstellung der Gewalt. Die Wiederholung „mit Steinen steinigen“ bildet die hebräische instrumentale Wendung bewusst ab. Der Fußnotenmarker steht unmittelbar bei „niederhauen“, auf das sich die lexikalische Alternative bezieht.
