base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/032.yaml
  text: 'Thus says the Lord GOD: You will drink your sister’s cup[a], deep and wide; it will be for laughter and for mockery[b], for it holds much.'
translation:
  language: de
  text: 'So spricht der Herr Jahwe: Den tiefen und weiten Becher deiner Schwester[a] wirst du trinken. Er wird Anlass zu Gelächter und Spott geben, denn er fasst viel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Becher ist ein prophetisches Bild für den zugeteilten Anteil am Gericht.
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: אֲדֹנָי wird mit „der Herr“ wiedergegeben, der Gottesname יהוה mit der im Deutschen geläufigen Form „Jahwe“. So bleiben Titel und Eigenname unterscheidbar.
- source_word: כּוֹס אֲחוֹתֵךְ
  choice: den Becher deiner Schwester
  rationale: Die hebräische Genitivverbindung wird unmittelbar wiedergegeben. Das Bild des Bechers bleibt erhalten, statt deutend umschrieben zu werden.
- source_word: תִּשְׁתִּי
  choice: wirst du trinken
  rationale: Die feminine Singularform bezeichnet die angesprochene Frau beziehungsweise die durch sie dargestellte Stadt; im prophetischen Zusammenhang drückt das Imperfekt das bevorstehende, gewisse Geschehen aus.
- source_word: הָעֲמֻקָּה וְהָרְחָבָה
  choice: tief und weit
  rationale: Beide Adjektive beschreiben den Becher und unterstreichen sein großes Fassungsvermögen. „Weit“ hält die räumliche Bildsprache knapp und natürlich fest.
- source_word: תִּהְיֶה לִצְחֹק וּלְלַעַג
  choice: Er wird Anlass zu Gelächter und Spott sein
  rationale: Die feminine Verbform kann grammatisch auf den Becher zurückbezogen werden. „Anlass zu“ gibt die hebräische Wendung mit לְ natürlich wieder, ohne die Bildstruktur aufzulösen.
- source_word: מִרְבָּה לְהָכִיל
  choice: er fasst sehr viel
  rationale: Die knappe, ungewöhnliche hebräische Formulierung bezeichnet das große Fassungsvermögen des Bechers. Die deutsche Fassung bewahrt diesen konkreten Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Form macht sowohl den Herrschaftstitel אֲדֹנָי als auch den im Ausgangstext stehenden Gottesnamen יהוה sichtbar, ohne beide zu einem einzigen Titel zu verschmelzen.
- issue: Bezug von Gelächter und Spott
  choice: Der Becher wird Anlass zu Gelächter und Spott sein
  alternative: Die Angesprochene wird ausgelacht und verspottet werden
  rationale: Die Verbform תִּהְיֶה ist feminin Singular und kann formal auf כּוֹס, „Becher“, zurückgehen. Inhaltlich trifft der Spott durch das Trinken des Bechers die Angesprochene; eine Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Das konkrete Becherbild und die ungewöhnliche Verknüpfung mit Gelächter und Spott bleiben erhalten; die syntaktisch-semantische Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
