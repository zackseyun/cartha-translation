  naturalness: „Der Herr, Jahwe“ wirkt im modernen Standarddeutsch als Apposition mit Komma unnötig sperrig. „Der Herr Jahwe“ ist die natürliche, zugleich quellentreue Verbindung. „Anlass zu Gelächter und Spott geben“ ist idiomatischer als „Anlass ... sein“.
  terminology: „Jahwe“ bewahrt den Gottesnamen, während „Herr“ אֲדֹנָי wiedergibt. „Becher“ ist für כּוֹס passend und erhält das prophetische Bild. Die Fußnote zum Gerichtsbild sollte am Wort „Becher“ stehen, nicht am abschließenden Hinweis auf dessen Fassungsvermögen.
