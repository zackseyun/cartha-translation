base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/011.yaml
  text: When her sister Oholibah saw this[a], she became more corrupt in her lust than her sister, and in her prostitutions more than the prostitutions of her sister.
translation:
  language: de
  text: Als ihre Schwester Oholiba das sah,[a] war sie in ihrer Begierde noch verdorbener als jene, und ihre Hurerei übertraf die Hurerei ihrer Schwester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Da verdarb sie sich durch noch größere Begierde und noch mehr Hurerei als ihre Schwester.'
    reason: 'Lexikalisch-syntaktische Alternative: וַתַּשְׁחֵת kann in diesem Zusammenhang sinngemäß reflexiv verstanden werden; die beiden Vergleichsglieder können zusammengezogen wiedergegeben werden.'
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Als … das sah
  rationale: Das Verb bedeutet „sehen“; das im Hebräischen unausgesprochene Objekt wird aus dem Zusammenhang mit „das“ aufgenommen. „Als“ gibt den erzählerisch-zeitlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: אֲחוֹתָהּ אָהֳלִיבָה
  choice: ihre Schwester Oholiba
  rationale: Der Eigenname wird in gebräuchlicher deutscher Umschrift wiedergegeben; das appositionelle Verhältnis zu „ihre Schwester“ bleibt erhalten.
- source_word: וַתַּשְׁחֵת
  choice: ließ … noch mehr entarten
  rationale: Die Hifil-Form bezeichnet hier ein Verderben oder Entartenlassen. Die Formulierung erhält den transitiven Bezug auf „Begierde“ und „Hurerei“ und lässt zugleich die ungewöhnliche Ausdrucksweise des Hebräischen erkennen.
- source_word: עַגְבָתָהּ
  choice: ihre Begierde
  rationale: Das Substantiv bezeichnet in diesem Kontext leidenschaftliches, insbesondere sexuelles Verlangen. „Begierde“ wahrt die sexuelle und moralische Schärfe, ohne eine zusätzliche Deutung einzutragen.
- source_word: מִמֶּנָּה
  choice: noch mehr … als jene
  rationale: מִן kennzeichnet den Vergleich mit der zuvor genannten Schwester. „Jene“ vermeidet eine unklare Wiederholung des weiblichen Pronomens.
- source_word: תַּזְנוּתֶיהָ
  choice: ihre Hurerei
  rationale: Der Ausdruck bezeichnet das Huren beziehungsweise die Hurerei und trägt in diesem Kapitel zugleich die Bildsprache des Bundesbruchs. „Hurerei“ bewahrt die konkrete und anstößige prophetische Metapher.
- source_word: מִזְּנוּנֵי אֲחוֹתָהּ
  choice: noch mehr als die Hurerei ihrer Schwester
  rationale: Die Wendung setzt einen ausdrücklichen Vergleich mit den Taten der Schwester. Die Wiederholung von „Hurerei“ entspricht der hebräischen Wiederaufnahme und hält die Metapher sichtbar.
theological_decisions:
- issue: Sexuelle Untreue als Bild für den Bundesbruch
  choice: Die ausdrückliche Sprache von „Begierde“ und „Hurerei“ bleibt erhalten.
  alternative: Abstraktere Wiedergaben wie „Untreue“, „Abfall“ oder „Götzendienst“.
  rationale: Der hebräische Text verwendet bewusst drastische sexuelle Sprache für Samarias und Jerusalems Treuebruch. Eine abstrakte Wiedergabe würde die prophetische Bildkraft abschwächen und die Spannung zwischen konkreter Sexualsprache und theologischer Metapher vorschnell auflösen.
- issue: Mehrdeutigkeit der Form וַתַּשְׁחֵת und der Vergleichskonstruktion
  choice: Die Hauptfassung bezieht das Entartenlassen grammatisch auf „Begierde“ und „Hurerei“.
  alternative: 'Reflexiv verstehen: Oholiba verdarb sich selbst durch größere Begierde und mehr Hurerei als ihre Schwester.'
  rationale: Die Hifil-Form kann hier transitiv oder sinngemäß reflexiv aufgefasst werden. Die Hauptfassung folgt enger der vorhandenen Objektkonstruktion; die Fußnote bewahrt die sachlich mögliche reflexive Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst ungeschönter prophetischer Sprache. „Oholiba“ folgt der im Deutschen üblichen Form; „Hurerei“ ist deutlich, aber für den biblisch-prophetischen Zusammenhang angemessen.
