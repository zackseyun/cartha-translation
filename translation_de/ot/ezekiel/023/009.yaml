base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/009.yaml
  text: Therefore I gave her into the hand of her lovers[a], into the hand of the sons of Assyria[b], for whom she lusted.
translation:
  language: de
  text: Darum gab ich sie in die Gewalt ihrer Liebhaber, in die Gewalt der Assyrer[a], nach denen sie begehrte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: der Söhne Assurs.'
