  - marker: b
    text: 'Oder: nach denen sie lüstern war. Das hebräische Verb bezeichnet hier in der Ehebruchsmetapher ein starkes, erotisch gefärbtes Verlangen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den Folgeschluss von der vorausgehenden Anklage zum angekündigten Gericht knapp und natürlich.
- source_word: נְתַתִּיהָ בְּיַד
  choice: gab ich sie in die Gewalt
  rationale: Gibt die hebräische Wendung נתן ביד sinngenau als Auslieferung in fremde Macht wieder; das im Deutschen unnatürliche „in die Hand“ wird vermieden.
- source_word: מְאַהֲבֶיהָ
  choice: ihrer Liebhaber
  rationale: Bewahrt das bewusst sexuelle Bild für Oholas unerlaubte politische Beziehungen.
- source_word: בְּנֵי אַשּׁוּר
  choice: der Söhne Assurs
  rationale: Erhält die konkrete Form der hebräischen Herkunftsbezeichnung; idiomatisch sind damit die Assyrer gemeint.
- source_word: עָגְבָה עֲלֵיהֶם
  choice: nach denen sie voller Verlangen gewesen war
  rationale: Bringt die starke, erotisch gefärbte Begierde des Verbs עגב zum Ausdruck und macht durch das Plusquamperfekt deutlich, dass dieses Verlangen der Auslieferung vorausging, ohne die Metapher unnötig zu vergröbern.
theological_decisions:
- issue: Sexuelle Metapher für Oholas politische und bundesmäßige Untreue
  choice: Die Bildsprache wird mit „Liebhaber“ und „voller Verlangen“ beibehalten.
  alternative: Interpretierend mit „Verbündete“ und „sich um Bündnisse bemühen“ übersetzen.
  rationale: Der hebräische Text stellt die politischen Verbindungen bewusst als ehebrecherisches Begehren dar. Eine rein politische Wiedergabe würde die prophetische Anklage abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In die Gewalt“ macht die Macht- und Gerichtsdimension des Idioms verständlich; „Söhne Assurs“ bewahrt mit erklärender Fußnote die hebräische Ausdrucksweise. Die kräftige sexuelle Bildsprache bleibt erhalten, wird im Haupttext jedoch natürlich und nicht unnötig drastisch formuliert.
