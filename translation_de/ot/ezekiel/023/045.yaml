source:
  edition: WLC
  text: וַ/אֲנָשִׁ֣ים צַדִּיקִ֗ם הֵ֚מָּה יִשְׁפְּט֣וּ אֽוֹתְ/הֶ֔ם מִשְׁפַּט֙ נֹֽאֲפ֔וֹת וּ/מִשְׁפַּ֖ט שֹׁפְכ֣וֹת דָּ֑ם כִּ֤י נֹֽאֲפֹת֙ הֵ֔נָּה וְ/דָ֖ם בִּֽ/ידֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/045.yaml
  text: But righteous men will judge them with the judgment of adulteresses and with the judgment of women who shed blood[a], because they are adulteresses[b], and blood is on their hands.
translation:
  language: de
  text: Aber gerechte Männer werden sie richten nach dem Recht für Ehebrecherinnen und nach dem Recht für Frauen, die Blut vergießen[a]; denn sie sind Ehebrecherinnen, und Blut ist an ihren Händen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Urteil über Ehebrecherinnen und über Frauen, die Blut vergießen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Blut ist in ihren Händen“; gemeint ist ihre Schuld am Blutvergießen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשִׁים צַדִּיקִם
  choice: Aber gerechte Männer
  rationale: אֲנָשִׁים ist ausdrücklich maskulin und bezeichnet hier im Rechtsbild menschliche Urteilende; צַדִּיקִם trägt sowohl moralischen als auch rechtlichen Sinn. Das kontextuell adversative „Aber“ gibt ו natürlich wieder.
- source_word: הֵמָּה יִשְׁפְּטוּ אֹתְהֶם
  choice: werden sie richten
  rationale: Der selbstständige Pluralpronominalausdruck hebt die genannten gerechten Männer hervor; im Deutschen ist diese Hervorhebung durch die vorangestellte Benennung hinreichend erkennbar. Das Imperfekt wird im prophetischen Zusammenhang futurisch wiedergegeben.
- source_word: מִשְׁפַּט נֹאֲפוֹת
  choice: nach dem Recht für Ehebrecherinnen
  rationale: Die Konstruktion kann das für Ehebrecherinnen geltende Urteil beziehungsweise Rechtsmaß bezeichnen. „Nach dem Recht für“ bewahrt den forensischen Klang und ist im modernen Deutschen verständlicher als eine wörtliche Genitivfügung.
- source_word: וּמִשְׁפַּט שֹׁפְכוֹת דָּם
  choice: und nach dem Recht für Frauen, die Blut vergießen
  rationale: Das feminine Partizip bezeichnet Frauen als Blutvergießerinnen. Die Relativsatzform ist natürlich und bewahrt Geschlecht und Handlung.
- source_word: כִּי נֹאֲפֹת הֵנָּה
  choice: denn sie sind Ehebrecherinnen
  rationale: כִּי begründet das angekündigte Urteil. „Ehebrecherinnen“ erhält die konkrete rechtlich-moralische Kategorie des substantivierten femininen Ausdrucks.
- source_word: וְדָם בִּידֵיהֶן
  choice: und Blut klebt an ihren Händen
  rationale: Wörtlich steht Blut „in ihren Händen“. Die deutsche Wendung „Blut klebt an ihren Händen“ erhält das Bild und vermittelt zugleich die Schuld am Blutvergießen.
theological_decisions:
- issue: Identität der richtenden Personen
  choice: „gerechte Männer“ bleibt als menschlich formulierte Gruppe von Urteilenden stehen
  alternative: Deutung als himmlische oder idealisierte Vollstrecker des göttlichen Gerichts
  rationale: Der hebräische Text bezeichnet sie ausdrücklich als gerechte Männer, legt ihre genaue Identität in diesem Vers aber nicht weiter fest. Die Übersetzung vermeidet deshalb eine theologische Präzisierung.
- issue: Art des Gerichtsmaßstabs
  choice: „nach dem Recht für“
  alternative: „mit dem Urteil über“ beziehungsweise „wie Ehebrecherinnen ... gerichtet werden“
  rationale: Die Wiedergabe hält offen, ob מִשְׁפַּט stärker das Urteil, die Rechtssache oder den geltenden Rechtsmaßstab bezeichnet, und bewahrt den juristischen Ton.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlich juristischem Ton. Die feminine Bezeichnung der beiden symbolischen Frauen beziehungsweise Städte bleibt erhalten; die Bildsprache wird nicht konfessionell oder allegorisch weitergedeutet.
