source:
  edition: WLC
  text: וְ/ק֣וֹל הָמוֹן֮ שָׁלֵ֣ו בָ/הּ֒ וְ/אֶל אֲנָשִׁים֙ מֵ/רֹ֣ב אָדָ֔ם מוּבָאִ֥ים סובאים מִ/מִּדְבָּ֑ר וַֽ/יִּתְּנ֤וּ צְמִידִים֙ אֶל יְדֵי/הֶ֔ן וַ/עֲטֶ֥רֶת תִּפְאֶ֖רֶת עַל רָאשֵׁי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/042.yaml
  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
translation:
  language: de
  text: Und der Klang einer sorglosen Menge war in ihr[a]. Zu den Männern aus der Masse der Menschen wurden Zecher aus der Wüste herbeigebracht[b]. Sie legten ihnen Armreifen um die Handgelenke und prächtige Kronen auf ihre Köpfe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Lärm einer unbekümmerten Menge erfüllte sie“; auch der Sinn „einer selbstzufriedenen Menge“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut dieses Satzes ist schwierig. Er kann auch etwa so verstanden werden: „Und Männer aus der Masse der Menschen, Zecher aus der Wüste, wurden herbeigebracht.“ Eine abweichende Lesung versteht das Wort für „Zecher“ als „Sabäer“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „eine Krone der Pracht“; gemeint sein kann für jede Frau eine prächtige Krone.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הָמוֹן
  choice: Stimmengewirr einer Menge
  rationale: Die Verbindung bezeichnet die hörbare Geräuschkulisse einer großen Schar. „Stimmengewirr“ gibt sowohl קוֹל als auch den möglichen lärmenden Beiklang von הָמוֹן natürlich wieder.
- source_word: שָׁלֵו
  choice: sorglos
  rationale: Das Adjektiv kann Ruhe, Sicherheit oder selbstzufriedene Sorglosigkeit ausdrücken. „Sorglos“ passt zum ausgelassenen und moralisch negativen Kontext, ohne die Bedeutung zu stark festzulegen.
- source_word: בָהּ
  choice: in ihr
  rationale: Die feminine Form hält die im Kapitel durchgeführte Darstellung der Stadt als Frau aufrecht.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Der Ausdruck ist hier maskulin und bezeichnet im Kontext die männlichen Besucher beziehungsweise Liebhaber.
- source_word: מֵרֹב אָדָם
  choice: aus der großen Menschenmenge
  rationale: Die schwierige, knappe Wendung wird möglichst nah am Wortlaut wiedergegeben; רֹב bezeichnet hier eine große Menge und אָדָם Menschen beziehungsweise Menschheit.
- source_word: מוּבָאִים
  choice: wurden ... herbeigebracht
  rationale: Die passive Form von בוא bezeichnet, dass Personen von anderswo in die Szene gebracht wurden.
- source_word: סובאים
  choice: Zecher
  rationale: Die Textüberlieferung ist schwierig; die traditionelle Lesung wird gewöhnlich auf trinkende oder betrunkene Männer bezogen. „Zecher“ bewahrt diesen Sinn in knapper, würdiger Sprache.
- source_word: מִמִּדְבָּר
  choice: aus der Wüste
  rationale: מִדְבָּר bezeichnet Wüste oder Wildnis; „Wüste“ ist hier die klare und geläufige Wiedergabe.
- source_word: צְמִידִים אֶל יְדֵיהֶן
  choice: Armreifen um die Handgelenke
  rationale: צְמִידִים sind Schmuckreifen; obwohl יָד wörtlich „Hand“ heißt, bezeichnet die deutsche Formulierung mit den Handgelenken idiomatisch den Ort, an dem solche Reifen getragen werden.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: prächtige Kronen
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich „Krone der Pracht/Schönheit“. „Prächtige Kronen“ ist natürlich und erhält den schmückenden Sinn.
- source_word: רָאשֵׁיהֶן
  choice: auf den Kopf
  rationale: Der hebräische Plural meint distributiv den Kopf jeder der genannten Frauen; der deutsche Singular ist in dieser Konstruktion idiomatisch.
theological_decisions:
- issue: Bezug der weiblichen Pluralpronomen in יְדֵיהֶן und רָאשֵׁיהֶן
  choice: „ihnen ... die Handgelenke“ und „auf den Kopf“ bezieht sich auf die beiden als Frauen dargestellten Städte
  alternative: Bezug auf die herbeigebrachten Männer
  rationale: Die femininen Pluralformen verweisen grammatisch auf die beiden Frauen Oholah und Oholibah im Gleichnis. Die deutsche Formulierung wahrt diesen Bezug, ohne ihn durch erklärende Zusätze auszudeuten.
- issue: Syntax des schwierigen Mittelteils
  choice: Die Zecher werden zu den Männern aus der großen Menschenmenge herbeigebracht
  alternative: Die Männer selbst werden aus der Menschenmenge beziehungsweise als Zecher aus der Wüste herbeigebracht
  rationale: Der masoretische Wortlaut ist syntaktisch schwierig. Die gewählte Fassung folgt einer möglichen Zuordnung von מוּבָאִים סובאים, lässt aber die alternative Gliederung ausdrücklich in der Fußnote stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache der personifizierten Städte bleibt erhalten. Die schwierige Syntax des Mittelteils wird lesbar formuliert, aber nicht stillschweigend vereindeutigt; eine ernsthafte Alternative steht in Fußnote [b].
