base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/005.yaml
  text: Oholah played the prostitute while under me[a], and she lusted after her lovers[c][b], the Assyrians who were nearby.
translation:
  language: de
  text: Ohola trieb Hurerei, während sie mir unterstand[a], und begehrte leidenschaftlich ihre Liebhaber[b], die Assyrer, die nahe waren[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter mir“. Gemeint sein kann auch: „während sie unter meiner Herrschaft stand“ oder „während sie mir gehörte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „war vernarrt in“ beziehungsweise „verlangte begierig nach“. Das hebräische Verb bezeichnet starkes, lustvolles Begehren.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die nahen Assyrer“ beziehungsweise „die Assyrer in der Nähe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזֶן
  choice: trieb Hurerei
  rationale: Die Formulierung bewahrt das ausdrücklich sexuelle und anstößige Bild, mit dem Ezechiel Untreue gegenüber Gott und die Hinwendung zu fremden Mächten beschreibt, ohne es auf politische Bündnisse zu reduzieren.
- source_word: אָהֳלָה
  choice: Ohola
  rationale: Der Eigenname wird in einer im Deutschen geläufigen, hebräisch nahen Form wiedergegeben.
- source_word: תַּחְתָּי
  choice: obwohl sie mir unterstand
  rationale: תחת mit dem Suffix der ersten Person bezeichnet hier ihre Stellung unter Gottes Anspruch und Herrschaft. Die konzessive Formulierung macht im Deutschen den im Zusammenhang liegenden Gegensatz verständlich, ohne die Wendung in ein bloßes Besitzverhältnis aufzulösen.
- source_word: וַתַּעְגַּב
  choice: begehrte leidenschaftlich
  rationale: עגב bezeichnet hier starkes, sexuell gefärbtes Verlangen. Die Wiedergabe erhält Intensität und negative Färbung, klingt aber in modernem Standarddeutsch natürlich.
- source_word: מְאַהֲבֶיהָ
  choice: ihre Liebhaber
  rationale: Die substantivisch gebrauchte Form bezeichnet im Ehebruchsbild ihre unerlaubten Partner und zugleich die fremden Mächte, auf die sie sich stützte.
- source_word: אֶל אַשּׁוּר
  choice: die Assyrer
  rationale: אשור kann Assyrien oder, wie hier aufgrund des folgenden maskulinen Plurals קְרוֹבִים, die Assyrer bezeichnen. Die Apposition zu „ihre Liebhaber“ ergibt im Deutschen einen klaren Satz.
- source_word: קְרוֹבִים
  choice: in ihrer Nähe
  rationale: Der maskuline Plural kennzeichnet die Assyrer wahrscheinlich als die Nahen beziehungsweise nahe Befindlichen. Die Formulierung wahrt den vorwiegend räumlichen Sinn und vermeidet die stärkere relationale Deutung „Nachbarn“.
theological_decisions:
- issue: Ehebruchs- und Prostitutionsmetapher für Samarias Untreue und ihre auswärtigen Bündnisse
  choice: Das sexuelle Bild wird mit „trieb Hurerei“, „begehrte leidenschaftlich“ und „Liebhaber“ ausdrücklich beibehalten.
  alternative: „wurde untreu“ oder „suchte ausländische Verbündete“
  rationale: Der hebräische Text verbindet Götzendienst und politische Abhängigkeit bewusst mit schockierender sexueller Bildsprache. Eine rein politische oder allgemein moralische Umschreibung würde seine prophetische Schärfe mindern.
- issue: Bedeutung von תַּחְתָּי innerhalb des Ehebildes
  choice: „obwohl sie mir unterstand“
  alternative: „während sie unter mir war“ oder „obwohl sie mir gehörte“
  rationale: Die gewählte Fassung erhält Gottes Anspruch und Autorität, ohne eindeutig festzulegen, ob besonders Herrschaft, Schutz oder eheliche Zugehörigkeit gemeint ist; die Alternativen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-prophetischem Ton. Die bewusst drastische Sexualmetaphorik des Ausgangstextes wird nicht beschönigt. „Hurerei“ ist markiert und kräftig, hier aber wegen der Bildwelt des Textes sachlich angemessen; archaischere Wendungen wie „huren“ werden vermieden.
