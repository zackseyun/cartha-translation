  source_fidelity: 'Der deutsche Text gibt die hebräische Syntax und Bildsprache zuverlässig wieder: בְּדֶרֶךְ ... הָלָכְתְּ als „auf dem Weg ... gegangen“, die Schwester-Metapher, den unbestimmten bildhaften „Becher“ sowie die Übergabe „in deine Hand“. „Deshalb“ macht die im Kontext naheliegende Folgebeziehung des וְ deutlich, ohne den Sinn unzulässig einzuengen.'
  naturalness: „Du bist auf dem Weg deiner Schwester gegangen; deshalb werde ich ihren Becher in deine Hand geben“ ist verständliches, würdiges modernes Standarddeutsch. Die Formulierung bewahrt den prophetischen Ton, ohne unnötig altertümlich zu wirken.
  terminology: „Schwester“ und „Becher“ erhalten die allegorische bzw. gerichtliche Metaphorik des Ausgangstextes. Der Becher wird im Haupttext zu Recht nicht als Gericht oder Zorn ausgedeutet. „In deine Hand geben“ ist eine etablierte deutsche Übergabeformel und passt zu נתן.
