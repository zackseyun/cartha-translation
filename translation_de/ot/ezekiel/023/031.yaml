id: EZK.23.31
reference: Ezekiel 23:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/דֶ֥רֶךְ אֲחוֹתֵ֖/ךְ הָלָ֑כְתְּ וְ/נָתַתִּ֥י כוֹסָ֖/הּ בְּ/יָדֵֽ/ךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/031.yaml
  text: You have walked in the way of your sister[a], so I will put her cup into your hand.
translation:
  language: de
  text: Du bist auf dem Weg deiner Schwester gegangen; deshalb werde ich ihren Becher in deine Hand geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּדֶרֶךְ
  choice: auf dem Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg oder eine Lebensweise. Die deutsche Wendung bewahrt das hebräische Bild und ist zugleich natürlich verständlich.
- source_word: אֲחוֹתֵךְ
  choice: deiner Schwester
  rationale: Der wörtliche Verwandtschaftsbegriff bleibt erhalten, da die umliegende Allegorie Städte als Schwestern darstellt.
- source_word: הָלָכְתְּ
  choice: bist … gegangen
  rationale: הלך bedeutet gehen oder wandeln und bezeichnet hier bildlich das Verhalten. Das Perfekt gibt die abgeschlossene Handlung mit gegenwärtiger Folge wieder.
- source_word: וְנָתַתִּי
  choice: deshalb werde ich … geben
  rationale: נתן bedeutet geben, setzen oder legen. In Verbindung mit einem Becher und der Hand ist „in deine Hand geben“ idiomatisches Deutsch; „deshalb“ verdeutlicht den aus dem Zusammenhang hervorgehenden Folgezusammenhang.
- source_word: כוֹסָהּ
  choice: ihren Becher
  rationale: Das Bild des Bechers bleibt wie im Hebräischen unausgedeutet erhalten; im Kontext steht er für das ihrer Schwester zugemessene Gericht.
- source_word: בְּיָדֵךְ
  choice: in deine Hand
  rationale: Die wörtliche Präposition בְּ kann hier im Deutschen natürlich mit „in“ wiedergegeben werden und bezeichnet die Übergabe in ihren Besitz beziehungsweise ihre Gewalt.
theological_decisions:
- issue: Bild vom Gerichtsbecher
  choice: Das Bild „ihren Becher“ bleibt im Haupttext ohne erläuternden Zusatz stehen.
  alternative: „ihren Becher des Gerichts“ oder „den Becher ihrer Strafe“
  rationale: Der Kontext kennzeichnet den Becher als Bild des Gerichts, doch der hebräische Vers selbst sagt nur „ihren Becher“. Die knappe Metapher bewahrt die prophetische Bildsprache und vermeidet eine überdeutende Paraphrase.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Bildsprache, ohne unnatürlich wörtlich zu klingen. Auf eine Fußnote wurde verzichtet, weil der vom englischen Text gesetzte Marker nach „Schwester“ die Erklärung sachlich eher auf den Becher bezieht und dadurch missverständlich platziert wäre.
