  text: בֶּן אָדָ֑ם שְׁתַּ֣יִם נָשִׁ֔ים בְּנ֥וֹת אֵם אַחַ֖ת הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/002.yaml
  text: Son of man[a], there were two women, daughters of one mother.
translation:
  language: de
  text: Menschensohn, es waren zwei Frauen, Töchter einer Mutter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Dies ist die für Ezechiel typische Anrede. „Menschensohn“ bewahrt die hebräische Ausdrucksweise und ist im Deutschen als prophetische Anrede etabliert.
- source_word: שְׁתַּיִם נָשִׁים
  choice: zwei Frauen
  rationale: Die Wortgruppe bezeichnet schlicht zwei Frauen. „Ehefrauen“ würde die im weiteren Zusammenhang entfaltete Ehemetaphorik zu früh in diesen Vers eintragen.
- source_word: בְּנוֹת אֵם אַחַת
  choice: Töchter derselben Mutter
  rationale: Wörtlich steht „Töchter einer Mutter“. Die gewählte deutsche Form gibt den gemeinten gemeinsamen mütterlichen Ursprung natürlich und präzise wieder.
- source_word: הָיוּ
  choice: da waren
  rationale: Die Existenzangabe wird im Deutschen mit „da waren“ natürlich wiedergegeben und schließt unmittelbar an die Anrede an.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Einleitung und die Bildsprache des Ausgangstextes bleiben erhalten; die Frauen werden nicht vorzeitig als Ehefrauen identifiziert.
