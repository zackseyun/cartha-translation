source:
  edition: WLC
  text: וְ/נָתַתִּ֨י קִנְאָתִ֜/י בָּ֗/ךְ וְ/עָשׂ֤וּ אוֹתָ/ךְ֙ בְּ/חֵמָ֔ה אַפֵּ֤/ךְ וְ/אָזְנַ֨יִ/ךְ֙ יָסִ֔ירוּ וְ/אַחֲרִיתֵ֖/ךְ בַּ/חֶ֣רֶב תִּפּ֑וֹל הֵ֗מָּה בָּנַ֤יִ/ךְ וּ/בְנוֹתַ֨יִ/ךְ֙ יִקָּ֔חוּ וְ/אַחֲרִיתֵ֖/ךְ תֵּאָכֵ֥ל בָּ/אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/025.yaml
  text: I will set my jealousy against you[a], and they will deal with you in wrath. They will remove your nose and your ears, and your survivors will fall by the sword. They will take your sons and your daughters[b], and your remnant will be consumed by fire.
translation:
  language: de
  text: Ich werde meine Eifersucht gegen dich richten, und sie werden im Zorn mit dir verfahren. Sie werden dir Nase und Ohren entfernen[a], und dein Rest wird durch das Schwert fallen. Sie selbst werden deine Söhne und Töchter mitnehmen, und dein Rest wird vom Feuer verzehrt werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlicher „entfernen“ oder „wegnehmen“. Im Zusammenhang kann damit das Abschneiden als Verstümmelung gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: Oder „dein Ende“ oder „was von dir übrig bleibt“. Derselbe hebräische Ausdruck steht auch zuvor im Vers; er kann den Rest, Überlebende oder das Verbliebene bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי קִנְאָתִי בָּךְ
  choice: Ich werde meine Eifersucht gegen dich richten
  rationale: נתן bedeutet grundsätzlich „geben, setzen, richten“; zusammen mit קִנְאָה und בְּ bezeichnet die Wendung hier eine gegen die Angesprochene gerichtete Eifersucht. „Eifersucht“ bewahrt den Beziehungs- und Untreuekontext des Kapitels besser als das allgemeinere „Eifer“.
- source_word: וְעָשׂוּ אוֹתָךְ בְּחֵמָה
  choice: sie werden im Zorn mit dir verfahren
  rationale: Die idiomatische deutsche Formulierung gibt das Handeln der feindlichen Vollstrecker in חֵמָה („Zorn, Grimm, Wut“) klar und würdevoll wieder.
- source_word: אַפֵּךְ וְאָזְנַיִךְ יָסִירוּ
  choice: Sie werden dir Nase und Ohren abschneiden
  rationale: Das Hifil von סור heißt lexikalisch „entfernen, wegnehmen“. Bei Nase und Ohren legt der Straf- und Verstümmelungskontext das Abschneiden als konkrete Handlung nahe; die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
- source_word: וְאַחֲרִיתֵךְ
  choice: was von dir übrig bleibt
  rationale: אַחֲרִית kann „Ende, spätere Zukunft“ oder „Rest“ bezeichnen. Die offene Formulierung passt an beiden Stellen, erhält die auffällige Wiederholung und legt nicht unnötig fest, ob ausschließlich Überlebende oder der gesamte verbleibende Rest gemeint ist.
- source_word: בַּחֶרֶב תִּפּוֹל
  choice: wird durch das Schwert fallen
  rationale: Die traditionelle deutsche Wendung gibt Tod durch Krieg oder Hinrichtung wieder, ohne einen Täter hinzuzufügen.
- source_word: הֵמָּה ... יִקָּחוּ
  choice: Sie selbst werden ... mitnehmen
  rationale: „Sie selbst“ bildet das hervorgehobene unabhängige Pronomen הֵמָּה ab. „Mitnehmen“ lässt im Eroberungskontext Gefangennahme beziehungsweise Verschleppung erkennen, ohne das Ziel zu ergänzen.
- source_word: תֵּאָכֵל בָּאֵשׁ
  choice: wird vom Feuer verzehrt werden
  rationale: Das Nifal von אכל ist hier passiv („gefressen/verzehrt werden“). „Vom Feuer verzehrt werden“ bewahrt das Bild und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bundesbezogene Strafemotion in קִנְאָה
  choice: meine Eifersucht
  alternative: meinen Eifer
  rationale: Die Ehe- und Untreuemetaphorik des Kapitels spricht für „Eifersucht“. Dadurch bleibt die Spannung zwischen persönlicher Beziehung, verletzter Treue und Gericht erhalten, statt zu einem allgemeinen göttlichen Eifer verflacht zu werden.
- issue: Bezug von אַחֲרִיתֵךְ
  choice: was von dir übrig bleibt
  alternative: dein Ende; deine Überlebenden; dein Rest
  rationale: Die gewählte Wendung bewahrt die mögliche kollektive und sachliche Weite des Ausdrucks. Sie entscheidet nicht dogmatisch, ob nur Personen, Nachkommenschaft oder alles Verbliebene gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gerichtswort, während „mit dir verfahren“ und „was von dir übrig bleibt“ für heutige Leser verständlich sind. Die Wiederholung des hebräischen אַחֲרִיתֵךְ wird bewusst identisch wiedergegeben.
