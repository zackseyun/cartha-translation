  source_fidelity: Die Übersetzung gibt die kausative Aussage von וְהִשְׁבַּתִּי treffend mit „ein Ende machen“ wieder. „Schandtat“ und die abschließende Formulierung „so schändlich handeln“ erfassen den im Kontext sexuell-moralisch geprägten, verurteilenden Sinn von זִמָּה, ohne die Bildsprache weiter auszudeuten. „Im Land“ ist als idiomatische Wiedergabe der mit מִן bezeichneten Beseitigung aus diesem Bereich vertretbar. Die feminine Pluralform und das feminine Pluralsuffix bleiben mit „alle Frauen“ und „ihr“ erhalten. Die Wiedergabe von וְנִוַּסְּרוּ als Warnung ist kontextuell möglich; die Fußnote bewahrt zutreffend die strafend-korrigierende Bedeutungsseite.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Das Futurpassiv „werden gewarnt werden“ ist etwas schwerer als eine rein idiomatische Umschreibung, bildet aber die passive Verbform und die Zukunftsaussage klar ab und ist im vorliegenden knappen Gerichtswort angemessen.
  terminology: „Schandtat“ wahrt den moralisch verurteilenden Registerton; „schändlich handeln“ stellt den Vergleich am Satzende natürlich dar. Die Alternativen „gezüchtigt“ und „zurechtgewiesen“ in der Fußnote sind sachgerecht und vermeiden eine einseitige Festlegung auf bloße Warnung.
