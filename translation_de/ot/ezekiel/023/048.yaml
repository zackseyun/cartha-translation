  yaml_path: translation/ot/ezekiel/023/048.yaml
  text: Thus I will put an end to lewdness in the land[a], and all women will be warned and will not act according to your lewdness.
translation:
  language: de
  text: So werde ich der Schandtat im Land ein Ende machen, und alle Frauen werden gewarnt werden[a] und nicht so schändlich handeln wie ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden gezüchtigt« beziehungsweise »werden zurechtgewiesen«. Das hebräische Verb kann sowohl eine Warnung durch ein abschreckendes Beispiel als auch Zurechtweisung durch Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: So werde ich … ein Ende machen
  rationale: Der Hifil von שׁבת bezeichnet das Veranlassen eines Endes; die deutsche Wendung gibt den kausativen Sinn natürlich wieder.
- source_word: זִמָּה
  choice: Schandtat / schändlich handeln
  rationale: זִמָּה bezeichnet hier das sexuell und moralisch anstößige Verhalten der beiden symbolischen Frauen. „Schandtat“ bewahrt den verurteilenden und beschämenden Ton; in der Schlusswendung wird derselbe Wortstamm idiomatisch verbal wiedergegeben.
- source_word: מִן הָאָרֶץ
  choice: im Land
  rationale: Wörtlich steht „aus dem Land“; zusammen mit „ein Ende machen“ bezeichnet die Präpositionalphrase den Bereich, in dem die Schandtat beseitigt wird. „Im Land“ ist im Deutschen idiomatisch.
- source_word: וְנִוַּסְּרוּ
  choice: werden gewarnt werden
  rationale: Der Pual von יסר kann Zurechtweisung oder Züchtigung durch Strafe bezeichnen. Im Zusammenhang dient das Gericht als abschreckendes Beispiel; „gewarnt werden“ gibt diese Wirkung wieder, während die Fußnote die stärkere Alternative festhält.
- source_word: כָּל הַנָּשִׁים
  choice: alle Frauen
  rationale: Die ausdrücklich feminine Pluralform wird geschlechtsgenau und ohne interpretierende Ausweitung wiedergegeben.
- source_word: וְלֹא תַעֲשֶׂינָה כְּזִמַּתְכֶנָה
  choice: und nicht so schändlich handeln wie ihr
  rationale: Die Vergleichspartikel כ wird mit „so … wie“ wiedergegeben. Das feminine Suffix der zweiten Person Plural erscheint als „ihr“ und richtet sich an die beiden zuvor angeredeten Frauen.
theological_decisions:
- issue: Bezug und Funktion von „allen Frauen“ in einem Gerichtswort mit weiblicher Bildsprache
  choice: Die Formulierung wird unmittelbar als „alle Frauen“ übersetzt.
  alternative: „alle Bewohner des Landes“ oder eine Beschränkung auf die beiden symbolischen Schwestern
  rationale: Der hebräische Text nennt ausdrücklich alle Frauen. Die Übersetzung bewahrt die prophetische Bildsprache und lässt ihren weiteren Geltungsbereich offen.
- issue: Bedeutung der passiven Form וְנִוַּסְּרוּ
  choice: „werden gewarnt werden“ mit Fußnote
  alternative: „werden gezüchtigt werden“ oder „werden zurechtgewiesen werden“
  rationale: Der Folgesatz hebt die abschreckende Wirkung des Gerichts hervor. Zugleich darf der mögliche Sinn einer strafenden Zurechtweisung nicht verschwinden und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schandtat“ trägt den sexuellen und moralischen Kontext, ohne unnötig derbe Sprache zu verwenden. Die Wiederholung von זִמָּה wird im Deutschen durch „Schandtat“ und „schändlich handeln“ semantisch bewahrt, aber idiomatisch gestaltet.
