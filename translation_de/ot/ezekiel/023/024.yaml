  text: וּ/בָ֣אוּ עָלַ֡יִ/ךְ הֹ֠צֶן רֶ֤כֶב וְ/גַלְגַּל֙ וּ/בִ/קְהַ֣ל עַמִּ֔ים צִנָּ֤ה וּ/מָגֵן֙ וְ/קוֹבַ֔ע יָשִׂ֥ימוּ עָלַ֖יִ/ךְ סָבִ֑יב וְ/נָתַתִּ֤י לִ/פְנֵי/הֶם֙ מִשְׁפָּ֔ט וּ/שְׁפָט֖וּ/ךְ בְּ/מִשְׁפְּטֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/024.yaml
  text: They will come against you with troops, chariots, and wagons, and with an assembly of peoples. They will set shield and buckler and helmet against you on every side, and I will set judgment before them, and they will judge you by their judgments.
translation:
  language: de
  text: Sie werden mit Truppen[a], Streitwagen und Wagen und mit einem Aufgebot von Völkern gegen dich anrücken. Rings um dich werden sie Großschild, Schild und Helm aufstellen. Ich werde ihnen das Gericht vorlegen, und sie werden dich nach ihren Rechtsmaßstäben richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hier verwendeten seltenen hebräischen Wortes ist unsicher; möglich sind auch „Waffen“ oder „Ausrüstung“.
    reason: Kennzeichnet die echte lexikalische Unsicherheit bei הֹצֶן, ohne eine bestimmte Deutung im Haupttext als sicher auszugeben.
lexical_decisions:
- source_word: הֹצֶן
  choice: Truppen
  rationale: Das seltene und in seiner Bedeutung unsichere Wort steht in einer Aufzählung militärischer Kräfte beziehungsweise Ausrüstung. „Truppen“ folgt der im konsultierten Text gewählten Deutung, ohne eine bestimmte Waffengattung vorzutäuschen; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: רֶכֶב וְגַלְגַּל
  choice: Streitwagen und Wagen
  rationale: רֶכֶב bezeichnet hier militärische Streitwagen; גַלְגַּל bedeutet wörtlich „Rad“, wird im Zusammenhang jedoch kollektiv beziehungsweise metonymisch für rollende Wagen verstanden.
- source_word: קְהַל עַמִּים
  choice: Aufgebot vieler Völker
  rationale: קהל ist eine versammelte Menge oder ein Aufgebot. Im militärischen Zusammenhang gibt „Aufgebot“ die organisierte Versammlung natürlich wieder; das unbestimmte pluralische עמים wird idiomatisch als „vieler Völker“ ausgedrückt.
- source_word: צִנָּה וּמָגֵן וְקוֹבַע
  choice: Großschild, Schild und Helm
  rationale: צִנָּה bezeichnet wahrscheinlich einen größeren, den Körper stärker deckenden Schild, מָגֵן den allgemeineren oder kleineren Schild und קוֹבַע den Helm. Die Abstufung bleibt im Deutschen erkennbar.
- source_word: וְנָתַתִּי לִפְנֵיהֶם מִשְׁפָּט
  choice: Ich werde ihnen deinen Rechtsfall vorlegen
  rationale: Die Wendung bedeutet wörtlich, dass Gott „Recht/Gericht“ vor sie gibt. „Deinen Rechtsfall vorlegen“ bewahrt das forensische Bild und macht deutlich, dass die Angreifer als Gerichtsvollstrecker beziehungsweise Richter auftreten.
- source_word: בְּמִשְׁפְּטֵיהֶם
  choice: nach ihrem eigenen Recht
  rationale: Der Plural kann ihre Rechtsnormen, Urteile oder Gerichtsweisen bezeichnen. „Nach ihrem eigenen Recht“ erhält die Spannung, dass fremde Völker nach ihren Maßstäben richten, ohne dies auf einzelne Urteilssprüche zu verengen.
theological_decisions:
- issue: Gottes Gericht durch fremde Völker
  choice: Gott legt den Rechtsfall den angreifenden Völkern vor; sie richten nach ihrem eigenen Recht.
  alternative: Gott spricht selbst das Urteil, das die Völker lediglich vollstrecken.
  rationale: Der hebräische Satz unterscheidet Gottes Übergabe des מִשְׁפָּט von dem anschließenden Richten durch die Völker und betont ausdrücklich deren eigene מִשְׁפָּטִים. Diese Spannung wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bildsprache bleibt konkret, der forensische Schluss wird verständlich formuliert, ohne die Spannung zwischen Gottes Gericht und dem Richten nach fremdem Recht aufzulösen.
