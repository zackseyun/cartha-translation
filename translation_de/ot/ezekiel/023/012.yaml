  text: אֶל בְּנֵי֩ אַשּׁ֨וּר עָגָ֜בָה פַּח֨וֹת וּ/סְגָנִ֤ים קְרֹבִים֙ לְבֻשֵׁ֣י מִכְל֔וֹל פָּרָשִׁ֖ים רֹכְבֵ֣י סוּסִ֑ים בַּח֥וּרֵי חֶ֖מֶד כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
translation:
  language: de
  text: 'Sie begehrte voller Lust die Männer Assurs: Statthalter und Befehlshaber, Nahestehende[a], prächtig gekleidet, Reiter, die auf Pferden ritten – allesamt begehrenswerte junge Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Nahe“ oder „Nahestehende“. Gemeint sein können Personen aus dem unmittelbaren Umfeld oder engen Dienst; möglicherweise sind auch nahe gelegene Assyrer gemeint. Die genaue Bedeutung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָגָבָה
  choice: begehrte voller Lust
  rationale: Das Verb bezeichnet hier im Rahmen der sexualisierten Bildrede ein starkes erotisches Verlangen; die Formulierung wahrt diese Deutlichkeit in natürlichem Deutsch.
- source_word: בְּנֵי אַשּׁוּר
  choice: die Männer Assurs
  rationale: Wörtlich steht „Söhne Assurs“. „Männer Assurs“ gibt die idiomatische Volksbezeichnung verständlich wieder und bewahrt zugleich die personbezogene Ausdrucksweise.
- source_word: פַּחוֹת וּסְגָנִים
  choice: Statthalter und Befehlshaber
  rationale: Beide Wörter sind Amts- beziehungsweise Rangbezeichnungen. „Statthalter“ und „Befehlshaber“ unterscheiden die Titel, ohne eine später geprägte Verwaltungsterminologie aufzuzwingen.
- source_word: קְרֹבִים
  choice: Männer aus ihrer Nähe
  rationale: Grundbedeutung ist „Nahe/Nahestehende“. Die Wiedergabe lässt offen, ob räumliche Nähe, enger Dienst oder Zugehörigkeit zum unmittelbaren Umfeld gemeint ist; die schwierige Stelle wird zusätzlich erläutert.
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: prächtig gekleidet
  rationale: מִכְלוֹל bezeichnet hier vollständige, vollendete oder prachtvolle Ausstattung. Die deutsche Wendung vermittelt den beeindruckenden Gesamteindruck ohne unnötige technische Festlegung.
- source_word: פָּרָשִׁים רֹכְבֵי סוּסִים
  choice: Reiter hoch zu Ross
  rationale: Die kompakte deutsche Formulierung bewahrt sowohl das Reitermotiv als auch den ausdrücklichen Hinweis auf die Pferde, ohne schwerfällige Wiederholung.
- source_word: בַּחוּרֵי חֶמֶד כֻּלָּם
  choice: allesamt begehrenswerte junge Männer
  rationale: Die Formulierung erhält die zusammenfassende Betonung von כֻּלָּם und den erotisch wertenden Klang von חֶמֶד.
theological_decisions:
- issue: Sexualisierte Metaphorik für Samarias politische Hinwendung zu Assur
  choice: Die erotische Sprache wird unverhüllt als „begehrte voller Lust“ wiedergegeben.
  alternative: Die Aussage zu „war ihnen zugetan“ oder „verliebte sich“ abschwächen.
  rationale: Der hebräische Text setzt bewusst eine anstößig starke sexuelle Metapher ein. Eine Abschwächung würde die prophetische Spannung und Wertung vermindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst deutlicher erotischer Bildsprache. „Assur“ erhält den alttestamentlichen Ländernamen; die schwierige Bedeutung von קְרֹבִים wird nicht zu „Kriegern“ vereindeutigt. Der Gedankenstrich hebt die abschließende Zusammenfassung hervor.
