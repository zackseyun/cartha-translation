    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשֵׁי
  choice: gekleidet
  rationale: Das passive Partizip von לבשׁ beschreibt die Kleidung der genannten Männer; »gekleidet« bewahrt die attributive Aussage knapp und natürlich.
- source_word: תְכֵלֶת
  choice: Purpurblau
  rationale: Das Wort bezeichnet einen kostbaren blau- bis violettfarbigen Farbstoff beziehungsweise entsprechend gefärbten Stoff. »Purpurblau« hält die Farbspanne deutlicher offen als schlichtes »Blau«.
- source_word: פַּחוֹת
  choice: Statthalter
  rationale: Der Ausdruck bezeichnet ranghohe imperiale beziehungsweise regionale Amtsträger; »Statthalter« ist im historischen Kontext verständlich, ohne den Titel zu eng festzulegen.
- source_word: וּסְגָנִים
  choice: hohe Beamte
  rationale: Gemeint sind nachgeordnete, aber ranghohe Amts- oder Würdenträger. »Hohe Beamte« unterscheidet sie von den Statthaltern und vermeidet eine unsichere technische Festlegung.
- source_word: בַּחוּרֵי חֶמֶד
  choice: begehrenswerte junge Männer
  rationale: בַּחוּר bezeichnet junge Männer in der Blüte ihrer Kraft, חֶמֶד ihre anziehende und begehrenswerte Erscheinung. Die Wiedergabe erhält die erotische Färbung des Zusammenhangs.
- source_word: כֻּלָּם
  choice: allesamt
  rationale: »Allesamt« gibt den Nachdruck des Pronominalsuffixes wieder und fügt sich idiomatisch in die Aufzählung ein.
- source_word: פָּרָשִׁים
  choice: Reiter
  rationale: Das Wort bezeichnet berittene Männer, gegebenenfalls Reiterkrieger. »Reiter« ist direkt und vermeidet unnötige militärische Präzisierung.
- source_word: רֹכְבֵי סוּסִים
  choice: hoch zu Ross
  rationale: Die Wendung bezeichnet ausdrücklich das Reiten auf Pferden. »Hoch zu Ross« erhält die im Hebräischen nachdrückliche, teils redundante Beschreibung in einer natürlichen und würdigen deutschen Form.
