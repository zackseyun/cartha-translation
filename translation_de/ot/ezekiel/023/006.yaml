translation:
  language: de
  text: in Purpurblau gekleidet[a], Statthalter und hohe Beamte[b], allesamt begehrenswerte junge Männer[c], Reiter auf Pferden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Blau gekleidet«, »in Violett gekleidet«; תְכֵלֶת bezeichnet einen blau bis violett gefärbten Stoff.'
