  text: וְ/יָשַׁבְתְּ֙ עַל מִטָּ֣ה כְבוּדָּ֔ה וְ/שֻׁלְחָ֥ן עָר֖וּךְ לְ/פָנֶ֑י/הָ וּ/קְטָרְתִּ֥/י וְ/שַׁמְנִ֖/י שַׂ֥מְתְּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/041.yaml
  text: You sat on a splendid couch[a], with a table set before it, and on it you placed my incense and my oil.
translation:
  language: de
  text: Du saßt auf einem prächtigen Lager. Davor war ein Tisch gedeckt, und darauf stelltest du mein Räucherwerk und mein Öl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die femininen Suffixe in „davor“ und „darauf“ sind im Hebräischen in ihrem Bezug nicht sicher. Das erste kann auf die angeredete Frau statt auf das Lager bezogen werden („vor dir“). Auch das letzte kann auf die Frau oder das Lager bezogen werden; ein Bezug auf den Tisch ist wegen dessen grammatisch maskulinem Geschlecht im Hebräischen nicht unproblematisch.
    reason: alternative_reading
lexical_decisions:
- source_word: יָשַׁבְתְּ
  choice: du saßest
  rationale: Das Qal Perfekt 2. Person Singular feminin bezeichnet eine vergangene Handlung der angeredeten Frau. „Du saßest“ ist würdevoll und macht das Präteritum eindeutig.
- source_word: מִטָּה כְבוּדָּה
  choice: ein prächtiges Lager
  rationale: מִטָּה kann Bett, Liege oder Lager bezeichnen; im Bild einer luxuriös hergerichteten Szene passt „Lager“. כְבוּדָּה beschreibt es als stattlich oder prachtvoll.
- source_word: שֻׁלְחָן עָרוּךְ
  choice: ein Tisch war gedeckt
  rationale: Das passive Partizip עָרוּךְ bezeichnet einen hergerichteten beziehungsweise gedeckten Tisch. Die deutsche Formulierung ist natürlich und bewahrt das vorbereitete Festbild.
- source_word: לְפָנֶיהָ
  choice: davor
  rationale: Das feminine Suffix kann sich grammatisch auf das Lager oder auf die Frau beziehen. „Davor“ nimmt im Haupttext das unmittelbar vorausgehende Lager als räumlichen Bezug auf, ohne im Deutschen ein Genusproblem zu erzeugen.
- source_word: קְטָרְתִּי
  choice: mein Räucherwerk
  rationale: Das Suffix der 1. Person Singular ist ausdrücklich beibehalten. „Räucherwerk“ bezeichnet hier präziser als „Weihrauch“ die zum Räuchern bestimmte Substanz, ohne sie auf ein einzelnes Harz einzuengen.
- source_word: שַׁמְנִי
  choice: mein Öl
  rationale: Die knappe Wiedergabe entspricht dem allgemeinen hebräischen Wort für Öl und vermeidet die nicht ausdrücklich genannte Festlegung auf Salböl.
- source_word: שַׂמְתְּ עָלֶיהָ
  choice: darauf stelltest du
  rationale: שׂים bezeichnet das Setzen oder Platzieren. Im Zusammenhang wird das letzte feminine Suffix sinnvoll auf den unmittelbar vorausgehenden Tisch bezogen.
theological_decisions:
- issue: Bezug der femininen Suffixe in לְפָנֶיהָ und עָלֶיהָ
  choice: Im Haupttext bezieht sich „davor“ auf das Lager und „darauf“ auf den Tisch.
  alternative: Das erste Suffix kann auf die angeredete Frau bezogen werden („vor dir“); auch die Bezüge der Suffixe können anders gegliedert werden.
  rationale: 'Die gewählte Lesart ergibt die anschauliche räumliche Folge: Die Frau sitzt auf dem Lager, davor steht der gedeckte Tisch, und auf diesen legt sie Gottes Räucherwerk und Öl. Da die feminine Form im Hebräischen den Bezug nicht zweifelsfrei festlegt, bleibt die alternative Deutung in der Fußnote ausdrücklich erhalten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lager“ wahrt die mögliche Bedeutung zwischen Bett und Liege; „Räucherwerk“ vermeidet eine unnötige stoffliche Verengung. Das leicht gehobene „du saßest“ hält den Erzählton klar, ohne archaische Satzformen zu übernehmen.
