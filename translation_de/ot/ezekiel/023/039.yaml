base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/039.yaml
  text: For when they slaughtered their sons for their idols, they came into my sanctuary on that same day to defile it. Look—this is what they did within my house.
translation:
  language: de
  text: 'Als sie ihre Söhne für ihre Götzen schlachteten, kamen sie noch am selben Tag in mein Heiligtum, um es zu entweihen. Und sieh: Das haben sie in meinem Haus getan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְשַׁחֲטָם
  choice: nachdem sie … geschlachtet hatten
  rationale: Die Präposition ב mit Infinitiv und Suffix bezeichnet hier einen zeitlichen Begleitumstand; im Deutschen gibt der vorzeitige Nebensatz die Abfolge natürlich wieder.
- source_word: גִּלּוּלֵיהֶם
  choice: ihre Götzen
  rationale: Das abwertende hebräische Wort bezeichnet Kultbilder bzw. falsche Götter; „Götzen“ bewahrt die negative Wertung knapp und verständlich.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: Entspricht dem kultischen Sinn des Nomens und wahrt den Bezug auf den Gott geweihten Bereich.
- source_word: וְהִנֵּה
  choice: 'Sieh nur:'
  rationale: Gibt den aufmerksamkeitslenkenden, empörten Nachdruck der hebräischen Partikel in natürlichem modernem Deutsch wieder.
- source_word: בְּתוֹךְ בֵּיתִי
  choice: mitten in meinem Haus
  rationale: Bewahrt sowohl die räumliche Zuspitzung von בְּתוֹךְ als auch die Bezeichnung des Heiligtums als Gottes „Haus“.
theological_decisions:
- issue: Verhältnis von Kindertötung und Götzenkult
  choice: „ihre Söhne für ihre Götzen geschlachtet“
  alternative: „ihre Söhne ihren Götzen geopfert“
  rationale: „Geschlachtet“ folgt dem konkreten Verb שׁחט und vermeidet, die Art des kultischen Vorgangs über den Wortlaut hinaus zu präzisieren; „für“ lässt die genaue Relation zum Götzenkult offen.
- issue: Zeitliche Verbindung der Handlungen
  choice: „noch am selben Tag“
  alternative: „an jenem Tag“
  rationale: Der Kontext betont die unmittelbare Verbindung zwischen der Tötung der Söhne und dem Betreten des Heiligtums; „noch am selben Tag“ bringt diesen empörenden Kontrast zur Geltung, ohne eine zusätzliche Lehraussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anklage. Die drastische Wortwahl des Ausgangstextes bleibt erhalten; die Schlusswendung wird durch „Sieh nur:“ nachdrücklich, aber nicht altertümlich wiedergegeben.
