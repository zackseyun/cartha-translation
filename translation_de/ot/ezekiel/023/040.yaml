  text: וְ/אַ֗ף כִּ֤י תִשְׁלַ֨חְנָה֙ לַֽ/אֲנָשִׁ֔ים בָּאִ֖ים מִ/מֶּרְחָ֑ק אֲשֶׁ֨ר מַלְאָ֜ךְ שָׁל֤וּחַ אֲלֵי/הֶם֙ וְ/הִנֵּה בָ֔אוּ לַ/אֲשֶׁ֥ר רָחַ֛צְתְּ כָּחַ֥לְתְּ עֵינַ֖יִ/ךְ וְ/עָ֥דִית עֶֽדִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/040.yaml
  text: And moreover[a], they sent for men coming from far away, to whom a messenger had been sent; and behold, they came—to the one who had washed herself, painted her eyes, and adorned herself with jewelry.
translation:
  language: de
  text: Ja, sie schickten sogar nach Männern, die aus der Ferne kamen. Zu ihnen war ein Bote gesandt worden, und siehe, sie kamen zu dir, die du dich gewaschen, deine Augen geschminkt[a] und Schmuck angelegt hattest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Augen mit Kajal geschminkt“. Das hebräische Verb bezeichnet das Auftragen dunkler Augenschminke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף כִּי
  choice: Ja, ... sogar
  rationale: Die Wendung führt die Anklage mit verstärkender, steigernder Kraft weiter. „Ja, ... sogar“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: תִשְׁלַחְנָה לַאֲנָשִׁים
  choice: sie schickten ... nach Männern
  rationale: Die Verbform ist feminin Plural und bezieht sich auf die beiden personifizierten Städte. „Nach jemandem schicken“ gibt hier die Bedeutung des Herbeirufens treffend wieder.
- source_word: בָּאִים מִמֶּרְחָק
  choice: die aus der Ferne kamen
  rationale: Die Wendung bewahrt sowohl die Bewegung als auch die räumliche Distanz; das deutsche Präteritum fügt sich natürlich in den erzählenden Zusammenhang.
- source_word: אֲשֶׁר מַלְאָךְ שָׁלוּחַ אֲלֵיהֶם
  choice: Zu ihnen war ein Bote gesandt worden
  rationale: מַלְאָךְ bezeichnet hier einen menschlichen Boten. Das Plusquamperfekt macht deutlich, dass seine Entsendung ihrer Ankunft vorausging.
- source_word: וְהִנֵּה בָאוּ
  choice: und siehe, sie kamen
  rationale: „Siehe“ erhält die anschauliche, prophetisch-rhetorische Signalwirkung von הִנֵּה.
- source_word: לַאֲשֶׁר
  choice: Für sie
  rationale: Die Präposition ל mit dem Relativanschluss bezeichnet hier am natürlichsten diejenigen, für die sich die angesprochene Frau vorbereitet hatte. Die anschließenden Verben bleiben entsprechend in direkter singularischer Anrede.
- source_word: רָחַצְתְּ
  choice: hattest du dich gewaschen
  rationale: Das reflexive Waschen ist im Zusammenhang der persönlichen Vorbereitung impliziert; das Plusquamperfekt ordnet es zeitlich vor der Ankunft der Männer ein.
- source_word: כָּחַלְתְּ עֵינַיִךְ
  choice: deine Augen geschminkt
  rationale: Das Verb bezeichnet das Auftragen dunkler Augenkosmetik. Die Haupttextformulierung ist allgemein verständlich; die genauere Bedeutung wird in der Fußnote genannt.
- source_word: וְעָדִית עֶדִי
  choice: und Schmuck angelegt
  rationale: Die Verbindung von Verb und Objekt bezeichnet idiomatisch das Anlegen von Schmuck. Diese Formulierung ist natürlich und vermeidet im Deutschen eine schwerfällige Wortwiederholung.
theological_decisions:
- issue: Wechsel zwischen femininem Plural und femininem Singular
  choice: Das einleitende Verb wird pluralisch („sie schickten“), die Vorbereitungshandlungen werden in singularischer direkter Anrede („du“) wiedergegeben.
  alternative: Den gesamten Vers einheitlich im Singular oder im Plural formulieren.
  rationale: Der hebräische Text wechselt bewusst von den beiden personifizierten Städten beziehungsweise Schwestern zur einzeln angesprochenen Frau. Die Übersetzung bewahrt diesen rhetorischen Wechsel, statt ihn deutend einzuebnen.
- issue: Bezug von לַאֲשֶׁר
  choice: „Für sie“ bezieht die Vorbereitung der Frau auf die angekommenen Männer.
  alternative: „zu derjenigen, die“ als Richtungsangabe zu der Frau verstehen.
  rationale: Im unmittelbaren Satzgefüge lässt sich לַאֲשֶׁר natürlich auf die Männer beziehen, für die die singularisch angeredete Frau sich vorbereitet hatte. Die syntaktische Dichte des Hebräischen wird dabei nicht durch eine zusätzliche Identifizierung der Frau überdeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und siehe“ bewahrt bewusst den prophetischen Ton; die übrige Syntax ist für heutige Leser geglättet, ohne den Wechsel zwischen pluralischer und singularischer Anrede aufzugeben.
