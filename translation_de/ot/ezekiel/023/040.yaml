  to: Ja, sie schickten sogar nach Männern, die aus der Ferne kamen. Zu ihnen war ein Bote gesandt worden, und siehe, sie kamen zu dir, die du dich gewaschen, deine Augen geschminkt[a] und Schmuck angelegt hattest.
