base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/014.yaml
  text: Then she added to her acts of prostitution[a], and she saw men portrayed on the wall, images of Chaldeans portrayed in vermilion[b],
translation:
  language: de
  text: 'Dann fügte sie ihren Hurereien noch weitere hinzu: Sie sah an der Wand dargestellte Männer, Bilder von Chaldäern[a], die mit einem leuchtend roten Farbstoff[b] gezeichnet waren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babyloniern“. Im Hebräischen steht „Chaldäern“, die mit Babylon verbunden waren.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen leuchtend roten Farbstoff; möglicherweise ist Zinnober gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶל־תַּזְנוּתֶיהָ
  choice: Dann fügte sie zu ihren Hurereien noch hinzu
  rationale: Die Formulierung bewahrt das hebräische Idiom mit יסף und den Plural der bewusst drastischen sexuellen Metapher. „Hurereien“ ist im Deutschen knapp, verständlich und dem prophetischen Ton angemessen.
- source_word: וַתֵּרֶא
  choice: Sie sah
  rationale: Die schlichte Bedeutung von ראה passt zur fortschreitenden Erzählung.
- source_word: אַנְשֵׁי מְחֻקֶּה עַל־הַקִּיר
  choice: Männer, die an die Wand gezeichnet waren
  rationale: מְחֻקֶּה bezeichnet hier dargestellte beziehungsweise eingezeichnete Gestalten. „Gezeichnet“ legt sich weniger stark als „eingemeißelt“ auf das genaue Herstellungsverfahren fest.
- source_word: צַלְמֵי כַשְׂדִּים
  choice: Bilder von Chaldäern
  rationale: „Chaldäer“ gibt die ethnisch-politische Bezeichnung des Hebräischen direkt wieder; die kontextuelle Bezeichnung „Babylonier“ wird in der Fußnote genannt.
- source_word: חֲקֻקִים בַּשָּׁשַׁר
  choice: mit roter Farbe eingeritzt
  rationale: חֲקֻקִים bezeichnet eingeritzte oder eingezeichnete Darstellungen; שָׁשַׁר ist ein leuchtend roter Farbstoff, dessen genaue stoffliche Bestimmung unsicher bleibt.
theological_decisions:
- issue: Sexuelle Metaphorik für religiöse und politische Untreue
  choice: „Hurereien“ wird im Haupttext beibehalten
  alternative: „Untreue“ oder „Prostitution“
  rationale: Die drastische sexuelle Bildsprache gehört zur Aussageabsicht Ezechiels und darf nicht zu einer abstrakten Bezeichnung für Untreue abgeschwächt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die harte prophetische Metaphorik bleibt erhalten; die doppelte Beschreibung der Wandbilder gibt die Wiederholung der Wurzel חקק im Hebräischen soweit natürlich wieder.
