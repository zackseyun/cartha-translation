lexical_decisions:
- source_word: וַתִּזְנֶינָה / זָנוּ
  choice: sie prostituierten sich
  rationale: זנה bezeichnet hier sexuelle Untreue beziehungsweise Prostitution und dient zugleich als prophetisches Bild für Untreue. Die Wiederholung im Hebräischen wird beibehalten.
- source_word: בְמִצְרַיִם
  choice: in Ägypten
  rationale: Direkte lokative Wiedergabe des Ortsnamens.
- source_word: בִנְעוּרֵיהֶן
  choice: schon in ihrer Jugend
  rationale: Gibt die Zeitangabe natürlich wieder; „schon“ hebt den im Kontext anklingenden frühen Beginn hervor.
- source_word: שָׁמָּה / שָׁם
  choice: dort
  rationale: Die zweimalige Ortsangabe wird entsprechend der emphatischen Wiederholung des Hebräischen beibehalten.
- source_word: מֹעֲכוּ
  choice: wurden … gedrückt
  rationale: Die passive Form und die körperlich-grobsinnliche Bedeutung von מעך („drücken, quetschen“) bleiben erhalten, ohne das Bild zu beschönigen.
- source_word: שְׁדֵיהֶן
  choice: ihre Brüste
  rationale: Direkte und im Kontext eindeutige anatomische Wiedergabe.
- source_word: עִשּׂוּ
  choice: betastete man
  rationale: Die schwer genau zu bestimmende sexuelle Handlung wird in natürlichem Deutsch wiedergegeben. Das unpersönliche „man“ lässt die im Hebräischen nicht ausdrücklich benannten Handelnden unbestimmt.
- source_word: דַּדֵּי בְּתוּלֵיהֶן
  choice: ihre jungfräulichen Brüste
  rationale: Bewahrt den ausdrücklichen Bezug auf die Brüste und auf ihre damalige Jungfräulichkeit; die formalere Alternative „Brüste ihrer Jungfräulichkeit“ wäre im Deutschen unnatürlich.
theological_decisions:
- issue: Explizite Sexualsprache innerhalb der prophetischen Metapher
  choice: Die drastische körperliche Bildsprache bleibt im Haupttext ausdrücklich erhalten.
  alternative: Die Aussage durch allgemeinere Wendungen wie „sie wurden verführt“ oder „geschändet“ abzumildern.
  rationale: Der hebräische Text verwendet bewusst graphische Sexualbilder, um die frühe Untreue und Entehrung Samarias und Jerusalems darzustellen. Eine Euphemisierung würde die Schärfe der prophetischen Anklage verringern.
- issue: Verhältnis von Eigenhandlung und Behandlung durch andere
  choice: Das Sich-Prostituieren der Frauen und das körperliche Handeln anderer an ihnen werden nebeneinandergestellt.
  alternative: Sämtliche Aussagen entweder als freiwilliges Handeln oder ausschließlich als erlittene Gewalt auszulegen.
  rationale: Der Vers verbindet grammatisch eigenes Handeln mit passiver beziehungsweise durch ungenannte andere ausgeführter sexueller Behandlung. Die Übersetzung entscheidet diese Spannung nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst unverhüllter anatomischer Sprache. Die Wiederholungen von „prostituierten“ und „dort“ spiegeln die eindringliche Struktur des Hebräischen; die ungewöhnliche Bildsprache wird nicht konfessionell oder psychologisch ausgedeutet.
