base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
translation:
  language: de
  text: 'Denn so spricht Jahwe, der Herr: Sieh, ich gebe dich in die Hand derer, die du hasst, in die Hand derer, von denen sich deine Seele losgerissen hat[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von denen sich deine Seele mit Abscheu abgewandt hat“ beziehungsweise „denen sie völlig entfremdet ist“. Der hebräische Ausdruck kann tiefe Entfremdung, Loslösung oder Abscheu bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Verbindung aus dem Herrentitel אֲדֹנָי und dem Gottesnamen יהוה wird unterscheidbar wiedergegeben; „Jahwe“ bewahrt den Eigennamen und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: הִנְנִי
  choice: Sieh
  rationale: Die deiktische Formel leitet eine feierliche, unmittelbar bevorstehende göttliche Handlung ein. „Sieh“ ist gegenwärtiges Standarddeutsch und wahrt den prophetischen Nachdruck.
- source_word: נֹתְנָךְ
  choice: ich gebe dich
  rationale: Die Partizipialkonstruktion mit הִנְנִי bezeichnet eine unmittelbar bevorstehende beziehungsweise bereits einsetzende Handlung. Das Präsens bildet diese Spannung knapp ab.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die sichtbare hebräische Metapher für die Auslieferung in fremde Gewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: אֲשֶׁר שָׂנֵאת
  choice: derer, die du hasst
  rationale: Die feminine Singularform richtet sich an Oholiba beziehungsweise Jerusalem. Das deutsche Präsens gibt die im Zusammenhang fortbestehende Feindschaft natürlich wieder.
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: derer, von denen sich deine Seele mit Abscheu abgewandt hat
  rationale: Die Wiedergabe behält נֶפֶשׁ als „Seele“ bei und lässt die starke Entfremdung beziehungsweise Abscheu des seltenen Verbs נקע erkennen, ohne das Bild auf eine einzige mögliche Nuance zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Der Herrentitel und der Gottesname werden beide sichtbar gemacht. So bleibt der Eigenname erkennbar, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Art der Abwendung in נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: mit Abscheu abgewandt
  alternative: sich losgerissen hat; entfremdet ist; die sie verabscheut
  rationale: Der Ausdruck kann tiefe Entfremdung, Loslösung oder Widerwillen bezeichnen. Der Haupttext gibt die im Kontext naheliegende Abscheu wieder, während die Fußnote die echte lexikalische Spannweite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ernst. Die parallele Wendung „in die Hand“ und das konkrete „deine Seele“ bewahren Struktur und Bildlichkeit des Hebräischen; ungewöhnliche lexikalische Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
