  verdict: revise
  source_fidelity: 'Der Entwurf gibt Syntax und Sinn des hebräischen Textes insgesamt treffend wieder: die Gottesrede, die Anrede „Menschensohn“, die Frage und der anschließende Auftrag bleiben erhalten. „Halte ihnen … vor“ ist im gerichtlichen Kontext eine vertretbare idiomatische Wiedergabe von וְהַגֵּד לָהֶן. Die Wiedergabe von תּוֹעֲבוֹתֵיהֶן als „abscheuliche Taten“ ist jedoch enger und interpretierender als das hebräische Substantiv; sie fügt „Taten“ hinzu und ersetzt den im Prophetenbuch gewichtigen Begriff „Gräuel“.'
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch. „Da sagte“ und „willst du … richten?“ sind in diesem prophetisch-literarischen Register natürlich. „Dann halte ihnen ihre Gräuel vor“ ist klar und passend.
  terminology: „Jahwe“, „Menschensohn“ sowie die deutschen Namensformen „Ohola“ und „Oholiba“ sind angemessen. „Gräuel“ bewahrt als Wiedergabe von תּוֹעֵבוֹת die kultisch-moralische Schwere und die terminologische Verbindung innerhalb Ezechiels besser als „abscheuliche Taten“.
  issues:
