  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִשְׁפּ֥וֹט אֶֽת אָהֳלָ֖ה וְ/אֶת אָהֳלִיבָ֑ה וְ/הַגֵּ֣ד לָ/הֶ֔ן אֵ֖ת תוֹעֲבוֹתֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/036.yaml
  text: Then Yahweh said to me, “Son of man, will you judge Oholah and Oholibah? Then declare to them their abominations.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Menschensohn, willst du Ohola und Oholiba richten? Dann halte ihnen ihre Gräuel vor.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen etablierten Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede Ezechiels wird entsprechend der etablierten deutschen Bibelsprache knapp und quellentreu wiedergegeben.
- source_word: הֲתִשְׁפּוֹט
  choice: willst du … richten?
  rationale: Die Fragepartikel und das Imperfekt der zweiten Person bleiben als direkte Frage erhalten; im Zusammenhang leitet sie einen prophetischen Auftrag ein.
- source_word: אָהֳלָה וְאֶת אָהֳלִיבָה
  choice: Ohola und Oholiba
  rationale: Die symbolischen Eigennamen werden in den im Deutschen gebräuchlichen Transliterationen wiedergegeben.
- source_word: וְהַגֵּד לָהֶן
  choice: Dann halte ihnen … vor
  rationale: Der Imperativ verlangt nicht nur neutrales Bekanntmachen, sondern konfrontierendes Darlegen; „vorhalten“ passt zum Gerichtskontext und ist natürliches Deutsch.
- source_word: תוֹעֲבוֹתֵיהֶן
  choice: ihre abscheulichen Taten
  rationale: Der Plural bezeichnet hier die verwerflichen Handlungen der beiden Frauen. Die Formulierung bewahrt die starke moralisch-kultische Wertung, ohne im Deutschen unnatürlich abstrakt zu klingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Charakter der Frage הֲתִשְׁפּוֹט
  choice: als echte Frage formuliert
  alternative: 'als direkter Befehl: „Richte …“'
  rationale: Die hebräische Frageform wird bewahrt, auch wenn sie im Zusammenhang offenkundig den folgenden Gerichtsauftrag einleitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste prophetische Anrede „Menschensohn“ bleibt erhalten; „halte ihnen … vor“ vermittelt den anklagenden Ton idiomatisch und ohne konfessionelle Zusätze.
