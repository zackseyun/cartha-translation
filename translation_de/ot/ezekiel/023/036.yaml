    rationale: Das Hebräische nennt ihre „Gräuel/Abscheulichkeiten“, ohne das zusätzliche Substantiv „Taten“. „Gräuel“ ist sowohl quellentreuer als auch der etablierte prophetische Schlüsselbegriff.
