  text: וָ/אֹמַ֕ר לַ/בָּלָ֖ה נִֽאוּפִ֑ים עת יזנה תַזְנוּתֶ֖/הָ וָ/הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/043.yaml
  text: Then I said of her, worn out by adulteries, ‘Now they will commit her prostitution with her, and she herself as well.’
translation:
  language: de
  text: 'Da sagte ich über die von Ehebrüchen Verbrauchte: „Nun werden sie ihre Hurerei mit ihr treiben – und sie selbst ebenfalls.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist hier ungewöhnlich und textlich schwierig. Die masoretische Leseüberlieferung versteht das Verb als Mehrzahl („sie werden“); der überlieferte Konsonantentext kann anders aufgefasst werden. Auch „und sie selbst ebenfalls“ bleibt im Hebräischen ohne ausdrückliche Ergänzung.
    reason: Die Fußnote macht die echte textliche Unsicherheit und die Ellipse transparent, ohne den Haupttext mit mehreren Lesarten zu überladen.
lexical_decisions:
- source_word: לַבָּלָה נִאוּפִים
  choice: über die von Ehebrüchen Verbrauchte
  rationale: בָּלָה bezeichnet ein Verbraucht- oder Abgenutztsein; die knappe Konstruktion mit נִאוּפִים wird als Ursache bzw. Sphäre dieses Zustands wiedergegeben, ohne sie zu glätten.
- source_word: תַזְנוּתֶהָ
  choice: ihre Hurerei
  rationale: Das feminine Suffix wird ausdrücklich bewahrt. Die ungewöhnliche Verbindung mit dem folgenden „mit ihr“ bleibt stehen, statt durch eine freiere, deutende Formulierung ersetzt zu werden.
- source_word: וָהִיא
  choice: und sie selbst ebenfalls
  rationale: Die elliptische Schlusswendung wird ebenso elliptisch wiedergegeben; ein nicht ausdrücklich genanntes Objekt wie „mit ihnen“ wird nicht ergänzt.
theological_decisions:
- issue: Art und Bezug der sexuellen Untreue
  choice: Ehebrüche / Hurerei
  alternative: Untreue / Prostitution
  rationale: Die konkreten, scharfen Bildwörter des hebräischen Textes werden beibehalten. Zugleich wird nicht entschieden, ob die Aussage ausschließlich wörtlich oder zugleich als Bild für religiös-politische Untreue zu verstehen ist.
- issue: Elliptischer Schlusssatz
  choice: „und sie selbst ebenfalls“ ohne Ergänzung
  alternative: „und sie mit ihnen“
  rationale: Der hebräische Text nennt im Schlussteil kein entsprechendes Objekt. Die offene und spannungsreiche Formulierung soll nicht stillschweigend theologisch oder erzählerisch präzisiert werden.
translation_notes:
  register: Dignitatives, modernes Standarddeutsch. Die sperrige Wiederholung „ihre Hurerei mit ihr“ ist bewusst beibehalten, weil sie die auffällige Struktur des hebräischen Wortlauts spiegelt; der Gedankenstrich markiert den elliptischen Nachsatz.
