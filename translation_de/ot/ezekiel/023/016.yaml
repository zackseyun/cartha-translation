  text: ו/תעגב עֲלֵי/הֶ֖ם לְ/מַרְאֵ֣ה עֵינֶ֑י/הָ וַ/תִּשְׁלַ֧ח מַלְאָכִ֛ים אֲלֵי/הֶ֖ם כַּשְׂדִּֽימָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/016.yaml
  text: At the sight of her eyes[b][a], she lusted after them and sent messengers to them in Chaldea.
translation:
  language: de
  text: Als sie sie erblickte,[a] begehrte sie sie und sandte Boten zu ihnen nach Chaldäa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „beim Anblick ihrer Augen“; möglich ist auch: „bei ihrem Anblick“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu den Chaldäern“. Die hebräische Form trägt eine Endung, die eine Bewegung auf ein Ziel hin bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגַּב עֲלֵיהֶם
  choice: entbrannte ihr Verlangen nach ihnen
  rationale: עגב mit עַל bezeichnet hier starkes, erotisch gefärbtes Begehren. Die Formulierung bewahrt die Intensität der prophetischen Metapher und klingt zugleich in modernem Deutsch natürlich und würdig.
- source_word: לְמַרְאֵה עֵינֶיהָ
  choice: als sie sie mit eigenen Augen sah
  rationale: Die hebräische Wendung lautet wörtlich etwa „beim Anblick ihrer Augen“. Die idiomatische Wiedergabe bezeichnet das Sehen als unmittelbaren Auslöser ihres Begehrens; „mit eigenen Augen“ bewahrt den ausdrücklichen Bezug auf ihre Augen.
- source_word: וַתִּשְׁלַח מַלְאָכִים
  choice: und sie sandte Boten
  rationale: מַלְאָכִים bedeutet allgemein „Boten“ und kann hier diplomatische Gesandte meinen, ohne dass ihre amtliche Stellung im Deutschen überbestimmt werden muss.
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: אֶל bezeichnet die Ausrichtung auf die Empfänger der Boten.
- source_word: כַּשְׂדִּימָה
  choice: nach Chaldäa
  rationale: Die Richtungsendung -ָה drückt eine Bewegung auf ein Ziel hin aus. „Nach Chaldäa“ gibt diese Zielrichtung klar wieder; formal kann כַּשְׂדִּים auch auf die Chaldäer bezogen werden.
theological_decisions:
- issue: Sexualisierte Metapher für politische und religiöse Untreue
  choice: Die starke Begehrenssprache wird mit „entbrannte ihr Verlangen“ beibehalten.
  alternative: „Sie fand Gefallen an ihnen“ oder „sie schwärmte für sie“
  rationale: Ezechiel 23 verwendet bewusst drastische erotische Bildsprache. Eine abschwächende Wiedergabe würde die prophetische Anklage und ihre theologische Spannung verdecken.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die erotische Intensität wird nicht verharmlost; zugleich wird die im Hebräischen ungewöhnliche Wendung zum Sehen idiomatisch formuliert. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Textstellen.
