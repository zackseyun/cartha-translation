  naturalness: „Als sie sie erblickte, begehrte sie sie“ ist modernes, verständliches Standarddeutsch mit angemessen würdigem prophetischem Register. Die Wiederholung von „sie“ entspricht der knappen hebräischen Ausdrucksweise und bleibt klar.
