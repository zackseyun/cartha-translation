base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/035.yaml
  text: 'Therefore thus says the Lord GOD: Because you have forgotten me and cast me behind your back[a], you also must bear your lewdness and your prostitutions.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Weil du mich vergessen und mich hinter deinen Rücken geworfen hast[a], sollst auch du deine Schandtat und deine Hurereien tragen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und mich hinter deinen Rücken geschleudert hast“. Die hebräische Wendung drückt bewusste Verwerfung oder Missachtung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet die missverständliche Doppelung „der Herr HERR“.
- source_word: יַעַן
  choice: Weil
  rationale: Leitet den Grund für den folgenden Urteilsspruch klar und idiomatisch ein.
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: du mich vergessen hast
  rationale: Das Perfekt bezeichnet die vollzogene, für die Anklage weiterhin maßgebliche Handlung.
- source_word: וַתַּשְׁלִיכִי אוֹתִי אַחֲרֵי גַוֵּךְ
  choice: und mich hinter deinen Rücken geworfen hast
  rationale: Bewahrt das drastische hebräische Bild für bewusste Verwerfung und Missachtung.
- source_word: וְגַם אַתְּ
  choice: auch du
  rationale: Erhält die ausdrückliche Hervorhebung der angesprochenen Frau.
- source_word: שְׂאִי
  choice: sollst … tragen
  rationale: Der Imperativ steht in einem richterlichen Urteilsspruch; „sollst“ vermittelt im Deutschen die auferlegte und unausweichliche Folge.
- source_word: זִמָּתֵךְ
  choice: dein schändliches Treiben
  rationale: Bezeichnet im sexualisierten Gerichtskontext des Kapitels ein schamloses, böses Verhalten; die Wendung ist verständlich und lässt den Begriff etwas weiter als bloße sexuelle Unzucht.
- source_word: תַּזְנוּתָיִךְ
  choice: deine Hurereien
  rationale: Die Pluralform bezeichnet wiederholte Akte der Hurerei und trägt im Kontext zugleich die Bildsprache des Bundesbruchs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form macht den im hebräischen Text ausdrücklich stehenden Eigennamen sichtbar und gibt zugleich אֲדֹנָי als Titel wieder.
- issue: Verhältnis von sexueller Bildsprache und Bundesuntreue
  choice: Die konkrete Bildsprache „Hurereien“ bleibt stehen
  alternative: freie Deutung als „Untreue“ oder „Götzendienst“
  rationale: Der Vers verwendet ausdrücklich sexuelle Gerichtssprache. Eine reine Deutung würde das Bild verengen und die Spannung zwischen wörtlicher Anklage und Metapher vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte, harte Gerichtssprache des Ausgangstextes bleibt erhalten; veraltete Formen werden vermieden.
