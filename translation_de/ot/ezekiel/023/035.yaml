  source_fidelity: Die Satzstruktur und der gerichtliche Kausalzusammenhang entsprechen dem Hebräischen. „Der Herr Yahweh“, „weil“, „vergessen“, das Bild des Hinter-den-Rücken-Werfens, die Hervorhebung „auch du“ und die gerichtliche Folge „sollst ... tragen“ geben den Grundtext angemessen wieder. „Schändliches Treiben“ ist jedoch gegenüber זִמָּה zu allgemein und mildert die im Kontext ausdrücklich sexuelle Schand-/Unzuchtssemantik. „Schandtat“ ist genauer, ohne die Metapher des Kapitels auf eine bestimmte theologische Deutung zu reduzieren.
  naturalness: Der Text ist überwiegend flüssiges, würdiges modernes Standarddeutsch. Die feste, bewusst bildhafte Formulierung „mich hinter deinen Rücken geworfen“ darf nahe am Hebräischen bleiben. Die Fußnote sollte die alternative Übersetzung nicht als „wörtlich“ bezeichnen, da „geschleudert“ gegenüber „geworfen“ eine interpretierend stärkere deutsche Wortwahl ist.
  terminology: „Der Herr Yahweh“ gibt beide Bestandteile von אֲדֹנָי יְהוִה wieder. „Hurereien“ bewahrt den Plural und die harte sexuelle Bildsprache von תַּזְנוּתָיִךְ. „Schandtat“ gibt זִמָּה im vorliegenden Gerichtskontext präziser wieder als das weiter gefasste „schändliches Treiben“.
