base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
translation:
  language: de
  text: Sie deckten ihre Blöße[a] auf; sie nahmen ihre Söhne und Töchter mit sich[b] und töteten sie mit dem Schwert. So wurde sie unter den Frauen berüchtigt[c], und sie vollstreckten Strafgerichte an ihr.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie entblößten ihre Blöße.« Die hebräische Wendung kann zugleich öffentliche Bloßstellung und Beschämung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang ist wahrscheinlich gemeint, dass ihre Söhne und Töchter gefangen genommen oder verschleppt wurden; das hebräische Verb bedeutet allgemein »nehmen«.
    reason: ambiguity
  - marker: c
    text: 'Wörtlich: »Sie wurde ein Name unter den Frauen«; gemeint sein kann auch, dass sie unter ihnen zum sprichwörtlichen oder warnenden Beispiel wurde.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: »Sie vollzogen Gerichte an ihr.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלּוּ עֶרְוָתָהּ
  choice: sie entblößten ihre Blöße
  rationale: Die konkrete hebräische Wendung »die Blöße aufdecken/entblößen« bleibt erhalten. Sie bezeichnet hier zugleich öffentliche Bloßstellung und Erniedrigung, ohne diese Deutung an die Stelle des Bildes zu setzen.
- source_word: בָּנֶיהָ וּבְנוֹתֶיהָ לָקָחוּ
  choice: sie nahmen ihre Söhne und Töchter mit sich
  rationale: לקח bedeutet zunächst »nehmen«. »Mit sich nehmen« klingt im Deutschen vollständig und lässt offen, ob vor allem Gefangennahme, Verschleppung oder Deportation gemeint ist.
- source_word: וְאוֹתָהּ בַּחֶרֶב הָרָגוּ
  choice: und töteten sie selbst mit dem Schwert
  rationale: הרג wird mit dem gegenwärtigen Standardverb »töten« wiedergegeben; »mit dem Schwert« bewahrt die instrumentale Wendung. »Sie selbst« macht den Gegensatz zwischen den weggenommenen Kindern und der getöteten Frau deutlich.
- source_word: וַתְּהִי שֵׁם לַנָּשִׁים
  choice: so wurde sie unter den Frauen berüchtigt
  rationale: Wörtlich wurde sie »ein Name unter den Frauen«. Im Zusammenhang bezeichnet dies einen weithin bekannten, negativen Ruf. »Berüchtigt« gibt diese idiomatische Bedeutung natürlich wieder, während die Fußnote den Wortlaut offenlegt.
- source_word: וּשְׁפוּטִים עָשׂוּ בָהּ
  choice: sie vollstreckten Strafgerichte an ihr
  rationale: Der seltene Plural שְׁפוּטִים bezeichnet richterliche Urteile beziehungsweise Strafgerichte. Die Wiedergabe wahrt sowohl den gerichtlichen Charakter als auch den Plural.
theological_decisions:
- issue: Sexualisierte Bildsprache über Samaria beziehungsweise Ohola
  choice: Die konkrete Wendung »ihre Blöße entblößen« wird beibehalten.
  alternative: »Sie stellten sie öffentlich bloß« oder »sie brachten Schande über sie«
  rationale: Das Kapitel stellt Untreue und Gericht in der drastischen Bildwelt sexueller Entblößung dar. Eine abstrakte Umschreibung würde die rhetorische Härte abschwächen und die Bildsprache vorzeitig auslegen.
- issue: Gerichtssprache im Schlusssatz
  choice: »sie vollstreckten Strafgerichte an ihr«
  alternative: »sie bestraften sie«
  rationale: Der hebräische Text verwendet ausdrücklich ein Substantiv im Plural, das richterliche Maßnahmen bezeichnet. Die Übersetzung bewahrt daher den Charakter vollzogener Gerichtsurteile statt nur allgemein von Strafe zu sprechen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die drastische Bildsprache und die gerichtliche Terminologie bleiben erhalten; altertümliche Wörter wie »Weiber« oder »erschlugen« werden vermieden.
