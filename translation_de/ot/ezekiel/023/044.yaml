  text: וַ/יָּב֣וֹא אֵלֶ֔י/הָ כְּ/ב֖וֹא אֶל אִשָּׁ֣ה זוֹנָ֑ה כֵּ֣ן בָּ֗אוּ אֶֽל אָֽהֳלָה֙ וְ/אֶל אָ֣הֳלִיבָ֔ה אִשֹּׁ֖ת הַ/זִּמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/044.yaml
  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
translation:
  language: de
  text: Und er ging zu ihr hinein, wie man zu einer Prostituierten hineingeht; so gingen sie zu Ohola und Oholiba hinein, den Frauen der Schande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen zunächst die Einzahl („er ging“), danach die Mehrzahl („sie gingen“). Für „Frauen der Schande“ sind auch die Wiedergaben „Frauen der Unzucht“ oder „lasterhafte Frauen“ möglich.
    reason: Der auffällige Numeruswechsel und der Bedeutungsumfang von זִמָּה sollen für die Lesenden sichtbar bleiben.
lexical_decisions:
- source_word: וַיָּב֣וֹא / בָּ֗אוּ
  choice: er ging ... hinein / sie gingen ... hinein
  rationale: בוא mit אֶל hat hier im sexuellen Zusammenhang den Sinn „zu jemandem hineingehen“. Der Numeruswechsel des hebräischen Textes wird bewusst beibehalten.
- source_word: כְּב֖וֹא אֶל
  choice: wie man zu ... hineingeht
  rationale: Die Infinitivkonstruktion mit vergleichendem כ bezeichnet die Art und Weise. Das unpersönliche „man“ gibt den im Hebräischen nicht ausdrücklich genannten Handlungsträger natürlich wieder.
- source_word: אִשָּׁ֣ה זוֹנָ֑ה
  choice: eine Prostituierte
  rationale: „Prostituierte“ ist eine klare, moderne und sachliche Wiedergabe; „Hure“ wäre im heutigen Deutsch unnötig herabsetzend, „Dirne“ veraltet.
- source_word: אָהֳלָה ... אָהֳלִיבָה
  choice: Ohola ... Oholiba
  rationale: Die Eigennamen werden in geläufiger deutscher Transliteration wiedergegeben und nicht übersetzt.
- source_word: אִשֹּׁ֖ת הַזִּמָּֽה
  choice: Frauen der Schandtat
  rationale: Die Genitivverbindung bleibt erhalten. זִמָּה bezeichnet hier eine schändliche, sexuell konnotierte Tat beziehungsweise Verderbtheit; „Schandtat“ bewahrt moralisches Gewicht und eine gewisse lexikalische Breite.
theological_decisions:
- issue: Numeruswechsel beim einleitenden Verb
  choice: 'Singular und anschließenden Plural des masoretischen Textes bewahren: „er ging ... so gingen sie“'
  alternative: 'Den ersten Satz dem Kontext entsprechend kollektiv im Plural wiedergeben: „Sie gingen zu ihr hinein“'
  rationale: Der WLC bietet zunächst eindeutig ein singularisches וַיָּבֹא und wechselt danach zu בָּאוּ im Plural. Da kein textkritischer Befund vorgelegt ist, sollte die auffällige Spannung nicht stillschweigend geglättet werden.
- issue: Bedeutungsumfang von זִמָּה
  choice: „Schandtat“
  alternative: „Unzucht“, „Schändlichkeit“ oder „Verderbtheit“
  rationale: Im Kontext ist die Wendung sexuell und moralisch aufgeladen. „Schandtat“ wahrt dies, ohne den Ausdruck auf einen einzelnen konfessionell geprägten Fachbegriff festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sexuelle Bedeutung des Idioms wird klar, aber nicht unnötig drastisch wiedergegeben. Der ungewöhnliche Numeruswechsel des Ausgangstextes bleibt im Haupttext erhalten.
