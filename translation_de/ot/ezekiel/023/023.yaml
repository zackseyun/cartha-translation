  text: בְּנֵ֧י בָבֶ֣ל וְ/כָל כַּשְׂדִּ֗ים פְּק֤וֹד וְ/שׁ֨וֹעַ֙ וְ/ק֔וֹעַ כָּל בְּנֵ֥י אַשּׁ֖וּר אוֹתָ֑/ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּ/סְגָנִים֙ כֻּלָּ֔/ם שָֽׁלִשִׁים֙ וּ/קְרוּאִ֔ים רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/023.yaml
  text: the sons of Babylon and all the Chaldeans[a], Pekod and Shoa and Koa, all the sons of Assyria with them—desirable young men, all of them governors and officials, officers and men of renown[b], all of them riding on horses.
translation:
  language: de
  text: die Söhne Babels und alle Chaldäer, Pekod, Schoa und Koa[a], und mit ihnen alle Söhne Assurs — begehrenswerte junge Männer, allesamt Statthalter und Amtsträger, Offiziere und angesehene Männer[b], allesamt auf Pferden reitend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pekod, Schoa und Koa sind wahrscheinlich Namen von Völkern oder Gebieten. Manche verstehen die Wörter stattdessen als Bezeichnungen wie »Amtsträger, Vornehme und Krieger«.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »ausgezeichnete Männer«; wörtlicher: »Berufene«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בָבֶל
  choice: die Söhne Babels
  rationale: Die formale hebräische Volksbezeichnung bleibt erhalten und entspricht der parallelen Wendung »Söhne Assurs«.
- source_word: כַּשְׂדִּים
  choice: Chaldäer
  rationale: Die herkömmliche ethnische Bezeichnung wird von Babel unterschieden, wie es die Aufzählung nahelegt.
- source_word: פְּקוֹד וְשׁוֹעַ וְקוֹעַ
  choice: Pekod, Schoa und Koa
  rationale: Die Wörter werden aufgrund ihrer Form und ihrer Stellung in der Völkerliste als Namen von Völkern oder Gebieten verstanden; eine appellativische Deutung wird in der Fußnote genannt.
- source_word: כָּל בְּנֵי אַשּׁוּר אוֹתָם
  choice: dazu alle Söhne Assurs
  rationale: »Söhne Assurs« bewahrt den ethnisch-genealogischen Ausdruck; »dazu« gibt die begleitende Einbeziehung durch אוֹתָם im Deutschen flüssig wieder.
- source_word: בַּחוּרֵי חֶמֶד
  choice: begehrenswerte junge Männer
  rationale: Die Wiedergabe bewahrt sowohl die Altersangabe als auch den im Kapitel wichtigen Unterton von Attraktivität und Begehren.
- source_word: פַּחוֹת
  choice: Statthalter
  rationale: Der Ausdruck bezeichnet einen hohen Verwaltungsrang, besonders im imperialen Zusammenhang.
- source_word: סְגָנִים
  choice: Amtsträger
  rationale: Die breite Amtsbezeichnung unterscheidet den Rang von den Statthaltern, ohne eine unsichere bürokratische Präzision vorzutäuschen.
- source_word: שָׁלִשִׁים
  choice: Offiziere
  rationale: Der Begriff bezeichnet wahrscheinlich militärische Würdenträger; die allgemeine Wiedergabe vermeidet eine unsichere technische Festlegung.
- source_word: קְרוּאִים
  choice: angesehene Männer
  rationale: Im Kontext der Ehren- und Rangbezeichnungen bezeichnet das passive Partizip wahrscheinlich Männer, die aufgrund ihres Ansehens berufen oder eingeladen werden; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: רֹכְבֵי סוּסִים
  choice: hoch zu Ross
  rationale: Die geläufige deutsche Wendung gibt die berittene Erscheinung knapp und würdig wieder.
- source_word: כֻּלָּם ... כֻּלָּם ... כֻּלָּם
  choice: alle ... allesamt ... allesamt
  rationale: Die dreifache Totalitätsaussage bleibt erhalten, wobei leichte Variation einen natürlichen deutschen Satzfluss ermöglicht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ethnischen Wendungen »Söhne Babels« und »Söhne Assurs« bewahren bewusst den hebräischen Parallelismus. Die Reihung und die wiederholte Betonung der Gesamtheit werden beibehalten; Gedankenstrich und idiomatisches »hoch zu Ross« sorgen für natürlichen deutschen Lesefluss.
