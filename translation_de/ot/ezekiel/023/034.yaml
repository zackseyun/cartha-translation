  terminology: „Scherben“, „zernagen“ und „abreißen“ bewahren die harte Bildsprache ohne Abschwächung. „Gottes, des HERRN“ entspricht der etablierten deutschen Wiedergabe des zusammengesetzten Titels אֲדֹנָי יְהוִה; die Reihenfolge der deutschen Titelbestandteile ist dabei konventionell und nicht als Umkehrung des hebräischen Titels zu verstehen.
