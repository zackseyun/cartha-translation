  text: וְ/שָׁתִ֨ית אוֹתָ֜/הּ וּ/מָצִ֗ית וְ/אֶת חֲרָשֶׂ֛י/הָ תְּגָרֵ֖מִי וְ/שָׁדַ֣יִ/ךְ תְּנַתֵּ֑קִי כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/034.yaml
  text: You will drink it and drain it dry[a], and you will gnaw its shards, and tear off your breasts; for I have spoken, declares the Lord GOD.
translation:
  language: de
  text: Du wirst ihn austrinken und bis auf den letzten Tropfen leeren[a]. Seine Scherben wirst du zernagen, und deine Brüste wirst du abreißen. Denn ich habe gesprochen – Ausspruch Gottes, des HERRN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aussaugen“; gemeint ist, den Becher restlos bis zum letzten Tropfen zu leeren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתִית אוֹתָהּ וּמָצִית
  choice: Du wirst ihn austrinken und vollständig leeren
  rationale: Die femininen Verb- und Objektsformen beziehen sich im Kontext auf den Becher. מצה bezeichnet das restlose Leeren; die deutsche Formulierung gibt die vollständige Ausführung natürlich wieder.
- source_word: חֲרָשֶׂיהָ
  choice: seine Scherben
  rationale: Der Plural von חֶרֶשׂ bezeichnet hier die zerbrochenen Stücke des tönernen Trinkgefäßes. „Scherben“ ist im modernen Deutschen präzise und allgemein verständlich.
- source_word: תְּגָרֵמִי
  choice: wirst du zernagen
  rationale: Das Piel von גרם beschreibt ein Nagen oder Zermalmen an hartem Material. „Zernagen“ bewahrt das drastische, groteske Bild.
- source_word: וְשָׁדַיִךְ תְּנַתֵּקִי
  choice: und deine Brüste wirst du abreißen
  rationale: Das Piel von נתק bedeutet losreißen oder abreißen. Die bewusst schockierende Gerichtssprache wird nicht abgeschwächt.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: Denn ich habe gesprochen
  rationale: כִּי begründet hier die Gewissheit der angekündigten Strafe; das Perfekt unterstreicht die verbindliche göttliche Aussage.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch GOTTES, des Herrn
  rationale: נְאֻם wird als prophetische Botenformel mit „Ausspruch“ wiedergegeben. Die typografische Hervorhebung in „GOTT“ vertritt den Gottesnamen JHWH, während „des Herrn“ אֲדֹנָי wiedergibt und die doppelte Wiedergabe „Herr HERR“ vermeidet.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: GOTTES, des Herrn
  alternative: des Herrn JHWH / des Herrn HERRN
  rationale: 'Die Übersetzung unterscheidet beide Bestandteile des zusammengesetzten Gottestitels: „Herr“ für אֲדֹנָי und typografisch markiertes „GOTT“ für den Gottesnamen. Sie vermeidet sowohl eine unbegründete Aussprachefestlegung als auch die schwer verständliche Doppelung „Herr HERR“.'
- issue: Subjekt der Selbstverstümmelung
  choice: Die angeredete Frau reißt ihre eigenen Brüste ab
  alternative: Passivische oder unpersönliche Darstellung des Gerichts
  rationale: Die hebräische Verbform תְּנַתֵּקִי ist aktiv, zweite Person feminin Singular. Die drastische aktive Bildsprache bleibt daher erhalten, ohne ihre metaphorische Gerichtsfunktion weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter drastischer Bildsprache. Der Satzbau hebt die aufeinanderfolgenden Gerichtshandlungen hervor; keine konfessionelle Deutung wird ergänzt.
