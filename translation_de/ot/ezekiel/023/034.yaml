  source_fidelity: 'Die Abfolge der hebräischen Aussagen ist im Entwurf zutreffend wiedergegeben: das Trinken und restlose Leeren des Bechers, das Zernagen seiner Scherben sowie das aktive Abreißen der eigenen Brüste. Die feminine Referenz im Hebräischen gilt dem Becher; das deutsche Maskulinum „ihn“ ist durch das kontextuelle „Becher“ gedeckt. Die Gottesformel ist sachgerecht als „Gottes, des HERRN“ wiedergegeben.'
