base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/007.yaml
  text: She lavished her prostitutions on them[a], all the choicest sons of Assyria; and with all those for whom she lusted[c][b], with all their idols she defiled herself.
translation:
  language: de
  text: Sie gab sich ihnen zur Hurerei hin – all den auserlesenen Männern Assyriens, sie alle.[a] Mit allen, nach denen sie gierte,[b] verunreinigte sie sich mit all ihren Götzen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den besten Männern Assyriens« beziehungsweise »den Besten unter den Assyrern«.'
    reason: lexical_alternative
  - marker: b
    text: Die ausdrücklich sexuelle Sprache von »Hurerei« und »gieren« dient als prophetisches Bild für politische und religiöse Untreue sowie Götzendienst.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort ist Hesekiels stark abwertende Bezeichnung für Götzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן תַּזְנוּתֶיהָ עֲלֵיהֶם
  choice: Sie gab sich ihnen zur Hurerei hin
  rationale: Die hebräische Wendung lautet wörtlich etwa »sie gab ihre Hurereien auf/an sie«. Die gewählte deutsche Formulierung gibt das aktive Sich-Hingeben natürlich wieder und bewahrt zugleich die ausdrücklich sexuelle Bildsprache.
- source_word: מִבְחַר בְּנֵי אַשּׁוּר כֻּלָּם
  choice: den erlesensten Söhnen Assurs, ihnen allen
  rationale: מִבְחַר bezeichnet das Ausgewählte oder Beste. »Söhne Assurs« erhält die ausdrücklich männliche Bezeichnung und passt zum sexuellen Bildzusammenhang; »ihnen allen« bildet כֻּלָּם eigens ab.
- source_word: עָגְבָה
  choice: nach denen sie gierte
  rationale: Das Verb bezeichnet leidenschaftliches, insbesondere sexuelles Begehren. »gierte« wahrt diese starke Färbung, ohne sie zu verharmlosen.
- source_word: גִּלּוּלֵיהֶם
  choice: ihre Götzen
  rationale: Der Ausdruck ist Hesekiels bewusst verächtliche Bezeichnung für Götzen. »Götzen« gibt den Referenten klar wieder; die besonders derbe Nebenbedeutung wird in einer Fußnote erläutert.
- source_word: נִטְמָאָה
  choice: verunreinigte sie sich
  rationale: Der Nifal bezeichnet hier das Eintreten kultisch-moralischer Unreinheit. Die reflexive Wiedergabe passt zum Zusammenhang, in dem sie sich durch ihre Beteiligung selbst verunreinigt.
theological_decisions:
- issue: Sexuelle Bildsprache für politische und kultische Untreue
  choice: Die ausdrücklichen Begriffe »Hurerei« und »gierte« bleiben im Haupttext erhalten.
  alternative: Die Bildsprache durch »Untreue«, »Abfall« oder »Verlangen« abschwächen.
  rationale: Hesekiels anstößige sexuelle Metaphorik ist ein wesentlicher Teil der prophetischen Anklage. Sie deutet auf politische Bündnisse und Götzendienst, darf aber nicht durch eine bloße Deutung ersetzt werden.
- issue: Kultische und moralische Bedeutung von טמא
  choice: »verunreinigte sie sich«
  alternative: »wurde sie unrein« oder »wurde sie entweiht«
  rationale: Die Übersetzung wahrt die kultische Dimension und macht zugleich ihre eigene Beteiligung deutlich, ohne die Unreinheit ausschließlich moralisch oder ausschließlich rituell festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst unverhüllter prophetischer Bildsprache. »Assur« erhält den biblisch-historischen Namen und ermöglicht die quellennähere Wendung »Söhne Assurs«. Der Gedankenstrich kennzeichnet die Apposition, ohne die Satzbezüge aufzulösen.
