  rationale: Die Revision ersetzt das nicht hinreichend quellengenaue »durch« durch »mit« und macht das auf die Assyrer zurückweisende Possessivverhältnis bei den Götzen durch den Kontext eindeutig. Die männlichen Referenten von בְּנֵי bleiben mit »Männer Assyriens« erhalten, ohne die im Deutschen missverständliche genealogische Nuance von »Söhnen Assurs« zu erzeugen. Die sexuelle und kultische Metaphorik bleibt unverändert deutlich.
