translation:
  language: de
  text: Doch sie gab ihre Hurereien aus Ägypten[a] nicht auf, denn in ihrer Jugend hatten sie mit ihr geschlafen, ihre jungfräulichen Brüste betastet[b] und ihre Hurerei über sie ausgegossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ihre Hurereien von Ägypten her“. Das Hebräische verwendet im ganzen Vers dieselbe derbe Prostitutionsmetaphorik für Untreue.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „sie bearbeiteten die Brüste ihrer Jungfräulichkeit“. Gemeint ist eine ausdrücklich sexuelle Berührung in ihrer Jugend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּזְנוּתֶיהָ / תַזְנוּתָם
  choice: ihre Hurereien / ihre Hurerei
  rationale: Die derbe, wiederholte Prostitutionsmetaphorik wird bewahrt. Der Plural bezeichnet ihre wiederholten Handlungen, der Singular am Versende die entsprechende Betätigung der Männer.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition bezeichnet am natürlichsten Herkunft beziehungsweise Ursprung.
- source_word: לֹא עָזָבָה
  choice: gab … nicht auf
  rationale: Im Deutschen ist dies bei fortgesetzten Praktiken idiomatisch und gibt das Nichtablassen klar wieder.
- source_word: שָׁכְבוּ אוֹתָהּ
  choice: hatten sie bei ihr gelegen
  rationale: Die Formulierung wahrt den sexuellen Euphemismus und entspricht der zeitlichen Rückblende auf ihre Jugend.
- source_word: בִנְעוּרֶיהָ
  choice: in ihrer Jugend
  rationale: Die knappe temporale Wendung bleibt eng am Hebräischen.
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֶיהָ
  choice: sie hatten ihre jungfräulichen Brüste betastet
  rationale: Die explizite und objektivierende Sexualsprache bleibt erhalten; „betastet“ gibt die körperliche Handlung natürlich wieder, ohne zusätzliche Gewaltsemantik einzutragen.
- source_word: וַיִּשְׁפְּכוּ … עָלֶיהָ
  choice: und … über sie ausgegossen
  rationale: Das konkrete Bild des Ausgießens sowie die Richtung auf die Frau hin werden bewahrt.
theological_decisions:
- issue: Sexualisierte prophetische Metapher für Bundesuntreue und fremde Bindungen
  choice: Die explizite sexuelle Bildsprache bleibt im Haupttext erhalten.
  alternative: Die Metapher durch abstrakte Begriffe wie „Untreue“ oder „Abfall“ abschwächen.
  rationale: Ezechiels bewusst anstößige Rhetorik gehört zur Aussage des Textes. Eine abstrakte Wiedergabe würde die Bildwelt und ihre prophetische Wucht verdecken.
- issue: Mögliche Ausbeutungs- oder Gewaltkonnotation der Jugendszene
  choice: Keine ausdrückliche Gewaltsemantik in den Haupttext aufnehmen.
  alternative: Die Männer als Ausbeuter oder Gewalttäter ausdrücklich kennzeichnen.
  rationale: Die Szene ist objektivierend und kann Ausbeutung nahelegen, doch die Verbformen dieses Verses benennen Gewalt nicht eindeutig. Die Spannung bleibt daher unaufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst ungeschönter prophetischer Bildsprache. „Hurereien“ ist derb, aber zur Wahrung des hebräischen Wortfeldes angemessen; Satzbau und Tempus machen die Rückblende verständlich.
