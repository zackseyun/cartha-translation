  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Bilder des Hebräischen zuverlässig wieder: das Nichtaufgeben der aus Ägypten stammenden Hurereien, die Rückblende auf die Jugend, die sexuelle Berührung der Brüste und das Ausgießen „ihrer Hurerei“ über sie. „Bei ihr gelegen“ ist im heutigen Deutschen jedoch nicht eindeutig sexuell und kann schlicht Aufenthalt bei ihr bedeuten; damit wird der sexuelle Euphemismus von שָׁכְבוּ אֹתָהּ nicht ausreichend klar wiedergegeben.'
