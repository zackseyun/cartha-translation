  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Elemente des Hebräischen zuverlässig wieder: die „Söhne Babels“, das erotische „Liebeslager“, die zweimalige Verunreinigung und die abschließende, von Abscheu geprägte Abwendung. Die Wiedergabe von בְּתַזְנוּתָם mit „durch ihre Hurerei“ wahrt die sexuelle sowie metaphorisch-moralische Bildsprache, ohne eine engere Deutung wie gewerbsmäßige Prostitution festzulegen.'
