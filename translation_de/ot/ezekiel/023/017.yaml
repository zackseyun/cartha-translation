  terminology: „Verunreinigen“ bewahrt die kultisch-moralische Dimension von טמא und die Wiederholung des hebräischen Verbs. „Hurerei“ ist im Kontext der prophetischen Ehebruchsallegorie angemessen, ohne den Text zu beschönigen oder vulgär zu formulieren. Die Fußnoten sind korrekt verankert und bieten echte lexikalische beziehungsweise idiomatische Alternativen.
