source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ אֵלֶ֤י/הָ בְנֵֽי בָבֶל֙ לְ/מִשְׁכַּ֣ב דֹּדִ֔ים וַ/יְטַמְּא֥וּ אוֹתָ֖/הּ בְּ/תַזְנוּתָ֑/ם וַ/תִּ֨טְמָא בָ֔/ם וַ/תֵּ֥קַע נַפְשָׁ֖/הּ מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/017.yaml
  text: Then the sons of Babylon came to her[a], to the bed of love, and they defiled her with their prostitution; and she was defiled by them[c][b], and her soul was alienated from them.
translation:
  language: de
  text: Da kamen die Söhne Babels[a] zu ihr, zum Liebeslager[b], und verunreinigten sie durch ihre Hurerei. So wurde sie durch sie verunreinigt, und ihre Seele wandte sich angewidert von ihnen ab.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Babylonier“ beziehungsweise „die Männer aus Babel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Lager der Liebe“ beziehungsweise „zum Liebesakt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und ihre Seele entfremdete sich ihnen“ beziehungsweise „und sie verabscheute sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בָבֶל
  choice: die Söhne Babels
  rationale: Die formnahe Wiedergabe bewahrt die hebräische Konstruktverbindung. Gemeint sind die Babylonier beziehungsweise die Männer aus Babel; dies wird in einer Fußnote erläutert.
- source_word: לְמִשְׁכַּב דֹּדִים
  choice: zum Liebeslager
  rationale: Die kompakte deutsche Zusammensetzung gibt sowohl מִשְׁכָּב (Lager, Liegestatt) als auch den erotischen Sinn von דֹּדִים wieder, ohne die Wendung unnötig auszudeuten.
- source_word: וַיְטַמְּאוּ אֹתָהּ
  choice: und verunreinigten sie
  rationale: „Verunreinigen“ bewahrt die moralische und kultische Bedeutungsbreite von טמא; „schänden“ wäre enger und würde zusätzliche Gewaltkonnotationen eintragen.
- source_word: בְּתַזְנוּתָם
  choice: durch ihre Hurerei
  rationale: „Hurerei“ erhält das ausdrücklich sexuelle Bild sowie dessen metaphorische Funktion für politische und religiöse Untreue. „Prostitution“ könnte zu eng nach gewerbsmäßiger Sexualität klingen.
- source_word: וַתִּטְמָא בָם
  choice: So wurde sie durch sie verunreinigt
  rationale: Die passive beziehungsweise resultative Aussage und das instrumentale ב werden transparent wiedergegeben. Die Wiederholung von טמא bleibt wie im Hebräischen erhalten.
- source_word: וַתֵּקַע נַפְשָׁהּ מֵהֶם
  choice: und ihre Seele wandte sich angewidert von ihnen ab
  rationale: Die Formulierung bewahrt נַפְשָׁהּ ausdrücklich und gibt zugleich die durch קָעַע bezeichnete Abwendung beziehungsweise Abscheu idiomatisch wieder, ohne sie nur auf ein statisches Gefühl zu reduzieren.
theological_decisions:
- issue: Sexuelle und moralisch-kultische Bildsprache der prophetischen Allegorie
  choice: Die ausdrückliche sexuelle Metaphorik und die Sprache der Verunreinigung bleiben erhalten.
  alternative: Die Aussage ausschließlich als politische Bündnissprache wiedergeben oder die sexuelle Bildsprache abschwächen.
  rationale: Der hebräische Text schildert politische und religiöse Untreue bewusst mit sexueller Bildsprache. Eine Abschwächung würde einen wesentlichen Zug der prophetischen Rhetorik beseitigen.
- issue: Mehrdeutigkeit der abschließenden Seelen-Wendung
  choice: „ihre Seele wandte sich angewidert von ihnen ab“
  alternative: „sie verabscheute sie“ oder „ihre Seele entfremdete sich ihnen“
  rationale: Die gewählte Fassung hält Abscheu und Entfremdung zusammen und bewahrt die im hebräischen Idiom ausdrücklich genannte נֶפֶשׁ.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die derbe prophetische Sexualmetaphorik wird nicht beschönigt; zugleich werden unnötig vulgäre oder altertümliche Ausdrücke vermieden. „Söhne Babels“ und die ausdrückliche Nennung der „Seele“ halten die hebräische Form sichtbar, während Fußnoten natürlichere Alternativen anbieten.
