base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/022.yaml
  text: 'Therefore[a], Oholibah, thus says the Lord GOD: Behold, I am stirring up your lovers against you, those from whom your soul has turned away, and I will bring them against you from every side.'
translation:
  language: de
  text: 'Darum, Oholiba, so spricht der Herr Yahweh: Siehe, ich stachle deine Liebhaber gegen dich auf, diejenigen, von denen sich dein Inneres abgewandt hat[a], und ich werde sie von allen Seiten gegen dich führen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor denen dein Inneres Abscheu empfunden hat“; auch möglich: „von denen sich dein Inneres entfremdet hat“. Das hebräische Verb kann Abscheu oder Entfremdung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die folgende Ankündigung als gerichtliche Konsequenz des zuvor erhobenen Vorwurfs und klingt im modernen Deutsch natürlich und nachdrücklich.
- source_word: אָהֳלִיבָה
  choice: Oholiba
  rationale: Der Eigenname wird in einer im Deutschen etablierten, dem Hebräischen angenäherten Form wiedergegeben und nicht übersetzt.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: so spricht der Herr Yahweh
  rationale: Bewahrt die prophetische Botenformel, unterscheidet אֲדֹנָי als Titel von יְהוִה als Gottesnamen und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: „Siehe“ erhält den feierlichen, aufmerksamkeitslenkenden Charakter der göttlichen Ankündigung.
- source_word: מֵעִיר
  choice: stachle … auf
  rationale: Das Hifil-Partizip bezeichnet hier das Veranlassen feindlichen Tätigwerdens; die deutsche Wendung gibt diese Mobilisierung gegen Oholiba klar wieder.
- source_word: מְאַהֲבַיִךְ
  choice: deine Liebhaber
  rationale: Bewahrt die sexuelle Metaphorik für Oholibas unerlaubte politische Bündnispartner und den anklagenden Ton des Kapitels.
- source_word: אֵת אֲשֶׁר נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: diejenigen, von denen du dich innerlich abgewandt hast
  rationale: „Innerlich“ gibt die Beteiligung von נֶפֶשׁ idiomatisch wieder, während „abgewandt“ die Entfremdung ausdrückt, ohne die mögliche Nuance des Abscheus im Haupttext festzulegen.
- source_word: וַהֲבֵאתִים עָלַיִךְ
  choice: und lasse sie … über dich kommen
  rationale: Gibt die von Gott verursachte feindliche Bewegung gegen Oholiba in natürlichem Deutsch wieder.
- source_word: מִסָּבִיב
  choice: von allen Seiten
  rationale: Verdeutlicht knapp und idiomatisch die drohende Einkreisung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR / der Herr HERR
  rationale: Die Übersetzung wahrt sowohl den Titel אֲדֹנָי als auch den ausdrücklich gesetzten Gottesnamen יְהוִה und vermeidet, beide unterschiedslos mit „Herr“ wiederzugeben.
- issue: Gottes Handeln beim Heranführen der früheren Liebhaber
  choice: Gott stachelt sie auf und lässt sie über Oholiba kommen
  alternative: bloße Vorhersage ihres Angriffs
  rationale: Die kausativen Verbformen stellen Gott ausdrücklich als den Handelnden dar; diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Moderne, würdige prophetische Sprache. „Siehe“ hält den feierlichen Ton, während „stachle … auf“ und „von allen Seiten über dich kommen“ für heutige Leser unmittelbar verständlich bleiben. Die Gedankenstriche markieren die erläuternde Identifikation der Liebhaber.
