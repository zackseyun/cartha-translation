  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
translation:
  language: de
  text: So nahmst du das schamlose Treiben deiner Jugend wieder auf[a], als man dir in Ägypten[b] die Brüste liebkoste – um deiner jugendlichen Brüste willen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So erinnertest du dich an das schamlose Treiben deiner Jugend.“ Das hebräische Verb kann „sich erinnern“, „sich wieder zuwenden“ oder „aufsuchen“ bedeuten; hier schwingt wahrscheinlich die Rückkehr zum früheren Verhalten mit.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „aus/von Ägypten“. Gemeint sein kann, was in Ägypten geschah oder von Ägyptern getan wurde. Die hebräische Satzfügung ist an dieser Stelle ungewöhnlich knapp.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַתִּפְקְדִי
  choice: nahmst du ... wieder auf
  rationale: Das Verb פקד kann hier sowohl das Erinnern als auch das erneute Aufsuchen bzw. Wiederaufnehmen bezeichnen. Im Zusammenhang der erneuerten politisch-sexuellen Untreue gibt „wieder aufnehmen“ den wahrscheinlichen Handlungssinn wieder, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: זִמַּת
  choice: das schamlose Treiben
  rationale: זִמָּה bezeichnet in diesem sexuellen Zusammenhang anstößiges, zügelloses Verhalten. „Schamloses Treiben“ bewahrt die moralische und sexuelle Schärfe und klingt im modernen Deutschen natürlicher als das enger konfessionell geprägte „Unzucht“.
- source_word: נְעוּרַיִךְ
  choice: deiner Jugend
  rationale: Die Wendung bezeichnet die Jugendzeit. Ihre Wiederholung am Versende bleibt erhalten, um die nachdrückliche Bildsprache des Hebräischen zu bewahren.
- source_word: בַּעֲשׂוֹת ... דַּדַּיִךְ
  choice: als man dir ... die Brüste betastete
  rationale: Die knappe hebräische Konstruktion beschreibt eine ausdrücklich sexuelle Berührung der Brüste. Das unpersönliche „man“ gibt den nicht ausdrücklich genannten Handelnden im Deutschen natürlich wieder; „betastete“ wahrt die Deutlichkeit, ohne das Bild auszuschmücken.
- source_word: מִמִּצְרַיִם
  choice: in Ägypten
  rationale: Die Präposition bedeutet formal „aus/von Ägypten“. Im Satz bezeichnet Ägypten jedoch den Ort bzw. Ursprung des Geschehens; idiomatisches Deutsch verlangt hier „in Ägypten“. Die formale Alternative wird in einer Fußnote genannt.
- source_word: דַּדַּיִךְ ... שְׁדֵי נְעוּרָיִךְ
  choice: die Brüste ... die Brüste deiner Jugend
  rationale: Die konkreten anatomischen Begriffe und die Wiederholung werden beibehalten. Dadurch bleibt die absichtlich drastische prophetische Metapher hörbar.
theological_decisions:
- issue: Explizite sexuelle Metaphorik in prophetischer Gerichtssprache
  choice: Die Ausdrücke „schamloses Treiben“ und „Brüste betastete“ werden ohne beschönigenden Euphemismus wiedergegeben.
  alternative: Abschwächende Formulierungen wie „Untreue“, „Reize“ oder „Zärtlichkeiten“.
  rationale: Die drastische sexuelle Bildsprache stellt Jerusalems Bundesuntreue anklagend dar. Eine Abschwächung würde die rhetorische Kraft des Ausgangstextes mindern.
- issue: Mehrdeutigkeit von פקד zwischen Erinnern und erneutem Handeln
  choice: Im Haupttext steht die kontextuell wahrscheinliche aktive Bedeutung „wieder aufnehmen“; „sich erinnern“ wird als echte Alternative in der Fußnote bewahrt.
  alternative: Ausschließlich „du erinnertest dich“, wodurch eine bloß gedankliche Rückschau nahegelegt würde.
  rationale: Der Zusammenhang spricht für eine Rückkehr zum früheren Verhalten, doch das Verb selbst kann auch das Erinnern bezeichnen. Die Übersetzung entscheidet daher nicht stillschweigend über die bestehende Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, aber nicht sensationsheischender Wiedergabe der ausdrücklichen Körper- und Sexualsprache. Der Gedankenstrich macht die nachgestellte Wiederholung verständlich, ohne sie zu glätten.
