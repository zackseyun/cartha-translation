  text: ע֥וֹד זֹ֖את עָ֣שׂוּ לִ֑/י טִמְּא֤וּ אֶת מִקְדָּשִׁ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/038.yaml
  text: 'Moreover, they did this to me: they defiled my sanctuary on that same day, and they profaned my Sabbaths.'
translation:
  language: de
  text: 'Außerdem taten sie mir dies an: Sie verunreinigten an jenem Tag mein Heiligtum und entweihten meine Sabbate.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד זֹאת
  choice: Außerdem ... dies
  rationale: Die Wortverbindung fügt eine weitere Anklage hinzu. „Außerdem“ gibt diese additive Funktion im modernen Deutschen natürlich wieder, während „dies“ den Rückbezug bewahrt.
- source_word: עָשׂוּ לִי
  choice: taten sie mir dies an
  rationale: Die Verbindung mit לִי bezeichnet hier die gegen Gott gerichtete persönliche Kränkung. „Mir dies antun“ ist idiomatisch und bringt den adversativen Kontext zum Ausdruck, ohne ihn unnötig zu verstärken.
- source_word: טִמְּאוּ
  choice: verunreinigten
  rationale: Der Piel von טמא bezeichnet hier das kultische Unreinmachen des Heiligtums. „Verunreinigten“ bewahrt diesen kultischen Sinn und ist im Deutschen verständlich.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: מקדש bezeichnet den geheiligten Bereich. „Heiligtum“ wahrt den Bezug auf den heiligen Raum, ohne den Ausdruck vorschnell auf das Tempelgebäude zu verengen.
- source_word: בַּיּוֹם הַהוּא
  choice: noch am selben Tag
  rationale: Die Wendung verweist im Kontext auf genau den Tag, an dem die zuvor genannten Gräuel geschahen. „Am selben Tag“ macht diesen Zusammenhang deutlich; „noch“ hebt die empörende Gleichzeitigkeit idiomatisch hervor.
- source_word: שַׁבְּתוֹתַי
  choice: meine Sabbate
  rationale: Der hebräische Text hat ausdrücklich den Plural. „Sabbate“ ist die geläufige deutsche Pluralform und bewahrt den Gedanken wiederholter Verletzungen geheiligter Zeiten.
- source_word: חִלֵּלוּ
  choice: entweihten
  rationale: Der Piel von חלל bezeichnet das Profanieren dessen, was heilig ist. „Entweihten“ ist im Deutschen präzise, natürlich und trägt das kultische Gewicht des Ausdrucks.
theological_decisions:
- issue: Kultische Begriffe für heiligen Raum und heilige Zeiten
  choice: „Heiligtum“ und „Sabbate“ zusammen mit „verunreinigten“ und „entweihten“ beibehalten
  alternative: Allgemeinere Ausdrücke wie „Tempel“ und „missachteten“ verwenden
  rationale: Der Vers beschreibt nicht nur Respektlosigkeit, sondern die Verletzung der Heiligkeit von Gottes Raum und Zeiten. Die gewählten Begriffe bewahren das kultische und bundesbezogene Gewicht, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus zwischen der Verunreinigung des heiligen Raumes und der Entweihung heiliger Zeiten bleibt klar erkennbar. Keine Fußnoten erforderlich.
