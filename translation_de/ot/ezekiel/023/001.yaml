lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form führt die nächste Mitteilung im Erzählfluss ein. Die im Deutschen fest etablierte prophetische Formel „das Wort … erging“ gibt die hebräische Wendung natürlich und präzise wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet in dieser prophetischen Formel die göttliche Botschaft. „Das Wort“ bewahrt den formelhaften Charakter und die Verbindung mit dem Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלַי
  choice: an mich
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person bezeichnet die Ausrichtung auf den Propheten; in Verbindung mit „erging“ ist „an mich“ idiomatisches Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Gottesrede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch den traditionellen Titel „der HERR“ zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „Das Wort Jahwes erging an mich“ bleibt erhalten; der Doppelpunkt kündigt knapp die in Vers 2 folgende direkte Rede an.
