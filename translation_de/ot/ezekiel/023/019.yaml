source:
  edition: WLC
  text: וַ/תַּרְבֶּ֖ה אֶת תַּזְנוּתֶ֑י/הָ לִ/זְכֹּר֙ אֶת יְמֵ֣י נְעוּרֶ֔י/הָ אֲשֶׁ֥ר זָנְתָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/019.yaml
  text: Yet she multiplied her prostitutions[a], remembering the days of her youth, when she prostituted herself in the land of Egypt.
translation:
  language: de
  text: Doch sie vermehrte ihre Hurereien[a] und dachte an die Tage ihrer Jugend, als sie im Land Ägypten Hurerei trieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Taten der Prostitution«.'
    reason: Lexikalische Alternative, die den wiederholten Handlungscharakter des Plurals ausdrücklich macht.
lexical_decisions:
- source_word: וַתַּרְבֶּה
  choice: Doch sie vermehrte
  rationale: Das Hiphil von רבה bezeichnet hier ein Vermehren beziehungsweise Steigern. „Doch“ gibt im Zusammenhang den fortsetzenden, adversativen Sinn wieder.
- source_word: תַּזְנוּתֶיהָ
  choice: ihre Hurereien
  rationale: Der Plural bezeichnet wiederholte sexuelle Handlungen und trägt in Hesekiels Bildsprache zugleich die Bedeutung politischer und bundesbezogener Untreue. „Hurereien“ bewahrt die scharfe, anstößige Metaphorik des Ausgangstextes.
- source_word: לִזְכֹּר
  choice: und dachte an
  rationale: Der Infinitiv mit ל kann Ziel oder Begleitumstand ausdrücken. Die koordinierte Wiedergabe ist im Deutschen natürlich und lässt die genaue semantische Beziehung zum Vermehren ihrer Hurereien offen.
- source_word: יְמֵי נְעוּרֶיהָ
  choice: die Tage ihrer Jugend
  rationale: Die hebräische Zeitangabe wird nah am Wortlaut und zugleich idiomatisch wiedergegeben; sie verweist auf ihre frühe Geschichte.
- source_word: אֲשֶׁר זָנְתָה
  choice: als sie … Hurerei trieb
  rationale: Die Wendung erhält das zentrale Wortfeld von זנה und gibt den zeitlichen Rückbezug des Relativsatzes natürlich wieder.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Bewahrt die geläufige biblische geografische Formel und ihren historischen Nachklang.
theological_decisions:
- issue: Prophetische sexuelle Metapher für Götzendienst und politische Untreue
  choice: Die ausdrückliche Hurerei-Metaphorik wird beibehalten.
  alternative: Abschwächung zu „Untreue“ oder „Unmoral“.
  rationale: Hesekiels bewusst schockierende Bildsprache darf nicht stillschweigend vergeistigt oder abgeschwächt werden. Der Kontext trägt die übertragene Bedeutung, während die Übersetzung die rhetorische Härte wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hurereien“ ist bewusst hart und leicht bibelsprachlich, entspricht aber der drastischen prophetischen Metapher besser als eine abschwächende Umschreibung. Der Fußnotenmarker [a] steht unmittelbar beim betreffenden Ausdruck.
