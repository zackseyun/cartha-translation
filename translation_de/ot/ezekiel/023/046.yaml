source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הַעֲלֵ֤ה עֲלֵי/הֶם֙ קָהָ֔ל וְ/נָתֹ֥ן אֶתְ/הֶ֖ן לְ/זַעֲוָ֥ה וְ/לָ/בַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/046.yaml
  text: 'For thus says the Lord GOD: Bring up an assembly against them[a], and give them over to terror and plunder.'
translation:
  language: de
  text: 'Denn so spricht der Herr Yahweh: Biete eine Schar gegen sie auf und gib sie dem Entsetzen[a] und der Plünderung preis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mach sie zum Gegenstand des Schreckens und der Plünderung“. Das hebräische Substantiv זַעֲוָה kann sowohl „Entsetzen“ als auch etwas bezeichnen, das Schrecken hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die beiden Bestandteile des göttlichen Titels bleiben erkennbar; der Gottesname יְהוָה wird als „Yahweh“ wiedergegeben, während אֲדֹנָי „Herr“ entspricht.
- source_word: הַעֲלֵה ... קָהָל
  choice: Biete eine Schar ... auf
  rationale: Der Hifil-Imperativ von עלה fordert hier dazu auf, eine feindliche Gruppe gegen die Frauen heranzuführen. „Eine Schar aufbieten“ ist im Deutschen natürlich und lässt offen, wie genau diese Gruppe zusammengesetzt ist.
- source_word: וְנָתֹן
  choice: und gib ... preis
  rationale: Der Infinitivus absolutus führt die Befehlsfolge mit imperativischer Kraft weiter. Die Wendung „preisgeben“ gibt die Übergabe an das folgende Unheil idiomatisch wieder.
- source_word: לְזַעֲוָה
  choice: dem Entsetzen
  rationale: זַעֲוָה kann das erlebte Entsetzen oder den Schrecken bezeichnen, zu dessen Gegenstand jemand wird. „Entsetzen“ bewahrt diese Bedeutungsbreite weitgehend; die objektbezogene Lesart wird in einer Fußnote genannt.
- source_word: לָבַז
  choice: der Plünderung
  rationale: בַּז bezeichnet Beute beziehungsweise Plünderung. Zusammen mit „preisgeben“ bezeichnet „der Plünderung“ hier klar das ihnen zugedachte Geschick.
- source_word: עֲלֵיהֶם / אֶתְהֶן
  choice: gegen sie ... sie
  rationale: Das Deutsche kann den Wechsel vom maskulinen Plural bei עֲלֵיהֶם zum femininen Plural bei אֶתְהֶן nicht ungekünstelt abbilden. Das Pronomen verweist im Zusammenhang auf Ohola und Oholiba.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: „Der Herr Yahweh“ bewahrt sowohl den Titel אֲדֹנָי als auch den im hebräischen Text ausdrücklich stehenden Gottesnamen, ohne beide zu einem einzigen Titel zu verschmelzen.
- issue: Art des angekündigten Gerichts
  choice: dem Entsetzen und der Plünderung preisgeben
  alternative: zum Schreckbild und zur Beute machen
  rationale: Die Formulierung lässt die Spannung bestehen, ob זַעֲוָה vor allem ihr eigenes Erleben oder ihre Wirkung als Gegenstand des Schreckens bezeichnet, und vermeidet eine übermäßig präzisierende Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schar“ hält die Art der versammelten feindlichen Gruppe offen; „aufbieten“ und „preisgeben“ bilden die knappe gerichtliche Befehlssprache natürlich ab.
