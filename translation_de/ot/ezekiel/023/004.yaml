  text: וּ/שְׁמוֹתָ֗/ן אָהֳלָ֤ה הַ/גְּדוֹלָה֙ וְ/אָהֳלִיבָ֣ה אֲחוֹתָ֔/הּ וַ/תִּֽהְיֶ֣ינָה לִ֔/י וַ/תֵּלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/שְׁמוֹתָ֕/ן שֹׁמְר֣וֹן אָהֳלָ֔ה וִ/ירוּשָׁלִַ֖ם אָהֳלִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/004.yaml
  text: 'Their names were Oholah the elder and Oholibah her sister[a]. They became mine and bore sons and daughters. As for their names: Samaria is Oholah[b], and Jerusalem is Oholibah.'
translation:
  language: de
  text: 'Ihre Namen waren Ohola, die Ältere, und Oholiba, ihre Schwester.[a] Sie wurden die Meinen[b] und gebaren Söhne und Töchter. Ihre Namen: Samaria ist Ohola, und Jerusalem ist Oholiba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Namen Ohola und Oholiba klingen wahrscheinlich an hebräische Wendungen wie „ihr Zelt“ und „mein Zelt ist in ihr“ an und unterstreichen so die Bildrede.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Sie gehörten mir.“ Der hebräische Ausdruck bezeichnet Zugehörigkeit beziehungsweise Beziehung; im größeren Zusammenhang ist die Bildrede ehelich geprägt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמוֹתָן
  choice: Ihre Namen waren
  rationale: Gibt die einleitende Namensnennung natürlich wieder; das hebräische ו kann im Deutschen unmarkiert bleiben.
- source_word: אָהֳלָה הַגְּדוֹלָה
  choice: Ohola, die Ältere
  rationale: Im Zusammenhang zweier Schwestern bezeichnet הַגְּדוֹלָה am ehesten die ältere, nicht die körperlich größere Schwester; der Eigenname wird in deutscher Form transliteriert.
- source_word: וְאָהֳלִיבָה אֲחוֹתָהּ
  choice: und Oholiba, ihre Schwester
  rationale: Bewahrt Abfolge und appositionale Beziehung des Hebräischen in natürlichem Deutsch.
- source_word: וַתִּהְיֶינָה לִי
  choice: Sie wurden mein
  rationale: Die Formulierung bewahrt den Übergang in ein Zugehörigkeitsverhältnis, ohne die im unmittelbaren Wortlaut nicht ausdrücklich genannte Ehebezeichnung einzufügen.
- source_word: וַתֵּלַדְנָה בָּנִים וּבָנוֹת
  choice: und gebaren Söhne und Töchter
  rationale: Gibt den mütterlichen Geburtsvorgang sowie die ausdrückliche Nennung beider Geschlechter genau und knapp wieder.
- source_word: וּשְׁמוֹתָן
  choice: 'Ihre Namen:'
  rationale: Die knappe Wiederaufnahme leitet die Identifizierung der allegorischen Frauen mit den Städten ein.
- source_word: שֹׁמְרוֹן אָהֳלָה
  choice: Samaria ist Ohola
  rationale: Die im Hebräischen verblos ausgedrückte Gleichsetzung erhält im Deutschen zur Klarheit eine Kopula.
- source_word: וִירוּשָׁלִַם אָהֳלִיבָה
  choice: und Jerusalem ist Oholiba
  rationale: Gibt parallel zur ersten Gleichsetzung die allegorische Identifizierung klar wieder.
theological_decisions:
- issue: Bedeutung von וַתִּהְיֶינָה לִי innerhalb der prophetischen Allegorie
  choice: Sie wurden mein
  alternative: Sie wurden meine Frauen; Sie gehörten mir
  rationale: Der weitere Zusammenhang ist ehelich geprägt, doch der Vers sagt wörtlich nur, dass sie für den Sprecher „mein“ wurden. Die gewählte Formulierung bewahrt Zugehörigkeit, Beziehung und den Zustandsübergang, ohne die Spannung durch einen ausdrücklich eingefügten Ehebegriff aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Erzählweise. Die Eigennamen folgen den im Deutschen naheliegenden Formen Ohola und Oholiba. Das etwas markante „Sie wurden mein“ ist bewusst beibehalten, um den Zustandsübergang und die offene Beziehungsformulierung des Hebräischen zu wahren.
