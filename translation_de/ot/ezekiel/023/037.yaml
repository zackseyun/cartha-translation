base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/037.yaml
  text: For they have committed adultery[a], and blood is on their hands; they have committed adultery with their idols, and they even made their sons, whom they bore to me[b], pass through the fire to them as food.
translation:
  language: de
  text: Denn sie haben Ehebruch begangen, und Blut ist an ihren Händen. Mit ihren Götzen[a] haben sie Ehebruch begangen. Auch ihre Söhne, die sie mir geboren haben, ließen sie hindurchgehen, um sie ihnen zur Speise zu geben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist eine verächtliche Bezeichnung für Götzen.
    reason: lexical_note
  - marker: b
    text: 'Wörtlich: „ließen sie ihnen zur Speise hindurchgehen“. In diesem kultischen Zusammenhang bezeichnet die Wendung ein Kinderopfer; in vergleichbaren Texten wird dies mit Feuer verbunden.'
    reason: cultural_note
lexical_decisions:
- source_word: נִאֵפוּ
  choice: haben Ehebruch begangen
  rationale: Das Verb bezeichnet wörtlich Ehebruch und trägt hier zugleich die prophetische Bildbedeutung des Bundesbruchs durch Götzendienst. Die Wiederholung im Hebräischen bleibt erhalten.
- source_word: דָם בִּידֵיהֶן
  choice: Blut klebt an ihren Händen
  rationale: Die natürliche deutsche Wendung bringt die mit Mord verbundene Blutschuld deutlich zum Ausdruck.
- source_word: גִּלּוּלֵיהֶן
  choice: ihren Götzen
  rationale: „Götzen“ gibt die klare Referenz wieder; die im hebräischen Ausdruck enthaltene verächtliche Färbung wird in einer Fußnote erläutert.
- source_word: וְאֶת גִּלּוּלֵיהֶן נִאֵפוּ
  choice: Mit ihren Götzen haben sie Ehebruch begangen
  rationale: „Mit“ bewahrt die relationale Ehebruchsmetapher und lässt zugleich den Götzendienst als Bundesuntreue erkennen.
- source_word: בְּנֵיהֶן אֲשֶׁר יָלְדוּ לִי
  choice: ihre Söhne, die sie mir geboren hatten
  rationale: „Söhne“ entspricht dem konkreten בנים; „mir geboren“ bewahrt Gottes Anspruch auf die Kinder, ohne ihn auszudeuten.
- source_word: הֶעֱבִירוּ
  choice: ließen ... durchs Feuer gehen
  rationale: Wörtlich steht „ließen ... hindurchgehen“. Im kultischen Zusammenhang mit Blutschuld und Götzen bezeichnet die feste Wendung ein Kinderopfer; „durchs Feuer“ macht den idiomatischen Sinn verständlich und wird durch eine Fußnote transparent gemacht.
- source_word: לָהֶם
  choice: für sie / ihnen
  rationale: Das Pronomen bezieht sich am natürlichsten auf die zuvor genannten Götzen. Die deutsche Formulierung wahrt diese Beziehung.
- source_word: לְאָכְלָה
  choice: damit sie ihnen zur Speise dienten
  rationale: Der Ausdruck bedeutet „zur Speise“ beziehungsweise „zum Verzehr“ und zeichnet die Kinder erschreckend als den Götzen dargebrachte Nahrung.
theological_decisions:
- issue: Ob das Kinderopfer und das Feuer im Haupttext ausdrücklich genannt werden sollen
  choice: ließen sie ... durchs Feuer gehen
  alternative: ließen sie ... hindurchgehen
  rationale: „Feuer“ steht nicht ausdrücklich in diesem Vers, gehört aber zum etablierten kultischen Sinn der Wendung. Die Ergänzung vermittelt modernen Lesern den gemeinten Opferakt, während die Fußnote den Wortlaut offenlegt.
- issue: Gottes Anspruch auf die geopferten Söhne
  choice: die sie mir geboren hatten
  alternative: die sie für mich geboren hatten
  rationale: Die knappe Dativkonstruktion bewahrt den im Hebräischen formulierten Anspruch Gottes, ohne genauer festzulegen, ob Besitz, Bundeszugehörigkeit oder Bestimmung im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Aussage über den Ehebruch bewahrt die eindringliche Wiederholung und die Spannung zwischen sexuellem Bild und geistlichem Bundesbruch. Die drastische Speisemetapher bleibt stehen, ohne sie abzuschwächen.
