  to: Denn sie haben Ehebruch begangen, und Blut ist an ihren Händen. Mit ihren Götzen[a] haben sie Ehebruch begangen. Auch ihre Söhne, die sie mir geboren haben, ließen sie hindurchgehen, um sie ihnen zur Speise zu geben[b].
  rationale: Die Revision entfernt die im Vers selbst nicht genannte Ergänzung „Feuer“, bewahrt aber den kultischen Zusammenhang transparent in der Fußnote. Sie stellt die abschließende Wendung als Übergabe der Söhne an die Götzen „zur Speise“ dar, ohne den hebräischen Ausdruck durch die zusätzliche Vorstellung eines Dienstes zu verändern. Die wiederholte Ehebruchsmetapher, die Blutschuld und Gottes knapper Anspruch auf die Söhne bleiben erhalten.
