base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/018.yaml
  text: She uncovered her prostitutions and uncovered her nakedness[a]; then my soul was repulsed by her[c][b], just as my soul had been repulsed by her sister.
translation:
  language: de
  text: Sie enthüllte ihre Hurereien und legte ihre Nacktheit bloß[a]. Da wandte sich meine Seele mit Abscheu von ihr ab[b], so wie sich meine Seele von ihrer Schwester abgewandt hatte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ihre Blöße“; das Wort kann im Zusammenhang eine sexualisierte Entblößung einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb bezeichnet ein starkes inneres Zurückweichen oder Sich-Lösen; möglich ist auch: „Meine Seele löste sich von ihr“ oder „Meine Seele empfand Abscheu vor ihr“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ihre Schwester Ohola, das heißt Samaria (vgl. Verse 4–10).
    reason: cross_reference
lexical_decisions:
- source_word: וַתְּגַל
  choice: deckte … auf / entblößte
  rationale: גלה bezeichnet das Aufdecken oder Enthüllen. Beim ersten Vorkommen bewahrt „aufdecken“ die konkrete Metapher; beim parallelen zweiten Vorkommen ist „entblößen“ mit „Scham“ natürliches Deutsch.
- source_word: תַּזְנוּתֶיהָ
  choice: ihre Hurerei
  rationale: זְנוּת bezeichnet sexuelles Fehlverhalten beziehungsweise Prostitution und steht hier zugleich bildlich für politische und kultische Untreue. „Hurerei“ erhält die Härte der prophetischen Sprache; im Deutschen wird das Kollektiv idiomatisch im Singular wiedergegeben.
- source_word: עֶרְוָתָהּ
  choice: ihre Scham
  rationale: עֶרְוָה kann Nacktheit, Blöße oder den entblößten Intimbereich bezeichnen. „Scham“ ist in der Verbindung „die Scham entblößen“ konkret, würdevoll und lässt den anatomischen Bezug offen.
- source_word: וַתֵּקַע / נָקְעָה
  choice: wandte sich … voller Abscheu ab / hatte sich … abgewandt
  rationale: נקעה drückt hier ein heftiges inneres Zurückweichen und die Lösung einer Bindung aus. Die Formulierung verbindet die Bewegungsrichtung von מֵעַל mit der starken Abscheu des Verbs; das Plusquamperfekt kennzeichnet im Vergleichssatz die frühere Reaktion auf die Schwester.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ bezeichnet hier das innere Selbst des Sprechers. Die wörtliche Wendung bewahrt die eindringliche anthropopathische Ausdrucksweise.
- source_word: מֵעָלֶיהָ
  choice: von ihr ab
  rationale: Die Präposition bezeichnet die Trennung beziehungsweise Abwendung von ihr und wird zusammen mit נקעה idiomatisch als „sich von ihr abwenden“ wiedergegeben.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Leitet den ausdrücklichen Vergleich mit der vorausgehenden Reaktion auf die Schwester ein.
- source_word: אֲחוֹתָהּ
  choice: ihrer Schwester
  rationale: Die direkte Verwandtschaftsbezeichnung wird innerhalb der Allegorie der beiden Schwestern beibehalten.
theological_decisions:
- issue: Sexuelles Bild für Bundesuntreue
  choice: Die explizite Bildsprache mit „Hurerei“ und „Scham“ bleibt im Haupttext erhalten.
  alternative: Verallgemeinerung zu „Untreue“ oder „Schande“.
  rationale: Ezechiels bewusst drastische sexuelle Metaphorik bezeichnet kultische und politische Untreue. Eine bloß abstrakte Wiedergabe würde die prophetische Wirkung abschwächen und die Deutung an die Stelle des Bildes setzen.
- issue: Anthropopathische Rede von Gottes Reaktion
  choice: „Meine Seele“ und die starke Abscheu werden bewahrt.
  alternative: Glättung zu „Ich trennte mich von ihr“ oder „Ich verwarf sie“.
  rationale: Der hebräische Text beschreibt Gottes Reaktion als intensive persönliche Abwendung. Die Übersetzung erhält diese Spannung, ohne sie dogmatisch aufzulösen.
- issue: Bezug der Schwester
  choice: Der Haupttext belässt es bei „ihrer Schwester“; die Fußnote identifiziert sie aus dem Kontext als Samaria beziehungsweise Ohola.
  alternative: Den Eigennamen unmittelbar in den Haupttext einsetzen.
  rationale: Der hebräische Vers nennt nur die Schwester. Ihre Identifizierung ist kontextuell eindeutig, soll aber nicht in den Wortlaut hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst kräftiger prophetischer Sprache. „Hurerei“ ist hart, aber nicht archaisierend gemeint; „Prostitutionen“ wäre im Deutschen als abstrakter Plural weniger natürlich. Die Satzfolge und der Parallelismus des Hebräischen bleiben erkennbar.
