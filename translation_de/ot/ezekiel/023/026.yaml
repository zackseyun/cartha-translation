  yaml_path: translation/ot/ezekiel/023/026.yaml
  text: They will strip you of your garments and take your splendid ornaments[a].
translation:
  language: de
  text: Sie werden dir deine Kleider ausziehen und deinen prächtigen Schmuck[a] wegnehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Gegenstände deiner Schönheit/Pracht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְשִׁיטוּךְ
  choice: Sie werden dir … ausziehen
  rationale: Der Hifil von פשט mit Suffix der 2. Person Singular feminin bezeichnet das Ausziehen beziehungsweise Entkleiden einer Person. Zusammen mit dem ausdrücklich genannten Objekt »deine Kleider« ist die deutsche Konstruktion »dir deine Kleider ausziehen« natürlich und vermeidet die stärkere Ergänzung »nackt«.
- source_word: בְּגָדָיִךְ
  choice: deine Kleider
  rationale: בגד ist die übliche Bezeichnung für Kleidung oder Gewänder. »Kleider« ist im modernen Standarddeutsch klar, würdig und passt zur direkten Anrede einer weiblich dargestellten Stadt.
- source_word: וְלָקְחוּ
  choice: wegnehmen
  rationale: לקח bedeutet grundsätzlich »nehmen«. Im Zusammenhang mit gewaltsamer Entkleidung drückt »wegnehmen« die Entfernung des Besitzes idiomatisch aus, ohne die stärkere Bedeutung »rauben« ausdrücklich einzutragen.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: deinen prächtigen Schmuck
  rationale: כְּלִי bezeichnet einen Gegenstand oder Artikel, תִּפְאֶרֶת Schönheit, Pracht oder Herrlichkeit. Im Kontext persönlicher Ausstattung ist »Schmuck« wahrscheinlich; »prächtig« erhält den Gedanken von Glanz und Pracht, während die Fußnote die wörtlichere, breitere Formulierung bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die feminine Singularanrede des Hebräischen bleibt durch »dir/deine/deinen« im Kontext anschlussfähig; eine ausdrückliche Geschlechtsmarkierung ist im deutschen Pronomen hier nicht möglich. Der Parallelismus der beiden Verbhandlungen wird bewahrt.
