base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/020.yaml
  text: She lusted after their paramours[a], whose flesh was like the flesh of donkeys[c][b], and whose emission was like the emission of horses.
translation:
  language: de
  text: Und sie begehrte leidenschaftlich ihre Liebhaber[a], deren Fleisch wie das Fleisch von Eseln war[b] und deren Erguss wie der Erguss von Hengsten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Nebenfrauen“ oder „ihre Konkubinen“. Im Zusammenhang ist der Ausdruck bildlich wohl auf Sexualpartner beziehungsweise Liebhaber bezogen.'
    reason: lexical_alternative
  - marker: b
    text: „Fleisch“ dient hier wahrscheinlich als sexuelles Hüllwort für das männliche Glied.
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist wahrscheinlich der Samenerguss.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגְּבָה עַל
  choice: sie begehrte leidenschaftlich
  rationale: עגב mit עַל bezeichnet hier starkes erotisches Verlangen. „Begehrte leidenschaftlich“ gibt die sexuelle Intensität natürlich wieder, ohne unnötig umgangssprachlich zu klingen.
- source_word: פִּלַגְשֵׁיהֶם
  choice: ihre Liebhaber
  rationale: Die Form bedeutet wörtlich „ihre Nebenfrauen/Konkubinen“, wird im Bildzusammenhang jedoch auf männliche Sexualpartner bezogen. „Liebhaber“ folgt dem kontextuellen Sinn; die auffällige wörtliche Bedeutung bleibt in der Fußnote erhalten.
- source_word: בְּשַׂר חֲמוֹרִים בְּשָׂרָם
  choice: deren Fleisch wie das Fleisch von Eseln war
  rationale: בָּשָׂר heißt wörtlich „Fleisch“, dient hier aber wahrscheinlich als sexuelles Hüllwort für das Glied. Der Haupttext bewahrt das konkrete Bild und die Euphemie des Hebräischen.
- source_word: וְזִרְמַת סוּסִים זִרְמָתָם
  choice: und deren Erguss wie der Erguss von Hengsten
  rationale: זִרְמָה bezeichnet einen Ausfluss bzw. Erguss und meint hier den Samenerguss. „Erguss“ wahrt die zugleich konkrete und verhüllende Ausdrucksweise; „Hengste“ macht den im Vergleich vorausgesetzten männlichen Bezug im Deutschen idiomatisch deutlich.
