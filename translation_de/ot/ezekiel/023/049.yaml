source:
  edition: WLC
  text: וְ/נָתְנ֤וּ זִמַּתְ/כֶ֨נָה֙ עֲלֵי/כֶ֔ן וַ/חֲטָאֵ֥י גִלּוּלֵי/כֶ֖ן תִּשֶּׂ֑אינָה וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/049.yaml
  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
translation:
  language: de
  text: Sie werden eure Unzucht auf euch legen, und ihr werdet die Sünden eurer Götzen[a] tragen. Dann werdet ihr erkennen, dass ich der Herr, JHWH, bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Götzen“ ist stark verächtlich und kann anschaulicher auch mit „Mistgötzen“ oder „abscheuliche Götzen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ ... עֲלֵיכֶן
  choice: Sie werden ... auf euch legen
  rationale: Die konkrete Grundbedeutung von נתן mit עַל bleibt erhalten; im Gerichtszusammenhang bezeichnet die Wendung, dass die Folgen der Tat auf die Angesprochenen gelegt werden.
- source_word: זִמַּתְכֶנָה
  choice: eure Unzucht
  rationale: זִמָּה bezeichnet in Ezechiel 23 die schamlose sexuelle Verfehlung und trägt zugleich eine moralische Wertung; „Unzucht“ gibt diesen Zusammenhang knapp und würdig wieder.
- source_word: וַחֲטָאֵי גִלּוּלֵיכֶן
  choice: die Sünden mit euren Götzen
  rationale: Der hebräische Genitiv verbindet die Sünden eng mit dem Götzendienst. Die deutsche Formulierung vermeidet den irreführenden Eindruck, die Götzen selbst hätten gesündigt, ohne die Beziehung unnötig genauer festzulegen.
- source_word: תִּשֶּׂאינָה
  choice: ihr werdet ... tragen
  rationale: נשא mit „Sünden“ bezeichnet das Tragen von Schuld beziehungsweise ihrer Folgen. „Tragen“ bewahrt das Bild und seine gerichtliche Schwere.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: „Dann“ bringt den Folgezusammenhang des prophetischen Gerichtswortes natürlich zum Ausdruck; „erkennen“ entspricht der formelhaften, erfahrungsbezogenen Bedeutung von ידע.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „JHWH“ den im Ausgangstext ausdrücklich stehenden Gottesnamen transparent bewahrt und die schwerfällige Doppelung „Herr HERR“ vermeidet.
theological_decisions:
- issue: Beziehung zwischen den Sünden und den Götzen in וַחֲטָאֵי גִלּוּלֵיכֶן
  choice: die Sünden mit euren Götzen
  alternative: die Sünden eurer Götzen / die Sünden wegen eurer Götzen
  rationale: Die gewählte Fassung macht den Götzendienst als Zusammenhang der Sünden verständlich, legt aber nicht fest, ob der Genitiv Zugehörigkeit, Ursache oder nähere Bestimmung ausdrückt.
- issue: Wiedergabe des Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  alternative: GOTT, der Herr / der Herr Jahwe
  rationale: Die Fassung unterscheidet Titel und Eigenname und hält das Tetragramm sichtbar, ohne eine bestimmte Aussprache als sicher vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche hebräische Wendung „auf euch legen“ wurde bewusst beibehalten, weil sie das Gerichtsbild trägt. Das im Hebräischen wechselnde grammatische Geschlecht der Anrede ist im Deutschen bei „ihr/euch“ nicht sichtbar.
