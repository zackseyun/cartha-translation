base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/005.yaml
  text: And to the others he said in my hearing[a], “Pass through the city after him and strike; do not let your eye spare, and do not show pity.”
translation:
  language: de
  text: 'Und zu den anderen sagte er in meinem Beisein: „Geht hinter ihm her durch die Stadt und schlagt zu! Euer Auge soll kein Mitleid haben[a], und ihr sollt kein Erbarmen zeigen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Euer Auge soll nicht schonen“ – eine anschauliche hebräische Wendung, die verbietet, aus Mitleid zu verschonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: Und zu den anderen
  rationale: אֵלֶּה bezeichnet im Zusammenhang die übrigen Vollstrecker im Unterschied zu dem in Leinen gekleideten Mann; „die anderen“ macht diesen Rückbezug natürlich verständlich.
- source_word: אָמַר בְּאָזְנַי
  choice: sagte er vor meinen Ohren
  rationale: Die hebräische Wendung bezeichnet eine für den Propheten unmittelbar hörbare Äußerung. Die anschauliche Formulierung ist auch im Deutschen verständlich und bewahrt das Bild des Ausgangstextes.
- source_word: עִבְרוּ בָעִיר אַחֲרָיו
  choice: Geht hinter ihm her durch die Stadt
  rationale: עבר bezeichnet hier das Hindurchgehen, אַחֲרָיו die Bewegung hinter dem zuvor genannten Mann her. Die deutsche Wortfolge bildet den räumlichen Zusammenhang klar ab.
- source_word: וְהַכּוּ
  choice: und schlagt zu
  rationale: נכה kann „schlagen“ beziehungsweise „niederschlagen“ bedeuten. „Schlagt zu“ bewahrt die verbale Wucht, ohne die Bedeutung bereits im Einzelwort ausdrücklich auf „töten“ zu verengen.
- source_word: עַל תָּחֹס עֵינֵיכֶם
  choice: Euer Auge soll kein Mitleid haben
  rationale: Die auffällige Augenmetapher wird bewahrt; der Singular „Auge“ kann wie im Hebräischen kollektiv beziehungsweise distributiv verstanden werden. Die Wendung verbietet mitleidiges Verschonen.
- source_word: וְאַל תַּחְמֹלוּ
  choice: und ihr sollt kein Erbarmen zeigen
  rationale: חמל verbietet hier Erbarmen beziehungsweise Schonung. „Erbarmen zeigen“ hält die parallele Aussage von der vorausgehenden Augenmetapher sprachlich unterscheidbar.
theological_decisions:
- issue: Härte des göttlichen Gerichtsbefehls
  choice: Der Befehl bleibt als uneingeschränkter, gewaltsamer Gerichtsbefehl stehen.
  alternative: Die Gewalt durch eine euphemistische oder erklärend abschwächende Formulierung mildern.
  rationale: Der hebräische Text schildert das Gericht bewusst schonungslos. Die Übersetzung darf diese theologische Spannung weder abschwächen noch durch eine zusätzliche Rechtfertigung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Befehlsform und die Härte der Szene bleiben erhalten; die hebräische Augenmetapher wird im Haupttext weitgehend bewahrt und in der Fußnote erläutert.
