source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם טַמְּא֣וּ אֶת הַ/בַּ֗יִת וּ/מַלְא֧וּ אֶת הַ/חֲצֵר֛וֹת חֲלָלִ֖ים צֵ֑אוּ וְ/יָצְא֖וּ וְ/הִכּ֥וּ בָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/007.yaml
  text: And he said to them[a], “Defile the house, and fill the courts with the slain[b]. Go out.” So they went out and struck down people in the city.
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Verunreinigt das Haus[a] und füllt die Höfe mit Erschlagenen[b]. Geht hinaus!“ Da gingen sie hinaus und schlugen in der Stadt Menschen nieder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Tempel. Wörtlich: das Haus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: füllt die Höfe mit Leichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַמְּאוּ
  choice: Verunreinigt
  rationale: Der Piel-Imperativ bezeichnet hier das rituelle Unreinmachen des Heiligtums. „Verunreinigt“ gibt den kultischen Sinn direkt wieder und bewahrt die Härte des Befehls.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild; aus dem Zusammenhang geht hervor, dass der Tempel gemeint ist. Die verständlichere Sachbezeichnung steht in der Fußnote.
- source_word: הַחֲצֵרוֹת
  choice: die Vorhöfe
  rationale: Gemeint sind die Höfe des Tempelbereichs. „Vorhöfe“ ist im Deutschen eine geläufige Bezeichnung für solche Teile einer Tempelanlage.
- source_word: חֲלָלִים
  choice: Erschlagene
  rationale: Das Wort bezeichnet gewaltsam Getötete. „Erschlagene“ bewahrt diesen Aspekt genauer als das allgemeinere „Tote“.
- source_word: צֵאוּ
  choice: Geht hinaus
  rationale: Der direkte Imperativ bezeichnet das Verlassen des Tempelbereichs und wird in natürlichem, gegenwärtigem Deutsch wiedergegeben.
- source_word: וְיָצְאוּ
  choice: Da gingen sie hinaus
  rationale: „Da“ gibt die unmittelbare narrative Folge des ausgeführten Befehls flüssig wieder.
- source_word: וְהִכּוּ
  choice: schlugen … Menschen nieder
  rationale: נכה bezeichnet in diesem Gerichtszusammenhang tödliches Schlagen. „Menschen“ ergänzt das im Hebräischen unausgesprochene Objekt, das für natürliches Deutsch erforderlich ist.
- source_word: בָעִיר
  choice: in der Stadt
  rationale: Die schlichte Ortsangabe entspricht dem Hebräischen, ohne eine weitergehende Verteilung wie „überall in der Stadt“ einzutragen.
theological_decisions:
- issue: Der Befehl, das Heiligtum zu verunreinigen
  choice: Der Imperativ wird unmittelbar als „Verunreinigt das Haus“ wiedergegeben.
  alternative: Den Ausdruck durch „Macht das Haus unrein“ abschwächen oder umschreiben.
  rationale: Die Vision stellt die Verunreinigung als Teil des göttlichen Gerichts dar. Die schockierende Spannung des Befehls soll nicht geglättet werden.
- issue: Ob הַבַּיִת im Haupttext ausdrücklich als Tempel bezeichnet werden soll
  choice: Im Haupttext steht „das Haus“, mit „Tempel“ als Fußnotenalternative.
  alternative: Im Haupttext „den Tempel“ schreiben.
  rationale: So bleibt die konkrete hebräische Ausdrucksweise erhalten, während die gemeinte Sache für heutige Leser eindeutig erläutert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperative bewahren die Unerbittlichkeit der Gerichtsszene; altertümliche Wörter und beschönigende Umschreibungen werden vermieden.
