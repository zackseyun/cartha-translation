  text: וַ/יֹּ֤אמֶר יְהוָה֙ אל/ו עֲבֹר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר בְּ/ת֖וֹךְ יְרֽוּשָׁלִָ֑ם וְ/הִתְוִ֨יתָ תָּ֜ו עַל מִצְח֣וֹת הָ/אֲנָשִׁ֗ים הַ/נֶּֽאֱנָחִים֙ וְ/הַ/נֶּ֣אֱנָקִ֔ים עַ֚ל כָּל הַ/תּ֣וֹעֵב֔וֹת הַֽ/נַּעֲשׂ֖וֹת בְּ/תוֹכָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/004.yaml
  text: And Yahweh said to him[a], “Pass through the midst of the city, through the midst of Jerusalem, and put a mark on the foreheads of the men who sigh and groan over all the abominations being done in her midst.”
translation:
  language: de
  text: 'Und Jahwe sagte zu ihm: »Geh mitten durch die Stadt, mitten durch Jerusalem, und bring auf den Stirnen der Männer ein Zeichen[a] an, die wegen all der Gräuel seufzen und stöhnen, die in ihrer Mitte begangen werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch taw: Möglicherweise bezieht es sich auf den Buchstaben ת, der als Zeichen verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH in der im Deutschen geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֲבֹר
  choice: Geh ... durch
  rationale: Der Imperativ fordert eine Bewegung durch die Stadt; die Formulierung ist natürlich und bewahrt die Befehlsform.
- source_word: בְּתוֹךְ ... בְּתוֹךְ
  choice: mitten durch ... mitten durch
  rationale: Bewahrt die hebräische Wiederholung und ihren Nachdruck in idiomatischem Deutsch.
- source_word: וְהִתְוִיתָ תָּו
  choice: bring ein Zeichen ... an
  rationale: Gibt die Funktion als sichtbare Kennzeichnung klar wieder, ohne תָּו im Haupttext vorschnell auf einen bestimmten Buchstaben oder eine spätere Symbolik festzulegen.
- source_word: מִצְחוֹת
  choice: auf der Stirn
  rationale: Im Deutschen steht bei einem auf mehrere Personen bezogenen Körperteil idiomatisch häufig der Singular; der Bezug auf sämtliche Männer bleibt eindeutig.
- source_word: הָאֲנָשִׁים
  choice: der Männer
  rationale: Entspricht dem maskulinen Plural des hebräischen Substantivs, ohne ihn zu einer allgemeineren Personengruppe umzudeuten.
- source_word: הַנֶּאֱנָחִים וְהַנֶּאֱנָקִים
  choice: die ... seufzen und stöhnen
  rationale: Bewahrt die zwei Ausdrücke hörbarer Bekümmernis und ihre parallele Wirkung.
- source_word: עַל כָּל הַתּוֹעֵבוֹת
  choice: wegen all der Gräueltaten
  rationale: עַל bezeichnet hier den Anlass ihrer Klage; „Gräueltaten“ trägt das starke moralisch-religiöse Gewicht von תּוֹעֵבוֹת und passt zu Handlungen, die begangen werden.
- source_word: הַנַּעֲשׂוֹת
  choice: die ... begangen werden
  rationale: Die passive Partizipialform bezeichnet die dort stattfindenden Handlungen; „begangen werden“ ist bei Gräueltaten natürliches Deutsch.
- source_word: בְּתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Bewahrt den Rückbezug des femininen Suffixes auf die Stadt beziehungsweise Jerusalem.
theological_decisions:
- issue: Mögliche symbolische Bedeutung von תָּו als Buchstabe Taw
  choice: Im Haupttext funktional als „ein Zeichen“ wiedergegeben
  alternative: „ein Taw“ oder „den Buchstaben Taw“
  rationale: Im unmittelbaren Zusammenhang dient es als unterscheidende Kennzeichnung. Eine Festlegung auf die Buchstabenform könnte spätere symbolische Deutungen in den Vers hineintragen; die lexikalische Möglichkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die nachdrückliche Wiederholung „mitten durch“ bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
