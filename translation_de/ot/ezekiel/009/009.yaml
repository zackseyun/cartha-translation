  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲוֺ֨ן בֵּֽית יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ גָּדוֹל֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַ/תִּמָּלֵ֤א הָ/אָ֨רֶץ֙ דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֣ה מֻטֶּ֑ה כִּ֣י אָמְר֗וּ עָזַ֤ב יְהוָה֙ אֶת הָ/אָ֔רֶץ וְ/אֵ֥ין יְהוָ֖ה רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/009.yaml
  text: Then he said to me[a], “The iniquity of the house of Israel and Judah is exceedingly great, and the land is filled with bloodshed, and the city is full of perversion. For they say, ‘Yahweh has forsaken the land, and Yahweh does not see.’”
translation:
  language: de
  text: 'Da sagte er zu mir: „Die Schuld des Hauses Israel und Juda ist überaus groß. Das Land ist voller Blutvergießen, und die Stadt ist voller Rechtsverdrehung.[a] Denn sie sagen: ‚Jahwe hat das Land verlassen, und Jahwe sieht es nicht.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „voller Verdrehung“ beziehungsweise „voller verdrehten Rechts“. Das hebräische Wort bezeichnet eine Verkehrung dessen, was recht ist, wahrscheinlich einschließlich richterlicher Ungerechtigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺן
  choice: Schuld
  rationale: Das Substantiv bezeichnet sowohl schuldhaftes Unrecht als auch die daraus erwachsende Schuld. Im Zusammenhang fasst es die schwere moralische Verfehlung Israels und Judas zusammen; „Schuld“ wahrt diese Bedeutungsbreite natürlicher als das heute weniger geläufige „Missetat“.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: das Haus Israel und Juda
  rationale: Bewahrt den korporativen Ausdruck „Haus Israel“ und gibt die koordinierte Nennung Judas knapp und quellennah wieder.
- source_word: גָּדוֹל בִּמְאֹד מְאֹד
  choice: überaus groß
  rationale: Die Verdoppelung von מְאֹד drückt eine sehr starke Steigerung aus; „überaus groß“ vermittelt sie in würdigem, natürlichem Deutsch.
- source_word: דָּמִים
  choice: Blutvergießen
  rationale: Der Plural bezeichnet hier gewaltsames Blutvergießen beziehungsweise Blutschuld, nicht bloß Blut als Stoff. „Blutvergießen“ passt zur Anklage gegen das ganze Land.
- source_word: מֻטֶּה
  choice: Rechtsverdrehung
  rationale: Das seltene Nomen bezeichnet etwas Verdrehtes oder eine Verkehrung des Rechten. „Rechtsverdrehung“ erhält das Bild der Verzerrung und lässt offen, ob speziell richterliche Ungerechtigkeit oder allgemeiner gesellschaftliches Unrecht gemeint ist.
- source_word: עָזַב
  choice: hat ... verlassen
  rationale: Das Verb besagt, dass Jahwe nach ihrer Behauptung das Land aufgegeben oder verlassen habe. „Verlassen“ ist idiomatisch und bewahrt das theologische Gewicht, ohne eine zusätzliche Nuance einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben statt durch einen Titel ersetzt.
- source_word: רֹאֶה
  choice: sieht es nicht
  rationale: Das Partizip bezeichnet hier fortdauerndes Sehen beziehungsweise Wahrnehmen. Das ergänzte „es“ macht den deutschen Satz natürlich und bezieht sich auf die Vorgänge im Land.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung von דָּמִים und מֻטֶּה im Gerichtswort
  choice: Blutvergießen ... Rechtsverdrehung
  alternative: Blutschuld ... Ungerechtigkeit
  rationale: Die Formulierungen machen Gewalt und die Verkehrung des Rechten sichtbar, ohne מֻטֶּה vorschnell ausschließlich auf das Gerichtswesen einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze erhalten die Wucht der Anklage. „Haus Israel“ bewahrt die biblische korporative Ausdrucksweise; „Rechtsverdrehung“ ist bewusst bildhaft und wird durch die Fußnote erläutert.
