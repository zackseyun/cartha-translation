  text: וּ/כְב֣וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נַעֲלָה֙ מֵ/עַ֤ל הַ/כְּרוּב֙ אֲשֶׁ֣ר הָיָ֣ה עָלָ֔י/ו אֶ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּקְרָ֗א אֶל הָ/אִישׁ֙ הַ/לָּבֻ֣שׁ הַ/בַּדִּ֔ים אֲשֶׁ֛ר קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/003.yaml
  text: And the glory of the God of Israel went up from above the cherub on which it had been[a], to the threshold of the house. And he called to the man clothed in linen[c][b], who had the scribe’s writing case at his waist.
translation:
  language: de
  text: Da erhob sich die Herrlichkeit des Gottes Israels von dem Cherub, über dem sie gewesen war, zur Schwelle des Hauses[a]. Da rief die Herrlichkeit den Mann, der in Leinen gekleidet war und das Schreibzeug des Schreibers an seiner Hüfte trug[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das „Haus“ ist hier im Zusammenhang das Tempelgebäude; daher auch: „zur Schwelle des Tempels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb steht im maskulinen Singular. Es kann sich auf die „Herrlichkeit“ beziehen und zugleich göttliches Handeln ausdrücken; auch möglich: „Da rief er den Mann“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „den Schreibkasten des Schreibers“ beziehungsweise „den Tintenbehälter des Schreibers“. Gemeint ist ein Behälter für Schreibutensilien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְבוֹד
  choice: Herrlichkeit
  rationale: Die übliche und kontextgerechte Wiedergabe; in Hesekiels Tempelvision bezeichnet das Wort die sichtbare Erscheinung der Gegenwart Gottes, ohne es auf bloßen Glanz zu verengen.
- source_word: נַעֲלָה
  choice: erhob sich
  rationale: Gibt die räumliche Aufwärtsbewegung von עלה natürlich wieder; das anschließende „bewegte sich“ verdeutlicht im Deutschen das Ziel an der Schwelle, ohne eine zusätzliche Ortsveränderung zu behaupten.
- source_word: הַכְּרוּב
  choice: der Cherub
  rationale: Der hebräische Text verwendet ausdrücklich den Singular.
- source_word: אֲשֶׁר הָיָה עָלָיו
  choice: über dem sie gewesen war
  rationale: Bewahrt den Rückbezug auf die Herrlichkeit und die räumliche Beziehung zum Cherub, ohne deutend „geruht“ einzufügen.
- source_word: מִפְתַּן הַבָּיִת
  choice: die Schwelle des Hauses
  rationale: Folgt dem Wortlaut von בַּיִת; der Kontext macht deutlich, dass das Tempelhaus gemeint ist.
- source_word: וַיִּקְרָא
  choice: Dann rief er ... zu
  rationale: Der maskuline Singular wird mit persönlicher göttlicher Handlung wiedergegeben; „jemandem zurufen“ ist in diesem Zusammenhang natürliches Deutsch.
- source_word: הַלָּבֻשׁ הַבַּדִּים
  choice: der in Leinen gekleidet war
  rationale: Natürliche, würdevolle Wiedergabe der partizipialen Beschreibung, ohne die Art der Leinenkleidung näher festzulegen.
- source_word: קֶסֶת הַסֹּפֵר
  choice: das Schreibzeug des Schreibers
  rationale: Verständliche moderne Bezeichnung für den Behälter beziehungsweise die Ausrüstung zum Schreiben; die berufliche Zuordnung „des Schreibers“ bleibt erhalten.
- source_word: בְּמָתְנָיו
  choice: an seiner Hüfte
  rationale: Konkrete, moderne Wiedergabe der Befestigungsstelle; vermeidet das heute altertümliche „an seinen Lenden“.
theological_decisions:
- issue: Subjekt von וַיִּקְרָא nach „die Herrlichkeit des Gottes Israels“
  choice: „Dann rief er“ als Ausdruck persönlicher göttlicher Handlung
  alternative: „Dann rief sie“, mit „die Herrlichkeit“ als grammatischem Bezug
  rationale: Das hebräische Verb steht im maskulinen Singular, passend zum grammatisch maskulinen כָּבוֹד. Inhaltlich handelt Gott in seiner Herrlichkeit persönlich. Die Hauptfassung gibt diese personale Handlung wieder, während eine Fußnote die mögliche grammatische Rückbeziehung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Herrlichkeit“, „Cherub“ und „Schwelle“ bewahren die visionäre und kultische Sprache. Der Satzbau bleibt quellennah, wird aber für flüssiges Deutsch leicht gegliedert. Sämtliche Fußnotenmarker stehen im Haupttext.
