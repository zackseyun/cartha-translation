  terminology: »Männer«, »Leinengewänder«, »Schreibzeug eines Schreibers« und »Bronzealtar« sind terminologisch vertretbar. Die Fußnoten bewahren sachgerecht die Unsicherheit über die Art der Waffe und die traditionelle Wiedergabe von קסת הסופר. Keine theologische Identifizierung der Gestalten wird hinzugefügt.
