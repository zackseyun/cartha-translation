source:
  edition: WLC
  text: וְ/הִנֵּ֣ה שִׁשָּׁ֣ה אֲנָשִׁ֡ים בָּאִ֣ים מִ/דֶּרֶךְ שַׁ֨עַר הָ/עֶלְי֜וֹן אֲשֶׁ֣ר מָפְנֶ֣ה צָפ֗וֹנָ/ה וְ/אִ֨ישׁ כְּלִ֤י מַפָּצ/וֹ֙ בְּ/יָד֔/וֹ וְ/אִישׁ אֶחָ֤ד בְּ/תוֹכָ/ם֙ לָבֻ֣שׁ בַּדִּ֔ים וְ/קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָ֑י/ו וַ/יָּבֹ֨אוּ֙ וַ/יַּ֣עַמְד֔וּ אֵ֖צֶל מִזְבַּ֥ח הַ/נְּחֹֽשֶׁת׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/002.yaml
  text: And behold[a], six men were coming from the direction of the upper gate, which faces north, each with his weapon for smashing in his hand; and one man among them was clothed in linen, with a scribe’s writing case at his waist[b]. And they came and stood beside the bronze altar.
translation:
  language: de
  text: 'Und siehe: Sechs Männer kamen aus der Richtung des oberen Tores, das nach Norden weist, jeder mit seiner Waffe zum Zerschmettern[a] in der Hand. Unter ihnen war ein Mann, der Leinengewänder trug und an seiner Hüfte das Schreibzeug eines Schreibers[b] hatte. Sie kamen und stellten sich neben den Bronzealtar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Vernichtungswaffe«. Das hebräische Wort bezeichnet ein Gerät zum Zerbrechen oder Zerschmettern; die genaue Art der Waffe ist ungewiss.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »das Tintenfass eines Schreibers«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh doch
  rationale: Bewahrt die lebendige, aufmerksamkeitslenkende Kraft der hebräischen Visionseinleitung in verständlichem, gehobenem Gegenwartsdeutsch.
- source_word: שִׁשָּׁה אֲנָשִׁים
  choice: sechs Männer
  rationale: Gibt die ausdrücklich maskuline Bezeichnung wieder und beschreibt die Gestalten so, wie sie in der Vision erscheinen, ohne ihre Natur näher festzulegen.
- source_word: בָּאִים
  choice: kamen
  rationale: Der deutsche Erzählzusammenhang gibt die im hebräischen Partizip anschaulich dargestellte Annäherung natürlich mit dem Präteritum wieder.
- source_word: מִדֶּרֶךְ שַׁעַר הָעֶלְיוֹן
  choice: aus der Richtung des oberen Tores
  rationale: Gibt sowohl die räumliche Herkunftsrichtung als auch die architektonische Bezeichnung klar wieder.
- source_word: אֲשֶׁר מָפְנֶה צָפוֹנָה
  choice: das nach Norden weist
  rationale: Eine natürliche Wiedergabe der Ausrichtung des Tores.
- source_word: וְאִישׁ כְּלִי מַפָּצוֹ בְּיָדוֹ
  choice: Jeder hatte seine Zerschmetterungswaffe in der Hand
  rationale: מַפָּץ bezeichnet ein Werkzeug oder eine Waffe zum Zerbrechen beziehungsweise Zerschmettern. Die Wiedergabe erhält diesen Sinn, ohne eine bestimmte Waffenart zu behaupten.
- source_word: וְאִישׁ אֶחָד בְּתוֹכָם
  choice: Unter ihnen war ein Mann
  rationale: Natürliches Deutsch für die räumliche Einordnung der einzelnen Gestalt innerhalb der Gruppe.
- source_word: לָבֻשׁ בַּדִּים
  choice: der Leinengewänder trug
  rationale: Der Plural בַּדִּים bezeichnet hier Kleidung aus Leinen; »Leinengewänder« bewahrt die kultisch geprägte, aber nicht ausdrücklich erklärte Bildsprache.
- source_word: קֶסֶת הַסֹּפֵר
  choice: das Schreibzeug eines Schreibers
  rationale: Bezeichnet eine zum Schreiben dienende Ausstattung beziehungsweise einen Behälter, ohne mit dem traditionellen »Tintenfass« die genaue Form zu eng festzulegen.
- source_word: בְּמָתְנָיו
  choice: an seiner Hüfte
  rationale: Gibt den Körperbereich idiomatisch wieder und vermeidet das heute altertümliche »an seinen Lenden«.
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: Sie kamen herein und stellten sich
  rationale: Gibt die fortschreitende Folge der beiden hebräischen Erzählformen klar und flüssig wieder.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: Bronzealtar
  rationale: נְחֹשֶׁת bezeichnet hier das Metall des Altars; »Bronzealtar« ist die geläufige und sachlich passende deutsche Benennung.
theological_decisions:
- issue: Identität und Wesen der sechs Männer und des in Leinen gekleideten Mannes
  choice: Die Gestalten werden entsprechend der visionären Wahrnehmung als »Männer« bezeichnet.
  alternative: Sie ausdrücklich als Engel, Gerichtsengel oder himmlische Wesen bezeichnen.
  rationale: Der hebräische Text nennt sie Männer. Auch wenn der Zusammenhang auf übermenschliche Gerichtsboten weist, soll die Übersetzung diese Deutung nicht in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulichem prophetischem Ton. Kurze Sätze entlasten die lange hebräische Satzfolge. Die seltene Bildung »Zerschmetterungswaffe« ist bewusst präzise und wird durch eine Fußnote erläutert; dogmatische Identifizierungen der visionären Gestalten werden vermieden.
