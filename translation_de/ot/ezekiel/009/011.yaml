source:
  edition: WLC
  text: וְ/הִנֵּ֞ה הָ/אִ֣ישׁ לְבֻ֣שׁ הַ/בַּדִּ֗ים אֲשֶׁ֤ר הַ/קֶּ֨סֶת֙ בְּ/מָתְנָ֔י/ו מֵשִׁ֥יב דָּבָ֖ר לֵ/אמֹ֑ר עָשִׂ֕יתִי כ/אשר צִוִּיתָֽ/נִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/011.yaml
  text: And behold[a], the man clothed in linen, who had the writing case at his waist, brought back word, saying, “I have done as you commanded me.”
translation:
  language: de
  text: 'Und sieh: Der Mann, der mit Leinen bekleidet war und das Schreibzeug an seiner Hüfte trug, erstattete Bericht: „Ich habe getan, wie du mir befohlen hast.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die aufmerksamkeitslenkende, vergegenwärtigende Funktion des hebräischen Erzählmarkers in einer verständlichen, würdigen Form.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Gibt das ausdrücklich maskuline Singularwort wieder und verweist auf die bereits eingeführte Gestalt.
- source_word: לְבֻשׁ הַבַּדִּים
  choice: der mit Leinen bekleidet war
  rationale: Gibt die Kleidung beschreibend wieder, ohne aus ihrem möglichen priesterlichen Anklang eine Identifizierung abzuleiten.
- source_word: הַקֶּסֶת
  choice: das Schreibzeug
  rationale: Bezeichnet in modernem Deutsch verständlich die mitgeführte Ausstattung beziehungsweise das Behältnis zum Schreiben; die traditionelle, aber engere Wiedergabe „Tintenfass“ wird nicht bevorzugt.
- source_word: בְּמָתְנָיו
  choice: an seiner Hüfte
  rationale: Gibt den Ort natürlich wieder; „an seinen Lenden“ wäre wörtlicher-traditionell, klingt heute jedoch unnötig altertümlich.
- source_word: מֵשִׁיב דָּבָר
  choice: erstattete Bericht
  rationale: Die hebräische Wendung bezeichnet hier das Zurückbringen einer Antwort beziehungsweise Meldung. Die deutsche Form ist idiomatisch und wahrt den offiziellen Charakter der Rückmeldung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die direkte Rede im Deutschen natürlicher ein als ein zusätzliches „und sagte“ oder „indem er sagte“.
- source_word: עָשִׂיתִי
  choice: Ich habe getan
  rationale: Das Perfekt bezeichnet die abgeschlossene Ausführung des Auftrags mit gegenwärtiger Relevanz für den Bericht.
- source_word: כַּאֲשֶׁר צִוִּיתָנִי
  choice: wie du mir befohlen hast
  rationale: Gibt die Aussage der vollständigen Übereinstimmung mit dem erteilten Befehl knapp und unmittelbar wieder.
theological_decisions:
- issue: Wesen der mit Leinen bekleideten Gestalt
  choice: Nur beschreibend als „der Mann, der mit Leinen bekleidet war“ wiedergeben.
  alternative: Die Gestalt ausdrücklich als Engel, priesterliche Gestalt oder Gotteserscheinung identifizieren.
  rationale: Der hebräische Text beschreibt Erscheinung und Aufgabe, bestimmt aber das Wesen der Gestalt nicht ausdrücklich. Eine nähere Identifizierung würde eine Auslegung in den Text eintragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Erzählton. „Und sieh“ erhält die Anschaulichkeit von וְהִנֵּה; „Schreibzeug“ und „an seiner Hüfte“ vermeiden unnötig altertümliche Ausdrucksweisen.
