  naturalness: »Mein Auge wird kein Mitleid haben« ist verständlich, aber weniger direkt als die hebräische Formel. Eine knappe, würdige Satzfügung mit »Mein Auge wird nicht schonen« erhält das Bild und ist im prophetischen Register natürlich genug. Die revidierte Fassung ist flüssig und modern, ohne die Metaphern zu erklären.
  terminology: »sich erbarmen« gibt חמל passend wieder. »Weg« soll als im Hebräischen singularisches Bild für Verhalten beibehalten und in der Fußnote erklärt werden. Die Fußnote zur Kopf-Metapher sollte nicht stärker als der Haupttext »eigenen« bzw. »zurück« vorwegnehmen.
