  text: וְ/גַ֨ם אֲנִ֔י לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל דַּרְכָּ֖/ם בְּ/רֹאשָׁ֥/ם נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/010.yaml
  text: And as for me[a], my eye will not spare, nor will I show pity[b]; I have brought their way upon their heads.
translation:
  language: de
  text: 'Auch ich werde nicht schonen: Mein Auge wird nicht schonen, und ich werde mich nicht erbarmen. Ihren Weg[a] habe ich auf ihren Kopf gelegt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ihren Weg“; das hebräische Wort bezeichnet hier den Lebenswandel oder das Verhalten.
    reason: lexical_alternative
  - marker: b
    text: Etwas auf jemandes Kopf zu legen, ist ein hebräisches Bild dafür, dass die Vergeltung für das Tun einen selbst trifft.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Und auch ich
  rationale: Die selbstständige Form אֲנִי ist betont; zusammen mit וְגַם setzt „Und auch ich“ Gottes Reaktion nachdrücklich zur vorausgehenden Aussage in Beziehung.
- source_word: לֹא תָחוֹס עֵינִי
  choice: Mein Auge wird kein Mitleid haben
  rationale: Die konkrete hebräische Rede vom Auge bleibt erhalten, während die idiomatische Bedeutung – kein Erbarmen zu empfinden und daher nicht zu verschonen – in verständlichem Deutsch ausgedrückt wird.
- source_word: וְלֹא אֶחְמֹל
  choice: und ich werde mich nicht erbarmen
  rationale: „Sich erbarmen“ gibt חמל würdig und präzise wieder und bewahrt die parallele Verstärkung der verweigerten Schonung.
- source_word: דַּרְכָּם
  choice: ihren Weg
  rationale: Der Singular entspricht dem Hebräischen. „Weg“ kann wie im Ausgangstext den Lebenswandel beziehungsweise das Verhalten bezeichnen; diese idiomatische Bedeutung wird in einer Fußnote erläutert.
- source_word: בְּרֹאשָׁם
  choice: auf ihren eigenen Kopf
  rationale: Die Vergeltungsmetapher wird bewahrt. „Eigenen“ verdeutlicht in natürlichem Deutsch, dass die Folgen die Schuldigen selbst treffen, ohne die Bildsprache durch eine abstrakte Erklärung zu ersetzen.
- source_word: נָתָתִּי
  choice: lasse ich ... zurückfallen
  rationale: Das wörtliche „habe ich gegeben/gelegt“ bildet mit „auf ihren Kopf“ eine hebräische Vergeltungsformel. „Zurückfallen lassen“ gibt deren Sinn im Deutschen idiomatisch wieder; im Gerichtskontext kann die hebräische Perfektform die fest beschlossene, unmittelbar vollzogene Vergeltung ausdrücken.
theological_decisions:
- issue: Göttliches Gericht und verweigertes Erbarmen
  choice: Die Aussage bleibt eine ungemilderte Ankündigung, dass Gott nicht schont und den Lebenswandel der Schuldigen auf sie selbst zurückfallen lässt.
  alternative: Eine stärker erklärende Fassung könnte von den „Folgen ihres Verhaltens“ sprechen.
  rationale: Der hebräische Text hält die Härte des Gerichts und die konkrete Vergeltungsmetapher zusammen. Die Übersetzung schwächt dies nicht ab und fügt zugleich keine systematisch-theologische Deutung hinzu.
- issue: Zeitwert von נָתָתִּי
  choice: Deutsches Präsens „lasse ich ... zurückfallen“ als Ausdruck des feststehenden beziehungsweise einsetzenden Gerichtsvollzugs.
  alternative: 'Wörtlicher: „habe ich auf ihren Kopf gelegt“; zukunftsbezogen: „werde ich auf ihren Kopf zurückfallen lassen“.'
  rationale: Die hebräische Perfektform steht innerhalb einer Ankündigung mit Imperfektformen und kann die Gewissheit des Gerichtshandelns hervorheben. Das Präsens bewahrt diese Spannung besser als eine rein vergangene oder rein zukünftige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Rede vom nicht mitleidenden Auge sowie die Vergeltungsmetapher bleiben erhalten; Fußnoten erläutern die beiden hebräischen Bilder, ohne sie im Haupttext aufzulösen.
