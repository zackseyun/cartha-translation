  source_fidelity: 'Die Übersetzung gibt Ruf, Lautstärke, Pluralimperativ und die distributive Angabe zur Waffe zutreffend wieder. Bei פְּקֻדּוֹת הָעִיר ist „für die Stadt Beauftragten“ zwar vorsichtig, aber im Deutschen semantisch und syntaktisch weniger präzise: Das hebräische Konstrukt kann die über die Stadt Bestellten bzw. zur gerichtlichen Heimsuchung Bestellten meinen. Die schwierige Mehrdeutigkeit sollte im Text nicht zu „Vollstreckern“ verengt werden.'
  naturalness: „Dann rief er mir mit lauter Stimme in die Ohren“ ist verständlich, wirkt im heutigen Standarddeutsch jedoch etwas sperrig. „rief er mit lauter Stimme in meine Ohren“ bewahrt das konkrete hebräische Bild und ist als bewusst anschauliche Formulierung glatter. „die über die Stadt Bestellten“ ist idiomatischer als „für die Stadt Beauftragten“.
  terminology: „Vernichtungswaffe“ ist eine mögliche, klare kontextuelle Wiedergabe von כְּלִי מַשְׁחֵתוֹ. Die Benennung der Angeredeten als „über die Stadt Bestellte“ vermeidet sowohl die überdeutende Festlegung auf Scharfrichter als auch die zu schwache, ungerichtete Formulierung „für die Stadt Beauftragte“.
