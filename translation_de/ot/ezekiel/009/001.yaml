    rationale: Die Wortgruppe bezeichnet wahrscheinlich Personen, die über die Stadt bestellt sind bzw. mit ihrer Heimsuchung beauftragt sind. „über die Stadt Bestellten“ ist im Deutschen natürlicher und hält die genaue Funktion weiterhin offen.
  - severity: low
