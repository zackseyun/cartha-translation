source:
  edition: WLC
  text: וַ/יִּקְרָ֣א בְ/אָזְנַ֗/י ק֤וֹל גָּדוֹל֙ לֵ/אמֹ֔ר קָרְב֖וּ פְּקֻדּ֣וֹת הָ/עִ֑יר וְ/אִ֛ישׁ כְּלִ֥י מַשְׁחֵת֖/וֹ בְּ/יָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/001.yaml
  text: Then he cried out in my ears with a loud voice[a], saying, “Draw near, you executioners of the city[b], each with his weapon of destruction in his hand.”
translation:
  language: de
  text: 'Dann rief er mit lauter Stimme in meine Ohren: »Tretet heran, ihr über die Stadt Bestellten[a], jeder mit seiner Vernichtungswaffe in der Hand!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist schwierig. Es kann die über die Stadt Bestellten oder Aufseher bezeichnen, steht aber auch mit Heimsuchung bzw. Gericht in Verbindung. Im Zusammenhang sind offenbar zum Gericht über die Stadt Bestellte gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Dann rief er
  rationale: קרא bezeichnet hier angesichts der lauten Stimme einen kräftigen Ruf. Das unausgedrückte Subjekt wird entsprechend dem Zusammenhang mit „er“ wiedergegeben.
- source_word: בְאָזְנַי
  choice: mir … in die Ohren
  rationale: Die konkrete hebräische Wendung bleibt erhalten; die Dativkonstruktion ist im Deutschen natürlicher als „in meinen Ohren“.
- source_word: קוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Die geläufige deutsche Wendung gibt die Intensität und die substantivische Form des Hebräischen angemessen wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet die direkte Rede im modernen Deutschen natürlich ein und erfüllt die Funktion des hebräischen Redeformulars.
- source_word: קָרְבוּ
  choice: Tretet heran
  rationale: Der Pluralimperativ wird in einem würdigen, klaren Befehlston wiedergegeben.
- source_word: פְּקֻדּוֹת הָעִיר
  choice: ihr für die Stadt Beauftragten
  rationale: Die kontextuell als Personen angeredeten Größen werden als Beauftragte bezeichnet. So bleibt der Bedeutungsbereich von פקד – Beauftragung, Aufsicht oder gerichtliche Heimsuchung – offen, ohne sie vorschnell ausdrücklich zu „Scharfrichtern“ oder Engeln zu machen.
- source_word: וְאִישׁ
  choice: jeder
  rationale: Das singularische אִישׁ hat hier verteilende Bedeutung und wird idiomatisch mit „jeder“ wiedergegeben.
- source_word: כְּלִי מַשְׁחֵתוֹ
  choice: seiner Vernichtungswaffe
  rationale: כְּלִי kann Gerät, Werkzeug oder Waffe bedeuten; der Gerichtskontext und die zerstörerische Funktion sprechen hier für „Vernichtungswaffe“.
- source_word: בְּיָדוֹ
  choice: in der Hand
  rationale: Das konkrete Bild und der Singular der verteilenden Konstruktion bleiben gewahrt.
theological_decisions:
- issue: Deutung von פְּקֻדּוֹת הָעִיר im Gerichtskontext
  choice: ihr für die Stadt Beauftragten
  alternative: ihr Vollstrecker der Stadt / ihr Aufseher der Stadt / die Heimsuchungen der Stadt
  rationale: Der folgende Satzteil und Vers 2 zeigen handelnde Personen mit Waffen. „Beauftragte“ trägt diesem Kontext Rechnung, bewahrt aber die lexikalische Spannung zwischen Bestellung, Aufsicht und gerichtlicher Heimsuchung und legt weder ihre genaue Funktion noch ihre Wesensart über den Text hinaus fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche Wendung „mir … in die Ohren“ bewahrt die Bildkraft des Hebräischen; der schwierige Ausdruck פְּקֻדּוֹת הָעִיר wird bewusst nicht auf eine bestimmte übernatürliche Wesensart oder ausschließlich auf die Funktion von Scharfrichtern festgelegt.
