base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/008.yaml
  text: And it happened, while they were striking them down, and I alone was left, that I fell on my face and cried out, and I said, “Ah, Lord GOD, will you destroy all the remnant of Israel as you pour out your wrath on Jerusalem?”
translation:
  language: de
  text: 'Und während sie die Menschen erschlugen und ich allein übrig blieb, fiel ich auf mein Angesicht, schrie laut und sagte: »Ach, Herr, HERR! Willst du den ganzen Rest Israels vernichten, während du deinen Zorn über Jerusalem ausgießt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und während
  rationale: Die hebräische Geschehensformel wird zusammen mit der folgenden Zeitangabe natürlich ins Deutsche integriert, ohne ihren erzählerischen Anschluss zu verlieren.
- source_word: כְּהַכּוֹתָם
  choice: während sie die Menschen erschlugen
  rationale: כְּ mit Infinitiv bezeichnet hier die Gleichzeitigkeit; das Objekt ist aus dem Kontext zu ergänzen und wird mit »die Menschen« neutral wiedergegeben.
- source_word: וְנֵאשֲׁאַר אָנִי
  choice: und ich allein übrig blieb
  rationale: Die Voranstellung des Pronomens אָנִי hebt Ezechiel hervor und legt im Kontext den Sinn »ich allein« nahe.
- source_word: וָאֶזְעַק
  choice: schrie laut
  rationale: Das Verb bezeichnet einen dringlichen, lauten Hilferuf; »schrie laut« ist idiomatisch und wahrt die Intensität.
- source_word: שְׁאֵרִית
  choice: Rest
  rationale: »Rest« ist die etablierte und kontextgerechte Wiedergabe für die noch verbliebene Gruppe Israels.
- source_word: בְּשָׁפְכְּךָ
  choice: während du ... ausgießt
  rationale: Die Präposition בְּ am Infinitiv kann Gleichzeitigkeit bzw. begleitenden Umstand ausdrücken; »während« bewahrt diese offene zeitlich-umständliche Beziehung.
- source_word: חֲמָתְךָ
  choice: deinen Zorn
  rationale: חֵמָה bezeichnet hier Gottes heftigen Zorn; die feste Verbindung mit »ausgießen« bleibt erhalten.
theological_decisions:
- issue: Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: Herr, HERR
  alternative: Herr, Jahwe
  rationale: Die Unterscheidung beider hebräischen Titel wird durch unterschiedliche Schreibung sichtbar gemacht, ohne eine rekonstruierte Aussprache in den Haupttext einzuführen.
- issue: Umfang der drohenden Vernichtung
  choice: den ganzen Rest Israels vernichten
  alternative: alles vernichten, was von Israel übrig ist
  rationale: Die Formulierung bewahrt Ezechiels erschrockene Frage nach einer umfassenden Vernichtung des verbliebenen Israel, ohne vorwegzunehmen, wie Gott antwortet.
- issue: Verhältnis von Zornausgießung und Vernichtung
  choice: während du deinen Zorn ... ausgießt
  alternative: indem du deinen Zorn ... ausgießt
  rationale: »Während« wahrt die mögliche Gleichzeitigkeit und vermeidet, die hebräische Konstruktion eindeutig kausal oder instrumental festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit erzählerisch flüssigem Satzbau. Die emotionale Dringlichkeit von Ezechiels Reaktion und die feierliche doppelte Gottesanrede bleiben erhalten.
