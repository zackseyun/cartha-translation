base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/006.yaml
  text: Old man[a], young man, and virgin, and little children, and women—you shall kill them utterly. But do not come near anyone on whom is the mark, and begin at my sanctuary[b]. So they began with the old men who were before the house.
translation:
  language: de
  text: Einen alten Mann, einen jungen Mann und eine Jungfrau, kleine Kinder und Frauen sollt ihr restlos töten. Doch nähert euch niemandem, der das Zeichen[a] trägt. Fangt bei meinem Heiligtum an! Da fingen sie bei den alten Männern[b] an, die vor dem Haus waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Taw“, der Name des hebräischen Buchstabens; gemeint ist das Schutzzeichen, das in Vers 4 angebracht wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei den Ältesten“. Mit dem „Haus“ ist der Tempel gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָקֵן בָּחוּר וּבְתוּלָה
  choice: einen alten Mann, einen jungen Mann und eine Jungfrau
  rationale: Die drei hebräischen Substantive stehen im Singular und bezeichnen jeweils repräsentativ eine Personengruppe. Die deutsche Akkusativkonstruktion bewahrt diesen auffälligen Wechsel von Singular zu Plural.
- source_word: טַף וְנָשִׁים
  choice: kleine Kinder und Frauen
  rationale: טַף bezeichnet kleine Kinder beziehungsweise die Kleinen; נָשִׁים meint in dieser Aufzählung allgemein Frauen.
- source_word: תַּהַרְגוּ לְמַשְׁחִית
  choice: sollt ihr restlos töten
  rationale: תַּהַרְגוּ bezeichnet ausdrücklich das Töten; לְמַשְׁחִית verstärkt den Befehl in Richtung vollständiger Vernichtung. „Restlos“ gibt diese Intensivierung in knappem, verständlichem Deutsch wieder.
- source_word: הַתָּו
  choice: das Zeichen
  rationale: Im Zusammenhang ist das in Vers 4 angebrachte Schutzzeichen gemeint. Die Beziehung zum Buchstabennamen Taw wird in der Fußnote erhalten.
- source_word: אַל תִּגַּשׁוּ
  choice: nähert euch niemandem
  rationale: Das Verb bezeichnet das Herantreten oder Sichnähern. Eine Wiedergabe mit „berühren“ wäre enger als der hebräische Ausdruck.
- source_word: וּמִמִּקְדָּשִׁי תָּחֵלּוּ
  choice: Fangt bei meinem Heiligtum an
  rationale: Der Satz bestimmt das Heiligtum als Ausgangspunkt des Gerichts. „Bei“ ist dafür im modernen Deutschen natürlich.
- source_word: וַיָּחֵלּוּ
  choice: Da fingen sie … an
  rationale: Die Erzählform führt die unmittelbare Ausführung des vorausgehenden Befehls fort.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: Wörtlich steht „das Haus“; im Kontext ist damit der Tempel gemeint. Die knappe Bezeichnung wird im Haupttext bewahrt.
theological_decisions:
- issue: Funktionales Zeichen oder wörtlicher Buchstabenname bei הַתָּו
  choice: das Zeichen
  alternative: das Taw-Zeichen
  rationale: Die erzählerische Funktion als Schutzzeichen ist im Kontext vorrangig. Die mögliche wörtlichere Benennung wird in einer Fußnote offengelegt.
- issue: Altersbezeichnung oder Amtsbezeichnung bei הַזְּקֵנִים
  choice: die alten Männer
  alternative: die Ältesten
  rationale: Die Wiederaufnahme von זָקֵן aus der demografischen Aufzählung am Versanfang spricht für die Altersbezeichnung. Wegen des Tempelkontexts bleibt die Amtsbezeichnung jedoch plausibel und wird als Alternative vermerkt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Härte des Gerichtsbefehls wird nicht abgeschwächt. Der auffällige Numeruswechsel von drei distributiven Singularformen zu den pluralischen Gruppen „kleine Kinder“ und „Frauen“ bleibt erhalten.
