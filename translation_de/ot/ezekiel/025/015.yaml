  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן עֲשׂ֥וֹת פְּלִשְׁתִּ֖ים בִּ/נְקָמָ֑ה וַ/יִּנָּקְמ֤וּ נָקָם֙ בִּ/שְׁאָ֣ט בְּ/נֶ֔פֶשׁ לְ/מַשְׁחִ֖ית אֵיבַ֥ת עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/015.yaml
  text: 'Thus says the Lord GOD: Because the Philistines acted in vengeance and took revenge with contempt in the soul[a], to destroy with everlasting enmity[b],'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Weil die Philister aus Rache handelten und sich mit Verachtung aus tiefster Seele rächten, um aus uralter Feindschaft Verderben anzurichten[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dauernder Feindschaft“ oder „aus ewiger Feindschaft“. Das hebräische Wort kann sowohl etwas seit alters Bestehendes als auch etwas unbegrenzt Fortdauerndes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen geläufige Wiedergabe der festen Gottesbezeichnung vermeidet die unnatürliche Doppelung „Herr HERR“ und kennzeichnet JHWH durch Kapitälchenkonvention.
- source_word: יַעַן
  choice: Weil
  rationale: Leitet unmittelbar den Grund für das nachfolgende Gerichtswort ein.
- source_word: עֲשׂוֹת פְּלִשְׁתִּים בִּנְקָמָה
  choice: die Philister aus Rachsucht handelten
  rationale: Gibt das Handeln „in Rache“ natürlich wieder und bringt zugleich die innere Vergeltungshaltung zum Ausdruck.
- source_word: וַיִּנָּקְמוּ נָקָם
  choice: und sich … rächten
  rationale: Die figura etymologica verstärkt den Vergeltungsakt; das deutsche Verb mit Reflexivpronomen gibt den Sinn idiomatisch wieder.
- source_word: בִּשְׁאָט בְּנֶפֶשׁ
  choice: voller Verachtung
  rationale: Die Verbindung bezeichnet verächtliche Feindseligkeit als innere, die ganze Person prägende Haltung; eine wörtliche Wiedergabe mit „Seele“ wäre im heutigen Deutsch missverständlich und schwerfällig.
- source_word: לְמַשְׁחִית
  choice: um … Verderben anzurichten
  rationale: Bewahrt den finalen Sinn der Infinitivkonstruktion und lässt offen, worauf sich die Zerstörung konkret richtet.
- source_word: אֵיבַת עוֹלָם
  choice: in ihrer uralten Feindschaft
  rationale: עוֹלָם kann hier lang zurückreichende oder fortdauernde Feindschaft bezeichnen. Im Rückblick auf die historische Feindschaft der Philister passt „uralt“, ohne die Dauersemantik als eindeutig festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr JHWH / Herr Jahwe
  rationale: Die traditionelle deutsche Bibelkonvention wahrt die Unterscheidung zwischen אֲדֹנָי und dem Gottesnamen, ohne eine unsichere Aussprache des Tetragramms zum Haupttext zu machen.
- issue: Zeitlicher Sinn von אֵיבַת עוֹלָם
  choice: uralte Feindschaft
  alternative: ewige Feindschaft / dauernde Feindschaft
  rationale: Der Ausdruck kann sowohl auf eine von alters her bestehende als auch auf eine fortdauernde Feindschaft zielen. Die Alternative wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als mit „Weil“ eingeleiteter Begründungssatz offen, da der göttliche Urteilsspruch im folgenden Vers fortgesetzt wird. Die innere Haltung aus בְּנֶפֶשׁ wird idiomatisch durch „voller“ erfasst.
