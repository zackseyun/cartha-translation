  naturalness: Die Verbindung »›Ha!‹ über mein Heiligtum gesagt hast« ist im heutigen Standarddeutsch zwar verständlich, aber unidiomatisch. Mit »über ... ›Aha!‹ gerufen hast« wird die hämische Interjektion natürlich mit ihren Gegenständen verbunden, ohne den Sinn zu verändern. »Aha!« ist im Deutschen zudem die deutlichere Interjektion für höhnische Genugtuung.
  terminology: »Ammoniter«, »Heiligtum«, »Land Israel«, »Haus Juda«, »entweiht«, »verwüstet« und »Verbannung« sind treffend. »der Herr Yahweh« bewahrt Titel und Gottesnamen und ist innerhalb der vorgegebenen Namenspraxis konsistent.
