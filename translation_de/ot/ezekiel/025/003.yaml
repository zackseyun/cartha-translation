source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לִ/בְנֵ֣י עַמּ֔וֹן שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה יַעַן֩ אָמְרֵ֨/ךְ הֶאָ֜ח אֶל מִקְדָּשִׁ֣/י כִֽי נִחָ֗ל וְ/אֶל אַדְמַ֤ת יִשְׂרָאֵל֙ כִּ֣י נָשַׁ֔מָּה וְ/אֶל בֵּ֣ית יְהוּדָ֔ה כִּ֥י הָלְכ֖וּ בַּ/גּוֹלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/003.yaml
  text: 'And say to the sons of Ammon[a], ‘Hear the word of the Lord GOD. Thus says the Lord GOD: Because you said, “Aha!” against my sanctuary when it was profaned, and against the land of Israel when it was made desolate[c][b], and against the house of Judah when they went into exile,’'
translation:
  language: de
  text: 'Und sag zu den Ammonitern: ›Hört das Wort des Herrn Yahweh! So spricht der Herr Yahweh: Weil du über mein Heiligtum »Aha!«[a] gerufen hast, als es entweiht wurde, über das Land Israel, als es verwüstet wurde, und über das Haus Juda, als sie in die Verbannung gingen, …‹'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Ausruf »Aha!« drückt hier hämische Freude oder schadenfrohen Triumph aus; auch: »Ha!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die wörtliche Wendung »Söhne Ammons« bezeichnet hier das Volk; »Ammoniter« ist im modernen Deutschen die natürliche und eindeutige Entsprechung.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: das Wort des Herrn Yahweh
  rationale: אֲדֹנָי wird als Titel »Herr« und der Gottesname יהוה als »Yahweh« wiedergegeben; so bleiben Titel und Eigenname unterscheidbar.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahweh
  rationale: Bewahrt die feste prophetische Botenformel in würdigem, geläufigem Deutsch.
- source_word: יַעַן אָמְרֵךְ
  choice: Weil du … gesagt hast
  rationale: Die Konstruktion nennt den Grund des folgenden Gerichts; die finite deutsche Form gibt sie natürlich wieder.
- source_word: הֶאָח
  choice: Ha!
  rationale: Die Interjektion drückt hier hämische Freude bzw. schadenfrohen Triumph aus.
- source_word: אֶל
  choice: über
  rationale: Die Präposition bezeichnet die Gegenstände, über deren Unglück Ammon schadenfroh jubelte. »Über« passt im Deutschen natürlich zu diesem Jubel, ohne die Aussage unnötig als direkte Rede gegen sie umzudeuten.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: »Heiligtum« bewahrt den kultischen Sinn, ohne den Ausdruck enger als nötig auf das Tempelgebäude zu beschränken.
- source_word: נִחָל
  choice: es entweiht wurde
  rationale: Der Niphal von חלל bezeichnet hier die Profanierung bzw. Entheiligung des Heiligtums; »entweiht« ist im Deutschen präzise und geläufig.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: das Land Israel
  rationale: Im territorialen Zusammenhang ist »Land Israel« die natürliche Wiedergabe von אַדְמָה.
- source_word: נָשַׁמָּה
  choice: es verwüstet wurde
  rationale: Gibt den Zustand infolge der Verheerung klar wieder und wahrt die passive Form.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Bewahrt die biblische Kollektivbezeichnung für Volk bzw. Königreich Juda.
- source_word: הָלְכוּ בַגּוֹלָה
  choice: sie in die Verbannung gingen
  rationale: Gibt Bewegung und Exilszustand direkt wieder; der Plural bezieht sich kollektiv auf die Angehörigen des Hauses Juda.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr, HERR; der souveräne HERR
  rationale: Die Wiedergabe unterscheidet den Herrentitel אֲדֹנָי vom Eigennamen יהוה und vermeidet die schwer verständliche Doppelung »Herr HERR«.
- issue: Bezug der schadenfrohen Interjektion
  choice: »Ha!« über Heiligtum, Land und Haus Juda
  alternative: »Aha!« gegen Heiligtum, Land und Haus Juda
  rationale: Der hebräische Text lässt die feindselige Haltung klar erkennen; »über« verbindet die Schadenfreude im Deutschen idiomatisch mit allen drei betroffenen Größen, ohne zusätzliche direkte Feindhandlung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Sprachform. Der Singular »du« redet das kollektiv verstandene Ammon an, während »Hört« die angesprochenen Ammoniter im Plural bezeichnet. Der abschließende Gedankenstrich zeigt, dass der mit »Weil« begonnene Urteilssatz im folgenden Vers fortgeführt wird.
