source:
  edition: WLC
  text: וּ/בְ/מוֹאָ֖ב אֶעֱשֶׂ֣ה שְׁפָטִ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/011.yaml
  text: And in Moab I will execute judgments[a], and they will know that I am Yahweh.
translation:
  language: de
  text: Und in Moab werde ich Strafgerichte vollstrecken, und sie werden erkennen, dass ich Jahwe bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Gottesname wird traditionell auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְמוֹאָב
  choice: Und in Moab
  rationale: Die Präposition ב bezeichnet hier den Bereich, in dem Gottes richterliches Handeln erfolgt. „In Moab“ gibt den hebräischen Ausdruck unmittelbar wieder; „gegen Moab“ wäre stärker auslegend.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: werde ich Strafgerichte vollstrecken
  rationale: Das Verb עשה bedeutet grundsätzlich „tun, machen“, bildet mit שְׁפָטִים jedoch eine Wendung für die Ausführung richterlicher Maßnahmen. „Strafgerichte vollstrecken“ bewahrt den Plural und verdeutlicht im Deutschen den gerichtlichen und strafenden Zusammenhang.
- source_word: וְיָדְעוּ
  choice: und sie werden erkennen
  rationale: Die Verbform hat im Zusammenhang zukünftigen beziehungsweise resultativen Sinn. „Erkennen“ entspricht der in Ezechiel wiederkehrenden Erkenntnisformel und meint mehr als bloßes Faktenwissen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was sie erkennen werden.
- source_word: אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Der ausdrückliche Gottesname יהוה wird als „Jahwe“ wiedergegeben. Die deutsche Wortstellung bildet die natürliche Form der wiederkehrenden Erkenntnisformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ macht diesen Eigennamen im Haupttext sichtbar; die traditionelle Wiedergabe „der HERR“ wird in einer Fußnote genannt, ohne die Identität des Namens stillschweigend durch einen Titel zu ersetzen.
- issue: Charakter der שְׁפָטִים
  choice: Strafgerichte
  alternative: Gerichte
  rationale: Im Kontext der Gerichtsworte gegen Moab sind konkrete strafende Gerichtsakte gemeint. „Strafgerichte“ gibt diese kontextuelle Bedeutung wieder und bewahrt zugleich den Plural.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „Strafgerichte vollstrecken“ die hebräische Rechtswendung idiomatisch und verständlich wiedergibt.
