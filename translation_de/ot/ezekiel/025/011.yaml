  source_fidelity: Der Entwurf gibt וּבְמוֹאָב zutreffend mit „Und in Moab“ wieder, bewahrt die zukünftige göttliche Handlung und gibt אֶעֱשֶׂה שְׁפָטִים idiomatisch als „werde ich Strafgerichte vollstrecken“ wieder. Die resultative Zukunft von וְיָדְעוּ sowie die Erkenntnisformel כִּי אֲנִי יְהוָה sind vollständig und ohne Zusatz wiedergegeben.
  naturalness: „Und in Moab werde ich Strafgerichte vollstrecken, und sie werden erkennen, dass ich Jahwe bin“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung von „und“ entspricht der knappen parataktischen Struktur des Hebräischen und ist hier nicht störend.
  terminology: „Jahwe“ gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen angemessen wieder. „Strafgerichte“ ist im Kontext der Gerichtsankündigung gegen Moab eine sachgerechte, pluralische Wiedergabe von שְׁפָטִים. Die Fußnote nennt mit „der HERR“ transparent die verbreitete traditionelle deutsche Wiedergabe.
