source:
  edition: WLC
  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ אֶל בְּנֵ֣י עַמּ֑וֹן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/002.yaml
  text: Son of man[a], set your face toward the sons of Ammon, and prophesy against them.
translation:
  language: de
  text: Menschensohn, richte dein Angesicht auf die Söhne Ammons[a] und weissage gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ammoniter“. Hebräisch wörtlich: „die Söhne Ammons“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels charakteristische göttliche Anrede und die hebräische Bildsprache, ohne sie zum abstrakteren „Sterblicher“ aufzulösen.
- source_word: שִׂים פָּנֶיךָ
  choice: richte dein Angesicht
  rationale: Gibt die prophetische Wendung mit ihrem konkreten Bild würdig und im Deutschen verständlich wieder.
- source_word: אֶל
  choice: auf
  rationale: Passt idiomatisch zu „das Angesicht richten“ und lässt die ausdrücklich feindliche Ausrichtung erst im folgenden „gegen sie“ hervortreten.
- source_word: בְּנֵי עַמּוֹן
  choice: die Söhne Ammons
  rationale: Bewahrt die wörtliche Verwandtschaftsbezeichnung des Hebräischen; die geläufigere Volksbezeichnung wird in der Fußnote genannt.
- source_word: וְהִנָּבֵא
  choice: und weissage
  rationale: Der Imperativ des üblichen Verbs für prophetisches Reden wird direkt und natürlich wiedergegeben.
- source_word: עֲלֵיהֶם
  choice: gegen sie
  rationale: Im Zusammenhang des Gerichtswortes hat die Präposition adversative Bedeutung.
theological_decisions:
- issue: Wiedergabe der Volksbezeichnung בְּנֵי עַמּוֹן
  choice: die Söhne Ammons
  alternative: die Ammoniter
  rationale: Die Hauptfassung erhält die hebräische Ausdrucksform, während die Fußnote die im modernen Deutschen üblichere ethnische Bezeichnung bietet, ohne einen theologischen Zusatz einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. „Angesicht“ ist bewusst gehobener als „Gesicht“, bleibt aber in diesem formelhaften Kontext verständlich.
