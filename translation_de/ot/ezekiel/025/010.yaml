base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/010.yaml
  text: to the people of the east[a], against the Ammonites; and I will give it as a possession[b], so that the Ammonites may no longer be remembered among the nations.
translation:
  language: de
  text: den Völkern des Ostens[a], gegen die Ammoniter; und ich werde es ihnen zum Besitz[b] geben, damit die Ammoniter unter den Nationen nicht mehr in Erinnerung bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen des Ostens“. Gemeint sind östlich lebende Völker oder Stämme. Die Präposition kann im Zusammenhang auch inklusiv verstanden werden: „zusammen mit den Ammonitern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Erbbesitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֶדֶם
  choice: den Völkern des Ostens
  rationale: Die idiomatische ethnogeografische Bezeichnung meint östlich lebende Volksgruppen oder Stämme. „Völker des Ostens“ ist im Deutschen natürlich und vermeidet das missverständliche wörtliche „Söhne des Ostens“.
- source_word: עַל בְּנֵי עַמּוֹן
  choice: zusammen mit den Ammonitern
  rationale: עַל kann hier die Einbeziehung beziehungsweise Zuordnung Ammons ausdrücken. Im Zusammenhang werden Moab und Ammon den Völkern des Ostens überlassen. Die mögliche feindliche Nuance wird in der Fußnote kenntlich gemacht.
- source_word: וּנְתַתִּיהָ
  choice: Ich werde es ihnen geben
  rationale: Das feminine Suffix verweist im Zusammenhang auf das zuvor genannte Gebiet beziehungsweise Land. Das ergänzte „ihnen“ macht im Deutschen den vorangestellten Empfänger deutlich.
- source_word: לְמוֹרָשָׁה
  choice: zum Besitz
  rationale: מוֹרָשָׁה bezeichnet dauerhaften Besitz beziehungsweise Erbbesitz. „Zum Besitz“ passt zur Übergabe eines Gebietes, ohne die familiäre Konnotation von „Erbe“ aufzudrängen.
- source_word: לְמַעַן לֹא תִזָּכֵר
  choice: damit man sich ... nicht mehr ... erinnert
  rationale: Die deutsche unpersönliche Aktivkonstruktion gibt den passiven Sinn des Niphal von זכר natürlich wieder. „Nicht mehr“ verdeutlicht im Kontext das Ende der nationalen Erinnerung, ohne darüber hinauszugehen.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen allgemein; „Nationen“ bewahrt den politischen und kollektiven Bezug.
theological_decisions:
- issue: Tragweite des Gerichts über Ammon
  choice: Das Gericht wird als Ende der Erinnerung an Ammon unter den Nationen wiedergegeben.
  alternative: Vollständige Vernichtung oder lediglich Verlust des Ansehens.
  rationale: Der hebräische Text spricht ausdrücklich vom Nicht-mehr-Erinnertwerden unter den Nationen. Die Übersetzung bewahrt diese Aussage, ohne eine metaphysische Auslöschung oder bloß einen Ansehensverlust hineinzulesen.
- issue: Verhältnis der Völker des Ostens zu den Ammonitern
  choice: Ammon wird zusammen mit dem zuvor genannten Gebiet den Völkern des Ostens überlassen.
  alternative: Die Völker des Ostens handeln „gegen“ die Ammoniter.
  rationale: Syntax und Zusammenhang stützen die inklusive beziehungsweise zuordnende Lesart, während die Präposition עַל auch eine gegen Ammon gerichtete Nuance zulassen kann. Diese Mehrdeutigkeit wird nicht verschwiegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Da der Vers syntaktisch an den vorherigen Vers anschließt, beginnt die Übersetzung entsprechend mit einem Dativobjekt. „Ammoniter“ ist die geläufige ethnische Bezeichnung; die unpersönliche Wendung „man sich erinnert“ klingt natürlicher als ein schwerfälliges deutsches Passiv.
