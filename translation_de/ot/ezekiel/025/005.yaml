  text: וְ/נָתַתִּ֤י אֶת רַבָּה֙ לִ/נְוֵ֣ה גְמַלִּ֔ים וְ/אֶת בְּנֵ֥י עַמּ֖וֹן לְ/מִרְבַּץ צֹ֑אן וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/005.yaml
  text: And I will make Rabbah a pasture for camels[a], and the Ammonites a resting place for flocks[c][b]; then you will know that I am Yahweh.
translation:
  language: de
  text: Und ich werde Rabba zu einem Weideplatz für Kamele[a] machen und die Ammoniter[b] zu einem Ruheplatz für Herden[c]. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Aufenthaltsort für Kamele“ oder „zu einer Wohnstätte für Kamele“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „die Söhne Ammons“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu einem Lagerplatz für Kleinvieh“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ich werde … machen
  rationale: Das Verb bedeutet wörtlich „geben“, bezeichnet in dieser Ergebniskonstruktion aber idiomatisch das Machen beziehungsweise Verwandeln zu etwas.
- source_word: רַבָּה
  choice: Rabba
  rationale: Der Eigenname der ammonitischen Hauptstadt wird nach den üblichen deutschen Transliterationskonventionen wiedergegeben.
- source_word: לִנְוֵה
  choice: zu einem Weideplatz für
  rationale: נָוֶה kann Wohnstätte, Aufenthaltsort oder Weideplatz bedeuten. Im Zusammenhang mit Kamelen gibt „Weideplatz“ das pastorale Bild natürlich wieder, ohne die lexikalischen Alternativen auszuschließen.
- source_word: גְמַלִּים
  choice: Kamele
  rationale: Direkte und eindeutige Wiedergabe des hebräischen Plurals.
- source_word: בְּנֵי עַמּוֹן
  choice: das Gebiet der Ammoniter
  rationale: Wörtlich steht „die Söhne Ammons“. Da die parallele Aussage Rabba als Landfläche beschreibt und בְּנֵי עַמּוֹן hier metonymisch für das Land beziehungsweise Gebiet des Volkes stehen kann, macht die Übersetzung das im Deutschen erforderliche räumliche Verständnis deutlich.
- source_word: לְמִרְבַּץ
  choice: zu einem Ruheplatz
  rationale: Das Substantiv bezeichnet einen Ort, an dem Tiere sich lagern oder ausruhen. „Ruheplatz“ bewahrt dies, ohne eine ausdrücklich umfriedete Hürde vorauszusetzen.
- source_word: צֹאן
  choice: Herden
  rationale: Der Sammelbegriff bezeichnet Kleinvieh, besonders Schafe und Ziegen. „Herden“ erhält den kollektiven Charakter und passt zum pastoralen Kontext.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das Verb bezeichnet hier ein durch das angekündigte Gericht gewonnenes Erkennen. „Dann“ gibt den folgernden Zusammenhang der Satzverbindung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen gebräuchliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamecharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von בְּנֵי עַמּוֹן im räumlichen Parallelismus
  choice: das Gebiet der Ammoniter
  alternative: die Ammoniter / die Söhne Ammons
  rationale: Ein Volk selbst kann nicht ohne Bedeutungsverschiebung ein Lagerplatz für Herden werden. Der Parallelismus mit der Stadt Rabba legt die geläufige metonymische Verwendung für das ammonitische Land nahe; eine Fußnote bewahrt den hebräischen Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen Gerichtsaussagen bleiben klar erkennbar; die Hirtenbildsprache wird ohne altertümliche oder unnötig technische Ausdrücke wiedergegeben.
