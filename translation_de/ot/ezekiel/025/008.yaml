  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֗עַן אֲמֹ֤ר מוֹאָב֙ וְ/שֵׂעִ֔יר הִנֵּ֥ה כְּ/כָֽל הַ/גּוֹיִ֖ם בֵּ֥ית יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/008.yaml
  text: 'Thus says the Lord GOD: Because Moab and Seir say, ‘Look, the house of Judah is like all the nations,’'
translation:
  language: de
  text: 'So spricht GOTT, der Herr: Weil Moab und Seïr sagen: »Siehe, das Haus Juda ist wie alle Völker«,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdigem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Gibt den Gottesnamen typografisch als GOTT wieder und verbindet ihn mit dem Herrschaftstitel, ohne beide hebräischen Elemente zusammenfallen zu lassen.
- source_word: יַעַן אֲמֹר
  choice: Weil … sagen
  rationale: Gibt die kausale Anklageformel und die im Hebräischen stehende Aussage im Plural direkt wieder.
- source_word: הִנֵּה
  choice: Seht
  rationale: Erhält den aufmerksamkeitslenkenden, spöttisch triumphierenden Ausruf in idiomatischem Deutsch.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Bewahrt die kollektive dynastisch-nationale Bezeichnung des hebräischen Textes.
- source_word: כְּכָל הַגּוֹיִם
  choice: wie alle anderen Völker
  rationale: 'Macht die Vergleichsbedeutung natürlich verständlich: Juda wird den übrigen Völkern gleichgestellt.'
theological_decisions:
- issue: Wiedergabe des Tetragramms in אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: Herr HERR / Herr Jahwe
  rationale: Die gewählte Form signalisiert den Gottesnamen, vermeidet die missverständliche Doppelung »Herr HERR« und setzt keine umstrittene deutsche Ausspracheform voraus.
- issue: Sinn der Behauptung über Juda
  choice: wie alle anderen Völker
  alternative: wie alle Völker
  rationale: '»anderen« ist im Deutschen eine kontextuell notwendige Verdeutlichung des Vergleichs und lässt die theologische Spannung bestehen: Moab und Seïr bestreiten Judas besonderen Status.'
translation_notes:
  register: Moderne, würdige prophetische Rede. Der Ausruf »Seht« bewahrt die deiktische Kraft von הִנֵּה; »Haus Juda« hält die biblische Kollektivbezeichnung bewusst fest.
