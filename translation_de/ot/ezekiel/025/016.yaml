  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֨י נוֹטֶ֤ה יָדִ/י֙ עַל פְּלִשְׁתִּ֔ים וְ/הִכְרַתִּ֖י אֶת כְּרֵתִ֑ים וְ/הַ֣אֲבַדְתִּ֔י אֶת שְׁאֵרִ֖ית ח֥וֹף הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am stretching out my hand against the Philistines, and I will cut off the Cherethites, and I will destroy the remnant of the seacoast.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Siehe, ich strecke meine Hand gegen die Philister aus. Ich werde die Keretiter[a] ausrotten und den Rest der Meeresküste vernichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „die Kreter“. Der hebräische Name kann ein mit Kreta verbundenes Volk bezeichnen; die genaue Identität ist jedoch unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung aus אֲדֹנָי und dem Gottesnamen wird als „der Herr Yahweh“ wiedergegeben. So bleibt der Eigenname erkennbar, ohne die im Deutschen missverständliche Doppelung „Herr HERR“.
- source_word: הִנְנִי
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel kündigt das unmittelbar bevorstehende Handeln Gottes an. „Siehe“ bewahrt den feierlichen prophetischen Ton und ist im Deutschen verständlich.
- source_word: נוֹטֶה יָדִי
  choice: ich strecke meine Hand ... aus
  rationale: Das Partizip zusammen mit הִנְנִי stellt das Handeln anschaulich als unmittelbar einsetzend dar. Das deutsche Präsens gibt diese Lebendigkeit natürlich wieder.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die geläufige deutsche Bezeichnung des genannten Volkes.
- source_word: וְהִכְרַתִּי
  choice: Ich werde ... ausrotten
  rationale: כרת bedeutet im Gerichtszusammenhang, eine Gruppe vollständig zu beseitigen. „Ausrotten“ gibt die gegen ein Volk gerichtete Vernichtung im modernen Deutschen klarer wieder als das wörtliche „abschneiden“.
- source_word: כְּרֵתִים
  choice: die Keretiter
  rationale: Der hebräische Volksname wird in einer im Deutschen etablierten Form transliteriert. Eine Gleichsetzung mit Kretern ist möglich, aber nicht sicher und wird daher nur in der Fußnote genannt.
- source_word: וְהַאֲבַדְתִּי
  choice: ich werde ... vernichten
  rationale: Der Hifil von אבד bezeichnet hier das Zugrunde-Richten beziehungsweise Vernichten und wird entsprechend kraftvoll wiedergegeben.
- source_word: שְׁאֵרִית
  choice: den Rest
  rationale: „Den Rest“ bezeichnet im Zusammenhang neutral die noch verbliebenen Menschen und vermeidet, dem Ausdruck hier eine positive theologische Bedeutung zu geben.
- source_word: חוֹף הַיָּם
  choice: an der Meeresküste
  rationale: Die Wendung bedeutet wörtlich „Küste des Meeres“. „An der Meeresküste“ ist im Satz natürlich und lässt den geografischen Bezug offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und bewahrt damit die zwei Bestandteile der hebräischen Verbindung.
- issue: Identität der כְּרֵתִים
  choice: Keretiter im Haupttext
  alternative: Kreter
  rationale: Der Text nennt eine ethnische Gruppe, deren mögliche Verbindung zu Kreta nicht zweifelsfrei feststeht. Die Transliteration bewahrt diese Ungewissheit; die mögliche Identifikation wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem prophetischem Ton. Das einleitende „Siehe“ und die Formel „so spricht“ bewahren die feierliche Prägung des hebräischen Textes; die beiden folgenden Zukunftssätze geben die angekündigten Gerichtsakte klar wieder.
