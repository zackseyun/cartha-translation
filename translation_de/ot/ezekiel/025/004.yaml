base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/004.yaml
  text: Therefore, look, I am giving you to the sons of the east as a possession, and they will set their encampments in you and place their dwellings in you. They will eat your fruit, and they will drink your milk.
translation:
  language: de
  text: 'Darum, siehe: Ich gebe dich den Söhnen des Ostens zum Besitz. Sie werden ihre Zeltlager in dir aufschlagen und ihre Wohnstätten in dir errichten. Sie werden deine Früchte essen und deine Milch trinken.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי קֶדֶם
  choice: Söhne des Ostens
  rationale: Gibt die hebräische Gruppenbezeichnung formal und verständlich wieder, ohne sie vorschnell mit einem bestimmten Volk gleichzusetzen.
- source_word: מוֹרָשָׁה
  choice: Besitz
  rationale: Bezeichnet hier etwas, das einer Gruppe als Besitz übergeben wird; „Besitz“ ist im Kontext natürlicher als „Erbteil“.
- source_word: טִירוֹתֵיהֶם
  choice: ihre Lagerplätze
  rationale: Das seltene Wort kann befestigte Lager oder Zeltlager bezeichnen. „Lagerplätze“ bewahrt den nomadischen Kontext, ohne eine Befestigung sicher vorauszusetzen.
- source_word: מִשְׁכְּנֵיהֶם
  choice: ihre Wohnstätten
  rationale: Bezeichnet Orte des Wohnens beziehungsweise Behausungen und bildet gegenüber den Lagerplätzen eine passende zweite Aussage.
- source_word: פִרְיֵךְ
  choice: deine Früchte
  rationale: Das Singular-Kollektiv „Frucht“ meint den Ertrag des Landes; der deutsche Plural klingt hier natürlich und bleibt bildlich konkret.
- source_word: חֲלָבֵךְ
  choice: deine Milch
  rationale: Die konkrete Rede von der Milch Ammons wird beibehalten und nicht verallgemeinernd als Wohlstand oder Ertrag wiedergegeben.
theological_decisions:
- issue: Identität der „Söhne des Ostens“
  choice: Die hebräische Bezeichnung wird wörtlich als „Söhne des Ostens“ wiedergegeben.
  alternative: „Bewohner des Ostens“ oder eine Identifikation mit bestimmten arabischen Stämmen
  rationale: Der Text bezeichnet eine östliche Bevölkerungsgruppe, legt hier aber keine engere ethnische Identifikation fest.
- issue: Direkte Anrede Ammons in femininer Form
  choice: Die direkte Anrede wird mit „dich“, „dir“, „deine“ fortgeführt.
  alternative: Explizite Wiederholung von „Ammon“ oder „das Land Ammon“
  rationale: So bleibt die personifizierende direkte Anrede des hebräischen Textes erhalten, ohne im Deutschen künstlich ein grammatisches Geschlecht hervorzuheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darum, sieh“ bildet die prophetische Hervorhebung von לָכֵן הִנְנִי knapp ab. Die parallelen Verben werden mit „errichten“ und „anlegen“ natürlich differenziert; die wiederholte direkte Anrede bleibt erhalten.
