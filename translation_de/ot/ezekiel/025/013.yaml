  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָטִ֤תִי יָדִ/י֙ עַל אֱד֔וֹם וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֣ם וּ/בְהֵמָ֑ה וּ/נְתַתִּ֤י/הָ חָרְבָּה֙ מִ/תֵּימָ֔ן וּ/דְדָ֖נֶ/ה בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/013.yaml
  text: 'Therefore thus says the Lord GOD: I will stretch out my hand against Edom[a], and I will cut off from it man and beast, and I will make it a desolation; from Teman even to Dedan they will fall by the sword.'
translation:
  language: de
  text: 'Darum, so spricht Yahweh, der Herr: Ich werde meine Hand gegen Edom ausstrecken und in Edom Menschen und Vieh ausrotten. Ich werde es zur Einöde machen; von Teman bis nach Dedan[a] werden sie durch das Schwert fallen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei anderer Gliederung des knappen hebräischen Satzes: „Von Teman an werden sie bis nach Dedan durch das Schwert fallen.“'
    reason: syntaktische Alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung aus Herrentitel und Gottesnamen wird transparent wiedergegeben; „Yahweh“ bewahrt den im Hebräischen ausdrücklich stehenden Eigennamen, ohne das schwer verständliche „Herr HERR“ zu erzeugen.
- source_word: וְנָטִתִי יָדִי
  choice: Ich werde meine Hand … ausstrecken
  rationale: Die hebräische Bildsprache für Gottes machtvolles Eingreifen zum Gericht bleibt erhalten und klingt im Deutschen natürlich.
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: dort … ausrotten
  rationale: כרת bezeichnet hier die vollständige Beseitigung der Bewohner. „Ausrotten“ gibt die Gerichtsaussage kräftig wieder; „dort“ vermeidet einen im Deutschen unnatürlichen Rückbezug auf den Ortsnamen Edom.
- source_word: אָדָם וּבְהֵמָה
  choice: Menschen und Vieh
  rationale: Die Paarung bezeichnet menschliche Bewohner und domestizierte Tiere als Gesamtheit. Der kollektive Singular אָדָם wird im natürlichen Deutschen mit „Menschen“ wiedergegeben.
- source_word: וּנְתַתִּיהָ חָרְבָּה
  choice: Ich werde es zur Einöde machen
  rationale: Die Formulierung bewahrt die nominale Aussage von חָרְבָּה und den feierlichen Ton des Gerichtsworts.
- source_word: מִתֵּימָן
  choice: von Teman
  rationale: Teman ist hier der geografische Eigenname und wird daher nicht als „Süden“ übersetzt.
- source_word: וּדְדָנֶה
  choice: bis nach Dedan
  rationale: Die Richtungsendung an דדן und der Zusammenhang bezeichnen die räumliche Erstreckung der Verwüstung bis in Richtung Dedan.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: werden sie durch das Schwert fallen
  rationale: Die geläufige hebräische Wendung für gewaltsamen Tod im Krieg wird bildnah und würdevoll wiedergegeben.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom ausdrücklich genannten Gottesnamen יהוה und macht beide Bestandteile sichtbar. Die Alternative entspricht einer verbreiteten deutschen Bibelkonvention, verdeckt jedoch den Eigennamen.
- issue: Reichweite der angekündigten Verwüstung
  choice: von Teman bis nach Dedan
  alternative: von Teman, und nach Dedan hin werden sie durch das Schwert fallen
  rationale: Der Zusammenhang legt eine geografische Spannweite nahe. Da die hebräische Satzfügung knapp ist und die Richtungsendung auch enger mit dem folgenden Satzteil verbunden werden kann, wird die alternative Gliederung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gerichtsbilder „die Hand ausstrecken“, „zur Einöde machen“ und „durch das Schwert fallen“ bleiben erhalten; unnötig altertümliche Formen werden vermieden.
