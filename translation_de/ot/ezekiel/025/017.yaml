base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/017.yaml
  text: And I will execute great acts of vengeance on them with wrathful rebukes[a], and they will know that I am Yahweh when I lay my vengeance on them.
translation:
  language: de
  text: Und ich werde große Rachetaten an ihnen vollstrecken, mit Zurechtweisungen voller Zorn[a]. Und sie werden erkennen, dass ich Jahwe bin, wenn ich meine Rache an ihnen vollziehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Zurechtweisungen des Zorns“; möglicherweise auch: „mit zornigen Züchtigungen“ oder „mit zornigen Strafmaßnahmen“. Das hebräische Wort bezeichnet primär Zurechtweisung oder Verweis, kann im Zusammenhang des göttlichen Gerichts jedoch auch strafende Züchtigung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי בָם נְקָמוֹת גְּדֹלוֹת
  choice: ich werde große Rachetaten an ihnen vollstrecken
  rationale: עשה bezeichnet hier zusammen mit dem pluralischen נְקָמוֹת das Ausführen von Vergeltung. „Rachetaten“ gibt den Plural wieder; „vollstrecken“ entspricht dem Gerichtskontext.
- source_word: בְּתוֹכְחוֹת חֵמָה
  choice: mit Züchtigungen in glühendem Zorn
  rationale: תּוֹכְחוֹת kann Zurechtweisungen, Züchtigungen oder strafende Maßnahmen bezeichnen; חֵמָה meint heftigen, bildlich aufwallenden Zorn. Die Formulierung bewahrt sowohl den korrigierenden als auch den strafenden Klang.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Dann werden sie erkennen, dass ich Jahwe bin
  rationale: Die in Ezechiel häufige Erkenntnisformel wird klar und idiomatisch wiedergegeben. „Dann“ macht die konsekutive Wirkung des hebräischen וְ in diesem Zusammenhang natürlich verständlich.
- source_word: בְּתִתִּי אֶת־נִקְמָתִי בָּם
  choice: wenn ich meine Rache an ihnen vollziehe
  rationale: נתן bedeutet wörtlich „geben/legen“, bezeichnet mit „Rache“ jedoch idiomatisch deren Verhängung oder Vollziehung. „Vollziehe“ ist im Deutschen natürlich und bleibt nah am Gerichtsmotiv.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- issue: Charakter von תּוֹכְחוֹת im göttlichen Gericht
  choice: Züchtigungen
  alternative: Zurechtweisungen; Strafgerichte
  rationale: Der Ausdruck kann sowohl zurechtweisende als auch konkret strafende Maßnahmen bezeichnen. „Züchtigungen“ hält diese Spannung offen; die Fußnote nennt die wichtigsten Bedeutungsalternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige Gerichtssprache und die Wiederholung des Rachemotivs bleiben erhalten; die schwer eindeutig festzulegende Verbindung von Zurechtweisung, Züchtigung und Strafe wird nicht vorschnell vereindeutigt.
