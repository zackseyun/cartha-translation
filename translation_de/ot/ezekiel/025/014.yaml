  text: וְ/נָתַתִּ֨י אֶת נִקְמָתִ֜/י בֶּ/אֱד֗וֹם בְּ/יַד֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/עָשׂ֣וּ בֶ/אֱד֔וֹם כְּ/אַפִּ֖/י וְ/כַ/חֲמָתִ֑/י וְ/יָֽדְעוּ֙ אֶת נִקְמָתִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/014.yaml
  text: And I will set my vengeance on Edom by the hand of my people Israel[a], and they will deal with Edom according to my anger and according to my wrath; and they will know my vengeance[c][b], declares the Lord GOD.
translation:
  language: de
  text: Und ich werde meine Rache über Edom bringen durch die Hand meines Volkes Israel. Sie werden mit Edom verfahren nach meinem Zorn und nach meinem Grimm, und sie werden meine Rache erkennen, spricht der Herr Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־נִקְמָתִי בֶּאֱדוֹם
  choice: ich werde meine Rache an Edom ... vollziehen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“. In Verbindung mit נקמה bezeichnet die Wendung hier das Verhängen bzw. Vollziehen der Rache. Die deutsche Formulierung ist natürlich, ohne die göttliche Urheberschaft abzuschwächen; ב wird im feindlichen Zusammenhang als „an“ wiedergegeben.
- source_word: בְּיַד עַמִּי יִשְׂרָאֵל
  choice: durch die Hand meines Volkes Israel
  rationale: ביד ist eine instrumentale Wendung. „Durch die Hand“ bewahrt das hebräische Bild und stellt Israel als Werkzeug des göttlichen Handelns dar.
- source_word: וְעָשׂוּ בֶאֱדוֹם
  choice: Sie werden an Edom handeln
  rationale: עשה ist das breite Verb „tun, handeln“. Die bewusst offene Wiedergabe vermeidet es, einen spezifischeren Vorgang wie „Gericht vollstrecken“ in den Text einzutragen; das feindliche Handeln ergibt sich aus dem Kontext.
- source_word: כְּאַפִּי וְכַחֲמָתִי
  choice: wie es meinem Zorn und meinem Grimm entspricht
  rationale: כ bezeichnet die Entsprechung zu Gottes אף und חמה. „Zorn“ und „Grimm“ erhalten die parallele, steigernde Ausdrucksweise in idiomatischem Deutsch.
- source_word: וְיָדְעוּ אֶת־נִקְמָתִי
  choice: Dann werden sie meine Rache erkennen
  rationale: ידע mit direktem Objekt kann erfahrendes Erkennen ausdrücken. „Erkennen“ lässt diesen in Ezechiel häufigen Erkenntnischarakter deutlicher hervortreten als bloßes „kennen“.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Jahwe
  rationale: נאם ist die prophetische Ausspruchsformel. „Jahwe“ gibt den Gottesnamen wieder, während אֲדֹנָי mit „der Herr“ übersetzt wird.
theological_decisions:
- issue: Göttliche und menschliche Handlungsträgerschaft beim Gericht über Edom
  choice: Gott vollzieht seine eigene Rache durch Israel als menschliches Werkzeug.
  alternative: Israel handelt unabhängig, oder Gott handelt ohne menschliche Vermittlung.
  rationale: Der Satz verbindet ausdrücklich Gottes Handeln („ich werde“) mit dem instrumentalen Ausdruck „durch die Hand meines Volkes Israel“. Beide Handlungsebenen bleiben erhalten.
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR; der Herr HERR; der Herr JHWH
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet die unnatürliche Verdopplung „Herr HERR“.
- issue: Bezug von וְיָדְעוּ („sie werden erkennen“)
  choice: Das grammatische Subjekt bleibt wie im Hebräischen unausgesprochen und wird im Haupttext nicht näher bestimmt.
  alternative: Ausdrückliche Festlegung auf die Edomiter oder auf Israel.
  rationale: Die Verbform allein benennt die Bezugsgruppe nicht ausdrücklich. Der Kontext kann Edom als die vom Gericht Betroffenen nahelegen, doch eine eindeutige Ergänzung würde die vorhandene Unbestimmtheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist für heutige Leser geglättet, während die Wiederholung von „meine Rache“ sowie die Paarung „Zorn und Grimm“ erhalten bleiben. „An Edom handeln“ ist absichtlich etwas formal, um die Breite des hebräischen Verbs nicht durch eine zu genaue Deutung einzuengen.
