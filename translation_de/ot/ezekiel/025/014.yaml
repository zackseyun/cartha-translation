  terminology: „Rache“, „Zorn“ und „Grimm“ geben נקמה, אף und חמה angemessen als parallele Gerichtsterminologie wieder. Der Gottesname sollte gemäß der angegebenen Projektrichtlinie mit „Jahwe“ wiedergegeben werden. „der Herr Jahwe“ entspricht אֲדֹנָי יְהוִה.
