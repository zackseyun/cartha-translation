  source_fidelity: 'Die Grundstruktur und die Handlungsträgerschaft sind zutreffend wiedergegeben: Gottes Rache trifft Edom durch Israel, Israel handelt entsprechend Gottes Zorn und Grimm, und das Subjekt von „werden erkennen“ bleibt unbestimmt. Allerdings fasst „vollziehen“ das hebräische נתן („geben/legen/setzen“) interpretierend zusammen und die Satztrennung mit „Dann“ fügt eine zeitliche Nuance hinzu, die der koordinierenden Verbindung nicht zukommt.'
