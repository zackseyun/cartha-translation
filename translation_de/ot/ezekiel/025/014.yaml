revisions:
- from: Und ich werde meine Rache an Edom durch die Hand meines Volkes Israel vollziehen[a]. Sie werden an Edom handeln, wie es meinem Zorn und meinem Grimm entspricht[b]. Dann werden sie meine Rache erkennen, spricht der Herr Jahwe.
  to: Und ich werde meine Rache über Edom bringen durch die Hand meines Volkes Israel. Sie werden mit Edom verfahren nach meinem Zorn und nach meinem Grimm, und sie werden meine Rache erkennen, spricht der Herr Jahwe.
  rationale: 'Die Übersetzung wird an zwei Stellen näher an die offene hebräische Ausdrucksweise und zugleich an natürliches modernes Deutsch geführt: Gottes Rache wird „über Edom gebracht“, statt den Vorgang mit „vollziehen“ stärker zu bestimmen; Israels Handeln wird mit „mit Edom verfahren“ idiomatisch und ohne zusätzliche Spezifizierung wiedergegeben. Die nicht ausgedrückte zeitliche Nuance von „Dann“ entfällt. Die vorhandenen Fußnoten bleiben sachlich zutreffend, werden jedoch im korrigierten Volltext an ihren jeweiligen Stellen verankert.'
