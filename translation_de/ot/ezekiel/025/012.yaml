  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן עֲשׂ֥וֹת אֱד֛וֹם בִּ/נְקֹ֥ם נָקָ֖ם לְ/בֵ֣ית יְהוּדָ֑ה וַ/יֶּאְשְׁמ֥וּ אָשׁ֖וֹם וְ/נִקְּמ֥וּ בָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/012.yaml
  text: 'Thus says the Lord GOD: Because Edom acted in vengeance against the house of Judah[a], and became very guilty, and took vengeance on them[b],'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Weil Edom am Haus Juda Rache nahm[a], sich schwer schuldig machte[b] und sich an ihnen rächte,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »indem es Rache rächte«; die hebräische Wortverbindung betont das Rachehandeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »schwere Schuld auf sich lud«. Das Hebräische verbindet ein Verb für Schuld mit einem verwandten Verstärkungselement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Yahweh
  rationale: Gibt beide Bestandteile des zusammengesetzten Gottestitels wieder und bewahrt den offenbarten Gottesnamen, ohne das unnatürliche »Herr HERR« zu erzeugen.
- source_word: יַעַן
  choice: Weil
  rationale: Leitet unmittelbar und in natürlichem modernem Deutsch den Grund für das folgende Gerichtswort ein.
- source_word: עֲשׂוֹת אֱדוֹם בִּנְקֹם נָקָם
  choice: Edom aus Rachsucht … Rache nahm
  rationale: Die deutsche Formulierung verbindet das allgemeine Tun mit dem betonten Rachemotiv der hebräischen figura etymologica und vermeidet eine schwerfällige wörtliche Wiedergabe.
- source_word: לְבֵית יְהוּדָה
  choice: am Haus Juda
  rationale: Im Zusammenhang bezeichnet לְ das feindlich betroffene Gegenüber. »Haus Juda« bewahrt die nationale und gemeinschaftliche Bezeichnung.
- source_word: וַיֶּאְשְׁמוּ אָשׁוֹם
  choice: dadurch schwere Schuld auf sich lud
  rationale: Die Verbindung des Verbs אשם mit dem verwandten Intensivierungselement bezeichnet nachdrückliche Schuld; »schwere Schuld« gibt diese Verstärkung idiomatisch wieder.
- source_word: וְנִקְּמוּ בָהֶם
  choice: und sich an ihnen rächte
  rationale: Gibt die reflexive Bedeutung des Niphal und die erneute Hervorhebung der Vergeltung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens im Titel אֲדֹנָי יְהוִה
  choice: der Herr, Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Fassung unterscheidet אֲדֹנָי von יהוה und lässt den Eigennamen erkennbar, ohne eine konfessionell aufgeladene Deutung einzutragen.
- issue: Art der Schuld Edoms
  choice: schwere Schuld auf sich lud
  alternative: sich völlig schuldig machte
  rationale: Die Übersetzung bewahrt die betonte Schuldzuweisung, entscheidet aber nicht zusätzlich, ob der Ausdruck einen rechtlichen Schuldspruch oder primär moralische Verfehlung bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung des Rachemotivs bleibt erhalten; die hebräische Intensivierung bei der Schuld wird idiomatisch ausgedrückt. Der Satz endet mit Komma, weil der Begründungssatz in Vers 13 fortgeführt wird.
