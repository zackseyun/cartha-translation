  to: 'Darum, siehe, ich öffne die Flanke Moabs von den Städten her, von seinen Grenzstädten her – der Zierde des Landes: Bet-Jeschimot, Baal-Meon und Kirjatajim.[a]'
  rationale: Die Revision ersetzt die räumlich zu schwache Wiedergabe „bei“ durch „von … her“, macht die göttliche Selbstankündigung mit „siehe, ich“ deutlich und glättet die textkritische Fußnote. Die leicht gespannte Apposition „der Zierde des Landes“ bleibt bewusst erhalten, da ihre genaue syntaktische Zuordnung im Hebräischen nicht stärker festgelegt werden sollte.
