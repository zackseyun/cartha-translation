    rationale: Das hebräische הִנְנִי ist hier Teil der Gottesrede („siehe, ich“), nicht primär eine direkte Aufforderung an die Hörerschaft. Die Formel „Darum, siehe, ich“ wahrt dies klarer.
  - severity: low
