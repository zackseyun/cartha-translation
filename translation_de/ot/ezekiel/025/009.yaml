source:
  edition: WLC
  text: לָ/כֵן֩ הִנְ/נִ֨י פֹתֵ֜חַ אֶת כֶּ֤תֶף מוֹאָב֙ מֵ/הֶ֣/עָרִ֔ים מֵֽ/עָרָ֖י/ו מִ/קָּצֵ֑/הוּ צְבִ֗י אֶ֚רֶץ בֵּ֣ית הַיְשִׁימֹ֔ת בַּ֥עַל מְע֖וֹן ו/קריתמ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
translation:
  language: de
  text: 'Darum, siehe, ich öffne die Flanke Moabs von den Städten her, von seinen Grenzstädten her – der Zierde des Landes: Bet-Jeschimot, Baal-Meon und Kirjatajim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Schreibform des letzten Ortsnamens entspricht Kirjatajim, einer bekannten moabitischen Stadt.
    reason: textual_variant
lexical_decisions:
- source_word: לָכֵן הִנְנִי
  choice: Darum seht
  rationale: לָכֵן bezeichnet die Folgerung; הִנְנִי leitet die unmittelbar bevorstehende göttliche Handlung mit prophetischer Eindringlichkeit ein. „Seht“ gibt dieses Aufmerksamkeitssignal in natürlichem, würdigem Deutsch wieder.
- source_word: פֹתֵחַ
  choice: Ich öffne
  rationale: Das Partizip mit הִנְנִי bezeichnet eine unmittelbar bevorstehende Handlung. Das deutsche Präsens bewahrt die prophetische Unmittelbarkeit.
- source_word: כֶּתֶף מוֹאָב
  choice: die Flanke Moabs
  rationale: כֶּתֶף bedeutet wörtlich „Schulter“, bezeichnet hier aber geografisch beziehungsweise militärisch die Seite oder Flanke eines Gebiets. „Flanke“ erhält das Bild des Bloßlegens einer verwundbaren Seite.
- source_word: מֵהֶעָרִים מֵעָרָיו מִקָּצֵהוּ
  choice: bei den Städten, bei seinen Grenzstädten
  rationale: Die מן-Verbindungen bestimmen den Ansatzpunkt der Öffnung; מִקָּצֵהוּ kennzeichnet die Städte am Rand Moabs. „Bei“ ist im Deutschen räumlich verständlich und vermeidet das missverständliche „von seinen Städten her“, ohne die syntaktische Wiederholung ganz aufzugeben.
- source_word: צְבִי אֶרֶץ
  choice: der Zierde des Landes
  rationale: צְבִי kann Schönheit, Pracht oder Zierde bezeichnen. „Zierde“ bewahrt den gehobenen Ton und lässt offen, ob die Bezeichnung auf die Grenzstädte insgesamt oder besonders auf die genannten Orte bezogen ist.
- source_word: בֵּית הַיְשִׁימֹת
  choice: Bet-Jeschimot
  rationale: Der Ortsname wird nach geläufiger deutscher Bibelnamenform transliteriert.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meon
  rationale: Der Ortsname wird transliteriert und zur Lesbarkeit mit Bindestrich geschrieben.
- source_word: וקריתמה
  choice: Kirjatajim
  rationale: Die überlieferte Schreibform wird als Name der bekannten moabitischen Stadt Kirjatajim verstanden; verwendet wird eine geläufige deutsche Transliteration.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Unmittelbarkeit. Die Wiederholung „bei den Städten, bei seinen Grenzstädten“ spiegelt die hebräische Struktur; „Flanke“ bewahrt das geografisch-militärische Bild. Der einzige Fußnotenmarker steht nach dem betroffenen Ortsnamen.
