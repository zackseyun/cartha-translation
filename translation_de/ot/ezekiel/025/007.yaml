source:
  edition: WLC
  text: לָ/כֵ֡ן הִנְ/נִי֩ נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וּ/נְתַתִּ֤י/ךָֽ ל/בג לַ/גּוֹיִ֔ם וְ/הִכְרַתִּ֨י/ךָ֙ מִן הָ֣/עַמִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךָ מִן הָ/אֲרָצ֑וֹת אַשְׁמִ֣ידְ/ךָ֔ וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/007.yaml
  text: Therefore[a], behold, I have stretched out my hand against you, and I will give you as plunder to the nations. I will cut you off from the peoples and destroy you from the lands; I will annihilate you, and you will know that I am Yahweh.
translation:
  language: de
  text: Darum, siehe, ich habe meine Hand gegen dich ausgestreckt und werde dich den Nationen zur Beute geben[a]. Ich werde dich aus den Völkern ausrotten und dich aus den Ländern vertilgen. Ich werde dich vernichten, und du wirst erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als Plündergut für die Nationen.'
    reason: Die seltene hebräische Bezeichnung wird im Kontext als Beute bzw. Plündergut verstanden.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Konsequenz aus der zuvor genannten Schuld ein; „Darum“ ist knapp, klar und idiomatisch.
- source_word: הִנְנִי נָטִיתִי אֶת־יָדִי עָלֶיךָ
  choice: siehe, ich strecke meine Hand gegen dich aus
  rationale: „Siehe“ bewahrt die feierliche prophetische Hinweisformel. Das Präsens gibt die unmittelbar angekündigte Gerichtshandlung natürlich wieder und erhält das Bild der gegen den Angeredeten ausgestreckten Hand.
- source_word: וּנְתַתִּיךָ לְבַג לַגּוֹיִם
  choice: und gebe dich den Nationen zur Beute
  rationale: „Zur Beute geben“ vermittelt den militärischen Zusammenhang und die Übergabe an fremde Nationen in natürlichem Deutsch. Die seltene Form בַג wird entsprechend der alten Überlieferung und dem Kontext als Beute beziehungsweise Plündergut verstanden.
- source_word: גּוֹיִם
  choice: Nationen
  rationale: Gemeint sind fremde politische Völkerverbände; „Nationen“ wahrt zudem die lexikalische Unterscheidung zum folgenden עַמִּים.
- source_word: וְהִכְרַתִּיךָ מִן־הָעַמִּים
  choice: Ich rotte dich aus den Völkern aus
  rationale: Das Hifil von כרת bezeichnet hier die gewaltsame Beseitigung aus der Gemeinschaft der Völker. Die deutsche Wendung gibt sowohl die Trennung als auch den Vernichtungscharakter wieder.
- source_word: וְהַאֲבַדְתִּיךָ מִן־הָאֲרָצוֹת
  choice: und lasse dich aus den Ländern verschwinden
  rationale: Das kausative אבד bezeichnet das Zugrundegehenlassen beziehungsweise Beseitigen. Diese Wiedergabe bewahrt die räumliche Ergänzung „aus den Ländern“, ohne eine unnatürliche deutsche Konstruktion zu erzeugen.
- source_word: אַשְׁמִידְךָ
  choice: Ich vernichte dich
  rationale: שמד ist ein starkes Verb völliger Zerstörung. „Vernichten“ erhält die klimaktische Zuspitzung der Gerichtsankündigung.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: und du wirst erkennen, dass ich Jahwe bin
  rationale: Die für Ezechiel kennzeichnende Erkenntnisformel wird direkt wiedergegeben; „erkennen“ umfasst mehr als bloßes intellektuelles Wissen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Charakter als Gottes Eigenname.
- issue: Zeitliche Wiedergabe der prophetischen Perfektformen
  choice: Gegenwärtiger Beginn mit anschließender Zukunftsaussage
  alternative: Durchgehend Vergangenheit beziehungsweise Futur
  rationale: Die Folge kündigt sicheres kommendes Gericht an. „Ich strecke … aus und gebe …“ vergegenwärtigt die unmittelbar einsetzende Handlung, während „du wirst erkennen“ deren Ergebnis ausdrücklich zukünftig bezeichnet, ohne die prophetische Gewissheit abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Feierlichkeit in „siehe“. Die direkte Anrede im Singular folgt dem hebräischen Text und behandelt Ammon als kollektive Größe. Die abgestufte Reihe von Ausrottung, Verschwindenlassen und Vernichtung bleibt erhalten.
