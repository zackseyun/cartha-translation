source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן מַחְאֲ/ךָ֣ יָ֔ד וְ/רַקְעֲ/ךָ֖ בְּ/רָ֑גֶל וַ/תִּשְׂמַ֤ח בְּ/כָל שָֽׁאטְ/ךָ֙ בְּ/נֶ֔פֶשׁ אֶל אַדְמַ֖ת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/006.yaml
  text: 'For thus says the Lord GOD: Because you clapped your hands and stamped your feet[a], and rejoiced with all the contempt in your soul against the land of Israel,'
translation:
  language: de
  text: 'Denn so spricht Yahweh, der Herr: Weil du in die Hände geklatscht, mit den Füßen gestampft und dich mit deiner ganzen inneren Verachtung über das Land Israel gefreut hast,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה wieder. „Herr Yahweh“ vermeidet die unnatürliche Doppelung „Herr HERR“ und bewahrt den Eigennamen.
- source_word: יַעַן
  choice: Weil
  rationale: Leitet unmittelbar den Grund für das folgende Gerichtsurteil ein und gibt die kausale Funktion knapp und natürlich wieder.
- source_word: מַחְאֲךָ יָד
  choice: du in die Hände geklatscht hast
  rationale: Die Wendung bezeichnet das Händeklatschen als Ausdruck schadenfroher Erregung; der deutsche Plural ist idiomatisch.
- source_word: וְרַקְעֲךָ בְּרָגֶל
  choice: und mit den Füßen gestampft hast
  rationale: Gibt die expressive Gebärde natürlich wieder; obwohl das Hebräische „Fuß“ im Singular hat, verwendet das Deutsche hier gewöhnlich den Plural.
- source_word: וַתִּשְׂמַח
  choice: und dich … gefreut hast
  rationale: Bewahrt den Aussagekern des Verbs und lässt im Zusammenhang erkennen, dass es sich um boshafte Freude handelt.
- source_word: בְּכָל שָׁאטְךָ בְּנֶפֶשׁ
  choice: aus tiefster Seele voller Verachtung
  rationale: שָׁאט bezeichnet verächtliche, feindselige Geringschätzung; נֶפֶשׁ verweist hier auf das innere Selbst. Die Formulierung bewahrt beides in natürlichem Deutsch, ohne „Schadenfreude“ ausdrücklich in das Lexem hineinzulesen.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: über das Land Israel
  rationale: אֶל bezeichnet formal die Ausrichtung auf Israel. Beim Verb „sich freuen“ drückt „über“ im Deutschen natürlich den Gegenstand der feindseligen Freude aus; der Kontext verleiht der Aussage ihre gegen Israel gerichtete Bedeutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Der Text enthält Titel und Gottesnamen. Die gewählte Form macht diese Unterscheidung sichtbar und vermeidet, יהוה lediglich durch einen weiteren Herrschaftstitel zu ersetzen.
- issue: Bezug von בְּכָל שָׁאטְךָ בְּנֶפֶשׁ
  choice: „aus tiefster Seele voller Verachtung“ beschreibt die innere Haltung beim Sichfreuen
  alternative: „mit deinem ganzen Hohn“ als stärker an die äußere Äußerung gebundene Lesart
  rationale: Die hebräische Wortstellung ist gedrängt und lässt unterschiedliche Nuancierungen des Verhältnisses von Freude, Verachtung und נֶפֶשׁ zu. Die Übersetzung verbindet die Wendung mit der Freude, ohne eine weitergehende dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt wegen des anschließenden Gerichtsspruchs offen und endet entsprechend mit einem Komma. „Aus tiefster Seele“ ist idiomatischer als „in deiner Seele“, während „voller Verachtung“ die feindselige Haltung des hebräischen שָׁאט wahrt.
