lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Verbform mit vorangestelltem וַ führt den nächsten prophetischen Redeabschnitt fort. Die deutsche Wendung „Und … erging“ gibt diese erzählerische Weiterführung natürlich wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet in dieser prophetischen Eingangsformel Gottes Wort beziehungsweise Botschaft. „Das Wort“ bewahrt die geprägte und transparente Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; der Genitiv „Jahwes“ entspricht der hebräischen Verbindung „Wort Jahwes“.
- source_word: אֵלַי
  choice: an mich
  rationale: אֶל mit dem Suffix der ersten Person Singular bedeutet hier „an mich“; zusammen mit „erging“ ist dies im Deutschen die natürliche prophetische Formel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende Gottesrede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlich und ohne den schwerfälligen Zusatz „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht der Eigenname יהוה und kein Titel. „Jahwe“ gibt diesen Namen wieder, statt ihn durch „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel „das Wort … erging an mich“ bleibt erhalten; der Doppelpunkt kündigt die im folgenden Vers beginnende direkte Rede an.
