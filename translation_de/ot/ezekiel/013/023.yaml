id: EZK.13.23
reference: Ezekiel 13:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן שָׁ֚וְא לֹ֣א תֶחֱזֶ֔ינָה וְ/קֶ֖סֶם לֹא תִקְסַ֣מְנָה ע֑וֹד וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/023.yaml
  text: Therefore you will no longer see false visions or practice divination anymore, and I will deliver my people from your hand. Then you will know that I am the LORD.
translation:
  language: de
  text: Darum werdet ihr keine nichtigen Visionen mehr schauen und keine Wahrsagung mehr betreiben. Ich werde mein Volk aus eurer Hand retten. Dann werdet ihr erkennen, dass ich der HERR bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁוְא
  choice: nichtig
  rationale: Bezeichnet hier das Falsche, Leere und Trügerische der Visionen; „nichtig“ bewahrt diese Bedeutungsbreite besser als eine bloße Festlegung auf „falsch“.
- source_word: תֶחֱזֶינָה
  choice: werdet ihr ... schauen
  rationale: Die feminine Pluralform richtet sich an die zuvor angesprochenen Prophetinnen; „Visionen schauen“ gibt den prophetischen Sprachgebrauch wieder.
- source_word: קֶסֶם / תִקְסַמְנָה
  choice: Wahrsagung / betreiben
  rationale: Das Substantiv und das verwandte Verb bezeichnen divinatorische Praxis; die deutsche Verbindung klingt natürlich und erhält den sachlichen Gehalt.
- source_word: וְהִצַּלְתִּי
  choice: Ich werde ... retten
  rationale: Das Hifil von נצל drückt Befreiung beziehungsweise Rettung aus einer Gewaltlage aus.
- source_word: מִיֶּדְכֶן
  choice: aus eurer Hand
  rationale: Die hebräische Metapher für Macht oder Gewalt wird verständlich und bildgetreu beibehalten.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen beziehungsweise Großschreibung folgt dem vorgegebenen Publikationsstil.
theological_decisions:
- issue: Charakter der Visionen
  choice: „nichtige Visionen“
  alternative: „falsche Visionen“
  rationale: Der Ausdruck lässt sowohl Unwahrheit als auch Leere und Vergeblichkeit anklingen und legt die Aussage nicht enger fest als das Hebräische.
- issue: Erkenntnisformel
  choice: „Dann werdet ihr erkennen, dass ich der HERR bin“
  alternative: „und ihr werdet erkennen ...“
  rationale: „Dann“ macht die sachliche Folge im Deutschen deutlich, ohne einen zusätzlichen theologischen Inhalt einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weibliche Anrede ist im deutschen Plural nicht eigens sichtbar, ergibt sich jedoch aus dem Kontext. Keine Fußnote ist für diesen Einzelvers erforderlich.
