  text: יַ֣עַן הַכְא֤וֹת לֵב צַדִּיק֙ שֶׁ֔קֶר וַ/אֲנִ֖י לֹ֣א הִכְאַבְתִּ֑י/ו וּ/לְ/חַזֵּק֙ יְדֵ֣י רָשָׁ֔ע לְ/בִלְתִּי שׁ֛וּב מִ/דַּרְכּ֥/וֹ הָ/רָ֖ע לְ/הַחֲיֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/022.yaml
  text: Because you have disheartened the heart of the righteous with falsehood[a], though I had not caused him grief, and because you have strengthened the hands of the wicked so that he does not turn from his evil way to preserve his life[b],
translation:
  language: de
  text: Weil ihr dem Herzen des Gerechten mit Lügen Kummer bereitet habt, obwohl ich ihm keinen Kummer bereitet hatte, und weil ihr die Hände des Frevlers gestärkt habt, sodass er nicht von seinem bösen Weg umkehrt, um sein Leben zu bewahren[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: »damit er am Leben bleibt« beziehungsweise »und am Leben bleibt«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: Weil
  rationale: Leitet wie im Hebräischen den Grund für das im Zusammenhang folgende Gericht ein.
- source_word: הַכְאוֹת ... וַאֲנִי לֹא הִכְאַבְתִּיו
  choice: bekümmert habt ... ich ihn nicht bekümmert hatte
  rationale: Die wiederholte Wiedergabe mit demselben deutschen Verb erhält die lexikalische Verbindung und den Kontrast zwischen dem Handeln der Angeredeten und Gottes Handeln.
- source_word: לֵב צַדִּיק
  choice: das Herz des Gerechten
  rationale: Bewahrt die Konstruktverbindung und den substantivierten Singular, ohne ihn unnötig auf eine bestimmte Einzelperson festzulegen.
- source_word: שֶׁקֶר
  choice: mit Lügen
  rationale: Gibt das Mittel der Bekümmerung natürlich wieder; das hebräische Nomen kann abstrakt als Falschheit oder konkret als Lügen verstanden werden.
- source_word: וּלְחַזֵּק יְדֵי רָשָׁע
  choice: und weil ihr die Hände des Frevlers gestärkt habt
  rationale: Erhält das hebräische Bild für Ermutigung oder Bestärkung und gibt den substantivierten Singular wieder.
- source_word: לְבִלְתִּי שׁוּב מִדַּרְכּוֹ הָרָע
  choice: sodass er nicht von seinem bösen Weg umkehrt
  rationale: Drückt die Folge beziehungsweise Absicht klar aus und bewahrt das prophetische Bild des Umkehrens von einem bösen Lebensweg.
- source_word: לְהַחֲיֹתוֹ
  choice: um sein Leben zu bewahren
  rationale: Gibt die lebensbezogene Ziel- oder Folgeangabe wieder, ohne festzulegen, ob ausschließlich zeitliches oder darüber hinausgehendes Leben gemeint ist.
theological_decisions:
- issue: Bezug und Sinn von לְהַחֲיֹתוֹ
  choice: um sein Leben zu bewahren
  alternative: damit er lebt / und am Leben bleibt
  rationale: Die Formulierung lässt den lebensbewahrenden Sinn erkennen, ohne eine bestimmte Heilslehre einzutragen. Eine Fußnote wahrt die syntaktische Möglichkeit einer wörtlicheren finalen beziehungsweise konsekutiven Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildrede »die Hände stärken« und die prophetische Wendung »von seinem bösen Weg umkehren« bleiben erhalten. Der Vers endet wie der hebräische Satz mit einem Komma, da der Gedanke im folgenden Vers weitergeführt wird.
