base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
translation:
  language: de
  text: 'Weil, ja, weil sie mein Volk in die Irre führen und sagen: »Frieden!«, obwohl kein Frieden da ist, und einer eine Mauer baut – siehe, sie bestreichen sie mit Tünche[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit untauglichem Mörtel. Das hebräische Wort bezeichnet hier wohl einen mangelhaften oder oberflächlichen Wandüberzug; die genaue Art des Materials ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן / וּבְיַעַן
  choice: Weil, ja, weil
  rationale: Die verdoppelte Kausalformel wird beibehalten, um ihre nachdrückliche Wirkung wiederzugeben. Das eingeschobene »ja« macht die Verstärkung im heutigen Deutsch verständlich.
- source_word: הִטְעוּ
  choice: in die Irre führen
  rationale: Die Kausativform bezeichnet, dass jemand zum Irren beziehungsweise Abirren gebracht wird. Die Wendung bewahrt die bildhafte und moralische Aussage.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die einfache, im Bundeskontext geprägte Bezeichnung wird ohne erläuternde Erweiterung wiedergegeben.
- source_word: לֵאמֹר שָׁלוֹם וְאֵין שָׁלוֹם
  choice: 'sagen: »Frieden!«, obwohl kein Frieden da ist'
  rationale: שָׁלוֹם kann Frieden, Wohlergehen und Unversehrtheit umfassen. »Frieden« ist hier die natürliche prophetische Ankündigungsformel; »obwohl« gibt den scharfen Gegensatz idiomatisch wieder.
- source_word: וְהוּא בֹּנֶה
  choice: weil einer ... baut
  rationale: Das maskuline Singularpronomen mit Partizip hat hier generischen Charakter. »Einer« wahrt den repräsentativen Singular, ohne eine bestimmte Person vorauszusetzen.
- source_word: חַיִץ
  choice: eine Mauer
  rationale: Das Substantiv bezeichnet eine Mauer oder Trennwand. »Mauer« wahrt das konkrete Baubild, ohne ihre Beschaffenheit interpretierend vorwegzunehmen.
- source_word: וְהִנָּם
  choice: sie diese dann
  rationale: Das Aufmerksamkeitssignal הִנֵּה mit pluralischem Suffix hebt den Wechsel von dem einzelnen Bauenden zu den mehreren Verputzenden hervor. Im Deutschen vermittelt »dann« den anschaulichen Fortgang natürlicher als das hier schwerfällige »siehe«.
- source_word: טָחִים אֹתוֹ
  choice: bestreichen sie diese
  rationale: Das Verb bezeichnet das Auftragen eines Putzes oder Überzugs. »Bestreichen« passt zu »Tünche« und hält die Tätigkeit konkret.
- source_word: תָּפֵל
  choice: mit Tünche
  rationale: Das seltene Wort bezeichnet im Zusammenhang einen mangelhaften oder oberflächlichen Wandüberzug; die genaue Materialart bleibt umstritten. »Tünche« gibt das Bild einer verdeckenden Beschichtung wieder, ohne so stark wie »Kalk« oder »weiße Farbe« zu spezifizieren.
theological_decisions:
- issue: Bildhafte Bedeutung von Mauer und Tünche in der prophetischen Anklage
  choice: Das konkrete Baubild bleibt im Haupttext stehen, ohne die Mauer ausdrücklich als mangelhaft oder die Tünche als Lüge zu deuten.
  alternative: 'Deutend erweitern: »eine brüchige Mauer« beziehungsweise »sie überdecken alles mit Lügen«.'
  rationale: Der hebräische Text stellt zunächst das Bild selbst vor Augen. Eine unmittelbare Ausdeutung würde die prophetische Metapher verengen und eine Erklärung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die ungewöhnliche Wiederholung »Weil, ja, weil« bewahrt bewusst den Nachdruck des Hebräischen. Der lange Kausalsatz bleibt erhalten, da der Vers syntaktisch in seinen Kontext eingebunden ist.
