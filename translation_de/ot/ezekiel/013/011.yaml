  text: אֱמֹ֛ר אֶל טָחֵ֥י תָפֵ֖ל וְ/יִפֹּ֑ל הָיָ֣ה גֶּ֣שֶׁם שׁוֹטֵ֗ף וְ/אַתֵּ֜נָה אַבְנֵ֤י אֶלְגָּבִישׁ֙ תִּפֹּ֔לְנָה וְ/ר֥וּחַ סְעָר֖וֹת תְּבַקֵּֽעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/011.yaml
  text: Tell those who plaster it with whitewash that it will fall[a]. There will be a flooding rain, and you, O hailstones, will fall[b], and a windstorm will break it open.
translation:
  language: de
  text: 'Sag zu denen, die sie mit Tünche[a] verputzen: Sie wird einstürzen. Ein alles fortreißender Regen[b] wird kommen; und ihr, Hagelsteine, werdet niedergehen, und ein Sturmwind wird sie aufreißen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit untauglichem Verputz“. Das hebräische Wort kann einen wertlosen oder oberflächlichen Überzug bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Wolkenbruch“ oder „ein Starkregen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָחֵי תָפֵל
  choice: die sie mit Tünche verputzen
  rationale: טוח bezeichnet das Verputzen oder Bestreichen; תָפֵל meint hier einen untauglichen, oberflächlichen Überzug. „Tünche“ bringt im Zusammenhang der nur scheinbar stabilisierten Mauer den kosmetischen und trügerischen Charakter zum Ausdruck. Das Objekt „sie“ ist die Mauer aus dem unmittelbaren Kontext.
- source_word: וְיִפֹּל
  choice: Sie wird einstürzen
  rationale: Das unausgesprochene Subjekt ist die Mauer. „Einstürzen“ bezeichnet im Deutschen ihren Fall präziser als das allgemeinere „fallen“.
- source_word: גֶּשֶׁם שׁוֹטֵף
  choice: ein alles wegschwemmender Regen
  rationale: שׁוֹטֵף beschreibt überströmende beziehungsweise fortreißende Gewalt. Die Formulierung bewahrt sowohl das Bild starken Regens als auch seine zerstörerische Wirkung.
- source_word: וְאַתֵּנָה אַבְנֵי אֶלְגָּבִישׁ תִּפֹּלְנָה
  choice: und ihr, Hagelsteine, werdet niedergehen
  rationale: Das selbstständige feminine Pluralpronomen אַתֵּנָה redet die Hagelsteine unmittelbar an. Die direkte Anrede bleibt erhalten; „niedergehen“ ist für Hagel natürlich und gibt תִּפֹּלְנָה wieder.
- source_word: וְרוּחַ סְעָרוֹת
  choice: und ein Sturmwind
  rationale: Die Wendung bezeichnet einen heftigen, zerstörerischen Wind. „Sturmwind“ ist im modernen Deutsch klar und quellennahe.
- source_word: תְּבַקֵּעַ
  choice: wird sie aufbrechen
  rationale: Das Piel von בקע bezeichnet ein Spalten oder Aufbrechen. Das im Hebräischen unausgesprochene Objekt wird aus dem Zusammenhang als die Mauer aufgenommen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lebhafte direkte Anrede an die Hagelsteine bleibt erhalten. Die Mauer wird mit dem femininen Pronomen aus dem unmittelbaren Zusammenhang aufgenommen; die kurzen Hauptsätze bewahren den scharfen Gerichtscharakter.
