  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] kam zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, der Gottesname; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Die Wayyiqtol-Form von היה führt die folgende prophetische Mitteilung in der üblichen Erzählfolge ein. Im Deutschen wird sie natürlich mit der festen Wendung „das Wort … kam“ verbunden; „Und es geschah“ wäre möglich, hier aber schwerfälliger.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְבַר יְהוָה bewahrt „das Wort“ den konkreten Bezug auf Gottes Reden und entspricht der wiederkehrenden Formel besser als das stärker deutende „die Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben. Diese im Deutschen geläufige Transkription bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Präposition und Suffix bezeichnen die Richtung zum Propheten und werden unmittelbar mit „zu mir“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende Gottesrede ein. Ein Doppelpunkt erfüllt diese Funktion im natürlichen modernen Deutsch, ohne das im Ausgangstext nicht als finites Verb formulierte „er sagte“ einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt, ohne den Namen im Haupttext zu verdrängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel bleibt erkennbar; der Doppelpunkt gibt die Redeankündigung idiomatisch wieder. Der Fußnotenmarker steht unmittelbar nach „mir“, entsprechend der bereitgestellten Bezugsschicht, obwohl die Fußnote sachlich den Gottesnamen erläutert.
