base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/013.yaml
  text: 'Therefore thus says the Lord GOD: I will unleash a storm wind in my wrath[a], and there will be a flooding rain in my anger, and hailstones in fury to bring complete destruction.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe, der Herr: In meinem Zorn werde ich einen Sturmwind losbrechen lassen[a]; in meinem Grimm wird ein Wolkenbruch niedergehen, und in glühendem Zorn werden Hagelsteine zur völligen Vernichtung fallen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ich werde einen Wind von Stürmen aufbrechen/aufreißen.“ Gemeint ist, dass Gott einen gewaltigen Sturmwind hervorbrechen lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Verbindung aus Herrentitel und Gottesnamen wird im Deutschen natürlich und zugleich quellennah wiedergegeben; „Jahwe“ bewahrt den ausdrücklich gesetzten Gottesnamen.
- source_word: וּבִקַּעְתִּי רוּחַ סְעָרוֹת
  choice: Ich lasse ... einen Sturmwind losbrechen
  rationale: בקע bedeutet wörtlich „spalten/aufbrechen“. In Verbindung mit dem Sturmwind bezeichnet die Form, dass Gott ihn mit Gewalt hervorbrechen lässt; die Formulierung bewahrt sowohl das Bild als auch Gottes aktive Verursachung.
- source_word: בַּחֲמָתִי
  choice: in meinem Zorn
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Zorn“ ist würdig, verständlich und passt zur Sprache prophetischen Gerichts.
- source_word: גֶּשֶׁם שֹׁטֵף
  choice: ein Wolkenbruch
  rationale: Das Partizip שֹׁטֵף beschreibt überströmenden, mitreißenden Regen. „Wolkenbruch“ gibt die zerstörerische Heftigkeit im modernen Deutschen knapp und natürlich wieder.
- source_word: בְּאַפִּי
  choice: in meinem Grimm
  rationale: אַף bedeutet idiomatisch Zorn. „Grimm“ erhält die emotionale Steigerung und vermeidet eine flache Wiederholung, ohne einen sachlichen Unterschied zu behaupten.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: Hagelsteine
  rationale: Die hebräische Wortverbindung bezeichnet Hagelsteine; die deutsche Zusammensetzung ist die natürliche Entsprechung.
- source_word: בְּחֵמָה
  choice: in glühendem Zorn
  rationale: Die erneute Verwendung von חֵמָה verstärkt die Gerichtsaussage. „Glühend“ bringt den mit dem Wort verbundenen Eindruck brennender Heftigkeit zum Ausdruck.
- source_word: לְכָלָה
  choice: um allem ein Ende zu machen
  rationale: כָּלָה bezeichnet Vollendung beziehungsweise vollständiges Ende und hier zerstörendes Gericht. Die Formulierung wahrt die Zielangabe, ohne den möglichen Umfang über „allem“ hinaus dogmatisch zu präzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR / der Herr HERR
  rationale: Der Text verbindet ausdrücklich den Herrentitel אֲדֹנָי mit dem Tetragramm. „Der Herr, Jahwe“ lässt sowohl Titel als auch persönlichen Gottesnamen erkennbar und vermeidet die missverständliche Verdoppelung „Herr HERR“.
- issue: Umfang und Ziel von לְכָלָה
  choice: um allem ein Ende zu machen
  alternative: zur vollständigen Vernichtung
  rationale: Die Wendung bezeichnet ein vollständiges Ende im Gericht, legt aber für sich allein nicht präzise fest, ob ontologische Vernichtung gemeint ist. Die Übersetzung bewahrt die starke Endgültigkeit, ohne diese Frage enger zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Wucht. Die dreifache Zornessprache und die Abfolge Sturmwind, Wolkenbruch und Hagel bleiben erhalten; die leicht ungewöhnliche Bildsprache von בקע wird im Text idiomatisch und in der Fußnote wörtlicher wiedergegeben.
