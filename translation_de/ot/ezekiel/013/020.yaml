source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י אֶל כִּסְּתוֹתֵי/כֶ֨נָה֙ אֲשֶׁ֣ר אַ֠תֵּנָה מְצֹדְד֨וֹת שָׁ֤ם אֶת הַ/נְּפָשׁוֹת֙ לְ/פֹ֣רְח֔וֹת וְ/קָרַעְתִּ֣י אֹתָ֔/ם מֵ/עַ֖ל זְרוֹעֹֽתֵי/כֶ֑ם וְ/שִׁלַּחְתִּי֙ אֶת הַ/נְּפָשׁ֔וֹת אֲשֶׁ֥ר אַתֶּ֛ם מְצֹדְד֥וֹת אֶת נְפָשִׁ֖ים לְ/פֹרְחֹֽת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against your magic bands with which you hunt the lives there like birds, and I will tear them from your arms[c][b], and I will let the lives go free—the ones you hunt like birds.'
translation:
  language: de
  text: 'Darum, so spricht Gott, der HERR: Siehe, ich bin gegen eure Zauberbinden[a], mit denen ihr dort Menschen[b] wie Vögel jagt[c]. Ich werde sie von euren Armen reißen und die Menschen freilassen, die ihr wie Vögel jagt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Kissen“, „Polster“, „Armbinden“ oder „Amulette“. Das seltene hebräische Wort bezeichnet wahrscheinlich einen rituellen Gegenstand der Prophetinnen; seine genaue Form ist unbekannt.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier „Seelen“ oder „Leben“; gemeint sind Menschen als lebende Wesen.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich etwa „zum Fliegen“ oder „die Fliegenden“. Die schwierige hebräische Form greift wahrscheinlich das Bild der Vogeljagd auf.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen herkömmliche Wiedergabe unterscheidet den Herrschertitel אֲדֹנָי vom Gottesnamen יהוה und vermeidet die schwer verständliche Doppelung „Herr HERR“.
- source_word: הִנְנִי אֶל
  choice: Seht, ich gehe gegen … vor
  rationale: Die Wendung kündigt nachdrücklich Gottes tätigen Widerstand an. „Seht“ bewahrt den hinweisenden Nachdruck, während „gegen … vorgehen“ die feindliche Ausrichtung natürlich ausdrückt.
- source_word: כִּסְּתוֹתֵיכֶנָה
  choice: eure Zauberbinden
  rationale: Das seltene Wort bezeichnet hier offenbar rituelle Gegenstände an den Armen der falschen Prophetinnen. „Zauberbinden“ gibt die wahrscheinliche Funktion wieder, ohne die genaue Gestalt als sicher hinzustellen.
- source_word: מְצֹדְדוֹת
  choice: ihr … jagt
  rationale: Das Verb gehört zum Bildfeld des Jagens beziehungsweise Fangens und erhält so das im Vers angelegte Bild von Menschen als gejagten Vögeln.
- source_word: הַנְּפָשׁוֹת / נְפָשִׁים
  choice: Menschen
  rationale: נֶפֶשׁ bezeichnet hier Menschen als lebende Wesen, die bedroht und befreit werden. „Menschen“ ist im Deutschen natürlicher als „Seelen“ und legt keine vom Kontext nicht geforderte Trennung von Leib und Seele nahe.
- source_word: לְפֹרְחוֹת / לְפֹרְחֹת
  choice: wie Vögel
  rationale: Die schwierige Form von פרח trägt die Vorstellung des Fliegens oder Flatterns. Im Zusammenhang mit dem Jagdmotiv macht „wie Vögel“ das Bild verständlich, während eine Fußnote die syntaktische Unsicherheit offenlegt.
- source_word: וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם
  choice: Ich werde sie euch von den Armen reißen
  rationale: Die Formulierung bewahrt die kraftvolle Gerichtssprache und bezieht das Pronomen am natürlichsten auf die zuvor genannten rituellen Gegenstände.
- source_word: וְשִׁלַּחְתִּי
  choice: freilassen
  rationale: Im Zusammenhang mit Jagd und Gefangenschaft bezeichnet das Verb die Befreiung der gefangenen Menschen.
- source_word: שָׁם
  choice: dort
  rationale: Das Adverb wird ausdrücklich wiedergegeben, obwohl sein genauer syntaktischer Bezug im Hebräischen nicht eindeutig ist.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang mit ritueller Bedrohung
  choice: Menschen
  alternative: Seelen; Leben
  rationale: Gemeint sind Menschen als lebende Wesen, nicht ausdrücklich körperlose Seelen. Die Wiedergabe vermeidet daher eine anthropologische Festlegung, die der Vers selbst nicht trifft.
- issue: Deutung der rituellen Gegenstände
  choice: Zauberbinden mit Hinweis auf die Unsicherheit
  alternative: Kissen; Polster; Amulette; Armbinden
  rationale: Der Kontext verbindet die Gegenstände mit der schädlichen Praxis der falschen Prophetinnen, doch ihre genaue Form bleibt unklar. Die Übersetzung benennt die wahrscheinliche rituelle Funktion und bewahrt die lexikalische Unsicherheit in der Fußnote.
- issue: Vogelbild in לְפֹרְחוֹת / לְפֹרְחֹת
  choice: Menschen werden „wie Vögel“ gejagt
  alternative: Menschen werden gejagt, „damit sie fliegen“; „die Fliegenden“
  rationale: Die hebräische Konstruktion ist schwierig. Das Vogeljagdbild passt zum Verb des Jagens und wahrt die Bildsprache, ohne aus ihr eine besondere Lehre über Seelen oder Geister abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die kraftvolle Gerichtsankündigung bleibt erhalten; seltene Kultbegriffe und die schwierige Flugmetapher werden im Text verständlich wiedergegeben und in den Fußnoten als unsicher ausgewiesen.
