  text: כְּ/שֻׁעָלִ֖ים בָּ/חֳרָב֑וֹת נְבִיאֶ֥י/ךָ יִשְׂרָאֵ֖ל הָיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/004.yaml
  text: Your prophets, O Israel, have been like foxes[a] among ruins.
translation:
  language: de
  text: Deine Propheten, Israel, waren wie Füchse[a] in den Ruinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schakale“. Das hebräische Wort kann auch allgemein einen fuchsähnlichen wild lebenden Hundeartigen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  choice: wie Füchse
  rationale: Das hebräische Wort bezeichnet Füchse oder ähnliche wild lebende Hundeartige. „Füchse“ ist die geläufige Hauptwiedergabe; die mögliche Bestimmung als Schakale wird in einer Fußnote bewahrt.
- source_word: בָּחֳרָבוֹת
  choice: in den Ruinen
  rationale: Der Plural bezeichnet zerstörte oder verödete Orte. „In den Ruinen“ gibt das Bild natürlich und anschaulich wieder.
- source_word: נְבִיאֶיךָ
  choice: deine Propheten
  rationale: Der Konstruktplural mit Suffix der zweiten Person Singular wird direkt possessiv wiedergegeben. Die Formulierung fügt nicht deutend „falschen“ hinzu.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name wird als direkte Anrede verstanden und durch Kommata kenntlich gemacht.
- source_word: הָיוּ
  choice: waren
  rationale: Das hebräische Perfekt beschreibt in der Anklage, wie diese Propheten sich erwiesen beziehungsweise verhalten haben. Das deutsche Präteritum ist hier knapp und natürlich.
theological_decisions:
- issue: Ob die verurteilten Propheten im Haupttext ausdrücklich als falsche Propheten bezeichnet werden sollen
  choice: Die hebräische Formulierung „deine Propheten“ ohne Zusatz beibehalten
  alternative: deine falschen Propheten
  rationale: Der Zusammenhang verurteilt diese Propheten eindeutig, doch der Vers selbst nennt sie lediglich „deine Propheten“. Der Zusatz „falschen“ würde die kontextuelle Bewertung in den Wortlaut eintragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Anrede „Israel“ und das knappe Vergleichsbild bleiben erhalten; altertümliche Wortstellung wird vermieden.
