source:
  edition: WLC
  text: חָ֤זוּ שָׁוְא֙ וְ/קֶ֣סֶם כָּזָ֔ב הָ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַֽ/יהוָ֖ה לֹ֣א שְׁלָחָ֑/ם וְ/יִֽחֲל֖וּ לְ/קַיֵּ֥ם דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/006.yaml
  text: They have seen falsehood and lying divination[a], those who say, ‘Declaration of Yahweh,’ though Yahweh has not sent them[b]; yet they hope for the fulfillment of the word.
translation:
  language: de
  text: 'Sie haben Trug geschaut und lügenhafte Wahrsagung – sie, die sagen: »Spruch Jahwes«[a], obwohl Jahwe sie nicht gesandt hat. Dennoch hoffen sie darauf, dass das Wort sich erfüllt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Ausspruch Jahwes« oder »Kundspruch Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Und sie warten darauf, dass das Wort bestätigt wird« oder: »dass das Wort eintrifft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּ שָׁוְא
  choice: sie haben Trug geschaut
  rationale: Das Qal-Perfekt von חזה bezeichnet prophetisches Schauen. „Trug“ gibt שָׁוְא im Kontext falscher Prophetie als etwas Täuschendes und Unwahres wieder; „geschaut“ bewahrt die prophetische Bildsprache.
- source_word: קֶסֶם כָּזָב
  choice: lügenhafte Wahrsagung
  rationale: קֶסֶם bezeichnet Wahrsagung, כָּזָב kennzeichnet sie als lügnerisch beziehungsweise falsch. „Lügenhaft“ erhält sowohl die Unwahrheit als auch den moralischen Vorwurf.
- source_word: הָאֹמְרִים
  choice: sie, die sagen
  rationale: Der substantivierte Partizipialausdruck kennzeichnet die betreffenden falschen Propheten durch ihr wiederholtes Reden.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: „Spruch“ ist eine knappe, würdevolle Wiedergabe der festen prophetischen Formel נְאֻם; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לֹא שְׁלָחָם
  choice: Jahwe sie nicht gesandt hat
  rationale: Die negierte Perfektform mit Objektsuffix bestreitet ihre göttliche Beauftragung. Das deutsche Perfekt passt zur fortdauernden Bedeutung dieser fehlenden Sendung.
- source_word: וְיִחֲלוּ
  choice: Dennoch hoffen sie darauf
  rationale: יחל kann „warten“ oder „hoffen“ bedeuten. „Hoffen“ erfasst hier ihre Erwartung, dass ihre Botschaft eintreffen werde; „dennoch“ macht den im Zusammenhang liegenden Gegensatz deutlich, obwohl ו formal nur mit Waw verbunden ist.
- source_word: לְקַיֵּם דָּבָר
  choice: dass das Wort sich erfüllt
  rationale: Die Wendung bezeichnet das Feststehen beziehungsweise Eintreffen eines Wortes. Die Formulierung lässt offen, ob „das Wort“ als einzelne Aussage oder als ihre prophetische Botschaft verstanden wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Von falschen Propheten gebrauchte Formel נְאֻם יְהוָה
  choice: Spruch Jahwes
  alternative: Ausspruch Jahwes
  rationale: Die feste prophetische Formel bleibt erkennbar erhalten. So tritt die Ironie hervor, dass die Sprecher echte Offenbarungssprache beanspruchen, ohne von Jahwe gesandt zu sein.
- issue: Erwartung der falschen Propheten in וְיִחֲלוּ לְקַיֵּם דָּבָר
  choice: Dennoch hoffen sie darauf, dass das Wort sich erfüllt
  alternative: Und sie warten darauf, dass das Wort bestätigt wird
  rationale: Die gewählte Fassung wahrt die Erwartung eines Eintreffens, ohne zu entscheiden, ob das Wort durch Erfüllung oder Bestätigung „zum Stehen kommt“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Trug geschaut“ bewahrt bewusst die prophetische Bildsprache, während der übrige Satz für heutige Leser flüssig formuliert ist. Die ungewöhnliche Reihung „Trug … und lügenhafte Wahrsagung“ folgt der knappen hebräischen Anklage, ohne eine nicht ausdrücklich genannte Tätigkeit hinzuzufügen.
