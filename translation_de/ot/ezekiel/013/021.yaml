id: EZK.13.21
reference: Ezekiel 13:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/קָרַעְתִּ֞י אֶת מִסְפְּחֹֽתֵי/כֶ֗ם וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וְ/לֹֽא יִהְי֥וּ ע֛וֹד בְּ/יֶדְ/כֶ֖ן לִ/מְצוּדָ֑ה וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/021.yaml
  text: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
translation:
  language: de
  text: Ich werde eure Zauberbänder[a] zerreißen und mein Volk aus eurer Hand retten. Sie werden nicht länger als Beute[b] in eurer Hand sein. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bänder“, „Amulette“ oder möglicherweise „Schleier“. Das hebräische Wort ist selten; was genau damit bezeichnet wird, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Jagen“ oder „zum Fangen“. Der hebräische Ausdruck beschreibt wahrscheinlich Menschen, die einem räuberischen Zugriff ausgeliefert sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַעְתִּי
  choice: ich werde … zerreißen
  rationale: Das Verb קרע bedeutet gewöhnlich „zerreißen“ oder „auseinanderreißen“. Beim genannten Gegenstand bezeichnet es dessen gewaltsame Beseitigung; das Deutsche benötigt nicht zwingend den Zusatz „ab-“.
- source_word: מִסְפְּחֹתֵיכֶם
  choice: eure Zauberbänder
  rationale: Das seltene Wort bezeichnet im Kontext offenbar von den angesprochenen Frauen verwendete Gegenstände mit magischer Funktion. „Zauberbänder“ gibt diese Funktion wieder, ohne die genaue Gestalt als Amulett, Schleier oder Binde festzulegen.
- source_word: הִצַּלְתִּי
  choice: retten
  rationale: נצל bezeichnet hier die Befreiung aus fremder Gewalt. „Retten“ ist im modernen Deutsch natürlich und bewahrt den konkreten Befreiungssinn.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Dies entspricht unmittelbar der geläufigen Bundesformel.
- source_word: מִיֶּדְכֶן / בְּיֶדְכֶן
  choice: aus eurer Hand / in eurer Hand
  rationale: Die Hand steht bildlich für Macht oder Verfügungsgewalt. Die wörtliche Wiedergabe ist verständlich und erhält die Wiederholung des Hebräischen.
- source_word: לִמְצוּדָה
  choice: als Beute
  rationale: Der Ausdruck gehört zum Bedeutungsfeld von Jagd, Fang und Erbeutung. „Als Beute“ passt syntaktisch zu „in eurer Hand“ und vermittelt den Gedanken, dass die Menschen nicht länger ihrer Gewalt und ihrem Zugriff ausgesetzt sein werden.
- source_word: וִידַעְתֶּן
  choice: Dann werdet ihr erkennen
  rationale: Die Form ist feminin plural und richtet sich weiter an die Frauen. „Dann“ bringt die Folgewirkung der angekündigten Rettung zum Ausdruck; „erkennen“ eignet sich für das formelhafte Wissen um Jahwes Identität und Wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH; seine Wiedergabe als „Jahwe“ bewahrt die Unterscheidung zwischen Name und Titel.
- issue: Charakterisierung der von den Frauen verwendeten Gegenstände
  choice: Zauberbänder
  alternative: Bänder; Amulette; Schleier
  rationale: Der Zusammenhang in Ezechiel 13 weist auf magisch-manipulative Praktiken hin. „Zauber-“ bezeichnet die kontextuelle Funktion, während eine Fußnote die Unsicherheit über die konkrete Art des Gegenstands offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze erhalten die Eindringlichkeit der Gerichts- und Rettungsankündigung. Die feminine Pluralform der Anrede wird durch „eure“ und „werdet ihr“ im unmittelbaren Kontext nicht morphologisch sichtbar, ergibt sich aber aus dem Abschnitt; eine erklärende Ergänzung im Vers wurde vermieden.
