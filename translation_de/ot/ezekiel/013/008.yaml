source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן דַּבֶּרְ/כֶ֣ם שָׁ֔וְא וַ/חֲזִיתֶ֖ם כָּזָ֑ב לָ/כֵן֙ הִנְ/נִ֣י אֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/008.yaml
  text: 'Therefore thus says the Lord GOD: Because you have spoken falsehood and seen a lie[a], therefore behold, I am against you, declares the Lord GOD.'
translation:
  language: de
  text: 'Darum spricht der Herr Yahweh: Weil ihr Unwahres geredet und eine Lüge geschaut habt, darum seht: Ich bin gegen euch – Ausspruch des Herrn Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt an beiden Stellen den kausalen Folgerungsmarker knapp und deutlich wieder.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Entspricht der festen prophetischen Botenformel und klingt im Deutschen würdig und geläufig.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Bewahrt sowohl den Herrschaftstitel אֲדֹנָי als auch den im Ausgangstext stehenden Gottesnamen יהוה, ohne beides zu einem einzigen Titel einzuebnen.
- source_word: יַעַן דַּבֶּרְכֶם
  choice: Weil ihr ... geredet
  rationale: יַעַן leitet den Grund des Gerichts ein; die finite deutsche Form gibt die hebräische Konstruktion natürlich wieder.
- source_word: שָׁוְא
  choice: Unwahres
  rationale: Bezeichnet hier nicht bloß Nichtigkeit, sondern den unwahren Inhalt der prophetischen Rede; die substantivierte Form bleibt idiomatisch.
- source_word: וַחֲזִיתֶם כָּזָב
  choice: und Lüge geschaut habt
  rationale: Bewahrt das visionäre Verb חזה und die markante Verbindung mit כָּזָב, ohne sie deutend zu 'falsch prophezeit' aufzulösen.
- source_word: הִנְנִי אֲלֵיכֶם
  choice: Seht, ich bin gegen euch
  rationale: Gibt die feierliche Aufmerksamkeitsformel הִנְנִי und die göttliche Gegnerschaft klar wieder.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Bewahrt den nominalen Charakter der prophetischen Beglaubigungsformel und ihren feierlichen Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und macht den im hebräischen Text vorhandenen Gottesnamen sichtbar.
- issue: Art der falschen Vision
  choice: Lüge geschaut
  alternative: eine Lüge gesehen; falsch geweissagt
  rationale: Die ungewöhnliche Spannung zwischen visionärem Schauen und Lüge bleibt erhalten; 'falsch geweissagt' würde die Aussage stärker auslegen als der Wortlaut.
translation_notes:
  register: Moderne, würdige prophetische Sprache. Die doppelte kausale Rahmung durch 'Darum ... weil ... darum' bleibt erhalten. 'Seht' ist gegenüber dem altertümlichen 'Siehe' verständlicher, wahrt aber den feierlichen Warnruf.
