  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ה֖וֹי עַל הַ/נְּבִיאִ֣ים הַ/נְּבָלִ֑ים אֲשֶׁ֥ר הֹלְכִ֛ים אַחַ֥ר רוּחָ֖/ם וּ/לְ/בִלְתִּ֥י רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/003.yaml
  text: 'Thus says the Lord GOD: Woe to the foolish prophets[a], who follow their own spirit and have seen nothing.'
translation:
  language: de
  text: 'So spricht Yahweh, der Herr: Wehe den törichten Propheten, die ihrem eigenen Geist folgen und nichts gesehen haben!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Gängige, würdige Wiedergabe der prophetischen Botenformel im Deutschen; das hebräische Perfekt wird in dieser festen Formel sachgerecht präsentisch wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den im Ausgangstext stehenden Gottesnamen יהוה wieder und vermeidet, beide Elemente zu einem einzigen Titel zu verschmelzen.
- source_word: הוֹי עַל
  choice: Wehe den
  rationale: Bewahrt den Charakter eines prophetischen Wehe- und Gerichtsrufs und klingt im Deutschen natürlich.
- source_word: הַנְּבִיאִים הַנְּבָלִים
  choice: den törichten Propheten
  rationale: נבל bezeichnet hier nicht bloß geringe Intelligenz, sondern sittliche und geistliche Torheit; „töricht“ erhält diesen wertenden prophetischen Sinn.
- source_word: אֲשֶׁר הֹלְכִים אַחַר רוּחָם
  choice: die ihrem eigenen Geist folgen
  rationale: Das Idiom „hinter etwas hergehen“ bedeutet „folgen“. רוּחָם bleibt mit „ihrem eigenen Geist“ bewusst nahe am Hebräischen und bezeichnet ihre selbst erzeugte innere Eingebung.
- source_word: וּלְבִלְתִּי רָאוּ
  choice: ohne etwas gesehen zu haben
  rationale: Gibt die ungewöhnlich knappe hebräische Fügung idiomatisch wieder und wahrt den Bezug auf fehlendes prophetisches Schauen, ohne das Objekt ausdrücklich zu ergänzen.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form macht sowohl den Titel als auch den Eigennamen sichtbar. Die traditionelle Ersatzlesung „GOTT, der Herr“ wäre geläufiger, verdeckt jedoch den im hebräischen Text ausdrücklich vorhandenen Namen.
- issue: Deutung von רוּחָם
  choice: ihrem eigenen Geist
  alternative: ihrem eigenen Antrieb
  rationale: „Geist“ bewahrt die Mehrdeutigkeit von רוּחַ und den Kontrast zwischen echter prophetischer Eingebung und selbst erzeugtem Impuls. „Antrieb“ wäre erklärender, würde die Bild- und Begriffsspannung aber verengen.
- issue: Verhältnis des letzten Satzglieds zum vorhergehenden
  choice: ohne etwas gesehen zu haben
  alternative: und sie haben nichts gesehen
  rationale: Die Präposition לְ mit בִּלְתִּי legt eine Umstandsangabe nahe. Die Übersetzung lässt offen, ob damit vor allem fehlende Vision oder die Grundlosigkeit ihres Auftretens betont wird.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Syntax ist knapp und anklagend; „töricht“ und „Geist“ halten die ethisch-theologische sowie lexikalische Spannung des Hebräischen fest.
