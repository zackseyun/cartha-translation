source:
  edition: WLC
  text: וְ/הָ֨רַסְתִּ֜י אֶת הַ/קִּ֨יר אֲשֶׁר טַחְתֶּ֥ם תָּפֵ֛ל וְ/הִגַּעְתִּ֥י/הוּ אֶל הָ/אָ֖רֶץ וְ/נִגְלָ֣ה יְסֹד֑/וֹ וְ/נָֽפְלָה֙ וּ/כְלִיתֶ֣ם בְּ/תוֹכָ֔/הּ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/014.yaml
  text: I will tear down the wall that you plastered with whitewash[a], and bring it down to the ground, so that its foundation is laid bare. It will fall, and you will perish within it. Then you will know that I am Yahweh.
translation:
  language: de
  text: Ich reiße die Mauer nieder, die ihr mit Tünche[a] überzogen habt, und stürze sie zu Boden, sodass ihr Fundament bloßgelegt wird. Sie wird einstürzen, und ihr werdet in ihr umkommen. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit untauglichem Mörtel“. Das hebräische Wort kann eine wertlose oder unbrauchbare Beschichtung bezeichnen; hier geht es um eine oberflächliche, trügerische Verdeckung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרַסְתִּי
  choice: Ich reiße … nieder
  rationale: הרס bezeichnet das Niederreißen oder Zerstören eines Bauwerks. „niederreißen“ bewahrt das konkrete, kraftvolle Bild.
- source_word: הַקִּיר
  choice: die Mauer
  rationale: קִיר bezeichnet hier eine Mauer. Das konkrete Bild der prophetischen Anklage bleibt erhalten.
- source_word: טַחְתֶּם תָּפֵל
  choice: die ihr mit Tünche verputzt habt
  rationale: טוח bezeichnet das Verputzen oder Bestreichen; תָּפֵל kann eine wertlose, untaugliche Beschichtung bzw. schlechten Mörtel bezeichnen. „Tünche“ vermittelt im Kontext die oberflächliche und trügerische Verdeckung, während die Alternative in der Fußnote erhalten bleibt.
- source_word: וְהִגַּעְתִּיהוּ אֶל־הָאָרֶץ
  choice: und stürze sie zu Boden
  rationale: Die Hifil-Form von נגע mit „zur Erde“ beschreibt, dass die Mauer bis auf den Boden gebracht wird. „zu Boden stürzen“ ist im Deutschen natürlich und macht die Zerstörung deutlich.
- source_word: וְנִגְלָה יְסֹדוֹ
  choice: sodass ihr Fundament bloßgelegt wird
  rationale: Die passive Form von גלה bezeichnet das Sichtbar- oder Freigelegtwerden. „bloßgelegt“ bewahrt das Bild des enthüllten Fundaments.
- source_word: וְנָפְלָה
  choice: Sie wird einstürzen
  rationale: Das feminine Singularverb bezieht sich auf die Mauer. „einstürzen“ bezeichnet bei einer Mauer präziser als das allgemeinere „fallen“ den Zusammenbruch.
- source_word: וּכְלִיתֶם בְּתוֹכָהּ
  choice: und ihr werdet in ihr umkommen
  rationale: כלה bezeichnet hier das Zugrundegehen; בְּתוֹכָהּ bewahrt mit „in ihr“ die räumliche Aussage, ohne das Bild auszuweiten.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Dann werdet ihr erkennen, dass ich Jahwe bin
  rationale: Die wiederkehrende Erkenntnisformel wird klar und würdig wiedergegeben. „Dann“ drückt den Folgezusammenhang aus; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von בְּתוֹכָהּ
  choice: in ihr
  alternative: in ihrer Mitte
  rationale: Das feminine Suffix bezieht sich grammatisch auf die Mauer. Die knappe Wiedergabe „in ihr“ erhält sowohl den Bezug als auch die räumliche Spannung des Bildes, ohne näher zu erklären, wie Menschen sich innerhalb einer Mauer befinden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die kurzen Hauptsätze und das konkrete Mauerbild wurden bewahrt; die echte lexikalische Mehrdeutigkeit von תָּפֵל wird durch die Fußnote offengehalten.
