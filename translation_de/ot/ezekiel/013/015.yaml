base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/015.yaml
  text: So I will spend my wrath against the wall and against those who plastered it with whitewash[a], and I will say to you, ‘The wall is no more, and those who plastered it are no more,’
translation:
  language: de
  text: 'So werde ich meinen Zorn an der Mauer und an denen, die sie mit Tünche[a] bestrichen haben, vollständig auslassen und zu euch sagen: »Die Mauer ist nicht mehr da, und auch die, die sie bestrichen haben, sind nicht mehr da.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit minderwertigem Mörtel. Das hebräische Wort kann eine untaugliche oder oberflächliche Beschichtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלֵּיתִי אֶת־חֲמָתִי
  choice: So werde ich meinen Zorn … vollenden
  rationale: כלה im Piel bezeichnet das vollständige Zu-Ende-Bringen. In Verbindung mit חֲמָה besagt die Wendung, dass Gottes Zorn vollständig zur Auswirkung kommt. »Vollenden« wahrt diesen Aspekt, ohne eine im Hebräischen nicht ausdrücklich genannte Ausgießungsmetapher einzuführen.
- source_word: בַּקִּיר וּבַטָּחִים אֹתוֹ
  choice: an der Mauer und an denen, die sie … bestrichen haben
  rationale: Die Präposition בְּ kennzeichnet hier die Ziele des Zorngerichts; im Deutschen ist »den Zorn an jemandem oder etwas vollenden« eine passende Entsprechung. טוח bedeutet bestreichen, verputzen oder beschichten.
- source_word: תָּפֵל
  choice: Tünche
  rationale: Das Wort bezeichnet im Kontext eine untaugliche beziehungsweise oberflächliche Beschichtung. »Tünche« erhält das konkrete Bild einer äußerlich überdeckten, aber unsicheren Mauer; die mögliche Deutung als minderwertiger oder unvermischter Mörtel bleibt in der Fußnote erhalten.
- source_word: אֵין הַקִּיר וְאֵין הַטָּחִים אֹתוֹ
  choice: Die Mauer ist nicht mehr da, und auch die, die sie bestrichen haben, sind nicht mehr da
  rationale: אֵין drückt Nichtvorhandensein aus. Die wiederholte Formulierung gibt die Parallelität des Hebräischen verständlich und nachdrücklich wieder.
theological_decisions:
- issue: Bildsprache von Mauer und Tünche
  choice: Das konkrete Bild bleibt im Haupttext ohne ausdrückliche Deutung stehen.
  alternative: Die Mauer und ihre Beschichtung unmittelbar als falsche prophetische Heilszusagen erklären.
  rationale: Der Zusammenhang erschließt die prophetische Bedeutung, doch der Vers selbst formuliert das Gericht weiterhin bildhaft. Eine Ausdeutung im Haupttext würde über seinen Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung am Versende wurde bewusst beibehalten; »auch« macht die parallele Steigerung im Deutschen deutlich.
