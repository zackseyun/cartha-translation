source:
  edition: WLC
  text: לֹ֤א עֲלִיתֶם֙ בַּ/פְּרָצ֔וֹת וַ/תִּגְדְּר֥וּ גָדֵ֖ר עַל בֵּ֣ית יִשְׂרָאֵ֑ל לַ/עֲמֹ֥ד בַּ/מִּלְחָמָ֖ה בְּ/י֥וֹם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/005.yaml
  text: You have not gone up into the breaches or built up a wall for the house of Israel[a], so that it might stand in the battle on the day of Yahweh.
translation:
  language: de
  text: Ihr seid nicht zu den Breschen hinaufgestiegen und habt keine Mauer für das Haus Israel errichtet, damit es in der Schlacht am Tag Jahwes standhalten kann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלִיתֶם
  choice: seid … gestiegen
  rationale: Bewahrt die konkrete Bedeutung von עלה („hinaufsteigen“) und das Bild, dass Verteidiger in gefährdete Mauerlücken treten.
- source_word: בַּפְּרָצוֹת
  choice: in die Breschen
  rationale: פרצות bezeichnet Durchbrüche oder Lücken in einer Befestigung; „Breschen“ erhält das militärische Mauerbild präzise.
- source_word: וַתִּגְדְּרוּ גָדֵר
  choice: habt keine Mauer … errichtet
  rationale: Die Verbindung von stammverwandtem Verb und Substantiv bezeichnet das Errichten einer schützenden Einfriedung; im Kontext ist „Mauer“ stärker und passender als „Zaun“.
- source_word: עַל בֵּית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: עַל lässt sich hier im Sinn schützenden Handelns zugunsten Israels verstehen. „Für“ bewahrt diese Beziehung, ohne räumlich eindeutig „um … herum“ festzulegen.
- source_word: לַעֲמֹד
  choice: damit es … standhalten kann
  rationale: Der Infinitiv bezeichnet den Zweck. „Standhalten“ gibt im Kampfzusammenhang die Bedeutung von עמד natürlicher wieder als das bloße „stehen“; das Pronomen bezieht sich auf das kollektiv und grammatisch singularische „Haus Israel“.
- source_word: בַּמִּלְחָמָה
  choice: in der Schlacht
  rationale: Bewahrt das konkrete Bild der bevorstehenden kriegerischen Auseinandersetzung.
- source_word: בְּיוֹם יְהוָה
  choice: am Tag Jahwes
  rationale: Gibt die prophetische Wendung knapp und idiomatisch wieder und bewahrt den Gottesnamen als Eigennamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige wissenschaftliche Wiedergabe des Tetragramms bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Militärisches Mauerbild als Darstellung prophetischer Verantwortung
  choice: Die konkreten Bilder von Breschen, Mauer, Schlacht und dem Tag Jahwes bleiben erhalten.
  alternative: 'Abstrakte Paraphrase: „Ihr habt Israel nicht geschützt, damit es das Gericht übersteht.“'
  rationale: Der hebräische Text formuliert die Anklage bildhaft. Eine abstrakte Wiedergabe würde die prophetische Metapher auslegen, statt sie den Lesenden zu vermitteln.
- issue: Bezug und Sinn von לַעֲמֹד
  choice: „damit es … standhalten kann“ bezieht sich auf das Haus Israel.
  alternative: 'Unpersönlich: „um in der Schlacht standzuhalten“; oder Bezug auf die Mauer.'
  rationale: Der kollektiv-singularische Ausdruck „Haus Israel“ bietet den naheliegenden Bezug. Die deutsche Formulierung wahrt den Zweckcharakter und vermeidet eine weitergehende dogmatische Deutung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ bewahrt den Eigennamen und ist im Deutschen die übliche Transliteration; ein Titel oder die Form „Jehova“ wäre textlich beziehungsweise sprachgeschichtlich weniger unmittelbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, klingt aber natürlich. „Breschen“ und „Schlacht“ sichern das zusammenhängende Befestigungs- und Kampfbild; „Haus Israel“ bewahrt die traditionelle, im Deutschen verständliche Kollektivbezeichnung.
