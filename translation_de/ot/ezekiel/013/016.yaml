source:
  edition: WLC
  text: נְבִיאֵ֣י יִשְׂרָאֵ֗ל הַֽ/נִבְּאִים֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַ/חֹזִ֥ים לָ֖/הּ חֲז֣וֹן שָׁלֹ֑ם וְ/אֵ֣ין שָׁלֹ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/016.yaml
  text: the prophets of Israel who prophesy concerning Jerusalem and who see for her a vision of peace[a], when there is no peace, declares the Lord GOD.
translation:
  language: de
  text: die Propheten Israels, die über Jerusalem weissagen und für die Stadt eine Vision des Friedens[a] schauen – und doch ist kein Friede da. Ausspruch des Herrn Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Vision des Wohlergehens“. Das hebräische Wort schalom kann Frieden, Unversehrtheit und Wohlergehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי יִשְׂרָאֵל
  choice: die Propheten Israels
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die zu Israel gehörenden Propheten; die natürliche deutsche Genitivkonstruktion bewahrt dies.
- source_word: הַנִּבְּאִים אֶל יְרוּשָׁלַםִ
  choice: die über Jerusalem weissagen
  rationale: Das Partizip beschreibt ihre fortdauernde Tätigkeit. אֶל bezeichnet hier bei einem Verkündigungsverb den Bezug beziehungsweise die Zielrichtung der Botschaft; „über Jerusalem“ ist im Deutschen eindeutig und natürlich.
- source_word: וְהַחֹזִים לָהּ
  choice: und für die Stadt … schauen
  rationale: חזה bezeichnet prophetisches Schauen. „Für die Stadt“ gibt den Dativ לָהּ wieder und macht den Rückbezug auf Jerusalem im Deutschen klar, wo der Stadtname grammatisch sächlich ist.
- source_word: חֲזוֹן שָׁלוֹם
  choice: eine Vision des Friedens
  rationale: Die substantivische Fügung bewahrt sowohl den Visionsbegriff als auch die bewusste Wiederholung von שָׁלוֹם im folgenden Gegensatz.
- source_word: וְאֵין שָׁלוֹם
  choice: obwohl kein Friede da ist
  rationale: Die konzessive Formulierung bringt den scharfen Gegensatz zwischen der behaupteten Vision und der tatsächlichen Lage natürlich zum Ausdruck, ohne den Inhalt zu erweitern.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: „Ausspruch“ gibt die feste prophetische Formel knapp und würdevoll wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „Jahwe“ den im hebräischen Text stehenden Gottesnamen unterscheidbar erhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung lässt sowohl den Titel אֲדֹנָי als auch den Eigennamen יהוה sichtbar und vermeidet, beide Bestandteile zu einem einzigen Titel zu verschmelzen.
- issue: Inhalt von שָׁלוֹם
  choice: Friede
  alternative: Wohlergehen
  rationale: „Friede“ wahrt den unmittelbaren rhetorischen Gegensatz zwischen der Friedensvision und der Aussage, dass kein Friede da ist; die größere Bedeutungsbreite wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die nominale Schlussformel „Ausspruch des Herrn Jahwe“ bewahrt den prophetischen Ton. „Für die Stadt“ vermeidet wegen des grammatischen Geschlechts von „Jerusalem“ einen missverständlichen weiblichen Pronomenbezug.
