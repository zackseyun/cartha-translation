  terminology: „Propheten Israels“, „weissagen“, „Vision“, „Friede“ und „Ausspruch“ passen zum prophetischen Sprachgebrauch. „Herrn Jahwe“ erhält sowohl אֲדֹנָי als auch den Gottesnamen יהוה; „Jahwe“ ist im modernen deutschen Bibeldeutsch eine sachgerechte Form. Die Fußnote gibt die semantische Breite von שָׁלוֹם angemessen wieder und der Anker steht korrekt bei „Friedens“.
