id: EZK.13.2
reference: Ezekiel 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵ֛א אֶל נְבִיאֵ֥י יִשְׂרָאֵ֖ל הַ/נִּבָּאִ֑ים וְ/אָֽמַרְתָּ֙ לִ/נְבִיאֵ֣י מִ/לִּבָּ֔/ם שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/002.yaml
  text: Son of man[a], prophesy against the prophets of Israel who are prophesying, and say to those who prophesy from their own hearts, ‘Hear the word of Yahweh.’
translation:
  language: de
  text: 'Menschensohn, weissage gegen die Propheten Israels, die weissagen, und sage zu denen, die aus ihrem eigenen Herzen weissagen[a]: »Hört das Wort Jahwes!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »zu den Propheten aus ihrem Herzen«. Gemeint ist, dass ihre Botschaft aus ihnen selbst und nicht von Jahwe stammt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede an Ezechiel wird als etablierte, prägnante deutsche Wendung wiedergegeben; sie bewahrt das hebräische Bild und die literarische Kontinuität des Buches.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Der Niphal-Imperativ von נבא bezeichnet prophetisches Reden; »weissage« gibt Form und Aufforderungscharakter direkt wieder.
- source_word: אֶל
  choice: gegen
  rationale: Im Zusammenhang des folgenden Gerichtswortes hat die Präposition adversative Kraft. »Gegen« macht die Stoßrichtung im Deutschen klar, ohne den Inhalt zu erweitern.
- source_word: נְבִיאֵי יִשְׂרָאֵל
  choice: die Propheten Israels
  rationale: Die Konstruktion folgt eng dem hebräischen Ausdruck und lässt die Ironie bestehen, dass diese zu Israel gehörenden Propheten von Jahwe verurteilt werden.
- source_word: הַנִּבָּאִים
  choice: die weissagen
  rationale: Das Partizip beschreibt ein gegenwärtiges beziehungsweise kennzeichnendes Tun. Der Relativsatz klingt im Deutschen natürlich und hält die Wiederholung des hebräischen Verbs fest.
- source_word: וְאָמַרְתָּ
  choice: und sage
  rationale: Das Waw mit Perfekt setzt die Befehlsfolge fort; der deutsche Imperativ gibt diese Funktion knapp und idiomatisch wieder.
- source_word: לִנְבִיאֵי מִלִּבָּם
  choice: zu denen, die aus ihrem eigenen Herzen weissagen
  rationale: Die verbale Wiedergabe verdeutlicht idiomatisch, dass ihre Botschaft aus ihnen selbst stammt, bewahrt aber das hebräische Bild des Herzens als Quelle.
- source_word: לֵב/לֵבָב (in מִלִּבָּם)
  choice: Herzen
  rationale: »Herz« kann im Hebräischen Denken, Absicht und inneres Selbst umfassen. Die bildhafte Ausdrucksweise bleibt erhalten, statt sie einengend mit »Verstand« zu erklären.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Pluralimperativ fordert die Propheten zu aufmerksamer Aufnahme auf; »Hört« bewahrt den knappen prophetischen Ton.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel bleibt erhalten. »Wort« sichert die literarische Verbindung zu vergleichbaren Formeln im Alten Testament.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von אֶל im Kontext eines Gerichtswortes
  choice: »gegen«
  alternative: »zu«
  rationale: Obwohl אֶל häufig »zu« bedeutet, eröffnet der Vers eine Anklage gegen falsche Propheten. »Gegen« gibt diese kontextuelle Stoßrichtung wieder.
- issue: Quelle der Botschaft der verurteilten Propheten
  choice: »die aus ihrem eigenen Herzen weissagen«
  alternative: »die Propheten ihres eigenen Herzens«
  rationale: Die Formulierung macht verständlich, dass die Botschaft in ihnen selbst entsteht und nicht von Jahwe kommt, ohne die Bildsprache des Herzens aufzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Wiederholung. Der Fußnotenmarker steht bei der Wendung, die er tatsächlich erläutert.
