id: EZK.13.7
reference: Ezekiel 13:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/ל֤וֹא מַֽחֲזֵה שָׁוְא֙ חֲזִיתֶ֔ם וּ/מִקְסַ֥ם כָּזָ֖ב אֲמַרְתֶּ֑ם וְ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַ/אֲנִ֖י לֹ֥א דִבַּֽרְתִּי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/007.yaml
  text: Have you not seen a false vision and spoken a lying divination[a], when you say, ‘Declares Yahweh,’ though I have not spoken?
translation:
  language: de
  text: 'Habt ihr nicht eine trügerische Vision gesehen und eine lügnerische Wahrsagung[a] ausgesprochen, wenn ihr sagt: »Ausspruch Jahwes«, obwohl ich nicht geredet habe?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »eine nichtige Vision« und »eine falsche Wahrsagung«. Die hebräischen Begriffe verbinden hier die Vorstellungen von Leere beziehungsweise Nichtigkeit und Falschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Habt ihr nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: מַחֲזֵה שָׁוְא
  choice: eine trügerische Vision
  rationale: מַחֲזֶה bezeichnet eine Vision; שָׁוְא kann Falschheit, Nichtigkeit oder Leere ausdrücken. »Trügerisch« passt zum Kontext vorgetäuschter Offenbarung, ohne den Bedeutungsaspekt der Irreführung zu verlieren.
- source_word: חֲזִיתֶם
  choice: gesehen
  rationale: Gibt das Qal Perfekt 2. Person Plural schlicht und natürlich wieder.
- source_word: וּמִקְסַם כָּזָב
  choice: und eine lügnerische Wahrsagung
  rationale: מִקְסָם bezeichnet Wahrsagung beziehungsweise einen durch Wahrsagung gewonnenen Spruch; כָּזָב kennzeichnet ihn als Lüge oder Falschheit.
- source_word: אֲמַרְתֶּם
  choice: ausgesprochen
  rationale: Verbindet das Verb idiomatisch mit »Wahrsagung« und vermeidet eine unnötige Wiederholung von »sagen«.
- source_word: וְאֹמְרִים
  choice: wenn ihr sagt
  rationale: Gibt die begleitende beziehungsweise fortdauernde Handlung des Partizips in natürlichem Deutsch wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt die feste prophetische Botenformel als nominale Wendung und gibt den Gottesnamen ausdrücklich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als Gottesnamen wieder; die deutsche Form »Jahwe« ist geläufig und entspricht der Zielvariante.
- source_word: וַאֲנִי לֹא דִבַּרְתִּי
  choice: obwohl ich nicht geredet habe
  rationale: Bringt den scharfen Gegensatz zwischen ihrem Anspruch und Gottes tatsächlichem Reden natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den Charakter als Eigenname, während »der HERR« die traditionelle Ersatzlesung wiedergibt.
- issue: Art der behaupteten Offenbarung
  choice: Vision und Wahrsagung als falsche Offenbarungsansprüche beibehalten
  alternative: beide Ausdrücke allgemein als falsche Prophetie zusammenfassen
  rationale: Der Ausgangstext unterscheidet מַחֲזֶה und מִקְסָם. Diese Spannung wird nicht konfessionell aufgelöst oder eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die harte Gegenüberstellung zwischen dem behaupteten »Ausspruch Jahwes« und Gottes Verneinung bleiben erhalten.
