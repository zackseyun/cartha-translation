  text: וְ/הִנֵּ֖ה נָפַ֣ל הַ/קִּ֑יר הֲ/לוֹא֙ יֵאָמֵ֣ר אֲלֵי/כֶ֔ם אַיֵּ֥ה הַ/טִּ֖יחַ אֲשֶׁ֥ר טַחְתֶּֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/012.yaml
  text: And look[a], when the wall falls, will it not be said to you, ‘Where is the plaster with which you plastered it?’
translation:
  language: de
  text: 'Seht: Wenn die Mauer einstürzt, wird man euch dann nicht sagen: »Wo ist der Putz, den ihr aufgetragen habt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und wenn dann
  rationale: הִנֵּה lenkt die Aufmerksamkeit lebhaft auf das angekündigte Geschehen. Im Deutschen gibt »dann« innerhalb des mit »wenn« formulierten Zukunftsszenarios diese hinweisende Funktion natürlich wieder; ein wörtliches »siehe« wäre im modernen Standarddeutsch markiert und schwerfällig.
- source_word: נָפַל הַקִּיר
  choice: die Mauer einstürzt
  rationale: Das morphologische Perfekt נָפַל steht hier in einem vorgestellten zukünftigen Szenario. »Einstürzt« gibt den kontextuellen Zusammenbruch präziser wieder als das allgemeinere »fällt«.
- source_word: הֲלוֹא יֵאָמֵר אֲלֵיכֶם
  choice: wird man euch nicht fragen
  rationale: הֲלוֹא kennzeichnet eine rhetorische Frage, die Zustimmung erwartet. Das unpersönliche deutsche »man« entspricht dem hebräischen Passiv יֵאָמֵר idiomatisch; »fragen« passt zur folgenden direkten Frage, ohne einen bestimmten Sprecher hinzuzufügen.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die direkte Orts- beziehungsweise Verbleibsfrage bleibt erhalten und wird nicht deutend zu »Was ist daraus geworden?« erweitert.
- source_word: הַטִּיחַ
  choice: der Putz
  rationale: טִיחַ bezeichnet das auf eine Wand aufgetragene Beschichtungsmaterial. »Putz« ist im modernen Deutschen sachlich, knapp und im Baukontext natürlich; die stärker deutende Alternative »Tünche« wird in der Fußnote bewahrt.
- source_word: אֲשֶׁר טַחְתֶּם
  choice: den ihr aufgetragen habt
  rationale: Die Formulierung gibt das Aufbringen des Beschichtungsmaterials idiomatisch wieder. Das Objekt, die Mauer, ist aus dem Kontext eindeutig, sodass kein zusätzliches Pronomen nötig ist.
theological_decisions:
- issue: Täuschender Charakter der Wandbeschichtung
  choice: Im Haupttext steht der sachliche Ausdruck »Putz«; die mögliche Wertung als »Tünche« erscheint in der Fußnote.
  alternative: »Tünche, mit der ihr sie übertüncht habt«
  rationale: Der Vers spricht konkret von einer aufgetragenen Beschichtung, während der größere Zusammenhang ihre trügerische Funktion erkennen lässt. Die Übersetzung hält Bild und Deutung auseinander, ohne die prophetische Kritik abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt direkt und pointiert; »Putz« wahrt das konkrete Baubild, während die Fußnote die kontextuell mögliche Wiedergabe »Tünche« dokumentiert.
