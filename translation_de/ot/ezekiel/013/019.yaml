id: EZK.13.19
reference: Ezekiel 13:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תְּחַלֶּלְ֨נָה אֹתִ֜/י אֶל עַמִּ֗/י בְּ/שַׁעֲלֵ֣י שְׂעֹרִים֮ וּ/בִ/פְת֣וֹתֵי לֶחֶם֒ לְ/הָמִ֤ית נְפָשׁוֹת֙ אֲשֶׁ֣ר לֹֽא תְמוּתֶ֔נָה וּ/לְ/חַיּ֥וֹת נְפָשׁ֖וֹת אֲשֶׁ֣ר לֹא תִֽחְיֶ֑ינָה בְּ/כַ֨זֶּבְ/כֶ֔ם לְ/עַמִּ֖/י שֹׁמְעֵ֥י כָזָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/019.yaml
  text: And you have profaned me among my people for handfuls of barley and for pieces of bread[a], putting to death persons who should not die and keeping alive persons who should not live, by your lying to my people[b], who listen to lies.
translation:
  language: de
  text: Und ihr entweiht mich unter meinem Volk für ein paar Handvoll Gerste und ein paar Stücke Brot[a], indem ihr Menschen[b] tötet, die nicht sterben sollten, und Menschen am Leben erhaltet, die nicht leben sollten — durch eure Lügen gegenüber meinem Volk, das auf Lügen hört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein paar Bissen Brot“. Das Hebräische bezeichnet abgebrochene Stücke oder kleine Portionen und unterstreicht damit den geringen Gegenwert, für den sie handelten.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier und im folgenden Satzglied „Seelen“ beziehungsweise „Leben“. Gemeint sind im Hebräischen menschliche Personen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחַלֶּלְנָה
  choice: ihr entweiht
  rationale: Das Piel von חלל bezeichnet hier die Entweihung Gottes, also die Missachtung seiner Heiligkeit. „Entweiht“ bewahrt diese religiöse und bundestheologische Bedeutung.
- source_word: אֹתִי אֶל־עַמִּי
  choice: mich unter meinem Volk
  rationale: 'אֶל ist hier relational beziehungsweise räumlich zu verstehen: Das Handeln der Frauen entweiht Gott im Bereich und vor den Augen seines Volkes. „Unter meinem Volk“ ist natürlich und lässt die genaue Nuance offen.'
- source_word: בְּשַׁעֲלֵי שְׂעֹרִים
  choice: für ein paar Handvoll Gerste
  rationale: שַׁעֲלֵי bezeichnet kleine, mit der Hand bemessene Mengen. Die Formulierung gibt sowohl den Gegenwert als auch dessen Geringfügigkeit wieder.
- source_word: וּבִפְתוֹתֵי לֶחֶם
  choice: und ein paar Stücke Brot
  rationale: פְּתֹתֵי meint abgebrochene Stücke oder kleine Portionen. „Stücke Brot“ ist modernes, klares Deutsch; die mögliche Nuance „Bissen“ wird in der Fußnote genannt.
- source_word: לְהָמִית נְפָשׁוֹת
  choice: indem ihr Menschen tötet
  rationale: נְפָשׁוֹת bezeichnet hier konkrete menschliche Personen, nicht vom Körper getrennte Seelen. Die Konstruktion mit לְ nennt das bewirkte beziehungsweise beabsichtigte Ergebnis.
- source_word: אֲשֶׁר לֹא תְמוּתֶנָה
  choice: die nicht sterben sollten
  rationale: '„Sollten“ bewahrt die richterlich-moralische Spannung: Die falschen Prophetinnen verkehren das angemessene Urteil, ohne dass die Aussage auf reine Vorhersage oder Vorherbestimmung festgelegt wird.'
- source_word: וּלְחַיּוֹת נְפָשׁוֹת
  choice: und Menschen am Leben erhaltet
  rationale: Die kausative Bedeutung steht im direkten Gegensatz zum Töten. „Am Leben erhalten“ gibt diesen aktiven Sinn idiomatisch wieder.
- source_word: אֲשֶׁר לֹא תִחְיֶינָה
  choice: die nicht leben sollten
  rationale: Die parallele Formulierung bewahrt den richterlich-moralischen Gegensatz zum vorherigen Satzglied.
- source_word: בְּכַזֶּבְכֶם
  choice: durch eure Lügen
  rationale: Das Präfix בְּ bezeichnet das Mittel, durch das die beschriebenen Folgen herbeigeführt werden. „Durch eure Lügen“ ist knapp und idiomatisch.
- source_word: שֹׁמְעֵי כָזָב
  choice: das auf Lügen hört
  rationale: Das Partizip beschreibt nicht nur akustisches Hören, sondern empfängliches, zustimmendes Hören. Die deutsche Wendung „auf ... hören“ bringt dies treffend zum Ausdruck.
theological_decisions:
- issue: Bedeutung von נְפָשׁוֹת im Gerichtszusammenhang
  choice: Menschen
  alternative: Seelen; Leben
  rationale: Im Hebräischen bezeichnet נֶפֶשׁ hier lebende menschliche Personen. „Seelen“ könnte eine nicht vom Text geforderte Leib-Seele-Dualität nahelegen; „Menschen“ gibt den konkreten Bezug verständlich wieder.
- issue: Aussagekraft der Todes- und Lebensklauseln
  choice: 'richterlich-moralisch: „nicht sterben sollten“ / „nicht leben sollten“'
  alternative: 'rein voraussagend: „nicht sterben werden“ / „nicht leben werden“'
  rationale: Der Zusammenhang verurteilt falsche prophetische Urteile. „Sollten“ hält fest, dass die Frauen angemessene Urteile verkehren, ohne eine bestimmte Lehre über Vorherbestimmung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der Gedankenstrich macht den abschließenden Ausdruck des Mittels kenntlich, ohne die enge Verbindung zum Vorhergehenden aufzulösen. Die Wiederholung von „Lügen“ entspricht der pointierten Wiederholung des hebräischen כזב.
