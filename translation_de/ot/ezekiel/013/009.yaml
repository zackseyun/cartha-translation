  source_fidelity: Die Übersetzung gibt die gerichtliche Wendung „meine Hand wird gegen … sein“ treffend wieder. „Trug schauen“ bewahrt die Bildsprache von חזים שוא, und „Lügen wahrsagen“ vermittelt die als falsch qualifizierte divinatorische Praxis. Die dreifache Ausschließung (Rat/Kreis, schriftliches Verzeichnis, Land Israel) sowie der resultative Abschluss sind vollständig und sachgerecht wiedergegeben.
  naturalness: Modernes, würdiges Standarddeutsch mit gut nachvollziehbarer paralleler Satzführung. „Zum Kreis meines Volkes gehören“ ist idiomatisch und lässt die Spannweite von סוד als vertrauter Kreis, Rat oder Versammlung angemessen offen. Die knappe, leicht gehobene Sprache von „Trug schauen“ passt zum prophetischen Register.
  terminology: „Propheten“, „Verzeichnis des Hauses Israel“, „Land Israel“ und „Herr Jahwe“ sind konsistent und quellennah. Die Fußnoten sind an den jeweils erläuterten Ausdrücken korrekt verankert und nennen keine unzulässige dogmatische Festlegung. Die englische Audit-Trail-Ankerreihenfolge ist zwar auffällig, begründet aber keine Änderung des deutschen Textes.
