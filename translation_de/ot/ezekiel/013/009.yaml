source:
  edition: WLC
  text: וְ/הָיְתָ֣ה יָדִ֗/י אֶֽל הַ/נְּבִיאִ֞ים הַ/חֹזִ֣ים שָׁוְא֮ וְ/הַ/קֹּסְמִ֣ים כָּזָב֒ בְּ/ס֧וֹד עַמִּ֣/י לֹֽא יִהְי֗וּ וּ/בִ/כְתָ֤ב בֵּֽית יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/009.yaml
  text: And my hand will be against the prophets who see falsehood and who practice lying divination[a]. They will not be in the council of my people, nor will they be written in the register of the house of Israel, nor will they enter the land of Israel[c][b]. Then you will know that I am the Lord Yahweh.
translation:
  language: de
  text: Und meine Hand wird gegen die Propheten sein, die Trug schauen und Lügen wahrsagen. Sie werden nicht zum Kreis[a] meines Volkes gehören, nicht in das Verzeichnis[b] des Hauses Israel eingetragen werden und nicht in das Land Israel kommen. Dann werdet ihr erkennen, dass ich der Herr Jahwe[c] bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Rat“ beziehungsweise „zur Versammlung meines Volkes“. Das hebräische Wort kann einen vertrauten Kreis, einen Rat oder eine Versammlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in die schriftliche Liste“ beziehungsweise „in das Schriftstück des Hauses Israel“. Gemeint ist wahrscheinlich ein amtliches Verzeichnis.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: Adonaj JHWH, das heißt „Herr Jahwe“. Traditionell wird der Gottesname hier auch mit „GOTT“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה יָדִי אֶל
  choice: Und meine Hand wird gegen … sein
  rationale: Die hebräische Wendung bezeichnet hier Gottes wirksames, richtendes Vorgehen gegen die falschen Propheten; „gegen“ macht diese feindliche Ausrichtung deutlich.
- source_word: הַחֹזִים שָׁוְא
  choice: die Trug schauen
  rationale: Die Formulierung bewahrt das prophetische Bild des Schauens. „Trug“ gibt שָׁוְא in diesem Zusammenhang als Täuschung und Unwahres wieder, ohne das Bild zu einer bloßen Aussage über falsches Reden abzuschwächen.
- source_word: וְהַקֹּסְמִים כָּזָב
  choice: und Lügen wahrsagen
  rationale: קָסַם bezeichnet mantische beziehungsweise divinatorische Tätigkeit; כָּזָב kennzeichnet deren Inhalt als Lüge. Die knappe deutsche Wendung erhält die Parallelität zu „Trug schauen“.
- source_word: בְּסוֹד עַמִּי
  choice: zum Kreis meines Volkes
  rationale: סוֹד kann einen vertrauten Kreis, einen Rat oder eine Versammlung bezeichnen. „Kreis“ lässt diese Mehrdeutigkeit eher offen als eine institutionell engere Wiedergabe.
- source_word: וּבִכְתָב בֵּית יִשְׂרָאֵל לֹא יִכָּתֵבוּ
  choice: nicht in das Verzeichnis des Hauses Israel eingetragen werden
  rationale: Das Wortspiel mit כתב wird im Deutschen nicht vollständig nachgebildet; „Verzeichnis“ und „eingetragen“ vermitteln jedoch den wahrscheinlichen Sinn einer offiziellen schriftlichen Erfassung in natürlicher Sprache.
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל לֹא יָבֹאוּ
  choice: und nicht in das Land Israel kommen
  rationale: אֲדָמָה bedeutet wörtlich Boden oder Land. Im Zusammenhang der angekündigten Ausschließung ist „Land Israel“ die natürliche deutsche Wiedergabe.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: „Dann“ bringt den Folgezusammenhang zwischen dem Gericht und der daraus erwachsenden Erkenntnis zum Ausdruck; „erkennen“ entspricht dem gewichtigen Erkenntnissinn von ידע.
- source_word: אֲנִי אֲדֹנָי יְהוִה
  choice: dass ich der Herr Jahwe bin
  rationale: Die Wiedergabe bildet sowohl אֲדֹנָי („Herr“) als auch den Gottesnamen יהוה („Jahwe“) sichtbar ab und vermeidet die doppeldeutige traditionelle Ersatzschreibung „HERR“.
theological_decisions:
- issue: Ausschluss der falschen Propheten aus בְּסוֹד עַמִּי
  choice: zum Kreis meines Volkes gehören
  alternative: im Rat / in der Versammlung meines Volkes sein
  rationale: Der Text kann soziale Zugehörigkeit, Teilnahme an einer anerkannten Versammlung oder Zugang zu einem vertrauten Rat bezeichnen. Die Hauptfassung legt nicht fest, ob ausschließlich ein institutioneller Rat oder die Gemeinschaft des Volkes gemeint ist.
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr / der Herr, der HERR
  rationale: „Herr Jahwe“ gibt beide hebräischen Bestandteile unterscheidbar wieder und bewahrt den offen genannten Gottesnamen, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Parallelformulierungen „Trug schauen“ und „Lügen wahrsagen“ bewahren den prophetischen Klang und die Struktur des Hebräischen. Die drei Ausschlusssätze sind für natürliche deutsche Lesbarkeit zu einer parallelen Satzreihe verbunden.
