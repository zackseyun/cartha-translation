base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/018.yaml
  text: 'And say, ‘Thus says the Lord GOD: Woe to the women who sew magic bands on every wrist and make veils for the head of persons of every height, to hunt souls! Will you hunt the souls of my people and keep your own souls alive?'
translation:
  language: de
  text: 'Und sag: »So spricht GOTT, der Herr: Wehe den Frauen, die Zauberbinden an jedem Handgelenk nähen und Kopftücher für Menschen jeder Größe anfertigen, um Menschenleben zu fangen! Wollt ihr die Leben meines Volkes fangen und dabei euer eigenes Leben bewahren?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּסָתוֹת
  choice: Zauberbinden
  rationale: Das seltene Wort bezeichnet hier genähte Gegenstände an den Armen; der Zusammenhang mit magischen Praktiken rechtfertigt die funktionale Verdeutlichung „Zauber-“.
- source_word: עַל כָּל אַצִּילֵי יָדַי
  choice: für alle Handgelenke
  rationale: Wörtlich etwa „an allen Gelenken/Ansätzen meiner Hände“; im Kontext sind wohl Binden für die Arme bzw. Handgelenke gemeint. „Alle“ bewahrt die distributive Aussage.
- source_word: הַמִּסְפָּחוֹת
  choice: Schleier
  rationale: Das seltene Substantiv bezeichnet offenbar am Kopf getragene Tücher oder Hüllen; „Schleier“ ist eine natürliche, sachlich zurückhaltende Wiedergabe.
- source_word: עַל רֹאשׁ כָּל קוֹמָה
  choice: für Köpfe jeder Größe
  rationale: Die Wendung ist ungewöhnlich und wörtlich „auf dem Kopf jeder Höhe/Statur“. Die Übersetzung bewahrt den Bezug auf unterschiedliche Körpergröße, ohne eine bestimmte magische Funktion zu ergänzen.
- source_word: נְפָשׁוֹת
  choice: Menschenleben / Leben
  rationale: נפש kann „Seele“, „Person“ oder „Leben“ bedeuten. Hier steht das Einfangen und Bewahren von Leben im Vordergrund; „Menschenleben“ macht beim ersten Vorkommen deutlich, dass Personen gemeint sind.
- source_word: תְחַיֶּינָה
  choice: bewahren
  rationale: Die Pielform von חיה bedeutet hier „am Leben erhalten/bewahren“. Die Wiedergabe vermeidet die missverständliche Aussage, die Frauen würden lediglich selbst leben.
theological_decisions:
- issue: Art der beschriebenen Praktiken
  choice: „Zauberbinden“ verdeutlicht den magischen Zusammenhang, ohne die konkrete Wirkungsweise festzulegen.
  alternative: Nur „Binden“ oder „Kissen“
  rationale: Die Gegenstände dienen laut Kontext dem „Fangen“ von Leben; die genaue Beschaffenheit bleibt jedoch unsicher. Daher wird die magische Funktion benannt, aber keine spezielle Ritualtheorie eingetragen.
- issue: Bedeutung von נְפָשׁוֹת
  choice: Als „Menschenleben/Leben“ wiedergegeben
  alternative: „Seelen“
  rationale: Das Hebräische umfasst die lebende Person und ihr Leben. „Seelen“ könnte hier eine spätere, körperlich-geistige Trennung nahelegen, die der Text nicht ausdrücklich behauptet.
translation_notes:
  register: Moderne, würdige Standardsprache. Die prophetische Gerichtsformel bleibt prägnant; die rhetorische Schlussfrage und die Spannung zwischen dem gefährdeten Leben des Volkes und dem Selbsterhalt der Frauen werden bewahrt. GOTT in Kapitälchenersatz gibt das Tetragramm wieder, „der Herr“ אֲדֹנָי.
