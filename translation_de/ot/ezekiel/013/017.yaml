  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל בְּנ֣וֹת עַמְּ/ךָ֔ הַ/מִּֽתְנַבְּא֖וֹת מִֽ/לִּבְּ/הֶ֑ן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/017.yaml
  text: And you[a], son of man, set your face against the daughters of your people who prophesy out of their own hearts[b], and prophesy against them.
translation:
  language: de
  text: Du aber, Menschenkind, richte dein Angesicht gegen die Töchter deines Volkes[a], die aus ihrem eigenen Herzen weissagen[b], und weissage gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Frauen deines Volkes“. Wörtlich steht im Hebräischen „die Töchter deines Volkes“.'
    reason: lexical_alternative
  - marker: b
    text: '„Aus ihrem eigenen Herzen“ bedeutet hier: Ihre prophetische Botschaft entspringt ihnen selbst und kommt nicht vom HERRN.'
    reason: cultural_note
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschenkind
  rationale: Die in Ezechiel wiederkehrende Anrede wird als feste hebräische Wendung bewahrt. „Menschenkind“ klingt im heutigen Deutsch würdevoll und vermeidet zugleich, hier unnötig die neutestamentlich geprägte Titelform „Menschensohn“ aufzurufen.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: richte dein Gesicht gegen
  rationale: Die körperhafte Bildsprache des Hebräischen bleibt erhalten; „gegen“ gibt im Gerichtszusammenhang die feindliche Ausrichtung wieder.
- source_word: בְּנוֹת עַמְּךָ
  choice: die Töchter deines Volkes
  rationale: Die konkrete Verwandtschaftsbezeichnung „Töchter“ wird nicht zum allgemeineren „Frauen“ verflacht.
- source_word: הַמִּתְנַבְּאוֹת
  choice: die … weissagen
  rationale: Das Partizip bezeichnet ihre fortdauernde oder kennzeichnende prophetische Tätigkeit. Ein Zusatz wie „falsch“ steht nicht ausdrücklich im Vers.
- source_word: מִלִּבְּהֶן
  choice: aus ihrem eigenen Herzen
  rationale: „Herz“ bewahrt das hebräische Bild für das innere Denken und Wollen; „eigenen“ verdeutlicht, dass die Botschaft aus ihnen selbst stammt.
- source_word: וְהִנָּבֵא עֲלֵיהֶן
  choice: und weissage gegen sie
  rationale: Der Imperativ wird direkt wiedergegeben; „gegen“ entspricht dem feindlichen Sinn von עַל in diesem Gerichtswort.
theological_decisions:
- issue: Art der prophetischen Tätigkeit der Frauen
  choice: „die … weissagen“ ohne den Zusatz „falsch“
  alternative: „die falsch weissagen“ oder „die vorgeben zu weissagen“
  rationale: Der Zusammenhang verurteilt diese Frauen, doch der Vers kennzeichnet ihre Botschaft dadurch, dass sie aus ihrem eigenen Herzen stammt. Ein ausdrückliches „falsch“ würde die kontextuelle Beurteilung in den Wortlaut eintragen.
- issue: Bedeutung von „aus ihrem eigenen Herzen“
  choice: Die offene Bildsprache bleibt im Haupttext stehen.
  alternative: „die weissagen, was sie sich selbst ausgedacht haben“
  rationale: Das Hebräische umfasst Gedanken, Absichten und inneren Antrieb. Eine stärker erklärende Wiedergabe würde diese Bedeutungsbreite unnötig auf erfundene Gedanken verengen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter prophetischer Bildsprache. „Menschenkind“ dient als wiederkehrende, würdige Anrede Ezechiels; die etwas ungewohnte Formulierung „aus ihrem eigenen Herzen“ ist bewusst quellennah gehalten und wird durch eine Fußnote erläutert.
