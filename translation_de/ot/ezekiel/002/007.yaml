    issue: Unidiomatische Wortverbindung „meine Worte zu ihnen sprechen“
    rationale: Das Hebräische kann mit „ihnen meine Worte sagen“ natürlich und ohne Bedeutungsverlust wiedergegeben werden. Die vorliegende Formulierung klingt im modernen Deutsch konstruiert.
  - severity: low
    issue: Ungenaue Aussage zur Wörtlichkeit in der Fußnote
    rationale: „Ob sie es lassen“ ist eine deutsche elliptische Umsetzung, nicht eine wörtliche Entsprechung der gesamten hebräischen Formulierung. Die Anmerkung sollte die Grundbedeutung von יֶחְדָּלוּ präziser benennen.
