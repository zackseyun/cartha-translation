base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/007.yaml
  text: You shall speak my words to them[a], whether they listen or whether they refuse, for they are rebellious.
translation:
  language: de
  text: Du sollst ihnen meine Worte sagen, ob sie hören oder es lassen; denn sie sind widerspenstig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: Du sollst … sprechen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Beauftragungszusammenhang anweisende Kraft. „Du sollst … sprechen“ gibt den göttlichen Auftrag natürlich und würdig wieder.
- source_word: אֶת דְּבָרַי
  choice: meine Worte
  rationale: Der Plural mit Suffix der 1. Person Singular bezeichnet konkret Gottes Worte; „Botschaft“ wäre stärker zusammenfassend und auslegend.
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: Natürliche deutsche Wiedergabe der Richtungsangabe.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: ob sie hören oder ob sie es lassen
  rationale: Die parallelen אִם-Sätze bilden hier die Alternative „ob … oder ob“. „Hören“ bewahrt die mögliche Bedeutungsbreite von Wahrnehmen bis Beachten; „es lassen“ gibt יֶחְדָּלוּ näher als ein ausdrücklich deutendes „sich weigern“ wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für den uneingeschränkten Verkündigungsauftrag ein.
- source_word: מְרִי הֵמָּה
  choice: sie sind widerspenstig
  rationale: מְרִי bezeichnet Auflehnung beziehungsweise Widerspenstigkeit. Die prädikative Wiedergabe ist idiomatisch; „Haus“ wird nicht aus dem Kontext ergänzt, da es in diesem Vers fehlt.
theological_decisions:
- issue: 'Bedeutungsumfang von יִשְׁמְעוּ: hören oder gehorchen'
  choice: hören
  alternative: gehorchen / zuhören
  rationale: שׁמע kann über das akustische Hören hinaus Beachten und Gehorchen einschließen. „Hören“ bewahrt diese Spannung, ohne die stärkere Bedeutung ausdrücklich festzulegen.
- issue: Deutungsgrad von יֶחְדָּלוּ
  choice: es lassen
  alternative: sich weigern / nicht darauf hören
  rationale: Das Verb bedeutet grundsätzlich „aufhören, ablassen, unterlassen“. Im Zusammenhang ist die Verweigerung des Hörens gemeint; die Hauptübersetzung wahrt jedoch die knappe hebräische Formulierung, während die Fußnote die idiomatische Bedeutung erläutert.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Wiederholung „ob sie … oder ob sie …“ erhält den parallelen Aufbau. „Widerspenstig“ bezeichnet bewusste Auflehnung, ohne das im Vers nicht vorhandene „Haus“ zu ergänzen.
