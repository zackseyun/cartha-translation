source:
  edition: WLC
  text: וְ/הֵ֨מָּה֙ אִם יִשְׁמְע֣וּ וְ/אִם יֶחְדָּ֔לוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵ֑מָּה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/005.yaml
  text: And whether they listen or refuse—for they are a rebellious house—they will know that a prophet has been among them[a][b].
translation:
  language: de
  text: Und ob sie hören oder es ablehnen – denn sie sind ein widerspenstiges Haus –, sie werden erkennen, dass ein Prophet unter ihnen gewesen ist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ob sie hören oder davon ablassen“; das Hebräische stellt wörtlich „hören“ und „aufhören/sich enthalten“ einander gegenüber. Hier meint Letzteres, dass sie der Botschaft kein Gehör schenken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in ihrer Mitte gewesen ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִשְׁמְעוּ ... וְאִם יֶחְדָּלוּ
  choice: ob sie hören oder es ablehnen
  rationale: Die parallele Bedingungskonstruktion stellt zwei mögliche Reaktionen gegenüber, ohne das Ergebnis zu verändern. „Hören“ kann im prophetischen Zusammenhang das aufmerksame Annehmen einschließen; חָדַל bedeutet wörtlich „aufhören/sich enthalten“, bezeichnet hier aber die ablehnende Reaktion. Das Pronomen „es“ verweist natürlich auf die Botschaft, ohne „zu hören“ unnötig zu wiederholen.
- source_word: בֵּית מְרִי
  choice: ein widerspenstiges Haus
  rationale: „Haus“ bewahrt die kollektive und bundestheologische Bildsprache des Hebräischen. „Widerspenstig“ gibt מְרִי als beharrlichen Widerstand wieder, ohne den Ausdruck zu einer bloßen Volksbezeichnung zu verflachen.
- source_word: וְיָדְעוּ
  choice: sie werden erkennen
  rationale: Das Verb bezeichnet hier eine künftig eintretende, durch die prophetische Begegnung vermittelte Einsicht. „Erkennen“ trifft diesen Ergebnissinn im Deutschen besser als ein rein faktisches „wissen“.
- source_word: נָבִיא
  choice: ein Prophet
  rationale: Direkte Wiedergabe des hebräischen Substantivs; der unbestimmte Artikel entspricht dem Sinn des Satzes.
- source_word: הָיָה בְתוֹכָם
  choice: unter ihnen gewesen ist
  rationale: Die Formulierung bewahrt die räumlich-korporative Bedeutung von בְּתוֹךְ und gibt den abgeschlossenen Aufenthalt mit bleibender Bedeutung im Deutschen idiomatisch wieder.
- source_word: וְהֵמָּה
  choice: Und
  rationale: Das vorangestellte Pronomen hebt die Angesprochenen hervor. Im Deutschen wird diese Hervorhebung durch die einleitende Konstruktion ausreichend vermittelt; eine ausdrückliche Wiedergabe als „was sie betrifft“ wäre schwerfällig.
theological_decisions:
- issue: Art der Reaktion des Volkes
  choice: Der Vers erklärt, dass die Gegenwart des Propheten unabhängig davon erkannt werden wird, ob das Volk auf die Botschaft hört oder sie ablehnt.
  alternative: „Hören“ könnte enger als bloßes akustisches Wahrnehmen und יֶחְדָּלוּ wörtlicher als „davon ablassen“ verstanden werden.
  rationale: Der prophetische Zusammenhang stellt nicht bloß Hören und Nichthören als Sinnesvorgänge gegenüber, sondern Annahme und Verweigerung der Botschaft. Die Übersetzung wahrt diese Aussage, ohne die Reaktion weiter theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich erhält den erklärenden Einschub des hebräischen Satzes. „Widerspenstiges Haus“ bewahrt die markante Ezechiel-Formel, während „unter ihnen gewesen ist“ natürlich und zugleich quellennah formuliert ist.
