id: EZK.2.1
reference: Ezekiel 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָם֙ עֲמֹ֣ד עַל רַגְלֶ֔י/ךָ וַ/אֲדַבֵּ֖ר אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/001.yaml
  text: And he said to me[a], “Son of man, stand on your feet, and I will speak to you.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Menschensohn, stell dich auf deine Füße, dann will ich mit dir reden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu dir reden«. Die hebräische Konstruktion kann sowohl »mit dir« als auch »zu dir« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Das narrative Wayyiqtol wird im Deutschen natürlich mit dem Präteritum wiedergegeben; אמר bezeichnet hier konkret das Sagen.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die wörtliche, in Hesekiel wiederkehrende Anrede bleibt als markanter prophetischer Ausdruck erhalten.
- source_word: עֲמֹד עַל רַגְלֶיךָ
  choice: stell dich auf deine Füße
  rationale: Die Formulierung gibt den Imperativ idiomatisch wieder und bewahrt zugleich das konkrete Bild der Füße.
- source_word: וַאֲדַבֵּר
  choice: dann will ich reden
  rationale: Im Anschluss an den Imperativ bezeichnet die Präfixform die darauf folgende beziehungsweise beabsichtigte Handlung; »dann« macht die Abfolge im Deutschen natürlich deutlich.
- source_word: אֹתָךְ
  choice: mit dir
  rationale: Die Verbindung von דבר mit אֵת kann als »mit jemandem reden« oder »zu jemandem reden« verstanden werden. »Mit dir« bewahrt die mögliche persönliche Wechselbeziehung, ohne die Alternative auszuschließen.
theological_decisions:
- issue: Wiedergabe von בֶּן אָדָם in Hesekiel
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: »Menschensohn« erhält die charakteristische Ausdrucksweise des hebräischen Textes und ihre literarisch-theologische Resonanz, ohne an dieser Stelle eine spätere christologische Deutung ausdrücklich einzutragen.
- issue: Richtung beziehungsweise Gegenseitigkeit des Redens bei דבר אֹתָךְ
  choice: mit dir reden
  alternative: zu dir reden
  rationale: Die hebräische Konstruktion lässt beide Auffassungen zu. Der Haupttext wählt natürliches Deutsch; die Fußnote hält die echte lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und für Hesekiel prägende Anrede »Menschensohn« wird beibehalten; Satzbau und Imperativ sind zugleich allgemein verständlich formuliert.
