  text: וְ/אַתָּ֣ה בֶן אָ֠דָם אַל תִּירָ֨א מֵ/הֶ֜ם וּ/מִ/דִּבְרֵי/הֶ֣ם אַל תִּירָ֗א כִּ֣י סָרָבִ֤ים וְ/סַלּוֹנִים֙ אוֹתָ֔/ךְ וְ/אֶל עַקְרַבִּ֖ים אַתָּ֣ה יוֹשֵׁ֑ב מִ/דִּבְרֵי/הֶ֤ם אַל תִּירָא֙ וּ/מִ/פְּנֵי/הֶ֣ם אַל תֵּחָ֔ת כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/006.yaml
  text: But you[a], son of man, do not fear them, and do not fear their words, though briers and thorns are with you and you sit among scorpions. Do not fear their words, and do not be dismayed by their faces[b], for they are a rebellious house.
translation:
  language: de
  text: Du aber, Menschensohn, fürchte dich nicht vor ihnen und fürchte dich nicht vor ihren Worten, auch wenn Dorngestrüpp und Dornen bei dir sind[a] und du unter Skorpionen sitzt. Fürchte dich nicht vor ihren Worten und erschrick nicht vor ihren Gesichtern[b], denn sie sind ein widerspenstiges Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „auch wenn Aufrührer und Dornen bei dir sind“. Das seltene hebräische Wort für „Dorngestrüpp“ ist unsicher; der Zusammenhang mit Dornen und Skorpionen spricht für ein Bild stechender Gefahren.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor ihren Gesichtern“; gemeint sein kann ihre einschüchternde Erscheinung oder Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die in Hesekiel wiederkehrende, wörtlich geprägte Anrede und ihre maskuline Singularform; „Sterblicher“ wäre eine mögliche Sinnwiedergabe.
- source_word: תִּירָא
  choice: fürchte dich nicht
  rationale: Gibt das wiederholte Verbot unmittelbar und in würdigem, geläufigem Deutsch wieder.
- source_word: דִּבְרֵיהֶם
  choice: ihre Worte
  rationale: Bewahrt das konkrete Substantiv und die auffällige Wiederholung des Hebräischen.
- source_word: סָרָבִים וְסַלּוֹנִים
  choice: Dorngestrüpp und Dornen
  rationale: Erhält die gefährliche Pflanzenmetaphorik im Zusammenhang mit den Skorpionen; das seltene סָרָבִים ist jedoch unsicher und kann anders verstanden werden.
- source_word: אוֹתָךְ
  choice: dich umgeben
  rationale: Gibt die elliptische Konstruktion in natürlichem Deutsch als feindliche Umgebung wieder, ohne die Bildsprache aufzulösen.
- source_word: עַקְרַבִּים
  choice: Skorpione
  rationale: Direkte lexikalische Entsprechung, welche das Bild von Gefahr und Feindseligkeit bewahrt.
- source_word: יוֹשֵׁב
  choice: du ... sitzt
  rationale: Bewahrt den konkreten Sinn des Partizips; „unter“ stellt idiomatisch den Bezug zur feindlichen Umgebung her.
- source_word: מִפְּנֵיהֶם
  choice: vor ihren Gesichtern
  rationale: Bewahrt das konkrete hebräische Bild, das ihre einschüchternde Erscheinung oder Gegenwart bezeichnet.
- source_word: תֵּחָת
  choice: erschrick nicht
  rationale: Gibt den Sinn des inneren Zusammenbrechens oder Bestürztseins knapp und natürlich wieder; „lass dich nicht einschüchtern“ wäre stärker deutend.
- source_word: בֵּית מְרִי
  choice: ein widerspenstiges Haus
  rationale: Bewahrt Hesekiels feste Kollektivbezeichnung „Haus“ und gibt מְרִי als hartnäckige Auflehnung wieder.
theological_decisions:
- issue: Wiedergabe der Anrede בֶן אָדָם
  choice: Menschensohn
  alternative: Sterblicher; Menschenkind
  rationale: Die wiederkehrende prophetische Anrede und ihre Form werden bewahrt, ohne eine spätere christologische Identifikation ausdrücklich in den Text hineinzutragen.
- issue: Metaphorische Darstellung der Gegner
  choice: Die Bilder von Dorngestrüpp, Dornen und Skorpionen bleiben erhalten.
  alternative: Abstrakte Wiedergabe als Rebellen oder feindselige Menschen
  rationale: Die lebhafte Gefahrenmetaphorik trägt die prophetische Rhetorik; zugleich wird die lexikalische Unsicherheit von סָרָבִים in einer Fußnote offengelegt.
- issue: בֵּית מְרִי als kollektive Bezeichnung
  choice: widerspenstiges Haus
  alternative: rebellisches Volk; Haus der Auflehnung
  rationale: „Haus“ bewahrt die korporative Metapher, während „widerspenstig“ die anhaltende Auflehnung ausdrückt, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Mahnung gegen Furcht beziehungsweise Erschrecken und die konkreten Gefahrenbilder bleiben erhalten. „Widerspenstiges Haus“ klingt bewusst prophetisch und bewahrt Hesekiels wiederkehrende Kollektivmetapher.
