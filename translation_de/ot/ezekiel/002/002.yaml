  text: וַ/תָּ֧בֹא בִ֣/י ר֗וּחַ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר אֵלַ֔/י וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וָ/אֶשְׁמַ֕ע אֵ֖ת מִדַּבֵּ֥ר אֵלָֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/002.yaml
  text: And the Spirit entered into me when he spoke to me[a], and set me on my feet[b]; and I heard the one speaking to me.
translation:
  language: de
  text: Als er zu mir redete, kam der Geist in mich[a] und stellte mich auf die Füße. Da hörte ich den, der zu mir redete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Geist kam in mich.« Das hebräische Wort kann »Geist«, »Wind« oder »Atem« bedeuten; hier spricht der Zusammenhang am ehesten für Gottes Geist, der Ezechiel befähigt.'
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחַ
  choice: der Geist
  rationale: רוּחַ kann »Geist«, »Wind« oder »Atem« bedeuten. Im Zusammenhang der prophetischen Beauftragung ist Gottes befähigender Geist am wahrscheinlichsten; der im Hebräischen fehlende Artikel wird im Deutschen für den aus dem Kontext bestimmten Bezug ergänzt.
- source_word: וַתָּבֹא בִי
  choice: kam … in mich
  rationale: בוא mit ב und dem Suffix der ersten Person bezeichnet hier eine Bewegung in den Propheten hinein. »Kam in mich« ist natürliches Deutsch und wahrt diesen inneren Bezug.
- source_word: כַּאֲשֶׁר דִּבֶּר אֵלַי
  choice: Als er zu mir redete
  rationale: כַּאֲשֶׁר hat hier zeitliche Funktion. Die vorangestellte Wiedergabe macht im Deutschen klar, dass das Eintreten des Geistes während des Redens geschieht.
- source_word: וַתַּעֲמִדֵנִי עַל רַגְלָי
  choice: und stellte mich auf meine Füße
  rationale: Der Hifil von עמד ist kausativ. Die Formulierung bewahrt, dass der Geist Ezechiel zum Stehen bringt.
- source_word: וָאֶשְׁמַע
  choice: Da hörte ich
  rationale: »Da« gibt die erzählerische Abfolge des Wayyiqtol idiomatisch wieder, ohne dem Verb eine zusätzliche Bedeutung aufzuerlegen.
- source_word: אֵת מִדַּבֵּר אֵלָי
  choice: den, der zu mir redete
  rationale: Das Partizip מִדַּבֵּר wird substantivisch gebraucht und durch אֵת als Objekt von »hören« gekennzeichnet. Die deutsche Relativkonstruktion bildet dies verständlich und genau ab.
theological_decisions:
- issue: Bezug von רוּחַ
  choice: »der Geist« als Gottes befähigender Geist
  alternative: »ein Geist«
  rationale: Der unmittelbare Zusammenhang von Vision und Berufung legt Gottes Geist nahe, der Ezechiel aufrichtet und zum Hören befähigt. Da der hebräische Ausdruck keinen Artikel trägt und auch unbestimmt verstanden werden kann, bleibt die Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »zu mir redete« bewahrt die auffällige Wiederaufnahme des hebräischen Textes; »auf meine Füße« erhält dessen konkrete Ausdrucksweise.
