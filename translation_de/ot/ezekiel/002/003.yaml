  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ שׁוֹלֵ֨חַ אֲנִ֤י אֽוֹתְ/ךָ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גּוֹיִ֥ם הַ/מּוֹרְדִ֖ים אֲשֶׁ֣ר מָרְדוּ בִ֑/י הֵ֤מָּה וַ/אֲבוֹתָ/ם֙ פָּ֣שְׁעוּ בִ֔/י עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/003.yaml
  text: And he said to me[a], “Son of man, I am sending you to the sons of Israel, to the rebellious nations that have rebelled against me; they and their fathers have transgressed against me to this very day.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Menschensohn[a], ich sende dich zu den Söhnen Israels, zu den rebellischen Völkern, die sich gegen mich aufgelehnt haben. Sie und ihre Väter haben bis zum heutigen Tag gegen mich gefrevelt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Menschenkind“ oder „Sterblicher“.'
    reason: Lexikalische Alternativen für בֶּן אָדָם; sie verdeutlichen den menschlichen und sterblichen Status des Propheten.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die feste, in Ezechiel wiederkehrende Anrede und ihre formale sowie kanonische Resonanz. Die Wendung bezeichnet hier den Propheten als Menschen, nicht einen christologischen Titel.
- source_word: שׁוֹלֵחַ אֲנִי אֹתְךָ
  choice: ich sende dich
  rationale: Das Partizip mit ausdrücklich gesetztem Pronomen bezeichnet die unmittelbar bevorstehende beziehungsweise bereits vollzogene Beauftragung; das deutsche Präsens gibt dies knapp und natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Gibt die hebräische Form transparent wieder und erhält die bewusste Gegenüberstellung mit den anschließend genannten Völkern.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Bewahrt die auffällige Bezeichnung Israels mit einem sonst allgemein für Völker beziehungsweise Nationen gebrauchten Wort und damit die rhetorische Schärfe des Urteils.
- source_word: הַמּוֹרְדִים / מָרְדוּ בִי
  choice: die rebellischen / die sich gegen mich aufgelehnt haben
  rationale: Die beiden deutschen Ausdrücke geben denselben hebräischen Wortstamm sinngemäß wieder. Eine vollständig gleiche Wortwurzel wäre im Deutschen an dieser Stelle schwerfällig; die Wiederholung des Rebellionsmotivs bleibt dennoch deutlich.
- source_word: פָּשְׁעוּ בִי
  choice: haben sich gegen mich vergangen
  rationale: Unterscheidet dieses Verb von מרד und bezeichnet einen schweren Verstoß gegen Gott, ohne den Ausdruck auf eine bestimmte dogmatische Deutung festzulegen.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Gibt die nachdrückliche Zeitangabe idiomatisch und würdig wieder.
theological_decisions:
- issue: Die Anwendung von גּוֹיִם auf Israel
  choice: Völker
  alternative: Volk; Israeliten
  rationale: Die ungewöhnliche Mehrzahl ist textlich gut bezeugt und erzeugt offenbar bewusst einen scharfen, verfremdenden Urteilston. Sie wird daher nicht geglättet.
- issue: Die Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: Im Kontext ist dies Gottes wiederkehrende Anrede an Ezechiel und keine ausdrückliche christologische Titulierung. Die formnahe Wiedergabe wahrt dennoch die innerbiblischen Bezüge; verständliche Alternativen stehen in der Fußnote.
- issue: Die Wiedergabe von אָבוֹתָם
  choice: ihre Väter
  alternative: ihre Vorfahren
  rationale: Die konkrete Formulierung des Ausgangstextes bleibt erhalten. Sie stellt die gegenwärtige Generation in die schuldhafte Kontinuität mit den früheren Generationen, ohne über deren genaue Reichweite hinauszugehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die auffällige Mehrzahl „Völker“ und die konkrete Wendung „Söhne Israels“ wurden trotz ihrer Spannung bewusst beibehalten; altertümliche Syntax wurde vermieden.
