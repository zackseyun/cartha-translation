revisions:
- from: 'Und er sagte zu mir: „Menschensohn[a], ich sende dich zu den Söhnen Israels, zu den rebellischen Völkern, die sich gegen mich aufgelehnt haben. Sie und ihre Väter haben sich bis auf den heutigen Tag gegen mich vergangen.“'
  to: 'Und er sagte zu mir: „Menschensohn[a], ich sende dich zu den Söhnen Israels, zu den rebellischen Völkern, die sich gegen mich aufgelehnt haben. Sie und ihre Väter haben bis zum heutigen Tag gegen mich gefrevelt.“'
  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachliche Verbesserungen: Die unidiomatische Wendung „sich gegen mich vergangen“ wird durch „gegen mich gefrevelt“ ersetzt, das den hebräischen Verstoßbegriff angemessen und von „Rebellion“ unterscheidbar wiedergibt. „Bis zum heutigen Tag“ ist die natürliche moderne deutsche Entsprechung der emphatischen Zeitangabe. Alle übrigen formnahen und theologisch relevanten Entscheidungen bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
