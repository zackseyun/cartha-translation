  text: וַ/יִּפְרֹ֤שׂ אוֹתָ/הּ֙ לְ/פָנַ֔/י וְ/הִ֥יא כְתוּבָ֖ה פָּנִ֣ים וְ/אָח֑וֹר וְ/כָת֣וּב אֵלֶ֔י/הָ קִנִ֥ים וָ/הֶ֖גֶה וָ/הִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/010.yaml
  text: And he spread it out before me[a], and it was written on the front and on the back[b]; and written on it were lamentations and mourning and woe.
translation:
  language: de
  text: Er breitete sie vor mir aus. Sie war auf der Vorder- und Rückseite beschrieben[a]; auf ihr standen Klagelieder, Stöhnen und Wehe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „innen und außen“; auch möglich: „auf beiden Seiten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Klagelieder, Seufzen und Wehe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: Er breitete sie … aus
  rationale: פרשׂ bezeichnet das Ausbreiten oder Entfalten. „Ausbreiten“ gibt die sichtbare Handlung wieder, ohne genauer festzulegen, dass die Schriftrolle vollständig abgerollt wurde.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die knappe, natürliche deutsche Wendung bewahrt den räumlichen Sinn.
- source_word: כְתוּבָה
  choice: Sie war … beschrieben
  rationale: Das passive Partizip von כתב wird im Zusammenhang mit einer Schriftrolle idiomatisch mit „beschrieben“ wiedergegeben.
- source_word: פָּנִים וְאָחוֹר
  choice: auf der Vorder- und Rückseite
  rationale: Die Formulierung entspricht wörtlich „Vorderseite und Rückseite“ und macht deutlich, dass beide Seiten der Schriftrolle beschrieben waren.
- source_word: וְכָתוּב אֵלֶיהָ
  choice: auf ihr standen
  rationale: Dies ist eine natürliche deutsche Wiedergabe für den auf der Schriftrolle geschriebenen Inhalt und bewahrt den Bezug auf die Rolle.
- source_word: קִנִים
  choice: Klagelieder
  rationale: Der Plural bezeichnet Klagen beziehungsweise Toten- oder Trauerlieder. „Klagelieder“ bewahrt sowohl die literarische Form als auch den feierlich-düsteren Ton.
- source_word: הֶגֶה
  choice: Stöhnen
  rationale: Das Substantiv kann Stöhnen, Seufzen oder ein leises Klagen bezeichnen. „Stöhnen“ hält den hörbaren Ausdruck des Leids fest, ohne ihn mit den Klageliedern gleichzusetzen.
- source_word: הִי
  choice: Wehe
  rationale: „Wehe“ entspricht dem prophetischen Ausruf beziehungsweise Ausdruck drohenden Unheils und bewahrt die knappe Schlusswirkung der Dreierreihe.
theological_decisions:
- issue: Die dreifache Bezeichnung des Inhalts der Schriftrolle
  choice: Klagelieder, Stöhnen und Wehe
  alternative: Klagen, Seufzen und Weherufe
  rationale: Die gewählte Fassung erhält drei verwandte, aber unterscheidbare Ausdrücke von Trauer und Unheil, ohne deren genaue Beziehung zueinander theologisch auszudeuten.
- issue: Beschreibung der beiden Seiten der Schriftrolle
  choice: Vorder- und Rückseite
  alternative: innen und außen
  rationale: Der hebräische Ausdruck lautet wörtlich „Vorderseite und Rückseite“. Die traditionelle Alternative „innen und außen“ ist möglich, legt die räumliche Orientierung der aufgerollten Rolle jedoch stärker aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Klang. Die kurzen Hauptsätze und die dreigliedrige Schlussformel bewahren die Wucht des Hebräischen.
