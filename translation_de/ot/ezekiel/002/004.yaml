  yaml_path: translation/ot/ezekiel/002/004.yaml
  text: And the children are hard-faced and hard-hearted[a]; I am sending you to them, and you shall say to them[b], ‘Thus says the Lord GOD.’
translation:
  language: de
  text: 'Und die Söhne sind unverschämt und verstockt[a]. Ich sende dich zu ihnen, und du sollst zu ihnen sagen: »So spricht der Herr Jahwe[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »harten Gesichts und starken Herzens«; gemeint sind schamlose und innerlich verhärtete, widerspenstige Menschen.'
