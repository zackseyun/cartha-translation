  - marker: b
    text: 'Hebräisch: Adonaj JHWH, ein Titel aus »Herr« und dem Gottesnamen JHWH; traditionell: »Gott, der HERR«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבָּנִים
  choice: Und diese Menschen
  rationale: Wörtlich steht »und die Söhne«. Im Zusammenhang bezeichnet der Ausdruck die zuvor genannten Israeliten; »diese Menschen« gibt den kollektiven Bezug im heutigen Deutsch natürlich wieder, ohne nur männliche Nachkommen nahezulegen.
- source_word: קְשֵׁי פָנִים
  choice: unverschämt
  rationale: Die Wendung bedeutet wörtlich »hart von Angesicht« und bezeichnet dreiste, trotzige Menschen. »Unverschämt« vermittelt den idiomatischen Sinn; die konkrete Bildsprache wird in der Fußnote bewahrt.
- source_word: וְחִזְקֵי לֵב
  choice: hartherzig
  rationale: Wörtlich »stark von Herzen«; hier ist nicht Mut, sondern innere Verstocktheit gemeint. »Hartherzig« ist im Deutschen verständlich und erhält das Herzmotiv.
- source_word: אֲנִי שׁוֹלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: Ich sende dich zu ihnen
  rationale: Das betonte Pronomen mit Partizip bezeichnet die unmittelbar erfolgende Sendung. Die knappe Präsensform klingt im Deutschen natürlich und feierlich.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: und du sollst zu ihnen sagen
  rationale: Das Perfekt erhält in diesem Auftragszusammenhang anweisende Zukunftsbedeutung; »sollst« macht den göttlichen Auftrag deutlich.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die feste prophetische Botenformel. »So spricht« bewahrt ihren würdevollen und im Deutschen vertrauten Klang.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Wiedergabe unterscheidet אֲדֹנָי (»Herr«) vom Gottesnamen יהוה (»Jahwe«), ohne beide zu einem einzigen Titel zu verschmelzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der Herr
  rationale: Der hebräische Text enthält sowohl den Herrentitel als auch den Eigennamen. »Der Herr, Jahwe« macht beide Bestandteile sichtbar; die verbreitete traditionelle Wiedergabe steht als Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel bleibt bewusst feierlich; schwer verständliche hebräische Bildsprache wird idiomatisch übersetzt und in einer Fußnote offengelegt.
