  terminology: »Jahwe« gibt den Gottesnamen wieder; »Herr« entspricht אֲדֹנָי. Die traditionelle deutsche Form »Gott, der HERR« kann in der Anmerkung genannt werden, ohne sie als abweichende Lesart des hebräischen Textes auszugeben.
