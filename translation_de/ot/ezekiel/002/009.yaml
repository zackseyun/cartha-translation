base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/009.yaml
  text: Then I looked[a], and behold, a hand was stretched out toward me, and behold, in it was a scroll.
translation:
  language: de
  text: 'Dann sah ich: Da war eine Hand zu mir ausgestreckt, und siehe, in ihr war eine Schriftrolle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eine Rolle eines Buches«; gemeint ist eine Schriftrolle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Dann sah ich
  rationale: Das Narrativ-Waw führt die Handlung fort; ראה bezeichnet hier das neue Wahrnehmen einer Erscheinung.
- source_word: וְהִנֵּה
  choice: Da war …, und … war
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das Erscheinende. Die deutsche Präsentativform mit Doppelpunkt und »da war« gibt dies natürlich und anschaulich wieder; die zweite Setzung bleibt durch »und … war« erkennbar.
- source_word: יָד שְׁלוּחָה אֵלָי
  choice: eine Hand zu mir ausgestreckt
  rationale: שְׁלוּחָה beschreibt die in Richtung des Propheten ausgestreckte Hand. Ihr Besitzer wird wie im Hebräischen nicht genannt.
- source_word: בּוֹ
  choice: in ihr
  rationale: Im natürlichen deutschen Bildbezug verweist das Pronomen auf die sichtbare Hand. Dadurch wird kein nicht genannter Besitzer ergänzt.
- source_word: מְגִלַּת סֵפֶר
  choice: eine Schriftrolle
  rationale: Die Konstruktverbindung bezeichnet idiomatisch eine beschriebene beziehungsweise als Schriftstück dienende Rolle. »Schriftrolle« bewahrt beide Bedeutungsanteile in geläufigem Deutsch.
theological_decisions:
- issue: Identität des Besitzers der Hand
  choice: Der Besitzer bleibt ungenannt.
  alternative: Gottes Hand oder die Hand eines Engels ausdrücklich nennen.
  rationale: Der hebräische Text nennt lediglich eine Hand; jede nähere Identifizierung würde eine Deutung in den Vers eintragen.
- issue: Bezug von בּוֹ
  choice: Das deutsche Pronomen wird auf die Hand bezogen.
  alternative: »bei ihm« oder »in seiner Hand« und damit einen männlichen Träger voraussetzen.
  rationale: Die grammatische Spannung des maskulinen hebräischen Suffixes bei dem femininen יָד erlaubt keinen völlig eindeutigen engen Rückbezug. Der sichtbare Szenenzusammenhang legt im Deutschen »in ihr« nahe, ohne einen Träger zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt und »Da war« bewahren die lebhafte Hinweisfunktion von וְהִנֵּה, ohne das heute altertümlich wirkende »siehe« zweimal zu verwenden.
