  source_fidelity: 'Der Text gibt alle Sinneinheiten des Hebräischen zuverlässig wieder: das hervorgehobene »Du aber«, die feste Anrede »Menschensohn«, den gegenwärtigen Charakter von »ich zu dir rede«, die Warnung vor der Auflehnung, das kollektive Bild des »widerspenstigen Hauses« sowie die aufeinanderfolgenden Befehle zum Öffnen des Mundes und Essen. Die Wiederholung von מֶרִי wird angemessen durch »widerspenstig … widerspenstige« abgebildet.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. »Höre, was ich zu dir rede« ist leicht gehoben, aber für prophetische Rede idiomatisch und registergerecht. Die Imperative sind klar und natürlich.
  terminology: »Menschensohn« bewahrt die wiederkehrende ezechielische Anrede, ohne die lexikalische menschlich-sterbliche Nuance zu verdecken; die Fußnote nennt diese sachgerecht. »Haus« erhält die korporative Metapher des hebräischen בַּיִת. »Widerspenstig« ist hier eine tragfähige, nicht überinterpretierende Wiedergabe von מֶרִי.
