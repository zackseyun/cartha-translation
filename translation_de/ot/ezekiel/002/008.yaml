source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔י/ךָ אַל תְּהִי מֶ֖רִי כְּ/בֵ֣ית הַ/מֶּ֑רִי פְּצֵ֣ה פִ֔י/ךָ וֶ/אֱכֹ֕ל אֵ֥ת אֲשֶׁר אֲנִ֖י נֹתֵ֥ן אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/008.yaml
  text: But you[a], son of man, hear what I am speaking to you. Do not be rebellious like the rebellious house. Open your mouth and eat what I am giving you.
translation:
  language: de
  text: Du aber, Menschensohn[a], höre, was ich zu dir rede! Sei nicht widerspenstig wie das widerspenstige Haus. Öffne deinen Mund und iss, was ich dir gebe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sterblicher« beziehungsweise »Mensch«.'
    reason: Lexikalische Alternative zu בֶן אָדָם; die Wendung hebt Ezechiels Menschlichkeit gegenüber Gott hervor und dient im Buch zugleich als feste Anrede.
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische, wiederkehrende Anrede und ihre literarische Wirkung. Die mögliche Bedeutung als sterblicher Mensch wird in der Fußnote kenntlich gemacht.
- source_word: שְׁמַע
  choice: höre
  rationale: Gibt den Imperativ formal wieder und lässt den im Kontext mitschwingenden Sinn des aufmerksamen Beachtens bestehen, ohne ihn ausdrücklich als Gehorsam festzulegen.
- source_word: מְדַבֵּר אֵלֶיךָ
  choice: ich zu dir rede
  rationale: Das Partizip bezeichnet hier das gegenwärtige Reden; im Deutschen ist die Präsensform natürlich und ausreichend.
- source_word: אַל תְּהִי מֶרִי
  choice: Sei nicht widerspenstig
  rationale: Das Substantiv מֶרִי bezeichnet Auflehnung oder Widersetzlichkeit. Die adjektivische Wiedergabe ist im Deutschen idiomatisch.
- source_word: כְּבֵית הַמֶּרִי
  choice: wie das widerspenstige Haus
  rationale: Bewahrt das kollektive Bild vom Haus Israel und den Wortklang mit der unmittelbar vorausgehenden Warnung.
- source_word: פְּצֵה פִיךָ
  choice: Öffne deinen Mund
  rationale: Natürliche deutsche Entsprechung des Befehls, den Mund weit zu öffnen.
- source_word: וֶאֱכֹל
  choice: und iss
  rationale: Bewahrt die Abfolge und Konkretheit der symbolischen Handlung.
- source_word: אֵת אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ
  choice: was ich dir gebe
  rationale: Gibt die unmittelbar gegenwärtige Handlung des Partizips im natürlichen deutschen Präsens wieder.
theological_decisions:
- issue: Wiedergabe von בֶן אָדָם als prophetische Anrede
  choice: Menschensohn
  alternative: Sterblicher; Mensch
  rationale: Die feste Anrede in Ezechiel wird literarisch und intertextuell bewahrt. Die Übersetzung identifiziert Ezechiel dabei nicht stillschweigend mit einer späteren christologischen Titelfunktion; die allgemein-menschliche Bedeutungsnuance wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung »widerspenstig … widerspenstige« bildet die hebräische Wortwiederholung ab. »Haus« bleibt als kollektive Bezeichnung für Israel erhalten.
