lexical_decisions:
- source_word: לָאֹופַנִּים
  choice: Was die Räder betrifft
  rationale: Das vorangestellte לְ kennzeichnet hier am ehesten das Thema der Aussage. Die deutsche Wendung gibt diese Funktion natürlich wieder.
- source_word: לָהֶם קוֹרָא
  choice: man sie … nannte
  rationale: Die Konstruktion ist unpersönlich und bezeichnet die Benennung der Räder. Das unpersönliche »man« bewahrt diesen Sinn in idiomatischem Deutsch.
- source_word: הַגַּלְגַּל
  choice: das Wirbelrad
  rationale: גַּלְגַּל kann »Rad« oder etwas Wirbelndes bezeichnen. »Wirbelrad« wahrt den Singular und unterscheidet den Ausdruck von אֹופַנִּים, den zuvor genannten »Rädern«.
- source_word: בְּאָזְנָי
  choice: Ich hörte, wie
  rationale: Die wörtliche Wendung »in meinen Ohren« bezeichnet Ezekiels unmittelbares Hören. Die gewählte Form ist natürliches modernes Deutsch und erhält seine Rolle als Ohrenzeuge.
