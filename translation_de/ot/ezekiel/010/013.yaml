  text: 'Was die Räder[a] betrifft: Ich hörte, wie man sie »das Räderwerk« nannte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Rad«. Das hebräische Wort גַּלְגַּל kann „Rad“ oder etwas Rollendes/Wirbelndes bezeichnen; die knappe Satzfügung wird unterschiedlich verstanden.'
