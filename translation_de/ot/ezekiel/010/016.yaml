base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/016.yaml
  text: When the cherubim moved[a], the wheels moved beside them; and when the cherubim lifted up their wings to rise from the earth, the wheels also did not turn away from beside them.
translation:
  language: de
  text: Wenn die Cherubim sich bewegten, bewegten sich die Räder neben ihnen; und wenn die Cherubim ihre Flügel hoben, um sich von der Erde zu erheben, wichen auch die Räder nicht von ihrer Seite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch die Räder drehten sich nicht von ihrer Seite weg.“ Das Hebräische betont, dass die Räder beim Aufstieg an der Seite der Cherubim blieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלֶכֶת הַכְּרוּבִים
  choice: Wenn die Cherubim sich bewegten
  rationale: ב mit dem Infinitivus constructus von הלך bildet einen Temporalsatz. „Sich bewegten“ beschreibt die Fortbewegung in der Vision natürlich, ohne eine menschliche Gehweise nahezulegen.
- source_word: יֵלְכוּ הָאוֹפַנִּים אֶצְלָם
  choice: bewegten sich die Räder neben ihnen
  rationale: הלך bezeichnet hier die koordinierte Bewegung der Räder; אצל gibt ihre räumliche Nähe zu den Cherubim an.
- source_word: וּבִשְׂאֵת הַכְּרוּבִים אֶת כַּנְפֵיהֶם
  choice: und wenn die Cherubim ihre Flügel hoben
  rationale: Auch hier leitet ב mit einem Infinitivus constructus einen Temporalsatz ein. נשׂא mit „Flügel“ als Objekt wird idiomatisch mit „heben“ wiedergegeben.
- source_word: לָרוּם מֵעַל הָאָרֶץ
  choice: um sich von der Erde zu erheben
  rationale: Der Infinitiv von רום bezeichnet hier Ziel oder Folge des Flügelhebens. „Sich von der Erde erheben“ gibt den Aufstieg klar und in würdigem, natürlichem Deutsch wieder.
- source_word: לֹא יִסַּבּוּ ... מֵאֶצְלָם
  choice: wichen ... nicht von ihrer Seite
  rationale: Die Wendung betont, dass die Räder beim Aufstieg nicht von den Cherubim abdrehten oder sich von ihnen entfernten. „Nicht von ihrer Seite weichen“ gibt die räumliche Bindung idiomatisch wieder; die konkretere Bedeutung des Verbs wird in der Fußnote bewahrt.
- source_word: גַּם הֵם
  choice: auch die Räder
  rationale: Das betonte „auch sie“ bezieht sich auf die Räder. Die Wiederaufnahme des Substantivs schafft im Deutschen Klarheit und erhält die Hervorhebung.
