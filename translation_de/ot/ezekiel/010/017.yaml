source:
  edition: WLC
  text: בְּ/עָמְדָ֣/ם יַעֲמֹ֔דוּ וּ/בְ/רוֹמָ֖/ם יֵר֣וֹמּוּ אוֹתָ֑/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/017.yaml
  text: When they stood still[a], these stood still; and when they were lifted up, these were lifted up with them, for the spirit of the living creature was in them.
translation:
  language: de
  text: Wenn sie stillstanden, standen auch diese still; und wenn sie sich erhoben, wurden diese mit ihnen emporgehoben, denn der Geist des Lebewesens[a] war in ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Geist des Lebens“, wenn das hebräische Wort für „Lebewesen“ hier abstrakter verstanden wird. Das hebräische Wort für „Geist“ kann auch „Atem“ oder „Wind“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָמְדָם
  choice: wenn sie stillstanden
  rationale: Die Präposition ב mit Infinitivus constructus und Suffix bezeichnet hier den Zeitpunkt beziehungsweise Begleitumstand. „Stillstanden“ verdeutlicht im Zusammenhang den Gegensatz zur Bewegung.
- source_word: יַעֲמֹדוּ
  choice: standen auch diese still
  rationale: Das ausdrücklich ergänzte „diese“ unterscheidet die Räder als implizites Subjekt von den zuvor genannten Lebewesen; „auch“ macht die parallele Bewegung natürlich verständlich.
- source_word: וּבְרוֹמָם
  choice: und wenn sie sich erhoben
  rationale: Die parallele Zeitangabe beschreibt in der Thronvision eine Aufwärtsbewegung, nicht eine Erhöhung im übertragenen Sinn.
- source_word: יֵרוֹמּוּ אוֹתָם
  choice: erhoben sich diese mit ihnen
  rationale: Die schwierige Verbindung des Verbs mit אֹתָם bezeichnet im Kontext, dass sich die Räder zusammen mit den Lebewesen erhoben. Die reflexive Formulierung gibt die Bewegung idiomatisch wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet knapp und in würdigem Erzählstil die Erklärung für die gleichlaufende Bewegung ein.
- source_word: רוּחַ
  choice: Geist
  rationale: Bezeichnet hier am ehesten die belebende beziehungsweise lenkende Kraft, bewahrt aber die im Hebräischen mitschwingenden Bedeutungen „Atem“ und „Wind“.
- source_word: הַחַיָּה
  choice: des Lebewesens
  rationale: Gibt den singularischen Wortlaut wieder und entspricht dem visionären Wesen besser als das alltägliche „Tier“; ein kollektiver Bezug bleibt möglich.
- source_word: בָּהֶם
  choice: war in ihnen
  rationale: Die schlichte Ortsangabe bezieht sich im Kontext auf die Räder und lässt sich im Deutschen unmittelbar wiedergeben.
theological_decisions:
- issue: Bedeutung von רוּחַ הַחַיָּה in der Vision
  choice: der Geist des Lebewesens
  alternative: der Geist des Lebens; der Atem oder Wind des Lebewesens
  rationale: Die Genitivverbindung bezeichnet am natürlichsten den dem Lebewesen zugehörigen belebenden oder lenkenden Geist und erklärt so die gemeinsame Bewegung mit den Rädern. Die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit, ohne die visionäre Aussage auf abstrakte Lebenskraft oder bloßen Wind festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzstruktur bildet die koordinierte Bewegung der Lebewesen und Räder ab. Der Singular „Lebewesen“ bleibt entsprechend dem masoretischen Text erhalten; die Fußnote wahrt die Mehrdeutigkeit der Schlussformulierung.
