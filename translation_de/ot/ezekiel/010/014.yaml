source:
  edition: WLC
  text: וְ/אַרְבָּעָ֥ה פָנִ֖ים לְ/אֶחָ֑ד פְּנֵ֨י הָ/אֶחָ֜ד פְּנֵ֣י הַ/כְּר֗וּב וּ/פְנֵ֤י הַ/שֵּׁנִי֙ פְּנֵ֣י אָדָ֔ם וְ/הַ/שְּׁלִישִׁי֙ פְּנֵ֣י אַרְיֵ֔ה וְ/הָ/רְבִיעִ֖י פְּנֵי נָֽשֶׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/014.yaml
  text: 'And each one had four faces: the face of the first was the face of the cherub[a], and the face of the second was the face of a man, and the third the face of a lion[b], and the fourth the face of an eagle.'
translation:
  language: de
  text: 'Und jedes von ihnen hatte vier Gesichter: Das Gesicht des ersten war das Gesicht des Cherubs[a], das Gesicht des zweiten das Gesicht eines Menschen, das dritte das Gesicht eines Löwen und das vierte das Gesicht eines Adlers[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hesekiel 1,10 wird das entsprechende Gesicht als das eines Rindes beschrieben; hier steht im hebräischen Text »der Cherub«.
    reason: cross_reference
  - marker: b
    text: 'Oder: »das Gesicht eines Geiers«. Das hebräische Wort kann allgemeiner einen großen Greifvogel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים לְאֶחָד
  choice: Und jedes von ihnen hatte vier Gesichter
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich etwa »und vier Gesichter für eines«. Die Ergänzung von »hatte« und »von ihnen« gibt den distributiven Sinn im Deutschen klar und natürlich wieder.
- source_word: פְּנֵי הָאֶחָד
  choice: das Gesicht des ersten
  rationale: הָאֶחָד wird durch die folgende Reihe »des zweiten … das dritte … das vierte« ordinal gebraucht; »des ersten« bewahrt diese Aufzählungsstruktur.
- source_word: הַכְּרוּב
  choice: des Cherubs
  rationale: Der bestimmte Artikel wird berücksichtigt. Die auffällige Bezeichnung »Cherub« bleibt entsprechend dem hebräischen Text erhalten und wird nicht mit Hesekiel 1,10 harmonisiert.
- source_word: אָדָם
  choice: eines Menschen
  rationale: אָדָם bezeichnet hier ein menschliches Gesicht. »Mensch« ist im modernen Deutschen natürlich und gibt die Gattungsbezeichnung wieder, ohne mehr festzulegen als der Kontext.
- source_word: אַרְיֵה
  choice: eines Löwen
  rationale: Direkte und idiomatische Wiedergabe der Tierbezeichnung im Deutschen.
- source_word: נָשֶׁר
  choice: eines Adlers
  rationale: »Adler« ist die herkömmliche und kontextuell passende Wiedergabe; das hebräische Wort kann jedoch allgemeiner einen großen Greifvogel, möglicherweise auch einen Geier, bezeichnen, was in einer Fußnote vermerkt wird.
theological_decisions:
- issue: Verhältnis des »Cherubs« hier zum Rindergesicht in Hesekiel 1,10
  choice: Der überlieferte hebräische Wortlaut wird als »Cherub« übersetzt.
  alternative: »Rind« oder eine harmonisierende Formulierung wie »cherubähnliches Rind«
  rationale: Der hebräische Text dieses Verses nennt ausdrücklich den Cherub. Die Übersetzung bewahrt die Spannung zur Parallelbeschreibung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Aufzählung des Hebräischen bleibt sichtbar, wird aber durch eine natürliche deutsche Satzfügung geglättet. Sämtliche Fußnotenmarker stehen im Haupttext.
