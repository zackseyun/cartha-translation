  text: בְּ/לֶכְתָּ֗/ם אֶל אַרְבַּ֤עַת רִבְעֵי/הֶם֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּ֑/ם כִּ֣י הַ/מָּק֞וֹם אֲשֶׁר יִפְנֶ֤ה הָ/רֹאשׁ֙ אַחֲרָ֣י/ו יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/011.yaml
  text: When they went, they would go in any of their four directions; they did not turn as they went, for to the place where the head faced, they followed after it; they did not turn as they went.
translation:
  language: de
  text: Wenn sie gingen, gingen sie nach jeder ihrer vier Seiten; sie wandten sich beim Gehen nicht um. Denn wohin sich der Kopf wandte, dorthin gingen sie hinter ihm her; sie wandten sich beim Gehen nicht um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּלֶכְתָּם
  choice: wenn sie sich bewegten
  rationale: Das Verb הלך bezeichnet hier im Zusammenhang mit den Rädern ihre Fortbewegung. „Sich bewegen“ klingt im Deutschen natürlicher als das auf Räder bezogene „gehen“ und bewahrt den wiederholten Wortlaut.
- source_word: אֶל אַרְבַּעַת רִבְעֵיהֶם
  choice: in jede ihrer vier Richtungen
  rationale: רֹבַע bezeichnet hier eine der vier Seiten beziehungsweise Richtungen. Die Formulierung gibt die Bewegungsmöglichkeit in alle vier Richtungen idiomatisch wieder.
- source_word: לֹא יִסַּבּוּ
  choice: sie wandten sich nicht um
  rationale: סבב meint das Drehen oder Wenden während der Bewegung. Die Wiedergabe erhält den Unterschied zwischen Richtungsbewegung und einem dafür nötigen Wendemanöver.
- source_word: הָרֹאשׁ
  choice: der Kopf
  rationale: Die wörtliche Bedeutung „Kopf“ wird beibehalten, da der Bezug im Hebräischen ungewöhnlich und nicht völlig eindeutig ist; eine Deutung als „Vorderseite“ würde die Ambiguität vorschnell auflösen.
- source_word: אַחֲרָיו יֵלֵכוּ
  choice: dorthin folgten sie ihm
  rationale: אַחֲרָיו drückt ein Folgen hinter beziehungsweise nach dem Kopf aus. „Ihm folgen“ erhält den pronominalen Rückbezug und vermeidet eine interpretierende Umformung.
theological_decisions:
- issue: Identität und Funktion des „Kopfes“
  choice: „der Kopf“ bleibt ohne erklärende Identifikation stehen
  alternative: „die Vorderseite“ oder „der führende Teil“
  rationale: Der masoretische Text nennt ausdrücklich הָרֹאשׁ. Der Vers selbst klärt nicht abschließend, ob damit der Kopf eines Lebewesens, eine gemeinsame Vorderseite oder ein führendes Element gemeint ist; diese Spannung soll nicht dogmatisch oder mechanistisch aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Aussage, dass sie sich beim Bewegen nicht umwandten, bleibt entsprechend der hebräischen Wiederholung erhalten. Das Präteritum passt zur erzählenden Vision und gibt die iterativen hebräischen Verbformen im Kontext natürlich wieder.
