source:
  edition: WLC
  text: וַ/יָּ֤רָם כְּבוֹד יְהוָה֙ מֵ/עַ֣ל הַ/כְּר֔וּב עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּמָּלֵ֤א הַ/בַּ֨יִת֙ אֶת הֶ֣/עָנָ֔ן וְ/הֶֽ/חָצֵר֙ מָֽלְאָ֔ה אֶת נֹ֖גַהּ כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/004.yaml
  text: And the glory of Yahweh rose up from above the cherub to the threshold of the house[a], and the house was filled with the cloud[b], and the court was filled with the brightness of the glory of Yahweh.
translation:
  language: de
  text: Da erhob sich die Herrlichkeit Jahwes von oberhalb des Cherubs[a] zur Schwelle des Hauses[b]. Das Haus füllte sich mit der Wolke, und der Vorhof war vom Glanz der Herrlichkeit Jahwes erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „von über dem Cherub“. Im Hebräischen steht „Cherub“ im Singular.'
    reason: lexical_alternative
  - marker: b
    text: 'Mit dem „Haus“ ist hier das Tempelgebäude gemeint; daher auch: „zur Schwelle des Tempels“.'
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיָּרָם
  choice: Da erhob sich
  rationale: Das Qal-Wayyiqtol von רום bezeichnet hier eine Aufwärtsbewegung. Die reflexive deutsche Form gibt den intransitiven Vorgang natürlich wieder, ohne eine äußere handelnde Instanz einzutragen.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet die sichtbar wirksame Herrlichkeit beziehungsweise Gegenwart Gottes. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben und die Wiederholung der Wendung im Vers beibehalten.
- source_word: מֵעַל הַכְּרוּב
  choice: von oberhalb des Cherubs
  rationale: מֵעַל beschreibt den Ausgangspunkt einer Bewegung von einer Position über beziehungsweise auf dem Cherub. „Oberhalb“ wahrt diese räumliche Aussage; der Singular כְּרוּב bleibt erhalten.
- source_word: עַל מִפְתַּן הַבָּיִת
  choice: zur Schwelle des Hauses
  rationale: Bei einer Bewegung kann עַל das Ziel bezeichnen. מִפְתָּן ist die Schwelle; הַבַּיִת wird formal als „Haus“ wiedergegeben, meint im Zusammenhang jedoch das Tempelgebäude.
- source_word: וַיִּמָּלֵא הַבַּיִת אֶת הֶעָנָן
  choice: Das Haus füllte sich mit der Wolke
  rationale: Die deutsche mediale Form gibt den passivisch-medialen Sinn natürlich wieder. Der bestimmte Artikel bei עָנָן weist auf die bekannte Wolke der göttlichen Erscheinung.
- source_word: וְהֶחָצֵר מָלְאָה
  choice: und der Vorhof war … erfüllt
  rationale: חָצֵר bezeichnet im Tempelzusammenhang den Hof beziehungsweise Vorhof. Die prädikative Zustandsbeschreibung „war erfüllt“ entspricht der hebräischen Formulierung.
- source_word: נֹגַהּ
  choice: Glanz
  rationale: נֹגַהּ bezeichnet leuchtende Helligkeit oder strahlenden Glanz. „Glanz“ ist knapp, würdig und im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname im hebräischen Text wird als Gottesname kenntlich gemacht und nicht durch einen Titel ersetzt.
- issue: Verhältnis von Wolke, Glanz und göttlicher Herrlichkeit
  choice: Die Bildbegriffe werden nebeneinandergestellt, ohne sie erklärend gleichzusetzen.
  alternative: Die Wolke oder den Glanz ausdrücklich als Gottes Gegenwart deuten
  rationale: Der Vers verbindet diese Erscheinungen eng miteinander, formuliert aber keine ausdrückliche Gleichsetzung. Die Übersetzung bewahrt diese theologische Bildspannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus“ wahrt die hebräische Ausdrucksweise, während eine Fußnote den Tempelbezug klärt. Die Satzstruktur bleibt nahe am hebräischen Bewegungsablauf und vermeidet unnötige dogmatische Ausdeutung.
