source:
  edition: WLC
  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה אֶל הָ/רָקִ֨יעַ֙ אֲשֶׁר֙ עַל רֹ֣אשׁ הַ/כְּרֻבִ֔ים כְּ/אֶ֣בֶן סַפִּ֔יר כְּ/מַרְאֵ֖ה דְּמ֣וּת כִּסֵּ֑א נִרְאָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/001.yaml
  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
translation:
  language: de
  text: 'Dann sah ich, und siehe: Auf der Wölbung, die über den Köpfen der Cherubim war, erschien über ihnen etwas wie ein Saphirstein[a], das aussah wie die Gestalt eines Thrones.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: „wie ein Lapislazulistein“. Das traditionell mit „Saphir“ wiedergegebene hebräische Wort kann einen tiefblauen Edelstein bezeichnen, der nach heutiger mineralogischer Einteilung anders bestimmt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Dann sah ich
  rationale: Die Verbform führt die Visionserzählung weiter. „Dann sah ich“ gibt die zeitliche Folge natürlich wieder und bewahrt den Bericht in der ersten Person.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Das Aufmerksamkeitssignal hebt das plötzlich Wahrgenommene hervor. „Siehe“ wahrt den lebendigen prophetischen Ton, ohne den Ausdruck in eine bloße Existenzaussage abzuflachen.
- source_word: הָרָקִיעַ
  choice: die Wölbung
  rationale: Im Zusammenhang der Thronvision bezeichnet das Wort die ausgedehnte, gewölbeartige Fläche über den himmlischen Wesen. „Wölbung“ ist anschaulich und gegenwärtig, während „Feste“ heute leicht missverständlich oder altertümlich wirkt.
- source_word: אֲשֶׁר עַל רֹאשׁ הַכְּרֻבִים
  choice: die sich über den Köpfen der Cherubim befand
  rationale: Die Relativkonstruktion bestimmt die räumliche Lage der Wölbung. Die Ergänzung „sich befand“ ergibt einen natürlichen deutschen Satz, ohne eine zusätzliche inhaltliche Aussage einzuführen.
- source_word: הַכְּרֻבִים
  choice: die Cherubim
  rationale: „Cherubim“ ist im Deutschen die etablierte biblische Bezeichnung für diese himmlischen Wesen und bewahrt die besondere Bildwelt des Textes.
- source_word: כְּאֶבֶן סַפִּיר
  choice: etwas wie ein Saphirstein
  rationale: Die Formulierung kennzeichnet eine visionäre Ähnlichkeit mit einem kostbaren blauen Stein. Die traditionelle Wiedergabe „Saphirstein“ bleibt verständlich; die mögliche genauere mineralogische Zuordnung wird in der Fußnote genannt.
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  choice: dem Aussehen nach wie das Abbild eines Thrones
  rationale: Die gehäuften Vergleichsbegriffe werden nicht zu einer direkten Identifikation verkürzt. So bleibt die vorsichtige, nur annähernde Beschreibung des visionär Geschauten erhalten.
- source_word: נִרְאָה
  choice: erschien
  rationale: Die Nifal-Form bezeichnet das Sichtbarwerden. „Erschien“ ist idiomatisch und hält den Schwerpunkt auf dem, was in der Vision wahrnehmbar wurde.
- source_word: עֲלֵיהֶם
  choice: über ihnen
  rationale: Das Pronomen bezieht sich auf die Cherubim. „Über ihnen“ setzt die räumliche Darstellung der Wölbung über ihren Köpfen fort.
theological_decisions:
- issue: Visionäre Sprache und Grad der Identifikation
  choice: 'Die mehrfach gestufte Vergleichssprache bleibt erhalten: „etwas wie … dem Aussehen nach wie das Abbild eines Thrones“.'
  alternative: Vereinfachung zu einer direkten Aussage wie „über ihnen erschien ein Saphirthron“.
  rationale: Ezechiel bezeichnet das Gesehene durch mehrere Annäherungs- und Vergleichsausdrücke. Eine direkte Benennung als Thron würde die Aussage stärker festlegen, als es der hebräische Text tut, und die Distanz der Vision abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem prophetischem Aufmerksamkeitssignal „Siehe“. Die Satzstellung ist geglättet, doch die räumlichen Bezüge und die bewusst gehäufte visionäre Vergleichssprache bleiben sichtbar.
