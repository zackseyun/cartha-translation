source:
  edition: WLC
  text: וְ/הַ/כְּרֻבִ֗ים עֹֽמְדִ֛ים מִ/ימִ֥ין לַ/בַּ֖יִת בְּ/בֹא֣/וֹ הָ/אִ֑ישׁ וְ/הֶ/עָנָ֣ן מָלֵ֔א אֶת הֶ/חָצֵ֖ר הַ/פְּנִימִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/003.yaml
  text: The cherubim were standing on the right side of the house when the man went in[a], and the cloud filled the inner court.
translation:
  language: de
  text: Die Cherubim standen auf der rechten Seite des Hauses[a], als der Mann hineinging, und die Wolke erfüllte den inneren Vorhof.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf der rechten Seite des Hauses“. Nach der üblichen Orientierung des Tempels entspricht dies der Südseite.'
    reason: Bewahrt die wörtliche Richtungsangabe und erläutert die kontextuell erschlossene Südorientierung, ohne sie als ausdrücklichen hebräischen Wortlaut auszugeben.
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: die Cherubim
  rationale: Bewahrt die im Deutschen etablierte, aus dem Hebräischen übernommene Pluralform für die himmlischen Wesen sowie den bestimmten Artikel.
- source_word: עֹמְדִים
  choice: standen
  rationale: Das Partizip beschreibt die andauernde Haltung der Cherubim innerhalb der geschilderten Szene; das deutsche Präteritum gibt dies im erzählenden Zusammenhang natürlich wieder.
- source_word: מִימִין לַבַּיִת
  choice: rechts vom Haus
  rationale: Gibt die ausdrücklich relative Richtungsangabe des Hebräischen wieder, ohne sie im Haupttext bereits als „Südseite“ auszulegen. Die Orientierung am Tempel wird in der Fußnote erläutert.
- source_word: בְּבֹאוֹ הָאִישׁ
  choice: als der Mann hineinging
  rationale: Die Präposition ב mit dem Infinitiv constructus hat hier zeitliche Bedeutung. „Hineinging“ lässt wie das Hebräische offen, in welchen zuvor genannten Bereich der Mann ging.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der Vers selbst bezeichnet ihn lediglich als „den Mann“; die Identifikation mit dem zuvor genannten, in Leinen gekleideten Mann wird nicht erklärend in den Haupttext eingefügt.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Schlichte Wiedergabe des Nomens mit bestimmtem Artikel; die Verbindung mit der göttlichen Herrlichkeit ergibt sich aus dem Kontext.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Die finite Verbform schildert das Füllen als vollzogenen Erzählvorgang. „Erfüllte“ entspricht zugleich dem würdigen biblischen Register.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: den inneren Vorhof
  rationale: „Vorhof“ ist im Deutschen die geläufige Bezeichnung für die umgrenzten Hofbereiche der Tempelanlage und bewahrt die Unterscheidung zwischen innerem und äußerem Vorhof.
theological_decisions:
- issue: Richtungsangabe מִימִין im Tempelkontext
  choice: Im Haupttext „rechts vom Haus“, mit Erklärung der möglichen räumlichen Entsprechung „Südseite“ in einer Fußnote.
  alternative: auf der Südseite des Hauses
  rationale: Der hebräische Wortlaut nennt ausdrücklich die rechte Seite, während „Südseite“ aus der angenommenen Tempelorientierung erschlossen wird. Die gewählte Lösung bewahrt den Wortlaut und macht die kontextuelle Deutung transparent, ohne sie stillschweigend festzuschreiben.
- issue: Identität des Mannes
  choice: der Mann
  alternative: der in Leinen gekleidete Mann
  rationale: Die nähere Identifikation steht im Kontext, wird in diesem Vers jedoch nicht wiederholt. Die knappe Bezeichnung des Ausgangstextes bleibt daher erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Vorhof“ wahrt die etablierte Terminologie der Tempelarchitektur. Auf ein einleitendes „Nun“ wird verzichtet, da der Ausgangstext kein entsprechendes Zeitadverb enthält.
