source:
  edition: WLC
  text: אַרְבָּעָ֨ה אַרְבָּעָ֤ה פָנִים֙ לְ/אֶחָ֔ד וְ/אַרְבַּ֥ע כְּנָפַ֖יִם לְ/אֶחָ֑ד וּ/דְמוּת֙ יְדֵ֣י אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/021.yaml
  text: Each one had four faces[a], and each one had four wings, and the likeness of human hands was under their wings.
translation:
  language: de
  text: Jeder von ihnen hatte vier Gesichter und vier Flügel. Unter ihren Flügeln befand sich die Gestalt von Menschenhänden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gestalt von Händen eines Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה אַרְבָּעָה ... לְאֶחָד
  choice: Jeder von ihnen hatte vier
  rationale: Die Wiederholung der Zahl und לְאֶחָד drücken eine distributive Bedeutung aus. Die Formulierung gibt dies in natürlichem Deutsch wieder.
- source_word: פָנִים
  choice: Gesichter
  rationale: Der Plural bezeichnet im visionären Zusammenhang die vier Gesichter jedes einzelnen Wesens.
- source_word: וְאַרְבַּע כְּנָפַיִם לְאֶחָד
  choice: und vier Flügel
  rationale: Das bereits genannte „Jeder von ihnen hatte“ gilt parallel auch für die Flügel und muss im Deutschen nicht wiederholt werden.
- source_word: וּדְמוּת
  choice: etwas, das wie ... aussah
  rationale: דְּמוּת bezeichnet eine Ähnlichkeit oder Erscheinungsform, nicht notwendig völlige Identität. Die Wiedergabe bewahrt den vergleichenden Charakter der Vision.
- source_word: יְדֵי אָדָם
  choice: Menschenhände
  rationale: אָדָם bezeichnet hier den Menschen beziehungsweise die menschliche Art, nicht ausdrücklich eine männliche Einzelperson.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: Unter ihren Flügeln
  rationale: Die räumliche Angabe und der Rückbezug des Plurals auf die Wesen werden unmittelbar wiedergegeben.
theological_decisions:
- issue: Bedeutung von אָדָם in יְדֵי אָדָם
  choice: Menschenhände
  alternative: Hände eines Mannes
  rationale: Der Ausdruck beschreibt die menschliche Gestalt der Hände im Gegensatz zu den übrigen Merkmalen der Wesen; das Geschlecht einer bestimmten Person steht nicht im Blick.
- issue: Visionäre Vergleichssprache von דְּמוּת
  choice: etwas, das wie ... aussah
  alternative: die Gestalt von
  rationale: Die Formulierung wahrt die von דְּמוּת ausgedrückte Ähnlichkeit, ohne die Erscheinung mit gewöhnlichen menschlichen Händen gleichzusetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die distributive hebräische Konstruktion wird idiomatisch wiedergegeben; die visionäre Unbestimmtheit von דְּמוּת bleibt erhalten.
