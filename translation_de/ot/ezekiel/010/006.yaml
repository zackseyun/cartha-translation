  text: וַ/יְהִ֗י בְּ/צַוֺּת/וֹ֙ אֶת הָ/אִ֤ישׁ לְבֻֽשׁ הַ/בַּדִּים֙ לֵ/אמֹ֔ר קַ֥ח אֵשׁ֙ מִ/בֵּינ֣וֹת לַ/גַּלְגַּ֔ל מִ/בֵּינ֖וֹת לַ/כְּרוּבִ֑ים וַ/יָּבֹא֙ וַֽ/יַּעֲמֹ֔ד אֵ֖צֶל הָ/אוֹפָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/006.yaml
  text: And it happened[a], when he commanded the man clothed in linen, saying, “Take fire from between the wheelwork, from between the cherubim,” that he went in and stood beside the wheel.
translation:
  language: de
  text: 'Und als er dem in Leinen gekleideten Mann befahl: »Nimm Feuer aus der Mitte des Räderwerks[a], aus der Mitte der Cherubim«, ging dieser hinein und stand neben dem Rad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus der Mitte des Rades«; das hebräische Wort גַּלְגַּל kann in dieser Vision ein Rad oder eine wirbelnde Radstruktur bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצַוֺּתוֹ
  choice: Und als er … befahl
  rationale: Die Verbindung aus וַיְהִי und dem mit בְּ gebildeten Infinitiv bezeichnet den zeitlichen Rahmen des folgenden Geschehens. Im Deutschen gibt ein natürlicher Als-Satz diese Funktion wieder, ohne die hebräische Erzählungsformel schwerfällig nachzuahmen. Das nicht ausdrücklich genannte Subjekt bleibt als »er« stehen.
- source_word: הָאִישׁ לְבֻשׁ הַבַּדִּים
  choice: dem in Leinen gekleideten Mann
  rationale: Die Formulierung kennzeichnet die bereits bekannte Gestalt durch ihre Leinenkleidung. »In Leinen gekleidet« ist gegenwärtiges, würdevolles Deutsch.
- source_word: לֵאמֹר
  choice: direkte Rede ohne gesondertes »und sagte«
  rationale: Der hebräische Redeanzeiger wird im Deutschen idiomatisch durch den Doppelpunkt und die anschließende direkte Rede wiedergegeben.
- source_word: קַח אֵשׁ
  choice: Nimm Feuer
  rationale: Die knappe Imperativkonstruktion wird unmittelbar und ohne unnötige Ergänzung übersetzt.
- source_word: מִבֵּינוֹת לַגַּלְגַּל
  choice: aus dem Raum zwischen dem Räderwerk
  rationale: מִבֵּינוֹת verlangt hier eine räumliche Wiedergabe. גַּלְגַּל bezeichnet in der Vision wahrscheinlich die Radstruktur beziehungsweise das Räderwerk und wird vom nachfolgenden singularischen אוֹפָן unterschieden.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: zwischen den Kerubim
  rationale: Die räumliche Wiederholung des Hebräischen bleibt zur Strukturierung und Betonung erhalten.
- source_word: וַיָּבֹא
  choice: ging dieser hinein
  rationale: Im Zusammenhang beschreibt das Verb das Hineingehen in den bezeichneten Bereich. »Dieser« macht eindeutig, dass nun der Mann handelt, ohne den nicht genannten Befehlenden zu identifizieren.
- source_word: וַיַּעֲמֹד אֵצֶל הָאוֹפָן
  choice: stellte sich neben das Rad
  rationale: Das Verb bezeichnet hier das Einnehmen eines Standorts; אֵצֶל bedeutet »neben«, und der Singular von אוֹפָן wird bewahrt.
theological_decisions:
- issue: Identität des befehlenden Subjekts
  choice: Das Subjekt bleibt unbestimmt als »er«.
  alternative: »der HERR« oder »der auf dem Thron Sitzende«
  rationale: Der hebräische Vers nennt das Subjekt nur durch ein maskulines Pronominalsuffix. Eine ausdrückliche Identifizierung würde eine kontextuelle Deutung in den Vers eintragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die ungewöhnliche Bildsprache der Vision und der Wechsel zwischen גַּלְגַּל (Räderwerk/Radstruktur) und אוֹפָן (Rad) werden bewahrt; die Syntax wird zugleich natürlich deutsch gestaltet.
