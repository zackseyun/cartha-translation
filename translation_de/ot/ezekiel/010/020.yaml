  text: הִ֣יא הַ/חַיָּ֗ה אֲשֶׁ֥ר רָאִ֛יתִי תַּ֥חַת אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּֽ/נְהַר כְּבָ֑ר וָ/אֵדַ֕ע כִּ֥י כְרוּבִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/020.yaml
  text: This was the living creature that I saw beneath the God of Israel by the Kebar Canal[a], and I knew that they were cherubim.
translation:
  language: de
  text: Das war das Lebewesen, das ich unter dem Gott Israels am Kebar-Kanal[a] gesehen hatte. Da erkannte ich, dass es Cherubim waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Fluss Kebar“. Das hebräische Wort kann einen Fluss oder einen Kanal bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִיא הַחַיָּה
  choice: Das war das Lebewesen
  rationale: Das feminine Singularpronomen nimmt das zuvor beschriebene visionäre Lebewesen auf. „Das war“ kennzeichnet in natürlichem Deutsch die rückblickende Identifikation; „Lebewesen“ bewahrt den übernatürlichen Kontext, ohne an ein gewöhnliches Tier denken zu lassen.
- source_word: אֲשֶׁר רָאִיתִי
  choice: das ich … gesehen hatte
  rationale: Das Plusquamperfekt verdeutlicht idiomatisch, dass sich die frühere Schau zeitlich vor der nun erzählten Erkenntnis ereignete, ohne den Sinn des hebräischen Perfekts zu verändern.
- source_word: תַּחַת אֱלֹהֵי יִשְׂרָאֵל
  choice: unter dem Gott Israels
  rationale: „Unter“ gibt die räumliche Anordnung der Thronvision klar und unmittelbar wieder; der bestimmte Gottesname bleibt unverändert erhalten.
- source_word: בִּנְהַר כְּבָר
  choice: am Kebar-Kanal
  rationale: בְּ ist hier lokativ. נְהַר kann Fluss oder Kanal bezeichnen; im babylonischen Umfeld ist „Kanal“ wahrscheinlich geografisch genauer. „Kebar“ folgt einer im Deutschen verständlichen Umschrift.
- source_word: וָאֵדַע
  choice: und ich erkannte
  rationale: ידע beschreibt hier nicht bloß vorhandenes Wissen, sondern Ezechiels Identifikation der zuvor gesehenen Gestalten. „Erkannte“ ist im Deutschen natürlicher als „wusste“ und bleibt nahe am erzählten Erkenntnisvorgang.
- source_word: כִּי כְרוּבִים הֵמָּה
  choice: dass es Kerubim waren
  rationale: כִּי leitet den Inhalt der Erkenntnis ein. Das pluralische הֵמָּה wird durch „Kerubim waren“ bewahrt; das deutsche „es“ greift idiomatisch das singularische „Lebewesen“ als zusammenfassende Erscheinung auf. „Kerubim“ ist die etablierte deutsche Form des hebräischen Plurals.
theological_decisions:
- issue: Identifikation der Wesen in der Thronvision
  choice: Die zunächst zusammenfassend als „das Lebewesen“ bezeichnete Erscheinung wird ausdrücklich als „Kerubim“ identifiziert.
  alternative: Den Singular zu „Lebewesen“ glätten oder כְרוּבִים allgemeiner als „geflügelte Wesen“ wiedergeben.
  rationale: Der Wechsel vom grammatischen Singular הַחַיָּה zum Plural כְרוּבִים הֵמָּה gehört zur Spannung des Textes und soll nicht beseitigt werden. Die ausdrückliche Identifikation durch Ezechiel bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt nah an der Struktur des Hebräischen, verwendet aber mit „gesehen hatte“ und „erkannte“ einen natürlichen deutschen Erzählstil. Der auffällige Wechsel vom zusammenfassenden Singular „Lebewesen“ zum Plural „Kerubim“ wird bewahrt.
