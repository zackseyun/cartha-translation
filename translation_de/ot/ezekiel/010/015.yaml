source:
  edition: WLC
  text: וַ/יֵּרֹ֖מּוּ הַ/כְּרוּבִ֑ים הִ֣יא הַ/חַיָּ֔ה אֲשֶׁ֥ר רָאִ֖יתִי בִּֽ/נְהַר כְּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/015.yaml
  text: And the cherubim rose up[a]. They were the living creature that I had seen by the Kebar Canal.
translation:
  language: de
  text: Da erhoben sich die Kerubim. Sie waren das Lebewesen[a], das ich am Kebar-Kanal gesehen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen trotz des vorausgehenden Plurals „Kerubim“ der Singular „das Lebewesen“. Gemeint ist offenbar die Identifikation mit den Wesen aus der früheren Vision; möglich ist daher auch: „Sie waren die Lebewesen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרֹמּוּ
  choice: Da erhoben sich
  rationale: Die Form von רום bezeichnet hier eine Aufwärtsbewegung. „Erhoben sich“ gibt diese aktiv wieder, ohne eine äußere Ursache einzutragen; „da“ führt die erzählerische Abfolge natürlich fort.
- source_word: הַכְּרוּבִים
  choice: die Kerubim
  rationale: „Kerubim“ ist die im Deutschen geläufige biblische Wiedergabe des hebräischen Plurals und wahrt den würdevollen visionären Ton.
- source_word: הִיא הַחַיָּה
  choice: Sie waren das Lebewesen
  rationale: Der hebräische Text verbindet das plurale „Kerubim“ mit einem femininen Singularpronomen und dem singularischen „Lebewesen“. Die Wiedergabe hält diese auffällige Numerusspannung fest, statt sie stillschweigend zu glätten.
- source_word: אֲשֶׁר רָאִיתִי
  choice: das ich … gesehen hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die Schau am Kebar zeitlich vor der gegenwärtig erzählten Vision lag.
- source_word: בִּנְהַר כְּבָר
  choice: am Kebar-Kanal
  rationale: Im babylonischen Umfeld bezeichnet נְהַר wahrscheinlich einen Kanal beziehungsweise Wasserlauf. „Am“ gibt die lokale Präposition idiomatisch wieder; „Kebar“ folgt einer modernen hebräischen Umschrift.
theological_decisions:
- issue: Identifikation der Kerubim mit dem in Hesekiel 1 geschauten Lebewesen beziehungsweise den dort geschauten Lebewesen
  choice: Die Numerusspannung wird mit „Sie waren das Lebewesen“ bewahrt.
  alternative: „Sie waren die Lebewesen“ oder „Es war das Lebewesen“
  rationale: Der hebräische Wortlaut hat nach dem pluralischen Subjekt sowohl Pronomen als auch Prädikatsnomen im Singular. Die gewählte Fassung wahrt die Identifikation und ihre echte grammatische Spannung, ohne daraus eine bestimmte Lehre über Einheit oder Vielheit der Wesen abzuleiten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem visionärem Ton. „Lebewesen“ ist natürlicher als „lebendiges Geschöpf“ und hält den Bezug zur Bezeichnung חַיָּה in Hesekiels Vision offen. Der Fußnotenmarker steht unmittelbar bei der grammatisch auffälligen Formulierung.
