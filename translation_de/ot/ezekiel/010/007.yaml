source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הַ/כְּר֨וּב אֶת יָד֜/וֹ מִ/בֵּינ֣וֹת לַ/כְּרוּבִ֗ים אֶל הָ/אֵשׁ֙ אֲשֶׁר֙ בֵּינ֣וֹת הַ/כְּרֻבִ֔ים וַ/יִּשָּׂא֙ וַ/יִּתֵּ֔ן אֶל חָפְנֵ֖י לְבֻ֣שׁ הַ/בַּדִּ֑ים וַ/יִּקַּ֖ח וַ/יֵּצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/007.yaml
  text: Then the cherub stretched out his hand from among the cherubim to the fire that was among the cherubim[a], and he lifted it up and put it into the palms of the one clothed in linen[b], who took it and went out.
translation:
  language: de
  text: Da streckte der Kerub seine Hand aus der Mitte der Kerubim zum Feuer hin aus, das zwischen den Kerubim war[a]. Er hob es auf und legte es in die hohlen Hände des in Leinen Gekleideten[b]; der nahm es und ging hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: »von zwischen den Kerubim … das Feuer, das zwischen den Kerubim war«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in die Handflächen des in Leinen Gekleideten«; im Zusammenhang ist dies dieselbe Gestalt, die zuvor »der Mann in Leinenkleidern« genannt wird (10,2.6).'
    reason: cross_reference
lexical_decisions:
- source_word: הַכְּרוּב
  choice: der Kerub
  rationale: Der bestimmte Singular bezeichnet einen einzelnen Kerub als Handelnden; die spezifische Bezeichnung des himmlischen Wesens bleibt erhalten.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: streckte ... seine Hand ... aus
  rationale: Mit »Hand« bezeichnet das Verb idiomatisch das Ausstrecken beziehungsweise Hinreichen der Hand.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: aus der Mitte der Kerubim
  rationale: Die Formulierung gibt die räumliche Lage innerhalb der Gruppe natürlich wieder, ohne eine paarweise Anordnung vorauszusetzen.
- source_word: הָאֵשׁ אֲשֶׁר בֵּינוֹת הַכְּרֻבִים
  choice: das Feuer, das mitten zwischen den Kerubim war
  rationale: Die wiederholte Ortsangabe und der bestimmte Ausdruck »das Feuer« werden bewahrt.
- source_word: וַיִּשָּׂא
  choice: Er hob es auf
  rationale: Das nicht ausdrücklich genannte Objekt ergibt sich aus dem unmittelbar zuvor erwähnten Feuer; »aufheben« bewahrt die konkrete Bewegung des Verbs.
- source_word: וַיִּתֵּן
  choice: legte es in
  rationale: Im konkreten Übergabevorgang ist »legen« im Deutschen natürlicher als das allgemeinere »geben«.
- source_word: חָפְנֵי
  choice: die hohlen Hände
  rationale: Das Substantiv bezeichnet die Handflächen beziehungsweise zu einer Aufnahmefläche geformten Hände; »hohle Hände« gibt dieses Bild verständlich wieder.
- source_word: לְבֻשׁ הַבַּדִּים
  choice: des in Leinen Gekleideten
  rationale: Der Vers nennt hier keine Personenbezeichnung, sondern beschreibt den Empfänger nur durch seine Leinenkleidung.
- source_word: וַיִּקַּח וַיֵּצֵא
  choice: der nahm es und ging hinaus
  rationale: Der Relativanschluss macht im Deutschen deutlich, dass nun der in Leinen Gekleidete handelt, und erhält die Abfolge der Verben.
theological_decisions:
- issue: Identität des Empfängers
  choice: der in Leinen Gekleidete
  alternative: der Mann in Leinenkleidern
  rationale: Der Zusammenhang bezeichnet die Gestalt als Mann (10,2.6), doch der vorliegende Vers selbst enthält das Wort »Mann« nicht. Der Haupttext wahrt diese Zurückhaltung; die Fußnote stellt den Zusammenhang her.
- issue: Bezugswort des unausgedrückten Objekts
  choice: »es« bezieht sich auf das Feuer beziehungsweise das daraus Genommene
  alternative: »etwas davon«
  rationale: Im Hebräischen bleibt das Objekt unausgesprochen. Das deutsche Pronomen hält die Aussage knapp und vermeidet eine nähere Bestimmung als »Kohlen«, die erst aus dem weiteren Zusammenhang gewonnen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Kerub/Kerubim« bewahrt die traditionelle biblische Fachbezeichnung; die Satzfolge bleibt anschaulich und nahe am hebräischen Handlungsablauf.
