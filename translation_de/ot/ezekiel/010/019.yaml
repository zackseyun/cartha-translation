source:
  edition: WLC
  text: וַ/יִּשְׂא֣וּ הַ/כְּרוּבִ֣ים אֶת כַּ֠נְפֵי/הֶם וַ/יֵּר֨וֹמּוּ מִן הָ/אָ֤רֶץ לְ/עֵינַ/י֙ בְּ/צֵאתָ֔/ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וַֽ/יַּעֲמֹ֗ד פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הַ/קַּדְמוֹנִ֔י וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/019.yaml
  text: Then the cherubim lifted up their wings and rose from the earth before my eyes as they went out[a], with the wheels beside them; and it stood at the entrance of the eastern gate of the house of Yahweh[c][b], and the glory of the God of Israel was above them, from above.
translation:
  language: de
  text: Da erhoben die Cherubim ihre Flügel und stiegen vor meinen Augen von der Erde auf, als sie hinauszogen; die Räder waren neben ihnen.[a] Es stand am Eingang des östlichen Tores des Hauses Jahwes[b],[c] und die Herrlichkeit des Gottes Israels war hoch über ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Räder waren ihnen gegenüber“ beziehungsweise „auf gleicher Höhe mit ihnen“. Der hebräische Ausdruck bezeichnet eine entsprechende räumliche Anordnung.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht „stand“ im Singular. Gemeint sein kann die gesamte Thronwagen-Erscheinung als eine Einheit; dem Zusammenhang nach wäre auch ein Bezug auf die Cherubim und Räder denkbar.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׂאוּ הַכְּרוּבִים אֶת־כַּנְפֵיהֶם
  choice: Da erhoben die Cherubim ihre Flügel
  rationale: נשׂא bezeichnet mit den Flügeln als Objekt das konkrete Erheben. „Cherubim“ ist die im Deutschen etablierte biblische Pluralform.
- source_word: וַיֵּרוֹמּוּ מִן־הָאָרֶץ
  choice: und stiegen ... von der Erde auf
  rationale: Die Form beschreibt die Aufwärtsbewegung. „aufsteigen“ gibt das visionäre Geschehen natürlich und anschaulich wieder.
- source_word: לְעֵינַי
  choice: vor meinen Augen
  rationale: Die idiomatische deutsche Wendung bewahrt die Augenzeugenperspektive Ezechiels.
- source_word: בְּצֵאתָם
  choice: als sie hinauszogen
  rationale: Die Präposition mit dem Infinitiv bezeichnet eine gleichzeitig stattfindende Handlung.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: die Räder waren neben ihnen
  rationale: לְעֻמָּה bezeichnet eine entsprechende oder gegenüberliegende räumliche Zuordnung. Im Bewegungskontext ist „neben ihnen“ verständlich, während die Fußnote die weitere Bedeutung offenhält.
- source_word: וַיַּעֲמֹד
  choice: blieb es stehen
  rationale: Das hebräische Verb steht trotz der zuvor genannten Mehrzahl grammatisch im maskulinen Singular. Das unbestimmte „es“ bewahrt diese Auffälligkeit und lässt als Bezug die gesamte Thronwagen-Erscheinung offen.
- source_word: פֶּתַח שַׁעַר בֵּית יְהוָה הַקַּדְמוֹנִי
  choice: am Eingang des östlichen Tores des Hauses Jahwes
  rationale: Die Wiedergabe folgt der hebräischen Nominalverbindung eng und bewahrt sowohl das Tempelhaus-Bild als auch die östliche Lage des Tores.
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל עֲלֵיהֶם מִלְמָעְלָה
  choice: und die Herrlichkeit des Gottes Israels war oben über ihnen
  rationale: „oben über ihnen“ gibt sowohl עֲלֵיהֶם als auch das zusätzlich gesetzte מִלְמָעְלָה wieder, ohne die im Hebräischen vorhandene räumliche Verstärkung auszulassen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit sein Charakter als offenbarter Gottesname sichtbar bleibt; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Subjekt des singularischen וַיַּעֲמֹד
  choice: unbestimmtes singularisches „es“
  alternative: „sie blieben stehen“ mit Bezug auf Cherubim und Räder
  rationale: Die Übersetzung harmonisiert den auffälligen Singular nicht mit den vorausgehenden Pluralformen. Sie lässt offen, ob die zusammengesetzte Thronwagen-Erscheinung als Einheit gemeint ist.
- issue: Räumliche Doppelbestimmung עֲלֵיהֶם מִלְמָעְלָה
  choice: oben über ihnen
  alternative: über ihnen
  rationale: Die scheinbare Wiederholung wird beibehalten, weil sie im Ausgangstext ausdrücklich vorhanden ist und die erhöhte Stellung der Herrlichkeit betont.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder sind für gute Verständlichkeit leicht gegliedert, während der grammatische Singular, der Gottesname und die räumliche Verstärkung des Hebräischen bewusst erhalten bleiben.
