  terminology: „Kerubim“, „äußerer Vorhof“ und „der Allmächtige“ sind im biblisch-tempeltheologischen Register angemessen. Die Wiedergabe von אֵל שַׁדַּי als „Gottes, des Allmächtigen“ übersetzt den Titel, ohne eine über den Ausgangstext hinausgehende Deutung einzuführen.
