  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Bedeutungen des Hebräischen zuverlässig wieder: Das Flügelgeräusch ist bis zum äußeren Vorhof hörbar, gefolgt vom Vergleich mit der Stimme El Schaddais beim Sprechen. „War bis ... zu hören“ gibt נִשְׁמַע עַד idiomatisch und sachgerecht wieder. „Rauschen“ ist im Kontext mächtiger Flügel ein tragfähiges, nicht sinnveränderndes Verständnis von קוֹל.'
