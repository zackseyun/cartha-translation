source:
  edition: WLC
  text: וְ/קוֹל֙ כַּנְפֵ֣י הַ/כְּרוּבִ֔ים נִשְׁמַ֕ע עַד הֶ/חָצֵ֖ר הַ/חִיצֹנָ֑ה כְּ/ק֥וֹל אֵל שַׁדַּ֖י בְּ/דַבְּרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/005.yaml
  text: And the sound of the wings of the cherubim was heard as far as the outer court[a], like the sound of God Almighty when he speaks.
translation:
  language: de
  text: Und das Rauschen der Flügel der Kerubim war bis zum äußeren Vorhof zu hören, wie die Stimme Gottes, des Allmächtigen, wenn er spricht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקוֹל
  choice: Und das Rauschen
  rationale: קוֹל kann Klang, Geräusch oder Stimme bezeichnen. Bei Flügeln gibt „Rauschen“ das hörbare Phänomen im Deutschen natürlich und anschaulich wieder; וְ führt die Erzählung mit „Und“ fort.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: der Flügel der Kerubim
  rationale: Die Konstruktverbindung wird konkret und ohne die ergänzende Deutung „Flügelschläge“ wiedergegeben. „Kerubim“ ist die herkömmliche deutsche Form für diese himmlischen Wesen.
- source_word: נִשְׁמַע עַד
  choice: war bis … zu hören
  rationale: Der Niphal von שׁמע bezeichnet hier das Vernehmbarsein; עַד markiert die räumliche Reichweite. Diese deutsche Konstruktion ist zugleich genau und idiomatisch.
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: zum äußeren Vorhof
  rationale: Im Tempelzusammenhang ist „Vorhof“ die geläufige deutsche Wiedergabe von חָצֵר; חִיצֹנָה bezeichnet ihn als den äußeren.
- source_word: כְּקוֹל
  choice: wie die Stimme
  rationale: קוֹל kann in Bezug auf den sprechenden Gott sinnvoll als „Stimme“ wiedergegeben werden. Der Wechsel von „Rauschen“ zu „Stimme“ nutzt die Bedeutungsbreite desselben hebräischen Wortes und macht den Vergleich natürlich verständlich.
- source_word: אֵל שַׁדַּי
  choice: Gottes, des Allmächtigen
  rationale: Die appositionelle Form gibt beide Bestandteile des Gottestitels wieder und entspricht natürlichem, würdigem Deutsch, ohne den Titel als Eigennamen zu behandeln.
- source_word: בְּדַבְּרוֹ
  choice: wenn er spricht
  rationale: ב mit Infinitivus constructus und Suffix bezeichnet hier den zeitlichen Begleitumstand. Das Präsens beschreibt die charakteristische Wirkung der göttlichen Stimme.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  alternative: El Schaddai
  rationale: Der Ausdruck wird als verständlicher Gottestitel übersetzt. „Der Allmächtige“ ist die etablierte deutsche Entsprechung für שַׁדַּי; die Formulierung bewahrt אֵל ausdrücklich als „Gott“, ohne über den hebräischen Titel hinausgehende Lehrinhalte einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rauschen“ vermeidet beim Flügelgeräusch eine schwerfällige Wiederholung von „Stimme/Klang“, während „Stimme“ im Vergleich mit dem sprechenden Gott semantisch angemessen ist. Der Satzbau bleibt nah am hebräischen Vers und ist dennoch gut verständlich.
