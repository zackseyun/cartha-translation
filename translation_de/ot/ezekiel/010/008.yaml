  text: וַ/יֵּרָ֖א לַ/כְּרֻבִ֑ים תַּבְנִית֙ יַד אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/008.yaml
  text: And the cherubim appeared to have the form of a human hand under their wings[a].
translation:
  language: de
  text: Und an den Kerubim war unter ihren Flügeln die Gestalt einer Menschenhand zu sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Gestalt einer Hand eines Menschen“.'
    reason: Die Fußnote weist die hebräische nominale Genitivkonstruktion aus, während „Menschenhand“ im Haupttext idiomatisches modernes Deutsch ist.
lexical_decisions:
- source_word: וַיֵּרָא
  choice: wurde ... sichtbar
  rationale: Der Nifal von ראה hat hier passiv-visuellen Sinn. „Wurde sichtbar“ gibt die Beobachtung im Visionsbericht natürlich wieder, ohne die Erscheinung als bloßen Anschein abzuschwächen.
- source_word: לַכְּרֻבִים
  choice: bei den Kerubim
  rationale: Das ל bezeichnet hier am ehesten den Bereich bzw. die Wesen, an denen etwas sichtbar wird. „Bei den Kerubim“ bewahrt diese Zuordnung, statt die Kerubim syntaktisch zum Subjekt von „erscheinen“ umzudeuten.
- source_word: תַּבְנִית
  choice: etwas ..., das ... geformt war
  rationale: תַּבְנִית bezeichnet Gestalt, Form oder Abbild. Die Umschreibung ist im Deutschen natürlich und hält fest, dass die sichtbare Gestalt einer Hand entsprach.
- source_word: יַד אָדָם
  choice: eine Menschenhand
  rationale: Wörtlich steht „Hand eines Menschen“. Im anatomischen Vergleich bezeichnet אָדָם einen Menschen im Unterschied zu den visionären Wesen; „Menschenhand“ ist dafür die präzise und idiomatische deutsche Wiedergabe.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: unter ihren Flügeln
  rationale: Die schlichte räumliche Angabe wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe von אָדָם in der visionären Beschreibung
  choice: Menschenhand
  alternative: Hand eines Mannes
  rationale: אָדָם kann „Mensch“ oder kollektiv „Menschheit“ bedeuten und muss hier nicht spezifisch männliches Geschlecht markieren. Der Kontrast betrifft die menschliche Gestalt der Hand gegenüber den Kerubim; „Menschenhand“ bewahrt diesen Sinn ohne unnötige geschlechtliche Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kerubim“ folgt der im Deutschen etablierten biblischen Form. Die Satzstellung hält den Ort der sichtbaren Gestalt („bei den Kerubim“, „unter ihren Flügeln“) klar auseinander.
