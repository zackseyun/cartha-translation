  source_fidelity: Der Entwurf gibt die menschliche Handgestalt und ihre Lage unter den Flügeln zutreffend wieder. „Bei den Kerubim“ bleibt jedoch räumlich zu unbestimmt; das לָ hier bezeichnet die Kerubim als die Wesen, an denen die Gestalt sichtbar ist. Die Umschreibung „etwas sichtbar, das wie ... geformt war“ schwächt zudem die nominale Aussage „die Gestalt einer Menschenhand“ unnötig ab.
  naturalness: „An den Kerubim war unter ihren Flügeln die Gestalt einer Menschenhand zu sehen“ ist modernes, würdiges und idiomatisches Standarddeutsch. Es vermeidet das vage „etwas“ und stellt die Sichtbarkeit der Gestalt klar dar.
  terminology: „Kerubim“ ist als deutsche biblische Form passend. „Menschenhand“ gibt יַד אָדָם in diesem anatomischen Kontrast idiomatisch wieder, ohne ein im Hebräischen nicht gefordertes männliches Geschlecht festzulegen. Die Fußnote sollte die hebräische Genitivkonstruktion genauer abbilden.
