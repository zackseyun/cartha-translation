  text: As for their appearance[a], the four of them had one likeness[b], as when a wheel is within a wheel.
translation:
  language: de
  text: Ihr Aussehen war bei allen vieren gleich, wie wenn ein Rad in einem Rad ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַרְאֵיהֶם
  choice: Ihr Aussehen
  rationale: מַרְאֶה bezeichnet die sichtbare Erscheinung oder Gestalt. Das Präfix וּ wird im Deutschen nicht eigens mit „und“ wiedergegeben, da der Zusammenhang auch ohne Konjunktion natürlich fortgeführt wird.
- source_word: דְּמוּת אֶחָד לְאַרְבַּעְתָּם
  choice: war bei allen vieren gleich
  rationale: Wörtlich steht „eine Gestalt für ihre vier“. Die Formulierung gibt den hervorgehobenen gemeinsamen, identischen Anblick aller vier in natürlichem Deutsch wieder.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: Es war, als wäre
  rationale: Die Vergleichskonstruktion leitet das visionäre Bild ein. Der Konjunktiv „als wäre“ ist im modernen Deutschen die natürliche Form für einen solchen Vergleich.
- source_word: הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: ein Rad mitten im anderen Rad
  rationale: Obwohl beide Vorkommen von אוֹפַן im Hebräischen bestimmt sind, drückt die deutsche Formulierung das Verhältnis der beiden Räder idiomatisch und anschaulich aus. „Mitten in“ bewahrt den räumlichen Gehalt von בְּתוֹךְ.
