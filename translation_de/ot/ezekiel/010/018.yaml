source:
  edition: WLC
  text: וַ/יֵּצֵא֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַֽ/יַּעֲמֹ֖ד עַל הַ/כְּרוּבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/018.yaml
  text: Then the glory of Yahweh went out from above the threshold of the house and stood over the cherubim[a].
translation:
  language: de
  text: Da zog die Herrlichkeit Jahwes von oberhalb der Schwelle des Hauses[a] weg und stellte sich über die Kerubim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Tempels“. Hebräisch: „des Hauses“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … weg
  rationale: Die Erzählform von יצא bezeichnet eine Bewegung nach draußen beziehungsweise von einem Ort weg. „Zog … weg“ gibt die konkrete Bewegung natürlich wieder, ohne sie bereits als endgültiges Verlassen zu deuten.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die in der Vision wahrnehmbare Herrlichkeit beziehungsweise Gegenwart Jahwes. Die Genitivverbindung bildet die hebräische Konstruktverbindung klar ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: מֵעַל
  choice: von oberhalb
  rationale: Die Präposition bezeichnet die Bewegung weg von einer Position über der Schwelle. „Von oberhalb“ bewahrt diese räumliche Perspektive.
- source_word: מִפְתַּן
  choice: Schwelle
  rationale: מִפְתָּן bezeichnet die Schwelle beziehungsweise den Eingangssims; „Schwelle“ ist im Tempelkontext präzise und idiomatisch.
- source_word: הַבָּיִת
  choice: des Hauses
  rationale: Der hebräische Wortlaut lautet „das Haus“. Gemeint ist der Tempel, doch die Übersetzung bewahrt die konkrete Bezeichnung des Ausgangstextes und nennt die Alternative in einer Fußnote.
- source_word: וַיַּעֲמֹד
  choice: blieb … stehen
  rationale: עמד bedeutet „stehen“ oder „sich hinstellen“. Nach der vorausgehenden Bewegung drückt „blieb … stehen“ den erreichten Standort natürlich aus, ohne „zur Ruhe kommen“ in den Text hineinzutragen.
- source_word: עַל
  choice: über
  rationale: Im visionären Raumbild bezeichnet עַל hier die Position über den Kerubim; „über“ ist im Deutschen klarer als „auf“.
- source_word: הַכְּרוּבִים
  choice: den Kerubim
  rationale: „Kerubim“ ist die etablierte, aus dem Hebräischen übernommene Pluralform für diese besonderen himmlischen Wesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von הַבָּיִת
  choice: das Haus
  alternative: der Tempel
  rationale: Obwohl im Zusammenhang eindeutig der Tempel gemeint ist, steht im Hebräischen wörtlich „das Haus“. Die Übersetzung bewahrt diese Ausdrucksweise und erläutert die gemeinte Alternative in der Fußnote.
- issue: Charakter des Wegziehens der Herrlichkeit
  choice: konkrete räumliche Bewegung ohne Zusatzdeutung
  alternative: „verließ“ als stärker abschließende, theologisch deutende Formulierung
  rationale: יצא beschreibt zunächst die sichtbare Bewegung in der Vision. „Zog … weg“ vermeidet es, an dieser Stelle mehr Endgültigkeit auszudrücken, als der einzelne Satz ausdrücklich sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem Bewegungsablauf der Vision; „von oberhalb“ erhält die räumliche Genauigkeit, während „blieb … stehen“ im Deutschen natürlich klingt. Der Fußnotenmarker steht unmittelbar bei dem Wort, auf das sich die Erläuterung bezieht.
