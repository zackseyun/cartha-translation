base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/002.yaml
  text: And he said to the man clothed in linen[a], “Go in among the wheelwork, under the cherub, and fill your hands with coals of fire from among the cherubim, and scatter them over the city.” And he went in before my eyes.
translation:
  language: de
  text: 'Und er sagte zu dem in Leinen gekleideten Mann: »Geh mitten in das Räderwerk hinein, unter den Kerub, und fülle deine Hände mit glühenden Kohlen aus der Mitte der Kerubim und streue sie über die Stadt.« Und er ging vor meinen Augen hinein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבֻשׁ הַבַּדִּים
  choice: dem in Leinen gekleideten Mann
  rationale: Die partizipiale Wendung kennzeichnet die bereits eingeführte Gestalt durch ihre Kleidung. Die Formulierung ist natürlich und bewahrt den beschreibenden Charakter.
- source_word: בֵּינוֹת לַגַּלְגַּל
  choice: zwischen das Räderwerk
  rationale: גַּלְגַּל kann hier kollektiv die Räderkonstruktion des Thronwagens bezeichnen. „Räderwerk“ gibt diesen Zusammenhang wieder; „zwischen“ bewahrt die räumliche Bedeutung von בֵּינוֹת.
- source_word: אֶל תַּחַת לַכְּרוּב
  choice: unter den Kerub
  rationale: Die räumliche Wendung und der Singular des hebräischen Textes bleiben erhalten.
- source_word: וּמַלֵּא חָפְנֶיךָ
  choice: fülle deine Hände
  rationale: חָפְנַיִם bezeichnet die hohlen beziehungsweise zusammengehaltenen Hände. Die deutsche Wendung ist verständlich, ohne das Bild unnötig auszudeuten.
- source_word: גַחֲלֵי אֵשׁ
  choice: glühende Kohlen
  rationale: Die idiomatische deutsche Wiedergabe vermittelt das Bild feuriger Kohlen prägnant und ohne eine zusätzliche symbolische Deutung.
- source_word: מִבֵּינוֹת לַכְּרֻבִים
  choice: aus dem Raum zwischen den Kerubim
  rationale: Die Formulierung macht den räumlichen Ursprung der Kohlen deutlich und gibt den Plural Kerubim wieder.
- source_word: וּזְרֹק עַל הָעִיר
  choice: dann streue sie über die Stadt
  rationale: Das im Hebräischen implizite Objekt wird im Deutschen mit „sie“ aufgenommen. „Streue“ passt zur Verteilung der Kohlen, ohne die Gerichtssymbolik ausdrücklich zu erklären.
- source_word: לְעֵינָי
  choice: vor meinen Augen
  rationale: Die geläufige deutsche Wendung bewahrt Hesekiels Perspektive als Augenzeuge der Vision.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: er sagte
  rationale: Die unmittelbare Wiederholung des hebräischen Redeverbs dient der Einführung des Zitats. Im natürlichen Deutschen genügt ein einziges „sagte“, ohne Informationsverlust.
theological_decisions:
- issue: Bedeutung des Ausstreuens der Kohlen
  choice: Der Befehl wird als visionäre Handlung wiedergegeben, ohne seine Symbolik im Haupttext ausdrücklich als Gericht festzulegen.
  alternative: Die Handlung ausdrücklich als Gericht über Jerusalem oder zugleich als Reinigung erklären.
  rationale: Der Kontext legt Gericht nahe, doch der Vers selbst deutet das Bild nicht aus. Die Übersetzung bewahrt daher die theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache der Thronwagenvision bleibt konkret; ungewöhnliche Fachbegriffe werden nicht geglättet. „Kerub/Kerubim“ folgt der hebräischen Form und vermeidet eine Gleichsetzung mit späteren volkstümlichen Engelsdarstellungen.
