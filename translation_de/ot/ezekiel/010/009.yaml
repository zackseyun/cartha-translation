base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/009.yaml
  text: And I looked[a], and behold, four wheels beside the cherubim, one wheel beside each cherub; and the appearance of the wheels was like beryl stone.
translation:
  language: de
  text: 'Und ich sah: Siehe, da waren vier Räder neben den Cherubim, je ein Rad neben jedem Cherub. Die Räder sahen aus wie ein Tarschisch-Stein[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Tarschisch-Stein“. Welcher Edelstein gemeint ist, lässt sich nicht sicher bestimmen; vorgeschlagen werden unter anderem Beryll und Chrysolith.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Und ich sah
  rationale: ראה bedeutet hier im Bericht über die Vision schlicht „sehen“. „Ich sah“ gibt die Wahrnehmung direkt wieder und verbindet sich im Deutschen natürlich mit dem folgenden „Siehe“.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Das traditionelle, weiterhin verständliche „Siehe“ bewahrt die anschauliche und aufmerksamkeitslenkende Kraft des hebräischen Ausdrucks.
- source_word: אַרְבָּעָה אוֹפַנִּים
  choice: vier Räder
  rationale: אוֹפַן bezeichnet in Ezechiels Thronvision die Räder; die Wiedergabe ist unmittelbar und kontextgerecht.
- source_word: אֵצֶל הַכְּרוּבִים
  choice: neben den Cherubim
  rationale: אֵצֶל bezeichnet räumliche Nähe. „Neben“ ist präzise und natürlich; „Cherubim“ ist die im Deutschen etablierte Form des hebräischen Plurals.
- source_word: אוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד
  choice: je ein Rad neben jedem Cherub
  rationale: Die wiederholte Verbindung von אֶחָד („einer“) hat distributiven Sinn. Die deutsche Formulierung macht diesen Bezug klar, ohne die hebräische Aussage inhaltlich zu erweitern.
- source_word: וּמַרְאֵה הָאוֹפַנִּים כְּעֵין
  choice: Die Räder sahen aus wie
  rationale: Die idiomatische Formulierung gibt den visuellen Vergleich von מַרְאֶה und כְּעֵין natürlich wieder, ohne ihn einseitig auf Farbe oder Glanz festzulegen.
- source_word: אֶבֶן תַּרְשִׁישׁ
  choice: Tarschisch-Stein
  rationale: Die genaue Identität des Edelsteins ist unsicher. Die lautnahe Wiedergabe „Tarschisch-Stein“ bewahrt diese Unsicherheit besser als eine Festlegung auf Beryll, Chrysolith oder einen anderen Stein.
theological_decisions: []
translation_notes:
  register: Moderne, klare Standardsprache mit dem visionstypischen und würdevollen Signalwort „Siehe“. Der Doppelpunkt strukturiert den Wahrnehmungsbericht natürlich. Die distributive Wendung „je ein … jedem“ vermeidet eine im Deutschen missverständliche wörtliche Wiederholung.
