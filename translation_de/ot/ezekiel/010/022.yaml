  text: וּ/דְמ֣וּת פְּנֵי/הֶ֔ם הֵ֣מָּה הַ/פָּנִ֗ים אֲשֶׁ֤ר רָאִ֨יתִי֙ עַל נְהַר כְּבָ֔ר מַרְאֵי/הֶ֖ם וְ/אוֹתָ֑/ם אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/022.yaml
  text: And the likeness of their faces was the same as the faces that I had seen by the Kebar River—their appearances and themselves[b][a]. Each one went straight ahead.
translation:
  language: de
  text: Und die Gestalt ihrer Gesichter war dieselbe wie die der Gesichter, die ich am Fluss Kebar gesehen hatte – ihr Aussehen und sie selbst.[a] Jeder ging geradeaus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr Aussehen und sie selbst“. Die Formulierung betont, dass es dieselben Wesen waren, die Ezechiel zuvor am Fluss Kebar gesehen hatte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Jeder ging in die Richtung seines Gesichts“, das heißt, ohne sich beim Weitergehen umzudrehen oder abzubiegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: Und die Gestalt
  rationale: דְּמוּת bezeichnet Gestalt, Ähnlichkeit oder Erscheinungsform. „Gestalt“ bewahrt die konkrete Bildsprache der Vision und klingt im Deutschen natürlicher als „Ähnlichkeit ihrer Gesichter“.
- source_word: פְּנֵיהֶם / הַפָּנִים
  choice: ihrer Gesichter … der Gesichter
  rationale: פָּנִים wird konkret als „Gesichter“ wiedergegeben, damit die mehrgesichtige Erscheinung der Wesen nicht zu einem bloß allgemeinen Aussehen verflacht.
- source_word: הֵמָּה
  choice: war dieselbe wie die
  rationale: Das betonte Pronomen setzt die gegenwärtig gesehenen Gesichter mit denen der früheren Vision gleich. Die deutsche Gleichsetzungsformulierung gibt dies verständlich wieder.
- source_word: אֲשֶׁר רָאִיתִי
  choice: die ich … gesehen hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass die frühere Schau am Kebar zeitlich vor der gegenwärtigen Vision liegt.
- source_word: עַל נְהַר כְּבָר
  choice: am Fluss Kebar
  rationale: עַל bezeichnet hier den Ort am beziehungsweise beim Fluss; „am Fluss Kebar“ ist die natürliche deutsche Ortsangabe.
- source_word: מַרְאֵיהֶם וְאוֹתָם
  choice: ihr Aussehen und sie selbst
  rationale: Die gedrängte hebräische Wendung wird bewusst nicht geglättet. Sie unterstreicht, dass sowohl die Erscheinung als auch die Wesen selbst mit denen der früheren Vision identisch waren.
- source_word: אִישׁ אֶל עֵבֶר פָּנָיו יֵלֵכוּ
  choice: Jeder ging geradeaus
  rationale: Wörtlich bewegt sich jeder in die Richtung seines Gesichts. Im Kontext bezeichnet dies eine geradlinige Bewegung ohne Abbiegen; „ging geradeaus“ gibt das Idiom klar und knapp wieder.
