base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/012.yaml
  text: And all their bodies[a], their backs, their hands, their wings[b], and the wheels were full of eyes all around—the wheels belonging to the four of them.
translation:
  language: de
  text: Und ihr ganzer Körper[a], ihre Rücken, ihre Hände, ihre Flügel und die Räder waren ringsum voller Augen – die Räder aller vier.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ihr ganzes Fleisch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die knappe hebräische Schlusswendung lässt sich auch wiedergeben: „die zu allen vieren gehörenden Räder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂרָם
  choice: ihr ganzer Körper
  rationale: בָּשָׂר bedeutet wörtlich „Fleisch“, bezeichnet hier in der Aufzählung der Körperteile aber den gesamten körperlichen Leib der Wesen. „Körper“ ist im heutigen Deutsch natürlich und bewahrt den konkreten Sinn.
- source_word: גַבֵּיהֶם
  choice: ihre Rücken
  rationale: Im Zusammenhang mit Körper, Händen und Flügeln ist die anatomische Bedeutung „Rücken“ am wahrscheinlichsten; mögliche Bedeutungen wie „Ränder“ oder „Höhen“ passen hier weniger gut.
- source_word: יְדֵיהֶם
  choice: ihre Hände
  rationale: יָד bezeichnet gewöhnlich die Hand; der Kontext gibt keinen zwingenden Grund, allgemeiner mit „Arme“ zu übersetzen.
- source_word: כַנְפֵיהֶם
  choice: ihre Flügel
  rationale: כָּנָף bezeichnet bei den visionären Wesen Ezechiels ihre Flügel.
- source_word: הָאוֹפַנִּים
  choice: die Räder
  rationale: אוֹפַן bezeichnet ein Rad. Das konkrete Bild der Vision wird beibehalten und nicht umschrieben.
- source_word: מְלֵאִים עֵינַיִם
  choice: waren voller Augen
  rationale: Die hebräische Fügung bedeutet wörtlich „voll von Augen“. Die deutsche Formulierung ist zugleich quellennah und verständlich.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ gibt die Bedeutung „auf allen Seiten“ knapp und idiomatisch wieder.
- source_word: לְאַרְבַּעְתָּם ... אוֹפַנֵּיהֶם
  choice: die Räder aller vier
  rationale: Die knappe Schlusswendung ordnet die Räder den vier Wesen zu. Die Wiederaufnahme von „Räder“ wird bewahrt, während die schwerfällige hebräische Konstruktion in verständliches Deutsch gebracht wird.
