translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählungsstruktur und die auffällige Wiederaufnahme der Räder am Versende bleiben erhalten; die Schlusswendung wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
