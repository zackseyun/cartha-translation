source:
  edition: WLC
  text: הֶ/חָמָ֥ס קָ֖ם לְ/מַטֵּה רֶ֑שַׁע לֹא מֵ/הֶ֞ם וְ/לֹ֧א מֵ/הֲמוֹנָ֛/ם וְ/לֹ֥א מֶ/הֱמֵ/הֶ֖ם וְ/לֹא נֹ֥הַּ בָּ/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/011.yaml
  text: Violence has arisen into a rod of wickedness[a]; none of them remains, none of their multitude, none of their wealth[b], and there is no eminence among them.
translation:
  language: de
  text: Die Gewalt hat sich zu einem Stab der Bosheit erhoben. Nichts bleibt von ihnen, nichts von ihrer Menge, nichts von ihrem Reichtum[a]; es gibt kein Ansehen unter ihnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das zugrunde liegende hebräische Wort ist unsicher und kann auch „Fülle“ oder „Getümmel“ bedeuten. Die ganze Reihe ist elliptisch; wörtlicher: „nicht von ihnen, nicht von ihrer Menge und nicht von ihrer Fülle/ihrem Getümmel“.'
    reason: alternative_reading
  - marker: b
    text: Das seltene hebräische Wort für „Ansehen“ ist in seiner Bedeutung unsicher; möglich sind auch „Vorrang“ oder „Erhabenheit“. Manche verstehen die Wendung insgesamt anders.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָמָס
  choice: die Gewalttat
  rationale: חָמָס bezeichnet Gewalt, Unrecht oder gewaltsames Unrecht. „Die Gewalttat“ bewahrt die markante Personifizierung am Satzanfang.
- source_word: קָם
  choice: ist aufgestanden
  rationale: Das Qal-Perfekt von קום beschreibt ein Sich-Erheben oder Aufstehen. Die konkrete Bildsprache wird im Deutschen gewahrt.
- source_word: לְמַטֵּה רֶשַׁע
  choice: als ein Stab der Bosheit
  rationale: מַטֶּה bedeutet Stab oder Rute; hier liegt im Gerichtszusammenhang ein Herrschafts- oder Züchtigungsbild nahe. רֶשַׁע behält mit „Bosheit“ seinen moralischen Gehalt. Das ל wird aufgrund der metaphorischen Prädikation mit „als“ wiedergegeben.
- source_word: לֹא מֵהֶם
  choice: Nichts bleibt von ihnen
  rationale: 'Die hebräische Wendung ist elliptisch: wörtlich steht nur „nicht von ihnen“. „Bleibt“ ergänzt das im Gerichtskontext naheliegende Prädikat, während „nichts“ die Mehrdeutigkeit zwischen Personen und Besitz nicht unnötig verengt.'
- source_word: וְלֹא מֵהֲמוֹנָם
  choice: nichts von ihrer Menge
  rationale: הָמוֹן kann Menge, Fülle oder Getümmel bedeuten. „Menge“ passt zur Reihe dessen, was im Gericht nicht bestehen bleibt.
- source_word: וְלֹא מֶהֱמֵהֶם
  choice: nichts von ihrem Reichtum
  rationale: Die schwierige Form wird im Kontext als Hinweis auf Fülle oder Vermögen verstanden. „Reichtum“ ergibt eine verständliche Steigerung; die lexikalische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְלֹא נֹהַּ בָּהֶם
  choice: kein Ansehen ist unter ihnen
  rationale: נֹהַּ ist selten und unsicher. „Ansehen“ gibt die mögliche Bedeutung von Rang, Vorrang oder Hervorgehobensein in natürlichem Deutsch wieder, ohne die Unsicherheit zu verschweigen.
theological_decisions:
- issue: Elliptische und lexikalisch unsichere Aussagen innerhalb der Gerichtsankündigung
  choice: Die Reihe wird als Aussage wiedergegeben, dass von den Menschen, ihrer Menge und ihrem Reichtum nichts bleibt und unter ihnen kein Ansehen besteht.
  alternative: Die Präpositionalwendungen könnten streng wörtlich und entsprechend dunkel als „nicht von ihnen, nicht von ihrer Menge, nicht von ihrer Fülle/ihrem Getümmel“ wiedergegeben werden; die Schlusswendung könnte auch anders gedeutet werden.
  rationale: Der weitere Zusammenhang von Hesekiel 7 spricht von umfassendem Gericht. Das ergänzte „bleibt“ macht die Ellipse verständlich, ohne eine zusätzliche theologische Aussage einzuführen. Die Unsicherheit der letzten Glieder bleibt durch die Fußnoten sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, harte Abfolge des hebräischen Gerichtswortes wird bewahrt. Unvermeidliche Ergänzungen zur Auflösung der Ellipse werden gering gehalten; seltene und umstrittene Wörter werden nicht stillschweigend vereindeutigt.
