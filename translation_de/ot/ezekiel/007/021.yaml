  text: וּ/נְתַתִּ֤י/ו בְּ/יַֽד הַ/זָּרִים֙ לָ/בַ֔ז וּ/לְ/רִשְׁעֵ֥י הָ/אָ֖רֶץ לְ/שָׁלָ֑ל ו/חלל/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/021.yaml
  text: And I will give it into the hand of foreigners for plunder[a], and to the wicked of the earth for spoil[b], and they will profane it.
translation:
  language: de
  text: Ich werde es in die Hand von Fremden geben, den Fremden zum Raub und den Gottlosen der Erde[a] zur Beute; sie werden es entweihen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Landes“. Das hebräische Wort kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „entheiligen“ oder „verunreinigen“. Das Verb bezeichnet hier die Profanierung dessen, was heilig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיו
  choice: Ich werde es geben
  rationale: Die Form bezeichnet im prophetischen Zusammenhang eine künftige Handlung Gottes; das maskuline Suffix wird entsprechend dem vorausgehenden Bezugswort mit „es“ wiedergegeben.
- source_word: בְּיַד
  choice: in die Hand von
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt oder Verfügungsgewalt anderer. Das Handbild bleibt im Deutschen verständlich und wahrt die Ausdrucksweise des Ausgangstextes.
- source_word: הַזָּרִים
  choice: Fremden
  rationale: Gemeint sind hier Außenstehende beziehungsweise fremde Eindringlinge. „Fremde“ ist im Deutschen natürlich und lässt die genaue ethnische oder politische Zuordnung offen.
- source_word: לָבַז
  choice: damit sie es rauben
  rationale: בַּז bezeichnet gewaltsam erlangtes Raubgut. Die verbale Wiedergabe formuliert die Zweck- beziehungsweise Ergebnisbeziehung der Präposition לְ in natürlichem Deutsch.
- source_word: וּלְרִשְׁעֵי הָאָרֶץ
  choice: und den Gottlosen der Erde
  rationale: רְשָׁעִים sind Menschen, die als gottlos oder schuldig gelten. אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten; die weitere Bedeutung steht im Haupttext, während die engere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: לְשָׁלָל
  choice: zur Beute
  rationale: שָׁלָל bezeichnet Beute oder Plündergut. „Zur Beute“ bewahrt den nominalen Ausdruck und den Parallelismus zu בַּז, ohne im Deutschen schwerfällig zu wirken.
- source_word: וְחִלְּלוּהָ
  choice: Sie werden es entweihen
  rationale: Das Piel von חלל bezeichnet hier die Profanierung dessen, was heilig ist. „Entweihen“ gibt diesen sakralen Sinn im modernen Deutschen klarer wieder als ein allgemeines „verunreinigen“.
theological_decisions:
- issue: Wiedergabe von חלל im Zusammenhang mit Heiligkeit
  choice: entweihen
  alternative: entheiligen; verunreinigen
  rationale: „Entweihen“ bewahrt den Gedanken, dass etwas Heiliges profan behandelt wird, ohne die Aussage auf bloße rituelle oder materielle Verunreinigung zu verengen.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Das hebräische Wort lässt beide Bedeutungen zu. Der Haupttext vermeidet mit „Erde“ eine vorschnelle regionale Eingrenzung; „Land“ wird wegen der echten kontextuellen Mehrdeutigkeit als Alternative genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „in die Hand geben“ erhält das hebräische Bild, während „damit sie es rauben“ die Zweck- oder Ergebnisbeziehung idiomatisch ausdrückt. Die beiden kurzen deutschen Sätze machen den abschließenden Akt der Entweihung deutlich, ohne die inhaltliche Verbindung zum Vorhergehenden zu lösen.
