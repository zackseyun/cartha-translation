  text: כַּסְפָּ֞/ם בַּ/חוּצ֣וֹת יַשְׁלִ֗יכוּ וּ/זְהָבָ/ם֮ לְ/נִדָּ֣ה יִֽהְיֶה֒ כַּסְפָּ֨/ם וּ/זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה נַפְשָׁ/ם֙ לֹ֣א יְשַׂבֵּ֔עוּ וּ/מֵעֵי/הֶ֖ם לֹ֣א יְמַלֵּ֑אוּ כִּֽי מִכְשׁ֥וֹל עֲוֺנָ֖/ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/019.yaml
  text: They will throw their silver into the streets[a], and their gold will become an unclean thing. Their silver and their gold will not be able to deliver them in the day of Yahweh’s wrath. They will not satisfy their appetite, nor fill their stomachs, for it has become the stumbling block of their iniquity.
translation:
  language: de
  text: Sie werden ihr Silber auf die Straßen werfen, und ihr Gold wird zu etwas Unreinem werden[a]. Ihr Silber und ihr Gold werden sie am Tag des Zorns Jahwes nicht retten können. Ihr Silber und ihr Gold werden weder ihren Hunger stillen noch ihre Mägen füllen können, denn sie waren der Stolperstein ihrer Schuld.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ihr Gold wird zur Unreinheit werden.“ Das hebräische Wort kann Menstruationsunreinheit bezeichnen und ruft damit die Vorstellung von etwas kultisch Unreinem und Abstoßendem hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפָּם
  choice: ihr Silber
  rationale: כֶּסֶף kann Silber oder Geld bezeichnen. Die Parallele zu „Gold“ und das Bild weggeworfener Edelmetalle sprechen hier für die konkrete Wiedergabe „Silber“.
- source_word: בַּחוּצוֹת יַשְׁלִיכוּ
  choice: auf die Straßen werfen
  rationale: חוּצוֹת bezeichnet Straßen oder öffentliche Plätze; „auf die Straßen werfen“ ist im Deutschen natürlich und bewahrt die öffentliche, verächtliche Preisgabe des Silbers.
- source_word: לְנִדָּה יִהְיֶה
  choice: wird zu etwas Unreinem werden
  rationale: נִדָּה bezeichnet Unreinheit und kann besonders Menstruationsunreinheit meinen. Im Haupttext gibt „etwas Unreines“ die metaphorische Abscheulichkeit wieder, ohne die spezifischere Konnotation auszuschließen.
- source_word: לֹא יוּכַל לְהַצִּילָם
  choice: werden sie ... nicht retten können
  rationale: Das singularische Verb kann sich kollektiv auf Silber und Gold beziehen. „Retten“ gibt die Unfähigkeit des Reichtums wieder, Menschen aus dem kommenden Gericht zu befreien.
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: am Tag des Zorns Jahwes
  rationale: עֶבְרָה bezeichnet heftigen Zorn. Der Gottesname יְהוָה wird in deutscher Form als „Jahwe“ wiedergegeben.
- source_word: נַפְשָׁם לֹא יְשַׂבֵּעוּ
  choice: Sie werden ihren Hunger nicht stillen
  rationale: נֶפֶשׁ bezeichnet im Zusammenhang mit dem Füllen der Eingeweide das leibliche Verlangen beziehungsweise den Hunger. Diese Wiedergabe vermeidet die irreführende Abstraktion „Seele“.
- source_word: וּמֵעֵיהֶם לֹא יְמַלֵּאוּ
  choice: und ihre Mägen nicht füllen
  rationale: מֵעֶה bezeichnet die inneren Organe oder den Bauch; im Zusammenhang mit Nahrung ist „Mägen“ eine klare, natürliche Wiedergabe.
- source_word: כִּי מִכְשׁוֹל עֲוֺנָם הָיָה
  choice: denn es war der Stolperstein ihrer Schuld
  rationale: Die knappe Formulierung bewahrt das Bild des מִכְשׁוֹל als Stolperstein und lässt die enge Beziehung zwischen Reichtum, Anstoß und Schuld bestehen, ohne sie durch eine zusätzliche Kausaldeutung aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen und entspricht der im modernen Deutschen üblichen Form.
- issue: Spezifität von נִדָּה
  choice: etwas Unreines
  alternative: Menstruationsunreinheit; etwas Abstoßendes
  rationale: Das Wort kann ausdrücklich Menstruationsunreinheit bezeichnen, wird hier jedoch metaphorisch auf Gold bezogen. Der Haupttext hält den weiteren kultischen Sinn fest; die Fußnote bewahrt die konkretere Konnotation.
- issue: Bedeutung von נַפְשָׁם
  choice: ihren Hunger
  alternative: ihre Seele; ihr Verlangen
  rationale: Der Parallelismus mit dem Füllen der Mägen weist auf körperlichen Hunger. Die Übersetzung macht daher keine anthropologische Aussage über eine immaterielle Seele.
- issue: Beziehung zwischen Reichtum und Schuld im Schlusssatz
  choice: es war der Stolperstein ihrer Schuld
  alternative: ihr Reichtum brachte sie zu Fall und machte sie schuldig
  rationale: Die gewählte Form bewahrt die verdichtete und etwas mehrdeutige Genitivverbindung des Hebräischen, statt genauer festzulegen, ob der Reichtum Ursache, Ausdruck oder Anlass ihrer Schuld war.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Konkrete Körperbegriffe und das prophetische Bild vom „Stolperstein“ bleiben erhalten; unnötig kirchensprachliche oder konfessionell geprägte Formulierungen werden vermieden.
