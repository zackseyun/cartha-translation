source:
  edition: WLC
  text: וְ/לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמ֑וֹל כִּ/דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה מַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/009.yaml
  text: My eye will not spare[a], nor will I show pity. I will bring your ways upon you, and your abominations will be in your midst. Then you will know that I am Yahweh[c][b], who strikes.
translation:
  language: de
  text: Mein Auge wird dich nicht verschonen[a], und ich werde kein Mitleid haben. Ich werde dir deine Wege auferlegen[b], und deine Gräuel werden in deiner Mitte sein. Dann werdet ihr erkennen, dass ich Jahwe[c] bin, der schlägt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mein Auge wird nicht verschonen.“ Die Wendung mit „Auge“ ist ein hebräisches Bild für mitleidiges Verschonen; im Deutschen ist „dich“ ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Deinen Wegen entsprechend werde ich auf dich geben/legen.“ Gemeint ist, dass Jahwe ihnen ihr eigenes Verhalten als Gericht auferlegt.'
    reason: lexical_alternative
  - marker: c
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit „der HERR“ wiedergegeben wird.
    reason: cultural_note
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Mein Auge wird dich nicht verschonen
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom Auge und gibt חוס im Gerichtszusammenhang als „verschonen“ wieder. Das im Hebräischen nur erschließbare Objekt wird im Deutschen durch „dich“ ergänzt.
- source_word: אֶחְמוֹל
  choice: ich werde kein Mitleid haben
  rationale: חמל bezeichnet hier Erbarmen oder Mitleid. Die Formulierung unterscheidet den Ausdruck vom parallelen „verschonen“, ohne den Bedeutungszusammenhang aufzulösen.
- source_word: כִדְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: Deine Wege lasse ich auf dich zurückfallen
  rationale: „Wege“ bezeichnet das Verhalten der Angeredeten. „Auf dich zurückfallen“ hält das konkrete Vergeltungsbild fest und klingt zugleich in modernem Deutsch verständlich.
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: deine abscheulichen Taten
  rationale: תועבות bezeichnet stark verabscheute, häufig kultisch oder moralisch verwerfliche Praktiken. „Abscheuliche Taten“ ist verständlich und vermeidet, dass „Gräuel“ nur als Gegenstände aufgefasst wird.
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: werden mitten unter dir sein
  rationale: Die räumliche Bildhaftigkeit von בְּתוֹכֵךְ bleibt erhalten. Die feminine Singularanrede bezieht sich wahrscheinlich auf das personifizierte Land bzw. Jerusalem, während die folgende Pluralform die Bewohner anspricht.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: „Dann“ verdeutlicht die Folgewirkung des Gerichts; der Wechsel zum Plural wird bewahrt. „Erkennen“ gibt die erfahrungsbezogene Erkenntnisformel angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname JHWH wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מַכֶּה
  choice: der zuschlägt
  rationale: Das Partizip kennzeichnet Jahwe als den, der das Gericht vollzieht. „Zuschlägt“ ist aktiv, gegenwärtig verständlich und bewahrt die Härte des Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ wahrt den Charakter als Eigenname, während „der HERR“ eine traditionelle Ersatzlesung ist.
- issue: Aussagekraft der Schlussformel מַכֶּה
  choice: der zuschlägt
  alternative: der schlägt / der euch schlägt
  rationale: Die attributive Partizipialform wird als Kennzeichnung göttlichen Handelns erhalten. Ein Objekt wie „euch“ wird nicht ergänzt, da es im Hebräischen fehlt und die Aussage bewusst knapp ist.
- issue: Numeruswechsel zwischen der angeredeten Größe und ihren Bewohnern
  choice: Singular „dich/dir“, danach Plural „ihr“
  alternative: durchgehend pluralische Anrede
  rationale: Die hebräischen Formen wechseln ausdrücklich vom femininen Singular zum Plural. Der deutsche Text bewahrt diese Spannung, statt die personifizierte Größe und ihre Bewohner stillschweigend gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Härte. Der auffällige Wechsel von femininer Singularanrede zu pluralischer Anrede bleibt erhalten. Archaische Wörter wie „erbarmen“ in unpersönlicher Konstruktion oder „Gräuel“ wurden zugunsten allgemein verständlicher, dennoch gewichtiger Formulierungen vermieden.
