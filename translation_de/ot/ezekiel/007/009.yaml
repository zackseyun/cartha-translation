  naturalness: Der Text ist im Allgemeinen modernes, verständliches Standarddeutsch. „Ich werde dir deine Wege auferlegen“ ist natürlich und wahrt zugleich das konkrete Vergeltungsbild. „Deine Gräuel“ ist im prophetischen Kontext ein etabliertes, prägnantes Wort und gibt den starken Ausdruck genauer wieder als „abscheuliche Taten“.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Gräuel“ bewahrt das Gewicht von תּוֹעֵבוֹת, ohne eine bestimmte Art von Verfehlung einzuengen. Das Partizip מַכֶּה wird sachnäher mit „der schlägt“ wiedergegeben; ein Objekt wird nicht ergänzt.
