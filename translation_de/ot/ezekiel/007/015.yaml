source:
  edition: WLC
  text: הַ/חֶ֣רֶב בַּ/ח֔וּץ וְ/הַ/דֶּ֥בֶר וְ/הָ/רָעָ֖ב מִ/בָּ֑יִת אֲשֶׁ֤ר בַּ/שָּׂדֶה֙ בַּ/חֶ֣רֶב יָמ֔וּת וַ/אֲשֶׁ֣ר בָּ/עִ֔יר רָעָ֥ב וָ/דֶ֖בֶר יֹאכֲלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
translation:
  language: de
  text: Draußen ist das Schwert, drinnen sind Seuche[a] und Hungersnot. Wer auf dem Feld ist, wird durch das Schwert sterben; und wer in der Stadt ist, den werden Hungersnot und Seuche verzehren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pest“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Hungersnot und Seuche werden ihn essen“.'
    reason: metaphor
lexical_decisions:
- source_word: הַחֶרֶב
  choice: das Schwert
  rationale: Die konkrete Bedeutung wird beibehalten; zugleich kann das Schwert hier als Bild für gewaltsamen Tod im Krieg stehen.
- source_word: בַּחוּץ
  choice: draußen
  rationale: Das Adverb bildet im Deutschen einen natürlichen und prägnanten Gegensatz zu מִבָּיִת.
- source_word: הַדֶּבֶר
  choice: Pest
  rationale: דֶּבֶר bezeichnet in prophetischen Gerichtsformeln eine tödliche Seuche. „Pest“ wahrt den gehobenen, biblisch-prophetischen Klang; „Seuche“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: הָרָעָב
  choice: Hunger
  rationale: Im Zusammenhang bezeichnet רָעָב die durch Mangel verursachte Hungersnot beziehungsweise das Verhungern. „Hunger“ klingt in der personifizierenden Aussage „verzehren“ natürlich und kräftig.
- source_word: מִבָּיִת
  choice: drinnen
  rationale: Wörtlich bezeichnet die Wendung den inneren Bereich („von innen her“, „im Innern“) als Gegenpol zu „draußen“. Sie muss nicht auf ein einzelnes Haus eingeschränkt werden.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: wer auf dem Feld ist
  rationale: Die distributive singularische Relativkonstruktion wird in natürlichem Deutsch bewahrt.
- source_word: בַּחֶרֶב יָמוּת
  choice: wird durch das Schwert sterben
  rationale: Dies folgt eng der hebräischen Aussage, ohne die handelnde Instanz ausdrücklich zu ergänzen.
- source_word: וַאֲשֶׁר בָּעִיר
  choice: und wer in der Stadt ist
  rationale: Die Formulierung erhält den Gegensatz zwischen Feld und Stadt sowie den distributiven Singular.
- source_word: רָעָב וָדֶבֶר
  choice: Hunger und Pest
  rationale: Die Reihenfolge des zweiten Satzteils folgt dem Hebräischen und wird nicht an die erste Aufzählung angeglichen.
- source_word: יֹאכֲלֶנּוּ
  choice: den werden … verzehren
  rationale: Das Verb bedeutet wörtlich „essen/fressen“. „Verzehren“ bewahrt die Personifikation und ist zugleich idiomatisches, würdiges Deutsch.
theological_decisions:
- issue: Dreigliedrige Gerichtssprache
  choice: Die konkreten Bilder „Schwert“, „Pest“ und „Hunger“ bleiben stehen.
  alternative: Die Begriffe verallgemeinernd als Krieg, Krankheit und Not wiedergeben.
  rationale: Die feste prophetische Gerichtssprache trägt die literarische und theologische Spannung des Verses; eine erklärende Verallgemeinerung würde sie abschwächen.
- issue: Singularische Personenreferenz
  choice: Die Konstruktion „wer … den“ bewahrt den distributiven Singular.
  alternative: Pluralisch „alle, die … sie“ formulieren.
  rationale: Das Hebräische verwendet zweimal eine singularische Relativkonstruktion und anschließend ein Suffix der dritten Person maskulin Singular. Das Deutsche kann diese Struktur mit dem geschlechtsübergreifend verwendbaren Relativpronomen „wer“ natürlich wiedergeben.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die parallelen Ortsgegensätze „draußen/drinnen“ und „Feld/Stadt“ sowie die Personifikation von Hunger und Pest bleiben deutlich erhalten.
