base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/022.yaml
  text: I will turn my face away from them[a], and they will profane my treasured place[b]; violent men will enter it and profane it.
translation:
  language: de
  text: Ich werde mein Angesicht von ihnen abwenden, und sie werden meine Kostbarkeit[a] entweihen. Gewalttäter[b] werden in sie eindringen und sie entweihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „meinen verborgenen Schatz“, „meinen geheimen Ort“ oder „mein verborgenes Heiligtum“. Das hebräische Wort bezeichnet etwas Verborgenes, Verwahrtes oder Kostbares und bezieht sich hier wahrscheinlich auf etwas, das mit dem Heiligtum verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „rücksichtslose Menschen“, „Gewalttätige“ oder „Räuber“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִבּוֹתִי
  choice: Ich werde … abwenden
  rationale: Das Hifil von סבב steht im prophetischen Gerichtszusammenhang mit futurischer Bedeutung. Die deutsche Wendung verbindet das Verb natürlich mit „mein Angesicht“ und „von ihnen“.
- source_word: פָנַי מֵהֶם
  choice: mein Angesicht von ihnen
  rationale: „Mein Angesicht“ bewahrt das hebräische Bild für Gottes zugewandte Gegenwart und Gunst; „von ihnen abwenden“ ist im Deutschen idiomatisch.
- source_word: וְחִלְּלוּ
  choice: sie werden … entweihen
  rationale: Das Piel von חלל bezeichnet die Verletzung der Heiligkeit. „Entweihen“ gibt den sakralen Gegensatz klar und allgemein verständlich wieder.
- source_word: צְפוּנִי
  choice: mein Kostbarstes
  rationale: Das von צפן abgeleitete Wort bezeichnet etwas Verborgenes, Verwahrtes oder Kostbares. „Mein Kostbarstes“ wahrt die Offenheit zwischen Schatz, geschütztem Gegenstand und kostbarem heiligem Bereich, ohne den Bezug ausdrücklich auf den Tempel festzulegen.
- source_word: וּבָאוּ בָהּ
  choice: werden dort eindringen
  rationale: בוא mit ב bezeichnet das Hineinkommen. „Dort eindringen“ entspricht dem feindlichen Kontext und vermeidet im Deutschen einen unklaren pronominalen Rückbezug.
- source_word: פָּרִיצִים
  choice: Gewalttäter
  rationale: פָּרִיצִים bezeichnet gewalttätige, rücksichtslose oder gesetzlose Menschen. „Gewalttäter“ ist prägnant und schränkt die Bedeutung nicht auf Räuber ein.
- source_word: וְחִלְּלוּהָ
  choice: und es entweihen
  rationale: Die Wiederholung von חלל wird mit „entweihen“ beibehalten und unterstreicht die Schändung dessen, was Gott kostbar und heilig ist.
theological_decisions:
- issue: Bezug von צְפוּנִי und den folgenden femininen Suffixen
  choice: צְפוּנִי wird offen als „mein Kostbarstes“ wiedergegeben; „dort“ zeigt den wahrscheinlichen räumlichen Bezug an, ohne ihn genauer zu bestimmen.
  alternative: „mein verborgener Schatz“, „mein geheimer Ort“ oder ausdrücklich „mein Heiligtum“; die femininen Suffixe können sich möglicherweise auf die Stadt, das Land oder einen heiligen Bereich beziehen.
  rationale: Der Zusammenhang spricht für etwas Kostbares und Geschütztes, wahrscheinlich in Verbindung mit dem Heiligtum. Der hebräische Wortlaut nennt den genauen Gegenstand jedoch nicht eindeutig. Deshalb wird weder ausschließlich der Tempel noch ausschließlich ein materieller Schatz festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ bewahrt bewusst das biblische Beziehungsbild, während „Kostbarstes“ die echte lexikalische und sachliche Mehrdeutigkeit des hebräischen Textes erhält. Die Wiederholung von „entweihen“ entspricht der rhetorischen Wiederholung im Ausgangstext.
