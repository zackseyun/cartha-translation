revisions:
- from: Ich werde mein Angesicht von ihnen abwenden, und sie werden mein Kostbarstes[a] entweihen. Gewalttäter[b] werden dort eindringen und es entweihen.
  to: Ich werde mein Angesicht von ihnen abwenden, und sie werden meine Kostbarkeit[a] entweihen. Gewalttäter[b] werden in sie eindringen und sie entweihen.
  rationale: Die Revision bewahrt die lexikalische Offenheit von צְפוּנִי, vermeidet aber die syntaktische Distanz zwischen „Kostbarstes“, „dort“ und „es“. Mit „meine Kostbarkeit“ sowie der Wiederaufnahme durch „in sie“ und „sie“ wird der direkte, im hebräischen Text vorhandene, aber sachlich nicht eindeutig aufgelöste Bezug natürlicher wiedergegeben. Es wird nicht festgelegt, ob der Ausdruck einen Schatz, einen geschützten Bereich oder einen mit dem Heiligtum verbundenen Ort bezeichnet.
