  text: הֹוָ֤ה עַל הֹוָה֙ תָּב֔וֹא וּ/שְׁמֻעָ֥ה אֶל שְׁמוּעָ֖ה תִּֽהְיֶ֑ה וּ/בִקְשׁ֤וּ חָזוֹן֙ מִ/נָּבִ֔יא וְ/תוֹרָה֙ תֹּאבַ֣ד מִ/כֹּהֵ֔ן וְ/עֵצָ֖ה מִ/זְּקֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/026.yaml
  text: Disaster upon disaster will come[a], and rumor upon rumor will arise. They will seek a vision from a prophet, but instruction will perish from the priest[b], and counsel from the elders.
translation:
  language: de
  text: Unheil über Unheil wird kommen, und Nachricht auf Nachricht wird eintreffen.[a] Sie werden bei einem Propheten eine Vision suchen, und Weisung wird dem Priester verloren gehen und Rat den Ältesten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kunde auf Kunde“, „Bericht auf Bericht“ oder „Gerücht auf Gerücht“. Das hebräische Wort kann eine Nachricht, Kunde, einen Bericht oder ein Gerücht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gesetz“ oder „Unterweisung“. Das hebräische Wort Tora bezeichnet hier wahrscheinlich die Weisung, die man vom Priester erwartete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹוָה עַל הֹוָה
  choice: Unheil über Unheil
  rationale: הֹוָה bezeichnet zerstörerisches Unheil. Die Wiederholung und עַל zeichnen eine sich auftürmende Folge von Katastrophen; die deutsche Wendung bewahrt diese Zuspitzung.
- source_word: שְׁמֻעָה אֶל שְׁמוּעָה
  choice: Schreckensnachricht auf Schreckensnachricht
  rationale: שְׁמוּעָה kann Nachricht, Kunde, Bericht oder Gerücht bedeuten. Im Gerichtskontext liegt alarmierende Kunde nahe; „Schreckensnachricht“ gibt diese Wirkung natürlich wieder, ohne den Wahrheitsgehalt ausdrücklich als bloßes Gerücht festzulegen.
- source_word: תִּהְיֶה
  choice: wird folgen
  rationale: Das allgemeinere היה wird im Deutschen kontextgemäß wiedergegeben. „Folgen“ macht die fortlaufende Kette von Nachrichten verständlich und entspricht der akkumulierenden Konstruktion.
- source_word: וּבִקְשׁוּ חָזוֹן מִנָּבִיא
  choice: Dann werden sie bei einem Propheten eine Vision suchen
  rationale: בקשׁ bezeichnet aktives Suchen oder Erbitten, חָזוֹן prophetische Offenbarung. Das artikellose נָבִיא wird als unbestimmt verstanden; „bei“ ist für das Einholen einer Auskunft im Deutschen natürlicher als „von“.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: תּוֹרָה kann Gesetz, Lehre oder Weisung bedeuten. In Verbindung mit dem Priester bezeichnet es hier am ehesten autoritative priesterliche Unterweisung; „Weisung“ wahrt zugleich den möglichen rechtlichen Klang.
- source_word: תֹּאבַד מִכֹּהֵן
  choice: dem Priester wird die Weisung fehlen
  rationale: אבד bezeichnet Verlorengehen oder Verschwinden. Die idiomatische deutsche Formulierung macht deutlich, dass die übliche priesterliche Weisung nicht mehr verfügbar sein wird, ohne eine Vernichtung der Tora als Schrift zu behaupten.
- source_word: עֵצָה מִזְּקֵנִים
  choice: den Ältesten der Rat
  rationale: Die knappe Ellipse des Hebräischen wird im Deutschen parallel zum vorherigen Satzglied formuliert. „Älteste“ bezeichnet die anerkannte Gruppe gesellschaftlicher Führungspersonen.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im priesterlichen Zusammenhang
  choice: Weisung
  alternative: Gesetz; Unterweisung; Lehre
  rationale: Der Vers schildert den Ausfall der anerkannten Instanzen prophetischer, priesterlicher und gemeinschaftlicher Orientierung. „Weisung“ umfasst priesterliche Unterweisung und rechtliche Auskunft, ohne die Bedeutung vorschnell auf das Gesetz als feststehenden Schriftbestand zu verengen.
- issue: Institutioneller oder individueller Sinn von Prophet und Priester
  choice: „einem Propheten“ unbestimmt, „dem Priester“ generisch
  alternative: „dem Propheten … einem Priester“ oder beide unbestimmt
  rationale: נָבִיא und כֹּהֵן stehen ohne Artikel. Beim Propheten gibt „einem“ die Suche nach prophetischer Offenbarung wieder; „dem Priester“ bezeichnet idiomatisch das priesterliche Amt. Gemeint ist der Zusammenbruch der üblichen Leitungsfunktionen, nicht zwingend der Ausfall bestimmter Einzelpersonen.
- issue: Art der שְׁמוּעָה
  choice: Schreckensnachricht
  alternative: Gerücht; Nachricht; Kunde; Bericht
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob die Meldung bestätigt ist. „Schreckensnachricht“ bewahrt den Schwerpunkt auf der alarmierenden Wirkung im Gerichtskontext; die Fußnote nennt die lexikalische Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Nominalwendungen erhalten den eindringlichen Rhythmus des Hebräischen. „Schreckensnachricht“ vermeidet die unbelegte Festlegung auf unwahre Gerüchte; „Weisung“ hält die Bedeutungsbreite von תּוֹרָה offen.
