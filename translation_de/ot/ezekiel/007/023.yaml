base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
translation:
  language: de
  text: Fertige die Kette an[a], denn das Land ist voll von Bluttaten[b], und die Stadt ist voll von Gewalt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fessel“ beziehungsweise „Bindung“. Das seltene hebräische Wort weist wahrscheinlich auf Gefangenschaft oder Fesselung unter dem kommenden Gericht hin.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Rechtsspruch von Blut“. Gemeint sein können Blutschuld, mörderisches Unrecht oder Verbrechen, die Gericht nach sich ziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה
  choice: Fertige … an
  rationale: Der Qal-Imperativ 2. Person maskulin Singular ist ein unmittelbarer Befehl. „Anfertigen“ passt natürlich zu einem konkreten Gegenstand.
- source_word: הָרַתּוֹק
  choice: die Kette
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich eine Kette oder Fessel. „Kette“ bewahrt das konkrete Bild von Gefangenschaft und bevorstehendem Gericht; der Artikel wird mit „die“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Befehls ein; „denn“ wahrt den knappen prophetischen Zusammenhang.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Gerichtskontext ist das territorial verstandene „Land“ gemeint, nicht die gesamte Erde.
- source_word: מָלְאָה
  choice: ist voll von
  rationale: Die Zustandsaussage des Perfekts wird im Deutschen idiomatisch mit dem Präsens wiedergegeben.
- source_word: מִשְׁפַּט דָּמִים
  choice: Bluttaten
  rationale: Die schwierige Verbindung bedeutet wörtlich etwa „Rechtsspruch/Urteil von Blut“. „Bluttaten“ vermittelt knapp die forensische und gewalttätige Dimension, während eine Fußnote die echte Bedeutungsbreite offenlegt.
- source_word: וְהָעִיר
  choice: und die Stadt
  rationale: Die einfache Verbindung und der bestimmte Artikel werden direkt wiedergegeben; im Kontext ist wahrscheinlich Jerusalem gemeint, ohne dass dies im Text ausdrücklich ergänzt wird.
- source_word: חָמָס
  choice: Gewalt
  rationale: „Gewalt“ ist eine etablierte, natürliche Wiedergabe und umfasst hier brutales Unrecht sowie Unterdrückung.
theological_decisions:
- issue: Deutung des Gerichtsbildes הָרַתּוֹק
  choice: Eine konkrete oder symbolische Kette als Zeichen des kommenden Gerichts und der Gefangenschaft
  alternative: Eine Fessel für Gefangene oder allgemeiner eine Bindung im Rahmen der Belagerung
  rationale: Der Zusammenhang von Hesekiel 7 spricht von Einfall, Strafe und dem Ende der Sicherheit. Das konkrete Bild „Kette“ bleibt erhalten, ohne seine genaue Funktion dogmatisch festzulegen.
- issue: Bedeutung von מִשְׁפַּט דָּמִים
  choice: Bluttaten als blutige Verbrechen beziehungsweise mit Blut belastetes Unrecht
  alternative: Blutschuld, mörderische Rechtsprechung oder ein Gerichtsurteil wegen Blutvergießens
  rationale: Die hebräische Verbindung ist mehrdeutig. Der Haupttext soll verständlich sein; die Fußnote bewahrt die forensische Spannung und nennt die wesentlichen Deutungsmöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Das wiederholte „voll von“ bildet die Parallelstruktur des Hebräischen ab. Die seltene Gerichtsmetapher und die schwierige forensische Wortverbindung werden im Haupttext klar, in den Fußnoten jedoch bewusst mehrdeutig wiedergegeben.
