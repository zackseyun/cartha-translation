  to: Seht, der Tag! Seht, es kommt! Das Verhängnis[a] ist hervorgebrochen; der Stab hat ausgeschlagen, der Hochmut ist aufgeblüht.
  rationale: Die Revision ersetzt die nicht durch die hebräische Grammatik gestützte maskuline Rückverweisung „er kommt“ durch das im Deutschen natürliche, unpersönliche „es kommt“. Damit bleibt offen, worauf die feminine hebräische Form genauer zielt, während die textliche Dringlichkeit erhalten bleibt. Die Fußnote wird idiomatisch geglättet und bewahrt die umstrittene Lesart.
