  text: הִנֵּ֥ה הַ/יּ֖וֹם הִנֵּ֣ה בָאָ֑ה יָֽצְאָה֙ הַ/צְּפִרָ֔ה צָ֚ץ הַ/מַּטֶּ֔ה פָּרַ֖ח הַ/זָּדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/010.yaml
  text: Look[a], the day! Look, it comes! Doom has gone out; the rod has budded; arrogance has blossomed.
translation:
  language: de
  text: Seht, der Tag! Seht, es kommt! Das Verhängnis[a] ist hervorgebrochen; der Stab hat ausgeschlagen, der Hochmut ist aufgeblüht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Der Morgen bricht an. Das hebräische Wort ist schwierig und kann wörtlich den „Morgen“ oder bildlich die eingetretene verhängnisvolle Wende bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die deiktische Partikel ruft mit prophetischer Dringlichkeit zur Aufmerksamkeit. „Seht“ ist gegenwärtiges, würdiges Deutsch; die Wiederholung bewahrt die rhetorische Wucht.
- source_word: הַיּוֹם
  choice: der Tag
  rationale: Die knappe hebräische Wendung bleibt ohne deutende Ergänzung wie „des Gerichts“ erhalten.
- source_word: בָאָה
  choice: er kommt
  rationale: Obwohl die hebräische Form formal Perfekt ist, kündigt sie das unmittelbar und gewiss Eintretende an. Das deutsche Präsens gibt diese lebendige Nähe natürlich wieder; das Pronomen bezieht sich im Deutschen auf „der Tag“.
- source_word: יָצְאָה
  choice: ist hervorgebrochen
  rationale: Die Wiedergabe wahrt die Bewegung des Heraus- beziehungsweise Hervortretens und klingt im Deutschen bei einem hereinbrechenden Verhängnis natürlicher als „ist ausgegangen“.
- source_word: הַצְּפִרָה
  choice: das Verhängnis
  rationale: Das schwierige Substantiv bezeichnet im Gerichtszusammenhang wahrscheinlich die verhängnisvolle Wende beziehungsweise das hereinbrechende Unheil. „Verhängnis“ wahrt den schicksalhaften Klang; die mögliche wörtliche Deutung „Morgen“ steht in der Fußnote.
- source_word: צָץ
  choice: hat ausgeschlagen
  rationale: „Ausschlagen“ bewahrt das Bild einer Pflanze, die sichtbar austreibt, und verbindet sich im Deutschen passend mit „Stab“.
- source_word: הַמַּטֶּה
  choice: der Stab
  rationale: „Stab“ ist die formale und bildlich offene Wiedergabe; der Zusammenhang kann einen Schlag- oder Zuchtstab nahelegen, ohne dass dies im Vers ausdrücklich festgelegt wird.
- source_word: פָּרַח
  choice: ist aufgeblüht
  rationale: Die Pflanzenmetaphorik und der Parallelismus zum ausschlagenden Stab bleiben erhalten.
- source_word: הַזָּדוֹן
  choice: der Hochmut
  rationale: Das Wort bezeichnet stolze, vermessene Überheblichkeit. „Hochmut“ ist idiomatisch, moralisch deutlich und passt zum gehobenen prophetischen Register.
theological_decisions:
- issue: Deutung von הַצְּפִרָה im Gerichtswort
  choice: Im Haupttext steht „das Verhängnis“.
  alternative: „der Morgen“ beziehungsweise „die Wende“
  rationale: Der unmittelbare Zusammenhang kündigt Gericht und Unheil an, sodass „Verhängnis“ den wahrscheinlichsten kontextuellen Sinn vermittelt. Weil das seltene hebräische Wort umstritten ist, wird die mögliche konkrete Bedeutung „Morgen“ nicht beseitigt, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen Ausrufen und bewahrter Wiederholung. Die Wachstumsmetaphern werden durch „ausgeschlagen“ und „aufgeblüht“ deutlich parallel geführt; die schwer deutbare Gerichtsterminologie wird nicht stillschweigend vereindeutigt.
