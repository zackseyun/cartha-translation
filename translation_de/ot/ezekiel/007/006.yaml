  text: קֵ֣ץ בָּ֔א בָּ֥א הַ/קֵּ֖ץ הֵקִ֣יץ אֵלָ֑יִ/ךְ הִנֵּ֖ה בָּאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/006.yaml
  text: An end has come; the end has come. It has awakened against you; look, it is coming.
translation:
  language: de
  text: Ein Ende ist gekommen; das Ende ist gekommen. Es ist gegen dich erwacht; siehe, es kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵץ / הַקֵּץ
  choice: das Ende
  rationale: Gibt das unbestimmte erste קֵץ und das bestimmte zweite הַקֵּץ idiomatisch wieder; im Deutschen ist der Artikel auch in der ersten Zeile natürlich.
- source_word: בָּא / בָּאָה
  choice: kommt
  rationale: Das hebräische Perfekt bezeichnet hier das unmittelbar bevorstehende und als sicher dargestellte Eintreffen; das deutsche Präsens bewahrt Dringlichkeit und Wiederholung.
- source_word: הֵקִיץ אֵלָיִךְ
  choice: Es ist gegen dich erwacht
  rationale: Bewahrt die auffällige Personifikation des Endes und die feindliche Ausrichtung von אֵלַיִךְ, ohne das Bild erklärend aufzulösen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Ein gegenwärtiger deutscher Aufmerksamkeitsruf, der die eindringliche Funktion von הִנֵּה wiedergibt.
theological_decisions:
- issue: Personifikation des Endes
  choice: „Es ist gegen dich erwacht“
  alternative: „Es erhebt sich gegen dich“ oder „Es ist für dich angebrochen“
  rationale: Der masoretische Text verwendet ausdrücklich קיץ im Hifil („erwachen/aufwachen“). Die ungewöhnliche Personifikation und ihre bedrohliche Spannung sollen erhalten bleiben.
- issue: Zeitbezug von בָּא
  choice: Präsens „kommt“
  alternative: Perfekt „ist gekommen“
  rationale: Das hebräische Perfekt kann die Gewissheit und Unmittelbarkeit des angekündigten Gerichts ausdrücken. Im Vers folgt zudem הִנֵּה בָאָה, sodass „kommt“ die dynamische Ankunft im Deutschen am klarsten vermittelt, ohne die Erfüllungsgewissheit zu leugnen.
translation_notes:
  register: Kurze, rhythmische und eindringliche Gerichtssprache. Die Wiederholung des Ausgangstextes bleibt vollständig erhalten; Ausrufezeichen bilden den prophetischen Alarmton natürlich ab.
