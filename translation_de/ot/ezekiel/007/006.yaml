  naturalness: „Ein Ende ist gekommen; das Ende ist gekommen“ ist modernes, verständliches Deutsch und bewahrt zugleich die eindringliche Wiederholung. „Es ist gegen dich erwacht“ erhält die absichtsvoll ungewöhnliche Personifikation. „Siehe“ ist hier als knapper prophetischer Aufmerksamkeitsruf registergerecht.
  terminology: „Ende“ entspricht קֵץ. Die Wiedergabe von הֵקִיץ mit „ist ... erwacht“ erhält das Wortspiel bzw. die Personifikation, ohne es theologisch auszudeuten.
