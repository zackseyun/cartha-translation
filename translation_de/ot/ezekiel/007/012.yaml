  text: בָּ֤א הָ/עֵת֙ הִגִּ֣יעַ הַ/יּ֔וֹם הַ/קּוֹנֶה֙ אַל יִשְׂמָ֔ח וְ/הַ/מּוֹכֵ֖ר אַל יִתְאַבָּ֑ל כִּ֥י חָר֖וֹן אֶל כָּל הֲמוֹנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/012.yaml
  text: The time has come[a]; the day has arrived. Let not the buyer rejoice, and let not the seller mourn[b], for wrath is against all her multitude.
translation:
  language: de
  text: Die Zeit ist gekommen; der Tag ist da. Der Käufer soll sich nicht freuen und der Verkäufer nicht trauern, denn Zorn richtet sich gegen ihre gesamte Menge.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen all ihren Reichtum“ beziehungsweise „gegen all ihren Besitz“. Das hebräische Wort kann außer einer Menschenmenge auch Fülle oder Besitz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen ein feminines „ihre“. Gemeint sein kann die personifizierte Stadt, das Land oder die Gemeinschaft, die unter dem Gericht steht.
    reason: cultural_note
lexical_decisions:
- source_word: בָּא הָעֵת
  choice: Die Zeit ist gekommen
  rationale: Das Perfekt בָּא verkündet den entscheidenden Zeitpunkt als bereits eingetreten; das deutsche Perfekt gibt dies natürlich und nachdrücklich wieder.
- source_word: הִגִּיעַ הַיּוֹם
  choice: der Tag ist da
  rationale: הִגִּיעַ bezeichnet das Erreichen beziehungsweise Eintreffen. „Ist da“ bildet die parallele Aussage knapp und idiomatisch ab, ohne sie mit der ersten Satzhälfte unnötig gleichförmig zu machen.
- source_word: הַקּוֹנֶה
  choice: der Käufer
  rationale: Das substantivierte Partizip bezeichnet allgemein den Kaufenden; „Käufer“ ist die natürliche moderne Entsprechung.
- source_word: אַל יִשְׂמָח
  choice: soll sich nicht freuen
  rationale: אַל mit Imperfekt drückt hier eine verneinte Aufforderung aus. Die Formulierung wahrt diesen Sinn in natürlichem, würdigem Deutsch.
- source_word: הַמּוֹכֵר
  choice: der Verkäufer
  rationale: Das substantivierte Partizip steht parallel zu „der Käufer“ und wird entsprechend wiedergegeben.
- source_word: אַל יִתְאַבָּל
  choice: soll ... nicht trauern
  rationale: Das Verb bezeichnet Trauer oder Klage; „trauern“ bewahrt die emotionale Aussage und passt zum möglichen Verlust beim Verkauf.
- source_word: חָרוֹן
  choice: der Zorn
  rationale: Das Wort bezeichnet heftigen, brennenden Zorn. „Der Zorn“ ist im Zusammenhang gewichtig und klar, ohne eine Ergänzung in den Text einzutragen.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: richtet sich gegen ihre ganze Menge
  rationale: אֶל trägt im Gerichtszusammenhang feindliche Ausrichtung; „gegen“ gibt dies angemessen wieder. כָּל umfasst die Gesamtheit des folgenden Kollektivbegriffs.
theological_decisions:
- issue: Bezug des femininen Suffixes in הֲמוֹנָהּ
  choice: „ihre ganze Menge“ bewahrt das feminine Possessivpronomen, ohne dessen Bezug ausdrücklich festzulegen.
  alternative: „dessen ganze Menge“, „die ganze Bevölkerung“ oder „all ihren Reichtum“
  rationale: Das Hebräische enthält ein feminines Singularsuffix, dessen Bezug im Zusammenhang eine personifizierte Stadt, das Land oder die Gemeinschaft sein kann. „Ihre“ erhält diese Personifikation und lässt den genauen Bezug offen.
- issue: Bedeutung von הָמוֹן
  choice: „Menge“
  alternative: „Reichtum“ oder „Besitz“
  rationale: Der Kollektivsinn „Menge“ ist hier im Gerichtswort gut begründet und erhält zugleich die Mehrdeutigkeit des möglichen Bezugs. Die sachlich mögliche Bedeutung „Reichtum/Besitz“ wird in einer Fußnote genannt, statt den Haupttext darauf festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Parallelität der beiden Eröffnungssätze und der Gegensatz zwischen Käufer und Verkäufer bleiben erhalten; echte lexikalische und referenzielle Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
