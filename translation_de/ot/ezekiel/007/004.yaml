base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/004.yaml
  text: My eye will not spare you[a], nor will I have pity; for I will bring your ways upon you, and your abominations will be within you[b]. Then you will know that I am Yahweh.
translation:
  language: de
  text: Mein Auge wird dich nicht verschonen[a], und ich werde kein Mitleid haben. Denn ich werde deine Wege über dich bringen, und deine Abscheulichkeiten werden in deiner Mitte sein[b]. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Auge wird kein Mitleid mit dir haben.“ Im Hebräischen bezeichnet die Wendung mit „Auge“ bildhaft das Schonen oder Erbarmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden in dir sein“. Die knappe hebräische Wendung kann sowohl „in deiner Mitte“ als auch „in dir“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: Mein Auge wird dich nicht verschonen
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom Auge als Ausdruck des Schonens oder Erbarmens. Eine Fußnote erläutert die idiomatische Bedeutung.
- source_word: אֶחְמֹל
  choice: und ich werde kein Mitleid haben
  rationale: Die Formulierung unterscheidet חמל von dem vorhergehenden חוס und erhält so die rhetorische Doppelung.
- source_word: דְרָכַיִךְ
  choice: deine Wege
  rationale: „Wege“ bewahrt die hebräische Metapher für Lebensführung und Verhalten, ohne sie vorschnell auszudeuten.
- source_word: עָלַיִךְ אֶתֵּן
  choice: werde … über dich bringen
  rationale: Die Wendung erhält die Vergeltungsmetapher, nach der die eigenen Wege auf die Angeredete zurückkommen, ohne ausdrücklich „bestrafen“ hinzuzufügen.
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: und deine Gräueltaten
  rationale: „Gräueltaten“ gibt die starke moralische und kultische Abscheu von תועבות in gegenwärtigem, verständlichem Deutsch wieder.
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: werden in deiner Mitte sein
  rationale: Die räumliche und bewusst knappe Ausdrucksweise des Hebräischen bleibt erhalten; die Wendung kann sowohl das Vorhandensein in Jerusalem als auch unter seinen Bewohnern bezeichnen.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: '„Dann“ macht die resultative Folge des Gerichts deutlich. Der Wechsel vom femininen Singular zum Plural wird bewahrt: Zunächst ist die Stadt angeredet, anschließend ihre Bewohner.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Göttliches Gericht und Vergeltungsformel
  choice: ich werde deine Wege über dich bringen
  alternative: ich werde dich für deine Wege bestrafen
  rationale: Das Hebräische nennt nicht ausdrücklich das Verb „bestrafen“, sondern schildert, wie die Wege der Angeredeten über sie gebracht werden. Die Übersetzung bewahrt dieses Bild und seine gerichtliche Spannung.
- issue: Numeruswechsel in der Anrede
  choice: dich/deine … dann werdet ihr
  alternative: durchgehend „du“ oder durchgehend „ihr“
  rationale: Der hebräische Text wechselt vom femininen Singular, der die personifizierte Stadt anspricht, zum Plural der Erkenntnisformel. Dieser nicht zufällig einzueb­nende Wechsel bleibt sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. Die feminine Singularanrede Jerusalems ist im Deutschen an „dich/deine“ nicht als feminin erkennbar, doch der anschließende Wechsel zum Plural „ihr“ wird erhalten.
