base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/020.yaml
  text: And they made the beauty of his ornament into pride[a], and in it they made the images of their abominations, their detestable things[b]; therefore I have made it an unclean thing to them.
translation:
  language: de
  text: Und die Schönheit seines Schmucks machten sie zum Anlass für Hochmut.[a] Daraus[b] fertigten sie Bilder ihrer Gräuel, ihre abscheulichen Götzen. Darum machte ich ihn für sie zu etwas Unreinem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb steht formal im Singular: »machte er ihn«. Der Zusammenhang legt eine kollektive Beziehung auf die Menschen nahe. Möglich ist auch: »Die Schönheit seines Schmucks hatte er zur Pracht bestimmt« — mit Gott als Handelndem.'
    reason: textual_ambiguity
  - marker: b
    text: 'Oder: »Darin«. Die hebräische Wendung kann den Ort oder den verwendeten Stoff beziehungsweise das Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: »Etwas Unreines« gibt ein hebräisches Wort aus dem Bereich ritueller Unreinheit wieder; auch »etwas Abzustoßendes« ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבִי עֶדְיוֹ
  choice: Und die Schönheit seines Schmucks
  rationale: צְבִי bezeichnet hier Schönheit oder Pracht und bestimmt עֶדְיוֹ, »seinen Schmuck«. Die Formulierung wahrt den Singular und den nicht näher bestimmten männlichen Bezug des Suffixes.
- source_word: לְגָאוֹן שָׂמָהוּ
  choice: machten sie zum Anlass für Hochmut
  rationale: גָּאוֹן kann Hoheit, Stolz oder Hochmut bezeichnen. Im Gerichtskontext und angesichts des folgenden Götzendienstes passt die negative Bedeutung »Hochmut«. »Zum Anlass für« gibt den resultativen Sinn idiomatisch wieder; die auffällige Singularform des hebräischen Verbs wird in einer Fußnote offengelegt.
- source_word: וְצַלְמֵי תוֹעֲבֹתָם
  choice: Bilder ihrer Gräuel
  rationale: צֶלֶם bedeutet »Bild«, תּוֹעֵבָה eine abscheuliche, besonders kultisch-götzendienerische Sache. »Gräuel« bewahrt die starke religiös-moralische Wertung ohne die Konstruktion unnötig auszudeuten.
- source_word: שִׁקּוּצֵיהֶם
  choice: ihre abscheulichen Götzen
  rationale: שִׁקּוּץ bezeichnet häufig einen verabscheuten Kultgegenstand oder Götzen. Die Wiedergabe benennt im gegebenen Kontext den wahrscheinlichen Referenten und unterscheidet den Ausdruck sprachlich von תּוֹעֵבָה.
- source_word: עָשׂוּ בוֹ
  choice: Daraus fertigten sie
  rationale: Die Präposition ב kann hier Stoff oder Mittel, aber auch den Ort bezeichnen. »Daraus« ergibt im Zusammenhang mit kostbarem Schmuck und der Anfertigung von Bildern einen natürlichen Sinn; »darin« bleibt als Alternative in der Fußnote erhalten.
- source_word: נְתַתִּיו לָהֶם לְנִדָּה
  choice: Darum machte ich ihn für sie zu etwas Unreinem
  rationale: נָתַן mit einer ל-Prädikativfügung kann hier »zu etwas machen/bestimmen« bedeuten. נִדָּה trägt die Vorstellung kultischer Unreinheit und, davon abgeleitet, des Abstoßenden oder Auszusondernden.
theological_decisions:
- issue: Negativer oder positiver Sinn von גָּאוֹן
  choice: Hochmut
  alternative: Hoheit oder Pracht
  rationale: Die unmittelbare Verbindung mit der Herstellung verabscheuter Bilder legt den anklagenden Sinn »Hochmut« nahe, ohne die allgemeine Bedeutung von גָּאוֹן grundsätzlich darauf zu beschränken.
- issue: Charakter der durch נִדָּה bezeichneten Verunreinigung
  choice: etwas Unreines
  alternative: etwas Abzustoßendes oder Auszusonderndes
  rationale: Die Formulierung wahrt die kultisch-rituelle Färbung des Wortes und zugleich seine moralische Funktion im Gerichtswort, ohne den körperlichen Hintergrund des Begriffs unnötig in den Haupttext einzutragen.
- issue: Referent und Zahl des Handelnden in שָׂמָהוּ
  choice: 'kontextbezogene Wiedergabe im Plural: »machten sie«'
  alternative: 'formal singularisch: »machte er«; möglicherweise mit Gott als Subjekt und גָּאוֹן im Sinn von »Pracht«'
  rationale: Das punktierte Verb ist formal 3. Person Singular mit Objektsuffix, während der folgende Satz ausdrücklich das Handeln der Menschen im Plural beschreibt. Der Haupttext folgt diesem unmittelbaren Zusammenhang; die morphologische Spannung und die mögliche alternative Deutung werden nicht verschwiegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt bildhaft und bewahrt die Pronomenkette des Hebräischen. »Gräuel« setzt bewusst einen gehobenen biblischen Akzent, während »abscheuliche Götzen« den gemeinten Kultzusammenhang für heutige Leser verständlich macht.
