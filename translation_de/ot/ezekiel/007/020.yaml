review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von נְתַתִּיו ... לְנִדָּה als „machte ich ihn für sie zu etwas Unreinem“ trifft den Gerichtssinn und die kultische Konnotation gut. Auch die zweite Satzhälfte gibt die Bilder, Gräuel und verabscheuungswürdigen Kultobjekte im Wesentlichen zutreffend wieder. Die erste Satzhälfte sollte jedoch nicht ohne Weiteres in den Plural gesetzt werden: שָׂמָהוּ ist im masoretischen Text formal 3. Person feminin Singular mit Objektsuffix. Eine Deutung mit Gott als Subjekt ist möglich und sollte im Haupttext nicht durch „machten sie“ ausgeschlossen werden.'
  naturalness: Die revidierte Fassung ist moderne, verständliche Standardsprache. „zur Pracht bestimmt“ ist in diesem prophetischen Register natürlich und wahrt die semantische Offenheit von לְגָאוֹן zwischen Pracht/Majestät und Stolz besser als „zum Anlass für Hochmut“.
  terminology: „Schönheit seines Schmucks“, „Bilder ihrer Gräuel“, „abscheuliche Götzen“ und „etwas Unreinem“ sind passend. Die Fußnote zu „daraus“ sollte präzisieren, dass ב sowohl Stoff/Mittel als auch Ort bezeichnen kann. Die bisherige Fußnote a enthält zudem eine unzutreffende formale Beschreibung als maskulinen Singular („machte er ihn“), obwohl die Verbform feminin Singular ist.
  issues:
  - severity: high
    issue: Die Hauptübersetzung glättet שָׂמָהוּ zu einem pluralischen „machten sie“.
    rationale: Die masoretische Form ist formal feminin Singular. Zwar ist die syntaktische Zuordnung schwierig und eine kollektive bzw. kontextuelle Deutung wird vertreten, aber die Pluralisierung im Haupttext legt eine Lösung fest, die der Form nicht entspricht. Die mögliche Deutung mit Gott als Handelndem muss erhalten bleiben.
  - severity: medium
    issue: Fußnote a bezeichnet die Verbform als „machte er ihn“.
    rationale: שָׂמָהוּ ist formal 3. Person feminin Singular, nicht maskulin Singular. Die Fußnote muss dies korrekt benennen und die mögliche Subjektzuordnung vorsichtig formulieren.
  - severity: low
    issue: „zum Anlass für Hochmut“ deutet die Präpositionalfügung stärker aus als erforderlich.
    rationale: לְגָאוֹן kann hier auch Pracht oder Majestät bezeichnen. „zur Pracht bestimmt“ bewahrt die positive Lesart, die besonders bei möglichem göttlichem Subjekt naheliegt, ohne die folgende Götzenkritik abzuschwächen.
  revised_text: Und die Schönheit seines Schmucks bestimmte er zur Pracht.[a] Daraus[b] fertigten sie Bilder ihrer Gräuel, ihre abscheulichen Götzen. Darum machte ich ihn für sie zu etwas Unreinem.[c]
  revised_footnotes:
  - marker: a
    text: 'Das hebräische Verb steht formal in der 3. Person feminin Singular: »sie bestimmte es«. Das Subjekt ist nicht ausdrücklich genannt. Es kann sich auf eine feminine Größe im Zusammenhang beziehen; nach verbreiteter Deutung ist Gott gemeint. Die Bedeutung von »zur Pracht« kann auch »zum Stolz« oder »zur Majestät« sein.'
    reason: textual_ambiguity
  - marker: b
    text: 'Oder: »darin«. Die hebräische Wendung kann den Ort oder den verwendeten Stoff beziehungsweise das Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: »Etwas Unreines« gibt ein hebräisches Wort aus dem Bereich ritueller Unreinheit wieder; auch »etwas Abzustoßendes« ist möglich.
    reason: lexical_alternative
  revision_rationale: Die Revision korrigiert die formale Analyse von שָׂמָהוּ und verhindert, dass die Hauptübersetzung eine umstrittene pluralische Subjektdeutung festschreibt. Zugleich bleibt die knappe, würdige Sprache erhalten. Die Fußnoten bewahren die syntaktische und lexikalische Mehrdeutigkeit, ohne eine konfessionelle oder interpretative Lösung vorzuschreiben.
