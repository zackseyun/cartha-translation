base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/008.yaml
  text: Now[a], soon I will pour out my wrath on you, and I will spend my anger against you; I will judge you according to your ways[b], and I will bring all your abominations upon you.
translation:
  language: de
  text: Jetzt, in Kürze[a], werde ich meinen Grimm über dich ausgießen und meinen Zorn an dir zu Ende bringen.[b] Ich werde dich nach deinen Wegen richten und all deine Gräuel über dich bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jetzt, schon bald“; der hebräische Ausdruck bezeichnet ein unmittelbar bevorstehendes Gericht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „meinen Zorn an dir vollenden“; gemeint ist, dass der Zorn an der Angesprochenen seinen vollen Lauf nimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה מִקָּרוֹב
  choice: Jetzt, schon bald
  rationale: עַתָּה bezeichnet den gegenwärtigen Zeitpunkt; מִקָּרוֹב wird hier wegen des angekündigten unmittelbar bevorstehenden Gerichts zeitlich verstanden. Die leicht nachdrückliche Verbindung bewahrt beide Elemente des Hebräischen.
- source_word: אֶשְׁפּוֹךְ חֲמָתִי עָלַיִךְ
  choice: werde ich meinen Grimm über dich ausgießen
  rationale: Die Gussmetapher von שׁפך bleibt erhalten. „Grimm“ gibt חֵמָה als heftigen, zum Gericht führenden Zorn würdig und verständlich wieder.
- source_word: וְכִלֵּיתִי אַפִּי בָּךְ
  choice: und meinen Zorn an dir ganz auslassen
  rationale: כלה mit אַף bezeichnet, dass der Zorn an seinem Gegenstand bis zum Ende wirksam wird. „Ganz auslassen“ vermittelt diesen vollständigen Vollzug natürlicher als das wörtlichere „vollenden“.
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  choice: Ich werde dich nach deinen Wegen richten
  rationale: „Richten“ bewahrt den gerichtlichen Sinn von שׁפט; „Wege“ erhält die hebräische Metapher für Lebensführung und Verhalten.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  choice: und all deine Gräuel über dich bringen
  rationale: Die Formulierung erhält sowohl die starke moralisch-religiöse Wertung von תּוֹעֵבוֹת als auch das Bild, dass die eigenen Gräuel im Gericht auf die Angesprochene zurückkommen.
theological_decisions:
- issue: Unterscheidung der beiden Begriffe für Gottes Zorn
  choice: חֲמָה wird mit „Grimm“, אַף mit „Zorn“ wiedergegeben.
  alternative: Beide Begriffe mit „Zorn“ oder beide mit „Grimm“ wiedergeben.
  rationale: Der hebräische Parallelismus verwendet zwei verwandte, aber unterschiedliche Wörter. Zwei deutsche Begriffe bewahren die rhetorische Steigerung, ohne daraus einen festen theologischen Bedeutungsunterschied abzuleiten.
- issue: Vollständiger Vollzug des göttlichen Zorns
  choice: „meinen Zorn an dir ganz auslassen“
  alternative: „meinen Zorn an dir vollenden“
  rationale: Die Übersetzung lässt die Aussage stehen, dass der angekündigte Zorn seinen vollen Lauf nimmt, ohne sie abzuschwächen oder über die Aussage des Verses hinaus systematisch zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten prophetischen Leitbildern („ausgießen“, „Wege“, „Gräuel“). Die Angesprochene steht entsprechend den femininen hebräischen Formen im Singular; im Deutschen wird das durch „dich/dir“ nicht ausdrücklich geschlechtlich markiert.
