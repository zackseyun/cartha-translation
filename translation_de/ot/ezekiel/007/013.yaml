  text: כִּ֣י הַ/מּוֹכֵ֗ר אֶל הַ/מִּמְכָּר֙ לֹ֣א יָשׁ֔וּב וְ/ע֥וֹד בַּ/חַיִּ֖ים חַיָּתָ֑/ם כִּֽי חָז֤וֹן אֶל כָּל הֲמוֹנָ/הּ֙ לֹ֣א יָשׁ֔וּב וְ/אִ֧ישׁ בַּ/עֲוֺנ֛/וֹ חַיָּת֖/וֹ לֹ֥א יִתְחַזָּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/013.yaml
  text: For the seller will not return to what was sold[a], though they are still alive; for the vision concerning all its multitude will not turn back[e][d][c][b], and no one will strengthen his life in his iniquity.
translation:
  language: de
  text: Denn der Verkäufer wird nicht zu dem zurückkehren, was verkauft wurde[a], auch wenn sie noch am Leben sind[b]. Denn die Vision über die gesamte Menge wird nicht zurückgenommen werden[d][c], und niemand wird durch seine Schuld sein Leben sichern[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Verkauf“, das heißt zu dem verkauften Gut oder Besitz.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „solange unter den Lebenden ihr Leben ist“. Gemeint ist wohl: Selbst wenn die Beteiligten noch leben, erhält der Verkäufer das Verkaufte nicht zurück.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gegen ihre ganze Menge“. Die Präposition kann die Richtung auf die gesamte vom Gericht betroffene Bevölkerung bezeichnen.'
    reason: alternative_reading
  - marker: d
    text: 'Wörtlicher: „wird nicht zurückkehren“ oder „wird nicht umkehren“. Gemeint ist wahrscheinlich, dass das angekündigte Gericht nicht widerrufen wird.'
    reason: alternative_reading
  - marker: e
    text: 'Der hebräische Schlusssatz ist schwierig. Möglich ist auch: „und niemand wird sein Leben in seiner Schuld stärken“. Wahrscheinlich besagt er, dass niemand durch seine Schuld sein Leben sichern kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹכֵר
  choice: der Verkäufer
  rationale: Das substantivisch gebrauchte aktive Partizip bezeichnet konkret denjenigen, der verkauft; die Handelsmetaphorik bleibt erhalten.
- source_word: אֶל הַמִּמְכָּר
  choice: zu dem Verkauften
  rationale: מִמְכָּר kann den Verkauf oder das verkaufte Gut bezeichnen. Die Formulierung bewahrt diese Offenheit, ohne ausdrücklich Land oder Besitz einzutragen.
- source_word: וְעוֹד בַּחַיִּים חַיָּתָם
  choice: auch wenn sie noch am Leben sind
  rationale: Die stark verdichtete hebräische Wendung wird in natürlichem Deutsch als konzessive Aussage wiedergegeben; der Numerus weist auf die Beteiligten beziehungsweise die Betroffenen.
- source_word: חָזוֹן
  choice: die Vision
  rationale: Der übliche prophetische Sinn wird direkt und verständlich wiedergegeben.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: über seine ganze Menge
  rationale: אֶל kann hier Bezug oder Richtung ausdrücken. „Über“ wahrt die Möglichkeit einer Vision, die die gesamte Menschenmenge betrifft; das feminine Suffix bezieht sich kontextuell auf das Land beziehungsweise die Stadt.
- source_word: לֹא יָשׁוּב
  choice: wird nicht zurückgenommen werden
  rationale: Beim Subjekt „Vision“ bezeichnet שוב wahrscheinlich das Nichtumkehren beziehungsweise Nichtwiderrufen des angekündigten Gerichts. Die passive deutsche Wendung gibt den kontextuellen Sinn klar wieder.
- source_word: בַּעֲוֹנוֹ
  choice: durch seine Schuld
  rationale: עָוֹן umfasst Schuld und Vergehen; ב kann Mittel oder Bereich anzeigen. „Durch seine Schuld“ bildet die wahrscheinlich gemeinte, ironische Aussage ab, dass Schuld das Leben nicht sichern kann.
- source_word: חַיָּתוֹ לֹא יִתְחַזָּקוּ
  choice: wird … sein Leben sichern
  rationale: Die Syntax ist schwierig, insbesondere wegen des pluralischen Verbs nach dem distributiven אִישׁ. „Sein Leben sichern“ gibt den wahrscheinlichen Sinn des Stärkens oder Festigens der Lebenskraft idiomatisch wieder.
theological_decisions:
- issue: Unwiderruflichkeit der angekündigten Vision
  choice: „wird nicht zurückgenommen werden“
  alternative: „wird nicht zurückkehren“ oder „wird nicht umkehren“
  rationale: Im Gerichtskontext liegt nahe, dass die prophetische Ankündigung nicht widerrufen wird. Die Fußnote hält die formnähere Möglichkeit offen.
- issue: Verhältnis von Schuld und Lebenssicherung im Schlusssatz
  choice: Niemand kann durch seine Schuld sein Leben sichern.
  alternative: 'Niemand wird sein Leben in seiner Schuld stärken; beziehungsweise: Sie werden sich nicht stärken, solange ihr Leben in ihrer Schuld steht.'
  rationale: Der hebräische Satz ist syntaktisch ungewöhnlich. Die gewählte Fassung folgt dem wahrscheinlichsten Zusammenhang, ohne eine weitergehende dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Denn“ und die konkrete Verkäufer-Metaphorik bleiben erhalten. Verdichtete oder syntaktisch unsichere Stellen werden lesbar formuliert und durch Fußnoten als offen ausgewiesen.
