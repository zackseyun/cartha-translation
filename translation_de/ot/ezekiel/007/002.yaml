source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם כֹּה אָמַ֞ר אֲדֹנָ֧/י יְהוִ֛ה לְ/אַדְמַ֥ת יִשְׂרָאֵ֖ל קֵ֑ץ בָּ֣א הַ/קֵּ֔ץ עַל ארבעת כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/002.yaml
  text: 'And you[a], son of man, thus says the Lord GOD to the land of Israel: An end! The end has come upon the four corners of the land.'
translation:
  language: de
  text: 'Und du, Menschensohn: So spricht der Herr Jahwe zum Land Israel: Ein Ende! Das Ende ist über die vier Enden des Landes[a] gekommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die vier Enden der Erde“. Die hebräische Wendung kann sich auf die äußersten Teile eines Landes oder, in weiterem Zusammenhang, auf die ganze Erde beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische hebräische Anredeformel und ihre maskuline Singularform; im Deutschen ist „Menschensohn“ zugleich verständlich und traditionsgemäß.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יְהוִה wieder, ohne beide Elemente zu einem einzigen Titel zu verschmelzen.
- source_word: לְאַדְמַת יִשְׂרָאֵל
  choice: zum Land Israel
  rationale: Das לְ bezeichnet hier den Adressaten beziehungsweise das Ziel des Gerichtswortes. „Land“ ist in diesem Zusammenhang natürlicher als das wörtlichere „Erdboden“.
- source_word: קֵץ
  choice: Ein Ende!
  rationale: Die verblos stehende Nominalform wirkt wie ein abrupter Ausruf. Der unbestimmte Artikel unterscheidet diesen ersten Ruf von dem unmittelbar folgenden bestimmten „das Ende“.
- source_word: בָּא הַקֵּץ
  choice: Das Ende ist ... gekommen
  rationale: Das hebräische Perfekt stellt das Eintreffen als gewiss beziehungsweise bereits vollzogen dar; das deutsche Perfekt erhält diese prophetische Bestimmtheit.
- source_word: אַרְבַּעַת כַּנְפוֹת הָאָרֶץ
  choice: die vier Enden des Landes
  rationale: כָּנָף bedeutet wörtlich „Flügel“, bezeichnet hier aber idiomatisch Rand oder äußerstes Ende. „Land“ nimmt den unmittelbaren Bezug auf das Land Israel auf, während die Vierzahl dessen gesamte Ausdehnung bezeichnet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr; der Herr HERR
  rationale: „Jahwe“ macht den im Ausgangstext stehenden Eigennamen sichtbar; „Herr“ gibt zusätzlich אֲדֹנָי wieder. So bleiben beide Bestandteile der Verbindung erhalten.
- issue: Reichweite von הָאָרֶץ im Schlusssatz
  choice: Land
  alternative: Erde
  rationale: Der unmittelbare Kontext richtet das Wort an das Land Israel, weshalb die örtlich begrenzte Bedeutung am wahrscheinlichsten ist. Da הָאָרֶץ jedoch auch „Erde“ bedeuten kann, bleibt diese Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Ausrufe und die Wiederholung von „Ende“ bewahren die schroffe Dringlichkeit des hebräischen Gerichtswortes; die mögliche Mehrdeutigkeit von „Land/Erde“ wird nicht stillschweigend aufgelöst.
