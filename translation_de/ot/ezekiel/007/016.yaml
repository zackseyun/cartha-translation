  text: וּ/פָֽלְטוּ֙ פְּלִ֣יטֵי/הֶ֔ם וְ/הָי֣וּ אֶל הֶ/הָרִ֗ים כְּ/יוֹנֵ֧י הַ/גֵּאָי֛וֹת כֻּלָּ֖/ם הֹמ֑וֹת אִ֖ישׁ בַּ/עֲוֺנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/016.yaml
  text: And their survivors will escape and be on the mountains[a], like doves of the valleys, all of them moaning[c][b], each one in his iniquity.
translation:
  language: de
  text: Diejenigen von ihnen, die entkommen, werden auf den Bergen sein, wie die Tauben der Täler[a]; sie alle stöhnen[b], jeder in seiner Schuld[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Tauben der Schluchten“. Das hebräische Wort kann Täler, Wadis oder Schluchten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie alle gurren“ beziehungsweise „murmeln“. Das hebräische Verb bezeichnet einen tiefen, anhaltenden Laut und erinnert hier zugleich an den Laut von Tauben und an menschliches Klagen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „jeder wegen seiner Schuld“, „jeder in seiner Verfehlung“ beziehungsweise „jeder wegen seiner Strafe“. Das hebräische Wort kann Verfehlung, Schuld oder die Folge der Schuld bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָלְטוּ
  choice: werden entkommen
  rationale: Das Verb פלט bezeichnet das Entrinnen aus einer Gefahr. Das Futur entspricht dem prophetischen Zusammenhang, ohne eine bestimmte Art der Flucht hinzuzufügen.
- source_word: פְּלִיטֵיהֶם
  choice: ihre Entronnenen
  rationale: Das Substantiv bezeichnet diejenigen, die entkommen sind. „Entronnene“ bewahrt die enge Wortverbindung zum vorausgehenden Verb und klingt würdig, ohne bloß allgemein „Überlebende“ zu sagen.
- source_word: וְהָיוּ אֶל־הֶהָרִים
  choice: und sich auf den Bergen aufhalten
  rationale: Die Konstruktion היה + אל beschreibt hier am ehesten den Aufenthaltsort der Entkommenen. Diese Wiedergabe ist im Deutschen natürlich und fügt keine ausdrücklich bezeichnete Bewegung hinzu.
- source_word: כְּיוֹנֵי הַגֵּאָיוֹת
  choice: wie die Tauben der Täler
  rationale: Das Bild bezeichnet Tauben in Tälern beziehungsweise Schluchten und verbindet ihren Rückzugsort mit ihrem klagenden Laut. „Täler“ ist allgemein verständlich; „Schluchten“ bleibt als Fußnotenalternative erhalten.
- source_word: כֻּלָּם הֹמוֹת
  choice: sie alle stöhnen
  rationale: המה bezeichnet ein tiefes, anhaltendes Lautgeben. Im Gerichtskontext gibt „stöhnen“ den Schmerz wieder, während die Fußnote auf das Gurren der Tauben und die lautmalerische Färbung hinweist.
- source_word: אִישׁ
  choice: jeder
  rationale: Das Wort wird distributiv gebraucht und bezieht sich auf jede einzelne Person unter den Entkommenen.
- source_word: בַּעֲוֺנוֹ
  choice: wegen seiner Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder die daraus folgende Strafe bezeichnen. „Wegen seiner Schuld“ ist natürliches Deutsch und wahrt den ursächlichen Zusammenhang; die weiteren Bedeutungsnuancen werden in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsumfang von עָוֹן im Gerichtszusammenhang
  choice: wegen seiner Schuld
  alternative: in seiner Verfehlung; wegen seiner Strafe
  rationale: Der hebräische Ausdruck kann sowohl die schuldhafte Verfehlung als auch Schuld beziehungsweise deren Folge meinen. Der Haupttext nennt die Schuld, legt aber durch die Fußnote nicht fest, ob ausschließlich Tat, Schuldzustand oder Straffolge gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Wortwurzel in „Entronnenen werden entkommen“ bildet die hebräische Verbindung von פלט und פְּלִיטִים bewusst nach. Das Taubenbild und die Mehrdeutigkeit von עָוֹן bleiben erhalten; alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
