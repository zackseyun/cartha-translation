base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/003.yaml
  text: Now the end is upon you[a], and I will send my anger against you. I will judge you according to your ways, and I will bring all your abominations upon you.
translation:
  language: de
  text: Nun kommt das Ende über dich. Ich werde meinen Zorn gegen dich senden und dich nach deinen Wegen richten; ich werde alle deine Gräuel über dich bringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Ich werde alle deine Gräuel auf dich legen.“ Die hebräische Wendung lautet wörtlich „auf dich geben/legen“ und kann im Gerichtszusammenhang bedeuten, dass die Folgen dieser Gräuel über dich kommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Jetzt
  rationale: Kennzeichnet die unmittelbare Gegenwart des angekündigten Gerichts und bewahrt die abrupte Eindringlichkeit.
- source_word: הַקֵּץ עָלַיִךְ
  choice: das Ende ist über dich gekommen
  rationale: Der bestimmte Ausdruck wird als „das Ende“ wiedergegeben; „über dich gekommen“ erhält das Bild eines hereinbrechenden Gerichts, ohne es technisch-eschatologisch auszudeuten.
- source_word: וְשִׁלַּחְתִּי אַפִּי בָּךְ
  choice: Ich werde meinen Zorn gegen dich loslassen
  rationale: אַף bezeichnet idiomatisch den Zorn. „Loslassen“ gibt das Senden beziehungsweise Freisetzen des Zorns in natürlichem Deutsch wieder; „gegen dich“ verdeutlicht die feindliche Zielrichtung der Präposition.
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  choice: und dich nach deinen Wegen richten
  rationale: „Richten“ bewahrt den gerichtlichen Ton; „Wege“ erhält die hebräische Metapher für Lebensführung und Verhalten.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבֹתָיִךְ
  choice: Alle deine abscheulichen Taten werde ich auf dich zurückfallen lassen
  rationale: Die Formulierung macht den Vergeltungssinn verständlich, hält aber durch das Bild des Zurückfallens fest, dass die eigenen verabscheuungswürdigen Taten auf die Angeredete kommen. Die wörtlichere und mehrdeutige Ausdrucksweise wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von „das Ende“
  choice: Ankündigung des unmittelbar bevorstehenden geschichtlichen Gerichts, ohne nähere dogmatische Festlegung
  alternative: Das absolute, kosmische Endgericht im späteren technischen Sinn
  rationale: Der unmittelbare Zusammenhang handelt vom Gericht über das Land beziehungsweise Jerusalem. Die bestimmte Form „das Ende“ und ihre Schwere bleiben erhalten, ohne spätere eschatologische Kategorien einzutragen.
- issue: Verhältnis zwischen den abscheulichen Taten und dem Gericht
  choice: Die eigenen Taten fallen in ihren Gerichtsfolgen auf die Angeredete zurück
  alternative: Gott legt beziehungsweise gibt die abscheulichen Taten selbst auf sie
  rationale: Die hebräische Wendung kann wörtlich als Auflegen der Gräueltaten verstanden werden, dient im Gerichtskontext aber wahrscheinlich dazu, ihre Folgen beziehungsweise Vergeltung auszudrücken. Die Hauptfassung ist verständlich; die Fußnote bewahrt die formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Gerichtssprache. „Zorn“, „richten“ und „abscheuliche Taten“ bewahren die inhaltliche Schärfe; altertümliche oder konfessionell geprägte Wendungen werden vermieden.
