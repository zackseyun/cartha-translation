reference: Ezekiel 7:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/מֶּ֣לֶךְ יִתְאַבָּ֗ל וְ/נָשִׂיא֙ יִלְבַּ֣שׁ שְׁמָמָ֔ה וִ/ידֵ֥י עַם הָ/אָ֖רֶץ תִּבָּהַ֑לְנָה מִ/דַּרְכָּ֞/ם אֶעֱשֶׂ֤ה אוֹתָ/ם֙ וּ/בְ/מִשְׁפְּטֵי/הֶ֣ם אֶשְׁפְּטֵ֔/ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/027.yaml
  text: The king will mourn[a], and the prince will clothe himself with desolation, and the hands of the people of the land will tremble. According to their way I will deal with them, and by their own judgments I will judge them[c][b]. Then they will know that I am Yahweh.
translation:
  language: de
  text: Der König wird trauern, und der Fürst wird sich in Entsetzen kleiden[a]. Die Hände des Volkes im Land werden vor Angst zittern[b]. Nach ihrem eigenen Verhalten werde ich mit ihnen verfahren, und nach ihren eigenen Urteilen werde ich sie richten[c]. Dann werden sie erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird sich in Verwüstung kleiden“ beziehungsweise „wird Schrecken anziehen“. Das hebräische Wort kann Verwüstung, entsetztes Erstarren oder den Schrecken darüber bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: '„Das Volk im Land“ bezeichnet hier die Bevölkerung. Wörtlich: „Die Hände des Volkes des Landes werden erschrecken.“'
    reason: idiom_and_lexical_alternative
  - marker: c
    text: 'Oder: „nach ihren Rechtssprüchen werde ich sie richten“. Gemeint sein kann, dass sie nach den Maßstäben ihrer eigenen Rechtspraxis gerichtet werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ יִתְאַבָּל
  choice: Der König wird trauern
  rationale: Die politische Bezeichnung und das Verb für Trauer oder Klage werden direkt und in natürlichem Deutsch wiedergegeben.
- source_word: וְנָשִׂיא
  choice: und der Fürst
  rationale: „Fürst“ wahrt den gehobenen Amtstitel נָשִׂיא und unterscheidet ihn vom zuvor genannten König.
- source_word: יִלְבַּשׁ שְׁמָמָה
  choice: wird sich in Entsetzen kleiden
  rationale: Die Bekleidungsmetapher bleibt erhalten; שְׁמָמָה bezeichnet hier entsetztes Erstarren beziehungsweise den Schrecken angesichts der Verwüstung.
- source_word: וִידֵי עַם הָאָרֶץ תִּבָּהַלְנָה
  choice: Die Hände des Volkes im Land werden vor Angst zittern
  rationale: Die Hände als Bild für Handlungsfähigkeit und die konkrete Angstwirkung werden bewahrt. „Volk im Land“ ist im Deutschen verständlicher als die missverständliche Formulierung „Volk des Landes“.
- source_word: מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם
  choice: Nach ihrem eigenen Verhalten werde ich mit ihnen verfahren
  rationale: דֶּרֶךְ bezeichnet hier den Lebenswandel beziehungsweise das Verhalten. Die Wiedergabe macht die vergeltende Entsprechung deutlich, ohne sie über den hebräischen Text hinaus auszulegen.
- source_word: וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם
  choice: und nach ihren eigenen Urteilen werde ich sie richten
  rationale: Die Wortwiederholung von משפט und שפט sowie der forensische Sinn bleiben erkennbar; „eigenen“ verdeutlicht den pronominalen Suffixbezug.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Dann werden sie erkennen, dass ich Jahwe bin
  rationale: Die in Hesekiel wiederkehrende Erkenntnisformel wird als Folge des angekündigten Gerichts formuliert; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Vergeltende Entsprechung in מִדַּרְכָּם und בְמִשְׁפְּטֵיהֶם
  choice: Gott verfährt mit ihnen nach ihrem Verhalten und richtet sie nach ihren eigenen Urteilen
  alternative: Gott richtet sie allgemein nach seinen Urteilen
  rationale: Die Suffixe beziehen sowohl „Verhalten“ als auch „Urteile“ ausdrücklich auf die Betroffenen. Die Übersetzung wahrt die Spannung, ob ihre eigenen Rechtssprüche, Rechtsmaßstäbe oder die ihnen entsprechenden Urteile gemeint sind.
- issue: Folgernder Sinn von וְיָדְעוּ
  choice: Dann werden sie erkennen
  alternative: Und sie werden erkennen
  rationale: Im Zusammenhang bildet die Erkenntnisformel das Ergebnis des Gerichts. „Dann“ bringt diesen Zusammenhang natürlich zum Ausdruck, ohne eine zusätzliche Lehraussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzstruktur. Die markante Bekleidungsmetapher, das Bild der zitternden Hände, die vergeltende Parallelität und die Erkenntnisformel bleiben erhalten. Fußnoten kennzeichnen echte lexikalische und syntaktische Spielräume.
