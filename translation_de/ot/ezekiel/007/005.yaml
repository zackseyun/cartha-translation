  yaml_path: translation/ot/ezekiel/007/005.yaml
  text: 'Thus says the Lord GOD: A disaster[a], a unique disaster—behold, it is coming.'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Ein Unheil, ein Unheil – siehe, es kommt!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch und zugleich feierlich im Präsens wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Wiedergabe bewahrt sowohl den Herrentitel אֲדֹנָי als auch den als Eigennamen gebrauchten Gottesnamen יהוה, ohne die beiden Elemente zu verschmelzen.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Gerichtskontext bezeichnet das Wort eine hereinbrechende Katastrophe und nicht sittliche Bosheit. „Unheil“ erhält zudem den knappen, prophetischen Ton.
- source_word: רָעָה אַחַת רָעָה
  choice: Ein Unheil, ein einziges Unheil
  rationale: Die Wiederholung von רָעָה bleibt als rhetorische Hervorhebung erhalten; „ein einziges“ gibt die mögliche Betonung von אַחַת als Einmaligkeit beziehungsweise Einzigartigkeit wieder.
- source_word: הִנֵּה
  choice: siehe
  rationale: Das Signalwort lenkt mit feierlicher Dringlichkeit die Aufmerksamkeit auf das unmittelbar angekündigte Geschehen.
- source_word: בָאָה
  choice: es kommt
  rationale: Die deutsche Präsensform bringt das bevorstehende und bereits nahende Eintreffen natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr HERR; der Herr JHWH
  rationale: „Der Herr Yahweh“ lässt den Titel und den offenbarten Gottesnamen unterscheidbar und vermeidet die missverständliche Verdoppelung „Herr HERR“.
- issue: Bedeutung von רָעָה im göttlichen Gerichtswort
  choice: Unheil
  alternative: Böses; Katastrophe
  rationale: Der Kontext spricht von einem verhängten Unglück, nicht davon, Gott sittliche Bosheit zuzuschreiben. „Unheil“ wahrt jedoch die Härte und theologische Spannung des Gerichtswortes.
translation_notes:
  register: Moderne, verständliche Standardsprache mit bewusst feierlichem prophetischem Ton. Die abrupte Wiederholung des hebräischen Satzes bleibt erhalten; „siehe“ trägt dessen eindringliche Ankündigungsfunktion.
