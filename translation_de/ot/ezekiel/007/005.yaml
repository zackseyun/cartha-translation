  source_fidelity: 'Die Grundwiedergabe ist quellentreu: רָעָה bezeichnet hier drohendes Unheil, und die Wiederholung wird erhalten. Die Auslegung von אַחַת als „einziges“ ist jedoch stärker als der hebräische Wortlaut. Das Zahlwort kann die Singularität bzw. Besonderheit hervorheben, ohne dass die deutsche Formulierung „ein einziges“ (auch: nur ein einziges) festgelegt werden sollte.'
  naturalness: „So spricht der Herr Yahweh“ und „siehe, es kommt“ sind in einem modernen, bewusst prophetisch-feierlichen Register verständlich. Die knappere Wiederholung klingt im Deutschen ebenfalls eindringlich und wahrt den abrupten Stil.
