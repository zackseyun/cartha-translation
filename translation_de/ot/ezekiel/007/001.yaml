base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] kam zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben; auch „Yahweh“ geschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Das Wayyiqtol von היה eröffnet eine neue prophetische Einheit. Im Deutschen wird seine erzählerische Funktion natürlich in die Wendung „Und das Wort … kam“ aufgenommen.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְבַר־יְהוָה bewahrt „das Wort“ den wiederkehrenden formalen Bezug zur göttlichen Offenbarung; „Botschaft“ wäre möglich, aber stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen wissenschaftlichen Umschrift und Ausspracheform.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bedeutet hier unmittelbar „zu mir“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die folgende direkte Rede ein. Ein Doppelpunkt gibt diese Funktion im natürlichen modernen Deutsch prägnanter wieder als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ erhält den Charakter als Gottesname; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt, ohne sie in den Haupttext einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel bleibt erkennbar; der Doppelpunkt führt natürlich in den Inhalt des folgenden Verses.
