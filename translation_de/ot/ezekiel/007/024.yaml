  to: Ich werde die Schlimmsten unter den Völkern[a] herbeiholen, und sie werden die Häuser der Bewohner in Besitz nehmen.[b] Ich werde dem Stolz der Mächtigen ein Ende machen, und ihre Heiligtümer werden entweiht.[c]
