base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/024.yaml
  text: And I will bring the worst of the nations[a], and they will take possession of their houses. I will put an end to the pride of the strong[c][b], and their sanctuaries will be profaned.
translation:
  language: de
  text: Ich werde die Schlimmsten unter den Völkern[a] herbeiholen, und sie werden die Häuser der Bewohner in Besitz nehmen.[b] Ich werde dem Stolz der Mächtigen ein Ende machen, und ihre Heiligtümer werden entweiht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Bösesten unter den Völkern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie werden die Häuser der Bewohner erben“; das hebräische Verb kann je nach Zusammenhang „erben“, „besitzen“ oder „in Besitz nehmen“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihre heiligen Stätten werden verunreinigt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Ich werde … herbeiholen
  rationale: Der Hifil von בוא bezeichnet hier das Herbeibringen feindlicher Völker. „Herbeiholen“ klingt im Deutschen natürlich und lässt das im Kontext erschlossene Ziel offen.
- source_word: רָעֵי גוֹיִם
  choice: die Schlimmsten unter den Völkern
  rationale: רָעֵי ist eine konstruktgebundene Pluralform mit superlativischer Wirkung. Die Formulierung gibt die besondere Bosheit beziehungsweise Gefährlichkeit dieser Völker idiomatisch wieder, ohne sie unnötig einzuengen.
- source_word: וְיָרְשׁוּ אֶת בָּתֵּיהֶם
  choice: sie werden ihre Häuser in Besitz nehmen
  rationale: ירשׁ kann „erben“, „besitzen“, „in Besitz nehmen“ oder kontextabhängig „vertreiben“ bedeuten. Im Eroberungskontext bezeichnet „in Besitz nehmen“ die gewaltsame Aneignung, ohne einen rechtmäßigen Erbgang anzudeuten.
- source_word: וְהִשְׁבַּתִּי
  choice: Ich werde … ein Ende machen
  rationale: Der Hifil von שׁבת bedeutet, etwas aufhören zu lassen. Die deutsche Wendung bewahrt die kausative Bedeutung in natürlicher Sprache.
- source_word: גְּאוֹן עַזִּים
  choice: dem Stolz der Mächtigen
  rationale: גְּאוֹן kann Stolz, Hoheit oder Pracht bezeichnen; im Gerichtszusammenhang liegt die negative Bedeutung „Stolz“ nahe. עַזִּים bezeichnet Starke oder Mächtige.
- source_word: וְנִחֲלוּ
  choice: werden entweiht
  rationale: 'Die Nifalform von חלל hat hier passive kultische Bedeutung: Das Heilige wird seiner Heiligkeit beraubt beziehungsweise entweiht.'
- source_word: מְקַדְשֵׁיהֶם
  choice: ihre Heiligtümer
  rationale: Der Plural von מִקְדָּשׁ bezeichnet heilige beziehungsweise kultische Stätten. „Heiligtümer“ ist präzise und im Deutschen gut verständlich.
theological_decisions:
- issue: Bedeutungsnuance von גְּאוֹן im Gerichtswort
  choice: Stolz
  alternative: Hoheit oder Pracht
  rationale: Der Zusammenhang kündigt Erniedrigung und Gericht an. „Stolz“ wahrt diese rhetorische Stoßrichtung, während die grundsätzlich mögliche positivere Bedeutung in einer Fußnote nicht eigens nötig ist.
- issue: Sinn von וְנִחֲלוּ מְקַדְשֵׁיהֶם
  choice: ihre Heiligtümer werden entweiht
  alternative: ihre heiligen Stätten werden verunreinigt
  rationale: Die passive kultische Bedeutung passt am besten. „Entweiht“ bringt den Verlust des heiligen Status genauer zum Ausdruck als das allgemeinere „verunreinigt“, ohne festzulegen, welche Heiligtümer gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren den eindringlichen Rhythmus des Gerichtswortes. Das mehrdeutige Pronomen „ihre“ bleibt entsprechend dem Hebräischen unaufgelöst.
