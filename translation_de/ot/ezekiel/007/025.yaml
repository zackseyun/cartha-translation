  text: קְפָ֖דָה בָ֑א וּ/בִקְשׁ֥וּ שָׁל֖וֹם וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/025.yaml
  text: Anguish has come[a], and they will seek peace, but there is none.
translation:
  language: de
  text: Angst ist gekommen[a]; sie werden Frieden suchen, doch es gibt keinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schrecken ist gekommen“, „Unheil ist gekommen“ oder „Entsetzen ist gekommen“. Das hebräische Substantiv ist selten und kann entweder die Angst selbst oder den durch das Gericht hervorgerufenen verhängnisvollen Zustand hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְפָדָה
  choice: Angst
  rationale: Das seltene Substantiv bezeichnet im Zusammenhang des Gerichts wahrscheinlich einen Zustand äußerster Angst oder Not. „Angst“ gibt die erlebte Bedrängnis natürlich wieder, ohne die Bedeutung vorschnell auf äußeres Unheil festzulegen; „Schrecken“, „Unheil“ und „Entsetzen“ bleiben möglich.
- source_word: בָא
  choice: kommt
  rationale: Die Qatal-Form kann in prophetischer Rede ein als sicher eintretend oder bereits herangekommen dargestelltes Ereignis bezeichnen. Das deutsche Präsens „kommt“ bewahrt die knappe, unmittelbare Gerichtsankündigung.
- source_word: וּבִקְשׁוּ
  choice: Sie werden suchen
  rationale: Die Verbform beschreibt in der prophetischen Abfolge die anschließende Reaktion der Menschen und wird daher futurisch wiedergegeben.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die geläufige und kontextgerechte Wiedergabe und umfasst hier Sicherheit und Wohlergehen, nicht nur innere Ruhe.
- source_word: וָאָיִן
  choice: doch es gibt keinen
  rationale: Die Formulierung verneint das Vorhandensein des gesuchten Friedens. „Doch“ macht den im Zusammenhang klaren Gegensatz im Deutschen natürlich deutlich.
