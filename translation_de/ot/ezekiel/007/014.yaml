  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Kontrast des Hebräischen zuverlässig wieder: das Blasen des Horns, die vollständige Vorbereitung, das Ausbleiben jedes Auszugs zum Kampf und die begründende Aussage von Gottes Zorn gegen ihre gesamte Menge. „Ins Horn stoßen“ ist für תקע בתקע idiomatisch und wahrt die offene Instrumentbezeichnung. „Ihre ganze Menge“ erhält sowohl den femininen Suffixbezug als auch dessen im Kontext nicht ausdrücklich benanntes Antezedens.'
