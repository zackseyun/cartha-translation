id: EZK.7.14
reference: Ezekiel 7:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תָּקְע֤וּ בַ/תָּק֨וֹעַ֙ וְ/הָכִ֣ין הַ/כֹּ֔ל וְ/אֵ֥ין הֹלֵ֖ךְ לַ/מִּלְחָמָ֑ה כִּ֥י חֲרוֹנִ֖/י אֶל כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/014.yaml
  text: They have blown the trumpet and made everything ready[a], but no one goes to battle[b], for my wrath is against all her multitude.
translation:
  language: de
  text: Sie haben ins Horn[a] gestoßen und alles bereitgemacht, doch niemand zieht in den Kampf; denn mein Zorn richtet sich gegen ihre ganze Menge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Trompete«; möglicherweise ist ein Widderhorn gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gegen ihre ganze Fülle« beziehungsweise »gegen ihren ganzen Reichtum«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקְעוּ בַתָּקוֹעַ
  choice: Sie haben ins Horn gestoßen
  rationale: תקע bezeichnet mit einem Blasinstrument das Blasen beziehungsweise Hornstoßen. Die abgeschlossene Form mit gegenwärtiger Folge gibt den Gegensatz zur ausbleibenden Mobilmachung gut wieder. „Horn“ hält die Art des Instruments offener als „Trompete“.
- source_word: וְהָכִין הַכֹּל
  choice: und alles bereitgemacht
  rationale: Das Hifil von כון bedeutet hier „vorbereiten, bereitmachen“; הַכֹּל bewahrt den umfassenden Umfang der Vorbereitungen.
- source_word: וְאֵין הֹלֵךְ לַמִּלְחָמָה
  choice: doch niemand zieht in den Kampf
  rationale: אין mit Partizip verneint, dass überhaupt jemand loszieht. „Doch“ gibt den sachlichen Gegensatz zwischen vollständiger Vorbereitung und ausbleibendem Aufbruch wieder; „in den Kampf ziehen“ ist im Deutschen idiomatisch.
- source_word: חֲרוֹנִי
  choice: mein Zorn
  rationale: חרון bezeichnet brennenden beziehungsweise heftigen Zorn. „Mein Zorn“ ist knapp, gewichtig und bewahrt das Possessivsuffix.
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: richtet sich gegen ihre ganze Menge
  rationale: Bei Zorn wird אֶל kontextgemäß mit „gegen“ wiedergegeben. המון kann eine Menschenmenge, aber auch Fülle oder Besitz bezeichnen; „Menge“ wahrt einen Teil dieser Bedeutungsbreite. Das feminine Suffix bleibt als „ihre“ erhalten, ohne seinen nicht ausdrücklich genannten Bezug festzulegen.
theological_decisions:
- issue: Bezug des femininen Suffixes in הֲמוֹנָהּ
  choice: „ihre ganze Menge“, ohne die Bezugsgröße ausdrücklich zu benennen
  alternative: „die ganze Menge der Stadt“ oder „die ganze Menge des Landes“
  rationale: Der feminine Singular verweist auf eine zuvor vorausgesetzte Größe, doch der unmittelbare Bezug ist nicht eindeutig genug, um im Haupttext „Jerusalem“, „Stadt“ oder „Land“ einzusetzen.
- issue: Bedeutung von הֲמוֹנָהּ
  choice: Menschenmenge beziehungsweise große Menge im Haupttext
  alternative: ihre ganze Fülle oder ihr ganzer Reichtum
  rationale: Der Zusammenhang von Krieg und Gericht legt eine Bevölkerung oder Menge nahe; die im Hebräischen mögliche materielle Bedeutung wird jedoch in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der militärische Ausdruck „in den Kampf ziehen“ ist natürlich und klar. Die Satzspannung zwischen vollendeter Vorbereitung und völlig ausbleibendem Aufbruch bleibt erhalten; das Semikolon gliedert Begründung und Kontrast.
