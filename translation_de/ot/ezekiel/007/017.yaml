  text: All hands will grow weak[a], and all knees will run with water.
translation:
  language: de
  text: Alle Hände werden kraftlos, und an allen Knien läuft Wasser hinab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Alle Knie gehen mit Wasser.“ Gemeint ist wahrscheinlich, dass die Knie vor Entsetzen nachgeben; möglicherweise schließt das Bild den Verlust der Körperkontrolle ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: alle
  rationale: Der Quantor bezeichnet in beiden Satzhälften die Gesamtheit der Betroffenen und wird unmittelbar mit „alle“ wiedergegeben.
- source_word: הַיָּדַיִם
  choice: Hände
  rationale: Die wörtliche Körperteilbezeichnung bewahrt das hebräische Bild versagender Kraft; „Arme“ wäre stärker deutend.
- source_word: תִּרְפֶּינָה
  choice: werden kraftlos
  rationale: Das Verb רפה bezeichnet ein Erschlaffen oder Schwachwerden. „Kraftlos werden“ ist natürliches modernes Deutsch und erhält das Bild schwindender Handlungsfähigkeit.
- source_word: בִּרְכַּיִם
  choice: Knien
  rationale: Die direkte anatomische Bezeichnung wird beibehalten; im Zusammenhang sind die Knie zugleich mit Angst und Zusammenbrechen verbunden.
- source_word: תֵּלַכְנָה
  choice: läuft … hinab
  rationale: Das Verb bedeutet grundsätzlich „gehen“, beschreibt hier mit „Wasser“ jedoch die Bewegung von Flüssigkeit. „Hinablaufen“ gibt das anschauliche Bild im Deutschen natürlich wieder.
- source_word: מָּיִם
  choice: Wasser
  rationale: Der hebräische Text nennt ausdrücklich „Wasser“. Die wahrscheinliche Anspielung auf angstbedingten Verlust der Körperkontrolle wird nicht erklärend in den Haupttext eingesetzt.
