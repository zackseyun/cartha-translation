  text: וְ/חָגְר֣וּ שַׂקִּ֔ים וְ/כִסְּתָ֥ה אוֹתָ֖/ם פַּלָּצ֑וּת וְ/אֶ֤ל כָּל פָּנִים֙ בּוּשָׁ֔ה וּ/בְ/כָל רָאשֵׁי/הֶ֖ם קָרְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/018.yaml
  text: They will put on sackcloth, and horror will cover them; shame will be on every face, and baldness on all their heads.
translation:
  language: de
  text: Sie werden sich in Sacktuch kleiden, und Entsetzen wird sie bedecken. Auf jedem Gesicht wird Scham sein, und auf all ihren Köpfen wird Kahlheit sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kahlheit konnte im altisraelitischen Kontext ein Zeichen von Trauer und Verzweiflung sein.
    reason: Erläutert die kulturelle Assoziation des Bildes, ohne festzulegen, wie die Kahlheit zustande kam oder sie als im hebräischen Haupttext ausdrücklich genannte Deutung auszugeben.
lexical_decisions:
- source_word: שַׂקִּים
  choice: Sacktuch
  rationale: Bezeichnet grobes Trauergewand; „Sacktuch“ ist im Deutschen als biblischer Ausdruck verständlich und bewahrt das konkrete Zeichen der Trauer.
- source_word: פַלָּצוּת
  choice: Entsetzen
  rationale: Das seltene Substantiv bezeichnet lähmenden Schrecken bzw. Grauen. „Entsetzen“ gibt den Zustand natürlich wieder, ohne ihn auf bloß körperliches Zittern einzuengen.
- source_word: בּוּשָׁה
  choice: Scham
  rationale: Die übliche Bedeutung ist Scham bzw. Schande; hier beschreibt das Wort den sichtbaren Zustand auf den Gesichtern.
- source_word: קָרְחָה
  choice: kahl
  rationale: Wörtlich „Kahlheit/Glatze“; die prädikative Formulierung ist im Deutschen natürlich und verweist auf das damalige Trauerzeichen.
theological_decisions:
- issue: Bedeutung der kahlen Köpfe
  choice: Im Haupttext ohne Deutung als sichtbares Trauerzeichen wiedergegeben; die kulturelle Bedeutung wird in einer Fußnote erläutert.
  alternative: Als freiwilliges Scheren der Köpfe ausdrücklich auslegen.
  rationale: Der hebräische Text nennt lediglich Kahlheit und lässt offen, wie sie zustande kommt; die Übersetzung soll diese Offenheit bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz gibt die zukünftigen Handlungen wieder; im zweiten Satz macht das Präsens die knappen hebräischen Nominalsätze natürlich lesbar und anschaulich.
