  text: בָּ֧אָה הַ/צְּפִירָ֛ה אֵלֶ֖י/ךָ יוֹשֵׁ֣ב הָ/אָ֑רֶץ בָּ֣א הָ/עֵ֗ת קָר֛וֹב הַ/יּ֥וֹם מְהוּמָ֖ה וְ/לֹא הֵ֥ד הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/007.yaml
  text: Doom has come upon you[a], inhabitant of the land. The time has come; the day is near—panic[b], and not joyful shouting on the mountains.
translation:
  language: de
  text: 'Das Verhängnis ist über dich gekommen,[a] du Bewohner des Landes. Die Zeit ist gekommen, der Tag ist nah: Bestürzung[b] und kein Jubelruf auf den Bergen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Wende ist über dich gekommen« oder: »Dein Geschick ist gekommen.« Das hebräische Wort ist selten und schwer zu deuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Tumult und kein Echo auf den Bergen.« Der letzte Satzteil ist schwer zu deuten. Viele verstehen ihn als Gegensatz zwischen dem Schrecken des Gerichts und den sonst auf den Bergen hörbaren Freudenrufen, möglicherweise bei der Ernte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִירָה
  choice: das Verhängnis
  rationale: Das seltene und schwierige Substantiv bezeichnet hier im Zusammenhang der wiederholten Gerichtsworte wahrscheinlich die entscheidende, unheilvolle Wende. »Verhängnis« gibt diese Bedeutung im Deutschen natürlich wieder, ohne eine präzisere Etymologie vorzutäuschen.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: du Bewohner des Landes
  rationale: Das singularische Partizip ist als direkte Anrede wiedergegeben. »Land« passt zum unmittelbaren Gerichtswort an die Bevölkerung des Landes besser als »Erde«.
- source_word: בָּא הָעֵת
  choice: Die Zeit ist gekommen
  rationale: Die schlichte temporale Aussage wird ohne den im Hebräischen nicht ausdrücklich bezeichneten Zusatz »bestimmt« wiedergegeben.
- source_word: קָרוֹב הַיּוֹם
  choice: der Tag ist nah
  rationale: Bewahrt die Ankündigung der unmittelbaren Nähe des Gerichtstages in natürlichem Deutsch.
- source_word: מְהוּמָה
  choice: Bestürzung
  rationale: Das Wort kann Tumult, Verwirrung oder panischen Schrecken bezeichnen. »Bestürzung« vermittelt hier den durch das Gericht ausgelösten Schrecken und lässt zugleich eine gewisse Bedeutungsbreite offen.
- source_word: הֵד
  choice: Jubelruf
  rationale: Das schwierige Wort kann wörtlicher als »Echo« verstanden werden; im Kontext liegt jedoch ein Ruf nahe, der dem Schrecken des Gerichtstages gegenübersteht, möglicherweise ein freudiger Ernte- oder Weinleseruf auf den Bergen.
- source_word: הָרִים
  choice: den Bergen
  rationale: Die übliche Entsprechung für den Plural; der Ausdruck bezeichnet wahrscheinlich die Höhen, auf denen sonst freudige Rufe zu hören waren.
theological_decisions: []
