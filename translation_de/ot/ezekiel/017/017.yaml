source:
  edition: WLC
  text: וְ/לֹא֩ בְ/חַ֨יִל גָּד֜וֹל וּ/בְ/קָהָ֣ל רָ֗ב יַעֲשֶׂ֨ה אוֹת֤/וֹ פַרְעֹה֙ בַּ/מִּלְחָמָ֔ה בִּ/שְׁפֹּ֥ךְ סֹלְלָ֖ה וּ/בִ/בְנ֣וֹת דָּיֵ֑ק לְ/הַכְרִ֖ית נְפָשׁ֥וֹת רַבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/017.yaml
  text: Pharaoh will not act for him in the war with a great army and a large assembly[b][a], when they cast up a siege ramp and build a siege wall to cut off many lives.
translation:
  language: de
  text: Der Pharao wird ihm im Krieg mit einem großen Heer und einem zahlreichen Aufgebot nichts ausrichten[a], wenn er eine Belagerungsrampe aufschüttet und ein Belagerungswerk errichtet[b], um vielen Menschen das Leben zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine knappe Wendung im Sinn von: „wird nicht für ihn handeln“. Gemeint ist, dass der Pharao nichts Wirksames für ihn unternehmen wird.'
    reason: lexical_alternative
  - marker: b
    text: Die Belagerungsbegriffe können auch mit „Belagerungswall“ und „Belagerungsanlage“ oder „Belagerungsturm“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחַיִל גָּדוֹל
  choice: mit einem großen Heer
  rationale: חַיִל bezeichnet im militärischen Zusammenhang ein Heer bzw. eine Streitmacht; „Heer“ ist präzise, geläufig und würdevoll.
- source_word: וּבְקָהָל רָב
  choice: und einem zahlreichen Aufgebot
  rationale: קָהָל bezeichnet eine versammelte Menge. „Aufgebot“ bewahrt den Gedanken einer zusammengezogenen größeren Gruppe und passt natürlich in den militärischen Zusammenhang, ohne sie genauer zu bestimmen.
- source_word: יַעֲשֶׂה אֹתוֹ
  choice: nichts für ihn ausrichten
  rationale: Die wörtlich knappe Wendung „ihn machen/tun“ meint hier wirksames Handeln für ihn. „Nichts für ihn ausrichten“ wahrt die Breite des Verbs und klingt im Deutschen natürlich, ohne es auf bloße Hilfeleistung einzuengen.
- source_word: בַּמִּלְחָמָה
  choice: im Krieg
  rationale: Der bestimmte Singular wird unmittelbar und idiomatisch mit „im Krieg“ wiedergegeben.
- source_word: בִּשְׁפֹּךְ סֹלְלָה
  choice: wenn eine Belagerungsrampe aufgeschüttet wird
  rationale: שׁפך bedeutet wörtlich „ausgießen“, bezeichnet mit סֹלְלָה jedoch das Aufschütten einer aus Erde bestehenden Belagerungsrampe. Die Passivform vermeidet es, ein im Hebräischen nicht genanntes Subjekt einzuführen.
- source_word: וּבִבְנוֹת דָּיֵק
  choice: und Belagerungswerke gebaut werden
  rationale: דָּיֵק bezeichnet eine Belagerungsanlage, deren genaue Bauart umstritten ist. Der Oberbegriff „Belagerungswerke“ erhält diese Unbestimmtheit.
- source_word: לְהַכְרִית נְפָשׁוֹת רַבּוֹת
  choice: um viele Menschenleben auszulöschen
  rationale: הכרית bedeutet „abschneiden, ausrotten“, und נְפָשׁוֹת bezeichnet hier menschliche Leben bzw. Personen. „Menschenleben auslöschen“ gibt die Härte der Aussage natürlich wieder.
