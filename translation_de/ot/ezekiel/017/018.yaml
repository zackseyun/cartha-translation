source:
  edition: WLC
  text: וּ/בָזָ֥ה אָלָ֖ה לְ/הָפֵ֣ר בְּרִ֑ית וְ/הִנֵּ֨ה נָתַ֥ן יָד֛/וֹ וְ/כָל אֵ֥לֶּה עָשָׂ֖ה לֹ֥א יִמָּלֵֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/018.yaml
  text: He despised the oath by breaking the covenant[a]; behold, he had given his hand, yet did all these things[b]. He will not escape.
translation:
  language: de
  text: Er verachtete den Eid, indem er den Bund brach[a]. Siehe, er hatte seine Hand darauf gegeben[b] und tat dennoch all dies. Er wird nicht entkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Fluch«. Das hebräische Wort kann einen Eid bezeichnen, der eine Fluchandrohung für den Fall des Bruchs einschließt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »seine Hand gegeben«; eine Wendung für die Bekräftigung eines Versprechens oder einer Vereinbarung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזָה
  choice: Er verachtete
  rationale: בזה bezeichnet verächtliche Missachtung; »verachtete« bewahrt die moralische Schärfe knapp und natürlich.
- source_word: אָלָה
  choice: den Eid
  rationale: אָלָה kann einen mit Fluchandrohung bekräftigten Eid bezeichnen. Im Parallelismus mit »Bund« und im politischen Vertragskontext ist »Eid« im Haupttext passend; die Fluchkomponente bleibt in einer Fußnote sichtbar.
- source_word: לְהָפֵר בְּרִית
  choice: indem er den Bund brach
  rationale: Die Infinitivkonstruktion erläutert, worin die Verachtung des Eides bestand. »Indem« gibt diesen Zusammenhang im Deutschen klar wieder.
- source_word: בְּרִית
  choice: den Bund
  rationale: בְּרִית ist der übliche Begriff für einen Bund. Obwohl hier ein politischer Vertrag gemeint ist, erhält »Bund« das moralische und biblische Gewicht des Ausdrucks.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die folgende Tatsache. Das würdevolle »Siehe« erhält diese rhetorische Funktion.
- source_word: נָתַן יָדוֹ
  choice: er hatte seine Hand darauf gegeben
  rationale: Die hebräische Wendung beschreibt eine Bekräftigung durch Handschlag beziehungsweise ein verbindliches Versprechen. »Darauf« macht den Bezug im Deutschen verständlich, ohne das Bild aufzugeben.
- source_word: וְכָל אֵלֶּה עָשָׂה
  choice: und tat dennoch all dies
  rationale: Das explizite וְ wird mit »und« wiedergegeben; »dennoch« macht den im Kontext liegenden Gegensatz zu seinem Versprechen deutlich.
- source_word: לֹא יִמָּלֵט
  choice: Er wird nicht entkommen
  rationale: Der Nifal von מלט bezeichnet hier das Entkommen vor dem angekündigten Gericht. Die deutsche Formulierung ist präzise und idiomatisch.
theological_decisions:
- issue: Wiedergabe der politischen und zugleich bundestheologischen Terminologie
  choice: »Eid« und »Bund«
  alternative: »Fluch« und/oder »Vertrag«
  rationale: Der Vers verurteilt politischen Treuebruch mit Begriffen, die zugleich moralisches Gewicht vor Gott tragen. »Eid« und »Bund« bewahren beide Ebenen, ohne den konkreten Vertragskontext zu leugnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Form »Siehe« erhält den rhetorischen Nachdruck des Hebräischen; das Hand-Bild bleibt zur Quellentransparenz bewahrt und wird in der Fußnote erläutert.
