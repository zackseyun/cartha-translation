id: EZK.17.2
reference: Ezekiel 17:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אָדָ֕ם ח֥וּד חִידָ֖ה וּ/מְשֹׁ֣ל מָשָׁ֑ל אֶל בֵּ֖ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/002.yaml
  text: Son of man[b][a], pose a riddle and speak a parable to the house of Israel.
translation:
  language: de
  text: Menschensohn[a], gib dem Haus Israel ein Rätsel auf und trage ihm ein Gleichnis[b] vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Sohn des Menschen«; gemeint ist hier ein Mensch oder Sterblicher. »Menschensohn« wird als Hesekiels wiederkehrende Anrede beibehalten.
    reason: lexical_alternative
  - marker: b
    text: Oder »Sprichwort« beziehungsweise »Bildrede«. Das hebräische Wort kann verschiedene Arten bildhafter oder sprichwörtlicher Rede bezeichnen; hier folgt ein ausführliches Gleichnis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels wiederkehrende Anredeform und das hebräische Bild; gemeint ist hier der menschliche Prophet, nicht ein christologischer Titel.
- source_word: חוּד חִידָה
  choice: ein Rätsel aufgeben
  rationale: Die idiomatische deutsche Verbindung gibt den Imperativ und die Bedeutung »ein Rätsel vorlegen« natürlich und präzise wieder.
- source_word: וּמְשֹׁל מָשָׁל
  choice: ein Gleichnis vortragen
  rationale: Der hebräische Ausdruck bezeichnet das Darlegen einer bildhaften Rede. »Vortragen« vermeidet eine unnatürliche etymologische Wiederholung und passt zum folgenden ausführlichen Bildwort.
- source_word: מָשָׁל
  choice: Gleichnis
  rationale: Im Kontext folgt eine ausgedehnte bildhafte Darstellung; »Gleichnis« ist daher treffender als das ebenfalls mögliche »Sprichwort«.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: dem Haus Israel
  rationale: אֶל bezeichnet hier die Adressaten. »Haus Israel« bewahrt die nationale und bundestheologische Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Wiedergabe der Anrede בֶּן אָדָם bei Hesekiel
  choice: Menschensohn
  alternative: Sterblicher; Menschenkind
  rationale: Die Wendung ist hier die wiederkehrende prophetische Anrede für Hesekiel und kein christologischer Titel. Die traditionelle, quellennahe Wiedergabe erhält zugleich die literarische Verknüpfung innerhalb des Buches; die Fußnote verdeutlicht die Bedeutung.
- issue: Gattungsbezeichnung מָשָׁל
  choice: Gleichnis
  alternative: Sprichwort; Bildrede
  rationale: Die nachfolgende ausgedehnte Bildhandlung spricht im Kontext für »Gleichnis«, ohne den möglichen weiteren Bedeutungsumfang des hebräischen Wortes zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Imperative bleiben deutlich erkennbar; Dativpronomen machen den gemeinsamen Adressaten im Deutschen natürlich verständlich.
