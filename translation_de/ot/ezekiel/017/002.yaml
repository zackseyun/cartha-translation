  source_fidelity: Die Übersetzung gibt die beiden hebräischen Imperative חוּד und מְשֹׁל angemessen als „gib … auf“ und „trage … vor“ wieder. „Rätsel“ entspricht חִידָה direkt; „Gleichnis“ ist angesichts der folgenden ausführlichen Bildrede eine kontextuell gut begründete Wiedergabe von מָשָׁל. „dem Haus Israel“ bildet אֶל־בֵּית יִשְׂרָאֵל als Adressatenangabe treffend ab.
  naturalness: „Menschensohn, gib dem Haus Israel ein Rätsel auf und trage ihm ein Gleichnis vor“ ist natürliches, würdiges modernes Standarddeutsch. Das Pronomen „ihm“ stellt im Deutschen klar und unaufdringlich den gemeinsamen Adressaten des zweiten Imperativs her.
  terminology: „Menschensohn“ bewahrt die wiederkehrende Anredeform im Hesekielbuch, ohne deren Bedeutung durch eine christologische Deutung im Text festzulegen. Die Fußnote erläutert die idiomatische Bedeutung sachgerecht. Die Fußnote zu „Gleichnis“ wahrt den weiteren Bedeutungsbereich von מָשָׁל und begründet zugleich die kontextuelle Wahl.
