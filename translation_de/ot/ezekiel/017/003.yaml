base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: The great eagle, great in wings, long in pinions, full of plumage, which had variegated feathers, came to Lebanon and took the top of the cedar.’'
translation:
  language: de
  text: 'und sage: »So spricht der Herr Yahweh: Der große Adler mit großen Flügeln, langen Schwingen und reichem, bunt gemustertem Gefieder[a] kam zum Libanon und nahm den Wipfel der Zeder.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »das Buntheit/Musterung hatte«. Das hebräische Wort bezeichnet sonst auch bunte oder gestickte Arbeit und bezieht sich hier wohl bildlich auf ein vielfarbig gemustertes Gefieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung aus Herrentitel und Gottesnamen wird unterscheidbar und ohne die schwer verständliche Wiederholung „Herr HERR“ wiedergegeben.
- source_word: הַנֶּשֶׁר הַגָּדוֹל
  choice: der große Adler
  rationale: Die traditionelle und im allegorischen Zusammenhang passende Wiedergabe bewahrt Größe und Erhabenheit des Raubvogels.
- source_word: גְּדוֹל הַכְּנָפַיִם
  choice: mit mächtigen Flügeln
  rationale: Das wörtliche „groß an Flügeln“ wird in natürliches Deutsch übertragen; „mächtig“ bezeichnet ihre beeindruckende Größe und Kraft.
- source_word: אֶרֶךְ הָאֵבֶר
  choice: langen Schwungfedern
  rationale: אֵבֶר bezeichnet hier im Vogelbild am ehesten die langen Flug- beziehungsweise Schwungfedern.
- source_word: מָלֵא הַנּוֹצָה
  choice: dichtem Gefieder
  rationale: Die Wendung „voll von Gefieder“ bezeichnet einen Vogel mit reichlichem Federkleid; „dicht“ ist dafür idiomatisches Deutsch.
- source_word: אֲשֶׁר לוֹ הָרִקְמָה
  choice: das bunt gemustert war
  rationale: רִקְמָה bezeichnet Buntheit, Musterung oder Stickarbeit; auf das Gefieder bezogen gibt „bunt gemustert“ das Bild verständlich wieder, ohne die textile Metapher festzuschreiben.
- source_word: בָּא אֶל הַלְּבָנוֹן
  choice: kam zum Libanon
  rationale: Natürliche deutsche Wiedergabe des Richtungsbezugs beim geografischen Namen.
- source_word: צַמֶּרֶת הָאָרֶז
  choice: den Wipfel der Zeder
  rationale: צַמֶּרֶת ist der oberste Teil beziehungsweise die Krone eines Baumes; „Wipfel“ bewahrt das anschauliche Baumbild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: „Yahweh“ macht den im Ausgangstext stehenden persönlichen Gottesnamen sichtbar, während „Herr“ אֲדֹנָי wiedergibt. Dadurch bleiben Titel und Name unterschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dichte Reihe hebräischer Merkmale wurde als flüssige Nominalgruppe gestaltet; das allegorische und poetische Vogel- und Baumbild bleibt erhalten.
