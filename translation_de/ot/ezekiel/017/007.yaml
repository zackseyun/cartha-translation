base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/007.yaml
  text: And there was another great eagle with great wings and much plumage[a]; and behold, this vine bent its roots toward him and sent out its branches to him[d][c][b], that he might water it from the beds where it was planted.
translation:
  language: de
  text: Und es war noch ein anderer großer Adler mit großen Flügeln und dichtem Gefieder.[a] Und siehe, dieser Weinstock wandte seine Wurzeln ihm zu und streckte seine Ranken zu ihm hin aus, damit er ihn aus den Beeten seiner Pflanzung bewässere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch allgemein einen großen Greifvogel bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die Präpositionalgruppe „aus den Beeten seiner Pflanzung“ kann syntaktisch auch mit dem Zuwenden der Wurzeln und dem Ausstrecken der Ranken verbunden werden: Der Weinstock wandte sich von den Beeten seiner Pflanzung weg dem Adler zu.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נֶשֶׁר
  choice: Adler
  rationale: Der Ausdruck kann allgemein einen großen Greifvogel bezeichnen; »Adler« entspricht jedoch dem Bild und dem üblichen Verständnis der Allegorie in Hesekiel 17.
- source_word: גָּדוֹל גְּד֥וֹל כְּנָפַיִם וְרַב נוֹצָה
  choice: großer Adler mit großen Flügeln und dichtem Gefieder
  rationale: Die Wiederholung von גדול bleibt hörbar; »dichtes Gefieder« gibt רב נוצה idiomatisch und anschaulich wieder.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die traditionelle, aber weiterhin verständliche Wendung bewahrt den lebhaften Szenenwechsel des hebräischen Diskursmarkers.
- source_word: כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו
  choice: bog seine Wurzeln ihm entgegen
  rationale: כפנה bezeichnet ein Biegen oder Hinwenden; על bezeichnet hier die Ausrichtung auf den zweiten Adler.
- source_word: דָלִיּוֹתָיו שִׁלְחָה לּוֹ
  choice: streckte seine Ranken nach ihm aus
  rationale: Das Bild ist das gezielte Ausstrecken des Weinstocks zum Adler. »Ranken« passt im Deutschen natürlicher zum Weinstock als »Zweige«.
- source_word: לְהַשְׁקוֹת אוֹתָהּ
  choice: damit er ihn tränke
  rationale: Der Infinitiv bezeichnet den Zweck; der Adler ist sinngemäß das Subjekt und der Weinstock das Objekt. Der Konjunktiv kennzeichnet die angestrebte Versorgung.
- source_word: מֵעֲרֻגוֹת מַטָּעָהּ
  choice: weg von den Beeten, in die er gepflanzt war
  rationale: 'Die Stellung lässt die Präpositionalphrase auf das Hinwenden und Ausstrecken des Weinstocks beziehen: Er wendet sich von seinem Pflanzort weg. Diese syntaktische Zuordnung passt auch zum Kontrast in Vers 8, bleibt aber als mögliche Deutung in einer Fußnote kenntlich.'
theological_decisions:
- issue: Syntaktischer Bezug von מֵעֲרֻגוֹת מַטָּעָהּ
  choice: Die Phrase bezeichnet den Ausgangsort, von dem weg der Weinstock sich dem zweiten Adler zuwendet.
  alternative: 'Die Phrase kann mit dem Tränken verbunden werden: »damit er ihn von den Beeten seiner Pflanzung aus tränke« bzw. »damit er ihn in den Beeten, in die er gepflanzt war, tränke«.'
  rationale: Die masoretische Wortfolge erlaubt Spannung im Bezug. Der Kontext von Vers 8 unterstützt das Wegwenden vom gut versorgten Pflanzort, doch die traditionelle Anbindung an »tränken« ist grammatisch nicht auszuschließen und wird deshalb vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Und siehe« bewahrt bewusst die markierte Erzählwendung; ansonsten werden natürliche Pflanzenbegriffe verwendet. Die grammatische Geschlechtszuweisung folgt dem deutschen Maskulinum »Weinstock«.
