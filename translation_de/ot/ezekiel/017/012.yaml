translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Siehe« bewahrt den markierten Aufmerksamkeitsruf; »Babel« folgt der traditionellen deutschen biblischen Namensform. Die Satzstruktur bleibt der zweifachen Aufforderung אֱמָר ... אֱמֹר eng verbunden.
