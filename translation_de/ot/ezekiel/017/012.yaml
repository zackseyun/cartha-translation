source:
  edition: WLC
  text: אֱמָר נָא֙ לְ/בֵ֣ית הַ/מֶּ֔רִי הֲ/לֹ֥א יְדַעְתֶּ֖ם מָה אֵ֑לֶּה אֱמֹ֗ר הִנֵּה בָ֨א מֶֽלֶךְ בָּבֶ֤ל יְרוּשָׁלִַ֨ם֙ וַ/יִּקַּ֤ח אֶת מַלְכָּ/הּ֙ וְ/אֶת שָׂרֶ֔י/הָ וַ/יָּבֵ֥א אוֹתָ֛/ם אֵלָ֖י/ו בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/012.yaml
  text: Say now to the rebellious house[a], ‘Do you not know what these things mean?’ Say, ‘Behold[c][b], the king of Babylon came to Jerusalem and took its king and its officials and brought them to him in Babylon.’
translation:
  language: de
  text: 'Sag doch zum widerspenstigen Haus: »Wisst ihr nicht, was das bedeutet?[a]« Sag: »Siehe, der König von Babel kam nach Jerusalem, nahm dessen König und dessen führende Männer[b] und brachte sie zu sich nach Babel.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »was diese sind«. Im Zusammenhang ist wahrscheinlich die Bedeutung der vorausgehenden Bildrede gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Fürsten« beziehungsweise »hohen Beamten«. Das hebräische Wort bezeichnet führende Männer in Herrschaft und Verwaltung.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch mit einer Richtungsendung: »nach Babel«. Gemeint ist, dass sie dorthin gebracht wurden.'
    reason: source_form
lexical_decisions:
- source_word: בֵית הַמֶּרִי
  choice: das widerspenstige Haus
  rationale: Die in Hesekiel wiederkehrende korporative Bezeichnung wird mit »Haus« formal bewahrt; »widerspenstig« gibt die dauerhafte Haltung der Auflehnung in natürlichem Deutsch wieder.
- source_word: הֲלֹא יְדַעְתֶּם מָה אֵלֶּה
  choice: Wisst ihr nicht, was das bedeutet?
  rationale: ידע bleibt mit »wissen« eng am Hebräischen; der Singular »das« fasst die vorausgehende Bildrede zusammen, und »bedeutet« macht den im Kontext gemeinten Deutungssinn idiomatisch deutlich.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Der Aufmerksamkeitspartikel leitet feierlich die Erklärung der Bildrede ein. »Siehe« ist in biblisch-würdigem Deutsch etabliert, ohne den Inhalt auszudeuten.
- source_word: בָּא ... יְרוּשָׁלַםִ
  choice: kam nach Jerusalem
  rationale: Das Perfekt bezeichnet hier das berichtete historische Geschehen; »nach« ist bei der Bewegung zu einer Stadt im Deutschen idiomatisch.
- source_word: מַלְכָּהּ
  choice: dessen König
  rationale: Das Suffix bezieht sich auf Jerusalem. Das Relativpronomen stellt den Bezug im Deutschen klar her und vermeidet eine unnatürliche Personifizierung der Stadt.
- source_word: שָׂרֶיהָ
  choice: dessen führende Männer
  rationale: שׂרים bezeichnet hochrangige politische oder gesellschaftliche Führungsträger. Die Formulierung lässt offen, ob speziell Fürsten oder allgemeiner Amtsträger gemeint sind.
- source_word: וַיְבֵא אוֹתָם אֵלָיו
  choice: brachte sie zu sich
  rationale: אֵלָיו bezeichnet die Bewegung zum König von Babel; »zu sich« gibt den rückbezüglichen Sinn im Deutschen klar und knapp wieder.
- source_word: בָּבֶלָה
  choice: nach Babel
  rationale: Die direktive Endung -ה bezeichnet ausdrücklich die Richtung nach Babel; diese Bewegungsrichtung sollte trotz des bereits vorhandenen Verbs im Deutschen erhalten bleiben.
