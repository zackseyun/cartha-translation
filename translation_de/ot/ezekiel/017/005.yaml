  yaml_path: translation/ot/ezekiel/017/005.yaml
  text: Then he took some of the seed of the land and planted it in fertile soil[a]; he placed it beside abundant waters, like a willow.
translation:
  language: de
  text: Dann nahm er etwas vom Samen des Landes und setzte es auf ein Saatfeld; er setzte es an reichlich Wasser und pflanzte es wie eine Weide[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pappel“. Welche Pflanze mit dem hebräischen Wort צַפְצָפָה gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הָאָרֶץ
  choice: etwas vom Samen des Landes
  rationale: Bewahrt den partitiven Sinn der Präposition מִן und zugleich das landwirtschaftliche Bild; „Samen“ kann innerhalb des Gleichnisses zugleich auf Herkunft und Pflanzung vorausweisen.
- source_word: וַיִּתְּנֵהוּ בִּשְׂדֵה זָרַע
  choice: setzte es in ein Saatfeld
  rationale: נתן bedeutet zunächst „setzen/stellen/legen“; „Saatfeld“ gibt das wörtliche בִּשְׂדֵה זָרַע verständlich wieder, ohne die Fruchtbarkeit ausdrücklich in den Text einzutragen.
- source_word: קָח עַל מַיִם רַבִּים
  choice: Er brachte es an reichlich Wasser
  rationale: קָח wird als Imperativ bzw. imperativisch erstarrte Form von לקח verstanden und sinngemäß auf das handelnde Subjekt bezogen. עַל bezeichnet hier die Lage am Wasser; „reichlich Wasser“ bewahrt die Vorstellung einer üppigen Wasserversorgung.
- source_word: צַפְצָפָה שָׂמוֹ
  choice: setzte es als Weide
  rationale: שׂים wird mit „setzen“ wiedergegeben; die Konstruktion bezeichnet wahrscheinlich, als was die Pflanze gesetzt wurde. צַפְצָפָה wird traditionell als wasserliebende Weide verstanden, bleibt botanisch jedoch unsicher.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Bildfolge. Die ungewöhnliche Wiederholung von „setzte“ spiegelt die beiden verschiedenen hebräischen Verben נתן und שׂים nicht vollständig, hält aber die konkrete Pflanzhandlung sichtbar. Die schwierige Form קָח wird in natürlichem Deutsch als fortgesetzte Erzählung wiedergegeben.
