base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/015.yaml
  text: But he rebelled against him by sending his messengers to Egypt[a], that they might give him horses and many people. Will he prosper? Will he escape[b], who does these things? Can he break a covenant and yet escape?
translation:
  language: de
  text: Doch er rebellierte gegen ihn, indem er seine Gesandten nach Ägypten sandte, damit man ihm Pferde und zahlreiche Truppen[a] gebe. Wird er Erfolg haben? Wird jemand, der dies tut, entkommen? Kann er einen Bund brechen[b] und trotzdem entkommen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Pferde und zahlreiches Volk“; im Zusammenhang ist militärische Unterstützung aus Ägypten gemeint, also ein großes Heer oder zahlreiche Truppen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Bund verletzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְרָד בּוֹ
  choice: Doch er rebellierte gegen ihn
  rationale: מרד bezeichnet die Auflehnung gegen einen Oberherrn; die Präposition mit Pronomen wird im Deutschen idiomatisch als „gegen ihn“ wiedergegeben.
- source_word: לִשְׁלֹחַ מַלְאָכָיו מִצְרַיִם
  choice: Er sandte seine Gesandten nach Ägypten
  rationale: מַלְאָכִים sind hier diplomatische Boten beziehungsweise Gesandte. Ein neuer Hauptsatz gibt das Mittel der Auflehnung in natürlichem Deutsch klar wieder.
- source_word: לָתֶת לוֹ סוּסִים וְעַם רָב
  choice: damit man ihm Pferde und zahlreiche Truppen gebe
  rationale: Der Infinitiv bezeichnet den Zweck der Gesandtschaft. עַם רָב heißt wörtlich „zahlreiches Volk“, meint im militärpolitischen Zusammenhang aber die erbetene ägyptische Mannschaftsstärke; die wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: הֲיִצְלָח
  choice: Wird er Erfolg haben?
  rationale: צלח fragt hier nach dem Gelingen der politischen Auflehnung; „Erfolg haben“ ist gegenwärtiges, verständliches Deutsch.
- source_word: הֲיִמָּלֵט הָעֹשֵׂה אֵלֶּה
  choice: Wird einer, der so etwas tut, entkommen?
  rationale: Die substantivierte Partizipialform wird generisch wiedergegeben; נמלט bezeichnet das Entkommen aus drohender Strafe oder Gefahr.
- source_word: וְהֵפֵר בְּרִית וְנִמְלָט
  choice: Kann er einen Bund brechen und trotzdem entkommen?
  rationale: Die wiederholte Frage steigert die rhetorische Anklage. „Trotzdem“ macht die im Hebräischen angelegte Unvereinbarkeit deutlich, ohne den Inhalt zu erweitern.
theological_decisions:
- issue: Bedeutung von בְּרִית im politischen Zusammenhang
  choice: Bund
  alternative: Vertrag
  rationale: Obwohl ein politisches Abkommen gemeint ist, bewahrt „Bund“ das moralische und theologische Gewicht des hebräischen Begriffs sowie den Zusammenhang von Eid und Treuebruch.
- issue: Bestimmtheit von בְּרִית
  choice: einen Bund
  alternative: den Bund
  rationale: Das hebräische Substantiv steht ohne Artikel. Der Kontext weist zwar auf einen bestimmten bekannten Bund, doch die indefinite Form erhält die sprachliche Gestalt und den zugleich grundsätzlichen Charakter der rhetorischen Frage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen rhetorischen Fragen und die Wiederholung von „entkommen“ bleiben erhalten. „Gesandte“ bringt den diplomatischen Kontext zum Ausdruck; der Doppelpunkt verdeutlicht, wie sich die Auflehnung vollzog.
