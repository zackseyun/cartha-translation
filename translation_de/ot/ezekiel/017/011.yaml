  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/011.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: In der prophetischen Botenformel wird וַיְהִי דְבַר idiomatisch und würdevoll mit „Da erging das Wort“ wiedergegeben. Das ist im Deutschen natürlicher als das wörtliche „Und es geschah das Wort“.
- source_word: דְבַר
  choice: das Wort
  rationale: „Wort“ bewahrt die feste prophetische Formel und den direkten Bezug zum hebräischen דָּבָר; „Botschaft“ wäre möglich, aber stärker deutend.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben. Der Genitiv fügt sich natürlich in die Wendung „das Wort Jahwes“ ein.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei einem Wort, das jemanden erreicht, entspricht „an mich“ der natürlichen deutschen Ausdrucksweise und gibt die Richtung des hebräischen אֶל mit Suffix genau wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Da im nächsten Vers die direkte Rede folgt, übernimmt der Doppelpunkt im modernen Deutschen idiomatisch die Funktion von לֵאמֹר. Ein zusätzliches „folgendermaßen“ oder „und sprach“ wäre möglich, aber schwerfälliger beziehungsweise würde das Subjekt verdeutlichen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה und keinen Titel. „Jahwe“ bewahrt diesen Unterschied; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „Da erging das Wort Jahwes an mich“ bewahrt den biblischen Ton, ohne altertümlich oder unnötig wörtlich zu wirken. Der Doppelpunkt leitet die im folgenden Vers einsetzende Rede ein.
