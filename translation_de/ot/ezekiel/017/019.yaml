  text: לָ/כֵ֞ן כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֗א אָֽלָתִ/י֙ אֲשֶׁ֣ר בָּזָ֔ה וּ/בְרִיתִ֖/י אֲשֶׁ֣ר הֵפִ֑יר וּ/נְתַתִּ֖י/ו בְּ/רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/019.yaml
  text: 'Therefore thus says the Lord GOD: As I live[a], surely my oath that he despised and my covenant that he broke—I will place them on his own head.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: So wahr ich lebe: Meinen Eid, den er verachtet hat, und meinen Bund, den er gebrochen hat – das werde ich auf seinen Kopf kommen lassen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Vorwurf knapp und natürlich wieder.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feierliche prophetische Botenformel in geläufigem biblischem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschertitel als auch den Gottesnamen wieder und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Natürliche deutsche Entsprechung der feierlichen göttlichen Schwurformel.
- source_word: אִם לֹא
  choice: nicht gesondert ausgedrückt; durch die Schwurformel und den bestimmten Zukunftssatz wiedergegeben
  rationale: Im Schwurzusammenhang verstärkt die Wendung die Bekräftigung; ein zusätzliches „gewiss“ wäre im Deutschen möglich, aber stilistisch schwerfälliger.
- source_word: אָלָתִי
  choice: meinen Eid
  rationale: Der Zusammenhang betont die missachtete eidliche Verpflichtung; die im Wort mögliche Fluchkomponente wird in der Fußnote bewahrt.
- source_word: בָּזָה
  choice: den er verachtet hat
  rationale: Gibt die bewusste geringschätzige Missachtung stark und präzise wieder.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: Bewahrt den theologischen und rechtlichen Gehalt von בְּרִית; Yahweh nimmt den politisch geschlossenen Bund als unter seiner Sanktion stehend in Anspruch.
- source_word: הֵפִיר
  choice: den er gebrochen hat
  rationale: Klare und übliche deutsche Verbindung für die Verletzung eines Bundes.
- source_word: וּנְתַתִּיו בְּרֹאשׁוֹ
  choice: werde ich auf seinen eigenen Kopf bringen
  rationale: Bewahrt das konkrete Bild dafür, dass Schuld und Folgen auf den Täter selbst zurückfallen; das singularische Suffix wird als zusammenfassender Rückbezug verstanden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Wiedergabe nennt den offenbarten Eigennamen und erhält zugleich אֲדֹנָי als Herrschertitel, ohne beide Elemente zusammenzuziehen.
- issue: Bedeutung von אָלָה
  choice: mein Eid
  alternative: mein Fluch
  rationale: Im unmittelbaren Zusammenhang steht die verletzte eidliche Verpflichtung im Vordergrund. Da אָלָה zugleich einen mit Fluchandrohung bekräftigten Eid bezeichnen kann, bleibt diese Bedeutungsnuance in der Fußnote erhalten.
- issue: Bezug des singularischen Objektsuffixes in וּנְתַתִּיו
  choice: zusammenfassender Bezug auf den missachteten Eid und den gebrochenen Bund beziehungsweise deren Folgen
  alternative: ausschließlicher Bezug auf den Eid oder seine Fluchfolge
  rationale: Das maskuline Singularsuffix passt grammatisch besonders zu „Bund“, kann die gesamte vorausgehende Verfehlung aber zusammenfassend aufnehmen. Die Übersetzung bewahrt den Singularcharakter durch eine gemeinsame verbale Fügung, ohne ein zusätzliches Pronomen festzulegen.
translation_notes:
  register: Feierlicher, moderner Standardstil mit bewahrter prophetischer Formel. „So wahr ich lebe“ ist idiomatisches Deutsch für den göttlichen Selbsteid; „auf seinen eigenen Kopf bringen“ erhält das anschauliche Gerichtswort.
