revisions:
- from: 'Darum, so spricht der Herr Yahweh: So wahr ich lebe: Meinen Eid[a], den er verachtet hat, und meinen Bund, den er gebrochen hat, werde ich auf seinen eigenen Kopf bringen.'
  to: 'Darum, so spricht der Herr Yahweh: So wahr ich lebe: Meinen Eid, den er verachtet hat, und meinen Bund, den er gebrochen hat – das werde ich auf seinen Kopf kommen lassen.'
  rationale: Die Schlusswendung wird mit dem resumptiven Singular „das“ wiedergegeben. Dies spiegelt die singularische Wiederaufnahme des Hebräischen und lässt offen, ob sie enger auf Eid, Bund oder zusammenfassend auf die daraus folgende Schuld bzw. Sanktion zielt. „Auf seinen Kopf kommen lassen“ bewahrt das Bild, ist aber im modernen Deutschen idiomatischer als „auf seinen Kopf bringen“.
