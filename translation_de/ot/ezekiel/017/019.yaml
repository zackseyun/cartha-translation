    issue: Der Schluss gibt das singularische Objektsuffix in וּנְתַתִּיו nicht erkennbar wieder.
    rationale: Die Konstruktion „Meinen Eid ... und meinen Bund ... werde ich ... bringen“ macht beide Nominalgruppen zu direkten Objekten. Das Hebräische verwendet dagegen nach den beiden Nominalgruppen ein singularisches Suffix. Der genaue Bezug kann diskutiert werden; die Übersetzung sollte ihn nicht durch eine eindeutig plurale Objektkonstruktion festlegen.
