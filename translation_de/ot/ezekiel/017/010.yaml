  naturalness: Die Revision glättet die leicht sperrige Verbindung von „Obwohl“ mit der rhetorischen Frage und wahrt einen modernen, würdevollen Ton.
  terminology: „Ostwind“, „gedeihen“, „verdorren“ und „Beete“ sind angemessen. Die Kulturnote wird auf die sachliche meteorologische Erklärung begrenzt; die Deutung als Gericht wird nicht als Bestandteil des Ausdrucks selbst festgeschrieben.
