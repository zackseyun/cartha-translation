revisions:
- from: 'Und sieh: Obwohl sie eingepflanzt ist, wird sie gedeihen? Wird sie nicht völlig verdorren, sobald der Ostwind sie berührt? Auf den Beeten, auf denen sie gewachsen ist, wird sie verdorren.[a][b]'
  to: 'Und siehe: Sie ist zwar gepflanzt – wird sie gedeihen? Wird sie nicht völlig verdorren, wenn der Ostwind sie berührt? Auf den Beeten, auf denen sie gewachsen ist, wird sie verdorren.[a][b]'
  rationale: Die Änderung zu „gepflanzt“ bleibt beim sicheren Bedeutungsumfang des Partizips. Die Konstruktion „Sie ist zwar gepflanzt – wird sie gedeihen?“ bildet die hebräische rhetorische Gegenüberstellung natürlich ab, ohne die unmarkierte Partizipialkonstruktion zu überdeuten. „Wenn“ ist für den Kontakt des Ostwinds quellentreuer als „sobald“. Die Fußnote erläutert den Ostwind sachlich und lässt die kontextuelle Bilddeutung offen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:31Z'
