  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen, das feminine Pronomen für die Rebe und die Wiederholung von „verdorren“ bleiben erhalten. Die Fußnotenmarker stehen im Haupttext; [a] erläutert die emphatische Verbkonstruktion, [b] den kulturellen Hintergrund des Ostwinds.
