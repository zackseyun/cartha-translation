base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/010.yaml
  text: And look[a], though it is planted[c][b], will it prosper? Will it not completely wither when the east wind touches it? It will wither on the beds where it sprouted.
translation:
  language: de
  text: 'Und siehe: Sie ist zwar gepflanzt – wird sie gedeihen? Wird sie nicht völlig verdorren, wenn der Ostwind sie berührt? Auf den Beeten, auf denen sie gewachsen ist, wird sie verdorren.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Wird sie ganz gewiss vertrocknen“; im Hebräischen wird das Verb durch einen Infinitiv derselben Wortwurzel verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: Der „Ostwind“ ist ein heißer, trockener Wind aus östlicher Richtung, der Pflanzen schädigen kann.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung lenkt die Aufmerksamkeit nachdrücklich auf die Folgerung des Bildes; „Und sieh“ ist modern und bewahrt die deiktische Kraft.
- source_word: שְׁתוּלָה
  choice: eingepflanzt
  rationale: Das passive Partizip von שתל bezeichnet die bereits eingesetzte beziehungsweise umgepflanzte Rebe; „eingepflanzt“ passt natürlich zum Kontext.
- source_word: הֲתִצְלָח
  choice: wird sie gedeihen?
  rationale: צלח bezeichnet Erfolg oder Gelingen; im Pflanzenbild gibt „gedeihen“ die konkrete Wachstumsbedeutung natürlich wieder.
- source_word: כְגַעַת בָּהּ
  choice: sobald ... sie berührt
  rationale: Der Infinitiv mit כ kann den Zeitpunkt beziehungsweise Umstand des Kontakts ausdrücken; „sobald“ vermittelt hier die unmittelbare Folge.
- source_word: רוּחַ הַקָּדִים
  choice: der Ostwind
  rationale: Dies ist die übliche Bezeichnung für den heißen, austrocknenden Wind aus der östlichen Wüste.
- source_word: תִּיבַשׁ יָבֹשׁ
  choice: wird sie nicht völlig verdorren
  rationale: Infinitivus absolutus und finites Verb derselben Wurzel verstärken die Aussage; „völlig verdorren“ erhält Nachdruck und Pflanzenbild.
- source_word: עַל עֲרֻגוֹת צִמְחָהּ
  choice: Auf den Beeten, auf denen sie gewachsen ist
  rationale: עֲרֻגוֹת sind kultivierte Beete oder Pflanzflächen; צִמְחָהּ verweist auf ihr Wachstum. Die Formulierung bezeichnet den Ort ihres bisherigen Wachsens.
- source_word: תִּיבָשׁ
  choice: wird sie verdorren
  rationale: Die abschließende Wiederholung stellt das Ergebnis nochmals fest und wahrt mit „verdorren“ das Pflanzenbild.
