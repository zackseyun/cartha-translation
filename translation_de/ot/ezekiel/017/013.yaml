  text: וַ/יִּקַּח֙ מִ/זֶּ֣רַע הַ/מְּלוּכָ֔ה וַ/יִּכְרֹ֥ת אִתּ֖/וֹ בְּרִ֑ית וַ/יָּבֵ֤א אֹת/וֹ֙ בְּ/אָלָ֔ה וְ/אֶת אֵילֵ֥י הָ/אָ֖רֶץ לָקָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/013.yaml
  text: And he took one of the royal offspring and made a covenant with him[a], bringing him under an oath, and he took the mighty men of the land.
translation:
  language: de
  text: Und er nahm einen aus dem königlichen Geschlecht, schloss mit ihm einen Bund und verpflichtete ihn durch einen Eid[a]. Und die Mächtigen des Landes nahm er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verpflichtete ihn durch einen Flucheid“. Das hebräische Wort kann einen Eid bezeichnen, der für den Fall des Eidbruchs mit einem Fluch verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: einen aus dem königlichen Geschlecht
  rationale: זֶרַע bezeichnet bei menschlicher Abstammung Nachkommenschaft; מִן ist hier partitiv. Die Formulierung gibt die dynastische Zugehörigkeit in natürlichem modernem Deutsch wieder.
- source_word: וַיִּכְרֹת אִתּוֹ בְּרִית
  choice: schloss mit ihm einen Bund
  rationale: כרת ברית ist die feste Wendung für das Schließen eines Bundes. „Bund“ bewahrt den feierlich bindenden Charakter und verengt die Aussage nicht auf einen rein weltlichen Vertrag.
- source_word: וַיָּבֵא אֹתוֹ בְּאָלָה
  choice: verpflichtete ihn durch einen Eid
  rationale: Die Wendung besagt, dass er ihn unter eine eidlich bekräftigte Verpflichtung stellte. אָלָה kann zugleich den Fluch für den Eidbruch einschließen; diese Bedeutungsnuance wird in der Fußnote bewahrt.
- source_word: אֵילֵי הָאָרֶץ
  choice: die Mächtigen des Landes
  rationale: אֵילִים, wörtlich „Widder“, bezeichnet bildlich einflussreiche und starke Männer. „Die Mächtigen“ wahrt die Bildbedeutung von Stärke und Rang, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: לָקָח
  choice: nahm er mit
  rationale: לקח bedeutet grundsätzlich „nehmen“. „Nahm er mit“ macht im Deutschen den kontextuellen Sinn der Wegführung deutlich, ohne die stärkere Bedeutung „ergriff“ oder „verschleppte“ in den Text einzutragen.
theological_decisions:
- issue: Bundespolitische Terminologie
  choice: „Bund“
  alternative: „Vertrag“ oder „Bündnis“
  rationale: בְּרִית ist der gewöhnliche Begriff für einen Bund. Auch im politischen Zusammenhang bleibt die feierliche, durch einen Eid bekräftigte Bindung erhalten.
- issue: Bedeutungsspektrum von אָלָה
  choice: Im Haupttext „Eid“, mit Fluchdimension in der Fußnote
  alternative: „Fluch“ oder „Flucheid“ im Haupttext
  rationale: Das Wort kann sowohl den Eid als auch die mit dem Eid verbundene Fluchandrohung bezeichnen. Die gewählte Lösung bleibt verständlich und löst die im Hebräischen vorhandene Spannung nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem hebräischen Erzählgang; „aber“ markiert beim letzten Satzglied den Wechsel vom königlichen Nachkommen zu den Mächtigen des Landes. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Eidformulierung.
