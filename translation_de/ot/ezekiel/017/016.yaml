id: EZK.17.16
reference: Ezekiel 17:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א בִּ/מְקוֹם֙ הַ/מֶּ֨לֶךְ֙ הַ/מַּמְלִ֣יךְ אֹת֔/וֹ אֲשֶׁ֤ר בָּזָה֙ אֶת אָ֣לָת֔/וֹ וַ/אֲשֶׁ֥ר הֵפֵ֖ר אֶת בְּרִית֑/וֹ אִתּ֥/וֹ בְ/תוֹךְ בָּבֶ֖ל יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
translation:
  language: de
  text: So wahr ich lebe – Ausspruch des Herrn Yahweh –, gewiss wird er am Ort des Königs, der ihn zum König gemacht hat, dessen Eid[a] er verachtet und dessen Bund[b] er gebrochen hat, bei ihm mitten in Babel sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Fluchschwur er verachtet“. Das hebräische Wort für „Eid“ kann einen Eid bezeichnen, der mit einer Selbstverfluchung verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dessen Vertrag er gebrochen hat“. Das meist mit „Bund“ wiedergegebene hebräische Wort kann auch einen politischen Vertrag zwischen Königen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Die feste hebräische Schwurformel wird mit der geläufigen deutschen Beteuerungsformel wiedergegeben.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: נְאֻם bezeichnet die prophetische Ausspruchsformel; אֲדֹנָי wird als „Herr“ und der Gottesname יְהוִה als „Yahweh“ wiedergegeben.
- source_word: אִם לֹא
  choice: gewiss
  rationale: In Verbindung mit der vorangehenden Schwurformel drückt אִם לֹא eine starke Bekräftigung aus und keinen gewöhnlichen Bedingungssatz.
- source_word: בִּמְקוֹם
  choice: am Ort
  rationale: Die knappe Ortsangabe bleibt erhalten und wird im Deutschen idiomatisch formuliert.
- source_word: הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ
  choice: des Königs, der ihn zum König gemacht hat
  rationale: Die Wiedergabe bewahrt die Wortverbindung zwischen „König“ und „zum König machen“ sowie das politische Abhängigkeitsverhältnis.
- source_word: אֲשֶׁר בָּזָה אֶת אָלָתוֹ
  choice: dessen Eid er verachtet
  rationale: אָלָה bezeichnet einen Eid, der den Gedanken einer Selbstverfluchung einschließen kann; die Grundbedeutung steht im Text, die stärkere Nuance in der Fußnote.
- source_word: וַאֲשֶׁר הֵפֵר אֶת בְּרִיתוֹ
  choice: und dessen Bund er gebrochen hat
  rationale: בְּרִית kann sowohl einen Bund als auch einen politischen Vertrag bezeichnen. „Bund“ wahrt die Breite und das Gewicht des hebräischen Ausdrucks.
- source_word: אִתּוֹ
  choice: bei ihm
  rationale: Das Pronomen verweist auf den König, der ihn eingesetzt hatte; „bei ihm“ gibt die lokale beziehungsweise persönliche Zuordnung im Deutschen natürlich wieder.
- source_word: בְתוֹךְ בָּבֶל
  choice: mitten in Babel
  rationale: Die räumliche Hervorhebung von בְתוֹךְ wird bewahrt; „Babel“ entspricht der traditionellen deutschen Form des hebräischen Ortsnamens.
- source_word: יָמוּת
  choice: wird er sterben
  rationale: Das Imperfekt hat in der göttlichen Schwurerklärung sicheren Zukunftsbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in der prophetischen Formel
  choice: Yahweh
  alternative: der HERR
  rationale: Die Umschrift gibt den im hebräischen Text stehenden persönlichen Gottesnamen erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von בְּרִית im politischen Zusammenhang
  choice: Bund
  alternative: Vertrag
  rationale: „Bund“ erhält die theologische und rechtliche Bedeutungsbreite des Ausdrucks; der konkrete politische Sinn wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche heben die prophetische Ausspruchsformel ab, ohne den langen Schwursatz unnötig zu zerteilen. Die ungewöhnliche Häufung der Bezüge auf den babylonischen König bleibt erhalten, da sie zur rhetorischen Zuspitzung des hebräischen Textes gehört.
