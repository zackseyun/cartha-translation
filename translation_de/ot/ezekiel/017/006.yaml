base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/006.yaml
  text: And it sprouted and became a spreading vine[a], low in stature, with its branches turned toward him and its roots beneath him[c][b]. So it became a vine and produced branches and sent out boughs.
translation:
  language: de
  text: Und er spross auf und wurde zu einem weit ausladenden Weinstock[a] von niedrigem Wuchs, dessen Ranken sich ihm zuwandten und dessen Wurzeln unter ihm waren[c]. So wurde er zu einem Weinstock[b], brachte Zweige hervor und streckte Äste aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „üppigen“ beziehungsweise „sich verzweigenden Weinstock“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wiederholung „wurde zu einem Weinstock“ entspricht dem Hebräischen und hebt die Entwicklung hervor.
    reason: literary_feature
  - marker: c
    text: „Ihm“ bezieht sich im Bild wahrscheinlich auf den großen Adler (vgl. Hesekiel 17,3–4); die Pronomen können jedoch auch auf den Pflanzort bezogen verstanden werden.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיִּצְמַח
  choice: er spross auf
  rationale: צמח bezeichnet hier das beginnende Wachstum des Gepflanzten; „spross auf“ gibt diesen Vorgang anschaulich und knapp wieder.
- source_word: וַיְהִי לְגֶפֶן סֹרַחַת
  choice: wurde zu einem weit ausladenden Weinstock
  rationale: Die Konstruktion bezeichnet das Ergebnis der Entwicklung; סֹרַחַת beschreibt die seitliche Ausbreitung des Weinstocks.
- source_word: שִׁפְלַת קוֹמָה
  choice: von niedrigem Wuchs
  rationale: Dies bewahrt die wörtliche Vorstellung geringer Höhe und klingt im Deutschen natürlich.
- source_word: לִפְנוֹת דָּלִיּוֹתָיו אֵלָיו
  choice: Seine Ranken sollten sich ihm zuwenden
  rationale: ל mit Infinitiv kann Zweck oder beabsichtigtes Ergebnis ausdrücken. „Ranken“ passt zum Weinstock und „sich zuwenden“ bewahrt die Richtung und Abhängigkeit.
- source_word: וְשָׁרָשָׁיו תַּחְתָּיו יִהְיוּ
  choice: und seine Wurzeln sollten unter ihm bleiben
  rationale: יִהְיוּ wird ausdrücklich wiedergegeben; „bleiben“ erfasst die fortdauernde Lage, ohne das Bild näher auszudeuten.
- source_word: וַתְּהִי לְגֶפֶן
  choice: So wurde er zu einem Weinstock
  rationale: Die Wiederholung des Hebräischen wird als Teil der erzählerischen Steigerung beibehalten.
- source_word: וַתַּעַשׂ בַּדִּים
  choice: brachte Zweige hervor
  rationale: עשה mit בַּדִּים bezeichnet das Hervorbringen von Zweigen; die Formulierung ist präzise und idiomatisch.
- source_word: וַתְּשַׁלַּח פֹּארוֹת
  choice: trieb Äste
  rationale: שׁלח bezeichnet das Aussenden beziehungsweise Austreiben; פֹּארוֹת meint kräftige Verzweigungen oder Äste und wird dadurch von בַּדִּים unterschieden.
- source_word: אֵלָיו / תַּחְתָּיו
  choice: ihm
  rationale: Die Suffixe sind maskulin Singular. Die persönliche Wiedergabe bewahrt ihren möglichen Bezug auf den großen Adler, statt die Referenz durch ein unpersönliches Pronomen einzuebnen.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe im Gleichnis vom Weinstock
  choice: Persönlich mit „ihm“ wiedergeben, wahrscheinlich mit Bezug auf den großen Adler.
  alternative: Unpersönlich mit „ihm“ im Sinne des Bildgegenstands oder freier mit „darunter/dorthin“ wiedergeben.
  rationale: Die hebräischen Suffixe sind maskulin Singular, und der große Adler ist im Kontext ein naheliegender Bezug. Die Übersetzung bewahrt diese Personifizierung, während die Fußnote die verbleibende Bezugsunsicherheit offenlegt.
- issue: Zweck oder Ergebnis in לִפְנוֹת ... יִהְיוּ
  choice: Mit „sollten“ die ausgerichtete Bestimmung beziehungsweise das beabsichtigte Ergebnis ausdrücken.
  alternative: 'Rein beschreibend: „seine Ranken wandten sich ihm zu, und seine Wurzeln waren unter ihm“.'
  rationale: Die Infinitivkonstruktion mit ל lässt Zweck und Ergebnis ineinander übergehen. „Sollten“ wahrt diese Spannung, ohne eine göttliche oder moralische Verpflichtung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Das maskuline „er“ nimmt den im Deutschen maskulinen Samen beziehungsweise Setzling aus dem Kontext auf und geht anschließend natürlich in den ebenfalls maskulinen „Weinstock“ über. Die botanischen Begriffe „Ranken“, „Zweige“ und „Äste“ halten die Bildsprache lebendig und unterscheiden die hebräischen Ausdrücke, ohne künstlich technisch zu wirken.
