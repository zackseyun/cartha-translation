base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/020.yaml
  text: I will spread my net over him[a], and he will be caught in my snare; then I will bring him to Babylon[b], and there I will enter into judgment with him for his treachery by which he acted treacherously against me.
translation:
  language: de
  text: Ich werde mein Netz über ihm ausbreiten, und in meiner Schlinge wird er gefangen werden. Dann werde ich ihn nach Babel bringen und dort mit ihm ins Gericht gehen[a] wegen seines Treuebruchs[b], den er mir gegenüber begangen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn dort richten«. Die hebräische Wendung kann einfacher wiedergegeben werden; »mit ihm ins Gericht gehen« betont ihren rechtlichen Charakter.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Treulosigkeit« oder »Untreue«. Das hebräische Wort bezeichnet einen schweren Bruch geschuldeter Treue, hier im Zusammenhang von Eid und Bund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרַשְׂתִּי עָלָיו רִשְׁתִּי
  choice: Ich werde mein Netz über ihm ausbreiten
  rationale: פָרַשׂ mit רֶשֶׁת bezeichnet das Ausbreiten eines Netzes; „über ihm“ gibt עָלָיו direkt und natürlich wieder.
- source_word: וְנִתְפַּשׂ בִּמְצוּדָתִי
  choice: er wird sich in meinem Fangnetz verfangen
  rationale: Das Niphal von תפשׂ beschreibt hier das Gefangenwerden. מְצוּדָה kann auch „Festung“ bedeuten, meint im Parallelismus mit „Netz“ jedoch eine Fangvorrichtung. „Fangnetz“ hält das Jagdbild lebendig und vermeidet die mögliche moderne Nebenbedeutung von „Falle“.
- source_word: וַהֲבִיאוֹתִיהוּ בָבֶלָה
  choice: Dann werde ich ihn nach Babel bringen
  rationale: Das Hifil bezeichnet das Hinbringen; die Richtungsendung an בָבֶל wird mit „nach Babel“ wiedergegeben. „Dann“ macht die hebräische Handlungsfolge idiomatisch deutlich.
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם
  choice: dort mit ihm ins Gericht gehen
  rationale: Die Niphal-Konstruktion mit אֵת hat eine forensische, relationale Färbung. „Mit ihm ins Gericht gehen“ bewahrt diese stärker als das schlichtere „ihn richten“.
- source_word: מַעֲלוֹ אֲשֶׁר מָעַל בִּי
  choice: wegen seiner Untreue, mit der er mir untreu geworden ist
  rationale: מעל bezeichnet einen Vertrauens- oder Treuebruch, häufig im Bundeszusammenhang. Die Wiederholung von „Untreue/untreu“ bildet die hebräische figura etymologica nach und lässt den politischen wie den auf Gott bezogenen Treuebruch erkennbar.
theological_decisions:
- issue: Art des durch מַעַל / מָעַל bezeichneten Vergehens
  choice: Untreue … mir untreu geworden
  alternative: Treuebruch … treulos an mir gehandelt; Veruntreuung; Schuld
  rationale: Im Zusammenhang ist Zedekias Bruch von Eid und Bund zugleich als Vergehen gegen Gott dargestellt. „Untreue“ wahrt diesen Bundes- und Beziehungsaspekt, ohne das Vergehen auf eine rein kultische oder politische Kategorie zu verengen.
- issue: Gerichtliche Bedeutung von וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: mit ihm ins Gericht gehen
  alternative: ihn richten; mit ihm rechten
  rationale: Die gewählte Formulierung bewahrt den Gedanken einer gerichtlichen Auseinandersetzung. Sie legt weder nur den Vorgang noch ausschließlich den abschließenden Urteilsspruch fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Babel“ folgt der im deutschen Bibelgebrauch vertrauten Bezeichnung der Stadt. Die Wiederholung „Untreue … untreu“ ist bewusst beibehalten, um die nachdrückliche Wortwiederholung des Hebräischen abzubilden.
