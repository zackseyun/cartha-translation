  text: אֵ֛ת רֹ֥אשׁ יְנִֽיקוֹתָ֖י/ו קָטָ֑ף וַ/יְבִיאֵ֨/הוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן בְּ/עִ֥יר רֹכְלִ֖ים שָׂמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/004.yaml
  text: He plucked off the topmost of its young shoots and brought it to the land of Canaan[a]; he set it in a city of merchants.
translation:
  language: de
  text: Er pflückte den obersten ihrer jungen Triebe ab und brachte ihn in das Land der Händler[a]; in einer Stadt von Kaufleuten setzte er ihn nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Land Kanaan“. Das hebräische Wort für „Kanaan“ kann hier zugleich einen Handels- beziehungsweise Händlersinn haben, besonders wegen der parallelen Wendung „Stadt von Kaufleuten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ יְנִיקוֹתָיו
  choice: den obersten ihrer jungen Triebe
  rationale: רֹאשׁ bezeichnet hier die Spitze beziehungsweise den obersten Teil; יְנִיקוֹתָיו meint den jungen Austrieb der Zeder. Das feminine Pronomen bezieht sich im Deutschen natürlich auf die Zeder aus dem Zusammenhang.
- source_word: קָטָף
  choice: pflückte ... ab
  rationale: Das Verb beschreibt das Abpflücken oder Abbrechen eines Pflanzenteils; „abpflücken“ bewahrt das anschauliche Baumbild.
- source_word: וַיְבִיאֵהוּ
  choice: brachte ihn
  rationale: Das maskuline Pronomen nimmt im Deutschen den „Trieb“ auf und folgt dem erzählerischen Transportmotiv.
- source_word: אֶרֶץ כְּנַעַן
  choice: das Land der Händler
  rationale: כְּנַעַן kann außer dem Eigennamen Kanaan auch „Händler“ beziehungsweise „Handelsland“ bezeichnen. Der Parallelismus mit „Stadt von Kaufleuten“ legt hier den kommerziellen Sinn nahe.
- source_word: בְּעִיר רֹכְלִים
  choice: in einer Stadt von Kaufleuten
  rationale: רֹכְלִים bezeichnet umherziehende Händler oder Kaufleute. Die Wiedergabe erhält die Genitivbeziehung und den Handelsbezug.
- source_word: שָׂמוֹ
  choice: setzte er ihn ab
  rationale: שׂים bedeutet „setzen, stellen, legen“. Im Zusammenhang des Verbringens an einen Zielort klingt „absetzen“ im Deutschen natürlich und konkret.
