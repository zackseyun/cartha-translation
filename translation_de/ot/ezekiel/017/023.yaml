source:
  edition: WLC
  text: בְּ/הַ֨ר מְר֤וֹם יִשְׂרָאֵל֙ אֶשְׁתֳּלֶ֔/נּוּ וְ/נָשָׂ֤א עָנָף֙ וְ/עָ֣שָׂה פֶ֔רִי וְ/הָיָ֖ה לְ/אֶ֣רֶז אַדִּ֑יר וְ/שָׁכְנ֣וּ תַחְתָּ֗י/ו כֹּ֚ל צִפּ֣וֹר כָּל כָּנָ֔ף בְּ/צֵ֥ל דָּלִיּוֹתָ֖י/ו תִּשְׁכֹּֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/023.yaml
  text: On the high mountain of Israel I will plant it[a], and it will put forth branches and bear fruit and become a majestic cedar. Under it every bird of every wing will dwell[b]; in the shade of its boughs they will dwell.
translation:
  language: de
  text: Auf dem hohen Berg Israels werde ich es pflanzen[a]. Es wird Zweige treiben, Frucht tragen und zu einer mächtigen Zeder werden. Unter ihr werden Vögel jeder Art wohnen[b]; im Schatten ihrer Äste werden sie wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich es verpflanzen“. Das hebräische Verb kann das Einsetzen eines Schösslings an einem neuen Ort betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeder Vogel, jeder Flügel“; eine poetische Bezeichnung für Vögel aller Art.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַר מְרוֹם יִשְׂרָאֵל
  choice: Auf Israels hohem Berg
  rationale: מְרוֹם bezeichnet Höhe beziehungsweise Erhabenheit. Die Formulierung gibt das Bild eines hoch gelegenen, herausgehobenen Berges in natürlichem Deutsch wieder.
- source_word: אֶשְׁתֳּלֶנּוּ
  choice: werde ich es pflanzen
  rationale: שתל bedeutet pflanzen beziehungsweise an einem Ort einsetzen. „Pflanzen“ bezeichnet hier vor allem die feste Einsetzung des zuvor genommenen Schösslings; „verpflanzen“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: וְנָשָׂא עָנָף
  choice: Es wird Zweige treiben
  rationale: Wörtlich trägt oder erhebt der Baum einen Zweig. „Zweige treiben“ ist im Deutschen die natürliche Ausdrucksweise für das entstehende Wachstum und versteht den Singular kollektiv.
- source_word: וְעָשָׂה פֶרִי
  choice: Frucht tragen
  rationale: Die feste hebräische Verbindung bezeichnet das Hervorbringen von Frucht; „Frucht tragen“ bewahrt zugleich die bildhafte Aussage.
- source_word: וְהָיָה לְאֶרֶז אַדִּיר
  choice: zu einer mächtigen Zeder werden
  rationale: אַדִּיר kann mächtig, erhaben oder majestätisch bedeuten. „Mächtig“ erfasst sowohl Größe und Kraft als auch die herausgehobene Stellung der Zeder.
- source_word: וְשָׁכְנוּ תַחְתָּיו
  choice: Unter ihr werden ... wohnen
  rationale: שׁכן bezeichnet dauerhaftes Wohnen oder Sich-Niederlassen. Das gehobene, aber gegenwärtige „wohnen“ passt zum Bild sicheren Aufenthalts.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: Vögel jeder Art
  rationale: Die wörtliche Fügung „jeder Vogel, jeder Flügel“ ist eine poetische umfassende Bezeichnung. „Vögel jeder Art“ gibt ihren Sinn verständlich wieder, während die ungewöhnliche hebräische Form in der Fußnote sichtbar bleibt.
- source_word: בְּצֵל דָּלִיּוֹתָיו
  choice: im Schatten ihrer Äste
  rationale: דָּלִיּוֹת bezeichnet die ausladenden beziehungsweise herabhängenden Äste eines großen Baumes. „Äste“ ist im heutigen Deutsch natürlich und unterscheidet sich passend von den zuvor austreibenden „Zweigen“.
- source_word: תִּשְׁכֹּנָּה
  choice: werden sie wohnen
  rationale: Die feminine Pluralform bezieht sich distributiv auf die Gesamtheit der Vögel. Der deutsche Plural gibt diesen Bezug klar wieder.
theological_decisions:
- issue: Bedeutung der Vögel im Gleichnisbild
  choice: Das umfassende Bild der Vögel bleibt unaufgelöst stehen.
  alternative: Die Vögel ausdrücklich als Völker oder Nationen deuten.
  rationale: Der weitere prophetische Zusammenhang kann eine Deutung auf Völker nahelegen, doch dieser Vers selbst formuliert das Bild, ohne es auszulegen. Die Übersetzung vermeidet daher eine konfessionelle oder anderweitig festgelegte Interpretation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bildsprache. Die Wiederholung von „wohnen“ wird als bewusstes Stilmittel des hebräischen Textes bewahrt; die Geschlechtsanpassung von „unter ihr“ und „ihrer Äste“ richtet sich im Deutschen nach „Zeder“.
