base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an mich[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und es geschah: Das Wort Jahwes kam zu mir mit den Worten: …“'
    reason: Die Fußnote macht die vollere hebräische Konstruktion mit וַיְהִי und לֵאמֹר sichtbar, die im Haupttext idiomatisch zusammengezogen wird.
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Konstruktion וַיְהִי eröffnet und verbindet hier den neuen Offenbarungsabschnitt. Im Deutschen gibt „Und … erging“ ihre fortführende Funktion natürlich wieder, ohne das schwerfällige „Und es geschah“ in den Haupttext zu übernehmen.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Botenformel bezeichnet דָּבָר Gottes mitgeteiltes Wort. „Das Wort“ bewahrt diese etablierte Offenbarungssprache; „Botschaft“ wäre erklärender, aber weniger formnah.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ ist die im Deutschen geläufige Wiedergabe des Namens; der Genitiv „Jahwes“ ist in diesem Satz natürlich.
- source_word: אֵלַי
  choice: an mich
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bedeutet hier „an/zu mir“. In der deutschen prophetischen Formel ist „an mich“ idiomatisch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion prägnant, ohne ein unnatürliches „indem er sprach“ einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der Ausgangstext gebraucht den Eigennamen יהוה, nicht den Titel אֲדֹנָי. „Jahwe“ gibt den Namen als Namen wieder; „der HERR“ würde ihn durch einen Titel ersetzen, während „JHWH“ für viele Leser schwer aussprechbar wäre.
- issue: Sprecherbezug in לֵאמֹר
  choice: Einleitung der folgenden direkten Rede durch Doppelpunkt
  alternative: „indem er sprach“; „mit den Worten“
  rationale: Die hebräische Form markiert folgende Rede, nennt aber an dieser Stelle kein eigenes Subjekt zum Verb „sagen“. Der Doppelpunkt bewahrt diese Offenheit und vermeidet eine unnötige ausdrückliche Subjektzuweisung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Wendung „das Wort … erging an mich“ bleibt erhalten; der Doppelpunkt leitet verständlich und knapp die Rede im folgenden Vers ein.
