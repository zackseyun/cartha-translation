source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל מברח/ו בְּ/כָל אֲגַפָּי/ו֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/הַ/נִּשְׁאָרִ֖ים לְ/כָל ר֣וּחַ יִפָּרֵ֑שׂוּ וִ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/021.yaml
  text: And all his fugitives among all his troops will fall by the sword[a], and those who remain will be scattered to every wind. Then you will know that I, Yahweh[b], have spoken.
translation:
  language: de
  text: Und alle seine Flüchtlinge[a] unter all seinen Truppen[b] werden durch das Schwert fallen; die Übriggebliebenen werden in alle Winde zerstreut werden. Dann werdet ihr erkennen, dass ich, Jahwe, gesprochen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „seine Flüchtlinge“; einige alte Übersetzungen verstehen den Ausdruck als „seine Auserlesenen“ oder ähnlich.
    reason: alternative_reading
  - marker: b
    text: Wörtlich „seine Flügel“, ein hebräisches militärisches Bild für Abteilungen oder Truppen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מברחו
  choice: seine Flüchtlinge
  rationale: Die Form ist am natürlichsten von ברח („fliehen“) herzuleiten und bezeichnet Menschen, die fliehen oder zu entkommen versuchen. „Flüchtlinge“ gibt diesen Sinn knapp wieder; die abweichende alte Deutung wird in einer Fußnote bewahrt.
- source_word: אֲגַפָּיו
  choice: seinen Truppen
  rationale: Wörtlich bezeichnet das Wort „seine Flügel“, dient hier aber als militärisches Bild für Abteilungen oder Truppen. „Truppen“ vermittelt den kontextuellen Sinn in verständlichem Deutsch.
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Die Wendung bezeichnet den Tod durch Waffengewalt und bewahrt zugleich die konkrete Bildsprache des Hebräischen.
- source_word: הַנִּשְׁאָרִים
  choice: die Übriggebliebenen
  rationale: Gemeint sind diejenigen, die nach dem Fall der anderen noch übrig sind. Diese Wiedergabe vermeidet den in diesem Gerichtszusammenhang unnötig theologisch aufgeladenen Begriff „Rest“.
- source_word: לְכָל רוּחַ
  choice: in alle Winde
  rationale: Die gebräuchliche deutsche Wendung bewahrt das hebräische Bild einer Zerstreuung in jede Richtung.
- source_word: יִפָּרֵשׂוּ
  choice: werden zerstreut werden
  rationale: Die Passivform bezeichnet hier das Auseinandergetriebenwerden im Zusammenhang des angekündigten Gerichts.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּבַּרְתִּי
  choice: gesprochen habe
  rationale: Diese Formulierung erhält den feierlichen Charakter der prophetischen Bekräftigungsformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הַנִּשְׁאָרִים
  choice: die Übriggebliebenen
  alternative: der Rest
  rationale: Im Kontext werden die Überlebenden anschließend zerstreut. Der neutralere Ausdruck vermeidet, dem Wort hier ohne textliche Grundlage die positive theologische Bedeutung eines bewahrten, treuen Restes zu geben.
- issue: Unsichere Deutung von מברחו
  choice: seine Flüchtlinge
  alternative: seine Auserlesenen
  rationale: Die hebräische Form spricht am ehesten für Menschen auf der Flucht; die durch alte Textzeugen und Übersetzungstraditionen bezeugte alternative Deutung wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, während „in alle Winde“ die Bildsprache idiomatisch erhält. Die Fußnoten stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
