language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/022.yaml
  text: 'Thus says the Lord GOD: I myself will take from the top of the lofty cedar and set it out[a]. From the tip of its young shoots I myself will pluck a tender one[b], and I myself will plant it on a high and lofty mountain.'
translation:
  language: de
  text: 'So spricht der Herr Jahwe: Ich selbst werde etwas vom Wipfel[a] der hochgewachsenen Zeder nehmen und es einsetzen. Von der Spitze ihrer jungen Triebe werde ich einen zarten Zweig[b] abbrechen; ich selbst werde ihn auf einen hohen und hoch aufragenden Berg pflanzen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Krone“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einen Zarten“; gemeint ist im Bild ein zarter Trieb oder Zweig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Verbindung aus Herrentitel und Gottesnamen wird in ihrer hebräischen Reihenfolge wiedergegeben. „Jahwe“ ist die im Deutschen geläufige Form des Tetragramms und vermeidet das missverständliche „Herr HERR“.
- source_word: מִצַּמֶּרֶת הָאֶרֶז הָרָמָה
  choice: vom Wipfel der hochgewachsenen Zeder
  rationale: צַמֶּרֶת bezeichnet den obersten Teil beziehungsweise die Krone eines Baumes. „Wipfel“ ist im Deutschen anschaulich und knapp; רָמָה beschreibt die Zeder als hoch aufragend.
- source_word: וְנָתַתִּי
  choice: und es einsetzen
  rationale: Das Verb bedeutet grundsätzlich „geben, setzen, stellen“. Im Bild vom entnommenen und anschließend gepflanzten Trieb gibt „einsetzen“ den gärtnerischen Zusammenhang natürlich wieder, ohne bereits das später ausdrücklich verwendete „pflanzen“ zu wiederholen.
- source_word: מֵרֹאשׁ יֹנְקוֹתָיו
  choice: von der Spitze ihrer jungen Triebe
  rationale: רֹאשׁ bezeichnet hier das obere beziehungsweise äußerste Ende; יֹנְקוֹת sind junge, frische Triebe. Das feminine Pronomen bezieht sich im Deutschen natürlich auf „Zeder“.
- source_word: רַךְ אֶקְטֹף
  choice: einen zarten Zweig abbrechen
  rationale: רַךְ steht substantivisch für etwas Zartes; aus dem unmittelbaren botanischen Kontext ergibt sich ein zarter Trieb oder Zweig. קָטַף bezeichnet das Abpflücken oder Abbrechen.
- source_word: וְשָׁתַלְתִּי אָ֔נִי
  choice: ich selbst werde ihn … pflanzen
  rationale: Das zusätzlich gesetzte Personalpronomen אָ֔נִי betont den göttlichen Handelnden. „Ich selbst“ bildet diese Hervorhebung im Deutschen deutlich ab.
- source_word: עַל הַר גָּבֹהַ וְתָלוּל
  choice: auf einen hohen und hoch aufragenden Berg
  rationale: גָּבֹהַ bezeichnet die Höhe; תָלוּל verstärkt das Bild eines erhabenen, aufragenden Berges. Die leicht feierliche Doppelung bewahrt die poetische Steigerung.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form lässt sowohl den Titel אֲדֹנָי als auch den persönlichen Gottesnamen יהוה sichtbar und bewahrt ihre Reihenfolge. Die Alternative entspricht einer verbreiteten deutschen Ersatzlesung, verdeckt jedoch den im Ausgangstext ausdrücklich stehenden Namen.
- issue: Möglicher messianischer Bezug des zarten Zweiges
  choice: Das Pflanzenbild wird ohne ausdrückliche christologische Deutung übersetzt.
  alternative: Den Zweig ausdrücklich als messianische Gestalt kennzeichnen
  rationale: Der Vers selbst bleibt innerhalb des Gleichnisbildes und benennt dessen Erfüllung an dieser Stelle nicht ausdrücklich. Eine weiterführende theologische Deutung soll daher nicht in den Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer botanischer Bildsprache. Die zweimalige Formulierung „ich selbst“ bewahrt die ausdrückliche Betonung des göttlichen Handelns; die poetische Steigerung am Versende bleibt hörbar.
