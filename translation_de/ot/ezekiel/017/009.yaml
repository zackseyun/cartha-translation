  to: 'Sag: »So spricht der Herr Yahweh: Wird sie gedeihen? Wird er nicht ihre Wurzeln ausreißen und ihre Frucht abschneiden, sodass sie verdorrt? Ihr ganzes frisches Laub wird verdorren. Um sie von ihren Wurzeln emporzuheben, braucht es weder große Kraft[a] noch viele Menschen.«'
  rationale: Die Schlusswendung wurde syntaktisch näher an die hebräische Zweckbestimmung gebunden und zugleich idiomatisch formuliert. Die nicht erforderliche und potenziell irreführende Fußnote zum Verdorren wurde entfernt. Die übrige Übersetzung bleibt erhalten, einschließlich des sichtbaren Gottesnamens und der konkreten Pflanzenbildsprache.
