  text: אֱמֹ֗ר כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהֹוִ֖ה תִּצְלָ֑ח הֲ/לוֹא֩ אֶת שָׁרָשֶׁ֨י/הָ יְנַתֵּ֜ק וְ/אֶת פִּרְיָ֣/הּ יְקוֹסֵ֣ס וְ/יָבֵ֗שׁ כָּל טַרְפֵּ֤י צִמְחָ/הּ֙ תִּיבָ֔שׁ וְ/לֹֽא בִ/זְרֹ֤עַ גְּדוֹלָה֙ וּ/בְ/עַם רָ֔ב לְ/מַשְׂא֥וֹת אוֹתָ֖/הּ מִ/שָּׁרָשֶֽׁי/הָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/009.yaml
  text: 'Say[a], ‘Thus says the Lord GOD: Will it prosper? Will he not pull up its roots and cut off its fruit, so that it dries up? All the fresh leaves of its growth will wither[b]. And not by a great arm or by many people will it be lifted from its roots.’'
translation:
  language: de
  text: 'Sag: »So spricht der Herr Yahweh: Wird sie gedeihen? Wird er nicht ihre Wurzeln ausreißen und ihre Frucht abschneiden, sodass sie verdorrt? Ihr ganzes frisches Laub wird verdorren. Um sie von ihren Wurzeln emporzuheben, braucht es weder große Kraft[a] noch viele Menschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »einen großen Arm«; der Arm ist ein Bild für Kraft oder Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Sag
  rationale: Der Imperativ leitet knapp und natürlich die prophetische Botschaft ein.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahweh
  rationale: Die feste Botenformel wird gewahrt; אֲדֹנָי wird als »der Herr« und der Gottesname יהוה als »Yahweh« wiedergegeben.
- source_word: תִּצְלָח
  choice: Wird sie gedeihen?
  rationale: »Gedeihen« erfasst im Bild der Rebe sowohl das Wachsen als auch das Gelingen.
- source_word: יְנַתֵּק
  choice: ausreißen
  rationale: Das Verb bezeichnet ein gewaltsames Losreißen; »ausreißen« passt zur Wurzelmetaphorik und ist im Deutschen anschaulich.
- source_word: יְקוֹסֵס
  choice: abschneiden
  rationale: Das seltene Verb bezeichnet hier das Abtrennen oder Abschneiden der Frucht.
- source_word: וְיָבֵשׁ / תִּיבָשׁ
  choice: sie verdorrt / wird verdorren
  rationale: Beide Formen gehören zum selben Wortfeld des Austrocknens und Verdorrens. Die Wiederholung bildet den Fortgang des Gerichts im Pflanzenbild ab.
- source_word: כָּל טַרְפֵּי צִמְחָהּ
  choice: ihr ganzes frisches Laub
  rationale: Die kompakte deutsche Formulierung gibt die Gesamtheit der frischen Blätter ihres Austriebs natürlich wieder.
- source_word: וְלֹא בִזְרֹעַ גְּדוֹלָה וּבְעַם רָב
  choice: Es bedarf weder großer Kraft noch vieler Menschen
  rationale: Die instrumentale Wendung wird idiomatisch wiedergegeben; das wörtliche Bild des »großen Arms« wird in einer Fußnote dokumentiert, während עַם nicht unnötig zu »Heer« verengt wird.
- source_word: לְמַשְׂאוֹת אוֹתָהּ מִשָּׁרָשֶׁיהָ
  choice: um sie von ihren Wurzeln emporzuheben
  rationale: Die Formulierung bewahrt das Verb »heben« und die ungewöhnliche Bewegung von den Wurzeln weg, ohne es mit einem weiteren »ausreißen« gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr, HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom persönlichen Gottesnamen יהוה und lässt den Bundesnamen sichtbar, ohne die beiden Ausdrücke miteinander zu verschmelzen.
- issue: Unausgesprochenes männliches Subjekt von יְנַתֵּק und יְקוֹסֵס
  choice: Wird er nicht …?
  alternative: Wird man nicht …?
  rationale: Das männliche Singularsubjekt des Hebräischen wird beibehalten. So bleibt der Rückbezug auf die im Gleichnis handelnde männliche Gestalt erhalten, ohne ihn durch eine unpersönliche Konstruktion aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Einleitungsformel. Das Pflanzenbild bleibt konkret; seltene oder im Deutschen missverständliche Hebraismen werden im Haupttext behutsam idiomatisiert und in den Fußnoten offengelegt.
