  text: אֶל שָׂ֥דֶה טּ֛וֹב אֶל מַ֥יִם רַבִּ֖ים הִ֣יא שְׁתוּלָ֑ה לַ/עֲשׂ֤וֹת עָנָף֙ וְ/לָ/שֵׂ֣את פֶּ֔רִי לִ/הְי֖וֹת לְ/גֶ֥פֶן אַדָּֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/008.yaml
  text: It was planted in a good field by abundant waters[a], to produce branches and bear fruit[b], to become a majestic vine.
translation:
  language: de
  text: Sie war auf einem guten Feld, an einem Ort mit reichlich Wasser, gepflanzt, um Zweige zu treiben und Frucht zu tragen, um zu einem prächtigen Weinstock zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂדֶה טּוֹב
  choice: ein gutes Feld
  rationale: שָׂדֶה bezeichnet gewöhnlich ein Feld. Die konkrete landwirtschaftliche Bildsprache bleibt damit erhalten, ohne die Fruchtbarkeit ausdrücklich in den Begriff hineinzulesen.
- source_word: אֶל מַיִם רַבִּים
  choice: an reichlich Wasser
  rationale: Das wiederholte אֶל bezeichnet im Zusammenhang des Pflanzens Lage beziehungsweise Nähe. „An reichlich Wasser“ gibt sowohl die Nähe als auch die ergiebige Wasserversorgung in natürlichem Deutsch wieder.
- source_word: שְׁתוּלָה
  choice: war sie gepflanzt
  rationale: Das passive Partizip bezeichnet den Zustand des Gepflanztseins. „Gepflanzt“ bleibt näher am Ausdruck als das im Kontext denkbare, aber spezifischere „verpflanzt“.
- source_word: לַעֲשׂוֹת עָנָף
  choice: um Zweige zu treiben
  rationale: Wörtliches „Zweige machen“ wäre unidiomatisch. „Zweige treiben“ ist eine natürliche botanische Formulierung und gibt den beabsichtigten Ertrag der Pflanzung wieder.
- source_word: וְלָשֵׂאת פֶּרִי
  choice: und Frucht zu tragen
  rationale: נשא mit פְּרִי ist die übliche Wendung für das Tragen von Frucht; die entsprechende deutsche Wendung ist zugleich genau und geläufig.
- source_word: לִהְיוֹת לְגֶפֶן אַדָּרֶת
  choice: um zu einem prächtigen Weinstock zu werden
  rationale: אַדָּרֶת bezeichnet Größe, Pracht oder Herrlichkeit. „Prächtig“ wahrt die gehobene Wertung, ohne gesellschaftlichen Rang anzudeuten; גֶּפֶן wird konkret als „Weinstock“ wiedergegeben.
