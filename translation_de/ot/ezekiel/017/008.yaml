translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter landwirtschaftlicher Bildsprache. Die parallelen Zweckangaben des Hebräischen bleiben erhalten. Die im englischen Beratungstext bei „Frucht tragen“ gesetzte Fußnote wurde nicht übernommen, da die dort angegebene Alternative offenbar אַדָּרֶת betrifft und im deutschen Haupttext keine zusätzliche sachliche Ambiguität begründet.
