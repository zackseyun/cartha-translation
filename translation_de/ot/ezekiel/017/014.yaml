  text: so that it might become a lowly kingdom[a], not lifting itself up, but keeping his covenant so as to stand.
translation:
  language: de
  text: damit es zu einem niedrigen Königreich würde, das sich nicht erhöbe, sondern seinen Bund[a] hielte, um bestehen zu können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertrag“ statt „Bund“; das hebräische Wort kann in diesem Zusammenhang eine bindende politische Vereinbarung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: damit es … bliebe
  rationale: Der Infinitiv mit ל drückt hier den Zweck der vorausgehenden Handlung aus. Im Zusammenhang geht es darum, dass das Königreich in einem niedrigen Zustand bleiben sollte; das Deutsche verlangt für den flüssigen Anschluss eine finite Form.
- source_word: מַמְלָכָה שְׁפָלָה
  choice: ein niedriges Königreich
  rationale: מַמְלָכָה bezeichnet das politische Königreich, שְׁפָלָה dessen herabgesetzten Rang. „Niedrig“ bewahrt das Bild politischer Erniedrigung, ohne moralische Demut anzudeuten.
- source_word: לְבִלְתִּי הִתְנַשֵּׂא
  choice: das sich nicht selbst erhöbe
  rationale: Die reflexive Verbform bezeichnet Selbsterhöhung. Der Relativsatz gibt die negative Zweckbestimmung natürlich und zugleich eng am Hebräischen wieder.
- source_word: לִשְׁמֹר אֶת בְּרִיתוֹ
  choice: sondern seinen Bund hielte
  rationale: שׁמר mit בְּרִית bedeutet, die Verpflichtungen eines Bundes einzuhalten. Das Possessivpronomen bleibt wie im Hebräischen auf die zuvor genannte politische Gegenpartei bezogen.
- source_word: לְעָמְדָהּ
  choice: um bestehen zu bleiben
  rationale: Das Suffix bezieht sich auf das feminine מַמְלָכָה. „Bestehen bleiben“ wahrt die Standmetapher und macht deutlich, dass das Königreich fortdauern sollte.
theological_decisions:
- issue: Wiedergabe von בְּרִית im politischen Zusammenhang
  choice: Bund
  alternative: Vertrag
  rationale: Obwohl hier ein politisches Vasallenabkommen gemeint ist, bezeichnet בְּרִית eine feierlich bindende Vereinbarung. „Bund“ erhält die terminologische Verbindung zu anderen Belegen; „Vertrag“ wird als kontextuell passende Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konjunktivformen „bliebe“, „erhöbe“ und „hielte“ markieren die Zwecksetzung der vorausgehenden politischen Maßnahme. Die Formulierung bewahrt die politische Erniedrigung, die reflexive Selbsterhöhung und die Metapher des Bestehens.
