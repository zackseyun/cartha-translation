source:
  edition: WLC
  text: וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/024.yaml
  text: 'And all the trees of the field shall know that I am Yahweh: I have brought low the high tree[a], I have raised up the low tree, I have dried up the green tree, and I have made the dry tree flourish. I am Yahweh; I have spoken[b], and I have done it.'
translation:
  language: de
  text: 'Und alle Bäume des Feldes werden erkennen, dass ich Yahweh bin: Ich habe den hohen Baum erniedrigt und den niedrigen Baum erhöht; ich habe den frischen Baum[a] ausgetrocknet und den trockenen Baum aufblühen lassen[b]. Ich, Yahweh, habe gesprochen und es getan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den grünen Baum“ beziehungsweise „den saftigen Baum“. Das hebräische Adjektiv bezeichnet wörtlich Frische oder Feuchtigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den trockenen Baum sprossen lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: werden erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ bezeichnet im prophetischen Zusammenhang die gewisse künftige Folge. „Werden erkennen“ klingt im modernen Deutsch natürlich und bewahrt diese Gewissheit.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: alle Bäume des Feldes
  rationale: Die bildhafte Wendung wird eng am hebräischen Text wiedergegeben, ohne die Bäume bereits als Herrscher oder Völker auszudeuten.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הִשְׁפַּלְתִּי עֵץ גָּבֹהַ
  choice: Ich habe den hohen Baum erniedrigt
  rationale: „Erniedrigt“ gibt die kausative Bedeutung des Hiphil sowie den Gegensatz zu „erhöht“ prägnant wieder, ohne die Aussage ausdrücklich zu moralisieren.
- source_word: הִגְבַּהְתִּי עֵץ שָׁפָל
  choice: den niedrigen Baum erhöht
  rationale: Die Formulierung bewahrt den antithetischen Parallelismus von hoch/niedrig und erniedrigen/erhöhen.
- source_word: הוֹבַשְׁתִּי עֵץ לָח
  choice: den frischen Baum vertrocknen lassen
  rationale: לָח bezeichnet wörtlich etwas Feuchtes oder Frisches. „Frisch“ ist bei einem Baum natürlich und vermeidet die mögliche Verengung von „grün“ auf die Farbe; „vertrocknen lassen“ gibt den Kausativ wieder.
- source_word: וְהִפְרַחְתִּי עֵץ יָבֵשׁ
  choice: den trockenen Baum aufblühen lassen
  rationale: Das Hiphil von פרח bezeichnet das Veranlassen des Sprossens oder Blühens. „Aufblühen lassen“ bewahrt das Pflanzenbild und den Gegensatz zum Vertrocknen.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: habe gesprochen und es getan
  rationale: Die knappe Formel betont, dass Yahwehs Wort wirksam ist; das im Deutschen nötige „es“ macht das im Hebräischen implizite Objekt deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: HERR oder Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Umschrift „Yahweh“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang der Baumbilder
  choice: Die Baummetaphorik bleibt im Haupttext unausgelegt.
  alternative: Die Bäume ausdrücklich als Könige, Herrscher oder Völker bezeichnen.
  rationale: Der Kontext legt politische und theologische Bezüge nahe, doch dieser Vers formuliert sie weiterhin als Baumbild. Eine explizite Deutung würde die Metapher enger festlegen als der hebräische Wortlaut.
- issue: Aspekt der göttlichen Handlungen
  choice: 'Deutsch Perfekt: „habe …“'
  alternative: Futur oder Präsens
  rationale: Die hebräischen Perfektformen stellen Yahwehs Handeln als feststehend beziehungsweise vollzogen dar. Das deutsche Perfekt erhält diese prophetische Gewissheit, während „werden erkennen“ die daraus folgende Erkenntnis ausdrückt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus der vier Umkehrungen bleibt deutlich. „Erniedrigt/erhöht“ erhält neben dem konkreten Höhenbild auch dessen mögliche politische Tragweite; die Metapher wird nicht im Übersetzungstext erklärt.
