lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die wörtliche und in Hesekiel wiederkehrende göttliche Anrede wird in ihrer traditionellen deutschen Form bewahrt; sie bezeichnet hier den Propheten.
- source_word: הוֹדַע
  choice: halte … vor
  rationale: Der Hifil-Imperativ bedeutet, jemanden etwas wissen bzw. erkennen zu lassen. In Verbindung mit Jerusalems eigenen Gräueltaten gibt „halte … vor“ den anklagenden Sinn natürlich wieder, ohne die Aussage in ein bloßes Informieren abzuschwächen.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: תּוֹעֲבֹתֶיהָ
  choice: ihre Gräueltaten
  rationale: Das Wort bezeichnet verabscheuungswürdige, häufig kultisch und moralisch belastete Handlungen. „Gräueltaten“ wahrt den starken Wertungsgehalt und den Plural; „ihre“ erhält die feminine Personifikation Jerusalems.
theological_decisions:
- issue: Feminine Personifikation Jerusalems
  choice: Das feminine Suffix wird mit „ihre“ ausdrücklich wiedergegeben.
  alternative: „dessen Gräueltaten“ oder eine unpersönliche Umschreibung
  rationale: Jerusalem wird im gesamten Kapitel als Frau personifiziert. Die feminine Form bewahrt diese literarische und theologische Anlage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Anrede „Menschensohn“ bleibt erhalten; „halte … vor“ formuliert den prophetischen Anklageauftrag idiomatisch und prägnant.
