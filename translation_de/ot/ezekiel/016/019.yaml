revisions:
- from: Auch mein Brot, das ich dir gegeben hatte — Feinmehl, Öl und Honig, womit ich dich ernährte —, hast du ihnen als wohlgefälligen Duft vorgesetzt.[a] So geschah es, spricht GOTT, der Herr.[b]
  to: Auch mein Brot, das ich dir gab — Feinmehl, Öl und Honig, womit ich dich ernährte —, hast du ihnen als wohlgefälligen Duft vorgesetzt.[a] So geschah es, spricht der Herr, GOTT.[b]
  rationale: Die Revision beseitigt die nicht erforderliche Vorzeitigkeit bei »gegeben hatte«, stellt die Reihenfolge der Gottesbezeichnungen gemäß dem Hebräischen her und passt die zugehörige Fußnote an. Die übrige Wortwahl bleibt erhalten, da sie den kultischen und ironischen Charakter des Verses angemessen wiedergibt.
