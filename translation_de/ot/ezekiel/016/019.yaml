  text: וְ/לַחְמִ/י֩ אֲשֶׁר נָתַ֨תִּי לָ֜/ךְ סֹ֣לֶת וָ/שֶׁ֤מֶן וּ/דְבַשׁ֙ הֶֽאֱכַלְתִּ֔י/ךְ וּ/נְתַתִּ֧י/הוּ לִ/פְנֵי/הֶ֛ם לְ/רֵ֥יחַ נִיחֹ֖חַ וַ/יֶּ֑הִי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/019.yaml
  text: And my bread that I gave you—fine flour[a], oil, and honey with which I fed you—you set before them as a pleasing aroma, and so it was[c][b], declares the Lord GOD.
translation:
  language: de
  text: Auch mein Brot, das ich dir gab — Feinmehl, Öl und Honig, womit ich dich ernährte —, hast du ihnen als wohlgefälligen Duft vorgesetzt.[a] So geschah es, spricht der Herr, GOTT.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Wohlgefälliger Duft« ist eine feste Wendung der Opfersprache; hier wird sie bitter ironisch für eine Gabe an Götzen verwendet.
    reason: cultural_note
  - marker: b
    text: 'Hebräisch: אֲדֹנָי יְהוִה, wörtlich etwa »der Herr, JHWH«. »GOTT« steht hier für den Gottesnamen JHWH.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמִי
  choice: mein Brot
  rationale: Die konkrete Grundbedeutung »Brot« bleibt erhalten; im Zusammenhang kann das Wort zugleich umfassender die von Gott gegebene Nahrung bezeichnen.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Bezeichnet hochwertiges, fein gemahlenes Mehl und bewahrt zugleich den Anklang an Opfergaben.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Der hebräische Text nennt allgemein Öl; »Olivenöl« wäre kulturell wahrscheinlich, aber nicht ausdrücklich gesagt.
- source_word: דְבַשׁ
  choice: Honig
  rationale: »Honig« ist die übliche und hier verständliche Wiedergabe; eine genauere Festlegung etwa auf Dattelsirup wäre nicht gesichert.
- source_word: הֶאֱכַלְתִּיךְ
  choice: womit ich dich ernährte
  rationale: Gibt die kausative Form von אכל natürlich wieder und verbindet Gottes Versorgung klar mit den zuvor genannten Lebensmitteln.
- source_word: וּנְתַתִּיהוּ
  choice: hast du ihnen … vorgesetzt
  rationale: Der Kontext verlangt Jerusalem als Subjekt. »Vorgesetzt« gibt das Platzieren vor den Götzen idiomatisch wieder, ohne eine im Hebräischen nicht ausdrücklich vorhandene Verstärkung einzufügen.
- source_word: לִפְנֵיהֶם
  choice: ihnen … vorgesetzt
  rationale: Die deutsche Verbfügung »jemandem etwas vorsetzen« vermittelt das hebräische »vor ihnen« natürlich; der pronominale Bezug bleibt wie im Ausgangstext unausgeführt.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als wohlgefälligen Duft
  rationale: Bewahrt die feststehende kultische Opfersprache und deren bittere Ironie in der Anwendung auf Götzen.
- source_word: וַיֶּהִי
  choice: So geschah es
  rationale: Bestätigt nachdrücklich die Wirklichkeit des erhobenen Vorwurfs.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht GOTT, der Herr
  rationale: Gibt die prophetische Spruchformel würdig wieder. Die typografische Form »GOTT« kennzeichnet den Gottesnamen, während »der Herr« אֲדֹנָי entspricht und eine missverständliche Doppelung vermeidet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: der Herr JHWH / der Herr Jahwe
  rationale: Die Form wahrt die Unterscheidung zwischen dem Gottesnamen und אֲדֹנָי, ohne eine konfessionell oder sprachpolitisch unnötig festgelegte Aussprache in den Haupttext einzutragen. Eine Fußnote macht die zugrunde liegende hebräische Formel transparent.
- issue: Kultische Wendung für eine Götzenopfergabe
  choice: als wohlgefälligen Duft
  alternative: als beruhigenden Duft / als lieblichen Geruch
  rationale: Die kultische Ausdrucksweise wird beibehalten, damit die ironische und theologisch spannungsvolle Übertragung auf den Götzendienst nicht geglättet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der emphatischen Aufzählung des Hebräischen, bleibt aber durch Gedankenstriche gut lesbar. »Wohlgefällig« ist bewusst leicht kultsprachlich, ohne altertümlich zu wirken.
