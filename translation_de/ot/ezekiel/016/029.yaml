source:
  edition: WLC
  text: וַ/תַּרְבִּ֧י אֶת תַּזְנוּתֵ֛/ךְ אֶל אֶ֥רֶץ כְּנַ֖עַן כַּשְׂדִּ֑ימָ/ה וְ/גַם בְּ/זֹ֖את לֹ֥א שָׂבָֽעַתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/029.yaml
  text: You multiplied your prostitution to the land of Canaan[a], to Chaldea; yet even with this you were not satisfied.
translation:
  language: de
  text: Du hast deine Prostitution bis ins Land Kanaan, bis nach Chaldäa immer weiter getrieben; doch selbst damit wurdest du nicht satt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּרְבִּי
  choice: du hast … immer weiter getrieben
  rationale: Die Hifil-Form von רבה bezeichnet hier die Steigerung bzw. Ausweitung des beschriebenen Verhaltens. Die deutsche Wendung ist natürlich und bewahrt die intensive Bewegungsrichtung des Satzes.
- source_word: תַּזְנוּתֵךְ
  choice: deine Prostitution
  rationale: Das Substantiv bezeichnet im prophetischen Bild ausdrücklich Prostitution als Metapher für Jerusalems religiöse und politische Untreue. Die konkrete, anstößige Bildsprache wird nicht zu einem allgemeinen Begriff wie „Untreue“ abgeschwächt.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: bis ins Land Kanaan
  rationale: אֶל markiert Richtung bzw. Erstreckung; „bis ins“ gibt im Deutschen die Ausweitung wieder und erhält אֶרֶץ ausdrücklich als „Land“.
- source_word: כַּשְׂדִּימָה
  choice: nach Chaldäa
  rationale: Die Richtungsendung bezeichnet Bewegung oder Erstreckung nach Chaldäa. Die knappe Wiedergabe entspricht der verdichteten hebräischen Ortsangabe; deren syntaktische Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: וְגַם בְּזֹאת
  choice: doch selbst damit
  rationale: 'Die Formulierung gibt den steigernden und im Zusammenhang konzessiven Nachdruck idiomatisch wieder: Nicht einmal diese weitere Ausweitung brachte Sättigung.'
- source_word: לֹא שָׂבָעַתְּ
  choice: wurdest du nicht satt
  rationale: שׂבע bedeutet satt oder gesättigt sein. „Nicht satt werden“ ist im Deutschen verständlich, kräftig und bewahrt das Bild unstillbaren Verlangens besser als das abstraktere „nicht zufrieden sein“.
theological_decisions:
- issue: Prophetische Sexualmetapher für Jerusalems Bundesuntreue
  choice: Die ausdrückliche Metapher wird mit „Prostitution“ beibehalten.
  alternative: „Untreue“ oder „sexuelle Unmoral“
  rationale: Ezechiel verwendet bewusst schockierende sexuelle Bildsprache für Götzendienst und politisch-religiöse Untreue. Eine Verallgemeinerung würde die rhetorische Schärfe und den lexikalischen Gehalt abschwächen.
- issue: Bezug von „Land Kanaan“ und „Chaldäa“
  choice: Die Hauptfassung versteht die Wendung als räumliche Ausweitung bis nach Chaldäa.
  alternative: Kanaan wird bildlich mit Chaldäa gleichgesetzt, oder „Chaldäa“ steht als Apposition zu „Land Kanaan“.
  rationale: Die hebräische Syntax ist stark verdichtet und lässt das genaue Verhältnis der Ortsangaben offen. Die Hauptfassung bietet einen verständlichen räumlichen Sinn, während die Fußnote die echten Alternativen ausdrücklich erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. „Prostitution“ bewahrt die drastische prophetische Metapher; „nicht satt“ erhält das körperliche Bild der Unersättlichkeit. Die ungewöhnliche Geografie wird nicht stillschweigend harmonisiert, sondern durch eine Fußnote erläutert.
