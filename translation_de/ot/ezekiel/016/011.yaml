  text: I adorned you with jewelry[c][b][a], and I put bracelets on your hands and a necklace on your neck.
translation:
  language: de
  text: Ich schmückte dich mit Schmuck[a], legte Armreifen um deine Handgelenke[b] und eine Halskette[c] um deinen Hals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Zierrat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an deine Hände“; das hebräische Wort kann auch den Bereich der Handgelenke oder Arme umfassen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eine Kette“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעְדֵּךְ עֶדִי
  choice: Ich schmückte dich mit Schmuck
  rationale: Das Verb עדה bezeichnet hier das Schmücken mit Zierat; עֶדִי meint Schmuck oder Zierrat. Die bewusst verwandte deutsche Wortwahl gibt die figura etymologica des Hebräischen natürlich wieder.
- source_word: צְמִידִים
  choice: Armreifen
  rationale: Das Wort bezeichnet paarweise oder mehrfach getragene Schmuckreifen an Handgelenken beziehungsweise Armen. „Armreifen“ ist im Deutschen konkret und idiomatisch.
- source_word: עַל יָדַיִךְ
  choice: um deine Handgelenke
  rationale: יָד kann den Bereich von Hand und Arm bezeichnen. Da Armreifen gemeint sind, gibt „Handgelenke“ die konkrete Trageweise im modernen Deutsch verständlich wieder; die wörtlichere Form wird in einer Fußnote genannt.
- source_word: רָבִיד
  choice: eine Halskette
  rationale: רָבִיד bezeichnet einen Halsschmuck, möglicherweise speziell eine Kette. „Halskette“ ist die natürliche und hinreichend offene deutsche Entsprechung.
- source_word: עַל גְּרוֹנֵךְ
  choice: um deinen Hals
  rationale: גָּרוֹן kann Kehle oder Hals bedeuten. Bei Halsschmuck ist „um deinen Hals“ im Deutschen idiomatisch und bewahrt das konkrete Bild.
theological_decisions:
- issue: Metaphorische Darstellung Jerusalems als von Gott geschmückte Frau
  choice: Das konkrete Bild des Schmückens bleibt ohne allegorische Ausdeutung im Vers stehen.
  alternative: Den Schmuck ausdrücklich als Bundessegen oder Brautschmuck erklären.
  rationale: Der unmittelbare Wortlaut beschreibt Schmuckstücke. Eine theologische Deutung gehört in den Kontext oder in Anmerkungen, nicht als Zusatz in die Übersetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „schmückte … mit Schmuck“ bewahrt die hebräische Wortverwandtschaft, ohne altertümlich zu wirken. Die Präposition „um“ entspricht bei Armreifen und Halskette dem natürlichen deutschen Sprachgebrauch.
