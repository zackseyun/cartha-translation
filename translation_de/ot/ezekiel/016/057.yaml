base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/057.yaml
  text: before your wickedness was uncovered[a], as at the time of the reproach of the daughters of Aram and all those around her, the daughters of the Philistines[c][b], who despise you from every side.
translation:
  language: de
  text: bevor deine Bosheit aufgedeckt wurde[a] – wie zur Zeit der Schmach durch die Töchter Arams[b] und all ihre Umgebung, die Töchter der Philister[c], die dich ringsum verachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „offenbar wurde“ oder „bloßgelegt wurde“.'
    reason: lexical_alternative
  - marker: b
    text: Aram wird traditionell auch mit „Syrien“ wiedergegeben. Im Hebräischen steht „Töchter Arams“.
    reason: alternative_reading
  - marker: c
    text: „Die Töchter der Philister“ ist eine hebräische Ausdrucksweise für die philistäische Bevölkerung oder ihre Städte.
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Leitet knapp und natürlich den zeitlichen Nebensatz ein.
- source_word: תִּגָּלֶה
  choice: aufgedeckt wurde
  rationale: Das Nifal bezeichnet hier das öffentliche Bekanntwerden; „aufgedeckt“ bewahrt zugleich das Bild der Enthüllung.
- source_word: רָעָתֵךְ
  choice: deine Bosheit
  rationale: Im prophetischen Anklagezusammenhang ist moralisch schuldhaftes Böses gemeint, nicht bloß Unglück.
- source_word: כְּמוֹ עֵת
  choice: wie zu der Zeit
  rationale: Bewahrt den vergleichenden und zeitlichen Charakter der hebräischen Wendung.
- source_word: חֶרְפַּת
  choice: der Schmach … ausgesetzt
  rationale: „Schmach“ umfasst öffentliche Beschämung und verächtliche Behandlung; die deutsche Konstruktion macht verständlich, dass Jerusalem diese Schmach trifft.
- source_word: בְּנוֹת אֲרָם
  choice: die Töchter Arams
  rationale: Bewahrt sowohl den Namen Aram als auch das hebräische Kollektivbild „Töchter“.
- source_word: וְכָל סְבִיבוֹתֶיהָ
  choice: und seiner ganzen Umgebung
  rationale: Gibt die räumliche Wendung lesbar wieder und bezieht das feminine Suffix entsprechend dem naheliegenden Zusammenhang auf Aram als Gebiet.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: die Töchter der Philister
  rationale: Bewahrt das hebräische Bild für die philistäische Bevölkerung beziehungsweise ihre Städte.
- source_word: הַשָּׁאטוֹת אוֹתָךְ
  choice: die dich … verachteten
  rationale: Das Partizip bezeichnet anhaltende Geringschätzung oder Verachtung; die Vergangenheitsform fügt sich in den zeitlichen Rückblick.
- source_word: מִסָּבִיב
  choice: von allen Seiten
  rationale: Natürliches Deutsch, das die ringsum bedrängende Verachtung ausdrückt.
