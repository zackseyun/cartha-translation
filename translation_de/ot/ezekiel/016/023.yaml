lexical_decisions:
- source_word: וַיְהִי
  choice: Und … geschah es
  rationale: Die Form führt die nächste Entwicklung im prophetischen Redegang ein; die deutsche Wendung bewahrt den Übergang, ohne unnötig schwerfällig zu wirken.
- source_word: אַחֲרֵי
  choice: nach
  rationale: Die Präposition hat hier ihre gewöhnliche zeitliche Bedeutung.
- source_word: כָּל רָעָתֵךְ
  choice: all deiner Bosheit
  rationale: „All“ bewahrt den umfassenden Sinn von כָּל; „Bosheit“ gibt die moralische Qualität von רָעָה im Anklagezusammenhang wieder.
- source_word: אוֹי אוֹי לָךְ
  choice: wehe, wehe dir!
  rationale: Die Wiederholung des Weherufs bleibt erhalten und verstärkt Klage und Gerichtswort.
- source_word: נְאֻם
  choice: spricht
  rationale: „Spricht“ ist eine natürliche, würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Wiedergabe unterscheidet den Herrschaftstitel אֲדֹנָי vom Gottesnamen יהוה und erhält so beide Bestandteile der hebräischen Verbindung.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: „Der Herr Jahwe“ macht sowohl den Titel als auch den Eigennamen sichtbar und vermeidet, den Gottesnamen durch einen zweiten Titel zu ersetzen.
- issue: Verhältnis von Erzählformel und Weheruf
  choice: וַיְהִי als Hauptsatz, der Weheruf als eingeschobener göttlicher Ausspruch
  alternative: '„Und es geschah nach all deiner Bosheit: Wehe, wehe dir!“'
  rationale: Die masoretische Akzentuierung und der hebräische Wortlaut lassen die genaue syntaktische Verbindung offen. Die gewählte Zeichensetzung erhält den abrupten, spannungsvollen Charakter, ohne zusätzliche inhaltliche Ergänzungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der doppelte Weheruf und die abrupte Syntax des Hebräischen werden bewahrt; Gedankenstriche machen den Einschub lesbar. Der Fußnotenmarker steht unmittelbar beim betroffenen Gottesnamen.
