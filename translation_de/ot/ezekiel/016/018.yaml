source:
  edition: WLC
  text: וַ/תִּקְחִ֛י אֶת בִּגְדֵ֥י רִקְמָתֵ֖/ךְ וַ/תְּכַסִּ֑י/ם וְ/שַׁמְנִ/י֙ וּ/קְטָרְתִּ֔/י נתתי לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/018.yaml
  text: You took your embroidered garments and covered them[a], and you set my oil and my incense before them.
translation:
  language: de
  text: Du nahmst deine bestickten Gewänder und bedecktest sie damit[a]. Mein Öl und mein Räucherwerk stelltest du vor sie hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und bekleidetest sie damit“. Das hebräische Verb bedeutet wörtlich „bedecken“; im Zusammenhang kann das Bekleiden der Götzenbilder gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי רִקְמָתֵךְ
  choice: deine bestickten Gewänder
  rationale: בֶּגֶד bezeichnet ein Kleidungsstück oder Gewand, רִקְמָה kunstvoll bestickten Stoff. „Bestickte Gewänder“ bewahrt den luxuriösen Charakter und klingt im Deutschen natürlich.
- source_word: וַתְּכַסִּים
  choice: und bedecktest sie damit
  rationale: כסה bedeutet grundlegend „bedecken“. Das ergänzte „damit“ macht im Deutschen deutlich, dass die Gewänder als Bedeckung dienen, ohne die Handlung bereits als Bekleiden von Götzen festzulegen.
- source_word: וְשַׁמְנִי
  choice: Mein Öl
  rationale: שֶׁמֶן bedeutet „Öl“, häufig Olivenöl, doch die Ölsorte wird hier nicht ausdrücklich genannt. Das Possessivpronomen bleibt erhalten.
- source_word: וּקְטָרְתִּי
  choice: mein Räucherwerk
  rationale: קְטֹרֶת bezeichnet kultisch verwendetes Räucherwerk beziehungsweise Weihrauch. „Räucherwerk“ ist präzise, ohne eine bestimmte Substanz vorauszusetzen.
- source_word: נתתי לִפְנֵיהֶם
  choice: stelltest du vor sie hin
  rationale: Im Zusammenhang ist die an Jerusalem gerichtete 2. Person Singular feminin gemeint; לִפְנֵי bezeichnet die Platzierung vor jemandem. „Vor sie hinstellen“ gibt die konkrete, kultische Darbringung natürlich wieder.
theological_decisions:
- issue: Bezug der maskulinen Pluralsuffixe in וַתְּכַסִּים und לִפְנֵיהֶם
  choice: Die Pronomen bleiben als „sie“ stehen und beziehen sich im Kontext auf die zuvor genannten männlichen Götzenbilder.
  alternative: Die Bezugsgröße ausdrücklich als „Götzenbilder“ benennen.
  rationale: Der Kontext identifiziert den Bezug hinreichend. Die pronominale Form wahrt die Ausdrucksweise und lässt die im Hebräischen vorhandene kontextuelle Verknüpfung bestehen.
- issue: Form נתתי
  choice: 'Gemäß dem masoretisch gelesenen Sinn und dem Satzkontext als 2. Person Singular feminin wiedergegeben: „stelltest du“.'
  alternative: 'Die unpunktierte Konsonantenform als 1. Person Singular lesen: „ich stellte/gab“.'
  rationale: Die Anrede des gesamten Abschnitts und die parallelen Verben verlangen hier die an Jerusalem gerichtete feminine 2. Person; die abweichende Konsonantenschreibung wird durch die masoretische Lesetradition geklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Präteritum entspricht dem erzählenden Anklagestil. „Räucherwerk“ bewahrt den kultischen Sinn; die Pronomen werden nicht durch die explizitere Deutung „Götzenbilder“ ersetzt.
