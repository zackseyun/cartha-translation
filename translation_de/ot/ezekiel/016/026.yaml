  text: וַ/תִּזְנִ֧י אֶל בְּנֵֽי מִצְרַ֛יִם שְׁכֵנַ֖יִ/ךְ גִּדְלֵ֣י בָשָׂ֑ר וַ/תַּרְבִּ֥י אֶת תַּזְנֻתֵ֖/ךְ לְ/הַכְעִיסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/026.yaml
  text: You prostituted yourself with the sons of Egypt[a], your neighbors, great of flesh[b], and multiplied your prostitution to provoke me to anger.
translation:
  language: de
  text: Du hast dich mit den Ägyptern[a], deinen Nachbarn, prostituiert, die groß an Fleisch waren[b], und hast deine Prostitution vermehrt, um mich zum Zorn zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Ägyptens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „groß an Fleisch“; eine derbe sexuelle Beschreibung. Andere mögliche Wiedergaben sind „lüstern“ oder „wohlbestückt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: Du hast dich … prostituiert
  rationale: Die reflexive Form gibt die sexuelle Metapher von זנה deutlich und in modernem Deutsch wieder, ohne sie zur bloßen Untreue abzuschwächen.
- source_word: אֶל בְּנֵי מִצְרַיִם
  choice: mit den Söhnen Ägyptens
  rationale: „Mit“ entspricht im Deutschen der idiomatischen Verbindung beim Sich-Prostituieren; „Söhne Ägyptens“ bewahrt die konkrete hebräische Wendung, während die geläufigere Bedeutung in der Fußnote steht.
- source_word: שְׁכֵנַיִךְ
  choice: deinen Nachbarn
  rationale: Die Wiedergabe bezeichnet die räumlich beziehungsweise politisch nahen Ägypter unmittelbar und verständlich.
- source_word: גִּדְלֵי בָשָׂר
  choice: die groß an Fleisch waren
  rationale: Diese bewusst derbe, relativ formnahe Wiedergabe erhält die sexuelle Körpermetaphorik und legt sie nicht vorschnell auf „lüstern“ oder eine bestimmte anatomische Aussage fest.
- source_word: וַתַּרְבִּי אֶת תַּזְנֻתֵךְ
  choice: und hast deine Prostitution vermehrt
  rationale: „Vermehrt“ bildet den kausativen Sinn von רבה ab; „Prostitution“ hält die lexikalische Verbindung zum vorausgehenden Verb aufrecht.
- source_word: לְהַכְעִיסֵנִי
  choice: um mich zum Zorn zu reizen
  rationale: Die Formulierung bewahrt sowohl den verursachenden Sinn des Hiphil als auch den Zorn als dessen Ergebnis.
theological_decisions:
- issue: Sexuelle Metapher für Jerusalems Bundesuntreue, Götzendienst und politische Verbindungen
  choice: Die ausdrückliche Prostitutionsmetaphorik bleibt im Haupttext erhalten.
  alternative: Die Aussage mit „untreu sein“ oder „Ehebruch begehen“ abmildern.
  rationale: Die schockierende sexuelle Bildsprache gehört zur prophetischen Anklage dieses Kapitels. Eine Abschwächung würde die rhetorische Kraft des hebräischen Textes mindern und die Metapher stärker auslegen als übersetzen.
- issue: Bedeutung von בְּנֵי מִצְרַיִם
  choice: „Söhne Ägyptens“ im Haupttext
  alternative: „Ägypter“
  rationale: Die wörtlichere Wendung ist im Deutschen verständlich und bewahrt die Bildgestalt des Ausgangstextes; die idiomatische Lesart wird in einer Fußnote angegeben.
- issue: Deutung von גִּדְלֵי בָשָׂר
  choice: Die körperlich-sexuelle, aber mehrdeutige Formulierung wird bewahrt.
  alternative: „lüstern“ oder „wohlbestückt“
  rationale: „Lüstern“ verschiebt die Aussage vom Körper zur Begierde; „wohlbestückt“ legt die derbe Wendung anatomisch eindeutiger fest, als es für eine Übersetzung nötig ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst unverhüllter prophetischer Bildsprache. Die ungewöhnliche Formulierung „groß an Fleisch“ erhält die Fremdheit und Mehrdeutigkeit des Hebräischen; die Fußnote erläutert ihren derben sexuellen Charakter.
