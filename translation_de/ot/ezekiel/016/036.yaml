source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן הִשָּׁפֵ֤ךְ נְחֻשְׁתֵּ/ךְ֙ וַ/תִּגָּלֶ֣ה עֶרְוָתֵ֔/ךְ בְּ/תַזְנוּתַ֖יִ/ךְ עַל מְאַהֲבָ֑יִ/ךְ וְ/עַל֙ כָּל גִּלּוּלֵ֣י תוֹעֲבוֹתַ֔יִ/ךְ וְ/כִ/דְמֵ֣י בָנַ֔יִ/ךְ אֲשֶׁ֥ר נָתַ֖תְּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/036.yaml
  text: 'Thus says the Lord GOD: Because your bronze was poured out[a], and your nakedness was uncovered in your prostitutions with your lovers, and because of all the idols of your abominations, and because of the blood of your children whom you gave to them[c][b],'
translation:
  language: de
  text: 'So spricht Gott, der HERR: Weil dein Erz ausgegossen wurde[a] und deine Blöße bei deinen Hurereien mit deinen Liebhabern enthüllt wurde und wegen all deiner abscheulichen Götzen[b] und wegen des Blutes deiner Kinder, die du ihnen gegeben hast[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „dein Erz“. Gemeint sein kann das Vermögen, das Jerusalem an seine Liebhaber verschwendete; möglicherweise ist der Ausdruck auch ein anstößiges Bild sexueller Preisgabe. Die genaue Bedeutung ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Ausdruck für „Götzen“ ist verächtlich; wörtlicher: „die Götzen deiner Abscheulichkeiten“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist, dass die Kinder den Götzen als Opfer gegeben wurden.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die im Deutschen geläufige Wiedergabe der festen Verbindung vermeidet das schwer verständliche „Herr HERR“ und kennzeichnet den Gottesnamen durch Kapitälchen.
- source_word: נְחֻשְׁתֵּךְ
  choice: dein Erz
  rationale: Das Substantiv bezeichnet gewöhnlich Kupfer oder Bronze. „Erz“ bewahrt das konkrete, im Zusammenhang jedoch schwer deutbare Bild, ohne es vorschnell als Vermögen, Begierde oder sexuelle Entblößung festzulegen.
- source_word: הִשָּׁפֵךְ
  choice: ausgegossen wurde
  rationale: Die passive Form und das Bild des Ausgießens werden unmittelbar erhalten.
- source_word: וַתִּגָּלֶה עֶרְוָתֵךְ
  choice: deine Blöße … entblößt wurde
  rationale: Die körperliche Bildsprache des hebräischen Ausdrucks bleibt sichtbar; eine bloße Wiedergabe mit „Schande“ wäre stärker deutend.
- source_word: בְּתַזְנוּתַיִךְ
  choice: bei deinen Hurereien
  rationale: Der Plural bezeichnet wiederholte sexuelle Untreue und dient im Kapitel zugleich als Bild für Jerusalems religiöse Untreue.
- source_word: עַל מְאַהֲבָיִךְ
  choice: mit deinen Liebhabern
  rationale: „Mit“ gibt die Beziehung im Zusammenhang idiomatisch wieder, obwohl עַל wörtlich ein breiteres Bedeutungsspektrum hat.
- source_word: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
  choice: all deiner abscheulichen Götzen
  rationale: Die natürliche deutsche Formulierung gibt sowohl den verächtlichen Ausdruck für Götzen als auch תּוֹעֵבָה, „Abscheulichkeit“, wieder.
- source_word: וְכִדְמֵי בָנַיִךְ
  choice: und wegen des Blutes deiner Kinder
  rationale: Im Gefüge der Anklage wird die Wendung kausal verstanden. Sie bezeichnet die Blutschuld, die aus der Tötung der Kinder entstand.
- source_word: אֲשֶׁר נָתַתְּ לָהֶם
  choice: die du ihnen gegeben hast
  rationale: „Gegeben“ bewahrt das schlichte und erschütternde Verb נתן; das Relativpronomen bezieht sich natürlich auf die Kinder.
theological_decisions:
- issue: Mehrdeutigkeit von נְחֻשְׁתֵּךְ im Zusammenhang von Hurerei und Götzendienst
  choice: Das konkrete Bild „dein Erz“ bleibt im Haupttext stehen.
  alternative: „dein Vermögen“, „deine Begierde“ oder eine Umschreibung sexueller Preisgabe
  rationale: Die Grundbedeutung des Nomens ist Kupfer beziehungsweise Bronze, doch seine metaphorische Funktion ist umstritten. Eine eindeutige Deutung im Haupttext würde die echte Unsicherheit des hebräischen Ausdrucks verdecken.
- issue: Beschreibung des Kinderopfers
  choice: „das Blut deiner Kinder, die du ihnen gegeben hast“
  alternative: „deiner Kinder, die du ihnen geopfert hast“
  rationale: Der Zusammenhang weist auf Kinderopfer an Götzen, doch der hebräische Haupttext verwendet das allgemeinere Verb „geben“. Die Übersetzung erhält diese Formulierung, während die Fußnote den kulturellen Bezug erklärt.
- issue: Bezug des Pronomens in „ihnen gegeben“
  choice: Die Götzen werden als naheliegender Bezug verstanden, ohne sie im Haupttext ausdrücklich einzusetzen.
  alternative: „die du den Götzen gegeben hast“
  rationale: Das Pronomen bleibt wie im Hebräischen erhalten. Der Kontext legt die Götzen als Empfänger nahe, doch eine ausdrückliche Ersetzung würde die Formulierung stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede Jerusalems bleibt durchgehend weiblich. Das harte Bildfeld von Hurerei, Entblößung, Götzendienst und Kinderblut wird nicht abgeschwächt. Das abschließende Komma zeigt, dass der mit „Weil“ eröffnete Begründungssatz im folgenden Vers weitergeführt wird.
