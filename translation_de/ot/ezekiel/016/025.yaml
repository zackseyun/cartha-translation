  text: אֶל כָּל רֹ֣אשׁ דֶּ֗רֶךְ בָּנִית֙ רָֽמָתֵ֔/ךְ וַ/תְּתַֽעֲבִי֙ אֶת יָפְיֵ֔/ךְ וַ/תְּפַשְּׂקִ֥י אֶת רַגְלַ֖יִ/ךְ לְ/כָל עוֹבֵ֑ר וַ/תַּרְבִּ֖י אֶת תזנת/ך־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/025.yaml
  text: At every street corner you built your high place[a], and you made your beauty detestable[b]. You spread your legs to every passerby and multiplied your prostitution.
translation:
  language: de
  text: An jedem Straßenknotenpunkt[a] bautest du deine Kulthöhe und machtest deine Schönheit abscheulich. Du spreiztest deine Beine für jeden, der vorüberkam, und vermehrtest deine Hurerei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »am Kopf jedes Weges«; gemeint sein kann auch: »an jeder Wegkreuzung« oder »an jeder Straßenecke«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ דֶּרֶךְ
  choice: Straßenknotenpunkt
  rationale: Wörtlich »Kopf/Anfang eines Weges«; gemeint ist ein auffälliger öffentlicher Punkt, an dem Wege zusammentreffen. »Straßenknotenpunkt« gibt dies im modernen Deutschen präzise wieder.
- source_word: רָמָה
  choice: Kulthöhe
  rationale: Das Wort bezeichnet hier im Kontext des Götzendienstes eine erhöhte Kultstätte. »Kulthöhe« bewahrt sowohl den räumlichen als auch den kultischen Sinn.
- source_word: תְּתַעֲבִי אֶת יָפְיֵךְ
  choice: So machtest du deine Schönheit abscheulich
  rationale: Das Verb bezeichnet ein Abscheulichmachen. Die Formulierung erhält die Aussage, dass Jerusalem seine ihm verliehene Schönheit selbst ins Abstoßende verkehrte.
- source_word: תְּפַשְּׂקִי אֶת רַגְלַיִךְ
  choice: Du spreiztest deine Beine
  rationale: Das Hebräische verwendet ein bewusst drastisches sexuelles Bild. Die direkte Wiedergabe vermeidet eine beschönigende Abschwächung.
- source_word: לְכָל עוֹבֵר
  choice: für jeden, der vorüberkam
  rationale: Das Partizip bezeichnet jeden Vorübergehenden. Die deutsche Wendung klingt natürlich und macht den wiederholten Vorgang deutlich.
- source_word: תַרְבִּי אֶת תַּזְנוּתֵךְ
  choice: vermehrtest deine Hurerei
  rationale: »Vermehren« bewahrt die steigernde Bedeutung des Verbs; »Hurerei« gibt die drastische prophetische Metapher für Jerusalems öffentliche kultische Untreue prägnant wieder.
theological_decisions:
- issue: Explizite sexuell-kultische Metaphorik
  choice: Die drastischen Bilder mit »spreiztest deine Beine« und »Hurerei« unmittelbar wiedergeben
  alternative: Mit Wendungen wie »gabst dich hin« oder »triebest Unzucht« abschwächen
  rationale: Der hebräische Text schildert Jerusalems Götzendienst absichtlich als schamlose sexuelle Untreue. Eine direkte Übersetzung bewahrt die prophetische Härte, ohne die Metapher konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst unverhüllter Sprache entsprechend der Schärfe des hebräischen Textes. »Kulthöhe« ist verständlicher und eindeutiger kultisch als das bloße »Höhe«; »Hurerei« bewahrt gegenüber dem neutraleren »Prostitution« stärker den Vorwurf ehelicher beziehungsweise kultischer Untreue.
