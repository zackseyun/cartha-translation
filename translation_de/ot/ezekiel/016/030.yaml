id: EZK.16.30
reference: Ezekiel 16:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מָ֤ה אֲמֻלָה֙ לִבָּתֵ֔/ךְ נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה בַּ/עֲשׂוֹתֵ/ךְ֙ אֶת כָּל אֵ֔לֶּה מַעֲשֵׂ֥ה אִשָּֽׁה זוֹנָ֖ה שַׁלָּֽטֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/030.yaml
  text: How weak your heart is[a], declares the Lord GOD, when you do all these things, the deeds of a brazen prostitute,
translation:
  language: de
  text: Wie schwach ist dein Herz, spricht der Herr Jahwe, dass du all dies tust – das Treiben einer selbstherrlichen Prostituierten[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einer herrischen beziehungsweise schamlosen Prostituierten. Das hebräische Wort kann selbstherrliches, dominantes oder dreist-schamloses Verhalten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲמֻלָה
  choice: Wie schwach ist
  rationale: מָה leitet hier einen Ausruf des Grades ein. אֲמֻלָה bezeichnet einen geschwächten, kraftlosen oder dahinschwindenden Zustand; „schwach“ ist verständlich und bewahrt die bildhafte Aussage.
- source_word: לִבָּתֵךְ
  choice: dein Herz
  rationale: Das Herz steht für das innere Wesen, den Willen und die Beweggründe. Die Wiedergabe erhält das hebräische Bild.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Jahwe
  rationale: נְאֻם ist die prophetische Spruchformel. „Jahwe“ gibt den Gottesnamen wieder, während אֲדֹנָי mit „der Herr“ übersetzt wird.
- source_word: בַּעֲשׂוֹתֵךְ אֶת־כָּל־אֵלֶּה
  choice: dass du all dies tust
  rationale: Der Infinitiv mit בְּ beschreibt hier den Umstand, an dem sich die Schwäche des Herzens zeigt. Die deutsche Konstruktion mit „dass“ ist natürlich und wahrt den Zusammenhang.
- source_word: מַעֲשֵׂה
  choice: das Treiben
  rationale: Das Substantiv charakterisiert zusammenfassend die zuvor genannten Handlungen. „Treiben“ gibt in diesem anklagenden Kontext nicht nur einzelne Taten, sondern ein kennzeichnendes Verhalten wieder.
- source_word: אִשָּׁה זוֹנָה
  choice: einer Prostituierten
  rationale: Die Wendung bezeichnet eine Frau, die Prostitution betreibt. „Prostituierte“ ist gegenwärtig, sachlich und nicht unnötig vulgär.
- source_word: שַׁלָּטֶת
  choice: selbstherrlichen
  rationale: Das Wort beschreibt ein herrisches, übergriffiges oder dreist-schamloses Auftreten. „Selbstherrlich“ erhält die Vorstellung eines eigenmächtigen, dominanten Handelns; die weitere mögliche Nuance wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der Herr
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יְהוִה und macht beide Bestandteile der hebräischen Formel sichtbar.
- issue: Bildrede von Jerusalem als Prostituierter
  choice: direkte Beibehaltung der Metapher
  alternative: verallgemeinernde Wiedergabe als Untreue
  rationale: Der Vers verwendet bewusst eine drastische personale und sexuelle Metapher. Sie wird weder abgeschwächt noch über die Aussage des Textes hinaus konfessionell gedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlicher prophetischer Anklage. Der Gedankenstrich kennzeichnet die nachgestellte Charakterisierung der Handlungen. Die drastische Metapher des Ausgangstextes bleibt erhalten, ohne durch gröbere deutsche Schimpfwörter verschärft zu werden.
