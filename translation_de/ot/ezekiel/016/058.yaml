  yaml_path: translation/ot/ezekiel/016/058.yaml
  text: You have borne your lewdness and your abominations[a], declares Yahweh.
translation:
  language: de
  text: Deine Unzucht und deine abscheulichen Taten hast du getragen[a], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast die Strafe für deine Unzucht und deine abscheulichen Taten getragen“ oder: „Du hast die Schuld dafür getragen.“ Das hebräische Verb kann in diesem Zusammenhang eine rechtlich-gerichtliche Bedeutung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמָּתֵךְ
  choice: deine Unzucht
  rationale: זִמָּה bezeichnet hier im Rahmen der Ehebruchs- und Prostitutionsmetaphorik sittlich schamloses, sexuell geprägtes Fehlverhalten. „Unzucht“ bewahrt diesen Bezug besser als das allgemeinere „Bosheit“.
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: deine abscheulichen Taten
  rationale: תּוֹעֵבָה bezeichnet etwas moralisch oder kultisch Verabscheuungswürdiges. Die Wiedergabe als „abscheuliche Taten“ ist im heutigen Deutsch natürlicher als „Gräuel“ oder „Abscheulichkeiten“ und erhält den Plural.
- source_word: אַתְּ ... נְשָׂאתִם
  choice: hast du getragen
  rationale: Das selbstständige Pronomen und die Voranstellung der Objekte werden durch die deutsche Satzstellung „Deine … hast du“ hinreichend hervorgehoben. נְשָׂאתִם bezeichnet wörtlich ein Tragen und kann im Gerichtszusammenhang zugleich das Tragen von Schuld oder Strafe einschließen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht Jahwe“ ist eine knappe, würdige und im prophetischen Sprachgebrauch vertraute Wiedergabe der Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Gerichtliche Bedeutung von נשׂא
  choice: getragen
  alternative: die Strafe dafür getragen / die Schuld getragen
  rationale: Das Verb kann im Kontext das Tragen von Schuld oder ihrer Folgen meinen. Die offene Formulierung „getragen“ bewahrt diese Mehrdeutigkeit, statt sie einseitig auf Schuld oder Strafe festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Objektvoranstellung erhält den Nachdruck des Hebräischen, ohne das Pronomen durch ein zusätzliches „selbst“ zu überbetonen.
