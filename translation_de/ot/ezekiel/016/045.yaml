base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/045.yaml
  text: You are the daughter of your mother[a], who loathed her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children. Your mother was a Hittite, and your father an Amorite.
translation:
  language: de
  text: Du bist die Tochter deiner Mutter, die ihren Mann und ihre Kinder verabscheute, und du bist die Schwester deiner Schwestern, die ihre Männer und ihre Kinder verabscheuten. Eure Mutter war eine Hethiterin und euer Vater ein Amoriter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת אִמֵּךְ
  choice: die Tochter deiner Mutter
  rationale: Bewahrt die hebräische Abstammungs- und Ähnlichkeitsformel durchsichtig und verständlich.
- source_word: גֹּעֶלֶת / גָּעֲלוּ
  choice: verabscheute / verabscheuten
  rationale: Das Verb געל bezeichnet starke Abneigung beziehungsweise Zurückweisung; „verabscheuen“ gibt diese Schärfe im heutigen Standarddeutsch wieder.
- source_word: אִישָׁהּ / אַנְשֵׁיהֶן
  choice: ihren Mann / ihre Männer
  rationale: Im familiären Kontext bezeichnet אִישׁ jeweils den Ehemann; „Mann“ ist im Deutschen die natürliche kontextuelle Wiedergabe.
- source_word: בָנֶיהָ / בְנֵיהֶן
  choice: ihre Kinder
  rationale: בנים kann kollektiv die Nachkommen bezeichnen; „Kinder“ vermeidet eine unnötige Beschränkung auf Söhne.
- source_word: וַאֲחוֹת אֲחוֹתֵךְ
  choice: und du bist die Schwester deiner Schwestern
  rationale: Gibt die betonte Verwandtschafts- und Ähnlichkeitsaussage des Hebräischen weitgehend formal wieder.
- source_word: אִמְּכֶן חִתִּית וַאֲבִיכֶן אֱמֹרִי
  choice: Eure Mutter war eine Hetiterin und euer Vater ein Amoriter
  rationale: Der Wechsel zum Plural „eure/euer“ entspricht den hebräischen Pluralsuffixen und bezieht die angesprochene Stadt mit ihren Schwestern zusammen ein.
theological_decisions:
- issue: Ethnische Elternbezeichnungen für Jerusalem und ihre Schwestern
  choice: Die bildhafte Anklage wird wörtlich als „Eure Mutter war eine Hetiterin und euer Vater ein Amoriter“ wiedergegeben.
  alternative: Die Aussage ausdrücklich als sinnbildliche oder moralische Abstammung paraphrasieren.
  rationale: Im Zusammenhang von Hesekiel 16 gehört die Formulierung zur Familien- und Ehemetaphorik. Die Übersetzung bewahrt ihre rhetorische Spannung, ohne sie als biologische Genealogie festzulegen oder erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die scharfe Anklagerhetorik bleibt erhalten. Der im Hebräischen bedeutsame Wechsel von der 2. Person Singular zu Pluralformen in „eure Mutter/euer Vater“ wird sichtbar gemacht.
