lexical_decisions:
- source_word: וָאֶרְחָצֵךְ
  choice: wusch ich dich
  rationale: רחץ bezeichnet Waschen oder Baden. „Ich wusch dich“ gibt die konkrete Körperpflege direkt und in natürlichem Deutsch wieder.
- source_word: בַּמַּיִם
  choice: mit Wasser
  rationale: Die Präposition ב kann hier das Mittel oder den Bereich bezeichnen. „Mit Wasser“ ist im Deutschen idiomatisch und lässt die Alternative „im Wasser“ in der Fußnote erkennen.
- source_word: וָאֶשְׁטֹף
  choice: spülte … ab
  rationale: שטף kann hier das Abspülen beziehungsweise Wegwaschen bezeichnen. „Abspülen“ bewahrt sowohl den Reinigungsvorgang als auch die Entfernung des Blutes.
- source_word: דָּמַיִךְ
  choice: dein Blut
  rationale: Die hebräische Pluralform wird idiomatisch kollektiv als „Blut“ wiedergegeben; „Blutflecken“ wäre stärker deutend.
- source_word: מֵעָלָיִךְ
  choice: von dir ab
  rationale: Die Wendung bedeutet wörtlich „von auf dir“. „Von dir ab“ bildet die räumliche Vorstellung in natürlichem Deutsch ab.
- source_word: וָאֲסֻכֵךְ
  choice: salbte dich
  rationale: סוך bezeichnet das Bestreichen oder Einölen mit Öl. „Salben“ ist hier eine würdige, sachlich passende Wiedergabe, ohne eine besondere kultische Handlung festzulegen.
- source_word: בַּשָּׁמֶן
  choice: mit Öl
  rationale: שמן bedeutet allgemein „Öl“. Eine nähere Bestimmung als Olivenöl wäre im Vers nicht ausdrücklich gegeben.
theological_decisions:
- issue: Art der Reinigungsbilder innerhalb der Allegorie
  choice: Die Handlungen werden als konkrete körperliche Fürsorge innerhalb des Bildes wiedergegeben.
  alternative: Waschen und Salben im Haupttext ausdrücklich als kultische, sakramentale oder bundesbezogene Handlungen deuten.
  rationale: Der Vers selbst schildert Waschen, Entfernen des Blutes und Salben. Die Übersetzung bewahrt diese konkrete Bildwelt und lässt weitergehende theologische Bezüge aus dem Zusammenhang hervorgehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die feminine Anrede des Hebräischen ist im deutschen Pronomen nicht eigens markiert, ergibt sich aber aus dem Kontext. Die Abfolge der drei Fürsorgehandlungen und die konkrete Körperlichkeit des Bildes bleiben erhalten.
