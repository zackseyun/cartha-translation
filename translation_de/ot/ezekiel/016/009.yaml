  text: Then I washed you with water[a], rinsed your blood off you[b], and anointed you with oil.
translation:
  language: de
  text: Dann wusch ich dich mit Wasser[a], spülte dein Blut von dir ab[b] und salbte dich mit Öl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
