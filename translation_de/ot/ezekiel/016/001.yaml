  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Formel ויהי דבר־יהוה אלי gibt „kam“ den Vorgang im natürlichen Deutschen treffend wieder; ein wörtlicheres „war“ wäre hier unidiomatisch.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet in dieser Verbindung die göttliche Mitteilung. „Das Wort“ bewahrt die etablierte prophetische Formel und ihren Offenbarungscharakter.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; der Genitiv „Jahwes“ entspricht der hebräischen Verbindung „Wort JHWHs“ und klingt im Deutschen natürlich.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person bezeichnet die Richtung zum Propheten und wird unmittelbar mit „zu mir“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende Gottesrede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel bleibt mit „das Wort Jahwes kam zu mir“ erkennbar; der Doppelpunkt leitet knapp und idiomatisch die folgende Rede ein.
