source:
  edition: WLC
  text: וַ/יֵּ֨צֵא לָ֥/ךְ שֵׁ֛ם בַּ/גּוֹיִ֖ם בְּ/יָפְיֵ֑/ךְ כִּ֣י כָּלִ֣יל ה֗וּא בַּֽ/הֲדָרִ/י֙ אֲשֶׁר שַׂ֣מְתִּי עָלַ֔יִ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/014.yaml
  text: And your fame went out among the nations because of your beauty[a], for it was perfect through my splendor that I had set upon you, declares the Lord GOD.
translation:
  language: de
  text: Und dein Ruf[a] verbreitete sich unter den Völkern wegen deiner Schönheit; denn sie war vollkommen durch meinen Glanz, den ich auf dich gelegt hatte, spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Dein Name ging hinaus unter den Völkern«; gemeint ist, dass dein Ruf weithin bekannt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא לָךְ שֵׁם
  choice: dein Ruf verbreitete sich
  rationale: Wörtlich heißt die Wendung etwa »dein Name ging hinaus«. Gemeint ist idiomatisch, dass Jerusalems Ansehen weithin bekannt wurde; »dein Ruf verbreitete sich« gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bezeichnet hier die umliegenden Völker beziehungsweise Nationen. »Völker« ist im Deutschen natürlich und vermeidet eine spätere fachsprachliche Bedeutung von »Heiden«.
- source_word: בְּיָפְיֵךְ
  choice: wegen deiner Schönheit
  rationale: 'Die Präposition ב wird hier kausal verstanden: Jerusalems Ruf verbreitete sich aufgrund ihrer Schönheit.'
- source_word: כָּלִיל
  choice: vollkommen
  rationale: Das Wort bezeichnet Ganzheit oder Vollkommenheit und beschreibt hier die Schönheit Jerusalems.
- source_word: בַּהֲדָרִי
  choice: durch meinen Glanz
  rationale: הָדָר kann Glanz, Pracht oder Majestät bezeichnen. »Durch meinen Glanz« bewahrt den Gedanken, dass Jerusalems Schönheit vollständig von dem ihr verliehenen göttlichen Glanz herrührte.
- source_word: שַׂמְתִּי עָלַיִךְ
  choice: den ich auf dich gelegt hatte
  rationale: Die konkrete Bildsprache von שׂים mit עַל, »auf jemanden legen«, wird beibehalten und passt zum Kontext des Schmückens.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. »Der Herr Yahweh« gibt sowohl אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne beide zu einem einzigen Titel zu verschmelzen.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und macht dadurch die Gestalt des hebräischen Ausdrucks sichtbar. Die traditionelle deutsche Ersatzlesung bleibt als mögliche Übersetzungsweise anerkannt.
- issue: Quelle von Jerusalems Schönheit
  choice: Die Schönheit war durch Gottes Glanz vollkommen
  alternative: Jerusalem war aufgrund eigener Schönheit vollkommen
  rationale: Der hebräische Satz führt die vollkommene Schönheit ausdrücklich auf den Glanz zurück, den Gott auf Jerusalem gelegt hatte; die Übersetzung bewahrt diese Abhängigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weiblichen Anredeformen des Hebräischen werden entsprechend der Personifikation Jerusalems mit »du« wiedergegeben. Das Pronomen »sie« bezieht sich auf die unmittelbar zuvor genannte Schönheit.
