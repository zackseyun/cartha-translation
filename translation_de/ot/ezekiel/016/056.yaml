base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/056.yaml
  text: Was not Sodom your sister a byword in your mouth in the day of your pride?[a]
translation:
  language: de
  text: War nicht Sodom, deine Schwester, zur Zeit deines Hochmuts ein Gesprächsthema auf deinen Lippen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Nachricht“, „etwas, wovon man sprach“ oder „Gesprächsstoff“. Das hebräische Wort bezeichnet etwas Gehörtes oder Weitergesagtes; hier ist wahrscheinlich Sodom als berüchtigtes Beispiel im Reden Jerusalems gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: War nicht
  rationale: Die Verbindung aus Konjunktion und Verneinung leitet im Zusammenhang am natürlichsten eine rhetorische Frage ein; im Deutschen ist „War nicht“ idiomatisch.
- source_word: הָיְתָה
  choice: war
  rationale: Das Qal Perfekt von היה bezeichnet hier einen vergangenen Zustand.
- source_word: סְדֹם
  choice: Sodom
  rationale: Der Ortsname folgt der etablierten deutschen Form.
- source_word: אֲחוֹתֵךְ
  choice: deine Schwester
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten, weil das Bild der Schwesterstädte für Hesekiel 16 zentral ist.
- source_word: לִשְׁמוּעָה
  choice: ein Gegenstand des Geredes
  rationale: שְׁמוּעָה kann eine Nachricht, etwas Gehörtes oder etwas, worüber gesprochen wird, bezeichnen. Zusammen mit „in deinem Mund“ liegt öffentliches beziehungsweise abschätziges Reden nahe, ohne dass die mögliche Bedeutung „Nachricht“ ausgeschlossen wird.
- source_word: בְּפִיךְ
  choice: in deinem Mund
  rationale: Die hebräische Körpermetapher wird formal bewahrt und ist im Deutschen verständlich, auch wenn „auf deinen Lippen“ idiomatischer wäre.
- source_word: בְּיוֹם
  choice: in der Zeit
  rationale: Die temporale Wendung „am Tag von“ wäre im modernen Deutschen steif; „in der Zeit“ gibt die zeitliche Funktion natürlich wieder.
- source_word: גְּאוֹנָיִךְ
  choice: deines Hochmuts
  rationale: גאון bezeichnet hier selbstüberheblichen Stolz. „Hochmut“ bringt die negative Wertung im Deutschen klar und würdig zum Ausdruck.
theological_decisions:
- issue: Aussageform des Verses über Sodom
  choice: 'Rhetorische Frage: „War nicht Sodom …?“'
  alternative: 'Aussagesatz: „Sodom … war nicht …“'
  rationale: Die Anfangsstellung der Verneinung mit dem Perfekt lässt sich im prophetischen Tadel plausibel als rhetorische Frage verstehen. So bleibt die konfrontative Kraft erhalten, ohne die Aussage dogmatisch weiter auszulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung hält die rhetorische Zuspitzung fest; die etwas markante Wendung „in deinem Mund“ bewahrt bewusst das hebräische Bild.
