source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֨ר אֲדֹנָ֤/י יְהוִה֙ לִ/יר֣וּשָׁלִַ֔ם מְכֹרֹתַ֨יִ/ךְ֙ וּ/מֹ֣לְדֹתַ֔יִ/ךְ מֵ/אֶ֖רֶץ הַֽ/כְּנַעֲנִ֑י אָבִ֥י/ךְ הָ/אֱמֹרִ֖י וְ/אִמֵּ֥/ךְ חִתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
translation:
  language: de
  text: 'Und sage: »So spricht der Herr Yahweh zu Jerusalem: Deine Herkunft und deine Geburt stammen aus dem Land des Kanaaniters[a]; dein Vater war ein Amoriter und deine Mutter eine Hetiterin.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder flüssiger: »aus dem Land Kanaan«. Wörtlich steht im Hebräischen: »aus dem Land des Kanaaniters«; damit bleibt die ethnische Betonung erhalten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  choice: 'Und sage: »So spricht'
  rationale: Die prophetische Botenformel wird im Deutschen natürlich im Präsens wiedergegeben; der Imperativ führt die auszurichtende Rede ein.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Wiedergabe unterscheidet den Herrentitel אֲדֹנָי vom Gottesnamen יְהוִה und vermeidet die missverständliche Verdoppelung »Herr HERR«.
- source_word: לִירוּשָׁלִַם
  choice: zu Jerusalem
  rationale: Die Präposition ל kennzeichnet hier die Stadt als Adressatin der prophetischen Rede.
- source_word: מְכֹרֹתַיִךְ וּמוֹלְדֹתַיִךְ
  choice: Deine Herkunft und deine Geburt
  rationale: Die beiden Begriffe bezeichnen Jerusalems Ursprung beziehungsweise Geburtsherkunft. Die konkrete familiäre Bildsprache des Zusammenhangs bleibt erhalten.
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  choice: aus dem Land des Kanaaniters
  rationale: Der hebräische Text nennt wörtlich das Land »des Kanaaniters«. Diese ethnische Zuspitzung bereitet die anschließende Nennung des Amoriters und der Hetiterin vor.
- source_word: אָבִיךְ הָאֱמֹרִי
  choice: dein Vater war ein Amoriter
  rationale: Der verblosen hebräischen Aussage entspricht im Deutschen natürlich eine Vergangenheitsform mit »war«.
- source_word: וְאִמֵּךְ חִתִּית
  choice: und deine Mutter eine Hetiterin
  rationale: Das bereits gesetzte »war« wird in der parallelen zweiten Aussage idiomatisch mitverstanden; die weibliche Volksbezeichnung entspricht der Muttermetapher.
theological_decisions:
- issue: Bildhafte Abstammung Jerusalems
  choice: Die familiären Herkunftsaussagen werden ohne erklärenden Zusatz als direkte Anklage wiedergegeben.
  alternative: Die Aussage ausdrücklich als moralische oder geistliche Ähnlichkeit deuten.
  rationale: Der Text setzt die schockierende Abstammungsmetapher selbst ein. Eine ausdrückliche Deutung im Haupttext würde die bewusst stehen gelassene rhetorische Spannung auflösen.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form macht sowohl den Titel als auch den im Ausgangstext stehenden Gottesnamen sichtbar und bewahrt ihre Unterscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Formulierung »Land des Kanaaniters« wird wegen ihrer rhetorischen und ethnischen Zuspitzung beibehalten und durch eine Fußnote erläutert.
