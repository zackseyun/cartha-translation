source:
  edition: WLC
  text: הִנֵּה זֶ֣ה הָיָ֔ה עֲוֺ֖ן סְדֹ֣ם אֲחוֹתֵ֑/ךְ גָּא֨וֹן שִׂבְעַת לֶ֜חֶם וְ/שַׁלְוַ֣ת הַשְׁקֵ֗ט הָ֤יָה לָ/הּ֙ וְ/לִ/בְנוֹתֶ֔י/הָ וְ/יַד עָנִ֥י וְ/אֶבְי֖וֹן לֹ֥א הֶחֱזִֽיקָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
translation:
  language: de
  text: 'Sieh, dies war die Schuld deiner Schwester Sodom: Hochmut, Brot in Fülle und sorglose Ruhe hatten sie und ihre Töchter[a]; aber die Hand der Armen und Bedürftigen stärkte sie nicht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit Sodoms „Töchtern“ sind die zu ihr gehörenden Städte oder Siedlungen gemeint.
    reason: cultural_note
  - marker: b
    text: Die hebräische Wendung „die Hand … stärken“ bedeutet, jemanden zu unterstützen oder ihm zu helfen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה זֶה
  choice: Sieh, das war
  rationale: „Sieh“ gibt den nachdrücklichen Hinweis הִנֵּה in modernem, würdigem Deutsch wieder; „das war“ führt die folgende Bestimmung ein.
- source_word: עֲוֺן
  choice: Schuld
  rationale: Das Wort kann Schuld, Vergehen oder Sünde bezeichnen. „Schuld“ bewahrt hier sowohl den Gedanken des schuldhaften Verhaltens als auch der Verantwortlichkeit.
- source_word: אֲחוֹתֵךְ
  choice: deine Schwester
  rationale: Das ausdrückliche Familienbild, mit dem Jerusalem und Sodom verglichen werden, bleibt erhalten.
- source_word: גָּאוֹן
  choice: Hochmut
  rationale: Im Zusammenhang bezeichnet das Wort stolze Überheblichkeit; „Hochmut“ ist präzise und idiomatisch.
- source_word: שִׂבְעַת לֶחֶם
  choice: Brot in Fülle
  rationale: Die Wendung bedeutet wörtlich „Fülle/Sättigung an Brot“. Die Wiedergabe erhält das konkrete Bild und bezeichnet reichliche Versorgung.
- source_word: שַׁלְוַת הַשְׁקֵט
  choice: sorglose Ruhe
  rationale: Die Wortverbindung beschreibt ungestörtes, selbstzufriedenes Wohlergehen. „Sorglose Ruhe“ bewahrt sowohl Sicherheit als auch den im Kontext negativen Unterton.
- source_word: הָיָה לָהּ וְלִבְנוֹתֶיהָ
  choice: hatte sie mit ihren Töchtern
  rationale: Diese natürliche deutsche Konstruktion drückt aus, dass die genannten Zustände Sodom und den ihr zugeordneten Orten gemeinsam eigen waren.
- source_word: בְנוֹתֶיהָ
  choice: ihren Töchtern
  rationale: Die prophetische Stadtmetapher wird im Haupttext bewahrt; eine Fußnote erläutert, dass damit zugehörige Ortschaften gemeint sind.
- source_word: יָד ... לֹא הֶחֱזִיקָה
  choice: die Hand ... stärkte sie nicht
  rationale: Die hebräische Bildsprache bleibt erhalten. Das Idiom meint, Bedürftige zu unterstützen oder ihnen beizustehen, was in einer Fußnote erklärt wird.
- source_word: עָנִי וְאֶבְיוֹן
  choice: der Armen und Bedürftigen
  rationale: Das geläufige Wortpaar bezeichnet wirtschaftlich und gesellschaftlich schutzbedürftige Menschen; die deutsche Paarformel gibt dies klar wieder.
theological_decisions:
- issue: Art der Schuld Sodoms in diesem Vers
  choice: Der Vers nennt Hochmut, Überfluss, sorglose Ruhe und unterlassene Hilfe für Arme, ohne weitere Sünden in die Übersetzung hineinzutragen.
  alternative: Die Übersetzung so zu formulieren, dass vor allem eine nicht ausdrücklich genannte sexuelle Sünde im Vordergrund steht.
  rationale: Der hebräische Text benennt an dieser Stelle ausdrücklich soziale und moralische Verfehlungen. Die Übersetzung gibt diese wieder, ohne andere biblische Aussagen vorwegzunehmen oder den Vers konfessionell einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Familien- und Körpermetaphern des Hebräischen bleiben erhalten und werden knapp erläutert; „Brot in Fülle“ wahrt das konkrete Ausgangsbild.
