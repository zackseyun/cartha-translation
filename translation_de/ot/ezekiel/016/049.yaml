  source_fidelity: 'Die wesentlichen hebräischen Elemente sind treffend wiedergegeben: עָוֹן als „Schuld“, גָּאוֹן als „Hochmut“, שִׂבְעַת לֶחֶם als „Brot in Fülle“, die Metaphern „Schwester“ und „Töchter“ sowie die Bildsprache vom Stärken der Hand. Die Fußnoten erklären die beiden für heutige Leser weniger unmittelbaren Bilder angemessen. Die pluralische deutsche Wiedergabe „der Armen und Bedürftigen“ ist als generische Formulierung für die hebräischen Einzahlformen vertretbar.'
