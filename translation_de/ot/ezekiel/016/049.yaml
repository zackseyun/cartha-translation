  terminology: „Hochmut“, „Brot in Fülle“ und „sorglose Ruhe“ wahren einen würdigen, modernen prophetischen Ton. „Sorglose Ruhe“ gibt die Verbindung von ungestörter Sicherheit und selbstzufriedener Bequemlichkeit ausreichend wieder, ohne den Text interpretativ zu überladen.
