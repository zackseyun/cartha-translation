  text: You built for yourself a mound and made for yourself a high place in every square[a].
translation:
  language: de
  text: Du bautest dir einen Hügel[a] und errichtetest dir an jedem öffentlichen Platz eine Höhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewölbe“, „erhöhter Bau“ oder „Plattform“; möglicherweise ist eine mit Prostitution verbundene Anlage gemeint. Das hebräische Wort ist selten und seine Bedeutung unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּב
  choice: Hügel
  rationale: Das seltene Substantiv bezeichnet hier offenbar eine errichtete, erhöhte Anlage. „Hügel“ bewahrt die konkrete räumliche Vorstellung, ohne die unsichere Bauform oder eine Verbindung zur Prostitution bereits im Haupttext festzulegen.
- source_word: רָמָה
  choice: Höhenstätte
  rationale: Im prophetischen Zusammenhang ist nicht nur eine natürliche Erhebung, sondern eine erhöhte kultische Anlage gemeint. „Höhenstätte“ gibt diesen kultischen Beiklang knapp und verständlich wieder.
- source_word: רְחוֹב
  choice: öffentlicher Platz
  rationale: Das Wort bezeichnet häufig einen freien, öffentlich zugänglichen Platz innerhalb einer Stadt. Die Ergänzung „öffentlich“ verdeutlicht den urbanen Sinn und die demonstrative Sichtbarkeit, ohne daraus bloß eine Straße zu machen.
- source_word: וַתִּבְנִי לָךְ
  choice: Du bautest dir
  rationale: Die feminine Singularform spricht Jerusalem direkt an; לָךְ wird in seiner benefaktiven bzw. reflexiven Funktion natürlich mit „dir“ wiedergegeben.
- source_word: וַתַּעֲשִׂי לָךְ
  choice: errichtetest dir
  rationale: „Errichten“ passt im Deutschen idiomatisch zu einer baulichen Anlage und bewahrt zugleich das wiederholte לָךְ („dir“).
- source_word: בְּכָל
  choice: auf jedem
  rationale: Die distributive Bedeutung wird vollständig wiedergegeben; bei einem öffentlichen Platz ist „auf“ im Deutschen die natürliche Präposition.
theological_decisions:
- issue: Ob die beiden Bauwörter im Haupttext ausdrücklich sexuell oder als Einrichtungen der Kultprostitution gedeutet werden sollen
  choice: Relativ konkrete, architektonische Begriffe verwenden und die sexuelle sowie götzendienerische Bildsprache aus dem Zusammenhang hervorgehen lassen
  alternative: גֶּב ausdrücklich als „Bordell“, „Hurenstätte“ oder „Prostitutionsheiligtum“ wiedergeben
  rationale: Ezechiel 16 verbindet Jerusalems Götzendienst mit dem Bild der Prostitution. Das seltene Wort גֶּב selbst legt jedoch keine einzige solche institutionelle Deutung sicher fest. Eine zurückhaltende Wiedergabe bewahrt die lexikalische Unsicherheit und die Spannung des Bildes.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Anrede Jerusalems bleibt erhalten. „Öffentlicher Platz“ ist für heutige Leser klarer als das mehrdeutige „Gasse“; „Höhenstätte“ bewahrt den kultischen Ton, ohne die Metapher konfessionell auszudeuten.
