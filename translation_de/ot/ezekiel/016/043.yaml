source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹֽא זכרתי אֶת יְמֵ֣י נְעוּרַ֔יִ/ךְ וַ/תִּרְגְּזִי לִ֖/י בְּ/כָל אֵ֑לֶּה וְ/גַם אֲנִ֨י הֵ֜א דַּרְכֵּ֣/ךְ בְּ/רֹ֣אשׁ נָתַ֗תִּי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לֹ֤א עשיתי אֶת הַ/זִּמָּ֔ה עַ֖ל כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/043.yaml
  text: Because you did not remember the days of your youth[a], but enraged me with all these things, therefore I also have put your way on your own head, declares the Lord GOD, and you have not committed lewdness beyond all your abominations.
translation:
  language: de
  text: Weil du nicht an die Tage deiner Jugend gedacht, sondern mich mit all dem zum Zorn gereizt hast, darum habe auch ich nun dein Verhalten auf deinen eigenen Kopf zurückfallen lassen – Ausspruch des Herrn Jahwe. Hast du nicht zu all deinen abscheulichen Taten auch noch diese Schandtat begangen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist schwierig. Die masoretische Lesetradition richtet ihn an Jerusalem und lässt sich als rhetorische Frage verstehen. Auch möglich: „Und du hast diese Schandtat zusätzlich zu all deinen abscheulichen Taten begangen.“ Die Konsonantenschreibung kann dagegen die erste Person („ich habe getan“) nahelegen.'
    reason: Bewahrt die textliche und syntaktische Mehrdeutigkeit der Schlussklausel, statt sie stillschweigend aufzulösen.
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet den Grund für das folgende Gericht ein; „weil“ gibt die kausale Funktion in natürlichem Deutsch wieder.
- source_word: 'לֹא זכרתי (Qere: זָכַרְתְּ) אֶת יְמֵי נְעוּרַיִךְ'
  choice: du nicht an die Tage deiner Jugend gedacht hast
  rationale: Die masoretische Lesetradition versteht die Form als Anrede Jerusalems in der 2. Person Femininum Singular. „An … gedacht“ ist für זכר idiomatisch und bewahrt den Rückbezug auf Jerusalems Anfangszeit.
- source_word: וַתִּרְגְּזִי לִי בְּכָל אֵלֶּה
  choice: sondern mich mit all dem zum Zorn gereizt hast
  rationale: רגז bezeichnet hier das Erregen oder Aufbringen Gottes. Die adversative Verbindung verdeutlicht den Gegensatz zum unterlassenen Erinnern.
- source_word: וְגַם אֲנִי הֵא
  choice: darum habe auch ich nun
  rationale: „Auch ich“ bewahrt die vergeltende Entsprechung; „darum“ und „nun“ geben Folgerung und Nachdruck des Partikelgefüges wieder, ohne ein unnatürliches „siehe“ einzuschieben.
- source_word: דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי
  choice: dein Verhalten auf deinen eigenen Kopf zurückfallen lassen
  rationale: „Verhalten“ gibt den ethischen Sinn von „Weg“ wieder. Die deutsche Wendung bewahrt das Bild vom eigenen Kopf und macht den gerichtlichen Vergeltungssinn verständlich.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: „Ausspruch“ kennzeichnet die prophetische Formel; „Herr Jahwe“ unterscheidet אֲדֹנָי vom Gottesnamen יְהוִה und gibt beide Bestandteile wieder.
- source_word: הַזִּמָּה
  choice: diese Schandtat
  rationale: זִמָּה bezeichnet im sexuellen und moralischen Kontext des Kapitels schändliches, zügelloses Handeln. „Schandtat“ ist deutlich, würdig und weniger eng als ausschließlich „Unzucht“.
- source_word: עַל כָּל תּוֹעֲבֹתָיִךְ
  choice: zu all deinen abscheulichen Taten auch noch
  rationale: עַל wird im schwierigen Schlusssatz additiv verstanden. Die Formulierung gibt den Sinn „zusätzlich zu“ in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung gibt sowohl den Titel אֲדֹנָי als auch den Eigennamen יְהוִה erkennbar wieder, ohne beide zu einem einzigen Titel zu verschmelzen.
- issue: Sinn und Satzart der Schlussklausel
  choice: 'rhetorische Frage an Jerusalem: „Hast du nicht … auch noch … begangen?“'
  alternative: 'Aussagesatz: „Und du hast … nicht … begangen“; oder Anschluss an Gottes Gerichtshandeln nach der Konsonantenschreibung'
  rationale: Die masoretische Lesetradition setzt die Anrede Jerusalems fort. Eine rhetorische Frage ergibt im Zusammenhang einen verständlichen Vorwurf, doch die schwierige Syntax und die abweichende Konsonantenschreibung erlauben keine völlige Sicherheit; deshalb wird die Spannung in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte weibliche Anrede Jerusalems bleibt erhalten. Gerichtssprache und das Bild vom eigenen Kopf werden bewahrt, zugleich wird ein im Deutschen unverständliches wörtliches „den Weg auf den Kopf legen“ vermieden.
