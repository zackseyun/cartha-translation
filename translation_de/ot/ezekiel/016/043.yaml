review_pass:
  verdict: revise
  source_fidelity: Die erste Satzhälfte und die Vergeltungsmetapher sind im Wesentlichen zutreffend. Die Schlussklausel ist jedoch textlich schwierig und trägt im Hebräischen kein ausdrückliches Fragezeichen. Die rhetorische Frage „Hast du nicht ...?“ ist daher als Haupttext zu bestimmt. Außerdem erklärt die Fußnote die masoretische Lesetradition unzutreffend als rhetorische Frage. Eine kontextuell naheliegende konsekutive Wiedergabe („du wirst nicht mehr ...“) mit einer präzisen Fußnote wahrt die Problemlage besser.
  naturalness: Der deutsche Duktus ist überwiegend modern und würdig. „auf deinen eigenen Kopf zurückfallen lassen“ ist verständlich, doch „dein Tun auf deinen Kopf zurückfallen lassen“ ist idiomatischer und näher an der gerichtlichen Bildsprache. „Spruch Jahwes, des Herrn“ ist als Formel im Deutschen flüssiger als „Ausspruch des Herrn Jahwe“.
  terminology: „Jahwe“ gibt den Gottesnamen wieder. „Schandtat“ und „abscheuliche Taten“ sind im Kontext möglich; „Abscheulichkeiten“ hält die wiederholte Terminologie תּוֹעֵבוֹת enger fest. Für זִמָּה ist „Schandtat“ angemessen, ohne die Bedeutung auf eine einzelne sexuelle Handlung zu verengen.
  issues:
  - severity: high
    issue: Die Schlussklausel wird als rhetorische Frage wiedergegeben.
    rationale: Der hebräische Wortlaut enthält keine Interrogativpartikel. Zwar ist der Satz wegen der Überlieferungs- und Syntaxprobleme umstritten, doch eine rhetorische Frage sollte nicht ohne Kennzeichnung in den Haupttext gesetzt werden.
  - severity: high
    issue: Die Fußnote schreibt der masoretischen Lesetradition eine rhetorische Frage zu.
    rationale: Die Lesetradition betrifft die Personform des Verbs; sie markiert keine Frage. Die Fußnote muss die Konsonantenschreibung und die Lesung sachlich unterscheiden und die kontextuelle Deutung als solche benennen.
  - severity: medium
    issue: „dein Verhalten auf deinen eigenen Kopf zurückfallen lassen“ vermischt die Kopf-Metapher mit einer zusätzlichen Rückfall-Wendung.
    rationale: „Dein Tun auf deinen Kopf zurückfallen lassen“ ist im Deutschen klarer, bewahrt die Metapher und bringt die gerichtliche Vergeltung ohne unnötige Umschreibung zum Ausdruck.
  revised_text: Weil du nicht an die Tage deiner Jugend gedacht, sondern mich durch all dies zum Zorn gereizt hast, darum habe auch ich dein Tun auf deinen Kopf zurückfallen lassen – Spruch Jahwes, des Herrn. Und du wirst nicht mehr zusätzlich zu all deinen Abscheulichkeiten diese Schandtat begehen.[a]
  revised_footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist schwierig. Die Konsonantenschreibung kann als „und ich habe nicht getan“ gelesen werden, während die masoretische Lesetradition „und du hast nicht getan“ nahelegt. Im Zusammenhang wird die Klausel häufig konsekutiv verstanden: Gottes Gericht soll bewirken, dass Jerusalem diese Schandtat nicht weiter zusätzlich zu ihren Abscheulichkeiten begeht.'
    reason: Kennzeichnet die abweichende Personlesung und die unsichere syntaktisch-zeitliche Einordnung, ohne eine im Hebräischen nicht markierte rhetorische Frage als gesichert auszugeben.
  revision_rationale: Die Revision ersetzt die nicht markierte rhetorische Frage durch eine im Kontext verbreitete konsekutive Deutung und dokumentiert die schwierige Textüberlieferung in der Fußnote. Sie verbessert zugleich die deutsche Vergeltungsmetapher und gestaltet die Gottesformel natürlich, wobei sowohl Jahwe als Gottesname als auch der Titel Herr erhalten bleiben.
