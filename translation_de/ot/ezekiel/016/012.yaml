  text: וָ/אֶתֵּ֥ן נֶ֨זֶם֙ עַל אַפֵּ֔/ךְ וַ/עֲגִילִ֖ים עַל אָזְנָ֑יִ/ךְ וַ/עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/רֹאשֵֽׁ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/012.yaml
  text: And I put a ring on your nose[a], earrings on your ears[b], and a splendid crown on your head.
translation:
  language: de
  text: Und ich legte dir einen Ring an die Nase, Ohrringe an die Ohren und eine prächtige Krone auf den Kopf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Und ich legte dir … an / auf
  rationale: נתן kann „geben, setzen, legen“ bedeuten. Im Zusammenhang des Schmückens gibt die deutsche Konstruktion mit „anlegen/aufsetzen“ die konkrete Handlung natürlich wieder.
- source_word: נֶזֶם עַל אַפֵּךְ
  choice: einen Nasenring an die Nase
  rationale: נֶזֶם bezeichnet einen ringförmigen Schmuck und ist durch die ausdrückliche Platzierung an der Nase hier als Nasenring bestimmt. Die Wiederholung „Nasenring … Nase“ entspricht der Explizitheit des Hebräischen.
- source_word: וַעֲגִילִים עַל אָזְנָיִךְ
  choice: Ohrringe an die Ohren
  rationale: עֲגִילִים bezeichnet hier Ohrschmuck; „Ohrringe“ ist die klare, gegenwärtige deutsche Entsprechung. עַל wird mit „an“ idiomatisch wiedergegeben.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: eine prächtige Krone
  rationale: Die Genitivverbindung bedeutet wörtlich „eine Krone der Pracht/Schönheit“. „Eine prächtige Krone“ bewahrt den Sinn und klingt im Deutschen natürlich.
- source_word: בְּרֹאשֵׁךְ
  choice: auf den Kopf
  rationale: Bei der Handlung des Aufsetzens gibt „auf den Kopf“ die räumliche Bedeutung von בְּ idiomatisch wieder.
