  source_fidelity: 'Der Text gibt die Struktur und den Sinn des Hebräischen zuverlässig wieder: die Gottesrede, das vergeltende Handeln an Jerusalem, den Vergleich mit ihrem eigenen Handeln sowie die Anklage des Verachtens des Eides und des Bundesbruchs. Die koordinierte Formulierung „den Eid verachtet und den Bund gebrochen hast“ ist im Deutschen idiomatisch und wahrt den engen Zusammenhang von אָלָה und לְהָפֵר בְּרִית, ohne die Funktion des Infinitivs unnötig dogmatisch auf Zweck, Folge oder Mittel festzulegen.'
  naturalness: „Denn so spricht der Herr Yahweh“ und „Ich werde mit dir verfahren, wie du gehandelt hast“ sind würdiges, modernes Standarddeutsch. „Mit dir verfahren“ trägt den gerichtlichen Ton angemessen. Der Satz ist klar und flüssig.
  terminology: „der Herr Yahweh“ gibt sowohl אֲדֹנָי als auch den Gottesnamen wieder. „Eid“ ist im Bundeskontext eine tragfähige Hauptlesart für אָלָה; die Fußnote bewahrt sachgerecht die mögliche Bedeutung „Fluch“ beziehungsweise die Fluchsanktionsdimension. „Bund brechen“ ist die etablierte deutsche Wiedergabe von הפר ברית.
