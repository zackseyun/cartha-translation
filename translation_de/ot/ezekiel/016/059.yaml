source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ו/עשית אוֹתָ֖/ךְ כַּ/אֲשֶׁ֣ר עָשִׂ֑ית אֲשֶׁר בָּזִ֥ית אָלָ֖ה לְ/הָפֵ֥ר בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/059.yaml
  text: 'For thus says the Lord GOD: I will deal with you as you have done[a], because you despised the oath by breaking the covenant.'
translation:
  language: de
  text: 'Denn so spricht der Herr Yahweh: Ich werde mit dir verfahren, wie du gehandelt hast, weil du den Eid[a] verachtet und den Bund gebrochen hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Fluch“. Das hebräische Wort kann einen Eid bezeichnen, besonders einen Eid, der mit den Fluchandrohungen eines Bundes verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יְהוִה wieder und vermeidet die missverständliche Doppelung „der Herr HERR“.
- source_word: וְעָשִׂית אוֹתָךְ
  choice: Ich werde mit dir verfahren
  rationale: Das Idiom עשה mit Personenobjekt bezeichnet hier, wie Gott an Jerusalem handeln wird. Die deutsche Wendung ist natürlich und bewahrt den vergeltenden, gerichtlichen Sinn.
- source_word: כַּאֲשֶׁר עָשִׂית
  choice: wie du gehandelt hast
  rationale: Bewahrt den Vergleich und bezieht sich direkt auf Jerusalems vorausgegangenes Verhalten.
- source_word: בָּזִית
  choice: du ... verachtet
  rationale: Gibt den starken Sinn von Geringschätzung und Missachtung knapp und idiomatisch wieder.
- source_word: אָלָה
  choice: den Eid
  rationale: Im Bundeskontext bezeichnet das Wort einen bindenden Eid, kann aber zugleich die damit verbundene Fluchandrohung meinen; diese Mehrdeutigkeit wird durch eine Fußnote erhalten.
- source_word: לְהָפֵר בְּרִית
  choice: und den Bund gebrochen hast
  rationale: הפר ברית ist die feste Wendung für das Brechen eines Bundes. Die koordinierte deutsche Form gibt die sachliche Folge beziehungsweise Erläuterung wieder, ohne eine ausdrücklich finale Absicht zu erzwingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form hält Titel und persönlichen Gottesnamen auseinander und gibt beide Bestandteile des Hebräischen sichtbar wieder.
- issue: Bedeutung von אָלָה im Bundeskontext
  choice: Eid
  alternative: Fluch
  rationale: Der unmittelbare Zusammenhang mit dem Bundesbruch spricht für den bindenden Eid; die zum Eid gehörende Fluchdimension bleibt ausdrücklich in der Fußnote erhalten.
- issue: Verhältnis des Infinitivs לְהָפֵר zum Verachten des Eides
  choice: 'koordinierte Folge/Erläuterung: „und den Bund gebrochen hast“'
  alternative: 'final: „um den Bund zu brechen“'
  rationale: Die Konstruktion kann Ziel, Folge oder nähere Erläuterung ausdrücken. Im Deutschen vermeidet die Koordination die Überinterpretation einer ausdrücklich beabsichtigten Zielsetzung und wahrt den klaren Zusammenhang beider Vergehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mit dir verfahren“ bewahrt den gerichtlichen Ton, ohne altertümlich zu wirken. Der Gottesname wird als „Yahweh“ wiedergegeben; die genuine Mehrdeutigkeit von אָלָה wird nicht im Haupttext aufgelöst, sondern in der Fußnote dokumentiert.
