  text: וְ/אֵ֤ת כָּל תּוֹעֲבֹתַ֨יִ/ךְ֙ וְ/תַזְנֻתַ֔יִ/ךְ לֹ֥א זכרתי אֶת יְמֵ֣י נְעוּרָ֑יִ/ךְ בִּֽ/הְיוֹתֵ/ךְ֙ עֵרֹ֣ם וְ/עֶרְיָ֔ה מִתְבּוֹסֶ֥סֶת בְּ/דָמֵ֖/ךְ הָיִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/022.yaml
  text: And in all your abominations and your prostitutions[a], you did not remember the days of your youth, when you were naked and bare[c][b], wallowing in your blood.
translation:
  language: de
  text: Bei all deinen Gräueltaten und deinen Hurereien[a] dachtest du nicht an die Tage deiner Jugend, als du nackt und bloß[b] warst und dich in deinem Blut wälztest.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Taten der Hurerei“. Das hebräische Bild bezeichnet Jerusalems kultische und bundwidrige Untreue.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nackt und entblößt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in deinem Blut zappeltest“ beziehungsweise „in deinem Blut herumstrampeltest“. Das hebräische Verb schildert eine hilflose, blutbedeckte Bewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבֹתַיִךְ
  choice: deinen Gräueltaten
  rationale: „Gräueltaten“ bewahrt die prophetische Schärfe und umfasst moralisch wie kultisch Abscheuliches; es klingt im heutigen Deutsch natürlicher als das substantivierte „Gräuel“ im Plural.
- source_word: תַזְנֻתַיִךְ
  choice: deiner Hurerei
  rationale: Die konkrete sexuelle Metapher für Jerusalems kultische und bundwidrige Untreue bleibt erhalten. Der kollektive Singular ist im Deutschen idiomatischer, während eine Fußnote die mögliche Wiedergabe als einzelne Handlungen nennt.
- source_word: לֹא זכרתי
  choice: dachtest du nicht an
  rationale: 'Die Konsonanten und die syntaktisch erforderliche Form ergeben im Kontext die 2. Person feminin Singular: Jerusalem dachte nicht zurück. „An etwas denken“ ist eine natürliche deutsche Entsprechung von זכר in diesem Zusammenhang.'
- source_word: יְמֵי נְעוּרָיִךְ
  choice: die Tage deiner Jugend
  rationale: Nahe und zugleich idiomatische Wiedergabe der hebräischen Genitivverbindung.
- source_word: עֵרֹם וְעֶרְיָה
  choice: nackt und bloß
  rationale: Die formelhafte Doppelung bleibt erhalten und verstärkt den Eindruck völliger Schutzlosigkeit und Entblößung.
- source_word: מִתְבּוֹסֶסֶת בְּדָמֵךְ
  choice: dich in deinem Blut wälztest
  rationale: Die reflexive, fortdauernde Bewegung inmitten des Blutes wird anschaulich wiedergegeben; eine Fußnote hält die lexikalische Spannweite zwischen Wälzen, Strampeln und Zappeln offen.
- source_word: וְאֵת כָּל ... וְ...
  choice: Bei all ... und ...
  rationale: 'Die schwierige elliptische Eröffnung wird als begleitender Umstand verstanden: Inmitten all dieser Taten erinnerte Jerusalem sich nicht an ihren früheren Zustand. „Bei all“ bewahrt diese Beziehung, ohne ein nicht ausdrücklich vorhandenes „trotz“ einzutragen.'
theological_decisions:
- issue: Sexuelle Bildsprache für Jerusalems Bundesbruch und Götzendienst
  choice: Die konkrete Metapher „Hurerei“ wird beibehalten.
  alternative: Untreue; Götzendienst
  rationale: Ezechiel gebraucht bewusst drastische sexuelle Bildsprache. Eine abstrakte Wiedergabe würde die prophetische Anklage abschwächen und ihre Deutung bereits in den Haupttext eintragen.
- issue: Deutung der schwierigen Anfangskonstruktion
  choice: „Bei all deinen Gräueltaten und deiner Hurerei“ als begleitender Umstand
  alternative: „Trotz all deiner Gräueltaten und deiner Hurerei“
  rationale: „Trotz“ ergäbe einen verständlichen Sinn, fügte jedoch eine konzessive Beziehung stärker ein, als sie die elliptische hebräische Syntax ausdrücklich markiert. Die gewählte Form lässt die Beziehung offener.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Härte. Die Anrede ist feminin Singular und bezieht sich auf die personifizierte Stadt Jerusalem. Die Wiederholung „nackt und bloß“ sowie die Blutbildsprache bleiben bewusst anschaulich.
