source:
  edition: WLC
  text: וְ/נָתַתִּ֨י אוֹתָ֜/ךְ בְּ/יָדָ֗/ם וְ/הָרְס֤וּ גַבֵּ/ךְ֙ וְ/נִתְּצ֣וּ רָמֹתַ֔יִ/ךְ וְ/הִפְשִׁ֤יטוּ אוֹתָ/ךְ֙ בְּגָדַ֔יִ/ךְ וְ/לָקְח֖וּ כְּלֵ֣י תִפְאַרְתֵּ֑/ךְ וְ/הִנִּיח֖וּ/ךְ עֵירֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/039.yaml
  text: I will give you into their hand[a], and they will tear down your vaulted chamber and demolish your high places. They will strip you of your clothes, take your beautiful jewelry[b], and leave you naked and bare.
translation:
  language: de
  text: Ich werde dich in ihre Hand geben. Sie werden dein Gewölbe[a] niederreißen und deine Kulthöhen zerstören. Sie werden dir deine Kleider ausziehen, deine prächtigen Schmuckstücke[b] wegnehmen und dich nackt und bloß zurücklassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Erhöhung“, „dein Heiligtum“ oder „deinen Bogen“. Das seltene hebräische Wort bezeichnet wahrscheinlich eine bauliche Anlage, die in diesem Kapitel mit Jerusalems unerlaubtem Kult verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Gegenstände deiner Pracht“; auch möglich: „deinen prächtigen Schmuck“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָךְ בְּיָדָם
  choice: Ich werde dich in ihre Hand geben
  rationale: Die deutsche Wendung bewahrt das hebräische Bild der Hand und vermittelt zugleich verständlich die Auslieferung in fremde Gewalt.
- source_word: גַּבֵּךְ
  choice: dein Gewölbe
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich eine gewölbte oder erhöhte bauliche Anlage. „Gewölbe“ wahrt den architektonischen Bezug, ohne die unsichere genaue Funktion festzulegen.
- source_word: וְנִתְּצוּ רָמֹתַיִךְ
  choice: deine Kulthöhen zerstören
  rationale: רָמוֹת bezeichnet im prophetischen Kontext erhöhte Kultstätten. „Kulthöhen“ macht diesen Bezug für heutige Leser deutlicher als das bloße „Höhen“.
- source_word: וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדָיִךְ
  choice: Sie werden dir deine Kleider ausziehen
  rationale: Die Formulierung gibt die gewaltsame Entkleidung natürlich und konkret wieder und erhält das Bild öffentlicher Erniedrigung.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: deine prächtigen Schmuckstücke
  rationale: כְּלֵי kann Gegenstände oder Stücke bezeichnen; im Zusammenhang sind die zuvor genannten Schmuckgegenstände gemeint. Die Wiedergabe bleibt konkret, während die Fußnote die allgemeinere Bedeutung offenhält.
- source_word: וְהִנִּיחוּךְ עֵירֹם וְעֶרְיָה
  choice: und dich nackt und bloß zurücklassen
  rationale: „Nackt und bloß“ erhält die verstärkende hebräische Doppelung; „zurücklassen“ beschreibt idiomatisch den herbeigeführten Endzustand.
theological_decisions:
- issue: Jerusalem als untreue Frau in einer kultisch-sexuellen Gerichtsmetapher
  choice: Die konkrete Bildsprache von Zerstörung, Entkleidung, Beraubung und Bloßstellung bleibt erhalten.
  alternative: Das Bild zu einer allgemeinen Aussage über Gericht, Zerstörung und Schande abschwächen.
  rationale: Der hebräische Text verbindet Jerusalems Götzendienst und Bundesuntreue mit einer bewusst drastischen Personenmetapher. Eine abstrakte Paraphrase würde die prophetische Spannung und rhetorische Härte vermindern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die konkrete und harte Bildsprache wird nicht beschönigt. „Kulthöhen“ verdeutlicht den religiösen Zusammenhang, während die Unsicherheit des seltenen גַּב in einer Fußnote offengehalten wird.
