  text: בִּ/בְנוֹתַ֤יִ/ךְ גַּבֵּ/ךְ֙ בְּ/רֹ֣אשׁ כָּל דֶּ֔רֶךְ וְ/רָמָתֵ֥/ךְ עשיתי בְּ/כָל רְח֑וֹב וְ/לֹא הייתי כַּ/זּוֹנָ֖ה לְ/קַלֵּ֥ס אֶתְנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/031.yaml
  text: When you built your mound at the head of every road and made your high place in every square[a], you were not like a prostitute[c][b], in that you scorned payment.
translation:
  language: de
  text: Als du dir an jedem Weganfang[b] ein Podest[a] bautest und auf jedem Platz dein Höhenheiligtum errichtetest, warst du nicht wie eine Prostituierte[c], denn du verschmähtest den Lohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dein Gewölbe“ beziehungsweise „deine erhöhte Kultstätte“. Das seltene hebräische Wort bezeichnet hier eine erhöhte Anlage im Zusammenhang des Prostitutionsbildes.
    reason: lexical_alternative
  - marker: b
    text: 'Oder „an jeder Wegkreuzung“. Wörtlich: „am Kopf jedes Weges“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: Anders als eine gewöhnliche Prostituierte handelte Jerusalem nicht gegen Bezahlung. Die folgenden Verse erläutern, dass sie selbst Geschenke gab, statt welche zu empfangen.'
    reason: cross_reference
lexical_decisions:
- source_word: בִּבְנוֹתַיִךְ
  choice: Als du … bautest
  rationale: Die Präposition ב mit dem Infinitiv constructus von בנה leitet hier einen temporalen Umstandssatz ein. „Als du … bautest“ gibt dies im Deutschen natürlich wieder.
- source_word: גַּבֵּךְ
  choice: dein Podest
  rationale: Das seltene Substantiv bezeichnet hier offenbar eine erhöhte, im Bildfeld von Kult und Prostitution stehende Anlage. „Podest“ wahrt den erhöhten Charakter, ohne ihre genaue Bauform festzulegen.
- source_word: בְּרֹאשׁ כָּל־דֶּרֶךְ
  choice: an jedem Weganfang
  rationale: רֹאשׁ bedeutet wörtlich „Kopf, Spitze, Anfang“. Die Wiedergabe bleibt nahe an der räumlichen Formulierung des Hebräischen; die idiomatische Alternative „an jeder Wegkreuzung“ wird in der Fußnote genannt.
- source_word: וְרָמָתֵךְ
  choice: deine Kulthöhe
  rationale: רָמָה bezeichnet im Zusammenhang eine erhöhte kultische Stätte. „Kulthöhe“ macht die kultische Bedeutung deutlich und unterscheidet den Ausdruck zugleich von גַּבֵּךְ.
- source_word: 'עשיתי (gelesen: עָשִׂית)'
  choice: errichtetest
  rationale: Der überlieferte Text wird gemäß der masoretischen Lesung als Verb der 2. Person Singular feminin verstanden. Bei einer Anlage ist „errichten“ im Deutschen natürlicher als das allgemeinere „machen“.
- source_word: בְּכָל רְחוֹב
  choice: auf jedem Platz
  rationale: רְחוֹב bezeichnet häufig einen breiten öffentlichen Platz oder eine Plaza. „Auf jedem Platz“ trifft den öffentlichen städtischen Schauplatz.
- source_word: 'וְלֹא הייתי (gelesen: הָיִית) כַּזּוֹנָה'
  choice: warst du nicht wie eine Prostituierte
  rationale: 'Die ausdrückliche Vergleichsform mit כ wird bewahrt. Die paradoxe Aussage soll nicht geglättet werden: Jerusalem gleicht in einem bestimmten Punkt keiner gewöhnlichen Prostituierten.'
- source_word: לְקַלֵּס
  choice: denn du verschmähtest
  rationale: Das Verb bezeichnet verächtliches Zurückweisen oder Geringschätzen. „Verschmähen“ gibt diese Haltung knapp und idiomatisch wieder; „denn“ verdeutlicht, worin der zuvor genannte Unterschied besteht.
- source_word: אֶתְנָן
  choice: den Lohn
  rationale: אֶתְנָן ist im Kontext der Lohn einer Prostituierten. Der bestimmte Ausdruck „den Lohn“ ist knapp, verständlich und bewahrt die sexuelle Metaphorik.
theological_decisions:
- issue: Metaphorische Prostitution als Bild für Jerusalems Untreue
  choice: Die direkte Bezeichnung „Prostituierte“ und der „Lohn“ bleiben erhalten.
  alternative: Die Metapher zu „Götzendienerin“ oder „untreue Frau“ abschwächen.
  rationale: Ezechiel verwendet bewusst anstößige sexuelle Bildsprache für Jerusalems Bundesuntreue. Eine rein religiöse Umschreibung würde die prophetische Schärfe und die Verbindung zu den Folgeversen mindern.
- issue: Sinn der abschließenden Aussage
  choice: Jerusalem war insofern anders als eine gewöhnliche Prostituierte, als sie den Lohn verschmähte.
  alternative: Die Aussage als allgemeine Leugnung prostitutionsähnlichen Handelns verstehen.
  rationale: 'Die Verse 32–34 erklären die Ironie: Jerusalem empfing keine Geschenke, sondern gab selbst welche. Die Übersetzung bewahrt diese Spannung, ohne sie im Haupttext ausführlich aufzulösen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische prophetische Metapher bleibt unverblümt erhalten. „Podest“ und „Kulthöhe“ unterscheiden die beiden unsicheren beziehungsweise kultisch geprägten Bauausdrücke; Fußnoten halten die lexikalischen Alternativen offen.
