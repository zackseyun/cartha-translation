  text: וַ/תִּקְחִ֞י אֶת בָּנַ֤יִ/ךְ וְ/אֶת בְּנוֹתַ֨יִ/ךְ֙ אֲשֶׁ֣ר יָלַ֣דְתְּ לִ֔/י וַ/תִּזְבָּחִ֥י/ם לָ/הֶ֖ם לֶ/אֱכ֑וֹל הַ/מְעַ֖ט מ/תזנת/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/020.yaml
  text: And you took your sons and your daughters, whom you had borne to me, and sacrificed them to them as food. Was your prostitution too small a thing?
translation:
  language: de
  text: Und du nahmst deine Söhne und deine Töchter, die du mir geboren hattest, und schlachtetest sie für sie als Speise. War deine Hurerei etwa noch nicht genug?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּזְבָּחִים
  choice: und schlachtetest sie
  rationale: Das Verb זבח bezeichnet grundsätzlich das Schlachten, häufig im Opferkontext. „Schlachtetest“ bewahrt hier sowohl den gewaltsamen Vorgang als auch den kultischen Zusammenhang, ohne ein zusätzliches Objekt wie „als Opfer“ einzuführen.
- source_word: לָהֶם לֶאֱכוֹל
  choice: für sie als Speise
  rationale: Wörtlich etwa „für sie zum Essen“. Die Wendung bezeichnet die Kinder als den Götzen dargebrachte Nahrung; „als Speise“ ist knapp, würdig und erhält das drastische Bild.
- source_word: תזנתך
  choice: deine Hurerei
  rationale: Der Ausdruck bezeichnet in diesem Kapitel bildlich Jerusalems religiöse Untreue, bleibt aber bewusst in der drastischen Sprache sexueller Untreue. „Hurerei“ erhält diese metaphorische und anklagende Schärfe.
- source_word: הַמְעַט
  choice: War … etwa noch nicht genug?
  rationale: Die knappe rhetorische Frage lautet wörtlich ungefähr „War es zu wenig von deiner Hurerei?“. Die deutsche Formulierung gibt den vorwurfsvollen Sinn natürlich wieder, ohne die Aussage in eine bloße Feststellung umzuwandeln.
theological_decisions:
- issue: Gottes Anspruch auf die geborenen Kinder
  choice: „die du mir geboren hattest“
  alternative: „die du für mich geboren hattest“
  rationale: Das hebräische לִי kann Zugehörigkeit bzw. Beziehung ausdrücken. „Mir geboren“ bewahrt Gottes Anspruch auf die Kinder im Bundeskontext, ohne den Satz unnötig auszudeuten.
- issue: Adressaten der Kinderschlachtung
  choice: „für sie“
  alternative: „ihnen“ oder „für die Götzen“
  rationale: Das maskuline Pronomen verweist im Kontext auf die fremden Götter bzw. Götzen. Das Pronomen bleibt erhalten, damit die Übersetzung nicht mehr expliziert als der Vers selbst.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst scharfer prophetischer Bildsprache. Das wiederholte „deine“ und die direkte Anrede bewahren den anklagenden Rhythmus des Hebräischen.
