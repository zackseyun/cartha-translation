source:
  edition: WLC
  text: וְ/זָכַרְתִּ֨י אֲנִ֧י אֶת בְּרִיתִ֛/י אוֹתָ֖/ךְ בִּ/ימֵ֣י נְעוּרָ֑יִ/ךְ וַ/הֲקִמוֹתִ֥י לָ֖/ךְ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/060.yaml
  text: But I myself will remember my covenant with you in the days of your youth[b][a], and I will establish for you an everlasting covenant.
translation:
  language: de
  text: Doch ich selbst werde an meinen Bund mit dir in den Tagen deiner Jugend[a] denken und für dich einen ewigen Bund[b] aufrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meinen Bund mit dir in den Tagen deiner Jugend“. Damit wird an die frühere Bundesbeziehung erinnert, ohne hier genauer zu bestimmen, welche Gestalt des Bundes gemeint ist.'
    reason: cross_reference
  - marker: b
    text: 'Oder: „einen immerwährenden Bund“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זָכַרְתִּי
  choice: Doch ... werde ... denken
  rationale: Das Präfixkonjugationsgefüge bezeichnet im Kontext zukünftiges Handeln. „Doch“ gibt den adversativen Übergang vom Gericht zu Gottes gnädigem Handeln wieder; „an ... denken“ ist die natürliche deutsche Verbindung mit „Bund“.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das selbstständige Pronomen betont das bereits in der Verbform enthaltene Subjekt.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: Gibt בְּרִית samt Possessivsuffix unmittelbar und idiomatisch wieder.
- source_word: אֶת ... אוֹתָךְ
  choice: mit dir
  rationale: In der Wendung vom Erinnern des Bundes bezeichnet die Konstruktion die Person, zu der die Bundesbeziehung besteht.
- source_word: בִּימֵי נְעוּרַיִךְ
  choice: in den Tagen deiner Jugend
  rationale: Bewahrt die hebräische Zeitformel und den Rückbezug auf Jerusalems frühe Bundesgeschichte.
- source_word: וַהֲקִמוֹתִי
  choice: und ... werde ... aufrichten
  rationale: Das Hifil von קום wird in Verbindung mit בְּרִית als Aufrichten beziehungsweise Bestätigen eines Bundes gebraucht. „Aufrichten“ bewahrt die traditionelle Bundesformulierung und ist im Deutschen verständlich.
- source_word: לָךְ
  choice: für dich
  rationale: Bewahrt den Dativsinn der Präposition, ohne sie an die geläufigere Wendung „einen Bund mit dir“ anzugleichen.
- source_word: בְּרִית עוֹלָם
  choice: einen ewigen Bund
  rationale: „Ewig“ gibt עוֹלָם knapp und idiomatisch als dauerhafte, unabsehbare Geltung wieder.
theological_decisions:
- issue: Bundessprache im Zusammenhang der Wiederherstellung
  choice: „meinen Bund“ und „einen ewigen Bund“ bleiben ohne nähere heilsgeschichtliche Festlegung stehen
  alternative: Den ersten Bund ausdrücklich als mosaischen Bund oder den ewigen Bund ausdrücklich als neuen Bund bestimmen
  rationale: Der Vers selbst erinnert an den Bund aus Jerusalems Jugend und verheißt einen ewigen Bund, benennt aber hier keine bestimmte Bundesordnung. Die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt wie das Hebräische „ich selbst“ hervor. „Aufrichten“ wahrt die biblische Bundessprache, ohne unnötig altertümlich zu wirken.
