  text: לָ/כֵ֣ן זוֹנָ֔ה שִׁמְעִ֖י דְּבַר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/035.yaml
  text: Therefore[a], prostitute, hear the word of Yahweh.
translation:
  language: de
  text: Darum, du Prostituierte[a], höre das Wort Jahwes!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hure“; das hebräische Substantiv ist eine direkte, scharfe Metapher für Jerusalems Untreue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als knapper Folgerungsmarker die Konsequenz aus den vorangehenden Anklagen ein; im Deutschen natürlich und direkt.
- source_word: זוֹנָה
  choice: du Prostituierte
  rationale: Das Substantiv bezeichnet wörtlich eine Prostituierte und steht hier als direkte, feminine Anrede an Jerusalem. Das ergänzte „du“ macht den deutschen Vokativ natürlich, ohne die Härte der Metapher abzuschwächen.
- source_word: שִׁמְעִי
  choice: höre
  rationale: Der feminine Singularimperativ wird formal bewahrt; „höre das Wort“ entspricht der würdevollen prophetischen Redeweise.
- source_word: דְּבַר
  choice: das Wort
  rationale: Bewahrt die feste prophetische Wendung דְּבַר יְהוָה und ist präziser als die dynamische Alternative „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch den Titel „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt im modernen Deutschen den persönlichen Namen und unterscheidet ihn von einem Titel.
- issue: Sexuelle Metapher für Jerusalems Untreue
  choice: Prostituierte
  alternative: Hure; Dirne
  rationale: „Prostituierte“ erhält die direkte und schwere Anklage, ist zugleich modern und vermeidet sowohl eine zusätzliche vulgäre Färbung als auch veraltete Sprache.
translation_notes:
  register: Kurze, scharf zugespitzte prophetische Anrede in modernem, würdigem Standarddeutsch. Das feminine Singularprofil der hebräischen Anrede bleibt durch „du Prostituierte“ und „höre“ erkennbar.
