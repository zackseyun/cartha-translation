base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/016.yaml
  text: You took some of your garments and made for yourself colorful high places[a], and you prostituted yourself on them—such things should not come[b], nor should they be.
translation:
  language: de
  text: Du nahmst einige deiner Kleider und machtest dir daraus bunt verzierte Kulthöhen[a], und du prostituiertest dich auf ihnen. So etwas darf nicht vorkommen und darf nicht sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus bunten Stoffstücken gefertigte Kulthöhen“, „vielfarbige Kulthöhen“ oder „bunte Heiligtümer“. Das hebräische Adjektiv ist schwierig und beschreibt wahrscheinlich die Verzierung mit den Kleidern.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schluss ist schwer verständlich. Möglich ist auch eine zeitliche Auffassung: „So etwas ist nicht geschehen und wird nicht sein.“ Wörtlicher etwa: „Sie kommen nicht, und es wird nicht sein.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מִבְּגָדַיִךְ
  choice: einige von deinen Kleidern
  rationale: 'Das מִן wird partitiv verstanden: Sie nahm einen Teil ihrer Kleider. Die Formulierung ist im modernen Deutschen natürlich und wahrt diese Nuance.'
- source_word: בָּמוֹת
  choice: Kulthöhen
  rationale: בָּמוֹת bezeichnet hier Stätten kultischer Verehrung. „Kulthöhen“ ist knapper und im Deutschen deutlicher als das missverständliche „Höhen“ allein.
- source_word: טְלֻאוֹת
  choice: bunt verzierte
  rationale: Das schwierige Adjektiv bezeichnet wahrscheinlich eine aus verschiedenfarbigen Stoffstücken gefertigte oder damit geschmückte Erscheinung. „Bunt verzierte“ gibt den Zusammenhang mit den Kleidern verständlich wieder, ohne die genaue Herstellungsweise festzulegen.
- source_word: וַתִּזְנִי
  choice: triebst du Prostitution
  rationale: Die ausdrückliche sexuelle Metapher des hebräischen Textes bleibt erhalten; sie bezeichnet im Kontext Jerusalems kultische und bundesbezogene Untreue.
- source_word: עֲלֵיהֶם
  choice: auf ihnen
  rationale: Der Rückbezug auf die Kulthöhen und die räumlich-bildhafte Kraft von עַל werden unmittelbar bewahrt.
- source_word: לֹא בָאוֹת וְלֹא יִהְיֶה
  choice: So etwas ist nie vorgekommen und darf nie wieder geschehen
  rationale: Die Klausel ist textlich und syntaktisch schwierig. Die gewählte Wiedergabe folgt einer verbreiteten Deutung als Aussage, dass dergleichen zuvor nicht geschehen sei und künftig nicht geschehen solle, markiert die Unsicherheit jedoch in einer Fußnote.
theological_decisions:
- issue: Sexuelle Metapher für Jerusalems Götzendienst
  choice: Die ausdrückliche Prostitutionssprache bleibt erhalten.
  alternative: Die Metapher mit „warst untreu“ abschwächen.
  rationale: Ezechiels bewusst schockierende Bildsprache soll nicht durch eine rein deutende und mildere Formulierung ersetzt werden.
- issue: Zeit- und Modalbezug der Schlussklausel
  choice: 'Vergangenheit und untersagte Zukunft: „ist nie vorgekommen und darf nie wieder geschehen“'
  alternative: 'Normative Aussage: „So etwas darf nicht vorkommen und nicht sein.“'
  rationale: Die schwierige Verbindung aus Partizip und Imperfekt kann unterschiedlich aufgefasst werden. Der Haupttext bietet eine sinnvolle zeitliche Lesart; die alternative modale Lesart wird ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Bildsprache. „Kulthöhen“ schafft kultischen Kontext; die schwer verständliche Schlussklausel wird lesbar übersetzt, ohne ihre Unsicherheit zu verschweigen.
