base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/006.yaml
  text: And I passed by you and saw you wallowing in your blood[a], and I said to you, ‘In your blood, live!’ Yes, I said to you, ‘In your blood[b], live!’
translation:
  language: de
  text: 'Und ich ging an dir vorüber und sah dich in deinem Blut strampeln. Da sagte ich zu dir: »In deinem Blut: Lebe!« Und ich sagte zu dir: »In deinem Blut: Lebe!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Zeile »In deinem Blut: Lebe!« wird im Hebräischen nachdrücklich wiederholt. Die Wendung kann im Zusammenhang auch konzessiv verstanden werden: »Auch wenn du in deinem Blut warst: Lebe!«'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: ich ging an dir vorüber
  rationale: עבר mit על bezeichnet hier das Vorübergehen an jemandem; die Formulierung ist im Deutschen natürlich und bewahrt die Bewegung der Szene.
- source_word: וָאֶרְאֵךְ
  choice: und sah dich
  rationale: ראה bedeutet hier schlicht „sehen“; die knappe Wiedergabe folgt dem hebräischen Erzählstil.
- source_word: מִתְבּוֹסֶסֶת
  choice: in deinem Blut strampeln
  rationale: Das Partizip schildert die hilflosen Bewegungen des ausgesetzten Neugeborenen in seinem Blut. „Strampeln“ ist anschaulich und vermeidet den möglichen Beiklang absichtlichen oder genüsslichen Handelns bei „sich wälzen“.
- source_word: בְּדָמָיִךְ
  choice: in deinem Blut
  rationale: Der formale Plural „Blute/Blut“ wird im Deutschen idiomatisch als Singular wiedergegeben; die Präposition und das drastische Bild bleiben erhalten.
- source_word: וָאֹמַר לָךְ
  choice: Da sagte ich zu dir
  rationale: אמר mit indirektem Objekt wird unmittelbar als „zu dir sagen“ wiedergegeben; „Da“ verbindet die Rede natürlich mit dem vorhergehenden Sehen.
- source_word: בְּדָמַיִךְ חֲיִי
  choice: 'In deinem Blut: Lebe!'
  rationale: Die knappe Folge aus Präpositionalphrase und femininem Imperativ bleibt sichtbar. Der Doppelpunkt macht die ungewöhnliche, spannungsreiche Aussage im Deutschen lesbar, ohne die Präposition deutend aufzulösen.
- source_word: וָאֹמַר לָךְ ... חֲיִי (wiederholt)
  choice: 'Ja, ich sagte zu dir: »In deinem Blut: Lebe!«'
  rationale: Die vollständige Wiederholung wird bewahrt; „Ja“ kennzeichnet ihre emphatische Funktion, ohne sie wegzukürzen.
theological_decisions:
- issue: Bedeutung von ב in בְּדָמַיִךְ חֲיִי
  choice: 'Die örtlich formulierte Wendung „In deinem Blut: Lebe!“ wird im Haupttext bewahrt.'
  alternative: '„Obwohl du in deinem Blut lagst: Lebe!“ oder „Trotz deines Blutes: Lebe!“'
  rationale: Die hebräische Wendung ist syntaktisch gedrängt und lässt neben der örtlichen auch eine konzessive Deutung zu. Der Haupttext erhält diese Spannung; die mögliche konzessive Nuance wird in der Fußnote genannt.
- issue: Wiederholung des Lebensbefehls
  choice: Die Aussage wird zweimal vollständig wiedergegeben.
  alternative: Die zweite Aussage als bloße Verstärkung zusammenziehen oder auslassen.
  rationale: Die Wiederholung gehört zum masoretischen Text und verstärkt den göttlichen Lebensruf; sie darf nicht geglättet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper und eindringlicher Rede. „Strampeln“ gibt die hilflose Bewegung eines Neugeborenen natürlich wieder; der Doppelpunkt erhält die abrupte Form des hebräischen Befehls. Der einzige Fußnotenmarker steht nach der wiederholten Gesamtformulierung und erläutert sowohl Wiederholung als auch Deutungsalternative.
