  text: וְ/שַׁבְתִּי֙ אֶת שְׁבִ֣יתְ/הֶ֔ן אֶת שבית סְדֹם֙ וּ/בְנוֹתֶ֔י/הָ וְ/אֶת שבית שֹׁמְר֖וֹן וּ/בְנוֹתֶ֑י/הָ ו/שבית שְׁבִיתַ֖יִ/ךְ בְּ/תוֹכָֽ/הְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/053.yaml
  text: And I will restore their fortunes—the fortunes of Sodom and her daughters[a], and the fortunes of Samaria and her daughters—and your fortunes among them[b],
translation:
  language: de
  text: 'Dann werde ich ihr Geschick wenden[a]: das Geschick Sodoms und ihrer Töchter[b], das Geschick Samarias und ihrer Töchter und dein Geschick mitten unter ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „ihre Gefangenschaft wenden“ oder „ihre Gefangenen zurückbringen“. Die hebräische Wendung bezeichnet häufig die grundlegende Wiederherstellung der Lage eines Volkes.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Töchtern“ sind hier die zu Sodom beziehungsweise Samaria gehörenden oder von ihnen abhängigen Ortschaften gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי ... שְׁבִיתְהֶן / שבית / שְׁבִיתַיִךְ
  choice: Dann werde ich ihr Geschick wenden … und dein Geschick
  rationale: Die Verbindung von שׁוב mit שְׁבִית/שבות ist eine feste hebräische Wendung für die Umkehr eines bedrängten Zustands. „Das Geschick wenden“ gibt diesen umfassenden Wiederherstellungssinn im Deutschen natürlich wieder, ohne ihn auf eine rein räumliche Rückkehr zu verengen.
- source_word: סְדֹם
  choice: Sodom
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: וּבְנוֹתֶיהָ
  choice: und ihrer Töchter
  rationale: Das wörtliche Bild „Töchter“ wird bewahrt; im prophetisch-geografischen Sprachgebrauch bezeichnet es zugehörige oder abhängige Ortschaften.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: בְּתוֹכָהְנָה
  choice: mitten unter ihnen
  rationale: Gibt die räumlich-vergleichende Wendung „in ihrer Mitte“ idiomatisch und mit der im Hebräischen vorhandenen Betonung wieder.
theological_decisions:
- issue: Bedeutung der Wiederherstellungsformel im Gerichts- und Heilswort
  choice: Die Wendung wird mit „das Geschick wenden“ als umfassende Wiederherstellung wiedergegeben.
  alternative: „die Gefangenschaft zurückführen“ oder „die Gefangenen zurückbringen“
  rationale: Da auch Sodom genannt wird, dürfte die Formel mehr als eine konkrete Rückführung aus politischer Gefangenschaft bezeichnen. Die Übersetzung lässt Art und Reichweite der angekündigten Wiederherstellung offen und bewahrt so die Spannung des Textes.
- issue: Bedeutung der „Töchter“ Sodoms und Samarias
  choice: Das familiäre Bild bleibt im Haupttext erhalten.
  alternative: „Ortschaften“, „Städte“ oder „Dörfer“
  rationale: Der hebräische Text verwendet bewusst die Verwandtschaftsmetapher. Eine Fußnote erläutert deren geografische Bedeutung, ohne das Bild im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die nachfolgende Entfaltung von „ihr Geschick“ transparent. Die Wiederholung von „Geschick“ und das Bild der „Töchter“ bewahren die Struktur und Bildsprache des Hebräischen.
