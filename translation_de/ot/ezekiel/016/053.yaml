  verdict: approve
  source_fidelity: Die Übersetzung gibt die hebräische Wiederherstellungsformel שׁוּב ... שְׁבִית angemessen mit „das Geschick wenden“ wieder. Die dreigliedrige Entfaltung (Sodom und ihre Töchter, Samaria und ihre Töchter, dein Geschick) sowie בְּתוֹכָהְנָה mit „mitten unter ihnen“ bleiben erhalten. Die Übersetzung legt weder die konkrete Art der Wiederherstellung noch eine bestimmte geschichtliche Umsetzung fest.
  naturalness: „Dann werde ich ihr Geschick wenden“ ist modernes, würdiges und im biblisch-prophetischen Register natürliches Standarddeutsch. Der Doppelpunkt und die Wiederholung von „Geschick“ machen die Aufzählungsstruktur klar. „Mitten unter ihnen“ ist idiomatisch und wahrt die räumlich-bildliche Ausdrucksweise.
  terminology: „Sodom“ und „Samaria“ entsprechen dem deutschen Bibelgebrauch. „Töchter“ bewahrt bewusst die hebräische Metapher; die Fußnote erläutert sachgerecht die gemeinten abhängigen beziehungsweise zugehörigen Ortschaften. Die Fußnote zu „Geschick“ bildet die im englischen Audit Trail ausgewiesenen lexikalischen Alternativen ab, ohne den Haupttext zu überladen.
