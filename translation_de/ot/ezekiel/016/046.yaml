language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲחוֹתֵ֨/ךְ הַ/גְּדוֹלָ֤ה שֹֽׁמְרוֹן֙ הִ֣יא וּ/בְנוֹתֶ֔י/הָ הַ/יּוֹשֶׁ֖בֶת עַל שְׂמֹאולֵ֑/ךְ וַ/אֲחוֹתֵ֞/ךְ הַ/קְּטַנָּ֣ה מִמֵּ֗/ךְ הַ/יּוֹשֶׁ֨בֶת֙ מִֽ/ימִינֵ֔/ךְ סְדֹ֖ם וּ/בְנוֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/046.yaml
  text: Your older sister is Samaria[a], she and her daughters, who dwell to your left; and your younger sister, who dwells to your right, is Sodom and her daughters.
translation:
  language: de
  text: Deine ältere Schwester ist Samaria[a] mit ihren Töchtern; sie wohnt links von dir. Deine jüngere Schwester, die rechts von dir wohnt, ist Sodom mit ihren Töchtern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aus der Perspektive Jerusalems liegt Samaria im Norden, also links, und Sodom im Süden, also rechts.
    reason: Kulturelle und geografische Erläuterung der körperbezogenen Richtungsangaben.
lexical_decisions:
- source_word: אֲחוֹתֵךְ
  choice: deine Schwester
  rationale: Der wörtliche Verwandtschaftsbegriff wird in der Allegorie auf Städte und ihre Bevölkerungen übertragen. „Schwester“ bewahrt das tragende Familienbild des Kapitels.
- source_word: הַגְּדוֹלָה
  choice: ältere
  rationale: Das Adjektiv bedeutet grundsätzlich „groß“. Im Zusammenhang miteinander verglichener Schwestern ist „ältere“ im Deutschen natürlich und gibt die relationale Familienmetapher angemessen wieder; „größere“ bliebe als mögliche wörtlichere Nuance denkbar.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Im Deutschen übliche Form des Ortsnamens.
- source_word: וּבְנוֹתֶיהָ
  choice: mit ihren Töchtern
  rationale: „Töchter“ bezeichnet hier wohl die zugehörigen Ortschaften oder Gemeinschaften. Die bildhafte Bezeichnung bleibt erhalten; „mit“ bringt die Zusammengehörigkeit von Hauptstadt und Tochterstädten natürlich zum Ausdruck.
- source_word: הַיּוֹשֶׁבֶת
  choice: sie wohnt
  rationale: ישׁב bedeutet hier „wohnen/ansässig sein“. Die feminine Singularform kann sich grammatisch auf Samaria als Hauptbezug beziehen, während ihre Töchter eingeschlossen sind.
- source_word: עַל שְׂמֹאולֵךְ
  choice: links von dir
  rationale: Dies bewahrt die körperbezogene Raumangabe des Hebräischen, statt sie im Haupttext bereits als Himmelsrichtung auszulegen.
- source_word: הַקְּטַנָּה מִמֵּךְ
  choice: deine jüngere Schwester
  rationale: Wörtlich steht eine im Vergleich zu Jerusalem „kleinere“ Schwester. Im familiären Bild ist „jüngere Schwester“ idiomatisch; der hebräische Vergleich מִמֵּךְ wird dabei in der deutschen Komparativform hinreichend ausgedrückt.
- source_word: מִימִינֵךְ
  choice: rechts von dir
  rationale: Die relationale Raumangabe wird wörtlich und in natürlichem Deutsch bewahrt, ohne sie im Haupttext als „südlich“ auszudeuten.
- source_word: סְדֹם
  choice: Sodom
  rationale: Im Deutschen übliche Form des Ortsnamens.
theological_decisions:
- issue: Geografische Bedeutung von links und rechts aus Jerusalems Perspektive
  choice: Die relationalen Angaben „links von dir“ und „rechts von dir“ stehen im Haupttext.
  alternative: „nördlich von dir“ und „südlich von dir“
  rationale: Der hebräische Text verwendet Körperrichtungen und keine ausdrücklichen Himmelsrichtungen. Die Übersetzung erhält dieses Bild; die geografische Bedeutung wird in einer Fußnote erläutert.
- issue: Bedeutung von הַגְּדוֹלָה und הַקְּטַנָּה in der Schwesternmetapher
  choice: „ältere“ und „jüngere“ Schwester
  alternative: „größere“ und „kleinere“ Schwester
  rationale: Die Altersbezeichnungen ergeben im Deutschen ein natürliches Geschwisterbild. Da die hebräischen Adjektive wörtlich auch Größe beziehungsweise Rang bezeichnen können, wird keine weitergehende historische oder theologische Rangordnung in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stadtfamilien-Metapher mit „Schwester“ und „Töchtern“ bleibt erhalten. Der Satz wurde zur besseren Verständlichkeit in zwei Hauptsätze gegliedert, ohne die inhaltliche Zuordnung zu verändern.
