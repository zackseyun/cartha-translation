  yaml_path: translation/ot/ezekiel/016/038.yaml
  text: And I will judge you with the judgments of women who commit adultery and who shed blood[b][a], and I will give you over to blood in wrath and jealousy.
translation:
  language: de
  text: Ich werde dich nach den Urteilen richten, die Ehebrecherinnen und Frauen treffen, die Blut vergießen. In Zorn und Eifersucht werde ich dich dem Blutvergießen preisgeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und ich werde dich Blut, Zorn und Eifersucht geben/machen«. Die knappe hebräische Wendung meint wahrscheinlich ein blutiges Strafgericht beziehungsweise Blutvergießen, das aus Zorn und Eifersucht erfolgt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁפַטְתִּיךְ
  choice: Ich werde über dich … Gericht halten
  rationale: שׁפט bezeichnet hier Gottes richterliches Handeln an Jerusalem. Die Formulierung bewahrt den Zusammenhang mit מִשְׁפְּטֵי und legt das Ergebnis nicht vorschnell nur als Strafmaß fest.
- source_word: מִשְׁפְּטֵי
  choice: nach dem Recht für
  rationale: Der Konstruktplural bezeichnet hier den rechtlichen Maßstab beziehungsweise die entsprechenden Strafurteile. „Nach dem Recht für“ gibt die forensische Bedeutung in natürlichem Deutsch wieder.
- source_word: נֹאֲפוֹת
  choice: Ehebrecherinnen
  rationale: Das feminine Partizip im Plural bezeichnet Frauen, die Ehebruch begehen, und erhält die geschlechtsspezifische Bildsprache des Kapitels.
- source_word: וְשֹׁפְכֹת דָּם
  choice: und Frauen, die Blut vergießen
  rationale: Die parallele feminine Partizipialkonstruktion wird ausdrücklich wiedergegeben. „Blut vergießen“ bewahrt das hebräische Bild und vermeidet die engere Festlegung auf eine bestimmte Form der Tötung.
- source_word: וּנְתַתִּיךְ דַּם
  choice: werde ich dich dem Blutvergießen preisgeben
  rationale: Die knappe Verbindung von נתן mit דם kündigt ein blutiges Geschick beziehungsweise eine Blutstrafe an. „Dem Blutvergießen preisgeben“ ist im Deutschen verständlich, wahrt Gottes richterliche Handlung und vermeidet das unnatürliche „dich zu Blut machen“.
- source_word: חֵמָה
  choice: Zorn
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Zorn“ passt zum würdevollen prophetischen Gerichtsregister, ohne die Intensität unnötig auszuschmücken.
- source_word: וְקִנְאָה
  choice: und Eifersucht
  rationale: Im ehelich-bundestheologischen Bildzusammenhang bezeichnet קִנְאָה eifersüchtigen Eifer angesichts der Untreue. „Eifersucht“ hält die Verbindung zur Ehemetaphorik ausdrücklich fest.
theological_decisions:
- issue: Verbindung von ehelicher Eifersucht und göttlichem Gericht
  choice: In Zorn und Eifersucht werde ich dich dem Blutvergießen preisgeben.
  alternative: Ich werde dich zu Blut des Zorns und der Eifersucht machen.
  rationale: Die Übersetzung bewahrt sowohl die eheliche Bundesmetaphorik als auch Gottes richterliche Verantwortung. Sie mildert die Härte des angekündigten Gerichts nicht, vermeidet aber eine im Deutschen missverständliche oder ungrammatische Nachbildung der knappen hebräischen Konstruktion.
- issue: Reichweite des Ausdrucks für blutige Schuld
  choice: Frauen, die Blut vergießen
  alternative: Mörderinnen
  rationale: Die weitere Formulierung erhält die konkrete Blutmetaphorik des Hebräischen und legt die bezeichnete Schuld nicht enger fest, als der Ausgangstext es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlich forensischem und prophetischem Klang. Die weiblichen Bezeichnungen bleiben wegen der Jerusalem-Allegorie erhalten. Der schwer verständliche hebräische Ausdruck וּנְתַתִּיךְ דַּם wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
