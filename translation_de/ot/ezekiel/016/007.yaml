  text: רְבָבָ֗ה כְּ/צֶ֤מַח הַ/שָּׂדֶה֙ נְתַתִּ֔י/ךְ וַ/תִּרְבִּי֙ וַֽ/תִּגְדְּלִ֔י וַ/תָּבֹ֖אִי בַּ/עֲדִ֣י עֲדָיִ֑ים שָׁדַ֤יִם נָכֹ֨נוּ֙ וּ/שְׂעָרֵ֣/ךְ צִמֵּ֔חַ וְ/אַ֖תְּ עֵרֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/007.yaml
  text: I made you countless like the growth of the field[a], and you multiplied and grew up and came to full adornment. Your breasts were formed and your hair had grown[d][c][b], yet you were naked and bare.
translation:
  language: de
  text: Ich ließ dich so zahlreich werden wie das Gewächs des Feldes[a]. Du nahmst zu, wurdest groß und gelangtest zu vollem Schmuck[b]. Deine Brüste waren ausgebildet[c], und dein Haar wuchs; doch du warst nackt und bloß[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie die Pflanzen« beziehungsweise »wie der Pflanzenwuchs des Feldes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »du kamst zum Schmuck der Schmuckstücke«. Die schwierige Wendung kann volle Schönheit oder Reife, möglicherweise auch das Alter für Schmuck, bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »Deine Brüste entwickelten sich« beziehungsweise »waren fest ausgebildet«.'
    reason: lexical_alternative
  - marker: d
    text: Das hebräische Wortpaar »nackt und bloß« verstärkt das Bild völliger Nacktheit und Schutzlosigkeit.
    reason: clarification
lexical_decisions:
- source_word: רְבָבָה ... נְתַתִּיךְ
  choice: Ich ließ dich so zahlreich werden
  rationale: רְבָבָה bezeichnet eine sehr große Zahl; zusammen mit נתן ist die Wendung kausativ zu verstehen. Die deutsche Formulierung gibt das natürliche Werden zahlreich wieder, ohne einen starren Zahlenwert einzutragen.
- source_word: כְּצֶמַח הַשָּׂדֶה
  choice: wie das Gewächs des Feldes
  rationale: צֶמַח kann Gewächs, Pflanzenwuchs oder Wachstum bezeichnen. „Gewächs des Feldes“ bewahrt das landwirtschaftliche Bild und die mögliche kollektive Bedeutung.
- source_word: וַתִּרְבִּי וַתִּגְדְּלִי
  choice: Du nahmst zu, wurdest groß
  rationale: Die beiden Verben bezeichnen Zunahme und Wachstum beziehungsweise Heranreifen. Die parallele deutsche Wiedergabe wahrt die Abfolge, ohne sie unnötig auf zahlenmäßige Vermehrung festzulegen.
- source_word: וַתָּבֹאִי בַּעֲדִי עֲדָיִים
  choice: und gelangtest zu voller Schönheit
  rationale: Die schwierige Wendung lautet wörtlich etwa „du kamst zum Schmuck der Schmuckstücke“. Im Zusammenhang bezeichnet sie wahrscheinlich voll entfaltete Schönheit oder Reife. „Volle Schönheit“ ist verständlich, bewahrt aber durch die Fußnote die genuine Mehrdeutigkeit.
- source_word: שָׁדַיִם נָכֹנוּ
  choice: Deine Brüste entwickelten sich
  rationale: כון im Nifal bedeutet hier, dass die Brüste ausgebildet beziehungsweise entwickelt waren; die Formulierung passt zur geschilderten körperlichen Reifung.
- source_word: וּשְׂעָרֵךְ צִמֵּחַ
  choice: und dein Haar wuchs
  rationale: צמח bedeutet sprießen oder wachsen. „Dein Haar wuchs“ ist natürlich und lässt offen, ob allgemein Körperbehaarung oder speziell Schamhaar gemeint ist.
- source_word: עֵרֹם וְעֶרְיָה
  choice: nackt und bloß
  rationale: Das hebräische Wortpaar verstärkt das Bild vollständiger Nacktheit und Schutzlosigkeit. Die feste deutsche Paarformel erhält diese Intensivierung.
theological_decisions:
- issue: Deutung von בַּעֲדִי עֲדָיִים innerhalb des Bildes vom Heranreifen Jerusalems
  choice: volle Schönheit
  alternative: voller Schmuck; Schmuck der Schmuckstücke; Alter für Schmuck
  rationale: Die Wendung ist selten und umstritten. Der Haupttext drückt die erreichte Reife und Schönheit aus, ohne ausdrücklich eine Heiratsfähigkeit, Menstruation oder Brautschmückung festzulegen; die Fußnote dokumentiert die Bildsprache und Alternativen.
- issue: Referenz von שְׂעָרֵךְ im Pubertätsbild
  choice: dein Haar
  alternative: dein Schamhaar
  rationale: Das Hebräische sagt lediglich „dein Haar“. Der Zusammenhang kann Körper- oder Schambehaarung nahelegen, doch eine Spezifizierung im Haupttext würde die lexikalische Offenheit unnötig einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weiblichen Formen entsprechen der Personifikation Jerusalems. Der Vers beschreibt körperliches Heranreifen offen, aber nicht unnötig explizit; schwierige hebräische Bildsprache wird im Haupttext lesbar wiedergegeben und in den Fußnoten transparent gehalten.
