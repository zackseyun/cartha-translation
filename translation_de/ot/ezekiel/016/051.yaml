source:
  edition: WLC
  text: וְ/שֹׁ֣מְר֔וֹן כַּ/חֲצִ֥י חַטֹּאתַ֖יִ/ךְ לֹ֣א חָטָ֑אָה וַ/תַּרְבִּ֤י אֶת תּוֹעֲבוֹתַ֨יִ/ךְ֙ מֵ/הֵ֔נָּה וַ/תְּצַדְּקִי֙ אֶת אחות/ך בְּ/כָל תּוֹעֲבוֹתַ֖יִ/ךְ אֲשֶׁ֥ר עשיתי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/051.yaml
  text: And Samaria did not sin half as much as you; you multiplied your abominations more than they[a], and by all your abominations that you committed, you made your sisters appear righteous.
translation:
  language: de
  text: Und Samaria hat nicht halb so viel gesündigt wie du. Du hast mehr Gräueltaten begangen als deine Schwestern; durch all deine Gräueltaten, die du begangen hast, hast du deine Schwestern als gerecht erscheinen lassen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »hast du deine Schwestern gerechtfertigt«. Gemeint ist im Zusammenhang, dass Jerusalems größere Schuld sie im Vergleich gerecht erscheinen ließ.'
    reason: lexikalische Alternative und Erläuterung der vergleichenden Aussage
lexical_decisions:
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Die übliche deutsche Namensform; die Stadt steht im Zusammenhang personifiziert für das Nordreich.
- source_word: כַּחֲצִי חַטֹּאתַיִךְ לֹא חָטָאָה
  choice: hat nicht halb so viel gesündigt wie du
  rationale: Gibt die hebräische Vergleichskonstruktion mit »Hälfte« natürlich und eng am Wortlaut wieder.
- source_word: וַתַּרְבִּי אֶת תּוֹעֲבוֹתַיִךְ מֵהֵנָּה
  choice: Du hast mehr abscheuliche Taten begangen als deine Schwestern
  rationale: רבה bezeichnet hier eine mengenmäßige Steigerung; תּוֹעֵבָה wird als starke moralisch-religiöse Wertung verständlich wiedergegeben. Das feminine Pluralpronomen verweist im Kontext auf die Schwesterstädte.
- source_word: וַתְּצַדְּקִי
  choice: hast ... als gerecht erscheinen lassen
  rationale: 'Die Piel-Form von צדק beschreibt hier die vergleichende Wirkung: Jerusalems größere Schuld lässt die Schwestern gerecht erscheinen, ohne notwendig einen tatsächlichen Freispruch auszusagen.'
- source_word: אֶת אחותך
  choice: deine Schwestern
  rationale: Der Kontext nennt Samaria und Sodom als die beiden Schwestern Jerusalems und verlangt daher den Pluralsinn.
- source_word: בְּכָל תּוֹעֲבוֹתַיִךְ אֲשֶׁר עשיתי
  choice: durch all deine abscheulichen Taten, die du begangen hast
  rationale: בְּ wird instrumental verstanden. Trotz der auffälligen überlieferten Schreibung des letzten Verbs ergibt der Zusammenhang eindeutig einen Rückbezug auf die von Jerusalem begangenen Taten.
theological_decisions:
- issue: Bedeutung von »du hast deine Schwestern gerechtfertigt«
  choice: vergleichsweise als gerecht erscheinen lassen
  alternative: deine Schwestern gerechtfertigt / ihnen Recht gegeben
  rationale: 'Die Aussage ist zugespitzte Vergleichsrhetorik: Jerusalems größere Verfehlungen lassen Samaria und Sodom im Vergleich gerecht wirken. Die Übersetzung vermeidet es, daraus einen tatsächlichen göttlichen Freispruch zu machen, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Abscheuliche Taten« bewahrt die Schärfe von תּוֹעֵבָה, ist für heutige Leser jedoch natürlicher als das substantivische »Gräuel«. Die direkte Anrede Jerusalems und die provozierende Vergleichsaussage bleiben erhalten.
