base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/005.yaml
  text: No eye pitied you enough to do for you even one of these things[a], to have compassion on you; instead, you were thrown out into the open field in loathing of your life on the day you were born.
translation:
  language: de
  text: Kein Auge blickte mitleidig auf dich, um dir aus Erbarmen auch nur eines von diesen Dingen zu tun. Vielmehr wurdest du am Tag deiner Geburt aus Abscheu vor deinem Leben[a] auf das offene Feld geworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als auf die Person des Neugeborenen bezogene Deutung: „weil du verabscheut wurdest“. Die hebräische Wendung ist knapp; „dein Leben“ kann hier auch die Person des Neugeborenen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסָה עָלַיִךְ עַיִן
  choice: Kein Auge blickte mitleidig auf dich
  rationale: Die Formulierung bewahrt das hebräische Bild vom Auge und gibt חוס als mitleidiges, schonendes Erbarmen wieder. „Blickte mitleidig auf dich“ klingt im heutigen Deutsch natürlicher als „kein Auge hatte Mitleid“.
- source_word: לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה
  choice: um dir … auch nur eines von diesen Dingen zu tun
  rationale: Der Rückverweis gilt den in Vers 4 genannten Handlungen der Säuglingspflege. „Auch nur eines“ bringt im negativen Satz den minimierenden Sinn von אַחַת מֵאֵלֶּה klar zum Ausdruck.
- source_word: לְחֻמְלָה עָלָיִךְ
  choice: aus Erbarmen
  rationale: Die Wendung bezeichnet das mitfühlende Motiv für die unterlassenen Pflegehandlungen. „Erbarmen“ entspricht חֻמְלָה, ohne zusätzliche bundestheologische Bedeutungen einzutragen.
- source_word: וַתֻּשְׁלְכִי
  choice: du wurdest … geworfen
  rationale: Die passive Verbform wird unmittelbar wiedergegeben; „geworfen“ erhält die Härte der geschilderten Aussetzung.
- source_word: אֶל־פְּנֵי הַשָּׂדֶה
  choice: auf das freie Feld
  rationale: Wörtlich ist von der Fläche beziehungsweise Vorderseite des Feldes die Rede. „Auf das freie Feld“ vermittelt im Deutschen die schutzlose Aussetzung.
- source_word: בְּגֹעַל נַפְשֵׁךְ
  choice: aus Abscheu vor deinem Leben
  rationale: Die kompakte Wendung verbindet גֹעַל, „Abscheu/Verabscheuung“, mit נֶפֶשׁ, das „Leben“, „Person“ oder das lebende Selbst bezeichnen kann. Die Hauptfassung bewahrt diese ungewöhnliche Verbindung, während die Fußnote eine idiomatischere Deutung nennt.
- source_word: בְּיוֹם הֻלֶּדֶת אֹתָךְ
  choice: am Tag deiner Geburt
  rationale: Die knappe deutsche Zeitangabe gibt den Zeitpunkt unmittelbar und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild vom mitleidigen Auge und die Härte des Ausgesetztwerdens bleiben erhalten; die ungewöhnliche und mehrdeutige Verbindung von „Abscheu“ und „Leben/Person“ wird nicht stillschweigend geglättet.
