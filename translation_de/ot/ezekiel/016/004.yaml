base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/004.yaml
  text: And as for your birth[a], on the day you were born your cord was not cut, and you were not washed with water for cleansing; you were not rubbed with salt[c][b], and you were not wrapped in cloths.
translation:
  language: de
  text: 'Bei deiner Geburt: Am Tag, als du geboren wurdest, wurde deine Nabelschnur nicht durchtrennt. Du wurdest nicht mit Wasser gewaschen, um dich zu reinigen[a]; du wurdest nicht mit Salz eingerieben[b] und nicht in Tücher gewickelt[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um dich abzureiben“ beziehungsweise „deine Haut zu glätten“. Das hebräische Wort ist selten; unsicher ist, ob hier vor allem das Reinigen oder das Abreiben der Haut des Neugeborenen gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: Damit ist ein alter Brauch der Säuglingspflege gemeint, bei dem ein Neugeborenes mit Salz eingerieben wurde.
    reason: cultural_note
  - marker: c
    text: 'Oder: „nicht gepuckt“ beziehungsweise „nicht gewickelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלְדוֹתַיִךְ
  choice: deine Geburt
  rationale: Der formal plurale Ausdruck bezeichnet hier idiomatisch die Geburt beziehungsweise deren Umstände. Der folgende Zeitsatz und die Versorgung des Neugeborenen legen die konkrete Wiedergabe „Geburt“ nahe.
- source_word: בְּיוֹם הוּלֶּדֶת אֹתָךְ
  choice: An dem Tag, als du geboren wurdest
  rationale: Gibt den temporalen Sinn natürlich und eng am Hebräischen wieder.
- source_word: שָׁרֵךְ
  choice: deine Nabelschnur
  rationale: Im Zusammenhang mit der Geburt ist die Nabelschnur gemeint. Die ausdrückliche Bezeichnung ist im modernen Deutschen klarer als bloß „Schnur“.
- source_word: לֹא כָרַּת
  choice: wurde ... nicht durchtrennt
  rationale: Das hebräische Verb bedeutet schneiden beziehungsweise abschneiden. „Durchtrennt“ ist für die Nabelschnur natürlich und wahrt die Aussage, dass die übliche Erstversorgung unterblieb.
- source_word: רֻחַצְתְּ בְמַיִם
  choice: Du wurdest nicht mit Wasser gewaschen
  rationale: Formnahe und zugleich idiomatische Wiedergabe der Waschung eines Neugeborenen.
- source_word: לְמִשְׁעִי
  choice: um dich zu reinigen
  rationale: Das seltene Wort wird im Zusammenhang mit dem Waschen am ehesten als Zweckangabe verstanden. Da auch Reiben oder Glätten vertreten wird, bleibt die Unsicherheit in einer Fußnote sichtbar.
- source_word: הָמְלֵחַ ... הֻמְלַחַתְּ
  choice: du wurdest nicht mit Salz eingerieben
  rationale: Die Formulierung vermittelt die antike Praxis der Behandlung eines Neugeborenen verständlicher als das im Deutschen missverständliche „gesalzen“.
- source_word: הָחְתֵּל ... חֻתָּלְתְּ
  choice: nicht in Windeln gewickelt
  rationale: Das Verb bezeichnet das Einwickeln beziehungsweise Wickeln eines Säuglings. Die Wendung ist modernes, allgemein verständliches Deutsch, ohne eine bestimmte Wickeltechnik vorauszusetzen.
