id: EZK.16.62
reference: Ezekiel 16:62
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/הֲקִימוֹתִ֥י אֲנִ֛י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/062.yaml
  text: And I myself will establish my covenant with you, and you will know that I am Yahweh.
translation:
  language: de
  text: Und ich selbst werde meinen Bund mit dir aufrichten, und du wirst erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: werde … aufrichten
  rationale: Das Hifil von קום bezeichnet hier, dass Gott den Bund bestehen lässt bzw. aufrichtet. „Aufrichten“ ist im Deutschen eine natürliche und in biblischer Bundessprache etablierte Wiedergabe, ohne die Bedeutung auf bloßes Bestätigen einzuengen.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das selbstständige Personalpronomen verstärkt das bereits in der Verbform enthaltene Subjekt. „Ich selbst“ bewahrt diesen Nachdruck idiomatisch.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: בְּרִית ist der übliche hebräische Ausdruck für einen Bund, besonders für die von Gott bestimmte Beziehung zu Menschen.
- source_word: אִתָּךְ
  choice: mit dir
  rationale: Die Präposition bezeichnet die Bundesbeziehung. Das feminine Singularsuffix bezieht sich im Kontext auf Jerusalem; im Deutschen muss das Pronomen diese grammatische Information nicht eigens markieren.
- source_word: וְיָדַעַתְּ
  choice: und du wirst erkennen
  rationale: Das Qal-Perfekt mit וְ trägt im prophetischen Zusammenhang Zukunfts- bzw. Folgesinn. „Erkennen“ gibt das umfassendere, erfahrungsbezogene Wissen von ידע in dieser Erkenntnisformel angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Nachdruck des ausdrücklichen Pronomens אֲנִי
  choice: ich selbst
  alternative: ich; ich bin es, der
  rationale: Die Wiedergabe erhält den im Hebräischen gesetzten Nachdruck auf Gottes eigenem Handeln, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Bedeutungsumfang von וְיָדַעַתְּ
  choice: du wirst erkennen
  alternative: du wirst wissen
  rationale: „Erkennen“ passt zur wiederkehrenden Erkenntnisformel im Ezechielbuch und kann sowohl Einsicht als auch erfahrungsbezogene Anerkenntnis ausdrücken, ohne genauer festzulegen, wie diese Erkenntnis zustande kommt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Zweigliedrigkeit; „ich selbst“ erhält den Nachdruck, und „Bund aufrichten“ bewahrt die traditionelle Bundessprache, ohne altertümlich zu wirken.
