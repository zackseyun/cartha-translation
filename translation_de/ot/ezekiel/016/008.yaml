base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/008.yaml
  text: When I passed by you and saw you[a], behold, your time was the time for love. So I spread the edge of my garment over you and covered your nakedness. I swore myself to you and entered into a covenant with you, declares the Lord GOD[b], and you became mine.
translation:
  language: de
  text: Als ich an dir vorüberging und dich sah, siehe, da war deine Zeit die Zeit der Liebe.[a] Da breitete ich den Saum meines Gewandes[b] über dich und bedeckte deine Blöße. Ich schwor dir einen Eid und trat mit dir in einen Bund – Ausspruch Yahwehs, des Herrn –, und du wurdest mein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zeit der Liebe“ kann auch „Zeit der Liebkosungen“ oder „Zeit des Liebesspiels“ bedeuten; das hebräische Wort hat im Rahmen des Ehebildes romantische und erotische Obertöne.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „meinen Flügel“. Das hebräische Wort kann den Flügel sowie den Rand oder Saum eines Gewandes bezeichnen; hier erinnert die Geste an ehelichen Schutz und Anspruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: Als ich an dir vorüberging
  rationale: עבר mit על bezeichnet hier das Vorübergehen an jemandem. Ein „wieder“ wird nicht ergänzt, da es im hebräischen Wortlaut nicht ausdrücklich steht.
- source_word: וָאֶרְאֵךְ וְהִנֵּה
  choice: und dich sah, siehe
  rationale: ראה wird direkt mit „sehen“ wiedergegeben; הִנֵּה behält durch „siehe“ seine lebhafte, aufmerksamkeitslenkende Kraft.
- source_word: עִתֵּךְ עֵת דֹּדִים
  choice: deine Zeit die Zeit der Liebe
  rationale: דֹּדִים kann Liebe, Liebkosungen oder erotische Liebe bezeichnen. Die Formulierung bewahrt sowohl die Wiederholung von עֵת als auch die romantisch-erotische Offenheit des Ehebildes.
- source_word: וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ
  choice: Da breitete ich den Saum meines Gewandes über dich
  rationale: כָּנָף bedeutet wörtlich „Flügel“, kann aber auch den Rand oder Saum eines Gewandes bezeichnen. Im Heiratsbild ist „Saum meines Gewandes“ im Deutschen verständlich und erhält die konkrete symbolische Handlung.
- source_word: וָאֲכַסֶּה עֶרְוָתֵךְ
  choice: und bedeckte deine Blöße
  rationale: עֶרְוָה bezeichnet die entblößte Nacktheit, oft einschließlich ihrer Schamdimension. „Blöße“ ist knapp, würdig und bildgetreu.
- source_word: וָאֶשָּׁבַע לָךְ
  choice: Ich schwor dir einen Eid
  rationale: Die Wendung bezeichnet einen gegenüber der Frau geleisteten Schwur. „Einen Eid schwören“ ist natürliches Deutsch und lässt den ehelichen Verpflichtungscharakter aus dem Zusammenhang hervorgehen, ohne ihn in den Wortlaut hineinzuschreiben.
- source_word: וָאָבוֹא בִבְרִית אֹתָךְ
  choice: und trat mit dir in einen Bund
  rationale: בוא בברית ist die feste Wendung für das Eintreten in ein Bundesverhältnis. Die gewählte Form bewahrt den formellen und wechselseitigen Charakter.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם wird als prophetische Bekräftigungsformel mit „spricht“ wiedergegeben; אֲדֹנָי bleibt „der Herr“, während der Gottesname יְהוִה als „Yahweh“ erscheint.
- source_word: וַתִּהְיִי לִי
  choice: und du wurdest mein
  rationale: Wörtlich steht „du wurdest mir/zu mir“. „Du wurdest mein“ gibt die eheliche Bundeszugehörigkeit wieder, ohne das nicht ausdrücklich genannte Wort „Frau“ einzufügen.
theological_decisions:
- issue: Ehe-, Sexual- und Bundesmetaphorik
  choice: Die eheliche Bildsprache wird mit „Zeit der Liebe“, „Blöße“, Eid und Bund zurückhaltend, aber erkennbar bewahrt.
  alternative: Die erotische Dimension durch „Zeit des Liebesspiels“ stärker hervorheben oder sie durch eine rein gefühlsbezogene Formulierung abschwächen.
  rationale: דֹּדִים besitzt romantische und erotische Obertöne, während der Vers zugleich eine Bundesbeziehung schildert. Die Übersetzung soll weder euphemistisch glätten noch expliziter werden als der Ausgangstext.
- issue: Symbolik von כָּנָף
  choice: Im Haupttext steht „Saum meines Gewandes“, die wörtliche Bedeutung „Flügel“ wird in der Fußnote bewahrt.
  alternative: „Meinen Flügel über dich“ unmittelbar in den Haupttext setzen.
  rationale: Beide Bedeutungsaspekte gehören zum hebräischen Bild. Der Haupttext soll die wahrscheinlich gemeinte Gewandhandlung verständlich machen, ohne die bildhafte Mehrdeutigkeit zu verschweigen.
- issue: Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Diese Wiedergabe unterscheidet den Titel אֲדֹנָי vom Eigennamen יְהוִה und macht beide Bestandteile des hebräischen Ausdrucks sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst gehobenen, aber allgemein verständlichen Wörtern wie „siehe“, „Blöße“ und „Bund“. Die weiblichen Singularformen des Hebräischen werden durch die direkte Anrede „du“ natürlich wiedergegeben. Die Satzfolge bleibt eng am hebräischen Erzählgang.
