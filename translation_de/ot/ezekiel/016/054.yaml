  text: damit du deine Schande trägst und dich wegen all dessen schämst, was du getan hast[a], wenn du sie tröstest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem du sie tröstest“; auch möglich: „dadurch, dass du sie tröstest“. Die hebräische Wendung lässt mehrere eng verwandte Deutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet einen Zweck oder ein Ergebnis ein; „damit“ gibt diese Funktion im Deutschen knapp und natürlich wieder.
- source_word: תִּשְׂאִי
  choice: du ... trägst
  rationale: נשׂא bedeutet mit כְּלִמָּה idiomatisch, Schande zu tragen beziehungsweise auf sich zu nehmen.
- source_word: כְלִמָּתֵךְ
  choice: deine Schande
  rationale: כְּלִמָּה bezeichnet Schande, Beschämung oder Entehrung; „Schande“ bewahrt die öffentliche Dimension und vermeidet eine unnötige Wiederholung von „Scham“ vor dem folgenden Verb.
- source_word: וְנִכְלַמְתְּ
  choice: und dich ... schämst
  rationale: Der Niphal von כלם bezeichnet hier das Beschämtsein; die reflexive deutsche Form ist verständlich und idiomatisch.
- source_word: מִכֹּל אֲשֶׁר עָשִׂית
  choice: wegen all dessen, was du getan hast
  rationale: מִן kann nach einem Verb des Sich-Schämens den Grund bezeichnen; „wegen“ macht diesen Bezug im Deutschen klar.
- source_word: בְּנַחֲמֵךְ
  choice: indem du ... zum Trost wirst
  rationale: Die mit בְּ eingeleitete Infinitivkonstruktion kann modal, kausal oder temporal verstanden werden. „Indem“ gibt die enge Begleitumstandsbeziehung wieder, ohne sie ausschließlich zeitlich festzulegen.
- source_word: אֹתָן
  choice: ihnen
  rationale: Das feminine Pluralpronomen verweist im Zusammenhang auf die zuvor genannten Schwestern beziehungsweise Städte; mit „zum Trost werden“ verlangt das Deutsche den Dativ.
theological_decisions:
- issue: Jerusalems Verhältnis zu den anderen Frauen beziehungsweise Städten im Wiederherstellungszusammenhang
  choice: Jerusalems Beschämung steht in engem Zusammenhang damit, dass sie ihnen zum Trost wird.
  alternative: Die Wendung kann auch zeitlich als „wenn du sie tröstest“ oder instrumental als „dadurch, dass du sie tröstest“ verstanden werden.
  rationale: Der Kontext von Hesekiel 16,53–55 blickt auf die gemeinsame Wiederherstellung voraus. Die Übersetzung wahrt die Spannung, dass diese Umkehr Jerusalems Scham vertieft, ohne die syntaktische Beziehung von בְּנַחֲמֵךְ abschließend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Singularanrede des hebräischen Textes wird mit „du“ beibehalten. „Zum Trost werden“ klingt leicht gehoben, bleibt aber allgemein verständlich und passt zum prophetischen Register.
