  text: וְ/לֹ֤א בְ/דַרְכֵי/הֶן֙ הָלַ֔כְתְּ וּ/בְ/תוֹעֲבֽוֹתֵי/הֶ֖ן עשיתי כִּ/מְעַ֣ט קָ֔ט וַ/תַּשְׁחִ֥תִי מֵ/הֵ֖ן בְּ/כָל דְּרָכָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/047.yaml
  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
translation:
  language: de
  text: Doch du bist nicht nur auf ihren Wegen gegangen und hast ihre Gräuel verübt; als wäre das noch zu wenig gewesen,[a] hast du auf all deinen Wegen noch verderblicher gehandelt als sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wie eine ganz geringe Sache«. Die einleitende hebräische Verneinung kann auch auf beide Verben bezogen werden: »Du bist nicht auf ihren Wegen gegangen und hast ihre Gräuel nicht verübt.« Im Zusammenhang wird sie häufig als rhetorische Einschränkung verstanden: Jerusalem begnügte sich nicht damit, ihnen gleichzutun, sondern übertraf sie.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: בְּדַרְכֵיהֶן ... הָלַכְתְּ
  choice: auf ihren Wegen gegangen
  rationale: Die im Hebräischen geläufige Verbindung »auf einem Weg gehen« bezeichnet die Lebensführung. Die deutsche Wiedergabe bewahrt das Weg-Motiv und klingt zugleich natürlich.
- source_word: תּוֹעֵבָה
  choice: Gräuel
  rationale: »Gräuel« gibt die starke kultisch-moralische Wertung des in Ezechiel häufigen Ausdrucks wieder und ist im Deutschen als biblisch geprägtes, weiterhin verständliches Wort angemessen.
- source_word: וּבְתוֹעֲבוֹתֵיהֶן עשיתי
  choice: und hast ihre Gräuel verübt
  rationale: Im Kontext ist die feminine Singularform der 2. Person gemeint. עשה mit תועבות bezeichnet das Begehen oder Verüben verabscheuungswürdiger Taten; »verübt« ist natürlicher als das wörtliche »getan«.
- source_word: כִּמְעַט קָט
  choice: Als wäre das noch zu wenig gewesen
  rationale: 'Die knappe, elliptische Wendung leitet im Zusammenhang eine rhetorische Steigerung ein: Jerusalem begnügte sich nicht damit, den anderen gleichzukommen, sondern übertraf sie. Eine wörtlichere Wiedergabe wird in der Fußnote genannt.'
- source_word: וַתַּשְׁחִתִי מֵהֵן
  choice: hast du noch verderblicher gehandelt als sie
  rationale: שׁחת bezeichnet hier sittliche Verderbtheit; מן markiert den Vergleich. Die Formulierung gibt sowohl die moralische Aussage als auch die Steigerung gegenüber den anderen Städten klar wieder.
- source_word: בְּכָל דְּרָכָיִךְ
  choice: auf all deinen Wegen
  rationale: Die Wiederholung von »Wegen« erhält das Leitwort דרך und rahmt die Aussage über Jerusalems gesamte Lebensführung.
theological_decisions:
- issue: Verhältnis von Jerusalems Schuld zur Schuld Samarias und Sodoms
  choice: Jerusalem ahmte ihre verwerfliche Lebensweise nicht nur nach, sondern übertraf sie an Verderbtheit.
  alternative: Jerusalem ging zunächst nicht auf ihren Wegen, wurde dann aber auf andere Weise verderbter als sie.
  rationale: 'Die Folge von לֹא, כִּמְעַט קָט und dem ausdrücklichen Vergleich מֵהֵן wird im Kontext am besten als rhetorische Steigerung verstanden: »nicht nur …; als wäre das zu wenig …«. Da die eröffnende Verneinung auch direkter aufgefasst werden kann, bleibt diese echte syntaktische Mehrdeutigkeit in Fußnote [a] sichtbar.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das wiederholte Bild der »Wege« und die Schärfe von »Gräuel« bleiben erhalten; die elliptische hebräische Steigerung wird verständlich formuliert, ohne ihre alternative syntaktische Deutung zu verschweigen.
