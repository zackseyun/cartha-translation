  yaml_path: translation/ot/ezekiel/016/040.yaml
  text: They will bring up an assembly against you[b][a], and they will stone you and cut you down with their swords.
translation:
  language: de
  text: Sie werden eine Versammlung gegen dich aufbieten[a], dich steinigen und dich mit ihren Schwertern zerstückeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Versammlung gegen dich heranführen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit ihren Schwertern aufschlitzen“. Das hebräische Verb bezeichnet gewaltsames Aufschneiden oder Zerteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלוּ עָלַיִךְ קָהָל
  choice: Sie werden eine Versammlung gegen dich aufbieten
  rationale: Der Hifil von עלה bezeichnet hier das Heranführen bzw. Aufbieten einer feindlichen Versammlung. „Aufbieten“ gibt den veranlassenden Sinn und die gegen die personifizierte Stadt gerichtete Handlung im Deutschen natürlich wieder.
- source_word: קָהָל
  choice: Versammlung
  rationale: קָהָל bezeichnet eine zusammengerufene Gruppe; „Versammlung“ bewahrt den formellen, öffentlichen Charakter, ohne den Ausdruck unnötig religiös festzulegen.
- source_word: וְרָגְמוּ אוֹתָךְ בָּאָבֶן
  choice: dich steinigen
  rationale: רגם mit בָּאָבֶן ist die übliche Wendung für die Steinigung. Das deutsche Verb „steinigen“ enthält das Mittel bereits, sodass „mit Steinen“ redundant wäre.
- source_word: וּבִתְּקוּךְ
  choice: dich zerstückeln
  rationale: בתק bezeichnet gewaltsames Aufschneiden oder Zerteilen. „Zerstückeln“ wahrt die drastische Körpergewalt deutlicher als das im Deutschen mehrdeutige „niederhauen“.
- source_word: בְּחַרְבוֹתָם
  choice: mit ihren Schwertern
  rationale: Die Präposition bezeichnet das Werkzeug; Numerus und Possessivsuffix werden unmittelbar wiedergegeben.
theological_decisions:
- issue: Charakter des Strafbildes
  choice: Die öffentliche, gewaltsame Bestrafung Jerusalems als personifizierter Frau wird ungemildert wiedergegeben.
  alternative: Das Bild ausschließlich als militärischen Angriff oder ausschließlich als förmliche Hinrichtung auslegen.
  rationale: Versammlung, Steinigung und Schwerter verbinden gerichtliche und militärische Züge. Die Übersetzung wahrt diese Spannung, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufbieten“ erhält den formellen und feindlichen Charakter der versammelten Gruppe; „zerstückeln“ bewahrt bewusst die Härte des hebräischen Gewaltbildes.
