  text: הָ/אִשָּׁ֖ה הַ/מְּנָאָ֑פֶת תַּ֣חַת אִישָׁ֔/הּ תִּקַּ֖ח אֶת זָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/032.yaml
  text: The adulterous wife takes strangers instead of her husband[a].
translation:
  language: de
  text: Die ehebrecherische Frau nimmt sich fremde Männer statt ihres Mannes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Frau, die Ehebruch begeht, nimmt sich andere Männer statt ihres Mannes.«'
    reason: Das hebräische Partizip kann verbal als »die Ehebruch begeht« wiedergegeben werden. »Andere Männer« gibt זָרִים kontextbezogen wieder, während die Hauptfassung mit »fremde Männer« die Bedeutung von Außenstehenden/Fremden enger abbildet.
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: Frau
  rationale: Das Substantiv kann »Frau« oder »Ehefrau« bedeuten. Der Zusatz »ihres Mannes« macht die eheliche Beziehung bereits deutlich; »Frau« bewahrt daher die natürliche deutsche Ausdrucksweise und die lexikalische Breite.
- source_word: הַמְּנָאָפֶת
  choice: ehebrecherische
  rationale: Das Partizip kennzeichnet die Frau durch ihr ehebrecherisches Handeln. Das attributive Adjektiv gibt diese Form knapp und in modernem Deutsch wieder.
- source_word: תַּחַת
  choice: anstelle
  rationale: Die Präposition bezeichnet hier Ersatz beziehungsweise Austausch, nicht eine räumliche Lage.
- source_word: אִישָׁהּ
  choice: ihres Mannes
  rationale: אִישׁ mit dem Suffix der 3. Person Singular feminin bezeichnet im ehelichen Zusammenhang ihren Ehemann; »ihr Mann« ist die natürliche deutsche Wiedergabe.
- source_word: תִּקַּח
  choice: nimmt sich
  rationale: לקח bedeutet grundsätzlich »nehmen«. Das reflexive »nimmt sich« ist im Deutschen bei der Wahl anderer Partner idiomatisch und hält die aktive Aussage fest.
- source_word: אֶת
  choice: '[im Deutschen nicht eigens wiedergegeben]'
  rationale: אֶת ist ein hebräischer Akkusativmarker und hat kein eigenes deutsches Gegenstück.
- source_word: זָרִים
  choice: Fremde
  rationale: Das Wort bezeichnet fremde beziehungsweise außenstehende Männer. »Fremde« erhält diese Offenheit, ohne unnötig eine bestimmte Nationalität zu behaupten.
theological_decisions:
- issue: Darstellung der Untreue Jerusalems durch das Bild des Ehebruchs
  choice: Das Ehebruchs- und Ehebild wird direkt beibehalten.
  alternative: Die Aussage ausdrücklich als geistliche oder bundesbezogene Untreue zu umschreiben.
  rationale: Der Vers gehört zu Hesekiels ausgedehnter Ehemetaphorik. Eine direkte Wiedergabe bewahrt die Schärfe des Bildes und legt dessen theologische Entsprechung nicht paraphrasierend fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Anklageform und die drastische Ehemetaphorik bleiben erhalten; die Fußnote dokumentiert eine natürlichere explizierende Alternative.
