  edition: WLC
  text: וְ/שָׂרְפ֤וּ בָתַּ֨יִ/ךְ֙ בָּ/אֵ֔שׁ וְ/עָשׂוּ בָ֣/ךְ שְׁפָטִ֔ים לְ/עֵינֵ֖י נָשִׁ֣ים רַבּ֑וֹת וְ/הִשְׁבַּתִּי/ךְ֙ מִ/זּוֹנָ֔ה וְ/גַם אֶתְנַ֖ן לֹ֥א תִתְּנִי עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/041.yaml
  text: They will burn your houses with fire and execute judgments against you before the eyes of many women[a]. I will put a stop to your prostitution[c][b], and you will no longer give payment.
translation:
  language: de
  text: Sie werden deine Häuser niederbrennen und vor den Augen vieler Frauen Strafgerichte an dir vollstrecken. Ich werde deiner Prostitution ein Ende machen, und du wirst keinen Lohn mehr zahlen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Lohn für Prostitution. Anders als gewöhnlich hat Jerusalem diesen Lohn selbst gezahlt; siehe Verse 33–34.
    reason: Die Fußnote erklärt die spezifische Bedeutung von אֶתְנַן und die im Hebräischen ausdrücklich bewahrte, ungewöhnliche Richtung der Zahlung.
lexical_decisions:
- source_word: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ
  choice: Sie werden deine Häuser niederbrennen
  rationale: Die Verbform setzt die angekündigte Gerichtsfolge fort. „Niederbrennen“ gibt das Verb שׂרף samt der instrumentalen Wendung „mit Feuer“ natürlich und ohne unnötige Doppelung wieder.
- source_word: וְעָשׂוּ בָךְ שְׁפָטִים
  choice: Strafgerichte an dir vollstrecken
  rationale: עשה mit שְׁפָטִים bezeichnet hier die Durchführung richterlicher Strafen; „Strafgerichte vollstrecken“ wahrt sowohl den rechtlichen als auch den tatsächlichen Vollzug.
- source_word: לְעֵינֵי נָשִׁים רַבּוֹת
  choice: vor den Augen vieler Frauen
  rationale: Die konkrete hebräische Wendung wird bewahrt und unterstreicht die öffentliche Beschämung.
- source_word: וְהִשְׁבַּתִּיךְ מִזּוֹנָה
  choice: Ich werde deinem Treiben als Prostituierte ein Ende machen
  rationale: Der Hifil von שׁבת bedeutet „aufhören lassen“. מִזּוֹנָה lässt sich als Beendigung ihres Daseins beziehungsweise Treibens als Prostituierte verstehen; die Formulierung bleibt bildhaft und modernes Deutsch.
- source_word: אֶתְנַן
  choice: Lohn
  rationale: Das Wort bezeichnet eine im Zusammenhang mit Prostitution geleistete Zahlung. „Lohn“ ist knapp und verständlich; die ungewöhnliche Richtung der Zahlung wird durch „zahlen“ erhalten und in der Fußnote erläutert.
- source_word: לֹא תִתְּנִי עוֹד
  choice: du wirst keinen Lohn mehr zahlen
  rationale: Die feminine Singularform bedeutet wörtlich „du wirst nicht mehr geben“. Im Kontext ist Jerusalem bemerkenswerterweise diejenige, die den Prostitutionslohn gibt; „zahlen“ macht den Sinn natürlich, ohne diese Umkehrung zu beseitigen.
theological_decisions:
- issue: Sexuelle Metapher für Jerusalems Untreue
  choice: Das Bild der Prostitution ausdrücklich beibehalten
  alternative: Die Metapher mit „Untreue“ oder „Götzendienst“ abstrahieren
  rationale: Der hebräische Text verwendet bewusst drastische sexuelle Bildsprache für Jerusalems Bundesbruch. Eine abstrakte Wiedergabe würde die rhetorische Schärfe und die Verbindung zum vorausgehenden Kontext abschwächen.
- issue: Jerusalem gibt selbst den Prostitutionslohn
  choice: Die ungewöhnliche Zahlungsrichtung im Haupttext erhalten
  alternative: Den Satz so verstehen, als empfinge Jerusalem künftig keinen Lohn mehr
  rationale: 'תִתְּנִי ist aktiv: „du wirst geben“. Dies entspricht der bereits in Vers 33–34 hervorgehobenen Umkehrung des üblichen Verhaltens einer Prostituierten und darf nicht stillschweigend normalisiert werden.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer, aber nicht beschönigter Gerichtssprache. Die Anrede bleibt feminin singular, entsprechend der personifizierten Stadt Jerusalem. Der einzige Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Aussage.
