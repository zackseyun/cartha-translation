  text: You slaughtered my sons and gave them up to them by making them pass through the fire[a].
translation:
  language: de
  text: Du hast meine Söhne geschlachtet und sie ihnen hingegeben, indem du sie durchs Feuer gehen ließest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „indem du sie ihnen hindurchgehen ließest“; „ihnen“ kann auch „für sie“ bedeuten. „Durchs Feuer“ steht nicht ausdrücklich in diesem Satzglied, ist aber im Zusammenhang die Bedeutung der kultischen Wendung: Kinder wurden als Opfer für Götzen durchs Feuer geführt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁחֲטִי
  choice: du hast … geschlachtet
  rationale: „Schlachten“ gibt die gewaltsame und kultische Färbung von שׁחט genauer wieder als das allgemeinere „töten“.
- source_word: בָּנָי
  choice: meine Söhne
  rationale: Die ausdrücklich männliche Bezeichnung und der göttliche Besitzanspruch des Hebräischen bleiben erhalten.
- source_word: וַתִּתְּנִים
  choice: sie … hingegeben
  rationale: „Hingeben“ drückt hier das Ausliefern an die zuvor genannten Götzen aus und entspricht dem anklagenden Ton.
- source_word: בְּהַעֲבִיר אוֹתָם
  choice: indem du sie … durchs Feuer gehen ließest
  rationale: Der Hifil von עבר bezeichnet in diesem kultischen Zusammenhang das Hindurchführen von Kindern; „Feuer“ ist sinngemäß aus dem festen Ausdruck und Kontext ergänzt.
- source_word: לָהֶם
  choice: für sie
  rationale: Das Pronomen bezieht sich auf die Götzen. „Für sie“ ist im Deutschen beim Opferzweck natürlicher als ein zweites „ihnen“, ohne die mögliche Ziel- bzw. Zweckbeziehung zu überpräzisieren.
theological_decisions:
- issue: Soll der im kultischen Ausdruck vorausgesetzte Feuerbezug im Haupttext ausdrücklich genannt werden?
  choice: „durchs Feuer gehen ließest“ im Haupttext
  alternative: „hindurchgehen ließest“ ohne Nennung des Feuers
  rationale: Der Kontext handelt von Kinderopfern für Götzen. Die Ergänzung macht den etablierten kultischen Sinn für heutige Leser verständlich; die Fußnote kennzeichnet zugleich, dass „Feuer“ in diesem Satzglied nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anklage und die kultisch-gewaltsame Wortwahl bleiben erhalten; eine im Hebräischen nur implizite Kontextangabe wird transparent durch eine Fußnote ausgewiesen.
