base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/055.yaml
  text: And your sisters[a], Sodom and her daughters, will return to their former state, and Samaria and her daughters will return to their former state, and you and your daughters will return to your former state.
translation:
  language: de
  text: Und deine Schwestern, Sodom und ihre Töchter, werden zu ihrem früheren Zustand zurückkehren[a]. Und Samaria und ihre Töchter werden zu ihrem früheren Zustand zurückkehren, und du und deine Töchter werdet zu eurem früheren Zustand zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder jeweils: werden in ihren bzw. euren früheren Zustand wiederhergestellt.'
    reason: Die alternative Wiedergabe bringt den im Zusammenhang naheliegenden Gedanken der Wiederherstellung deutlicher zum Ausdruck, ist jedoch interpretierender als das hebräische „zurückkehren“.
lexical_decisions:
- source_word: אֲחוֹתַיִךְ
  choice: deine Schwestern
  rationale: Die wörtliche Verwandtschaftsbezeichnung bewahrt die Personifikation der Städte und das durchgängige Familienbild des Kapitels.
- source_word: סְדֹם
  choice: Sodom
  rationale: Im Deutschen übliche Form des Ortsnamens.
- source_word: בְנוֹתֶיהָ / בְנוֹתַיִךְ
  choice: ihre Töchter / deine Töchter
  rationale: Obwohl damit abhängige Ortschaften oder Gemeinschaften gemeint sein können, bewahrt „Töchter“ das personifizierende Familienbild des hebräischen Textes.
- source_word: תָּשֹׁבְנָה / תְּשֻׁבֶינָה
  choice: werden zurückkehren / werdet zurückkehren
  rationale: Die Grundbedeutung von שוב ist „zurückkehren“. Die dreifache Wiederholung wird beibehalten, ohne die Aussage bereits als passive Wiederherstellung auszulegen.
- source_word: לְקַדְמָתָן / לְקַדְמַתְכֶן
  choice: zu ihrem früheren Zustand / zu eurem früheren Zustand
  rationale: Die Wendung bezeichnet den früheren Zustand. Bei Jerusalem und ihren Töchtern verlangt die deutsche Anrede im Plural „eurem“.
- source_word: וְ
  choice: und / auch
  rationale: Die koordinierende Abfolge der drei parallelen Aussagen bleibt erhalten; „auch“ macht im zweiten Satz die fortlaufende Reihung idiomatisch deutlich, ohne eine zusätzliche zeitliche Aussage einzuführen.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Im Deutschen übliche Form des Ortsnamens.
theological_decisions:
- issue: Art der angekündigten Umkehr für Sodom, Samaria und Jerusalem
  choice: Die Aussage wird als Rückkehr zum früheren Zustand wiedergegeben, ohne Mechanismus oder weitergehende theologische Folgen festzulegen.
  alternative: „werden in ihren früheren Zustand wiederhergestellt werden“
  rationale: Der hebräische Text verwendet das Verb „zurückkehren“ und spricht vom früheren Zustand. Die Übersetzung bewahrt damit die theologische Spannung und legt die umstrittene Tragweite der Aussage nicht interpretierend fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierende Familienmetaphorik und die dreifache Parallelstruktur des Ausgangstextes bleiben erhalten; die lange hebräische Satzreihe wird zur besseren Lesbarkeit in zwei Sätze gegliedert.
