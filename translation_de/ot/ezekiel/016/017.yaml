  text: וַ/תִּקְחִ֞י כְּלֵ֣י תִפְאַרְתֵּ֗/ךְ מִ/זְּהָבִ֤/י וּ/מִ/כַּסְפִּ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וַ/תַּעֲשִׂי לָ֖/ךְ צַלְמֵ֣י זָכָ֑ר וַ/תִּזְנִי בָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/017.yaml
  text: You took your beautiful jewels from my gold and my silver[a], which I had given to you, and made for yourself male images[c][b], and you prostituted yourself with them.
translation:
  language: de
  text: Du nahmst deine prächtigen Schmuckstücke aus meinem Gold und meinem Silber[a], das ich dir gegeben hatte, und machtest dir daraus männliche Bildnisse[b]; mit ihnen hurtest du.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine prächtigen Gegenstände“ beziehungsweise „deinen herrlichen Schmuck“. Das hebräische Wort kann allgemein Geräte, Gefäße oder Gegenstände bezeichnen; hier sind wahrscheinlich Schmuckstücke aus Edelmetall gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „männliche Götzenbilder“ beziehungsweise „Bildnisse in männlicher Gestalt“.'
    reason: alternative_reading
  - marker: c
    text: Die Rede vom Huren ist eine wiederkehrende prophetische Metapher für Untreue gegenüber Gott, die sich hier im Götzendienst zeigt.
    reason: cultural_note
lexical_decisions:
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: deine prächtigen Schmuckstücke
  rationale: כְּלִי bezeichnet allgemein einen Gegenstand oder ein Gerät; zusammen mit תִפְאֶרֶת und den genannten Edelmetallen liegt hier Schmuck nahe. „Prächtige Schmuckstücke“ gibt sowohl den Gegenstandscharakter als auch Glanz und Schönheit wieder.
- source_word: מִזְּהָבִי וּמִכַּסְפִּי
  choice: aus meinem Gold und meinem Silber
  rationale: Die Präposition מִן bezeichnet hier das Ausgangsmaterial. Die Possessivformen werden beibehalten, weil der Vorwurf betont, dass die verwendeten Materialien dem Sprecher gehörten und von ihm geschenkt worden waren.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: das ich dir gegeben hatte
  rationale: Das Relativpronomen bezieht sich sinngemäß auf Gold und Silber als zusammengefassten Stoffbestand. Das Plusquamperfekt macht deutlich, dass die Gabe der angeklagten Handlung vorausging.
- source_word: וַתַּעֲשִׂי לָךְ
  choice: und machtest dir daraus
  rationale: „Dir“ bewahrt die selbstbezogene Bedeutung von לָךְ. „Daraus“ stellt im Deutschen natürlich den materiellen Bezug zum zuvor genannten Gold und Silber her.
- source_word: צַלְמֵי זָכָר
  choice: männliche Bildnisse
  rationale: צֶלֶם bedeutet Bild, Abbild oder Bildnis; זָכָר bezeichnet ausdrücklich das Männliche. „Männliche Bildnisse“ bleibt näher am Wortlaut als das bereits deutende „männliche Götzenbilder“ und erhält die bewusst sexualisierte Bildsprache.
- source_word: וַתִּזְנִי בָם
  choice: mit ihnen triebst du Prostitution
  rationale: זנה bezeichnet Prostitution beziehungsweise Hurerei und dient bei Ezechiel zugleich als drastische Metapher für kultische und bundesbezogene Untreue. Die Formulierung ist in modernem Deutsch verständlich, ausdrücklich und nicht beschönigend; בָם wird mit „mit ihnen“ wiedergegeben.
theological_decisions:
- issue: Prophetische Sexualmetapher für Götzendienst und Untreue
  choice: Die ausdrückliche Sprache „triebst du Prostitution“ bleibt im Haupttext erhalten.
  alternative: „Du wurdest ihnen untreu“ oder „du begingst mit ihnen Götzendienst“
  rationale: Der hebräische Text formuliert absichtlich schockierend und verbindet sexuelle Untreue mit Jerusalems kultischem Abfall. Eine allgemeine Rede von Untreue oder Götzendienst würde die rhetorische Spannung abschwächen und die Metapher auflösen.
- issue: Bedeutung von צַלְמֵי זָכָר
  choice: „männliche Bildnisse“
  alternative: „männliche Götzenbilder“ oder „Bildnisse in männlicher Gestalt“
  rationale: Der Kontext ist eindeutig kultisch, doch צֶלֶם bedeutet zunächst „Bildnis“. Die gewählte Wiedergabe bewahrt die lexikalische Offenheit und lässt den kultischen sowie sexuellen Zusammenhang aus dem Kontext hervortreten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Anklage. Die feminine Anrede Jerusalems wird durch die Verbformen im Deutschen nicht sichtbar, ergibt sich aber aus dem Kontext. Die drastische sexuelle Metapher wird nicht abgeschwächt; erläuternde Deutungen stehen in den Fußnoten.
