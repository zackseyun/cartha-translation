source:
  edition: WLC
  text: וַ/יְהִי בָ֨/ךְ הֵ֤פֶךְ מִן הַ/נָּשִׁים֙ בְּ/תַזְנוּתַ֔יִ/ךְ וְ/אַחֲרַ֖יִ/ךְ לֹ֣א זוּנָּ֑ה וּ/בְ/תִתֵּ֣/ךְ אֶתְנָ֗ן וְ/אֶתְנַ֛ן לֹ֥א נִתַּן לָ֖/ךְ וַ/תְּהִ֥י לְ/הֶֽפֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/034.yaml
  text: 'And in your prostitution you were the opposite of other women: no one solicited you[a], but you gave payment, and no payment was given to you; so you became the opposite.'
translation:
  language: de
  text: 'In deiner Prostitution warst du das Gegenteil der anderen Frauen: Niemand suchte dich als Prostituierte auf[a], sondern du gabst Bezahlung, und dir wurde keine Bezahlung gegeben; so wurdest du zum Gegenteil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Nach dir prostituierte sich niemand.“ Gemeint ist: Anders als gewöhnliche Prostituierte wurdest du nicht von Kunden aufgesucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵפֶךְ / לְהֶפֶךְ
  choice: umgekehrt / umgekehrt
  rationale: Das Substantiv bezeichnet eine Umkehrung beziehungsweise Verkehrung. Die wiederholte Wiedergabe bewahrt die Rahmung des Verses und hebt die ironische Umkehr des üblichen Vorgangs hervor.
- source_word: תַזְנוּתַיִךְ
  choice: deiner Prostitution
  rationale: Der Ausdruck bezeichnet hier im erweiterten Bild für Jerusalems Untreue ihre Prostitutionshandlungen. „Prostitution“ ist gegenwärtig, verständlich und bewahrt die bewusst anstößige Bildsprache.
- source_word: וְאַחֲרַיִךְ לֹא זוּנָה
  choice: Niemand lief dir nach, um mit dir Unzucht zu treiben
  rationale: 'Wörtlich steht ungefähr: „Hinter dir her trieb niemand Unzucht.“ Die Formulierung bewahrt das Motiv des Nachlaufens und macht im Deutschen verständlich, dass sie nicht wie eine gewöhnliche Prostituierte von Kunden aufgesucht wurde.'
- source_word: אֶתְנָן
  choice: Lohn
  rationale: Das Wort bezeichnet den für Prostitution gezahlten Lohn. „Lohn“ ist knapp und ermöglicht es, die ausdrückliche Wiederholung in beiden Satzgliedern zu erhalten.
- source_word: וּבְתִתֵּךְ אֶתְנָן
  choice: vielmehr gabst du den Lohn
  rationale: 'Die Infinitivkonstruktion nennt den Umstand, der die Verkehrung ausmacht. „Vielmehr“ verdeutlicht den Gegensatz: Sie empfing keinen Lohn, sondern zahlte ihn selbst.'
- source_word: וְאֶתְנַן לֹא נִתַּן לָךְ
  choice: und dir wurde kein Lohn gegeben
  rationale: Die passive Form folgt dem Hebräischen eng und bewahrt die Wiederholung von „Lohn“.
- source_word: וַתְּהִי לְהֶפֶךְ
  choice: So war es bei dir umgekehrt
  rationale: Die Schlussformulierung gibt den resultierenden Zustand idiomatisch wieder und wiederholt bewusst das Schlüsselwort vom Versanfang.
theological_decisions:
- issue: Sexuelle Metaphorik für Jerusalems Untreue
  choice: Die Prostitutionsmetapher wird im Haupttext ausdrücklich beibehalten.
  alternative: Die Bildsprache zu „Untreue“ oder „Götzendienst“ abschwächen.
  rationale: Ezechiel setzt die schockierende sexuelle Bildsprache gezielt ein, um Jerusalems Bundesuntreue darzustellen. Eine abstraktere Wiedergabe würde die rhetorische Schärfe des Textes vermindern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte und anstößige Bildsprache des hebräischen Textes bleibt erhalten; archaische Wörter werden vermieden. Die Wiederholung von „umgekehrt“ und „Lohn“ bildet die Struktur des Ausgangstextes nach.
