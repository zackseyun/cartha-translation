base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/044.yaml
  text: Look[a], everyone who uses proverbs about you will use this proverb, saying, ‘Like mother, like daughter.’
translation:
  language: de
  text: 'Sieh: Jeder, der über dich ein Sprichwort gebraucht[a], wird dieses Sprichwort gebrauchen: »Wie die Mutter, so die Tochter.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wurzel משל bezeichnet hier das Sprechen oder Gebrauchen eines Sprichworts, nicht das Herrschen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die aufmerksamkeitslenkende, deiktische Kraft der Einleitung in einer natürlichen modernen Form.
- source_word: כָּל הַמֹּשֵׁל
  choice: jeder, der ein Sprichwort … gebraucht
  rationale: כָּל ist mit dem substantivisch gebrauchten Partizip distributiv zu verstehen; die Formulierung gibt zugleich die sprichwörtliche Bedeutung der Wurzel משל wieder.
- source_word: עָלַיִךְ
  choice: über dich
  rationale: Die Präposition bezeichnet hier das Thema beziehungsweise den Gegenstand des Sprichworts. Eine feindselige Nuance ist im Kontext möglich, wird aber nicht ausdrücklich in die Präposition hineingelesen.
- source_word: יִמְשֹׁל
  choice: wird dieses Sprichwort gebrauchen
  rationale: Die Wurzel משל bedeutet hier, ein Sprichwort auszusprechen oder zu gebrauchen, nicht herrschen. »Dieses« verweist idiomatisch auf den unmittelbar folgenden Spruch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die direkte Rede im Deutschen natürlich ein; ein zusätzliches »und sagen« wäre unnötig schwerfällig.
- source_word: כְאִמָּה בִּתָּהּ
  choice: Wie die Mutter, so die Tochter
  rationale: Die geläufige deutsche Sprichwortform bewahrt Kürze, Parallelismus und rhetorische Prägnanz des Hebräischen.
