base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/063.yaml
  text: so that you may remember and be ashamed[a], and no longer have any opening of the mouth because of your disgrace, when I make atonement for you for all that you have done[b], declares the Lord GOD.
translation:
  language: de
  text: damit du dich erinnerst und dich schämst und wegen deiner Schande deinen Mund nicht mehr auftust[a], wenn ich für dich Sühne leiste für alles, was du getan hast[b], spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und es für dich keine Öffnung des Mundes mehr gibt“. Gemeint sein kann, dass du keinen Anlass oder keine Kühnheit mehr hast, etwas vorzubringen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn ich für dich Sühne erweise“. Das hebräische Verb bezeichnet Sühne beziehungsweise Versöhnung und nicht nur allgemein Vergebung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּזְכְּרִי
  choice: damit du dich erinnerst
  rationale: לְמַעַן leitet hier einen Zweck- oder Folgesatz ein; die feminine Singularform richtet sich an das personifizierte Jerusalem.
- source_word: וָבֹשְׁתְּ
  choice: und dich schämst
  rationale: Die reflexive deutsche Wendung gibt den Zustand der Scham natürlich wieder, ohne unnötig eine passive Beschämung festzulegen.
- source_word: פִּתְחוֹן פֶּה
  choice: deinen Mund nicht mehr auftust
  rationale: Die hebräische Wendung bedeutet wörtlich „Öffnung des Mundes“ und bezeichnet hier die Möglichkeit oder Dreistigkeit, noch etwas vorzubringen. Die deutsche Formulierung bewahrt das Mundbild idiomatisch.
- source_word: מִפְּנֵי כְּלִמָּתֵךְ
  choice: vor Schmach
  rationale: מִפְּנֵי kann hier kausal beziehungsweise angesichts von verstanden werden; „vor Schmach“ ist knapp und erhält den Bezug auf entehrende Beschämung.
- source_word: בְּכַפְּרִי לָךְ
  choice: wenn ich für dich Sühne schaffe
  rationale: Das präfigierte ב wird temporal aufgefasst. „Sühne schaffen“ bewahrt das gewichtige Versöhnungs- und Sühnevokabular von כפר, ohne den im Vers nicht erklärten Mechanismus festzulegen.
- source_word: לְכָל אֲשֶׁר עָשִׂית
  choice: für alles, was du getan hast
  rationale: Die Formulierung erhält den umfassenden Bezug auf Jerusalems bisherige Taten.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם wird als prophetische Schlussformel wiedergegeben; אֲדֹנָי ist „der Herr“, während der Gottesname als „Yahweh“ erkennbar bleibt.
theological_decisions:
- issue: Bedeutung von כפר im Zusammenhang göttlicher Wiederherstellung
  choice: Sühne schaffen
  alternative: vergeben
  rationale: „Vergeben“ würde die Sühne- und Versöhnungsdimension des Verbs einebnen. Die Übersetzung wahrt diese Dimension, ohne eine bestimmte Sühnetheorie in den Vers hineinzulesen.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und vermeidet, den im Ausgangstext stehenden Gottesnamen zu verdecken.
- issue: Zusammenhang zwischen Sühne und Scham
  choice: Die Zweck- beziehungsweise Folgebeziehung bleibt sprachlich offen
  alternative: Die Sühne ausschließlich als Ursache der Scham erklären
  rationale: Der Satz verbindet Erinnerung, Scham, Verstummen und Gottes Sühnehandeln eng miteinander, legt aber die genaue logische Abstufung nicht vollständig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Anrede Jerusalems ist im Deutschen an den Verbformen nicht sichtbar, ergibt sich aber aus dem Kontext. Das konkrete Mundbild und die theologisch gewichtige Sühnesprache wurden bewahrt.
