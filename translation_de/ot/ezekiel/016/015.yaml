base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/015.yaml
  text: But you trusted in your beauty[a], and you prostituted yourself because of your name, and you poured out your prostitutions on every passerby[b]; they became his.
translation:
  language: de
  text: Doch du vertrautest auf deine Schönheit und triebst Hurerei wegen deines Ruhmes[a]. Du schüttetest deine Hurereien über jeden aus, der vorüberkam[b]; ihm gehörte es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wegen deines Namens«; »Name« kann hier den Ruf oder Ruhm bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schlusssatz ist äußerst knapp: »Ihm sei es« beziehungsweise »ihm gehörte es«. Gemeint ist, dass das von ihr Angebotene dem jeweiligen Vorübergehenden überlassen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְטְחִי בְיָפְיֵךְ
  choice: du vertrautest auf deine Schönheit
  rationale: בטח mit ב bezeichnet das Vertrauen auf etwas; die Formulierung gibt die konkrete Anklage und יֹפִי als „Schönheit“ direkt wieder.
- source_word: וַתִּזְנִי
  choice: du triebst Hurerei
  rationale: זנה trägt hier bewusst die sexuelle Bildsprache der Prostitution und zugleich den prophetischen Bezug auf Jerusalems Untreue. „Hurerei treiben“ bewahrt beides, ohne die Metapher aufzulösen.
- source_word: עַל שְׁמֵךְ
  choice: wegen deines Ruhmes
  rationale: שֵׁם bedeutet wörtlich „Name“, bezeichnet im Kontext aber den durch Schönheit erworbenen Ruf beziehungsweise Ruhm. Natürliches Deutsch erfordert hier die kontextuelle Bedeutung.
- source_word: וַתִּשְׁפְּכִי אֶת תַּזְנוּתַיִךְ
  choice: du schüttetest deine Hurereien ... aus
  rationale: Die konkrete Metapher von שׁפך („ausschütten“) und der intensive Plural תַּזְנוּתַיִךְ bleiben erhalten.
- source_word: עַל כָּל עוֹבֵר
  choice: über jeden ..., der vorüberkam
  rationale: Die Wiedergabe wahrt die Präposition und das Bild einer wahllosen Preisgabe an jeden Vorübergehenden.
- source_word: לוֹ יֶהִי
  choice: ihm wurden sie zuteil
  rationale: Die knappe, schwierige Schlussformel bezeichnet die Übergabe an den jeweiligen Vorübergehenden. Der Plural „sie“ bezieht sich im Deutschen auf die zuvor genannten „Hurereien“, ohne die hebräische Wendung unnötig auszudeuten.
theological_decisions:
- issue: Sexuelle prophetische Metapher für Jerusalems Bundesuntreue
  choice: Die ausdrückliche Hurerei-Bildsprache bleibt im Haupttext erhalten.
  alternative: Die Metapher zu „du wurdest untreu“ abschwächen beziehungsweise auslegen.
  rationale: Der hebräische Text verbindet sexuelle Prostitution bewusst mit religiöser und politischer Untreue. Eine abstrakte Wiedergabe würde die Härte und theologische Spannung des Bildes beseitigen.
- issue: Bedeutung von עַל שְׁמֵךְ
  choice: „wegen deines Ruhmes“ im Haupttext, mit dem wörtlichen „wegen deines Namens“ in der Fußnote
  alternative: „wegen deines Namens“ ohne Erläuterung im Haupttext
  rationale: Im Zusammenhang bezeichnet „Name“ den erworbenen Ruf oder Ruhm. Die gewählte Fassung ist im modernen Deutschen verständlich, während die Fußnote die Form des Hebräischen transparent hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst harter prophetischer Bildsprache. „Hurerei“ ist markiert, aber allgemein verständlich und bildet den wiederholten Wortstamm זנה ab. Die Satzglieder folgen weitgehend der eindringlichen Reihung des Hebräischen.
