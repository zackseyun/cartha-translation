  text: לְ/כָל זֹנ֖וֹת יִתְּנוּ נֵ֑דֶה וְ/אַ֨תְּ נָתַ֤תְּ אֶת נְדָנַ֨יִ/ךְ֙ לְ/כָל מְאַֽהֲבַ֔יִ/ךְ וַ/תִּשְׁחֳדִ֣י אוֹתָ֗/ם לָ/ב֥וֹא אֵלַ֛יִ/ךְ מִ/סָּבִ֖יב בְּ/תַזְנוּתָֽיִ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/033.yaml
  text: Men give a prostitute her payment, but you gave your gifts to all your lovers, and you bribed them to come to you from all around for your prostitutions.
translation:
  language: de
  text: Allen Prostituierten gibt man ihre Bezahlung. Du aber gabst all deinen Liebhabern deine Geschenke und bestachst sie, von überall her zu dir zu kommen, um mit dir Hurerei zu treiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹנוֹת
  choice: Prostituierten
  rationale: Bezeichnet hier Frauen, die sexuelle Dienste gegen Bezahlung anbieten; die moderne, klare Bezeichnung passt zur ausdrücklich genannten Entlohnung.
- source_word: נֵדֶה
  choice: Lohn
  rationale: Im Kontext ist die einer Prostituierten gegebene Bezahlung gemeint; „Lohn“ gibt den Gegensatz zu den von Jerusalem selbst verteilten Geschenken knapp wieder.
- source_word: נְדָנַיִךְ
  choice: deine Geschenke
  rationale: Das seltene Wort bezeichnet hier Gaben; die Wiedergabe bewahrt den Kontrast zur üblichen Bezahlung, ohne eine unsichere Spezifizierung vorzunehmen.
- source_word: וַתִּשְׁחֳדִי
  choice: und bestachst sie
  rationale: Das Verb bedeutet bestechen beziehungsweise durch ein Geschenk gefügig machen und unterstreicht die Verkehrung der gewöhnlichen Rollen.
- source_word: בְּתַזְנוּתָיִךְ
  choice: um mit dir Hurerei zu treiben
  rationale: Die finale Wendung gibt im Deutschen idiomatisch wieder, wozu die Liebhaber herbeigerufen werden; „Hurerei“ erhält die prophetische sexuelle und metaphorische Schärfe.
theological_decisions:
- issue: Sexuelle Bildsprache als Darstellung Jerusalems Untreue
  choice: Die drastische Prostitutionsmetaphorik bleibt ausdrücklich erhalten.
  alternative: Die Bildsprache durch Begriffe wie „Untreue“ oder „Götzendienst“ erklärend ersetzen.
  rationale: Der Vers selbst spricht bildhaft und benennt die religiös-politischen Bezugsfelder nicht ausdrücklich; eine erklärende Auflösung würde die genuine Mehrdeutigkeit und rhetorische Härte vermindern.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-prophetischem Ton. Der Wechsel vom allgemeinen Präsens zum anklagenden Präteritum und der scharfe Gegensatz durch „Du aber“ werden bewahrt.
