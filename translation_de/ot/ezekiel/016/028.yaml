  text: וַ/תִּזְנִי֙ אֶל בְּנֵ֣י אַשּׁ֔וּר מִ/בִּלְתִּ֖י שָׂבְעָתֵ֑/ךְ וַ/תִּזְנִ֕י/ם וְ/גַ֖ם לֹ֥א שָׂבָֽעַתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/028.yaml
  text: You prostituted yourself with the sons of Assyria because you were not satisfied[a]; you prostituted yourself with them[b], and even then you were not satisfied.
translation:
  language: de
  text: Du hast mit den Söhnen Assurs[a] gehurt, weil du nicht satt wurdest. Du hast mit ihnen[b] gehurt, und selbst dann wurdest du nicht satt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Assyrern“. Wörtlich: „mit den Söhnen Assurs“.'
    reason: lexical_alternative
  - marker: b
    text: Das wiederholte Bild des Hurens bezeichnet Jerusalems Untreue, die sich in fremden Bündnissen und Götzendienst zeigt.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: du hast dich prostituiert
  rationale: זנה bezeichnet hier in einer bewusst drastischen Metapher Jerusalems politische und religiöse Untreue als Prostitution. Die Formulierung ist im heutigen Deutsch verständlich und bewahrt die Schärfe des Bildes.
- source_word: אֶל
  choice: mit
  rationale: In Verbindung mit זנה bezeichnet אֶל die Partei, mit der die dargestellte unerlaubte Beziehung eingegangen wird; im Deutschen ist „mit“ die natürliche Wiedergabe.
- source_word: בְּנֵי אַשּׁוּר
  choice: den Söhnen Assurs
  rationale: Die formnahe Wiedergabe erhält das hebräische Ausdrucksprofil. Gemeint sind kollektiv wahrscheinlich die Assyrer.
- source_word: מִבִּלְתִּי שָׂבְעָתֵךְ
  choice: weil du nicht satt wurdest
  rationale: Die Wendung beschreibt mangelnde Sättigung als Anlass oder Begleitumstand. „Nicht satt werden“ erhält das wiederholte Sättigungsbild deutlicher als das abstraktere „nicht zufrieden sein“.
- source_word: וַתִּזְנִים
  choice: du hast dich mit ihnen prostituiert
  rationale: Das maskuline Pluralsuffix verweist auf die Söhne Assurs. „Mit ihnen“ macht diesen Rückbezug im Deutschen ausdrücklich und erhält zugleich die Wiederholung des Verbs.
- source_word: וְגַם לֹא שָׂבָעַתְּ
  choice: und selbst dann wurdest du nicht satt
  rationale: „Selbst dann“ gibt die steigernde Wirkung von וְגַם im Zusammenhang idiomatisch wieder; die Wiederholung von „satt“ spiegelt die hebräische Wortwiederholung.
theological_decisions:
- issue: Beibehaltung der Prostitutionsmetapher für Jerusalems politische und religiöse Untreue
  choice: Die ausdrückliche sexuelle Metapher steht im Haupttext.
  alternative: Abschwächung zu „du warst untreu“ oder Deutung als bloße Bündnispolitik.
  rationale: Ezechiel verwendet absichtlich eine anstößige sexuelle Bildsprache. Eine Abschwächung würde die prophetische Schärfe und die Verknüpfung von politischer und religiöser Untreue verdecken, ohne dass der Vers selbst diese Aspekte eindeutig voneinander trennt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit bewusst kräftiger prophetischer Bildsprache. Das Perfekt wirkt im Einzelvers natürlicher als ein isoliertes Präteritum; die Wiederholungen und das Bild des Nicht-satt-Werdens bleiben erhalten.
