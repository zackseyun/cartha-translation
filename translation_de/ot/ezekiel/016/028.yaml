  source_fidelity: Der Entwurf gibt die Wiederholung von זנה, den Bezug auf die Assyrer durch das Pluralsuffix, die kausale Wendung „weil“ und die wiederholte Metapher des Nicht-satt-Werdens insgesamt zutreffend wieder. „Söhne Assurs“ ist als formnahe Wiedergabe von בְּנֵי אַשּׁוּר möglich; die Fußnote bietet zu Recht „Assyrer“ als idiomatische Alternative.
  naturalness: Die Verbindung „sich mit jemandem prostituieren“ ist im modernen Standarddeutsch unidiomatisch und kann missverständlich klingen, als prostituiere man sich gemeinsam mit anderen. Das Verb „huren“ ist zwar bewusst drastisch, aber eine natürliche und dem hebräischen Bild entsprechende Wiedergabe in diesem prophetischen Kontext.
  terminology: „Assur“ ist als deutsche Bezeichnung für Assyrien hier vertretbar. „Huren“ bewahrt die explizite sexuelle und prostitutionsbezogene Metapher besser als eine bloße Umschreibung mit „untreu sein“. Die Fußnote erläutert die metaphorische Funktion, ohne sie in eine einzige politische oder religiöse Deutung aufzulösen.
