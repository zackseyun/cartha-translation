reference: Ezekiel 16:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֠/כֵן הִנְ/נִ֨י מְקַבֵּ֤ץ אֶת כָּל מְאַהֲבַ֨יִ/ךְ֙ אֲשֶׁ֣ר עָרַ֣בְתְּ עֲלֵי/הֶ֔ם וְ/אֵת֙ כָּל אֲשֶׁ֣ר אָהַ֔בְתְּ עַ֖ל כָּל אֲשֶׁ֣ר שָׂנֵ֑את וְ/קִבַּצְתִּי֩ אֹתָ֨/ם עָלַ֜יִ/ךְ מִ/סָּבִ֗יב וְ/גִלֵּיתִ֤י עֶרְוָתֵ/ךְ֙ אֲלֵ/הֶ֔ם וְ/רָא֖וּ אֶת כָּל עֶרְוָתֵֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/037.yaml
  text: Therefore[a], behold, I am gathering all your lovers with whom you found pleasure, and all whom you loved, along with all whom you hated; and I will gather them against you from every side, and I will uncover your nakedness to them[c][b], and they will see all your nakedness.
translation:
  language: de
  text: 'Darum: Siehe, ich versammle alle deine Liebhaber, an denen du Gefallen hattest[a], dazu alle, die du geliebt hast, samt allen, die du gehasst hast[b]. Ich werde sie von allen Seiten gegen dich versammeln und deine Blöße vor ihnen aufdecken[c], und sie werden deine ganze Blöße sehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an denen du Lust hattest“. Das hebräische Verb kann Gefallen, Wohlgefallen oder Lust bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint sind hier alle Gruppen: ihre unerlaubten Partner ebenso wie ihre Feinde. Sie alle werden zum Gericht zusammengerufen.'
    reason: cultural_note
  - marker: c
    text: „Die Blöße aufdecken“ ist prophetische Schamsprache für öffentliche Entblößung und Erniedrigung.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die angekündigte Konsequenz aus der vorhergehenden Anklage ein; „Darum“ ist im Deutschen natürlich und bewahrt den gerichtlichen Ton.
- source_word: הִנְנִי מְקַבֵּץ
  choice: Siehe, ich versammle
  rationale: הִנְנִי mit Partizip bezeichnet eine unmittelbar bevorstehende beziehungsweise gewiss eintretende Handlung. „Siehe“ erhält den feierlichen prophetischen Ankündigungston.
- source_word: מְאַהֲבַיִךְ
  choice: deine Liebhaber
  rationale: Im Zusammenhang von Hesekiel 16 gehört das Wort zur bewusst sexuellen Ehebruchsmetaphorik; „Liebhaber“ gibt dies klar wieder, ohne es vorschnell auf politische Verbündete zu reduzieren.
- source_word: אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם
  choice: an denen du Gefallen hattest
  rationale: ערב bezeichnet hier Gefallen oder Lust; die Formulierung bleibt verständlich und lässt die sinnliche Färbung des Kontexts bestehen.
- source_word: וְאֵת כָּל אֲשֶׁר אָהַבְתְּ עַל כָּל אֲשֶׁר שָׂנֵאת
  choice: dazu alle, die du geliebt hast, samt allen, die du gehasst hast
  rationale: Die Wiedergabe schließt sowohl geliebte als auch gehasste Personen in die Versammlung zum Gericht ein und erhält den rhetorischen Gegensatz.
- source_word: וְקִבַּצְתִּי אֹתָם עָלַיִךְ מִסָּבִיב
  choice: Ich werde sie von allen Seiten gegen dich versammeln
  rationale: עָלַיִךְ ist im Gerichtskontext adversativ als „gegen dich“ zu verstehen; מִסָּבִיב wird idiomatisch mit „von allen Seiten“ wiedergegeben.
- source_word: וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם
  choice: und deine Blöße vor ihnen aufdecken
  rationale: „Blöße aufdecken“ bewahrt die konkrete prophetische Scham- und Entblößungsmetaphorik. „Vor ihnen“ gibt die beabsichtigte öffentliche Sichtbarkeit im Deutschen natürlicher wieder als ein wörtliches „zu ihnen“.
- source_word: וְרָאוּ אֶת כָּל עֶרְוָתֵךְ
  choice: sodass sie deine ganze Blöße sehen werden
  rationale: Die Wiederholung von עֶרְוָה wird wegen ihrer rhetorischen Wirkung erhalten. „Sodass“ macht den inhaltlichen Zusammenhang natürlich deutlich, ohne die Aussage abzuschwächen.
theological_decisions:
- issue: Sexuelle Schammetaphorik des Gerichts über Jerusalem
  choice: Die konkreten Begriffe „Liebhaber“ und „Blöße“ werden beibehalten.
  alternative: Die Bildsprache abstrakt als politische Verbündete und öffentliche Schande wiederzugeben.
  rationale: Das Kapitel stellt Jerusalems Bundesuntreue bewusst im Bild ehelicher und sexueller Untreue dar. Eine abstrakte Wiedergabe würde diese rhetorische und theologische Spannung abschwächen.
- issue: Umfang der zum Gericht Versammelten
  choice: Sowohl die Geliebten als auch die Gehassten werden ausdrücklich einbezogen.
  alternative: Die Aussage nur auf Jerusalems frühere Liebhaber beziehungsweise Bündnispartner zu beziehen.
  rationale: Der hebräische Gegensatz zwischen Geliebten und Gehassten betont umfassendes Gericht; der Text darf nicht auf eine einzelne Partnergruppe verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem prophetischem Ernst. Die sexuelle Bildsprache wird weder vulgär verschärft noch beschönigend abstrahiert. Die Anrede bleibt durchgehend feminin singular, entsprechend der personifizierten Stadt Jerusalem.
