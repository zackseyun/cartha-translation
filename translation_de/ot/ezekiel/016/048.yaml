source:
  edition: WLC
  text: חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם עָֽשְׂתָה֙ סְדֹ֣ם אֲחוֹתֵ֔/ךְ הִ֖יא וּ/בְנוֹתֶ֑י/הָ כַּ/אֲשֶׁ֣ר עָשִׂ֔ית אַ֖תְּ וּ/בְנוֹתָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/048.yaml
  text: As I live[a], declares the Lord GOD, your sister Sodom, she and her daughters[b], has not done as you and your daughters have done.
translation:
  language: de
  text: '»So wahr ich lebe[a]«, spricht der Herr Yahweh: »Deine Schwester Sodom – sie und ihre Töchter[b] – hat nicht so gehandelt wie du und deine Töchter.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt die hebräische Schwurformel: »So wahr ich lebe … wenn Sodom … gehandelt hat.« In dieser Konstruktion drückt »wenn« eine nachdrückliche Verneinung aus.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Töchtern« sind die zu Sodom beziehungsweise Jerusalem gehörenden Städte oder Gemeinschaften gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: חַי אָ֗נִי
  choice: So wahr ich lebe
  rationale: Die feierliche göttliche Schwurformel wird in einer natürlichen, würdigen deutschen Entsprechung wiedergegeben.
- source_word: נְאֻם
  choice: spricht
  rationale: Die geläufige deutsche Prophetenformel gibt die autoritative göttliche Erklärung klar wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen etablierte Wiedergabe des zusammengesetzten Gottestitels vermeidet das missverständliche doppelte »Herr« und kennzeichnet zugleich JHWH typografisch.
- source_word: אִם
  choice: nicht
  rationale: Nach der Schwurformel leitet אִם keinen gewöhnlichen Bedingungssatz ein, sondern drückt in elliptischer Schwursyntax eine nachdrückliche Verneinung aus.
- source_word: עָשְׂתָה ... עָשִׂית
  choice: haben ... gehandelt / wie ...
  rationale: »Handeln« gibt das breite עשה im anklagenden Vergleich idiomatisch wieder, ohne die Art der Taten näher festzulegen.
- source_word: סְדֹם אֲחוֹתֵךְ הִיא וּבְנוֹתֶיהָ
  choice: Deine Schwester Sodom – sie und ihre Töchter –
  rationale: Die familiäre Metapher und das ausdrücklich gesetzte Pronomen הִיא bleiben erhalten; Gedankenstriche machen die hervorgehobene Nachstellung im Deutschen verständlich.
- source_word: אַתְּ וּבְנוֹתָיִךְ
  choice: du und deine Töchter
  rationale: Die feminine Singularanrede Jerusalems und ihre Verbindung mit den zugehörigen Gemeinwesen werden bewahrt.
theological_decisions:
- issue: Deutung der Schwurkonstruktion חַי־אני ... אִם
  choice: 'feierliche, nachdrücklich verneinte Aussage: »So wahr ich lebe ... haben nicht«'
  alternative: 'formal wörtlich: »So wahr ich lebe ... wenn Sodom gehandelt hat«'
  rationale: Die elliptische hebräische Schwurformel setzt für den Fall des Gegenteils eine unausgesprochene Selbstverwünschung voraus. Eine rein formale Wiedergabe mit »wenn« wäre im Deutschen irreführend; die starke Verneinung gibt den Sinn wieder.
- issue: Wiedergabe des zusammengesetzten Titels אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr JHWH / der Herr Jahwe
  rationale: Die gewählte deutsche Konvention unterscheidet beide Bestandteile und hält den Gottesnamen durch die Schreibweise HERR erkennbar, ohne eine bestimmte Aussprache des Tetragramms festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-prophetischem Ton. Die direkte Anrede Jerusalems und die familiäre Bildsprache bleiben erhalten; die Gedankenstriche bilden die hebräische Hervorhebung von »sie und ihre Töchter« lesbar ab.
