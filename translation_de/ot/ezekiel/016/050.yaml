base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/050.yaml
  text: They became haughty and committed abomination before me[b][a], so I removed them when I saw it.
translation:
  language: de
  text: Sie wurden hochmütig[a] und verübten vor mir eine Abscheulichkeit. Da entfernte ich sie, als ich es sah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wurden überheblich“ oder „Sie wurden stolz“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „als/wie ich sah“; das Objekt „es“ ist im Hebräischen unausgesprochen und aus dem vorhergehenden Satz zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְבְּהֶינָה
  choice: Sie wurden hochmütig
  rationale: Das Verb גבהּ bezeichnet hier im Zusammenhang der Anklage nicht bloß Erhöhung, sondern selbstherrliche Überheblichkeit. „Hochmütig“ gibt diese moralische Bedeutung prägnant und in natürlichem Deutsch wieder.
- source_word: וַתַּעֲשֶׂינָה תוֹעֵבָה
  choice: verübten … eine Abscheulichkeit
  rationale: עשה bedeutet allgemein „tun/machen“; zusammen mit תוֹעֵבָה entspricht „eine Abscheulichkeit verüben“ dem deutschen Sprachgebrauch und bewahrt die starke moralisch-religiöse Wertung.
- source_word: לְפָנָי
  choice: vor mir
  rationale: Die knappe Formulierung erhält sowohl den räumlichen Bildgehalt als auch den Sinn „in meiner Gegenwart/in meinen Augen“.
- source_word: וָאָסִיר אֶתְהֶן
  choice: Deshalb beseitigte ich sie
  rationale: Die Kausativform von סור bezeichnet das Entfernen. „Beseitigte“ wahrt die Direktheit des göttlichen Gerichtshandelns; „deshalb“ macht den im Zusammenhang naheliegenden Folgesinn der Satzverbindung idiomatisch deutlich.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: als ich es sah
  rationale: כַּאֲשֶׁר kann hier zeitlich mit „als“ wiedergegeben werden. Das Objekt von „sah“ bleibt im Hebräischen unausgesprochen und wird im Deutschen durch „es“ aus dem vorangehenden Geschehen aufgenommen.
theological_decisions:
- issue: Formulierung des göttlichen Gerichts
  choice: Deshalb beseitigte ich sie
  alternative: und ich entfernte sie
  rationale: Die gewählte Formulierung gibt das entschiedene Gerichtshandeln unmittelbar wieder, ohne dessen genaue Vollzugsweise über den Wortlaut hinaus festzulegen.
- issue: Bezug des Sehens
  choice: als ich es sah
  alternative: wie ich sah / nachdem ich es gesehen hatte
  rationale: Die zeitliche Lesart ist im Zusammenhang naheliegend; die Fußnote hält fest, dass das hebräische Objekt nur aus dem Kontext erschlossen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Abscheulichkeit“ bewahrt die Schärfe von תוֹעֵבָה, während „verübten“ die Verbindung idiomatisch macht. Die feminine Mehrzahl „sie“ bleibt entsprechend dem hebräischen Bezug erhalten.
