revisions:
- from: Sie wurden hochmütig[a] und verübten vor mir eine Abscheulichkeit. Deshalb beseitigte ich sie, als ich es sah.[b]
  to: Sie wurden hochmütig[a] und verübten vor mir eine Abscheulichkeit. Da entfernte ich sie, als ich es sah[b].
