  text: וַ/תַּעְדִּ֞י זָהָ֣ב וָ/כֶ֗סֶף וּ/מַלְבּוּשֵׁ/ךְ֙ ששי וָ/מֶ֨שִׁי֙ וְ/רִקְמָ֔ה סֹ֧לֶת וּ/דְבַ֛שׁ וָ/שֶׁ֖מֶן אכלתי וַ/תִּ֨יפִי֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַֽ/תִּצְלְחִ֖י לִ/מְלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/013.yaml
  text: You adorned yourself with gold and silver[a], and your clothing was fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil[b], and you became exceedingly beautiful and prospered to royalty.
translation:
  language: de
  text: Du schmücktest dich mit Gold und Silber, und deine Kleidung bestand aus feinem Leinen, kostbarem Stoff[a] und besticktem Gewebe. Du aßest Feinmehl, Honig und Öl. So wurdest du überaus schön und gelangtest zur Königswürde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Art des hier bezeichneten kostbaren Stoffes ist unsicher; traditionell wird auch „Seide“ übersetzt.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „hattest Erfolg bis hin zum Königtum“ oder „gelangtest zur Stellung einer Königin“. Der hebräische Ausdruck bezeichnet den erfolgreichen Aufstieg zu königlichem Rang.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּעְדִּי
  choice: Du schmücktest dich
  rationale: Das Verb עדה bezeichnet hier im Zusammenhang mit Gold und Silber das Schmücken mit Zierrat; die reflexive Wiedergabe entspricht der weiblichen Anrede und dem Brautbild.
- source_word: וּמַלְבּוּשֵׁךְ
  choice: deine Kleidung bestand aus
  rationale: Der kollektive Singular leitet natürlich die Aufzählung der kostbaren Stoffe ein.
- source_word: ששי
  choice: feinem Leinen
  rationale: שֵׁשׁ bezeichnet hochwertigen Leinenstoff, besonders in gehobenen und kultischen Zusammenhängen.
- source_word: מֶשִׁי
  choice: kostbarem Stoff
  rationale: Die genaue Art des luxuriösen Gewebes ist unsicher; die allgemeinere Wiedergabe vermeidet die nicht hinreichend gesicherte Festlegung auf Seide.
- source_word: רִקְמָה
  choice: besticktem Gewebe
  rationale: Das Wort bezeichnet einen durch Stickarbeit verzierten Stoff.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Übliche Bezeichnung für hochwertiges, fein gemahlenes Mehl.
- source_word: דְבַשׁ
  choice: Honig
  rationale: Direkte Wiedergabe des genannten Nahrungsmittels.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Der hebräische Text nennt allgemein Öl; eine Präzisierung als Olivenöl wäre sachlich wahrscheinlich, aber textlich enger als die Vorlage.
- source_word: אכלתי
  choice: Du aßest
  rationale: Der masoretische Konsonantentext mit der Punktierung ist als Qal Perfekt 2. Person feminin Singular zu lesen und setzt die direkte Anrede fort.
- source_word: וַתִּיפִי בִּמְאֹד מְאֹד
  choice: So wurdest du überaus schön
  rationale: Die doppelte Verstärkung מְאֹד מְאֹד wird in natürlichem Deutsch mit „überaus“ wiedergegeben.
- source_word: וַתִּצְלְחִי לִמְלוּכָה
  choice: und gelangtest zur Königswürde
  rationale: Die Formulierung bewahrt den Vorgang erfolgreichen Aufstiegs zu königlichem Rang, ohne zwischen Königtum, Königinnenwürde und Königreich vorschnell zu entscheiden.
theological_decisions:
- issue: Erhöhung Jerusalems im ehelich-königlichen Bild
  choice: gelangtest zur Königswürde
  alternative: hattest Erfolg bis hin zum Königtum; gelangtest zur Stellung einer Königin
  rationale: Jerusalem wird als weibliche Gestalt beschrieben, die königlichen Rang erreicht. „Königswürde“ wahrt sowohl die politische als auch die metaphorische Dimension und vermeidet eine übermäßig institutionelle oder dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Präteritalform „aßest“ ist grammatisch korrekt, wirkt leicht gehoben und passt zum prophetisch-literarischen Register; ansonsten bleibt der Satzbau klar und allgemein verständlich.
