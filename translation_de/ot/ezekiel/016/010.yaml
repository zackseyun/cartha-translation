base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/010.yaml
  text: I clothed you with embroidered cloth[a], put fine leather sandals on you, wrapped you in fine linen[b], and covered you with silk.
translation:
  language: de
  text: Ich kleidete dich in bestickten Stoff, zog dir Sandalen aus feinem Leder[a] an, hüllte dich in feines Leinen und bedeckte dich mit Seide[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort תָּחַשׁ bezeichnet ein Material, das hier für hochwertiges Schuhwerk verwendet wird. Von welchem Tier es stammte, ist ungewiss.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit einem kostbaren Stoff“. Die genaue Bedeutung des seltenen hebräischen Wortes מֶשִׁי ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִקְמָה
  choice: bestickter Stoff
  rationale: Das Substantiv bezeichnet besticktes Material beziehungsweise Stickarbeit. „Bestickter Stoff“ bewahrt das Textilbild, ohne eine bestimmte Kleidungsart vorauszusetzen.
- source_word: תָּחַשׁ
  choice: feines Leder
  rationale: Die genaue Tierart oder Herkunft des Materials ist ungewiss. Im Zusammenhang mit kostbarem Schuhwerk vermittelt „feines Leder“ die Funktion und den hochwertigen Charakter, ohne zoologische Präzision vorzutäuschen.
- source_word: וָאֶנְעֲלֵךְ תָּחַשׁ
  choice: zog dir Sandalen aus feinem Leder an
  rationale: Die Hifil-Form von נעל bezeichnet das Anlegen von Schuhwerk. Die explizite Nennung von Sandalen ergibt im Deutschen ein natürliches und anschauliches Kleidungsbild.
- source_word: שֵׁשׁ
  choice: feines Leinen
  rationale: שֵׁשׁ bezeichnet häufig hochwertiges Leinen. Die Wiedergabe erhält den luxuriösen Ton des Kontextes.
- source_word: וָאֶחְבְּשֵׁךְ בַּשֵּׁשׁ
  choice: hüllte dich in feines Leinen
  rationale: חבש kann „binden“, „wickeln“ oder „umgürten“ bedeuten. In dieser Abfolge des Bekleidens gibt „hüllte dich“ die Handlung natürlich wieder, ohne an einen medizinischen Verband denken zu lassen.
- source_word: מֶשִׁי
  choice: Seide
  rationale: Das seltene Wort bezeichnet offenbar einen kostbaren Stoff; „Seide“ ist die traditionelle und im Luxuskontext plausible Wiedergabe. Die verbleibende lexikalische Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: וָאֲכַסֵּךְ
  choice: bedeckte dich
  rationale: כסה bedeutet grundlegend „bedecken“ oder „verhüllen“. „Bedeckte dich“ folgt dem hebräischen Ausdruck direkt und passt zur Folge kostbarer Stofflagen.
