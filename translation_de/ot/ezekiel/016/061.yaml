  text: וְ/זָכַ֣רְתְּ אֶת דְּרָכַיִ/ךְ֮ וְ/נִכְלַמְתְּ֒ בְּ/קַחְתֵּ֗/ךְ אֶת אֲחוֹתַ֨יִ/ךְ֙ הַ/גְּדֹל֣וֹת מִמֵּ֔/ךְ אֶל הַ/קְּטַנּ֖וֹת מִמֵּ֑/ךְ וְ/נָתַתִּ֨י אֶתְ/הֶ֥ן לָ֛/ךְ לְ/בָנ֖וֹת וְ/לֹ֥א מִ/בְּרִיתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/061.yaml
  text: Then you will remember your ways and be ashamed when you receive your sisters[a], those older than you along with those younger than you; and I will give them to you as daughters[b], but not because of your covenant.
translation:
  language: de
  text: Dann wirst du dich an deine Wege erinnern und dich schämen, wenn du deine Schwestern aufnimmst[a], die Älteren ebenso wie die Jüngeren; und ich werde sie dir zu Töchtern geben, jedoch nicht aufgrund deines Bundes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn du deine Schwestern zu dir nimmst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: „aber nicht aus deinem Bund“ oder „nicht durch deinen Bund“. Die knappe hebräische Formulierung lässt offen, in welchem genauen Sinn der Bund nicht die Grundlage dafür ist.'
    reason: textual_clarification
lexical_decisions:
- source_word: וְזָכַרְתְּ
  choice: Dann wirst du dich … erinnern
  rationale: Das Qal Perfekt mit וְ hat im prophetischen Zusammenhang futurisch-resultative Bedeutung. „Dann“ macht den Folgezusammenhang deutlich, ohne die Grundbedeutung von זכר zu verändern.
- source_word: דְּרָכַיִךְ
  choice: deine Wege
  rationale: Bewahrt die hebräische Wegmetapher für Jerusalems Lebensführung und ist im prophetischen Sprachgebrauch verständlich.
- source_word: וְנִכְלַמְתְּ
  choice: und dich schämen
  rationale: נכלם bezeichnet Beschämung oder Schande; die reflexive Formulierung gibt die innere Reaktion in natürlichem Deutsch wieder.
- source_word: בְּקַחְתֵּךְ
  choice: wenn du … aufnimmst
  rationale: Der Infinitiv mit בְּ wird temporal wiedergegeben. „Aufnehmen“ bewahrt den Vorgang des Annehmens und passt zur folgenden Eingliederung als Töchter; das wörtlichere „nimmst“ bleibt als Alternative vermerkt.
- source_word: אֲחוֹתַיִךְ
  choice: deine Schwestern
  rationale: Die familiäre Bildsprache des Kapitels wird unverändert beibehalten.
- source_word: הַגְּדֹלוֹת מִמֵּךְ אֶל הַקְּטַנּוֹת מִמֵּךְ
  choice: die älteren ebenso wie die jüngeren
  rationale: „Größer“ und „kleiner“ bezeichnen im Geschwisterbild idiomatisch ältere und jüngere Schwestern. „Ebenso wie“ verbindet beide Gruppen natürlich, ohne eine Rangdeutung einzutragen.
- source_word: וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  choice: und ich werde sie dir zu Töchtern geben
  rationale: „Zu Töchtern geben“ folgt der hebräischen Konstruktion eng und bleibt in gehobenem modernem Deutsch verständlich.
- source_word: וְלֹא מִבְּרִיתֵךְ
  choice: jedoch nicht aufgrund deines Bundes
  rationale: מִן kann hier Herkunft oder Grundlage bezeichnen. „Aufgrund“ wahrt die Aussage, dass die Gabe nicht aus Jerusalems Bund hervorgeht, ohne die genaue Bundesbeziehung weiter festzulegen.
theological_decisions:
- issue: Bedeutung von „deinem Bund“ im Schlusssatz
  choice: Die Gabe der Schwestern als Töchter beruht nicht auf Jerusalems Bund.
  alternative: Sie geschieht nicht im Rahmen oder kraft eines von Jerusalem ausgehenden Bundes.
  rationale: Die Übersetzung bewahrt die Verneinung einer Grundlage in „deinem Bund“, ohne festzulegen, ob damit Jerusalems Bundesanspruch, Bundesstatus oder ein von ihr geschlossener Bund gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Weg- und Familienmetaphorik. Die feminine Anrede Jerusalems ist im Deutschen vor allem durch „deine Schwestern“ erkennbar. Der Schlusssatz bleibt bewusst knapp und theologisch offen.
