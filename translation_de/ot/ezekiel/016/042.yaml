base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/042.yaml
  text: So I will satisfy my wrath against you[a], and my jealousy will turn away from you[b]; then I will be quiet and no longer be angry.
translation:
  language: de
  text: So werde ich meinen Zorn an dir stillen[a], und meine Eifersucht wird von dir weichen[b]. Dann werde ich still sein und nicht mehr zürnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meinen Zorn in dir ruhen lassen“. Gemeint ist, dass sich der Zorn an dir vollzieht und danach zur Ruhe kommt.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „mein Eifer“ bedeuten. Im Bild der ehelichen Untreue dieses Kapitels liegt „meine Eifersucht“ näher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲנִחֹתִי
  choice: werde ich … zur Ruhe bringen
  rationale: Der Hifil von נוח bedeutet hier, den Zorn zur Ruhe kommen zu lassen, also ihn nach vollzogenem Gericht zum Stillstand zu bringen. Die Formulierung bewahrt das hebräische Bild und bleibt im Deutschen verständlich.
- source_word: חֲמָתִי
  choice: meinen Zorn
  rationale: חֵמָה bezeichnet heftigen, brennenden Zorn. „Zorn“ wahrt hier den gewichtigen, gerichtlich-bundestheologischen Klang, ohne unnötig gesteigert zu wirken.
- source_word: בָּךְ
  choice: an dir
  rationale: Die Präposition bezeichnet hier die Person, an der sich der Zorn vollzieht beziehungsweise zur Ruhe kommt. „An dir“ bewahrt den Bezug enger als das interpretierendere „gegen dich“.
- source_word: וְסָרָה
  choice: wird … weichen
  rationale: סור bezeichnet das Weggehen oder Sich-Entfernen. „Weichen“ ist knapp, natürlich und erhält die räumliche Bildhaftigkeit.
- source_word: קִנְאָתִי
  choice: meine Eifersucht
  rationale: קִנְאָה kann „Eifersucht“ oder „Eifer“ bedeuten. Im durchgehenden Bild ehelicher Untreue in Hesekiel 16 ist „Eifersucht“ die kontextuell naheliegende Wiedergabe.
- source_word: מִמֵּךְ
  choice: von dir
  rationale: Die Präposition markiert die Trennung beziehungsweise Entfernung von der angesprochenen Person und wird direkt wiedergegeben.
- source_word: וְשָׁקַטְתִּי
  choice: Dann werde ich ruhig sein
  rationale: שקט bezeichnet Ruhe und Stillwerden nach Erregung oder Unruhe. „Ruhig sein“ gibt diesen Zustand idiomatisch wieder und steht in sinnvoller Beziehung zum zur Ruhe gebrachten Zorn.
- source_word: וְלֹא אֶכְעַס עוֹד
  choice: und nicht mehr zornig werden
  rationale: כעס bezeichnet das Zürnen beziehungsweise Erzürntwerden. Die Wiedergabe ist klar und erhält gegenüber dem vorherigen Substantiv „Zorn“ die Wortfeldverbindung.
theological_decisions:
- issue: Gottes Zorn und Eifersucht im ehelich-bundestheologischen Gerichtsbild
  choice: Die emotionalen und gerichtlichen Begriffe werden als „Zorn“ und „Eifersucht“ ausdrücklich beibehalten.
  alternative: „Grimm“ und „Eifer“ oder abgeschwächte Umschreibungen wie „Unmut“ und „leidenschaftlicher Einsatz“.
  rationale: Der Vers verbindet Gottes Gericht mit dem in Hesekiel 16 vorherrschenden Bild verletzter ehelicher Treue. Die Übersetzung soll weder die Härte des Zorns abschwächen noch die mögliche Bedeutung „Eifer“ ausschließen; deshalb wird die lexikalische Alternative in einer Fußnote dokumentiert.
- issue: Zur-Ruhe-Bringen des göttlichen Zorns
  choice: Die hebräische Kausativform wird bildnah als „meinen Zorn an dir zur Ruhe bringen“ wiedergegeben.
  alternative: 'Deutender: „meinen Zorn an dir stillen“ oder „meinen Zorn an dir auslassen“.'
  rationale: Die gewählte Fassung lässt offen, wie genau der Zorn zur Ruhe gelangt, während der Zusammenhang des vollzogenen Gerichts erkennbar bleibt. Sie vermeidet, über den Wortlaut hinaus eine bestimmte Theorie der Besänftigung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bildnaher Wiedergabe der hebräischen Verben. Die Satzfolge bleibt knapp und feierlich; „Eifersucht“ bewahrt den ehelichen Kontext, während die Fußnote die echte lexikalische Mehrdeutigkeit zu „Eifer“ offenhält.
