  text: גַּם אַ֣תְּ שְׂאִ֣י כְלִמָּתֵ֗/ךְ אֲשֶׁ֤ר פִּלַּלְתְּ֙ לַֽ/אֲחוֹתֵ֔/ךְ בְּ/חַטֹּאתַ֛יִ/ךְ אֲשֶׁר הִתְעַ֥בְתְּ מֵ/הֵ֖ן תִּצְדַּ֣קְנָה מִמֵּ֑/ךְ וְ/גַם אַ֥תְּ בּ֨וֹשִׁי֙ וּ/שְׂאִ֣י כְלִמָּתֵ֔/ךְ בְּ/צַדֶּקְתֵּ֖/ךְ אַחְיוֹתֵֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/052.yaml
  text: You also[a], bear your disgrace, because you pronounced judgment in favor of your sisters. By your sins in which you acted more abominably than they, they have become more righteous than you. So you too, be ashamed and bear your disgrace[b], because you made your sisters appear righteous.
translation:
  language: de
  text: Auch du, trag deine Schmach, denn du bist für deine Schwestern eingetreten.[a] Durch deine Sünden, mit denen du abscheulicher gehandelt hast als sie, stehen sie gerechter da als du.[b] So schäme auch du dich und trag deine Schmach, weil du deine Schwestern als gerecht hast erscheinen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du hast zugunsten deiner Schwestern geurteilt“ beziehungsweise „du hast für deine Schwestern Fürsprache eingelegt“. Ironisch ist gemeint: Jerusalems Sünden haben ihre Schwestern im Vergleich entlastet.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sind sie gerechter als du“. Gemeint ist eine vergleichsweise bessere Stellung, nicht uneingeschränkte Gerechtigkeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאִי כְלִמָּתֵךְ
  choice: trag deine Schmach
  rationale: Die Verbindung bezeichnet das Tragen beziehungsweise Erleiden öffentlicher Schande. „Schmach“ wahrt den ehrverletzenden Gerichtscharakter und unterscheidet sich von בּוֹשִׁי („schäme dich“).
- source_word: פִּלַּלְתְּ לַאֲחוֹתֵךְ
  choice: du bist für deine Schwestern eingetreten
  rationale: Das Piel von פלל mit ל kann ein Eintreten oder Urteilen zugunsten anderer bezeichnen. Die Formulierung erhält die ironische forensische Wirkung, ohne eine förmliche Fürsprache oder einen konkreten Gerichtsvorgang festzulegen.
- source_word: בְּחַטֹּאתַיִךְ
  choice: durch deine Sünden
  rationale: 'Das ב wird instrumental verstanden: Jerusalems Sünden bewirken, dass ihre Schwestern im Vergleich günstiger beurteilt werden.'
- source_word: אֲשֶׁר הִתְעַבְתְּ מֵהֵן
  choice: mit denen du abscheulicher gehandelt hast als sie
  rationale: Die hitpaelische Form und מִן drücken hier vergleichsweise ein abscheulicheres Verhalten aus; die Relativkonstruktion wird natürlich an „Sünden“ angeschlossen.
- source_word: תִּצְדַּקְנָה מִמֵּךְ
  choice: stehen sie gerechter da als du
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Vergleich, macht aber deutlich, dass es um ihre relative Stellung gegenüber Jerusalem geht, nicht um uneingeschränkte moralische Gerechtigkeit.
- source_word: בּוֹשִׁי
  choice: schäme dich
  rationale: Der Imperativ bezeichnet die geforderte Reaktion der Scham und wird im modernen Deutsch knapp und direkt wiedergegeben.
- source_word: בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ
  choice: weil du deine Schwestern als gerecht hast dastehen lassen
  rationale: Die Konstruktion beschreibt, wie Jerusalem ihre Schwestern durch den Kontrast ihres eigenen Verhaltens als gerecht beziehungsweise im Recht erscheinen lässt. Die kausale Formulierung ist idiomatisch und erhält die forensisch-vergleichende Spannung.
theological_decisions:
- issue: Vergleichende Gerechtigkeitsaussage über Jerusalem und ihre Schwestern
  choice: Als relative Besserstellung der Schwestern gegenüber Jerusalem wiedergeben
  alternative: Als absolute moralische Gerechtigkeit oder als förmlichen Freispruch der Schwestern wiedergeben
  rationale: 'Der Kontext und מִמֵּךְ markieren einen Vergleich: Jerusalems schlimmere Verfehlungen lassen die Schwestern gerechter dastehen. Die Formulierung nimmt dem schockierenden Urteil nichts, behauptet aber keine Sündlosigkeit.'
- issue: Forensische oder fürsprechende Nuance von פִּלַּלְתְּ
  choice: Mit dem offenen Ausdruck „für deine Schwestern eingetreten“ übersetzen
  alternative: „zugunsten deiner Schwestern Recht gesprochen“ oder „für deine Schwestern Fürsprache eingelegt“
  rationale: Das Hebräische erlaubt eine gerichtliche beziehungsweise intervenierende Nuance. Die gewählte Fassung bewahrt diese Mehrdeutigkeit und die Ironie, dass Jerusalems eigene Sünden ihre Schwestern faktisch entlasten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schmach“ trägt den öffentlichen Gerichts- und Ehraspekt, während „schäme dich“ die innere Reaktion bezeichnet. Die wiederholten Vergleichsformulierungen erhalten die scharfe Ironie des Ausgangstextes.
