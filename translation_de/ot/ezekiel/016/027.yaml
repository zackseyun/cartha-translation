reference: Ezekiel 16:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נָטִ֤יתִי יָדִ/י֙ עָלַ֔יִ/ךְ וָ/אֶגְרַ֖ע חֻקֵּ֑/ךְ וָ/אֶתְּנֵ֞/ךְ בְּ/נֶ֤פֶשׁ שֹׂנְאוֹתַ֨יִ/ךְ֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים הַ/נִּכְלָמ֖וֹת מִ/דַּרְכֵּ֥/ךְ זִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/027.yaml
  text: And behold[a], I stretched out my hand against you, and I reduced your allotted portion, and gave you over to the desire of those who hate you, the daughters of the Philistines[c][b], who are ashamed of your lewd way.
translation:
  language: de
  text: Und siehe, ich streckte meine Hand gegen dich aus, kürzte den dir bestimmten Anteil[a] und gab dich dem Verlangen[b] deiner Feindinnen preis, den Töchtern der Philister[c], die sich deines schändlichen Treibens schämten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein festgesetztes Maß“, „deine Zuteilung“ oder „deinen Anspruch“. Das hebräische Wort bezeichnet etwas Festgesetztes oder Zugeteiltes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Willen“. Das hebräische Wort bedeutet wörtlich „Seele“ und bezeichnet hier Verlangen, Begehren oder Willen.'
    reason: lexical_alternative
  - marker: c
    text: „Die Töchter der Philister“ bewahrt die prophetische Personifikation von Städten oder Bevölkerungsgruppen als Töchter.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden, feierlichen Charakter der hebräischen Wendung in einem würdigen prophetischen Register.
- source_word: נָטִיתִי יָדִי עָלַיִךְ
  choice: ich streckte meine Hand gegen dich aus
  rationale: Erhält das hebräische Bild für Gottes entschlossenes richterliches Eingreifen, ohne die konkrete Art des Gerichts näher festzulegen.
- source_word: וָאֶגְרַע חֻקֵּךְ
  choice: kürzte den dir bestimmten Anteil
  rationale: גָּרַע bezeichnet eine Verminderung; חֹק kann hier das Festgesetzte oder Zugeteilte meinen. Die Formulierung bleibt bewusst offen, ob Versorgung, Anspruch oder Anteil gemeint ist.
- source_word: וָאֶתְּנֵךְ
  choice: gab dich … preis
  rationale: Gibt den strafenden Kontext und die Auslieferung an feindliche Absichten idiomatisch wieder.
- source_word: בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
  choice: dem Verlangen deiner Feindinnen
  rationale: נֶפֶשׁ bezeichnet hier wohl Begehren, Absicht oder Willen. Das feminine Partizip wird passend zur folgenden personifizierenden Bezeichnung als „Feindinnen“ wiedergegeben.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: den Töchtern der Philister
  rationale: Bewahrt die prophetische Personifikation von Städten oder Bevölkerungsgruppen als Töchter und vermeidet eine Verengung auf einzelne Frauen.
- source_word: הַנִּכְלָמוֹת
  choice: die sich … schämten
  rationale: Drückt die beschämte beziehungsweise moralisch abgestoßene Reaktion auf Jerusalems Verhalten natürlich aus.
- source_word: מִדַּרְכֵּךְ זִמָּה
  choice: deines schändlichen Treibens
  rationale: זִמָּה trägt hier im Rahmen der Allegorie eine sexuell-moralische Bedeutung. „Schändliches Treiben“ ist verständlich und kräftig, ohne die Wendung unnötig einzuengen.
theological_decisions:
- issue: Gerichtsbild innerhalb der Allegorie von Jerusalems Untreue
  choice: Die göttliche Ich-Rede, das Bild der ausgestreckten Hand und die sexuell-moralische Anklage bleiben erhalten.
  alternative: Das Bild in eine abstrakte Aussage über Strafe und allgemeine Bosheit auflösen.
  rationale: Der Vers gehört zu einer ausgedehnten prophetischen Allegorie. Eine bildtreue Wiedergabe wahrt sowohl die Härte des Gerichts als auch die Spannung des Vergleichs, ohne zusätzliche Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildsprache. Die feminine Anrede Jerusalems und die dazugehörigen femininen Feindbezeichnungen werden bewahrt; echte lexikalische Mehrdeutigkeit wird in den Fußnoten offengehalten.
