  text: וּ/מַאֲכָֽלְ/ךָ֙ אֲשֶׁ֣ר תֹּאכֲלֶ֔/נּוּ בְּ/מִשְׁק֕וֹל עֶשְׂרִ֥ים שֶׁ֖קֶל לַ/יּ֑וֹם מֵ/עֵ֥ת עַד עֵ֖ת תֹּאכֲלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/010.yaml
  text: And your food that you shall eat shall be by weight[a], twenty shekels a day[b]; from time to time you shall eat it.
translation:
  language: de
  text: 'Und deine Nahrung, die du essen sollst, soll nach Gewicht bemessen sein: zwanzig Schekel[a] pro Tag. Von Zeit zu Zeit[b] sollst du sie essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schekel war hier eine Gewichtseinheit, nicht notwendigerweise eine Münze.
    reason: cultural_note
  - marker: b
    text: 'Oder: »zu festgesetzten Zeiten«. Wörtlich: »von Zeit bis Zeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכָלְךָ
  choice: deine Nahrung
  rationale: מַאֲכָל bezeichnet Nahrung beziehungsweise etwas, das gegessen wird. »Nahrung« ist im Zusammenhang einer streng bemessenen Ration natürlich und würdevoll.
- source_word: אֲשֶׁר תֹּאכֲלֶנּוּ
  choice: die du essen sollst
  rationale: Der Relativsatz bestimmt die betreffende Nahrung näher; »sollst« gibt die anweisende Kraft des hebräischen Imperfekts wieder.
- source_word: בְּמִשְׁקוֹל
  choice: soll abgewogen sein
  rationale: מִשְׁקוֹל bezeichnet das Gewicht. Die Formulierung bringt idiomatisch zum Ausdruck, dass die Ration nach Gewicht festgelegt wird.
- source_word: עֶשְׂרִים שֶׁקֶל
  choice: zwanzig Schekel
  rationale: Die historische Gewichtseinheit bleibt im Haupttext erhalten; eine moderne Umrechnung wäre wegen schwankender antiker Standards nur näherungsweise möglich.
- source_word: לַיּוֹם
  choice: pro Tag
  rationale: Die Wendung gibt die tägliche Zuteilung distributiv an; »pro Tag« ist im Deutschen klar und natürlich.
- source_word: מֵעֵת עַד עֵת
  choice: von einer festgesetzten Zeit bis zur nächsten
  rationale: Die wörtlich zeitliche Wendung bezeichnet abgegrenzte beziehungsweise festgelegte Essenszeiten. Die Übersetzung bewahrt sowohl die Spanne als auch den geregelten Charakter.
- source_word: תֹּאכֲלֶנּוּ
  choice: sollst du sie essen
  rationale: Die Wiederholung des Verbs am Satzende wird beibehalten und wahrt den nachdrücklichen Anweisungston.
theological_decisions:
- issue: Art der zeitlichen Regelung in מֵעֵת עַד עֵת
  choice: von einer festgesetzten Zeit bis zur nächsten
  alternative: von Zeit zu Zeit / zu festgesetzten Zeiten
  rationale: Der Kontext spricht für geregelte Essenszeiten, doch der hebräische Ausdruck nennt keinen genauen Zeitplan. Die gewählte Fassung lässt diese Unbestimmtheit bestehen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klarem Anweisungston. Die hebräische Wiederholung von »essen« bleibt erhalten. Die Fußnotenmarker stehen jeweils direkt bei der erklärten Einheit beziehungsweise Zeitformel.
