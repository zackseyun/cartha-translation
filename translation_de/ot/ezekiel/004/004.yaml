source:
  edition: WLC
  text: וְ/אַתָּ֤ה שְׁכַב֙ עַל צִדְּ/ךָ֣ הַ/שְּׂמָאלִ֔י וְ/שַׂמְתָּ֛ אֶת עֲוֺ֥ן בֵּֽית יִשְׂרָאֵ֖ל עָלָ֑י/ו מִסְפַּ֤ר הַ/יָּמִים֙ אֲשֶׁ֣ר תִּשְׁכַּ֣ב עָלָ֔י/ו תִּשָּׂ֖א אֶת עֲוֺנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/004.yaml
  text: And you[a], lie on your left side, and place the iniquity of the house of Israel upon it; for the number of the days that you lie on it, you shall bear their iniquity.
translation:
  language: de
  text: Und du, leg dich auf deine linke Seite und lege die Schuld[a] des Hauses Israel darauf. So viele Tage, wie du darauf liegst, sollst du ihre Schuld tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Verfehlung“ oder „Strafe“ bedeuten; es kann die Tat selbst, die daraus entstehende Schuld oder ihre Folgen bezeichnen. Dies gilt für beide Vorkommen in diesem Vers.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכַב
  choice: leg dich
  rationale: Der Imperativ bezeichnet das Einnehmen einer liegenden Körperhaltung. „Leg dich“ ist im modernen Deutsch natürlich und direkt.
- source_word: צִדְּךָ הַשְּׂמָאלִי
  choice: deine linke Seite
  rationale: צַד bezeichnet hier die Körperseite; die übliche deutsche Wendung lautet „auf die linke Seite“.
- source_word: וְשַׂמְתָּ
  choice: lege
  rationale: שׂים bedeutet „legen, setzen, stellen“. „Lege“ passt zur räumlichen Darstellung der symbolischen Handlung und entspricht dem Bezug auf die Seite.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann Verfehlung, daraus erwachsende Schuld oder deren Straflast bezeichnen. „Schuld“ bewahrt im Deutschen sowohl die moralische als auch die zu tragende Last; die weitere Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die traditionelle kollektive Bezeichnung wird formal bewahrt und bleibt im biblischen Register verständlich.
- source_word: עָלָיו
  choice: auf sie / auf ihr
  rationale: Das maskuline hebräische Pronomen bezieht sich am natürlichsten auf צַד „Seite“. Im Deutschen verlangt das feminine „Seite“ entsprechend „sie/ihr“.
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר
  choice: So viele Tage du …
  rationale: Die idiomatische deutsche Konstruktion gibt die gezählte Dauer präzise wieder, ohne die schwerfällige Formulierung „nach der Zahl der Tage, die“.
- source_word: תִּשָּׂא
  choice: sollst du … tragen
  rationale: נשׂא mit עָוֹן bezeichnet das Tragen einer moralischen oder strafrechtlichen Last. „Schuld tragen“ bewahrt das Lastbild und den verpflichtenden Zukunftssinn.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: Das Suffix verweist kollektiv auf die Angehörigen des Hauses Israel. Die Wiederholung von „Schuld“ bildet die Wiederholung desselben hebräischen Wortes ab.
theological_decisions:
- issue: Bedeutung des symbolischen Tragens von Israels עָוֹן durch Ezechiel
  choice: „ihre Schuld tragen“ als prophetische Zeichenhandlung, ohne sie ausdrücklich als stellvertretende Sühne zu deuten
  alternative: „ihre Strafe tragen“ oder „ihre Verfehlung tragen“
  rationale: Der Vers lässt bei עָוֹן die Aspekte Verfehlung, Schuld und Straffolge ineinandergreifen. Die Übersetzung bewahrt diese Spannung und fügt keine ausgearbeitete Sühnelehre ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe an der hebräischen Zeichenhandlung; „So viele Tage …“ vermeidet eine unnötig sperrige wörtliche Konstruktion. Der Fußnotenmarker steht nach dem Satz, auf dessen beide Vorkommen von „Schuld“ er sich bezieht.
