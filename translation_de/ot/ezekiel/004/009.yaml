  text: וְ/אַתָּ֣ה קַח לְ/ךָ֡ חִטִּ֡ין וּ֠/שְׂעֹרִים וּ/פ֨וֹל וַ/עֲדָשִׁ֜ים וְ/דֹ֣חַן וְ/כֻסְּמִ֗ים וְ/נָתַתָּ֤ה אוֹתָ/ם֙ בִּ/כְלִ֣י אֶחָ֔ד וְ/עָשִׂ֧יתָ אוֹתָ֛/ם לְ/ךָ֖ לְ/לָ֑חֶם מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר אַתָּ֣ה שׁוֹכֵ֣ב עַֽל צִדְּ/ךָ֗ שְׁלֹשׁ מֵא֧וֹת וְ/תִשְׁעִ֛ים י֖וֹם תֹּאכֲלֶֽ/נּוּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
translation:
  language: de
  text: Und du, nimm dir Weizen und Gerste, Bohnen und Linsen, Hirse und Dinkel[a]. Gib sie zusammen in ein einziges Gefäß und mach dir daraus Brot. So viele Tage, wie du auf deiner Seite liegst – dreihundertneunzig Tage –, sollst du davon essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Emmer“ beziehungsweise „eine Weizenart“; welche alte Getreideart mit כֻסְּמִים genau gemeint ist, ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: nimm dir
  rationale: Der Imperativ mit לְךָ hat benefaktive beziehungsweise reflexive Kraft; „nimm dir“ gibt sie im Deutschen knapp und natürlich wieder.
- source_word: חִטִּין וּשְׂעֹרִים
  choice: Weizen und Gerste
  rationale: Dies sind die üblichen und sachlich sicheren deutschen Bezeichnungen der genannten Getreidearten.
- source_word: פּוֹל וַעֲדָשִׁים
  choice: Bohnen und Linsen
  rationale: „Bohnen“ vermeidet eine unnötig enge botanische Festlegung; „Linsen“ ist die eindeutige Standardentsprechung.
- source_word: דֹחַן
  choice: Hirse
  rationale: Die gebräuchliche Identifikation des alten Getreidenamens ist Hirse.
- source_word: כֻסְּמִים
  choice: Dinkel
  rationale: „Dinkel“ ist die traditionelle und weiterhin mögliche Wiedergabe; weil die genaue Bestimmung unsicher ist, nennt die Fußnote Alternativen.
- source_word: בִּכְלִי אֶחָד
  choice: in ein einziges Gefäß
  rationale: „Gefäß“ wahrt den konkreten, zugleich unspezifischen Sinn von כְּלִי; „ein einziges“ verdeutlicht, dass alle Zutaten zusammengegeben werden.
- source_word: וְעָשִׂיתָ אוֹתָם לְךָ לְלָחֶם
  choice: mach dir daraus Brot
  rationale: Die Formulierung gibt sowohl die Herstellung von Brot aus den Zutaten als auch den benefaktiven Bezug idiomatisch wieder.
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר אַתָּה שׁוֹכֵב עַל צִדְּךָ
  choice: So viele Tage, wie du auf deiner Seite liegst
  rationale: Diese natürliche deutsche Zeitangabe bewahrt die Entsprechung zwischen der Dauer des Liegens und der Dauer des Essens.
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: dreihundertneunzig Tage
  rationale: Die ausgeschriebene Zahl entspricht dem gehobenen, aber modernen Bibelregister.
- source_word: תֹּאכֲלֶנּוּ
  choice: sollst du davon essen
  rationale: Das singularische Suffix bezieht sich sinngemäß auf das Brot; „davon“ stellt diesen Bezug im Deutschen verständlich her, ohne die zuvor pluralisch genannten Zutaten zum direkten Objekt zu machen.
theological_decisions: []
