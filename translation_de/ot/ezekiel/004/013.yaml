id: EZK.4.13
reference: Ezekiel 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כָּ֣כָה יֹאכְל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת לַחְמָ֖/ם טָמֵ֑א בַּ/גּוֹיִ֕ם אֲשֶׁ֥ר אַדִּיחֵ֖/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/013.yaml
  text: And Yahweh said[c][b][a], “Thus the sons of Israel will eat their bread unclean among the nations where I will drive them.”
translation:
  language: de
  text: 'Und Jahwe sagte: „So werden die Israeliten[a] ihr Brot unrein[b] unter den Völkern essen, unter die ich sie vertreiben[c] werde.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; gemeint ist das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verunreinigt“. Das Wort bezeichnet besonders kultische beziehungsweise rituelle Unreinheit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verbannen“ beziehungsweise „zerstreuen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּכָה
  choice: So
  rationale: Bewahrt den Hinweis auf die vorgeführte Art und Weise und klingt im modernen Deutschen natürlich.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ bezeichnet hier korporativ das Volk Israel; „die Israeliten“ ist im Deutschen eindeutig und natürlich.
- source_word: לַחְמָם
  choice: ihr Brot
  rationale: Bewahrt das konkrete Bild des Brotes, das für die Zeichenhandlung im Kontext wesentlich ist.
- source_word: טָמֵא
  choice: unrein
  rationale: Erhält den kultisch-rituellen Bedeutungsgehalt des hebräischen Reinheitsbegriffs.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Bezeichnet die fremden Nationen, in deren Mitte Israel im Exil leben wird, ohne spätere Bedeutungsnuancen von „Heiden“ einzutragen.
- source_word: אַדִּיחֵם
  choice: ich sie vertreiben werde
  rationale: Gibt die kausative Bedeutung des Verbs als gewaltsames Wegtreiben beziehungsweise Verbannen wieder.
- source_word: שָׁם
  choice: unter die
  rationale: Das örtliche „dort“ wird im Deutschen idiomatisch durch einen Relativanschluss an „Völker“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes; die Transliteration bewahrt ihn sichtbar.
- issue: Korporative Wendung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung umfasst hier das ganze Volk. Die natürliche deutsche Kollektivbezeichnung vermeidet das mögliche Missverständnis, nur männliche Einzelpersonen seien gemeint.
- issue: Reinheitssprache טָמֵא
  choice: unrein
  alternative: verunreinigt
  rationale: „Unrein“ lässt offen, ob vor allem der Zustand des Brotes oder seine kultische Befleckung durch die Bedingungen des Exils betont wird, und wahrt die rituelle Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „So“ nimmt unmittelbar auf die vorangehende Zeichenhandlung Bezug. Der Satzbau mit „unter die“ ist idiomatisch und bewahrt zugleich die räumliche Bewegung des Vertreibens.
