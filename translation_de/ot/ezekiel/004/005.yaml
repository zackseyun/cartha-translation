source:
  edition: WLC
  text: וַ/אֲנִ֗י נָתַ֤תִּֽי לְ/ךָ֙ אֶת שְׁנֵ֣י עֲוֺנָ֔/ם לְ/מִסְפַּ֣ר יָמִ֔ים שְׁלֹשׁ מֵא֥וֹת וְ/תִשְׁעִ֖ים י֑וֹם וְ/נָשָׂ֖אתָ עֲוֺ֥ן בֵּֽית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/005.yaml
  text: And I have assigned to you the years of their iniquity according to the number of days[a], three hundred and ninety days, and you shall bear the iniquity of the house of Israel.
translation:
  language: de
  text: 'Ich aber habe dir die Jahre ihrer Schuld[a] nach der Zahl der Tage zugemessen: dreihundertneunzig Tage; du sollst die Schuld des Hauses Israel tragen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Jahre ihrer Vergehen“ beziehungsweise „die Jahre ihrer Bestrafung“; das hebräische Wort kann Vergehen, Schuld oder die aus der Schuld folgende Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: habe … auferlegt
  rationale: Das Verb bedeutet wörtlich „geben“, bezeichnet hier aber die Zuweisung einer belastenden Zeitspanne im prophetischen Zeichenhandeln. „Auferlegt“ gibt diesen Zusammenhang natürlich wieder.
- source_word: שְׁנֵי עֲוֺנָם
  choice: die Jahre ihrer Schuld
  rationale: Die Konstruktion lautet wörtlich „die Jahre ihrer Schuld“. „Schuld“ bewahrt im Deutschen die mögliche Bezugnahme auf Verfehlung, Schuldzustand und daraus folgende Straflast besser als das heute ungebräuchlichere „Missetat“.
- source_word: לְמִסְפַּר יָמִים
  choice: als entsprechende Anzahl von Tagen
  rationale: Die Wendung bezeichnet die zahlenmäßige Entsprechung zwischen Jahren und Tagen. Diese Wiedergabe macht die symbolische Zuordnung verständlich, ohne das Verhältnis über den hebräischen Text hinaus festzulegen.
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: dreihundertneunzig Tage
  rationale: Direkte und idiomatische Wiedergabe der Kardinalzahl mit dem Substantiv.
- source_word: וְנָשָׂאתָ עֲוֺן
  choice: So sollst du die Schuld … tragen
  rationale: נשא mit עָוֹן ist eine feste Verbindung für das Tragen von Schuld beziehungsweise ihrer Folgen. „Schuld tragen“ bewahrt sowohl das Bild als auch dessen theologische Spannung.
- source_word: בֵּית יִשְׂרָאֵל
  choice: des Hauses Israel
  rationale: Die traditionelle und verständliche Wiedergabe erhält den korporativen Charakter der hebräischen Bezeichnung.
theological_decisions:
- issue: Bedeutungsumfang von עָוֹן im prophetischen Zeichenhandeln
  choice: Schuld in beiden Vorkommen
  alternative: Vergehen; Strafe für die Schuld
  rationale: עָוֹן kann die Verfehlung, die dadurch entstandene Schuld oder deren strafende Folge bezeichnen. „Schuld“ lässt diese Zusammenhänge offen, während das Verb „tragen“ die Last und mögliche Folge der Schuld anklingen lässt.
- issue: Verhältnis von Jahren und Tagen
  choice: Die Jahre werden als entsprechende Anzahl von Tagen auferlegt
  alternative: Ein Tag für jedes Jahr
  rationale: Der Vers selbst spricht von den Jahren ihrer Schuld entsprechend der Anzahl von Tagen. Die explizite Formel „ein Tag für jedes Jahr“ folgt erst im weiteren Zusammenhang; sie wird hier nicht in den Wortlaut eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erleichtert das Verständnis des langen hebräischen Satzes. „Haus Israel“ bleibt als korporative biblische Bezeichnung erhalten; „Schuld tragen“ wahrt die prägnante Bildsprache.
