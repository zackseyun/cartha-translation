  source_fidelity: Der Entwurf gibt die Satzstruktur, das vollzogene Handeln Gottes, die Negation des Seitenwechsels und den Endpunkt der angeordneten Tage im Wesentlichen zutreffend wieder. „Stricke anlegen“ ist jedoch als Wiedergabe von „Stricke auf/über dich legen“ semantisch und idiomatisch weniger klar; es kann im Deutschen auch bloß das Anlegen von Schlingen nahelegen.
  naturalness: „Und sieh“ ist verständlich, wirkt im modernen Standarddeutsch aber weniger idiomatisch als das traditionsübergreifend etablierte, zugleich noch natürliche „Siehe“. „Sich von einer Seite auf die andere wenden“ ist für die gemeinte Liegebewegung deutlich natürlicher als „sich ... drehen“ und vermeidet die sperrige Formulierung „von deiner einen Seite auf deine andere“.
  terminology: „Stricke“ ist als konkrete Wiedergabe von עֲבוֹתִים vertretbar. Die Alternative „Bande“ ist im heutigen Deutsch missverständlich bzw. unüblich; „Fesseln“ und „Seile“ sind brauchbare lexikalische Alternativen. „Belagerung“ bewahrt das knappe Possessivverhältnis des Hebräischen ohne interpretierende Auflösung.
