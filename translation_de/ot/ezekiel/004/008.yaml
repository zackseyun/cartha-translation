base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/008.yaml
  text: And behold[a], I have put ropes on you[b], and you will not turn yourself from your side to your other side until you have completed the days of your siege.
translation:
  language: de
  text: Siehe, ich habe Stricke[a] über dich gelegt, und du wirst dich nicht von einer Seite auf die andere wenden[b], bis du die Tage deiner Belagerung vollendet hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Seile“ oder „Fesseln“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von deiner Seite zu deiner Seite“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Gibt die aufmerksamkeitslenkende Funktion der hebräischen Partikel in natürlichem, zugleich feierlichem Deutsch wieder.
- source_word: נָתַתִּי עָלֶיךָ עֲבוֹתִים
  choice: Ich habe dir Stricke angelegt
  rationale: Das Perfekt bezeichnet die als vollzogen dargestellte Handlung; „Stricke anlegen“ ist im Deutschen idiomatisch und macht die bindende Funktion deutlich.
- source_word: וְלֹא תֵהָפֵךְ
  choice: und du wirst dich nicht … drehen
  rationale: Bewahrt die direkte Negation und die körperliche Bewegung des hebräischen Nifal, ohne die mögliche Folgerung „du kannst nicht“ ausdrücklich in den Text einzutragen.
- source_word: מִצִּדְּךָ אֶל צִדֶּךָ
  choice: von deiner einen Seite auf deine andere
  rationale: Gibt den Seitenwechsel beim Liegen verständlich wieder und bleibt der ungewöhnlichen Wiederholung von „deine Seite“ möglichst nahe.
- source_word: עַד כַּלּוֹתְךָ יְמֵי מְצוּרֶךָ
  choice: bis du die Tage deiner Belagerung vollendet hast
  rationale: Erhält die konkrete Zeitangabe „Tage“, den Abschluss der auferlegten Zeichenhandlung und das Possessivsuffix bei „Belagerung“.
theological_decisions:
- issue: Bezug von „deiner Belagerung“
  choice: Die possessive Form bleibt unaufgelöst stehen und bezeichnet im Kontext die von Ezechiel dargestellte Belagerung.
  alternative: Den Ausdruck erläuternd als „die Tage, in denen du die Belagerung darstellst“ wiedergeben.
  rationale: Der hebräische Text lässt die Beziehung knapp und spannungsvoll; eine erklärende Auflösung würde mehr Kontextdeutung in den Vers eintragen, als dort ausdrücklich steht.
- issue: Negation oder ausdrücklich bezeichnete Unfähigkeit
  choice: „du wirst dich nicht … drehen“
  alternative: „du kannst dich nicht … drehen“
  rationale: Die Stricke legen eine tatsächliche Einschränkung nahe, doch der hebräische Wortlaut formuliert unmittelbar eine verneinte Handlung. Die Übersetzung bewahrt diese Form, ohne die kausale Deutung auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ bewahrt den markierten prophetischen Auftakt; die Satzstruktur bleibt eng am Hebräischen, wird aber durch idiomatische deutsche Wendungen verständlich gehalten.
