    rationale: Die Wendung ist hier weniger natürlich und bildet die lokale Vorstellung von נָתַתִּי עָלֶיךָ („ich habe ... auf/über dich gelegt“) nicht klar ab. „Stricke über dich gelegt“ ist näher am Bild und verständlich.
