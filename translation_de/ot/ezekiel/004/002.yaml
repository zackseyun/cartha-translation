base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/002.yaml
  text: And set a siege against it[a], and build a siege wall against it, and heap up a ramp against it, and set camps against it[b], and place battering rams against it all around.
translation:
  language: de
  text: Belagere sie, errichte ein Belagerungswerk[a] gegen sie, schütte eine Belagerungsrampe[b] gegen sie auf, schlage Heerlager gegen sie auf und stelle ringsum Rammböcke gegen sie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „einen Belagerungswall“ oder „einen Belagerungsturm“. Das hebräische Wort דָּיֵק bezeichnet eine Belagerungsanlage, deren genaue Bauart unsicher ist.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: einen gegen die Stadtmauer aufgeschütteten Erdwall.'
    reason: lexical_clarification
lexical_decisions:
- source_word: מָצוֹר
  choice: belagere
  rationale: Das Substantiv bezeichnet hier eine militärische Belagerung. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt den Aufforderungscharakter.
- source_word: דָּיֵק
  choice: Belagerungswerk
  rationale: Der seltene Ausdruck bezeichnet eine gegen die Stadt errichtete Belagerungsanlage; der Oberbegriff vermeidet eine nicht gesicherte Festlegung auf Wall oder Turm.
- source_word: סֹלְלָה
  choice: Belagerungsrampe
  rationale: Gemeint ist ein aufgeschütteter Erdwall beziehungsweise eine Rampe, die den Angriff auf die Stadtmauer ermöglicht.
- source_word: מַחֲנוֹת
  choice: Heerlager
  rationale: Der Plural bezeichnet im Belagerungszusammenhang militärische Lager. „Heerlager“ macht diesen Sinn knapp und eindeutig.
- source_word: כָּרִים
  choice: Rammböcke
  rationale: Im militärischen Zusammenhang sind Belagerungsgeräte zum Einrammen von Mauern oder Toren gemeint, nicht männliche Schafe.
- source_word: עָלֶיהָ
  choice: gegen sie
  rationale: Die wiederholte Präposition bezeichnet die feindliche Ausrichtung gegen die dargestellte Stadt; das feminine Pronomen nimmt Jerusalem beziehungsweise die Stadt auf.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Wort bezeichnet die vollständige Umfassung und passt prägnant zum Bild der Belagerung.
- source_word: וְנָתַתָּה / וּבָנִיתָ / וְשָׁפַכְתָּ / וְנָתַתָּה / וְשִׂים
  choice: belagere / errichte / schütte ... auf / schlage ... auf / stelle ... auf
  rationale: Die aufeinanderfolgenden Formen geben göttliche Anweisungen wieder. Idiomatische deutsche Verben erhalten die konkrete Abfolge, ohne die hebräischen Konstruktionen hölzern nachzubilden.
