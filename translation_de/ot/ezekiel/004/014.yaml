  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הִנֵּ֥ה נַפְשִׁ֖/י לֹ֣א מְטֻמָּאָ֑ה וּ/נְבֵלָ֨ה וּ/טְרֵפָ֤ה לֹֽא אָכַ֨לְתִּי֙ מִ/נְּעוּרַ֣/י וְ/עַד עַ֔תָּה וְ/לֹא בָ֥א בְּ/פִ֖/י בְּשַׂ֥ר פִּגּֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/014.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I have never defiled myself. From my youth until now I have not eaten what dies of itself or what is torn by beasts[c][b], and no defiled meat has entered my mouth.”
translation:
  language: de
  text: 'Da sagte ich: „Ach, Herr Yahweh! Sieh doch, ich habe mich nie verunreinigt.[a] Von meiner Jugend an bis heute habe ich weder ein verendetes noch ein von wilden Tieren gerissenes Tier gegessen,[b] und kein verunreinigtes Fleisch[c] ist in meinen Mund gekommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Meine Seele/mein Leben ist nicht verunreinigt.“ Gemeint ist: „Ich habe mich nicht unrein gemacht.“'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Tiere, die von selbst verendeten oder von Raubtieren gerissen wurden; beides war nach Israels Reinheitsvorschriften als Nahrung unzulässig.
    reason: cultural_note
  - marker: c
    text: 'Oder: „abscheuliches Fleisch“. Das hebräische Wort bezeichnet Fleisch, das kultisch anstößig oder unzulässig geworden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ach
  rationale: Die Interjektion drückt Bestürzung und eindringlichen Protest aus; „Ach“ ist im modernen Deutschen natürlich und würdevoll.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Gibt sowohl den Herrentitel als auch den Gottesnamen wieder und vermeidet eine Einebnung der Verbindung.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Der Aufmerksamkeitsmarker unterstreicht den dringlichen Charakter von Ezechiels Einwand; „doch“ gibt den bittend-protestierenden Ton natürlich wieder.
- source_word: נַפְשִׁי לֹא מְטֻמָּאָה
  choice: ich habe mich nie verunreinigt
  rationale: Wörtlich steht „meine Seele/mein Leben ist nicht verunreinigt“. Gemeint ist Ezechiel selbst in Bezug auf kultische Reinheit; die deutsche Formulierung gibt das Idiom verständlich wieder. „Nie“ wird durch die anschließende lebenslange Zeitangabe gestützt.
- source_word: נְבֵלָה
  choice: ein verendetes Tier
  rationale: Bezeichnet den Kadaver eines Tieres, das ohne ordnungsgemäße Schlachtung starb. „Verendet“ ist präzise und im Speisekontext verständlich.
- source_word: טְרֵפָה
  choice: ein von wilden Tieren gerissenes Tier
  rationale: Bezeichnet ein von Raubtieren gerissenes oder zerfleischtes Tier; die Formulierung macht den impliziten Vorgang deutlich.
- source_word: מִנְּעוּרַי וְעַד עַתָּה
  choice: Von meiner Jugend an bis heute
  rationale: Bewahrt die Betonung einer lebenslangen Praxis und klingt im Deutschen natürlich.
- source_word: וְלֹא בָא בְּפִי
  choice: und kein … ist in meinen Mund gekommen
  rationale: Bewahrt das konkrete hebräische Bild, das hier bedeutet, dass Ezechiel solches Fleisch nicht gegessen hat.
- source_word: בְּשַׂר פִּגּוּל
  choice: verunreinigtes Fleisch
  rationale: פִּגּוּל bezeichnet kultisch anstößiges beziehungsweise unzulässiges Fleisch. „Verunreinigt“ wahrt den kultischen Bezug, ohne die genaue Ursache enger festzulegen als der Text.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Herr, HERR; Herr GOTT
  rationale: Die Wiedergabe erhält die Unterscheidung zwischen dem Titel אֲדֹנָי und dem Eigennamen יהוה und macht beide Bestandteile der hebräischen Verbindung sichtbar.
- issue: Art der Verunreinigung in נַפְשִׁי לֹא מְטֻמָּאָה und בְּשַׂר פִּגּוּל
  choice: kultisch geprägte, aber nicht übererklärte Sprache
  alternative: moralische Befleckung oder allgemein verdorbenes Fleisch
  rationale: Der Zusammenhang betrifft Speise- und Reinheitsvorschriften. Die Übersetzung wahrt diesen kultischen Rahmen, ohne zusätzliche konfessionelle oder moralische Deutungen einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Ton. Der dringliche Einwand wird durch „Ach“ und „Sieh doch“ bewahrt. Kultische Begriffe werden verständlich wiedergegeben, ohne ihre Bedeutung auf bloße Hygiene oder moralische Schuld zu verengen.
