source:
  edition: WLC
  text: וְ/אֶל מְצ֤וֹר יְרוּשָׁלִַ֨ם֙ תָּכִ֣ין פָּנֶ֔י/ךָ וּֽ/זְרֹעֲ/ךָ֖ חֲשׂוּפָ֑ה וְ/נִבֵּאתָ֖ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/007.yaml
  text: And toward the siege of Jerusalem you shall set your face[a], with your arm bared, and you shall prophesy against it.
translation:
  language: de
  text: Richte dein Gesicht auf die Belagerung Jerusalems, entblöße deinen Arm und prophezeie gegen sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über sie“. Die hebräische Präposition kann allgemeiner verstanden werden; der Zusammenhang von Belagerung und Gericht spricht hier jedoch für „gegen sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצוֹר
  choice: Belagerung
  rationale: Das Substantiv bezeichnet die Belagerung beziehungsweise den Zustand des Belagertseins. Im Zusammenhang der Zeichenhandlung ist „die Belagerung Jerusalems“ präzise und natürlich; eine Konkretisierung als „Belagerungswerke“ wäre hier nicht ausdrücklich begründet.
- source_word: תָּכִין פָּנֶיךָ
  choice: Richte dein Gesicht
  rationale: Der Hifil von כון in Verbindung mit „Gesicht“ bezeichnet das entschlossene Ausrichten auf ein Ziel. Die Formulierung bewahrt das hebräische Bild und den feierlich-prophetischen Ton.
- source_word: זְרֹעֲךָ חֲשׂוּפָה
  choice: entblöße deinen Arm
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich „und dein Arm entblößt“. Der deutsche Imperativ fügt sich natürlich in die Reihe der göttlichen Anweisungen ein und erhält das Bild der Bereitschaft zum Handeln.
- source_word: וְנִבֵּאתָ עָלֶיהָ
  choice: und weissage gegen die Stadt
  rationale: נבא mit עַל kann in einem Gerichtszusammenhang eine gegnerische Ausrichtung ausdrücken. „Die Stadt“ macht den Bezug des femininen Suffixes auf Jerusalem im Deutschen eindeutig, ohne Jerusalem unnötig zu wiederholen.
theological_decisions:
- issue: Ausrichtung der prophetischen Rede auf Jerusalem
  choice: „gegen die Stadt“ gibt im Kontext von Belagerung und Gericht die adversative Bedeutung wieder.
  alternative: „über sie“ oder „in Bezug auf sie“ wäre neutraler und lexikalisch ebenfalls möglich.
  rationale: Die Präposition עַל hat ein breiteres Bedeutungsspektrum als „gegen“. In dieser Zeichenhandlung, die Jerusalems Belagerung und Gericht ankündigt, ist die gegnerisch-gerichtliche Nuance jedoch vorrangig. Die Fußnote hält die echte lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Imperativfolge entspricht dem hebräischen Befehlscharakter; „Richte dein Gesicht“ bewahrt bewusst das markante biblische Bild, bleibt aber verständlich.
