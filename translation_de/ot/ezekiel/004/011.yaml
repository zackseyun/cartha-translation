lexical_decisions:
- source_word: וּמַיִם
  choice: Und Wasser
  rationale: מַיִם bedeutet „Wasser“; das vorangestellte ו setzt die Reihe der Anweisungen mit „Und“ fort.
- source_word: בִּמְשׂוּרָה
  choice: nach Maß
  rationale: מְשׂוּרָה bezeichnet eine abgemessene Menge. „Nach Maß“ ist im Deutschen knapp und gibt die Rationierung wieder.
- source_word: תִשְׁתֶּה
  choice: sollst du trinken
  rationale: Das Qal-Imperfekt der 2. Person Singular maskulin hat hier anweisenden Charakter; „sollst du trinken“ wahrt diesen Ton.
- source_word: שִׁשִּׁית הַהִין
  choice: ein Sechstel Hin
  rationale: Die konkrete antike Maßeinheit bleibt erhalten, statt durch eine unsichere moderne Umrechnung ersetzt zu werden.
- source_word: מֵעֵת עַד עֵת
  choice: Von Zeit zu Zeit
  rationale: Die Wendung bedeutet wörtlich „von Zeit bis Zeit“ und bezeichnet hier ein zeitlich geregeltes, wiederholtes Trinken.
- source_word: תִּשְׁתֶּה
  choice: sollst du trinken
  rationale: Die Wiederholung des Verbs wird entsprechend dem Hebräischen beibehalten und unterstreicht die geregelte Aufnahme des Wassers.
