  yaml_path: translation/ot/ezekiel/004/011.yaml
  text: And you shall drink water by measure[a], a sixth of a hin; from time to time you shall drink.
translation:
  language: de
  text: 'Und Wasser sollst du abgemessen trinken: ein Sechstel eines Hin. Von Zeit zu Zeit[a] sollst du trinken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu festgesetzten Zeiten sollst du trinken.'
