source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ קַח לְ/ךָ֣ לְבֵנָ֔ה וְ/נָתַתָּ֥ה אוֹתָ֖/הּ לְ/פָנֶ֑י/ךָ וְ/חַקּוֹתָ֥ עָלֶ֛י/הָ עִ֖יר אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/001.yaml
  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
translation:
  language: de
  text: 'Und du, Menschensohn, nimm dir einen Ziegelstein, lege ihn vor dich hin und ritze darauf[a] eine Stadt ein: Jerusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zeichne darauf eine Stadt ein. Das hebräische Verb kann das Einritzen oder Eingravieren bezeichnen; hier geht es darum, Jerusalem auf dem Ziegel darzustellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die wörtliche und in Hesekiel wiederkehrende Anrede wird beibehalten. Sie bezeichnet hier den menschlichen Propheten und wird nicht durch die deutenderen Wiedergaben „Mensch“ oder „Sterblicher“ ersetzt.
- source_word: לְבֵנָה
  choice: Ziegelstein
  rationale: Das Substantiv bezeichnet einen Ziegel. „Ziegelstein“ ist im heutigen Deutsch eindeutig und lässt offen, ob er hier noch ungebrannt war.
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  choice: lege ihn vor dich hin
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“. Im Zusammenhang mit einem Ziegel gibt „lege … hin“ die konkrete Handlung natürlich wieder, ohne seine Verwendung als flache Darstellungsfläche ausdrücklich in den Text einzutragen.
- source_word: וְחַקּוֹתָ עָלֶיהָ
  choice: ritze darauf … ein
  rationale: חקק bezeichnet das Einritzen oder Eingravieren. Die gewählte Formulierung bewahrt den konkreten Vorgang auf der Oberfläche des Ziegels; die mögliche allgemeinere Wiedergabe wird in der Fußnote genannt.
- source_word: עִיר אֶת יְרוּשָׁלִָם
  choice: 'eine Stadt …: Jerusalem'
  rationale: „Eine Stadt“ ist unbestimmt; „Jerusalem“ bestimmt anschließend in Apposition, welche Stadt dargestellt werden soll. Der Doppelpunkt macht dieses Verhältnis im Deutschen klar, ohne „die Stadt“ in den hebräischen Text hineinzulesen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende Anrede „Menschensohn“ bleibt erhalten; Satzbau und Imperative sind bewusst klar und konkret gehalten.
