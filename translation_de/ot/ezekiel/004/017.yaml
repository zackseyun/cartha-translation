  text: לְמַ֥עַן יַחְסְר֖וּ לֶ֣חֶם וָ/מָ֑יִם וְ/נָשַׁ֨מּוּ֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/נָמַ֖קּוּ בַּ/עֲוֺנָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/017.yaml
  text: so that they may lack bread and water[a], and each man and his brother may be appalled[b], and waste away in their iniquity.
translation:
  language: de
  text: damit ihnen Brot und Wasser fehlen und sie, jeder mit seinem Bruder, entsetzt sind[a] und in ihrer Schuld dahinschwinden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »erstarrt« beziehungsweise »fassungslos«. Das hebräische Verb kann sowohl Verwüstung als auch den dadurch ausgelösten Zustand des Entsetzens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in ihren Vergehen« beziehungsweise »an der Strafe für ihre Schuld«. Das hebräische Wort kann Vergehen, Schuld oder die daraus folgende Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den beabsichtigten beziehungsweise eintretenden Ausgang der vorausgehenden Zeichenhandlung ein und bewahrt die Ziel- und Folgekomponente knapp.
- source_word: יַחְסְרוּ
  choice: es ihnen … mangelt
  rationale: Gibt חסר idiomatisch als Mangel an etwas wieder; die Verbform bezeichnet die angekündigte Folge.
- source_word: לֶחֶם וָמָיִם
  choice: Brot und Wasser
  rationale: Bewahrt das konkrete hebräische Wortpaar für die elementaren Lebensbedürfnisse, statt es zu »Nahrung und Wasser« zu verallgemeinern.
- source_word: וְנָשַׁמּוּ
  choice: entsetzt ist
  rationale: Das Nifal von שמם kann den Zustand des Entsetztseins oder Erstarrens wie auch Verwüstung bezeichnen. Bei Personen als Subjekt ist »entsetzt sein« natürlich und kontextgerecht, ohne die Härte abzuschwächen.
- source_word: אִישׁ וְאָחִיו
  choice: jeder zusammen mit seinem Bruder
  rationale: Gibt die distributive Wendung mit ihren maskulinen Einzelbezeichnungen in verständlichem modernem Deutsch wieder und behält »Bruder« statt einer Verallgemeinerung zu »Mitmensch« oder »Nächster« bei.
- source_word: וְנָמַקּוּ
  choice: dahinschwinden
  rationale: Gibt das allmähliche Vergehen beziehungsweise Verfallen von מקק würdig und idiomatisch wieder.
- source_word: בַּעֲוֺנָם
  choice: in ihrer Schuld
  rationale: Bewahrt die knappe hebräische Verbindung und lässt den Bedeutungsumfang von עָוֹן zwischen Vergehen, Schuldzustand und daraus erwachsender Strafe möglichst offen.
theological_decisions:
- issue: Maskuline und distributive Formulierung in אִישׁ וְאָחִיו
  choice: jeder zusammen mit seinem Bruder
  alternative: jeder mit dem anderen; jeder mit seinem Nächsten
  rationale: Die Übersetzung hält an der ausdrücklich maskulinen Verwandtschaftsbezeichnung des Ausgangstextes fest, formuliert die distributive Aussage aber in natürlichem Deutsch.
- issue: Mehrdeutigkeit von עָוֹן
  choice: in ihrer Schuld
  alternative: wegen ihrer Schuld; an den Folgen ihrer Vergehen
  rationale: עָוֹן kann das Vergehen, die daraus entstehende Schuld oder deren Straffolge bezeichnen. Die Hauptfassung legt sich nicht ausschließlich auf moralischen Zustand oder Strafwirkung fest; die Fußnote macht die Spannweite sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Folgegefüge, wird jedoch durch die unpersönliche deutsche Mangelformulierung und »jeder zusammen mit seinem Bruder« idiomatisch gestaltet. Die Marker [a] und [b] stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
