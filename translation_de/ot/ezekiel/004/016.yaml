language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ הִנְ/נִ֨י שֹׁבֵ֤ר מַטֵּה לֶ֨חֶם֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/אָכְלוּ לֶ֥חֶם בְּ/מִשְׁקָ֖ל וּ/בִ/דְאָגָ֑ה וּ/מַ֕יִם בִּ/מְשׂוּרָ֥ה וּ/בְ/שִׁמָּמ֖וֹן יִשְׁתּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/016.yaml
  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
translation:
  language: de
  text: 'Dann sagte er zu mir: „Menschensohn, sieh: Ich zerbreche den Stab des Brotes[a] in Jerusalem. Sie werden das Brot nach Gewicht und voller Sorge essen und das Wasser nach Maß und mit Entsetzen trinken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „Stab des Brotes“ bezeichnet das Brot als Lebensgrundlage beziehungsweise die Versorgung mit Nahrung.
    reason: Erläuterung einer hebräischen Bildrede
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel wiederkehrende Anrede wird eng am hebräischen Ausdruck wiedergegeben. Sie bezeichnet hier den menschlichen Propheten und ist kein christologischer Titel.
- source_word: הִנְנִי
  choice: 'sieh: Ich'
  rationale: „Sieh“ bewahrt den hinweisenden und nachdrücklichen Charakter der Partikel, während die Formulierung im modernen Deutsch verständlich bleibt.
- source_word: שֹׁבֵר
  choice: Ich zerbreche
  rationale: Das Partizip mit הִנְנִי stellt Gottes unmittelbar bevorstehendes beziehungsweise gewiss eintretendes Handeln anschaulich als gegenwärtig dar.
- source_word: מַטֵּה לֶחֶם
  choice: den Stab des Brotes
  rationale: Die hebräische Metapher wird im Haupttext bewahrt; sie bezeichnet das Brot als tragende Lebensgrundlage beziehungsweise die gesicherte Versorgung damit.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Direkte und eindeutige Ortsangabe.
- source_word: וְאָכְלוּ לֶחֶם בְּמִשְׁקָל
  choice: Sie werden das Brot nach Gewicht essen
  rationale: Die konkrete Vorstellung abgewogener, rationierter Nahrung bleibt erhalten und macht den Mangel sichtbar.
- source_word: וּבִדְאָגָה
  choice: voller Sorge
  rationale: דְאָגָה bezeichnet bedrängte Sorge oder Angst. „Voller Sorge“ klingt im Deutschen natürlich und beschreibt den Gemütszustand beim Essen.
- source_word: וּמַיִם בִּמְשׂוּרָה
  choice: das Wasser nach Maß
  rationale: Die knappe Formulierung bewahrt die Parallele zum Brot „nach Gewicht“ und das konkrete Bild rationierten Wassers.
- source_word: וּבְשִׁמָּמוֹן
  choice: mit Entsetzen
  rationale: Das Wort bezeichnet einen Zustand des Entsetzens, Erstarrens oder fassungslosen Erschreckens. „Mit Entsetzen“ wahrt diese emotionale Stärke, ohne die mögliche Nuance vorschnell auf Verwüstung zu verengen.
- source_word: יִשְׁתּוּ
  choice: sie werden trinken
  rationale: Das Imperfekt wird im Zusammenhang mit dem angekündigten Gericht als Zukunft wiedergegeben und entspricht der parallelen Aussage über das Essen.
theological_decisions:
- issue: Wiedergabe der Metapher מַטֵּה לֶחֶם
  choice: Die Metapher „Stab des Brotes“ bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
  alternative: Im Haupttext unmittelbar „Brotvorrat“, „Nahrungsversorgung“ oder „Lebensgrundlage“ schreiben.
  rationale: Die Bildsprache stellt Brot als tragende Stütze des Lebens dar, die Gott zerbricht. Ihre Beibehaltung bewahrt die prophetische Wirkung und lässt zugleich durch die Fußnote den gemeinten Versorgungsmangel klar erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt die Parallelität von Brot nach Gewicht und Wasser nach Maß. „Menschensohn“ und „Stab des Brotes“ sind bewusst quellennah; die ungewöhnliche Metapher wird durch die unmittelbar gesetzte Fußnote erschlossen.
