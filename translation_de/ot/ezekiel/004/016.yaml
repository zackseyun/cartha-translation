  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und die zentralen Bilder zuverlässig wieder: die Anrede „Menschensohn“, die emphatische Ankündigung Gottes, das Zerbrechen des „Stabes des Brotes“, Jerusalem sowie die parallelen Aussagen über abgewogenes Brot und abgemessenes Wasser. „Voller Sorge“ trifft בִּדְאָגָה gut; „mit Entsetzen“ ist für וּבְשִׁמָּמוֹן im Gerichtskontext eine vertretbare, nicht überengte Wiedergabe.'
