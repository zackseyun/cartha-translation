base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/003.yaml
  text: And you[a], take for yourself an iron griddle and set it as an iron wall between yourself and the city, and set your face toward it; and it will be under siege, and you shall besiege it. It is a sign for the house of Israel.
translation:
  language: de
  text: Und du, nimm dir eine eiserne Pfanne[a] und stelle sie als eiserne Mauer zwischen dich und die Stadt. Richte dein Gesicht auf sie; sie soll belagert sein, und du sollst sie belagern. Das ist ein Zeichen für das Haus Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine eiserne Platte“ oder „eine eiserne Grillplatte“. Das hebräische Wort bezeichnet ein flaches Kochgerät, das hier symbolisch als Barriere verwendet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲבַת בַּרְזֶל
  choice: eine eiserne Backplatte
  rationale: מַחֲבַת bezeichnet ein flaches Kochgerät, etwa eine Backplatte oder Pfanne. „Backplatte“ bewahrt den kulinarischen Sinn und passt zugleich zu ihrer symbolischen Verwendung als Barriere.
- source_word: קִיר בַּרְזֶל
  choice: eiserne Mauer
  rationale: קִיר bedeutet gewöhnlich „Mauer“. Die konkrete Bildsprache der Zeichenhandlung wird beibehalten, statt sie mit „Barriere“ auszudeuten.
- source_word: וַהֲכִינֹתָה אֶת־פָּנֶיךָ אֵלֶיהָ
  choice: Richte dein Gesicht auf sie
  rationale: Die hebräische Wendung bezeichnet eine bewusste, entschlossene Ausrichtung. Die deutsche Formulierung erhält das Körperbild und bleibt verständlich.
- source_word: וְהָיְתָה בַמָּצוֹר
  choice: sie soll belagert werden
  rationale: מָצוֹר bezeichnet Belagerung beziehungsweise einen Belagerungszustand. Im Kontext der angeordneten Zeichenhandlung gibt „soll“ die modale Kraft natürlich wieder; das feminine Pronomen bezieht sich auf die Stadt.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: du sollst sie belagern
  rationale: Das Verb צור bedeutet hier „belagern“. Die Wiederholung des Wortfelds Belagerung entspricht der zugespitzten Formulierung des Hebräischen.
- source_word: אוֹת הִיא
  choice: Das ist ein Zeichen
  rationale: אוֹת bezeichnet ein Zeichen beziehungsweise eine symbolische Handlung. „Das“ verweist im Deutschen natürlich auf die gesamte dargestellte Zeichenhandlung.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: לְ kennzeichnet hier den Bezug oder Adressaten des Zeichens. „Haus Israel“ erhält die kollektive Bundesbezeichnung des Ausgangstextes.
theological_decisions:
- issue: Prophetische Zeichenhandlung
  choice: Die konkreten Bilder „eiserne Mauer“ und „Haus Israel“ bleiben stehen.
  alternative: Die Symbolik deutend als „undurchdringliche Barriere“ und die Gemeinschaft schlicht als „Israel“ wiederzugeben.
  rationale: Die theologische Wirkung liegt in der konkreten, mehrdeutigen Zeichenhandlung. Eine erklärende Paraphrase würde die Symbolik vorzeitig festlegen.
- issue: Bezug der femininen Pronomina
  choice: „sie“ wird auf die Stadt bezogen.
  alternative: Das Pronomen auf die Backplatte oder undifferenziert auf das Stadtmodell zu beziehen.
  rationale: Das feminine עִיר („Stadt“) ist im unmittelbaren Kontext der natürliche Bezug von אֵלֶיהָ und עָלֶיהָ; zugleich bleibt offen, wie genau die dargestellte Stadt im Zeichenaufbau repräsentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Befehlsfolge bleibt knapp und anschaulich; die konkrete Zeichenhandlung wird nicht interpretierend aufgelöst.
