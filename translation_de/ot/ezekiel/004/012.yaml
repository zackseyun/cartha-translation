  text: You shall eat it as a barley cake, and you shall bake it over human dung in their sight.
translation:
  language: de
  text: Du sollst ihn als Gerstenfladen essen und ihn vor ihren Augen über menschlichem Kot backen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֻגַת שְׂעֹרִים
  choice: Gerstenfladen
  rationale: עֻגָה bezeichnet einen flachen, runden Brotfladen oder Kuchen; „Gerstenfladen“ ist im Deutschen natürlich und gibt die Getreideart präzise wieder.
- source_word: בְּגֶלְלֵי צֵאַת הָאָדָם
  choice: über menschlichem Kot
  rationale: Die Präposition ב kann hier das Brennmaterial bzw. die Hitzequelle bezeichnen. „Über“ macht deutlich, dass der Kot als Brennstoff dient, ohne nahezulegen, der Fladen werde in den Kot eingearbeitet.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die idiomatische deutsche Wendung bewahrt den Sinn einer öffentlich und sichtbar ausgeführten Zeichenhandlung.
theological_decisions:
- issue: Art der Verunreinigung durch menschliche Exkremente
  choice: über menschlichem Kot backen
  alternative: auf menschlichem Kot backen
  rationale: „Über“ wahrt die wahrscheinlich gemeinte Verwendung als Brennstoff und vermeidet eine unnötige Festlegung auf unmittelbaren Kontakt, ohne den anstößigen und kultisch verunreinigenden Charakter der Zeichenhandlung abzuschwächen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Das maskuline Pronomen „ihn“ bezieht sich natürlich auf den Gerstenfladen; die öffentliche Zeichenhandlung bleibt knapp und eindringlich formuliert.
