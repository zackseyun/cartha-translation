  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und die wesentlichen Bedeutungen präzise wieder: Das Narrativ-Waw wird idiomatisch durch „Da“ wiedergegeben, רְאֵה angemessen als Aufmerksamkeitssignal mit „Sieh“, und die Ersatzrelation von תַּחַת korrekt mit „statt“. „Rinderdung“ entspricht צפועי הַבָּקָר. „Menschenkot“ gibt גֶּלְלֵי הָאָדָם als generischen Kontrast zu Rindern wieder, ohne den Ausdruck unbegründet auf einen Mann einzuengen. „Darauf“ ist trotz des hebräischen Plurals eine idiomatische deutsche Aufnahme des als Sammelbegriff behandelten Dungs.'
  naturalness: Modernes Standarddeutsch, klar und in einem dem Prophetenbuch angemessenen, nicht künstlich altertümlichen Erzählton. Die Formulierung „darauf sollst du dein Brot zubereiten“ ist natürlich und bewahrt die bewusst allgemeine Bedeutung von עשה, ohne sie auf „backen“ einzuengen.
  terminology: Die konkreten, absichtlich anstößigen Begriffe werden nicht euphemisiert. „Rinderdung“ und „Menschenkot“ bilden einen klaren sachlichen Kontrast. Es bestehen keine problematischen theologischen oder namensbezogenen Entscheidungen. Eine Fußnote ist im Deutschen nicht erforderlich, da „Menschenkot“ die generische Bedeutung bereits eindeutig ausdrückt.
