  text: וַ/יֹּ֣אמֶר אֵלַ֔/י רְאֵ֗ה נָתַ֤תִּֽי לְ/ךָ֙ אֶת צפועי הַ/בָּקָ֔ר תַּ֖חַת גֶּלְלֵ֣י הָֽ/אָדָ֑ם וְ/עָשִׂ֥יתָ אֶֽת לַחְמְ/ךָ֖ עֲלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/015.yaml
  text: Then he said to me[a], “See, I have given you cow dung instead of human dung, and you shall prepare your bread over it.”
translation:
  language: de
  text: 'Da sagte er zu mir: »Sieh, ich habe dir Rinderdung statt Menschenkot gegeben; darauf sollst du dein Brot zubereiten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Da sagte er zu mir
  rationale: Das Narrativ-Waw führt die Handlung weiter. „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder; das Subjekt „er“ ergibt sich aus dem vorherigen Zusammenhang.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ dient als Aufmerksamkeitssignal. „Sieh“ ist knapp, würdig und weniger altertümlich als „siehe“.
- source_word: נָתַתִּי לְךָ
  choice: ich habe dir … gegeben
  rationale: Das Perfekt bezeichnet hier die bereits gewährte Ersatzregelung. Die direkte Wiedergabe mit „gegeben“ bewahrt die Aussageform des Hebräischen, ohne sie ausdrücklich als bloße Erlaubnis auszulegen.
- source_word: צפועי הַבָּקָר
  choice: Rinderdung
  rationale: Gemeint sind die Ausscheidungen von Rindern, die als Brennstoff dienen. „Rinderdung“ ist sachlich, verständlich und bildet den Gegensatz zu menschlichen Ausscheidungen genau ab.
- source_word: תַּחַת
  choice: statt
  rationale: Die Präposition bezeichnet hier einen Austausch beziehungsweise Ersatz, nicht eine räumliche Lage.
- source_word: גֶּלְלֵי הָאָדָם
  choice: Menschenkot
  rationale: גֶּלְלֵי bezeichnet Kot oder Exkremente; הָאָדָם meint hier Menschen allgemein im Gegensatz zu Rindern. „Menschenkot“ ist direkt und vermeidet die unzutreffende Beschränkung auf einen einzelnen Mann.
- source_word: וְעָשִׂיתָ אֶת לַחְמְךָ
  choice: darauf sollst du dein Brot zubereiten
  rationale: עשה ist allgemein „machen/tun“. „Zubereiten“ passt zum Kochzusammenhang, ohne den Vorgang enger als ausdrücklich „backen“ festzulegen.
- source_word: עֲלֵיהֶם
  choice: darauf
  rationale: Das hebräische Suffix ist pluralisch und bezieht sich auf die einzelnen Dungstücke; im Deutschen wird „Dung“ gewöhnlich als Sammelbegriff im Singular aufgefasst. „Darauf“ vermittelt seine Verwendung als Brennstoff.
theological_decisions:
- issue: Bedeutung von הָאָדָם
  choice: Menschen- in „Menschenkot“
  alternative: Manneskot
  rationale: Der Ausdruck bezeichnet hier die Menschheit beziehungsweise Menschen generell und steht im sachlichen Gegensatz zu Rindern; er meint nicht eigens einen männlichen Einzelnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die drastische Körperlichkeit des Ausgangstextes wird nicht euphemistisch abgeschwächt; zugleich bleibt die allgemeine Bedeutung des Verbs עשה erhalten.
