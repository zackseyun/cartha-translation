  text: וְ/כִלִּיתָ֣ אֶת אֵ֗לֶּה וְ/שָׁ֨כַבְתָּ֜ עַל צִדְּ/ךָ֤ ה/ימיני שֵׁנִ֔ית וְ/נָשָׂ֖אתָ אֶת עֲוֺ֣ן בֵּית יְהוּדָ֑ה אַרְבָּעִ֣ים י֔וֹם י֧וֹם לַ/שָּׁנָ֛ה י֥וֹם לַ/שָּׁנָ֖ה נְתַתִּ֥י/ו לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/006.yaml
  text: When you have finished these[a], you shall lie down a second time on your right side, and you shall bear the iniquity of the house of Judah for forty days. I have assigned you a day for each year.
translation:
  language: de
  text: Wenn du dies alles vollendet hast, sollst du dich ein zweites Mal auf deine rechte Seite legen und vierzig Tage lang die Schuld des Hauses Juda tragen. Für jedes Jahr habe ich dir einen Tag bestimmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Einen Tag für ein Jahr, einen Tag für ein Jahr.“ Die Wiederholung hebt die symbolische Entsprechung zwischen den Tagen, die Ezechiel auf der Seite liegt, und den dargestellten Jahren hervor.'
    reason: Die wörtliche Wiederholung des hebräischen Ausdrucks wird im Haupttext zugunsten natürlichen Deutschen zusammengefasst.
lexical_decisions:
- source_word: וְכִלִּיתָ אֶת־אֵלֶּה
  choice: Wenn du dies alles vollendet hast
  rationale: Die mit וְ verbundene Verbform leitet im Zusammenhang zeitlich die nächste Zeichenhandlung ein. „Dies alles“ gibt den rückverweisenden Plural אֵלֶּה in natürlichem Deutsch wieder, ohne seinen Bezug unnötig einzuengen.
- source_word: וְשָׁכַבְתָּ עַל־צִדְּךָ הַיְמָנִי שֵׁנִית
  choice: sollst du dich ein zweites Mal auf deine rechte Seite legen
  rationale: „Ein zweites Mal“ macht die Wiederholung der Zeichenhandlung ausdrücklich; „sich auf die Seite legen“ ist die natürliche deutsche Bezeichnung der verlangten Körperhaltung.
- source_word: וְנָשָׂאתָ אֶת־עֲוֺן
  choice: die Schuld … tragen
  rationale: Die feste Verbindung kann sowohl das Tragen von Schuld als auch ihrer Folgen bezeichnen. „Die Schuld tragen“ wahrt diese Bedeutungsbreite besser als eine eindeutige Festlegung auf Sünde oder Strafe.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Die formale prophetische Bezeichnung für das Volk beziehungsweise das Südreich bleibt erhalten.
- source_word: אַרְבָּעִים יוֹם
  choice: vierzig Tage lang
  rationale: Die Dauerangabe wird in idiomatischem modernem Deutsch wiedergegeben.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: für jedes Jahr … einen Tag
  rationale: Die Formulierung vermittelt die symbolische Entsprechung klar und natürlich. Die emphatische Wiederholung des Hebräischen wird in der Fußnote dokumentiert.
- source_word: נְתַתִּיו לָךְ
  choice: habe ich dir … bestimmt
  rationale: Das Verb נָתַן bezeichnet hier im Kontext die göttliche Zuweisung des symbolischen Zeitmaßes; „bestimmt“ ist dafür im Deutschen treffender als das allgemeinere „gegeben“.
theological_decisions:
- issue: Bedeutungsumfang von עָוֺן in der Zeichenhandlung
  choice: „Schuld“ beibehalten, ohne ausschließlich Verfehlung oder Strafe zu meinen
  alternative: „Sünde“ oder „Strafe für die Schuld“
  rationale: In der prophetischen Zeichenhandlung kann עָוֺן sowohl die Verfehlung des Volkes als auch die damit verbundene Last beziehungsweise Folge umfassen. „Schuld tragen“ bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe an der hebräischen Anweisung, während Dauer und symbolische Entsprechung idiomatisch formuliert werden.
