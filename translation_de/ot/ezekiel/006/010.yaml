source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה לֹ֤א אֶל חִנָּם֙ דִּבַּ֔רְתִּי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם הָ/רָעָ֥ה הַ/זֹּֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/010.yaml
  text: Then they will know that I am Yahweh[b][a]; I did not speak in vain when I said I would bring this disaster upon them.
translation:
  language: de
  text: Dann werden sie erkennen, dass ich Jahwe bin. Ich habe nicht vergeblich[a] gesagt, dass ich ihnen dieses Unheil[b] antun werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht umsonst“; möglicherweise auch: „nicht grundlos“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dieses Böse“. Gemeint ist hier das Unheil des angekündigten Gerichts, nicht moralische Bosheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Das mit וְ verbundene Perfekt hat im Zusammenhang der angekündigten Gerichte zukünftige, folgernde Bedeutung. „Dann“ verdeutlicht diese Folge; „erkennen“ gibt die für Ezechiel typische Erkenntnisformel natürlich wieder.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Die feste Erkenntnisformel bleibt in ihrer einfachen Form erhalten. Der Gottesname יהוה wird gemäß der Projektvorgabe als „Jahwe“ wiedergegeben.
- source_word: לֹא אֶל חִנָּם
  choice: nicht vergeblich
  rationale: Die Wendung besagt, dass Jahwes Reden weder leer noch wirkungslos ist. „Nicht vergeblich“ bewahrt diese Mehrdeutigkeit besser als eine Festlegung auf ausschließlich „nicht ohne Grund“.
- source_word: דִּבַּרְתִּי
  choice: habe ich … davon gesprochen
  rationale: Die Übersetzung hält am Grundsinn „reden/sprechen“ fest und verbindet das Verb im Deutschen idiomatisch mit dem folgenden Infinitiv.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: ihnen … anzutun
  rationale: Dies entspricht eng dem wörtlichen „ihnen zu tun“ und ergibt zusammen mit dem Gegenstand „Unheil“ eine natürliche deutsche Formulierung.
- source_word: הָרָעָה הַזֹּאת
  choice: dieses Unheil
  rationale: רָעָה bezeichnet hier das als Gericht eintretende Unheil, nicht moralische Bosheit. „Unheil“ wahrt die Schärfe der Aussage, ohne Gott moralisches Böses zuzuschreiben.
theological_decisions:
- issue: Wiedergabe von יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Umschrift „Jahwe“ macht den Eigennamen sichtbar und folgt der vorgegebenen Projektkonvention.
- issue: Bedeutung von רָעָה beim göttlichen Gericht
  choice: Unheil
  alternative: Böses; Katastrophe
  rationale: Im Kontext geht es um ein von Gott angekündigtes Strafgericht. „Unheil“ bezeichnet dessen schädliche Folgen, ohne die Aussage als moralisches Böses Gottes misszuverstehen.
- issue: Aussagekraft von לֹא אֶל חִנָּם
  choice: nicht vergeblich
  alternative: nicht grundlos; nicht umsonst
  rationale: Die Formulierung lässt sowohl die Wirksamkeit und Erfüllung des göttlichen Wortes als auch dessen Ernst anklingen, ohne die Wendung unnötig auf nur eine Nuance festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze Erkenntnisformel bleibt prägnant; „davon gesprochen … anzutun“ verbindet Quellennähe mit natürlicher deutscher Syntax.
