  text: הָ/רָח֞וֹק בַּ/דֶּ֣בֶר יָמ֗וּת וְ/הַ/קָּרוֹב֙ בַּ/חֶ֣רֶב יִפּ֔וֹל וְ/הַ/נִּשְׁאָר֙ וְ/הַ/נָּצ֔וּר בָּ/רָעָ֖ב יָמ֑וּת וְ/כִלֵּיתִ֥י חֲמָתִ֖/י בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/012.yaml
  text: The one far away will die by pestilence[a], and the one nearby will fall by the sword, and the one left and besieged will die by famine[b]; and I will spend my wrath on them.
translation:
  language: de
  text: Wer fern ist, wird an der Seuche sterben, und wer nahe ist, wird durchs Schwert fallen. Wer aber übrig geblieben und eingeschlossen ist[a], wird am Hunger sterben. Und ich werde meinen Zorn an ihnen vollenden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übrig geblieben und belagert“. Das hebräische Wort kann jemanden bezeichnen, der eingeschlossen oder unter Belagerung ist; dies passt zum anschließenden Hungertod.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich näher: „meinen Zorn an ihnen zu Ende bringen“; gemeint ist, dass der Zorn vollständig ausgeführt wird.'
    reason: lexical_clarification
lexical_decisions:
- source_word: הָרָחוֹק
  choice: wer fern ist
  rationale: Der substantivierte Singular wird distributiv wiedergegeben und wahrt den räumlichen Gegensatz zu הַקָּרוֹב in natürlichem modernem Deutsch.
- source_word: בַּדֶּבֶר
  choice: an der Seuche
  rationale: דֶּבֶר bezeichnet eine Seuche als Gericht; im Deutschen ist „an der Seuche sterben“ idiomatischer als eine streng instrumentale Formulierung.
- source_word: הַקָּרוֹב
  choice: wer nahe ist
  rationale: Die Formulierung bildet den Parallelismus zu „wer fern ist“ ab, ohne den substantivierten Ausdruck unnötig zu nominalisieren.
- source_word: בַּחֶרֶב יִפּוֹל
  choice: wird durch das Schwert fallen
  rationale: Die konkrete Bildsprache des hebräischen Ausdrucks für gewaltsamen Tod wird bewahrt.
- source_word: הַנִּשְׁאָר
  choice: wer übrig geblieben ist
  rationale: Das passive Partizip bezeichnet denjenigen, der zurück- oder übriggeblieben ist; die distributive Singularform bleibt erhalten.
- source_word: הַנָּצוּר
  choice: eingeschlossen
  rationale: Im Zusammenhang mit dem folgenden Hungertod liegt die Bedeutung „eingeschlossen, belagert“ nahe; die Formulierung lässt offen, auf welche Weise die Person eingeschlossen ist.
- source_word: בָּרָעָב יָמוּת
  choice: wird am Hunger sterben
  rationale: „Am Hunger sterben“ ist die natürliche deutsche Entsprechung und führt die Reihe der angekündigten Todesarten fort.
- source_word: וְכִלֵּיתִי חֲמָתִי בָּם
  choice: So werde ich meinen Zorn an ihnen vollenden
  rationale: כלה im Piel bezeichnet hier das vollständige Ausführen beziehungsweise Zu-Ende-Bringen des Zorns; „vollenden“ bewahrt die Gerichtsschärfe und den Abschlussgedanken.
theological_decisions:
- issue: Die volle Ausführung des göttlichen Gerichts
  choice: meinen Zorn an ihnen vollenden
  alternative: meinen Zorn an ihnen erschöpfen
  rationale: Die gewählte Fassung stellt dar, dass der angekündigte Zorn vollständig ausgeführt wird, ohne zusätzliche dogmatische Vorstellungen wie Genugtuung oder Besänftigung in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der parallele Satzbau von „wer fern ist“ und „wer nahe ist“ wird bewahrt; die Schlussformel bleibt bewusst gewichtig und gerichtssprachlich.
