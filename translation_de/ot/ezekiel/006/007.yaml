  text: וְ/נָפַ֥ל חָלָ֖ל בְּ/תֽוֹכְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/007.yaml
  text: The slain will fall in your midst[a], and you will know that I am Yahweh.
translation:
  language: de
  text: Erschlagene werden mitten unter euch fallen, und ihr werdet erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָפַל
  choice: wird … fallen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht hier im prophetischen Gerichtswort und bezeichnet das angekündigte Geschehen; das deutsche Futur gibt dies natürlich wieder.
- source_word: חָלָל
  choice: ein Erschlagener
  rationale: Das maskuline Substantiv im Singular bezeichnet in diesem Gerichtskontext einen gewaltsam Getöteten. Die singularische Form bleibt erhalten, ohne sie stillschweigend in einen Plural oder ein Kollektiv umzudeuten.
- source_word: בְּתוֹכְכֶם
  choice: mitten unter euch
  rationale: Die Wendung bezeichnet den Ort innerhalb der angesprochenen Gemeinschaft. „Mitten unter euch“ ist idiomatisch und bewahrt den nachdrücklichen Ton.
- source_word: וִידַעְתֶּם
  choice: ihr werdet erkennen
  rationale: „Erkennen“ gibt die für Ezechiel typische Erkenntnisformel angemessen wieder und bezeichnet mehr als bloßes intellektuelles Wissen.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Die Formulierung bewahrt die Identitäts- und Erkenntnisformel sowie den ausdrücklich im Hebräischen stehenden Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift und bewahrt den Eigennamen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bedeutung von וִידַעְתֶּם in der ezechielischen Erkenntnisformel
  choice: ihr werdet erkennen
  alternative: ihr werdet wissen
  rationale: „Erkennen“ lässt die im Kontext des Gerichts erzwungene Anerkennung von Jahwes Identität und Wirken anklingen, ohne darüber hinaus eine bestimmte Art persönlicher oder heilvoller Gotteserkenntnis festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem für Ezechiel charakteristischen prophetischen Ton. Die Wortstellung bleibt klar und natürlich; der hebräische Singular „ein Erschlagener“ und die Spannung der Erkenntnisformel werden bewahrt.
