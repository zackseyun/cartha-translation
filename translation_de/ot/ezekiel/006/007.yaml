review_pass:
  verdict: revise
  source_fidelity: 'Der Vers wird im Wesentlichen zutreffend wiedergegeben: וְנָפַל ist im Gerichtskontext zukunftsbezogen, בְּתוֹכְכֶם bedeutet „mitten unter euch“, und die ezechielische Erkenntnisformel ist richtig erfasst. Das formal singularische חָלָל fungiert hier jedoch natürlich als Gattungs-/Kollektivbezeichnung für Getötete; eine deutsche Einzahl („Ein Erschlagener“) ist unnötig eng und weniger idiomatisch.'
  naturalness: „Ein Erschlagener wird mitten unter euch fallen“ klingt im modernen Deutschen isoliert und erweckt den Eindruck, es gehe um genau eine Person. „Erschlagene werden mitten unter euch fallen“ ist idiomatisch, bewahrt den Gerichtston und gibt den kollektivischen Sinn angemessen wieder.
  terminology: „Jahwe“ ist eine etablierte deutsche wissenschaftliche Form des Gottesnamens und passt zur Vorgabe, den Namen nicht durch „der HERR“ zu ersetzen. „Erkennen“ ist für die Erkenntnisformel in Ezechiel passend. Die Fußnote kann die alternative Umschrift „Yahweh“ und die traditionelle Ersatzwiedergabe transparent nennen.
  issues:
  - severity: medium
    issue: חָלָל ist als „Ein Erschlagener“ wiedergegeben.
    rationale: Obwohl das hebräische Substantiv formal Singular ist, bezeichnet es in diesem Kontext die Erschlagenen kollektivisch. Die deutsche Einzahl verengt den Sinn und ist stilistisch weniger natürlich. Ein pluralisches „Erschlagene“ gibt den Kontext und die im englischen Audit gewählte Kollektivwiedergabe besser wieder.
  revised_text: Erschlagene werden mitten unter euch fallen, und ihr werdet erkennen, dass ich Jahwe bin.
  revised_footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch „Yahweh“ umschrieben. Traditionell: „der HERR“.'
    reason: Der Gottesname steht im hebräischen Ausgangstext ausdrücklich. Die Fußnote nennt eine alternative Umschrift sowie die traditionelle deutsche Ersatzwiedergabe.
  revision_rationale: Die Revision beschränkt sich auf die kollektivische Wiedergabe von חָלָל. Sie vermeidet die semantisch einengende deutsche Einzahl, ohne die im Hebräischen vorhandene Gattungsbezeichnung zu überdeuten. Die Stellung der Fußnotenmarkierung am Gottesnamen und die Wiedergabe „Jahwe“ bleiben erhalten.
