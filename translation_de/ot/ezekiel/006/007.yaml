- from: Ein Erschlagener wird mitten unter euch fallen, und ihr werdet erkennen, dass ich Jahwe[a] bin.
  to: Erschlagene werden mitten unter euch fallen, und ihr werdet erkennen, dass ich Jahwe bin.
