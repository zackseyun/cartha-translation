source:
  edition: WLC
  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/הִנָּבֵ֖א אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/002.yaml
  text: Son of man[a], set your face toward the mountains of Israel, and prophesy to them.
translation:
  language: de
  text: Menschensohn, wende dein Gesicht den Bergen Israels zu und weissage ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede an Ezechiel wird entsprechend dem hebräischen Idiom wörtlich und in ihrer prophetischen Prägung bewahrt.
- source_word: שִׂים פָּנֶיךָ
  choice: richte dein Gesicht
  rationale: Die konkrete Bildsprache des hebräischen Ausdrucks bleibt erhalten; sie bezeichnet die entschlossene Hinwendung zu einem Adressaten.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: auf die Berge Israels
  rationale: Bei der Ausrichtung des Gesichts gibt אֶל die Richtung an. Die Berge werden konkret wiedergegeben und nicht vorschnell als Land oder Höhenheiligtümer gedeutet.
- source_word: וְהִנָּבֵא
  choice: und weissage
  rationale: Das geläufige deutsche Verb gibt den Niphal-Imperativ von נבא knapp und in angemessen prophetischem Register wieder.
- source_word: אֲלֵיהֶם
  choice: ihnen
  rationale: Die Präposition bezeichnet zunächst die Berge als Adressaten der prophetischen Rede. Das folgende Gerichtswort verleiht der Rede einen konfrontativen Charakter, ohne dass hier ausdrücklich »gegen« stehen muss.
theological_decisions:
- issue: Wiedergabe der prophetischen Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: »Menschensohn« bewahrt die feste, maskuline Anrede Ezechiels und lässt ihre mögliche theologische Resonanz bestehen, ohne sie erklärend aufzulösen.
- issue: Richtung oder Gegnerschaft bei אֲלֵיהֶם
  choice: ihnen
  alternative: gegen sie
  rationale: Die neutralere Adressatenangabe entspricht dem gewöhnlichen Wert der Präposition. Dass die Weissagung Gericht ankündigt, ergibt sich aus dem Kontext und muss nicht in die Präposition eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter prophetischer Bildsprache. »Richte dein Gesicht auf« klingt markiert, bleibt aber verständlich und bildet das hebräische Idiom genauer ab als eine glättende Umschreibung.
