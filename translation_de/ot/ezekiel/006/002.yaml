review_pass:
  verdict: revise
  source_fidelity: Die Anrede »Menschensohn« gibt בֶּן־אָדָם treffend wieder. Auch die neutrale Adressatenangabe »ihnen« für אֲלֵיהֶם wahrt den hebräischen Wortlaut und trägt keine kontextuelle Gegnerschaft vorzeitig in den Text ein. Die Formulierung »richte dein Gesicht auf die Berge« kann im Deutschen jedoch ein Hinaufrichten suggerieren und bildet die gerichtete Zuwendung weniger idiomatisch ab.
  naturalness: »Wende dein Gesicht den Bergen Israels zu« ist modernes, würdevolles Deutsch, bewahrt die konkrete Bildsprache und gibt die Richtungsangabe klar wieder. »Weissage« ist im prophetischen Register verständlich und angemessen.
  terminology: »Menschensohn« ist als feste Anrede Ezechiels beizubehalten. »Berge Israels« ist konkret und korrekt. Für אֲלֵיהֶם ist »ihnen«, nicht »gegen sie«, vorzuziehen; die gerichtliche Stoßrichtung wird erst im Kontext expliziert.
  issues:
  - severity: low
    issue: Die Richtungswendung »richte dein Gesicht auf die Berge« ist im Deutschen nicht die naheliegendste Wiedergabe.
    rationale: »Auf« kann räumlich ein Hinaufrichten nahelegen. Das Hebräische verbindet שִׂים פָּנֶיךָ mit אֶל als Ausrichtung bzw. Zuwendung auf ein Ziel. »Wende dein Gesicht … zu« erhält Bild und Richtung idiomatischer.
