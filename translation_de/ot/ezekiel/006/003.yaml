source:
  edition: WLC
  text: וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים ו/ל/גאית הִנְ/נִ֨י אֲנִ֜י מֵבִ֤יא עֲלֵי/כֶם֙ חֶ֔רֶב וְ/אִבַּדְתִּ֖י בָּמֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/003.yaml
  text: 'and say[a], ‘Mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys: Behold, I myself am bringing a sword upon you[b], and I will destroy your high places.’'
translation:
  language: de
  text: 'Und sag: »Ihr Berge Israels, hört das Wort Jahwes, des Herrn! So spricht Yahweh, der Herr, zu den Bergen und Hügeln, zu den Schluchten[a] und Tälern: Seht, ich selbst bringe ein Schwert über euch und werde eure Höhenheiligtümer[b] zerstören.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bachrinnen«, »Flussbetten« oder »Wadis«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Kultstätten auf Anhöhen, die in den prophetischen Texten häufig mit unerlaubter oder götzendienerischer Verehrung verbunden sind.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: ihr Berge Israels
  rationale: Die Anrede personifiziert das Bergland Israels. Das deutsche »ihr« macht den Vokativ natürlich und eindeutig.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Pluralimperativ bewahrt den feierlichen prophetischen Aufruf zum Hören.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: das Wort des Herrn Yahweh
  rationale: »Wort« gibt den Singular wieder; »Herr Yahweh« bewahrt sowohl den Titel אֲדֹנָי als auch den Gottesnamen יְהוָה.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahweh
  rationale: Dies ist die geläufige, würdevolle deutsche Form der prophetischen Botenformel.
- source_word: לֶהָרִים וְלַגְּבָעוֹת
  choice: zu den Bergen und Hügeln
  rationale: Die beiden Geländeformen werden knapp und idiomatisch wiedergegeben.
- source_word: לָאֲפִיקִים
  choice: zu den Schluchten
  rationale: אֲפִיקִים kann Rinnen, Wasserläufe oder Schluchten bezeichnen; im Zusammenhang der Geländeformen ist »Schluchten« verständlich, ohne die Bedeutung zu eng festzulegen.
- source_word: וְלַגֵּאָיוֹת
  choice: und Tälern
  rationale: »Täler« ist die natürliche breite Entsprechung für die tiefer gelegenen Geländeformen.
- source_word: הִנְנִי אֲנִי
  choice: Seht, ich selbst
  rationale: »Seht« erhält das Aufmerksamkeitssignal von הִנֵּה, während »ich selbst« die ausdrückliche Wiederholung des Personalbezugs natürlich wiedergibt.
- source_word: מֵבִיא עֲלֵיכֶם חֶרֶב
  choice: bringe das Schwert über euch
  rationale: Das Partizip bezeichnet anschaulich bevorstehendes Handeln. »Das Schwert« steht metonymisch für gewaltsames Gericht und Krieg.
- source_word: וְאִבַּדְתִּי בָּמוֹתֵיכֶם
  choice: und werde eure Höhenheiligtümer zerstören
  rationale: בָּמוֹת bezeichnet hier kultische Stätten auf Anhöhen; »Höhenheiligtümer« vermittelt diese Bedeutung deutlicher als das missverständliche bloße »Höhen«.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr, HERR
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und macht den im hebräischen Text stehenden Gottesnamen sichtbar, ohne die Verbindung beider Bezeichnungen aufzulösen.
- issue: Kultische Bedeutung von בָּמוֹת
  choice: Höhenheiligtümer
  alternative: Höhen; Kultstätten auf den Höhen
  rationale: Der Kontext kündigt die Zerstörung von Kultstätten an. Die Übersetzung benennt den kultischen Sinn, ohne über die im Vers selbst nicht näher bestimmte Art der Verehrung hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Sprachrhythmus. Die direkte Anrede der Landschaft und die nachdrückliche Selbstbezeichnung Gottes bleiben erhalten; altertümliche Syntax wird vermieden.
