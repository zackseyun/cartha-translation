  source_fidelity: 'Der Entwurf gibt die Aussage des Hebräischen zuverlässig wieder: Trotz des Gerichts bleibt ein Teil des Volkes übrig; einige entkommen dem Schwert, während sie unter die Völker und in verschiedene Länder zerstreut werden. „Doch“ ist im Kontext angemessen, und die partitive Wiedergabe „Einige von euch“ entspricht dem Sinn von לָכֶם in dieser Konstruktion.'
