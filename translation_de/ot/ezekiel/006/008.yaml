  text: וְ/הוֹתַרְתִּ֗י בִּ/הְי֥וֹת לָ/כֶ֛ם פְּלִ֥יטֵי חֶ֖רֶב בַּ/גּוֹיִ֑ם בְּ/הִזָּרֽוֹתֵי/כֶ֖ם בָּ/אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/008.yaml
  text: Yet I will leave a remnant[a], when some of you become escapees from the sword among the nations, when you are scattered through the lands.
translation:
  language: de
  text: 'Doch ich werde einen Rest übrig lassen[a]: Einige von euch werden unter den Völkern dem Schwert entkommen, wenn ihr in die Länder zerstreut werdet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Doch ich werde einige Überlebende zurücklassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: Doch ich werde einen Rest übrig lassen
  rationale: Der Hifil von יתר bedeutet „übrig lassen“, „verschonen“ oder „bewahren“. „Doch“ bringt im Zusammenhang den Gegensatz zur angekündigten Vernichtung zum Ausdruck; „einen Rest übrig lassen“ wahrt zugleich das Bild der Übriggebliebenen.
- source_word: בִּהְיוֹת לָכֶם
  choice: Einige von euch werden …
  rationale: Die Konstruktion bezeichnet wörtlich das Vorhandensein von Entkommenen „für euch“. Im Deutschen gibt die partitive Formulierung „einige von euch“ den Sinn natürlich wieder.
- source_word: פְּלִיטֵי חֶרֶב
  choice: werden … dem Schwert entkommen
  rationale: פְּלִיטֵי bezeichnet Entkommene oder Flüchtlinge. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt das anschauliche Motiv des Entkommens vor dem Schwert.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם meint hier die fremden Völker, unter denen die Angeredeten infolge des Gerichts leben werden.
- source_word: בְּהִזָּרוֹתֵיכֶם
  choice: wenn ihr … zerstreut werdet
  rationale: Der Infinitiv von זרה mit Suffix bildet eine temporale Bestimmung. Das Passiv wahrt, wie im hebräischen Teilsatz, die Aussage über das Geschehen, ohne die handelnde Person eigens zu ergänzen.
- source_word: בָּאֲרָצוֹת
  choice: in die Länder
  rationale: Der Plural bezeichnet die verschiedenen Länder der Zerstreuung. Im Deutschen verbindet sich „in die Länder zerstreut werden“ idiomatisch mit der gerichteten Bewegung.
theological_decisions:
- issue: Der Rest im Zusammenhang des Gerichts
  choice: Doch ich werde einen Rest übrig lassen
  alternative: Doch ich werde einige Überlebende zurücklassen
  rationale: Die Formulierung hält die Spannung zwischen dem angekündigten Gericht und dem Fortbestehen eines Teils des Volkes fest. „Rest“ ist vom Begriff des Übriglassens her sachlich begründet, ohne eine weitergehende Lehre in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelakzent von „einen Rest übrig lassen“ ist bewusst beibehalten, weil er die hebräische Vorstellung des Übrigbleibens klar vermittelt; der folgende Satzteil erläutert, wer zu diesem Rest gehört.
