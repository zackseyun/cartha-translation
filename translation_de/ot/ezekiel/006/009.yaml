source:
  edition: WLC
  text: וְ/זָכְר֨וּ פְלִֽיטֵי/כֶ֜ם אוֹתִ֗/י בַּ/גּוֹיִם֮ אֲשֶׁ֣ר נִשְׁבּוּ שָׁם֒ אֲשֶׁ֨ר נִשְׁבַּ֜רְתִּי אֶת לִבָּ֣/ם הַ/זּוֹנֶ֗ה אֲשֶׁר סָר֙ מֵֽ/עָלַ֔/י וְ/אֵת֙ עֵֽינֵי/הֶ֔ם הַ/זֹּנ֕וֹת אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָקֹ֨טּוּ֙ בִּ/פְנֵי/הֶ֔ם אֶל הָֽ/רָעוֹת֙ אֲשֶׁ֣ר עָשׂ֔וּ לְ/כֹ֖ל תּוֹעֲבֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/009.yaml
  text: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
translation:
  language: de
  text: Dann werden eure Überlebenden unter den Völkern, unter die sie gefangen weggeführt wurden, an mich denken, wenn ich ihr Herz, das sich wie eine Hure von mir abgewandt hat, und ihre Augen, die wie Huren ihren Götzen nachliefen, zerbrochen habe.[a][b][c] Sie werden sich selbst verabscheuen wegen des Bösen, das sie begangen haben, wegen all ihrer Gräueltaten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, nach einer von einigen Auslegern vertretenen Deutung: „als ich durch ihr hurerisches Herz, das sich von mir abgewandt hat, und durch ihre Augen, die ihren Götzen hurerisch nachgingen, gebrochen wurde.“ Diese Deutung hebt den Schmerz des HERRN über ihre Untreue hervor.'
    reason: alternative_reading
  - marker: b
    text: Das Hebräische gebraucht hier das Bild der Hurerei als Metapher für Untreue gegenüber Gott und für Götzendienst.
    reason: cultural_note
  - marker: c
    text: Das mit „Götzen“ übersetzte hebräische Wort ist eine betont verächtliche Bezeichnung, die Ezechiel häufig für falsche Götter und ihre Kultbilder verwendet; möglich wäre auch „Dreckgötzen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכְרוּ
  choice: Dann werden … an mich denken
  rationale: Das Waw führt im prophetischen Zusammenhang die Folge des angekündigten Gerichts weiter. „Dann“ gibt diesen Zusammenhang natürlich wieder; זכר wird mit dem idiomatischen deutschen Ausdruck „an mich denken“ übersetzt.
- source_word: פְלִיטֵיכֶם
  choice: eure Überlebenden
  rationale: Das Substantiv bezeichnet Menschen, die der Vernichtung entkommen sind. „Überlebende“ ist im Deutschen klar und passt zum Gerichtskontext.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גוים bezeichnet hier die fremden Völker, in deren Gebiet die Verschleppten leben. „Unter den Völkern“ ist natürlich und vermeidet unpassende spätere Konnotationen von „Heiden“.
- source_word: אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: unter die sie gefangen weggeführt wurden
  rationale: Der Niphal von שבה bezeichnet das Gefangennehmen beziehungsweise die Wegführung in Gefangenschaft. Die relative Ortsangabe wird im Deutschen idiomatisch an „Völker“ angeschlossen.
- source_word: אֲשֶׁר נִשְׁבַּרְתִּי אֶת לִבָּם
  choice: wenn ich ihr … Herz … zerbrochen habe
  rationale: Die Hauptlesart versteht Gott als den, der das abtrünnige Herz im Gericht zerbricht; der folgende Akkusativ אֶת לִבָּם stützt diese syntaktische Auffassung. Die masoretische Form lässt jedoch auch eine passive Deutung zu, die in einer Fußnote bewahrt wird.
- source_word: לִבָּם הַזּוֹנֶה
  choice: ihr hurerisches Herz
  rationale: זנה verwendet das drastische Bild der Hurerei für die Untreue gegenüber Gott. „Hurerisch“ wahrt das Bild und seine anklagende Schärfe, ohne es durch das abstraktere „treulos“ zu glätten.
- source_word: אֲשֶׁר סָר מֵעָלַי
  choice: das sich von mir abgewandt hat
  rationale: סור bezeichnet das Sich-Abwenden oder Abweichen. Die gewählte Formulierung ist natürlich und bewahrt den relationalen Charakter des Abfalls.
- source_word: וְאֵת עֵינֵיהֶם הַזֹּנוֹת אַחֲרֵי גִּלּוּלֵיהֶם
  choice: und ihre Augen, die ihren Götzen hurerisch nachgingen
  rationale: Die Formulierung setzt das Hurereibild fort und stellt die Augen als Träger des begehrenden Abfalls dar. „Hurerisch nachgehen“ wahrt sowohl die sexuelle Metapher als auch die Bewegung hinter anderen Göttern her.
- source_word: גִּלּוּלֵיהֶם
  choice: ihren Götzen
  rationale: Das für Ezechiel typische Wort ist eine verächtliche Bezeichnung für Kultbilder beziehungsweise falsche Götter. „Götzen“ gibt den Kern und bereits einen abwertenden Ton wieder; die mögliche stärkere Nuance wird in einer Fußnote erläutert.
- source_word: וְנָקֹטּוּ בִּפְנֵיהֶם
  choice: Sie werden vor sich selbst Ekel empfinden
  rationale: Die hebräische Wendung bezeichnet Abscheu im eigenen Angesicht, also Selbstekel. Die Übersetzung wahrt das Bild von der eigenen Gegenwart beziehungsweise Wahrnehmung und klingt zugleich verständlich.
- source_word: אֶל הָרָעוֹת אֲשֶׁר עָשׂוּ
  choice: wegen des Bösen, das sie … begangen haben
  rationale: Die Präposition markiert hier den Grund beziehungsweise Gegenstand ihres Ekels. Das kollektive „das Böse“ gibt den Plural idiomatisch wieder.
- source_word: לְכֹל תּוֹעֲבֹתֵיהֶם
  choice: mit all ihren abscheulichen Taten
  rationale: תועבות bezeichnet im Bundes- und Götzendienstkontext verabscheuungswürdige Praktiken. „Abscheuliche Taten“ erhält das starke Werturteil und ist in modernem Deutsch natürlicher als das substantivische „Gräuel“.
theological_decisions:
- issue: Bedeutung von אֲשֶׁר נִשְׁבַּרְתִּי אֶת לִבָּם
  choice: Gott zerbricht ihr hurerisches Herz im Gericht.
  alternative: Gott wurde durch ihr hurerisches Herz gebrochen beziehungsweise tief betrübt.
  rationale: Der Anschluss mit אֶת לִבָּם und der Ablauf von Gericht, Erinnerung und Abscheu vor dem eigenen Tun sprechen für die aktive Hauptlesart. Die masoretisch vokalisierte Niphalform kann jedoch passiv verstanden werden und eine Aussage über Gottes Schmerz ausdrücken; diese echte Spannung wird nicht verschwiegen, sondern in Fußnote [a] dokumentiert.
- issue: Sexuelle Bildsprache für Bundesuntreue und Götzendienst
  choice: Die Hurereimetapher bleibt im Haupttext ausdrücklich erhalten.
  alternative: Die Wendungen könnten verallgemeinernd als „treulos“ oder „abtrünnig“ wiedergegeben werden.
  rationale: Herz und Augen werden im Hebräischen beide mit זנה beschrieben. Eine rein abstrakte Wiedergabe würde die bewusst schockierende Anklage und die Verbindung zwischen Götzendienst und ehelicher Untreue abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die drastische prophetische Hurereimetapher bleibt erhalten, wird aber grammatisch so gestaltet, dass sie für heutige Leser verständlich ist. „Völker“ statt „Heiden“ vermeidet missverständliche konfessionelle oder neutestamentliche Nebenbedeutungen.
