  terminology: „Völker“, „Götzen“ und „Gräueltaten“ sind angemessen. „Gräueltaten“ gibt תּוֹעֵבוֹת im prophetisch-kultischen Kontext gewichtiger und quellengetreuer wieder als das allgemeinere „abscheuliche Taten“.
