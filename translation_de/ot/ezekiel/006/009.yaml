revisions:
- from: Dann werden eure Überlebenden unter den Völkern, unter die sie gefangen weggeführt wurden, an mich denken, wenn ich ihr hurerisches Herz, das sich von mir abgewandt hat, und ihre Augen, die ihren Götzen hurerisch nachgingen, zerbrochen habe.[a][b][c] Sie werden vor sich selbst Ekel empfinden wegen des Bösen, das sie mit all ihren abscheulichen Taten begangen haben.
  to: Dann werden eure Überlebenden unter den Völkern, unter die sie gefangen weggeführt wurden, an mich denken, wenn ich ihr Herz, das sich wie eine Hure von mir abgewandt hat, und ihre Augen, die wie Huren ihren Götzen nachliefen, zerbrochen habe.[a][b][c] Sie werden sich selbst verabscheuen wegen des Bösen, das sie begangen haben, wegen all ihrer Gräueltaten.
  rationale: Die Revision korrigiert die Bedeutung der Schlusspräposition, glättet die deutsche Syntax und bewahrt dennoch die drastische sexuelle Metapher des Hebräischen. Die aktive Hauptlesart bleibt im Text; die textlich und syntaktisch umstrittene Deutung göttlichen Gebrochenseins wird transparent, aber vorsichtig in der Anmerkung dokumentiert. Alle vorhandenen Fußnotenanker bleiben erhalten und stehen weiterhin bei der betreffenden Wendung.
