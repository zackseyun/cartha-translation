  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
translation:
  language: de
  text: Eure Altäre werden verwüstet, und eure Sonnensäulen[a] werden zerbrochen. Eure Erschlagenen werde ich vor euren Götzen[b] niederwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Räucheraltäre“ beziehungsweise „Kultmale“. Das hebräische Wort חַמָּנִים bezeichnet Gegenstände unerlaubter Verehrung, wahrscheinlich mit Bezug zum Sonnenkult; ihre genaue Form und Funktion sind unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort גִּלּוּלִים ist eine stark verächtliche Bezeichnung für Götzen; sinngemäß auch: „Dreckgötzen“ oder „Mistgötzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: werden verwüstet
  rationale: Das Nifal von שׁמם bezeichnet das Verwüstetwerden beziehungsweise den Zustand der Verödung. „Werden verwüstet“ gibt den resultativen Passivsinn und den Gerichtston klar wieder.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: eure Altäre
  rationale: Direkte und im kultischen Zusammenhang eindeutige Wiedergabe von מִזְבֵּחַ.
- source_word: נִשְׁבְּרוּ
  choice: zerbrochen werden
  rationale: Das Nifal von שׁבר bedeutet „zerbrochen werden“. Die Formulierung bleibt nah am Hebräischen, ohne die Gewaltsamkeit durch „zerschmettert“ zusätzlich zu verstärken.
- source_word: חַמָּנֵיכֶם
  choice: eure Sonnensäulen
  rationale: חַמָּנִים bezeichnet kultische Gegenstände unerlaubter Verehrung, wahrscheinlich mit solarem Bezug. „Sonnensäulen“ wahrt diese wahrscheinlichste konkrete Bedeutung; die sachliche Unsicherheit wird in einer Fußnote offengelegt.
- source_word: הִפַּלְתִּי
  choice: werde ich … zu Boden werfen
  rationale: Das Hifil von נפל ist kausativ („fallen lassen“, „niederwerfen“). „Zu Boden werfen“ drückt das absichtliche göttliche Handeln im Gericht aus.
- source_word: חַלְלֵיכֶם
  choice: eure Erschlagenen
  rationale: חָלָל bezeichnet durch Gewalt Getötete beziehungsweise Erschlagene. Die substantivierte Form „Erschlagenen“ ist präzise und fügt kein im Hebräischen unmarkiertes Geschlecht hinzu.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition hat hier den räumlichen Sinn „vor“ beziehungsweise „angesichts von“ und bewahrt die bittere Ironie, dass die Getöteten vor den verehrten Götzen liegen.
- source_word: גִּלּוּלֵיכֶם
  choice: euren Götzen
  rationale: „Götzen“ bezeichnet im Deutschen abwertend verehrte Götterbilder und gibt dadurch mehr von der polemischen Färbung des stark verächtlichen Ausdrucks גִּלּוּלִים wieder als das neutralere „Götterbilder“. Die noch drastischere wörtliche Konnotation wird in der Fußnote genannt.
theological_decisions:
- issue: Verächtliche Aussagekraft von גִּלּוּלִים
  choice: Im Haupttext „Götzen“, mit Erläuterung der drastischeren Konnotation in der Fußnote
  alternative: „Mistgötzen“ oder „Dreckgötzen“ unmittelbar im Haupttext
  rationale: Hesekiels Ausdruck ist bewusst polemisch und darf nicht neutralisiert werden. „Götzen“ ist im modernen Standarddeutsch verständlich und bereits wertend; die Fußnote bewahrt die besonders grobe hebräische Bildsprache, ohne eine unsichere Etymologie als allein mögliche Übersetzung auszugeben.
- issue: Bestimmung der חַמָּנִים
  choice: „Sonnensäulen“ im Haupttext
  alternative: „Räucheraltäre“, „Räucherständer“ oder allgemeiner „Kultmale“
  rationale: Die Gegenstände gehören eindeutig zum verurteilten Kult, ihre genaue Gestalt und Funktion ist jedoch nicht völlig sicher. „Sonnensäulen“ bildet die häufig angenommene Verbindung mit dem Sonnenkult ab; die Fußnote hält die lexikalische Unsicherheit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gerichtssprache. Die parallelen Passivformen des ersten Satzes und die hervorgehobene göttliche Handlung im zweiten Satz bilden die hebräische Struktur natürlich nach. Sämtliche Fußnotenmarker stehen unmittelbar bei dem jeweils erläuterten Ausdruck.
