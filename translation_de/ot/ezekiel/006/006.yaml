reference: Ezekiel 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/כֹל֙ מוֹשְׁב֣וֹתֵי/כֶ֔ם הֶ/עָרִ֣ים תֶּחֱרַ֔בְנָה וְ/הַ/בָּמ֖וֹת תִּישָׁ֑מְנָה לְמַעַן֩ יֶחֶרְב֨וּ וְ/יֶאְשְׁמ֜וּ מִזְבְּחֽוֹתֵי/כֶ֗ם וְ/נִשְׁבְּר֤וּ וְ/נִשְׁבְּתוּ֙ גִּלּ֣וּלֵי/כֶ֔ם וְ/נִגְדְּעוּ֙ חַמָּ֣נֵי/כֶ֔ם וְ/נִמְח֖וּ מַעֲשֵׂי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/006.yaml
  text: In all your dwelling places[a], the cities will be laid waste and the high places will be desolated, so that your altars may be laid waste and desolated, and your idols broken and brought to an end, and your incense altars cut down[b], and your works wiped out.
translation:
  language: de
  text: An allen euren Wohnorten werden die Städte verwüstet und die Kulthöhen verödet, damit eure Altäre verwüstet und verödet werden, eure Götzen[a] zerbrochen und beseitigt, eure Kultmale[b] umgehauen und eure Werke ausgelöscht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Götzen“ ist ausgesprochen verächtlich und kann an „Mist“ oder „Unrat“ anklingen.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet nicht eindeutig bestimmbare Kultgegenstände; möglich sind „Räucheraltäre“, „Sonnensäulen“ oder „Sonnenbilder“.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: euren Wohnorten
  rationale: Bezeichnet allgemein die Orte, an denen die Angesprochenen wohnen; „Wohnorte“ ist natürlich und bewahrt die Breite des Ausdrucks.
- source_word: הֶעָרִים תֶּחֱרַבְנָה
  choice: die Städte werden verwüstet
  rationale: חרב bezeichnet hier die durch das Gericht verursachte Verwüstung beziehungsweise Zerstörung.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: Der Ausdruck bezeichnet kultische Höhen beziehungsweise Höhenheiligtümer. „Kulthöhen“ macht die religiöse Funktion für heutige Leser deutlich.
- source_word: תִּישָׁמְנָה
  choice: werden verödet
  rationale: Das Verb beschreibt das Öde- oder Verlassensein; „verödet“ erhält die Parallele zur Verwüstung der Städte.
- source_word: לְמַעַן
  choice: sodass
  rationale: Die Partikel kann Zweck oder Folge ausdrücken. „Sodass“ bewahrt hier die mögliche Ergebnisnuance, ohne eine ausschließliche Deutung zu erzwingen.
- source_word: יֶחֶרְבוּ וְיֶאְשְׁמוּ מִזְבְּחוֹתֵיכֶם
  choice: eure Altäre verwüstet und verheert
  rationale: Zwei unterschiedliche Verben verstärken die angekündigte Vernichtung; beide werden wiedergegeben.
- source_word: גִּלּוּלֵיכֶם
  choice: eure Götzen
  rationale: „Götzen“ ist klar und trägt im Deutschen bereits eine abwertende Färbung; die besonders verächtliche Nuance des hebräischen Wortes wird in der Fußnote erläutert.
- source_word: וְנִשְׁבְּרוּ וְנִשְׁבְּתוּ
  choice: zerbrochen und beseitigt
  rationale: Das erste Verb bezeichnet das Zerbrechen, das zweite das Aufhören beziehungsweise Zu-Ende-Bringen. „Beseitigt“ gibt den resultierenden Fortfall knapp wieder.
- source_word: חַמָּנֵיכֶם
  choice: eure Kultmale
  rationale: Der genaue Gegenstand ist umstritten. Der neutrale kultische Oberbegriff vermeidet eine ungesicherte Festlegung auf Räucheraltäre oder Sonnenmale; die Alternativen stehen in der Fußnote.
- source_word: וְנִגְדְּעוּ
  choice: umgehauen
  rationale: Das Verb bezeichnet ein Abhauen oder Fällen und passt zu aufgerichteten kultischen Gegenständen.
- source_word: וְנִמְחוּ מַעֲשֵׂיכֶם
  choice: eure Werke ausgelöscht
  rationale: מחה bezeichnet Auswischen oder Tilgen. „Werke“ wahrt die Mehrdeutigkeit zwischen Taten und hergestellten Kultgegenständen.
theological_decisions:
- issue: Wiedergabe der konkreten Verurteilung des Götzendienstes
  choice: Die kultischen Orte und Gegenstände werden ausdrücklich benannt, und die scharfe Gerichtssprache bleibt erhalten.
  alternative: Die Aussage allgemein als Verurteilung falscher Religion zu paraphrasieren oder „Götzen“ im Haupttext noch drastischer auszubauen.
  rationale: Der hebräische Text richtet sich konkret gegen Städte, Kulthöhen, Altäre, Götzen und weitere Kultgegenstände. Diese Einzelheiten sollen weder verallgemeinert noch rhetorisch übersteigert werden.
- issue: Identifikation von חַמָּנִים
  choice: Im Haupttext steht das zurückhaltende „Kultmale“, ergänzt durch eine Fußnote.
  alternative: „Räucheraltäre“, „Sonnensäulen“ oder „Sonnenbilder“ als eindeutige Haupttextübersetzung.
  rationale: Die Art dieser Kultobjekte und ihre mögliche Verbindung mit Sonnenverehrung sind lexikalisch und archäologisch umstritten. Eine offene Wiedergabe bewahrt die genuine Unsicherheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gerichtssprache. Die Reihung der passiven Verbformen folgt dem hebräischen Parallelismus, bleibt aber im Deutschen lesbar. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Begriffen.
