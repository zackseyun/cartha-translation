  text: וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/נָתַתִּ֨י אֶת הָ/אָ֜רֶץ שְׁמָמָ֤ה וּ/מְשַׁמָּה֙ מִ/מִּדְבַּ֣ר דִּבְלָ֔תָ/ה בְּ/כֹ֖ל מוֹשְׁבֽוֹתֵי/הֶ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/014.yaml
  text: So I will stretch out my hand against them and make the land a desolation and a waste[a], from the wilderness toward Diblath, throughout all their settlements[b]. Then they will know that I am Yahweh.
translation:
  language: de
  text: So werde ich meine Hand gegen sie ausstrecken und das Land zu Ödnis und Verwüstung machen, von der Wüste bis nach Diblath[a], in all ihren Siedlungen[b]. Dann werden sie erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „von der Wüste nach Diblath“. Der Ortsname und die genaue Bedeutung der Wendung sind unsicher; auch „von der Wüste bis Diblath“ ist möglich. Manche Textvorschläge beziehen die Stelle auf Ribla.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „an all ihren Wohnorten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי אֶת־יָדִי עֲלֵיהֶם
  choice: So strecke ich meine Hand gegen sie aus
  rationale: Die Wendung bezeichnet hier Jahwes strafendes Eingreifen. „Gegen sie“ gibt die feindliche Bedeutung von עַל im Zusammenhang wieder; „meine Hand ausstrecken“ bewahrt das prophetische Bild.
- source_word: וְנָתַתִּי אֶת־הָאָרֶץ
  choice: und mache das Land
  rationale: 'נתן mit der folgenden Zustandsangabe hat hier faktitive Bedeutung: Jahwe bewirkt, dass das Land in den genannten Zustand gerät.'
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: zu Ödnis und Verwüstung
  rationale: Die zwei sinnverwandten Substantive verstärken das Bild vollständiger Zerstörung. Die deutsche Doppelformulierung erhält diese Intensivierung, ohne מְשַׁמָּה einseitig als emotionales „Entsetzen“ festzulegen.
- source_word: מִמִּדְבַּר דִּבְלָתָה
  choice: von der Wüste bis in die Gegend von Dibla
  rationale: Die Form דִּבְלָתָה lässt sich am ehesten als Ortsname mit Richtungsendung verstehen. „Bis in die Gegend von“ gibt die räumliche Ausdehnung wieder, ohne wegen der unsicheren Identifizierung des Ortes eine übertriebene geografische Präzision vorzutäuschen.
- source_word: בְּכֹל מוֹשְׁבוֹתֵיהֶם
  choice: überall an ihren Wohnorten
  rationale: מוֹשָׁב bezeichnet bewohnte Orte beziehungsweise Siedlungsplätze. Die Formulierung ist gegenwärtiges, verständliches Deutsch und bewahrt den umfassenden Sinn von בְּכֹל.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Dann werden sie erkennen, dass ich Jahwe bin
  rationale: „Dann“ macht den resultativen Zusammenhang der wiederkehrenden Erkenntnisformel natürlich deutlich. „Erkennen“ trägt hier stärker als bloßes „wissen“ den Sinn einer durch das Gericht erzwungenen Einsicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen direkt wieder und bewahrt die Aussage der Erkenntnisformel, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung der schwierigen Ortsangabe מִמִּדְבַּר דִּבְלָתָה
  choice: 'geografische Ausdehnung: „von der Wüste bis in die Gegend von Dibla“'
  alternative: „von der Wüste bis Dibla“; Bezug auf Ribla; eine adverbiale Steigerung der Verwüstung
  rationale: Der überlieferte hebräische Text legt am ehesten einen Ortsnamen mit Richtungsangabe nahe. Da Ort und Lesart unsicher sind, wahrt die Übersetzung den geografischen Sinn, während die Fußnote die anderen Möglichkeiten offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Bildsprache („meine Hand gegen sie ausstrecken“) und die verstärkende Doppelbezeichnung der Verwüstung bleiben erhalten. Die unsichere geografische Wendung wird im Haupttext lesbar, aber bewusst nicht überpräzise formuliert.
