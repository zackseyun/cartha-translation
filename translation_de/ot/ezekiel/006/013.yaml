  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּֽ/הְי֣וֹת חַלְלֵי/הֶ֗ם בְּ/תוֹךְ֙ גִּלּ֣וּלֵי/הֶ֔ם סְבִיב֖וֹת מִזְבְּחֽוֹתֵי/הֶ֑ם אֶל֩ כָּל גִּבְעָ֨ה רָמָ֜ה בְּ/כֹ֣ל רָאשֵׁ֣י הֶ/הָרִ֗ים וְ/תַ֨חַת כָּל עֵ֤ץ רַֽעֲנָן֙ וְ/תַ֨חַת֙ כָּל אֵלָ֣ה עֲבֻתָּ֔ה מְק֗וֹם אֲשֶׁ֤ר נָֽתְנוּ שָׁם֙ רֵ֣יחַ נִיחֹ֔חַ לְ/כֹ֖ל גִּלּוּלֵי/הֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/013.yaml
  text: Then you will know that I am Yahweh[a], when their slain lie among their idols, all around their altars, on every high hill, on all the mountaintops, and under every green tree and under every leafy terebinth—the places where they offered a pleasing aroma to all their idols.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich Jahwe bin, wenn ihre Erschlagenen inmitten ihrer Götzenbilder[a] liegen, rings um ihre Altäre, auf jedem hohen Hügel, auf allen Berggipfeln, unter jedem grünen Baum und unter jeder dicht belaubten Terebinthe – an den Orten, wo sie all ihren Götzenbildern wohlriechenden Duft dargebracht haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort גִּלּוּלִים ist eine stark verächtliche Bezeichnung für Götzenbilder; sehr wörtlich ließe es sich etwa mit „Mistgötzen“ oder „Kotgötzen“ wiedergeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das mit וְ verbundene Qal-Perfekt hat im prophetischen Zusammenhang zukünftige und folgernde Bedeutung. „Dann“ gibt diese Folgebeziehung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּהְיוֹת חַלְלֵיהֶם
  choice: wenn ihre Erschlagenen … liegen
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen beziehungsweise begleitenden Umstand. חָלָל meint gewaltsam Getötete; das im Deutschen ergänzte „liegen“ macht das Ortsbild verständlich, ohne den Sinn zu verändern.
- source_word: בְּתוֹךְ גִּלּוּלֵיהֶם
  choice: inmitten ihrer Götzenbilder
  rationale: „Inmitten“ bewahrt die räumliche Bildhaftigkeit. גִּלּוּלִים ist eine stark verächtliche Bezeichnung, deren Ton in einer Fußnote erläutert wird.
- source_word: סְבִיבוֹת מִזְבְּחוֹתֵיהֶם
  choice: rings um ihre Altäre
  rationale: Die Formulierung gibt die umfassende Verteilung der Erschlagenen um die Altäre knapp und idiomatisch wieder.
- source_word: אֶל כָּל גִּבְעָה רָמָה
  choice: auf jedem hohen Hügel
  rationale: אֶל hat hier innerhalb der Aufzählung von Kultorten lokative Funktion; „auf“ entspricht dem natürlichen deutschen Ausdruck.
- source_word: בְּכֹל רָאשֵׁי הֶהָרִים
  choice: auf allen Berggipfeln
  rationale: Wörtlich steht „auf allen Häuptern der Berge“; „Berggipfel“ gibt das hebräische Bild idiomatisch wieder.
- source_word: תַחַת כָּל עֵץ רַעֲנָן
  choice: unter jedem grünen Baum
  rationale: Die geläufige prophetische Wendung und ihr anschauliches Bild werden möglichst direkt bewahrt.
- source_word: תַחַת כָּל אֵלָה עֲבֻתָּה
  choice: unter jeder dicht belaubten Terebinthe
  rationale: אֵלָה bezeichnet wahrscheinlich die Terebinthe; עֲבֻתָּה beschreibt ihren dichten, üppigen Bewuchs.
- source_word: מְקוֹם אֲשֶׁר נָתְנוּ שָׁם רֵיחַ נִיחֹחַ
  choice: an den Orten, wo sie … wohlriechenden Duft dargebracht haben
  rationale: Das formal singularische מְקוֹם wird nach der Reihe verschiedener Stätten kollektiv verstanden. „Darbringen“ macht die kultische Handlung deutlich; „wohlriechender Duft“ bewahrt die Opferterminologie.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ wahrt seinen Charakter als Eigenname.
- issue: Verächtlicher Ton von גִּלּוּלִים
  choice: Götzenbilder im Haupttext mit Erläuterung in der Fußnote
  alternative: Mistgötzen oder widerliche Götzen
  rationale: Eine drastisch wörtliche Wiedergabe würde im modernen Deutschen leicht künstlich oder erklärungsbedürftig wirken. „Götzenbilder“ ist verständlich, während die Fußnote den bewusst abwertenden Ton des Hebräischen sichert.
- issue: רֵיחַ נִיחֹחַ im Zusammenhang mit Götzenopfern
  choice: wohlriechender Duft
  alternative: beruhigender Duft
  rationale: Die übliche kultische Formel wird auch hier verwendet, obwohl die Opfer Götzen gelten. Die Übersetzung bewahrt diese theologisch spannungsvolle Wortwahl, ohne sie zustimmend umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Ortsaufzählung und die eindringliche Wiederholung bleiben erhalten; ein Gedankenstrich gliedert den abschließenden Rückbezug auf die Kultstätten. Der Fußnotenmarker steht unmittelbar bei dem erläuterten Ausdruck.
