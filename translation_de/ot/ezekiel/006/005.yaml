source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת פִּגְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/זֵרִיתִי֙ אֶת עַצְמ֣וֹתֵי/כֶ֔ם סְבִיב֖וֹת מִזְבְּחוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/005.yaml
  text: And I will place the corpses of the sons of Israel before their idols[a], and I will scatter your bones around your altars.
translation:
  language: de
  text: Und ich werde die Leichen der Israeliten vor ihre Götzen[a] legen und eure Gebeine rings um eure Altäre verstreuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort גִּלּוּלִים ist Hesekiels verächtliche Bezeichnung für Götzen; es kann eine abwertende Nuance wie „widerliche Götzen“ oder sogar „Mistgötzen“ haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … legen
  rationale: נתן bedeutet allgemein „geben, setzen, legen“. Bei Leichen als Objekt und einer Ortsangabe mit לִפְנֵי gibt „legen“ die konkrete Handlung im Deutschen natürlich wieder.
- source_word: פִּגְרֵי
  choice: die Leichen
  rationale: פגר bezeichnet einen Leichnam bzw. Kadaver. Für menschliche Tote ist „Leichen“ präzise und bewahrt die drastische Wirkung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die feste ethnische Bezeichnung „Söhne Israels“ meint hier das Volk Israel. „Israeliten“ ist im modernen Deutschen idiomatisch und vermeidet die mögliche Fehlannahme, nur männliche Personen seien gemeint.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bezeichnet hier die räumliche Lage „vor“ und erhält die bittere kultische Ironie der Szene.
- source_word: גִּלּוּלֵיהֶם
  choice: ihre Götzen
  rationale: גִּלּוּלִים ist Hesekiels verächtliche Bezeichnung für Götzenbilder. „Götzen“ benennt den Bezug klar; die möglicherweise noch gröbere abwertende Nuance wird in der Fußnote offengelegt.
- source_word: וְזֵרִיתִי
  choice: und … verstreuen
  rationale: זרה kann „zerstreuen“, „verstreuen“ oder „worfeln“ bedeuten. Bei Gebeinen und einer räumlichen Verteilung um Altäre ist „verstreuen“ konkret und idiomatisch.
- source_word: עַצְמוֹתֵיכֶם
  choice: eure Gebeine
  rationale: עֶצֶם bedeutet hier „Knochen/Gebeine“. „Gebeine“ passt zum würdevoll-prophetischen Register und bewahrt den direkten Pluraladressaten „eure“.
- source_word: סְבִיבוֹת
  choice: rings um
  rationale: Das Wort bezeichnet die Umgebung bzw. eine Verteilung ringsherum. „rings um“ gibt dies knapp und natürlich wieder.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: eure Altäre
  rationale: מִזְבֵּחַ bedeutet „Altar“; das Suffix der zweiten Person Plural wird als „eure“ bewahrt und ordnet die Altäre den Angesprochenen zu.
theological_decisions:
- issue: Wiedergabe der ethnischen Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische Wendung ist hier eine konventionelle Bezeichnung für das Volk Israel und nicht erkennbar auf Männer beschränkt. „Israeliten“ bewahrt den ethnischen Bezug in natürlichem modernem Deutsch.
- issue: Wiedergabe von Hesekiels polemischem Ausdruck גִּלּוּלִים
  choice: Götzen
  alternative: Mistgötzen / widerliche Götzen
  rationale: Der Ausdruck ist eindeutig abwertend, doch seine genaue bildhafte Herleitung und Stärke bleiben umstritten. Der Haupttext benennt den Referenten klar, während die Fußnote die echte pejorative Nuance transparent macht, ohne sie einseitig festzulegen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdevoll-prophetischem Ton. „Leichen“ erhält die drastische Konkretheit, „Gebeine“ das gehobene biblische Register. Der Wechsel von „ihre“ zu „eure“ folgt genau dem Wechsel der hebräischen Pronominalsuffixe.
