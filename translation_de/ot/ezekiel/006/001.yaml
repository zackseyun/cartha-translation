  source_fidelity: Die Übersetzung gibt die Formel וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר sachgerecht wieder. „Und das Wort Jahwes kam zu mir“ bildet die narrative Anknüpfung, die prophetische Wortformel und אֵלַי präzise ab. Der Doppelpunkt ist eine idiomatische deutsche Entsprechung für לֵאמֹר, dessen angekündigte Rede in V. 2 folgt.
  naturalness: „Und das Wort Jahwes kam zu mir:“ ist modernes, würdiges und natürliches Standarddeutsch. Die Formulierung wahrt den formelhaften Charakter prophetischer Rede, ohne unnötig archaisch zu wirken.
