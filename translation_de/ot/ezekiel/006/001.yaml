base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] kam zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), hier „Jahwe“; traditionell wird der Gottesname mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: 'Die Wayyiqtol-Form von היה führt die fortlaufende Erzählung weiter. Im Deutschen wird sie idiomatisch mit dem Verb der Gesamtaussage verbunden: „Und das Wort … kam“.'
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְבַר־יְהוָה bewahrt „das Wort“ die geprägte Ausdrucksweise und vermeidet die stärker deutende Wiedergabe „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text bietet den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit dem Suffix der ersten Person Singular bezeichnet die Richtung zum Propheten; „zu mir“ ist die natürliche deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Gottesrede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“ oder ein vorangestelltes „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen unmittelbar. Die Hauptfassung bewahrt ihn als Eigennamen; die Fußnote nennt die traditionelle deutsche Wiedergabe, ohne Name und Titel gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute prophetische Formel bleibt erhalten; der Doppelpunkt gibt לֵאמֹר idiomatisch wieder und öffnet die Gottesrede in Vers 2.
