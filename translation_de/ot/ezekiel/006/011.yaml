source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַכֵּ֨ה בְ/כַפְּ/ךָ֜ וּ/רְקַ֤ע בְּ/רַגְלְ/ךָ֙ וֶֽ/אֱמָר אָ֔ח אֶ֛ל כָּל תּוֹעֲב֥וֹת רָע֖וֹת בֵּ֣ית יִשְׂרָאֵ֑ל אֲשֶׁ֗ר בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר יִפֹּֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/011.yaml
  text: 'Thus says the Lord GOD: Strike your hand and stamp your foot[a], and say, “Alas!” because of all the evil abominations of the house of Israel, who will fall by the sword, by famine[c][b], and by pestilence.'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Schlag in die Hände[a] und stampfe mit deinem Fuß! Sage: »Ach!« über all die bösen Gräueltaten des Hauses Israel[b]; seine Angehörigen werden durch Schwert, Hunger und Pest fallen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schlag mit deiner Handfläche.« Das Hebräische bezeichnet eine nachdrückliche Schlagbewegung mit der Handfläche und kann hier Händeklatschen meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wegen all der bösen Gräueltaten des Hauses Israel«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: אֲדֹנָי wird als Titel »der Herr« und der Gottesname יְהוִה als »Yahweh« wiedergegeben; so bleiben Titel und Eigenname unterscheidbar.
- source_word: הַכֵּה בְכַפְּךָ
  choice: Schlag mit deiner Hand
  rationale: Die Formulierung bewahrt das körperliche Zeichen, ohne die nicht ausdrücklich genannte zweite Hand in den Haupttext einzutragen. Ein Händeklatschen beziehungsweise Zusammenschlagen der Hände ist als idiomatische Deutung möglich und wird in der Fußnote genannt.
- source_word: וּרְקַע בְרַגְלְךָ
  choice: stampfe mit deinem Fuß
  rationale: רקע bezeichnet hier ein kräftiges Aufstampfen als Ausdruck von Klage oder nachdrücklicher Ankündigung.
- source_word: וֶאֱמָר אָח
  choice: 'Sage: »Ach!«'
  rationale: אָח ist hier ein Klageruf angesichts des bevorstehenden Gerichts; »Ach!« erhält die knappe, unmittelbare Interjektion.
- source_word: אֶל כָּל תּוֹעֲבוֹת רָעוֹת
  choice: über all die bösen Gräueltaten
  rationale: אֶל bezeichnet nach dem Klageruf dessen Bezug oder Anlass. »Über« lässt sowohl Klage angesichts der Taten als auch ihre Anprangerung anklingen. »Gräueltaten« bewahrt die starke kultisch-moralische Wertung von תּוֹעֵבָה.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die kollektive Bundesbezeichnung wird beibehalten und nicht schlicht zu »Israel« verkürzt.
- source_word: אֲשֶׁר ... יִפֹּלוּ
  choice: seine Angehörigen werden … umkommen
  rationale: Das pluralische Verb bezieht sich sinngemäß auf die Menschen des kollektiv bezeichneten Hauses Israel. »Umkommen« gibt das Fallen durch die drei Todesarten in natürlichem Deutsch wieder.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: durch Schwert, Hunger und Pest
  rationale: Die feste prophetische Gerichtstrias wird knapp und würdig wiedergegeben; דֶּבֶר bezeichnet eine tödliche Seuche beziehungsweise Pest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Fassung gibt den im hebräischen Text stehenden Bundesnamen als Namen wieder und unterscheidet ihn vom vorangestellten Herrentitel, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Bezug des angekündigten Fallens
  choice: die Angehörigen des Hauses Israel kommen um
  alternative: das Haus Israel fällt
  rationale: Das pluralische יִפֹּלוּ weist auf die Menschen der kollektiv bezeichneten Gemeinschaft. Die deutsche Formulierung macht diesen Bezug verständlich, ohne die Gräueltaten selbst zum Subjekt des Fallens zu machen.
- issue: Funktion von אֶל nach dem Klageruf
  choice: Klage »über« die Gräueltaten
  alternative: Klage »wegen« der Gräueltaten
  rationale: Die Präposition kann Bezug oder Anlass der Klage markieren. »Über« wahrt diese Spannweite besser als eine rein kausale Festlegung; die Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit prophetisch-feierlichem Ton. Die kurzen Imperative und der Klageruf bleiben bewusst eindringlich; altertümliche Wendungen werden vermieden.
