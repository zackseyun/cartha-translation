  text: וּ֠/לְ/אֵ֜לֶּה תִּהְיֶ֣ה תְרֽוּמַת הַ/קֹּדֶשׁ֮ לַ/כֹּֽהֲנִים֒ צָפ֜וֹנָ/ה חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים אֶ֗לֶף וְ/יָ֨מָּ/ה֙ רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/קָדִ֗ימָ/ה רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/נֶ֕גְבָּ/ה אֹ֕רֶךְ חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וְ/הָיָ֥ה מִקְדַּשׁ יְהוָ֖ה בְּ/תוֹכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/010.yaml
  text: 'And for these[a], the holy contribution shall belong to the priests: on the north, twenty-five thousand in length; on the west, ten thousand in width; on the east, ten thousand in width; and on the south, twenty-five thousand in length[b]; and the sanctuary of Yahweh shall be in its midst.'
translation:
  language: de
  text: 'Für sie, die Priester, ist die heilige Abgabe[a] bestimmt: Die Nordseite soll 25.000 lang sein, die Westseite 10.000 breit, die Ostseite 10.000 breit und die Südseite 25.000 lang[b]. Das Heiligtum Jahwes soll in ihrer Mitte liegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist ein für den heiligen Dienst ausgesonderter Landanteil; auch: „heiliger Landanteil“ oder „geheiligte Gabe“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen wird keine Maßeinheit genannt. Bei der Nordseite ist „lang“ zur Verdeutlichung aus der parallelen Angabe für die Südseite ergänzt.
    reason: implicit_measurement_and_ellipsis
lexical_decisions:
- source_word: וּלְאֵלֶּה ... לַכֹּהֲנִים
  choice: Und diesen, den Priestern, soll ... gehören
  rationale: Die beiden mit ל gebildeten Ausdrücke bezeichnen die Empfänger der Zuteilung. Die appositionelle Formulierung ist im Deutschen natürlich und bewahrt den demonstrativen Rückbezug von אֵלֶּה.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: die heilige Abgabe
  rationale: תְּרוּמָה bezeichnet grundsätzlich eine für Gott ausgesonderte Abgabe; hier ist damit ein geheiligter Landanteil gemeint. „Heilige Abgabe“ bewahrt den kultischen Klang, ohne den Ausdruck vorschnell auf „Gebiet“ einzuengen.
- source_word: צָפוֹנָה / וְיָמָּה / וְקָדִימָה / וְנֶגְבָּה
  choice: Nordseite / Westseite / Ostseite / Südseite
  rationale: In der Grenz- und Maßbeschreibung bezeichnen die Richtungswörter die jeweiligen Seiten des Landstücks. „Seite“ wird zur verständlichen deutschen Formulierung ergänzt.
- source_word: רֹחַב / אֹרֶךְ
  choice: breit / lang
  rationale: Die Adjektive geben den Gegensatz von Breite und Länge in flüssigem modernem Deutsch wieder. Beim nördlichen Maß ist „lang“ aus der parallelen südlichen Angabe sinngemäß ergänzt.
- source_word: מִקְדַּשׁ יְהוָה
  choice: das Heiligtum Jahwes
  rationale: מִקְדָּשׁ ist das ausgesonderte Heiligtum; der Gottesname יהוה wird in der im Deutschen etablierten Form „Jahwe“ wiedergegeben.
- source_word: בְּתוֹכוֹ
  choice: in ihrer Mitte
  rationale: Das maskuline Suffix bezieht sich auf den als Landanteil gedachten Bereich der heiligen Abgabe. Im Deutschen richtet sich das Pronomen grammatisch nach „Abgabe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תְּרוּמַת הַקֹּדֶשׁ
  choice: heilige Abgabe
  alternative: heiliger Landanteil
  rationale: Der Ausdruck hat hier eindeutig räumlichen Bezug, behält aber zugleich seine kultische Bedeutung als Gott vorbehaltene Abgabe. Die Übersetzung wahrt beide Aspekte; die Fußnote erläutert den konkreten Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Maßbeschreibung wird durch „Seite“ und beim Nordmaß durch „lang“ verständlich gemacht; die Ergänzungen werden in der Fußnote offengelegt. Die Zahlen bleiben entsprechend dem Ausgangstext ohne ausgeschriebene Maßeinheit.
