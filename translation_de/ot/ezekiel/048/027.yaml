  text: וְ/עַ֣ל גְּב֣וּל זְבוּלֻ֗ן מִ/פְּאַ֥ת קָדִ֛מָ/ה עַד פְּאַת יָ֖מָּ/ה גָּ֥ד אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/027.yaml
  text: And along the border of Zebulun[a], from the east side to the west side, Gad, one portion.
translation:
  language: de
  text: 'Und entlang der Grenze Sebulons, von der Ostseite bis zur Westseite: Gad – ein Anteil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen nur: „Gad – einer.“ Das Wort „Anteil“ ist nach der wiederkehrenden Zuteilungsformel dieses Kapitels ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Und an
  rationale: In der fortlaufenden Grenz- und Zuteilungsformel führt עַל den nächsten Stammesstreifen ein. „An“ gibt die räumliche Zuordnung zur Grenze im Deutschen knapp und natürlich wieder.
- source_word: גְּבוּל
  choice: der Grenze
  rationale: גְּבוּל bezeichnet hier die Grenzlinie zwischen den Stammesgebieten; „Grenze“ passt zur geografischen Formel des Kapitels.
- source_word: זְבוּלֻן
  choice: Sebulons
  rationale: Der Stammesname wird nach geläufiger deutscher Bibelkonvention als „Sebulon“ wiedergegeben; der Genitiv folgt aus der deutschen Satzfügung.
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: von der Ostseite
  rationale: פֵּאָה bezeichnet eine Seite oder einen Rand, קָדִימָה die östliche Richtung. Die Wiedergabe wahrt die räumliche Markierung.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: bis zur Westseite
  rationale: Die Wendung bezeichnet die Ausdehnung bis zur westlichen Seite; יָמָּה hat in dieser geografischen Formel die Bedeutung „westwärts/im Westen“.
- source_word: גָּד
  choice: Gad
  rationale: Der Eigenname des Stammes wird in der etablierten deutschen Form wiedergegeben.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Im Hebräischen steht elliptisch nur „einer/eins“. Aus der wiederkehrenden Zuteilungsformel des Kapitels ergibt sich als mitgedachter Bezug „Anteil“, der zur Verständlichkeit ergänzt und in einer Fußnote offengelegt wird.
theological_decisions: []
