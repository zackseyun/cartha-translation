  text: הַ/תְּרוּמָ֕ה אֲשֶׁ֥ר תָּרִ֖ימוּ לַֽ/יהוָ֑ה אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֥רֶת אֲלָפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/009.yaml
  text: The contribution that you shall set apart for Yahweh shall be twenty-five thousand in length and ten thousand in width[a].
translation:
  language: de
  text: Die Abgabe, die ihr für Jahwe aussondern sollt, soll fünfundzwanzigtausend lang und zehntausend breit sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Opfergabe“ oder „ausgesonderter Anteil“. Das hebräische Wort bezeichnet etwas, das als Abgabe bestimmt beziehungsweise ausgesondert wird; hier ist damit der heilige Landstreifen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרוּמָה
  choice: die Abgabe
  rationale: תְּרוּמָה bezeichnet etwas, das als Gabe oder besonderer Anteil ausgesondert wird. Im Landverteilungskontext ist „Abgabe“ verständlich und vermeidet die Verengung auf ein kultisches Opfer.
- source_word: אֲשֶׁר תָּרִימוּ
  choice: die ihr … aussondern sollt
  rationale: Das Hifil von רוּם bezeichnet hier das Absondern beziehungsweise Bereitstellen eines Landanteils als Abgabe; eine wörtliche Wiedergabe als „emporheben“ wäre im Deutschen irreführend.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: ל kennzeichnet hier die Widmung; „für“ gibt die Bestimmung des ausgesonderten Anteils natürlich wieder. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: fünfundzwanzigtausend lang
  rationale: Die natürliche deutsche Maßangabe bewahrt die genannte Länge. Eine Maßeinheit wird nicht ergänzt, da sie im hebräischen Vers nicht ausdrücklich steht.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: und zehntausend breit
  rationale: Die parallele deutsche Formulierung gibt die Breite knapp und klar wieder; auch hier bleibt die im Ausgangstext unausgesprochene Maßeinheit unausgesprochen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תְּרוּמָה im Landverteilungskontext
  choice: Abgabe
  alternative: Opfergabe; ausgesonderter Anteil
  rationale: Der Begriff bezeichnet hier einen Jahwe gewidmeten Landstreifen. „Abgabe“ hält sowohl den Gabecharakter als auch den sachlichen Landbezug offen, ohne ein ausschließlich kultisches Opfer anzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Maßsprache folgt dem Hebräischen; die dort nicht genannte Maßeinheit wird nicht ergänzt.
