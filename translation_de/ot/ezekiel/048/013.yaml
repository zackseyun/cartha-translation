  naturalness: Der Entwurf ist insgesamt gut verständlich und modern. Ohne die ergänzte Einheit bleiben die Maßangaben ebenso natürlich, wenn sie parallel als „in der Länge“ und „in der Breite“ formuliert werden.
  terminology: „Leviten“, „Priester“ und „Gebiet“ sind sachgerecht. „Anteil erhalten“ ist eine behutsame und im Kontext verständliche Auflösung der hebräischen Nominalellipse.
