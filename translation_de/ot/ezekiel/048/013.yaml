base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/013.yaml
  text: And alongside the territory of the priests[a], the Levites shall have twenty-five thousand cubits in length and ten thousand in width. The whole length shall be twenty-five thousand, and the width ten thousand.
translation:
  language: de
  text: 'Und die Leviten sollen neben dem Gebiet der Priester einen Anteil erhalten: 25.000 in der Länge und 10.000 in der Breite. Die gesamte Länge beträgt 25.000 und die Breite 10.000.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: sollen die Leviten einen Anteil erhalten
  rationale: Der hebräische Satz ist elliptisch und enthält kein ausdrückliches Verb. Aus dem Zusammenhang der Landzuteilungen wird für natürliches Deutsch ergänzt, dass die Leviten einen Anteil erhalten sollen.
- source_word: לְעֻמַּת
  choice: neben
  rationale: Die Präposition bezeichnet hier die räumliche Zuordnung beziehungsweise Nachbarschaft zum Gebiet der Priester. „Neben“ ist im Deutschen klar und natürlich.
- source_word: גְּבוּל הַכֹּהֲנִים
  choice: dem Gebiet der Priester
  rationale: גְּבוּל kann Grenze oder abgegrenztes Gebiet bedeuten; hier ist das den Priestern zugeteilte Land gemeint.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: 25.000 Ellen
  rationale: Im Hebräischen steht nur die Zahl. Die Maßeinheit „Ellen“ wird aus dem Zusammenhang von Hesekiel 48 ergänzt und durch eine Fußnote kenntlich gemacht.
- source_word: אֹרֶךְ
  choice: lang / Gesamtlänge
  rationale: Die erste Nennung wird als natürliche deutsche Maßangabe wiedergegeben; in der zusammenfassenden Wiederholung bezeichnet das Wort die gesamte Länge.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: und 10.000 Ellen breit
  rationale: Die Formulierung bewahrt die parallelen Maßangaben in natürlichem modernem Deutsch.
- source_word: כָּל אֹרֶךְ
  choice: Die Gesamtlänge
  rationale: כָּל hebt hier das vollständige Längenmaß hervor; „Gesamtlänge“ gibt die zusammenfassende Wiederholung knapp und idiomatisch wieder.
