  yaml_path: translation/ot/ezekiel/048/023.yaml
  text: 'And for the rest of the tribes: from the eastern side to the western side[a], Benjamin, one portion.'
translation:
  language: de
  text: 'Und für die übrigen Stämme: Von der Ostseite bis zur Westseite: Benjamin, ein Anteil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Benjamin, einer.“ „Ein Anteil“ ist ergänzt, weil „einer“ in diesem Kapitel verkürzt für einen Stammesanteil steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר הַשְּׁבָטִים
  choice: Und was die übrigen Stämme betrifft
  rationale: Die Wendung eröffnet einen neuen Abschnitt über die noch verbleibenden Stämme. Die deutsche Formulierung bewahrt sowohl den Anschluss durch וְ als auch den Sinn von יֶתֶר und klingt natürlich.
- source_word: מִפְּאַת קָדִימָה
  choice: von der Ostseite
  rationale: פֵּאָה bezeichnet eine Seite, einen Rand oder eine Grenze; mit קָדִימָה ist hier die östliche Seite des Gebietsstreifens gemeint.
- source_word: עַד פְּאַת יָמָּה
  choice: bis zur Westseite
  rationale: יָמָּה bezeichnet in dieser Richtungsform den Westen beziehungsweise die dem Meer zugewandte Seite. „Bis zur Westseite“ gibt die wiederkehrende Gebietsformel klar wieder.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Der überlieferte deutsche Name des Stammes wird beibehalten.
- source_word: אֶחָד
  choice: einen Anteil
  rationale: Wörtlich steht nur „einer/eins“. Im Zusammenhang der Landverteilung bezeichnet das Wort elliptisch einen einzelnen Stammesanteil; „Anteil“ macht den im Hebräischen vorausgesetzten Sinn verständlich.
