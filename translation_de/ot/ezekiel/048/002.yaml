base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/002.yaml
  text: And along the border of Dan[a], from the eastern side to the western side, Asher, one portion.
translation:
  language: de
  text: 'Und entlang der Grenze Dans, von der Ostseite bis zur Westseite[a]: Ascher – ein Anteil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zur Seite des Meeres“. „Meer“ dient hier als Richtungsangabe für Westen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: An … entlang
  rationale: Die Verbindung leitet den nächsten Stammesanteil ein und bezeichnet seine Lage unmittelbar an Dans Grenze; die deutsche Wendung gibt den räumlichen Sinn natürlich wieder.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Im Zusammenhang der Landverteilung bezeichnet das Wort die Grenzlinie eines Stammesgebiets.
- source_word: דָּן
  choice: Dan
  rationale: Der überlieferte Name des Stammes wird in der geläufigen deutschen Form wiedergegeben.
- source_word: מִ/פְּאַת קָדִים
  choice: von der Ostseite
  rationale: פֵּאָה bezeichnet eine Seite oder einen Rand, קָדִים hier die Himmelsrichtung Osten.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: bis zur Westseite
  rationale: יָם, wörtlich „Meer“, dient hier als Richtungsangabe für Westen; „Westseite“ vermittelt die geografische Bedeutung unmittelbar.
- source_word: אָשֵׁר
  choice: Ascher
  rationale: Der Stammesname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Das Zahlwort steht in der wiederkehrenden Zuteilungsformel elliptisch; „Anteil“ ergänzt das im Kontext vorausgesetzte Bezugswort knapp und verständlich.
