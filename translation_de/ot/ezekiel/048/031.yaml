  text: וְ/שַׁעֲרֵ֣י הָ/עִ֗יר עַל שְׁמוֹת֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל שְׁעָרִ֥ים שְׁלוֹשָׁ֖ה צָפ֑וֹנָ/ה שַׁ֣עַר רְאוּבֵ֞ן אֶחָ֗ד שַׁ֤עַר יְהוּדָה֙ אֶחָ֔ד שַׁ֥עַר לֵוִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/031.yaml
  text: 'And the gates of the city shall be named after the tribes of Israel: three gates on the north side—one gate of Reuben[a], one gate of Judah, one gate of Levi.'
translation:
  language: de
  text: 'Und die Tore der Stadt sollen die Namen der Stämme Israels tragen: Auf der Nordseite sind drei Tore: je ein Tor mit dem Namen Ruben, Juda und Levi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁעֲרֵי הָעִיר
  choice: Und die Tore der Stadt
  rationale: Die Konjunktion וְ wird als „Und“ beibehalten; die Status-constructus-Verbindung wird natürlich und unmittelbar wiedergegeben.
- source_word: עַל שְׁמוֹת שִׁבְטֵי יִשְׂרָאֵל
  choice: sollen die Namen der Stämme Israels tragen
  rationale: עַל שְׁמוֹת bezeichnet hier die Zuordnung der Tore zu den Stammesnamen. „Die Namen … tragen“ ist im Deutschen idiomatisch und bleibt nahe an der hebräischen Ausdrucksweise.
- source_word: שְׁעָרִים שְׁלוֹשָׁה
  choice: drei Tore
  rationale: Die einfache Zahlphrase wird knapp und im Deutschen natürlich wiedergegeben.
- source_word: צָפוֹנָה
  choice: im Norden
  rationale: Die Form bezeichnet in der architektonischen Beschreibung die nördliche Seite beziehungsweise Lage; „im Norden“ ist klar und idiomatisch.
- source_word: שַׁעַר רְאוּבֵן אֶחָד
  choice: ein Tor für Ruben
  rationale: Die Verbindung bezeichnet das Ruben zugeordnete beziehungsweise nach Ruben benannte Tor. „Für Ruben“ vermeidet im Deutschen den möglichen Eindruck, das Tor gehöre einer Einzelperson.
- source_word: שַׁעַר יְהוּדָה אֶחָד
  choice: ein Tor für Juda
  rationale: Die parallele Konstruktion wird einheitlich als Zuordnung zum namensgebenden Stamm wiedergegeben.
- source_word: שַׁעַר לֵוִי אֶחָד
  choice: ein Tor für Levi
  rationale: Die parallele Konstruktion wird einheitlich wiedergegeben; „Levi“ bleibt als Stammesname erhalten und wird nicht zu „Leviten“ erweitert.
