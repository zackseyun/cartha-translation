id: EZK.48.28
reference: Ezekiel 48:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל גָּ֔ד אֶל פְּאַ֖ת נֶ֣גֶב תֵּימָ֑נָ/ה וְ/הָיָ֨ה גְב֜וּל מִ/תָּמָ֗ר מֵ֚י מְרִיבַ֣ת קָדֵ֔שׁ נַחֲלָ֖ה עַל הַ/יָּ֥ם הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/028.yaml
  text: And along the border of Gad[a], on the south side southward, the border shall run from Tamar to the waters of Meribath-kadesh, to the Wadi of Egypt[b], and on to the Great Sea.
translation:
  language: de
  text: Und an der Grenze Gads, an der Südseite, nach Süden hin, soll die Grenze von Tamar zum Wasser von Meribat-Kadesch[a], zum Wadi[b] und weiter bis zum Großen Meer verlaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Meriba-Kadesch“.'
    reason: lexical_alternative
  - marker: b
    text: Ein Wadi ist ein Wasserlauf oder Tal, das zeitweise trocken liegen kann. Im Hebräischen steht hier nicht „Wadi von Ägypten“.
    reason: textual_clarification
lexical_decisions:
- source_word: וְעַל גְּבוּל גָּד
  choice: Und an der Grenze Gads
  rationale: Die räumliche Bedeutung von עַל wird im Zusammenhang einer Grenzbeschreibung idiomatisch mit „an“ wiedergegeben; der Status constructus bezeichnet die Gad zugeordnete Grenze.
- source_word: אֶל פְּאַת נֶגֶב תֵּימָנָה
  choice: an der Südseite, nach Süden hin
  rationale: Die Häufung südlicher Richtungsangaben bleibt erkennbar, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: וְהָיָה גְבוּל
  choice: soll die Grenze … verlaufen
  rationale: In einer Grenzformel gibt „verlaufen“ die Funktion von היה mit גְבוּל natürlich und präzise wieder.
- source_word: מִתָּמָר
  choice: von Tamar
  rationale: Der Ortsname wird transliteriert.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: zum Wasser von Meribat-Kadesch
  rationale: Die singularische Wiedergabe „Wasser“ ist im Deutschen als Bezeichnung einer Wasserstelle natürlich; die Konstruktform des Ortsnamens wird als „Meribat-Kadesch“ bewahrt.
- source_word: נַחֲלָה
  choice: zum Wadi
  rationale: 'Die Form ist als נַחַל mit direktionalem ה zu verstehen: „zum Wadi“. Der hebräische Text nennt hier Ägypten nicht; daher wird „von Ägypten“ nicht ergänzt.'
- source_word: עַל הַיָּם הַגָּדוֹל
  choice: und weiter bis zum Großen Meer
  rationale: Die Formulierung bezeichnet die Fortsetzung der Grenzlinie bis zum Mittelmeer; „Großes Meer“ wahrt die biblische Benennung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Südrichtung des Hebräischen wird bewusst erhalten. Die Grenzformel wird idiomatisch formuliert, ohne den im Ausgangstext fehlenden Zusatz „von Ägypten“ einzufügen.
