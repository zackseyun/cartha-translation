  naturalness: „Abgabegebiet“ und „Grundbesitz der Stadt“ sind verständlich und im administrativ-geographischen Kontext angemessen. Die Umstellung zu „ein Quadrat von … bilden“ macht den deutschen Satz klar und weist „quadratisch“ syntaktisch richtig dem Gesamtgebiet zu.
