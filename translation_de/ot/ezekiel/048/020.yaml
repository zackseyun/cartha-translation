  text: כָּל הַ/תְּרוּמָ֗ה חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף בַּ/חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף רְבִיעִ֗ית תָּרִ֨ימוּ֙ אֶת תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ אֶל אֲחֻזַּ֖ת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/020.yaml
  text: The whole contribution shall be twenty-five thousand by twenty-five thousand[a]; you shall set apart the holy contribution as a quarter of the city's property.
translation:
  language: de
  text: Das gesamte Abgabegebiet soll ein Quadrat von 25.000 mal 25.000[a] bilden; das heilige Abgabegebiet sollt ihr zusammen mit dem Grundbesitz der Stadt aussondern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „25.000 Ellen mal 25.000 Ellen“; die Maßeinheit ist in diesem Vers nicht ausdrücklich genannt, lässt sich aber aus dem Zusammenhang ergänzen.'
    reason: lexical_alternative
  - marker: b
    text: Der knappe hebräische Wortlaut wird auch anders gegliedert und als „Das heilige Abgabegebiet sollt ihr als ein Viertel des Grundbesitzes der Stadt aussondern“ verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּרוּמָה / תְּרוּמַת
  choice: Abgabegebiet / Abgabegebiet
  rationale: Im Zusammenhang der Landverteilung bezeichnet das Wort ein aus dem Gesamtland ausgesondertes Gebiet, nicht ein Opfer am Altar. „Abgabegebiet“ gibt sowohl das Aussondern als auch den räumlichen Charakter verständlich wieder.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף
  choice: 25.000 mal 25.000
  rationale: Der hebräische Text nennt zwei Maße, ohne in diesem Vers eine Einheit anzugeben. „mal“ ist im Deutschen die natürliche Form für Abmessungen; die aus dem Kontext erschließbare Elle wird nur in der Fußnote genannt.
- source_word: רְבִיעִית
  choice: als Quadrat
  rationale: Im unmittelbaren Zusammenhang bilden die zuvor beschriebenen Streifen zusammen ein Gebiet von 25.000 mal 25.000; daher ist hier am ehesten ein vierseitiges beziehungsweise quadratisches Gebiet gemeint. Die formal mögliche Deutung als „Viertel“ bleibt in einer Fußnote erhalten.
- source_word: תָּרִימוּ
  choice: sondert ... aus
  rationale: Der Hifil von רום bezeichnet mit תְּרוּמָה hier das Abtrennen beziehungsweise Bestimmen eines besonderen Landanteils, nicht ein körperliches Hochheben.
- source_word: הַקֹּדֶשׁ
  choice: heilig
  rationale: Das Wort kennzeichnet den ausgesonderten Bereich als dem heiligen Zweck zugehörig; „heilig“ entspricht dem üblichen biblischen Sprachgebrauch.
- source_word: אֶל
  choice: zusammen mit
  rationale: Die Präposition beschreibt hier am plausibelsten die Zuordnung des heiligen Abgabegebiets zum städtischen Grundbesitz innerhalb des gesamten Quadrats. Eine rein lokale Wiedergabe mit „zu“ wäre im Deutschen missverständlich.
- source_word: אֲחֻזַּת הָעִיר
  choice: Grundbesitz der Stadt
  rationale: אֲחֻזָּה bezeichnet einen dauerhaften Besitz beziehungsweise Landbesitz. „Grundbesitz der Stadt“ ist in diesem geografisch-administrativen Zusammenhang präzise und natürlich.
theological_decisions:
- issue: Bezug und Bedeutung von רְבִיעִית sowie אֶל אֲחֻזַּת הָעִיר
  choice: Das heilige Abgabegebiet wird zusammen mit dem städtischen Grundbesitz als Quadrat ausgesondert.
  alternative: Das heilige Abgabegebiet wird als ein Viertel des Grundbesitzes der Stadt ausgesondert.
  rationale: Die Maße und die Gliederung in Hesekiel 48,15–20 sprechen stark dafür, dass das gesamte aus heiligem Gebiet und Stadtbesitz bestehende Abgabegebiet quadratisch ist. Da die Formen auch anders verstanden werden können und die Syntax knapp ist, wird die Viertel-Deutung nicht ausgeschlossen, sondern ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Abgabegebiet“ vermeidet den im Deutschen naheliegenden Gedanken an eine Geld- oder Sachspende und macht den Charakter als ausgesondertes Landstück deutlich. Zahlen werden zur guten Lesbarkeit in Ziffern gesetzt.
