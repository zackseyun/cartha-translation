base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/004.yaml
  text: And along the border of Naphtali[a], from the east side to the west side, Manasseh, one portion.
translation:
  language: de
  text: 'Und entlang der Grenze Naftalis, von der Ostseite bis zur Westseite: Manasse, ein Anteil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht wörtlich: „Manasse, einer.“ „Anteil“ ist ergänzt, weil das Kapitel diese verkürzte Formel wiederholt für die zugeteilten Gebietsstreifen verwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Und an
  rationale: Die Verbindung aus Konjunktion und Präposition führt den nächsten Gebietsstreifen ein. „An der Grenze“ gibt die räumliche Zuordnung im Deutschen natürlich wieder.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Das Wort bezeichnet hier die Grenzlinie eines Stammesgebiets; „Grenze“ ist im Deutschen präzise und geläufig.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Der Stammesname wird in der üblichen deutschen biblischen Schreibweise wiedergegeben.
- source_word: מִפְּאַת קָדִמָה עַד פְּאַת יָמָּה
  choice: von der Ostseite bis zur Westseite
  rationale: Die wiederkehrende Formel beschreibt die gesamte Ost-West-Ausdehnung. „Seite“ wahrt die Grundbedeutung von פֵּאָה und bleibt verständlich.
- source_word: מְנַשֶּׁה אֶחָד
  choice: liegt Manasses Anteil
  rationale: Der hebräische Nominalsatz lautet knapp „Manasse, eins/einer“. „Liegt“ und „Anteil“ werden ergänzt, um die im Kapitel wiederkehrende Zuteilungsformel in natürlichem Deutsch auszudrücken; die Fußnote legt die Ellipse offen.
