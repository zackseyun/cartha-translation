  text: וְ/לֹא יִמְכְּר֣וּ מִמֶּ֗/נּוּ וְ/לֹ֥א יָמֵ֛ר וְ/לֹ֥א יעבור רֵאשִׁ֣ית הָ/אָ֑רֶץ כִּי קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/014.yaml
  text: They must not sell any of it[a], nor exchange it, nor shall this choice portion of the land pass over to another, for it is holy to Yahweh.
translation:
  language: de
  text: Sie dürfen nichts davon verkaufen oder eintauschen; auch darf dieser erlesene Anteil des Landes[a] nicht in andere Hände übergehen, denn er ist Jahwe heilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser erste Anteil des Landes“ beziehungsweise „die Erstlingsgabe des Landes“. Der hebräische Ausdruck kann entweder den ersten oder vornehmsten Landanteil oder dessen erstlingsartige Weihe hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְכְּרוּ
  choice: verkaufen
  rationale: מכר bezeichnet hier im rechtlichen Zusammenhang den Verkauf von Land; „verkaufen“ gibt den Sinn unmittelbar und natürlich wieder.
- source_word: מִמֶּנּוּ
  choice: nichts davon
  rationale: Die Präposition mit Suffix verweist auf den zuvor beschriebenen heiligen Landanteil. Nach „verkaufen“ ist „nichts davon“ im Deutschen die natürliche Wiedergabe.
- source_word: יָמֵר
  choice: eintauschen
  rationale: מור bedeutet „tauschen“ oder „ersetzen“. „Eintauschen“ bezeichnet hier verständlich den verbotenen Tausch dieses Landanteils gegen einen anderen.
- source_word: יעבור
  choice: in andere Hände übergehen
  rationale: עבר bedeutet wörtlich „hinübergehen“. Im Zusammenhang mit Grundeigentum beschreibt es idiomatisch einen Eigentumsübergang; die deutsche Wendung bewahrt sowohl das Bild als auch den rechtlichen Sinn.
- source_word: רֵאשִׁית הָאָרֶץ
  choice: dieser erlesene Anteil des Landes
  rationale: רֵאשִׁית kann den ersten, vornehmsten oder erstlingsartigen Anteil bezeichnen. Im Kontext der ausgesonderten Landzuteilung vermittelt „erlesener Anteil“ den besonderen Rang, ohne die Wendung eindeutig auf Ernteerstlinge festzulegen.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Das Prädikat bezeichnet den ausgesonderten, Gott geweihten Status des Landanteils. „Heilig“ ist die sachlich und theologisch angemessene Standardwiedergabe.
- source_word: לַיהוָה
  choice: Jahwe heilig
  rationale: ל kennzeichnet hier Zugehörigkeit beziehungsweise Weihe. Die deutsche prädikative Formulierung „Jahwe heilig“ gibt „heilig für/zu Jahwe gehörig“ knapp und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den offenbarten Bundesnamen als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רֵאשִׁית הָאָרֶץ
  choice: dieser erlesene Anteil des Landes
  alternative: die Erstlingsgabe des Landes / der erste Anteil des Landes
  rationale: Die Wendung kann den ersten, besten oder wie eine Erstlingsgabe geweihten Teil meinen. Der Haupttext wahrt den Bezug auf die besondere Landzuteilung; die Fußnote erhält die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Wendung „in andere Hände übergehen“ macht den Eigentumsübergang verständlich, während „erlesener Anteil“ mit Fußnote die Mehrdeutigkeit von רֵאשִׁית bewahrt.
