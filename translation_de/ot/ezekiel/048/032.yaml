  text: וְ/אֶל פְּאַ֣ת קָדִ֗ימָ/ה חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים וּ/שְׁעָרִ֖ים שְׁלֹשָׁ֑ה וְ/שַׁ֨עַר יוֹסֵ֜ף אֶחָ֗ד שַׁ֤עַר בִּנְיָמִן֙ אֶחָ֔ד שַׁ֥עַר דָּ֖ן אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/032.yaml
  text: 'And on the east side[a], four thousand five hundred cubits, with three gates: the gate of Joseph, one; the gate of Benjamin, one; the gate of Dan, one.'
translation:
  language: de
  text: 'An der Ostseite[a] waren es viertausendfünfhundert Ellen und drei Tore: das Tor Josefs eins, das Tor Benjamins eins, das Tor Dans eins.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht nur „viertausendfünfhundert“; „Ellen“ ist aus dem Zusammenhang der Stadtmaße in diesem Kapitel ergänzt.
    reason: cross_reference
lexical_decisions:
- source_word: פְּאַת קָדִימָה
  choice: an der Ostseite
  rationale: פְּאַת bezeichnet hier die Seite beziehungsweise Begrenzung, קָדִימָה die östliche Richtung; „an der Ostseite“ entspricht der wiederkehrenden Beschreibung der Stadtseiten.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: viertausendfünfhundert Ellen
  rationale: Die hebräische Zahlenfolge bedeutet idiomatisch 4.500. Die Maßeinheit „Ellen“ ist im Satz nicht ausdrücklich genannt, wird aber aus den Stadtmaßen im unmittelbaren Kontext ergänzt und deshalb durch eine Fußnote kenntlich gemacht.
- source_word: וּשְׁעָרִים שְׁלֹשָׁה
  choice: und drei Tore
  rationale: Die koordinierende Wiedergabe bewahrt die knappe, verblose Beschreibung des Hebräischen und klingt im Deutschen natürlich.
- source_word: שַׁעַר
  choice: Tor
  rationale: Übliche deutsche Entsprechung für die nach den Stämmen benannten Stadttore.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Eingebürgerte moderne deutsche Namensform.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Eingebürgerte moderne deutsche Namensform.
- source_word: דָּן
  choice: Dan
  rationale: Eingebürgerte moderne deutsche Namensform.
- source_word: אֶחָד ... אֶחָד ... אֶחָד
  choice: eines ... eines ... eines
  rationale: Die dreifache Wiederholung wird beibehalten, um die ausdrückliche Zuordnung jeweils eines Tores zu jedem Namen abzubilden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe aufzählende Struktur des Hebräischen bleibt erhalten; die elliptische Zahlenangabe wird für verständliches Deutsch mit „waren es“ gefasst.
