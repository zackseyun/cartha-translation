  text: וְ/הַ/נּוֹתָ֣ר לַ/נָּשִׂ֣יא מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לִ/תְרֽוּמַת הַ/קֹּ֣דֶשׁ וְ/לַ/אֲחֻזַּ֪ת הָ/עִ֟יר אֶל פְּנֵ֣י חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֥לֶף תְּרוּמָה֮ עַד גְּב֣וּל קָדִימָ/ה֒ וְ/יָ֗מָּ/ה עַל פְּ֠נֵי חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ עַל גְּב֣וּל יָ֔מָּ/ה לְ/עֻמַּ֥ת חֲלָקִ֖ים לַ/נָּשִׂ֑יא וְ/הָֽיְתָה֙ תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ וּ/מִקְדַּ֥שׁ הַ/בַּ֖יִת ב/תוכ/ה׀׀־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/021.yaml
  text: And what remains shall belong to the prince[a], on both sides of the holy contribution and of the city's property, alongside the twenty-five thousand of the contribution as far as the eastern border, and westward alongside the twenty-five thousand toward the western border, parallel to the portions for the prince. And the holy contribution and the sanctuary of the temple shall be in its midst.
translation:
  language: de
  text: 'Was übrig bleibt, ist für den Fürsten bestimmt: auf beiden Seiten der heiligen Abgabe und des Grundbesitzes der Stadt, entlang der fünfundzwanzigtausend[a] der heiligen Abgabe bis zur Ostgrenze und westwärts entlang der fünfundzwanzigtausend bis zur Westgrenze, entsprechend den Anteilen. Die heilige Abgabe und das Heiligtum des Hauses sollen in seiner Mitte liegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht nur »fünfundzwanzigtausend«; die Maßeinheit ergibt sich aus dem Zusammenhang der Landvermessung in Hesekiels Vision.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַנּוֹתָר לַנָּשִׂיא
  choice: Was übrig bleibt, soll dem Fürsten gehören
  rationale: Das substantivierte Partizip bezeichnet das nach den übrigen Zuteilungen verbleibende Land. »Fürst« entspricht dem regelmäßigen Gebrauch von נָשִׂיא in Hesekiels Tempelvision; »soll … gehören« gibt die knappe hebräische Zuordnung idiomatisch wieder.
- source_word: מִזֶּה וּמִזֶּה
  choice: auf beiden Seiten
  rationale: Die Wendung bezeichnet die Flächen diesseits und jenseits des heiligen Bezirks samt Stadtbesitz.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: des heiligen Hebopfers
  rationale: תְּרוּמָה bezeichnet grundsätzlich eine abgehobene beziehungsweise dargebrachte Gabe und hier das als Gabe ausgesonderte Land. »Hebopfer« bewahrt diese kultische Bildsprache, obwohl eine Landfläche gemeint ist.
- source_word: וְלַאֲחֻזַּת הָעִיר
  choice: und des Grundbesitzes der Stadt
  rationale: אֲחֻזָּה ist ein fest zugeteilter Besitz beziehungsweise Landbesitz; »Grundbesitz« verdeutlicht hier den räumlichen Bezug.
- source_word: אֶל־פְּנֵי חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף תְּרוּמָה
  choice: entlang den fünfundzwanzigtausend des Hebopfers
  rationale: אֶל־פְּנֵי beschreibt hier die räumliche Lage an der Längsseite des ausgesonderten Landstücks. Die Maßeinheit wird im Vers selbst nicht genannt und daher nicht in den Haupttext ergänzt.
- source_word: עַד גְּבוּל קָדִימָה
  choice: bis zur Ostgrenze
  rationale: Die Formulierung gibt die östliche Ausdehnung der für den Fürsten bestimmten Fläche an.
- source_word: וְיָמָּה
  choice: und westwärts
  rationale: Der Richtungsakkusativ bezeichnet die entsprechende Ausdehnung nach Westen.
- source_word: לְעֻמַּת חֲלָקִים
  choice: parallel zu den Stammesanteilen
  rationale: לְעֻמַּת bezeichnet räumliche Entsprechung beziehungsweise Ausrichtung. »Stammesanteile« macht den im Kontext klaren Bezug der unbestimmt genannten חֲלָקִים verständlich.
- source_word: וּמִקְדַּשׁ הַבַּיִת
  choice: und das Heiligtum des Hauses
  rationale: Die formale Wiedergabe bewahrt den Bezug auf das Tempelhaus, ohne den Ausdruck auf eine bestimmte konfessionelle Deutung festzulegen.
- source_word: בְתוֹכָהּ
  choice: in seiner Mitte
  rationale: Das feminine Suffix verweist grammatisch am ehesten auf das heilige Hebopfer beziehungsweise das ausgesonderte Gebiet; die deutsche Formulierung lässt den räumlichen Bezug bestehen.
