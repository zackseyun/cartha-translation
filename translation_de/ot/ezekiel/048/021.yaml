revisions:
- from: 'Was übrig bleibt, soll dem Fürsten gehören: auf beiden Seiten des heiligen Hebopfers und des Grundbesitzes der Stadt, entlang den fünfundzwanzigtausend[a] des Hebopfers bis zur Ostgrenze und westwärts entlang den fünfundzwanzigtausend bis zur Westgrenze, parallel zu den Stammesanteilen – das soll dem Fürsten gehören. Das heilige Hebopfer und das Heiligtum des Hauses sollen in seiner Mitte liegen.'
  to: 'Was übrig bleibt, ist für den Fürsten bestimmt: auf beiden Seiten der heiligen Abgabe und des Grundbesitzes der Stadt, entlang der fünfundzwanzigtausend[a] der heiligen Abgabe bis zur Ostgrenze und westwärts entlang der fünfundzwanzigtausend bis zur Westgrenze, entsprechend den Anteilen. Die heilige Abgabe und das Heiligtum des Hauses sollen in seiner Mitte liegen.'
  rationale: Die Revision korrigiert die Kasusrektion, ersetzt die missverständliche kultische Traditionsbezeichnung durch die klare, quellengerechte Bezeichnung „heilige Abgabe“, vermeidet die nicht im Wortlaut ausgedrückte Einschränkung auf Stammesanteile und glättet die Satzführung, ohne die komplexe räumliche Zuordnung oder die implizite Maßeinheit aufzulösen.
  reviewer_model: gpt-5.6-terra
