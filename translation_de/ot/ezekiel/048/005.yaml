  text: וְ/עַ֣ל גְּב֣וּל מְנַשֶּׁ֗ה מִ/פְּאַ֥ת קָדִ֛מָ/ה עַד פְּאַת יָ֖מָּ/ה אֶפְרַ֥יִם אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/005.yaml
  text: And along the border of Manasseh[a], from the east side to the west side, Ephraim, one portion.
translation:
  language: de
  text: 'Und entlang der Grenze Manasses, von der Ostseite bis zur Westseite: Ephraim – ein Anteil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »Ephraim – einer«; im Zusammenhang ist ein Landanteil gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Und entlang
  rationale: Die Verbindung aus Konjunktion und Präposition führt die nächste Stammeszuteilung in der Reihe ein und bezeichnet ihre Lage an der Grenze des zuvor genannten Gebiets.
- source_word: גְּבוּל מְנַשֶּׁה
  choice: der Grenze Manasses
  rationale: גְּבוּל bezeichnet hier die Grenzlinie des Stammesgebiets; der deutsche Genitiv des Namens ist natürlich und eindeutig.
- source_word: מִפְּאַת קָדִמָה עַד פְּאַת יָמָּה
  choice: von der Ostseite bis zur Westseite
  rationale: פֵּאָה meint Seite, Rand oder äußerstes Ende. יָמָּה hat in dieser geografischen Orientierung die Bedeutung »nach Westen« beziehungsweise »Westseite«.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Übliche deutsche Form des Stammesnamens.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Im Hebräischen steht nur »einer/eins«; die wiederkehrende Zuteilungsformel in Hesekiel 48 setzt sinngemäß einen Landanteil voraus. »Ein Anteil« macht die Ellipse verständlich, während die Fußnote den knappen Wortlaut ausweist.
