  to: 'An der Südseite waren es nach dem Maß 4.500 Ellen[a] und drei Tore: je ein Tor Simeons, Issachars und Sebulons.'
  rationale: Die Revision ersetzt die im Deutschen unnatürliche Nachstellung „eines“ durch „je ein“, ohne die dreifache Zuordnung der Tore zu den Stämmen zu verändern. Der Fußnotenanker wird an die tatsächlich ergänzte Maßeinheit gesetzt. Die formelhafte Vermessungssprache und die im Ausgangstext nur implizite Kopula bleiben gewahrt.
