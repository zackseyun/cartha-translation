base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/033.yaml
  text: 'On the south side[a], 4,500 cubits by measure, with three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.'
translation:
  language: de
  text: 'An der Südseite waren es nach dem Maß 4.500 Ellen[a] und drei Tore: je ein Tor Simeons, Issachars und Sebulons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht lediglich „4.500 nach dem Maß“. Die Maßeinheit „Ellen“ ist aus dem unmittelbaren Zusammenhang der Stadtmaße in diesem Abschnitt ergänzt.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/פְאַת נֶגְבָּה
  choice: An der Südseite
  rationale: פֵּאָה bezeichnet hier die Seite bzw. Begrenzung der Stadt, נֶגֶב die südliche Richtung. Die einleitende Konjunktion wird im deutschen Satzfluss nicht eigens wiedergegeben.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים מִדָּה
  choice: waren es nach dem Maß 4.500 Ellen
  rationale: Die Zahl lautet 4.500. מִדָּה wird mit „nach dem Maß“ sichtbar gehalten; „Ellen“ wird aus dem unmittelbaren Zusammenhang der Stadtmaße ergänzt und in einer Fußnote ausgewiesen.
- source_word: וּ/שְׁעָרִים שְׁלֹשָׁה
  choice: und drei Tore
  rationale: Die knappe koordinierte Form entspricht der hebräischen Aufzählung und ist im Deutschen natürlich.
- source_word: שַׁעַר שִׁמְעוֹן אֶחָד
  choice: das Tor Simeons, eines
  rationale: Die formelhafte Folge „Tor + Stammesname + eines“ bleibt erhalten und bewahrt den bewusst repetitiven Aufbau.
- source_word: שַׁעַר יִשָּׂשכָר אֶחָד
  choice: das Tor Issachars, eines
  rationale: Die parallele Listenform des Hebräischen wird konsequent beibehalten.
- source_word: שַׁעַר זְבוּלֻן אֶחָד
  choice: das Tor Sebulons, eines
  rationale: Die parallele Listenform wird bewahrt; „Sebulon“ entspricht der im modernen deutschen Bibelgebrauch geläufigen Namensform.
