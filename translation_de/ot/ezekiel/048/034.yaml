source:
  edition: WLC
  text: פְּאַת יָ֗מָּ/ה חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים שַֽׁעֲרֵי/הֶ֖ם שְׁלֹשָׁ֑ה שַׁ֣עַר גָּ֞ד אֶחָ֗ד שַׁ֤עַר אָשֵׁר֙ אֶחָ֔ד שַׁ֥עַר נַפְתָּלִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/034.yaml
  text: 'On the west side[a], four thousand five hundred, with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali[b], one.'
translation:
  language: de
  text: 'An der Westseite: viertausendfünfhundert[a]. Ihre Tore: drei[b] – ein Tor für Gad, ein Tor für Ascher und ein Tor für Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »fünfhundert und viertausend«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit ihren drei Toren«. Im Hebräischen steht hier eine verblose Aufzählungsformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת יָמָּה
  choice: An der Westseite
  rationale: 'פְּאַת bezeichnet die Seite oder Begrenzung; יָמָּה ist hier die Richtungsangabe »westwärts« (wörtlich: »meerwärts«). Im Zusammenhang der vier Stadtseiten ist »An der Westseite« natürlich und präzise.'
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: viertausendfünfhundert
  rationale: Die hebräische Reihenfolge lautet wörtlich »fünfhundert und viertausend«, bezeichnet aber eindeutig die Zahl 4.500. Im Deutschen steht die größere Einheit zuerst.
- source_word: שַׁעֲרֵיהֶם שְׁלֹשָׁה
  choice: 'Ihre Tore: drei'
  rationale: Die verblosen, aufzählenden Worte werden bewusst knapp wiedergegeben. Das Possessivsuffix bleibt durch »ihre« erhalten; der Doppelpunkt verdeutlicht die folgende Aufzählung, ohne ein im Hebräischen fehlendes Verb einzufügen.
- source_word: שַׁעַר גָּד אֶחָד
  choice: ein Tor für Gad
  rationale: Die hebräische Aufzählungsformel lautet »Tor Gad eins«. »Ein Tor für Gad« gibt die Zuordnung zum Stamm in natürlichem Deutsch wieder und bewahrt die Einzelzählung.
- source_word: שַׁעַר אָשֵׁר אֶחָד
  choice: ein Tor für Ascher
  rationale: Die Formulierung entspricht derselben hebräischen Aufzählungsformel und hält die drei Stammeszuordnungen sprachlich parallel.
- source_word: שַׁעַר נַפְתָּלִי אֶחָד
  choice: ein Tor für Naftali
  rationale: Die Formulierung gibt die Stammeszuordnung und das dreimal wiederholte אֶחָד (»eins/ein«) in natürlichem, parallelem Deutsch wieder.
theological_decisions: []
