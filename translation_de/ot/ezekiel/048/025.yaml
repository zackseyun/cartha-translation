source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל שִׁמְע֗וֹן מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה יִשָׂשכָ֥ר אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
translation:
  language: de
  text: 'An der Grenze Simeons entlang, von der Ostseite bis zur Westseite[a]: Issachar, ein Anteil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Seite des Meeres“. „Meer“ bezeichnet in dieser geografischen Formel den Westen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: An … entlang
  rationale: Die Verbindung leitet den nächsten, an den vorigen angrenzenden Landstreifen ein. Die deutsche Wendung gibt den Grenzverlauf natürlich wieder.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Das Substantiv bezeichnet hier die Grenzlinie des Stammesgebiets, nicht das gesamte Gebiet.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Der Stammesname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: von der Ostseite
  rationale: פְּאַת bezeichnet eine Seite oder einen Rand; קָדִימָה bezeichnet in dieser geografischen Formel den Osten.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: bis zur Westseite
  rationale: יָם bedeutet wörtlich „Meer“, dient geografisch aber regelmäßig als Bezeichnung für den Westen. Zusammen mit פְּאַת ist „Westseite“ die natürliche Richtungsangabe.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Der Stammesname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: אֶחָד
  choice: einen Anteil erhalten
  rationale: Das Hebräische sagt elliptisch nur „einer/eins“. Im wiederholten Zuteilungsschema des Kapitels ist ein Landanteil gemeint; „erhalten“ macht die deutsche Satzkonstruktion verständlich, ohne den sachlichen Gehalt zu verändern.
theological_decisions: []
