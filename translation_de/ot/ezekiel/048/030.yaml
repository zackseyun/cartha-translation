  text: וְ/אֵ֖לֶּה תּוֹצְאֹ֣ת הָ/עִ֑יר מִ/פְּאַ֣ת צָפ֔וֹן חֲמֵ֥שׁ מֵא֛וֹת וְ/אַרְבַּ֥עַת אֲלָפִ֖ים מִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/030.yaml
  text: 'And these are the exits of the city: on the north side[b][a], four thousand five hundred measures.'
translation:
  language: de
  text: 'Und dies sind die Ausgänge der Stadt: Von der Nordseite aus misst sie viertausendfünfhundert Maß.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Nordrand aus“. Das hebräische Wort kann „Seite“, „Rand“ oder „Ecke“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen „fünfhundert und viertausend“. Eine bestimmte Maßeinheit wird in diesem Vers nicht genannt.
    reason: source_clarification
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Bewahrt den anschließenden Charakter und den formalen Beginn der Aufzählung.
- source_word: תּוֹצְאֹת הָעִיר
  choice: die Ausgänge der Stadt
  rationale: תּוֹצְאֹת bezeichnet wörtlich Ausgänge beziehungsweise das Hinausgehende; „Ausgänge“ passt zum folgenden Zusammenhang mit den Toren, ohne das Wort vorzeitig als „Tore“ festzulegen.
- source_word: מִפְּאַת צָפוֹן
  choice: An der Nordseite
  rationale: פֵּאָה bezeichnet hier im Vermessungszusammenhang die Seite beziehungsweise den Rand; die deutsche Formulierung ist natürlich und präzise.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: viertausendfünfhundert
  rationale: Gibt die hebräische Zahlenfolge „fünfhundert und viertausend“ in der im Deutschen üblichen Reihenfolge wieder.
- source_word: מִדָּה
  choice: Maß
  rationale: Das Wort kennzeichnet eine Messgröße, nennt hier aber keine konkrete Maßeinheit; „Maß“ wahrt diese Unbestimmtheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der formalen Struktur einer Grenz- und Maßangabe. Die etwas ungewöhnliche Wendung „Ausgänge der Stadt“ erhält die lexikalische Offenheit des Hebräischen; die ungenannte Maßeinheit wird nicht als „Ellen“ ergänzt.
