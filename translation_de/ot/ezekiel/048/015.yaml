source:
  edition: WLC
  text: וַ/חֲמֵ֨שֶׁת אֲלָפִ֜ים הַ/נּוֹתָ֣ר בָּ/רֹ֗חַב עַל פְּנֵ֨י חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף חֹֽל ה֣וּא לָ/עִ֔יר לְ/מוֹשָׁ֖ב וּ/לְ/מִגְרָ֑שׁ וְ/הָיְתָ֥ה הָ/עִ֖יר ב/תוכ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/015.yaml
  text: And the remaining five thousand in width[a], along the face of the twenty-five thousand, shall be common land for the city, for dwelling, and for open land[c][b]; and the city shall be in its midst.
translation:
  language: de
  text: Die verbleibenden fünftausend in der Breite, längs der fünfundzwanzigtausend[a], sind gewöhnliches Land[b] für die Stadt, als Wohngebiet und als Freifläche[c]. Die Stadt soll mitten darin liegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »an der Seite der fünfundzwanzigtausend«. Die hebräische Wendung lautet wörtlich »vor der Fläche der« und kann räumlich auf mehrere eng verwandte Weisen wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Land, das im Unterschied zu den umliegenden geweihten Zuteilungen nicht heilig ist.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort bezeichnet freie Flächen um eine Stadt, die unter anderem als Weideland dienen konnten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: die übrigen
  rationale: Das Partizip bezeichnet den nach den vorangehenden Zuteilungen verbleibenden Teil; „die übrigen“ ist knapp und wahrt den vermessungstechnischen Zusammenhang.
- source_word: בָּרֹחַב
  choice: in der Breite
  rationale: רֹחַב bezeichnet hier die Breite des vermessenen Landstreifens.
- source_word: עַל־פְּנֵי
  choice: längs
  rationale: Die räumliche Wendung bedeutet wörtlich „vor/entlang der Fläche von“ und beschreibt hier wahrscheinlich die Erstreckung an der Seite des 25.000 langen Gebiets; „längs“ bleibt geometrisch zurückhaltend.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: der fünfundzwanzigtausend
  rationale: Die Maßangabe verweist auf die zuvor genannte Länge. Da der hebräische Satz die Einheit nicht wiederholt, wird sie auch im Haupttext nicht ergänzt.
- source_word: חֹל
  choice: nicht geheiligtes Land
  rationale: חֹל steht im Gegensatz zum heiligen bzw. geweihten Gebiet. „Nicht geheiligtes Land“ macht diesen kultischen Gegensatz deutlich, ohne die abwertenden Nebenbedeutungen von „profan“ einzutragen.
- source_word: לָעִיר
  choice: für die Stadt
  rationale: Die Präposition ל kennzeichnet Zweck oder Zuweisung; die schlichte Wiedergabe lässt die genaue verwaltungstechnische Beziehung offen.
- source_word: לְמוֹשָׁב
  choice: als Wohngebiet
  rationale: מוֹשָׁב bezeichnet Wohnen, Wohnsitz oder Siedlung. Im Zusammenhang städtischer Flächennutzung ist „Wohngebiet“ natürlich und konkret.
- source_word: וּלְמִגְרָשׁ
  choice: und als Weideland
  rationale: מִגְרָשׁ bezeichnet freie Flächen um eine Siedlung, häufig als Weideland genutzt. Die Fußnote hält die breitere Bedeutung „Freifläche“ offen.
- source_word: בְּתוֹכָהּ
  choice: mitten darin
  rationale: תּוֹךְ bezeichnet das Innere oder die Mitte; „mitten darin“ bewahrt die räumliche Aussage und bezieht das feminine Suffix natürlich auf die zugewiesene Fläche.
theological_decisions:
- issue: Kultischer Gegensatz zwischen heiligem und gewöhnlichem Land
  choice: nicht geheiligtes Land
  alternative: gewöhnliches Land; profanes Land
  rationale: Die Formulierung wahrt den sachlichen Gegensatz zur geheiligten Zuteilung, ohne das Land als unrein oder minderwertig zu bezeichnen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Vermessungs- und Zuteilungsterminologie. Die etwas ungewöhnliche substantivierte Maßangabe „der fünfundzwanzigtausend“ folgt bewusst dem Hebräischen, das die Maßeinheit hier nicht wiederholt. Die Fußnoten bewahren die räumliche Mehrdeutigkeit von עַל־פְּנֵי und den Bedeutungsumfang von מִגְרָשׁ.
