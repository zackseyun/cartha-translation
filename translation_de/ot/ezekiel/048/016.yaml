base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/016.yaml
  text: 'And these are its measurements: the north side[a], four thousand five hundred; and the south side, four thousand five hundred; and from the east side, four thousand five hundred; and the west side, four thousand five hundred.'
translation:
  language: de
  text: 'Und dies sind ihre Maße: die Nordseite: viertausendfünfhundert[a]; die Südseite: viertausendfünfhundert; und von der Ostseite: viertausendfünfhundert; und die Westseite: viertausendfünfhundert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen bei jeder Seite: „fünfhundert und viertausend“. Die Reihenfolge wurde der üblichen deutschen Zahlenschreibung angepasst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹתֶיהָ
  choice: ihre Maße
  rationale: Das Wort bezeichnet hier die vermessenen Ausmaße der Stadt; „Maße“ ist im Deutschen klar und kontextgerecht.
- source_word: פְּאַת
  choice: Seite
  rationale: Im Zusammenhang mit dem Grundriss der Stadt bezeichnet פאה jeweils eine ihrer vier Seiten.
- source_word: צָפוֹן
  choice: Nordseite
  rationale: Die Himmelsrichtung wird zusammen mit פאה idiomatisch als „Nordseite“ wiedergegeben.
- source_word: נֶגֶב
  choice: Südseite
  rationale: Hier ist נגב eine Himmelsrichtung und nicht der Eigenname der Landschaft Negev.
- source_word: מִפְּאַת קָדִים
  choice: von der Ostseite
  rationale: Die Wiedergabe bewahrt die nur bei der Ostseite ausdrücklich vorhandene Präposition מִן, ohne sie stillschweigend anzugleichen.
- source_word: יָמָּה
  choice: Westseite
  rationale: Das auf „Meer“ bezogene Richtungswort bezeichnet in diesem Zusammenhang den Westen.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: viertausendfünfhundert
  rationale: Die Zahl wird in der im modernen Deutschen üblichen Reihenfolge ausgedrückt; derselbe Wert gilt für jede Seite.
