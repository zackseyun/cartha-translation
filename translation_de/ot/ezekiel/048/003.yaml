  text: וְ/עַ֣ל גְּב֣וּל אָשֵׁ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה וְ/עַד פְּאַת יָ֖מָּ/ה נַפְתָּלִ֥י אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/003.yaml
  text: And alongside the border of Asher[a], from the eastern side to the western side, Naphtali, one portion.
translation:
  language: de
  text: 'Und an der Grenze Aschers entlang, von der Ostseite bis zur Westseite: Naftali – ein Anteil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Naftali, einer«. Das Wort »Anteil« ist aus dem Zusammenhang der Landzuteilung ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל גְּבוּל אָשֵׁר
  choice: Und neben dem Gebiet von Ascher
  rationale: עַל bezeichnet in der wiederkehrenden Zuteilungsformel die räumliche Nachbarschaft. גְּבוּל kann Grenze oder Gebiet bezeichnen; hier ist das an Aschers Land anschließende Gebiet gemeint, sodass natürliches Deutsch mit »neben dem Gebiet von Ascher« die Lage klar wiedergibt.
- source_word: מִ/פְּאַת קָדִימָה
  choice: von der Ostseite
  rationale: פֵּאָה bezeichnet Seite oder Rand, קָדִימָה die östliche Richtung. »Ostseite« bewahrt die räumliche Grenzangabe knapp und verständlich.
- source_word: וְ/עַד פְּאַת יָמָּה
  choice: bis zur Westseite
  rationale: עַד bezeichnet die Ausdehnung bis zu einem Endpunkt; יָמָּה bedeutet hier idiomatisch westwärts beziehungsweise Westen. Die Konstruktion beschreibt die ganze Ost-West-Ausdehnung.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Geläufige deutsche Schreibung des Stammesnamens.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Wörtlich steht nur »einer/eins«. Im Zusammenhang der Landzuteilungen ist ein einzelner Gebietsanteil gemeint; »Anteil« wird zur Klarheit ergänzt und in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe, listenartige Charakter der Stammeszuteilungen bleibt durch den Doppelpunkt und die elliptische Schlussform erhalten.
