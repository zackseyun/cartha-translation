revisions:
- from: 'Dies sind die Namen der Stämme: Im äußersten Norden verläuft die Grenze entlang der Straße nach Hetlon bis Lebo-Hamat[a], über Hazar-Enan an der Nordgrenze von Damaskus entlang, neben Hamat; und von der Ostseite bis zum Meer: Dan, ein Anteil.[b]'
