  naturalness: Die vorliegende Satzfolge ist besonders bei „über Hazar-Enan an der Nordgrenze von Damaskus entlang, neben Hamat“ schwer verständlich. Die Revision erhält den listenartigen Grenzstil, gliedert ihn aber idiomatischer und klarer.
