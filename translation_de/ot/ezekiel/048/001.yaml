  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הַ/שְּׁבָטִ֑ים מִ/קְצֵ֣ה צָפ֡וֹנָ/ה אֶל יַ֣ד דֶּֽרֶךְ חֶתְלֹ֣ן לְֽבוֹא חֲמָ֡ת חֲצַ֣ר עֵינָן֩ גְּב֨וּל דַּמֶּ֤שֶׂק צָפ֨וֹנָ/ה֙ אֶל יַ֣ד חֲמָ֔ת וְ/הָיוּ ל֧/וֹ פְאַת קָדִ֛ים הַ/יָּ֖ם דָּ֥ן אֶחָֽד־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/001.yaml
  text: 'These are the names of the tribes: from the northern extremity[a], beside the way of Hethlon to Lebo-hamath, Hazar-enan, at the border of Damascus northward beside Hamath, and extending from the east side to the sea, Dan[b], one portion.'
translation:
  language: de
  text: 'Dies sind die Namen der Stämme: Vom äußersten Norden her, an der Seite des Weges nach Hetlon, bis Lebo-Hamat[a], Hazar-Enan, an der Grenze von Damaskus im Norden, neben Hamat, soll Dan von der Ostseite bis zum Meer einen Anteil haben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Lebo-Hamat“ wird traditionell als Ortsname verstanden; wörtlich bedeutet der Ausdruck „Eingang von Hamat“ oder „Zugang zu Hamat“.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Satz ist hier stark verkürzt. Möglich ist auch: „Und ihm soll die Seite vom Osten bis zum Meer gehören.“ Gemeint ist offenbar die Ost-West-Ausdehnung des Stammesgebiets von Dan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת הַשְּׁבָטִים
  choice: Dies sind die Namen der Stämme
  rationale: Gibt die Listenformel klar und ohne einen im Hebräischen nicht ausdrücklich vorhandenen zeitlichen Diskursmarker wieder.
- source_word: מִקְצֵה צָפוֹנָה
  choice: Im äußersten Norden
  rationale: קָצֶה bezeichnet das Ende beziehungsweise den äußersten Rand; die deutsche Wendung passt natürlich zu einer Grenzbeschreibung.
- source_word: אֶל יַד דֶּרֶךְ חֶתְלֹן
  choice: entlang der Straße nach Hetlon
  rationale: אֶל יַד bezeichnet hier räumliche Nähe; in einer Grenzbeschreibung drückt „entlang“ den Verlauf idiomatisch aus. דֶּרֶךְ ist die Straße beziehungsweise der Weg.
- source_word: לְבוֹא חֲמָת
  choice: bis Lebo-Hamat
  rationale: Die Wortgruppe wird entsprechend ihrem sonstigen geografischen Gebrauch als Ortsname behandelt; die Präposition wird im Grenzverlauf mit „bis“ wiedergegeben.
- source_word: חֲצַר עֵינָן
  choice: Hazar-Enan
  rationale: Der Ortsname wird in einer im Deutschen gut erkennbaren Transliteration wiedergegeben.
- source_word: גְּבוּל דַּמֶּשֶׂק צָפוֹנָה
  choice: an der Nordgrenze von Damaskus
  rationale: Die syntaktisch gedrängte Richtungsangabe wird als nördliche Grenze in Bezug auf Damaskus verständlich wiedergegeben.
- source_word: אֶל יַד חֲמָת
  choice: neben Hamat
  rationale: Bewahrt die Angabe räumlicher Nachbarschaft, ohne die genaue Grenzrelation stärker festzulegen als der hebräische Text.
- source_word: וְהָיוּ לוֹ פְאַת קָדִים הַיָּם
  choice: und von der Ostseite bis zum Meer
  rationale: Die komprimierte Klausel beschreibt offenbar die Ost-West-Ausdehnung des Anteils. Die Wiedergabe macht den Verlauf verständlich, ohne „Meer“ ausdrücklich als Mittelmeer zu bestimmen.
- source_word: דָּן אֶחָד
  choice: Dan, ein Anteil
  rationale: אֶחָד steht elliptisch nach dem Stammesnamen und bezeichnet im Kontext einen einzelnen Landstreifen beziehungsweise Anteil.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Grenzbeschreibung wurde syntaktisch geglättet, während die gedrängte Form des Hebräischen und die Unsicherheit der Ost-West-Klausel in einer Fußnote sichtbar bleiben. Ortsnamen sind transliteriert.
