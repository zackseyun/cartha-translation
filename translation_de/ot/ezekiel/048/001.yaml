  rationale: Die Revision beseitigt den nicht ausdrücklich im Ausgangstext genannten Grenzverlauf und bindet die Ost-West-Angabe wieder eindeutig an Dans Anteil an. Zugleich werden die topographischen Angaben als bewusst knappe Grenzliste lesbar gemacht. Die Deutung des „Meeres“ wird weder im Text noch in der Anmerkung konfessionell oder geografisch überbestimmt.
