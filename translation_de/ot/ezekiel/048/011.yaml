    issue: Interpretierende Ausweitung von שָׁמְרוּ מִשְׁמַרְתִּי
    rationale: „den ihnen von mir anvertrauten Dienst treu versehen“ fügt „ihnen anvertraut“ und „treu“ als explizite Aussagen hinzu. Die hebräische Formel sollte knapper als Wahrnehmen/Bewahren von Gottes Dienst bzw. Verpflichtung wiedergegeben werden.
  - severity: low
    issue: Unnatürliche Apposition „die Geheiligten unter den Söhnen Zadoks“
