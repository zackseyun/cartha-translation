  text: לַ/כֹּהֲנִ֤ים הַֽ/מְקֻדָּשׁ֙ מִ/בְּנֵ֣י צָד֔וֹק אֲשֶׁ֥ר שָׁמְר֖וּ מִשְׁמַרְתִּ֑/י אֲשֶׁ֣ר לֹֽא תָע֗וּ בִּ/תְעוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֥ר תָּע֖וּ הַ/לְוִיִּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/011.yaml
  text: It shall be for the priests who are consecrated from the sons of Zadok[a], who kept my charge, who did not go astray when the sons of Israel went astray[c][b], as the Levites went astray.
translation:
  language: de
  text: Es soll den Priestern gehören, den geweihten Priestern aus den Söhnen Zadoks[a], die meinen Dienst wahrnahmen[b] und nicht in die Irre gingen, als die Israeliten in die Irre gingen[c], wie auch die Leviten in die Irre gingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den Nachkommen Zadoks“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung bezeichnet das zuverlässige Wahrnehmen der von Gott auferlegten Pflicht, besonders im priesterlichen Dienst.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „als die Söhne Israels in die Irre gingen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּהֲנִים
  choice: für die Priester bestimmt
  rationale: Das Präfix ל bezeichnet im Zusammenhang der Landverteilung die Bestimmung beziehungsweise Zuweisung. Die unpersönliche Formulierung mit „Es“ wahrt den Anschluss an den vorausgesetzten Anteil.
- source_word: הַמְקֻדָּשׁ
  choice: die Geheiligten
  rationale: Das passive Partizip von קדשׁ bezeichnet hier die für den heiligen Dienst Ausgesonderten. Die nachgestellte Apposition spiegelt die auffällige hebräische Fügung, ohne sie vorschnell zu glätten.
- source_word: מִבְּנֵי צָדוֹק
  choice: unter den Söhnen Zadoks
  rationale: מִן bezeichnet hier die Zugehörigkeit zu beziehungsweise Auswahl aus der zadokitischen Linie. „Söhne Zadoks“ bewahrt die biblische Abstammungsformel; die natürliche Deutung als Nachkommen wird in der Fußnote genannt.
- source_word: שָׁמְרוּ מִשְׁמַרְתִּי
  choice: den ihnen von mir anvertrauten Dienst treu versehen haben
  rationale: Die Verbindung bezeichnet das zuverlässige Wahrnehmen eines von Gott übertragenen Auftrags, hier besonders des priesterlichen Dienstes. Die Wiedergabe vermeidet das im Deutschen missverständliche wörtliche „meine Wache bewahren“.
- source_word: לֹא תָעוּ
  choice: nicht in die Irre gingen
  rationale: תעה meint in diesem Zusammenhang religiöse und moralische Abkehr, nicht räumliches Umherirren.
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל
  choice: als die Israeliten in die Irre gingen
  rationale: ב mit dem Infinitiv bezeichnet den zeitlichen Begleitumstand. „Israeliten“ gibt die hebräische Wendung „Söhne Israels“ in natürlichem modernem Deutsch wieder.
- source_word: כַּאֲשֶׁר תָּעוּ הַלְוִיִּם
  choice: wie die Leviten in die Irre gingen
  rationale: כַּאֲשֶׁר führt den Vergleich mit der Abkehr der Leviten ein und wahrt die Wiederholung des Verbs.
theological_decisions:
- issue: Verhältnis von priesterlicher Abstammung, Heiligung und Treue
  choice: Der Text bezeichnet die für den heiligen Dienst ausgesonderten Priester aus der Linie Zadoks und nennt ihre Treue als kennzeichnenden Gegensatz zur Abkehr Israels und der Leviten.
  alternative: Die Aussage könnte freier als bloße Belohnung für Treue formuliert werden, wobei die zadokitische Abstammung in den Hintergrund träte.
  rationale: Der hebräische Text hält Abstammung, kultische Aussonderung und treue Diensterfüllung zusammen. Die Übersetzung bewahrt diese Spannung, ohne daraus weitergehende Lehren über das Priestertum abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nachgestellte Wendung „die Geheiligten“ erhält die markierte hebräische Struktur; die Wiederholung „in die Irre gingen“ bewahrt den rhetorischen Kontrast. Zur besseren Lesbarkeit wird die lange Relativkette in zwei Sätze gegliedert.
