review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Zuweisung, zadokitische Abstammung und den Gegensatz zur Verirrung Israels und der Leviten grundsätzlich zutreffend wieder. „den ihnen von mir anvertrauten Dienst treu versehen haben“ entfaltet jedoch das knappe hebräische „meine Verpflichtung/meinen Dienst wahrten“ interpretierend; „treu“ und „ihnen anvertraut“ sind nicht ausdrücklich markiert. Die Satztrennung lässt außerdem den Vergleich „wie die Leviten“ unnötig lose stehen.
  naturalness: „die Geheiligten unter den Söhnen Zadoks“ wirkt im modernen Deutschen als Apposition zu „Priester“ holprig und ist weniger idiomatisch als eine unmittelbar integrierte Bezeichnung. Ein einziger Satz mit klarer Vergleichsanbindung ist trotz seiner Länge gut verständlich und bildet die hebräische Relativstruktur angemessener ab.
  terminology: „Geweihte Priester“ ist im kultisch-priesterlichen Zusammenhang eine natürliche Wiedergabe von הַמְקֻדָּשׁ. „Meinen Dienst wahrnahmen“ gibt שָׁמְרוּ מִשְׁמַרְתִּי zurück, ohne zusätzliche Treue- oder Anvertrauungsformulierungen einzutragen. „Israeliten“ ist als moderne Wiedergabe von „Söhne Israels“ vertretbar; die Fußnote hält die wörtlichere Alternative bereit.
