  to: Es soll den Priestern gehören, den geweihten Priestern aus den Söhnen Zadoks[a], die meinen Dienst wahrnahmen[b] und nicht in die Irre gingen, als die Israeliten in die Irre gingen[c], wie auch die Leviten in die Irre gingen.
