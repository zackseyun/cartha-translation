  - severity: low
    issue: Gelöste Vergleichsphrase nach Satztrennung
    rationale: „wie die Leviten in die Irre gingen“ gehört syntaktisch zum Zeitpunkt bzw. Umstand der Verirrung Israels. Die Zusammenführung verhindert einen abgehackten Nachsatz.
