base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/006.yaml
  text: And along the border of Ephraim[a], from the east side to the west side, Reuben[b], one portion.
translation:
  language: de
  text: 'Und entlang der Grenze Ephraims, von der Ostseite bis zur Westseite[a]: für Ruben ein Anteil.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zur Seite des Meeres“; „Meer“ ist hier die übliche hebräische Bezeichnung für den Westen.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Ruben, einer“. Das Wort „Anteil“ ist ergänzt, weil „einer“ in diesem Kapitel verkürzt für einen Stammesanteil steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Und entlang
  rationale: עַל bezeichnet in dieser Aufzählung die Lage an beziehungsweise entlang einer Grenze; die Wiedergabe bewahrt zugleich die verbindende Funktion des וְ.
- source_word: גְּבוּל
  choice: Grenze
  rationale: גְּבוּל bezeichnet hier die Grenzlinie zwischen den Stammesgebieten.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Stammesname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: מִפְּאַת קָדִים
  choice: von der Ostseite
  rationale: פֵּאָה bezeichnet eine Seite oder einen Rand, קָדִים hier die östliche Himmelsrichtung.
- source_word: וְעַד פְּאַת יָמָּה
  choice: bis zur Westseite
  rationale: יָם bedeutet wörtlich „Meer“, dient im Hebräischen aber auch als Richtungsangabe für den Westen; in dieser geografischen Formel ist „Westseite“ klar und sachgerecht.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Der Stammesname wird in der etablierten deutschen Form wiedergegeben.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Im Hebräischen steht nur „einer/eins“; im Zusammenhang der parallelen Landzuteilungen ist elliptisch ein einzelner Stammesanteil gemeint. „Anteil“ wird für verständliches Deutsch ergänzt und durch eine Fußnote kenntlich gemacht.
