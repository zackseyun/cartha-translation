  text: וְ/הָיְתָ֨ה לָ/הֶ֧ם תְּרוּמִיָּ֛ה מִ/תְּרוּמַ֥ת הָ/אָ֖רֶץ קֹ֣דֶשׁ קָדָשִׁ֑ים אֶל גְּב֖וּל הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/012.yaml
  text: And it shall be for them a special allotment from the contribution of the land[a], most holy[c][b], beside the territory of the Levites.
translation:
  language: de
  text: Für sie soll ein Sonderanteil aus der Landabgabe[a] bestimmt sein, hochheilig[b], an der Grenze der Leviten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem ausgesonderten Anteil des Landes“. Das hebräische Wort bezeichnet eine Abgabe oder einen Anteil, der für einen besonderen, hier heiligen Zweck ausgesondert wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich eine hebräische Steigerungsform: „das Heiligste“ oder „Heiliges der Heiligen“. Hier beschreibt sie den besonderen Heiligkeitsgrad des Landanteils.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „neben dem Gebiet der Leviten“. Das hebräische Wort kann sowohl die Grenze als auch das von ihr umschlossene Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Er soll … zufallen
  rationale: Die verbundene Qal-Perfektform beschreibt im Zusammenhang der künftigen Landverteilung eine vorgesehene Zuweisung. „Soll … zufallen“ gibt den futurisch-resultativen und possessiven Sinn im Deutschen natürlich wieder.
- source_word: לָהֶם
  choice: ihnen
  rationale: לְ bezeichnet hier die Priester aus dem unmittelbaren Kontext als Begünstigte beziehungsweise Besitzer des zugewiesenen Anteils.
- source_word: תְּרוּמִיָּה
  choice: Sonderanteil
  rationale: Das seltene Substantiv gehört zum Wortfeld einer für einen besonderen, heiligen Zweck ausgesonderten Abgabe. In Ezechiel 45–48 bezeichnet es ein abgegrenztes Landstück; „Sonderanteil“ wahrt diesen räumlichen Sinn.
- source_word: מִתְּרוּמַת הָאָרֶץ
  choice: aus der Landabgabe
  rationale: Die Wendung bezeichnet den Sonderanteil als Teil der größeren, aus dem Land ausgesonderten Abgabe. Das kompakte deutsche Kompositum bleibt im Kontext der Landaufteilung verständlich.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: 'Die Status-constructus-Verbindung ist eine hebräische Steigerungsform: „heiligstes“ beziehungsweise „überaus heilig“. „Hochheilig“ beschreibt den Heiligkeitsgrad des Landanteils, ohne daraus ausdrücklich einen Ort oder das Allerheiligste des Heiligtums zu machen.'
- source_word: אֶל גְּבוּל הַלְוִיִּם
  choice: neben dem Gebiet der Leviten
  rationale: אֶל bezeichnet in dieser Grenzbeschreibung die Nachbarschaft; גְּבוּל kann sowohl die Grenze als auch das dadurch bestimmte Gebiet meinen. Die Hauptübersetzung gibt die territoriale Nachbarschaft flüssig wieder, während die Fußnote die engere Grenzbedeutung bewahrt.
theological_decisions:
- issue: Bezug und Aussage von קֹדֶשׁ קָדָשִׁים
  choice: als prädikative Beschreibung „hochheilig“
  alternative: „ein hochheiliger Ort“ oder „das Allerheiligste“
  rationale: Der hebräische Text nennt weder ausdrücklich einen „Ort“ noch identifiziert er den Anteil mit dem innersten Heiligtumsraum. Die knappe prädikative Wiedergabe erhält die Heiligkeitsaussage, ohne den Sachbezug dogmatisch oder kulttopografisch zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzgestalt folgt der Zuweisungssprache des Abschnitts. „Sonderanteil“ und „Landabgabe“ sind verständliche Verwaltungsausdrücke mit sakralem Kontext; „hochheilig“ bewahrt die markante hebräische Steigerung.
