base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/018.yaml
  text: And the remainder along the length[a], corresponding to the holy contribution, shall be ten thousand to the east and ten thousand to the west; it shall correspond to the holy contribution[b], and its produce shall be for food for the workers of the city.
translation:
  language: de
  text: Der verbleibende Teil soll sich der Länge nach, entsprechend der heiligen Abgabe, zehntausend nach Osten und zehntausend nach Westen[a] erstrecken. Er soll der heiligen Abgabe entsprechen, und sein Ertrag soll den Arbeitern der Stadt als Nahrung[b] dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „zum Meer hin“, die übliche hebräische Bezeichnung für Westen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Brot“. „Brot“ kann hier allgemein für Nahrung stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר בָּאֹרֶךְ
  choice: Was der Länge nach übrig bleibt
  rationale: Die Formulierung gibt sowohl den verbleibenden Landteil als auch seine Ausdehnung in Längsrichtung wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Substantiv wie „Streifen“ einzufügen.
- source_word: לְעֻמַּת תְּרוּמַת הַקֹּדֶשׁ
  choice: entlang der heiligen Abgabe
  rationale: לְעֻמַּת bezeichnet hier die räumliche Zuordnung beziehungsweise parallele Lage zum ausgesonderten heiligen Landteil. „Entlang“ ist im Vermessungskontext natürlich und lässt die genaue geometrische Beziehung hinreichend offen.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: die heilige Abgabe
  rationale: תְּרוּמָה bezeichnet einen ausgesonderten beziehungsweise dargebrachten Anteil; „Abgabe“ bewahrt den kultischen Ausdruck, während der Zusammenhang deutlich macht, dass es sich um Land handelt.
- source_word: עֲשֶׂרֶת אֲלָפִים קָדִימָה
  choice: sich zehntausend nach Osten erstrecken
  rationale: Die Richtungsangabe und das Maß werden in natürlichem Deutsch wiedergegeben. Eine Maßeinheit wird nicht ergänzt, da sie im Vers selbst nicht ausdrücklich steht.
- source_word: וַעֲשֶׂרֶת אֲלָפִים יָמָּה
  choice: und zehntausend nach Westen
  rationale: יָמָּה bedeutet wörtlich „zum Meer hin“ und dient in der israelitischen Orientierung regelmäßig als Angabe für Westen; die Fußnote bewahrt den wörtlichen Bildgehalt.
- source_word: וְהָיְתָה תבואתה
  choice: und sein Ertrag soll … dienen
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag oder die Erzeugnisse des Landes. Die deutsche Konstruktion ist flüssig und wahrt den Zweckbezug.
- source_word: לְלֶחֶם
  choice: als Nahrung
  rationale: לֶחֶם bedeutet häufig konkret „Brot“, kann aber auch Lebensmittel oder Lebensunterhalt allgemein bezeichnen. Im Zusammenhang mit dem Ertrag eines Landstücks ist „Nahrung“ treffend; die wörtliche Möglichkeit wird angemerkt.
- source_word: לְעֹבְדֵי הָעִיר
  choice: den Arbeitern der Stadt
  rationale: Das Partizip von עבד bezeichnet hier diejenigen, die für beziehungsweise im Zusammenhang mit der Stadt arbeiten. „Arbeiter“ vermeidet eine unbegründete Einengung auf kultischen Dienst.
