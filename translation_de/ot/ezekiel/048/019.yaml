  text: And those who serve the city shall serve it from all the tribes of Israel[a][b].
translation:
  language: de
  text: Diejenigen, die für die Stadt arbeiten, werden ihr dienen; sie kommen aus allen Stämmen Israels.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer der Stadt dient, wird ihr dienen.“ Das hebräische Partizip steht im Singular, wird durch das folgende Verb im Plural hier jedoch wahrscheinlich kollektiv verstanden.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen „ihm dienen“; das Suffix ist männlich Singular. Es bezieht sich im Zusammenhang auf die Stadt, die im Deutschen mit „ihr“ wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹבֵד הָעִיר
  choice: wer für die Stadt arbeitet
  rationale: Das substantivierte Partizip steht im Singular und kann individuell oder kollektiv-generisch verstanden werden. Der deutsche Singular „wer … arbeitet“ bewahrt die Form und lässt den allgemeinen Bezug offen. Die Wendung bezeichnet Arbeit beziehungsweise Dienst für die Stadt, ohne die Art der Tätigkeit näher festzulegen.
- source_word: יַעַבְדֻהוּ
  choice: soll ihr dienen
  rationale: Das Verb עבד greift dieselbe Wurzel wie das Partizip auf. „dienen“ erhält diese Bedeutung, während das feminine deutsche Pronomen „ihr“ natürlich auf „die Stadt“ zurückverweist.
- source_word: מִכֹּל
  choice: aus allen
  rationale: 'Die Präposition מן bezeichnet hier Herkunft beziehungsweise Auswahl: Der oder die Arbeitende kommt aus der Gesamtheit der Stämme.'
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: Stämmen Israels
  rationale: Natürliche Wiedergabe der hebräischen Status-constructus-Verbindung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der generische Singular bewahrt die grammatische Zahl des Hebräischen, während die Fußnote die mögliche kollektive Lesart nennt. Die Wiederholung der Wurzel עבד wird mit „arbeitet … dienen“ semantisch sichtbar gemacht, ohne im Deutschen unnatürlich zu wirken.
