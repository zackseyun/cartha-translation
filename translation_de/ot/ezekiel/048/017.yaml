  text: וְ/הָיָ֣ה מִגְרָשׁ֮ לָ/עִיר֒ צָפ֨וֹנָ/ה֙ חֲמִשִּׁ֣ים וּ/מָאתַ֔יִם וְ/נֶ֖גְבָּ/ה חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וְ/קָדִ֨ימָ/ה֙ חֲמִשִּׁ֣ים וּ/מָאתַ֔יִם וְ/יָ֖מָּ/ה חֲמִשִּׁ֥ים וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/017.yaml
  text: And the city's open land shall be two hundred fifty cubits to the north[a], two hundred fifty to the south, two hundred fifty to the east[b], and two hundred fifty to the west.
translation:
  language: de
  text: Das Weideland der Stadt soll nach Norden 250 Ellen, nach Süden 250 Ellen, nach Osten 250 Ellen und nach Westen 250 Ellen betragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen bei jeder Himmelsrichtung „fünfzig und zweihundert“. Die Maßeinheit „Ellen“ ergibt sich aus dem Zusammenhang. Das Wort für das Land um die Stadt kann auch mit „Freifläche“ oder „Gemeindeland“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: soll … betragen
  rationale: Die mit וְ fortgeführte Verbform setzt die visionäre Beschreibung der künftigen Ordnung fort. Zusammen mit den Maßangaben ist „soll … betragen“ im Deutschen natürlich und sachgerecht.
- source_word: מִגְרָשׁ
  choice: Weideland
  rationale: מִגְרָשׁ bezeichnet eine der Stadt zugeordnete Freifläche, die auch als Weide- oder Gemeindeland verstanden werden kann. „Weideland“ ist konkret, traditionsnah und vermeidet die moderne Bedeutung von „Vorstadt“.
- source_word: לָעִיר
  choice: der Stadt
  rationale: Die Präposition לְ kennzeichnet hier die Zuordnung des Landes zur Stadt; der deutsche Genitiv gibt diese Beziehung knapp und natürlich wieder.
- source_word: צָפוֹנָה
  choice: nach Norden
  rationale: Das direktionale ה bezeichnet die Richtung beziehungsweise die betreffende Seite; „nach Norden“ passt zur symmetrischen Aufzählung.
- source_word: חֲמִשִּׁים וּמָאתַיִם
  choice: 250 Ellen
  rationale: Die hebräische Zahlenfolge lautet wörtlich „fünfzig und zweihundert“, wird im Deutschen jedoch in üblicher Reihenfolge als „250“ wiedergegeben. Die aus dem Zusammenhang erschlossene Maßeinheit „Ellen“ wird zur Verständlichkeit ausdrücklich genannt.
- source_word: וְנֶגְבָּה
  choice: nach Süden
  rationale: Die Richtungsangabe wird entsprechend den übrigen Himmelsrichtungen wiedergegeben.
- source_word: וְקָדִימָה
  choice: nach Osten
  rationale: קָדִימָה kann wörtlich „nach vorn“ bedeuten, bezeichnet in dieser geografischen Aufzählung aber eindeutig den Osten.
- source_word: וְיָמָּה
  choice: nach Westen
  rationale: יָמָּה bedeutet wörtlich „zum Meer hin“ und ist die übliche hebräische Richtungsangabe für Westen.
