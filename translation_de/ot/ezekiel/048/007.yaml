  text: וְ/עַ֣ל גְּב֣וּל רְאוּבֵ֗ן מִ/פְּאַ֥ת קָדִ֛ים עַד פְּאַת יָ֖מָּ/ה יְהוּדָ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/007.yaml
  text: And along the border of Reuben[a], from the eastern side to the western side, Judah[c][b], one portion.
translation:
  language: de
  text: 'Und an der Grenze Rubens, von der Ostseite bis zur Westseite: Juda, ein Anteil.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Juda, einer“. Das Wort „Anteil“ ist durch die Landverteilungsformel dieses Kapitels vorausgesetzt.'
    reason: lexical_alternative
  - marker: b
    text: „Westseite“ heißt im Hebräischen wörtlich „Meerseite“; „Meer“ kann als Richtungsangabe für Westen stehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Und an
  rationale: Leitet den nächsten Landstreifen in der Folge ein und beschreibt seine Lage unmittelbar an Rubens Grenze.
- source_word: גְּבוּל רְאוּבֵן
  choice: der Grenze Rubens
  rationale: גְּבוּל bezeichnet hier die Grenzlinie des Stammesgebiets; der vorangestellte Genitiv ist würdig und im Deutschen gut verständlich.
- source_word: מִ/פְּאַת קָדִים
  choice: von der Ostseite
  rationale: פְּאָה bezeichnet eine Seite oder ein äußeres Ende; in der Vermessungsformel ist die Richtungsangabe gemeint.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: bis zur Westseite
  rationale: יָם bedeutet wörtlich „Meer“, dient in der hebräischen geografischen Orientierung aber auch als Bezeichnung für Westen.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Geläufige deutsche Form des Stammesnamens.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Im Hebräischen steht nur „einer/eins“; „Anteil“ ist aus der wiederkehrenden Landverteilungsformel des Kapitels zu ergänzen.
