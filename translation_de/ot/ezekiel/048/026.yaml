  text: וְ/עַ֣ל גְּב֣וּל יִשָׂשכָ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה זְבוּלֻ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/026.yaml
  text: And along the border of Issachar[a], from the east side to the west side, Zebulun[b], one portion.
translation:
  language: de
  text: Und an der Grenze Issachars, von der Ostseite bis zur Westseite[a], liegt ein Anteil für Sebulon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „bis zur Meerseite“; damit ist die Westseite gemeint.
    reason: cultural_note
  - marker: b
    text: Im Hebräischen steht nur „Sebulon, einer“; „Anteil“ ist nach der wiederkehrenden Landzuteilungsformel des Kapitels ergänzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: Und an der Grenze
  rationale: Die Verbindung leitet die nächste Landzuteilung ein. „An der Grenze“ gibt die räumliche Nachbarschaft natürlich und präzise wieder.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Der Stammesname folgt der im Deutschen üblichen biblischen Schreibweise.
- source_word: מִפְּאַת קָדִימָה
  choice: von der Ostseite
  rationale: פֵּאָה bezeichnet hier die Seite beziehungsweise den Rand, und קָדִימָה die östliche Richtung.
- source_word: עַד פְּאַת יָמָּה
  choice: bis zur Westseite
  rationale: יָם bedeutet wörtlich „Meer“, dient in geografischen Angaben aber idiomatisch zur Bezeichnung des Westens.
- source_word: זְבוּלֻן
  choice: Sebulon
  rationale: Der Stammesname folgt der im Deutschen üblichen biblischen Schreibweise.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Im Hebräischen steht nur „einer/eins“; „Anteil“ wird aus der wiederkehrenden Landzuteilungsformel des Kapitels ergänzt.
theological_decisions: []
