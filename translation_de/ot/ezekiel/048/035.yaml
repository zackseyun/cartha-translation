base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/035.yaml
  text: All around shall be eighteen thousand[a], and the name of the city from that day on shall be, Yahweh Is There.
translation:
  language: de
  text: 'Der Umfang betrug ringsum 18.000. Und von jenem Tag an wird der Name der Stadt lauten: »Jahwe ist dort.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH schammah, das heißt: »Jahwe ist dort«.'
    reason: Die Fußnote legt die hebräische Namensform offen und dokumentiert die prädikative Wiedergabe.
lexical_decisions:
- source_word: סָבִיב
  choice: Ringsum
  rationale: Gibt die zusammenfassende Angabe zum gesamten Umfang knapp und räumlich präzise wieder.
- source_word: שְׁמֹנָה עָשָׂר אָלֶף
  choice: '18.000'
  rationale: Der hebräische Text nennt nur die Zahl; die aus dem Zusammenhang erschließbare Maßeinheit wird nicht ergänzt.
- source_word: וְשֵׁם הָעִיר
  choice: Und … der Name der Stadt
  rationale: Bewahrt die feierliche Namensformel und den Anschluss mit der hebräischen Konjunktion.
- source_word: מִיּוֹם
  choice: von diesem Tag an
  rationale: Drückt idiomatisch den Zeitpunkt aus, ab dem der Name gelten wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: שָׁמָּה
  choice: ist dort
  rationale: Das Ortsadverb wird in der symbolischen Namensformel prädikativ verstanden; diese naheliegende syntaktische Ergänzung ergibt im Deutschen einen vollständigen Satznamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה im Namen der Stadt
  choice: Jahwe ist dort
  alternative: Der HERR ist dort
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« erhält den persönlichen Gottesnamen, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
- issue: Syntaktische Deutung von יְהוָה שָׁמָּה
  choice: 'als prädikative Namensformel: »Jahwe ist dort«'
  alternative: 'als bloße Aneinanderreihung: »Jahwe dort«'
  rationale: Im Hebräischen kann der Nominalsatz ohne ausgedrückte Kopula stehen. Das deutsche »ist« macht diese Struktur verständlich, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Maßangabe des Hebräischen bleibt ohne ergänzte Einheit erhalten; die zweite Satzhälfte wird als feierliche Namensgebung formuliert.
