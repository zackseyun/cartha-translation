  text: וְ/עַ֣ל גְּב֣וּל בִּנְיָמִ֗ן מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה שִׁמְע֥וֹן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/024.yaml
  text: 'Along the border of Benjamin[a], from the east side to the west side, Simeon: one portion.'
translation:
  language: de
  text: 'An der Grenze Benjamins, von der Ostseite bis zur Westseite: Simeon, ein Anteil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen nur: »Simeon, einer«. Das Substantiv »Anteil« ist aufgrund der wiederholten Zuteilungsformel in diesem Kapitel sinngemäß ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: An
  rationale: Die Wendung führt die nächste Stammeszuteilung in der Reihe ein und bezeichnet ihre Lage an Benjamins Grenze. Das verbindende וְ bleibt im Deutschen in der fortlaufenden Aufzählung unausgedrückt.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Im Zusammenhang der Landverteilung bezeichnet das Wort die Grenzlinie des Stammesgebiets, nicht das Gebiet als Ganzes.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Der Stammesname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: מִפְּאַת קָדִימָה
  choice: von der Ostseite
  rationale: Die Formulierung bezeichnet die östliche Seite beziehungsweise Kante und wahrt die räumliche Struktur des Hebräischen.
- source_word: עַד פְּאַת יָמָּה
  choice: bis zur Westseite
  rationale: Die parallele Wiedergabe entspricht der wiederkehrenden Formel für die Ausdehnung von Osten nach Westen.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Der Stammesname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: אֶחָד
  choice: ein Anteil
  rationale: Das Zahlwort steht elliptisch; aus der wiederholten Zuteilungsformel des Kapitels ist ein einzelner Landanteil zu ergänzen.
