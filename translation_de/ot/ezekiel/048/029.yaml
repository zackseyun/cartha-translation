  text: זֹ֥את הָ/אָ֛רֶץ אֲשֶׁר תַּפִּ֥ילוּ מִֽ/נַּחֲלָ֖ה לְ/שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וְ/אֵ֨לֶּה֙ מַחְלְקוֹתָ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/029.yaml
  text: This is the land that you shall assign as an inheritance to the tribes of Israel[a], and these are their portions, declares the Lord GOD.
translation:
  language: de
  text: Dies ist das Land, das ihr den Stämmen Israels als Erbbesitz zuteilen sollt. Dies sind ihre Landanteile[a] – Ausspruch Jahwes, des Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ihre Aufteilungen“ oder „ihre Zuteilungen“. Gemeint sind die den einzelnen Stämmen zugewiesenen Gebiete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: Dies ist das Land
  rationale: Die demonstrative Zusammenfassung wird im Deutschen natürlich mit einer ergänzten Kopula wiedergegeben; אֶרֶץ bezeichnet hier das in der Vision verteilte Gebiet.
- source_word: אֲשֶׁר תַּפִּילוּ
  choice: das ihr … zuteilen sollt
  rationale: Das Hifil von נפל bezeichnet im Zusammenhang der Landverteilung das Zuweisen durch Los beziehungsweise das Zuteilen eines Anteils; „zuteilen“ gibt die Funktion klar und idiomatisch wieder.
- source_word: מִנַּחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet einen erblich übertragenen Besitz beziehungsweise Erbanteil. Die Präposition gehört hier zur Zuteilungsformel; „als Erbbesitz“ gibt den Zweck und Rechtscharakter des Landes wieder.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: den Stämmen Israels
  rationale: Der mit לְ markierte Empfänger wird im Deutschen durch den Dativ ausgedrückt.
- source_word: מַחְלְקוֹתָם
  choice: ihre Landanteile
  rationale: Das Wort bezeichnet hier die durch Aufteilung entstandenen Anteile der Stämme. „Landanteile“ macht den territorialen Bezug im unmittelbaren Kontext deutlich.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Die feste prophetische Beglaubigungsformel wird nominal wiedergegeben und entspricht damit der Form des Hebräischen.
- source_word: אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  rationale: „Herr“ gibt אֲדֹנָי wieder; „Jahwe“ gibt den Gottesnamen יהוה in geläufiger deutscher Form wieder, ohne beide Bestandteile des Titels zusammenzuziehen.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Die gewählte Form bewahrt sowohl den Titel אֲדֹנָי als auch den ausdrücklich gesetzten Eigennamen יהוה. Die Alternativen folgen verbreiteten deutschen Bibelkonventionen, verdecken jedoch entweder den Eigennamen oder geben die beiden hebräischen Bestandteile weniger unmittelbar wieder.
- issue: Rechtscharakter der Landzuteilung
  choice: als Erbbesitz
  alternative: zum Erbteil; als Besitz
  rationale: Die Formulierung hält fest, dass das Land nicht bloß vorübergehend verteilt, sondern den Stämmen als bleibender, vererbbarer Besitz zugewiesen wird, ohne darüber hinausgehende theologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zuteilen“ und „Landanteile“ sind allgemein verständlich und halten zugleich den verwaltungsrechtlichen Charakter der Landverteilung fest. Der Gedankenstrich grenzt die prophetische Schlussformel knapp vom Satz ab.
