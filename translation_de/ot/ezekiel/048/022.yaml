  text: וּ/מֵ/אֲחֻזַּ֤ת הַ/לְוִיִּם֙ וּ/מֵ/אֲחֻזַּ֣ת הָ/עִ֔יר בְּ/ת֛וֹךְ אֲשֶׁ֥ר לַ/נָּשִׂ֖יא יִֽהְיֶ֑ה בֵּ֣ין גְּב֣וּל יְהוּדָ֗ה וּ/בֵין֙ גְּב֣וּל בִּנְיָמִ֔ן לַ/נָּשִׂ֖יא יִהְיֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/022.yaml
  text: And from the property of the Levites and from the property of the city[a], in the midst of what belongs to the prince, between the border of Judah and the border of Benjamin[b], it shall belong to the prince.
translation:
  language: de
  text: Auch das Gebiet vom Grundbesitz der Leviten und vom Grundbesitz der Stadt an, das inmitten dessen liegt, was dem Fürsten gehören wird, soll dem Fürsten gehören; es liegt zwischen der Grenze Judas und der Grenze Benjamins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Grenze“ kann hier auch „Gebiet“ bedeuten: „zwischen dem Gebiet Judas und dem Gebiet Benjamins“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחֻזַּת
  choice: Grundbesitz
  rationale: אֲחֻזָּה bezeichnet hier einen dauerhaft zugewiesenen Landbesitz. „Grundbesitz“ gibt den territorialen Sinn natürlich und genauer wieder als das allgemeinere „Besitz“.
- source_word: הַלְוִיִּם
  choice: der Leviten
  rationale: Die übliche Bezeichnung der im Zusammenhang genannten Gruppe; der bestimmte Artikel ist im Deutschen durch die Formulierung mit Genitiv angemessen wiedergegeben.
- source_word: הָעִיר
  choice: der Stadt
  rationale: Gemeint ist der im vorangehenden Zusammenhang ausgewiesene Landbesitz der Stadt.
- source_word: בְּתוֹךְ
  choice: inmitten
  rationale: Die Präposition beschreibt die Lage innerhalb des größeren, dem Fürsten zugewiesenen Bereichs. „Inmitten“ bewahrt den räumlichen Nachdruck des Hebräischen.
- source_word: אֲשֶׁר לַנָּשִׂיא יִהְיֶה
  choice: dessen, was dem Fürsten gehören wird
  rationale: Die relative Wendung bezeichnet das größere Gebiet als künftigen Anteil des Fürsten, ohne über die Art seiner Herrschaft hinauszugehen.
- source_word: נָשִׂיא
  choice: Fürst
  rationale: נָשִׂיא ist in Hesekiels Land- und Tempelvision ein Titel des weltlichen Oberhaupts. „Fürst“ bewahrt die Unterscheidung von der Bezeichnung „König“.
- source_word: בֵּין גְּבוּל יְהוּדָה וּבֵין גְּבוּל בִּנְיָמִן
  choice: zwischen der Grenze Judas und der Grenze Benjamins
  rationale: גְּבוּל kann sowohl „Grenze“ als auch „Gebiet“ bedeuten. In dieser Lagebeschreibung hält „Grenze“ die räumliche Bildsprache des hebräischen Textes fest.
- source_word: לַנָּשִׂיא יִהְיֶה
  choice: soll dem Fürsten gehören
  rationale: Die wiederholte Schlussformel hebt die Zuweisung an den Fürsten hervor. „Soll … gehören“ ist klares, würdevolles Deutsch und gibt den possessiven Sinn wieder.
theological_decisions:
- issue: Wiedergabe von נָשִׂיא in Hesekiels Vision vom wiederhergestellten Land
  choice: Fürst
  alternative: Oberhaupt; Herrscher
  rationale: Der politische Titel wird beibehalten, ohne die Gestalt genauer verfassungsrechtlich oder messianisch zu bestimmen, als es dieser Vers selbst tut.
- issue: Bezug und räumliche Gliederung des Fürstenanteils
  choice: Die schwerfällige hebräische Abfolge wird als Beschreibung des dem Fürsten zugewiesenen Gebietes wiedergegeben, dessen Lage zwischen Juda und Benjamin ausdrücklich genannt wird.
  alternative: Die beiden Besitzungen ausdrücklich als vom Fürstengebiet abgetrennte beziehungsweise ausgenommene Flächen auffassen.
  rationale: Der Vers nennt keine ausdrückliche Vokabel für „abtrennen“ oder „ausnehmen“. Daher wird diese verbreitete, aus dem Zusammenhang erschlossene Deutung nicht stillschweigend in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche räumliche Satzführung des Hebräischen bleibt erkennbar, wird aber durch zwei Sätze lesbarer gemacht. „Vom … an“ bewahrt die zweimalige Präposition מִן, ohne eine im Ausgangstext nicht ausdrücklich genannte Abtrennung einzuführen.
