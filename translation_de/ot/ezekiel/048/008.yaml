  to: 'Entlang der Grenze Judas, von der Ostseite bis zur Westseite, soll der Anteil liegen, den ihr als Abgabe[a] aussondern sollt: fünfundzwanzigtausend breit und an Länge wie einer der Anteile[c], von der Ostseite bis zur Westseite[b]. Das Heiligtum soll in seiner Mitte liegen.'
  rationale: Die Revision vermeidet die im modernen Deutsch missverständliche isolierte Verwendung von „Abgabe“, ohne die Opfer- bzw. Aussonderungsbedeutung von תְּרוּמָה zu verlieren. „Anteil“ macht den im Kontext gemeinten Landstreifen sichtbar; „als Abgabe aussondern“ bewahrt die Verknüpfung mit dem hebräischen Terminus und Verb. Die übrigen Aussagen und die Fußnotenanker bleiben inhaltlich erhalten.
