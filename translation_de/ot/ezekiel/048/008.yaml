source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל יְהוּדָ֔ה מִ/פְּאַ֥ת קָדִ֖ים עַד פְּאַת יָ֑מָּ/ה תִּהְיֶ֣ה הַ/תְּרוּמָ֣ה אֲֽשֶׁר תָּרִ֡ימוּ חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֜לֶף רֹ֗חַב וְ/אֹ֜רֶךְ כְּ/אַחַ֤ד הַ/חֲלָקִים֙ מִ/פְּאַ֤ת קָדִ֨ימָ/ה֙ עַד פְּאַת יָ֔מָּ/ה וְ/הָיָ֥ה הַ/מִּקְדָּ֖שׁ בְּ/תוֹכֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/008.yaml
  text: 'Along the border of Judah[a], from the east side to the west side, shall be the contribution that you shall set apart: twenty-five thousand in width, and in length like one of the portions, from the east side to the west side[c][b]; and the sanctuary shall be in its midst.'
translation:
  language: de
  text: 'Entlang der Grenze Judas, von der Ostseite bis zur Westseite, soll der Anteil liegen, den ihr als Abgabe[a] aussondern sollt: fünfundzwanzigtausend breit und an Länge wie einer der Anteile[c], von der Ostseite bis zur Westseite[b]. Das Heiligtum soll in seiner Mitte liegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Hebopfer“ oder „ausgesonderter Bezirk“. Das hebräische Wort bezeichnet eine Gabe beziehungsweise einen Anteil, der für einen heiligen Zweck ausgesondert wird.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „vom östlichen Rand bis zum Rand meerwärts“; „Westseite“ gibt die übliche Richtungsbedeutung wieder.
    reason: lexical_alternative
  - marker: c
    text: 'Gemeint ist: Die Länge entspricht der Länge eines der Landanteile, die den Stämmen zugeteilt sind.'
    reason: cultural_note
lexical_decisions:
- source_word: גְּבוּל
  choice: Grenze
  rationale: Im Zusammenhang der Landverteilung bezeichnet das Wort eine Gebietsgrenze; „Grenze“ ist im modernen Deutschen klar und sachgerecht.
- source_word: מִפְּאַת קָדִים ... עַד פְּאַת יָמָּה
  choice: von der Ostseite bis zur Westseite
  rationale: פֵּאָה bezeichnet hier Seite oder Rand; יָמָּה weist idiomatisch nach Westen. Die Übersetzung gibt die geografische Bedeutung natürlich wieder.
- source_word: הַתְּרוּמָה
  choice: die Abgabe
  rationale: Das Wort bezeichnet etwas, das als Gabe ausgesondert wird. In Hesekiel 45–48 ist damit ein besonders ausgesondertes Landgebiet gemeint; „Abgabe“ bewahrt den Gabe-Aspekt, während der folgende Relativsatz den räumlichen Sinn klärt.
- source_word: תָּרִימוּ
  choice: die ihr absondern sollt
  rationale: Der Hifil von רוּם bezeichnet hier das Aussondern einer Abgabe. „Absondern“ passt zum Landkontext und vermeidet den Eindruck eines Tier- oder Speiseopfers.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף רֹחַב
  choice: fünfundzwanzigtausend breit
  rationale: Die Maßzahl wird direkt wiedergegeben; wie im Hebräischen bleibt die in diesem Abschnitt vorausgesetzte Maßeinheit unausgesprochen.
- source_word: וְאֹרֶךְ כְּאַחַד הַחֲלָקִים
  choice: und ihre Länge soll der eines der Anteile entsprechen
  rationale: חֵלֶק bedeutet Anteil oder zugeteiltes Stück. Die Formulierung bewahrt den Vergleich, ohne „Stammes-“ in den Haupttext einzutragen, da dies nur aus dem Zusammenhang hervorgeht.
- source_word: הַמִּקְדָּשׁ
  choice: das Heiligtum
  rationale: „Heiligtum“ ist die übliche, hinreichend breite Wiedergabe für den heiligen Ort beziehungsweise Bezirk.
- source_word: בְּתוֹכוֹ
  choice: in ihrer Mitte
  rationale: Die Wendung beschreibt die Lage innerhalb der ausgesonderten Abgabe; das feminine Pronomen bezieht sich im Deutschen auf „Abgabe“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit leicht gegliedert. Die im Hebräischen fehlende Maßeinheit wurde nicht ergänzt; die technische Bedeutung von תְּרוּמָה bleibt durch Haupttext und Fußnote erkennbar.
