base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/021.yaml
  text: But as for those whose heart goes after their detestable things and their abominations[a], I have brought their way upon their own heads[b], declares the Lord GOD.
translation:
  language: de
  text: Doch was die betrifft, deren Herz ihren Scheusalen und Gräueln folgt[a], ihren Weg habe ich auf ihren eigenen Kopf gelegt[b] – Ausspruch des Herrn Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen ungewöhnlich: „Ihr Herz geht zum Herzen ihrer Scheusale und ihrer Gräuel.“ Gemeint ist ihre innere Hinwendung zu ihnen. „Scheusale“ kann hier insbesondere verabscheuungswürdige Kultgegenstände, auch Götzen, bezeichnen.'
    reason: lexikalische und idiomatische Erläuterung
  - marker: b
    text: 'Wörtlich: „Ihren Weg habe ich auf ihren Kopf gegeben.“ Das Bild bezeichnet Vergeltung: Die Folgen ihres eigenen Verhaltens kommen auf sie selbst zurück. Die hebräische Verbform kann im Zusammenhang auch eine sichere künftige Gerichtsankündigung ausdrücken: „werde ich auf ihren eigenen Kopf legen“.'
    reason: idiomatische und zeitliche Mehrdeutigkeit
lexical_decisions:
- source_word: וְאֶל
  choice: Doch was die betrifft
  rationale: Die Wendung setzt diese Menschen als Gegenstand des folgenden Gerichtsworts in Kontrast zur Verheißung in den vorangehenden Versen. Die deutsche Formulierung gibt diese adversative und thematische Funktion natürlich wieder.
- source_word: לֵב ... לִבָּם הֹלֵךְ
  choice: deren Herz ... folgt
  rationale: Die ungewöhnliche hebräische Formulierung beschreibt die innere Hinwendung und treue Ausrichtung. Das Herzbild und die Bewegungsmetapher bleiben erhalten, ohne den schwer verständlichen Wortlaut mechanisch nachzubilden.
- source_word: שִׁקּוּצֵיהֶם
  choice: ihren Scheusalen
  rationale: שִׁקּוּץ bezeichnet etwas Abscheuliches, im prophetischen Sprachgebrauch häufig einen verabscheuungswürdigen Kultgegenstand oder Götzen. „Scheusale“ wahrt die Gegenständlichkeit und lässt den kultischen Bezug offen.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: und Gräueln
  rationale: תּוֹעֵבָה bezeichnet kultisch oder sittlich Verabscheuungswürdiges. „Gräuel“ ist im Deutschen verständlich, gewichtig und unterscheidet den Ausdruck vom benachbarten שִׁקּוּץ.
- source_word: דַּרְכָּם
  choice: ihren eigenen Weg
  rationale: „Weg“ bewahrt die hebräische Metapher für Lebensführung und Verhalten. „Eigenen“ verdeutlicht im Deutschen, dass die Folgen ihres Verhaltens auf sie selbst zurückkommen.
- source_word: בְּרֹאשָׁם נָתַתִּי
  choice: habe ich auf ihren Kopf zurückfallen lassen
  rationale: Der hebräische Vergeltungsausdruck besagt, dass das eigene Verhalten mitsamt seinen Folgen auf die Handelnden zurückkommt. „Auf ihren Kopf“ erhält das konkrete Bild; „zurückfallen lassen“ macht dessen Sinn in natürlichem Deutsch deutlich.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: נְאֻם wird als prophetische Bekräftigungsformel mit „Ausspruch“ wiedergegeben. „Herr Jahwe“ unterscheidet den Titel אֲדֹנָי vom unmittelbar folgenden Gottesnamen יהוה und gibt den Namen erkennbar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  alternative: Gottes, des HERRN; des souveränen HERRN
  rationale: Der Ausgangstext verbindet den Titel אֲדֹנָי mit dem Eigennamen יהוה. Die gewählte Form hält beides auseinander, ohne eine zusätzliche Aussage über Gottes Herrschaft in den Text einzutragen.
- issue: Zeitbezug von נָתַתִּי im Gerichtswort
  choice: habe ich ... zurückfallen lassen
  alternative: werde ich ... zurückfallen lassen
  rationale: Die hebräische Qatalform ist formal abgeschlossen formuliert und kann die Gewissheit des göttlichen Gerichts ausdrücken. Der Kontext erlaubt auch ein zukünftig verstandenes Gericht; diese Spannung wird nicht durch eine ausschließlich futurische Haupttextfassung beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herz- und Wegmetaphorik sowie das konkrete Bild vom Kopf bleiben erhalten; ungewöhnliche hebräische Wendungen werden in den Fußnoten offengelegt. „Scheusale“ und „Gräuel“ bewahren die zwei verschiedenen, eng verwandten Wertungsbegriffe des Ausgangstextes.
