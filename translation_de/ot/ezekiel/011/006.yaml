  text: You have multiplied your slain in this city and filled its streets with the slain[a][b].
translation:
  language: de
  text: Ihr habt die Zahl der von euch Erschlagenen in dieser Stadt vermehrt und ihre Straßen mit Erschlagenen gefüllt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Toten“ oder „eure Leichen“. Das hebräische Wort bezeichnet hier insbesondere gewaltsam Getötete; daher „Erschlagene“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Plätze“. Das hebräische Wort kann Straßen, Plätze oder andere öffentliche Freiflächen einer Stadt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּיתֶם חַלְלֵיכֶם
  choice: Ihr habt … viele Menschen erschlagen
  rationale: Die Verbindung bezeichnet wörtlich ein Vermehren der gewaltsam Getöteten. Die verbale Wiedergabe ist im modernen Deutsch natürlich und bewahrt die Verantwortungszuweisung an die Angeredeten.
- source_word: בָּעִיר הַזֹּאת
  choice: in dieser Stadt
  rationale: Die Wendung gibt den Ort und die demonstrative Hervorhebung direkt und idiomatisch wieder.
- source_word: וּמִלֵּאתֶם
  choice: und … gefüllt
  rationale: Das Piel Perfekt von מלא bezeichnet das Füllen; die koordinierte Perfektform entspricht dem abgeschlossenen Ergebnis der hebräischen Aussage.
- source_word: חוּצֹתֶיהָ
  choice: ihre Straßen
  rationale: Im städtischen Zusammenhang kann חוּצוֹת Straßen, Plätze oder andere öffentliche Freiflächen bezeichnen. »Straßen« ist hier die natürlichste deutsche Wiedergabe.
- source_word: חָלָל
  choice: mit Erschlagenen
  rationale: חָלָל bezeichnet gewaltsam Getötete und steht hier kollektiv. »Erschlagene« erhält diesen Sinn und die lexikalische Verbindung zur ersten Vershälfte.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Vershälfte wird zur Vermeidung der unnatürlichen Formulierung »Erschlagene vermehren« verbal wiedergegeben; die zweite behält »Erschlagene« bei und macht dadurch das Bild der mit Leichen gefüllten öffentlichen Räume deutlich.
