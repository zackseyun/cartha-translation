  terminology: »Geist Jahwes«, »Jahwe«, »So spricht Jahwe« und »Haus Israel« sind angemessen. Die Wiedergabe »was in eurem Geist aufsteigt« wahrt bewusst die hebräische Metapher und soll nicht im Haupttext zu »Gedanken« eingeengt werden.
