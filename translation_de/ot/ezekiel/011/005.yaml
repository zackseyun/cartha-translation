  text: וַ/תִּפֹּ֣ל עָלַ/י֮ ר֣וּחַ יְהוָה֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אֱמֹר֙ כֹּה אָמַ֣ר יְהוָ֔ה כֵּ֥ן אֲמַרְתֶּ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל וּ/מַעֲל֥וֹת רֽוּחֲ/כֶ֖ם אֲנִ֥י יְדַעְתִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/005.yaml
  text: 'And the Spirit of Yahweh fell upon me[a], and he said to me, “Say, ‘Thus says Yahweh: So you have said, O house of Israel, and I know the things that come up in your spirit.’”'
translation:
  language: de
  text: 'Da kam der Geist Jahwes über mich[a], und er sagte zu mir: »Sprich: So spricht Jahwe: So habt ihr gesprochen, Haus Israel; und was in eurem Geist[b] aufsteigt, das weiß ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »fiel auf mich«.'
    reason: Die Fußnote bewahrt die anschauliche Bildsprache von נפל mit עַל, während der Haupttext eine im modernen Deutschen idiomatische Wiedergabe bietet.
  - marker: b
    text: 'Oder: »was euch in den Sinn kommt«; hebräisch: »was in eurem Geist aufsteigt«.'
    reason: רוּחַ kann hier die innere Regung beziehungsweise das Denken bezeichnen. Der Haupttext wahrt die hebräische Begrifflichkeit und Aufstiegsmetapher.
lexical_decisions:
- source_word: וַתִּפֹּל עָלַי
  choice: Da fiel … auf mich
  rationale: Die Wendung bewahrt das anschauliche Bild von נפל mit עַל und passt zum überwältigenden Kommen des Geistes im prophetischen Zusammenhang.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: רוּחַ bezeichnet hier im Visions- und Berufungskontext Gottes Geist, nicht einen natürlichen Wind.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Dies ist die geläufige, zugleich quellennah formulierte deutsche Wiedergabe der prophetischen Botenformel.
- source_word: כֵּן אֲמַרְתֶּם
  choice: So habt ihr gesprochen
  rationale: Die Formulierung hält sich eng an כֵּן und das Perfekt von אמר, ohne den nicht ausdrücklich genannten Inhalt zu ergänzen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die feste Bundes- und Anredeformel bleibt erhalten; ein zusätzliches altertümliches »o« ist im modernen Deutschen unnötig.
- source_word: וּמַעֲלוֹת רוּחֲכֶם
  choice: und was in eurem Geist aufsteigt
  rationale: Die Wiedergabe erhält sowohl die Aufstiegsmetapher von מַעֲלוֹת als auch רוּחַ und ist dennoch verständliches Deutsch.
- source_word: אֲנִי יְדַעְתִּיהָ
  choice: das weiß ich
  rationale: Das vorangestellte »das« nimmt den substantivierten Relativsatz natürlich auf; »weiß« gibt das Wissen um innere Gedanken im Deutschen idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von רוּחַ in der ersten Satzhälfte
  choice: Geist
  alternative: Wind
  rationale: Im prophetischen Visionszusammenhang handelt Gottes Geist am Propheten; ein natürlicher Wind ist hier nicht gemeint.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Gottesnamen; die Transliteration wahrt seinen Charakter als Eigenname.
- issue: Anthropologische Bedeutung von רוּחֲכֶם
  choice: euer Geist
  alternative: euer Sinn / eure Gedanken
  rationale: Der Haupttext wahrt die hebräische Begrifflichkeit und ihre mögliche Weite; die Fußnote nennt die im Kontext naheliegende gedankliche Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener prophetischer Formel und bewusster Wahrung der Aufstiegsmetapher. Die Zeichensetzung macht die verschachtelte direkte Rede übersichtlich.
