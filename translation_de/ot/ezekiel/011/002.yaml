base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/002.yaml
  text: And he said to me[a], “Son of man[b], these are the men who devise iniquity and give evil counsel in this city.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Menschensohn, das sind die Männer, die Unheil ersinnen[a] und in dieser Stadt bösen Rat geben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Frevel planen« oder »Böses ausdenken«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu einem bösen Plan raten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Das narrative Wayyiqtol wird mit einer natürlichen deutschen Erzählverknüpfung wiedergegeben; das indirekte Objekt bleibt ausdrücklich erhalten.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die traditionelle, formnahe Wiedergabe der in Hesekiel wiederkehrenden göttlichen Anrede bewahrt ihren titelartigen und literarischen Charakter.
- source_word: אֵלֶּה הָאֲנָשִׁים
  choice: das sind die Männer
  rationale: Die bestimmte maskuline Pluralform bezeichnet im Kontext konkrete männliche Führungspersonen.
- source_word: הַחֹשְׁבִים אָוֶן
  choice: die Unheil ersinnen
  rationale: חשב bezeichnet hier absichtsvolles Planen; אָוֶן kann Unheil, Frevel oder Bosheit meinen. »Unheil ersinnen« bewahrt die semantische Breite und klingt im Deutschen natürlich und würdig.
- source_word: וְהַיֹּעֲצִים עֲצַת רָע
  choice: und bösen Rat geben
  rationale: Die Verbindung aus Partizip und stammverwandtem Substantiv betont aktives Beraten. Die deutsche Wendung wahrt diesen Sinn, ohne die hebräische Wortwiederholung unnatürlich nachzubilden.
- source_word: בָּעִיר הַזֹּאת
  choice: in dieser Stadt
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Wiedergabe der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Sterblicher; Menschenkind
  rationale: »Menschensohn« bewahrt die hebräische Form und die wiederkehrende, theologisch und literarisch markante Anrede des Propheten, ohne ihre Bedeutung auf eine einzelne Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellenah, während »Unheil ersinnen« und »bösen Rat geben« verständliche und idiomatische Formulierungen bieten. Die Anrede »Menschensohn« wird aus Gründen der literarischen Kohärenz in Hesekiel beibehalten.
