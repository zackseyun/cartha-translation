    issue: Die Fußnotenanker im englischen Audit Trail sind offenbar vertauscht.
    rationale: Die englische Anmerkung a betrifft die Formulierung zu חשבים און, steht aber bei »me«; Anmerkung b betrifft den Rat-Ausdruck, steht aber bei »Son of man«. Im deutschen Text sind die Anker dagegen sachgerecht nach »ersinnen« bzw. »Rat geben« gesetzt; dies erfordert keine Änderung der deutschen Übersetzung.
