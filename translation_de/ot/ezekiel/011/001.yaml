id: EZK.11.1
reference: Ezekiel 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תִּשָּׂ֨א אֹתִ֜/י ר֗וּחַ וַ/תָּבֵ֣א אֹ֠תִ/י אֶל שַׁ֨עַר בֵּית יְהוָ֤ה הַ/קַּדְמוֹנִי֙ הַ/פּוֹנֶ֣ה קָדִ֔ימָ/ה וְ/הִנֵּה֙ בְּ/פֶ֣תַח הַ/שַּׁ֔עַר עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ וָ/אֶרְאֶ֨ה בְ/תוֹכָ֜/ם אֶת יַאֲזַנְיָ֧ה בֶן עַזֻּ֛ר וְ/אֶת פְּלַטְיָ֥הוּ בֶן בְּנָיָ֖הוּ שָׂרֵ֖י הָ/עָֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/001.yaml
  text: Then the Spirit lifted me up and brought me to the east gate of the house of Yahweh[a], which faces eastward. And behold, at the entrance of the gate were twenty-five men, and I saw among them Jaazaniah son of Azzur and Pelatiah son of Benaiah[c][b], leaders of the people.
translation:
  language: de
  text: Da hob mich der Geist[a] empor und brachte mich zum östlichen Tor des Hauses Jahwes[b] – dem Tor, das nach Osten weist. Und siehe, am Eingang des Tores standen fünfundzwanzig Männer. Unter ihnen sah ich Jaasanja, den Sohn Asurs, und Pelatja, den Sohn Benajas; sie waren führende Männer des Volkes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein Geist hob mich empor“; das hebräische Wort רוּחַ kann „Geist“ oder „Wind“ bedeuten. Im Zusammenhang von Ezechiels Vision ist wahrscheinlich Gottes Geist gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus Jahwes“ ist hier der Tempel; gemeint ist eines seiner Tore.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „Fürsten des Volkes“ oder „Amtsträger des Volkes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: der Geist
  rationale: Im Zusammenhang von Ezechiels Visionen bezeichnet רוּחַ am ehesten den göttlichen Geist als den Handelnden. Der bestimmte Artikel ist im Deutschen kontextuell angemessen; die mögliche Bedeutung „ein Geist“ oder „Wind“ bleibt in der Fußnote sichtbar.
- source_word: וַתִּשָּׂא אֹתִי
  choice: hob mich empor
  rationale: Die Wendung bewahrt die anschauliche Aufwärtsbewegung von נשׂא und klingt im heutigen gehobenen Erzählstil natürlich.
- source_word: וַתָּבֵא אֹתִי
  choice: brachte mich
  rationale: Die Hifilform von בוא bedeutet hier „bringen“ und gibt den zielgerichteten visionären Transport klar wieder.
- source_word: שַׁעַר בֵּית יְהוָה
  choice: Tor des Hauses Jahwes
  rationale: Die Formulierung bildet den hebräischen Ausdruck transparent ab; mit dem „Haus Jahwes“ ist hier der Tempel gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens wahrt seinen Charakter als Eigenname.
- source_word: הַקַּדְמוֹנִי ... הַפּוֹנֶה קָדִימָה
  choice: östlichen Tor ... dem Tor, das nach Osten weist
  rationale: Die Übersetzung erhält sowohl die Bezeichnung als Osttor als auch die räumlich präzisierende, im Hebräischen bewusst wiederholte Angabe seiner Ausrichtung.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Der Ausdruck bewahrt die lebhafte prophetische Wahrnehmungsmarkierung, ohne sie zu einer bloßen Ortsangabe abzuflachen.
- source_word: בְּפֶתַח הַשַּׁעַר
  choice: am Eingang des Tores
  rationale: Dies ist eine natürliche und zugleich quellennah bleibende deutsche Ortsangabe.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: fünfundzwanzig Männer
  rationale: איש bezeichnet hier kollektiv eine Gruppe männlicher Personen.
- source_word: בְתוֹכָם
  choice: unter ihnen
  rationale: Die Wendung gibt die Zugehörigkeit der beiden Genannten zur Gruppe idiomatisch wieder.
- source_word: שָׂרֵי הָעָם
  choice: führende Männer des Volkes
  rationale: שׂרים bezeichnet Personen mit leitender oder amtlicher Stellung. Diese Wiedergabe ist verständlich und vermeidet die mögliche Fehlvorstellung erblichen Adels, die „Fürsten“ wecken könnte.
theological_decisions:
- issue: Bestimmung von רוּחַ beim visionären Transport Ezechiels
  choice: „der Geist“ als Hinweis auf Gottes Geist
  alternative: „ein Geist“ oder „Wind“
  rationale: Der wiederkehrende Sprachgebrauch in Ezechiels Visionen spricht dafür, dass der göttliche Geist den Propheten bewegt. Da das Substantiv selbst mehrdeutig bleibt und keinen Artikel trägt, wird die alternative Deutung ausdrücklich in einer Fußnote genannt.
- issue: Bedeutung von שָׂרֵי הָעָם
  choice: führende Männer des Volkes
  alternative: Fürsten des Volkes; Amtsträger des Volkes
  rationale: Die gewählte breite Amts- und Leitungsbezeichnung legt weder eine monarchische Rangordnung noch ein genauer bestimmtes Verwaltungsamt fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulichem prophetischem Erzählton. Die hebräische räumliche Wiederholung beim Osttor bleibt erhalten. Eigennamen folgen geläufigen deutschen Formen; der Gottesname wird als „Jahwe“ wiedergegeben.
