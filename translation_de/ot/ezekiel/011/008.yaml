  text: חֶ֖רֶב יְרֵאתֶ֑ם וְ/חֶ֨רֶב֙ אָבִ֣יא עֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/008.yaml
  text: You have feared the sword[a], and I will bring the sword upon you[b], declares the Lord GOD.
translation:
  language: de
  text: Vor dem Schwert habt ihr euch gefürchtet[a], und das Schwert werde ich über euch bringen[b] – erklärt der Herr Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische wiederholt „Schwert“ ohne bestimmten Artikel. Der Ausdruck kann auch weiter gefasst Krieg oder gewaltsames Gericht bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Vor dem Schwert habt ihr euch gefürchtet, und ein Schwert werde ich über euch bringen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב
  choice: das Schwert
  rationale: חֶרֶב bezeichnet konkret ein Schwert, kann in prophetischer Gerichtssprache jedoch metonymisch für Krieg, gewaltsamen Tod oder Strafgericht stehen. Die konkrete Wiedergabe bewahrt das Bild und die rhetorische Wiederholung.
- source_word: יְרֵאתֶם
  choice: habt ihr euch gefürchtet
  rationale: Das Qal Perfekt 2. Person maskulin Plural von ירא bezeichnet die bereits bestehende Furcht. Das deutsche Perfekt gibt dies natürlich wieder; die Konstruktion mit „vor“ entspricht idiomatischem Deutsch.
- source_word: וְחֶרֶב
  choice: und das Schwert
  rationale: Die Wiederholung von „das Schwert“ erhält den Nachdruck des Hebräischen. Obwohl der hebräische Ausdruck keinen Artikel trägt, ist der bestimmte Artikel im Deutschen durch die Wiederaufnahme des bereits genannten Gerichtsbildes gut begründet.
- source_word: אָבִיא עֲלֵיכֶם
  choice: werde ich über euch bringen
  rationale: Das Hifil von בוא mit עַל bezeichnet hier, dass Gott das angekündigte Gericht über die Angeredeten kommen lässt. „Über euch bringen“ wahrt sowohl die Präposition als auch den prophetischen Gerichtscharakter.
- source_word: נְאֻם
  choice: erklärt
  rationale: נְאֻם kennzeichnet eine feierliche prophetische Gottesrede. „Erklärt“ ist gegenwärtiges, würdiges Deutsch und gibt die Autorität der Formel wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: אֲדֹנָי wird als Titel „der Herr“ wiedergegeben, während יהוה als der offenbarte Gottesname „Jahwe“ erhalten bleibt. So werden die beiden verschiedenen Bestandteile der hebräischen Verbindung sichtbar.
theological_decisions:
- issue: Wiedergabe der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung unterscheidet den Herrschaftstitel אֲדֹנָי vom Gottesnamen יהוה und vermeidet, den Namen durch einen zweiten Titel zu ersetzen. Die traditionelle Alternative ist geläufiger, macht diese Unterscheidung jedoch weniger sichtbar.
- issue: Das Schwert als Gerichtsbild
  choice: konkrete Wiedergabe „das Schwert“
  alternative: Krieg oder gewaltsames Gericht
  rationale: Der Text nennt ausdrücklich das Schwert, lässt aber dessen metonymische Reichweite offen. Die Übersetzung bewahrt deshalb das konkrete Bild, während die Fußnote auf den möglichen weiteren Sinn hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt natürlich, bewahrt aber durch die zweimalige Formulierung „das Schwert“ den Nachdruck des hebräischen Textes. Der Gedankenstrich hebt die feierliche Botenformel ab.
