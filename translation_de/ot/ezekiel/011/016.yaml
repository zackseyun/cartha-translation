    rationale: „Obwohl ich ... gebracht und ... zerstreut habe, bin ich ... gewesen“ verbindet Perfekt und Präteritum. Einheitliche Präteritumformen entsprechen dem erzählenden hebräischen Kontext und lesen sich flüssiger.
