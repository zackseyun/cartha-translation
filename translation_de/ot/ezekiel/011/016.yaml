source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כִּ֤י הִרְחַקְתִּי/ם֙ בַּ/גּוֹיִ֔ם וְ/כִ֥י הֲפִֽיצוֹתִ֖י/ם בָּ/אֲרָצ֑וֹת וָ/אֱהִ֤י לָ/הֶם֙ לְ/מִקְדָּ֣שׁ מְעַ֔ט בָּ/אֲרָצ֖וֹת אֲשֶׁר בָּ֥אוּ שָֽׁם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/016.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: Though I removed them far off among the nations, and though I scattered them among the lands, yet I became for them a little sanctuary in the lands where they had gone.’'
translation:
  language: de
  text: 'Darum sage: So spricht Jahwe, der Herr: Obwohl ich sie weit weg unter die Völker brachte und in die Länder zerstreute, war ich ihnen doch in den Ländern, in die sie gekommen waren, ein kleines Heiligtum[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Heiligtum für kurze Zeit“. Die hebräische Wendung kann entweder ein kleines beziehungsweise begrenztes Heiligtum oder eine zeitlich begrenzte Heiligtumsgegenwart bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und im prophetischen Zusammenhang natürlich wieder.
- source_word: אֱמֹר
  choice: sage
  rationale: Direkter Imperativ an den Propheten; im Deutschen ist „sage“ in dieser Botenformel angemessen.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Eingebürgerte, würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Bewahrt sowohl den Herrschertitel als auch den Gottesnamen, ohne das im Deutschen schwer verständliche „Herr HERR“ zu verwenden.
- source_word: כִּי ... וְכִי
  choice: Obwohl ... und
  rationale: Die beiden Sätze stehen konzessiv zur anschließenden Zusage; im Deutschen kann das zweite „obwohl“ zur Vermeidung unnötiger Schwere ausgespart werden.
- source_word: הִרְחַקְתִּים
  choice: ich sie weit weg ... gebracht
  rationale: Bewahrt die kausative Bedeutung und Gottes ausdrücklich genannte Urheberschaft an der Entfernung.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: Bezeichnet die fremden Völker, unter die Israel verbannt wurde; „Völker“ vermeidet eine neutestamentlich gefärbte Wiedergabe.
- source_word: הֲפִיצוֹתִים
  choice: zerstreut habe
  rationale: Natürliche und traditionsnahe Wiedergabe der Exilsterminologie.
- source_word: בָּאֲרָצוֹת
  choice: in die Länder
  rationale: Bewahrt den Plural und gibt nach dem Verb der Zerstreuung die Zielrichtung idiomatisch wieder.
- source_word: וָאֱהִי לָהֶם
  choice: bin ich ihnen doch ... gewesen
  rationale: Das deutsche Perfekt drückt den vergangenen Vorgang mit fortwirkender Bedeutung natürlich aus; „doch“ macht den konzessiven Gegensatz sichtbar, ohne die hebräische Verbalform als bloßen zeitlosen Zustand zu behandeln.
- source_word: לְמִקְדָּשׁ מְעַט
  choice: für kurze Zeit ein Heiligtum
  rationale: מְעַט kann temporal auf die Dauer bezogen werden. Da ebenso die qualitative Lesart „ein kleines/geringes Heiligtum“ möglich ist, wird diese im Fußnotenapparat bewahrt.
- source_word: בָּאֲרָצוֹת אֲשֶׁר בָּאוּ שָׁם
  choice: in den Ländern, in die sie gekommen sind
  rationale: Gibt Relativsatz und Zielrichtung präzise und in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr Jahwe
  rationale: Die gewählte deutsche Formel unterscheidet Titel und Gottesnamen und bleibt für eine breite Leserschaft verständlich, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Bezug von מְעַט in לְמִקְדָּשׁ מְעַט
  choice: 'temporal: „für kurze Zeit ein Heiligtum“'
  alternative: 'qualitativ beziehungsweise quantitativ: „ein kleines/geringes Heiligtum“'
  rationale: Die hebräische Wortstellung lässt beide Deutungen zu. Der Haupttext wählt die gut mögliche temporale Lesart; die sachlich und theologisch bedeutsame Alternative wird ausdrücklich in einer Fußnote erhalten.
- issue: Gottes Handeln im Exil
  choice: Gott ist Urheber der Entfernung und zugleich Heiligtum für die Vertriebenen
  alternative: Abschwächung der göttlichen Urheberschaft oder rein metaphorische Gegenwart
  rationale: Der hebräische Text hält Gericht und gnädige Gegenwart spannungsvoll zusammen; die Übersetzung bewahrt beides, statt die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter prophetischer Botenformel. Die Satzstruktur bleibt quellennah, wird aber durch deutsche Tempus- und Richtungsformen idiomatisch gestaltet. Der Fußnotenmarker [a] steht unmittelbar nach der mehrdeutigen Wendung.
