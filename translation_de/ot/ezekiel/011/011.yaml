id: EZK.11.11
reference: Ezekiel 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִ֗יא לֹֽא תִהְיֶ֤ה לָ/כֶם֙ לְ/סִ֔יר וְ/אַתֶּ֛ם תִּהְי֥וּ בְ/תוֹכָ֖/הּ לְ/בָשָׂ֑ר אֶל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפֹּ֥ט אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/011.yaml
  text: It will not be for you as a pot[a], and you will not be within it as meat; at the border of Israel I will judge you.
translation:
  language: de
  text: Sie wird für euch kein Kochtopf sein, und ihr werdet nicht als Fleisch in ihr sein. An der Grenze Israels werde ich über euch Gericht halten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִיא
  choice: Sie
  rationale: Das feminine Pronomen bezieht sich im Zusammenhang auf die Stadt Jerusalem; im Deutschen ist »Stadt« ebenfalls feminin, sodass das Pronomen erhalten werden kann.
- source_word: לְסִיר
  choice: als Kochtopf
  rationale: סִיר bezeichnet ein Gefäß zum Kochen. »Kochtopf« macht die im Kontext aufgegriffene Topf-Fleisch-Metapher unmittelbar verständlich.
- source_word: בְתוֹכָהּ
  choice: in ihr
  rationale: Die Wendung bedeutet wörtlich »in ihrer Mitte/in ihr« und bezieht sich auf Jerusalem. »In ihr« wahrt sowohl den Bezug zur Stadt als auch das räumliche Bild.
- source_word: לְבָשָׂר
  choice: als Fleisch
  rationale: בָּשָׂר bedeutet wörtlich »Fleisch« und bezeichnet hier das Fleisch im Kochtopf. Im Deutschen ist »Fleisch« in diesem Bild natürlich und bewahrt die formale Entsprechung ohne erklärenden Zusatz.
- source_word: אֶל גְּבוּל יִשְׂרָאֵל
  choice: An der Grenze Israels
  rationale: אֶל kann eine Bewegung zur Grenze hin ausdrücken, während das Gericht im Zusammenhang dort vollzogen wird. Die deutsche Ortsangabe gibt das kontextuelle Ziel und den Gerichtsort knapp wieder.
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: werde ich über euch Gericht halten
  rationale: שׁפט hat hier eindeutig gerichtlichen Sinn. Die Formulierung ist im modernen Deutsch klar und würdevoll und vermeidet die mögliche Mehrdeutigkeit von »euch richten«.
theological_decisions:
- issue: Das sprichwörtliche Bild von Jerusalem als schützendem Kochtopf
  choice: Die Kochtopf-Fleisch-Metapher ohne interpretierende Erweiterung beibehalten
  alternative: Den Sinn als »Jerusalem wird euch nicht schützen« umschreiben
  rationale: Der Vers kehrt das frühere Wort der führenden Männer um. Die unveränderte Bildsprache erhält die prophetische Rhetorik und legt keine weitergehende Deutung in den Text hinein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung bleibt nah am hebräischen Kontrast; »Kochtopf« verdeutlicht das konkrete Kochbild, und »Gericht halten« gibt den forensischen Sinn idiomatisch wieder.
