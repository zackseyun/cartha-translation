  text: וַֽ/יְהִי֙ כְּ/הִנָּ֣בְאִ֔/י וּ/פְלַטְיָ֥הוּ בֶן בְּנָיָ֖ה מֵ֑ת וָ/אֶפֹּ֨ל עַל פָּנַ֜/י וָ/אֶזְעַ֣ק קוֹל גָּד֗וֹל וָ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כָּלָה֙ אַתָּ֣ה עֹשֶׂ֔ה אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
translation:
  language: de
  text: 'Und während ich weissagte, geschah es, dass Pelatja, der Sohn Benajas, starb. Da warf ich mich auf mein Gesicht, schrie laut auf und sagte: »Ach, Herr Yahweh[a], willst du den Überrest Israels völlig vernichten[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Herr JHWH“ (אֲדֹנָי יְהוִה). JHWH wird hier als „Yahweh“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Vernichtest du den Überrest Israels völlig?“ Das Hebräische kann gegenwärtig oder auf das unmittelbar Bevorstehende bezogen verstanden werden und enthält keine ausdrückliche Fragepartikel.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כְּהִנָּבְאִי
  choice: Und während ich prophetisch redete, geschah es
  rationale: Die Konstruktion mit כְּ und Infinitiv bezeichnet den zeitlichen Rahmen eines eintretenden Ereignisses. „Während ich prophetisch redete“ gibt die andauernde Handlung natürlich wieder; „geschah es“ bewahrt die erzählerische Funktion von וַיְהִי.
- source_word: וּפְלַטְיָהוּ בֶן־בְּנָיָה מֵת
  choice: dass Pelatja, der Sohn Benajas, starb
  rationale: מֵת berichtet schlicht den Eintritt des Todes. Die Eigennamen folgen ihrer geläufigen deutschen Form.
- source_word: וָאֶפֹּל עַל־פָּנַי
  choice: Da fiel ich auf mein Gesicht
  rationale: Die körperliche Geste des Schreckens, der Trauer oder des Flehens wird nah am hebräischen Bild wiedergegeben.
- source_word: וָאֶזְעַק קוֹל גָּדוֹל
  choice: schrie mit lauter Stimme
  rationale: זעק bezeichnet einen heftigen, oft von Not geprägten Schrei; „mit lauter Stimme“ entspricht קוֹל גָּדוֹל.
- source_word: אֲהָהּ
  choice: Ach
  rationale: Die Interjektion drückt Bestürzung und Klage aus. „Ach“ ist im Deutschen würdig und verständlich, ohne unnötig altertümlich zu wirken.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr HERR
  rationale: Die unterschiedliche Schreibung macht sichtbar, dass der zweite Ausdruck den Gottesnamen JHWH wiedergibt, und vermeidet die missverständliche Doppelung „Herr Herr“.
- source_word: כָּלָה אַתָּה עֹשֶׂה
  choice: willst du … völlig vernichten
  rationale: Die Verbindung von כָּלָה mit עשה bezeichnet ein vollständiges Ende. Die deutsche Frageform gibt den im Kontext naheliegenden flehentlichen Ausruf wieder; „völlig vernichten“ ist natürlicher als die wörtliche Wendung „ein vollständiges Ende machen“.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: den Rest Israels
  rationale: „Rest“ bewahrt den zentralen Begriff für die von Israel Übriggebliebenen und ist im modernen Deutschen natürlicher als „Überrest“.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Herr HERR
  alternative: Herr JHWH; Herr Jahwe
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה, ohne eine unsichere Aussprache des Namens in den Haupttext einzutragen. Eine Fußnote legt die Form offen.
- issue: Aussage- oder Fragecharakter des Schlusses
  choice: willst du den Rest Israels völlig vernichten?
  alternative: Du vernichtest den Rest Israels völlig!; Vernichtest du gerade den Rest Israels völlig?
  rationale: Im Hebräischen fehlt eine ausdrückliche Fragepartikel. Der klagende, an Gott gerichtete Kontext legt eine erschrockene Frage nahe, entscheidet aber nicht eindeutig zwischen gegenwärtigem und unmittelbar bevorstehendem Geschehen. Diese Spannung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt erzählerisch klar; „prophetisch redete“ vermeidet eine unnatürliche Verlaufsform, und „Rest Israels“ bewahrt den theologischen Schlüsselbegriff in allgemein verständlicher Sprache.
