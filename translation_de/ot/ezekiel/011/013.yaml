  verdict: revise
  source_fidelity: Der Entwurf gibt Handlungsablauf, Todesmeldung, Gebärde und den alarmierten Fragesinn insgesamt zutreffend wieder. „willst du ... völlig vernichten?“ ist für כָּלָה ... עֹשֶׂה im Kontext eine gut begründete Wiedergabe; die alternative gegenwärtige bzw. unmittelbar bevorstehende Lesart soll in der Anmerkung erhalten bleiben.
  naturalness: „Auf mein Gesicht fiel ich“ ist verständlich, aber „warf ich mich auf mein Gesicht“ ist im modernen würdevollen Deutsch die natürlichere Wiedergabe der Gebärde. „Schrie laut auf“ ist idiomatischer als „schrie mit lauter Stimme“, ohne die Intensität zu verlieren.
  terminology: Der Schlüsselbegriff שְׁאֵרִית sollte als „Überrest“ erscheinen, da „Rest“ die im Kontext wichtige theologische und lexikalische Resonanz abschwächt. Außerdem steht die im englischen POB-Audit festgehaltene Namenspraxis für יהוה („Yahweh“) im Widerspruch zu „HERR“ im Entwurf; bei אֲדֹנָי יהוה ist daher „Herr Yahweh“ zu verwenden.
