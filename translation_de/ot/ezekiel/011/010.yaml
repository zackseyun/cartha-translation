id: EZK.11.10
reference: Ezekiel 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/חֶ֣רֶב תִּפֹּ֔לוּ עַל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפּ֣וֹט אֶתְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/010.yaml
  text: You will fall by the sword; I will judge you at the border of Israel[a], and you will know that I am Yahweh.
translation:
  language: de
  text: Durch das Schwert werdet ihr fallen. An der Grenze Israels[a] werde ich euch richten, und ihr werdet erkennen, dass ich Yahweh bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Grenze Israels“. Die hebräische Wendung kann einen Ort an oder auf Israels Grenze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Die Präposition ב bezeichnet hier das Mittel. „Durch das Schwert“ ist im Deutschen natürlich und bewahrt das konkrete Bild eines gewaltsamen Todes.
- source_word: תִּפֹּלוּ
  choice: werdet ihr fallen
  rationale: נפל bedeutet wörtlich „fallen“ und bezeichnet hier im Gerichtszusammenhang den Tod. Die bildhafte Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: עַל גְּבוּל יִשְׂרָאֵל
  choice: an der Grenze Israels
  rationale: גְּבוּל kann Grenze, Grenzgebiet oder Gebiet bedeuten. Mit עַל bezeichnet die Wendung hier am ehesten den Ort an beziehungsweise auf Israels Grenze; die Hauptfassung verwendet die natürliche deutsche Formulierung „an der Grenze“.
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: werde ich euch richten
  rationale: שׁפט bedeutet „richten“ beziehungsweise „Gericht halten“. Die direkte Wiedergabe bewahrt sowohl den richterlichen als auch den hier strafenden Sinn.
- source_word: וִידַעְתֶּם
  choice: und ihr werdet erkennen
  rationale: Die Verbform hat im Zusammenhang zukünftige beziehungsweise resultative Bedeutung. „Erkennen“ gibt das in der Ezechiel-Formel gemeinte, durch Gottes Handeln bewirkte Begreifen natürlicher wieder als bloßes „wissen“.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Yahweh“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Erkenntnisformel וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: ihr werdet erkennen, dass ich Yahweh bin
  alternative: ihr werdet wissen, dass ich Yahweh bin
  rationale: „Erkennen“ lässt den durch das vollzogene Gericht herbeigeführten Erkenntnisakt hervortreten, ohne dessen genaue innere oder heilsgeschichtliche Qualität weiter festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und das konkrete Schwert- und Fallbild bleiben nahe am Hebräischen; die mögliche örtliche Nuance von עַל גְּבוּל wird in der Fußnote offengehalten.
