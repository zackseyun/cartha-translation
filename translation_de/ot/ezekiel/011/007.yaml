source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ חַלְלֵי/כֶם֙ אֲשֶׁ֣ר שַׂמְתֶּ֣ם בְּ/תוֹכָ֔/הּ הֵ֥מָּה הַ/בָּשָׂ֖ר וְ/הִ֣יא הַ/סִּ֑יר וְ/אֶתְ/כֶ֖ם הוֹצִ֥יא מִ/תּוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/007.yaml
  text: 'Therefore thus says Lord Yahweh: Your slain whom you have placed in its midst—they are the meat[a], and it is the pot; but you I will bring out from its midst.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Eure Erschlagenen, die ihr in ihre Mitte gelegt habt – sie sind das Fleisch, und sie ist der Topf. Euch aber werde ich aus ihrer Mitte herausführen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יְהוִה wieder und vermeidet die unnatürliche Doppelung „Herr HERR“.
- source_word: חַלְלֵיכֶם
  choice: eure Erschlagenen
  rationale: Das Wort bezeichnet gewaltsam Getötete, nicht lediglich Verstorbene. „Erschlagene“ bewahrt diesen Sinn in würdigem, verständlichem Deutsch.
- source_word: שַׂמְתֶּם
  choice: die ihr … gelegt habt
  rationale: „Legen“ gibt das gewöhnliche Bedeutungsfeld von שׂים wieder und passt zugleich zum Bild vom Fleisch im Kochtopf.
- source_word: בְּתוֹכָהּ / מִתּוֹכָהּ
  choice: in ihre Mitte / aus ihrer Mitte
  rationale: Das feminine Suffix verweist auf die Stadt Jerusalem. Die feminine Form bewahrt diesen Bezug und die räumliche Bildsprache.
- source_word: הֵמָּה הַבָּשָׂר
  choice: sie sind das Fleisch
  rationale: „Fleisch“ kann im Deutschen sowohl Körperfleisch als auch Fleisch als Speise bezeichnen und erhält daher die volle hebräische Mehrdeutigkeit innerhalb des Kochtopf-Bildes.
- source_word: הַסִּיר
  choice: der Topf
  rationale: Die schlichte Bezeichnung ist im heutigen Deutsch natürlich und lässt die bereits im Kontext eingeführte Kochtopf-Metapher unmittelbar erkennen.
- source_word: הוֹצִיא
  choice: werde ich … herausführen
  rationale: Im Zusammenhang der direkten Gottesrede bezeichnet die ungewöhnliche Verbform Yahwehs angekündigtes Handeln. „Herausführen“ gibt den kausativen Sinn von יצא wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Der Eigenname wird ausdrücklich als „Yahweh“ wiedergegeben, während אֲדֹנָי als Titel „der Herr“ erhalten bleibt.
- issue: Bild von Fleisch und Topf
  choice: 'Das Bild wird unverändert beibehalten: Die Erschlagenen sind das Fleisch, Jerusalem ist der Topf.'
  alternative: Eine erklärende Umschreibung des Bildes
  rationale: Der Vers kehrt den Ausspruch der führenden Männer aus dem Kontext gegen sie. Eine direkte Wiedergabe bewahrt die Härte und theologische Spannung dieser Umkehrung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die deutende Gleichsetzung hervor, ohne sie auszuformulieren. „Fleisch“ ist im Deutschen zugleich idiomatisch für den Inhalt eines Kochtopfs und näher an der Bedeutungsbreite des hebräischen בָּשָׂר als das engere „Fleischstück“.
