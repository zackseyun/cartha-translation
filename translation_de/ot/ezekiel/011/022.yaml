  text: וַ/יִּשְׂא֤וּ הַ/כְּרוּבִים֙ אֶת כַּנְפֵי/הֶ֔ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/022.yaml
  text: Then the cherubim lifted up their wings[a], with the wheels beside them[b], and the glory of the God of Israel was above them.
translation:
  language: de
  text: Da erhoben die Kerubim ihre Flügel; die Räder waren neben ihnen[a], und die Herrlichkeit des Gottes Israels war hoch über ihnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und die Räder neben ihnen“. Im Hebräischen fehlt hier ein ausdrückliches Verb.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Hebräisch sinngemäß: „über ihnen, von oben her“; die doppelte räumliche Angabe wird hier mit „hoch über ihnen“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: Da erhoben
  rationale: Das Qal-Wayyiqtol von נשׂא beschreibt hier das Anheben der Flügel. „Erhoben“ ist im Deutschen natürlich und bewahrt die aufwärts gerichtete Bewegung.
- source_word: הַכְּרוּבִים
  choice: die Kerubim
  rationale: „Kerubim“ ist die etablierte deutsche Wiedergabe und bewahrt die hebräische Pluralform.
- source_word: כַּנְפֵיהֶם
  choice: ihre Flügel
  rationale: Direkte Wiedergabe des Substantivs mit dem Suffix der 3. Person Plural.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: die Räder waren neben ihnen
  rationale: Die knappe hebräische Nominalfügung wird als elliptischer Begleitsatz verstanden. „Neben ihnen“ gibt die räumliche Zuordnung im Zusammenhang der gemeinsam bewegten Gestalten und Räder natürlich wieder.
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: und die Herrlichkeit des Gottes Israels
  rationale: „Herrlichkeit“ bewahrt den theologischen und visionären Gehalt von כבוד, ohne ihn durch „Gegenwart“ interpretierend auszuweiten.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: war hoch über ihnen
  rationale: Die deutsche Formulierung gibt die verstärkte räumliche Aussage des Hebräischen idiomatisch wieder, ohne das unnatürliche „über ihnen von oben“ nachzubilden.
theological_decisions:
- issue: Bezeichnung der sichtbaren göttlichen Erscheinung durch כבוד
  choice: die Herrlichkeit des Gottes Israels
  alternative: die herrliche Gegenwart des Gottes Israels
  rationale: „Herrlichkeit“ erhält den etablierten biblischen Begriff und lässt offen, wie das Verhältnis zwischen Gottes Herrlichkeit und seiner Gegenwart näher zu bestimmen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolon-Satz bildet die knappe hebräische Reihung ab, während die ergänzte Kopula die elliptische Nominalfügung verständlich macht.
