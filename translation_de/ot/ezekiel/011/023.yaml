  text: וַ/יַּ֨עַל֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל תּ֣וֹךְ הָ/עִ֑יר וַֽ/יַּעֲמֹד֙ עַל הָ/הָ֔ר אֲשֶׁ֖ר מִ/קֶּ֥דֶם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/023.yaml
  text: And the glory of Yahweh went up from the midst of the city and stood on the mountain that is east of the city[a][b].
translation:
  language: de
  text: Und die Herrlichkeit Jahwes stieg von oberhalb der Stadtmitte[a] auf und stand auf dem Berg, der östlich der Stadt liegt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von über der Mitte der Stadt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der vor der Stadt liegt“; קֶדֶם kann je nach räumlicher Orientierung „Osten“ oder „vorn“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: erhob sich
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „Erhob sich“ passt zur visionären Bewegung der Herrlichkeit und bewahrt den Aspekt des Hinaufsteigens, ohne einen Ausgangspunkt am Boden vorauszusetzen.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Die Wiedergabe bewahrt die hebräische Genitivverbindung und das theologische Gewicht von כבוד als sichtbar erfahrbarer göttlicher Herrlichkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: מֵעַל תּוֹךְ הָעִיר
  choice: aus der Mitte der Stadt
  rationale: Die Verbindung von מֵעַל („von über/oberhalb“) und תּוֹךְ („Mitte“) bezeichnet hier den Ausgangspunkt der Bewegung. Die gewählte Formulierung ist natürlich; die räumlich präzisere Alternative wird in einer Fußnote bewahrt.
- source_word: וַיַּעֲמֹד
  choice: stellte sich
  rationale: עמד kann das Einnehmen einer stehenden Position oder das Anhalten bezeichnen. „Stellte sich“ gibt den Übergang von der Bewegung zum Verweilen am Berg natürlich wieder.
- source_word: עַל הָהָר
  choice: auf den Berg
  rationale: הַר wird hier entsprechend der topografischen Angabe als „Berg“ wiedergegeben. Nach dem zielgerichteten „stellte sich“ ist im Deutschen der Akkusativ idiomatisch.
- source_word: אֲשֶׁר מִקֶּדֶם לָעִיר
  choice: der östlich der Stadt liegt
  rationale: In dieser geografischen Beschreibung bezeichnet מִקֶּדֶם am wahrscheinlichsten eine Lage östlich der Stadt. Die mögliche orientierungsabhängige Bedeutung „vor“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn, anstatt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Räumlicher Ausgangspunkt der Herrlichkeit
  choice: aus der Mitte der Stadt
  alternative: von oberhalb der Mitte der Stadt
  rationale: Die Hauptfassung ist im Deutschen flüssiger, während die Alternative die Präposition מֵעַל räumlich genauer ausdrückt. Da die Vision eine über der Stadt befindliche Herrlichkeit zulässt, wird diese Nuance nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählbewegung. „Herrlichkeit“ hält den biblisch-theologischen Schlüsselbegriff fest; „Jahwe“ gibt den Gottesnamen direkt wieder. Die Fußnoten bewahren die echten räumlichen und lexikalischen Alternativen des Hebräischen.
