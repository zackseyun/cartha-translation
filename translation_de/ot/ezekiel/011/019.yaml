  text: וְ/נָתַתִּ֤י לָ/הֶם֙ לֵ֣ב אֶחָ֔ד וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשָׂרָ֔/ם וְ/נָתַתִּ֥י לָ/הֶ֖ם לֵ֥ב בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/019.yaml
  text: And I will give them one heart[a], and I will put a new spirit within them[b]. I will remove the heart of stone from their flesh and give them a heart of flesh.
translation:
  language: de
  text: Und ich werde ihnen ein Herz geben[b] und einen neuen Geist in ihr Inneres legen[a]. Ich werde das Herz aus Stein aus ihrem Fleisch entfernen und ihnen ein Herz aus Fleisch geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte hebräische Form kann formal auch »in euer Inneres« gelesen werden. Im Zusammenhang sprechen die übrigen Pronomen der dritten Person und die nahe Parallele in Hesekiel 36,26 für »in ihr Inneres«.
    reason: textual_variant
  - marker: b
    text: »Ein Herz« kann auch im Sinn eines »ungeteilten Herzens« verstanden werden, also einer ungeteilten Ausrichtung.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב אֶחָד
  choice: ein Herz
  rationale: Die direkte Wiedergabe bewahrt das hebräische Bild. לֵב bezeichnet hier den inneren Menschen mit Denken, Wollen und Gesinnung; אֶחָד kann zugleich auf eine ungeteilte Ausrichtung hinweisen.
- source_word: רוּחַ חֲדָשָׁה
  choice: einen neuen Geist
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. Im Zusammenhang innerer Erneuerung passt »Geist« am besten und bleibt weniger auslegend als »Gesinnung«.
- source_word: בְּקִרְבְּכֶם
  choice: in ihr Inneres
  rationale: Die überlieferte Form hat formal ein Suffix der zweiten Person Plural (»in euer Inneres«). Der Zusammenhang mit den übrigen Pronomen der dritten Person sowie Hesekiel 36,26 stützt hier jedoch »in ihr Inneres«; die formale Lesart wird in der Fußnote dokumentiert.
- source_word: וַהֲסִרֹתִי
  choice: ich werde … entfernen
  rationale: Die Hifil-Form bezeichnet das Veranlassen des Weggehens beziehungsweise das Entfernen und wird im modernen Deutsch natürlich wiedergegeben.
- source_word: לֵב הָאֶבֶן
  choice: das Herz aus Stein
  rationale: Die konkrete Metapher bleibt erhalten. »Herz aus Stein« ist im Deutschen natürlicher als »Herz des Steins« und bildet einen klaren Gegensatz zu »Herz aus Fleisch«.
- source_word: מִבְּשָׂרָם
  choice: aus ihrem Fleisch
  rationale: בָּשָׂר wird als »Fleisch« wiedergegeben, damit das körperlich-konkrete Bild und die Wiederaufnahme im folgenden Ausdruck erhalten bleiben.
- source_word: לֵב בָּשָׂר
  choice: ein Herz aus Fleisch
  rationale: Die wörtliche Bildsprache bewahrt den Gegensatz von Stein und lebendigem Fleisch, ohne ihn vorschnell als »weich«, »empfänglich« oder »gehorsam« auszulegen.
theological_decisions:
- issue: Anthropologische Metapher der inneren Erneuerung
  choice: »Herz« und »Geist« bleiben als verschiedene, aber aufeinander bezogene Begriffe stehen.
  alternative: Beide Begriffe psychologisch als »Denken« und »Einstellung« umschreiben.
  rationale: Die Unterscheidung erhält die theologischen und anthropologischen Kategorien des hebräischen Textes, ohne ihr Verhältnis zu systematisieren.
- issue: Metapher vom »Herz aus Fleisch«
  choice: Die Metapher wird wörtlich beibehalten.
  alternative: »ein weiches Herz«, »ein empfindsames Herz« oder »ein empfängliches Herz«
  rationale: Der Text selbst entfaltet den Gegensatz zwischen Stein und Fleisch. Eine erklärende Wiedergabe würde die offene Bildwirkung auf nur eine Bedeutung festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die konkreten Metaphern des Hebräischen werden bewahrt; zugleich wird mit »in ihr Inneres legen« eine natürliche deutsche Wortstellung gewählt.
