lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Waw-Folge mit היה eröffnet hier den nächsten prophetischen Redeabschnitt. Im Deutschen gibt „Da kam“ die zeitliche Fortführung und die feste Offenbarungsformel natürlich wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: Im Status-constructus-Ausdruck דְבַר יְהוָה bezeichnet „Wort“ die prophetische Mitteilung und bewahrt die wiederkehrende biblische Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit Suffix der ersten Person Singular bezeichnet die Richtung der Mitteilung zum Propheten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende direkte Rede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehovah
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; eine Fußnote nennt die traditionelle deutsche Wiedergabe, ohne sie in den Haupttext einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Formel bleibt erkennbar; der Doppelpunkt gibt לֵאמֹר idiomatisch wieder und vermeidet eine im Deutschen schwerfällige Partizipialformel.
