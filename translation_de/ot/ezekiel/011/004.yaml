lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Vorwurf und klingt im modernen Deutschen natürlich und würdig.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Der Imperativ von נבא fordert Ezechiel zum prophetischen Reden auf; „weissage“ ist die direkte, etablierte Wiedergabe.
- source_word: עֲלֵיהֶם
  choice: gegen sie
  rationale: עַל kann bei נבא sowohl „über sie“ als auch „gegen sie“ bedeuten. Im Zusammenhang von Zurechtweisung und Gericht ist die adversative Wiedergabe am wahrscheinlichsten.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Die Wiederholung wird beibehalten, um Nachdruck und Dringlichkeit des hebräischen Wortlauts zu bewahren.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die traditionelle und quellennah gebildete Anrede ist für Ezechiel charakteristisch und bewahrt die Wiedererkennbarkeit des Ausdrucks.
theological_decisions:
- issue: Wiedergabe der wiederkehrenden Anrede בֶּן אָדָם bei Ezechiel
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: „Menschensohn“ bewahrt Form und innerbiblische Bezüge, ohne die Wendung deutend auf ihre Funktion als Hinweis auf Ezechiels menschliche und sterbliche Stellung zu reduzieren. Verständlichere Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit würdigem prophetischem Ton. Die auffällige Wiederholung des Imperativs bleibt als Ausdruck des Nachdrucks erhalten.
