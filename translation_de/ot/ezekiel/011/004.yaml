  text: Therefore prophesy against them[a]; prophesy[b], son of man.
translation:
  language: de
  text: Darum prophezeie gegen sie[a], prophezeie, Menschensohn[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über sie“. Die hebräische Präposition kann weiter gefasst sein; im Zusammenhang von Zurechtweisung und Gericht passt „gegen sie“ am besten.'
    reason: lexical_alternative
  - marker: b
    text: '„Menschensohn“ ist die bei Ezechiel immer wiederkehrende Anrede; auch möglich: „Menschenkind“ oder „Sterblicher“.'
