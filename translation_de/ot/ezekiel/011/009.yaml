source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִ/תּוֹכָ֔/הּ וְ/נָתַתִּ֥י אֶתְ/כֶ֖ם בְּ/יַד זָרִ֑ים וְ/עָשִׂ֛יתִי בָ/כֶ֖ם שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/009.yaml
  text: And I will bring you out from its midst[a], and I will give you into the hand of foreigners[b], and I will execute judgments on you.
translation:
  language: de
  text: Und ich werde euch aus ihrer Mitte herausführen und euch in die Hand von Fremden geben und an euch Strafgerichte vollziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Und ich werde ... herausführen
  rationale: 'Der Hifil von יצא hat kausative Bedeutung: »hinausgehen lassen, herausführen«. »Herausführen« gibt diese Kraft natürlich und würdig wieder.'
- source_word: מִתּוֹכָהּ
  choice: aus ihrer Mitte
  rationale: תּוֹךְ bezeichnet das Innere bzw. die Mitte. Das feminine Suffix verweist im Zusammenhang auf die Stadt Jerusalem; das Pronomen bewahrt diesen Rückbezug, ohne den Namen ergänzend einzufügen.
- source_word: וְנָתַתִּי אֶתְכֶם בְּיַד
  choice: und euch in die Hand ... geben
  rationale: נתן mit בְּיַד ist eine feste Wendung für die Übergabe in die Gewalt eines anderen. Die deutsche Formulierung bewahrt sowohl das Bild als auch den Sinn.
- source_word: זָרִים
  choice: Fremden
  rationale: זָרִים bezeichnet hier ausländische bzw. nicht zum eigenen Volk gehörende Menschen, im Kontext fremde Eroberer. »Fremde« ist idiomatisch und lässt die im Hebräischen vorhandene allgemeine Bezeichnung bestehen.
- source_word: וְעָשִׂיתִי בָכֶם שְׁפָטִים
  choice: und an euch Strafgerichte vollziehen
  rationale: עשה mit ב und שְׁפָטִים bezeichnet die Ausführung gerichtlicher, hier strafender Urteile. »Strafgerichte vollziehen« macht den pluralischen und gerichtlichen Charakter deutlich, ohne die Aussage zu verflachen.
theological_decisions:
- issue: Bezug des femininen Suffixes in מִתּוֹכָהּ
  choice: Der Rückbezug auf Jerusalem bzw. die Stadt bleibt mit »ihrer« pronominal erhalten.
  alternative: »aus der Mitte der Stadt«
  rationale: Der Kontext identifiziert die Bezugsgröße als Jerusalem. Da der Vers selbst nur ein Suffix enthält, vermeidet die pronominale Wiedergabe eine erklärende Ergänzung im Haupttext.
- issue: Charakter der שְׁפָטִים
  choice: »Strafgerichte« kennzeichnet die angekündigten Gerichtsakte als strafend.
  alternative: »Gerichte« oder »Urteile«
  rationale: Im Kontext handelt es sich nicht bloß um richterliche Entscheidungen, sondern um deren vollstreckende Anwendung an den Angeredeten. Die Übersetzung wahrt den Plural und die theologische Spannung göttlichen Gerichtshandelns.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem prophetischem Register. Die dreifache Zukunftsankündigung wird durch die koordinierte Satzstruktur erhalten; die hebräische Hand-Metapher bleibt bewusst stehen.
