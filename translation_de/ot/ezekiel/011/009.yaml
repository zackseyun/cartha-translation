  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die drei hebräischen Zukunftsaussagen sachgerecht wieder: Hifil von יצא mit „herausführen“, die feminine Rückverweisung von מִתּוֹכָהּ mit „ihrer“, die Übergabeformel נתן בְּיַד als „in die Hand ... geben“ und die gerichtliche Wendung עשה בְּ ... שְׁפָטִים als Vollzug von Strafgerichten an den Angeredeten. Der Plural von שְׁפָטִים bleibt erhalten.'
  naturalness: „Und ich werde euch aus ihrer Mitte herausführen und euch in die Hand von Fremden geben und an euch Strafgerichte vollziehen“ ist verständliches modernes Standarddeutsch und bewahrt einen angemessen würdigen prophetischen Registerton. Die Reihung der drei Ankündigungen ist im Deutschen flüssig.
  terminology: „Fremden“ trifft זָרִים im Kontext fremder Eroberer, ohne unnötig zu konkretisieren. „Strafgerichte“ vermittelt den vollstreckenden, gegen die Angeredeten gerichteten Charakter von שְׁפָטִים; die Formulierung ist weder konfessionell eingeengt noch überinterpretierend.
