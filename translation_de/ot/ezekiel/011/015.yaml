  text: בֶּן אָדָ֗ם אַחֶ֤י/ךָ אַחֶ֨י/ךָ֙ אַנְשֵׁ֣י גְאֻלָּתֶ֔/ךָ וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה אֲשֶׁר֩ אָמְר֨וּ לָ/הֶ֜ם יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם רַֽחֲקוּ֙ מֵ/עַ֣ל יְהוָ֔ה לָ֥/נוּ הִ֛יא נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/015.yaml
  text: Son of man[a], your brothers, your brothers, the men of your redemption, and all the house of Israel, all of it—these are the ones to whom the inhabitants of Jerusalem have said, ‘Go far away from Yahweh[b]; this land has been given to us as a possession.’
translation:
  language: de
  text: 'Menschensohn, deine Brüder, deine Brüder, deine Verwandten mit Lösungsrecht[a] und das ganze Haus Israel, sie alle – zu ihnen haben die Bewohner Jerusalems gesagt: »Bleibt fern von Jahwe! Uns ist das Land zum Besitz[b] gegeben worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist schwierig. Sie kann Verwandte im Rahmen des familiären Lösungs- oder Einlösungsrechts meinen; möglich sind auch die Wiedergaben »deine Verwandten« oder, kontextbezogen, »deine Mitverbannten«. Das verwendete Wort gehört zur Wortfamilie des Lösers, der innerhalb der Sippe Schutz- und Einlösungsaufgaben wahrnimmt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zum Erbbesitz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel typische Anredeformel und ihre etablierte biblische Prägung.
- source_word: אַחֶיךָ אַחֶיךָ
  choice: deine Brüder, deine Brüder
  rationale: Die auffällige Wiederholung des Hebräischen bleibt als emphatische Formulierung erhalten.
- source_word: אַנְשֵׁי גְאֻלָּתֶךָ
  choice: die Männer deines Lösungsrechts
  rationale: Die schwierige Wendung wird bewusst nicht auf »Mitverbannte« eingeengt. »Lösungsrecht« hält den Bezug zur familiären Einlösung beziehungsweise zum Löserrecht sichtbar, bleibt jedoch erklärungsbedürftig und erhält deshalb eine Fußnote.
- source_word: וְכָל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: und das ganze Haus Israel, sie alle
  rationale: Bewahrt sowohl die traditionelle Kollektivbezeichnung »Haus Israel« als auch die nachdrückliche Gesamtaussage von כֻּלֹּה.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Bewohner Jerusalems
  rationale: Natürliche deutsche Wiedergabe der substantivierten Partizipialform.
- source_word: רַחֲקוּ מֵעַל יְהוָה
  choice: Bleibt fern von Jahwe
  rationale: Die Pluralform wird als Imperativ innerhalb der direkten Rede verstanden. »Bleibt fern« gibt die Aufforderung idiomatisch wieder, ohne eine Bewegung stärker zu betonen als nötig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen unmittelbar wieder.
- source_word: לָנוּ הִיא נִתְּנָה הָאָרֶץ לְמוֹרָשָׁה
  choice: Uns ist das Land zum Besitz gegeben worden
  rationale: Die emphatische Voranstellung von »uns« und die passive Aussage bleiben erhalten; מוֹרָשָׁה bezeichnet einen bleibenden Besitz und kann zugleich den Gedanken des Erbbesitzes tragen.
theological_decisions:
- issue: Bezug von אַנְשֵׁי גְאֻלָּתֶךָ
  choice: die Männer deines Lösungsrechts
  alternative: deine Verwandten; deine Mitverbannten; deine lösungsberechtigten Verwandten
  rationale: Der hebräische Ausdruck ist ungewöhnlich und verbindet die Personengruppe mit der Wortwurzel für familiäre Einlösung beziehungsweise den Löser. Die Übersetzung wahrt diese Spannung, statt sie eindeutig auf Exilgemeinschaft oder bloße Verwandtschaft festzulegen.
- issue: Sprechakt von רַחֲקוּ
  choice: 'Imperativ: »Bleibt fern von Jahwe!«'
  alternative: 'Aussage: »Sie sind fern von Jahwe«'
  rationale: Die Form lässt sich am unmittelbarsten als pluralischer Imperativ in der zitierten Äußerung der Jerusalemer verstehen; die alternative Deutung wird vom Kontext weniger nahegelegt.
- issue: Bedeutung von מוֹרָשָׁה
  choice: Besitz
  alternative: Erbbesitz
  rationale: »Besitz« gibt den unmittelbaren Anspruch der Jerusalemer wieder, während die Fußnote die mögliche erbrechtlich-bundestheologische Färbung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung und die kollektive Bezeichnung »Haus Israel« bleiben erhalten. Die schwer verständliche Löser-Terminologie wird im Haupttext formal sichtbar gemacht und in der Fußnote erläutert.
