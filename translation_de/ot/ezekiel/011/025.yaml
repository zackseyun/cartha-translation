  text: וָ/אֲדַבֵּ֖ר אֶל הַ/גּוֹלָ֑ה אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֥ר הֶרְאָֽ/נִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/025.yaml
  text: Then I spoke to the exiles all the words of Yahweh that he had shown me[a].
translation:
  language: de
  text: Dann teilte ich den Verbannten alle Worte Jahwes mit, die er mir gezeigt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „der Verbannung“ beziehungsweise „die Exilsgemeinschaft“; der Singular bezeichnet kollektiv die Gemeinschaft der Verbannten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: Dann teilte ich … mit
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann“ gibt die zeitliche Abfolge natürlich wieder; das trennbare Verb „mitteilen“ passt im Deutschen zur Übermittlung einer empfangenen Offenbarung.
- source_word: אֶל הַגּוֹלָה
  choice: den Verbannten
  rationale: הַגּוֹלָה bezeichnet hier kollektiv die Gemeinschaft der Deportierten. Der deutsche Plural ist verständlich und idiomatisch; der hebräische Ausdruck steht formal im Singular.
- source_word: אֵת כָּל דִּבְרֵי
  choice: alle Worte
  rationale: Die relativ formnahe Wiedergabe bewahrt den sprachlich-offenbarenden Charakter von דְּבָרִים, statt ihn zu „alles“ zu verallgemeinern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: אֲשֶׁר הֶרְאַנִי
  choice: die er mir gezeigt hatte
  rationale: Der Hifil von ראה bedeutet hier „zeigen“ beziehungsweise „sehen lassen“. Das Plusquamperfekt verdeutlicht natürlich, dass die Schau der Mitteilung an die Verbannten vorausging.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen „Worten“ und visionärer Offenbarung
  choice: „Worte … die er mir gezeigt hatte“ beibehalten
  alternative: „alles, was er mir gezeigt hatte“
  rationale: Die ungewöhnliche Verbindung von gesprochenen „Worten“ mit dem Verb „zeigen“ steht bereits im Hebräischen. Sie wird nicht geglättet, damit die Spannung zwischen Botschaft und Vision erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mitteilte“ ist im Kontext natürlicher als das missverständliche „sprach zu“, während „alle Worte“ die Form des hebräischen Ausdrucks bewahrt.
