  text: לְמַ֨עַן֙ בְּ/חֻקֹּתַ֣/י יֵלֵ֔כוּ וְ/אֶת מִשְׁפָּטַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֣וּ אֹתָ֑/ם וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/020.yaml
  text: so that they may walk in my statutes and keep my judgments and do them[a], and they will be my people, and I will be their God.
translation:
  language: de
  text: damit sie nach meinen Satzungen leben, meine Rechtsbestimmungen[a] beachten und sie befolgen, und sie werden mein Volk sein, und ich werde ihr Gott sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Rechtsordnungen“. Das hebräische Wort מִשְׁפָּטִים kann im Bundeszusammenhang rechtliche Entscheidungen oder verbindliche Ordnungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise mögliche Folgebedeutung der Konjunktion knapp und natürlich wieder.
- source_word: בְּחֻקֹּתַי יֵלֵכוּ
  choice: sie nach meinen Satzungen leben
  rationale: Das hebräische Bild des Gehens bezeichnet hier die Lebensführung. Die natürliche deutsche Wendung bewahrt den Sinn und gibt בְּ als Orientierung an den Satzungen wieder.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet im Bundes- und Rechtszusammenhang verbindliche rechtliche Regelungen oder Entscheidungen. „Rechtsbestimmungen“ ist im modernen Deutsch klarer als das missverständliche „Gerichte“.
- source_word: יִשְׁמְרוּ
  choice: beachten
  rationale: שׁמר bezeichnet bei Geboten und Rechtsbestimmungen deren sorgfältige Einhaltung; „beachten“ ist hier natürlich und präzise.
- source_word: וְעָשׂוּ אֹתָם
  choice: und sie befolgen
  rationale: Bewahrt den ausdrücklichen Zusatz des praktischen Tuns, ohne die im Deutschen schwerfällige Formulierung „sie tun“ zu verwenden.
- source_word: וְהָיוּ לִי לְעָם
  choice: Dann werden sie mein Volk sein
  rationale: Gibt die traditionelle Bundesformel in verständlichem, modernem Deutsch wieder. „Dann“ macht den aus dem Zweckzusammenhang hervorgehenden Anschluss deutlich, ohne eine zusätzliche Bedingung einzuführen.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: und ich werde ihr Gott sein
  rationale: Natürliche Wiedergabe der wechselseitigen Bundesformel; אֱלֹהִים ist hier singularisch auf den Gott Israels bezogen.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: „sie werden mein Volk sein, und ich werde ihr Gott sein“
  alternative: „sie sollen mein Volk sein, und ich will ihr Gott sein“
  rationale: Die gewählte Fassung wahrt die gegenseitige Bundesbeziehung und den Zukunftscharakter, ohne durch „sollen“ eine Verpflichtung oder durch „will“ vor allem Absicht auszudrücken.
- issue: Verhältnis von Zweck und Folge
  choice: „damit … Dann werden …“
  alternative: „sodass … und sie werden …“
  rationale: לְמַעַן führt den Zweck beziehungsweise die beabsichtigte Folge der vorangehenden göttlichen Erneuerung ein. Die Fassung lässt diese Spannung bestehen und deutet die Bundesformel nicht als menschlich verdiente Gegenleistung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Lebensführungsbedeutung von „gehen“ wird mit „leben“ wiedergegeben; die parallelen Verben „beachten“ und „befolgen“ erhalten den Nachdruck auf sorgfältiger und praktischer Treue.
