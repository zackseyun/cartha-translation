id: EZK.11.18
reference: Ezekiel 11:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָ֖אוּ שָׁ֑מָּ/ה וְ/הֵסִ֜ירוּ אֶת כָּל שִׁקּוּצֶ֛י/הָ וְ/אֶת כָּל תּוֹעֲבוֹתֶ֖י/הָ מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/018.yaml
  text: They will come there and remove from it all its detestable things and all its abominations[a].
translation:
  language: de
  text: Sie werden dorthin kommen und daraus alle ihre abscheulichen Dinge[a] und alle ihre Gräuel entfernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Götzen«; das hebräische Wort bezeichnet häufig abscheuliche Gegenstände des Götzendienstes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: Sie werden kommen
  rationale: Das Qal-Perfekt mit וּ steht im prophetischen Zusammenhang in futurisch-resultativem Sinn und setzt die angekündigte Rückkehr aus Vers 17 fort.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Der Richtungsadverb bezeichnet das Ziel einer Bewegung; nach »kommen« gibt »dorthin« diese Nuance im Deutschen natürlich wieder.
- source_word: וְהֵסִירוּ
  choice: und … entfernen
  rationale: Das Hifil von סור bedeutet hier, etwas wegzuschaffen oder zu beseitigen. »Entfernen« bewahrt den kausativen Sinn.
- source_word: אֶת כָּל שִׁקּוּצֶיהָ
  choice: alle ihre abscheulichen Dinge
  rationale: שִׁקּוּץ bezeichnet etwas Abscheuliches, häufig einen Götzen oder einen Gegenstand des Götzendienstes. Die allgemeinere Wiedergabe vermeidet eine nicht zwingende Verengung.
- source_word: וְאֶת כָּל תּוֹעֲבוֹתֶיהָ
  choice: und alle ihre Gräuel
  rationale: תּוֹעֵבָה ist ein stark wertender Begriff für etwas religiös oder sittlich Verabscheuungswürdiges. »Gräuel« erhält sein theologisches Gewicht und unterscheidet ihn vom vorherigen Ausdruck.
- source_word: מִמֶּנָּה
  choice: daraus
  rationale: Die Präposition mit femininem Suffix verweist auf den zuvor gemeinten Ort beziehungsweise das Land; »daraus … entfernen« ist im Deutschen natürlich und wahrt den Rückbezug.
theological_decisions:
- issue: Ob שִׁקּוּצִים ausdrücklich als Götzen bezeichnet werden soll
  choice: Im Haupttext steht die allgemeinere Formulierung »abscheuliche Dinge«.
  alternative: »Götzen« oder »abscheuliche Götzen«
  rationale: Der Zusammenhang legt Götzen und Gegenstände des Götzendienstes nahe, doch das hebräische Wort ist nicht darauf beschränkt. Die Übersetzung bewahrt diese Bedeutungsbreite; die kontextuell naheliegende Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen, stark wertenden Begriffe שִׁקּוּץ und תּוֹעֵבָה werden mit »abscheuliche Dinge« und »Gräuel« unterschieden; der feminine Rückbezug wird durch »ihre« und »daraus« natürlich wiedergegeben.
