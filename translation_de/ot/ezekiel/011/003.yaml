  text: who say[a], ‘It is not near to build houses. This city is the pot[b], and we are the meat.’
translation:
  language: de
  text: 'die sagen: »Der Bau von Häusern steht nicht unmittelbar bevor[a]. Diese Stadt ist der Topf, und wir sind das Fleisch[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „Nicht in der Nähe/nahe, Häuser zu bauen.“ Das Hebräische ist elliptisch; möglich ist auch: „Es ist nicht bald Zeit, Häuser zu bauen“ oder „Der Häuserbau ist nicht nahe.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet „Fleisch“; gemeint ist hier Fleisch im Bild eines Kochtopfs.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: die sagen
  rationale: Das substantivierte Partizip nimmt die zuvor genannten Männer wieder auf; der Relativsatz ist im Deutschen natürlich und bewahrt ihre fortdauernde Charakterisierung.
- source_word: לֹא בְקָרוֹב
  choice: steht nicht unmittelbar bevor
  rationale: Die knappe, elliptische Wendung verneint zeitliche Nähe. Diese Formulierung ist verständliches Deutsch, ohne ein im Hebräischen nicht ausdrücklich genanntes Substantiv wie „Zeit“ in den Haupttext einzufügen.
- source_word: בְּנוֹת בָּתִּים
  choice: Häuser zu bauen
  rationale: Der Infinitivus constructus mit Objekt wird direkt wiedergegeben; ein reflexives „für uns“ ist im Hebräischen nicht ausgedrückt.
- source_word: הִיא הַסִּיר
  choice: Diese Stadt ist der Topf
  rationale: Das feminine Pronomen verweist im Zusammenhang auf Jerusalem. „Diese Stadt“ macht den Bezug im Deutschen klar, während „Topf“ das Bild schlicht und direkt erhält.
- source_word: וַאֲנַחְנוּ הַבָּשָׂר
  choice: und wir sind das Fleisch
  rationale: „Fleisch“ entspricht בָּשָׂר unmittelbar und ist auch innerhalb des Kochtopf-Bildes im Deutschen verständlich.
theological_decisions:
- issue: Deutung des Sprichworts vom Topf und vom Fleisch
  choice: Das Bild bleibt ohne deutende Auflösung stehen.
  alternative: Es ausdrücklich als Vertrauen auf den Schutz Jerusalems oder als zynische Zurückweisung der prophetischen Warnung zu kennzeichnen.
  rationale: Der Satz lässt die genaue Stoßrichtung des Sprichworts offen; die Übersetzung soll diese Spannung bewahren und keine Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Aussage bleibt entsprechend dem Hebräischen knapp und in ihrer zeitlichen Aussage mehrdeutig; das Topf-Fleisch-Bild wird weder geglättet noch theologisch ausgedeutet.
