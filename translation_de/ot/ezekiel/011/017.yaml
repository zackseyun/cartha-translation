reference: Ezekiel 11:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ וְ/קִבַּצְתִּ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/אָסַפְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצוֹתֶ֖ם בָּ/הֶ֑ם וְ/נָתַתִּ֥י לָ/כֶ֖ם אֶת אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/017.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: I will gather you from the peoples and assemble you from the lands where you have been scattered[b], and I will give you the land of Israel.’'
translation:
  language: de
  text: 'Darum sage: »So spricht der Herr Yahweh[a]: Ich werde euch aus den Völkern[b] zusammenholen und euch aus den Ländern sammeln, in denen ihr zerstreut worden seid, und euch das Land Israel geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »der Herr Yahweh«; traditionell auch: »Gott, der Herr«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »den Nationen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den Schluss aus dem vorausgehenden Gotteswort und klingt im modernen Deutschen natürlicher als das ebenfalls mögliche »Daher«.
- source_word: אֱמֹר
  choice: sage
  rationale: Gibt den Imperativ an den Propheten schlicht und unmittelbar wieder.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feierliche und im Deutschen vertraute prophetische Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl אֲדֹנָי (»Herr«) als auch den Gottesnamen יהוה (»Yahweh«) wieder, ohne beide Elemente miteinander zu verschmelzen.
- source_word: וְקִבַּצְתִּי
  choice: Ich werde ... zusammenholen
  rationale: Bezeichnet das erneute Zusammenbringen der Zerstreuten; »zusammenholen« ist natürlich und unterscheidet sich stilistisch vom folgenden nahezu synonymen Verb.
- source_word: הָעַמִּים
  choice: den Völkern
  rationale: Entspricht dem Plural von עַם; »Nationen« bleibt als mögliche kontextuelle Wiedergabe in der Fußnote erhalten.
- source_word: וְאָסַפְתִּי
  choice: und ... sammeln
  rationale: Gibt אָסַף als Sammeln der Zerstreuten wieder und bewahrt den synonymen Parallelismus mit קבץ.
- source_word: הָאֲרָצוֹת
  choice: den Ländern
  rationale: Bezeichnet hier die verschiedenen Gebiete der Zerstreuung.
- source_word: אֲשֶׁר נְפֹצוֹתֶם בָּהֶם
  choice: in denen ihr zerstreut worden seid
  rationale: Bewahrt den passiven Sinn und bezieht das Relativpronomen eindeutig auf die Länder.
- source_word: וְנָתַתִּי לָכֶם
  choice: und euch ... geben
  rationale: Direkte und idiomatische Wiedergabe der Zusage mit נתן.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: das Land Israel
  rationale: אַדְמָה kann Boden oder Land bedeuten; im Zusammenhang der Rückkehr aus der Zerstreuung steht das Gebiet Israels im Vordergrund.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der Herr
  rationale: Die gewählte Form macht sowohl den Herrentitel als auch den im hebräischen Text ausdrücklich stehenden Gottesnamen sichtbar. Die geläufigere deutsche Ersatzform wird als Alternative vermerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die beiden nahezu synonymen Sammelverben werden durch »zusammenholen« und »sammeln« unterschieden, ohne einen stärkeren Bedeutungsunterschied zu behaupten.
