  text: וְ/ר֣וּחַ נְשָׂאַ֗תְ/נִי וַ/תְּבִיאֵ֤/נִי כַשְׂדִּ֨ימָ/ה֙ אֶל הַ/גּוֹלָ֔ה בַּ/מַּרְאֶ֖ה בְּ/ר֣וּחַ אֱלֹהִ֑ים וַ/יַּ֨עַל֙ מֵֽ/עָלַ֔/י הַ/מַּרְאֶ֖ה אֲשֶׁ֥ר רָאִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/024.yaml
  text: Then the Spirit lifted me up and brought me to the exiles in Chaldea[a], in the vision by the Spirit of God[d][c][b]; and the vision that I had seen went up from me.
translation:
  language: de
  text: Dann hob mich der Geist empor und brachte mich zu den Verschleppten[a] nach Chaldäa, in der Vision durch den Geist Gottes[b]. Und die Vision, die ich gesehen hatte, stieg von mir auf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu der Exilsgemeinschaft“. Das hebräische Wort kann kollektiv die Gemeinschaft der Verschleppten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Geist Gottes“. Die hebräische Präposition kann sowohl das Mittel („durch“) als auch den Bereich („in“) ausdrücken.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „wich von mir“. Wörtlich: „stieg von über mir empor“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְר֣וּחַ
  choice: Dann ... der Geist
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. Im Zusammenhang der visionären Entrückung und wegen der anschließenden Wendung „Geist Gottes“ ist „Geist“ am naheliegendsten; וְ wird als erzählerische Weiterführung mit „Dann“ wiedergegeben.
- source_word: נְשָׂאַ֗תְנִי
  choice: hob mich empor
  rationale: נשא bezeichnet hier das Aufheben bzw. Tragen. „Hob mich empor“ bewahrt das konkrete vertikale Bild und klingt im Deutschen natürlich und würdig.
- source_word: וַתְּבִיאֵנִי
  choice: brachte mich
  rationale: Das Hifil von בוא bedeutet „kommen lassen, bringen“; „brachte mich“ gibt die Kausativform unmittelbar wieder.
- source_word: כַשְׂדִּימָה
  choice: nach Chaldäa
  rationale: Die Richtungsendung bezeichnet eine Bewegung in das Land der Chaldäer. „Nach Chaldäa“ bewahrt den geografischen Bezug, ohne ihn modernisierend als „Babylonien“ aufzulösen.
- source_word: אֶל הַגּוֹלָה
  choice: zu den Verschleppten
  rationale: הַגּוֹלָה kann kollektiv die im Exil lebende Gemeinschaft bezeichnen. „Die Verschleppten“ macht die erzwungene Deportation deutlich und bezeichnet hier natürlich die Gemeinschaft, zu der Ezechiel gebracht wird.
- source_word: בַּמַּרְאֶה
  choice: im Gesicht
  rationale: מַרְאֶה bezeichnet hier die prophetische Schau. „Gesicht“ ist im gehobenen biblischen Deutsch verständlich und ermöglicht die Wiederholung desselben Ausdrucks am Versende.
- source_word: בְּרוּחַ אֱלֹהִים
  choice: durch den Geist Gottes
  rationale: Die Präposition בְּ kann Mittel beziehungsweise Urheber oder den Bereich bezeichnen. Im Haupttext wird die instrumentale Lesart gewählt; die mögliche sphärische Lesart wird in einer Fußnote bewahrt.
- source_word: וַיַּעַל מֵעָלַי
  choice: stieg von mir auf
  rationale: עלה mit מֵעַל zeichnet eine nach oben gerichtete Entfernung. „Stieg von mir auf“ erhält dieses Bild, statt es nur mit „verschwand“ oder „wich“ zu deuten.
- source_word: הַמַּרְאֶה אֲשֶׁר רָאִיתִי
  choice: das Gesicht, das ich gesehen hatte
  rationale: Die Wiederholung von מַרְאֶה und ראה wird sichtbar gehalten; das Plusquamperfekt ordnet die bereits empfangene Schau natürlich in den Erzählablauf ein.
theological_decisions:
- issue: Persönliche oder unpersönliche Bedeutung von רוּחַ
  choice: Beide Vorkommen werden als „Geist“ verstanden, das zweite ausdrücklich als „Geist Gottes“.
  alternative: „Wind“ oder „Atem“
  rationale: Der unmittelbare Kontext handelt von prophetischer Schau und visionärer Beförderung, nicht von Wetter. „Geist“ wahrt den erzählerischen und theologischen Zusammenhang, ohne über die Formulierung des Textes hinauszugehen.
- issue: Bedeutung der Präposition בְּ in בְּרוּחַ אֱלֹהִים
  choice: „durch den Geist Gottes“ als Angabe des Mittels bzw. Wirkenden
  alternative: „im Geist Gottes“ als Angabe des Bereichs visionärer Erfahrung
  rationale: Beides ist grammatisch möglich. Der Haupttext folgt der im Kontext naheliegenden instrumentalen Lesart; die echte Mehrdeutigkeit wird durch Fußnote [b] offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll biblischem Klang. „Gesicht“ bewahrt die lexikalische Wiederholung und bezeichnet eindeutig eine prophetische Schau; die Satzstellung hält zusammen, dass die Beförderung nach Chaldäa innerhalb der Schau und durch Gottes Geist geschieht.
