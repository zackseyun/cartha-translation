  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֤ר בְּ/חֻקַּ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וּ/מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם עֲשִׂיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/012.yaml
  text: Then you will know that I am Yahweh[a], in whose statutes you have not walked, and whose judgments you have not carried out, but you have acted according to the judgments of the nations that are around you.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich Jahwe bin, dessen Satzungen ihr nicht befolgt habt und dessen Rechtsbestimmungen ihr nicht ausgeführt habt. Stattdessen habt ihr nach den Rechtsbestimmungen[a] der Völker gehandelt, die rings um euch sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den Bräuchen der Völker“. Das hier mit „Rechtsbestimmungen“ wiedergegebene hebräische Wort kann in diesem Zusammenhang auch die überlieferten Praktiken oder Bräuche dieser Völker bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das Qal Perfekt 2. Person Plural mit ו trägt im Zusammenhang der angekündigten Gerichtsereignisse folgernd-zukünftigen Sinn. „Dann“ gibt diese Folgebeziehung in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den im Hebräischen ausdrücklich gebrauchten Bundesnamen zu bewahren.
- source_word: בְּחֻקַּי לֹא הֲלַכְתֶּם
  choice: dessen Satzungen ihr nicht befolgt habt
  rationale: Das hebräische Bild „in meinen Satzungen gehen“ bezeichnet eine Lebensführung nach ihnen. „Befolgen“ vermittelt die Bedeutung im heutigen Deutsch, während „dessen“ den Relativanschluss אֲשֶׁר wahrt.
- source_word: חֻקַּי
  choice: Satzungen
  rationale: „Satzungen“ ist eine präzise, geläufige Wiedergabe im rechtlich-bundestheologischen Zusammenhang und unterscheidet den Ausdruck von מִשְׁפָּטִים.
- source_word: וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם
  choice: und dessen Rechtsbestimmungen ihr nicht ausgeführt habt
  rationale: מִשְׁפָּטִים bezeichnet hier Jahwes verbindliche rechtliche Ordnungen; „ausgeführt“ gibt עשה idiomatisch wieder.
- source_word: מִשְׁפָּטַי / כְמִשְׁפְּטֵי
  choice: Rechtsbestimmungen
  rationale: Die gleiche Wiedergabe an beiden Stellen bewahrt die auffällige Wiederholung von מִשְׁפָּט. Beim zweiten Vorkommen ist auch die Bedeutung „Bräuche“ möglich und wird in der Fußnote genannt.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם
  choice: Stattdessen habt ihr nach den Rechtsbestimmungen der Völker gehandelt
  rationale: 'Das ו ist im Kontext adversativ: Dem Ungehorsam gegen Jahwes Ordnungen wird die Anpassung an die umliegenden Völker gegenübergestellt. עשה + כ wird natürlich mit „nach … gehandelt“ wiedergegeben.'
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: der Völker, die rings um euch leben
  rationale: „Völker“ ist die übliche Wiedergabe von גּוֹיִם. Die Formulierung bewahrt den Relativsatz und drückt die Nachbarschaft in natürlichem Deutsch aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete hebräische Bild „in Satzungen gehen“ wird zugunsten des allgemein verständlichen „befolgen“ bedeutungsgerecht übertragen. Die Wiederholung von מִשְׁפָּט bleibt durch „Rechtsbestimmungen“ sichtbar; die kontextuell mögliche Nuance „Bräuche“ steht in der Fußnote.
