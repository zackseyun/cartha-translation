  to: Dein Vermögen, deine Waren, deine Handelsgüter, deine Seeleute, deine Steuermänner, diejenigen, die deine Schäden ausbessern[a], diejenigen, die mit deinen Handelsgütern Handel treiben, alle deine Krieger, die in dir sind, und die ganze Schar in deiner Mitte werden am Tag deines Untergangs ins Herz der Meere fallen[b].
