  text: הוֹנֵ/ךְ֙ וְ/עִזְבוֹנַ֔יִ/ךְ מַעֲרָבֵ֕/ךְ מַלָּחַ֖יִ/ךְ וְ/חֹבְלָ֑יִ/ךְ מַחֲזִיקֵ֣י בִדְקֵ֣/ך וְֽ/עֹרְבֵ֣י מַ֠עֲרָבֵ/ךְ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתֵּ֜/ךְ אֲשֶׁר בָּ֗/ךְ וּ/בְ/כָל קְהָלֵ/ךְ֙ אֲשֶׁ֣ר בְּ/תוֹכֵ֔/ךְ יִפְּלוּ֙ בְּ/לֵ֣ב יַמִּ֔ים בְּ/י֖וֹם מַפַּלְתֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/027.yaml
  text: Your wealth[a], your wares, your merchandise, your sailors, and your pilots, those who repair your damage, and those who trade in your merchandise, and all your men of war who are in you, with all your assembly that is in your midst[b], will fall into the heart of the seas on the day of your downfall.
translation:
  language: de
  text: Dein Vermögen, deine Waren, deine Handelsgüter, deine Seeleute, deine Steuermänner, diejenigen, die deine Schäden ausbessern[a], diejenigen, die mit deinen Handelsgütern Handel treiben, alle deine Krieger, die in dir sind, und die ganze Schar in deiner Mitte werden am Tag deines Untergangs ins Herz der Meere fallen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die deine Risse abdichten“ beziehungsweise „die dein Leck ausbessern“.'
    reason: lexical_alternative
  - marker: b
    text: Das „Herz der Meere“ bezeichnet ihre Mitte oder Tiefe.
    reason: idiom_clarification
lexical_decisions:
- source_word: הוֹנֵךְ
  choice: dein Vermögen
  rationale: הוֹן bezeichnet Reichtum oder Besitz. „Vermögen“ ist im modernen Deutschen natürlich und passt zum Handelskontext des Klagelieds über Tyrus.
- source_word: עִזְבוֹנַיִךְ
  choice: deine Waren
  rationale: Das seltene Wort steht hier in einer Aufzählung von Handelsbesitz und bezeichnet die zum Verkauf oder Transport bestimmten Güter.
- source_word: מַעֲרָבֵךְ
  choice: deine Handelsgüter
  rationale: Der Ausdruck gehört in Hesekiel 27 zum Bereich von Handel und Warenaustausch. „Handelsgüter“ gibt den konkreten Bezug auf die Ladung bzw. Ware wieder.
- source_word: מַלָּחַיִךְ
  choice: deine Seeleute
  rationale: „Seeleute“ ist eine klare, gegenwärtige Bezeichnung für die Besatzungsmitglieder eines Schiffes.
- source_word: חֹבְלָיִךְ
  choice: deine Steuermänner
  rationale: Im nautischen Zusammenhang sind diejenigen gemeint, die das Schiff lenken oder führen; „Steuermänner“ unterscheidet sie verständlich von den übrigen Seeleuten.
- source_word: מַחֲזִיקֵי בִדְקֵךְ
  choice: die dein Leck ausbessern
  rationale: Wörtlich geht es um diejenigen, die einen Riss oder Schaden festigen. Im durchgehenden Schiffsbild ist das Ausbessern eines Lecks die naheliegende Bedeutung; die größere lexikalische Spannweite wird in der Fußnote bewahrt.
- source_word: עֹרְבֵי מַעֲרָבֵךְ
  choice: die mit deinen Handelsgütern Handel treiben
  rationale: Das Partizip bezeichnet hier aufgrund des unmittelbaren Handelskontexts Händler bzw. Personen, die Waren tauschen oder umsetzen.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: alle deine Krieger
  rationale: Die knappe deutsche Bezeichnung gibt die militärische Funktion der wörtlichen „Männer deines Krieges“ natürlich wieder.
- source_word: קְהָלֵךְ
  choice: deine ganze Schar
  rationale: קָהָל bezeichnet eine versammelte Menge. „Schar“ passt hier zu der Gesamtheit der Menschen in Tyrus bzw. an Bord, ohne sie enger zu bestimmen.
- source_word: יִפְּלוּ
  choice: werden ... fallen
  rationale: Die Grundbedeutung des Verbs „fallen“ bleibt erhalten. Im Bild des Schiffsunglücks schwingt das Versinken mit, ohne dass die Bildsprache darauf reduziert wird.
- source_word: בְּלֵב יַמִּים
  choice: ins Herz der Meere
  rationale: Die bildhafte hebräische Wendung wird formal bewahrt; sie bezeichnet zugleich die Mitte oder Tiefe der Meere.
- source_word: מַפַּלְתֵּךְ
  choice: deines Sturzes
  rationale: מַפֶּלֶת bezeichnet Fall, Zusammenbruch oder Untergang. „Sturz“ hält die Verbindung zum folgenden Verb „fallen“ sichtbar und wahrt das Bild des Ausgangstextes.
