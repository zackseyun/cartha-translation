source:
  edition: WLC
  text: עֵ֛ת נִשְׁבֶּ֥רֶת מִ/יַּמִּ֖ים בְּ/מַֽעֲמַקֵּי מָ֑יִם מַעֲרָבֵ֥/ךְ וְ/כָל קְהָלֵ֖/ךְ בְּ/תוֹכֵ֥/ךְ נָפָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/034.yaml
  text: At the time you were broken by the seas in the depths of the waters[b][a], your merchandise and all your assembly in your midst fell.
translation:
  language: de
  text: Zu der Zeit, als du von den Meeren in den Tiefen der Wasser zerbrochen wurdest, fielen deine Handelswaren und deine ganze Schar in deiner Mitte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »ganze Schar« kann alle in Tyrus versammelten Menschen bezeichnen, darunter Bewohner, Händler und Seeleute.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: Zu der Zeit, als
  rationale: Bewahrt die nominale Zeitangabe des Hebräischen und ergibt zusammen mit dem folgenden Satz natürliches modernes Deutsch.
- source_word: נִשְׁבֶּרֶת
  choice: du ... zerbrochen wurdest
  rationale: Das feminine Nifal-Partizip bezieht sich auf das personifizierte Tyrus. „Zerbrochen“ wahrt das Schiffsbild, ohne die Bedeutung vorschnell auf „Schiffbruch erleiden“ einzuengen.
- source_word: מִיַּמִּים
  choice: von den Meeren
  rationale: מִן kann hier bei der passiven Verbform Ursache beziehungsweise Urheber bezeichnen. Der Plural des Ausgangstextes bleibt erhalten.
- source_word: בְּמַעֲמַקֵּי מָיִם
  choice: in den Tiefen der Wasser
  rationale: Gibt die konstruktgebundene Wendung eng wieder und erhält deren poetisches, mehrdeutiges Wasserbild.
- source_word: מַעֲרָבֵךְ
  choice: deine Handelswaren
  rationale: Im Handelskontext von Ezechiel 27 bezeichnet das Wort die zum Austausch bestimmten Waren; „Handelswaren“ ist klarer als das im Deutschen mehrdeutige „Ware“ im Singular.
- source_word: וְכָל קְהָלֵךְ
  choice: und deine ganze Schar
  rationale: „Schar“ bewahrt den weiten kollektiven Sinn von קהל und legt nicht fest, ob besonders Besatzung, Händler, Bewohner oder alle Versammelten gemeint sind.
- source_word: בְּתוֹכֵךְ
  choice: in deiner Mitte
  rationale: Erhält die räumliche Formulierung und damit die Überlagerung von Stadt- und Schiffsmetapher.
- source_word: נָפָלוּ
  choice: fielen
  rationale: Entspricht der Grundbedeutung des Qal-Perfekts und vermeidet die kontextuell mögliche, aber stärker deutende Übersetzung „sanken“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst poetischer Bildsprache. Die feminine Anrede wird durch „du“ grammatisch nicht sichtbar, bleibt aber durch den Bezug auf Tyrus erhalten. Die ungewöhnliche Pluralform „Meere“ und die Wendung „Tiefen der Wasser“ wurden zur Wahrung der hebräischen Bildwelt beibehalten.
