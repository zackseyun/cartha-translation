  text: וְֽ/יָרְד֞וּ מֵ/אָנִיּֽוֹתֵי/הֶ֗ם כֹּ֚ל תֹּפְשֵׂ֣י מָשׁ֔וֹט מַלָּחִ֕ים כֹּ֖ל חֹבְלֵ֣י הַ/יָּ֑ם אֶל הָ/אָ֖רֶץ יַעֲמֹֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/029.yaml
  text: And all who handle the oar will come down from their ships[a]; the sailors, all the mariners of the sea[b], will stand on the land.
translation:
  language: de
  text: Und alle Ruderer werden von ihren Schiffen herabsteigen[a]; die Seeleute, alle, die das Meer befahren[b], werden an Land stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle, die ein Ruder ergreifen“ beziehungsweise „handhaben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle Seefahrer“; wörtlich: „alle Seefahrer des Meeres“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: werden herabsteigen
  rationale: Das Qal von ירד bezeichnet die Bewegung vom Schiff hinunter zum Land. Das Futur passt zur prophetischen Darstellung; „herabsteigen“ bewahrt zudem die räumliche Bildhaftigkeit.
- source_word: מֵאָנִיּוֹתֵיהֶם
  choice: von ihren Schiffen
  rationale: אֳנִיָּה bezeichnet hier ein seegängiges Schiff; מן wird unmittelbar mit „von“ wiedergegeben.
- source_word: כֹּל תֹּפְשֵׂי מָשׁוֹט
  choice: alle, die das Ruder führen
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild von Menschen, die das Ruder beziehungsweise den Riemen handhaben, und vermeidet im Haupttext die Verengung auf die Berufsbezeichnung „Ruderer“.
- source_word: מַלָּחִים
  choice: die Seeleute
  rationale: „Seeleute“ ist eine klare, heutige und zugleich würdige Wiedergabe der allgemeinen Bezeichnung für Schiffsbesatzungen.
- source_word: כֹּל חֹבְלֵי הַיָּם
  choice: alle Seefahrer auf dem Meer
  rationale: חֹבְלֵי bezeichnet hier mit der Seefahrt befasste Männer. „Seefahrer“ wahrt die breite Bedeutung und erhält zusammen mit „auf dem Meer“ die emphatische Fülle des Hebräischen.
- source_word: אֶל הָאָרֶץ
  choice: an Land
  rationale: Im Gegensatz zu den Schiffen meint הָאָרֶץ hier das feste Land beziehungsweise das Ufer. Die deutsche Wendung „an Land“ ist dafür idiomatisch.
- source_word: יַעֲמֹדוּ
  choice: werden stehen
  rationale: Die Grundbedeutung von עמד ist „stehen“. Die schlichte Wiedergabe lässt offen, ob nur das tatsächliche Stehen oder zugleich ein Sich-Aufstellen zum Ausdruck kommt.
