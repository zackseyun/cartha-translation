translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die maritime Aufzählung und ihre leichte Wiederholung bleiben erhalten; das idiomatische „an Land“ verdeutlicht den Gegensatz zu den Schiffen, ohne das Bild auszubauen.
