review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Zukunftsformen geben den hebräischen Vers zuverlässig wieder: Alle verlassen ihre Schiffe und stehen an Land. „Das Ruder führen“ ist im Deutschen jedoch mehrdeutig und bezeichnet gewöhnlich das Steuern eines Schiffs (das Führen des Steuerruders), während מָשׁוֹט ein Ruder im Sinn eines Riemens/Oars ist. „Ruderer“ gibt die hier gemeinte Personengruppe klar wieder. חֹבְלֵי הַיָּם wird mit „alle, die das Meer befahren“ idiomatisch und umfassend wiedergegeben.'
  naturalness: „Alle Seefahrer auf dem Meer“ ist verständlich, klingt aber im Deutschen etwas redundant und weniger natürlich. „Alle, die das Meer befahren“ erhält die poetische Wiederholung nach „Seeleute“ und liest sich flüssiger. Die übrige Syntax und der würdige Registerton sind angemessen.
  terminology: „Seeleute“ ist für מַלָּחִים passend. „Ruderer“ vermeidet die deutsche Steuerruder-Mehrdeutigkeit von „das Ruder führen“. „An Land stehen“ ist im maritimen Kontext eine natürliche Entsprechung von אֶל־הָאָרֶץ יַעֲמֹדוּ.
  issues:
  - severity: medium
    issue: „das Ruder führen“ kann im Deutschen das Steuern mit dem Steuerruder bezeichnen.
    rationale: Das hebräische מָשׁוֹט bezeichnet hier ein Ruder als Antriebsinstrument; gemeint sind daher Ruderer, nicht primär Steuermänner.
  - severity: low
    issue: „alle Seefahrer auf dem Meer“ wirkt stilistisch redundant.
    rationale: Die hebräische Wiederholung soll erhalten bleiben, kann aber idiomatischer als „alle, die das Meer befahren“ formuliert werden.
  revised_text: Und alle Ruderer werden von ihren Schiffen herabsteigen[a]; die Seeleute, alle, die das Meer befahren[b], werden an Land stehen.
