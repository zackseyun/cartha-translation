- from: Und alle, die das Ruder führen, werden von ihren Schiffen herabsteigen[a]; die Seeleute, alle Seefahrer auf dem Meer[b], werden an Land stehen.
  to: Und alle Ruderer werden von ihren Schiffen herabsteigen[a]; die Seeleute, alle, die das Meer befahren[b], werden an Land stehen.
  rationale: Die Revision beseitigt eine im Deutschen sachlich relevante Mehrdeutigkeit bei „Ruder führen“ und glättet die zweite maritime Personenbezeichnung, ohne die parallele, verstärkende Aufzählung des Hebräischen oder den Sinn des Verses zu verändern.
