  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht im Femininum Singular und bezieht sich auf die Stadt Tyrus. Der zweite Satz vermeidet die im Deutschen schwerfällige hebräische Wiederholung, ohne eine Sachangabe auszulassen.
