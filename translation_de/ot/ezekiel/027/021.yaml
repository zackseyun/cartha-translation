source:
  edition: WLC
  text: עֲרַב֙ וְ/כָל נְשִׂיאֵ֣י קֵדָ֔ר הֵ֖מָּה סֹחֲרֵ֣י יָדֵ֑/ךְ בְּ/כָרִ֤ים וְ/אֵילִים֙ וְ/עַתּוּדִ֔ים בָּ֖/ם סֹחֲרָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
translation:
  language: de
  text: Arabien und alle Fürsten von Kedar waren deine Handelspartner[a]. Mit Lämmern, Widdern und Ziegenböcken handelten sie mit dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Händler deiner Hand«; gemeint sind Menschen, die mit dir Handel trieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲרַב
  choice: Arabien
  rationale: Der Eigenname kann die arabische Region oder deren Bewohner bezeichnen. In der Handelsliste ist die geografische Bezeichnung im Deutschen natürlich; die beteiligten Menschen sind durch das Prädikat mitgemeint.
- source_word: נְשִׂיאֵי
  choice: Fürsten
  rationale: Das Wort bezeichnet Stammesoberhäupter oder Herrscher. »Fürsten« bewahrt den gehobenen politischen Sinn und ist im modernen Standarddeutsch verständlich.
- source_word: קֵדָר
  choice: Kedar
  rationale: Der Eigenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: סֹחֲרֵי יָדֵךְ
  choice: deine Handelspartner
  rationale: Wörtlich »Händler deiner Hand«; die idiomatische Wendung bezeichnet Personen, die mit Tyrus Handel treiben. »Handelspartner« gibt die Beziehung natürlich wieder.
- source_word: כָרִים
  choice: Lämmern
  rationale: Das Wort bezeichnet junge beziehungsweise auf der Weide gemästete Schafe. »Lämmer« hält die Kategorie von den anschließend genannten Widdern getrennt.
- source_word: אֵילִים
  choice: Widdern
  rationale: Die übliche Bedeutung ist »Widder« und bezeichnet männliche Schafe.
- source_word: עַתּוּדִים
  choice: Ziegenböcken
  rationale: Gemeint sind ausdrücklich männliche Ziegen; »Ziegenböcke« ist präzise und im Deutschen natürlich.
- source_word: בָּם סֹחֲרָיִךְ
  choice: Mit ... handelten sie mit dir
  rationale: Die Präposition verweist auf die genannten Handelsgüter. Eine verbale Wiedergabe ist im Deutschen flüssig und erhält den erneuten Bezug auf den Handel mit Tyrus.
theological_decisions: []
