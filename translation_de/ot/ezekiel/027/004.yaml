  text: בְּ/לֵ֥ב יַמִּ֖ים גְּבוּלָ֑יִ/ךְ בֹּנַ֕יִ/ךְ כָּלְל֖וּ יָפְיֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/004.yaml
  text: Your borders are in the heart of the seas[b][a]; your builders perfected your beauty.
translation:
  language: de
  text: Inmitten der Meere liegen deine Grenzen; deine Erbauer haben deine Schönheit vollendet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben deine Schönheit vollkommen gemacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֵב יַמִּים
  choice: mitten im Meer
  rationale: Die räumliche Wendung mit לֵב bezeichnet das Innere beziehungsweise die Mitte. „Mitten im Meer“ gibt sie im Deutschen natürlich und bildkräftig wieder; der hebräische Plural kann dabei kollektiv verstanden werden.
- source_word: גְּבוּלַיִךְ
  choice: deine Grenzen
  rationale: גְּבוּל bezeichnet Grenzen, Grenzgebiet oder Hoheitsbereich. „Deine Grenzen“ ist direkt und bewahrt die poetische Aussage über Tyrus.
- source_word: בֹּנַיִךְ
  choice: deine Erbauer
  rationale: Das Partizip von בנה bezeichnet diejenigen, die Tyrus erbauten. „Erbauer“ wahrt die Offenheit zwischen Stadtbau und dem im Kontext entfalteten Schiffsbild.
- source_word: כָּלְלוּ
  choice: haben ... vollendet
  rationale: Das Verb bezeichnet hier das Vollenden beziehungsweise Zur-Vollkommenheit-Bringen. „Vollendet“ verbindet den Gedanken des Abschlusses mit dem der erreichten Schönheit, ohne stärker als nötig „perfektioniert“ zu behaupten.
- source_word: יָפְיֵךְ
  choice: deine Schönheit
  rationale: יֹפִי bezeichnet Schönheit oder Pracht. „Schönheit“ ist die direkte, poetisch passende Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die personifizierende Anrede an Tyrus und die maritime Bildwelt bleiben erhalten. Der Singular „Meer“ ist im Deutschen idiomatischer; das hebräische יַמִּים steht formal im Plural.
