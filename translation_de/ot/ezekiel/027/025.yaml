  text: אֳנִיּ֣וֹת תַּרְשִׁ֔ישׁ שָׁרוֹתַ֖יִ/ךְ מַעֲרָבֵ֑/ךְ וַ/תִּמָּלְאִ֧י וַֽ/תִּכְבְּדִ֛י מְאֹ֖ד בְּ/לֵ֥ב יַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/025.yaml
  text: The ships of Tarshish were your carriers for your merchandise[b][a], and you were filled and became very heavy in the heart of the seas.
translation:
  language: de
  text: Die Tarschisch-Schiffe waren deine Frachter für deine Handelsware[a]. Du wurdest beladen und wurdest sehr schwer im Herzen der Meere[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit deinen Waren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: mitten im Meer beziehungsweise auf hoher See.'
    reason: cultural_note
lexical_decisions:
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: die Tarschisch-Schiffe
  rationale: Bewahrt die hebräische Zuordnung zu Tarschisch und zugleich die mögliche technische beziehungsweise handelsbezogene Bezeichnung.
- source_word: שָׁרוֹתַיִךְ
  choice: waren deine Frachter
  rationale: Die schwierige Form wird im Handelskontext als Bezeichnung für Schiffe verstanden, die Tyrus' Waren beförderten. „Frachter“ gibt diese Funktion natürlich wieder, ohne die unpassende Landmetapher „Karawanen“ einzuführen.
- source_word: מַעֲרָבֵךְ
  choice: für deine Handelsware
  rationale: Das Substantiv bezeichnet im Kapitel Handels- beziehungsweise Tauschware. „Handelsware“ ist im Deutschen klar und passt zum wirtschaftlichen Kontext.
- source_word: וַתִּמָּלְאִי
  choice: so wurdest du beladen
  rationale: Gibt das Vollwerden des als Schiff dargestellten Tyrus im Kontext idiomatisch wieder und bewahrt den resultativen Sinn.
- source_word: וַתִּכְבְּדִי מְאֹד
  choice: und sehr schwer
  rationale: Bewahrt das konkrete Bild des durch Fracht schwer gewordenen Schiffes und vermeidet die hier weniger wahrscheinliche Bedeutung „geehrt“.
- source_word: בְּלֵב יַמִּים
  choice: im Herzen der Meere
  rationale: Bewahrt die markante hebräische Metapher; eine Fußnote erläutert ihre räumliche Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weibliche Anrede bezieht sich auf Tyrus, das im Kapitel als Handelsschiff personifiziert wird. Das maritime Bild wird durch „Frachter“, „beladen“ und „schwer“ zusammenhängend wiedergegeben.
