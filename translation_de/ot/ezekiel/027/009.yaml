translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung »in dir« bleibt trotz ihrer Bildhaftigkeit erhalten, weil Tyrus im Kontext zugleich als Stadt und als Schiff angeredet wird. Fachsprachliche nautische Präzisierung wird nur in der Fußnote angeboten.
