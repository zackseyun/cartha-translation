  rationale: Die einzige Änderung verdeutlicht den Bezug von »ihre/seine Fachleute« auf Gebal als Stadt. Sie folgt dem hebräischen femininen Suffix und verbessert zugleich die deutsche Lesbarkeit. Textaussage, Bildsprache und Fußnotenanker bleiben unverändert erhalten.
