  naturalness: »Die Fachleute der Stadt« ist modernes, natürliches Standarddeutsch und vermeidet die stilistisch etwas sperrige bzw. mehrdeutige Verbindung »Gebal und seine Fachleute«. Die übrige Formulierung ist angemessen und wahrt die bildhafte Wiederholung von »in dir«.
