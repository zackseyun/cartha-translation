base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/009.yaml
  text: The elders of Gebal and her skilled men were within you[a], repairing your damage[c][b]. All the ships of the sea and their sailors were within you to trade for your merchandise.
translation:
  language: de
  text: Die Ältesten von Gebal[a] und die Fachleute der Stadt waren in dir und besserten deine Schäden aus.[b] Alle Schiffe des Meeres und ihre Seeleute waren in dir, um mit deinen Handelswaren Handel zu treiben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gebal ist die phönizische Stadt, die später unter ihrem griechischen Namen Byblos bekannt war.
    reason: alternative_reading
  - marker: b
    text: 'Auch: »deine Risse« oder »deine undichten Stellen«; das hebräische Wort kann Schäden, Bruchstellen oder reparaturbedürftige Fugen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »um deine Waren einzutauschen«. Die hebräische Wendung verwendet verwandte Wörter für das Tauschen und die Tauschware.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: Ältesten
  rationale: Der Ausdruck bezeichnet hier am ehesten die führenden Männer der Stadt und bewahrt zugleich den mit Alter und Ansehen verbundenen Sinn.
- source_word: גְבַל
  choice: Gebal
  rationale: Der hebräische Ortsname wird transliteriert; die spätere griechische Bezeichnung Byblos wird in einer Fußnote genannt.
- source_word: חֲכָמֶיהָ
  choice: seine Fachleute
  rationale: Im Zusammenhang mit Schiffbau und Reparatur bezeichnet חכמים praktische Sachkunde, nicht nur allgemeine Weisheit. Das Pronomen richtet sich im Deutschen nach dem sächlichen Ortsnamen Gebal.
- source_word: הָיוּ בָךְ
  choice: waren in dir
  rationale: Die räumliche Formulierung erhält die Anrede an Tyrus und das Bild der Stadt als Schiff; das im Deutschen ungewöhnliche Bild wird nicht zu »arbeiteten für dich« vereindeutigt.
- source_word: מַחֲזִיקֵי בִּדְקֵךְ
  choice: besserten deine Schäden aus
  rationale: In Verbindung mit בדק bezeichnet חזק das Festigen beziehungsweise Reparieren schadhafter Stellen. Die Wiedergabe bleibt breiter als die möglichen nautischen Konkretisierungen »Risse«, »Fugen« oder »undichte Stellen«.
- source_word: כָּל אֳנִיּוֹת הַיָּם
  choice: alle Schiffe des Meeres
  rationale: Die direkte Wiedergabe erhält sowohl den umfassenden Sinn als auch das maritime Bild.
- source_word: מַלָּחֵיהֶם
  choice: ihre Seeleute
  rationale: »Seeleute« ist eine natürliche moderne Bezeichnung für die Besatzungen der Schiffe.
- source_word: לַעֲרֹב מַעֲרָבֵךְ
  choice: um mit deinen Handelswaren Handel zu treiben
  rationale: Die Formulierung bildet die etymologische Verbindung zwischen dem Verb des Tauschhandels und dem Substantiv für Handels- beziehungsweise Tauschware ab, ohne einen reinen Geldhandel vorauszusetzen.
