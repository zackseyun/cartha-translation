base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
translation:
  language: de
  text: Dan und Jawan aus Usal[a] handelten mit dir; bearbeitetes Eisen, Kassia[b] und Würzrohr lieferten sie im Tausch für deine Waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »Dan«; manche lesen »Wedan« oder ändern den Text auf andere Weise, weil die Stelle schwierig ist. Auch die Verbindung von »Jawan« und »Usal« ist im Hebräischen syntaktisch unsicher.
    reason: textual_variant
  - marker: b
    text: 'Oder: »Kalmus« beziehungsweise »wohlriechendes Rohr«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדָן
  choice: Dan
  rationale: Der masoretische Text bietet den als Orts- oder Volksnamen verstandenen Namen »Dan«. Wegen der schwierigen Textlage wird die abweichende Deutung in der Fußnote genannt.
- source_word: וְיָוָן
  choice: Jawan
  rationale: Der Eigenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben, statt ihn deutend mit »Griechenland« oder »Ionier« zu übersetzen.
- source_word: מְאוּזָּל
  choice: aus Usal
  rationale: Die Form wird am ehesten als Ortsname mit vorangestellter Präposition verstanden. Die syntaktische Zuordnung bleibt jedoch schwierig und wird deshalb in der Fußnote erläutert.
- source_word: בְּעִזְבוֹנַיִךְ
  choice: handelten mit dir
  rationale: Das Substantiv bezeichnet Handelsgut bzw. Waren; zusammen mit dem folgenden Verb ist eine natürliche deutsche Handelsformulierung angemessen.
- source_word: נָתָנּוּ
  choice: gaben sie
  rationale: Das Verb bedeutet wörtlich »geben«; der kommerzielle Zusammenhang macht deutlich, dass die Güter als Handelsleistung gegeben wurden.
- source_word: בַּרְזֶל עָשׁוֹת
  choice: bearbeitetes Eisen
  rationale: Die Wendung bezeichnet offenbar verarbeitetes oder bearbeitetes Eisen und nicht bloß Rohmaterial.
- source_word: קִדָּה
  choice: Kassia
  rationale: Das Wort bezeichnet wahrscheinlich Kassia, einen aromatischen Handelsstoff.
- source_word: וְקָנֶה
  choice: Würzrohr
  rationale: Im Zusammenhang mit aromatischen Handelswaren ist ein wohlriechendes Rohr gemeint; »Würzrohr« ist im Deutschen verständlicher und genauer als das allgemeine »Rohr«.
- source_word: בְּמַעֲרָבֵךְ
  choice: für deine Waren
  rationale: Das Wort bezeichnet hier Handelsware; die Präposition wird im Zusammenhang als Austauschverhältnis wiedergegeben.
