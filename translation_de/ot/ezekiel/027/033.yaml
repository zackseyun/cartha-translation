  text: בְּ/צֵ֤את עִזְבוֹנַ֨יִ/ךְ֙ מִ/יַּמִּ֔ים הִשְׂבַּ֖עַתְּ עַמִּ֣ים רַבִּ֑ים בְּ/רֹ֤ב הוֹנַ֨יִ/ךְ֙ וּ/מַ֣עֲרָבַ֔יִ/ךְ הֶעֱשַׁ֖רְתְּ מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/033.yaml
  text: When your wares went out from the seas[a], you satisfied many peoples[b]; with your abundant wealth and your merchandise you enriched the kings of the earth.
translation:
  language: de
  text: Als deine Waren von den Meeren ausgingen,[a] hast du viele Völker gesättigt; mit der Fülle deines Reichtums und deiner Handelsgüter hast du die Könige der Erde reich gemacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als deine Güter von den Meeren ausgingen“. Der hebräische Ausdruck bezeichnet die Waren beziehungsweise die Handelsfracht von Tyrus; das Verb bedeutet „ausgehen“ oder „hinausgehen“ und beschreibt ihren Auszug von den Meeren her.'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: 'Oder: „die Könige des Landes“. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת
  choice: Als ... kamen
  rationale: Die Präposition ב mit dem Infinitivus constructus von יצא bildet hier einen temporalen Nebensatz. Im Zusammenhang mit Waren gibt „als ... kamen“ den Vorgang im Deutschen natürlich wieder.
- source_word: עִזְבוֹנַיִךְ
  choice: deine Waren
  rationale: Das seltene Substantiv bezeichnet im Kontext des Klagelieds über Tyrus dessen ausgeführte Handelswaren oder Fracht. „Waren“ ist verständlich und unterscheidet sich vom späteren Ausdruck für Handelsgüter.
- source_word: מִיַּמִּים
  choice: von den Meeren
  rationale: Die Übersetzung bewahrt den hebräischen Plural und die maritime Bildwelt. Die genaue räumliche Beziehung der vom Meer kommenden beziehungsweise ausfahrenden Waren bleibt erklärungsbedürftig und wird in einer Fußnote kenntlich gemacht.
- source_word: הִשְׂבַּעַתְּ
  choice: hast du ... satt gemacht
  rationale: Der Hifil von שבע bedeutet „sättigen“ oder „zufriedenstellen“. „Satt gemacht“ erhält das konkrete Bild von der reichlichen Versorgung vieler Völker.
- source_word: עַמִּים רַבִּים
  choice: viele Völker
  rationale: „Völker“ gibt den Plural עַמִּים wieder, ohne moderne Nationalstaatlichkeit vorauszusetzen.
- source_word: בְּרֹב הוֹנַיִךְ
  choice: mit der Fülle deines Reichtums
  rationale: בְּ wird instrumental aufgefasst; רֹב bezeichnet die große Menge oder Fülle und הוֹן den Reichtum.
- source_word: וּמַעֲרָבַיִךְ
  choice: und deiner Handelsgüter
  rationale: Das Wort gehört in Ezechiel 27 zum Wortfeld des Tauschhandels. „Handelsgüter“ ist im modernen Deutsch klar und vermeidet eine völlige Wiederholung von „Waren“.
- source_word: הֶעֱשַׁרְתְּ
  choice: hast du ... reich gemacht
  rationale: Der Hifil von עשר bedeutet „reich machen“. Die deutsche Formulierung ist unmittelbar und erhält die Entsprechung zum vorausgehenden Reichtum.
- source_word: מַלְכֵי אָרֶץ
  choice: die Könige der Erde
  rationale: Im internationalen Horizont des Tyrus-Klagelieds ist „Erde“ naheliegend; zugleich kann אֶרֶץ auch „Land“ bedeuten, weshalb die Alternative in einer Fußnote bleibt.
