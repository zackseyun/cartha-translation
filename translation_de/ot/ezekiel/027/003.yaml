  - severity: medium
    issue: „Ich bin vollkommen an Schönheit“
    rationale: Die Formulierung ist im modernen Deutschen unidiomatisch. Die nominale hebräische Aussage כְּלִילַת יֹפִי wird mit „von vollkommener Schönheit“ natürlich und inhaltsgleich wiedergegeben.
