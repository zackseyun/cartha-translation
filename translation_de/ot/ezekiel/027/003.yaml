  text: וְ/אָמַרְתָּ֣ לְ/צ֗וֹר ה/ישבתי עַל מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽ/עַמִּ֔ים אֶל אִיִּ֖ים רַבִּ֑ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צ֕וֹר אַ֣תְּ אָמַ֔רְתְּ אֲנִ֖י כְּלִ֥ילַת יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
translation:
  language: de
  text: 'und sage zu Tyrus, die an den Zugängen des Meeres wohnt und mit den Völkern bis hin zu vielen Küstenländern[a] Handel treibt: So spricht der Herr Yahweh: Tyrus, du hast gesagt: »Ich bin von vollkommener Schönheit.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vielen Inseln«. Das hebräische Wort kann Inseln oder allgemeiner Küstenländer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הישבתי
  choice: die … wohnt
  rationale: Das feminine Qal-Partizip bezieht sich auf die personifizierte Stadt Tyrus. Ein Relativsatz gibt den andauernden Zustand in natürlichem Deutsch wieder.
- source_word: מְבוֹאֹת יָם
  choice: an den Zugängen zum Meer
  rationale: מְבוֹאֹת bezeichnet Eingänge oder Zugänge. „Zugänge zum Meer“ bewahrt das konkrete Bild der strategischen Lage von Tyrus, ohne einen bestimmten Hafenbegriff einzutragen.
- source_word: רֹכֶלֶת הָעַמִּים
  choice: mit den Völkern … Handel treibt
  rationale: Das feminine Partizip bezeichnet Tyrus als Handelnde. Die verbale Formulierung klingt im Deutschen natürlicher als „Händlerin der Völker“ und lässt die Völker als Handelspartner erkennen.
- source_word: אֶל אִיִּים רַבִּים
  choice: bis hin zu vielen Küstenländern
  rationale: אִיִּים kann Inseln oder allgemeiner Länder an den Meeresküsten bezeichnen. „Küstenländer“ passt zum weiträumigen Seehandel; „bis hin zu“ bildet die Ziel- beziehungsweise Reichweitenangabe von אֶל ab.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: אֲדֹנָי wird mit „Herr“ wiedergegeben, während „Yahweh“ den Eigennamen des Gottes Israels erkennbar erhält und eine doppelte Wiedergabe als „Herr HERR“ vermeidet.
- source_word: כְּלִילַת יֹפִי
  choice: vollkommen an Schönheit
  rationale: Die Wendung bezeichnet vollendete beziehungsweise vollständige Schönheit. Die Formulierung bewahrt den prahlerischen Anspruch von Tyrus und folgt der prädikativen Struktur nach „Ich bin“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und macht beide Bestandteile sichtbar, ohne den Namen durch einen zweiten Titel zu ersetzen.
- issue: Personifizierung von Tyrus
  choice: 'feminine Bezugnahme: „die … wohnt“'
  alternative: 'neutrale Umschreibung: „das an … liegt“'
  rationale: Die femininen Partizipien und die direkte Anrede im Hebräischen stellen Tyrus als weiblich personifizierte Stadt dar; diese Bildsprache bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die maritime Bildsprache und die Personifizierung der Stadt bleiben erhalten. Der etwas gehobene Ausdruck „vollkommen an Schönheit“ entspricht dem poetisch-prophetischen Ton.
