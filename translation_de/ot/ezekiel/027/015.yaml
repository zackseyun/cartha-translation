source:
  edition: WLC
  text: בְּנֵ֤י דְדָן֙ רֹֽכְלַ֔יִ/ךְ אִיִּ֥ים רַבִּ֖ים סְחֹרַ֣ת יָדֵ֑/ךְ קַרְנ֥וֹת שֵׁן֙ ו/הובנים הֵשִׁ֖יבוּ אֶשְׁכָּרֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/015.yaml
  text: The sons of Dedan were your merchants[a]. Many coastlands were the market of your hand[c][b]; they brought back ivory tusks and ebony as your payment.
translation:
  language: de
  text: Die Söhne Dedans waren deine Händler. Viele Küstenländer[a] waren dein Absatzmarkt. Als Bezahlung brachten sie dir Elfenbeinstoßzähne[b] und Ebenholz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: viele Inseln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: Hörner aus Elfenbein.'
    reason: lexical_alternative
  - marker: c
    text: Das seltene hebräische Wort wird gewöhnlich als Ebenholz verstanden.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: בְּנֵי דְדָן
  choice: die Söhne Dedans
  rationale: Die formale Wendung bewahrt den hebräischen Ausdruck und ist im Deutschen verständlich; gemeint sind die Angehörigen beziehungsweise Bewohner Dedans.
- source_word: רֹכְלַיִךְ
  choice: deine Händler
  rationale: Das Substantiv bezeichnet umherziehende Händler oder Kaufleute und passt zum Handelskontext des Kapitels.
- source_word: אִיִּים רַבִּים
  choice: viele Küstenländer
  rationale: אִיִּים kann sowohl Inseln als auch maritime Küstengebiete bezeichnen. „Küstenländer“ erfasst hier den weiteren geografischen und wirtschaftlichen Sinn; die engere Alternative steht in der Fußnote.
- source_word: סְחֹרַת יָדֵךְ
  choice: waren dein Absatzmarkt
  rationale: Die wörtliche Wendung „Handel deiner Hand“ ist im Deutschen unnatürlich. „Absatzmarkt“ gibt die Funktion der vielen Küstenländer im Handelsnetz von Tyrus klar wieder, ohne die ungewöhnliche hebräische Konstruktion zu überdeuten.
- source_word: קַרְנוֹת שֵׁן
  choice: Elfenbeinstoßzähne
  rationale: Wörtlich steht „Hörner aus Zahn/Elfenbein“. Gemeint sind un加工ete Stoßzähne als Handelsware; die gewählte Form ist präzise und heute verständlich.
- source_word: וְהוֹבְנִים
  choice: Ebenholz
  rationale: Das seltene, wohl entlehnte Wort wird traditionell und kontextgemäß als Ebenholz verstanden, eine passende Luxusware.
- source_word: הֵשִׁיבוּ
  choice: brachten sie dir
  rationale: Der Hifil von שוב kann „zurückbringen“ bedeuten. Im Handelszusammenhang bezeichnet er hier die als Gegenleistung gelieferte Ware; „brachten sie dir“ ist natürlich und vermeidet die irreführende Vorstellung einer Rückgabe.
- source_word: אֶשְׁכָּרֵךְ
  choice: als Bezahlung
  rationale: Das Substantiv bezeichnet Entgelt oder Gegenleistung. „Bezahlung“ passt zum Warenaustausch und ist allgemein verständlich.
