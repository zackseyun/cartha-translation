source:
  edition: WLC
  text: דַּמֶּ֧שֶׂק סֹחַרְתֵּ֛/ךְ בְּ/רֹ֥ב מַעֲשַׂ֖יִ/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/יֵ֥ין חֶלְבּ֖וֹן וְ/צֶ֥מֶר צָֽחַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/018.yaml
  text: Damascus traded with you because of your many products[a], because of your abundant wealth, with wine of Helbon and white wool.
translation:
  language: de
  text: 'Damaskus trieb Handel mit dir wegen der Fülle deiner Erzeugnisse, wegen der Fülle allen Reichtums: mit Wein aus Helbon und weißer Wolle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Damaskus war dein Händler … mit Wein aus Helbon und heller Wolle.«'
    reason: Die Handelsformulierung kann nominal verstanden werden; außerdem kann צָחַר neben »weiß« auch »hell« beziehungsweise »glänzend« bedeuten.
lexical_decisions:
- source_word: דַּמֶּשֶׂק
  choice: Damaskus
  rationale: Der Ortsname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: סֹחַרְתֵּךְ
  choice: trieb Handel mit dir
  rationale: Die Form von סחר mit Suffix der 2. Person feminin Singular richtet sich an Tyrus. Die Wendung gibt den Handelsbezug natürlich wieder, ohne die mögliche nominale Auffassung als »war dein Händler« auszuschließen.
- source_word: בְּרֹב מַעֲשַׂיִךְ
  choice: wegen der Fülle deiner Erzeugnisse
  rationale: מַעֲשֶׂה bezeichnet wörtlich etwas Gemachtes; im Handelskatalog sind damit Erzeugnisse beziehungsweise Waren gemeint. בְּ wird hier kausal verstanden.
- source_word: מֵרֹב כָּל הוֹן
  choice: wegen deines großen Reichtums
  rationale: הוֹן bedeutet Reichtum oder Vermögen. Die Wiedergabe bewahrt die Steigerung, vermeidet aber das unnatürliche »Fülle allen Reichtums«.
- source_word: בְּיֵין חֶלְבּוֹן
  choice: mit Wein aus Helbon
  rationale: Die Präposition kennzeichnet hier die Handelsware; »aus Helbon« macht die Herkunftsbezeichnung im Deutschen klar.
- source_word: וְצֶמֶר צָחַר
  choice: und weißer Wolle
  rationale: צָחַר wird hier als Farbangabe beziehungsweise Qualitätsbezeichnung »weiß/hell« verstanden; »weiße Wolle« ist im Warenkatalog idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelgrund wird beibehalten; der Doppelpunkt markiert, dass Wein und Wolle die eingebrachten Handelswaren nennen. Das feminine »dir/deiner« bezieht sich auf die personifizierte Stadt Tyrus.
