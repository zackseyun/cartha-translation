source:
  edition: WLC
  text: תַּרְשִׁ֥ישׁ סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/כֶ֤סֶף בַּרְזֶל֙ בְּדִ֣יל וְ/עוֹפֶ֔רֶת נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/012.yaml
  text: Tarshish was your trader because of your abundant wealth[a]; with silver, iron, tin[c][b], and lead they paid for your wares.
translation:
  language: de
  text: Tarschisch[a] war wegen der Fülle all deines Reichtums dein Handelspartner. Sie gaben dir für deine Handelswaren[c] Silber, Eisen, Zinn und Blei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tarschisch bezeichnet möglicherweise ein fernes Handelsgebiet, das später von manchen mit Tartessos in Spanien gleichgesetzt wurde.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „gaben sie“. Im Handelszusammenhang bezeichnet dies eine Gegenleistung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „deine Waren“ beziehungsweise „deine Güter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְשִׁישׁ
  choice: Tarschisch
  rationale: Der Ortsname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben; eine Gleichsetzung mit Tartessos wird nicht in den Text eingetragen.
- source_word: סֹחַרְתֵּךְ
  choice: dein Handelspartner
  rationale: Das Wort bezeichnet hier jemanden beziehungsweise ein Gemeinwesen, das mit der als Frau angeredeten Stadt Tyrus Handel treibt. „Handelspartner“ ist im heutigen Deutsch natürlicher als „Händler“ für einen Ort.
- source_word: מֵרֹב כָּל הוֹן
  choice: wegen deines großen Reichtums
  rationale: מִן wird im Zusammenhang kausal verstanden; הוֹן bezeichnet Reichtum oder Vermögen. Die Formulierung gibt die große Fülle idiomatisch wieder, ohne sie näher zu bestimmen.
- source_word: בְּכֶסֶף בַּרְזֶל בְּדִיל וְעוֹפֶרֶת
  choice: mit Silber, Eisen, Zinn und Blei
  rationale: Die Präposition בְּ hat hier instrumentale Bedeutung und führt die im Tausch eingesetzten Metalle an.
- source_word: נָתְנוּ
  choice: bezahlten sie
  rationale: Die Grundbedeutung lautet „sie gaben“. Im Handelszusammenhang bezeichnet das Geben eine Gegenleistung; „bezahlten“ macht diese Funktion verständlich, während eine Fußnote die wörtlichere Möglichkeit bewahrt.
- source_word: עִזְבוֹנָיִךְ
  choice: deine Handelswaren
  rationale: Der Ausdruck bezeichnet im Handelskapitel die zum Austausch bestimmten Waren beziehungsweise Güter. „Handelswaren“ ist klar und gegenwärtig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom singularischen Ortsnamen „Tarschisch“ zum pluralischen „sie“ bleibt entsprechend dem Hebräischen erhalten und lässt die Menschen beziehungsweise Händler des Gemeinwesens als handelnde Gruppe erkennen.
