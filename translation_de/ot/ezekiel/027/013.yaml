  text: יָוָ֤ן תֻּבַל֙ וָ/מֶ֔שֶׁךְ הֵ֖מָּה רֹֽכְלָ֑יִ/ךְ בְּ/נֶ֤פֶשׁ אָדָם֙ וּ/כְלֵ֣י נְחֹ֔שֶׁת נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/013.yaml
  text: Javan[a], Tubal, and Meshech—they were your traders; they exchanged human lives and articles of bronze for your wares.
translation:
  language: de
  text: Jawan, Tubal und Meschech – sie waren deine Händler; sie tauschten Menschen[a] und Gegenstände aus Bronze gegen deine Waren ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Menschenseele“; im Zusammenhang sind wahrscheinlich Menschen gemeint, die verkauft wurden, also versklavte Menschen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָוָן
  choice: Jawan
  rationale: Der Eigenname eines Volkes beziehungsweise Landes wird in seiner hebräischen Form wiedergegeben; „Griechenland“ wäre eine kontextuelle Identifizierung.
- source_word: תֻּבַל
  choice: Tubal
  rationale: Der Eigenname eines Volkes beziehungsweise Gebiets wird transliteriert.
- source_word: מֶשֶׁךְ
  choice: Meschech
  rationale: Der Eigenname eines Volkes beziehungsweise Gebiets wird transliteriert.
- source_word: רֹכְלָיִךְ
  choice: deine Händler
  rationale: Das Substantiv bezeichnet Handelspartner oder Kaufleute; „Händler“ ist im modernen Deutschen natürlich und passt zum Handelskontext des Kapitels.
- source_word: בְּנֶפֶשׁ אָדָם
  choice: Menschenleben
  rationale: Die Wendung bedeutet wörtlich etwa „Leben/Seele eines Menschen“ und bezeichnet hier Menschen als Handelsgut. „Menschenleben“ bewahrt die erschütternde Ausdrucksweise, ohne ihren rechtlichen Status ausdrücklich festzulegen.
- source_word: כְלֵי נְחֹשֶׁת
  choice: Gegenstände aus Bronze
  rationale: Die allgemeine Wendung bezeichnet gefertigte Bronzeobjekte; „Gegenstände“ bleibt weiter gefasst als „Gefäße“.
- source_word: נָתְנוּ
  choice: sie tauschten ... ein
  rationale: Das Verb bedeutet grundsätzlich „geben“, bezeichnet zusammen mit dem Handelsbegriff מַעֲרָבֵךְ hier jedoch das Hingeben von Gütern im Tauschhandel.
- source_word: מַעֲרָבֵךְ
  choice: deine Waren
  rationale: Das Wort gehört hier zum Bedeutungsfeld von Handel und Tauschgütern. „Waren“ ist knapp, natürlich und im Satz eindeutig.
theological_decisions:
- issue: Status der als Handelsgut genannten Menschen
  choice: Menschenleben im Haupttext; Sklavenhandel als wahrscheinlicher Kontext in der Fußnote
  alternative: Sklaven
  rationale: Der Handelskontext deutet stark auf versklavte Menschen, doch der hebräische Ausdruck selbst nennt keinen bestimmten Rechtsstatus. Die Übersetzung bewahrt diese sprachliche Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die hervorgehobene Wiederaufnahme durch das hebräische Pronomen ab; die Handelsformulierung bleibt klar und idiomatisch.
