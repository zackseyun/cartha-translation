  text: יְהוּדָה֙ וְ/אֶ֣רֶץ יִשְׂרָאֵ֔ל הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/חִטֵּ֣י מִ֠נִּית וּ/פַנַּ֨ג וּ/דְבַ֤שׁ וָ/שֶׁ֨מֶן֙ וָ/צֹ֔רִי נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/017.yaml
  text: Judah and the land of Israel—they were your merchants; they traded for your merchandise with wheat of Minnith[a], pannag, honey, oil, and balm.
translation:
  language: de
  text: Juda und das Land Israel waren deine Händler; sie gaben für deine Handelswaren Weizen aus Minnit, Pannag[a], Honig, Öl und Balsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung von »Pannag« ist unsicher. Vorgeschlagen wurden unter anderem Süßwerk, ein Gewürz oder ein Gebäck.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלָיִךְ
  choice: deine Händler
  rationale: Das Substantiv bezeichnet Personen, die Handel treiben. „Händler“ ist im Kontext des Handelsklagelieds über Tyrus natürlich und präzise.
- source_word: בְּחִטֵּי מִנִּית
  choice: Weizen aus Minnit
  rationale: Die Präposition bezeichnet hier das beim Tausch eingesetzte Handelsgut; die Konstruktverbindung verweist wahrscheinlich auf die Herkunft oder eine damit verbundene Sorte. „Aus Minnit“ gibt diese Beziehung idiomatisch wieder.
- source_word: פַנַּג
  choice: Pannag
  rationale: Das nur selten belegte Wort ist in seiner Bedeutung unsicher. Die Transliteration vermeidet eine unbegründete Festlegung; mögliche Deutungen stehen in der Fußnote.
- source_word: דְבַשׁ
  choice: Honig
  rationale: Dies ist die übliche lexikalische Bedeutung.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Die Grundbedeutung ist „Öl“, im Kontext wahrscheinlich Olivenöl. Die allgemeinere Wiedergabe vermeidet eine im Hebräischen nicht ausdrücklich genannte Präzisierung.
- source_word: צֹרִי
  choice: Balsam
  rationale: Das Wort bezeichnet einen kostbaren aromatischen Pflanzensaft beziehungsweise ein Harz. „Balsam“ ist eine verständliche und etablierte deutsche Wiedergabe.
- source_word: נָתְנוּ מַעֲרָבֵךְ
  choice: sie gaben für deine Handelswaren
  rationale: Die Formulierung bewahrt das konkrete Verb „geben“ und versteht מַעֲרָב im Handelskontext als die Waren, für die die aufgezählten Güter im Tausch gegeben wurden.
- source_word: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל
  choice: Juda und das Land Israel
  rationale: Die Wiedergabe erhält die ausdrückliche Unterscheidung zwischen Juda und „dem Land Israel“, statt sie zu „Juda und Israel“ zu verkürzen.
theological_decisions: []
