lexical_decisions:
- source_word: דְּדָן
  choice: Dedan
  rationale: Der Orts- bzw. Volksname wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: רֹכַלְתֵּךְ
  choice: handelte mit dir
  rationale: Die Form bezeichnet im Handelskontext die Tätigkeit eines Händlers und richtet sich mit dem Suffix der 2. Person feminin Singular unmittelbar an Tyrus.
- source_word: בְבִגְדֵי חֹפֶשׁ
  choice: mit Satteldecken
  rationale: בגד bezeichnet Textilien oder Kleidungsstücke; חֹפֶשׁ ist hier wahrscheinlich ein Fachwort für eine mit dem Reiten verbundene textile Ware. „Satteldecken“ gibt die wahrscheinliche Bedeutung natürlich wieder, ohne die Unsicherheit zu verschweigen.
- source_word: לְרִכְבָּה
  choice: zum Reiten
  rationale: Die Wendung leitet sich von רכב ab und bezeichnet den Zweck der Ware. Die allgemeine Wiedergabe vermeidet eine nicht ausdrücklich genannte Festlegung auf Pferde oder Wagen.
