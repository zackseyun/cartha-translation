  - severity: medium
    issue: Rektion von »bezahlen«
    rationale: Bei der Benennung der als Gegenleistung erhaltenen Waren ist im Deutschen »für deine Waren bezahlen« die klare und idiomatische Konstruktion. Die vorliegende Formulierung kann eher so klingen, als bezahlten sie die Waren selbst.
