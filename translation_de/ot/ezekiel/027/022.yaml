  text: רֹכְלֵ֤י שְׁבָא֙ וְ/רַעְמָ֔ה הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/רֹ֨אשׁ כָּל בֹּ֜שֶׂם וּ/בְ/כָל אֶ֤בֶן יְקָרָה֙ וְ/זָהָ֔ב נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/022.yaml
  text: The merchants of Sheba and Raamah—they were your merchants; with the finest of every spice[a], with every precious stone, and gold, they paid for your wares.
translation:
  language: de
  text: Die Händler von Saba und Ragma waren deine Händler. Mit den feinsten Gewürzen jeder Art, mit allerlei Edelsteinen und mit Gold bezahlten[a] sie für deine Waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gaben«. Im Zusammenhang des Handels kann damit gemeint sein, dass sie für die Waren bezahlten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלֵי ... רֹכְלָיִךְ
  choice: Die Händler ... deine Händler
  rationale: רכל bezeichnet im Handelskontext von Ezechiel 27 Kaufleute beziehungsweise Händler. Die Wiederholung des gleichen deutschen Wortes bildet die Wiederholung im Hebräischen ab.
- source_word: שְׁבָא וְרַעְמָה
  choice: Saba und Ragma
  rationale: Die Eigennamen werden in ihren im Deutschen gebräuchlichen biblischen Formen wiedergegeben.
- source_word: הֵמָּה
  choice: waren
  rationale: Das selbstständige Pronomen hebt die genannten Händler hervor. Im natürlichen deutschen Nominalsatz wird seine Aussage durch »waren deine Händler« ausgedrückt, ohne das schwerfällige »sie selbst« zu erzwingen.
- source_word: בְּרֹאשׁ כָּל בֹּשֶׂם
  choice: mit den erlesensten Gewürzen
  rationale: רֹאשׁ bedeutet hier idiomatisch das Beste oder Vorzüglichste; בֹּשֶׂם bezeichnet wohlriechende Gewürz- und Duftstoffe. »Erlesenste Gewürze« vermittelt den Luxuscharakter der Handelsware natürlich.
- source_word: וּבְכָל אֶבֶן יְקָרָה
  choice: mit allerlei Edelsteinen
  rationale: Die hebräische singularische Sammelbezeichnung wird im Deutschen natürlich als Vielfalt kostbarer Steine wiedergegeben.
- source_word: וְזָהָב
  choice: und mit Gold
  rationale: Direkte Wiedergabe der genannten Handelsware; die Präposition wird aus der parallelen Konstruktion ergänzt.
- source_word: נָתְנוּ
  choice: bezahlten
  rationale: 'Das Verb heißt wörtlich »gaben«, hat hier mit den genannten Wertgütern und den Waren als Gegenstand jedoch wahrscheinlich kommerziellen Sinn: Sie leisteten damit Bezahlung.'
- source_word: עִזְבוֹנָיִךְ
  choice: deine Waren
  rationale: Das Substantiv bezeichnet im Kontext die Handelswaren beziehungsweise das Warensortiment der angesprochenen Stadt Tyrus.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von »Händler« bewahrt die Struktur des Hebräischen; die Handelsformulierung wird idiomatisch wiedergegeben. Der Fußnotenmarker steht unmittelbar bei dem Verb, auf dessen Übersetzungsalternative er sich bezieht.
