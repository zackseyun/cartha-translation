revisions:
- from: Die Händler von Saba und Ragma waren deine Händler. Mit den erlesensten Gewürzen, mit allerlei Edelsteinen und mit Gold bezahlten[a] sie deine Waren.
  to: Die Händler von Saba und Ragma waren deine Händler. Mit den feinsten Gewürzen jeder Art, mit allerlei Edelsteinen und mit Gold bezahlten[a] sie für deine Waren.
  rationale: Die Revision verdeutlicht bei den Gewürzen den im Hebräischen ausgedrückten Umfang »von jeder Art« und verwendet die im Deutschen natürliche Konstruktion »für Waren bezahlen«. Die Fußnote behält die wörtliche Bedeutung des hebräischen Verbs bei und kennzeichnet die kommerzielle Deutung als kontextuelle Sinngebung.
