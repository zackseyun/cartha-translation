  text: סֹֽחֲרִים֙ בָּ֣/עַמִּ֔ים שָׁרְק֖וּ עָלָ֑יִ/ךְ בַּלָּה֣וֹת הָיִ֔ית וְ/אֵינֵ֖/ךְ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/036.yaml
  text: Merchants among the peoples hiss at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: de
  text: Die Händler unter den Völkern zischen über dich[a]. Zu einem Schrecken bist du geworden[b], und du wirst nie mehr sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »pfeifen über dich«. Das hebräische Verb kann Pfeifen oder Zischen bezeichnen; hier drückt es Staunen oder Spott aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu Schrecken bist du geworden« oder »zu etwas Schrecklichem bist du geworden«. Der hebräische Ausdruck steht in der Pluralform und kann zusammenfassend etwas Schreckenerregendes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹחֲרִים
  choice: Händler
  rationale: Das substantivierte Partizip bezeichnet Menschen, die Handel treiben; »Händler« ist im Kontext des Klagelieds über die Handelsstadt Tyrus natürlich und präzise.
- source_word: בָּעַמִּים
  choice: unter den Völkern
  rationale: Der Plural bezeichnet die verschiedenen Völker, in deren Mitte beziehungsweise Kreis die Händler auftreten; »Völker« wahrt den breiten internationalen Bezug.
- source_word: שָׁרְקוּ
  choice: zischen
  rationale: Das Verb kann Pfeifen oder Zischen bezeichnen und drückt in Gerichtstexten häufig staunende oder höhnische Missbilligung aus. »Zischen« gibt die feindselige Reaktion wieder, ohne die mögliche Bedeutung »pfeifen« zu verschweigen.
- source_word: עָלָיִךְ
  choice: über dich
  rationale: Die Präposition עַל kennzeichnet hier den Gegenstand der Reaktion. »Über dich zischen« bewahrt ihre Grundrichtung und ist in gehobenem modernem Deutsch verständlich.
- source_word: בַּלָּהוֹת
  choice: Schreckensbild
  rationale: Der formal plurale Ausdruck bezeichnet Schrecken beziehungsweise etwas Entsetzliches. »Schreckensbild« gibt die kollektive prädikative Bedeutung idiomatisch wieder.
- source_word: הָיִית
  choice: bist du geworden
  rationale: Das Qatal bezeichnet hier den durch das Gericht eingetretenen Zustand; das deutsche Perfekt drückt dieses Ergebnis natürlich aus.
- source_word: וְאֵינֵךְ
  choice: wirst du nicht mehr sein
  rationale: Die negative Existenzform mit anschließendem עַד עוֹלָם bezeichnet das endgültige Verschwinden. Die futurische Wiedergabe passt zur prophetischen Gerichtsaussage.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; »für immer« ist die klare, gegenwärtige deutsche Entsprechung.
theological_decisions:
- issue: Aussagekraft des Schlusses im prophetischen Gerichtswort
  choice: »für immer wirst du nicht mehr sein« als Ausdruck eines endgültigen Endes
  alternative: »du bist für immer dahin«
  rationale: Die Übersetzung bewahrt die Schärfe der negativen Existenzaussage samt עַד עוֹלָם, ohne über den unmittelbaren Sinn des Gerichtswortes hinaus metaphysische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. Die feminine Anrede an Tyrus ist in den Verbformen des Deutschen nicht sichtbar, bleibt aber aus dem Zusammenhang eindeutig. Der Versschluss behält den absoluten, feierlichen Klang des hebräischen Gerichtswortes.
