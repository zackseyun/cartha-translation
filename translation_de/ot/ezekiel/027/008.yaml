  text: יֹשְׁבֵ֤י צִידוֹן֙ וְ/אַרְוַ֔ד הָי֥וּ שָׁטִ֖ים לָ֑/ךְ חֲכָמַ֤יִ/ךְ צוֹר֙ הָ֣יוּ בָ֔/ךְ הֵ֖מָּה חֹבְלָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/008.yaml
  text: The inhabitants of Sidon and Arvad were your rowers; your wise men[a], O Tyre, were within you; they were your pilots.
translation:
  language: de
  text: Die Bewohner von Sidon und Arwad waren deine Ruderer. Deine Weisen[a], Tyrus, waren in dir; sie waren deine Steuerleute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Fachkundigen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das substantivierte Partizip im Konstrukt bezeichnet die in einem Ort Wohnenden; »die Bewohner von« ist im modernen Deutsch natürlich.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Gebräuchliche deutsche Form des phönizischen Städtenamens.
- source_word: וְאַרְוַד
  choice: und Arwad
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: שָׁטִים
  choice: Ruderer
  rationale: Im Schiffsbild bezeichnet das Partizip diejenigen, die das Schiff mit Rudern fortbewegen.
- source_word: לָךְ
  choice: deine
  rationale: Die Präposition mit femininem Singularsuffix wird im Zusammenhang idiomatisch als Zugehörigkeit zu Tyrus wiedergegeben.
- source_word: חֲכָמַיִךְ
  choice: deine Weisen
  rationale: חכם kann sowohl Weisheit als auch fachliche Geschicklichkeit bezeichnen. »Weisen« wahrt die lexikalische Verbindung zur Weisheitssprache, während der nautische Kontext ihre Sachkunde erkennen lässt.
- source_word: צוֹר
  choice: Tyrus
  rationale: Gebräuchliche deutsche Namensform; der Name steht als direkte Anrede.
- source_word: בָךְ
  choice: in dir
  rationale: Die knappe Ortsangabe bewahrt das Bild von Tyrus als Stadt und Schiff, ohne es näher auszudeuten.
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen hebt die zuvor genannten Weisen als Träger der folgenden Funktion hervor.
- source_word: חֹבְלָיִךְ
  choice: deine Steuerleute
  rationale: Das Nomen bezeichnet Schiffsleute und kann besonders diejenigen meinen, die ein Schiff führen oder lenken. »Steuerleute« unterscheidet ihre Aufgabe deutlich von der der Ruderer, ohne sie auf den modernen Berufsbegriff »Lotsen« einzuengen.
