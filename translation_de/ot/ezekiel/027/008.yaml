  register: Modernes, würdevolles Standarddeutsch. Die feminine Anrede und die Possessivformen beziehen sich auf die als Schiff dargestellte Stadt Tyrus. Die Satzglieder folgen der poetischen Parallelstruktur des Hebräischen.
