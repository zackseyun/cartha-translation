source:
  edition: WLC
  text: אֲרָ֥ם סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב מַעֲשָׂ֑יִ/ךְ בְּ֠/נֹפֶךְ אַרְגָּמָ֨ן וְ/רִקְמָ֤ה וּ/בוּץ֙ וְ/רָאמֹ֣ת וְ/כַדְכֹּ֔ד נָתְנ֖וּ בְּ/עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/016.yaml
  text: Aram traded with you because of your many products[a], giving turquoise, purple, embroidered cloth, fine linen, coral[c][b], and rubies for your wares.
translation:
  language: de
  text: Aram trieb wegen deiner vielen Erzeugnisse Handel mit dir. Türkis[a], Purpur, bestickte Stoffe, feines Leinen, Korallen[b] und Rubine[c] gaben sie für deine Waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Smaragde“ oder „Karbunkelsteine“; welcher Edelstein mit dem hebräischen Wort genau gemeint ist, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Möglicherweise ist ein anderes kostbares Material gemeint, etwa Perlmutt; die Bedeutung des hebräischen Wortes ist unsicher.
    reason: lexical_alternative
  - marker: c
    text: Oder „Achate“, „Granatsteine“ oder ein anderer Edelstein; die genaue Bestimmung des hebräischen Wortes ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Aram
  rationale: Der Eigenname wird transliteriert und nicht mit dem modernen geopolitischen Namen „Syrien“ gleichgesetzt; im Handelskontext steht das Land zugleich für seine Händler.
- source_word: סֹחַרְתֵּךְ
  choice: trieb … Handel mit dir
  rationale: Die Form von סחר bezeichnet kaufmännische Tätigkeit; die Wendung ist im modernen Deutschen natürlich und bewahrt den Bezug auf das angesprochene Tyrus.
- source_word: מֵרֹב מַעֲשָׂיִךְ
  choice: wegen deiner vielen Erzeugnisse
  rationale: Wörtlich geht es um die Fülle der gemachten Dinge beziehungsweise Werke; im Handelszusammenhang bezeichnet der Ausdruck die zahlreichen Erzeugnisse von Tyrus.
- source_word: נֹפֶךְ
  choice: Türkis
  rationale: Die genaue Bestimmung des Edelsteins ist unsicher. „Türkis“ ist im Zusammenhang einer Liste von Luxusgütern plausibel; Alternativen werden in einer Fußnote genannt.
- source_word: אַרְגָּמָן
  choice: Purpur
  rationale: Das Wort bezeichnet kostbaren Purpurfarbstoff oder purpurfarbenes Material; „Purpur“ lässt diese sachliche Offenheit bestehen.
- source_word: רִקְמָה
  choice: bestickte Stoffe
  rationale: Gemeint sind Stickereien beziehungsweise bestickte Textilien als Handelsware; die deutsche Wiedergabe macht den konkreten Warencharakter deutlich.
- source_word: בוּץ
  choice: feines Leinen
  rationale: Das Wort bezeichnet einen hochwertigen Leinenstoff; diese Wiedergabe ist klarer und geläufiger als das Fachwort „Byssus“.
- source_word: רָאמֹת
  choice: Korallen
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich ein kostbares Material, doch seine genaue Bedeutung ist unsicher; diese Unsicherheit wird in einer Fußnote offengelegt.
- source_word: כַדְכֹּד
  choice: Rubine
  rationale: Ein kostbarer Stein ist gemeint, dessen genaue mineralogische Bestimmung unsicher bleibt; mögliche Alternativen werden in einer Fußnote genannt.
- source_word: נָתְנוּ
  choice: gaben sie
  rationale: Der hebräische Text wechselt nach dem singularischen Ländernamen „Aram“ zu einem Verb im Plural. „Sie“ lässt erkennen, dass die Händler beziehungsweise Bewohner Arams gemeint sind, ohne den grammatischen Wechsel einzuebnen.
- source_word: בְּעִזְבוֹנָיִךְ
  choice: für deine Waren
  rationale: Das seltene Handelswort bezeichnet Güter oder Handelsware; „für“ gibt den Austauschwert im Deutschen knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Warenliste bleibt knapp und rhythmisch. Der Wechsel vom Ländernamen im Singular zum pluralischen „sie“ bewahrt eine auffällige Eigenheit des hebräischen Textes und lässt Aram als Sammelbezeichnung für seine Händler verstehen. Die drei unsicheren Material- und Edelsteinbezeichnungen werden im Haupttext lesbar wiedergegeben und in den Fußnoten ausdrücklich als unsicher markiert.
