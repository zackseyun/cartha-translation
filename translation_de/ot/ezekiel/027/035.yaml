  text: All the inhabitants of the coastlands are appalled at you[a], and their kings shudder with horror[c][b]; their faces are convulsed.
translation:
  language: de
  text: Alle Bewohner der Küstenländer[a] sind über dich entsetzt. Ihre Könige erbeben heftig[b]; ihre Gesichter zittern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Bewohner der Inseln“. Das hebräische Wort kann Inseln oder, allgemeiner, maritime Küstenländer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen eine intensivierende Verbindung wie „erbeben ein Erbeben“; sie bezeichnet besonders heftiges Erbeben.
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wendung ist schwierig; auch möglich: „ihre Gesichter sind verstört“ oder „ihre Gesichter sind verzerrt“.'
    reason: textual_difficulty
lexical_decisions:
- source_word: כֹּל יֹשְׁבֵי הָאִיִּים
  choice: Alle Bewohner der Küstenländer
  rationale: Die Konstruktverbindung bezeichnet die Bewohner der אִיִּים. Im Seehandelskontext des Tyrus-Klagelieds meint das Wort maritime Länder beziehungsweise Küstengebiete; „Küstenländer“ ist im Deutschen natürlich und lässt die Alternative „Inseln“ in der Fußnote offen.
- source_word: שָׁמְמוּ עָלָיִךְ
  choice: sind über dich entsetzt
  rationale: שׁמם beschreibt hier die bestürzte Reaktion der Zuschauer auf Tyrus. Die Präposition עַל bezeichnet den Anlass beziehungsweise Gegenstand dieser Reaktion; „über dich entsetzt“ bildet beides idiomatisch ab.
- source_word: וּמַלְכֵיהֶם
  choice: Ihre Könige
  rationale: Das Suffix bezieht sich auf die zuvor genannten Küstenländer beziehungsweise deren Bewohner. Ein neuer deutscher Satz bewahrt den Sinn und verbessert die Lesbarkeit.
- source_word: שָׂעֲרוּ שַׂעַר
  choice: schaudern vor Entsetzen
  rationale: Verb und stammverwandtes Substantiv bilden eine intensivierende figura etymologica. Die deutsche Wendung gibt sowohl die körperlich heftige Reaktion als auch die Verstärkung wieder, ohne die unnatürliche Form „schaudern ein Schaudern“ nachzubilden.
- source_word: רָעֲמוּ פָּנִים
  choice: ihre Gesichter sind verzerrt
  rationale: Die schwierige Wendung beschreibt offenbar eine sichtbar heftige Erschütterung des Gesichts. „sind verzerrt“ bewahrt das körperliche Bild; weniger bestimmte Deutungen werden in der Fußnote genannt.
