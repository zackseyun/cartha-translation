  text: וְ/הִשְׁמִ֤יעוּ עָלַ֨יִ/ךְ֙ בְּ/קוֹלָ֔/ם וְ/יִזְעֲק֖וּ מָרָ֑ה וְ/יַעֲל֤וּ עָֽפָר֙ עַל רָ֣אשֵׁי/הֶ֔ם בָּ/אֵ֖פֶר יִתְפַּלָּֽשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/030.yaml
  text: They will make their voice heard over you and cry out bitterly[a]; they will throw dust on their heads[b]; they will roll in ashes.
translation:
  language: de
  text: Sie werden ihre Stimme über dich erschallen lassen und bitterlich schreien; sie werden Staub auf ihre Köpfe werfen und sich in Asche wälzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁמִיעוּ עָלַיִךְ בְּקוֹלָם
  choice: Sie lassen ihre Stimme über dich erschallen
  rationale: Das Hifil von שׁמע bezeichnet das Hörbarwerdenlassen. „Ihre Stimme erschallen lassen“ gibt den Kausativ natürlich wieder; „über dich“ bewahrt den Bezug der Totenklage auf Tyrus.
- source_word: וְיִזְעֲקוּ מָרָה
  choice: und schreien bitterlich
  rationale: זעק bezeichnet einen lauten Klage- oder Hilferuf; מָרָה beschreibt hier adverbial dessen schmerzliche Intensität. „Bitterlich“ ist im Deutschen eine natürliche Verbindung mit Weinen und Schreien.
- source_word: וְיַעֲלוּ עָפָר עַל רָאשֵׁיהֶם
  choice: Sie werfen Staub auf ihre Köpfe
  rationale: עלה bedeutet wörtlich „hinaufbringen“, bezeichnet hier jedoch das Hochwerfen von Staub auf den Kopf als Trauergeste.
- source_word: בָּאֵפֶר יִתְפַּלָּשׁוּ
  choice: und wälzen sich in Asche
  rationale: Das Hitpael von פלשׁ beschreibt hier ein Sichwälzen in Asche als Ausdruck der Trauer. Die Formulierung ist anschaulich und vermeidet eine unnötig abwertende Nebenbedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Trauergesten und das kollektive Singularwort „Stimme“ bleiben erhalten; „über dich“ lässt den Charakter einer Klage über Tyrus erkennen, ohne die Präposition enger festzulegen.
