source:
  edition: WLC
  text: בְּנֵ֧י אַרְוַ֣ד וְ/חֵילֵ֗ךְ עַל חוֹמוֹתַ֨יִ/ךְ֙ סָבִ֔יב וְ/גַ֨מָּדִ֔ים בְּ/מִגְדְּלוֹתַ֖יִ/ךְ הָי֑וּ שִׁלְטֵי/הֶ֞ם תִּלּ֤וּ עַל חוֹמוֹתַ֨יִ/ךְ֙ סָבִ֔יב הֵ֖מָּה כָּלְל֥וּ יָפְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/011.yaml
  text: The sons of Arvad[a], along with your army, were on your walls all around, and the Gammadites were in your towers. They hung their shields on your walls all around; they perfected your beauty.
translation:
  language: de
  text: Die Männer von Arwad und dein Heer standen ringsum auf deinen Mauern, und die Gammaditer[a] waren in deinen Türmen. Ihre Schilde hängten sie ringsum an deinen Mauern auf; sie vollendeten deine Schönheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort גַמָּדִים ist in seiner Bedeutung unsicher. Hier wird es als Volks- oder Herkunftsbezeichnung »Gammaditer« wiedergegeben; andere verstehen es allgemeiner als »Krieger«.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַרְוַד
  choice: die Männer von Arwad
  rationale: Die wörtliche Wendung »Söhne Arwads« ist eine hebräische Bezeichnung für die Bewohner beziehungsweise Männer eines Ortes. »Die Männer von Arwad« gibt den gemeinten ethnogeografischen Sinn in natürlichem Deutsch wieder.
- source_word: חֵילֵךְ
  choice: dein Heer
  rationale: חַיִל bezeichnet hier im Zusammenhang der Mauerverteidigung die militärische Streitmacht der angesprochenen Stadt.
- source_word: עַל חוֹמוֹתַיִךְ סָבִיב
  choice: ringsum auf deinen Mauern
  rationale: Die Formulierung bewahrt sowohl die Stellung auf den Mauern als auch den Gedanken, dass diese rings um die Stadt besetzt waren.
- source_word: גַמָּדִים
  choice: die Gammaditer
  rationale: Das Wort ist dunkel und wahrscheinlich eine Herkunfts- oder Volksbezeichnung. Die lautnahe Wiedergabe vermeidet eine unbelegte Festlegung auf eine allgemeine Bedeutung wie »Krieger«.
- source_word: בְּמִגְדְּלוֹתַיִךְ
  choice: in deinen Türmen
  rationale: Die Präposition ב lässt hier eine örtliche Angabe erwarten; für dort stationierte Verteidiger ist »in deinen Türmen« idiomatisches Deutsch.
- source_word: שִׁלְטֵיהֶם תִּלּוּ
  choice: Ihre Schilde hängten sie … auf
  rationale: שִׁלְטֵיהֶם bezeichnet ihre Schilde, und תִּלּוּ deren Aufhängen. Die deutsche Wortstellung hebt die Schilde entsprechend dem hebräischen Satz hervor.
- source_word: כָּלְלוּ יָפְיֵךְ
  choice: sie vollendeten deine Schönheit
  rationale: כָּלְלוּ bedeutet hier »vollständig machen, vollenden«. Die direkte Wiedergabe erhält das poetische Bild, wonach die Verteidiger und ihre aufgehängten Schilde zur vollkommenen Schönheit Tyrus’ beitragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstruktur. Die Anredeformen im Femininum Singular beziehen sich auf die personifizierte Stadt Tyrus. Die Wiederholung von »ringsum« und »deinen Mauern« folgt bewusst dem hebräischen Text.
