base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/032.yaml
  text: 'They will raise a lamentation over you in their wailing[a], and they will lament over you: ‘Who is like Tyre[b], silenced in the midst of the sea?’'
translation:
  language: de
  text: 'Bei ihrem Wehklagen[a] stimmen sie über dich ein Klagelied an und klagen über dich: »Wer ist wie Tyrus, die Verstummte[b] mitten im Meer?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Form ist hier textlich und lexikalisch schwierig. Nach der masoretischen Vokalisierung lautet sie wörtlich „bei/mit ihren Söhnen“; im Zusammenhang wird sie auch als Hinweis auf den Klageruf beziehungsweise das Wehklagen verstanden.
    reason: textual_variant
  - marker: b
    text: 'Oder: „die zum Schweigen Gebrachte“; möglicherweise auch: „die Verwüstete“. Das hebräische Wort kann ein Verstummen oder Stillwerden bezeichnen und wird im Zusammenhang auch auf die Verwüstung der Stadt bezogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: stimmen ... ein Klagelied an
  rationale: נשׂא mit קינה ist eine feste Wendung für das Anheben oder Vortragen eines Klagelieds. Die deutsche Formulierung gibt den idiomatischen Sinn natürlich und würdig wieder.
- source_word: אֵלַיִךְ / עָלָיִךְ
  choice: über dich
  rationale: Im Zusammenhang der Totenklage bezeichnet die Präposition jeweils die Person beziehungsweise Stadt, der die Klage gilt; „über dich“ entspricht dem natürlichen deutschen Klageidiom.
- source_word: בְּנִיהֶם
  choice: bei ihrem Wehklagen
  rationale: Die masoretisch vokalisierte Form ist schwierig und bedeutet formal „bei/mit ihren Söhnen“. Der unmittelbare Kontext von Klagelied und Klagen legt jedoch eine Äußerung des Trauerns nahe. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: קִינָה
  choice: Klagelied
  rationale: קינה bezeichnet eine förmliche Toten- oder Trauerklage. „Klagelied“ bewahrt den poetischen Charakter und ist im modernen Deutsch gut verständlich.
- source_word: וְקוֹנְנוּ
  choice: und klagen
  rationale: Das Verb bezeichnet das Vortragen einer Klage. „klagen“ erhält die Wortverbindung zu „Klagelied“, ohne den Satz unnötig zu beschweren.
- source_word: מִי כְצוֹר
  choice: Wer ist wie Tyrus
  rationale: Die direkte Vergleichsfrage wird formal und verständlich wiedergegeben; „Tyrus“ ist die übliche deutsche Namensform.
- source_word: כְּדֻמָה
  choice: die Verstummte
  rationale: Die Form beschreibt Tyrus bildhaft als still beziehungsweise zum Schweigen gebracht. Die substantivierte feminine Form wahrt die poetische Personifikation und vermeidet es, die mögliche Bedeutung vorschnell auf völlige Vernichtung festzulegen.
- source_word: בְּתוֹךְ הַיָּם
  choice: mitten im Meer
  rationale: Die knappe deutsche Wendung gibt die räumliche Aussage und das maritime Bild des hebräischen Ausdrucks natürlich wieder.
