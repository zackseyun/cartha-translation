translation:
  language: de
  text: Beim Klang des Geschreis deiner Seeleute[a] werden die Weideflächen[b] erbeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ruderer“ beziehungsweise „Schiffsleute“; das hebräische Wort kann genauer Besatzungsmitglieder bezeichnen, die Taue oder Ruder handhaben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Freiflächen“ beziehungsweise „Gemeindeland“; gemeint ist offenes Land außerhalb einer Siedlung, nicht ein moderner Vorort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל
  choice: Beim Schall
  rationale: קוֹל bezeichnet Stimme, Laut oder Schall. Mit der Präposition לְ gibt die Wendung hier den Anlass bzw. den Zeitpunkt des Erbebens an; „beim Schall“ wahrt das Bild und ist im Deutschen verständlich.
- source_word: זַעֲקַת
  choice: des Hilferufs
  rationale: Das von זעק abgeleitete Substantiv bezeichnet einen lauten, häufig aus Bedrängnis hervorgehenden Ruf. „Hilferuf“ macht den Klage- und Notkontext deutlich, ohne die Aussage auszuschmücken.
- source_word: חֹבְלָיִךְ
  choice: deiner Seeleute
  rationale: Der Ausdruck bezeichnet Männer der Schiffsbesatzung, möglicherweise genauer diejenigen, die Taue oder Ruder handhaben. „Seeleute“ ist im Kontext von Tyrus natürlich und lässt die genaue Tätigkeit offen; engere Möglichkeiten werden in der Fußnote genannt.
- source_word: יִרְעֲשׁוּ
  choice: werden … erbeben
  rationale: רעש bezeichnet heftiges Beben, Erschüttern oder Zittern. „Erbeben“ erhält die kraftvolle poetische Sprache des Gerichtsklagelieds.
- source_word: מִגְרֹשׁוֹת
  choice: die Weideflächen
  rationale: מִגְרָשׁ bezeichnet gewöhnlich offenes, oft als Weideland genutztes Gelände außerhalb einer Siedlung. „Weideflächen“ gibt diesen konkreten antiken Sinn wieder und vermeidet das heute irreführende „Vororte“.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene Standardsprache mit dem poetisch kräftigen Verb „erbeben“. Die ungewöhnliche Verbindung von Seefahrern und Weideflächen wird als Bild des hebräischen Textes bewahrt und nicht kontextuell zu „Küsten“ umgedeutet.
