  text: בְּרוֹשִׁ֤ים מִ/שְּׂנִיר֙ בָּ֣נוּ לָ֔/ךְ אֵ֖ת כָּל לֻֽחֹתָ֑יִם אֶ֤רֶז מִ/לְּבָנוֹן֙ לָקָ֔חוּ לַ/עֲשׂ֥וֹת תֹּ֖רֶן עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/005.yaml
  text: With cypresses from Senir they built all your planking[b][a]; they took a cedar from Lebanon to make a mast for you.
translation:
  language: de
  text: Aus Zypressenholz vom Senir bauten sie deine ganze Beplankung[a][b]; eine Zeder vom Libanon nahmen sie, um auf dir einen Mast zu errichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wacholderholz« oder »Tannenholz«; welche Baumart das hebräische Wort בְּרוֹשִׁים genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Senir ist eine Landschaftsbezeichnung, die mit dem Hermon verbunden ist (vgl. 5. Mose 3,9).
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוֹשִׁים
  choice: Zypressenholz
  rationale: Das hebräische Wort bezeichnet wohl eine Nadelbaumart, deren genaue Bestimmung unsicher ist. »Zypressenholz« ist im Schiffbaukontext natürlich und bewahrt die geläufige Zuordnung; Alternativen stehen in der Fußnote.
- source_word: מִשְּׂנִיר
  choice: vom Senir
  rationale: Der Ortsname wird als »Senir« wiedergegeben. Er bezeichnet eine mit dem Hermon verbundene Gegend.
- source_word: בָּנוּ לָךְ
  choice: bauten sie deine
  rationale: בנה bedeutet gewöhnlich »bauen«. Die deutsche Satzfügung verbindet das Verb natürlich mit der Beplankung und gibt den Bezug zur angesprochenen Stadt beziehungsweise zum bildlich dargestellten Schiff durch »deine« wieder.
- source_word: אֵת כָּל לֻחֹתָיִם
  choice: deine ganze Beplankung
  rationale: לוּחַ bezeichnet ein Brett oder eine Planke. Im Schiffbau ist der kollektive Ausdruck »Beplankung« präzise und idiomatisch; das feminine Suffix wird mit »deine« ausgedrückt.
- source_word: אֶרֶז מִלְּבָנוֹן
  choice: eine Zeder vom Libanon
  rationale: Der Singular wird konkret als einzelner Baum beziehungsweise dessen Stamm verstanden, der zum Mast verarbeitet wird.
- source_word: לָקָחוּ
  choice: nahmen sie
  rationale: Die Grundbedeutung von לקח ist »nehmen«. Diese Wiedergabe bleibt eng am hebräischen Wortlaut.
- source_word: לַעֲשׂוֹת תֹּרֶן
  choice: um einen Mast anzufertigen
  rationale: תֹּרֶן bedeutet »Mast«. »Anfertigen« gibt עשה in diesem handwerklichen Zusammenhang natürlich wieder.
- source_word: עָלָיִךְ
  choice: für dich
  rationale: Wörtlich ist die Präposition örtlich beziehungsweise relational (»auf dir/an dir«); im Zusammenhang der Herstellung eines Schiffsteils gibt »für dich« den idiomatischen Sinn wieder und bewahrt die direkte Anrede.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Beplankung« bewahrt das konkrete Schiffbaubild; die feminine Anrede an Tyrus beziehungsweise das personifizierte Schiff wird durch »deine« und »dich« erhalten.
