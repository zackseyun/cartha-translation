source:
  edition: WLC
  text: אַלּוֹנִים֙ מִ/בָּ֔שָׁן עָשׂ֖וּ מִשּׁוֹטָ֑יִ/ךְ קַרְשֵׁ֤/ךְ עָֽשׂוּ שֵׁן֙ בַּת אֲשֻׁרִ֔ים מֵ/אִיֵּ֖י כתים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/006.yaml
  text: They made your oars of oaks from Bashan[c][b][a]; they made your deck of ivory from the coasts of Kittim.
translation:
  language: de
  text: Aus Eichen vom Baschan machten sie deine Ruder; deine Planken machten sie aus Elfenbein, einer Tochter von Aschurim, von den Inseln Kittims.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck „Elfenbein, eine Tochter von Aschurim“ ist schwer verständlich. Manche deuten ihn als Elfenbein, das in eine aus Kittim stammende Holzart – etwa Zypresse oder Buchsbaum – eingelegt war.
    reason: alternative_reading
  - marker: b
    text: „Kittim“ bezeichnet wahrscheinlich Zypern oder darüber hinaus westliche Insel- und Küstengebiete.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוֹנִים
  choice: Eichen
  rationale: Das Wort bezeichnet große, feste Laubbäume und wird häufig mit „Eichen“ wiedergegeben; für das als holzreich bekannte Baschan ist dies sachlich und sprachlich passend.
- source_word: מִבָּשָׁן
  choice: vom Baschan
  rationale: Die Präposition bezeichnet die Herkunft des Holzes; der traditionelle deutsche Artikelgebrauch bei Baschan klingt natürlich.
- source_word: מִשּׁוֹטָיִךְ
  choice: deine Ruder
  rationale: Im durchgehenden Schiffsbild sind eindeutig Geräte zum Rudern gemeint.
- source_word: קַרְשֵׁךְ
  choice: deine Planken
  rationale: Das Substantiv bezeichnet Bretter oder Bohlen. „Planken“ wahrt die konkrete schiffbauliche Bedeutung besser als die funktional engere Wiedergabe „Deck“.
- source_word: שֵׁן
  choice: Elfenbein
  rationale: Wörtlich „Zahn“, bezeichnet das Wort in Materialangaben idiomatisch Elfenbein.
- source_word: בַּת אֲשֻׁרִים
  choice: einer Tochter von Aschurim
  rationale: Die schwierige masoretische Lesart wird eng am überlieferten Wortlaut wiedergegeben, ohne eine bestimmte Holzart oder Einlegearbeit in den Haupttext hineinzulesen.
- source_word: מֵאִיֵּי כִתִּים
  choice: von den Inseln Kittims
  rationale: אִיִּים bedeutet Inseln beziehungsweise Küstenländer. Die formnahe Wiedergabe lässt die geografische Reichweite offen; Kittim wird als Ortsname transliteriert.
