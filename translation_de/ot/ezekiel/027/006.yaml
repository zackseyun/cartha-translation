review_pass:
  verdict: revise
  source_fidelity: Der erste Satz gibt die Herkunftsangabe und den Schiffbaukontext zutreffend wieder. Im zweiten Satz steht קַרְשֵׁךְ im Singular; die Wiedergabe „deine Planken“ ist daher weniger formnah. Die Verbindung שֵׁן בַּת־אֲשֻׁרִים ist tatsächlich schwer verständlich und sollte nicht als gesicherte Einlegearbeit oder bestimmte Holzart in den Haupttext aufgelöst werden. Die geografische Angabe bezieht sich auf die ganze schwierige Material-/Herstellungsangabe.
  naturalness: „Einer Tochter von Aschurim“ ist als Dativ-Apposition nach „aus Elfenbein“ syntaktisch irreführend und im Deutschen kaum verständlich. Eine als solche markierte, wörtlich beibehaltene Bezeichnung wahrt die Schwierigkeit des Hebräischen, ohne einen ungrammatischen Satz zu erzeugen.
  terminology: „Eichen“, „Baschan“, „Ruder“, „Elfenbein“ und „Kittim“ sind angemessen. „Planke“ gibt das singularische קֶרֶשׁ konkret wieder; die Fußnote hält die mögliche umfassendere Bedeutung als Brett/Beplankung fest. „Aschuriter“ bildet אַשֻּׁרִים als Personen-/Volksbezeichnung natürlicher ab als das nicht näher bestimmbare „Aschurim“.
  issues:
  - severity: medium
    issue: Singular von קַרְשֵׁךְ nicht gewahrt
    rationale: Das hebräische Wort steht als singularische Konstruktform mit Suffix. „Planke“ ist die formnähere deutsche Wiedergabe; eine kollektive Bedeutung kann die Fußnote nennen.
  - severity: high
    issue: Syntaktisch missverständliche Wiedergabe von בַּת אֲשֻׁרִים
    rationale: „aus Elfenbein, einer Tochter von Aschurim“ lässt die Dativ-Apposition wie eine Erklärung von Elfenbein wirken und ist zugleich unverständlich. Die schwierige überlieferte Bezeichnung muss sichtbar bleiben, aber als zitierte Bezeichnung markiert werden.
  - severity: low
    issue: Fußnote nennt die Herkunft nur für die Holzart
    rationale: מֵאִיֵּי כִתִּים folgt der gesamten schwierigen Wortgruppe; die Anmerkung sollte daher nicht den Eindruck erwecken, die Herkunft sei im Hebräischen ausschließlich der rekonstruierten Holzart zugeordnet.
  revised_text: Aus Eichen vom Baschan machten sie deine Ruder; deine Planke machten sie aus Elfenbein, aus der „Tochter der Aschuriter“, von den Inseln Kittims.[a][b]
  revised_footnotes:
  - marker: a
    text: Der hebräische Ausdruck lautet wörtlich etwa „Elfenbein, Tochter der Aschuriter“ und ist schwer verständlich. Viele deuten die Wendung als Elfenbein, das mit einer Holzart – etwa Buchsbaum oder Zypresse – aus Kittim verbunden oder eingelegt war. Diese Deutung ist unsicher.
    reason: alternative_reading
  - marker: b
    text: „Kittim“ bezeichnet wahrscheinlich Zypern oder, weiter gefasst, westliche Insel- und Küstengebiete. Die Herkunftsangabe steht im Hebräischen bei der gesamten schwierigen Materialangabe.
    reason: cultural_note
  - marker: c
    text: 'Oder: „dein Brett/deine Beplankung“; der genaue Schiffsteil ist nicht sicher.'
    reason: lexical_alternative
  revision_rationale: Die Revision wahrt den Singular von קַרְשֵׁךְ und beseitigt die unnatürliche Dativ-Apposition. Die textlich schwierige Wendung בַּת אֲשֻׁרִים wird nicht harmonisierend als Holzart oder Einlegearbeit übersetzt, sondern im Haupttext ausdrücklich als überlieferte, unklare Bezeichnung kenntlich gemacht. Die Fußnoten bieten die verbreitete Deutung nur als unsichere Möglichkeit und verorten die Herkunftsangabe korrekt.
