base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/024.yaml
  text: They were your merchants in choice wares[a], in wraps of blue and embroidered cloth, and in treasuries of multicolored fabrics, bound with cords and secured[b], among your merchandise.
translation:
  language: de
  text: 'Sie waren deine Händler für erlesene Waren: für Tücher aus blaupurpurnem Stoff und besticktes Gewebe sowie für Behälter mit vielfarbigen Stoffen[b], die mit Schnüren verschnürt und fest verpackt waren[a], unter deinen Handelswaren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Zedernholz verpackt« beziehungsweise »in Zedernholzkisten«. Das hebräische Wort ist schwer zu deuten und kann statt einer weiteren Beschreibung der Verpackung auf Zedernholz bezogen werden.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Wendung ist unsicher. Sie kann wertvolle Vorräte, Truhen oder Bündel mit verschiedenfarbigen Textilien bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלַיִךְ
  choice: deine Händler
  rationale: Das Wort bezeichnet hier die Kaufleute in Tyrus’ weitreichendem Handelsnetz. »Händler« ist im Deutschen natürlich und passt zum wiederkehrenden Handelswortschatz des Kapitels.
- source_word: מַכְלֻלִים
  choice: erlesene Waren
  rationale: Der Ausdruck meint im Handelszusammenhang kostbare, hochwertige oder kunstvoll gefertigte Erzeugnisse. »Erlesene Waren« gibt diesen Sinn verständlich wieder, ohne die unsichere genaue Warenart festzulegen.
- source_word: גְלוֹמֵי תְּכֵלֶת
  choice: Tücher aus blauem Purpur
  rationale: גְלוֹמִים bezeichnet hier wahrscheinlich textile Umhüllungen, Tücher oder Stoffgebinde; תְּכֵלֶת ist ein kostbarer blau bis blauviolett gefärbter Stoff. »Tücher aus blauem Purpur« ist anschaulich und lässt offen, ob fertige Kleidungsstücke oder verpackte Stoffe gemeint sind.
- source_word: רִקְמָה
  choice: besticktes Gewebe
  rationale: In dieser Warenliste bezeichnet das Wort Stickarbeit beziehungsweise bestickten Stoff. Die konkrete Wiedergabe als »besticktes Gewebe« passt zum textilen Zusammenhang.
- source_word: גִנְזֵי בְּרֹמִים
  choice: Behälter mit vielfarbigen Stoffen
  rationale: Beide Bestandteile der Wendung sind schwierig. גִנְזֵי kann Vorräte, Schatzbehälter oder Truhen bezeichnen; בְּרֹמִים wird häufig auf bunte beziehungsweise verschiedenfarbige Textilien bezogen. Die Übersetzung bildet eine plausible Handelsszene ab, während die Fußnote die Unsicherheit offenlegt.
- source_word: חֲבָלִים חֲבֻשִׁים
  choice: mit Schnüren verschnürt
  rationale: Die Wendung beschreibt mit Stricken oder Schnüren gebundene Warenbehälter beziehungsweise Bündel. Die leichte Wortwiederholung entspricht der bildhaften hebräischen Formulierung und klingt im Deutschen noch natürlich.
- source_word: אֲרֻזִים
  choice: fest verpackt
  rationale: Im Anschluss an das Verschnüren liegt eine weitere Beschreibung gesicherter Verpackung nahe. Da die Form auch mit »Zeder« verbunden und auf Zedernholzbehälter bezogen werden kann, wird diese Alternative in einer Fußnote bewahrt.
- source_word: מַרְכֻלְתֵּךְ
  choice: deine Handelswaren
  rationale: Das Substantiv bezeichnet in Hesekiel 27 den Warenhandel oder konkret die gehandelten Güter. Hier passt wegen der vorausgehenden Aufzählung die konkrete Wiedergabe »Handelswaren«.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit konkretem Handelswortschatz. Der Gedankenstrich gliedert die lange Warenliste und bindet die abschließende Wendung natürlich ein. Die beiden wesentlichen lexikalischen Unsicherheiten werden nicht im Haupttext überladen, sondern transparent in Fußnoten bewahrt.
