    issue: „Totenklage“ ist zu spezifisch für מִסְפֵּד.
    rationale: Das Wort bezeichnet zwar häufig eine Toten- bzw. Begräbnisklage, kann aber allgemein eine intensive Wehklage meinen. Da Tyros poetisch angesprochen wird, sollte die Übersetzung die Todesassoziation nicht ausdrücklich festlegen.
  - severity: low
    issue: „Seelennot“ interpretiert die hebräische Wendung stärker als nötig.
    rationale: בְּמַר נֶפֶשׁ bedeutet wörtlich Bitterkeit der Seele bzw. tiefen inneren Schmerz. „Mit bitterem Herzen“ ist idiomatisch und bewahrt das Bild ohne abstraktisierende Zuspitzung.
  revised_text: Sie werden sich deinetwegen kahl scheren, sich Sacktuch umbinden und über dich weinen – mit bitterem Herzen, in bitterer Klage.
