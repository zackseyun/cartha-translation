  text: וְ/הִקְרִ֤יחוּ אֵלַ֨יִ/ךְ֙ קָרְחָ֔ה וְ/חָגְר֖וּ שַׂקִּ֑ים וּ/בָכ֥וּ אֵלַ֛יִ/ךְ בְּ/מַר נֶ֖פֶשׁ מִסְפֵּ֥ד מָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/031.yaml
  text: They will make themselves bald for you[a], and put on sackcloth, and they will weep over you with bitterness of soul, with bitter mourning.
translation:
  language: de
  text: Sie werden sich deinetwegen kahl scheren, sich Sacktuch umbinden und über dich weinen – mit bitterem Herzen, in bitterer Klage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיחוּ אֵלַיִךְ קָרְחָה
  choice: Sie werden sich deinetwegen eine Glatze scheren
  rationale: Die Verbindung aus dem Hifil von קרח und dem verwandten Substantiv קָרְחָה bezeichnet das Herbeiführen einer kahlen Stelle als Trauerzeichen. „Sich eine Glatze scheren“ gibt die Handlung idiomatisch wieder; „deinetwegen“ erfasst אֵלַיִךְ als Angabe des Anlasses der Trauer.
- source_word: וְחָגְרוּ שַׂקִּים
  choice: sich Sacktuch umbinden
  rationale: חגר bezeichnet das Umgürten beziehungsweise Umbinden; שַׂקִּים steht für groben Trauerstoff. Die Formulierung bewahrt das konkrete Kleidungsbild und klingt zugleich verständlich.
- source_word: וּבָכוּ אֵלַיִךְ
  choice: über dich weinen
  rationale: Bei בכה bezeichnet אֵלַיִךְ hier diejenige, der die Klage gilt. Im Deutschen ist „über dich weinen“ die natürliche Wiedergabe.
- source_word: בְּמַר נֶפֶשׁ
  choice: in bitterer Seelennot
  rationale: Wörtlich steht „in Bitterkeit der Seele“. „Seelennot“ bewahrt die innere, personale Dimension von נֶפֶשׁ, ohne die Wendung im Deutschen unnötig spröde wirken zu lassen.
- source_word: מִסְפֵּד מָר
  choice: in bitterer Totenklage
  rationale: מִסְפֵּד bezeichnet eine Klage um einen Verstorbenen beziehungsweise eine Totenklage. Das Adjektiv מָר verstärkt ihre schmerzliche Bitterkeit.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Reihung der äußeren Trauerzeichen und der inneren Klage bleibt erhalten; der Gedankenstrich macht den abschließenden, intensivierenden Doppelausdruck im Deutschen klar.
