- from: Sie werden sich deinetwegen eine Glatze scheren, sich Sacktuch umbinden und über dich weinen – in bitterer Seelennot, in bitterer Totenklage.
  to: Sie werden sich deinetwegen kahl scheren, sich Sacktuch umbinden und über dich weinen – mit bitterem Herzen, in bitterer Klage.
