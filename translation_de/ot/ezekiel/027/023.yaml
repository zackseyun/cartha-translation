  text: חָרָ֤ן וְ/כַנֵּה֙ וָ/עֶ֔דֶן רֹכְלֵ֖י שְׁבָ֑א אַשּׁ֖וּר כִּלְמַ֥ד רֹכַלְתֵּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/023.yaml
  text: Haran and Canneh and Eden[a], the merchants of Sheba, Asshur, and Kilmad[b], traded with you.
translation:
  language: de
  text: Haran, Kanne und Eden sowie die Händler aus Saba, Assur und Kilmad waren deine Händler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָרָן
  choice: Haran
  rationale: Ortsname; in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: כַנֵּה
  choice: Kanne
  rationale: Der seltene Ortsname wird nahe an der masoretischen Konsonantenform wiedergegeben; die mögliche Gleichsetzung mit Kalne bleibt in einer Fußnote erhalten.
- source_word: עֶדֶן
  choice: Eden
  rationale: Hier ein Ortsname innerhalb einer Liste von Handelsorten, nicht eine Anspielung auf den Garten Eden.
- source_word: רֹכְלֵי
  choice: die Händler von
  rationale: Der Konstruktplural bezeichnet Kaufleute beziehungsweise Händler und wird idiomatisch mit der folgenden Ortsangabe verbunden.
- source_word: שְׁבָא
  choice: Saba
  rationale: Traditionelle und allgemein verständliche deutsche Form des Orts- beziehungsweise Volksnamens.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Bewahrt die hebräische Namensform; je nach Bezug kann auch das Land Assyrien gemeint sein.
- source_word: כִּלְמַד
  choice: Kilmad
  rationale: Seltener und unsicher identifizierter Ortsname; eine Transliteration vermeidet unbegründete Festlegungen.
- source_word: רֹכַלְתֵּךְ
  choice: trieben Handel mit dir
  rationale: Gibt den kommerziellen Sinn des Verbs in natürlichem modernem Deutsch wieder und bezieht das feminine Suffix auf Tyrus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Ortsnamen und die genuine Unsicherheit bei seltenen Namen bleiben erhalten; „trieben Handel mit dir“ ist idiomatisch, ohne den Aussagegehalt zu erweitern.
