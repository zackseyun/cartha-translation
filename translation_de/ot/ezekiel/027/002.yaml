base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/002.yaml
  text: And you[a], son of man, raise a lamentation over Tyre,
translation:
  language: de
  text: Und du, Menschensohn, stimme ein Klagelied über Tyrus an:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Erhebe ein Klagelied über Tyrus.“ Das hebräische Verb bedeutet „heben“ und ist in dieser Wendung eine übliche Formel für das Anstimmen oder Beginnen einer Klage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Und du
  rationale: Die Verbindung aus Konjunktion und selbstständigem Pronomen kennzeichnet einen Übergang und eine betonte direkte Anrede. „Und du“ bewahrt den hebräischen Redeanschluss.
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Dies ist die feste göttliche Anrede an Ezechiel. „Menschensohn“ bewahrt die traditionelle, formnahe Wiedergabe und den Unterschied zwischen dem menschlichen Propheten und Gott.
- source_word: שָׂא
  choice: stimme … an
  rationale: Das Verb bedeutet wörtlich „heben/tragen“, bildet mit קִינָה jedoch eine feste Wendung für das Anheben beziehungsweise Beginnen einer Klage. „Eine Totenklage anstimmen“ ist im Deutschen natürlich und wahrt das Bild des einsetzenden Klagevortrags.
- source_word: עַל
  choice: über
  rationale: Bei einer Klage bezeichnet die Präposition deren Gegenstand. „Über“ ist idiomatisch und vermeidet die feindselige Färbung von „gegen“.
- source_word: צֹר
  choice: Tyrus
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: קִינָה
  choice: Totenklage
  rationale: Das Substantiv bezeichnet eine formelle Klage, häufig über Tod oder Untergang. „Totenklage“ passt zum angekündigten Untergang von Tyrus und zum gehobenen prophetischen Register.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die traditionelle Ezechiel-Anrede „Menschensohn“ bleibt erhalten; „eine Totenklage anstimmen“ gibt die hebräische Klageformel natürlich wieder.
