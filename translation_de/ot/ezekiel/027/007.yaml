  register: Modernes, würdevolles Standarddeutsch. Die weiblichen Formen des hebräischen Textes beziehen sich auf Tyrus, das im Zusammenhang als Schiff dargestellt wird. Die Satzteilung macht die beiden Stoffangaben gut lesbar; die maritime Bildsprache bleibt erhalten.
