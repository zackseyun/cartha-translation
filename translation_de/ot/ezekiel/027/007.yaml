  text: שֵׁשׁ בְּ/רִקְמָ֤ה מִ/מִּצְרַ֨יִם֙ הָיָ֣ה מִפְרָשֵׂ֔/ךְ לִ/הְי֥וֹת לָ֖/ךְ לְ/נֵ֑ס תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן מֵ/אִיֵּ֥י אֱלִישָׁ֖ה הָיָ֥ה מְכַסֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/007.yaml
  text: Fine embroidered linen from Egypt was your sail[a], serving as your banner[b]; blue and purple from the coasts of Elishah was your covering.
translation:
  language: de
  text: Feines, besticktes Leinen aus Ägypten war dein Segel; es diente dir als Banner[a]. Blauer und purpurfarbener Stoff von den Küsten Elischas[b] bildete dein Verdeck.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als dein Feldzeichen“ beziehungsweise „als dein weithin sichtbares Signal“. Das hebräische Wort bezeichnet ein Banner, Feldzeichen oder Signal.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von den Inseln Elischas“. Das hebräische Wort kann Inseln oder Küstenländer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ בְּרִקְמָה
  choice: feines, besticktes Leinen
  rationale: שֵׁשׁ bezeichnet hochwertiges Leinen, רִקְמָה kunstvoll gearbeitete beziehungsweise bestickte Textilien. Die Formulierung bewahrt sowohl Material als auch Verarbeitung.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition bezeichnet hier die Herkunft des kostbaren Stoffes.
- source_word: מִפְרָשֵׂךְ
  choice: dein Segel
  rationale: Im durchgehenden Schiffsbild für Tyrus bezeichnet מִפְרָשׂ das Segel.
- source_word: לִהְיוֹת לָךְ לְנֵס
  choice: es diente dir als Banner
  rationale: נֵס kann ein weithin sichtbares Banner, Feldzeichen oder Signal bezeichnen. „Banner“ ist verständlich und erhält die Funktion des Segels als sichtbares Kennzeichen.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: blauer und purpurfarbener Stoff
  rationale: Die Wörter bezeichnen kostbare blau beziehungsweise blauviolett und purpur gefärbte Materialien. „Stoff“ macht den im Kontext vorausgesetzten Gegenstand im Deutschen natürlich deutlich.
- source_word: מֵאִיֵּי אֱלִישָׁה
  choice: von den Küsten Elischas
  rationale: אִיִּים kann sowohl Inseln als auch Küstenländer bezeichnen. Im maritimen Handelskontext ist „Küsten“ eine natürliche Hauptübersetzung; die echte Alternative wird in einer Fußnote erhalten.
- source_word: מְכַסֵּךְ
  choice: bildete dein Verdeck
  rationale: Das Wort bezeichnet etwas Bedeckendes. Im Schiffsbild gibt „Verdeck“ die Funktion knapp und anschaulich wieder, ohne eine übermäßig spezielle Bauform festzulegen.
theological_decisions: []
