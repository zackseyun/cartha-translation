base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben, hier „Jahwe“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Waw-Konsekutiv-Form von היה führt hier den nächsten Erzähl- bzw. Offenbarungsabschnitt ein. Zusammen mit דְבַר יְהוָה entspricht die natürliche deutsche prophetische Formel „Und das Wort … erging“ dem Sinn besser als das wörtlichere „Und es geschah“.
- source_word: דְבַר
  choice: das Wort
  rationale: Im Konstruktus דְבַר יְהוָה bezeichnet das Wort die göttliche Mitteilung. „Wort“ bewahrt die feste prophetische Formel und ihre theologische Prägung, ohne sie interpretierend zu „Botschaft“ zu verengen.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird im Deutschen in seiner gebräuchlichen wissenschaftlichen Form „Jahwe“ wiedergegeben; der Genitiv „Jahwes“ fügt sich natürlich in die Konstruktion „das Wort Jahwes“ ein.
- source_word: אֵלַי
  choice: an mich
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bezeichnet die Ausrichtung auf den Propheten. In der festen deutschen Wendung lautet die natürliche Entsprechung „erging an mich“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Da der Vers an dieser Stelle endet und die Rede im nächsten Vers beginnt, gibt ein Doppelpunkt diese Funktion im heutigen Deutsch knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt, damit die liturgische und übersetzerische Tradition transparent bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etablierte prophetische Formel „das Wort Jahwes erging an mich“ wahrt die Nähe zum Hebräischen, während der Doppelpunkt die Funktion von לֵאמֹר natürlicher wiedergibt als ein angehängtes „indem er sprach“ oder „mit den Worten“.
