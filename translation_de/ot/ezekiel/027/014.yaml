  text: מִ/בֵּ֖ית תּוֹגַרְמָ֑ה סוּסִ֤ים וּ/פָֽרָשִׁים֙ וּ/פְרָדִ֔ים נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
translation:
  language: de
  text: Aus Bet-Togarma[a] lieferten sie Pferde, Reitpferde[b] und Maultiere im Tausch gegen deine Waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Haus Togarmas“. Der hebräische Ausdruck kann das mit Togarma verbundene Volk oder Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Reiter“. Das hebräische Wort bezeichnet oft Reiter oder Kavalleristen; die Stellung in einer Liste von Handelsgütern zwischen Pferden und Maultieren spricht hier jedoch für eine Pferdeart beziehungsweise für Pferde der Reiterei.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  choice: Aus Bet-Togarma
  rationale: בֵּית bedeutet wörtlich „Haus“, kann in einer geografisch-ethnischen Verbindung aber ein Volk oder Gebiet bezeichnen. „Bet-Togarma“ bewahrt die überlieferte Namensform, ohne ein wörtliches Wohnhaus nahezulegen.
- source_word: סוּסִים
  choice: Pferde
  rationale: Die übliche und im Handelsverzeichnis eindeutige Bedeutung des hebräischen Plurals.
- source_word: וּפָרָשִׁים
  choice: Reitpferde
  rationale: פָרָשִׁים bezeichnet häufig Reiter oder Kavalleristen. Da der Ausdruck hier zwischen Pferden und Maultieren in einer Warenliste steht, ist eine Bezeichnung für zum Reiten beziehungsweise für die Reiterei bestimmte Pferde kontextuell wahrscheinlich. Die alternative personenbezogene Bedeutung bleibt in der Fußnote erhalten.
- source_word: וּפְרָדִים
  choice: und Maultiere
  rationale: פְרָדִים ist die reguläre Bezeichnung für Maultiere und passt zur Aufzählung gehandelter Tiere.
- source_word: נָתְנוּ
  choice: lieferten sie
  rationale: Das Verb bedeutet wörtlich „sie gaben“. Im Handelskontext von Ezechiel 27 gibt „lieferten sie“ die kommerzielle Funktion natürlich wieder.
- source_word: עִזְבוֹנָיִךְ
  choice: im Tausch gegen deine Waren
  rationale: Das seltene Handelswort bezeichnet hier die Waren beziehungsweise Handelsgüter Tyrus’. Zusammen mit נָתְנוּ wird der Tauschvorgang im Deutschen klar und idiomatisch ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Lieferten … im Tausch gegen“ macht den Handelszusammenhang deutlich; die ungewöhnliche Namensform und die Mehrdeutigkeit von פָרָשִׁים werden durch Fußnoten transparent gehalten.
