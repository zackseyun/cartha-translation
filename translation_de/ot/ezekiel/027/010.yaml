source:
  edition: WLC
  text: פָּרַ֨ס וְ/ל֤וּד וּ/פוּט֙ הָי֣וּ בְ/חֵילֵ֔/ךְ אַנְשֵׁ֖י מִלְחַמְתֵּ֑/ךְ מָגֵ֤ן וְ/כוֹבַע֙ תִּלּוּ בָ֔/ךְ הֵ֖מָּה נָתְנ֥וּ הֲדָרֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/010.yaml
  text: Persia[a], Lud, and Put were in your army as your men of war. They hung shield and helmet in you[b]; they gave you splendor.
translation:
  language: de
  text: Perser, Lud und Put dienten in deinem Heer als deine Krieger. Schild und Helm hängten sie in dir auf[a]; sie verliehen dir Glanz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hängten sie an dir auf“. Gemeint sein kann, dass die Waffen an den Mauern von Tyrus oder innerhalb der Stadt zur Schau gestellt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „sie trugen zu deiner Pracht bei“ oder „sie verliehen dir Majestät“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: Perser
  rationale: Der Volksname bezeichnet hier die aus Persien stammenden Truppen; im Deutschen ist die Personenbezeichnung „Perser“ im militärischen Zusammenhang natürlicher als der Landesname „Persien“.
- source_word: לוּד
  choice: Lud
  rationale: Die hebräische Form wird als Volks- beziehungsweise Gebietsname beibehalten; „Lydien“ wäre eine mögliche, aber stärker deutende Identifizierung.
- source_word: פוּט
  choice: Put
  rationale: Nahe Transliteration des hebräischen Volks- beziehungsweise Gebietsnamens.
- source_word: בְחֵילֵךְ
  choice: in deinem Heer
  rationale: חַיִל kann Kraft, Vermögen oder Streitmacht bedeuten; der folgende Ausdruck „Krieger“ legt hier eindeutig den militärischen Sinn nahe.
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: als deine Krieger
  rationale: Gibt die Bedeutung von „Männer deines Krieges“ natürlich und prägnant wieder; „als“ verdeutlicht ihre Funktion im Heer.
- source_word: מָגֵן וְכוֹבַע
  choice: Schild und Helm
  rationale: Übliche deutsche Bezeichnungen für die genannten Schutzwaffen.
- source_word: תִּלּוּ בָךְ
  choice: hängten sie in dir auf
  rationale: Bewahrt das Verb „aufhängen“ und die ungewöhnliche, auf die personifizierte Stadt bezogene Präposition „in dir“, ohne das Bild vorschnell als „an deinen Mauern“ festzulegen.
- source_word: הֵמָּה נָתְנוּ הֲדָרֵךְ
  choice: sie verliehen dir Glanz
  rationale: הָדָר bezeichnet Glanz, Pracht oder Majestät. Die idiomatische deutsche Wendung drückt aus, dass die ausländischen Krieger und ihre Ausrüstung zum prächtigen Erscheinungsbild Tyrus beitrugen.
