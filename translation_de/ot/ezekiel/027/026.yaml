  text: בְּ/מַ֤יִם רַבִּים֙ הֱבִיא֔וּ/ךְ הַ/שָּׁטִ֖ים אֹתָ֑/ךְ ר֚וּחַ הַ/קָּדִ֔ים שְׁבָרֵ֖/ךְ בְּ/לֵ֥ב יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/026.yaml
  text: Into great waters your rowers brought you[b][a]; the east wind shattered you in the heart of the seas.
translation:
  language: de
  text: Deine Ruderer brachten dich in weite Wasser[a]; der Ostwind zerbrach dich im Herzen der Meere[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in weiten Wassern“ oder „auf vielen Wassern“. Die hebräische Präposition lässt mehrere Wiedergaben zu; wegen „brachten“ liegt eine Bewegung in weite Wasser nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: mitten in den Meeren. „Herz der Meere“ bezeichnet bildhaft ihren inneren Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַיִם רַבִּים
  choice: hinaus auf weite Wasser
  rationale: Die Präposition ב kann hier wegen der durch הֱבִיאוּךְ ausgedrückten Bewegung direktional verstanden werden. „Weite Wasser“ gibt die große, offene Wasserfläche natürlich wieder; „hinaus“ verdeutlicht den nautischen Bewegungszusammenhang, ohne das Ziel übermäßig festzulegen.
- source_word: הֱבִיאוּךְ
  choice: brachten dich
  rationale: Der Hifil von בוא bezeichnet gewöhnlich das Bringen oder Hinführen. Das Präteritum entspricht dem Rückblick innerhalb des prophetischen Klagelieds.
- source_word: הַשָּׁטִים
  choice: deine Ruderer
  rationale: Das Partizip bezeichnet im nautischen Zusammenhang die Männer, die das Schiff mit Rudern fortbewegen. Das possessive „deine“ macht die durch die Anrede der personifizierten Stadt beziehungsweise des Schiffes gegebene Zugehörigkeit im Deutschen idiomatisch deutlich.
- source_word: רוּחַ הַקָּדִים
  choice: der Ostwind
  rationale: Die bestimmte hebräische Wortgruppe bezeichnet den bekannten, oft zerstörerisch dargestellten Ostwind.
- source_word: שְׁבָרֵךְ
  choice: zerbrach dich
  rationale: שׁבר bezeichnet gewaltsames Brechen. „Zerbrach“ bewahrt das konkrete Schiffsbild und die Heftigkeit, ohne eine weitergehende Auslegung wie „vernichtete“ einzutragen.
- source_word: בְּלֵב יַמִּים
  choice: im Herzen der Meere
  rationale: Die wörtliche Metapher „Herz“ bezeichnet den inneren oder mittleren Bereich. Ihre Beibehaltung wahrt die poetische Bildkraft; der Plural „Meere“ entspricht יַמִּים.
