base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/011.yaml
  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
translation:
  language: de
  text: Sie hatte kräftige Zweige als Zepter für Herrscher. Ihr Wuchs ragte hoch zwischen dem dichten Geäst[a] empor, und sie war sichtbar in ihrer Höhe und in der Fülle ihrer Zweige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Wolken“. Das hebräische Wort kann hier dichtes Geäst oder dichten Bewuchs bezeichnen; die traditionelle Wiedergabe „Wolken“ ist möglich, passt aber weniger unmittelbar zum Bild des Weinstocks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטּוֹת עֹז
  choice: kräftige Zweige
  rationale: מַטּוֹת kann Stäbe, Ruten oder Zweige bezeichnen. Im Bild eines Weinstocks wahrt „Zweige“ die botanische Ebene; עֹז wird mit „kräftig“ wiedergegeben.
- source_word: אֶל שִׁבְטֵי מֹשְׁלִים
  choice: als Zepter für Herrscher
  rationale: שֵׁבֶט bezeichnet hier angesichts von מֹשְׁלִים den Herrscherstab beziehungsweise das Zepter. „Als“ gibt die in diesem poetischen Zusammenhang idiomatische Beziehung mit אֶל natürlich wieder, ohne die Eignung ausdrücklich hinzuzufügen.
- source_word: וַתִּגְבַּהּ קוֹמָתוֹ
  choice: Ihr Wuchs ragte hoch empor
  rationale: קוֹמָה bezeichnet Höhe oder Wuchs. Die Formulierung bewahrt das Bild des hoch aufgewachsenen Weinstocks und klingt im Deutschen natürlich.
- source_word: עַל בֵּין עֲבֹתִים
  choice: zwischen dem dichten Geäst
  rationale: עֲבֹתִים kann dichtes Geäst beziehungsweise dichten Bewuchs bezeichnen. בֵּין legt „zwischen“ nahe; das vorangehende עַל wird zusammen mit dem Verb durch „ragte … empor“ aufgenommen. Die botanische Deutung passt am besten zum unmittelbaren Bildzusammenhang.
- source_word: וַיֵּרָא
  choice: sie war weithin sichtbar
  rationale: Der Nifal wird als passive Sichtbarkeit wiedergegeben. „Weithin“ bringt die durch Höhe und Zweigfülle verursachte Auffälligkeit idiomatisch zum Ausdruck, ohne den Sinn des Verbs zu verändern.
- source_word: בְגָבְהוֹ
  choice: durch ihre Höhe
  rationale: 'Die Präposition ב wird kausal-instrumental verstanden: Ihre Höhe machte sie sichtbar.'
- source_word: בְּרֹב דָּלִיֹּתָיו
  choice: durch die Fülle ihrer Ranken
  rationale: דָּלִיּוֹת bezeichnet ausgreifende beziehungsweise herabhängende Zweige eines Gewächses. „Ranken“ hält das Weinstockbild lebendig; „Fülle“ gibt רֹב wieder.
