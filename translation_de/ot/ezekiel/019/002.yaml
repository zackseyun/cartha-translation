  source_fidelity: Der Text gibt die rhetorische Frage מָה אִמְּךָ und die nachfolgende Bildaussage treffend wieder. »Eine Löwin« wahrt das feminine לְבִיָּא. »Unter Löwen« bildet בֵּין אֲרָיוֹת textnah ab, während »inmitten von Junglöwen« die zweite Ortsangabe und כְּפִירִים angemessen wiedergibt. »Zog sie ihre Jungen groß« ist für רִבְּתָה גוּרֶיהָ im Kontext eine sichere und idiomatische Wiedergabe.
