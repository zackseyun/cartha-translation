id: EZK.19.2
reference: Ezekiel 19:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ מָ֤ה אִמְּ/ךָ֙ לְבִיָּ֔א בֵּ֥ין אֲרָי֖וֹת רָבָ֑צָה בְּ/ת֥וֹךְ כְּפִרִ֖ים רִבְּתָ֥ה גוּרֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/002.yaml
  text: and say[a], ‘What was your mother? A lioness. Among lions she lay down[b]; in the midst of young lions she reared her cubs.’
translation:
  language: de
  text: 'und sag: »Was war deine Mutter? Eine Löwin! Unter Löwen[a] lag sie; inmitten von Junglöwen zog sie ihre Jungen groß.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter Löwinnen«. Der hebräische Plural kann allgemein »Löwen« bezeichnen; im Blick auf das Bild der Löwin ist auch die sinngemäße Wiedergabe »Löwinnen« möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ließ sie ihre Jungen zahlreich werden«. Das hebräische Verb kann Vermehrung ausdrücken; hier ist wahrscheinlich das Großziehen der Jungen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Was war
  rationale: Die rhetorische Frage nach Identität beziehungsweise Wesen der Mutter bleibt ausdrücklich erhalten, statt sie zu einem Vergleich zu glätten.
- source_word: אִמְּךָ
  choice: deine Mutter
  rationale: Das direkte Suffix der 2. Person Singular wird beibehalten.
- source_word: לְבִיָּא
  choice: eine Löwin
  rationale: Das hebräische Substantiv ist feminin und trägt das Mutterbild des Verses.
- source_word: בֵּין אֲרָיוֹת
  choice: unter Löwen
  rationale: Die übliche allgemeine Pluralbedeutung wird textnah wiedergegeben; die kontextuelle Alternative »Löwinnen« steht in der Fußnote.
- source_word: רָבָצָה
  choice: lag sie
  rationale: Die einfache Tierhaltung des Liegens oder Lagerns wird knapp und bildhaft wiedergegeben, ohne eine besondere Haltung oder Stimmung hinzuzufügen.
- source_word: בְּתוֹךְ כְּפִרִים
  choice: inmitten von Junglöwen
  rationale: »Inmitten« wahrt die räumliche und poetische Parallelität; כְּפִירִים bezeichnet eher junge, bereits kräftige Löwen als kleine Säuglinge.
- source_word: רִבְּתָה גוּרֶיהָ
  choice: zog sie ihre Jungen groß
  rationale: Im mütterlichen Kontext bezeichnet das Verb am wahrscheinlichsten das Aufziehen der Nachkommen; »Jungen« ist im Deutschen natürlich und vermeidet das missverständliche »Welpen«.
