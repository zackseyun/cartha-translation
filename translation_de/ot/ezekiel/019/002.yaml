  terminology: »Löwin«, »Löwen«, »Junglöwen« und »ihre Jungen« sind konsistent und sachgerecht. Die Fußnoten benennen tatsächliche lexikalisch-kontextuelle Möglichkeiten, ohne die Hauptübersetzung unnötig zu belasten. Die Fußnotenanker stehen im deutschen Text an den jeweils sachlich zugehörigen Stellen.
