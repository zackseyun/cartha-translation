base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/014.yaml
  text: And fire went out from a branch of its limbs[a]; it consumed its fruit, and there was not in it a strong branch, a scepter to rule. This is a lamentation[b], and it has become a lamentation.
translation:
  language: de
  text: Aus einem Zweig ihrer Äste ging Feuer hervor[a]; es verzehrte ihre Frucht. In ihr gab es keinen kräftigen Zweig, kein Zepter zum Herrschen. Dies ist ein Klagelied[b], und es ist zum Klagelied geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von einem Stab ihrer Äste“. Das hebräische Wort מַטֶּה kann „Zweig“, „Stab“ oder „Stock“ bedeuten. „Zweig“ folgt hier dem Bild des Weinstocks; „Zepter“ im zweiten Satzteil bewahrt den königlichen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: Der Schluss kann sowohl das Gedicht als Klagelied bezeichnen als auch ausdrücken, dass das geschilderte Schicksal zum Gegenstand der Klage geworden ist.
    reason: ambiguity
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: Da ging Feuer … aus
  rationale: Die Form führt die Schilderung lebhaft fort. „Feuer ging … aus“ bewahrt das konkrete Bild und klingt in modernem Deutsch natürlich.
- source_word: מִמַּטֵּה בַדֶּיהָ
  choice: von einem Zweig ihrer Äste
  rationale: מַטֶּה kann Zweig, Stab oder Stock bedeuten; im Bild des Weinstocks ist „Zweig“ naheliegend. בַּדִּים wird zur begrifflichen Unterscheidung mit „Äste“ wiedergegeben.
- source_word: פִּרְיָהּ אָכָלָה
  choice: es verzehrte ihre Frucht
  rationale: Das Pronomen „es“ bezieht sich auf das grammatisch feminine Feuer, ohne dieses Genus im Deutschen nachzuahmen. „Verzehrte“ ist eine natürliche Beschreibung der Wirkung des Feuers.
- source_word: וְלֹא הָיָה בָהּ מַטֵּה עֹז
  choice: Kein kräftiger Zweig blieb an ihr
  rationale: Die existenzielle Aussage bezeichnet das Fehlen eines starken Triebes am Weinstock. „Blieb“ macht im Kontext der vorherigen Vernichtung den resultierenden Mangel idiomatisch deutlich.
- source_word: שֵׁבֶט לִמְשׁוֹל
  choice: kein Zepter zum Herrschen
  rationale: „Zepter“ erhält die königliche Bedeutung von שֵׁבֶט und lässt die politische Ebene des Pflanzenbildes hervortreten.
- source_word: קִינָה הִיא
  choice: Dies ist ein Klagelied
  rationale: Die nominale, abschließende Feststellung wird klar und würdevoll wiedergegeben.
- source_word: וַתְּהִי לְקִינָה
  choice: und es ist zum Klagelied geworden
  rationale: Die Formulierung bewahrt den resultativen Sinn und die bewusste Wiederholung von קִינָה.
theological_decisions:
- issue: Königliche Bildsprache innerhalb des Weinstockgleichnisses
  choice: מַטֶּה wird im botanischen Zusammenhang als „Zweig“, שֵׁבֶט dagegen als „Zepter“ wiedergegeben.
  alternative: Beide Begriffe einheitlich als „Stab“ wiedergeben und dadurch die königliche Ebene stärker hervorheben.
  rationale: Der hebräische Text verschränkt Pflanzen- und Herrschaftsbild. Die unterschiedliche Wiedergabe erhält diese Spannung, ohne sie ausschließlich botanisch oder politisch aufzulösen.
- issue: Bezug des abschließenden Klagelieds
  choice: Das grammatische „es“ bleibt inhaltlich offen und kann sich auf das Gedicht beziehungsweise das beklagte Geschehen beziehen.
  alternative: Explizit formulieren, dass der Weinstock oder sein Schicksal zum Gegenstand der Klage geworden ist.
  rationale: Der hebräische Wortlaut bestimmt den Bezug nicht genauer; die Übersetzung soll diese Mehrdeutigkeit nicht stillschweigend beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischem Rhythmus. Die Wiederholung von „Klagelied“ und die Verbindung von botanischer und königlicher Bildsprache bleiben erhalten; unnötig altertümliche Wörter werden vermieden.
