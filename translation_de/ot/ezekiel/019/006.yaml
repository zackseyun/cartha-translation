source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֥ךְ בְּ/תוֹךְ אֲרָי֖וֹת כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/006.yaml
  text: He prowled among the lions; he became a young lion[a]. He learned to tear prey; he devoured men.
translation:
  language: de
  text: Er streifte unter den Löwen umher; er wurde zu einem jungen Löwen. Er lernte, Beute zu reißen; er verschlang Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Mensch“; das hebräische Wort kann hier kollektiv „Menschen“ oder „Menschheit“ bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: streifte … umher
  rationale: Die Hitpael-Form von הלך bezeichnet hier ein wiederholtes Umhergehen innerhalb des Löwenbildes. „Streifte … umher“ gibt die Bewegung natürlich und mit der im Kontext liegenden räuberischen Färbung wieder.
- source_word: בְּתוֹךְ אֲרָיוֹת
  choice: unter den Löwen
  rationale: בְּתוֹךְ bedeutet „inmitten/unter“. „Unter den Löwen“ ist im modernen Deutsch idiomatisch und bewahrt das Bild einer Bewegung innerhalb einer Gruppe von Löwen.
- source_word: כְּפִיר
  choice: junger Löwe
  rationale: כְּפִיר bezeichnet gewöhnlich einen jungen, bereits kräftigen Löwen und nicht notwendig ein kleines Löwenjunges.
- source_word: הָיָה
  choice: wurde zu
  rationale: Im erzählerischen Fortgang der Allegorie drückt היה hier eine Entwicklung aus. „Wurde zu“ macht dieses Werden deutlicher als das rein statische „war“.
- source_word: וַיִּלְמַד
  choice: lernte
  rationale: Das Verb bedeutet unmittelbar „lernen“. Der Text nennt keinen Ausbilder; daher wäre eine passive Wiedergabe wie „wurde abgerichtet“ zu bestimmend.
- source_word: לִטְרָף טֶרֶף
  choice: Beute zu reißen
  rationale: Die Verbindung aus Infinitiv und stammverwandtem Objekt verstärkt die räuberische Handlung. „Beute reißen“ bewahrt das gewaltsame Löwenbild und klingt im Deutschen natürlich.
- source_word: אָדָם
  choice: Menschen
  rationale: Der morphologische Singular אָדָם wird hier im Kontext kollektiv gebraucht. Der deutsche Plural „Menschen“ gibt diesen Sinn idiomatisch wieder; die wörtlichere Form und die mögliche kollektive Weite werden in der Fußnote genannt.
- source_word: אָכָל
  choice: verschlang
  rationale: Wörtlich bedeutet אָכָל „essen“, doch im Bild eines raubenden Löwen gibt „verschlang“ die konkrete und heftige Handlung treffend wieder.
theological_decisions:
- issue: Wiedergabe von אָדָם im räuberischen Gleichnis
  choice: Menschen
  alternative: Mensch; Menschheit
  rationale: Die Stelle trifft keine lehrhafte Aussage über den Menschen, sondern beschreibt in dichterischer Allegorie menschliche Opfer. „Menschen“ entspricht dem kollektiven Gebrauch im Kontext, ohne die konkrete Bildhaftigkeit abzuschwächen; die Form des Hebräischen und weitere mögliche Wiedergaben bleiben in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die kurzen Hauptsätze und die wiederholte Raubtierbildlichkeit bleiben erhalten; zugleich werden im Deutschen natürliche Wendungen wie „unter den Löwen“, „Beute reißen“ und „Menschen verschlingen“ verwendet.
