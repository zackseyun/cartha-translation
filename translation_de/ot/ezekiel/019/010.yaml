source:
  edition: WLC
  text: אִמְּ/ךָ֥ כַ/גֶּ֛פֶן בְּ/דָמְ/ךָ֖ עַל מַ֣יִם שְׁתוּלָ֑ה פֹּֽרִיָּה֙ וַֽ/עֲנֵפָ֔ה הָיְתָ֖ה מִ/מַּ֥יִם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/010.yaml
  text: Your mother was like a vine in your vineyard[a], planted by waters; she was fruitful and full of branches because of abundant waters.
translation:
  language: de
  text: Deine Mutter war wie ein Weinstock in deinem Blut[a], an Wassern gepflanzt; durch reichlich Wasser war sie fruchtbar und reich an Zweigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in deinem Blut«; die hebräische Wendung ist schwer verständlich. Vorgeschlagen wurden auch die Lesarten »dir gleich« und »in deinem Weinberg«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְּךָ
  choice: deine Mutter
  rationale: Die wörtliche Anrede und das feminine Bild bleiben erhalten; die Mutter wird nicht deutend durch »Königshaus« oder »Nation« ersetzt.
- source_word: כַגֶּפֶן
  choice: wie ein Weinstock
  rationale: כ kennzeichnet einen Vergleich; »Weinstock« ist im Deutschen die natürliche Bezeichnung für גפן und bewahrt das poetische Bild.
- source_word: בְּדָמְךָ
  choice: in deinem Blut
  rationale: Der masoretische Konsonantentext und seine Vokalisierung ergeben am unmittelbarsten »in deinem Blut«. Die schwierige Formulierung wird nicht stillschweigend geglättet oder emendiert; mögliche andere Lesarten stehen in der Fußnote.
- source_word: עַל מַיִם
  choice: an Wassern
  rationale: Die Formulierung bewahrt den Plural von מַיִם und den poetischen Klang. Gemeint ist die Lage bei einer reichlichen Wasserquelle.
- source_word: שְׁתוּלָה
  choice: gepflanzt
  rationale: Das passive Partizip von שתל bezeichnet hier den gepflanzten Weinstock; »verpflanzt« ist möglich, wird vom Kontext aber nicht verlangt.
- source_word: פֹּרִיָּה
  choice: fruchtbar
  rationale: Die knappe adjektivische Wiedergabe entspricht Form und Bedeutung des hebräischen Ausdrucks.
- source_word: וַעֲנֵפָה
  choice: reich an Zweigen
  rationale: Die deutsche Wendung gibt das von ענף abgeleitete Adjektiv natürlich wieder, ohne das Bild zu erweitern.
- source_word: הָיְתָה
  choice: war sie
  rationale: Das feminine Singularverb stimmt mit »Mutter« und »Weinstock« überein und führt die Personifikation fort.
- source_word: מִמַּיִם רַבִּים
  choice: durch das viele Wasser
  rationale: מִן bezeichnet hier plausibel Ursache beziehungsweise Quelle des üppigen Wachstums. Die Formulierung ist modernes, natürliches Deutsch und wahrt die Wasserfülle des Bildes.
theological_decisions:
- issue: Umgang mit der dunklen Wendung בְּדָמְךָ
  choice: Die masoretische Lesart »in deinem Blut« bleibt im Haupttext stehen.
  alternative: »dir gleich« oder »in deinem Weinberg«
  rationale: Die Schwierigkeit ist textkritischer und lexikalischer, nicht dogmatischer Art. Originalsprachliche Priorität und die Wahrung echter Mehrdeutigkeit sprechen dagegen, eine vermutete Lesart stillschweigend in den Haupttext einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildsprache. »An Wassern« ist bewusst gehoben und wahrt den hebräischen Plural; die ungewöhnliche Haupttextlesart »in deinem Blut« wird durch eine unmittelbar zugeordnete Fußnote transparent gemacht.
