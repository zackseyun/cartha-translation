  text: וְ/אַתָּה֙ שָׂ֣א קִינָ֔ה אֶל נְשִׂיאֵ֖י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/001.yaml
  text: And you[b][a], raise a lamentation over the princes of Israel.
translation:
  language: de
  text: Und du, stimm ein Klagelied über die Fürsten Israels an.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Erhebe eine Totenklage“; sinngemäß: „Trage ein Klagelied vor“.'
    reason: lexical_alternative
  - marker: b
    text: „Fürsten“ kann hier besonders die königlichen Herrscher Judas beziehungsweise Israels bezeichnen, nicht nur führende Personen im Allgemeinen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: Und du,
  rationale: Die Konjunktion mit dem selbstständigen Pronomen setzt die Rede fort und hebt Ezechiel als Angeredeten leicht hervor.
- source_word: שָׂא קִינָה
  choice: stimm ein Klagelied … an
  rationale: Die Verbindung ist eine feste Wendung für das Anheben oder Vortragen einer Totenklage. Die deutsche Formulierung ist natürlich und bewahrt den feierlich-klagenden Ton.
- source_word: אֶל
  choice: über
  rationale: Bei einer Klage bezeichnet die Präposition hier den Gegenstand der Klage; im Deutschen ist „über“ idiomatisch.
- source_word: נְשִׂיאֵי
  choice: Fürsten
  rationale: Das Wort bezeichnet hochgestellte Herrscher oder Oberhäupter. „Fürsten“ bewahrt im Kontext die politische und dynastische Färbung, ohne es ausdrücklich mit „Könige“ gleichzusetzen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Gebräuchliche deutsche Form des Eigennamens.
theological_decisions:
- issue: Bezug von נְשִׂיאֵי יִשְׂרָאֵל
  choice: Fürsten Israels
  alternative: Könige Israels; Führer Israels
  rationale: Der Kontext weist auf königliche Gestalten hin, doch der hebräische Text verwendet nicht das spezifische Wort für „Könige“. „Fürsten“ erhält die dynastisch-politische Bedeutung und lässt die genaue Reichweite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Klagelied anstimmen“ gibt die hebräische Wendung verständlich wieder; „Fürsten“ wahrt die politische und dynastische Mehrdeutigkeit.
