  text: וַ/יֵּ֨דַע֙ אַלְמְנוֹתָ֔י/ו וְ/עָרֵי/הֶ֖ם הֶחֱרִ֑יב וַ/תֵּ֤שַׁם אֶ֨רֶץ֙ וּ/מְלֹאָ֔/הּ מִ/קּ֖וֹל שַׁאֲגָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/007.yaml
  text: He knew their widows[a], and he laid waste their cities; the land and its fullness was desolated by the sound of his roaring.
translation:
  language: de
  text: Er kannte seine Witwen[a] und legte ihre Städte in Trümmer; das Land samt allem, was darin war, verödete vom Schall seines Brüllens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Witwen“. Das hebräische „kannte“ kann hier einen feindseligen oder sexuellen Unterton haben; manche verstehen die Aussage daher konkreter als Misshandlung von Frauen. Andere folgen einer abweichenden Lesart und übersetzen: „Er zerstörte ihre Paläste.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: er kannte
  rationale: ידע bedeutet gewöhnlich „kennen“, kann aber auch als Umschreibung für sexuellen Verkehr dienen. Die wörtliche Wiedergabe bewahrt in diesem schwierigen Bildwort die Mehrdeutigkeit; ein möglicher gewaltsamer oder sexueller Nebensinn wird in der Fußnote genannt.
- source_word: אַלְמְנוֹתָיו
  choice: ihre Witwen
  rationale: Der masoretisch vokalisierte Text lautet formal „seine Witwen“. Im Zusammenhang mit „ihre Städte“ sind jedoch die Witwen der von ihm heimgesuchten Menschen gemeint; „ihre“ gibt diesen Bezug verständlich wieder, während die formale Lesart und die textkritische Alternative in der Fußnote erhalten bleiben.
- source_word: וְעָרֵיהֶם הֶחֱרִיב
  choice: und verwüstete ihre Städte
  rationale: החריב bezeichnet das Verwüsten oder Verödenlassen. „Verwüstete“ ist prägnant und passt zum poetischen Klagelied.
- source_word: וַתֵּשַׁם
  choice: wurde … verwüstet
  rationale: Das Verb beschreibt das Öde- oder Verwüstetwerden. Die deutsche Satzgestaltung mit „Das Land wurde mit allem … verwüstet“ folgt dem singularischen Hauptbegriff אֶרֶץ und klingt natürlicher als eine koordinierte Mehrzahl.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: das Land … mit allem, was es erfüllte
  rationale: Die Wendung bezeichnet das Land samt seinem gesamten Inhalt. Die aufgelöste Form ist im heutigen Deutsch verständlicher als das formal mögliche „das Land und seine Fülle“.
- source_word: מִקּוֹל שַׁאֲגָתוֹ
  choice: vom Schall seines Brüllens
  rationale: מן bezeichnet hier Ursache oder Ausgangspunkt. „Vom Schall“ erhält das akustische Bild des brüllenden Löwen und den poetischen Ton.
theological_decisions:
- issue: Die schwierige Wendung וַיֵּדַע אַלְמְנוֹתָיו im metaphorischen Gerichtswort
  choice: Die masoretisch bezeugten Begriffe „kennen“ und „Witwen“ bleiben im Haupttext erkennbar; ihre Unsicherheit wird durch eine Fußnote offengelegt.
  alternative: Konkreter „er missbrauchte ihre Witwen“ oder nach abweichender Deutung „er zerstörte ihre Paläste“.
  rationale: Der Text ist lexikalisch und möglicherweise textkritisch schwierig. Eine eindeutige Festlegung auf sexuelle Gewalt oder auf „Paläste“ würde eine im hebräischen Text bestehende Spannung voreilig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Satzbau. „Kannte“ ist bewusst ungewohnt, um die echte Mehrdeutigkeit des hebräischen Ausdrucks nicht im Haupttext aufzulösen; die Fußnote bietet die nötige Orientierung.
