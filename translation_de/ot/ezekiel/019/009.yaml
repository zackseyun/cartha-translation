source:
  edition: WLC
  text: וַֽ/יִּתְּנֻ֤/הוּ בַ/סּוּגַר֙ בַּֽ/חַחִ֔ים וַ/יְבִאֻ֖/הוּ אֶל מֶ֣לֶךְ בָּבֶ֑ל יְבִאֻ֨/הוּ֙ בַּ/מְּצֹד֔וֹת לְמַ֗עַן לֹא יִשָּׁמַ֥ע קוֹל֛/וֹ ע֖וֹד אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
translation:
  language: de
  text: Sie setzten ihn mit Haken in einen Käfig und brachten ihn zum König von Babel. Sie brachten ihn in Festungen[a], damit seine Stimme[b] auf den Bergen Israels nicht mehr gehört würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in befestigte Orte“, „in ein Gefängnis“ oder möglicherweise „in Belagerungswerke“. Das hebräische Wort kann Festungen oder Orte beziehungsweise Einrichtungen der Gefangensetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Gebrüll“. Wörtlich steht im Hebräischen „seine Stimme“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֻהוּ בַסּוּגַר
  choice: Sie setzten ihn in einen Käfig
  rationale: נתן bedeutet hier im Erzählzusammenhang „setzen/bringen“, während סוּגַר eine verschließbare Einhegung bezeichnet. „Käfig“ bewahrt das Bild des gefangenen Löwen.
- source_word: בַּחַחִים
  choice: mit Haken
  rationale: חַחִים bezeichnet Haken oder Ringe, mit denen gefangene Tiere oder Menschen gebändigt wurden. Der genaue Sitz der Haken wird im Hebräischen nicht genannt.
- source_word: וַיְבִאֻהוּ אֶל מֶלֶךְ בָּבֶל
  choice: und brachten ihn zum König von Babel
  rationale: Die Hifil-Form von בוא bedeutet „bringen“. „Babel“ entspricht dem hebräischen Ortsnamen und ist im deutschen Bibelregister geläufig.
- source_word: יְבִאֻהוּ בַּמְּצֹדוֹת
  choice: Sie brachten ihn in Festungen
  rationale: מְצֹדוֹת kann Festungen, befestigte Orte oder Einrichtungen der Gefangensetzung bezeichnen. „Festungen“ wahrt die Mehrzahl und lässt die sachliche Unschärfe des Ausdrucks bestehen.
- source_word: לְמַעַן לֹא יִשָּׁמַע קוֹלוֹ עוֹד
  choice: damit seine Stimme nicht mehr gehört würde
  rationale: קוֹל heißt wörtlich „Stimme/Laut“. „Stimme“ hält sowohl den menschlichen Herrscher als auch das fortdauernde Löwenbild im Blick, ohne ausdrücklich „Gebrüll“ einzusetzen.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: auf den Bergen Israels
  rationale: „Die Berge Israels“ ist eine wiederkehrende Bezeichnung Ezechiels für das gebirgige Land Israel; „auf“ gibt die örtliche Beziehung im Deutschen natürlich wieder.
theological_decisions:
- issue: Bildsprache vom gefangenen Löwen beziehungsweise Fürsten
  choice: Das Bild von Gefangennahme und zum Schweigen gebrachter Herrschaft bleibt erhalten; der Herrscher wird nicht namentlich bestimmt.
  alternative: Den Vers im Haupttext ausdrücklich auf Jojachin oder einen anderen judäischen König beziehen.
  rationale: Der unmittelbare hebräische Text nennt den Herrscher nicht. Eine historische Identifizierung würde eine Auslegung festschreiben, die über den Wortlaut dieses Verses hinausgeht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „brachten ihn“ folgt bewusst der hebräischen Satzfolge. Die Fußnotenmarker stehen bei den tatsächlich erläuterten Ausdrücken; damit wird eine offenkundige Verschiebung der Marker in der englischen Konsultationsfassung berichtigt.
