  text: וַ/יִּשְׁמְע֥וּ אֵלָ֛י/ו גּוֹיִ֖ם בְּ/שַׁחְתָּ֣/ם נִתְפָּ֑שׂ וַ/יְבִאֻ֥/הוּ בַֽ/חַחִ֖ים אֶל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/004.yaml
  text: The nations heard of him[a]; he was caught in their pit[c][b], and they brought him with hooks to the land of Egypt.
translation:
  language: de
  text: Die Völker hörten von ihm[a]. In ihrer Fanggrube[b] wurde er gefangen, und sie brachten ihn mit Haken[c] ins Land Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Sie hörten über ihn.“ Die hebräische Wendung kann hier bedeuten, dass die Völker Kunde von ihm erhielten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Grube“ beziehungsweise „Falle“. Gemeint ist eine zum Fangen von Beute angelegte Grube.'
    reason: lexical_alternative
  - marker: c
    text: Die Haken oder Ringe dienten dazu, gefangene Tiere oder Menschen zu bändigen; wo sie angebracht wurden, sagt der Vers nicht.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: Die Völker hörten von ihm
  rationale: Die Verbindung שׁמע אל kann hier bedeuten, dass die Völker Kunde von ihm erhielten; „hörten von ihm“ bewahrt zugleich die mögliche Nähe zum wörtlichen Hören.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die fremden Völker beziehungsweise Nationen; „Völker“ ist im Deutschen natürlich und vermeidet spätere religiöse Nebenbedeutungen von „Heiden“.
- source_word: בְּשַׁחְתָּם
  choice: in ihrer Fanggrube
  rationale: שַׁחַת bezeichnet eine Grube; im Bild der Löwenjagd macht „Fanggrube“ ihre Funktion deutlich, ohne das konkrete Bild durch das allgemeinere „Falle“ zu ersetzen.
- source_word: נִתְפָּשׂ
  choice: wurde er gefangen
  rationale: Die passive Form bezeichnet das Gefangenwerden und passt zum Jagdbild.
- source_word: וַיְבִאֻהוּ
  choice: sie brachten ihn
  rationale: Die Hifil-Form von בוא bedeutet schlicht „bringen“; die Art der Fesselung wird anschließend genannt.
- source_word: בַחַחִים
  choice: mit Haken
  rationale: חַחִים sind Haken oder Ringe zur Bändigung gefangener Tiere oder Menschen. „Haken“ bleibt allgemein, da der Vers ihre genaue Anbringung nicht nennt.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: ins Land Ägypten
  rationale: Die Wendung erhält den formalen geografischen Ausdruck des Hebräischen und klingt zugleich idiomatisch deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bewahrt das Jagd- und Gefangenschaftsbild. „Fanggrube“ verdeutlicht die Funktion der Grube, während die Fußnote die wörtlichere und allgemeinere Wiedergabe festhält.
