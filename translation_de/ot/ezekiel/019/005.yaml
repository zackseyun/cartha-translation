  text: וַ/תֵּ֨רֶא֙ כִּ֣י נֽוֹחֲלָ֔ה אָבְדָ֖ה תִּקְוָתָ֑/הּ וַ/תִּקַּ֛ח אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֥יר שָׂמָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/005.yaml
  text: When she saw that she had waited in vain[a], that her hope was lost, she took one of her cubs and made him a young lion.
translation:
  language: de
  text: Als sie sah, dass sie vergeblich gewartet hatte[a] und ihre Hoffnung verloren war, nahm sie einen ihrer Jungen und machte ihn zu einem jungen Löwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass sie geschwächt war« beziehungsweise »dass sie enttäuscht war«. Das hebräische Wort ist schwer zu deuten; der Haupttext folgt dem Zusammenhang und versteht es als vergebliches Warten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא כִּי
  choice: Als sie sah, dass
  rationale: Die Konstruktion führt erzählend weiter und gibt zugleich den Inhalt ihrer Wahrnehmung an; im Deutschen ist die temporale Fügung natürlich.
- source_word: נוֹחֲלָה
  choice: sie vergeblich gewartet hatte
  rationale: Das schwierige hebräische Wort steht parallel zu der verlorenen Hoffnung. Die Wiedergabe erfasst im Kontext am ehesten enttäuschtes, erfolgloses Warten, ohne die lexikalischen Alternativen zu verschweigen.
- source_word: אָבְדָה תִּקְוָתָהּ
  choice: ihre Hoffnung verloren war
  rationale: Die Formulierung bewahrt das Bild einer zunichtegewordenen Hoffnung und klingt in modernem Deutsch natürlich.
- source_word: וַתִּקַּח אֶחָד מִגֻּרֶיהָ
  choice: nahm sie eines von ihren Jungen
  rationale: גּוּר bezeichnet im Bild der Löwin ein Jungtier. „Jungen“ ist klar und vermeidet eine unnötige Wiederholung von „Löwe“.
- source_word: כְּפִיר
  choice: jungen Löwen
  rationale: כְּפִיר bezeichnet spezifisch einen jungen Löwen; die Alters- und Entwicklungsangabe bleibt damit erhalten.
- source_word: שָׂמָתְהוּ
  choice: machte es zu
  rationale: Das Verb „setzen/stellen“ bezeichnet hier, dass die Löwin das Junge in die Rolle beziehungsweise den Stand eines jungen Löwen bringt. Die deutsche Wendung bewahrt diese Entwicklung im Bild.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das grammatische Neutrum „es“ bezieht sich auf „Junge“; dadurch bleibt die deutsche Kongruenz natürlich, auch wenn das Tier im Bild später als männlicher junger Löwe erscheint.
