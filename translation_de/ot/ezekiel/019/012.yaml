  source_fidelity: 'Die Übersetzung gibt die Abfolge und Bildsprache des Hebräischen zuverlässig wieder: gewaltsames Ausreißen und Niederwerfen, der zerstörerische Ostwind, das Vertrocknen der Frucht, das Abtrennen und Verdorren des starken Zweigs sowie dessen Verzehr durch Feuer. Die im Hebräischen auffällige Spannung zwischen den pluralischen Verben bei הִתְפָּרְקוּ/וְיָבֵשׁוּ und dem singularischen מַטֵּה sowie dem singularischen Objektsuffix bei אֲכָלָתְהוּ wird nicht künstlich harmonisiert; die idiomatische singularische deutsche Wiedergabe ist im poetischen Kontext vertretbar.'
