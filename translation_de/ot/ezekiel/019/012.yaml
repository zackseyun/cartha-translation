source:
  edition: WLC
  text: וַ/תֻּתַּ֤שׁ בְּ/חֵמָה֙ לָ/אָ֣רֶץ הֻשְׁלָ֔כָה וְ/ר֥וּחַ הַ/קָּדִ֖ים הוֹבִ֣ישׁ פִּרְיָ֑/הּ הִתְפָּרְק֧וּ וְ/יָבֵ֛שׁוּ מַטֵּ֥ה עֻזָּ֖/הּ אֵ֥שׁ אֲכָלָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/012.yaml
  text: But she was uprooted in wrath; she was thrown down to the ground[a]. And the east wind dried up her fruit; her strong branch was torn off and withered; fire consumed it.
translation:
  language: de
  text: Doch im Zorn wurde sie ausgerissen und zu Boden geworfen. Der Ostwind ließ ihre Frucht vertrocknen. Ihr starker Zweig[a] wurde abgerissen und verdorrte; Feuer verzehrte ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr mächtiges Zepter“ oder „der Stab ihrer Stärke“. Das hebräische Wort kann sowohl einen Zweig als auch einen Herrscherstab bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּתַּשׁ
  choice: wurde sie ausgerissen
  rationale: Das passive Verb bezeichnet im Bild des Weinstocks ein gewaltsames Herausreißen aus dem Boden; „ausgerissen“ ist im Deutschen natürlich und anschaulich.
- source_word: בְּחֵמָה
  choice: im Zorn
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Im Zorn“ bewahrt die knappe Formulierung, ohne einen im Hebräischen ungenannten Handelnden einzuführen.
- source_word: לָאָרֶץ הֻשְׁלָכָה
  choice: zu Boden geworfen
  rationale: Die Formulierung gibt die gewaltsame Bewegung und Erniedrigung wieder und fügt sich idiomatisch in das deutsche Pflanzenbild ein.
- source_word: רוּחַ הַקָּדִים
  choice: der Ostwind
  rationale: Dies ist die übliche Bezeichnung für den heißen, zerstörerischen Wind aus dem Osten.
- source_word: הוֹבִישׁ פִּרְיָהּ
  choice: ließ ihre Frucht vertrocknen
  rationale: Die Kausativform besagt, dass der Ostwind das Austrocknen der Frucht bewirkte. Die Konstruktion „ließ … vertrocknen“ bildet diese Aussage klar ab.
- source_word: הִתְפָּרְקוּ
  choice: wurde abgerissen
  rationale: Das Verb bezeichnet ein gewaltsames Losbrechen oder Abtrennen. Die singularische Wiedergabe folgt dem anschließenden singularischen מַטֵּה und ergibt im Deutschen einen verständlichen Satz.
- source_word: וְיָבֵשׁוּ
  choice: und verdorrte
  rationale: „Verdorrte“ hält das Pflanzenbild aufrecht und vermeidet eine unnötige Wiederholung von „vertrocknen“.
- source_word: מַטֵּה עֻזָּהּ
  choice: ihr starker Zweig
  rationale: מַטֶּה kann Zweig, Stab oder Zepter bedeuten. Im unmittelbaren Weinstockbild ist „Zweig“ passend; zugleich wird die Anspielung auf königliche Macht in einer Fußnote bewahrt.
- source_word: אֵשׁ אֲכָלָתְהוּ
  choice: Feuer verzehrte ihn
  rationale: „Verzehren“ gibt das Bild des fressenden Feuers prägnant und in einem würdigen deutschen Register wieder; das Pronomen bezieht sich auf den Zweig.
theological_decisions:
- issue: Die doppelte Bildwirkung von מַטֵּה עֻזָּהּ in einer Klage über Königtum und Weinstock
  choice: Im Haupttext steht „ihr starker Zweig“, während die königliche Bedeutungsmöglichkeit in einer Fußnote genannt wird.
  alternative: „ihr mächtiges Zepter“ oder „der Stab ihrer Stärke“
  rationale: Der unmittelbare Zusammenhang spricht von Weinstock, Frucht und Austrocknen, während der weitere Kontext, besonders Vers 11, zugleich auf königliche Herrschaft weist. Die gewählte Fassung erhält beide Ebenen, ohne die poetische Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, poetisch knappem Ton. Die passiven Formulierungen bewahren, dass der Handelnde im hebräischen Text nicht ausdrücklich genannt wird; die Bildsprache des Weinstocks bleibt im Vordergrund.
