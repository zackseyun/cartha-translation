  text: וַ/תַּ֛עַל אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/003.yaml
  text: She brought up one of her cubs; he became a young lion[a], and he learned to tear prey; he devoured people.
translation:
  language: de
  text: Sie zog eines ihrer Jungen groß; es wurde zu einem jungen Löwen und lernte, Beute zu reißen; Menschen fraß es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַל
  choice: Sie zog ... groß
  rationale: Das Hifil von עלה kann wörtlich ein Heraufbringen ausdrücken; im Bild einer Löwenmutter bezeichnet es idiomatisch das Aufziehen eines Jungen.
- source_word: אֶחָד מִגֻּרֶיהָ
  choice: eines ihrer Jungen
  rationale: גּוּר bezeichnet hier das Junge eines Raubtiers. „Eines ihrer Jungen“ gibt die partitive Konstruktion natürlich wieder.
- source_word: כְּפִיר הָיָה
  choice: es wurde zu einem jungen Löwen
  rationale: כְּפִיר bezeichnet einen jungen, bereits jagdfähigen Löwen; „wurde“ bildet in der Entwicklungsfolge den Übergang vom Jungen zum jungen Löwen ab.
- source_word: וַיִּלְמַד לִטְרָף טֶרֶף
  choice: und lernte, Beute zu reißen
  rationale: Die Verbindung des Verbs טרף mit dem gleichstämmigen Substantiv טֶרֶף hebt das gewaltsame Erbeuten hervor. „Beute reißen“ bewahrt das Raubtierbild im Deutschen.
- source_word: אָדָם אָכָל
  choice: Menschen fraß es
  rationale: אָדָם steht formal im Singular, kann hier aber kollektiv bzw. generisch Menschen bezeichnen. Der Plural „Menschen“ ist im Deutschen natürlich und wahrt den Gegensatz zwischen Tier und Mensch; „fraß“ entspricht dem konkreten Raubtierbild von אָכַל.
theological_decisions:
- issue: Generischer bzw. kollektiver Sinn von אָדָם im Singular
  choice: Menschen
  alternative: einen Menschen / den Menschen
  rationale: Der formale Singular bleibt semantisch offen, bezeichnet im Kontext jedoch menschliche Opfer allgemein. „Menschen“ gibt dies in natürlichem Deutsch wieder, ohne eine Aussage über das Geschlecht einzutragen oder den Ausdruck auf ein einziges Opfer festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Tier wird mit dem grammatisch passenden Pronomen „es“ aufgenommen. Der Satzbau bewahrt die knappe, fortschreitende Abfolge des Hebräischen.
