  text: וְ/עַתָּ֖ה שְׁתוּלָ֣ה בַ/מִּדְבָּ֑ר בְּ/אֶ֖רֶץ צִיָּ֥ה וְ/צָמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/013.yaml
  text: And now she is planted in the wilderness[a], in a dry and thirsty land.
translation:
  language: de
  text: Und nun ist sie in der Wüste gepflanzt[a], in einem dürren und durstigen Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Wüste verpflanzt“. Das hebräische Partizip bedeutet unmittelbar „gepflanzt“, kann im Zusammenhang aber das Herausnehmen und erneute Einpflanzen nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb markiert den Übergang vom früheren Zustand zur gegenwärtigen Lage und wahrt den Erzählfluss.
- source_word: שְׁתוּלָה
  choice: ist … gepflanzt
  rationale: Das feminine passive Partizip bezeichnet den gegenwärtigen Zustand der als Weinstock dargestellten Größe. „Gepflanzt“ gibt die Form unmittelbar wieder; der Kontext kann zugleich ein Verpflanzen nahelegen.
- source_word: בַמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר kann Wüste, Wildnis oder Steppe bezeichnen. „Wüste“ ist hier natürlich und vermittelt die lebensfeindliche Umgebung des Exils.
- source_word: בְּאֶרֶץ
  choice: in einem … Land
  rationale: Das artikellose אֶרֶץ wird durch die folgenden Merkmale näher bestimmt; der unbestimmte Artikel entspricht dieser Konstruktion im Deutschen.
- source_word: צִיָּה
  choice: dürren
  rationale: Das Wort bezeichnet Trockenheit beziehungsweise ausgedörrtes Land. „Dürr“ ist prägnant, würdevoll und passt zur poetischen Bildsprache.
- source_word: וְצָמָא
  choice: und durstigen
  rationale: Das Substantiv „Durst“ charakterisiert hier das Land. Die adjektivische Wiedergabe „durstig“ bewahrt die knappe Personifikation des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dichterischer Würde. Die feminine Form „sie“ und das Pflanzenbild bleiben erhalten; die mögliche Bedeutung „verpflanzt“ wird nicht in den Haupttext hineingedeutet, sondern als echte kontextuelle Alternative in der Fußnote genannt.
