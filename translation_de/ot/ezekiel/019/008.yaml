translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappen Hauptsätze erhalten den Rhythmus und die Jagdmetaphorik des Hebräischen; „Völker“ und „Provinzen“ bleiben bewusst voneinander unterschieden.
