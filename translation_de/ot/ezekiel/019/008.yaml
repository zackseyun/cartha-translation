  text: וַ/יִּתְּנ֨וּ עָלָ֥י/ו גּוֹיִ֛ם סָבִ֖יב מִ/מְּדִינ֑וֹת וַֽ/יִּפְרְשׂ֥וּ עָלָ֛י/ו רִשְׁתָּ֖/ם בְּ/שַׁחְתָּ֥/ם נִתְפָּֽשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/008.yaml
  text: Then nations from the provinces set themselves against him all around[a], and they spread their net over him[b]; he was caught in their pit.
translation:
  language: de
  text: Da stellten sich Völker aus den Provinzen ringsum gegen ihn[a]. Sie breiteten ihr Netz über ihn aus; in ihrer Fanggrube[b] wurde er gefangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da kamen Völker aus den Provinzen ringsum gegen ihn.“ Die hebräische Wendung kann wörtlicher mit „stellten sich gegen ihn“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Die „Fanggrube“ war vermutlich eine bei der Jagd verwendete Fallgrube.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: stellten sich … gegen ihn
  rationale: Die hebräische Wendung נתן על bezeichnet hier im Zusammenhang einer Jagd ein feindliches Vorgehen gegen jemanden. Die reflexive deutsche Form gibt dies natürlich wieder, ohne das Bild unnötig auszudeuten.
- source_word: גּוֹיִם
  choice: Völker
  rationale: גּוֹיִם bezeichnet hier auswärtige politische Gemeinschaften. „Völker“ ist im Deutschen idiomatischer als „Nationen“ und vermeidet die unpassende religiöse Engführung „Heiden“.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Wort betont die Einkreisung des Beutetiers; „ringsum“ bewahrt dieses räumliche Bild knapp und würdig.
- source_word: מִמְּדִינוֹת
  choice: aus den Provinzen
  rationale: מְדִינוֹת kann administrative Gebiete oder Provinzen bezeichnen. Diese Wiedergabe erhält den politischen Hintergrund und unterscheidet den Ausdruck von גּוֹיִם.
- source_word: וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם
  choice: Sie breiteten ihr Netz über ihm aus
  rationale: פרשׂ bedeutet „ausbreiten“, רֶשֶׁת „Netz“. Die Formulierung hält sich eng an das Jagdbild und klingt zugleich natürlich.
- source_word: בְּשַׁחְתָּם
  choice: in ihrer Fanggrube
  rationale: שַׁחַת kann eine Grube bezeichnen, die als Falle dient. „Fanggrube“ macht die im Jagdkontext naheliegende Funktion knapp deutlich.
- source_word: נִתְפָּשׂ
  choice: wurde er gefangen
  rationale: Die passive Form bezeichnet das Gefangenwerden. „Gefangen“ bewahrt sowohl das Jagdbild als auch den politischen Unterton.
