  text: אַנְשֵׁ֥י רָכִ֛יל הָ֥יוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם וְ/אֶל הֶֽ/הָרִים֙ אָ֣כְלוּ בָ֔/ךְ זִמָּ֖ה עָשׂ֥וּ בְ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/009.yaml
  text: Men of slander were in you in order to shed blood[a]; and on the mountains they ate[c][b]; they committed lewdness in your midst.
translation:
  language: de
  text: Verleumder waren in dir, um Blut zu vergießen.[a] Auf den Bergen aßen sie,[b] und mitten in dir begingen sie Schandtaten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zuträger« beziehungsweise »Menschen, die Verleumdungen verbreiteten«. Das hebräische Wort kann das Weitertragen von Anschuldigungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind wahrscheinlich unerlaubte Kultmahlzeiten auf den Höhen, die mit Götzendienst verbunden waren.
    reason: cultural_note
  - marker: c
    text: 'Oder: »sexuelle Schandtaten« beziehungsweise »schamlose Bosheit«. Das hebräische Wort bezeichnet oft empörendes sexuelles Fehlverhalten, kann aber auch weiter gefasst sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי רָכִיל
  choice: Verleumder
  rationale: Die Wendung bezeichnet Menschen, die verleumderische Anschuldigungen verbreiten oder als Zuträger auftreten. „Verleumder“ ist gegenwärtiges, verständliches Deutsch und bewahrt hier den Zusammenhang mit tödlicher Gewalt.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: um Blut zu vergießen
  rationale: לְמַעַן mit Infinitiv drückt Zweck beziehungsweise beabsichtigte Folge aus; die konkrete hebräische Metapher des Blutvergießens bleibt erhalten.
- source_word: וְאֶל הֶהָרִים אָכְלוּ
  choice: Auf den Bergen hielten sie Mahlzeiten ab
  rationale: Wörtlich ist vom Essen auf den Bergen die Rede. Die Formulierung macht den Vorgang auf Deutsch verständlich, ohne die im Kontext naheliegende kultische Bedeutung ausdrücklich in den Haupttext einzutragen.
- source_word: זִמָּה
  choice: Schandtaten
  rationale: זִמָּה kann schamlose, häufig sexuelle Verfehlung oder empörende Bosheit bezeichnen. „Schandtaten“ bewahrt die moralische Schwere und lässt den genauen Umfang des Begriffs offen.
- source_word: עָשׂוּ בְתוֹכֵךְ
  choice: mitten in dir verübten sie
  rationale: עשה mit einem abstrakten Gegenstand wird idiomatisch mit „verüben“ wiedergegeben; „mitten in dir“ wahrt die personifizierte Anrede Jerusalems.
theological_decisions:
- issue: Bedeutung der Mahlzeiten auf den Bergen
  choice: Die kultische Deutung wird nicht in den Haupttext aufgenommen, sondern in einer Fußnote erläutert.
  alternative: „An den Höhenheiligtümern hielten sie Opfermahlzeiten ab.“
  rationale: Der weitere Kontext legt unerlaubte, wahrscheinlich götzendienerische Kultmahlzeiten nahe, doch der hebräische Wortlaut nennt ausdrücklich nur das Essen auf den Bergen.
- issue: Semantischer Umfang von זִמָּה
  choice: „Schandtaten“ lässt sowohl sexuelle Schandtat als auch umfassendere empörende Bosheit zu.
  alternative: „Unzucht“ oder „sexuelle Ausschweifung“
  rationale: Der Begriff hat häufig sexuelle Konnotationen, kann aber breiter eine schamlose, empörende Tat bezeichnen; diese Spannung soll nicht vorschnell aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Singularanrede Jerusalems bleibt durch „in dir“ erhalten. Der Satzbau ist klar gegliedert; kulturelle und lexikalische Mehrdeutigkeiten werden in den Fußnoten offengelegt.
