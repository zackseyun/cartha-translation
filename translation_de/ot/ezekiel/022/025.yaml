  text: קֶ֤שֶׁר נְבִיאֶ֨י/הָ֙ בְּ/תוֹכָ֔/הּ כַּ/אֲרִ֥י שׁוֹאֵ֖ג טֹ֣רֵֽף טָ֑רֶף נֶ֣פֶשׁ אָכָ֗לוּ חֹ֤סֶן וִ/יקָר֙ יִקָּ֔חוּ אַלְמְנוֹתֶ֖י/הָ הִרְבּ֥וּ בְ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/025.yaml
  text: 'A conspiracy of her prophets is in her midst[a], like a roaring lion tearing prey: they have devoured lives, they take wealth and precious things, they have multiplied her widows in her midst.'
translation:
  language: de
  text: 'Mitten in ihr schmieden ihre Propheten eine Verschwörung. Sie sind wie ein brüllender Löwe, der Beute zerreißt: Sie verschlingen Menschenleben[a], nehmen Reichtum und Kostbarkeiten an sich und machen mitten in ihr viele Frauen zu Witwen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Menschen“; wörtlicher: „Seelen“. Das hebräische Wort nefesch bezeichnet häufig einen lebenden Menschen oder das Leben und nicht nur die immaterielle Seele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר נְבִיאֶיהָ
  choice: ihre Propheten schmieden eine Verschwörung
  rationale: קֶשֶׁר bezeichnet eine verschwörerische Verbindung oder ein Komplott. Die verbale deutsche Wendung ist natürlich und bewahrt das koordinierte, feindselige Handeln.
- source_word: בְּתוֹכָהּ
  choice: mitten in ihr
  rationale: Die Wendung bezieht sich auf die als weiblich vorgestellte Stadt und bildet durch ihre Wiederholung einen Rahmen um den Vers.
- source_word: כַּאֲרִי שׁוֹאֵג טֹרֵף טָרֶף
  choice: wie ein brüllender Löwe, der Beute zerreißt
  rationale: Die Übersetzung erhält das gewaltsame Löwenbild und gibt die Verbindung aus Partizip und stammverwandtem Objekt in natürlichem Deutsch wieder.
- source_word: נֶפֶשׁ אָכָלוּ
  choice: sie verschlingen Menschenleben
  rationale: נֶפֶשׁ meint hier im Kontext mörderischer Gewalt menschliches Leben beziehungsweise lebende Menschen, nicht ausschließlich eine immaterielle Seele. „Verschlingen“ wahrt die Raubtiermetapher.
- source_word: חֹסֶן וִיקָר
  choice: Reichtum und Kostbarkeiten
  rationale: 'Beide Wörter bezeichnen hier materiellen Besitz: חֹסֶן Vermögen oder Reichtum und יקר wertvolle Dinge.'
- source_word: יִקָּחוּ
  choice: nehmen ... an sich
  rationale: Der Imperfekt beschreibt das kennzeichnende Handeln der Propheten; die Wendung klingt im Deutschen natürlich und lässt den räuberischen Kontext die gewaltsame Nuance vermitteln.
- source_word: אַלְמְנוֹתֶיהָ הִרְבּוּ
  choice: machen ... viele Frauen zu Witwen
  rationale: Die idiomatische Aussage bedeutet, dass ihre Gewalt zahlreiche Ehemänner tötet und dadurch viele Witwen zurücklässt. Diese deutsche Formulierung ist klarer als das wörtliche „vermehren ihre Witwen“.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Gerichtskontext
  choice: Menschenleben
  alternative: Seelen; Menschen
  rationale: Der Text verurteilt tödliche Ausbeutung und formuliert keine technische Aussage über eine immaterielle Seele. „Menschenleben“ bewahrt den Bezug auf Personen und Leben, ohne eine spätere anthropologische Festlegung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weiblichen Pronomen beziehen sich auf die Stadt. Die wiederholte Ortsangabe „mitten in ihr“ sowie die drastische Raubtiermetaphorik bleiben erhalten; die schwierige hebräische Nominalkonstruktion am Versanfang wird für natürliches Deutsch verbal wiedergegeben.
