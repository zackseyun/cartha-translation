  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Das Wayyiqtol von היה führt hier formelhaft den nächsten Offenbarungsabschnitt ein. Zusammen mit דְבַר und אֵלַי entspricht „das Wort … erging an mich“ natürlichem, würdigem Deutsch.
- source_word: דְבַר
  choice: das Wort
  rationale: In der festen prophetischen Formel דְבַר יְהוָה bewahrt „das Wort“ die lexikalische Transparenz und den Charakter göttlicher Offenbarung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit „erging“ ist „an mich“ die idiomatische deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder; die traditionelle Ersatzlesung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etablierte prophetische Formel „das Wort Jahwes erging an mich“ wahrt den feierlichen Ton; der Doppelpunkt führt die folgende Gottesrede knapp und idiomatisch ein.
