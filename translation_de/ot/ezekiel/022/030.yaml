  text: וָ/אֲבַקֵּ֣שׁ מֵ/הֶ֡ם אִ֣ישׁ גֹּֽדֵר גָּדֵר֩ וְ/עֹמֵ֨ד בַּ/פֶּ֧רֶץ לְ/פָנַ֛/י בְּעַ֥ד הָ/אָ֖רֶץ לְ/בִלְתִּ֣י שַׁחֲתָ֑/הּ וְ/לֹ֖א מָצָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/030.yaml
  text: And I sought among them for a man who would build up a wall and stand in the breach before me on behalf of the land[a], so that I would not destroy it[b], but I found none.
translation:
  language: de
  text: Und ich suchte unter ihnen nach einem Mann[b], der eine Mauer errichten und vor mir für das Land in der Bresche stehen würde[a], damit ich es nicht vernichte; doch ich fand keinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier das Bild eines Mannes, der eine Mauer errichtet und sich vor Gott in die Bresche stellt. Es verbindet Schutz und stellvertretendes Eintreten zugunsten des Landes.
    reason: metaphorical_ambiguity
  - marker: b
    text: 'Hebräisch: „einen Mann“. Die maskuline Singularform kann hier repräsentativ gebraucht sein; die Übersetzung bewahrt den Wortlaut des Ausgangstextes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבַקֵּשׁ מֵהֶם
  choice: Und ich suchte unter ihnen nach
  rationale: בקש bezeichnet ein gezieltes Suchen; מן markiert hier die Gruppe, innerhalb derer gesucht wird. Die Formulierung ist im Deutschen natürlich und bewahrt den fortführenden Satzanschluss.
- source_word: אִישׁ
  choice: einem Mann
  rationale: Die maskuline Singularform wird entsprechend dem Ausgangstext bewahrt; zugleich kann der Mann repräsentativ für jemanden aus dem Volk stehen.
- source_word: גֹּדֵר גָּדֵר
  choice: der eine Mauer aufmauern würde
  rationale: Die figura etymologica aus Partizip und stammverwandtem Substantiv wird durch „eine Mauer aufmauern“ möglichst anschaulich wiedergegeben. Im Kontext geht es um das Errichten oder Wiederherstellen einer Schutzmauer.
- source_word: וְעֹמֵד בַּפֶּרֶץ
  choice: und in die Bresche treten würde
  rationale: „Bresche“ hält das konkrete Mauerbild fest; die deutsche Wendung „in die Bresche treten“ vermittelt zugleich den Gedanken schützenden und stellvertretenden Eingreifens.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die direkte Entsprechung bewahrt das Stehen in Gottes Gegenwart, ohne die Art des Eintretens auf Gebet allein festzulegen.
- source_word: בְּעַד הָאָרֶץ
  choice: für das Land
  rationale: בְּעַד bezeichnet ein Eintreten zugunsten des Landes. „Für das Land“ ist knapp und schließt sich im Deutschen natürlich an die feste Wendung an.
- source_word: לְבִלְתִּי שַׁחֲתָהּ
  choice: damit ich es nicht vernichten müsste
  rationale: Die Konstruktion drückt den Zweck aus, die Vernichtung des Landes abzuwenden. „Müsste“ gibt in diesem Zusammenhang die beabsichtigte Vermeidung natürlich wieder, ohne Gottes Handlungsfähigkeit einzuschränken.
- source_word: וְלֹא מָצָאתִי
  choice: doch ich fand keinen
  rationale: „Doch“ macht den tragischen Gegensatz zwischen Suche und Ergebnis deutlich; „keinen“ greift den zuvor genannten Mann auf.
theological_decisions:
- issue: Verhältnis von Mauerbild und stellvertretendem Eintreten
  choice: Sowohl die Schutzmauer als auch das Eintreten vor Gott werden im Wortlaut bewahrt.
  alternative: Die Aussage ausschließlich als Fürbitte wiederzugeben, etwa „jemanden, der für das Land betet“.
  rationale: Der hebräische Text verbindet das Bild der beschädigten Befestigung mit einem Eintreten zugunsten des Landes. Eine rein geistliche oder rein bauliche Deutung würde diese Spannung einebnen.
- issue: Geschlechtsbezogene Wiedergabe von אִישׁ
  choice: einem Mann
  alternative: einem Menschen / jemandem
  rationale: Der Ausgangstext verwendet den maskulinen Singular. Die Übersetzung bewahrt diese Form, ohne auszuschließen, dass sie hier repräsentative Funktion hat.
- issue: Göttliche Vernichtung und ihre Abwendung
  choice: damit ich es nicht vernichten müsste
  alternative: um es nicht zu vernichten / damit ich es nicht vernichtete
  rationale: Die Formulierung stellt das gesuchte Eintreten als Mittel zur Abwendung des Gerichts dar, ohne eine weitergehende systematische Aussage über Zwang, Reue oder Unveränderlichkeit Gottes einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Mauerbild bleibt erhalten; die geläufige Wendung „in die Bresche treten“ macht seine übertragene Dimension verständlich. Der Satzschluss ist bewusst knapp und eindringlich.
