  text: וְ/אִ֣ישׁ אֶת אֵ֣שֶׁת רֵעֵ֗/הוּ עָשָׂה֙ תּֽוֹעֵבָ֔ה וְ/אִ֥ישׁ אֶת כַּלָּת֖/וֹ טִמֵּ֣א בְ/זִמָּ֑ה וְ/אִ֛ישׁ אֶת אֲחֹת֥/וֹ בַת אָבִ֖י/ו עִנָּה בָֽ/ךְ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/011.yaml
  text: One man commits an abomination with his neighbor’s wife[a], another defiles his daughter-in-law with lewdness, and another violates his sister, his father’s daughter[c][b], within you.
translation:
  language: de
  text: Der eine begeht mit der Frau seines Mitmenschen eine Abscheulichkeit[a], der andere befleckt seine Schwiegertochter durch schändliches sexuelles Verhalten[b], und wieder ein anderer missbraucht seine Schwester, die Tochter seines Vaters, in dir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tut mit der Frau seines Mitmenschen eine Abscheulichkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „befleckt seine Schwiegertochter durch sexuelle Verderbtheit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „erniedrigt“; das hebräische Verb kann im sexuellen Zusammenhang Missbrauch, Verletzung und Demütigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ ... וְאִישׁ ... וְאִישׁ
  choice: der eine ... der andere ... wieder ein anderer
  rationale: Die dreimalige Wiederholung von אִישׁ gliedert die Aufzählung nach einzelnen Tätern. Die gewählte deutsche Form gibt diese Struktur natürlich und deutlich wieder.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: die Frau seines Mitmenschen
  rationale: רֵעַ bezeichnet hier den Nächsten, Gefährten oder Mitmenschen. „Mitmensch“ ist im modernen Deutsch verständlich und vermeidet die mögliche Verengung von „Nachbar“ auf räumliche Nähe.
- source_word: עָשָׂה תּוֹעֵבָה
  choice: begeht ... etwas Abscheuliches
  rationale: Die Verbindung bedeutet wörtlich „tut eine Abscheulichkeit“. Die Formulierung bewahrt das starke moralische Urteil und klingt zugleich natürlich; der sexuelle Bezug ergibt sich aus „mit der Frau“.
- source_word: כַלָּתוֹ
  choice: seine Schwiegertochter
  rationale: Dies ist die direkte und präzise Wiedergabe des hebräischen Verwandtschaftsbegriffs.
- source_word: טִמֵּא
  choice: entehrt
  rationale: Das Verb bezeichnet Verunreinigung oder Befleckung. Im Zusammenhang sexuellen Unrechts vermittelt „entehrt“ die moralische Beschädigung idiomatisch, ohne einen ausschließlich kultischen Sinn nahezulegen.
- source_word: בְּזִמָּה
  choice: durch schändliches sexuelles Verhalten
  rationale: זִמָּה bezeichnet hier vorsätzliches, schamloses sexuelles Unrecht. Die Wiedergabe macht den im Kontext eindeutigen sexuellen Sinn verständlich und erhält die starke ethische Wertung.
- source_word: אֲחֹתוֹ בַת אָבִיו
  choice: seine Schwester, die Tochter seines Vaters
  rationale: Die Apposition wird beibehalten, weil sie die Beziehung in der Ausdrucksweise des Gesetzes präzisiert, ohne vorschnell festzulegen, ob „Schwester“ oder „Halbschwester“ gemeint ist.
- source_word: עִנָּה
  choice: missbraucht
  rationale: ענה kann im sexuellen Zusammenhang Erniedrigung, Bedrängung und Verletzung bezeichnen. „Missbraucht“ wahrt den sexuellen und entwürdigenden Charakter, ohne den genauen Grad der im Verb nicht vollständig bestimmten Gewalt festzulegen.
- source_word: בָּךְ
  choice: in dir
  rationale: Das feminine Singularpronomen richtet sich an die personifizierte Stadt Jerusalem. „In dir“ erhält die direkte Anrede knapp und formal nah am Hebräischen.
theological_decisions:
- issue: Moralische Schärfe der Bezeichnungen für die sexuellen Vergehen
  choice: Starke wertende Sprache wird mit „etwas Abscheuliches“, „entehrt“, „schändliches sexuelles Verhalten“ und „missbraucht“ bewahrt.
  alternative: Neutralere Formulierungen wie „hat Verkehr mit“ oder „verhält sich unsittlich gegenüber“.
  rationale: Der Vers erhebt eine schwere Anklage gegen sexuelle, familiäre und gesellschaftliche Verderbnis. Eine neutrale Umschreibung würde die ethische Wucht der hebräischen Begriffe abschwächen.
- issue: Gewalt- und Erniedrigungsaspekt von עִנָּה
  choice: „missbraucht“
  alternative: „demütigt“, „vergewaltigt“ oder neutral „hat Geschlechtsverkehr mit“
  rationale: Das Verb trägt hier einen entwürdigenden und verletzenden Sinn. „Missbraucht“ lässt die echte Spannung zwischen sexueller Verletzung und Erniedrigung bestehen, ohne zwingend eine spezifische Form körperlicher Gewalt in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Anklage bleibt deutlich hörbar. Die Formulierungen vermeiden sowohl beschönigende Euphemismen als auch eine überpräzise Festlegung dort, wo das Hebräische eine Spannweite zulässt.
