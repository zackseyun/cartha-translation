lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die wayyiqtol-Form von היה eröffnet hier die nächste prophetische Mitteilung. Die im Deutschen geläufige Formel „das Wort … erging“ gibt die Funktion natürlich und würdevoll wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: In der Verbindung דְבַר יְהוָה bezeichnet das Substantiv die prophetische Offenbarung. „Das Wort“ bewahrt zudem die wiederkehrende Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder; die traditionelle Wiedergabe „der HERR“ wird in einer Fußnote genannt.
- source_word: אֵלַי
  choice: an mich
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person bezeichnet die Ausrichtung der Mitteilung auf den Propheten. In der deutschen prophetischen Formel ist „an mich“ idiomatisch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, während die traditionelle deutsche Ersatzlesung transparent in der Fußnote angegeben wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste prophetische Formel „das Wort Jahwes erging an mich“ ist verständlich und wahrt die Nähe zur hebräischen Struktur; der Doppelpunkt leitet die in Vers 2 folgende Rede ein.
