  terminology: „Fürsten Israels“ wahrt den Rang von נְשִׂיאֵי יִשְׂרָאֵל. „Blut zu vergießen“ bewahrt das konkrete Bild. Die Fußnotenmarkierung muss an der Wendung stehen, die sie erläutert, nicht bei „Sieh“.
