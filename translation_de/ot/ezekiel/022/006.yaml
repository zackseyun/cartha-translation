  source_fidelity: 'Die Grundbedeutung wird getroffen: Die israelitischen Fürsten werden innerhalb des direkt angeredeten Jerusalem angeklagt, jeweils ihre eigene Macht zum Blutvergießen einzusetzen. „Darauf aus sein“ gibt die Ziel-/Absichtsangabe von לְמַעַן angemessen wieder. Die Wendung „nach der Macht seines Arms“ ist jedoch im Deutschen unnötig schwerfällig und vermischt die idiomatische Deutung mit dem wörtlichen Bild.'
