  text: הִנֵּה֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל אִ֥ישׁ לִ/זְרֹע֖/וֹ הָ֣יוּ בָ֑/ךְ לְמַ֖עַן שְׁפָךְ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/006.yaml
  text: Look[a], the princes of Israel in you, each according to his power, were in you to shed blood.
translation:
  language: de
  text: Siehe, die Fürsten Israels in dir waren, jeder entsprechend seiner Macht[a], darauf aus, Blut zu vergießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder nach seinem Arm“. Der „Arm“ steht hier bildlich für Stärke oder Macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeit weckende Ausruf wird nachdrücklich, aber in modernem Deutsch wiedergegeben.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: die Fürsten Israels
  rationale: „Fürsten“ bezeichnet hier die politisch führenden Männer und bewahrt den Rang sowie den prophetischen Sprachton.
- source_word: אִישׁ לִזְרֹעוֹ
  choice: jeder nach der Macht seines Arms
  rationale: אִישׁ ist distributiv („jeder“); „Arm“ bleibt als konkretes hebräisches Bild erhalten, während „Macht“ dessen metonymischen Sinn erschließt.
- source_word: הָיוּ בָךְ
  choice: in dir … waren darauf aus
  rationale: Das feminine „dir“ richtet sich auf Jerusalem. Die Konstruktion wird in natürlichem Deutsch mit der folgenden Zweckangabe verbunden.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: waren darauf aus, Blut zu vergießen
  rationale: לְמַעַן mit Infinitiv bezeichnet hier Ziel beziehungsweise Absicht; „darauf aus sein“ vermittelt den anklagenden purposiven Sinn, ohne das Blutbild abzuschwächen.
