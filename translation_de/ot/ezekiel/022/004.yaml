  text: בְּ/דָמֵ֨/ךְ אֲשֶׁר שָׁפַ֜כְתְּ אָשַׁ֗מְתְּ וּ/בְ/גִלּוּלַ֤יִ/ךְ אֲשֶׁר עָשִׂית֙ טָמֵ֔את וַ/תַּקְרִ֣יבִי יָמַ֔יִ/ךְ וַ/תָּב֖וֹא עַד שְׁנוֹתָ֑יִ/ךְ עַל כֵּ֗ן נְתַתִּ֤י/ךְ חֶרְפָּה֙ לַ/גּוֹיִ֔ם וְ/קַלָּסָ֖ה לְ/כָל הָ/אֲרָצֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/004.yaml
  text: By your blood that you have shed[a], you have become guilty, and by your idols that you have made, you have become unclean. You have brought your days near and have come to your years[b]. Therefore I have made you a reproach to the nations and a mockery to all the lands.
translation:
  language: de
  text: Durch das Blut, das du vergossen hast, bist du schuldig geworden, und durch deine Götzen, die du gemacht hast, bist du unrein geworden. Du hast deine Tage näher gebracht und bist zu deinen Jahren gelangt.[a] Darum habe ich dich den Nationen zum Schimpf und allen Ländern zum Gespött gemacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt wahrscheinlich: Du hast die für dich bestimmte Zeit des Gerichts näher gebracht und erreicht.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „Götzen“ übersetzte hebräische Wort ist eine verächtliche Bezeichnung, die Ezechiel häufig für falsche Götter und ihre Bilder gebraucht.
    reason: cultural_note
lexical_decisions:
- source_word: בְּדָמֵךְ אֲשֶׁר שָׁפַכְתְּ
  choice: Durch das Blut, das du vergossen hast
  rationale: Das בְּ ist hier instrumental beziehungsweise kausal zu verstehen. Die enge Wiedergabe bewahrt das hebräische Bild und macht durch den Relativsatz deutlich, dass es um Blutvergießen geht.
- source_word: אָשַׁמְתְּ
  choice: bist du schuldig geworden
  rationale: Das Verb bezeichnet das Schuldigwerden beziehungsweise das Tragen von Schuld; die resultative Formulierung entspricht dem Zusammenhang.
- source_word: גִלּוּלַיִךְ
  choice: deine Götzen
  rationale: גִלּוּלִים ist besonders bei Ezechiel eine verächtliche Bezeichnung für falsche Götter oder Götzenbilder. „Götzen“ ist im Haupttext klar und trägt bereits eine abwertende Färbung.
- source_word: טָמֵאת
  choice: bist du unrein geworden
  rationale: Die Qal-Form bezeichnet hier das Eintreten in einen Zustand der Unreinheit und steht parallel zu „bist du schuldig geworden“.
- source_word: וַתַּקְרִיבִי יָמַיִךְ
  choice: Du hast deine Tage herbeigeführt
  rationale: Der Hifil von קרב bedeutet wörtlich „nahe bringen“. „Herbeigeführt“ klingt im Deutschen natürlich und lässt den Bezug auf die nahende Gerichtszeit erkennen, ohne ihn ausdrücklich einzutragen.
- source_word: וַתָּבֹוא עַד שְׁנוֹתָיִךְ
  choice: und bist zu deinen Jahren gelangt
  rationale: Die ungewöhnliche hebräische Wendung bleibt bewusst offen. Sie bezeichnet wahrscheinlich das Erreichen der bestimmten Zeit des Gerichts, doch diese Deutung wird nicht vollständig in den Haupttext eingebaut.
- source_word: חֶרְפָּה
  choice: Schandbild
  rationale: Das Wort bezeichnet Schmach, Schande oder einen Gegenstand des Hohns. „Zum Schandbild“ gibt die prädikative Wendung idiomatisch wieder und unterscheidet sie von „Gespött“ im Parallelglied.
- source_word: קַלָּסָה
  choice: Gespött
  rationale: Das Substantiv bezeichnet Verhöhnung oder einen Gegenstand des Spottes; „zum Gespött“ ist eine geläufige und würdige deutsche Wendung.
- source_word: הָאֲרָצוֹת
  choice: allen Ländern
  rationale: Im Parallelismus mit den Nationen sind Länder beziehungsweise Gebiete gemeint, nicht die Erde als Ganzes.
theological_decisions:
- issue: Schuld und Unreinheit Jerusalems
  choice: Blutvergießen begründet gerichtliche Schuld, Götzendienst bewirkt Unreinheit; beide Anklagen bleiben nebeneinander bestehen.
  alternative: Unreinheit nur zeremoniell zu verstehen oder Schuld lediglich als Metapher aufzufassen.
  rationale: Der hebräische Text verbindet konkrete Blutschuld mit kultisch-moralischer Verunreinigung durch Götzen, ohne beide Kategorien gleichzusetzen.
- issue: Die herbeigeführten Tage und erreichten Jahre
  choice: Die zeitliche Aussage bleibt im Haupttext bildhaft und wird in der Fußnote als wahrscheinlicher Hinweis auf Jerusalems Gerichtszeit erläutert.
  alternative: 'Explizit zu übersetzen: „Du hast das Ende deiner Tage beschleunigt und das Ende deiner Jahre erreicht.“'
  rationale: Der Kontext legt diese Deutung nahe, doch die hebräische Formulierung nennt weder ausdrücklich ein Ende noch direkt das Gericht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede Jerusalems im Femininum ist im Deutschen grammatisch nicht sichtbar, bleibt aber durch den Kontext erhalten. Die ungewöhnliche Zeitmetapher wurde bewusst nicht geglättet; eine knappe Fußnote erläutert ihre wahrscheinlichste Bedeutung.
