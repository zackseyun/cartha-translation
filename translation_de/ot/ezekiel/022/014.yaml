  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigenname wieder. „Herz“, „Hände“, „standhalten“ und „stark bleiben“ bewahren die körperlichen Bilder und ihre übertragene Aussage, ohne sie dogmatisch auszudeuten.
