  text: הֲ/יַעֲמֹ֤ד לִבֵּ/ךְ֙ אִם תֶּחֱזַ֣קְנָה יָדַ֔יִ/ךְ לַ/יָּמִ֕ים אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה אוֹתָ֑/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/014.yaml
  text: Will your heart endure[a], or will your hands remain strong, in the days when I deal with you? I, Yahweh, have spoken, and I will do it.
translation:
  language: de
  text: Wird dein Herz standhalten[a], oder werden deine Hände stark bleiben an den Tagen, an denen ich mit dir verfahre? Ich, Jahwe, habe gesprochen und werde es tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wird dein Herz fest bleiben, oder werden deine Hände stark sein an den Tagen, an denen ich gegen dich handle?“'
    reason: 'Lexikalische und syntaktische Alternative: עמד kann „stehen/fest bleiben“ heißen, und עשה mit direktem Objekt bezeichnet im Gerichtskontext ein gegen die Adressatin gerichtetes Handeln.'
lexical_decisions:
- source_word: הֲיַעֲמֹד לִבֵּךְ
  choice: Wird dein Herz standhalten
  rationale: עמד bedeutet wörtlich „stehen“; zusammen mit „Herz“ bezeichnet es hier idiomatisch das Bewahren von Mut und innerer Kraft unter dem kommenden Gericht. „Standhalten“ erhält sowohl das Bild als auch den Sinn.
- source_word: תֶּחֱזַקְנָה יָדַיִךְ
  choice: werden deine Hände stark bleiben
  rationale: Die Hände stehen bildhaft für Handlungsfähigkeit und Kraft. „Stark bleiben“ gibt die rhetorische Frage natürlich wieder und bewahrt das Körperbild.
- source_word: לַיָּמִים
  choice: an den Tagen
  rationale: Die Präposition ist hier temporal gebraucht. „An den Tagen“ bewahrt den pluralischen Ausdruck des Hebräischen.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ
  choice: an denen ich mit dir verfahre
  rationale: Die hebräische Wendung ist knapp und bezeichnet im Kontext Jahwes gegen Jerusalem gerichtetes Handeln. „Mit dir verfahre“ lässt die Art dieses Handelns durch den Gerichtskontext bestimmen, ohne ein spezifischeres Verb wie „richten“ einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Das Perfekt bezeichnet die bereits ergangene, verbindliche göttliche Erklärung.
- source_word: וְעָשִׂיתִי
  choice: und werde es tun
  rationale: Das Perfekt drückt in der prophetischen Bekräftigungsformel die Gewissheit der bevorstehenden Ausführung aus. Das ergänzte „es“ bezieht sich natürlich auf das zuvor Gesprochene.
theological_decisions:
- issue: Richtung und Charakter des göttlichen Handelns in אֲנִי עֹשֶׂה אוֹתָךְ
  choice: an denen ich mit dir verfahre
  alternative: an denen ich gegen dich handle
  rationale: Der unmittelbare Zusammenhang macht das Handeln zum Gerichtshandeln gegen Jerusalem. Die gewählte Fassung wahrt jedoch die ungewöhnlich knappe und nicht ausdrücklich mit „gegen“ formulierte hebräische Wendung.
- issue: Zeitbezug von וְעָשִׂיתִי
  choice: und werde es tun
  alternative: und habe es getan
  rationale: Obwohl die Verbform formal perfektisch ist, dient sie nach „Ich, Jahwe, habe gesprochen“ als feierliche Zusicherung der noch bevorstehenden und sicheren Vollstreckung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Singularanrede des Hebräischen bezieht sich im Kontext auf Jerusalem, ist im deutschen Pronomen „du“ jedoch nicht eigens markiert. Die parallelen Bilder „Herz“ und „Hände“ bleiben erhalten.
