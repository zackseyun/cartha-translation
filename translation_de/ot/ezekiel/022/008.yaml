  text: קָדָשַׁ֖/י בָּזִ֑ית וְ/אֶת שַׁבְּתֹתַ֖/י חִלָּֽלְתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/008.yaml
  text: You have despised my holy things[a], and you have profaned my Sabbaths.
translation:
  language: de
  text: Was mir heilig ist, hast du verachtet,[a] und meine Sabbate hast du entweiht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Heiligtümer“ beziehungsweise „meine heiligen Orte“. Das Hebräische kann konkreter heilige Stätten bezeichnen, ist hier aber weiter gefasst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדָשַׁי
  choice: was mir heilig ist
  rationale: Die substantivierte Pluralform mit Suffix bezeichnet das, was Gott heilig ist beziehungsweise zu seinem heiligen Bereich gehört. Die Formulierung bewahrt den weiten Bezug, ohne ihn auf Heiligtümer oder heilige Orte einzuengen.
- source_word: בָּזִית
  choice: hast du verachtet
  rationale: בזה bezeichnet, dass jemand etwas geringschätzt oder mit Verachtung behandelt. „Verachtet“ gibt den starken moralischen Vorwurf knapp und natürlich wieder.
- source_word: שַׁבְּתֹתַי
  choice: meine Sabbate
  rationale: Der Plural mit Suffix bedeutet unmittelbar „meine Sabbate“. Der etablierte Begriff bewahrt den kultischen und bundestheologischen Bezug.
- source_word: חִלָּלְתְּ
  choice: hast du entweiht
  rationale: Das Piel von חלל bezeichnet hier, dass Heiliges profan gemacht oder als gewöhnlich behandelt wird. „Entweiht“ ist im Deutschen präzise und idiomatisch.
theological_decisions:
- issue: Bedeutungsumfang von קָדָשַׁי
  choice: weiter Bezug auf alles, was Gott heilig ist
  alternative: spezifischer Bezug auf Gottes Heiligtümer oder heilige Orte
  rationale: Der hebräische Plural lässt einen breiten Sammelbegriff zu. Die Übersetzung legt den Bezug daher nicht ausschließlich auf den Tempel oder bestimmte heilige Orte fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erkennbar; „was mir heilig ist“ klingt natürlicher als das substantivische „meine heiligen Dinge“ und erhält zugleich die Bedeutungsbreite.
