  text: עַ֤ם הָ/אָ֨רֶץ֙ עָ֣שְׁקוּ עֹ֔שֶׁק וְ/גָזְל֖וּ גָּזֵ֑ל וְ/עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנ֔וּ וְ/אֶת הַ/גֵּ֥ר עָשְׁק֖וּ בְּ/לֹ֥א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/029.yaml
  text: The people of the land have practiced oppression and committed robbery; they have mistreated the poor and needy[a], and they have oppressed the foreigner without justice.
translation:
  language: de
  text: Das Volk des Landes übt Unterdrückung aus und begeht Raub. Sie beuten Arme und Bedürftige aus und unterdrücken den Fremden[a] ohne Recht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ansässigen Fremden«. Das hebräische Wort bezeichnet einen nicht einheimischen Menschen, der unter der Bevölkerung lebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die Wendung wird nah am hebräischen Ausdruck wiedergegeben und bezeichnet hier die Bevölkerung des Landes insgesamt, nicht zwingend eine besondere gesellschaftliche Schicht.
- source_word: עָשְׁקוּ עֹשֶׁק
  choice: übt Unterdrückung aus
  rationale: Die figura etymologica aus Verb und verwandtem Substantiv verstärkt und charakterisiert das Handeln; die deutsche Formulierung ist idiomatisch und bewahrt den Nachdruck.
- source_word: וְגָזְלוּ גָּזֵל
  choice: und begeht Raub
  rationale: Auch hier steht eine verstärkende Verbindung aus Verb und verwandtem Substantiv. »Raub begehen« gibt die gewaltsame beziehungsweise unrechtmäßige Wegnahme natürlich wieder.
- source_word: וְעָנִי וְאֶבְיוֹן
  choice: Arme und Bedürftige
  rationale: Das geläufige Wortpaar bezeichnet Menschen in wirtschaftlich und gesellschaftlich verletzlicher Lage; die Wiedergabe bleibt konkret und verständlich.
- source_word: הוֹנוּ
  choice: misshandeln sie
  rationale: Das Hifil bezeichnet schädigendes, ausbeuterisches oder bedrückendes Verhalten. »Misshandeln« ist hier breit genug, ohne das Wort mit dem anschließenden עשק gleichzusetzen.
- source_word: הַגֵּר
  choice: den Fremden
  rationale: גֵּר bezeichnet einen fremdstämmigen Menschen, der dauerhaft unter der einheimischen Bevölkerung lebt. »Fremder« ist im Deutschen knapp und verständlich; eine Fußnote präzisiert den Aufenthaltsstatus.
- source_word: עָשְׁקוּ
  choice: unterdrücken sie
  rationale: Die Wiedergabe bewahrt die lexikalische Verbindung zur Unterdrückung am Versanfang und benennt die konkrete soziale Gewalttat.
- source_word: בְּלֹא מִשְׁפָּט
  choice: ohne Recht
  rationale: מִשְׁפָּט meint hier die rechtliche und sittliche Ordnung beziehungsweise einen berechtigten Rechtsanspruch. »Ohne Recht« bewahrt die substantivische Prägnanz und kann sowohl Rechtswidrigkeit als auch verweigerte Gerechtigkeit umfassen.
theological_decisions:
- issue: Sozialethische Begriffe in der prophetischen Anklage
  choice: Die konkreten Formen des Unrechts – Unterdrückung, Raub, Misshandlung der Armen und Entrechtung des Fremden – bleiben ausdrücklich benannt.
  alternative: Die Vorwürfe allgemein als Bosheit oder Unrecht zusammenzufassen.
  rationale: Der hebräische Text formuliert eine konkrete gesellschaftliche Anklage. Eine Verallgemeinerung würde ihre ethische Schärfe und die hervorgehobenen verletzlichen Personengruppen abschwächen.
- issue: Bedeutungsumfang von בְּלֹא מִשְׁפָּט
  choice: ohne Recht
  alternative: ohne Gerechtigkeit; ohne Rechtsanspruch; ohne ordentliches Verfahren
  rationale: Die knappe Wiedergabe lässt den im Hebräischen möglichen Bezug auf Rechtsordnung, Gerechtigkeit und rechtmäßigen Anspruch offen, statt ihn auf ein modernes Verfahrenskonzept einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die konkreten sozialen Anklagepunkte bleiben sichtbar. Der Wechsel vom kollektiven Singular »das Volk« zu »sie« ist im Deutschen natürlich und entspricht dem pluralischen hebräischen Prädikat.
