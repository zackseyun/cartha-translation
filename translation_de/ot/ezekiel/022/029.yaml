  naturalness: Der Satzteil »Arme und Bedürftige misshandeln sie« ist zwar syntaktisch möglich, ist wegen der Abfolge von Objekt und pluralischem Verb im modernen Deutsch aber kurzzeitig missverständlich. Die Umstellung zu einer eindeutigen Subjekt-Verb-Objekt-Folge ist natürlicher.
