id: EZK.22.18
reference: Ezekiel 22:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הָיוּ לִ֥/י בֵֽית יִשְׂרָאֵ֖ל ל/סוג כֻּלָּ֡/ם נְ֠חֹשֶׁת וּ/בְדִ֨יל וּ/בַרְזֶ֤ל וְ/עוֹפֶ֨רֶת֙ בְּ/ת֣וֹךְ כּ֔וּר סִגִ֥ים כֶּ֖סֶף הָיֽוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/018.yaml
  text: Son of man[a], the house of Israel has become dross to me; all of them are bronze and tin and iron and lead in the midst of a furnace; they are the dross of silver.
translation:
  language: de
  text: Menschensohn, das Haus Israel ist mir zu Schlacke geworden. Sie alle sind Bronze[a], Zinn, Eisen und Blei mitten im Schmelzofen; Silberschlacke sind sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kupfer“.'
    reason: נְחֹשֶׁת kann sowohl Kupfer als auch Bronze bezeichnen.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel feststehende deutsche Wiedergabe der hebräischen Anredeformel bewahrt das Bild und klingt zugleich würdevoll.
- source_word: הָיוּ לִי
  choice: ist mir ... geworden
  rationale: Gibt den eingetretenen Zustand aus der Sicht des göttlichen Sprechers wieder; der Singular richtet sich nach dem kollektiven Ausdruck „das Haus Israel“.
- source_word: בֵית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt die bundesgeschichtlich-kollektive Ausdrucksweise des Hebräischen.
- source_word: לְסוּג
  choice: zu Schlacke
  rationale: Bezeichnet den wertlosen Rückstand beziehungsweise die ausgeschiedenen Verunreinigungen beim Schmelzen und erhält das metallurgische Bild.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Gibt die umfassende und verteilende Aussage des Pronomens natürlich wieder.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das hebräische Wort kann Kupfer oder Bronze bezeichnen; „Bronze“ passt in der Metallaufzählung, während die echte lexikalische Alternative in einer Fußnote erhalten bleibt.
- source_word: בְדִיל
  choice: Zinn
  rationale: Übliche und sachlich passende Bezeichnung des Metalls im Schmelzkontext.
- source_word: בַרְזֶל
  choice: Eisen
  rationale: Direkte lexikalische Entsprechung.
- source_word: עוֹפֶרֶת
  choice: Blei
  rationale: Direkte lexikalische Entsprechung.
- source_word: בְּתוֹךְ כּוּר
  choice: mitten im Schmelzofen
  rationale: „Schmelzofen“ präzisiert die Funktion von כּוּר; „mitten im“ gibt בְּתוֹךְ anschaulich und natürlich wieder.
- source_word: סִגִים כֶּסֶף
  choice: Silberschlacke
  rationale: Die deutsche Zusammensetzung gibt die hebräische Genitivverbindung knapp wieder und bewahrt den Gegensatz zwischen wertvollem Silber und ausgeschiedener Schlacke.
theological_decisions:
- issue: Bezug des göttlichen Sprechers in לִי
  choice: „mir“ ohne erklärende Erweiterung
  alternative: „vor mir“ oder „in meinen Augen“
  rationale: Das Hebräische bezeichnet knapp Israels Verhältnis zum göttlichen Sprecher. Die wörtliche Wiedergabe vermeidet eine zusätzliche Auslegung.
- issue: Metallurgische Gerichtsmetapher
  choice: Wörtliche Beibehaltung von Schlacke, Metallen und Schmelzofen
  alternative: Paraphrase als allgemeine moralische Verdorbenheit
  rationale: 'Die prophetische und theologische Spannung liegt im konkreten Bild: Israel ist nicht das kostbare Silber, sondern dessen Schlacke. Eine Paraphrase würde dieses Bild verflachen.'
- issue: Zeitwert der Formen הָיוּ
  choice: Im ersten Satz resultativ „ist ... geworden“, im Schluss nominal „Silberschlacke sind sie“
  alternative: Durchgehend „waren“ oder durchgehend „sind geworden“
  rationale: So wird zunächst der entstandene Zustand ausgedrückt und die abschließende hebräische Prädikatskonstruktion zugleich pointiert und eng am Wortlaut wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem Metallbild. Der Schluss „Silberschlacke sind sie“ nutzt eine markierte, aber natürliche Wortstellung, um die Pointe des hebräischen Satzes hervorzuheben.
