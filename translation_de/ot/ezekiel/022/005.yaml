base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/005.yaml
  text: Those who are near and those who are far from you will mock you[a], defiled of name[b], full of turmoil.
translation:
  language: de
  text: Die, die dir nahe sind, und die, die fern von dir sind, werden dich verspotten – du mit beflecktem Namen[a], voller Aufruhr[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „du, unrein/befleckt an Namen“. Die knappe hebräische Wendung kann auch bedeuten: „du, deren Ruf befleckt ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „voller Verwirrung“, „voller Tumult“ oder „voller Unordnung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרֹבוֹת וְהָרְחֹקוֹת מִמֵּךְ
  choice: Die in deiner Nähe und die fern von dir
  rationale: Die substantivierten femininen Pluraladjektive bezeichnen wohl umliegende und entfernte Völker oder Städte. Die Formulierung gibt die räumliche Gegenüberstellung natürlich wieder, ohne die Bezugsgröße ausdrücklich zu ergänzen.
- source_word: יִתְקַלְּסוּ בָךְ
  choice: werden dich verspotten
  rationale: Das Hitpael-Imperfekt bezeichnet spöttisches Verhöhnen; im Deutschen verlangt „verspotten“ ein direktes Objekt.
- source_word: טְמֵאַת הַשֵּׁם
  choice: du mit dem befleckten Namen
  rationale: Die knappe hebräische Fügung wird als an die personifizierte Stadt gerichtete Beschreibung verstanden. „Befleckt“ wahrt den Gedanken kultischer oder moralischer Verunreinigung, während „Name“ die mögliche Bedeutung „Ruf“ offenhält.
- source_word: רַבַּת הַמְּהוּמָה
  choice: du voller Aufruhr
  rationale: רַבַּת bezeichnet ein reichliches Vorhandensein; הַמְּהוּמָה umfasst Tumult, Verwirrung und Unordnung. „Voller Aufruhr“ ist prägnant und bildet die appositionale Struktur nach.
theological_decisions:
- issue: Deutung der komprimierten Wendung טְמֵאַת הַשֵּׁם
  choice: du mit dem befleckten Namen
  alternative: du, deren Ruf befleckt ist; du, unrein an Namen
  rationale: Der Text kann den Namen selbst oder den mit dem Namen verbundenen Ruf als befleckt bezeichnen. Die Übersetzung bewahrt „Name“ und vermeidet damit eine Festlegung auf „Ruf“, macht die hebräische Konstruktion aber in verständlichem Deutsch lesbar.
- issue: Explizite Benennung der angeredeten Stadt
  choice: Die zweite Person bleibt ohne Ergänzung durch „Jerusalem“ oder „Stadt“ erhalten.
  alternative: du, Jerusalem; du, Stadt
  rationale: Der Zusammenhang identifiziert die Adressatin; eine ausdrückliche Benennung wäre eine nicht im Vers stehende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich und die wiederholte Anrede „du“ bewahren den prophetischen Spott und machen die beiden knappen hebräischen Beschreibungen verständlich. Keine ausdrückliche Ergänzung des Namens Jerusalem.
