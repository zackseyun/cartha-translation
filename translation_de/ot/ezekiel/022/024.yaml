base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/024.yaml
  text: Son of man[a], say to her[c][b], ‘You are a land not cleansed and not rained on in the day of indignation.’
translation:
  language: de
  text: 'Menschensohn, sprich zu ihr: »Du bist ein Land, das nicht gereinigt ist[a] und das am Tag des Zorns[c] nicht beregnet wurde[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nicht geläutert« beziehungsweise »unrein«. Das hebräische Partizip kann einen Zustand der Unreinheit oder das Ausbleiben einer Reinigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Ausdruck ist selten; auch möglich: »am Tag des Zorns ohne Regen« oder »am Tag des Zorns nicht mit Regenschauern bedacht«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »am Tag des Grimms«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel feststehende prophetische Anrede wird formnah und in ihrem würdevollen Register wiedergegeben.
- source_word: אֱמָר לָהּ
  choice: sprich zu ihr
  rationale: Der Imperativ mit Präposition und femininem Suffix wird unmittelbar wiedergegeben; das feminine Pronomen bezieht sich auf das Land.
- source_word: אַתְּ אֶרֶץ
  choice: Du bist ein Land
  rationale: Das selbstständige feminine Pronomen redet das Land personifiziert an. Im Deutschen ist die Kopula erforderlich.
- source_word: לֹא מְטֹהָרָה
  choice: nicht gereinigt ist
  rationale: Das passive Partizip von טהר bezeichnet den Zustand dessen, was nicht rein gemacht wurde, und lässt sowohl kultische als auch sittliche Bezüge offen.
- source_word: לֹא גֻשְׁמָהּ
  choice: nicht beregnet wurde
  rationale: Die seltene Form wird am ehesten vom Wortfeld Regen beziehungsweise Regenschauer her verstanden. Die passive Formulierung bleibt erhalten; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: בְּיוֹם זָעַם
  choice: am Tag des Zorns
  rationale: זעם bezeichnet heftigen Zorn beziehungsweise Grimm. Die knappe Genitivverbindung benennt den Tag des Gerichts, ohne im Text ausdrücklich festzulegen, wessen Zorn gemeint ist.
theological_decisions:
- issue: Art des unreinen Zustands des Landes
  choice: Die passive Aussage »nicht gereinigt« bleibt stehen, ohne sie ausschließlich kultisch oder moralisch auszulegen.
  alternative: »unrein« beziehungsweise »nicht geläutert«
  rationale: Der hebräische Ausdruck kann einen Zustand der Unreinheit oder das Ausbleiben einer Reinigung bezeichnen; die Übersetzung bewahrt diese Spannung.
- issue: Verhältnis von ausbleibendem Regen und Gericht
  choice: Das Land wird als nicht beregnet am Tag des Zorns beschrieben.
  alternative: Der Regen könnte bildlich als reinigender Regen verstanden oder die Wendung allgemeiner mit »ohne Regen« wiedergegeben werden.
  rationale: Der Text verbindet Reinheit, ausbleibenden Regen und Gericht, erklärt aber den genauen metaphorischen Zusammenhang nicht. Die Übersetzung löst diese Mehrdeutigkeit nicht auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. »Menschensohn« wahrt die für Hesekiel charakteristische Anrede; »beregnet« erhält trotz seiner leichten Ungewöhnlichkeit die seltene passive Bildsprache des Hebräischen.
