  text: 'Da kam das Wort Jahwes zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Formel וַיְהִי דְבַר־יְהוָה אֵלַי gibt „kam“ den idiomatischen Sinn im Deutschen natürlich wieder, statt das hebräische „und es war/geschah“ hölzern nachzubilden.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier die göttliche Mitteilung; „das Wort“ bewahrt die geprägte prophetische Formel und ihren würdevollen Klang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präpositionalverbindung bezeichnet den Empfänger des prophetischen Wortes und wird direkt und natürlich wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Das einleitende לֵאמֹר kündigt die unmittelbar folgende Rede an. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Eingangsformel wird idiomatisch wiedergegeben; der Doppelpunkt leitet die im nächsten Vers folgende Gottesrede knapp und natürlich ein.
