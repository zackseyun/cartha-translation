base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/007.yaml
  text: In you they have treated father and mother with contempt[a]; in your midst they have oppressed the sojourner[c][b]; in you they have defrauded the fatherless and the widow.
translation:
  language: de
  text: In dir haben sie Vater und Mutter mit Verachtung behandelt; den ansässigen Fremden[a] haben sie in deiner Mitte unterdrückt; Waise[b] und Witwe haben sie in dir ausgebeutet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Fremden“ beziehungsweise „den bei euch lebenden Ausländer“. Gemeint ist ein nicht einheimischer Mensch, der dauerhaft in der Gemeinschaft lebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Vaterlosen“.'
    reason: lexical_alternative
  - marker: c
    text: Das wiederholte „in dir“ spricht die Stadt Jerusalem unmittelbar an und stellt sie als weibliche Person dar.
    reason: cultural_note
lexical_decisions:
- source_word: הֵקַלּוּ
  choice: mit Verachtung behandelt
  rationale: Das Hifil von קלל bezeichnet hier, jemanden gering zu achten oder zu entehren. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt die Schärfe der Anklage.
- source_word: אָב וָאֵם
  choice: Vater und Mutter
  rationale: Der hebräische Text nennt beide ausdrücklich. Das erhält zugleich den Anklang an das Gebot, Vater und Mutter zu ehren.
- source_word: בָךְ
  choice: in dir
  rationale: Die feminine Singularform richtet sich unmittelbar an die personifizierte Stadt Jerusalem. Die wiederholte Wendung wird als rhetorischer Rahmen bewahrt.
- source_word: לַגֵּר
  choice: den ansässigen Fremden
  rationale: גֵּר bezeichnet einen nicht einheimischen Menschen, der dauerhaft in der Gemeinschaft lebt. „Ansässiger Fremder“ gibt diese soziale Kategorie genauer wieder als das allgemeinere „Fremder“.
- source_word: עָשׂוּ בָעֹשֶׁק
  choice: haben ... unterdrückt
  rationale: Wörtlich steht eine Wendung wie „mit Unterdrückung/Erpressung handeln“. Die gewählte Fassung gibt den ausbeuterischen Charakter knapp und idiomatisch wieder.
- source_word: בְּתוֹכֵךְ
  choice: in deiner Mitte
  rationale: Die Formulierung bezeichnet das Innere der angesprochenen Gemeinschaft und bewahrt die räumlich-soziale Betonung des Hebräischen.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: Waise und Witwe
  rationale: Die festen deutschen Bezeichnungen bewahren die beiden ausdrücklich genannten, im Bundesrecht besonders geschützten Personengruppen.
- source_word: הוֹנוּ
  choice: ausgebeutet
  rationale: Das Hifil von ינה bezeichnet bedrückende, übervorteilende oder ausbeuterische Behandlung. „Ausgebeutet“ wahrt die soziale und wirtschaftliche Dimension, ohne sie auf bloßen Betrug zu verengen.
theological_decisions:
- issue: Bundesethische Bezeichnungen für schutzbedürftige Personen
  choice: Die konkreten Gruppen „ansässiger Fremder“, „Waise“ und „Witwe“ bleiben ausdrücklich genannt.
  alternative: Verallgemeinerung als „Schutzbedürftige“ oder „Benachteiligte“.
  rationale: Die Anklage greift bestimmte, im Gesetz Israels geschützte soziale Gruppen auf. Eine Verallgemeinerung würde diese intertextuelle und rechtliche Kontur abschwächen.
- issue: Direkte Anrede Jerusalems
  choice: Das wiederholte „in dir/deiner“ wird beibehalten und als Anrede der personifizierten Stadt verstanden.
  alternative: Auflösung als „in Jerusalem“ oder „unter euch“.
  rationale: Die feminine Singularform und der Kontext sprechen die Stadt unmittelbar an. Die Übersetzung erhält diese Personifikation, ohne sie im Haupttext erklärend auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Anklagesprache. Der dreigliedrige Satzbau und die wiederholte Ortsangabe erhalten den rhetorischen Nachdruck des hebräischen Textes.
