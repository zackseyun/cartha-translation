source:
  edition: WLC
  text: וָ/אֶשְׁפֹּ֤ךְ עֲלֵי/הֶם֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י כִּלִּיתִ֑י/ם דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/031.yaml
  text: So I poured out my indignation on them[a]; with the fire of my wrath I consumed them. I have put their way on their own heads[c][b], declares the Lord GOD.
translation:
  language: de
  text: Da schüttete ich meinen Zorn über sie aus; im Feuer meines Grimms verzehrte ich sie. Ihren Lebenswandel legte ich auf ihren Kopf[a], spricht der Herr Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihren Weg legte ich auf ihren Kopf.“ Das hebräische Bild besagt, dass ihr eigenes Verhalten in seinen Folgen auf sie zurückkam.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch אֲדֹנָי יְהוִה (Adonai YHWH): „Herr“ ist der Titel, „Yahweh“ der Gottesname.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: schüttete ich … aus
  rationale: Die Qal-Form von שׁפך bezeichnet das Ausgießen oder Ausschütten. „Zorn ausschütten“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: זַעְמִי
  choice: meinen Zorn
  rationale: זַעַם bezeichnet entrüsteten, verurteilenden Zorn. „Zorn“ ist natürlich und gewichtig; die moralisch-juristische Färbung ergibt sich aus dem Gerichtskontext.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: im Feuer meines Grimms
  rationale: Die Wendung bewahrt sowohl das Feuerbild als auch die Heftigkeit von עֶבְרָה. „Grimm“ gehört zu einem würdevollen modernen Bibelregister, ohne die Aussage abzuschwächen.
- source_word: כִּלִּיתִים
  choice: verzehrte ich sie
  rationale: Das Piel von כלה kann „vollständig vernichten“ oder „verzehren“ bedeuten. „Verzehren“ verbindet die Aussage unmittelbar mit dem vorausgehenden Feuerbild.
- source_word: דַּרְכָּם
  choice: ihren Lebenswandel
  rationale: דֶּרֶךְ meint hier bildlich die Lebensführung. „Lebenswandel“ gibt diesen Sinn natürlich wieder, während der Singular des hebräischen Kollektivbegriffs erhalten bleibt.
- source_word: בְּרֹאשָׁם נָתַתִּי
  choice: ließ ich auf ihren eigenen Kopf zurückfallen
  rationale: 'Die Formulierung wahrt das hebräische Bild vom Kopf und macht zugleich den vergeltenden Sinn der Redewendung verständlich: Ihr eigenes Verhalten kehrt in seinen Folgen auf sie zurück.'
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. „Spricht“ ist die geläufige deutsche Entsprechung; אֲדֹנָי wird als „der Herr“ und der Gottesname יְהוִה als „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Sprache des göttlichen Gerichts
  choice: Die persönliche und starke Sprache von Gottes Zorn, Grimm und vergeltendem Gericht bleibt erhalten.
  alternative: Abschwächende Begriffe wie „Missfallen“ oder eine unpersönliche Beschreibung bloßer Folgen.
  rationale: Der hebräische Text schreibt das Gericht ausdrücklich Gott zu und verwendet intensive Zornesbegriffe. Eine Abschwächung würde die prophetische Aussage verändern.
- issue: Vergeltung nach dem eigenen Lebenswandel
  choice: Das Handeln Gottes und der Zusammenhang zwischen dem Verhalten der Menschen und dessen Folgen werden gemeinsam ausgedrückt.
  alternative: Die Aussage ausschließlich als natürliche Folge menschlichen Handelns oder ausschließlich als davon losgelöste Strafe wiederzugeben.
  rationale: בְּרֹאשָׁם נָתַתִּי verbindet Gottes aktives Vergelten mit dem eigenen „Weg“ der Betroffenen; diese Spannung soll erhalten bleiben.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom persönlichen Gottesnamen יְהוִה und vermeidet die unnatürliche Doppelung „Herr HERR“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftigen Gerichtsbilder werden bewahrt. „Lebenswandel“ erschließt den bildlichen Gebrauch von „Weg“, während die Fußnote die wörtliche hebräische Form nennt. „Grimm“ ist bewusst gehoben, aber allgemein verständlich.
