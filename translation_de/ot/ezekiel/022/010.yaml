  text: עֶרְוַת אָ֖ב גִּלָּה בָ֑/ךְ טְמֵאַ֥ת הַ/נִּדָּ֖ה עִנּוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
translation:
  language: de
  text: In dir entblößt man die Blöße des Vaters[a]; in dir schändet man eine Frau während ihrer menstruellen Unreinheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Blöße des Vaters“. Dies ist eine rechtssprachliche Wendung für unerlaubte sexuelle Beziehungen; vgl. 3. Mose 18,7.'
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „in der Unreinheit der Menstruation“. Gemeint ist der kultische Unreinheitszustand während der Menstruation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  choice: die Blöße des Vaters
  rationale: Die Konstruktion bedeutet wörtlich „die Blöße des Vaters“ und gehört zur feststehenden Rechtssprache für unerlaubte sexuelle Beziehungen. Die Formulierung bewahrt den Bezug zu 3. Mose 18,7, ohne die gemeinte Beziehung stärker festzulegen, als es der Vers selbst tut.
- source_word: גִּלָּה
  choice: man entblößt
  rationale: Die morphologisch singularische Form beschreibt hier innerhalb der Anklagerede ein kollektiv begangenes Verhalten. Das unpersönliche „man“ bildet dies im Deutschen natürlich ab; das Präsens wahrt die eindringliche Aufzählung.
- source_word: בָךְ
  choice: in dir
  rationale: Die Präposition mit femininem Singularsuffix richtet sich an die als Frau personifizierte Stadt Jerusalem. „In dir“ erhält diese direkte Anrede; sinngemäß ist „bei euch“ beziehungsweise „unter deinen Bewohnern“ gemeint.
- source_word: טְמֵאַת הַנִּדָּה
  choice: eine Frau während ihrer menstruellen Unreinheit
  rationale: Der hebräische Ausdruck bezeichnet den kultischen Unreinheitszustand der Menstruation und setzt eine Frau als betroffenes Gegenüber voraus. Die Wiedergabe macht diesen Referenten verständlich, ohne die kultische Bedeutung auf einen rein medizinischen Sachverhalt zu reduzieren.
- source_word: עִנּוּ
  choice: man vergewaltigt
  rationale: Die Pluralform von ענה trägt im sexuellen Kontext den Sinn gewaltsamer Erniedrigung beziehungsweise sexueller Verletzung. „Vergewaltigt“ bringt die Schwere und den naheliegenden Zwang klarer zum Ausdruck als das wörtliche, im Deutschen missverständliche „demütigt“.
theological_decisions:
- issue: Wiedergabe der levitischen Sexualrechtsformel
  choice: Die Wendung „die Blöße des Vaters entblößen“ bleibt im Haupttext erhalten.
  alternative: Explizit als Geschlechtsverkehr mit der Frau des Vaters oder als Inzest paraphrasieren.
  rationale: Die feste Formel verweist auf 3. Mose 18,7, doch eine konkrete Paraphrase könnte die hier nicht ausdrücklich benannte Beziehung zu eng bestimmen. Die idiomnahe Wiedergabe wahrt den intertextuellen Bezug und die Offenheit des Wortlauts.
- issue: Gewaltgehalt von עִנּוּ
  choice: „vergewaltigt“
  alternative: „demütigt“, „misshandelt“ oder „hat Geschlechtsverkehr mit“
  rationale: Im sexuellen Zusammenhang bezeichnet das Verb eine erniedrigende Verletzung und legt Zwang nahe. Die gewählte Übersetzung wahrt die moralische Schwere; eine neutrale Umschreibung würde sie abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „in dir“ bewahrt die direkte Anrede an das personifizierte Jerusalem. Die altertümlich wirkende, aber biblisch etablierte Wendung „die Blöße ... entblößen“ wird wegen ihres rechtssprachlichen und intertextuellen Gewichts beibehalten und durch eine Fußnote erklärt.
