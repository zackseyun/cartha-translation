base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/020.yaml
  text: As silver and bronze and iron and lead and tin are gathered into the midst of a furnace[a], to blow fire on it in order to melt it, so I will gather you in my anger and in my wrath[b], and I will place you there and melt you.
translation:
  language: de
  text: Wie Silber, Bronze[a], Eisen, Blei und Zinn in das Innere eines Schmelzofens zusammengebracht werden, um Feuer darauf zu blasen und sie zu schmelzen, so werde ich euch in meinem Zorn und meinem Grimm zusammenbringen, euch hineingeben[b] und euch schmelzen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kupfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „euch dort lassen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Im metallurgischen Zusammenhang auch: „euch einschmelzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְבֻצַת ... כֵּן אֶקְבֹּץ
  choice: Wie ... zusammengebracht werden, ... so werde ich ... zusammenbringen
  rationale: Die vergleichende Konstruktion wird im Deutschen natürlich mit „wie … so“ wiedergegeben; zugleich bleibt die Wiederholung der Wurzel קבץ durch „zusammenbringen“ erhalten.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: In biblischen Metallaufzählungen bezeichnet das Wort häufig Bronze; „Kupfer“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- source_word: אֶל תּוֹךְ כּוּר
  choice: im Innern eines Schmelzofens
  rationale: „Schmelzofen“ gibt die metallurgische Funktion von כּוּר wieder, während „im Innern“ den Ausdruck תּוֹךְ wahrt.
- source_word: לָפַחַת עָלָיו אֵשׁ
  choice: um Feuer darauf zu blasen
  rationale: Die Formulierung bildet das Anblasen des Feuers beim Schmelzvorgang anschaulich und nah am Hebräischen ab.
- source_word: לְהַנְתִּיךְ / וְהִתַּכְתִּי
  choice: zu schmelzen / euch schmelzen
  rationale: Die wiederholte Wortwurzel נתך wird durch die Wiederholung von „schmelzen“ sichtbar gemacht; der härtere Gerichtston bleibt erhalten.
- source_word: בְּאַפִּי וּבַחֲמָתִי
  choice: in meinem Zorn und meinem Grimm
  rationale: Die zwei Ausdrücke göttlichen Zorns werden unterscheidbar und in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: וְהִנַּחְתִּי
  choice: euch dort niederlegen
  rationale: Im Ablauf des Bildes bezeichnet das Hifil von נוח das Absetzen beziehungsweise Niederlegen im Ofen. Das im Deutschen notwendige Objekt und der Ort sind aus dem Kontext ergänzt; die mögliche Nuance „dort lassen“ wird vermerkt.
theological_decisions:
- issue: Bedeutung des Schmelzofenbildes
  choice: 'Das Bild wird als scharfes Gerichtshandeln wiedergegeben: Gott bringt die Angesprochenen zusammen und schmilzt sie.'
  alternative: Das Bild als „läutern“ oder „prüfen“ abschwächen.
  rationale: Der unmittelbare Zusammenhang beschreibt strafendes Gericht über Jerusalem. Der hebräische Text spricht vom Schmelzen und rechtfertigt keine stillschweigende Umdeutung in einen vorwiegend reinigenden Vorgang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metall- und Ofenmetaphorik bleibt konkret; die wiederholten hebräischen Wurzeln קבץ und נתך werden nach Möglichkeit auch im Deutschen wiederholt. Ergänzungen, die für einen vollständigen deutschen Satz nötig sind, bleiben eng am unmittelbaren Kontext.
