  to: Wie Silber, Bronze[a], Eisen, Blei und Zinn in das Innere eines Schmelzofens zusammengebracht werden, um Feuer darauf zu blasen und sie zu schmelzen, so werde ich euch in meinem Zorn und meinem Grimm zusammenbringen, euch hineingeben[b] und euch schmelzen[c].
