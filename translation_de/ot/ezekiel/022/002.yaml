  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/תִשְׁפֹּ֥ט הֲ/תִשְׁפֹּ֖ט אֶת עִ֣יר הַ/דָּמִ֑ים וְ/ה֣וֹדַעְתָּ֔/הּ אֵ֖ת כָּל תּוֹעֲבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/002.yaml
  text: And you[a], son of man, will you judge, will you judge the bloody city? Then make known to her all her abominations.
translation:
  language: de
  text: Und du, Menschensohn, willst du die Stadt des Blutvergießens richten, willst du sie richten? Und mache ihr alle ihre Abscheulichkeiten bekannt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die feste, im Hesekielbuch wiederkehrende hebräische Anrede und entspricht dem würdevollen biblischen Sprachgebrauch.
- source_word: הֲתִשְׁפֹּט הֲתִשְׁפֹּט
  choice: willst du richten, willst du ... richten?
  rationale: Die Wiederholung des Verbs und der rhetorische Fragecharakter werden erhalten; die Einfügung des Objekts in die zweite Frage ergibt natürliches Deutsch.
- source_word: עִיר הַדָּמִים
  choice: Stadt der Bluttaten
  rationale: Der hebräische Plural »Blut« bezeichnet hier gewaltsames Blutvergießen und möglicherweise zugleich Blutschuld. »Bluttaten« ist konkret, natürlich und lässt den Schuldton mitschwingen.
- source_word: וְהוֹדַעְתָּהּ
  choice: Dann halte ihr ... vor
  rationale: Der Hifil von ידע fordert dazu auf, die Stadt ihre Taten erkennen zu lassen. Im Gerichtskontext gibt »vorhalten« diese konfrontative Funktion idiomatisch wieder.
- source_word: כָּל תּוֹעֲבוֹתֶיהָ
  choice: alle ihre Gräueltaten
  rationale: »Alle« bewahrt die ausdrückliche Totalität; »Gräueltaten« vermittelt die starke moralisch-kultische Verurteilung von תּוֹעֵבָה in verständlichem modernem Deutsch.
theological_decisions:
- issue: Bedeutung von בֶן אָדָם als prophetische Anrede
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: Die traditionelle Form wahrt das wiederkehrende hebräische Idiom, ohne die Anrede auf eine bloße Aussage über Sterblichkeit zu verengen.
- issue: Semantischer Umfang von עִיר הַדָּמִים
  choice: Stadt der Bluttaten
  alternative: Stadt des Blutvergießens; mit Blutschuld beladene Stadt
  rationale: Die Formulierung hält Gewalt und Schuld zusammen, ohne eindeutig festzulegen, welcher Aspekt des mehrdeutigen hebräischen Plurals allein gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung der Gerichtsfrage bleibt erhalten. Das feminine Pronomen »ihr« nimmt die personifizierte Stadt auf; die Fußnote erläutert den starken prophetischen Begriff, ohne ihn konfessionell einzuengen.
