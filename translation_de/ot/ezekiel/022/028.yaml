source:
  edition: WLC
  text: וּ/נְבִיאֶ֗י/הָ טָח֤וּ לָ/הֶם֙ תָּפֵ֔ל חֹזִ֣ים שָׁ֔וְא וְ/קֹסְמִ֥ים לָ/הֶ֖ם כָּזָ֑ב אֹמְרִ֗ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וַֽ/יהוָ֖ה לֹ֥א דִבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/028.yaml
  text: And her prophets have plastered for them with whitewash[a], seeing falsehood and divining lies for them, saying[b], ‘Thus says the Lord GOD,’ when Yahweh has not spoken.
translation:
  language: de
  text: 'Und ihre Propheten haben ihnen Tünche aufgetragen[a], indem sie Trug schauen und ihnen Lügen wahrsagen. Sie sagen: »So spricht Jahwe, der Herr[b]«, obwohl Jahwe nicht gesprochen hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit unbeständigem Mörtel« beziehungsweise »mit brüchigem Putz«. Das hebräische Bild bezeichnet eine oberflächliche Beschichtung, die Mängel verdeckt, aber nicht festigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: Adonaj JHWH, wörtlich etwa »Herr JHWH«. Der Gottesname JHWH wird traditionell auch mit »der HERR« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְבִיאֶיהָ
  choice: Und ihre Propheten
  rationale: Der Plural im Konstruktus mit Suffix der 3. Person Femininum Singular bezieht sich auf die Propheten der zuvor angesprochenen Stadt.
- source_word: טָחוּ לָהֶם תָּפֵל
  choice: haben für sie mit Tünche übertüncht
  rationale: Die Formulierung bewahrt das Bild eines oberflächlichen Anstrichs, der Mängel verdeckt. Das im Hebräischen nicht ausdrücklich genannte Objekt wird auch im Deutschen nicht ergänzt.
- source_word: חֹזִים שָׁוְא
  choice: Sie schauen Trug
  rationale: „Schauen“ erhält den prophetischen Bezug des Partizips; „Trug“ gibt die Verbindung von Nichtigkeit und Täuschung in שָׁוְא knapp wieder.
- source_word: וְקֹסְמִים לָהֶם כָּזָב
  choice: und wahrsagen ihnen Lügen
  rationale: „Wahrsagen“ bezeichnet hier ausdrücklich mantische Tätigkeit und unterscheidet sie von wahrer prophetischer Rede.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: 'Die beiden unterschiedlichen hebräischen Bezeichnungen bleiben erkennbar: אֲדֹנָי als Titel „der Herr“ und יהוה als Gottes Eigenname „Jahwe“.'
- source_word: וַיהוָה לֹא דִבֵּר
  choice: obwohl Jahwe nicht gesprochen hat
  rationale: „Obwohl“ macht den im Satz liegenden Gegensatz natürlich verständlich; das Perfekt wahrt die Aussage, dass die beanspruchte Gottesrede nicht erfolgt ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht deutlich, dass im Ausgangstext der persönliche Gottesname steht. Eine Fußnote weist auf die traditionelle Ersatzlesung hin, ohne eine bestimmte konfessionelle Deutung festzulegen.
- issue: Bildsprache von תָּפֵל
  choice: Tünche
  alternative: unbeständiger Mörtel
  rationale: „Tünche“ vermittelt im Deutschen das Bild einer oberflächlichen, täuschenden Beschichtung. Da die genaue Materialbezeichnung umstritten ist, werden weitere mögliche Wiedergaben in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Bau- und Beschichtungsmetapher sowie die Unterscheidung zwischen prophetischem Schauen, Wahrsagerei und Gottesrede bleiben erhalten. Die ungewöhnliche Objektlosigkeit des hebräischen Bildes wird bewusst nicht durch eine konkretisierende Ergänzung geglättet.
