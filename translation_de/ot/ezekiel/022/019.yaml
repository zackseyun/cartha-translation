base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/019.yaml
  text: 'Therefore thus says the Lord GOD: Because all of you have become dross[a], therefore behold, I am gathering you into the midst of Jerusalem.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Weil ihr alle zu Schlacke[a] geworden seid, darum siehe, ich werde euch mitten in Jerusalem zusammenbringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Metallabfall beziehungsweise Verunreinigungen, die beim Schmelzen vom Metall abgeschieden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Wiedergabe bewahrt beide Bestandteile des hebräischen Gottesnamens und vermeidet das unnatürliche „Herr HERR“.
- source_word: יַעַן הֱיוֹת כֻּלְּכֶם
  choice: Weil ihr alle ... geworden seid
  rationale: „Weil“ gibt den kausalen Zusammenhang wieder; „geworden seid“ bezeichnet den eingetretenen Zustand, und „ihr alle“ wahrt die ausdrückliche Gesamtheit.
- source_word: לְסִגִים
  choice: zu Schlacke
  rationale: „Schlacke“ ist im Deutschen der natürliche metallurgische Ausdruck für wertlose Rückstände beziehungsweise ausgeschiedene Verunreinigungen und passt zum Schmelzbild des Kontextes.
- source_word: הִנְנִי קֹבֵץ
  choice: werde ich ... zusammenbringen
  rationale: Die Konstruktion kündigt nachdrücklich ein unmittelbar bevorstehendes oder gewisses Handeln an. Natürliches Deutsch gibt dies hier mit dem Futur wieder; die Betonung wird durch die wiederholte Folgerungsformel getragen.
- source_word: אֶל תּוֹךְ יְרוּשָׁלִָם
  choice: mitten in Jerusalem
  rationale: Dies bewahrt gegenüber dem bloßen „in Jerusalem“ die räumliche Aussage von תּוֹךְ und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: „Der Herr, Jahwe“ erhält sowohl den Titel Adonaj als auch den Eigennamen JHWH erkennbar, ohne beide zu einem einzigen Titel zu verschmelzen oder die unnatürliche Doppelung „Herr HERR“ zu erzeugen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Folgerung „Darum ... darum“ folgt der markanten Wiederholung von לָכֵן im Hebräischen. Das metallurgische Bild bleibt ausdrücklich erhalten.
