  text: וְ/כִנַּסְתִּ֣י אֶתְ/כֶ֔ם וְ/נָפַחְתִּ֥י עֲלֵי/כֶ֖ם בְּ/אֵ֣שׁ עֶבְרָתִ֑/י וְ/נִתַּכְתֶּ֖ם בְּ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/021.yaml
  text: I will gather you[a], and I will blow on you with the fire of my wrath, and you will be melted within it.
translation:
  language: de
  text: Ich werde euch versammeln und euch mit dem Feuer meines Zorns anblasen, und ihr werdet darin[a] geschmolzen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „in ihrer Mitte“ bedeuten. Das Pronomen kann sich im weiteren Zusammenhang auf die Stadt oder im Schmelzbild auf den Ofen beziehungsweise die Schmelzstätte beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: כִנַּסְתִּי
  choice: ich werde … versammeln
  rationale: Das Verb bezeichnet hier das Zusammenbringen der Menschen zum Gericht und führt zugleich das Bild vom Sammeln des Metalls zum Schmelzen fort. „Versammeln“ ist im modernen Deutschen klar und deutet den Vorgang nicht unnötig aus.
- source_word: נָפַחְתִּי עֲלֵיכֶם
  choice: gegen euch anfachen
  rationale: נפח bedeutet „blasen“ oder „hauchen“. Im Schmelzofenbild geht es um das Anblasen und Verstärken des Feuers. Die Wendung „das Feuer … gegen euch anfachen“ gibt dieses Bild in natürlichem Deutsch wieder, ohne den feindlichen Bezug von עַל abzuschwächen.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: das Feuer meines Zorns
  rationale: אֵשׁ bezeichnet das Feuer, עֶבְרָה heftigen, überströmenden Zorn. „Zorn“ ist würdig und allgemein verständlich; zusammen mit „anfachen“ wird der instrumentale Zusammenhang idiomatisch ausgedrückt.
- source_word: נִתַּכְתֶּם
  choice: ihr werdet geschmolzen werden
  rationale: Im Kontext der Metallverhüttung bezeichnet נתך das Schmelzen beziehungsweise Verflüssigen. Die Passivform bewahrt die Form und das Gerichtshandeln des hebräischen Textes.
- source_word: בְּתוֹכָהּ
  choice: darin
  rationale: Das feminine Singularsuffix kann im weiteren Zusammenhang auf die Stadt oder innerhalb des Schmelzbildes auf die Schmelzstätte beziehungsweise den Ofen weisen. „Darin“ lässt diesen Bezug bewusst offen.
theological_decisions:
- issue: Bezugswort des femininen Suffixes in בְּתוֹכָהּ
  choice: Die nicht näher bestimmte Wiedergabe „darin“
  alternative: „mitten in der Stadt“ oder „im Schmelzofen“
  rationale: Der Zusammenhang verschränkt Jerusalem mit dem Bild eines Schmelzofens. Eine ausdrückliche Festlegung würde die prophetische Bildspannung auflösen, die der Ausgangstext offenlässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Anfachen“ macht das Blasen am Schmelzfeuer verständlich, während „geschmolzen werden“ das harte Gerichtsbild und die metallurgische Metapher bewahrt.
