  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben: עיר als personifizierte Stadt, das Blutvergießen „in ihrer Mitte“, die unbestimmte „Zeit“ sowie die Verunreinigung. Die Wendung עָלֶיהָ wird jedoch in „die sich Götzenbilder macht“ nicht ausreichend erfasst; dies bedeutet im Deutschen vor allem „für sich selbst macht“, während das Hebräische die gegen die Stadt selbst gerichtete Wirkung ausdrückt.'
