  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עִ֣יר שֹׁפֶ֥כֶת דָּ֛ם בְּ/תוֹכָ֖/הּ לָ/ב֣וֹא עִתָּ֑/הּ וְ/עָשְׂתָ֧ה גִלּוּלִ֛ים עָלֶ֖י/הָ לְ/טָמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/003.yaml
  text: 'And say, ‘Thus says the Lord GOD: O city that sheds blood in her midst, so that her time may come, and that makes idols against herself to defile herself!’'
translation:
  language: de
  text: 'Und sag: »So spricht Gott, der HERR: Du Stadt, die in ihrer Mitte Blut vergießt, sodass ihre Zeit kommt, und die Götzenbilder gegen sich selbst macht, um sich zu verunreinigen!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִיר שֹׁפֶכֶת דָּם
  choice: Du Stadt, die … Blut vergießt
  rationale: Die artikellose Anrede wird im Deutschen mit »Du Stadt« klar und natürlich wiedergegeben; das Partizip שֹׁפֶכֶת bezeichnet die Stadt als fortgesetzt bzw. kennzeichnend blutvergießend.
- source_word: בְּתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Entspricht der räumlichen Aussage des Hebräischen und bewahrt die personifizierte feminine Stadt.
- source_word: לָבוֹא עִתָּהּ
  choice: sodass ihre Zeit kommt
  rationale: Die Konstruktion mit ל kann Zweck oder Folge ausdrücken. »Sodass« wahrt hier die mögliche Folgebedeutung, ohne die kommende Gerichtszeit näher auszudeuten.
- source_word: גִלּוּלִים
  choice: Götzenbilder
  rationale: Das abwertende hebräische Wort bezeichnet kultische Götzen; »Götzenbilder« ist verständlich und erhält die polemische Färbung.
- source_word: עָלֶיהָ … לְטָמְאָה
  choice: sich … macht, um sich zu verunreinigen
  rationale: Das reflexive Deutsch erfasst, dass das Handeln gegen die Stadt selbst gerichtet ist bzw. Verunreinigung über sie bringt; der finale Infinitiv wird mit »um … zu« wiedergegeben.
theological_decisions:
- issue: Bedeutung von »ihre Zeit«
  choice: Die unbestimmte Formulierung »ihre Zeit« bleibt stehen.
  alternative: »die Zeit ihres Gerichts«
  rationale: Der Kontext legt Gericht nahe, doch der Vers benennt es hier nicht ausdrücklich; die Übersetzung soll diese Deutung nicht in den Haupttext eintragen.
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: Herr JHWH / Herr, HERR
  rationale: Die traditionelle typografische Unterscheidung signalisiert den Gottesnamen, während die deutsche Wendung würdig und für heutige Leser verständlich bleibt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede »Du Stadt« erhält die prophetische Schärfe; der parallele Satzbau bildet die beiden Anklagepunkte klar ab.
