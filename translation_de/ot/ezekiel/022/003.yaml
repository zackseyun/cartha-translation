  terminology: „Blut vergießt“, „Götzenbilder“ und „verunreinigen“ sind passende moderne und zugleich bibelsprachlich tragfähige Wiedergaben. „Gott, der HERR“ ist die im Deutschen etablierte typografische Wiedergabe von אֲדֹנָי יְהוִה und macht die Namensformel deutlicher erkennbar.
