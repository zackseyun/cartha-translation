  text: כֹּהֲנֶ֜י/הָ חָמְס֣וּ תוֹרָתִ/י֮ וַ/יְחַלְּל֣וּ קָדָשַׁ/י֒ בֵּֽין קֹ֤דֶשׁ לְ/חֹל֙ לֹ֣א הִבְדִּ֔ילוּ וּ/בֵין הַ/טָּמֵ֥א לְ/טָה֖וֹר לֹ֣א הוֹדִ֑יעוּ וּ/מִ/שַׁבְּתוֹתַ/י֙ הֶעְלִ֣ימוּ עֵֽינֵי/הֶ֔ם וָ/אֵחַ֖ל בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/026.yaml
  text: Her priests have done violence to my law and have profaned my holy things[a]. They have not distinguished between the holy and the common, and they have not made known the difference between the unclean and the clean. They have hidden their eyes from my Sabbaths[b], and I have been profaned among them.
translation:
  language: de
  text: Ihre Priester haben meinem Gesetz Gewalt angetan und meine heiligen Dinge entweiht. Zwischen Heiligem und Gewöhnlichem haben sie nicht unterschieden, und den Unterschied zwischen Unreinem und Reinem haben sie nicht erkennen lassen. Vor meinen Sabbaten haben sie ihre Augen verschlossen, und ich wurde in ihrer Mitte entweiht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָמְסוּ
  choice: tun … Gewalt an
  rationale: 'Die Formulierung bewahrt die starke Metaphorik des hebräischen Verbs: Die Priester übertreten das Gesetz nicht nur, sondern behandeln es gewaltsam und in empörender Weise.'
- source_word: תוֹרָתִי
  choice: meinem Gesetz
  rationale: Im Kontext der priesterlichen Verantwortung bezeichnet תּוֹרָה Gottes verbindliche Weisung; „Gesetz“ ist hier knapp, geläufig und sachgerecht.
- source_word: וַיְחַלְּלוּ
  choice: entweihen
  rationale: Das Piel von חלל bezeichnet das Preisgeben des heiligen Status. „Entweihen“ gibt dies im Deutschen natürlich wieder.
- source_word: קָדָשַׁי
  choice: meine heiligen Dinge
  rationale: Der Plural bleibt bewusst weit und kann heilige Gaben, Orte und andere dem heiligen Bereich zugehörige Dinge umfassen.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: zwischen heilig und gewöhnlich
  rationale: חֹל meint hier das Nichtheilige beziehungsweise Alltägliche, nicht notwendig etwas Ehrfurchtsloses oder moralisch Böses. „Gewöhnlich“ wahrt diese kultische Unterscheidung.
- source_word: הִבְדִּילוּ
  choice: unterscheiden
  rationale: Das Verb bezeichnet hier die priesterliche Aufgabe, Kategorien des Heiligen voneinander abzugrenzen und richtig einzuordnen.
- source_word: וּבֵין הַטָּמֵא לְטָהוֹר
  choice: zwischen unrein und rein
  rationale: „Unrein“ und „rein“ sind die etablierten deutschen Begriffe für die kultischen Reinheitskategorien.
- source_word: הוֹדִיעוּ
  choice: machen … nicht bekannt
  rationale: Die Wiedergabe bleibt nahe an der Grundbedeutung „bekannt machen“, ohne die im Kontext mögliche Lehrfunktion ausdrücklich festzulegen.
- source_word: הֶעְלִימוּ עֵינֵיהֶם
  choice: verschließen sie die Augen
  rationale: Diese natürliche deutsche Redewendung bewahrt das Bild und bringt die absichtliche Missachtung zum Ausdruck.
- source_word: וָאֵחַל
  choice: werde ich … entweiht
  rationale: 'Die Form wird kontextgemäß passiv verstanden: Durch das Versagen der Priester wird Gottes Heiligkeit innerhalb der Gemeinschaft missachtet.'
- source_word: בְּתוֹכָם
  choice: mitten unter ihnen
  rationale: Die Wendung bewahrt den räumlich-gemeinschaftlichen Nachdruck des Hebräischen.
theological_decisions:
- issue: Bedeutung von חֹל innerhalb der Heiligkeitskategorien
  choice: gewöhnlich
  alternative: profan
  rationale: Der Gegensatz betrifft den heiligen und den nicht ausgesonderten Bereich. „Gewöhnlich“ vermeidet die mögliche Fehlvorstellung, alles Nichtheilige sei aktiv gottlos oder verwerflich.
- issue: Diathese und Sinn von וָאֵחַל
  choice: 'passiv: „werde ich mitten unter ihnen entweiht“'
  alternative: 'reflexiv: „ich entweihte mich mitten unter ihnen“'
  rationale: Im unmittelbaren Kontext ist Gottes Entweihung die Folge des priesterlichen Fehlverhaltens. Die passive Wiedergabe wahrt diesen Zusammenhang, ohne eine spekulative aktive oder reflexive Deutung einzutragen.
- issue: Funktion von הוֹדִיעוּ
  choice: „machen … nicht bekannt“
  alternative: „lehren … nicht“
  rationale: Priester hatten zwar eine Lehrverantwortung, doch das Verb selbst bedeutet zunächst „bekannt machen“. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der priesterlichen Anklage bleibt erkennbar; kultische Fachbegriffe werden verständlich, aber nicht moralisierend wiedergegeben. Das abschließende „und so“ macht den Folgezusammenhang natürlich sichtbar, ohne die passive Deutung von וָאֵחַל zu verändern.
