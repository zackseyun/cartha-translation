  text: וַ/הֲפִיצוֹתִ֤י אוֹתָ/ךְ֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֖י/ךְ בָּ/אֲרָצ֑וֹת וַ/הֲתִמֹּתִ֥י טֻמְאָתֵ֖/ךְ מִמֵּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/015.yaml
  text: I will scatter you among the nations and disperse you through the lands[a], and I will purge your uncleanness from you.
translation:
  language: de
  text: Ich werde dich unter die Völker zerstreuen und dich in die Länder zerstreuen; und ich werde deine Unreinheit aus dir entfernen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde deiner Unreinheit in dir ein Ende machen.“'
    reason: Lexikalische Alternative für וַהֲתִמֹּתִי טֻמְאָתֵךְ מִמֵּךְ; die Wendung kann sowohl das Entfernen als auch das vollständige Beenden der Unreinheit ausdrücken.
lexical_decisions:
- source_word: וַהֲפִיצוֹתִי
  choice: Ich werde … zerstreuen
  rationale: Die Hifil-Form bezeichnet hier im Gerichtszusammenhang das Zerstreuen der personifiziert angeredeten Stadt beziehungsweise ihrer Bevölkerung.
- source_word: בַּגּוֹיִם
  choice: unter die Nationen
  rationale: גּוֹיִם meint die fremden Nationen, unter die Jerusalem ins Exil zerstreut wird; „Nationen“ ist sachlich und wenig interpretierend.
- source_word: וְזֵרִיתִיךְ
  choice: und dich … verteilen
  rationale: זרה kann „worfeln“ oder „zerstreuen“ bedeuten. „Verteilen“ gibt hier die parallele Bewegung wieder, ohne das vorausgehende Verb unnötig zu wiederholen.
- source_word: בָּאֲרָצוֹת
  choice: über die Länder hin
  rationale: Der Plural bezeichnet verschiedene Länder; die Formulierung vermittelt die weiträumige Zerstreuung.
- source_word: וַהֲתִמֹּתִי
  choice: und ich werde … entfernen
  rationale: Die kausative Form von תמם bezeichnet das vollständige Beenden oder Beseitigen. Zusammen mit טֻמְאָה drückt „entfernen“ das Ergebnis aus, ohne die Art der Reinigung enger festzulegen.
- source_word: טֻמְאָתֵךְ
  choice: deine Unreinheit
  rationale: „Unreinheit“ bewahrt die mögliche kultische und moralische Bedeutungsbreite des hebräischen Begriffs.
- source_word: מִמֵּךְ
  choice: aus dir
  rationale: Die Präposition bezeichnet die Entfernung aus der angeredeten Stadt beziehungsweise Gemeinschaft; „aus dir“ bildet die räumliche Metapher unmittelbar ab.
theological_decisions:
- issue: Wesen der durch das Gericht bewirkten Reinigung
  choice: Gottes Gericht entfernt Jerusalems Unreinheit, ohne festzulegen, ob diese primär moralisch, kultisch oder metaphorisch verstanden ist.
  alternative: „Ich werde deiner Unreinheit in dir ein Ende machen“ beziehungsweise „Ich werde deine Unreinheit von dir wegnehmen“.
  rationale: Der hebräische Satz verbindet Zerstreuungsgericht und Beseitigung der Unreinheit. Die Übersetzung erhält die Spannung zwischen Strafe und Reinigung, ohne eine engere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Singularanrede des Hebräischen wird im Deutschen als „dich/deine“ wiedergegeben und bezieht sich auf die personifiziert angeredete Stadt Jerusalem. Das Semikolon macht den Übergang von der Zerstreuung zur Beseitigung der Unreinheit sichtbar.
