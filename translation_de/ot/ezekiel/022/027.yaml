  text: שָׂרֶ֣י/הָ בְ/קִרְבָּ֔/הּ כִּ/זְאֵבִ֖ים טֹ֣רְפֵי טָ֑רֶף לִ/שְׁפָּךְ דָּם֙ לְ/אַבֵּ֣ד נְפָשׁ֔וֹת לְמַ֖עַן בְּצֹ֥עַ בָּֽצַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/027.yaml
  text: Her princes within her are like wolves tearing prey[a], to shed blood, to destroy lives[b], in order to gain dishonest profit.
translation:
  language: de
  text: Ihre Fürsten in ihrer Mitte sind wie Wölfe, die Beute zerreißen, um Blut zu vergießen, Menschenleben zu vernichten und sich unrechtmäßigen Gewinn zu verschaffen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Menschen vernichten“ oder „Seelen vernichten“. Das hebräische Wort kann je nach Zusammenhang Menschen, Leben oder Seelen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „sich durch Erpressung zu bereichern“. Die hebräische Wendung bezeichnet habgierigen und unrechtmäßigen Erwerb.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: ihre Fürsten
  rationale: שַׂר bezeichnet einen Fürsten, Herrscher oder hohen Amtsträger. „Fürsten“ bewahrt hier den politischen und gehobenen Sinn.
- source_word: בְקִרְבָּהּ
  choice: in ihrer Mitte
  rationale: Die Wendung bezeichnet das Innere der als weiblich vorgestellten Stadt beziehungsweise Gemeinschaft und wird im Deutschen idiomatisch und bildgetreu wiedergegeben.
- source_word: כִּזְאֵבִים טֹרְפֵי טָרֶף
  choice: wie Wölfe, die Beute zerreißen
  rationale: Die Vergleichspartikel und das Bild raubgieriger Wölfe bleiben erhalten; „zerreißen“ gibt die Gewaltsamkeit des Partizips mit seinem stammverwandten Objekt anschaulich wieder.
- source_word: לִשְׁפָּךְ דָּם
  choice: Sie vergießen Blut
  rationale: „Blut vergießen“ ist die etablierte deutsche Entsprechung für das hebräische Idiom gewaltsamen Tötens. Ein neuer Hauptsatz vermeidet eine schwerfällige Reihung von Infinitiven, ohne den Sachzusammenhang aufzulösen.
- source_word: לְאַבֵּד נְפָשׁוֹת
  choice: vernichten Menschenleben
  rationale: נֶפֶשׁ bezeichnet im Kontext konkreter Gewalt Menschen beziehungsweise deren Leben, nicht eindeutig eine vom Körper getrennte Seele. „Menschenleben“ macht den Bezug klar und bewahrt zugleich den Lebensbegriff.
- source_word: לְמַעַן בְּצֹעַ בָּצַע
  choice: um sich unrechtmäßigen Gewinn zu verschaffen
  rationale: לְמַעַן kennzeichnet den Zweck beziehungsweise Beweggrund. Die stammverwandte Verbindung aus Verb und Substantiv betont habgierigen, moralisch verwerflichen Erwerb; die deutsche Formulierung ist natürlich und präzise.
theological_decisions:
- issue: Bedeutung von נְפָשׁוֹת im Zusammenhang gesellschaftlicher Gewalt
  choice: „Menschenleben“ als Bezeichnung der getöteten Personen beziehungsweise ihres Lebens
  alternative: „Seelen“ oder „Menschen“
  rationale: Der Zusammenhang handelt von Blutvergießen durch politische Machthaber. Die Wiedergabe macht daher keine weitergehende anthropologische Aussage über eine immaterielle Seele, lässt die lexikalischen Alternativen aber in der Fußnote erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das politische Bild der „Fürsten“ und die drastische Wolf-Metapher bleiben erhalten. Die beiden hebräischen Infinitivkonstruktionen werden als koordinierte Aussagen wiedergegeben; der ausdrücklich mit לְמַעַן markierte Gewinnzweck bleibt durch „um … zu“ klar erkennbar.
