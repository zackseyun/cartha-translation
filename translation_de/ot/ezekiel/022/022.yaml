base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/022.yaml
  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
translation:
  language: de
  text: Wie Silber mitten im Schmelzofen geschmolzen wird, so werdet ihr mitten in ihr[a] geschmolzen werden, und ihr werdet erkennen, dass ich, Jahwe, meinen Zorn über euch ausgegossen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Stadt Jerusalem.
    reason: Klärung des im Hebräischen impliziten Bezugs des femininen Pronomens.
lexical_decisions:
- source_word: כְּהִתּוּךְ כֶּסֶף
  choice: Wie Silber ... geschmolzen wird
  rationale: Die mit כְּ eingeleitete nominale Wendung bezeichnet den Vergleich („wie beim Schmelzen von Silber“). Die verbale deutsche Fassung gibt den passiven Vorgang natürlich wieder.
- source_word: בְּתוֹךְ כּוּר
  choice: mitten im Schmelzofen
  rationale: כּוּר ist ein Ofen zum Schmelzen von Metall. „Schmelzofen“ hält das metallurgische Bild fest; „mitten in“ spiegelt die wiederholte Wendung בְּתוֹךְ.
- source_word: כֵּן תֻּתְּכוּ
  choice: so werdet ihr ... geschmolzen werden
  rationale: כֵּן bildet die Entsprechung zum einleitenden Vergleich; die passive Verbform wird im Futur wiedergegeben und bewahrt das Gerichtsbild.
- source_word: בְתוֹכָהּ
  choice: mitten in ihr
  rationale: Das feminine Singularsuffix verweist im unmittelbaren Zusammenhang auf die Stadt Jerusalem. Das Pronomen bleibt wie im Hebräischen stehen; eine Fußnote klärt den Bezug.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Die in Ezechiel häufige Erkenntnisformel bezeichnet mehr als bloßes Wissen. „Dann“ macht die Folgerung aus dem vorangehenden Gericht im Deutschen natürlich sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שָׁפַכְתִּי חֲמָתִי עֲלֵיכֶם
  choice: meinen Zorn über euch ausgegossen habe
  rationale: Die konkrete Metapher des Ausgießens bleibt erhalten. Das Perfekt bezeichnet die dann als vollzogen erkannte Gerichtshandlung; חֵמָה wird würdig und verständlich mit „Zorn“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Charakter als persönlicher Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des femininen Pronomens in בְתוֹכָהּ
  choice: Das Pronomen bleibt im Haupttext erhalten und wird auf Jerusalem bezogen
  alternative: mitten in Jerusalem
  rationale: Der unmittelbare Kontext legt die Stadt Jerusalem als Bezugswort nahe. Da der hebräische Vers selbst nur „in ihr“ sagt, wird der Name nicht erläuternd in den Haupttext eingesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das wiederholte „mitten“ und das Bild des Schmelzens wurden bewusst bewahrt. „Schmelzofen“ ist präziser und im Deutschen natürlicher als das allgemeinere „Ofen“.
