  text: וְ/נִחַ֥לְתְּ בָּ֖/ךְ לְ/עֵינֵ֣י גוֹיִ֑ם וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/016.yaml
  text: And you will be profaned through yourself before the eyes of the nations[a], and you will know that I am Yahweh.
translation:
  language: de
  text: Und du wirst vor den Augen der Nationen durch dich selbst entweiht werden[a], und du wirst erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du wirst in dir selbst“ oder „an dir selbst entweiht werden“. Das hebräische Verb kann hier Nuancen von Entweihung, Verunreinigung oder öffentlicher Entehrung tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִחַלְתְּ
  choice: und du wirst dich entweihen
  rationale: Die Nifal-Form von חלל bezeichnet hier am ehesten ein Entweihtwerden beziehungsweise eine auf das Subjekt zurückwirkende Entweihung. Die reflexive deutsche Fassung verbindet den passiv-reflexiven Sinn natürlich mit בָּךְ und bewahrt zugleich den Heiligkeitsbezug des Verbs.
- source_word: בָּךְ
  choice: selbst
  rationale: Das knappe ב mit Suffix bezieht die Entweihung auf Jerusalem selbst. Im Deutschen gibt „dich … selbst entweihen“ dies natürlicher wieder als das missverständliche „in dir“, ohne eine fremde Ursache einzuführen.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die bildhafte hebräische Wendung wird formal und zugleich idiomatisch bewahrt; sie betont die öffentliche Sichtbarkeit.
- source_word: גוֹיִם
  choice: der Nationen
  rationale: Im prophetischen Zusammenhang sind die fremden Nationen als Kollektiv gemeint. „Nationen“ ist hier präziser als das neutestamentlich gefärbte „Heiden“.
- source_word: וְיָדַעַתְּ
  choice: und du wirst erkennen
  rationale: Das Verb hat im prophetischen Gerichtswort futurische beziehungsweise resultative Bedeutung. „Erkennen“ gibt das mehr als bloß sachliche Wissen umfassende יָדַע angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von חלל in diesem Vers
  choice: Entweihung Jerusalems vor den Nationen infolge ihres eigenen Zustands und Handelns
  alternative: Verlust des Erbbesitzes oder bloße öffentliche Entehrung
  rationale: Der unmittelbare Kontext von Unreinheit, Schuld und Gericht sowie Hesekiels Heiligkeitswortschatz sprechen für „entweihen“. Die Formulierung lässt offen, wie genau Jerusalems eigene Beteiligung und das göttliche Gericht kausal zueinander stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht entsprechend dem Hebräischen im femininen Singular und richtet sich im Kontext an Jerusalem. „Vor den Augen“ bewahrt das prophetische Bild; „Jahwe“ gibt den Gottesnamen wieder.
