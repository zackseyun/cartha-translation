  text: שֹׁ֥חַד לָֽקְחוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם נֶ֧שֶׁךְ וְ/תַרְבִּ֣ית לָקַ֗חַתְּ וַ/תְּבַצְּעִ֤י רֵעַ֨יִ/ךְ֙ בַּ/עֹ֔שֶׁק וְ/אֹתִ֣/י שָׁכַ֔חַתְּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/012.yaml
  text: In you they have taken bribes to shed blood; you have taken interest and profit[a], and you have extorted your neighbors by oppression, and you have forgotten me, declares the Lord GOD.
translation:
  language: de
  text: In dir hat man Bestechungsgeld angenommen, um Blut zu vergießen. Zinsen und Gewinn[a] hast du genommen, und durch Unterdrückung hast du dich an deinen Mitmenschen bereichert. Mich hast du vergessen – Ausspruch des Herrn Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zins und Mehrung“. Das Hebräische verwendet zwei verwandte Begriffe für Ertrag aus einem Darlehen: נֶשֶׁךְ („Zins“) und תַרְבִּית („Gewinn, Mehrung“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: Bestechungsgeld
  rationale: Das Substantiv bezeichnet eine Bestechungsgabe. Der deutsche Kollektivbegriff passt zu den wiederholten korrupten Handlungen innerhalb Jerusalems.
- source_word: לָקְחוּ בָךְ
  choice: In dir hat man … angenommen
  rationale: Die 3. Person Plural mit בָךְ richtet sich an die personifizierte Stadt Jerusalem. Das unpersönliche „man“ gibt die kollektive Anklage im natürlichen Deutschen wieder und bewahrt „in dir“ als Ortsangabe.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: um Blut zu vergießen
  rationale: Die Konstruktion bezeichnet Zweck oder Ziel. Die feste Wendung „Blut vergießen“ bewahrt den Ernst der Anklage, ohne die konkrete Form der Gewalt enger festzulegen.
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: Zins und Aufschlag
  rationale: Die beiden verwandten Begriffe bezeichnen Ertrag beziehungsweise Mehrung aus Darlehen. „Zins und Aufschlag“ wahrt die Zweigliedrigkeit und ist im heutigen Deutsch verständlicher als das missverständliche „Wucher“, das meist nur überhöhte Zinsen bezeichnet.
- source_word: וַתְּבַצְּעִי רֵעַיִךְ בָּעֹשֶׁק
  choice: durch Unterdrückung hast du dich an deinen Mitmenschen bereichert
  rationale: בצע bezeichnet hier habgierigen, unrechtmäßigen Gewinn; עשק nennt das Mittel als Unterdrückung, Ausbeutung oder Erpressung. Die Formulierung ist idiomatisch und lässt die genaue Art des Unrechts offen.
- source_word: וְאֹתִי שָׁכַחַתְּ
  choice: Mich aber hast du vergessen
  rationale: Die Voranstellung von „Mich“ bildet den hebräischen Nachdruck ab; „aber“ macht den klimaktischen Gegensatz im Deutschen hörbar, ohne eine zusätzliche Deutung einzuführen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: נְאֻם ist eine prophetische Bekräftigungsformel. „Ausspruch“ erhält den nominalen Charakter; „Herr Yahweh“ unterscheidet אֲדֹנָי vom ausdrücklich gebrauchten Gottesnamen יהוה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Der Ausgangstext enthält neben אֲדֹנָי ausdrücklich den Gottesnamen יהוה. „Herr Yahweh“ bildet beide Bestandteile transparent ab und vermeidet, sie in zwei Varianten desselben deutschen Titels aufzulösen.
- issue: Reichweite der wirtschaftlichen Anklage
  choice: Zins und Aufschlag
  alternative: Wucher und Mehrung
  rationale: Die Übersetzung benennt beide hebräischen Darlehensbegriffe, legt jedoch nicht stillschweigend fest, dass nur ein nach modernen Maßstäben überhöhter Zinssatz gemeint sei. Der verurteilende Kontext bleibt durch die gesamte Anklage deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede der personifizierten Stadt wird durchgehend im Singular Femininum sinngemäß als „du“ bewahrt. Kurze Anklagesätze erhalten den prophetischen Nachdruck; seltene oder konfessionell stark geprägte Begriffe werden vermieden.
