  rationale: Die Revision ersetzt die im Deutschen unidiomatische wörtliche Handformulierung durch die geläufige Geste des Händezusammenschlagens. Sie gibt den zweiten Anklagepunkt als vollzogenes Blutvergießen wieder und bewahrt die mögliche Bedeutung „Blutschuld“ in der Fußnote. Der unrechtmäßige Gewinn und die direkte Anrede bleiben erhalten.
