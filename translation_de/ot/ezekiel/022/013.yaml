  verdict: revise
  source_fidelity: Der Entwurf gibt die Anrede an die Stadt, den prophetischen Aufmerksamkeitsruf, den ungerechten Gewinn und die Gewalttaten im Wesentlichen wieder. „Blutschuld, die in deiner Mitte ist“ glättet jedoch das pluralische hebräische Verb und die vollzogenen Akte des Blutvergießens zu stark. Die Wendung „meine Hand gegen … schlagen“ ist im Deutschen zudem keine überzeugende Wiedergabe der bildhaften Handgeste.
  naturalness: „Und sieh“ ist verständlich, aber „Sieh“ ist als prophetischer Aufmerksamkeitsruf flüssiger. „Ich schlage meine Hand gegen“ wirkt im modernen Standarddeutsch unidiomatisch. „Ich schlage die Hände zusammen über“ vermittelt die konventionelle Geste der Entrüstung, ohne deren genaue Deutung weiter festzulegen.
  terminology: „Unrechtmäßiger Gewinn“ ist treffend. Im Haupttext ist „Blutvergießen“ vorzuziehen, weil es die im Hebräischen angesprochenen Bluttaten und das pluralische Prädikat besser abbildet; „Blutschuld“ bleibt als legitime Deutungsalternative in der Anmerkung erhalten.
