    rationale: „Ich schlage meine Hand gegen deinen … Gewinn“ ist im Deutschen nicht idiomatisch und lässt fälschlich an ein tatsächliches Schlagen des Gewinns denken. Die hebräische Formulierung bezeichnet eine Geste der Entrüstung bzw. des Gerichts.
  - severity: medium
    issue: „Blutschuld“ nivelliert den hebräischen Plural und das vollzogene Geschehen
    rationale: דָּמַיִךְ/דָּמֵךְ mit pluralischem הָיוּ verweist hier auf Blutvergießen bzw. Bluttaten, die sich innerhalb der Stadt ereignet haben. „Die Blutschuld, die ... ist“ verliert diesen Aspekt.
