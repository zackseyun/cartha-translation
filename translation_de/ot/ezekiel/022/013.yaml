  text: וְ/הִנֵּה֙ הִכֵּ֣יתִי כַפִּ֔/י אֶל בִּצְעֵ֖/ךְ אֲשֶׁ֣ר עָשִׂ֑ית וְ/עַ֨ל דָּמֵ֔/ךְ אֲשֶׁ֥ר הָי֖וּ בְּ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/013.yaml
  text: And behold[a], I strike my hand against your unjust gain that you have made[b], and against the bloodshed that has been in your midst.
translation:
  language: de
  text: 'Sieh: Ich schlage die Hände zusammen über deinen unrechtmäßigen Gewinn, den du gemacht hast,[a] und über das Blutvergießen, das in deiner Mitte geschehen ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen unehrlichen Gewinn“ oder „deine Habgier“. Das hebräische Wort kann Gewinn bezeichnen, der durch Unrecht oder Gewalt erlangt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Blutschuld“. Die hebräische Pluralform „Blute“ kann kollektiv Akte des Blutvergießens und die damit verbundene Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt den prophetischen Aufmerksamkeitsruf in natürlichem, modernem Deutsch.
- source_word: הִכֵּיתִי
  choice: Ich schlage
  rationale: Das hebräische Perfekt wird als anschauliche, unmittelbar erklärte Gerichtshandlung wiedergegeben.
- source_word: כַּפִּי
  choice: meine Hand
  rationale: כף kann Handfläche oder Hand bezeichnen; „Hand“ ist im Deutschen natürlicher und erhält das körperhafte Bild.
- source_word: אֶל
  choice: gegen
  rationale: Gibt im Zusammenhang der Gerichtsdrohung die feindlich-gerichtliche Ausrichtung wieder.
- source_word: בִּצְעֵךְ
  choice: deinen unrechtmäßigen Gewinn
  rationale: Bezeichnet hier nicht neutralen Profit, sondern Gewinn aus Unrecht oder Gewalttat.
- source_word: אֲשֶׁר עָשִׂית
  choice: den du gemacht hast
  rationale: Bleibt beim gewöhnlichen Sinn von עשה und ist zusammen mit „Gewinn“ im Deutschen verständlich.
- source_word: דָּמֵךְ
  choice: die Blutschuld
  rationale: Der hebräische Ausdruck „deine Blut(taten)“ kann sowohl vergossenes Blut als auch die daraus erwachsende Schuld bezeichnen; „Blutschuld“ wahrt den Anklagecharakter.
- source_word: אֲשֶׁר הָיוּ בְּתוֹכֵךְ
  choice: die in deiner Mitte ist
  rationale: Die Stadt wird feminin singular angeredet; der deutsche Singular folgt dem kollektiv aufgefassten Hauptwort „Blutschuld“, während das hebräische Verb pluralisch zu „Blut(taten)“ steht.
theological_decisions:
- issue: Art der göttlichen Handbewegung im Gericht
  choice: Ich schlage meine Hand gegen
  alternative: Ich schlage in die Hände über / Ich habe meine Hand geschlagen gegen
  rationale: Die konkrete anthropomorphe Geste göttlicher Entrüstung und des Gerichts bleibt erhalten, ohne sie als Beifall oder als rein abstrakte Aussage festzulegen.
- issue: Blutvergießen oder Blutschuld
  choice: Blutschuld im Haupttext, mit Alternative in der Fußnote
  alternative: Blutvergießen / Blut(taten)
  rationale: Der Kontext ist eine gerichtliche Anklage gegen Jerusalem. Zugleich lässt der hebräische Ausdruck sowohl die Taten des Blutvergießens als auch die daran haftende Schuld zu; die Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhobenem prophetischem Ton. „Und sieh“ erhält den Diskursmarker, ohne das altertümlichere „siehe“ zu verwenden. Die konkrete Handgeste und die direkte feminine Anrede Jerusalems bleiben erhalten.
