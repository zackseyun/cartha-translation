source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה גֵּ֤ה גְבוּל֙ אֲשֶׁ֣ר תִּתְנַחֲל֣וּ אֶת הָ/אָ֔רֶץ לִ/שְׁנֵ֥י עָשָׂ֖ר שִׁבְטֵ֣י יִשְׂרָאֵ֑ל יוֹסֵ֖ף חֲבָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/013.yaml
  text: 'Thus says the Lord GOD: This is the boundary by which you shall apportion the land as an inheritance among the twelve tribes of Israel[a]; Joseph shall have two portions.'
translation:
  language: de
  text: 'So spricht der Herr, Jahwe: Dies ist die Grenze, nach der ihr das Land als Erbbesitz unter den zwölf Stämmen Israels verteilen sollt: Josef erhält zwei Anteile.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Verbindung bewahrt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה. Das Komma ergibt im Deutschen eine natürliche und würdige Formulierung.
- source_word: גֵּה גְבוּל
  choice: Dies ist die Grenze
  rationale: Die Wendung führt die nachfolgende Grenzbeschreibung ein; „Grenze“ ist im Zusammenhang der Landzuteilung präzise und idiomatisch.
- source_word: תִּתְנַחֲלוּ אֶת־הָאָרֶץ
  choice: ihr das Land als Erbbesitz … verteilen sollt
  rationale: Der Hitpael von נחל bezeichnet hier die Zuteilung beziehungsweise Besitznahme erblicher Landanteile. Die Formulierung verbindet den Erbcharakter mit dem im Kontext erforderlichen Verteilungssinn.
- source_word: לִשְׁנֵי עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: unter den zwölf Stämmen Israels
  rationale: „Unter“ gibt die Verteilung des Landes auf die Stämme in natürlichem Deutsch wieder.
- source_word: יוֹסֵף חֲבָלִים
  choice: Josef erhält zwei Anteile
  rationale: חֲבָלִים bezeichnet vermessene Landstücke beziehungsweise Anteile. Der knappe hebräische Nominalsatz setzt im Kontext eine Mehrzahl von Anteilen für Josef voraus; „zwei“ verdeutlicht die doppelte territoriale Zuteilung über seine beiden Stämme.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: „Jahwe“ gibt den im Ausgangstext ausdrücklich stehenden Gottesnamen wieder, während „Herr“ den vorangestellten Titel bewahrt. So werden beide Bestandteile unterschieden, ohne die Verbindung zu glätten.
- issue: Doppelter Anteil Josefs
  choice: Josef erhält zwei Anteile
  alternative: Josef erhält Anteile
  rationale: Die Aussage betrifft die territoriale Doppelzuteilung an Josef, die durch Ephraim und Manasse repräsentiert wird. Die Übersetzung macht den im knappen hebräischen Ausdruck vorausgesetzten Sinn verständlich, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt nah am hebräischen Ankündigungsstil, während „als Erbbesitz … verteilen“ den sachlichen Sinn der Landzuteilung verständlich ausdrückt.
