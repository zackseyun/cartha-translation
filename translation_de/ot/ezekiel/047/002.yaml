language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יּוֹצִאֵ/נִי֮ דֶּֽרֶךְ שַׁ֣עַר צָפוֹנָ/ה֒ וַ/יְסִבֵּ֨/נִי֙ דֶּ֣רֶךְ ח֔וּץ אֶל שַׁ֣עַר הַ/ח֔וּץ דֶּ֖רֶךְ הַ/פּוֹנֶ֣ה קָדִ֑ים וְ/הִנֵּה מַ֣יִם מְפַכִּ֔ים מִן הַ/כָּתֵ֖ף הַ/יְמָנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/002.yaml
  text: Then he brought me out by way of the north gate[a], and led me around by the outside way to the outer gate, the one facing east; and behold[b], water was trickling from the right side.
translation:
  language: de
  text: Dann führte er mich durch das Nordtor hinaus und außen herum zum äußeren Tor, das nach Osten gerichtet war. Und siehe, Wasser sickerte hervor[a], von der rechten Seite[b] her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sprudelte hervor« oder »floss hervor«; das hebräische Verb bezeichnet hier einen kleinen, hervortretenden Wasserfluss, noch keinen großen Strom.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von der rechten Schulter«; mit »Schulter« ist hier die Seite oder Flanke des Bauwerks gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: führte er mich … hinaus
  rationale: Der Hifil von יצא bezeichnet das Hinausführen bzw. Herausbringen. „Führte … hinaus“ passt zum geführten Rundgang und klingt im Deutschen natürlich.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹנָה
  choice: durch das Nordtor
  rationale: דֶּרֶךְ bezeichnet hier den genommenen Weg; צָפוֹנָה gibt die nördliche Richtung an. „Durch das Nordtor“ gibt die räumliche Bewegung knapp und idiomatisch wieder.
- source_word: וַיְסִבֵּנִי דֶּרֶךְ חוּץ
  choice: führte er mich … außen herum
  rationale: Der Hifil von סבב drückt ein Herumführen aus, während חוּץ den Weg außerhalb der Anlage bezeichnet. „Außen herum“ bewahrt beide räumlichen Aspekte.
- source_word: אֶל שַׁעַר הַחוּץ
  choice: zum äußeren Tor
  rationale: Im Zusammenhang der Tempelanlage bezeichnet die Wendung das außen gelegene beziehungsweise äußere Tor.
- source_word: דֶּרֶךְ הַפּוֹנֶה קָדִים
  choice: das nach Osten gerichtet war
  rationale: Das Partizip von פנה beschreibt zusammen mit קָדִים die Ausrichtung des Tores nach Osten.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf einen überraschenden neuen Anblick. „Siehe“ erhält den lebendigen prophetischen Erzählton.
- source_word: מַיִם מְפַכִּים
  choice: Wasser sickerte hervor
  rationale: פכה bezeichnet hier einen erst kleinen, hervortretenden Wasserfluss. „Sickerte hervor“ vermittelt diese beginnende Bewegung, ohne bereits einen starken Strom vorauszusetzen.
- source_word: מִן הַכָּתֵף הַיְמָנִית
  choice: von der rechten Seite her
  rationale: כָּתֵף bedeutet wörtlich „Schulter“, kann räumlich aber die Seite oder Flanke eines Bauwerks bezeichnen. Die idiomatische Wiedergabe vermeidet ein missverständliches anatomisches Bild.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Aufforderung „Und siehe“ bewahrt den prophetischen Ton. Die Satzführung bleibt räumlich klar, ohne die hebräischen Wegangaben unnötig schwerfällig nachzubilden.
