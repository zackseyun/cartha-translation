  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם וַ/יּוֹלִכֵ֥/נִי וַ/יְשִׁבֵ֖/נִי שְׂפַ֥ת הַ/נָּֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/006.yaml
  text: Then he said to me[a], “Have you seen this[d][c][b], son of man?” Then he led me and brought me back to the bank of the stream.
translation:
  language: de
  text: 'Dann sagte er zu mir: »Hast du es gesehen, Menschensohn?« Darauf führte er mich und brachte mich zurück zum Ufer des Wasserlaufs.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an den Rand des Baches«; das hebräische Wort für »Wasserlauf« kann je nach Zusammenhang auch einen Bach, Fluss oder ein Wadi bezeichnen. Wörtlich: »an die Lippe des Wasserlaufs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Dann sagte er zu mir
  rationale: Das Waw consecutivum führt die Erzählung weiter; »Dann« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: הֲרָאִיתָ
  choice: Hast du es gesehen?
  rationale: Die Frage mit dem Perfekt erkundigt sich danach, ob Ezechiel das soeben Gezeigte wahrgenommen hat. Das Pronomen »es« macht das im Hebräischen unausgesprochene, aus dem Kontext erkennbare Objekt im Deutschen idiomatisch deutlich.
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede ist für Ezechiel charakteristisch. Die formnahe, eingebürgerte Wiedergabe bewahrt das wiederkehrende literarische und theologische Motiv.
- source_word: וַיּוֹלִכֵנִי וַיְשִׁבֵנִי
  choice: Darauf führte er mich zurück
  rationale: Die beiden kausativen Verben bezeichnen hier zusammen das Geführtwerden und die Rückkehr. Die kompakte deutsche Form vermeidet das schwerfällige »führte mich und brachte mich zurück«, ohne den Bewegungsablauf zu verändern.
- source_word: שְׂפַת
  choice: Ufer
  rationale: Wörtlich »Lippe/Rand«; bei einem Wasserlauf ist »Ufer« die klare und natürliche deutsche Entsprechung.
- source_word: הַנָּחַל
  choice: Wasserlauf
  rationale: נחל kann je nach Zusammenhang Bach, Fluss oder Wadi bezeichnen. »Wasserlauf« bewahrt hier die lexikalische Offenheit und passt zu dem fließenden Wasser der Vision.
theological_decisions:
- issue: Wiedergabe der prophetischen Anrede בֶן־אָדָם
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: »Menschensohn« erhält die hebräische Form und die konsequent wiederkehrende Anrede Ezechiels, ohne eine zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist natürlich formuliert; die feste Anrede »Menschensohn« und die Bildsprache des hebräischen Textes bleiben erkennbar. Die Fußnote bündelt die echte Bedeutungsbreite von שׂפה und נחל.
