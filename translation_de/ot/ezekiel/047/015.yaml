  text: וְ/זֶ֖ה גְּב֣וּל הָ/אָ֑רֶץ לִ/פְאַ֨ת צָפ֜וֹנָ/ה מִן הַ/יָּ֧ם הַ/גָּד֛וֹל הַ/דֶּ֥רֶךְ חֶתְלֹ֖ן לְב֥וֹא צְדָֽדָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/015.yaml
  text: 'And this shall be the boundary of the land: on the north side[d][c][b][a], from the Great Sea by the way of Hethlon to Lebo-zedad.'
translation:
  language: de
  text: 'Und dies ist die Grenze des Landes an der Nordseite: Sie verläuft vom Großen Meer[a] auf dem Weg nach Hetlon bis dorthin, wo man nach Zedad kommt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Große Meer“ ist das Mittelmeer.
    reason: cultural_note
  - marker: b
    text: Die hebräische Wendung kann auch als Ortsname „Lebo-Zedad“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה גְּבוּל הָאָרֶץ
  choice: Und dies ist die Grenze des Landes
  rationale: Die nominale hebräische Aussage enthält kein ausdrücklich geschriebenes Verb. Im Deutschen gibt „ist“ die natürliche präsentische Grenzbeschreibung wieder, ohne eine Zukunftsform in den Ausgangstext einzutragen.
- source_word: לִפְאַת צָפוֹנָה
  choice: Auf der Nordseite
  rationale: Die Wendung bezeichnet die nördliche Seite beziehungsweise Begrenzung des beschriebenen Landes.
- source_word: מִן הַיָּם הַגָּדוֹל
  choice: vom Großen Meer
  rationale: Die traditionelle geografische Bezeichnung wird im Haupttext bewahrt; gemeint ist das Mittelmeer.
- source_word: הַדֶּרֶךְ חֶתְלֹן
  choice: auf dem Weg nach Hetlon
  rationale: דֶּרֶךְ kann Weg, Straße oder Route bezeichnen. Die Formulierung gibt die Streckenführung natürlich wieder, ohne die genaue Topografie festzulegen.
- source_word: לְבוֹא צְדָדָה
  choice: bis zum Zugang nach Zedad
  rationale: לְבוֹא kann in Grenzbeschreibungen den Zugang oder die Annäherung an einen Ort bezeichnen; das Richtungssuffix an צְדָדָה weist nach Zedad. Die Wiedergabe erhält diese topografische Nuance, statt die Wörter sicher zu einem zusammengesetzten Ortsnamen zu verbinden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache im knappen Stil einer Grenzbeschreibung. Das im Deutschen nötige „verläuft sie“ verdeutlicht den Verlauf, ohne eine zusätzliche inhaltliche Aussage einzuführen. Ortsnamen erscheinen in geläufiger deutscher Umschrift.
