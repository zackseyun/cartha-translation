base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/023.yaml
  text: And it shall be that in the tribe with which the sojourner resides[a], there you shall give him his inheritance, declares the Lord GOD.
translation:
  language: de
  text: 'Und es soll so sein: In dem Stamm, bei dem der ansässige Fremde lebt[a], sollt ihr ihm dort seinen Erbbesitz geben. – Spruch Yahwehs, des Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beisasse“. Das hebräische גֵּר bezeichnet hier einen nicht einheimischen Menschen, der dauerhaft innerhalb der Gemeinschaft Israels lebt, nicht lediglich einen vorübergehend anwesenden Reisenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es soll so sein
  rationale: Die formelhafte, zukunftsbezogene Einleitung einer rechtlichen Bestimmung wird würdig und ohne unnötige Archaisierung wiedergegeben.
- source_word: בַשֵּׁבֶט
  choice: in dem Stamm
  rationale: שֵׁבֶט bezeichnet im Zusammenhang der Landverteilung den Stamm als territoriale Einheit.
- source_word: אֲשֶׁר גָּר הַגֵּר אִתּוֹ
  choice: bei dem der ansässige Fremde lebt
  rationale: גֵּר bezeichnet einen nicht einheimischen Menschen, der dauerhaft innerhalb der Gemeinschaft lebt. Die Wiedergabe mit „bei dem“ nimmt das singularische אִתּוֹ auf, ohne den deutschen Satz unnötig zu belasten.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb betont, dass die Zuteilung gerade in dem Stamm erfolgen soll, bei dem der Fremde lebt.
- source_word: תִּתְּנוּ
  choice: sollt ihr geben
  rationale: Die zweite Person Plural hat in dieser Rechtsbestimmung verpflichtenden Zukunftscharakter; „geben“ bewahrt die Direktheit von נתן.
- source_word: נַחֲלָתוֹ
  choice: seinen Erbbesitz
  rationale: נַחֲלָה meint hier den als bleibenden Anteil zugewiesenen Landbesitz. „Erbbesitz“ ist im Deutschen präziser als das möglicherweise abstrakte „Erbe“.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr, Yahweh
  rationale: Die prophetische Botenformel wird idiomatisch mit „spricht“ wiedergegeben; אֲדֹנָי und der Gottesname יהוה bleiben als Titel und Eigenname unterscheidbar.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr, Yahweh
  alternative: Gott, der HERR; der Herr HERR; der Herr, der EWIGE
  rationale: Der Ausdruck enthält sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יהוה. „Der Herr, Yahweh“ erhält diese Unterscheidung und vermeidet eine Verdoppelung von „Herr“, ohne eine konfessionelle Deutung einzutragen.
- issue: Rechtsstellung des גֵּר beim Landbesitz
  choice: ansässiger Fremder mit eigenem Erbbesitz
  alternative: bloßer Reisender oder zeitweiliger Gast
  rationale: Der Zusammenhang spricht von einer dauerhaft unter Israel lebenden nicht einheimischen Person, der Land als Erbbesitz zugeteilt wird. Die Übersetzung bewahrt diese weitreichende Aussage, statt sie abzuschwächen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem rechtlich-prophetischem Ton. Der Doppelpunkt macht die formelhafte Einleitung lesbar; „Erbbesitz“ hält den Bezug auf die Landzuteilung deutlich. Der Fußnotenmarker [a] steht unmittelbar am erläuterten Ausdruck.
