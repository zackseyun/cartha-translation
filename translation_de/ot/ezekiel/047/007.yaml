  text: בְּ/שׁוּבֵ֕/נִי וְ/הִנֵּה֙ אֶל שְׂפַ֣ת הַ/נַּ֔חַל עֵ֖ץ רַ֣ב מְאֹ֑ד מִ/זֶּ֖ה וּ/מִ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/007.yaml
  text: When I returned[a], behold, on the bank of the stream were very many trees, on this side and on that side.
translation:
  language: de
  text: Als ich zurückkehrte, siehe, da standen am Ufer des Baches sehr viele Bäume, auf dieser und auf jener Seite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kompakter: „auf beiden Seiten“. Wörtlich lautet die hebräische Wendung: „von dieser und von jener Seite“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּבֵנִי
  choice: Als ich zurückkehrte
  rationale: Der Qal-Infinitivus constructus von שׁוב mit Suffix der 1. Person Singular bezeichnet hier temporal die Rückkehr des Propheten. „Als ich zurückkehrte“ gibt die Form unmittelbar und in natürlichem Deutsch wieder; „als er mich zurückgebracht hatte“ wäre aus dem Kontext erschlossen, ist aber morphologisch weniger direkt.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Die Wahrnehmungspartikel lenkt den Blick auf das überraschend Sichtbare. „Siehe, da“ bewahrt den lebendigen prophetischen Ton und lässt sich im Deutschen natürlich mit dem folgenden Verb verbinden.
- source_word: אֶל שְׂפַת הַנַּחַל
  choice: am Ufer des Baches
  rationale: שׂפה bezeichnet hier Rand oder Ufer. נחל kann Bach, Wasserlauf oder Wadi bedeuten; da in der Vision Wasser fließt, ist „Bach“ passend, ohne die Größe durch „Fluss“ zu überzeichnen.
- source_word: עֵץ רַב מְאֹד
  choice: sehr viele Bäume
  rationale: עֵץ steht formal im Singular, wird hier jedoch kollektiv gebraucht. רַב מְאֹד bezeichnet eine sehr große Menge; der deutsche Plural macht den kollektiven Sinn klar.
- source_word: מִזֶּה וּמִזֶּה
  choice: auf dieser und auf jener Seite
  rationale: Die distributive hebräische Wendung bezeichnet beide Seiten des Wasserlaufs. Die gewählte Formulierung bewahrt ihre räumliche Anschaulichkeit; kompakter wäre „auf beiden Seiten“.
theological_decisions: []
