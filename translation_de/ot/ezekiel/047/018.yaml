  text: וּ/פְאַ֣ת קָדִ֡ים מִ/בֵּ֣ין חַוְרָ֣ן וּ/מִ/בֵּין דַּמֶּשֶׂק֩ וּ/מִ/בֵּ֨ין הַ/גִּלְעָ֜ד וּ/מִ/בֵּ֨ין אֶ֤רֶץ יִשְׂרָאֵל֙ הַ/יַּרְדֵּ֔ן מִ/גְּב֛וּל עַל הַ/יָּ֥ם הַ/קַּדְמוֹנִ֖י תָּמֹ֑דּוּ וְ/אֵ֖ת פְּאַ֥ת קָדִֽימָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/018.yaml
  text: And the eastern side shall be from between Hauran and Damascus[a], and between Gilead and the land of Israel, the Jordan, from the border to the eastern sea; you shall measure the eastern side.
translation:
  language: de
  text: Die Ostseite verläuft zwischen Hauran und Damaskus sowie zwischen Gilead und dem Land Israel entlang des Jordan, von der Grenze bis zum östlichen Meer[a]. Die Ostseite sollt ihr vermessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist wahrscheinlich das Tote Meer; wörtlich: „das östliche Meer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְאַת קָדִים / פְאַת קָדִימָה
  choice: Ostseite
  rationale: In der Grenzbeschreibung bezeichnet פֵּאָה eine Seite beziehungsweise Grenzlinie des Gebiets, nicht eine geometrische Ecke. „Ostseite“ gibt die wiederholte Richtungsangabe knapp und natürlich wieder.
- source_word: מִבֵּין ... וּמִבֵּין ...
  choice: zwischen ... und ... sowie zwischen ... und ...
  rationale: Die wiederholte Verbindung מן + בין lokalisiert die Grenzlinie zwischen den genannten Gebieten. Im Deutschen ist „zwischen“ ohne ein zusätzliches „von“ idiomatischer; „sowie“ macht die parallele Struktur deutlich.
- source_word: חַוְרָן
  choice: Hauran
  rationale: Im Deutschen gebräuchliche Form des Gebietsnamens.
- source_word: דַּמֶּשֶׂק
  choice: Damaskus
  rationale: Konventionelle deutsche Form des Ortsnamens.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Konventionelle deutsche Form des Gebietsnamens.
- source_word: אֶרֶץ יִשְׂרָאֵל
  choice: das Land Israel
  rationale: Die ausdrückliche Bezeichnung „Land“ bleibt erhalten und unterscheidet das Gebiet vom Volk Israel.
- source_word: הַיַּרְדֵּן
  choice: am Jordan entlang
  rationale: Der Jordan steht im Hebräischen knapp und syntaktisch lose in der Grenzbeschreibung. Die Wiedergabe versteht ihn als die zwischen den genannten Gebieten verlaufende Grenzlinie und formuliert dies in natürlichem Deutsch.
- source_word: מִגְּבוּל
  choice: von der Grenze
  rationale: גְּבוּל bezeichnet hier eine Gebietsgrenze. Die Präposition מן wird mit „von“ wiedergegeben.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: das östliche Meer
  rationale: Die wörtliche geografische Bezeichnung des hebräischen Textes bleibt im Haupttext erhalten; der wahrscheinliche Bezug auf das Tote Meer wird in einer Fußnote genannt.
- source_word: תָּמֹדּוּ
  choice: sollt ihr ... vermessen
  rationale: Das Verb מדד bedeutet „messen“. „Vermessen“ passt im Deutschen besonders gut zur Festlegung einer Gebietsgrenze und bewahrt den Messvorgang.
theological_decisions:
- issue: Syntaktische Funktion von הַיַּרְדֵּן
  choice: 'Der Jordan wird als Verlauf der Grenze wiedergegeben: „am Jordan entlang“.'
  alternative: „der Jordan“ als unverbundene Apposition oder eigenständiges Glied der Aufzählung.
  rationale: Der hebräische Text ist hier stark verkürzt. Im Zusammenhang bildet der Jordan die natürliche Trennlinie zwischen Gilead und dem Land Israel; die gewählte Formulierung macht diese wahrscheinlichste syntaktische Beziehung lesbar, ohne eine theologische Deutung einzutragen.
- issue: Funktion der abschließenden Wendung וְאֵת פְּאַת קָדִימָה
  choice: „Das sollt ihr als Ostseite vermessen.“
  alternative: „Das ist die Ostseite.“
  rationale: Das vorangehende Verb תָּמֹדּוּ und die Akkusativmarkierung אֵת sprechen dafür, „die Ostseite“ als Gegenstand beziehungsweise Bestimmung des Vermessens aufzufassen. Die Alternative glättet die Wendung zu einer reinen Abschlussformel, ist grammatisch jedoch weniger unmittelbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Grenzsprache wird lesbar gegliedert; die Wiederholung von „Ostseite“ bleibt erhalten. Die echte syntaktische Schwierigkeit beim Jordan wird nicht konfessionell oder theologisch aufgelöst.
