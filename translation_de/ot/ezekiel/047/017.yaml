  text: וְ/הָיָ֨ה גְב֜וּל מִן הַ/יָּ֗ם חֲצַ֤ר עֵינוֹן֙ גְּב֣וּל דַּמֶּ֔שֶׂק וְ/צָפ֥וֹן צָפ֖וֹנָ/ה וּ/גְב֣וּל חֲמָ֑ת וְ/אֵ֖ת פְּאַ֥ת צָפֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/017.yaml
  text: So the border shall be from the sea to Hazar-enon[a], at the border of Damascus; and on the north, northward, with the border of Hamath[b]. This shall be the north side.
translation:
  language: de
  text: Die Grenze soll vom Meer[a] bis Hazar-Enon[b] reichen, an der Grenze von Damaskus; nach Norden hin, nordwärts, entlang der Grenze von Hamat. Das ist die Nordgrenze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Meer“. Im Zusammenhang ist das Mittelmeer gemeint; „das Große Meer“ steht an dieser Stelle jedoch nicht ausdrücklich.'
    reason: cross_reference
  - marker: b
    text: Hazar-Enon wird traditionell auch als „Hazar-Enan“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: soll … reichen
  rationale: Die Form führt im Zusammenhang die Festlegung des Grenzverlaufs fort. „Soll … reichen“ gibt den rechtlich-geografischen Sinn im heutigen Deutsch natürlich wieder.
- source_word: גְּבוּל
  choice: Grenze
  rationale: „Grenze“ ist die übliche und klare deutsche Bezeichnung für eine territoriale Begrenzung und bewahrt die Wiederholung des hebräischen Ausdrucks.
- source_word: מִן הַיָּם
  choice: vom Meer
  rationale: Der hebräische Text sagt hier lediglich „vom Meer“. Gemeint ist im Kontext das Mittelmeer, doch diese Präzisierung wird nicht in den Haupttext eingefügt.
- source_word: חֲצַר עֵינוֹן
  choice: Hazar-Enon
  rationale: Der Ortsname wird nach seiner masoretischen Vokalisierung transliteriert und nicht übersetzt.
- source_word: גְּבוּל דַּמֶּשֶׂק
  choice: an der Grenze von Damaskus
  rationale: Die Formulierung gibt die geografische Zuordnung Hazar-Enons zur Grenze des Gebiets von Damaskus verständlich wieder.
- source_word: וְצָפוֹן צָפוֹנָה
  choice: im Norden, nordwärts
  rationale: Die ungewöhnliche Wiederholung der Nordangabe wird bewusst erhalten, statt sie zu einer einzigen Richtungsangabe einzuebnen.
- source_word: וּגְבוּל חֲמָת
  choice: verläuft die Grenze von Hamat
  rationale: Das ergänzte Verb macht den elliptischen geografischen Satz im Deutschen verständlich, ohne die Grenze von Hamat mit der zuvor genannten Grenze gleichzusetzen oder anders auszudeuten.
- source_word: וְאֵת פְּאַת צָפוֹן
  choice: Das ist die Nordseite
  rationale: Die abschließende Wendung fasst die zuvor beschriebene nördliche Grenzseite resumptiv zusammen; im Deutschen ist dafür ein vollständiger Satz erforderlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die topografische Knappheit des Hebräischen bleibt erkennbar; die doppelte Nordangabe wird nicht geglättet. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
