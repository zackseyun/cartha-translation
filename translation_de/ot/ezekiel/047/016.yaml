  text: חֲמָ֤ת בֵּר֨וֹתָה֙ סִבְרַ֔יִם אֲשֶׁר֙ בֵּין גְּב֣וּל דַּמֶּ֔שֶׂק וּ/בֵ֖ין גְּב֣וּל חֲמָ֑ת חָצֵר֙ הַתִּיכ֔וֹן אֲשֶׁ֖ר אֶל גְּב֥וּל חַוְרָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/016.yaml
  text: Hamath[a], Berothah, Sibraim—which is between the border of Damascus and the border of Hamath—Hazer-hattikon[c][b], which is toward the border of Hauran.
translation:
  language: de
  text: Hamat, Berota, Sibrajim – das zwischen der Grenze von Damaskus und der Grenze von Hamat liegt –, Hazer-Hattichon,[a] das zur Grenze des Hauran hin liegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name bedeutet seinen Bestandteilen nach etwa „mittlere Siedlung“ oder „mittlerer Hof“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das an der Grenze des Hauran liegt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָת
  choice: Hamat
  rationale: Der Ortsname wird in einer im Deutschen üblichen, eng am Hebräischen orientierten Form wiedergegeben; der Text enthält nicht die längere Bezeichnung Lebo-Hamat.
- source_word: בֵּרוֹתָה
  choice: Berota
  rationale: Direkte deutsche Umschrift der masoretischen Namensform; die verwandte Form Berotai aus 2. Samuel 8,8 wird nicht in den Haupttext übernommen.
- source_word: סִבְרַיִם
  choice: Sibrajim
  rationale: Die Umschrift bildet die hebräische Namensform für deutsche Leser nachvollziehbar ab.
- source_word: אֲשֶׁר בֵּין גְּבוּל דַּמֶּשֶׂק וּבֵין גְּבוּל חֲמָת
  choice: das zwischen der Grenze von Damaskus und der Grenze von Hamat liegt
  rationale: Der Relativsatz wird auf den unmittelbar vorausgehenden Ortsnamen Sibrajim bezogen; die Wiederholung von גְּבוּל bleibt entsprechend der hebräischen Struktur erhalten.
- source_word: חָצֵר הַתִּיכוֹן
  choice: Hazer-Hattichon
  rationale: Die Wortgruppe fungiert in der Grenzliste wahrscheinlich als zusammengesetzter Ortsname und wird deshalb transliteriert statt übersetzt.
- source_word: אֲשֶׁר אֶל גְּבוּל חַוְרָן
  choice: das an der Grenze des Hauran liegt
  rationale: אֶל kann hier räumliche Zuordnung oder Ausrichtung bezeichnen. „an der Grenze“ ist idiomatisches Deutsch, ohne ein Erreichen oder Überschreiten der Grenze zu behaupten.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Im Zusammenhang der Landesabgrenzung bezeichnet das Wort am klarsten eine Grenzlinie bzw. Begrenzung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Ortsnamen werden in deutscher Umschrift geboten. Gedankenstriche machen die Zuordnung des ersten Relativsatzes zu Sibrajim kenntlich; „sowie“ verbindet anschließend Hazer-Hattichon mit der Ortsliste.
