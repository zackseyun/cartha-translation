source:
  edition: WLC
  text: וּ/פְאַת יָם֙ הַ/יָּ֣ם הַ/גָּד֔וֹל מִ/גְּב֕וּל עַד נֹ֖כַח לְב֣וֹא חֲמָ֑ת זֹ֖את פְּאַת יָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/020.yaml
  text: And the west side shall be the Great Sea[a], from the border up to opposite Lebo-hamath[b]. This is the west side.
translation:
  language: de
  text: Die Westseite soll das Große Meer sein, von der Grenze bis gegenüber von Lebo-Hamat[a]. Das ist die Westseite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Lebo-Hamat; traditionell auch als »Eingang nach Hamat« verstanden. Wahrscheinlich ist hier ein Ortsname im Norden des Landes gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת יָם
  choice: Die Westseite
  rationale: Wörtlich »die Meerseite«; in den Grenzbeschreibungen bezeichnet die dem Mittelmeer zugewandte Seite den Westen. »Westseite« gibt den Richtungssinn im Deutschen natürlich wieder.
- source_word: הַיָּם הַגָּדוֹל
  choice: das Große Meer
  rationale: Die hebräische Bezeichnung für das Mittelmeer wird formal bewahrt, statt sie durch den modernen geografischen Namen zu ersetzen.
- source_word: מִגְּבוּל
  choice: von der Grenze
  rationale: גְּבוּל bezeichnet eine Grenze oder Grenzlinie. Der bestimmte Bezug bleibt im Deutschen erhalten, auch wenn der genaue Ausgangspunkt im Vers selbst knapp formuliert ist.
- source_word: עַד נֹכַח
  choice: bis gegenüber von
  rationale: נֹכַח hat hier räumlich den Sinn »gegenüber«. Zusammen mit עַד bezeichnet es den Endpunkt beziehungsweise die Ausdehnung der Grenzlinie.
- source_word: לְבוֹא חֲמָת
  choice: Lebo-Hamat
  rationale: Die Wortfolge kann wörtlich als »Eingang nach Hamat« verstanden werden, fungiert in Grenzformeln jedoch wahrscheinlich als geografischer Name. Die Transliteration bewahrt diese Möglichkeit.
- source_word: זֹאת פְּאַת יָם
  choice: Das ist die Westseite
  rationale: Die abschließende Zusammenfassungsformel wird knapp wiedergegeben; »Westseite« überträgt erneut den idiomatischen Sinn von »Meerseite«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit der knappen Wiederholungsstruktur einer Grenzbeschreibung. »Das Große Meer« bewahrt die traditionelle hebräische Benennung des Mittelmeers; die geografisch idiomatische »Meerseite« wird verständlich als »Westseite« wiedergegeben.
