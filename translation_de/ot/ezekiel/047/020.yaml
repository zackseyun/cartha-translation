  source_fidelity: 'Die Übersetzung gibt die elliptische Grenzformel sachgerecht wieder: פְּאַת יָם wird idiomatisch als „Westseite“ verstanden, הַיָּם הַגָּדוֹל als „das Große Meer“ bewahrt, und die räumliche Bestimmung „von der Grenze bis gegenüber von Lebo-Hamat“ entspricht מִגְּבוּל עַד נֹכַח לְבוֹא חֲמָת. Das einleitende „soll ... sein“ ist eine natürliche deutsche Ausformung der nominalen hebräischen Grenzbestimmung und verändert den Sinn nicht.'
