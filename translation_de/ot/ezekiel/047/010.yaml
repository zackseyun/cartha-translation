id: EZK.47.10
reference: Ezekiel 47:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָה֩ יעמדו עָלָ֜י/ו דַּוָּגִ֗ים מֵ/עֵ֥ין גֶּ֨דִי֙ וְ/עַד עֵ֣ין עֶגְלַ֔יִם מִשְׁט֥וֹחַ לַֽ/חֲרָמִ֖ים יִהְי֑וּ לְ/מִינָ/ה֙ תִּהְיֶ֣ה דְגָתָ֔/ם כִּ/דְגַ֛ת הַ/יָּ֥ם הַ/גָּד֖וֹל רַבָּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/010.yaml
  text: And it will happen that fishermen will stand beside it[a]; from En-gedi even to En-eglaim there will be a place for spreading nets. Their fish will be of many kinds, like the fish of the Great Sea[b], very many.
translation:
  language: de
  text: 'Und es wird geschehen: An ihm entlang werden Fischer stehen. Von En-Gedi bis En-Eglajim wird es einen Platz zum Ausbreiten der Netze geben. Dort wird es Fische aller Art[a] geben, wie die Fische des Großen Meeres[b], und zwar überaus viele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ihre Fische werden nach ihrer Art sein“; gemeint ist eine große Vielfalt an Fischarten.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Großen Meer“ ist das Mittelmeer gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt die prophetische Zukunftsformel und klingt zugleich würdevoll und verständlich.
- source_word: יעמדו עָלָיו דַּוָּגִים
  choice: An ihm entlang werden Fischer stehen
  rationale: עָלָיו bezeichnet hier die Lage am Wasser; „an ihm entlang“ gibt die räumliche Ausdehnung natürlicher wieder als das wörtliche, im Deutschen missverständliche „auf ihm“.
- source_word: מֵעֵין גֶּדִי וְעַד עֵין עֶגְלַיִם
  choice: Von En-Gedi bis En-Eglajim
  rationale: Die מן…ועד-Konstruktion bezeichnet die gesamte Strecke zwischen den beiden Orten; die Namen werden in gebräuchlicher deutscher Umschrift wiedergegeben.
- source_word: מִשְׁטוֹחַ לַחֲרָמִים
  choice: Plätze zum Ausbreiten der Netze
  rationale: מִשְׁטוֹחַ ist eine Fläche beziehungsweise ein Ort zum Ausbreiten; חֲרָמִים sind hier Fischernetze. Der Plural „Plätze“ passt im Deutschen zur ausgedehnten Uferstrecke.
- source_word: לְמִינָהּ תִּהְיֶה דְגָתָם
  choice: Dort wird es Fische aller Art geben
  rationale: Die hebräische Wendung beschreibt Fische nach ihren Arten und damit eine große Artenvielfalt. „Dort“ nimmt den zuvor genannten Gewässer- und Uferbereich natürlich auf, ohne den im Deutschen unklaren pronominalen Anschluss „ihre Fische“ zu erzwingen.
- source_word: כִּדְגַת הַיָּם הַגָּדוֹל
  choice: wie die Fische des Großen Meeres
  rationale: „Großes Meer“ bewahrt die biblische Bezeichnung; die geografische Identifikation wird in einer Fußnote erläutert.
- source_word: רַבָּה מְאֹד
  choice: überaus viele
  rationale: Gibt die starke Mengenangabe knapp und idiomatisch wieder.
theological_decisions: []
