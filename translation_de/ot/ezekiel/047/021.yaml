  yaml_path: translation/ot/ezekiel/047/021.yaml
  text: So you shall divide this land among yourselves according to the tribes of Israel[a].
translation:
  language: de
  text: So sollt ihr dieses Land unter euch nach den Stämmen Israels aufteilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Und ihr sollt dieses Land für euch, für die Stämme Israels, aufteilen.'
    reason: Die beiden mit לְ gebildeten Wendungen können formaler mit „für euch“ und „für die Stämme Israels“ wiedergegeben werden; ihre genaue syntaktische Beziehung ist nicht völlig eindeutig.
lexical_decisions:
- source_word: וְחִלַּקְתֶּם
  choice: So sollt ihr … aufteilen
  rationale: Das Piel von חלק bezeichnet das Teilen oder Zuteilen. „Aufteilen“ passt zum Zusammenhang der Landverteilung; „so“ gibt den fortführenden beziehungsweise folgernden Sinn des vorangestellten ו wieder.
- source_word: אֶת
  choice: '[unübersetzt]'
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige Entsprechung.
- source_word: הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: Dies ist die direkte und im Zusammenhang einer Gebietsverteilung natürliche Wiedergabe.
- source_word: לָכֶם
  choice: unter euch
  rationale: Wörtlich ist „für euch“ oder „euch“ möglich. Im Verteilungskontext bringt „unter euch“ idiomatisch zum Ausdruck, dass das Land innerhalb der angesprochenen Gemeinschaft aufgeteilt wird.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: nach den Stämmen Israels
  rationale: Die Wendung bezeichnet hier wahrscheinlich die Gliederung der Landverteilung nach den israelitischen Stämmen. Die formal näheren Möglichkeiten „für die Stämme Israels“ beziehungsweise „an die Stämme Israels“ bleiben in der Fußnote sichtbar.
