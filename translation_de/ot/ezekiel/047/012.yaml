  text: וְ/עַל הַ/נַּ֣חַל יַעֲלֶ֣ה עַל שְׂפָת֣/וֹ מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה כָּל עֵֽץ מַ֠אֲכָל לֹא יִבּ֨וֹל עָלֵ֜/הוּ וְ/לֹֽא יִתֹּ֣ם פִּרְי֗/וֹ לָֽ/חֳדָשָׁי/ו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔י/ו מִן הַ/מִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים ו/היו פִרְי/וֹ֙ לְ/מַֽאֲכָ֔ל וְ/עָלֵ֖/הוּ לִ/תְרוּפָֽה־־׀׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/012.yaml
  text: Along the river[a], on its bank, on this side and on that side, every kind of tree for food will grow. Its leaf will not wither, and its fruit will not fail; every month it will bear fresh fruit, because its waters are coming out from the sanctuary. Its fruit will be for food[c][b], and its leaf for healing.
translation:
  language: de
  text: Am Fluss, an seinem Ufer, werden auf dieser und auf jener Seite[a] allerlei Bäume wachsen, deren Früchte als Nahrung dienen. Ihre Blätter werden nicht welken, und ihre Früchte werden nicht ausgehen. Monat für Monat werden sie frische Früchte tragen[b], denn das Wasser des Flusses kommt aus dem Heiligtum. Ihre Früchte werden als Nahrung und ihre Blätter zur Heilung dienen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von dieser und von jener Seite“; gemeint sind beide Seiten des Flusses.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb bezeichnet das Hervorbringen früh oder zuerst gereifter Frucht; auch möglich: „frühreife Früchte hervorbringen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „als Heilmittel“ oder „als Arznei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֶה
  choice: werden … wachsen
  rationale: Das Verb bedeutet wörtlich „hinaufsteigen“, bezeichnet hier bei Bäumen am Flussufer aber idiomatisch ihr Aufwachsen.
- source_word: שְׂפָתוֹ
  choice: an seinem Ufer
  rationale: שׂפה bezeichnet wörtlich die „Lippe“ oder den „Rand“; bei einem Fluss ist „Ufer“ die natürliche deutsche Entsprechung.
- source_word: מִזֶּה וּמִזֶּה
  choice: auf dieser und auf jener Seite
  rationale: Die anschauliche räumliche Formulierung des Hebräischen wird bewahrt; gemeint sind beide Seiten des Flusses.
- source_word: כָּל עֵץ מַאֲכָל
  choice: allerlei Bäume …, deren Früchte als Nahrung dienen
  rationale: Die Formulierung gibt die Vielfalt essbarer Fruchtbäume in natürlichem Deutsch wieder, ohne zu behaupten, das Holz selbst diene als Nahrung.
- source_word: לֹא יִבּוֹל עָלֵהוּ
  choice: Ihre Blätter werden nicht welken
  rationale: נבל bezeichnet bei Pflanzen das Welken oder Verblassen. Der deutsche Plural entspricht dem kollektiv gebrauchten hebräischen Singular.
- source_word: וְלֹא יִתֹּם פִּרְיוֹ
  choice: ihre Früchte werden nicht ausgehen
  rationale: תם bedeutet hier „zu Ende gehen“ oder „aufgebraucht sein“; „nicht ausgehen“ vermittelt die unaufhörliche Fruchtbarkeit.
- source_word: לָחֳדָשָׁיו
  choice: Monat für Monat
  rationale: Die Wendung bezeichnet die regelmäßige Fruchtbildung in jedem Monat.
- source_word: יְבַכֵּר
  choice: werden sie frische Früchte tragen
  rationale: Das Piel von בכר ist mit frühem beziehungsweise erstem Reifen verbunden. Im Zusammenhang monatlich wiederkehrender Fruchtbildung gibt „frische Früchte tragen“ den Sinn natürlich wieder; die engere lexikalische Nuance bleibt in der Fußnote sichtbar.
- source_word: מֵימָיו
  choice: das Wasser des Flusses
  rationale: Der Bezug des pronominalen „seine Wasser“ wird im Deutschen zur Klarheit ausdrücklich als der Fluss angegeben; der hebräische Plural „Wasser“ wird idiomatisch singularisch wiedergegeben.
- source_word: מִן הַמִּקְדָּשׁ
  choice: aus dem Heiligtum
  rationale: מקדש bezeichnet den heiligen Bereich beziehungsweise das Heiligtum und passt unmittelbar zu Ezechiels Tempelvision.
- source_word: לִתְרוּפָה
  choice: zur Heilung
  rationale: Das Substantiv kann Heilung, Heilmittel oder Arznei bezeichnen. „Zur Heilung“ bewahrt den umfassenden wiederherstellenden Sinn.
theological_decisions:
- issue: Die lebenspendende Fülle des Flusses in der Tempelvision
  choice: 'Die Bildsprache wird unmittelbar wiedergegeben: Das aus dem Heiligtum kommende Wasser bewirkt fortwährende Nahrung und Heilung.'
  alternative: Die Bäume, Früchte oder Blätter bereits in der Übersetzung ausdrücklich sakramental, kirchlich oder endzeitlich deuten.
  rationale: Der Vers besitzt weitreichende theologische Bildkraft, legt hier jedoch keine einzelne spätere Deutung ausdrücklich fest. Die Übersetzung bewahrt daher das Bild und seinen kausalen Zusammenhang, ohne eine konfessionelle Auslegung einzutragen.
- issue: Bedeutungsnuance von יְבַכֵּר
  choice: Im Haupttext steht die kontextuell natürliche Wendung „frische Früchte tragen“, während die Nuance frühen oder ersten Reifens in der Fußnote erhalten bleibt.
  alternative: „Erstlingsfrüchte tragen“ oder „frühreife Früchte hervorbringen“.
  rationale: „Erstlingsfrüchte“ könnte im Deutschen ungewollt eine kultische Opferkategorie nahelegen. Der Zusammenhang betont dagegen die jeden Monat erneuerte Fruchtbarkeit; die Fußnote wahrt die echte lexikalische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wiederholung „Am Fluss, an seinem Ufer“ bewahrt die räumliche Entfaltung des hebräischen Textes. Kollektive hebräische Singularformen werden im Deutschen natürlich im Plural wiedergegeben.
