source:
  edition: WLC
  text: וּ/פְאַת֙ נֶ֣גֶב תֵּימָ֔נָ/ה מִ/תָּמָ֗ר עַד מֵי֙ מְרִיב֣וֹת קָדֵ֔שׁ נַחֲלָ֖ה אֶל הַ/יָּ֣ם הַ/גָּד֑וֹל וְ/אֵ֥ת פְּאַת תֵּימָ֖נָ/ה נֶֽגְבָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
translation:
  language: de
  text: Die Südgrenze im Süden verläuft von Tamar bis zum Wasser von Meribot-Kadesch[a], zum Bachtal[b] und zum Großen Meer[c]. Das ist die Südgrenze im Süden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Wasser von Meriba-Kadesch“. Im Hebräischen steht hier die verwandte Namensform „Meribot-Kadesch“.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort bezeichnet ein Bachtal oder Wasserbett, das häufig nur zeitweise Wasser führt.
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist das Mittelmeer.
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  choice: Seite
  rationale: In der Grenzbeschreibung bezeichnet das Wort die Seite beziehungsweise Begrenzung des Landes. „Seite“ bewahrt zudem die wiederholte Schlussformel.
- source_word: נֶגֶב / תֵּימָנָה
  choice: Südseite nach Süden
  rationale: Beide Richtungsangaben werden wiedergegeben, damit die nachdrückliche, formelhafte Ausdrucksweise des Hebräischen erhalten bleibt; נֶגֶב ist hier richtungsbezogen und nicht als Eigenname „Negev“ zu verstehen.
- source_word: מִתָּמָר
  choice: von Tamar
  rationale: Der Ortsname wird in üblicher deutscher Form transliteriert.
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  choice: zum Wasser von Meribot-Kadesch
  rationale: Die Übersetzung folgt der im WLC bezeugten Namensform מְרִיבוֹת; die verwandte, geläufigere Form „Meriba-Kadesch“ wird in einer Fußnote genannt.
- source_word: נַחֲלָה
  choice: zum Bachtal
  rationale: Hier liegt נַחַל mit direktionalem ה vor, also „zum Bach/Bachtal“, nicht das gleichlautend anmutende Wort für „Erbbesitz“. „Bachtal“ bezeichnet verständlich ein oft nur zeitweise wasserführendes Gerinne samt Tal.
- source_word: הַיָּם הַגָּדוֹל
  choice: zum Großen Meer
  rationale: Die traditionelle geografische Bezeichnung wird formal bewahrt; ihre Identifikation mit dem Mittelmeer steht in der Fußnote.
- source_word: וְאֵת פְּאַת תֵּימָנָה נֶגְבָּה
  choice: Das ist die Südseite nach Süden
  rationale: Die hebräische Schlusswendung ist elliptisch und fasst die eben beschriebene Grenze zusammen. „Das ist“ ergänzt im Deutschen nur das für einen vollständigen Satz nötige Prädikat.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst wiederholte Richtungsformel „Südseite nach Süden“ erhält die formelhafte Grenzsprache des Ausgangstextes; „verläuft“ macht die im Hebräischen nominal formulierte Grenzangabe natürlich verständlich.
