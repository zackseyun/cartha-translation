  yaml_path: translation/ot/ezekiel/047/011.yaml
  text: But its swamps and marshes will not be healed[b][a]; they are left for salt.
translation:
  language: de
  text: Doch seine Sümpfe und Tümpel werden nicht geheilt; sie sind dem Salz überlassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בצאתו
  choice: seine Sümpfe
  rationale: Das topografische Substantiv bezeichnet hier sumpfige oder schlammige Niederungen. „Sümpfe“ gibt den Gegensatz zu den geheilten Wassern natürlich wieder; das Suffix der 3. Person Singular wird mit „seine“ bewahrt.
- source_word: וגבאיו
  choice: und Tümpel
  rationale: גבא bezeichnet Vertiefungen, Becken oder stehende Wasserstellen. „Tümpel“ bildet zusammen mit „Sümpfe“ ein verständliches Begriffspaar, ohne beide hebräischen Ausdrücke gleichzusetzen.
- source_word: ולא
  choice: werden nicht
  rationale: Die Negation wird mit dem folgenden passiven Verb in natürlichem modernem Deutsch wiedergegeben.
- source_word: ירפאו
  choice: geheilt
  rationale: Der Nifal von רפא bedeutet wörtlich „geheilt werden“. Die Formulierung bewahrt das Bild des Abschnitts, auch wenn bei Wasser sachlich das Frisch- oder Gesundwerden gemeint ist.
- source_word: למלח
  choice: für Salz
  rationale: Die Präposition ל bezeichnet hier Bestimmung oder Ergebnis. Die knappe Formulierung wahrt die Offenheit, ob Salzgewinnung oder fortbestehende Salzhaltigkeit im Vordergrund steht.
- source_word: נתנו
  choice: sind bestimmt
  rationale: Das passive „sind bestimmt“ gibt die Zuweisung der betreffenden Gebiete wieder und ist im Deutschen natürlicher als das wörtliche „sind gegeben“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Geheilt“ erhält bewusst die Bildsprache des hebräischen Textes; „Sümpfe und Tümpel“ unterscheidet die parallelen topografischen Begriffe in allgemein verständlicher Sprache.
