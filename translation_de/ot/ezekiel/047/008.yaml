base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/008.yaml
  text: Then he said to me[a], “These waters flow out toward the eastern district and go down into the Arabah; then they enter the sea. and when they are brought out into the sea[c][b], the waters are healed.”
translation:
  language: de
  text: 'Dann sagte er zu mir: „Dieses Wasser fließt zum östlichen Gebiet hin, strömt zur Araba hinab und gelangt ins Meer. Wenn es ins Meer geleitet wird,[a] wird das Wasser geheilt.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wortgruppe ist syntaktisch schwierig und enthält eine passive Form mit der Bedeutung „hinaus-/herausgeführt“. Aufgrund der geografischen Lage ist wahrscheinlich das Tote Meer gemeint.
    reason: textual_and_geographical_clarification
  - marker: b
    text: 'Oder sinngemäß: „Das Wasser wird frisch.“ Wörtlich heißt es: „Das Wasser wird geheilt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם הָאֵלֶּה
  choice: dieses Wasser
  rationale: Das hebräische מַיִם ist formal pluralisch, wird im modernen Deutschen jedoch als Stoffbezeichnung natürlich mit dem Singular „Wasser“ wiedergegeben.
- source_word: יוֹצְאִים
  choice: fließt … hinaus
  rationale: Das Partizip von יצא bezeichnet hier die fortdauernde Bewegung des Wassers; „hinausfließen“ ist im Kontext natürlicher als das wörtlichere „hinausgehen“.
- source_word: הַגְּלִילָה הַקַּדְמוֹנָה
  choice: in das östliche Gebiet
  rationale: גְּלִילָה bezeichnet hier eine Gegend beziehungsweise ein Gebiet; die Richtungsendung wird mit „in … hinaus“ wiedergegeben.
- source_word: וְיָרְדוּ עַל הָעֲרָבָה
  choice: strömt in die Araba hinab
  rationale: ירד drückt das Hinabgelangen aus. „Araba“ bleibt als geografische Bezeichnung für die Jordansenke erhalten.
- source_word: וּבָאוּ הַיָּמָּה
  choice: gelangt ins Meer
  rationale: בוא mit der Richtungsendung an יָם bezeichnet das Gelangen zum beziehungsweise in das Meer; im Bild eines Wasserlaufs ist „gelangt ins Meer“ idiomatisch.
- source_word: אֶל הַיָּמָּה הַמּוּצָאִים
  choice: Wenn es in das Meer hinausgeleitet wird
  rationale: Die schwierige masoretische Formulierung enthält ein passives Partizip von יצא und wird daher handlungsbezogen wiedergegeben, ohne die textlich nicht ausdrückliche Deutung „stehende Wasser“ einzuführen.
- source_word: וְנרפאו הַמָּיִם
  choice: wird das Wasser geheilt
  rationale: רפא bedeutet wörtlich „heilen“. Die Wiedergabe bewahrt die auffällige Metapher des Hebräischen, statt sie unmittelbar als „frisch“ oder „gesund“ auszudeuten.
theological_decisions:
- issue: Identität des Meeres
  choice: Im Haupttext steht nur „Meer“.
  alternative: „Totes Meer“
  rationale: Das Tote Meer ist aufgrund der geografischen Beschreibung sehr wahrscheinlich gemeint, wird im hebräischen Text aber nicht ausdrücklich mit diesem Namen bezeichnet.
- issue: Wirkung auf das Wasser
  choice: „Das Wasser wird geheilt“ bewahrt die Metapher.
  alternative: „Das Wasser wird frisch“ beziehungsweise „genießbar“
  rationale: Die konkreten Folgen der Heilung werden im Zusammenhang deutlich, doch der Vers selbst verwendet das Verb רפא („heilen“).
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Singular „Wasser“ entspricht dem üblichen deutschen Sprachgebrauch, obwohl das hebräische Wort formal pluralisch ist. Die geografische Bezeichnung „Araba“ und die Heilungsmetapher bleiben erhalten.
