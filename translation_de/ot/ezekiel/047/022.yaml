source:
  edition: WLC
  text: וְ/הָיָ֗ה תַּפִּ֣לוּ אוֹתָ/הּ֮ בְּ/נַחֲלָה֒ לָ/כֶ֗ם וּ/לְ/הַ/גֵּרִים֙ הַ/גָּרִ֣ים בְּ/תוֹכְ/כֶ֔ם אֲשֶׁר הוֹלִ֥דוּ בָנִ֖ים בְּ/תֽוֹכְ/כֶ֑ם וְ/הָי֣וּ לָ/כֶ֗ם כְּ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אִתְּ/כֶם֙ יִפְּל֣וּ בְ/נַחֲלָ֔ה בְּ/ת֖וֹךְ שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/022.yaml
  text: And it shall be that you shall allot it as an inheritance for yourselves and for the sojourners who sojourn among you[a], who have fathered children among you; and they shall be to you like a native among the sons of Israel[c][b]. With you they shall receive an inheritance among the tribes of Israel.
translation:
  language: de
  text: 'Und es soll geschehen: Ihr sollt es euch und den Fremden, die in eurer Mitte wohnen[a] und in eurer Mitte Kinder gezeugt haben[b], als Erbbesitz zuteilen. Sie sollen für euch wie Einheimische[c] unter den Israeliten sein. Zusammen mit euch sollen sie mitten unter den Stämmen Israels Erbbesitz erhalten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beisassen“ beziehungsweise „ansässige Ausländer“. Das hebräische גֵּר bezeichnet einen nicht einheimischen Menschen, der dauerhaft in Israel lebt und dort eine anerkannte Stellung hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne gezeugt haben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie im Land Geborene“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפִּלוּ / יִפְּלוּ (נפל im Hifil/Qal mit נַחֲלָה)
  choice: als Erbbesitz zuteilen / Erbbesitz erhalten
  rationale: Die Wendung bezeichnet die Landverteilung. Das kausative Hifil beschreibt das Zuteilen, während das Qal im zweiten Satz das daraus folgende Erhalten eines Erbteils ausdrückt.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Im Zusammenhang der Landverteilung bezeichnet das Wort ein dauerhaft zugewiesenes Erbland. „Erbbesitz“ ist im Deutschen präziser und natürlicher als das abstraktere „Erbe“.
- source_word: הַגֵּרִים / הַגָּרִים בְּתוֹכְכֶם
  choice: die Fremden, die in eurer Mitte wohnen
  rationale: גֵּר bezeichnet hier nicht einen bloß Durchreisenden, sondern einen nicht einheimischen Menschen mit dauerhaftem Wohnsitz in Israel. „Fremde“ wahrt die soziale Unterscheidung; der Relativsatz verdeutlicht den ansässigen Status.
- source_word: הוֹלִדוּ בָנִים
  choice: Kinder gezeugt haben
  rationale: Das Hifil von ילד bedeutet hier „zeugen“. בָנִים kann im Kontext die Nachkommenschaft bezeichnen; „Kinder“ gibt den Gedanken einer ansässigen, generationenübergreifenden Familie wieder.
- source_word: כְּאֶזְרָח
  choice: wie Einheimische
  rationale: אֶזְרָח bezeichnet ein im Land beziehungsweise in der Gemeinschaft einheimisches Mitglied. Der Vergleich mit כְּ wird durch „wie“ bewahrt.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: unter den Israeliten
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet die Angehörigen Israels, ohne die hebräische Zugehörigkeitsformel missverständlich auf ausschließlich männliche Personen einzuengen.
- source_word: אִתְּכֶם
  choice: Zusammen mit euch
  rationale: Die Formulierung hebt die gleichzeitige Beteiligung der ansässigen Fremden an der Landzuteilung neben Israel hervor.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: mitten unter den Stämmen Israels
  rationale: Die Wiedergabe bewahrt die räumlich-strukturelle Einordnung des Erbbesitzes innerhalb der israelitischen Stammesgebiete.
theological_decisions:
- issue: Rechtsstellung der גֵּרִים bei der Landverteilung
  choice: Ansässige Fremde mit dort gegründeten Familien erhalten gemeinsam mit den Einheimischen tatsächlichen Erbbesitz.
  alternative: Der Vers gewährt ihnen lediglich Aufenthalt oder Schutz, aber keinen Anteil am Land.
  rationale: Die wiederholte Erbbesitz- und Zuteilungssprache sowie der Vergleich mit Einheimischen sprechen ausdrücklich für ihre Beteiligung an der Landverteilung. Eine weitergehende heilsgeschichtliche Deutung wird nicht in den Text eingetragen.
- issue: Bedeutung von בָנִים
  choice: „Kinder“ als kontextuelle Bezeichnung der Nachkommenschaft
  alternative: „Söhne“ als formal engere Wiedergabe
  rationale: Der Zusammenhang betont die dauerhafte familiäre Verwurzelung in der Gemeinschaft. Die Fußnote hält die wörtlichere Möglichkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbbesitz“ hält den konkreten Landbezug fest. „Fremde“ wird durch den wohnbezogenen Relativsatz und eine Fußnote präzisiert; „Beisassen“ wurde wegen seines heute altertümlichen Klangs nicht in den Haupttext aufgenommen.
