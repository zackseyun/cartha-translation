source:
  edition: WLC
  text: וְ/הָיָ֣ה כָל נֶ֣פֶשׁ חַיָּ֣ה אֲֽשֶׁר יִשְׁרֹ֡ץ אֶ֣ל כָּל אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְ/הָיָ֥ה הַ/דָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּ/ה הַ/מַּ֣יִם הָ/אֵ֗לֶּה וְ/יֵרָֽפְאוּ֙ וָ/חָ֔י כֹּ֛ל אֲשֶׁר יָ֥בוֹא שָׁ֖מָּ/ה הַ/נָּֽחַל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/009.yaml
  text: And every living creature that swarms[a], wherever the river goes, will live. And there will be very many fish, because these waters go there and are healed[b]; everything will live wherever the river goes.
translation:
  language: de
  text: Und jedes Lebewesen, das wimmelt, wird leben, überall, wohin die beiden Wasserläufe[a] gelangen. Dann wird es sehr viele Fische geben; denn diese Wasser gelangen dorthin und werden geheilt[b]. Alles wird leben, wohin der Fluss gelangt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »die beiden Wasserläufe«; die Form ist dual. Viele Übersetzungen glätten sie zum Singular »der Fluss«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »denn diese Wasser gelangen dorthin, sodass das Wasser dort geheilt wird«. Das Hebräische verwendet ausdrücklich das Bild des Heilens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ חַיָּה
  choice: Lebewesen
  rationale: Die Wortverbindung bezeichnet hier allgemein belebte Geschöpfe, nicht eine menschliche »Seele«. »Lebewesen« ist im aquatischen Zusammenhang natürlich und präzise.
- source_word: יִשְׁרֹץ
  choice: wimmelt
  rationale: Das Verb beschreibt das zahlreiche Sichregen von Tieren, besonders im Wasser. »Wimmelt« bewahrt dieses anschauliche Bild.
- source_word: נַחֲלַיִם
  choice: die beiden Wasserläufe
  rationale: Die masoretische Form ist dual und bezeichnet morphologisch zwei Wasserläufe. Die Übersetzung lässt diese auffällige Form stehen, statt sie stillschweigend zum Singular zu glätten.
- source_word: יִחְיֶה
  choice: wird leben
  rationale: Die schlichte Wiedergabe entspricht dem Hebräischen und vermeidet die interpretierende Verstärkung »wird aufleben« oder »wird gedeihen«.
- source_word: הַדָּגָה
  choice: Fische
  rationale: Das hebräische Kollektiv bezeichnet den Fischbestand; im Deutschen ist der Plural »Fische« idiomatisch.
- source_word: רַבָּה מְאֹד
  choice: sehr viele
  rationale: Im Bezug auf die Fische bezeichnet die Wendung eine außerordentlich große Menge.
- source_word: וְיֵרָפְאוּ
  choice: wird geheilt
  rationale: Die Wiedergabe mit »geheilt« erhält die ausdrückliche Heilungsmetaphorik von רפא, statt sie zu »wird frisch« oder »wird gesund« abzuschwächen.
- source_word: וָחָי כֹּל
  choice: Alles wird leben
  rationale: Die umfassende Schlussaussage wird knapp und ohne zusätzliche Eingrenzung wiedergegeben.
- source_word: הַנָּחַל
  choice: der Fluss
  rationale: Obwohl נחל auch einen Bach oder ein Wadi bezeichnen kann, ist in dieser Vision ein beständig fließender, lebenspendender Wasserlauf gemeint; »Fluss« ist dafür im Deutschen am klarsten.
theological_decisions:
- issue: Heilungsbild für das Wasser
  choice: 'Das ausdrücklich verwendete Bild des Heilens bleibt erhalten: »das Wasser dort wird geheilt«.'
  alternative: Interpretierend mit »wird frisch«, »wird gesund« oder »wird genießbar« übersetzen.
  rationale: Die Vision beschreibt die Wiederherstellung des Wassers mit dem Verb »heilen«. Die Beibehaltung dieser ungewöhnlichen Metapher wahrt die theologische Bildkraft, ohne sie dogmatisch auszudeuten.
- issue: Bezug des pluralischen Verbs וְיֵרָפְאוּ
  choice: Im Haupttext bezieht sich die Heilung sinngemäß auf das Wasser am Zielort.
  alternative: 'Das Verb unmittelbar auf »dieses Wasser« beziehen: »diese Wasser kommen dorthin und werden geheilt«.'
  rationale: Der Satzbau lässt den unmittelbaren grammatischen Bezug auf »diese Wasser« zu, während der Zusammenhang eher die Heilung der dortigen salzigen Wasser nahelegt. Die Mehrdeutigkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholung von »wird leben« und der Wechsel von den dualischen »Wasserläufen« zum singularischen »Fluss« bleiben erhalten; die ungewöhnliche Heilungsmetaphorik wird nicht geglättet.
