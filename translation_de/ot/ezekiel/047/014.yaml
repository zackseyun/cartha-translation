base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/014.yaml
  text: You shall inherit it[a], each like his brother, concerning which I raised my hand to give it to your fathers[c][b]; and this land shall fall to you as an inheritance.
translation:
  language: de
  text: Ihr sollt es als Erbbesitz erhalten, jeder wie sein Bruder[a]. Es ist das Land, für das ich meine Hand erhob[b], um es euren Vätern zu geben. Und dieses Land soll euch als Erbbesitz zufallen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder zu gleichen Teilen wie sein Bruder“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung „meine Hand erhob“ ist eine hebräische Schwurformel; das heißt: „schwor“.'
    reason: source_idiom
  - marker: c
    text: „Zufallen“ bezeichnet hier die Zuteilung als Erbbesitz.
    reason: source_idiom
lexical_decisions:
- source_word: וּנְחַלְתֶּם אוֹתָהּ
  choice: Ihr sollt es als Erbbesitz erhalten
  rationale: נחל bezeichnet hier den Empfang des Landes als zugeteilten Erbbesitz. Das Pronomen ist im Hebräischen feminin und bezieht sich auf אֶרֶץ; im Deutschen verlangt „Land“ das sächliche „es“.
- source_word: אִישׁ כְּאָחִיו
  choice: jeder wie sein Bruder
  rationale: Die konkrete, grammatisch maskuline Vergleichsform bleibt erhalten. Im Zusammenhang der Landverteilung bezeichnet sie eine entsprechende beziehungsweise gleiche Zuteilung.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי לְתִתָּהּ
  choice: das Land, das ich euren Vätern mit erhobener Hand zu geben versprach
  rationale: Die deutsche Fassung bewahrt das Bild der erhobenen Hand und macht zugleich die im Hebräischen idiomatisch ausgedrückte eidliche Zusage verständlich. „Das Land“ verdeutlicht den Bezug des Relativsatzes.
- source_word: לַאֲבֹתֵיכֶם
  choice: euren Vätern
  rationale: Die wörtliche Bezeichnung „Väter“ wird beibehalten und wahrt den Bezug auf die früheren Generationen beziehungsweise die Väter der Verheißung.
- source_word: וְנָפְלָה הָאָרֶץ הַזֹּאת לָכֶם בְּנַחֲלָה
  choice: Dieses Land soll euch als Erbbesitz zufallen
  rationale: „Zufallen“ gibt das Zuteilungsidiom von נפל im Deutschen natürlich wieder; נַחֲלָה wird mit „Erbbesitz“ wiedergegeben.
theological_decisions:
- issue: Eidesformel נָשָׂאתִי אֶת יָדִי
  choice: mit erhobener Hand zu geben versprach
  alternative: meine Hand erhob, um es zu geben; schwor, es zu geben
  rationale: Die gewählte Formulierung wahrt sowohl das konkrete Bild als auch dessen Eidessinn, ohne die Zusage lediglich als unverbindliches Versprechen erscheinen zu lassen.
- issue: Distributive Wendung אִישׁ כְּאָחִיו
  choice: jeder wie sein Bruder
  alternative: jeder zu gleichen Teilen wie sein Bruder
  rationale: Die knappere Fassung erhält die maskuline und vergleichende Form des Hebräischen. Die Bedeutung gleicher Zuteilung wird in der Fußnote erklärt, statt sie im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbbesitz“ hält den wiederkehrenden Landzuteilungsbegriff präzise fest; die Satzgliederung löst die im Deutschen schwer verständliche hebräische Relativkonstruktion behutsam auf.
