base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/005.yaml
  text: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
translation:
  language: de
  text: 'Dann maß er weitere tausend Ellen[a], und es war ein Fluss, den ich nicht durchqueren konnte, denn das Wasser war angestiegen: Wasser, in dem man schwimmen konnte[b], ein Fluss, der nicht durchquert werden konnte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht nur »tausend«; die Maßeinheit »Ellen« ergibt sich aus dem Zusammenhang.
    reason: implied_unit
  - marker: b
    text: 'Wörtlich: »Wasser des Schwimmens«, das heißt Wasser, das tief genug zum Schwimmen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד אֶלֶף
  choice: Dann maß er weitere tausend Ellen
  rationale: Das Narrativ wird fortgeführt, und der unmittelbare Zusammenhang zeigt eine wiederholte Messung. Die Maßeinheit »Ellen« ist aus den vorausgehenden Versen erschlossen und wird durch eine Fußnote kenntlich gemacht.
- source_word: נַחַל
  choice: Fluss
  rationale: נַחַל kann einen Bach, ein Wadi oder einen Wasserlauf bezeichnen. In der Vision ist das Wasser nun so tief, dass man darin schwimmen kann; daher gibt »Fluss« die Szene im Deutschen am natürlichsten wieder.
- source_word: אֲשֶׁר לֹא אוּכַל לַעֲבֹר
  choice: den ich nicht durchqueren konnte
  rationale: אוּכַל bezeichnet die Fähigkeit, לַעֲבֹר das Hinübergehen beziehungsweise Durchqueren. Die Formulierung bewahrt die Ich-Perspektive des Propheten.
- source_word: כִּי גָאוּ הַמַּיִם
  choice: denn das Wasser war angestiegen
  rationale: כִּי führt die Begründung ein; גָּאָה bezeichnet hier das Steigen oder Anschwellen des Wassers.
- source_word: מֵי שָׂחוּ
  choice: Wasser, in dem man schwimmen konnte
  rationale: Die knappe hebräische Wendung lautet wörtlich etwa »Wasser des Schwimmens« und meint zum Schwimmen ausreichend tiefes Wasser. Die gewählte Formulierung ist verständlich, ohne mehr als die Möglichkeit des Schwimmens auszusagen.
- source_word: נַחַל אֲשֶׁר לֹא יֵעָבֵר
  choice: ein Fluss, der nicht durchquert werden konnte
  rationale: Das Nifal יֵעָבֵר ist passiv. Die Wiederholung von »Fluss« folgt der betonten Wiederaufnahme im Hebräischen.
