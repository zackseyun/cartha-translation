source:
  edition: WLC
  text: וַ/יְשִׁבֵ/נִי֮ אֶל פֶּ֣תַח הַ/בַּיִת֒ וְ/הִנֵּה מַ֣יִם יֹצְאִ֗ים מִ/תַּ֨חַת מִפְתַּ֤ן הַ/בַּ֨יִת֙ קָדִ֔ימָ/ה כִּֽי פְנֵ֥י הַ/בַּ֖יִת קָדִ֑ים וְ/הַ/מַּ֣יִם יֹרְדִ֗ים מִ/תַּ֜חַת מִ/כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/יְמָנִ֔ית מִ/נֶּ֖גֶב לַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
translation:
  language: de
  text: 'Dann führte er mich zum Eingang des Hauses[a] zurück. Und siehe: Unter der Schwelle des Hauses trat Wasser hervor und floss nach Osten, denn die Vorderseite des Hauses war nach Osten ausgerichtet. Das Wasser floss unter der rechten Seite des Hauses[b] herab, südlich des Altars.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Tempels“. Im Hebräischen steht wörtlich „des Hauses“; gemeint ist das Tempelgebäude in Hesekiels Vision.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unter der rechten Schulter des Hauses“. „Schulter“ bezeichnet hier die Seite oder Flanke eines Bauwerks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  choice: Dann führte er mich … zurück
  rationale: 'Die Hifil-Form von שוב mit Suffix der 1. Person Singular hat kausativen Sinn: Er veranlasste die Rückkehr des Propheten. „Führte mich zurück“ ist natürliches modernes Deutsch.'
- source_word: פֶּתַח הַבַּיִת
  choice: zum Eingang des Hauses
  rationale: פֶּתַח bezeichnet hier den Eingang beziehungsweise Eingangsbereich; בַּיִת heißt wörtlich „Haus“ und meint im Zusammenhang das Tempelgebäude.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die aufmerksamkeitslenkende Funktion des hebräischen Ausdrucks bleibt in einer würdevollen, verständlichen Form erhalten.
- source_word: מַיִם יֹצְאִים
  choice: Wasser trat hervor
  rationale: Das formal plurale מַיִם wird im Deutschen als Stoffbezeichnung singularisch wiedergegeben. Das Partizip beschreibt einen sichtbaren, fortdauernden Vorgang.
- source_word: מִתַּחַת מִפְתַּן
  choice: unter der Schwelle
  rationale: Die räumliche Angabe wird direkt wiedergegeben; מִפְתָּן bezeichnet die Tür- oder Eingangsschwelle.
- source_word: קָדִימָה
  choice: nach Osten
  rationale: Die Richtungsform bezeichnet eine Bewegung ostwärts.
- source_word: כִּי פְנֵי הַבַּיִת קָדִים
  choice: denn die Vorderseite des Hauses lag im Osten
  rationale: פְּנֵי bezeichnet hier die Vorder- beziehungsweise Eingangsseite. Die Formulierung wahrt die Orientierungsaussage, ohne mehr als der Ausgangstext zu behaupten.
- source_word: יֹרְדִים
  choice: floss … herab
  rationale: Bei Wasser gibt „herabfließen“ die abwärts gerichtete Bewegung des Partizips idiomatisch wieder.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: unter der rechten Seite des Hauses
  rationale: כָּתֵף bedeutet wörtlich „Schulter“, wird bei Bauwerken jedoch räumlich für eine Seite oder Flanke gebraucht; הַיְמָנִית bestimmt diese als die rechte Seite.
- source_word: מִנֶּגֶב לַמִּזְבֵּחַ
  choice: von der Südseite des Altars her
  rationale: נֶגֶב bezeichnet hier den Süden beziehungsweise die Südseite. „Von … her“ nimmt die Ausgangsbedeutung der Präposition מִן auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus“ bewahrt die konkrete hebräische Bezeichnung, während die Fußnote den Bezug zum Tempel erläutert. Kurze Hauptsätze und „Und sieh“ erhalten die anschauliche Bewegung der Vision; die räumlichen Angaben werden möglichst quellennah und dennoch verständlich formuliert.
