base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/003.yaml
  text: As the man went out eastward with a measuring line in his hand[a], he measured a thousand cubits and led me through the water, water up to the ankles.
translation:
  language: de
  text: Als der Mann mit einer Messschnur in der Hand nach Osten hinausging, maß er tausend Ellen ab und führte mich durch das Wasser; das Wasser reichte bis an die Knöchel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wasser der Knöchel“, das heißt Wasser, das bis an die Knöchel reicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת הָאִישׁ
  choice: Als der Mann ... hinausging
  rationale: Der Infinitivus constructus mit בְּ bildet einen Temporalsatz; „als“ gibt den zeitlichen Bezug natürlich wieder. אִישׁ bezeichnet die bereits eingeführte männliche Gestalt.
- source_word: קָדִים
  choice: nach Osten
  rationale: Das Wort bezeichnet hier adverbial die Bewegungsrichtung.
- source_word: וְקָו בְּיָדוֹ
  choice: und die Messschnur in der Hand hielt
  rationale: קָו ist im Zusammenhang eine Schnur zum Messen. Die verbale Ergänzung „hielt“ macht die hebräische Nominalfügung im Deutschen natürlich, ohne ihren Sinn zu verändern.
- source_word: וַיָּמָד אֶלֶף בָּאַמָּה
  choice: maß er tausend Ellen ab
  rationale: Die Wendung nennt die gemessene Entfernung und ihre Einheit. „Abmessen“ entspricht dem Vorgang; die trennbare Form „maß ... ab“ ist idiomatisch.
- source_word: וַיַּעֲבִרֵנִי בַמַּיִם
  choice: führte mich durch das Wasser
  rationale: Der Hifil von עבר bedeutet, jemanden hindurchgehen zu lassen beziehungsweise hindurchzuführen. Diese Wiedergabe bewahrt den kausativen Sinn in natürlichem Deutsch.
- source_word: מֵי אָפְסָיִם
  choice: das Wasser reichte bis an die Knöchel
  rationale: Die wörtliche Konstruktion „Wasser der Knöchel“ bezeichnet idiomatisch knöcheltiefes Wasser; die gewählte Fassung ist klar und anschaulich.
theological_decisions: []
