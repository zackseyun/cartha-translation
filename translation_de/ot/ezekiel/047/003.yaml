  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem Fortgang der Vision, löst jedoch die knappe hebräische Nominalfügung bei der Messschnur und die idiomatische Tiefenangabe für heutige Leser behutsam auf.
