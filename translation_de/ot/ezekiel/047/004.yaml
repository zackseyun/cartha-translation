base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/004.yaml
  text: Again he measured a thousand[a], and led me through the water—water up to the knees. Again he measured a thousand[b], and led me through water up to the waist.
translation:
  language: de
  text: Dann maß er weitere tausend[a] und führte mich durch das Wasser. Das Wasser reichte bis an die Knie. Wieder maß er tausend und führte mich durch das Wasser. Das Wasser reichte bis zur Hüfte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tausend“; die Maßeinheit „Ellen“ ergibt sich aus dem vorherigen Vers.'
    reason: cross_reference
  - marker: b
    text: 'Oder: „bis an die Lenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: maß er
  rationale: Das Qal von מדד bezeichnet hier unmittelbar das Messen durch den Mann in der Vision. „Maß er“ ist knapp, natürlich und bewahrt die wiederholte Handlung.
- source_word: אֶלֶף
  choice: tausend
  rationale: Im Hebräischen steht nur „tausend“. Die Maßeinheit ergibt sich aus dem vorherigen Vers; deshalb wird „Ellen“ nicht in den Haupttext eingefügt, sondern in einer Fußnote erläutert.
- source_word: וַיַּעֲבִרֵנִי
  choice: führte mich durch / führte mich hindurch
  rationale: Der Hifil von עבר mit dem Suffix der ersten Person bezeichnet, dass der Prophet zum Hindurchgehen veranlasst wird. „Führte mich durch“ gibt dies in natürlichem Deutsch wieder, ohne den Vorgang unnötig auszudeuten.
- source_word: בַמַּיִם
  choice: durch das Wasser
  rationale: In Verbindung mit dem kausativen Verb geht es um eine Bewegung durch das Wasser, nicht nur um einen Aufenthalt darin.
- source_word: מַיִם בִּרְכָּיִם
  choice: Das Wasser reichte bis an die Knie
  rationale: Die knappe hebräische Verbindung von „Wasser“ und „Knien“ bezeichnet die erreichte Wassertiefe. Die gewählte Formulierung ist verständlich und bleibt dem Bild nahe.
- source_word: מֵי מָתְנָיִם
  choice: Das Wasser reichte bis an die Hüften
  rationale: מָתְנַיִם bezeichnet den Bereich der Lenden beziehungsweise Hüften. „Hüften“ ist im modernen Deutsch anschaulich und würdevoll; die wörtlichere Alternative „Lenden“ bleibt in der Fußnote erhalten.
