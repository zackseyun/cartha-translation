  source_fidelity: Die Abfolge der beiden Messungen, das kausative Hindurchführen und die zunehmende Wassertiefe werden zutreffend wiedergegeben. „Hindurch“ ist im zweiten Satz verständlich, lässt jedoch im Deutschen das im hebräischen Bild weiterhin vorausgesetzte Wasser weniger klar hervortreten. Für מָתְנַיִם ist „Hüften“ möglich, bezeichnet im heutigen Deutsch aber eher die seitlichen Hüftpartien als die Höhe des Wassers; „bis zur Hüfte“ trifft die gemeinte Körperhöhe idiomatischer.
