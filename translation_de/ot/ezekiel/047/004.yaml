  terminology: Die Fußnote zu „tausend“ ist sachgerecht und wahrt, dass „Ellen“ im hebräischen Vers nicht ausdrücklich steht. „Lenden“ bleibt als näher am hebräischen Ausdruck liegende lexikalische Alternative sinnvoll.
