  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִי אָ֕נִי וְ/דָרַשְׁתִּ֥י אֶת צֹאנִ֖/י וּ/בִקַּרְתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/011.yaml
  text: 'For thus says the Lord GOD: Behold[a], I myself will search for my sheep and seek them out.'
translation:
  language: de
  text: 'Denn so spricht der Herr Yahweh: Seht, ich selbst werde nach meinen Schafen suchen und mich um sie kümmern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihnen sehen“, „sie aufsuchen“ oder „sie prüfen“. Das hebräische Verb kann sowohl das Suchen als auch das persönliche Nachsehen und fürsorgliche Kümmern bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Wiedergabe bewahrt sowohl den Titel אֲדֹנָי („Herr“) als auch den Gottesnamen יהוה („Yahweh“), ohne die beiden Bestandteile zu einem einzigen Titel zu verschmelzen.
- source_word: הִנְנִי אָנִי
  choice: Seht, ich selbst
  rationale: „Seht“ gibt den aufmerksamkeitslenkenden prophetischen Ausdruck הִנְנִי wieder; „ich selbst“ bewahrt die nachdrückliche Selbstbeteiligung durch אָנִי.
- source_word: וְדָרַשְׁתִּי
  choice: werde nach … suchen
  rationale: Im Hirtenbild bezeichnet דרש das aktive Suchen nach den eigenen Schafen. Die deutsche Verbindung „nach meinen Schafen suchen“ ist natürlich und sachlich genau.
- source_word: צֹאנִי
  choice: meinen Schafen
  rationale: צֹאן bezeichnet Kleinvieh beziehungsweise eine Herde. „Schafe“ macht das konkrete Hirtenbild im Deutschen unmittelbar verständlich.
- source_word: וּבִקַּרְתִּים
  choice: und mich um sie kümmern
  rationale: בקר kann hier das persönliche Nachsehen, Aufsuchen, Prüfen oder fürsorgliche Sichkümmern bezeichnen. „Mich um sie kümmern“ wahrt die fürsorgliche Dimension und vermeidet eine bloße Wiederholung des vorangehenden Suchens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: „Der Herr Yahweh“ lässt den persönlichen Gottesnamen sichtbar und gibt zugleich den vorangestellten Herrentitel wieder. Die traditionelle Alternative ist geläufiger, ersetzt jedoch einen Bestandteil der hebräischen Doppelbezeichnung.
- issue: Art des göttlichen Handelns gegenüber den Schafen
  choice: mich um sie kümmern
  alternative: sie aufsuchen / nach ihnen sehen / sie prüfen
  rationale: Der Kontext beschreibt Gottes persönliches Eingreifen zugunsten seiner Herde. Die gewählte Formulierung bringt diese Fürsorge zum Ausdruck, während die Fußnote die echte Bedeutungsbreite des Verbs offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. „Seht“ wahrt den Aufmerksamkeitsruf, ohne das heute steife „Siehe“ zu verwenden; „ich selbst“ trägt den Nachdruck des hebräischen Ausdrucks.
