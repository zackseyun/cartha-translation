base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/003.yaml
  text: You eat the fat[a], you clothe yourselves with the wool, you slaughter the fattened sheep[b], but you do not shepherd the flock.
translation:
  language: de
  text: Ihr esst das Fett[a], ihr kleidet euch mit der Wolle, das gemästete Tier[b] schlachtet ihr; aber die Herde hütet ihr nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Milch“. Einige Übersetzungen folgen hier einer auslegenden Tradition oder einer Lesart alter Übersetzungen; das hebräische Wort bedeutet gewöhnlich „Fett“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das wohlgenährte Tier“ oder „das ausgesuchte Tier“. Das hebräische Wort bezeichnet wahrscheinlich ein gut genährtes Tier aus der Herde und kann hier einen generischen oder kollektiven Sinn haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: חֵלֶב bedeutet gewöhnlich „Fett“ oder „Fettstück“. Die konkrete Formulierung bewahrt das Bild der ausbeuterischen Nutzung; die kontextuell oder durch alte Übersetzungen gestützte Alternative „Milch“ wird in einer Fußnote genannt.
- source_word: הַצֶּמֶר
  choice: die Wolle
  rationale: צֶמֶר bezeichnet Wolle; dies ist im Deutschen die natürliche und genaue Wiedergabe.
- source_word: תִּלְבָּשׁוּ
  choice: ihr kleidet euch mit
  rationale: לבש bedeutet „anziehen, tragen, sich kleiden“. Die reflexive Formulierung gibt den Gedanken der eigenen Bereicherung klar wieder.
- source_word: הַבְּרִיאָה
  choice: die gemästeten Tiere
  rationale: Das substantivisch gebrauchte feminine Singularadjektiv von בריא bezeichnet hier wahrscheinlich die wohlgenährten oder ausgesuchten Tiere der Herde. Der deutsche Plural gibt den kollektiven Sinn im Kontext natürlich wieder.
- source_word: תִּזְבָּחוּ
  choice: ihr schlachtet
  rationale: זבח kann „opfern“ oder allgemein „schlachten“ bedeuten. Da hier die Ausbeutung der Herde und kein kultischer Vorgang im Mittelpunkt steht, ist „schlachten“ angemessen.
- source_word: הַצֹּאן
  choice: die Herde
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen, als Kollektiv. Im durchgehenden Hirtenbild ist „Herde“ idiomatisch und sachgerecht.
- source_word: תִרְעוּ
  choice: weidet ihr
  rationale: רעה umfasst „weiden, hüten, als Hirte versorgen“. „Die Herde weiden“ bewahrt im Deutschen das Hirtenbild und bezeichnet mehr als bloßes Füttern.
theological_decisions:
- issue: Metaphorische Hirtenaussage über Israels Verantwortliche
  choice: Das Hirtenbild bleibt mit „die Herde weiden“ ausdrücklich erhalten.
  alternative: die Herde versorgen / die Schafe füttern
  rationale: Das Kapitel lebt von der Gegenüberstellung zwischen den Hirten und der Herde. „Weiden“ wahrt diese literarische und theologische Bildsprache, ohne eine spätere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Anrede „ihr“ bildet den anklagenden Rhythmus des Hebräischen nach. Das abschließende Voranstellen von „die Herde“ setzt den entscheidenden Gegensatz idiomatisch hervor.
