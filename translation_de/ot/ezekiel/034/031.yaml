source:
  edition: WLC
  text: וְ/אַתֵּ֥ן צֹאנִ֛/י צֹ֥אן מַרְעִיתִ֖/י אָדָ֣ם אַתֶּ֑ם אֲנִי֙ אֱלֹ֣הֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/031.yaml
  text: And you[a], my flock, the flock of my pasture—you are men, and I am your God, declares the Lord GOD.
translation:
  language: de
  text: 'Und ihr, meine Herde, die Herde meiner Weide: Ihr seid Menschen,[a] und ich bin euer Gott, spricht GOTT, der Herr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Menschheit“ beziehungsweise „menschliche Wesen“. Das hebräische Wort adam kann die Menschheit allgemein bezeichnen; hier stellt es der bildlichen Bezeichnung als „Herde“ ihre tatsächliche menschliche Identität gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּן
  choice: Und ihr
  rationale: Die vorangestellte Anrede mit Konjunktion trägt einen kontrastiven Nachdruck; „Und ihr“ bewahrt ihn knapp, ohne die Diskursfunktion auszudeuten.
- source_word: צֹאנִי
  choice: meine Herde
  rationale: Das Kollektivum gibt die Hirtenmetaphorik im Deutschen natürlich wieder.
- source_word: צֹאן מַרְעִיתִי
  choice: die Herde meiner Weide
  rationale: Bewahrt die appositionelle Wiederholung und das Bild der Weide, statt die Formulierung zu verdichten.
- source_word: אָדָם
  choice: Menschen
  rationale: אָדָם bezeichnet hier die tatsächliche menschliche Identität der metaphorisch als Herde Angesprochenen. „Menschen“ ist im modernen Deutschen natürlich, umfassend und wahrt den knappen Gegensatz.
- source_word: אַתֶּם
  choice: ihr seid
  rationale: Ergänzt die im Hebräischen nicht ausgedrückte Kopula idiomatisch und erhält die betonte Anrede.
- source_word: אֲנִי אֱלֹהֵיכֶם
  choice: ich bin euer Gott
  rationale: Gibt die klare relationale beziehungsweise bundesbezogene Aussage unmittelbar wieder.
- source_word: נְאֻם
  choice: spricht
  rationale: „Spricht“ ist die geläufige, würdige deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die deutsche Konvention vermeidet „Herr HERR“ und kennzeichnet den Gottesnamen durch „GOTT“, während אֲדֹנָי als „der Herr“ wiedergegeben wird.
theological_decisions:
- issue: Wiedergabe von אָדָם im Rahmen der Hirtenmetapher
  choice: Menschen
  alternative: Menschheit; menschliche Wesen
  rationale: Der Satz löst die Bildrede nicht auf, sondern stellt der Bezeichnung als Herde die wirkliche menschliche Identität gegenüber. „Menschen“ wahrt diesen Gegensatz, ohne das Wort männlich zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionelle Wiederholung der Herden- und Weidebildsprache sowie die knappe Gegenüberstellung „ihr … ich“ bleiben erhalten.
