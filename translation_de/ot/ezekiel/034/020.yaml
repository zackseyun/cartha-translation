id: EZK.34.20
reference: Ezekiel 34:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה אֲלֵי/הֶ֑ם הִנְ/נִי אָ֕נִי וְ/שָֽׁפַטְתִּי֙ בֵּֽין שֶׂ֣ה בִרְיָ֔ה וּ/בֵ֥ין שֶׂ֖ה רָזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/020.yaml
  text: 'Therefore thus says the Lord GOD to them: Behold[a], I myself will judge between the fat sheep and the lean sheep.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh zu ihnen: Siehe, ich selbst werde zwischen einem fetten Schaf und einem mageren Schaf richten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen im Hebräischen Einzahlformen: »zwischen einem fetten Schaf und einem mageren Schaf«. Sie können jeweils stellvertretend für eine Gruppe innerhalb der Herde stehen.'
    reason: Die Einzahl kann konkret-individuell oder klassenvertretend verstanden werden; diese mögliche kollektive Bedeutung soll sichtbar bleiben.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerung aus der vorangehenden Anklage wird knapp und in natürlichem modernem Deutsch ausgedrückt.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Botenstil und die Aussageform des Hebräischen.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: 'Beide Bestandteile des hebräischen Gottesnamens werden sichtbar wiedergegeben: אֲדֹנָי als »Herr« und das Tetragramm als »Yahweh«.'
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: אֶל bezeichnet hier die Adressaten der göttlichen Rede; »zu ihnen« ist daher genauer als »gegen sie«.
- source_word: הִנְנִי אָנִי
  choice: Siehe, ich selbst
  rationale: »Siehe« bewahrt das aufmerksamkeitslenkende הִנֵּה, während »ich selbst« die ungewöhnlich starke Ich-Betonung wiedergibt.
- source_word: וְשָׁפַטְתִּי
  choice: werde … richten
  rationale: Das Verb bezeichnet hier Gottes richterliches Entscheiden und Unterscheiden zwischen den beiden Gruppen.
- source_word: בֵּין ... וּבֵין
  choice: zwischen … und …
  rationale: Die deutsche Paarform gibt die hebräische Gegenüberstellung idiomatisch wieder.
- source_word: שֶׂה בִרְיָה ... שֶׂה רָזָה
  choice: einem fetten Schaf … einem mageren Schaf
  rationale: Die grammatisch singularischen Ausdrücke bleiben im Haupttext erhalten; »fett« und »mager« bilden den konkreten Gegensatz im Herdenbild ab.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form wahrt sowohl den Titel אֲדֹנָי als auch den im Ausgangstext ausdrücklich stehenden Eigennamen, ohne beide zu einem bloßen Titel zusammenzuziehen.
- issue: Reichweite des göttlichen Richtens
  choice: zwischen einem fetten Schaf und einem mageren Schaf richten
  alternative: die fetten Schafe von den mageren Schafen scheiden
  rationale: Die Formulierung bewahrt die juristische und unterscheidende Spannung von שׁפט, ohne das Richten auf ein bloßes Trennen zu verengen oder sein Ergebnis vorwegzunehmen.
translation_notes:
  register: Feierlich-prophetischer, aber gegenwärtig verständlicher Standardstil. Die traditionelle Formel »so spricht« und das deiktische »Siehe« erhalten den Ton des Ausgangstextes; Satzbau und Wortwahl bleiben zugleich natürlich deutsch.
