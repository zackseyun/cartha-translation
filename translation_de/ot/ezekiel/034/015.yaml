source:
  edition: WLC
  text: אֲנִ֨י אֶרְעֶ֤ה צֹאנִ/י֙ וַ/אֲנִ֣י אַרְבִּיצֵ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
translation:
  language: de
  text: Ich selbst werde meine Herde weiden, und ich selbst werde sie lagern, spricht der Herr Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „der Herr Jahwe“; אֲדֹנָי ist der Titel „Herr“, יְהוִה der Gottesname Jahwe.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי / וַאֲנִי
  choice: Ich selbst / und ich selbst
  rationale: Das jeweils ausdrücklich gesetzte selbstständige Pronomen betont Gottes eigenes Handeln; die Wiederholung erhält zugleich den hebräischen Parallelismus.
- source_word: אֶרְעֶה
  choice: werde … weiden
  rationale: רעה bezeichnet hier die umfassende Tätigkeit eines Hirten. Das deutsche „weiden“ bewahrt das Hirtenbild und kann sowohl Führen und Hüten als auch Nahrunggeben einschließen.
- source_word: צֹאנִי
  choice: meine Herde
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh. „Meine Herde“ klingt im Deutschen natürlich und passt zum durchgehenden Hirtenbild.
- source_word: אַרְבִּיצֵם
  choice: werde sie lagern lassen
  rationale: Der Hifil von רבץ bedeutet, jemanden zum Niederliegen beziehungsweise Lagern zu bringen. „Lagern lassen“ gibt die sichere Ruhe unter der Obhut des Hirten natürlich wieder, ohne das Bild auf einen abstrakten Begriff zu reduzieren.
- source_word: נְאֻם
  choice: spricht
  rationale: „Spricht“ ist eine etablierte, würdige Wiedergabe der prophetischen Botenformel und kennzeichnet die Aussage als autoritatives Gotteswort.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: „Herr“ gibt אֲדֹנָי wieder, „Jahwe“ das Tetragramm. Das Komma macht deutlich, dass hier Titel und Eigenname nebeneinanderstehen, und vermeidet die unnatürliche Doppelung „Herr HERR“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Übersetzung bewahrt sowohl den Herrschaftstitel als auch den im Ausgangstext ausdrücklich stehenden Gottesnamen. Sie entscheidet die mögliche Funktion des Namens nicht konfessionell um, sondern macht die beiden hebräischen Bestandteile transparent.
- issue: Gottes persönliche Übernahme der Hirtenaufgabe
  choice: Die zweifache Betonung „ich selbst“ bleibt erhalten.
  alternative: Ich werde … und werde …
  rationale: Die Wiederholung ist sprachlich markiert und theologisch bedeutsam, weil Gottes eigenes Handeln den zuvor verurteilten Hirten gegenübergestellt wird; sie darf daher nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Herde“, „weiden“ und „lagern lassen“ halten das konkrete Hirtenbild zusammen. Die Wortstellung wahrt die emphatische Wiederholung des hebräischen „ich selbst“.
