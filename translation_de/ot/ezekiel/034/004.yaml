  variant: modern standard German
source:
  edition: WLC
  text: אֶֽת הַ/נַּחְלוֹת֩ לֹ֨א חִזַּקְתֶּ֜ם וְ/אֶת הַ/חוֹלָ֣ה לֹֽא רִפֵּאתֶ֗ם וְ/לַ/נִּשְׁבֶּ֨רֶת֙ לֹ֣א חֲבַשְׁתֶּ֔ם וְ/אֶת הַ/נִּדַּ֨חַת֙ לֹ֣א הֲשֵׁבֹתֶ֔ם וְ/אֶת הָ/אֹבֶ֖דֶת לֹ֣א בִקַּשְׁתֶּ֑ם וּ/בְ/חָזְקָ֛ה רְדִיתֶ֥ם אֹתָ֖/ם וּ/בְ/פָֽרֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/004.yaml
  text: You have not strengthened the weak[a], and you have not healed the sick, and you have not bound up the broken, and you have not brought back the strayed, and you have not sought the lost[c][b]; but with force and with harshness you have ruled them.
translation:
  language: de
  text: Die Schwachen[a] habt ihr nicht gestärkt, die Kranken nicht geheilt und die Verletzten nicht verbunden. Die Versprengten[b] habt ihr nicht zurückgebracht und die Verlorenen nicht gesucht. Vielmehr habt ihr mit Gewalt und Härte[c] über sie geherrscht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Entkräfteten“ beziehungsweise „die Erkrankten“. Das hebräische Wort kann Krankheit oder Schwäche bezeichnen; „die Schwachen“ unterscheidet es von den anschließend genannten Kranken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Weggetriebenen“. Das hebräische Wort kann hervorheben, dass sie vertrieben oder zerstreut wurden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Rücksichtslosigkeit“. Das hebräische Wort bezeichnet harte, niederdrückende Behandlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּחְלוֹת
  choice: die Schwachen
  rationale: Das Wort bezeichnet Erkrankte oder Entkräftete. „Die Schwachen“ passt zum Verb „stärken“ und unterscheidet diese Gruppe von den unmittelbar danach genannten Kranken.
- source_word: חִזַּקְתֶּם
  choice: habt ihr gestärkt
  rationale: Das Piel von חזק bedeutet „stärken“ oder „kräftigen“ und bildet einen prägnanten Gegensatz zu „die Schwachen“.
- source_word: הַחוֹלָה
  choice: die Kranken
  rationale: Die Form von חלה bezeichnet hier die kranken Tiere und wird gegenüber der allgemeineren Schwäche im ersten Satzglied klar abgegrenzt.
- source_word: רִפֵּאתֶם
  choice: geheilt
  rationale: רפא ist das gewöhnliche Verb für heilen; die Wiedergabe bewahrt sowohl den konkreten Hirtenbezug als auch die übertragene Bedeutung.
- source_word: לַנִּשְׁבֶּרֶת
  choice: die Verletzten
  rationale: Wörtlich ist von dem „Gebrochenen“ die Rede. Im Zusammenhang mit Schafen und dem Verb „verbinden“ gibt „die Verletzten“ den gemeinten körperlichen Zustand in natürlichem Deutsch wieder.
- source_word: חֲבַשְׁתֶּם
  choice: verbunden
  rationale: חבש bezeichnet hier das Verbinden einer Wunde oder Verletzung.
- source_word: הַנִּדַּחַת
  choice: die Versprengten
  rationale: נדח kann das Wegtreiben, Verstoßen oder Zerstreuen hervorheben. „Versprengte“ bewahrt sowohl das Ergebnis der Zerstreuung als auch den Hirtenkontext.
- source_word: הֲשֵׁבֹתֶם
  choice: zurückgebracht
  rationale: Der Hifil von שוב bedeutet „zurückbringen“ beziehungsweise „zurückkehren lassen“.
- source_word: הָאֹבֶדֶת
  choice: die Verlorenen
  rationale: אבד bezeichnet im Hirtenbild die verlorenen Tiere; „die Verlorenen“ ist knapp, natürlich und intertextuell anschlussfähig.
- source_word: בִקַּשְׁתֶּם
  choice: gesucht
  rationale: בקש bedeutet „suchen“; die knappe Wiedergabe entspricht der parallelen Satzfolge.
- source_word: וּבְחָזְקָה
  choice: mit Gewalt
  rationale: Die Präpositionalphrase beschreibt eine gewaltsame oder zwingende Ausübung von Macht. „Mit Gewalt“ bringt den oppressiven Sinn deutlich zum Ausdruck.
- source_word: רְדִיתֶם
  choice: habt ihr über sie geherrscht
  rationale: רדה bedeutet „herrschen, Gewalt ausüben“. Das neutrale Grundverb lässt die beiden folgenden Artangaben den verurteilenden Ton tragen.
- source_word: וּבְפָרֶךְ
  choice: und Härte
  rationale: פֶרֶךְ bezeichnet rücksichtslose, niederdrückende Strenge. „Härte“ bewahrt die knappe Parallelstruktur und vermeidet eine unnötige Ausdeutung.
theological_decisions:
- issue: Hirtenmetaphorik und menschliche Referenz
  choice: Die Gruppen werden in natürlichem Deutsch als „Schwache“, „Kranke“, „Verletzte“, „Versprengte“ und „Verlorene“ bezeichnet, während die Handlungen die Hirtenmetaphorik erkennbar halten.
  alternative: Durchgehend von einzelnen weiblichen Schafen oder ausschließlich von politisch unterdrückten Menschen sprechen.
  rationale: Der Vers richtet sich durch ein fortlaufendes Hirtenbild gegen Israels Verantwortliche. Die Fassung darf weder das Bild in rein politische Sprache auflösen noch durch umständliche Tierbezeichnungen seine übertragene Stoßrichtung verdecken.
- issue: Oppressiver Charakter des letzten Satzes
  choice: Die Verurteilung liegt in den beiden Bestimmungen „mit Gewalt und Härte“, während רדה mit „über sie geherrscht“ wiedergegeben wird.
  alternative: Das Verb selbst verstärkend als „brutal unterjocht“ wiedergeben.
  rationale: Im Hebräischen tragen vor allem die beiden Präpositionalphrasen den negativen Nachdruck. Die gewählte Struktur bewahrt diese Gewichtung und die theologische Anklage ungerechter Herrschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer paralleler Satzführung. Die Wiederholung des Hilfsverbs wird maßvoll reduziert, ohne die Anklagestruktur zu verwischen. Der Wechsel zu „Vielmehr“ macht den hebräischen Kontrast idiomatisch deutlich. Alle Fußnotenmarker stehen unmittelbar bei dem erläuterten Ausdruck.
