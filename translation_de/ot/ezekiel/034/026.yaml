  text: וְ/נָתַתִּ֥י אוֹתָ֛/ם וּ/סְבִיב֥וֹת גִּבְעָתִ֖/י בְּרָכָ֑ה וְ/הוֹרַדְתִּ֤י הַ/גֶּ֨שֶׁם֙ בְּ/עִתּ֔/וֹ גִּשְׁמֵ֥י בְרָכָ֖ה יִֽהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/026.yaml
  text: And I will make them and the places around my hill a blessing[a], and I will send down the rain in its season; they will be showers of blessing.
translation:
  language: de
  text: Ich werde sie und die Umgebung meines Hügels[a] zum Segen machen. Ich werde den Regen zu seiner Zeit herabkommen lassen; es werden Regenschauer des Segens sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie und die Umgebungen meines Hügels“. „Mein Hügel“ bezieht sich wahrscheinlich auf Gottes heiligen Hügel, oft als Zion verstanden; der Vers nennt ihn jedoch nicht ausdrücklich.'
    reason: Erläutert die räumliche Formulierung und einen wahrscheinlichen Bezug, ohne den Hügel mit seinem umliegenden Gebiet gleichzusetzen oder die Deutung im Haupttext festzulegen.
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ich werde … zum Segen machen
  rationale: נתן kann „geben“, „setzen“ oder resultativ „machen“ bedeuten. Mit dem Prädikatsnomen בְּרָכָה gibt „zum Segen machen“ den Sinn im Deutschen klar und natürlich wieder.
- source_word: אוֹתָם וּסְבִיבוֹת גִּבְעָתִי
  choice: sie und die Umgebung meines Hügels
  rationale: סְבִיבוֹת bezeichnet das umliegende Gebiet. „Umgebung“ wahrt den räumlichen Bezug, während „mein Hügel“ ohne weitergehende Identifizierung wörtlich erhalten bleibt.
- source_word: בְּרָכָה
  choice: zum Segen
  rationale: Der artikellose Singular steht prädikativ und wird durch die feste deutsche Wendung „zum Segen machen“ angemessen wiedergegeben.
- source_word: וְהוֹרַדְתִּי
  choice: Ich werde … herabkommen lassen
  rationale: Die Hifil-Form von ירד drückt Verursachung aus. Die Formulierung bewahrt sowohl die Abwärtsbewegung als auch Gottes Wirken.
- source_word: הַגֶּשֶׁם בְּעִתּוֹ
  choice: den Regen zu seiner Zeit
  rationale: Die Wendung bezeichnet den Regen zu der für ihn passenden beziehungsweise bestimmten Zeit; die knappe Form wahrt diese Bedeutung und die personensuffixartige Rückbindung.
- source_word: גִּשְׁמֵי בְרָכָה
  choice: Regengüsse des Segens
  rationale: Der Plural wird als kräftige beziehungsweise wiederholte Regengüsse wiedergegeben; die Genitivverbindung erhält בְּרָכָה ausdrücklich als „Segen“, statt sie lediglich mit „reichlich“ zu umschreiben.
- source_word: יִהְיוּ
  choice: es werden … sein
  rationale: Die deutsche Existenzkonstruktion gibt die Aussage natürlich wieder, ohne den Plural der folgenden Regengüsse zu verdecken.
theological_decisions:
- issue: Bezug von „mein Hügel“
  choice: Die Formulierung „mein Hügel“ bleibt im Haupttext unbestimmt.
  alternative: Den Hügel ausdrücklich mit Zion, Jerusalem oder dem Ort des Heiligtums gleichsetzen.
  rationale: Der hebräische Text nennt nur „meinen Hügel“. Der Zusammenhang kann Gottes heiligen Hügel, häufig Zion, nahelegen, doch eine ausdrückliche Festlegung würde mehr sagen als dieser Vers selbst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zum Segen machen“ ist idiomatisch und zugleich quellennah; „Regengüsse des Segens“ bewahrt die wiederholte Segenssprache und vermeidet eine konfessionell geprägte Ausdeutung.
