source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֣י/ם מִן הָ/עַמִּ֗ים וְ/קִבַּצְתִּי/ם֙ מִן הָ֣/אֲרָצ֔וֹת וַ/הֲבִיאֹתִ֖י/ם אֶל אַדְמָתָ֑/ם וּ/רְעִיתִי/ם֙ אֶל הָרֵ֣י יִשְׂרָאֵ֔ל בָּ/אֲפִיקִ֕ים וּ/בְ/כֹ֖ל מוֹשְׁבֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/013.yaml
  text: And I will bring them out from the peoples[a], and gather them from the lands, and bring them into their own land; and I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land.
translation:
  language: de
  text: Ich werde sie aus den Völkern herausführen, sie aus den Ländern sammeln und sie in ihr eigenes Land bringen. Ich werde sie auf den Bergen Israels weiden, an den Wasserläufen[a] und in allen bewohnten Gebieten des Landes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Bachbetten“, „in den Schluchten“ oder „in den Rinnen“. Das hebräische Wort kann Wasserläufe, Bachbetten oder schluchtartige Geländeformen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִים
  choice: Ich werde sie … herausführen
  rationale: Die Hifil-Form von יצא bezeichnet das Veranlassen des Herausgehens. „Herausführen“ ist im Deutschen natürlich und bewahrt den möglichen Anklang an den Exodus.
- source_word: מִן הָעַמִּים
  choice: aus den Völkern
  rationale: Der Plural עַמִּים bezeichnet Völker beziehungsweise Nationen; „Völker“ wahrt den ethnischen Sinn und unterscheidet sich von den anschließend genannten Ländern.
- source_word: וְקִבַּצְתִּים מִן הָאֲרָצוֹת
  choice: sie aus den Ländern sammeln
  rationale: קבץ ist das übliche Verb für das Sammeln Zerstreuter. אֲרָצוֹת meint hier die verschiedenen Länder oder Gebiete, aus denen Israel gesammelt wird.
- source_word: וַהֲבִיאֹתִים אֶל אַדְמָתָם
  choice: sie in ihr eigenes Land bringen
  rationale: Die Hifil-Form von בוא bedeutet „hineinbringen“. אַדְמָתָם kann „ihr Boden“ oder „ihr Land“ bedeuten; im Zusammenhang der Rückführung ist „ihr eigenes Land“ idiomatisch und gibt das Possessivsuffix deutlich wieder.
- source_word: וּרְעִיתִים
  choice: Ich werde sie … weiden
  rationale: רעה kann „weiden“, „ernähren“ oder „als Hirte führen“ bedeuten. Die folgenden Ortsangaben stützen hier das konkrete Bild des Weidens.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: auf den Bergen Israels
  rationale: Nach רעה bezeichnet אֶל hier den Bereich, in dem die Herde geweidet wird; „auf“ entspricht natürlichem deutschen Sprachgebrauch.
- source_word: בָּאֲפִיקִים
  choice: an den Wasserläufen
  rationale: אֲפִיקִים kann Wasserläufe, Bachbetten, Rinnen oder Schluchten bezeichnen. „Wasserläufe“ passt zum Weidebild, ohne den Ausdruck auf ständig fließende Bäche festzulegen; die topografische Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: וּבְכֹל מוֹשְׁבֵי הָאָרֶץ
  choice: in allen bewohnten Gebieten des Landes
  rationale: מוֹשְׁבֵי הָאָרֶץ bezeichnet die Wohnorte beziehungsweise bewohnten Bereiche des Landes. „Bewohnte Gebiete“ ist modern, verständlich und weniger eng als „Siedlungen“.
theological_decisions:
- issue: Wiederherstellung und die Possessivform in אַדְמָתָם
  choice: ihr eigenes Land
  alternative: ihr Land
  rationale: Das Possessivsuffix bezeichnet das Land als ihnen zugehörig. „Ihr eigenes Land“ hebt die im Vers ausgesagte Rückkehr in ihre Heimat hervor, ohne darüber hinausgehende spätere Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten göttlichen Handlungen bleiben ausdrücklich formuliert; das Hirten- und Weidebild wird beibehalten. Der Fußnotenmarker steht beim tatsächlich mehrdeutigen Ausdruck בָּאֲפִיקִים.
