base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/023.yaml
  text: And I will raise up over them one shepherd[a], my servant David, and he will shepherd them; he himself will shepherd them[c][b], and he himself will be their shepherd.
translation:
  language: de
  text: Und ich werde über sie einen einzigen Hirten einsetzen[a], meinen Diener David[b]. Er wird sie weiden; er selbst wird sie weiden[c], und er selbst wird ihr Hirte sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: über ihnen einen einzigen Hirten aufrichten.'
    reason: lexical_alternative
  - marker: b
    text: „David“ kann David als idealisierte Königsfigur bezeichnen oder weiter gefasst auf einen künftigen davidischen Herrscher weisen.
    reason: alternative_reading
  - marker: c
    text: Das hebräische Verb für die Tätigkeit eines Hirten wird wiederholt; es kann auch „hüten“ oder „versorgen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ich werde … einsetzen
  rationale: Das Hifil von קום kann hier „aufrichten“, „erwecken“, „bestellen“ oder „einsetzen“ bedeuten. „Einsetzen“ gibt die göttliche Bestellung eines Hirten in natürlichem Deutsch wieder, ohne eine Auferstehung oder förmliche Thronbesteigung festzulegen.
- source_word: עֲלֵיהֶם
  choice: über sie
  rationale: Die Präposition עַל bezeichnet hier die Stellung des Hirten über dem Volk und bewahrt damit neben der Fürsorge auch den Leitungsaspekt des Bildes.
- source_word: רֹעֶה אֶחָד
  choice: einen einzigen Hirten
  rationale: „Einen einzigen“ macht die durch אֶחָד betonte Einzahl im Deutschen klar und stellt sie dem vorausgehenden Versagen vieler Hirten gegenüber.
- source_word: רעה / יִרְעֶה
  choice: weiden
  rationale: Das Verb umfasst das Hüten, Versorgen und Führen einer Herde. „Weiden“ erhält das Hirtenbild und lässt die auffällige Wiederholung des hebräischen Verbs erkennen.
- source_word: אֵת עַבְדִּי דָוִד
  choice: meinen Diener David
  rationale: Die Wendung identifiziert den einen Hirten. „Mein Diener David“ erhält sowohl den Eigennamen als auch den für das Bundes- und Königtum bedeutsamen Titel.
- source_word: הוּא
  choice: er selbst
  rationale: Das selbstständige Personalpronomen trägt Nachdruck. „Er selbst“ bildet diesen Nachdruck in den beiden parallelen Aussagen ab, obwohl die Wiederholung im Deutschen markant klingt.
- source_word: יִהְיֶה לָהֶן לְרֹעֶה
  choice: wird ihr Hirte sein
  rationale: Die hebräische Rollen- und Beziehungsformel wird so idiomatisch wiedergegeben; „ihr Hirte“ bewahrt die persönliche Zuordnung.
theological_decisions:
- issue: Identität Davids im prophetischen Zusammenhang
  choice: Der Name „David“ bleibt im Haupttext unverändert und wird nicht deutend erweitert.
  alternative: Ein künftiger davidischer Herrscher oder der Messias
  rationale: Der hebräische Text nennt ausdrücklich „David“. Ob damit David als idealisierte Königsfigur oder ein künftiger Herrscher aus seiner Linie gemeint ist, wird nicht durch eine interpretierende Übersetzung entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Diener“ ist heute allgemein verständlicher als „Knecht“. Die bewusste Wiederholung von „weiden“ und „er selbst“ folgt der nachdrücklichen Struktur des Hebräischen; die Satzteilung verhindert dabei einen überladenen deutschen Satz.
