lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Anklage und klingt im modernen Deutschen natürlich und würdig.
- source_word: רֹעִים
  choice: Hirten
  rationale: Bewahrt das im ganzen Kapitel zentrale Hirtenbild für die führenden Männer Israels, statt es deutend mit »Leiter« oder kirchlich mit »Pastoren« wiederzugeben.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Imperativ Plural wahrt den feierlichen prophetischen Aufruf und die biblische Sprachprägung von שׁמע.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker besitzt im Deutschen keine eigenständige Entsprechung.
- source_word: דְּבַר
  choice: das Wort
  rationale: Die Konstruktverbindung wird mit der geläufigen prophetischen Formel »das Wort Jahwes« transparent und registergerecht wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift des Gottesnamens gibt das Tetragramm als Eigennamen wieder, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält unmittelbar das Tetragramm. »Jahwe« bewahrt im modernen Deutschen den persönlichen Gottesnamen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »ihr Hirten« verdeutlicht den Vokativ natürlich. Der Doppelpunkt wahrt die Funktion des Verses als Einleitung zum folgenden Gotteswort.
