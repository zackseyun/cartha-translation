base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/007.yaml
  text: 'Therefore[a], shepherds, hear the word of Yahweh:'
translation:
  language: de
  text: 'Darum, ihr Hirten, hört das Wort Jahwes[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
