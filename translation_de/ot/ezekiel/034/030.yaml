id: EZK.34.30
reference: Ezekiel 34:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֧י יְהוָ֛ה אֱלֹהֵי/הֶ֖ם אִתָּ֑/ם וְ/הֵ֗מָּה עַמִּ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/030.yaml
  text: And they will know that I[a], Yahweh their God, am with them, and that they, the house of Israel, are my people, declares the Lord GOD.
translation:
  language: de
  text: Und sie werden erkennen, dass ich, Jahwe, ihr Gott, mit ihnen[a] bin und dass sie, das Haus Israel, mein Volk sind, spricht der Herr Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in ihrer Mitte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und sie werden erkennen
  rationale: Das Qal Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang zukünftige beziehungsweise resultative Bedeutung. „Erkennen“ gibt ידע in der feierlichen Erkenntnisformel angemessen wieder.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was Israel erkennen wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: אֱלֹהֵיהֶם
  choice: ihr Gott
  rationale: Die deutsche Possessivkonstruktion entspricht natürlich und genau dem hebräischen Nomen mit Pronominalsuffix.
- source_word: אִתָּם
  choice: mit ihnen
  rationale: Dies bildet die Grundbedeutung der Präposition direkt ab und bewahrt die Sprache der göttlichen Bundesgegenwart; „in ihrer Mitte“ bleibt kontextuell möglich.
- source_word: וְהֵמָּה
  choice: und dass sie
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten; das zweite „dass“ macht im Deutschen die parallelen Inhaltsaussagen klar.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die feste Bundesformel wird direkt und idiomatisch wiedergegeben.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die prophetische Kollektivbezeichnung bleibt erhalten und wird nicht zu „Volk Israel“ oder bloß „Israel“ verflacht.
- source_word: נְאֻם
  choice: spricht
  rationale: In der prophetischen Botenformel ist „spricht“ im Deutschen feierlich, verständlich und idiomatisch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: 'Beide Bestandteile des hebräischen Ausdrucks bleiben sichtbar: אֲדֹנָי als Titel „Herr“ und יְהוָה als Eigenname „Jahwe“.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Bundesnamen. Die Transliteration bewahrt den Eigennamecharakter, ohne ihn durch einen Titel zu ersetzen.
- issue: Bundesgegenwart in אִתָּם
  choice: mit ihnen
  alternative: in ihrer Mitte
  rationale: „Mit ihnen“ folgt der Grundbedeutung eng und erhält die Verbindung mit der Bundesformel „sie sind mein Volk“. Die räumlich akzentuierte Alternative wird in der Fußnote bewahrt.
- issue: Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form gibt Titel und Gottesnamen getrennt wieder und vermeidet, den zweiten Bestandteil in einen weiteren Titel umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener prophetischer Formel und Bundesterminologie. Die Satzstruktur bleibt nahe am hebräischen Parallelismus, ohne unnatürlich zu wirken.
