source:
  edition: WLC
  text: וְ/אַתֵּ֣נָה צֹאנִ֔/י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י שֹׁפֵט֙ בֵּֽין שֶׂ֣ה לָ/שֶׂ֔ה לָ/אֵילִ֖ים וְ/לָ/עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/017.yaml
  text: 'And as for you[a], my flock, thus says the Lord GOD: Behold, I am judging between sheep and sheep, between the rams and the male goats.'
translation:
  language: de
  text: 'Ihr aber, meine Herde – so spricht der Herr Yahweh: Siehe, ich richte zwischen Schaf und Schaf[a], zwischen den Widdern und den Ziegenböcken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen Schaf und Schaf“; gemeint ist die Unterscheidung zwischen den einzelnen Tieren innerhalb der Herde.'
    reason: Die knappe hebräische distributive Wendung kann im Deutschen erläuterungsbedürftig sein.
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: Ihr aber
  rationale: Das vorangestellte selbstständige Pronomen markiert die Hinwendung zur Herde; „aber“ gibt den Fokuswechsel im Deutschen knapp und natürlich wieder.
- source_word: צֹאנִי
  choice: meine Herde
  rationale: Das kollektive Singularnomen bezeichnet im Hirtenbild die Herde als Ganze und trägt das Suffix der ersten Person Singular.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Die feste prophetische Botenformel wird in ihrer knappen und würdevollen deutschen Entsprechung wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „Yahweh“ den im hebräischen Text ausdrücklich stehenden Gottesnamen erkennbar erhält.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Die Wendung hebt das entschlossene persönliche Eingreifen des Sprechers hervor; „Siehe“ bewahrt den feierlichen prophetischen Nachdruck.
- source_word: שֹׁפֵט
  choice: ich richte
  rationale: Das Partizip stellt Gottes gegenwärtig einsetzendes beziehungsweise unmittelbar bevorstehendes Richten dar; das deutsche Präsens lässt diese zeitliche Offenheit bestehen.
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: zwischen Schaf und Schaf
  rationale: Die formnahe Wiedergabe bewahrt die knappe distributive Ausdrucksweise des Hebräischen und bezeichnet die Unterscheidung innerhalb der Herde.
- source_word: לָאֵילִים
  choice: zwischen den Widdern
  rationale: אֵילִים bezeichnet wörtlich Widder; das aktive Tierbild und mögliche Kraftassoziationen bleiben so erhalten.
- source_word: וְלָעַתּוּדִים
  choice: und den Ziegenböcken
  rationale: עַתּוּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ ist im heutigen Deutsch präzise und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יְהוִה und lässt den im Ausgangstext ausdrücklich verwendeten Gottesnamen sichtbar, ohne die Verbindung beider Bezeichnungen aufzulösen.
- issue: Gegenstand des göttlichen Gerichts
  choice: zwischen Schaf und Schaf
  alternative: zwischen einem Schaf und dem anderen
  rationale: Die formnahe Wendung lässt die Aussage zugleich auf einzelne Tiere innerhalb der Herde und auf die anschließend genannten Gruppen bezogen erscheinen, ohne die Bildrede vorschnell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und Tierbildsprache. Der Gedankenstrich markiert die hervorgehobene Anrede, ohne die Satzstruktur unnötig zu verkomplizieren.
