  text: לָ/כֵן֙ הָֽ/רֹעִ֔ים שִׁמְע֖וּ דְּבַר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/009.yaml
  text: 'Therefore, shepherds, hear the word of Yahweh:'
translation:
  language: de
  text: 'Darum, ihr Hirten, hört das Wort Jahwes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet die Folgerung aus der vorausgehenden Anklage ein und klingt im modernen Deutschen natürlich und bestimmt.
- source_word: הָרֹעִים
  choice: ihr Hirten
  rationale: Bewahrt das für das ganze Kapitel zentrale Hirtenbild; das ergänzte „ihr“ kennzeichnet die direkte Anrede im natürlichen Deutschen.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Gibt den Imperativ Plural wieder und bewahrt den feierlichen prophetischen Aufruf.
- source_word: דְּבַר
  choice: das Wort
  rationale: Entspricht der festen prophetischen Wendung und bewahrt deren sprachliches und theologisches Gewicht.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Gibt den Gottesnamen als Eigennamen wieder; der deutsche Genitiv fügt sich natürlich in „das Wort Jahwes“ ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von הָרֹעִים
  choice: Hirten
  alternative: Führer
  rationale: Das durchgehende Hirtenbild von Hesekiel 34 ist rhetorisch und theologisch wesentlich und sollte im Haupttext nicht durch eine auslegende Bezeichnung ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Anrede und der Doppelpunkt als Übergang zur folgenden Gottesrede bleiben erhalten.
