  text: כְּ/בַקָּרַת֩ רֹעֶ֨ה עֶדְר֜/וֹ בְּ/יוֹם הֱיוֹת֤/וֹ בְ/תוֹךְ צֹאנ/וֹ֙ נִפְרָשׁ֔וֹת כֵּ֖ן אֲבַקֵּ֣ר אֶת צֹאנִ֑/י וְ/הִצַּלְתִּ֣י אֶתְ/הֶ֗ם מִ/כָּל הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נָפֹ֣צוּ שָׁ֔ם בְּ/י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/012.yaml
  text: As a shepherd seeks out his flock on the day he is among his sheep when they have been scattered[a], so I will seek out my sheep[b], and I will rescue them from all the places where they were scattered on a day of clouds and thick darkness.
translation:
  language: de
  text: Wie ein Hirte seine Herde aufsucht[a], wenn er mitten unter seinen verstreuten Schafen ist, so werde ich meine Schafe aufsuchen und sie aus all den Orten retten, wo sie an einem Tag[b] von Wolken und dichter Finsternis zerstreut worden waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach seiner Herde sieht“ beziehungsweise „sich um seine Herde kümmert“; das hebräische Wort umfasst sowohl das Aufsuchen als auch die aufmerksame Fürsorge.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an dem Tag von Wolken und dichter Finsternis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבַקָּרַת … כֵּן אֲבַקֵּר
  choice: Wie … aufsucht, … so werde ich … aufsuchen
  rationale: Die Wiederholung der Wurzel בקר wird im Deutschen durch dasselbe Verb wiedergegeben. „Aufsuchen“ passt zum Sammeln der zerstreuten Schafe; die ebenfalls vorhandene Bedeutung aufmerksamer Fürsorge wird in einer Fußnote offengehalten.
- source_word: רֹעֶה עֶדְרוֹ
  choice: ein Hirte seine Herde
  rationale: Die übliche Hirtenmetaphorik wird direkt und idiomatisch wiedergegeben; עדר bezeichnet hier im Zusammenhang mit צאן die Herde.
- source_word: בְּיוֹם הֱיוֹתוֹ בְתוֹךְ צֹאנוֹ נִפְרָשׁוֹת
  choice: wenn er mitten unter seinen verstreuten Schafen ist
  rationale: Die temporale Konstruktion wird natürlich ins Deutsche übertragen. „Verstreut“ beschreibt den Zustand der Schafe, während die Gegenwart des Hirten in ihrer Mitte erhalten bleibt.
- source_word: צֹאנִי
  choice: meine Schafe
  rationale: Die konkrete Bildsprache der kleinen Herdentiere wird bewahrt und nicht zum abstrakteren „Volk“ ausgelegt.
- source_word: וְהִצַּלְתִּי אֶתְהֶם
  choice: und sie … retten
  rationale: Das Hifil von נצל bezeichnet das Herausreißen beziehungsweise Retten aus einer Notlage; „retten“ ist klar und kontextgerecht.
- source_word: מִכָּל הַמְּקוֹמֹת אֲשֶׁר נָפֹצוּ שָׁם
  choice: aus all den Orten, an die sie … zerstreut worden sind
  rationale: Die Zielrichtung des Zerstreuens wird im Deutschen mit „an die“ natürlich ausgedrückt; zugleich bleibt der Bezug auf sämtliche Orte erhalten.
- source_word: בְּיוֹם עָנָן וַעֲרָפֶל
  choice: an einem Tag voller Wolken und dichten Dunkels
  rationale: עֲרָפֶל bezeichnet schwere, dichte Dunkelheit. Die Formulierung erhält das gewichtige, bedrohliche Bild und bezieht die Zeitangabe syntaktisch auf die Zerstreuung.
theological_decisions:
- issue: Göttliche Hirtenmetaphorik
  choice: Gott wird unmittelbar als derjenige dargestellt, der seine Schafe persönlich aufsucht und rettet.
  alternative: Eine ausdrücklich messianische oder christologische Ausdeutung in den Wortlaut aufzunehmen.
  rationale: Der hebräische Vers entfaltet zunächst JHWHs eigenes Handeln im Bild des Hirten. Weiterführende kanonische Bezüge bleiben der Auslegung überlassen.
- issue: Zeitlicher Bezug des Tages von Wolken und Dunkel
  choice: Die Zeitangabe wird auf die Zerstreuung bezogen.
  alternative: Die Zeitangabe auf Gottes zukünftiges Retten zu beziehen.
  rationale: Ihre Stellung unmittelbar nach „wohin sie dort zerstreut wurden“ legt nahe, dass sie den Tag der Zerstreuung näher bestimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „aufsucht … aufsuchen“ bildet die bewusste hebräische Wurzelwiederholung ab. Die Satzstruktur bleibt trotz der langen Vergleichskonstruktion gut verständlich.
