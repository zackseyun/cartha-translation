id: EZK.34.24
reference: Ezekiel 34:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֣י יְהוָ֗ה אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/עַבְדִּ֥/י דָוִ֖ד נָשִׂ֣יא בְ/תוֹכָ֑/ם אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/024.yaml
  text: And I[a], Yahweh, will be their God, and my servant David will be prince among them. I, Yahweh, have spoken.
translation:
  language: de
  text: Und ich, Jahwe, werde ihr Gott sein, und mein Diener David[a] wird Fürst unter ihnen sein. Ich, Jahwe, habe gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mein Diener David“ kann typologisch oder prophetisch auf den kommenden davidischen Herrscher, also den Messias, hinweisen; im hebräischen Text steht jedoch „David“.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: werde ihr Gott sein
  rationale: Die idiomatische deutsche Form gibt die zukünftige Bundesbeziehung natürlich wieder und bewahrt zugleich die verbale Aussage des Hebräischen.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Im königlich-davidischen und prophetischen Zusammenhang ist „Diener“ die angemessene ehrende Bezeichnung für den, der Gott loyal dient; „Sklave“ wäre hier irreführend eng.
- source_word: דָוִד
  choice: David
  rationale: Der hebräische Eigenname wird ohne deutende Erweiterung beibehalten.
- source_word: נָשִׂיא
  choice: Fürst
  rationale: „Fürst“ bewahrt die in Hesekiel charakteristische Bezeichnung und legt die Funktion nicht vorschnell auf „König“ oder den allgemeineren „Anführer“ fest.
- source_word: בְתוֹכָם
  choice: unter ihnen
  rationale: Dies ist eine natürliche moderne deutsche Wiedergabe der Ortsangabe „in ihrer Mitte“ und bewahrt den gemeinschaftlichen Bezug.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Das Perfekt gehört hier zur feierlichen göttlichen Bekräftigungsformel; „habe gesprochen“ wahrt deren Gewicht.
theological_decisions:
- issue: Identität Davids in „mein Diener David“
  choice: „David“ bleibt im Haupttext ohne interpretierende Erweiterung stehen.
  alternative: Gemeint sein könnten der auferstandene historische David, ein davidischer Herrscher oder prophetisch der Messias als größerer Sohn Davids.
  rationale: Der hebräische Text nennt ausdrücklich „David“. Die Übersetzung sollte die anerkannte messianische Tragweite nicht ausschließen, die Identitätsfrage aber auch nicht im Haupttext entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Wiederholung „Ich, Jahwe“ und die prophetische Schlussformel bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei „David“, da sich die Anmerkung auf diesen Namen bezieht.
