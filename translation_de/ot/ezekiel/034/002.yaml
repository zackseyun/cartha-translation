source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵ֖א עַל רוֹעֵ֣י יִשְׂרָאֵ֑ל הִנָּבֵ֣א וְ/אָמַרְתָּ֩ אֲלֵי/הֶ֨ם לָ/רֹעִ֜ים כֹּ֥ה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה ה֤וֹי רֹעֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֤ר הָיוּ֙ רֹעִ֣ים אוֹתָ֔/ם הֲ/ל֣וֹא הַ/צֹּ֔אן יִרְע֖וּ הָ/רֹעִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/002.yaml
  text: 'Son of man[a], prophesy against the shepherds of Israel; prophesy and say to them, to the shepherds[b], ‘Thus says the Lord GOD: Woe to the shepherds of Israel who have been shepherding themselves! Should not the shepherds shepherd the flock?’'
translation:
  language: de
  text: 'Menschensohn, weissage gegen die Hirten Israels! Weissage und sprich zu ihnen, zu den Hirten: »So spricht der Herr Yahweh: Wehe den Hirten Israels, die sich selbst weiden[a]! Sollten die Hirten nicht die Schafe[b] weiden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die sich selbst ernähren«. Im Hebräischen steht hier dasselbe Verb wie beim Weiden der Schafe im weiteren Vers. Gemeint ist, dass Israels Hirten für sich selbst sorgen statt für die Herde.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet kollektiv die Schafe beziehungsweise die Herde.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel wiederkehrende hebräische Anredeformel wird idiomatisch und traditionsnah wiedergegeben, ohne sie als bloß allgemeines »Mensch« aufzulösen.
- source_word: הִנָּבֵא ... הִנָּבֵא
  choice: weissage ... Weissage
  rationale: Die Wiederholung des hebräischen Imperativs bleibt als nachdrückliche Wiederaufnahme des Auftrags erhalten.
- source_word: עַל
  choice: gegen
  rationale: Der folgende Weheruf zeigt, dass die Botschaft als Gerichtswort gegen die Hirten gerichtet ist, nicht nur von ihnen handelt.
- source_word: רוֹעֵי יִשְׂרָאֵל / לָרֹעִים / הָרֹעִים
  choice: die Hirten Israels / die Hirten / die Hirten
  rationale: Das Hirtenbild wird nicht vorzeitig als »Führer« oder »Leiter« gedeutet, weil der Vers selbst es mit den Schafen und dem Verb »weiden« entfaltet.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahweh
  rationale: אֲדֹנָי wird als Titel »der Herr« und der Gottesname יהוה als »Yahweh« wiedergegeben; so bleiben beide Bestandteile der Formel erkennbar.
- source_word: הוֹי
  choice: Wehe
  rationale: »Wehe« bewahrt die Kraft der prophetischen Anklage und Gerichtsankündigung.
- source_word: אֲשֶׁר הָיוּ רֹעִים אוֹתָם
  choice: die sich selbst weiden
  rationale: Die reflexive Aussage und die Wiederholung des Hirtenverbs bleiben erhalten. Gemeint ist selbstsüchtige Fürsorge für die eigene Person statt für die Herde.
- source_word: הֲלוֹא
  choice: Sollten ... nicht
  rationale: Die Form gibt die rhetorische Frage wieder, die eine bejahende Antwort voraussetzt und zugleich als Vorwurf wirkt.
- source_word: הַצֹּאן
  choice: die Schafe
  rationale: Die konkrete Grundbedeutung wird im Haupttext erhalten; die kollektive Bedeutung »die Herde« wird in einer Fußnote genannt.
- source_word: יִרְעוּ
  choice: weiden
  rationale: »Weiden« kann im Deutschen sowohl das Versorgen der Tiere als auch, im Kontext, die umfassendere Hirtentätigkeit ausdrücken und bewahrt die Wortwiederholung.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Herrentitel vom offenbarten Gottesnamen und macht beide Elemente des hebräischen Ausdrucks sichtbar.
- issue: Deutung der Hirten als politische oder religiöse Leiter
  choice: Das Hirtenbild bleibt im Haupttext stehen.
  alternative: die Führer Israels
  rationale: Der Vers entwickelt bewusst die Spannung zwischen Hirten, Selbstversorgung und Schafen. Eine direkte Ersetzung durch »Führer« würde dieses Bild und seinen theologischen Gehalt verflachen.
- issue: Bedeutung des reflexiven Weidens
  choice: die sich selbst weiden
  alternative: die sich selbst ernähren
  rationale: Die bildhafte und anklagende Mehrdeutigkeit wird im Haupttext bewahrt; die Fußnote erläutert, dass die Hirten für sich selbst sorgen, anstatt die ihnen anvertraute Herde zu versorgen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Wiederholung und das durchgehende Hirtenbild werden bewahrt. »Weissage« ist gegenüber dem alltäglicheren »prophezeie« gewählt, weil es in diesem biblischen Auftragswort prägnant und verständlich bleibt; »sag« hält den anschließenden Imperativ natürlich.
