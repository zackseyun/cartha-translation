  text: יַ֗עַן בְּ/צַ֤ד וּ/בְ/כָתֵף֙ תֶּהְדֹּ֔פוּ וּ/בְ/קַרְנֵי/כֶ֥ם תְּנַגְּח֖וּ כָּל הַ/נַּחְל֑וֹת עַ֣ד אֲשֶׁ֧ר הֲפִיצוֹתֶ֛ם אוֹתָ֖/נָה אֶל הַ/חֽוּצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/021.yaml
  text: Because you push with side and shoulder, and gore all the weak ones with your horns until you have scattered them outside,
translation:
  language: de
  text: Weil ihr mit der Flanke und der Schulter drängt und alle schwachen Tiere mit euren Hörnern stoßt, bis ihr sie nach draußen zerstreut habt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצַד וּבְכָתֵף
  choice: mit Flanke und Schulter
  rationale: Bewahrt das Bild kräftiger Herdentiere; „Flanke“ gibt צַד im Tierbild konkreter wieder als das allgemeinere „Seite“.
- source_word: תֶּהְדֹּפוּ
  choice: drängt
  rationale: Gibt das gewaltsame Schieben und Verdrängen wieder, ohne bereits das anschließende Stoßen mit den Hörnern vorwegzunehmen.
- source_word: הַנַּחְלוֹת
  choice: die schwachen Tiere
  rationale: Die Form bezeichnet hier im Herdenbild die geschwächten Tiere; das ergänzte „Tiere“ macht den Bezug im Deutschen klar.
- source_word: תְּנַגְּחוּ
  choice: stoßt
  rationale: Bezeichnet das Stoßen beziehungsweise Rammen mit den Hörnern; zusammen mit „mit euren Hörnern“ ist die Handlung eindeutig.
- source_word: אֶל־הַחוּצָה
  choice: nach draußen
  rationale: Entspricht der gerichteten Bewegung hinaus und bewahrt den Gegensatz zwischen der Herde und dem Raum außerhalb.
theological_decisions:
- issue: Bildsprache von starken und schwachen Herdentieren
  choice: Das Tierbild bleibt ausdrücklich erhalten.
  alternative: Die Aussage unmittelbar auf mächtige und schwache Menschen beziehen.
  rationale: Der Vers spricht innerhalb der Hirten- und Herdenmetaphorik; eine direkte Auslegung im Haupttext würde die Bildsprache auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wie im hebräischen Kontext als mit „Weil“ eingeleiteter Begründungssatz offen und führt in den folgenden Vers weiter.
