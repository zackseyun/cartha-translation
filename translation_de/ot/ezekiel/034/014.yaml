  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/מִרְעֶה טּוֹב֙ אֶרְעֶ֣ה אֹתָ֔/ם וּ/בְ/הָרֵ֥י מְרֽוֹם יִשְׂרָאֵ֖ל יִהְיֶ֣ה נְוֵ/הֶ֑ם שָׁ֤ם תִּרְבַּ֨צְנָה֙ בְּ/נָ֣וֶה טּ֔וֹב וּ/מִרְעֶ֥ה שָׁמֵ֛ן תִּרְעֶ֖ינָה אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/014.yaml
  text: In good pasture I will pasture them[a], and on the high mountains of Israel their grazing place will be. There they will lie down in a good grazing place[b], and they will feed in rich pasture on the mountains of Israel.
translation:
  language: de
  text: Auf guter Weide werde ich sie weiden, und auf den hohen Bergen Israels wird ihr Weideplatz[a] sein. Dort werden sie auf gutem Weidegrund lagern und auf üppiger Weide[b] auf den Bergen Israels weiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann außer „Weideplatz“ auch „Wohnort“ oder „Aufenthaltsort“ bedeuten; dasselbe Wort steht später bei „Weidegrund“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „fette Weide“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְעֶה
  choice: Weide
  rationale: Das Substantiv bezeichnet Weideland bzw. einen Ort zum Grasen. „Weide“ ist im Deutschen natürlich und bewahrt das konkrete Hirtenbild.
- source_word: אֶרְעֶה
  choice: werde ich sie weiden
  rationale: Die Wiedergabe hält die Tätigkeit des Hirten konkret fest und bewahrt zugleich die im Hebräischen beabsichtigte Verbindung mit „Weide“.
- source_word: הָרֵי מְרוֹם יִשְׂרָאֵל
  choice: die hohen Berge Israels
  rationale: מְרוֹם betont Höhe oder Erhebung; die Formulierung ist idiomatisch und erhält den topografischen Akzent.
- source_word: נְוֵהֶם / בְּנָוֶה טּוֹב
  choice: ihr Weideplatz / auf gutem Weidegrund
  rationale: נָוֶה kann Wohnort, Aufenthaltsort oder Weideplatz bedeuten. Im Zusammenhang der Herde tritt die Weidebedeutung in den Vordergrund; die leichte Variation vermeidet eine schwerfällige Wiederholung.
- source_word: תִּרְבַּצְנָה
  choice: werden sie lagern
  rationale: Das Verb bezeichnet das Niederlegen von Herdentieren. „Lagern“ bewahrt das konkrete Bild von Ruhe und Sicherheit besser als eine abstrakte Umschreibung.
- source_word: מִרְעֶה שָׁמֵן
  choice: üppige Weide
  rationale: שָׁמֵן bedeutet wörtlich „fett“ und bezeichnet hier Fruchtbarkeit und reichen Bewuchs. „Üppig“ vermittelt dies in natürlichem modernem Deutsch.
- source_word: תִּרְעֶינָה
  choice: weiden
  rationale: Da die Tiere Subjekt sind, bezeichnet das Verb ihr Grasen. „Weiden“ passt zum durchgängigen Hirtenbild.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: auf den Bergen Israels
  rationale: Obwohl אֶל häufig eine Richtung bezeichnet, ist hier im Zusammenhang des Weidens eine lokale Wiedergabe sachgerecht und im Deutschen natürlich.
theological_decisions:
- issue: Hirtenbild für Gottes Fürsorge
  choice: Die konkrete Bildsprache von Weide, Herde und Lagern bleibt durchgehend erhalten.
  alternative: Abstraktere Wiedergaben wie „ich werde für sie sorgen“ oder „sie werden sicher ruhen“.
  rationale: Der Vers gehört zu einer ausgedehnten Hirtenrede. Eine konkrete Übersetzung gibt die Metapher des hebräischen Textes wieder, ohne sie vorschnell theologisch auszudeuten.
- issue: Bedeutung von נָוֶה
  choice: Im Haupttext steht entsprechend dem Hirtenkontext „Weideplatz/Weidegrund“; die weitere Bedeutung „Wohn- oder Aufenthaltsort“ wird in einer Fußnote genannt.
  alternative: Im Haupttext „Wohnort“ oder „Aufenthaltsort“.
  rationale: Der unmittelbare Zusammenhang stützt die pastorale Bedeutung, doch die echte lexikalische Mehrdeutigkeit soll nicht unterschlagen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusste Wiederholung von „Weide/weiden“ entspricht der dichten pastoralen Bildsprache des Hebräischen; „lagern“ ist konkret, aber weiterhin allgemein verständlich.
