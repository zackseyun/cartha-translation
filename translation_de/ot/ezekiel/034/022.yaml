  text: וְ/הוֹשַׁעְתִּ֣י לְ/צֹאנִ֔/י וְ/לֹֽא תִהְיֶ֥ינָה ע֖וֹד לָ/בַ֑ז וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין שֶׂ֖ה לָ/שֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/022.yaml
  text: I will save my flock[a], and they will no longer be prey[b], and I will judge between sheep and sheep.
translation:
  language: de
  text: Ich werde meine Herde retten, und sie wird nicht mehr zur Beute werden; ich werde zwischen Schaf und Schaf richten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen Schaf und Schaf“, das heißt: zwischen einem Schaf und einem anderen innerhalb der Herde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Ich werde … retten
  rationale: Der Hifil von ישׁע bezeichnet hier Gottes Befreiung der Herde aus Gefahr und Unterdrückung. „Retten“ ist im modernen Deutsch natürlich und bewahrt zugleich das theologische Gewicht.
- source_word: לְצֹאנִי
  choice: meine Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, besonders Schafe und Ziegen. Im Hirtenbild ist „meine Herde“ die natürliche deutsche Wiedergabe.
- source_word: וְלֹא תִהְיֶינָה עוֹד לָבַז
  choice: sodass sie nicht länger zur Beute wird
  rationale: לָבַז bedeutet wörtlich „zur Plünderung/Beute“. „Zur Beute werden“ gibt die Gefährdung im Bildfeld verständlich wieder. Der feminine Plural des Hebräischen bezieht sich auf die einzelnen Tiere der kollektiv bezeichneten Herde; im Deutschen steht das Pronomen nach „Herde“ im Singular.
- source_word: וְשָׁפַטְתִּי
  choice: und ich werde … richten
  rationale: שׁפט bezeichnet Gottes richterliches Entscheiden und Unterscheiden innerhalb der Herde. „Richten“ wahrt die rechtliche und moralische Kraft.
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: zwischen Schaf und Schaf
  rationale: Die singularisch-distributive Wiederholung wird formal bewahrt. Sie hebt hervor, dass Gott zwischen einzelnen Tieren innerhalb derselben Herde richtet.
theological_decisions:
- issue: Göttliche Rettung im Hirtenbild
  choice: Ich werde meine Herde retten
  alternative: Ich werde meine Herde befreien
  rationale: „Retten“ umfasst die konkrete Befreiung aus Gefahr und behält die weiter reichende biblisch-theologische Resonanz bei, ohne spätere Lehrinhalte in den Vers einzutragen.
- issue: Gottes Gericht innerhalb der Herde
  choice: zwischen Schaf und Schaf richten
  alternative: zwischen einem Schaf und dem anderen richten
  rationale: 'Die Wiedergabe erhält die Spannung: Gott schützt die Herde nicht nur vor äußerer Ausbeutung, sondern richtet zugleich innerhalb der Gemeinschaft.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante hebräische Wiederholung „zwischen Schaf und Schaf“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert. Das Semikolon bildet den Übergang von Rettung zu innergemeinschaftlichem Gericht ab.
