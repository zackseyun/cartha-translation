source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם וְ/הִשְׁבַּתִּ֥י חַיָּֽה רָעָ֖ה מִן הָ/אָ֑רֶץ וְ/יָשְׁב֤וּ בַ/מִּדְבָּר֙ לָ/בֶ֔טַח וְ/יָשְׁנ֖וּ בַּ/יְּעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/025.yaml
  text: I will make with them a covenant of peace[a], and I will remove harmful wild animals from the land[b], so that they may dwell securely in the wilderness and sleep in the forests.
translation:
  language: de
  text: Ich werde mit ihnen einen Bund des Friedens schließen[a] und die gefährlichen Wildtiere aus dem Land beseitigen[b]. Sie werden sicher in der Wildnis wohnen und in den Wäldern schlafen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Frieden« kann hier auch umfassendes Wohlergehen, Ganzheit und Sicherheit einschließen, nicht nur die Abwesenheit von Konflikten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »den gefährlichen Wildtieren im Land ein Ende bereiten«. Die hebräische Formulierung besagt, dass Gott sie im Land aufhören lässt; sie setzt nicht ausdrücklich ihre Vernichtung voraus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: werde … schließen
  rationale: Die feste hebräische Wendung כרת ברית bedeutet wörtlich »einen Bund schneiden«. Im natürlichen Deutschen lautet die entsprechende idiomatische Formulierung »einen Bund schließen«.
- source_word: בְּרִית שָׁלוֹם
  choice: einen Bund des Friedens
  rationale: Diese Wiedergabe bewahrt die Bundesformel und die Bedeutungsbreite von שָׁלוֹם, die neben Frieden auch Wohlergehen, Ganzheit und Sicherheit umfassen kann.
- source_word: הִשְׁבַּתִּי
  choice: verschwinden lassen
  rationale: Der Hifil von שבת bezeichnet hier das Veranlassen eines Aufhörens. »Verschwinden lassen« gibt im Zusammenhang mit wilden Tieren das Ergebnis natürlich wieder, ohne ausdrücklich ihre Vernichtung zu behaupten.
- source_word: חַיָּה רָעָה
  choice: die gefährlichen Wildtiere
  rationale: חַיָּה kann kollektiv für wilde Tiere stehen; רָעָה bezeichnet hier ihre schädliche oder bedrohliche Wirkung, nicht moralische Bosheit.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang von Hesekiel ist das territorial und bundestheologisch bestimmte Land gemeint, nicht notwendig die ganze Erde.
- source_word: יָשְׁבוּ
  choice: werden … wohnen
  rationale: Das Verb bedeutet in diesem Zusammenhang wohnen oder leben. Der deutsche Futursatz gibt die folgende Verheißung klar wieder.
- source_word: בַמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר kann unbesiedeltes Weide- oder Steppenland bezeichnen und nicht nur eine Sandwüste. »Wildnis« bewahrt den weiten Sinn und das Bild überraschender Sicherheit.
- source_word: לָבֶטַח
  choice: sicher
  rationale: Die Wendung bezeichnet ein Leben ohne Bedrohung, also in Sicherheit.
- source_word: יָשְׁנוּ
  choice: schlafen
  rationale: Die direkte Bedeutung erhält das anschauliche Bild völliger Sicherheit.
- source_word: בַּיְּעָרִים
  choice: in den Wäldern
  rationale: Die Pluralform bezeichnet bewaldete Gebiete; »Wälder« ist die klare und natürliche deutsche Entsprechung.
theological_decisions:
- issue: Bedeutungsumfang des verheißenen Friedens im »Bund des Friedens«
  choice: Die Bundesformel bleibt im Haupttext erhalten, ohne »Frieden« auf bloße Abwesenheit von Krieg zu verengen.
  alternative: Die Wendung entweder nur als politischen Frieden oder ausdrücklich als umfassendes endzeitliches Heil auszudeuten.
  rationale: שָׁלוֹם ist hier bedeutungsreich und umfasst Frieden, Wohlergehen und Sicherheit. Die Übersetzung sollte diese Weite offenhalten, ohne ein später entwickeltes Lehrsystem in den Wortlaut einzutragen.
- issue: Verhältnis der beiden abschließenden Verbformen zur vorangehenden Zusage
  choice: 'Wiedergabe als folgende Verheißung: »Dann werden sie …«'
  alternative: 'Finale Wiedergabe: »damit sie … können«.'
  rationale: Die hebräischen Verbfolgen können den Inhalt beziehungsweise die Folge der göttlichen Zusage fortführen. »Dann werden sie« bewahrt den Verheißungscharakter, ohne die Beziehung ausschließlich als Zweckangabe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und zugänglich; »Bund des Friedens« bewahrt den feierlichen und theologischen Klang, während »gefährliche Wildtiere« eine missverständliche moralische Deutung von רָעָה vermeidet.
