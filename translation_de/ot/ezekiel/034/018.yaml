  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם הַ/מִּרְעֶ֤ה הַ/טּוֹב֙ תִּרְע֔וּ וְ/יֶ֨תֶר֙ מִרְעֵי/כֶ֔ם תִּרְמְס֖וּ בְּ/רַגְלֵי/כֶ֑ם וּ/מִשְׁקַע מַ֣יִם תִּשְׁתּ֔וּ וְ/אֵת֙ הַ/נּ֣וֹתָרִ֔ים בְּ/רַגְלֵי/כֶ֖ם תִּרְפֹּשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/018.yaml
  text: Is it too little for you to graze on the good pasture[a], that you must trample the rest of your pastures with your feet, and to drink clear water[b], that you must muddy what remains with your feet?
translation:
  language: de
  text: Ist es euch nicht genug, auf der guten Weide zu weiden? Müsst ihr auch noch den Rest eurer Weideplätze mit euren Füßen zertreten? Und ist es euch nicht genug, klares Wasser[a] zu trinken? Müsst ihr auch noch das übrige Wasser mit euren Füßen trüben[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „abgestandenes Wasser“, das heißt Wasser, das ungestört blieb und sich deshalb geklärt hatte.
    reason: lexical_alternative
  - marker: b
    text: Oder „verschlammen“ beziehungsweise „aufwühlen“; das hebräische Verb bezeichnet das Trüben von Wasser mit den Füßen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: Ist es euch nicht genug
  rationale: 'Die idiomatische rhetorische Frage bewahrt den vorwurfsvollen Sinn: Das bereits Genossene sollte ihnen genügen.'
- source_word: הַמִּרְעֶה הַטּוֹב
  choice: die gute Weide
  rationale: מִרְעֶה bezeichnet Weideland beziehungsweise einen Weideplatz; „gute Weide“ erhält das Hirtenbild in natürlichem Deutsch.
- source_word: תִּרְעוּ
  choice: auf ... zu weiden
  rationale: Das Verb רעה bezeichnet hier das Grasen der Tiere; „weiden“ passt zum fortgeführten Herdenbild.
- source_word: וְיֶתֶר מִרְעֵיכֶם
  choice: den Rest eurer Weideplätze
  rationale: יֶתֶר bezeichnet den Rest; „Weideplätze“ gibt die hebräische Pluralform von מִרְעֵיכֶם wieder.
- source_word: תִּרְמְסוּ בְּרַגְלֵיכֶם
  choice: mit euren Füßen zertreten
  rationale: רמס bedeutet „zertreten“. Die ausdrückliche Nennung der Füße bleibt erhalten, da sie im Vers wiederholt wird und den Vorwurf verstärkt.
- source_word: וּמִשְׁקַע מַיִם
  choice: klares Wasser
  rationale: מִשְׁקַע bezeichnet hier wohl abgesetztes beziehungsweise ungestörtes und dadurch klares Wasser; die verständliche Wirkung wird im Haupttext ausgedrückt, die wörtlichere Möglichkeit in der Fußnote bewahrt.
- source_word: הַנּוֹתָרִים
  choice: das übrige Wasser
  rationale: Das substantivierte Wort bezeichnet das Übriggebliebene. Der Bezug auf Wasser wird im Deutschen zur Klarheit ausdrücklich gemacht.
- source_word: תִּרְפֹּשׂוּן
  choice: trüben
  rationale: Das seltene Verb bezeichnet das schlammige Aufwühlen beziehungsweise Trüben des Wassers mit den Füßen. „Trüben“ ist präzise, anschaulich und im Kontext natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische rhetorische Frage ist zur besseren Verständlichkeit in vier eng verbundene Fragen gegliedert; „auch noch“ macht den vorwurfsvollen Zusammenhang deutlich, ohne den Sinn inhaltlich festzulegen. Das Hirten- und Herdenbild sowie die zweimalige Nennung der Füße bleiben erhalten.
