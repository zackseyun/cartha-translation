source:
  edition: WLC
  text: וְ/לֹא יִהְי֨וּ ע֥וֹד בַּז֙ לַ/גּוֹיִ֔ם וְ/חַיַּ֥ת הָ/אָ֖רֶץ לֹ֣א תֹאכְלֵ֑/ם וְ/יָשְׁב֥וּ לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/028.yaml
  text: They will no longer be plunder for the nations[a], and the wild animals of the land will not devour them. They will dwell securely[c][b], with no one to make them afraid.
translation:
  language: de
  text: Sie werden nicht länger Beute der Völker sein[a], und die wilden Tiere des Landes werden sie nicht fressen. Sie werden in Sicherheit wohnen, und niemand wird ihnen Angst einjagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Plündergut für die Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּז
  choice: Beute
  rationale: Das Substantiv bezeichnet gewaltsam erlangte Beute beziehungsweise Plündergut. „Beute“ ist im Deutschen natürlich und lässt sowohl die politische Ausplünderung durch die Völker als auch den Übergang zum Bild reißender Tiere anklingen.
- source_word: לַגּוֹיִם
  choice: der Völker
  rationale: גּוֹיִם meint hier die umliegenden Völker; der deutsche Genitiv ergibt zusammen mit „Beute“ eine natürliche Wiedergabe des hebräischen ל.
- source_word: חַיַּת הָאָרֶץ
  choice: die wilden Tiere des Landes
  rationale: Die Wendung bezeichnet frei lebende, für Menschen bedrohliche Tiere. „Wilde Tiere“ ist modern und verständlich; „des Landes“ bewahrt den Bezug von הָאָרֶץ.
- source_word: תֹאכְלֵם
  choice: werden sie nicht fressen
  rationale: Das Verb bedeutet wörtlich „essen“. Bei Tieren als Subjekt ist „fressen“ die natürliche deutsche Entsprechung und erhält das konkrete Bild, ohne es durch „verschlingen“ unnötig zu verstärken.
- source_word: וְיָשְׁבוּ
  choice: Sie werden wohnen
  rationale: ישׁב bezeichnet hier dauerhaftes, sesshaftes Wohnen. „Wohnen“ ist gegenwärtiges Standarddeutsch und bewahrt den Gedanken wiederhergestellter Ruhe.
- source_word: לָבֶטַח
  choice: in Sicherheit
  rationale: Die Wendung bezeichnet einen Zustand sicheren, ungefährdeten Wohnens. „In Sicherheit“ ist klar, idiomatisch und inhaltlich nicht enger als der hebräische Ausdruck.
- source_word: וְאֵין מַחֲרִיד
  choice: und niemand wird ihnen Angst einjagen
  rationale: Das Hifil-Partizip von חרד bezeichnet jemanden, der Furcht oder Schrecken hervorruft. Die Wiedergabe ist natürliches modernes Deutsch und bewahrt den persönlichen Verursacher, dessen Fehlen zugesagt wird.
- source_word: עוֹד
  choice: nicht länger
  rationale: In Verbindung mit der Verneinung bezeichnet עוֹד das Ende eines bisherigen Zustands; „nicht länger“ gibt dies eindeutig wieder.
theological_decisions:
- issue: Art und zeitlicher Horizont der verheißenen Sicherheit
  choice: Der Vers wird als konkrete Verheißung von Wiederherstellung und Sicherheit wiedergegeben, ohne den zeitlichen Horizont oder den Bildcharakter der Gefahren festzulegen.
  alternative: Die Völker und wilden Tiere ausschließlich symbolisch deuten oder die Aussage ausschließlich auf eine bestimmte endzeitliche Epoche beziehen.
  rationale: Der hebräische Text nennt politische Ausbeutung und die Gefahr durch wilde Tiere unmittelbar nebeneinander. Die Übersetzung bewahrt beide Bilder und legt keine über den Wortlaut hinausgehende Lehrdeutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Parallelismus, während „Beute der Völker“, „in Sicherheit wohnen“ und „Angst einjagen“ im heutigen Deutsch natürlich klingen.
