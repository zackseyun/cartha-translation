  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Da kam das Wort Jahwes[a] zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, traditionell mit „der HERR“ wiedergegeben; auch als „Yahweh“ transliteriert.
