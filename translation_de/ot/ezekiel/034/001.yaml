lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die fortlaufende Erzählform von היה leitet einen neuen Offenbarungsabschnitt ein. „Da kam“ gibt den Anschluss und die etablierte deutsche Wendung natürlich wieder, ohne das hebräische Idiom unnötig wörtlich als „Und es geschah“ abzubilden.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְבַר־יְהוָה bezeichnet der Ausdruck eine konkrete göttliche Mitteilung. „Das Wort“ bewahrt zugleich die wiederkehrende Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bedeutet hier unmittelbar „zu mir“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר führt die unmittelbar folgende direkte Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion präziser als das schwerfällige „indem er sprach“ oder ein unvollständiges „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. Die Wiedergabe „Jahwe“ bewahrt diesen Namen; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt, ohne sie in den Haupttext einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Formel bleibt erkennbar; der Doppelpunkt gibt die Funktion von לֵאמֹר vor der folgenden direkten Rede idiomatisch wieder.
