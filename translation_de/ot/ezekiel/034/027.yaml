source:
  edition: WLC
  text: וְ/נָתַן֩ עֵ֨ץ הַ/שָּׂדֶ֜ה אֶת פִּרְי֗/וֹ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן יְבוּלָ֔/הּ וְ/הָי֥וּ עַל אַדְמָתָ֖/ם לָ/בֶ֑טַח וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה בְּ/שִׁבְרִ/י֙ אֶת מֹט֣וֹת עֻלָּ֔/ם וְ/הִ֨צַּלְתִּ֔י/ם מִ/יַּ֖ד הָ/עֹבְדִ֥ים בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/027.yaml
  text: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
translation:
  language: de
  text: Die Bäume auf dem Feld werden ihre Frucht geben, und das Land wird seinen Ertrag geben. Sie werden auf ihrem Land in Sicherheit sein. Dann werden sie erkennen, dass ich Jahwe bin, wenn ich die Stangen ihres Jochs zerbreche und sie aus der Hand derer rette, die sie versklaven[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die sie zum Dienst zwingen“ oder „die sie für sich arbeiten lassen“. Das hebräische Partizip kann wörtlicher wiedergegeben werden; das Bild vom zerbrochenen Joch spricht hier für den stärkeren Ausdruck „versklaven“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן עֵץ הַשָּׂדֶה אֶת פִּרְיוֹ
  choice: Der Baum auf dem Feld wird seine Frucht geben
  rationale: Der hebräische Singular kann kollektiv verstanden werden. Die Formulierung bewahrt ihn, bleibt im Deutschen verständlich und gibt die prophetische Aussage als Zukunft wieder.
- source_word: וְהָאָרֶץ תִּתֵּן יְבוּלָהּ
  choice: und das Land wird seinen Ertrag geben
  rationale: יְבוּל bezeichnet den landwirtschaftlichen Ertrag; „Ertrag“ ist im modernen Deutschen klar und sachgerecht.
- source_word: וְהָיוּ עַל אַדְמָתָם לָבֶטַח
  choice: Sie werden auf ihrem Land in Sicherheit sein
  rationale: Die Übersetzung hält sich eng an „sein“ und ergänzt nicht das im Hebräischen unausgesprochene „wohnen“. לָבֶטַח bezeichnet einen Zustand der Sicherheit.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: Dann werden sie erkennen, dass ich Jahwe bin
  rationale: „Dann“ verdeutlicht den zeitlich-folgernden Zusammenhang. „Erkennen“ gibt die in dieser Formel gemeinte erfahrungsbezogene Erkenntnis natürlich wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בְּשִׁבְרִי אֶת מֹטוֹת עֻלָּם
  choice: wenn ich die Stangen ihres Jochs zerbreche
  rationale: ב mit dem Infinitiv ist hier temporal. מֹטוֹת bezeichnet die Stangen beziehungsweise Holzteile des Jochs; das Bild der Unterdrückung bleibt ausdrücklich erhalten.
- source_word: וְהִצַּלְתִּים מִיַּד
  choice: und sie aus der Hand ... rette
  rationale: נצל bedeutet „retten/befreien“. Die hebräische Wendung „aus der Hand“ für die Gewalt oder Verfügungsgewalt einer Person ist auch im Deutschen verständlich.
- source_word: הָעֹבְדִים בָּהֶם
  choice: derer, die sie versklavt haben
  rationale: Das Partizip von עבד mit ב kann hier die herrschaftliche Indienstnahme bezeichnen. Im unmittelbaren Zusammenhang mit dem zerbrochenen Joch bringt „versklavt“ die Unterdrückung angemessen zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ ist die geläufige deutsche Umschrift und bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Stärke des Ausdrucks הָעֹבְדִים בָּהֶם
  choice: die sie versklavt haben
  alternative: die sie zum Dienst zwangen; die sie arbeiten ließen
  rationale: Das zerbrochene Joch und die Rettung aus fremder Hand kennzeichnen den Dienst als gewaltsame Unterdrückung. Die Fußnote bewahrt dennoch die mögliche wörtlichere Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Joch-Metaphorik. Der Satzbau folgt dem Hebräischen eng, ohne unnatürlich zu wirken. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung; die Position nach „Frucht“ in der englischen Konsultationsfassung passt inhaltlich nicht zur dortigen Fußnote.
