base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/016.yaml
  text: I will seek the lost[a], and I will bring back the strayed, and I will bind up the injured, and I will strengthen the sick; but the fat and the strong I will destroy. I will shepherd them with justice.
translation:
  language: de
  text: Das Verlorene will ich suchen, das Verirrte zurückbringen, das Verletzte verbinden und das Kranke stärken. Aber das Fette und das Starke werde ich vernichten. Ich werde sie mit Gerechtigkeit als Hirte führen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde sie mit Gerechtigkeit weiden“ oder „Ich werde sie mit Gerechtigkeit nähren.“ Das hebräische Verb kann weiden, nähren oder als Hirte führen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹבֶדֶת
  choice: das Verlorene
  rationale: Das feminine Singularpartizip bezeichnet im Bildzusammenhang kollektiv verlorene Schafe. Die substantivierte neutrale Form ist im Deutschen natürlich und bewahrt das Hirtenbild.
- source_word: אֲבַקֵּשׁ
  choice: will ich suchen
  rationale: בקש bedeutet hier suchen beziehungsweise nach etwas suchen. Die Formulierung ist knapp, idiomatisch und gibt den entschlossenen Zukunftsbezug wieder.
- source_word: הַנִּדַּחַת
  choice: das Verirrte
  rationale: נדח kann das Weggetriebene oder Versprengte bezeichnen. Im Schafbild gibt „das Verirrte“ den entstandenen Zustand natürlich wieder, ohne die mögliche Fremdeinwirkung ausdrücklich festzulegen.
- source_word: אָשִׁיב
  choice: zurückbringen
  rationale: 'Der Hifil von שוב ist kausativ: zurückbringen. Das passt unmittelbar zum Handeln eines Hirten.'
- source_word: לַנִּשְׁבֶּרֶת
  choice: das Verletzte
  rationale: Wörtlich liegt das Gebrochene vor. In Verbindung mit dem Verb „verbinden“ bezeichnet „das Verletzte“ im modernen Deutsch klar eine körperlich geschädigte Herde.
- source_word: אֶחֱבֹשׁ
  choice: verbinden
  rationale: חבש bezeichnet hier das Verbinden beziehungsweise Bandagieren einer Verletzung. „Verbinden“ ist präzise und natürlich.
- source_word: הַחוֹלָה
  choice: das Kranke
  rationale: חלה bedeutet krank oder erkrankt sein. „Das Kranke“ wahrt die Parallelstruktur der kollektiv gebrauchten Einzelformen.
- source_word: אֲחַזֵּק
  choice: stärken
  rationale: Der Piel von חזק bedeutet stärken oder kräftigen und bildet den passenden Gegensatz zum gegenwärtigen Kranksein.
- source_word: הַשְּׁמֵנָה
  choice: das Fette
  rationale: Die wörtliche Schärfe von „fett“ soll erhalten bleiben; im Kontext bezeichnet das Wort privilegierte, auf Kosten anderer wohlgenährte Tiere.
- source_word: הַחֲזָקָה
  choice: das Starke
  rationale: Die substantivierte Form gibt das Adjektiv חזק direkt wieder und erhält den Kontrast zu den hilfsbedürftigen Schafen.
- source_word: אַשְׁמִיד
  choice: werde ich vernichten
  rationale: Der Hifil von שמד bezeichnet eine entschiedene Zerstörung oder Vernichtung. „Vernichten“ wahrt die Stärke des hebräischen Ausdrucks.
- source_word: אֶרְעֶנָּה
  choice: Ich werde sie … weiden
  rationale: רעה kann weiden, nähren oder als Hirte führen bedeuten. „Weiden“ ist im Deutschen ein natürlicher Hirtenausdruck und lässt sowohl Versorgung als auch Leitung anklingen.
- source_word: בְמִשְׁפָּט
  choice: mit Recht
  rationale: משפט bezeichnet hier rechtmäßiges, gerechtes Urteil und Handeln. „Mit Recht“ verbindet die Hirtenfürsorge knapp mit gerechter Regierung und Gericht.
theological_decisions:
- issue: Verbindung von fürsorglichem Hirtenhandeln und Gericht im Schlusssatz
  choice: „Ich werde sie mit Recht weiden“ nach der Ankündigung der Vernichtung des Fetten und Starken
  alternative: „Ich werde sie nach Recht weiden“ oder „Ich werde sie im Gericht weiden“
  rationale: Der Text hält Wiederherstellung der Schwachen und Gericht über die Starken bewusst zusammen. „Mit Recht weiden“ bewahrt diese Spannung, ohne משפט nur auf Strafe oder רעה nur auf Fütterung einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen substantivierten Formen erhalten den poetisch-rhetorischen Aufbau. Der markante Wechsel von fürsorglichen Verben zu „vernichten“ bleibt ungemildert; die Schlussformulierung wahrt die Mehrdeutigkeit des Hirtenverbs.
