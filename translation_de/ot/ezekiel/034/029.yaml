source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֥י לָ/הֶ֛ם מַטָּ֖ע לְ/שֵׁ֑ם וְ/לֹֽא יִהְי֨וּ ע֜וֹד אֲסֻפֵ֤י רָעָב֙ בָּ/אָ֔רֶץ וְ/לֹֽא יִשְׂא֥וּ ע֖וֹד כְּלִמַּ֥ת הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/029.yaml
  text: And I will raise up for them a planting of renown[a], and they will no longer be consumed by famine in the land[b], nor will they bear the disgrace of the nations anymore.
translation:
  language: de
  text: Und ich werde für sie eine Pflanzung von Rang[a] entstehen lassen. Sie werden im Land nicht mehr vom Hunger dahingerafft werden[b] und nicht länger die Schmach der Nationen tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „eine Pflanzung zum Namen“, das heißt eine namhafte oder angesehene Pflanzung.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwierig und lautet wörtlicher etwa „vom Hunger Gesammelte“. Gemeint sein können Opfer des Hungers oder Menschen, die der Hunger dahinrafft.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ich werde … entstehen lassen
  rationale: Der Hifil von קום bezeichnet hier Gottes verursachendes Handeln. „Entstehen lassen“ verbindet sich im Deutschen natürlich mit „Pflanzung“, ohne die Wendung unnötig zu konkretisieren.
- source_word: מַטָּע
  choice: eine Pflanzung
  rationale: Das Substantiv kann das Gepflanzte, eine Anpflanzung oder den Ort des Pflanzens bezeichnen. „Pflanzung“ bewahrt das landwirtschaftliche Bild und dessen Offenheit.
- source_word: לְשֵׁם
  choice: von Rang
  rationale: Wörtlich steht „zum Namen“. „Von Rang“ gibt den idiomatischen Sinn einer angesehenen oder namhaften Pflanzung knapp wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: אֲסֻפֵי רָעָב
  choice: vom Hunger dahingerafft
  rationale: Die schwierige passive Wendung bedeutet wörtlich etwa „vom Hunger Gesammelte“. Im Zusammenhang bezeichnet sie wahrscheinlich Menschen, die der Hunger hinwegrafft; die Fußnote wahrt die sprachliche Unsicherheit.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ meint im Kontext wahrscheinlich das Land Israels. „Im Land“ bewahrt diesen naheliegenden Bezug, ohne ihn ausdrücklich einzufügen.
- source_word: יִשְׂאוּ
  choice: tragen
  rationale: נשא bedeutet „heben, tragen“. Zusammen mit „Schmach“ ist „tragen“ im Deutschen idiomatisch und quellennah.
- source_word: כְּלִמַּת
  choice: die Schmach
  rationale: Das Wort bezeichnet öffentliche Beschämung, Entehrung oder Schande. „Schmach“ passt zur von anderen Nationen zugefügten Erniedrigung.
- source_word: הַגּוֹיִם
  choice: der Nationen
  rationale: גּוֹיִם bezeichnet hier die Israel umgebenden Völker. „Nationen“ ist neutral und vermeidet die mögliche religiöse Engführung von „Heiden“.
theological_decisions:
- issue: Wesen der verheißenen „Pflanzung“
  choice: Das landwirtschaftliche Bild bleibt als „eine Pflanzung von Rang“ erhalten.
  alternative: Die Wendung ausdrücklich als messianische Gestalt oder ausschließlich als wiederhergestellte landwirtschaftliche Fruchtbarkeit deuten.
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob die Pflanzung einen Herrscher, das wiederhergestellte Volk oder die erneuerte Fruchtbarkeit des Landes bezeichnet. Die Übersetzung bewahrt diese theologische und bildhafte Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht die Verheißung gut verständlich. „Pflanzung“ erhält das offene Bild des Ausgangstextes; „dahingerafft“ gibt die wahrscheinlich tödliche Wirkung des Hungers natürlich wieder, während die Fußnote die ungewöhnliche hebräische Formulierung dokumentiert.
