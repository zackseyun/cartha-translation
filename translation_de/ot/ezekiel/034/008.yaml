source:
  edition: WLC
  text: חַי אָ֜נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם לֹ֣א יַ֣עַן הֱיֽוֹת צֹאנִ֣/י לָ/בַ֡ז וַ/תִּֽהְיֶינָה֩ צֹאנִ֨/י לְ/אָכְלָ֜ה לְ/כָל חַיַּ֤ת הַ/שָּׂדֶה֙ מֵ/אֵ֣ין רֹעֶ֔ה וְ/לֹֽא דָרְשׁ֥וּ רֹעַ֖/י אֶת צֹאנִ֑/י וַ/יִּרְע֤וּ הָֽ/רֹעִים֙ אוֹתָ֔/ם וְ/אֶת צֹאנִ֖/י לֹ֥א רָעֽוּ־׀־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/008.yaml
  text: As I live[a], declares the Lord GOD, surely because my flock has become plunder and my flock has become food for every wild beast of the field, since there was no shepherd, and my shepherds did not seek my flock[b], but the shepherds fed themselves and did not feed my flock—
translation:
  language: de
  text: 'So wahr ich lebe, spricht Yahweh, der Herr: Weil meine Herde zur Beute[a] und zum Fraß für alle wilden Tiere des Feldes geworden ist, weil kein Hirte da war und meine Hirten nicht nach meiner Herde suchten, sondern die Hirten sich selbst weideten[b] und meine Herde nicht weideten —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Raub“. Das hebräische Wort kann gewaltsam geraubtes Gut oder Beute bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sie sorgten für ihre eigenen Interessen. Wörtlich bleibt das Hirtenbild erhalten: „Sie weideten sich selbst.“'
    reason: idiom_clarification
lexical_decisions:
- source_word: חַי אָ֜נִי
  choice: So wahr ich lebe
  rationale: Die geläufige deutsche Schwurformel gibt den feierlichen göttlichen Selbsteid natürlich und ohne erklärende Erweiterung wieder.
- source_word: נְאֻ֣ם אֲדֹנָ֣י יְהוִ֗ה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם wird als prophetische Botenformel mit „spricht“ wiedergegeben; אֲדֹנָי יְהוִה bleibt als Titel mit dem Gottesnamen erkennbar.
- source_word: אִם לֹ֣א
  choice: in der deutschen Schwurformel sinngemäß ausgedrückt
  rationale: Nach חַי אָ֜נִי verstärkt אִם לֹא die folgende Aussage. Im Deutschen trägt „So wahr ich lebe“ bereits diese bekräftigende Funktion; ein zusätzliches „gewiss“ wäre schwerfällig.
- source_word: יַעַן הֱיֽוֹת
  choice: Weil ... geworden ist
  rationale: Die Konstruktion leitet den Grund für das angekündigte Gericht ein und behält zugleich den syntaktisch offenen Übergang zum folgenden Vers bei.
- source_word: צֹאנִי
  choice: meine Herde
  rationale: Der Kollektivbegriff צֹאן bezeichnet Kleinvieh; „Herde“ ist in der durchgehenden Hirtenmetapher die natürliche deutsche Entsprechung.
- source_word: לָבַז
  choice: zur Beute
  rationale: בַּז bezeichnet gewaltsam genommenes Gut beziehungsweise Beute. „Beute“ wahrt zugleich die mögliche Nähe zum Bild gejagter Tiere.
- source_word: לְאָכְלָה
  choice: zum Fraß
  rationale: Im Zusammenhang mit wilden Tieren ist „Fraß“ eine kräftige, idiomatische Wiedergabe dessen, was gefressen wird.
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: für alle wilden Tiere des Feldes
  rationale: Die Wendung bezeichnet die Tiere der freien Wildbahn; die traditionelle Bildsprache „des Feldes“ bleibt erhalten.
- source_word: מֵאֵין רֹעֶה
  choice: weil kein Hirte da war
  rationale: Die Formulierung gibt sowohl den Umstand als auch den ursächlichen Zusammenhang der Schutzlosigkeit wieder.
- source_word: דָרְשׁוּ
  choice: suchten nicht nach
  rationale: Die Grundbedeutung „suchen, sich erkundigen nach“ bleibt erhalten, ohne sie vorschnell zum allgemeineren „sich kümmern“ auszuweiten.
- source_word: וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: die Hirten weideten sich selbst
  rationale: Die auffällige hebräische Formulierung wird bewusst bewahrt; im Kontrast zur vernachlässigten Herde bezeichnet sie eigennützige Selbstversorgung.
- source_word: וְאֶת צֹאנִי לֹא רָעוּ
  choice: und nicht meine Herde
  rationale: Die knappe Gegenüberstellung des Hebräischen wird nachgebildet; „weideten“ ist aus dem unmittelbar vorhergehenden Satzteil zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Die Übersetzung unterscheidet den Herrschaftstitel אֲדֹנָי vom Eigennamen יהוה und macht den im Ausgangstext ausdrücklich stehenden Gottesnamen sichtbar.
- issue: Bezug des Objektpronomens in וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: 'reflexiv: „die Hirten weideten sich selbst“'
  alternative: „die Hirten weideten sie“
  rationale: Der unmittelbare Gegensatz „sich selbst ... und nicht meine Herde“ sowie der Kontext von Vers 2 stützen den reflexiven Sinn. Die ungewöhnliche Bildformulierung bleibt dennoch stehen, statt vollständig als „sorgten nur für sich“ aufgelöst zu werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter prophetischer Bildkraft. Der Gedankenstrich am Ende zeigt an, dass der mit „Weil“ begonnene Gerichtssatz im folgenden Vers weitergeführt wird. Die Wiederholung von „meine Herde“ folgt der eindringlichen Wiederholung des Hebräischen.
