  text: And my flock must graze on what your feet have trampled[b][a], and drink what your feet have muddied.
translation:
  language: de
  text: Und meine Herde[a] soll fressen, was eure Füße zertreten haben, und das Wasser trinken, das eure Füße aufgewühlt haben?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Schafe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „vom Zertretenen eurer Füße weiden und vom Aufgewühlten eurer Füße trinken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצֹאנִי
  choice: Und meine Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, besonders Schafe und Ziegen. Im Hirtenbild ist „Herde“ die natürliche deutsche Kollektivbezeichnung; das Suffix der 1. Person Singular wird mit „meine“ wiedergegeben.
- source_word: מִרְמַס רַגְלֵיכֶם
  choice: was eure Füße zertreten haben
  rationale: מִרְמַס bezeichnet Zertretenes beziehungsweise einen zertretenen Ort. Die Relativkonstruktion gibt das Bild im Deutschen natürlich wieder, ohne den durch die anderen Tiere verdorbenen Weidegrund zu verharmlosen.
- source_word: תִּרְעֶינָה
  choice: soll abweiden
  rationale: Das feminine Qal-Imperfekt bezieht sich auf die kollektiv aufgefasste Herde. „Abweiden“ passt zum zertretenen Weidegrund; „soll“ bringt im Zusammenhang die empörte, auferlegte Folge zum Ausdruck, ohne sie als ausdrückliches Gebot zu deuten.
- source_word: וּמִרְפַּשׂ רַגְלֵיכֶם
  choice: und das Wasser …, das eure Füße aufgewühlt haben
  rationale: מִרְפַּשׂ bezeichnet hier das durch Füße aufgewühlte beziehungsweise schlammig gemachte Trinkwasser. „Wasser“ wird zur natürlichen Verständlichkeit explizit gemacht; „aufgewühlt“ bewahrt das konkrete Bild.
- source_word: תִּשְׁתֶּינָה
  choice: trinken
  rationale: Das feminine Qal-Imperfekt von שׁתה bedeutet „trinken“ und hat dieselbe Herde zum Subjekt. Die mit „soll“ ausgedrückte modale Färbung gilt im Deutschen für beide koordinierten Infinitive.
