translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage wird aus dem fortlaufenden Fragesatz des Kontextes übernommen. Der Parallelismus von Weiden und Trinken sowie das wiederholte Bild der Füße bleiben deutlich erhalten.
