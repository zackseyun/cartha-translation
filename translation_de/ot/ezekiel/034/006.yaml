source:
  edition: WLC
  text: יִשְׁגּ֤וּ צֹאנִ/י֙ בְּ/כָל הֶ֣/הָרִ֔ים וְ/עַ֖ל כָּל גִּבְעָ֣ה רָמָ֑ה וְ/עַ֨ל כָּל פְּנֵ֤י הָ/אָ֨רֶץ֙ נָפֹ֣צוּ צֹאנִ֔/י וְ/אֵ֥ין דּוֹרֵ֖שׁ וְ/אֵ֥ין מְבַקֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/006.yaml
  text: My sheep wandered on all the mountains and on every high hill[a]; my sheep were scattered over the whole face of the earth[b], with no one searching or seeking for them.
translation:
  language: de
  text: Meine Schafe irrten auf allen Bergen und auf jedem hohen Hügel umher[a]. Über die ganze Erde[b] waren meine Schafe zerstreut, und niemand fragte nach ihnen, und niemand suchte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verirrten sich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „über das ganze Angesicht der Erde“; „Erde“ kann je nach angenommener Reichweite auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  choice: irrten … umher
  rationale: שׁגה bezeichnet ein Abirren vom richtigen Weg. „irrten … umher“ ist im Deutschen natürlich, bewahrt das Hirtenbild und lässt sowohl zielloses Umherziehen als auch Verirrtsein anklingen.
- source_word: צֹאנִי
  choice: meine Schafe
  rationale: Die konkrete Wiedergabe erhält das Bild einzelner Schafe innerhalb der Herde und vermeidet eine vorzeitige Auflösung der Metapher.
- source_word: בְּכָל הֶהָרִים
  choice: auf allen Bergen
  rationale: Die Präposition wird für Schafe im bergigen Gelände idiomatisch mit „auf“ wiedergegeben.
- source_word: וְעַל כָּל גִּבְעָה רָמָה
  choice: und auf jedem hohen Hügel
  rationale: Die Formulierung gibt sowohl גִּבְעָה („Hügel“) als auch רָמָה („hoch“) schlicht und vollständig wieder.
- source_word: וְעַל כָּל פְּנֵי הָאָרֶץ
  choice: über die ganze Fläche der Erde
  rationale: „Fläche der Erde“ bildet das hebräische Bild „Angesicht/Oberfläche der Erde“ verständlich ab. ארץ kann je nach angenommener Reichweite auch „Land“ bedeuten; diese Möglichkeit wird in einer Fußnote bewahrt.
- source_word: נָפֹצוּ
  choice: waren … zerstreut
  rationale: Das Nifal von פוץ beschreibt den Zustand des Zerstreutseins; die deutsche Formulierung ist klar und entspricht dem Zusammenhang.
- source_word: וְאֵין דּוֹרֵשׁ
  choice: niemand suchte nach ihnen
  rationale: דרש bezeichnet hier das aktive Nachforschen beziehungsweise Suchen nach den verlorenen Schafen.
- source_word: וְאֵין מְבַקֵּשׁ
  choice: niemand hielt nach ihnen Ausschau
  rationale: בקש bedeutet ebenfalls „suchen“. Die eigenständige Wendung bewahrt die beiden parallelen hebräischen Suchverben, ohne im Deutschen schwerfällig zu klingen.
theological_decisions:
- issue: Bezug von „meine Schafe“
  choice: Die Gottesrede und das Herdenbild bleiben unverändert stehen; im Kontext bezeichnet die Herde Gottes Volk, das von seinen Hirten vernachlässigt wurde.
  alternative: Das Bild als rein allgemeine Schilderung einer Schafherde zu verstehen.
  rationale: Ezechiel 34 kennzeichnet die Herde als Gottes Eigentum und richtet die Klage gegen versagende Hirten. Die Übersetzung bewahrt diese Metapher, ohne sie im Vers erklärend durch „mein Volk“ zu ersetzen.
- issue: Reichweite von הָאָרֶץ
  choice: „Erde“ im Haupttext, bei ausdrücklicher Nennung von „Land“ als möglicher Alternative in der Fußnote.
  alternative: „Land“, mit engerem Bezug auf das Land Israel.
  rationale: Der Ausdruck kann im Hebräischen sowohl „Erde“ als auch „Land“ bezeichnen. Die expansive Formulierung „die ganze Fläche“ spricht für „Erde“, doch die lokale Deutung darf nicht ausgeschlossen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Nennung von „meine Schafe“ und die beiden parallelen Verben für das Suchen bleiben erhalten. Die Bildsprache wird nicht durch eine ausdrückliche Gleichsetzung mit Israel ersetzt.
