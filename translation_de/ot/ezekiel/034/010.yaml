source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י אֶֽל הָ/רֹעִ֜ים וְֽ/דָרַשְׁתִּ֧י אֶת צֹאנִ֣/י מִ/יָּדָ֗/ם וְ/הִשְׁבַּתִּי/ם֙ מֵ/רְע֣וֹת צֹ֔אן וְ/לֹא יִרְע֥וּ ע֛וֹד הָ/רֹעִ֖ים אוֹתָ֑/ם וְ/הִצַּלְתִּ֤י צֹאנִ/י֙ מִ/פִּי/הֶ֔ם וְ/לֹֽא תִהְיֶ֥יןָ לָ/הֶ֖ם לְ/אָכְלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/010.yaml
  text: 'Thus says the Lord GOD: Behold[a], I am against the shepherds, and I will require my flock from their hand, and I will stop them from shepherding the flock. The shepherds will no longer shepherd them, and I will rescue my flock from their mouth[c][b], and it will no longer be food for them.'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Siehe, ich bin gegen die Hirten. Ich werde meine Herde von ihrer Hand zurückfordern[a] und sie daran hindern, die Herde weiter zu weiden. Die Hirten werden sie nicht länger weiden. Ich werde meine Herde aus ihrem Maul retten[b], und sie wird ihnen nicht länger als Nahrung dienen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Herde von ihrer Hand fordern“. Die Wendung kann sowohl das Zurückfordern der Herde als auch die Rechenschaft der Hirten ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „aus ihrem Maul“. Das Bild stellt die Hirten als Verschlinger statt als Beschützer der Herde dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet die Doppelung „Herr HERR“.
- source_word: הִנְנִי אֶל
  choice: Siehe, ich bin gegen
  rationale: Bewahrt die feierliche prophetische Ankündigung und gibt die hier feindliche Ausrichtung von אֶל klar wieder.
- source_word: הָרֹעִים
  choice: die Hirten
  rationale: Erhält das durchgehende Hirtenbild; die gemeinten Verantwortungsträger werden nicht interpretierend an die Stelle der Metapher gesetzt.
- source_word: וְדָרַשְׁתִּי אֶת־צֹאנִי מִיָּדָם
  choice: Ich werde meine Herde von ihrer Hand zurückfordern
  rationale: „Zurückfordern“ verbindet Rechenschaft und Rücknahme; „von ihrer Hand“ bewahrt das hebräische Bild.
- source_word: וְהִשְׁבַּתִּים מֵרְעוֹת צֹאן
  choice: sie daran hindern, die Herde weiter zu weiden
  rationale: Gibt den kausativen Sinn von השׁבית natürlich wieder und erhält רעה als „weiden“.
- source_word: וְלֹא יִרְעוּ עוֹד הָרֹעִים אוֹתָם
  choice: Die Hirten werden sie nicht länger weiden
  rationale: Bewahrt die Wiederholung des Wortstamms רעה und damit den thematischen Nachdruck.
- source_word: וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם
  choice: Ich werde meine Herde aus ihrem Maul retten
  rationale: Erhält das drastische Bild der Hirten als solche, die die Herde verschlingen.
- source_word: וְלֹא תִהְיֶיןָ לָהֶם לְאָכְלָה
  choice: sie wird ihnen nicht länger als Nahrung dienen
  rationale: Das feminine Singularverb wird auf die kollektiv verstandene „Herde“ bezogen; „Nahrung“ setzt das Bild des Mauls fort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR / der Herr HERR
  rationale: Die Übersetzung hält Titel und Eigenname auseinander und macht den im Ausgangstext ausdrücklich stehenden Gottesnamen sichtbar, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Art der Anklage gegen die Hirten
  choice: meine Herde von ihrer Hand zurückfordern
  alternative: sie wegen meiner Herde zur Rechenschaft ziehen
  rationale: Die gewählte Fassung bewahrt sowohl den Gedanken der Rechenschaft als auch den der Rücknahme der Herde, ohne die Mehrdeutigkeit einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Hirten- und Verschlingungsbild sowie die Wiederholung von „weiden“ bleiben erhalten; schwer verständliche hebräische Idiomatik wird im Haupttext nur behutsam geglättet und in der Fußnote erläutert.
