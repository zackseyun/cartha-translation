  text: וַ/תְּפוּצֶ֖ינָה מִ/בְּלִ֣י רֹעֶ֑ה וַ/תִּהְיֶ֧ינָה לְ/אָכְלָ֛ה לְ/כָל חַיַּ֥ת הַ/שָּׂדֶ֖ה וַ/תְּפוּצֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/005.yaml
  text: So they were scattered for lack of a shepherd[a], and they became food for every beast of the field, and they were scattered.
translation:
  language: de
  text: So zerstreuten sie sich, weil kein Hirte da war; sie wurden allen wilden Tieren zum Fraß und zerstreuten sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּפוּצֶינָה
  choice: sie zerstreuten sich
  rationale: Das Verb פוץ beschreibt hier intransitiv das Auseinandergeraten der Herde. Die reflexive deutsche Form ist natürlich und lässt offen, wodurch die Zerstreuung konkret verursacht wurde. Die Wiederholung am Versende bleibt erhalten.
- source_word: מִבְּלִי רֹעֶה
  choice: weil kein Hirte da war
  rationale: מִבְּלִי bezeichnet hier das Fehlen eines Hirten und hat im Zusammenhang kausalen Sinn. Die Formulierung ist gegenwärtiges, verständliches Deutsch und bewahrt das Hirtenbild.
- source_word: וַתִּהְיֶינָה לְאָכְלָה
  choice: sie wurden … zum Fraß
  rationale: היה bezeichnet den Eintritt in einen Zustand; אָכְלָה ist das, was gefressen wird. „Zum Fraß werden“ gibt die Bedrohung durch wilde Tiere prägnant und idiomatisch wieder.
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: allen wilden Tieren
  rationale: חַיַּת הַשָּׂדֶה bezeichnet kollektiv die frei lebenden Tiere. „Alle wilden Tiere“ vermittelt den Sinn in natürlichem modernem Deutsch, ohne das altertümlich wirkende „Tiere des Feldes“ erzwingen zu müssen.
theological_decisions:
- issue: Hirtenbild für Israels Verantwortliche
  choice: Das Bildwort „Hirte“ wird unverändert beibehalten.
  alternative: Leiter oder Betreuer
  rationale: Der Vers gehört zum durchgehenden Hirten- und Herdenbild in Hesekiel 34. Eine erklärende Ersetzung würde die prophetische Bildsprache und ihre theologische Spannung verflachen.
- issue: Ursache der Zerstreuung
  choice: Die Formulierung lässt außer dem Fehlen des Hirten keinen ausdrücklich genannten Verursacher erkennen.
  alternative: 'Passivisch: „sie wurden zerstreut“'
  rationale: Die reflexiv-intransitive Wiedergabe entspricht dem hebräischen Verbgebrauch und vermeidet es, einen ungenannten Handelnden einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon hält die eng verbundenen Folgen zusammen; die auffällige Wiederholung von „zerstreuten sich“ wird entsprechend dem Hebräischen bewusst nicht geglättet.
