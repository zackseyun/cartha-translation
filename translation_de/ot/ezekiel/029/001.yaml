id: EZK.29.1
reference: Ezekiel 29:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָ/עֲשִׂירִ֔ית בָּ/עֲשִׂרִ֕י בִּ/שְׁנֵ֥ים עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/001.yaml
  text: In the tenth year[a], in the tenth month, on the twelfth day of the month, the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Im zehnten Jahr, im zehnten Monat, am zwölften Tag des Monats, erging das Wort Jahwes an mich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָעֲשִׂירִית
  choice: Im zehnten Jahr
  rationale: Die hebräische Datierungsformel nennt keinen ausdrücklichen Bezugspunkt. Daher wird weder »des Exils« noch »der Herrschaft« ergänzt.
- source_word: בָּעֲשִׂרִי
  choice: im zehnten Monat
  rationale: »Monat« steht hier elliptisch, ist aber durch die Datierungsformel und לַחֹדֶשׁ eindeutig mitgedacht; im Deutschen muss es ergänzt werden.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ
  choice: am zwölften Tag des Monats
  rationale: Die hebräische Wendung bezeichnet den Tag innerhalb des Monats. »Tag« ist mitgedacht und wird für klares, natürliches Deutsch ausgedrückt.
- source_word: הָיָה דְבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: Die feste prophetische Offenbarungsformel wird im Deutschen idiomatisch mit »erging das Wort …« wiedergegeben; dies bewahrt sowohl den feierlichen Ton als auch das Einsetzen der göttlichen Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname »Jahwe« wiedergegeben, statt es durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der im Deutschen üblichen Formel »das Wort erging« bezeichnet »an mich« natürlich und präzise den Empfänger.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv führt die unmittelbar folgende Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt dieselbe Funktion knapper als das schwerfällige »indem er sprach«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. »Jahwe« bewahrt ihn, ohne ihn durch den traditionellen Ersatztitel »der HERR« zu verdecken.
- issue: Nicht genannter Bezugspunkt des zehnten Jahres
  choice: keine Ergänzung
  alternative: im zehnten Jahr des Exils Jojachins
  rationale: Obwohl der weitere Buchkontext einen chronologischen Bezug nahelegt, nennt dieser Vers ihn nicht ausdrücklich. Die Übersetzung lässt diese Auslegung daher unausgesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel »erging das Wort Jahwes an mich« ist gut verständlich und bildet die hebräische Redeweise knapp ab. Der Doppelpunkt leitet die im nächsten Vers folgende Botschaft natürlich ein.
