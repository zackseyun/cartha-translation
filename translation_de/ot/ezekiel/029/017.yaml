source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֶשְׂרִ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/017.yaml
  text: And it happened in the twenty-seventh year[a], in the first month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Im siebenundzwanzigsten Jahr, im ersten Monat, am ersten Tag des Monats, erging das Wort Jahwes an mich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Im … Jahr
  rationale: Die hebräische narrative Einleitung eröffnet hier eine Datumsangabe. Im Deutschen wird ihre Funktion natürlich durch die vorangestellte Zeitbestimmung aufgenommen; ein zusätzliches „Und es geschah“ wäre möglich, aber schwerfälliger.
- source_word: בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: im siebenundzwanzigsten Jahr
  rationale: Die kardinale hebräische Datumsformel wird im Deutschen idiomatisch mit einer Ordinalzahl wiedergegeben.
- source_word: בָּרִאשׁוֹן
  choice: im ersten Monat
  rationale: „Monat“ steht an dieser Stelle elliptisch, ist aber durch die folgende Monatsangabe und die feste Datierungsformel eindeutig mitgemeint.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Wörtlich steht „am Einen des Monats“; gemeint ist nach hebräischem Datumsgebrauch der erste Monatstag. Die Wiedergabe ist eindeutig und natürlich.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: erging das Wort Jahwes an mich
  rationale: Diese im Deutschen geläufige prophetische Formel gibt den Empfang göttlicher Offenbarung wieder, ohne das ungewöhnliche hebräische „war zu mir“ nachzubilden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird im Deutschen in der etablierten Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt vor der im nächsten Vers folgenden direkten Rede natürlich die einleitende Funktion von „indem er sprach/mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt den Eigennamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakte prophetische Datierungsformel bleibt erhalten; der abschließende Doppelpunkt weist auf die folgende Gottesrede voraus. Die englische Fußnote wurde nicht übernommen, da ihre idiomatische Alternative im deutschen Haupttext bereits eindeutig ausgedrückt ist und ihr Marker im englischen Text offenbar an der falschen Stelle steht.
