  text: פְּעֻלָּת/וֹ֙ אֲשֶׁר עָ֣בַד בָּ֔/הּ נָתַ֥תִּי ל֖/וֹ אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/020.yaml
  text: As his wages for which he labored against it[a], I have given him the land of Egypt, because they worked for me[c][b], declares the Lord GOD.
translation:
  language: de
  text: Als seinen Lohn[a] für den Dienst, den er gegen sie[b] geleistet hat, habe ich ihm das Land Ägypten gegeben; denn sie haben für mich gearbeitet.[c] – Ausspruch GOTTES, des HERRN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als Vergütung für seine Arbeit“. Das hebräische Wort kann „Arbeit“, „Tat“, „Lohn“ oder „Vergütung“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das feminine Suffix bezieht sich wahrscheinlich auf Tyrus (siehe 29,18). Die hebräische Wendung kann auch weniger ausdrücklich mit „an ihr“ oder „bei ihr“ wiedergegeben werden.
    reason: cross_reference_and_lexical_alternative
  - marker: c
    text: 'Oder: „denn sie handelten für mich“ beziehungsweise „denn sie haben es für mich getan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעֻלָּתוֹ
  choice: seinen Lohn
  rationale: Das Substantiv kann Arbeit, Tat oder Lohn/Vergütung bezeichnen. Da Ägypten hier als Gegenleistung für Nebukadnezars Kriegsdienst gegeben wird, bringt „Lohn“ den vergütenden Sinn knapp und natürlich zum Ausdruck.
- source_word: אֲשֶׁר עָבַד בָּהּ
  choice: für die Arbeit, die er gegen sie geleistet hat
  rationale: עבד bedeutet arbeiten, dienen oder Mühe aufwenden. Das feminine Suffix verweist im unmittelbaren Zusammenhang wahrscheinlich auf Tyrus; „gegen sie“ gibt daher den militärischen Kontext wieder, ohne den Bezug im Haupttext ausdrücklich festzulegen.
- source_word: נָתַתִּי לוֹ
  choice: habe ich ihm … gegeben
  rationale: Das hebräische Perfekt bezeichnet die von Gott fest beschlossene beziehungsweise vollzogene Gabe; das deutsche Perfekt ist hier natürlich und bewahrt ihre gegenwärtige Relevanz.
- source_word: אֶת אֶרֶץ מִצְרָיִם
  choice: das Land Ägypten
  rationale: Die Formulierung folgt dem Hebräischen und betont das Gebiet, das Nebukadnezar als Lohn erhält.
- source_word: אֲשֶׁר עָשׂוּ לִי
  choice: denn sie haben für mich gehandelt
  rationale: עשה ist breit gefasst und bedeutet tun oder handeln. „Für mich gehandelt“ bewahrt diese Offenheit und zugleich die Aussage, dass Nebukadnezar und seine Truppen als Werkzeuge des göttlichen Gerichts dienten.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch GOTTES, des HERRN
  rationale: „Ausspruch“ entspricht der prophetischen Formel נְאֻם. Die typografische Wiedergabe „GOTT, der HERR“ stellt die Verbindung von אֲדֹנָי und dem Gottesnamen in geläufiger deutscher Bibelsprache dar.
theological_decisions:
- issue: Bezugswort des femininen Suffixes in בָּהּ
  choice: Das Pronomen „sie“ bezieht sich wahrscheinlich auf Tyrus aus dem unmittelbaren Kontext.
  alternative: Das Suffix kann allgemeiner auf die Aufgabe, Arbeit oder den Bereich des Kriegsdienstes bezogen werden.
  rationale: Ezechiel 29,18 beschreibt unmittelbar zuvor Nebukadnezars schweren Dienst gegen Tyrus. Der pronominale Haupttext und die Fußnote bewahren dennoch die im isolierten Satz vorhandene Mehrdeutigkeit.
- issue: Handelnde in „sie haben für mich gehandelt“
  choice: Nebukadnezar und sein Heer handelten als Werkzeuge des göttlichen Gerichts.
  alternative: Sie verfolgten ausschließlich eigene imperiale Ziele, ohne dass ihr Handeln als Dienst für Gott bezeichnet wird.
  rationale: Der Plural des hebräischen Verbs verweist wahrscheinlich auf den König samt seinen Truppen. Die Übersetzung erhält die ausdrückliche, spannungsvolle Aussage, dass ihr Handeln Gott diente, ohne daraus seine Billigung all ihrer Absichten abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper prophetischer Schlussformel. „Lohn“ ist allgemein verständlich; „Ausspruch GOTTES, des HERRN“ wahrt den feierlichen Charakter und unterscheidet in konventioneller Typografie den Gottesnamen vom Herrentitel.
