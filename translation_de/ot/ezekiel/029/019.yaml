source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י נֹתֵ֛ן לִ/נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל אֶת אֶ֣רֶץ מִצְרָ֑יִם וְ/נָשָׂ֨א הֲמֹנָ֜/הּ וְ/שָׁלַ֤ל שְׁלָלָ/הּ֙ וּ/בָזַ֣ז בִּזָּ֔/הּ וְ/הָיְתָ֥ה שָׂכָ֖ר לְ/חֵילֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/019.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am giving the land of Egypt to Nebuchadnezzar king of Babylon, and he will carry off its multitude, plunder its spoil, and seize its booty; and it will be wages for his army.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Siehe, ich gebe Nebukadrezar, dem König von Babel, das Land Ägypten. Er wird seinen Reichtum[a] fortschaffen, Beute machen und sein Raubgut an sich nehmen; und es wird der Lohn für sein Heer sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Menge“, „Fülle“, „Bevölkerung“ oder „Reichtum“ bedeuten. Im Zusammenhang mit Beute und dem Lohn für das Heer ist hier wahrscheinlich Ägyptens Reichtum bzw. Besitz gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Bewahrt den folgernden Bezug zum vorausgehenden Gotteswort und klingt im modernen Deutschen natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Gibt die feste prophetische Botenformel würdig und prägnant wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Unterscheidet den Herrschaftstitel אֲדֹנָי vom ausdrücklich genannten Gottesnamen יהוה, ohne beide zu einem einzigen Titel zu verschmelzen.
- source_word: הִנְנִי נֹתֵן
  choice: Siehe, ich gebe
  rationale: Das Aufmerksamkeitssignal und die Partizipialkonstruktion vermitteln eine feierliche, als unmittelbar und gewiss angekündigte Handlung.
- source_word: לִנְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadrezar, dem König von Babel
  rationale: Die Empfängerfunktion der Präposition ל wird durch den Dativ wiedergegeben; die Namensform Nebukadrezar folgt der hier vorliegenden hebräischen Schreibung.
- source_word: אֶת אֶרֶץ מִצְרָיִם
  choice: das Land Ägypten
  rationale: Erhält den konkreten territorialen Gehalt von אֶרֶץ.
- source_word: וְנָשָׂא הֲמֹנָהּ
  choice: Er wird seine Fülle wegtragen
  rationale: הָמוֹן kann Menge, Fülle, Bevölkerung oder Reichtum bezeichnen. „Fülle“ wahrt die Mehrdeutigkeit besser als eine ausschließlich wirtschaftliche oder demografische Festlegung.
- source_word: וְשָׁלַל שְׁלָלָהּ
  choice: seine Beute erbeuten
  rationale: Die deutsche figura etymologica bildet die hebräische Verbindung des Verbs שׁלל mit dem verwandten Substantiv שָׁלָל nach.
- source_word: וּבָזַז בִּזָּהּ
  choice: sein Raubgut rauben
  rationale: Bewahrt auch in der parallelen zweiten Verb-Substantiv-Verbindung das hebräische Wortspiel und den militärischen Ton.
- source_word: וְהָיְתָה שָׂכָר לְחֵילוֹ
  choice: und es wird der Lohn für sein Heer sein
  rationale: שָׂכָר bezeichnet Lohn beziehungsweise Entgelt; חַיִל meint hier die militärische Streitmacht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form lässt sowohl den Titel אֲדֹנָי als auch den im Ausgangstext ausdrücklich stehenden Eigennamen יהוה sichtbar, ohne den Namen durch einen zweiten Herrentitel zu ersetzen.
- issue: Bezug des abschließenden Pronomens in וְהָיְתָה
  choice: es
  alternative: die Beute beziehungsweise Ägyptens Besitz
  rationale: Die Form ist grammatisch feminin und kann auf אֶרֶץ („Land“) beziehungsweise Ägypten zurückweisen; der pronominale Ausdruck vermeidet eine weitergehende inhaltliche Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener prophetischer Formel. Die beiden hebräischen Verb-Substantiv-Wortspiele werden durch „Beute erbeuten“ und „Raubgut rauben“ hörbar gemacht. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Wendung.
