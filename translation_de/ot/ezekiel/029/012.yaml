- from: Und ich werde das Land Ägypten zu einer Einöde machen, inmitten verwüsteter Länder[a]. Seine Städte werden vierzig Jahre lang als Einöde inmitten zerstörter Städte liegen. Und ich werde Ägypten unter die Nationen zerstreuen und sie über die Länder hin verstreuen.[b]
  to: Und ich werde das Land Ägypten zu einer Einöde machen, inmitten verwüsteter Länder[a]. Seine Städte werden inmitten zerstörter Städte vierzig Jahre lang eine Einöde sein. Und ich werde Ägypten unter die Nationen zerstreuen und sie über die Länder verstreuen.[b]
  rationale: Die Revision stellt die nominale Prädikation der zweiten Parallelzeile ausdrücklich wieder her, glättet zwei deutsche Wendungen und kürzt die erste Fußnote auf eine echte lexikalische Alternative. Der metonymische Wechsel von „Ägypten“ zu „sie“ bleibt wie im hebräischen Text erhalten und wird weiterhin durch die Fußnote erklärt.
