source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּ/ת֣וֹךְ אֲרָצ֣וֹת נְשַׁמּ֗וֹת וְ/עָרֶ֨י/הָ֙ בְּ/ת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה וַ/הֲפִצֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְֽ/זֵרִיתִ֖י/ם בָּ/אֲרָצֽוֹת־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/012.yaml
  text: And I will make the land of Egypt a desolation among desolated lands[a], and her cities will be a desolation among ruined cities for forty years[b]; and I will scatter Egypt among the nations and disperse them through the lands.
translation:
  language: de
  text: Und ich werde das Land Ägypten zu einer Einöde machen, inmitten verwüsteter Länder[a]. Seine Städte werden inmitten zerstörter Städte vierzig Jahre lang eine Einöde sein. Und ich werde Ägypten unter die Nationen zerstreuen und sie über die Länder verstreuen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter verwüsteten Ländern“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „sie“ sind die Menschen Ägyptens gemeint. Im Hebräischen folgt auf den Namen „Ägypten“ ein pluralisches Pronomen.
    reason: referent_clarification
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … zu einer Einöde machen
  rationale: נתן bedeutet grundsätzlich „geben, setzen“, bezeichnet hier aber mit dem Zustandsnomen שְׁמָמָה idiomatisch das Versetzen in einen Zustand.
- source_word: אֶרֶץ מִצְרַיִם
  choice: das Land Ägypten
  rationale: Bewahrt die ausdrückliche territoriale Bezeichnung des Hebräischen.
- source_word: שְׁמָמָה
  choice: Einöde
  rationale: Das Substantiv bezeichnet einen durch Verwüstung entstandenen öden Zustand; die substantivische Wiedergabe erhält die Bildkraft und die Wiederholung.
- source_word: בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת
  choice: inmitten verwüsteter Länder
  rationale: בְּתוֹךְ wird räumlich mit „inmitten“ wiedergegeben; נְשַׁמּוֹת bezeichnet bereits verwüstete Länder.
- source_word: וְעָרֶיהָ
  choice: Seine Städte
  rationale: Das feminine Suffix bezieht sich grammatisch auf אֶרֶץ, „Land“; im natürlichen Deutschen richtet sich das Pronomen nach dem grammatischen Geschlecht von „Land“.
- source_word: בְּתוֹךְ עָרִים מָחֳרָבוֹת
  choice: inmitten zerstörter Städte
  rationale: מָחֳרָבוֹת bezeichnet ruinierte beziehungsweise zerstörte Orte; „zerstört“ unterscheidet den Ausdruck von der verwandten Verwüstungswortgruppe im ersten Satzglied.
- source_word: תִּהְיֶיןָ שְׁמָמָה אַרְבָּעִים שָׁנָה
  choice: werden vierzig Jahre lang als Einöde … liegen
  rationale: Gibt den resultierenden beziehungsweise fortdauernden Zustand idiomatisch wieder und hält die Zeitangabe klar bei den Städten.
- source_word: וַהֲפִצֹתִי אֶת מִצְרַיִם בַּגּוֹיִם
  choice: Und ich werde Ägypten unter die Nationen zerstreuen
  rationale: Bewahrt den Orts- beziehungsweise Volksnamen מִצְרַיִם und damit den metonymischen Übergang vom Land zu seinen Bewohnern.
- source_word: וְזֵרִיתִים בָּאֲרָצוֹת
  choice: und sie über die Länder hin verstreuen
  rationale: זרה kann „worfeln“ oder „zerstreuen“ bedeuten. Im Parallelismus bezeichnet es hier die räumliche Verteilung; „sie“ bewahrt den auffälligen pluralischen Rückbezug.
theological_decisions:
- issue: Bezug von „Ägypten“ und des anschließenden pluralischen Pronomens
  choice: „Ägypten“ bleibt im Haupttext stehen; anschließend folgt „sie“.
  alternative: Beide Ausdrücke explizit als „die Ägypter“ wiedergeben.
  rationale: Der hebräische Text wechselt vom Eigennamen מִצְרַיִם zu einem pluralischen Objektsuffix. Die Wiedergabe bewahrt diesen metonymischen Wechsel und macht in einer Fußnote deutlich, dass die Bevölkerung gemeint ist.
- issue: Verhältnis der beiden Verwüstungsbegriffe
  choice: שׁמם wird mit „Einöde/verwüstet“, חרב mit „zerstört“ wiedergegeben.
  alternative: Beide Wortgruppen einheitlich mit „verwüstet“ wiedergeben.
  rationale: So bleibt sowohl der enge Parallelismus als auch die lexikalische Differenz erkennbar, ohne einen sachlichen Gegensatz zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einöde“ erhält den nominalen und prophetisch eindringlichen Charakter von שְׁמָמָה; die Satzteilung verbessert die Verständlichkeit, ohne die Parallelstruktur oder den metonymischen Wechsel aufzulösen.
