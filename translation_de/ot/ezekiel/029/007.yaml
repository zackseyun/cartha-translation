review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und das Schilfrohrbild sind zutreffend wiedergegeben. Die Form בְּכַפֶּךָ lautet jedoch im Konsonantentext wörtlich „in/an deiner Handfläche“ und darf im Haupttext nur mit einer deutlich formulierten Fußnote als die Hand der Zugreifenden verstanden werden. Die Schlusswendung verbindet den Hifil von עמד („zum Stehen bringen“) ungewöhnlich mit „Lenden/Hüften“; eine kontextuelle Wiedergabe als Verlust des sicheren Stands ist möglich, sollte aber die Unsicherheit ausdrücklich kenntlich machen.
  naturalness: „Packten“, „rissest“ und „ließest“ wirken in der Kombination unnötig uneinheitlich bzw. altertümlich. „Ergriffen“, „riss … auf“ und „brachtest … zum Wanken“ sind modernes, würdiges Standarddeutsch. „Jede Schulter“ gibt כָּל־כָּתֵף klarer wieder als der missverständliche Kollektivsingular „die ganze Schulter“.
  terminology: „Hüften“ ist als moderne Wiedergabe von מָתְנַיִם vertretbar; „Lenden“ gehört als lexikalische Alternative in die Anmerkung. Die körperliche Metapher bleibt erhalten, ohne sie in politische Abhängigkeit aufzulösen.
