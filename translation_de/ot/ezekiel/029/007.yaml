base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/007.yaml
  text: When they took hold of you with their hand[a], you were crushed, and you split open every shoulder for them; and when they leaned on you, you were broken[b], and you made all their hips stand unsteadily.
translation:
  language: de
  text: Wenn sie dich mit ihren Händen ergriffen[a], wurdest du zerdrückt und riss ihnen jede Schulter auf. Wenn sie sich auf dich stützten, zerbrachst du und brachtest all ihre Hüften zum Wanken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Konsonantentext lautet wörtlich: »in/an deiner Handfläche«. Im Bild vom Schilfrohr wird dies häufig als die Hand derjenigen verstanden, die es ergreifen.'
    reason: textual_ambiguity
  - marker: b
    text: 'Wörtlich: »und du brachtest ihnen alle Lenden zum Stehen«. Die hebräische Wendung ist ungewöhnlich; im Zusammenhang wird sie oft als Verlust eines sicheren Standes verstanden. »Lenden« ist die traditionellere Wiedergabe von »Hüften«.'
    reason: lexical_and_idiomatic_alternative
lexical_decisions:
- source_word: בְּתָפְשָׂם בְּךָ
  choice: Wenn sie dich … packten
  rationale: Der Infinitiv mit בְּ bildet einen Temporalsatz. »Packen« bewahrt das konkrete Ergreifen des als Schilfrohr dargestellten Ägypten.
- source_word: בכפך
  choice: mit der Hand
  rationale: Der masoretische Konsonantentext weist formal auf »an deiner Handfläche«; im fortlaufenden Schilfrohrbild ist jedoch die Hand derjenigen gemeint, die zugreifen. Die textnahe Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: תֵּרוֹץ
  choice: wurdest du zerdrückt
  rationale: Das Nifal von רצץ bezeichnet das Zerdrückt- oder Zermalmtwerden. »Zerdrückt« hält diesen Ausdruck von dem späteren שׁבר, »zerbrechen«, auseinander.
- source_word: וּבָקַעְתָּ
  choice: und rissest … auf
  rationale: בקע bedeutet spalten oder aufreißen. Beim zerdrückten Schilfrohr beschreibt es die Verletzung der sich darauf stützenden Menschen.
- source_word: כָּל כָּתֵף
  choice: die ganze Schulter
  rationale: כָּתֵף bezeichnet konkret die Schulter. Der deutsche Kollektivsingular gibt die körperliche Bildsprache wieder.
- source_word: וּבְהִשָּׁעֲנָם עָלֶיךָ
  choice: Wenn sie sich auf dich stützten
  rationale: Die Form leitet erneut einen Temporalsatz ein. »Sich auf jemanden stützen« bewahrt zugleich das körperliche Bild und seinen naheliegenden Sinn des Vertrauens.
- source_word: תִּשָּׁבֵר
  choice: zerbrachst du
  rationale: Das Nifal von שׁבר kann im Deutschen natürlich intransitiv wiedergegeben werden. »Zerbrachst« erhält den Unterschied zu רצץ im ersten Satzteil.
- source_word: וְהַעֲמַדְתָּ לָהֶם כָּל מָתְנַיִם
  choice: du ließest sie alle mit wankenden Hüften dastehen
  rationale: Die Wiedergabe bewahrt den Grundgedanken des Hifil von עמד, »stehen lassen/zum Stehen bringen«, und macht zugleich die durch den zusammenbrechenden Halt verursachte Unsicherheit verständlich. מָתְנַיִם wird in heutigem Deutsch als »Hüften« wiedergegeben.
theological_decisions:
- issue: Körperliches Schilfrohrbild oder abstrakte politische Deutung
  choice: 'Das körperliche Bild bleibt im Haupttext erhalten: packen, Schulter, sich aufstützen und Hüften.'
  alternative: Die Wendungen unmittelbar als politisches Vertrauen auf Ägypten umschreiben.
  rationale: Der Vers setzt das Bild Ägyptens als unzuverlässigen Schilfstab fort. Die politische und theologische Aussage soll aus dem prophetischen Bild hervorgehen, nicht durch eine erklärende Paraphrase an dessen Stelle treten.
- issue: Deutung der abschließenden Wendung über die Hüften
  choice: »mit wankenden Hüften dastehen«
  alternative: 'Formal: »alle Lenden zum Stehen bringen«; stärker deutend: »alle Hüften ins Wanken bringen«'
  rationale: Die gewählte Fassung hält »stehen« aus עמד fest, vermittelt aber auch den kontextuell erforderlichen Verlust des sicheren Halts. Fußnote [b] nennt die wörtlichere Körperbezeichnung und die ungewöhnliche hebräische Formulierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer körperlicher Bildsprache. Das Präteritum entspricht der erzählenden Rückschau des prophetischen Bildes. »Rissest« und »ließest« sind reguläre, hier rhythmisch passende Präteritalformen; die übrige Syntax bleibt bewusst allgemeinverständlich.
