  text: לָ/כֵ֛ן הִנְ/נִ֥י אֵלֶ֖י/ךָ וְ/אֶל יְאֹרֶ֑י/ךָ וְ/נָתַתִּ֞י אֶת אֶ֣רֶץ מִצְרַ֗יִם לְ/חָרְבוֹת֙ חֹ֣רֶב שְׁמָמָ֔ה מִ/מִּגְדֹּ֥ל סְוֵנֵ֖ה וְ/עַד גְּב֥וּל כּֽוּשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/010.yaml
  text: Therefore[a], behold, I am against you and against your Nile channels, and I will make the land of Egypt ruins, a desolation laid waste, from Migdol to Syene[c][b], as far as the border of Cush.
translation:
  language: de
  text: 'Darum: Siehe, ich bin gegen dich und gegen deine Nilarme[a]. Ich werde das Land Ägypten zu Trümmerstätten machen, zu einer verwüsteten Einöde, von Migdol bis Syene[b], bis an die Grenze von Kusch[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Flüsse“. Das hebräische Wort bezeichnet im ägyptischen Zusammenhang häufig den Nil und seine Arme oder Kanäle.'
    reason: lexical_alternative
  - marker: b
    text: Syene war eine alte Stadt beim heutigen Assuan und markierte den südlichen Rand Ägyptens.
    reason: cultural_note
  - marker: c
    text: Kusch bezeichnet das Gebiet südlich von Ägypten, besonders Nubien; es ist nicht einfach mit den Grenzen des heutigen Äthiopien gleichzusetzen.
    reason: cultural_note
lexical_decisions:
- source_word: יְאֹרֶיךָ
  choice: deine Nilarme
  rationale: יְאֹר bezeichnet im ägyptischen Zusammenhang gewöhnlich den Nil sowie seine Arme oder Kanäle. „Nilarme“ wahrt den konkreten Ägyptenbezug und die Pluralform, ohne auf das allgemeinere „Flüsse“ auszuweichen.
- source_word: לְחָרְבוֹת חֹרֶב שְׁמָמָה
  choice: zu Trümmerstätten, zu einer verwüsteten Einöde
  rationale: Die Häufung verwandter Verwüstungsbegriffe wird mit zwei kräftigen, natürlichen deutschen Ausdrücken wiedergegeben. So bleibt die steigernde Wirkung erhalten, ohne die Wendung auf einen einzigen Begriff zu verkürzen.
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: von Migdol bis Syene
  rationale: Die Ortsnamen werden transliteriert. Die syntaktisch schwierige Folge wird als Ausdehnungsangabe verstanden; „Syene“ bezeichnet die alte Stadt beim heutigen Assuan.
- source_word: וְעַד גְּבוּל כּוּשׁ
  choice: und bis an die Grenze von Kusch
  rationale: כּוּשׁ wird als historischer Gebietsname „Kusch“ bewahrt, statt mit dem modernen Staat Äthiopien gleichgesetzt zu werden. „Bis an“ gibt die räumliche Erstreckung natürlich wieder.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Siehe, ich bin gegen dich
  rationale: Die prophetische Formel kündigt feierlich Gottes unmittelbares Eingreifen und seine Gegnerschaft an. „Siehe“ erhält diesen markierenden, würdevollen Ton.
- source_word: וְנָתַתִּי אֶת אֶרֶץ מִצְרַיִם
  choice: Ich werde das Land Ägypten zu … machen
  rationale: 'נתן hat hier zusammen mit der Ergebnisangabe resultative Bedeutung: Das Land wird in einen Zustand der Verwüstung versetzt. „Zu … machen“ ist dafür im modernen Deutsch klar und idiomatisch.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel. Die gehäuften Verwüstungsbegriffe des Hebräischen bleiben hörbar; historische Orts- und Gebietsnamen werden nicht modernisierend ersetzt.
