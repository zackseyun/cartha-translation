source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה מִ/קֵּ֞ץ אַרְבָּעִ֤ים שָׁנָה֙ אֲקַבֵּ֣ץ אֶת מִצְרַ֔יִם מִן הָ/עַמִּ֖ים אֲשֶׁר נָפֹ֥צוּ שָֽׁמָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/013.yaml
  text: 'For thus says the Lord GOD: At the end of forty years I will gather Egypt from the peoples among whom they were scattered[a].'
translation:
  language: de
  text: 'Denn so spricht der Herr Yahweh: Nach Ablauf von vierzig Jahren werde ich die Ägypter aus den Völkern sammeln, unter die sie zerstreut worden sind.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ägypten“; der Ländername bezeichnet hier die Ägypter als Volk.'
    reason: Die Fußnote bewahrt die formale Gestalt des hebräischen Ausdrucks, während der Haupttext dessen kontextuelle Bedeutung verständlich wiedergibt.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Aussage und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Dies ist die geläufige, würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: „Herr“ gibt אֲדֹנָי wieder; „Yahweh“ bewahrt den im Ausgangstext ausdrücklich stehenden Gottesnamen und vermeidet die Doppelung „Herr HERR“.
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: Nach Ablauf von vierzig Jahren
  rationale: Die Formulierung bezeichnet das Erreichen des Endes der genannten Zeitspanne; „Nach Ablauf“ ist im modernen Deutschen präzise und natürlich.
- source_word: אֲקַבֵּץ
  choice: werde ich … sammeln
  rationale: קבץ bezeichnet das Zusammenbringen zuvor zerstreuter Menschen und trägt hier den Sinn einer Wiederherstellung.
- source_word: אֶת מִצְרַיִם
  choice: die Ägypter
  rationale: Der Ländername „Ägypten“ steht metonymisch für das zerstreute ägyptische Volk. Die personale Wiedergabe ermöglicht zugleich einen klaren Bezug des pluralischen Verbs נָפֹצוּ.
- source_word: מִן הָעַמִּים
  choice: aus den Völkern
  rationale: „Völker“ entspricht dem Plural עַמִּים genauer als das stärker politisch geprägte „Nationen“.
- source_word: אֲשֶׁר נָפֹצוּ שָׁמָּה
  choice: unter die sie zerstreut worden sind
  rationale: Die Formulierung gibt sowohl den passivischen Sinn des Verbs als auch die Ziel- beziehungsweise Ortsangabe שָׁמָּה idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung unterscheidet den Titel אֲדֹנָי vom persönlichen Gottesnamen יְהוִה und lässt den im Hebräischen vorhandenen Bundesnamen sichtbar.
- issue: Ägypten als Land oder als Volk
  choice: die Ägypter
  alternative: Ägypten
  rationale: Der Kontext handelt von Menschen, die unter Völker zerstreut und wieder gesammelt werden. Die metonymische Bedeutung des Ländernamens wird daher im Haupttext verständlich ausgedrückt, ohne die Aussage auf eine bestimmte gesellschaftliche Gruppe einzugrenzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der vertrauten prophetischen Formel „so spricht“. Die Satzstellung bleibt nah am Hebräischen, ohne unnatürlich zu wirken.
