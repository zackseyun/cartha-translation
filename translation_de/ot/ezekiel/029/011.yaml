  variant: modern standard German
source:
  edition: WLC
  text: לֹ֤א תַעֲבָר בָּ/הּ֙ רֶ֣גֶל אָדָ֔ם וְ/רֶ֥גֶל בְּהֵמָ֖ה לֹ֣א תַעֲבָר בָּ֑/הּ וְ/לֹ֥א תֵשֵׁ֖ב אַרְבָּעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/011.yaml
  text: No human foot will pass through it[a], and no animal foot will pass through it; and it will not be inhabited for forty years.
translation:
  language: de
  text: Kein Mensch wird es durchqueren[a], und kein Tier wird es durchqueren; vierzig Jahre lang wird es unbewohnt bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Kein Fuß eines Menschen … und kein Fuß eines Tieres.“'
    reason: Die Fuß-Metapher des Hebräischen wird im Haupttext idiomatisch als Aussage über Menschen und Tiere wiedergegeben.
lexical_decisions:
- source_word: תַעֲבָר בָּהּ
  choice: wird es durchqueren
  rationale: עבר mit ב bezeichnet hier die Bewegung durch ein Land oder Gebiet. „Durchqueren“ gibt diese räumliche Bewegung im Deutschen natürlich und präzise wieder.
- source_word: רֶגֶל אָדָם
  choice: kein Mensch
  rationale: Wörtlich steht „Fuß eines Menschen“. Die Wendung bezeichnet idiomatisch menschlichen Verkehr beziehungsweise jeden Menschen, der das Land durchquert; „kein Mensch“ gibt den allgemeinen Sinn in natürlichem modernem Deutsch wieder.
- source_word: רֶגֶל בְּהֵמָה
  choice: kein Tier
  rationale: Die parallele Wendung bedeutet wörtlich „Fuß eines Tieres“. „Kein Tier“ bewahrt den umfassenden Sinn von בְּהֵמָה und klingt im Deutschen natürlich.
- source_word: לֹא תֵשֵׁב
  choice: wird es unbewohnt bleiben
  rationale: ישב bezeichnet bei einem Land das Bewohntsein oder Besiedeltsein. „Unbewohnt bleiben“ ist idiomatisch und bringt den fortdauernden Zustand während des genannten Zeitraums klar zum Ausdruck.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: Die deutsche Zeitangabe bezeichnet eindeutig die Dauer des angekündigten Zustands.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: Mensch im allgemeinen Sinn
  alternative: Mann
  rationale: אָדָם bezeichnet hier nicht eigens einen männlichen Einzelnen, sondern jeden Menschen, der das Land betreten oder durchqueren könnte. „Mensch“ wahrt diesen generischen Sinn.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wiederholung „wird es durchqueren“ bildet den hebräischen Parallelismus ab; „unbewohnt bleiben“ vermeidet eine im Deutschen unnatürliche wörtliche Wiedergabe von ישב.
