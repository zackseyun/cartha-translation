  text: וְ/לֹ֣א יִֽהְיֶה עוֹד֩ לְ/בֵ֨ית יִשְׂרָאֵ֤ל לְ/מִבְטָח֙ מַזְכִּ֣יר עָוֺ֔ן בִּ/פְנוֹתָ֖/ם אַחֲרֵי/הֶ֑ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/016.yaml
  text: And it will no longer be for the house of Israel a source of confidence[a], bringing iniquity to remembrance when they turn after them[c][b]; then they will know that I am the Lord GOD.
translation:
  language: de
  text: Und es wird für das Haus Israel kein Grund zum Vertrauen mehr sein, der Schuld in Erinnerung ruft, wenn sie sich ihnen zuwenden. Dann werden sie erkennen, dass ich der Herr Yahweh bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יִהְיֶה עוֹד
  choice: wird ... nicht/kein ... mehr sein
  rationale: Gibt die Verneinung mit dem Imperfekt von היה und עוֹד als künftig fortbestehendes Ende eines bisherigen Zustands in natürlichem Deutsch wieder.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: Bewahrt die korporative, heilsgeschichtliche Bezeichnung „Haus Israel“ und gibt ל in der prädikativen Konstruktion passend mit „für“ wieder.
- source_word: לְמִבְטָח
  choice: Grund zum Vertrauen
  rationale: מִבְטָח bezeichnet hier das, worauf man sich als Sicherheit oder Stütze verlässt. Die Formulierung macht den objektbezogenen Sinn deutlich, ohne ihn auf ein bloß inneres Gefühl zu verengen.
- source_word: מַזְכִּיר עָוֺן
  choice: der an Schuld erinnert
  rationale: 'Der Hifil-Partizip von זכר hat kausativen Sinn: etwas in Erinnerung bringen beziehungsweise an etwas erinnern. עָוֺן bleibt mit „Schuld“ offen für schuldhaftes Unrecht und den daraus folgenden Schuldzustand.'
- source_word: בִּפְנוֹתָם אַחֲרֵיהֶם
  choice: wenn sie sich ihnen zuwenden
  rationale: Die Konstruktion mit ב und Infinitiv wird temporal wiedergegeben. „Ihnen“ bewahrt den pluralischen Rückverweis des Hebräischen, ohne den im unmittelbaren Zusammenhang erkennbaren Bezug unnötig im Haupttext auszudeuten.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: „Dann“ bringt den im Zusammenhang naheliegenden Folgesinn des ו zum Ausdruck; „erkennen“ entspricht der in Ezechiel häufigen Erkenntnisformel besser als rein intellektuelles „wissen“.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  rationale: 'Gibt beide Bestandteile des hebräischen Gottesnamens wieder: אֲדֹנָי als „Herr“ und das Tetragramm יְהוִה in der transparenten deutschen Umschrift „JHWH“.'
theological_decisions:
- issue: Ägypten als Gegenstand von Israels fehlgeleitetem Vertrauen
  choice: kein Grund zum Vertrauen mehr
  alternative: keine Sicherheit mehr
  rationale: Die gewählte Fassung hält fest, dass Ägypten selbst als Grundlage politischen Vertrauens diente; sie formuliert nicht nur allgemein, dass Ägypten künftig keine Sicherheit bieten werde.
- issue: Bedeutungsumfang von עָוֺן
  choice: Schuld
  alternative: Sünde; Unrecht; Schuldstrafe
  rationale: „Schuld“ wahrt die Spannung zwischen schuldhaftem Handeln und daraus erwachsener Verantwortlichkeit, ohne den Ausdruck auf subjektive Schuldgefühle oder bereits vollzogene Strafe festzulegen.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  alternative: GOTT, der Herr; der Herr, Jahwe
  rationale: Die Fassung vermeidet die unnatürliche Doppelung „Herr HERR“, bewahrt aber sowohl den Titel als auch den im Ausgangstext stehenden Gottesnamen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korporative Redeweise „Haus Israel“ bleibt erhalten. Die mehrdeutige Beziehung von „Schuld“ sowie der pluralische Rückverweis „ihnen“ werden nicht stillschweigend vereindeutigt.
