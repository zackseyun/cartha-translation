  text: מִן הַ/מַּמְלָכוֹת֙ תִּהְיֶ֣ה שְׁפָלָ֔ה וְ/לֹֽא תִתְנַשֵּׂ֥א ע֖וֹד עַל הַ/גּוֹיִ֑ם וְ/הִ֨מְעַטְתִּ֔י/ם לְ/בִלְתִּ֖י רְד֥וֹת בַּ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/015.yaml
  text: It will be the lowliest of the kingdoms[a], and it will no longer exalt itself above the nations; and I will diminish them[d][c][b], so that they will not rule over the nations.
translation:
  language: de
  text: Es wird das niedrigste unter den Königreichen sein[a] und sich nicht mehr über die Nationen erheben[b]. Ich werde sie gering an Zahl machen[c], sodass sie nicht über die Nationen herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Es wird niedrig unter den Königreichen sein.“ Die hebräische Wendung stellt Ägypten als das niedrigste beziehungsweise am stärksten erniedrigte Königreich dar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nicht mehr über die Nationen erhöht werden“. Die hebräische Verbform kann sowohl reflexives Sich-Erheben als auch passives Erhöhtwerden ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Ich werde sie wenige machen.“ Die Mehrzahl bezieht sich kollektiv auf Ägyptens Bevölkerung beziehungsweise Macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמַּמְלָכוֹת תִּהְיֶה שְׁפָלָה
  choice: Es wird das niedrigste unter den Königreichen sein
  rationale: Das מן hat im Zusammenhang mit שְׁפָלָה vergleichende beziehungsweise superlativische Kraft. „Das niedrigste unter den Königreichen“ gibt Erniedrigung und Vergleich in natürlichem Deutsch wieder.
- source_word: וְלֹא תִתְנַשֵּׂא עוֹד עַל הַגּוֹיִם
  choice: und sich nicht mehr über die Nationen erheben
  rationale: Die Verbform kann reflexives Sich-Erheben oder passives Erhöhtwerden ausdrücken. Im Kontext politischer Überheblichkeit ist die reflexive Wiedergabe naheliegend, ohne das Bild des Erhebens aufzugeben.
- source_word: וְהִמְעַטְתִּים
  choice: Ich werde sie gering an Zahl machen
  rationale: Der Hifil von מעט bedeutet konkret „wenig machen“. Das pluralische Suffix bezieht sich kollektiv auf Ägyptens Bevölkerung beziehungsweise Macht.
- source_word: לְבִלְתִּי רְדוֹת
  choice: sodass sie nicht … herrschen
  rationale: לְבִלְתִּי bezeichnet hier die von Gott bewirkte Verhinderung als Zweck oder Folge; רדה bedeutet herrschen beziehungsweise Gewalt ausüben.
- source_word: בַּגּוֹיִם
  choice: über die Nationen
  rationale: Obwohl ב wörtlich „in/unter“ heißen kann, verlangt das deutsche Verb „herrschen“ für das Herrschaftsobjekt idiomatisch „über“.
theological_decisions:
- issue: Bezug des pluralischen Suffixes in וְהִמְעַטְתִּים
  choice: kollektiver Bezug auf Ägyptens Menschen beziehungsweise seine Macht
  alternative: grammatische Angleichung an das feminine Singularsubjekt „Ägypten“
  rationale: Der hebräische Text wechselt zum maskulinen Plural und betrachtet Ägypten offenbar kollektiv. Die deutsche Formulierung „sie gering an Zahl machen“ bewahrt diesen Wechsel, ohne den Bezug dogmatisch einzuengen.
- issue: Bedeutung von תִתְנַשֵּׂא
  choice: sich erheben
  alternative: erhöht werden
  rationale: Beide Nuancen sind grammatisch möglich. Der politische Zusammenhang spricht eher für Selbstüberhebung; eine Fußnote hält die passive Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nationen“ bewahrt die politische Bedeutung von גּוֹיִם; „Königreiche“ entspricht מַמְלָכוֹת. Der Wechsel vom Singular „Es“ zum kollektiven Plural „sie“ folgt bewusst dem hebräischen Text.
