base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/018.yaml
  text: Son of man[a], Nebuchadnezzar king of Babylon made his army labor greatly against Tyre; every head was made bald and every shoulder was rubbed bare[c][b], yet there was no pay for him or for his army from Tyre for the labor that he had performed against it.
translation:
  language: de
  text: Menschensohn[a], Nebukadnezar, der König von Babel, hat sein Heer gegen Tyrus schwere Arbeit leisten lassen. Alle Köpfe waren kahl gerieben, alle Schultern wund gescheuert[b]. Doch weder er noch sein Heer erhielten von Tyrus Lohn für die Arbeit, die er gegen die Stadt geleistet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Sohn eines Menschen“; eine häufige Anrede für Ezechiel, sinngemäß auch „Sterblicher“ oder „Mensch“.
    reason: lexical_alternative
  - marker: b
    text: Die kahlen Köpfe und wund gescheuerten Schultern veranschaulichen wahrscheinlich die körperliche Belastung durch die Belagerungsarbeiten.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die wörtliche, in Ezechiel wiederkehrende Anredeformel; die idiomatische Bedeutung wird in einer Fußnote erläutert.
- source_word: הֶעֱבִיד אֶת חֵילוֹ
  choice: hat sein Heer … Arbeit leisten lassen
  rationale: Gibt den kausativen Hifil von עבד wieder und versteht חַיִל im militärischen Zusammenhang als Heer.
- source_word: עֲבֹדָה גְדֹלָה
  choice: schwere Arbeit
  rationale: Drückt Umfang und Mühsal der Arbeit in natürlichem Deutsch aus, ohne die Wendung unnötig zu verstärken.
- source_word: אֶל צֹר
  choice: bei Tyrus
  rationale: Die Präposition bezeichnet hier den auf Tyrus gerichteten militärischen Einsatz; „bei Tyrus“ lässt den Belagerungskontext erkennen, ohne die Arbeit selbst unnatürlich als gegen die Stadt gerichtet zu formulieren.
- source_word: כָּל רֹאשׁ מֻקְרָח
  choice: Jeder Kopf wurde kahl
  rationale: Bewahrt die resultative beziehungsweise passive Aussage des hebräischen Partizips.
- source_word: וְכָל כָּתֵף מְרוּטָה
  choice: und jede Schulter wurde wund gescheuert
  rationale: Gibt das Abschürfen beziehungsweise Kahlreiben anschaulich und idiomatisch wieder.
- source_word: שָׂכָר
  choice: Lohn
  rationale: Bezeichnet die erwartete Vergütung für geleistete Arbeit und passt zur späteren göttlichen Entlohnung im Kontext.
- source_word: מִצֹּר
  choice: von Tyrus
  rationale: Gibt die Herkunft der ausbleibenden Beute beziehungsweise Vergütung direkt wieder.
- source_word: עַל הָעֲבֹדָה אֲשֶׁר עָבַד עָלֶיהָ
  choice: für die Arbeit, die er gegen die Stadt geleistet hatte
  rationale: Erhält das Arbeitsmotiv und macht den femininen Rückbezug auf Tyrus im Deutschen eindeutig.
theological_decisions:
- issue: Bedeutung von שָׂכָר im Zusammenhang des Feldzugs
  choice: Lohn
  alternative: Beute / Belohnung
  rationale: Der Text verwendet ausdrücklich die Sprache von Arbeit und Vergütung. „Lohn“ bewahrt dieses Bild, ohne festzulegen, in welcher konkreten Form die erwartete Vergütung bestanden hätte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Ezechiel-Anrede „Menschensohn“ bleibt als literarische Formel erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser klar und natürlich.
