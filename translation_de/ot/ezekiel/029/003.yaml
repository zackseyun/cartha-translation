base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/003.yaml
  text: 'Speak and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Pharaoh king of Egypt, the great sea monster lying in the midst of his Nile channels, who says, “My Nile is mine[b], and I made myself.”’'
translation:
  language: de
  text: 'Sprich und sage: So spricht der Herr Yahweh: Siehe, ich bin gegen dich, Pharao, König von Ägypten, du großes Ungeheuer[a], das mitten in seinen Nilarmen liegt und sagt: »Mein Nil gehört mir, und ich selbst habe mich gemacht.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „du großer Drache“; im Zusammenhang kann das Bild an ein krokodilartiges Nilungeheuer erinnern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mein Nil gehört mir, und ich habe ihn für mich gemacht.“ Der knappe hebräische Wortlaut kann entweder als Behauptung verstanden werden, Pharao habe sich selbst gemacht, oder als Prahlen damit, er habe den Nil für sich geschaffen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung aus אֲדֹנָי und dem Gottesnamen wird als Titel plus Eigenname wiedergegeben. So bleibt der im Hebräischen ausdrücklich gesetzte Bundesname erkennbar, ohne die beiden Bestandteile zu verschmelzen.
- source_word: הִנְנִי עָלֶיךָ
  choice: Siehe, ich gehe gegen dich vor
  rationale: „Siehe“ bewahrt den nachdrücklichen prophetischen Einsatz. Die feindliche Bedeutung von עַל wird im Deutschen mit „gegen dich vorgehen“ natürlich und eindeutig ausgedrückt.
- source_word: הַתַּנִּים הַגָּדוֹל
  choice: du großes Ungeheuer
  rationale: תַּנִּים bezeichnet hier ein riesiges reptilienartiges Wasser- oder Chaoswesen. „Ungeheuer“ erhält die bildhafte Weite, ohne vorschnell nur ein Krokodil oder einen späteren Drachentyp festzulegen.
- source_word: הָרֹבֵץ
  choice: das … liegt
  rationale: Das Partizip von רבץ bezeichnet ein ruhendes, lagerndes oder lauerndes Liegen. „Liegt“ ist im Bild des im Nil gelagerten Wesens klar und natürlich.
- source_word: בְּתוֹךְ יְאֹרָיו
  choice: mitten in seinen Nilarmen
  rationale: יְאֹר bezeichnet im ägyptischen Zusammenhang den Nil und seine Wasserläufe. Der Plural wird mit „Nilarmen“ idiomatisch wiedergegeben; das Possessivsuffix bleibt als „seinen“ erhalten.
- source_word: לִי יְאֹרִי
  choice: Mein Nil gehört mir
  rationale: Die knappe hebräische Besitzbehauptung wird in natürlichem Deutsch ausdrücklich als Anspruch auf den Nil formuliert.
- source_word: וַאֲנִי עֲשִׂיתִנִי
  choice: und ich selbst habe mich gemacht
  rationale: Das Objektsuffix der ersten Person Singular wird unmittelbar reflexiv verstanden. „Ich selbst“ hebt den anmaßenden Selbstschöpfungsanspruch hervor, ohne die mögliche alternative Deutung zu verschweigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die Übersetzung lässt den im Ausgangstext stehenden Gottesnamen als Namen sichtbar und bewahrt zugleich אֲדֹנָי als Titel.
- issue: Deutung von וַאֲנִי עֲשִׂיתִנִי
  choice: 'Pharao behauptet: „Ich selbst habe mich gemacht.“'
  alternative: Pharao behauptet, er habe den Nil für sich gemacht.
  rationale: Das masoretisch überlieferte Objektsuffix spricht am unmittelbarsten für die reflexive Aussage. Da die knappe Syntax auch anders bezogen worden ist, wird die sachlich wichtige Alternative in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Nachdruck. Die Anrede „du großes Ungeheuer“ macht die Apposition im Deutschen klar. Bildsprache und syntaktisch-theologische Mehrdeutigkeit werden bewahrt und nicht konfessionell aufgelöst.
