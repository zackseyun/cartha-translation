source:
  edition: WLC
  text: וְ/שַׁבְתִּי֙ אֶת שְׁב֣וּת מִצְרַ֔יִם וַ/הֲשִׁבֹתִ֤י אֹתָ/ם֙ אֶ֣רֶץ פַּתְר֔וֹס עַל אֶ֖רֶץ מְכֽוּרָתָ֑/ם וְ/הָ֥יוּ שָׁ֖ם מַמְלָכָ֥ה שְׁפָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/014.yaml
  text: And I will restore the fortunes of Egypt and bring them back to the land of Pathros[a], to the land of their origin[b], and there they will be a lowly kingdom.
translation:
  language: de
  text: Und ich werde das Geschick Ägyptens wenden[a] und sie in das Land Patros zurückbringen, in das Land ihrer Herkunft[b], und dort werden sie ein unbedeutendes Königreich sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gefangenen Ägyptens zurückbringen“; auch: „die Gefangenschaft Ägyptens wenden“. Die hebräische Wendung kann wörtlicher auf Gefangenschaft bezogen werden, meint hier aber wahrscheinlich umfassender die Wiederherstellung Ägyptens.'
    reason: lexical_alternative
  - marker: b
    text: Patros war eine Region in Oberägypten und wird hier als das Herkunftsland der Ägypter bezeichnet.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת־שְׁבוּת מִצְרַיִם
  choice: Und ich werde das Geschick Ägyptens wenden
  rationale: Die feste Wendung שׁוּב שְׁבוּת bezeichnet häufig die Wiederherstellung früherer Verhältnisse oder eine Wende des Geschicks. Diese idiomatische Wiedergabe vermeidet eine unnötige Wiederholung der im nächsten Satzteil ausdrücklich genannten Rückkehr.
- source_word: וַהֲשִׁבֹתִי אֹתָם
  choice: und sie ... zurückbringen
  rationale: 'Der Hifil von שׁוּב ist kausativ: Gott bewirkt ihre Rückkehr. „Zurückbringen“ gibt dies in natürlichem Deutsch wieder.'
- source_word: אֶרֶץ פַּתְרוֹס
  choice: in das Land Patros
  rationale: אֶרֶץ wird als „Land“ beibehalten; der Ortsname פַּתְרוֹס wird als „Patros“ transliteriert.
- source_word: עַל אֶרֶץ מְכוּרָתָם
  choice: in das Land ihrer Herkunft
  rationale: מְכוּרָה bezeichnet Herkunfts- oder Geburtsland. עַל wird im Zusammenhang der gerichteten Rückkehr sinngemäß mit „in“ wiedergegeben; die Formulierung steht erläuternd zu Patros.
- source_word: וְהָיוּ שָׁם
  choice: Dort werden sie ... sein
  rationale: Die Voranstellung von „Dort“ bewahrt die örtliche Betonung und klingt im Deutschen natürlich.
- source_word: מַמְלָכָה שְׁפָלָה
  choice: ein niedriges Königreich
  rationale: שָׁפָל bezeichnet etwas Niedriges beziehungsweise in Rang und Macht Herabgesetztes. „Niedriges Königreich“ bewahrt den Bezug auf den verminderten politischen Rang deutlicher als „demütiges Königreich“.
theological_decisions:
- issue: Bedeutung der Wiederherstellungsformel שׁוּב שְׁבוּת
  choice: das Geschick Ägyptens wenden
  alternative: die Gefangenen Ägyptens zurückbringen / die Gefangenschaft Ägyptens wenden
  rationale: Die Wendung kann konkret auf Gefangenschaft und Rückkehr bezogen werden, bezeichnet prophetisch jedoch oft allgemeiner die Umkehr eines Zustands. Da der folgende Satzteil die tatsächliche Rückkehr ausdrücklich nennt, bleibt im Haupttext die breitere idiomatische Bedeutung erhalten; die wörtlicheren Möglichkeiten stehen in der Fußnote.
- issue: Funktion von עַל in עַל אֶרֶץ מְכוּרָתָם
  choice: in das Land ihrer Herkunft
  alternative: auf das Land ihrer Herkunft
  rationale: Obwohl עַל häufig „auf/über“ bedeutet, verlangt der Bewegungskontext im Deutschen eine Richtungsangabe. Die Wiedergabe mit „in“ macht Patros als Zielgebiet deutlich, ohne die Aussage theologisch zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem Hebräischen eng, wird aber für einen natürlichen deutschen Lesefluss in zwei Sätze gegliedert. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar bei der erklärungsbedürftigen Wendung.
