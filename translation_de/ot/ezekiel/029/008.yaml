source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י מֵבִ֥יא עָלַ֖יִ/ךְ חָ֑רֶב וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ אָדָ֥ם וּ/בְהֵמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am bringing a sword against you[b], and I will cut off from you man and beast.'
translation:
  language: de
  text: 'Darum spricht der Herr Jahwe: Sieh, ich bringe ein Schwert über dich[a] und werde Mensch und Tier aus dir entfernen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ein Schwert“ kann hier kollektiv für Krieg und das dadurch vollzogene Gericht stehen.
    reason: lexical_alternative
  - marker: b
    text: „Mensch und Tier“ ist eine feste Gerichtsformel, die Menschen und Tiere gemeinsam umfasst.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Funktion der Partikel knapp und natürlich wieder und leitet das Gericht als Folge der vorherigen Anklage ein.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die geläufige, würdevolle Botenformel prophetischer Rede.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: 'Gibt beide Bestandteile des Titels wieder: אֲדֹנָי als „Herr“ und den Gottesnamen יהוה als „Jahwe“, ohne sie zu einem einzigen Titel zu verschmelzen.'
- source_word: הִנְנִי
  choice: Sieh
  rationale: Markiert die feierliche, nachdrückliche Ankündigung Gottes in verständlichem modernem Deutsch.
- source_word: מֵבִיא
  choice: ich bringe
  rationale: Das Partizip mit הִנְנִי stellt das kommende Handeln als unmittelbar bevorstehend und anschaulich dar.
- source_word: עָלַיִךְ חָרֶב
  choice: ein Schwert über dich
  rationale: Bewahrt das Bild des über das personifizierte Ägypten kommenden Schwertes; der feminine Bezug von עָלַיִךְ lässt sich beim deutschen „dich“ nicht sichtbar ausdrücken.
- source_word: וְהִכְרַתִּי
  choice: und werde … ausrotten
  rationale: כרת im Hifil bezeichnet hier die gewaltsame Beseitigung beziehungsweise Vernichtung; „ausrotten“ ist im Deutschen klarer und idiomatischer als das wörtliche „abschneiden“.
- source_word: מִמֵּךְ
  choice: aus dir
  rationale: Behält das Bild Ägyptens als angesprochener Größe bei, aus deren Bereich Menschen und Tiere beseitigt werden.
- source_word: אָדָם וּבְהֵמָה
  choice: Mensch und Tier
  rationale: Gibt die feste umfassende Gerichtsformel knapp und geschlechtsübergreifend wieder.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Fassung hält Titel und Eigenname auseinander und macht den im hebräischen Text ausdrücklich stehenden Gottesnamen sichtbar.
- issue: Reichweite des Schwertbildes
  choice: ein Schwert
  alternative: das Schwert / Krieg
  rationale: Der unbestimmte Singular wird formal bewahrt, ohne seine mögliche kollektive Bedeutung als Bild für Krieg und Gericht im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Botenformel. „Sieh“ ist nachdrücklich, aber weniger altertümlich als „Siehe“. Die Anrede richtet sich im Hebräischen in weiblicher Einzahl an das personifizierte Ägypten; diese grammatische Form ist im deutschen „dich“ nicht erkennbar.
