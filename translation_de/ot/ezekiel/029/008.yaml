  source_fidelity: 'Der Entwurf gibt die Satzfolge und die zentralen Lexeme des Hebräischen im Wesentlichen treffend wieder: לָכֵן ist folgernd, die Botenformel bleibt erhalten, אֲדֹנָי יְהוִה wird als „der Herr Jahwe“ transparent wiedergegeben, und das unbestimmte „ein Schwert“ wahrt das Kriegs- bzw. Gerichtsbild. „Mensch und Tier“ trifft die umfassende Formel אָדָם וּבְהֵמָה. Die feminine Singularanrede an das personifizierte Ägypten kann im Deutschen nicht abgebildet werden.'
