  terminology: „der Herr Jahwe“ gibt den Titel אֲדֹנָי יְהוִה sachgerecht und ohne eine konfessionell vorgeprägte Umschreibung wieder. „Schwert“ und „Mensch und Tier“ bewahren die terminologische und bildliche Prägnanz des Ausgangstextes.
