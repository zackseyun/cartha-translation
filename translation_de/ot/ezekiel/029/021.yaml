source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא אַצְמִ֤יחַ קֶ֨רֶן֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל וּ/לְ/ךָ֛ אֶתֵּ֥ן פִּתְחֽוֹן פֶּ֖ה בְּ/תוֹכָ֑/ם וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/021.yaml
  text: On that day I will cause a horn to sprout for the house of Israel[a], and I will give you an opening of the mouth among them[b], and they will know that I am Yahweh.
translation:
  language: de
  text: An jenem Tag lasse ich für das Haus Israel ein Horn hervorsprossen[a], und dir werde ich unter ihnen den Mund öffnen[b]. Und sie werden erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lasse ich ein Horn wachsen“. Das Horn ist hier ein Bild für Stärke, Würde oder neu gewonnene Macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werde ich dir unter ihnen eine Öffnung des Mundes geben“. Die hebräische Wendung bedeutet, dass jemand zum Reden befähigt oder ermächtigt wird; sie erinnert wahrscheinlich an Ezechiels zuvor eingeschränktes Sprechen.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige deutsche prophetische Zeitangabe gibt den hebräischen Ausdruck klar und würdig wieder.
- source_word: אַצְמִיחַ
  choice: lasse ich … hervorsprossen
  rationale: Die Kausativform von צמח bezeichnet das Veranlassen von Sprossen oder Wachstum. „Hervorsprossen lassen“ bewahrt das pflanzliche Bild.
- source_word: קֶרֶן
  choice: ein Horn
  rationale: Das konkrete Bild steht für Stärke, Würde oder erhöhte Macht. Die wörtliche Wiedergabe bewahrt die Metapher, ohne sie vorschnell auf eine einzige Deutung festzulegen.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: Die feste biblische Bezeichnung wird beibehalten und nicht zum bloßen „Israel“ verkürzt.
- source_word: וּלְךָ אֶתֵּן פִּתְחוֹן פֶּה
  choice: und dir werde ich … den Mund öffnen
  rationale: Natürliches Deutsch für die hebräische Wendung „eine Öffnung des Mundes geben“; die direkte Anrede des Propheten und das Bild des geöffneten Mundes bleiben erhalten.
- source_word: בְּתוֹכָם
  choice: unter ihnen
  rationale: Eine klare, moderne Wiedergabe des gemeinschaftlichen Bezugs; gemeint ist das Sprechen inmitten der Angeredeten.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: „Dann“ verdeutlicht in natürlichem Deutsch die Folgewirkung, die durch die hebräische Satzverknüpfung ausgedrückt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung des hervorsprossenden Horns
  choice: Das Bild „Horn“ bleibt als offene Metapher für neu aufkommende Stärke, Würde oder Macht Israels stehen.
  alternative: Die Metapher mit „Stärke“ oder „Macht“ auflösen oder ausdrücklich auf eine messianische Gestalt beziehen.
  rationale: Der Vers selbst bestimmt das Horn nicht eindeutig als bestimmte Person. Die bildhafte Form wahrt sowohl den unmittelbaren Sinn erneuerter Stärke als auch mögliche weiterführende Bezüge.
- issue: Öffnung des Mundes für Ezechiel
  choice: Die Wendung wird als von Gott gewährte Befähigung oder Erlaubnis zum Sprechen wiedergegeben, ohne Art und Dauer näher festzulegen.
  alternative: Eine endgültige Aufhebung von Ezechiels Verstummen oder ausdrücklich „freimütiges Reden“ formulieren.
  rationale: Der Wortlaut erinnert wahrscheinlich an Ezechiels eingeschränktes Sprechen, sagt hier jedoch nur, dass Gott ihm unter dem Volk den Mund öffnen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen, theologisch offenen Bilder des hebräischen Textes werden bewahrt; die idiomatische Wendung vom geöffneten Mund wird leicht geglättet und in der Fußnote erläutert.
