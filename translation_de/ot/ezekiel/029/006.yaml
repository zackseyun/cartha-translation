  text: וְ/יָֽדְעוּ֙ כָּל יֹשְׁבֵ֣י מִצְרַ֔יִם כִּ֖י אֲנִ֣י יְהוָ֑ה יַ֧עַן הֱיוֹתָ֛/ם מִשְׁעֶ֥נֶת קָנֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/006.yaml
  text: Then all the inhabitants of Egypt will know that I am Yahweh[a], because they were a staff of reed to the house of Israel.
translation:
  language: de
  text: Dann werden alle Bewohner Ägyptens erkennen, dass ich Jahwe bin, weil sie für das Haus Israel ein Stab aus Schilfrohr[a] waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Stütze aus Schilfrohr“. Gemeint ist etwas, worauf man sich stützt, das aber zu schwach ist, um Gewicht zu tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Dann werden … erkennen
  rationale: Das Waw führt im prophetischen Zusammenhang die Folge weiter; „dann“ gibt diesen Zusammenhang natürlich wieder. ידע wird in Hesekiels Erkenntnisformel mit „erkennen“ übersetzt.
- source_word: כָּל יֹשְׁבֵי מִצְרַיִם
  choice: alle Bewohner Ägyptens
  rationale: Gibt die Gesamtheit der in Ägypten Wohnenden präzise und in modernem Deutsch natürlich wieder.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: כִּי leitet hier den Inhalt des Erkennens ein; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: יַעַן הֱיוֹתָם
  choice: weil sie … gewesen sind
  rationale: יַעַן nennt den Grund des Gerichts; der Infinitiv mit Suffix wird im Deutschen idiomatisch als finiter Nebensatz ausgedrückt.
- source_word: מִשְׁעֶנֶת קָנֶה
  choice: eine Stütze aus Schilfrohr
  rationale: מִשְׁעֶנֶת bezeichnet etwas, worauf man sich stützt; קָנֶה benennt das schwache Rohrmaterial. Die Formulierung bewahrt das Bild und klingt im Deutschen verständlich.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: ל bezeichnet hier die Beziehung beziehungsweise vermeintliche Hilfe für Israel; „Haus Israel“ bewahrt die korporative biblische Bezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den offenbarten Bundesnamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Rohr-Metapher
  choice: Das Bild bleibt als „Stütze aus Schilfrohr“ stehen
  alternative: eine unzuverlässige Hilfe
  rationale: Der Vers bezeichnet Ägypten bildhaft als scheinbare, aber schwache Stütze. Eine rein deutende Wiedergabe würde das im Folgevers entfaltete Bild vorwegnehmend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Erkenntnisformel und das konkrete Bild des Hebräischen bleiben erhalten; „Stütze“ verdeutlicht die Funktion von מִשְׁעֶנֶת, ohne die Metapher aufzulösen.
