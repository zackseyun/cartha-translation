  text: Son of man[a], set your face against Pharaoh king of Egypt, and prophesy against him and against all Egypt.
translation:
  language: de
  text: Menschensohn[a], richte dein Gesicht gegen den Pharao, den König von Ägypten, und prophezeie gegen ihn und gegen ganz Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sterblicher“ oder „Mensch“. Die hebräische Anrede בֶּן אָדָם (ben adam) richtet sich wiederholt an Hesekiel und kann auch „Sterblicher“ oder „Mensch“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel wiederkehrende Anrede wird formnah und in der deutschen Bibelsprache verständlich wiedergegeben; die mögliche Bedeutung als Hinweis auf die menschliche Sterblichkeit wird in der Fußnote bewahrt.
- source_word: שִׂים פָּנֶיךָ
  choice: richte dein Gesicht
  rationale: Die Wiedergabe erhält das hebräische Bild einer bewussten, entschlossenen Ausrichtung; zusammen mit „gegen“ wird der feindliche Sinn im Gerichtskontext deutlich.
- source_word: עַל
  choice: gegen
  rationale: Sowohl bei der Ausrichtung des Gesichts als auch beim Weissagen hat die Präposition in diesem Gerichtswort adversative Kraft.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: den Pharao, den König von Ägypten
  rationale: Der Königstitel wird in natürlichem Deutsch appositionell wiedergegeben.
- source_word: וְהִנָּבֵא
  choice: und weissage
  rationale: „Weissage“ gibt den Nifal-Imperativ von נבא knapp und als traditionelle prophetische Auftragssprache wieder.
- source_word: מִצְרַיִם כֻּלָּהּ
  choice: ganz Ägypten
  rationale: Die Formulierung gibt den umfassenden Bezug auf das gesamte Land beziehungsweise Volk prägnant wieder.
theological_decisions: []
