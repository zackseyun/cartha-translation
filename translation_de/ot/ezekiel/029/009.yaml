source:
  edition: WLC
  text: וְ/הָיְתָ֤ה אֶֽרֶץ מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה וְ/חָרְבָּ֔ה וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה יַ֧עַן אָמַ֛ר יְאֹ֥ר לִ֖/י וַ/אֲנִ֥י עָשִֽׂיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/009.yaml
  text: And the land of Egypt will become a desolation and a waste[a], and they will know that I am Yahweh, because he said, ‘The Nile is mine, and I made it.’
translation:
  language: de
  text: 'Und das Land Ägypten wird zu einer Einöde und Verwüstung werden. Dann werden sie erkennen, dass ich Jahwe bin, weil er gesagt hat: »Der Nil[a] gehört mir, und ich habe ihn gemacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Fluss«; im Zusammenhang mit Ägypten ist der Nil gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird … werden
  rationale: Das Qal-Perfekt mit vorangestelltem וְ trägt im prophetischen Zusammenhang Zukunfts- beziehungsweise Folgesinn. Die Formulierung bezeichnet den Übergang in den angekündigten Zustand.
- source_word: אֶרֶץ מִצְרַיִם
  choice: das Land Ägypten
  rationale: Bewahrt den konkreten territorialen Sinn von אֶרֶץ und klingt zugleich natürlich auf Deutsch.
- source_word: לִשְׁמָמָה וְחָרְבָּה
  choice: zu einer Einöde und Trümmerstätte
  rationale: Die beiden Substantive schildern überlappend die völlige Verwüstung. „Einöde“ bezeichnet den verwüsteten, verlassenen Zustand; „Trümmerstätte“ gibt den Ruinencharakter von חָרְבָּה wieder, ohne beide Begriffe unterschiedslos zu übersetzen.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Gibt die für Ezechiel typische Erkenntnisformel wieder. „Dann“ macht den Folgezusammenhang idiomatisch deutlich, ohne das unbestimmte plurale Subjekt näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und bewahrt seine besondere Aussagekraft.
- source_word: יַעַן אָמַר
  choice: weil er gesagt hat
  rationale: יַעַן leitet den Grund für das Gericht ein. Das maskuline Singularsubjekt bleibt wie im Hebräischen unausgesprochen und wird mit „er“ wiedergegeben.
- source_word: יְאֹר
  choice: der Nil
  rationale: יְאֹר bezeichnet im ägyptischen Zusammenhang den Nil. Die konkrete Wiedergabe macht den gemeinten Strom unmittelbar verständlich; die allgemeinere wörtliche Bedeutung wird in der Fußnote genannt.
- source_word: לִי
  choice: gehört mir
  rationale: Gibt die prädikative Besitzangabe natürlich wieder und bewahrt den anmaßenden Eigentumsanspruch des Sprechers.
- source_word: וַאֲנִי עָשִׂיתִי
  choice: und ich habe ihn gemacht
  rationale: Das ausdrücklich gesetzte אֲנִי unterstreicht den eigenen Anspruch des Sprechers. „gemacht“ entspricht dem gewöhnlichen Verb עָשָׂה besser als das stärker theologisch besetzte „erschaffen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Anspruch des ägyptischen Herrschers, den Nil gemacht zu haben
  choice: Die anmaßende Aussage wird unverändert als direkte Rede wiedergegeben.
  alternative: Eine erläuternde oder abschwächende Umschreibung
  rationale: Der Text stellt den Anspruch als Grund des göttlichen Gerichts dar. Die Übersetzung soll diese theologische Spannung bewahren und den Satz nicht vorweg kommentieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Verwüstungsbegriffe bleiben als substantivisches Paar erhalten. Die direkte Rede ist knapp und nachdrücklich; das unbestimmte „sie“ der Erkenntnisformel wird nicht interpretierend konkretisiert.
