  text: וּ/נְטַשְׁתִּ֣י/ךָ הַ/מִּדְבָּ֗רָ/ה אוֹתְ/ךָ֙ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ עַל פְּנֵ֤י הַ/שָּׂדֶה֙ תִּפּ֔וֹל לֹ֥א תֵאָסֵ֖ף וְ/לֹ֣א תִקָּבֵ֑ץ לְ/חַיַּ֥ת הָ/אָ֛רֶץ וּ/לְ/ע֥וֹף הַ/שָּׁמַ֖יִם נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/005.yaml
  text: I will cast you into the wilderness[a], you and all the fish of your streams. You will fall on the open field; you will not be gathered or collected[c][b]. I have given you as food to the beasts of the earth and to the birds of the heavens.
translation:
  language: de
  text: Ich werde dich in die Wüste werfen, dich und alle Fische deiner Nilarme.[a] Auf freiem Feld wirst du fallen; du wirst weder aufgelesen noch eingesammelt werden.[b] Den wilden Tieren des Landes und den Vögeln des Himmels habe ich dich zum Fraß gegeben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Fische deiner Wasserarme“. Das hebräische Wort bezeichnet im ägyptischen Zusammenhang häufig den Nil und seine Kanäle.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „Du wirst nicht gesammelt und nicht zusammengebracht werden.“ Die beiden fast gleichbedeutenden Verben verstärken die Aussage; im Zusammenhang kann dies bedeuten, dass niemand den Leichnam bergen oder bestatten wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht hier die vollendete Form: „Ich habe dich zum Fraß gegeben.“ Sie stellt das angekündigte Gericht als sicher dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Ich werde dich … schleudern
  rationale: נטשׁ kann „verlassen“, „preisgeben“ oder „wegwerfen“ bedeuten. Im Zusammenhang des Gerichts und der Aussetzung in der Wüste gibt „schleudern“ die gewaltsame Beseitigung anschaulich wieder.
- source_word: הַמִּדְבָּרָה
  choice: in die Wüste
  rationale: Die Richtungsendung bezeichnet eine Bewegung zur Wüste hin; „in die Wüste“ ist im Deutschen natürlich und bewahrt den trostlosen Schauplatz.
- source_word: דְּגַת יְאֹרֶיךָ
  choice: alle Fische deiner Nilarme
  rationale: דגה ist ein Kollektivum für „Fische“. יְאֹר bezeichnet im ägyptischen Kontext gewöhnlich den Nil oder seine Wasserarme; „Nilarme“ macht diesen Kontext präzise und verständlich.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: auf freiem Feld
  rationale: Die Wendung beschreibt die offen daliegende Fläche des Feldes und betont Ausgesetztheit und Schutzlosigkeit.
- source_word: תִּפּוֹל
  choice: wirst du fallen
  rationale: Die einfache Zukunftsform entspricht der Abfolge der angekündigten Gerichtshandlungen.
- source_word: לֹא תֵאָסֵף וְלֹא תִקָּבֵץ
  choice: du wirst weder aufgelesen noch eingesammelt werden
  rationale: Die beiden nahezu synonymen Verben werden differenziert wiedergegeben, ohne ihre verstärkende Wiederholung aufzugeben. Im Kontext ist wohl das Bergen beziehungsweise Bestatten des Leichnams gemeint.
- source_word: לְחַיַּת הָאָרֶץ
  choice: den wilden Tieren des Landes
  rationale: חיה bezeichnet in diesem Aasfraßmotiv wilde Tiere. „Des Landes“ entspricht הָאָרֶץ hier natürlicher als „der Erde“.
- source_word: וּלְעוֹף הַשָּׁמַיִם
  choice: und den Vögeln des Himmels
  rationale: Die geläufige biblische Wendung bleibt in würdigem, verständlichem Deutsch erhalten.
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: habe ich dich zum Fraß gegeben
  rationale: Das Perfekt wird als prophetisches Perfekt beibehalten. „Zum Fraß“ ist im Zusammenhang mit wilden Tieren und Vögeln idiomatisch und gibt die Härte des Gerichts wieder.
theological_decisions:
- issue: Prophetisches Perfekt im Schlusssatz
  choice: habe ich dich zum Fraß gegeben
  alternative: werde ich dich zum Fraß geben
  rationale: Das hebräische Perfekt נְתַתִּיךָ stellt das kommende Gericht als gewiss und gleichsam bereits vollzogen dar. Die deutsche Perfektform bewahrt diese Spannung, statt sie in ein schlichtes Futur aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger prophetischer Bildsprache. „Nilarme“ macht den ägyptischen Bezug im Haupttext sichtbar; die Fußnote bewahrt die allgemeinere lexikalische Möglichkeit. Die beiden Verben für das ausbleibende Bergen werden bewusst nicht zu einer einzigen Aussage verschmolzen.
