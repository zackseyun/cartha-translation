base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/004.yaml
  text: I will put hooks in your jaws[a], and I will make the fish of your Nile channels cling to your scales; and I will bring you up from the midst of your Nile channels[b], and all the fish of your Nile channels will cling to your scales.
translation:
  language: de
  text: Ich werde Haken in deine Kiefer[a] legen und die Fische deiner Nilkanäle[b] an deinen Schuppen haften lassen. Und ich werde dich aus der Mitte deiner Nilkanäle heraufholen, und alle Fische deiner Nilkanäle werden an deinen Schuppen haften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in deine Wangen«. Das hebräische Wort kann »Kiefer« oder »Wange« bedeuten; »Kiefer« passt hier zum Bild eines gefangenen Wassertiers.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Flüsse« oder »Kanäle«. Das hebräische Wort bezeichnet im ägyptischen Zusammenhang den Nil und seine Wasserläufe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חחיים
  choice: Haken
  rationale: Das Substantiv bezeichnet hier Fanggeräte, mit denen das als großes Wassertier dargestellte Gegenüber gepackt und aus dem Wasser gezogen wird.
- source_word: בִּלְחָיֶיךָ
  choice: in deine Kiefer
  rationale: לְחִי kann »Kiefer« oder »Wange« bedeuten. Im Bild eines mit Haken gefangenen Wassertiers ist »Kiefer« im Deutschen am natürlichsten, ohne die lexikalische Alternative zu verschweigen.
- source_word: וְהִדְבַּקְתִּי
  choice: haften lassen
  rationale: 'Der Hifil von דבק ist kausativ: Gott bewirkt, dass die Fische an den Schuppen haften. »Haften lassen« gibt diese Verursachung knapp und idiomatisch wieder.'
- source_word: דְגַת
  choice: die Fische
  rationale: Die hebräische Kollektivform wird im Deutschen natürlich als Plural wiedergegeben.
- source_word: יְאֹרֶיךָ
  choice: deine Nilkanäle
  rationale: יְאֹר bezeichnet im ägyptischen Kontext den Nil und seine Wasserläufe; der Plural wird durch »Nilkanäle« sichtbar erhalten.
- source_word: בְּקַשְׂקְשֹׂתֶיךָ
  choice: an deinen Schuppen
  rationale: Mit דבק bezeichnet die Präposition die Stelle der Anhaftung; »an deinen Schuppen haften« ist natürliches Deutsch.
- source_word: וְהַעֲלִיתִיךָ
  choice: ich werde dich ... heraufholen
  rationale: Der Hifil von עלה bezeichnet das Veranlassen des Heraufkommens. »Heraufholen« bewahrt das Bild des Herausziehens aus dem Wasser, ohne das Mittel zusätzlich festzulegen.
- source_word: מִתּוֹךְ
  choice: aus der Mitte
  rationale: Die Wendung betont, dass das Tier aus dem Inneren der Nilgewässer herausgeholt wird.
- source_word: תִּדְבָּק
  choice: haften werden
  rationale: Das Qal bezeichnet das Haften der kollektiv verstandenen Fische; der deutsche Plural entspricht dem Sinn.
