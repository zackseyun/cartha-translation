base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/027.yaml
  text: And I will put my Spirit within you[a], and I will cause you to walk in my statutes[b], and you will keep my judgments and do them.
translation:
  language: de
  text: Und ich werde meinen Geist in euer Inneres geben und bewirken, dass ihr nach meinen Satzungen[a] lebt, meine Rechtsbestimmungen[b] bewahrt und danach handelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ordnungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rechtssprüche“ oder „Ordnungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: meinen Geist
  rationale: Im Zusammenhang der inneren Erneuerung bezeichnet רוּחַ mit Suffix Gottes eigenen Geist, nicht Atem oder Wind. Die Großschreibung entspricht im Deutschen dem göttlichen Bezug.
- source_word: בְּקִרְבְּכֶם
  choice: in euer Inneres
  rationale: Die Wendung kann den inneren Bereich oder die Mitte bezeichnen. Zusammen mit dem neuen Herzen im Kontext hebt sie hier die innere Erneuerung hervor.
- source_word: וְעָשִׂיתִי אֵת אֲשֶׁר
  choice: und bewirken, dass
  rationale: Die hebräische Konstruktion beschreibt Gottes Handeln als Ursache dafür, dass das Volk entsprechend lebt. „Bewirken“ gibt diese wirksame göttliche Initiative in natürlichem Deutsch wieder.
- source_word: בְּחֻקַּי תֵּלֵכוּ
  choice: nach meinen Satzungen lebt
  rationale: הלך („gehen“) ist hier ein Bild für die Lebensführung. „Nach … lebt“ vermittelt die Bedeutung in heutigem Deutsch, ohne den Bezug auf das gesamte Verhalten einzuengen.
- source_word: חֻקַּי
  choice: meinen Satzungen
  rationale: חֹק/חֻקָּה bezeichnet festgesetzte Vorschriften. „Satzungen“ wahrt den rechtlich-bündischen Ton und unterscheidet den Begriff von מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּט kann Rechtsspruch, Recht, Urteil oder verbindliche Ordnung bedeuten. Im Paar mit חֻקִּים gibt „Rechtsbestimmungen“ die rechtliche Bedeutung klar wieder.
- source_word: תִּשְׁמְרוּ
  choice: bewahrt
  rationale: שׁמר bedeutet im Zusammenhang von Geboten, sie zu bewahren, zu beachten oder einzuhalten. „Bewahrt“ hält die Grundbedeutung fest und passt zum anschließenden praktischen Handeln.
- source_word: וַעֲשִׂיתֶם
  choice: und danach handelt
  rationale: Das abschließende עשה betont die tatsächliche Ausführung. „Danach handelt“ ist idiomatisches Deutsch und macht deutlich, dass die Rechtsbestimmungen praktisch umgesetzt werden.
theological_decisions:
- issue: Göttliches Wirken und menschlicher Gehorsam
  choice: und bewirken, dass ihr … lebt … bewahrt und danach handelt
  alternative: und dafür sorgen, dass ihr … lebt
  rationale: Der hebräische Text stellt Gottes wirksames Handeln als Grund des folgenden Gehorsams dar und spricht zugleich das Handeln des Volkes aus. Die Formulierung erhält beide Seiten, ohne die Spannung durch ein späteres theologisches System aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In euer Inneres“ bewahrt die räumlich-innerliche Ausdrucksweise; „nach … lebt“ gibt das hebräische Bild des Wandelns verständlich wieder. Die beiden Rechtstermini werden im Haupttext voneinander unterschieden.
