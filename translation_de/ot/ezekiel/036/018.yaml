  text: וָ/אֶשְׁפֹּ֤ךְ חֲמָתִ/י֙ עֲלֵי/הֶ֔ם עַל הַ/דָּ֖ם אֲשֶׁר שָׁפְכ֣וּ עַל הָ/אָ֑רֶץ וּ/בְ/גִלּוּלֵי/הֶ֖ם טִמְּאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/018.yaml
  text: So I poured out my wrath upon them for the blood that they had poured out on the land[a], and because they had defiled it with their idols.
translation:
  language: de
  text: Da goss ich meinen Zorn über sie aus wegen des Blutes, das sie im Land vergossen hatten, und weil sie es mit ihren Götzen[a] verunreinigt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort גִּלּוּלִים ist eine stark verächtliche Bezeichnung für Götzen; sinngemäß könnte man auch „Mistgötzen“ sagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: Da goss ich … aus
  rationale: Das Qal-Wayyiqtol von שׁפך bezeichnet das Ausgießen; die Formulierung ist im Deutschen idiomatisch und bewahrt zugleich die Verbindung zum späteren שָׁפְכוּ.
- source_word: חֲמָתִי
  choice: meinen Zorn
  rationale: חֵמָה bezeichnet hier Gottes heftigen, gerichtlichen Zorn. „Zorn“ ist würdevoll und verständlich, ohne den Ausdruck auf bloße Emotionalität zu verengen.
- source_word: עֲלֵיהֶם
  choice: über sie
  rationale: Zusammen mit „ausgießen“ gibt „über sie“ das Bild des über die Betroffenen ausgegossenen Zorns natürlich wieder.
- source_word: עַל הַדָּם אֲשֶׁר שָׁפְכוּ
  choice: wegen des Blutes, das sie … vergossen hatten
  rationale: „Wegen“ macht den Grund des Gerichts deutlich. „Goss … aus“ und „vergossen“ bewahren im Deutschen die Wiederholung desselben hebräischen Verbstamms so weit wie idiomatisch möglich.
- source_word: עַל הָאָרֶץ
  choice: im Land
  rationale: הָאָרֶץ meint im Kontext wahrscheinlich das Land Israel. Bei „Blut vergießen“ ist „im Land“ natürliches modernes Deutsch und vermeidet die mögliche ländliche Bedeutung von „auf dem Land“.
- source_word: וּבְגִלּוּלֵיהֶם
  choice: und weil sie es mit ihren Götzen verunreinigt hatten
  rationale: Die Konstruktion nennt neben dem Blutvergießen auch die Götzen als Grund beziehungsweise Mittel der Verunreinigung. „Götzen“ ist klar und bereits abwertend; die besonders verächtliche Färbung von גִּלּוּלִים wird in der Fußnote erläutert.
- source_word: טִמְּאוּהָ
  choice: sie es … verunreinigt hatten
  rationale: Das Piel von טמא bedeutet „verunreinigen/entweihen“. Das Suffix bezieht sich auf das Land; „es“ nimmt diesen Bezug auf.
theological_decisions:
- issue: Charakter der Sprache vom göttlichen Gericht
  choice: „meinen Zorn“; die beiden Gründe des Gerichts bleiben ausdrücklich genannt
  alternative: „meinen Grimm“ oder „meine Wut“
  rationale: Der Vers beschreibt Gottes Reaktion als begründetes Gericht über Blutvergießen und götzendienerische Verunreinigung. „Zorn“ wahrt diese ernste, gerichtliche Dimension, ohne mehr auszusagen als der Text.
- issue: Referent von הָאָרֶץ
  choice: „das Land“
  alternative: „die Erde“
  rationale: Im Zusammenhang des Ezechielbuches geht es hier um die Verunreinigung des Landes Israel. Die Übersetzung wahrt diesen territorialen und bundestheologischen Zusammenhang, ohne dem Vers einen nicht erforderlichen weltweiten Bezug zu geben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bildet die zwei im Hebräischen genannten Gründe des Gerichts klar ab. Die Wiederholung von שׁפך wird durch „goss … aus“ und „vergossen“ erkennbar erhalten; die besonders abwertende Nuance der Götzenbezeichnung steht in der Fußnote.
