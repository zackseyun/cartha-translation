  text: וּ/זְכַרְתֶּם֙ אֶת דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים וּ/מַעַלְלֵי/כֶ֖ם אֲשֶׁ֣ר לֹֽא טוֹבִ֑ים וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם עַ֚ל עֲוֺנֹ֣תֵי/כֶ֔ם וְ/עַ֖ל תּוֹעֲבֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/031.yaml
  text: Then you will remember your evil ways and your deeds that were not good[a], and you will loathe yourselves for your iniquities and your abominations.
translation:
  language: de
  text: Dann werdet ihr euch an eure bösen Wege und eure Taten, die nicht gut waren, erinnern und euch selbst[a] wegen eurer Sünden und eurer Gräuel verabscheuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „vor euch selbst“; die hebräische Wendung beschreibt hier Abscheu über sich selbst.'
    reason: lexikalische Alternative zur idiomatisch reflexiven Wiedergabe von וּנְקֹטֹתֶם בִּפְנֵיכֶם
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: Dann werdet ihr euch erinnern
  rationale: Das Qal Perfekt 2. Person Plural mit ו steht im Zusammenhang der vorausgehenden Verheißungen futurisch und folgernd. „Dann“ macht diese Folgebeziehung natürlich deutlich.
- source_word: דַּרְכֵיכֶם הָרָעִים
  choice: eure bösen Wege
  rationale: „Wege“ bewahrt das hebräische Bild für die Lebensführung; „böse“ gibt die moralische Bewertung wieder.
- source_word: וּמַעַלְלֵיכֶם אֲשֶׁר לֹא טוֹבִים
  choice: eure Taten, die nicht gut waren
  rationale: „Taten“ entspricht dem konkreten Sinn von מַעֲלָל. Die ausdrückliche Negation „nicht gut“ wird bewahrt und nicht zu „böse“ verstärkt.
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: ihr werdet euch selbst … verabscheuen
  rationale: נקט bezeichnet hier starke Abscheu. בִּפְנֵיכֶם, wörtlich „vor/in eurem eigenen Angesicht“, wirkt in dieser Verbindung reflexiv; „euch selbst verabscheuen“ ist im Deutschen klar und idiomatisch.
- source_word: עַל עֲוֺנֹתֵיכֶם
  choice: wegen eurer Verfehlungen
  rationale: עַל bezeichnet hier den Grund der Selbstabscheu. עָוֹן umfasst schuldhafte Verfehlung; „Verfehlungen“ bewahrt sowohl die moralische als auch die konkrete plurale Aussage.
- source_word: וְעַל תּוֹעֲבֹתֵיכֶם
  choice: und eurer abscheulichen Taten
  rationale: תּוֹעֵבָה bezeichnet etwas entschieden Abscheuliches, häufig im kultischen und moralischen Bereich. „Abscheuliche Taten“ ist verständlicheres modernes Deutsch als das substantivische „Gräuel“ und vermeidet hier eine missverständliche Bezeichnung von Gegenständen.
theological_decisions:
- issue: Art der Reaktion Israels nach der Wiederherstellung
  choice: Erinnerung an das frühere Böse und tiefe Abscheu über die eigenen Sünden als Folge des zuvor verheißenen Handelns Gottes
  alternative: bloß psychologische Reue oder eine vollständig ausformulierte spätere Bußlehre
  rationale: Der Kontext stellt diese Reaktion in die Folge von Gottes erneuerndem Handeln. Die Übersetzung gibt Erinnerung und moralische Selbstabscheu wieder, ohne über den Vers hinaus ein Lehrsystem einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder und die zurückhaltende Formulierung „nicht gut“ bleiben erhalten; schwer verständliche Bibelsprache wird vermieden. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen idiomatische Wendung er sich bezieht.
