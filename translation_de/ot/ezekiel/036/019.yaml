base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/019.yaml
  text: So I scattered them among the nations[a], and they were dispersed through the lands; I judged them according to their ways and according to their deeds.
translation:
  language: de
  text: Ich zerstreute sie unter die Völker, und sie wurden über die Länder hin verstreut. Nach ihren Wegen und ihren Taten richtete ich sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָפִיץ
  choice: So zerstreute ich sie
  rationale: Der Hifil von פוץ bezeichnet hier das Verursachen der Zerstreuung. „Zerstreute“ bewahrt Gottes ausdrückliche Urheberschaft; „So“ bindet die Aussage folgernd an den vorausgehenden Zusammenhang an.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: גּוֹיִם bezeichnet die fremden Völker, unter die Israel ins Exil kam. „Völker“ ist im Deutschen natürlich und vermeidet die später geprägte Bezeichnung „Heiden“.
- source_word: וַיִּזָּרוּ
  choice: sie wurden … verstreut
  rationale: Die passive Form beschreibt den aus der göttlichen Zerstreuung folgenden Zustand. Die Wiederaufnahme des Wortfeldes ist im Deutschen klar und bildet den Parallelismus des Hebräischen ab.
- source_word: בָּאֲרָצוֹת
  choice: über die Länder
  rationale: Der Plural bezeichnet verschiedene Länder oder Gebiete. „Über die Länder“ gibt den distributiven Sinn der weiträumigen Zerstreuung idiomatisch wieder.
- source_word: כְּדַרְכָּם
  choice: Nach ihren Wegen
  rationale: דֶּרֶךְ bezeichnet im prophetisch-moralischen Zusammenhang die Lebensführung. „Wege“ bewahrt das hebräische Bild und den würdevollen biblischen Sprachgebrauch.
- source_word: וְכַעֲלִילוֹתָם
  choice: und ihren Taten
  rationale: עֲלִילוֹת bezeichnet Handlungen mit moralischer Wertung. „Taten“ ist knapp, verständlich und dem Gerichtskontext angemessen.
- source_word: שְׁפַטְתִּים
  choice: richtete ich sie
  rationale: שׁפט bedeutet grundlegend „richten“. Diese Wiedergabe bewahrt den gerichtlichen Rahmen, ohne die Aussage auf „bestrafen“ zu verengen.
theological_decisions:
- issue: Verhältnis von göttlichem Gericht und Exil
  choice: Die Zerstreuung wird ausdrücklich als Gottes Handeln dargestellt, und sein Gericht entspricht Israels Lebensführung und Taten.
  alternative: Eine stärker passive Wiedergabe könnte vor allem den Zustand der Zerstreuung betonen.
  rationale: Die erste Person in „ich zerstreute“ und „ich richtete“ schreibt Gott ausdrücklich die handelnde und richterliche Rolle zu. Die Übersetzung bewahrt diese Aussage, ohne sie dogmatisch auszuweiten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholung „zerstreute/verstreut“ bildet die enge semantische Verbindung der beiden hebräischen Verben ab; der zweite Satz folgt der pointierten Schlussstellung des göttlichen Gerichts.
