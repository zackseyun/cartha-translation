source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֲנִ֖י נָשָׂ֣אתִי אֶת יָדִ֑/י אִם לֹ֤א הַ/גּוֹיִם֙ אֲשֶׁ֣ר לָ/כֶ֣ם מִ/סָּבִ֔יב הֵ֖מָּה כְּלִמָּתָ֥/ם יִשָּֽׂאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/007.yaml
  text: 'Therefore thus says the Lord GOD: I have lifted up my hand in oath that surely the nations that are around you will bear their disgrace[a].'
translation:
  language: de
  text: 'Darum, so spricht Jahwe, der Herr: Ich habe meine Hand zum Schwur erhoben: Die Völker rings um euch werden ganz gewiss ihre eigene Schande tragen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht nach der Schwurformel im Hebräischen „wenn nicht“; hier bekräftigt die Wendung die folgende Aussage: „ganz gewiss“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן כֹּה אָמַר
  choice: Darum, so spricht
  rationale: Die feste prophetische Botenformel wird in einer im Deutschen geläufigen, würdevollen Form wiedergegeben; לָכֵן behält seinen folgernden Sinn „darum“.
- source_word: אֲדֹנָי יְהוִה
  choice: Jahwe, der Herr
  rationale: Die Wiedergabe nennt den Gottesnamen ausdrücklich und bringt zugleich den Titel אֲדֹנָי zur Geltung. Die im Deutschen natürliche Reihenfolge vermeidet die missverständliche Form „Herr Jahwe“.
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: Ich habe meine Hand zum Schwur erhoben
  rationale: Die konkrete Bildsprache „die Hand erheben“ bleibt erhalten; „zum Schwur“ macht die im Zusammenhang gemeinte Schwurhandlung für heutige Leser verständlich.
- source_word: אִם לֹא
  choice: ganz gewiss
  rationale: Nach der Schwurformel leitet אִם לֹא keinen gewöhnlichen Bedingungssatz ein, sondern bekräftigt den Inhalt des Schwurs. „Ganz gewiss“ gibt diese asseverative Kraft natürlich wieder.
- source_word: הַגּוֹיִם אֲשֶׁר לָכֶם מִסָּבִיב
  choice: Die Völker rings um euch
  rationale: גּוֹיִם bezeichnet hier die benachbarten fremden Völker; „rings um euch“ gibt die räumliche Beziehung knapp und idiomatisch wieder.
- source_word: הֵמָּה כְּלִמָּתָם יִשָּׂאוּ
  choice: werden … ihre eigene Schande tragen
  rationale: „Schande tragen“ bewahrt die Bildlichkeit von נשׂא und den gerichtlichen Ton von כְּלִמָּה. „Ihre eigene“ nimmt die Hervorhebung durch הֵמָּה und das Suffix auf, ohne die Aussage weiter auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Jahwe, der Herr
  alternative: Gott, der HERR
  rationale: Der Ausgangstext enthält sowohl den Eigennamen יהוה als auch den Herrschaftstitel אֲדֹנָי. Die gewählte Form bewahrt beide Elemente transparent, statt den Eigennamen durch einen weiteren Titel zu ersetzen.
- issue: Schwurformel und Gewissheit des angekündigten Gerichts
  choice: Bildhafte Schwurhandlung mit ausdrücklicher Bekräftigung
  alternative: Ich schwöre, dass …
  rationale: Die Handerhebung und die bekräftigende Konstruktion bleiben beide erkennbar. So wird weder die Bildsprache eingeebnet noch die feste Gewissheit des Ausspruchs abgeschwächt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der vertrauten prophetischen Formel „so spricht“. Die Satzstruktur bleibt klar und mündlich lesbar; die Schwurbildsprache und der feierlich-gerichtliche Ton des Hebräischen werden bewahrt.
