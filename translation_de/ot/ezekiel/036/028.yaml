  text: וִ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֹֽתֵי/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/028.yaml
  text: You will dwell in the land that I gave to your fathers[a], and you will be my people, and I will be your God.
translation:
  language: de
  text: Ihr werdet in dem Land wohnen, das ich euren Vätern[a] gab, und ihr werdet mein Volk sein, und ich werde euer Gott sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorfahren“. Das Hebräische lautet wörtlich „Väter“ und erinnert an die Bundesverheißungen an die Väter Israels.'
    reason: lexikalische Alternative und intertextueller Bezug
lexical_decisions:
- source_word: וִישַׁבְתֶּם
  choice: ihr werdet wohnen
  rationale: ישׁב bezeichnet hier das beständige Wohnen im Land; die Form steht im prophetischen Zusammenhang mit zukünftiger Bedeutung. „Wohnen“ ist im Deutschen natürlich und legt weniger als „sich ansiedeln“ einen erstmaligen Ansiedlungsvorgang nahe.
- source_word: בָּאָרֶץ
  choice: in dem Land
  rationale: אֶרֶץ bezeichnet hier das verheißene Land im geografischen und bundestheologischen Sinn. „Land“ bewahrt diesen Bezug.
- source_word: אֲשֶׁר נָתַתִּי
  choice: das ich … gab
  rationale: Das hebräische Perfekt stellt die Gabe an die Väter als vollzogene Handlung dar. Das deutsche Präteritum gibt dies knapp und natürlich wieder.
- source_word: לַאֲבֹתֵיכֶם
  choice: euren Vätern
  rationale: אָבוֹת bedeutet wörtlich „Väter“ und greift hier die Sprache der Landverheißung an die Väter Israels auf. Die mögliche allgemeinere Wiedergabe „Vorfahren“ wird in einer Fußnote genannt.
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: ihr werdet mein Volk sein
  rationale: Dies ist die geläufige deutsche Wiedergabe der Bundesformel; sie vermittelt idiomatisch den Sinn von „ihr werdet mir zum Volk sein“.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: und ich werde euer Gott sein
  rationale: Die Formulierung gibt die zweite Hälfte der klassischen Bundesformel natürlich und genau wieder. Das ausdrücklich gesetzte אָנֹכִי ist durch das deutsche „ich“ vertreten, ohne die Aussage durch „ich selbst“ stärker festzulegen.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: „ihr werdet mein Volk sein, und ich werde euer Gott sein“
  alternative: „ihr werdet mir zum Volk sein, und ich werde euch zum Gott sein“
  rationale: Die gewählte Form ist im Deutschen idiomatisch und bewahrt zugleich die vertraute biblische Bundesformel, ohne ihren Inhalt paraphrastisch auszudeuten.
- issue: Bezeichnung der früheren Generationen
  choice: „Väter“ im Haupttext
  alternative: „Vorfahren“
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und erinnert in diesem Kontext an die den Vätern Israels gegebene Landverheißung. „Vorfahren“ bleibt als mögliche weitere Bedeutungsangabe in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die wiederholte Verbindung mit „und“ bewahrt die schlichte, feierliche Reihung des Hebräischen.
