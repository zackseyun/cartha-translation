source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר לְ/בֵֽית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֧א לְמַעַנְ/כֶ֛ם אֲנִ֥י עֹשֶׂ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל כִּ֤י אִם לְ/שֵׁם קָדְשִׁ/י֙ אֲשֶׁ֣ר חִלַּלְתֶּ֔ם בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אתֶם שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/022.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: It is not for your sake that I am acting, O house of Israel, but for my holy name[b], which you have profaned among the nations where you went.’'
translation:
  language: de
  text: 'Darum sage zum Haus Israel: »So spricht der Herr Yahweh: Nicht euretwegen handle ich, Haus Israel, sondern um meines heiligen Namens willen, den ihr unter den Nationen entweiht habt, wohin ihr gekommen seid.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den folgernden Anschluss an den vorausgehenden Zusammenhang und klingt im modernen Deutschen natürlich.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: zum Haus Israel
  rationale: Bewahrt die korporative und bundestheologische Bezeichnung, statt sie zu »Israel« zu verkürzen.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Entspricht der etablierten prophetischen Botenformel und wahrt ihren würdevollen Ton.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Gibt beide Bestandteile wieder und vermeidet die schwer verständliche Doppelung »Herr HERR«; die Kapitälchen markieren die traditionelle Wiedergabe des Gottesnamens.
- source_word: לֹא לְמַעַנְכֶם אֲנִי עֹשֶׂה
  choice: Nicht euretwegen handle ich
  rationale: Gibt die verneinte Motivation sowie die gegenwärtige beziehungsweise bevorstehende Handlung knapp und ohne ein im Hebräischen fehlendes Objekt wieder.
- source_word: כִּי אִם לְשֵׁם קָדְשִׁי
  choice: sondern um meines heiligen Namens willen
  rationale: Die Kontrastkonstruktion wird klar wiedergegeben; zugleich bleibt die theologisch gewichtige Rede vom heiligen Namen erhalten.
- source_word: אֲשֶׁר חִלַּלְתֶּם
  choice: den ihr entweiht habt
  rationale: »Entweihen« trifft im Deutschen den Piel-Sinn, etwas Heiliges als unheilig zu behandeln, klarer als das seltenere »profanieren«.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: Gibt גּוֹיִם transparent wieder, ohne neutestamentliche Assoziationen von »Heiden« einzutragen.
- source_word: אֲשֶׁר בָּאתֶם שָׁם
  choice: zu denen ihr gekommen seid
  rationale: Bezieht das Relativpronomen natürlich auf die Nationen und bewahrt das Verb »kommen« des hebräischen Textes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr Jahwe
  rationale: Die gewählte deutsche Bibelkonvention macht die Verbindung aus Herrentitel und Gottesnamen lesbar und gibt beide Elemente wieder, ohne eine bestimmte Rekonstruktion der Aussprache im Haupttext festzuschreiben.
- issue: Grund des göttlichen Handelns
  choice: Nicht euretwegen ... sondern um meines heiligen Namens willen
  alternative: Nicht um euretwillen ... vielmehr wegen meines heiligen Namens
  rationale: 'Der scharfe Gegensatz des Ausgangstextes bleibt bestehen: Gottes Handeln wird nicht mit Israels Verdienst, sondern mit der Heiligkeit seines Namens begründet.'
- issue: Bezug des Relativsatzes אֲשֶׁר חִלַּלְתֶּם
  choice: den ihr ... entweiht habt
  alternative: den ihr ... der Entweihung preisgegeben habt
  rationale: Der grammatische Bezug auf »meinen heiligen Namen« wird direkt bewahrt; die Verantwortung Israels wird weder abgeschwächt noch erklärt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener prophetischer Formel und der zweimaligen Anrede »Haus Israel«. Kein archaisches »o«; die Anrede ist im Deutschen auch ohne Anredepartikel eindeutig.
