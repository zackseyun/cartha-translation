  verdict: revise
  source_fidelity: 'Der Satzbau, der motivische Gegensatz und die Wiederholung der Anrede geben den hebräischen Text zuverlässig wieder. Eine Anpassung ist beim Gottesnamen nötig: In אֲדֹנָי יְהוִה bezeichnet יְהוִה den Eigennamen, der gemäß der vorliegenden POB-Entscheidung als „Yahweh“ wiederzugeben ist. „wohin ihr gekommen seid“ bildet die Ortsangabe שָׁם natürlich ab, ohne den Bezug unnötig zu verengen.'
  naturalness: Die Formulierung ist würdiges, modernes Standarddeutsch. „Haus Israel“ funktioniert als prophetische Anrede auch ohne ein archaisches Anredepartikel. „Wohin ihr gekommen seid“ ist im Deutschen flüssiger und näher an der lokalen Aussage als „zu denen ihr gekommen seid“.
  terminology: „Entweiht“ ist für חִלַּלְתֶּם treffend; „heiliger Name“ und „Nationen“ bewahren die maßgeblichen Begriffe. „der Herr Yahweh“ gibt den Titel אֲדֹנָי und den Gottesnamen יְהוִה getrennt wieder, ohne die traditionelle HERR-Schreibung an die Stelle des Namens zu setzen.
  issues:
  - severity: medium
    issue: Der Gottesname יְהוִה ist als „der HERR“ wiedergegeben.
    rationale: Die dokumentierte POB-Entscheidung verlangt für יְהוָה die Wiedergabe „Yahweh“. In der Verbindung אֲדֹנָי יְהוִה sollte daher der Titel und der Eigenname als „der Herr Yahweh“ erkennbar bleiben.
  - severity: low
    issue: „zu denen ihr gekommen seid“ verengt die Ortsangabe leicht auf eine Bewegung zu Personengruppen.
    rationale: אֲשֶׁר בָּאתֶם שָׁם bedeutet wörtlich etwa „wohin/ihr dorthin gekommen seid“ und bezieht sich lokal auf die Nationen. „wohin ihr gekommen seid“ ist idiomatisch und bewahrt dies besser.
