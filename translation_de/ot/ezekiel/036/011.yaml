  text: וְ/הִרְבֵּיתִ֧י עֲלֵי/כֶ֛ם אָדָ֥ם וּ/בְהֵמָ֖ה וְ/רָב֣וּ וּ/פָר֑וּ וְ/הוֹשַׁבְתִּ֨י אֶתְ/כֶ֜ם כְּ/קַדְמֽוֹתֵי/כֶ֗ם וְ/הֵטִֽבֹתִי֙ מֵ/רִאשֹׁ֣תֵי/כֶ֔ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/011.yaml
  text: And I will multiply upon you man and beast[a], and they will multiply and be fruitful; and I will settle you as in your former times, and I will do better for you than at your beginnings[c][b]. Then you will know that I am Yahweh.
translation:
  language: de
  text: Ich werde Menschen und Tiere auf euch zahlreich werden lassen[a]; sie werden sich vermehren und fruchtbar sein. Ich werde euch wieder bewohnen lassen wie in euren früheren Zeiten[b] und euch mehr Gutes erweisen als in euren Anfangszeiten[c]. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mensch und Tier“. Gemeint sind die menschliche und die tierische Bevölkerung zusammen; bei den Tieren kann besonders auch das Vieh im Blick sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde euch wieder besiedeln“; wörtlicher: „Ich werde euch wohnen lassen“. Im Zusammenhang sind die Berge Israels angeredet.'
    reason: ambiguity
  - marker: c
    text: 'Oder: „Ich werde es euch besser ergehen lassen als am Anfang.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי עֲלֵיכֶם
  choice: Ich werde … auf euch zahlreich werden lassen
  rationale: Der Hifil von רבה bezeichnet ein verursachtes Anwachsen. „Auf euch“ bewahrt das Bild der im Kontext angesprochenen Berge beziehungsweise des Landes, auf denen Menschen und Tiere wieder zahlreich werden.
- source_word: אָדָם וּבְהֵמָה
  choice: Menschen und Tiere
  rationale: אָדָם ist hier kollektiv und steht im Gegensatz zu בְּהֵמָה. „Menschen und Tiere“ gibt diese umfassende Paarung in natürlichem, geschlechtsübergreifendem Deutsch wieder; „Vieh“ wäre möglicherweise zu eng.
- source_word: וְרָבוּ וּפָרוּ
  choice: sie werden sich vermehren und fruchtbar sein
  rationale: Die beiden Qal-Verben bezeichnen zahlenmäßige Zunahme und Fruchtbarkeit. Die Formulierung erhält den Anklang an die biblische Fruchtbarkeits- und Mehrungsformel.
- source_word: וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: Ich werde euch wieder bewohnen lassen
  rationale: Der Hifil von ישׁב ist kausativ. Da im Zusammenhang die Berge Israels angeredet werden, bedeutet die Wendung, dass sie wieder bewohnt sein werden; „wieder“ verdeutlicht den Wiederherstellungszusammenhang.
- source_word: כְּקַדְמֹתֵיכֶם
  choice: wie in euren früheren Zeiten
  rationale: Die Wendung verweist auf den früheren Zustand der angesprochenen Berge beziehungsweise des Landes, ohne eine genaue historische Epoche festzulegen.
- source_word: וְהֵטִבֹתִי מֵרִאשֹׁתֵיכֶם
  choice: euch mehr Gutes tun als zu euren Anfangszeiten
  rationale: 'Der Hifil von יטב trägt hier benefaktive Bedeutung: Gott wird Gutes tun beziehungsweise den Zustand verbessern. Das vergleichende מִן wird mit „mehr … als“ wiedergegeben.'
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Dann werdet ihr erkennen, dass ich Jahwe bin
  rationale: Die geläufige Erkenntnisformel Ezechiels wird direkt wiedergegeben. „Dann“ drückt den natürlichen Folgebezug des einleitenden Waw aus, ohne ihn dogmatisch zu überbestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn im modernen deutschen Bibelregister transparent wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektive Bedeutung von אָדָם
  choice: Menschen
  alternative: Mensch
  rationale: Im Gegensatz zu den Tieren bezeichnet אָדָם die menschliche Bevölkerung insgesamt. Der deutsche Plural ist idiomatisch und macht keine Aussage über das Geschlecht einzelner Menschen.
- issue: Bezug von וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: euch wieder bewohnen lassen
  alternative: euch wieder ansiedeln
  rationale: Die Angeredeten sind im Kontext die Berge Israels. Daher ist nicht eindeutig von einer Ansiedlung der angeredeten Personen die Rede, sondern davon, dass die Berge beziehungsweise das Land wieder bewohnt werden. Die Übersetzung wahrt diesen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede der Berge wird durch „auf euch“ und „euch wieder bewohnen lassen“ erhalten. Die Satzstruktur folgt dem hebräischen Aufbau, vermeidet jedoch unnatürliche Wörtlichkeit. Alle Fußnotenmarker stehen im Haupttext.
