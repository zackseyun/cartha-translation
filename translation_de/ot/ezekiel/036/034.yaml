base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/034.yaml
  text: And the desolate land will be cultivated instead of being a desolation in the sight of all who pass by[a].
translation:
  language: de
  text: Und das verwüstete Land wird bebaut werden, statt vor den Augen aller, die vorüberziehen, eine Einöde zu sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und das verwüstete Land wird bebaut werden, während es vor den Augen aller, die vorüberzogen, eine Einöde gewesen war.“'
    reason: Die Verbindung תַּחַת אֲשֶׁר kann einen Ersatz („statt“) oder einen zeitlich-kontrastierenden Gegensatz („während/es war zuvor“) ausdrücken; zudem kann עוֹבֵר allgemein gegenwärtig oder mit Blick auf den früheren Zustand vergangen wiedergegeben werden.
lexical_decisions:
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang der Wiederherstellung bei Ezechiel bezeichnet אֶרֶץ das Land Israel, nicht die ganze Erde.
- source_word: הַנְּשַׁמָּה
  choice: das verwüstete Land
  rationale: Das passive Partizip beschreibt den Zustand des Landes nach seiner Verwüstung; „verwüstet“ ist im modernen Deutschen natürlich und erhält den Gegensatz zur erneuten Bebauung.
- source_word: תֵּעָבֵד
  choice: wird wieder bebaut werden
  rationale: Das Nifal von עבד bezeichnet hier die landwirtschaftliche Bearbeitung des Landes. „Wieder“ ist durch den Wiederherstellungskontext und den Gegensatz zum bisherigen Zustand nahegelegt.
- source_word: תַּחַת אֲשֶׁר
  choice: statt weiterhin … zu sein
  rationale: Die Wendung stellt den künftigen Zustand dem bisherigen gegenüber. „Weiterhin“ macht den Wechsel idiomatisch deutlich, ohne die Grundbedeutung des Ersatzes aufzugeben.
- source_word: הָיְתָה שְׁמָמָה
  choice: eine Einöde zu sein
  rationale: „Einöde“ bewahrt die nominale Form von שְׁמָמָה und bildet einen klaren Gegensatz zum bebauten Land.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die konkrete hebräische Bildsprache bleibt erhalten und bezeichnet zugleich die öffentliche Sichtbarkeit des Zustands.
- source_word: כָּל עוֹבֵר
  choice: aller, die vorüberziehen
  rationale: Der singularische Partizipialausdruck mit כָּל hat kollektiven Sinn; die deutsche Relativkonstruktion gibt seinen allgemeinen, fortdauernden Charakter natürlich wieder.
