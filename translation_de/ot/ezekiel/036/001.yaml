id: EZK.36.1
reference: Ezekiel 36:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֖א אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
translation:
  language: de
  text: 'Und du, Menschensohn, weissage zu den Bergen Israels und sage: »Ihr Berge Israels, hört das Wort Jahwes!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede an Ezechiel wird idiomatisch und literarisch einheitlich bewahrt. Sie bezeichnet ihn hier als Menschen und ist in diesem Zusammenhang kein christologischer Titel.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Der Nifal-Imperativ von נבא ist die übliche prophetische Beauftragungsformel; »weissage« gibt den ausdrücklichen Befehl knapp und etabliert wieder.
- source_word: אֶל
  choice: zu
  rationale: 'Die Präposition bezeichnet hier am naheliegendsten die Richtung der Anrede: Ezechiel soll zu den personifizierten Bergen sprechen, nicht ausdrücklich gegen sie.'
- source_word: הָרֵי יִשְׂרָאֵל
  choice: die Berge Israels
  rationale: Die wörtliche Wiedergabe erhält die personifizierte geografische Bildsprache und den wiederholten direkten Anruf. »Bergland Israels« wäre geografisch möglich, schwächte hier aber die Personifikation.
- source_word: וְאָמַרְתָּ
  choice: und sage
  rationale: Der fortgesetzte Auftrag wird im Deutschen natürlich als koordinierter Imperativ wiedergegeben.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Pluralimperativ stimmt mit den angeredeten Bergen überein und bewahrt den feierlichen Klang des prophetischen Höraufrufs.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: »Wort« bewahrt die feste prophetische Formel und ihre literarisch-theologische Kontinuität; der Gottesname wird als Jahwe wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Eigenname wird in der im Deutschen gebräuchlichen Form »Jahwe« wiedergegeben, statt ihn durch den Titel »der HERR« zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm als persönlichen Gottesnamen. »Jahwe« macht dies im Haupttext sichtbar; »der HERR« wäre die traditionelle Ersatzlesung.
- issue: Wiedergabe der Anrede בֶן אָדָם bei Ezechiel
  choice: Menschensohn
  alternative: Sterblicher / Menschenkind
  rationale: »Menschensohn« erhält Ezechiels wiederkehrende Anredeformel und deren literarische Einheitlichkeit, ohne sie hier als christologischen Titel auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener prophetischer Personifikation. Die Voranstellung »Und du« bildet den hervorgehobenen Subjektwechsel des Hebräischen ab; »Ihr Berge Israels« macht die direkte Anrede im Deutschen klar. Keine Fußnoten sind nötig, da die wesentlichen Entscheidungen im Haupttext verständlich bleiben.
