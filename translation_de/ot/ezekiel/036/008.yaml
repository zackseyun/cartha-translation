source:
  edition: WLC
  text: וְ/אַתֶּ֞ם הָרֵ֤י יִשְׂרָאֵל֙ עַנְפְּ/כֶ֣ם תִּתֵּ֔נוּ וּ/פֶרְיְ/כֶ֥ם תִּשְׂא֖וּ לְ/עַמִּ֣/י יִשְׂרָאֵ֑ל כִּ֥י קֵרְב֖וּ לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/008.yaml
  text: But you[a], mountains of Israel, shall put forth your branches and bear your fruit for my people Israel, for they are about to come.
translation:
  language: de
  text: Doch ihr, Berge Israels, werdet eure Zweige treiben und eure Frucht für mein Volk Israel tragen; denn sie werden bald kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Denn ihre Ankunft steht kurz bevor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Doch ihr
  rationale: Das וְ wird im Zusammenhang kontrastierend wiedergegeben; das betonte אַתֶּם entspricht dem ausdrücklich gesetzten „ihr“.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: Berge Israels
  rationale: Die Konstruktverbindung bezeichnet die Berge des Landes Israel und führt die in Ezechiel wiederkehrende personifizierende Anrede der Landschaft fort.
- source_word: עַנְפְּכֶם תִּתֵּנוּ
  choice: eure Zweige treiben
  rationale: תִּתֵּנוּ bedeutet wörtlich „geben“; zusammen mit „Zweige“ bezeichnet es idiomatisch deren Hervortreiben.
- source_word: וּפֶרְיְכֶם תִּשְׂאוּ
  choice: und eure Frucht … tragen
  rationale: נשׂא heißt grundsätzlich „heben/tragen“, bildet mit פְּרִי aber die natürliche Wendung „Frucht tragen“. Der kollektive Singular „Frucht“ bleibt erhalten.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: für mein Volk Israel
  rationale: לְ bezeichnet hier den Nutznießer; „mein Volk“ bewahrt die Beziehungsaussage des hebräischen Textes.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die angekündigte Fruchtbarkeit ein.
- source_word: קֵרְבוּ לָבוֹא
  choice: sie werden bald kommen
  rationale: Die Verbindung von קרב mit dem Infinitiv בוא drückt das unmittelbar bevorstehende Kommen aus. Die deutsche Formulierung gibt die Nähe natürlich wieder, ohne die Bewegung des Verbs „kommen“ aufzugeben.
theological_decisions:
- issue: Bezug des pluralischen Subjekts in קֵרְבוּ
  choice: '„sie“ bezieht sich auf „mein Volk Israel“: Die Israeliten werden bald zurückkehren.'
  alternative: Die Aussage kann sachlich als „ihre Ankunft steht kurz bevor“ formuliert werden, ohne ein ausdrückliches pronominales Subjekt zu setzen.
  rationale: „Mein Volk Israel“ ist der nächstliegende Bezug. Der Zusammenhang handelt von der erneuten Fruchtbarkeit des Landes angesichts der bevorstehenden Heimkehr des Volkes; die Fußnote wahrt zugleich die weniger personenbezogene deutsche Wiedergabemöglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierende Anrede der Berge und das landwirtschaftliche Bild bleiben erhalten; das Semikolon macht den begründenden Schluss klar lesbar.
