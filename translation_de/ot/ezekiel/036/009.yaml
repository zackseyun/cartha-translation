  yaml_path: translation/ot/ezekiel/036/009.yaml
  text: For behold[a], I am for you, and I will turn to you, and you will be cultivated and sown.
translation:
  language: de
  text: 'Denn seht[a]: Ich bin für euch und werde mich euch zuwenden; ihr werdet bearbeitet und besät werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin euch zugewandt.« Der hebräische Ausdruck bezeichnet die wohlwollende Ausrichtung des HERRN zu den angesprochenen Bergen, also zum Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Verheißung ein und bewahrt den Zusammenhang.
- source_word: הִנְנִי
  choice: seht
  rationale: Gibt die aufmerksamkeitsweckende, feierliche Hinweisformel in verständlichem modernem Deutsch wieder.
- source_word: אֲלֵיכֶם
  choice: für euch
  rationale: Im Zusammenhang bezeichnet die Präposition Gottes wohlwollende Hinwendung zu den Bergen beziehungsweise zum Land Israel, nicht nur eine räumliche Richtung.
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: und wende mich euch zu
  rationale: Bewahrt das Bild der Hinwendung und vermittelt zugleich günstige Aufmerksamkeit und daraus folgendes Handeln.
- source_word: וְנֶעֱבַדְתֶּם
  choice: ihr werdet bearbeitet
  rationale: Das Nifal von עבד bezieht sich hier auf die landwirtschaftliche Bearbeitung des angesprochenen Landes; „bearbeitet“ erhält den Passivcharakter und ist auch auf Berge beziehungsweise Land anwendbar.
- source_word: וְנִזְרַעְתֶּם
  choice: und besät werden
  rationale: Das Nifal von זרע bezeichnet das Besätwerden des Landes und wird direkt sowie idiomatisch wiedergegeben.
theological_decisions:
- issue: Gottes Haltung in הִנְנִי אֲלֵיכֶם
  choice: ich bin für euch
  alternative: ich bin euch zugewandt
  rationale: „Für euch“ bringt Gottes günstige Haltung gegenüber dem Land klar zum Ausdruck, ohne über den Aussagegehalt des Textes hinauszugehen; die mögliche Richtungsnuance wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Seht“ bewahrt den prophetischen Nachdruck, ohne das veraltete „siehe“ zu verwenden. Das angesprochene Maskulinum Plural bezieht sich im Kontext auf die Berge Israels; deshalb bleiben die passiven landwirtschaftlichen Verben erhalten.
