  text: וְ/אָמְר֗וּ הָ/אָ֤רֶץ הַלֵּ֨זוּ֙ הַ/נְּשַׁמָּ֔ה הָיְתָ֖ה כְּ/גַן עֵ֑דֶן וְ/הֶ/עָרִ֧ים הֶ/חֳרֵב֛וֹת וְ/הַֽ/נְשַׁמּ֥וֹת וְ/הַ/נֶּהֱרָס֖וֹת בְּצוּר֥וֹת יָשָֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/035.yaml
  text: And they will say, ‘This land that was desolate has become like the garden of Eden, and the cities that were ruined, desolate, and torn down are fortified and inhabited.’
translation:
  language: de
  text: 'Und man wird sagen: »Dieses Land, das verwüstet war, ist wie der Garten Eden geworden. Und die Städte, die zerstört, verwüstet und niedergerissen waren, sind befestigt und bewohnt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָרֶץ הַלֵּזוּ
  choice: dieses Land
  rationale: Gibt die demonstrative Wendung natürlich und bestimmt wieder.
- source_word: הַנְּשַׁמָּה
  choice: das verwüstet war
  rationale: Bezeichnet ein öde und unbewohnt gewordenes Land; »verwüstet« passt zum Kontext der Zerstörung und Wiederherstellung.
- source_word: כְּגַן עֵדֶן
  choice: wie der Garten Eden
  rationale: Bewahrt den ausdrücklichen Vergleich und die traditionelle, allgemein verständliche Bezeichnung.
- source_word: הֶחֳרֵבוֹת
  choice: die in Trümmern lagen
  rationale: Drückt den Zustand der zerstörten Städte idiomatisch aus und unterscheidet ihn von den folgenden Beschreibungen.
- source_word: הַנֶּהֱרָסוֹת
  choice: niedergerissen
  rationale: Gibt die konkrete Vorstellung des Abbrechens bzw. Niederreißens wieder.
- source_word: בְּצוּרוֹת
  choice: befestigt
  rationale: Entspricht dem passivischen Zustandsausdruck für gesicherte, befestigte Städte.
- source_word: יָשָׁבוּ
  choice: bewohnt
  rationale: Im Zusammenhang mit Städten bedeutet das Verb, dass sie wieder besiedelt beziehungsweise bewohnt sind.
theological_decisions:
- issue: Eden-Vergleich
  choice: wie der Garten Eden geworden
  alternative: zum Garten Eden geworden
  rationale: Die Vergleichspartikel כְּ wird ausdrücklich bewahrt; der Text behauptet Ähnlichkeit, nicht Identität.
- issue: Unbestimmtes Subjekt von וְאָמְרוּ
  choice: man wird sagen
  alternative: sie werden sagen
  rationale: Der Vers nennt das Subjekt nicht innerhalb des Satzes. Das deutsche unpersönliche »man« bewahrt diese Offenheit, statt ohne unmittelbaren Anhaltspunkt eine bestimmte Gruppe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Beschreibung der zerstörten Städte bleibt erhalten, ohne die eng verwandten hebräischen Begriffe künstlich gleichlautend wiederzugeben.
