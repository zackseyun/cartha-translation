  naturalness: Das Deutsch ist überwiegend würdig und verständlich. „Diese sind das Volk Yahwehs“ ist möglich, aber „Das ist Yahwehs Volk“ klingt in direkter Rede natürlicher und wahrt den demonstrativen Ton. Die Wiederholung in „zu den Nationen kamen, wohin sie kamen“ darf als formnahe Wiedergabe stehen bleiben.
  terminology: „Nationen“, „entweihten“, „heiliger Name“ und „Yahweh“ sind angemessen. „Entweihen“ bewahrt den sakralen Gehalt von חלל. Die Wiedergabe „von ihnen sagte“ gibt den Kontext der Äußerung unter den Nationen idiomatisch wieder, ohne die im Hebräischen verdichtete Zuordnung von Israel und den Sprechenden weiter aufzulösen.
