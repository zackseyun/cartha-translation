source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל הַ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וַֽ/יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י בֶּ/אֱמֹ֤ר לָ/הֶם֙ עַם יְהוָ֣ה אֵ֔לֶּה וּ/מֵ/אַרְצ֖/וֹ יָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/020.yaml
  text: And when they came to the nations where they went[a], they profaned my holy name, in that people said of them, ‘These are the people of Yahweh[b], and yet they had to go out of his land.’
translation:
  language: de
  text: 'Als sie zu den Nationen kamen, wohin sie kamen,[a] entweihten sie meinen heiligen Namen, indem man von ihnen sagte: »Das ist Yahwehs Volk, und doch zogen sie aus seinem Land weg.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das erste Verb steht im Hebräischen im Singular (»er/es kam«), die folgenden Verben jedoch im Plural. Israel ist als kollektive Größe gemeint.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlicher: »und aus seinem Land gingen sie hinaus«. Der hebräische Text lässt unausgesprochen, wer ihren Weggang veranlasste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: Als sie … kamen
  rationale: Die Verbform steht grammatisch im Singular, doch das kollektive Israel ist aus dem Zusammenhang als Bezug gegeben, und die folgenden Verben stehen im Plural. Der deutsche Plural gibt diesen kollektiven Sinn natürlich wieder; die Formspannung wird in Fußnote [a] offengelegt.
- source_word: הַגּוֹיִם
  choice: die Nationen
  rationale: Gemeint sind die fremden Völker beziehungsweise Länder, unter die Israel zerstreut wurde. „Nationen“ vermeidet die später religiös geprägte Bezeichnung „Heiden“.
- source_word: וַיְחַלְּלוּ
  choice: entweihten sie
  rationale: Das Piel von חלל bezeichnet hier die Profanierung dessen, was heilig ist. „Entweihen“ ist im modernen Deutschen verständlich und bewahrt den starken Gegensatz zu Gottes heiligem Namen.
- source_word: שֵׁם קָדְשִׁי
  choice: meinen heiligen Namen
  rationale: Die geläufige deutsche Formulierung gibt sowohl Gottes offenbare Identität als auch sein Ansehen unter den Nationen wieder.
- source_word: בֶּאֱמֹר לָהֶם
  choice: indem man zu ihnen sagte
  rationale: Die Präposition mit dem Infinitiv bezeichnet die Weise oder Begleitumstände der Entweihung. Das unpersönliche „man“ bildet die nicht ausdrücklich genannte sprechende Instanz ab; „zu ihnen“ entspricht dem hebräischen לָהֶם.
- source_word: עַם יְהוָה אֵלֶּה
  choice: Diese sind das Volk Yahwehs
  rationale: Die Wortstellung bewahrt die demonstrative, möglicherweise spöttische Hervorhebung. Der Gottesname wird als „Yahweh“ wiedergegeben.
- source_word: וּמֵאַרְצוֹ יָצָאוּ
  choice: und doch mussten sie sein Land verlassen
  rationale: Der hebräische Satz nennt Israels Weggang aus Yahwehs Land, ohne den Verursacher ausdrücklich zu nennen. „Doch mussten sie … verlassen“ macht die im Zusammenhang beschämende Exilsituation verständlich, ohne ausdrücklich „sie wurden vertrieben“ zu sagen; der engere Wortlaut steht in Fußnote [b].
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der persönliche Bundesname steht ausdrücklich im hebräischen Text. „Yahweh“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wer Gottes Namen entweihte
  choice: Israel bleibt Subjekt von „entweihten“, während die Äußerung der Nationen die Weise der Entweihung zeigt
  alternative: Die Nationen entweihten den Namen durch ihre Äußerung
  rationale: Das plurale וַיְחַלְּלוּ bezieht sich im Zusammenhang am ehesten auf die Israeliten; zugleich verbindet בֶּאֱמֹר לָהֶם die Entweihung mit dem, was unter den Nationen zu ihnen gesagt wurde. Die Übersetzung erhält diese verdichtete Verantwortungsstruktur.
- issue: Schande und Zwang des Exils
  choice: „doch mussten sie sein Land verlassen“
  alternative: „und aus seinem Land gingen sie hinaus“
  rationale: Der Text sagt nicht ausdrücklich, wer Israel vertrieb. Die Hauptfassung lässt den Handelnden ungenannt, bringt aber den beschämenden Widerspruch der Aussage zur Geltung; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „zu den Nationen … wohin sie kamen“ bewahrt die auffällige hebräische Formulierung. „Entweihen“ hält den Gegensatz zwischen Israels Lage und Yahwehs heiligem Namen klar; die direkte Rede bleibt knapp und zugespitzt.
