  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Offenbarungsformel wird die hebräische Konstruktion im Deutschen natürlich mit „kam“ wiedergegeben.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier das von Gott kommende Wort beziehungsweise die Botschaft; „das Wort“ bewahrt die etablierte prophetische Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und wegen der Verbindung „Wort Jahwes“ in den Genitiv gesetzt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit dem Suffix der ersten Person bezeichnet den Propheten als Empfänger des Gotteswortes.
- source_word: לֵאמֹר
  choice: ':'
  rationale: לֵאמֹר leitet den unmittelbar folgenden Wortlaut der Rede ein. Ein Doppelpunkt gibt diese Funktion im heutigen Deutschen natürlicher wieder als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel bleibt erkennbar; der Doppelpunkt führt knapp und idiomatisch zur folgenden Gottesrede über.
