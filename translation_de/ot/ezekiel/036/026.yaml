  text: וְ/נָתַתִּ֤י לָ/כֶם֙ לֵ֣ב חָדָ֔שׁ וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י אֶת לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשַׂרְ/כֶ֔ם וְ/נָתַתִּ֥י לָ/כֶ֖ם לֵ֥ב בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/026.yaml
  text: And I will give you a new heart[a], and I will put a new spirit within you; and I will remove the heart of stone from your flesh and give you a heart of flesh.
translation:
  language: de
  text: Und ich werde euch ein neues Herz geben und einen neuen Geist in euer Inneres legen.[a] Ich werde das Herz aus Stein aus eurem Fleisch entfernen und euch ein Herz aus Fleisch geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geist“ kann hier den inneren Geist beziehungsweise die innere Ausrichtung der Menschen bezeichnen; manche verstehen die Wendung als Vorausblick auf die Gabe von Gottes Geist im folgenden Vers.
    reason: Bewahrt die Deutungsoffenheit von רוּחַ und verweist auf die ausdrückliche Nennung von Gottes Geist im folgenden Vers, ohne die Bedeutung im Haupttext festzulegen.
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ gibt die hebräische Rede vom inneren Zentrum des Denkens, Wollens und Empfindens transparent wieder, ohne sie auf „Verstand“ oder „Gesinnung“ einzuengen.
- source_word: חָדָשׁ / חֲדָשָׁה
  choice: neu
  rationale: Das Adjektiv bezeichnet unmittelbar etwas Neues; „erneuert“ wäre bereits eine interpretierende Festlegung.
- source_word: רוּחַ
  choice: Geist
  rationale: Im Zusammenhang der inneren Umgestaltung ist „Geist“ die passende anthropologische Wiedergabe; „Wind“ oder „Atem“ passen hier nicht zum Parallelismus mit dem Herzen.
- source_word: בְּקִרְבְּכֶם
  choice: in euer Inneres
  rationale: Die Formulierung bewahrt die räumliche Metapher und macht im Deutschen deutlich, dass es um das Innere der Angesprochenen geht. Das pluralische „euer“ lässt zugleich den gemeinschaftlichen Bezug bestehen.
- source_word: וַהֲסִרֹתִי
  choice: ich werde … entfernen
  rationale: „Entfernen“ entspricht dem Wegnehmen des steinernen Herzens und passt präzise zur anschließenden Ersetzung.
- source_word: לֵב הָאֶבֶן
  choice: das Herz aus Stein
  rationale: Diese natürliche deutsche Wendung bewahrt die konkrete Stoffmetapher und den Gegensatz zum „Herz aus Fleisch“.
- source_word: מִבְּשַׂרְכֶם
  choice: aus eurem Leib
  rationale: Wörtliches „aus eurem Fleisch“ wäre im Deutschen missverständlich, da das steinerne Herz gerade dem lebendigen Fleisch gegenübersteht. „Leib“ bezeichnet hier den körperlich gedachten Gesamtmenschen und erhält die konkrete Bildsprache.
- source_word: לֵב בָּשָׂר
  choice: ein Herz aus Fleisch
  rationale: Die Wiedergabe erhält den ausdrücklichen Gegensatz zum Herzen aus Stein. „Ein weiches Herz“ würde die Metapher vorschnell auslegen.
- source_word: וְנָתַתִּי ... אֶתֵּן ... וְנָתַתִּי
  choice: geben … legen … geben
  rationale: Das mittlere נתן wird mit „legen“ idiomatisch an die Ortsangabe „in euer Inneres“ angepasst; die beiden übrigen Vorkommen bleiben als „geben“ erkennbar.
theological_decisions:
- issue: Bedeutung des „neuen Geistes“
  choice: Im Haupttext bleibt „Geist“ kleingeschrieben und bezeichnet zunächst den von Gott geschenkten neuen inneren Geist beziehungsweise die neue innere Ausrichtung der Menschen.
  alternative: Unmittelbare Bezeichnung des Heiligen Geistes.
  rationale: Der Parallelismus mit dem „neuen Herzen“ legt die menschliche Innenseite nahe, während der folgende Vers ausdrücklich „meinen Geist“ nennt. Die Fußnote hält dennoch die mögliche Vorwegnahme der Gabe von Gottes Geist offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur und die konkrete Gegenüberstellung von Stein und Fleisch bleiben erhalten. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert; der Fußnotenmarker steht unmittelbar nach der Aussage über den neuen Geist.
