  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/יוֹם֙ טַהֲרִ֣/י אֶתְ/כֶ֔ם מִ/כֹּ֖ל עֲוֺנֽוֹתֵי/כֶ֑ם וְ/הֽוֹשַׁבְתִּי֙ אֶת הֶ֣/עָרִ֔ים וְ/נִבְנ֖וּ הֶ/חֳרָבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/033.yaml
  text: 'Thus says the Lord GOD: On the day I cleanse you from all your iniquities[a], I will cause the cities to be inhabited[c][b], and the ruins will be rebuilt.'
translation:
  language: de
  text: 'So spricht der Herr Jahwe[a]: An dem Tag, an dem ich euch von all euren Vergehen reinige, werde ich die Städte besiedeln[b], und die Ruinen werden wieder aufgebaut[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Adonaj JHWH“, das heißt „der Herr Jahwe“; traditionell auch „GOTT, der Herr“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „werde ich dafür sorgen, dass die Städte bewohnt werden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die verwüsteten Stätten“ beziehungsweise „die öden Orte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Wiedergabe wahrt sowohl den Titel אֲדֹנָי als auch den Gottesnamen יהוה und vermeidet die im Deutschen missverständliche Doppelung „Herr HERR“. Die deutsche Form „Jahwe“ ist eine geläufige Umschrift.
- source_word: בְּיוֹם טַהֲרִי אֶתְכֶם
  choice: An dem Tag, an dem ich euch … reinige
  rationale: Die Formulierung erhält das hebräische Zeitwort בְּיוֹם („an dem Tag“) und gibt den Piel von טהר als aktives, intensives Reinigen wieder.
- source_word: מִכֹּל עֲוֺנוֹתֵיכֶם
  choice: von all euren Vergehen
  rationale: עָוֹן bezeichnet schuldhafte Verfehlung und kann zugleich die damit verbundene Schuld einschließen. „Vergehen“ ist gegenwärtiges, verständliches Deutsch und bewahrt den moralischen Ernst des Ausdrucks.
- source_word: וְהוֹשַׁבְתִּי אֶת הֶעָרִים
  choice: werde ich die Städte wieder bewohnen lassen
  rationale: Der Hifil von ישׁב ist kausativ. Die Formulierung macht deutlich, dass Gott die erneute Bewohnung der Städte herbeiführt, ohne ein im Hebräischen nicht ausdrücklich genanntes Subjekt wie „Menschen“ einzufügen. „Wieder“ ergibt sich aus dem Wiederherstellungskontext.
- source_word: וְנִבְנוּ הֶחֳרָבוֹת
  choice: die zerstörten Orte werden wieder aufgebaut
  rationale: חֳרָבוֹת meint zerstörte beziehungsweise verwüstete Stätten; נִבְנוּ ist passiv („werden aufgebaut“). „Wieder“ bringt die Wiederherstellung zuvor zerstörter Orte im Deutschen natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe der zusammengesetzten Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung unterscheidet Titel und Eigenname sichtbar und gibt den im Ausgangstext stehenden Gottesnamen wieder. Die alternative traditionelle Wiedergabe vermeidet zwar die Aussprache des Namens, macht ihn jedoch weniger transparent.
- issue: Bedeutungsumfang von עָוֹן
  choice: Vergehen
  alternative: Schuld
  rationale: „Vergehen“ bezeichnet hier die schuldhaften Handlungen, von denen Gott reinigt. „Schuld“ wäre ebenfalls möglich und würde stärker den aus diesen Handlungen entstehenden Schuldzustand hervorheben; der hebräische Ausdruck kann beide Aspekte umfassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem hebräischen Ausspruch eng verbunden, wird aber durch eine natürliche deutsche Zeitkonstruktion lesbar. Altertümliche Wörter wie „Missetaten“ und schwer verständliche Fachprägungen werden vermieden.
