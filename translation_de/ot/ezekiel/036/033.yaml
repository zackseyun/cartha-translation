- from: 'So spricht der Herr, Jahwe[a]: An dem Tag, an dem ich euch von all euren Vergehen reinige, werde ich die Städte wieder bewohnen lassen[b], und die zerstörten Orte[c] werden wieder aufgebaut.'
  to: 'So spricht der Herr Jahwe[a]: An dem Tag, an dem ich euch von all euren Vergehen reinige, werde ich die Städte besiedeln[b], und die Ruinen werden wieder aufgebaut[c].'
  rationale: Die Revision entfernt die nicht ausdrücklich markierte Wiederholungsnuance bei der Besiedlung, ersetzt eine sperrige Kausativkonstruktion durch natürliches Deutsch und gibt die zerstörten Stätten mit „Ruinen“ wieder. Die Wiederaufbauformulierung bleibt als idiomatische Wiedergabe der Wiederherstellung erhalten. Die Fußnoten sind an den revidierten Wortlaut angepasst.
