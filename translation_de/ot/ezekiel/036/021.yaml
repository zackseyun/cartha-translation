source:
  edition: WLC
  text: וָ/אֶחְמֹ֖ל עַל שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֤ר חִלְּל֨וּ/הוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אוּ שָֽׁמָּ/ה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/021.yaml
  text: But I had pity for my holy name[a], which the house of Israel had profaned among the nations where they had gone.
translation:
  language: de
  text: Doch ich nahm mich meines heiligen Namens an[a], den das Haus Israel unter den Völkern entweiht hatte, zu denen es gekommen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Doch ich schonte meinen heiligen Namen“ oder „Doch ich hatte Mitleid mit meinem heiligen Namen“. Das hebräische Verb kann „schonen“ oder „Mitleid haben“ bedeuten; hier geht es um das Eintreten des HERRN für die Ehre seines heiligen Namens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחְמֹל עַל
  choice: Doch ich nahm mich … an
  rationale: חמל mit עַל kann Schonung, Mitleid oder fürsorgliche Anteilnahme ausdrücken. Da hier Gottes heiliger Name das unmittelbare Objekt ist, gibt „sich des Namens annehmen“ den kontextuellen Sinn – Gottes Eintreten für dessen Heiligkeit und Ansehen – in natürlichem Deutsch wieder, ohne die Bildsprache vorschnell auf Israel zu beziehen.
- source_word: שֵׁם קָדְשִׁי
  choice: meines heiligen Namens
  rationale: Die geläufige und quellennah formulierte Wendung bewahrt den zentralen Heiligkeitsbegriff; „Name“ umfasst hier Gottes offenbare Identität und sein Ansehen.
- source_word: אֲשֶׁר חִלְּלוּהוּ
  choice: den … entweiht hatte
  rationale: Das Piel von חלל bezeichnet, dass Heiliges profan gemacht oder als gewöhnlich behandelt wird. „Entweihen“ stellt im Deutschen den direkten Gegensatz zu „heilig“ klar heraus.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die feste prophetische Bezeichnung wird bewahrt und ist in gehobenem, bibelgemäßem Deutsch verständlich.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Gemeint sind die fremden Völker, unter denen Israel lebte. „Unter den Völkern“ ist idiomatisch und entspricht dem räumlich-sozialen Sinn der Präposition.
- source_word: אֲשֶׁר בָּאוּ שָׁמָּה
  choice: zu denen es gekommen war
  rationale: Die Richtungsangabe שָׁמָּה wird durch „zu denen“ wiedergegeben. Der Singular „es“ nimmt das Kollektiv „Haus Israel“ auf; das Plusquamperfekt markiert das vorausliegende Kommen.
theological_decisions:
- issue: Gottes Verhältnis zu seinem „heiligen Namen“ in וָאֶחְמֹל
  choice: Gott nimmt sich seines heiligen Namens an und tritt für dessen Heiligkeit und Ansehen ein.
  alternative: 'Gott schont seinen heiligen Namen; oder: Er empfindet Mitleid mit seinem heiligen Namen.'
  rationale: Der hebräische Satz nennt ausdrücklich Gottes Namen als Objekt von חמל, während der Zusammenhang in Hesekiel 36,20–23 die Heiligung dieses Namens vor den Völkern betont. Die Übersetzung wahrt dieses Objekt und vermeidet es, Israel zum unausgesprochenen Objekt des Erbarmens zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Haus Israel“ erhält die prophetische Ausdrucksweise; „nahm mich … an“ macht die hebräische Wendung verständlich, während die Fußnote ihre echte lexikalische Spannweite offenlegt.
