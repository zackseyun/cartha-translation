  source_fidelity: '„Doch ich nahm mich meines heiligen Namens an“ gibt וָאֶחְמֹל עַל im Kontext treffend wieder: Der heilige Name bleibt das ausdrückliche Objekt, und die Formulierung bringt Gottes fürsorglich-schützendes Eintreten für dessen Heiligkeit und Ansehen zum Ausdruck. „Den das Haus Israel unter den Völkern entweiht hatte“ entspricht אֲשֶׁר חִלְּלוּהוּ בֵּית יִשְׂרָאֵל präzise. „Zu denen es gekommen war“ bewahrt die Zielrichtung von בָּאוּ שָׁמָּה und ist als Rückbezug auf „Völkern“ eindeutig.'
  naturalness: Der Satz ist flüssiges, würdiges modernes Standarddeutsch. „Sich eines Namens annehmen“ ist leicht gehoben, aber weder veraltet noch unverständlich und passt zum prophetischen Register. Der Singular „es“ ist für das Kollektiv „das Haus Israel“ grammatisch korrekt.
  terminology: „Heiliger Name“, „entweiht“, „Haus Israel“ und „Völker“ sind terminologisch stimmig und bewahren die zentralen Begriffe des hebräischen Textes. Die Fußnote kennzeichnet die reale lexikalische Spannweite von חמל, ohne Israel als nicht genanntes Objekt einzuführen. Der Anker [a] steht unmittelbar bei der betreffenden Wendung.
