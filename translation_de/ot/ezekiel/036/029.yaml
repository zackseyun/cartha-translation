  text: וְ/הוֹשַׁעְתִּ֣י אֶתְ/כֶ֔ם מִ/כֹּ֖ל טֻמְאֽוֹתֵי/כֶ֑ם וְ/קָרָ֤אתִי אֶל הַ/דָּגָן֙ וְ/הִרְבֵּיתִ֣י אֹת֔/וֹ וְ/לֹא אֶתֵּ֥ן עֲלֵי/כֶ֖ם רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/029.yaml
  text: I will save you from all your uncleannesses[a], and I will call for the grain and multiply it[b], and I will not bring famine upon you.
translation:
  language: de
  text: Ich werde euch von all euren Unreinheiten retten[a]. Ich werde das Getreide herbeirufen und es vermehren[b] und keine Hungersnot über euch bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von all euren Verunreinigungen“. Das hebräische Wort kann sowohl kultische als auch moralische Unreinheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „es reichlich werden lassen“. Das Bild vom Herbeirufen des Getreides betont Gottes Herrschaft über den landwirtschaftlichen Ertrag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Ich werde … retten
  rationale: Der Hifil von ישׁע bezeichnet hier Gottes rettendes Eingreifen. „Retten“ ist im modernen Deutsch natürlich, bewahrt das theologische Gewicht und legt die Art der Rettung nicht enger fest als der Zusammenhang.
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: von all euren Unreinheiten
  rationale: Der Plural bleibt erhalten. „Unreinheiten“ kann wie das hebräische טֻמְאָה sowohl kultische als auch moralische Verunreinigung bezeichnen, ohne die Spannung einseitig aufzulösen.
- source_word: וְקָרָאתִי אֶל הַדָּגָן
  choice: Ich werde das Getreide herbeirufen
  rationale: קרא אל stellt Gottes Ruf an das Getreide bildhaft als wirksames Herbeirufen dar. Die Formulierung ist im Deutschen verständlich und bewahrt Gottes souveränen Befehl über den Ertrag.
- source_word: הַדָּגָן
  choice: das Getreide
  rationale: דגן bezeichnet Getreide beziehungsweise Getreideertrag allgemein. „Getreide“ ist präzise und vermeidet eine Einschränkung auf eine bestimmte Getreideart.
- source_word: וְהִרְבֵּיתִי אֹתוֹ
  choice: und es vermehren
  rationale: Der Hifil von רבה bedeutet, etwas zahlreich oder reichlich zu machen. „Vermehren“ gibt die Form des hebräischen Ausdrucks knapp und verständlich wieder.
- source_word: וְלֹא אֶתֵּן עֲלֵיכֶם רָעָב
  choice: und keine Hungersnot über euch bringen
  rationale: נתן על ist hier idiomatisch im Sinn des Auferlegens oder Herbeiführens zu verstehen. „Eine Hungersnot über euch bringen“ bewahrt die göttliche Handlungsträgerschaft und klingt im Deutschen würdig und klar.
theological_decisions:
- issue: Art der Rettung im Kontext
  choice: Rettung von Unreinheit im Rahmen der Bundeserneuerung, mit weiterem theologischem Bedeutungsraum
  alternative: Ausschließlich geistliche Errettung von Sünde oder lediglich rituelle Reinigung
  rationale: Hesekiel 36 verbindet Reinigung, ein neues Herz und einen neuen Geist, die Wiederherstellung des Landes und landwirtschaftlichen Segen. „Retten“ bewahrt diese Breite, ohne den Vers auf eine spätere Lehrkategorie zu verengen.
- issue: Bedeutungsumfang der Unreinheit
  choice: Die Sprache der Unreinheit wird beibehalten und umfasst potenziell kultische wie moralische Verunreinigung
  alternative: Deutende Festlegung ausschließlich auf Sünden oder ausschließlich auf kultische Verunreinigungen
  rationale: טֻמְאָה kann bei Hesekiel beide Bereiche berühren. Die Übersetzung erhält diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die auffällige Metapher vom Herbeirufen des Getreides bleibt erhalten; der Satzbau wurde für natürliches Deutsch leicht gegliedert.
