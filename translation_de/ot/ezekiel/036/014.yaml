  text: לָ/כֵ֗ן אָדָם֙ לֹא תֹ֣אכְלִי ע֔וֹד ו/גוי/ך לֹ֣א תכשלי ע֑וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/014.yaml
  text: Therefore you will no longer devour people[a], and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: de
  text: Darum wirst du keine Menschen mehr verschlingen und dein Volk nicht mehr zu Fall bringen[a], spricht Jahwe, der Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer anderen Lesart beziehungsweise Überlieferung: „dein Volk nicht mehr seiner Kinder berauben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Zusammenhang natürlich und klar wieder.
- source_word: אָדָם
  choice: Menschen
  rationale: Das kollektiv gebrauchte Substantiv bezeichnet hier die Bewohner, welche das personifizierte Land verschlingt.
- source_word: תֹאכְלִי
  choice: verschlingen
  rationale: Bewahrt das Bild des Essens, drückt aber im Deutschen idiomatisch das Verderben der Bewohner durch das Land aus.
- source_word: עוֹד
  choice: nicht mehr
  rationale: In Verbindung mit der Verneinung bezeichnet es das Ende des bisherigen Geschehens.
- source_word: וְגוֹיִךְ
  choice: dein Volk
  rationale: Das singularische גוי meint hier die dem personifizierten Land zugehörige Volksgemeinschaft; „Volk“ ist im Deutschen natürlicher als „Nation“.
- source_word: תכשלי
  choice: zu Fall bringen
  rationale: Folgt dem masoretischen Verständnis der Wurzel כשל im Kausativ und gibt sowohl das Stolpern als auch den daraus folgenden Niedergang verständlich wieder.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr, Jahwe
  rationale: „spricht“ entspricht der prophetischen Botenformel; „der Herr, Jahwe“ bewahrt sowohl den Titel אֲדֹנָי als auch den Gottesnamen יְהוִה, ohne die Doppelung „Herr HERR“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR / der Herr HERR
  rationale: Die Formulierung unterscheidet den Titel אֲדֹנָי vom Eigennamen יְהוִה und macht beide Bestandteile im Deutschen sichtbar.
- issue: Deutung von תכשלי
  choice: zu Fall bringen
  alternative: kinderlos machen / der Kinder berauben
  rationale: Der masoretische Konsonantentext und seine Punktierung weisen auf כשל („stürzen, zu Fall bringen“). Eine abweichende Lesetradition versteht die Form im Sinn von Kinderlosigkeit; diese echte textliche beziehungsweise traditionelle Alternative wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Land wird entsprechend dem femininen Singular des Hebräischen direkt personifiziert angeredet; im Deutschen ist dies an „du“ allein nicht geschlechtlich markiert. Die Metapher „Menschen verschlingen“ bleibt erhalten.
