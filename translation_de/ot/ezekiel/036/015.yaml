source:
  edition: WLC
  text: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙ כְּלִמַּ֣ת הַ/גּוֹיִ֔ם וְ/חֶרְפַּ֥ת עַמִּ֖ים לֹ֣א תִשְׂאִי ע֑וֹד ו/גוי/ך לֹא תַכְשִׁ֣לִי ע֔וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/015.yaml
  text: And I will no longer let you hear the disgrace of the nations[a], and you will no longer bear the reproach of the peoples, and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: de
  text: Und ich werde dich die Schande der Nationen nicht länger hören lassen. Die Schmähung der Völker wirst du nicht länger tragen, und dein Volk wirst du nicht länger ins Straucheln bringen[a], spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zu Fall bringen“; nach einer anderen Auslegungstradition: „dein Volk seiner Kinder berauben“. Der hebräische Konsonantentext ist an dieser Stelle schwierig; die masoretische Vokalisierung stützt „ins Straucheln bringen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁמִיעַ אֵלַיִךְ
  choice: ich werde dich … hören lassen
  rationale: Der Hifil von שׁמע ist kausativ. Die Formulierung gibt wieder, dass die angesprochene, grammatisch feminine Größe – im Zusammenhang das Land – die beschämenden Äußerungen der Nationen nicht mehr zu hören bekommen wird.
- source_word: כְּלִמַּת
  choice: Schande
  rationale: כְּלִמָּה bezeichnet öffentliche Schande oder Demütigung. „Schande“ ist verständlich und lässt sich von חֶרְפָּה im folgenden Satzglied unterscheiden.
- source_word: הַגּוֹיִם
  choice: der Nationen
  rationale: גּוֹיִם meint hier die umliegenden Nationen; „Nationen“ vermeidet die später religiös geprägte Bezeichnung „Heiden“.
- source_word: חֶרְפַּת
  choice: Schmähung
  rationale: חֶרְפָּה bezeichnet Schmach, Hohn oder eine entehrende Beschimpfung. „Schmähung“ wahrt den prophetischen Ton und die Unterscheidung von כְּלִמָּה.
- source_word: עַמִּים
  choice: der Völker
  rationale: „Völker“ erhält die lexikalische Unterscheidung gegenüber גּוֹיִם („Nationen“) im vorhergehenden Satzglied.
- source_word: תִשְׂאִי
  choice: wirst du … tragen
  rationale: נשׂא bedeutet wörtlich „tragen“ und bezeichnet hier das Ertragen der Schmähung. Das deutsche Bild ist klar und bewahrt die Ausdrucksweise des Hebräischen.
- source_word: וְגוֹיִךְ
  choice: und dein Volk
  rationale: Die überlieferte Form wird als Singular גוי mit Suffix der zweiten Person feminin Singular verstanden. „Volk“ klingt im Deutschen in diesem Zusammenhang natürlicher als „Nation“.
- source_word: תַכְשִׁלִי
  choice: wirst du … ins Straucheln bringen
  rationale: Der masoretisch vokalisierte Hifil von כשל bedeutet „zum Straucheln bringen“. Wegen der schwierigen Textüberlieferung wird die abweichende Deutung in einer Fußnote genannt.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. אֲדֹנָי wird mit „der Herr“ und der ausdrücklich stehende Gottesname יהוה mit „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: der Herr GOTT
  rationale: Die Wiedergabe „Yahweh“ macht den im hebräischen Text ausdrücklich verwendeten Gottesnamen sichtbar, während „Herr“ אֲדֹנָי entspricht und beide Bestandteile der Formel unterscheidbar bleiben.
- issue: Verantwortung des angesprochenen Landes für den Fall seines Volkes
  choice: ins Straucheln bringen
  alternative: seines Volkes berauben
  rationale: Die masoretische Vokalisierung liest einen Kausativ von כשל und lässt die theologisch spannungsvolle Aussage stehen, dass das Land sein Volk zum Straucheln gebracht habe. Eine andere Auslegungstradition versteht die schwierige Form im Sinn von Kinderlosigkeit oder Verlust; sie wird nicht in den Haupttext übernommen, aber dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzstruktur. Die feminine Anrede des Landes ist im Deutschen nur durch „du/dein“ erkennbar. „Schande“ und „Schmähung“ erhalten die Parallelität, ohne die beiden hebräischen Substantive gleichzusetzen.
