  source_fidelity: 'Der Text gibt die drei Verheißungssätze des masoretischen Textes zuverlässig wieder: nicht mehr die Schande der Nationen hören, nicht mehr die Schmähung der Völker tragen und das eigene Volk nicht mehr zum Straucheln bringen. Die kausative Nuance von אַשְׁמִיעַ und תַכְשִׁלִי ist erhalten. „Volk“ für גּוֹיֵךְ ist im Deutschen idiomatisch und wahrt den Singular der gewählten masoretischen Lesung.'
