  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן אָמַ֧ר הָ/אוֹיֵ֛ב עֲלֵי/כֶ֖ם הֶאָ֑ח וּ/בָמ֣וֹת עוֹלָ֔ם לְ/מֽוֹרָשָׁ֖ה הָ֥יְתָה לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/002.yaml
  text: 'Thus says the Lord GOD: Because the enemy said against you, ‘Aha!’ and, ‘The ancient heights have become our possession,’'
translation:
  language: de
  text: 'So spricht GOTT, der Herr: Weil der Feind über euch gesagt hat: »Aha! Die uralten Höhen sind unser Besitz geworden!«,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Gibt die Verbindung aus Gottes Eigennamen und Herrentitel in einer im Deutschen vertrauten, würdigen Form wieder; die Großschreibung kennzeichnet den Gottesnamen.
- source_word: הָאוֹיֵב
  choice: der Feind
  rationale: Entspricht dem singularischen hebräischen Ausdruck und lässt offen, welcher konkrete Gegner gemeint ist.
- source_word: הֶאָח
  choice: Ha!
  rationale: Bewahrt den kurzen höhnischen Ausruf des Feindes in natürlichem Deutsch.
- source_word: בָמוֹת עוֹלָם
  choice: die uralten Höhen
  rationale: במות bezeichnet Höhen bzw. erhöhte Orte; עולם beschreibt hier am ehesten ihr hohes Alter. Die Wiedergabe vermeidet die missverständliche Aussage, die Höhen selbst seien ewig.
- source_word: לְמוֹרָשָׁה הָיְתָה לָּנוּ
  choice: sind unser Besitz geworden
  rationale: Gibt die Besitzergreifung idiomatisch wieder, ohne den im Kontext feindlichen Anspruch abzuschwächen.
theological_decisions:
- issue: Wiedergabe von בָמוֹת als kultisch geladene »Höhenheiligtümer« oder allgemein als »Höhen«
  choice: Höhen
  alternative: Höhenheiligtümer
  rationale: Im Kontext richtet sich die Aussage gegen den Anspruch des Feindes auf das Land bzw. dessen alte Höhen. Eine ausdrücklich kultische Bedeutung ist möglich, aber hier nicht eindeutig und wird daher nicht in den Text hineingetragen.
- issue: Zeitliche Bedeutung von עוֹלָם
  choice: uralt
  alternative: ewig
  rationale: Bei geografischen Höhen bezeichnet der Ausdruck plausibel deren Bestehen seit alter Zeit; »ewig« könnte eine theologische Unvergänglichkeit suggerieren, die der Satz nicht verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der prophetische Botenstil bleibt erhalten; der spöttische Ausruf wird knapp und direkt wiedergegeben. Das Schlusskomma zeigt, dass der Begründungssatz im folgenden Vers weitergeführt wird.
