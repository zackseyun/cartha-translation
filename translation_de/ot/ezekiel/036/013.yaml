base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/013.yaml
  text: 'Thus says the Lord GOD: Because they say of you[b][a], ‘You devour people and have bereaved your nation,’'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Weil man euch[a] sagt: »Du verschlingst Menschen[b] und hast dein Volk kinderlos gemacht[c]«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Pronomen vor dem Zitat steht in der Mehrzahl („euch“); im Zitat selbst wird eine grammatisch feminine Einzahl angesprochen („du“), offenbar das Land.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Hebräisch wörtlich: „einen Menschen“ beziehungsweise „Mensch“; das Wort ist hier kollektiv gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und hast dein Volk seiner Kinder beraubt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Wiedergabe bewahrt sowohl den Herrschaftstitel אֲדֹנָי als auch den ausdrücklich gesetzten Gottesnamen יהוה, ohne beide zu einem einzigen Titel zu verschmelzen.
- source_word: יַעַן
  choice: Weil
  rationale: Leitet den begründenden Satz unmittelbar und idiomatisch ein.
- source_word: אֹמְרִים לָכֶם
  choice: man über euch sagt
  rationale: Das unbestimmte pluralische Subjekt wird im Deutschen natürlich mit „man“ wiedergegeben; „über“ entspricht hier dem Sinn der Aussage, während die Mehrzahl des Pronomens sichtbar bleibt.
- source_word: אֹכֶלֶת אָדָם
  choice: Du verschlingst Menschen
  rationale: Das Partizip beschreibt die angesprochene, grammatisch feminine Größe als menschenverschlingend; אָדָם hat hier kollektiven Sinn.
- source_word: וּמְשַׁכֶּלֶת גוֹיִךְ הָיִית
  choice: und hast dein Volk seiner Kinder beraubt
  rationale: שׁכל im Piel bezeichnet das Kinderlosmachen beziehungsweise Berauben; גּוֹי meint hier die Bevölkerung der angesprochenen Landgröße. Das Perfekt הָיִית wird mit der resultativen deutschen Perfektform aufgenommen.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: „Der Herr Yahweh“ erhält beide Bestandteile des hebräischen Ausdrucks und gibt יהוה als Eigennamen wieder; die Alternative ist im Deutschen vertrauter, verdeckt aber die Namensform.
- issue: Bild des Landes als menschenverschlingende Größe
  choice: Du verschlingst Menschen
  alternative: Du bist eine Menschenfresserin
  rationale: Die gewählte Form bewahrt das drastische Bild, ohne die im Hebräischen nicht ausdrücklich genannte Bezeichnung „Land“ einzufügen oder eine unnötig personifizierende Substantivbildung zu verwenden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten prophetischen Formel „So spricht“. Die auffällige Spannung zwischen pluralischer Anrede vor dem Zitat und femininer Einzahl im Zitat wird nicht eingeebnet, sondern im Text bewahrt und erläutert.
