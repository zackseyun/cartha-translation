- from: 'Darum prophezeie über das Land Israel und sage zu den Bergen und Hügeln, zu den Schluchten und Tälern: »So spricht GOTT, der Herr: Seht, in meinem Eifer[a] und in meinem Zorn habe ich geredet, weil ihr die Schmach der Völker getragen habt.«'
  to: 'Darum prophezeie über das Land Israel und sage zu den Bergen und Hügeln, zu den Schluchten und Tälern: »So spricht Gott, der HERR: Siehe, ich habe in meinem Eifer[a] und in meinem Zorn geredet, weil ihr die Schmach der Völker getragen habt.«'
  rationale: Die notwendige Korrektur ersetzt die unzutreffende pluralische Aufforderung „Seht“ durch die dem hebräischen הִנְנִי entsprechende Sprecherformel „Siehe, ich“. Außerdem wird die Schreibung „Gott, der HERR“ an die Reihenfolge und Funktion von אֲדֹנָי יְהוִה angepasst. Die vorhandene Fußnote zu קִנְאָה bleibt sinnvoll und unverändert.
