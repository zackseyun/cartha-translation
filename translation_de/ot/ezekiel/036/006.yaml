source:
  edition: WLC
  text: לָ/כֵ֕ן הִנָּבֵ֖א עַל אַדְמַ֣ת יִשְׂרָאֵ֑ל וְ/אָמַרְתָּ֡ לֶ/הָרִ֣ים וְ֠/לַ/גְּבָעוֹת לָ/אֲפִיקִ֨ים וְ/לַ/גֵּאָי֜וֹת כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י בְ/קִנְאָתִ֤/י וּ/בַ/חֲמָתִ/י֙ דִּבַּ֔רְתִּי יַ֛עַן כְּלִמַּ֥ת גּוֹיִ֖ם נְשָׂאתֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/006.yaml
  text: 'Therefore prophesy concerning the land of Israel, and say to the mountains and the hills, to the ravines and the valleys, ‘Thus says the Lord GOD: Look, I have spoken in my jealousy and in my wrath, because you have borne the disgrace of the nations.’'
translation:
  language: de
  text: 'Darum prophezeie über das Land Israel und sage zu den Bergen und Hügeln, zu den Schluchten und Tälern: »So spricht Gott, der HERR: Siehe, ich habe in meinem Eifer[a] und in meinem Zorn geredet, weil ihr die Schmach der Völker getragen habt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in meiner Eifersucht«; das hebräische Wort bezeichnet leidenschaftlichen Eifer und kann auch Eifersucht meinen.'
    reason: Die Bedeutungsbreite von קִנְאָה ist theologisch relevant und lässt sich im Haupttext nicht vollständig abbilden.
lexical_decisions:
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: über das Land Israel
  rationale: עַל bezeichnet hier den Gegenstand der prophetischen Rede; »über« ist im Deutschen natürlich und wahrt den Bezug auf das Land.
- source_word: לָאֲפִיקִים וְלַגֵּאָיוֹת
  choice: zu den Schluchten und Tälern
  rationale: אֲפִיקִים bezeichnet eingeschnittene Rinnen, Bachbetten oder Schluchten; zusammen mit גֵּאָיוֹת ergibt »Schluchten und Täler« eine verständliche topografische Wiedergabe.
- source_word: הִנְנִי
  choice: Seht
  rationale: Die deiktische Aufmerksamkeitsformel wird als unmittelbarer Aufruf wiedergegeben; sie entspricht dem vorliegenden Kontext besser als das heute schwerfällige »Siehe«.
- source_word: קִנְאָתִי
  choice: mein Eifer
  rationale: קִנְאָה kann Eifer oder Eifersucht bezeichnen. Bei Gottes leidenschaftlichem Eintreten ist »Eifer« im modernen Deutsch weniger missverständlich.
- source_word: כְּלִמַּת גּוֹיִם
  choice: die Schmach der Völker
  rationale: כְּלִמָּה meint Schande, Schmach oder Entehrung; der Genitiv lässt die Völker als Quelle der Schmach erkennen, ohne den Ausdruck auszudeuten.
- source_word: נְשָׂאתֶם
  choice: getragen habt
  rationale: Die konkrete Metapher des Tragens wird bewahrt; der maskuline Plural richtet sich an Berge, Hügel, Schluchten und Täler.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: Herr JHWH
  rationale: Die Formulierung unterscheidet den Gottesnamen typografisch von אֲדֹנָי und bleibt zugleich in öffentlicher deutscher Bibelsprache verständlich, ohne eine unsichere Aussprache festzulegen.
- issue: Göttliche קִנְאָה
  choice: Eifer
  alternative: Eifersucht
  rationale: »Eifer« wahrt die Vorstellung von Gottes leidenschaftlicher, ausschließlicher Anteilnahme, ohne moderne Assoziationen kleinlicher oder unsicherer Eifersucht aufzudrängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede der Landschaft wird beibehalten. »Prophezeie« erhält den biblisch-prophetischen Fachsinn; »Seht« gibt die hebräische Aufmerksamkeitsformel in gegenwärtiger Sprache wieder.
