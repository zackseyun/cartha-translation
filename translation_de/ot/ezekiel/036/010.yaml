  text: וְ/הִרְבֵּיתִ֤י עֲלֵי/כֶם֙ אָדָ֔ם כָּל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה וְ/נֹֽשְׁבוּ֙ הֶֽ/עָרִ֔ים וְ/הֶ/חֳרָב֖וֹת תִּבָּנֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/010.yaml
  text: And I will multiply people upon you—all the house of Israel[a], all of it. The cities will be inhabited[b], and the ruins will be rebuilt.
translation:
  language: de
  text: 'Und ich werde die Menschen[a] auf euch zahlreich machen: das ganze Haus Israel, allesamt. Die Städte werden bewohnt, und die Ruinen werden aufgebaut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch אָדָם bezeichnet hier kollektiv die menschliche Bevölkerung; möglich wäre auch „Menschheit“, wörtlicher „Mensch“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: ich werde … zahlreich machen
  rationale: Der Hifil von רבה bezeichnet das Vermehren beziehungsweise das Bewirken einer großen Zahl. Die Formulierung gibt den kausativen Sinn wieder und klingt im modernen Deutschen natürlicher als „ich werde … vermehren“, wenn Menschen als Bevölkerung gemeint sind.
- source_word: עֲלֵיכֶם
  choice: auf euch
  rationale: Das Suffix steht im Plural und bezieht sich im Kontext auf die angesprochenen Berge beziehungsweise das Land Israel. „Auf euch“ bewahrt dieses räumliche Bild.
- source_word: אָדָם
  choice: die Menschen
  rationale: אָדָם bezeichnet hier kollektiv die menschliche Bevölkerung. „Die Menschen“ ist verständlich und wahrt den Bezug auf Personen, ohne das Wort auf Männer einzugrenzen.
- source_word: כָּל־בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: das ganze Haus Israel, und zwar vollständig
  rationale: Die doppelte Betonung der Gesamtheit durch כָּל und כֻּלֹּה bleibt erhalten. „Und zwar vollständig“ gibt die nachgestellte Verstärkung in natürlichem Deutsch wieder.
- source_word: וְנֹשְׁבוּ הֶעָרִים
  choice: Die Städte werden wieder bewohnt
  rationale: Der Nifal von ישׁב beschreibt hier, dass die Städte Bewohner erhalten. „Wieder“ ist aus dem Wiederherstellungszusammenhang erschlossen und stellt den Gegensatz zu ihrer vorausgesetzten Verwüstung knapp heraus.
- source_word: וְהֶחֳרָבוֹת
  choice: die Trümmerstätten
  rationale: חֳרָבוֹת bezeichnet zerstörte, verwüstete Orte. „Trümmerstätten“ ist anschaulich, präzise und lässt sich sachgerecht mit „wieder aufgebaut“ verbinden.
- source_word: תִּבָּנֶינָה
  choice: werden wieder aufgebaut
  rationale: Der Nifal von בנה ist passiv. Bei bereits zerstörten Orten bringt „wieder aufgebaut“ den im Kontext liegenden Wiederherstellungssinn idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bezug der Anrede und Art der Wiederherstellung
  choice: Die pluralische Anrede an die Berge beziehungsweise das Land Israel und die konkrete Wiederherstellung seiner Bevölkerung und Städte bleiben im Wortlaut sichtbar.
  alternative: Eine ausschließlich geistliche, vom Land gelöste Deutung der Wiederherstellung.
  rationale: Der unmittelbare Zusammenhang richtet sich an das Land und spricht konkret von Menschen, Städten und zerstörten Orten. Die Übersetzung vergeistigt diese Aussagen nicht, schließt aber weiterführende theologische Deutungen auch nicht durch Zusätze aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die räumliche Wendung „auf euch“ bewahrt die direkte Anrede an die Berge beziehungsweise das Land. Die hebräische emphatische Wiederholung bei „ganz/vollständig“ wird nicht eingeebnet.
