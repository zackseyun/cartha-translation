source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א וְ/אָמַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֣עַן בְּ/יַ֡עַן שַׁמּוֹת֩ וְ/שָׁאֹ֨ף אֶתְ/כֶ֜ם מִ/סָּבִ֗יב לִֽ/הְיוֹתְ/כֶ֤ם מֽוֹרָשָׁה֙ לִ/שְׁאֵרִ֣ית הַ/גּוֹיִ֔ם וַ/תֵּֽעֲל֛וּ עַל שְׂפַ֥ת לָשׁ֖וֹן וְ/דִבַּת עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/003.yaml
  text: 'Therefore prophesy and say[a], Thus says the Lord GOD: Because, indeed because they have made you desolate and have snapped at you from every side, so that you became a possession for the remnant of the nations, and you have come up on the lips of the tongue and in the slander of the people[b],'
translation:
  language: de
  text: 'Darum weissage und sprich: So spricht Yahweh, der Herr: Weil, ja weil man euch verwüstet und von allen Seiten gierig nach euch geschnappt hat[a], sodass ihr zum Besitz des Restes der Völker wurdet und auf die Lippen der Leute gekommen und Gegenstand ihrer üblen Nachrede geworden seid[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb ist schwierig. Es kann auch bedeuten: »keuchend nach euch gejagt«, »nach euch gegiert« oder »euch verschlungen«. Gemeint ist jedenfalls der feindliche, raubgierige Zugriff der Völker ringsum.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Ihr seid auf die Lippe der Zunge gekommen und zum üblen Gerede des Volkes geworden.« Das Bild besagt, dass die Leute über euch redeten und euch verleumdeten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und idiomatisch wieder und verbindet den Auftrag mit dem vorausgehenden Gerichtswort.
- source_word: הִנָּבֵא וְאָמַרְתָּ
  choice: weissage und sprich
  rationale: Bewahrt den Imperativ und den anschließenden Redeauftrag an Ezechiel in natürlichem, prophetischem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne beide zu einem einzigen Titel zu verschmelzen.
- source_word: יַעַן בְּיַעַן
  choice: Weil, ja weil
  rationale: Die Wiederholung bewahrt die ungewöhnliche emphatische Kausalformel des Hebräischen.
- source_word: שַׁמּוֹת
  choice: man euch verwüstet
  rationale: Die unpersönliche Formulierung entspricht der knappen hebräischen Konstruktion; »verwüstet« passt zum angeredeten Land und seinen Bergen.
- source_word: שָׁאֹף
  choice: gierig nach euch geschnappt
  rationale: Das schwierige Verb bezeichnet hier feindlichen, raubtierhaften Zugriff; »gierig« hält zugleich den möglichen Beiklang des Keuchens oder Verlangens fest.
- source_word: מִסָּבִיב
  choice: von allen Seiten
  rationale: Natürliche deutsche Wiedergabe des ringsumher ausgeübten feindlichen Drucks.
- source_word: לִהְיוֹתְכֶם מוֹרָשָׁה
  choice: sodass ihr zum Besitz … wurdet
  rationale: Gibt die mögliche Ergebnisbeziehung verständlich wieder; מוֹרָשָׁה bezeichnet hier angeeigneten Besitz.
- source_word: לִשְׁאֵרִית הַגּוֹיִם
  choice: des Restes der Völker
  rationale: »Rest« lässt offen, ob die übrigen oder die übrig gebliebenen Völker gemeint sind, ohne einen theologischen Restbegriff einzutragen.
- source_word: וַתֵּעֲלוּ עַל שְׂפַת לָשׁוֹן
  choice: und auf die Lippen der Leute gekommen
  rationale: Bewahrt das Bild der hebräischen Wendung, formuliert es aber als verständliches deutsches Idiom für das öffentliche Gerede über jemanden.
- source_word: וְדִבַּת עָם
  choice: und Gegenstand ihrer üblen Nachrede geworden
  rationale: דִבָּה bezeichnet ein übles, verleumderisches Gerücht oder Gerede; die Ergänzung »Gegenstand« macht die koordinierte Aussage im Deutschen klar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet die im Hebräischen nicht vorhandene Auflösung des Namens in einen zweiten Herrentitel.
- issue: Bedeutung von שְׁאֵרִית bei den Völkern
  choice: Rest der Völker
  alternative: Überrest der Völker; übrige Völker
  rationale: »Rest« wahrt die lexikalische Offenheit und vermeidet, an dieser Stelle ohne Textgrund einen heilsgeschichtlichen oder konfessionell geprägten Überrestbegriff einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar prophetischem Ton. Die emphatische Wiederholung »Weil, ja weil« und das Lippenbild bleiben erhalten; schwer verständliche Hebraismen werden behutsam idiomatisiert. Das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeführt wird.
