source:
  edition: WLC
  text: כְּ/צֹ֣אן קָֽדָשִׁ֗ים כְּ/צֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּ/מ֣וֹעֲדֶ֔י/הָ כֵּ֤ן תִּהְיֶ֨ינָה֙ הֶ/עָרִ֣ים הֶ/חֳרֵב֔וֹת מְלֵא֖וֹת צֹ֣אן אָדָ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/038.yaml
  text: Like the holy flock[a], like the flock of Jerusalem at her appointed feasts, so the ruined cities will be filled with flocks of people. Then they will know that I am Yahweh.
translation:
  language: de
  text: Wie eine Herde heiliger Opfertiere,[a] wie die Herde Jerusalems zu ihren Festzeiten, so werden die zerstörten Städte mit Menschenherden gefüllt sein. Dann werden sie erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wie eine Herde von Heiligen“ oder „wie eine Herde heiliger Tiere“. Gemeint sind im Zusammenhang wahrscheinlich die zahlreichen geheiligten Opfertiere, die zu Jerusalems Festen zusammengebracht wurden.'
    reason: Die Formulierung קָדָשִׁים ist knapp und kann grammatisch als substantivisch oder qualifizierend verstanden werden; die Übersetzung verdeutlicht den wahrscheinlichen kultischen Bezug.
lexical_decisions:
- source_word: כְּצֹאן קָדָשִׁים
  choice: Wie eine Herde heiliger Opfertiere
  rationale: צֹאן bezeichnet kollektiv Kleinvieh bzw. eine Herde. קָדָשִׁים weist im Zusammenhang mit Jerusalems Festzeiten auf geheiligte, zum Opfer bestimmte Tiere. „Opfertiere“ macht diesen kultischen Bezug verständlich, ohne das Bild der Herde aufzugeben.
- source_word: כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶיהָ
  choice: wie die Herde Jerusalems zu ihren Festzeiten
  rationale: מוֹעֵד bezeichnet hier die festgesetzten kultischen Feste. Das feminine Suffix wird entsprechend seinem Bezug auf Jerusalem mit „ihren“ wiedergegeben.
- source_word: הֶעָרִים הֶחֳרֵבוֹת
  choice: die zerstörten Städte
  rationale: חֳרֵבוֹת beschreibt verwüstete oder in Trümmern liegende Städte. „Zerstört“ ist im modernen Deutsch klar und natürlich.
- source_word: מְלֵאוֹת צֹאן אָדָם
  choice: mit Menschenherden gefüllt sein
  rationale: Die ungewöhnliche Verbindung bedeutet wörtlich etwa „voll von Menschenherden“. „Menschenherden“ bewahrt die pointierte Metapher und die Entsprechung zu den zahlreichen Opfertieren bei den Festen.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Das Waw trägt hier im Kontext eine resultative Folge weiter. „Erkennen“ gibt die häufig beziehungs- und erfahrungsbezogene Bedeutung von ידע angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Kultische Bedeutung von קָדָשִׁים
  choice: heilige Opfertiere
  alternative: Heilige; heilige Tiere
  rationale: Der Parallelismus mit der Herde Jerusalems zu den Festzeiten legt Opfertiere nahe. Die Fußnote hält fest, dass „Opfertiere“ den impliziten kultischen Bezug verdeutlicht.
- issue: Metapher צֹאן אָדָם
  choice: Menschenherden
  alternative: Menschen wie eine Herde; Herden von Menschen
  rationale: Die ungewöhnliche Metapher wird nicht zu bloß „viele Menschen“ eingeebnet. So bleibt sowohl die Vermehrung als auch der Vergleich mit den Festopfern erkennbar.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt diesen Unterschied gegenüber einem Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Bildsprache des Hebräischen bleibt in „Menschenherden“ erhalten; die kultische Bedeutung wird im Haupttext knapp verdeutlicht und in der Fußnote transparent gemacht.
