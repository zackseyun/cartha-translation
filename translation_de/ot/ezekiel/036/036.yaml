source:
  edition: WLC
  text: וְ/יָדְע֣וּ הַ/גּוֹיִ֗ם אֲשֶׁ֣ר יִֽשָּׁאֲרוּ֮ סְבִיבוֹתֵי/כֶם֒ כִּ֣י אֲנִ֣י יְהוָ֗ה בָּנִ֨יתִי֙ הַ/נֶּ֣הֱרָס֔וֹת נָטַ֖עְתִּי הַ/נְּשַׁמָּ֑ה אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/036.yaml
  text: Then the nations that remain around you will know that I[a], Yahweh, have rebuilt the ruined places and planted what was desolate. I, Yahweh, have spoken, and I will do it.
translation:
  language: de
  text: Dann werden die Völker, die rings um euch übrig geblieben sind, erkennen, dass ich, Yahweh, die zerstörten Orte wieder aufgebaut und das verwüstete Land bepflanzt habe. Ich, Yahweh, habe gesprochen, und ich werde es tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich, Yahweh, habe gesprochen und es getan.“ Das letzte hebräische Verb steht formal in einer Perfektform; hier drückt es wahrscheinlich die Gewissheit dessen aus, was Yahweh vollbringen wird.'
    reason: Bewahrt die formale Vergangenheitslesart neben der im Kontext wahrscheinlichen zukünftigen Bedeutung.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Dann werden … erkennen
  rationale: Die Verbform führt die angekündigte Wiederherstellung als Folge weiter. „Dann“ gibt diesen Fortgang im Deutschen natürlich wieder, während das Futur die noch ausstehende Erkenntnis ausdrückt.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die Israel umgebenden Völker; „Nationen“ wäre möglich, „Heiden“ würde jedoch eine spätere religiöse Gegenüberstellung eintragen.
- source_word: אֲשֶׁר יִשָּׁאֲרוּ סְבִיבוֹתֵיכֶם
  choice: die rings um euch übrig geblieben sind
  rationale: Das Nifal von שׁאר bezeichnet diejenigen, die verblieben beziehungsweise nach dem Gericht übrig geblieben sind. „Rings um euch“ bildet die räumliche Beziehung idiomatisch ab.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּנִיתִי הַנֶּהֱרָסוֹת
  choice: die zerstörten Orte wieder aufgebaut habe
  rationale: Das Objekt bezeichnet das Niedergerissene beziehungsweise zerstörte Stätten. „Wieder aufgebaut“ macht den im Kontext klaren Wiederherstellungscharakter verständlich.
- source_word: נָטַעְתִּי הַנְּשַׁמָּה
  choice: das verwüstete Land bepflanzt habe
  rationale: נטע bedeutet „pflanzen, bepflanzen“. Das substantivierte Singularwort bezeichnet hier kollektiv das verwüstete Gebiet; „Land“ ist im Wiederherstellungskontext die natürlichste deutsche Ergänzung.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: habe gesprochen, und ich werde es tun
  rationale: Beide hebräischen Formen sind formal Perfektformen. In der prophetischen Zusage kann die zweite die Gewissheit des noch ausstehenden Handelns ausdrücken; das Futur gibt diesen Sinn im Deutschen klar wieder, ohne die formale Alternative zu verschweigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jahwe; Jehova
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Umschrift als persönlicher Name bewahrt diese Funktion, statt einen Titel einzusetzen.
- issue: Zeitbezug von וְעָשִׂיתִי in der prophetischen Schlussformel
  choice: ich werde es tun
  alternative: ich habe es getan
  rationale: Obwohl die Form morphologisch perfektiv ist, spricht der Zusammenhang von der sicheren Verwirklichung der angekündigten Wiederherstellung. Das deutsche Futur bildet diese prospektive Gewissheit ab; die formal mögliche Vergangenheitswiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rings um euch“ und „übrig geblieben“ sind allgemein verständlich; „wieder aufgebaut“ und „bepflanzt“ erhalten die parallelen Bilder von Wiederherstellung. Der Name „Yahweh“ bleibt unverändert.
