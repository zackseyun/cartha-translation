source:
  edition: WLC
  text: בֶּן אָדָ֗ם בֵּ֤ית יִשְׂרָאֵל֙ יֹשְׁבִ֣ים עַל אַדְמָתָ֔/ם וַ/יְטַמְּא֣וּ אוֹתָ֔/הּ בְּ/דַרְכָּ֖/ם וּ/בַ/עֲלִֽילוֹתָ֑/ם כְּ/טֻמְאַת֙ הַ/נִּדָּ֔ה הָיְתָ֥ה דַרְכָּ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/017.yaml
  text: Son of man[a], when the house of Israel was dwelling on their own land, they defiled it by their way and by their deeds; their way before me was like the uncleanness of a menstruating woman.
translation:
  language: de
  text: Menschensohn, als das Haus Israel in seinem Land wohnte, verunreinigte es das Land durch seinen Lebenswandel und seine Taten. Wie die Unreinheit einer Frau während ihrer Monatsblutung[a] war sein Lebenswandel vor mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wie die Unreinheit der Monatsblutung“. Das Hebräische vergleicht Israels Lebenswandel mit der kultischen Unreinheit, die mit der Menstruation verbunden war.'
    reason: Lexikalische Alternative und Erläuterung der kultischen Vergleichsfigur.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel feststehende prophetische Anrede wird idiomatisch und in literarischer Kontinuität wiedergegeben.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt den korporativen und bundesgeschichtlichen Charakter des hebräischen Ausdrucks.
- source_word: יֹשְׁבִים עַל אַדְמָתָם
  choice: als das Haus Israel in seinem Land wohnte
  rationale: Das Partizip bezeichnet einen andauernden Zustand; „als“ macht die zeitliche Funktion im Deutschen natürlich deutlich. „Land“ gibt אֲדָמָה im Kontext angemessen wieder.
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: verunreinigte es das Land
  rationale: „Verunreinigen“ wahrt die kultische und moralische Bedeutung von טמא. Das Bezugswort „Land“ wird wiederholt, damit das deutsche Pronomen nicht missverständlich ist.
- source_word: בְּדַרְכָּם
  choice: durch seinen Lebenswandel
  rationale: „Lebenswandel“ bewahrt die metaphorische Bedeutung von דֶּרֶךְ als Lebensführung und ist im Deutschen verständlicher als das wörtliche „Weg“.
- source_word: וּבַעֲלִילוֹתָם
  choice: und seine Taten
  rationale: „Taten“ gibt die konkreten Handlungen knapp und mit dem moralischen Gewicht des Zusammenhangs wieder.
- source_word: כְּטֻמְאַת הַנִּדָּה
  choice: wie die Unreinheit einer Frau während ihrer Monatsblutung
  rationale: Die konkrete kultische Vergleichsfigur wird ohne Euphemismus bewahrt und zugleich in verständlichem modernem Deutsch formuliert.
- source_word: הָיְתָה דַרְכָּם לְפָנָי
  choice: war sein Lebenswandel vor mir
  rationale: „Vor mir“ erhält Gottes bewertende Gegenwart; der Singular folgt im Deutschen dem Kollektiv „Haus Israel“.
theological_decisions:
- issue: Art der Unreinheitsmetaphorik
  choice: Der Bezug auf die mit der Monatsblutung verbundene kultische Unreinheit wird ausdrücklich wiedergegeben.
  alternative: Die Wendung allgemein als „Schmutz“ oder „Befleckung“ wiederzugeben.
  rationale: Der hebräische Text beschreibt Israels moralische Verunreinigung des Landes mit einem kultischen Vergleich. Diese Spannung darf nicht zu allgemeiner Abscheu-Sprache verflacht werden.
- issue: Korporativer Numerus von „Haus Israel“
  choice: Im Deutschen steht das Kollektiv im Singular.
  alternative: Nach „Haus Israel“ unvermittelt mit Pluralpronomen fortzufahren oder freier „die Israeliten“ zu schreiben.
  rationale: Der Singular ist grammatisch natürlich und bewahrt zugleich den korporativen Ausdruck; die inhaltliche Vielheit des Volkes bleibt erkennbar.
- issue: Zeitlicher Wert des einleitenden Partizips
  choice: Die zeitliche Beziehung wird mit „als“ ausdrücklich gemacht.
  alternative: Eine wörtlichere, syntaktisch abgebrochene Partizipialfügung.
  rationale: Das hebräische Partizip bildet den zeitlichen Hintergrund der folgenden Handlung; „als“ ist eine sprachlich notwendige Explizierung, keine theologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der traditionelle Ausdruck „Menschensohn“ und die korporative Bezeichnung „Haus Israel“ bleiben erhalten; unnötig beschönigende oder abwertende Sprache wird vermieden.
