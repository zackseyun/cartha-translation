  text: וְ/זָרַקְתִּ֧י עֲלֵי/כֶ֛ם מַ֥יִם טְהוֹרִ֖ים וּ/טְהַרְתֶּ֑ם מִ/כֹּ֧ל טֻמְאוֹתֵי/כֶ֛ם וּ/מִ/כָּל גִּלּ֥וּלֵי/כֶ֖ם אֲטַהֵ֥ר אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/025.yaml
  text: And I will sprinkle clean water on you[a], and you will be clean; from all your uncleannesses and from all your idols I will cleanse you.
translation:
  language: de
  text: Und ich werde reines Wasser auf euch sprengen, und ihr werdet rein sein. Von all euren Unreinheiten und von all euren Götzen[a] werde ich euch reinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und bewusst verächtlich: »Mistgötzen«; Ezechiel gebraucht häufig diese abwertende Bezeichnung für Götzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַקְתִּי
  choice: Und ich werde … sprengen
  rationale: Im Zusammenhang ritueller Reinigung bezeichnet זרק das Sprengen einer Flüssigkeit; »sprengen« ist hier im Deutschen präzise und idiomatisch.
- source_word: עֲלֵיכֶם
  choice: auf euch
  rationale: על bezeichnet hier die Personen, auf die das Wasser gesprengt wird; »auf euch« ist natürliches modernes Deutsch.
- source_word: מַיִם טְהוֹרִים
  choice: reines Wasser
  rationale: טָהוֹר bezeichnet kultische Reinheit; »reines Wasser« bewahrt diesen Sinn und die Verbindung zum folgenden Reinsein und Reinigen.
- source_word: וּטְהַרְתֶּם
  choice: und ihr werdet rein sein
  rationale: 'Die Form beschreibt den eintretenden Zustand. Diese Wiedergabe unterscheidet ihn vom späteren aktiven Handeln Gottes: »ich werde euch reinigen«.'
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: von all euren Unreinheiten
  rationale: Der Plural wird bewahrt; zugleich bleibt die Wortfeldverbindung zu »rein« und »reinigen« erkennbar.
- source_word: וּמִכָּל גִּלּוּלֵיכֶם
  choice: und von all euren Götzen
  rationale: »Götzen« ist im Haupttext verständlich und gibt die negative Wertung wieder; die besonders verächtliche Bildkraft des hebräischen Ausdrucks wird in der Fußnote erläutert.
- source_word: אֲטַהֵר אֶתְכֶם
  choice: werde ich euch reinigen
  rationale: Die Piel-Form stellt Gottes aktives Beseitigen der Unreinheit heraus. Die Formulierung bewahrt außerdem die Wiederholung des Wortfeldes טהר.
theological_decisions:
- issue: Art des Reinigungsbildes
  choice: Die Sprache kultischer und sittlicher Reinigung bleibt stehen, ohne einen sakramentalen Mechanismus festzulegen.
  alternative: Das Bild ausschließlich als nationale Wiederherstellung oder im Haupttext unmittelbar als Taufe zu deuten.
  rationale: Der hebräische Text verheißt im Zusammenhang der Wiederherstellung Gottes Reinigung von Unreinheit und Götzen. Mögliche spätere typologische Bezüge werden weder ausgeschlossen noch in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »rein«, »Unreinheiten« und »reinigen« bildet das hebräische Wortfeld möglichst deutlich nach. Der Satzbau bewahrt die nachdrückliche Schlussaussage Gottes.
