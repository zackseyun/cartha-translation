  text: וְ/לָקַחְתִּ֤י אֶתְ/כֶם֙ מִן הַ/גּוֹיִ֔ם וְ/קִבַּצְתִּ֥י אֶתְ/כֶ֖ם מִ/כָּל הָ/אֲרָצ֑וֹת וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/024.yaml
  text: For I will take you from the nations[a], and gather you from all the lands[c][b], and bring you into your own land.
translation:
  language: de
  text: Ich werde euch aus den Völkern[a] holen, euch aus allen Ländern sammeln und euch in euer Land bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus den Nationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Ich werde … holen
  rationale: לקח bezeichnet hier Gottes zielgerichtetes Herausnehmen der Zerstreuten. „Holen“ ist im Deutschen natürlicher als das wörtlichere „nehmen“ und bewahrt die aktive persönliche Zusage.
- source_word: מִן הַגּוֹיִם
  choice: aus den Völkern
  rationale: גּוֹיִם bezeichnet die fremden Völker, unter denen Israel zerstreut ist. „Völker“ gibt den ethnisch-politischen Sinn im prophetischen Zusammenhang natürlich wieder.
- source_word: וְקִבַּצְתִּי
  choice: euch … sammeln
  rationale: קבץ ist ein typisches Verb für das erneute Sammeln eines zerstreuten Volkes und trägt hier die Wiederherstellungsbedeutung.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: aus allen Ländern
  rationale: Der Plural אֲרָצוֹת meint die verschiedenen Länder beziehungsweise Gebiete, in die das Volk zerstreut wurde.
- source_word: וְהֵבֵאתִי
  choice: und euch … bringen
  rationale: Die Hifil-Form von בוא bedeutet „kommen lassen“ beziehungsweise „bringen“. „Zurückbringen“ wäre kontextuell möglich, doch „zurück“ steht nicht ausdrücklich im Hebräischen.
- source_word: אֶל אַדְמַתְכֶם
  choice: in euer Land
  rationale: אַדָמָה kann „Erdboden“, „Grund“ oder „Land“ bedeuten. Hier ist das Heimatland gemeint; das Possessivsuffix wird direkt mit „euer“ wiedergegeben.
theological_decisions:
- issue: Wiederherstellung und Zugehörigkeit des Landes
  choice: in euer Land
  alternative: in euer eigenes Land
  rationale: „Euer Land“ gibt das hebräische Possessivsuffix genau wieder und lässt die im Text angelegte Bundes- und Wiederherstellungsaussage stehen, ohne sie durch das verstärkende „eigenes“ weiter auszulegen.
- issue: Rückkehr als ausdrücklicher Zusatz
  choice: bringen
  alternative: zurückbringen
  rationale: Der Zusammenhang beschreibt eindeutig eine Rückführung, doch das Verb selbst sagt nur „bringen“. Die Übersetzung vermeidet daher, die kontextuelle Rückkehrkomponente ausdrücklich in das Verb einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei göttlichen Handlungen werden parallel und knapp wiedergegeben. Das einleitende וְ wird im Deutschen nicht eigens mit „und“ oder „denn“ übersetzt, weil der Vers als selbstständige Zusage so natürlicher beginnt und die hebräische Verknüpfung keine eindeutige Begründungspartikel enthält.
