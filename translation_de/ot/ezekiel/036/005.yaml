- from: 'Darum, so spricht der Herr Yahweh: So wahr ich lebe – im Feuer meiner Eifersucht habe ich gegen den Rest der Nationen[a] und gegen ganz Edom gesprochen. Sie haben mein Land mit ungetrübter Freude und aus tiefster Seele voller Verachtung für sich selbst in Besitz genommen[b], um sein Weideland zur Beute zu machen.[c]'
  to: 'Darum, so spricht der Herr Yahweh: Gewiss, im Feuer meiner Eifersucht habe ich gegen den Rest der Nationen[a] und gegen ganz Edom gesprochen, die mein Land mit Freude von ganzem Herzen und mit Verachtung aus tiefster Seele für sich in Besitz genommen haben[b], um sein Weideland zur Beute zu machen.[c]'
  rationale: Die Revision entfernt die nicht im Hebräischen ausgedrückte Ergänzung „ich lebe“, gibt die Ganzherzigkeit der Freude genauer wieder und ordnet die Satzglieder so, dass die selbstbezogene Aneignung des Landes eindeutig bleibt. Die Fußnote zur Schlussklausel bewahrt deren Schwierigkeit, ohne eine weitergehende Deutung als gleichwertigen Wortlaut auszugeben.
