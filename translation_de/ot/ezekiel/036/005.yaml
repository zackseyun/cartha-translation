source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֠א בְּ/אֵ֨שׁ קִנְאָתִ֥/י דִבַּ֛רְתִּי עַל שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם וְ/עַל אֱד֣וֹם כֻּלָּ֑/א אֲשֶׁ֣ר נָתְנֽוּ אֶת אַרְצִ֣/י לָ֠/הֶם לְ/מ֨וֹרָשָׁ֜ה בְּ/שִׂמְחַ֤ת כָּל לֵבָב֙ בִּ/שְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖/הּ לָ/בַֽז־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/005.yaml
  text: 'Therefore thus says the Lord GOD: Surely in the fire of my jealousy I have spoken against the remnant of the nations and against all Edom[a], who gave my land to themselves as a possession with wholehearted joy and with contempt of soul[c][b], in order to make its pastureland plunder.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Gewiss, im Feuer meiner Eifersucht habe ich gegen den Rest der Nationen[a] und gegen ganz Edom gesprochen, die mein Land mit Freude von ganzem Herzen und mit Verachtung aus tiefster Seele für sich in Besitz genommen haben[b], um sein Weideland zur Beute zu machen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die verbliebenen Nationen“; שְׁאֵרִית kann „Rest“, „Überrest“ oder „das Übriggebliebene“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die mein Land sich selbst zum Besitz gegeben haben“; מוֹרָשָׁה kann auch „Erbbesitz“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Der knappe hebräische Schluss ist schwer zu deuten. Möglich ist auch eine Wiedergabe wie: „um sein offenes Land zu plündern“.'
    reason: textual_difficulty
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne die beiden Elemente zu einem doppelten „Herr“ zu verschmelzen.
- source_word: אִם לֹא
  choice: So wahr ich lebe
  rationale: Die Verbindung leitet hier eine feierliche göttliche Beteuerung ein. Die deutsche Schwurformel vermittelt ihre Funktion natürlicher als das wörtliche „wenn nicht“; der elliptische hebräische Ausdruck wird damit sinngemäß entfaltet.
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: im Feuer meiner Eifersucht
  rationale: Bewahrt das konkrete Feuerbild und die relationale wie richtende Schärfe von קִנְאָה.
- source_word: שְׁאֵרִית הַגּוֹיִם
  choice: der Rest der Nationen
  rationale: שְׁאֵרִית bezeichnet hier die übrigen beziehungsweise verbliebenen Völker; „Rest“ wahrt die lexikalische Offenheit, ohne dem Ausdruck von sich aus einen positiven theologischen Sinn zu geben.
- source_word: אֱדוֹם כֻּלָּהּ
  choice: ganz Edom
  rationale: Natürliche und genaue Wiedergabe der Gesamtheit Edoms.
- source_word: נָתְנוּ אֶת אַרְצִי לָהֶם לְמוֹרָשָׁה
  choice: haben mein Land … für sich selbst in Besitz genommen
  rationale: Das formal als „geben“ formulierte eigenmächtige Zueignen wird im Deutschen idiomatisch als Inbesitznahme ausgedrückt. מוֹרָשָׁה kann sowohl Besitz als auch Erbbesitz bezeichnen.
- source_word: בְּשִׂמְחַת כָּל לֵבָב
  choice: mit ungetrübter Freude
  rationale: Gibt die Freude „des ganzen Herzens“ als uneingeschränkte, rückhaltlose Freude in natürlichem Deutsch wieder.
- source_word: בִּשְׁאָט נֶפֶשׁ
  choice: aus tiefster Seele voller Verachtung
  rationale: Bewahrt sowohl den inneren Bezug von נֶפֶשׁ als auch die Verachtung beziehungsweise den Hohn von שְׁאָט.
- source_word: לְמַעַן מִגְרָשָׁהּ לָבַז
  choice: um sein Weideland zur Beute zu machen
  rationale: Versteht מִגְרָשׁ als offenes Weide- oder Umland und לָבַז als Bestimmung zur Beute. Da die knappe hebräische Wendung schwierig ist, werden andere Deutungen in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: „Yahweh“ macht den im Ausgangstext ausdrücklich stehenden Gottesnamen erkennbar; „Herr“ gibt אֲדֹנָי wieder.
- issue: Bedeutung von קִנְאָה als göttliche Haltung
  choice: Eifersucht
  alternative: Eifer
  rationale: „Eifersucht“ erhält die personale und bundestheologische Spannung des Wortes, ohne sie auf bloßen Tatendrang zu verengen.
- issue: Charakter der Aneignung des Landes
  choice: für sich selbst in Besitz genommen
  alternative: sich zum Erbbesitz gegeben
  rationale: Der Zusammenhang betont die widerrechtliche Aneignung. Die mögliche Erbbesitz-Nuance bleibt in einer Fußnote sichtbar, ohne eine legitime Erbberechtigung anzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Schwurformel ist klar und feierlich formuliert; konkrete Bilder wie „Feuer“ und „Eifersucht“ bleiben erhalten. Die syntaktische Dichte des Hebräischen wird durch zwei deutsche Sätze lesbarer gemacht, während die Unsicherheit der Schlussklausel ausdrücklich dokumentiert wird.
