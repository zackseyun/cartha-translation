  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִי֙ אֶת פְּרִ֣י הָ/עֵ֔ץ וּ/תְנוּבַ֖ת הַ/שָּׂדֶ֑ה לְמַ֗עַן אֲ֠שֶׁר לֹ֣א תִקְח֥וּ ע֛וֹד חֶרְפַּ֥ת רָעָ֖ב בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/030.yaml
  text: And I will multiply the fruit of the tree and the produce of the field[a], so that you will no longer bear the reproach of famine among the nations.
translation:
  language: de
  text: Und ich werde die Frucht der Bäume und den Ertrag des Feldes mehren, damit ihr unter den Völkern nicht länger die Schmach einer Hungersnot tragen müsst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit ihr unter den Völkern nicht länger wegen einer Hungersnot Schmach erleidet.“'
    reason: Die Verbindung von לקח mit חֶרְפָּה kann idiomatisch sowohl als „Schmach tragen“ als auch als „Schmach erleiden“ wiedergegeben werden; zugleich lässt sich רָעָב attributiv beziehungsweise ursächlich verstehen.
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Und ich werde … mehren
  rationale: Das Hifil Perfekt 1. Person Singular mit וְ bezeichnet in diesem prophetischen Zusammenhang Gottes künftiges, ursächliches Handeln. „Mehren“ bewahrt diesen Sinn und passt zum landwirtschaftlichen Kontext.
- source_word: פְּרִי הָעֵץ
  choice: die Frucht der Bäume
  rationale: Der hebräische Singular עֵץ kann kollektiv gebraucht sein. Im heutigen Deutsch drückt „der Bäume“ den gemeinten kollektiven Bestand natürlich und eindeutig aus.
- source_word: וּתְנוּבַת הַשָּׂדֶה
  choice: und den Ertrag des Feldes
  rationale: תְּנוּבָה bezeichnet Ertrag oder Erzeugnis. „Ertrag“ ist im landwirtschaftlichen Zusammenhang präzise und gibt den kollektiven Singular הַשָּׂדֶה angemessen wieder.
- source_word: לְמַעַן אֲשֶׁר
  choice: damit
  rationale: Die Verbindung führt Zweck beziehungsweise beabsichtigte Folge ein; „damit“ ist die natürliche moderne deutsche Entsprechung.
- source_word: לֹא תִקְחוּ עוֹד
  choice: nicht länger … tragen müsst
  rationale: לקח bedeutet gewöhnlich „nehmen/empfangen“, bildet mit חֶרְפָּה hier aber eine Wendung für das Erleiden beziehungsweise Tragen von Schmach. Die modale Formulierung ist im Deutschen idiomatisch, ohne den Sinn auf bloßes Empfangen zu verengen.
- source_word: חֶרְפַּת רָעָב
  choice: die Schmach einer Hungersnot
  rationale: Die Constructusverbindung bezeichnet die öffentliche Schmach, die mit einer Hungersnot verbunden ist. „Schmach“ bewahrt stärker als „Not“ oder „Elend“ die Ehr- und Ansehensdimension.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם meint die Israel umgebenden Völker. „Unter den Völkern“ entspricht der Präposition und vermeidet die neutestamentlich gefärbte Wiedergabe „Heiden“.
theological_decisions:
- issue: Ob die Verheißung vor allem landwirtschaftlichen Wohlstand oder die Wiederherstellung von Israels Ansehen vor den Völkern betont
  choice: 'Die Übersetzung hält beides zusammen: Gott vermehrt Frucht und Feldertrag, damit Israel die mit Hungersnot verbundene öffentliche Schmach unter den Völkern nicht länger tragen muss.'
  alternative: Die Aussage entweder als rein wirtschaftliche Verheißung oder ausschließlich als Wiederherstellung der Ehre wiederzugeben.
  rationale: Der hebräische Text verbindet die materielle Fülle ausdrücklich mit der Beseitigung öffentlicher Schmach; keine der beiden Dimensionen sollte zugunsten der anderen aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mehren“ und „Schmach“ erhalten den prophetischen Ton, bleiben aber allgemein verständlich. Der kollektive hebräische Singular bei „Baum“ wird im Deutschen natürlich als Plural wiedergegeben.
