  variant: modern standard German
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֞י אֶת שְׁמִ֣/י הַ/גָּד֗וֹל הַֽ/מְחֻלָּל֙ בַּ/גּוֹיִ֔ם אֲשֶׁ֥ר חִלַּלְתֶּ֖ם בְּ/תוֹכָ֑/ם וְ/יָדְע֨וּ הַ/גּוֹיִ֜ם כִּי אֲנִ֣י יְהוָ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/הִקָּדְשִׁ֥/י בָ/כֶ֖ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/023.yaml
  text: I will sanctify my great name[a], which has been profaned among the nations, which you have profaned among them. Then the nations will know that I am Yahweh, declares the Lord GOD[b], when I show myself holy through you before their eyes.
translation:
  language: de
  text: Ich werde meinen großen Namen heiligen[a], der unter den Völkern entweiht worden ist, den ihr mitten unter ihnen entweiht habt. Dann werden die Völker erkennen, dass ich Jahwe bin – Ausspruch des Herrn Jahwe –, wenn ich mich durch euch vor ihren Augen als heilig erweise.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Ich werde die Heiligkeit meines großen Namens öffentlich erweisen.'
    reason: Die Erläuterung verhindert das Missverständnis, Gottes Name müsse erst heilig gemacht werden, während der Haupttext die Form des hebräischen Verbs bewahrt.
  - marker: b
    text: 'Oder formnäher: „wenn ich mich an euch vor ihren Augen als heilig erweise“; auch möglich: „wenn ich in euch vor ihren Augen geheiligt werde“.'
    reason: Die Präposition ב und die reflexiv-passive Form lassen neben der instrumentalen Wiedergabe auch eine lokale beziehungsweise relationale Übersetzung zu.
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: Ich werde … heiligen
  rationale: Die direkte Wiedergabe wahrt die Verbindung zum hebräischen קדשׁ und lässt im Kontext erkennen, dass Gottes Name öffentlich als heilig erwiesen wird, nicht erst innere Heiligkeit erhält.
- source_word: שְׁמִי הַגָּדוֹל
  choice: meinen großen Namen
  rationale: Natürliche attributive Wiedergabe, die sowohl Gottes Ruf als auch seine Majestät umfasst.
- source_word: הַמְחֻלָּל
  choice: der … entweiht worden ist
  rationale: Das Pual-Partizip bezeichnet hier die profanierende Behandlung des göttlichen Namens; „entweihen“ ist im Deutschen präzise und verständlich.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: „Völker“ entspricht dem alttestamentlichen Kontext besser als eine spätere heilsgeschichtliche Bezeichnung wie „Heiden“.
- source_word: אֲשֶׁר חִלַּלְתֶּם בְּתוֹכָם
  choice: den ihr mitten unter ihnen entweiht habt
  rationale: Der Relativsatz greift „meinen großen Namen“ auf; „mitten unter ihnen“ gibt בְּתוֹכָם anschaulich wieder.
- source_word: וְיָדְעוּ
  choice: Dann werden … erkennen
  rationale: „Dann“ bringt die resultative Folge von Gottes Handeln natürlich zum Ausdruck; „erkennen“ bewahrt die umfassendere Bedeutung gegenüber bloßem Faktenwissen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: „Ausspruch“ bildet die prophetische Formel knapp und würdig ab; die Kombination „Herr Jahwe“ bewahrt sowohl אֲדֹנָי als Titel als auch den Gottesnamen.
- source_word: בְּהִקָּדְשִׁי בָכֶם
  choice: wenn ich mich durch euch … als heilig erweise
  rationale: Die Form bezeichnet Gottes öffentliches Offenbarwerden als heilig. „Durch euch“ gibt die kontextuell instrumentale Deutung von בָכֶם wieder, ohne die formal mögliche lokale Deutung zu verschweigen.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die feste Wendung betont die öffentliche, sichtbare Dimension des Handelns Gottes.
theological_decisions:
- issue: Heiligung des Namens Gottes
  choice: Ich werde meinen großen Namen heiligen
  alternative: Ich werde die Heiligkeit meines großen Namens erweisen
  rationale: Die gewählte Fassung bleibt näher am hebräischen Verb und bewahrt die theologische Spannung. Der Zusammenhang mit der Entweihung macht deutlich, dass Gott die Heiligkeit seines Namens öffentlich zur Geltung bringt, nicht dass sein Name zuvor unheilig wäre.
- issue: Bedeutung von בָכֶם bei Gottes Selbsterweis als heilig
  choice: durch euch
  alternative: an euch / in euch
  rationale: Im Kontext erkennen die Völker Gottes Heiligkeit an dem, was er mit Israel tut. Da die Präposition auch lokaler beziehungsweise relational verstanden werden kann, wird die formnähere Alternative in einer Fußnote erhalten.
- issue: Wiedergabe der Gottesnamen in נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  alternative: spricht Gott, der Herr
  rationale: Die Fassung unterscheidet Titel und Eigenname transparent, ohne das Tetragramm durch „HERR“ oder „Gott“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, vermeidet jedoch unnötige Steifheit. „Entweihen“, „Ausspruch“ und „als heilig erweisen“ halten den kultisch-theologischen Wortlaut verständlich; „Jahwe“ bewahrt den Gottesnamen.
