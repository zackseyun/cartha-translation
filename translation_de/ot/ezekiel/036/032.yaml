source:
  edition: WLC
  text: לֹ֧א לְמַעַנְ/כֶ֣ם אֲנִֽי עֹשֶׂ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה יִוָּדַ֖ע לָ/כֶ֑ם בּ֧וֹשׁוּ וְ/הִכָּלְמ֛וּ מִ/דַּרְכֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/032.yaml
  text: It is not for your sake that I am acting[a], declares the Lord GOD; let it be known to you. Be ashamed and humiliated because of your ways, O house of Israel.
translation:
  language: de
  text: Nicht um euretwillen handle ich – Ausspruch Jahwes, des Herrn. Das soll euch bekannt sein! Schämt euch und seid beschämt wegen eurer Wege, Haus Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Wege“ meint hier Israels Verhalten und seine Lebensführung.
    reason: metaphor_clarification
lexical_decisions:
- source_word: לְמַעַנְכֶם
  choice: um euretwillen
  rationale: Die Wendung gibt den Zweck- beziehungsweise Begünstigungsbezug von לְמַעַן knapp und idiomatisch wieder und verneint, dass Gottes Handeln um Israels willen geschieht.
- source_word: עֹשֶׂה
  choice: handle ich
  rationale: Das Partizip von עשה bezeichnet hier Gottes gegenwärtiges beziehungsweise angekündigtes Eingreifen; „handle ich“ ist natürlicher als das unspezifische „tue ich“.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch Gottes, des HERRN
  rationale: „Ausspruch“ bewahrt den nominalen Charakter der prophetischen Formel נְאֻם. Die im Deutschen geläufige Wiedergabe „Gott, der HERR“ unterscheidet den Herrentitel vom Gottesnamen; der Genitiv wurde an die Satzfügung angepasst.
- source_word: יִוָּדַע לָכֶם
  choice: Das soll euch bekannt sein
  rationale: Die passive Form von ידע wird bewahrt und zugleich als nachdrückliche Aufforderung verständlich formuliert, ohne sie eindeutig in ein aktives „Wisst“ umzudeuten.
- source_word: בּוֹשׁוּ
  choice: Schämt euch
  rationale: Der Imperativ fordert Israel unmittelbar zu einer seiner Lebensführung entsprechenden Scham auf.
- source_word: וְהִכָּלְמוּ
  choice: und werdet zuschanden
  rationale: כלם bezeichnet Beschämung oder Schande. „Werdet zuschanden“ unterscheidet das zweite Verb vom vorausgehenden בוש und erhält die steigernde Doppelung.
- source_word: מִדַּרְכֵיכֶם
  choice: wegen eurer Wege
  rationale: מן bezeichnet bei den Verben der Scham den Anlass beziehungsweise Grund; „Wege“ bewahrt das biblische Bild für Lebensführung und Verhalten.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die direkte Anrede bleibt ohne das im heutigen Deutsch altertümlich wirkende „o“ klar erkennbar.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Gottes, des HERRN
  alternative: des Herrn JHWH / des Herrn Jahwe
  rationale: Die traditionelle deutsche Titelform unterscheidet אֲדֹנָי von יהוה und ist für ein breites Publikum verständlich. Sie vermeidet sowohl die schwer lesbare Folge „Herr HERR“ als auch die Festlegung auf eine bestimmte Aussprache des Tetragramms.
- issue: Motiv von Gottes Handeln
  choice: Nicht um euretwillen
  alternative: Nicht zu eurem Vorteil
  rationale: Die Formulierung lässt offen, ob vor allem Israels fehlendes Verdienst, Gottes Beweggrund oder der Begünstigungszweck im Blick steht, und löst diese theologische Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Direktheit. Der Gedankenstrich markiert die eingeschobene Ausspruchsformel; der Ausrufesatz erhält den Nachdruck der hebräischen Aufforderungsfolge.
