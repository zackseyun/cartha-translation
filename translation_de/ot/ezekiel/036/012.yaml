source:
  edition: WLC
  text: וְ/הוֹלַכְתִּי֩ עֲלֵי/כֶ֨ם אָדָ֜ם אֶת עַמִּ֤/י יִשְׂרָאֵל֙ וִֽ/ירֵשׁ֔וּ/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/נַחֲלָ֑ה וְ/לֹא תוֹסִ֥ף ע֖וֹד לְ/שַׁכְּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/012.yaml
  text: And I will cause people—my people Israel—to walk upon you[a], and they will possess you, and you will be their inheritance[c][b], and you will no longer bereave them.
translation:
  language: de
  text: Und ich werde Menschen – mein Volk Israel – über euch ziehen lassen.[a] Sie werden euch in Besitz nehmen,[b] und ihr werdet ihr Erbteil sein. Ihr werdet sie nicht länger ihrer Kinder berauben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde Menschen zu euch bringen, nämlich mein Volk Israel.“ Wörtlich steht im Hebräischen: „Ich werde einen Menschen über euch gehen lassen“; „mein Volk Israel“ erklärt, wer damit gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie werden euch erben.“ Das hebräische Verb kann im Zusammenhang mit Land sowohl „in Besitz nehmen“ als auch „erben“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sie nicht länger kinderlos machen“. Gemeint ist, dass das Land ihnen nicht mehr ihre Kinder beziehungsweise Bewohner nehmen wird.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהוֹלַכְתִּי עֲלֵיכֶם אָדָם
  choice: ich werde Menschen über euch ziehen lassen
  rationale: Der Hifil von הלך ist kausativ; zusammen mit עֲלֵיכֶם und dem als Mehrzahl angeredeten Bergland bezeichnet die Wendung Menschen, die sich über das Land bewegen und es wieder bewohnen. „Menschen“ gibt den kollektiven Sinn von אָדָם im Deutschen natürlich wieder.
- source_word: אֶת עַמִּי יִשְׂרָאֵל
  choice: mein Volk Israel
  rationale: Die Wendung erläutert appositionell, welche Menschen gemeint sind. Der Gedankenstrich bewahrt diese erklärende Beziehung.
- source_word: וִירֵשׁוּךָ
  choice: sie werden euch in Besitz nehmen
  rationale: ירשׁ kann bei Land sowohl „in Besitz nehmen“ als auch „erben“ bedeuten. Hier ist „in Besitz nehmen“ idiomatisch und vermeidet eine unnötige Verdopplung mit נַחֲלָה im folgenden Satzteil.
- source_word: וְהָיִיתָ לָהֶם לְנַחֲלָה
  choice: ihr werdet ihr Erbteil sein
  rationale: „Erbteil“ bewahrt die prägnante Bezeichnung für das Israel von Gott zugewiesene Land und unterscheidet sich zugleich sinnvoll vom vorherigen Verb ירשׁ.
- source_word: וְלֹא תוֹסִף עוֹד לְשַׁכְּלָם
  choice: ihr werdet sie nicht länger ihrer Kinder berauben
  rationale: תוסיף עוד bezeichnet das Ende einer wiederholten Handlung; „nicht länger“ ist dafür natürliches Deutsch. Der Piel von שׁכל meint das Kinderlosmachen beziehungsweise Berauben der Kinder, was hier explizit wiedergegeben wird.
theological_decisions:
- issue: Bundes- und Landterminologie
  choice: Erbteil
  alternative: Besitz
  rationale: „Erbteil“ erhält die theologische Spannung zwischen tatsächlicher Besitznahme und dem Land als Israel zugewiesenem Erbe, ohne die Aussage konfessionell weiter auszudeuten.
- issue: Personifizierung des Landes
  choice: ihr werdet sie nicht länger ihrer Kinder berauben
  alternative: ihr werdet sie nicht länger kinderlos machen
  rationale: Die direkte Anrede des Berglands und dessen bildhafte Verantwortung für den Verlust von Bewohnern beziehungsweise Kindern werden bewahrt; die konkrete Bedeutung von שׁכל wird nicht verallgemeinert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Pluralanrede „euch/ihr“ folgt dem Hebräischen, das die Berge beziehungsweise das Bergland Israels anspricht. Der Gedankenstrich macht die Apposition lesbar, ohne die syntaktische Spannung aufzulösen.
