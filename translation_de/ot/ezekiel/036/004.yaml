source:
  edition: WLC
  text: לָ/כֵן֙ הָרֵ֣י יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים וְ/לַ/גֵּאָי֗וֹת וְ/לֶ/חֳרָב֤וֹת הַ/שֹּֽׁמְמוֹת֙ וְ/לֶ/עָרִ֣ים הַ/נֶּעֱזָב֔וֹת אֲשֶׁ֨ר הָי֤וּ לְ/בַז֙ וּ/לְ/לַ֔עַג לִ/שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם אֲשֶׁ֥ר מִ/סָּבִֽיב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/004.yaml
  text: 'Therefore[a], mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys[b], to the desolate ruins and to the abandoned cities that have become plunder and mockery to the remnant of the nations that are all around:'
translation:
  language: de
  text: 'Darum, ihr Berge Israels, hört das Wort des Herrn Yahweh! So spricht der Herr Yahweh zu den Bergen und Hügeln, zu den Schluchten[a] und Tälern, zu den verwüsteten Ruinen und verlassenen Städten, die dem Rest[b] der Völker ringsum zur Beute und zum Gespött geworden sind:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Wasserläufen“ beziehungsweise „Bachbetten“ (אֲפִיקִים).
    reason: lexical_alternative
  - marker: b
    text: Oder „dem Überrest der Völker ringsum“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und natürlich wieder und knüpft den Ausspruch an die vorausgehende Anklage an.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: ihr Berge Israels
  rationale: Die Anrede wird ausdrücklich markiert; zugleich bleibt die Personifikation der Landschaft erhalten.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der pluralische Imperativ bewahrt den würdevollen prophetischen Ton und entspricht der direkten Anrede.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der prophetischen Botenformel ist „Wort“ transparent und traditionsnah, ohne den Ausdruck auf eine bloße Mitteilung zu verengen.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet eine Verschmelzung beider Bestandteile.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Geläufige und würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲפִיקִים
  choice: Schluchten
  rationale: Im topografischen Zusammenhang bezeichnet das Wort vertiefte Rinnen oder Wasserläufe; „Schluchten“ passt zur Landschaftsreihe, ohne Wasserführung zwingend vorauszusetzen.
- source_word: גֵּאָיוֹת
  choice: Täler
  rationale: Breite, natürliche Wiedergabe des topografischen Begriffs.
- source_word: חֳרָבוֹת הַשֹּׁמְמוֹת
  choice: die verwüsteten Ruinen
  rationale: Bewahrt sowohl den Begriff für Ruinen als auch die zusätzliche Aussage ihrer Verödung beziehungsweise Verwüstung.
- source_word: עָרִים הַנֶּעֱזָבוֹת
  choice: die verlassenen Städte
  rationale: Klare moderne Wiedergabe des passivischen Ausdrucks für zurückgelassene beziehungsweise aufgegebene Städte.
- source_word: לְבַז וּלְלַעַג
  choice: zur Beute und zum Gespött
  rationale: Die deutsche Paarformel gibt wieder, dass die Orte sowohl ausgeplündert als auch verhöhnt wurden.
- source_word: שְׁאֵרִית הַגּוֹיִם אֲשֶׁר מִסָּבִיב
  choice: dem Rest der Völker ringsum
  rationale: „Rest“ wahrt die mögliche Bedeutung von שְׁאֵרִית, während „ringsum“ die räumliche Aussage des Hebräischen knapp erhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form stellt Titel und Eigenname getrennt dar und macht den im hebräischen Text ausdrücklich stehenden Gottesnamen sichtbar.
- issue: Mögliche theologische Färbung von שְׁאֵרִית
  choice: der Rest der Völker
  alternative: der Überrest der Völker
  rationale: „Rest“ bewahrt die lexikalische Bedeutung, ohne an dieser Stelle von sich aus eine heilsgeschichtliche Bedeutung des Ausdrucks festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Sprachklang. Die direkte Anrede wird durch „ihr“ verdeutlicht; die lange Aufzählung und der abschließende Doppelpunkt bleiben als Teil der fortlaufenden Gottesrede erhalten.
