  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ע֗וֹד זֹ֛את אִדָּרֵ֥שׁ לְ/בֵֽית יִשְׂרָאֵ֖ל לַ/עֲשׂ֣וֹת לָ/הֶ֑ם אַרְבֶּ֥ה אֹתָ֛/ם כַּ/צֹּ֖אן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
translation:
  language: de
  text: 'So spricht der Herr Jahwe: Auch in dieser Sache werde ich mich vom Haus Israel bitten lassen, dies für sie zu tun:[a] Ich werde sie vermehren wie eine Herde von Menschen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch in dieser Sache werde ich mich vom Haus Israel ersuchen lassen, für sie zu handeln.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „wie eine Herde Mensch“; gemeint ist eine große Menschenmenge, die mit einer Herde verglichen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: 'Gibt beide Bestandteile des zusammengesetzten Gottestitels wieder: אֲדֹנָי als „der Herr“ und den Gottesnamen יְהוִה als „Jahwe“, ohne die Doppelung „Herr HERR“.'
- source_word: עוֹד זֹאת
  choice: Auch darum
  rationale: עוֹד hat hier additive beziehungsweise weiterführende Kraft; זֹאת verweist auf die zuvor zugesagte Wiederherstellung und Vermehrung. „Auch darum“ ist im Deutschen natürlich und bindet die Bitte an diese Zusage zurück.
- source_word: אִדָּרֵשׁ
  choice: werde ich mich … bitten lassen
  rationale: Der Nifal von דרש kann ausdrücken, dass Gott sich aufsuchen, befragen oder ersuchen lässt. Die Formulierung wahrt sowohl Gottes zugesagtes Handeln als auch Israels notwendige Bitte.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: vom Haus Israel
  rationale: Bewahrt die korporative Bundesbezeichnung des Hebräischen; „Haus Israel“ ist im Deutschen verständlich und bibelsprachlich vertraut.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: es für sie zu tun
  rationale: Das unbestimmte עשה wird nicht inhaltlich verengt. Das Pronomen „es“ greift die angesprochene Sache auf und ergibt eine natürliche deutsche Konstruktion.
- source_word: אַרְבֶּה אֹתָם
  choice: Ich werde sie vermehren
  rationale: Der Hifil von רבה bezeichnet das Zahlreichmachen beziehungsweise Vermehren und passt zur Wiederherstellungszusage.
- source_word: כַּצֹּאן אָדָם
  choice: wie eine Herde von Menschen
  rationale: Bewahrt die auffällige Verbindung von „Herde“ und dem kollektiv gebrauchten אָדָם, bleibt aber im Deutschen verständlicher als „Menschenherde“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens im Titel אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung macht den offen im hebräischen Text stehenden Bundesnamen kenntlich und gibt zugleich אֲדֹנָי wieder.
- issue: Verhältnis von göttlicher Zusage und Israels Bitte in אִדָּרֵשׁ
  choice: werde ich mich vom Haus Israel bitten lassen
  alternative: werde ich vom Haus Israel befragt werden
  rationale: 'Die Übersetzung löst die Spannung nicht auf: Gott sagt die Vermehrung verbindlich zu und erklärt dennoch, dass Israel ihn darum bitten soll beziehungsweise darf.'
- issue: Kollektiver Sinn von אָדָם
  choice: Menschen
  alternative: Menschheit
  rationale: Im Zusammenhang bezeichnet אָדָם eine menschliche Menge. „Menschen“ gibt den generischen kollektiven Sinn natürlich wieder, ohne die Herdenmetapher zu beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache mit maßvoll bewahrter biblischer Prägung. Die ungewöhnliche Herdenmetapher bleibt sichtbar; die schwierige Nifalform wird idiomatisch wiedergegeben und in der Fußnote enger am möglichen Wortsinn erläutert.
