  language: de
  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Das Wayyiqtol von היה eröffnet hier als übliche Erzähl- und Anschlussformel einen neuen Offenbarungsabschnitt. Zusammen mit dem folgenden Subjekt wird es im Deutschen natürlich durch „Und … kam“ wiedergegeben, statt wörtlich und schwerfällig mit „Und es geschah“.
- source_word: דְבַר
  choice: das Wort
  rationale: In prophetischen Empfangsformeln bezeichnet דָּבָר das göttliche Wort beziehungsweise die Botschaft. „Das Wort“ bewahrt die feste prophetische Ausdrucksweise und den würdevollen Stil.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben. Der Genitiv „Jahwes“ entspricht der hebräischen Status-constructus-Verbindung דְבַר יְהוָה und klingt im Deutschen natürlich.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bezeichnet die Richtung zum Propheten; „zu mir“ ist die direkte und idiomatische Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר führt die unmittelbar folgende Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte und hier syntaktisch unvollständige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen יהוה. „Jahwe“ gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen; „Jehova“ beruht auf einer späteren Verbindung der Konsonanten mit anderen Vokalzeichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „das Wort Jahwes kam zu mir“ bleibt erhalten; der Doppelpunkt leitet knapp und natürlich die in Vers 13 folgende Gottesrede ein.
