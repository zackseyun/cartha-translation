source:
  edition: WLC
  text: א֛וֹ דֶּ֥בֶר אֲשַׁלַּ֖ח אֶל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/שָׁפַכְתִּ֨י חֲמָתִ֤/י עָלֶ֨י/הָ֙ בְּ/דָ֔ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/019.yaml
  text: Or if I send a plague against that land and pour out my wrath on it with blood[a], to cut off from it man and beast,
translation:
  language: de
  text: Oder wenn ich eine Seuche gegen jenes Land schicke und meinen Zorn in Blut[a] über es ausgieße, um Mensch und Tier daraus auszurotten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „in Blut“; auch möglich: „durch Blutvergießen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Oder wenn
  rationale: Im Zusammenhang der aufeinanderfolgenden Gerichtsfälle leitet אוֹ einen weiteren hypothetischen Fall ein; „Oder wenn“ macht dies im Deutschen klar.
- source_word: דֶּבֶר
  choice: Seuche
  rationale: Das Wort bezeichnet eine epidemische Krankheit als Gericht. „Seuche“ ist im modernen Deutsch verständlich und weniger auf eine bestimmte Krankheit festgelegt als „Pest“.
- source_word: אֲשַׁלַּח אֶל הָאָרֶץ הַהִיא
  choice: ich eine Seuche gegen jenes Land schicke
  rationale: „Schicken“ gibt das Verb unmittelbar wieder; „gegen“ bringt in diesem Gerichtskontext die feindliche Zielrichtung von אֶל zum Ausdruck.
- source_word: וְשָׁפַכְתִּי חֲמָתִי עָלֶיהָ
  choice: und meinen Zorn über ihm … ausgieße
  rationale: Die Wendung bewahrt das Bild des ausgegossenen göttlichen Zorns. Das Pronomen bezieht sich auf „Land“.
- source_word: בְּדָם
  choice: mit Blut
  rationale: Die knappe, bildhafte Formulierung wahrt die Unbestimmtheit der hebräischen Präposition; die wörtlichere Form und die Deutung als Blutvergießen stehen in der Fußnote.
- source_word: לְהַכְרִית מִמֶּנָּה
  choice: um … daraus auszurotten
  rationale: Das Hifil von כרת bezeichnet hier die völlige Beseitigung aus dem Land. „Ausrotten“ gibt die Schwere des Gerichts idiomatisch wieder.
- source_word: אָדָם וּבְהֵמָה
  choice: Mensch und Tier
  rationale: Die feste Paarung bezeichnet umfassend menschliches und tierisches Leben; der Singular bewahrt die prägnante hebräische Formel.
theological_decisions:
- issue: Generische Bedeutung von אָדָם in der Gerichtsformel
  choice: Mensch
  alternative: Menschen / Menschheit
  rationale: אָדָם bezeichnet hier nicht ausschließlich männliche Personen, sondern die Menschen im Gegensatz zu den Tieren. „Mensch und Tier“ bewahrt zugleich die knappe Formel.
- issue: Bedeutung von בְּדָם als Ausdruck des Gerichts
  choice: mit Blut
  alternative: durch Blutvergießen
  rationale: Der hebräische Ausdruck ist äußerst knapp und kann das Mittel oder die blutige Gestalt des Gerichts bezeichnen. Die Übersetzung legt die genaue Beziehung nicht unnötig fest; die ausdeutende Möglichkeit wird angemerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Gerichtsformel „Mensch und Tier“ bleibt erhalten; die ungewöhnliche Bildsprache bei „Blut“ wird im Haupttext bewahrt und in der Fußnote erläutert.
