revisions:
- from: Oder wenn ich eine Seuche gegen jenes Land schicke und meinen Zorn über ihm mit Blut[a] ausgieße, um Mensch und Tier daraus auszurotten,
  to: Oder wenn ich eine Seuche gegen jenes Land schicke und meinen Zorn in Blut[a] über es ausgieße, um Mensch und Tier daraus auszurotten,
  rationale: Die Revision korrigiert den Kasus bei „über es“ und gibt בְּדָם mit der quellenäheren, im Deutschen traditionsfähigen Bildformel „in Blut“ wieder. Die Fußnote erhält die mögliche ausdeutende Lesart, ohne sie dem Haupttext aufzuzwingen.
