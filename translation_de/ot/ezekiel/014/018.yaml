  text: וּ/שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֥א יַצִּ֖ילוּ בָּנִ֣ים וּ/בָנ֑וֹת כִּ֛י הֵ֥ם לְ/בַדָּ֖/ם יִנָּצֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/018.yaml
  text: And if these three men were in its midst[a], as I live, declares the Lord GOD, they would not deliver sons or daughters[b]; they alone would be delivered.
translation:
  language: de
  text: 'Und wären diese drei Männer in diesem Land: So wahr ich lebe – spricht der Herr Yahweh –, sie würden weder Söhne noch Töchter retten. Nur sie selbst würden gerettet werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nur sie selbst würden entkommen.“ Das hebräische Verb kann „retten“, „befreien“ oder „entkommen“ bedeuten; hier geht es um das Entrinnen vor dem angekündigten Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: Und wären diese drei Männer
  rationale: Das einleitende ו verbindet den Satz mit der wiederholten hypothetischen Reihe im Zusammenhang. Der im Hebräischen kontextuell vorausgesetzte Bedingungssinn wird im Deutschen mit dem Konjunktiv „wären“ natürlich ausgedrückt. אֲנָשִׁים bezeichnet hier die drei zuvor genannten Männer.
- source_word: בְּתוֹכָהּ
  choice: in seiner Mitte
  rationale: Die Wendung bewahrt das konkrete hebräische Bild „in seiner Mitte“. Das Suffix bezieht sich im Zusammenhang auf das Land; entsprechend steht im Deutschen das maskuline Possessivpronomen.
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Dies ist die feierliche göttliche Schwurformel; „So wahr ich lebe“ ist ihre natürliche und würdige deutsche Entsprechung.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht Gott, der HERR
  rationale: נְאֻם wird als prophetische Redeeinleitung wiedergegeben. Die geläufige deutsche Form „Gott, der HERR“ vermeidet die unnatürliche Doppelung „Herr HERR“, während die Kapitälchen den Gottesnamen kennzeichnen.
- source_word: לֹא יַצִּילוּ בָּנִים וּבָנוֹת
  choice: sie würden weder Söhne noch Töchter retten
  rationale: Der Hifil von נצל bezeichnet hier das Retten aus dem angekündigten Gericht. „Weder … noch“ gibt die verneinte Verbindung im Deutschen idiomatisch wieder und erhält die ausdrückliche Nennung beider Geschlechter.
- source_word: כִּי הֵם לְבַדָּם יִנָּצֵלוּ
  choice: Nur sie selbst würden gerettet werden
  rationale: לְבַדָּם betont die Ausschließlichkeit. Das passive „gerettet werden“ bewahrt die Beziehung zwischen dem Hifil und dem Nifal desselben Verbs נצל; כִּי wirkt hier im Zusammenhang kontrastierend beziehungsweise folgernd.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr JHWH / der Herr Jahwe
  rationale: Die gewählte Form ist im modernen deutschen Bibelstil verständlich und vermeidet „Herr HERR“. Durch „HERR“ bleibt erkennbar, dass im Hebräischen der Gottesname JHWH steht, ohne eine bestimmte Aussprache zwingend festzulegen.
- issue: Art und Umfang der Rettung
  choice: retten / gerettet werden
  alternative: befreien / verschont bleiben / entkommen
  rationale: Im Kontext geht es um Bewahrung vor einem konkreten göttlichen Gericht. „Retten“ gibt נצל wieder, ohne die Aussage auf ewiges Heil einzuengen; die gleiche deutsche Wortwurzel erhält zudem die hebräische Verknüpfung beider Verbformen.
- issue: Wer außer den drei Männern gerettet wird
  choice: weder Söhne noch Töchter; nur sie selbst
  alternative: keine Kinder; allein sie
  rationale: Die ausdrückliche Paarformel des Hebräischen wird beibehalten. Die Aussage bleibt streng auf die persönliche Rettung der drei Männer begrenzt.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Der Satzbau macht die im Zusammenhang vorausgesetzte Bedingung deutlich, bewahrt aber die feierliche Schwurformel und die pointierte Schlussaussage. Die Gedankenstriche markieren die eingeschobene Redeeinleitung, ohne den Satz unnötig zu verkomplizieren.
