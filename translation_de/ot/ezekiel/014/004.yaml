source:
  edition: WLC
  text: לָ/כֵ֣ן דַּבֵּר א֠וֹתָ/ם וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה אִ֣ישׁ אִ֣ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֡ל אֲשֶׁר֩ יַעֲלֶ֨ה אֶת גִּלּוּלָ֜י/ו אֶל לִבּ֗/וֹ וּ/מִכְשׁ֤וֹל עֲוֺנ/וֹ֙ יָשִׂים֙ נֹ֣כַח פָּנָ֔י/ו וּ/בָ֖א אֶל הַ/נָּבִ֑יא אֲנִ֣י יְהוָ֗ה נַעֲנֵ֧יתִי ל֦/וֹ ב/ה בְּ/רֹ֥ב גִּלּוּלָֽי/ו־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/004.yaml
  text: 'Therefore speak to them and say to them[a], ‘Thus says the Lord GOD: Any man of the house of Israel who brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet—I, Yahweh[c][b], will answer him according to the multitude of his idols.’'
translation:
  language: de
  text: 'Darum sprich zu ihnen und sage zu ihnen: »So spricht der Herr Jahwe: Jeder Mann[a] aus dem Haus Israel, der seine Götzen in sein Herz erhebt[b], den Stolperstein seiner Schuld vor sich hinstellt und dann zum Propheten kommt – ich, Jahwe, werde ihm entsprechend der Vielzahl seiner Götzen antworten.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier zweimal „Mann“: „Mann, Mann“. Die Wiederholung hat verteilenden Sinn: jeder einzelne Mann.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „seine Götzen zu seinem Herzen hinaufsteigen lässt“. Das Hebräische zeichnet das eindrückliche Bild, dass jemand die Götzen innerlich erhöht.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Satz ist schwierig, besonders das Wort בָּהּ („durch sie“ bzw. „darin/dadurch“), dessen Bezug nicht sicher ist. Daher sind auch Wiedergaben wie „werde ihm dadurch antworten“ möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den folgernden Übergang aus dem vorausgehenden Zusammenhang in natürlichem, gehobenem Deutsch.
- source_word: דַּבֵּר אוֹתָם וְאָמַרְתָּ אֲלֵיהֶם
  choice: rede mit ihnen und sage zu ihnen
  rationale: Bewahrt die betonte hebräische Doppelung der Redeverben, ohne sie zu einem einzigen Verb zusammenzuziehen.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Yahwe
  rationale: Gibt die prophetische Botenformel wieder, unterscheidet אֲדֹנָי als Titel von יהוה als Gottesnamen und vermeidet die im Deutschen missverständliche Folge „Herr HERR“.
- source_word: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל
  choice: Jeder Einzelne aus dem Haus Israel
  rationale: Die Wiederholung אִישׁ אִישׁ ist distributiv. „Jeder Einzelne“ bildet die nachdrückliche individuelle Verantwortlichkeit natürlich ab; „Haus Israel“ wahrt die familiär-bundestheologische Ausdrucksweise.
- source_word: יַעֲלֶה אֶת גִּלּוּלָיו אֶל לִבּוֹ
  choice: seine Götzen in sein Herz erhebt
  rationale: „Erhebt“ erhält das Richtungsbild des Hifil von עלה und bringt zugleich die innere Erhöhung beziehungsweise Einsetzung der Götzen zum Ausdruck.
- source_word: גִּלּוּלָיו
  choice: seine Götzen
  rationale: „Götzen“ bezeichnet falsche Kultbilder klar und trägt im Deutschen bereits eine abwertende Färbung, ohne die pejorative Bildlichkeit des hebräischen Wortes zu überzeichnen.
- source_word: וּמִכְשׁוֹל עֲוֺנוֹ
  choice: den Stolperstein seiner Schuld
  rationale: Bewahrt sowohl das konkrete Hindernisbild von מִכְשׁוֹל als auch die mögliche Bedeutungsbreite von עָוֹן zwischen Schuld und schuldhaftem Tun.
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: direkt vor sich hinstellt
  rationale: Gibt die bewusste Platzierung vor dem eigenen Angesicht in verständlichem Deutsch wieder, ohne die konkrete Handlung zu verflachen.
- source_word: וּבָא אֶל הַנָּבִיא
  choice: und dann zum Propheten kommt
  rationale: '„Dann“ macht die im hebräischen Satz dargestellte Abfolge deutlich: Auf die innere Hinwendung zu den Götzen folgt das Aufsuchen des Propheten.'
- source_word: אֲנִי יְהוָה
  choice: ich, Yahwe
  rationale: Das selbstständige Pronomen vor dem Gottesnamen ist emphatisch; die appositionelle Wiedergabe bewahrt diese Hervorhebung.
- source_word: נַעֲנֵיתִי לוֹ ... בְּרֹב גִּלּוּלָיו
  choice: werde ihm entsprechend der Vielzahl seiner Götzen antworten
  rationale: Der deutsche Futur formuliert die im Kontext angekündigte göttliche Reaktion. „Entsprechend“ lässt den gerichtlichen Bezug zur großen Zahl der Götzen erkennen, ohne die schwierige Syntax übermäßig zu präzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יהוה und אֲנִי יהוה
  choice: der Herr Yahwe / ich, Yahwe
  alternative: Gott, der HERR / ich, der HERR
  rationale: Der Titel אֲדֹנָי und der Eigenname יהוה werden unterscheidbar wiedergegeben. Die Form „Yahwe“ wahrt den im Ausgangstext stehenden Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Distributive und grammatisch maskuline Form אִישׁ אִישׁ
  choice: Jeder Einzelne
  alternative: Jeder Mann
  rationale: Die Wiederholung bezeichnet distributiv jeden einzelnen Angehörigen des Hauses Israel. „Jeder Einzelne“ bewahrt den maskulinen Singular der deutschen Grammatik, legt aber nicht mehr biologisches Geschlecht fest, als die distributive hebräische Wendung sicher aussagt.
- issue: Sinn der schwierigen Antwortklausel נַעֲנֵיתִי לוֹ בָהּ בְּרֹב גִּלּוּלָיו
  choice: ich, Yahwe, werde ihm entsprechend der Vielzahl seiner Götzen antworten
  alternative: ich, Yahwe, werde ihm durch sie antworten / lasse mich von ihm trotz seiner vielen Götzen befragen
  rationale: Die gewählte Fassung erhält den im Zusammenhang naheliegenden gerichtlichen Zusammenhang zwischen Götzendienst und göttlicher Antwort. Eine Fußnote macht kenntlich, dass besonders בָהּ syntaktisch und referenziell schwierig bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Ton. Konkrete Bilder wie „Herz“ und „Stolperstein“ bleiben erhalten; schwer verständliche Hebraismen werden nur so weit geglättet, wie es für gewöhnliche heutige Leser nötig ist. Der Gottesname erscheint als „Yahwe“, während אֲדֹנָי mit „Herr“ wiedergegeben wird.
