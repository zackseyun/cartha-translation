  text: א֛וֹ חֶ֥רֶב אָבִ֖יא עַל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אָמַרְתִּ֗י חֶ֚רֶב תַּעֲבֹ֣ר בָּ/אָ֔רֶץ וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/017.yaml
  text: Or if I bring a sword against that land and say[a], ‘Let a sword pass through the land,’ and I cut off from it man and beast,
translation:
  language: de
  text: 'Oder wenn ich ein Schwert gegen jenes Land kommen lasse und sage: »Ein Schwert soll durch das Land ziehen!«, und Mensch und Tier[a] daraus ausrotte,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung »Mensch und Tier« bezeichnet die Beseitigung sowohl menschlichen als auch tierischen Lebens aus dem Land.
    reason: Erläuterung einer festen hebräischen Gerichtsformel
lexical_decisions:
- source_word: א֛וֹ
  choice: Oder wenn
  rationale: אוֹ leitet im Zusammenhang einen weiteren angenommenen Gerichtsfall ein; »wenn« macht die konditionale Funktion im Deutschen natürlich sichtbar.
- source_word: חֶ֥רֶב אָבִ֖יא עַל הָאָרֶץ הַהִיא
  choice: ich das Schwert über jenes Land kommen lasse
  rationale: Die Hifil-Form von בוא bezeichnet das Herbeiführen; die deutsche Wendung bewahrt Gottes aktive Veranlassung und gibt עַל im Zusammenhang als gegen das Land gerichtetes Gericht wieder. »Das Schwert« steht metonymisch für Krieg und gewaltsames Gericht.
- source_word: וְאָמַרְתִּי
  choice: und sage
  rationale: Die Verbfolge gehört zur konditionalen Darstellung und wird im Deutschen idiomatisch im Präsens fortgeführt.
- source_word: חֶרֶב תַּעֲבֹר בָּאָרֶץ
  choice: Das Schwert soll durch das Land ziehen!
  rationale: »Soll« gibt den Charakter eines wirksamen göttlichen Befehls beziehungsweise Beschlusses wieder; »durch das Land ziehen« bewahrt das Bild einer das ganze Land erfassenden Verwüstung.
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: und … daraus ausrotte
  rationale: כרת bezeichnet hier die vollständige Beseitigung aus dem Land. »Ausrotten« ist im Deutschen klarer als das unidiomatische wörtliche »abschneiden«, während »daraus« den Rückbezug auf das Land knapp wiedergibt.
- source_word: אָדָם וּבְהֵמָה
  choice: Mensch und Tier
  rationale: Die feste Paarformel bezeichnet umfassend menschliches und tierisches Leben. »Tier« erhält die Breite von בְּהֵמָה besser als das engere »Vieh«.
theological_decisions:
- issue: Generische Bedeutung von אָדָם in der Gerichtsformel
  choice: Mensch
  alternative: Menschen; Menschheit
  rationale: Im festen Gegensatzpaar אָדָם וּבְהֵמָה bezeichnet אָדָם die menschlichen Bewohner insgesamt. »Mensch und Tier« bewahrt Form und umfassenden Sinn der hebräischen Wendung, ohne die Aussage auf männliche Personen zu beschränken.
- issue: Schwert als Mittel des göttlichen Gerichts
  choice: Schwert
  alternative: Krieg; Kriegsschwert
  rationale: Die konkrete Bildsprache des Ausgangstextes bleibt erhalten, ohne die Metonymie ausdrücklich aufzulösen. So bleibt offen, welche Form kriegerischer Gewalt das Gericht annimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Schwert« und die konditionale Satzstruktur wurden bewahrt; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeführt wird.
