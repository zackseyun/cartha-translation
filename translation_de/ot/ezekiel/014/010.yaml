id: EZK.14.10
reference: Ezekiel 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָשְׂא֖וּ עֲוֺנָ֑/ם כַּֽ/עֲוֺן֙ הַ/דֹּרֵ֔שׁ כַּ/עֲוֺ֥ן הַ/נָּבִ֖יא יִֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/010.yaml
  text: And they will bear their punishment[a]; the punishment of the one who inquires will be the same as the punishment of the prophet.
translation:
  language: de
  text: Und sie werden ihre Schuld tragen[a]. Wie die Schuld des Ratsuchenden, so wird die Schuld des Propheten sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und sie werden ihre Strafe tragen. Die Strafe des Ratsuchenden wird der Strafe des Propheten entsprechen.« Das hebräische Wort kann Verfehlung, Schuld oder die aus der Schuld folgende Strafe bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Und sie werden … tragen
  rationale: Die Verbindung von נשׂא mit עָוֹן wird mit der im Deutschen verständlichen und formal nahen Wendung »Schuld tragen« wiedergegeben.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder die daraus folgende Strafe bezeichnen. »Schuld« bewahrt hier die semantische Offenheit besser als eine eindeutige Festlegung auf »Strafe«.
- source_word: כַּעֲוֺן
  choice: Wie die Schuld …, so … die Schuld
  rationale: Die korrelative Formulierung gibt den durch כְּ markierten Vergleich und die symmetrische Satzstruktur des Hebräischen natürlich wieder.
- source_word: הַדֹּרֵשׁ
  choice: des Ratsuchenden
  rationale: דרש bezeichnet im Kontext jemanden, der bei einem Propheten Auskunft beziehungsweise einen Gottesbescheid sucht. »Ratsuchender« ist knapp, idiomatisch und kontextgerecht.
- source_word: הַנָּבִיא
  choice: des Propheten
  rationale: Standardentsprechung für נָבִיא.
- source_word: יִהְיֶה
  choice: wird … sein
  rationale: Gibt die einfache futurische beziehungsweise kopulative Aussage in modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutungsumfang von עָוֹן in der Gerichtsformel
  choice: Im Haupttext steht »Schuld«; eine Fußnote nennt »Strafe« als kontextuell mögliche Bedeutung.
  alternative: »Und sie werden ihre Strafe tragen; die Strafe des Ratsuchenden wird der Strafe des Propheten entsprechen.«
  rationale: Die Wendung »עָוֹן tragen« kann bedeuten, Schuld zu tragen oder deren Strafe zu erleiden. Da עָוֹן im selben Vers dreimal vorkommt und moralische Schuld wie deren Folge anklingen können, wahrt »Schuld« die lexikalische und theologische Spannung; die Fußnote macht die gerichtliche Konsequenz ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe korrelative Form »Wie …, so …« bewahrt die Parallelität des hebräischen Satzes. »Ratsuchender« vermeidet eine unnötig technische oder konfessionell geprägte Ausdrucksweise.
