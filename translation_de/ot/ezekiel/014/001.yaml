  text: וַ/יָּב֤וֹא אֵלַ/י֙ אֲנָשִׁ֔ים מִ/זִּקְנֵ֖י יִשְׂרָאֵ֑ל וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/001.yaml
  text: Then some of the elders of Israel came to me and sat before me[a].
translation:
  language: de
  text: Dann kamen einige von den Ältesten Israels zu mir und setzten sich vor mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Männer von den Ältesten Israels“; die hebräische Formulierung bezeichnet Männer aus dem Kreis der Ältesten, nicht die gesamte Ältestenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dann kamen
  rationale: Das erzählende וַ wird mit „Dann“ wiedergegeben. Obwohl das Verb im Hebräischen formal im Singular steht, bezieht es sich aufgrund der üblichen vorangestellten Verbform auf das folgende plurale Subjekt; im Deutschen ist daher der Plural erforderlich.
- source_word: אֵלַי
  choice: zu mir
  rationale: Gibt die gewöhnliche Richtungsbedeutung von אֶל mit dem Suffix der 1. Person Singular natürlich und genau wieder.
- source_word: אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: einige von den Ältesten Israels
  rationale: אֲנָשִׁים bezeichnet männliche Personen, während die מן-Verbindung eine Auswahl aus der Gruppe der Ältesten ausdrückt. Im Deutschen macht „einige von den Ältesten“ natürlich deutlich, dass diese Männer selbst zu den Ältesten gehörten.
- source_word: וַיֵּשְׁבוּ
  choice: setzten sich
  rationale: Im erzählenden Zusammenhang bezeichnet ישׁב hier das Einnehmen einer sitzenden Haltung. „Setzten sich“ ist im Deutschen idiomatischer als das missverständliche „saßen“.
- source_word: לְפָנַי
  choice: vor mich
  rationale: Nach dem Bewegungsverb „setzten sich“ verlangt idiomatisches Deutsch den Akkusativ. Die Formulierung bewahrt den Sinn, dass sie in Hesekiels Gegenwart und ihm zugewandt Platz nahmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Einige von den Ältesten“ vermeidet die unnatürliche wörtliche Formulierung „Männer von den Ältesten“, ohne die partitive Aussage des Hebräischen aufzugeben.
