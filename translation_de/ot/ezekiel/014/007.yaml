source:
  edition: WLC
  text: כִּי֩ אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מֵ/הַ/גֵּר֮ אֲשֶׁר יָג֣וּר בְּ/יִשְׂרָאֵל֒ וְ/יִנָּזֵ֣ר מֵֽ/אַחֲרַ֗/י וְ/יַ֤עַל גִּלּוּלָי/ו֙ אֶל לִבּ֔/וֹ וּ/מִכְשׁ֣וֹל עֲוֺנ֔/וֹ יָשִׂ֖ים נֹ֣כַח פָּנָ֑י/ו וּ/בָ֤א אֶל הַ/נָּבִיא֙ לִ/דְרָשׁ ל֣/וֹ בִ֔/י אֲנִ֣י יְהוָ֔ה נַֽעֲנֶה לּ֖/וֹ בִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/007.yaml
  text: For any man from the house of Israel[a], or from the foreigner who sojourns in Israel, who separates himself from following me and brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet to inquire of me through him, I, Yahweh[d][c][b], will answer him myself.
translation:
  language: de
  text: Denn jeder Mann[a] aus dem Haus Israel und jeder Fremde, der in Israel als Fremder lebt[b], der sich von mir abwendet, seine Götzen in seinem Herzen aufrichtet und den Stolperstein seiner Schuld vor sich hinstellt und dann zum Propheten kommt, um durch ihn bei mir anzufragen – ihm werde ich, Jahwe, selbst antworten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Mann für Mann“; die Wiederholung des hebräischen Wortes betont jeden einzelnen Fall.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist ein Nichtisraelit, der dauerhaft unter den Israeliten lebt; traditionell: „Beisasse“ oder „ansässiger Fremder“.'
    reason: cultural_note
  - marker: c
    text: 'Die hebräische Schlusswendung ist knapp und schwierig; möglich ist auch: „Ich, Jahwe, werde ihm durch mich selbst antworten“ oder „in eigener Person antworten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: jeder Mann
  rationale: Die Wiederholung hat distributive Bedeutung und hebt jeden einzelnen Fall hervor. „Jeder Mann“ bewahrt zudem die maskuline Singularform des Hebräischen.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: aus dem Haus Israel
  rationale: Die formnahe Wiedergabe erhält den bundestheologisch und national geprägten Ausdruck „Haus Israel“.
- source_word: הַגֵּר ... יָגוּר
  choice: jeder Fremde, der als Fremder in Israel lebt
  rationale: גֵּר bezeichnet einen Nichtisraeliten, der dauerhaft unter Israel lebt. Die Formulierung gibt sowohl den Personenbegriff als auch das verwandte Verb wieder, ohne den technisch oder abwertend klingenden Ausdruck „ansässiger Ausländer“ zu verwenden.
- source_word: וְיִנָּזֵר מֵאַחֲרַי
  choice: der sich davon absondert, mir nachzufolgen
  rationale: Die Form bezeichnet eine selbst vollzogene Trennung; die hebräische Wendung „von hinter mir“ meint die Abkehr davon, Jahwe nachzufolgen.
- source_word: וְיַעַל גִּלּוּלָיו אֶל לִבּוֹ
  choice: seine Götzen in seinem Herzen aufrichtet
  rationale: „Aufrichtet“ bewahrt die aufwärts gerichtete Bildlichkeit von עלה und bezeichnet zugleich verständlich die innere Erhebung der Götzen.
- source_word: מִכְשׁוֹל עֲוֺנוֹ
  choice: den Anstoß zu seiner Schuld
  rationale: מִכְשׁוֹל ist das, woran jemand zu Fall kommt; עָוֹן umfasst hier sowohl verkehrtes Handeln als auch die daraus entstehende Schuld. „Anstoß zu seiner Schuld“ erhält die Spannung des Ausdrucks.
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: vor sich hinstellt
  rationale: Die natürliche deutsche Formulierung bewahrt das anschauliche Bild bewussten Platzierens unmittelbar vor dem eigenen Gesicht.
- source_word: וּבָא אֶל הַנָּבִיא
  choice: und dann zum Propheten kommt
  rationale: „Dann“ macht den im Hebräischen durch die Verbfolge markierten Ablauf deutlich, ohne eine zusätzliche Begründung einzutragen.
- source_word: לִדְרָשׁ לוֹ בִי
  choice: um durch ihn bei mir anzufragen
  rationale: Der Mann sucht bei Jahwe Auskunft und bedient sich dabei des Propheten als Vermittler; „durch ihn“ gibt das pronominale לוֹ im Zusammenhang verständlich wieder.
- source_word: אֲנִי יְהוָה
  choice: ich, Jahwe
  rationale: Das vorangestellte Pronomen ist betont und führt unmittelbar zur Aussage des Antwortens. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: נַעֲנֶה לוֹ בִּי
  choice: dem werde ich ... selbst antworten
  rationale: Die schwierige und kompakte Schlusswendung hebt hervor, dass Jahwe persönlich antwortet, nicht lediglich der Prophet. „Selbst“ wahrt diese Emphase in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Maskuliner distributiver Ausdruck אִישׁ אִישׁ
  choice: jeder Mann
  alternative: jeder Einzelne / jeder Mensch
  rationale: Die gewählte Fassung bewahrt die maskuline Singularform und zugleich die distributive Aussage, dass jeder einzelne entsprechende Fall gemeint ist.
- issue: Art der göttlichen Antwort in נַעֲנֶה לוֹ בִּי
  choice: Jahwe wird ihm selbst antworten
  alternative: Jahwe wird ihm durch sich selbst / in eigener Person antworten
  rationale: Die genaue Funktion des abschließenden בִּי ist umstritten. Der Haupttext wahrt die klare Emphase auf Jahwes eigenes Antworten, ohne die grammatische Schwierigkeit dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzstruktur. Die lange hebräische Bedingungsperiode bleibt erhalten, wird aber durch die Gedankenstrichkonstruktion übersichtlich gegliedert. Bildhafte Ausdrücke wie „im Herzen aufrichten“ und „vor sich hinstellen“ werden nicht nivelliert.
