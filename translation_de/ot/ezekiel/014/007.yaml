revisions:
- from: Denn jeder Mann[a] aus dem Haus Israel oder jeder Fremde, der als Fremder in Israel lebt[b], der sich davon absondert, mir nachzufolgen, seine Götzen in seinem Herzen aufrichtet und den Anstoß zu seiner Schuld vor sich hinstellt und dann zum Propheten kommt, um durch ihn bei mir anzufragen – dem werde ich, Jahwe, selbst antworten.[c]
  to: Denn jeder Mann[a] aus dem Haus Israel und jeder Fremde, der in Israel als Fremder lebt[b], der sich von mir abwendet, seine Götzen in seinem Herzen aufrichtet und den Stolperstein seiner Schuld vor sich hinstellt und dann zum Propheten kommt, um durch ihn bei mir anzufragen – ihm werde ich, Jahwe, selbst antworten.[c]
  rationale: Die Revision beseitigt die unklare Absonderungsformulierung und stellt die Abkehr von Jahwe eindeutig dar. Sie ersetzt den semantisch unzutreffenden „Anstoß“ durch den bild- und bedeutungsgerechten „Stolperstein“. Außerdem wird die unvollständige Fußnotenalternative ergänzt. Die umstrittene Nuance der Schlusswendung bleibt in der Fußnote ausdrücklich offen.
