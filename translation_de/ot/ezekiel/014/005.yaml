lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck ein und gibt die finale Bedeutung knapp und natürlich wieder.
- source_word: תְּפֹשׂ
  choice: ich … ergreife
  rationale: Bewahrt das kraftvolle Bild des Fassens oder Ergreifens; die erste Person ergibt sich aus dem Zusammenhang der göttlichen Rede.
- source_word: אֶת בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Erhält die korporative Bundesbezeichnung des hebräischen Textes.
- source_word: בְּלִבָּם
  choice: an ihrem Herzen
  rationale: Bewahrt die ungewöhnliche Verbindung von בְּ mit dem kollektiv gebrauchten Singular »Herz«, ohne eindeutig festzulegen, ob Ort oder Mittel gemeint ist.
- source_word: אֲשֶׁר
  choice: weil
  rationale: Gibt die hier naheliegende begründende beziehungsweise erläuternde Funktion des Relativpartikels verständlich wieder.
- source_word: נָזֹרוּ
  choice: haben sich abgewandt
  rationale: Gibt die durch den Niphal ausgedrückte Abkehr beziehungsweise Entfremdung in natürlichem modernem Deutsch wieder.
- source_word: מֵעָלַי
  choice: von mir
  rationale: Drückt die im Hebräischen bezeichnete Trennung knapp aus.
- source_word: בְּגִלּוּלֵיהֶם
  choice: durch ihre Götzen
  rationale: Gibt בְּ instrumental wieder; »Götzen« wahrt den abwertenden Charakter von Ezechiels Ausdruck für Kultbilder.
- source_word: כֻּלָּם
  choice: sie … alle
  rationale: Erhält die ausdrückliche Betonung der Gesamtheit.
theological_decisions:
- issue: Gottes Ergreifen Israels am Herzen
  choice: das Haus Israel an ihrem Herzen ergreife
  alternative: das Haus Israel in ihrem Herzen ergreife; das Haus Israel durch ihr Herz ergreife
  rationale: Die Formulierung erhält das kraftvolle Bild göttlichen Zugreifens und lässt die schwierige Funktion der Präposition offen, statt sie als rein innerliche Überzeugung oder als eindeutig instrumentales Handeln festzulegen.
- issue: Art von Israels Abfall
  choice: haben sich … von mir abgewandt
  alternative: haben sich … von mir entfremdet
  rationale: »Sich abwenden« ist im heutigen Deutsch klar und bildet die schuldhafte Abkehr ab; die Alternative hält die mögliche resultative Nuance des Niphal fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korporative Bezeichnung »Haus Israel« bleibt erhalten. Das pluralische Possessivpronomen in »ihrem Herzen« bezieht sich sinngemäß auf die Menschen des Hauses Israel und spiegelt den hebräischen kollektiven Singular »Herz« mit pluralischem Suffix.
