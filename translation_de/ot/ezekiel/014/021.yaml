  terminology: „Strafgerichte“, „Schwert“, „Hunger“, „wilde Tiere“, „Seuche“ sowie „Menschen und Vieh“ sind im gegebenen Kontext sachgerecht. Die Wiedergabe des Gottesnamens mit „Yahweh“ folgt der vorgegebenen Entscheidung.
