source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר אֲדֹנָ֣/י יְהֹוִ֗ה אַ֣ף כִּֽי אַרְבַּ֣עַת שְׁפָטַ֣/י הָ/רָעִ֡ים חֶ֠רֶב וְ/רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וָ/דֶ֔בֶר שִׁלַּ֖חְתִּי אֶל יְרוּשָׁלִָ֑ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/021.yaml
  text: 'For thus says the Lord GOD: How much more when I send my four disastrous judgments against Jerusalem—sword and famine and wild beasts and plague—to cut off from it man and beast![a][b]'
translation:
  language: de
  text: 'Denn so spricht Yahweh, der Herr: Um wie viel mehr, wenn ich meine vier verheerenden Strafgerichte gegen Jerusalem sende – Schwert, Hunger, wilde Tiere und Seuche –, um aus ihr Menschen und Vieh auszurotten![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine vier schweren Strafgerichte“. Das hebräische Adjektiv kann hier „schlimm“, „schädlich“ oder „verheerend“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Pest“ statt „Seuche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet die unnatürliche Doppelung „der Herr HERR“.
- source_word: אַף כִּי
  choice: Wie viel mehr, wenn
  rationale: Die Wendung führt im Zusammenhang einen Schluss vom Geringeren auf das Größere fort; sie ist daher nicht als bloßes „selbst wenn“ wiedergegeben.
- source_word: אַרְבַּעַת שְׁפָטַי הָרָעִים
  choice: meine vier verheerenden Strafgerichte
  rationale: שׁפטים bezeichnet hier göttliche Strafmaßnahmen; רעים beschreibt ihre unheilvolle Wirkung, nicht moralische Bosheit bei Gott.
- source_word: חֶרֶב
  choice: Schwert
  rationale: Bewahrt das konkrete Bild der prophetischen Gerichtssprache, statt es zu „Krieg“ zu verallgemeinern.
- source_word: רָעָב
  choice: Hunger
  rationale: Im Deutschen ist „Hunger“ in der festen Reihe prophetischer Gerichte natürlich und umfasst die durch Mangel verursachte Not; „Hungersnot“ bleibt als mögliche Verdeutlichung denkbar.
- source_word: חַיָּה רָעָה
  choice: wilde Tiere
  rationale: Bezeichnet gefährliche, schadenbringende Tiere; eine wörtliche Wiedergabe als „böse Tiere“ würde ihnen missverständlich moralische Bosheit zuschreiben.
- source_word: דֶבֶר
  choice: Seuche
  rationale: Eine natürliche moderne Wiedergabe für eine tödliche epidemische Krankheit in prophetischen Gerichtstexten.
- source_word: שִׁלַּחְתִּי
  choice: ich ... sende
  rationale: Das hebräische Perfekt steht in der rhetorischen Aussage nach אַף כִּי; im Deutschen bringt das Präsens im wenn-Satz die angekündigte Handlung idiomatisch zum Ausdruck.
- source_word: לְהַכְרִית
  choice: auszurotten
  rationale: Drückt hier das gewaltsame Beseitigen aus Jerusalem kräftig und natürlich aus; das Ziel der Strafgerichte ist die Vernichtung von Mensch und Tier.
- source_word: אָדָם וּבְהֵמָה
  choice: Menschen und Vieh
  rationale: Die Paarformel umfasst menschliches und tierisches Leben; „Menschen“ ist im modernen Deutsch allgemeinverständlich, und „Vieh“ entspricht בהמה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form bewahrt den persönlichen Gottesnamen und zugleich den Titel „Herr“, ohne beide zu einem einzigen Titel zu verschmelzen.
- issue: Charakter der vier שְׁפָטִים הָרָעִים
  choice: verheerende Strafgerichte
  alternative: schlimme Gerichte
  rationale: Die Formulierung kennzeichnet die Maßnahmen als göttliche Strafe mit unheilvoller Wirkung, ohne Gott moralisch Böses zuzuschreiben.
- issue: Rhetorische Funktion von אַף כִּי
  choice: Wie viel mehr, wenn
  alternative: selbst wenn
  rationale: 'Der Zusammenhang mit dem vorherigen Vers verlangt einen gesteigerten Schluss: Wenn schon bei einem einzelnen Landgericht nur wenige gerettet würden, gilt dies umso mehr beim vierfachen Gericht über Jerusalem.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt durch Gedankenstriche hervorgehoben. „Wie viel mehr, wenn“ bewahrt die argumentative Steigerung aus dem Zusammenhang; „Strafgerichte“ verdeutlicht die hier gemeinten göttlichen Strafmaßnahmen.
