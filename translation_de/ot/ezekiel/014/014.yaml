id: EZK.14.14
reference: Ezekiel 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/הָיוּ שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ בְּ/תוֹכָ֔/הּ נֹ֖חַ דנאל וְ/אִיּ֑וֹב הֵ֤מָּה בְ/צִדְקָתָ/ם֙ יְנַצְּל֣וּ נַפְשָׁ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/014.yaml
  text: even if these three men were in its midst—Noah[a], Daniel, and Job—they would deliver only themselves by their righteousness, declares the Lord GOD.
translation:
  language: de
  text: Selbst wenn diese drei Männer in ihrer Mitte wären – Noah, Daniel[a] und Hiob –, würden sie durch ihre Gerechtigkeit nur sich selbst retten, spricht der Herr Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch דנאל kann auch mit »Danel« wiedergegeben werden. Manche verstehen darunter die aus altorientalischen Texten bekannte Gestalt Danel und nicht den biblischen Daniel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיוּ
  choice: selbst wenn ... wären
  rationale: Im Zusammenhang des Gerichtswortes hat die Form eine einräumend-bedingende Bedeutung; die deutsche Wendung gibt diese natürlich wieder.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: diese drei Männer
  rationale: Die konkrete maskuline Personenbezeichnung wird genau und idiomatisch wiedergegeben.
- source_word: בְּתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Das feminine Suffix verweist im Kontext auf das Land; die Formulierung bewahrt diesen Rückbezug.
- source_word: נֹחַ דנאל וְאִיּוֹב
  choice: Noah, Daniel und Hiob
  rationale: Noah und Hiob entsprechen den üblichen deutschen Namensformen. דנאל wird im Haupttext traditionsgemäß als Daniel wiedergegeben; die textlich mögliche Form Danel wird in einer Fußnote offengehalten.
- source_word: בְצִדְקָתָם
  choice: durch ihre Gerechtigkeit
  rationale: Die Wendung bezeichnet ihre persönliche Rechtschaffenheit als Mittel ihrer Rettung, ohne sie näher theologisch auszudeuten.
- source_word: יְנַצְּלוּ נַפְשָׁם
  choice: würden sie ... nur sich selbst retten
  rationale: נצל bezeichnet Rettung oder Entrinnen; נַפְשָׁם meint hier ihre eigene Person beziehungsweise ihr Leben. »Nur« macht die im Kontext hervorgehobene Begrenzung idiomatisch deutlich.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Jahwe
  rationale: »Spricht« ist die geläufige deutsche Wiedergabe der prophetischen Botenformel; Jahwe gibt den Gottesnamen wieder und vermeidet die schwerfällige Doppelung »Herr HERR«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und bewahrt so die Form des hebräischen Ausdrucks ohne eine doppelte Wiedergabe als »Herr«.
- issue: Identität von דנאל
  choice: Daniel im Haupttext mit Fußnote
  alternative: Danel, möglicherweise die altorientalische Gestalt
  rationale: Die konsonantische Schreibung דנאל lässt die Lesung Danel zu und kann auf eine außerbiblische gerechte Gestalt bezogen werden. Die traditionelle Lesung Daniel bleibt im Haupttext, während die echte Ungewissheit ausdrücklich vermerkt wird.
- issue: Reichweite der Rettung durch die Gerechtigkeit der drei Männer
  choice: nur sich selbst retten
  alternative: ihr eigenes Leben retten
  rationale: Die Aussage wird auf die im Text genannte begrenzte Rettung der drei Personen beschränkt; sie legt keine weitergehende Lehre über Verdienst oder Heil fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt die Namensreihe ab; die einräumende Bedingung und die ausschließliche Rettung der drei Männer werden klar und ohne konfessionelle Zusatzdeutung ausgedrückt.
