base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/023.yaml
  text: And they will comfort you when you see their ways and their deeds[a], and you will know that I have not done without cause all that I did in it[c][b], declares the Lord GOD.
translation:
  language: de
  text: Und sie werden euch trösten[a], wenn ihr ihren Weg und ihre Taten seht. Dann werdet ihr erkennen, dass ich nicht ohne Grund alles getan habe, was ich in ihr[b][c] getan habe, spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ihr werdet durch sie getröstet werden.“ Die hebräische Form kann so verstanden werden, dass die Überlebenden durch ihr sichtbares Verhalten zum Mittel des Trostes werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: in Jerusalem.'
    reason: cross_reference
  - marker: c
    text: 'Oder: „dass ich all das, was ich in ihr getan habe, nicht grundlos getan habe.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִחֲמוּ אֶתְכֶם
  choice: Und sie werden euch trösten
  rationale: Die Überlebenden werden als Subjekt und die Angesprochenen als Objekt verstanden. „Trösten“ gibt die Wirkung ihres sichtbaren Verhaltens natürlich wieder, ohne den Trost als bloß gefühlsmäßige Beruhigung auszudeuten.
- source_word: כִּי תִרְאוּ
  choice: wenn ihr … seht
  rationale: כִּי bezeichnet hier am natürlichsten den Umstand beziehungsweise Zeitpunkt, unter dem der Trost eintritt; die mögliche kausale Nuance bleibt im Zusammenhang erkennbar.
- source_word: דַּרְכָּם וְאֶת עֲלִילוֹתָם
  choice: ihren Weg und ihre Taten
  rationale: Der Singular „Weg“ bewahrt die Form des Hebräischen und bezeichnet ihre Lebensführung; „Taten“ gibt die konkreten, moralisch bewerteten Handlungen wieder.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: „Erkennen“ passt zur gewonnenen Einsicht in die Berechtigung des Gerichts. „Dann“ macht den im Zusammenhang liegenden Folgezusammenhang im Deutschen deutlich.
- source_word: לֹא חִנָּם
  choice: nicht ohne Grund
  rationale: חִנָּם bedeutet hier „grundlos“ oder „ohne berechtigten Anlass“; die Formulierung wahrt die Aussage, dass Gottes Handeln nicht willkürlich war.
- source_word: עָשִׂיתִי אֵת כָּל אֲשֶׁר עָשִׂיתִי
  choice: dass ich nicht ohne Grund alles getan habe, was ich … getan habe
  rationale: Die Wiederholung von עשה wird beibehalten, da sie die Gesamtheit und Nachdrücklichkeit des göttlichen Handelns hervorhebt.
- source_word: בָהּ
  choice: an ihr
  rationale: Das feminine Suffix bezieht sich auf die Stadt Jerusalem. „An ihr“ bewahrt das feminine Pronomen und lässt die im Hebräischen offene Verhältnisbestimmung der Präposition ב bestehen.
- source_word: נְאֻם אֲדֹנָי יְהוָה
  choice: spricht der Herr Yahweh
  rationale: „Spricht“ ist die geläufige, würdevolle Wiedergabe der prophetischen Schlussformel. „Yahweh“ gibt den ausdrücklich gesetzten Gottesnamen wieder, während אֲדֹנָי mit „der Herr“ übersetzt wird.
theological_decisions:
- issue: Wie die Überlebenden den Verbannten Trost vermitteln
  choice: Ihr sichtbarer Lebenswandel und ihre Taten lassen die Angesprochenen erkennen, dass das Gericht über Jerusalem nicht grundlos war, und trösten sie so.
  alternative: Die Überlebenden sind allein schon durch ihr Überleben ein Trost, oder die Angesprochenen trösten sich selbst.
  rationale: Der zweite Satzteil verbindet das Sehen ihres Weges und ihrer Taten unmittelbar mit der Einsicht in die Begründetheit von Gottes Handeln. Der Text lässt den Trost daher aus dieser erschütternden Einsicht hervorgehen, ohne die Spannung zwischen Gericht und Trost aufzulösen.
- issue: Wiedergabe von אֲדֹנָי יְהוָה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Übersetzung unterscheidet den Herrentitel אֲדֹנָי vom Eigennamen יהוה und gibt den Gottesnamen transparent als „Yahweh“ wieder.
- issue: Bezug und Richtung von בָהּ
  choice: „an ihr“, mit Jerusalem als Bezug
  alternative: „in ihr“ oder „gegen sie“
  rationale: Das feminine Pronomen verweist auf Jerusalem. „An ihr“ vermeidet es, die knappe Präposition eindeutig räumlich („in“) oder feindlich („gegen“) festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Gedankengang, wird jedoch durch einen Satzpunkt und das folgernde „Dann“ lesbarer. Das feminine „ihr“ nimmt die als Stadt gedachte Bezugsgröße Jerusalem auf; eine Fußnote klärt den Bezug.
