  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Da kam das Wort Jahwes zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Verbform mit וַ führt die Erzählung fort. Zusammen mit דְבַר יְהוָה ergibt sich im heutigen Deutsch die natürliche prophetische Eingangsformel „Da kam das Wort Jahwes …“.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet in der festen prophetischen Verbindung דְבַר יְהוָה das ergehende „Wort“ Gottes. Diese Wiedergabe bewahrt den etablierten sprachlichen und theologischen Gehalt besser als das stärker deutende „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in seiner im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bedeutet hier unmittelbar „zu mir“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion präzise, ohne das schwerfällige „indem er sprach“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Verhältnis von Gottes Wort und Sprecher
  choice: das Wort Jahwes kam
  alternative: Jahwe sprach zu mir
  rationale: Die Übersetzung erhält die im Ausgangstext eigenständig formulierte prophetische Wortereignis-Formel und löst sie nicht deutend in ein einfaches Sprechen Gottes auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Formel entspricht dem wiederkehrenden prophetischen Stil; der Doppelpunkt kündigt die folgende Gottesrede idiomatisch an.
