source:
  edition: WLC
  text: וְ/הַ/נָּבִ֤יא כִֽי יְפֻתֶּה֙ וְ/דִבֶּ֣ר דָּבָ֔ר אֲנִ֤י יְהוָה֙ פִּתֵּ֔יתִי אֵ֖ת הַ/נָּבִ֣יא הַ/ה֑וּא וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עָלָ֔י/ו וְ/הִ֨שְׁמַדְתִּ֔י/ו מִ/תּ֖וֹךְ עַמִּ֥/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/009.yaml
  text: And if the prophet is deceived and speaks a word[a], I, Yahweh, have deceived that prophet; and I will stretch out my hand against him and destroy him from the midst of my people Israel.
translation:
  language: de
  text: Wenn aber der Prophet getäuscht wird und ein Wort redet, dann habe ich, Jahwe, diesen Propheten getäuscht[a]; ich werde meine Hand gegen ihn ausstrecken und ihn aus der Mitte meines Volkes Israel vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verführt“. Manche geben den Sinn permissiv wieder: „zugelassen, dass dieser Prophet getäuscht wurde“.'
    reason: Die Wurzel פתה kann „täuschen“ oder „verführen“ bezeichnen. Die permissive Wiedergabe ist eine Auslegung und wird daher nicht in den Haupttext aufgenommen.
lexical_decisions:
- source_word: יְפֻתֶּה
  choice: sich täuschen lässt
  rationale: Das Pual bezeichnet hier passiv, dass der Prophet einer Täuschung oder Verführung erliegt. Die reflexiv-passive deutsche Wendung ist natürlich und hält offen, wodurch dies zunächst geschieht.
- source_word: וְדִבֶּר דָּבָר
  choice: und ein Wort redet
  rationale: Die knappe Formulierung bewahrt das wiederholte Wortfeld von דבר und den prophetischen Sprachgebrauch; „eine Botschaft verkündet“ wäre stärker deutend.
- source_word: אֲנִי יְהוָה
  choice: ich, Jahwe
  rationale: Das ausdrücklich gesetzte Pronomen und der Gottesname werden zur Wahrung der Betonung beide wiedergegeben.
- source_word: פִּתֵּיתִי
  choice: habe ... getäuscht
  rationale: Das Piel mit Jahwe als ausdrücklich genanntem Subjekt schreibt ihm die Handlung direkt zu. Die Übersetzung bewahrt diese theologische Spannung und mildert sie nicht zu bloßer Zulassung ab.
- source_word: וְנָטִיתִי אֶת יָדִי עָלָיו
  choice: Ich werde meine Hand gegen ihn ausstrecken
  rationale: Die konkrete Gerichtsmetapher wird eng am Hebräischen und zugleich idiomatisch auf Deutsch wiedergegeben.
- source_word: וְהִשְׁמַדְתִּיו
  choice: und ihn ... vernichten
  rationale: „Vernichten“ gibt die starke, auf Beseitigung zielende Bedeutung des Hifil von שׁמד angemessen und würdevoll wieder.
- source_word: מִתּוֹךְ עַמִּי יִשְׂרָאֵל
  choice: aus der Mitte meines Volkes Israel
  rationale: Die Formulierung bildet die räumlich-gemeinschaftliche Wendung des Hebräischen ab und betont die Entfernung aus dem Volk.
theological_decisions:
- issue: Göttliche Urheberschaft an der Täuschung des Propheten
  choice: „dann habe ich, Jahwe, diesen Propheten getäuscht“
  alternative: „dann habe ich diesen Propheten verführt“ oder interpretierend „dann habe ich zugelassen, dass dieser Prophet getäuscht wurde“
  rationale: Im Hebräischen steht derselbe Stamm פתה zunächst im Pual und anschließend im Piel mit Jahwe als Subjekt. Daher bleibt die direkte Zuschreibung im Haupttext stehen. Die permissive Deutung ist mögliches theologisches Verständnis, aber keine ausdrückliche Formulierung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt der prophetischen Gerichtsrede nahe, ohne unnötig altertümlich zu wirken. „Jahwe“ gibt den im Ausgangstext ausdrücklich genannten Gottesnamen wieder.
