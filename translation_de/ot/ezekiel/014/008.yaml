source:
  edition: WLC
  text: וְ/נָתַתִּ֨י פָנַ֜/י בָּ/אִ֣ישׁ הַ/ה֗וּא וַ/הֲשִֽׂמֹתִ֨י/הוּ֙ לְ/א֣וֹת וְ/לִ/מְשָׁלִ֔ים וְ/הִכְרַתִּ֖י/ו מִ/תּ֣וֹךְ עַמִּ֑/י וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/008.yaml
  text: And I will set my face against that man[a], and I will make him a sign and a proverb, and I will cut him off from the midst of my people. Then you will know that I am Yahweh.
translation:
  language: de
  text: Und ich werde mein Angesicht gegen diesen Mann richten und ihn zu einem Zeichen und zu einem Sprichwort[a] machen. Ich werde ihn aus der Mitte meines Volkes ausrotten. Dann werdet ihr erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Spottwort“ beziehungsweise „zu einem sprichwörtlichen Beispiel“. Das hebräische Wort kann ein Sprichwort, ein Spottwort oder eine öffentliche Redensart über jemanden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא
  choice: ich werde mein Angesicht gegen diesen Mann richten
  rationale: Die Wendung bezeichnet entschlossene, feindliche Zuwendung zum Gericht. „Angesicht“ bewahrt das konkrete hebräische Bild; „gegen ... richten“ ist im Deutschen verständlich und würdevoll.
- source_word: הָאִישׁ הַהוּא
  choice: diesen Mann
  rationale: Das Hebräische steht ausdrücklich im maskulinen Singular und verweist auf den zuvor genannten einzelnen Mann.
- source_word: וַהֲשִׂמֹתִיהוּ
  choice: ihn ... machen
  rationale: Mit den folgenden Prädikatsnomen bezeichnet das Verb, jemanden zu etwas werden zu lassen beziehungsweise als etwas hinzustellen. „Machen“ ist hier natürlich und nah am Sinn.
- source_word: לְאוֹת
  choice: zu einem Zeichen
  rationale: אוֹת bedeutet allgemein „Zeichen“; im Zusammenhang ist der Mann ein öffentliches Zeichen des göttlichen Gerichts, ohne dass „Warnzeichen“ ausdrücklich gemacht werden muss.
- source_word: וְלִמְשָׁלִים
  choice: zu einem Sprichwort
  rationale: מָשָׁל kann Sprichwort, Spottwort oder sprichwörtliches Beispiel bezeichnen. „Sprichwort“ wahrt den lexikalischen Kern; die mögliche Schand- und Spottbedeutung wird in der Fußnote offengehalten. Der hebräische Plural wird im Deutschen idiomatisch singularisch wiedergegeben.
- source_word: וְהִכְרַתִּיו
  choice: ich werde ihn ... ausrotten
  rationale: Im Hifil bezeichnet כרת das Beseitigen oder Abschneiden aus einer Gemeinschaft. „Ausrotten“ gibt die Schwere des Gerichts in natürlichem Deutsch wieder; die Verbindung mit „aus der Mitte meines Volkes“ erhält den Gedanken des Ausschlusses.
- source_word: מִתּוֹךְ עַמִּי
  choice: aus der Mitte meines Volkes
  rationale: Die Formulierung bewahrt das räumlich-soziale Bild des hebräischen Ausdrucks und den feierlichen Ton.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: '„Dann“ bringt den resultativen Zusammenhang zum Ausdruck: Durch das vollzogene Gericht gelangt die angesprochene Mehrzahl zur Erkenntnis. „Erkennen“ passt zur theologischen Erkenntnisformel Ezechiels.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Gerichtsformel mit dem göttlichen Angesicht
  choice: mein Angesicht gegen diesen Mann richten
  alternative: mein Angesicht gegen diesen Mann wenden
  rationale: Die gewählte Fassung bewahrt sowohl die anthropomorphe Bildsprache als auch den Gedanken aktiver göttlicher Gegnerschaft, ohne das Bild erklärend aufzulösen.
- issue: Bedeutung von מְשָׁלִים im Gerichtszusammenhang
  choice: Sprichwort
  alternative: Spottwort; abschreckendes Beispiel
  rationale: Der Ausdruck stellt den Mann als öffentlich erinnerte Gestalt des Gerichts dar. Da das Wort mehrere verwandte Nuancen zulässt, bleibt die Hauptübersetzung lexikalisch breit und nennt die schärferen Möglichkeiten in der Fußnote.
- issue: Tragweite von וְהִכְרַתִּיו
  choice: aus der Mitte meines Volkes ausrotten
  alternative: aus der Mitte meines Volkes ausschließen; vernichten
  rationale: Das Verb ist schwerwiegend, legt für sich genommen aber nicht eindeutig fest, ob Tod, Vernichtung oder endgültiger Ausschluss im Vordergrund steht. „Ausrotten“ wahrt die Härte, während der unmittelbare Zusatz die Entfernung aus dem Volk betont.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener hebräischer Bildsprache („mein Angesicht“, „aus der Mitte“). Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der Gerichtsaussagen zu verändern.
