source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נֽוֹתְרָה בָּ֜/הּ פְּלֵטָ֗ה הַֽ/מּוּצָאִים֮ בָּנִ֣ים וּ/בָנוֹת֒ הִנָּ/ם֙ יוֹצְאִ֣ים אֲלֵי/כֶ֔ם וּ/רְאִיתֶ֥ם אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וְ/נִחַמְתֶּ֗ם עַל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר הֵבֵ֖אתִי עָלֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/022.yaml
  text: Yet behold[a], a remnant will be left in it—those brought out, sons and daughters. Behold, they are coming out to you, and you will see their way and their deeds; and you will be comforted concerning the disaster that I brought upon Jerusalem[c][b], all that I brought upon it.
translation:
  language: de
  text: 'Doch seht: In ihr wird eine Schar Entronnener[a] übrig bleiben: Söhne und Töchter,[b] die herausgeführt werden. Seht, sie kommen zu euch heraus, und ihr werdet ihren Weg und ihre Taten sehen. Ihr werdet Trost finden im Blick auf das Unheil[c], das ich über Jerusalem gebracht habe – im Blick auf alles, was ich über sie gebracht habe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „eine Gruppe Überlebender“ oder „eine Schar Entkommener“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich nennt der hebräische Text ausdrücklich „Söhne und Töchter“ und nicht nur allgemein „Kinder“.
    reason: lexical_alternative
  - marker: c
    text: „Unheil“ bezeichnet hier die Katastrophe beziehungsweise das Gericht über Jerusalem, nicht moralisch Böses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Doch seht
  rationale: Die Wendung markiert nach der vorangehenden Gerichtsankündigung eine nachdrückliche Wendung. „Doch“ gibt die kontextuelle Gegenbewegung wieder, „seht“ den aufmerksamkeitslenkenden Charakter von הִנֵּה.
- source_word: נוֹתְרָה בָּהּ פְּלֵטָה
  choice: In ihr wird eine Schar Entronnener übrig bleiben
  rationale: Die Verbindung bezeichnet eine überlebende beziehungsweise entkommene Gruppe. „Schar Entronnener“ macht den kollektiven Sinn von פְּלֵטָה verständlich, während „übrig bleiben“ die Aussage von נותר bewahrt.
- source_word: הַמּוּצָאִים
  choice: die herausgeführt werden
  rationale: Der Hofal-Partizip ist kausativ-passiv und unterscheidet sich damit vom folgenden aktiven יוֹצְאִים. „Herausgeführt“ gibt präziser wieder, dass diese Menschen hinausgebracht werden.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung beider Gruppen wird nicht zum allgemeineren „Kinder“ eingeebnet.
- source_word: הִנָּם יוֹצְאִים אֲלֵיכֶם
  choice: Seht, sie kommen zu euch heraus
  rationale: Das aktive Partizip schildert die Bewegung aus der Stadt heraus und auf die Angeredeten zu. „Kommen ... zu euch heraus“ erhält beide räumlichen Aspekte.
- source_word: דַּרְכָּם
  choice: ihren Weg
  rationale: „Weg“ bewahrt die im prophetischen Sprachgebrauch übliche Metapher für Lebensführung und Verhalten, ohne sie vorschnell auszudeuten.
- source_word: עֲלִילוֹתָם
  choice: ihre Taten
  rationale: Das Wort bezeichnet Handlungen oder Verhaltensweisen mit möglicher moralischer Färbung. „Taten“ ist knapp, verständlich und gewichtig.
- source_word: וְנִחַמְתֶּם
  choice: ihr werdet ... getröstet sein
  rationale: Der Nifal bezeichnet hier Trost beziehungsweise Beruhigung angesichts des ergangenen Gerichts. Die passive Form bleibt erhalten, ohne ausdrücklich festzulegen, worin dieser Trost psychologisch besteht.
- source_word: עַל הָרָעָה
  choice: im Blick auf das Unheil
  rationale: רָעָה bezeichnet hier die über Jerusalem gebrachte Katastrophe, nicht moralisch böses Handeln. „Im Blick auf“ gibt den weiten Bezug von עַל wieder, ohne ihn stärker als Ursache oder Zustimmung festzulegen.
- source_word: אֲשֶׁר הֵבֵאתִי עַל יְרוּשָׁלִַם
  choice: das ich über Jerusalem gebracht habe
  rationale: Die deutsche Wendung entspricht dem hebräischen Gerichtsidiom und lässt die im Text ausdrücklich genannte göttliche Urheberschaft bestehen.
- source_word: אֵת כָּל אֲשֶׁר הֵבֵאתִי עָלֶיהָ
  choice: im Blick auf alles, was ich über die Stadt gebracht habe
  rationale: Die Wiederaufnahme erhält die nachdrückliche Zusammenfassung des gesamten Gerichts. „Die Stadt“ bezeichnet eindeutig das feminine Bezugswort Jerusalem und klingt im Deutschen natürlicher als ein isoliertes Pronomen.
theological_decisions:
- issue: Bedeutung von הָרָעָה beim von Gott über Jerusalem gebrachten Gericht
  choice: Unheil
  alternative: Böses; Katastrophe
  rationale: Im Kontext bezeichnet das Wort das leidvolle Gerichtsgeschehen, nicht moralische Bosheit. „Unheil“ vermeidet eine sachlich irreführende moralische Aussage und bewahrt zugleich die ausdrückliche göttliche Urheberschaft am Gericht.
- issue: Sinn des Trostes nach dem Anblick von Weg und Taten der Entronnenen
  choice: Die Aussage bleibt ohne ausdrückliche Erklärung des Trostgrundes stehen
  alternative: Ergänzend erklären, dass das Verhalten der Entronnenen die Gerechtigkeit des Gerichts beweist
  rationale: Der Zusammenhang legt nahe, dass ihr Verhalten das Gericht verständlich macht; der Vers selbst formuliert diese Schlussfolgerung jedoch nicht ausdrücklich. Die Übersetzung bewahrt daher die Spannung und fügt keine dogmatische Erklärung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Aufmerksamkeitsformel „Seht“ und die Wiederholung des über Jerusalem Gebrachten bleiben als prophetische Nachdrücklichkeit erhalten. „Im Blick auf“ vermeidet sowohl eine altertümliche als auch eine unnötig kausal festlegende Wiedergabe von עַל.
