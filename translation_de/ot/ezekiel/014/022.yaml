  terminology: „Unheil“, „Weg“ und „Taten“ sind für den prophetischen Kontext angemessen. „Söhne und Töchter“ bewahrt die ausdrückliche Paarform. „Entronnene“ ist als Wiedergabe von פְּלֵטָה vertretbar; die Fußnote sichert die möglichen Nuancen ab.
