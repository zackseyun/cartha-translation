revisions:
- from: 'Doch seht: In ihr wird eine Schar Entronnener[a] übrig bleiben, die herausgeführt werden: Söhne und Töchter.[b] Seht, sie kommen zu euch heraus, und ihr werdet ihren Weg und ihre Taten sehen. Dann werdet ihr im Blick auf das Unheil[c], das ich über Jerusalem gebracht habe, getröstet sein – im Blick auf alles, was ich über die Stadt gebracht habe.'
  to: 'Doch seht: In ihr wird eine Schar Entronnener[a] übrig bleiben: Söhne und Töchter,[b] die herausgeführt werden. Seht, sie kommen zu euch heraus, und ihr werdet ihren Weg und ihre Taten sehen. Ihr werdet Trost finden im Blick auf das Unheil[c], das ich über Jerusalem gebracht habe – im Blick auf alles, was ich über sie gebracht habe.'
  rationale: Die Umstellung ordnet „Söhne und Töchter“ eindeutig den Personen zu, die herausgeführt werden, und bewahrt zugleich die hervorgehobene, nachgestellte Struktur des Hebräischen. „Trost finden“ verbessert die natürliche moderne deutsche Formulierung, ohne den Trostgrund aus dem weiteren Kontext in den Vers hineinzuerklären. Die Fußnotenanker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
