  text: בֶּן אָדָ֗ם הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ הֶעֱל֤וּ גִלּֽוּלֵי/הֶם֙ עַל לִבָּ֔/ם וּ/מִכְשׁ֣וֹל עֲוֺנָ֔/ם נָתְנ֖וּ נֹ֣כַח פְּנֵי/הֶ֑ם הַ/אִדָּרֹ֥שׁ אִדָּרֵ֖שׁ לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/003.yaml
  text: Son of man[a], these men have set up their idols in their hearts and have placed the stumbling block of their iniquity before their faces[b]. Should I indeed let myself be consulted by them?
translation:
  language: de
  text: Menschensohn, diese Männer haben ihre Götzen[a] in ihrem Herzen aufgerichtet und den Stolperstein ihrer Schuld vor sich gestellt. Sollte ich mich wirklich von ihnen befragen lassen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Götzen« ist hier eine besonders verächtliche Bezeichnung.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Sollte ich mich überhaupt von ihnen befragen lassen?« Die hebräische Form verstärkt die Frage und lässt eine verneinende Antwort erwarten.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische Anredeformel und ihren prophetischen Klang.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: diese Männer
  rationale: Der Ausdruck bezeichnet im Zusammenhang die männlichen Ältesten und wird daher nicht neutralisiert.
- source_word: הֶעֱלוּ
  choice: haben ... aufgerichtet
  rationale: Das Verb bedeutet wörtlich »hinaufbringen/erheben«; zusammen mit den Götzen im Herzen bezeichnet es bildhaft deren innere Aufrichtung oder Einsetzung.
- source_word: גִלּוּלֵיהֶם
  choice: ihre Götzen
  rationale: »Götzen« gibt den klaren Sinn wieder; die besonders verächtliche Färbung des hebräischen Ausdrucks wird in einer Fußnote kenntlich gemacht.
- source_word: עַל לִבָּם
  choice: in ihrem Herzen
  rationale: Natürliches Deutsch für die innere Ausrichtung und Bindung; der hebräische Singular wird kollektiv beibehalten.
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: den Stolperstein ihrer Schuld
  rationale: Bewahrt sowohl das konkrete Bild einer Ursache des Fallens als auch die mögliche Bedeutung von עָוֹן als Schuld beziehungsweise Vergehen, ohne die Beziehung zwischen beiden aufzulösen.
- source_word: נָתְנוּ נֹכַח פְּנֵיהֶם
  choice: unmittelbar vor sich gestellt
  rationale: Gibt die räumliche und absichtsvolle Ausrichtung idiomatisch wieder, ohne das im Deutschen schwerfällige »vor ihr Angesicht« zu verwenden.
- source_word: הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  choice: Sollte ich mich da wirklich von ihnen befragen lassen?
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die rhetorische Frage. Das passive »mich ... befragen lassen« entspricht dem Niphal und bewahrt die implizierte, aber nicht ausdrücklich ausgesprochene Ablehnung.
theological_decisions:
- issue: Gottes Antwort auf Menschen, die trotz ihres Götzendienstes prophetische Auskunft suchen
  choice: 'Rhetorische Frage mit erwarteter negativer Antwort: »Sollte ich mich da wirklich von ihnen befragen lassen?«'
  alternative: '»Sollte ich mich überhaupt von ihnen befragen lassen?« oder ausdrücklich: »Nein, ich werde mich von ihnen nicht befragen lassen.«'
  rationale: Der hebräische Text verstärkt die Frage und legt eine Verneinung nahe, formuliert sie jedoch nicht ausdrücklich. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. »Menschensohn« und »Stolperstein ihrer Schuld« halten zentrale Bilder fest; schwerfällige hebräische Raumangaben werden idiomatisch formuliert.
