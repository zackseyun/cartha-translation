  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נֹ֨חַ דנאל וְ/אִיּוֹב֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בֵּ֥ן אִם בַּ֖ת יַצִּ֑ילוּ הֵ֥מָּה בְ/צִדְקָתָ֖/ם יַצִּ֥ילוּ נַפְשָֽׁ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/020.yaml
  text: Even if Noah[a], Daniel, and Job were in it, as I live, declares the Lord GOD, they would deliver neither son nor daughter; by their righteousness they would deliver only themselves.
translation:
  language: de
  text: Selbst wenn Noah, Daniel[a] und Hiob darin wären – so wahr ich lebe, spricht der Herr Yahweh –, würden sie weder Sohn noch Tochter retten. Durch ihre Gerechtigkeit würden sie nur sich selbst retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch דנאל kann auch als „Danel“ gelesen werden. Möglicherweise ist damit eine alte, als gerecht bekannte Gestalt gemeint und nicht der bekanntere Daniel.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹכָהּ
  choice: darin
  rationale: Das Suffix bezieht sich auf das zuvor genannte, unter Gericht stehende Land; „darin“ gibt den Ortsbezug knapp und natürlich wieder.
- source_word: חַי אָנִי נְאֻם אֲדֹנָי יְהוִה
  choice: so wahr ich lebe, spricht der Herr Yahweh
  rationale: Die Formulierung wahrt den feierlichen Charakter der göttlichen Schwurformel; „Yahweh“ gibt den Gottesnamen wieder, während אֲדֹנָי als „Herr“ erscheint.
- source_word: אִם בֵּן אִם בַּת
  choice: weder Sohn noch Tochter
  rationale: Nach der Schwurformel haben die beiden אִם eine verneinend-ausschließende Kraft, die im Deutschen idiomatisch durch „weder … noch“ ausgedrückt wird.
- source_word: יַצִּילוּ
  choice: retten
  rationale: Der Hifil von נצל bezeichnet hier das Entkommenlassen beziehungsweise Retten aus dem Gericht. „Retten“ ist im modernen Deutsch klar und lässt sich bei beiden Vorkommen beibehalten.
- source_word: הֵמָּה
  choice: sie … nur sich selbst
  rationale: Die Hervorhebung des Pronomens wird im Deutschen durch „nur sich selbst“ im zweiten Satzteil natürlich wiedergegeben.
- source_word: בְצִדְקָתָם
  choice: durch ihre Gerechtigkeit
  rationale: „Durch“ bewahrt die instrumentale beziehungsweise begründende Funktion der Präposition, ohne eindeutig zwischen Mittel und Grundlage zu entscheiden.
- source_word: נַפְשָׁם
  choice: sich selbst
  rationale: נֶפֶשׁ bezeichnet hier die eigene Person beziehungsweise das eigene Leben, nicht speziell eine vom Körper getrennte Seele. „Sich selbst“ stellt den Kontrast zu Sohn und Tochter klar heraus.
- source_word: דנאל
  choice: Daniel
  rationale: Die traditionelle Lesung „Daniel“ bleibt im Haupttext, doch die abweichende hebräische Schreibweise erlaubt „Danel“; diese echte Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; Herr JHWH
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom persönlichen Gottesnamen יהוה und macht den im Hebräischen ausdrücklich stehenden Namen sichtbar.
- issue: Identität von דנאל
  choice: Daniel im Haupttext mit Fußnote
  alternative: Danel, möglicherweise eine außerbiblische Gestalt der alten Überlieferung
  rationale: Der Konsonantentext schreibt דנאל statt der sonst üblichen Form דניאל. Da der Text die Identität nicht eindeutig entscheidet, wird die vertraute Namensform verwendet und die alternative Lesung ausdrücklich dokumentiert.
- issue: Wirkung der Gerechtigkeit der drei Gerechten
  choice: Sie rettet im Gericht nur die betreffenden Gerechten selbst
  alternative: Ihre Gerechtigkeit könnte auch Angehörige stellvertretend bewahren
  rationale: Die ausdrückliche Verneinung bezüglich Sohn und Tochter sowie נַפְשָׁם begrenzen die Rettung in diesem Gerichtsspruch auf die eigene Person; der Wortlaut wird wiedergegeben, ohne daraus eine allgemeine Lehre über Verdienst abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich fasst die eingeschobene Schwurformel klar ein. Die Wiederholung von „retten“ spiegelt die hebräische Wiederholung; „Gerechtigkeit“ bewahrt den gewichtigen theologischen Begriff, ohne ihn auszudeuten.
