    rationale: Das hebräische verwendet für Israel in der Bundesformel pluralische Bezüge („sie ... mir zum Volk“, „ich ... ihnen zum Gott“). Die explizite Aufnahme „sie“ verhindert, dass das grammatische Singularwort „Haus“ diese Bezüge verdeckt.
