  source_fidelity: Die Zweckkonstruktion, das reflexive „sich verunreinigen“ und die Bundesformel werden grundsätzlich getroffen. „davon abirrt, mir zu folgen“ ist jedoch im Deutschen syntaktisch und semantisch uneindeutig; das Bezugswort von „davon“ bleibt unklar. Außerdem hat das Hebräische in der Bundesformel Pluralbezüge („ihnen“), die mit einer expliziten pluralischen Aufnahme des Kollektivs klarer wiederzugeben sind. Die Gottesbezeichnung אֲדֹנָי יְהוִה ist gemäß der vorliegenden Namensentscheidung als „der Herr Yahweh“ wiederzugeben.
  naturalness: Die vorliegende Formulierung wirkt besonders bei „davon abirrt, mir zu folgen“ unnatürlich. „von mir abirren“ ist idiomatisch und lässt sich durch eine Fußnote als Abkehr von der Nachfolge erläutern. Die Verbformen „werden ... werde“ machen die von „damit“ abhängige Zielaussage im modernen Deutsch klar und bewahren zugleich die parallele Bundesformel.
  terminology: „Vergehen“ ist für פְּשָׁעִים vertretbar, wobei „durch all ihre Vergehen“ die verursachende Funktion von בְ wahrt. „Mir zum Volk / ihnen zum Gott“ gibt die hebräische Bundesformel eng wieder, ohne ihre Bedeutung einzuengen. „Yahweh“ gibt den Gottesnamen wieder; „Herr“ entspricht אֲדֹנָי.
