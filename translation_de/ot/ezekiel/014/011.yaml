    rationale: In „nicht mehr davon abirrt, mir zu folgen“ besitzt „davon“ keinen eindeutigen deutschen Bezug. Das hebräische מֵאַחֲרַי bezeichnet die Abkehr von der Nachfolge Gottes; „nicht mehr von mir abirrt“ ist klar und die Fußnote kann die Bildsprache erläutern.
  - severity: medium
