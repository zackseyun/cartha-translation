  text: לְ֠מַעַן לֹֽא יִתְע֨וּ ע֤וֹד בֵּֽית יִשְׂרָאֵל֙ מֵ/אַֽחֲרַ֔/י וְ/לֹֽא יִטַּמְּא֥וּ ע֖וֹד בְּ/כָל פִּשְׁעֵי/הֶ֑ם וְ/הָ֥יוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/011.yaml
  text: so that the house of Israel may no longer go astray from me[a], and may no longer defile themselves with all their transgressions, but may be my people, and I may be their God, declares the Lord GOD.
translation:
  language: de
  text: damit das Haus Israel nicht mehr von mir abirrt[a] und sich nicht mehr durch all ihre Vergehen verunreinigt, sondern sie mir zum Volk werden und ich ihnen zum Gott werde, spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von hinter mir weg abirrt“. Die hebräische Wendung bezeichnet die Abkehr davon, Yahweh nachzufolgen.'
    reason: Erläutert das hebräische Idiom מֵאַחֲרַי, ohne die verständliche Wiedergabe im Haupttext zu überladen.
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis ein und entspricht natürlichem modernem Deutsch.
- source_word: יִתְעוּ ... מֵאַחֲרַי
  choice: davon abirrt, mir zu folgen
  rationale: תעה bezeichnet das Abirren; מֵאַחֲרַי heißt wörtlich etwa „von hinter mir her“ und beschreibt hier die Abkehr von der Nachfolge. Die Formulierung bewahrt beide Aspekte.
- source_word: יִטַּמְּאוּ
  choice: sich ... verunreinigt
  rationale: Die reflexive Verbform bezeichnet eine selbst verursachte Verunreinigung und lässt sowohl die kultische als auch die moralische Dimension offen.
- source_word: בְּכָל פִּשְׁעֵיהֶם
  choice: durch all seine Vergehen
  rationale: פשע bezeichnet schuldhafte Übertretung, oft mit dem Beiklang der Auflehnung. „Vergehen“ ist verständlich und gewichtig; „durch“ gibt die instrumentale Funktion der Präposition wieder.
- source_word: וְהָיוּ לִי לְעָם
  choice: sondern mein Volk ist
  rationale: Gibt die bekannte Bundesformel natürlich wieder. Der Singular richtet sich im Deutschen nach dem Kollektivbegriff „Haus Israel“.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: und ich sein Gott bin
  rationale: Bewahrt die parallele Bundesformel und ordnet sie wie die vorherigen Aussagen dem von לְמַעַן eingeleiteten Zweck unter.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht GOTT, der Herr
  rationale: נְאֻם ist die prophetische Spruchformel. Die traditionelle deutsche Wiedergabe vermeidet die schwerfällige Doppelung „Herr HERR“ und unterscheidet beide Gottesbezeichnungen typografisch.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: mein Volk ... sein Gott
  alternative: mir zum Volk ... ihnen zum Gott
  rationale: Die idiomatische deutsche Form bewahrt den Bundesbezug, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Modalität der von לְמַעַן abhängigen Bundesformel
  choice: ist ... bin
  alternative: sein wird ... sein werde
  rationale: Der gesamte Satz beschreibt den Zweck des vorausgehenden göttlichen Handelns. Das deutsche Präsens nach „damit“ bringt diese Zielsetzung natürlicher zum Ausdruck als eine Zukunftsform und legt nicht fest, ob zusätzlich eine Verheißungsnuance mitschwingt.
- issue: Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: der Herr Jahwe
  rationale: Die gewählte Form entspricht einer etablierten deutschen Konvention und hält Titel und Gottesnamen unterscheidbar, ohne eine bestimmte Aussprache des Tetragramms in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-prophetischem Ton. Das kollektive „Haus Israel“ wird grammatisch im Singular aufgenommen; die Fußnote erklärt das anschauliche hebräische Nachfolge-Idiom.
