base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/016.yaml
  text: Even if these three men were in its midst[a], as I live, declares the Lord GOD, they would deliver neither sons nor daughters; they alone would be delivered, and the land would become a desolation.
translation:
  language: de
  text: 'Selbst wenn diese drei Männer mitten in ihr wären: So wahr ich lebe – Ausspruch Yahwehs, des Herrn –, sie würden weder Söhne noch Töchter retten.[a] Nur sie selbst würden gerettet werden, und das Land würde zur Einöde werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nahe am Hebräischen: „ob Söhne oder ob Töchter sie retten würden“. Im Zusammenhang dieser Schwurformel hat die hebräische Wendung verneinende Bedeutung: Sie würden weder Söhne noch Töchter retten.'
    reason: Die Fußnote erläutert die im Deutschen nicht unmittelbar erkennbare, in der Schwurformel idiomatisch verneinende Funktion von אִם und vermeidet eine scheinbar vollständig explizite Wort-für-Wort-Wiedergabe.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: diese drei Männer
  rationale: Formale und im Kontext sachgerechte Wiedergabe; gemeint sind die drei zuvor genannten männlichen Gestalten.
- source_word: בְּתוֹכָהּ
  choice: mitten in ihr
  rationale: Bewahrt den Bezug des femininen Suffixes auf das im Kontext genannte Land und gibt die räumliche Wendung natürlich wieder.
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Geläufige, würdevolle deutsche Wiedergabe der feierlichen göttlichen Schwurformel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: „Ausspruch“ wahrt den nominalen Charakter von נְאֻם; „Yahweh“ gibt den Gottesnamen wieder, während אֲדֹנָי mit „Herr“ übersetzt wird.
- source_word: אִם בָּנִים וְאִם בָּנוֹת יַצִּילוּ
  choice: sie würden weder Söhne noch Töchter retten
  rationale: Im Zusammenhang der Schwurformel hat אִם verneinende Kraft. „Retten“ gibt das Hifil von נצל idiomatisch wieder und bleibt mit dem folgenden Passiv verbunden.
- source_word: הֵמָּה לְבַדָּם יִנָּצֵלוּ
  choice: Nur sie selbst würden gerettet werden
  rationale: „Nur sie selbst“ bildet die emphatische Exklusivität von הֵמָּה לְבַדָּם deutlich ab; das Passiv entspricht dem Nifal.
- source_word: וְהָאָרֶץ תִּהְיֶה שְׁמָמָה
  choice: und das Land würde zur Einöde werden
  rationale: Bewahrt sowohl den resultativen Sinn von תִּהְיֶה als auch die substantivische Aussage von שְׁמָמָה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die Übersetzung unterscheidet den Herrentitel אֲדֹנָי vom Eigennamen יהוה und macht den im Ausgangstext vorhandenen Gottesnamen sichtbar.
- issue: Reichweite der rettenden Gerechtigkeit der drei Männer
  choice: Sie könnten weder Söhne noch Töchter retten, sondern nur selbst gerettet werden.
  alternative: Die Kinder ausdrücklich als ihre eigenen Söhne und Töchter bezeichnen.
  rationale: Der deutsche Text erhält die scharfe Aussage individueller Rettung, ergänzt aber kein Possessivpronomen, das im Hebräischen nicht ausdrücklich steht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Der Doppelpunkt und die Gedankenstriche markieren die eingeschobene Schwur- und Ausspruchsformel, ohne die Satzlogik zu glätten.
