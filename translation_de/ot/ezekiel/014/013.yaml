  text: בֶּן אָדָ֗ם אֶ֚רֶץ כִּ֤י תֶחֱטָא לִ/י֙ לִ/מְעָל מַ֔עַל וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/הָ וְ/שָׁבַ֥רְתִּי לָ֖/הּ מַטֵּה לָ֑חֶם וְ/הִשְׁלַחְתִּי בָ֣/הּ רָעָ֔ב וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
translation:
  language: de
  text: Menschensohn, wenn ein Land gegen mich sündigt, indem es mir die Treue bricht, und ich meine Hand gegen es ausstrecke, ihm die Brotversorgung entziehe[a], eine Hungersnot über es kommen lasse und Menschen und Tiere[b] daraus ausrotte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Stab des Brotes zerbrechen“; eine hebräische Bildrede für das Abschneiden der Nahrungsversorgung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Mensch und Vieh“; eine feste Wendung für die menschlichen und tierischen Bewohner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste Anredeformel im Buch Ezechiel wird formal und traditionsnah wiedergegeben, ohne sie christologisch weiterzudeuten.
- source_word: אֶרֶץ
  choice: ein Land
  rationale: Die artikellose Form steht in einem allgemeinen Bedingungssatz; „ein Land“ bewahrt diesen generischen Sinn.
- source_word: תֶחֱטָא לִי
  choice: gegen mich sündigt
  rationale: Die Verbindung von חטא mit ל bezeichnet hier eine gegen Gott gerichtete Sünde.
- source_word: לִמְעָל מַעַל
  choice: indem es mir die Treue bricht
  rationale: Die figura etymologica betont einen treulosen Verstoß. Die Wiedergabe wahrt den Beziehungs- beziehungsweise Bundeskontext, ohne die konkrete Art der Untreue festzulegen.
- source_word: וְנָטִיתִי יָדִי עָלֶיהָ
  choice: und ich meine Hand gegen es ausstrecke
  rationale: Die gerichtliche Bildsprache des Hebräischen bleibt in natürlichem Deutsch erhalten.
- source_word: וְשָׁבַרְתִּי לָהּ מַטֵּה לָחֶם
  choice: ihm die Stütze des Brotes zerbreche
  rationale: Die ungewöhnliche, aber verständliche Bildrede „Stütze des Brotes“ bewahrt das hebräische מַטֵּה und bezeichnet die tragende Nahrungsgrundlage; eine Fußnote erläutert sie.
- source_word: וְהִשְׁלַחְתִּי בָהּ רָעָב
  choice: eine Hungersnot über es kommen lasse
  rationale: רָעָב meint in diesem Gerichtszusammenhang eine Hungersnot. Die deutsche Formulierung gibt das von Gott veranlasste Eintreffen natürlich wieder.
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: daraus ausrotte
  rationale: כרת bezeichnet hier ein entschiedenes Beseitigen. „ausrotten“ gibt die Schwere des Gerichtsworts idiomatischer wieder als das im Deutschen missverständliche „abschneiden“.
- source_word: אָדָם וּבְהֵמָה
  choice: Menschen und Tiere
  rationale: Die feste Paarformel umfasst die menschlichen und tierischen Bewohner des Landes. Der Plural gibt den kollektiven Sinn von אָדָם in modernem Deutsch klar wieder.
theological_decisions:
- issue: Bedeutung der mit מַעַל bezeichneten Verfehlung
  choice: Treuebruch gegenüber Gott
  alternative: allgemeine Sündhaftigkeit oder ein enger gefasstes rechtliches Vergehen
  rationale: Die Verbindung von „gegen mich sündigen“ mit der verstärkenden Wendung לִמְעָל מַעַל weist auf einen Treuebruch gegenüber Gott. Die Übersetzung lässt offen, welche konkrete Form dieser Treuebruch annimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. Der Vers bleibt als protasisreicher, zum Folgevers hin offener Satz mit abschließendem Komma stehen. Die Pronomen beziehen sich grammatisch auf das sächliche „Land“.
