  text: לֽוּ חַיָּ֥ה רָעָ֛ה אַעֲבִ֥יר בָּ/אָ֖רֶץ וְ/שִׁכְּלָ֑תָּ/ה וְ/הָיְתָ֤ה שְׁמָמָה֙ מִ/בְּלִ֣י עוֹבֵ֔ר מִ/פְּנֵ֖י הַ/חַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/015.yaml
  text: If I cause dangerous wild animals to pass through the land[a], and they bereave it, and it becomes a desolation, without anyone passing through because of the animals[b],
translation:
  language: de
  text: Wenn ich gefährliche Wildtiere[a] durch das Land ziehen lasse und sie es seiner Bewohner berauben[b] und es zur Einöde wird, ohne dass wegen der Tiere jemand hindurchzieht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wilde Tiere“; wörtlich steht im Hebräischen ein singularischer Sammelbegriff: „ein böses/gefährliches Tier“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und sie es kinderlos machen“. Das Land wird bildhaft als kinderlos dargestellt, weil seine Bewohner fehlen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֽוּ
  choice: Wenn
  rationale: Die Partikel leitet innerhalb der Gerichtsfolge einen hypothetischen Bedingungssatz ein. „Wenn“ ist dafür im modernen Deutschen die natürlichste Entsprechung.
- source_word: חַיָּה רָעָה
  choice: gefährliche Wildtiere
  rationale: Das singularische Kollektiv bezeichnet schädliche oder bedrohliche wilde Tiere als Gruppe. „Gefährliche Wildtiere“ gibt die konkrete Bedrohung klar wieder, ohne Tiere moralisch als „böse“ zu bezeichnen.
- source_word: אַעֲבִיר
  choice: durch das Land ziehen lasse
  rationale: 'Der Hifil von עבר drückt Verursachung aus: Gott bewirkt, dass die Tiere das Land durchziehen. Die Formulierung erhält sowohl die göttliche Verursachung als auch das Bewegungsbild.'
- source_word: בָּאָרֶץ
  choice: durch das Land
  rationale: In Verbindung mit עבר bezeichnet die Wendung eine Bewegung durch das Gebiet hindurch.
- source_word: וְשִׁכְּלָתָּהּ
  choice: und sie es seiner Bewohner berauben
  rationale: שׁכל bezeichnet das Verlieren von Kindern beziehungsweise das Kinderlosmachen. Auf das Land bezogen wird dieses als seiner Bevölkerung beraubt dargestellt. Die Übersetzung macht den gemeinten Verlust verständlich; die Fußnote bewahrt das stärkere hebräische Bild.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: sodass es zur Einöde wird
  rationale: שְׁמָמָה bezeichnet den verwüsteten, verlassenen Zustand. „Zur Einöde wird“ bewahrt den substantivischen Ausdruck und fügt sich natürlich als Folge in den deutschen Satz ein.
- source_word: מִבְּלִי עוֹבֵר
  choice: niemand mehr hindurchzieht
  rationale: Der substantivierte Partizipialausdruck beschreibt das völlige Ausbleiben von Durchreisenden. „Mehr“ verdeutlicht idiomatisch das Ende des bisherigen Verkehrs, ohne den Sinn zu verändern.
- source_word: מִפְּנֵי הַחַיָּה
  choice: wegen der Tiere
  rationale: מִפְּנֵי gibt hier den Grund an; der bestimmte Ausdruck verweist auf die zuvor genannten Wildtiere zurück.
theological_decisions:
- issue: Göttliches Handeln im Gericht
  choice: Die ausdrückliche göttliche Verursachung bleibt mit „ich … ziehen lasse“ erhalten.
  alternative: „Wenn wilde Tiere durch das Land ziehen“ oder „wenn ich wilde Tiere in das Land schicke“
  rationale: Die Hifil-Form stellt Gott als denjenigen dar, der das Durchziehen der Tiere bewirkt. Die Übersetzung schwächt dies weder zu bloßer Zulassung ab noch ersetzt sie das Bewegungsbild unnötig durch „schicken“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als noch nicht abgeschlossener Bedingungssatz offen, entsprechend seinem Zusammenhang. Das prophetische Gerichtsvokabular wird klar wiedergegeben, während das ungewöhnliche Bild des Kinderlosmachens in einer Fußnote erhalten bleibt.
