source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה שׁ֣וּבוּ וְ/הָשִׁ֔יבוּ מֵ/עַ֖ל גִּלּֽוּלֵי/כֶ֑ם וּ/מֵ/עַ֥ל כָּל תּוֹעֲבֹתֵי/כֶ֖ם הָשִׁ֥יבוּ פְנֵי/כֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/006.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: Turn back, and turn away from your idols[b], and turn your faces away from all your abominations.’'
translation:
  language: de
  text: 'Darum sag zum Haus Israel: So spricht der Herr Jahwe: Kehrt um[a], wendet euch von euren Götzen[b] ab und wendet eure Gesichter von all euren abscheulichen Dingen ab!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kehrt zurück.“ Das hebräische Verb kann sowohl die Rückkehr als auch die Umkehr im Sinn von Reue und Neuausrichtung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Götzen“ ist eine bewusst verächtliche Bezeichnung.
    reason: lexical_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als natürliche deutsche Folgerung die Konsequenz aus der vorangehenden Anklage ein.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Bewahrt die formelhafte gemeinschaftliche und bundesgeschichtliche Bezeichnung.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige, würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Gibt sowohl den Herrentitel Adonaj als auch den Gottesnamen JHWH wieder, ohne beide zu einem einzigen Titel zu verschmelzen.
- source_word: שׁוּבוּ
  choice: Kehrt um
  rationale: Bewahrt das Richtungsbild von שׁוב und vermittelt zugleich den prophetischen Ruf zur Umkehr.
- source_word: וְהָשִׁיבוּ מֵעַל גִּלּוּלֵיכֶם
  choice: wendet euch von euren Götzen ab
  rationale: Natürliches Deutsch für die kausative Aufforderung zur entschiedenen Abkehr; גִּלּוּלִים bezeichnet hier abwertend Götzenbilder.
- source_word: וּמֵעַל כָּל תּוֹעֲבֹתֵיכֶם הָשִׁיבוּ פְנֵיכֶם
  choice: und kehrt euer Gesicht von all euren abscheulichen Dingen ab
  rationale: Erhält das konkrete hebräische Bild des abgewandten Gesichts und lässt offen, ob תּוֹעֵבוֹת Gegenstände, Praktiken oder beides meint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Der Ausgangstext verbindet den Titel Adonaj mit dem Eigennamen JHWH. Die gewählte Form macht beide Elemente erkennbar und vermeidet die missverständliche Verdoppelung „Herr HERR“.
- issue: Bedeutung von שׁוּב im prophetischen Aufruf
  choice: Kehrt um
  alternative: Kehrt zurück; Tut Buße
  rationale: „Kehrt um“ umfasst sowohl die konkrete Richtungsänderung als auch die religiös-ethische Umkehr, ohne das Verb auf einen späteren theologischen Fachausdruck zu verengen.
- issue: Umfang von תּוֹעֲבֹתֵיכֶם
  choice: eure abscheulichen Dinge
  alternative: eure Gräueltaten; eure abscheulichen Praktiken
  rationale: Die allgemeinere Formulierung bewahrt die mögliche Bezugnahme auf verwerfliche Kultgegenstände wie auch auf verwerfliche Handlungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener prophetischer Formel und konkretem Richtungsbild. Die ungewöhnliche Wendung „kehrt euer Gesicht ... ab“ wurde bewusst beibehalten, da sie die nachdrückliche hebräische Wiederholung und die bewusste Abwendung sichtbar macht.
