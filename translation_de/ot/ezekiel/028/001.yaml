  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell als „der HERR“ wiedergegeben, hier „Jahwe“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Form führt die nächste prophetische Mitteilung in der Erzählfolge ein. Die feste deutsche Wendung „das Wort … erging“ gibt diese Funktion natürlich und würdig wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Botenformel bezeichnet דָּבָר die von Gott kommende Mitteilung. „Das Wort“ bewahrt den etablierten biblischen Sprachgebrauch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; dies bewahrt den im Hebräischen stehenden Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit „erging“ ist „an mich“ die idiomatische deutsche Wiedergabe der auf den Propheten gerichteten Mitteilung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die in Vers 2 folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im deutschen Bibelkontext in geläufiger Form wieder; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „das Wort Jahwes erging an mich“ ist zugleich verständlich und quellennah; der Doppelpunkt kündigt die direkte Rede des folgenden Verses an.
