base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/011.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] kam zu mir:

    '
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Formel ויהי דבר־יהוה bezeichnet das Verb idiomatisch, dass Gottes Wort an einen Propheten ergeht; „kam“ bewahrt dieses Bild und klingt im Deutschen natürlich.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier die von Gott ausgehende Mitteilung. „Das Wort“ erhält den formelhaften und theologischen Gehalt, ohne es bereits als „Botschaft“ auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt den Eigennamen in gebräuchlicher deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präpositionalverbindung bezeichnet Ezechiel als Empfänger des Wortes; „zu mir“ ist präzises und natürliches Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Das einleitende לֵאמֹר kündigt den unmittelbar folgenden Inhalt der Rede an. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Eigennamen JHWH verwendet, bleibt dieser in deutscher Umschrift als „Jahwe“ erkennbar. Die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Wortereignisformel bleibt mit „das Wort … kam zu mir“ erkennbar; לֵאמֹר wird vor der anschließenden Rede idiomatisch durch einen Doppelpunkt wiedergegeben.
