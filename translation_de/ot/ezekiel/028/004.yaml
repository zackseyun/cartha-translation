  text: בְּ/חָכְמָֽתְ/ךָ֙ וּ/בִ/תְבוּנָ֣תְ/ךָ֔ עָשִׂ֥יתָ לְּ/ךָ֖ חָ֑יִל וַ/תַּ֛עַשׂ זָהָ֥ב וָ/כֶ֖סֶף בְּ/אוֹצְרוֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/004.yaml
  text: By your wisdom and by your understanding you made wealth for yourself[a], and you put gold and silver into your treasuries.
translation:
  language: de
  text: Durch deine Weisheit und deinen Verstand hast du dir Reichtum[a] erworben und Gold und Silber in deinen Schatzkammern angehäuft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Stärke oder Macht. Das hebräische Wort kann Reichtum, Stärke, Macht oder Ressourcen bezeichnen; Gold, Silber und Schatzkammern sprechen hier für „Reichtum“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָתְךָ
  choice: Durch deine Weisheit
  rationale: Die Präposition ב ist hier instrumental; „durch“ gibt das Mittel im Deutschen natürlich wieder.
- source_word: וּבִתְבוּנָתְךָ
  choice: und deinen Verstand
  rationale: תְּבוּנָה bezeichnet Verstand, Einsicht oder Urteilsvermögen. „Verstand“ bildet mit „Weisheit“ ein verständliches, semantisch unterscheidbares Paar.
- source_word: עָשִׂיתָ לְּךָ חָיִל
  choice: hast du dir Reichtum erworben
  rationale: חַיִל kann Reichtum, Stärke, Macht oder Ressourcen bezeichnen. Gold, Silber und Schatzkammern legen hier Reichtum nahe. Das idiomatische „erworben“ vermittelt עשה in diesem wirtschaftlichen Zusammenhang besser als das unnatürliche „gemacht“.
- source_word: וַתַּעַשׂ
  choice: angehäuft
  rationale: Wörtlich steht erneut עשה („machen/tun“). Zusammen mit Gold, Silber und Schatzkammern bezeichnet es hier sinngemäß das Ansammeln und Einlagern von Werten.
- source_word: זָהָב וָכֶסֶף
  choice: Gold und Silber
  rationale: Direkte und geläufige Wiedergabe des hebräischen Wortpaars.
- source_word: בְּאוֹצְרוֹתֶיךָ
  choice: in deinen Schatzkammern
  rationale: אוֹצָר bezeichnet einen Vorrats- oder Schatzraum. Bei Gold und Silber ist „Schatzkammern“ die präziseste natürliche Wiedergabe; ב wird als Ortsangabe „in“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von חַיִל im Spottwort gegen den Herrscher von Tyrus
  choice: Reichtum
  alternative: Stärke, Macht oder Ressourcen
  rationale: Der unmittelbare Zusammenhang mit Gold, Silber und Schatzkammern spricht für materiellen Reichtum. Die Fußnote bewahrt die weitere Bedeutungsbreite des hebräischen Wortes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erworben“ und „angehäuft“ vermeiden unidiomatische Wiederholungen von „machen“, ohne den wirtschaftlichen Sinn der beiden Formen von עשה zu verwischen.
