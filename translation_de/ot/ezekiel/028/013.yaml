source:
  edition: WLC
  text: בְּ/עֵ֨דֶן גַּן אֱלֹהִ֜ים הָיִ֗יתָ כָּל אֶ֨בֶן יְקָרָ֤ה מְסֻכָתֶ֨/ךָ֙ אֹ֣דֶם פִּטְדָ֞ה וְ/יָהֲלֹ֗ם תַּרְשִׁ֥ישׁ שֹׁ֨הַם֙ וְ/יָ֣שְׁפֵ֔ה סַפִּ֣יר נֹ֔פֶךְ וּ/בָרְקַ֖ת וְ/זָהָ֑ב מְלֶ֨אכֶת תֻּפֶּ֤י/ךָ וּ/נְקָבֶ֨י/ךָ֙ בָּ֔/ךְ בְּ/י֥וֹם הִבָּרַאֲ/ךָ֖ כּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/013.yaml
  text: 'You were in Eden[a], the garden of God; every precious stone was your covering: ruby, topaz, and diamond; beryl, onyx, and jasper; sapphire, turquoise, and emerald; and gold. The workmanship of your tambourines and your sockets was in you; on the day you were created[b], they were prepared.'
translation:
  language: de
  text: 'Du warst in Eden, dem Garten Gottes. Mit jedem kostbaren Stein warst du bedeckt: Rubin, Topas und Diamant, Beryll, Onyx und Jaspis, Saphir, Türkis und Smaragd, dazu Gold.[a] Die kunstvolle Arbeit deiner Tamburine und deiner Fassungen war in dir; an dem Tag, als du erschaffen wurdest,[b] wurden sie bereitgemacht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer Edelsteine ist unsicher; antike Steinnamen entsprechen den heutigen mineralogischen Bezeichnungen nicht immer genau. Möglich sind unter anderem Karneol statt „Rubin“, Chrysolith statt „Topas“ oder „Beryll“, Lapislazuli statt „Saphir“ sowie Karfunkel für einen der als „Türkis“ oder „Smaragd“ bezeichneten Steine.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut dieses Satzteils ist schwierig. Möglich ist auch: „Die kunstvolle Arbeit deiner Einfassungen und Halterungen war in dir“, wenn beide Begriffe auf Schmuckhandwerk und nicht auf Musikinstrumente bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵדֶן גַּן אֱלֹהִים
  choice: in Eden, dem Garten Gottes
  rationale: Bewahrt den Eigennamen Eden und die appositionelle Bezeichnung des heiligen Ortes in natürlichem Deutsch.
- source_word: כָּל אֶבֶן יְקָרָה מְסֻכָתֶךָ
  choice: Jeder kostbare Stein bedeckte dich
  rationale: Gibt die umfassende Aussage und das Bild einer Bedeckung idiomatisch wieder, ohne festzulegen, ob Kleidung, Schmuck oder schützender Überzug gemeint ist.
- source_word: אֹדֶם פִּטְדָה וְיָהֲלֹם תַּרְשִׁישׁ שֹׁהַם וְיָשְׁפֵה סַפִּיר נֹפֶךְ וּבָרְקַת וְזָהָב
  choice: Rubin, Topas und Diamant, Beryll, Onyx und Jaspis, Saphir, Türkis und Smaragd, dazu Gold
  rationale: Verwendet verständliche traditionelle Edelsteinnamen; da die antiken Bezeichnungen mineralogisch nicht sicher zuzuordnen sind, wird die Unsicherheit in einer Fußnote offengelegt.
- source_word: מְלֶאכֶת תֻּפֶּיךָ וּנְקָבֶיךָ
  choice: die kunstvolle Arbeit deiner Tamburine und deiner Fassungen
  rationale: Bildet die schwierigen masoretischen Formen möglichst nah ab. „Tamburine“ folgt der üblichen Bedeutung von תֹּף; „Fassungen“ gibt die Vorstellung von Vertiefungen oder Halterungen wieder. Eine zusammenhängende schmuckhandwerkliche Deutung wird als Alternative genannt.
- source_word: בְּיוֹם הִבָּרַאֲךָ כּוֹנָנוּ
  choice: an dem Tag, als du erschaffen wurdest, wurden sie bereitgemacht
  rationale: Bewahrt sowohl die Schöpfungsaussage als auch das passive Pluralverb, dessen Bezug im schwierigen Satz nicht ausdrücklich präzisiert wird.
theological_decisions:
- issue: Identität der angeredeten Gestalt und Bedeutung der Eden-Bilder
  choice: Die Eden-, Edelstein- und Schöpfungssprache wird unmittelbar übersetzt, ohne die angeredete Gestalt dogmatisch zu identifizieren.
  alternative: Die Bilder ausdrücklich nur auf den König von Tyrus oder zugleich auf Satan beziehungsweise einen gefallenen Cherub beziehen.
  rationale: Der Vers selbst bietet erhabene Eden- und Schöpfungsbilder, entscheidet aber die weitergehende Identitätsfrage nicht ausdrücklich. Die Übersetzung erhält diese theologische Spannung.
- issue: Deutung der schwierigen Schlussphrase
  choice: Die überlieferte Wortgestalt wird mit „Tamburine“ und „Fassungen“ sichtbar gehalten.
  alternative: Die gesamte Wendung als Schmuckarbeit mit „Einfassungen und Halterungen“ verstehen.
  rationale: Der hebräische Text ist lexikalisch und syntaktisch schwierig. Keine der Hauptdeutungen soll stillschweigend als zweifelsfrei dargestellt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Edelsteinreihe behält ihren feierlichen Katalogcharakter; ungewöhnliche Formulierungen im Schlussglied werden nicht geglättet, sondern durch eine Fußnote transparent gemacht.
