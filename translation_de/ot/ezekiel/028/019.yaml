base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/019.yaml
  text: All who know you among the peoples are appalled at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: de
  text: Alle, die dich unter den Völkern kennen, sind entsetzt über dich. Du bist zum Schrecken geworden[a] und wirst nie mehr sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, die Pluralform wiedergebend: „zu Schrecken“; gemeint sein kann: „zu einem Gegenstand des Entsetzens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יוֹדְעֶיךָ
  choice: Alle, die dich … kennen
  rationale: Gibt den distributiven Quantifikator und das Qal-Partizip natürlich und ohne unnötige zeitliche Festlegung wieder.
- source_word: בָּעַמִּים
  choice: unter den Völkern
  rationale: Bewahrt den Plural עַמִּים und die räumlich-soziale Bedeutung der Präposition; „Völker“ ist im Deutschen hier natürlicher und quellennah.
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: sind entsetzt über dich
  rationale: שמם bezeichnet hier die erschütterte, entsetzte Reaktion auf den Untergang; „über dich“ gibt על idiomatisch wieder.
- source_word: בַּלָּהוֹת הָיִיתָ
  choice: Du bist zum Schrecken geworden
  rationale: Der morphologische Plural בַּלָּהוֹת kann eine intensive oder abstrakte Bedeutung tragen. „zum Schrecken geworden“ gibt die resultative Aussage idiomatisch wieder, ohne sie auf bloßes Erschrecken zu reduzieren.
- source_word: וְאֵינְךָ עַד עוֹלָם
  choice: und wirst für immer nicht mehr sein
  rationale: Gibt die existentielle Negation und die endgültige Zeitangabe mit der Zukunftswirkung des Gerichtsworts wieder; die markante Formulierung bewahrt die rhetorische Endgültigkeit.
theological_decisions:
- issue: Tragweite der abschließenden Vernichtungsformel
  choice: „und wirst für immer nicht mehr sein“ als Aussage endgültigen Verschwindens innerhalb dieses Gerichtsworts
  alternative: „und du bist für immer nicht mehr“ oder „und wirst nie wieder bestehen“
  rationale: Die Übersetzung wahrt die starke Endgültigkeit von וְאֵינְךָ עַד עוֹלָם, ohne daraus ausdrücklich eine über den angesprochenen König und das konkrete Gericht hinausgehende Lehrbehauptung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt knapp und orakelhaft. „Zum Schrecken geworden“ wahrt die ungewöhnliche Intensität des hebräischen Plurals; die Fußnote macht die echte lexikalische Spannweite sichtbar.
