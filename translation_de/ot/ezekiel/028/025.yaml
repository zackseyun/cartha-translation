source:
  edition: WLC
  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/קַבְּצִ֣/י אֶת בֵּ֣ית יִשְׂרָאֵ֗ל מִן הָֽ/עַמִּים֙ אֲשֶׁ֣ר נָפֹ֣צוּ בָ֔/ם וְ/נִקְדַּ֥שְׁתִּי בָ֖/ם לְ/עֵינֵ֣י הַ/גּוֹיִ֑ם וְ/יָֽשְׁבוּ֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לְ/עַבְדִּ֥/י לְ/יַעֲקֹֽב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/025.yaml
  text: 'Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they were scattered[a], and I show myself holy among them in the sight of the nations, then they will dwell on their own land that I gave to my servant Jacob.'
translation:
  language: de
  text: 'So spricht Yahweh, der Herr: Wenn ich das Haus Israel aus den Völkern sammle, unter denen sie zerstreut worden waren, und mich vor den Augen der Nationen an ihnen als heilig erweise[a], dann werden sie auf ihrem Land wohnen, das ich meinem Diener Jakob gegeben habe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und an ihnen geheiligt werde“; auch möglich: „und mich durch sie als heilig erweise“.'
    reason: Die Nifalform von קדשׁ und die Präposition ב erlauben eine formal passive sowie eine örtliche oder vermittelnde Deutung.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Bewahrt sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יהוה und vermeidet die unnatürliche Doppelung „der Herr HERR“.
- source_word: בְּקַבְּצִי
  choice: Wenn ich ... sammle
  rationale: Die Präposition ב mit dem Infinitivus constructus und dem Suffix der 1. Person Singular bezeichnet hier einen zeitlichen Zusammenhang.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt die korporative, bundestheologisch geprägte hebräische Wendung.
- source_word: הָעַמִּים
  choice: den Völkern
  rationale: „Völker“ gibt עַמִּים natürlich wieder und unterscheidet den Ausdruck vom späteren הַגּוֹיִם, das hier mit „Nationen“ übersetzt wird.
- source_word: נָפֹצוּ בָם
  choice: unter die sie zerstreut wurden
  rationale: Das Nifal bezeichnet das Zerstreutwerden; בָם lässt sich im Deutschen in Verbindung mit dem Bewegungsgeschehen idiomatisch als „unter die“ wiedergeben.
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: und mich ... an ihnen als heilig erweise
  rationale: Das Nifal von קדשׁ mit Gott als Subjekt bezeichnet sein öffentliches Erscheinen beziehungsweise Erweisen als heilig. „An ihnen“ wahrt die Mehrdeutigkeit von בָם zwischen einem lokalen und einem vermittelnden Bezug besser als eine eindeutige Festlegung auf „unter“ oder „durch“.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: vor den Augen der Nationen
  rationale: Gibt die anschauliche und öffentliche Bedeutung der hebräischen Wendung eng und zugleich natürlich wieder.
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  choice: dann werden sie auf ihrem Land wohnen
  rationale: יָשַׁב bezeichnet hier dauerhaftes Wohnen; אֲדָמָה meint im Wiederherstellungskontext das Land.
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: das ich meinem Diener Jakob gegeben habe
  rationale: Bewahrt die Aussage der Landgabe und die Bezeichnung Jakobs als Gottes Diener in natürlicher deutscher Wortstellung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Form macht den im Ausgangstext stehenden Eigennamen erkennbar und bewahrt zugleich den vorangestellten Herrentitel.
- issue: Bedeutung von וְנִקְדַּשְׁתִּי בָם
  choice: mich an ihnen als heilig erweise
  alternative: unter ihnen geheiligt werde / mich durch sie als heilig erweise
  rationale: Die Formulierung verdeutlicht, dass Gottes Heiligkeit öffentlich offenbar wird, ohne eine Veränderung seiner Heiligkeit anzudeuten. Zugleich lässt „an ihnen“ offen, ob Israel eher als Bereich oder als Mittel dieser Offenbarung verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Botenformel und „Haus Israel“ bleiben bewusst formnah; „an ihnen als heilig erweise“ verbindet Verständlichkeit mit der im Hebräischen vorhandenen Mehrdeutigkeit.
