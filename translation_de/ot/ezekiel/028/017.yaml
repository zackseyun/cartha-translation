  text: גָּבַ֤הּ לִבְּ/ךָ֙ בְּ/יָפְיֶ֔/ךָ שִׁחַ֥תָּ חָכְמָתְ/ךָ֖ עַל יִפְעָתֶ֑/ךָ עַל אֶ֣רֶץ הִשְׁלַכְתִּ֗י/ךָ לִ/פְנֵ֧י מְלָכִ֛ים נְתַתִּ֖י/ךָ לְ/רַ֥אֲוָה בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/017.yaml
  text: Your heart was lifted up because of your beauty[a]; you corrupted your wisdom because of your splendor. I cast you to the earth; I set you before kings[c][b], for them to look at you.
translation:
  language: de
  text: Dein Herz wurde hochmütig wegen deiner Schönheit[a]; du hast deine Weisheit verdorben wegen deines Glanzes. Ich warf dich auf die Erde; ich stellte dich vor Könige, damit sie dich sehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Dein Herz wurde hoch wegen deiner Schönheit.'
    reason: Die Fußnote bewahrt die konkrete hebräische Herzmetapher hinter der idiomatischen Wiedergabe „wurde hochmütig“.
  - marker: b
    text: 'Oder: Ich machte dich vor Königen zum Schauspiel.'
    reason: Die Wendung לְרַאֲוָה בָךְ kann auch ergebnisorientiert als öffentliches Schauspiel des Gerichts verstanden werden.
lexical_decisions:
- source_word: גָּבַהּ לִבְּךָ
  choice: Dein Herz wurde hochmütig
  rationale: Die hebräische Wendung spricht wörtlich von einem hoch gewordenen Herzen und bezeichnet hier Stolz. Die deutsche idiomatische Wiedergabe bewahrt den moralischen Sinn; die Metapher steht als Alternative in der Fußnote.
- source_word: בְּיָפְיֶךָ
  choice: wegen deiner Schönheit
  rationale: ב ist im Zusammenhang kausal zu verstehen und benennt den Anlass des Hochmuts.
- source_word: שִׁחַתָּ חָכְמָתְךָ
  choice: du hast deine Weisheit verdorben
  rationale: שׁחת bezeichnet das Verderben oder Zerstören; „verdorben“ passt natürlich zu „Weisheit“ und lässt deren praktische wie politische Weite bestehen.
- source_word: עַל יִפְעָתֶךָ
  choice: wegen deines Glanzes
  rationale: עַל ist kausal; יִפְעָה bezeichnet eine leuchtende, prachtvolle Erscheinung. „Glanz“ bildet eine natürliche Parallele zu „Schönheit“.
- source_word: עַל אֶרֶץ הִשְׁלַכְתִּיךָ
  choice: Ich warf dich auf die Erde
  rationale: אֶרֶץ wird eng am Wortlaut mit „Erde“ wiedergegeben; „warf“ vermittelt die Kraft des Hifil von שׁלך.
- source_word: לִפְנֵי מְלָכִים נְתַתִּיךָ
  choice: ich stellte dich vor Könige
  rationale: Die Wiedergabe bewahrt das konkrete Bild des hebräischen „gab/setzte dich vor Könige“, ohne die folgende Zweckangabe vorwegzunehmen.
- source_word: לְרַאֲוָה בָךְ
  choice: damit sie dich anstarrten
  rationale: Der Infinitiv mit ל bezeichnet Zweck oder Ergebnis. „Anstarrten“ gibt das öffentliche Betrachten als Folge des Gerichts natürlich wieder, ohne einen ausdrücklich im Hebräischen nicht genannten Akteur hinzuzufügen, denn dieser ergibt sich aus „Könige“.
theological_decisions:
- issue: Identität des Angeredeten
  choice: Die Übersetzung belässt die Anrede im prophetischen Klagelied über den König von Tyrus, ohne eine mögliche übermenschliche oder typologische Anspielung festzulegen.
  alternative: Den Vers ausschließlich auf einen menschlichen Herrscher oder ausdrücklich auf ein himmlisches Wesen beziehen.
  rationale: Der einzelne Vers nennt nur ein singularisches „du“ und beschreibt Hochmut und Sturz in erhöhter Bildsprache. Eine genauere theologische Identifikation wäre eine Auslegung, die der Wortlaut hier nicht ausdrücklich entscheidet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Schärfe. Die Parallelität von „Schönheit“ und „Glanz“ sowie die Abfolge Hochmut–Verderben–Sturz–öffentliche Bloßstellung bleiben erhalten.
