source:
  edition: WLC
  text: לַ/שַּׁ֖חַת יֽוֹרִד֑וּ/ךָ וָ/מַ֛תָּה מְמוֹתֵ֥י חָלָ֖ל בְּ/לֵ֥ב יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/008.yaml
  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
translation:
  language: de
  text: Sie werden dich in die Grube hinabbringen[a], und du wirst den Tod eines Erschlagenen sterben[b] – im Herzen der Meere.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ins Grab“ oder „ins Verderben“; wörtlich: „in die Grube“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Tode eines Erschlagenen“; im Hebräischen eine Wendung für einen gewaltsamen Tod.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „inmitten der Meere“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשַּׁחַת
  choice: in die Grube
  rationale: שַׁחַת kann eine Grube, ein Grab oder das Verderben bezeichnen. Zusammen mit „hinabbringen“ bewahrt „Grube“ das konkrete Bild, ohne eine bestimmte Vorstellung vom Totenreich festzulegen.
- source_word: יוֹרִדוּךָ
  choice: sie werden dich hinabbringen
  rationale: 'Der Hifil von ירד mit Suffix der 2. Person maskulin Singular ist kausativ: Man bewirkt, dass der Angesprochene hinabgeht. „Hinabbringen“ gibt diese Bedeutung natürlich und ohne zusätzliche Gewaltvorstellung wieder.'
- source_word: וָמַתָּה
  choice: du wirst … sterben
  rationale: Die Form bezeichnet im prophetischen Zusammenhang die angekündigte Folge. Das moderne Futur gibt diese Vorhersage klar wieder.
- source_word: מְמוֹתֵי חָלָל
  choice: den Tod eines Erschlagenen sterben
  rationale: Der hebräische Plural „Tode“ ist hier idiomatisch beziehungsweise intensivierend. Die deutsche Wendung bewahrt das Bild eines gewaltsam Getöteten, ohne den unnatürlichen Plural wörtlich nachzubilden.
- source_word: חָלָל
  choice: eines Erschlagenen
  rationale: חָלָל bezeichnet gewöhnlich einen Erschlagenen oder tödlich Verwundeten. „Erschlagener“ ist in diesem Gerichtswort prägnant und angemessen.
- source_word: בְּלֵב יַמִּים
  choice: im Herzen der Meere
  rationale: לֵב bedeutet wörtlich „Herz“ und bezeichnet räumlich die Mitte. Die Formulierung erhält das eindrückliche maritime Bild; der Plural יַמִּים wird als „Meere“ bewahrt.
theological_decisions:
- issue: Ob שַׁחַת mit einem theologisch stärker festgelegten Begriff für die Unterwelt wiederzugeben ist
  choice: in die Grube
  alternative: ins Grab; in den Abgrund; ins Verderben
  rationale: Der Zusammenhang handelt von Gericht und Tod, doch שַׁחַת legt hier keine bestimmte Lehre über das Jenseits fest. „Grube“ bewahrt das Bild und die lexikalische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Wendung „im Herzen der Meere“ erhält das hebräische Bild und passt zum poetisch-prophetischen Zusammenhang. Der Gedankenstrich stellt die Ortsangabe heraus, ohne ihren Bezug zum Sterben aufzulösen.
