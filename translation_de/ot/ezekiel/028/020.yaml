base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/020.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] kam zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: kam
  rationale: In der festen prophetischen Formel ויהי דבר־יהוה אלי entspricht „kam“ natürlichem deutschem Sprachgebrauch und gibt den Vorgang treffender wieder als das wörtlichere „war“ oder „geschah“.
- source_word: דְבַר
  choice: das Wort
  rationale: דבר bezeichnet hier das prophetische Wort beziehungsweise die Botschaft Gottes. „Das Wort“ bewahrt die geläufige prophetische Formel und ihr theologisches Gewicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; dies ist die im Deutschen übliche wissenschaftliche Umschrift des Tetragramms und bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präpositionalverbindung bezeichnet Ezechiel als Empfänger des prophetischen Wortes; „zu mir“ ist die natürliche moderne deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet die unmittelbar folgende Gottesrede ein. Im modernen Deutschen gibt ein Doppelpunkt diese Funktion natürlicher wieder als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ erhält den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel bleibt erhalten; לֵאמֹר wird idiomatisch durch einen Doppelpunkt dargestellt, da die direkte Rede im nächsten Vers folgt.
