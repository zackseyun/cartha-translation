source:
  edition: WLC
  text: הִנֵּ֥ה חָכָ֛ם אַתָּ֖ה מ/דנאל כָּל סָת֖וּם לֹ֥א עֲמָמֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/003.yaml
  text: Look[a], you are wiser than Danel; no hidden thing is obscure to you.
translation:
  language: de
  text: Sieh, du bist weiser als Danel[a]; nichts Verborgenes ist dir unklar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Danel“; traditionell „Daniel“. Die Schreibung hier enthält nicht das Jod der geläufigeren Namensform; daher steht im Haupttext die hebräische Form.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Leitet eine nachdrückliche Feststellung ein und bewahrt in zeitgemäßer Form die hinweisende Kraft des Hebräischen.
- source_word: חָכָם ... מ/דנאל
  choice: weiser als Danel
  rationale: Das Adjektiv חָכָם ist durch die Präposition מִן vor dem Namen komparativ zu verstehen; im Deutschen ist „weiser als“ die natürliche Wiedergabe.
- source_word: דנאל
  choice: Danel
  rationale: Der Konsonantentext bietet דנאל ohne Jod und damit die Form „Danel“, nicht die geläufigere Form „Daniel“. Die abweichende traditionelle Wiedergabe wird in der Fußnote genannt.
- source_word: כָּל סָתוּם
  choice: nichts Verborgenes
  rationale: Die Wendung bezeichnet alles, was verschlossen oder verborgen ist. In Verbindung mit der Verneinung gibt „nichts Verborgenes“ den distributiven Sinn natürlich wieder.
- source_word: לֹא עֲמָמוּךָ
  choice: ist dir unklar
  rationale: Das seltene Verb bezeichnet wahrscheinlich Verdunkelung oder Unklarheit, nicht bloß ein Verbergen. „Ist dir unklar“ erhält den Unterschied zum vorausgehenden „Verborgenes“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ bewahrt den Nachdruck ohne das altertümlichere „Siehe“. Die knappe Parallelstruktur des hebräischen Satzes bleibt erhalten.
