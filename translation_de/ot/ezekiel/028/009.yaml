  text: הֶ/אָמֹ֤ר תֹּאמַר֙ אֱלֹהִ֣ים אָ֔נִי לִ/פְנֵ֖י הֹֽרְגֶ֑/ךָ וְ/אַתָּ֥ה אָדָ֛ם וְ/לֹא אֵ֖ל בְּ/יַ֥ד מְחַלְלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/009.yaml
  text: Will you still say[a], ‘I am a god,’ before the one who kills you? But you are a man, and not a god[c][b], in the hand of those who wound you.
translation:
  language: de
  text: 'Wirst du angesichts dessen, der dich tötet, wirklich noch sagen: »Ich bin ein Gott«?[a] Du aber bist ein Mensch und kein Gott in der Hand derer, die dich entweihen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Wirst du tatsächlich sagen?“ Die hebräische Verbindung eines Infinitivs mit der finiten Verbform verstärkt die Frage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die dich verwunden“ oder „durchbohren“. Das hebräische Wort kann im Zusammenhang auch eine gewaltsame Verletzung bezeichnen; „entweihen“ hebt die Erniedrigung dessen hervor, der sich für göttlich hielt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמֹר תֹּאמַר
  choice: wirklich noch sagen
  rationale: Die Verbindung des Infinitivus absolutus mit der finiten Verbform verstärkt die Frage. „Wirklich noch“ gibt sowohl den Nachdruck als auch den trotzigen Fortbestand der Behauptung im Zusammenhang natürlich wieder.
- source_word: אֱלֹהִים / אֵל
  choice: ein Gott / kein Gott
  rationale: Im Zusammenhang wird der Anspruch des Fürsten von Tyrus auf Göttlichkeit verspottet. Der unbestimmte Ausdruck bezeichnet hier die beanspruchte göttliche Stellung, ohne אֱלֹהִים als Eigennamen für den Gott Israels festzulegen.
- source_word: לִפְנֵי הֹרְגֶךָ
  choice: angesichts dessen, der dich tötet
  rationale: לִפְנֵי bezeichnet hier die unmittelbare Gegenwart beziehungsweise Konfrontation. „Angesichts“ ist im Deutschen idiomatisch und bewahrt zugleich die bedrohliche Szene; das Partizip wird aktiv wiedergegeben.
- source_word: אָדָם
  choice: ein Mensch
  rationale: Der Ausdruck stellt das Menschsein des Herrschers seiner behaupteten Göttlichkeit gegenüber. „Mensch“ ist im Deutschen sachlich, prägnant und schließt keine zusätzliche Deutung wie „Sterblicher“ ein.
- source_word: בְּיַד
  choice: in der Hand
  rationale: Die wörtliche Wendung ist auch im Deutschen verständlich und bewahrt das Bild davon, der Gewalt anderer ausgeliefert zu sein.
- source_word: מְחַלְלֶיךָ
  choice: die dich entweihen
  rationale: 'Das Piel-Partizip von חלל trägt die Bedeutung „entweihen, profanieren“. In diesem Zusammenhang unterstreicht es die demütigende Ironie: Wer sich für göttlich erklärt, wird wie etwas Entheiligtes behandelt.'
theological_decisions:
- issue: Der Anspruch des Herrschers auf Göttlichkeit
  choice: »Ich bin ein Gott« … „kein Gott“
  alternative: »Ich bin Gott« … „nicht Gott“
  rationale: Die Formulierung lässt den Herrscher Göttlichkeit für sich beanspruchen, identifiziert ihn aber nicht ausdrücklich mit dem Gott Israels. So bleibt der Gegensatz zwischen beanspruchter Gottheit und tatsächlichem Menschsein erhalten.
- issue: Bedeutung von מְחַלְלֶיךָ
  choice: die dich entweihen
  alternative: die dich verwunden / durchbohren
  rationale: Die Grundbedeutung im Piel ist „entweihen, profanieren“ und passt zur gezielten Erniedrigung dessen, der sich göttlichen Rang anmaßt. Die mögliche körperliche Gewaltnuance wird wegen des unmittelbaren Tötungskontexts in einer Fußnote genannt, aber nicht zur Hauptlesart gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Wendung „angesichts dessen, der dich tötet“ schafft eine natürliche deutsche Satzführung und erhält die zugespitzte rhetorische Frage. „Ein Mensch“ statt „ein Mann“ bringt den theologischen Gegensatz zwischen Menschsein und Gottheit genauer zum Ausdruck.
