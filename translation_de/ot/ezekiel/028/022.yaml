  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֤י עָלַ֨יִ/ךְ֙ צִיד֔וֹן וְ/נִכְבַּדְתִּ֖י בְּ/תוֹכֵ֑/ךְ וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בַּ/עֲשׂ֥וֹתִ/י בָ֛/הּ שְׁפָטִ֖ים וְ/נִקְדַּ֥שְׁתִּי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/022.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Sidon, and I will be glorified in your midst[b]. And they will know that I am Yahweh when I execute judgments in her and show myself holy in her.’'
translation:
  language: de
  text: 'und sage: »So spricht der Herr Yahweh: Siehe, ich bin gegen dich, Sidon! Ich werde in deiner Mitte verherrlicht werden.[a] Und sie werden erkennen, dass ich Yahweh bin, wenn ich in ihr Gerichte vollstrecke und mich in ihr als heilig erweise.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Ich werde in deiner Mitte zu Ehren kommen.« Das hebräische Verb kann sowohl Gottes Verherrlichung als auch das Sichtbarwerden seiner Herrlichkeit durch das Gericht betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: »in ihr geheiligt werden«; sinngemäß: »in ihr meine Heiligkeit sichtbar machen«. Gemeint ist, dass Yahwes Heiligkeit durch sein Gericht öffentlich erwiesen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet, beide unterschiedslos mit »HERR« zu übersetzen.
- source_word: הִנְנִי עָלַיִךְ
  choice: Siehe, ich bin gegen dich
  rationale: »Siehe« bewahrt den feierlichen prophetischen Nachdruck von הִנְנִי; עַל hat hier eindeutig feindlichen Sinn.
- source_word: וְנִכְבַּדְתִּי
  choice: Ich werde mich verherrlichen
  rationale: Der Nifal von כבד bezeichnet hier, dass Yahwe durch sein Gericht seine Herrlichkeit sichtbar macht beziehungsweise Ehre erlangt. Die reflexive deutsche Form ist natürlich und hält beide Aspekte zusammen.
- source_word: בְּתוֹכֵךְ
  choice: in deiner Mitte
  rationale: Die Form richtet sich im femininen Singular unmittelbar an die personifizierte Stadt Sidon.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: »Erkennen« entspricht der wiederkehrenden Erkenntnisformel im Ezechielbuch besser als ein bloß verstandesmäßiges »wissen«; »dann« bildet den Folgezusammenhang natürlich ab.
- source_word: בַּעֲשׂוֹתִי בָהּ שְׁפָטִים
  choice: wenn ich an ihr Strafgerichte vollstrecke
  rationale: Die Präposition בְּ am Infinitiv hat zeitlichen Sinn. שְׁפָטִים meint im Kontext konkrete richterliche Strafakte; »an ihr« nimmt die feminine Stadtmetapher auf.
- source_word: וְנִקְדַּשְׁתִּי בָהּ
  choice: mich an ihr als heilig erweise
  rationale: Der Nifal von קדש beschreibt hier nicht, dass Gott erst heilig gemacht wird, sondern dass seine Heiligkeit durch sein Handeln öffentlich sichtbar und bestätigt wird.
theological_decisions:
- issue: Wiedergabe der Formeln göttlicher Selbstverherrlichung und Heiligung
  choice: mich verherrlichen … mich als heilig erweisen
  alternative: zu Ehren kommen … an ihr geheiligt werden
  rationale: Die gewählte Formulierung bewahrt, dass Gottes Gericht sowohl seine Herrlichkeit als auch seine Heiligkeit offenbart, ohne die Nifalformen so wiederzugeben, als verliehen Menschen Gott erst Herrlichkeit oder Heiligkeit.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Die Transliteration gibt den im Ausgangstext stehenden persönlichen Gottesnamen wieder und unterscheidet ihn vom Titel אֲדֹנָי.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Nachdruck. Die direkte Anrede Sidons bleibt feminin; beim anschließenden Rückbezug wird entsprechend »ihr« verwendet. »Strafgerichte vollstrecken« verdeutlicht den gerichtlichen Kontext, ohne die Aussage konfessionell auszulegen.
