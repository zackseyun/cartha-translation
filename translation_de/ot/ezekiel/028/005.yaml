  text: בְּ/רֹ֧ב חָכְמָתְ/ךָ֛ בִּ/רְכֻלָּתְ/ךָ֖ הִרְבִּ֣יתָ חֵילֶ֑/ךָ וַ/יִּגְבַּ֥הּ לְבָבְ/ךָ֖ בְּ/חֵילֶֽ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/005.yaml
  text: By your great wisdom in your trade you increased your wealth[c][b][a], and your heart became proud because of your wealth.
translation:
  language: de
  text: Durch deine große Weisheit in deinem Handel[c] hast du dein Vermögen[a] vermehrt, und wegen deines Vermögens wurde dein Herz hochmütig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Reichtum“, „Ressourcen“ oder, je nach Zusammenhang, „Kraft“ beziehungsweise „Macht“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dein Herz wurde hoch“; ein Bild für Hochmut.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „durch deinen Handel“ oder „durch deinen Handelsverkehr“. Das hebräische Wort bezeichnet kaufmännische Tätigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב חָכְמָתְךָ
  choice: durch deine große Weisheit
  rationale: Die Präposition בְּ bezeichnet hier das Mittel oder den begleitenden Umstand; רֹב drückt Größe oder Fülle aus. Die Wiedergabe ist im Deutschen natürlich und bewahrt den Kern von חָכְמָה als „Weisheit“, ohne die mögliche Nuance kaufmännischen Geschicks festzuschreiben.
- source_word: בִּרְכֻלָּתְךָ
  choice: mit deinem Handel
  rationale: רְכֻלָּה bezeichnet besonders bei Ezechiel die Tätigkeit des Handelns beziehungsweise den Handelsverkehr. „Handel“ ist prägnant und passt zum wirtschaftlichen Kontext von Tyrus.
- source_word: הִרְבִּיתָ
  choice: hast du … vermehrt
  rationale: Der Hifil von רבה bedeutet hier, etwas zahlreicher oder größer zu machen. „Vermehrt“ verbindet sich idiomatisch mit „Vermögen“.
- source_word: חֵילֶךָ
  choice: dein Vermögen
  rationale: חַיִל kann Vermögen, Reichtum, Ressourcen, Kraft oder Macht bezeichnen. Im Handelskontext ist „Vermögen“ am wahrscheinlichsten; dieselbe Wiedergabe in beiden Vorkommen erhält den Zusammenhang.
- source_word: וַיִּגְבַּהּ לְבָבְךָ
  choice: dein Herz wurde hochmütig
  rationale: Wörtlich wird das Herz „hoch“. Die deutsche Formulierung gibt die Bedeutung des hebräischen Bildes verständlich wieder und bewahrt mit „Herz“ dessen anthropologische Ausdrucksweise.
- source_word: בְּחֵילֶךָ
  choice: wegen deines Vermögens
  rationale: Die Präposition בְּ bezeichnet hier wahrscheinlich den Anlass oder Grund des Hochmuts. „Wegen“ macht diese Beziehung in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Bedeutungsspektrum von חַיִל zwischen Vermögen und Kraft/Macht
  choice: Vermögen
  alternative: Reichtum, Ressourcen, Kraft oder Macht
  rationale: Der unmittelbare Zusammenhang handelt vom erfolgreichen Handel des Herrschers von Tyrus. „Vermögen“ entspricht diesem Kontext, während eine Fußnote das breitere Bedeutungsspektrum offenhält.
- issue: Wörtliche oder sinngemäße Wiedergabe des Bildes vom hohen Herzen
  choice: dein Herz wurde hochmütig
  alternative: dein Herz erhob sich / wurde hoch
  rationale: Die gewählte Fassung vermittelt die Bedeutung in modernem Deutsch, ohne das Herz als Sitz der inneren Haltung auszulassen; das wörtliche Bild bleibt in der Fußnote nachvollziehbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem Gedankengang des Hebräischen, bleibt aber flüssig. „Vermögen“ vermeidet die mögliche Verengung von „Reichtum“ auf Geld und lässt den wirtschaftlichen Ressourcencharakter anklingen.
