  text: וְ/שִׁלַּחְתִּי בָ֞/הּ דֶּ֤בֶר וָ/דָם֙ בְּ/ח֣וּצוֹתֶ֔י/הָ וְ/נִפְלַ֤ל חָלָל֙ בְּ/תוֹכָ֔/הּ בְּ/חֶ֥רֶב עָלֶ֖י/הָ מִ/סָּבִ֑יב וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/023.yaml
  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
translation:
  language: de
  text: Und ich werde die Pest über sie schicken und Blutvergießen[a] in ihren Straßen. Erschlagene werden in ihrer Mitte durch das Schwert fallen, das von allen Seiten gegen sie gerichtet ist. Dann werden sie erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Blut“. Gemeint ist wahrscheinlich gewaltsames Blutvergießen in der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Und ich werde … schicken
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht in der prophetischen Gerichtsankündigung für ein zukünftiges Handeln Gottes. „Schicken“ ist im Deutschen klar und idiomatisch.
- source_word: דֶּבֶר
  choice: Pest
  rationale: דֶּבֶר bezeichnet in prophetischen Gerichtstexten eine verheerende epidemische Krankheit. „Pest“ bewahrt den traditionellen, zugleich allgemein verständlichen Gerichtsklang.
- source_word: וָדָם
  choice: Blutvergießen
  rationale: Wörtlich steht „Blut“, doch im Zusammenhang bezeichnet das Wort gewaltsames Töten. „Blutvergießen“ gibt diesen metonymischen Sinn im Deutschen natürlich wieder; die wörtliche Form wird in der Fußnote genannt.
- source_word: בְּחוּצוֹתֶיהָ
  choice: auf ihre Straßen
  rationale: חוּצוֹת sind die Straßen beziehungsweise öffentlichen Plätze der Stadt. Wegen des regierenden Verbs „schicken“ drückt „auf ihre Straßen“ die gerichtete Bewegung natürlich aus.
- source_word: וְנִפְלַל חָלָל
  choice: Erschlagene werden … fallen
  rationale: Trotz der ungewöhnlichen Punktierung des Verbs bezeichnet חָלָל hier durch Gewalt oder Krieg Getötete. Die deutsche Wendung erhält das Bild des Fallens.
- source_word: בְּתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Die feste Ortsangabe bezeichnet das Innere der personifiziert weiblichen Stadt und wahrt den würdevollen prophetischen Ton.
- source_word: בְּחֶרֶב עָלֶיהָ מִסָּבִיב
  choice: wenn das Schwert von allen Seiten über sie kommt
  rationale: Die Formulierung verbindet das Mittel des Tötens mit dem Bild eines ringsum gegen die Stadt gerichteten Angriffs. Die temporale Fügung vermeidet im Deutschen die missverständliche Vorstellung, das Schwert liege räumlich um die Stadt herum.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Das וְ kann hier die Folge des angekündigten Gerichts ausdrücken. „Erkennen“ gibt das erfahrungsbezogene Wissen der Erkenntnisformel angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diese Eigenart, ohne ihn durch den Titel „Herr“ zu ersetzen.
- issue: Bezug des Gerichtshandelns und der abschließenden Erkenntnis
  choice: Gott sendet das Gericht; die Betroffenen erkennen dadurch, dass er Jahwe ist.
  alternative: Die Erkenntnisformel lediglich als abstrakte Gotteserkenntnis wiederzugeben.
  rationale: Der unmittelbare Zusammenhang stellt die Erkenntnis als Folge des vollzogenen Gerichts dar. Die Übersetzung lässt offen, ob „sie“ ausschließlich die Bewohner der Stadt oder einen weiteren Personenkreis bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ernst. Die Stadt wird entsprechend den femininen Suffixen als „sie“ personifiziert. „Blutvergießen“ ist im Haupttext natürlicher als das im Deutschen missverständliche „Blut schicken“; die konkrete hebräische Ausdrucksweise bleibt durch die Fußnote sichtbar.
