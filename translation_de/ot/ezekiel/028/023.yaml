revisions:
- from: Und ich werde die Pest über sie schicken und Blutvergießen auf ihre Straßen.[a] Erschlagene werden in ihrer Mitte fallen, wenn das Schwert von allen Seiten über sie kommt. Dann werden sie erkennen, dass ich Jahwe bin.
  to: Und ich werde die Pest über sie schicken und Blutvergießen[a] in ihren Straßen. Erschlagene werden in ihrer Mitte durch das Schwert fallen, das von allen Seiten gegen sie gerichtet ist. Dann werden sie erkennen, dass ich Jahwe bin.
  rationale: Die Revision beseitigt die nicht im Ausgangstext enthaltene temporale Einordnung und gibt die räumlich-feindliche Bestimmung „gegen sie ringsum“ mit einem natürlichen deutschen Relativsatz wieder. Die Fußnote wird an „Blutvergießen“ verankert und erläutert präzise die Abweichung von der konkreten hebräischen Formulierung „Blut“.
