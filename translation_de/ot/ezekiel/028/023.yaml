  - severity: low
    issue: Die Fußnotenmarke ist an die Straßenangabe statt unmittelbar an die interpretierende Wiedergabe „Blutvergießen“ gesetzt.
    rationale: Die Anmerkung erläutert וָדָם („Blut“) und die Entscheidung für „Blutvergießen“, nicht die Bedeutung von „Straßen“.
