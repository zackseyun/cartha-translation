  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Jahwe kündigt Pest, Blut bzw. Blutvergießen, durch das Schwert verursachte Erschlagene und die daraus folgende Erkenntnis an. Die temporale Wiedergabe „wenn das Schwert … kommt“ ist jedoch im Hebräischen nicht angelegt; עָלֶיהָ מִסָּבִיב beschreibt vielmehr das von allen Seiten gegen die Stadt gerichtete Schwert.'
  naturalness: „Blutvergießen auf ihre Straßen schicken“ ist im Deutschen weniger natürlich. Eine Umstellung zu „Blutvergießen in ihren Straßen“ ist idiomatischer, ohne den gerichtlichen Kontext zu verlieren. Die Relativsatzlösung für das ringsum gegen die Stadt gerichtete Schwert ist klar und bewahrt den Satzbezug.
  terminology: „Pest“, „Erschlagene“, „Schwert“ und „Jahwe“ sind angemessen. „Blutvergießen“ ist eine kontextuelle Auslegung von wörtlich „Blut“ und soll deshalb, wie bisher, mit einer Fußnote kenntlich gemacht werden.
