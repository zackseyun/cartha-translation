  text: מֵ/רֹ֣ב עֲוֺנֶ֗י/ךָ בְּ/עֶ֨וֶל֙ רְכֻלָּ֣תְ/ךָ֔ חִלַּ֖לְתָּ מִקְדָּשֶׁ֑י/ךָ וָֽ/אוֹצִא אֵ֤שׁ מִ/תּֽוֹכְ/ךָ֙ הִ֣יא אֲכָלַ֔תְ/ךָ וָ/אֶתֶּנְ/ךָ֤ לְ/אֵ֨פֶר֙ עַל הָ/אָ֔רֶץ לְ/עֵינֵ֖י כָּל רֹאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/018.yaml
  text: By the abundance of your iniquities[a], in the unrighteousness of your trade, you profaned your sanctuaries[c][b]; so I brought out fire from your midst—it consumed you—and I turned you to ashes on the earth in the sight of all who saw you.
translation:
  language: de
  text: Wegen deiner vielen Vergehen[a] und wegen des Unrechts in deinem Handel[b] hast du deine Heiligtümer[c] entweiht. Da brachte ich Feuer aus deiner Mitte hervor[d]; es verzehrte dich, und ich machte dich zu Asche auf der Erde vor den Augen aller, die dich sahen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann sowohl Vergehen als auch die daraus erwachsende Schuld bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deinem Handelsverkehr“. Gemeint ist die Handelstätigkeit im Zusammenhang von Tyrus.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich im Plural: „deine Heiligtümer“; der genaue Bezug dieser Heiligtümer ist umstritten.'
    reason: theological_ambiguity
  - marker: d
    text: 'Wörtlich: „Da brachte ich Feuer aus deiner Mitte hervor.“ Das Feuer kommt als Werkzeug des Gerichts aus der Mitte des Angeredeten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵרֹב עֲוֺנֶיךָ
  choice: wegen deiner vielen Vergehen
  rationale: מִן mit רֹב hat hier ursächliche Bedeutung. Die Wiedergabe drückt sowohl die große Zahl als auch das moralische Gewicht der עֲוֺנוֹת in natürlichem Deutsch aus.
- source_word: בְּעֶוֶל רְכֻלָּתְךָ
  choice: wegen des Unrechts in deinem Handel
  rationale: עֶוֶל bezeichnet Unrecht beziehungsweise Ungerechtigkeit; רְכֻלָּה meint im Zusammenhang von Hesekiel 27–28 den Handel. Die Formulierung wahrt den Zusammenhang zwischen dem Unrecht und der Handelstätigkeit.
- source_word: חִלַּלְתָּ מִקְדָּשֶׁיךָ
  choice: hast du deine Heiligtümer entweiht
  rationale: Das Piel von חלל bezeichnet die Entweihung von Heiligem. מִקְדָּשֶׁיךָ steht im Plural und wird deshalb nicht zu einem einzelnen Heiligtum vereinheitlicht.
- source_word: וָאוֹצִא אֵשׁ מִתּוֹכְךָ
  choice: Da ließ ich Feuer aus deiner Mitte hervorgehen
  rationale: Die Satzfolge stellt das Feuer als göttliches Gericht dar, das aus der Mitte des Angeredeten hervorkommt. „Da“ gibt den folgernden Fortgang wieder, ohne einen ausdrücklich markierten Kausalsatz einzuführen.
- source_word: הִיא אֲכָלַתְךָ
  choice: es verzehrte dich
  rationale: Das feminine Pronomen bezieht sich auf das im Hebräischen feminine אֵשׁ. Im Deutschen verlangt „Feuer“ das sachliche Pronomen „es“; „verzehren“ bewahrt die Bildkraft.
- source_word: וָאֶתֶּנְךָ לְאֵפֶר
  choice: Ich machte dich zu Asche
  rationale: Die wörtliche Konstruktion „ich gab dich zu Asche“ bezeichnet das Ergebnis des Gerichts. „Ich machte dich zu Asche“ ist verständliches Deutsch und bleibt eng an der resultativen Aussage.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann Erde, Land oder Erdboden bedeuten. „Auf der Erde“ bewahrt die Weite des Ausdrucks und das Bild der öffentlich sichtbaren Erniedrigung.
- source_word: לְעֵינֵי כָּל רֹאֶיךָ
  choice: vor den Augen aller, die dich sahen
  rationale: Die idiomatische Wendung betont, dass das Gericht öffentlich und für alle Betrachter sichtbar geschieht.
theological_decisions:
- issue: Bezug der pluralischen „Heiligtümer“ in der Klage über den Herrscher von Tyrus
  choice: Der kultische Plural „deine Heiligtümer“ bleibt stehen, ohne seinen Bezug näher festzulegen.
  alternative: Den Ausdruck als königliche Würde, als Heiligtümer der Stadt Tyrus oder als Hinweis auf einen übermenschlichen beziehungsweise himmlischen Bezug auszudeuten.
  rationale: Der hebräische Wortlaut ist pluralisch und kultisch, legt aber die weitergehende Deutung innerhalb dieses Verses nicht eindeutig fest. Die Übersetzung soll diese Spannung nicht zugunsten einer bestimmten theologischen Lesart auflösen.
- issue: Ursprung des Gerichtsfeuers
  choice: Das Feuer geht auf Gottes Veranlassung aus der Mitte des Angeredeten hervor.
  alternative: Das Feuer lediglich als inneren, selbsttätigen Vorgang oder allgemein als von außen kommendes göttliches Gericht wiederzugeben.
  rationale: Der hebräische Text nennt sowohl Gott als handelndes Subjekt als auch die Mitte des Angeredeten als Ausgangspunkt des Feuers. Beides wird beibehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Fortgang, wird aber für gute Verständlichkeit in drei Hauptsätze gegliedert. Kultische und gerichtliche Bildsprache wird nicht abgeschwächt.
