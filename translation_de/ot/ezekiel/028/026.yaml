base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/026.yaml
  text: They will dwell on it securely, and they will build houses and plant vineyards. They will dwell securely when I execute judgments on all those who treat them with contempt all around them. Then they will know that I am the LORD their God.
translation:
  language: de
  text: Sie werden sicher darin wohnen, Häuser bauen und Weinberge pflanzen. Sie werden sicher wohnen, wenn ich an allen, die sie umgeben und verachten, Strafgerichte vollstrecke. Dann werden sie erkennen, dass ich der HERR, ihr Gott, bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשְׁבוּ עָלֶיהָ לָבֶטַח
  choice: Sie werden sicher darin wohnen
  rationale: עָלֶיהָ bezieht sich im Kontext auf das Land; „darin“ klingt im Deutschen natürlich und bewahrt den Rückbezug. לָבֶטַח bezeichnet ein Wohnen in Sicherheit.
- source_word: בַּעֲשׂוֹתִי שְׁפָטִים
  choice: wenn ich ... meine Strafgerichte vollstrecke
  rationale: Die Konstruktion bezeichnet den Zeitpunkt beziehungsweise Umstand, unter dem Gott Gerichtshandlungen ausführt. „Strafgerichte“ gibt den gerichtlichen, hier negativen Sinn von שְׁפָטִים im Kontext wieder.
- source_word: הַשָּׁאטִים אֹתָם
  choice: die sie verachten
  rationale: Das Partizip bezeichnet feindselige Geringschätzung oder Verachtung; „verachten“ ist klar, würdig und semantisch passend.
- source_word: מִסְּבִיבוֹתָם
  choice: rings um sie her
  rationale: Die räumliche Wendung betont die sie umgebenden Völker beziehungsweise Gegner und wird idiomatisch wiedergegeben.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird beibehalten.
theological_decisions:
- issue: Verhältnis zwischen sicherem Wohnen und Gottes Gerichten
  choice: „wenn ich ... meine Strafgerichte vollstrecke“
  alternative: „dadurch, dass ich ... Gerichte vollstrecke“
  rationale: Die hebräische ב-Konstruktion kann zeitlich oder umständlich verstanden werden. „Wenn“ wahrt den zeitlichen Zusammenhang, ohne eine weitergehende kausale Deutung festzulegen.
- issue: Gegenstand der Gerichte
  choice: „an allen rings um sie her, die sie verachten“
  alternative: „an allen, die sie ringsum verachten“
  rationale: Die gewählte Stellung macht deutlich, dass „rings um sie her“ die feindlichen Menschen beziehungsweise Völker lokalisiert und nicht die Art des Verachtens beschreibt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholung von „sicher wohnen“ folgt bewusst dem hebräischen Text. Keine Fußnoten erforderlich.
