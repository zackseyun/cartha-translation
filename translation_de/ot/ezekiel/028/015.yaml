source:
  edition: WLC
  text: תָּמִ֤ים אַתָּה֙ בִּ/דְרָכֶ֔י/ךָ מִ/יּ֖וֹם הִבָּֽרְאָ֑/ךְ עַד נִמְצָ֥א עַוְלָ֖תָ/ה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/015.yaml
  text: You were blameless in your ways from the day you were created[a], until unrighteousness was found in you.
translation:
  language: de
  text: Du warst untadelig in deinen Wegen von dem Tag an, an dem du erschaffen wurdest,[a] bis Unrecht in dir gefunden wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vollkommen in deinen Wegen«. Das hebräische Wort kann Vollständigkeit oder Integrität bezeichnen; hier passt »untadelig« zum moralischen Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: untadelig
  rationale: Das Wort bezeichnet hier im Zusammenhang mit den »Wegen«, also dem Lebenswandel, moralische Unbescholtenheit oder Integrität, nicht zwingend absolute Vollkommenheit.
- source_word: בִּדְרָכֶיךָ
  choice: in deinen Wegen
  rationale: Die Wiedergabe bewahrt das hebräische Bild und ist als gehobene, in prophetischer Sprache verständliche Bezeichnung für den Lebenswandel natürlich.
- source_word: מִיּוֹם הִבָּרְאָךְ
  choice: von dem Tag an, an dem du erschaffen wurdest
  rationale: Die Form bezeichnet das Erschaffenwerden des Angesprochenen; die deutsche Konstruktion gibt den zeitlichen Ausgangspunkt klar wieder.
- source_word: עַד
  choice: bis
  rationale: Die übliche temporale Wiedergabe markiert den Endpunkt des zuvor beschriebenen Zustands.
- source_word: נִמְצָא
  choice: gefunden wurde
  rationale: Die passive Form bleibt erhalten und lässt offen, ob das Unrecht entstand, hervortrat oder entdeckt wurde.
- source_word: עַוְלָתָה
  choice: Unrecht
  rationale: Der Ausdruck umfasst moralisches Unrecht, Verkehrtheit und Ungerechtigkeit. »Unrecht« ist im modernen Deutsch verständlich und legt den Sinn nicht einseitig auf soziale Ungerechtigkeit fest.
- source_word: בָּךְ
  choice: an dir
  rationale: Bei »Unrecht wurde gefunden« ist »an dir« im Deutschen idiomatischer als »in dir«, ohne festzulegen, ob inneres Wesen oder festgestelltes Verhalten gemeint ist.
theological_decisions:
- issue: Mögliche Überdehnung von תָּמִים zu absoluter Vollkommenheit in einer theologisch stark gedeuteten Passage
  choice: untadelig
  alternative: vollkommen
  rationale: »Untadelig« entspricht dem moralischen Zusammenhang der Wege und vermeidet eine ontologische Aussage, die der hebräische Ausdruck hier nicht notwendig verlangt.
- issue: Deutung des gefundenen Unrechts als Entstehung oder bloße Aufdeckung
  choice: bis Unrecht an dir gefunden wurde
  alternative: bis Unrecht in dir entstand
  rationale: Die passive Form נִמְצָא wird formal bewahrt; dadurch bleibt die echte Mehrdeutigkeit zwischen Auftreten und Entdeckung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Bild »in deinen Wegen«. Die Satzstellung folgt dem Hebräischen eng, bleibt aber gut verständlich.
