  text: מוֹתֵ֧י עֲרֵלִ֛ים תָּמ֖וּת בְּ/יַד זָרִ֑ים כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/010.yaml
  text: You will die the death of the uncircumcised by the hand of foreigners[a], for I have spoken, declares the Lord GOD.
translation:
  language: de
  text: Den Tod der Unbeschnittenen wirst du durch die Hand Fremder sterben[a]; denn ich habe gesprochen – Ausspruch des Herrn Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tode von Unbeschnittenen wirst du sterben“; die Wendung bezeichnet einen Tod wie den der Unbeschnittenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹתֵי עֲרֵלִים תָּמוּת
  choice: Den Tod von Unbeschnittenen wirst du ... sterben
  rationale: Die Verbindung aus dem konstruierten Plural מוֹתֵי und dem Verb תָּמוּת bezeichnet nachdrücklich die Art des Todes. Die bewusst markante deutsche Form bewahrt das hebräische Wortspiel, während die Fußnote den Sinn erläutert.
- source_word: עֲרֵלִים
  choice: Unbeschnittenen
  rationale: Die substantivische Wiedergabe erhält die bundestheologische und beschämende Konnotation des hebräischen Ausdrucks.
- source_word: בְּיַד זָרִים
  choice: durch die Hand von Fremden
  rationale: Die Wendung bezeichnet die handelnde Gewalt beziehungsweise Urheberschaft. Die bildhafte Rede von der Hand bleibt erhalten; זָרִים meint hier Menschen aus fremden Völkern.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: denn ich habe gesprochen
  rationale: כִּי begründet die Gewissheit des angekündigten Gerichts; das Perfekt wird mit seiner abgeschlossenen, verbindlichen Aussagekraft wiedergegeben.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Substantiv bezeichnet die feierliche prophetische Gottesrede. „Ausspruch“ bildet die nominale Formel genauer ab als ein bloßes redeeinleitendes Verb.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: אֲדֹנָי wird als Titel „der Herr“ und das Tetragramm als Eigenname „Yahweh“ wiedergegeben; so werden Titel und Gottesname unterschieden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR / der Herr, HERR
  rationale: Die Wiedergabe wahrt sowohl den Herrschaftstitel אֲדֹנָי als auch den offenbarten Eigennamen יהוה und vermeidet eine Verdoppelung von „Herr“.
- issue: Bedeutung von „Unbeschnittenen“
  choice: Die wertende, schmachvolle Bezeichnung bleibt unaufgelöst stehen.
  alternative: Menschen ohne Bund / Heiden
  rationale: Der Ausgangstext nennt ausdrücklich die Unbeschnittenen. Eine erklärende Deutung als „Heiden“ oder „Menschen ohne Bund“ würde die körperliche und zugleich soziale beziehungsweise bundestheologische Spannung vorschnell festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter prophetischer Härte. Die ungewöhnliche Verbindung „den Tod ... sterben“ spiegelt die Ausdrucksweise des Hebräischen; die Fußnote erschließt die idiomatische Bedeutung.
