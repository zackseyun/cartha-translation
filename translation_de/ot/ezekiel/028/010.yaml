  - severity: low
    issue: Die Fußnote erklärt den Tod als ausdrücklich „schmachvoll“
    rationale: Der Kontext und die Bezeichnung „Unbeschnittene“ können eine Schmachkonnotation tragen, doch die Todesidiomatik selbst sagt primär „ein Tod wie der der Unbeschnittenen“. Die Erläuterung sollte diese Deutung nicht unnötig verabsolutieren.
