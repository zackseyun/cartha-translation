  verdict: revise
  source_fidelity: Die Übersetzung gibt die Anrede, die Todesformel, die Tötung durch Fremde, die Begründung und die Gottesformel grundsätzlich zutreffend wieder. „Der Herr Yahweh“ entspricht אֲדֹנָי יְהוִה und folgt der angegebenen Namenskonvention. Die Pluralform מוֹתֵי ist als hebräische idiomatische Verstärkung in einer Fußnote angemessen erläutert.
  naturalness: „Durch die Hand von Fremden“ ist verständlich, aber schwerfällig. „Durch die Hand Fremder“ ist die idiomatischere, zugleich bildhafte deutsche Entsprechung. Die Stellung der Präpositionalphrase nach dem Verb erhält die markante Todesformel und verbessert den Satzfluss.
  terminology: „Unbeschnittenen“ bewahrt den substantivischen und wertenden Ausdruck, ohne ihn durch „Heiden“ zu verengen. „Fremde“ gibt זָרִים im Gerichtskontext angemessen wieder. Die Fußnote sollte die idiomatische Aussage erklären, aber „schmachvoll“ nicht als ausdrücklich im Wortlaut enthaltene Bedeutung festschreiben.
