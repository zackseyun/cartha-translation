source:
  edition: WLC
  text: בֶּן אָדָ֡ם אֱמֹר֩ לִ/נְגִ֨יד צֹ֜ר כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן גָּבַ֤הּ לִבְּ/ךָ֙ וַ/תֹּ֨אמֶר֙ אֵ֣ל אָ֔נִי מוֹשַׁ֧ב אֱלֹהִ֛ים יָשַׁ֖בְתִּי בְּ/לֵ֣ב יַמִּ֑ים וְ/אַתָּ֤ה אָדָם֙ וְֽ/לֹא אֵ֔ל וַ/תִּתֵּ֥ן לִבְּ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/002.yaml
  text: 'Son of man[a], say to the prince of Tyre, ‘Thus says the Lord GOD: Because your heart is proud, and you say, “I am a god; I sit in the seat of gods in the heart of the seas,” yet you are a man and not a god[b], though you set your heart like the heart of gods.”'
translation:
  language: de
  text: 'Menschensohn, sag zum Fürsten von Tyrus: »So spricht GOTT, der Herr: Weil dein Herz hochmütig geworden ist und du sagst: ›Ich bin ein Gott; auf dem Sitz der Götter sitze ich im Herzen der Meere‹[a], obwohl du doch ein Mensch bist und kein Gott, und du dein Herz dem Herzen der Götter gleichstellst[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin Gott; auf Gottes Sitz sitze ich im Herzen der Meere.« Die hebräischen Wörter אֵל und אֱלֹהִים können hier auch singularisch verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »du dein Herz dem Herzen Gottes gleichstellst«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die vertraute prophetische Anrede in Hesekiel bewahrt die hebräische Einzahl und den Gegensatz zwischen dem menschlichen Propheten und göttlicher Majestät.
- source_word: לִנְגִיד צֹר
  choice: zum Fürsten von Tyrus
  rationale: נָגִיד bezeichnet einen Führenden oder Herrscher. „Fürst“ wahrt die Unterscheidung von מֶלֶךְ („König“) und passt zum gehobenen prophetischen Sprachgebrauch.
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die im Deutschen geläufige Wiedergabe vermeidet das schwer verständliche „Herr HERR“; „GOTT“ vertritt dabei den Gottesnamen JHWH, „der Herr“ den Titel אֲדֹנָי.
- source_word: יַעַן גָּבַהּ לִבְּךָ
  choice: Weil dein Herz hochmütig geworden ist
  rationale: Das wörtlich „hoch gewordene“ Herz bezeichnet hier stolze Selbstüberhebung. Die Formulierung erhält das Herzmotiv und gibt den kausalen Sinn von יַעַן klar wieder.
- source_word: אֵל אָנִי
  choice: Ich bin ein Gott
  rationale: אֵל kann einen Gott allgemein bezeichnen. Im Zusammenhang beansprucht der heidnische Herrscher göttlichen Rang; die mögliche bestimmte Lesart „Gott“ bleibt in der Fußnote erhalten.
- source_word: מוֹשַׁב אֱלֹהִים
  choice: auf einem Göttersitz
  rationale: מוֹשָׁב kann Sitz, Wohnsitz oder Ort des Sitzens bedeuten. „Göttersitz“ bewahrt knapp das Bild eines göttlichen Sitzes oder Bereichs; die grammatisch mögliche singularische Deutung von אֱלֹהִים wird angemerkt.
- source_word: בְּלֵב יַמִּים
  choice: im Herzen der Meere
  rationale: Die bildhafte Rede vom „Herzen“ der Meere wird formal bewahrt und ist im Deutschen verständlich.
- source_word: וְאַתָּה אָדָם וְלֹא אֵל
  choice: obwohl du doch ein Mensch bist und kein Gott
  rationale: אָדָם hebt die wirkliche Menschlichkeit des männlichen Herrschers im Gegensatz zu seinem Anspruch auf Göttlichkeit hervor. „obwohl“ macht den konzessiven Zusammenhang natürlich deutlich.
- source_word: וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים
  choice: und weil du dein Herz dem Herzen der Götter gleichstellst
  rationale: Die Formulierung bewahrt das wiederholte „Herz“ und drückt die selbstüberhöhende innere Einschätzung aus. Das zweite „weil“ führt den begonnenen Kausalsatz nach der eingeschobenen Gegenüberstellung verständlich fort.
theological_decisions:
- issue: Ob אֵל und אֱלֹהִים im Anspruch des Herrschers den einen Gott oder Göttlichkeit beziehungsweise Götter bezeichnen
  choice: Im Haupttext stehen „ein Gott“, „Göttersitz“ und „Götter“.
  alternative: „Ich bin Gott; auf Gottes Sitz sitze ich …“ sowie „dem Herzen Gottes“.
  rationale: Der Zusammenhang beschreibt die Selbstvergöttlichung eines heidnischen Herrschers und erlaubt eine allgemeine beziehungsweise pluralische Deutung. Da אֱלֹהִים jedoch auch singularisch gebraucht werden kann, wird die theologisch schärfere singularische Lesart nicht ausgeschlossen, sondern in Fußnoten dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener prophetischer Bildsprache. „Menschensohn“ und „Herz der Meere“ bewahren zentrale hebräische Wendungen. Die Auslassungspunkte am Versende zeigen an, dass der mit „Weil“ eröffnete göttliche Ausspruch syntaktisch im folgenden Vers weitergeführt wird.
