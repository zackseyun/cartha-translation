  source_fidelity: 'Der Entwurf gibt die wesentlichen hebräischen Elemente treffend wieder: die Anrede „Menschensohn“, den „Fürsten von Tyrus“, die Selbstvergöttlichung, den Kontrast Mensch/Gott und die Ambiguität von אֵל/אֱלֹהִים. Die Auslassungspunkte sind jedoch nicht quellengemäß: Der Vers ist als vollständige Redeeinheit übersetzbar; die Begründungsstruktur muss nicht künstlich als im Folgevers unvollständig markiert werden. Außerdem fügt „und weil“ am Schluss eine zweite explizite Kausalmarkierung hinzu, die im Hebräischen nicht steht.'
