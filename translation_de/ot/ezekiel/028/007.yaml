source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא עָלֶ֨י/ךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל יְפִ֣י חָכְמָתֶ֔/ךָ וְ/חִלְּל֖וּ יִפְעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/007.yaml
  text: Therefore[a], behold, I am bringing strangers against you, the most ruthless of the nations; they will draw their swords against the beauty of your wisdom[c][b], and they will defile your splendor.
translation:
  language: de
  text: 'Darum: Siehe, ich bringe Fremde[a] über dich, die Gewalttätigen unter den Völkern. Sie werden ihre Schwerter ziehen[b] gegen die Schönheit deiner Weisheit und deinen Glanz entweihen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ausländer.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: Sie werden ihre Schwerter leeren; gemeint ist das Ziehen der Schwerter aus der Scheide.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: schänden; auch: entheiligen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Gerichtswort knapp und natürlich wieder.
- source_word: הִנְנִי מֵבִיא עָלֶיךָ
  choice: Siehe, ich bringe ... über dich
  rationale: Bewahrt die feierliche prophetische Ankündigungsformel und die anschaulich-unmittelbare Wirkung des Partizips.
- source_word: זָרִים
  choice: Fremde
  rationale: Entspricht der Grundbedeutung von זָרִים; im Zusammenhang sind fremde Völker beziehungsweise Ausländer gemeint.
- source_word: עָרִיצֵי גּוֹיִם
  choice: die Gewalttätigsten unter den Völkern
  rationale: עָרִיץ bezeichnet rücksichtslose, gewalttätige oder furchterregende Menschen. Die deutsche Formulierung gibt die hervorhebende Kraft der Konstruktverbindung idiomatisch wieder.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם
  choice: Sie werden ihre Schwerter ziehen
  rationale: Das wörtliche 'leeren' bezeichnet bei Schwertern idiomatisch das Ziehen aus der Scheide.
- source_word: עַל יְפִי חָכְמָתֶךָ
  choice: gegen die Schönheit deiner Weisheit
  rationale: 'Bewahrt die poetische Genitivverbindung und ihre bewusste Spannung: Gerade die gerühmte Weisheit des Angeredeten wird zum Ziel des Angriffs.'
- source_word: וְחִלְּלוּ יִפְעָתֶךָ
  choice: und deinen Glanz entweihen
  rationale: חלל im Piel bezeichnet Profanierung beziehungsweise Entehrung; יִפְעָה meint leuchtenden Glanz oder Pracht. 'Entweihen' erhält die starke sakral gefärbte Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Bezug und Ton des Gerichtswortes gegen den Herrscher von Tyrus
  choice: Der Vers wird als unmittelbare prophetische Gerichtsankündigung gegen den angesprochenen Herrscher übersetzt, ohne eine spätere Identifikation in den Wortlaut einzutragen.
  alternative: Die Sprache im Haupttext ausdrücklich auf den Fall einer kosmischen oder satanischen Gestalt beziehen.
  rationale: Der Vers selbst nennt fremde Angreifer, Schwerter, Weisheit und Glanz. Eine mögliche typologische Deutung darf diese historische und literarische Ebene nicht in der Übersetzung verdrängen.
- issue: Sakrale Färbung von וְחִלְּלוּ
  choice: '''entweihen'''
  alternative: '''schänden'' oder ''entehren'''
  rationale: Die stärkere Wiedergabe wahrt die theologische Spannung des Verbs חלל, obwohl das Objekt hier der Glanz des Herrschers und kein ausdrücklich benannter heiliger Gegenstand ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel „Siehe“. Die poetischen Ausdrücke „Schönheit deiner Weisheit“ und „deinen Glanz entweihen“ bleiben erhalten, ohne die Aussage konfessionell oder typologisch zu vereindeutigen.
