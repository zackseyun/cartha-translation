source:
  edition: WLC
  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
translation:
  language: de
  text: 'Du Mensch, stimme ein Klagelied über den König von Tyrus an und sag zu ihm: »So spricht der Herr Jahwe: Du warst[a] das Siegel der Vollkommenheit[b], voller Weisheit und vollkommen an Schönheit.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du bist«. Im Hebräischen steht hier kein ausdrückliches Verb; die Zeitform ergibt sich aus dem Zusammenhang.'
    reason: alternative_reading
  - marker: b
    text: 'Die hebräische Wendung ist schwierig. Wörtlich steht etwa: »Siegel eines Musters/einer Gestalt«; אפשר sind auch Deutungen wie »Siegel der Vollständigkeit«, »Siegelring der Vollkommenheit« oder »der ein Muster besiegelt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Du Mensch
  rationale: Die feste Anrede an Ezechiel bezeichnet ihn als Menschen. „Du Mensch“ gibt ihre Funktion in verständlichem, heutigem Deutsch wieder, ohne die im Deutschen christologisch aufgeladene Form „Menschensohn“ einzutragen.
- source_word: שָׂא קִינָה
  choice: stimme ein Klagelied an
  rationale: Die hebräische Wendung bedeutet, ein Klagelied zu erheben beziehungsweise vorzutragen. Die gewählte Form ist im Deutschen natürlich und bewahrt den poetischen Charakter.
- source_word: עַל מֶלֶךְ צֹר
  choice: über den König von Tyrus
  rationale: עַל bezeichnet hier den Gegenstand des Klagelieds; „über“ entspricht dem deutschen Sprachgebrauch. Tyrus ist die etablierte deutsche Namensform.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht der Herr Jahwe
  rationale: Die Wiedergabe unterscheidet den Herrentitel אֲדֹנָי vom Gottesnamen יהוה und vermeidet die missverständliche Verdoppelung „Herr HERR“.
- source_word: אַתָּה חוֹתֵם תָּכְנִית
  choice: Du warst das Siegel der Vollkommenheit
  rationale: Der nominale hebräische Satz enthält kein ausdrückliches Verb. Der Rückblick des Klagelieds legt die Vergangenheit nahe. חוֹתֵם und תָּכְנִית sind lexikalisch schwierig; die Hauptfassung versteht die Wendung als Bild für vollendete Vollkommenheit, während die Fußnote engere Alternativen offenhält.
- source_word: מָלֵא חָכְמָה
  choice: erfüllt von Weisheit
  rationale: Dies ist eine direkte, idiomatische Wiedergabe, die zum gehobenen Ton des Klagelieds passt.
- source_word: וּכְלִיל יֹפִי
  choice: und vollkommen an Schönheit
  rationale: כְלִיל bezeichnet Ganzheit oder Vollständigkeit. „Vollkommen an Schönheit“ wahrt die parallele, poetische Aussage, ohne sie auf bloße Fülle abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה nach אֲדֹנָי
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: „Jahwe“ erhält den Gottesnamen als Namen und lässt zugleich den vorangehenden Titel „Herr“ erkennen. Die Alternative folgt einer verbreiteten deutschen Bibelkonvention, ersetzt den Namen jedoch typografisch durch einen Titel.
- issue: Zeitbezug der nominalen Aussage אַתָּה חוֹתֵם תָּכְנִית
  choice: Du warst
  alternative: Du bist
  rationale: Der unmittelbare hebräische Satz markiert keine Zeitform. Die Vergangenheit entspricht dem Charakter des Klagelieds und dem Rückblick auf verlorene Größe; die Gegenwartslesart bleibt in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Ton. Die Anrede ist bewusst verständlich gehalten; die schwer deutbare Bildsprache der Schlussaussage wird nicht stillschweigend vereindeutigt, sondern durch Fußnoten offengehalten.
