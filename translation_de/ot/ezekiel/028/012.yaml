revisions:
- from: 'Du Mensch, stimme ein Klagelied über den König von Tyrus an und sag zu ihm: »So spricht der Herr Jahwe: Du warst[a] das Siegel der Vollkommenheit[b], erfüllt von Weisheit und vollkommen an Schönheit.«'
  to: 'Du Mensch, stimme ein Klagelied über den König von Tyrus an und sag zu ihm: »So spricht der Herr Jahwe: Du warst[a] das Siegel der Vollkommenheit[b], voller Weisheit und vollkommen an Schönheit.«'
  rationale: Die Hauptübersetzung bleibt erhalten, da sie die Bildsprache verständlich und poetisch wiedergibt. Die Fußnote wird korrigiert, damit die umstrittene hebräische Wendung nicht fälschlich als eindeutig oder als wörtlich mit „Vollkommenheit“ bestimmt wird. „Erfüllt von Weisheit“ wird durch die nähere und stilistisch knappere Wiedergabe „voller Weisheit“ ersetzt.
  reviewer_model: gpt-5.6-terra
