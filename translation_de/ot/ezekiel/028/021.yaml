  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ אֶל צִיד֑וֹן וְ/הִנָּבֵ֖א עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/021.yaml
  text: Son of man[a], set your face toward Sidon, and prophesy against her.
translation:
  language: de
  text: Menschensohn[a], richte dein Gesicht auf Sidon und weissage gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Menschenkind“ oder „Sterblicher“. Hebräisch „Menschensohn“, eine häufige Anrede für Ezechiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die wiederkehrende hebräische Anrede an Ezechiel und ihre literarische Einheitlichkeit. Im Kontext bezeichnet sie Ezechiel als Menschen und ist hier kein christologischer Titel; die Fußnote nennt idiomatischere Alternativen.
- source_word: שִׂים פָּנֶיךָ
  choice: richte dein Gesicht
  rationale: Gibt das konkrete hebräische Bild und die prophetische Wendung verständlich wieder. „Richte“ drückt die beabsichtigte Ausrichtung natürlicher aus als ein rein wörtliches „setze“.
- source_word: אֶל
  choice: auf
  rationale: Markiert bei „das Gesicht richten“ zunächst die Ausrichtung auf Sidon, ohne bereits in dieser Präpositionalphrase den feindlichen Sinn von „gegen“ vorwegzunehmen.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: וְהִנָּבֵא
  choice: und weissage
  rationale: Direkte und im prophetischen Kontext geläufige Wiedergabe des Niphal-Imperativs von נבא.
- source_word: עָלֶיהָ
  choice: gegen die Stadt
  rationale: על hat mit „weissagen“ im vorliegenden Gerichtskontext adversative Bedeutung. Die Wiederaufnahme als „die Stadt“ vermeidet das grammatisch irritierende feminine Pronomen für das im Deutschen sächliche „Sidon“ und erhält zugleich den Bezug eindeutig.
theological_decisions:
- issue: Bedeutung der Anrede בֶּן אָדָם im Ezechielbuch
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: Die traditionelle Form wahrt die auffällige, wiederholte hebräische Anrede. Eine Fußnote stellt klar, dass sie hier Ezechiels Menschlichkeit hervorhebt und nicht als messianischer Titel zu lesen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache der prophetischen Beauftragung bleibt erhalten; „gegen die Stadt“ sorgt bei natürlichem deutschen Genusgebrauch für einen eindeutigen Rückbezug.
