reference: Ezekiel 28:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/רֹ֣ב רְכֻלָּתְ/ךָ֗ מָל֧וּ תוֹכְ/ךָ֛ חָמָ֖ס וַֽ/תֶּחֱטָ֑א וָ/אֶחַלֶּלְ/ךָ֩ מֵ/הַ֨ר אֱלֹהִ֤ים וָֽ/אַבֶּדְ/ךָ֙ כְּר֣וּב הַ/סֹּכֵ֔ךְ מִ/תּ֖וֹךְ אַבְנֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/016.yaml
  text: By the abundance of your trade[a], your midst was filled with violence, and you sinned; so I cast you as profane from the mountain of God, and I destroyed you, O guardian cherub[c][b], from the midst of the stones of fire.
translation:
  language: de
  text: Durch die Fülle deines Handels[a] wurde dein Inneres mit Gewalt erfüllt[b], und du sündigtest. Darum verstieß ich dich als entweiht[c] vom Berg Gottes und vernichtete dich, du schirmender Kerub[d], aus der Mitte der Feuersteine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „deines Handelsverkehrs“ oder „deiner Handelstätigkeit“; das hebräische Wort kann auch das Umherziehen mit Handelswaren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „füllten sie dein Inneres mit Gewalt“. Das hebräische Verb steht im Plural, doch ein handelndes Subjekt wird nicht ausdrücklich genannt.'
    reason: textual_grammar
  - marker: c
    text: 'Auch: „entweihte ich dich und entfernte dich vom Berg Gottes“. Das hebräische Verb bedeutet „entweihen, als unheilig behandeln“ und bezeichnet hier wahrscheinlich zugleich den Ausschluss aus dem heiligen Bereich.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „bedeckender“ oder „überschattender Kerub“. Das hebräische Partizip bezeichnet ein Bedecken, Überschatten oder schützendes Schirmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב רְכֻלָּתְךָ
  choice: Durch die Fülle deines Handels
  rationale: Die Präposition בְּ kann hier einen ursächlichen oder mittelbaren Zusammenhang ausdrücken. „Durch die Fülle“ gibt diesen Zusammenhang natürlich wieder; „Handel“ wahrt die wirtschaftliche Bedeutung von רְכֻלָּה, ohne die möglicherweise zu enge Vorstellung illegalen Menschen- oder Warenhandels einzutragen.
- source_word: מָל֧וּ תוֹכְךָ חָמָס
  choice: wurde dein Inneres mit Gewalt erfüllt
  rationale: Die resultative deutsche Passivform vermeidet ein im Hebräischen nicht genanntes Subjekt des morphologisch pluralischen Verbs מָלְאוּ und bewahrt zugleich תּוֹךְ als Bild für das Innere. Die formale Abweichung wird in einer Fußnote kenntlich gemacht.
- source_word: חָמָס
  choice: Gewalt
  rationale: „Gewalt“ ist die direkte und geläufige Wiedergabe; das Wort kann im Kontext auch gewaltsames Unrecht umfassen.
- source_word: וַתֶּחֱטָא
  choice: und du sündigtest
  rationale: Die einfache Koordination folgt dem hebräischen Erzählfluss, ohne die genaue logische Beziehung stärker als die Vorlage festzulegen.
- source_word: וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים
  choice: Darum verstieß ich dich als entweiht vom Berg Gottes
  rationale: חלל im Piel bezeichnet Profanierung beziehungsweise die Behandlung als unheilig. In Verbindung mit מִן und dem heiligen Ort liegt Ausschluss nahe. Die Formulierung verbindet den kultischen Sinn mit der räumlichen Entfernung, ohne zwei eigenständige Handlungen aus dem einen Verb zu machen.
- source_word: וָאַבֶּדְךָ
  choice: und vernichtete dich
  rationale: Die kausative Verbform bezeichnet das Zugrunde-Richten oder Vernichten. „Vernichtete“ ist direkt und lässt offen, in welchem Umfang die Aussage über die zuvor genannte Ausstoßung hinausgeht.
- source_word: כְּרוּב הַסֹּכֵךְ
  choice: du schirmender Kerub
  rationale: „Kerub“ ist die etablierte deutsche Singularform. Das Partizip von סכך bedeutet bedecken, überschatten oder schirmen; „schirmend“ bewahrt das Bild und deutet die Funktion weniger stark aus als „Wächter“.
- source_word: מִתּוֹךְ אַבְנֵי אֵשׁ
  choice: aus der Mitte der Feuersteine
  rationale: Die weitgehend formale Wiedergabe erhält das rätselhafte Bild und entspricht der wiederholten Wendung מִתּוֹךְ.
theological_decisions:
- issue: Identität der angeredeten Gestalt
  choice: Die direkte Anrede und die Bezeichnung als Kerub bleiben stehen, ohne die Gestalt ausdrücklich mit Satan, einem Urengel oder ausschließlich mit einem menschlichen König gleichzusetzen.
  alternative: Die Bildsprache entweder zu einer rein königlichen Metapher abflachen oder die Gestalt ausdrücklich als Satan beziehungsweise als gefallenen Engel identifizieren.
  rationale: Der Vers verbindet direkte Anrede, Kerub-Sprache und die Bildwelt vom Gottesberg und den Feuersteinen. Die Übersetzung bewahrt diese Spannung, statt eine umstrittene Gesamtdeutung in den Wortlaut einzutragen.
- issue: Verhältnis von Entweihung und Ausstoßung in וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים
  choice: „verstieß ich dich als entweiht“ verbindet kultischen Status und Entfernung aus dem heiligen Bereich.
  alternative: „entweihte ich dich“ oder „vertrieb ich dich“ allein.
  rationale: Die gewählte Formulierung hält sowohl die lexikalische Kraft von חלל als auch die durch מִן ausgedrückte Trennung vom Gottesberg fest, ohne die Mehrdeutigkeit vollständig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Kerub“, „Berg Gottes“ und „Feuersteine“ erhalten die gehobene und rätselhafte Bildsprache. Das etwas ungewöhnliche „schirmender Kerub“ ist bewusst bildnah; die Fußnote bietet die wörtlicheren Alternativen. Alle Fußnotenmarker stehen in fortlaufender Reihenfolge unmittelbar an der betreffenden Stelle.
