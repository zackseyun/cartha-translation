  text: וְ/לֹֽא יִהְיֶ֨ה ע֜וֹד לְ/בֵ֣ית יִשְׂרָאֵ֗ל סִלּ֤וֹן מַמְאִיר֙ וְ/ק֣וֹץ מַכְאִ֔ב מִ/כֹּל֙ סְבִ֣יבֹתָ֔/ם הַ/שָּׁאטִ֖ים אוֹתָ֑/ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/024.yaml
  text: And the house of Israel will no longer have a brier that causes bitterness or a thorn that causes pain from all those around them who despise them[a]. Then they will know that I am the Lord GOD.
translation:
  language: de
  text: Und für das Haus Israel wird es von all denen ringsum, die es verachten, keinen verletzenden Dornstrauch und keinen Schmerzen verursachenden Dorn mehr geben.[a] Dann werden sie erkennen, dass ich der Herr Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinen Bitterkeit verursachenden Dornstrauch und keinen Schmerzen verursachenden Dorn“. Die seltenen bzw. bildhaften Ausdrücke bezeichnen die verletzende Bedrohung durch die feindlichen Völker rings um Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִלּוֹן
  choice: Dornstrauch
  rationale: Das seltene Wort bezeichnet etwas Dorniges bzw. Stechendes. „Dornstrauch“ bewahrt das Pflanzenbild und lässt sich im Parallelismus von „Stachel“ unterscheiden.
- source_word: מַמְאִיר
  choice: verletzend
  rationale: Das Partizip beschreibt die schädigende, quälende Wirkung des Dornstrauchs. „Verletzend“ gibt diese Wirkung natürlich wieder, ohne die unsichere Nuance vorschnell auf „Bitterkeit“ festzulegen.
- source_word: קוֹץ
  choice: Stachel
  rationale: Das geläufige Wort kann „Dorn“ oder „Stachel“ bedeuten. „Stachel“ erhält hier die Parallelität, ohne beide hebräischen Substantive gleich wiederzugeben.
- source_word: מַכְאִב
  choice: schmerzend
  rationale: Die Form bezeichnet etwas, das Schmerzen verursacht. „Schmerzend“ ist knapp, anschaulich und wahrt den partizipialen Charakter.
- source_word: מִכֹּל סְבִיבֹתָם
  choice: unter all denen ringsum
  rationale: Gemeint sind die feindseligen Menschen bzw. Völker in Israels Umgebung, nicht bloß die geografische Umgebung. Die Formulierung hält den Bezug bewusst weit.
- source_word: הַשָּׁאטִים אוֹתָם
  choice: die es verachten
  rationale: Das Partizip bezeichnet anhaltende Geringschätzung oder Verachtung. Das grammatisch singulare „es“ bezieht sich im Deutschen auf „das Haus Israel“.
- source_word: בֵית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die feste Bundesbezeichnung wird formal bewahrt und nicht auf das schlichtere „Israel“ verkürzt.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: „Herr“ gibt אֲדֹנָי wieder; „Jahwe“ macht den Gottesnamen erkennbar und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: וְיָדְעוּ כִּי אֲנִי
  choice: Dann werden sie erkennen, dass ich … bin
  rationale: Das „Dann“ bringt den folgernden Zusammenhang des וְ natürlich zum Ausdruck; „erkennen“ entspricht der hier gemeinten erfahrungsbezogenen Erkenntnis.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom persönlichen Gottesnamen יהוה und macht beides für heutige Leser transparent.
- issue: Bezug der feindlichen Pflanzenbilder
  choice: Die Bilder werden auf die verachtenden Menschen beziehungsweise Völker ringsum bezogen
  alternative: Die Bilder als nicht näher bestimmte Leiden Israels stehen lassen
  rationale: Die Präpositionalphrase „unter all denen ringsum, die es verachten“ bindet die Dornbilder im Satz ausdrücklich an Israels feindselige Umgebung, ohne einzelne Völker zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem hebräischen Existenzsatz noch erkennbar, bleibt aber idiomatisch. Die zwei parallelen Pflanzenbilder und ihre jeweils schädigende Wirkung bleiben unterschieden; die Fußnote weist auf die lexikalische Unsicherheit hin.
