  variant: modern standard German
source:
  edition: WLC
  text: אַ֨תְּ כְּר֔וּב מִמְשַׁ֖ח הַ/סּוֹכֵ֑ךְ וּ/נְתַתִּ֗י/ךָ בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙ הָיִ֔יתָ בְּ/ת֥וֹךְ אַבְנֵי אֵ֖שׁ הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/014.yaml
  text: You were an anointed guardian cherub[a], and I placed you on the holy mountain of God[b]; you walked in the midst of stones of fire.
translation:
  language: de
  text: Du[b] warst ein gesalbter, schützender Cherub[a], und ich setzte dich auf den heiligen Berg Gottes. Mitten unter Steinen aus Feuer gingst du umher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »ein gesalbter Cherub, der beschirmt«; traditionell auch: »ein gesalbter, schirmender Cherub«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Pronomen »du« steht hier in der weiblichen Form, während die folgenden Verbformen und Suffixe männlich sind; gemeint ist dennoch ein einzelnes »Du«.
    reason: textual_variant
lexical_decisions:
- source_word: כְּרוּב
  choice: Cherub
  rationale: Der etablierte deutsche Singular bezeichnet das himmlische Wächterwesen und bewahrt das besondere Thron- und Heiligtumsbild.
- source_word: מִמְשַׁח
  choice: gesalbt
  rationale: Das Substantiv bezeichnet Salbung und wird in dieser Verbindung natürlich adjektivisch wiedergegeben, ohne den Weihegedanken aufzugeben.
- source_word: הַסּוֹכֵךְ
  choice: schützend
  rationale: Das Partizip von סכך bedeutet bedecken, beschirmen oder schützen. »Schützend« vermittelt die Funktion in heutigem Deutsch; die formnähere Alternative steht in der Fußnote.
- source_word: וּנְתַתִּיךָ
  choice: und ich setzte dich
  rationale: נתן kann geben, setzen oder hinstellen bedeuten. Mit der Ortsangabe ist »setzte« eine natürliche und sachlich zurückhaltende Wiedergabe.
- source_word: בְּהַר קֹדֶשׁ אֱלֹהִים
  choice: auf den heiligen Berg Gottes
  rationale: Die Formulierung gibt die sakrale Ortsangabe klar wieder und vermeidet eine weitergehende Deutung des Bildes.
- source_word: בְּתוֹךְ אַבְנֵי אֵשׁ
  choice: mitten unter Steinen aus Feuer
  rationale: Die ungewöhnliche Bildsprache bleibt erhalten. »Feuersteine« wurde vermieden, da dieses Wort im Deutschen leicht als Bezeichnung für Flint verstanden wird.
- source_word: הִתְהַלָּכְתָּ
  choice: gingst du umher
  rationale: Der Hitpael von הלך kann eine wiederholte oder sich hin und her bewegende Tätigkeit ausdrücken; »umhergehen« bildet dies knapp und idiomatisch ab.
- source_word: אַתְּ
  choice: Du
  rationale: Die Anrede ist singular. Das grammatische Formproblem kann im Deutschen nicht unmittelbar dargestellt werden und wird deshalb in einer Fußnote erläutert.
theological_decisions:
- issue: Wesen des Angeredeten in der Totenklage über den König von Tyrus
  choice: Die erhabene Cherub- und Heiligtumsbildsprache bleibt ohne Festlegung erhalten.
  alternative: Das Bild ausschließlich auf den König von Tyrus, auf ein übernatürliches Urwesen oder auf eine doppelte beziehungsweise typologische Bezugsebene festzulegen.
  rationale: Der hebräische Text verwendet mythisch-sakrale Bilder, entscheidet in diesem Vers aber nicht ausdrücklich zwischen diesen Deutungen. Die Übersetzung soll diese Spannung bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Feuerstein-Bildsprache und die theologische Offenheit des Verses werden bewahrt; »schützend« macht die Funktion des Cherubs verständlich, ohne zusätzliche Bilddetails wie Flügel einzutragen.
