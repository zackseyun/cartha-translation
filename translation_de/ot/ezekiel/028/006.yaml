  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֛עַן תִּתְּ/ךָ֥ אֶת לְבָבְ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/006.yaml
  text: 'Therefore thus says the Lord GOD: Because you have made your heart like the heart of a god,[a]'
translation:
  language: de
  text: 'Darum, so spricht Gott, der HERR: Weil du dein Herz dem Herzen eines Gottes gleichgemacht hast,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Herzen Gottes“. Das hebräische Wort אֱלֹהִים kann je nach Zusammenhang „Gott“, „ein Gott“ oder „Götter“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Konsequenz aus dem vorangehenden Vorwurf ein; „Darum“ ist natürlich und prägnant.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feststehende prophetische Botenformel in geläufigem deutschem Bibelstil.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen etablierte Wiedergabe vermeidet „Herr HERR“ und bewahrt beide Bestandteile des hebräischen Hoheitstitels; HERR steht für den Gottesnamen יהוה.
- source_word: יַעַן
  choice: Weil
  rationale: Gibt die kausale Einleitung des Grundes klar und unmittelbar wieder.
- source_word: תִּתְּךָ אֶת לְבָבְךָ
  choice: du dein Herz ... gleichgestellt hast
  rationale: Das Verb נתן bedeutet wörtlich „geben/setzen“. In Verbindung mit dem Vergleich bezeichnet es hier das Setzen beziehungsweise Gleichstellen des eigenen Herzens; diese deutsche Formulierung bewahrt das Bild und ist idiomatisch.
- source_word: לְבָבְךָ
  choice: dein Herz
  rationale: „Herz“ bewahrt die hebräische Metapher für Denken, Wollen und innere Haltung.
- source_word: כְּלֵב אֱלֹהִים
  choice: dem Herzen eines Gottes
  rationale: Im Kontext der Selbstüberhebung des Fürsten von Tyrus bezeichnet אֱלֹהִים am ehesten ein göttliches Wesen beziehungsweise „einen Gott“. Die syntaktische Zuordnung zum Herzen bleibt erhalten.
theological_decisions:
- issue: Deutung von אֱלֹהִים in כְּלֵב אֱלֹהִים
  choice: eines Gottes
  alternative: Gottes; von Göttern
  rationale: Der Kontext verspottet den Anspruch des menschlichen Herrschers auf Göttlichkeit. „Eines Gottes“ bringt diese Selbstvergöttlichung am ehesten zum Ausdruck, ohne sie als wirkliche Ähnlichkeit mit dem Gott Israels zu bestätigen. Da אֱלֹהִים sprachlich auch „Gott“ oder „Götter“ bedeuten kann, wird die echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und dem biblischen Herzbild. Das Satzfragment endet entsprechend dem hebräischen Vers mit einem Komma, da die göttliche Erklärung im folgenden Vers fortgesetzt wird.
