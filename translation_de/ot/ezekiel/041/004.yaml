  text: וַ/יָּ֨מָד אֶת אָרְכּ֜/וֹ עֶשְׂרִ֣ים אַמָּ֗ה וְ/רֹ֛חַב עֶשְׂרִ֥ים אַמָּ֖ה אֶל פְּנֵ֣י הַֽ/הֵיכָ֑ל וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֖ה קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/004.yaml
  text: 'Then he measured its length: twenty cubits[a], and the width: twenty cubits, before the nave; and he said to me, “This is the Most Holy Place.”'
translation:
  language: de
  text: 'Dann maß er seine Länge: zwanzig Ellen, und seine Breite: zwanzig Ellen, vor dem Tempelraum. Und er sagte zu mir: „Das ist das Allerheiligste[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Heilige der Heiligen“.'
    reason: Bewahrt die formale hebräische Steigerung und ihre traditionelle Ausdrucksweise.
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Wayyiqtol führt die Erzählung fort; „Dann“ gibt die zeitliche Abfolge im modernen Deutsch natürlich wieder.
- source_word: אָרְכּוֹ
  choice: seine Länge
  rationale: Das maskuline Suffix bezieht sich im Kontext auf den vermessenen inneren Raum.
- source_word: עֶשְׂרִים אַמָּה
  choice: zwanzig Ellen
  rationale: Die antike Maßeinheit אַמָּה wird transparent als „Elle“ beibehalten und nicht in ein modernes Maß umgerechnet.
- source_word: וְרֹחַב
  choice: und seine Breite
  rationale: רֹחַב bezeichnet die Breite; das ergänzte Possessivpronomen verdeutlicht im Deutschen den Bezug auf denselben Raum.
- source_word: אֶל־פְּנֵי הַהֵיכָל
  choice: vor dem Tempelraum
  rationale: Die räumliche Wendung wird ohne spekulative Festlegung auf eine Himmelsrichtung wiedergegeben. הֵיכָל bezeichnet hier den Hauptraum des Tempels, den der innere Raum klar gegenübersteht.
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Die geläufige Erzählformel wird direkt und würdig wiedergegeben.
- source_word: זֶה קֹדֶשׁ הַקֳּדָשִׁים
  choice: Das ist das Allerheiligste
  rationale: „Allerheiligste“ ist die natürliche deutsche Wiedergabe der hebräischen Steigerung und bezeichnet eindeutig den innersten heiligen Raum.
theological_decisions:
- issue: Wiedergabe von קֹדֶשׁ הַקֳּדָשִׁים
  choice: das Allerheiligste
  alternative: das Heilige der Heiligen
  rationale: „Das Allerheiligste“ vermittelt die Bedeutung der hebräischen Steigerungsform in verständlichem, traditionell erkennbarem Deutsch; die wörtlichere Form bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält die beiden Maßangaben parallel und bewahrt die knappe Tempelbeschreibung. „Tempelraum“ unterscheidet den Hauptraum vom Allerheiligsten, ohne das Wort auf den gesamten Tempelkomplex auszuweiten.
