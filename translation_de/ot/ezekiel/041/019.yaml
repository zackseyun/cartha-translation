  terminology: »Menschengesicht« gibt אָדָם hier passend als menschliches Gegenstück zum Löwen wieder, ohne unangebrachte Spezifizierung. »Junglöwengesicht« bewahrt die Nuance von כְפִיר. »Palme« ist für das dekorative Palmenmotiv kontextgerecht; »Tempel« gibt בַּיִת in der Tempelvision angemessen wieder.
