  text: וּ/פְנֵ֨י אָדָ֤ם אֶל הַ/תִּֽמֹרָה֙ מִ/פּ֔וֹ וּ/פְנֵֽי כְפִ֥יר אֶל הַ/תִּֽמֹרָ֖ה מִ/פּ֑וֹ עָשׂ֥וּי אֶל כָּל הַ/בַּ֖יִת סָבִ֥יב סָבִֽיב־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/019.yaml
  text: with a human face toward the palm tree on one side[a], and a young lion’s face toward the palm tree on the other side. They were made all around the whole temple.
translation:
  language: de
  text: mit einem Menschengesicht zur Palme auf der einen Seite[a] und einem Junglöwengesicht zur Palme auf der anderen Seite. So war es ringsum am ganzen Tempel ausgeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Gesicht eines Menschen … das Gesicht eines jungen Löwen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנֵי אָדָם
  choice: Menschengesicht
  rationale: Die Konstruktverbindung bedeutet wörtlich »Gesicht eines Menschen«. »Menschengesicht« bezeichnet in diesem dekorativen Zusammenhang knapp und natürlich die dargestellte Gesichtsart, ohne eine bestimmte männliche Person anzunehmen.
- source_word: הַתִּמֹרָה
  choice: die Palme
  rationale: Gemeint ist das in den umliegenden Versen beschriebene Palmenmotiv der Schnitzarbeit. »Palme« gibt das konkrete Motiv direkt wieder.
- source_word: מִפּוֹ
  choice: auf der einen Seite / auf der anderen Seite
  rationale: Das zweimalige מִפּוֹ ordnet die beiden Gesichter den gegenüberliegenden Seiten des Palmenmotivs zu. Die idiomatische deutsche Wiedergabe verdeutlicht diese räumliche Gegenüberstellung.
- source_word: פְנֵי כְפִיר
  choice: Junglöwengesicht
  rationale: כְפִיר bezeichnet einen jungen Löwen. Das zusammengesetzte Substantiv entspricht der parallelen Form »Menschengesicht« und bewahrt diese Bedeutungsnuance.
- source_word: עָשׂוּי
  choice: So war es … ausgeführt
  rationale: Das singularische passive Partizip fasst wahrscheinlich die gesamte Schnitzarbeit beziehungsweise deren Anordnung kollektiv zusammen. »Ausgeführt« passt zu kunsthandwerklicher Gestaltung, ohne den Numerus in den Plural umzudeuten.
- source_word: אֶל כָּל הַבַּיִת
  choice: am ganzen Tempel
  rationale: בַּיִת bezeichnet in dieser Vision das Tempelgebäude. Die Präposition wird im Zusammenhang mit der räumlichen Ausdehnung der Verzierung natürlich mit »am« wiedergegeben.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die Verdoppelung betont die vollständige umlaufende Ausdehnung; »ringsum« gibt dies in modernem Deutsch prägnant wieder.
theological_decisions:
- issue: Bedeutung von אָדָם bei einem Bildmotiv
  choice: Mensch
  alternative: Mann
  rationale: Hier wird das Gesicht einer geschnitzten Gestalt dem Gesicht eines jungen Löwen gegenübergestellt. »Mensch« wahrt den Gegensatz Mensch–Tier, ohne unnötig eine bestimmte männliche Einzelperson vorauszusetzen.
- issue: Numerus und Bezug von עָשׂוּי
  choice: 'Singular kollektiv: »So war es … ausgeführt«'
  alternative: 'Plural: »Sie waren … ausgeführt«'
  rationale: Der masoretische Text hat ein singularisches Partizip. Trotz der mehreren dargestellten Gesichter bleibt der Singular erhalten und kann sich kollektiv auf das Schnitzwerk oder das beschriebene Muster beziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakten Zusammensetzungen »Menschengesicht« und »Junglöwengesicht« erhalten den Parallelismus. Der Satz setzt die Beschreibung aus Vers 18 fort; der fragmentarische Anschluss wird daher beibehalten.
