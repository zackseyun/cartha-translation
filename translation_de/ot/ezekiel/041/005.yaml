  text: וַ/יָּ֥מָד קִֽיר הַ/בַּ֖יִת שֵׁ֣שׁ אַמּ֑וֹת וְ/רֹ֣חַב הַ/צֵּלָע֩ אַרְבַּ֨ע אַמּ֜וֹת סָבִ֧יב סָבִ֛יב לַ/בַּ֖יִת סָבִֽיב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/005.yaml
  text: 'Then he measured the wall of the house: six cubits[a]; and the width of the side chambers was four cubits all around the house on every side.'
translation:
  language: de
  text: 'Dann maß er die Mauer des Hauses: sechs Ellen. Die Breite des Seitenbaus[a] betrug vier Ellen, rings um das Haus auf allen Seiten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Seitenkammer“ beziehungsweise „der Seitenräume“. Das hebräische Wort bezeichnet hier die an den Seiten des Tempelgebäudes angebauten Räume oder den entsprechenden Seitenbau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Wayyiqtol von מדד führt den nächsten Handlungsschritt des Visionsberichts ein. „Dann“ gibt die Erzählfolge in natürlichem Deutsch wieder.
- source_word: קִיר הַבַּיִת
  choice: die Mauer des Hauses
  rationale: קִיר bezeichnet hier die bauliche Mauer; „Haus“ bewahrt die übliche Bezeichnung des Tempelgebäudes in dieser Vision.
- source_word: שֵׁשׁ אַמּוֹת
  choice: sechs Ellen
  rationale: Die antike Maßeinheit wird beibehalten und nicht in ein modernes Maß umgerechnet.
- source_word: וְרֹחַב הַצֵּלָע
  choice: Die Breite des Seitenbaus
  rationale: צֵלָע ist im tempelarchitektonischen Zusammenhang der seitlich an das Hauptgebäude angefügte Kammer- oder Baubereich. Der Singular kann kollektiv den gesamten umlaufenden Seitenbau bezeichnen.
- source_word: אַרְבַּע אַמּוֹת
  choice: vier Ellen
  rationale: Die Maßangabe wird direkt und unter Beibehaltung der antiken Einheit wiedergegeben.
- source_word: סָבִיב סָבִיב לַבַּיִת סָבִיב
  choice: rings um das Haus auf allen Seiten
  rationale: Die gehäufte Wiederholung von סָבִיב betont, dass sich der Seitenbau rings um das Gebäude erstreckte. Die deutsche Formulierung erhält diesen Nachdruck ohne unnatürliche wörtliche Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit schlichter architektonischer Ausdrucksweise. „Haus“ wahrt die Bildsprache des hebräischen Textes; „Seitenbau“ gibt den kollektiven Zusammenhang des grammatisch singularischen Ausdrucks wieder.
