  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählung des Hebräischen bleibt erkennbar, wird aber durch wiederholtes „an den“ syntaktisch verständlich gemacht. Unsichere architektonische Begriffe werden nicht überpräzisiert.
