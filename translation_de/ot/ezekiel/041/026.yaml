source:
  edition: WLC
  text: וְ/חַלּוֹנִ֨ים אֲטֻמ֤וֹת וְ/תִֽמֹרִים֙ מִ/פּ֣וֹ וּ/מִ/פּ֔וֹ אֶל כִּתְפ֖וֹת הָֽ/אוּלָ֑ם וְ/צַלְע֥וֹת הַ/בַּ֖יִת וְ/הָ/עֻבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/026.yaml
  text: And there were shuttered windows and palm trees on this side and on that[a], along the sidewalls of the vestibule, and on the side chambers of the temple[c][b], and the canopies.
translation:
  language: de
  text: Dort gab es verschlossene Fenster[a] und Palmenmotive[b] auf beiden Seiten, an den Seitenwänden der Vorhalle, an den Seitenkammern des Tempels und an den Dachvorsprüngen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geschlossene Fenster“. Das Hebräische beschreibt Fenster, die verschlossen oder auf irgendeine Weise abgeschirmt waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Palmen“; gemeint sind hier wahrscheinlich dekorative Palmendarstellungen.'
    reason: cultural_note
  - marker: c
    text: Die Bedeutung des seltenen hebräischen Ausdrucks ist unsicher. Gemeint sein könnten Dachvorsprünge, Traufen oder andere überhängende Bauteile.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים אֲטֻמוֹת
  choice: verschlossene Fenster
  rationale: חַלּוֹנִים bezeichnet architektonische Fenster; das passive Partizip אֲטֻמוֹת beschreibt sie als verschlossen oder auf irgendeine Weise abgeschirmt, ohne die konkrete Bauart eindeutig festzulegen.
- source_word: תִמֹרִים
  choice: Palmenmotive
  rationale: Im Zusammenhang der Tempelbeschreibung sind bildliche oder geschnitzte Palmendarstellungen gemeint. „Palmenmotive“ macht diese dekorative Funktion im Deutschen deutlich.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: auf beiden Seiten
  rationale: Die distributive Wendung bedeutet wörtlich „von hier und von hier“ und bezeichnet die Anordnung zu beiden Seiten.
- source_word: אֶל כִּתְפוֹת הָאוּלָם
  choice: an den Seitenwänden der Vorhalle
  rationale: כָּתֵף bedeutet wörtlich „Schulter“, kann architektonisch aber einen seitlichen Abschnitt oder eine Seitenwand bezeichnen; אוּלָם ist die Vorhalle des Tempelgebäudes.
- source_word: צַלְעוֹת הַבַּיִת
  choice: an den Seitenkammern des Tempels
  rationale: צֵלָע bezeichnet in diesem architektonischen Zusammenhang die seitlichen Kammern oder Anbauten; הַבַּיִת meint hier das Tempelgebäude.
- source_word: הָעֻבִּים
  choice: an den Dachvorsprüngen
  rationale: Das seltene architektonische Wort ist in seiner genauen Bedeutung unsicher. „Dachvorsprünge“ gibt eine verbreitete Deutung als vorspringende oder überhängende Bauteile wieder, ohne eine irreführende Sicherheit zu beanspruchen.
theological_decisions: []
