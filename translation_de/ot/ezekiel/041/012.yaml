  text: וְ/הַ/בִּנְיָ֡ן אֲשֶׁר֩ אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה פְּאַ֣ת דֶּֽרֶךְ הַ/יָּ֗ם רֹ֚חַב שִׁבְעִ֣ים אַמָּ֔ה וְ/קִ֧יר הַ/בִּנְיָ֛ן חָֽמֵשׁ אַמּ֥וֹת רֹ֖חַב סָבִ֣יב סָבִ֑יב וְ/אָרְכּ֖/וֹ תִּשְׁעִ֥ים אַמָּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/012.yaml
  text: And the building that faced the separate area on the side toward the west was seventy cubits wide[a], and the wall of the building was five cubits wide all around, and its length was ninety cubits.
translation:
  language: de
  text: Das Gebäude, das der abgesonderten Fläche auf der Westseite gegenüberlag[a], war siebzig Ellen breit. Die Mauer des Gebäudes war ringsum fünf Ellen dick, und seine Länge betrug neunzig Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an der Seite in Richtung des Meeres«; gemeint ist die Westseite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּנְיָן
  choice: das Gebäude
  rationale: בִּנְיָן bezeichnet hier einen errichteten Bau; »Gebäude« ist im architektonischen Zusammenhang natürlich und präzise.
- source_word: אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה
  choice: das der abgesonderten Fläche gegenüberlag
  rationale: אֶל־פְּנֵי beschreibt hier die räumliche Lage vor beziehungsweise gegenüber der גִּזְרָה. »Gegenüberlag« wahrt diese Beziehung, ohne eine bestimmte Blickrichtung festzulegen.
- source_word: הַגִּזְרָה
  choice: die abgesonderte Fläche
  rationale: גִּזְרָה bezeichnet in diesem Abschnitt den abgetrennten beziehungsweise ausgesonderten Bereich der Tempelanlage. »Fläche« passt zum vermessenen Gelände.
- source_word: פְּאַת דֶּרֶךְ הַיָּם
  choice: an der Seite nach Westen hin
  rationale: Wörtlich steht eine Seite in Richtung des Meeres; im geografischen Sprachgebrauch Israels bezeichnet dies den Westen. Die Übersetzung gibt die Richtung verständlich wieder und dokumentiert das Bild in der Fußnote.
- source_word: רֹחַב שִׁבְעִים אַמָּה
  choice: war siebzig Ellen breit
  rationale: רֹחַב bezeichnet die Breite; die prädikative Form ist im modernen Deutschen für Maßangaben idiomatisch.
- source_word: קִיר הַבִּנְיָן חָמֵשׁ אַמּוֹת רֹחַב
  choice: Die Mauer des Gebäudes war fünf Ellen dick
  rationale: Obwohl רֹחַב formal »Breite« bedeutet, wird bei einer Mauer auf Deutsch natürlicherweise ihre Dicke angegeben.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die Verdoppelung verstärkt den umfassenden Sinn; »ringsum« bringt ihn knapp und würdig zum Ausdruck.
- source_word: וְאָרְכּוֹ תִּשְׁעִים אַמָּה
  choice: und seine Länge betrug neunzig Ellen
  rationale: Die explizite Wiedergabe von אֹרֶךְ als »Länge« entspricht dem vermessenden, architektonischen Stil.
theological_decisions: []
translation_notes:
  register: Modernes, sachlich-gehobenes Standarddeutsch für eine architektonische Maßbeschreibung. Die traditionelle Maßeinheit »Elle« bleibt erhalten; die idiomatische Wiedergabe der Mauerbreite als »Dicke« erhöht die Verständlichkeit, ohne den Inhalt zu verändern.
