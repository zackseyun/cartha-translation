  text: וְ/עָשׂ֥וּי כְּרוּבִ֖ים וְ/תִֽמֹרִ֑ים וְ/תִֽמֹרָה֙ בֵּין כְּר֣וּב לִ/כְר֔וּב וּ/שְׁנַ֥יִם פָּנִ֖ים לַ/כְּרֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/018.yaml
  text: Cherubim and palm trees were made on it[a], with a palm tree between cherub and cherub; and each cherub had two faces.
translation:
  language: de
  text: Cherubim und Palmen waren als Verzierungen ausgeführt[a]. Zwischen je zwei Cherubim befand sich eine Palme, und jeder Cherub hatte zwei Gesichter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren gemacht“ oder „waren gearbeitet“. Wörtlich steht im Hebräischen „gemacht“; im architektonischen Zusammenhang sind ausgeführte Verzierungen gemeint, ohne dass die genaue Technik bezeichnet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּי
  choice: waren als Schmuck gearbeitet
  rationale: Das passive Partizip von עשה bedeutet wörtlich „gemacht/gearbeitet“. Die Form steht zwar im Singular, wird hier aber dem Sinn nach auf die folgenden Schmuckmotive bezogen. „Als Schmuck gearbeitet“ gibt den architektonischen Zusammenhang natürlich wieder, ohne die Technik vorschnell auf Schnitzarbeit festzulegen.
- source_word: כְּרוּבִים
  choice: Cherubim
  rationale: „Cherubim“ ist die etablierte deutsche Wiedergabe der hebräischen Pluralform und passt zum würdevollen architektonisch-visionären Register.
- source_word: וְתִמֹרִים
  choice: und Palmen
  rationale: תמרים bezeichnet hier Palmen als ornamentale Motive. „Palmen“ ist im Deutschen klar und knapper als „Palmenfiguren“.
- source_word: וְתִמֹרָה
  choice: eine Palme
  rationale: 'Die Singularform wird distributiv gebraucht: Zwischen den Cherubim erscheint jeweils eine Palme.'
- source_word: בֵּין כְּרוּב לִכְרוּב
  choice: zwischen je zwei Cherubim
  rationale: Die hebräische Wendung lautet wörtlich „zwischen Cherub und Cherub“. Die deutsche Formulierung gibt die distributive Bedeutung idiomatisch und eindeutig wieder.
- source_word: וּשְׁנַיִם פָּנִים לַכְּרוּב
  choice: und jeder Cherub hatte zwei Gesichter
  rationale: Wörtlich steht „und zwei Gesichter dem Cherub“. Die distributive Wiedergabe „jeder Cherub“ wird durch den folgenden Vers gestützt und ergibt natürliches Deutsch.
theological_decisions:
- issue: Art der Cherubdarstellungen im Tempelschmuck
  choice: Die Cherubim und Palmen werden als konkrete Schmuckmotive beschrieben, ohne allegorische Auslegung.
  alternative: Die Motive symbolisch oder typologisch auszudeuten.
  rationale: Der Vers beschreibt die architektonische Ausstattung. Eine weitergehende theologische Symbolik wird im hebräischen Text hier nicht ausdrücklich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist architektonisch anschaulich, wahrt aber bei עשה die Unbestimmtheit hinsichtlich der konkreten Herstellungstechnik.
