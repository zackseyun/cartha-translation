  text: And between the chambers was a width of twenty cubits all around the temple[a], all around.
translation:
  language: de
  text: Und zwischen den Kammern war ein zwanzig Ellen breiter Raum rings um den Tempel – ringsum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht das Wort für »ringsum« in diesem Vers dreimal, um die vollständige umlaufende Ausdehnung zu betonen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: Und zwischen
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch die räumliche Präposition, ohne den Diskurs stärker auszudeuten.
- source_word: הַלְּשָׁכוֹת
  choice: den Kammern
  rationale: Das Wort bezeichnet hier Kammern im Tempelkomplex. Die schlichte Wiedergabe bleibt näher am Hebräischen als das spezifizierende »Seitenkammern«.
- source_word: רֹחַב עֶשְׂרִים אַמָּה
  choice: ein zwanzig Ellen breiter Raum
  rationale: Die nominale Maßangabe wird in natürlichem Deutsch als Beschreibung eines Zwischenraums ausgedrückt; »Elle« bewahrt das antike Maß.
- source_word: סָבִיב לַבַּיִת
  choice: rings um den Tempel
  rationale: »Rings um« gibt die umlaufende Ausdehnung wieder; בַּיִת bezeichnet in diesem Zusammenhang den Tempelbau.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Das abschließende »ringsum« bewahrt hörbar die nachdrückliche Wiederholung, ohne im Deutschen dreimal dieselbe Formulierung zu setzen.
