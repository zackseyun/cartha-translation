  text: וַ/יְבִיאֵ֖/נִי אֶל הַ/הֵיכָ֑ל וַ/יָּ֣מָד אֶת הָ/אֵילִ֗ים שֵׁשׁ אַמּ֨וֹת רֹ֧חַב מִ/פּ֛וֹ וְ/שֵׁשׁ אַמּֽוֹת רֹ֥חַב מִ/פּ֖וֹ רֹ֥חַב הָ/אֹֽהֶל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/001.yaml
  text: 'Then he brought me into the nave and measured the jambs: six cubits wide on one side and six cubits wide on the other side—the width of the tent[a][b].'
translation:
  language: de
  text: 'Dann brachte er mich in die Haupthalle[a] und maß die Türpfosten: sechs Ellen breit auf der einen Seite und sechs Ellen breit auf der anderen Seite – so breit war das Zelt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tempelhalle“ oder „Heiligtum“. Das hebräische Wort bezeichnet hier den Hauptraum des Tempelgebäudes, nicht die gesamte Tempelanlage.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Zelt“. Im Zusammenhang dieser Tempelvision verstehen manche das Wort als architektonischen Fachausdruck oder geben es mit „Stiftshütte“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  choice: Haupthalle
  rationale: Im Zusammenhang der Tempelvision bezeichnet das Wort den Hauptraum des Tempelgebäudes, im Unterschied zum innersten Raum. „Haupthalle“ ist verständlich und vermeidet, dass „Tempel“ als Bezeichnung der gesamten Anlage missverstanden wird.
- source_word: אֵילִים
  choice: Türpfeiler
  rationale: Gemeint sind die tragenden seitlichen Bauteile des Eingangs. „Türpfeiler“ gibt ihre Lage und bauliche Funktion natürlicher wieder als das weniger geläufige „Türgewände“; freistehende Säulen sind nicht gemeint.
- source_word: אַמּוֹת
  choice: Ellen
  rationale: Die traditionelle deutsche Bezeichnung bewahrt das antike Längenmaß, ohne eine unsichere Umrechnung in moderne Maße vorzunehmen.
- source_word: רֹחַב
  choice: breit / so breit war
  rationale: Das Maßwort bezeichnet die Breite. In den einzelnen Angaben ist die adjektivische Form „breit“ natürlich; die abschließende Wendung wird als „so breit war“ verständlich wiedergegeben.
- source_word: מִפּוֹ ... מִפּוֹ
  choice: auf der einen Seite ... auf der anderen Seite
  rationale: Die beiden deiktischen Ausdrücke beziehen sich auf die einander entsprechenden Seiten des Eingangs; diese Formulierung ist im Deutschen eindeutig und idiomatisch.
- source_word: אֹהֶל
  choice: Zelt
  rationale: „Zelt“ ist die unmittelbare lexikalische Bedeutung. Die im Tempelkontext auffällige Bezeichnung wird nicht geglättet; eine mögliche fachsprachlich-kultische Deutung wird in der Fußnote genannt.
- source_word: וַיְבִיאֵנִי
  choice: Dann brachte er mich
  rationale: Die Verbform führt die Abfolge der Vision weiter. „Dann“ gibt diesen erzählerischen Fortschritt in natürlichem Deutsch wieder.
- source_word: וַיָּמָד
  choice: maß
  rationale: Direkte und sachgerechte Wiedergabe des Messvorgangs.
