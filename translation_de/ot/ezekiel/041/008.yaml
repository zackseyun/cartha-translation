  text: וְ/רָאִ֧יתִי לַ/בַּ֛יִת גֹּ֖בַהּ סָבִ֣יב סָבִ֑יב מיסדות הַ/צְּלָעוֹת֙ מְל֣וֹ הַ/קָּנֶ֔ה שֵׁ֥שׁ אַמּ֖וֹת אַצִּֽילָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/008.yaml
  text: And I saw that the house had a raised platform all around[a]; the foundations of the side chambers were a full reed of six cubits to the offset.
translation:
  language: de
  text: Und ich sah, dass das Haus ringsum eine Erhöhung hatte; die Fundamente der Seitenkammern maßen eine volle Messrute, sechs Ellen, bis zum Absatz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bis zur Verbindungsstelle, bis zum Vorsprung oder möglicherweise am Sockel. Der hebräische Ausdruck ist hier als architektonischer Fachbegriff nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Und ich sah
  rationale: Gibt das Qal Perfekt 1. Person Singular von ראה als fortlaufenden prophetischen Augenzeugenbericht direkt und natürlich wieder.
- source_word: לַבַּיִת
  choice: das Haus
  rationale: Bewahrt die für Hesekiels Tempelbeschreibung charakteristische Bezeichnung בַּיִת; aus dem Kontext ist klar, dass das Tempelhaus gemeint ist.
- source_word: גֹּבַהּ
  choice: auf einer Erhöhung stand
  rationale: Das Substantiv bezeichnet wörtlich Höhe oder Erhöhung. Im architektonischen Zusammenhang ist eine erhöhte Grundlage gemeint; die Formulierung bleibt anschaulich, ohne die genaue Bauform als Plattform festzulegen.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Das verdoppelte Adverb bezeichnet die vollständige Umfassung; „ringsum“ ist im Deutschen knapp und natürlich.
- source_word: מיסדות
  choice: die Fundamente
  rationale: Bezeichnet die Fundamente oder den Unterbau der Seitenkammern; „Fundamente“ ist die transparenteste deutsche Entsprechung.
- source_word: הַצְּלָעוֹת
  choice: der Seitenkammern
  rationale: צלע bezeichnet in diesem tempelarchitektonischen Kontext die seitlich an den Hauptbau angeschlossenen Kammern.
- source_word: מְלֹא הַקָּנֶה
  choice: eine volle Messrute hoch
  rationale: מְלֹא bezeichnet das volle Maß und קָנֶה die Messrute. „Hoch“ verdeutlicht im Zusammenhang mit Fundamenten und Erhöhung die gemessene Dimension, ohne das Maß selbst zu verändern.
- source_word: שֵׁשׁ אַמּוֹת
  choice: sechs Ellen
  rationale: Gibt die appositionelle Angabe zur Länge der vollen Messrute unmittelbar wieder.
- source_word: אַצִּילָה
  choice: bis zum Absatz
  rationale: Der seltene architektonische Ausdruck ist in seiner genauen Bedeutung unsicher. „Absatz“ passt zum baulichen Zusammenhang, ohne eine präzise Rekonstruktion vorzutäuschen; Alternativen werden in der Fußnote genannt.
