    rationale: Ohne trennende Apposition wird „bis zum Absatz“ im Deutschen leicht als Endpunkt einer sechs Ellen langen Strecke verstanden. Die Funktion von אַצִּילָה ist jedoch gerade unsicher und sollte nicht so eng syntaktisch bestimmt werden.
