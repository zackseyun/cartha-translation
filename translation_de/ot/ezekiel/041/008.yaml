  rationale: Die Revision gibt גֹּבַהּ mit „eine Erhöhung hatte“ wieder, ohne die räumlich-konstruktive Deutung „stand auf“ festzuschreiben. Die Maßangabe wird als Apposition gesetzt; dadurch bleibt die genaue syntaktische und architektonische Funktion von אַצִּילָה offen. Die Fußnote bewahrt die wesentlichen lexikalischen Möglichkeiten.
