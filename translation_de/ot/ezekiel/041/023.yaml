  yaml_path: translation/ot/ezekiel/041/023.yaml
  text: And the nave and the sanctuary each had two doors[a].
translation:
  language: de
  text: Die Tempelhalle und das Heiligtum hatten jeweils zwei Türen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Haupthalle und der heilige Raum hatten jeweils zwei Türen.“'
    reason: Lexikalische Alternativen für הֵיכָל und קֹדֶשׁ werden kenntlich gemacht, ohne die räumliche Zuordnung anders festzulegen.
lexical_decisions:
- source_word: וּשְׁתַּיִם
  choice: zwei
  rationale: Die feminine Kardinalzahl bezieht sich auf das feminine Pluralwort דְּלָתוֹת; die natürliche deutsche Wiedergabe lautet „zwei“.
- source_word: דְּלָתוֹת
  choice: Türen
  rationale: Der Plural bezeichnet Türen beziehungsweise Türflügel. „Türen“ wahrt den schlichten Wortlaut, ohne die Bauform als Doppeltüren näher festzulegen.
- source_word: הֵיכָל
  choice: Tempelhalle
  rationale: Im Zusammenhang der Tempelvision bezeichnet das Wort den Hauptraum des Tempelgebäudes im Unterschied zum inneren Heiligtum. „Tempelhalle“ ist verständlich und architektonisch passend.
- source_word: קֹּדֶשׁ
  choice: Heiligtum
  rationale: Hier bezeichnet das Wort den heiligen inneren Raum, der der Tempelhalle gegenübergestellt wird. „Heiligtum“ erhält den sakralen Sinn, ohne eine stärker spezialisierte Bezeichnung aufzuzwingen.
- source_word: לַהֵיכָל וְלַקֹּדֶשׁ
  choice: Die Tempelhalle und das Heiligtum hatten jeweils
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich „zwei Türen für die Tempelhalle und für das Heiligtum“. Das ergänzte „hatten jeweils“ gibt den naheliegenden distributiven Sinn in idiomatischem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Tempelhalle“ vermeidet das im Deutschen kirchenarchitektonisch geprägte „Langhaus“; die knappe Satzform entspricht dem beschreibenden Baustil des Abschnitts.
