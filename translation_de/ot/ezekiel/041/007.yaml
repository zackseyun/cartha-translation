base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/007.yaml
  text: And the side chambers became wider as they went around upward and upward[a], because the structure of the temple went around upward and upward all around the temple. Therefore the width of the temple increased upward[c][b], and so one went up from the lowest story to the highest by way of the middle story.
translation:
  language: de
  text: Die Seitenkammern wurden nach oben hin, je weiter sie sich herumzogen, immer breiter,[a] denn der umlaufende Bau des Tempels führte rings um den Tempel immer weiter nach oben.[b] Darum nahm die Breite des Tempels nach oben hin zu. So stieg man vom untersten Stockwerk über das mittlere zum obersten hinauf.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seitenräume«. Das hebräische Wort kann seitliche Bauteile oder Kammern bezeichnen, die an den Hauptbau angefügt sind.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Bezeichnung für den umlaufenden Bau ist architektonisch schwer zu deuten. Gemeint sein könnte ein umlaufender Absatz, eine Galerie oder ein Rücksprung der Mauer.
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Satz ist stark verkürzt. Wörtlich etwa: »vom unteren zum oberen, zum mittleren«. Gemeint ist offenbar der Aufstieg von der unteren über die mittlere zur oberen Ebene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲבָה
  choice: wurden ... immer breiter
  rationale: Das feminine Qal-Perfekt beschreibt im Zusammenhang die zunehmende Breite der Seitenkammern auf den höheren Ebenen.
- source_word: וְנָסְבָה ... סָבִיב סָבִיב
  choice: der umlaufende Bau ... rings um
  rationale: Die Wortwahl bewahrt die Kraft von סבב als ringsum verlaufende Anordnung, ohne das unsichere architektonische Merkmal genauer als Gesims, Galerie oder Absatz festzulegen.
- source_word: לְמַעְלָה לְמַעְלָה
  choice: immer weiter nach oben
  rationale: Die idiomatische deutsche Form gibt die wiederholte Richtungsangabe als fortschreitende Aufwärtsbewegung wieder.
- source_word: לַצְּלָעוֹת
  choice: Seitenkammern
  rationale: Im Tempelbau bezeichnet צלעות seitlich an den Hauptbau angefügte Räume beziehungsweise Bauteile; »Seitenkammern« ist klar und architektonisch passend.
- source_word: כִּי מוּסַב הַבַּיִת
  choice: denn der umlaufende Bau des Tempels führte ... nach oben
  rationale: מוּסַב ist architektonisch schwierig. Die Wiedergabe hält an einer umlaufenden Konstruktion fest, vermeidet aber eine unbelegte Präzisierung.
- source_word: עַל כֵּן רֹחַב לַבַּיִת לְמָעְלָה
  choice: Darum nahm die Breite des Tempels nach oben hin zu
  rationale: Der elliptische hebräische Satz wird in natürlichem Deutsch verbal ausgedrückt und bewahrt den räumlichen Zusammenhang der zunehmenden Breite.
- source_word: וְכֵן הַתַּחְתּוֹנָה יַעֲלֶה עַל הָעֶלְיוֹנָה לַתִּיכוֹנָה
  choice: So stieg man vom untersten Stockwerk über das mittlere zum obersten hinauf
  rationale: Die syntaktisch gedrängte Wendung beschreibt den Aufstieg durch drei Ebenen. Das unpersönliche »man« vermeidet einen im Hebräischen nicht genannten bestimmten Akteur.
- source_word: הַבַּיִת
  choice: Tempel
  rationale: Im Kontext von Ezechiels Tempelvision meint »das Haus« den Tempelbau; »Tempel« macht den Bezug für heutige Leser unmittelbar verständlich.
