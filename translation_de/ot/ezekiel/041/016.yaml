base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/016.yaml
  text: the thresholds[a], the recessed windows, and the galleries all around on their three sides, opposite the threshold, were paneled with wood all around, from the floor up to the windows[c][b]; and the windows were covered.
translation:
  language: de
  text: Die Schwellen, die zurückgesetzten Fenster[a] und die Galerien[b] ringsum an ihren drei Seiten waren gegenüber der Schwelle ringsum mit Holz verkleidet[c], vom Boden bis zu den Fenstern; und die Fenster waren bedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die verschlossenen Fenster“, „die mit Läden versehenen Fenster“ oder „die mit Gitterwerk versehenen Fenster“. Das Hebräische bezeichnet wahrscheinlich eine feste Fensterbauart und nicht nur Fenster, die gerade geschlossen waren.'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete hebräische Wort ist ein seltenes Architekturwort und kann auch Vorsprünge, Säulengänge oder obere Laufgänge bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit einer Holzverblendung versehen“ beziehungsweise „mit Holz getäfelt“. Der seltene hebräische Ausdruck bezeichnet wohl eine hölzerne Abdeckung oder Verkleidung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים / הַסַּף
  choice: die Schwellen / die Schwelle
  rationale: סַף bezeichnet eine Schwelle, einen Türsockel oder ein anderes Bauteil am Eingang. „Schwelle“ ist hier konkret und lässt die genaue bauliche Ausführung offen.
- source_word: הַחַלּוֹנִים הָאֲטֻמוֹת
  choice: die zurückgesetzten Fenster
  rationale: אֲטֻמוֹת bedeutet wörtlich etwa „verschlossen“ oder „abgedichtet“, bezeichnet im Tempelkontext aber wahrscheinlich eine feste Fensterbauart. „Zurückgesetzt“ gibt diese architektonische Deutung wieder; die unsicheren Alternativen stehen in der Fußnote.
- source_word: הָאַתִּיקִים
  choice: die Galerien
  rationale: Das seltene Architekturwort ist nicht sicher bestimmbar. „Galerien“ ist im Zusammenhang verständlich, ohne eine zu genaue Konstruktion festzulegen.
- source_word: סָבִיב לִשְׁלָשְׁתָּם
  choice: ringsum an ihren drei Seiten
  rationale: Die Formulierung wird räumlich auf drei Seiten bezogen. Damit wird nicht unnötig festgelegt, dass drei Stockwerke gemeint seien.
- source_word: נֶגֶד הַסַּף
  choice: gegenüber der Schwelle
  rationale: נֶגֶד bezeichnet eine Lage gegenüber oder vor etwas. Die Wiedergabe bewahrt die räumliche Beziehung des Hebräischen.
- source_word: שְׂחִיף עֵץ
  choice: mit Holz verkleidet
  rationale: שְׂחִיף ist selten und meint wahrscheinlich eine Abdeckung, Verkleidung oder Täfelung. Die verbale Formulierung ergibt natürliches Deutsch.
- source_word: וְהָאָרֶץ
  choice: vom Boden
  rationale: אֶרֶץ bedeutet meist „Erde“ oder „Land“, verweist hier im architektonischen Innenraum aber wahrscheinlich auf das Bodenniveau.
- source_word: עַד הַחַלֹּנוֹת
  choice: bis zu den Fenstern
  rationale: Die Wendung bezeichnet die obere räumliche Grenze der Holzverkleidung.
- source_word: וְהַחַלּוֹנוֹת מְכֻסּוֹת
  choice: auch die Fenster waren bedeckt
  rationale: מְכֻסּוֹת heißt „bedeckt“. Da Art und Zweck der Abdeckung ungenannt bleiben, wird dies nicht näher bestimmt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwierige, teilweise elliptische Syntax des hebräischen Architekturberichts wird durch zwei Sätze lesbar gemacht, ohne die Unsicherheit der seltenen Fachwörter zu verdecken. „Alles“ macht den im Hebräischen nur elliptisch ausgedrückten Träger der Holzverkleidung im Deutschen verständlich.
