  source_fidelity: 'Der Text gibt die hebräische Abfolge und die bewusst nicht harmonisierte Benennung präzise wieder: zunächst »Altar« (מזבח), dann »Tisch« (שלחן). Die Maße, das Holz als Material, Ecken, Länge und Seiten sowie die Lokalisierung vor Jahwe sind erhalten. »vor Jahwe steht« ist eine idiomatische und sachlich angemessene Wiedergabe von לִפְנֵי יְהוָה.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Wiederholung von »aus Holz« klingt leicht aufzählend, entspricht aber der hervorgehobenen Materialangabe im Hebräischen und ist daher angemessen. »Ellen« ist als historische Maßeinheit korrekt.
  terminology: »Altar«, »Tisch«, »Ellen« und »Jahwe« sind treffend. »Seiten« ist für קִירוֹתָיו bei diesem Einrichtungsgegenstand natürlich, ohne die Aussage über seitliche Begrenzungsflächen zu verlieren. Die Fußnote erläutert den begrifflichen Wechsel zurückhaltend und löst ihn nicht dogmatisch auf.
