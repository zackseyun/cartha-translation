source:
  edition: WLC
  text: הַ/מִּזְבֵּ֡חַ עֵ֣ץ שָׁלוֹשׁ֩ אַמּ֨וֹת גָּבֹ֜הַּ וְ/אָרְכּ֣/וֹ שְׁתַּֽיִם אַמּ֗וֹת וּ/מִקְצֹֽעוֹתָי/ו֙ ל֔/וֹ וְ/אָרְכּ֥/וֹ וְ/קִֽירֹתָ֖י/ו עֵ֑ץ וַ/יְדַבֵּ֣ר אֵלַ֔/י זֶ֚ה הַ/שֻּׁלְחָ֔ן אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/022.yaml
  text: The altar was of wood[a], three cubits high and two cubits long; its corners, its length, and its sides were of wood. And he said to me, “This is the table that is before Yahweh.”
translation:
  language: de
  text: 'Der Altar war aus Holz[a], drei Ellen hoch und zwei Ellen lang. Seine Ecken, seine Länge und seine Seiten waren aus Holz. Und er sagte zu mir: »Dies ist der Tisch, der vor Jahwe steht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht zunächst »der Altar«; anschließend wird derselbe Gegenstand als »der Tisch« bezeichnet. Das kann auf seine altar- und tischartige Funktion hinweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: der Altar
  rationale: Das Substantiv bezeichnet gewöhnlich einen Altar. Der spätere Wechsel zu »Tisch« wird nicht harmonisiert.
- source_word: עֵץ
  choice: aus Holz
  rationale: Gibt den Materialgebrauch natürlich und genau wieder.
- source_word: שָׁלוֹשׁ אַמּוֹת גָּבֹהַּ
  choice: drei Ellen hoch
  rationale: Klare, im Deutschen übliche Wiedergabe der Höhenangabe.
- source_word: וְאָרְכּוֹ שְׁתַּיִם אַמּוֹת
  choice: zwei Ellen lang
  rationale: Natürliche deutsche Maßangabe, die die ausdrücklich genannte Länge bewahrt.
- source_word: וּמִקְצֹעוֹתָיו לוֹ
  choice: seine Ecken
  rationale: מִקְצֹעוֹת bezeichnet hier die Ecken oder Eckteile; das idiomatische לוֹ ist in der possessiven Form aufgenommen.
- source_word: וְקִירֹתָיו
  choice: seine Seiten
  rationale: Obwohl קִירוֹת häufig »Wände« bedeutet, ist »Seiten« für dieses kleine hölzerne Ausstattungsstück im Deutschen natürlicher und bezeichnet seine seitlichen Flächen.
- source_word: וַיְדַבֵּר אֵלַי
  choice: Und er sagte zu mir
  rationale: Natürliche deutsche Einleitung direkter Rede.
- source_word: זֶה הַשֻּׁלְחָן
  choice: Dies ist der Tisch
  rationale: Bewahrt den ausdrücklichen Wechsel des hebräischen Textes von »Altar« zu »Tisch«.
- source_word: לִפְנֵי יְהוָה
  choice: der vor Jahwe steht
  rationale: Gibt die räumliche Beziehung idiomatisch wieder und erhält den Gottesnamen als Jahwe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von »Altar« und »Tisch«
  choice: Beide Begriffe im Haupttext bewahren
  alternative: Beide Stellen als »Altar«, beide als »Tisch« oder durchgehend als »Altartisch« wiedergeben
  rationale: Der hebräische Text verwendet ausdrücklich sowohl מִזְבֵּחַ als auch שֻׁלְחָן. Die möglicherweise funktionale Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Maßeinheit »Elle« bleibt als historischer Begriff erhalten. Die etwas auffällige Wiederholung von »aus Holz« und der Wechsel von »Altar« zu »Tisch« folgen bewusst dem Ausgangstext.
