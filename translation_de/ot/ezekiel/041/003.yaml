base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/003.yaml
  text: 'Then he went inside and measured the jambs of the entrance: two cubits[a]; the entrance: six cubits[b]; and the width of the entrance: seven cubits.'
translation:
  language: de
  text: 'Dann ging er nach innen und maß die Türpfosten des Eingangs: zwei Ellen[a]; den Eingang: sechs Ellen[b]; und die Breite des Eingangs: sieben Ellen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Wandvorlagen des Eingangs“ oder „die Pfeiler des Eingangs“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text nennt knapp nacheinander den Eingang mit sechs Ellen und die Breite des Eingangs mit sieben Ellen. Der genaue architektonische Bezug dieser Maße ist unsicher; möglicherweise ist bei einer Angabe ein angrenzender Bauteil mitgemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: Dann ging er
  rationale: Das Verb בוא führt mit ו die Handlung fort. Im Zusammenhang bewegt sich der messende Führer weiter hinein; „Dann ging er“ gibt diese Abfolge natürlich wieder.
- source_word: לִפְנִימָה
  choice: ins Innere
  rationale: Das Adverb bezeichnet die Bewegung nach innen, ohne ausdrücklich einen bestimmten Innenraum zu benennen.
- source_word: וַיָּמָד
  choice: maß
  rationale: Direkte und im Zusammenhang der Tempelvision natürliche Wiedergabe des Messvorgangs.
- source_word: אֵיל הַפֶּתַח
  choice: die Pfeiler des Eingangs
  rationale: אֵיל bezeichnet im architektonischen Zusammenhang einen vorspringenden seitlichen Bauteil, etwa einen Pfeiler, eine Lisene oder einen Türpfosten. „Pfeiler“ ist verständlich und lässt die genaue Bauform offen.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: zwei Ellen
  rationale: Direkte Wiedergabe der Maßangabe mit der traditionellen deutschen Bezeichnung „Elle“.
- source_word: וְהַפֶּתַח
  choice: den Eingang
  rationale: Formale Wiedergabe ohne den Zusatz „selbst“; die genaue Beziehung dieser zweiten Angabe zum Eingangsbereich bleibt entsprechend dem knappen Hebräisch offen.
- source_word: שֵׁשׁ אַמּוֹת
  choice: sechs Ellen
  rationale: Direkte Wiedergabe der Maßangabe.
- source_word: וְרֹחַב הַפֶּתַח
  choice: und die Breite des Eingangs
  rationale: Dies entspricht dem naheliegenden Wortsinn. Die architektonische Schwierigkeit der aufeinanderfolgenden Maßangaben wird nicht durch eine interpretierende Umdeutung beseitigt.
- source_word: שֶׁבַע אַמּוֹת
  choice: sieben Ellen
  rationale: Direkte Wiedergabe der Maßangabe.
