  text: The nave had a square doorframe[b][a], and the front of the sanctuary had the same appearance.
translation:
  language: de
  text: Der Hauptraum hatte einen quadratischen Türrahmen. Und die Vorderseite des Heiligtums hatte dasselbe Aussehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „das Aussehen wie das Aussehen“. Der knappe Ausdruck bezeichnet offenbar eine Übereinstimmung im Aussehen; der genaue Vergleichspunkt bleibt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  choice: Hauptraum
  rationale: Im Zusammenhang der Tempelvision bezeichnet das Wort den großen äußeren Raum vor dem inneren Heiligtum, nicht den gesamten Tempel. „Hauptraum“ ist im heutigen Deutsch klarer und natürlicher als der kirchenbauliche Fachausdruck „Langhaus“.
- source_word: מְזוּזַת
  choice: Türrahmen
  rationale: Das Wort bezeichnet eigentlich einen Türpfosten beziehungsweise einen Teil der Türeinfassung. Da die Form als viereckig beschrieben wird, gibt „Türrahmen“ das gemeinte architektonische Element im Deutschen am natürlichsten wieder.
- source_word: רְבֻעָה
  choice: viereckig
  rationale: Die feminine Singularform beschreibt die Form der Türeinfassung. „Viereckig“ bewahrt die Grundbedeutung, ohne genauer als der hebräische Ausdruck eine geometrisch exakte quadratische Form festzulegen.
- source_word: וּפְנֵי הַקֹּדֶשׁ
  choice: Und die Vorderseite des Heiligtums
  rationale: פָּנִים bedeutet wörtlich „Angesicht“, bezeichnet hier architektonisch jedoch die sichtbare Vorderseite. קֹדֶשׁ wird im Tempelkontext sachgerecht mit „Heiligtum“ wiedergegeben.
- source_word: הַמַּרְאֶה כַּמַּרְאֶה
  choice: hatte dasselbe Aussehen
  rationale: Die wörtliche Wendung „das Aussehen wie das Aussehen“ ist elliptisch. Die Übersetzung gibt die visuelle Entsprechung idiomatisch wieder, ohne ausdrücklich festzulegen, auf welches zuvor beschriebene Bauteil sie sich bezieht.
