  text: And the width of the front of the temple and of the separate area toward the east was a hundred cubits[a][b][c].
translation:
  language: de
  text: Und die Breite der Vorderseite des Tempels[a] und des abgetrennten Bereichs nach Osten hin[b] betrug hundert Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „des Hauses“; in dieser Tempelvision ist damit das Tempelgebäude gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf der Ostseite“ beziehungsweise „ostwärts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: Breite
  rationale: Das Substantiv bezeichnet hier ein horizontales Maß; „Breite“ ist im Deutschen der natürliche architektonische Ausdruck.
- source_word: פְּנֵי
  choice: Vorderseite
  rationale: Wörtlich „Angesicht“ beziehungsweise „Fläche“; im räumlich-architektonischen Zusammenhang ist die Vorderseite gemeint.
- source_word: הַבַּיִת
  choice: Tempel
  rationale: Wörtlich „das Haus“; im Zusammenhang der Tempelvision bezeichnet der Ausdruck das Tempelgebäude.
- source_word: הַגִּזְרָה
  choice: abgetrennter Bereich
  rationale: Der seltene Ausdruck bezeichnet in dieser Vision einen ausgesonderten beziehungsweise abgetrennten Bezirk beim Tempel; die Wiedergabe wahrt diese räumliche Abgrenzung.
- source_word: לַקָּדִים
  choice: nach Osten hin
  rationale: Die Präposition mit der Richtungsangabe bezeichnet die östliche Ausrichtung; „nach Osten hin“ bleibt näher an der hebräischen Formulierung als eine ausschließlich örtliche Festlegung.
- source_word: מֵאָה אַמָּה
  choice: hundert Ellen
  rationale: Die antike Maßeinheit wird beibehalten und die Zahl idiomatisch wiedergegeben.
