id: EZK.41.15
reference: Ezekiel 41:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מָדַ֣ד אֹֽרֶךְ הַ֠/בִּנְיָן אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה אֲשֶׁ֨ר עַל אַחֲרֶ֧י/הָ ו/אתוקי/הא מִ/פּ֥וֹ וּ/מִ/פּ֖וֹ מֵאָ֣ה אַמָּ֑ה וְ/הַֽ/הֵיכָל֙ הַ/פְּנִימִ֔י וְ/אֻֽלַמֵּ֖י הֶ/חָצֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/015.yaml
  text: 'Then he measured the length of the building facing the separate area that was behind it[a], with its galleries on this side and on that side: one hundred cubits[b]; and the inner nave and the porches of the court.'
translation:
  language: de
  text: 'Dann maß er die Länge des Gebäudes, das der abgetrennten Fläche zugewandt war, die hinter ihm lag, samt ihren Galerien[a] auf der einen und auf der anderen Seite: hundert Ellen; außerdem die innere Tempelhalle[b] und die Vorhallen des Vorhofs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Säulengängen“ beziehungsweise einer anderen seitlichen Bauform; der hebräische Architekturbegriff ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Oder „den inneren Tempel“ beziehungsweise „das innere Heiligtum“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: Dann maß er
  rationale: Das Wayyiqtol führt die Abfolge der Vision weiter; „Dann“ gibt diesen erzählerischen Fortschritt in natürlichem Deutsch wieder.
- source_word: אֹרֶךְ הַבִּנְיָן
  choice: die Länge des Gebäudes
  rationale: Beide Wörter sind übliche, sachliche Bezeichnungen in einer architektonischen Maßangabe.
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: das der abgetrennten Fläche zugewandt war
  rationale: אֶל־פְּנֵי bezeichnet hier die räumliche Ausrichtung; הַגִּזְרָה meint im Kontext den abgesonderten Bereich hinter dem Tempelgebäude, ohne dass seine genaue bauliche Funktion sicher wäre.
- source_word: אֲשֶׁר עַל־אַחֲרֶיהָ
  choice: die hinter ihm lag
  rationale: Die Wendung lokalisiert die abgetrennte Fläche an der Rückseite des Gebäudes. Das deutsche Pronomen „ihm“ bezieht sich eindeutig auf das Gebäude.
- source_word: וְאַתִּיקֶיהָ
  choice: samt ihren Galerien
  rationale: Der seltene Architekturbegriff ist unsicher. „Galerien“ ist eine plausible, verständliche Wiedergabe; das feminine Suffix wird auf die abgetrennte Fläche bezogen. Die Unsicherheit wird in einer Fußnote ausgewiesen.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: auf der einen und auf der anderen Seite
  rationale: Die paarige deiktische Formel bezeichnet beide Seiten und bewahrt in dieser ausformulierten Fassung die räumliche Anschaulichkeit.
- source_word: מֵאָה אַמָּה
  choice: hundert Ellen
  rationale: Die antike Maßeinheit wird beibehalten, wie es für die Maßangaben der Tempelvision angemessen ist.
- source_word: הַהֵיכָל הַפְּנִימִי
  choice: die innere Tempelhalle
  rationale: הֵיכָל kann speziell die Haupthalle des Tempels bezeichnen. „Tempelhalle“ ist im Deutschen verständlicher als das fachsprachlichere „Schiff“ und grenzt den Raum vom gesamten Tempelkomplex ab.
- source_word: וְאֻלַמֵּי הֶחָצֵר
  choice: und die Vorhallen des Vorhofs
  rationale: אוּלָם bezeichnet einen vorgelagerten hallen- oder vestibülartigen Bauteil; „Vorhallen“ ist zugänglich und passt zum Plural.
theological_decisions: []
translation_notes:
  register: Moderne, sachlich-würdevolle Standardsprache. Die dichte architektonische Reihung des Hebräischen bleibt erkennbar, wird aber durch Relativsatz und „außerdem“ syntaktisch lesbar gemacht. Die ungewöhnliche Schlussreihe wird nicht theologisch oder baulich überpräzisiert.
