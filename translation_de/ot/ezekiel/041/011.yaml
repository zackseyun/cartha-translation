  text: וּ/פֶ֤תַח הַ/צֵּלָע֙ לַ/מֻּנָּ֔ח פֶּ֤תַח אֶחָד֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן וּ/פֶ֥תַח אֶחָ֖ד לַ/דָּר֑וֹם וְ/רֹ֨חַב֙ מְק֣וֹם הַ/מֻּנָּ֔ח חָמֵ֥שׁ אַמּ֖וֹת סָבִ֥יב סָבִֽיב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/011.yaml
  text: And the doorway of the side chamber was toward the free space[a], one doorway toward the north and one doorway toward the south; and the width of the free space was five cubits all around.
translation:
  language: de
  text: 'Und der Eingang der Seitenkammer führte zu der Freifläche[a]: ein Eingang nach Norden und ein Eingang nach Süden. Die Freifläche war ringsum fünf Ellen breit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „freie Fläche“ oder „offener Bereich“. Das hebräische Wort מֻנָּח bezeichnet hier wohl den um das Gebäude frei gelassenen Raum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶתַח
  choice: Eingang
  rationale: Bezeichnet hier die konkrete Zugangsöffnung einer Seitenkammer; „Eingang“ ist im modernen deutschen Architekturkontext natürlicher als „Türöffnung“.
- source_word: הַצֵּלָע
  choice: der Seitenkammer
  rationale: צֵלָע bezeichnet in der Tempelbeschreibung einen seitlich an den Hauptbau anschließenden Raum.
- source_word: לַמֻּנָּח / מְקוֹם הַמֻּנָּח
  choice: zu der Freifläche / die Freifläche
  rationale: Das substantivierte passive Element von נוח bezeichnet hier wahrscheinlich den um den Bau frei gelassenen Bereich. „Freifläche“ gibt den architektonischen Sinn knapp und verständlich wieder.
- source_word: דֶּרֶךְ הַצָּפוֹן / לַדָּרוֹם
  choice: nach Norden / nach Süden
  rationale: Die Wendungen geben die Richtung beziehungsweise Lage der beiden Eingänge an; die parallele deutsche Formulierung bewahrt die Symmetrie.
- source_word: רֹחַב
  choice: breit
  rationale: Die Maßangabe wird im Deutschen natürlich prädikativ mit „breit“ ausgedrückt.
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen
  rationale: Die alte Maßeinheit wird zur formalen Genauigkeit beibehalten.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Das deutsche „ringsum“ gibt den umfassenden, durch die hebräische Wiederholung verstärkten Sinn idiomatisch wieder.
