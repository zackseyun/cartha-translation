base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/017.yaml
  text: Above the doorway[a], and as far as the inner house, and outside, and on all the wall all around, in the inner part and in the outer part[b], were measurements.
translation:
  language: de
  text: Über dem Eingang und bis zum inneren Gebäude, draußen und an der ganzen Wand ringsum – innen und außen – waren Maße[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abmessungen«. Der hebräische Ausdruck kann Maße oder Maßangaben bezeichnen; der elliptische Satzbau an dieser Stelle ist schwer verständlich.'
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: עַל מֵעַל הַפֶּתַח
  choice: Über dem Eingang
  rationale: מֵעַל bezeichnet den Bereich oberhalb einer Öffnung; „Eingang“ ist im architektonischen Zusammenhang natürlich. Das zusätzliche עַל ist syntaktisch schwierig und wird nicht durch eine unnatürliche Doppelung wiedergegeben.
- source_word: וְעַד הַבַּיִת הַפְּנִימִי
  choice: und bis zum inneren Tempelraum
  rationale: בַּיִת bezeichnet in dieser Tempelvision häufig das Tempelgebäude oder einen dazugehörigen Innenbereich. „Tempelraum“ wahrt den baulichen Bezug, ohne einen bestimmten Raum genauer festzulegen.
- source_word: וְלַחוּץ
  choice: ebenso draußen
  rationale: חוּץ bezeichnet hier den Außenbereich im Gegensatz zu innen. „Ebenso“ gibt die koordinierende Fortführung idiomatisch wieder.
- source_word: וְאֶל כָּל הַקִּיר סָבִיב סָבִיב
  choice: und an der ganzen Wand ringsum
  rationale: אֶל bezeichnet hier die Beziehung zur Wandfläche. „ringsum“ gibt die emphatische Wiederholung von סָבִיב in natürlichem Deutsch wieder.
- source_word: בַּפְּנִימִי וּבַחִיצוֹן
  choice: innen wie außen
  rationale: Die substantivisch gebrauchten Adjektive unterscheiden Innen- und Außenseite beziehungsweise Innen- und Außenbereich. Die knappe deutsche Paarformel erhält diesen Gegensatz.
- source_word: מִדּוֹת
  choice: Maßangaben
  rationale: Der Plural bezeichnet Maße, Abmessungen oder maßliche Festlegungen. „Maßangaben“ passt zum architektonischen Kontext und lässt offen, in welcher Form sie vorlagen; das Verb „befanden sich“ ergänzt den elliptischen hebräischen Nominalsatz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die stark elliptische architektonische Aufzählung bleibt erkennbar, wird aber durch „befanden sich“ zu einem verständlichen deutschen Satz ergänzt. Die Fußnotenmarker stehen jeweils direkt bei dem erklärten Ausdruck.
