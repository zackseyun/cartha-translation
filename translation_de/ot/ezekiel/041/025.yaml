base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/025.yaml
  text: And cherubim and palm trees were made on them[a], on the doors of the nave, just as they were made on the walls[c][b]; and there was a wooden canopy before the front of the vestibule outside.
translation:
  language: de
  text: Auf ihnen, auf den Türen der Tempelhalle,[a] waren Kerubim und Palmen dargestellt,[b] so wie an den Wänden. Und außen an der Vorderseite der Vorhalle befand sich ein hölzerner Überbau.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Tempelraums“ oder „des Heiligtums“. Das hebräische Wort bezeichnet hier die Haupthalle des Tempelgebäudes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „waren auf ihnen eingeschnitzt“. Das hebräische Verb bedeutet allgemein „machen“; im Zusammenhang ist eine plastische oder geschnitzte Verzierung möglich.'
    reason: lexical_alternative
  - marker: c
    text: Der hier verwendete hebräische Ausdruck ist unsicher. Gemeint sein könnte ein hölzerner Vorsprung, ein Vordach oder ein ähnliches Bauteil an der Vorderseite der Vorhalle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשׂוּיָה אֲלֵיהֶן
  choice: waren auf ihnen dargestellt
  rationale: Die passive Form von עשה wird bewusst nicht auf „geschnitzt“ verengt; „dargestellt“ gibt im Zusammenhang der Tempelverzierung den Sinn natürlich wieder.
- source_word: דַּלְתוֹת הַהֵיכָל
  choice: Türen der Tempelhalle
  rationale: הֵיכָל bezeichnet hier die Haupthalle des Tempelgebäudes, nicht den gesamten Tempelbezirk.
- source_word: כְּרוּבִים
  choice: Kerubim
  rationale: Die im Deutschen herkömmliche, quellennah transliterierte Pluralform bezeichnet die geflügelten Tempelwesen.
- source_word: וְתִמֹרִים
  choice: und Palmen
  rationale: Das Wort bezeichnet in diesem dekorativen Zusammenhang Palmendarstellungen; die knappe Wiedergabe „Palmen“ ist verständlich und direkt.
- source_word: כַּאֲשֶׁר עֲשׂוּיִם לַקִּירוֹת
  choice: so wie an den Wänden
  rationale: Die Vergleichskonstruktion verbindet die Türverzierung mit der entsprechenden Gestaltung der Wände, ohne im Deutschen das bereits genannte Verb schwerfällig zu wiederholen.
- source_word: וְעָב עֵץ
  choice: ein hölzerner Überbau
  rationale: עָב ist als architektonischer Fachausdruck unsicher. „Überbau“ wahrt die Vorstellung eines vorspringenden hölzernen Bauteils, ohne dessen genaue Bauform festzulegen.
- source_word: אֶל פְּנֵי הָאוּלָם מֵהַחוּץ
  choice: außen vor der Vorderseite der Vorhalle
  rationale: Die Formulierung erhält sowohl die räumliche Beziehung אֶל־פְּנֵי als auch die ausdrückliche Außenangabe מֵהַחוּץ.
