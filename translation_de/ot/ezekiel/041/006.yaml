base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/006.yaml
  text: And the side chambers were side chamber upon side chamber[a], three and thirty times; and they entered into the wall that belonged to the house for the side chambers all around, so that they might be supported[b], but they were not supported by the wall of the house.
translation:
  language: de
  text: Die Seitenkammern waren Kammer an Kammer, dreiunddreißigmal[a]. Ringsum griffen sie in die Mauer ein, die zum Haus gehörte und für die Seitenkammern bestimmt war, damit sie befestigt waren[b]; doch sie waren nicht in der Mauer des Hauses befestigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „drei und dreißig Male“. Gemeint sein können dreiunddreißig Seitenkammern oder dreiunddreißig entsprechende Anordnungen; die genaue architektonische Bezugsgröße bleibt unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „festgehalten“ oder „gesichert“. Das hebräische Wort bezeichnet ein Festgehalten- oder Gesichertsein und legt die genaue bauliche Ausführung nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּלָעוֹת / צֵלָע
  choice: Seitenkammern / Kammer
  rationale: Im Zusammenhang der Tempelarchitektur bezeichnet צֵלָע seitliche Anbauten beziehungsweise Kammern, nicht wörtlich eine „Rippe“. Die distributive Wiederholung wird mit „Kammer an Kammer“ wiedergegeben.
- source_word: צֵלָע אֶל צֵלָע
  choice: Kammer an Kammer
  rationale: Die Wendung beschreibt die fortlaufende räumliche Anordnung. „An“ ist im Deutschen natürlich und lässt offen, ob die Kammern neben- oder übereinander angeordnet waren.
- source_word: שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
  choice: dreiunddreißigmal
  rationale: Dies gibt Zahl und פְּעָמִים unmittelbar wieder, ohne die unsichere Bezugsgröße ausdrücklich als Anzahl von Kammern festzulegen.
- source_word: וּבָאוֹת בַּקִּיר
  choice: griffen sie in die Mauer ein
  rationale: Das räumliche „Hineinkommen“ der Kammern in die Mauer wird architektonisch verständlich ausgedrückt, ohne die genaue Konstruktion näher zu bestimmen.
- source_word: בַּקִּיר אֲשֶׁר לַבַּיִת לַצְּלָעוֹת
  choice: in die Mauer, die am Haus für die Seitenkammern bestimmt war
  rationale: Die gestufte hebräische Zuordnung wird so wiedergegeben, dass diese Mauer von der abschließend genannten eigentlichen Hausmauer unterscheidbar bleibt.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Das verstärkte סָבִיב bezeichnet die umlaufende Anordnung; „ringsum“ ist knapp, natürlich und bewahrt den Nachdruck.
- source_word: לִהְיוֹת אֲחוּזִים
  choice: sodass sie Halt fanden
  rationale: Das passive אֲחוּזִים bezeichnet hier das Festgehalten- oder Gesichertsein. „Halt finden“ passt zum architektonischen Zusammenhang, ohne ausschließlich Traglast oder Befestigung zu behaupten.
- source_word: וְלֹא יִהְיוּ אֲחוּזִים בְּקִיר הַבָּיִת
  choice: doch in der Mauer des Hauses selbst waren sie nicht verankert
  rationale: 'Die Formulierung bewahrt den Gegensatz: Die Seitenkammern waren gesichert, aber nicht unmittelbar in der eigentlichen Tempelwand verankert. „Selbst“ verdeutlicht diese im Hebräischen angelegte Unterscheidung.'
