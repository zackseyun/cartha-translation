  text: The width of the wall that belonged to the side chambers on the outside was five cubits[a], and the open area between the side chambers of the house.
translation:
  language: de
  text: Die Breite der Außenmauer der Seitenkammern betrug fünf Ellen. Der freigelassene Raum war der Seitenkammerbau, der zum Tempelhaus gehörte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut der Schlussklausel ist schwierig. Sie kann auch etwa bedeuten: „Was freigelassen war, gehörte zum Seitenkammerbau des Tempelhauses.“ Die Stelle beschreibt die Anlage um das Tempelgebäude.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹחַב הַקִּיר
  choice: Die Außenwand … war … breit
  rationale: Die nominale Maßangabe wird in natürliches deutsches Architekturidiom überführt; הַקִּיר bezeichnet die Wand, deren Breite angegeben wird.
- source_word: אֲשֶׁר לַצֵּלָע
  choice: an den Seitenkammern
  rationale: צֵלָע bezeichnet im Tempelkontext die seitlich angebauten Kammern; der Singular kann kollektiv verstanden werden.
- source_word: אֶל הַחוּץ
  choice: Außenwand
  rationale: Die nach außen gerichtete Lage wird knapp und idiomatisch im zusammengesetzten Substantiv ausgedrückt.
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen
  rationale: Die antike Maßeinheit bleibt erhalten; „Elle“ ist die etablierte deutsche Wiedergabe von אַמָּה.
- source_word: וַאֲשֶׁר מֻנָּח
  choice: Daneben lag die freie Fläche
  rationale: מֻנָּח bezeichnet hier wahrscheinlich etwas Freigelassenes beziehungsweise einen freien Raum. „Daneben“ stellt den räumlichen Anschluss her, ohne das im Hebräischen nicht ausdrücklich vorhandene „zwischen“ einzutragen.
- source_word: בֵּית צְלָעוֹת
  choice: Seitenkammerbau
  rationale: בֵּית צְלָעוֹת kann als Bauwerk oder Komplex der Seitenkammern verstanden werden. Das deutsche Kompositum bewahrt diesen baulichen Sinn.
- source_word: אֲשֶׁר לַבָּיִת
  choice: des Tempelhauses
  rationale: בַּיִת meint im Zusammenhang das eigentliche Tempelgebäude; „Tempelhaus“ macht den Bezug klar und bewahrt zugleich das Bild des Hauses.
