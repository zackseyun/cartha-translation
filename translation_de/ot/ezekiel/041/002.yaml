  text: 'And the width of the entrance was ten cubits[a], and the sidewalls of the entrance were five cubits on this side and five cubits on that side. Then he measured its length: forty cubits, and the width: twenty cubits.'
translation:
  language: de
  text: 'Die Breite des Eingangs betrug zehn Ellen, und die Seitenwände des Eingangs[a] waren fünf Ellen auf der einen und fünf Ellen auf der anderen Seite. Dann maß er die Länge: vierzig Ellen, und die Breite: zwanzig Ellen.'
