  naturalness: Die Übersetzung ist insgesamt klar und angemessen knapp. »Schulterstücke des Eingangs« wirkt im modernen Standarddeutsch jedoch künstlich. Außerdem kann »seine Länge« nach dem unmittelbar vorausgehenden maskulinen »Eingang« missverständlich auf den Eingang bezogen werden. Die elliptische deutsche Messformel ohne dieses Pronomen ist natürlich und vermeidet die Fehlzuordnung.
  terminology: »Elle« ist die richtige traditionelle Maßeinheit. »Eingang« ist als Wiedergabe von פֶּתַח vertretbar. Für כִּתְפוֹת ist »Seitenwände« im Kontext besser als »Schulterstücke«; die Fußnote wahrt die wörtliche Bedeutung »Schultern«.
