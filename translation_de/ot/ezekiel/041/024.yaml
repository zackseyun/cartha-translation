  text: וּ/שְׁתַּ֥יִם דְּלָת֖וֹת לַ/דְּלָת֑וֹת שְׁ֚תַּיִם מוּסַבּ֣וֹת דְּלָת֔וֹת שְׁ֚תַּיִם לְ/דֶ֣לֶת אֶחָ֔ת וּ/שְׁתֵּ֥י דְלָת֖וֹת לָ/אַחֶֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/024.yaml
  text: 'And the doors had two leaves each[a], two turning leaves: two leaves for the one door and two leaves for the other.'
translation:
  language: de
  text: 'Und die Türen hatten je zwei Flügel[a], zwei drehbare Flügel: zwei Flügel hatte die eine Tür und zwei die andere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „je zwei schwenkbare Flügel“ oder „je zwei Faltflügel“. Das hebräische Wort beschreibt Flügel, die sich drehen lassen, ohne den genauen Mechanismus zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּלָתוֹת / דֶּלֶת
  choice: Türen / Tür / Flügel
  rationale: דלת kann je nach Zusammenhang die ganze Tür oder einen einzelnen Türflügel bezeichnen. Da der Vers zwischen den beiden Türen und ihren jeweils paarweise gezählten beweglichen Teilen unterscheidet, werden die Gesamtgebilde mit „Türen“ und die Teile mit „Flügel“ wiedergegeben.
- source_word: מוּסַבּוֹת
  choice: drehbare
  rationale: Das Wort bezeichnet etwas, das gedreht oder geschwenkt werden kann. „Drehbar“ wahrt diese allgemeine architektonische Aussage, ohne einen bestimmten Beschlag oder Faltmechanismus vorauszusetzen.
- source_word: שְׁתַּיִם ... שְׁתַּיִם ... שְׁתַּיִם ... וּשְׁתֵּי
  choice: zwei ... zwei ... zwei ... zwei
  rationale: Die wiederholte Zweizahl bleibt ausdrücklich erhalten und gibt den vermessenden, architektonischen Stil sowie die paarweise Bauweise wieder.
- source_word: לַדְּלָתוֹת
  choice: die Türen hatten
  rationale: Die Präposition ל wird hier im Deutschen idiomatisch als Zuordnung beziehungsweise Besitz ausgedrückt; ein wörtliches „für die Türen“ wäre missverständlich und schwerfällig.
- source_word: לְדֶלֶת אֶחָת ... לָאַחֶרֶת
  choice: die eine Tür ... die andere
  rationale: 'Die Formulierung verteilt die Flügel auf die beiden zuvor genannten Türen: Die eine hatte zwei, die andere ebenfalls zwei.'
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die bewusste Wiederholung von „zwei“ bewahrt den sachlich-architektonischen Rhythmus des Hebräischen; „Flügel“ ist im unmittelbaren Türkontext klar und vermeidet die schwerere Wiederholung von „Türflügel“.
