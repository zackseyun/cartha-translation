base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/013.yaml
  text: 'Then he measured the temple: its length was a hundred cubits; and the separate area[a], the building, and its walls had a length of a hundred cubits.'
translation:
  language: de
  text: 'Dann maß er den Tempel: Er war hundert Ellen lang. Der abgetrennte Bereich[a], das Gebäude und dessen Mauern waren hundert Ellen lang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der abgesonderte Ort“. Der hebräische Ausdruck bezeichnet einen eigenständigen, innerhalb der Tempelanlage abgetrennten Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: Dann maß er
  rationale: Das mit waw fortgeführte Verb führt die Abfolge der Messungen weiter; „Dann“ gibt diesen erzählerischen Fortschritt in natürlichem Deutsch wieder.
- source_word: הַבַּיִת
  choice: den Tempel
  rationale: Im Zusammenhang von Hesekiels Tempelvision bezeichnet בַּיִת hier nicht ein gewöhnliches Haus, sondern den Tempelbau.
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: war hundert Ellen lang
  rationale: Die hebräische Maßangabe wird idiomatisch wiedergegeben; die antike Maßeinheit bleibt als „Ellen“ erhalten und wird nicht in ein modernes Maß umgerechnet.
- source_word: הַגִּזְרָה
  choice: der abgetrennte Bereich
  rationale: Der Ausdruck bezeichnet hier einen innerhalb der Tempelanlage ausgesonderten, eigenständigen Bereich. „Bereich“ bleibt räumlich offen und vermeidet eine nicht ausdrücklich belegte Präzisierung.
- source_word: הַבִּנְיָה
  choice: das Gebäude
  rationale: Das Substantiv bezeichnet ein errichtetes Bauwerk; „Gebäude“ ist im architektonischen Zusammenhang klar und gegenwärtig.
- source_word: קִירוֹתֶיהָ
  choice: seine Mauern
  rationale: Der feminine Singularsuffix verweist auf ein vorausgehendes feminines Bezugswort. Im Deutschen gibt „seine Mauern“ die naheliegende Zuordnung zum Gebäude wieder, ohne die Mauern als bloße Wandflächen zu verengen.
