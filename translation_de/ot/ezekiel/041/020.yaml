source:
  edition: WLC
  text: מֵ/הָ/אָ֨רֶץ֙ עַד מֵ/עַ֣ל הַ/פֶּ֔תַח הַ/כְּרוּבִ֥ים וְ/הַ/תִּֽמֹרִ֖ים עֲשׂוּיִ֑ם וְ/קִ֖יר הַׄ/הֵׄיׄכָֽׄלׄ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/020.yaml
  text: From the floor to above the entrance[a], cherubim and palm trees were made[b], and on the wall of the nave.
translation:
  language: de
  text: Vom Fußboden bis über den Eingang waren Kerubim und Palmen dargestellt, ebenso an der Wand der Tempelhalle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz endet knapp und ungewöhnlich: wörtlich etwa „und die Wand der Tempelhalle“. Gemeint ist wahrscheinlich, dass die Verzierungen auch an dieser Wand angebracht waren.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: מֵהָאָרֶץ
  choice: Vom Fußboden
  rationale: אֶרֶץ bedeutet gewöhnlich „Erde“ oder „Land“; im architektonischen Zusammenhang bezeichnet es hier jedoch die untere Fläche des Raumes. „Fußboden“ gibt diesen Sinn im modernen Deutschen klar wieder.
- source_word: עַד מֵעַל הַפֶּתַח
  choice: bis über den Eingang
  rationale: Die Wendung bezeichnet die senkrechte Ausdehnung der Verzierung; „Eingang“ ist hier natürlich und bewahrt den architektonischen Bezug.
- source_word: הַכְּרוּבִים
  choice: Kerubim
  rationale: „Kerubim“ ist die eingebürgerte biblische Bezeichnung und vermeidet die unpassenden neuzeitlichen Vorstellungen, die „Putten“ oder umgangssprachliche „Engelchen“ wecken könnten.
- source_word: וְהַתִּמֹרִים
  choice: und Palmen
  rationale: Das Substantiv bezeichnet Palmbaumgestalten als Schmuckmotive. „Palmen“ ist direkt und im Kontext hinreichend eindeutig.
- source_word: עֲשׂוּיִם
  choice: waren … dargestellt
  rationale: Das passive Partizip besagt allgemein, dass die Figuren angefertigt beziehungsweise ausgeführt waren. „Dargestellt“ passt idiomatisch zu den bildlichen Motiven, ohne eine bestimmte Herstellungstechnik wie Schnitzen festzulegen.
- source_word: וְקִיר הַהֵיכָל
  choice: ebenso an der Wand der Tempelhalle
  rationale: Der knappe, verblos angeschlossene hebräische Ausdruck ist syntaktisch schwierig. „Ebenso an“ ergänzt den aus dem Zusammenhang naheliegenden Bezug der Verzierungen auf die Wand. הֵיכָל bezeichnet hier die Haupthalle des Tempelgebäudes, nicht die gesamte Anlage.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die architektonische Fachbedeutung von הֵיכָל wird mit „Tempelhalle“ verständlich wiedergegeben. Die ungewöhnlich knappe Schlusswendung wird im Text lesbar ergänzt und in der Fußnote transparent gemacht.
