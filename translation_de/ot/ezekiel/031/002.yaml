  text: 'Menschensohn, sag zum Pharao, dem König von Ägypten, und zu seiner Menge: Wem gleichst du in deiner Größe?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Menschensohn
  rationale: Die in Ezechiel feste Anrede wird knapp und traditionsnah wiedergegeben; im Kontext bezeichnet sie den menschlichen Propheten.
- source_word: הֲמוֹנוֹ
  choice: seiner Menge
  rationale: הָמוֹן kann Menschenmenge, Gefolge oder große Schar bezeichnen. „Menge“ bewahrt die Breite des Ausdrucks, ohne ihn vorschnell auf Heer oder Bevölkerung einzuengen.
- source_word: דָּמִיתָ
  choice: gleichst du
  rationale: Das Verb bezeichnet hier das Ähnlichsein beziehungsweise Vergleichbarsein und leitet den folgenden Vergleich ein.
- source_word: בְגָדְלֶךָ
  choice: in deiner Größe
  rationale: Die Form bezeichnet Größe oder Großartigkeit; die wörtlich-nahe Wiedergabe erhält die mögliche Spannung zwischen Macht, Ausmaß und Hoheit.
theological_decisions:
- issue: Bezugsgröße der rhetorischen Frage
  choice: „Wem gleichst du …?“ lässt die angesprochene Vergleichsperson offen.
  alternative: „Mit wem bist du … zu vergleichen?“
  rationale: Der hebräische Text fragt direkt nach dem Gegenüber des Vergleichs. Die knappe Form bewahrt die rhetorische Spannung, die im anschließenden Bild entfaltet wird.
translation_notes:
  register: Moderne, würdige Standardsprache. „Sag“ ist natürlich und direkt; die Apposition „dem König von Ägypten“ verdeutlicht die syntaktische Zuordnung. Keine Fußnoten erforderlich.
