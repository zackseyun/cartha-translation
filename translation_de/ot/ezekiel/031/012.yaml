source:
  edition: WLC
  text: וַ/יִּכְרְתֻ֧/הוּ זָרִ֛ים עָרִיצֵ֥י גוֹיִ֖ם וַֽ/יִּטְּשֻׁ֑/הוּ אֶל הֶ֠/הָרִים וּ/בְ/כָל גֵּ֨אָי֜וֹת נָפְל֣וּ דָלִיּוֹתָ֗י/ו וַ/תִּשָּׁבַ֤רְנָה פֹֽארֹתָי/ו֙ בְּ/כֹל֙ אֲפִיקֵ֣י הָ/אָ֔רֶץ וַ/יֵּרְד֧וּ מִ/צִּלּ֛/וֹ כָּל עַמֵּ֥י הָ/אָ֖רֶץ וַֽ/יִּטְּשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/012.yaml
  text: Foreigners[a], the ruthless of the nations, cut it down and left it. Its branches fell on the mountains and in every valley, and its boughs were broken in all the channels of the land[c][b]. Then all the peoples of the earth went down from its shade and left it.
translation:
  language: de
  text: Fremde, die Gewalttätigen der Nationen, fällten ihn und ließen ihn liegen.[a] Seine Äste fielen auf die Berge und in alle Täler; seine Zweige zerbrachen in allen Bachbetten des Landes.[b] Da stiegen alle Völker der Erde aus seinem Schatten herab und verließen ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gaben ihn preis“. Dasselbe hebräische Verb steht am Ende des Verses nochmals.'
    reason: lexical_alternative
  - marker: b
    text: „Bachbetten“ kann auch mit „Wasserrinnen“ oder „Schluchten“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתֻהוּ
  choice: fällten ihn
  rationale: כרת bezeichnet im durchgehenden Baumbild das Fällen. Das maskuline Pronomen bewahrt im Deutschen sowohl den Bezug auf den Baum als auch die mögliche politische Bezugsperson.
- source_word: זָרִים
  choice: Fremde
  rationale: זָרִים bezeichnet hier auswärtige bzw. fremde Angreifer; „Fremde“ ist knapp und im militärisch-nationalen Zusammenhang verständlich.
- source_word: עָרִיצֵי גוֹיִם
  choice: die Gewalttätigen unter den Nationen
  rationale: עָרִיץ bezeichnet gewalttätige, rücksichtslose oder tyrannische Menschen. Der hebräische Ausdruck enthält keinen ausdrücklichen Superlativ; „unter den Nationen“ gibt die Zugehörigkeit natürlich wieder.
- source_word: וַיִּטְּשֻׁהוּ
  choice: ließen ihn liegen / verließen ihn
  rationale: נטש bedeutet verlassen, preisgeben oder liegen lassen. Die kontextgerechte Variation macht beim gefällten Baum zunächst das Zurücklassen und am Versende den Weggang der Völker deutlich, ohne die gemeinsame Grundbedeutung aufzugeben.
- source_word: דָלִיּוֹתָיו / פֹארֹתָיו
  choice: seine Äste / seine Zweige
  rationale: Die beiden unterschiedlichen Bezeichnungen für Baumteile werden durch zwei geläufige deutsche Wörter unterschieden, ohne eine unsichere Größenabstufung festzuschreiben.
- source_word: אֲפִיקֵי הָאָרֶץ
  choice: Bachbetten des Landes
  rationale: אֲפִיקִים bezeichnet Rinnen, Wasserläufe oder Bachbetten. „Bachbetten“ ist im topografischen Bild konkret und natürlich.
- source_word: וַיֵּרְדוּ מִצִּלּוֹ
  choice: zogen aus seinem Schatten fort
  rationale: Die wörtliche Abwärtsbewegung von ירד klingt mit „zogen“ weniger deutlich an, doch die Konstruktion bezeichnet hier das Verlassen des Schutzbereichs unter dem gefallenen Baum; „fort“ bewahrt die Bewegung.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: Der internationale Rahmen spricht für „Erde“; עַמִּים wird präzise mit „Völker“ wiedergegeben.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe im Baumbild
  choice: Maskuline Pronomen („ihn“, „seinem“) verwenden
  alternative: Das politische Bezugsobjekt ausdrücklich als Assyrien oder seinen Herrscher benennen
  rationale: Im Deutschen ist „Baum“ maskulin, sodass die hebräischen Suffixe natürlich wiedergegeben werden können, ohne zwischen Baum, Assyrien und Herrscher ausdrücklich zu entscheiden. So bleibt die Spannung der Metapher erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ausgedehnte Baumbild bleibt erhalten; die Formulierungen vermeiden einen im Hebräischen nicht ausdrücklich markierten Superlativ und lösen den politischen Referenten nicht unnötig auf.
