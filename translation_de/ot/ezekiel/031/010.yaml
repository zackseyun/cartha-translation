source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֕עַן אֲשֶׁ֥ר גָּבַ֖הְתָּ בְּ/קוֹמָ֑ה וַ/יִּתֵּ֤ן צַמַּרְתּ/וֹ֙ אֶל בֵּ֣ין עֲבוֹתִ֔ים וְ/רָ֥ם לְבָב֖/וֹ בְּ/גָבְהֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/010.yaml
  text: 'Therefore thus says the Lord GOD: Because you grew tall in stature[a], and set your top among the thick boughs, and his heart was lifted up in his height,'
translation:
  language: de
  text: 'Darum, so spricht GOTT, der Herr: Weil du hoch gewachsen bist und er seinen Wipfel in dichtes Gezweig setzte und sein Herz sich in seiner Höhe erhob,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die im Deutschen geläufige Wiedergabe des doppelten Gottesnamens bewahrt beide Bestandteile, ohne das unnatürliche »Herr HERR« zu bilden.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet in natürlichem modernem Deutsch den Grund für das folgende Gericht ein.
- source_word: גָּבַהְתָּ בְּקוֹמָה
  choice: du so hoch gewachsen bist
  rationale: Bewahrt das konkrete Bild des hochgewachsenen Baumes; »so« gibt die hervorgehobene Höhe idiomatisch wieder.
- source_word: וַיִּתֵּן צַמַּרְתּוֹ
  choice: und er seinen Wipfel … setzte
  rationale: נתן hat hier die Bedeutung »setzen/platzieren«; צַמֶּרֶת bezeichnet den obersten Teil eines Baumes. Die dritte Person des hebräischen Suffixes wird beibehalten.
- source_word: אֶל בֵּין עֲבוֹתִים
  choice: zwischen das dichte Gezweig
  rationale: עֲבוֹתִים bezeichnet hier am unmittelbarsten dicht verflochtene Äste beziehungsweise dichtes Laubwerk. Die mögliche kontextuelle Deutung als »Wolken« wird in der Fußnote genannt.
- source_word: וְרָם לְבָבוֹ
  choice: und sein Herz … überheblich wurde
  rationale: Gibt die hebräische Höhenmetapher verständlich als innere Selbstüberhebung wieder, während der Zusammenhang mit der äußeren Höhe im folgenden Ausdruck erhalten bleibt.
- source_word: בְּגָבְהוֹ
  choice: wegen seiner Höhe
  rationale: 'Drückt den naheliegenden kausalen Zusammenhang aus: Seine außergewöhnliche Höhe führte zur Überheblichkeit.'
theological_decisions:
- issue: Wechsel der grammatischen Person
  choice: Den Wechsel von der zweiten Person (»du«) zur dritten Person (»er/sein«) beibehalten.
  alternative: Alle Bezüge einheitlich in der zweiten oder dritten Person wiedergeben.
  rationale: Der masoretische Text wechselt ausdrücklich von גָּבַהְתָּ zur dritten Person in צַמַּרְתּוֹ und לְבָבוֹ. Eine Angleichung würde eine echte Spannung des Ausgangstextes verdecken.
- issue: Bildsprache von Höhe und Hochmut
  choice: Die körperliche Höhe des Baumes und die daraus erwachsende innere Überheblichkeit sprachlich miteinander verbinden.
  alternative: רָם לְבָבוֹ wörtlicher mit »sein Herz erhob sich« wiedergeben.
  rationale: »Überheblich wurde« vermittelt den idiomatischen Sinn klar, ohne den im Text angelegten Zusammenhang zwischen Größe und Stolz aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt offen, da der mit »Weil« eingeleitete Begründungssatz im folgenden Vers fortgesetzt wird. Der auffällige Personenwechsel des Hebräischen wird bewusst nicht geglättet.
