source:
  edition: WLC
  text: לְמַ֡עַן אֲשֶׁר֩ לֹא יִגְבְּה֨וּ בְ/קוֹמָתָ֜/ם כָּל עֲצֵי מַ֗יִם וְ/לֹֽא יִתְּנ֤וּ אֶת צַמַּרְתָּ/ם֙ אֶל בֵּ֣ין עֲבֹתִ֔ים וְ/לֹֽא יַעַמְד֧וּ אֵלֵי/הֶ֛ם בְּ/גָבְהָ֖/ם כָּל שֹׁ֣תֵי מָ֑יִם כִּֽי כֻלָּ/ם֩ נִתְּנ֨וּ לַ/מָּ֜וֶת אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֛וֹךְ בְּנֵ֥י אָדָ֖ם אֶל י֥וֹרְדֵי בֽוֹר־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/014.yaml
  text: so that all the trees by the waters may not grow tall in their height[a], and may not set their treetop among the clouds, and that none of the water-drinkers may stand over them in their height; for all of them are given over to death, to the land below, among the sons of man[b], with those who go down to the pit.
translation:
  language: de
  text: damit sich keiner der Bäume am Wasser in seinem Wuchs hoch erhebt, keiner seinen Wipfel zwischen die Wolken[a] setzt und keiner von denen, die Wasser trinken, in seiner Höhe über ihnen steht[b]. Denn sie alle sind dem Tod preisgegeben, dem Land tief unten, mitten unter den Menschen, bei denen, die in die Grube hinabsteigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mitten in das dichte Gezweig“ beziehungsweise „in das dichte Laub“. Das hebräische עֲבֹתִים kann sowohl auf dichte Bewölkung als auch auf dichtes Wachstum bezogen werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Satz ist knapp und schwer zu deuten. Möglich ist auch: „ihnen an Höhe gleichkommt“ oder „in seiner Höhe neben ihnen steht“. Gemeint sind offenbar andere gut bewässerte Bäume, die sich nicht ebenso hoch erheben sollen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise Folgebeziehung knapp und idiomatisch wieder.
- source_word: יִגְבְּהוּ בְקוֹמָתָם
  choice: sich wegen seines hohen Wuchses überhebt
  rationale: Verbindet das Bild des hohen Baumwuchses mit dem im Kontext mitschwingenden Gedanken stolzer Selbsterhöhung, ohne die Baum-Metapher aufzulösen.
- source_word: כָּל עֲצֵי מַיִם
  choice: keiner von all den Bäumen am Wasser
  rationale: Die hebräische Wendung bezeichnet vom Wasser versorgte Bäume. Die deutsche Formulierung ist natürlich und bewahrt das konkrete Bild.
- source_word: יִתְּנוּ אֶת צַמַּרְתָּם
  choice: seinen Wipfel … streckt
  rationale: צַמֶּרֶת ist der oberste Teil beziehungsweise Wipfel eines Baumes. „Streckt“ gibt in diesem Zusammenhang die zielgerichtete Bewegung idiomatisch wieder.
- source_word: אֶל בֵּין עֲבֹתִים
  choice: bis zwischen die Wolken
  rationale: עֲבֹתִים kann hier Wolkenmassen bezeichnen und passt zum Bild extremer Höhe. Die ebenfalls mögliche Deutung als dichtes Gezweig wird in einer Fußnote erhalten.
- source_word: שֹׁתֵי מָיִם
  choice: all denen, die Wasser trinken
  rationale: Die wörtliche Metapher bleibt sichtbar und wird nicht vorschnell auf Bäume, Herrscher oder Völker festgelegt.
- source_word: וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם
  choice: in seiner Höhe über ihnen steht
  rationale: Die schwierige, stark verdichtete Wendung wird nahe am Wortlaut wiedergegeben. Das Verhältnis von אֵלֵיהֶם zu „stehen“ und „Höhe“ bleibt unsicher und wird in der Fußnote erläutert.
- source_word: כִּי כֻלָּם נִתְּנוּ לַמָּוֶת
  choice: Denn sie alle sind dem Tod preisgegeben
  rationale: Gibt die passive Bedeutung von נתן als Auslieferung beziehungsweise Bestimmung zum Tod in würdigem, natürlichem Deutsch wieder.
- source_word: אֶל אֶרֶץ תַּחְתִּית
  choice: dem Land tief unten
  rationale: Bewahrt das räumliche Abstiegsbild, ohne daraus einen dogmatischen Fachbegriff für das Jenseits zu machen.
- source_word: בְּתוֹךְ בְּנֵי אָדָם
  choice: mitten unter den Menschenkindern
  rationale: „Menschenkinder“ bewahrt die hebräische Ausdrucksform und bezeichnet hier die sterbliche Menschheit insgesamt.
- source_word: אֶל יֹרְדֵי בוֹר
  choice: bei denen, die in die Grube hinabsteigen
  rationale: „Grube“ erhält das hebräische Todes- und Unterweltsbild sowie seine intertextuellen Bezüge.
theological_decisions:
- issue: Selbsterhöhung in יִגְבְּהוּ בְקוֹמָתָם
  choice: sich wegen seines hohen Wuchses überhebt
  alternative: in seinem Wuchs nicht hoch wird
  rationale: Der Zusammenhang behandelt die Höhe des Baumes zugleich als Bild für die Überheblichkeit mächtiger Herrscher oder Völker. Die gewählte Fassung hält beide Ebenen zusammen, ohne den Referenten ausdrücklich festzulegen.
- issue: Anthropologische Wendung בְּנֵי אָדָם
  choice: unter den Menschenkindern
  alternative: unter den Menschen / unter den Sterblichen
  rationale: Die gewählte Form bewahrt die konkrete hebräische Wendung und ihre Betonung menschlicher Sterblichkeit, ohne sie ausschließlich auf männliche Personen zu beziehen.
- issue: אֶרֶץ תַּחְתִּית als Todesbereich
  choice: Land tief unten
  alternative: Unterwelt
  rationale: Die räumliche Metapher des Abstiegs bleibt erhalten; eine stärker systematisierende Vorstellung vom Zustand nach dem Tod wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarer Baum-Metaphorik. Die Wiederholung von „keiner“ macht den langen hebräischen Zwecksatz im Deutschen verständlich. „Menschenkinder“ ist bewusst bibelsprachlich, aber weiterhin allgemein verständlich; technische oder konfessionell festgelegte Jenseitsbegriffe werden vermieden.
