  to: Wem warst du gleich an Herrlichkeit und Größe unter den Bäumen Edens? Und doch wirst du zusammen mit den Bäumen Edens in das Land der Tiefe[a] hinabgebracht. Mitten unter Unbeschnittenen wirst du zusammen mit den vom Schwert Erschlagenen liegen. Das ist der Pharao mit seiner ganzen Schar – Ausspruch des Herrn, Jahwes.
