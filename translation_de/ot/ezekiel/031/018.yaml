    rationale: אֶת bei תִּשְׁכַּב bezeichnet hier das Liegen zusammen mit den Schwertgetöteten. „zusammen mit den vom Schwert Erschlagenen“ macht dies unmittelbar deutlich und ist idiomatischer.
  - severity: low
    issue: In „Ausspruch des Herrn Jahwe“ bleibt die Zuordnung von Titel und Gottesname ohne appositionelle Zeichensetzung etwas uneindeutig.
    rationale: „Ausspruch des Herrn, Jahwes“ kennzeichnet im Deutschen klar, dass „Jahwe“ den mit „Herr“ wiedergegebenen Titel näher bestimmt.
