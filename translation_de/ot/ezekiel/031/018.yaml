source:
  edition: WLC
  text: אֶל מִ֨י דָמִ֥יתָ כָּ֛כָה בְּ/כָב֥וֹד וּ/בְ/גֹ֖דֶל בַּ/עֲצֵי עֵ֑דֶן וְ/הוּרַדְתָּ֨ אֶת עֲצֵי עֵ֜דֶן אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֨וֹךְ עֲרֵלִ֤ים תִּשְׁכַּב֙ אֶת חַלְלֵי חֶ֔רֶב ה֤וּא פַרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/018.yaml
  text: Whom were you like in glory and greatness among the trees of Eden? Yet you shall be brought down with the trees of Eden to the land below; you shall lie among the uncircumcised, with those slain by the sword. This is Pharaoh and all his multitude[a], declares the Lord GOD.
translation:
  language: de
  text: Wem warst du gleich an Herrlichkeit und Größe unter den Bäumen Edens? Und doch wirst du zusammen mit den Bäumen Edens in das Land der Tiefe[a] hinabgebracht. Mitten unter Unbeschnittenen wirst du zusammen mit den vom Schwert Erschlagenen liegen. Das ist der Pharao mit seiner ganzen Schar – Ausspruch des Herrn, Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in das untere Land“ oder „in die Unterwelt“. Das Hebräische bezeichnet den Bereich unten, den Ort der Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל מִי דָמִיתָ כָּכָה
  choice: Wem warst du gleich
  rationale: Die rhetorische Vergleichsfrage und die direkte Anrede bleiben erhalten. כָּכָה verstärkt den Vergleich, wird im Deutschen aber natürlich in die Formulierung aufgenommen, statt mit einem schwerfälligen „so“ eigens wiedergegeben zu werden.
- source_word: בְּכָבוֹד וּבְגֹדֶל
  choice: an Herrlichkeit und Größe
  rationale: Die Wendung bewahrt sowohl den Glanz als auch die umfassende Größe beziehungsweise Bedeutung des dargestellten Herrschers.
- source_word: בַּעֲצֵי עֵדֶן
  choice: unter den Bäumen Edens
  rationale: Die Baummetapher des Kapitels wird unverändert beibehalten; „unter“ gibt die Einordnung innerhalb der Gruppe idiomatisch wieder.
- source_word: וְהוּרַדְתָּ אֶת עֲצֵי עֵדֶן
  choice: Und doch wirst du zusammen mit den Bäumen Edens … hinabgebracht
  rationale: Das Hophal wird passiv wiedergegeben. אֶת wird hier komitativ verstanden; „zusammen mit“ macht deutlich, dass Pharao dasselbe Schicksal wie die Bäume Edens trifft.
- source_word: אֶרֶץ תַּחְתִּית
  choice: das Land der Tiefe
  rationale: Die räumliche Vorstellung eines unten gelegenen Totenreichs bleibt erhalten, ohne sie vorschnell mit einem später geprägten theologischen Fachbegriff gleichzusetzen.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: mitten unter Unbeschnittenen
  rationale: Die Formulierung erhält sowohl בְּתוֹךְ als auch die im Kontext schmachvolle Bezeichnung „Unbeschnittene“.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: bei denen, die vom Schwert erschlagen wurden
  rationale: Die komitative Zuordnung wird im Deutschen mit „bei“ natürlich ausgedrückt; die gewaltsame Todesart bleibt ausdrücklich genannt.
- source_word: הוּא פַרְעֹה וְכָל הֲמוֹנוֹ
  choice: Das ist der Pharao mit seiner ganzen Schar
  rationale: Der abschließende Identifikationssatz wird direkt wiedergegeben. „Schar“ bezeichnet die gesamte zu ihm gehörende Menschenmenge, ohne unnötig auf Heer, Volk oder Reichtum festgelegt zu sein.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: נְאֻם wird als prophetische Ausspruchsformel kenntlich gemacht; אֲדֹנָי wird mit „Herr“ und der Gottesname יהוה mit der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von אֶרֶץ תַּחְתִּית
  choice: das Land der Tiefe
  alternative: die Unterwelt; das Land tief unten
  rationale: Die Wendung verweist im Zusammenhang auf den Bereich der Toten. Die gewählte Fassung bewahrt das Abwärtsbild und lässt die genaue Vorstellung dieses Bereichs offen.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der Herr; der Herr, der HERR
  rationale: Die Fassung unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und vermeidet eine doppelte Wiedergabe als „Herr“.
- issue: Prophetischer Zeitbezug von וְהוּרַדְתָּ
  choice: wirst du … hinabgebracht
  alternative: bist du … hinabgebracht worden
  rationale: Die Perfektform steht im Gerichtswort mit zukünftigem beziehungsweise sicher angekündigtem Sinn. Die Zukunftsform passt zur anschließenden Imperfektform „wirst du … liegen“, ohne die prophetische Gewissheit abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener Baummetapher und direkter prophetischer Anrede. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung, die er erläutert.
