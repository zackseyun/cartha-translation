  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „zusammen mit den vom Schwert Erschlagenen“ ist für die im Hebräischen ausgedrückte Gemeinschaft klarer und flüssiger als „bei denen, die vom Schwert erschlagen wurden“. Die Apposition in der Gottesbezeichnung wird im Deutschen durch Kommas eindeutig und lesbar markiert.
  terminology: „Herrlichkeit“, „Größe“, „Unbeschnittene“ und „Pharao“ sind angemessen. „Jahwe“ gibt den Gottesnamen wieder, während „Herr“ אַדֹנָי entspricht. Die Fußnote bewahrt die lexikalische Offenheit von אֶרֶץ תַּחְתִּית.
