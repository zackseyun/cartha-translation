  text: אֲרָזִ֣ים לֹֽא עֲמָמֻ/הוּ֮ בְּ/גַן אֱלֹהִים֒ בְּרוֹשִׁ֗ים לֹ֤א דָמוּ֙ אֶל סְעַפֹּתָ֔י/ו וְ/עַרְמֹנִ֥ים לֹֽא הָי֖וּ כְּ/פֹֽארֹתָ֑י/ו כָּל עֵץ֙ בְּ/גַן אֱלֹהִ֔ים לֹא דָמָ֥ה אֵלָ֖י/ו בְּ/יָפְיֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
translation:
  language: de
  text: Zedern überschatteten ihn nicht im Garten Gottes[a]; Zypressen kamen seinen Ästen nicht gleich, und Platanen waren nicht wie seine Zweige[b]. Kein Baum im Garten Gottes kam ihm an Schönheit gleich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Gottes Garten“. Wörtlich steht im Hebräischen „im Garten Gottes“, eine Wendung, die an Eden erinnert.'
    reason: lexical_alternative
  - marker: b
    text: „Platanen“ ist wahrscheinlich gemeint; traditionell wird auch „Kastanien“ übersetzt.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָזִים
  choice: Zedern
  rationale: Die übliche und im poetischen Baumvergleich natürliche Wiedergabe des Plurals von אֶרֶז.
- source_word: עֲמָמֻהוּ
  choice: überragten ihn nicht
  rationale: Das Verb kann ein Verdunkeln oder Verbergen bezeichnen. Im Zusammenhang der Baumkronen gibt „überragten ihn nicht“ das konkrete Bild idiomatisch wieder, ohne auf das abstrakte „übertrafen“ auszuweichen.
- source_word: בְּגַן אֱלֹהִים
  choice: im Garten Gottes
  rationale: Die formnahe Wiedergabe bewahrt die erhabene, an Eden erinnernde Bildsprache, ohne den Garten ausdrücklich mit Eden gleichzusetzen.
- source_word: בְּרוֹשִׁים
  choice: Zypressen
  rationale: Die genaue Baumart ist unsicher; „Zypressen“ ist eine verbreitete moderne Entsprechung und passt in die Reihe stattlicher Bäume.
- source_word: דָמוּ
  choice: kamen ... nicht gleich
  rationale: דמה bezeichnet hier eine verneinte Gleichheit beziehungsweise Vergleichbarkeit; die deutsche Wendung ist natürlich und wahrt den Gedanken des Zurückstehens.
- source_word: סְעַפֹּתָיו
  choice: seinen starken Ästen
  rationale: Das Wort bezeichnet größere Verzweigungen. „starke Äste“ unterscheidet diese anschaulich von den nachfolgenden Zweigen.
- source_word: עַרְמֹנִים
  choice: Platanen
  rationale: „Platanen“ gilt gegenüber der traditionellen Wiedergabe „Kastanien“ als die wahrscheinlichere botanische Bedeutung.
- source_word: פֹארֹתָיו
  choice: seine Zweige
  rationale: Das Substantiv bezeichnet Zweige, Äste oder belaubten Wuchs; „Zweige“ erhält eine natürliche lexikalische Unterscheidung zu סְעַפֹּתָיו.
- source_word: כָּל עֵץ
  choice: Kein Baum
  rationale: Diese Umstellung gibt die universale hebräische Verneinung in idiomatischem Deutsch wieder.
- source_word: דָמָה אֵלָיו
  choice: kam ihm ... gleich
  rationale: Die Formulierung entspricht dem früheren דמה und bildet einen natürlichen zusammenfassenden Höhepunkt.
- source_word: בְּיָפְיוֹ
  choice: an Schönheit
  rationale: „An Schönheit gleichkommen“ ist die idiomatische deutsche Form, um den Bereich auszudrücken, in dem kein anderer Baum ihm entsprach.
theological_decisions:
- issue: Bedeutung von „Garten Gottes“
  choice: Im Haupttext wörtlich als „Garten Gottes“ wiedergegeben
  alternative: Eden; Gottes Paradies
  rationale: Die Wendung erinnert deutlich an Eden, nennt hier jedoch ausdrücklich den „Garten Gottes“. Die Übersetzung bewahrt diese Spannung, statt die Anspielung als eindeutige Identifizierung auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die beiden hebräischen Ausdrücke für Verzweigungen werden durch „starke Äste“ und „Zweige“ unterschieden; die Wiederholung „im Garten Gottes“ bleibt als rhetorische Rahmung erhalten.
