id: EZK.31.13
reference: Ezekiel 31:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל מַפַּלְתּ֥/וֹ יִשְׁכְּנ֖וּ כָּל ע֣וֹף הַ/שָּׁמָ֑יִם וְ/אֶל פֹּארֹתָ֣י/ו הָי֔וּ כֹּ֖ל חַיַּ֥ת הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/013.yaml
  text: On its fallen trunk all the birds of the heavens will dwell[b][a], and on its boughs will be all the beasts of the field.
translation:
  language: de
  text: Auf seinem umgestürzten Stamm[a] werden sich alle Vögel des Himmels niederlassen, und auf seinen Ästen[b] werden alle Tiere des Feldes sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf seinem Fall“ beziehungsweise „Auf seinem Untergang“. Das hebräische Substantiv kann abstrakt den Fall bezeichnen; das Bild der gefällten Zeder legt hier den umgestürzten Stamm nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf seinen Zweigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפַּלְתּוֹ
  choice: seinem umgestürzten Stamm
  rationale: Das Substantiv kann den Fall, den Untergang oder das Gefallene bezeichnen. Im Bild der gefällten Zeder gibt die konkrete Wiedergabe den unmittelbaren Zusammenhang natürlich wieder, ohne die abstrakte Bedeutungsmöglichkeit zu verschweigen.
- source_word: יִשְׁכְּנוּ
  choice: werden sich … niederlassen
  rationale: שׁכן bezeichnet Wohnen, Sichniederlassen oder Verweilen. Bei Vögeln auf einem umgestürzten Baum ist „sich niederlassen“ im modernen Deutschen natürlich und bewahrt den Gedanken dauernder Ansiedlung.
- source_word: עוֹף הַשָּׁמַיִם
  choice: alle Vögel des Himmels
  rationale: Die traditionelle, aber weiterhin verständliche Verbindung bewahrt die hebräische Genitivkonstruktion und den würdevollen prophetischen Ton.
- source_word: פֹּארֹתָיו
  choice: seinen Ästen
  rationale: Das Wort bezeichnet die ausladenden Äste beziehungsweise Zweige eines Baumes. „Äste“ ist im heutigen Standarddeutsch natürlicher als „Zweige“ oder das gehobene „Gezweige“.
- source_word: הָיוּ
  choice: werden … sein
  rationale: Obwohl die Form morphologisch ein Qatal ist, lässt sie sich im prophetischen Zusammenhang als resultierender zukünftiger Zustand parallel zu יִשְׁכְּנוּ verstehen. Die knappe Formulierung „werden … sein“ hält sich eng an das Hebräische.
- source_word: חַיַּת הַשָּׂדֶה
  choice: alle Tiere des Feldes
  rationale: Die feste biblische Wortverbindung wird nahe am Hebräischen wiedergegeben; „Tiere“ vermeidet die im modernen Deutschen oft abwertende Färbung von „Bestien“.
- source_word: עַל … וְאֶל
  choice: Auf … und auf
  rationale: Die beiden Präpositionen werden im räumlichen Bild idiomatisch als Aufenthalt auf dem Stamm und auf den Ästen verstanden.
theological_decisions:
- issue: Zeitbezug der beiden Verbformen
  choice: Beide Aussagen werden futurisch wiedergegeben.
  alternative: „lassen sich … nieder / waren“ oder durchgehend gegenwärtig beziehungsweise vergangen
  rationale: Der Yiqtol in der ersten und der Qatal in der zweiten Vershälfte lassen unterschiedliche zeitliche Nuancen zu. Im prophetischen Zusammenhang kann die zweite Form den als eingetreten vorgestellten Folgezustand ausdrücken; die futurische Wiedergabe wahrt die Parallelität, ohne eine besondere theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblisch-prophetischer Färbung in „Vögel des Himmels“ und „Tiere des Feldes“. Die Satzstruktur folgt dem hebräischen Parallelismus, bleibt aber idiomatisch verständlich.
