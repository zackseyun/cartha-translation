id: EZK.31.1
reference: Ezekiel 31:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בַּ/שְּׁלִישִׁ֖י בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/001.yaml
  text: And it happened in the eleventh year[a], in the third month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Im elften Jahr, im dritten Monat, am ersten Tag des Monats, erging das Wort Jahwes[a] an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Im elften Jahr … erging
  rationale: Die hebräische Eröffnungsformel wird in natürliches deutsches Erzählen integriert; ein separates „Und es geschah“ wäre möglich, aber schwerfälliger.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: im elften Jahr
  rationale: Idiomatiche Wiedergabe der hebräischen Datierungsformel.
- source_word: בַּשְּׁלִישִׁי
  choice: im dritten Monat
  rationale: „Monat“ ist im Hebräischen sinngemäß ergänzt und wird zur eindeutigen Datierung ausdrücklich genannt.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Klare, moderne Wiedergabe der hebräischen Kalenderangabe.
- source_word: הָיָה דְבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: „Erging“ ist eine natürliche, würdevolle deutsche Wiedergabe der prophetischen Offenbarungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: Im Deutschen ist „das Wort erging an mich“ die idiomatische Verbindung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet die unmittelbar folgende Gottesrede im modernen Deutschen natürlich ein und erfüllt hier die Funktion des hebräischen Infinitivs „sprechend“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher bewahrt. Die traditionelle Ersatzlesung wird in der Fußnote genannt, ohne die Namensform im Haupttext zu verdecken.
- issue: Wiedergabe von לֵאמֹר
  choice: Doppelpunkt
  alternative: mit den Worten
  rationale: Der Doppelpunkt vermeidet eine unnatürliche Formel und zeigt dennoch klar an, dass im Folgevers direkte Rede beginnt.
translation_notes:
  register: Modernes Standarddeutsch in einem knappen, würdevollen prophetischen Register. Die Datierungsformel bleibt vollständig erhalten; die hebräische Satzeröffnung wird ohne archaisches „Und es geschah“ idiomatisch in den Satz integriert.
