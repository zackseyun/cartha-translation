source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה בְּ/י֨וֹם רִדְתּ֤/וֹ שְׁא֨וֹלָ/ה֙ הֶאֱבַ֜לְתִּי כִּסֵּ֤תִי עָלָי/ו֙ אֶת תְּה֔וֹם וָֽ/אֶמְנַע֙ נַהֲרוֹתֶ֔י/הָ וַ/יִּכָּלְא֖וּ מַ֣יִם רַבִּ֑ים וָ/אַקְדִּ֤ר עָלָי/ו֙ לְבָנ֔וֹן וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה עָלָ֥י/ו עֻלְפֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/015.yaml
  text: 'Thus says the Lord GOD: On the day he went down to Sheol[a], I caused mourning; I covered the deep because of him, and I restrained its rivers, and the many waters were stopped. I made Lebanon grow dark because of him[c][b], and all the trees of the field fainted because of him.'
translation:
  language: de
  text: 'So spricht Gott, der HERR: An dem Tag, als er in die Scheol[a] hinabstieg, ließ ich Trauer einkehren. Seinetwegen bedeckte ich die Urflut und hielt ihre Ströme zurück; die vielen Wasser wurden aufgehalten. Seinetwegen verdüsterte ich den Libanon[b], und alle Bäume des Feldes sanken in Ohnmacht[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ins Totenreich“. Der hebräische Ausdruck „Scheol“ bezeichnet den Bereich der Toten; er wird hier beibehalten, damit sein Sinn nicht auf das Grab oder auf spätere Vorstellungen von der Hölle verengt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ließ ich den Libanon sich verdüstern“. Das hebräische Verb bezeichnet das Hervorrufen von Dunkelheit oder düsterer Trauer.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verschmachteten“ beziehungsweise „wurden von Mattigkeit befallen“. Der seltene hebräische Ausdruck bezeichnet Ohnmacht, Erschöpfung oder kraftloses Hinsinken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen geläufige Wiedergabe der Verbindung aus Herrentitel und Gottesname bewahrt beide Bestandteile, ohne die schwer verständliche Doppelung „Herr HERR“ zu erzeugen.
- source_word: בְּיוֹם רִדְתּוֹ שְׁאוֹלָה
  choice: An dem Tag, als er in den Scheol hinabstieg
  rationale: Die ausdrückliche Zeitangabe und die Bewegung nach unten bleiben erhalten. „Scheol“ wahrt den althebräischen Begriff, ohne ihn auf Grab oder Hölle zu verengen.
- source_word: הֶאֱבַלְתִּי
  choice: ließ ich Trauer einkehren
  rationale: Die Form ist kausativ. Die deutsche Wendung gibt wieder, dass Gott Trauer bewirkt, ohne ein im Hebräischen nicht genanntes trauerndes Subjekt einzusetzen.
- source_word: כִּסֵּתִי עָלָיו אֶת תְּהוֹם
  choice: Seinetwegen bedeckte ich die Urflut
  rationale: כסה wird in seinem üblichen Sinn „bedecken“ wiedergegeben; עליו ist hier kausal als „seinetwegen“ verstanden. „Urflut“ bezeichnet die kosmische Tiefe deutlicher als das allgemeine „Tiefe“.
- source_word: וָאֶמְנַע נַהֲרוֹתֶיהָ
  choice: und hielt ihre Ströme zurück
  rationale: Das feminine Suffix bezieht sich auf die Urflut. „Zurückhalten“ bildet מנע natürlich und präzise ab.
- source_word: וַיִּכָּלְאוּ מַיִם רַבִּים
  choice: die gewaltigen Wasser wurden aufgehalten
  rationale: Die passive Aussage bleibt erhalten; „gewaltige Wasser“ gibt die Menge und Größe der Wasser in würdiger poetischer Sprache wieder.
- source_word: וָאַקְדִּר עָלָיו לְבָנוֹן
  choice: Seinetwegen ließ ich den Libanon sich verdüstern
  rationale: Die kausative Form von קדר bezeichnet das Herbeiführen von Dunkelheit oder Düsterkeit und passt zur Trauerbildsprache des Verses.
- source_word: עָלָיו עֻלְפֶּה
  choice: sanken in Ohnmacht
  rationale: Das seltene עֻלְפֶּה bezeichnet Mattigkeit, Verschmachten oder Ohnmacht. Die verbale deutsche Fassung gibt den Zustand natürlich wieder.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Totenreich; das Grab; die Hölle
  rationale: „Scheol“ erhält die Breite des hebräischen Begriffs für den Bereich der Toten und vermeidet sowohl eine Verengung auf das physische Grab als auch die Eintragung späterer Vorstellungen von der Hölle.
- issue: Kosmische Trauerbildsprache
  choice: Die personifizierende Bildsprache von Urflut, Libanon und Bäumen bleibt stehen.
  alternative: Eine rein naturkundliche Katastrophe schildern oder die politischen Entsprechungen ausdrücklich in den Haupttext eintragen.
  rationale: Der Zusammenhang zeichnet den Sturz des großen Baumes beziehungsweise Reiches als Ereignis, an dessen Trauer die geschaffene Welt teilnimmt. Die Übersetzung bewahrt diese Spannung, ohne das Bild auszudeuten.
- issue: Mehrdeutigkeit von כִּסֵּתִי עָלָיו אֶת תְּהוֹם
  choice: Seinetwegen bedeckte ich die Urflut.
  alternative: Ich bedeckte die Urflut über ihm; ich ließ die Urflut um ihn trauern.
  rationale: Die gewählte Fassung folgt der gewöhnlichen Bedeutung von כסה und versteht עליו parallel zu den weiteren Vorkommen im Vers kausal. Da die hebräische Konstruktion schwierig ist, bleibt die Unsicherheit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. Die kosmische Bildsprache bleibt konkret. Im Haupttext erscheinen nur die Marker [a] bis [c]; Fußnote [d] wird wegen der Markerpflicht nicht verwendet und sollte redaktionell entfallen.
