  text: יָפֶ֣ה עֲשִׂיתִ֔י/ו בְּ/רֹ֖ב דָּֽלִיּוֹתָ֑י/ו וַ/יְקַנְאֻ֨/הוּ֙ כָּל עֲצֵי עֵ֔דֶן אֲשֶׁ֖ר בְּ/גַ֥ן הָ/אֱלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/009.yaml
  text: I made it beautiful with its many branches[a], and all the trees of Eden that were in the garden of God envied it.
translation:
  language: de
  text: Ich machte ihn schön durch die Fülle seiner Zweige,[a] und alle Bäume Edens, die im Garten Gottes waren, beneideten ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit der Fülle seiner Zweige«.'
    reason: Die Präposition בְּ kann die Zweigfülle als Mittel der Schönheit oder als deren nähere Ausprägung bezeichnen.
lexical_decisions:
- source_word: יָפֶה
  choice: schön
  rationale: Das prädikative Adjektiv bezeichnet die Schönheit und Pracht des dargestellten Baumes; »schön« ist modern, klar und würdig.
- source_word: עֲשִׂיתִיו
  choice: Ich machte ihn
  rationale: Das Qal Perfekt 1. Person Singular mit maskulinem Objektsuffix wird im Deutschen mit »ihn« wiedergegeben. Das passt grammatisch zum maskulinen »Baum« und bewahrt zugleich den möglichen Bezug auf Assur beziehungsweise seinen Herrscher.
- source_word: בְּרֹב דָּלִיּוֹתָיו
  choice: mit der Fülle seiner Zweige
  rationale: בְּ wird instrumental beziehungsweise beschreibend verstanden; רֹב bezeichnet die große Menge oder Fülle, דָּלִיּוֹת die ausladenden Zweige oder Äste.
- source_word: וַיְקַנְאֻהוּ
  choice: beneideten ihn
  rationale: קנא bezeichnet hier Neid oder Eifersucht. »Beneideten ihn« ist idiomatisch und erhält das maskuline Suffix.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: alle Bäume Edens
  rationale: Die kollektive Formulierung wird unmittelbar und poetisch wiedergegeben.
- source_word: אֲשֶׁר בְּגַן הָאֱלֹהִים
  choice: im Garten Gottes
  rationale: Der Relativsatz bestimmt den Ort der Bäume. Im Deutschen kann er knapp attributiv angeschlossen werden; »Garten Gottes« bewahrt die erhabene biblische Wendung.
theological_decisions:
- issue: Bezug der maskulinen Suffixe innerhalb der Baumallegorie
  choice: Die Pronomen werden mit »ihn« wiedergegeben.
  alternative: Durchgehend sachbezogen formulieren, etwa »diesen Baum« beziehungsweise Wiederholungen vermeiden.
  rationale: Hebräisch verwendet maskuline Suffixe, die grammatisch zur maskulinen Baumbezeichnung passen und zugleich Assur beziehungsweise den Herrscher hinter dem Bild anklingen lassen. Das deutsche »ihn« bewahrt diese produktive Mehrdeutigkeit, ohne den metaphorischen oder politischen Bezug festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischer Knappheit. Die Baumallegorie bleibt deutlich; zugleich lässt das maskuline Pronomen den politischen Bezug im Hintergrund offen.
