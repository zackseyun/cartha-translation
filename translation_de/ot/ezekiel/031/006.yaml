  text: בִּ/סְעַפֹּתָ֤י/ו קִֽנְנוּ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/תַ֤חַת פֹּֽארֹתָי/ו֙ יָֽלְד֔וּ כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/בְ/צִלּ/וֹ֙ יֵֽשְׁב֔וּ כֹּ֖ל גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/006.yaml
  text: In its branches all the birds of the heavens nested[a], and under its boughs all the beasts of the field gave birth, and in its shade all the many nations dwelt.
translation:
  language: de
  text: In seinen Zweigen nisteten alle Vögel des Himmels; unter seinen Ästen brachten alle Tiere des Feldes ihre Jungen zur Welt, und in seinem Schatten wohnten all die vielen Völker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּסְעַפֹּתָיו
  choice: in seinen Zweigen
  rationale: סְעַפּוֹת bezeichnet die verzweigte Struktur beziehungsweise größere Zweige des Baumes. „In seinen Zweigen“ ist natürlich und passt zum Nisten der Vögel.
- source_word: קִנְנוּ
  choice: nisteten
  rationale: Das Verb bezeichnet ausdrücklich das Nisten oder Bauen von Nestern und bewahrt so das Bild des hebräischen Textes.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: alle Vögel des Himmels
  rationale: עוֹף ist hier eine Kollektivbezeichnung für Vögel beziehungsweise fliegende Tiere. Die traditionelle Wendung „Vögel des Himmels“ bleibt im modernen Deutsch verständlich und würdevoll.
- source_word: תַחַת פֹּארֹתָיו
  choice: unter seinen Ästen
  rationale: פֹּארוֹת bezeichnet kräftige, belaubte Äste. „Äste“ unterscheidet den Ausdruck angemessen von סְעַפּוֹת („Zweige“), ohne unnatürlich zu wirken.
- source_word: יָלְדוּ
  choice: brachten … ihre Jungen zur Welt
  rationale: ילד bedeutet gebären. Bei Tieren gibt diese Formulierung den Vorgang natürlich wieder und bewahrt zugleich die konkrete Aussage des Originals.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: alle Tiere des Feldes
  rationale: חַיַּת הַשָּׂדֶה ist die übliche Bezeichnung für die Land- beziehungsweise Wildtiere. „Tiere des Feldes“ erhält die biblische Bildsprache ohne unnötige Archaisierung.
- source_word: וּבְצִלּוֹ
  choice: in seinem Schatten
  rationale: צֵל kann Schatten oder schützenden Schatten bezeichnen. Die direkte Wiedergabe lässt sowohl das konkrete Baumbild als auch dessen Schutzfunktion anklingen, ohne die Metapher auszudeuten.
- source_word: יֵשְׁבוּ
  choice: wohnten
  rationale: ישב bezeichnet hier dauerhaftes Wohnen oder Sich-Niederlassen, nicht bloß das Sitzen.
- source_word: כֹּל גּוֹיִם רַבִּים
  choice: all die vielen Völker
  rationale: Die ungewöhnliche Verbindung von כֹּל mit גּוֹיִם רַבִּים betont eine umfassende Vielzahl. „All die vielen Völker“ bildet diese Spannung in idiomatischem Deutsch nach.
theological_decisions:
- issue: Das Baumgleichnis als Bild imperialer Schutzmacht
  choice: Die Baum- und Schutzmetaphorik wird ohne ausdrückliche Deutung wiedergegeben.
  alternative: Den Baum im Vers ausdrücklich mit Assyrien oder einer imperialen Macht gleichsetzen.
  rationale: Der Vers gehört zu einem ausgedehnten Bildwort. Die Übersetzung soll dessen konkrete Bilder bewahren und die Deutung nicht in den Vers selbst eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die drei Ortsangaben werden erhalten. Auf eine Fußnote zur englischen Alternative „shade/shadow“ wird verzichtet, weil „Schatten“ im Deutschen beide Nuancen abdeckt; zudem gehört die englische Fußnotenmarkierung offenbar nicht zum Verb „nested“.
