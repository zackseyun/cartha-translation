  terminology: „Vögel des Himmels“, „Tiere des Feldes“, „Schatten“ und „wohnten“ bewahren den biblisch-bildhaften Registerton, ohne unverständlich oder unnötig altertümlich zu sein. Die Differenzierung von „Zweigen“ und „Ästen“ ist vertretbar und entspricht den unterschiedlichen hebräischen Ausdrücken.
