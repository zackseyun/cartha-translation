  text: גַּם הֵ֗ם אִתּ֛/וֹ יָרְד֥וּ שְׁא֖וֹלָ/ה אֶל חַלְלֵי חָ֑רֶב וּ/זְרֹע֛/וֹ יָשְׁב֥וּ בְ/צִלּ֖/וֹ בְּ/ת֥וֹךְ גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/017.yaml
  text: They too went down with it to Sheol[a], to those slain by the sword; its arm dwelt in its shade among the nations.
translation:
  language: de
  text: Auch sie stiegen mit ihm in die Scheol[a] hinab, zu den vom Schwert Erschlagenen; auch sein Arm[b] – diejenigen, die unter seinem Schatten mitten unter den Nationen gewohnt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Scheol: der Bereich der Toten; nicht lediglich das einzelne Grab.'
    reason: Bewahrt die Bedeutungsweite des hebräischen Begriffs und verhindert eine zu enge oder anachronistische Deutung.
  - marker: b
    text: Wörtlich „sein Arm“; gemeint sein können seine Stärke, seine Helfer oder seine Verbündeten.
    reason: Erläutert das im Deutschen ungewohnte Bild sowie den kollektiven Sinn, den das folgende Verb im Plural nahelegt.
lexical_decisions:
- source_word: גַּם הֵם
  choice: Auch sie
  rationale: 'Gibt die additive Aussage knapp und idiomatisch wieder: Auch diese zuvor genannten Gruppen teilen das Gericht.'
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Das maskuline Pronomen entspricht der Personifikation des Baumes beziehungsweise Assyriens; im Deutschen ist „ihm“ im Zusammenhang mit dem Baum natürlich.
- source_word: יָרְדוּ שְׁאוֹלָה
  choice: stiegen … in den Scheol hinab
  rationale: Bewahrt sowohl die Bewegung nach unten als auch den besonderen hebräischen Begriff für den Bereich der Toten, ohne ihn auf ein Grab oder eine spätere Höllenvorstellung festzulegen.
- source_word: חַלְלֵי חָרֶב
  choice: die vom Schwert Erschlagenen
  rationale: Eine natürliche deutsche Wiedergabe der hebräischen Konstruktverbindung, die die gewaltsame Todesursache ausdrücklich erhält.
- source_word: זְרֹעוֹ
  choice: sein Arm
  rationale: Bewahrt das konkrete hebräische Bild. Der folgende Plural deutet darauf hin, dass „Arm“ kollektiv für Machtträger, Helfer oder Verbündete stehen kann; dies wird durch die Apposition und eine Fußnote kenntlich gemacht.
- source_word: יָשְׁבוּ בְצִלּוֹ
  choice: die unter seinem Schatten … gewohnt hatten
  rationale: „Unter seinem Schatten wohnen“ erhält das Baumbild und dessen Schutzvorstellung. Das Plusquamperfekt macht im Deutschen deutlich, dass dieses Wohnen dem Hinabsteigen vorausging, ohne die Aussage theologisch auszudeuten.
- source_word: בְּתוֹךְ גּוֹיִם
  choice: mitten unter den Nationen
  rationale: Gibt die räumliche Wendung und den internationalen Horizont des Abschnitts präzise wieder.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab
  rationale: Die Transliteration erhält den alttestamentlichen Begriff in seiner eigenen Bedeutungsweite und legt ihn weder auf eine bloße Grabstätte noch auf eine später ausgebildete Höllenvorstellung fest.
- issue: Bezug und Bedeutung von זְרֹעוֹ
  choice: das Bild „sein Arm“ mit kollektiver Apposition beibehalten
  alternative: seine Stärke; seine Helfer; seine Verbündeten
  rationale: Der masoretische Text bietet wörtlich „sein Arm“, während das plurale Verb eine kollektive Referenz nahelegt. Die Übersetzung bewahrt diese Spannung, statt eine einzelne Deutung in den Haupttext einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das durchgehende Baumbild bleibt mit „Schatten“ und „Arm“ sichtbar; die Apposition macht die schwierige hebräische Syntax verständlich, ohne ihre Deutung vorschnell festzulegen.
