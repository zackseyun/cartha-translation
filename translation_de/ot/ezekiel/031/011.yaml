source:
  edition: WLC
  text: וְ/אֶ֨תְּנֵ֔/הוּ בְּ/יַ֖ד אֵ֣יל גּוֹיִ֑ם עָשׂ֤וֹ יַֽעֲשֶׂה֙ ל֔/וֹ כְּ/רִשְׁע֖/וֹ גֵּרַשְׁתִּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/011.yaml
  text: I gave him into the hand of a mighty one of the nations; he will surely deal with him[a]. According to his wickedness I drove him out.
translation:
  language: de
  text: Ich gab ihn in die Hand eines Mächtigen der Völker[a]. Er wird gewiss mit ihm verfahren. Seiner Bosheit entsprechend vertrieb ich ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „eines Herrschers der Völker“ oder „eines Gewaltigen unter den Völkern“. Der hebräische Ausdruck bezeichnet einen Mächtigen und kann hier einen mächtigen Herrscher meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵהוּ
  choice: Ich gab ihn
  rationale: Die Form von נתן mit einem Subjekt der 1. Person Singular und einem Objekt der 3. Person maskulin Singular wird im Zusammenhang als vergangene, vollendete Übergabe in fremde Gewalt verstanden. „Gab“ bleibt schlicht und nah am Hebräischen.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen. Das im Deutschen verständliche Bild der Hand bleibt erhalten.
- source_word: אֵיל גּוֹיִם
  choice: eines Mächtigen unter den Völkern
  rationale: אֵיל bezeichnet hier einen Mächtigen oder Gewaltigen. „Unter den Völkern“ gibt die Zugehörigkeit beziehungsweise Stellung innerhalb der Völker wieder, ohne die Person ausdrücklich als König von Babylon zu identifizieren.
- source_word: עָשׂוֹ יַעֲשֶׂה לּוֹ
  choice: Der wird gewiss mit ihm verfahren
  rationale: Infinitivus absolutus und Imperfekt von עשה verstärken gemeinsam die Aussage. „Gewiss“ vermittelt die Nachdrücklichkeit; „mit ihm verfahren“ lässt die konkrete, im Gerichtskontext negative Handlung offen, wie es auch das allgemeine Verb עשה tut.
- source_word: כְּרִשְׁעוֹ
  choice: Wegen seiner Bosheit
  rationale: Das כ kann hier den der Bosheit entsprechenden Grund beziehungsweise Maßstab des Gerichts ausdrücken. Die natürliche deutsche Formulierung nennt den Grund, ohne die Verbindung zwischen Bosheit und Vertreibung aufzulösen.
- source_word: גֵּרַשְׁתִּהוּ
  choice: verstieß ich ihn
  rationale: גרש bedeutet vertreiben oder ausstoßen. „Verstieß“ ist würdig und knapp und bezeichnet sowohl Ausschluss als auch Entfernung aus der bisherigen Stellung.
theological_decisions:
- issue: Identität des als אֵיל גּוֹיִם bezeichneten Vollstreckers
  choice: Allgemein als „einen Mächtigen unter den Völkern“ wiedergegeben
  alternative: „den Herrscher der Völker“ oder ausdrückliche Identifikation mit dem König von Babylon
  rationale: Der hebräische Text nennt an dieser Stelle keine historische Person beim Namen. Die Übersetzung bewahrt deshalb die allgemeine Bezeichnung und vermeidet eine nicht ausdrücklich im Vers enthaltene Identifikation.
- issue: Verhältnis von Bosheit und Vertreibung
  choice: „Wegen seiner Bosheit“
  alternative: „seiner Bosheit entsprechend“
  rationale: Beides ist für כְּרִשְׁעוֹ möglich. Die gewählte Form macht den Gerichtsgrund idiomatisch deutlich; die proportionale Nuance bleibt als mögliche engere Deutung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt knapp und nachdrücklich. „Der“ nimmt den zuvor genannten Mächtigen natürlich auf; die nicht ausdrücklich genannte historische Identität und die allgemeine Bedeutung von עשה werden nicht überpräzisiert.
