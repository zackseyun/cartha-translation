source:
  edition: WLC
  text: עַל כֵּן֙ גָּבְהָ֣א קֹמָת֔/וֹ מִ/כֹּ֖ל עֲצֵ֣י הַ/שָּׂדֶ֑ה וַ/תִּרְבֶּ֨ינָה סַֽרְעַפֹּתָ֜י/ו וַ/תֶּאֱרַ֧כְנָה פארת/ו מִ/מַּ֥יִם רַבִּ֖ים בְּ/שַׁלְּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/005.yaml
  text: Therefore its height rose above all the trees of the field[a], and its boughs multiplied, and its branches grew long because of abundant waters as it spread out.
translation:
  language: de
  text: Darum wuchs er höher als alle Bäume des Feldes. Seine Äste wurden zahlreich und seine Zweige lang, weil er reichlich Wasser hatte, während er sich ausbreitete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei seinem Aussenden“; gemeint sein kann auch: „als er seine Triebe oder Zweige aussandte“. Das Objekt bleibt im Hebräischen unausgesprochen.'
    reason: Die Fußnote bewahrt die wörtliche Ausdrucksweise und die Mehrdeutigkeit des impliziten Objekts.
lexical_decisions:
- source_word: גָּבְהָא קֹמָתוֹ מִכֹּל
  choice: wuchs er höher als alle
  rationale: Die Verbindung bezeichnet zunehmende beziehungsweise überlegene Höhe. Die deutsche Vergleichsformulierung gibt sowohl das Wachstum als auch den Vergleich mit den übrigen Bäumen natürlich wieder.
- source_word: עֲצֵי הַשָּׂדֶה
  choice: Bäume des Feldes
  rationale: Die formnahe und im prophetischen Bild verständliche Wiedergabe bewahrt die offene Landschaftsbezeichnung des Hebräischen.
- source_word: סַרְעַפֹּתָיו
  choice: seine Äste
  rationale: Das seltene Wort bezeichnet größere Verzweigungen; „Äste“ unterscheidet sie im Deutschen sinnvoll von den folgenden „Zweigen“.
- source_word: וַתִּרְבֶּינָה
  choice: wurden zahlreich
  rationale: רבה drückt hier die zahlenmäßige Zunahme der Äste aus.
- source_word: פארתו
  choice: seine Zweige
  rationale: Das Wort bezeichnet Zweige beziehungsweise laubtragende Verästelungen. „Zweige“ passt zum Längenwachstum und wahrt die Unterscheidung von den größeren Ästen.
- source_word: וַתֶּאֱרַכְנָה
  choice: wurden … lang
  rationale: Die schlichte deutsche Wendung gibt das im Verb ארך bezeichnete Langwerden unmittelbar wieder.
- source_word: מִמַּיִם רַבִּים
  choice: weil er reichlich Wasser hatte
  rationale: מן bezeichnet hier die Ursache beziehungsweise die nährende Quelle. Diese Formulierung ist im Deutschen natürlich und erhält das Bild des reichlichen Wassers.
- source_word: בְּשַׁלְּחוֹ
  choice: während er sich ausbreitete
  rationale: Wörtlich ist vom „Aussenden“ die Rede, doch das Objekt bleibt unausgesprochen. Die reflexive Wiedergabe wahrt diese Offenheit und vermittelt das räumliche Ausgreifen des Baumes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Baum-Metaphorik. „Äste“ und „Zweige“ bilden die beiden unterschiedlichen hebräischen Bezeichnungen verständlich ab; die im Hebräischen offene Schlusswendung wird im Text natürlich formuliert und in der Fußnote erläutert.
