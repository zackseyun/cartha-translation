  text: מַ֣יִם גִּדְּל֔וּ/הוּ תְּה֖וֹם רֹֽמְמָ֑תְ/הוּ אֶת נַהֲרֹתֶ֗י/הָ הֹלֵךְ֙ סְבִיב֣וֹת מַטָּעָ֔/הּ וְ/אֶת תְּעָלֹתֶ֣י/הָ שִׁלְחָ֔ה אֶ֖ל כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/004.yaml
  text: Waters made it grow[a]; the deep made it rise high. Its rivers flowed all around its planting place[b], and it sent out its channels to all the trees of the field.
translation:
  language: de
  text: Das Wasser ließ ihn wachsen; die Tiefe ließ ihn hoch emporragen.[a] Ihre Ströme flossen rings um ihre Pflanzung,[b] und sie sandte ihre Kanäle zu allen Bäumen des Feldes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Tiefe erhob ihn“ oder „machte ihn hoch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Pflanzstätte“ bzw. „ihr Pflanzbereich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: das Wasser
  rationale: Die hebräische Pluralform bezeichnet hier Wasser als Stoff- bzw. Sammelbegriff. Der deutsche Singular ist idiomatisch und wahrt das Bild der Bewässerung.
- source_word: גִּדְּלוּהוּ
  choice: ließ ihn wachsen
  rationale: Die Kausativbedeutung von גדל wird innerhalb des Baumbildes konkret wiedergegeben; das maskuline Pronomen nimmt den zuvor genannten Baum auf.
- source_word: תְּהוֹם
  choice: die Tiefe
  rationale: Die knappe Wiedergabe bewahrt die Vorstellung der großen, unterirdischen oder urzeitlichen Wassertiefe, ohne sie stärker auszudeuten.
- source_word: רֹמְמָתְהוּ
  choice: ließ ihn hoch emporragen
  rationale: Die Form von רום bezeichnet ein Hochmachen bzw. Emporheben. Im Baumbild bringt „emporragen“ sowohl Höhe als auch Größe natürlich zum Ausdruck.
- source_word: נַהֲרֹתֶיהָ
  choice: ihre Ströme
  rationale: Das feminine Suffix bezieht sich grammatisch naheliegend auf „die Tiefe“. „Ströme“ gibt die kräftigen Wasserläufe von נהרות wieder.
- source_word: הֹלֵךְ סְבִיבוֹת
  choice: flossen rings um
  rationale: Das wörtliche „gingen ringsum“ wird für Wasserläufe idiomatisch als „flossen rings um“ wiedergegeben.
- source_word: מַטָּעָהּ
  choice: seine Pflanzstätte
  rationale: Der Ausdruck bezeichnet den Ort bzw. Bereich, an dem der Baum gepflanzt ist. Das maskuline Possessivpronomen verdeutlicht den Bezug auf den Baum, der im vorangehenden Kontext beschrieben wird.
- source_word: תְּעָלֹתֶיהָ
  choice: ihre Kanäle
  rationale: Das Wort bezeichnet abzweigende Wasser- oder Bewässerungskanäle; das feminine Suffix verweist erneut auf „die Tiefe“.
- source_word: שִׁלְחָה
  choice: sie sandte
  rationale: Die feminine Verbform wird mit „die Tiefe“ als Subjekt wiedergegeben. Das bewusst markante Bild, dass die Tiefe ihre Kanäle aussendet, bleibt erhalten.
- source_word: אֶל כָּל עֲצֵי הַשָּׂדֶה
  choice: zu allen Bäumen des Feldes
  rationale: Die formnahe Wiedergabe erhält das kollektive Baumbild und die biblische Landschaftsbezeichnung „des Feldes“.
theological_decisions:
- issue: Pronomenbezüge im erweiterten Baumbild
  choice: Maskuline Formen beziehen sich auf den Baum, feminine Formen auf „die Tiefe“.
  alternative: Alle Bezüge durch neutrale oder wiederholte Substantive vereinheitlichen bzw. unmittelbar auf das dargestellte Reich beziehen.
  rationale: Der hebräische Text unterscheidet zwischen dem maskulinen Objekt „ihn“ und den femininen Formen, die zur Tiefe passen. Die deutsche Fassung bewahrt diese Unterscheidung und löst das Bild nicht vorschnell in seine politische Bedeutung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Das poetische Baumbild und die wechselnden grammatischen Bezüge bleiben sichtbar; altertümliche Wendungen und unnötige theologische Explikationen werden vermieden.
