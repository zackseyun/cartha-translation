  terminology: „Scheol“, „Grube“, „Bäume Edens“ und „Völker“ sind angemessen. Die Apposition zu den Bäumen sollte ohne die unnötig stark superlativische Doppelung „erlesensten und besten“ formuliert werden; „die erlesenen und besten des Libanon“ gibt den hebräischen Ausdruck angemessen wieder.
