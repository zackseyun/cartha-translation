source:
  edition: WLC
  text: מִ/קּ֤וֹל מַפַּלְתּ/וֹ֙ הִרְעַ֣שְׁתִּי גוֹיִ֔ם בְּ/הוֹרִדִ֥/י אֹת֛/וֹ שְׁא֖וֹלָ/ה אֶת י֣וֹרְדֵי ב֑וֹר וַ/יִּנָּ֨חֲמ֜וּ בְּ/אֶ֤רֶץ תַּחְתִּית֙ כָּל עֲצֵי עֵ֔דֶן מִבְחַ֥ר וְ/טוֹב לְבָנ֖וֹן כָּל שֹׁ֥תֵי מָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/016.yaml
  text: At the sound of his fall I made nations quake[a], when I brought him down to Sheol with those who go down to the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water[c][b], were comforted in the earth beneath.
translation:
  language: de
  text: Beim Geräusch seines Sturzes ließ ich die Völker erbeben, als ich ihn zusammen mit denen, die in die Grube hinabsteigen, in die Scheol[a] hinabführte. Und in der Tiefe der Erde[c] wurden alle Bäume Edens getröstet[b], die erlesenen und besten des Libanon, alle, die Wasser trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ins Grab“ oder „ins Totenreich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „fanden Trost“. Gemeint sein kann, dass die anderen gefallenen Mächte einen düsteren Trost darin fanden, dass nun auch dieser große Baum hinabstieg.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in der unteren Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל מַפַּלְתּוֹ
  choice: Beim Krachen seines Sturzes
  rationale: קוֹל bezeichnet einen hörbaren Laut oder ein Geräusch; im Bild eines stürzenden Baumes gibt „Krachen“ die Szene natürlich und anschaulich wieder. „Sturz“ bewahrt zugleich das Bild des gefällten Baumes und den politischen Sinn des Untergangs.
- source_word: הִרְעַשְׁתִּי גוֹיִם
  choice: ließ ich die Völker erbeben
  rationale: Die Hifil-Form drückt Verursachung aus. „Erbeben lassen“ gibt diese kausative Bedeutung wieder, ohne גוֹיִם auf einen späteren religiösen Gegensatz zu verengen.
- source_word: בְּהוֹרִדִי אֹתוֹ
  choice: als ich ihn … hinabführte
  rationale: Die Präposition mit Infinitivus constructus wird hier zeitlich verstanden. „Hinabführte“ bewahrt die kausative Hifil-Bedeutung und die räumliche Abwärtsbewegung.
- source_word: שְׁאוֹלָה
  choice: in die Scheol
  rationale: Die Transliteration erhält den hebräischen Begriff für den Bereich der Toten und verengt ihn weder auf ein einzelnes Grab noch auf eine spätere ausgearbeitete Jenseitslehre.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: zusammen mit denen, die in die Grube hinabsteigen
  rationale: אֶת wird im Zusammenhang assoziativ als „mit“ verstanden. Die Formulierung bewahrt die geläufige Todesmetapher der Hinabsteigenden und das Bild der Grube.
- source_word: וַיִּנָּחֲמוּ
  choice: Da wurden … getröstet
  rationale: Der Nifal von נחם wird passiv wiedergegeben. „Getröstet“ lässt die im Kontext wohl düstere oder ironische Art dieses Trostes offen.
- source_word: בְּאֶרֶץ תַּחְתִּית
  choice: in der unteren Erde
  rationale: Die relativ formnahe Wiedergabe erhält die räumliche Unterweltsvorstellung, ohne sie durch einen stärker deutenden Fachbegriff zu ersetzen.
- source_word: כָּל עֲצֵי עֵדֶן
  choice: alle Bäume Edens
  rationale: Die wörtliche Bildsprache ist für das durchgehende Baumgleichnis des Kapitels wesentlich und bleibt im Deutschen klar.
- source_word: מִבְחַר וְטוֹב לְבָנוֹן
  choice: die erlesensten und besten des Libanon
  rationale: Die appositionelle Wendung beschreibt die herausragenden Bäume des Libanon. Der Superlativ gibt den elativen Sinn idiomatisch wieder.
- source_word: כָּל שֹׁתֵי מָיִם
  choice: alle, die Wasser trinken
  rationale: Das substantivierte Partizip wird als fortdauernde Kennzeichnung wiedergegeben und wahrt das Baum- und Bewässerungsbild.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Grab; Totenreich
  rationale: „Scheol“ bewahrt den eigenständigen althebräischen Begriff und dessen Mehrdeutigkeit. So wird weder bloß ein Bestattungsort behauptet noch eine bestimmte spätere Lehre vom Jenseits in den Text eingetragen.
- issue: Der Trost der Bäume in der unteren Erde
  choice: Die als Bäume dargestellten gefallenen Mächte werden „getröstet“
  alternative: Die Aussage rein poetisch wiederzugeben, ohne eine Wahrnehmung der dargestellten Mächte anzudeuten
  rationale: Der Text personifiziert im fortlaufenden Gleichnis die Bäume beziehungsweise Mächte. Die Übersetzung erhält diese Darstellung und ihre theologische Spannung, ohne daraus eine systematische Aussage über den Zwischenzustand abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache vom stürzenden Baum, von der Grube und von den Bäumen Edens bleibt erhalten. „Krachen“ macht den akustischen Kontext natürlich verständlich; „Scheol“ wird zur Wahrung des Quellbegriffs transliteriert. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
