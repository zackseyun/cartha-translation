- from: Beim Krachen seines Sturzes ließ ich die Völker erbeben, als ich ihn in die Scheol[a] hinabführte, zusammen mit denen, die in die Grube hinabsteigen. Da wurden in der unteren Erde[c] alle Bäume Edens getröstet[b], die erlesensten und besten des Libanon, alle, die Wasser trinken.
  to: Beim Geräusch seines Sturzes ließ ich die Völker erbeben, als ich ihn zusammen mit denen, die in die Grube hinabsteigen, in die Scheol[a] hinabführte. Und in der Tiefe der Erde[c] wurden alle Bäume Edens getröstet[b], die erlesenen und besten des Libanon, alle, die Wasser trinken.
  rationale: Die Revision beseitigt eine unnötige Konkretisierung des Klanges, glättet eine im Deutschen sperrige Ortsangabe und passt die Beschreibung der Libanonbäume enger an den hebräischen Wortlaut an. Die Bildsprache, die mögliche Personifikation der gefallenen Mächte und die Mehrdeutigkeit von Scheol bleiben unverändert erhalten. Alle Fußnotenmarker stehen weiterhin unmittelbar bei ihrem Bezugswort.
