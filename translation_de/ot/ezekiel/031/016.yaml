    rationale: Die Formulierung ist verständlich, aber im heutigen Deutsch steif. „In der Tiefe der Erde“ vermittelt die räumliche Unterweltbildlichkeit natürlich; die wörtliche Alternative bleibt in der Fußnote dokumentiert.
  - severity: low
