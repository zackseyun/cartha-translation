source:
  edition: WLC
  text: הִנֵּ֨ה אַשּׁ֜וּר אֶ֣רֶז בַּ/לְּבָנ֗וֹן יְפֵ֥ה עָנָ֛ף וְ/חֹ֥רֶשׁ מֵצַ֖ל וּ/גְבַ֣הּ קוֹמָ֑ה וּ/בֵ֣ין עֲבֹתִ֔ים הָיְתָ֖ה צַמַּרְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/003.yaml
  text: Behold[a], Assyria was a cedar in Lebanon, beautiful in branches and a forest giving shade, and lofty in height[b]; its top was among the clouds.
translation:
  language: de
  text: Siehe, Assur war eine Zeder im Libanon[a], mit schönen Ästen, schattenspendendem Dickicht und hohem Wuchs; ihr Wipfel war zwischen den Wolken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Libanonzeder“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zwischen den dichten Ästen“ oder „im dichten Laub“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die hinweisende, vergegenwärtigende Kraft der prophetischen Eröffnung in einer würdevollen und weiterhin verständlichen Form.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: „Assur“ ist im deutschen biblischen Sprachgebrauch die übliche Bezeichnung für das assyrische Reich beziehungsweise die hier personifizierte Macht.
- source_word: אֶרֶז בַּלְּבָנוֹן
  choice: eine Zeder im Libanon
  rationale: Gibt die Präposition zunächst räumlich wieder und erhält das Bild eines im Libanon stehenden Baumes; die idiomatische Deutung „Libanonzeder“ wird in der Fußnote bewahrt.
- source_word: יְפֵה עָנָף
  choice: mit schönen Ästen
  rationale: Gibt den kollektiven Singular עָנָף in natürlichem Deutsch pluralisch wieder und beschreibt die eindrucksvolle Verzweigung des Baumes.
- source_word: וְחֹרֶשׁ מֵצַל
  choice: schattenspendendem Dickicht
  rationale: חֹרֶשׁ bezeichnet dichten Gehölzwuchs oder Dickicht, während מֵצַל das Spenden von Schatten ausdrückt. Die Formulierung bewahrt die üppige, dichte Baumgestalt, ohne sie als eigenständigen Wald misszuverstehen.
- source_word: וּגְבַהּ קוֹמָה
  choice: und hohem Wuchs
  rationale: Gibt die Wendung für hochragende Gestalt knapp, bildhaft und in natürlichem Deutsch wieder.
- source_word: וּבֵין עֲבֹתִים
  choice: zwischen den Wolken
  rationale: Im Zusammenhang mit der außergewöhnlichen Höhe kann עֲבֹתִים Wolkenmassen bezeichnen. Da auch dichte Äste oder dichtes Laub möglich sind, bleibt diese echte lexikalische Mehrdeutigkeit in der Fußnote erhalten.
- source_word: צַמַּרְתּוֹ
  choice: ihr Wipfel
  rationale: Bezeichnet die oberste Partie beziehungsweise Krone des Baumes; „Wipfel“ ist im Deutschen präzise, anschaulich und natürlich.
