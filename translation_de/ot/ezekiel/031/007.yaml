  text: So it was beautiful in its greatness[a], in the length of its branches, because its root was by abundant waters.
translation:
  language: de
  text: So war er schön in seiner Größe und in der Länge seiner Zweige, denn seine Wurzel war bei reichlichem Wasser[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
