    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּיִף
  choice: So war er schön
  rationale: Das Qal-Wayyiqtol von יפה beschreibt die Schönheit beziehungsweise ansprechende Erscheinung des als Baum dargestellten Subjekts. „War schön“ gibt den beschreibenden Zusammenhang natürlich wieder; „wurde schön“ wäre aspektuell möglich, würde hier aber stärker eine Entwicklung hervorheben.
- source_word: בְּגָדְלוֹ
  choice: in seiner Größe
  rationale: גדל bezeichnet Größe beziehungsweise mächtige Ausdehnung. Die Präposition ב wird beschreibend wiedergegeben; die Formulierung bewahrt den gehobenen Ton des Bildes.
- source_word: בְּאֹרֶךְ דָּלִיּוֹתָיו
  choice: mit seinen langen Zweigen
  rationale: Wörtlich steht „in der Länge seiner Zweige“. Die deutsche Umformung ist natürlicher und bewahrt den Sinn, dass die Länge der herabhängenden Äste zur Schönheit des Baumes gehört.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für Schönheit und Größe des Baumes ein. „Denn“ wahrt den kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: הָיָה שָׁרְשׁוֹ אֶל
  choice: seine Wurzel reichte an
  rationale: Die Wendung lautet wörtlich etwa „seine Wurzel war zu/auf ... hin“. „Reichte an“ erhält die räumliche Ausrichtung und den Zugang zum Wasser besser als das im Deutschen unnatürliche „war zu“.
- source_word: מַיִם רַבִּים
  choice: reichlich Wasser
  rationale: Das hebräische pluralische מַיִם mit רַבִּים bezeichnet eine große beziehungsweise reiche Wassermenge. „Reichlich Wasser“ ist im Deutschen idiomatisch und vermittelt die Fülle, ohne eine zusätzliche Deutung einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das maskuline Pronomen entspricht dem im Kontext personifizierten beziehungsweise metaphorisch dargestellten Baum. Die etwas wörtlichere Alternative „viele Wasser“ wurde nicht als Fußnote aufgenommen, da sie im Deutschen missverständlich und unidiomatisch wirkt; „reichlich Wasser“ deckt den kontextuellen Sinn direkt ab.
