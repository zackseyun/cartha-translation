- from: So war er schön in seiner Größe und mit seinen langen Zweigen, denn seine Wurzel reichte an reichlich Wasser.
  to: So war er schön in seiner Größe und in der Länge seiner Zweige, denn seine Wurzel war bei reichlichem Wasser[a].
