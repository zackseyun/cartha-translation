review_pass:
  verdict: revise
  source_fidelity: Die Beschreibung von Schönheit, Größe, Zweiglänge und der kausale Bezug zum Wasser werden zutreffend erfasst. „Reichte an reichlich Wasser“ ist jedoch im Deutschen syntaktisch und idiomatisch nicht gelungen und macht aus der statischen hebräischen Ortsbeziehung unnötig eine Bewegung bzw. Ausdehnung der Wurzel.
  naturalness: Der erste Satzteil ist verständlich, doch „mit seinen langen Zweigen“ glättet die parallele hebräische Konstruktion „in seiner Größe / in der Länge seiner Zweige“. Die Formulierung „seine Wurzel war bei reichlichem Wasser“ ist modernes, natürliches Deutsch und gibt die räumlich-versorgende Beziehung angemessen wieder.
  terminology: „Schön“, „Größe“, „Zweige“ und „reichlichem Wasser“ passen zum würdigen modernen Register. Das Singularwort „Wurzel“ entspricht dem Hebräischen; „reichlichem Wasser“ gibt die idiomatische kollektive Bedeutung von מַיִם רַבִּים wieder. Die wörtlichere Möglichkeit „vielen Wassern“ wird als Fußnote dokumentiert.
  issues:
  - severity: medium
    issue: „seine Wurzel reichte an reichlich Wasser“
    rationale: Die Verbindung „an reichlich Wasser reichen“ ist unidiomatisch; zudem legt „reichte“ stärker als der hebräische Wortlaut eine aktive Ausdehnung nahe. Das Hebräische sagt zunächst, dass die Wurzel bei/zu vielen Wassern war.
  - severity: low
    issue: „mit seinen langen Zweigen“ statt „in der Länge seiner Zweige“
    rationale: Die Fassung ist sinnverwandt, doch sie ersetzt die zweite parallele Maßangabe durch eine bloße Eigenschaft der Zweige. Die nähere Formulierung ist ebenso natürlich und bewahrt die Struktur besser.
  revised_text: So war er schön in seiner Größe und in der Länge seiner Zweige, denn seine Wurzel war bei reichlichem Wasser[a].
