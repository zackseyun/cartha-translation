revisions:
- from: Grabe vor ihren Augen[a] die Mauer für dich auf und bring es durch sie hinaus.
  to: Grabe dir vor ihren Augen ein Loch in die Mauer und bring es dadurch hinaus.
  rationale: Die Revision ersetzt ausschließlich die unnatürliche und potenziell missverständliche Wendung „die Mauer aufgraben“ durch eine Formulierung, die die Handlung des Grabens eines Durchlasses präzise ausdrückt. „Dir“ gibt לְךָ wieder; „es“ ergänzt nur das im Hebräischen kontextuell vorausgesetzte, aber nicht benannte Objekt.
