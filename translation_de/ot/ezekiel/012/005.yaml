  text: Before their eyes[a], dig through the wall, and bring out through it.
translation:
  language: de
  text: Grabe dir vor ihren Augen ein Loch in die Mauer und bring es dadurch hinaus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Bewahrt das konkrete hebräische Bild und betont, dass die Zeichenhandlung sichtbar vor den Menschen geschieht.
- source_word: חֲתָר
  choice: grabe ... auf
  rationale: Das Verb bezeichnet das Graben beziehungsweise Durchbrechen einer Mauer. Im Deutschen gibt „die Mauer aufgraben“ die konkrete Handlung natürlich wieder.
- source_word: לְךָ
  choice: für dich
  rationale: Der Dativ wird ausdrücklich wiedergegeben, ohne seine mögliche reflexive beziehungsweise interessive Funktion stärker festzulegen.
- source_word: בַקִּיר
  choice: die Mauer
  rationale: Der bestimmte Artikel verweist auf die in der Szene vorausgesetzte Mauer.
- source_word: וְהוֹצֵאתָ
  choice: bring ... hinaus
  rationale: Der Hifil von יצא bedeutet hier „hinausbringen“. Das nicht ausdrücklich genannte Objekt bleibt durch „es“ inhaltlich offen und wird aus dem vorherigen Vers erschlossen.
- source_word: בּוֹ
  choice: durch sie
  rationale: Das Suffix bezieht sich grammatisch auf die Mauer; gemeint ist das Hindurchbringen durch die darin geschaffene Öffnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Folge der Anweisungen und die sichtbare Zeichenhandlung bleiben erhalten. Das Objekt von „hinausbringen“ wird nicht als „Gepäck“ ergänzt, da es in diesem Vers nur implizit ist.
