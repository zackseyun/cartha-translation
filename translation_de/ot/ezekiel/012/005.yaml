review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung gibt die sichtbare Ausführung („vor ihren Augen“), den bestimmten Bezug auf die Mauer, das interessiv/reflexive לְךָ („dir“) und das implizite Objekt von וְהוֹצֵאתָ angemessen wieder. „Die Mauer aufgraben“ trifft חתר jedoch nicht idiomatisch: Gemeint ist das Herstellen eines Durchgangs bzw. Lochs in der Mauer, durch den anschließend etwas hinausgebracht wird.'
  naturalness: „Grabe ... die Mauer ... auf“ ist im modernen Standarddeutsch ungewöhnlich und kann den Eindruck erwecken, die Mauer werde ausgegraben statt durchbrochen. „Grabe dir ... ein Loch in die Mauer“ ist klar, natürlich und bewahrt die Bildlichkeit des hebräischen Zeichens.
  terminology: „Vor ihren Augen“ ist treffend. Das im Vers nicht ausdrücklich genannte Objekt sollte nicht als „Gepäck“ ergänzt werden; „es“ wahrt die durch den Kontext zu erschließende Referenz. „Dadurch“ nimmt natürlich auf das gegrabene Loch Bezug und vermeidet die missverständliche feminine Rückverweisung von „durch sie“ auf „die Mauer“.
  issues:
  - severity: medium
    issue: „die Mauer für dich aufgraben“ ist semantisch und idiomatisch unpräzise.
    rationale: חתר bezeichnet hier das Graben bzw. Durchbrechen, sodass ein Loch oder Durchgang in der Mauer entsteht. Die deutsche Formulierung „eine Mauer aufgraben“ ist dafür nicht üblich und verdeckt den Bezug von „durch sie“ auf den geschaffenen Durchlass.
  revised_text: Grabe dir vor ihren Augen ein Loch in die Mauer und bring es dadurch hinaus.
  revised_footnotes:
  - marker: a
    text: 'Oder: „Grabe dir vor ihnen ein Loch in die Mauer und bring es dadurch hinaus.“'
    reason: Die hebräische Wendung kann konkret mit „vor ihren Augen“ oder idiomatisch mit „vor ihnen / in ihrer Sicht“ wiedergegeben werden.
