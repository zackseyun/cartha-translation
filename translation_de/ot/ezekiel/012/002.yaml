id: EZK.12.2
reference: Ezekiel 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אָדָ֕ם בְּ/ת֥וֹךְ בֵּית הַ/מֶּ֖רִי אַתָּ֣ה יֹשֵׁ֑ב אֲשֶׁ֣ר עֵינַיִם֩ לָ/הֶ֨ם לִ/רְא֜וֹת וְ/לֹ֣א רָא֗וּ אָזְנַ֨יִם לָ/הֶ֤ם לִ/שְׁמֹ֨עַ֙ וְ/לֹ֣א שָׁמֵ֔עוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/002.yaml
  text: Son of man[a], you dwell in the midst of a rebellious house, who have eyes to see but do not see, ears to hear but do not hear[b], for they are a rebellious house.
translation:
  language: de
  text: Menschensohn, du wohnst mitten in einem widerspenstigen Haus[a]. Sie haben Augen, um zu sehen, sehen aber nicht; sie haben Ohren, um zu hören, hören aber nicht[b]. Denn sie sind ein widerspenstiges Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische »Haus« bezeichnet hier gemeinschaftlich das Volk; möglich wäre daher auch: »ein widerspenstiges Volk« oder »ein Haus der Widerspenstigkeit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Augen sind ihnen zum Sehen, doch sie sehen nicht; Ohren sind ihnen zum Hören, doch sie hören nicht.«'
    reason: literal_rendering
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die feste Anredeformel des Ezechielbuches und ihre intertextuellen Bezüge; zugleich bleibt die hebräische Bildform erhalten.
- source_word: בְּתוֹךְ
  choice: mitten in
  rationale: Gibt die räumlich-soziale Einordnung des Propheten innerhalb der Gruppe natürlich und anschaulich wieder.
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  choice: ein widerspenstiges Haus
  rationale: Bewahrt das korporative Bild »Haus« und die Wiederholung im Vers. »Widerspenstig« bezeichnet hier die beharrliche Auflehnung, ohne das Bild durch »Volk« aufzulösen.
- source_word: יֹשֵׁב
  choice: wohnst
  rationale: Im Zusammenhang bezeichnet ישׁב das Wohnen beziehungsweise Sich-Aufhalten unter dem Volk; »wohnst« ist im modernen Deutsch natürlicher als das wörtliche »sitzt«.
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ
  choice: Sie haben Augen, um zu sehen, sehen aber nicht
  rationale: Bildet die hebräische Konstruktion verständlich und eng nach. Das Präsens gibt die fortdauernde Charakterisierung wieder.
- source_word: אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  choice: sie haben Ohren, um zu hören, hören aber nicht
  rationale: Bewahrt den Parallelismus mit der Augenaussage und übersetzt שׁמע zunächst mit dem Grundsinn »hören«, ohne responsive Einsicht ausdrücklich einzutragen.
- source_word: כִּי
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung für ihr Nichtsehen und Nichthören.
theological_decisions:
- issue: Das korporative Bild »Haus« für Israel
  choice: Das Bild »Haus« bleibt im Haupttext erhalten.
  alternative: »widerspenstiges Volk« oder »Haus der Widerspenstigkeit«
  rationale: »Haus« ist ein prägendes korporatives Bild in Ezechiel und wird hier zweimal betont. Eine Ersetzung durch »Volk« wäre verständlicher, würde aber die Metapher und ihre Wiederholung beseitigen.
- issue: Bedeutungsumfang von »hören«
  choice: Der Grundsinn »hören« bleibt stehen.
  alternative: »verstehen« oder »gehorchen«
  rationale: שׁמע kann im prophetischen Zusammenhang ein aufmerksames, gehorsames Reagieren einschließen. Der Vers formuliert dies jedoch nicht ausdrücklich; die Spannung zwischen akustischem Hören und innerer Reaktion soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem prophetischem Ton. Die Wiederholung von »widerspenstiges Haus« und der Parallelismus von Augen und Ohren bleiben erhalten.
