source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/נָּשִׂ֞יא הַ/מַּשָּׂ֤א הַ/זֶּה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל אֲשֶׁר הֵ֥מָּה בְ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/010.yaml
  text: 'Say to them[a], ‘Thus says the Lord GOD: This burden concerns the prince in Jerusalem and all the house of Israel who are in their midst.’'
translation:
  language: de
  text: 'Sag zu ihnen: »So spricht der Herr Jahwe: Diese Last betrifft den Fürsten in Jerusalem und das ganze Haus Israel, das in ihrer Mitte ist.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dieser Ausspruch gilt dem Fürsten in Jerusalem und dem ganzen Haus Israel, das mitten unter ihnen ist.«'
    reason: מַשָּׂא kann neben »Last« auch einen prophetischen Ausspruch bezeichnen; בְּתוֹכָם lässt sich idiomatisch mit »mitten unter ihnen« wiedergeben. Der Bezug des pluralischen Suffixes bleibt im Hebräischen nicht völlig eindeutig.
lexical_decisions:
- source_word: אֱמֹר אֲלֵיהֶם
  choice: Sag zu ihnen
  rationale: Der Imperativ von אמר mit אֶל fordert dazu auf, den Angesprochenen die folgende Botschaft mitzuteilen; die Formulierung ist direkt und im Deutschen natürlich.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Wiedergabe der prophetischen Botenformel bewahrt ihren feierlichen und autoritativen Charakter.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die Verbindung aus dem Herrentitel אֲדֹנָי und dem Gottesnamen יהוה wird so unterschieden wiedergegeben, ohne die schwer verständliche Doppelung »Herr HERR« zu erzeugen.
- source_word: הַנָּשִׂיא
  choice: den Fürsten
  rationale: נָשִׂיא bezeichnet hier den politischen Herrscher in Jerusalem; »Fürst« bewahrt den titelartigen Klang.
- source_word: הַמַּשָּׂא הַזֶּה
  choice: Diese Last betrifft
  rationale: מַשָּׂא kann sowohl eine getragene Last als auch einen prophetischen Ausspruch bezeichnen. »Last« bewahrt im Zusammenhang der symbolisch getragenen Habe das Wortspiel; »betrifft« macht die knappe Nominalkonstruktion im Deutschen verständlich.
- source_word: וְכָל בֵּית יִשְׂרָאֵל
  choice: und das ganze Haus Israel
  rationale: Die biblische Kollektivbezeichnung »Haus Israel« bleibt erhalten, statt zu bloßem »Israel« verflacht zu werden.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: das dort in ihrer Mitte lebt
  rationale: Der Plural הֵמָּה greift das kollektiv verstandene Haus Israel auf. »Dort« verdeutlicht den Ortsbezug zu Jerusalem, während »in ihrer Mitte« die Mehrdeutigkeit des pluralischen Suffixes bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr Jahwe
  rationale: Die gewählte traditionelle deutsche Form unterscheidet Titel und Eigenname typografisch und vermeidet eine unbeholfene Verdoppelung. Sie legt keine besondere konfessionelle Deutung fest.
- issue: Bedeutung von מַשָּׂא
  choice: Last
  alternative: Ausspruch / Weissagung
  rationale: Im unmittelbaren Zusammenhang trägt Ezechiel Auswanderungsgepäck als Zeichenhandlung. »Last« lässt deshalb sowohl den konkreten Gegenstand als auch die mögliche prophetische Fachbedeutung anklingen, ohne die Spannung aufzulösen.
- issue: Bezug des Suffixes in בְתוֹכָם
  choice: in ihrer Mitte
  alternative: mitten unter ihnen
  rationale: Das hebräische pluralische Suffix hat keinen völlig eindeutigen unmittelbar vorangehenden Bezug. Die Übersetzung bewahrt diese Offenheit, statt eigenmächtig einen singularischen Bezug auf Jerusalem herzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Botenformel bleibt bewusst gehoben; ansonsten ist der Satz für heutige Leser verständlich formuliert. Die ungewöhnliche Bildkraft von »Last« und die Unklarheit des pluralischen Rückverweises werden nicht stillschweigend beseitigt.
