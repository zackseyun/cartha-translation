base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/004.yaml
  text: And you shall bring out your baggage like the baggage of exile by day before their eyes[b][a], and you yourself shall go out in the evening before their eyes like those going out into exile.
translation:
  language: de
  text: Du sollst dein Gepäck bei Tag vor ihren Augen hinausbringen, wie Gepäck für das Exil[a]. Du selbst sollst am Abend vor ihren Augen hinausgehen wie Menschen, die ins Exil ziehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wie das Gepäck eines Exilierten“. Der hebräische Ausdruck kann allgemein das zum Exil gehörende Gepäck oder das Gepäck eines einzelnen Exilierten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wie Exilierte hinausziehen“ oder „wie beim Auszug ins Exil“. Wörtlich steht im Hebräischen eine Wendung, die etwa „wie die Auszüge des Exils/der Exilierten“ lautet und die Art des Weggehens ins Exil bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: du sollst … hinaustragen
  rationale: Der Hifil von יצא bezeichnet hier das Hinausbringen. Bei Gepäck ist „hinaustragen“ im Deutschen natürlich und gibt die verursachende Bedeutung konkret wieder.
- source_word: כֵלֶיךָ
  choice: dein Gepäck
  rationale: כְּלִי kann Gerät, Gefäß oder Gegenstand bezeichnen; im Zusammenhang der dargestellten Deportation sind die mitgenommenen Habseligkeiten gemeint. „Gepäck“ ist dafür prägnant und verständlich.
- source_word: כִּכְלֵי גוֹלָה
  choice: wie Gepäck für die Verbannung
  rationale: Die Formulierung bezeichnet Gepäck, das mit Exil beziehungsweise Deportation verbunden ist. „Für die Verbannung“ klingt im modernen Deutschen natürlich, ohne die mögliche kollektive oder individuelle Zuordnung festzulegen.
- source_word: יוֹמָם
  choice: tagsüber
  rationale: Das Adverb bezeichnet die Handlung bei Tag und bildet den klaren Gegensatz zu „am Abend“.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die wörtlich nahe deutsche Wendung bewahrt die Anschaulichkeit und die im Hebräischen wiederholte Betonung der öffentlichen Sichtbarkeit.
- source_word: וְאַתָּה
  choice: du selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen hebt Ezechiels eigene Person gegenüber seinem zuvor hinausgetragenen Gepäck hervor.
- source_word: תֵּצֵא
  choice: sollst … hinausgehen
  rationale: Der Qal von יצא bezeichnet Ezechiels eigenes Hinausgehen; die einfache Bewegungsbedeutung bleibt erhalten.
- source_word: בָּעֶרֶב
  choice: am Abend
  rationale: Die zeitliche Angabe wird in natürlichem Standarddeutsch wiedergegeben und steht im beabsichtigten Gegensatz zu „tagsüber“.
- source_word: כְּמוֹצָאֵי גוֹלָה
  choice: wie Menschen, die in die Verbannung ziehen
  rationale: Die hebräische Konstruktion bezeichnet wahrscheinlich die für Deportierte typische Art des Ausziehens. Die Wiedergabe macht den im Idiom vorausgesetzten menschlichen Bezug verständlich, ohne die Wendung unnötig zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Wiederholung von „vor ihren Augen“ und der Gegensatz zwischen „tagsüber“ und „am Abend“ bleiben bewusst erhalten. „Verbannung“ vermittelt גוֹלָה verständlich, ohne das ältere und potenziell missverständliche „Gefangenschaft“ zu verwenden.
