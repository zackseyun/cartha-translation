  verdict: revise
  source_fidelity: Die Grundstruktur und die Gerichtstrias sind zutreffend. „Vor dem Schwert, dem Hunger und der Pest verschonen“ ist jedoch im Deutschen weniger präzise als eine Formulierung, die die wenigen Männer als Überlebende aus diesen Gefahren kennzeichnet. Das Perfekt in אֲשֶׁר בָּאוּ שָׁם ist im zukunftsbezogenen Kontext sinnvoll idiomatisch mit „zu denen sie kommen“ wiederzugeben; die formalere Perfektlesart soll in der Fußnote bleiben.
  naturalness: Die Revision beseitigt die etwas sperrige Verbindung „von ihnen einige wenige Männer vor ... verschonen“ und verwendet flüssiges modernes Standarddeutsch. „All ihre Gräuel“ bewahrt zugleich den gewichtigen prophetischen Ausdruck besser als „Gräueltaten“.
  terminology: „Schwert, Hunger und Pest“, „Völker“, „Gräuel“ und „Jahwe“ sind registergerecht und quellennah. „Erkennen“ gibt die ezechielische Erkenntnisformel angemessen wieder. Ein zusätzliches „Dann“ ist nicht erforderlich, da es eine stärkere zeitliche Folgerung nahelegen kann, als das einfache Waw verlangt.
  issues:
  - severity: medium
    issue: Die Wendung „vor dem Schwert, dem Hunger und der Pest verschonen“ gibt die Überlebendenkonstellation nur indirekt wieder.
    rationale: וְהוֹתַרְתִּי bezeichnet das Übriglassen bzw. Bewahren eines kleinen Restes; die Präpositionen markieren, dass diese dem Schwert, dem Hunger und der Pest entkommen. „Übrig lassen, die ... entkommen sind“ macht dies idiomatisch und präzise deutlich.
  - severity: low
    issue: „Gräueltaten“ ist enger auf konkrete Taten festgelegt als תּוֹעֲבוֹת.
    rationale: „Gräuel“ wahrt den starken moralisch-religiösen, in Ezechiel häufig kultisch geprägten Sammelbegriff, ohne ihn auf einzelne Handlungen zu beschränken.
  - severity: low
    issue: „Dann“ verstärkt den Anschluss von וְיָדְעוּ unnötig.
    rationale: Das Waw kann hier schlicht koordinierend sein. „Und sie werden erkennen“ erhält den knappen Stil und legt keine übermäßige zeitliche Abfolge fest.
  revised_text: Doch ich werde von ihnen nur wenige Männer übrig lassen, die dem Schwert, dem Hunger und der Pest entkommen sind, damit sie unter den Völkern, zu denen sie kommen[a], all ihre Gräuel erzählen. Und sie werden erkennen, dass ich Jahwe bin.
