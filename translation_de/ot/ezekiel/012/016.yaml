revisions:
- from: Doch ich werde von ihnen einige wenige Männer vor dem Schwert, dem Hunger und der Pest verschonen, damit sie unter den Völkern, zu denen sie gekommen sind[a], von all ihren Gräueltaten erzählen. Dann werden sie erkennen, dass ich Jahwe bin.
  to: Doch ich werde von ihnen nur wenige Männer übrig lassen, die dem Schwert, dem Hunger und der Pest entkommen sind, damit sie unter den Völkern, zu denen sie kommen[a], all ihre Gräuel erzählen. Und sie werden erkennen, dass ich Jahwe bin.
  rationale: Die Revision stellt die Bedeutung des Hifil von יתר als Übriglassen eines kleinen Restes klar heraus, verbindet die drei Gefahren idiomatisch mit den Überlebenden und bewahrt den prägnanten prophetischen Begriff „Gräuel“. Die zukunftsbezogene Hauptlesart von „kommen“ wird beibehalten, während die formale Perfektform des Hebräischen transparent in der Fußnote dokumentiert ist.
