  text: וְ/הוֹתַרְתִּ֤י מֵ/הֶם֙ אַנְשֵׁ֣י מִסְפָּ֔ר מֵ/חֶ֖רֶב מֵ/רָעָ֣ב וּ/מִ/דָּ֑בֶר לְמַ֨עַן יְסַפְּר֜וּ אֶת כָּל תּוֹעֲבֽוֹתֵי/הֶ֗ם בַּ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/016.yaml
  text: But I will spare from among them a few men from the sword[a], from famine, and from pestilence, so that they may recount all their abominations among the nations where they go; and they will know that I am Yahweh.
translation:
  language: de
  text: Doch ich werde von ihnen nur wenige Männer übrig lassen, die dem Schwert, dem Hunger und der Pest entkommen sind, damit sie unter den Völkern, zu denen sie kommen[a], all ihre Gräuel erzählen. Und sie werden erkennen, dass ich Jahwe bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu denen sie gekommen sind“. Das hebräische Verb steht formal in einer Vergangenheitsform, kann im zukunftsbezogenen Zusammenhang aber das bei der Ankunft erreichte Ziel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: ich werde … verschonen
  rationale: Der Hifil von יתר bezeichnet hier das Übriglassen beziehungsweise Bewahren von Überlebenden. „Verschonen“ gibt die beabsichtigte Bewahrung vor den drei Todesgefahren natürlich wieder.
- source_word: מֵהֶם
  choice: von ihnen
  rationale: Die Präposition bezeichnet die Auswahl aus der Gesamtgruppe; im Deutschen bringt „von ihnen“ diesen partitiven Sinn knapp zum Ausdruck.
- source_word: אַנְשֵׁי מִסְפָּר
  choice: einige wenige Männer
  rationale: Die Wendung meint eine geringe, zählbare Zahl. „Einige wenige Männer“ ist idiomatisch und bewahrt die ausdrücklich männliche Bezeichnung.
- source_word: מֵחֶרֶב מֵרָעָב וּמִדָּבֶר
  choice: vor dem Schwert, dem Hunger und der Pest
  rationale: Die traditionelle prophetische Gerichtstrias bleibt erhalten. „Schwert“ steht metonymisch für gewaltsamen Tod im Krieg, רָעָב für Hungersnot beziehungsweise Hunger als Gericht und דֶּבֶר für eine verheerende Seuche.
- source_word: לְמַעַן יְסַפְּרוּ
  choice: damit sie … erzählen
  rationale: לְמַעַן bezeichnet den Zweck; der Piel von ספר bedeutet hier ausführlich erzählen oder berichten.
- source_word: אֵת כָּל תּוֹעֲבוֹתֵיהֶם
  choice: von all ihren Gräueltaten
  rationale: תּוֹעֵבָה ist bei Ezechiel ein starker moralisch-religiöser Ausdruck, häufig für götzendienerische und andere verwerfliche Handlungen. „Gräueltaten“ wahrt dieses Gewicht in gegenwärtigem Deutsch.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Gemeint sind die fremden Völker, unter denen die Überlebenden leben werden; „unter den Völkern“ ist im Deutschen natürlich und kontextgerecht.
- source_word: אֲשֶׁר בָּאוּ שָׁם
  choice: zu denen sie gekommen sind
  rationale: Die formal perfektive Verbform wird zunächst als vollendetes Ankommen wiedergegeben. Wegen des zukunftsbezogenen Zusammenhangs ist auch eine deutsche Präsensform möglich; diese Ambiguität wird in der Fußnote ausgewiesen.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Die wiederkehrende Erkenntnisformel Ezechiels bezeichnet mehr als bloßes Faktenwissen. „Erkennen“ wahrt ihren erfahrungsbezogenen und gerichtlichen Nachdruck; „dann“ verdeutlicht den folgernden Zusammenhang des Waw.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen etablierte Form.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung in אַנְשֵׁי מִסְפָּר
  choice: einige wenige Männer
  alternative: einige wenige Menschen
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich Männer. Die Übersetzung neutralisiert diese Angabe nicht.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als Gottes Eigennamen. Die Übersetzung bewahrt ihn in der im Deutschen üblichen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des abschließenden Erkenntnissatzes
  choice: Subjekt bleibt „sie“ ohne nähere Festlegung
  alternative: ausdrückliche Festlegung auf die Überlebenden oder die Völker
  rationale: Die hebräische Verbform nennt nur ein maskulines Pluralsubjekt. Die Übersetzung erhält diese mögliche Bezugsoffenheit, statt einen Referenten ergänzend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Ernst. Die feste Gerichtstrias „Schwert, Hunger und Pest“ sowie die Erkenntnisformel bleiben erkennbar; unnötige Archaismen werden vermieden.
