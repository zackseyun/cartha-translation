  text: And the word of Yahweh came to me, saying,
translation:
  language: de
  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Die Wayyiqtol-Form von היה dient hier als übliche fortführende Einleitung. Im Deutschen wird sie natürlich mit dem folgenden Satz verbunden, statt hölzern mit „Und es geschah“ wiedergegeben zu werden.
- source_word: דְבַר
  choice: das Wort
  rationale: In der festen prophetischen Verbindung דְבַר יְהוָה bewahrt „das Wort“ den etablierten lexikalischen und theologischen Gehalt besser als das deutendere „die Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bedeutet hier schlicht „zu mir“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Gottesrede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt dieselbe Diskursfunktion prägnanter als das semitisch geprägte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als Eigennamen. „Jahwe“ bewahrt diesen Charakter und entspricht der im modernen Deutschen üblichen Form, ohne einen Titel einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Einleitungsformel bleibt erkennbar; der Doppelpunkt führt natürlich in die nachfolgende Rede.
