  text: כִּ֠י לֹ֣א יִֽהְיֶ֥ה ע֛וֹד כָּל חֲז֥וֹן שָׁ֖וְא וּ/מִקְסַ֣ם חָלָ֑ק בְּ/ת֖וֹךְ בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/024.yaml
  text: For there will no longer be any false vision or flattering divination within the house of Israel[a].
translation:
  language: de
  text: Denn im Haus Israel wird es keine falsche Vision und keine schmeichelnde Wahrsagung[a] mehr geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „glatte Wahrsagung“. Das hebräische Adjektiv bedeutet wörtlich „glatt“ und meint hier wahrscheinlich eine schmeichelnde oder täuschend beruhigende Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein und wahrt den Zusammenhang natürlich.
- source_word: לֹא ... עוֹד
  choice: keine ... mehr
  rationale: Drückt zusammen mit den negierten Nominalgruppen aus, dass diese Erscheinungen künftig aufhören.
- source_word: יִהְיֶה
  choice: wird es ... geben
  rationale: Gibt den existenziellen Gebrauch von היה im natürlichen modernen Deutsch wieder.
- source_word: כָּל
  choice: keine
  rationale: Unter der Negation hat כָּל distributiv den Sinn „irgendeine“; im Deutschen wird die vollständige Verneinung idiomatisch mit „keine“ ausgedrückt.
- source_word: חֲזוֹן שָׁוְא
  choice: falsche Vision
  rationale: שָׁוְא bezeichnet hier Falschheit, Nichtigkeit oder Täuschung; „falsche Vision“ ist im prophetischen Zusammenhang klar und bewahrt den Schlüsselbegriff „Vision“.
- source_word: מִקְסַם
  choice: Wahrsagung
  rationale: Bezeichnet eine mantische beziehungsweise divinatorische Äußerung; „Wahrsagung“ ist für heutige Leser verständlich und gibt die im Kontext verurteilte Praxis wieder.
- source_word: חָלָק
  choice: schmeichelnde
  rationale: Das Wort bedeutet wörtlich „glatt“ und bezeichnet hier wahrscheinlich eine gefällige, täuschend beruhigende Äußerung. „Schmeichelnde“ vermittelt diesen idiomatischen Sinn, während die Fußnote die Bildlichkeit offenlegt.
- source_word: בְּתוֹךְ
  choice: im
  rationale: Bezeichnet den inneren Bereich beziehungsweise das Vorkommen innerhalb des Hauses Israel; die deutsche Verbindung „im Haus Israel“ ist knapp und natürlich.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Bewahrt die traditionelle prophetische Kollektivbezeichnung und die Bildsprache des hebräischen Ausdrucks.
theological_decisions:
- issue: Art der verurteilten Offenbarungsansprüche
  choice: Der Vers verurteilt sowohl falsche Visionen als auch gefällige beziehungsweise täuschende Wahrsagungen in Israel.
  alternative: חָלָק kann enger und wörtlicher als „glatt“ wiedergegeben werden, ohne die Art der Glätte ausdrücklich als Schmeichelei zu bestimmen.
  rationale: „Schmeichelnd“ macht die wahrscheinliche idiomatische Wirkung verständlich, während die Fußnote die wörtliche Alternative und damit die verbleibende Bedeutungsbreite bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem prophetischem Ausdruck „Haus Israel“. Die Satzstellung ist natürlich; die beiden parallelen Formen unrechtmäßiger Offenbarung bleiben deutlich erkennbar.
