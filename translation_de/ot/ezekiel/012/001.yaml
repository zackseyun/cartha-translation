  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an mich[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, traditionell mit „der HERR“ wiedergegeben; auch „Yahweh“ geschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form von היה eröffnet hier die nächste Offenbarung in der fortlaufenden Erzählung. Die im Deutschen geläufige prophetische Formel „das Wort … erging“ gibt diese Funktion natürlich und würdig wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: In der festen prophetischen Verbindung דְבַר יְהוָה bewahrt „Wort“ sowohl den sprachlichen als auch den offenbarenden Gehalt, ohne ihn interpretierend auf „Botschaft“ einzuengen.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt diesen Eigennamen im modernen deutschen Bibelregister wieder; der Genitiv „Jahwes“ entspricht der Konstruktion דְבַר יְהוָה.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der im Deutschen üblichen Wendung „das Wort … erging“ ist „an mich“ die natürliche Entsprechung der Richtungsangabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende wörtliche Rede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen personalen Namen; die traditionelle deutsche Wiedergabe „der HERR“ wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „das Wort Jahwes erging an mich“ wahrt den feierlichen Klang, während der Doppelpunkt die folgende direkte Rede idiomatisch einführt.
