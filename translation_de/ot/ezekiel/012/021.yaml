  text: 'Und das Wort Jahwes kam zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Die Form mit konsekutivem Waw führt den nächsten Erzählabschnitt ein. In der prophetischen Empfangsformel wird ihre Funktion im Deutschen natürlich durch „Und … kam“ zusammen mit dem folgenden Satz ausgedrückt.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet in dieser festen prophetischen Formel das von Gott empfangene Wort beziehungsweise die Botschaft. „Das Wort“ bewahrt die konkrete und formelhafte Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; im Genitiv lautet die natürliche deutsche Form „Jahwes“.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bedeutet hier unmittelbar „zu mir“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die im nächsten Vers folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im heutigen Deutschen natürlicher als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Empfangsformel bleibt erhalten; der Doppelpunkt kündigt die im Folgevers einsetzende Gottesrede an.
