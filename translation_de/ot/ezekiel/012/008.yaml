  yaml_path: translation/ot/ezekiel/012/008.yaml
  text: And in the morning the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und am Morgen erging das Wort Jahwes an mich[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: Die Wayyiqtol-Form führt die Erzählung fort und gehört zur festen prophetischen Wendung; „erging“ gibt diese im Deutschen natürlich und würdig wieder.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die lexikalische Gestalt von דָּבָר und den formelhaften prophetischen Klang; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֵלַי
  choice: an mich
  rationale: In der deutschen Wendung „das Wort erging an“ ist dies die natürliche Entsprechung der Präposition mit dem Suffix der ersten Person.
- source_word: בַּבֹּקֶר
  choice: Am Morgen
  rationale: Die Formulierung gibt die Zeitangabe knapp und idiomatisch wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formale „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ gibt ihn als Namen wieder; die traditionelle deutsche Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die feste prophetische Formel wird idiomatisch mit „das Wort Jahwes erging an mich“ wiedergegeben; der Doppelpunkt kündigt die Rede des folgenden Verses an.
