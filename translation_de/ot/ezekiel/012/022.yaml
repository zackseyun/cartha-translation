    issue: »jede Vision wird zunichte«
    rationale: Die Formulierung klingt im heutigen Deutsch elliptisch und kann eine äußere Vernichtung nahelegen. אָבַד ist aktiv/intransitiv („zugrunde gehen, vergehen“). »Jede Vision geht zugrunde« ist sprachlich klarer und quellennäher.
