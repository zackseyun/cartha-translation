  text: בֶּן אָדָ֗ם מָֽה הַ/מָּשָׁ֤ל הַ/זֶּה֙ לָ/כֶ֔ם עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַֽאַרְכוּ֙ הַ/יָּמִ֔ים וְ/אָבַ֖ד כָּל חָזֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/022.yaml
  text: Son of man[a], what is this proverb that you have in the land of Israel, saying, ‘The days drag on, and every vision comes to nothing’?”
translation:
  language: de
  text: 'Menschensohn, was ist das für ein Sprichwort, das bei euch im Land Israel im Umlauf ist: »Die Tage ziehen sich hin, und jede Vision geht zugrunde.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Tage werden lang, und jede Vision scheitert.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels wiederkehrende prophetische Anredeformel und ihre literarische Einheitlichkeit; hier ist die menschliche Begrenztheit des Propheten im Blick, ohne dass ein späterer christologischer Titel eingetragen wird.
- source_word: מָה הַמָּשָׁל הַזֶּה לָכֶם
  choice: was ist das für ein Sprichwort, das ihr … gebraucht?
  rationale: מָשָׁל bezeichnet hier einen verbreiteten sprichwörtlichen Ausspruch, nicht eine erzählende Parabel. לָכֶם wird sinngemäß als ein unter den Angeredeten gebräuchlicher Spruch wiedergegeben.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: im Land Israel
  rationale: אַדְמָה bedeutet wörtlich Boden oder Erdboden, bezeichnet in dieser Verbindung jedoch das Gebiet Israels; die gewählte Formulierung ist natürlich und sachlich genau.
- source_word: יַאַרְכוּ הַיָּמִים
  choice: Die Tage ziehen sich hin
  rationale: Die Wendung bezeichnet das Langwerden beziehungsweise die Verzögerung der Tage. »ziehen sich hin« gibt zugleich den skeptischen Ton des Sprichworts wieder.
- source_word: וְאָבַד כָּל חָזוֹן
  choice: und jede Vision wird zunichte
  rationale: אָבַד bedeutet zugrunde gehen, verloren gehen oder scheitern. Im Zusammenhang behauptet der Spruch, prophetische Visionen würden wirkungslos bleiben beziehungsweise sich nicht erfüllen.
theological_decisions:
- issue: Wiedergabe von אָדָם in der prophetischen Anrede
  choice: Menschensohn
  alternative: Sterblicher; Menschenkind
  rationale: Die Wendung ist hier Hesekiels regelmäßige göttliche Anrede und kein ausdrücklich christologischer Titel. »Menschensohn« erhält die literarische Formel und ihre innerbiblischen Bezüge, ohne die Bedeutung dogmatisch festzulegen.
- issue: Aussage über das Ausbleiben prophetischer Erfüllung
  choice: jede Vision wird zunichte
  alternative: jede Vision scheitert; jede Vision vergeht
  rationale: 'Die Übersetzung bewahrt den abwertenden Inhalt des skeptischen Sprichworts: Die angekündigten Visionen gelten als hinfällig oder unerfüllt. Sie macht daraus keine objektive theologische Aussage, sondern belässt sie als Zitat der Angeredeten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage wird idiomatisch formuliert; das folgende Sprichwort bleibt als direktes Zitat deutlich erkennbar. Der Fußnotenmarker steht unmittelbar nach dem Zitat.
