  verdict: revise
  source_fidelity: Die Anrede »Menschensohn«, »Sprichwort«, die Ortsangabe und »Die Tage ziehen sich hin« geben den hebräischen Text treffend wieder. Für וְאָבַד כָּל־חָזוֹן ist »jede Vision wird zunichte« jedoch im Deutschen syntaktisch und semantisch weniger klar; »geht zugrunde« bildet אָבַד unmittelbar ab, ohne die Behauptung des Sprichworts über die Nichterfüllung stärker zu deuten.
  naturalness: Die vorgeschlagene Umformung mit »bei euch ... im Umlauf ist« ist modernes, natürliches Standarddeutsch und gibt לָכֶם idiomatisch wieder. »geht zugrunde« ist hier deutlich idiomatischer als »wird zunichte«.
  terminology: »Menschensohn« bewahrt die wiederkehrende Anrede Hesekiels ohne christologische Festlegung. »Sprichwort« ist für מָשָׁל im Kontext eines skeptischen volkstümlichen Ausspruchs passend. »Vision« entspricht חָזוֹן.
  issues:
