lexical_decisions:
- source_word: וַיְהִי
  choice: Und … kam
  rationale: Die Wayyiqtol-Form von היה leitet hier die nächste Offenbarung in der Erzählfolge ein. Im Deutschen gibt die etablierte prophetische Formel „Und … kam“ diese Funktion natürlich wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: In der festen prophetischen Wendung דְבַר יְהוָה bezeichnet der Ausdruck eine konkrete göttliche Mitteilung. „Das Wort“ wahrt zugleich den wiederkehrenden formelhaften Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn im Deutschen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bezeichnet den Propheten als Empfänger der Mitteilung; „zu mir“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר führt die nachfolgende direkte Rede ein. Da diese erst im nächsten Vers folgt, erfüllt im heutigen Deutschen ein Doppelpunkt dieselbe Funktion natürlicher als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Namensfunktion; die traditionelle deutsche Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute prophetische Formel bleibt erkennbar; לֵאמֹר wird idiomatisch durch den die folgende Rede ankündigenden Doppelpunkt wiedergegeben.
