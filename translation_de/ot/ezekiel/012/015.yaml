source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בַּ/הֲפִיצִ֤/י אוֹתָ/ם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/015.yaml
  text: And they will know that I am Yahweh when I scatter them among the nations and disperse them through the lands[a].
translation:
  language: de
  text: Und sie werden erkennen, dass ich Jahwe bin, wenn ich sie unter die Völker zerstreue und über die Länder verstreue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und sie werden erkennen
  rationale: Das Qal Perfekt mit וְ hat im prophetischen Zusammenhang Zukunfts- beziehungsweise Ergebnisbedeutung. „Erkennen“ bewahrt zudem die für Ezechiel typische Erkenntnisformel.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: כִּי leitet den Inhalt der Erkenntnis ein; der Gottesname יהוה wird transparent als „Jahwe“ wiedergegeben.
- source_word: בַּהֲפִיצִי
  choice: wenn ich sie … zerstreue
  rationale: בְּ mit dem Hifil-Infinitivus constructus und Suffix der 1. Person Singular ist hier natürlich temporal wiederzugeben. Das Hifil von פוץ bezeichnet das Veranlassen einer Zerstreuung.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: גּוֹיִם bezeichnet hier die fremden Völker, unter die Israel zerstreut wird. Die Richtungsformulierung ist im Deutschen bei „zerstreuen“ idiomatisch und entspricht dem Vorgang der Verteilung innerhalb der Völkerwelt.
- source_word: וְזֵרִיתִי
  choice: und … verstreue
  rationale: זרה bedeutet zerstreuen oder ausstreuen und kann an das Worfeln erinnern. „Verstreuen“ wahrt die Parallelität zu פוץ, ohne beide Verben völlig gleich wiederzugeben.
- source_word: בָּאֲרָצוֹת
  choice: über die Länder
  rationale: Der Plural אֲרָצוֹת bedeutet „Länder“. „Über die Länder verstreuen“ gibt die räumliche Ausbreitung idiomatisch wieder, ohne moderne Staatsbegriffe aufzudrängen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den Eigennamen und die Bundes- und Erkenntnisformel, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei hebräischen Verben für das Zerstreuen werden mit „zerstreuen“ und „verstreuen“ unterschieden; dadurch bleiben Parallelität und leichte lexikalische Variation erhalten.
