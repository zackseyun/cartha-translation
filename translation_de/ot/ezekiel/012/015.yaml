  source_fidelity: Der Entwurf gibt die hebräische Erkenntnisformel zukunftsbezogen zutreffend wieder. Die temporale Wiedergabe von בַּהֲפִיצִי mit „wenn ich … zerstreue“ ist sachgerecht. „Unter die Völker“ für בַּגּוֹיִם sowie „über die Länder“ für בָּאֲרָצוֹת geben die räumliche Zerstreuung idiomatisch und ohne unzulässige Präzisierung wieder. Die Variation „zerstreue / verstreue“ bildet die beiden hebräischen Verben angemessen ab.
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Satzfügung ist flüssig; die Wiederaufnahme von „sie“ bei beiden Verben ist natürlich und klar.
