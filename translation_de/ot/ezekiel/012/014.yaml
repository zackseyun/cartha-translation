id: EZK.12.14
reference: Ezekiel 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר סְבִיבֹתָ֥י/ו עזר/ה וְ/כָל אֲגַפָּ֖י/ו אֱזָרֶ֣ה לְ/כָל ר֑וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/014.yaml
  text: And all who are around him—his helpers and all his troops—I will scatter to every wind[b][a], and I will draw out a sword after them.
translation:
  language: de
  text: Und alle, die um ihn herum sind – seine Helfer[a] und alle seine Truppen –, werde ich in alle Winde[b] zerstreuen; und hinter ihnen her werde ich das Schwert ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck kann formal auch mit „seine Hilfe“ wiedergegeben werden; hier bezeichnet er kollektiv diejenigen, die ihm helfen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu jedem Wind“, das heißt: in alle Richtungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתָיו
  choice: die um ihn herum sind
  rationale: Die Form bezeichnet die Menschen in seinem Umkreis. Der Relativsatz ist im Deutschen natürlich und bewahrt den Bezug auf ihn.
- source_word: עֶזְרָה
  choice: seine Helfer
  rationale: Der Ausdruck bezeichnet hier kollektiv die Personen, die ihm Beistand leisten. „Helfer“ gibt den Personenbezug im Kontext klarer wieder als das abstrakte „Hilfe“.
- source_word: אֲגַפָּיו
  choice: alle seine Truppen
  rationale: Das Wort kann wörtlich Flügel oder Seiten bezeichnen, meint in diesem militärisch-politischen Zusammenhang jedoch die ihm zugeordneten Verbände.
- source_word: אֱזָרֶה
  choice: werde ich … zerstreuen
  rationale: Das Piel von זרה kann „zerstreuen“ oder „worfeln“ bedeuten. Bei Menschen als Objekt ist „zerstreuen“ die passende natürliche Wiedergabe.
- source_word: לְכָל רוּחַ
  choice: in alle Winde
  rationale: Die wörtliche Wind-Metapher wird mit der entsprechenden verständlichen deutschen Wendung bewahrt; gemeint ist eine Zerstreuung in alle Richtungen.
- source_word: חֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: hinter ihnen her werde ich das Schwert ziehen
  rationale: ריק im Hiphil mit „Schwert“ bezeichnet das Ziehen beziehungsweise Zücken des Schwertes. „Hinter ihnen her“ erhält zusätzlich den Gedanken der Verfolgung in אַחֲרֵיהֶם.
theological_decisions: []
