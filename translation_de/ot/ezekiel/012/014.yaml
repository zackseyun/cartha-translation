  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche gliedern die nähere Bestimmung der Menschen um ihn. Die prophetische Wind-Metapher und der Verfolgungssinn von „hinter ihnen her“ bleiben erhalten.
