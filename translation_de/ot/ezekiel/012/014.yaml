  source_fidelity: Die Übersetzung gibt die Gruppen um den gemeinten Führer, die kollektive Bezeichnung für seine Unterstützung, die militärischen Verbände, die Zerstreuung „in alle Winde“ und das anschließende Ziehen des Schwertes mit dem Verfolgungssinn von אַחֲרֵיהֶם zuverlässig wieder. Die Wiedergabe von עֶזְרֹה als „seine Helfer“ ist kontextgerecht; die Fußnote bewahrt die formal nähere Alternative „seine Hilfe“.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Konstruktion mit Gedankenstrichen gliedert die Aufzählung klar. „Hinter ihnen her werde ich das Schwert ziehen“ ist als prophetisch-bildhafte Formulierung idiomatisch und erhält die Bewegungsrichtung des Hebräischen.
  terminology: „Helfer“, „Truppen“, „zerstreuen“ und „das Schwert ziehen“ sind sachlich und registergerecht. „In alle Winde“ ist die etablierte deutsche Entsprechung der hebräischen Windmetapher, ohne die idiomatische Bildlichkeit zu verlieren.
