source:
  edition: WLC
  text: וְ/הֶ/עָרִ֤ים הַ/נּֽוֹשָׁבוֹת֙ תֶּחֱרַ֔בְנָה וְ/הָ/אָ֖רֶץ שְׁמָמָ֣ה תִֽהְיֶ֑ה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/020.yaml
  text: And the inhabited cities will be laid waste[a], and the land will become a desolation; then you will know that I am Yahweh.
translation:
  language: de
  text: Und die bewohnten Städte werden veröden, und das Land wird zur Einöde werden. Dann werdet ihr erkennen, dass ich Jahwe[a] bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; in deutschen Bibelübersetzungen traditionell mit „der HERR“ wiedergegeben.'
    reason: Erläuterung der Wiedergabe des Gottesnamens
lexical_decisions:
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft. Im Zusammenhang der umfassenden Gerichtsankündigung ist „Städte“ die natürliche und hinreichend breite Wiedergabe.
- source_word: הַנּוֹשָׁבוֹת
  choice: die bewohnten
  rationale: Das Partizip von ישׁב kennzeichnet die Städte als bewohnt beziehungsweise besiedelt und hebt so den Gegensatz zur bevorstehenden Verwüstung hervor.
- source_word: תֶּחֱרַבְנָה
  choice: werden verwüstet werden
  rationale: Die Form bezeichnet, dass die Städte verwüstet beziehungsweise zur Ruine werden. Die deutsche Passivform gibt das angekündigte Ergebnis klar und in prophetisch angemessenem Stil wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“, „Erde“ oder „Gebiet“ bedeuten. Der Zusammenhang mit den Städten und ihrer Verwüstung spricht hier für das regional verstandene „Land“.
- source_word: שְׁמָמָה
  choice: zur Einöde
  rationale: Das Substantiv bezeichnet einen Zustand völliger Verödung oder Verwüstung. „Zur Einöde werden“ bewahrt die nominale Aussage und klingt im Deutschen natürlich.
- source_word: תִהְיֶה
  choice: wird … werden
  rationale: היה kann „sein“ heißen, bezeichnet hier aber im Zusammenhang mit שְׁמָמָה den Übergang in einen neuen Zustand.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Die fortführende Verbform mit וְ drückt in der prophetischen Abfolge eine Folge aus. „Dann“ macht diesen Zusammenhang deutlich; „erkennen“ gibt das mehr als rein intellektuelle Wissen im Deutschen angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen; die Fußnote weist auf die traditionelle deutsche Ersatzwiedergabe hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die Wiederholung von „werden“ wurde beibehalten, um die zwei parallelen Zukunftsaussagen klar abzubilden; „Einöde“ wahrt den nominalen und prophetischen Charakter von שְׁמָמָה.
