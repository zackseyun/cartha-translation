  text: וּ/פָרַשְׂתִּ֤י אֶת רִשְׁתִּ/י֙ עָלָ֔י/ו וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וְ/הֵבֵאתִ֨י אֹת֤/וֹ בָבֶ֨לָ/ה֙ אֶ֣רֶץ כַּשְׂדִּ֔ים וְ/אוֹתָ֥/הּ לֹֽא יִרְאֶ֖ה וְ/שָׁ֥ם יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/013.yaml
  text: I will spread my net over him[a], and he will be caught in my snare. Then I will bring him to Babylon, the land of the Chaldeans; yet he will not see it[b], and there he will die.
translation:
  language: de
  text: Ich werde mein Netz über ihn ausbreiten, und er wird sich in meinem Fangnetz verfangen[a]. Dann werde ich ihn nach Babel, in das Land der Chaldäer, bringen; doch er wird es nicht sehen[b], und dort wird er sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meiner Falle“. Das Hebräische verwendet zwei verwandte Begriffe aus dem Bereich des Jagens und Fangens: „mein Netz“ und „mein Fangnetz“ beziehungsweise „meine Falle“.'
    reason: lexical_alternative
  - marker: b
    text: Dass er nach Babel gebracht wird, es jedoch nicht sieht, wird häufig im Licht von 2. Könige 25,7 sowie Jeremia 39,7; 52,11 verstanden.
    reason: cross_reference
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: Ich werde … ausbreiten
  rationale: Das Verb פָּרַשׂ bezeichnet das Ausbreiten oder Ausspannen; „ausbreiten“ bewahrt hier das Bild eines über jemanden gelegten Netzes.
- source_word: רִשְׁתִּי
  choice: mein Netz
  rationale: רֶשֶׁת ist die übliche Bezeichnung für ein Netz, besonders im Jagd- und Fangbild.
- source_word: עָלָיו
  choice: über ihm
  rationale: עַל ist im räumlichen Sinn wiedergegeben und passt zum Bild des ausgebreiteten Netzes.
- source_word: וְנִתְפַּשׂ
  choice: er wird … gefangen werden
  rationale: Der Nifal drückt hier passives Ergriffen- beziehungsweise Gefangenwerden aus; die Formulierung hält das Fangbild fest.
- source_word: בִּמְצוּדָתִי
  choice: in meinem Fangnetz
  rationale: מְצוּדָה kann Netz, Schlinge oder Falle bezeichnen. „Fangnetz“ ist im Deutschen natürlich und hält die enge Beziehung der beiden hebräischen Fangbegriffe sichtbar.
- source_word: וְהֵבֵאתִי אֹתוֹ
  choice: Dann werde ich ihn … bringen
  rationale: Der Hifil von בוא bedeutet „bringen“. „Dann“ gibt die Abfolge idiomatisch wieder, ohne einen zusätzlichen kausalen Sinn einzutragen.
- source_word: בָבֶלָה
  choice: nach Babel
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Babel zu; bei Städtenamen ist „nach“ die natürliche deutsche Wiedergabe.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: ins Land der Chaldäer
  rationale: Die Formulierung bewahrt die historische und ethnische Bezeichnung כַּשְׂדִּים und gibt die Apposition flüssig wieder.
- source_word: וְאוֹתָהּ לֹא יִרְאֶה
  choice: doch er wird es nicht sehen
  rationale: 'Das feminine Pronomen bezieht sich auf das Land. „Doch“ bewahrt den auffälligen Gegensatz: Er wird dorthin gebracht, wird es aber nicht sehen.'
- source_word: וְשָׁם יָמוּת
  choice: und dort wird er sterben
  rationale: Die direkte Wiedergabe erhält sowohl die Satzfolge als auch die Betonung des Ortes.
theological_decisions:
- issue: Historische Spannung in der Aussage, dass er nach Babel gebracht wird, es aber nicht sieht
  choice: Die Aussage bleibt im Haupttext wörtlich und ohne Angabe der Ursache stehen.
  alternative: Im Haupttext erläuternd ergänzen, dass er Babel wegen seiner Blendung nicht sehen wird.
  rationale: Der Vers selbst nennt die Ursache nicht. Die unerklärte Spannung soll erhalten bleiben; die historischen Parallelstellen können in einer Fußnote Orientierung geben, ohne den Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Babel“ bewahrt die traditionelle biblische Ortsbezeichnung; „Fangnetz“ erhält das Jagdbild und vermeidet eine unnötige Auflösung der beiden verwandten hebräischen Begriffe. Die Syntax folgt dem hebräischen Ablauf, bleibt aber für heutige Leser flüssig.
