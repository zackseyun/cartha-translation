revisions:
- from: Ich werde mein Netz über ihm ausbreiten[a], und er wird in meinem Fangnetz gefangen werden. Dann werde ich ihn nach Babel bringen, ins Land der Chaldäer; doch er wird es nicht sehen[b], und dort wird er sterben.
  to: Ich werde mein Netz über ihn ausbreiten, und er wird sich in meinem Fangnetz verfangen[a]. Dann werde ich ihn nach Babel, in das Land der Chaldäer, bringen; doch er wird es nicht sehen[b], und dort wird er sterben.
  rationale: Die Revision korrigiert den deutschen Kasusfehler, glättet die Fangmetaphorik ohne deren Bildgehalt zu verändern und ersetzt die irreführende erste Fußnote durch eine echte lexikalische Alternative mit passendem Anker. Die historische Spannung des hebräischen Textes bleibt im Haupttext uneingeebnet; die Parallelstellen stehen ausschließlich in der Fußnote.
