revisions:
- from: Denn ich bin Jahwe. Was ich sage, das sage ich, und es wird geschehen. Es wird nicht länger hinausgezögert werden. Denn noch zu euren Lebzeiten, ihr widerspenstiges Haus, werde ich ein Wort sprechen und es ausführen – Ausspruch des Herrn Jahwe.
  to: 'Denn ich, Jahwe, werde reden: Was immer ich als Wort rede, wird geschehen. Es wird nicht länger hinausgezögert. Denn in euren Tagen, ihr widerspenstiges Haus, werde ich ein Wort reden und es ausführen – Spruch des Herrn Jahwe.'
  rationale: Die Revision stellt die Wort-Aussage-Verwirklichungs-Verbindung von אֲדַבֵּר … דָּבָר … וְיֵעָשֶׂה wieder her, ohne die etwas markierte hebräische Wiederholung mechanisch nachzubilden. „In euren Tagen“ wahrt die zeitliche Weite des Ausgangstextes. Die unbestimmte Rückbeziehung von „Es“ bei der nicht länger hinausgezögerten Erfüllung bleibt erhalten.
  reviewer_model: gpt-5.6-terra
