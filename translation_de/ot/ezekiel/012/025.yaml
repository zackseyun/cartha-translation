  text: כִּ֣י אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה לֹ֥א תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽ/ימֵי/כֶ֞ם בֵּ֣ית הַ/מֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַ/עֲשִׂיתִ֔י/ו נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/025.yaml
  text: For I am Yahweh[a]; the word that I speak will be done. It will no longer be delayed, for in your days, O rebellious house, I will speak a word and do it[b], declares the Lord GOD.
translation:
  language: de
  text: 'Denn ich, Jahwe, werde reden: Was immer ich als Wort rede, wird geschehen. Es wird nicht länger hinausgezögert. Denn in euren Tagen, ihr widerspenstiges Haus, werde ich ein Wort reden und es ausführen – Spruch des Herrn Jahwe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: אֵת אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: Was ich sage, das sage ich
  rationale: Die betonte und im Hebräischen ungewöhnliche Formulierung wird bewusst mit nachdrücklicher Wiederaufnahme wiedergegeben, ohne ein im Deutschen schwer verständliches »welches Wort ich reden werde« zu erzeugen.
- source_word: וְיֵעָשֶׂה
  choice: und es wird geschehen
  rationale: Das Nifal bezeichnet hier das sichere Eintreten beziehungsweise die Verwirklichung des göttlichen Ausspruchs; »geschehen« ist im Deutschen natürlicher als das missverständliche »getan werden«.
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: Es wird nicht länger hinausgezögert werden
  rationale: Die passive Form und das Bild einer zeitlichen Verlängerung bleiben erhalten; der Bezug kann dem Ausspruch, der Sache oder ihrer Erfüllung gelten.
- source_word: בִימֵיכֶם
  choice: noch zu euren Lebzeiten
  rationale: Die idiomatische deutsche Wiedergabe verdeutlicht, dass die angekündigte Erfüllung innerhalb der Lebenszeit der Angeredeten eintreten wird.
- source_word: בֵּית הַמֶּרִי
  choice: ihr widerspenstiges Haus
  rationale: »Haus« bewahrt die kollektive und bundestheologische Metapher; »widerspenstig« bezeichnet die beharrliche Auflehnung, ohne die Wendung zu verflachen.
- source_word: וַעֲשִׂיתִיו
  choice: und es ausführen
  rationale: Das Waw-Perfekt drückt im Zusammenhang die gewisse künftige Verwirklichung aus. »Ausführen« stellt den Bezug zwischen angekündigtem Wort und göttlichem Handeln klar her.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: Die nominale Prophetenformel wird formal und zugleich idiomatisch wiedergegeben; אֲדֹנָי bleibt Titel, יְהוִה Eigenname.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des zusammengesetzten Titels
  choice: Jahwe … der Herr Jahwe
  alternative: der HERR … Gott, der HERR
  rationale: Der Eigenname יְהוָה wird transparent als »Jahwe« wiedergegeben. In אֲדֹנָי יְהוִה bleiben Titel und Eigenname unterscheidbar, ohne den Namen durch »GOTT« zu ersetzen.
- issue: Wirksamkeit des göttlichen Wortes
  choice: Die Aussage verbindet Gottes Reden unmittelbar mit dem sicheren Geschehen beziehungsweise Ausführen.
  alternative: Die Wendung ausschließlich als allgemeine Lehre von der schöpferischen Kraft jedes göttlichen Wortes auslegen.
  rationale: Der Vers betont im Kontext vor allem die nicht länger verzögerte Erfüllung der prophetischen Ankündigung; die Übersetzung wahrt diese Aussage, ohne eine weitergehende dogmatische Festlegung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung von אֲדַבֵּר wird zur Wahrung des hebräischen Nachdrucks beibehalten. Der direkte Anruf »ihr widerspenstiges Haus« klingt bewusst prophetisch und kollektiv.
