source:
  edition: WLC
  text: בֶּן אָדָ֗ם הִנֵּ֤ה בֵֽית יִשְׂרָאֵל֙ אֹֽמְרִ֔ים הֶ/חָז֛וֹן אֲשֶׁר ה֥וּא חֹזֶ֖ה לְ/יָמִ֣ים רַבִּ֑ים וּ/לְ/עִתִּ֥ים רְחוֹק֖וֹת ה֥וּא נִבָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/027.yaml
  text: Son of man, look, the house of Israel is saying, ‘The vision that he sees is for many days from now, and he prophesies about distant times.’
translation:
  language: de
  text: 'Menschensohn, sieh: Das Haus Israel sagt: »Die Vision, die er sieht, liegt noch viele Tage in der Zukunft, und er weissagt über ferne Zeiten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Menschensohn
  rationale: Die im Deutschen geläufige und kontextgerechte Wiedergabe der prophetischen Anrede; sie bewahrt das wiederkehrende Sprachmuster des Buches.
- source_word: הִנֵּה
  choice: sieh
  rationale: Gibt den aufmerksamkeitslenkenden Imperativ knapp und würdig wieder.
- source_word: בֵית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt die kollektive, traditionelle Bezeichnung des hebräischen Textes.
- source_word: הֶחָזוֹן אֲשֶׁר הוּא חֹזֶה
  choice: die Vision, die er sieht
  rationale: Erhält die bewusste Wiederholung desselben hebräischen Wortstamms, soweit dies im Deutschen natürlich möglich ist.
- source_word: לְיָמִים רַבִּים
  choice: erst in ferner Zukunft
  rationale: Drückt idiomatisch aus, dass die Erfüllung nach Meinung der Sprecher noch viele Tage entfernt liegt.
- source_word: וּלְעִתִּים רְחוֹקוֹת
  choice: über weit entfernte Zeiten
  rationale: Gibt sowohl den Gegenstandsbezug der Weissagung als auch die zeitliche Ferne wieder.
- source_word: נִבָּא
  choice: weissagt
  rationale: Entspricht dem prophetischen Kontext und dem üblichen deutschen Verb für prophetisches Reden.
theological_decisions:
- issue: Zeitliche Reichweite der Vision
  choice: Die Aussage wird als Behauptung des Hauses Israel wiedergegeben, dass die Vision eine ferne Zukunft betrifft.
  alternative: Die Formulierung könnte allgemeiner als »für viele Tage« wiedergegeben werden.
  rationale: Der parallele Ausdruck »weit entfernte Zeiten« zeigt, dass die Sprecher die angekündigte Erfüllung zeitlich hinausschieben; der Text selbst bestätigt ihre Einschätzung hier noch nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp; »Haus Israel«, »Vision« und »Menschensohn« wahren die charakteristische prophetische Diktion.
