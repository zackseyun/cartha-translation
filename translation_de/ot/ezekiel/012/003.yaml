revisions:
- from: Und du, Menschensohn, pack dir Gepäck für die Verbannung und zieh am helllichten Tag vor ihren Augen fort. Zieh vor ihren Augen von deinem Wohnort an einen anderen Ort. Vielleicht werden sie es erkennen, obwohl sie ein widerspenstiges Haus sind.
  to: Und du, Menschensohn, bereite dir Gepäck für die Verbannung und zieh bei Tag vor ihren Augen in die Verbannung. Zieh vor ihren Augen von deinem Ort an einen anderen Ort. Vielleicht werden sie sehen, denn sie sind ein widerspenstiges Haus.
  rationale: Die Revision hebt keine historische oder theologische Deutung hervor. Sie stellt den Exilcharakter der Zeichenhandlung ausdrücklich wieder her, wahrt die Wiederholung des hebräischen Textes, verwendet für יראו die offene Grundbedeutung „sehen“ und gibt כי mit der gewöhnlichen kausalen Verbindung wieder. Zugleich wird das Register geglättet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:24:46Z'
review_pass:
  verdict: revise
  source_fidelity: Die Zeichenhandlung und die doppelte Ortsveränderung sind grundsätzlich zutreffend wiedergegeben. „Zieh ... fort“ schwächt jedoch beim ersten Vorkommen den ausdrücklich durch גלה gesetzten Exilbezug ab; „erkennen“ legt bei יראו eine Deutung fest, wo der hebräische Text zunächst schlicht „sehen“ sagt. Die Wiedergabe von כי mit „obwohl“ ist möglich, aber weniger naheliegend als die kausale Verbindung und weicht vom englischen Audittext ab.
  naturalness: „Pack dir“ ist für die würdige prophetische Anrede zu umgangssprachlich. „Bei Tag“ ist modernes, natürliches Standarddeutsch und gibt יוֹמָם ohne die zusätzliche Zuspitzung von „am helllichten Tag“ wieder. „Deinem Ort“ ist näher am knappen hebräischen מִמְּקוֹמְךָ als „deinem Wohnort“.
  terminology: „Menschensohn“, „Gepäck für die Verbannung“ und „widerspenstiges Haus“ sind tragfähig. Die Wiederholung von „vor ihren Augen“ soll erhalten bleiben.
  issues:
  - severity: medium
    issue: „pack dir“ ist registersprachlich zu umgangssprachlich.
    rationale: Die unmittelbare Gottesrede in einer prophetischen Zeichenhandlung verlangt hier eine neutrale, würdige Formulierung wie „bereite dir ...“.
  - severity: medium
    issue: „sie es erkennen“ interpretiert יראו über die Grundbedeutung hinaus.
    rationale: Das Verb bedeutet „sehen“. Ob das Gesehene auch verstanden wird, kann der Kontext nahelegen, sollte aber nicht in den Wortlaut eingetragen werden.
  - severity: medium
    issue: Die konzessive Wiedergabe „obwohl“ für כי ist nicht die naheliegendste Lesart.
    rationale: כי verbindet den Satz am einfachsten kausal („denn“), wie auch im englischen Audittext. Eine konzessive Nuance ist nicht ausgeschlossen, aber im Deutschen stärker interpretierend.
  - severity: low
    issue: Der erste Exilbezug wird durch „zieh ... fort“ abgeschwächt.
    rationale: Die Wiederholung von גלה markiert die symbolisch vollzogene Verbannung; diese sollte im ersten Satz ausdrücklich erkennbar bleiben.
  revised_text: Und du, Menschensohn, bereite dir Gepäck für die Verbannung und zieh bei Tag vor ihren Augen in die Verbannung. Zieh vor ihren Augen von deinem Ort an einen anderen Ort. Vielleicht werden sie sehen, denn sie sind ein widerspenstiges Haus.
  revised_footnotes: []
