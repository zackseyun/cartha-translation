  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם עֲשֵׂ֤ה לְ/ךָ֙ כְּלֵ֣י גוֹלָ֔ה וּ/גְלֵ֥ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/גָלִ֨יתָ מִ/מְּקוֹמְ/ךָ֜ אֶל מָק֤וֹם אַחֵר֙ לְ/עֵ֣ינֵי/הֶ֔ם אוּלַ֣י יִרְא֔וּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/003.yaml
  text: And you, son of man, prepare for yourself baggage for exile, and go into exile by day before their eyes. You shall go into exile from your place to another place before their eyes. Perhaps they will see, though they are a rebellious house.
translation:
  language: de
  text: Und du, Menschensohn, bereite dir Gepäck für die Verbannung und zieh bei Tag vor ihren Augen in die Verbannung. Zieh vor ihren Augen von deinem Ort an einen anderen Ort. Vielleicht werden sie sehen, denn sie sind ein widerspenstiges Haus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: Gepäck für die Verbannung
  rationale: Die Wendung bezeichnet die Ausrüstung beziehungsweise das Bündel, das ein Verbannter zur Umsiedlung mitnimmt. „Gepäck für die Verbannung“ ist verständlich und bewahrt den Exilbezug.
- source_word: וּגְלֵה ... וְגָלִיתָ
  choice: zieh ... fort; Zieh ...
  rationale: Das hebräische Verb kann sowohl das Ins-Exil-Gehen als auch den konkreten Ortswechsel bezeichnen. „Fortziehen“ gibt die prophetische Zeichenhandlung natürlich wieder, während „Verbannung“ im Gepäckausdruck den Sinnrahmen sichert.
- source_word: יוֹמָם
  choice: am helllichten Tag
  rationale: Bezeichnet das Geschehen tagsüber und unterstreicht seine öffentliche Sichtbarkeit.
- source_word: יִרְאוּ
  choice: sie es erkennen
  rationale: Wörtlich „sie werden sehen“; hier kann das Sehen über die bloße Wahrnehmung der Handlung hinaus deren Bedeutung erfassen. Das Pronomen „es“ lässt den Gegenstand der Erkenntnis offen.
- source_word: בֵּית מְרִי
  choice: ein widerspenstiges Haus
  rationale: Bewahrt das kollektive Bild „Haus“ und gibt מְרִי als anhaltende Auflehnung beziehungsweise Widerspenstigkeit wieder.
theological_decisions:
- issue: Verhältnis von כִּי zum vorangehenden „Vielleicht“
  choice: obwohl sie ein widerspenstiges Haus sind
  alternative: denn sie sind ein widerspenstiges Haus
  rationale: 'כִּי ist mehrdeutig. Im Zusammenhang ergibt die konzessive Wiedergabe eine natürliche Spannung: Trotz ihrer bekannten Widerspenstigkeit besteht die Möglichkeit, dass sie die Zeichenhandlung erkennen. Diese im konsultierten Text bezeugte Deutung wird nicht dogmatisch ausgeweitet.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschensohn“ bleibt als etablierte prophetische Anrede erhalten. Die Wiederholung „vor ihren Augen“ wird entsprechend dem hebräischen Nachdruck bewahrt.
