source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִשְׁבַּ֨תִּי֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה וְ/לֹֽא יִמְשְׁל֥וּ אֹת֛/וֹ ע֖וֹד בְּ/יִשְׂרָאֵ֑ל כִּ֚י אִם דַּבֵּ֣ר אֲלֵי/הֶ֔ם קָֽרְבוּ֙ הַ/יָּמִ֔ים וּ/דְבַ֖ר כָּל חָזֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/023.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: I will put an end to this proverb, and they will no longer use it as a proverb in Israel. But say to them, “The days have drawn near, and the word of every vision.”’'
translation:
  language: de
  text: 'Darum sag zu ihnen: »So spricht der Herr Yahweh: Ich werde diesem Sprichwort ein Ende machen, und man wird es in Israel nicht länger als Sprichwort gebrauchen. Sag vielmehr zu ihnen: ›Die Tage sind nahe, und nahe ist auch das Wort jeder Vision.[a]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und das Wort jeder Vision«. Im Zusammenhang kann dies auf die Botschaft oder auf die Verwirklichung jeder prophetischen Vision bezogen sein.'
    reason: Die hebräische Nominalfügung enthält kein ausdrücklich genanntes Verb und lässt das Verhältnis des »Wortes« zur Vision offen.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Argument knapp und natürlich wieder.
- source_word: אֱמֹר אֲלֵיהֶם / דַּבֵּר אֲלֵיהֶם
  choice: sag zu ihnen
  rationale: Bewahrt den direkten prophetischen Auftrag und die Wiederholung des hebräischen Textes.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht Gott, der HERR
  rationale: Die im deutschen Bibelstil geläufige Wiedergabe vermeidet die missverständliche Doppelung »Herr HERR«; »HERR« kennzeichnet hier den Gottesnamen JHWH.
- source_word: הִשְׁבַּתִּי
  choice: Ich werde … ein Ende machen
  rationale: Das Hifil von שבת bezeichnet das Beenden beziehungsweise Aufhörenlassen; der prophetische Kontext legt eine wirksame Ankündigung nahe.
- source_word: הַמָּשָׁל הַזֶּה
  choice: diesem Sprichwort
  rationale: מָשָׁל bezeichnet hier den verbreiteten Spruch aus Vers 22, nicht eine erzählende Parabel.
- source_word: וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  choice: man wird es in Israel nicht länger als Sprichwort gebrauchen
  rationale: Das Verb משל bedeutet hier, einen Spruch sprichwörtlich zu gebrauchen; das unpersönliche »man« entspricht dem nicht näher bestimmten hebräischen Subjekt.
- source_word: כִּי אִם
  choice: vielmehr
  rationale: Markiert den Gegensatz zwischen dem abgeschafften Sprichwort und der nun auszurichtenden Botschaft.
- source_word: קָרְבוּ הַיָּמִים
  choice: Die Tage sind nahe
  rationale: Natürliche deutsche Wiedergabe des perfektischen Verbs, das die bereits eingetretene Nähe ausdrückt.
- source_word: וּדְבַר כָּל חָזוֹן
  choice: und das Wort jeder Vision erfüllt sich
  rationale: Bewahrt »Wort« als formale Entsprechung zu דָּבָר und macht zugleich durch das Verb deutlich, dass es im Kontext um das Eintreffen der prophetischen Botschaft geht.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr JHWH / der Herr Jahwe
  rationale: Die gewählte Form ist im modernen deutschen Bibelgebrauch verständlich und würdig, kennzeichnet JHWH typografisch und vermeidet eine konfessionell oder aussprachegeschichtlich festgelegte Lautung.
- issue: Bedeutung von דְבַר כָּל חָזוֹן
  choice: das Wort jeder Vision erfüllt sich
  alternative: das Wort jeder Vision / die Erfüllung jeder Vision
  rationale: Der hebräische Nominalsatz lässt das genaue Verhältnis unausgesprochen. Die Übersetzung erhält »Wort«, macht aber den vom Kontext geforderten Gedanken des Eintreffens transparent; die Fußnote weist die wörtlich knappere Form aus.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Register. Kurze, direkte Satzführung; die traditionelle Gottesnamenskonvention wird verständlich eingesetzt. Die Übersetzung vermeidet das heute missverständliche »Gesicht« für חָזוֹן und verwendet »Vision«.
