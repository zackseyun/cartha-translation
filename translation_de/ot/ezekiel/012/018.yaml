  text: בֶּן אָדָ֕ם לַחְמְ/ךָ֖ בְּ/רַ֣עַשׁ תֹּאכֵ֑ל וּ/מֵימֶ֕י/ךָ בְּ/רָגְזָ֥ה וּ/בִ/דְאָגָ֖ה תִּשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/018.yaml
  text: Son of man[a], eat your bread with trembling[b], and drink your water with quaking and anxiety.
translation:
  language: de
  text: Menschensohn, iss dein Brot mit Zittern und trink dein Wasser mit Beben und Sorge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die wörtliche, in Hesekiel regelmäßig wiederkehrende göttliche Anrede und vermeidet eine stärker deutende Wiedergabe.
- source_word: לַחְמְךָ
  choice: dein Brot
  rationale: Gibt das konkrete Grundnahrungsmittel des prophetischen Zeichenhandelns direkt wieder.
- source_word: בְּרַעַשׁ
  choice: mit Zittern
  rationale: רַעַשׁ bezeichnet ein Schütteln, Beben oder Zittern; „mit Zittern“ ist im Zusammenhang angstvollen Essens natürlich und körperlich anschaulich.
- source_word: תֹּאכֵל
  choice: iss
  rationale: Der Kontext verleiht dem Qal-Imperfekt auffordernde Kraft; der deutsche Imperativ gibt dies natürlich wieder.
- source_word: וּמֵימֶיךָ
  choice: und dein Wasser
  rationale: Der hebräische Plural wird idiomatisch als singularisches „Wasser“ wiedergegeben und erhält das konkrete Bild.
- source_word: בְּרָגְזָה
  choice: mit Beben
  rationale: רָגְזָה bezeichnet Erregung, Zittern oder Beben. „Beben“ wahrt die Nähe zu רַעַשׁ, ohne beide Wörter völlig gleichzusetzen.
- source_word: וּבִדְאָגָה
  choice: und Sorge
  rationale: דְאָגָה bezeichnet Sorge, Bekümmernis oder Angst. „Sorge“ ist natürliches modernes Deutsch und lässt die genaue Mischung aus Furcht und innerer Bedrängnis offen.
- source_word: תִּשְׁתֶּה
  choice: trink
  rationale: Das Qal-Imperfekt hat hier auffordernde Kraft und wird direkt mit dem deutschen Imperativ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen körperlichen Ausdrücke werden mit „Zittern“ und „Beben“ unterschieden; „Sorge“ bezeichnet die innere Bedrängnis. Die geläufige prophetische Anrede „Menschensohn“ bleibt erhalten.
