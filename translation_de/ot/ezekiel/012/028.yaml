source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹא תִמָּשֵׁ֥ךְ ע֖וֹד כָּל דְּבָרָ֑/י אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/028.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: None of my words will be delayed any longer, but the word that I speak will be done,’ declares the Lord GOD.'
translation:
  language: de
  text: 'Darum sag zu ihnen: »So spricht der Herr, Jahwe: Keines meiner Worte wird sich noch länger hinziehen[a]. Das Wort, das ich rede, wird geschehen«, spricht der Herr, Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wird nicht länger hinausgezögert.'
    reason: Die Nifalform von משׁך kann sowohl das zeitliche Sich-Hinziehen als auch ein Verzögertwerden bezeichnen.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Konjunktion knapp und natürlich wieder und bindet die Aussage an den vorausgehenden Zusammenhang.
- source_word: אֱמֹר אֲלֵיהֶם
  choice: sag zu ihnen
  rationale: Bewahrt den direkten Imperativ und die prophetische Sprechsituation in modernem Standarddeutsch.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige und würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Vermeidet die missverständliche Doppelung »Herr HERR« und kennzeichnet zugleich den Gottesnamen durch Kapitälchenkonvention.
- source_word: לֹא תִמָּשֵׁךְ עוֹד כָּל דְּבָרָי
  choice: Keines meiner Worte wird sich noch länger hinziehen
  rationale: Gibt die Gesamtheit unter der Verneinung idiomatisch wieder und wahrt das Bild des zeitlichen Hinausziehens, ohne es vorschnell nur als Verzögerung zu deuten.
- source_word: אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: Was ich sage
  rationale: Gibt die emphatische, im Deutschen schwer wörtlich nachzubildende Wortfolge natürlich wieder; der generische Aspekt des Imperfekts bleibt erhalten.
- source_word: וְיֵעָשֶׂה
  choice: wird geschehen
  rationale: Drückt im Kontext die tatsächliche Verwirklichung des gesprochenen Wortes aus; gegenüber »wird getan« ist dies im Deutschen natürlicher, ohne einen menschlichen Vollstrecker einzutragen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht Gott, der HERR
  rationale: Entspricht der feierlichen prophetischen Bekräftigungsformel in vertrautem, nicht archaischem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr Jahwe
  rationale: Die gewählte traditionelle deutsche Form unterscheidet den Titel אֲדֹנָי vom Gottesnamen יְהוִה und vermeidet »Herr HERR«. Die Alternative »der Herr Jahwe« wäre quellenäher in der Namenswiedergabe, ist jedoch im allgemeinen modernen Bibeldeutsch weniger geläufig.
- issue: Art der Erfüllung des göttlichen Wortes
  choice: wird geschehen
  alternative: wird ausgeführt / wird getan
  rationale: Das Nifal von עשה bezeichnet hier die sichere Realisierung des Gesagten. »Geschehen« bewahrt die Aussage über die Erfüllung, ohne festzulegen, auf welche Weise oder durch welchen Handelnden sie zustande kommt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel »So spricht« bleibt erhalten; ansonsten werden unnötig archaische Wendungen vermieden. Der Haupttext bewahrt mit »sich hinziehen« das hebräische Bild, während die Fußnote die kontextuell naheliegende Bedeutung »hinausgezögert« nennt.
