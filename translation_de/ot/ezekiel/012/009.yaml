  text: בֶּן אָדָ֕ם הֲ/לֹ֨א אָמְר֥וּ אֵלֶ֛י/ךָ בֵּ֥ית יִשְׂרָאֵ֖ל בֵּ֣ית הַ/מֶּ֑רִי מָ֖ה אַתָּ֥ה עֹשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/009.yaml
  text: Son of man[a], has not the house of Israel, that rebellious house, said to you, ‘What are you doing?’
translation:
  language: de
  text: 'Menschensohn, hat nicht das Haus Israel, dieses widerspenstige Haus, zu dir gesagt: »Was tust du da?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels charakteristische göttliche Anrede und ihre literarische Kontinuität. Im Deutschen ist »Menschensohn« als biblischer Ausdruck verständlich und weniger auslegend als »Sterblicher«.
- source_word: הֲלֹא
  choice: hat ... nicht
  rationale: Gibt die rhetorische Frage wieder, die eine bejahende Antwort erwartet.
- source_word: אָמְרוּ אֵלֶיךָ
  choice: dich ... gefragt
  rationale: Wörtlich steht »zu dir gesagt«; da die direkte Rede eine Frage ist, klingt »dich gefragt« im modernen Deutschen natürlich und bewahrt den kommunikativen Sinn.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Erhält die für die prophetische Sprache typische kollektive Bundesbezeichnung, statt sie zu »Volk Israel« zu verflachen.
- source_word: בֵּית הַמֶּרִי
  choice: dieses widerspenstige Haus
  rationale: Die Wendung steht als Apposition zu »Haus Israel«. »Widerspenstig« gibt die beharrliche Auflehnung von מֶרִי natürlich und mit der nötigen prophetischen Schärfe wieder.
- source_word: מָה אַתָּה עֹשֶׂה
  choice: Was tust du da?
  rationale: Das Partizip bezeichnet die gerade stattfindende Handlung. Das deutsche »da« verdeutlicht idiomatisch den situativen Bezug, ohne zusätzliche Sachinformation einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter prophetischer Formelhaftigkeit. Die Apposition wird durch »dieses« klar und natürlich markiert; eine Fußnote ist nicht erforderlich.
