source:
  edition: WLC
  text: לְ/עֵ֨ינֵי/הֶ֜ם עַל כָּתֵ֤ף תִּשָּׂא֙ בָּ/עֲלָטָ֣ה תוֹצִ֔יא פָּנֶ֣י/ךָ תְכַסֶּ֔ה וְ/לֹ֥א תִרְאֶ֖ה אֶת הָ/אָ֑רֶץ כִּֽי מוֹפֵ֥ת נְתַתִּ֖י/ךָ לְ/בֵ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/006.yaml
  text: Before their eyes you shall carry it on your shoulder[a]; in the dark you shall bring it out. You shall cover your face so that you do not see the land[b], for I have made you a sign for the house of Israel.
translation:
  language: de
  text: Vor ihren Augen sollst du es auf der Schulter tragen; in der Dunkelheit[a] sollst du es hinausbringen. Dein Gesicht sollst du verhüllen, sodass du das Land nicht siehst; denn ich habe dich zu einem Zeichen[b] für das Haus Israel gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Halbdunkel. Das hebräische Wort kann Dunkelheit oder düsteres Halbdunkel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Vorzeichen. Das hebräische Wort kann ein symbolisches Zeichen mit unheilvoller Bedeutung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die hebräische Wendung bezeichnet eine Handlung in ihrer sichtbaren Gegenwart. Die bildhafte Ausdrucksweise bleibt im Deutschen natürlich erhalten.
- source_word: עַל כָּתֵף תִּשָּׂא
  choice: du sollst es auf der Schulter tragen
  rationale: נשׂא mit כָּתֵף bezeichnet das Tragen einer Last auf der Schulter. Das Objekt „es“ ist wie im Kontext vorausgesetzt und wird im Deutschen zur Klarheit ergänzt.
- source_word: בָּעֲלָטָה
  choice: in der Dunkelheit
  rationale: עֲלָטָה bezeichnet Dunkelheit oder düsteres Halbdunkel. „In der Dunkelheit“ gibt die Grundbedeutung klar und idiomatisch wieder.
- source_word: תוֹצִיא
  choice: du sollst es hinausbringen
  rationale: Der Hifil von יצא bedeutet hier „hinausbringen“. Das im Hebräischen unausgesprochene Objekt wird aus dem Zusammenhang ergänzt.
- source_word: פָּנֶיךָ תְכַסֶּה
  choice: Dein Gesicht sollst du verhüllen
  rationale: „Verhüllen“ gibt das Bedecken des Gesichts prägnant wieder, ohne ein bestimmtes Mittel wie einen Schleier vorauszusetzen.
- source_word: וְלֹא תִרְאֶה אֶת הָאָרֶץ
  choice: sodass du das Land nicht siehst
  rationale: Die formal beigeordnete Aussage beschreibt hier die Folge beziehungsweise Absicht des Verhüllens. „Sodass“ macht diesen Zusammenhang im Deutschen deutlich.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Kontext ist wahrscheinlich das Heimatland gemeint; da der hebräische Text die nähere Bestimmung nicht ausdrücklich nennt, bleibt die Wiedergabe bewusst bei „das Land“.
- source_word: מוֹפֵת
  choice: Zeichen
  rationale: מוֹפֵת kann ein Zeichen, Vorzeichen oder Wunder bezeichnen. Hier ist Ezechiel selbst eine symbolische Zeichenhandlung; „Zeichen“ ist verständlich und vermeidet eine unnötige Festlegung auf eine ausschließlich unheilvolle Bedeutung.
- source_word: נְתַתִּיךָ
  choice: ich habe dich zu einem Zeichen gemacht
  rationale: Wörtlich steht „ich habe dich gegeben“. Mit einem prädikativen Substantiv ist „zu … gemacht“ im Deutschen die natürliche Entsprechung.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: „Haus Israel“ bewahrt die feste prophetische Bezeichnung; „für“ kennzeichnet Israel als Adressaten des Zeichens.
theological_decisions:
- issue: Bezug von הָאָרֶץ in der Zeichenhandlung
  choice: „das Land“ ohne ausdrückliche Ergänzung „Israel“
  alternative: „das Land Israel“, „der Erdboden“ oder „die Erde“
  rationale: Der Zusammenhang legt das Heimatland nahe, doch der hebräische Wortlaut nennt nur „das Land“. Die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutungsumfang von מוֹפֵת
  choice: „Zeichen“ im Haupttext
  alternative: „Vorzeichen“, „Wahrzeichen“ oder „unheilvolles Zeichen“
  rationale: Das Wort bezeichnet Ezechiel als sichtbares, symbolisches Zeichen, kann aber auch einen unheilvollen Beiklang tragen. Dieser wird nicht dogmatisch in den Haupttext eingetragen, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Soll-Form bewahrt den Anweisungscharakter; der Satzbau bleibt klar und gut vorlesbar. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wörtern.
