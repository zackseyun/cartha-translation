  text: אֱמֹ֖ר אֲנִ֣י מֽוֹפֶתְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשִׂ֗יתִי כֵּ֚ן יֵעָשֶׂ֣ה לָ/הֶ֔ם בַּ/גּוֹלָ֥ה בַ/שְּׁבִ֖י יֵלֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/011.yaml
  text: 'Say[a], ‘I am a sign to you: just as I have done, so it shall be done to them; into exile[b], into captivity they shall go.’'
translation:
  language: de
  text: 'Sag[a]: »Ich bin ein Zeichen für euch. Wie ich es getan habe, so wird es an ihnen geschehen: in die Verbannung[b], in die Gefangenschaft werden sie gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sprich“.'
    reason: lexical_alternative
  - marker: b
    text: Die beiden Ausdrücke „in die Verbannung“ und „in die Gefangenschaft“ geben die nachdrückliche Doppelung des Hebräischen wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Sag
  rationale: Der singularische Imperativ von אמר leitet die direkte Erklärung des Propheten ein; „Sag“ ist im modernen Standarddeutsch natürlich und klar.
- source_word: מוֹפֶתְכֶם
  choice: ein Zeichen für euch
  rationale: מוֹפֵת bezeichnet hier ein bedeutungstragendes Zeichen beziehungsweise ein prophetisches Zeichenhandeln. „Für euch“ gibt die auf die Zuhörer bezogene Suffixform natürlich wieder, ohne sie unnötig auf einen bloßen Besitz zu verengen.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: Wie ich es getan habe
  rationale: Die Vergleichsformel verbindet Hesekiels bereits vollzogenes Zeichenhandeln mit dem bevorstehenden Geschick der Betroffenen.
- source_word: כֵּן יֵעָשֶׂה לָהֶם
  choice: so wird es ihnen ergehen
  rationale: Die idiomatische deutsche Wendung gibt den Zukunftsbezug und das an ihnen eintretende Geschehen wieder. Sie vermeidet das unnatürliche „so wird ihnen getan werden“, ohne einen handelnden Urheber hinzuzufügen.
- source_word: בַּגּוֹלָה
  choice: in die Verbannung
  rationale: In Verbindung mit יֵלֵכוּ ist eine Richtungsangabe angemessen. „Verbannung“ bezeichnet den erzwungenen Fortgang aus dem Land.
- source_word: בַשְּׁבִי
  choice: in die Gefangenschaft
  rationale: שְׁבִי bezeichnet Gefangenschaft beziehungsweise den Zustand von Gefangenen. Die gesonderte Wiedergabe bewahrt die nachdrückliche hebräische Doppelung.
- source_word: יֵלֵכוּ
  choice: werden sie gehen
  rationale: Das Imperfekt von הלך bezeichnet hier das angekündigte zukünftige Geschehen; die deutsche Futurform passt zum prophetischen Zusammenhang.
theological_decisions:
- issue: Die Funktion von Hesekiels Zeichenhandlung
  choice: Ich bin ein Zeichen für euch
  alternative: Ich bin euer Wahrzeichen / ein Vorzeichen für euch
  rationale: Hesekiel verkörpert durch sein Handeln prophetisch das kommende Geschick. „Zeichen“ bewahrt diese symbolische und offenbarende Funktion, ohne die abergläubischen Nebenbedeutungen einzuführen, die „Omen“ oder teilweise auch „Vorzeichen“ haben können.
- issue: Nicht genannter Urheber des kommenden Geschehens
  choice: so wird es ihnen ergehen
  alternative: so wird ihnen getan werden
  rationale: Der hebräische Passivsatz nennt den Handelnden nicht ausdrücklich. Die gewählte Formulierung lässt ihn ebenfalls offen und löst die Spannung nicht durch eine ergänzte Benennung Gottes oder menschlicher Eroberer auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und prophetisch. „Sag“ ist gegenwärtig und allgemein verständlich; die doppelte Zielangabe am Versende wird bewusst beibehalten.
