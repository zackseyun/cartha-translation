source:
  edition: WLC
  text: וָ/אַ֣עַשׂ כֵּן֮ כַּ/אֲשֶׁ֣ר צֻוֵּיתִי֒ כֵּ֠לַ/י הוֹצֵ֜אתִי כִּ/כְלֵ֤י גוֹלָה֙ יוֹמָ֔ם וּ/בָ/עֶ֛רֶב חָתַֽרְתִּי לִ֥/י בַ/קִּ֖יר בְּ/יָ֑ד בָּ/עֲלָטָ֥ה הוֹצֵ֛אתִי עַל כָּתֵ֥ף נָשָׂ֖אתִי לְ/עֵינֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/007.yaml
  text: 'So I did as I was commanded: by day I brought out my baggage like the baggage of exile[a], and in the evening I dug through the wall by hand. In the dark I brought it out[b]; I carried it on my shoulder before their eyes.'
translation:
  language: de
  text: 'Da tat ich, wie mir befohlen worden war: Tagsüber brachte ich mein Gepäck hinaus wie das Gepäck für die Verbannung[a], und am Abend grub ich mit eigener Hand durch die Wand. Im Dunkeln brachte ich es hinaus[b]; vor ihren Augen trug ich es auf der Schulter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie das Gepäck eines Verschleppten«. Der hebräische Ausdruck bezeichnet Habseligkeiten, die für den Gang in die Verbannung vorbereitet sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in der Dämmerung« oder »im Dunkel«. Das hebräische Wort bezeichnet Dunkelheit und kann neben schwachem Licht auch Verborgenheit anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ כֵּן
  choice: Da tat ich
  rationale: Gibt die narrative Folge und den Rückbezug von כֵּן in natürlichem, würdigem Deutsch wieder.
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  choice: wie mir befohlen worden war
  rationale: Bewahrt das Passiv und macht durch das Plusquamperfekt deutlich, dass der Befehl der Ausführung vorausging.
- source_word: כֵּלַי ... כִּכְלֵי גוֹלָה
  choice: mein Gepäck ... wie das Gepäck für die Verbannung
  rationale: כְּלִי bezeichnet hier die mitgeführten Habseligkeiten; גוֹלָה weist auf das Exil beziehungsweise die Deportation. Die Formulierung wahrt das Bild, ohne es vorschnell auf eine einzelne Person festzulegen.
- source_word: יוֹמָם וּבָעֶרֶב
  choice: Tagsüber ... und am Abend
  rationale: Bildet die zeitliche Abfolge knapp und idiomatisch ab.
- source_word: חָתַרְתִּי לִי בַקִּיר בְּיָד
  choice: grub ich mit eigener Hand durch die Wand
  rationale: חָתַר bezeichnet das Durchgraben oder Durchbrechen. לִי wird nicht hölzern eigens übersetzt; die eigenhändige Ausführung wird durch בְּיָד und „mit eigener Hand“ deutlich.
- source_word: בָּעֲלָטָה
  choice: Im Dunkeln
  rationale: Gibt die Grundbedeutung Dunkelheit wieder, ohne zwischen nächtlicher Finsternis, Dämmerlicht und möglicher Verborgenheit zu entscheiden.
- source_word: הוֹצֵאתִי
  choice: brachte ich es hinaus
  rationale: Das Pronomen bezieht sich im Deutschen natürlich auf das kollektiv verstandene Gepäck.
- source_word: עַל כָּתֵף נָשָׂאתִי
  choice: trug ich es auf der Schulter
  rationale: Bewahrt das konkrete Bild des Fortziehenden mit seinem Gepäck.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Entspricht dem hebräischen Idiom und betont den öffentlichen Charakter der Zeichenhandlung.
theological_decisions:
- issue: Art der prophetischen Zeichenhandlung
  choice: Die Handlungen werden konkret und öffentlich erzählt, ohne ihre Symbolik innerhalb dieses Verses auszudeuten.
  alternative: Die Übersetzung könnte den Bezug auf die bevorstehende Deportation ausdrücklich erklärend hervorheben.
  rationale: Der unmittelbare Text schildert zunächst das Tun Ezechiels; die Deutung erfolgt im Kontext. So bleibt die Spannung zwischen Handlung und Bedeutung erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt der zeitlichen Abfolge des Hebräischen; konkrete Verben und das wiederholte Hinausbringen bleiben erhalten.
