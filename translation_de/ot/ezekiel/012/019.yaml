  text: וְ/אָמַרְתָּ֣ אֶל עַ֣ם הָ/אָ֡רֶץ כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לְ/יוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙ אֶל אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָ/ם֙ בִּ/דְאָגָ֣ה יֹאכֵ֔לוּ וּ/מֵֽימֵי/הֶ֖ם בְּ/שִׁמָּמ֣וֹן יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָ/הּ֙ מִ/מְּלֹאָ֔/הּ מֵ/חֲמַ֖ס כָּֽל הַ/יֹּשְׁבִ֥ים בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/019.yaml
  text: 'And say to the people of the land[a], ‘Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water with horror[b], so that her land may be made desolate of its fullness because of the violence of all who dwell in it.’'
translation:
  language: de
  text: 'Und sage zum Volk des Landes: »So spricht der Herr Yahweh über die Bewohner Jerusalems im Land Israel: Vor Sorge werden sie ihr Brot essen und mit Entsetzen ihr Wasser trinken, damit ihr Land verödet und seiner ganzen Fülle beraubt wird[a] – wegen der Gewalt aller, die darin wohnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »damit ihr Land von seiner Fülle her verödet«; gemeint sein kann auch: »damit ihr Land verödet und von allem entleert wird, was es erfüllt«.'
    reason: Die knappe Verbindung תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ lässt offen, wie genau die Verödung und der Verlust der Fülle syntaktisch zusammengehören.
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: Volk des Landes
  rationale: Die formnahe Wendung bewahrt den Bezug auf die im Land verbliebene Bevölkerung, ohne sie als bestimmte soziale Schicht festzulegen.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die doppelte Gottesbezeichnung wird bewahrt; der Eigenname יהוה erscheint als »Yahweh«, während אֲדֹנָי mit »Herr« wiedergegeben wird.
- source_word: לְיוֹשְׁבֵי יְרוּשָׁלַם אֶל אַדְמַת יִשְׂרָאֵל
  choice: über die Bewohner Jerusalems im Land Israel
  rationale: אֶל wird hier angesichts der bereits genannten Adressaten sinnvoll als Themenangabe verstanden; »im Land Israel« gibt die räumliche Zuordnung natürlich wieder.
- source_word: בִּדְאָגָה
  choice: in Angst
  rationale: Die Wendung bezeichnet angstvolle Sorge und passt idiomatisch zum Essen unter drohender Not.
- source_word: בְּשִׁמָּמוֹן
  choice: mit Entsetzen
  rationale: Das seltene Substantiv kann Entsetzen, Bestürzung oder einen Zustand der Verheerung bezeichnen. »Mit Entsetzen« bildet im Deutschen eine natürliche emotionale Parallele zu »in Angst«.
- source_word: תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ
  choice: damit ihr Land verwüstet und all dessen beraubt wird, was es erfüllt
  rationale: Die Wiedergabe macht verständlich, dass das Land sowohl verwüstet als auch seiner Fülle beziehungsweise seines Bestands entleert wird, und bewahrt das feminine Suffix mit »ihr Land«.
- source_word: מֵחֲמַס
  choice: wegen der Gewalttat
  rationale: חמס bezeichnet gewaltsames, rücksichtsloses Unrecht; der Singular »Gewalttat« hält sich eng an die kollektive hebräische Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Der offenbarte Eigenname wird sichtbar bewahrt, während die Verbindung mit אֲדֹנָי ohne die missverständliche Doppelung »Herr HERR« wiedergegeben wird.
- issue: Zweck- oder Folgeaussage in לְמַעַן
  choice: damit
  alternative: sodass
  rationale: לְמַעַן kann Zweck beziehungsweise beabsichtigte Folge ausdrücken. »Damit« bewahrt diese Spannung, ohne den Satz rein kausal umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Sprachrhythmus. Konkrete Wörter wie »Brot«, »Wasser« und »Land« bleiben erhalten; schwer verständliche formale Wendungen werden im Haupttext behutsam verdeutlicht.
