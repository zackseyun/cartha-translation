  to: 'Und sage zum Volk des Landes: »So spricht der Herr Yahweh über die Bewohner Jerusalems im Land Israel: Vor Sorge werden sie ihr Brot essen und mit Entsetzen ihr Wasser trinken, damit ihr Land verödet und seiner ganzen Fülle beraubt wird[a] – wegen der Gewalt aller, die darin wohnen.«'
