id: EZK.12.12
reference: Ezekiel 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/נָּשִׂ֨יא אֲשֶׁר בְּ/תוֹכָ֜/ם אֶל כָּתֵ֤ף יִשָּׂא֙ בָּ/עֲלָטָ֣ה וְ/יֵצֵ֔א בַּ/קִּ֥יר יַחְתְּר֖וּ לְ/ה֣וֹצִיא ב֑/וֹ פָּנָ֣י/ו יְכַסֶּ֔ה יַ֗עַן אֲשֶׁ֨ר לֹא יִרְאֶ֥ה לַ/עַ֛יִן ה֖וּא אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/012.yaml
  text: And the prince who is among them will lift his baggage onto his shoulder in the dark and go out[a]. They will dig through the wall to bring him out through it[c][b]. He will cover his face so that he may not see the land with his eyes.
translation:
  language: de
  text: Und der Fürst, der mitten unter ihnen ist, wird in der Dunkelheit[b] sein Gepäck auf die Schulter heben[a] und hinausgehen. Sie werden die Mauer durchbrechen, um ihn durch die Öffnung hinauszubringen. Er wird sein Gesicht verhüllen, damit er das Land nicht mit eigenen Augen sieht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird auf die Schulter heben“. „Sein Gepäck“ ist aus dem unmittelbar vorausgehenden Zeichen für die Verbannung ergänzt.'
    reason: contextual_clarification
  - marker: b
    text: 'Oder: „im Zwielicht“. Das hebräische Wort kann Dunkelheit, düsteres Licht und damit auch Verborgenheit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „weil er das Land nicht mit eigenen Augen sehen wird“. Die hebräische Verknüpfung kann hier auch kausal verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: נָשִׂיא bezeichnet hier den Herrscher in Jerusalem. „Fürst“ bewahrt den politischen Titel, ohne das im Hebräischen nicht verwendete Wort „König“ einzutragen.
- source_word: בְּתוֹכָם
  choice: der mitten unter ihnen ist
  rationale: Die Wendung bedeutet wörtlich „in ihrer Mitte“ und bezeichnet den Fürsten als einen, der sich unter der Bevölkerung befindet.
- source_word: אֶל כָּתֵף יִשָּׂא
  choice: sein Gepäck auf die Schulter heben
  rationale: Wörtlich steht kein ausdrückliches Objekt. Das unmittelbar vorausgehende Zeichenhandeln mit dem Gepäck für die Verbannung liefert jedoch den klaren Kontext; „auf die Schulter heben“ bildet die Bewegungsrichtung genau ab.
- source_word: בָּעֲלָטָה
  choice: in der Dunkelheit
  rationale: Das Substantiv bezeichnet Dunkelheit oder düsteres Zwielicht und trägt hier den Beiklang eines heimlichen Aufbruchs.
- source_word: וְיֵצֵא
  choice: und hinausgehen
  rationale: Eine direkte, natürliche Wiedergabe von יצא, die die körperliche Bewegung aus der Stadt beziehungsweise durch die Mauer bezeichnet.
- source_word: בַּקִּיר יַחְתְּרוּ
  choice: Sie werden die Mauer durchbrechen
  rationale: חתר bezeichnet das Graben oder Brechen durch ein Hindernis. „Die Mauer durchbrechen“ bewahrt das konkrete Bild und klingt im modernen Deutschen natürlich.
- source_word: לְהוֹצִיא בוֹ
  choice: um ihn durch die Öffnung hinauszubringen
  rationale: Die Hifil-Form bedeutet „hinausbringen“. Das Suffix in בוֹ verweist auf den durch die Mauer geschaffenen Durchgang; „durch die Öffnung“ macht diesen im Deutschen verständlich.
- source_word: פָּנָיו יְכַסֶּה
  choice: Er wird sein Gesicht verhüllen
  rationale: „Verhüllen“ gibt das Bedecken des Gesichts knapp und würdevoll wieder und lässt sowohl Verbergung als auch eingeschränkte Sicht anklingen.
- source_word: יַעַן אֲשֶׁר לֹא יִרְאֶה
  choice: damit er … nicht … sieht
  rationale: Im Handlungsablauf lässt sich die Klausel als beabsichtigte Folge des Verhüllens verstehen. Da die Konjunktion auch kausal gelesen werden kann, wird diese Möglichkeit in einer Fußnote bewahrt.
- source_word: לַעַיִן הוּא
  choice: mit eigenen Augen
  rationale: Die ungewöhnlich betonte Formulierung wird idiomatisch wiedergegeben; „eigenen“ bewahrt die Hervorhebung der persönlichen Wahrnehmung.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ meint hier das Land, das der Fürst verlässt, nicht bloß den Erdboden.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt bei „auf die Schulter heben“
  choice: „sein Gepäck“ steht im Haupttext.
  alternative: „wird etwas auf die Schulter heben“ oder eine objektlose Formulierung
  rationale: Der hebräische Satz nennt das Objekt nicht erneut, doch das Gepäck für die Verbannung bestimmt das unmittelbar vorausgehende Zeichenhandeln. Die Ergänzung schafft verständliches Deutsch, wird aber als kontextuelle Ergänzung kenntlich gemacht.
- issue: Sinn von יַעַן אֲשֶׁר im Schlusssatz
  choice: Finale beziehungsweise resultative Wiedergabe mit „damit“
  alternative: 'Kausale Wiedergabe: „weil er das Land nicht mit eigenen Augen sehen wird“'
  rationale: Die Abfolge von Gesichtsverhüllung und Nichtsehen legt Ziel oder Folge nahe. Die grammatisch mögliche kausale Deutung wird nicht ausgeschlossen, sondern in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen, gut verständlichen Erzählstil. Der Satzbau bleibt nahe an der prophetischen Abfolge, ohne unnatürliche hebräische Syntax nachzuahmen. „Fürst“ wahrt den amtlichen Titel; „Verhüllung“ und „Dunkelheit“ erhalten den Ton des heimlichen Aufbruchs.
