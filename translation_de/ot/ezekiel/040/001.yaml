  to: Im fünfundzwanzigsten Jahr unserer Verbannung, am Anfang des Jahres[a], am zehnten Tag des Monats, im vierzehnten Jahr, nachdem die Stadt geschlagen worden war[b] – genau an diesem Tag lag die Hand Jahwes auf mir, und er brachte mich dorthin.
