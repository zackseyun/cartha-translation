  text: בְּ/עֶשְׂרִ֣ים וְ/חָמֵ֣שׁ שָׁנָ֣ה לְ֠/גָלוּתֵ/נוּ בְּ/רֹ֨אשׁ הַ/שָּׁנָ֜ה בֶּ/עָשׂ֣וֹר לַ/חֹ֗דֶשׁ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ שָׁנָ֔ה אַחַ֕ר אֲשֶׁ֥ר הֻכְּתָ֖ה הָ/עִ֑יר בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה הָיְתָ֤ה עָלַ/י֙ יַד יְהוָ֔ה וַ/יָּבֵ֥א אֹתִ֖/י שָֽׁמָּ/ה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/001.yaml
  text: In the twenty-fifth year of our exile[a], at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city had been struck down, on that very day the hand of Yahweh was upon me[b], and he brought me there.
translation:
  language: de
  text: Im fünfundzwanzigsten Jahr unserer Verbannung, am Anfang des Jahres[a], am zehnten Tag des Monats, im vierzehnten Jahr, nachdem die Stadt geschlagen worden war[b] – genau an diesem Tag lag die Hand Jahwes auf mir, und er brachte mich dorthin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Kopf des Jahres“. Gemeint sein kann der Jahresanfang oder ein Neujahrstag.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „nachdem die Stadt gefallen war“ oder „nachdem die Stadt erobert worden war“. Das Hebräische sagt wörtlicher: „nachdem die Stadt geschlagen worden war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגָלוּתֵנוּ
  choice: unserer Verbannung
  rationale: גָּלוּת bezeichnet die Wegführung beziehungsweise das Exil. „Verbannung“ gibt den gemeinschaftlichen Zustand natürlich wieder und bewahrt das Suffix „unserer“.
- source_word: בְּרֹאשׁ הַשָּׁנָה
  choice: am Anfang des Jahres
  rationale: Wörtlich „am Kopf des Jahres“. Die idiomatische Wiedergabe bleibt transparent, ohne die möglicherweise gemeinte Neujahrsfeier ausdrücklich festzulegen.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: am zehnten Tag des Monats
  rationale: Die ausgeschriebene Datumsangabe ist im Deutschen klar und entspricht dem hebräischen Sinn.
- source_word: הֻכְּתָה
  choice: niedergeschlagen worden war
  rationale: Das passive Verb von נכה bedeutet wörtlich „geschlagen werden“. Bei einer Stadt bewahrt „niedergeschlagen“ den gewaltsamen Charakter, ohne die Aussage auf „erobert“ zu verengen.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Jerusalem ist im Kontext gemeint, wird im hebräischen Vers jedoch nicht ausdrücklich genannt.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: genau an diesem Tag
  rationale: Die Formulierung gibt die nachdrückliche zeitliche Präzisierung durch עֶצֶם in natürlichem Deutsch wieder.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Das wiederkehrende prophetische Bild für Gottes wirksame Macht beziehungsweise seinen überwältigenden Einfluss bleibt wörtlich erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: und er brachte mich dorthin
  rationale: Das unausgesprochene Subjekt wird aus dem unmittelbaren Zusammenhang auf Jahwe bezogen; „dorthin“ bewahrt die unbestimmte Zielangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Bedeutung der „Hand Jahwes“
  choice: bildhafte Wendung wörtlich beibehalten
  alternative: die Macht Jahwes kam über mich
  rationale: Die wörtliche Wendung ist verständlich und für Ezechiels prophetische Erfahrung kennzeichnend; sie lässt offen, ob vor allem Macht, Offenbarung oder göttlicher Zwang betont ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange datierende Satzbau des Hebräischen bleibt erkennbar; ein Gedankenstrich gliedert die Zeitangaben. Bildhafte und mehrdeutige Formulierungen werden nicht unnötig aufgelöst.
