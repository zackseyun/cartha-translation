base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/033.yaml
  text: And its guardrooms[a], its side pillars, and its portico were according to these measurements; and it and its side pillars had windows all around. Its length was fifty cubits[b], and its width twenty-five cubits.
translation:
  language: de
  text: Seine Wachkammern[a], seine Pfeiler[b] und seine Vorhalle[c] entsprachen diesen Maßen. Das Tor und seine Vorhalle hatten ringsum Fenster. Seine Länge betrug fünfzig Ellen und seine Breite fünfundzwanzig Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Kammern“ oder „Zellen“. Gemeint sind kleine Räume innerhalb der Toranlage, wahrscheinlich für die Torwache.
    reason: lexical_alternative
  - marker: b
    text: Auch „Türpfosten“ oder „Wandpfeiler“. Der hebräische Ausdruck für dieses Bauteil ist nicht eindeutig.
    reason: lexical_alternative
  - marker: c
    text: Auch „Eingangshalle“ oder „Torhalle“.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: Wachkammern
  rationale: Im Zusammenhang der Toranlage bezeichnet das Wort kleine Kammern am Tor. „Wachkammern“ gibt die wahrscheinlich gemeinte Funktion verständlich wieder, ohne die bauliche Form unnötig festzulegen.
- source_word: אַיִל
  choice: Pfeiler
  rationale: Der schwierige architektonische Ausdruck bezeichnet hier tragende oder gliedernde Bauteile der Toranlage. „Pfeiler“ ist im Deutschen verständlich und lässt die genaue Bauform offen.
- source_word: אֵילָם
  choice: Vorhalle
  rationale: Das Wort bezeichnet im Zusammenhang der Tempelarchitektur den hallenartigen Bereich am Eingang. „Vorhalle“ ist natürlich und sachlich; „Säulenhalle“ würde Säulen voraussetzen, die der Ausdruck selbst nicht ausdrücklich nennt.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: entsprachen diesen Maßen
  rationale: Die Formulierung drückt die Übereinstimmung mit den zuvor genannten Abmessungen aus und wird so in idiomatischem Deutsch präzise wiedergegeben.
- source_word: חַלּוֹנוֹת
  choice: Fenster
  rationale: Die gewöhnliche Bedeutung passt zur Baubeschreibung; eine vorsichtigere Wiedergabe wie „Fensteröffnungen“ ist möglich, aber nicht erforderlich.
- source_word: לוֹ וּלְאֵלַמּוֹ
  choice: Das Tor und seine Vorhalle hatten
  rationale: Die Präpositionen bezeichnen hier, wo sich die Fenster befanden beziehungsweise wozu sie gehörten. Das im Kontext vorausgesetzte Tor wird zur Klarheit ausdrücklich genannt.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die Wiederholung verstärkt den Gedanken, dass die Fenster auf allen Seiten angeordnet waren.
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: Seine Länge betrug fünfzig Ellen und seine Breite fünfundzwanzig Ellen
  rationale: Die beiden Maßangaben werden vollständig und in natürlicher deutscher Satzform wiedergegeben.
