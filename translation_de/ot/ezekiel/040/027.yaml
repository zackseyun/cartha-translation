lexical_decisions:
- source_word: וְשַׁעַר לֶחָצֵר הַפְּנִימִי
  choice: Auch der innere Vorhof hatte ein Tor
  rationale: Die hebräische Nominalklausel enthält kein ausdrückliches Verb. Die deutsche Formulierung ergänzt idiomatisch »hatte« und gibt das ל als Zugehörigkeitsbeziehung zum inneren Vorhof wieder.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: in Richtung Süden
  rationale: דֶּרֶךְ bezeichnet Weg oder Richtung. Die Wiedergabe wahrt die räumliche Ausrichtung und lässt offen, ob zugleich die Lage auf der Südseite gemeint ist.
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Die Verbform führt die Handlung fort; das Subjekt ist der aus dem Kontext bekannte messende Begleiter.
- source_word: מִשַּׁעַר אֶל הַשַּׁעַר
  choice: von Tor zu Tor
  rationale: Die knappe deutsche Wendung entspricht der Messung zwischen den beiden einander zugeordneten Toren.
- source_word: מֵאָה אַמּוֹת
  choice: hundert Ellen
  rationale: Die antike Maßeinheit bleibt erhalten, ohne eine unsichere moderne Umrechnung einzuführen.
