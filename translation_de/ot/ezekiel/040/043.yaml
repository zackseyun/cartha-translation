  text: וְ/הַֽ/שְׁפַתַּ֗יִם טֹ֧פַח אֶחָ֛ד מוּכָנִ֥ים בַּ/בַּ֖יִת סָבִ֣יב סָבִ֑יב וְ/אֶל הַ/שֻּׁלְחָנ֖וֹת בְּשַׂ֥ר הַ/קָּרְבָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/043.yaml
  text: And hooks[a], a handbreadth long, were fastened all around inside the house, and on the tables was the flesh of the offering.
translation:
  language: de
  text: Und ringsum im Inneren des Gebäudes waren handbreit lange Haken[a] befestigt; auf den Tischen lag das Fleisch der Opfergabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des mit „Haken“ übersetzten hebräischen Wortes ist unsicher; gemeint sein könnten auch Leisten oder eine andere Vorrichtung im Schlachtbereich.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁפַתַּיִם
  choice: Haken
  rationale: Das seltene Wort ist in seiner Bedeutung unsicher. Im Zusammenhang mit Schlachtbereich, Tischen und Opferfleisch sind Haken beziehungsweise Pflöcke plausibel; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: טֹפַח אֶחָד
  choice: handbreit lang
  rationale: טֹפַח bezeichnet eine Handbreit. Die Formulierung gibt das konkrete Maß in natürlichem Deutsch wieder, ohne eine im Hebräischen nicht ausdrücklich genannte moderne Maßeinheit einzuführen.
- source_word: מוּכָנִים
  choice: waren befestigt
  rationale: Das passive Partizip von כון bezeichnet hier wahrscheinlich fest angebrachte beziehungsweise fest eingesetzte Vorrichtungen. Bei der gewählten Deutung als Haken ist „befestigt“ kontextgerecht.
- source_word: בַּבַּיִת
  choice: im Inneren des Gebäudes
  rationale: בַּיִת bezeichnet hier ein Gebäude des Tempelkomplexes. „Gebäude“ vermeidet das im Deutschen missverständliche „Haus“, während „im Inneren“ die räumliche Aussage wiedergibt.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Das verdoppelte סָבִיב betont die vollständige Umfassung; „ringsum“ bringt dies knapp und idiomatisch zum Ausdruck.
- source_word: וְאֶל הַשֻּׁלְחָנוֹת
  choice: auf den Tischen
  rationale: Obwohl אֶל gewöhnlich „zu, hin zu“ bedeutet, verlangt der verkürzte beschreibende Satz hier wahrscheinlich eine lokale Zuordnung. „Auf den Tischen“ ergibt zusammen mit dem folgenden Opferfleisch den naheliegenden Sinn.
- source_word: בְּשַׂר הַקָּרְבָן
  choice: das Fleisch der Opfergabe
  rationale: „Fleisch“ entspricht בָּשָׂר konkret; „Opfergabe“ gibt קָרְבָּן in würdigem, verständlichem Kultvokabular wieder.
