  text: וְ/שַׁ֨עַר֙ לֶ/חָצֵ֣ר הַ/פְּנִימִ֔י נֶ֣גֶד הַ/שַּׁ֔עַר לַ/צָּפ֖וֹן וְ/לַ/קָּדִ֑ים וַ/יָּ֧מָד מִ/שַּׁ֛עַר אֶל שַׁ֖עַר מֵאָ֥ה אַמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/023.yaml
  text: And a gate to the inner court was opposite the gate on the north and on the east[a]; and he measured from gate to gate one hundred cubits.
translation:
  language: de
  text: Und gegenüber dem Tor im Norden und dem Tor im Osten befand sich jeweils ein Tor zum inneren Vorhof.[a] Dann maß er von Tor zu Tor hundert Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht zunächst „Tor“ im Singular, obwohl anschließend die Nord- und die Ostseite genannt werden.
    reason: Die Anmerkung hält die auffällige formale Struktur des Ausgangstextes fest, ohne die im Kontext naheliegende distributive Aussage der Hauptfassung infrage zu stellen.
lexical_decisions:
- source_word: שַׁעַר
  choice: Tor
  rationale: Das Substantiv bezeichnet hier ein architektonisches Tor beziehungsweise eine Toranlage. „Tor“ ist im Deutschen natürlich, präzise und im Zusammenhang der Tempelvision ausreichend.
- source_word: חָצֵר הַפְּנִימִי
  choice: innerer Vorhof
  rationale: Die Wortgruppe bezeichnet den inneren Hofbereich der Tempelanlage. „Innerer Vorhof“ ist in diesem architektonischen Zusammenhang verständlich und würdevoll.
- source_word: נֶגֶד
  choice: gegenüber
  rationale: Die Präposition beschreibt hier die räumliche Zuordnung der Tore zueinander. „Gegenüber“ gibt diese Lagebeziehung knapp und natürlich wieder.
- source_word: לַצָּפוֹן וְלַקָּדִים
  choice: im Norden und im Osten
  rationale: Die Ausdrücke bezeichnen die Lage der betreffenden Tore an der Nord- und Ostseite. Die deutsche Formulierung ist idiomatisch und bewahrt beide Richtungsangaben.
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Die Verbform führt die nächste Handlung der Erzählfolge ein. „Dann“ gibt diese Abfolge im modernen Deutsch natürlicher wieder als ein bloßes „und“.
- source_word: מִשַּׁעַר אֶל שַׁעַר
  choice: von Tor zu Tor
  rationale: Die Wendung bezeichnet die Strecke zwischen den einander zugeordneten Toren. „Von Tor zu Tor“ ist knapp und quellennah.
- source_word: מֵאָה אַמָּה
  choice: hundert Ellen
  rationale: Die antike Maßeinheit wird beibehalten statt modern umgerechnet. „Elle“ ist die etablierte deutsche Wiedergabe von אַמָּה.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer architektonischer Ausdrucksweise. Die distributive Wiedergabe „jeweils ein Tor“ vermeidet eine im Deutschen missverständliche Singularform; die Fußnote bewahrt die auffällige Struktur und mögliche Ambiguität des Hebräischen.
