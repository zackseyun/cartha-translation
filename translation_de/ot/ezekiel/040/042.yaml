  text: וְ/אַרְבָּעָה֩ שֻׁלְחָנ֨וֹת לָ/עוֹלָ֜ה אַבְנֵ֣י גָזִ֗ית אֹרֶךְ֩ אַמָּ֨ה אַחַ֤ת וָ/חֵ֨צִי֙ וְ/רֹ֨חַב אַמָּ֤ה אַחַת֙ וָ/חֵ֔צִי וְ/גֹ֖בַהּ אַמָּ֣ה אֶחָ֑ת אֲלֵי/הֶ֗ם וְ/יַנִּ֤יחוּ אֶת הַ/כֵּלִים֙ אֲשֶׁ֨ר יִשְׁחֲט֧וּ אֶת הָ/עוֹלָ֛ה בָּ֖/ם וְ/הַ/זָּֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/042.yaml
  text: And four tables for the burnt offering were of cut stone[a], a cubit and a half long, a cubit and a half wide, and one cubit high[b]. On them they placed the implements with which they slaughtered the burnt offering and the sacrifice.
translation:
  language: de
  text: Und vier Tische für das Brandopfer waren aus behauenen Steinen[a], eineinhalb Ellen lang, eineinhalb Ellen breit und eine Elle hoch. Auf ihnen legte man die Geräte nieder, mit denen man das Brandopfer und das Schlachtopfer[b] schlachtete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Quadersteinen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann allgemein ein Schlachtopfer bezeichnen; in manchen Zusammenhängen ist damit insbesondere das Friedensopfer gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: Tische
  rationale: Das Substantiv bezeichnet Tische oder tischartige Flächen; ihre Funktion wird im Vers eigens genannt, sodass keine erläuternde Erweiterung nötig ist.
- source_word: לָעוֹלָה
  choice: für das Brandopfer
  rationale: עוֹלָה ist die übliche Bezeichnung für das Brandopfer; die Präposition ל kennzeichnet hier Zweck oder Bestimmung.
- source_word: אַבְנֵי גָזִית
  choice: aus behauenen Steinen
  rationale: Die Verbindung bezeichnet bearbeitete beziehungsweise behauene Steine und wird im Deutschen natürlich als Materialangabe wiedergegeben.
- source_word: אַמָּה אַחַת וָחֵצִי
  choice: eineinhalb Ellen
  rationale: Die alte Maßeinheit bleibt erhalten; „eineinhalb Ellen“ ist die natürliche moderne deutsche Maßangabe.
- source_word: וְגֹבַהּ אַמָּה אֶחָת
  choice: und eine Elle hoch
  rationale: 'Obwohl das Hebräische wörtlich „und seine Höhe: eine Elle“ sagt, gibt die prädikative deutsche Form die Maßangabe klar und knapp wieder.'
- source_word: אֲלֵיהֶם
  choice: Auf ihnen
  rationale: Die Präposition bezeichnet hier die Oberfläche der zuvor genannten Tische.
- source_word: וְיַנִּיחוּ
  choice: legte man … nieder
  rationale: Der Hifil von נוח bezeichnet das Ablegen oder Niederlegen. Das unpersönliche „man“ passt zur allgemeinen, funktionalen Beschreibung, ohne bestimmte Handelnde zu ergänzen.
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: כֵּלִים ist ein weiter Begriff für Geräte, Werkzeuge oder Utensilien; „Geräte“ bleibt im Schlachtkontext hinreichend bestimmt, ohne den Ausdruck zu verengen.
- source_word: אֲשֶׁר יִשְׁחֲטוּ ... בָּם
  choice: mit denen man … schlachtete
  rationale: Das Pronomen בָּם verweist auf die Geräte als Mittel des Schlachtens; die deutsche Relativkonstruktion bildet diesen Bezug natürlich ab.
- source_word: הָעוֹלָה
  choice: das Brandopfer
  rationale: Die wiederholte Bezeichnung wird aus Gründen der terminologischen Klarheit gleichbleibend übersetzt.
- source_word: וְהַזָּבַח
  choice: und das Schlachtopfer
  rationale: זֶבַח bezeichnet ein durch Schlachtung dargebrachtes Opfer und kann je nach Kontext allgemeiner oder als besondere Opferart verstanden werden. „Schlachtopfer“ bewahrt den kultischen Terminus, ohne ihn ausdrücklich auf das Friedensopfer festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von זֶבַח in der Opferterminologie
  choice: Schlachtopfer
  alternative: Friedensopfer; Opfer
  rationale: Der hebräische Ausdruck kann allgemein ein Schlachtopfer bezeichnen und in bestimmten Zusammenhängen enger auf das Friedensopfer bezogen sein. Da der Vers selbst die engere Bestimmung nicht erzwingt, bleibt die Übersetzung beim weiteren kultischen Begriff und erläutert die mögliche Spezifizierung in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit beibehaltenen alttestamentlichen Maßeinheiten und verständlicher kultischer Terminologie. Die Satzstruktur folgt dem Hebräischen eng, wird aber für natürlichen deutschen Lesefluss geglättet.
