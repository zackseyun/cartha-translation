source:
  edition: WLC
  text: וְ/עַ֗ל פְּנֵי֙ הַ/שַּׁ֣עַר ה/יאתון עַל לִ/פְנֵ֕י אֻלָ֥ם הַ/שַּׁ֖עַר הַ/פְּנִימִ֑י חֲמִשִּׁ֖ים אַמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/015.yaml
  text: And from the front of the outer gateway to the front of the vestibule of the inner gate was fifty cubits[a][b][c].
translation:
  language: de
  text: Von der Vorderseite des äußeren Torgebäudes[a] bis zur Vorderseite der Vorhalle[b] des inneren Tores[c] waren es fünfzig Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist an der Stelle „des äußeren Torgebäudes“ schwer verständlich; das zugrunde liegende Wort ist hier ungewöhnlich. Aufgrund der umgebenden Maßangaben verstehen viele Ausleger es als Bezeichnung des äußeren Tores oder Torgebäudes.
    reason: textual_variant
  - marker: b
    text: 'Oder: „der Eingangshalle“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort für „Tor“ kann in diesem Kapitel auch mit „Torgebäude“ wiedergegeben werden, weil es eine ganze Toranlage und nicht nur die Torflügel bezeichnet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Von
  rationale: Im Zusammenhang der Vermessung bezeichnet die Präposition den Ausgangspunkt einer Strecke. Im Deutschen gibt „von“ diese räumliche Funktion natürlich wieder; das einleitende וְ wird in der flüssigen Maßangabe nicht eigens abgebildet.
- source_word: פְּנֵי
  choice: der Vorderseite
  rationale: פָּנִים bezeichnet hier im architektonischen Zusammenhang die Front beziehungsweise die nach vorn gerichtete Seite eines Bauwerks.
- source_word: הַשַּׁעַר
  choice: des Torgebäudes
  rationale: שַׁעַר meint in Ezechiel 40 nicht nur Torflügel, sondern eine größere, begehbare Toranlage. „Torgebäude“ verdeutlicht diesen baulichen Umfang.
- source_word: היאתון
  choice: äußeren
  rationale: Die überlieferte Form ist ungewöhnlich und schwer zu deuten. Aufgrund des architektonischen Zusammenhangs wird sie hier wie vielfach üblich auf das äußere Torgebäude bezogen; die Unsicherheit bleibt in einer Fußnote sichtbar.
- source_word: לִפְנֵי
  choice: bis zur Vorderseite
  rationale: Die Wendung bezeichnet hier den Endpunkt der gemessenen Strecke. „Bis zur Vorderseite“ gibt diese räumliche Funktion präzise wieder.
- source_word: אֻלָם
  choice: Vorhalle
  rationale: אוּלָם bezeichnet einen hallen- oder vorhallenartigen Eingangsbereich. „Vorhalle“ ist im modernen Deutschen anschaulich und architektonisch passend.
- source_word: הַשַּׁעַר הַפְּנִימִי
  choice: des inneren Tores
  rationale: Die Wortgruppe bezeichnet das auf der Innenseite gelegene Tor. „Inneres Tor“ bleibt nahe an der Formulierung des Hebräischen.
- source_word: חֲמִשִּׁים אַמָּה
  choice: fünfzig Ellen
  rationale: „Elle“ ist die etablierte deutsche Wiedergabe der antiken Maßeinheit אַמָּה und eignet sich für die Maßangaben dieses Abschnitts.
theological_decisions: []
