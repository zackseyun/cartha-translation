  source_fidelity: 'Der deutsche Text gibt die Messangabe und ihre beiden räumlichen Bezugspunkte sachgerecht wieder: von der Vorderseite des äußeren Torgebäudes bis zur Vorderseite der Vorhalle des inneren Tores beträgt die Strecke fünfzig Ellen. Die schwierige Form היאתון wird angemessen als „äußeren“ verstanden, ohne die textliche Schwierigkeit im Haupttext zu verschleiern.'
  naturalness: „Von der Vorderseite … bis zur Vorderseite … waren es fünfzig Ellen“ ist modernes, klares und für eine architektonische Maßangabe natürliches Deutsch. „Vorhalle“ und „Torgebäude“ sind verständlich und im Kontext passend.
  terminology: „Ellen“ ist die etablierte Wiedergabe von אַמָּה. „Torgebäude“ trägt dem baulichen Umfang von שַׁעַר in diesem Kapitel Rechnung; „Vorhalle“ ist eine gute Wiedergabe von אוּלָם. Die Fußnoten sind korrekt verankert und geben die relevante textliche beziehungsweise lexikalische Unsicherheit angemessen wieder.
