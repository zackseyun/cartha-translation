  terminology: Die Maßbegriffe »Rute« und »Ellen« sind konsistent. »Schwelle«, »Tor« und »Vorhalle« passen zum architektonischen Register. Die Fußnotenmarker stehen an den jeweils sachlich relevanten Ausdrücken und die Anmerkungen sind vollständig sowie verständlich.
