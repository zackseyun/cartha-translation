  source_fidelity: Der deutsche Text gibt die hebräischen Maße und die Abfolge der architektonischen Angaben zuverlässig wieder. »Seitenkammer« ist für תָּא eine zurückhaltende, kontextgerechte Wahl und vermeidet die im Text nicht explizit benannte Funktion als Wachraum. Die Wiedergabe von מֵהַבַּיִת als »auf der Innenseite« ist als kontextuelle Orientierung möglich; die Fußnote bewahrt den wörtlichen Wortlaut und kennzeichnet die Deutung angemessen als wahrscheinlich.
