source:
  edition: WLC
  text: וְ/הַ/תָּ֗א קָנֶ֨ה אֶחָ֥ד אֹ֨רֶךְ֙ וְ/קָנֶ֤ה אֶחָד֙ רֹ֔חַב וּ/בֵ֥ין הַ/תָּאִ֖ים חָמֵ֣שׁ אַמּ֑וֹת וְ/סַ֣ף הַ֠/שַּׁעַר מֵ/אֵ֨צֶל אוּלָ֥ם הַ/שַּׁ֛עַר מֵֽ/הַ/בַּ֖יִת קָנֶ֥ה אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/007.yaml
  text: And each guardroom was one reed long and one reed wide[a], and between the guardrooms was five cubits[c][b]. And the threshold of the gate beside the portico of the gate on the inside was one reed.
translation:
  language: de
  text: Jede Seitenkammer[a] war eine Rute lang und eine Rute breit. Zwischen den Seitenkammern lagen fünf Ellen. Die Schwelle des Tores bei der Vorhalle des Tores auf der Innenseite[b] maß eine Rute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Kammer«, »Wachkammer« oder »Nische«. Das hebräische Wort bezeichnet hier einen kleinen Raum im Torbau; seine genaue Funktion wird nicht ausdrücklich genannt.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »vom Haus her«. Gemeint ist wahrscheinlich die dem Inneren beziehungsweise dem Gebäude zugewandte Seite des Torbaus.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: הַתָּא
  choice: Seitenkammer
  rationale: Das Wort bezeichnet hier kleine, in den Torbau eingefügte Räume. »Seitenkammer« gibt die architektonische Lage wieder, ohne ihre nicht ausdrücklich genannte Funktion als Wachraum festzulegen.
- source_word: קָנֶה אֶחָד
  choice: eine Rute
  rationale: קָנֶה bezeichnet im Zusammenhang die zuvor eingeführte Messrute und zugleich die dadurch bestimmte Maßeinheit.
- source_word: אֹרֶךְ / רֹחַב
  choice: lang / breit
  rationale: Die adjektivische Wiedergabe ist im Deutschen natürlich und bewahrt den parallelen Aufbau der Maßangaben.
- source_word: בֵּין הַתָּאִים
  choice: zwischen den Seitenkammern
  rationale: Die Pluralform wird terminologisch einheitlich mit תָּא wiedergegeben.
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen
  rationale: Die Elle ist die übliche biblische Maßeinheit; ein ergänztes Wort wie »Abstand« steht nicht ausdrücklich im Hebräischen.
- source_word: סַף הַשַּׁעַר
  choice: die Schwelle des Tores
  rationale: סַף bezeichnet im architektonischen Zusammenhang die Schwelle eines Zugangs.
- source_word: מֵאֵצֶל אוּלָם הַשַּׁעַר
  choice: bei der Vorhalle des Tores
  rationale: מֵאֵצֶל drückt räumliche Nähe aus; אוּלָם bezeichnet eine Vorhalle oder einen vorgelagerten Hallenraum.
- source_word: מֵהַבַּיִת
  choice: auf der Innenseite
  rationale: Die Wendung orientiert die Schwelle wahrscheinlich zur Gebäude- beziehungsweise Innenseite hin. Die wörtlichere, mehrdeutige Form wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, sachlich-würdevolle Architektursprache. Die kurzen Sätze gliedern die dichten Maßangaben verständlich. »Seitenkammer« vermeidet eine funktionale Überbestimmung; »auf der Innenseite« bietet eine lesbare Deutung der schwierigen Richtungsangabe, während die Fußnote den hebräischen Wortlaut und seine Unsicherheit bewahrt.
