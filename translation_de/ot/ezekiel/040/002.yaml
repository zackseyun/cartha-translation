  text: בְּ/מַרְא֣וֹת אֱלֹהִ֔ים הֱבִיאַ֖/נִי אֶל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יְנִיחֵ֗/נִי אֶל הַ֤ר גָּבֹ֨הַּ֙ מְאֹ֔ד וְ/עָלָ֥י/ו כְּ/מִבְנֵה עִ֖יר מִ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/002.yaml
  text: In visions of God he brought me into the land of Israel and set me down on a very high mountain[a]; on it, to the south[b], was something like the structure of a city.
translation:
  language: de
  text: In göttlichen Visionen[a] brachte er mich in das Land Israel und setzte mich auf einem sehr hohen Berg ab. Auf ihm, nach Süden hin[b], war etwas wie der Bau einer Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Visionen Gottes“; auch möglich: „in Visionen von Gott“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „im Süden“ oder „von Süden her“; das Hebräische lässt die genaue räumliche Beziehung offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: In göttlichen Visionen
  rationale: Die Wendung bezeichnet Visionen göttlicher Art beziehungsweise Herkunft. Die natürliche deutsche Formulierung bewahrt den visionären Rahmen; die mögliche possessive oder quellenbezogene Nuance wird in der Fußnote offengehalten.
- source_word: הֱבִיאַנִי
  choice: brachte er mich
  rationale: Der Hifil von בוא bedeutet hier idiomatisch „bringen“. Das unausgesprochene maskuline Subjekt bleibt entsprechend dem Hebräischen als „er“ stehen.
- source_word: אֶל אֶרֶץ יִשְׂרָאֵל
  choice: in das Land Israel
  rationale: Nach „bringen“ gibt „in“ die Bewegung in das Land hinein im Deutschen natürlich wieder.
- source_word: וַיְנִיחֵנִי
  choice: und setzte mich ... ab
  rationale: Der Hifil von נוח kann „niedersetzen, absetzen, platzieren“ bedeuten. „Setzte mich ... ab“ passt zum visionären Transport und vermeidet die hier missverständliche Bedeutung „ließ mich ruhen“.
- source_word: אֶל הַר גָּבֹהַּ מְאֹד
  choice: auf einem sehr hohen Berg
  rationale: Bei einem Verb des Absetzens bezeichnet אֶל hier den erreichten Ort. Der deutsche Dativ nach „auf“ drückt die resultierende Lage aus.
- source_word: וְעָלָיו
  choice: Auf ihm
  rationale: Das Pronomen verweist grammatisch auf den Berg. Ein neuer Satz gibt die hebräische Fortführung klar und würdig wieder.
- source_word: כְּמִבְנֵה עִיר
  choice: etwas wie der Bau einer Stadt
  rationale: מִבְנֶה bezeichnet einen Bau, eine bauliche Anlage oder Struktur; כְּ wahrt den vergleichenden, vorsichtigen Charakter der Schau. „Etwas wie“ vermeidet die Gleichsetzung mit einer tatsächlichen Stadt.
- source_word: מִנֶּגֶב
  choice: nach Süden hin
  rationale: Die Form kann räumliche Ausrichtung beziehungsweise Lage im Süden bezeichnen; „nach Süden hin“ wahrt diese Unbestimmtheit besser als eine eindeutige Herkunftsangabe.
theological_decisions:
- issue: Unausgesprochenes Subjekt des visionären Transports
  choice: „er“ statt der ausdrücklichen Ergänzung „Gott“
  alternative: „Gott brachte mich …“
  rationale: Die Verben stehen in der dritten Person Singular, doch das Subjekt wird im Vers nicht ausdrücklich genannt. „Er“ bewahrt die sprachliche Zurückhaltung des hebräischen Textes, während der Eingang die Handlung bereits als göttlich gerahmt erkennen lässt.
- issue: Charakter der gesehenen Anlage
  choice: 'vergleichend: „etwas wie der Bau einer Stadt“'
  alternative: „eine Stadt“
  rationale: Das Vergleichspartikel כְּ und das Substantiv מִבְנֶה rechtfertigen keine unmittelbare Identifizierung als Stadt. Die Übersetzung bewahrt die vorsichtige Beschreibung der Vision.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Göttliche Visionen“ ist natürlicher als das im Deutschen potenziell missverständliche „Visionen Gottes“; die wörtlichere Form bleibt in der Fußnote erhalten. Die Satzteilung verhindert eine überladene Konstruktion und lässt den räumlichen Bezug auf den Berg klar hervortreten.
