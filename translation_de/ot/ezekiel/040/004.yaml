  text: וַ/יְדַבֵּ֨ר אֵלַ֜/י הָ/אִ֗ישׁ בֶּן אָדָ֡ם רְאֵ֣ה בְ/עֵינֶי/ךָ֩ וּ/בְ/אָזְנֶ֨י/ךָ שְּׁמָ֜ע וְ/שִׂ֣ים לִבְּ/ךָ֗ לְ/כֹ֤ל אֲשֶׁר אֲנִי֙ מַרְאֶ֣ה אוֹתָ֔/ךְ כִּ֛י לְמַ֥עַן הַרְאוֹתְ/כָ֖ה הֻבָ֣אתָה הֵ֑נָּה הַגֵּ֛ד אֶת כָּל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/004.yaml
  text: And the man said to me[a], “Son of man, see with your eyes, and hear with your ears, and set your heart on all that I show you, for you were brought here so that I might show you these things. Declare to the house of Israel all that you see.”
translation:
  language: de
  text: 'Und der Mann sagte zu mir: „Menschensohn[a], sieh mit deinen Augen, höre mit deinen Ohren und richte dein Herz auf alles, was ich dir zeige; denn du bist hierhergebracht worden, damit ich es dir zeige. Berichte dem Haus Israel alles, was du siehst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mensch“ beziehungsweise „sterblicher Mensch“. Der hebräische Ausdruck ist Ezechiels regelmäßige Anrede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Das gewöhnliche hebräische Wort für „Mann“ bezeichnet hier die männliche Gestalt aus dem vorhergehenden Vers.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste, wiederkehrende Anrede an Ezechiel wird zur Wahrung ihres literarischen Zusammenhangs beibehalten; gemeint ist hier Ezechiel als Mensch.
- source_word: רְאֵה בְעֵינֶיךָ ... וּבְאָזְנֶיךָ שְׁמָע
  choice: sieh mit deinen Augen, höre mit deinen Ohren
  rationale: Die konkrete Parallelstruktur und der Aufruf zu bewusster Wahrnehmung bleiben erhalten.
- source_word: וְשִׂים לִבְּךָ
  choice: richte dein Herz
  rationale: Die hebräische Bildsprache umfasst Aufmerksamkeit, Denken und innere Ausrichtung und wird nicht auf „pass gut auf“ verengt.
- source_word: לְכֹל אֲשֶׁר אֲנִי מַרְאֶה אוֹתָךְ
  choice: auf alles, was ich dir zeige
  rationale: Die Hifilform von ראה wird natürlich und ihrem kausativen Sinn entsprechend mit „zeigen“ wiedergegeben.
- source_word: כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה
  choice: denn du bist hierhergebracht worden, damit ich es dir zeige
  rationale: Die Zweckbeziehung und das Passiv des hebräischen Satzes bleiben sichtbar; „es“ greift den gesamten angekündigten Schauinhalt auf, dessen Objekt im Hebräischen unausgesprochen bleibt.
- source_word: הַגֵּד
  choice: Berichte
  rationale: Der Hifil-Imperativ von נגד fordert dazu auf, das Gesehene bekannt zu machen; „Berichte“ passt zum prophetischen Auftrag und klingt im Deutschen natürlicher als „Verkünde“.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: dem Haus Israel
  rationale: Die feste prophetische Bezeichnung wird wegen ihrer literarischen Prägung bewahrt.
theological_decisions:
- issue: Die wiederkehrende Anrede בֶּן אָדָם im Ezechielbuch
  choice: Menschensohn
  alternative: Mensch; sterblicher Mensch
  rationale: Hier liegt keine christologische Titulatur vor, sondern die regelmäßige Anrede des Propheten. „Menschensohn“ wahrt die feste Formel und ihre Wiederholung, während die Fußnote den Sinn erläutert.
- issue: Unausgesprochenes Objekt bei הַרְאוֹתְכָה
  choice: damit ich es dir zeige
  alternative: damit ich dir dies alles zeige
  rationale: Das Hebräische nennt beim Infinitiv kein ausdrückliches Objekt. Das neutrale Pronomen nimmt den gesamten Schauinhalt auf, ohne eine im Ausgangstext nicht ausdrücklich vorhandene Mehrzahl einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche hebräische Parallelität und die Herz-Metapher bleiben erhalten; Satzbau und Zeichensetzung sind für heutige Leser behutsam geglättet.
