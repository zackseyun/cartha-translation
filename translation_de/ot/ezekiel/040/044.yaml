  text: וּ/מִ/חוּצָ/ה֩ לַ/שַּׁ֨עַר הַ/פְּנִימִ֜י לִֽשְׁכ֣וֹת שָׁרִ֗ים בֶּ/חָצֵ֤ר הַ/פְּנִימִי֙ אֲשֶׁ֗ר אֶל כֶּ֨תֶף֙ שַׁ֣עַר הַ/צָּפ֔וֹן וּ/פְנֵי/הֶ֖ם דֶּ֣רֶךְ הַ/דָּר֑וֹם אֶחָ֗ד אֶל כֶּ֨תֶף֙ שַׁ֣עַר הַ/קָּדִ֔ים פְּנֵ֖י דֶּ֥רֶךְ הַ/צָּפֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
translation:
  language: de
  text: Und außerhalb des inneren Tores befanden sich im inneren Vorhof Räume für die Sänger. Sie lagen an der Seite des Nordtores[a], und ihre Vorderseiten waren nach Süden gerichtet. Ein Raum lag an der Seite des Osttores[b] und war nach Norden ausgerichtet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an der Schulter des Nordtores“. Das Hebräische gebraucht „Schulter“ bildlich für die Seite oder Flanke eines Bauwerks.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an der Schulter des Osttores“. Auch hier bezeichnet „Schulter“ die Seite des Torgebäudes.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Satzbau dieses Verses ist stark verkürzt und in seinen Bezügen nicht völlig eindeutig. Andere Übersetzungen ordnen die Beschreibung daher etwas anders. Gemeint sind offenbar Sängerräume im inneren Vorhof nahe dem Nord- und dem Osttor, die nach Süden beziehungsweise nach Norden ausgerichtet waren.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִחוּצָה לַשַּׁעַר הַפְּנִימִי
  choice: Und außerhalb des inneren Tores
  rationale: Die Wiedergabe bewahrt sowohl die verbindende Konjunktion als auch die räumliche Angabe, ohne die genaue bauliche Beziehung über den hebräischen Wortlaut hinaus festzulegen.
- source_word: לִשְׁכוֹת שָׁרִים
  choice: Räume für die Sänger
  rationale: לִשְׁכוֹת bezeichnet im Tempelbereich Kammern oder Räume; das vokalisierte שָׁרִים meint hier Singende beziehungsweise Sänger. „Räume“ ist in modernem Deutsch natürlich, während „für“ die knappe hebräische Zuordnung idiomatisch ausdrückt.
- source_word: בֶּחָצֵר הַפְּנִימִי
  choice: im inneren Vorhof
  rationale: חָצֵר bezeichnet den umschlossenen Hof. „Innerer Vorhof“ ist im Deutschen eine geläufige Bezeichnung für den inneren Hofbereich des Heiligtums.
- source_word: אֶל כֶּתֶף שַׁעַר הַצָּפוֹן
  choice: an der Seite des Nordtores
  rationale: כֶּתֶף bedeutet wörtlich „Schulter“, wird in räumlich-architektonischem Gebrauch jedoch für die Seite oder Flanke verwendet. „An der Seite“ vermittelt den gemeinten Lagebezug in natürlichem Deutsch; die Metapher wird in der Fußnote offengelegt.
- source_word: וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם
  choice: und ihre Vorderseiten waren nach Süden gerichtet
  rationale: פָּנִים bezeichnet bei Gebäuden deren Front oder Vorderseite. Der Plural des hebräischen Textes wird beibehalten und die Ausrichtung klar ausgedrückt.
- source_word: אֶחָד
  choice: Ein Raum
  rationale: Der hebräische Singular „einer“ steht in einer stark verkürzten Konstruktion. Das Bezugswort „Raum“ wird für verständliches Deutsch ergänzt, ohne eine zusätzliche bauliche Einheit einzuführen.
- source_word: אֶל כֶּתֶף שַׁעַר הַקָּדִים
  choice: an der Seite des Osttores
  rationale: Die zweite Verwendung von כֶּתֶף wird entsprechend der ersten konsistent als „Seite“ wiedergegeben; der wörtliche Bildausdruck „Schulter“ ist in der Fußnote vermerkt.
- source_word: פְּנֵי דֶּרֶךְ הַצָּפוֹן
  choice: war nach Norden ausgerichtet
  rationale: Die knappe Orientierungsaussage wird idiomatisch wiedergegeben. Der Singular entspricht dem unmittelbar vorausgehenden אֶחָד.
