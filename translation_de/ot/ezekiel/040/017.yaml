  text: Then he brought me into the outer court[a], and behold, there were chambers and a pavement made for the court all around, all around; thirty chambers were on the pavement.
translation:
  language: de
  text: 'Dann brachte er mich in den äußeren Vorhof, und siehe: Dort waren Kammern und eine für den Vorhof ringsum, ringsum angelegte Pflasterung; dreißig Kammern lagen an der Pflasterung.[a]'
  philosophy: optimal-equivalence
  footnotes:
