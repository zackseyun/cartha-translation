    text: 'Wörtlich: „dreißig Kammern zur Pflasterung“. Auch möglich: „waren auf der Pflasterung“ oder „waren der Pflasterung zugewandt“. Das Hebräische bezeichnet die räumliche Beziehung, ohne sie eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Dann brachte er mich
  rationale: Das narrative Wayyiqtol führt die Vision weiter; „Dann“ gibt die Abfolge im modernen Deutschen natürlich wieder.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: in den äußeren Vorhof
  rationale: חָצֵר bezeichnet hier den Hofbereich der Tempelanlage; „Vorhof“ ist im Deutschen die geläufige architektonische Bezeichnung.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das nun Wahrgenommene. „Und sieh“ bewahrt diese deiktische Funktion in würdigem, verständlichem Deutsch.
- source_word: לְשָׁכוֹת
  choice: Kammern
  rationale: לשכה bezeichnet in Tempel- und Gebäudekontexten Nebenräume beziehungsweise Kammern; „Kammern“ passt zum architektonischen Register.
- source_word: וְרִצְפָה
  choice: und eine Pflasterung
  rationale: רִצְפָה bezeichnet eine gepflasterte Fläche. „Pflasterung“ lässt sowohl die Bauausführung als auch den Flächencharakter erkennen.
- source_word: עָשׂוּי לֶחָצֵר
  choice: für den Vorhof angelegte
  rationale: Das passive Partizip mit ל wird nah an der Konstruktion als eine für den Vorhof hergestellte beziehungsweise angelegte Pflasterung wiedergegeben, ohne die genaue Bauweise festzulegen.
- source_word: סָבִיב סָבִיב
  choice: Ringsum, ringsum
  rationale: Die Wiederholung wird zur Wahrung der emphatischen räumlichen Beschreibung beibehalten.
- source_word: שְׁלֹשִׁים לְשָׁכוֹת
  choice: dreißig Kammern
  rationale: Direkte Wiedergabe von Zahlwort und Substantiv; „Kammern“ bleibt innerhalb des Verses einheitlich.
- source_word: אֶל הָרִצְפָה
  choice: lagen an der Pflasterung
  rationale: אֶל bezeichnet hier wahrscheinlich die räumliche Beziehung der Kammern zur gepflasterten Fläche. „lagen an“ ist im Deutschen architektonisch natürlich, legt aber weder eindeutig Orientierung noch Standort auf der Fläche fest.
