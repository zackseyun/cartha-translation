base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/021.yaml
  text: 'Its guardrooms were three on this side and three on that side[a], and its side pillars and its portico had the same measurements as the first gate: its length was fifty cubits[b], and the width twenty-five cubits.'
translation:
  language: de
  text: 'Seine Wachkammern waren drei auf dieser Seite und drei auf jener. Seine Pfeiler[a] und seine Vorhalle[b] hatten dieselben Maße wie das erste Tor: Das Tor war fünfzig Ellen lang und fünfundzwanzig Ellen breit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Torpfosten« beziehungsweise »Mauerpfeiler«; der hebräische Ausdruck für dieses Bauteil ist nicht sicher bestimmt.
    reason: lexical_alternative
  - marker: b
    text: Oder »Vorraum« beziehungsweise »Vorbau«; die genaue Gestaltung dieses Bereichs des Torbaus ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: Wachkammern
  rationale: Der Ausdruck bezeichnet hier die kleinen Kammern innerhalb des Torbaus. »Wachkammern« ist im architektonischen Zusammenhang verständlich und gibt ihre wahrscheinliche Funktion wieder, ohne die räumliche Bedeutung aufzugeben.
- source_word: שְׁלוֹשָׁה מִפּוֹ ... וּשְׁלוֹשָׁה מִפּוֹ
  choice: drei auf dieser Seite und drei auf jener
  rationale: Die Formulierung bewahrt die symmetrische Verteilung der Kammern auf beiden Seiten des Tordurchgangs und folgt dem räumlichen Ausdruck des Hebräischen.
- source_word: אֵיל
  choice: Pfeiler
  rationale: Der architektonische Fachausdruck bezeichnet wahrscheinlich vorspringende Stützen oder seitliche Bauteile des Tores. »Pfeiler« ist im Deutschen klar, während die genaue Bauform unsicher bleibt und deshalb in einer Fußnote erläutert wird.
- source_word: אֵלַם
  choice: Vorhalle
  rationale: Gemeint ist der hallen- oder vorraumartige Teil des Torbaus. »Vorhalle« ist natürliches modernes Deutsch und lässt offen, wie genau dieser Bereich konstruiert war.
- source_word: הָיָה כְּמִדַּת הַשַּׁעַר הָרִאשׁוֹן
  choice: hatten dieselben Maße wie das erste Tor
  rationale: Die Wiedergabe drückt den Vergleich mit dem zuvor vermessenen Tor idiomatisch und präzise aus. Der deutsche Plural richtet sich natürlich nach »Pfeiler und Vorhalle«.
- source_word: הַשַּׁעַר הָרִאשׁוֹן
  choice: das erste Tor
  rationale: Das Adjektiv verweist auf das zuerst beschriebene Tor; »das erste Tor« ist die unmittelbarste Wiedergabe.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ
  choice: Es war fünfzig Ellen lang
  rationale: Das Pronomen bezieht sich im Zusammenhang auf das Tor beziehungsweise den Torbau. Die Formulierung gibt die Längenangabe natürlich wieder.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים בָּאַמָּה
  choice: und fünfundzwanzig Ellen breit
  rationale: Die Breitenangabe wird knapp und parallel zur Längenangabe formuliert.
- source_word: אַמָּה
  choice: Ellen
  rationale: Die biblische Maßeinheit wird beibehalten und nicht in ein modernes Maß umgerechnet, da der gesamte Abschnitt seine architektonischen Maße in Ellen angibt.
