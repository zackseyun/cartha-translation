  text: וּ/מַעֲל֤וֹת שִׁבְעָה֙ עלות/ו ו/אלמ/ו לִ/פְנֵי/הֶ֑ם וְ/תִמֹרִ֣ים ל֗/וֹ אֶחָ֥ד מִ/פּ֛וֹ וְ/אֶחָ֥ד מִ/פּ֖וֹ אֶל איל/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/026.yaml
  text: And its ascent had seven steps[a], with its vestibule before them; and it had palm-tree ornaments, one on this side and one on that side[b], on its jambs.
translation:
  language: de
  text: Sieben Stufen führten zu ihm hinauf, und seine Vorhalle[a] lag vor ihnen. An seinen Türpfosten[b] waren Palmenornamente angebracht, eines auf dieser und eines auf jener Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorbau“ beziehungsweise „Eingangshalle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seitenpfeilern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת שִׁבְעָה עֲלוֹתוֹ
  choice: Sieben Stufen führten zu ihm hinauf
  rationale: Die Wendung bezeichnet den aus sieben Stufen bestehenden Aufgang zum Tor. Die verbale deutsche Fassung gibt sowohl die Stufen als auch die Aufwärtsbewegung natürlich wieder.
- source_word: וְאֵילַמּוֹ
  choice: und seine Vorhalle
  rationale: אֵילָם bezeichnet im Zusammenhang der Tempelvision den vorgelagerten überdachten Eingangsbereich des Tores. „Vorhalle“ ist im Deutschen verständlich und architektonisch passend.
- source_word: לִפְנֵיהֶם
  choice: lag vor ihnen
  rationale: Das Suffix bezieht sich auf die sieben Stufen; „vor ihnen“ bewahrt den räumlichen Bezug des Hebräischen.
- source_word: וְתִמֹרִים
  choice: Palmenornamente
  rationale: Im architektonischen Zusammenhang sind dekorative Palmenmotive gemeint, nicht lebende Palmen.
- source_word: אֶחָד מִפֹּה וְאֶחָד מִפֹּה
  choice: eines auf dieser und eines auf jener Seite
  rationale: Die Formulierung bewahrt die bildhafte, symmetrische Verteilung auf beiden Seiten.
- source_word: אֵילָו
  choice: seinen Türpfosten
  rationale: Das Wort bezeichnet hier die seitlichen tragenden beziehungsweise einfassenden Teile der Toröffnung; „Türpfosten“ ist präzise und allgemein verständlich.
