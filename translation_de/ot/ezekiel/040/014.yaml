lexical_decisions:
- source_word: אֵילִים
  choice: Pfeiler
  rationale: Der architektonische Plural bezeichnet hier am ehesten die massiven Torpfeiler; „Türpfosten“ wäre für das angegebene Maß zu schmal und weniger passend.
- source_word: שִׁשִּׁים אַמָּה
  choice: sechzig Ellen hoch
  rationale: Im Hebräischen steht nur das Maß. „hoch“ wird aus dem architektonischen Zusammenhang ergänzt, damit der deutsche Satz verständlich ist, ohne das Maß umzudeuten.
- source_word: וְאֶל
  choice: und an … schloss sich … an
  rationale: Die Präposition drückt eine Ausrichtung oder Verbindung zu etwas hin aus. Die Formulierung bewahrt diese räumliche Beziehung, statt die schwer verständliche Syntax frei umzustellen.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die Wiederholung verstärkt die Vorstellung einer umlaufenden Anordnung; das idiomatische deutsche „ringsum“ gibt dies knapp wieder.
