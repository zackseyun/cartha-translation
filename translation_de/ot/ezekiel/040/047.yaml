base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/047.yaml
  text: 'Then he measured the court: one hundred cubits long and one hundred cubits wide[a], square[b]; and the altar was before the house.'
translation:
  language: de
  text: 'Dann maß er den Vorhof: hundert Ellen lang und hundert Ellen breit, quadratisch; und vor dem Tempelgebäude stand der Altar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dem Haus“; gemeint ist das eigentliche Tempelgebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Narrativ-Waw führt die Abfolge weiter; „Dann“ gibt diesen Fortgang in natürlichem modernem Deutsch wieder.
- source_word: הֶחָצֵר
  choice: den Vorhof
  rationale: חָצֵר bezeichnet einen umschlossenen Hof. Im Zusammenhang der Tempelanlage ist „Vorhof“ die geläufige und präzise Bezeichnung.
- source_word: אֹרֶךְ מֵאָה אַמָּה וְרֹחַב מֵאָה אַמָּה
  choice: hundert Ellen lang und hundert Ellen breit
  rationale: Die maßliche Parallelkonstruktion wird idiomatisch wiedergegeben; die antike Maßeinheit „Elle“ bleibt erhalten.
- source_word: מְרֻבָּעַת
  choice: quadratisch
  rationale: Das Wort beschreibt die viereckige Form; angesichts identischer Länge und Breite ist „quadratisch“ die natürliche architektonische Wiedergabe.
- source_word: הַמִּזְבֵּחַ
  choice: der Altar
  rationale: Dies ist die übliche deutsche Wiedergabe des kultischen Begriffs מִזְבֵּחַ.
- source_word: לִפְנֵי הַבָּיִת
  choice: vor dem Tempelhaus
  rationale: לִפְנֵי bezeichnet hier die räumliche Lage „vor“. בַּיִת meint im Kontext der Vision das eigentliche Tempelgebäude; „Tempelhaus“ bewahrt zugleich die Grundbedeutung „Haus“.
