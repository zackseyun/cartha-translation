  yaml_path: translation/ot/ezekiel/040/040.yaml
  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
translation:
  language: de
  text: An der Außenseite[a], am Aufgang[b] zum Eingang des Nordtors, standen zwei Tische; und an der anderen Seite, die zur Vorhalle des Tores gehörte[c], standen zwei Tische.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „an der äußeren Schulter“; in dieser Architekturbeschreibung bedeutet „Schulter“ einen seitlichen Bereich.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wo man zum Eingang des Nordtors hinaufgeht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die bei der Vorhalle des Tores lag“; das Hebräische bezeichnet eine Zuordnung oder räumliche Verbindung mit der Vorhalle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתֵף
  choice: Seite
  rationale: Wörtlich „Schulter“; in dieser Architekturbeschreibung bezeichnet das Wort einen seitlichen Bereich. „Seite“ ist im modernen Deutschen klar und natürlich, während eine Fußnote das hebräische Bild bewahrt.
- source_word: מִחוּצָה
  choice: Außenseite
  rationale: Bezeichnet den äußeren beziehungsweise außerhalb gelegenen Bereich und lässt sich zusammen mit כָּתֵף idiomatisch als „Außenseite“ wiedergeben.
- source_word: לָעוֹלֶה
  choice: am Aufgang
  rationale: Die Partizipialform von עלה kann den Ort beziehungsweise Vorgang des Hinaufgehens bezeichnen. „Am Aufgang“ passt knapp in die räumliche Beschreibung; die wörtlichere personenbezogene Lesart bleibt in der Fußnote erhalten.
- source_word: פֶּתַח
  choice: Eingang
  rationale: In diesem architektonischen Zusammenhang ist „Eingang“ die klare, gegenwärtige Entsprechung.
- source_word: שַׁעַר
  choice: Tor
  rationale: Übliche deutsche Wiedergabe in Tempel- und Stadtarchitektur.
- source_word: הַצָּפוֹנָה
  choice: Nordtor
  rationale: Die Richtungsangabe wird im Deutschen natürlich als Bestimmungswort mit „Tor“ verbunden.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת
  choice: zwei Tische
  rationale: Direkte und kontextgerechte Wiedergabe der Zahlen- und Sachangabe.
- source_word: הָאַחֶרֶת
  choice: die andere Seite
  rationale: Bezeichnet die entsprechende gegenüberliegende beziehungsweise weitere Seite.
- source_word: אֲשֶׁר לְאֻלָם הַשַּׁעַר
  choice: die zur Vorhalle des Tores gehörte
  rationale: Gibt die durch לְ ausgedrückte Zuordnung zur Torvorhalle wieder, ohne eine genauere räumliche Anordnung festzulegen, als der hebräische Text erkennen lässt.
- source_word: אֻלָם
  choice: Vorhalle
  rationale: „Vorhalle“ ist eine verständliche und im Deutschen passende Bezeichnung für den vorgelagerten Hallen- oder Vestibülbereich.
