  text: 'Then he measured the vestibule of the gate on the inside: one rod[a][b].'
translation:
  language: de
  text: 'Dann maß er die Vorhalle des Tores, vom Tempelhaus her: eine Messrute[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Messrohr“. Das hebräische Wort bezeichnet ein Rohr, das als Messrute verwendet werden konnte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Haus her“. Mit „Haus“ ist in Hesekiels Tempelvision häufig das Tempelgebäude gemeint; die genaue räumliche Bedeutung von „von“ ist hier unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אֻלָם
  choice: Vorhalle
  rationale: Das Wort bezeichnet einen hallen- oder vorhallenartigen Eingangsbereich; „Vorhalle“ ist im architektonischen Zusammenhang klar und würdig.
- source_word: הַשַּׁעַר
  choice: des Tores
  rationale: Der Ausdruck bezeichnet hier die Toranlage; „Tor“ ist die direkte und im Zusammenhang verständliche Wiedergabe.
- source_word: מֵהַבַּיִת
  choice: vom Tempelhaus her
  rationale: בַּיִת bezeichnet in Hesekiels Tempelvision häufig das Tempelgebäude. „Vom Tempelhaus her“ bewahrt die Präposition מִן und lässt deren schwierige räumliche Nuance offen.
- source_word: קָנֶה אֶחָד
  choice: eine Messrute
  rationale: קָנֶה kann ein Rohr und insbesondere eine als Messgerät verwendete Rute bezeichnen. „Messrute“ macht hier die Funktion deutlich.
