  text: And its guardroom[a], its side pillars, and its porch were according to these measurements; and it had windows, and its porch had windows, all around. The length was fifty cubits[b], and the width twenty-five cubits.
translation:
  language: de
  text: Seine Torkammern[a], seine Seitenpfeiler[b] und seine Vorhalle entsprachen diesen Maßen. Die Toranlage und ihre Vorhalle hatten ringsum Fenster. Ihre Länge betrug fünfzig Ellen, ihre Breite fünfundzwanzig Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kammern“, „Wachkammern“ oder „Torzellen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Pfosten“ oder „Pilaster“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: Wachkammern
  rationale: Im Zusammenhang der Toranlage bezeichnet das Wort kleine, zum Tor gehörende Kammern. „Wachkammern“ gibt ihre wahrscheinliche Funktion verständlich wieder; die mögliche allgemeinere Bedeutung bleibt in der Fußnote erhalten.
- source_word: אַיִל
  choice: Seitenpfeiler
  rationale: Der Ausdruck bezeichnet hier senkrechte Bauteile der Toranlage. „Seitenpfeiler“ ist im modernen Deutschen anschaulich, ohne die genaue Bauform übermäßig festzulegen.
- source_word: אֵילָם
  choice: Vorhalle
  rationale: Das Wort bezeichnet den vorgelagerten Eingangsbereich. „Vorhalle“ ist im Deutschen natürlich und passt zur Architektur des beschriebenen Tores.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: hatten dieselben Maße wie die zuvor genannten
  rationale: Die Formulierung verweist vergleichend auf die bereits beschriebene Toranlage. Die Ergänzung „zuvor genannten“ macht den im Kontext liegenden Rückverweis im Deutschen klar.
- source_word: חַלּוֹנוֹת
  choice: Fenster
  rationale: „Fenster“ ist die gewöhnliche Bedeutung; der Vers selbst verlangt keine genauere Bestimmung als vergitterte oder eingefasste Öffnungen.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Das verdoppelte Adverb betont, dass sich die Fenster auf allen Seiten befanden. „Ringsum“ gibt dies knapp und idiomatisch wieder.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ וְרֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: Seine Länge betrug fünfzig Ellen, seine Breite fünfundzwanzig Ellen
  rationale: Die deutsche Form bewahrt beide Maßangaben und ihre parallele Zuordnung zu Länge und Breite.
- source_word: לּוֹ וְלְאֵילָמוֹ
  choice: Das Tor und seine Vorhalle hatten ... Fenster
  rationale: Das hebräische Pronomen verweist im Zusammenhang auf die Toranlage. „Das Tor“ macht den Bezug im Deutschen eindeutig, ohne den Sinn zu verändern.
