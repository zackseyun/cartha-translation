source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל שַׁ֨עַר֙ אֲשֶׁ֤ר פָּנָי/ו֙ דֶּ֣רֶךְ הַ/קָּדִ֔ימָ/ה וַ/יַּ֖עַל ב/מעלות/ו וַ/יָּ֣מָד אֶת סַ֣ף הַ/שַּׁ֗עַר קָנֶ֤ה אֶחָד֙ רֹ֔חַב וְ/אֵת֙ סַ֣ף אֶחָ֔ד קָנֶ֥ה אֶחָ֖ד רֹֽחַב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/006.yaml
  text: 'Then he came to the gate that faced east[a], and he went up its steps and measured the threshold of the gate: one reed wide. And the other threshold was one reed wide.'
translation:
  language: de
  text: 'Dann kam er zu dem Tor, dessen Vorderseite nach Osten wies. Er stieg seine Stufen hinauf und maß die Schwelle des Tores: Sie war eine Messrute breit. Auch die andere Schwelle[a] war eine Messrute breit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die eine Schwelle“. Im Zusammenhang ist wahrscheinlich die entsprechende Schwelle auf der anderen Seite des Tores gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר
  choice: Tor
  rationale: „Tor“ ist im Deutschen die natürliche Bezeichnung für den hier vermessenen, größeren Torbau und bleibt näher am hebräischen Ausdruck als eine erklärende Erweiterung.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִימָה
  choice: dessen Vorderseite nach Osten wies
  rationale: Die Formulierung gibt das Bild von der zum Osten gerichteten „Vorderseite“ des Tores natürlich wieder, ohne die räumliche Aussage aufzulösen.
- source_word: במעלותיו
  choice: seine Stufen
  rationale: Der Plural bezeichnet hier die Stufen, die zum Tor hinaufführen. Das Possessivpronomen bezieht sich auf den Torbau.
- source_word: סַף הַשַּׁעַר
  choice: die Schwelle des Tores
  rationale: סַף bezeichnet eine Schwelle beziehungsweise einen Tür- oder Torsockel; „Schwelle“ ist hier verständlich und architektonisch passend.
- source_word: קָנֶה אֶחָד רֹחַב
  choice: eine Messrute breit
  rationale: קָנֶה ist in dieser Vision die in Vers 5 eingeführte Messrute; die knappe Wendung gibt sowohl Maßeinheit als auch Breite wieder.
- source_word: וְאֵת סַף אֶחָד
  choice: Auch die andere Schwelle
  rationale: Im architektonischen Zusammenhang ist wahrscheinlich die entsprechende Schwelle auf der anderen Seite gemeint. Da אֶחָד wörtlich „eine“ lautet, wird diese sprachliche Spannung in einer Fußnote kenntlich gemacht.
- source_word: וַיָּבוֹא ... וַיַּעַל ... וַיָּמָד
  choice: Dann kam er ... Er stieg ... hinauf und maß
  rationale: Die aufeinanderfolgenden Wayyiqtol-Formen erzählen eine Handlungsfolge. Die deutsche Satzgliederung bewahrt diese Abfolge in natürlicher Form.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Sätze bleiben anschaulich und architektonisch präzise; „Messrute“ macht deutlich, dass קָנֶה hier eine Maßeinheit beziehungsweise das Messgerät aus Vers 5 bezeichnet.
