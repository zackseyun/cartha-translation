source:
  edition: WLC
  text: וְ/הִנֵּ֥ה חוֹמָ֛ה מִ/ח֥וּץ לַ/בַּ֖יִת סָבִ֣יב סָבִ֑יב וּ/בְ/יַ֨ד הָ/אִ֜ישׁ קְנֵ֣ה הַ/מִּדָּ֗ה שֵׁשׁ אַמּ֤וֹת בָּֽ/אַמָּה֙ וָ/טֹ֔פַח וַ/יָּ֜מָד אֶת רֹ֤חַב הַ/בִּנְיָן֙ קָנֶ֣ה אֶחָ֔ד וְ/קוֹמָ֖ה קָנֶ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/005.yaml
  text: 'And behold[a], there was a wall outside the house, all around, and in the hand of the man was a measuring reed of six cubits, each cubit being a cubit and a handbreadth. And he measured the width of the structure: one reed[b], and the height: one reed.'
translation:
  language: de
  text: 'Und siehe, außen um das Haus herum verlief eine Mauer. Der Mann hielt eine Messrute in der Hand, die sechs Ellen lang war, wobei jede Elle einer gewöhnlichen Elle plus einer Handbreit entsprach.[a] Er maß die Breite des Bauwerks[b]: eine Rute, und die Höhe: eine Rute.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sechs Ellen nach der Elle und einer Handbreit“; gemeint ist die lange Elle, die eine Handbreit länger war als eine gewöhnliche Elle.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „des Gebäudes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt den hinweisenden, visionären Charakter der Wendung und lenkt die Aufmerksamkeit auf einen neuen Anblick.
- source_word: חוֹמָה
  choice: Mauer
  rationale: Die übliche und im architektonischen Zusammenhang passende Wiedergabe, ohne eine Verteidigungsfunktion vorauszusetzen.
- source_word: מִחוּץ לַבַּיִת סָבִיב סָבִיב
  choice: außen um das Haus herum
  rationale: Gibt sowohl die äußere Lage als auch das vollständige Umschließen idiomatisch wieder; die hebräische Verdoppelung wird durch „um … herum“ ausgedrückt.
- source_word: וּבְיַד הָאִישׁ
  choice: Der Mann hielt … in der Hand
  rationale: Eine natürliche deutsche Wiedergabe des konkreten hebräischen Ausdrucks, die den bereits eingeführten Mann als handelnde Person beibehält.
- source_word: קְנֵה הַמִּדָּה
  choice: Messrute
  rationale: Bezeichnet knapp und sachgerecht ein aus einem Rohr beziehungsweise einer Rute bestehendes antikes Messgerät.
- source_word: שֵׁשׁ אַמּוֹת בָּאַמָּה וָטֹפַח
  choice: sechs Ellen lang … wobei jede Elle einer gewöhnlichen Elle plus einer Handbreit entsprach
  rationale: Bewahrt die antike Maßeinheit und macht verständlich, dass hier die längere Elle gemeint ist, die aus einer gewöhnlichen Elle und einer zusätzlichen Handbreit besteht.
- source_word: רֹחַב הַבִּנְיָן
  choice: die Breite des Bauwerks
  rationale: „Bauwerk“ gibt בִּנְיָן wieder, ohne es vorschnell mit dem zuvor genannten Haus oder ausschließlich mit der Mauer gleichzusetzen.
- source_word: קָנֶה אֶחָד
  choice: eine Rute
  rationale: Gibt das Messergebnis in derselben Einheit wieder, die unmittelbar zuvor definiert wurde.
- source_word: וְקוֹמָה
  choice: und die Höhe
  rationale: Natürliche architektonische Wiedergabe der vertikalen Ausdehnung.
