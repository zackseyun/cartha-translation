  source_fidelity: Der Entwurf gibt die Raumzuweisung, die Nordausrichtung, die Verantwortung für den Altar, die Identifikation der Söhne Zadoks als Teil der levitischen Nachkommenschaft sowie ihr kultisches Nahen zu Jahwe sachgerecht wieder. Die partitive Beziehung von מִבְּנֵי לֵוִי bleibt in der Revision erhalten.
