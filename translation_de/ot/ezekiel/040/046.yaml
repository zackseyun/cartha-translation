  text: וְ/הַ/לִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨י/הָ֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן לַ/כֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ הֵ֣מָּה בְנֵֽי צָד֗וֹק הַ/קְּרֵבִ֧ים מִ/בְּנֵֽי לֵוִ֛י אֶל יְהוָ֖ה לְ/שָׁרְתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/046.yaml
  text: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
translation:
  language: de
  text: Und die Kammer, deren Vorderseite nach Norden weist, ist für die Priester bestimmt, die den Dienst am Altar versehen. Das sind die Söhne Zadoks, die aus den Nachkommen Levis Jahwe nahen, um ihm zu dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלִּשְׁכָּה
  choice: die Kammer
  rationale: Im Zusammenhang der Tempelvision bezeichnet לִשְׁכָּה einen bestimmten Raum innerhalb der Anlage. „Kammer“ ist architektonisch passend und bewahrt den formalen Charakter.
- source_word: אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן
  choice: deren Vorderseite nach Norden weist
  rationale: פָּנִים bezeichnet hier die Vorderseite beziehungsweise Ausrichtung des Raumes. Die Formulierung ist im Deutschen natürlich und gibt das räumliche Bild genau wieder.
- source_word: לַכֹּהֲנִים
  choice: ist für die Priester bestimmt
  rationale: Das ל markiert die Zuweisung der Kammer. Die im Hebräischen fehlende Kopula wird im Deutschen sinngemäß ergänzt.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ
  choice: die den Dienst am Altar versehen
  rationale: Die feste Verbindung שׁמר משׁמרת bezeichnet das gewissenhafte Wahrnehmen einer übertragenen Aufgabe. „Den Dienst am Altar versehen“ wahrt den kultischen Sinn und klingt im modernen Deutschen natürlicher als eine wörtliche Wiedergabe mit „Wache“.
- source_word: הֵמָּה בְנֵי צָדוֹק
  choice: Das sind die Söhne Zadoks
  rationale: הֵמָּה identifiziert nachdrücklich die zuvor genannten Priester. „Söhne Zadoks“ erhält die genealogische Ausdrucksweise des Hebräischen.
- source_word: הַקְּרֵבִים
  choice: die ... nahen
  rationale: קרב bezeichnet im priesterlichen Kontext das kultische Herantreten an Gott. „Nahen“ bewahrt diese besondere Bedeutung, ohne sie auf bloße räumliche Bewegung zu reduzieren.
- source_word: מִבְּנֵי לֵוִי
  choice: aus den Söhnen Levis
  rationale: 'Die Formulierung bewahrt sowohl die familiäre Ausdrucksweise als auch die partitive Bedeutung: Die Söhne Zadoks bilden eine Gruppe innerhalb der Söhne Levis.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְשָׁרְתוֹ
  choice: um ihm zu dienen
  rationale: שׁרת bezeichnet hier den priesterlichen Dienst. „Ihm dienen“ ist verständlich und würdig; der kultische Rahmen ergibt sich eindeutig aus Altar und Priestertum.
theological_decisions:
- issue: Die besondere priesterliche Aufgabe der Söhne Zadoks innerhalb der Nachkommen Levis
  choice: Der Vers bezeichnet die Söhne Zadoks als diejenige Gruppe aus den Söhnen Levis, die zu Jahwe naht und den Altardienst versieht.
  alternative: Die Aussage unterschiedslos auf alle Leviten zu beziehen.
  rationale: 'Der hebräische Wortlaut grenzt die Gruppe ausdrücklich ein: „Das sind die Söhne Zadoks ... aus den Söhnen Levis.“ Diese Unterscheidung wird bewahrt, ohne weitergehende konfessionelle Folgerungen einzutragen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die architektonische Beschreibung bleibt klar, während „nahen“ den kultisch-priesterlichen Ton des Ausgangstextes bewahrt. Keine Fußnote ist erforderlich, da die syntaktische Zuordnung und die lexikalischen Alternativen den Sinn nicht wesentlich verändern.
