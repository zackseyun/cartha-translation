  terminology: „Kammer“, „Priester“, „Altar“, „Söhne Zadoks“ und „Jahwe“ sind passend. „Den Dienst am Altar versehen“ bewahrt den kultischen Charakter von שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ angemessen.
