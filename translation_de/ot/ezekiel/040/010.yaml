  text: וְ/תָאֵ֨י הַ/שַּׁ֜עַר דֶּ֣רֶךְ הַ/קָּדִ֗ים שְׁלֹשָׁ֤ה מִ/פֹּה֙ וּ/שְׁלֹשָׁ֣ה מִ/פֹּ֔ה מִדָּ֥ה אַחַ֖ת לִ/שְׁלָשְׁתָּ֑/ם וּ/מִדָּ֥ה אַחַ֛ת לָ/אֵילִ֖ם מִ/פֹּ֥ה וּ/מִ/פּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/010.yaml
  text: And the guardrooms of the gate facing east were three on this side and three on that side[a]; the three of them had one measure[b], and the side pillars had one measure on this side and on that side.
translation:
  language: de
  text: Und die Kammern des nach Osten gerichteten Tores waren drei auf dieser und drei auf jener Seite.[a] Alle drei hatten dasselbe Maß; auch die Pfeiler auf beiden Seiten hatten dasselbe Maß.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nebenräume“ beziehungsweise „Wachkammern“; das hebräische Wort bezeichnet kleine Räume innerhalb des Torbaus, ohne ihre Funktion ausdrücklich festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: Für „Pfeiler“ sind auch „Torpfosten“ oder „Wandvorlagen“ möglich; die genaue architektonische Bedeutung des hebräischen Ausdrucks in Hesekiels Tempelvision ist umstritten.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָאֵי
  choice: Kammern
  rationale: Der Ausdruck bezeichnet kleine, in den Torbau eingefügte Räume. „Kammern“ bleibt gegenüber ihrer nicht ausdrücklich genannten Funktion zurückhaltend und ist im architektonischen Zusammenhang verständlich.
- source_word: הַשַּׁעַר
  choice: das Tor
  rationale: Die übliche und prägnante Wiedergabe des architektonischen Ausdrucks.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: nach Osten gerichtet
  rationale: Die Wendung bezeichnet hier die Ausrichtung des Tores; diese Wiedergabe ist natürlich und räumlich eindeutig.
- source_word: שְׁלֹשָׁה מִפֹּה וּשְׁלֹשָׁה מִפֹּה
  choice: drei auf dieser und drei auf jener Seite
  rationale: Bewahrt die deiktische Form und die symmetrische Anordnung auf den beiden Seiten des Tordurchgangs.
- source_word: מִדָּה אַחַת לִשְׁלָשְׁתָּם
  choice: Alle drei hatten dasselbe Maß
  rationale: Gibt die einheitlichen Abmessungen der drei Kammern in klarem, modernem Deutsch wieder.
- source_word: אֵילִם
  choice: Pfeiler
  rationale: Im architektonischen Kontext sind aufrechte Bauteile des Tores gemeint. „Pfeiler“ ist verständlich, ohne eine umstrittene genauere Bauform festzulegen.
- source_word: וּמִדָּה אַחַת לָאֵילִם מִפֹּה וּמִפּוֹ
  choice: auch die Pfeiler auf beiden Seiten hatten dasselbe Maß
  rationale: Bewahrt die Parallelität zur Maßangabe der Kammern und gibt die Gleichheit der Maße auf beiden Seiten natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzstruktur des Hebräischen bleibt erkennbar; zugleich werden die beiden Aussagen über gleiche Maße idiomatisch formuliert. Die architektonisch unsicheren Begriffe werden im Haupttext allgemein und in den Fußnoten differenziert wiedergegeben.
