  register: Modernes, würdiges Standarddeutsch. Die elliptische hebräische Nominalkonstruktion erhält für einen natürlichen deutschen Satz die ergänzte Verbform »waren«. Die auffällige Verdopplung »ringsum, ringsum« bleibt als stilistische und inhaltliche Hervorhebung erhalten.
