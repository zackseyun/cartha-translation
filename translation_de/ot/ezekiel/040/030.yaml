  yaml_path: translation/ot/ezekiel/040/030.yaml
  text: 'And vestibules all around[a], all around: twenty-five cubits long and five cubits wide.'
translation:
  language: de
  text: Und ringsum, ringsum gab es Vorhallen[a], fünfundzwanzig Ellen lang und fünf Ellen breit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Säulenhallen“ oder „Portiken“; der hebräische Ausdruck bezeichnet hier ein architektonisches Bauteil.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלַמּוֹת
  choice: Vorhallen
  rationale: Der Plural bezeichnet im Zusammenhang der Tempelarchitektur hallen- oder vorhallenartige Bauteile. »Vorhallen« ist im modernen Deutschen verständlich und gibt die räumliche Funktion wieder, ohne die Bauform unnötig festzulegen.
- source_word: סָבִיב סָבִיב
  choice: ringsum, ringsum
  rationale: Die Wiederholung im Hebräischen wird beibehalten, da sie die umfassende Verteilung betont und dem Satz seinen markanten Rhythmus gibt.
- source_word: אֹרֶךְ
  choice: lang
  rationale: 'Die substantivische Maßangabe wird in natürlichem Deutsch adjektivisch wiedergegeben: »fünfundzwanzig Ellen lang«.'
- source_word: חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: fünfundzwanzig Ellen
  rationale: Die Zahl wird in heutiger deutscher Reihenfolge ausgedrückt; »Elle« bleibt als antike Maßeinheit erhalten.
- source_word: רֹחַב
  choice: breit
  rationale: Die Breitenangabe wird parallel zu »lang« adjektivisch formuliert.
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen
  rationale: Direkte Wiedergabe der Maßangabe mit der üblichen deutschen Pluralform »Ellen«.
