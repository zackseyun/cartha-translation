  text: וְ/אֵֽלַמּ֖וֹת סָבִ֣יב סָבִ֑יב אֹ֗רֶךְ חָמֵ֤שׁ וְ/עֶשְׂרִים֙ אַמָּ֔ה וְ/רֹ֖חַב חָמֵ֥שׁ אַמּֽוֹת׀׃
base_translation:
