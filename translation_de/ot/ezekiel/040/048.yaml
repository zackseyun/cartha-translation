base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/048.yaml
  text: 'Then he brought me to the vestibule of the house[a], and he measured the jambs of the vestibule: five cubits on this side and five cubits on that side[c][b]; and the width of the gate was three cubits on this side and three cubits on that side.'
translation:
  language: de
  text: 'Dann brachte er mich zur Vorhalle[a] des Hauses[b]. Er maß die Seitenpfeiler[c] der Vorhalle: fünf Ellen auf der einen und fünf Ellen auf der anderen Seite. Die Breite des Tores betrug drei Ellen auf der einen und drei Ellen auf der anderen Seite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »Eingangshalle« oder »Vorbau«.
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Haus« ist in dieser Vision das Tempelgebäude gemeint.
    reason: lexical_alternative
  - marker: c
    text: Das hier verwendete hebräische Architekturwort kann auch mit »Pfosten« oder »seitliche Stützen« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֻלָם
  choice: Vorhalle
  rationale: Der Ausdruck bezeichnet im Tempelbau den Hallenbereich vor dem Hauptgebäude. »Vorhalle« ist im Deutschen präzise, geläufig und dem architektonischen Zusammenhang angemessen.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Der hebräische Text spricht wörtlich vom »Haus«. In der Vision ist damit das Tempelgebäude gemeint; »Haus« bewahrt jedoch die Ausdrucksweise und Resonanz des Ausgangstextes.
- source_word: אֵל אֻלָם
  choice: die Seitenpfeiler der Vorhalle
  rationale: אֵל ist hier eine architektonische Bezeichnung für die seitlichen Bauteile am Eingang und nicht das gleich geschriebene Wort für »Gott«. »Seitenpfeiler« passt zu den beidseitigen Maßangaben und ist verständlicher als das technisch engere »Türpfosten«.
- source_word: חָמֵשׁ אַמּוֹת ... מִפֹּה וְחָמֵשׁ אַמּוֹת מִפֹּה
  choice: fünf Ellen auf der einen und fünf Ellen auf der anderen Seite
  rationale: Die deiktischen Wendungen bezeichnen die beiden einander entsprechenden Seiten. Die gewählte Formulierung gibt dies in natürlichem Deutsch wieder und erhält die Parallelität.
- source_word: רֹחַב הַשַּׁעַר
  choice: die Breite des Tores
  rationale: שַׁעַר bedeutet gewöhnlich »Tor« oder »Toreingang«. Die formnahe Wiedergabe »Tor« wahrt den architektonischen Wortlaut, ohne das gemeinte Eingangsmaß näher auszudeuten.
- source_word: שָׁלֹשׁ אַמּוֹת מִפּוֹ וְשָׁלֹשׁ אַמּוֹת מִפּוֹ
  choice: drei Ellen auf der einen und drei Ellen auf der anderen Seite
  rationale: Die Wiederholung bezeichnet beide Seiten des Eingangs. Die deutsche Fassung spiegelt die Struktur des Hebräischen und glättet die ungewöhnliche Maßangabe nicht erklärend.
- source_word: וַיְבִאֵנִי ... וַיָּמָד
  choice: Dann brachte er mich ... Er maß
  rationale: Die aufeinanderfolgenden Verbformen führen die Visionshandlung weiter. »Dann« markiert den Fortgang natürlich; ein neuer Hauptsatz hält die lange Maßbeschreibung im Deutschen übersichtlich.
