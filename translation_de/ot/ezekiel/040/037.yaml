  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: de
  text: Seine Pfeiler[a] waren zum äußeren Vorhof hin ausgerichtet, und auf ihnen waren Palmen, auf der einen wie auf der anderen Seite.[b] Acht Stufen führten zu ihm hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pfosten“ oder „Pilaster“. Die genaue Bedeutung des seltenen hebräischen Architekturbegriffs ist unsicher; er bezeichnet hier wahrscheinlich seitliche Bauteile der Toranlage.'
    reason: lexical_alternative
  - marker: b
    text: Im architektonischen Zusammenhang können Palmen auch Palmverzierungen oder eingemeißelte Palmenmotive bezeichnen. Das Hebräische sagt ausdrücklich „Palmen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵילָו
  choice: Seine Vorhalle
  rationale: Das seltene architektonische Wort bezeichnet hier am ehesten den vorspringenden Eingangsbereich des Tores. „Vorhalle“ ist im Deutschen klar, sachlich und dem Tempelkontext angemessen.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: war zum äußeren Vorhof hin ausgerichtet
  rationale: Die Präposition לְ gibt hier die räumliche Orientierung an. Die verbale Wiedergabe macht diese Beziehung in natürlichem Deutsch deutlich.
- source_word: תִמֹרִים
  choice: Palmen
  rationale: Das hebräische Wort bezeichnet ausdrücklich Palmen. Im architektonischen Zusammenhang sind sehr wahrscheinlich Darstellungen oder Ornamente gemeint; diese Deutung wird jedoch nicht stillschweigend in den Haupttext eingetragen.
- source_word: אֶל־אֵילָיו
  choice: an ihren Pfeilern
  rationale: Die ähnlich gebildete Architekturbezeichnung bezieht sich in dieser Wendung wahrscheinlich auf seitliche Pfeiler oder Pfosten der Toranlage, an denen die Palmen angebracht waren.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: auf beiden Seiten
  rationale: Die distributive Formel „von hier und von hier“ beschreibt eine symmetrische Anordnung. „Auf beiden Seiten“ gibt dies knapp und idiomatisch wieder.
- source_word: וּשְׁמֹנֶה מַעֲלוֹת מַעֲלָו
  choice: Acht Stufen führten zu ihr hinauf
  rationale: Die Formulierung bezeichnet einen aus acht Stufen bestehenden Aufgang. Die deutsche Verbalkonstruktion bewahrt die Aufwärtsrichtung und ist zugleich natürlich verständlich.
