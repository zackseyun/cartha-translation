  text: אֹ֣רֶךְ הָ/אֻלָ֞ם עֶשְׂרִ֣ים אַמָּ֗ה וְ/רֹ֨חַב֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה אַמָּ֔ה וּ/בַֽ/מַּעֲל֔וֹת אֲשֶׁ֥ר יַעֲל֖וּ אֵלָ֑י/ו וְ/עַמֻּדִים֙ אֶל הָ֣/אֵילִ֔ים אֶחָ֥ד מִ/פֹּ֖ה וְ/אֶחָ֥ד מִ/פֹּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/049.yaml
  text: The length of the vestibule was twenty cubits, and the width was twelve cubits, and by the steps by which one went up to it; and pillars were beside the sidewalls, one on this side and one on that side.
translation:
  language: de
  text: Die Vorhalle war zwanzig Ellen lang und elf Ellen breit.[a] Über Stufen stieg man zu ihr hinauf. Neben den Wandpfeilern standen Säulen, eine auf dieser und eine auf jener Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die alte griechische Übersetzung hat hier „zwölf Ellen“ und erwähnt anschließend „zehn Stufen“.
    reason: Dokumentiert eine bedeutende alte Textvariante bei der Breite und der schwierigen Stufenangabe, während der Haupttext dem WLC folgt.
lexical_decisions:
- source_word: הָאֻלָם
  choice: die Vorhalle
  rationale: Bezeichnet im Tempelkontext den vorgelagerten Hallen- oder Eingangsbereich.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: elf
  rationale: Die masoretische Form bedeutet eindeutig „elf“; die abweichende Zahl der alten griechischen Überlieferung wird in einer Fußnote genannt.
- source_word: וּבַמַּעֲלוֹת אֲשֶׁר יַעֲלוּ אֵלָיו
  choice: Über Stufen stieg man zu ihr hinauf
  rationale: Gibt die knappe und syntaktisch schwierige masoretische Formulierung natürlich wieder, ohne eine im hebräischen Text nicht genannte Stufenzahl in den Haupttext einzusetzen.
- source_word: עַמֻּדִים ... אֶל הָאֵילִים
  choice: Säulen ... neben den Wandpfeilern
  rationale: Unterscheidet die freistehenden Säulen von den baulichen Pfeilern beziehungsweise Türpfeilern.
- source_word: אֶחָד מִפֹּה וְאֶחָד מִפֹּה
  choice: eine auf dieser und eine auf jener Seite
  rationale: Bewahrt die symmetrische räumliche Aussage des Hebräischen in idiomatischem Deutsch.
