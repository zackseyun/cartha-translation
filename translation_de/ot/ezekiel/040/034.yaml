base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/034.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: de
  text: Seine Vorhalle war dem äußeren Vorhof zugewandt, und an ihren Pfeilern waren auf beiden Seiten Palmen[a]. Zu ihr führten acht Stufen hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Palmenverzierungen“. Wörtlich steht „Palmen“; in diesem architektonischen Zusammenhang sind wahrscheinlich bildliche oder eingeschnitzte Palmenmotive gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַמּוֹ
  choice: Seine Vorhalle
  rationale: אֵלָם bezeichnet im Zusammenhang der Tempeltore die vorgelagerte Vorhalle; „Vorhalle“ ist im Deutschen natürlich und architektonisch passend.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: lag zum äußeren Vorhof hin
  rationale: Die Präposition ל beschreibt hier die räumliche Ausrichtung. Die Formulierung gibt diese Beziehung natürlich wieder, ohne mehr als eine Orientierung auszusagen.
- source_word: וְתִמֹרִים
  choice: Palmen
  rationale: תִמֹרִים bedeutet wörtlich „Palmen“. Im architektonischen Zusammenhang sind vermutlich Palmendarstellungen beziehungsweise -verzierungen gemeint; diese Deutung wird in der Fußnote kenntlich gemacht.
- source_word: אֶל־אֵלָיו
  choice: an ihren Pfeilern
  rationale: אֵילָיו bezeichnet in den wiederkehrenden Torbeschreibungen seitliche Bauteile. „Pfeiler“ ist verständlich und bewahrt die mögliche architektonische Breite besser als das engere „Türpfosten“.
- source_word: מִפֹּה וּמִפֹּה
  choice: auf beiden Seiten
  rationale: Die hebräische Wendung bezeichnet eine beidseitige Anordnung; die knappe deutsche Formulierung gibt dies idiomatisch wieder.
- source_word: וּשְׁמֹנֶה מַעֲלוֹת מַעֲלוֹ
  choice: Acht Stufen führten zu ihr hinauf
  rationale: מַעֲלוֹת sind Stufen beziehungsweise ein Aufgang; die deutsche Wendung drückt ihre Funktion und Zugehörigkeit zur Vorhalle natürlich aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe architektonische Beschreibung bleibt erhalten; unnatürliche Wiederholungen des Hebräischen werden idiomatisch wiedergegeben. Das feminine Pronomen „ihr“ bezieht sich eindeutig auf die Vorhalle.
