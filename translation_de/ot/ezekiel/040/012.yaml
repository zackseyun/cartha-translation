  yaml_path: translation/ot/ezekiel/040/012.yaml
  text: And there was a barrier of one cubit in front of the side rooms[a], and a barrier of one cubit on the other side[b]; and each side room was six cubits on this side and six cubits on that side.
translation:
  language: de
  text: Vor den Seitenkammern[a] lag eine Abgrenzung von einer Elle; auch auf der anderen Seite[b] lag eine Abgrenzung von einer Elle. Jede Seitenkammer maß sechs Ellen auf dieser und sechs Ellen auf jener Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Wachkammern«, »Zellen« oder »Nischen«. Das hebräische Wort תָּאוֹת bezeichnet kleine Kammern im Torbau.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen wiederholte Ortsangaben, wörtlich etwa »von hier« und »von dort«, die auf die gegenüberliegenden Seiten verweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּל
  choice: Abgrenzung
  rationale: Im architektonischen Zusammenhang bezeichnet das Wort einen begrenzenden beziehungsweise abtrennenden Bereich vor den Kammern. »Abgrenzung« bewahrt diese räumliche Bedeutung, ohne eine bestimmte Bauform wie Mauer oder Schranke festzulegen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition ist hier räumlich zu verstehen und wird im Deutschen natürlich mit »vor« wiedergegeben.
- source_word: הַתָּאוֹת / הַתָּא
  choice: Seitenkammern / jede Seitenkammer
  rationale: תָּא bezeichnet kleine Kammern innerhalb des Torbaus. »Seitenkammer« ist verständlich und vermeidet die funktionale Festlegung, die etwa »Wachkammer« mit sich brächte. Der Singular im zweiten Satz wird im Kontext distributiv wiedergegeben.
- source_word: אַמָּה אֶחָת / שֵׁשׁ אַמּוֹת
  choice: eine Elle / sechs Ellen
  rationale: Die antike Maßeinheit wird beibehalten, da sie für die durchgehend vermessene Tempelvision charakteristisch ist.
- source_word: מִפֹּה ... מִפּוֹ
  choice: auf der anderen Seite / auf der einen und ... auf der anderen Seite
  rationale: Die wiederholten deiktischen Angaben bezeichnen gegenüberliegende Seiten. Die idiomatische deutsche Fassung erhält den beidseitigen räumlichen Kontrast.
theological_decisions: []
translation_notes:
