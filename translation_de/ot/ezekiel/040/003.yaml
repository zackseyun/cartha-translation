  text: וַ/יָּבֵ֨יא אוֹתִ֜/י שָׁ֗מָּ/ה וְ/הִנֵּה אִישׁ֙ מַרְאֵ֨/הוּ֙ כְּ/מַרְאֵ֣ה נְחֹ֔שֶׁת וּ/פְתִיל פִּשְׁתִּ֥ים בְּ/יָד֖/וֹ וּ/קְנֵ֣ה הַ/מִּדָּ֑ה וְ/ה֥וּא עֹמֵ֖ד בַּ/שָּֽׁעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/003.yaml
  text: He brought me there[a], and behold, there was a man whose appearance was like the appearance of bronze, with a linen cord in his hand and a measuring reed[c][b]; and he was standing in the gateway.
translation:
  language: de
  text: 'Er brachte mich dorthin. Und sieh: Da war ein Mann, dessen Aussehen dem Aussehen von Bronze glich. In seiner Hand hatte er eine Leinenschnur[a] und eine Messrute. Er stand im Torbau[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Flachsschnur“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Tor“ beziehungsweise „im Torbereich“. Das hebräische Wort kann das Tor oder die gesamte Toranlage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: Er brachte mich dorthin
  rationale: Die Verbform führt die Erzählung weiter; „dorthin“ gibt die gerichtete Bewegung zu dem zuvor beschriebenen Ort natürlich wieder.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung lenkt die Aufmerksamkeit lebhaft auf eine neue Erscheinung und bewahrt den prophetischen Ton in verständlichem modernem Deutsch.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Der hebräische Text bezeichnet die Gestalt schlicht als Mann und legt ihre genauere Identität nicht fest.
- source_word: מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת
  choice: dessen Aussehen dem Aussehen von Bronze glich
  rationale: Die Wiederholung von מַרְאֶה wird zur Betonung bewahrt. נְחֹשֶׁת kann Bronze oder Kupfer bezeichnen; „Bronze“ passt hier idiomatisch zur visionären Beschreibung.
- source_word: פְּתִיל פִּשְׁתִּים
  choice: eine Leinenschnur
  rationale: Die Wortverbindung bezeichnet eine aus Flachs beziehungsweise Leinen gefertigte Schnur, wahrscheinlich zum Messen.
- source_word: בְּיָדוֹ
  choice: in seiner Hand
  rationale: Der ausdrücklich singularische Ausdruck wird beibehalten.
- source_word: קְנֵה הַמִּדָּה
  choice: eine Messrute
  rationale: Gemeint ist ein Rohr beziehungsweise eine Rute als Messgerät; „Messrute“ ist im architektonischen Zusammenhang klar und natürlich.
- source_word: וְהוּא עֹמֵד
  choice: Er stand
  rationale: Das Partizip schildert die anhaltende Haltung der Gestalt; im Deutschen gibt das Präteritum diese Szenenbeschreibung natürlich wieder.
- source_word: בַּשַּׁעַר
  choice: im Torbau
  rationale: שַׁעַר kann im Tempelkontext die gesamte Toranlage bezeichnen; „im Torbau“ bewahrt zudem die örtliche Bedeutung der Präposition ב.
theological_decisions:
- issue: Identität des Mannes in der Vision
  choice: Die Gestalt wird nur als „ein Mann“ bezeichnet.
  alternative: Eine ausdrückliche Identifizierung als Engel, himmlischer Bote oder göttliche Erscheinung.
  rationale: Der Vers selbst nennt lediglich einen Mann und beschreibt sein Aussehen und seine Messgeräte. Eine genauere übernatürliche Identifizierung wäre eine Auslegung, die der Wortlaut nicht ausdrücklich vorgibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von „Aussehen“ bleibt als Merkmal des hebräischen Textes erhalten; kurze Sätze gestalten die visionäre Szene klar, ohne ihre Spannung aufzulösen.
