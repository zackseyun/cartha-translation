  yaml_path: translation/ot/ezekiel/040/022.yaml
  text: Its windows[a], its porch, and its palm-tree decorations had the same measurements as the gate that faced east. People would go up to it by seven steps[c][b], and its porch was in front of them.
translation:
  language: de
  text: Seine Fenster[a], seine Vorhalle[b] und seine Palmenverzierungen[c] hatten dieselben Maße wie das Tor, das nach Osten ausgerichtet war. Über sieben Stufen stieg man zu ihm hinauf[d], und seine Vorhalle lag vor ihnen[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fensteröffnungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Eingangshalle“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „seine Palmen“; gemeint sind im architektonischen Zusammenhang wahrscheinlich palmenförmige Verzierungen.'
    reason: cultural_note
  - marker: d
    text: 'Wörtlich steht ein Verb im Plural: „Sie stiegen zu ihm hinauf.“ Es ist wahrscheinlich unpersönlich gemeint: „Man stieg zu ihm hinauf.“'
    reason: lexical_alternative
  - marker: e
    text: Der genaue Bezug von „ihnen“ ist in der knappen hebräischen Formulierung nicht völlig eindeutig; naheliegend sind die Stufen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְחַלּוֹנוֹ
  choice: seine Fenster
  rationale: חַלּוֹן bezeichnet ein Fenster oder eine Fensteröffnung. Der Ausdruck wird hier passend zum architektonischen Zusammenhang kollektiv wiedergegeben.
- source_word: וְאֵלַמּוֹ / וְאֵילַמּוֹ
  choice: seine Vorhalle
  rationale: אֵילָם/אוּלָם bezeichnet im Tempelbau einen vorgelagerten Eingangsbereich. „Vorhalle“ ist im modernen Deutschen klar und architektonisch passend; beide Vorkommen werden einheitlich übersetzt.
- source_word: וְתִמָּרוֹ
  choice: seine Palmenverzierungen
  rationale: תִּמָּרָה bezeichnet in diesem Bauzusammenhang wahrscheinlich palmenförmigen Schmuck und keine lebenden Bäume.
- source_word: כְּמִדַּת
  choice: hatten dieselben Maße wie
  rationale: Die Verbindung aus vergleichendem כ und מִדָּה drückt die Übereinstimmung der Abmessungen aus.
- source_word: הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: das Tor, dessen Vorderseite nach Osten zeigte
  rationale: 'Die Formulierung bewahrt das Bild der „Vorderseite“ (wörtlich: seines Angesichts), gibt die räumliche Ausrichtung aber in natürlichem Deutsch wieder.'
- source_word: וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ בוֹ
  choice: Über sieben Stufen stieg man zu ihm hinauf
  rationale: Der Plural des hebräischen Verbs kann hier unpersönlich gebraucht sein. Das deutsche „man“ gibt diesen allgemeinen Sinn natürlich wieder; ב bezeichnet den Weg beziehungsweise das Mittel des Hinaufsteigens.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die räumliche Grundbedeutung von לִפְנֵי wird erhalten. Das Pronomen bleibt stehen, weil sein Bezug im knappen hebräischen Satz nicht völlig eindeutig ist.
