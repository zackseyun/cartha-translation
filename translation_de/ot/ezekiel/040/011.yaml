  source_fidelity: 'Die Übersetzung gibt וַיָּמָד als fortschreitende Erzählhandlung („Dann maß er“) angemessen wieder und bewahrt die zwei im Hebräischen ausdrücklich genannten Dimensionen: die Breite der Toröffnung mit zehn Ellen sowie die Länge des Tores mit dreizehn Ellen. Sie ergänzt keine räumliche Deutung wie „Tiefe“ und erhält die antike Maßeinheit.'
  naturalness: '„Dann maß er die Breite der Toröffnung: zehn Ellen, und die Länge des Tores: dreizehn Ellen“ ist modernes, sachliches und gut verständliches Deutsch. Die wiederholte Konstruktion mit Doppelpunkt entspricht dem knappen Stil einer Maßangabe und ist hier natürlich.'
