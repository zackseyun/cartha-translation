id: EZK.40.11
reference: Ezekiel 40:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֛מָד אֶת רֹ֥חַב פֶּֽתַח הַ/שַּׁ֖עַר עֶ֣שֶׂר אַמּ֑וֹת אֹ֣רֶךְ הַ/שַּׁ֔עַר שְׁל֥וֹשׁ עֶשְׂרֵ֖ה אַמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/011.yaml
  text: 'Then he measured the width of the entrance of the gate: ten cubits[b][a], and the length of the gate: thirteen cubits.'
translation:
  language: de
  text: 'Dann maß er die Breite der Toröffnung[a]: zehn Ellen, und die Länge des Tores[b]: dreizehn Ellen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Öffnung der Toranlage“. Das hebräische Wort שַׁעַר kann die gesamte Toranlage bezeichnen, nicht nur das eigentliche Tor.'
    reason: lexical_alternative
  - marker: b
    text: Einige Übersetzungen geben dieses zweite Maß deutender wieder, etwa als Tiefe oder Spannweite der Toranlage. Im hebräischen Text steht jedoch schlicht „Länge des Tores“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Wayyiqtol von מדד führt den nächsten Handlungsschritt der Vision ein; „Dann“ gibt die erzählerische Abfolge in natürlichem Deutsch wieder.
- source_word: רֹחַב
  choice: Breite
  rationale: Der übliche deutsche Ausdruck für die bezeichnete räumliche Ausdehnung.
- source_word: פֶּתַח הַשַּׁעַר
  choice: Toröffnung
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang; die Zusammensetzung „Toröffnung“ ist im architektonischen Zusammenhang knapp und eindeutig.
- source_word: הַשַּׁעַר
  choice: des Tores
  rationale: שַׁעַר wird direkt mit „Tor“ wiedergegeben, kann hier im Zusammenhang jedoch auch die gesamte Toranlage bezeichnen; diese Bedeutungsbreite wird in einer Fußnote offengehalten.
- source_word: עֶשֶׂר אַמּוֹת
  choice: zehn Ellen
  rationale: Die antike Maßeinheit wird beibehalten und nicht in ein modernes Maß umgerechnet.
- source_word: אֹרֶךְ
  choice: Länge
  rationale: „Länge“ entspricht der Grundbedeutung des hebräischen Ausdrucks, ohne die räumliche Ausrichtung deutend als Tiefe oder Spannweite festzulegen.
- source_word: שְׁלֹשׁ עֶשְׂרֵה אַמּוֹת
  choice: dreizehn Ellen
  rationale: Direkte Wiedergabe der Zahl und Maßeinheit im knappen Messstil des hebräischen Textes.
theological_decisions: []
