  source_fidelity: Die Wiedergabe von וַיְבִיאֵנִי, dem Weg durch das Südtor und dem anschließenden Messen ist sachgerecht. »Vorhof« ist jedoch für חָצֵר הַפְּנִימִי ungenau, da es im Deutschen gewöhnlich den äußeren bzw. vorgelagerten Hof bezeichnet; der hebräische Ausdruck meint ausdrücklich den inneren Hof. »Diesen Maßen« gibt das Demonstrativ הָאֵלֶּה unmittelbarer wieder als »denselben Maßen«, ohne den Kontextbezug auszuschließen.
  naturalness: »Innerer Hof« ist modernes, klares Standarddeutsch in einer architektonischen Tempelbeschreibung. Der Satz bleibt knapp und gut lesbar. Die bisherige alternative Formulierung »über das Südtor« ist im Deutschen missverständlich, weil sie auch eine Bewegung oberhalb des Tores nahelegen kann.
  terminology: »Innerer Hof« wahrt den Gegensatz zum äußeren Hof. »Südtor« und »Maße« sind passende, etablierte Begriffe. Die Erläuterung zu den Maßen sollte nicht von mehreren zuvor beschriebenen »Toren« sprechen, da der hebräische Wortlaut nur auf »diese Maße« verweist.
