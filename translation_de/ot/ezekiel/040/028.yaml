  text: Then he brought me into the inner court by way of the south gate[b][a], and he measured the south gate according to these measurements.
translation:
  language: de
  text: Dann brachte er mich durch das Südtor[a] in den inneren Hof und maß das Südtor nach diesen Maßen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
