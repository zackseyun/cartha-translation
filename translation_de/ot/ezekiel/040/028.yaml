    issue: »inneren Vorhof« für חָצֵר הַפְּנִימִי
    rationale: »Vorhof« bezeichnet im heutigen Deutschen normalerweise einen äußeren oder vorgelagerten Hof und verwischt damit den expliziten Gegensatz »innerer Hof« im Hebräischen.
  - severity: low
    issue: »denselben Maßen« und Fußnote b formulieren den Kontextbezug zu bestimmt
    rationale: Das Demonstrativ bedeutet zunächst »diesen«. Der Rückverweis auf zuvor beschriebene Maße ist wahrscheinlich, sollte in der Fußnote aber als wahrscheinlich markiert werden; die Erwähnung mehrerer Tore geht über den Wortlaut hinaus.
  - severity: low
    issue: 'Fußnote a: »über das Südtor«'
    rationale: Diese Alternative ist im Deutschen mehrdeutig und keine hilfreiche natürliche Wiedergabe der möglichen lokalen bzw. instrumentalen Nuance von בְּ.
