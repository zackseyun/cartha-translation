lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Dann brachte er mich
  rationale: Der Hifil von בוא bedeutet »bringen«; »Dann« gibt den erzählerischen Fortgang des Wayyiqtol im modernen Deutschen natürlich wieder.
- source_word: חָצֵר הַפְּנִימִי
  choice: in den inneren Vorhof
  rationale: חָצֵר bezeichnet hier den Hof der Tempelanlage. »Vorhof« ist in deutscher Tempelterminologie geläufig und unterscheidet den Bereich klar vom Gebäudeinneren.
- source_word: בְּשַׁעַר הַדָּרוֹם
  choice: durch das Südtor
  rationale: Die Präposition ב bezeichnet hier am natürlichsten den Weg beziehungsweise das Mittel des Eintritts. »Durch« drückt dies im Deutschen knapp aus; »über das Südtor« bleibt als mögliche Wiedergabe vermerkt.
- source_word: וַיָּמָד
  choice: und maß
  rationale: Der Qal von מדד bedeutet schlicht »messen«; das wiederholte Messen bleibt ausdrücklich erhalten.
- source_word: אֶת הַשַּׁעַר הַדָּרוֹם
  choice: das Südtor
  rationale: Die bestimmte Nominalgruppe ist das direkte Objekt und nimmt dasselbe eben erwähnte Tor wieder auf.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: nach denselben Maßen
  rationale: כְּ bezeichnet die Übereinstimmung mit den zuvor genannten Maßen. Das hebräische Demonstrativ »diese« verweist im Kontext zurück; idiomatisches Deutsch gibt dies präzise mit »denselben« wieder.
