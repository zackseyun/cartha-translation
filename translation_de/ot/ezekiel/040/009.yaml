  text: 'Then he measured the portico of the gate: eight cubits[a], and its side pillars two cubits[b]; and the portico of the gate was toward the temple.'
translation:
  language: de
  text: 'Dann maß er die Vorhalle des Tores: acht Ellen; seine Seitenpfeiler[a]: zwei Ellen. Die Vorhalle des Tores lag zum Tempel[b] hin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Türpfosten“, „Pilaster“ oder „Pfeiler“. Der genaue architektonische Gegenstand ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dem Haus“. In dieser Tempelvision ist damit das Tempelgebäude gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Wayyiqtol von מדד führt den nächsten Handlungsschritt ein; „Dann“ gibt die erzählerische Abfolge in natürlichem Deutsch wieder.
- source_word: אֻלָם הַשַּׁעַר
  choice: die Vorhalle des Tores
  rationale: אֻלָם bezeichnet hier den hallen- oder vorhallenartigen Teil des Torgebäudes. „Vorhalle“ ist im Deutschen verständlich und architektonisch passend.
- source_word: שְׁמֹנֶה אַמּוֹת
  choice: acht Ellen
  rationale: Die antike Maßeinheit wird beibehalten, da keine bestimmte moderne Umrechnung vorausgesetzt werden sollte.
- source_word: וְאֵילוֹ
  choice: ihre Seitenpfeiler
  rationale: אֵיל bezeichnet in diesem Bauzusammenhang vorspringende tragende oder begrenzende Bauteile. „Seitenpfeiler“ vermittelt den wahrscheinlichen Sinn; die lexikalische Unsicherheit wird in einer Fußnote bewahrt.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: maßen zwei Ellen
  rationale: Die elliptische hebräische Maßangabe wird für klares, natürliches Deutsch verbal ergänzt.
- source_word: מֵהַבָּיִת
  choice: lag auf der dem Tempel zugewandten Seite
  rationale: Die schwierige räumliche Wendung bezeichnet wahrscheinlich die Lage beziehungsweise Ausrichtung zur Tempelhausseite hin. Die Wiedergabe macht diese Beziehung verständlich, ohne „Haus“ als gewöhnliches Wohnhaus misszuverstehen.
