  text: Then he brought me to the north gate and measured it according to these measurements[a].
translation:
  language: de
  text: Dann brachte er mich zum Nordtor und maß es nach diesen Maßen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und maß es mit diesen Maßen“; gemeint sind wahrscheinlich dieselben Abmessungen wie zuvor beschrieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Dann brachte er mich
  rationale: Das narrative Waw führt die Handlung weiter; „Dann“ gibt die Abfolge natürlich wieder. Der Hifil von בוא bedeutet hier „bringen/führen“, wobei „brachte“ die direkte Entsprechung ist.
- source_word: אֶל
  choice: zum
  rationale: Die Präposition bezeichnet die Bewegung auf ein Ziel hin; zusammen mit dem bestimmten „Nordtor“ ist „zum“ idiomatisch.
- source_word: שַׁעַר הַצָּפוֹן
  choice: Nordtor
  rationale: Die Status-constructus-Verbindung bezeichnet das Tor im Norden beziehungsweise das nach Norden gerichtete Tor. „Nordtor“ ist in einer architektonischen Beschreibung knapp und natürlich.
- source_word: וּמָדַד
  choice: und maß es
  rationale: Das Verb setzt dasselbe Subjekt voraus. Das im Hebräischen unausgesprochene Objekt wird aus dem unmittelbar zuvor genannten Tor ergänzt.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: nach denselben Maßen
  rationale: כ bezeichnet hier Übereinstimmung mit den zuvor beschriebenen Maßen. Das demonstrative „diesen“ verweist kontextuell auf dieselben bereits genannten Maße; „nach denselben Maßen“ drückt dies in natürlichem Deutsch aus.
