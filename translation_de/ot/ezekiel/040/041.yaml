base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/041.yaml
  text: Four tables on this side and four tables on that side[a], by the side of the gate—eight tables[c][b]; on them they slaughtered.
translation:
  language: de
  text: Vier Tische standen auf dieser Seite und vier Tische auf jener Seite[a], an der Seite des Tores[b] – acht Tische; auf ihnen soll man schlachten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der einen Seite und auf der anderen Seite“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an der Schulter des Tores“; gemeint ist die Seite oder Flanke der Toranlage.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „auf ihnen wird man schlachten“. Der hebräische Imperfekt kann eine zukünftige Handlung oder die vorgesehene beziehungsweise übliche Verwendung der Tische bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה ... שְׁמוֹנָה
  choice: vier ... acht
  rationale: Die Kardinalzahlen bezeichnen zunächst zwei Gruppen von je vier Tischen und fassen sie anschließend als acht zusammen.
- source_word: שֻׁלְחָנוֹת
  choice: Tische
  rationale: Das Substantiv bezeichnet schlicht Tische; ihre Verwendung zum Schlachten ergibt sich aus dem folgenden Satzteil und wird nicht vorweg in die Bezeichnung eingetragen.
- source_word: מִפֹּה ... מִפֹּה
  choice: auf dieser Seite ... auf jener Seite
  rationale: Die gepaarten Ortsangaben stellen zwei gegenüberliegende Seiten einander gegenüber; diese Wiedergabe erhält den räumlichen Kontrast in natürlichem Deutsch.
- source_word: לְכֶתֶף הַשָּׁעַר
  choice: an der Seite des Tores
  rationale: כָּתֵף bedeutet wörtlich „Schulter“, bezeichnet räumlich beziehungsweise architektonisch aber die Seite oder Flanke eines Bauwerks.
- source_word: אֲלֵיהֶם
  choice: auf ihnen
  rationale: Die Präposition mit dem Pronomen verweist hier am natürlichsten auf die Tischflächen als Ort des Schlachtens.
- source_word: יִשְׁחָטוּ
  choice: schlachtete man
  rationale: Der hebräische Imperfekt kann im beschreibenden Zusammenhang die übliche oder vorgesehene Nutzung ausdrücken. Das unpersönliche „man“ vermeidet eine unbelegte nähere Bestimmung der Handelnden.
theological_decisions:
- issue: Zeit- und Modalwert von יִשְׁחָטוּ
  choice: schlachtete man
  alternative: wird man schlachten / sollte man schlachten
  rationale: Der visionär-beschreibende Kontext lässt eine gewohnheitsmäßige, vorgesehene oder zukünftige Handlung zu. Der Haupttext gibt die funktionale Beschreibung idiomatisch wieder; die Fußnote bewahrt die Zukunftslesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Nennung der vier Tische und die anschließende Summe bleiben entsprechend der räumlich-präzisen Beschreibung erhalten. „Standen“ wird zur natürlichen deutschen Satzbildung ergänzt; im nominal geprägten Hebräisch ist kein ausdrückliches Verb für die Lage der Tische gesetzt.
