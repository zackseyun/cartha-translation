base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/045.yaml
  text: 'Then he spoke to me: “This chamber[a], whose front faces south, is for the priests who keep charge of the temple.”'
translation:
  language: de
  text: 'Dann sprach er zu mir: »Diese Kammer, deren Vorderseite nach Süden weist, ist für die Priester bestimmt, die den Dienst am Tempel[a] versehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Haus«. In dieser Tempelvision bezeichnet das hebräische Wort den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלַי
  choice: Dann sagte er zu mir
  rationale: Die Wayyiqtol-Form führt die Erzählung und die direkte Rede fort. „Dann sagte er zu mir“ ist natürliches modernes Deutsch und bewahrt die zeitliche Abfolge.
- source_word: זֹה הַלִּשְׁכָּה
  choice: Diese Kammer
  rationale: לִשְׁכָּה bezeichnet im Zusammenhang der Tempelarchitektur einen Neben- oder Dienstraum. „Kammer“ entspricht dem gehobenen architektonischen Kontext.
- source_word: אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַדָּרוֹם
  choice: deren Vorderseite nach Süden weist
  rationale: פָּנֶיהָ bezeichnet hier die Vorder- bzw. zugewandte Seite des Raumes; die Formulierung erhält die konkrete räumliche Ausrichtung.
- source_word: לַכֹּהֲנִים
  choice: ist für die Priester bestimmt
  rationale: Das Präfix ל kennzeichnet Zweck oder Zuweisung. Die Formulierung drückt die Bestimmung aus, ohne Eigentum zu behaupten.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: die den Dienst … versehen
  rationale: Die Verbindung aus Partizip und stammverwandtem Substantiv bezeichnet die treue Wahrnehmung einer zugewiesenen Amts- oder Dienstpflicht. „Den Dienst versehen“ klingt im Deutschen natürlich und passt zum priesterlichen Kontext.
- source_word: הַבָּיִת
  choice: Tempel
  rationale: בַּיִת bedeutet wörtlich „Haus“, bezeichnet in dieser Tempelvision aber den Tempel bzw. Tempelbau. „Tempel“ macht den kontextuellen Bezug für heutige Leser deutlich.
theological_decisions:
- issue: Bezug von הַבָּיִת in der Tempelvision
  choice: Tempel
  alternative: Haus
  rationale: Der architektonische Zusammenhang identifiziert das „Haus“ als Tempel. Die Übersetzung verdeutlicht den Referenten, während die wörtliche Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die architektonische Ausdrucksweise bleibt konkret; die priesterliche Aufgabe wird ohne konfessionelle Fachsprache wiedergegeben.
