source:
  edition: WLC
  text: וְ/חַלּוֹנִ֨ים ל֤/וֹ ו/ל/אילמ/ו סָבִ֣יב סָבִ֔יב כְּ/הַ/חֲלֹּנ֖וֹת הָ/אֵ֑לֶּה חֲמִשִּׁ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/רֹ֕חַב חָמֵ֥שׁ וְ/עֶשְׂרִ֖ים אַמָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/025.yaml
  text: And it had windows all around[a], and its porch also had windows all around, like these windows. The length was fifty cubits, and the width twenty-five cubits.
translation:
  language: de
  text: Es hatte ringsum Fenster, und auch seine Vorhalle[a] hatte ringsum Fenster, wie diese Fenster. Es war fünfzig Ellen lang und fünfundzwanzig Ellen breit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eingangshalle« bzw. »Säulenhalle«; das hebräische Wort אֵילָם ist ein architektonischer Fachbegriff in Hesekiels Tempelvision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים
  choice: Fenster
  rationale: Das Substantiv bezeichnet hier die Fenster beziehungsweise Fensteröffnungen des Torgebäudes; »Fenster« ist im Deutschen die natürliche und im Kontext klare Wiedergabe.
- source_word: לוֹ
  choice: Es hatte
  rationale: Die hebräische Besitzkonstruktion wird idiomatisch wiedergegeben; das Pronomen bezieht sich auf das zuvor beschriebene Torgebäude.
- source_word: וְלְאֵילָמָו
  choice: und auch seine Vorhalle hatte
  rationale: אֵילָם bezeichnet im architektonischen Zusammenhang der Tempelvision eine Vorhalle. Das aus dem Kontext ergänzte »hatte« ergibt einen natürlichen deutschen Satz.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die verdoppelte Wendung bezeichnet eine Anordnung auf allen Seiten; »ringsum« gibt dies knapp und natürlich wieder.
- source_word: כְּהַחֲלֹּנוֹת הָאֵלֶּה
  choice: wie diese Fenster
  rationale: Die Wiedergabe bewahrt sowohl den Vergleich als auch die demonstrative Form des Hebräischen und verweist auf die zuvor beschriebenen Fenster.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: Es war fünfzig Ellen lang
  rationale: Die architektonische Maßangabe wird in einer natürlichen deutschen Prädikativkonstruktion wiedergegeben.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: und fünfundzwanzig Ellen breit
  rationale: Die hebräische Breitenangabe wird unmittelbar und idiomatisch ins moderne Deutsche übertragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Maßeinheit »Elle« bleibt erhalten. Der architektonische Satzbau wurde behutsam geglättet, ohne die Wiederholung von »ringsum« oder den demonstrativen Vergleich zu beseitigen.
