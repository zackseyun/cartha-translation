translation:
  language: de
  text: 'Dann maß er das Torgebäude vom Dach einer Kammer bis zum Dach der gegenüberliegenden: fünfundzwanzig Ellen breit, Eingang gegenüber Eingang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Eingang gegenüber Eingang“; gemeint sind einander gegenüberliegende Eingänge. Das hebräische Wort für „Kammer“ kann in diesem Zusammenhang eine Wachkammer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Wayyiqtol führt die Erzählung fort; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: הַשַּׁעַר
  choice: das Torgebäude
  rationale: Im architektonischen Zusammenhang bezeichnet das Wort die gesamte Toranlage und nicht nur ein Torblatt oder eine Öffnung.
- source_word: מִגַּג הַתָּא לְגַגּוֹ
  choice: vom Dach einer Wachkammer bis zum Dach der gegenüberliegenden
  rationale: תָּא bezeichnet hier eine Kammer innerhalb der Toranlage, wahrscheinlich eine Wachkammer. Der hebräische Ausdruck nennt beim zweiten Dach nur ein singularisches Suffix; „der gegenüberliegenden“ verdeutlicht den durch die Messung und den folgenden Parallelismus naheliegenden Bezug, ohne eine zweite Kammer ausdrücklich im Hebräischen benannt sein zu lassen.
- source_word: רֹחַב
  choice: breit
  rationale: Die nominale Breitenangabe wird nach der Maßzahl idiomatisch als „fünfundzwanzig Ellen breit“ wiedergegeben.
- source_word: עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: fünfundzwanzig Ellen
  rationale: Die Zahl wird in heutiger deutscher Form ausgedrückt; die antike Maßeinheit bleibt erhalten.
- source_word: פֶּתַח נֶגֶד פָּתַח
  choice: Eingang gegenüber Eingang
  rationale: Die knappe Wiederholung bewahrt die räumliche Symmetrie des Hebräischen und bezeichnet einander gegenüberliegende Öffnungen.
