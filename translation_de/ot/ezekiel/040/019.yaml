base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/019.yaml
  text: 'Then he measured the width from the front of the lower gate to the front of the inner court outside: one hundred cubits[b][a], to the east and to the north.'
translation:
  language: de
  text: 'Dann maß er die Breite von der Vorderseite des unteren Tores[a] bis zur Vorderseite des inneren Vorhofs, außen: hundert Ellen[b], im Osten und im Norden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des unteren Torbaus“. Das hebräische Wort kann nicht nur das eigentliche Tor, sondern die gesamte Toranlage bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Maß von hundert Ellen gilt sowohl für die Ostseite als auch für die Nordseite.
    reason: clarification
lexical_decisions:
- source_word: וַיָּמָד
  choice: Dann maß er
  rationale: Das Wayyiqtol führt die nächste Handlung der Visionsschilderung ein; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: רֹחַב
  choice: die Breite
  rationale: Das Substantiv bezeichnet die gemessene räumliche Ausdehnung; „Breite“ ist die direkte und im architektonischen Zusammenhang passende Wiedergabe.
- source_word: מִלִּפְנֵי הַשַּׁעַר הַתַּחְתּוֹנָה
  choice: von der Vorderseite des unteren Tores
  rationale: לִפְנֵי ist hier räumlich gebraucht und bezeichnet den Ausgangspunkt der Messung. „Vorderseite“ vermittelt diesen architektonischen Bezug klar.
- source_word: לִפְנֵי הֶחָצֵר הַפְּנִימִי מִחוּץ
  choice: bis zur Außenseite des inneren Vorhofs
  rationale: Die Wortfolge bezeichnet als Endpunkt den von außen gelegenen Bereich vor dem inneren Vorhof. Die kompakte deutsche Fassung wahrt den architektonischen Sinn, ohne eine unnatürliche Reihung wie „bis vor … außen“ zu erzeugen.
- source_word: מֵאָה אַמָּה
  choice: hundert Ellen
  rationale: Die antike Maßeinheit bleibt erhalten, statt sie mit unsicherer Umrechnung in ein modernes Maß zu übertragen.
- source_word: הַקָּדִים וְהַצָּפוֹן
  choice: im Osten und im Norden
  rationale: Die knappe Richtungsangabe des Hebräischen wird ebenso knapp wiedergegeben; aus dem Zusammenhang ergibt sich, dass dasselbe Maß für beide Seiten gilt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer architektonischer Terminologie. Die knappe Struktur der Maßangabe und die Richtungsangaben des Hebräischen bleiben erhalten.
