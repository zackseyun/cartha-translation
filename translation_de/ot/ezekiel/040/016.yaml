base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/016.yaml
  text: And there were recessed windows toward the guardrooms and toward their side pillars[a], inward, all around the gate; and likewise for the porticos. And windows were all around on the inside[c][b], and on each pillar were palm-tree decorations.
translation:
  language: de
  text: An den Wachkammern und an ihren Seitenpfeilern[b] befanden sich zurückgesetzte Fenster[a], die ringsum nach innen zum Torbau hin ausgerichtet waren; ebenso an den Vorhallen[c]. Auch dort waren auf der Innenseite ringsum Fenster, und an jedem Pfeiler befanden sich Palmenornamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »verschlossene Fenster«, »schmale Fenster« oder »Fenster mit zurückgesetzten Rahmen«. Das hebräische Adjektiv bezeichnet wahrscheinlich eine besondere Bauform und nicht unbedingt Fenster, durch die überhaupt kein Licht dringen konnte.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräischen Bezeichnungen für diese Bauteile des Tores, hier mit »Seitenpfeiler« und »Pfeiler« wiedergegeben, sind schwer zu bestimmen. Möglich sind auch »Pfosten« oder »Pilaster«.
    reason: lexical_alternative
  - marker: c
    text: Für »Vorhallen« sind auch »Vorhallenbauten« oder »Säulenvorhallen« möglich; die genaue Bauform ist nicht sicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלֹּנוֹת
  choice: Fenster
  rationale: Die übliche Bedeutung ist »Fenster«. Im architektonischen Zusammenhang wäre auch »Öffnungen« denkbar, doch »Fenster« ist genauer und entspricht dem wiederholten Gebrauch im Abschnitt.
- source_word: אֲטֻמוֹת
  choice: zurückgesetzt
  rationale: Das Adjektiv bezeichnet hier wahrscheinlich eine besondere Bauform der Fenster. »Zurückgesetzt« vermittelt diesen architektonischen Sinn, ohne wie »verschlossen« irreführend auszuschließen, dass Licht einfiel.
- source_word: הַתָּאִים
  choice: Wachkammern
  rationale: Im Torbau von Ezechiel 40 bezeichnet das Wort die seitlichen Kammern, die im Zusammenhang als Wachkammern verstanden werden können.
- source_word: אֵלֵיהֶמָה
  choice: ihre Seitenpfeiler
  rationale: Das schwierige architektonische Wort bezeichnet seitliche tragende oder vorspringende Bauteile. »Seitenpfeiler« ist verständlich; »Türpfosten« oder »Pilaster« bleiben möglich.
- source_word: לִפְנִימָה
  choice: nach innen / auf der Innenseite
  rationale: Das Adverb gibt die Ausrichtung zum Inneren an. Die beiden kontextgemäßen deutschen Formulierungen bewahren denselben räumlichen Sinn.
- source_word: לַשַּׁעַר
  choice: in den Torbau
  rationale: Gemeint ist hier nicht nur ein Türflügel, sondern die gesamte Toranlage. »Torbau« macht den architektonischen Bezug im Deutschen deutlich.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die Wiederholung verstärkt die umfassende räumliche Aussage. »Ringsum« gibt dies knapp und natürlich wieder.
- source_word: וְכֵן
  choice: ebenso
  rationale: Das Wort überträgt das zuvor beschriebene Baumerkmal auf das nächste Bauteil.
- source_word: אֵלַמּוֹת
  choice: Vorhallen
  rationale: Das Wort bezeichnet hallen- oder vorbauartige Bereiche. »Vorhallen« ist im Deutschen natürlich und lässt die genaue Bauform offen.
- source_word: אַיִל
  choice: Pfeiler
  rationale: 'Der Singular ist wahrscheinlich distributiv zu verstehen: an jedem entsprechenden Bauteil. Das Wort kann je nach Rekonstruktion auch »Pfosten« oder »Pilaster« bedeuten.'
- source_word: תִּמֹרִים
  choice: Palmenornamente
  rationale: Im beschriebenen Bauwerk handelt es sich um bildliche Verzierungen und nicht um lebende Palmen. »Palmenornamente« macht diese Funktion knapp deutlich.
