  text: Its guardrooms[a], its side pillars, and its portico, with windows all around[b], had a length of fifty cubits and a width of twenty-five cubits.
translation:
  language: de
  text: Die Toranlage hatte Wachkammern, Seitenpfeiler[a] und eine Vorhalle[b]; ringsum waren Fenster. Sie war fünfzig Ellen lang und fünfundzwanzig Ellen breit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Türpfosten“ beziehungsweise „Pilaster“. Der hebräische Ausdruck ist ein technischer Begriff der Architektur.
    reason: lexical_alternative
  - marker: b
    text: Oder „Eingangshalle“ beziehungsweise „Vorbau“.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּאָיו
  choice: seine Wachkammern
  rationale: תָּא bezeichnet in der Torarchitektur dieser Vision kleine, dem Tor zugeordnete Kammern; „Wachkammern“ gibt ihre wahrscheinliche Funktion verständlich wieder.
- source_word: אֵלָיו
  choice: seine Seitenpfeiler
  rationale: Der technische Architekturbegriff bezeichnet seitliche Bauteile des Tores. „Seitenpfeiler“ ist verständlich und lässt die genauere Gestalt offen.
- source_word: אֵלַמּוֹ
  choice: seine Vorhalle
  rationale: Der Ausdruck bezeichnet einen vorgelagerten Eingangsbereich; „Vorhalle“ ist im Deutschen natürlich und für die Tempelarchitektur passend.
- source_word: וְחַלּוֹנוֹת לוֹ סָבִיב סָבִיב
  choice: hatten ringsum Fenster
  rationale: Die Formulierung gibt die umlaufende Anordnung der Fenster idiomatisch wieder; das doppelte סָבִיב wird durch „ringsum“ erfasst.
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה
  choice: Es war fünfzig Ellen lang
  rationale: Die hebräische Maßangabe wird in flüssiges deutsches Prosaformat übertragen, ohne die antike Maßeinheit umzurechnen.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: und fünfundzwanzig Ellen breit
  rationale: Die parallele Maßangabe wird knapp und klar wiedergegeben; „Elle“ bewahrt die Maßeinheit des Ausgangstextes.
