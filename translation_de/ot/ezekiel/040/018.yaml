  text: And the pavement was beside the side of the gates[a], corresponding to the length of the gates—the lower pavement.
translation:
  language: de
  text: Und die Pflasterung lag an der Seite der Tore, entsprechend[a] der Länge der Tore – die untere Pflasterung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegenüber der Länge der Tore“. Das hebräische Wort kann sowohl räumliche Entsprechung als auch eine Position gegenüber von etwas bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִצְפָה
  choice: die Pflasterung
  rationale: רִצְפָה bezeichnet eine gepflasterte Fläche. „Pflasterung“ ist im architektonischen Zusammenhang natürlich und lässt sowohl die Fläche als auch ihre bauliche Beschaffenheit erkennen.
- source_word: אֶל כֶּתֶף
  choice: an der Seite
  rationale: כֶּתֶף bedeutet wörtlich „Schulter“, bezeichnet räumlich oder architektonisch aber die Seite beziehungsweise Flanke; אֶל drückt hier die Lagebeziehung aus.
- source_word: הַשְּׁעָרִים
  choice: die Tore
  rationale: Die Pluralform wird bewahrt. Im Zusammenhang sind die Toranlagen gemeint, doch „Tore“ ist verständlich und bleibt nah am hebräischen Ausdruck.
- source_word: לְעֻמַּת
  choice: entsprechend
  rationale: Der Ausdruck kann eine räumliche Entsprechung oder eine gegenüberliegende Position bezeichnen. „Entsprechend“ gibt im Haupttext die Beziehung zwischen Pflasterung und Länge der Tore wieder, ohne eine exakte bauliche Anordnung stärker festzulegen als der Kontext.
- source_word: אֹרֶךְ
  choice: die Länge
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe des Maßbegriffs in der architektonischen Beschreibung.
- source_word: הָרִצְפָה הַתַּחְתּוֹנָה
  choice: die untere Pflasterung
  rationale: תַּחְתּוֹנָה unterscheidet diese gepflasterte Fläche von einer höher gelegenen. Die substantivische Wendung bleibt in der Wiederaufnahme des hebräischen Satzes erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Architektursprache. Das im Hebräischen elliptische Prädikat wird mit „lag“ und in der abschließenden Erläuterung mit „das war“ natürlich ergänzt; die Wiederholung von „Pflasterung“ bewahrt die Hervorhebung des Ausgangstextes.
