  text: Then he brought me into the inner court by way of the east[a], and he measured the gate according to these measurements.
translation:
  language: de
  text: Dann brachte er mich über den östlichen Zugang in den inneren Vorhof, und er maß das Tor[a] nach diesen Maßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Torbau“. Das hebräische Wort שַׁעַר kann sowohl das Tor selbst als auch die größere Toranlage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Dann brachte er mich
  rationale: Das Wayyiqtol von בוא mit Suffix der 1. Person Singular führt die Handlung fort. „Dann“ gibt die erzählerische Abfolge natürlich wieder; „brachte er mich“ bewahrt den kausativen Sinn.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: in den inneren Vorhof
  rationale: חָצֵר bezeichnet hier den Hofbereich der Tempelanlage. „Vorhof“ ist im Deutschen die geläufige, knappe Bezeichnung für einen Tempelhof; הַפְּנִימִי kennzeichnet ihn als den inneren.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: auf dem Weg nach Osten
  rationale: דֶּרֶךְ bezeichnet den Weg beziehungsweise die Zugangsroute, הַקָּדִים den Osten. Die Formulierung bleibt räumlich offen und legt nicht unnötig fest, ob ausschließlich eine Himmelsrichtung oder ein bestimmter östlicher Zugang gemeint ist.
- source_word: וַיָּמָד
  choice: Er maß
  rationale: Das Verb מדד hat im architektonischen Zusammenhang seine gewöhnliche Bedeutung „messen“. Ein neuer deutscher Satz hält die fortlaufende Handlung klar und gut lesbar.
- source_word: הַשַּׁעַר
  choice: das Tor
  rationale: שַׁעַר kann sowohl das eigentliche Tor als auch den umfassenderen Torbau bezeichnen. „Tor“ ist die knappe Standardwiedergabe; die weitere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: entsprechend diesen Maßen
  rationale: כְּ drückt Übereinstimmung oder Vergleich aus, מִדּוֹת bezeichnet Maße beziehungsweise Abmessungen, und הָאֵלֶּה ist der proximale Demonstrativ „diese“. Die Übersetzung wahrt den Rückbezug, ohne einen im Vers nicht ausdrücklich genannten Vergleichsgegenstand einzufügen.
