  text: Its portico faced the outer court[a], and palm trees were on its jambs, and eight steps went up to it.
translation:
  language: de
  text: Seine Vorhalle war dem äußeren Vorhof zugewandt[a]. An seinen Pfeilern waren Palmen, und sein Aufgang hatte acht Stufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Vorhalle lag zum äußeren Vorhof hin.“ Die hebräischen Architekturbegriffe in Hesekiel 40 sind Fachbegriffe und werden unterschiedlich wiedergegeben; für „Pfeiler“ wird auch „Türpfosten“ oder „Pilaster“ übersetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלַמּוֹ
  choice: seine Vorhalle
  rationale: אֵלָם bezeichnet in Hesekiels Tempelvision den vorgelagerten Eingangsbereich. „Vorhalle“ ist im Deutschen natürlich, würdevoll und architektonisch passend.
- source_word: אֶל חָצֵר הַחִיצוֹנָה
  choice: lag zum äußeren Vorhof hin
  rationale: Die Nominalkonstruktion mit direktionalem אֶל beschreibt die Ausrichtung der Vorhalle. Diese Formulierung gibt sie idiomatisch wieder, ohne eine im Hebräischen nicht ausdrücklich genannte Blickrichtung einzutragen.
- source_word: תִמֹרִים
  choice: Palmen
  rationale: Das Wort bezeichnet hier im architektonischen Zusammenhang palmenförmige Verzierungen. „Palmen“ wahrt die knappe konkrete Ausdrucksweise des Hebräischen.
- source_word: אֵילָו
  choice: seine Pfeiler
  rationale: אֵיל bezeichnet in Hesekiel 40 ein seitliches tragendes oder pfeilerartiges Bauelement. „Pfeiler“ ist verständlich und lässt die gegenüber „Türpfosten“ oder „Pilaster“ bestehende fachsprachliche Unsicherheit offen.
- source_word: מַעֲלוֹת שְׁמוֹנֶה
  choice: acht Stufen
  rationale: Die Wendung bezeichnet die Stufen des Aufgangs; „acht Stufen“ ist die präzise und natürliche deutsche Wiedergabe.
- source_word: מַעֲלוֹ
  choice: führten zu ihm hinauf
  rationale: Das abschließende מַעֲלוֹ bezeichnet seinen Aufgang beziehungsweise den Zugang hinauf. Im Deutschen lässt sich die Beziehung der acht Stufen zur Anlage so flüssig ausdrücken.
