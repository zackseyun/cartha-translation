base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/024.yaml
  text: Then he led me by way of the south[a], and behold, there was a gate facing south[b]. He measured its side pillars and its porch according to these measurements.
translation:
  language: de
  text: Dann führte er mich in Richtung Süden, und siehe, dort war ein Tor, das nach Süden ausgerichtet war. Er maß dessen Seitenpfeiler[a] und dessen Vorhalle entsprechend diesen Maßen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder fachsprachlicher: „seine Torpfosten“. Der hebräische Architekturausdruck bezeichnet wahrscheinlich die seitlichen Stütz- oder Begrenzungselemente des Tores.'
    reason: lexical_alternative
  - marker: b
    text: Das heißt, die Maße dieser Bauteile stimmten mit den zuvor beschriebenen überein.
    reason: cross_reference
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: Dann führte er mich
  rationale: Die Hifil-Form von הלך bezeichnet hier das Führen. „Dann“ gibt die erzählerische Abfolge des וַ wieder.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: in Richtung Süden
  rationale: Die wörtliche Wendung „Weg des Südens“ hat hier richtungsweisende Bedeutung; die deutsche Formulierung ist natürlich und wahrt die räumliche Aussage.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: „Siehe“ bewahrt die Aufmerksamkeit lenkende Funktion des hebräischen Ausdrucks in der Visionsschilderung.
- source_word: שַׁעַר דֶּרֶךְ הַדָּרוֹם
  choice: ein Tor, das nach Süden ausgerichtet war
  rationale: Die Wendung bezeichnet die Orientierung des Tores. Die explizite Formulierung ist im architektonischen Zusammenhang eindeutig und natürlich.
- source_word: וּמָדַד
  choice: Er maß
  rationale: Die einfache Vergangenheitsform gibt die fortlaufende Handlung der Erzählung angemessen wieder.
- source_word: אֵילוֹ
  choice: seine Seitenpfeiler
  rationale: Der architektonische Ausdruck bezeichnet wahrscheinlich die seitlichen tragenden oder vorspringenden Bauteile des Tores. „Seitenpfeiler“ ist verständlich, ohne die genaue Bauform stärker festzulegen als der Kontext.
- source_word: וְאֵילַמּוֹ
  choice: und seine Vorhalle
  rationale: אֵילָם bezeichnet im Tempelbau den vorgelagerten Hallen- oder Vorraum; „Vorhalle“ ist im Deutschen verständlich und architektonisch passend.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: entsprechend diesen Maßen
  rationale: Die Formulierung bewahrt sowohl den Vergleich als auch den Demonstrativbezug auf die zuvor genannten Abmessungen.
