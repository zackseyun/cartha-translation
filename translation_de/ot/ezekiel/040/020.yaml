  text: וְ/הַ/שַּׁ֗עַר אֲשֶׁ֤ר פָּנָי/ו֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן לֶ/חָצֵ֖ר הַ/חִֽיצוֹנָ֑ה מָדַ֥ד אָרְכּ֖/וֹ וְ/רָחְבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/020.yaml
  text: As for the gate whose front faced north toward the outer court[a], he measured its length and its width.
translation:
  language: de
  text: Das Tor des äußeren Vorhofs, dessen Vorderseite nach Norden wies,[a] maß er in seiner Länge und Breite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dessen Gesicht nach Norden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשַּׁעַר
  choice: Auch das Tor
  rationale: Das וְ führt im fortlaufenden Baubericht das nächste beschriebene Element ein. „Auch das Tor“ gibt diesen Anschluss und Themenwechsel im Deutschen natürlich wieder.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַצָּפוֹן
  choice: dessen Vorderseite nach Norden zeigte
  rationale: פָּנִים bedeutet wörtlich „Gesicht“, bezeichnet bei einem Bauwerk aber dessen Vorderseite. דֶּרֶךְ mit der Himmelsrichtung drückt die Ausrichtung aus.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: das zum äußeren Vorhof gehörte
  rationale: Das präfigierte לְ kennzeichnet hier am ehesten die räumliche Zuordnung des Tores zum äußeren Vorhof. Die Formulierung vermeidet die missverständliche Aussage, die bereits nach Norden gerichtete Vorderseite sei zugleich auf den Vorhof gerichtet.
- source_word: מָדַד
  choice: maß er
  rationale: Das Subjekt ist der zuvor eingeführte messende Mann; im Deutschen wird es durch das Pronomen ausdrücklich aufgenommen.
- source_word: אָרְכּוֹ וְרָחְבּוֹ
  choice: in seiner Länge und Breite
  rationale: Die beiden Substantive bezeichnen die Längs- und Querabmessung des Tores. Die adverbiale deutsche Fügung ist idiomatisch und bewahrt beide Größenangaben.
