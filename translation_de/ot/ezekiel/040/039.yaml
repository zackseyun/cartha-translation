base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/039.yaml
  text: And in the portico of the gate were two tables on this side and two tables on that side[a], on which they slaughtered the burnt offering, the sin offering[b], and the guilt offering.
translation:
  language: de
  text: Und in der Vorhalle des Tores standen auf der einen Seite zwei Tische und auf der anderen Seite zwei Tische, um darauf das Brandopfer, das Sündopfer[a] und das Schuldopfer[b] zu schlachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort kann das Opfer bezeichnen, das der Reinigung von Sünde oder Unreinheit dient.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wiedergutmachungsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֻלָם הַשַּׁעַר
  choice: Und in der Vorhalle des Tores
  rationale: אֻלָם bezeichnet den vorgelagerten Hallen- oder Vorraum eines Bauwerks. „Vorhalle“ ist im Deutschen natürlich, architektonisch passend und weniger fremdsprachlich als „Portikus“.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת מִפּוֹ וּשְׁנַיִם שֻׁלְחָנוֹת מִפֹּה
  choice: standen auf der einen Seite zwei Tische und auf der anderen Seite zwei Tische
  rationale: Die Wendung מִפּוֹ ... מִפֹּה beschreibt hier die beidseitige räumliche Anordnung. Die Wiederholung von „zwei Tische“ bewahrt den vermessenden, architektonischen Stil.
- source_word: לִשְׁחֹט אֲלֵיהֶם
  choice: Auf ihnen sollte man ... schlachten
  rationale: אֲלֵיהֶם verweist auf die Tische; der Infinitiv לִשְׁחֹט bezeichnet ihren vorgesehenen Gebrauch. „Sollte man“ gibt diese Zweckbestimmung wieder, ohne ein im Hebräischen nicht genanntes konkretes Subjekt einzuführen.
- source_word: הָעוֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die geläufige und sachlich genaue deutsche Bezeichnung für עוֹלָה im Opferkontext.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: חַטָּאת bezeichnet hier eine Opferart. „Sündopfer“ ist die etablierte deutsche Wiedergabe; die ebenfalls sachlich begründete Deutung als Reinigungsopfer wird in einer Fußnote bewahrt.
- source_word: הָאָשָׁם
  choice: das Schuldopfer
  rationale: אָשָׁם bezeichnet im kultischen Zusammenhang ein Opfer wegen Schuld, oft mit Wiedergutmachungsaspekt. „Schuldopfer“ ist die herkömmliche prägnante Wiedergabe; die Alternative steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe der kultischen Opferbegriffe ohne spätere dogmatische Ausdeutung
  choice: Brandopfer, Sündopfer und Schuldopfer
  alternative: Brandopfer, Reinigungsopfer und Wiedergutmachungsopfer
  rationale: Der Vers nennt Opferkategorien innerhalb der Tempelvision. Die Hauptfassung verwendet die im Deutschen etablierten Begriffe, während die möglichen Reinigungs- und Wiedergutmachungsnuancen von חַטָּאת und אָשָׁם in Fußnoten erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe, vermessende Baustil des hebräischen Textes bleibt durch die symmetrische Wiederholung erhalten; kultische Fachbegriffe werden verständlich und traditionsnah wiedergegeben.
