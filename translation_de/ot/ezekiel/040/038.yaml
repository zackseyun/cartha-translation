  text: There was a chamber with its doorway by the gateposts of the gates[a]; there they would rinse the burnt offering.
translation:
  language: de
  text: An den Torpfeilern[a] der Tore befand sich eine Kammer mit ihrem Eingang; dort spülte man das Brandopfer ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier mit „Torpfeiler“ wiedergegebene hebräische Architekturausdruck kann auch Vorhallen, vorspringende Pfeiler oder ein ähnliches Bauteil der Toranlage bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁכָּה
  choice: eine Kammer
  rationale: לשכה bezeichnet einen Raum innerhalb eines größeren Tor- oder Tempelkomplexes. „Kammer“ gibt den architektonischen Zusammenhang präzise und würdig wieder.
- source_word: וּפִתְחָהּ
  choice: mit ihrem Eingang
  rationale: פתח mit dem Suffix der 3. Person Femininum Singular bezeichnet den Eingang der Kammer. „Mit ihrem Eingang“ gibt die Verbindung im Deutschen natürlich wieder.
- source_word: בְּאֵילִים
  choice: bei den Torpfeilern
  rationale: אֵילִים ist hier ein nicht eindeutig bestimmbarer architektonischer Fachausdruck. „Torpfeiler“ ist verständlich und passt zum Torkomplex; mögliche Alternativen werden in der Fußnote genannt.
- source_word: הַשְּׁעָרִים
  choice: der Tore
  rationale: Die Pluralform wird beibehalten und bezeichnet wahrscheinlich die Toranlagen des geschauten Tempelkomplexes.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist unmittelbar auf die zuvor beschriebene Kammer beziehungsweise ihren Standort.
- source_word: יָדִיחוּ
  choice: wusch man ab
  rationale: Der Hifil von דוח bezeichnet hier das Ab- oder Auswaschen im Rahmen der Opferzubereitung. Das unpersönliche „man“ gibt das nicht ausdrücklich genannte Subjekt idiomatisch wieder; das Präteritum passt zum erzählenden Visionsbericht.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עלה ist der übliche kultische Ausdruck für das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte deutsche Entsprechung.
