id: EZK.15.6
reference: Ezekiel 15:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה כַּ/אֲשֶׁ֤ר עֵץ הַ/גֶּ֨פֶן֙ בְּ/עֵ֣ץ הַ/יַּ֔עַר אֲשֶׁר נְתַתִּ֥י/ו לָ/אֵ֖שׁ לְ/אָכְלָ֑ה כֵּ֣ן נָתַ֔תִּי אֶת יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/006.yaml
  text: 'Therefore thus says the Lord GOD: As the wood of the vine among the trees of the forest[a], which I have given to the fire for fuel, so I have given the inhabitants of Jerusalem.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Yahweh: Wie das Holz des Weinstocks unter den Bäumen des Waldes, das ich dem Feuer zum Verbrennen gegeben habe[a], so habe ich die Bewohner Jerusalems dahingegeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dem Feuer zum Verzehr“; gemeint ist: damit es vollständig verbrannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Anwendung des vorausgehenden Vergleichs ein; „Darum“ ist knapp, natürlich und logisch eindeutig.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Die übliche deutsche Wiedergabe der prophetischen Botenformel bewahrt ihren feierlichen, aber nicht altertümlichen Klang.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „Yahweh“ den im hebräischen Text stehenden Gottesnamen erkennbar erhält und eine Verdoppelung zu „Herr HERR“ vermeidet.
- source_word: עֵץ הַגֶּפֶן
  choice: das Holz des Weinstocks
  rationale: עֵץ bezeichnet im Zusammenhang den Werk- beziehungsweise Brennstoff; „Holz des Weinstocks“ erhält das konkrete Bild.
- source_word: בְּעֵץ הַיַּעַר
  choice: unter den Bäumen des Waldes
  rationale: Die Präposition ב wird hier als Einordnung innerhalb der Waldbäume verstanden. „Unter“ gibt diesen Vergleich natürlich wieder, ohne den Weinstock selbst zu einem typischen Waldbaum zu erklären.
- source_word: נְתַתִּיו לָאֵשׁ לְאָכְלָה
  choice: das ich dem Feuer zum Verbrennen gegeben habe
  rationale: Die Formulierung wahrt das Bild einer endgültigen Übergabe an das Feuer. „Zum Verbrennen“ gibt den gemeinten Vorgang idiomatisch wieder; die wörtlichere Vorstellung des Verzehrens wird in der Fußnote genannt.
- source_word: כֵּן נָתַתִּי
  choice: so habe ich … dahingegeben
  rationale: „So“ eröffnet den Folgesatz des Vergleichs. „Dahingegeben“ macht im Deutschen die gerichtliche Auslieferung deutlich, die im Kontext mit dem einfachen Verb נתן verbunden ist, und das Perfekt stellt sie als vollzogen dar.
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  choice: die Bewohner Jerusalems
  rationale: Dies ist eine natürliche kollektive Wiedergabe der substantivierten Partizipialform „die in Jerusalem Wohnenden“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה in der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Der Ausgangstext enthält sowohl den Titel אֲדֹנָי als auch den Eigennamen יְהוִה. Die Übersetzung bildet beide unterscheidbar ab, statt den Namen durch einen zweiten Titel zu ersetzen.
- issue: Zeitliche und rhetorische Kraft von נָתַתִּי im Gerichtswort
  choice: so habe ich … dahingegeben
  alternative: so gebe ich … dahin; so werde ich … dahingeben
  rationale: Das hebräische Perfekt stellt die Übergabe als entschiedene beziehungsweise bereits vollzogene Handlung dar. Die deutsche Perfektform bewahrt diese Spannung, ohne sie ausdrücklich nur auf Gegenwart oder Zukunft festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener prophetischer Formel. Die Satzparallelität „Wie …, so …“ bildet den hebräischen Vergleich nach. „Yahweh“ bleibt als Gottesname sichtbar; „dahingegeben“ bringt die im Kontext gerichtliche Verwendung von נתן idiomatisch zum Ausdruck.
