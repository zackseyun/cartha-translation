  source_fidelity: 'Die Übersetzung bildet die Struktur des hebräischen Vergleichs präzise ab: die Folgerung „Darum“, die Botenformel, das Weinstockholz innerhalb der Waldbäume, die Übergabe an das Feuer und die entsprechende Übergabe der Einwohner Jerusalems. Die beiden Perfektformen werden im Deutschen sinnvoll als Perfekt wiedergegeben. „Dahingegeben“ ist im Gerichtskontext eine vertretbare, idiomatische Wiedergabe von נתן und wahrt die entschiedene Vollzugsnuance, ohne eine bestimmte zeitliche Auslegung aufzuzwingen.'
