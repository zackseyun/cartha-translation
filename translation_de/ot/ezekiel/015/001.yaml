lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: In der festen prophetischen Einleitungsformel ist „das Wort … erging an mich“ idiomatisches, würdevolles Deutsch und gibt das Eintreten der göttlichen Mitteilung wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier eine göttliche Mitteilung. „Das Wort“ bewahrt die wiederkehrende prophetische Formel und ihre theologische Aussagekraft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit „erging“ ist „an mich“ die natürliche deutsche Wiedergabe der Präposition mit dem Suffix der ersten Person.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle ersetzende Lesung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel bleibt erkennbar; לֵאמֹר wird entsprechend natürlicher deutscher Erzählweise durch den Doppelpunkt ausgedrückt.
