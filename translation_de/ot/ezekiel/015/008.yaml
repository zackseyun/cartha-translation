- from: Und ich werde das Land zur Einöde machen, weil sie treulos gehandelt haben[a] – so lautet der Ausspruch Gottes, des HERRN.[b]
  to: Und ich werde das Land zur Einöde machen, weil sie treulos gehandelt haben[a] – Ausspruch des Herrn Jahwe.[b]
  rationale: Die Revision beschränkt sich auf den Gottesnamen und die dazugehörige Anmerkung. Sie wahrt die traditionelle, sachlich genaue Satzstruktur des Entwurfs, gibt aber die im Hebräischen ausdrücklich vorhandene Namenskomponente und die im englischen Audit-Trail dokumentierte Entscheidung transparent wieder. Die Formulierung zur Treulosigkeit bleibt bewusst allgemein, damit keine konkrete Art des Treuebruchs in den Text eingetragen wird.
