source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אֶת הָ/אָ֖רֶץ שְׁמָמָ֑ה יַ֚עַן מָ֣עֲלוּ מַ֔עַל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/008.yaml
  text: And I will make the land a desolation[a], because they have acted unfaithfully[b], declares the Lord GOD.
translation:
  language: de
  text: Und ich werde das Land zur Einöde machen, weil sie treulos gehandelt haben[a] – Ausspruch des Herrn Jahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „einen Treuebruch begangen“ oder „sich als treulos erwiesen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Herr JHWH“ (Adonai JHWH); der Gottesname JHWH wird hier als „Jahwe“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … machen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, stellen“, bezeichnet hier mit „das Land“ und dem Prädikatsnomen „Einöde“ aber idiomatisch das Versetzen in einen Zustand; „machen“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet in diesem Gerichtskontext das betroffene Territorium, nicht die gesamte Erde.
- source_word: שְׁמָמָה
  choice: zur Einöde
  rationale: Das Substantiv bezeichnet einen Zustand völliger Verödung. Die Wendung „zur Einöde machen“ bewahrt die nominale Ausdrucksweise und ist zugleich idiomatisches Deutsch.
- source_word: יַעַן
  choice: weil
  rationale: יַעַן leitet den Grund für das angekündigte Gericht ein; „weil“ ist die klare, natürliche kausale Entsprechung.
- source_word: מָעֲלוּ מַעַל
  choice: sie treulos gehandelt haben
  rationale: Die Verbindung aus Verb und zugehörigem Substantiv verstärkt den Gedanken eines Treuebruchs. „Treulos gehandelt“ wahrt den Beziehungs- und Bundesbezug, ohne im Deutschen künstlich zu wirken.
- source_word: נְאֻם
  choice: so lautet der Ausspruch
  rationale: נְאֻם kennzeichnet eine feierliche prophetische Erklärung. „Ausspruch“ bildet die nominale Form ab; die Gesamtwendung bleibt in modernem Deutsch verständlich.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die traditionelle deutsche Wiedergabe vermeidet die missverständliche Doppelung „Herr HERR“ und zeigt durch „HERR“ an, dass im Hebräischen der Gottesname JHWH steht.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr JHWH / Herr Jahwe
  rationale: „Gott, der HERR“ ist im Deutschen eine verständliche und ehrfürchtige Wiedergabe der Verbindung von אֲדֹנָי mit dem Gottesnamen. Die Fußnote legt die hebräische Form offen, ohne eine bestimmte Aussprache des Tetragramms im Haupttext festzuschreiben.
- issue: Charakter der mit מָעֲלוּ מַעַל bezeichneten Schuld
  choice: treulos gehandelt
  alternative: einen Treuebruch begangen
  rationale: Die Formulierung lässt den im Hebräischen anklingenden Treue- beziehungsweise Bundesbruch erkennen, legt aber nicht über den Text hinaus fest, welche konkrete Verfehlung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Ursache-Gericht-Zusammenhang, während „zur Einöde machen“ und „treulos gehandelt“ natürlich und allgemein verständlich formuliert sind.
