  text: הִנֵּ֥ה לָ/אֵ֖שׁ נִתַּ֣ן לְ/אָכְלָ֑ה אֵת֩ שְׁנֵ֨י קְצוֹתָ֜י/ו אָכְלָ֤ה הָ/אֵשׁ֙ וְ/תוֹכ֣/וֹ נָחָ֔ר הֲ/יִצְלַ֖ח לִ/מְלָאכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/004.yaml
  text: Look[a], it is given to the fire for fuel. The fire has consumed both of its ends, and its middle is charred[b]. Is it fit for any work?
translation:
  language: de
  text: Sieh, es wird dem Feuer zum Fraß[a] übergeben. Das Feuer hat seine beiden Enden verzehrt, und seine Mitte ist verkohlt. Wird es zu irgendeiner Arbeit taugen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zum Essen«; das Feuer wird als etwas dargestellt, das das Holz frisst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wird es sich für irgendeine Arbeit eignen?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die hinweisende, Aufmerksamkeit weckende Funktion in knapper, heutiger Sprache.
- source_word: לָאֵשׁ נִתַּן
  choice: wird dem Feuer … übergeben
  rationale: Gibt die Zielrichtung der Präposition und das Passiv von נתן wieder, ohne einen Handelnden hinzuzufügen.
- source_word: לְאָכְלָה
  choice: zum Verzehr
  rationale: Bewahrt das hebräische Bild des Feuers, das das Holz gleichsam frisst, und ist im Deutschen zugleich verständlich.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: seine beiden Enden
  rationale: Gibt die ausdrücklich genannten zwei Enden natürlich und genau wieder.
- source_word: אָכְלָה הָאֵשׁ
  choice: Das Feuer hat … verzehrt
  rationale: Das Verb אכל wird vom Feuer im Sinn von konsumieren beziehungsweise verzehren gebraucht; das Perfekt betont das eingetretene Ergebnis.
- source_word: וְתוֹכוֹ נָחָר
  choice: und seine Mitte ist verkohlt
  rationale: תוֹךְ bezeichnet hier die Mitte des Holzstücks; נחר beschreibt dessen durch Hitze verbrannten beziehungsweise angesengten Zustand.
- source_word: הֲיִצְלַח לִמְלָאכָה
  choice: Wird es noch zu irgendeiner Arbeit taugen?
  rationale: Im Zusammenhang fragt צלח nach Brauchbarkeit oder Eignung, nicht allgemein nach Erfolg; מלאכה bezeichnet praktische Arbeit oder Verwendung.
theological_decisions: []
