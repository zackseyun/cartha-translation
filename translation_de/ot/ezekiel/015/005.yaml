  text: הִנֵּה֙ בִּֽ/הְיוֹת֣/וֹ תָמִ֔ים לֹ֥א יֵֽעָשֶׂ֖ה לִ/מְלָאכָ֑ה אַ֣ף כִּי אֵ֤שׁ אֲכָלַ֨תְ/הוּ֙ וַ/יֵּחָ֔ר וְ/נַעֲשָׂ֥ה ע֖וֹד לִ/מְלָאכָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
translation:
  language: de
  text: 'Sieh: Schon als das Holz noch unversehrt[a] war, konnte man nichts Brauchbares daraus machen. Wie viel weniger[b] kann man noch etwas Brauchbares daraus machen, nachdem das Feuer es verzehrt hat und es verkohlt[c] ist?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heil“ oder „vollständig“. Gemeint ist das Holz vor seiner Beschädigung durch Feuer.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich sinngemäß: „wie viel weniger“ — ein Schluss vom Geringeren zum Größeren: War das Holz schon unversehrt unbrauchbar, so ist es das nach dem Brand erst recht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „angesengt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Nachdruck des hebräischen Ausdrucks in knapper, würdiger Gegenwartssprache.
- source_word: בִּהְיוֹתוֹ תָמִים
  choice: als das Holz noch unversehrt war
  rationale: Die Infinitivkonstruktion ist temporal; תָמִים bezeichnet hier den körperlich unbeschädigten Zustand. „Das Holz“ wird aus dem unmittelbaren Bildzusammenhang ergänzt, um den deutschen Bezug eindeutig zu machen.
- source_word: לֹא יֵעָשֶׂה לִמְלָאכָה
  choice: konnte man nichts Brauchbares daraus machen
  rationale: Das Nifal von עשה bezeichnet hier das Verarbeiten zu einem nützlichen Gegenstand. Die unpersönliche Formulierung gibt den praktischen Sinn im Deutschen natürlich wieder.
- source_word: אַף כִּי
  choice: Wie viel weniger
  rationale: 'Kennzeichnet den Schluss vom Geringeren zum Größeren: Wenn schon unversehrtes Rebholz unbrauchbar war, gilt dies erst recht nach dem Brand.'
- source_word: אֵשׁ אֲכָלַתְהוּ
  choice: das Feuer es verzehrt hat
  rationale: „Verzehren“ ist eine natürliche deutsche Wiedergabe des bildhaften „Essens“ durch Feuer und bezeichnet die bereits eingetretene Brandschädigung.
- source_word: וַיֵּחָר
  choice: es verkohlt ist
  rationale: Gibt den durch Hitze verbrannten beziehungsweise angesengten Zustand präzise wieder, ohne vollständige Vernichtung vorauszusetzen.
- source_word: וְנַעֲשָׂה עוֹד לִמְלָאכָה
  choice: kann man noch etwas Brauchbares daraus machen
  rationale: Die rhetorische Frage wird im Deutschen idiomatisch wiedergegeben; „noch“ entspricht עוֹד und die Wiederholung wahrt die Logik des Verses.
theological_decisions:
- issue: Deutung des Bildes
  choice: Der Vers bleibt bei der rhetorischen Aussage über die Nutzlosigkeit des verbrannten Rebholzes.
  alternative: Jerusalem oder Juda bereits im Vers ausdrücklich mit dem Holz gleichsetzen.
  rationale: Der weitere Zusammenhang erklärt den Bildbezug; dieser Vers selbst formuliert jedoch nur das Bild. Die Übersetzung soll die Metapher nicht vorzeitig auslegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Steigerung und das konkrete Holzbild bleiben erhalten; „Brauchbares“ vermittelt den handwerklich-praktischen Sinn von מְלָאכָה, ohne einen bestimmten Gegenstand einzutragen.
