  yaml_path: translation/ot/ezekiel/015/002.yaml
  text: Son of man[a], how is the wood of the vine better than any wood, the branch that is among the trees of the forest?
translation:
  language: de
  text: Menschensohn, was hat das Holz des Weinstocks jedem anderen Holz voraus – die Ranke, die zwischen den Bäumen des Waldes wächst?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Was ist das Holz des Weinstocks mehr als jedes Holz, die Ranke, die zwischen den Bäumen des Waldes war?“ Das Hebräische ist elliptisch und vergleichend.'
    reason: Die wörtliche Satzform ist mehrdeutig und im Deutschen schwer verständlich; die Hauptübersetzung gibt den naheliegenden vergleichenden Sinn wieder.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste prophetische Anrede im Buch Ezechiel wird als vertraute hebräische Wendung bewahrt; hier bezeichnet sie den angesprochenen Propheten.
- source_word: מַה יִּהְיֶה
  choice: was hat … voraus
  rationale: Die elliptische Frage ist im Zusammenhang vergleichend gemeint und fragt nach einem Vorzug oder höheren Nutzen des Weinstockholzes.
- source_word: עֵץ הַגֶּפֶן
  choice: das Holz des Weinstocks
  rationale: Die Formulierung hält den Blick ausdrücklich auf dem Holz als Werkstoff, was für das Bild in den folgenden Versen entscheidend ist.
- source_word: מִכָּל עֵץ
  choice: jedem anderen Holz
  rationale: מִן bezeichnet hier den Vergleich; „anderem“ macht den im Deutschen notwendigen Bezug deutlich, ohne den Sinn zu erweitern.
- source_word: הַזְּמוֹרָה
  choice: die Ranke
  rationale: זְמוֹרָה bezeichnet einen Trieb oder Zweig des Weinstocks. „Ranke“ ist im Deutschen natürlich und hält die Verbindung zum Weinstock deutlich.
- source_word: אֲשֶׁר הָיָה בַּעֲצֵי הַיָּעַר
  choice: die zwischen den Bäumen des Waldes wächst
  rationale: Das hebräische Perfekt steht in einer allgemeinen Beschreibung. Das deutsche Präsens und „wächst“ geben die Lage der Ranke idiomatisch wieder.
