base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/003.yaml
  text: Is wood taken from it to make anything useful? Or do they take from it a peg to hang every kind of vessel on it?[a][b][c]
translation:
  language: de
  text: Nimmt man davon Holz, um etwas Brauchbares daraus zu machen?[a] Oder nimmt man davon einen Pflock,[b] um irgendeinen Gegenstand daran aufzuhängen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „um etwas für eine Arbeit herzustellen“. Gemeint ist etwas, das einem praktischen Zweck dient.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann je nach Zusammenhang auch „Zapfen“, „Nagel“ oder „Pfahl“ bedeuten; hier ist eine feste Halterung zum Aufhängen gemeint.
    reason: lexical_alternative
  - marker: c
    text: „Gegenstand“ gibt hier einen weiten hebräischen Begriff wieder, der auch ein Gefäß, Gerät, Werkzeug oder anderes Gebrauchsobjekt bezeichnen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֻקַּח מִמֶּנּוּ עֵץ
  choice: Nimmt man davon Holz
  rationale: Die rhetorische Passivfrage wird im Deutschen idiomatisch mit unpersönlichem „man“ wiedergegeben. „Davon“ bewahrt den Rückverweis auf das Rebholz im vorigen Kontext, ohne ihn im Vers auszudeuten.
- source_word: לַעֲשׂוֹת לִמְלָאכָה
  choice: um etwas Brauchbares daraus zu machen
  rationale: Die Wendung verbindet das Herstellen mit einem praktischen Zweck bzw. Gebrauch. „Etwas Brauchbares“ bringt diese ausdrücklich durch מְלָאכָה markierte Nutzbarkeit natürlich zum Ausdruck.
- source_word: אִם יִקְחוּ
  choice: Oder nimmt man
  rationale: אִם leitet hier die parallele zweite rhetorische Frage ein; „Oder“ bildet diese Funktion im Deutschen klar ab. Das unbestimmte Subjekt des hebräischen Plurals wird idiomatisch als „man“ formuliert.
- source_word: יָתֵד
  choice: einen Pflock
  rationale: יָתֵד bezeichnet einen Pflock, Zapfen oder Nagel. „Pflock“ wahrt das konkrete Bild einer festen Halterung, an der etwas aufgehängt werden kann.
- source_word: לִתְלוֹת עָלָיו
  choice: daran aufzuhängen
  rationale: „Daran“ gibt den Rückbezug auf den Pflock knapp und natürlich wieder; „aufhängen“ entspricht der konkreten Bedeutung von תלה.
- source_word: כָּל כֶּלִי
  choice: irgendeinen Gegenstand
  rationale: כְּלִי ist ein weiter Sammelbegriff für Gefäß, Gerät, Werkzeug oder sonstigen Gebrauchsgegenstand. In der verneinend-rhetorischen Frage gibt כָּל idiomatisch den Sinn „irgendein“ wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen rhetorischen Fragen bleiben erhalten. Das unpersönliche „man“ vermeidet im Deutschen ein künstliches Passiv und entspricht dem nicht näher bestimmten Handelnden. „Etwas Brauchbares“ bewahrt den Gebrauchssinn von מְלָאכָה; „irgendeinen Gegenstand“ gibt die breite, kontextabhängige Bedeutung von כְּלִי in natürlichem Deutsch wieder.
