source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בָּ/הֶ֔ם מֵ/הָ/אֵ֣שׁ יָצָ֔אוּ וְ/הָ/אֵ֖שׁ תֹּֽאכְלֵ֑/ם וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/שׂוּמִ֥/י אֶת פָּנַ֖/י בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/007.yaml
  text: And I will set my face against them[a]. They have come out from the fire, but the fire will consume them. Then you will know that I am Yahweh[b], when I set my face against them.
translation:
  language: de
  text: Und ich werde mein Angesicht gegen sie richten.[a] Aus dem Feuer sind sie herausgekommen, doch das Feuer wird sie verzehren.[b] Dann werdet ihr erkennen, dass ich Jahwe bin, wenn ich mein Angesicht gegen sie richte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräische Redewendung für entschlossene Gegnerschaft und Gericht.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »Aus dem Feuer kamen sie heraus, und das Feuer wird sie verzehren.« Das Hebräische stellt das Herauskommen aus dem Feuer der dennoch folgenden Vernichtung durch Feuer gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־פָּנַי בָּהֶם
  choice: Und ich werde mein Angesicht gegen sie richten
  rationale: Die Verbindung von נתן mit פנים und ב bezeichnet entschlossene Gegnerschaft. Die deutsche Wendung bewahrt das hebräische Bild und klingt zugleich natürlich und würdevoll.
- source_word: מֵהָאֵשׁ יָצָאוּ
  choice: Aus dem Feuer sind sie herausgekommen
  rationale: יצא bezeichnet das Herauskommen, ohne zwingend eine endgültige Rettung auszudrücken. Das Perfekt wird als abgeschlossener Vorgang wiedergegeben.
- source_word: וְהָאֵשׁ תֹּאכְלֵם
  choice: doch das Feuer wird sie verzehren
  rationale: אכל bedeutet bei Feuer als Subjekt »verzehren«. »Doch« macht den im Zusammenhang liegenden Gegensatz deutlich, ohne ihn sachlich zu erweitern.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Die Form bezeichnet hier die Erkenntnis als Folge des angekündigten Gerichts. »Erkennen« gibt ידע in der prophetischen Erkenntnisformel angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּשׂוּמִי אֶת־פָּנַי בָּהֶם
  choice: wenn ich mein Angesicht gegen sie richte
  rationale: ב mit dem Infinitivkonstrukt wird temporal verstanden. Die Wiederholung derselben Wendung erhält die rhetorische Rahmung des Verses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« wahrt seinen Charakter als Eigenname.
- issue: Gerichtsformel »das Angesicht gegen jemanden richten«
  choice: Das Bild im Haupttext bewahren
  alternative: mich gegen sie stellen
  rationale: Die bildhafte prophetische Formel drückt entschlossene Gegnerschaft und Gericht aus. Ihre Beibehaltung bewahrt die literarische und theologische Spannung.
- issue: Verhältnis der beiden Feueraussagen
  choice: Kontrastiv mit »doch« wiedergeben
  alternative: mit bloßem »und« verbinden
  rationale: 'Das hebräische ו kann den aus dem Zusammenhang klaren Gegensatz tragen: Das Herauskommen aus dem Feuer bedeutet keine endgültige Rettung, denn Feuer wird sie dennoch verzehren.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Die anschauliche Wendung »mein Angesicht gegen sie richten« sowie die Wiederholung am Versende bleiben erhalten; der Gegensatz der Feueraussagen wird ohne zusätzliche Deutung verständlich gemacht.
