  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י אִ֧ישׁ כִּ/דְרָכָ֛י/ו אֶשְׁפּ֥וֹט אֶתְ/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽלפ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/020.yaml
  text: Yet you say[a], ‘The way of the Lord is not just.’ I will judge each of you according to his ways[b], O house of Israel.
translation:
  language: de
  text: 'Doch ihr sagt[a]: »Der Weg des Herrn ist nicht gerecht.« Jeden von euch werde ich nach seinen Wegen richten[b], Haus Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Weg des Herrn ist nicht recht« oder »ist nicht fair«. Der hebräische Ausdruck betrifft die Frage, ob Gottes Weise zu richten als gerecht und angemessen gilt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Mann, entsprechend seinen Wegen«. Israel wird als Ganzes angeredet, doch das Urteil gilt jedem Einzelnen entsprechend seinem Verhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Doch ihr sagt
  rationale: Das Waw führt den Einwand Israels im Gegensatz zur vorausgehenden Rechtfertigung Gottes weiter; »doch« gibt diesen adversativen Zusammenhang natürlich wieder.
- source_word: לֹא יִתָּכֵן
  choice: ist nicht gerecht
  rationale: Der Niphal von תכן bezeichnet in dieser Wendung etwas als nicht recht, angemessen oder ausgewogen. Im Gerichtskontext trifft »nicht gerecht« den rechtlich-moralischen Sinn.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: der Weg des Herrn
  rationale: »Weg« bewahrt die hebräische Metapher für Handlungsweise oder Vorgehen; אֲדֹנָי wird als göttlicher Titel mit »Herr« wiedergegeben.
- source_word: אִישׁ כִּדְרָכָיו
  choice: jeden von euch … nach seinen Wegen
  rationale: אִישׁ hat hier distributive Kraft. Die Formulierung betont die persönliche Verantwortung jedes Einzelnen, während der Plural »Wegen« die hebräische Form und den Sinn von Verhaltensweisen wahrt.
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: werde ich … richten
  rationale: שׁפט ist hier forensisch gebraucht. Die deutsche Wortstellung verbindet das Verb natürlich mit der vorangestellten distributiven Ergänzung.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die Wendung ist eine direkte Anrede an Israel als Gemeinschaft und bleibt in ihrer biblisch vertrauten, würdevollen Form erhalten.
theological_decisions:
- issue: Vorwurf gegen die Gerechtigkeit von Gottes Gericht
  choice: Der Weg des Herrn ist nicht gerecht
  alternative: Der Weg des Herrn ist nicht recht / nicht angemessen
  rationale: Der Kontext betrifft die Gerechtigkeit von Gottes Urteil. »Nicht gerecht« bewahrt den moralisch-forensischen Gehalt, ohne den Vorwurf weiter auszudeuten.
- issue: Individuelle Verantwortung innerhalb der gemeinschaftlichen Anrede
  choice: Jeden von euch werde ich nach seinen Wegen richten
  alternative: Ich werde euch jeden nach seinen Wegen richten / Ich werde jeden Mann nach seinen Wegen richten
  rationale: Das Hebräische verbindet das kollektiv angeredete Haus Israel mit dem distributiven Singular אִישׁ und dem singularischen Pronomen in »seinen Wegen«. Die gewählte Fassung erhält diese Spannung in natürlichem Deutsch, ohne אִישׁ hier unnötig als geschlechtsspezifisches »Mann« misszuverstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede vom »Weg« und von den »Wegen« bewahrt bewusst die hebräische Bildsprache; »Haus Israel« erhält die kollektive prophetische Anrede.
