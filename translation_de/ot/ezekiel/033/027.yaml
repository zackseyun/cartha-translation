  terminology: „der Herr Yahweh“ bildet אֲדֹנָי יְהוִה unter Beibehaltung von „Yahweh“ nachvollziehbar ab. „Schwert“, „wilde Tiere“, „Seuche“ und „zum Fraß gegeben“ entsprechen dem Register und Sinn des Hebräischen. Die Fußnote zu den Ruinen sollte keine mit dem Haupttext identische Alternative aufführen.
