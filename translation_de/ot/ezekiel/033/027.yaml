source:
  edition: WLC
  text: כֹּֽה תֹאמַ֨ר אֲלֵ/הֶ֜ם כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֞א אֲשֶׁ֤ר בֶּֽ/חֳרָבוֹת֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וַֽ/אֲשֶׁר֙ עַל פְּנֵ֣י הַ/שָּׂדֶ֔ה לַ/חַיָּ֥ה נְתַתִּ֖י/ו לְ/אָכְל֑/וֹ וַ/אֲשֶׁ֛ר בַּ/מְּצָד֥וֹת וּ/בַ/מְּעָר֖וֹת בַּ/דֶּ֥בֶר יָמֽוּתוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
translation:
  language: de
  text: 'So sollst du zu ihnen sagen: »So spricht der Herr Yahweh: So wahr ich lebe: Diejenigen, die sich in den Trümmern[a] aufhalten, werden durch das Schwert fallen. Wer sich auf freiem Feld befindet, den habe ich den wilden Tieren zum Fraß gegeben[b]. Und diejenigen, die sich in den Festungen und Höhlen aufhalten, werden an der Seuche[c] sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den verwüsteten Orten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Den habe ich dem Wildtier zum Fressen gegeben.« Der Singular kann hier verteilende Bedeutung haben.'
    reason: source_ambiguity
  - marker: c
    text: 'Oder: »an der Pest«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמַר ... כֹּה אָמַר
  choice: 'Darum sollst du ... sagen: »So spricht ...«'
  rationale: Bewahrt die prophetische Botenformel in natürlichem, würdigem Deutsch. Das einleitende כֹּה wird idiomatisch mit »Darum« wiedergegeben, während כֹּה אָמַר als feste Formel »So spricht« erscheint.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: 'Gibt beide Bestandteile des hebräischen Gottesnamens wieder: den Titel אֲדֹנָי und den Eigennamen יהוה, ohne sie zu »Herr HERR« zu verdoppeln.'
- source_word: חַי אָנִי אִם לֹא
  choice: So wahr ich lebe
  rationale: Natürliche deutsche Wiedergabe der feierlichen hebräischen Schwurformel; die bekräftigende Kraft von אִם לֹא ist darin enthalten.
- source_word: אֲשֶׁר בֶּחֳרָבוֹת
  choice: diejenigen, die sich in den Trümmern aufhalten
  rationale: חֳרָבוֹת bezeichnet zerstörte oder verwüstete Orte; »Trümmer« ist hier konkret und im Zusammenhang gut verständlich.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: werden durch das Schwert fallen
  rationale: Bewahrt das hebräische Bild des Fallens durch das Schwert und bleibt zugleich verständlich.
- source_word: אֲשֶׁר עַל פְּנֵי הַשָּׂדֶה
  choice: wer sich auf freiem Feld befindet
  rationale: Gibt die Vorstellung eines ungeschützten Aufenthalts außerhalb befestigter Zufluchtsorte natürlich wieder; eine mechanische Übersetzung als »auf der Oberfläche des Feldes« wäre im Deutschen missverständlich.
- source_word: לַחַיָּה נְתַתִּיו לְאָכְלוֹ
  choice: den habe ich den wilden Tieren zum Fraß gegeben
  rationale: Bewahrt den maskulinen Singular des hebräischen Suffixes und gibt לְאָכְלוֹ idiomatisch als Bestimmung zum Fraß wieder.
- source_word: בַּמְּצָדוֹת וּבַמְּעָרוֹת
  choice: in den Bergfesten und Höhlen
  rationale: מְצָדוֹת bezeichnet schwer zugängliche befestigte Zufluchtsorte; »Bergfesten« unterscheidet sie anschaulich von gewöhnlichen Festungen und passt zur Verbindung mit Höhlen.
- source_word: בַּדֶּבֶר יָמוּתוּ
  choice: werden an der Seuche sterben
  rationale: דֶּבֶר bezeichnet eine tödliche Seuche beziehungsweise Pest; »Seuche« ist modernes, verständliches Deutsch und bewahrt den Charakter eines umfassenden Gerichts.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Fassung lässt den offenbarten Eigennamen im Text sichtbar und gibt zugleich den vorangestellten Herrschaftstitel wieder. Die traditionelle Ersatzlesung bleibt möglich, würde den Eigennamen jedoch verdecken.
- issue: Göttliches Gericht und grammatische Verantwortlichkeit
  choice: Aktive Aussage »den habe ich ... gegeben«
  alternative: Passivische Glättung »wird ... zum Fraß vorgeworfen«
  rationale: Das hebräische נְתַתִּיו nennt Gott ausdrücklich als Handelnden. Diese theologische Spannung wird nicht abgeschwächt.
- issue: Singular nach dem Relativsatz
  choice: »wer ... den habe ich«
  alternative: Pluralische Angleichung »alle ... habe ich«
  rationale: Der hebräische Singular kann distributiv verstanden werden. Die deutsche Fassung bewahrt sowohl die Einzelbezogenheit als auch die natürliche Lesbarkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und feierlicher Schwursprache. Kurze Hauptsätze gliedern die drei Gerichtsszenarien klar. »Yahweh« wird als Eigenname gebraucht; »Bergfesten« hält den antiken Zufluchtscharakter sichtbar.
