base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/026.yaml
  text: You stand on your sword[a], you commit abominations, and each of you defiles his neighbor’s wife[b]. Shall you then possess the land?
translation:
  language: de
  text: Ihr verlasst euch auf euer Schwert[a], ihr tut Abscheuliches, und jeder von euch verunreinigt die Frau seines Nächsten. Sollt ihr denn das Land in Besitz nehmen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr steht auf eurem Schwert.“ Gemeint ist wahrscheinlich, dass sie sich auf Gewalt oder bewaffnete Macht verlassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sollt ihr denn das Land erben?“ Das Hebräische enthält keine ausdrückliche Fragepartikel; nach dem Zusammenhang ist die rhetorische Frage jedoch naheliegend.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: עֲמַדְתֶּם עַל חַרְבְּכֶם
  choice: Ihr verlasst euch auf euer Schwert
  rationale: Wörtlich heißt die Wendung „ihr steht auf eurem Schwert“. Im Zusammenhang bezeichnet sie wahrscheinlich das Vertrauen auf Gewalt oder bewaffnete Macht. Die gewählte Fassung gibt diesen idiomatischen Sinn in natürlichem Deutsch wieder; die konkrete Schwertmetapher bleibt erhalten.
- source_word: עֲשִׂיתֶן תּוֹעֵבָה
  choice: ihr tut Abscheuliches
  rationale: Das singularische תּוֹעֵבָה kann hier kollektiv für verabscheuungswürdiges Verhalten stehen. „Abscheuliches“ bewahrt das starke moralische Urteil und klingt im heutigen Deutsch natürlicher als „einen Gräuel tun“.
- source_word: וְאִישׁ אֶת אֵשֶׁת רֵעֵהוּ
  choice: und jeder von euch … die Frau seines Nächsten
  rationale: 'אִישׁ ist im pluralischen Anrederahmen distributiv: jeder Einzelne aus der angesprochenen Gruppe. רֵעַ bezeichnet den Nächsten, Mitmenschen oder Gefährten; „Nächster“ erhält die soziale Beziehung und die maskuline Referenz des Ausgangstextes.'
- source_word: טִמֵּאתֶם
  choice: verunreinigt
  rationale: Der Piel-Stamm von טמא bedeutet „unrein machen, verunreinigen“. Die Wiedergabe wahrt die moralisch-kultische Begrifflichkeit, ohne durch „schänden“ eine im Verb nicht ausdrücklich enthaltene Gewaltnuance hinzuzufügen.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: Solltet ihr da das Land in Besitz nehmen?
  rationale: ירש kann „in Besitz nehmen“, „besitzen“ oder „erben“ bedeuten. „In Besitz nehmen“ passt zur beanspruchten Verfügungsgewalt über das Land; „da“ bringt den folgernden, empörten Ton der rhetorischen Frage idiomatisch zum Ausdruck.
theological_decisions:
- issue: Satzart des Schlussglieds
  choice: 'Rhetorische Frage: „Solltet ihr da das Land in Besitz nehmen?“'
  alternative: 'Aussage: „Und ihr werdet das Land in Besitz nehmen.“'
  rationale: Das Hebräische enthält keine ausdrückliche Fragepartikel, sodass formal auch eine Aussage denkbar ist. Im Kontext der prophetischen Anklage bestreitet der Vers jedoch den Anspruch der Schuldigen auf das Land; deshalb ist die rhetorische Frage sachlich und rhetorisch am wahrscheinlichsten. Die Fußnote hält die formale Mehrdeutigkeit fest.
- issue: Distributive maskuline Formulierung
  choice: „jeder von euch … die Frau seines Nächsten“
  alternative: „jeder Mann … die Frau seines Nächsten“
  rationale: Die Formulierung wahrt den distributiven Sinn von אִישׁ und die maskuline Bezugskette des hebräischen Textes, fügt sich aber flüssiger in die direkte Anrede ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anklage. Veraltete Wendungen wie „Gräuel verüben“ wurden vermieden, während die konkrete Schwertmetapher, die moralisch-kultische Sprache und die Mehrdeutigkeit des Schlusssatzes erhalten bleiben.
