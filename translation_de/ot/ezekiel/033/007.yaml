  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/007.yaml
  text: And you[a], son of man, I have made you a watchman for the house of Israel[b]; when you hear a word from my mouth, you shall warn them from me.
translation:
  language: de
  text: Du aber, Menschensohn[a], ich habe dich als Wächter für das Haus Israel eingesetzt[b]. Wenn du ein Wort aus meinem Mund hörst, sollst du sie in meinem Auftrag warnen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sterblicher“ beziehungsweise „Menschenkind“. „Menschensohn“ ist in Hesekiel die wiederkehrende Anrede des Propheten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gegeben“; im Zusammenhang auch: „bestellt“ oder „zum Wächter gemacht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „von mir“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die wörtliche und in Hesekiel wiederkehrende Anrede bewahrt das Leitmotiv des Buches. „Sterblicher“ oder „Menschenkind“ geben den Sinn ebenfalls wieder, schwächen aber die feste sprachliche Form ab.
- source_word: צֹפֶה
  choice: Wächter
  rationale: Das Wort bezeichnet jemanden, der Ausschau hält und vor drohender Gefahr warnt; „Wächter“ erhält das prophetische Bild klar und knapp.
- source_word: נְתַתִּיךָ
  choice: ich habe dich … eingesetzt
  rationale: Das Verb bedeutet wörtlich „gegeben“, bezeichnet in dieser Konstruktion jedoch die Zuweisung einer Aufgabe. „Eingesetzt“ ist im Deutschen natürlich und wahrt den Charakter der Beauftragung.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: „Für“ bezeichnet hier den Zuständigkeitsbereich des Wächters; „Haus Israel“ erhält die kollektive biblische Bezeichnung.
- source_word: וְשָׁמַעְתָּ
  choice: wenn du … hörst
  rationale: Das mit Waw verbundene Perfekt leitet im Zusammenhang den erwarteten Anlass für die anschließende Warnung ein. Die temporale Wiedergabe bildet diesen funktionalen Zusammenhang in natürlichem Deutsch ab.
- source_word: מִפִּי דָּבָר
  choice: ein Wort aus meinem Mund
  rationale: Die konkrete Redeweise des Hebräischen wird beibehalten und betont, dass die Botschaft unmittelbar von Gott ausgeht.
- source_word: וְהִזְהַרְתָּ אֹתָם
  choice: sollst du sie … warnen
  rationale: Die Formulierung gibt den verpflichtenden Charakter des prophetischen Auftrags verständlich wieder.
- source_word: מִמֶּנִּי
  choice: in meinem Auftrag
  rationale: Die Wendung macht in natürlichem Deutsch deutlich, dass die Warnung von Gott ausgeht. Die formal nähere Fassung „von mir her“ bleibt als Fußnotenalternative sichtbar.
theological_decisions:
- issue: Wiedergabe der wiederkehrenden Anrede בֶן אָדָם
  choice: Menschensohn
  alternative: Sterblicher; Menschenkind
  rationale: Die traditionelle wörtliche Form wahrt die literarische Wiederholung und lässt die Bedeutungsspannung der hebräischen Anrede bestehen, ohne sie auf Sterblichkeit allein festzulegen.
- issue: Verhältnis von göttlichem Wort und prophetischer Warnung
  choice: „aus meinem Mund“ und „in meinem Auftrag“
  alternative: „von mir her“
  rationale: Die Übersetzung bewahrt Gott als Quelle des Wortes und der Warnung. „In meinem Auftrag“ formuliert die Funktion idiomatisch, ohne dem Propheten eine eigenständige Botschaft zuzuschreiben.
- issue: Verknüpfung der beiden Verbalsätze
  choice: Wenn du … hörst, sollst du … warnen
  alternative: Du wirst … hören und … warnen
  rationale: Die temporale Fassung bringt den sachlichen Bedingungs- und Folgebezug der hebräischen Satzfolge natürlich zum Ausdruck, ohne die Verpflichtung zur Warnung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bezeichnung „Menschensohn“ und das Bild vom „Wächter“ bleiben erhalten; weniger natürliche wörtliche Wendungen werden in den Fußnoten dokumentiert.
