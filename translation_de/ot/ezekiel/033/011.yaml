base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/011.yaml
  text: Say to them[a], ‘As I live,’ declares the Lord GOD, ‘I take no pleasure in the death of the wicked, but rather that the wicked turn from his way and live. Turn back, turn back from your evil ways! Why will you die[b], O house of Israel?’
translation:
  language: de
  text: 'Sag zu ihnen: ›So wahr ich lebe‹, spricht der Herr, GOTT: ›Ich habe keinen Gefallen am Tod des Gottlosen[a], sondern daran, dass der Gottlose von seinem Weg umkehrt und lebt. Kehrt um, kehrt um von euren bösen Wegen![b] Warum wollt ihr sterben, Haus Israel?‹'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe keine Freude am Tod des Gottlosen« beziehungsweise »Ich will nicht den Tod des Gottlosen«. Das hebräische Verb kann Gefallen, Freude oder Verlangen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Die Wiederholung »Kehrt um, kehrt um« verstärkt den dringlichen Aufruf. Im Hebräischen steht hier dasselbe Verb wie zuvor bei der Umkehr des Gottlosen von seinem Weg.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Die geläufige deutsche Schwurformel gibt die feierliche göttliche Bekräftigung natürlich und prägnant wieder.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht GOTT, der Herr
  rationale: נְאֻם wird als prophetische Redeeinleitung wiedergegeben. Die Folge אֲדֹנָי יְהוִה wird in einer im Deutschen geläufigen Form ausgedrückt, die beide Gottesbezeichnungen wahrt und eine unbeholfene Doppelung von »Herr« vermeidet.
- source_word: אִם אֶחְפֹּץ בְּמוֹת הָרָשָׁע
  choice: Ich habe keinen Gefallen am Tod des Gottlosen
  rationale: Im Rahmen der Schwurformel hat אִם verneinende Kraft. חפץ kann Gefallen, Freude oder Verlangen bezeichnen; »keinen Gefallen haben« bewahrt den affektiven Sinn, ohne die Aussage systematisch einzuengen.
- source_word: כִּי אִם
  choice: sondern daran
  rationale: 'Die Wendung stellt den positiven Gegenpol zur verneinten Aussage her: nicht am Tod, sondern an der Umkehr und am Leben.'
- source_word: בְּשׁוּב רָשָׁע מִדַּרְכּוֹ
  choice: dass der Gottlose von seinem Weg umkehrt
  rationale: »Umkehren« bildet שׁוב präzise ab und wahrt die Verbindung zu den anschließenden Imperativen. Der repräsentative Singular des Hebräischen bleibt erhalten.
- source_word: וְחָיָה
  choice: und lebt
  rationale: Die knappe Koordination lässt wie im Hebräischen offen, ob Leben hier vor allem als Ziel oder Folge der Umkehr akzentuiert ist.
- source_word: שׁוּבוּ שׁוּבוּ
  choice: Kehrt um, kehrt um
  rationale: Die Wiederholung bewahrt den eindringlichen Nachdruck und denselben Wortstamm wie zuvor, ohne ihn vorschnell durch den stärker theologisch geprägten Ausdruck »Buße tun« zu ersetzen.
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: von euren bösen Wegen
  rationale: Die prophetische Wegmetapher für Lebensführung bleibt erhalten; »böse« trägt das klare moralische Gewicht von רַע.
- source_word: וְלָמָּה תָמוּתוּ
  choice: Warum wollt ihr sterben
  rationale: Das deutsche »wollt« gibt die rhetorische, dringliche Zukunftsfrage natürlich wieder, ohne die Todesabsicht ausdrücklich als hartnäckigen Entschluss auszudeuten.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle prophetische Kollektivbezeichnung bewahrt das Bild des Hauses und die korporative Anrede.
theological_decisions:
- issue: Gottes Haltung zum Tod des Gottlosen
  choice: »keinen Gefallen am Tod« wird der positiven Aussage über Umkehr und Leben gegenübergestellt.
  alternative: חפץ stärker mit »nicht wollen« oder »kein Verlangen haben« wiederzugeben.
  rationale: Der Text bezeugt Gottes ablehnende Haltung gegenüber dem Tod des Gottlosen und seinen Gefallen an dessen Umkehr und Leben. Die Übersetzung entscheidet damit keine weitergehende systematische Frage nach verschiedenen Bedeutungen des göttlichen Willens.
- issue: Repräsentativer Singular רָשָׁע und pluralische Anrede
  choice: Zunächst »der Gottlose … seinem Weg«, danach die direkte Mehrzahl »ihr/eure«.
  alternative: Durchgehend zu verallgemeinern, etwa »gottlose Menschen … ihre Wege«.
  rationale: Der Wechsel vom repräsentativen Singular zur unmittelbaren Anrede des Hauses Israel gehört zur rhetorischen Gestalt des hebräischen Textes und wird nicht eingeebnet.
- issue: Bedeutungsumfang von שׁוב
  choice: Durchgehend mit »umkehren« wiedergegeben.
  alternative: Die Imperative mit »tut Buße« wiederzugeben.
  rationale: »Umkehren« wahrt Bild und Wortwiederholung des Ausgangstextes und trägt zugleich den ethisch-geistlichen Sinn, ohne zusätzliche konfessionelle Begrifflichkeit einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Die zweimalige Aufforderung und die Wegmetapher bleiben erhalten. »GOTT, der Herr« markiert typografisch den Gottesnamen in der Verbindung אֲדֹנָי יְהוִה; »Haus Israel« bewahrt die biblische korporative Anrede.
