source:
  edition: WLC
  text: חֲבֹ֨ל יָשִׁ֤יב רָשָׁע֙ גְּזֵלָ֣ה יְשַׁלֵּ֔ם בְּ/חֻקּ֤וֹת הַֽ/חַיִּים֙ הָלַ֔ךְ לְ/בִלְתִּ֖י עֲשׂ֣וֹת עָ֑וֶל חָי֥וֹ יִֽחְיֶ֖ה לֹ֥א יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/015.yaml
  text: if the wicked man restores the pledge[a], repays what he has stolen, walks in the statutes of life without doing injustice, he shall surely live[b]; he shall not die.
translation:
  language: de
  text: Wenn der Gottlose das Pfand zurückgibt[a], das Geraubte erstattet, nach den Satzungen des Lebens lebt[b] und kein Unrecht tut, wird er ganz gewiss leben; er wird nicht sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das als Pfand Genommene zurückgibt“. Gemeint ist ein Gegenstand, der als Sicherheit für ein Darlehen einbehalten wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach den lebensspendenden Satzungen lebt“ beziehungsweise „nach den Satzungen lebt, die zum Leben führen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל
  choice: das Pfand
  rationale: Das Wort bezeichnet einen Gegenstand, der als Sicherheit für ein Darlehen genommen wurde. „Pfand“ ist im Deutschen knapp, verständlich und rechtlich passend.
- source_word: יָשִׁיב
  choice: zurückgibt
  rationale: Im Zusammenhang mit dem Pfand bezeichnet das Verb dessen Rückgabe. „Zurückgibt“ ist natürlicher als „wiederherstellt“ und wahrt den konkreten Sinn.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet hier den beispielhaft betrachteten schuldigen Menschen. „Der Gottlose“ entspricht dem würdevollen biblisch-prophetischen Register.
- source_word: גְּזֵלָה
  choice: das Geraubte
  rationale: Das Substantiv bezeichnet geraubtes oder gewaltsam entwendetes Gut. Die substantivierte Form hält den Gegenstand der Wiedergutmachung knapp und konkret.
- source_word: יְשַׁלֵּם
  choice: ersetzt
  rationale: Die Piel-Form bezeichnet vollständige Erstattung oder Wiedergutmachung. „Ersetzt“ gibt den kompensatorischen Sinn natürlich wieder.
- source_word: בְּחֻקּוֹת הַחַיִּים
  choice: nach den Satzungen des Lebens
  rationale: „Nach“ verbindet sich im Deutschen idiomatisch mit einer Lebensführung gemäß Satzungen. Der Genitiv „des Lebens“ bewahrt die Mehrdeutigkeit, ob diese Satzungen dem Leben entsprechen, Leben bewirken oder zu ihm führen.
- source_word: הָלַךְ
  choice: lebt
  rationale: Das hebräische „gehen/wandeln“ bezeichnet hier die Lebensführung. „Lebt nach“ ist in modernem Deutsch natürlich und erhält den ethischen Sinn, ohne eine ungebräuchliche Formulierung zu erzwingen.
- source_word: לְבִלְתִּי עֲשׂוֹת עָוֶל
  choice: und kein Unrecht tut
  rationale: Die Infinitivkonstruktion bezeichnet das Unterlassen falschen Handelns. Die koordinierte deutsche Form gibt die Bedingung klar und natürlich wieder.
- source_word: עָוֶל
  choice: Unrecht
  rationale: „Unrecht“ wahrt sowohl die ethische als auch die rechtliche Färbung des Begriffs und passt zum Kontext von Rückgabe und Wiedergutmachung.
- source_word: חָיוֹ יִחְיֶה
  choice: wird er ganz gewiss leben
  rationale: Infinitivus absolutus und finites Verb verstärken gemeinsam die Gewissheit. „Ganz gewiss“ bildet diese Emphase in natürlichem modernem Deutsch ab.
- source_word: לֹא יָמוּת
  choice: er wird nicht sterben
  rationale: Die direkte Verneinung wird ohne zusätzliche Deutung wiedergegeben und entspricht der vorangehenden Zukunftsaussage.
theological_decisions:
- issue: Bedeutung von Leben und Tod in Verheißung und Warnung
  choice: Die unmittelbare Aussage „wird er ganz gewiss leben; er wird nicht sterben“ bleibt ohne nähere Bestimmung stehen.
  alternative: Das Leben ausschließlich als körperliches Überleben, Wiederherstellung im Bund oder eschatologisches Leben bestimmen.
  rationale: Der hebräische Text legt die Reichweite von „leben“ und „sterben“ hier nicht ausdrücklich auf nur eine Dimension fest. Die Übersetzung bewahrt daher die mögliche Überschneidung leiblicher, bundesbezogener und eschatologischer Aspekte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-rechtlichem Ton. Die Rechtssprache bleibt verständlich; die hebräische Metapher des Wandelns wird idiomatisch als Lebensführung wiedergegeben. Beide Fußnotenmarker erscheinen im Haupttext.
