  text: וְ/הִנְּ/ךָ֤ לָ/הֶם֙ כְּ/שִׁ֣יר עֲגָבִ֔ים יְפֵ֥ה ק֖וֹל וּ/מֵטִ֣ב נַגֵּ֑ן וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/עֹשִׂ֥ים אֵינָ֖/ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/032.yaml
  text: Look[a], you are to them like a sensual song, with a beautiful voice and skillful playing; they hear your words, but they do not do them.
translation:
  language: de
  text: Sieh, du bist für sie wie ein sinnliches Lied[a], vorgetragen von einem, der eine schöne Stimme hat und gut spielen kann. Sie hören deine Worte, aber sie tun sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Liebeslied“. Der hebräische Ausdruck kann leidenschaftliche Liebe oder sinnliches Begehren bezeichnen. Die Menschen behandeln die Botschaft des Propheten wie anziehende Unterhaltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְּךָ
  choice: Sieh, du bist
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die folgende Feststellung; „Sieh“ bewahrt diese deiktische Funktion in würdigem, verständlichem Deutsch.
- source_word: לָהֶם
  choice: für sie
  rationale: Die Präposition ל bezeichnet hier die Wahrnehmung beziehungsweise Einschätzung durch die Zuhörer; idiomatisches Deutsch verlangt in diesem Vergleich „für sie“.
- source_word: כְּשִׁיר עֲגָבִים
  choice: wie ein sinnliches Lied
  rationale: שִׁיר bedeutet „Lied“; עֲגָבִים bezeichnet leidenschaftliches oder sinnliches Begehren. „Sinnliches Lied“ erhält den anziehenden und möglicherweise moralisch anstößigen Unterton, ohne ihn zu überzeichnen.
- source_word: יְפֵה קוֹל
  choice: schön gesungen
  rationale: Wörtlich bezeichnet die Wendung eine schöne Stimme. Im deutschen Satz bezieht „schön gesungen“ die Eigenschaft natürlich auf das zuvor genannte Lied und wahrt dessen klangliche Anziehungskraft.
- source_word: וּמֵטִב נַגֵּן
  choice: und kunstvoll gespielt
  rationale: Der Hifil-Partizipialausdruck mit נגן beschreibt gekonntes Musizieren. „Kunstvoll gespielt“ ist idiomatisch und gibt die musikalische Fertigkeit prägnant wieder.
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: Sie hören deine Worte
  rationale: Die direkte Wiedergabe mit „hören“ bewahrt den Gegensatz zum ausbleibenden Tun.
- source_word: וְעֹשִׂים אֵינָם אוֹתָם
  choice: aber sie tun sie nicht
  rationale: Die ungewöhnlich betonte hebräische Verneinung besagt, dass die Zuhörer die gehörten Worte nicht ausführen. Die formnahe Wendung „sie tun sie nicht“ bewahrt die prophetische Spannung zwischen Hören und Tun.
theological_decisions:
- issue: Moralische Nuance von עֲגָבִים
  choice: sinnliches Lied
  alternative: Liebeslied
  rationale: Der Ausdruck kann leidenschaftliche Liebe oder sinnliches Begehren bezeichnen. Im Zusammenhang behandeln die Hörer die prophetische Botschaft als anziehende Darbietung, statt ihr zu folgen. „Sinnlich“ lässt den kritisch gefärbten Unterton erkennen, ohne eindeutigere Erotik in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die musikalischen Beschreibungen sind idiomatisch auf „Lied“ bezogen; der abschließende Gegensatz bleibt bewusst formnah und eindringlich.
