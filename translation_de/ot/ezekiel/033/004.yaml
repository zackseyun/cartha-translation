source:
  edition: WLC
  text: וְ/שָׁמַ֨ע הַ/שֹּׁמֵ֜עַ אֶת ק֤וֹל הַ/שּׁוֹפָר֙ וְ/לֹ֣א נִזְהָ֔ר וַ/תָּ֥בוֹא חֶ֖רֶב וַ/תִּקָּחֵ֑/הוּ דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/004.yaml
  text: then if the one who hears hears the sound of the trumpet and does not take warning[a], and the sword comes and takes him away, his blood will be on his own head.
translation:
  language: de
  text: Wenn nun jemand den Schall des Widderhorns hört, sich aber nicht warnen lässt, und das Schwert kommt und ihn dahinrafft, wird sein Blut auf seinem eigenen Haupt sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Sein Blut wird auf seinem Haupt sein.“ Diese Redewendung bedeutet, dass er selbst die Verantwortung für seinen Tod trägt.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמַע הַשֹּׁמֵעַ
  choice: Wenn nun jemand ... hört
  rationale: Die Verbindung aus Konjunktion, finitem Verb und substantiviertem Partizip führt den im vorigen Vers begonnenen Bedingungsfall fort. Die deutsche Formulierung macht diese Bedingung natürlich verständlich, ohne den Sinn auf eine bloße Erzählfolge zu verengen.
- source_word: קוֹל הַשּׁוֹפָר
  choice: den Schall des Widderhorns
  rationale: קוֹל bezeichnet hier das hörbare Warnsignal. שׁוֹפָר ist genauer ein Widderhorn als eine moderne Trompete; die Wahl bewahrt den historischen Gegenstand und bleibt im Deutschen verständlich.
- source_word: וְלֹא נִזְהָר
  choice: sich aber nicht warnen lässt
  rationale: Der Niphal kann das Gewarntwerden beziehungsweise das Beachten einer Warnung ausdrücken. Die Formulierung hält beides zusammen und hebt im Kontext die verweigerte Reaktion auf das Signal hervor.
- source_word: חֶרֶב
  choice: das Schwert
  rationale: Der bestimmte Ausdruck und das prophetische Bild werden bewahrt. Das Schwert steht im Zusammenhang für den gewaltsamen Angriff, ohne dass die Bildsprache in der Übersetzung aufgelöst wird.
- source_word: וַתִּקָּחֵהוּ
  choice: ihn dahinrafft
  rationale: לקח bedeutet wörtlich „nehmen“. Im Zusammenhang ist die tödliche Folge gemeint; „dahinraffen“ macht dies idiomatisch deutlich, ohne die Art des Todes näher auszumalen.
- source_word: דָּמוֹ בְרֹאשׁוֹ יִהְיֶה
  choice: wird sein Blut auf seinem eigenen Haupt sein
  rationale: 'Die hebräische Verantwortungsformel wird als Bild beibehalten. „seinem eigenen“ verdeutlicht im Deutschen den reflexiven Nachdruck: Er trägt die Verantwortung für seinen Tod selbst.'
theological_decisions:
- issue: Verantwortungsformel im Gerichtszusammenhang
  choice: wird sein Blut auf seinem eigenen Haupt sein
  alternative: Er wird für seinen eigenen Tod verantwortlich sein
  rationale: Die bildhafte hebräische Aussage bleibt erhalten und wird nicht vollständig in eine abstrakte Erklärung umgewandelt. So bleiben persönliche Verantwortung und rhetorische Schärfe gewahrt, ohne zusätzliche Lehrbegriffe einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Widderhorn“ gibt שׁוֹפָר historisch genauer wieder als „Trompete“. „Haupt“ bewahrt in der Verantwortungsformel den gehobenen biblischen Bildklang; der übrige Satz bleibt gegenwärtig und allgemein verständlich.
