  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם בְּנֵ֣י עַמְּ/ךָ֗ הַ/נִּדְבָּרִ֤ים בְּ/ךָ֙ אֵ֣צֶל הַ/קִּיר֔וֹת וּ/בְ/פִתְחֵ֖י הַ/בָּתִּ֑ים וְ/דִבֶּר חַ֣ד אֶת אַחַ֗ד אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר בֹּֽאוּ נָ֣א וְ/שִׁמְע֔וּ מָ֣ה הַ/דָּבָ֔ר הַ/יּוֹצֵ֖א מֵ/אֵ֥ת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
translation:
  language: de
  text: 'Und du, Menschensohn: Die Leute aus deinem Volk reden an den Mauern und in den Hauseingängen über dich[a]. Einer redet mit dem anderen, jeder mit seinem Bruder, und sie sagen: »Kommt doch und hört, welches Wort es ist, das von Jahwe ausgeht[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dir reden«. Der Zusammenhang spricht eher dafür, dass sie untereinander über Hesekiel reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »was das Wort ist, das von Jahwe herauskommt«. Gemeint ist das prophetische Wort, das von ihm ausgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt Hesekiels charakteristische göttliche Anrede und ihre bildhafte, feierliche Wirkung.
- source_word: בְּנֵי עַמְּךָ
  choice: die Leute aus deinem Volk
  rationale: Gibt die Zugehörigkeit zum Volk in natürlichem modernem Deutsch wieder; die hebräische Wendung »Söhne deines Volkes« bezeichnet hier die Angehörigen des Volkes allgemein.
- source_word: הַנִּדְבָּרִים בְּךָ
  choice: reden ... über dich
  rationale: ב bei דבר bezeichnet im Kontext am ehesten den Gegenstand des Gesprächs; die mögliche Bedeutung »mit dir reden« bleibt in einer Fußnote erhalten.
- source_word: אֵצֶל הַקִּירוֹת וּבְפִתְחֵי הַבָּתִּים
  choice: an den Mauern und in den Hauseingängen
  rationale: Gibt die räumliche Nähe beziehungsweise die Eingangsbereiche klar und natürlich wieder.
- source_word: וְדִבֶּר חַד אֶת אַחַד אִישׁ אֶת אָחִיו
  choice: Einer redet mit dem anderen, jeder mit seinem Bruder
  rationale: Bewahrt sowohl die wechselseitige Gesprächssituation als auch die konkrete Wiederholung und das Verwandtschaftswort des Hebräischen.
- source_word: בֹּאוּ נָא וְשִׁמְעוּ
  choice: Kommt doch und hört
  rationale: »doch« vermittelt die einladende beziehungsweise auffordernde Nuance von נָא in idiomatischem Deutsch.
- source_word: מָה הַדָּבָר
  choice: was für ein Wort
  rationale: Bewahrt »Wort« als prophetischen Ausdruck; die Konstruktion fragt hier nach dem Inhalt oder der Art des ergehenden Wortes.
- source_word: הַיּוֹצֵא מֵאֵת יְהוָה
  choice: von Jahwe ausgeht
  rationale: »ausgeht« erhält die Bewegungsrichtung des Partizips יצא und klingt zugleich im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; »Jahwe« macht ihn im Deutschen unmittelbar sichtbar.
- issue: Bezug von ב in הַנִּדְבָּרִים בְּךָ
  choice: über dich reden
  alternative: mit dir reden
  rationale: Die anschließende Schilderung ihrer Gespräche untereinander spricht eher dafür, dass Hesekiel Gegenstand ihrer Rede ist; die grammatisch mögliche Alternative wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. »Menschensohn«, »Wort« und »Jahwe« bewahren zentrale Quellbegriffe; Satzbau und idiomatische Partikeln sorgen für allgemeine Verständlichkeit.
