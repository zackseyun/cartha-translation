  text: וְ/רָאָ֥ה אֶת הַ/חֶ֖רֶב בָּאָ֣ה עַל הָ/אָ֑רֶץ וְ/תָקַ֥ע בַּ/שּׁוֹפָ֖ר וְ/הִזְהִ֥יר אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/003.yaml
  text: and he sees the sword coming against the land[a], and he blows the trumpet and warns the people,
translation:
  language: de
  text: und er sieht das Schwert gegen das Land kommen, bläst ins Horn[a] und warnt das Volk,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch Schofar: ein Signalhorn aus Tierhorn, meist aus Widderhorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: und er sieht
  rationale: Die Verbform führt die Abfolge innerhalb des hypothetischen Falls fort. Das deutsche Präsens gibt diesen allgemein formulierten Bedingungszusammenhang natürlich wieder.
- source_word: הַחֶרֶב
  choice: das Schwert
  rationale: Das konkrete Bild bleibt erhalten; im prophetischen Zusammenhang kann das Schwert zugleich für Krieg, Invasion oder Gericht stehen.
- source_word: בָּאָה עַל הָאָרֶץ
  choice: gegen das Land kommen
  rationale: Die Formulierung bewahrt sowohl die Bewegung auf das Land zu als auch deren bedrohliche, feindliche Ausrichtung.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist hier das bedrohte Territorium, nicht die gesamte Erde. „Land“ wahrt zudem die mögliche bundesgeschichtliche Resonanz.
- source_word: וְתָקַע בַּשּׁוֹפָר
  choice: stößt ins Horn
  rationale: Die deutsche Wendung bezeichnet idiomatisch das Blasen eines Signalhorns und gibt die Alarmfunktion des Schofars knapp und anschaulich wieder.
- source_word: שׁוֹפָר
  choice: Horn
  rationale: „Horn“ ist sachlich näher am hebräischen Instrument als „Trompete“; die Fußnote nennt die genauere Bezeichnung Schofar und erläutert das Instrument.
- source_word: וְהִזְהִיר
  choice: und warnt
  rationale: Das Hifil bedeutet hier, jemanden zu warnen beziehungsweise ihm eine Warnung zukommen zu lassen. „Warnt“ ist präzise und natürlich.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet die Bevölkerung als Kollektiv; „das Volk“ entspricht dem Kontext und dem würdigen biblischen Register.
theological_decisions:
- issue: Metonymische Bedeutung des Schwertes in der prophetischen Warnung
  choice: Das konkrete Bild „das Schwert“ bleibt im Haupttext stehen.
  alternative: Deutende Wiedergabe als „Krieg“ oder „ein einfallendes Heer“.
  rationale: Der hebräische Text nennt ausdrücklich das Schwert. Das Bild lässt Krieg, Invasion und Gericht anklingen, ohne die Aussage auf nur eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Teil des fortlaufenden Bedingungsfalls bewusst offen; das abschließende Komma entspricht dem vom Nutzer vorgelegten Verssegment.
