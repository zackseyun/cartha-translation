  text: כָּל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לֹ֥א תִזָּכַ֖רְנָה ל֑/וֹ מִשְׁפָּ֧ט וּ/צְדָקָ֛ה עָשָׂ֖ה חָי֥וֹ יִֽחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/016.yaml
  text: None of the sins that he committed will be remembered against him[a]; he has done justice and righteousness; he shall surely live.
translation:
  language: de
  text: Keine der Sünden, die er begangen hat, wird ihm angerechnet werden[a]. Er hat Recht und Gerechtigkeit geübt; er wird ganz gewiss leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet wörtlich: „[Sie] werden ihm nicht erinnert werden“; im gerichtlichen Zusammenhang ist gemeint: Sie werden ihm nicht angerechnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חטאתו אֲשֶׁר חָטָא
  choice: Keine von den Sünden, die er begangen hat
  rationale: כָּל mit dem kollektiv gebrauchten Singular חטאתו und dem pluralischen Verb תִזָּכַרְנָה wird distributiv wiedergegeben. Der deutsche Plural macht den Sinn natürlich verständlich.
- source_word: לֹא תִזָּכַרְנָה לוֹ
  choice: wird ihm angerechnet werden
  rationale: Wörtlich steht hier „werden ihm nicht erinnert werden“. Im gerichtlichen Zusammenhang bezeichnet die Wendung, dass die früheren Sünden nicht gegen ihn in Anschlag gebracht werden; „angerechnet“ gibt diesen forensischen Sinn idiomatisch wieder.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  rationale: Das prophetische Begriffspaar bezeichnet gerechtes, rechtschaffenes Handeln. Die feste deutsche Verbindung bewahrt sowohl den rechtlichen als auch den ethischen Klang.
- source_word: עָשָׂה
  choice: geübt
  rationale: „Recht und Gerechtigkeit üben“ ist im Deutschen eine natürliche, würdige Ausdrucksweise für praktiziertes gerechtes Handeln und entspricht dem semantischen Umfang von עשה.
- source_word: חָיוֹ יִחְיֶה
  choice: er wird ganz gewiss leben
  rationale: Der Infinitivus absolutus vor dem finiten Verb verstärkt die Aussage. „Ganz gewiss“ gibt diese emphatische Zusicherung in modernem Deutsch wieder.
theological_decisions:
- issue: Forensischer Sinn des Nichtgedenkens der Sünden
  choice: wird ihm angerechnet werden
  alternative: wird ihm gegenüber nicht in Erinnerung gebracht werden
  rationale: Die Übersetzung wahrt den gerichtlichen Sinn, dass frühere Sünden nicht gegen den Umgekehrten geltend gemacht werden, ohne eine spätere dogmatische Begrifflichkeit in den Vers einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur bleibt knapp und nachdrücklich; die hebräische Verstärkung am Versende wird ausdrücklich wiedergegeben.
