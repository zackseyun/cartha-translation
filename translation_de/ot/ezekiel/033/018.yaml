  text: בְּ/שׁוּב צַדִּ֥יק מִ/צִּדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל וּ/מֵ֖ת בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/018.yaml
  text: When a righteous man turns from his righteousness and does injustice[b][a], he shall die because of them.
translation:
  language: de
  text: Wenn ein Gerechter sich von seiner Gerechtigkeit abkehrt und Unrecht[a] tut, wird er wegen solcher Taten sterben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Böses“, „Verkehrtes“ oder „Ungerechtigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in ihnen“ oder „durch sie“; gemeint sind wahrscheinlich die unrechten Taten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Wenn ... sich ... abkehrt
  rationale: ב mit dem Infinitiv von שׁוב leitet hier einen temporalen Bedingungssatz ein. „Wenn … sich abkehrt“ gibt die Abwendung von der bisherigen Gerechtigkeit im Deutschen natürlich wieder.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das substantivierte maskuline Adjektiv bezeichnet einen einzelnen gerechten Mann. „Ein Gerechter“ bewahrt Form und sprichwortartigen Charakter der Aussage.
- source_word: מִצִּדְקָתוֹ
  choice: von seiner Gerechtigkeit
  rationale: Die Wendung bezeichnet seine Gerechtigkeit beziehungsweise gerechte Lebensführung. Die direkte Wiedergabe wahrt zudem den begrifflichen Gegensatz zu עָוֶל.
- source_word: וְעָשָׂה עָוֶל
  choice: und Unrecht tut
  rationale: עָשָׂה mit עָוֶל ist eine übliche Verbindung für das Tun oder Begehen von Unrecht. „Unrecht tun“ ist klar, würdig und idiomatisch.
- source_word: וּמֵת
  choice: wird er ... sterben
  rationale: Die Verbform bezeichnet in diesem Bedingungsgefüge die eintretende Folge. Das Futur gibt die feierliche Konsequenz wieder, ohne eine zusätzliche modale Aussage einzutragen.
- source_word: בָּהֶם
  choice: wegen solcher Taten
  rationale: Die Präposition mit dem pluralischen Suffix hat hier wahrscheinlich kausalen Sinn und verweist auf die unrechten Handlungen. Da „ihretwegen“ im Deutschen ohne pluralisches Bezugswort missverständlich wäre, wird der Bezug knapp verdeutlicht; die wörtlichere Form bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Ob der angekündigte Tod den Verlust des Heils oder ein zeitliches Bundes- beziehungsweise Gerichtsurteil bezeichnet
  choice: 'Die Aussage bleibt auf der Textebene: Wer sich als Gerechter von seiner Gerechtigkeit abkehrt und Unrecht tut, wird wegen solcher Taten sterben.'
  alternative: Den Tod ausdrücklich als Verlust des ewigen Heils oder ausschließlich als zeitliches Gericht bestimmen.
  rationale: Der hebräische Text nennt die moralische Umkehr und den daraus folgenden Tod, legt aber keine späteren dogmatischen Kategorien fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form eines allgemeinen Gerichtsgrundsatzes bleibt erhalten; traditionelle, aber heute schwerer verständliche Wörter wie „Missetat“ werden vermieden.
