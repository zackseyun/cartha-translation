- from: Wenn aber ein Gottloser von seiner Gottlosigkeit umkehrt und Recht und Gerechtigkeit übt, wird er durch sie[a] leben.
  to: Wenn aber ein Mensch, der Unrecht tut, sich von seinem Unrecht abwendet und Recht und Gerechtigkeit übt, wird er aufgrund dessen[a] leben.
  rationale: Die Überarbeitung gibt die ethisch-rechtliche Bedeutung von רשע und רשעה im modernen Deutsch genauer wieder und ersetzt die missverständliche, im Deutschen weniger natürliche Formulierung „durch sie“ durch „aufgrund dessen“. Die Satzfolge, der repräsentative Singular, die Begriffspaarung „Recht und Gerechtigkeit“ und die im Hebräischen angelegte Beziehung zwischen gerechtem Handeln und Leben bleiben erhalten. Die Fußnote kennzeichnet die wörtliche Präpositionsform sowie eine mögliche alternative Nuance.
