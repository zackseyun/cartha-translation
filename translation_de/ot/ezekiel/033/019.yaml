  yaml_path: translation/ot/ezekiel/033/019.yaml
  text: And when a wicked man turns from his wickedness and does justice and righteousness[a], by them he shall live.
translation:
  language: de
  text: Wenn aber ein Mensch, der Unrecht tut, sich von seinem Unrecht abwendet und Recht und Gerechtigkeit übt, wird er aufgrund dessen[a] leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihretwegen“; wörtlich: „auf ihnen“. Das hebräische Pronomen bezieht sich auf „Recht und Gerechtigkeit“ und kann diese als Grund oder Grundlage seines Lebens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  choice: Wenn aber ... umkehrt
  rationale: Die Konjunktion mit Präposition und Infinitivus constructus leitet einen temporalen Bedingungszusammenhang ein. „Wenn aber“ gibt im Deutschen zugleich den inhaltlichen Gegensatz zum vorausgehenden Vers natürlich wieder.
- source_word: רָשָׁע
  choice: ein Gottloser
  rationale: Das substantivierte maskuline Adjektiv bezeichnet hier einen Menschen, dessen Verhalten als böse beziehungsweise schuldig gilt. „Ein Gottloser“ bewahrt den repräsentativen Singular und die traditionelle ethisch-religiöse Bedeutung.
- source_word: מֵֽ/רִשְׁעָת֔/וֹ
  choice: von seiner Gottlosigkeit
  rationale: Die Wiedergabe wahrt die Wortverbindung zu רָשָׁע und erhält die starke moralische Aussage des hebräischen Ausdrucks.
- source_word: וְ/עָשָׂה
  choice: und ... übt
  rationale: Das allgemeine Verb עשה bedeutet „tun/machen“. Mit den abstrakten Objekten „Recht und Gerechtigkeit“ ist „üben“ im Deutschen natürlich und bezeichnet konkretes, fortgesetztes Handeln, ohne über den Ausgangstext hinauszugehen.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: In der ethischen Verbindung mit צדקה bezeichnet das Wort gerechtes Handeln beziehungsweise das, was recht ist, nicht bloß ein richterliches Urteil.
- source_word: וּ/צְדָקָה
  choice: und Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt den geläufigen ethisch-religiösen Gehalt und bildet mit „Recht“ eine natürliche, traditionsfähige Wortverbindung.
- source_word: עֲלֵי/הֶם
  choice: durch sie
  rationale: Das Pronomen verweist im Plural auf „Recht und Gerechtigkeit“. Die Präposition על kann hier die Grundlage oder den Grund des Lebens bezeichnen; „durch sie“ hält diese Beziehung knapp fest, während eine Fußnote die echte Bedeutungsbreite ausweist.
- source_word: הוּא יִֽחְיֶה
  choice: wird er ... leben
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor. Die deutsche Wortstellung lässt den Nachdruck ausreichend erkennen; „wird ... leben“ ist eine klare, würdige Zukunftsaussage.
theological_decisions:
- issue: Verhältnis von Umkehr, gerechtem Handeln und Leben
  choice: Der Vers sagt, dass der Gottlose, der von seiner Gottlosigkeit umkehrt und Recht und Gerechtigkeit übt, durch diese leben wird.
  alternative: Das Leben ausdrücklich allein an die Umkehr oder allgemeiner an Bundestreue zu binden.
  rationale: Die Übersetzung bewahrt die eigene Formulierung des hebräischen Textes und damit dessen theologische Spannung. Sie deutet die Beziehung zwischen Umkehr, Taten und Leben nicht durch ein späteres Lehrsystem um.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger biblischer Begrifflichkeit. Der repräsentative maskuline Singular und die enge Wortverbindung zwischen „Gottloser“ und „Gottlosigkeit“ bleiben erhalten.
