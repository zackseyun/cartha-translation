  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ֤/י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה עַ֥ל כָּל תּוֹעֲבֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/029.yaml
  text: Then they will know that I am Yahweh[b][a], when I make the land a desolation and a waste because of all the abominations that they have committed.
translation:
  language: de
  text: Dann werden sie erkennen, dass ich Yahweh bin,[a] wenn ich das Land zur Einöde und zum Entsetzen[b] mache wegen all ihrer Gräueltaten, die sie begangen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sie werden erkennen“. Die hebräische Verbindung kann schlicht mit „und“ wiedergegeben werden; im Zusammenhang bezeichnet sie wahrscheinlich eine Folge.'
    reason: lexical_alternative
  - marker: b
    text: „Entsetzen“ kann hier auch „Verwüstung“ oder „Ödnis“ bedeuten; das hebräische Wort kann sowohl den zerstörten Zustand als auch dessen erschreckende Wirkung hervorheben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: Das einleitende Waw führt im Zusammenhang wahrscheinlich die Folge des angekündigten Gerichts weiter. „Erkennen“ gibt ידע in der bei Ezechiel typischen Formel angemessen wieder.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Yahweh bin
  rationale: כִּי leitet hier den Inhalt der Erkenntnis ein. Der Gottesname wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתִתִּי אֶת הָאָרֶץ
  choice: wenn ich das Land … mache
  rationale: ב mit dem Infinitiv constructus bezeichnet hier den zeitlichen Umstand. נתן hat zusammen mit den folgenden Zustandsbezeichnungen die resultative Bedeutung „zu etwas machen“.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: zur Einöde und zum Entsetzen
  rationale: „Einöde“ bezeichnet den verwüsteten Zustand; „Entsetzen“ bewahrt bei מְשַׁמָּה zusätzlich die mögliche Wirkung der Verwüstung auf die Betrachter und vermeidet eine bloße Doppelung.
- source_word: עַל כָּל תּוֹעֲבֹתָם
  choice: wegen all ihrer abscheulichen Taten
  rationale: עַל bezeichnet den Grund des Gerichts. „Abscheuliche Taten“ ist im heutigen Deutsch verständlicher als das substantivische „Gräuel“ und erhält die starke ethisch-kultische Wertung von תּוֹעֵבָה.
- source_word: אֲשֶׁר עָשׂוּ
  choice: die sie begangen haben
  rationale: Bei verwerflichen Taten entspricht „begehen“ dem deutschen Sprachgebrauch und gibt עשה sachgerecht wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration wahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מְשַׁמָּה
  choice: Entsetzen
  alternative: Verwüstung; Ödnis
  rationale: Das Wort kann sowohl die Verwüstung als auch das dadurch ausgelöste Entsetzen bezeichnen. Die gewählte Fassung bewahrt diese zweite Nuance neben שְׁמָמָה; die sachliche Ruinbedeutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Gerichtssprache bleibt gewichtig, ist aber ohne altertümliche Wendungen verständlich. Beide Fußnotenmarker stehen an den jeweils einschlägigen Stellen im Haupttext.
