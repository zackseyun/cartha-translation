  text: בֶּן אָדָ֗ם יֹ֠שְׁבֵי הֶ/חֳרָב֨וֹת הָ/אֵ֜לֶּה עַל אַדְמַ֤ת יִשְׂרָאֵל֙ אֹמְרִ֣ים לֵ/אמֹ֔ר אֶחָד֙ הָיָ֣ה אַבְרָהָ֔ם וַ/יִּירַ֖שׁ אֶת הָ/אָ֑רֶץ וַ/אֲנַ֣חְנוּ רַבִּ֔ים לָ֛/נוּ נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/024.yaml
  text: Son of man, the inhabitants of these ruins on the land of Israel are saying, ‘Abraham was only one man, yet he possessed the land; but we are many—the land has been given to us as a possession.’
translation:
  language: de
  text: 'Menschensohn, die Bewohner dieser Ruinen im Land Israel sagen: »Abraham war nur ein Einzelner, und doch nahm er das Land in Besitz. Wir aber sind viele; uns ist das Land als Besitz gegeben worden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Menschensohn
  rationale: Die feste prophetische Anrede in Ezechiel wird knapp und traditionsgerecht wiedergegeben.
- source_word: יֹשְׁבֵי הֶחֳרָבוֹת הָאֵלֶּה
  choice: die Bewohner dieser Ruinen
  rationale: יֹשְׁבֵי bezeichnet die dort Wohnenden; חֳרָבוֹת meint verwüstete Orte beziehungsweise Ruinen.
- source_word: אֶחָד הָיָה אַבְרָהָם
  choice: Abraham war nur ein Einzelner
  rationale: אֶחָד hebt im Gegensatz zu רַבִּים die Einzahl hervor; „nur ein Einzelner“ macht den argumentativen Kontrast im Deutschen deutlich.
- source_word: וַיִּירַשׁ אֶת־הָאָרֶץ
  choice: und doch nahm er das Land in Besitz
  rationale: ירשׁ kann „in Besitz nehmen“, „besitzen“ oder „erben“ bedeuten. Hier steht Abrahams Erlangung des Landes im Kontrast zu seiner einzelnen Person; „in Besitz nehmen“ wahrt den Besitzgedanken ohne eine bestimmte Erbtheologie aufzudrängen.
- source_word: לָנוּ נִתְּנָה הָאָרֶץ לְמוֹרָשָׁה
  choice: uns ist das Land als Besitz gegeben worden
  rationale: Die passive Form נִתְּנָה bleibt erhalten; מוֹרָשָׁה bezeichnet dauerhaften Besitz beziehungsweise ein Besitzrecht.
theological_decisions:
- issue: Begründung des Anspruchs auf das Land durch Abrahams Beispiel
  choice: Die Aussage wird als wörtlich wiedergegebene Behauptung der Bewohner formuliert, ohne sie redaktionell zu bestätigen.
  alternative: Den Anspruch bereits im Vers als irrig oder vermessen kennzeichnen.
  rationale: Der hebräische Text berichtet zunächst nur ihre Argumentation; ihre göttliche Widerlegung folgt im Kontext.
- issue: Bedeutung von ירשׁ bei Abraham
  choice: „nahm ... in Besitz“
  alternative: „erbte“ oder schlicht „besaß“
  rationale: Die gewählte Formulierung bewahrt die Spannung zwischen Landverheißung und Besitz, ohne einen Erbvorgang im modernen Sinn anzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz zwischen dem einzelnen Abraham und den vielen gegenwärtigen Bewohnern wird natürlich hervorgehoben; die direkte Rede bleibt knapp und argumentativ.
