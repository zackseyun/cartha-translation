  to: 'Und du, Menschensohn, sage zu den Angehörigen deines Volkes[a]: Die Gerechtigkeit des Gerechten wird ihn am Tag seines Vergehens nicht retten; und durch die Bosheit des Gottlosen wird er nicht straucheln[b], wenn er von seiner Bosheit umkehrt. Der Gerechte aber wird am Tag seiner Sünde nicht durch sie leben können[c].'
