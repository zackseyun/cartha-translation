language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ צִדְקַ֣ת הַ/צַּדִּ֗יק לֹ֤א תַצִּילֶ֨/נּוּ֙ בְּ/י֣וֹם פִּשְׁע֔/וֹ וְ/רִשְׁעַ֤ת הָֽ/רָשָׁע֙ לֹֽא יִכָּ֣שֶׁל בָּ֔/הּ בְּ/י֖וֹם שׁוּב֣/וֹ מֵֽ/רִשְׁע֑/וֹ וְ/צַדִּ֗יק לֹ֥א יוּכַ֛ל לִֽ/חְי֥וֹת בָּ֖/הּ בְּ/י֥וֹם חֲטֹאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/012.yaml
  text: 'And you[a], son of man, say to the sons of your people: The righteousness of the righteous man will not deliver him in the day of his transgression, and the wickedness of the wicked man—he will not stumble by it in the day he turns from his wickedness[c][b]; and the righteous man will not be able to live by it in the day of his sin.'
translation:
  language: de
  text: 'Und du, Menschensohn, sage zu den Angehörigen deines Volkes[a]: Die Gerechtigkeit des Gerechten wird ihn am Tag seines Vergehens nicht retten; und durch die Bosheit des Gottlosen wird er nicht straucheln[b], wenn er von seiner Bosheit umkehrt. Der Gerechte aber wird am Tag seiner Sünde nicht durch sie leben können[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen deines Volkes“. Gemeint sind die Angehörigen des Volkes.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier das Bild des Strauchelns. „Sie“ bezieht sich auf seine Bosheit.
    reason: lexical_alternative
  - marker: c
    text: „Sie“ bezieht sich hier am ehesten auf die Gerechtigkeit des Gerechten. Seine Gerechtigkeit lässt ihn nicht leben, wenn er sündigt.
    reason: referent_ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische hebräische Anrede und ihre wiederkehrende literarische Wirkung.
- source_word: בְּנֵי עַמְּךָ
  choice: die Angehörigen deines Volkes
  rationale: Gibt die gemeinten Mitglieder des Volkes in natürlichem modernem Deutsch wieder; die wörtliche Form „Söhne deines Volkes“ wird in einer Fußnote dokumentiert.
- source_word: צִדְקַת הַצַּדִּיק
  choice: die Gerechtigkeit des Gerechten
  rationale: Bewahrt die Wortverwandtschaft und bezeichnet hier den gerechten Wandel beziehungsweise die gerechte Stellung der Person.
- source_word: תַצִּילֶנּוּ
  choice: wird ihn nicht retten
  rationale: Gibt den Hifil von נצל als Rettung aus drohendem Gericht wieder, ohne den Satz dogmatisch auszuweiten.
- source_word: בְּיוֹם פִּשְׁעוֹ
  choice: an dem Tag, an dem er sich vergeht
  rationale: Überträgt die hebräische Zeitangabe idiomatisch; פשע bezeichnet ein schweres Vergehen beziehungsweise Aufbegehren.
- source_word: רִשְׁעַת הָרָשָׁע
  choice: die Bosheit des Gottlosen
  rationale: Erhält die hebräische Wortfigur zwischen der Bosheit und dem als gottlos bezeichneten Menschen.
- source_word: יִכָּשֶׁל בָּהּ
  choice: durch sie wird er nicht zu Fall kommen
  rationale: Bewahrt das Bild des Strauchelns beziehungsweise Fallens und den femininen Rückverweis auf „Bosheit“.
- source_word: בְּיוֹם שׁוּבוֹ מֵרִשְׁעוֹ
  choice: an dem Tag, an dem er von seiner Bosheit umkehrt
  rationale: שוב mit מן bezeichnet die Abkehr vom bisherigen bösen Weg; „umkehrt“ wahrt das prophetische Umkehrmotiv.
- source_word: לֹא יוּכַל לִחְיוֹת בָּהּ
  choice: wird nicht durch sie leben können
  rationale: Gibt die ausdrücklich bezeichnete Unfähigkeit wieder und lässt den femininen pronominalen Rückverweis wie im Hebräischen stehen.
- source_word: בְּיוֹם חֲטֹאתוֹ
  choice: an dem Tag, an dem er sündigt
  rationale: Ist eine natürliche deutsche Wiedergabe der temporalen Infinitivkonstruktion und unterscheidet sie nicht künstlich von einer tatsächlichen sündigen Handlung.
theological_decisions:
- issue: Verhältnis früherer Gerechtigkeit oder Bosheit zum gegenwärtigen Verhalten
  choice: Der Text stellt fest, dass frühere Gerechtigkeit beim Vergehen nicht rettet und frühere Bosheit bei vollzogener Umkehr nicht zum Fall führt.
  alternative: Den Vers ausdrücklich als Beweis für den Verlust des Heils oder für die garantierte Beharrung der Gläubigen formulieren.
  rationale: Der hebräische Vers spricht im Rahmen prophetischer Gerichtsverkündigung von gegenwärtigem Verhalten und Umkehr. Spätere systematisch-theologische Folgerungen werden nicht in die Übersetzung eingetragen.
- issue: Bezug von בָּהּ im letzten Satzteil
  choice: Das Pronomen bleibt als „durch sie“ erhalten und verweist am ehesten auf die Gerechtigkeit des Gerechten.
  alternative: Den Bezug ausdrücklich als „durch seine Gerechtigkeit“ ausformulieren oder allgemeiner auf seinen früheren Zustand beziehen.
  rationale: Das feminine Singularpronomen ermöglicht grammatisch den Rückbezug auf צִדְקָה; seine ausdrückliche Beibehaltung wahrt zugleich die knappe, spannungsreiche Formulierung des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Parallelstruktur. Die Gedankenstrichkonstruktion erhält die hervorgehobene Voranstellung von „die Bosheit des Gottlosen“, während die temporalen Wendungen idiomatisch als „an dem Tag, an dem …“ formuliert sind.
