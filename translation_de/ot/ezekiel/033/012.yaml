    issue: „an dem Tag, an dem er sich vergeht“ für בְּיוֹם פִּשְׁעוֹ
    rationale: „Sich vergehen“ kann im Deutschen ein geringeres Fehlverhalten bezeichnen und gibt die Schwere von פשע nicht verlässlich wieder. Die nominale Wiedergabe „am Tag seines Vergehens“ ist zugleich näher am Hebräischen.
  - severity: low
    issue: „durch sie wird er nicht zu Fall kommen ...“ für יִכָּשֶׁל בָּהּ
    rationale: Die Übersetzung ist semantisch möglich, verliert aber das im hebräischen Verb enthaltene Bild des Strauchelns. „Er wird durch sie nicht straucheln“ bewahrt dieses Bild ohne Bedeutungszuwachs.
  - severity: low
    issue: Fußnote c spricht von „seiner früheren Gerechtigkeit“
    rationale: Der Rückbezug auf Gerechtigkeit ist naheliegend, aber „früher“ wird vom Text nicht ausdrücklich gesagt und sollte daher nicht als Bestandteil der Fußnotenerklärung gesetzt werden.
