base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/023.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, traditionell mit „der HERR“ wiedergegeben; hier „Jahwe“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Das Waw mit der Verbform von היה führt den nächsten Erzählabschnitt ein. In der festen prophetischen Formel ist „das Wort … erging“ eine natürliche und zugleich formnahe deutsche Wiedergabe.
- source_word: דְבַר
  choice: das Wort
  rationale: Im Status-constructus-Ausdruck דְבַר יְהוָה bezeichnet das Substantiv die prophetische Mitteilung. „Wort“ bewahrt die wiederkehrende Formel und bleibt gegenüber dem deutenderen „Botschaft“ näher am Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben. Das bewahrt den Eigennamen im Haupttext; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
- source_word: אֵלַי
  choice: an mich
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bezeichnet hier den Empfänger der Offenbarung. In Verbindung mit „erging“ ist „an mich“ idiomatisches modernes Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“ oder ein vorangestelltes „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה, nicht den Titel אֲדֹנָי. „Jahwe“ bewahrt den Eigennamen, während die traditionelle Wiedergabe „der HERR“ als Alternative in der Fußnote transparent gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „Das Wort Jahwes erging an mich“ verbindet formale Nähe mit natürlicher Lesbarkeit. Der Doppelpunkt gibt die redeeinleitende Funktion von לֵאמֹר wieder; die folgende Rede beginnt im nächsten Vers.
