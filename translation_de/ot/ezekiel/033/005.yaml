  variant: modern standard German
source:
  edition: WLC
  text: אֵת֩ ק֨וֹל הַ/שּׁוֹפָ֤ר שָׁמַע֙ וְ/לֹ֣א נִזְהָ֔ר דָּמ֖/וֹ בּ֣/וֹ יִֽהְיֶ֑ה וְ/ה֥וּא נִזְהָ֖ר נַפְשׁ֥/וֹ מִלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/005.yaml
  text: He heard the sound of the trumpet and did not take warning[a]; his blood will be upon himself. But if he takes warning[b], he will save his life.
translation:
  language: de
  text: Er hat den Klang des Horns gehört und sich nicht warnen lassen; sein Blut wird auf ihm sein.[a] Wer sich jedoch warnen lässt, rettet sein Leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Blut wird auf ihm sein“. Diese hebräische Wendung besagt, dass er die Verantwortung für seinen eigenen Tod trägt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „rettet sich selbst“ bzw. „rettet seine Person“. Das hebräische Wort bezeichnet hier das bedrohte Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  choice: den Klang des Horns
  rationale: קוֹל bezeichnet hier den hörbaren Klang, שׁוֹפָר das als Warnsignal verwendete Horn. „Klang des Horns“ bewahrt die hebräische Konstruktion und vermeidet die speziellere Festlegung auf eine moderne Trompete.
- source_word: שָׁמַע
  choice: hörte
  rationale: Das Verb bezeichnet hier die tatsächliche akustische Wahrnehmung des Warnsignals.
- source_word: נִזְהָר
  choice: ließ sich warnen
  rationale: Der Nifal von זהר meint in diesem Zusammenhang, eine Warnung anzunehmen bzw. sich durch sie warnen zu lassen. Die Formulierung wahrt sowohl die empfangene Warnung als auch die Verantwortung für die Reaktion darauf.
- source_word: דָּמוֹ בּוֹ יִהְיֶה
  choice: sein Blut wird auf ihm selbst sein
  rationale: Die hebräische Verantwortungsformel wird bildhaft bewahrt; sie besagt, dass er die Verantwortung für seinen eigenen Tod trägt.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ bezeichnet hier angesichts der drohenden Tötung das leibliche Leben, nicht eine vom Körper getrennte Seele.
- source_word: מִלֵּט
  choice: hätte ... gerettet
  rationale: Der Piel bezeichnet das Bewahren bzw. Retten aus der Todesgefahr. Im Zusammenhang mit נַפְשׁוֹ ist „sein Leben retten“ natürliches Deutsch.
- source_word: וְהוּא נִזְהָר נַפְשׁוֹ מִלֵּט
  choice: Hätte er sich aber warnen lassen, hätte er sein Leben gerettet
  rationale: Die knappe hebräische Kontrastkonstruktion stellt dem tatsächlich Ungewarnten die nicht verwirklichte Möglichkeit gegenüber. Der irreale Bedingungssatz macht diesen Sinn im Deutschen klar, ohne eine ausdrückliche hebräische Bedingungspartikel vorzutäuschen.
theological_decisions:
- issue: Verantwortungsformel im Gerichtskontext
  choice: sein Blut wird auf ihm selbst sein
  alternative: er ist selbst für seinen Tod verantwortlich
  rationale: Die Übersetzung erhält das Blutbild und damit die rechtlich-moralische Kraft der hebräischen Wendung, während die Fußnote ihre Bedeutung erläutert.
- issue: Zeit- und Bedingungsverhältnis des zweiten Satzes
  choice: 'irrealer Rückblick: „Hätte er ... hätte er ...“'
  alternative: 'allgemein-konditional: „Wenn er sich aber warnen lässt, rettet er sein Leben“'
  rationale: Der erste Satz schildert, dass der Betreffende das Signal hörte, sich aber nicht warnen ließ. Der zweite stellt kontrastierend dar, was bei Annahme der Warnung geschehen wäre. Die deutsche irreale Form bildet diesen Zusammenhang präzise ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Horn“ gibt שׁוֹפָר quellennah wieder; „ließ sich warnen“ ist verständlich und erhält den Gedanken einer Warnung, auf die verantwortlich reagiert werden muss. Die markierte Blutformel bleibt bewusst bildhaft.
