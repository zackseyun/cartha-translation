  source_fidelity: 'Der Entwurf gibt die maßgeblichen Elemente des Hebräischen wieder: die „Hand Jahwes“, den Entkommenen, das Öffnen des Mundes, den Bezug auf dessen morgendliche Ankunft sowie die beendete Stummheit. Die Formulierung „bis zu dem Zeitpunkt, als“ ist jedoch unnötig schwerfällig und kann den punktuellen Akt des Mundöffnens missverständlich als bis zum Morgen andauernden Vorgang lesen lassen. „Bis der Entkommene ... kam“ bewahrt עַד als zeitlichen Bezugspunkt knapper und ohne die umständliche Explikation.'
  naturalness: „Da war mein Mund geöffnet“ ist im modernen Standarddeutsch unidiomatisch. „Mein Mund war geöffnet“ ist natürlich und erhält sowohl die passive Form als auch die Wiederholung von „Mund“. Die direkte Akkusativkonstruktion „öffnete meinen Mund“ bildet zudem das hebräische Objekt klarer ab als der Dativ „öffnete mir den Mund“, ohne unnatürlich zu sein.
  terminology: „Jahwe“ ist eine angemessene Wiedergabe von יהוה. „Der Entkommene“ ist als Bezeichnung für הפּליט verständlich; die Fußnote dokumentiert die mögliche Wiedergabe „der Überlebende“ und „der Flüchtling“, ohne die Rolle des Mannes über die Lexik hinaus auszudeuten.
