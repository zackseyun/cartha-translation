  text: וְ/יַד יְהוָה֩ הָיְתָ֨ה אֵלַ֜/י בָּ/עֶ֗רֶב לִ/פְנֵי֙ בּ֣וֹא הַ/פָּלִ֔יט וַ/יִּפְתַּ֣ח אֶת פִּ֔/י עַד בּ֥וֹא אֵלַ֖/י בַּ/בֹּ֑קֶר וַ/יִּפָּ֣תַח פִּ֔/י וְ/לֹ֥א נֶאֱלַ֖מְתִּי עֽוֹד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/022.yaml
  text: The hand of Yahweh had been upon me in the evening[a], before the fugitive came, and he opened my mouth until he came to me in the morning. So my mouth was opened, and I was no longer mute.
translation:
  language: de
  text: Die Hand Jahwes war am Abend auf mir, bevor der Entkommene[a] kam, und er öffnete meinen Mund, bis der Entkommene am Morgen zu mir kam. Mein Mund war geöffnet, und ich war nicht länger stumm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet jemanden, der entkommen ist und überlebt hat; auch: »der Überlebende« oder »der Flüchtling«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַד יְהוָה
  choice: Die Hand Jahwes
  rationale: Bewahrt die im prophetischen Sprachgebrauch feste Metapher für Jahwes machtvolles Einwirken und gibt den Gottesnamen als persönlichen Namen wieder.
- source_word: הָיְתָה אֵלַי בָּעֶרֶב
  choice: war am Abend auf mir
  rationale: Die Zustandsaussage wird ohne unnötige Festlegung auf den Beginn des Einwirkens wiedergegeben; „auf mir“ wahrt das hebräische Bild.
- source_word: הַפָּלִיט
  choice: der Entkommene
  rationale: Bezeichnet denjenigen, der entkommen ist und überlebt hat. „Entkommene“ ist im Deutschen verständlich und vermeidet die mögliche moralische Nebenbedeutung von „Flüchtling“.
- source_word: וַיִּפְתַּח אֶת־פִּי
  choice: Er öffnete mir den Mund
  rationale: Die konkrete Metapher wird beibehalten und auf Jahwe als den aus dem Zusammenhang erschließbaren Handelnden bezogen. Die deutsche Dativkonstruktion ist idiomatisch.
- source_word: עַד בּוֹא אֵלַי בַּבֹּקֶר
  choice: bis zu dem Zeitpunkt, als jener am Morgen zu mir kam
  rationale: „Bis zu dem Zeitpunkt“ erhält עַד als zeitliche Grenze, ohne fälschlich zu behaupten, der Mund sei danach wieder geschlossen worden. „Jener“ macht im Deutschen deutlich, dass nun der Entkommene gemeint ist.
- source_word: וַיִּפָּתַח פִּי
  choice: Da war mein Mund geöffnet
  rationale: Gibt die passive Form wieder und bewahrt die Wiederholung von „Mund“, die den eingetretenen Zustand hervorhebt.
- source_word: וְלֹא נֶאֱלַמְתִּי עוֹד
  choice: und ich war nicht länger stumm
  rationale: Eine knappe, natürliche Wiedergabe der beendeten Stummheit des Propheten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn im modernen Standarddeutsch unmittelbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Handelnder bei „öffnete mir den Mund“
  choice: Jahwe ist der Handelnde
  alternative: unpersönliche oder passive Deutung
  rationale: Das männliche Verb kann sich nicht auf die feminine „Hand“ beziehen; im unmittelbaren Zusammenhang ist Jahwe der naheliegende Handelnde.
- issue: Zeitliche Bedeutung von עַד
  choice: 'zeitlicher End- bzw. Bezugspunkt: bis zu dem Zeitpunkt der morgendlichen Ankunft'
  alternative: „bevor er am Morgen zu mir kam“ oder schlicht „bis er ... kam“
  rationale: Die Formulierung bewahrt die Grundbedeutung von עַד und vermeidet zugleich die unbeabsichtigte Aussage, Ezechiels wiedergewonnene Sprachfähigkeit habe bei der Ankunft geendet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bewahrt das wiederholte Bild vom geöffneten Mund und lässt die auffällige zeitliche Formulierung mit עַד erkennbar, ohne sie konfessionell oder harmonisierend aufzulösen.
