revisions:
- from: Die Hand Jahwes war am Abend auf mir, bevor der Entkommene[a] kam. Er öffnete mir den Mund bis zu dem Zeitpunkt, als jener am Morgen zu mir kam. Da war mein Mund geöffnet, und ich war nicht länger stumm.
  to: Die Hand Jahwes war am Abend auf mir, bevor der Entkommene[a] kam, und er öffnete meinen Mund, bis der Entkommene am Morgen zu mir kam. Mein Mund war geöffnet, und ich war nicht länger stumm.
  rationale: Die Revision glättet allein sichere sprachliche Probleme. Sie wahrt die zeitliche Spannung von עַד mit „bis“, statt sie zu „bevor“ aufzulösen, und behält die wiederholte Wendung vom geöffneten Mund bei. Die Wiederholung von „der Entkommene“ folgt dem hebräischen Bezug und vermeidet das im Entwurf etwas künstliche „jener“.
