source:
  edition: WLC
  text: וּ/בְ/אָמְרִ֥/י לָֽ/רָשָׁ֖ע מ֣וֹת תָּמ֑וּת וְ/שָׁב֙ מֵֽ/חַטָּאת֔/וֹ וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/014.yaml
  text: And when I say to the wicked man[a], ‘You shall surely die,’ and he turns from his sin and does justice and righteousness,
translation:
  language: de
  text: 'Und wenn ich zu dem Gottlosen sage: »Du wirst ganz gewiss sterben«, und er sich von seiner Sünde abkehrt und Recht und Gerechtigkeit übt[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und tut das, was recht und gerecht ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאָמְרִי
  choice: Und wenn ich … sage
  rationale: Die Präposition בְּ mit dem Infinitiv und dem Suffix der 1. Person Singular hat hier temporale Bedeutung. „Wenn ich … sage“ gibt dies im Deutschen natürlich wieder.
- source_word: לָרָשָׁע
  choice: zu dem Gottlosen
  rationale: רָשָׁע bezeichnet hier einen schuldhaft bösen Menschen. „Der Gottlose“ bewahrt Singular und maskuline Form und ist im biblisch-ethischen Zusammenhang verständlich.
- source_word: מוֹת תָּמוּת
  choice: Du wirst ganz gewiss sterben
  rationale: Der Infinitivus absolutus verstärkt die finite Verbform und betont die Gewissheit des Todes. „Ganz gewiss“ bildet diese Intensivierung idiomatisch ab.
- source_word: וְשָׁב
  choice: und er … umkehrt
  rationale: וְ wird als „und“ wiedergegeben, ohne einen im Hebräischen nicht ausdrücklich markierten Gegensatz einzuführen. שׁוב bezeichnet hier die Abkehr von der bisherigen Sünde.
- source_word: מֵחַטָּאתוֹ
  choice: von seiner Sünde
  rationale: Die Singularform mit Suffix der 3. Person Singular lässt sich direkt und ohne interpretierende Erweiterung wiedergeben.
- source_word: וְעָשָׂה
  choice: und … übt
  rationale: Bei den abstrakten ethischen Begriffen „Recht und Gerechtigkeit“ ist „üben“ im Deutschen natürlicher als das wörtlichere „tun“ und bezeichnet praktisches Handeln.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  rationale: Die beiden eigenständigen ethischen Begriffe bleiben unterscheidbar. מִשְׁפָּט bezeichnet hier rechtes beziehungsweise gerechtes Handeln, צְדָקָה Gerechtigkeit oder rechtschaffenes Verhalten.
theological_decisions:
- issue: Repräsentativer maskuliner Singular für den sündigen Menschen
  choice: der Gottlose
  alternative: der böse Mensch
  rationale: Die maskuline Singularform des Hebräischen wird bewahrt. „Gottloser“ benennt im Kontext nicht bloß fehlende Religiosität, sondern den Menschen, dessen Verhalten als schuldig und böse beurteilt wird.
- issue: Unterscheidung des Begriffspaars מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: das Rechte und Gerechte
  rationale: Die substantivische Wiedergabe bewahrt die zwei eng verwandten, aber nicht identischen Begriffe und ihre ethisch-theologische Spannung.
- issue: Verknüpfung der Umkehr mit der vorausgehenden Todesankündigung
  choice: und er … umkehrt
  alternative: er aber … umkehrt
  rationale: Das einfache וְ wird formal als „und“ wiedergegeben. Der sachliche Gegensatz ergibt sich aus dem Inhalt und wird nicht durch ein zusätzliches „aber“ verstärkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wegen des versübergreifenden Zusammenhangs am Ende offen. „Ganz gewiss“ bewahrt die hebräische Verstärkung, während „Recht und Gerechtigkeit üben“ die feste ethische Wortverbindung natürlich wiedergibt.
