base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/031.yaml
  text: And they come to you as people come[a], and they sit before you as my people, and they hear your words, but they do not do them; for with their mouth they speak lustful things[b], while their heart goes after their unjust gain.
translation:
  language: de
  text: 'Sie kommen zu dir, wie eine Volksmenge kommt, und setzen sich vor dich als mein Volk. Sie hören deine Worte, doch sie handeln nicht danach. Denn mit ihrem Mund äußern sie Liebesbekundungen[a], während ihr Herz ihrem unredlichen Gewinn[b] nachläuft.


    [a] Das seltene hebräische Wort kann auch „sinnliches Verlangen“ oder möglicherweise „Liebeslieder“ bezeichnen. Gemeint sein kann, was sie mit ihrem Mund äußern, oder dass sie die Worte des Propheten wie unterhaltsame Liebesdichtung aufnehmen.


    [b] Oder „Gewinn“, „Habgier“ beziehungsweise „selbstsüchtiger Gewinn“.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann auch „sinnliches Verlangen“ oder möglicherweise „Liebeslieder“ bezeichnen. Gemeint sein kann, was sie mit ihrem Mund äußern, oder dass sie die Worte des Propheten wie unterhaltsame Liebesdichtung aufnehmen.
    reason: lexical_alternative
  - marker: b
    text: Oder „Gewinn“, „Habgier“ beziehungsweise „selbstsüchtiger Gewinn“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְבוֹא עָם
  choice: wie das Volk zusammenkommt
  rationale: Bewahrt den Vergleich und gibt das öffentliche, gemeinschaftliche Kommen idiomatisch wieder, ohne eine bestimmte kultische Versammlung vorauszusetzen.
- source_word: עַמִּי
  choice: als mein Volk
  rationale: 'Erhält die Bundesbezeichnung und zugleich die Ironie: Sie treten als Gottes Volk auf, gehorchen seinen Worten aber nicht.'
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: Sie hören deine Worte
  rationale: „Hören“ entspricht שמע und lässt den Gegensatz zwischen Hören und Tun deutlich hervortreten.
- source_word: וְאוֹתָם לֹא יַעֲשׂוּ
  choice: doch sie handeln nicht danach
  rationale: Das wörtliche „sie tun sie nicht“ wäre im Deutschen unnatürlich; „danach handeln“ bewahrt den konkreten Gegensatz zwischen Anhören und Befolgen.
- source_word: עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים
  choice: mit ihrem Mund bekunden sie leidenschaftliches Verlangen
  rationale: Die Formulierung wahrt den Bezug zum Mund und den performativen Charakter von עשה, ohne das seltene עֲגָבִים vorschnell ausschließlich als sexuelle Rede oder als Liedgattung festzulegen.
- source_word: בִצְעָם
  choice: ihrem unredlichen Gewinn
  rationale: בצע bezeichnet häufig eigennützigen oder unrechtmäßig erstrebten Gewinn; „unredlich“ erhält diese moralische Färbung.
- source_word: לִבָּם הֹלֵךְ אַחֲרֵי
  choice: ihr Herz läuft … nach
  rationale: Bewahrt das hebräische Bild innerer Ausrichtung und Begierde in verständlichem Deutsch.
theological_decisions:
- issue: Charakterisierung der Äußerungen und Wünsche des Volkes
  choice: Der Text stellt Menschen dar, die äußerlich leidenschaftliche Zuneigung oder Verlangen bekunden, deren innere Ausrichtung aber ihrem eigenen Gewinn gilt.
  alternative: Die Wendung kann enger auf sinnliche Äußerungen oder darauf bezogen werden, dass sie Ezechiels Botschaft wie ein Liebeslied zur Unterhaltung hören.
  rationale: Der unmittelbare Zusammenhang betont die Spannung zwischen äußerem Hören beziehungsweise Bekunden und ausbleibendem Gehorsam. Die Übersetzung erhält diese Spannung, ohne die seltene Wendung konfessionell oder psychologisch zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze machen den Gegensatz zwischen äußerem Auftreten, Hören und tatsächlichem Handeln deutlich. Seltene und mehrdeutige Begriffe werden im Text verständlich wiedergegeben und in den Fußnoten offengehalten.
