  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „wie eine Volksmenge kommt“ ist gegenüber „wie das Volk zusammenkommt“ sowohl näher am Vergleich als auch weniger missverständlich. „äußern sie Liebesbekundungen“ ist idiomatischer als „bekunden sie leidenschaftliches Verlangen“ und lässt die Art dieser mündlichen Äußerungen angemessen offen.
  terminology: „mein Volk“, „deine Worte“, „danach handeln“, „unredlicher Gewinn“ und „ihr Herz läuft … nach“ sind treffend. „Liebesbekundungen“ ist bei der seltenen und umstrittenen Wendung עֲגָבִים als vorsichtige Hauptlesart geeignet; die Fußnote wahrt die weiteren Möglichkeiten.
