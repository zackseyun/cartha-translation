source:
  edition: WLC
  text: בְּ/אָמְרִ֣/י לָ/רָשָׁ֗ע רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א דִבַּ֔רְתָּ לְ/הַזְהִ֥יר רָשָׁ֖ע מִ/דַּרְכּ֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/008.yaml
  text: When I say to the wicked[a], ‘Wicked one, you shall surely die,’ and you do not speak to warn the wicked from his way, that wicked man shall die in his iniquity, but I will require his blood from your hand.
translation:
  language: de
  text: 'Wenn ich zu dem Gottlosen sage: »Du Gottloser, du wirst ganz gewiss sterben!«, du aber nicht zu ihm sprichst, um ihn davor zu warnen, seinen Weg weiterzugehen, dann wird er, der Gottlose, in seiner Schuld sterben; doch sein Blut werde ich von deiner Hand fordern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ich werde dich für sein Blut zur Rechenschaft ziehen.'
    reason: Die Wendung „Blut von jemandes Hand fordern“ ist ein hebräisches Verantwortungsidiom; die Fußnote gibt ihren Sinn in heutigem Deutsch wieder.
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Wenn ich … sage
  rationale: Die Konstruktion mit בְּ und dem Infinitiv führt hier einen temporalen beziehungsweise situationsbezogenen Nebensatz ein. „Wenn ich … sage“ gibt dies im Deutschen natürlich wieder.
- source_word: לָרָשָׁע
  choice: zu dem Gottlosen
  rationale: רָשָׁע bezeichnet hier einen Menschen, dessen Lebensführung böse und schuldig ist. „der Gottlose“ wahrt die moralische Kategorie und entspricht dem Gegensatz zum Gerechten im Kontext.
- source_word: רָשָׁע
  choice: Du Gottloser
  rationale: Das Wort steht als direkte Anrede. Die Formulierung erhält deren Schärfe und macht den Bezug zum zuvor genannten Gottlosen deutlich.
- source_word: מוֹת תָּמוּת
  choice: du wirst ganz gewiss sterben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Gewissheit. „Ganz gewiss“ bildet diese Intensivierung verständlich ab, ohne eine bloße Verpflichtung auszudrücken.
- source_word: וְלֹא דִבַּרְתָּ
  choice: und du nicht redest
  rationale: Das Perfekt steht innerhalb der geschilderten Bedingungs- beziehungsweise Warnsituation. Das deutsche Präsens fügt sich natürlich an „Wenn ich … sage“ an; וְ bleibt als „und“ erhalten.
- source_word: לְהַזְהִיר
  choice: um … zu warnen
  rationale: Der Hifil von זהר bedeutet hier, jemanden zu warnen. Die finale Konstruktion ist im Deutschen idiomatisch.
- source_word: מִדַּרְכּוֹ
  choice: vor seinem Weg
  rationale: „Weg“ bewahrt das hebräische Bild für die Lebensführung. „Vor … warnen“ gibt die Funktion von מִן in dieser Verbindung natürlich wieder, ohne bereits eine ausdrückliche Umkehrhandlung in den Text einzutragen.
- source_word: הוּא רָשָׁע
  choice: er, der Gottlose
  rationale: Die Wiederaufnahme durch Pronomen und Substantiv ist betont. Die Apposition erhält diesen Nachdruck in natürlichem Deutsch.
- source_word: בַּעֲוֺנוֹ
  choice: in seiner Schuld
  rationale: עָוֹן kann sowohl Vergehen als auch daraus erwachsene Schuld bezeichnen. „In seiner Schuld“ bewahrt die knappe hebräische Fügung und lässt diese Bedeutungsbreite weitgehend bestehen.
- source_word: וְדָמוֹ
  choice: doch sein Blut
  rationale: „Sein Blut“ erhält das biblisch-forensische Bild für die Verantwortung an seinem Tod. „Doch“ verdeutlicht im Deutschen den sachlichen Gegensatz zur eigenen Schuld des Gottlosen.
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  choice: werde ich von deiner Hand fordern
  rationale: Die wörtliche Bildsprache bezeichnet göttliche Rechenschaftsforderung. Sie bleibt im Haupttext erhalten; die verständlichere Sinnwiedergabe steht in der Fußnote.
theological_decisions:
- issue: Göttliche Rechenschaft für das Versäumnis des Wächters
  choice: Der Gottlose stirbt in seiner eigenen Schuld, während der Wächter zugleich für die unterlassene Warnung zur Rechenschaft gezogen wird.
  alternative: Der Wächter trägt die Schuld des Gottlosen an dessen Stelle; oder die Rechenschaftsformel sei nur rhetorisch gemeint.
  rationale: 'Der hebräische Text stellt beide Aussagen nebeneinander: Der Gottlose stirbt „in seiner Schuld“, und sein Blut wird von der Hand des Wächters gefordert. Die Übersetzung bewahrt diese Spannung, ohne eine Aussage durch die andere aufzuheben.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bezeichnung „Gottloser“ und das Bild vom „Weg“ sowie von der Forderung des Blutes bleiben wegen ihrer rhetorischen und theologischen Funktion erhalten. Der Fußnotenmarker steht unmittelbar bei der erklärten Schlusswendung.
