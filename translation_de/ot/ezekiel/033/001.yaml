  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an mich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Konstruktion führt einen neuen Redeabschnitt ein. Zusammen mit דְבַר יְהוָה entspricht die im Deutschen übliche prophetische Formel „das Wort Jahwes erging“ dem hebräischen Sinn, ohne das schwerfällige „und es geschah“.
- source_word: דְבַר
  choice: das Wort
  rationale: „Das Wort“ bewahrt die feste prophetische Offenbarungsformel und ihre theologische Aussagekraft; „Botschaft“ wäre verständlich, aber stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: In der deutschen Formel „das Wort … erging an mich“ ist „an mich“ die natürliche Entsprechung der Präposition mit dem Suffix der ersten Person Singular.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als das formelhafte „indem er sprach“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. Die Umschrift „Jahwe“ erhält diesen Charakter und vermeidet, den Namen stillschweigend durch den Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Wendung „das Wort Jahwes erging an mich“ ist gut verständlich und wahrt die formelhafte Struktur des Hebräischen. Der Doppelpunkt kündigt die in Vers 2 folgende Gottesrede an.
