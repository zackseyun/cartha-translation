source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם אֶ֕רֶץ כִּֽי אָבִ֥יא עָלֶ֖י/הָ חָ֑רֶב וְ/לָקְח֨וּ עַם הָ/אָ֜רֶץ אִ֤ישׁ אֶחָד֙ מִ/קְצֵי/הֶ֔ם וְ/נָתְנ֥וּ אֹת֛/וֹ לָ/הֶ֖ם לְ/צֹפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/002.yaml
  text: Son of man[a], speak to the sons of your people and say to them, ‘If I bring a sword upon a land, and the people of the land take one man from among them and appoint him as their watchman,’
translation:
  language: de
  text: 'Menschensohn, rede zu den Söhnen deines Volkes und sage zu ihnen: »Wenn ich das Schwert über ein Land bringe und das Volk des Landes einen Mann aus seiner Mitte auswählt und ihn zu seinem Wächter einsetzt,«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die in Hesekiel feststehende göttliche Anrede wird in ihrer vertrauten, singularischen Form bewahrt.
- source_word: דַּבֵּר
  choice: rede
  rationale: Der schlichte Imperativ entspricht dem Grundsinn und leitet die folgende Mitteilung natürlich ein.
- source_word: בְּנֵי עַמְּךָ
  choice: die Angehörigen deines Volkes
  rationale: Die Wendung bezeichnet kollektiv die Menschen, die zu Hesekiels Volk gehören. Die natürliche deutsche Wiedergabe vermeidet das missverständliche wörtliche »Söhne deines Volkes«, ohne den Zugehörigkeitssinn einzuebnen.
- source_word: אֶרֶץ
  choice: ein Land
  rationale: Das artikellose Substantiv führt einen allgemeinen Fall ein; »Land« wahrt zugleich das biblische Sprachbild.
- source_word: כִּי
  choice: wenn
  rationale: Die Partikel eröffnet hier einen angenommenen beziehungsweise allgemeinen Fall. Deutsch »wenn« passt zur anschließenden Handlungsfolge, ohne die Aussage auf eine bloß unsichere Möglichkeit zu verengen.
- source_word: אָבִיא עָלֶיהָ חָרֶב
  choice: ich das Schwert über ein Land bringe
  rationale: Das konkrete Bild des Schwertes bleibt erhalten; der bestimmte Artikel ist im Deutschen bei diesem konventionellen Bild für Krieg oder Gericht idiomatisch.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die gewöhnliche kollektive Wendung wird transparent wiedergegeben und hier nicht als technischer Titel verstanden.
- source_word: אִישׁ אֶחָד
  choice: einen Mann
  rationale: Das ausdrücklich maskuline Singularwort wird entsprechend wiedergegeben; der Zahlbegriff »einen« ist im deutschen Akkusativ bereits enthalten.
- source_word: מִקְצֵיהֶם
  choice: aus seiner Mitte
  rationale: Die idiomatische Wendung bezeichnet die Auswahl eines Einzelnen aus der betreffenden Gemeinschaft. Das kollektive »Volk« verlangt im Deutschen den Singularbezug.
- source_word: וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה
  choice: ihn zu seinem Wächter einsetzt
  rationale: Das wörtliche Setzen beziehungsweise Geben für die Aufgabe wird als Ernennung ausgedrückt. »Wächter« bewahrt den für den Zusammenhang von Hesekiel 33 zentralen Rollenbegriff.
theological_decisions:
- issue: Geschlechtlich markierte und kollektive Sprache
  choice: »Angehörige deines Volkes« für בְּנֵי עַמְּךָ, aber »einen Mann« für אִישׁ אֶחָד
  alternative: »Söhne deines Volkes« und »einen Mann«
  rationale: בְּנֵי עַמְּךָ ist eine idiomatische kollektive Zugehörigkeitsbezeichnung und wird in natürlichem Deutsch funktionsgerecht wiedergegeben; אִישׁ אֶחָד bezeichnet dagegen ausdrücklich einen einzelnen Mann und bleibt maskulin.
- issue: Schwert als Bild für Krieg oder Gericht
  choice: Das Bild »Schwert« im Haupttext bewahren
  alternative: Deutend mit »Krieg« oder »Gericht« wiedergeben
  rationale: Der Ausgangstext nennt konkret das Schwert. Seine weiter reichende Bedeutung soll im Text nicht auf nur eine theologische Deutung festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrautem prophetischem Sprachklang. Die Satzstruktur bleibt als Beginn eines über den Vers hinausführenden Fallbeispiels offen; deshalb steht am Ende ein Komma innerhalb der fortlaufenden Rede.
