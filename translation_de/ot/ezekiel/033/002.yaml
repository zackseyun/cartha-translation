  to: 'Menschensohn, rede zu den Söhnen deines Volkes und sage zu ihnen: »Wenn ich das Schwert über ein Land bringe und das Volk des Landes einen Mann aus seiner Mitte auswählt und ihn zu seinem Wächter einsetzt,«'
  rationale: 'Nur die Wiedergabe von בְּנֵי עַמְּךָ wurde zu »Söhne deines Volkes« korrigiert, um die explizite Formulierung und maskuline Markierung des hebräischen Textes zu bewahren. Die offene Satzführung mit Schlusskomma bleibt erhalten, da der Bedingungssatz im folgenden Vers weitergeführt wird. Eine Fußnote ist nicht erforderlich: Das Bild des Schwertes bleibt im Haupttext konkret und wird nicht einseitig als Krieg oder Gericht festgelegt.'
