  text: וְ/אָמְרוּ֙ בְּנֵ֣י עַמְּ/ךָ֔ לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י וְ/הֵ֖מָּה דַּרְכָּ֥/ם לֹֽא יִתָּכֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/017.yaml
  text: Yet the sons of your people say[a], ‘The way of the Lord is not just,’ though it is their own way that is not just.
translation:
  language: de
  text: 'Doch die Angehörigen deines Volkes sagen: »Der Weg des Herrn ist nicht gerecht[a], ihr eigener Weg aber ist nicht gerecht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist nicht richtig« beziehungsweise »ist nicht angemessen«; ebenso am Ende des Verses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Doch ... sagen
  rationale: Das וְ führt die Aussage im Kontext mit einem leichten Gegensatz zur vorausgehenden göttlichen Erklärung weiter. »Doch« gibt diese adversative Nuance natürlich wieder.
- source_word: בְּנֵי עַמְּךָ
  choice: die Angehörigen deines Volkes
  rationale: Wörtlich steht »die Söhne deines Volkes«; die hebräische Wendung bezeichnet hier idiomatisch die Mitglieder des Volkes. »Angehörigen« ist im modernen Deutschen natürlich und schließt die angesprochene Gemeinschaft ein, ohne den Sinn auf leibliche Söhne zu verengen.
- source_word: לֹא יִתָּכֵן
  choice: ist nicht gerecht
  rationale: Das Nifal von תכן bezeichnet hier, dass etwas nicht recht, angemessen oder gerecht ist. Im Zusammenhang wird Gottes Gerechtigkeit angegriffen; »nicht gerecht« bringt diesen moralischen Vorwurf prägnant zum Ausdruck.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: der Weg des Herrn
  rationale: Die Formulierung bildet die hebräische Genitivverbindung klar ab und bewahrt das Leitwort »Weg« aus dem umgebenden Abschnitt.
- source_word: וְהֵמָּה
  choice: Dabei ist ihr eigener
  rationale: Das selbstständige Pronomen הֵמָּה ist betont und stellt die Menschen dem Herrn gegenüber. »Dabei« und »eigener« machen die kontrastive Rückwendung im Deutschen deutlich.
- source_word: דַּרְכָּם
  choice: ihr eigener Weg
  rationale: '»Eigener« gibt die durch וְהֵמָּה hervorgehobene Gegenüberstellung wieder: Nicht der Weg des Herrn, sondern ihr Weg trägt den beanstandeten Mangel.'
theological_decisions:
- issue: Moralische Beurteilung des Weges des Herrn
  choice: יִתָּכֵן in beiden Sätzen mit »ist nicht gerecht« wiedergeben
  alternative: »ist nicht richtig« oder »ist nicht angemessen«
  rationale: Der Zusammenhang von Hesekiel 33 behandelt göttliche Gerechtigkeit und menschliche Verantwortung. Die gleiche Wiedergabe in beiden Sätzen bewahrt die rhetorische Umkehr des hebräischen Textes, ohne sie dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und anklagend; der zweite Satz bewahrt durch »Dabei« und »eigener« den betonten Gegensatz des Hebräischen.
