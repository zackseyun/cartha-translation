  text: בְּ/אָמְרִ֤/י לַ/צַּדִּיק֙ חָיֹ֣ה יִֽחְיֶ֔ה וְ/הֽוּא בָטַ֥ח עַל צִדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל כָּל צדקת/ו לֹ֣א תִזָּכַ֔רְנָה וּ/בְ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה בּ֥/וֹ יָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/013.yaml
  text: When I say to the righteous man[a], ‘He shall surely live,’ and he trusts in his righteousness and does injustice, none of his righteous deeds will be remembered[b], but by the injustice that he has done he shall die.
translation:
  language: de
  text: 'Wenn ich zum Gerechten sage: »Er wird ganz gewiss leben«, und er sich aber auf seine Gerechtigkeit verlässt und Unrecht tut, dann wird an keine seiner gerechten Taten[a] gedacht werden. Wegen des Unrechts, das er getan hat, wird er sterben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keine seiner gerechten Taten wird in Erinnerung bleiben.“ Der hebräische Plural kann seine Gerechtigkeit in einzelnen Taten oder als Gesamtheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Darin wird er sterben“ oder „Dadurch wird er sterben“; das Pronomen bezieht sich auf das Unrecht, das er getan hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי לַצַּדִּיק
  choice: Wenn ich zu dem Gerechten sage
  rationale: Die Konstruktion mit ב und der Form von אמר samt Suffix leitet einen temporalen Nebensatz ein. לַצַּדִּיק bezeichnet den Adressaten als einen gerechten Menschen; die substantivierte Form „der Gerechte“ ist im Deutschen natürlich und wahrt den maskulinen Singular.
- source_word: חָיֹה יִחְיֶה
  choice: Er wird ganz gewiss leben
  rationale: Der Infinitivus absolutus vor dem Imperfekt verstärkt die Aussage. „Ganz gewiss“ gibt diese emphatische Bekräftigung in heutigem Deutsch wieder.
- source_word: בָטַח עַל צִדְקָתוֹ
  choice: er sich aber auf seine Gerechtigkeit verlässt
  rationale: בטח mit על bezeichnet Vertrauen beziehungsweise Sichverlassen auf etwas. „Sich auf … verlassen“ drückt die fehlgeleitete Zuversicht klar aus; „aber“ markiert den im Zusammenhang liegenden Gegensatz.
- source_word: וְעָשָׂה עָוֶל
  choice: und Unrecht tut
  rationale: עָוֶל bezeichnet Unrecht oder ungerechtes Handeln. „Unrecht tun“ ist präzise, verständlich und ermöglicht die Wiederaufnahme desselben Wortes im Schlusssatz.
- source_word: כָּל צִדְקֹתָו לֹא תִזָּכַרְנָה
  choice: dann wird an keine seiner gerechten Taten mehr gedacht werden
  rationale: Der Plural צִדְקֹתָו kann konkrete gerechte Taten bezeichnen. Unter der Verneinung gibt „keine seiner gerechten Taten“ den Sinn idiomatisch wieder; das passive „gedacht werden“ entspricht dem Nifal von זכר. „Dann“ verdeutlicht die Folgerung, ohne eine zusätzliche Bedingung einzuführen.
- source_word: וּבְעַוְלוֹ אֲשֶׁר עָשָׂה
  choice: Wegen des Unrechts, das er getan hat
  rationale: ב kann hier die Grundlage oder Ursache des Sterbens bezeichnen. Die Formulierung wahrt die Wiederholung von עָוֶל und gibt den Relativsatz unmittelbar wieder.
- source_word: בּוֹ יָמוּת
  choice: wird er sterben
  rationale: Das pronominale בּוֹ verweist wahrscheinlich auf das begangene Unrecht; sein kausaler beziehungsweise sphärischer Gehalt ist bereits durch „wegen des Unrechts“ ausgedrückt. Eine Fußnote bewahrt die formaleren Möglichkeiten „darin“ und „dadurch“.
theological_decisions:
- issue: Ob die Warnung im Sinn eines bestimmten Lehrsystems über Beharren oder Abfall aufgelöst werden soll
  choice: Die Aussage wird als wirkliche gerichtliche Warnung an den Gerechten wiedergegeben, der sich auf seine Gerechtigkeit verlässt und Unrecht tut.
  alternative: Die Warnung ausdrücklich als Verlust eines bestimmten Heilsstands oder lediglich als hypothetischen Fall deuten.
  rationale: Der hebräische Text erklärt, dass frühere gerechte Taten in diesem Fall nicht erinnert werden und der Betreffende wegen seines Unrechts stirbt. Die Übersetzung lässt diese Spannung stehen und führt keine späteren systematisch-theologischen Kategorien ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante dritte Person in der direkten Rede („Er wird … leben“) bleibt entsprechend dem Hebräischen erhalten. Die Wiederholung von „Unrecht“ bildet die lexikalische Klammer des Ausgangstextes nach.
