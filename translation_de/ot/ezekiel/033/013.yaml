  naturalness: 'Die derzeitige Satzfügung ist nach dem Zitat nicht vollständig: „Wenn ich ... sage ..., er sich aber ... verlässt“ verbindet zwei finite Teilsätze ohne passende Konjunktion. Eine geringfügige Umstellung mit „und er“ stellt eine natürliche und klare deutsche Konditionalsatzstruktur her. Außerdem ist „mehr“ nicht ausdrücklich im Hebräischen enthalten und sollte nicht ergänzt werden.'
