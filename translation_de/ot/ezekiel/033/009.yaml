source:
  edition: WLC
  text: וְ֠/אַתָּה כִּֽי הִזְהַ֨רְתָּ רָשָׁ֤ע מִ/דַּרְכּ/וֹ֙ לָ/שׁ֣וּב מִמֶּ֔/נָּה וְ/לֹא שָׁ֖ב מִ/דַּרְכּ֑/וֹ ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/009.yaml
  text: But if you warn a wicked man to turn from his way[a], and he does not turn from his way, he will die in his iniquity[b]; but you will have delivered your soul.
translation:
  language: de
  text: Wenn du aber den Gottlosen warnst, von seinem Weg umzukehren, und er von seinem Weg nicht umkehrt, wird er in seiner Schuld sterben[a]; du aber hast dein Leben[b] gerettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wegen seiner Schuld sterben“.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch mit „deine Seele“ wiedergegeben werden; hier bezeichnet es das eigene Leben oder die eigene Person.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: warnst
  rationale: Der Hifil von זהר bedeutet hier im Zusammenhang des Wächteramtes „warnen“. Das Präsens fügt sich im Deutschen natürlich in den Bedingungssatz ein.
- source_word: רָשָׁע
  choice: den Gottlosen
  rationale: Das substantivierte maskuline Singularwort bezeichnet hier den einzelnen schuldigen beziehungsweise bösen Menschen; „der Gottlose“ bewahrt die moralische Aussage und die Einzahl.
- source_word: מִדַּרְכּוֹ ... לָשׁוּב מִמֶּנָּה
  choice: von seinem Weg umzukehren
  rationale: „Weg“ bewahrt das ethische Bild für Lebensführung, und „umkehren“ gibt שׁוב im prophetischen Sprachgebrauch prägnant wieder.
- source_word: וְלֹא שָׁב מִדַּרְכּוֹ
  choice: und er von seinem Weg nicht umkehrt
  rationale: Die Wiederholung von „seinem Weg“ entspricht der hebräischen Wiederholung und hält die ethische Wegmetapher ausdrücklich fest.
- source_word: בַּעֲוֺנוֹ
  choice: in seiner Schuld
  rationale: Die Wiedergabe wahrt die knappe Formulierung mit ב und lässt sowohl den Zustand als auch den ursächlichen Zusammenhang der Schuld anklingen.
- source_word: נַפְשְׁךָ הִצַּלְתָּ
  choice: hast dein Leben gerettet
  rationale: נֶפֶשׁ meint hier im Zusammenhang von Todesgefahr und Verantwortlichkeit das eigene Leben beziehungsweise die eigene Person, nicht notwendig eine vom Körper getrennte Seele. Das deutsche Perfekt gibt die vollzogene Entlastung im Bedingungsfall natürlich wieder.
- source_word: וְאַתָּה ... וְאַתָּה
  choice: Wenn du aber ... du aber
  rationale: Die wiederholten Personalpronomen sind betont. Die deutsche Stellung von „aber“ macht sowohl den Bezug zum vorherigen Gegensatz als auch den Kontrast zwischen dem Schicksal des Gottlosen und der Verantwortung des Wächters deutlich.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Schlusssatz
  choice: „dein Leben“ als das bewahrte eigene Leben beziehungsweise die eigene Person
  alternative: „deine Seele“ oder „dich selbst“
  rationale: Der Zusammenhang handelt von der Verantwortlichkeit des Wächters angesichts drohenden Todes. „Leben“ vermeidet, dem Ausdruck ohne textlichen Zwang eine spätere metaphysische Unterscheidung von Seele und Körper aufzuerlegen.
- issue: Zusammenhang zwischen Schuld und Tod
  choice: „in seiner Schuld sterben“
  alternative: „wegen seiner Schuld sterben“
  rationale: 'Die gewählte Form wahrt die Mehrdeutigkeit der hebräischen Präposition: Der Gottlose stirbt in dem Zustand seiner Schuld, wobei zugleich ein ursächlicher Sinn möglich bleibt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „von seinem Weg“ und der Gegensatz „du aber“ wurden bewusst beibehalten; unnötige konfessionelle oder anthropologische Festlegungen wurden vermieden.
