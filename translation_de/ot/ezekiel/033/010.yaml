source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹר֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֵּ֤ן אֲמַרְתֶּם֙ לֵ/אמֹ֔ר כִּֽי פְשָׁעֵ֥י/נוּ וְ/חַטֹּאתֵ֖י/נוּ עָלֵ֑י/נוּ וּ/בָ֛/ם אֲנַ֥חְנוּ נְמַקִּ֖ים וְ/אֵ֥יךְ נִֽחְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/010.yaml
  text: 'And you[a], son of man, say to the house of Israel, ‘Thus you have said: “Surely our transgressions and our sins are upon us, and in them we are wasting away; so how can we live?”’'
translation:
  language: de
  text: 'Und du, Menschensohn, sag zum Haus Israel: So habt ihr gesagt: »Unsere Vergehen und unsere Sünden lasten auf uns, und in ihnen vergehen wir.[a] Wie können wir da noch leben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und durch sie schwinden wir dahin«; auch: »und in ihnen verfaulen wir«. Das hebräische Verb kann Dahinschwinden, Verfall oder Verfaulen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische, wörtlich bildhafte Anrede und den würdevollen prophetischen Sprachgebrauch.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Erhält den kollektiven Bundesausdruck und das hebräische Bild, statt ihn zu »Volk Israel« zu verflachen.
- source_word: כֵּן אֲמַרְתֶּם
  choice: So habt ihr gesagt
  rationale: Gibt den demonstrativen bzw. rückverweisenden Sinn von כֵּן formal und im Deutschen verständlich wieder.
- source_word: פְשָׁעֵינוּ
  choice: unsere Vergehen
  rationale: Bezeichnet schuldhafte Übertretungen und wahrt zusammen mit »Sünden« die zweigliedrige hebräische Formulierung; »Auflehnungen« wäre stärker interpretierend.
- source_word: חַטֹּאתֵינוּ
  choice: unsere Sünden
  rationale: Direkte und im heutigen Deutsch klare Wiedergabe des gebräuchlichen Begriffs für Sünden.
- source_word: עָלֵינוּ
  choice: lasten auf uns
  rationale: Bewahrt das Bild einer auf den Sprechern liegenden Schuld und Folge, klingt dabei natürlicher als das wörtliche »sind auf uns«.
- source_word: וּבָם
  choice: durch sie
  rationale: Das ב kann hier den Bereich oder die Ursache des Dahinschwindens bezeichnen. »Durch sie« ist im Deutschen verständlich, ohne den Zusammenhang auf eine einzige dogmatische Deutung festzulegen.
- source_word: נְמַקִּים
  choice: schwinden wir dahin
  rationale: Der Ausdruck vermittelt fortschreitenden Verfall bzw. ein Zugrundegehen unter Schuld und Gericht, ohne die stärker körperliche Lesart »verfaulen« in den Haupttext zu setzen.
- source_word: וְאֵיךְ נִחְיֶה
  choice: Wie können wir da noch leben?
  rationale: Gibt die aus dem Vorangehenden folgende, verzweifelte Frage in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bekenntnis der Schuld oder Verzweiflung unter dem Gericht
  choice: Die Aussage klingt zugleich wie ein Eingeständnis der Schuld und wie eine verzweifelte Frage nach einer noch möglichen Zukunft.
  alternative: Die Worte ausschließlich als reines Schuldbekenntnis ohne Hoffnungslosigkeit wiederzugeben.
  rationale: Das fortdauernde Dahinschwinden und die Schlussfrage zeigen eine Spannung zwischen Schuldanerkenntnis und Verzweiflung. Der Vers selbst beantwortet diese Frage noch nicht; die Übersetzung löst sie daher nicht vorzeitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Ton. Die feste Ezechiel-Anrede »Menschensohn« und der Ausdruck »Haus Israel« bleiben erhalten; ungebräuchliche Satzstellungen wurden vermieden.
