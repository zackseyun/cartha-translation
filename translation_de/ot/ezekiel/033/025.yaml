source:
  edition: WLC
  text: לָ/כֵן֩ אֱמֹ֨ר אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה עַל הַ/דָּ֧ם תֹּאכֵ֛לוּ וְ/עֵינֵ/כֶ֛ם תִּשְׂא֥וּ אֶל גִּלּוּלֵי/כֶ֖ם וְ/דָ֣ם תִּשְׁפֹּ֑כוּ וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/025.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: You eat with the blood, and you lift up your eyes to your idols, and you shed blood[c][b]; shall you then possess the land?’'
translation:
  language: de
  text: 'Darum sag zu ihnen: ›So spricht Gott, der HERR: Ihr esst Fleisch mit dem Blut[a], ihr richtet eure Augen auf eure Götzen[b] und vergießt Blut – und da wollt ihr das Land in Besitz nehmen?[c]‹'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ihr esst über/bei dem Blut.« Gemeint ist wahrscheinlich, dass sie Fleisch essen, in dem noch Blut ist, und so das Verbot missachten, Blut zu verzehren.'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete hebräische Wort für »Götzen« ist eine bewusst verächtliche Bezeichnung.
    reason: cultural_note
  - marker: c
    text: 'Oder, der Form nach: »und ihr nehmt das Land in Besitz«. Im Zusammenhang ist die Aussage wahrscheinlich als empörte rhetorische Frage zu verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und natürlich wieder und verbindet die Anweisung mit dem vorausgehenden Zusammenhang.
- source_word: אֱמֹר אֲלֵיהֶם
  choice: sag zu ihnen
  rationale: Bewahrt den direkten prophetischen Redeauftrag in natürlichem modernem Deutsch.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: So spricht Gott, der HERR
  rationale: Die geläufige deutsche Prophetenformel wahrt die Unterscheidung zwischen אֲדֹנָי und dem Gottesnamen יהוה; die Kapitälchen werden durch Großschreibung angedeutet.
- source_word: עַל הַדָּם תֹּאכֵלוּ
  choice: Ihr esst Fleisch mit dem Blut
  rationale: עַל bezeichnet hier wahrscheinlich das Essen von Fleisch mitsamt seinem Blut. Das ergänzte „Fleisch“ macht den gemeinten Vorgang auf Deutsch verständlich, ohne die kultische Aussage weiter auszudeuten.
- source_word: וְעֵינֵיכֶם תִּשְׂאוּ אֶל גִּלּוּלֵיכֶם
  choice: ihr richtet eure Augen auf eure Götzen
  rationale: Gibt das hebräische Bild des Erhebens bzw. Ausrichtens der Augen verständlich wieder und lässt die religiöse Hinwendung erkennen.
- source_word: גִּלּוּלֵיכֶם
  choice: eure Götzen
  rationale: „Götzen“ ist die natürliche deutsche Entsprechung; der im Hebräischen deutlich verächtliche Beiklang wird in einer Fußnote ausgewiesen.
- source_word: וְדָם תִּשְׁפֹּכוּ
  choice: und vergießt Blut
  rationale: „Blut vergießen“ ist die etablierte deutsche Wendung für gewaltsames Töten und entspricht dem hebräischen Ausdruck.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: und da wollt ihr das Land in Besitz nehmen?
  rationale: Die rhetorische Frage bringt im Kontext den empörten Widerspruch zwischen ihrem Verhalten und ihrem Anspruch auf das Land zum Ausdruck; „in Besitz nehmen“ deckt die Bedeutung von ירשׁ ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr JHWH / Herr Jahwe
  rationale: Die traditionelle deutsche Kennzeichnung des Tetragramms als HERR unterscheidet es von אֲדֹנָי; „Gott, der HERR“ vermeidet im Deutschen die schwer verständliche Doppelung „Herr HERR“, ohne den Gottesnamen als bloßen Titel zu behandeln.
- issue: Satzart von וְהָאָרֶץ תִּירָשׁוּ
  choice: rhetorische Frage
  alternative: 'Aussage: „und ihr nehmt das Land in Besitz“'
  rationale: Obwohl kein ausdrückliches Fragewort steht, verlangen Anklage und Folgekontext eine empörte rhetorische Herausforderung. Die alternative formale Lesart wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger prophetischer Formel. Die direkte Anrede bleibt prägnant; Gedankenstrich und rhetorische Frage bilden die anklagende Steigerung des Hebräischen ab. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
