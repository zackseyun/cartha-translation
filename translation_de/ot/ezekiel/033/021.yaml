  source_fidelity: Die Datierung muss syntaktisch eindeutig als „im zwölften Jahr unserer Verbannung“ wiedergegeben werden; in der vorliegenden Stellung kann „unserer Verbannung“ im Deutschen auf „Monat“ bezogen werden. Für הֻכְּתָה ist „ist zu Fall gebracht worden“ zudem stärker kausativ und deutet eine Herbeiführung durch einen nicht genannten Akteur an. „ist geschlagen worden“ bewahrt den passiven Charakter und das Gewaltbild des hebräischen Hophal unmittelbar.
  naturalness: „Und es geschah“ und die übrige Erzählführung sind würdiges, verständliches modernes Standarddeutsch. Die umgestellte Datierung ist zugleich idiomatischer und eindeutiger. „Die Stadt ist geschlagen worden“ ist bewusst bildhaft, im prophetischen Kontext jedoch verständlich; die Fußnote bietet die geläufigere kontextuelle Alternative.
  terminology: „Verbannung“ ist für גָּלוּתֵנוּ vertretbar und „der Entkommene“ gibt הַפָּלִיט ohne die heutige strafrechtliche Nebenbedeutung von „Flüchtiger“ passend wieder. Jerusalem und „die Stadt“ sind korrekt behandelt. Die Fußnotenanker stehen bei den jeweils erläuterten Ausdrücken.
