  text: וַ/יְהִ֞י בִּ/שְׁתֵּ֧י עֶשְׂרֵ֣ה שָׁנָ֗ה בָּ/עֲשִׂרִ֛י בַּ/חֲמִשָּׁ֥ה לַ/חֹ֖דֶשׁ לְ/גָלוּתֵ֑/נוּ בָּא אֵלַ֨/י הַ/פָּלִ֧יט מִ/ירוּשָׁלִַ֛ם לֵ/אמֹ֖ר הֻכְּתָ֥ה הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/021.yaml
  text: And it happened in the twelfth year[a], in the tenth month, on the fifth day of the month of our exile, that the fugitive from Jerusalem came to me, saying[b], “The city has been struck down.”
translation:
  language: de
  text: 'Und es geschah im zwölften Jahr unserer Verbannung, im zehnten Monat, am fünften Tag des Monats: Der Entkommene[a] aus Jerusalem kam zu mir und sagte: »Die Stadt ist geschlagen worden.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Überlebende aus Jerusalem«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Die Stadt ist gefallen.« Das Hebräische lautet wörtlicher: »Die Stadt ist geschlagen worden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die geläufige deutsche Erzählformel gibt die fortführende und zugleich einen neuen Abschnitt eröffnende Funktion des hebräischen Wayyiqtol würdig und knapp wieder.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: im zwölften Jahr
  rationale: Entspricht der hebräischen Datierungsformel in idiomatischem Standarddeutsch.
- source_word: בָּעֲשִׂרִי
  choice: im zehnten Monat
  rationale: Das im Hebräischen aus dem Folgenden zu ergänzende Wort »Monat« wird für eine klare deutsche Datumsangabe ausdrücklich genannt.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: am fünften Tag des Monats
  rationale: Natürliche deutsche Wiedergabe der hebräischen Datierungsformel; »Tag« ist sinngemäß ergänzt.
- source_word: לְגָלוּתֵנוּ
  choice: unserer Verbannung
  rationale: »Verbannung« bezeichnet hier verständlich den Zustand der Deportation und bewahrt den erzwungenen Charakter des Exils.
- source_word: הַפָּלִיט
  choice: der Entkommene
  rationale: Das Substantiv bezeichnet jemanden, der einer Katastrophe entronnen ist. »Entkommene« vermeidet die im heutigen Deutsch mögliche kriminelle Nebenbedeutung von »Flüchtige«; »Überlebende« bleibt eine kontextuell mögliche Alternative.
- source_word: מִירוּשָׁלִַם
  choice: aus Jerusalem
  rationale: Direkte und idiomatische Wiedergabe der Herkunftsangabe.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die deutsche finite Form führt die direkte Rede natürlicher ein als eine formale Wiedergabe mit »indem er sagte«.
- source_word: הֻכְּתָה
  choice: ist zu Fall gebracht worden
  rationale: Die Formulierung bewahrt sowohl das Passiv als auch das Bild des hebräischen Verbs נכה, bleibt bei einer Stadt aber verständlicher als das missverständliche »niedergeschlagen worden«.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Der bestimmte Ausdruck wird beibehalten; aus dem Zusammenhang ist Jerusalem gemeint, doch der hebräische Text nennt hier nicht nochmals den Eigennamen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Datumsformel bleibt vollständig erhalten. Die direkte Rede ist natürlich eingebunden, während beim Fall Jerusalems das hebräische Passiv und sein gewaltsames Bild bewusst nicht in eine bloße Zustandsaussage aufgelöst werden.
