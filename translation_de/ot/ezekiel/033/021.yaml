  to: 'Und es geschah im zwölften Jahr unserer Verbannung, im zehnten Monat, am fünften Tag des Monats: Der Entkommene[a] aus Jerusalem kam zu mir und sagte: »Die Stadt ist geschlagen worden.«[b]'
