    issue: „hinwegrafft/hingerafft“ für לקח
    rationale: Das Verb לקח bedeutet hier „nehmen“ bzw. „wegnehmen“. „Hinwegraffen“ legt eine zusätzliche Vorstellung eines jähen, vernichtenden Zugriffs nahe und verdeckt zudem die bewusst wiederholte Verbverbindung zwischen dem Nehmen durch das Schwert und dem Weggenommenwerden der einzelnen Person.
  - severity: low
    issue: „sodass das Volk nicht gewarnt wird“
    rationale: Die Formulierung stellt den Zusammenhang als ausdrücklich konsekutiv dar. Der hebräische Text reiht die Aussagen mit ו aneinander; eine Koordination bewahrt sowohl den Textfluss als auch die lexikalische Möglichkeit „das Volk achtet nicht auf die Warnung“ besser.
  - severity: low
    issue: „ins Schofarhorn stößt“
    rationale: „Das Schofar blasen“ ist die geläufigere moderne deutsche Wiedergabe des Signalidioms. Da ein Schofar ein Horn ist, ist „Schofarhorn“ zudem redundant.
