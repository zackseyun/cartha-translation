revisions:
- from: Wenn aber der Wächter das Schwert kommen sieht und nicht ins Schofarhorn stößt, sodass das Volk nicht gewarnt wird[a], und das Schwert kommt und einen Menschen aus ihrer Mitte hinwegrafft, dann wird dieser in seiner Schuld hinweggerafft; doch sein Blut werde ich von der Hand des Wächters fordern.[b]
  to: Wenn aber der Wächter das Schwert kommen sieht und das Schofar nicht bläst und das Volk nicht gewarnt wird[a], dann kommt das Schwert und nimmt einen Menschen aus ihrer Mitte; dieser wird in seiner Schuld weggenommen. Sein Blut aber werde ich von der Hand des Wächters fordern.[b]
  rationale: Die Revision vermeidet unnötige semantische Verstärkungen und macht die deutsche Formulierung idiomatischer, ohne die Bildsprache oder die rechtliche Verantwortungsformel aufzugeben. Die koordinierte Satzfolge wahrt die hebräische Syntax und die Ambiguität von נִזְהָר; die Fußnote erläutert die alternative Lesart. Die beiden Aussagen über die Schuld der weggenommenen Person und die Verantwortlichkeit des Wächters bleiben nebeneinander bestehen.
