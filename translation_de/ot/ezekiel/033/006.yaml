source:
  edition: WLC
  text: וְ֠/הַ/צֹּפֶה כִּֽי יִרְאֶ֨ה אֶת הַ/חֶ֜רֶב בָּאָ֗ה וְ/לֹֽא תָקַ֤ע בַּ/שּׁוֹפָר֙ וְ/הָ/עָ֣ם לֹֽא נִזְהָ֔ר וַ/תָּב֣וֹא חֶ֔רֶב וַ/תִּקַּ֥ח מֵ/הֶ֖ם נָ֑פֶשׁ ה֚וּא בַּ/עֲוֺנ֣/וֹ נִלְקָ֔ח וְ/דָמ֖/וֹ מִ/יַּֽד הַ/צֹּפֶ֥ה אֶדְרֹֽשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/006.yaml
  text: But if the watchman sees the sword coming and does not blow the trumpet[a], and the people are not warned, and the sword comes and takes a life from among them, that one is taken away in his iniquity[b], but I will require his blood from the watchman's hand.
translation:
  language: de
  text: Wenn aber der Wächter das Schwert kommen sieht und das Schofar nicht bläst und das Volk nicht gewarnt wird[a], dann kommt das Schwert und nimmt einen Menschen aus ihrer Mitte; dieser wird in seiner Schuld weggenommen. Sein Blut aber werde ich von der Hand des Wächters fordern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das Volk nicht auf die Warnung achtet“. Das Hebräische kann sowohl das Ausbleiben einer Warnung als auch das Nichtbeachten einer Warnung ausdrücken. Der Haupttext folgt dem Nachdruck auf dem Versäumnis des Wächters, das Schofar zu blasen.'
    reason: lexical_alternative
  - marker: b
    text: „Sein Blut von der Hand des Wächters fordern“ ist eine rechtliche Ausdrucksweise dafür, den Wächter für den Tod zur Rechenschaft zu ziehen.
    reason: cultural_note
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: der Wächter
  rationale: צֹפֶה bezeichnet jemanden, der Ausschau hält und Wache steht. „Wächter“ ist im Deutschen natürlich und bewahrt das prophetische Bild.
- source_word: כִּי יִרְאֶה
  choice: wenn ... sieht
  rationale: כִּי leitet hier innerhalb einer Fallbeschreibung eine Bedingung ein; „wenn“ gibt diese Struktur angemessen wieder.
- source_word: הַחֶרֶב בָּאָה
  choice: das Schwert kommen sieht
  rationale: Das konkrete Bild des kommenden Schwertes wird beibehalten, auch wenn es für Krieg oder gewaltsames Gericht stehen kann.
- source_word: תָקַע בַּשּׁוֹפָר
  choice: ins Schofarhorn stößt
  rationale: תקע bezeichnet das Blasen beziehungsweise Stoßen in ein Signalinstrument. „Schofarhorn“ benennt das konkrete Instrument und bleibt allgemein verständlich.
- source_word: וְהָעָם לֹא נִזְהָר
  choice: sodass das Volk nicht gewarnt wird
  rationale: Der Nifal von זהר kann sowohl das Gewarntwerden als auch das Beachten einer Warnung ausdrücken. Im Zusammenhang hebt der Text die unterlassene Warnung des Wächters hervor; „sodass“ macht diese Folge natürlich deutlich, ohne die lexikalische Alternative zu verschweigen.
- source_word: וַתִּקַּח מֵהֶם נָפֶשׁ
  choice: einen Menschen aus ihrer Mitte hinwegrafft
  rationale: נֶפֶשׁ bezeichnet hier eine einzelne Person beziehungsweise ein Menschenleben. „Hinwegraffen“ gibt im Zusammenhang mit dem Schwert den tödlichen Vorgang idiomatisch wieder.
- source_word: הוּא בַּעֲוֺנוֹ נִלְקָח
  choice: dann wird dieser in seiner Schuld hinweggerafft
  rationale: „Dieser“ nimmt die zuvor genannte Einzelperson wieder auf. „In seiner Schuld“ bewahrt die knappe Mehrdeutigkeit von עָוֹן zwischen Vergehen und daraus erwachsener Schuld; נלקח bezeichnet hier das tödliche Wegnehmen.
- source_word: וְדָמוֹ מִיַּד הַצֹּפֶה אֶדְרֹשׁ
  choice: doch sein Blut werde ich von der Hand des Wächters fordern
  rationale: Die wörtliche Bildsprache wird bewahrt. דרשׁ mit מיד ist eine rechtliche Wendung für das Einfordern von Rechenschaft wegen eines Todes.
theological_decisions:
- issue: Verantwortung des Wächters und Schuld des Getöteten
  choice: Der Getötete wird in seiner eigenen Schuld hinweggerafft, zugleich zieht Gott den Wächter wegen der unterlassenen Warnung zur Rechenschaft.
  alternative: Der Wächter übernimmt die Schuld des Getöteten oder ist alleinige Ursache seines Gerichts.
  rationale: Der hebräische Text stellt beide Aussagen ausdrücklich nebeneinander. Die Übersetzung bewahrt diese Spannung und deutet sie weder als Übertragung persönlicher Schuld noch als Aufhebung der Verantwortung des Getöteten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der hebräischen Fallbeschreibung, wird aber durch „sodass“ und „dann“ für heutige Leser übersichtlich gegliedert. Das konkrete Bild von Wächter, Schwert, Schofarhorn, Blut und Hand bleibt erhalten.
