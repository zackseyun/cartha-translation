  verdict: revise
  source_fidelity: 'Die Grundstruktur und der Sinn sind zutreffend wiedergegeben: Das angekündigte Geschehen tritt ein, und daraufhin erkennen die Angesprochenen, dass ein Prophet unter ihnen war. Das einleitende „aber“ hat jedoch keine klare Entsprechung im hebräischen וְ und erzeugt einen nicht begründeten Gegensatz. Außerdem sollte die zweite Verbform בָאָה als gegenwärtig-unmittelbares „es kommt“ erkennbar bleiben, statt sie erneut mit „es trifft ein“ gleichzusetzen.'
  naturalness: Der Satz ist grundsätzlich verständlich und würdig. Die Kombination „—, dann“ nach einem eingeschobenen Ausruf ist typografisch und stilistisch unnötig schwerfällig. Mit Halbgeviertstrichen ohne die zusätzlichen Kommas liest sich der Satz im modernen Standarddeutsch flüssiger.
  terminology: „Prophet“ und „unter ihnen“ sind sachgerecht. „Erkennen“ gibt וְיָדְעוּ angemessen wieder. Das neutrale „es“ wahrt die im Vers nicht ausdrücklich benannte feminine Rückbeziehung, ohne sie auslegend festzulegen.
  issues:
  - severity: low
    issue: Unbegründetes „aber“ im Satzanfang
    rationale: Das einleitende וְ verbindet den Satz mit dem Vorhergehenden, markiert hier aber keinen adversativen Gegensatz. „Aber“ sollte daher entfallen.
  - severity: low
    issue: Die zweite Wiederaufnahme von בוא wird zu stark vereinheitlicht
    rationale: In הִנֵּה בָאָה betont die gegenwärtige Form das unmittelbare Herankommen. „Sieh, es kommt!“ bewahrt dies besser als die Wiederholung „es trifft ein!“.
  - severity: low
    issue: Interpunktionsgestaltung des Einschubs
    rationale: Die Kommas unmittelbar nach bzw. vor den Gedankenstrichen sind im Deutschen bei diesem Einschub nicht erforderlich und beeinträchtigen den Lesefluss.
  revised_text: Wenn es eintrifft – sieh, es kommt! –, dann werden sie erkennen, dass ein Prophet unter ihnen gewesen ist.
