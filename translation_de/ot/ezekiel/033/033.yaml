source:
  edition: WLC
  text: וּ/בְ/בֹאָ֑/הּ הִנֵּ֣ה בָאָ֔ה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/033.yaml
  text: When it comes—and look, it is coming—then they will know that a prophet has been among them.
translation:
  language: de
  text: Wenn es eintrifft – sieh, es kommt! –, dann werden sie erkennen, dass ein Prophet unter ihnen gewesen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: Wenn es aber eintrifft
  rationale: Die Konstruktion bezeichnet den Zeitpunkt, an dem das zuvor Angekündigte eintritt. Das Pronomen ist im Hebräischen feminin und nimmt sinngemäß die angekündigte Botschaft bzw. das Geschehen auf; das neutrale „es“ bewahrt diese Offenheit im Deutschen.
- source_word: הִנֵּה בָאָה
  choice: sieh, es trifft ein!
  rationale: הִנֵּה setzt einen nachdrücklichen Aufmerksamkeitshinweis; „sieh“ ist würdig und unmittelbar. Das präsentische בָאָה unterstreicht die Gewissheit und Unmittelbarkeit des angekündigten Eintreffens.
- source_word: וְיָדְעוּ
  choice: dann werden sie erkennen
  rationale: 'ידע meint hier mehr als bloße Information: Die Betroffenen werden durch das Eintreffen zur Einsicht gelangen.'
- source_word: נָבִיא הָיָה בְתוֹכָם
  choice: dass ein Prophet unter ihnen gewesen ist
  rationale: 'Die Wiedergabe folgt der hebräischen Wortwahl und bewahrt den rückblickenden Sinn: Das Eintreffen bestätigt, dass tatsächlich ein Prophet in ihrer Mitte war.'
theological_decisions:
- issue: Bezug des femininen Pronomens in וּבְבֹאָהּ
  choice: neutrales „es“ ohne ausdrückliche Festlegung
  alternative: „wenn dies eintrifft“ oder „wenn die Botschaft eintrifft“
  rationale: Der unmittelbare Bezug bleibt im Vers sprachlich offen. Eine ausdrückliche Ergänzung wie „Botschaft“ würde die mögliche Referenz stärker festlegen, als es der hebräische Text tut.
- issue: Prophetische Bestätigung durch das Eintreffen
  choice: „dann werden sie erkennen, dass ein Prophet unter ihnen gewesen ist“
  alternative: „dann werden sie wissen, dass ein Prophet in ihrer Mitte war“
  rationale: „Erkennen“ bringt den durch das Geschehen ausgelösten Erkenntnisakt zum Ausdruck, ohne über die Aussage des Textes hinaus eine bestimmte Lehre vom Prophetenamt zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „eintrifft“ bildet die nachdrückliche Wiederaufnahme des hebräischen Verbs ab; Gedankenstriche markieren den eingeschobenen Ausruf. Keine Fußnote erforderlich.
