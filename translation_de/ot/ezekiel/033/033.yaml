- from: Wenn es aber eintrifft — sieh, es trifft ein! —, dann werden sie erkennen, dass ein Prophet unter ihnen gewesen ist.
  to: Wenn es eintrifft – sieh, es kommt! –, dann werden sie erkennen, dass ein Prophet unter ihnen gewesen ist.
