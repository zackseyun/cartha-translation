  text: וְ/נָתַתִּ֤י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה וְ/נִשְׁבַּ֖ת גְּא֣וֹן עֻזָּ֑/הּ וְ/שָֽׁמְמ֛וּ הָרֵ֥י יִשְׂרָאֵ֖ל מֵ/אֵ֥ין עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/028.yaml
  text: And I will make the land a desolation and a waste[a], and the pride of its strength will cease, and the mountains of Israel will be desolate[b], with no one passing through.
translation:
  language: de
  text: Und ich werde das Land zu einer Einöde und einer Wüstenei[a] machen. Der Stolz seiner Stärke[b] wird aufhören, und die Berge Israels werden verwüstet sein, ohne dass jemand hindurchzieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einer Einöde und zum Entsetzen“. Das zweite hebräische Wort kann neben Verwüstung auch etwas bezeichnen, dessen Anblick Entsetzen oder Bestürzung hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: „Der Stolz seiner Stärke“ kann auch mit „die Pracht seiner Stärke“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ich werde … machen
  rationale: נתן bedeutet grundsätzlich „geben/setzen“, bezeichnet hier mit dem Land als Objekt und den folgenden Zustandsbezeichnungen jedoch idiomatisch das Versetzen in einen Zustand.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist im Kontext das Land Israel/Juda, nicht die ganze Erde.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: eine Einöde und eine Wüstenei
  rationale: Die beiden bedeutungsnahen, aber nicht völlig identischen Substantive werden als substantivisches Begriffspaar bewahrt; „Wüstenei“ bezeichnet hier ruinöse Verwüstung, kann beim zweiten Ausdruck aber auch den Eindruck des Entsetzens einschließen.
- source_word: וְנִשְׁבַּת
  choice: wird ein Ende haben
  rationale: Die Form von שבת drückt das Aufhören beziehungsweise Beendetwerden aus; diese Wendung klingt im Deutschen natürlich.
- source_word: גְּאוֹן עֻזָּהּ
  choice: der Stolz auf seine Stärke
  rationale: גאון kann „Stolz“, „Hoheit“ oder „Pracht“ bedeuten. Im Gerichtskontext liegt die negative Bedeutung „Stolz“ nahe; die Konstruktion wird im Deutschen idiomatisch mit „Stolz auf“ wiedergegeben. Das Pronomen bezieht sich auf das Land.
- source_word: וְשָׁמְמוּ הָרֵי יִשְׂרָאֵל
  choice: die Berge Israels werden … verwüstet sein
  rationale: Bei der Landschaft bezeichnet שמם hier den Zustand der Verwüstung; die wiederkehrende Bezeichnung „Berge Israels“ bleibt erhalten.
- source_word: מֵאֵין עוֹבֵר
  choice: sodass niemand mehr hindurchzieht
  rationale: Die Wendung beschreibt völlige Verlassenheit. Die resultative Formulierung gibt den syntaktischen Zusammenhang natürlich wieder; „mehr“ verdeutlicht das Ende des bisherigen Verkehrs, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Bedeutung von גְּאוֹן im Gerichtswort
  choice: 'negativ: „Stolz“'
  alternative: 'neutral oder positiv: „Hoheit/Pracht“'
  rationale: Der Gerichtskontext spricht dafür, dass das selbstsichere Rühmen der Stärke endet. Da das hebräische Wort auch neutral verstanden werden kann, wird diese Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das substantivische Doppelbild der Verwüstung bleibt erhalten. Die Syntax wurde leicht gegliedert, damit der lange hebräische Satz für heutige Leser klar und flüssig bleibt; sämtliche Fußnotenmarker stehen im Haupttext.
