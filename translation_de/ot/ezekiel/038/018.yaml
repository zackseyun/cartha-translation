  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא בְּ/י֨וֹם בּ֥וֹא גוֹג֙ עַל אַדְמַ֣ת יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה תַּעֲלֶ֥ה חֲמָתִ֖/י בְּ/אַפִּֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/018.yaml
  text: And it will happen on that day[a], on the day when Gog comes against the land of Israel, declares the Lord GOD, that my wrath will rise up in my nostrils.
translation:
  language: de
  text: Und es wird geschehen an jenem Tag, an dem Tag, an dem Gog gegen das Land Israel kommt – Ausspruch des Herrn Yahweh –, da steigt mein Zorn in mir auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Mein Zorn wird in meiner Nase aufsteigen.« Das hebräische Wort für »Nase« ist bildhaft mit aufflammendem Zorn verbunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt die formelhafte prophetische Zukunftseinleitung in würdigem, verständlichem Deutsch.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Entspricht der prophetischen Zeitformel und erhält ihren besonderen Zukunftsbezug.
- source_word: בְּיוֹם בּוֹא גוֹג
  choice: an dem Tag, wenn Gog ... kommt
  rationale: Gibt die Infinitivkonstruktion als natürliche temporale Aussage wieder und bewahrt die Wiederholung von »Tag«.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: gegen den Erdboden Israels
  rationale: »Gegen« entspricht im feindlichen Kontext der Bewegungsrichtung; »Erdboden« bildet אֲדָמָה konkreter ab als das allgemeinere »Land«.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: »Ausspruch« bildet die substantivische Prophetenformel נְאֻם formal ab; »Yahweh« gibt den Gottesnamen wieder, während אֲדֹנָי als »Herr« erscheint.
- source_word: תַּעֲלֶה חֲמָתִי
  choice: da wird mein Zorn ... aufsteigen
  rationale: Erhält sowohl das Bild des Aufsteigens als auch den feierlich-gerichtlichen Sinn von חֵמָה.
- source_word: בְּאַפִּי
  choice: in meiner Nase
  rationale: Bewahrt das konkrete hebräische Körperbild, statt es lediglich mit »in meinem Zorn« aufzulösen; die Fußnote erklärt den idiomatischen Zusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR / der Herr HERR
  rationale: Die beiden verschiedenen hebräischen Bezeichnungen bleiben unterscheidbar; der Eigenname יהוה wird nicht durch einen zweiten Herrentitel verdeckt.
- issue: Anthropomorphes Bild in בְּאַפִּי
  choice: in meiner Nase
  alternative: in meinem Zorn / in meinen Nasenlöchern
  rationale: Die konkrete und theologisch spannungsreiche Bildsprache des Hebräischen wird bewahrt. Der Singular אַף spricht unmittelbar für »Nase«; seine idiomatische Verbindung mit Zorn wird erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener prophetischer Wiederholung und konkreter hebräischer Bildsprache. Die Einschubstriche kennzeichnen die Gotteswortformel, ohne den Satzfluss zu glätten.
