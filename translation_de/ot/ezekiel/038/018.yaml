  terminology: »Herr Yahweh« unterscheidet angemessen zwischen אֲדֹנָי und יהוה und entspricht der vorgegebenen Wiedergabe des Gottesnamens. »Zorn« ist für חֲמָה im prophetisch-gerichtlichen Register passend. »Ausspruch« gibt נְאֻם präzise wieder.
