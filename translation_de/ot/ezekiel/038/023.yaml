  text: וְ/הִתְגַּדִּלְתִּי֙ וְ/הִתְקַדִּשְׁתִּ֔י וְ/נ֣וֹדַעְתִּ֔י לְ/עֵינֵ֖י גּוֹיִ֣ם רַבִּ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/023.yaml
  text: I will show myself great and show myself holy[a], and I will make myself known in the sight of many nations[b]. Then they will know that I am Yahweh.
translation:
  language: de
  text: So werde ich mich groß und heilig erweisen[a] und mich vor den Augen vieler Nationen zu erkennen geben. Dann werden sie erkennen, dass ich Jahwe bin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „Ich werde mich groß machen, mich heiligen und erkannt werden.“ Die hebräischen Verben sind reflexiv beziehungsweise passiv geformt; der Haupttext gibt ihren Sinn als öffentliche Selbsterweisung in natürlichem Deutsch wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְגַּדִּלְתִּי
  choice: So werde ich mich als groß … erweisen
  rationale: Das Hitpael wird reflexiv und als öffentlich sichtbare Selbsterweisung wiedergegeben. „Mich groß machen“ könnte im Deutschen missverständlich nach eigennütziger Selbsterhöhung klingen.
- source_word: וְהִתְקַדִּשְׁתִּי
  choice: und heilig erweisen
  rationale: Die parallele Formulierung bringt zum Ausdruck, dass Gott seine Heiligkeit vor den Nationen sichtbar erweist. „Mich heiligen“ wäre zwar formnäher, im heutigen Deutsch hier aber leicht unklar.
- source_word: וְנוֹדַעְתִּי
  choice: mich … zu erkennen geben
  rationale: Das Nifal von ידע lässt sowohl „bekannt werden“ als auch eine wirksame reflexive Wiedergabe zu. Im Zusammenhang unterstreicht die Formulierung Gottes eigenes Handeln, ohne das öffentliche Bekanntwerden auszublenden.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die idiomatische Wendung bewahrt den visuellen und öffentlichen Charakter des Geschehens und ist im Deutschen natürlich verständlich.
- source_word: גּוֹיִם רַבִּים
  choice: vieler Nationen
  rationale: גּוֹיִם bezeichnet hier die politischen beziehungsweise ethnischen Völkerverbände. „Nationen“ passt zum Kontext und vermeidet den später geprägten Gegensatz von Juden und Heiden.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: „Erkennen“ gibt die für Ezechiel typische Erkenntnisformel würdig und idiomatisch wieder; „wissen“ wäre möglich, klänge hier jedoch weniger natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Die drei Verben der göttlichen Selbsterweisung
  choice: 'Reflexive, öffentlich wahrnehmbare Sprache: „mich als groß und heilig erweisen“ und „mich zu erkennen geben“'
  alternative: „mich groß machen und mich heiligen und bekannt werden“
  rationale: Die gewählte Fassung wahrt die reflexive beziehungsweise passive Formspannung der hebräischen Verben, bleibt aber in modernem Deutsch verständlich und vermeidet eine übermäßig dogmatische Ausdeutung.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Verwendung des Eigennamens bewahrt die konkrete Selbstidentifikation am Ende der ezechielischen Erkenntnisformel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei ersten parallelen Verben sind knapp zusammengezogen, ohne ihre jeweilige Aussage aufzugeben. „Vor den Augen“ erhält das Bild der öffentlichen Sichtbarkeit; „Jahwe“ gibt den Gottesnamen wieder.
