source:
  edition: WLC
  text: לִ/שְׁלֹ֥ל שָׁלָ֖ל וְ/לָ/בֹ֣ז בַּ֑ז לְ/הָשִׁ֨יב יָדְ/ךָ֜ עַל חֳרָב֣וֹת נוֹשָׁבֹ֗ת וְ/אֶל עַם֙ מְאֻסָּ֣ף מִ/גּוֹיִ֔ם עֹשֶׂה֙ מִקְנֶ֣ה וְ/קִנְיָ֔ן יֹשְׁבֵ֖י עַל טַבּ֥וּר הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/012.yaml
  text: to seize spoil and to carry off plunder[a], to turn your hand against ruins now inhabited and against a people gathered from the nations, who have acquired livestock and goods, who dwell at the center of the earth.
translation:
  language: de
  text: um Beute zu machen und Raub wegzunehmen, um deine Hand gegen wieder bewohnte Trümmerstätten zu wenden und gegen ein Volk, das aus den Nationen gesammelt worden ist, das Vieh und Besitz erworben hat und im Mittelpunkt der Erde[a] wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Nabel der Erde“. Gemeint ist die Mitte beziehungsweise das Zentrum des Landes oder der Welt.'
    reason: Die Fußnote bewahrt die konkrete hebräische Metapher und weist zugleich auf die Bedeutungsbreite von אֶרֶץ hin.
lexical_decisions:
- source_word: לִשְׁלֹל שָׁלָל
  choice: um Beute zu machen
  rationale: Die Verbindung aus Infinitiv und stammverwandtem Objekt verstärkt den Vorgang; die natürliche deutsche Wendung bewahrt den Sinn knapp.
- source_word: וְלָבֹז בַּז
  choice: und Raub fortzuschleppen
  rationale: Die parallele Verbindung bezeichnet Plünderung; „fortzuschleppen“ hebt passend das Wegführen des Raubguts hervor, ohne im Deutschen eine unnatürliche Wortwiederholung zu erzeugen.
- source_word: לְהָשִׁיב יָדְךָ
  choice: um deine Hand gegen … zu wenden
  rationale: Die Formulierung erhält das hebräische Hand-Bild und gibt שׁוב als Wenden wieder; „gegen“ macht die feindliche Ausrichtung deutlich.
- source_word: חֳרָבוֹת נוֹשָׁבוֹת
  choice: wieder bewohnte Trümmerstätten
  rationale: Die Übersetzung bewahrt die Spannung zwischen früherer Verwüstung und gegenwärtiger Wiederbesiedlung.
- source_word: עַם מְאֻסָּף מִגּוֹיִם
  choice: ein Volk, das aus den Nationen gesammelt worden ist
  rationale: Das Passiv und die Herkunft aus mehreren Nationen werden ausdrücklich beibehalten, ohne den Handelnden zu ergänzen.
- source_word: עֹשֶׂה מִקְנֶה וְקִנְיָן
  choice: das Vieh und Besitz erworben hat
  rationale: עֹשֶׂה bezeichnet in dieser Verbindung das Erlangen beziehungsweise Ansammeln von Vermögen, nicht dessen Herstellung.
- source_word: מִקְנֶה
  choice: Vieh
  rationale: Der Ausdruck umfasst Nutz- und Herdentiere als Vermögensbestand und wird im Deutschen natürlich mit „Vieh“ wiedergegeben.
- source_word: קִנְיָן
  choice: Besitz
  rationale: Das Substantiv bezeichnet erworbenes Eigentum beziehungsweise Habe; „Besitz“ ist präzise und im Zusammenhang mit Vieh idiomatisch.
- source_word: יֹשְׁבֵי עַל טַבּוּר הָאָרֶץ
  choice: im Mittelpunkt der Erde wohnt
  rationale: טַבּוּר bedeutet wörtlich „Nabel“ und bezeichnet bildlich die Mitte; „Mittelpunkt der Erde“ vermittelt das Bild verständlich, während die Fußnote den Wortlaut offenlegt.
theological_decisions:
- issue: Bildhafte Geografie in טַבּוּר הָאָרֶץ
  choice: Mittelpunkt der Erde
  alternative: Nabel der Erde; Mitte des Landes
  rationale: Die idiomatische Wiedergabe bewahrt die Vorstellung geografischer Zentralität, ohne aus der Metapher eine kosmologische Lehraussage zu machen. Die mögliche Spannweite von אֶרֶץ zwischen „Land“ und „Erde“ wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Zweckgefüge; ungewöhnliche, aber verständliche Bilder wie „deine Hand … wenden“ werden bewahrt. Das Partizip יֹשְׁבֵי wird entsprechend seinem Bezugswort עַם im Deutschen singularisch wiedergegeben.
