  text: וְ/שׁ֣וֹבַבְתִּ֔י/ךָ וְ/נָתַתִּ֥י חַחִ֖ים בִּ/לְחָיֶ֑י/ךָ וְ/הוֹצֵאתִי֩ אוֹתְ/ךָ֨ וְ/אֶת כָּל חֵילֶ֜/ךָ סוּסִ֣ים וּ/פָרָשִׁ֗ים לְבֻשֵׁ֤י מִכְלוֹל֙ כֻּלָּ֔/ם קָהָ֥ל רָב֙ צִנָּ֣ה וּ/מָגֵ֔ן תֹּפְשֵׂ֥י חֲרָב֖וֹת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
translation:
  language: de
  text: 'Ich werde dich herumlenken[a], Haken in deine Kinnbacken legen und dich herausführen: dich und dein ganzes Heer, Pferde und Reiter, sie alle vollständig gerüstet, eine große Schar mit großen und kleinen Schilden[b], sie alle mit Schwertern bewaffnet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurückführen“.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt zwei verschiedene Schildarten, wahrscheinlich einen großen, den Körper deckenden Schild und einen kleineren Schild.
    reason: cultural_note
lexical_decisions:
- source_word: וְשׁוֹבַבְתִּיךָ
  choice: Ich werde dich herumlenken
  rationale: Die Form bezeichnet hier ein veranlasstes Umlenken. „Herumlenken“ bewahrt das Bild göttlicher Kontrolle, ohne eine bestimmte Marschrichtung festzulegen.
- source_word: חַחִים בִּלְחָיֶיךָ
  choice: Haken in deine Kinnbacken legen
  rationale: חַחִים sind Haken beziehungsweise Ringe zur Beherrschung von Tieren oder Gefangenen; לְחָיַיִם kann Kinnbacken oder Wangen bezeichnen. „Kinnbacken“ passt zum konkreten Kontrollbild.
- source_word: וְהוֹצֵאתִי אוֹתְךָ
  choice: und dich herausführen
  rationale: Das Hifil von יצא drückt aus, dass Gott Gog hinausgehen lässt beziehungsweise herausführt; die aktive göttliche Veranlassung bleibt erhalten.
- source_word: חֵילֶךָ
  choice: dein ganzes Heer
  rationale: חַיִל bezeichnet im militärischen Zusammenhang die Streitmacht. „Heer“ ist prägnant und dem würdigen Register angemessen.
- source_word: סוּסִים וּפָרָשִׁים
  choice: Pferde und Reiter
  rationale: Die beiden hebräischen Glieder werden ausdrücklich bewahrt und nicht zum Sammelbegriff „Reiterei“ verdichtet.
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: vollständig gerüstet
  rationale: Die Wendung kann vollständige Bekleidung oder Ausstattung bezeichnen; im unmittelbaren militärischen Kontext liegt vollständige Kriegsausrüstung nahe.
- source_word: קָהָל רָב
  choice: eine große Schar
  rationale: קָהָל bezeichnet eine versammelte Menge; „Schar“ klingt im Deutschen natürlich und passt hier zu einer großen Streitmacht.
- source_word: צִנָּה וּמָגֵן
  choice: Langschild und Rundschild
  rationale: Die Wörter unterscheiden wahrscheinlich einen großen, den Körper deckenden Schild von einem kleineren Schild. Die Wiedergabe macht die Unterscheidung verständlich, ohne das veraltete „Buckler“ nachzuahmen.
- source_word: תֹּפְשֵׂי חֲרָבוֹת
  choice: mit Schwertern bewaffnet
  rationale: Wörtlich sind sie „Schwerter Ergreifende/Tragende“. Die Formulierung gibt ihre kampfbereite Bewaffnung natürlich wieder.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die zweimalige Wiederholung wird beibehalten, um die umfassende Betonung des Hebräischen abzubilden.
theological_decisions:
- issue: Gottes Wirken bei Gogs Mobilisierung
  choice: Gott lenkt Gog aktiv um, legt ihm Haken an und führt ihn samt seinem Heer heraus.
  alternative: Gott lässt Gogs Aufbruch lediglich zu.
  rationale: Die Folge von Verben in der ersten Person, darunter kausative Formen, stellt Gottes Handeln ausdrücklich als aktiv dar. Die Übersetzung erhält dies, ohne das Verhältnis zu Gogs eigener Absicht dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt die kraftvolle Reihung des Hebräischen, bleibt aber gut verständlich. Militärische Fachwörter werden nur dort eingesetzt, wo sie die im Ausgangstext erkennbare Unterscheidung zweier Schildarten verdeutlichen.
