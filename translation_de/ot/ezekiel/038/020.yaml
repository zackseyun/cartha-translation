source:
  edition: WLC
  text: וְ/רָעֲשׁ֣וּ מִ/פָּנַ֡/י דְּגֵ֣י הַ/יָּם֩ וְ/ע֨וֹף הַ/שָּׁמַ֜יִם וְ/חַיַּ֣ת הַ/שָּׂדֶ֗ה וְ/כָל הָ/רֶ֨מֶשׂ֙ הָ/רֹמֵ֣שׂ עַל הָֽ/אֲדָמָ֔ה וְ/כֹל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וְ/נֶהֶרְס֣וּ הֶ/הָרִ֗ים וְ/נָֽפְלוּ֙ הַ/מַּדְרֵג֔וֹת וְ/כָל חוֹמָ֖ה לָ/אָ֥רֶץ תִּפּֽוֹל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/020.yaml
  text: The fish of the sea[a], the birds of the heavens, the beasts of the field, every creeping thing that creeps on the ground, and every man who is on the face of the earth will quake at my presence; the mountains will be thrown down, the cliffs will fall, and every wall will fall to the ground.
translation:
  language: de
  text: Die Fische im Meer, die Vögel am Himmel, die wilden Tiere des Feldes, alles, was auf dem Erdboden kriecht, und alle Menschen auf der ganzen Erde werden vor mir erbeben. Die Berge werden einstürzen, die Steilhänge[a] werden einstürzen, und jede Mauer wird zu Boden fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die steilen Stellen; möglicherweise auch die Terrassen oder Felsstufen. Das hebräische Wort ist selten und bezeichnet abgestufte beziehungsweise steile Geländeformen.'
    reason: lexikalische Unsicherheit bei הַמַּדְרֵגוֹת
lexical_decisions:
- source_word: וְרָעֲשׁוּ
  choice: werden … erbeben
  rationale: רעש bezeichnet hier heftiges Beben infolge des göttlichen Eingreifens. „Erbeben“ passt zu den belebten Subjekten und zugleich zum Erdbebenbild des Verses.
- source_word: מִפָּנַי
  choice: vor mir
  rationale: Die Wendung bedeutet wörtlich „von/vor meinem Angesicht“. Das natürliche deutsche „vor mir erbeben“ bewahrt sowohl die Gegenwart Gottes als auch den dadurch ausgelösten Schrecken.
- source_word: דְּגֵי הַיָּם
  choice: die Fische im Meer
  rationale: Die deutsche Ortsangabe gibt die hebräische Genitivverbindung natürlich und eindeutig wieder.
- source_word: עוֹף הַשָּׁמַיִם
  choice: die Vögel am Himmel
  rationale: שׁמים bezeichnet hier den sichtbaren Himmel als Lebensraum der Vögel; „am Himmel“ ist im modernen Deutsch idiomatisch und würdevoll.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere auf dem Land
  rationale: חיה השדה bezeichnet die frei lebenden Landtiere. Die Wiedergabe vermeidet das heute missverständliche „Tiere des Feldes“.
- source_word: כָּל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאֲדָמָה
  choice: alles, was auf dem Erdboden kriecht
  rationale: „Kriecht“ gibt רמש wieder; eine wörtliche Nachbildung des hebräischen figura etymologica wäre im Deutschen schwerfällig. „Alles“ bewahrt den umfassenden Sinn.
- source_word: כֹל הָאָדָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: alle Menschen auf der ganzen Erde
  rationale: אָדָם steht kollektiv für die Menschheit. „Alle Menschen“ gibt diesen Sinn geschlechtsübergreifend und im modernen Deutsch präzise wieder; „auf der ganzen Erde“ vermittelt das hebräische Bild „auf der Oberfläche des Erdbodens“ idiomatisch.
- source_word: וְנֶהֶרְסוּ הֶהָרִים
  choice: Die Berge werden einstürzen
  rationale: Das Nifal von הרס bezeichnet das Niedergerissenwerden bzw. den Zusammenbruch. Bei Bergen ist „einstürzen“ eine natürliche Wiedergabe der katastrophalen Wirkung.
- source_word: הַמַּדְרֵגוֹת
  choice: die Steilhänge
  rationale: Das seltene Wort bezeichnet wahrscheinlich abgestufte oder steile Geländeformen. „Steilhänge“ bleibt topografisch offen und passt zum Erdbebenkontext, ohne vorschnell „Klippen“ oder künstliche „Terrassen“ festzulegen.
- source_word: וְכָל חוֹמָה לָאָרֶץ תִּפּוֹל
  choice: jede Mauer wird zu Boden fallen
  rationale: „Zu Boden fallen“ ist die natürliche deutsche Entsprechung der Wendung und drückt den vollständigen Zusammenbruch aus.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם
  choice: alle Menschen
  alternative: jeder Mensch / die ganze Menschheit
  rationale: Der Singular אָדָם ist hier kollektiv und umfasst die Menschheit. „Alle Menschen“ bewahrt die umfassende Aussage, ohne eine ausschließlich männliche Bedeutung nahezulegen.
- issue: Bedeutung von מִפָּנַי
  choice: vor mir
  alternative: vor meiner Gegenwart / angesichts meiner Gegenwart
  rationale: Die knappe Formulierung lässt die göttliche Gegenwart und den von ihr ausgehenden Schrecken bestehen, ohne die Art der Erscheinung näher zu bestimmen.
- issue: Bestimmung von הַמַּדְרֵגוֹת
  choice: Steilhänge mit Fußnote
  alternative: Klippen / Terrassen / steile Stellen
  rationale: Da das seltene Substantiv lexikalisch unsicher ist, wird eine kontextgerechte, aber nicht übermäßig spezifische Haupttextlösung gewählt und die echte Bedeutungsbreite in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die umfassende Aufzählung und die zunehmende Katastrophenwirkung des Hebräischen bleiben erhalten. Semikolons wurden zugunsten zweier klarer deutscher Sätze vermieden; die seltene Geländebezeichnung wird nicht überpräzisiert.
