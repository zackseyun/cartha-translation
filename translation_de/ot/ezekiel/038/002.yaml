source:
  edition: WLC
  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל גּוֹג֙ אֶ֣רֶץ הַ/מָּג֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֣שֶׁךְ וְ/תֻבָ֑ל וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/002.yaml
  text: Son of man, set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him.
translation:
  language: de
  text: Menschensohn, richte dein Angesicht gegen Gog aus dem Land Magog, den obersten Fürsten[a] von Meschech und Tubal, und weissage gegen ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Fürsten von Rosch, Meschech und Tubal“. Das hebräische Wort Rosch kann hier als Rangbezeichnung („oberster“) oder als Eigenname verstanden werden.'
    reason: Markiert die umstrittene Analyse von רֹאשׁ und bewahrt die Mehrdeutigkeit des hebräischen Ausdrucks.
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Menschensohn
  rationale: Die traditionelle und im Deutschen verständliche Wiedergabe bewahrt die wörtliche Anrede, mit der Ezechiel als sterblicher Mensch angesprochen wird.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: richte dein Gesicht gegen
  rationale: Bewahrt das hebräische Bild einer entschlossenen Hinwendung und zugleich die feindliche Stoßrichtung des folgenden Gerichtsorakels.
- source_word: גּוֹג אֶרֶץ הַמָּגוֹג
  choice: Gog aus dem Land Magog
  rationale: Gog wird als Person und Magog als Land verstanden; die knappe hebräische Zuordnung wird natürlich wiedergegeben.
- source_word: נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל
  choice: den obersten Fürsten von Meschech und Tubal
  rationale: רֹאשׁ wird als Bezeichnung des Ranges („oberster“) verstanden, nicht als Eigenname „Rosch“. Die syntaktische Mehrdeutigkeit wird in einer verbreiteten, kontextuell plausiblen Lesart wiedergegeben.
- source_word: וְהִנָּבֵא עָלָיו
  choice: und weissage gegen ihn
  rationale: עַל bezeichnet hier angesichts des angekündigten Gerichtswortes eine gegen Gog gerichtete Weissagung.
theological_decisions:
- issue: Deutung von רֹאשׁ als Rangbezeichnung oder Eigenname
  choice: obersten Fürsten
  alternative: Fürsten von Rosch, Meschech und Tubal
  rationale: רֹאשׁ kann „Haupt/oberster“ bedeuten; diese Analyse passt unmittelbar als Rangangabe zu נְשִׂיא und vermeidet, ohne zwingenden textlichen Grund einen weiteren Volks- oder Ortsnamen anzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante prophetische Formel „richte dein Gesicht gegen“ bleibt bildhaft erhalten; Eigennamen folgen den im Deutschen geläufigen Formen.
