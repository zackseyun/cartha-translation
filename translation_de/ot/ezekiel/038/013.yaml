base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/013.yaml
  text: Sheba and Dedan and the merchants of Tarshish, with all her young lions, will say to you, ‘Have you come to take plunder? Have you assembled your company to seize silver and gold, to take livestock and goods, to take great plunder?’
translation:
  language: de
  text: 'Saba und Dedan und die Händler von Tarschisch samt all seinen jungen Löwen[a] werden zu dir sagen: »Kommst du, um Beute zu machen? Hast du deine Schar versammelt, um Silber und Gold an dich zu nehmen, Vieh und Besitz zu erbeuten und große Beute zu machen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »all seinen jungen Löwen«; wahrscheinlich sind mächtige oder führende Vertreter Tarschischs gemeint. Andere verstehen den Ausdruck als Bezeichnung für die zu Tarschisch gehörenden Orte.'
    reason: Der hebräische Ausdruck ist bildhaft und seine konkrete Referenz umstritten; die Fußnote bewahrt diese Mehrdeutigkeit.
lexical_decisions:
- source_word: כְּפִירֶיהָ
  choice: ihren jungen Löwen
  rationale: Die bildhafte Grundbedeutung des hebräischen Ausdrucks wird bewahrt. Gemeint sein können mächtige oder führende Vertreter Tarschischs; diese Deutung wird nicht stillschweigend in den Haupttext eingesetzt.
- source_word: שָׁלָל / בַּז
  choice: Beute / erbeuten
  rationale: Die beiden weitgehend parallelen Beutebegriffe werden in natürlichem Deutsch wiedergegeben; die Wiederholung von שָׁלָל am Anfang und Ende bleibt durch »Beute machen« erkennbar.
- source_word: קְהָלֶךָ
  choice: deine Schar
  rationale: קהל bezeichnet hier die für den Raubzug zusammengerufene Menge beziehungsweise Truppe. »Schar« wahrt die kollektive Bedeutung, ohne sie unnötig als reguläres Heer festzulegen.
- source_word: מִקְנֶה וְקִנְיָן
  choice: Vieh und Besitz
  rationale: מִקְנֶה bezeichnet Viehbestand, קִנְיָן erworbenes Eigentum oder Besitz. Die knappe Paarung entspricht dem Kontext wirtschaftlicher Beute.
theological_decisions:
- issue: Identität der »jungen Löwen« Tarschischs
  choice: Die Metapher bleibt im Haupttext stehen und wird in einer Fußnote erläutert.
  alternative: »Fürsten«, »Machthaber« oder »Dörfer«
  rationale: Der masoretische Text lautet wörtlich »ihre jungen Löwen«. Eine metaphorische Beziehung auf führende oder mächtige Vertreter ist plausibel, aber nicht so eindeutig, dass sie die Bildsprache ersetzen sollte; »Dörfer« beruht auf einer anderen Deutung beziehungsweise Texttradition.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und die wiederholte Beute-Motivik des Hebräischen bleiben erhalten; altertümliche Handels- und Militärsprache wird vermieden.
