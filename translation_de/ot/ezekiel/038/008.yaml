source:
  edition: WLC
  text: מִ/יָּמִ֣ים רַבִּים֮ תִּפָּקֵד֒ בְּ/אַחֲרִ֨ית הַ/שָּׁנִ֜ים תָּב֣וֹא אֶל אֶ֣רֶץ מְשׁוֹבֶ֣בֶת מֵ/חֶ֗רֶב מְקֻבֶּ֨צֶת֙ מֵ/עַמִּ֣ים רַבִּ֔ים עַ֚ל הָרֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר הָי֥וּ לְ/חָרְבָּ֖ה תָּמִ֑יד וְ/הִיא֙ מֵ/עַמִּ֣ים הוּצָ֔אָה וְ/יָשְׁב֥וּ לָ/בֶ֖טַח כֻּלָּֽ/ם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/008.yaml
  text: After many days you will be mustered[a]; in the latter years you will come into a land restored from the sword, gathered from many peoples, onto the mountains of Israel, which had been a continual waste; but it was brought out from the peoples[b], and all of them will dwell securely.
translation:
  language: de
  text: Nach vielen Tagen wirst du aufgeboten werden[a]. Am Ende der Jahre[b] wirst du in ein Land kommen, das dem Schwert entrissen und aus vielen Völkern auf die Berge Israels gesammelt worden ist; sie waren lange Zeit verwüstet. Dieses Land aber wurde aus den Völkern herausgeführt, und sie alle werden in Sicherheit wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirst du heimgesucht“ oder „wirst du einberufen“. Das hebräische Wort meint hier wahrscheinlich, dass jemand zum Handeln aufgerufen oder militärisch aufgeboten wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „am Ende der Jahre“. Der hebräische Text sagt hier nicht „am Ende der Tage“.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפָּקֵד
  choice: wirst du aufgeboten
  rationale: Das Nifal von פקד bezeichnet im Zusammenhang des bevorstehenden Feldzugs am ehesten das Aufbieten oder Einberufen zum Handeln. „Aufgeboten“ wahrt den militärischen Klang, ohne die mögliche allgemeinere Bedeutung zu verdecken.
- source_word: בְּאַחֲרִית הַשָּׁנִים
  choice: gegen Ende der Jahre
  rationale: Die Wendung nennt ausdrücklich die „Jahre“, nicht die sonst geläufigere Formel „am Ende der Tage“. Die gewählte Formulierung ist im Deutschen verständlich und bewahrt diesen Unterschied.
- source_word: אֶרֶץ מְשׁוֹבֶבֶת מֵחֶרֶב
  choice: ein Land, das vom Schwert wiederhergestellt ... worden ist
  rationale: מְשׁוֹבֶבֶת bezeichnet hier die Wiederherstellung nach der Verwüstung durch Krieg; „Schwert“ bleibt als Bild des hebräischen Textes erhalten.
- source_word: מְקֻבֶּצֶת מֵעַמִּים רַבִּים
  choice: aus vielen Völkern gesammelt
  rationale: Die feminine Passivform bezieht sich grammatisch auf das Land und stellt es personifiziert als aus den Völkern gesammelt dar. Diese Spannung wird nicht durch die ausdrückliche Einfügung von „Bewohnern“ aufgelöst.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: auf die Berge Israels
  rationale: Mit dem Bewegungsverb „kommen“ bezeichnet עַל das Ziel der Bewegung. Der deutsche Akkusativ gibt diese Richtung wieder.
- source_word: אֲשֶׁר הָיוּ לְחָרְבָּה תָּמִיד
  choice: die lange Zeit verwüstet waren
  rationale: תָּמִיד drückt hier die fortdauernde frühere Verwüstung aus. „Lange Zeit“ ist natürliches Deutsch und vermeidet die missverständliche Aussage, die Berge seien ausnahmslos oder ewig verwüstet gewesen.
- source_word: וְהִיא מֵעַמִּים הוּצָאָה
  choice: Dieses Land aber wurde aus den Völkern herausgeführt
  rationale: Das feminine Pronomen verweist auf אֶרֶץ. Da „Land“ im Deutschen sächlich ist, wird der Bezug durch „Dieses Land“ verdeutlicht; „aber“ markiert den Kontrast zur früheren Verwüstung.
- source_word: וְיָשְׁבוּ לָבֶטַח כֻּלָּם
  choice: und sie alle werden in Sicherheit wohnen
  rationale: ישב לבטח ist eine feste Wendung für sicheres Wohnen; כֻּלָּם wird ausdrücklich mit „sie alle“ wiedergegeben.
theological_decisions:
- issue: Eschatologische Zeitangabe
  choice: gegen Ende der Jahre
  alternative: am Ende der Tage / in den letzten Tagen
  rationale: Der hebräische Text verwendet „Jahre“ und nicht die häufigere prophetische Formel „Tage“. Die Übersetzung bewahrt diesen Wortlaut und vermeidet eine stillschweigende Harmonisierung.
- issue: Personifizierung des Landes
  choice: Das Land wird als gesammelt und aus den Völkern herausgeführt beschrieben
  alternative: Die Bewohner des Landes wurden aus den Völkern gesammelt und herausgeführt
  rationale: Die alternative Deutung ist sachlich naheliegend, macht jedoch das im Hebräischen nur implizit Gemeinte ausdrücklich. Der Haupttext erhält daher die grammatische Bildsprache und ihre Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Färbung von „aufgeboten“ und die ungewöhnliche Zeitangabe „Ende der Jahre“ bleiben erhalten. Der Gedankenstrich ordnet die dichte hebräische Partizipialkonstruktion, ohne ihren Inhalt umzustellen; die Personifizierung des Landes wird bewusst nicht aufgelöst.
