revisions:
- from: Nach vielen Tagen wirst du aufgeboten[a]. Gegen Ende der Jahre[b] wirst du in ein Land kommen, das vom Schwert wiederhergestellt und aus vielen Völkern gesammelt worden ist – auf die Berge Israels, die lange Zeit verwüstet waren. Dieses Land aber wurde aus den Völkern herausgeführt, und sie alle werden in Sicherheit wohnen.
  to: Nach vielen Tagen wirst du aufgeboten werden[a]. Am Ende der Jahre[b] wirst du in ein Land kommen, das dem Schwert entrissen und aus vielen Völkern auf die Berge Israels gesammelt worden ist; sie waren lange Zeit verwüstet. Dieses Land aber wurde aus den Völkern herausgeführt, und sie alle werden in Sicherheit wohnen.
  rationale: Die Revision beseitigt die im Deutschen irreführende passive Wendung mit „vom Schwert“ und bindet die Berge Israels unmittelbar an die Sammlung an. Die knappe, im Hebräischen angelegte Bildsprache vom Land, das gesammelt und aus den Völkern herausgeführt wird, bleibt bewusst erhalten. „Am Ende der Jahre“ gibt die hebräische Zeitformel unmittelbarer wieder als „gegen Ende der Jahre“, ohne sie mit „Tagen“ zu harmonisieren.
