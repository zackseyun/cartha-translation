  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יַעֲל֤וּ דְבָרִים֙ עַל לְבָבֶ֔/ךָ וְ/חָשַׁבְתָּ֖ מַחֲשֶׁ֥בֶת רָעָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/010.yaml
  text: 'Thus says the Lord GOD: On that day[a], things will come up in your heart[b], and you will devise an evil plan.'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: An jenem Tag werden Gedanken in deinem Herzen aufsteigen,[a] und du wirst einen bösen Plan schmieden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Worte“, „Dinge“ oder „Angelegenheiten werden auf dein Herz steigen“. Gemeint ist, dass Gedanken oder Absichten in dir aufkommen. Im Hebräischen ist das Herz der Ort des Denkens und Wollens, nicht nur der Gefühle.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb „planen“ und das Substantiv „Plan“ stammen aus derselben Wortwurzel; sinngemäß: „du wirst einen bösen Plan planen“.'
    reason: wordplay
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdigem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt אֲדֹנָי als Titel „der Herr“ und das Tetragramm als den Eigennamen „Yahweh“ wieder, ohne die beiden Bestandteile zu einem doppelten Herrentitel einzuebnen.
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Gibt die zeitliche Einleitung idiomatisch wieder; die hebräische Konstruktion mit היה muss im Deutschen nicht wörtlich als „und es wird geschehen“ erscheinen.
- source_word: יַעֲלוּ דְבָרִים
  choice: werden Gedanken ... aufsteigen
  rationale: דְבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. Zusammen mit dem Herzen und dem folgenden Planen bezeichnet es hier am natürlichsten aufkommende Gedanken, während „aufsteigen“ das Bild des Verbs עלה erhält.
- source_word: עַל לְבָבֶךָ
  choice: in deinem Herzen
  rationale: Das Herz ist im hebräischen Sprachgebrauch Zentrum des Denkens und Wollens. Die deutsche Formulierung bewahrt dieses Menschenbild und ist zugleich verständlich.
- source_word: וְחָשַׁבְתָּ מַחֲשֶׁבֶת רָעָה
  choice: du wirst einen bösen Plan schmieden
  rationale: Verb und verwandtes Substantiv bilden im Hebräischen eine betonte Wortverbindung. „Einen Plan schmieden“ vermittelt die absichtsvolle Planung natürlich; „böse“ bewahrt die moralische Wertung von רָעָה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR / der Herr HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet eine konfessionell geprägte Umschreibung des Namens.
- issue: Bedeutungsbereich des Herzens
  choice: „Herz“ im Haupttext beibehalten und seine gedanklich-willentliche Funktion erläutern
  alternative: „Sinn“ oder „Gedanken“ anstelle von „Herz“
  rationale: So bleibt die hebräische Anthropologie sichtbar, ohne das Herz auf Gefühle zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt formal; die innere Regung wird verständlich formuliert, während Fußnoten die lexikalische Mehrdeutigkeit und die hebräische Wortwiederholung dokumentieren.
