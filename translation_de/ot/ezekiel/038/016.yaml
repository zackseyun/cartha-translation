source:
  edition: WLC
  text: וְ/עָלִ֨יתָ֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל כֶּֽ/עָנָ֖ן לְ/כַסּ֣וֹת הָ/אָ֑רֶץ בְּ/אַחֲרִ֨ית הַ/יָּמִ֜ים תִּֽהְיֶ֗ה וַ/הֲבִאוֹתִ֨י/ךָ֙ עַל אַרְצִ֔/י לְמַעַן֩ דַּ֨עַת הַ/גּוֹיִ֜ם אֹתִ֗/י בְּ/הִקָּדְשִׁ֥/י בְ/ךָ֛ לְ/עֵינֵי/הֶ֖ם גּֽוֹג־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/016.yaml
  text: And you will come up against my people Israel like a cloud to cover the land. In the latter days it will happen that I will bring you against my land[a], so that the nations may know me when I show myself holy through you before their eyes, O Gog.
translation:
  language: de
  text: 'Du wirst gegen mein Volk Israel heraufziehen wie eine Wolke, um das Land zu bedecken. Am Ende der Tage wird es geschehen: Ich werde dich gegen mein Land bringen, damit die Völker mich erkennen, wenn ich mich durch dich vor ihren Augen als heilig erweise[a], Gog.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wenn ich mich an dir vor ihren Augen heilige“; auch möglich: „wenn ich mich durch dich vor ihren Augen heilige“.'
    reason: Die hebräische Wendung בְּהִקָּדְשִׁי בְךָ lässt eine formnahe Wiedergabe mit „mich heiligen“ sowie bei בְךָ sowohl eine instrumentale als auch eine auf Gog bezogene Deutung zu.
lexical_decisions:
- source_word: וְעָלִיתָ
  choice: Du wirst … heraufziehen
  rationale: עלה bezeichnet wörtlich ein Hinaufziehen und im militärischen Zusammenhang den Vormarsch gegen ein Volk oder Land. „Heraufziehen“ bewahrt das hebräische Bild und klingt im Deutschen natürlich.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: gegen mein Volk Israel
  rationale: עַל hat bei feindlicher Bewegung adversative Bedeutung. Der Possessivausdruck „mein Volk“ und die appositionelle Benennung „Israel“ bleiben erhalten.
- source_word: כֶּעָנָן לְכַסּוֹת הָאָרֶץ
  choice: wie eine Wolke, die das Land bedeckt
  rationale: Der ausdrückliche Vergleich bleibt erhalten. הָאָרֶץ bezeichnet im unmittelbaren Kontext das Land Israel; der Relativsatz gibt die Zweck- beziehungsweise Ergebnisnuance des Infinitivs idiomatisch wieder.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  rationale: Die konventionelle prophetische Wendung wird nah am Hebräischen wiedergegeben, ohne sie auf ein bestimmtes endzeitliches System festzulegen.
- source_word: תִּהְיֶה
  choice: wird es geschehen
  rationale: Das feminine Singularverb verweist wahrscheinlich auf das angekündigte Geschehen. Die unpersönliche deutsche Form gibt diesen Ereignissinn natürlich wieder.
- source_word: וַהֲבִאוֹתִיךָ
  choice: Ich werde dich … bringen
  rationale: Der Hifil von בוא drückt Verursachung aus. „Bringen“ gibt Gottes bestimmende Handlungsinitiative knapp und klar wieder.
- source_word: עַל אַרְצִי
  choice: gegen mein Land
  rationale: Wegen des feindlichen Zusammenhangs ist עַל adversativ zu verstehen. „Mein Land“ bewahrt Gottes ausdrücklichen Anspruch auf das Land.
- source_word: לְמַעַן דַּעַת הַגּוֹיִם אֹתִי
  choice: damit die Völker mich erkennen
  rationale: לְמַעַן bezeichnet den Zweck. „Erkennen“ wahrt neben dem Wissen auch den offenbarenden und relationalen Gehalt von ידע.
- source_word: בְּהִקָּדְשִׁי בְךָ
  choice: wenn ich mich durch dich … als heilig erweise
  rationale: Die Formulierung beschreibt, dass Gottes Heiligkeit durch sein Handeln an beziehungsweise mittels Gog öffentlich sichtbar wird. „Als heilig erweisen“ vermeidet den irreführenden Eindruck, Gott werde erst heilig; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die Wendung bezeichnet ein öffentliches, sichtbares Geschehen und lässt sich im Deutschen bildhaft und direkt wiedergeben.
- source_word: גּוֹג
  choice: Gog
  rationale: Der abschließende Name fungiert als Anrede. Im heutigen Deutschen kennzeichnet die Satzstellung den Vokativ ausreichend, ohne ein altertümliches „o“.
theological_decisions:
- issue: Eschatologische Wendung בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  alternative: In künftigen Tagen; in den letzten Tagen
  rationale: Die gewählte Form bewahrt das prophetisch-eschatologische Gewicht und die zeitliche Offenheit, ohne einen bestimmten Endzeitfahrplan in den Text einzutragen.
- issue: Gottes Selbstheiligung in בְּהִקָּדְשִׁי בְךָ
  choice: wenn ich mich durch dich vor ihren Augen als heilig erweise
  alternative: wenn ich mich an dir vor ihren Augen heilige
  rationale: Der Haupttext macht verständlich, dass Gottes Heiligkeit öffentlich offenbar wird, und lässt „durch dich“ als instrumentale Deutung von בְךָ stehen. Die Fußnote bewahrt die formal nähere und stärker gerichtliche Lesart „an dir“, sodass die echte Mehrdeutigkeit nicht verdeckt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache und die prophetische Zeitformel bleiben erkennbar; schwer verständliche Selbstheiligungssprache wird im Haupttext behutsam verdeutlicht und in der Fußnote formal näher dokumentiert.
