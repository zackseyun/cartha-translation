base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/014.yaml
  text: 'Therefore prophesy[a], son of man, and say to Gog, ‘Thus says the Lord GOD: On that day, when my people Israel dwell securely, will you not know it?’'
translation:
  language: de
  text: 'Darum weissage, Menschensohn, und sage zu Gog: So spricht Jahwe, der Herr: An jenem Tag, wenn mein Volk Israel in Sicherheit wohnt[a], wirst du es nicht erkennen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sicher wohnt.'
    reason: לָבֶטַח bezeichnet ein Wohnen in Sicherheit; sowohl die adverbiale Wiedergabe „sicher“ als auch die nominale Wendung „in Sicherheit“ sind möglich.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den Folgerungszusammenhang mit dem vorhergehenden Abschnitt und klingt im heutigen Deutsch natürlich.
- source_word: הִנָּבֵא
  choice: weissage
  rationale: Gibt den Imperativ von נבא knapp und als etablierten prophetischen Ausdruck wieder.
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische wiederkehrende Anrede und ihre literarische Kontinuität.
- source_word: וְאָמַרְתָּ לְגוֹג
  choice: und sage zu Gog
  rationale: Gibt die anschließende Aufforderung direkt und idiomatisch wieder.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Entspricht der feierlichen prophetischen Botenformel im deutschen Bibelstil.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Gibt אֲדֹנָי als Titel und יהוה als Gottes Eigennamen unterscheidbar wieder, ohne die Verbindung zu einem doppelten „Herr“ einzuebnen.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Ist eine natürliche deutsche Wiedergabe der prophetischen Zeitangabe.
- source_word: בְּשֶׁבֶת עַמִּי יִשְׂרָאֵל
  choice: wenn mein Volk Israel ... wohnt
  rationale: Gibt den Infinitiv mit temporalem Sinn und den Zustand des Wohnens in natürlichem Deutsch wieder.
- source_word: לָבֶטַח
  choice: in Sicherheit
  rationale: Drückt den Zustand geschützten, ungefährdeten Wohnens aus; „sicher“ ist ebenfalls möglich.
- source_word: הֲלוֹא ... תֵּדָע
  choice: wirst du es nicht erkennen?
  rationale: Bewahrt die rhetorische Frage mit erwarteter Zustimmung. Das ergänzte „es“ macht den impliziten Bezug im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet zugleich die missverständliche Doppelung „Herr HERR“.
- issue: Bedeutung von ידע im Zusammenhang mit Gogs Reaktion
  choice: erkennen
  alternative: merken; davon erfahren; es wissen
  rationale: „Erkennen“ lässt offen, ob das Verb bloße Kenntnisnahme oder ein bewusstes Erfassen bezeichnet, und löst die prophetische Spannung nicht unnötig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit beibehaltener prophetischer Botenformel. Die rhetorische Frage und der charakteristische Ezechiel-Titel „Menschensohn“ bleiben erhalten.
