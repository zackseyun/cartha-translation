base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/019.yaml
  text: 'For in my jealousy[a], in the fire of my wrath, I have spoken: surely on that day there will be a great earthquake upon the land of Israel.'
translation:
  language: de
  text: 'Denn in meiner Eifersucht, im Feuer meines Zorns, habe ich gesprochen: Ganz gewiss, an jenem Tag wird es ein gewaltiges Erdbeben[a] auf Israels Boden geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein gewaltiges Beben“ beziehungsweise „eine gewaltige Erschütterung“. Das hebräische Wort רַעַשׁ kann ein allgemeineres Beben bezeichnen; im Zusammenhang ist „Erdbeben“ naheliegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקִנְאָתִי
  choice: Denn in meiner Eifersucht
  rationale: Das וְ wird im Zusammenhang begründend mit „Denn“ wiedergegeben. קִנְאָה kann Eifer oder Eifersucht bezeichnen; „Eifersucht“ bewahrt hier die starke persönliche und bundesbezogene Aussage, ohne sie zu bloßem Engagement abzuschwächen.
- source_word: בְאֵשׁ עֶבְרָתִי
  choice: im Feuer meines Zorns
  rationale: Die Feuermetapher und die Präposition werden erhalten. „Zorn“ gibt עֶבְרָה in würdigem, verständlichem Deutsch wieder.
- source_word: דִּבַּרְתִּי
  choice: habe ich gesprochen
  rationale: Das Perfekt bezeichnet die vollzogene, weiterhin gültige göttliche Rede; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: אִם לֹא
  choice: Ganz gewiss
  rationale: Die Verbindung dient hier als nachdrückliche, eidähnliche Bekräftigung und nicht als gewöhnlicher Bedingungssatz.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitformel.
- source_word: יִהְיֶה
  choice: wird es ... geben
  rationale: Die Existenzkonstruktion wird idiomatisch und ohne archaische Formulierung wiedergegeben.
- source_word: רַעַשׁ גָּדוֹל
  choice: ein gewaltiges Erdbeben
  rationale: רַעַשׁ bezeichnet ein Beben oder Erschüttern und kann konkret ein Erdbeben meinen. Der Kontext und der Bezug auf den Boden Israels stützen „Erdbeben“; „gewaltig“ gibt גָּדוֹל hier natürlicher wieder als „groß“.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: auf Israels Boden
  rationale: אַדְמָה bezeichnet Boden, Erdboden oder Land. „Auf Israels Boden“ bewahrt sowohl den räumlichen Sinn von עַל als auch den konkreten Bodenbezug.
theological_decisions:
- issue: Starke emotionale Sprache über Gott
  choice: meiner Eifersucht ... im Feuer meines Zorns
  alternative: meinem Eifer ... in der Glut meines Grimms
  rationale: Die Übersetzung erhält die persönliche Intensität und die Spannung der hebräischen Gottesrede, ohne sie durch abstrakte Gerichtssprache abzuschwächen oder dogmatisch zu erklären.
- issue: Göttliche Ich-Rede ohne ausdrückliche Sprecherangabe in diesem Vers
  choice: Die erste Person wird ohne ergänzte Sprecherformel beibehalten.
  alternative: Ergänzung von „spricht der HERR“ oder einer anderen Sprecherangabe
  rationale: Der Kontext kennzeichnet den Sprecher, doch der hebräische Wortlaut dieses Verses enthält keine zusätzliche Sprecherformel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die feierliche Bekräftigung wird verständlich, aber nicht archaisierend formuliert.
