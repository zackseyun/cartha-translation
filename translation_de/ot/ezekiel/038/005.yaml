  terminology: „Persien“, „Kusch“, „Put“, „Schild“ und „Helm“ sind treffend und registergerecht. Die Fußnoten bewahren die traditionellen, aber historisch stärker interpretierenden Alternativen als Hinweise, ohne sie in den Haupttext zu übernehmen.
