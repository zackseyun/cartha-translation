base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/005.yaml
  text: Persia[a], Cush, and Put are with them[b], all of them with shield and helmet.
translation:
  language: de
  text: Persien, Kusch[a] und Put[b] sind mit ihnen; sie alle sind mit Schild und Helm ausgerüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kusch wird traditionell in manchen Übersetzungen mit »Äthiopien« wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Put wird in manchen Übersetzungen und historischen Zuordnungen mit Libyen in Verbindung gebracht.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: Persien
  rationale: Der Eigenname bezeichnet Persien beziehungsweise dessen Bevölkerung; »Persien« ist die geläufige deutsche Namensform.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Die Transliteration bewahrt den hebräischen ethnogeografischen Namen und vermeidet die möglicherweise anachronistische Gleichsetzung mit Äthiopien.
- source_word: פוּט
  choice: Put
  rationale: Die Transliteration gibt den hebräischen Namen unmittelbar wieder; »Libyen« wäre bereits eine historische Identifizierung.
- source_word: אִתָּם
  choice: sind bei ihnen
  rationale: Die Präposition mit Pronominalsuffix bedeutet »bei/mit ihnen«; das im Hebräischen fehlende Kopulaverb wird für natürliches Deutsch ergänzt.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Form fasst die genannten Verbündeten ausdrücklich und mit distributivem Nachdruck zusammen.
- source_word: מָגֵן
  choice: Schild
  rationale: Dies ist die übliche, kontextgerechte Bezeichnung der genannten Schutzwaffe.
- source_word: כוֹבָע
  choice: Helm
  rationale: Im militärischen Zusammenhang ist »Helm« die natürliche und präzise deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzellipse des Hebräischen wird durch »sind« natürlich ergänzt; die ethnogeografischen Namen Kusch und Put bleiben transliteriert, damit unsichere historische Gleichsetzungen nicht in den Haupttext eingetragen werden.
