  text: וְ/נִשְׁפַּטְתִּ֥י אִתּ֖/וֹ בְּ/דֶ֣בֶר וּ/בְ/דָ֑ם וְ/גֶ֣שֶׁם שׁוֹטֵף֩ וְ/אַבְנֵ֨י אֶלְגָּבִ֜ישׁ אֵ֣שׁ וְ/גָפְרִ֗ית אַמְטִ֤יר עָלָי/ו֙ וְ/עַל אֲגַפָּ֔י/ו וְ/עַל עַמִּ֥ים רַבִּ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/022.yaml
  text: And I will enter into judgment with him by pestilence and bloodshed[a]; and I will rain down on him, on his troops, and on the many peoples who are with him, torrential rain, hailstones, fire[c][b], and sulfur.
translation:
  language: de
  text: Und ich werde mit ihm ins Gericht gehen durch Pest und Blutvergießen[a]. Sturzregen, Hagelsteine, Feuer und Schwefel werde ich auf ihn, auf seine Truppen[b] und auf die vielen Völker, die bei ihm sind, herabregnen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Blut“. Gemeint sein kann gewaltsamer Tod beziehungsweise Blutvergießen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Verbände“; das hebräische Wort kann militärische Flügel, Abteilungen oder die ihn begleitenden Streitkräfte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: ich werde mit ihm ins Gericht gehen
  rationale: Der Niphal von שׁפט mit אֵת bezeichnet hier ein gerichtliches Vorgehen gegen jemanden. Die deutsche Wendung bewahrt sowohl das Rechtsmotiv als auch die wörtliche Präposition „mit“, deren gegnerischer Sinn im Zusammenhang klar ist.
- source_word: בְּדֶבֶר
  choice: durch Pest
  rationale: דֶּבֶר bezeichnet häufig eine als Gericht kommende Seuche oder Pest. „Pest“ ist knapp, verständlich und entspricht dem instrumentalen בְּ.
- source_word: וּבְדָם
  choice: und Blutvergießen
  rationale: דָּם bedeutet wörtlich „Blut“, kann in einer Gerichtsliste aber gewaltsamen Tod beziehungsweise Blutvergießen bezeichnen. Die Fußnote erhält die wörtliche Möglichkeit.
- source_word: וְגֶשֶׁם שׁוֹטֵף
  choice: Sturzregen
  rationale: Die Verbindung beschreibt heftigen, alles überströmenden Regen. „Sturzregen“ gibt die Gewalt des Bildes natürlich und prägnant wieder.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: Hagelsteine
  rationale: Die Wendung bezeichnet Hagelsteine; die kompakte deutsche Entsprechung bewahrt das konkrete Unwetterbild.
- source_word: אֵשׁ וְגָפְרִית
  choice: Feuer und Schwefel
  rationale: „Schwefel“ ist die direkte moderne Entsprechung von גָפְרִית und vermeidet eine unnötig altertümliche Formulierung.
- source_word: אַמְטִיר
  choice: werde ich … herabregnen lassen
  rationale: Der Hiphil von מטר ist kausativ. Die deutsche Formulierung gibt sowohl das Veranlassen des Regnens als auch dessen gegen die Genannten gerichtete Bewegung wieder.
- source_word: אֲגַפָּיו
  choice: seine Truppen
  rationale: Das Wort kann wörtlich „Flügel“ beziehungsweise militärische Flanken oder Abteilungen bezeichnen. Im Kontext sind die Gog begleitenden Streitkräfte gemeint; „Truppen“ ist verständlich, ohne eine bestimmte Heeresordnung festzulegen.
- source_word: עַמִּים רַבִּים אֲשֶׁר אִתּוֹ
  choice: die vielen Völker, die bei ihm sind
  rationale: עַמִּים bezeichnet „Völker“ und nicht zwingend politische Nationen. Der bestimmte Ausdruck meint die bereits zu ihm gehörenden Völkerverbände.
theological_decisions:
- issue: Charakter der angekündigten Gerichte
  choice: Die einzelnen Gerichtsakte werden konkret und unmittelbar wiedergegeben.
  alternative: Die Unwetter- und Katastrophenbilder bereits in der Übersetzung ausdrücklich als bloße Metaphern deuten.
  rationale: Der hebräische Text kündigt Pest, Blut, Regen, Hagel, Feuer und Schwefel als Gottes Gericht an. Ob und in welchem Sinn einzelne Elemente symbolisch verstanden werden, soll die Übersetzung nicht vorentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Satzstellung des Hebräischen wird teilweise bewahrt, indem die vier Unheilserscheinungen vor das Verb gestellt werden. „Ins Gericht gehen“ erhält den rechtlichen Ton, während „Sturzregen“ und „herabregnen lassen“ die konkrete Wucht des prophetischen Bildes vermitteln.
