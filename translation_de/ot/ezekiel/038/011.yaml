source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ אֶֽעֱלֶה֙ עַל אֶ֣רֶץ פְּרָז֔וֹת אָבוֹא֙ הַ/שֹּׁ֣קְטִ֔ים יֹשְׁבֵ֖י לָ/בֶ֑טַח כֻּלָּ֗/ם יֹֽשְׁבִים֙ בְּ/אֵ֣ין חוֹמָ֔ה וּ/בְרִ֥יחַ וּ/דְלָתַ֖יִם אֵ֥ין לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/011.yaml
  text: and you will say[a], ‘I will go up against a land of unwalled villages; I will come against those who are at rest, who dwell securely, all of them dwelling without walls[d][c][b], and having no bars or gates.’
translation:
  language: de
  text: 'Und du wirst sagen: »Ich will hinaufziehen gegen ein Land mit unbefestigten Ortschaften.[a] Ich will über die kommen,[b] die ungestört und in Sicherheit wohnen. Sie alle wohnen ohne Mauern und haben weder Riegel noch Türen.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Land mit offenen Siedlungen« oder »offenes Land«; das hebräische Wort bezeichnet Orte ohne schützende Mauern.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Ich will zu denen kommen«; die Übersetzung »über die kommen« berücksichtigt den feindlichen Zusammenhang.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Riegel noch Tore«; »Türen« ist die unmittelbarere Wiedergabe des hebräischen Wortes, das im Zusammenhang auch Türen von Toranlagen bezeichnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Und du wirst sagen
  rationale: Das Qal Perfekt mit וְ hat im prophetischen Zusammenhang zukünftige beziehungsweise fortführende Bedeutung.
- source_word: אֶעֱלֶה
  choice: Ich will hinaufziehen
  rationale: עלה bezeichnet eine Aufwärtsbewegung; „hinaufziehen“ passt zugleich natürlich zu einem militärischen Vorhaben, ohne die Geografie näher festzulegen.
- source_word: אֶרֶץ פְּרָזוֹת
  choice: ein Land mit unbefestigten Ortschaften
  rationale: פְּרָזוֹת meint offene, nicht ummauerte Siedlungen beziehungsweise ländliche Orte. Die Formulierung erfasst den konkreten Mangel an Befestigungen und vermeidet die engere Festlegung auf Dörfer.
- source_word: אָבוֹא
  choice: Ich will über die kommen
  rationale: בוא bedeutet grundsätzlich „kommen“; „über jemanden kommen“ bewahrt die Bewegungsbedeutung und bringt im Deutschen den feindlichen Zusammenhang zum Ausdruck.
- source_word: הַשֹּׁקְטִים
  choice: die ungestört ... wohnen
  rationale: Das Partizip von שקט bezeichnet Ruhe und Ungestörtheit. „Ungestört“ ist hier natürlich und wahrt den friedlichen Zustand.
- source_word: יֹשְׁבֵי לָבֶטַח
  choice: in Sicherheit wohnen
  rationale: Die Wendung verbindet sesshaftes Wohnen mit einem Zustand der Sicherheit.
- source_word: כֻּלָּם יֹשְׁבִים
  choice: Sie alle wohnen
  rationale: Ein selbstständiger deutscher Satz gibt die erklärende neue Teilaussage klar wieder und bewahrt die Wiederholung von ישב.
- source_word: בְּאֵין חוֹמָה
  choice: ohne Mauern
  rationale: Der hebräische Singular חוֹמָה kann kollektiv stehen; im Deutschen bezeichnet der Plural idiomatisch die fehlenden Befestigungsmauern der verschiedenen Ortschaften.
- source_word: וּבְרִיחַ וּדְלָתַיִם אֵין לָהֶם
  choice: haben weder Riegel noch Tore
  rationale: בְּרִיחַ ist ein Verschlussriegel; דְּלָתַיִם bedeutet wörtlich Türen beziehungsweise Doppeltüren, bezeichnet hier im Zusammenhang der Befestigung jedoch natürlich Tore. Die weder-noch-Konstruktion gibt אֵין לָהֶם idiomatisch wieder.
