lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: In der festen prophetischen Formel ויהי דבר־יהוה אלי gibt „erging“ den Sinn idiomatisch und würdevoll wieder, statt das Verb isoliert als „war“ zu übersetzen.
- source_word: דְבַר
  choice: das Wort
  rationale: „Das Wort“ bewahrt den etablierten prophetischen Sprachgebrauch und die lexikalische Verbindung zur anschließenden göttlichen Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner gebräuchlichen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt durch den Titel „der HERR“ ersetzt zu werden.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit „erging“ ist „an mich“ die natürliche deutsche Wiedergabe der Richtung auf den Propheten hin.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv führt die unmittelbar folgende Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen; die Fußnote weist transparent auf die hebräische Form und eine alternative Wiedergabe hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel wird mit „das Wort Jahwes erging an mich“ bewahrt; der Doppelpunkt leitet die folgende Gottesrede knapp und natürlich ein.
