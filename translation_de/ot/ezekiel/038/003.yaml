base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/003.yaml
  text: 'and say, ‘Thus says the Lord GOD: Behold, I am against you, Gog, chief prince of Meshech and Tubal.’'
translation:
  language: de
  text: 'und sage: »So spricht Gott, der HERR: Siehe, ich bin gegen dich, Gog, oberster Fürst von Meschech und Tubal.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Gibt die Verbindung aus dem Herrschaftstitel Adonaj und dem Gottesnamen JHWH würdig wieder; die Großschreibung kennzeichnet den Gottesnamen.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Siehe, ich bin gegen dich
  rationale: Bewahrt die nachdrückliche Präsentationsformel הִנְנִי und gibt אֵלֶיךָ im feindlichen Kontext idiomatisch als »gegen dich« wieder.
- source_word: נְשִׂיא רֹאשׁ
  choice: oberster Fürst
  rationale: Versteht רֹאשׁ attributiv im Sinn von »oberster/höchster« und vermeidet die unsichere Deutung als Eigenname »Rosch«.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Meschech und Tubal
  rationale: Transliteriert die beiden Völker- beziehungsweise Gebietsnamen in ihrer im Deutschen vertrauten biblischen Form.
theological_decisions:
- issue: Deutung von רֹאשׁ in נְשִׂיא רֹאשׁ
  choice: »oberster Fürst von Meschech und Tubal«
  alternative: »Fürst von Rosch, Meschech und Tubal«
  rationale: Die syntaktisch und lexikalisch naheliegende Lesart nimmt רֹאשׁ als Rangbezeichnung. Da die Eigenname-Deutung umstritten ist und keine eindeutige theologische Identifikation begründet werden sollte, wird sie nicht in den Haupttext aufgenommen.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetischer Redeformel. »Siehe« bleibt als markante biblische Hervorhebung erhalten; die Namensformen sind für deutschsprachige Leser geläufig.
