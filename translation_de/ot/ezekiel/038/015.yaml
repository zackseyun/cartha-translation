id: EZK.38.15
reference: Ezekiel 38:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָ֤אתָ מִ/מְּקֽוֹמְ/ךָ֙ מִ/יַּרְכְּתֵ֣י צָפ֔וֹן אַתָּ֕ה וְ/עַמִּ֥ים רַבִּ֖ים אִתָּ֑/ךְ רֹכְבֵ֤י סוּסִים֙ כֻּלָּ֔/ם קָהָ֥ל גָּד֖וֹל וְ/חַ֥יִל רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/015.yaml
  text: And you will come from your place[a], from the far north—you and many peoples with you[b], all of them riding horses—a great assembly and a mighty army.
translation:
  language: de
  text: Und du wirst von deinem Ort kommen, aus dem äußersten Norden[a] – du und viele Völker mit dir, sie alle auf Pferden reitend, eine große Schar und ein gewaltiges Heer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den fernsten Gegenden des Nordens“ beziehungsweise „aus dem fernsten Norden“. Die hebräische Wendung bezeichnet die äußersten Bereiche des Nordens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein großes Aufgebot und eine gewaltige Streitmacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Und du wirst … kommen
  rationale: Das Qal Perfekt 2. Person maskulin Singular hat im prophetischen Zusammenhang Zukunftsbedeutung. „Wirst kommen“ gibt dies in modernem Deutsch klar wieder; „Und“ bewahrt die fortlaufende Gedankenfolge.
- source_word: מִמְּקוֹמְךָ
  choice: von deinem Ort
  rationale: מָקוֹם bedeutet allgemein „Ort“ oder „Platz“. „Von deinem Ort“ bleibt nah am Hebräischen und klingt zugleich natürlich.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: aus dem äußersten Norden
  rationale: Die Wendung bezeichnet die entlegenen oder äußersten Bereiche des Nordens. „Aus dem äußersten Norden“ bewahrt die räumliche Steigerung, ohne die hebräische Ausdrucksweise unnötig wörtlich nachzuahmen.
- source_word: אַתָּה וְעַמִּים רַבִּים אִתָּךְ
  choice: du und viele Völker mit dir
  rationale: Das selbstständige Pronomen hebt den Angeredeten hervor. עַמִּים wird als „Völker“ wiedergegeben, da verschiedene verbündete Volksgruppen gemeint sind, ohne sie vorschnell als politische Nationen zu bestimmen.
- source_word: רֹכְבֵי סוּסִים כֻּלָּם
  choice: sie alle auf Pferden reitend
  rationale: Die Formulierung gibt sowohl das Reiten auf Pferden als auch das betonte כֻּלָּם („sie alle“) ausdrücklich wieder. Die partizipiale Fügung wahrt den beschreibenden Charakter des Hebräischen.
- source_word: קָהָל גָּדוֹל
  choice: eine große Schar
  rationale: קָהָל bezeichnet eine versammelte Menge. Im militärischen Zusammenhang ist „Schar“ natürlicher als „Versammlung“ und vermeidet kirchliche Nebenbedeutungen von „Gemeinde“.
- source_word: וְחַיִל רָב
  choice: und ein gewaltiges Heer
  rationale: חַיִל bezeichnet hier eine militärische Macht oder Streitmacht. „Gewaltiges Heer“ bringt sowohl den militärischen Sinn als auch die durch רָב ausgedrückte Größe und Stärke zur Geltung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und die Hervorhebung des Angeredeten bleiben erhalten; zugleich werden schwerfällige wörtliche Hebraismen vermieden. Die Gedankenstriche gliedern die nachgestellte Beschreibung der heranziehenden Gruppe.
