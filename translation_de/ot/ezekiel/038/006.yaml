id: EZK.38.6
reference: Ezekiel 38:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גֹּ֚מֶר וְ/כָל אֲגַפֶּ֔י/הָ בֵּ֚ית תּֽוֹגַרְמָ֔ה יַרְכְּתֵ֥י צָפ֖וֹן וְ/אֶת כָּל אֲגַפָּ֑י/ו עַמִּ֥ים רַבִּ֖ים אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/006.yaml
  text: Gomer and all its troops[b][a], the house of Togarmah from the far north and all its troops—many peoples are with you.
translation:
  language: de
  text: Gomer und alle seine Truppen[a], das Haus Togarma aus den entlegensten Gebieten des Nordens[b] und alle seine Truppen – viele Völker sind bei dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine Flügel« beziehungsweise »alle seine Verbände«. Das hebräische Wort kann Flügel, äußerste Bereiche oder angegliederte Heeresabteilungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »aus den äußersten Teilen des Nordens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Eigenname eines Volkes bzw. Landes; daher in der geläufigen deutschen Form transliteriert.
- source_word: אֲגַפֶּיהָ / אֲגַפָּיו
  choice: seine Truppen
  rationale: Das Substantiv kann wörtlich »Flügel« oder »Seiten« bezeichnen, meint in dieser militärischen Aufzählung aber wahrscheinlich angegliederte Heeresverbände. »Truppen« gibt den Zusammenhang verständlich wieder; die mögliche Bildsprache bleibt in der Fußnote erhalten.
- source_word: בֵּית תּוֹגַרְמָה
  choice: das Haus Togarma
  rationale: Die hebräische Verbindung »Haus Togarma« wird als ethnogeografische Bezeichnung bewahrt, ohne sie vorschnell als bloße Orts- oder Volksbezeichnung aufzulösen.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: aus den entlegensten Gebieten des Nordens
  rationale: Die Wendung bezeichnet die äußersten bzw. abgelegenen Bereiche des Nordens. Die Formulierung wahrt den räumlichen Nachdruck und klingt zugleich in modernem Deutsch natürlich.
- source_word: עַמִּים רַבִּים
  choice: viele Völker
  rationale: עַמִּים bezeichnet hier ethnische Volksgruppen und nicht zwingend politisch organisierte Nationen; »Völker« bewahrt diese Bedeutungsbreite.
- source_word: אִתָּךְ
  choice: bei dir
  rationale: Gibt die Zugehörigkeit bzw. Begleitung knapp und idiomatisch wieder. Das feminine Suffix des Hebräischen lässt sich im Deutschen an dieser Stelle nicht sinnvoll sichtbar machen.
theological_decisions: []
