  source_fidelity: 'Die Übersetzung gibt die hebräische Aufzählung vollständig wieder: Gomer mit allen seinen zugehörigen Verbänden, das Haus Togarma aus den äußersten nördlichen Regionen mit seinen Verbänden sowie die abschließende Aussage, dass viele Völker mit Gog sind. »Truppen« ist im militärischen Kontext eine tragfähige kontextuelle Wiedergabe von אֲגַפִּים; die Fußnote wahrt die lexikalische Offenheit. Die nicht im Deutschen markierte feminine Anredeform von אִתָּךְ ist sachgerecht, da sie sich nicht idiomatisch abbilden lässt.'
