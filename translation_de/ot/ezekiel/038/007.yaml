  text: Be prepared[b][a], and prepare yourself—you and all your assembly who are gathered around you—and be a guard for them.
translation:
  language: de
  text: Sei bereit und bereite dich vor[a] – du und dein ganzes Aufgebot, das sich um dich versammelt hat – und sei ihnen ein Wächter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mach dich bereit und bereite dich vor.“ Die beiden verwandten Verben verstärken den Aufruf zur Bereitschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Halte für sie Wache“ beziehungsweise „sei ihr Hüter“. Das hebräische Wort kann Bewachung, Schutz oder Aufsicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֹּן
  choice: Sei bereit
  rationale: Der Niphal-Imperativ von כון fordert hier zu einem Zustand der Bereitschaft auf. „Sei bereit“ ist natürlich, prägnant und bewahrt die Befehlsform.
- source_word: וְהָכֵן לְךָ
  choice: und rüste dich
  rationale: Der Hiphil-Imperativ mit לְךָ bezeichnet aktive Selbstvorbereitung. Zusammen mit dem ersten Imperativ verstärkt er den Aufruf; „rüste dich“ passt zudem zum militärischen Kontext, ohne die Art der Vorbereitung näher festzulegen.
- source_word: קְהָלֶךָ
  choice: dein ganzes Aufgebot
  rationale: קהל bezeichnet eine versammelte Gruppe. „Aufgebot“ gibt im militärischen Zusammenhang die organisierte Schar idiomatisch wieder, ohne sie enger als ein bestimmter Truppentyp zu bestimmen.
- source_word: הַנִּקְהָלִים עָלֶיךָ
  choice: das sich um dich versammelt hat
  rationale: Das Niphal-Partizip beschreibt die bei Gog versammelte Gruppe; עָלֶיךָ wird kontextgerecht räumlich-relational mit „um dich“ wiedergegeben.
- source_word: וְהָיִיתָ לָהֶם לְמִשְׁמָר
  choice: und sei ihnen ein Wächter
  rationale: מִשְׁמָר kann Wache, Bewachung, Schutz oder Aufsicht bezeichnen. „Sei ihnen ein Wächter“ erhält die nominale Form und lässt offen, ob vor allem Schutz, Wachsamkeit oder leitende Aufsicht gemeint ist.
theological_decisions: []
