source:
  edition: WLC
  text: וְ/עָלִ֨יתָ֙ כַּ/שֹּׁאָ֣ה תָב֔וֹא כֶּ/עָנָ֛ן לְ/כַסּ֥וֹת הָ/אָ֖רֶץ תִּֽהְיֶ֑ה אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֥ים רַבִּ֖ים אוֹתָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/009.yaml
  text: You will come up like a storm; you will be like a cloud covering the land—you and all your troops, and many peoples with you.
translation:
  language: de
  text: Du wirst heraufziehen, wie ein Unwetter wirst du kommen. Wie eine Wolke, die das Land bedeckt, wirst du sein – du und alle deine Truppen und viele Völker mit dir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַשֹּׁאָה
  choice: wie ein Unwetter
  rationale: שׁוֹאָה bezeichnet hier ein verheerendes, stürmisch hereinbrechendes Ereignis; „Unwetter“ bewahrt Bildkraft und Bedrohlichkeit, ohne das Bild unnötig auf einen bestimmten Sturmtyp festzulegen.
- source_word: אֲגַפֶּיךָ
  choice: deine Truppen
  rationale: אֲגַפִּים kann militärische Abteilungen, Flügel oder Verbände bezeichnen. Im Kontext des angreifenden Heeres gibt „Truppen“ den Sinn natürlich wieder, ohne eine konkrete Schlachtordnung vorauszusetzen.
- source_word: לְכַסּוֹת הָאָרֶץ
  choice: die das Land bedeckt
  rationale: Der Infinitiv drückt Wirkung beziehungsweise Zweck des Wolkenvergleichs aus. Die attributive Form klingt im Deutschen natürlich und bewahrt das Bild der flächendeckenden Wolke.
theological_decisions:
- issue: Bezug und Aussageform von תִהְיֶה
  choice: „wirst du sein“ als eigenständige Aussage beim Wolkenvergleich
  alternative: „wirst du kommen, um das Land zu bedecken“
  rationale: 'Die masoretische Akzentuierung und die Wortstellung unterstützen die prädikative Lesart: Der Angreifer wird wie eine das Land bedeckende Wolke sein. Diese Fassung erhält außerdem die Spannung zwischen Kommen und Sein, statt beide Aussagen zu verschmelzen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Zukunftsaussagen und die beiden Vergleiche des Hebräischen bleiben erkennbar; der Gedankenstrich hebt die nachgestellte Entfaltung des Subjekts hervor.
