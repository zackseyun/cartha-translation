source:
  edition: WLC
  text: וְ/קָרָ֨אתִי עָלָ֤י/ו לְ/כָל הָרַ/י֙ חֶ֔רֶב נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב אִ֖ישׁ בְּ/אָחִ֥י/ו תִּֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/021.yaml
  text: And I will summon a sword against him on all my mountains[a], declares the Lord GOD; every man's sword will be against his brother.
translation:
  language: de
  text: Auf allen meinen Bergen werde ich ein Schwert gegen ihn aufbieten[a] – so spricht der Herr Jahwe. Das Schwert eines jeden wird gegen seinen Bruder gerichtet sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: herbeirufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתִי
  choice: werde ich … aufbieten
  rationale: קרא bezeichnet hier das Herbeirufen beziehungsweise Aufbieten eines Werkzeugs des Gerichts. „Aufbieten“ ist im Deutschen natürlich und bewahrt den Gedanken göttlicher Veranlassung.
- source_word: עָלָיו
  choice: gegen ihn
  rationale: עַל bezeichnet in diesem Gerichtskontext die feindliche Ausrichtung gegen Gog.
- source_word: לְכָל הָרַי
  choice: auf allen meinen Bergen
  rationale: Die Wendung lokalisiert das Gericht im gesamten Bergland, das Jahwe als seine Berge bezeichnet. Die räumliche Wiedergabe entspricht dem Zusammenhang.
- source_word: חֶרֶב
  choice: ein Schwert
  rationale: Das erste חֶרֶב bezeichnet das Schwert allgemein als aufgebotenes Gerichtsmittel; im Deutschen ist hier der unbestimmte Artikel angemessen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: so spricht der Herr Jahwe
  rationale: נְאֻם ist eine prophetische Botenformel. אֲדֹנָי wird mit „der Herr“ wiedergegeben, während der Gottesname יְהוִה als „Jahwe“ erhalten bleibt.
- source_word: חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה
  choice: Das Schwert eines jeden wird gegen seinen Bruder gerichtet sein
  rationale: Die Formulierung bewahrt das konkrete Bild gegenseitiger Gewalt und die distributive Bedeutung von אִישׁ. „Bruder“ bezeichnet hier den jeweiligen Mitkämpfer beziehungsweise Volksgenossen, ohne diese Beziehung enger festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Fassung unterscheidet den Titel אֲדֹנָי vom offenbarten Gottesnamen יְהוָה und vermeidet die unnatürliche Verdoppelung „Herr HERR“.
- issue: Gegenseitige Gewalt unter den Angreifern
  choice: Das Schwert eines jeden wird gegen seinen Bruder gerichtet sein
  alternative: Jeder wird sein Schwert gegen seinen Bruder richten
  rationale: Die passive beziehungsweise stative Formulierung bleibt näher bei תִּהְיֶה („wird sein“) und lässt offen, auf welche konkrete Weise Gott die gegenseitige Vernichtung herbeiführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufbieten“ ist leicht gehoben, aber allgemein verständlich und für die prophetische Gerichtssprache passend. Der Gedankenstrich gliedert die Gotteswortformel, ohne den Satzinhalt zu verändern.
