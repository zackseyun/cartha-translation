  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַֽ/אַתָּה ה֨וּא אֲשֶׁר דִּבַּ֜רְתִּי בְּ/יָמִ֣ים קַדְמוֹנִ֗ים בְּ/יַד֙ עֲבָדַ/י֙ נְבִיאֵ֣י יִשְׂרָאֵ֔ל הַֽ/נִּבְּאִ֛ים בַּ/יָּמִ֥ים הָ/הֵ֖ם שָׁנִ֑ים לְ/הָבִ֥יא אֹתְ/ךָ֖ עֲלֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/017.yaml
  text: 'Thus says the Lord GOD: Are you the one of whom I spoke in former days by the hand of my servants the prophets of Israel[c][b][a], who prophesied in those days for years that I would bring you against them?'
translation:
  language: de
  text: 'So spricht der Herr Jahwe: Bist du derjenige, von dem ich in früheren Tagen[a] durch[b] meine Diener, die Propheten Israels, gesprochen habe, die damals jahrelang[c] weissagten, dass ich dich gegen sie heranführen würde?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in längst vergangenen Tagen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hand meiner Diener“; die hebräische Wendung bezeichnet Vermittlung oder Beauftragung.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Hebräischen die ungewöhnliche Verbindung „in jenen Tagen, Jahre“. Sie kann hervorheben, dass über einen längeren Zeitraum prophetisch davon gesprochen wurde.
    reason: source_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: 'Gibt beide Bestandteile des zusammengesetzten Gottestitels wieder: אֲדֹנָי als „Herr“ und den Gottesnamen יהוה als „Jahwe“.'
- source_word: הַאַתָּה הוּא
  choice: Bist du der
  rationale: Bewahrt die nachdrückliche Identifikationsfrage in natürlichem, modernem Deutsch.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: von dem ich … geredet habe
  rationale: Das Relativpronomen bezieht sich auf Gog; „von jemandem reden“ gibt die Aussage idiomatisch wieder.
- source_word: בְּיָמִים קַדְמוֹנִים
  choice: in früheren Tagen
  rationale: Bewahrt den zeitlichen Rückblick, ohne unnötig altertümlich zu klingen.
- source_word: בְּיַד
  choice: durch
  rationale: Die wörtliche Wendung „durch die Hand“ bezeichnet hier die Propheten als Vermittler der göttlichen Rede; „durch“ ist im Deutschen natürlich.
- source_word: עֲבָדַי נְבִיאֵי יִשְׂרָאֵל
  choice: meine Diener, die Propheten Israels
  rationale: „Diener“ entspricht dem prophetischen Beauftragungsverhältnis; die Apposition identifiziert sie als Israels Propheten.
- source_word: הַנִּבְּאִים בַּיָּמִים הָהֵם שָׁנִים
  choice: Sie prophezeiten damals jahrelang
  rationale: Gibt die ungewöhnliche Verbindung von „in jenen Tagen“ und „Jahre“ verständlich wieder und erhält den Nachdruck auf der längeren Zeitspanne.
- source_word: לְהָבִיא אֹתְךָ עֲלֵיהֶם
  choice: dass ich dich gegen sie heranführen würde
  rationale: Versteht den Infinitiv als Inhalt der früheren prophetischen Rede; „gegen sie“ entspricht dem feindlichen militärischen Zusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens im Titel אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Form hält den Titel „Herr“ und den Eigennamen „Jahwe“ auseinander und macht den im Hebräischen ausdrücklich stehenden Gottesnamen sichtbar.
- issue: Bezug der früheren prophetischen Aussagen auf Gog
  choice: Die Frage identifiziert Gog als Gegenstand früherer Prophetie, ohne bestimmte ältere Texte zu benennen.
  alternative: Die Aussage ausdrücklich auf eine einzelne bekannte Weissagung beziehen.
  rationale: Der Vers nennt keine konkrete frühere Weissagung; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwerfällige hebräische Zeitangabe wird im Haupttext verständlich als „damals jahrelang“ wiedergegeben und in der Fußnote transparent gemacht. Die Teilung in zwei Sätze erleichtert die Lesbarkeit, ohne die Frageform oder den Zusammenhang der Relativkonstruktion aufzulösen.
