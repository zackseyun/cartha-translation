source:
  edition: WLC
  text: אֶֽת הַ/נָּשִׂ֗יא נָ֥שִׂיא ה֛וּא יֵֽשֶׁב בּ֥/וֹ לֶ/אֱכָול לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה מִ/דֶּ֨רֶךְ אֻלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/מִ/דַּרְכּ֖/וֹ יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/003.yaml
  text: As for the prince[a], because he is the prince, he may sit in it to eat bread before Yahweh. He shall enter by way of the porch of the gate, and shall go out by the same way.
translation:
  language: de
  text: 'Was den Fürsten betrifft: Weil er der Fürst ist, darf er darin sitzen, um vor Jahwe Brot zu essen. Er soll durch die Vorhalle des Tores hineingehen und auf demselben Weg wieder hinausgehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und von seinem Weg soll er hinausgehen“; gemeint ist wahrscheinlich, dass er auf dem eben genannten Weg wieder hinausgeht.'
    reason: Die hebräische Formulierung mit dem Suffix „sein Weg“ ist knapper und mehrdeutiger als die im Haupttext gewählte idiomatische Wiedergabe.
lexical_decisions:
- source_word: אֶת הַנָּשִׂיא
  choice: Was den Fürsten betrifft
  rationale: Das vorangestellte אֶת mit dem bestimmten Substantiv markiert den Fürsten als hervorgehobenes Thema. Die deutsche Wendung bildet diese Topikalisierung natürlich ab.
- source_word: נָשִׂיא
  choice: Fürst
  rationale: נָשִׂיא bezeichnet bei Ezechiel einen anerkannten Herrscher beziehungsweise Repräsentanten des Volkes. „Fürst“ bewahrt den etablierten Sprachgebrauch, ohne seine genaue Identität festzulegen.
- source_word: נָשִׂיא הוּא
  choice: Weil er der Fürst ist
  rationale: Die Wiederholung des Titels mit dem Pronomen ist emphatisch und begründet hier das besondere Vorrecht. Die kausale Formulierung gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: יֵשֶׁב בּוֹ
  choice: darf er darin sitzen
  rationale: Der Imperfekt bezeichnet im rechtlich-anweisenden Zusammenhang eine erlaubte Handlung. „Darin“ nimmt auf den zuvor genannten Torbereich Bezug.
- source_word: לֶאֱכָל לֶחֶם
  choice: um … Brot zu essen
  rationale: Die konkrete hebräische Wendung „Brot essen“ bleibt erhalten; sie kann zugleich allgemein die Einnahme einer Mahlzeit bezeichnen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ bewahrt sowohl die räumliche als auch die kultische Bedeutung von לִפְנֵי; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: מִדֶּרֶךְ אֻלָם הַשַּׁעַר
  choice: durch die Vorhalle des Tores
  rationale: אֻלָם bezeichnet die Vorhalle beziehungsweise den Vorraum eines Bauwerks. Die Formulierung gibt den gemeinten Zugangsweg in idiomatischem Deutsch wieder.
- source_word: יָבֹוא
  choice: Er soll … hineingehen
  rationale: Der Imperfekt hat in diesem anweisenden Kontext direktiven Charakter. „Hineingehen“ verdeutlicht die Bewegungsrichtung.
- source_word: וּמִדַּרְכּוֹ יֵצֵא
  choice: und auf demselben Weg wieder hinausgehen
  rationale: Die Wendung bedeutet wahrscheinlich, dass der Fürst über die eben genannte Route zurückkehrt. „Wieder“ und „derselbe Weg“ machen diese räumliche Entsprechung idiomatisch deutlich; die wörtlichere, mehrdeutige Form steht in der Fußnote.
theological_decisions:
- issue: Identität und Stellung des נָשִׂיא in Ezechiels Tempelvision
  choice: Der Titel wird neutral mit „Fürst“ wiedergegeben.
  alternative: Eine ausdrückliche Identifikation als Messias oder als ausschließlich weltlicher beziehungsweise davidischer Amtsträger.
  rationale: Der Vers gewährt dem Fürsten ein besonderes Vorrecht, entscheidet aber nicht die weitergehende Frage nach seiner Identität. Die Übersetzung fügt daher keine dogmatische Festlegung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die topikalisierende Eröffnung bewahrt die Hervorhebung des Fürsten; rechtliche Erlaubnis und vorgeschriebener Zugangsweg werden klar unterschieden. Die traditionelle konkrete Wendung „Brot essen“ bleibt erhalten.
