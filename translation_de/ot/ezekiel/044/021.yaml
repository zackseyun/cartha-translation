  language: de
  text: Kein Priester darf Wein trinken, wenn er den inneren Vorhof betritt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַיִן
  choice: Wein
  rationale: יַיִן bezeichnet eindeutig Wein. Das einleitende וְ verbindet die Vorschrift mit dem vorausgehenden Zusammenhang; im Deutschen muss diese Verbindung am Versanfang nicht eigens wiedergegeben werden.
- source_word: לֹא יִשְׁתּוּ
  choice: darf … nicht trinken
  rationale: Die Verneinung mit dem Imperfekt hat hier Vorschriftscharakter. Die deutsche Formulierung mit „darf … nicht“ drückt das Verbot natürlich und eindeutig aus.
- source_word: כָּל כֹּהֵן
  choice: Kein Priester
  rationale: Wörtlich steht „jeder Priester“ in einer verneinten Aussage. „Kein Priester“ gibt im Deutschen den universalen Geltungsbereich des Verbots idiomatisch wieder.
- source_word: בְּבוֹאָם
  choice: wenn er … betritt
  rationale: Die Präposition mit Infinitiv und pluralischem Suffix bezeichnet den Zeitpunkt des Eintretens. Das Hebräische behandelt die Priester kollektiv; nach dem idiomatischen deutschen Singular „kein Priester“ ist der Rückbezug mit „er“ grammatisch passend.
- source_word: אֶל הֶחָצֵר הַפְּנִימִית
  choice: den inneren Vorhof betritt
  rationale: אֶל bezeichnet die Bewegung hinein; חָצֵר meint im Tempelzusammenhang den Hof beziehungsweise Vorhof. „Den inneren Vorhof betreten“ ist präzise und natürlich.
