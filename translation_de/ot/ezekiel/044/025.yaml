id: EZK.44.25
reference: Ezekiel 44:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶל מֵ֣ת אָדָ֔ם לֹ֥א יָב֖וֹא לְ/טָמְאָ֑ה כִּ֣י אִם לְ/אָ֡ב וּ֠/לְ/אֵם וּ/לְ/בֵ֨ן וּ/לְ/בַ֜ת לְ/אָ֗ח וּ/לְ/אָח֛וֹת אֲשֶֽׁר לֹא הָיְתָ֥ה לְ/אִ֖ישׁ יִטַּמָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/025.yaml
  text: And they shall not go near a dead person to make themselves unclean; but for father or mother[a], for son or daughter, for brother, or for a sister who has not belonged to a man, they may make themselves unclean.
translation:
  language: de
  text: Sie sollen sich keinem Toten nähern und sich dadurch unrein machen. Nur für Vater oder Mutter, Sohn oder Tochter, Bruder oder eine Schwester, die noch keinem Mann angehört hat,[a] dürfen sie sich unrein machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: eine unverheiratete Schwester.'
    reason: Idiomatiche Erklärung der hebräischen Wendung „die keinem Mann gewesen ist“.
lexical_decisions:
- source_word: מֵת אָדָם
  choice: einem Toten
  rationale: Die Verbindung bezeichnet hier einen verstorbenen Menschen beziehungsweise dessen Leichnam. „Einem Toten“ ist im Deutschen natürlich, wahrt den substantivierten maskulinen Singular und passt zum Zusammenhang kultischer Unreinheit.
- source_word: יָבוֹא אֶל
  choice: sich nähern
  rationale: Im priesterlichen Reinheitskontext geht es um die Annäherung an einen Toten, nicht bloß um ein räumliches Ankommen.
- source_word: לְטָמְאָה
  choice: und sich dadurch unrein machen
  rationale: Der Infinitiv bezeichnet die mit der Annäherung verbundene Folge beziehungsweise Absicht. „Dadurch“ macht diesen Zusammenhang im Deutschen klar, ohne eine Berührung ausdrücklich hinzuzufügen.
- source_word: כִּי אִם
  choice: nur
  rationale: Die Wendung führt Ausnahmen vom vorausgehenden Verbot ein. „Nur“ gibt die ausschließende Kraft knapp und idiomatisch wieder.
- source_word: לְאָב וּלְאֵם וּלְבֵן וּלְבַת לְאָח וּלְאָחוֹת
  choice: für Vater oder Mutter, Sohn oder Tochter, Bruder oder eine Schwester
  rationale: Das ל markiert die Angehörigen, derentwegen die Verunreinigung gestattet ist. Die nicht ausdrücklich gesetzten Possessivpronomen werden auch im Deutschen nicht ergänzt.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: die noch keinem Mann angehört hat
  rationale: Die relativ wörtliche Formulierung bewahrt die relationale und eheliche Ausdrucksweise des Hebräischen; „noch“ gibt den im Kontext vorausgesetzten bisherigen Zustand wieder. Die idiomatische Bedeutung steht in der Fußnote.
- source_word: יִטַּמָּאוּ
  choice: dürfen sie sich unrein machen
  rationale: 'Der Imperfekt hat in dieser Rechtsbestimmung permissive Bedeutung: Die genannten Fälle sind Ausnahmen, keine Aufforderung zur Verunreinigung.'
theological_decisions:
- issue: Rechtskraft des abschließenden Imperfekts יִטַּמָּאוּ
  choice: 'Erlaubnis: „dürfen sie sich unrein machen“'
  alternative: Gebot („sollen sie sich unrein machen“) oder einfache Zukunft („werden sie sich unrein machen“)
  rationale: Der Satz nennt Ausnahmen von einem Verbot. Deshalb ist die Handlung gestattet, aber nicht angeordnet.
- issue: Bedeutung der Schwesterklausel אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: eine Schwester, die noch keinem Mann angehört hat
  alternative: eine unverheiratete Schwester; eine jungfräuliche Schwester
  rationale: Die hebräische Wendung weist am ehesten auf fehlende eheliche Bindung. „Jungfräulich“ wäre enger als der Wortlaut; „unverheiratet“ ist idiomatisch, aber stärker auslegend und wird deshalb als Fußnotenerklärung geboten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Plural bezieht sich aus dem Zusammenhang auf die Priester. Die Terminologie „unrein machen“ bewahrt den kultisch-rechtlichen Charakter des Abschnitts.
