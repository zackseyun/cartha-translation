  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם בְּנֵ֣י צָד֗וֹק אֲשֶׁ֨ר שָׁמְר֜וּ אֶת מִשְׁמֶ֤רֶת מִקְדָּשִׁ/י֙ בִּ/תְע֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵֽ/עָלַ֔/י הֵ֛מָּה יִקְרְב֥וּ אֵלַ֖/י לְ/שָֽׁרְתֵ֑/נִי וְ/עָמְד֣וּ לְ/פָנַ֗/י לְ/הַקְרִ֥יב לִ/י֙ חֵ֣לֶב וָ/דָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/015.yaml
  text: But the Levitical priests[a], the sons of Zadok, who kept the charge of my sanctuary when the sons of Israel went astray from me—they shall come near to me to minister to me, and they shall stand before me to offer to me fat and blood[c][b], declares the Lord GOD.
translation:
  language: de
  text: Doch die levitischen Priester[a], die Söhne Zadoks, die den Dienst an meinem Heiligtum versahen, als die Söhne Israels von mir abirrten — sie sollen sich mir nahen, um mir zu dienen. Sie sollen vor mir stehen, um mir Fett und Blut darzubringen, spricht der Herr Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Priester, die Leviten“. Die hebräische Wortfolge kann als Apposition verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „der Herr JHWH“. „Yahweh“ gibt hier den Gottesnamen JHWH wieder.'
    reason: divine_name
lexical_decisions:
- source_word: וְהַכֹּהֲנִים הַלְוִיִּם
  choice: Doch die levitischen Priester
  rationale: Das einleitende וְ markiert hier im Zusammenhang den Gegensatz zu den zuvor getadelten Leviten; „doch“ gibt diesen Kontrast natürlich wieder. „Levitische Priester“ ist flüssiges modernes Deutsch, während die mögliche Apposition in einer Fußnote erhalten bleibt.
- source_word: בְּנֵי צָדוֹק
  choice: die Söhne Zadoks
  rationale: Die formnahe Wiedergabe bewahrt die Abstammungssprache des Hebräischen; gemeint ist die priesterliche Linie Zadoks.
- source_word: שָׁמְרוּ אֶת מִשְׁמֶרֶת מִקְדָּשִׁי
  choice: die den Dienst an meinem Heiligtum treu versahen
  rationale: מִשְׁמֶרֶת bezeichnet hier den anvertrauten kultischen Dienst beziehungsweise die zu wahrende Verpflichtung. „Treu versahen“ bringt sowohl שׁמר als auch den Gegensatz zur Untreue der anderen Leviten zum Ausdruck.
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל מֵעָלַי
  choice: als die Söhne Israels von mir abirrten
  rationale: Die Infinitivkonstruktion bezeichnet den zeitlichen Begleitumstand. „Abirren“ bewahrt die moralisch-religiöse Bedeutung, während „Söhne Israels“ die konkrete Quellformulierung erhält.
- source_word: הֵמָּה יִקְרְבוּ אֵלַי
  choice: sie sollen sich mir nahen
  rationale: Das betonte Pronomen wird durch die Wiederaufnahme nach dem Gedankenstrich hörbar. „Sich nahen“ bewahrt die kultische Bedeutung des zugelassenen Zugangs zu Gott.
- source_word: לְשָׁרְתֵנִי
  choice: um mir zu dienen
  rationale: שׁרת bezeichnet im Kontext den priesterlich-liturgischen Dienst. Das natürliche deutsche „dienen“ trägt diese Bedeutung im Zusammenhang klar.
- source_word: וְעָמְדוּ לְפָנַי
  choice: Sie sollen vor mir stehen
  rationale: Die formnahe Wendung bewahrt das Bild des priesterlichen Stehens in Gottes Gegenwart und Dienst.
- source_word: לְהַקְרִיב לִי חֵלֶב וָדָם
  choice: um mir Fett und Blut darzubringen
  rationale: Die Hifilform von קרב ist hier ein Opferterminus. „Darbringen“ ist im Deutschen kultisch eindeutig; „Fett und Blut“ bezeichnet die Opferbestandteile ohne zusätzliche Bestimmung.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נְאֻם ist die prophetische Botenformel und wird idiomatisch mit „spricht“ wiedergegeben. אֲדֹנָי wird als „der Herr“, der Gottesname יהוה als „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Verhältnis von Priestern und Leviten
  choice: levitische Priester
  alternative: die Priester, die Leviten
  rationale: Die hebräische Wortfolge erlaubt eine appositionelle Lesart. Im Kontext bezeichnet sie jedenfalls die priesterliche Gruppe innerhalb Levis; die flüssigere Haupttextfassung löst die syntaktische Form nicht dogmatisch auf, da die Alternative ausdrücklich vermerkt wird.
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der Herr / der Herr HERR
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom persönlichen Gottesnamen יהוה und vermeidet die missverständliche Verdoppelung „Herr HERR“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kultisch angemessenen Begriffen. Der Satzbau wurde zur besseren Verständlichkeit in zwei Hauptsätze gegliedert; Gedankenstrich und Pronomen bewahren die hebräische Hervorhebung von הֵמָּה.
