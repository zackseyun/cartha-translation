  edition: WLC
  text: הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם הֵ֖מָּה יֹֽאכְל֑וּ/ם וְ/כָל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לָ/הֶ֥ם יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/029.yaml
  text: They shall eat the grain offering[a], the sin offering, and the guilt offering[b], and every devoted thing in Israel shall be theirs.
translation:
  language: de
  text: Das Getreideopfer, das Sündopfer[a] und das Schuldopfer sollen sie essen; und alles Banngut[b] in Israel soll ihnen gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“.'
    reason: lexical_alternative
  - marker: b
    text: „Banngut“ bezeichnet etwas, das Gott unwiderruflich übereignet ist; in anderen Zusammenhängen kann das hebräische Wort auch etwas bezeichnen, das der Vernichtung geweiht ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: das Getreideopfer
  rationale: Im priesterlichen Opferkontext bezeichnet מִנְחָה das aus Getreide bestehende Opfer, nicht allgemein eine Gabe. „Getreideopfer“ ist für heutige Leser klar und grenzt diese Opferart von den folgenden ab.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: In der Aufzählung bezeichnet חַטָּאת das mit Sünde beziehungsweise Reinigung verbundene Opfer. „Sündopfer“ ist die etablierte, transparente deutsche Bezeichnung; die mögliche Nuance „Reinigungsopfer“ bleibt in einer Fußnote erhalten.
- source_word: הָאָשָׁם
  choice: das Schuldopfer
  rationale: אָשָׁם bezeichnet hier die Opferart, die mit Schuld und daraus erwachsender Haftung verbunden ist. „Schuldopfer“ ist die geläufige deutsche kultische Bezeichnung.
- source_word: הֵמָּה יֹאכְלוּם
  choice: sollen sie essen
  rationale: Das betonte Pronomen und das Objektsuffix weisen die genannten Opfer ausdrücklich den Priestern zum Essen zu. Die deutsche Nachstellung „sollen sie“ setzt einen natürlichen Fokus auf die bereits genannten Opfer; ein zusätzliches „sie“ als Objekt wäre nach der Aufzählung schwerfällig.
- source_word: חֵרֶם
  choice: alles Banngut
  rationale: חֵרֶם bezeichnet etwas unwiderruflich Gott Übereignetes beziehungsweise dem menschlichen Gebrauch Entzogenes. „Banngut“ bewahrt den technischen Charakter und lässt die je nach Kontext mögliche Spannung zwischen Weihe und Vernichtung bestehen.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Wendung bezeichnet den Bereich, in dem solches Banngut vorkommt; „in Israel“ ist die natürliche und genaue Wiedergabe.
- source_word: לָהֶם יִהְיֶה
  choice: soll ihnen gehören
  rationale: Die hebräische Besitzwendung drückt rechtliche Zugehörigkeit beziehungsweise Anspruch aus. „Soll ihnen gehören“ entspricht dem Zuteilungscharakter des Zusammenhangs.
theological_decisions:
- issue: Wiedergabe der Opferbegriffe in einer priesterlichen Zuteilungsbestimmung
  choice: Die einzelnen Opferarten werden mit „Getreideopfer“, „Sündopfer“ und „Schuldopfer“ unterschieden.
  alternative: Allgemeine oder stärker deutende Bezeichnungen wie „Gabe“, „Reinigungsopfer“ oder „Wiedergutmachungsopfer“.
  rationale: Der Vers zählt bestimmte priesterliche Anteile aus dem Opfersystem auf. Die Unterscheidung der Kategorien bewahrt die rechtlich-kultische Struktur, ohne spätere Lehrsysteme einzutragen.
- issue: Bedeutung von חֵרֶם in diesem Zusammenhang
  choice: Im Haupttext steht der technische Ausdruck „Banngut“.
  alternative: „alles Gott Geweihte“ oder „alles zur Vernichtung Bestimmte“.
  rationale: Hier geht es um den den Priestern zufallenden Besitz, doch das hebräische Wort kann in anderen Zusammenhängen auch die Vernichtung einschließen. „Banngut“ vermeidet eine vorschnelle Festlegung und die Fußnote erläutert die Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt entsprechend dem Hebräischen hervor, dass die Priester die genannten Opfer essen dürfen. Etablierte kultische Begriffe bleiben erhalten und werden dort erläutert, wo ihre Bedeutungsbreite für heutige Leser nicht unmittelbar erkennbar ist.
