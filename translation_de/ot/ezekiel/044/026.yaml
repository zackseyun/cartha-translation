  text: וְ/אַחֲרֵ֖י טָֽהֳרָת֑/וֹ שִׁבְעַ֥ת יָמִ֖ים יִסְפְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/026.yaml
  text: And after his cleansing[a], they shall count seven days for him.
translation:
  language: de
  text: Und nach seiner Reinigung[a] sollen sie für ihn sieben Tage zählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner rituellen Reinigung“. Das hebräische Wort bezeichnet im priesterlichen Zusammenhang die Reinigung zur Wiederherstellung kultischer Reinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: Und nach
  rationale: אַחֲרֵי bezeichnet die zeitliche Folge; das vorangestellte וְ wird zur Wahrung des Anschlusses an die vorherige Vorschrift mit „Und“ wiedergegeben.
- source_word: טָהֳרָתוֹ
  choice: seiner Reinigung
  rationale: טָהֳרָה bezeichnet hier im priesterlichen Zusammenhang die rituelle Reinigung beziehungsweise den dadurch erreichten Reinheitszustand. „Reinigung“ ist im Deutschen klar, würdig und nicht unnötig technisch.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Die Zahlwortverbindung wird unmittelbar und vollständig wiedergegeben.
- source_word: יִסְפְּרוּ
  choice: sollen sie … zählen
  rationale: Das Qal von ספר bedeutet „zählen“. Die deutsche Soll-Form entspricht dem vorschreibenden Charakter des Rechtsabschnitts und bewahrt das pluralische Subjekt.
- source_word: לוֹ
  choice: für ihn
  rationale: לֹו bezeichnet hier die Person, auf die sich das Zählen der vorgeschriebenen Frist bezieht; „für ihn“ erhält diese Zuordnung, ohne das ungenannte Subjekt näher zu bestimmen.
theological_decisions:
- issue: Art der Reinigung
  choice: Neutrale kultische Wiedergabe als „seiner Reinigung“
  alternative: „seiner Läuterung“ oder eine ausdrücklich moralisch-geistliche Deutung
  rationale: Der Zusammenhang betrifft die rituelle Reinheit eines Priesters. Die Übersetzung vermeidet es, daraus eine Aussage über innere moralische oder geistliche Reinigung zu machen.
- issue: Ungenanntes pluralisches Subjekt
  choice: „sollen sie“
  alternative: 'Unpersönlich-passiv: „sollen … gezählt werden“'
  rationale: 'Das Hebräische hat eine Verbform im Plural, nennt die Handelnden jedoch nicht. Die gewählte Form bewahrt beides: den Plural und die Unbestimmtheit der Bezugsgruppe.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-vorschreibendem „sollen“. Die Satzstellung bleibt quellennah, ohne im Deutschen unnötig schwerfällig zu wirken.
