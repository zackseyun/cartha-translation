source:
  edition: WLC
  text: וְ/אַלְמָנָה֙ וּ/גְרוּשָׁ֔ה לֹֽא יִקְח֥וּ לָ/הֶ֖ם לְ/נָשִׁ֑ים כִּ֣י אִם בְּתוּלֹ֗ת מִ/זֶּ֨רַע֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה אַלְמָנָ֔ה מִ/כֹּהֵ֖ן יִקָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/022.yaml
  text: They shall not take for themselves as wives a widow or a divorced woman[a], but only virgins from the offspring of the house of Israel; however, they may take a widow who is the widow of a priest.
translation:
  language: de
  text: Sie dürfen weder eine Witwe noch eine geschiedene Frau zur Frau nehmen, sondern nur Jungfrauen aus der Nachkommenschaft des Hauses Israel. Doch eine Witwe, deren verstorbener Mann Priester war,[a] dürfen sie zur Frau nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eine Witwe, die Witwe von einem Priester sein wird«.'
    reason: Die hebräische Wendung mit מִן (»von/aus«) ist ungewöhnlich. Der Haupttext gibt ihre im Kontext naheliegende Bedeutung idiomatisch wieder; die Fußnote bewahrt die formale, weniger explizite Oberflächenform.
lexical_decisions:
- source_word: אַלְמָנָה
  choice: Witwe
  rationale: Die übliche Bedeutung ist eine Frau, deren Ehemann gestorben ist. Die Wiedergabe bleibt in beiden Vershälften einheitlich.
- source_word: גְרוּשָׁה
  choice: geschiedene Frau
  rationale: Das passive Partizip bezeichnet eine Frau, die geschieden worden ist. Die Formulierung ist im modernen Standarddeutsch klar und bewahrt ihren rechtlichen Familienstand.
- source_word: יִקְחוּ ... לְנָשִׁים
  choice: zur Frau nehmen
  rationale: Die hebräische Rechtsformel verwendet »nehmen« zusammen mit »zu Frauen«. »Zur Frau nehmen« bewahrt diese Ausdrucksweise und klingt zugleich würdig und verständlich.
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Die restriktive Verbindung stellt der verbotenen Gruppe die allein zugelassene Kategorie gegenüber.
- source_word: בְּתוּלוֹת
  choice: Jungfrauen
  rationale: Das Wort bezeichnet hier spezifisch Jungfrauen und nicht bloß junge oder unverheiratete Frauen.
- source_word: מִזֶּרַע בֵּית יִשְׂרָאֵל
  choice: aus der Nachkommenschaft des Hauses Israel
  rationale: »Nachkommenschaft« gibt das Abstammungswort זֶרַע natürlich wieder; »Haus Israel« bleibt als nationale und bundestheologische Bezeichnung erhalten.
- source_word: וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  choice: Doch eine Witwe, deren verstorbener Mann Priester war
  rationale: 'Die Formulierung macht die im Hebräischen gemeinte Beziehung verständlich: Die Frau ist Witwe geworden, weil ihr Ehemann, ein Priester, gestorben ist. Eine Fußnote bewahrt die ungewöhnliche und etwas mehrdeutige Oberflächenform des Hebräischen.'
- source_word: מִן in מִכֹּהֵן
  choice: deren verstorbener Mann Priester war
  rationale: Die Präposition bedeutet wörtlich »von/aus«, bezeichnet hier aber die Beziehung zu dem Priester, durch dessen Tod sie Witwe wurde. Im Deutschen lässt sich dies am klarsten mit einem Relativsatz ausdrücken.
theological_decisions:
- issue: Geltungsbereich der Ehevorschrift in der Tempelvision
  choice: Der Vers wird als Vorschrift für die Priester innerhalb von Hesekiels Tempelordnung wiedergegeben, ohne weitergehende Lehrfolgerungen in den Wortlaut einzutragen.
  alternative: Die Vorschrift als zeitlose allgemeine Eheregel behandeln oder die Einschränkung zu einer bloßen Empfehlung abschwächen.
  rationale: Der Kontext richtet die Bestimmung an die Priester. Die Übersetzung bewahrt Verbot und Ausnahme, erweitert oder vermindert ihren Geltungsanspruch jedoch nicht.
- issue: Beziehung der Witwe zu dem Priester in מִכֹּהֵן
  choice: Im Haupttext wird sie als Witwe eines verstorbenen Priesters verstanden; die wörtlichere Form wird in der Fußnote dokumentiert.
  alternative: Die Wendung im Haupttext unaufgelöst als »eine Witwe, die von einem Priester her Witwe geworden ist« wiedergeben.
  rationale: Der Zusammenhang spricht für einen verstorbenen priesterlichen Ehemann. Da die hebräische Präposition ungewöhnlich formuliert ist, wird ihre sprachliche Spannung nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich geprägter Satzführung. »Zur Frau nehmen« wahrt den formellen hebräischen Ausdruck, ohne unnötig altertümlich zu wirken. Der Fußnotenmarker steht unmittelbar bei der erklärend wiedergegebenen Wendung.
