source:
  edition: WLC
  text: פַּאֲרֵ֤י פִשְׁתִּים֙ יִהְי֣וּ עַל רֹאשָׁ֔/ם וּ/מִכְנְסֵ֣י פִשְׁתִּ֔ים יִהְי֖וּ עַל מָתְנֵי/הֶ֑ם לֹ֥א יַחְגְּר֖וּ בַּ/יָּֽזַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/018.yaml
  text: Linen turbans shall be on their heads[a], and linen undergarments shall be on their loins; they shall not gird themselves with anything that causes sweat.
translation:
  language: de
  text: Sie sollen Turbane aus Leinen auf dem Kopf und leinene Beinkleider um die Hüften tragen. Sie sollen sich nicht so gürten, dass sie ins Schwitzen kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sie sollen sich nicht mit Schweiß gürten.« Das Hebräische ist elliptisch; wahrscheinlich dürfen sie ihre Kleidung nicht so anlegen oder befestigen, dass sie dabei schwitzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּאֲרֵי
  choice: Turbane
  rationale: Das Substantiv bezeichnet hier im Zusammenhang der priesterlichen Kleidung eine Kopfbedeckung. »Turbane« ist verständlich und gibt die Form genauer wieder als das allgemeinere »Kopfbedeckungen«.
- source_word: פִשְׁתִּים
  choice: Leinen
  rationale: Bei Kleidungsstücken bezeichnet das Wort den aus Flachs gefertigten Stoff. Die Wiederholung des Materials wird entsprechend dem Hebräischen beibehalten.
- source_word: מִכְנְסֵי
  choice: Beinkleider
  rationale: Gemeint ist ein den Unterkörper bedeckendes, unmittelbar am Körper getragenes Kleidungsstück. »Beinkleider« ist würdevoll und weniger formbestimmt als »Hosen« oder »Unterhosen«.
- source_word: מָתְנֵיהֶם
  choice: um die Hüften
  rationale: Das hebräische Wort bezeichnet den Hüft- beziehungsweise Lendenbereich. Im Zusammenhang mit dem Tragen eines Kleidungsstücks ist »um die Hüften« natürliches modernes Deutsch.
- source_word: יַחְגְּרוּ
  choice: sich gürten
  rationale: Das Verb bezeichnet das Umschließen oder Festbinden eines Kleidungsstücks am Körper. »Sich gürten« bewahrt den kleidungsbezogenen Sinn und den gehobenen kultischen Sprachton.
- source_word: בַּיָּזַע
  choice: dass sie ins Schwitzen kommen
  rationale: Wörtlich steht elliptisch »mit/im Schweiß«. Die gewählte Formulierung gibt den wahrscheinlichen praktischen Sinn wieder, ohne einen im Text nicht ausdrücklich genannten Stoff als Ursache festzulegen.
theological_decisions:
- issue: Kleiderordnung für Priester und Sinn der Schlussklausel
  choice: Die Schlussklausel wird als Verbot wiedergegeben, sich auf eine Weise zu gürten, die zum Schwitzen führt.
  alternative: 'Wörtlicher: »Sie sollen sich nicht mit Schweiß gürten«; enger ausgelegt: ein ausdrückliches Verbot wollener Gürtel oder Kleidungsstücke.'
  rationale: Das Hebräische ist knapp und elliptisch. Der Kontext betont Leinenkleidung, nennt in diesem Vers aber weder Wolle noch einen bestimmten verbotenen Gegenstand. Die Übersetzung vermittelt daher die wahrscheinliche praktische Bedeutung, während die Fußnote die ungewöhnliche wörtliche Form wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Leinenkleidungsstücke bleibt erkennbar; die schwer verständliche Schlusswendung wird im Haupttext behutsam verdeutlicht und in der Fußnote wörtlicher dokumentiert.
