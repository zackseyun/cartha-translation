base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/028.yaml
  text: 'And this shall be their inheritance: I am their inheritance[a]. And you shall give them no possession in Israel[b]; I am their possession.'
translation:
  language: de
  text: 'Und dies soll ihr Erbteil sein: Ich bin ihr Erbteil.[a] Ihr sollt ihnen in Israel keinen Besitz geben; ich bin ihr Besitz.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und es soll ihnen als Erbteil dienen: Ich bin ihr Erbteil.“ Der Satzanfang ist im Hebräischen elliptisch.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „Besitz“ wiedergegebene Wort kann auch „Grundbesitz“ oder „Eigentum“ bezeichnen; gemeint ist hier ein dauerhafter Besitzanteil im Land.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְנַחֲלָה
  choice: Und dies soll ihr Erbteil sein
  rationale: Die hebräische Eröffnung ist elliptisch; „dies“ gibt das aus dem Zusammenhang erschlossene Subjekt wieder und bewahrt den Charakter einer rechtlichen Festlegung.
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: Erbteil / ihr Erbteil
  rationale: „Erbteil“ bewahrt den rechtlich-bundestheologischen Sinn eines zugewiesenen Anteils und hält die Wiederholung im Satz sichtbar.
- source_word: אֲנִי נַחֲלָתָם
  choice: Ich bin ihr Erbteil
  rationale: Die knappe, nachdrückliche Nominalklausel wird unmittelbar wiedergegeben; Gott selbst ist der den Priestern zugewiesene Anteil.
- source_word: אֲחֻזָּה
  choice: Grundbesitz / Besitz
  rationale: Das Wort bezeichnet häufig einen dauerhaften Besitzanteil, besonders Land. „Grundbesitz“ verdeutlicht beim Verbot den Bezug auf Land, während „Besitz“ in der abschließenden Aussage die natürliche deutsche Parallelform bildet.
- source_word: לֹא תִתְּנוּ לָהֶם בְּיִשְׂרָאֵל
  choice: Ihr sollt ihnen keinen Grundbesitz in Israel geben
  rationale: Die zweite Person Plural und der rechtlich-anweisende Charakter werden erhalten, ohne die angeredete Gruppe näher festzulegen.
- source_word: אֲנִי אֲחֻזָּתָם
  choice: ich bin ihr Besitz
  rationale: Die Formulierung bewahrt die bewusste Unterscheidung gegenüber „Erbteil“ sowie die theologisch zugespitzte Aussage des Hebräischen.
theological_decisions:
- issue: Verhältnis von „Erbteil“ und „Besitz“ bei der Zuweisung an die Priester
  choice: נחלה wird mit „Erbteil“, אחזה mit „Grundbesitz/​Besitz“ wiedergegeben.
  alternative: Beide Begriffe einheitlich mit „Erbteil“ oder „Besitz“ wiedergeben.
  rationale: Der hebräische Text gebraucht zwei verwandte, aber unterschiedliche Begriffe des Besitz- und Landrechts. Die Unterscheidung lässt erkennen, dass die Priester keinen gewöhnlichen Landbesitz erhalten, weil Gott selbst ihr Erbteil und Besitz ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Sprache bleibt klar und knapp; die Wiederholung von „Erbteil“ und die Spannung der Aussage „ich bin ihr Besitz“ werden bewusst bewahrt.
