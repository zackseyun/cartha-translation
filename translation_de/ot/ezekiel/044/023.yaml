  - marker: b
    text: 'Oder: „es befähigen, zwischen Unreinem und Reinem zu unterscheiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרוּ
  choice: sollen … lehren
  rationale: Der Hifil von ירה bezeichnet hier die priesterliche Unterweisung. „Lehren“ gibt diese Aufgabe in natürlichem, verständlichem Deutsch wieder.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: zwischen dem Heiligen und dem Nichtheiligen
  rationale: Die Wendung bezeichnet unterschiedliche kultische Zugehörigkeit beziehungsweise unterschiedlichen kultischen Status. „Nichtheilig“ bewahrt den sachlichen Gegensatz zu „heilig“, ohne wie „profan“ unnötig eine Entweihung oder moralische Verwerflichkeit anzudeuten.
- source_word: טָמֵא
  choice: unrein
  rationale: „Unrein“ ist im priesterlich-kultischen Zusammenhang die etablierte und sachgerechte Wiedergabe.
- source_word: טָהוֹר
  choice: rein
  rationale: „Rein“ bildet zusammen mit „unrein“ das entsprechende kultische Begriffspaar.
- source_word: יוֹדִעֻם
  choice: es erkennen lassen
  rationale: Die Form ist ein kausativer Hifil von ידע; „erkennen lassen“ wahrt diesen Sinn. Das Pronomen „es“ bezieht sich auf das zuvor genannte Volk.
- source_word: וְאֶת עַמִּי
  choice: mein Volk
  rationale: Die hebräische Akkusativmarkierung wird im Deutschen nicht eigens wiedergegeben; „mein Volk“ ist das direkte Objekt von „lehren“.
theological_decisions:
- issue: Kultischer Gegensatz קֹדֶשׁ und חֹל
  choice: das Heilige und das Nichtheilige
  alternative: das Heilige und das Profane; das Heilige und das Gewöhnliche
  rationale: „Nichtheilig“ gibt den kultischen Statusunterschied präzise wieder und vermeidet die im heutigen Deutsch mögliche moralische oder abwertende Nebenbedeutung von „profan“. Die alternative traditionelle Wiedergabe wird in einer Fußnote dokumentiert.
- issue: Kausative Bedeutung von יוֹדִעֻם
  choice: es erkennen lassen
  alternative: es unterscheiden lehren; ihm den Unterschied deutlich machen
  rationale: Die gewählte Formulierung erhält die kausative Bedeutung des hebräischen Verbs und lässt offen, ob vor allem Vermittlung von Wissen oder Befähigung zur Unterscheidung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur der beiden kultischen Gegensatzpaare bleibt erkennbar; zugleich wird die zweite Verbform so wiedergegeben, dass ihre kausative Bedeutung hörbar bleibt.
