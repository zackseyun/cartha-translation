base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/023.yaml
  text: They shall teach my people the difference between the holy and the common[b][a], and make them know the difference between the unclean and the clean.
translation:
  language: de
  text: Sie sollen mein Volk lehren, zwischen Heiligem und Gewöhnlichem zu unterscheiden, und es erkennen lassen, was unrein und was rein ist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwischen Heiligem und Profanem“; auch: „zwischen Heiligem und Unheiligem“.'
