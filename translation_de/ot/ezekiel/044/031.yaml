base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/031.yaml
  text: The priests shall not eat any carcass or animal torn by beasts[a], whether from birds or from livestock.
translation:
  language: de
  text: Die Priester dürfen kein verendetes oder gerissenes Tier essen, weder von Vögeln noch vom Vieh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: weder … noch
  rationale: Im verneinten Rechtssatz gibt die deutsche Verbindung „weder … noch“ den umfassenden Sinn von כָּל bei den beiden folgenden Kategorien natürlich wieder.
- source_word: נְבֵלָה
  choice: Aas
  rationale: נְבֵלָה bezeichnet den Kadaver eines nicht ordnungsgemäß geschlachteten, insbesondere verendeten Tieres. „Aas“ ist im Speisegesetz knapp und verständlich; die Fußnote nennt die auslegende Alternative.
- source_word: טְרֵפָה
  choice: ein gerissenes Tier
  rationale: טְרֵפָה bezeichnet ein zerrissenes beziehungsweise von einem anderen Tier gerissenes Tier. Die Formulierung bewahrt den konkreten Sinn, ohne den im Vers nicht ausdrücklich genannten Verursacher in den Haupttext einzutragen.
- source_word: מִן הָעוֹף
  choice: von den Vögeln
  rationale: עוֹף bezeichnet hier die Kategorie der Vögel beziehungsweise fliegenden Tiere; „Vögel“ ist die klare moderne Wiedergabe.
- source_word: וּמִן הַבְּהֵמָה
  choice: oder vom Vieh
  rationale: בְּהֵמָה steht im Gegensatz zu den Vögeln für größere Land- und besonders Haustiere. „Vieh“ bewahrt diese kategorische Bedeutung besser als das allgemeinere „Tiere“.
- source_word: לֹא יֹאכְלוּ
  choice: dürfen … nicht essen
  rationale: Der mit לֹא verneinte Imperfekt drückt in diesem gesetzlichen Zusammenhang ein Verbot aus. „dürfen … nicht“ ist im modernen Deutschen eindeutig und natürlich.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Der bestimmte Ausdruck bezeichnet in diesem Abschnitt die Priesterschaft.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Verbotsform. „Sei es … oder …“ gibt die beiden Herkunftskategorien idiomatisch wieder; die konkrete Unterscheidung zwischen Aas und einem gerissenen Tier bleibt erhalten.
