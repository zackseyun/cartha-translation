  source_fidelity: Die Wiedergabe von אֲדֹנָי יְהוִה als „der Herr Yahweh“, von רַב לָכֶם als „Genug“ und von תּוֹעֲבוֹתֵיכֶם als „Gräuel“ ist quellentreu. Bei מֶרִי erzeugt „dem Aufsässigen“ jedoch unnötig das Bild eines einzelnen männlichen Menschen. Im Kontext bezeichnet der Ausdruck Israel kollektiv; „widerspenstigen Haus“ gibt dies im Deutschen klarer wieder, während die Fußnote die im Hebräischen vorhandene substantivische Mehrdeutigkeit wahrt.
  naturalness: „Und sage zu dem Aufsässigen“ ist im modernen Standarddeutsch ohne weiteren Bezug unnatürlich und missverständlich. „Und sage zum widerspenstigen Haus, zum Haus Israel“ ist eine verständliche, würdige prophetische Anrede. „Genug mit all euren Gräueln“ ist idiomatisch und bewahrt die Schärfe.
  terminology: „Haus Israel“, „der Herr Yahweh“ und „Gräuel“ sind angemessen und konsistent. „Widerspenstig“ passt in diesem prophetischen Kontext besser als „aufsässig“, ohne die Aussage abzuschwächen.
