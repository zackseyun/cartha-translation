  text: וְ/אָמַרְתָּ֤ אֶל מֶ֨רִי֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רַב לָ/כֶ֛ם מִֽ/כָּל תּוֹעֲבֽוֹתֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/006.yaml
  text: 'And say to the rebellious house[a], to the house of Israel, ‘Thus says the Lord GOD: Enough of all your abominations, O house of Israel.’'
translation:
  language: de
  text: 'Und sage zum widerspenstigen Haus[a], zum Haus Israel: So spricht der Herr Yahweh: Genug mit all euren Gräueln, Haus Israel!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „zu dem Widerspenstigen“; das Wort kann auch abstrakter als „zur Widerspenstigkeit“ oder kollektiv als „zum widerspenstigen Volk“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרִי
  choice: der Aufsässige
  rationale: Das Substantiv kann Auflehnung bezeichnen oder metonymisch den Aufsässigen beziehungsweise ein aufsässiges Kollektiv. Die substantivierte Singularform bewahrt die grammatische Spannung; die folgende Apposition identifiziert damit das Haus Israel.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle bundesgeschichtliche Bezeichnung bleibt nah am Hebräischen und ist im Deutschen verständlich.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: אֲדֹנָי wird als Titel „der Herr“ und der Gottesname יהוה als „Yahweh“ wiedergegeben; dadurch bleiben beide Bestandteile des zusammengesetzten Titels erkennbar.
- source_word: רַב לָכֶם
  choice: Genug
  rationale: Die knappe idiomatische Wendung drückt aus, dass Israel bereits zu weit gegangen ist. „Genug“ erhält ihre scharfe, abrupte Kraft.
- source_word: מִכָּל תּוֹעֲבוֹתֵיכֶם
  choice: mit all euren Gräueln
  rationale: Die Präposition wird im Deutschen passend zur Wendung „Genug mit …“ wiedergegeben; „Gräuel“ wahrt die starke kultisch-moralische Wertung von תּוֹעֵבָה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens im zusammengesetzten Titel אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Übersetzung unterscheidet den Herrschaftstitel אֲדֹנָי vom Eigennamen יהוה und vermeidet zugleich die missverständliche Doppelung „Herr HERR“.
- issue: Personale oder abstrakte Deutung von מֶרִי
  choice: der Aufsässige
  alternative: die Auflehnung; das aufsässige Volk
  rationale: Der Singular wird nicht stillschweigend zu einer abstrakten oder pluralischen Aussage aufgelöst. Die Apposition „zum Haus Israel“ macht den kollektiven Bezug deutlich, während eine Fußnote die echte lexikalische Mehrdeutigkeit ausweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Schärfe. Die Anrede bleibt knapp; der schwerfällige hebräische Singular bei מֶרִי wird bewusst erhalten und durch eine Fußnote erläutert.
