source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהוָ֗ה הַ/שַּׁ֣עַר הַ/זֶּה֩ סָג֨וּר יִהְיֶ֜ה לֹ֣א יִפָּתֵ֗חַ וְ/אִישׁ֙ לֹא יָ֣בֹא ב֔/וֹ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּ֣א ב֑/וֹ וְ/הָיָ֖ה סָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/002.yaml
  text: And Yahweh said to me[a], “This gate shall remain shut; it shall not be opened, and no one shall enter through it, because Yahweh, the God of Israel, has entered through it. Therefore it shall remain shut.”
translation:
  language: de
  text: 'Und Jahwe sagte zu mir: „Dieses Tor soll verschlossen bleiben. Es soll nicht geöffnet werden, und kein Mensch soll durch dieses Tor hineingehen, denn Jahwe, der Gott Israels, ist durch dieses Tor hineingegangen. Darum soll es verschlossen bleiben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen wissenschaftlichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: הַשַּׁעַר הַזֶּה
  choice: dieses Tor
  rationale: Der proximale Demonstrativartikel und die gewöhnliche Bedeutung von שַׁעַר im Zusammenhang der Tempelvision werden unmittelbar wiedergegeben.
- source_word: סָגוּר יִהְיֶה
  choice: soll verschlossen bleiben
  rationale: Die Verbindung aus prädikativem Adjektiv und היה bezeichnet einen fortdauernden Zustand; „verschlossen bleiben“ gibt diesen Aspekt idiomatisch wieder.
- source_word: לֹא יִפָּתֵחַ
  choice: Es soll nicht geöffnet werden
  rationale: Das Nifal von פתח wird entsprechend seiner passiven Bedeutung wiedergegeben.
- source_word: וְאִישׁ לֹא יָבֹא בוֹ
  choice: und kein Mensch soll durch dieses Tor hineingehen
  rationale: אִישׁ steht im maskulinen Singular, hat hier jedoch generische Bedeutung. „Kein Mensch“ bewahrt diesen umfassenden Sinn in natürlichem Deutsch; die Wiederaufnahme von „dieses Tor“ vermeidet das schwerfällige „durch es“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für das dauerhafte Verschlossensein des Tores ein.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Jahwe, der Gott Israels
  rationale: Die Apposition wird durch Kommas kenntlich gemacht und bewahrt sowohl den Eigennamen als auch die nähere Bestimmung.
- source_word: בָּא בוֹ
  choice: ist durch dieses Tor hineingegangen
  rationale: Das Qatal bezeichnet die bereits vollzogene Bewegung durch das Tor; das deutsche Perfekt gibt die abgeschlossene Handlung mit gegenwärtiger Folge natürlich wieder.
- source_word: וְהָיָה סָגוּר
  choice: Darum soll es verschlossen bleiben
  rationale: Das ו schließt hier folgernd an die unmittelbar vorausgehende Begründung an; „Darum“ macht diesen Zusammenhang im Deutschen deutlich, während „verschlossen bleiben“ die wiederholte Dauerhaftigkeit wahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt die Unterscheidung zwischen dem Tetragramm und einem bloßen Herrschaftstitel, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Generischer Gebrauch von אִישׁ
  choice: kein Mensch
  alternative: kein Mann
  rationale: Im Kontext gilt die Aussage allgemein. „Kein Mensch“ gibt die generische Kraft des maskulinen Singulars klar wieder, ohne den Geltungsbereich irrtümlich auf erwachsene Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „dieses Tor“ entspricht der betonten Wiederaufnahme im hebräischen Satz und sorgt zugleich für räumliche Klarheit. Die Soll-Formulierungen bewahren den Charakter einer verbindlichen göttlichen Festlegung.
