  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהֹוָ֗ה בֶּן אָדָ֡ם שִׂ֣ים לִבְּ/ךָ֩ וּ/רְאֵ֨ה בְ/עֵינֶ֜י/ךָ וּ/בְ/אָזְנֶ֣י/ךָ שְּׁמָ֗ע אֵ֣ת כָּל אֲשֶׁ֤ר אֲנִי֙ מְדַבֵּ֣ר אֹתָ֔/ךְ לְ/כָל חֻקּ֥וֹת בֵּית יְהוָ֖ה וּ/לְ/כָל תורת/ו וְ/שַׂמְתָּ֤ לִבְּ/ךָ֙ לִ/מְב֣וֹא הַ/בַּ֔יִת בְּ/כֹ֖ל מוֹצָאֵ֥י הַ/מִּקְדָּֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/005.yaml
  text: And Yahweh said to me[a], “Son of man, set your heart, and see with your eyes, and hear with your ears all that I am speaking to you concerning all the statutes of the house of Yahweh and all its laws[b]. Set your heart on the entrance of the temple and on all the exits of the sanctuary.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: „Menschensohn, achte gut darauf[a], sieh mit deinen Augen und höre mit deinen Ohren alles, was ich zu dir rede über alle Ordnungen des Hauses Jahwes und über alle seine Weisungen[b]. Richte dein Herz auf den Eingang des Hauses und auf alle Ausgänge des Heiligtums.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlich: „richte dein Herz darauf“. Die hebräische Wendung meint konzentrierte Aufmerksamkeit und innere Anteilnahme.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle seine Gesetze“. Der hebräische Ausdruck kann verbindliche Unterweisungen und Vorschriften bezeichnen, nicht nur Gesetze im engeren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und entspricht der vorgelegten englischen POB-Lesart sowie der hebräischen Form.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische Anrede und ihre literarische Kontinuität, ohne eine spätere christologische Bedeutung in den Vers einzutragen.
- source_word: שִׂים לִבְּךָ / וְשַׂמְתָּ לִבְּךָ
  choice: richte dein Herz darauf
  rationale: Bewahrt die hebräische Herzmetapher und zugleich den Sinn konzentrierter Aufmerksamkeit; die Wiederholung wird konsequent wiedergegeben.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: sieh mit deinen Augen
  rationale: Erhält die konkrete, emphatische Parallelität zur Aufforderung, mit den Ohren zu hören.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: höre mit deinen Ohren
  rationale: Bewahrt die körperlich-sinnliche Ausdrucksweise und den rhetorischen Parallelismus des Hebräischen.
- source_word: לְכָל חֻקּוֹת בֵּית יְהוָה
  choice: über alle Ordnungen des Hauses Jahwes
  rationale: Das ל wird als Themenangabe verstanden; חֻקּוֹת bezeichnet hier festgesetzte kultische Ordnungen, während „Haus Jahwes“ die hebräische Bezeichnung bewahrt.
- source_word: תורתו
  choice: seine Weisungen
  rationale: „Weisungen“ lässt die Bandbreite von Tora zwischen Unterweisung und verbindlicher Regelung offen und vermeidet eine Verengung auf moderne Gesetzgebung.
- source_word: לִמְבוֹא הַבַּיִת
  choice: auf den Eingang des Hauses
  rationale: Bewahrt die Wiederaufnahme von בַּיִת aus „Haus Jahwes“ und bezeichnet den Zugang, auf den der Prophet besonders achten soll.
- source_word: בְּכֹל מוֹצָאֵי הַמִּקְדָּשׁ
  choice: auf alle Ausgänge des Heiligtums
  rationale: מוֹצָאִים sind die Stellen des Hinausgehens; מִקְדָּשׁ wird im kultischen Zusammenhang treffend mit „Heiligtum“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ macht dies transparent. „Der HERR“ wäre die traditionelle ehrfürchtige Ersatzlesung.
- issue: Wiedergabe von בֶּן אָדָם bei Ezechiel
  choice: Menschensohn
  alternative: Menschenkind
  rationale: „Menschensohn“ bewahrt die wiederkehrende formelhafte Anrede. Im Kontext bezeichnet sie den menschlichen Propheten und erzwingt keine spätere christologische Deutung.
- issue: Bedeutungsumfang von תורה im kultischen Kontext
  choice: Weisungen
  alternative: Gesetze
  rationale: „Weisungen“ bewahrt den weiteren Bedeutungsumfang zwischen Lehre, Vorschrift und Regelung; „Gesetze“ wäre möglich, klänge aber enger.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener hebräischer Bildsprache und sinnlichem Parallelismus. Die Wiederholung von „richte dein Herz“ sowie die Unterscheidung zwischen „Haus“ und „Heiligtum“ bleiben sichtbar.
