source:
  edition: WLC
  text: בַּ/הֲבִיאֲ/כֶ֣ם בְּנֵֽי נֵכָ֗ר עַרְלֵי לֵב֙ וְ/עַרְלֵ֣י בָשָׂ֔ר לִ/הְי֥וֹת בְּ/מִקְדָּשִׁ֖/י לְ/חַלְּל֣/וֹ אֶת בֵּיתִ֑/י בְּ/הַקְרִֽיבְ/כֶ֤ם אֶת לַחְמִ/י֙ חֵ֣לֶב וָ/דָ֔ם וַ/יָּפֵ֨רוּ֙ אֶת בְּרִיתִ֔/י אֶ֖ל כָּל תּוֹעֲבוֹתֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/007.yaml
  text: when you brought in foreigners[a], uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it—my house—when you presented my food, the fat and the blood, and they broke my covenant[c][b], along with all your abominations.
translation:
  language: de
  text: als ihr Fremde[a] hereingebracht habt, unbeschnitten am Herzen und unbeschnitten am Fleisch, damit sie in meinem Heiligtum seien und es entweihen – mein Haus –, als ihr meine Speise[b], das Fett und das Blut, dargebracht habt, und sie meinen Bund gebrochen haben[c], zusätzlich zu all euren Gräueltaten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne der Fremde“; gemeint sind Menschen fremder Herkunft.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mein Brot“; im Opferzusammenhang ist damit Gottes Opferspeise gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische wechselt zu „sie haben meinen Bund gebrochen“ und bezieht sich wahrscheinlich auf die eben genannten Fremden. Manche verstehen die Aussage allgemeiner als Fortsetzung der Anklage gegen „euch“.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּהֲבִיאֲכֶם
  choice: als ihr … hereingebracht habt
  rationale: Die Präposition ב am Infinitivus constructus mit Suffix der 2. Person Plural ist temporal; „hereingebracht“ wahrt den kausativen Hifil-Sinn von בוא.
- source_word: בְּנֵי נֵכָר
  choice: Fremde
  rationale: Die Wendung bedeutet wörtlich „Söhne der Fremde“ und bezeichnet idiomatisch Menschen fremder Herkunft; „Fremde“ ist natürlich und knapp.
- source_word: עַרְלֵי לֵב
  choice: unbeschnitten am Herzen
  rationale: Die prophetische Metapher und ihre bundesbezogene Aussage über den inneren Zustand bleiben erhalten.
- source_word: וְעַרְלֵי בָשָׂר
  choice: unbeschnitten am Fleisch
  rationale: Die Formulierung wahrt den rhetorischen Parallelismus und bezeichnet die körperliche Unbeschnittenheit.
- source_word: לִהְיוֹת בְּמִקְדָּשִׁי
  choice: damit sie in meinem Heiligtum seien
  rationale: Das hebräische „sein“ wird nicht zu „eintreten“ umgedeutet; im Blick steht ihre Anwesenheit im Heiligtum.
- source_word: לְחַלְּלוֹ אֶת בֵּיתִי
  choice: es entweihen – mein Haus –
  rationale: „Entweihen“ gibt den Piel von חלל im sakralen Zusammenhang wieder. Das Pronomen greift wahrscheinlich „mein Heiligtum“ auf; „mein Haus“ wird als nachgestellte Erläuterung bewahrt.
- source_word: בְּהַקְרִיבְכֶם
  choice: als ihr … dargebracht habt
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Darbringen; die erneute temporale Konstruktion bleibt sichtbar.
- source_word: לַחְמִי
  choice: meine Speise
  rationale: Wörtlich „mein Brot“, im Opferkontext jedoch Gottes Opferspeise; „Speise“ bewahrt das Bild und vermittelt den weiteren Sinn.
- source_word: חֵלֶב וָדָם
  choice: das Fett und das Blut
  rationale: Bezeichnet die kultischen Opferbestandteile.
- source_word: וַיָּפֵרוּ אֶת בְּרִיתִי
  choice: So haben sie meinen Bund gebrochen
  rationale: Der Wechsel zur 3. Person Plural wird bewahrt; הפר ברית ist die übliche Verbindung für das Brechen eines Bundes.
- source_word: אֶל כָּל תּוֹעֲבוֹתֵיכֶם
  choice: zu all euren Gräueltaten hinzu
  rationale: 'אֶל bezeichnet hier wahrscheinlich eine Hinzufügung: Der Bundesbruch kommt zu den bereits angeklagten Gräueltaten hinzu.'
theological_decisions:
- issue: Bezug des Objektsuffixes bei „entweihen“ und Funktion von „mein Haus“
  choice: „es“ bezieht sich auf „mein Heiligtum“; „mein Haus“ folgt als erläuternde Apposition.
  alternative: '„mein Haus“ unmittelbar als Objekt wiedergeben: „um mein Haus zu entweihen“.'
  rationale: Der nächste grammatische Bezug des maskulinen Suffixes ist מִקְדָּשִׁי; אֶת־בֵּיתִי kann denselben heiligen Raum nachdrücklich neu benennen. Die sperrige Struktur wahrt die Spannung des Hebräischen.
- issue: Subjekt von „sie haben meinen Bund gebrochen“
  choice: Die zuvor genannten Fremden sind das nächstliegende Subjekt.
  alternative: Der Sinn setzt die Anklage gegen „euch“ allgemein fort, trotz des Wechsels zur 3. Person Plural.
  rationale: וַיָּפֵרוּ steht ausdrücklich in der 3. Person Plural und verweist grammatisch am natürlichsten auf die Fremden. Eine Fußnote dokumentiert die verbleibende Auslegungsmöglichkeit.
- issue: Verhältnis des Bundesbruchs zu den Gräueltaten
  choice: Der Bundesbruch kommt zu allen Gräueltaten der Angeredeten hinzu.
  alternative: „zusammen mit all euren Gräueltaten“ als lockerere Zuordnung.
  rationale: Die gerichtete Präposition אֶל kann in diesem Zusammenhang additive Kraft haben. Die gewählte Formulierung macht die Anklage verständlich, ohne den Bundesbruch mit den Gräueltaten gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Pronomen-Appositions-Struktur wird bewusst erhalten, um die hebräische Syntax und ihre Bezugsspannung nicht einzuebnen. „Gräueltaten“ gibt תּוֹעֵבוֹת in prophetischer Gerichtssprache kräftig, aber allgemein verständlich wieder.
