  source_fidelity: 'Die Hervorhebung durch das zweimalige הֵמָּה ist mit „Sie selbst“ treffend wiedergegeben. „in mein Heiligtum hineingehen“, „an meinen Tisch herantreten“ und „um mir zu dienen“ entsprechen dem hebräischen Satzbau und kultischen Kontext gut. Der Schluss der vorliegenden Fassung entfaltet jedoch מִשְׁמַרְתִּי („meine Verpflichtung / meinen Dienstauftrag“) stärker als der Text: „den ihnen von mir aufgetragenen Dienst“ fügt die Zuweisung an „sie“ ausdrücklich ein und ersetzt das Possessiv „meinen“ durch eine Umschreibung.'
  naturalness: Die Sprache ist modernes, würdevolles Standarddeutsch. „Meinen Dienst versehen“ ist hier eine knappe, natürliche und im kultischen Kontext passende Wiedergabe; es bewahrt die auf Gott bezogene possessive Formulierung besser als die längere Umschreibung.
  terminology: „Heiligtum“, „herantreten“ und „dienen“ treffen den Tempel- und Priesterdienstregister. „Tisch“ ist die wörtliche Wiedergabe von שֻׁלְחָנִי; die Fußnote hält die im Kontext mögliche Deutung als Altar bzw. Altartisch angemessen offen.
