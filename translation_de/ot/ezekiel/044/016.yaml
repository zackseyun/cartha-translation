  text: הֵ֜מָּה יָבֹ֣אוּ אֶל מִקְדָּשִׁ֗/י וְ/הֵ֛מָּה יִקְרְב֥וּ אֶל שֻׁלְחָנִ֖/י לְ/שָׁרְתֵ֑/נִי וְ/שָׁמְר֖וּ אֶת מִשְׁמַרְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/016.yaml
  text: They themselves shall enter my sanctuary[a], and they themselves shall come near to my table to minister to me, and they shall keep my charge.
translation:
  language: de
  text: Sie selbst werden in mein Heiligtum hineingehen, und sie selbst werden an meinen Tisch[a] herantreten, um mir zu dienen; sie werden meinen Dienst versehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Altar“ beziehungsweise „meinen Altartisch“; „Tisch“ steht hier im Zusammenhang des Tempeldienstes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: sie selbst
  rationale: Das selbstständige Pronomen steht zweimal ausdrücklich und hebt die bezeichneten Priester sowie ihr besonderes Zugangsrecht hervor.
- source_word: יָבֹאוּ
  choice: werden … hineingehen
  rationale: In Verbindung mit אֶל und dem Heiligtum bezeichnet das Verb hier das Betreten; „hineingehen“ gibt diese räumliche Bewegung natürlich wieder.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: „Heiligtum“ ist im Tempelzusammenhang die direkte und im modernen Deutschen geläufige Wiedergabe.
- source_word: יִקְרְבוּ
  choice: werden … herantreten
  rationale: „Herantreten“ bewahrt sowohl die konkrete Annäherung als auch den kultischen Beiklang priesterlichen Nahens.
- source_word: שֻׁלְחָנִי
  choice: mein Tisch
  rationale: Das hebräische Wort bedeutet wörtlich „Tisch“. Eine genauere Gleichsetzung mit dem Altar wäre auslegend und wird deshalb nur als Alternative in der Fußnote genannt.
- source_word: לְשָׁרְתֵנִי
  choice: um mir zu dienen
  rationale: Das Verb bezeichnet hier den heiligen beziehungsweise priesterlichen Dienst; die Formulierung bewahrt zugleich dessen persönliche Ausrichtung auf Gott.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמַרְתִּי
  choice: sie werden den ihnen von mir aufgetragenen Dienst versehen
  rationale: Die hebräische Wortverbindung bezeichnet die gewissenhafte Wahrnehmung einer zugewiesenen kultischen Pflicht. Die deutsche Wendung gibt den Dienstauftrag idiomatisch wieder, ohne ihn zu einer bloßen Einzelvorschrift zu verengen.
theological_decisions:
- issue: Bedeutung von שֻׁלְחָנִי im Zusammenhang des Tempeldienstes
  choice: mein Tisch
  alternative: mein Altar; mein Altartisch
  rationale: Obwohl der Tisch im kultischen Zusammenhang als Altar oder Opfertisch verstanden werden kann, nennt der hebräische Text ihn ausdrücklich „Tisch“. Die Hauptübersetzung wahrt diese Benennung und lässt die genauere kultische Identifikation offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Hervorhebung durch „sie selbst“ bleibt erhalten. Der abschließende kultische Pflichtausdruck wird verständlich und zugleich sachlich wiedergegeben.
