  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם הַ/לְוִיִּ֗ם אֲשֶׁ֤ר רָֽחֲקוּ֙ מֵֽ/עָלַ֔/י בִּ/תְע֤וֹת יִשְׂרָאֵל֙ אֲשֶׁ֣ר תָּע֣וּ מֵֽ/עָלַ֔/י אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/010.yaml
  text: But the Levites who went far from me when Israel went astray[a], who went astray from me after their idols, shall bear their iniquity.
translation:
  language: de
  text: Doch die Leviten, die sich von mir entfernten, als Israel in die Irre ging, und die von mir abirrten und ihren Götzen folgten, müssen ihre Schuld tragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „müssen die Folgen ihrer Schuld tragen“. Die hebräische Wendung umfasst sowohl die Schuld als auch die daraus folgende Ahndung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Doch
  rationale: Die Wendung führt im Zusammenhang einen kontrastierenden Sonderfall ein; „Doch“ gibt diesen Übergang natürlich und würdig wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Der hebräische Text nennt ausdrücklich die Leviten und unterscheidet sie im Kontext von den zadokidischen Priestern.
- source_word: רָחֲקוּ מֵעָלַי
  choice: die sich von mir entfernten
  rationale: Die Formulierung bewahrt das Bild räumlicher Entfernung und lässt zugleich die Beziehungslosigkeit beziehungsweise Bundesuntreue anklingen.
- source_word: בִּתְעוֹת יִשְׂרָאֵל
  choice: als Israel in die Irre ging
  rationale: ב mit dem Infinitiv bezeichnet hier den zeitlichen beziehungsweise begleitenden Umstand; die deutsche Formulierung ist natürlich und präzise.
- source_word: תָּעוּ מֵעָלַי
  choice: die von mir abirrten
  rationale: „Abirren“ erhält den wiederholten Wortstamm תעה und macht die Abwendung von Gott deutlich, ohne sie unnötig auszudeuten.
- source_word: אַחֲרֵי גִּלּוּלֵיהֶם
  choice: und ihren Götzen folgten
  rationale: אַחֲרֵי bezeichnet hier das Folgen; „Götzen“ ist die übliche deutsche Wiedergabe des bei Ezechiel verächtlich gefärbten גִּלּוּלִים.
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: müssen ihre Schuld tragen
  rationale: Die formelhafte Verbindung umfasst sowohl die eigene Schuld als auch deren zu tragende Folgen. Die deutsche Wendung bewahrt diese produktive Mehrdeutigkeit.
theological_decisions:
- issue: Bundesgerichtliche Wendung וְנָשְׂאוּ עֲוֺנָם
  choice: müssen ihre Schuld tragen
  alternative: müssen die Strafe für ihre Schuld tragen
  rationale: Das Hebräische kann sowohl das Tragen der Schuld als auch das Erleiden ihrer Folgen bezeichnen. Die Hauptfassung bewahrt diese Spannung, statt sie einseitig auf Bestrafung oder bloße Verantwortlichkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des hebräischen Verbs תעה wird durch „in die Irre ging“ und „abirrten“ erkennbar gehalten; „Götzen“ entspricht dem üblichen biblischen Sprachgebrauch, ohne die pejorative Etymologie übermäßig auszuschreiben.
