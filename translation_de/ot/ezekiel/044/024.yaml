source:
  edition: WLC
  text: וְ/עַל רִ֗יב הֵ֚מָּה יַעַמְד֣וּ ל/שפט בְּ/מִשְׁפָּטַ֖/י ו/שפט/הו וְ/אֶת תּוֹרֹתַ֤/י וְ/אֶת חֻקֹּתַ/י֙ בְּ/כָל מוֹעֲדַ֣/י יִשְׁמֹ֔רוּ וְ/אֶת שַׁבְּתוֹתַ֖/י יְקַדֵּֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
translation:
  language: de
  text: Bei einem Rechtsstreit[a] sollen sie antreten, um Recht zu sprechen; nach meinen Rechtsbestimmungen sollen sie darüber urteilen. Meine Weisungen und meine Satzungen sollen sie zu allen meinen festgesetzten Zeiten[b] halten, und meine Sabbate sollen sie heilig halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Streitfall“, „Streitsache“ oder „Rechtssache“.'
    reason: lexical_alternative
  - marker: b
    text: „Meine festgesetzten Zeiten“ kann auch mit „meine Festzeiten“ oder „meine Feste“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: Rechtsstreit
  rationale: Das Wort bezeichnet einen Streitfall mit rechtlichem Charakter. „Rechtsstreit“ passt zum folgenden richterlichen Handeln, ohne den Ausdruck auf eine bestimmte Form der Klage zu verengen.
- source_word: יַעַמְדוּ
  choice: sollen sie antreten
  rationale: עמד bedeutet wörtlich „stehen“. „Antreten“ bewahrt das Bild, dass die Priester ihren Platz zur Rechtsprechung einnehmen, und klingt im modernen Deutschen natürlicher als „stehen“.
- source_word: לשפט
  choice: um Recht zu sprechen
  rationale: Der Infinitiv bezeichnet den Zweck. „Recht sprechen“ gibt die richterliche Tätigkeit idiomatisch wieder.
- source_word: בְּמִשְׁפָּטַי
  choice: nach meinen Rechtsbestimmungen
  rationale: מִשְׁפָּט kann Urteil, Rechtssatz oder Rechtsbestimmung bedeuten. Hier bezeichnet der Plural Gottes maßgebende rechtliche Normen; „Rechtsbestimmungen“ vermeidet die missverständliche Vorstellung früherer Einzelurteile.
- source_word: ושפטהו
  choice: sollen sie darüber urteilen
  rationale: Das Suffix nimmt den Rechtsstreit auf. „Darüber urteilen“ ist im Deutschen natürlicher als „ihn richten“ und erhält die Wiederaufnahme des richterlichen Handelns.
- source_word: תורותי
  choice: meine Weisungen
  rationale: תּוֹרָה umfasst verbindliche Unterweisung und Gesetz. „Weisungen“ wahrt diese Breite und unterscheidet den Ausdruck von den anschließend genannten Satzungen.
- source_word: חקותי
  choice: meine Satzungen
  rationale: חֻקּוֹת bezeichnet festgesetzte Vorschriften. „Satzungen“ gibt den rechtlich-normativen Charakter wieder und bleibt von „Weisungen“ unterscheidbar.
- source_word: בכל מועדי
  choice: zu allen meinen festgesetzten Zeiten
  rationale: מוֹעֵד kann einen festgesetzten Zeitpunkt oder ein Fest bezeichnen. Die allgemeinere Wiedergabe erhält die lexikalische Mehrdeutigkeit; die kultische Bedeutung wird in der Fußnote genannt.
- source_word: ישמרו
  choice: sollen sie halten
  rationale: שמר bedeutet im Zusammenhang verbindlicher Gebote „halten“ oder „beachten“. „Halten“ ist knapp und im Deutschen für Weisungen und Satzungen idiomatisch.
- source_word: שבתותי
  choice: meine Sabbate
  rationale: Der hebräische Text hat ausdrücklich den Plural; „Sabbate“ bewahrt ihn sowie die Zugehörigkeitsangabe „meine“.
- source_word: יקדשו
  choice: sollen sie heilig halten
  rationale: Die Piel-Form von קדש bedeutet heiligen beziehungsweise als heilig behandeln. „Heilig halten“ ist bei Sabbaten idiomatisch und drückt aktives Beachten ihres heiligen Charakters aus.
theological_decisions:
- issue: Wiedergabe der gehäuften bundesrechtlichen Begriffe
  choice: Die Begriffe werden als „Rechtsbestimmungen“, „Weisungen“ und „Satzungen“ unterschieden.
  alternative: Alle Begriffe vereinheitlichend als „Vorschriften“ oder „Gesetze“ wiedergeben.
  rationale: Der hebräische Text verwendet bewusst mehrere verwandte, aber nicht identische Rechtsbegriffe. Ihre Unterscheidung bewahrt die sprachliche Struktur, ohne ihnen konfessionell bestimmte Spezialbedeutungen zuzuschreiben.
- issue: Bedeutungsumfang von מוֹעֵד
  choice: Im Haupttext steht das weitere „festgesetzte Zeiten“.
  alternative: Konkretisierend „Feste“ oder „Festzeiten“.
  rationale: מוֹעֵד kann sowohl festgesetzte Zeiten allgemein als auch kultische Feste bezeichnen. Der weitere Haupttext mit Fußnote erhält diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die feierliche Rechtsrede, bleibt aber verständlich. Rechtliche Schlüsselbegriffe werden differenziert; unnötiger Fachjargon und konfessionelle Festlegungen werden vermieden.
