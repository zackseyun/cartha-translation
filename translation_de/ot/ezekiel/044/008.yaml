  text: וְ/לֹ֥א שְׁמַרְתֶּ֖ם מִשְׁמֶ֣רֶת קָדָשָׁ֑/י וַ/תְּשִׂימ֗וּ/ן לְ/שֹׁמְרֵ֧י מִשְׁמַרְתִּ֛/י בְּ/מִקְדָּשִׁ֖/י לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/008.yaml
  text: You have not kept charge of my holy things[a], but have appointed others to keep charge in my sanctuary for you.
translation:
  language: de
  text: Ihr habt die Verantwortung für meine heiligen Dinge nicht wahrgenommen, sondern andere dazu eingesetzt, in meinem Heiligtum für euch Dienst zu tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an eurer Stelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַרְתֶּם מִשְׁמֶרֶת
  choice: den Dienst … versehen
  rationale: Die feste Verbindung bezeichnet hier die treue Wahrnehmung einer anvertrauten Aufgabe im Heiligtum, nicht nur körperliches Bewachen. „Den Dienst versehen“ gibt den kultischen Pflichtcharakter natürlich und würdig wieder.
- source_word: קָדָשָׁי
  choice: meinen heiligen Dingen
  rationale: Der substantivierte Plural bezeichnet breit das, was Gott heilig ist, und kann heilige Gegenstände, Handlungen und Belange umfassen. Die Übersetzung vermeidet eine Einengung auf Gegenstände oder Amtspflichten allein.
- source_word: וַתְּשִׂימוּן
  choice: habt sie dazu eingesetzt
  rationale: שׂים bedeutet grundsätzlich „setzen/stellen“, bezeichnet hier aber funktional die Übertragung einer Aufgabe. Das Pronomen „sie“ nimmt die in Vers 7 genannten Fremden als im Hebräischen unausgesprochenes Objekt auf.
- source_word: לְשֹׁמְרֵי מִשְׁמַרְתִּי
  choice: den Dienst … zu versehen
  rationale: Der Partizipialausdruck bezeichnet Personen, die Gottes anvertraute Ordnung beziehungsweise Dienstpflicht wahrnehmen. Die verbale Wiedergabe ist im Deutschen natürlicher als „als Hüter meines Dienstes“ und bewahrt die Wiederholung des Dienstgedankens.
- source_word: בְּמִקְדָּשִׁי
  choice: in meinem Heiligtum
  rationale: מִקְדָּשׁ bezeichnet den geheiligten Tempelbereich. „Heiligtum“ ist präziser als das allgemeinere „Tempel“.
- source_word: לָכֶם
  choice: an eurer Stelle
  rationale: Im Zusammenhang hebt die Präposition hervor, dass die Eingesetzten den Heiligtumsdienst anstelle der Angesprochenen wahrnahmen. Die wörtlichere Möglichkeit „für euch“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Umfang von „meinen heiligen Dingen“
  choice: Breite Bezeichnung für die heiligen Dinge und Belange des Heiligtums
  alternative: Nur heilige Gegenstände oder ausschließlich das heilige Amt
  rationale: Der hebräische Plural ist umfassend und sollte nicht auf materielle Gegenstände oder eine abstrakte Amtsaufgabe verengt werden.
- issue: Bedeutung von לָכֶם
  choice: an eurer Stelle
  alternative: für euch
  rationale: Der Kontext des Vorwurfs spricht dafür, dass andere den versäumten Dienst anstelle der Verantwortlichen verrichteten; die Präposition selbst erlaubt jedoch auch die allgemeinere Wiedergabe „für euch“, die deshalb als Alternative dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „den Dienst … versehen“ spiegelt die wiederholte hebräische Wurzelverbindung, ohne im Deutschen unnatürlich zu klingen.
