    rationale: לָכֶם bedeutet unmittelbar „für euch“; ein stellvertretender Sinn ist im Kontext möglich, aber nicht zwingend. Deshalb ist „für euch“ im Text und „an eurer Stelle“ in der Fußnote vorzuziehen.
