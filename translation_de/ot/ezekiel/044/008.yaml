  rationale: Die Revision beseitigt den irreführenden Bezug von „sie“, hält die im Kontext vorausgesetzten Personen mit dem neutralen „andere“ fest und gibt לָכֶם im Haupttext näher am Wortlaut wieder. „Verantwortung für meine heiligen Dinge“ bewahrt die breite Bedeutung der beiden Vorkommen von מִשְׁמֶרֶת, ohne sie auf bloße Bewachung oder Gegenstände zu reduzieren.
