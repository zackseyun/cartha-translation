  naturalness: „Den Dienst an meinen heiligen Dingen versehen“ ist verständlich, aber „die Verantwortung für meine heiligen Dinge wahrnehmen“ ist im heutigen würdevollen Standarddeutsch idiomatischer. Die Wiederaufnahme mit „Dienst tun“ vermeidet die unklare und stilistisch schwere Konstruktion „sie dazu eingesetzt, ... den Dienst ... zu versehen“.
  terminology: „Heilige Dinge“, „Heiligtum“ und die breite kultische Bedeutung von מִשְׁמֶרֶת werden angemessen bewahrt. „Andere“ folgt dem von Vers 7 her verstandenen, im Englischen dokumentierten impliziten Personalobjekt, ohne dessen Identität weiter festzulegen.
