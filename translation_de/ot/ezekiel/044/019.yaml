source:
  edition: WLC
  text: וּ֠/בְ/צֵאתָ/ם אֶל הֶ/חָצֵ֨ר הַ/חִיצוֹנָ֜ה אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָה֮ אֶל הָ/עָם֒ יִפְשְׁט֣וּ אֶת בִּגְדֵי/הֶ֗ם אֲשֶׁר הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔/ם וְ/הִנִּ֥יחוּ אוֹתָ֖/ם בְּ/לִֽשְׁכֹ֣ת הַ/קֹּ֑דֶשׁ וְ/לָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְ/לֹֽא יְקַדְּשׁ֥וּ אֶת הָ/עָ֖ם בְּ/בִגְדֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/019.yaml
  text: When they go out to the outer court[a], to the outer court where the people are, they shall take off their garments in which they minister and leave them in the holy chambers. Then they shall put on other garments[b], so that they may not make the people holy with their garments.
translation:
  language: de
  text: Wenn sie in den äußeren Vorhof hinausgehen, in den äußeren Vorhof zum Volk[a], sollen sie ihre Gewänder ablegen, in denen sie den Dienst verrichten, und sie in den heiligen Kammern lassen. Dann sollen sie andere Gewänder anziehen, damit sie nicht durch ihre Gewänder das Volk heiligen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den äußeren Vorhof, zum Volk“. Die Wiederholung von „in den äußeren Vorhof“ hebt den Übergang aus dem priesterlichen Bereich in den dem Volk zugänglichen Bereich hervor.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „das Volk heilig machen“. Gemeint ist hier kultische Heiligkeit, die durch die heiligen Dienstgewänder vermittelt würde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצֵאתָם
  choice: Wenn sie … hinausgehen
  rationale: Die Infinitivkonstruktion mit Präposition und Suffix bildet einen Temporalsatz; „hinausgehen“ verdeutlicht die Bewegung aus dem inneren priesterlichen Bereich.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: der äußere Vorhof
  rationale: חָצֵר bezeichnet hier den Hof des Tempelbezirks; „Vorhof“ ist im Deutschen die natürliche kultisch-architektonische Bezeichnung.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה אֶל הָעָם
  choice: in den äußeren Vorhof, in den äußeren Vorhof zum Volk
  rationale: Die Wiederholung des Zielausdrucks wird bewahrt. אֶל הָעָם wird knapp als Bewegung in den dem Volk zugänglichen Bereich wiedergegeben, ohne ein im Hebräischen nicht ausdrücklich vorhandenes Relativverb einzufügen.
- source_word: יִפְשְׁטוּ אֶת בִּגְדֵיהֶם
  choice: sollen sie ihre Gewänder ablegen
  rationale: פשט bedeutet bei Kleidung „ausziehen/ablegen“; „ablegen“ ist würdig und natürlich. Das Possessivsuffix wird ausdrücklich mit „ihre“ wiedergegeben.
- source_word: אֲשֶׁר הֵמָּה מְשָׁרְתִם בָּם
  choice: in denen sie den Dienst verrichten
  rationale: שרת bezeichnet den kultischen Dienst. Die Formulierung wahrt diesen besonderen Bezug und klingt zugleich in modernem Deutsch natürlich.
- source_word: וְהִנִּיחוּ אוֹתָם בְּלִשְׁכֹת הַקֹּדֶשׁ
  choice: und sie in den heiligen Kammern lassen
  rationale: נוח im Hifil kann „niederlegen, ablegen, lassen“ bedeuten; im Zusammenhang mit den dafür bestimmten Tempelräumen ist „lassen“ idiomatisch. לְשָׁכוֹת sind Kammern oder Nebenräume.
- source_word: וְלָבְשׁוּ בְּגָדִים אֲחֵרִים
  choice: Dann sollen sie andere Gewänder anziehen
  rationale: לבש bezeichnet das Anziehen von Kleidung. „Dann“ macht die im Satz dargestellte Abfolge klar, ohne ihren Sinn zu erweitern.
- source_word: וְלֹא יְקַדְּשׁוּ אֶת הָעָם
  choice: damit sie nicht … das Volk heiligen
  rationale: קדש im Piel bedeutet „heiligen, heilig machen“. „Heiligen“ bewahrt die kultische Mehrdeutigkeit besser als eine erklärende Umschreibung; die finale Wiedergabe folgt dem präventiven Zusammenhang.
- source_word: בְּבִגְדֵיהֶם
  choice: durch ihre Gewänder
  rationale: Die Präposition בְּ ist hier instrumental zu verstehen. „Durch“ drückt die vermittelnde Funktion der Gewänder im Deutschen klar aus.
theological_decisions:
- issue: Kultische Heiligung beziehungsweise Übertragung von Heiligkeit im Schlusssatz
  choice: „damit sie nicht durch ihre Gewänder das Volk heiligen“
  alternative: „und sie sollen das Volk mit ihren Gewändern nicht heiligen“ / „damit ihre Gewänder nicht Heiligkeit auf das Volk übertragen“
  rationale: Der Text verbindet das Piel von קדש unmittelbar mit „das Volk“ und instrumental mit den Gewändern. Die Übersetzung bewahrt diese auffällige kultische Aussage, ohne den Mechanismus auszudeuten oder moralische Heiligung anzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung bleibt erhalten, weil sie die räumliche Grenzüberschreitung betont. Kultische Fachsprache wird sparsam und verständlich verwendet; „heiligen“ erhält die Spannung des hebräischen Ausdrucks.
