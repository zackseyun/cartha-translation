review_pass:
  verdict: revise
  source_fidelity: Die Zuweisung der Leviten zu einer verantwortlichen Hüter- bzw. Aufsichtsfunktion am Haus wird grundsätzlich getroffen. „… was darin getan werden muss“ fügt jedoch eine deontische Notwendigkeit hinzu, die das hebräische Passivimperfekt nicht ausdrückt; gemeint ist umfassend, was darin getan wird/geschieht. Auch „alle Arbeiten darin“ verschiebt das Suffix von „sein Dienst“ zu einer bloßen Ortsangabe und schwächt die aufsichtliche Verantwortlichkeit von שֹׁמְרֵי מִשְׁמֶרֶת.
  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. Die revidierte Fassung formuliert die administrative Beauftragung und die umfassende Zuständigkeit klarer und ohne die unnötige Modalbedeutung von „muss“.
  terminology: „Haus“ wahrt die hebräische Ausdrucksweise für den Tempel; die Fußnote erläutert den Kontext angemessen. „Aufsicht“ gibt die mit שֹׁמְרֵי מִשְׁמֶרֶת bezeichnete Hüter- und Verantwortungsfunktion idiomatisch wieder, ohne sie auf bloße Bewachung oder ausschließlich kultischen Dienst einzuengen.
  issues:
  - severity: medium
    issue: „was darin getan werden muss“
    rationale: יֵעָשֶׂה bedeutet hier „getan wird“ bzw. „geschieht“ und enthält keine ausdrückliche Aussage des Müssens.
  - severity: medium
    issue: „für alle Arbeiten darin“
    rationale: לְכָל־עֲבֹדָתוֹ bezeichnet den gesamten Dienst des Hauses. Die Formulierung verlegt den Akzent auf einzelne Arbeiten im Inneren und lässt die possessive Bezugnahme sowie die umfassende Zuständigkeit weniger deutlich erkennen.
  - severity: low
    issue: „den Dienst am Haus zu versehen“
    rationale: Die Formulierung ist möglich, gibt aber die spezifische Funktion als שֹׁמְרֵי מִשְׁמֶרֶת, also als mit Aufsicht bzw. Wahrnehmung einer anvertrauten Aufgabe Betraute, nur indirekt wieder.
  revised_text: Doch ich werde sie mit der Aufsicht über das Haus[a] betrauen, zuständig für seinen gesamten Dienst und für alles, was darin getan wird.
