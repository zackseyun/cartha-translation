  text: וְ/נָתַתִּ֣י אוֹתָ֔/ם שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/בָּ֑יִת לְ/כֹל֙ עֲבֹ֣דָת֔/וֹ וּ/לְ/כֹ֛ל אֲשֶׁ֥ר יֵעָשֶׂ֖ה בּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/014.yaml
  text: Yet I will appoint them to keep charge of the house[a], for all its service and for all that is done in it.
translation:
  language: de
  text: Doch ich werde sie mit der Aufsicht über das Haus[a] betrauen, zuständig für seinen gesamten Dienst und für alles, was darin getan wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tempel“. Hebräisch: „das Haus“, eine geläufige Bezeichnung für den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Doch ich werde sie dazu einsetzen
  rationale: נתן bedeutet wörtlich „geben/setzen“, bezeichnet hier aber idiomatisch die Zuweisung einer Aufgabe. „Doch“ gibt den im Kontext erkennbaren Gegensatz zur vorausgehenden Verurteilung wieder.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַבָּיִת
  choice: den Dienst am Haus zu versehen
  rationale: Die Verbindung aus Partizip und stammverwandtem Substantiv bezeichnet eine übertragene Aufsichts- und Dienstpflicht. Die gewählte Formulierung ist im Deutschen natürlich und lässt den Umfang der Verantwortung offen.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: בַּיִת heißt wörtlich „Haus“ und bezeichnet hier im Zusammenhang der Vision den Tempel. Die wörtliche Wiedergabe bewahrt die kultische Ausdrucksweise; eine Fußnote klärt den Bezug.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: für alle Arbeiten darin
  rationale: עֲבֹדָה kann Arbeit, Dienst oder kultischen Dienst bezeichnen. „Alle Arbeiten“ wahrt die praktische Breite, während „darin“ den auf das Haus bezogenen Suffix im Deutschen eindeutig wiedergibt.
- source_word: וּלְכֹל אֲשֶׁר יֵעָשֶׂה בוֹ
  choice: und für alles, was darin getan werden muss
  rationale: Die passive Imperfektform umfasst alles, was im Haus ausgeführt wird beziehungsweise auszuführen ist. „Getan werden muss“ passt zur Zuweisung von Pflichten, ohne einzelne Tätigkeiten festzulegen.
theological_decisions:
- issue: Bezug von „das Haus“
  choice: Wörtlich „das Haus“, im Kontext der Tempel in Ezechiels Vision
  alternative: Direkt „der Tempel“
  rationale: Die wörtliche Wiedergabe erhält die Ausdrucksweise des Hebräischen und ihre kultische Resonanz; die Fußnote macht den gemeinten Referenten klar.
- issue: Umfang der levitischen Aufgabe
  choice: Allgemeiner Dienst und sämtliche erforderlichen Arbeiten am beziehungsweise im Tempel
  alternative: Ausschließlich liturgischer Dienst
  rationale: עֲבֹדָה und die umfassende Schlussformulierung legen keine Beschränkung auf rein liturgische Tätigkeiten nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Den Dienst … versehen“ vermittelt eine offiziell übertragene Aufgabe, ohne die hebräische Konstruktion unnatürlich nachzuahmen.
