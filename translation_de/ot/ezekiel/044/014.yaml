revisions:
- from: Doch ich werde sie dazu einsetzen, den Dienst am Haus[a] zu versehen, für alle Arbeiten darin und für alles, was darin getan werden muss.
  to: Doch ich werde sie mit der Aufsicht über das Haus[a] betrauen, zuständig für seinen gesamten Dienst und für alles, was darin getan wird.
  rationale: Die Revision bewahrt „Haus“ als Übersetzung von הַבַּיִת und stellt die verantwortliche Hüterfunktion von שֹׁמְרֵי מִשְׁמֶרֶת mit „mit der Aufsicht … betrauen“ klar dar. „Seinen gesamten Dienst“ gibt עֲבֹדָתוֹ als umfassenden Dienstbereich wieder. „Was darin getan wird“ folgt dem neutralen Passiv des Hebräischen, ohne ein zusätzliches „muss“ einzutragen.
