source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כָּל בֶּן נֵכָ֗ר עֶ֤רֶל לֵב֙ וְ/עֶ֣רֶל בָּשָׂ֔ר לֹ֥א יָב֖וֹא אֶל מִקְדָּשִׁ֑/י לְ/כָל בֶּן נֵכָ֔ר אֲשֶׁ֕ר בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/009.yaml
  text: 'Thus says the Lord GOD: No foreigner[a], uncircumcised in heart and uncircumcised in flesh, shall enter my sanctuary[b], of any foreigner who is among the sons of Israel.'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Kein Fremder[a], unbeschnitten am Herzen und unbeschnitten am Fleisch, darf mein Heiligtum betreten – kein Fremder, der sich unter den Söhnen Israels befindet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sohn der Fremde“; die hebräische Wendung bezeichnet einen Fremden.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne Israels“ ist die traditionelle hebräische Bezeichnung für das Volk Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdevollem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet eine Verschmelzung beider Elemente.
- source_word: כָּל בֶּן נֵכָר
  choice: Kein Fremder
  rationale: בֶּן נֵכָר ist eine hebräische Bezeichnung für einen Fremden, nicht wörtlich für ein männliches Kind; כָּל erhält zusammen mit der Verneinung die Bedeutung „kein“.
- source_word: עֶרֶל לֵב
  choice: unbeschnitten am Herzen
  rationale: Die konkrete Metapher für einen inneren Zustand bleibt erhalten.
- source_word: וְעֶרֶל בָּשָׂר
  choice: und unbeschnitten am Fleisch
  rationale: Bewahrt die Parallelität zur Unbeschnittenheit am Herzen und den körperlichen Bezug von בָּשָׂר.
- source_word: לֹא יָבוֹא אֶל מִקְדָּשִׁי
  choice: darf in mein Heiligtum kommen
  rationale: Drückt das rechtlich verbindliche Verbot in idiomatischem Deutsch aus; „Heiligtum“ entspricht dem sakralen Sinn von מִקְדָּשׁ.
- source_word: לְכָל בֶּן נֵכָר
  choice: das gilt für jeden Fremden
  rationale: Gibt die wiederaufnehmende und verstärkende Funktion der hebräischen Formulierung verständlich wieder, ohne die schwer natürliche Ausgangskonstruktion nachzuahmen.
- source_word: אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: der mitten unter den Söhnen Israels lebt
  rationale: „Mitten unter“ bildet בְּתוֹךְ ab; „lebt“ macht im Deutschen die Zugehörigkeit zum ansässigen Umfeld deutlich, ohne eine ethnische Zugehörigkeit zu Israel zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr; der Herr HERR
  rationale: Die Übersetzung lässt Titel und persönlichen Gottesnamen unterscheidbar und gibt den im hebräischen Text stehenden Namen ausdrücklich wieder.
- issue: Reichweite des Ausschlusses von Fremden
  choice: Die Merkmale „unbeschnitten am Herzen und am Fleisch“ bleiben unmittelbar bei „Fremder“ stehen.
  alternative: Ein ausnahmsloser Ausschluss aller Fremden unabhängig von den genannten Merkmalen
  rationale: Die appositionelle Syntax beschreibt die hier angesprochenen Fremden durch beide Merkmale. Die Übersetzung bewahrt diese Zuordnung, ohne eine weitergehende dogmatische Aussage einzutragen.
- issue: Bezug der abschließenden Wiederaufnahme
  choice: Sie bekräftigt, dass auch ein unter Israel lebender Fremder unter das Verbot fällt.
  alternative: Sie eröffnet eine neue, eigenständige Personengruppe.
  rationale: Das wiederholte בֶּן נֵכָר und das vorangestellte לְכָל wirken resumptiv beziehungsweise verstärkend; die deutsche Formulierung macht diese Funktion transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt knapp und feierlich; die doppelte Beschneidungsmetapher wird bewusst nicht geglättet. Der Gedankenstrich kennzeichnet die verstärkende Wiederaufnahme des Verbots.
