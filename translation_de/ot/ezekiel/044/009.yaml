  terminology: „der Herr Yahweh“ gibt אֲדֹנָי יְהוִה mit Titel und Gottesnamen angemessen wieder. „Fremder“, „Heiligtum“ und „Söhne Israels“ sind sachgerecht. Die Anmerkung zu בֶּן־נֵכָר kann die wörtliche Form etwas genauer wiedergeben.
