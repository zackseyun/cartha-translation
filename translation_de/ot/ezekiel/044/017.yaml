source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/בוֹאָ/ם֙ אֶֽל שַׁעֲרֵי֙ הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים יִלְבָּ֑שׁוּ וְ/לֹֽא יַעֲלֶ֤ה עֲלֵי/הֶם֙ צֶ֔מֶר בְּ/שָֽׁרְתָ֗/ם בְּ/שַׁעֲרֵ֛י הֶ/חָצֵ֥ר הַ/פְּנִימִ֖ית וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/017.yaml
  text: And when they enter the gates of the inner court[a], they shall wear linen garments[b]; no wool shall come upon them while they minister in the gates of the inner court and in the house.
translation:
  language: de
  text: Wenn sie durch die Tore des inneren Vorhofs eintreten, sollen sie Leinengewänder tragen. Sie dürfen nichts aus Wolle tragen[a], wenn sie an den Toren des inneren Vorhofs und im Tempelhaus[b] Dienst tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Keine Wolle darf auf sie kommen.“'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Tempelhaus“ ist hier der eigentliche Tempelbau gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּבוֹאָם
  choice: Wenn sie … eintreten
  rationale: Die Einleitungsformel וְהָיָה und die temporale Infinitivkonstruktion werden in natürlichem Deutsch als temporaler Nebensatz wiedergegeben.
- source_word: שַׁעֲרֵי הֶחָצֵר הַפְּנִימִית
  choice: die Tore des inneren Vorhofs
  rationale: Die Constructusverbindung bezeichnet die Zugänge zum inneren Vorhof; „Tore“ ist präzise und geläufig.
- source_word: בִּגְדֵי פִשְׁתִּים
  choice: Leinengewänder
  rationale: פִשְׁתִּים bezeichnet Flachs beziehungsweise daraus gefertigtes Leinen; das Kompositum ist im Deutschen natürlich und würdig.
- source_word: יִלְבָּשׁוּ
  choice: sollen sie … tragen
  rationale: Das Verb bezeichnet hier die vorgeschriebene Kleidung während des priesterlichen Dienstes.
- source_word: וְלֹא יַעֲלֶה עֲלֵיהֶם צֶמֶר
  choice: Sie dürfen nichts aus Wolle tragen
  rationale: Die idiomatische Wiedergabe macht das Kleidungsverbot verständlich, ohne eine bestimmte Art von Wollkleidung festzulegen; die konkretere hebräische Bildsprache bleibt in der Fußnote sichtbar.
- source_word: בְּשָׁרְתָם
  choice: wenn sie … Dienst tun
  rationale: Die Form bezeichnet den Zeitpunkt ihres kultischen Dienstes. „Dienst tun“ bewahrt diesen sakralen Zusammenhang, ohne altertümlich zu wirken.
- source_word: וָבָיְתָה
  choice: im Tempelhaus
  rationale: Das direktional beziehungsweise lokal gebrauchte ה weist hier auf den Dienst im beziehungsweise zum Haus hin. „Tempelhaus“ verdeutlicht den gemeinten Bau, ohne ihn mit der gesamten Tempelanlage gleichzusetzen.
theological_decisions:
- issue: Kultische Bezeichnung des priesterlichen Dienstes
  choice: Dienst tun
  alternative: dienen
  rationale: „Dienst tun“ lässt den kultisch-priesterlichen Zusammenhang erkennen, ohne zusätzliche konfessionelle Vorstellungen einzutragen.
- issue: Bedeutung von „das Haus“
  choice: Tempelhaus
  alternative: Haus
  rationale: Im Zusammenhang von Ezechiels Tempelvision bezeichnet הַבַּיִת den eigentlichen Tempelbau. Die Wiedergabe verhindert, dass moderne Leser an ein gewöhnliches Wohnhaus denken.
- issue: Form des Wollverbots
  choice: Sie dürfen nichts aus Wolle tragen
  alternative: Keine Wolle darf auf sie kommen
  rationale: Die Hauptübersetzung gibt die praktische Vorschrift idiomatisch wieder; die Fußnote bewahrt die auffällige wörtliche Formulierung und deren mögliche Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem kultischem Wortschatz. Die Satzstruktur bleibt nahe am Hebräischen, vermeidet aber unnatürliche Nominal- und Infinitivkonstruktionen.
