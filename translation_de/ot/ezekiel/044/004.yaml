source:
  edition: WLC
  text: וַ/יְבִיאֵ֜/נִי דֶּֽרֶךְ שַׁ֣עַר הַ/צָּפוֹן֮ אֶל פְּנֵ֣י הַ/בַּיִת֒ וָ/אֵ֕רֶא וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֣ית יְהוָ֑ה וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/004.yaml
  text: Then he brought me by way of the north gate to the front of the house[a], and I looked, and behold, the glory of Yahweh filled the house of Yahweh[b]; and I fell on my face.
translation:
  language: de
  text: 'Dann brachte er mich durch das Nordtor[a] vor das Haus. Ich sah, und siehe: Die Herrlichkeit Jahwes erfüllte das Haus Jahwes[b]. Da fiel ich mit dem Gesicht zur Erde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Weg des Nordtors“; gemeint ist die Route über das Nordtor.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel; „Haus“ entspricht der wiederholten Wortwahl des hebräischen Textes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Dann brachte er mich
  rationale: Der Hifil von בוא mit Suffix der 1. Person Singular bedeutet „er brachte mich“. „Dann“ gibt die fortschreitende Erzählung natürlich wieder.
- source_word: דֶּרֶךְ שַׁעַר הַצָּפוֹן
  choice: durch das Nordtor
  rationale: דֶּרֶךְ bezeichnet hier die eingeschlagene Route. Im Deutschen gibt „durch das Nordtor“ den räumlichen Vorgang knapp und natürlich wieder; die stärker formale Wiedergabe wird in der Fußnote genannt.
- source_word: אֶל פְּנֵי הַבַּיִת
  choice: vor das Haus
  rationale: פְּנֵי bedeutet wörtlich „Angesicht/Vorderseite“, bezeichnet hier aber idiomatisch den Bereich vor der Vorderseite des Hauses. „Vor das Haus“ ist im Deutschen klar und bewahrt zugleich בַּיִת als „Haus“.
- source_word: וָאֵרֶא וְהִנֵּה
  choice: Ich sah, und siehe
  rationale: ראה wird mit „sehen“ wiedergegeben; הִנֵּה lenkt mit feierlichem Nachdruck auf das nun Wahrgenommene. Die Formulierung erhält sowohl die Abfolge als auch den visionären Ton.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Die prädikative Form bezeichnet, dass die Herrlichkeit das Haus ganz einnahm. „Erfüllte“ ist dafür eine natürliche und in diesem Zusammenhang treffende deutsche Wiedergabe.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet in diesem Tempel- und Visionszusammenhang die offenbarte Herrlichkeit Gottes; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Haus-Terminologie Ezechiels bleibt erhalten, obwohl sachlich der Tempel gemeint ist.
- source_word: וָאֶפֹּל אֶל פָּנַי
  choice: Da fiel ich auf mein Gesicht
  rationale: Die hebräische Wendung beschreibt das ehrfürchtige Niederfallen mit dem Gesicht zum Boden. Die anschauliche Ausgangsformulierung bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בַּיִת / בֵּית יְהוָה in der Tempelvision
  choice: Haus / Haus Jahwes
  alternative: Tempel / Tempel Jahwes
  rationale: Obwohl der Tempel gemeint ist, verwendet der Ausgangstext ausdrücklich das Wort „Haus“. Diese Bild- und Wortwahl wird beibehalten, ohne den Bezug in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener visionärer Formel „und siehe“. Die Satzfolge ist klar gegliedert; die konkrete Haus-Terminologie und das körperlich anschauliche Niederfallen werden nicht geglättet.
