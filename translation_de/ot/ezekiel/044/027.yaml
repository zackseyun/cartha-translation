  text: וּ/בְ/יוֹם֩ בֹּא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ אֶל הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ יַקְרִ֖יב חַטָּאת֑/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/027.yaml
  text: And on the day he enters the sanctuary[a], into the inner court, to minister in the sanctuary, he shall present his sin offering, declares the Lord GOD.
translation:
  language: de
  text: Und an dem Tag, an dem er das Heiligtum betritt, nämlich den inneren Vorhof, um im Heiligtum Dienst zu tun, soll er sein Sündopfer[a] darbringen, spricht der Herr Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann im Opferzusammenhang das Opfer für Sünde beziehungsweise Reinigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם בֹּאוֹ
  choice: Und an dem Tag, an dem er … betritt
  rationale: Die Infinitivkonstruktion bezeichnet den Zeitpunkt des Eintretens. Der deutsche Relativsatz gibt dies natürlich und präzise wieder; „Und“ wahrt den Anschluss an die vorhergehenden Vorschriften.
- source_word: אֶל־הַקֹּדֶשׁ אֶל־הֶחָצֵר הַפְּנִימִית
  choice: das Heiligtum, den inneren Vorhof
  rationale: Das zweite Zielglied erläutert das erste näher. Die appositionelle Fügung bewahrt diese Beziehung, ohne den inneren Vorhof als ein davon unabhängiges zweites Ziel erscheinen zu lassen.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: um im Heiligtum Dienst zu tun
  rationale: שׁרת bezeichnet hier den priesterlichen Dienst. „Dienst tun“ ist verständlich, würdig und bringt den kultischen Zusammenhang zum Ausdruck, ohne übermäßig kirchensprachlich zu wirken.
- source_word: יַקְרִיב חַטָּאתוֹ
  choice: soll er sein Sündopfer darbringen
  rationale: יקרב bezeichnet im Opferzusammenhang das Darbringen. חטאת meint hier aufgrund des Verbs und des kultischen Kontexts nicht lediglich „Sünde“, sondern das entsprechende Opfer; die mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in der Fußnote genannt.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: spricht der Herr Yahweh
  rationale: נאם leitet eine feierliche göttliche Aussage ein und wird idiomatisch mit „spricht“ wiedergegeben. „der Herr Yahweh“ unterscheidet אֲדֹנָי vom unmittelbar folgenden Gottesnamen und vermeidet eine Verdoppelung von „Herr“.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Die traditionelle Bezeichnung „Sündopfer“ bewahrt den ausdrücklichen sprachlichen Bezug zur Sünde. Zugleich kann das Opfer der Reinigung dienen; diese echte Bedeutungsnuance wird nicht aufgelöst, sondern in der Fußnote offengehalten.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die gewählte Form gibt sowohl den Titel אֲדֹנָי als auch den Eigennamen יהוה erkennbar wieder. Die konventionelle Ersatzschreibung „GOTT, der Herr“ ist möglich, lässt die unterschiedliche Reihenfolge und Funktion der beiden hebräischen Ausdrücke jedoch weniger unmittelbar erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, wird aber durch einen natürlichen Relativsatz geglättet. Die Wiederholung von „Heiligtum“ bleibt als bewusste Entsprechung zur Vorlage erhalten.
