source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָ/ם֙ לִ/פְנֵ֣י גִלּֽוּלֵי/הֶ֔ם וְ/הָי֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/מִכְשׁ֣וֹל עָוֺ֑ן עַל כֵּן֩ נָשָׂ֨אתִי יָדִ֜/י עֲלֵי/הֶ֗ם נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/012.yaml
  text: Because they ministered to them before their idols and became a stumbling block of iniquity for the house of Israel[a], therefore I have raised my hand against them, declares the Lord GOD[b], and they will bear their iniquity.
translation:
  language: de
  text: Weil sie ihnen vor ihren Götzen dienten und dem Haus Israel zu einem Stolperstein der Schuld wurden, darum habe ich meine Hand gegen sie erhoben[a] – Ausspruch des Herrn Yahweh –, und sie werden ihre Schuld tragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Hand gegen sie erhoben“. Die Geste kann einen feierlichen Eid bezeichnen; hier steht sie im Zusammenhang einer verbindlichen Gerichtsankündigung.'
    reason: lexical_alternative
  - marker: b
    text: „Ihre Schuld tragen“ kann sowohl ihre Schuldverantwortung als auch die daraus folgenden Konsequenzen bezeichnen.
    reason: semantic_range
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Gibt die ausdrückliche kausale Begründung des folgenden Gerichts natürlich und präzise wieder.
- source_word: יְשָׁרְתוּ אוֹתָם
  choice: sie ihnen dienten
  rationale: שׁרת bezeichnet hier kultischen Dienst. Das Pronomen bleibt wie im Hebräischen erhalten und wird nicht vorschnell ausschließlich auf die Götzen oder deren Verehrer festgelegt.
- source_word: לִפְנֵי גִלּוּלֵיהֶם
  choice: vor ihren Götzen
  rationale: Bewahrt die räumliche Bedeutung von לִפְנֵי. 'Götzen' ist die verständliche deutsche Wiedergabe des bei Ezechiel abwertend gebrauchten גִלּוּלִים.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: dem Haus Israel
  rationale: Erhält die kollektive Bundesbezeichnung und entspricht der deutschen Konstruktion 'jemandem zu etwas werden'.
- source_word: לְמִכְשׁוֹל עָוֺן
  choice: zu einem Anstoß zur Schuld
  rationale: Bewahrt das Bild eines Hindernisses, das zu Fall bringt, und lässt עָוֹן seine Spannweite zwischen Schuld, Vergehen und dessen Folgen.
- source_word: נָשָׂאתִי יָדִי עֲלֵיהֶם
  choice: habe ich meine Hand gegen sie erhoben
  rationale: Erhält die körperliche hebräische Wendung und ihre gegen sie gerichtete, feierlich-rechtliche Kraft; die mögliche Eidesnuance wird in der Fußnote erläutert.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Yahweh
  rationale: נְאֻם wird als prophetische Formel wiedergegeben; אֲדֹנָי bezeichnet den Herrn, während יהוה als Gottes Eigenname 'Yahweh' erscheint.
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: und sie werden ihre Schuld tragen
  rationale: Bewahrt die hebräische Wendung, die sowohl Verantwortlichkeit als auch die daraus folgenden Konsequenzen umfasst.
theological_decisions:
- issue: Bezug des Pronomens אוֹתָם
  choice: ihnen
  alternative: den Götzen beziehungsweise deren Verehrern
  rationale: Der hebräische Bezug ist im unmittelbaren Satz verdichtet. Die Übersetzung erhält das Pronomen und vermeidet eine dogmatisch oder exegetisch unnötige Festlegung.
- issue: Bedeutung von מִכְשׁוֹל עָוֺן
  choice: Anstoß zur Schuld
  alternative: Anlass zur Sünde / schuldbringender Stolperstein
  rationale: Die gewählte Formulierung bewahrt sowohl das Stolperbild als auch den Zusammenhang von Vergehen und Schuld, ohne die Kausalbeziehung stärker auszudeuten als der Ausgangstext.
- issue: Bedeutung des Handerhebens
  choice: meine Hand gegen sie erhoben
  alternative: gegen sie geschworen
  rationale: Die Wendung kann eine feierliche Eidesgeste bezeichnen; der Gerichtskontext verleiht ihr zugleich eine gegen die Betroffenen gerichtete Kraft. Der Haupttext wahrt das Bild, die Fußnote nennt die Nuance.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: GOTT, der Herr
  rationale: Die Wiedergabe unterscheidet den Herrschaftstitel אֲדֹנָי vom Eigennamen יהוה und macht beide Bestandteile der hebräischen Formel sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener prophetischer Gerichtssprache. Die Satzstruktur folgt dem hebräischen Ursache-Folge-Aufbau, ohne im Deutschen unnatürlich zu wirken. Alle Fußnotenmarker stehen im Haupttext.
