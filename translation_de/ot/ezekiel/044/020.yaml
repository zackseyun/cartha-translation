  text: וְ/רֹאשָׁ/ם֙ לֹ֣א יְגַלֵּ֔חוּ וּ/פֶ֖רַע לֹ֣א יְשַׁלֵּ֑חוּ כָּס֥וֹם יִכְסְמ֖וּ אֶת רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/020.yaml
  text: They shall not shave their heads[a], nor let their hair grow long; they shall surely trim the hair of their heads.
translation:
  language: de
  text: Sie sollen weder ihren Kopf kahl scheren noch ihr Haar lang wachsen lassen, sondern das Haar auf ihrem Kopf stutzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe hebräische Formulierung im letzten Satzteil kann auch wiedergegeben werden: „sie sollen das Haar auf ihrem Kopf kurz schneiden“ oder „regelmäßig stutzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלֵּחוּ
  choice: kahl scheren
  rationale: Das Piel von גלח bezeichnet hier das Scheren beziehungsweise Rasieren des Kopfes. „Kahl scheren“ verdeutlicht im Deutschen den Gegensatz sowohl zum langen Haar als auch zum vorgeschriebenen Kürzen.
- source_word: פֶרַע ... יְשַׁלֵּחוּ
  choice: ihr Haar lang wachsen lassen
  rationale: Die Verbindung bezeichnet Haar, das frei beziehungsweise ungekürzt wachsen gelassen wird. Die gewählte Formulierung ist im modernen Deutschen natürlich und passt zur priesterlichen Vorschrift über die Haarpflege.
- source_word: כָּסוֹם יִכְסְמוּ
  choice: sorgfältig kürzen
  rationale: Die seltene Wurzel bezeichnet hier das Schneiden oder Stutzen des Haars; die Verbindung aus Infinitivus absolutus und finitem Verb hebt die Handlung hervor. „Sorgfältig kürzen“ gibt sowohl den Vorgang als auch dessen Nachdruck idiomatisch wieder.
- source_word: רֹאשָׁם / רָאשֵׁיהֶם
  choice: ihren Kopf / das Haar auf ihrem Kopf
  rationale: Im ersten Satzteil ist „den Kopf kahl scheren“ eine natürliche deutsche Wendung. Im letzten Satzteil wird „Haar“ ausdrücklich ergänzt, damit nicht missverständlich vom Kürzen des Kopfes selbst die Rede ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Konstruktion „weder … noch …, sondern“ stellt die vorgeschriebene Mitte zwischen Kahlscheren und ungehindertem Haarwuchs klar heraus, ohne eine bestimmte Haarlänge festzulegen.
