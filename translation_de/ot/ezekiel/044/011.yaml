  text: וְ/הָי֤וּ בְ/מִקְדָּשִׁ/י֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל שַׁעֲרֵ֣י הַ/בַּ֔יִת וּֽ/מְשָׁרְתִ֖ים אֶת הַ/בָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת הָ/עֹלָ֤ה וְ/אֶת הַ/זֶּ֨בַח֙ לָ/עָ֔ם וְ/הֵ֛מָּה יַעַמְד֥וּ לִ/פְנֵי/הֶ֖ם לְ/שָֽׁרְתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/011.yaml
  text: Yet they shall be ministers in my sanctuary[a], having oversight at the gates of the temple and ministering in the temple. They shall slaughter the burnt offering and the sacrifice for the people[c][b], and they shall stand before them to minister to them.
translation:
  language: de
  text: 'Doch sie sollen in meinem Heiligtum Dienst tun: Sie sollen an den Toren des Tempels Aufsicht führen und im Tempel Dienst tun. Sie sollen das Brandopfer und das Schlachtopfer für das Volk[a] schlachten, und sie sollen vor ihnen stehen, um ihnen zu dienen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugunsten des Volkes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: Dienst tun
  rationale: Das Partizip von שׁרת bezeichnet hier den kultischen Dienst. „Dienst tun“ ist im Deutschen natürlich und wahrt den Bezug zum Heiligtum.
- source_word: פְּקֻדּוֹת
  choice: für die Aufgaben … zuständig sein
  rationale: Das Wort bezeichnet übertragene Aufgaben, Zuständigkeit oder Aufsicht. Die Formulierung lässt offen, ob vor allem Bewachung, Aufsicht oder weitere Pflichten an den Toren gemeint sind.
- source_word: שַׁעֲרֵי הַבַּיִת
  choice: die Tore des Tempels
  rationale: בַּיִת bezeichnet in dieser Tempelvision den Tempel beziehungsweise Tempelkomplex; „Tempel“ benennt den Bezug im Deutschen eindeutig.
- source_word: הַבָּיִת
  choice: im Tempel
  rationale: Im kultischen Zusammenhang ist „Tempel“ die natürliche deutsche Wiedergabe von „Haus“.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte und sachlich genaue deutsche Bezeichnung für עֹלָה.
- source_word: הַזֶּבַח
  choice: das Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer, ohne hier zwingend auf eine engere Opferart wie das Heilsopfer beschränkt zu sein. „Schlachtopfer“ unterscheidet es zudem klar vom Brandopfer.
- source_word: לָעָם
  choice: für das Volk
  rationale: Die Präposition ל kann hier Nutzen oder Vertretung ausdrücken. „Für das Volk“ ist knapp, natürlich und bewahrt diese Bedeutungsbreite.
- source_word: יַעַמְדוּ לִפְנֵיהֶם
  choice: vor ihnen stehen
  rationale: Die relativ wörtliche Wiedergabe bewahrt das Bild des dienstbereiten Dastehens vor dem Volk; der folgende Infinitiv nennt dessen Zweck.
- source_word: לְשָׁרְתָם
  choice: um ihnen zu dienen
  rationale: Das Suffix bezieht den Dienst ausdrücklich auf das Volk. „Dienen“ ist hier natürlicher als eine Wiederholung von „Dienst tun“ und erhält den Sinn der zugewiesenen Hilfsfunktion.
- source_word: וְהָיוּ
  choice: Doch sie sollen
  rationale: 'Das einleitende ו knüpft an die vorausgehende Einschränkung an und hat im Zusammenhang kontrastive Kraft: Trotz des Ausschlusses vom eigentlichen Priesterdienst bleiben ihnen untergeordnete Aufgaben.'
theological_decisions:
- issue: Stellung der eingeschränkten Leviten im Heiligtum
  choice: Sie erhalten zugewiesene, untergeordnete Tempeldienste, nicht den unmittelbaren Priesterdienst vor JHWH.
  alternative: Sie versehen weiterhin uneingeschränkt den vollen Priesterdienst.
  rationale: Der unmittelbare Kontext unterscheidet ihren Dienst an Toren, Tempel und Volk vom Nahen zu JHWH und vom eigentlichen Priesterdienst. Die Übersetzung benennt ihre Aufgaben, ohne zusätzliche Rangbegriffe in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Wiederholungen des hebräischen Leitworts für kultischen Dienst werden soweit natürlich beibehalten. Die Satzgliederung macht die beiden Bereiche – Zuständigkeit an den Toren und Dienst im Tempel – gut verständlich, ohne פְּקֻדּוֹת vorschnell ausschließlich als Aufsicht oder Bewachung festzulegen.
