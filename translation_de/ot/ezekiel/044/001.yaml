  source_fidelity: 'Die kausative Bedeutung von וַיָּשֶׁב („er ließ mich zurückkehren/führte mich zurück“) sowie die Kennzeichnung des äußeren, ostwärts gerichteten Tores sind zutreffend erfasst. „Auf dem Weg zum“ ist jedoch als Wiedergabe von דֶּרֶךְ im Deutschen weniger klar: Es kann eine Bewegung lediglich in Richtung des Tores bezeichnen, statt die Rückführung zu diesem Tor. „Zum ... zurück“ gibt den im Kontext gemeinten Zielbezug idiomatisch wieder, ohne einen Durchgang durch das Tor zu behaupten. „Verschlossen“ kann zudem stärker den Gedanken des Verriegeltseins nahelegen; סָגוּר besagt zunächst „geschlossen“.'
