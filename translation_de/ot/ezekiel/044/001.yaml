    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב אֹתִי
  choice: brachte er mich … zurück
  rationale: Die Hifil-Form von שוב bezeichnet hier, dass der Führer Ezechiel zurückkehren ließ beziehungsweise zurückbrachte. Die Formulierung ist im Deutschen natürlich und bewahrt den kausativen Sinn.
- source_word: דֶּרֶךְ
  choice: auf dem Weg zu
  rationale: דֶּרֶךְ bezeichnet den Weg beziehungsweise die Route. Im Zusammenhang führt der Führer Ezechiel zu dem Tor zurück; die Wiedergabe vermeidet die Aussage, er sei durch das verschlossene Tor hindurchgegangen.
- source_word: שַׁעַר
  choice: Tor
  rationale: Die übliche und präzise Bezeichnung für ein Tor in einem architektonischen Zusammenhang.
- source_word: הַמִּקְדָּשׁ
  choice: des Heiligtums
  rationale: מִקְדָּשׁ bezeichnet hier den heiligen Tempelbereich. »Heiligtum« wahrt dessen sakralen Charakter, ohne den Ausdruck unnötig auf den innersten Raum zu verengen.
- source_word: הַחִיצוֹן
  choice: äußeren
  rationale: Das Adjektiv unterscheidet dieses Tor von den inneren Toren der Tempelanlage.
- source_word: הַפֹּנֶה קָדִים
  choice: das nach Osten ausgerichtet war
  rationale: Das Partizip mit קָדִים beschreibt die Orientierung des bestimmten Tores. Die deutsche Formulierung gibt dies klar und natürlich wieder.
- source_word: וְהוּא סָגוּר
  choice: es war verschlossen
  rationale: סָגוּר bezeichnet einen geschlossenen Zustand. »Verschlossen« passt idiomatisch zu einem Tor; die neutrale Verknüpfung verlangt keinen adversativen Sinn.
