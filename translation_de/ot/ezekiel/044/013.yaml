  to: Sie sollen sich mir nicht nahen, um mir als Priester zu dienen; auch sollen sie sich keinem meiner heiligen Dinge nahen, auch nicht den hochheiligen Dingen. Sie werden ihre Schande und die Gräueltaten tragen, die sie getan haben.[a]
