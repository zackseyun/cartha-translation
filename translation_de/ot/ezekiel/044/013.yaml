    issue: Unidiomatische bzw. grammatisch unstimmige Apposition bei „keinem meiner heiligen Dinge nahen, den hochheiligen Dingen“
    rationale: „keinem ... Dinge“ steht als Dativ Singular, „den hochheiligen Dingen“ als Dativ Plural. Die beabsichtigte erklärende Beziehung wird dadurch im Deutschen nicht sauber ausgedrückt.
  - severity: low
    issue: „begangen haben“ ist für עשׂוּ zu eng
    rationale: Das hebräische Verb bedeutet allgemein „tun/machen“. In Verbindung mit תועבות ist eine negative Wertung bereits vorhanden; „begangen“ fügt eine spezifisch strafrechtliche Nuance hinzu.
  - severity: low
    issue: Modalität von „dürfen“ und „müssen“
    rationale: Die hebräischen Imperfekte formulieren hier Verbot und angekündigte Folge. „Sollen nicht“ und „werden ... tragen“ geben dies im prophetisch-rechtlichen Register unmittelbarer wieder.
