  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: die doppelte kultische Annäherung, der priesterliche Dienst, die heiligen Dinge und das Tragen von Schande bleiben erhalten. Jedoch gibt „Gräueltaten, die sie begangen haben“ das neutrale עשׂוּ („die sie getan haben“) unnötig spezifisch wieder. Auch „müssen“ verschiebt das Zukunftsurteil zu einer modal formulierten Verpflichtung.'
  naturalness: „Sie dürfen“ ist verständlich, aber „Sie sollen nicht“ entspricht in diesem prophetisch-rechtlichen Kontext dem deutschen Register besser. Die Verbindung „keinem meiner heiligen Dinge nahen, den hochheiligen Dingen“ ist wegen des Numerus- und Kasusanschlusses der Apposition nicht idiomatisch. Eine parallel formulierte Wiederaufnahme mit „auch nicht“ ist klar und natürlich.
  terminology: „Sich nahen“, „als Priester dienen“, „Schande“ und „hochheilige Dinge“ sind angemessen. „Gräueltaten“ kann die starke Wertung von תועבות vermitteln, doch der Relativsatz sollte die Allgemeinheit von עשׂוּ bewahren. Die Fußnote wahrt die mögliche räumliche Lesart sachgerecht.
  issues:
