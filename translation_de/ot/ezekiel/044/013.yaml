  text: וְ/לֹֽא יִגְּשׁ֤וּ אֵלַ/י֙ לְ/כַהֵ֣ן לִ֔/י וְ/לָ/גֶ֨שֶׁת֙ עַל כָּל קָ֣דָשַׁ֔/י אֶל קָדְשֵׁ֖י הַ/קְּדָשִׁ֑ים וְ/נָֽשְׂאוּ֙ כְּלִמָּתָ֔/ם וְ/תוֹעֲבוֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/013.yaml
  text: They shall not come near to me to serve as priests for me[a], nor to come near any of my holy things, the most holy things; but they shall bear their shame and the abominations that they have done.
translation:
  language: de
  text: Sie sollen sich mir nicht nahen, um mir als Priester zu dienen; auch sollen sie sich keinem meiner heiligen Dinge nahen, auch nicht den hochheiligen Dingen. Sie werden ihre Schande und die Gräueltaten tragen, die sie getan haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Allerheiligsten“. Der hebräische Ausdruck kann sowohl die hochheiligen Dinge als auch den innersten Raum des Heiligtums bezeichnen; der Zusammenhang spricht hier eher für die erste Bedeutung.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְּשׁוּ אֵלַי
  choice: sich mir nahen
  rationale: נגשׁ bezeichnet im priesterlich-kultischen Zusammenhang das Herantreten in die heilige Nähe. „Sich mir nahen“ bewahrt diesen Sinn und den würdevollen Ton.
- source_word: לְכַהֵן לִי
  choice: um mir als Priester zu dienen
  rationale: Das denominative Verb כהן bedeutet, als Priester zu amtieren oder zu dienen. Die gewählte Formulierung ist verständlich und erhält sowohl Dienst als auch Amt.
- source_word: וְלָגֶשֶׁת
  choice: und sie dürfen sich … nahen
  rationale: Die Wiederholung derselben Wurzel נגשׁ wird auch im Deutschen beibehalten; die koordinierte Verbotsform gibt die syntaktische Funktion natürlich wieder.
- source_word: עַל כָּל קָדָשַׁי
  choice: keinem meiner heiligen Dinge
  rationale: קָדָשַׁי ist substantivischer Plural und bezeichnet geheiligte Gegenstände, Gaben oder Dinge. Nach der Negation gibt „keinem“ die distributive Kraft von כָּל idiomatisch wieder.
- source_word: אֶל קָדְשֵׁי הַקְּדָשִׁים
  choice: den hochheiligen Dingen
  rationale: Die Status-constructus-Verbindung ist als Superlativ verstehbar. Im unmittelbaren Zusammenhang erläutert sie wahrscheinlich die zuvor genannten heiligen Dinge; die räumliche Deutung bleibt in der Fußnote erhalten.
- source_word: וְנָשְׂאוּ
  choice: sie müssen … tragen
  rationale: נשא mit Schande und Verfehlungen bezeichnet das Tragen einer Last beziehungsweise ihrer Folgen. „Tragen“ bewahrt die knappe und bewusst offene Bildsprache.
- source_word: כְּלִמָּתָם
  choice: ihre Schande
  rationale: כלמה bezeichnet Schande oder Entehrung; „Schande“ ist die direkte, geläufige Entsprechung.
- source_word: וְתוֹעֲבוֹתָם
  choice: die Gräueltaten
  rationale: תועבות ist ein starker prophetischer Ausdruck für verabscheuungswürdige Handlungen. „Gräueltaten“ vermittelt die Schärfe in natürlichem modernem Deutsch, ohne einen technischen Konfessionsbegriff einzuführen.
- source_word: אֲשֶׁר עָשׂוּ
  choice: die sie begangen haben
  rationale: Das allgemeine עשה erhält hier durch die Verbindung mit verabscheuungswürdigen Taten idiomatisch den Sinn „begehen“. Das Perfekt bezeichnet vergangene Handlungen mit fortwirkender Folge.
theological_decisions:
- issue: Bedeutung von קָדְשֵׁי הַקְּדָשִׁים an dieser Stelle
  choice: 'Sachbezug: „die hochheiligen Dinge“'
  alternative: 'Raumbezug: „das Allerheiligste“'
  rationale: Da die Wendung unmittelbar auf „meine heiligen Dinge“ folgt, liegt eine nähere Bestimmung besonders heiliger Gegenstände oder Gaben nahe. Weil die hebräische Formulierung auch den innersten Heiligtumsraum bezeichnen kann, wird diese echte Mehrdeutigkeit nicht verschwiegen, sondern in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Wiederholung von „sich nahen“ bleibt erhalten. „Hochheilig“ gibt den hebräischen Superlativ kompakt wieder; die mögliche räumliche Lesart wird in der Fußnote dokumentiert.
