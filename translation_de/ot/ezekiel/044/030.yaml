base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/030.yaml
  text: And the first of all the firstfruits of everything[a], and every contribution from all your contributions, shall belong to the priests. You shall give the first of your dough to the priest[c][b], to cause a blessing to rest on your house.
translation:
  language: de
  text: Der erste Anteil aller Erstlingsgaben jeder Art und jede Abgabe aus all euren Abgaben[a] sollen den Priestern gehören. Den ersten Anteil eures Teigs[b] sollt ihr dem Priester geben, damit ein Segen auf deinem Haus[c] ruht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Opfergabe aus all euren Opfergaben“. Das hebräische Wort bezeichnet einen Anteil, der ausgesondert und für den heiligen Gebrauch dargebracht wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den ersten Anteil eurer Teigportion“. Das hebräische Wort kann Teig oder eine Teigportion bezeichnen; in anderem Zusammenhang auch einen Knettrog.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: damit Segen auf deinem Haus ruht; mit „Haus“ kann hier auch die ganze Hausgemeinschaft gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית ... בִּכּוּרֵי
  choice: der erste Anteil aller Erstlingsgaben
  rationale: רֵאשִׁית bezeichnet hier den ersten beziehungsweise ausgesonderten Anteil, während בִּכּוּרִים die Erstlingsgaben bezeichnet. Die Formulierung bewahrt beide Ausdrücke, ohne sie zu einem einzigen Begriff zusammenzuziehen.
- source_word: תְּרוּמַת / תְּרוּמוֹתֵיכֶם
  choice: Abgabe / eure Abgaben
  rationale: תְּרוּמָה bezeichnet einen für den heiligen Gebrauch ausgesonderten Beitrag. „Abgabe“ ist gegenwärtiges, verständliches Deutsch und vermeidet den altertümlichen Fachausdruck „Hebopfer“.
- source_word: לַכֹּהֲנִים יִהְיֶה
  choice: sollen den Priestern gehören
  rationale: Die Wendung drückt rechtliche Zuweisung aus. Wegen des zusammengesetzten Subjekts ist im Deutschen der Plural natürlich.
- source_word: עֲרִסוֹתֵיכֶם
  choice: eures Teigs
  rationale: Das Wort kann den Teig, die Teigmenge oder ursprünglich den Knettrog bezeichnen. Im Zusammenhang der Abgabe ist der Teig gemeint; die mögliche Nuance einer Teigmenge wird in der Fußnote genannt.
- source_word: תִּתְּנוּ לַכֹּהֵן
  choice: sollt ihr dem Priester geben
  rationale: Die Mehrzahl der Gebenden und der einzelne, repräsentativ genannte Priester werden entsprechend dem Hebräischen beibehalten.
- source_word: לְהָנִיחַ בְּרָכָה אֶל בֵּיתֶךָ
  choice: damit Segen auf deinem Haus ruht
  rationale: Die Zweck- beziehungsweise Ergebniswendung wird natürlich wiedergegeben und bewahrt das Bild eines Segens, der auf dem Haus zur Ruhe kommt. Der Wechsel vom pluralischen „euch“ zum singularischen „deinem“ bleibt erhalten.
theological_decisions:
- issue: Art des Segens für das Haus
  choice: Der nicht näher bestimmte Segen ruht auf dem Haus des Gebenden.
  alternative: Eine ausdrückliche Zusage materiellen Wohlstands oder ausschließlich geistlichen Segens.
  rationale: Der hebräische Text bestimmt die Gestalt des Segens nicht näher. Die Übersetzung lässt diese inhaltliche Weite bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultrechtlichen Begriffe werden verständlich wiedergegeben, während die betonte Doppelung von רֵאשִׁית und בִּכּוּרֵי sowie der Numeruswechsel zwischen „euren“ und „deinem“ erhalten bleiben.
