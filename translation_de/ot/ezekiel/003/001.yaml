  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם אֵ֥ת אֲשֶׁר תִּמְצָ֖א אֱכ֑וֹל אֱכוֹל֙ אֶת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את וְ/לֵ֥ךְ דַּבֵּ֖ר אֶל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/001.yaml
  text: Then he said to me[a], “Son of man, eat what you find; eat this scroll, and go, speak to the house of Israel.”
translation:
  language: de
  text: 'Dann sagte er zu mir: „Menschensohn, iss, was du vorfindest[a]; iss diese Schriftrolle und geh, rede zum Haus Israel!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles, was du vorfindest, iss.“ Die hebräische Formulierung kann sowohl „was“ als auch „alles, was“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Dann sagte er zu mir
  rationale: Das Narrativ-Waw führt die Handlung weiter. „Dann“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die im Deutschen etablierte, bildhafte Wiedergabe bewahrt die wörtliche Form der für Ezechiel typischen Anrede, ohne sie erklärend zu „Mensch“ oder „Sterblicher“ aufzulösen.
- source_word: אֵת אֲשֶׁר תִּמְצָא
  choice: was du vorfindest
  rationale: „Vorfinden“ bezeichnet natürlich das, was dem Propheten vorgelegt beziehungsweise vor ihm bereitliegt, und bleibt nahe an der offenen hebräischen Formulierung.
- source_word: אֱכֹל אֱכוֹל
  choice: iss … iss
  rationale: Die Wiederholung des Imperativs wird beibehalten und trägt so Nachdruck und Befehlsfolge, ohne sie durch ein deutendes Adverb zu ersetzen.
- source_word: מְגִלָּה
  choice: Schriftrolle
  rationale: „Schriftrolle“ ist im modernen Deutsch eindeutig und bezeichnet präzise eine beschriebene antike Rolle.
- source_word: וְלֵךְ
  choice: und geh
  rationale: Die einfache Bewegungsaufforderung und ihre Verbindung mit den übrigen Befehlen bleiben erhalten.
- source_word: דַּבֵּר
  choice: rede
  rationale: „Rede“ ist eine direkte, würdige Wiedergabe des Verbs und fügt gegenüber „verkünde“ keine zusätzliche Deutung hinzu.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die kollektive und bundestheologisch geprägte hebräische Wendung wird formal bewahrt, statt sie zu „Volk Israel“ zu verallgemeinern.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Mensch; du Sterblicher
  rationale: „Menschensohn“ wahrt die konkrete hebräische Bildsprache und die traditionelle deutsche Erkennbarkeit der wiederkehrenden Anrede. Eine ausdrückliche christologische Deutung wird weder hinzugefügt noch ausgeschlossen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappe Folge der Imperative und die Wiederholung von „iss“ bilden den Nachdruck des Hebräischen ab.
