source:
  edition: WLC
  text: וּ/בֵ֣ית יִשְׂרָאֵ֗ל לֹ֤א יֹאבוּ֙ לִ/שְׁמֹ֣עַ אֵלֶ֔י/ךָ כִּֽי אֵינָ֥/ם אֹבִ֖ים לִ/שְׁמֹ֣עַ אֵלָ֑/י כִּ֚י כָּל בֵּ֣ית יִשְׂרָאֵ֔ל חִזְקֵי מֵ֥צַח וּ/קְשֵׁי לֵ֖ב הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/007.yaml
  text: But the house of Israel will not be willing to listen to you[a], because they are not willing to listen to me[b]; for all the house of Israel are hard of forehead and stubborn of heart.
translation:
  language: de
  text: Aber das Haus Israel wird nicht auf dich hören wollen, weil es nicht auf mich hören will; denn das ganze Haus Israel hat eine harte Stirn[a] und ein verstocktes Herz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »hart an der Stirn«; das hebräische Bild bezeichnet schamlosen, unbeugsamen Trotz.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »hart im Herzen« oder »hartnäckig im Herzen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית יִשְׂרָאֵל
  choice: Aber das Haus Israel
  rationale: Das adversative »Aber« gibt den Gegensatz zu den zuvor genannten fremden Völkern wieder. »Das Haus Israel« bewahrt die korporative und bundesgeschichtliche Ausdrucksweise.
- source_word: לֹא יֹאבוּ לִשְׁמֹעַ אֵלֶיךָ
  choice: wird nicht auf dich hören wollen
  rationale: אָבָה bezeichnet Bereitschaft oder Einwilligung; die Verbindung mit »wollen« bewahrt diesen Willensaspekt. שׁמע mit אֶל wird natürlich als »auf jemanden hören« wiedergegeben, ohne die Bedeutung vorschnell auf »gehorchen« zu verengen.
- source_word: כִּי אֵינָם אֹבִים לִשְׁמֹעַ אֵלָי
  choice: weil es nicht auf mich hören will
  rationale: »Weil« macht die kausale Beziehung deutlich. Die parallele Formulierung erhält den engen Zusammenhang zwischen der Ablehnung des Propheten und der Ablehnung Gottes; das deutsche Singularpronomen richtet sich grammatisch nach »Haus«.
- source_word: כִּי כָּל בֵּית יִשְׂרָאֵל
  choice: denn das ganze Haus Israel
  rationale: »Denn« leitet den weiteren Erklärungsgrund ein. »Das ganze« erhält die umfassende korporative Aussage des Hebräischen.
- source_word: חִזְקֵי מֵצַח
  choice: hat eine harte Stirn
  rationale: Die wörtliche Bildsprache »hart/stark an der Stirn« bezeichnet schamlose, trotzige Unnachgiebigkeit. Die deutsche Formulierung bewahrt das auffällige Körperbild.
- source_word: וּקְשֵׁי לֵב
  choice: und ein verstocktes Herz
  rationale: »Verstockt« gibt die innere Starrheit und den hartnäckigen Widerstand wieder, während »Herz« als Bild für Wollen und innere Haltung erhalten bleibt.
- source_word: הֵמָּה
  choice: hat
  rationale: Die abschließende Feststellung wird in einer natürlichen deutschen Prädikatskonstruktion ausgedrückt. Wegen des kollektiven Subjekts »das ganze Haus Israel« steht das Verb im Singular.
theological_decisions:
- issue: Korporative Charakterisierung Israels
  choice: »das ganze Haus Israel« ohne Abschwächung
  alternative: »viele im Haus Israel« oder »die Führer Israels«
  rationale: Der hebräische Text formuliert in diesem prophetischen Zusammenhang ausdrücklich eine umfassende korporative Anklage. Eine Einschränkung auf eine nicht genannte Teilgruppe würde die Spannung des Textes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung »auf … hören wollen« bewahrt sowohl den Willensaspekt als auch die rhetorische Parallelität. Die ungewöhnliche Bildsprache von Stirn und Herz bleibt im Haupttext sichtbar und wird in den Fußnoten knapp erläutert.
