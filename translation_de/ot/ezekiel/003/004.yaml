source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֗ם לֶךְ בֹּא֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל וְ/דִבַּרְתָּ֥ בִ/דְבָרַ֖/י אֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/004.yaml
  text: Then he said to me[a], “Son of man, go to the house of Israel and speak my words to them.”
translation:
  language: de
  text: 'Da sagte er zu mir: „Menschensohn[a], geh zum Haus Israel und sprich zu ihnen mit meinen Worten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Menschenkind“ beziehungsweise „Sterblicher“. Die hebräische Wendung ist die in Hesekiel immer wiederkehrende Anrede des Propheten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Da sagte er zu mir
  rationale: Das Waw mit Narrativform führt die Handlung weiter. „Da“ gibt die zeitliche Abfolge im Deutschen natürlich wieder; „Und“ wäre ebenfalls möglich.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die wörtliche, in Hesekiel wiederkehrende Anrede bewahrt die hebräische Bildform und ihren literarischen Klang, ohne sie durch eine Deutung wie „Sterblicher“ zu ersetzen.
- source_word: לֶךְ בֹּא
  choice: geh zum
  rationale: Die zwei hebräischen Imperative bilden hier zusammen eine Aufforderung, sich zum genannten Ziel zu begeben. Eine mechanische Wiedergabe wie „geh, komm zum“ wäre im Deutschen missverständlich; „geh zum“ gibt den Sinn natürlich wieder.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: zum Haus Israel
  rationale: Die prophetische Bezeichnung wird beibehalten. Sie meint Israel als Volk, trägt aber zugleich die feste bundestheologische und literarische Ausdrucksweise des Hebräischen.
- source_word: וְדִבַּרְתָּ בִדְבָרַי אֲלֵיהֶם
  choice: und sprich meine Worte zu ihnen
  rationale: Die Folgeform setzt die Aufforderung fort. „Meine Worte“ bewahrt den Plural und die unmittelbare Beauftragung; „zu ihnen“ nimmt das Haus Israel als Personengruppe wieder auf.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: „Menschensohn“ wahrt Form und wiederkehrende Funktion der hebräischen Anrede. Die Übersetzung legt weder ausschließlich Sterblichkeit als Sinn fest noch überträgt sie christologische Aussagen späterer Texte auf diese Stelle.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die feste Wendung „Haus Israel“ und die Anrede „Menschensohn“ bleiben bewusst erhalten; unnötig altertümliche Syntax wird vermieden.
