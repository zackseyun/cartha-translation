revisions:
- from: Wenn du aber einen Gerechten davor warnst zu sündigen und er nicht sündigt, wird er ganz gewiss leben, weil er sich hat warnen lassen[a]; und du hast dein Leben gerettet.
  to: Wenn du aber einen Gerechten warnst, damit er nicht sündigt, und er nicht sündigt, wird er ganz gewiss leben, weil er gewarnt worden ist[a]; und du hast dein Leben gerettet.
  rationale: Die Revision ersetzt eine im Deutschen voluntativ gefärbte und weniger natürliche Wendung durch die neutrale passive Grundwiedergabe des Nifal. Die mögliche responsive Nuance wird ausdrücklich, aber nicht entscheidend, in der Fußnote dokumentiert. Die übrige Satzfolge und die Aussage über die Verantwortung des Wächters bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:11Z'
review_pass:
  verdict: revise
  source_fidelity: Die Bedingungsfolge, die emphatische Zusage „wird ... gewiss leben“ und die Wiedergabe von נֶפֶשׁ als „Leben“ sind sachgerecht. Die Formulierung „sich hat warnen lassen“ ist jedoch keine neutrale Wiedergabe des hebräischen Nifal נִזְהָר; sie legt nahe, dass der Gerechte die Warnung willentlich zugelassen habe. Die Grundbedeutung des Nifal kann hier passiv („gewarnt worden ist“) sein, wobei ein responsiver Sinn als mögliche Deutung in der Anmerkung erhalten bleiben sollte.
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Deutsch. „Weil er sich hat warnen lassen“ klingt allerdings idiomatisch weniger glatt und semantisch unnötig markiert. „Weil er gewarnt worden ist“ ist natürlich und näher an der passiven Form des Hebräischen. „Damit er nicht sündigt“ macht zudem den Zweck der Warnung klar und flüssig.
  terminology: „Gerechten“, „sündigt“, „leben“ und „dein Leben gerettet“ sind passend. „Gerettet“ gibt הִצַּלְתָּ angemessen wieder, ohne die Aussage dogmatisch als geistliche Selbsterlösung festzulegen.
  issues:
  - severity: medium
    issue: „weil er sich hat warnen lassen“ legt eine freiwillige Zulassung der Warnung nahe.
    rationale: נִזְהָר ist Nifal und kann passiv „gewarnt worden sein“ bedeuten; ein responsives Verständnis ist möglich, aber nicht im deutschen Haupttext festzulegen. Die bestehende Fußnote kann die Alternative „die Warnung beachtet hat“ bewahren.
  revised_text: Wenn du aber einen Gerechten warnst, damit er nicht sündigt, und er nicht sündigt, wird er ganz gewiss leben, weil er gewarnt worden ist[a]; und du hast dein Leben gerettet.
