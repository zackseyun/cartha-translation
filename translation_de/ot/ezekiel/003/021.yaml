source:
  edition: WLC
  text: וְ/אַתָּ֞ה כִּ֧י הִזְהַרְתּ֣/וֹ צַדִּ֗יק לְ/בִלְתִּ֥י חֲטֹ֛א צַדִּ֖יק וְ/ה֣וּא לֹא חָטָ֑א חָי֤וֹ יִֽחְיֶה֙ כִּ֣י נִזְהָ֔ר וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/021.yaml
  text: But if you warn a righteous man not to sin[a], and he does not sin, he will surely live because he took warning, and you will have delivered your life.
translation:
  language: de
  text: Wenn du aber einen Gerechten warnst, damit er nicht sündigt, und er nicht sündigt, wird er ganz gewiss leben, weil er gewarnt worden ist[a]; und du hast dein Leben gerettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er die Warnung beachtet hat“. Das hebräische Verb kann den Empfang der Warnung bezeichnen, möglicherweise auch die Reaktion darauf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: wenn
  rationale: In Verbindung mit וְאַתָּה leitet כִּי hier den Bedingungssatz ein und entspricht dem Aufbau des vorausgehenden Zusammenhangs.
- source_word: הִזְהַרְתּוֹ
  choice: du … warnst
  rationale: Der Hifil von זהר bedeutet „warnen“ oder „ermahnen“. Das Präsens passt im Deutschen zu der allgemein formulierten Bedingung.
- source_word: צַדִּיק
  choice: einen Gerechten
  rationale: Das substantivierte maskuline Adjektiv bezeichnet hier einen einzelnen gerechten Mann; die indefinite Form passt zum hypothetischen Fall.
- source_word: לְבִלְתִּי חֲטֹא
  choice: davor … zu sündigen
  rationale: Die Infinitivkonstruktion bezeichnet Ziel beziehungsweise Verhinderung. Die deutsche Fügung mit „davor warnen“ gibt dies natürlich und präzise wieder.
- source_word: וְהוּא לֹא חָטָא
  choice: und er nicht sündigt
  rationale: Obwohl im Hebräischen eine Perfektform steht, verlangt die allgemeine Bedingungsfolge im Deutschen idiomatisch das Präsens.
- source_word: חָיוֹ יִחְיֶה
  choice: wird er ganz gewiss leben
  rationale: Infinitivus absolutus und Imperfekt desselben Verbs bilden eine nachdrückliche Zusicherung; „ganz gewiss“ bildet diese Verstärkung ab.
- source_word: נִזְהָר
  choice: er sich hat warnen lassen
  rationale: Der Nifal von זהר kann sowohl das Empfangen der Warnung als auch die Reaktion darauf hervorheben. Die gewählte Form bewahrt beide Aspekte besser als eine rein passive oder eindeutig responsive Wiedergabe.
- source_word: נַפְשְׁךָ
  choice: dein Leben
  rationale: נֶפֶשׁ bezeichnet hier im Kontext des Wächterauftrags das Leben der Person, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: הִצַּלְתָּ
  choice: du hast … gerettet
  rationale: Der Hifil von נצל bedeutet „retten“ oder „befreien“. Das Perfekt gibt das Ergebnis der erfüllten Wächterpflicht wieder.
theological_decisions:
- issue: Bedeutung von „dein Leben gerettet“ im Zusammenhang des Wächterauftrags
  choice: Die Formulierung bleibt wörtlich genug, um die gerichtliche Verantwortlichkeit des Propheten vor Gott und die Bewahrung vor Blutschuld auszudrücken.
  alternative: Die Aussage ausdrücklich als geistliche Selbsterrettung oder ausschließlich als Bewahrung des körperlichen Lebens erklären.
  rationale: Der nähere Zusammenhang handelt davon, ob Gott Blut von der Hand des Wächters fordert. Die Übersetzung soll diese ernste Verantwortlichkeit bewahren, ohne eine Lehre von Erlösung durch eigenes Verdienst einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Verbverbindung wird mit „ganz gewiss“ wiedergegeben. Das Semikolon hält den abschließenden Satz über die Verantwortung des Wächters eng mit der Bedingungsfolge verbunden.
