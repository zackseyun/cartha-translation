  text: וַ/תְּהִ֥י עָלַ֛/י שָׁ֖ם יַד יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלַ֗/י ק֥וּם צֵא֙ אֶל הַ/בִּקְעָ֔ה וְ/שָׁ֖ם אֲדַבֵּ֥ר אוֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/022.yaml
  text: And there the hand of Yahweh was upon me[a], and he said to me, “Rise, go out to the valley[b], and there I will speak with you.”
translation:
  language: de
  text: 'Dort war die Hand Jahwes auf mir, und er sagte zu mir: »Steh auf, geh hinaus in die Talebene[a]; dort werde ich mit dir reden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ebene«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu dir reden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עָלַי שָׁם
  choice: Dort ruhte … auf mir
  rationale: Die Formulierung gibt den Zustand göttlicher Macht und Einwirkung wieder, ohne unnötig einen plötzlichen Beginn auszudrücken. „Ruhte auf mir“ bewahrt zugleich das hebräische Bild und klingt im modernen Deutschen natürlich.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Die konkrete prophetische Metapher bleibt erhalten und wird nicht erklärend zu „Macht“ aufgelöst.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קוּם צֵא
  choice: Steh auf, geh hinaus
  rationale: Die beiden Imperative werden direkt, klar und in natürlichem modernem Deutsch wiedergegeben.
- source_word: הַבִּקְעָה
  choice: die Talebene
  rationale: בִּקְעָה bezeichnet eine breite Niederung beziehungsweise Ebene zwischen Höhen. „Talebene“ hält beide räumlichen Aspekte zusammen; „Ebene“ bleibt als mögliche Alternative vermerkt.
- source_word: אֲדַבֵּר אוֹתָךְ
  choice: ich werde mit dir reden
  rationale: Die Verbindung von דבר mit אֵת kann als „mit jemandem reden“ wiedergegeben werden. Diese Fassung bewahrt die relationale Formulierung, ohne den Inhalt des angekündigten Redens vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt den Eigennamen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Bild von der Hand Jahwes
  choice: konkrete Metapher beibehalten
  alternative: die Macht Jahwes kam über mich
  rationale: „Die Hand Jahwes“ kann göttliche Macht oder zwingenden Einfluss bezeichnen. Die Übersetzung lässt das prophetische Bild und seinen Bedeutungsumfang bestehen, statt es auf eine einzige Deutung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und knapp gehalten; die konkrete prophetische Bildsprache des Hebräischen bleibt erhalten.
