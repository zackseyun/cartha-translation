source:
  edition: WLC
  text: כִּ֡י לֹא֩ אֶל עַ֨ם עִמְקֵ֥י שָׂפָ֛ה וְ/כִבְדֵ֥י לָשׁ֖וֹן אַתָּ֣ה שָׁל֑וּחַ אֶל בֵּ֖ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/005.yaml
  text: For you are not being sent to a people of obscure speech and difficult language[a], but to the house of Israel.
translation:
  language: de
  text: Denn du bist nicht zu einem Volk mit unverständlicher Rede und schwer verständlicher Sprache[a] gesandt, sondern zum Haus Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tief von Lippe und schwer von Zunge“; eine hebräische Ausdrucksweise für schwer verständliche Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorangehenden Auftrags ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: עַם
  choice: Volk
  rationale: Bezeichnet hier eine ethnisch-sprachliche Gemeinschaft, nicht einen modernen Staat.
- source_word: עִמְקֵי שָׂפָה
  choice: mit unverständlicher Rede
  rationale: Die wörtliche Wendung „tief von Lippe“ beschreibt eine Redeweise, die für den Hörer schwer zu erfassen ist; „unverständlich“ vermittelt die idiomatische Bedeutung klar.
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: und schwer verständlicher Sprache
  rationale: Die wörtliche Wendung „schwer von Zunge“ bezeichnet hier eine Sprache, die schwer zu verstehen ist. Die Formulierung bewahrt die Nähe zum Bild, ohne im Deutschen missverständlich auf eine Sprechstörung zu deuten.
- source_word: שָׁלוּחַ
  choice: wirst … gesandt
  rationale: Das passive Prädikativpartizip steht im gegenwärtigen Zusammenhang der Beauftragung; die deutsche Passivform gibt diesen Sendungsauftrag würdig und idiomatisch wieder.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Bewahrt die feste prophetische Bezeichnung und ihre gemeinschaftliche, heilsgeschichtliche Prägung.
theological_decisions:
- issue: Gegensatz zwischen dem fremdsprachigen Volk und Israel
  choice: „sondern“ wird zur Verdeutlichung des im Hebräischen asyndetisch formulierten Gegensatzes verwendet.
  alternative: 'Wörtlicher ohne „sondern“: „… gesandt, zum Haus Israel.“'
  rationale: Der hebräische Satz stellt „nicht zu einem Volk …“ unmittelbar „zum Haus Israel“ gegenüber. „Sondern“ macht diese grammatisch klare Gegenüberstellung im natürlichen Deutschen sichtbar, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Wendung „Haus Israel“ bleibt erhalten; die beiden hebräischen Körperbilder werden im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich dokumentiert.
