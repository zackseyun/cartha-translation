base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/009.yaml
  text: Like diamond[a], harder than flint, I have made your forehead. Do not fear them, and do not be dismayed before them, for they are a rebellious house.
translation:
  language: de
  text: Wie einen äußerst harten Stein, härter als Feuerstein, habe ich deine Stirn gemacht. Fürchte dich nicht vor ihnen und lass dich von ihnen nicht einschüchtern, denn sie sind ein widerspenstiges Haus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמִיר
  choice: Diamant
  rationale: Im Zusammenhang bezeichnet das Wort keine Dornpflanze, sondern einen außerordentlich harten Stein oder Stoff. »Diamant« vermittelt das Härtebild im modernen Deutsch verständlich; die genaue mineralogische Bestimmung bleibt in einer Fußnote offen.
- source_word: חָזָק מִצֹּר
  choice: härter als Feuerstein
  rationale: Die Verbindung aus Adjektiv und vergleichendem מִן bezeichnet hier eine den Feuerstein übertreffende Härte und führt das Bild der unnachgiebigen Stirn fort.
- source_word: מִצְחֶךָ
  choice: deine Stirn
  rationale: Die direkte Körperbezeichnung bewahrt das Bild von Festigkeit und Entschlossenheit.
- source_word: לֹא תִירָא אוֹתָם
  choice: Fürchte dich nicht vor ihnen
  rationale: Der Imperfekt hat im Sendungsauftrag auffordernden beziehungsweise zusichernden Sinn. Die deutsche Wendung ist klar und würdevoll.
- source_word: וְלֹא תֵחַת מִפְּנֵיהֶם
  choice: und lass dich von ihnen nicht einschüchtern
  rationale: Das Nifal von חתת kann ein Erschüttert-, Entmutigt- oder Eingeschüchtertwerden ausdrücken. Die gewählte Formulierung gibt im Parallelismus mit dem Fürchten die Wirkung ihrer Gegenwart natürlich wieder.
- source_word: בֵּית מְרִי
  choice: ein widerspenstiges Haus
  rationale: »Haus« bleibt als korporative und familiäre Bezeichnung erhalten; »widerspenstig« beschreibt den fortgesetzten Widerstand, ohne die Metapher zu einem bloßen »Volk« abzuflachen.
theological_decisions:
- issue: Korporative Bezeichnung Israels im prophetischen Tadel
  choice: ein widerspenstiges Haus
  alternative: ein widerspenstiges Volk; ein Haus der Auflehnung
  rationale: Das hebräische »Haus« trägt in Ezechiel familiäre und gemeinschaftliche Bedeutung. Seine Beibehaltung bewahrt die prophetische Spannung, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Körper- und Hausmetaphern bleiben erhalten; eine unsichere mineralogische Identifizierung wird nicht als endgültig ausgegeben.
