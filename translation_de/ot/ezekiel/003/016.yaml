  text: וַ/יְהִ֕י מִ/קְצֵ֖ה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽרפ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/016.yaml
  text: And at the end of seven days[a], the word of Yahweh came to me, saying[b],
translation:
  language: de
  text: Und nach Ablauf von sieben Tagen[a] erging das Wort Jahwes an mich:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der Satz: „Und es geschah am Ende von sieben Tagen …“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Da kam ein Wort von Jahwe zu mir, das lautete:“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: Und ... erging
  rationale: Die beiden Formen von היה führen die Erzählung weiter. Im Deutschen gibt „Und … erging“ die zeitliche Fortführung und die übliche prophetische Wortereignisformel natürlich wieder, ohne das zweimalige „es geschah“ mechanisch nachzubilden.
- source_word: מִקְצֵה שִׁבְעַת יָמִים
  choice: nach Ablauf von sieben Tagen
  rationale: Die Verbindung bezeichnet den Zeitpunkt, an dem die genannte Zeitspanne verstrichen ist. „Nach Ablauf“ ist im modernen Deutschen klarer und idiomatischer als das wörtlichere „am Ende von“.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die bestimmte prophetische Formel und die hebräische Genitivverbindung bleiben erhalten; der Gottesname wird als persönlicher Name wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Tetragrammaton wird im Deutschen mit der geläufigen Transkription „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der deutschen Formel „das Wort erging“ ist „an mich“ die natürliche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die unmittelbar folgende Gottesrede im Deutschen idiomatisch ein und erfüllt hier dieselbe Diskursfunktion wie das hebräische „indem er sprach/mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen und verwendet die im modernen deutschen Bibel- und Fachsprachgebrauch übliche Form, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Charakter von דְבַר יְהוָה
  choice: das Wort Jahwes
  alternative: ein Wort von Jahwe
  rationale: Die traditionelle prophetische Formel lässt sich als bestimmtes „das Wort Jahwes“ verstehen. Die Alternative ist grammatisch möglich und wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erging das Wort Jahwes“ bewahrt den prophetischen Formelcharakter, während „nach Ablauf“ und der Doppelpunkt den Satz für heutige Leser flüssig halten.
