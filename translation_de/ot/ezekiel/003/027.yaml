id: EZK.3.27
reference: Ezekiel 3:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּֽ/בְ/דַבְּרִ֤/י אֽוֹתְ/ךָ֙ אֶפְתַּ֣ח אֶת פִּ֔י/ךָ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/שֹּׁמֵ֤עַ יִשְׁמָע֙ וְ/הֶ/חָדֵ֣ל יֶחְדָּ֔ל כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־׀׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/027.yaml
  text: 'But when I speak with you[a], I will open your mouth, and you shall say to them, ‘Thus says the Lord GOD: The one who hears, let him hear; and the one who refrains, let him refrain[b], for they are a rebellious house.’'
translation:
  language: de
  text: 'Doch wenn ich mit dir rede, werde ich deinen Mund öffnen, und du sollst zu ihnen sagen: »So spricht der Herr Yahweh: Wer hört, der höre; und wer es bleiben lässt, der lasse es bleiben.[a] Denn sie sind ein widerspenstiges Haus.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wer hört, wird hören; und wer es bleiben lässt, wird es bleiben lassen.« Die hebräischen Verbformen können auffordernd beziehungsweise zulassend oder als Vorhersage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »ein Haus der Widerspenstigkeit«; bei Ezechiel eine wiederkehrende Bezeichnung für Israel in seinem hartnäckigen Widerstand gegen Gott.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְדַבְּרִי אֹותְךָ
  choice: Doch wenn ich mit dir rede
  rationale: ב mit dem Infinitiv ist temporal; וּ wird wegen des Gegensatzes zur zuvor auferlegten Stummheit mit „Doch“ wiedergegeben. „Mit dir rede“ bildet אֹתְךָ natürlich ab.
- source_word: אֶפְתַּח אֶת־פִּיךָ
  choice: werde ich deinen Mund öffnen
  rationale: Die konkrete Formulierung bewahrt Gottes aktives Ermöglichen der prophetischen Rede.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: und du sollst zu ihnen sagen
  rationale: Die Folgeform drückt hier den göttlichen Auftrag an Ezechiel aus; „sollst“ ist im Deutschen klar und würdevoll.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Beide Bestandteile des hebräischen Titels bleiben erkennbar; „Yahweh“ gibt den Gottesnamen wieder und vermeidet die Doppelung „Herr HERR“.
- source_word: הַשֹּׁמֵעַ יִשְׁמָע
  choice: Wer hört, der höre
  rationale: Die Formulierung bewahrt die partizipial-imperfektivische Wiederholung und ihre mögliche auffordernde beziehungsweise zulassende Kraft.
- source_word: וְהֶחָדֵל יֶחְדָּל
  choice: und wer es bleiben lässt, der lasse es bleiben
  rationale: חדל bezeichnet Aufhören, Unterlassen oder Sich-Enthalten. „Es bleiben lassen“ ist natürliches modernes Deutsch und vermeidet, die bewusste Verweigerung stärker festzulegen, als es der hebräische Ausdruck verlangt.
- source_word: כִּי בֵּית מְרִי הֵמָּה
  choice: Denn sie sind ein widerspenstiges Haus
  rationale: „Haus“ bewahrt Ezechiels wiederkehrendes Kollektivbild; „widerspenstig“ bringt מְרִי als hartnäckige Auflehnung verständlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die gewählte Form lässt sowohl den Titel אֲדֹנָי als auch den offenbarten Eigennamen יהוה sichtbar, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Modale Mehrdeutigkeit von יִשְׁמָע und יֶחְדָּל
  choice: 'auffordernd beziehungsweise zulassend im Haupttext: „der höre … der lasse es bleiben“'
  alternative: 'vorhersagend: „der wird hören … der wird es bleiben lassen“'
  rationale: Die hebräischen Imperfektformen lassen hier sowohl eine volitive/permissive als auch eine prädiktive Auffassung zu. Der Haupttext folgt der rhetorisch naheliegenden volitiven Lesart; die Alternative wird ausdrücklich in der Fußnote bewahrt.
- issue: Kollektive Anklage בֵּית מְרִי
  choice: ein widerspenstiges Haus
  alternative: ein Haus der Widerspenstigkeit; ein rebellisches Volk
  rationale: Die Metapher und Ezechiels feste Wendung bleiben erhalten, ohne „Haus“ interpretierend zu „Volk“ aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und konkreter Bildsprache. Die ungewöhnliche Parallelstruktur wird zugunsten der hebräischen Rhetorik beibehalten; echte modale Mehrdeutigkeit wird durch Fußnote [a] offengelegt.
