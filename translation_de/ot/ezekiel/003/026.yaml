  text: וּ/לְשֽׁוֹנְ/ךָ֙ אַדְבִּ֣יק אֶל חִכֶּ֔/ךָ וְ/נֶֽאֱלַ֔מְתָּ וְ/לֹא תִֽהְיֶ֥ה לָ/הֶ֖ם לְ/אִ֣ישׁ מוֹכִ֑יחַ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/026.yaml
  text: And I will make your tongue cling to the roof of your mouth[a], and you will be mute and will not be for them a man who rebukes[d][c][b], for they are a rebellious house.
translation:
  language: de
  text: Und ich werde deine Zunge an deinem Gaumen haften lassen[a]. Du wirst verstummen und für sie keiner sein, der sie zurechtweist[b], denn sie sind ein widerspenstiges Haus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Dach deines Mundes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Du wirst ihnen nicht zu einem Mann, der zurechtweist.“ Möglich auch: „der sie tadelt“.'
    reason: lexical_alternative
  - marker: c
    text: „Widerspenstiges Haus“ ist bei Hesekiel eine häufige Bezeichnung für das Volk als Gemeinschaft, die sich gegen Gott auflehnt.
    reason: cultural_note
lexical_decisions:
- source_word: אַדְבִּיק
  choice: werde … haften lassen
  rationale: 'Der Hifil von דבק ist kausativ: Gott bewirkt, dass Hesekiels Zunge am Gaumen haftet. „Haften lassen“ bewahrt diese Verursachung in natürlichem Deutsch.'
- source_word: לְשׁוֹנְךָ
  choice: deine Zunge
  rationale: Das konkrete körperliche Bild wird wörtlich erhalten, da es für die auferlegte Sprachlosigkeit wesentlich ist.
- source_word: אֶל חִכֶּךָ
  choice: an deinem Gaumen
  rationale: חֵךְ bezeichnet den Gaumen beziehungsweise das Dach des Mundes. „Gaumen“ ist die knappe, geläufige deutsche Entsprechung.
- source_word: נֶאֱלַמְתָּ
  choice: du wirst stumm sein
  rationale: Der Nifal beschreibt den Zustand, nicht sprechen zu können beziehungsweise zum Schweigen gebracht zu sein. Die Wiedergabe erhält das Ergebnis und passt zum körperlichen Bild.
- source_word: לֹא תִהְיֶה לָהֶם
  choice: ihnen nicht als … gelten
  rationale: Die relationale Konstruktion „ihnen nicht zu einem … sein“ wird in verständliches Deutsch übertragen, ohne die Funktion des Propheten weiter auszudeuten.
- source_word: לְאִישׁ מוֹכִיחַ
  choice: als einer, der sie zurechtweist
  rationale: אִישׁ bezeichnet hier konkret Hesekiel; im Deutschen ist „einer“ natürlicher als „ein Mann“. Das Partizip מוֹכִיחַ bezeichnet jemanden, der tadelt, zurechtweist oder zur Rechenschaft zieht.
- source_word: בֵּית מְרִי
  choice: ein widerspenstiges Haus
  rationale: Die für Hesekiel charakteristische korporative Bezeichnung „Haus“ bleibt erhalten. „Widerspenstig“ gibt die hartnäckige Auflehnung von מְרִי idiomatisch wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die auferlegte Sprachlosigkeit ein.
theological_decisions:
- issue: Art von Hesekiels Sprachlosigkeit
  choice: Eine von Gott auferlegte Sprachlosigkeit, ausgedrückt durch ein konkretes körperliches Bild.
  alternative: Eine ausschließlich bildliche Einschränkung seiner Wirksamkeit oder Überzeugungskraft.
  rationale: Zunge und Gaumen sprechen für eine reale göttliche Beschränkung des Redens; die Übersetzung bewahrt das Bild, ohne über den Wortlaut dieses Verses hinauszugehen.
- issue: Bedeutung von בֵּית מְרִי
  choice: „ein widerspenstiges Haus“ als korporative Bezeichnung des Volkes.
  alternative: „ein rebellisches Volk“.
  rationale: „Haus“ erhält Hesekiels wiederkehrende Ausdrucksweise und vermeidet eine interpretierende Einebnung.
- issue: Wiedergabe von לְאִישׁ
  choice: „als einer“ mit Bezug auf den männlichen Propheten Hesekiel.
  alternative: „als ein Mann“ oder „als jemand“.
  rationale: Der konkrete Personenbezug bleibt erhalten; zugleich klingt „als einer, der …“ im modernen Deutsch natürlicher als die streng formale Wiedergabe „als ein Mann, der …“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Bild und der für Hesekiel typischen Wendung „widerspenstiges Haus“. Die hebräische Satzstruktur wird dort geglättet, wo eine wörtliche Wiedergabe im Deutschen unnatürlich wäre.
