  text: וְ/אַתָּה֙ כִּֽי הִזְהַ֣רְתָּ רָשָׁ֔ע וְ/לֹא שָׁב֙ מֵֽ/רִשְׁע֔/וֹ וּ/מִ/דַּרְכּ֖/וֹ הָ/רְשָׁעָ֑ה ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/019.yaml
  text: But if you warn a wicked man and he does not turn from his wickedness or from his wicked way[a], he will die in his iniquity[b], but you will have delivered your life.
translation:
  language: de
  text: Wenn du aber den Gottlosen warnst und er nicht von seiner Gottlosigkeit und von seinem gottlosen Weg umkehrt, wird er in seiner Schuld sterben; du aber hast dein Leben gerettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „du hast deine Seele gerettet“; sinngemäß: „du hast dich selbst gerettet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: warnst
  rationale: Das Hifil von זהר bedeutet hier im Zusammenhang des Wächterauftrags, jemanden zu warnen.
- source_word: רָשָׁע
  choice: den Gottlosen
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet einen Menschen, der als gottlos beziehungsweise schuldig charakterisiert wird; „der Gottlose“ ist eine knappe, im biblischen Kontext verständliche Wiedergabe.
- source_word: שָׁב
  choice: umkehrt
  rationale: שׁוב bezeichnet grundlegend das Umkehren oder Zurückkehren. „Umkehrt“ bewahrt das hebräische Bild und bringt hier zugleich die ethische Bedeutung natürlich zum Ausdruck.
- source_word: מֵרִשְׁעוֹ
  choice: von seiner Gottlosigkeit
  rationale: רֶשַׁע bezeichnet gottloses, schuldhaftes Verhalten. „Gottlosigkeit“ wahrt die Verbindung zum zuvor genannten „Gottlosen“.
- source_word: וּמִדַּרְכּוֹ הָרְשָׁעָה
  choice: und seinem gottlosen Weg
  rationale: דֶּרֶךְ ist hier das Bild für Lebensführung oder Verhalten. Die koordinierende hebräische Konjunktion wird formal als „und“ wiedergegeben, ohne die beiden Wendungen als getrennte Voraussetzungen auszulegen.
- source_word: בַּעֲוֺנוֹ
  choice: wegen seiner Schuld
  rationale: עָוֹן kann Schuld, Vergehen und deren Folgen bezeichnen. Mit ב kann die Wendung den Grund beziehungsweise den schuldhaften Zustand des Sterbens ausdrücken; „wegen seiner Schuld“ ist im heutigen Deutsch klar, ohne die Art des Todes weiter festzulegen.
- source_word: הִצַּלְתָּ אֶת־נַפְשְׁךָ
  choice: du hast dein Leben gerettet
  rationale: נֶפֶשׁ bezeichnet hier die eigene Person beziehungsweise das Leben. Das deutsche Perfekt gibt das hebräische Perfekt direkt und im Kontext folgerichtig wieder, ohne eine Aussage über die ewige Errettung einzutragen.
theological_decisions:
- issue: Ob der Tod des Gottlosen ewige Verdammnis oder einen zeitlichen gerichtlichen Tod bezeichnet
  choice: 'Die Aussage bleibt allgemein: Er wird wegen seiner Schuld sterben.'
  alternative: 'Er stirbt in seiner Schuld; oder ausdrücklich: Er wird für seine Sünde den zeitlichen Tod erleiden.'
  rationale: Der hebräische Text verbindet Tod und Schuld, bestimmt aber Reichweite und Art dieses Todes nicht näher. Die Übersetzung vermeidet daher eine dogmatische Festlegung.
- issue: Bedeutung von נַפְשְׁךָ
  choice: dein Leben
  alternative: deine Seele; dich selbst
  rationale: „Leben“ gibt den kontextuellen Sinn der eigenen Person und ihrer Bewahrung klar wieder. „Seele“ könnte im heutigen Deutsch eine vom Körper getrennte, immaterielle Größe nahelegen, die hier nicht eigens ausgesagt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wegmetapher und die Aufforderung zur Umkehr bleiben erhalten. „Gottlos“ wahrt die enge lexikalische Verbindung zwischen רָשָׁע, רֶשַׁע und הָרְשָׁעָה; „Schuld“ gibt עָוֹן idiomatisch wieder. Der Fußnotenmarker steht unmittelbar bei der davon erläuterten Aussage.
