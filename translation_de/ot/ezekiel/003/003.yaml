source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ בִּטְנְ/ךָ֤ תַֽאֲכֵל֙ וּ/מֵעֶ֣י/ךָ תְמַלֵּ֔א אֵ֚ת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן אֵלֶ֑י/ךָ וָ/אֹ֣כְלָ֔/ה וַ/תְּהִ֥י בְּ/פִ֖/י כִּ/דְבַ֥שׁ לְ/מָתֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/003.yaml
  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
translation:
  language: de
  text: 'Und er sagte zu mir: „Menschensohn[a], gib deinem Bauch zu essen und fülle dein Inneres mit dieser Schriftrolle, die ich dir gebe.“ Da aß ich sie, und in meinem Mund war sie süß wie Honig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Menschenkind“, „Sterblicher“. Die hebräische Anrede „Sohn des Menschen“ wird hier in ihrer eingebürgerten Form „Menschensohn“ beibehalten; so wird Ezechiel im Buch wiederholt angesprochen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Bewahrt die für Ezechiel charakteristische hebräische Anrede und ihre konkrete Aussage über seine menschliche Begrenztheit. Die geläufige Zusammenschreibung entspricht modernem deutschen Bibelstil.
- source_word: בִּטְנְךָ תַאֲכֵל
  choice: gib deinem Bauch zu essen
  rationale: Gibt die kausative Form von אכל wieder und erhält zugleich das auffällige, konkrete Körperbild des Hebräischen.
- source_word: וּמֵעֶיךָ תְמַלֵּא
  choice: und fülle dein Inneres
  rationale: „Dein Inneres“ bezeichnet die inneren Körperteile natürlich und würdevoll, ohne die körperliche Bildsprache zu verflachen.
- source_word: הַמְּגִלָּה
  choice: Schriftrolle
  rationale: Bezeichnet eindeutig eine beschriebene Rolle und ist im modernen Deutschen verständlicher und genauer als bloß „Rolle“.
- source_word: אֲנִי נֹתֵן אֵלֶיךָ
  choice: die ich dir gebe
  rationale: Die präsentische Wiedergabe des Partizips passt zur unmittelbar vollzogenen Übergabe der Schriftrolle.
- source_word: וָאֹכְלָה
  choice: Da aß ich sie
  rationale: „Da“ führt die Erzählung folgerichtig weiter; das feminine Pronomen nimmt die Schriftrolle natürlich wieder auf.
- source_word: וַתְּהִי בְּפִי כִּדְבַשׁ לְמָתוֹק
  choice: und in meinem Mund war sie süß wie Honig
  rationale: Bewahrt den Ort der Geschmackserfahrung und gibt die hebräische Wendung „wie Honig zur Süße“ idiomatisch und vollständig wieder.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: „Menschensohn“ hält die wiederkehrende Anrede Ezechiels sichtbar und bleibt eng am hebräischen Idiom. Gemeint ist hier zunächst Ezechiel als Mensch in seiner Begrenztheit; christologische Bezüge aus anderen Kontexten werden weder eingetragen noch ausgeschlossen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die ungewöhnlich körperliche Ausdrucksweise des Hebräischen wird bewusst bewahrt; „Inneres“ vermeidet sowohl klinische als auch altertümlich missverständliche Formulierungen.
