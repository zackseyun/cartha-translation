  terminology: »der Gottlose«, »gottloser Weg«, »Schuld« und »sein Blut ... von deiner Hand fordern« sind tragfähige, konsistente Wiedergaben. Die Fußnoten erläutern die einschlägigen Alternativen und die Rechtsmetapher sachgerecht. Die Formulierung zu Leben und Sterben legt keine dogmatische oder ausschließlich körperliche Deutung fest.
