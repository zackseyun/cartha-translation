source:
  edition: WLC
  text: בְּ/אָמְרִ֤/י לָֽ/רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א הִזְהַרְתּ֗/וֹ וְ/לֹ֥א דִבַּ֛רְתָּ לְ/הַזְהִ֥יר רָשָׁ֛ע מִ/דַּרְכּ֥/וֹ הָ/רְשָׁעָ֖ה לְ/חַיֹּת֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/018.yaml
  text: When I say to the wicked man[a], ‘You shall surely die,’ and you do not warn him, and you do not speak to warn the wicked man from his wicked way so that he may live, that wicked man shall die in his iniquity[b], but I will require his blood from your hand.
translation:
  language: de
  text: 'Wenn ich zu dem Gottlosen sage: »Du wirst gewiss sterben!«, und du ihn nicht warnst und nicht sprichst, um den Gottlosen vor seinem gottlosen Weg zu warnen, damit er am Leben bleibt, dann wird dieser Gottlose wegen seiner Schuld[a] sterben; sein Blut aber werde ich von deiner Hand fordern.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in seiner Schuld«; möglich ist auch: »für seine Schuld« oder »aufgrund seiner Sünde«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das ist eine gerichtliche Wendung und bedeutet: »Ich werde dich für sein Blut zur Rechenschaft ziehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Wenn ich … sage
  rationale: Die Konstruktion mit ב und dem Infinitiv führt hier einen temporalen Nebensatz ein; die deutsche Wendung ist natürlich und bewahrt diesen zeitlichen Bezug.
- source_word: לָרָשָׁע / רָשָׁע
  choice: zu dem Gottlosen / den Gottlosen / dieser Gottlose
  rationale: רָשָׁע bezeichnet hier einen einzelnen schuldigen bzw. gottlosen Menschen. Die substantivierte Form »der Gottlose« wahrt Numerus und Genus sowie die auffällige Wiederholung des Wortstamms.
- source_word: מוֹת תָּמוּת
  choice: Du musst sterben!
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die sichere, feierliche Todesankündigung. »Du musst sterben« gibt diese Gewissheit in gegenwärtigem, natürlichem Deutsch wieder.
- source_word: הִזְהַרְתּוֹ
  choice: ihn warnst
  rationale: Der Hifil von זהר bezeichnet in diesem Zusammenhang das Erteilen einer Warnung.
- source_word: וְלֹא דִבַּרְתָּ לְהַזְהִיר
  choice: und nicht redest, um … zu warnen
  rationale: Die Wiedergabe erhält sowohl das Verb »reden« als auch die durch לְ eingeleitete Zweckbeziehung.
- source_word: מִדַּרְכּוֹ הָרְשָׁעָה
  choice: vor seinem gottlosen Weg
  rationale: »Weg« bewahrt das hebräische Bild für Lebensführung; »gottlos« stellt den Zusammenhang mit dem wiederholten Wortstamm רשע her. Nach »warnen« entspricht deutsches »vor« funktional dem hebräischen מִן, dessen Sinn hier die Abkehr von diesem Weg einschließt.
- source_word: לְחַיֹּתוֹ
  choice: damit er am Leben bleibt
  rationale: Der Infinitiv bezeichnet Zweck bzw. beabsichtigte Folge. Die Formulierung lässt wie der Ausgangstext offen, welche Dimensionen von Leben gemeint sind.
- source_word: בַּעֲוֹנוֹ
  choice: wegen seiner Schuld
  rationale: עָוֹן kann Schuld und Vergehen samt dessen Folgen bezeichnen; בְּ lässt hier Umstand oder Grund zu. Die Hauptfassung gibt den kausalen Sinn natürlich wieder, während die Fußnote die formnähere Alternative bewahrt.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: sein Blut aber werde ich von deiner Hand fordern
  rationale: Die Übersetzung erhält das konkrete Blutbild und die gerichtliche Verantwortungsformel des Hebräischen; die deutsche Wortstellung hebt den Gegensatz hervor.
theological_decisions:
- issue: Bedeutung von Sterben und Leben
  choice: Die Begriffe werden ohne nähere Festlegung als »sterben« und »am Leben bleiben« wiedergegeben.
  alternative: Die Aussage ausschließlich auf körperlichen Tod oder ausschließlich auf geistlichen Tod beziehen.
  rationale: Der hebräische Text bestimmt die Reichweite hier nicht ausdrücklich. Die Übersetzung bewahrt daher die mögliche körperliche, geistliche und bundesgerichtliche Spannung.
- issue: Verantwortung des Wächters für das Blut
  choice: Das gerichtliche Bild »sein Blut … von deiner Hand fordern« bleibt im Haupttext erhalten.
  alternative: 'Explizit paraphrasieren: »Dich werde ich für seinen Tod zur Rechenschaft ziehen.«'
  rationale: Die bildhafte Rechtsformel spricht von Verantwortlichkeit, ohne die eigene Schuld des Gottlosen aufzuheben. Eine Paraphrase würde die Metapher beseitigen.
- issue: Geschlecht und Individualität von רָשָׁע
  choice: »der Gottlose« im grammatisch männlichen Singular
  alternative: »der gottlose Mensch« oder »die gottlose Person«
  rationale: Der Vers entwirft einen einzelnen, männlich formulierten Fall. Die substantivierte maskuline Form bildet dies knapp und genau ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetisch-gerichtlicher Eindringlichkeit. Die Wiederholung von »Gottlose/gottlosen« und das Rechtsbild vom Blut werden bewusst nicht geglättet. Alle Fußnotenmarker stehen an der jeweils erläuterten Stelle im Haupttext.
