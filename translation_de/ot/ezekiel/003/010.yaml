source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֕ם אֶת כָּל דְּבָרַ/י֙ אֲשֶׁ֣ר אֲדַבֵּ֣ר אֵלֶ֔י/ךָ קַ֥ח בִּֽ/לְבָבְ/ךָ֖ וּ/בְ/אָזְנֶ֥י/ךָ שְׁמָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/010.yaml
  text: Then he said to me[a], “Son of man, receive in your heart all my words that I speak to you, and hear with your ears.”
translation:
  language: de
  text: 'Dann sagte er zu mir: »Menschensohn, nimm alle meine Worte, die ich zu dir reden werde, in dein Herz auf und höre sie mit deinen Ohren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die feste Anrede in Ezechiel wird in ihrer konkreten hebräischen Form bewahrt, ohne sie durch eine Deutung wie »Sterblicher« einzuengen.
- source_word: אֶת כָּל דְּבָרַי
  choice: alle meine Worte
  rationale: Die konkrete Betonung der göttlichen Worte bleibt erhalten.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: die ich zu dir reden werde
  rationale: Das hebräische Imperfekt kann hier auf Gottes noch folgende Rede weisen; die Zukunftsform passt zum unmittelbaren Kontext der Beauftragung.
- source_word: קַח בִּלְבָבְךָ
  choice: nimm … in dein Herz auf
  rationale: »Nimm … auf« gibt das wörtliche »Nimm« idiomatisch wieder und bewahrt zugleich die Vorstellung innerer Aufnahme.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: und höre sie mit deinen Ohren
  rationale: Die körperlich-konkrete und nachdrückliche Formulierung des Hebräischen bleibt bestehen; das ergänzte Pronomen stellt im Deutschen den Bezug auf die Worte klar.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Anrede בֶּן אָדָם
  choice: Menschensohn
  alternative: Sterblicher; Menschenkind
  rationale: »Menschensohn« erhält Ezechiels wiederkehrende Anredeformel und legt weder bloße Sterblichkeit noch eine spätere christologische Deutung in den Text hinein.
- issue: Zeitbezug von אֲדַבֵּר
  choice: die ich zu dir reden werde
  alternative: die ich zu dir rede
  rationale: Beide Wiedergaben sind grammatisch möglich. Im Kontext der bevorstehenden Sendung und Verkündigung liegt die zukunftsbezogene Lesart nahe, ohne auszuschließen, dass Gottes Reden bereits eingesetzt hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst konkrete Rede von Herz und Ohren sowie die Ezechiel-typische Anrede »Menschensohn« werden bewahrt.
