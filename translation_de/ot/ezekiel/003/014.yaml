  text: וְ/ר֥וּחַ נְשָׂאַ֖תְ/נִי וַ/תִּקָּחֵ֑/נִי וָ/אֵלֵ֥ךְ מַר֙ בַּ/חֲמַ֣ת רוּחִ֔/י וְ/יַד יְהוָ֥ה עָלַ֖/י חָזָֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/014.yaml
  text: And the Spirit lifted me up and took me away[a], and I went in bitterness, in the heat of my spirit[b], while the hand of Yahweh was strong upon me.
translation:
  language: de
  text: Da hob mich der Geist empor und nahm mich fort[a]. Ich ging in Bitterkeit, in der Glut meines Geistes[b], während die Hand Jahwes stark auf mir lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Ein Geist hob mich empor und nahm mich fort«; das hebräische Wort kann außerdem »Wind« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Die Wendung »in der Glut meines Geistes« kann auch im Sinn von »im Zorn meines Geistes« oder »in der Wut meines Geistes« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: der Geist
  rationale: רוּחַ kann »Geist«, »Wind« oder »Atem« bedeuten. Im Zusammenhang der visionären Fortbewegung ist Gottes Geist am wahrscheinlichsten; die echte Mehrdeutigkeit bleibt in Fußnote [a] erhalten.
- source_word: נְשָׂאַתְנִי
  choice: hob mich empor
  rationale: נשׂא bezeichnet ein Heben oder Tragen. Die Wiedergabe bewahrt das konkrete Bild und passt zur visionären Bewegung.
- source_word: וַתִּקָּחֵנִי
  choice: nahm mich fort
  rationale: לקח bedeutet grundsätzlich »nehmen«. »Nahm mich fort« gibt hier die aus dem Zusammenhang erkennbare Ortsveränderung wieder, ohne das Verb unnötig als gewaltsames Ergreifen festzulegen.
- source_word: וָאֵלֵךְ
  choice: ich ging … dahin
  rationale: הלך ist das gewöhnliche Verb für »gehen«. »Dahingehen« klingt im Deutschen in dieser Erzählfolge natürlich.
- source_word: מַר
  choice: verbittert
  rationale: Das Adjektiv wird hier adverbial gebraucht und beschreibt Ezechiels innere Verfassung. »Verbittert« ist knapp, verständlich und wahrt den Bezug zur Bitterkeit.
- source_word: בַּחֲמַת
  choice: in der Glut
  rationale: חֵמָה kann Hitze, Glut, Zorn oder Wut bezeichnen. »Glut« erhält die hebräische Metapher und legt die heftige innere Regung nicht vorschnell ausschließlich als Zorn fest.
- source_word: רוּחִי
  choice: meines Geistes
  rationale: Die wörtliche Wiedergabe bewahrt die Wiederholung von רוּחַ und damit die Spannung zwischen dem anfangs genannten Geist und Ezechiels eigenem Geist.
- source_word: וְיַד יְהוָה עָלַי חָזָקָה
  choice: während die Hand Jahwes stark auf mir lag
  rationale: Das feste prophetische Bild von der »Hand Jahwes« bleibt erhalten. »Stark auf mir lag« gibt die machtvolle, möglicherweise zwingende Wirkung wieder, ohne sie auszudeuten.
theological_decisions:
- issue: Bezug des ersten רוּחַ
  choice: Gottes Geist, im Haupttext als »der Geist«
  alternative: »ein Geist« oder »der Wind«
  rationale: Der visionäre Zusammenhang spricht am ehesten für Gottes Geist. Da das hebräische Wort selbst mehrere Deutungen zulässt, werden die anderen Möglichkeiten in Fußnote [a] ausdrücklich genannt.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: »der HERR« oder »Jehova«
  rationale: Der Gottesname steht im hebräischen Text ausdrücklich. »Jahwe« gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der inneren Erregung Ezechiels
  choice: »in der Glut meines Geistes«
  alternative: »im Zorn meines Geistes« oder »in der Wut meines Geistes«
  rationale: Die Formulierung wahrt die bildhafte und emotionale Offenheit von חֵמָה, statt eindeutig festzulegen, ob Zorn, Wut oder allgemein heftige innere Erregung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, wird aber durch »Da«, »dahin« und »während« natürlich verbunden. Die Bilder »Glut meines Geistes« und »Hand Jahwes« werden bewusst nicht paraphrasiert.
