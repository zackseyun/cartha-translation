source:
  edition: WLC
  text: בֶּן אָדָ֕ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אוֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/017.yaml
  text: Son of man[a], I have made you a watchman for the house of Israel[b]; and you shall hear a word from my mouth and warn them from me.
translation:
  language: de
  text: Menschensohn[a], ich habe dich zum Wächter für das Haus Israel eingesetzt. Du sollst ein Wort aus meinem Mund hören und sie in meinem Auftrag warnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Sohn des Menschen“; auch „Menschenkind“ oder „Sterblicher“. Im Buch Ezechiel ist dies die wiederkehrende Anrede Gottes an den Propheten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher am Schluss: „und sie von mir her warnen“.'
    reason: formal_alternative
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Menschensohn
  rationale: Die direkte Wiedergabe bewahrt die wiederkehrende hebräische Anrede an Ezechiel. Eine Fußnote weist darauf hin, dass hier seine menschliche und sterbliche Stellung bezeichnet wird und nicht ohne Weiteres ein späterer Titel gemeint ist.
- source_word: צֹפֶה
  choice: Wächter
  rationale: Das Wort bezeichnet jemanden, der Ausschau hält und bei Gefahr warnt. „Wächter“ bewahrt beide Aspekte und ist im Deutschen natürlich.
- source_word: נְתַתִּיךָ
  choice: ich habe dich … eingesetzt
  rationale: Das Verb bedeutet wörtlich „ich habe dich gegeben/hingestellt“; zusammen mit der Aufgabe als Wächter gibt „eingesetzt“ die resultative Beauftragung idiomatisch wieder.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: Die Präposition bezeichnet hier den Bereich beziehungsweise die Gemeinschaft, für die Ezechiel als Wächter bestellt ist. „Haus Israel“ erhält die kollektive biblische Bezeichnung.
- source_word: וְשָׁמַעְתָּ
  choice: Du sollst … hören
  rationale: Die koordinierte Verbfolge wird als verpflichtende Zukunft innerhalb des Auftrags wiedergegeben, ohne eine nicht ausdrücklich markierte Bedingung einzuführen.
- source_word: מִפִּי דָּבָר
  choice: ein Wort aus meinem Mund
  rationale: Die konkrete hebräische Redeweise bleibt erhalten und betont, dass die Botschaft unmittelbar von Gott stammt.
- source_word: וְהִזְהַרְתָּ אוֹתָם
  choice: und sie … warnen
  rationale: Der Hifil-Stamm bezeichnet das Warnen; das Pronomen bezieht sich auf das Haus Israel als Gemeinschaft.
- source_word: מִמֶּנִּי
  choice: in meinem Auftrag
  rationale: Die Formulierung vermittelt natürlich, dass Gott Quelle und Urheber der durch Ezechiel ausgesprochenen Warnung ist. Die formalere Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung der Anrede בֶּן־אָדָם
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher; Mensch
  rationale: Die traditionelle, formnahe Wiedergabe bewahrt die markante und wiederkehrende Anrede im Ezechielbuch. Die Fußnote verhindert, dass der Ausdruck vorschnell ausschließlich als späterer christologischer Titel verstanden wird.
- issue: Verhältnis der beiden Auftragsverben
  choice: Du sollst … hören und … warnen
  alternative: Wenn du … hörst, sollst du … warnen
  rationale: Die koordinierte Fassung folgt der hebräischen Verbindung mit וְ enger und bewahrt die formale Offenheit. Der sachliche zeitliche Zusammenhang ergibt sich dennoch aus der Reihenfolge.
- issue: Quelle beziehungsweise Beauftragung der Warnung in מִמֶּנִּי
  choice: in meinem Auftrag
  alternative: von mir her
  rationale: „In meinem Auftrag“ drückt im heutigen Deutsch klar aus, dass Ezechiel Gottes Warnung übermittelt, ohne eine zusätzliche Lehrbestimmung einzutragen. Die Fußnote bewahrt die formale Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt klar und direkt; „Menschensohn“, „Wächter“, „Haus Israel“ und „aus meinem Mund“ bewahren zentrale Bilder und Ausdrucksformen des Hebräischen. Die modale Fassung „Du sollst“ bringt den verpflichtenden Charakter des prophetischen Auftrags natürlich zum Ausdruck.
