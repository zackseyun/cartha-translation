source:
  edition: WLC
  text: וָ/אָקוּם֮ וָ/אֵצֵ֣א אֶל הַ/בִּקְעָה֒ וְ/הִנֵּה שָׁ֤ם כְּבוֹד יְהוָה֙ עֹמֵ֔ד כַּ/כָּב֕וֹד אֲשֶׁ֥ר רָאִ֖יתִי עַל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל עַל פָּנָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/023.yaml
  text: So I arose and went out to the valley[a], and behold, the glory of Yahweh was standing there, like the glory that I had seen by the Kebar River; and I fell on my face.
translation:
  language: de
  text: 'Da stand ich auf und ging hinaus in die Talebene[a]. Und sieh: Dort stand die Herrlichkeit Jahwes, wie die Herrlichkeit, die ich am Fluss Kebar gesehen hatte. Da fiel ich auf mein Gesicht nieder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in die Ebene. Das hebräische Wort bezeichnet eine breite Ebene oder Senke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם וָאֵצֵא
  choice: Da stand ich auf und ging hinaus
  rationale: Die beiden Wayyiqtol-Formen führen die Erzählung in zeitlicher Folge weiter. „Da“ gibt diese Folge in natürlichem modernem Deutsch wieder.
- source_word: הַבִּקְעָה
  choice: die Talebene
  rationale: בִּקְעָה bezeichnet eine breite Ebene oder Senke zwischen Erhebungen. „Talebene“ bewahrt beide räumlichen Aspekte; „Ebene“ bleibt als mögliche Wiedergabe in der Fußnote genannt.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: הִנֵּה lenkt die Aufmerksamkeit unmittelbar auf den überraschenden Anblick. „Und sieh“ ist lebendig und würdevoll, ohne das heute altertümlich wirkende „siehe“ vorauszusetzen.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die wahrnehmbare herrliche Gegenwart Gottes; die Genitivfügung wahrt die Struktur und theologische Dichte des Hebräischen.
- source_word: עֹמֵד
  choice: stand
  rationale: Das Partizip beschreibt den angetroffenen Zustand. Das deutsche Präteritum „stand“ stellt die Szene idiomatisch dar, ohne eine unnatürliche Verlaufsform zu erzwingen.
- source_word: כַּכָּבוֹד אֲשֶׁר רָאִיתִי
  choice: wie die Herrlichkeit, die ich … gesehen hatte
  rationale: כְּ markiert den Vergleich; das Plusquamperfekt verdeutlicht natürlich, dass die frühere Vision vor dem jetzigen Geschehen lag.
- source_word: עַל נְהַר כְּבָר
  choice: am Fluss Kebar
  rationale: עַל bezeichnet hier die Lage beim Gewässer. „Am Fluss Kebar“ ist im Deutschen idiomatisch und gibt נְהַר ausdrücklich wieder.
- source_word: וָאֶפֹּל עַל פָּנָי
  choice: Da fiel ich auf mein Gesicht nieder
  rationale: Die Formulierung bewahrt das konkrete Bild der Niederwerfung und gibt mit „niederfallen“ zugleich die ehrfürchtige Handlung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  alternative: Jahwes herrliche Gegenwart
  rationale: „Herrlichkeit Jahwes“ bewahrt den geprägten biblischen Ausdruck und lässt offen, wie genau sich diese Herrlichkeit sichtbar manifestierte, statt die Deutung im Text auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Und sieh“ erhält die aufmerksamkeitslenkende Kraft von הִנֵּה; „Talebene“ vermeidet eine unnötige Festlegung auf entweder Tal oder Ebene.
