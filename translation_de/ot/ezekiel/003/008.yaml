source:
  edition: WLC
  text: הִנֵּ֨ה נָתַ֧תִּי אֶת פָּנֶ֛י/ךָ חֲזָקִ֖ים לְ/עֻמַּ֣ת פְּנֵי/הֶ֑ם וְ/אֶֽת מִצְחֲ/ךָ֥ חָזָ֖ק לְ/עֻמַּ֥ת מִצְחָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/008.yaml
  text: Behold[a], I have made your face strong against their faces, and your forehead strong against their foreheads.
translation:
  language: de
  text: Sieh[a], ich habe dein Gesicht hart gemacht gegen ihre Gesichter und deine Stirn hart gegen ihre Stirnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei „hart“ kann auch „fest“ oder „stark“ gemeint sein; das hebräische Wort bezeichnet hier Festigkeit beziehungsweise Härte angesichts von Widerstand.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Leitet die nachdrückliche göttliche Erklärung ein und bewahrt den aufmerksamkeitslenkenden Charakter in natürlichem, würdigem Deutsch.
- source_word: נָתַתִּי
  choice: ich habe … gemacht
  rationale: Das Verb bedeutet wörtlich „ich habe gegeben“, bezeichnet in dieser Verbindung mit Körperteilen und Adjektiven jedoch, dass Gott ihnen eine bestimmte Beschaffenheit verleiht.
- source_word: פָּנֶיךָ
  choice: dein Gesicht
  rationale: Das hebräische Wort steht der Form nach im Plural, bezeichnet bei einer Einzelperson aber gewöhnlich das Gesicht. „Gesicht“ ist moderner und allgemein verständlicher als „Angesicht“.
- source_word: חֲזָקִים / חָזָק
  choice: hart
  rationale: Das Adjektiv kann Stärke, Festigkeit oder Härte bezeichnen. „Hart“ erhält hier das konkrete Bild und den Zusammenhang mit dem Widerstand des Volkes; die mögliche Wiedergabe „fest“ wird in der Fußnote genannt.
- source_word: לְעֻמַּת
  choice: gegen
  rationale: Die Präposition beschreibt ein Gegenüberstehen und hat im Zusammenhang der Konfrontation eine adversative Kraft.
- source_word: פְּנֵיהֶם
  choice: ihre Gesichter
  rationale: Der Plural bezieht sich auf die Menschen, denen Ezechiel gegenübertritt, und bewahrt die konkrete Bildsprache.
- source_word: מִצְחֲךָ
  choice: deine Stirn
  rationale: Die konkrete anatomische Bezeichnung erhält das Bild sichtbarer, widerstandsfähiger Entschlossenheit.
- source_word: מִצְחָם
  choice: ihre Stirnen
  rationale: Der Plural entspricht den mehreren Gegnern und bewahrt den Parallelismus des hebräischen Satzes.
theological_decisions:
- issue: Bildhafte Aussage über das von Gott verhärtete Gesicht und die Stirn
  choice: Die konkrete Körperbildsprache bleibt erhalten und bezeichnet von Gott verliehene Widerstandskraft in der prophetischen Konfrontation.
  alternative: 'Abstrakt paraphrasieren: „Ich habe dich ebenso unbeugsam gemacht wie sie.“'
  rationale: Der hebräische Text nennt ausdrücklich Gesicht und Stirn. Die Beibehaltung dieser Bilder bewahrt die literarische Spannung mit der Härte des widerspenstigen Volkes, ohne Ezechiel ausdrücklich sündhafte Halsstarrigkeit zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gesicht“ wird gegenüber dem altertümlicheren „Angesicht“ bevorzugt; die Wiederholung von „hart“ sowie der Parallelismus von Gesicht und Stirn werden bewusst bewahrt.
