  text: So I opened my mouth[a], and he fed me this scroll.
translation:
  language: de
  text: Da öffnete ich meinen Mund, und er gab mir diese Schriftrolle zu essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶפְתַּח
  choice: Da öffnete ich
  rationale: Das Qal-Wayyiqtol von פתח führt die Handlung fort. „Da“ gibt die zeitlich-folgernde Erzählbewegung im modernen Deutschen natürlich wieder.
- source_word: אֶת־פִּי
  choice: meinen Mund
  rationale: Die direkte Objektmarkierung אֶת wird im Deutschen nicht eigens wiedergegeben; פִּי bedeutet schlicht „meinen Mund“.
- source_word: וַיַּאֲכִלֵנִי
  choice: und er gab mir … zu essen
  rationale: Die Hifil-Form von אכל mit Suffix der 1. Person Singular bedeutet wörtlich „er ließ/machte mich essen“. Die gewählte Formulierung bewahrt den kausativen Sinn und klingt im Deutschen natürlich, ohne den möglichen Zwang von „er zwang mich“ einzutragen.
- source_word: אֵת הַמְּגִלָּה הַזֹּאת
  choice: diese Schriftrolle
  rationale: מְגִלָּה bezeichnet eine Rolle, besonders eine Schriftrolle. Der Demonstrativ הַזֹּאת wird attributiv mit „diese“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Erzählprosa. Die Satzfolge und der kausative Gehalt des Hebräischen bleiben erhalten; eine Fußnote ist nicht nötig, weil „zu essen geben“ die Form bereits transparent wiedergibt.
