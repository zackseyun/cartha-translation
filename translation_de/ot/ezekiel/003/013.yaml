  text: and the sound of the wings of the living creatures touching one another[a], and the sound of the wheels beside them[c][b], and the sound of a great rumbling.
translation:
  language: de
  text: und das Geräusch der Flügel der Lebewesen, die einander berührten,[a] und das Geräusch der Räder neben ihnen,[b] und das Geräusch eines gewaltigen Dröhnens.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine an ihre Schwester“; eine hebräische Wendung für „eine an die andere“, hier auf die Flügel bezogen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihnen gegenüber“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eines gewaltigen Getöses“ beziehungsweise „eines gewaltigen Rasselns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹל
  choice: und das Geräusch
  rationale: קוֹל bezeichnet hier dreimal ein hörbares Geräusch, nicht eine sprechende Stimme. Die Wiederholung bildet die hebräische Satzstruktur und die akustische Steigerung ab.
- source_word: כַּנְפֵי הַחַיּוֹת
  choice: der Flügel der Lebewesen
  rationale: Die Constructusverbindung bezeichnet eindeutig die Flügel der visionären Lebewesen; „Lebewesen“ ist natürlich und legt ihre genauere Identität nicht fest.
- source_word: מַשִּׁיקוֹת אִשָּׁה אֶל אֲחוֹתָהּ
  choice: die einander berührten
  rationale: מַשִּׁיקוֹת bezeichnet hier ein Berühren oder Aneinanderstoßen. Die wörtliche Wendung „eine zu ihrer Schwester“ ist eine wechselseitige Zuordnungsformel und wird im Deutschen idiomatisch mit „einander“ wiedergegeben.
- source_word: הָאוֹפַנִּים
  choice: die Räder
  rationale: Im Zusammenhang der Thronvision bezeichnet אוֹפַנִּים die den Lebewesen zugeordneten Räder.
- source_word: לְעֻמָּתָם
  choice: neben ihnen
  rationale: Die Präposition beschreibt die räumliche Zuordnung der Räder zu den Lebewesen. „Neben ihnen“ ist im Kontext gut verständlich; „ihnen gegenüber“ bleibt ebenfalls möglich.
- source_word: רַעַשׁ גָּדוֹל
  choice: ein gewaltiges Dröhnen
  rationale: רַעַשׁ kann Erschütterung, Getöse oder dröhnenden Lärm bezeichnen. Im akustischen Kontext vermittelt „gewaltiges Dröhnen“ die Wucht, ohne ausdrücklich ein Erdbeben anzunehmen.
