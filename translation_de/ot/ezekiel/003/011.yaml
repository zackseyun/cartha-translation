source:
  edition: WLC
  text: וְ/לֵ֨ךְ בֹּ֤א אֶל הַ/גּוֹלָה֙ אֶל בְּנֵ֣י עַמֶּ֔/ךָ וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/011.yaml
  text: And go[a], come to the exiles, to the sons of your people, and speak to them and say to them[b], ‘Thus says the Lord GOD,’ whether they hear or whether they refuse.
translation:
  language: de
  text: 'Und geh hin zu den Verschleppten, zu den Söhnen deines Volkes[a], und rede zu ihnen. Sag zu ihnen: »So spricht der Herr, Yahweh: ob sie hören oder sich weigern[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen deines Volkes«; die hebräische Verwandtschaftsbezeichnung kann hier die Angehörigen des Volkes insgesamt meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »ob sie hören oder davon ablassen« beziehungsweise »es unterlassen«; im Zusammenhang bezeichnet die zweite Möglichkeit die Weigerung, auf die Botschaft zu hören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֵךְ בֹּא
  choice: Und geh, begib dich
  rationale: Die beiden aufeinanderfolgenden Bewegungsbefehle bleiben erkennbar. Das idiomatische »begib dich« gibt בוא im Deutschen natürlicher wieder als das missverständliche »komm«.
- source_word: הַגּוֹלָה
  choice: die Verschleppten
  rationale: Das Substantiv bezeichnet kollektiv die deportierte Gemeinschaft, nicht abstrakt den Zustand des Exils.
- source_word: בְּנֵי עַמֶּךָ
  choice: die Söhne deines Volkes
  rationale: Die konkrete Verwandtschaftsbezeichnung des Hebräischen bleibt im Haupttext erhalten; ihre umfassende, gemeinschaftliche Bedeutung wird in einer Fußnote erläutert.
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם וְאָמַרְתָּ אֲלֵיהֶם
  choice: und rede zu ihnen. Sag zu ihnen
  rationale: Die Wiederholung der beiden Redeverben wird nicht geglättet; die Befehlsfolge wird in natürlichem Deutsch wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feierliche prophetische Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die herkömmliche deutsche Wiedergabe vermeidet die schwer verständliche Doppelung »Herr HERR« und kennzeichnet den Gottesnamen durch Kapitälchen.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: ob sie nun hören oder sich weigern
  rationale: Die Konstruktion bezeichnet zwei mögliche Reaktionen. »Hören« wahrt den Wortlaut und seine Bedeutung des Gehorchens; »sich weigern« gibt den kontextuellen Gegensatz verständlich wieder.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr JHWH / der Herr Jahwe
  rationale: Die Übersetzung unterscheidet Titel und Gottesnamen, ohne die unnatürliche Form »Herr HERR« zu erzeugen. Die Kapitälchen zeigen an, dass HERR für den Gottesnamen steht.
- issue: Umfang von בְּנֵי עַמֶּךָ
  choice: die Söhne deines Volkes
  alternative: die Angehörigen deines Volkes / die Kinder deines Volkes
  rationale: Die männliche Pluralform wird formal bewahrt, während die Fußnote offenlegt, dass die hebräische Verwandtschaftsbezeichnung die Volksgemeinschaft repräsentativ meint.
- issue: Bedeutung von יֶחְדָּלוּ im Gegensatz zu יִשְׁמְעוּ
  choice: sich weigern
  alternative: davon ablassen / es unterlassen
  rationale: Im prophetischen Kontext geht es um die Weigerung, auf Gottes Botschaft zu hören. Die Fußnote bewahrt zugleich die wörtlichere Bedeutung von חדל.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und erkennbarer hebräischer Befehlsfolge. Die ungewöhnliche Wiederholung der Redeaufforderung bleibt bewusst stehen. Die Anführungszeichen umfassen nur die ausdrücklich einzuleitende Gottesrede; die abschließende Alternative gehört syntaktisch zur prophetischen Weisung.
