  text: לֹ֣א אֶל עַמִּ֣ים רַבִּ֗ים עִמְקֵ֤י שָׂפָה֙ וְ/כִבְדֵ֣י לָשׁ֔וֹן אֲשֶׁ֥ר לֹֽא תִשְׁמַ֖ע דִּבְרֵי/הֶ֑ם אִם לֹ֤א אֲלֵי/הֶם֙ שְׁלַחְתִּ֔י/ךָ הֵ֖מָּה יִשְׁמְע֥וּ אֵלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/006.yaml
  text: not to many peoples of obscure speech and difficult language[a], whose words you cannot understand; surely, if I had sent you to them, they would listen to you.
translation:
  language: de
  text: 'nicht zu vielen Völkern mit unverständlicher Rede und schwer verständlicher Sprache[a], deren Worte du nicht verstehen kannst; gewiss: Hätte ich dich zu ihnen gesandt, würden sie auf dich hören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tief von Lippe und schwer von Zunge“; eine bildhafte Wendung für schwer verständliche Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  choice: vielen Völkern
  rationale: Der Plural bezeichnet mehrere ethnische oder nationale Gemeinschaften; „Völker“ bewahrt diese Mehrzahl natürlich und präzise.
- source_word: עִמְקֵי שָׂפָה
  choice: mit unverständlicher Rede
  rationale: Die wörtliche Wendung „tief von Lippe“ beschreibt eine Redeweise, die für den Angesprochenen schwer zu erfassen ist. Die Übersetzung gibt den idiomatischen Sinn verständlich wieder.
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: und schwer verständlicher Sprache
  rationale: Wörtlich „schwer von Zunge“; im Zusammenhang geht es nicht um ein körperliches Sprechproblem, sondern um eine Sprache, die der Prophet nur schwer verstehen könnte.
- source_word: אֲשֶׁר לֹא תִשְׁמַע דִּבְרֵיהֶם
  choice: deren Worte du nicht verstehen kannst
  rationale: שׁמע kann sowohl „hören“ als auch „verstehen“ bedeuten. Da fremde Sprachen im Blick sind, bezeichnet es hier das sprachliche Verstehen.
- source_word: אִם לֹא
  choice: gewiss, hätte
  rationale: Die Verbindung hat hier bekräftigende und zugleich hypothetische Kraft. „Gewiss, hätte ich …“ bildet diese rhetorische Aussage im Deutschen natürlich ab.
- source_word: שְׁלַחְתִּיךָ
  choice: ich dich zu ihnen gesandt
  rationale: Im irrealen Bedingungssatz gibt der Konjunktiv II der Vergangenheit die hypothetische Aussage angemessen wieder.
- source_word: הֵמָּה יִשְׁמְעוּ אֵלֶיךָ
  choice: würden sie auf dich hören
  rationale: שׁמע mit אֶל bedeutet, jemandem zuzuhören beziehungsweise auf ihn zu hören. Die Formulierung bewahrt die mögliche responsive Bedeutung, ohne ausdrücklich „gehorchen“ zu setzen.
theological_decisions:
- issue: Grad der Reaktion der fremden Völker
  choice: auf dich hören
  alternative: dir gehorchen
  rationale: Der hebräische Ausdruck kann eine zustimmende Reaktion einschließen, sagt aber nicht zwingend ausdrücklich „gehorchen“. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist als Fortsetzung des vorangehenden Satzes formuliert; das Semikolon erhält den engen Gedankenzusammenhang. Die parallelen hebräischen Bilder werden im Haupttext idiomatisch wiedergegeben und in der Fußnote offengelegt.
