  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וָ/אֶשְׁמַ֣ע אַחֲרַ֔/י ק֖וֹל רַ֣עַשׁ גָּד֑וֹל בָּר֥וּךְ כְּבוֹד יְהוָ֖ה מִ/מְּקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/012.yaml
  text: 'Then the Spirit lifted me up, and I heard behind me a sound of a great rumbling: “Blessed be the glory of the LORD from his place.”'
translation:
  language: de
  text: 'Da hob mich der Geist empor, und ich hörte hinter mir ein gewaltiges Dröhnen: »Gepriesen sei die Herrlichkeit des HERRN von seinem Ort her!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ
  choice: der Geist
  rationale: Das feminine Substantiv kann »Wind«, »Geist« oder »Atem« bedeuten. Im Zusammenhang mit dem handelnden Geist in Ez 2,2 und 3,14 ist »der Geist« die naheliegende Wiedergabe.
- source_word: ק֖וֹל רַ֣עַשׁ גָּד֑וֹל
  choice: ein gewaltiges Dröhnen
  rationale: קוֹל bezeichnet einen hörbaren Laut bzw. Klang, רַעַשׁ ein starkes Getöse, Dröhnen oder Beben. Die kompakte deutsche Form gibt die Wucht der hebräischen Wortgruppe natürlich wieder.
- source_word: בָּר֥וּךְ
  choice: Gepriesen sei
  rationale: Die Segensformel wird idiomatisch und würdevoll wiedergegeben, ohne ihre doxologische Funktion abzuschwächen.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit des HERRN
  rationale: כָּבוֹד wird in diesem visionären Gottesbezug traditionell und sachgerecht mit »Herrlichkeit« übersetzt; das Tetragramm wird als HERR wiedergegeben.
- source_word: מִמְּקוֹמוֹ
  choice: von ihrem Ort her
  rationale: Die Präposition מִן behält ihre räumliche Ausgangsbedeutung »von … her«. Das Possessivpronomen bezieht sich grammatisch auf die Herrlichkeit.
theological_decisions:
- issue: Bezug des Geistes
  choice: »der Geist« mit bestimmtem Artikel
  alternative: »ein Wind«
  rationale: Der unmittelbare literarische Kontext beschreibt den Geist als handelnde Kraft, die den Propheten aufrichtet und fortträgt. Die grundsätzliche Mehrdeutigkeit von רוּחַ wird anerkannt, doch der Kontext begünstigt »Geist«.
- issue: Sprecher und syntaktische Einordnung der Doxologie
  choice: Als direkt gehörte Akklamation nach einem Doppelpunkt wiedergegeben
  alternative: Als bloße Beschreibung des Dröhnens ohne direkte Rede
  rationale: Der hebräische Text nennt keinen Sprecher und keine ausdrückliche Redeeinleitung. Die Interpunktion macht die wahrscheinlich akklamatorische Funktion lesbar, ohne einen Sprecher zu ergänzen.
- issue: Richtungsaussage in מִמְּקוֹמוֹ
  choice: »von ihrem Ort her«
  alternative: »an ihrem Ort«
  rationale: Die ungewöhnliche Formulierung und ihre theologische Spannung werden bewahrt; die Präposition wird nicht in eine leichter verständliche Ortsangabe umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Emporheben« und »Herrlichkeit« tragen den feierlich-visionären Ton, während »gewaltiges Dröhnen« unmittelbar verständlich bleibt. Keine Fußnoten erforderlich.
