source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְק/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל וְ/נָתַתִּ֥י מִכְשׁ֛וֹל לְ/פָנָ֖י/ו ה֣וּא יָמ֑וּת כִּ֣י לֹ֤א הִזְהַרְתּ/וֹ֙ בְּ/חַטָּאת֣/וֹ יָמ֔וּת וְ/לֹ֣א תִזָּכַ֗רְןָ צִדְקֹתָ/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/020.yaml
  text: And when a righteous man turns from his righteousness and does injustice[a], and I place a stumbling block before him, he will die. Because you did not warn him, he will die in his sin, and his righteous deeds that he did will not be remembered[d][c][b]; and I will require his blood from your hand.
translation:
  language: de
  text: Und wenn ein Gerechter sich von seiner Gerechtigkeit abwendet und Unrecht tut und ich ihm einen Stolperstein in den Weg lege,[a] wird er sterben. Weil du ihn nicht gewarnt hast, wird er in seiner Sünde sterben. Seiner gerechten Taten, die er getan hat, wird nicht gedacht werden,[b] und sein Blut werde ich von deiner Hand fordern.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Stolperstein vor ihn lege“; gemeint sein kann auch ein Hindernis oder Anlass zum Straucheln.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Seine gerechten Taten werden nicht in Erinnerung gebracht.“'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: Gott wird den Wächter für das Blut beziehungsweise den Tod dieses Menschen zur Rechenschaft ziehen.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשׁוּב צַדִּיק מִצִּדְקוֹ
  choice: Und wenn ein Gerechter sich von seiner Gerechtigkeit abwendet
  rationale: Die Konstruktion mit Infinitivus constructus bezeichnet einen zeitlich-bedingenden Umstand. „Ein Gerechter“ gibt das substantivierte maskuline Singularadjektiv wieder; „Gerechtigkeit“ wahrt die direkte Verbindung zum hebräischen Substantiv.
- source_word: וְעָשָׂה עָוֶל
  choice: und Unrecht tut
  rationale: עָוֶל bezeichnet moralisches Unrecht beziehungsweise Verwerflichkeit. „Unrecht tun“ ist im Deutschen natürlich, gewichtig und weniger altertümlich als „Frevel begehen“.
- source_word: וְנָתַתִּי מִכְשׁוֹל לְפָנָיו
  choice: und ich ihm einen Stolperstein in den Weg lege
  rationale: Die konkrete Metapher מִכְשׁוֹל wird erhalten. Die deutsche Wendung „in den Weg legen“ gibt לְפָנָיו idiomatisch wieder und lässt die ausdrücklich genannte göttliche Urheberschaft stehen.
- source_word: הוּא יָמוּת
  choice: wird er sterben
  rationale: Das hervorgehobene Pronomen wird im natürlichen deutschen Satzbau wiedergegeben, ohne eine erklärende Ergänzung einzuführen.
- source_word: כִּי לֹא הִזְהַרְתּוֹ
  choice: Weil du ihn nicht gewarnt hast
  rationale: כִּי hat hier begründende Funktion. „Warnen“ gibt den Hifil von זהר im Wächterkontext sachgerecht wieder.
- source_word: בְּחַטָּאתוֹ יָמוּת
  choice: wird er wegen seiner Sünde sterben
  rationale: „Wegen seiner Sünde“ ist im heutigen Deutsch natürlicher als „in seiner Sünde“ und bringt den Zusammenhang zwischen Sünde und Tod zum Ausdruck, ohne die Sünde dem Wächter zuzuschreiben.
- source_word: וְלֹא תִזָּכַרְןָ צִדְקֹתָיו אֲשֶׁר עָשָׂה
  choice: An seine gerechten Taten wird nicht mehr gedacht werden
  rationale: Der Plural צִדְקֹתָיו meint hier konkrete gerechte Handlungen. Die Passivform wahrt die ungenannte handelnde Instanz; „nicht mehr“ bringt im Deutschen die Nichtberücksichtigung der früheren Taten natürlich zum Ausdruck.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: und sein Blut werde ich von deiner Hand fordern
  rationale: Die gerichtliche Blut- und Haftungsmetapher des Hebräischen bleibt erhalten. Die Wortstellung hebt entsprechend dem Ausgangstext „sein Blut“ hervor.
theological_decisions:
- issue: Gott legt dem Gerechten einen „Stolperstein“ in den Weg
  choice: Die konkrete Metapher und die ausdrückliche göttliche Handlung bleiben im Haupttext stehen.
  alternative: „Ich lasse ihn zu Fall kommen“ oder eine Deutung als bloße Folge seines Handelns.
  rationale: Der hebräische Text schreibt Gott das Setzen des מִכְשׁוֹל ausdrücklich zu. Die Übersetzung darf die Spannung zwischen göttlichem Handeln und menschlicher Verantwortung nicht abschwächen oder systematisch auflösen.
- issue: Die früheren gerechten Taten werden nicht erinnert
  choice: Die Aussage wird als Nichtgedenken der konkreten gerechten Taten wiedergegeben.
  alternative: Ausdrückliche Deutung als Verlust des Heils, Verlust des Bundesstandes oder lediglich hypothetische Warnung.
  rationale: Der Vers formuliert eine ernste Gerichtsaussage, legt aber keine vollständige systematische Lehre über Abfall oder Beharren vor. Deshalb wird weder eine konfessionelle Folgerung ergänzt noch die Warnung abgeschwächt.
- issue: Verantwortung des Wächters für das Blut
  choice: Die hebräische Rechtsmetapher „sein Blut ... von deiner Hand fordern“ wird bewahrt und in einer Fußnote erläutert.
  alternative: 'Im Haupttext paraphrasieren: „Ich werde dich für seinen Tod zur Rechenschaft ziehen.“'
  rationale: Die wörtliche Bildsprache ist verständlich und textprägend; die Fußnote erschließt ihre Bedeutung, ohne die Metapher zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, wurde aber für gute deutsche Lesbarkeit in drei Sätze gegliedert. Schlüsselmetaphern wie „Stolperstein“ und „Blut von deiner Hand fordern“ bleiben erhalten; erklärende Fußnoten erschließen sie, ohne die theologischen Spannungen im Haupttext aufzulösen.
