revisions:
- from: Und wenn ein Gerechter sich von seiner Gerechtigkeit abwendet und Unrecht tut und ich ihm einen Stolperstein in den Weg lege,[a] wird er sterben. Weil du ihn nicht gewarnt hast, wird er wegen seiner Sünde sterben. An seine gerechten Taten wird nicht mehr gedacht werden,[b] und sein Blut werde ich von deiner Hand fordern.[c]
  to: Und wenn ein Gerechter sich von seiner Gerechtigkeit abwendet und Unrecht tut und ich ihm einen Stolperstein in den Weg lege,[a] wird er sterben. Weil du ihn nicht gewarnt hast, wird er in seiner Sünde sterben. Seiner gerechten Taten, die er getan hat, wird nicht gedacht werden,[b] und sein Blut werde ich von deiner Hand fordern.[c]
