base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/015.yaml
  text: Then I came to the exiles at Tel-abib[a], who were living by the Kebar River, where they were living; and I sat there among them for seven days, appalled.
translation:
  language: de
  text: Dann kam ich zu den Verschleppten nach Tel-Abib, die am Fluss Kebar wohnten, und saß dort, wo sie wohnten, sieben Tage lang mitten unter ihnen, wie betäubt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entsetzt“, „verstört“ oder „wie erstarrt“. Das hebräische Wort bezeichnet einen Zustand tiefer Erschütterung oder Verwüstung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹלָה
  choice: die Verschleppten
  rationale: Das Wort bezeichnet hier die Gemeinschaft der deportierten Menschen, nicht abstrakt das Exil. „Verschleppte“ hebt den erzwungenen Ortswechsel hervor und ist im modernen Deutschen verständlich.
- source_word: תֵּל אָבִיב
  choice: Tel-Abib
  rationale: Der antike Ortsname wird transliteriert und durch die Schreibweise mit Bindestrich von der modernen Stadt Tel Aviv unterschieden.
- source_word: הַיֹּשְׁבִים אֶל נְהַר כְּבָר
  choice: die am Fluss Kebar wohnten
  rationale: יֹשְׁבִים bezeichnet hier ansässiges Wohnen; אֶל hat lokative Bedeutung. „Fluss Kebar“ folgt der geläufigen Wiedergabe, auch wenn das Gewässer möglicherweise ein Kanal war.
- source_word: ו/אשר הֵמָּה יוֹשְׁבִים שָׁם
  choice: dorthin, wo sie wohnten
  rationale: Die schwierige, wiederholende Konstruktion wird als resumptive Ortsangabe verstanden. Die Wiederholung von „wohnten“ bleibt erhalten, ohne ein im Hebräischen nicht vorhandenes Verb wie „sehen“ einzufügen.
- source_word: וָאֵשֵׁב שָׁם
  choice: Dort saß ich
  rationale: Die konkrete Grundbedeutung „sitzen“ passt zur Szene stiller Erschütterung und wird nicht zu „blieb“ verallgemeinert.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Natürliche deutsche Wiedergabe einer Zeitdauer.
- source_word: מַשְׁמִים
  choice: wie betäubt
  rationale: Das Partizip beschreibt einen Zustand tiefer Erschütterung, Verstörung oder Erstarrung. „Wie betäubt“ gibt den schockartigen Zustand idiomatisch wieder, ohne ihn bloß als Verwunderung zu verstehen.
- source_word: בְּתוֹכָם
  choice: mitten unter ihnen
  rationale: Die Formulierung gibt die körperliche Anwesenheit innerhalb der Gemeinschaft anschaulich und idiomatisch wieder.
