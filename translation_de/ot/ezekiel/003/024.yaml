  text: וַ/תָּבֹא בִ֣/י ר֔וּחַ וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וַ/יְדַבֵּ֤ר אֹתִ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י בֹּ֥א הִסָּגֵ֖ר בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/024.yaml
  text: Then the Spirit entered into me and set me on my feet[a], and he spoke to me and said to me, “Go[b], shut yourself inside your house.”
translation:
  language: de
  text: 'Da kam der Geist in mich und stellte mich auf meine Füße[a]. Er redete mit mir und sagte zu mir: »Geh[b], schließ dich in deinem Haus ein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da kam ein Geist in mich und stellte mich auf meine Füße.«'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »Komm«. Im Deutschen ist in diesem Zusammenhang »Geh« idiomatisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֔וּחַ
  choice: der Geist
  rationale: Im Zusammenhang von Hesekiels prophetischer Bevollmächtigung bezeichnet רוּחַ am ehesten Gottes Geist. Der fehlende Artikel im Hebräischen schließt eine kontextuell bestimmte Wiedergabe nicht aus; die mögliche Lesart »ein Geist« bleibt in der Fußnote erhalten.
- source_word: וַ/תָּבֹא בִ֣/י
  choice: kam ... in mich
  rationale: בוא mit ב und Personenbezug beschreibt ein Hineinkommen. Die deutsche Formulierung bleibt nah am wiederkehrenden Ausdruck des Buches und klingt natürlicher als »trat in mich ein«.
- source_word: וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י
  choice: stellte mich auf meine Füße
  rationale: Der Hifil von עמד ist kausativ. »Stellte mich auf meine Füße« gibt diese Bedeutung direkt und in natürlichem Deutsch wieder.
- source_word: וַ/יְדַבֵּ֤ר אֹתִ/י֙
  choice: Er redete zu mir
  rationale: Die ungewöhnliche Verbindung mit אֵת bezeichnet hier im Kontext an Hesekiel gerichtetes Reden. »Redete zu mir« bewahrt die Zielrichtung und ist idiomatisch.
- source_word: בֹּ֥א
  choice: Geh
  rationale: Die Grundbedeutung ist »komm«, doch im Zusammenhang weist der Befehl den Propheten in sein eigenes Haus. Deutsches Sprachgefühl verlangt hier gewöhnlich »Geh«; die wörtliche Möglichkeit wird in der Fußnote genannt.
- source_word: הִסָּגֵ֖ר
  choice: schließ dich ... ein
  rationale: Der Nifal-Imperativ von סגר hat hier reflexive Bedeutung und fordert Hesekiel auf, sich zurückzuziehen und eingeschlossen zu bleiben.
- source_word: בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ
  choice: in deinem Haus
  rationale: בְּתוֹךְ bezeichnet hier idiomatisch das Innere des Hauses. »In deinem Haus« ist im Deutschen präzise und natürlich.
theological_decisions:
- issue: Identifikation von רוּחַ
  choice: »der Geist« als Gottes Geist, der Hesekiel bevollmächtigt
  alternative: »ein Geist«
  rationale: Der nähere Kontext schildert wiederholt, wie der Geist den Propheten ergreift und handlungsfähig macht. Dennoch lässt die artikellose hebräische Form grammatisch auch die unbestimmte Wiedergabe zu; diese Spannung wird durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bilden die hebräische Erzählfolge ab, ohne sie unnötig schwerfällig wiederzugeben. Die direkte Rede ist klar und nachdrücklich formuliert.
