id: EZK.3.25
reference: Ezekiel 3:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנֵּ֨ה נָתְנ֤וּ עָלֶ֨י/ךָ֙ עֲבוֹתִ֔ים וַ/אֲסָר֖וּ/ךָ בָּ/הֶ֑ם וְ/לֹ֥א תֵצֵ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/025.yaml
  text: But you[a], son of man, behold, they will put ropes on you and bind you with them[b], so that you will not go out among them.
translation:
  language: de
  text: 'Du aber, Menschensohn: Sieh, sie werden dir Stricke[a] anlegen und dich damit binden, sodass du nicht mitten unter sie[b] hinausgehen wirst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Seile; Fesseln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: in ihre Mitte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: Menschensohn
  rationale: Die im Buch Ezechiel feststehende Anrede wird als hebräische Wendung bewahrt; eine Wiedergabe wie „Sterblicher“ wäre stärker deutend.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Das gegenwärtige deutsche „Sieh“ erhält die feierliche prophetische Aufmerksamkeitsformel, ohne archaisch zu wirken.
- source_word: נָתְנוּ
  choice: sie werden … anlegen
  rationale: Das morphologische Perfekt wird im prophetischen Zusammenhang zukunftsbezogen verstanden. Das unbestimmte Pluralsubjekt bleibt als „sie“ erhalten.
- source_word: עֲבוֹתִים
  choice: Stricke
  rationale: Das Wort bezeichnet starke Bindemittel; „Stricke“ ist klar, konkret und passt zum folgenden Binden.
- source_word: וַאֲסָרוּךָ
  choice: und dich … binden
  rationale: Die unmittelbare Bedeutung von אסר wird bewahrt, ohne sie zu „einsperren“ auszuweiten.
- source_word: בָּהֶם
  choice: damit
  rationale: Die Präposition bezeichnet hier am natürlichsten das Mittel, mit dem Ezechiel gebunden wird.
- source_word: וְלֹא תֵצֵא
  choice: sodass du nicht … hinausgehen wirst
  rationale: „Sodass“ macht die naheliegende Folge der Fesselung deutlich; die Zukunftsform vermeidet die zusätzliche Festlegung auf ausdrücklich formulierte Unfähigkeit.
- source_word: בְּתוֹכָם
  choice: mitten unter sie
  rationale: Bei dem Bewegungsverb „hinausgehen“ gibt diese Formulierung idiomatisch die Bewegung in die Mitte der Menschen wieder, nicht eine Bewegung von ihnen weg.
theological_decisions:
- issue: Identität des nicht genannten Pluralsubjekts
  choice: Das unbestimmte „sie“ bleibt stehen.
  alternative: Die Handelnden als das Volk, als Beauftragte Gottes oder unpersönlich mit „man“ zu bestimmen.
  rationale: Der hebräische Text nennt die Handelnden nicht. Die Übersetzung wahrt diese Offenheit und legt weder menschliche noch göttliche Vermittlung ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Anrede und das unbestimmte „sie“ bleiben erhalten; leicht erklärungsbedürftige lexikalische Möglichkeiten werden in Fußnoten ausgewiesen.
