  text: וּ/פְנֵי/הֶ֕ם וְ/כַנְפֵי/הֶ֥ם פְּרֻד֖וֹת מִ/לְ/מָ֑עְלָ/ה לְ/אִ֗ישׁ שְׁ֚תַּיִם חֹבְר֣וֹת אִ֔ישׁ וּ/שְׁתַּ֣יִם מְכַסּ֔וֹת אֵ֖ת גְּוִיֹתֵי/הֶֽנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/011.yaml
  text: And their faces and their wings were separated above[a]; each had two joined to one another[b], and two covering their bodies.
translation:
  language: de
  text: Ihre Gesichter und ihre Flügel waren oben voneinander getrennt[a]. Bei jedem waren zwei miteinander verbunden[b], und zwei bedeckten ihre Körper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren nach oben hin ausgebreitet“. Das hebräische Wort bedeutet vor allem „getrennt“ oder „geteilt“; im Zusammenhang kann gemeint sein, dass die Flügel nach oben ausgestreckt waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Bei jedem waren zwei verbunden, eines mit dem anderen.“ Gemeint sein können die einander berührenden Flügel benachbarter Lebewesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְנֵיהֶם
  choice: ihre Gesichter
  rationale: פָּנִים steht formal im Plural. „Gesichter“ entspricht sowohl der hebräischen Form als auch der Mehrzahl der beschriebenen Lebewesen.
- source_word: וְכַנְפֵיהֶם
  choice: ihre Flügel
  rationale: כָּנָף bezeichnet hier im Kontext der Vision eindeutig die Flügel der Lebewesen.
- source_word: פְּרֻדוֹת
  choice: waren voneinander getrennt
  rationale: Das Partizip von פרד bezeichnet ein Getrennt- oder Geschiedensein. Die Formulierung bewahrt diesen lexikalischen Kern, ohne die mögliche räumliche Vorstellung des Ausgebreitetseins zur alleinigen Deutung zu machen.
- source_word: מִלְמָעְלָה
  choice: oben
  rationale: Die Wendung bezeichnet hier knapp die obere Lage beziehungsweise Ausrichtung. „Oben“ ist idiomatisches modernes Deutsch; die mögliche Richtungsnuance wird in der Fußnote berücksichtigt.
- source_word: לְאִישׁ
  choice: bei jedem
  rationale: אִישׁ wird distributiv gebraucht. „Bei jedem“ gibt verständlich wieder, dass die folgende Anordnung für jedes einzelne Lebewesen gilt.
- source_word: שְׁתַּיִם חֹבְרוֹת אִישׁ
  choice: zwei miteinander verbunden
  rationale: חבר bedeutet „verbinden, zusammenfügen“. „Miteinander verbunden“ erhält den reziproken Sinn, ohne genauer festzulegen, auf welche Flügel beziehungsweise Lebewesen sich אִישׁ bezieht.
- source_word: וּשְׁתַּיִם מְכַסּוֹת
  choice: und zwei bedeckten
  rationale: Das Partizip beschreibt einen fortdauernden Zustand innerhalb der Vision. Im Deutschen gibt das Präteritum diesen beschreibenden Zusammenhang natürlich wieder.
- source_word: אֵת גְּוִיֹתֵיהֶנָה
  choice: ihre Körper
  rationale: גְּוִיָּה bezeichnet den Körper beziehungsweise Leib. Der Plural „Körper“ entspricht dem pluralischen Bezug auf die Lebewesen; die spezifischere Wiedergabe „Rücken“ wäre lexikalisch nicht hinreichend begründet.
theological_decisions: []
