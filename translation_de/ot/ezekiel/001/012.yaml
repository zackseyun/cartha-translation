source:
  edition: WLC
  text: וְ/אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵ֑כוּ אֶ֣ל אֲשֶׁר֩ יִֽהְיֶה שָׁ֨מָּ/ה הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/012.yaml
  text: And each one went straight ahead[a]. Wherever the spirit was to go, they went[b]; they did not turn as they went.
translation:
  language: de
  text: Und jedes ging geradeaus.[a] Wohin der Geist[b] gehen sollte, dahin gingen sie; sie wandten sich beim Gehen nicht um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „in die Richtung seines Angesichts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wind“, möglicherweise auch „Atem“. Das hebräische Wort רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten; hier wird der Bezug nicht ausdrücklich bestimmt und der Ausdruck nicht eindeutig als Bezeichnung des Heiligen Geistes gekennzeichnet.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ
  choice: Und jedes
  rationale: אִישׁ wird hier distributiv gebraucht und bezeichnet jeweils eines der vier lebenden Wesen. Das neutrale „jedes“ nimmt im Deutschen auf „Wesen“ Bezug, ohne menschliche Identität anzudeuten.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: ging geradeaus
  rationale: Die Wendung bedeutet wörtlich etwa „in die Richtung seines Angesichts“. „Geradeaus“ gibt die beabsichtigte Vorwärtsbewegung in natürlichem Deutsch wieder; die konkrete Bildsprache bleibt in einer Fußnote erhalten.
- source_word: יֵלֵכוּ
  choice: gingen
  rationale: Die Imperfektformen beschreiben innerhalb der Vision die Bewegung der Wesen. Das deutsche Präteritum fügt sich natürlich in die erzählende Darstellung ein.
- source_word: אֶל אֲשֶׁר יִהְיֶה שָׁמָּה הָרוּחַ לָלֶכֶת
  choice: Wohin der Geist gehen sollte, dahin gingen sie
  rationale: Die Formulierung wahrt die Richtungs- und Zwecknuance von לָלֶכֶת, ohne dem Geist ausdrücklich einen menschlich verstandenen Willensentschluss zuzuschreiben.
- source_word: הָרוּחַ
  choice: der Geist
  rationale: רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten. Im Zusammenhang der koordinierten Bewegung ist „Geist“ eine sachgerechte Hauptlesart; eine Fußnote bewahrt die lexikalische und referenzielle Offenheit.
- source_word: לֹא יִסַּבּוּ
  choice: sie wandten sich nicht um
  rationale: Das Nifal von סבב bezeichnet hier ein Sichwenden beziehungsweise eine Richtungsänderung. Die Formulierung entspricht dem wiederkehrenden Motiv, dass die Wesen sich bei ihrer Bewegung nicht drehen.
- source_word: בְּלֶכְתָּן
  choice: beim Gehen
  rationale: Der Infinitiv mit בְּ bezeichnet eine gleichzeitige Handlung. „Beim Gehen“ gibt diese temporale Beziehung knapp und idiomatisch wieder.
theological_decisions:
- issue: Ob הָרוּחַ ausdrücklich als der Heilige Geist zu verstehen ist
  choice: der Geist, ohne ausdrückliche Identifizierung als Heiliger Geist
  alternative: der Wind; der Atem; ausdrücklich der Heilige Geist
  rationale: Der hebräische Ausdruck legt den Referenten nicht eindeutig fest. Da deutsche Substantive großgeschrieben werden, kann die Schreibung allein die Unterscheidung nicht sichtbar machen; die Fußnote hält deshalb fest, dass keine ausdrückliche Identifizierung mit dem Heiligen Geist vorgenommen wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „Wohin … dahin“ bildet die hebräische Richtungsstruktur natürlich ab. Die Fußnotenmarker stehen jeweils unmittelbar bei der betroffenen Wendung.
