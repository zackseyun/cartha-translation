translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die visionäre Räumlichkeit bleibt konkret; elliptische Wiederholungen des Hebräischen werden nur so weit ergänzt, wie es für einen verständlichen deutschen Satz nötig ist. Die syntaktische Unsicherheit in der ersten Bedeckungsklausel wird nicht stillschweigend beseitigt, sondern in einer Fußnote ausgewiesen.
