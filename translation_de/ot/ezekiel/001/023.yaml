base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/023.yaml
  text: And under the expanse their wings were straight[a], each one toward her sister. Each had two covering them[b], and each had two covering their bodies.
translation:
  language: de
  text: Unter dem Gewölbe waren ihre Flügel gerade ausgestreckt, ein Flügel dem anderen zugewandt.[a] Jedes Wesen hatte zwei, die sie bedeckten,[b] und jedes Wesen hatte zwei, die seinen Körper bedeckten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine zu ihrer Schwester“. Im Hebräischen ist „Flügel“ grammatisch feminin; die Formel beschreibt die einander entsprechende Ausrichtung der Flügel.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist knapp und schwer zu deuten: wörtlich „für jedes zwei, die sie bedeckten“. Das feminine „sie“ bezieht sich grammatisch am ehesten auf die Flügel; wie diese erste Bedeckung genau zu verstehen ist, bleibt unsicher.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְתַחַת הָרָקִיעַ
  choice: Unter dem Gewölbe
  rationale: Die Wendung bezeichnet die räumliche Lage unter dem in der Vision beschriebenen ausgedehnten, gewölbeartigen Gebilde. „Gewölbe“ bewahrt das konkrete Bild und ist im heutigen Deutsch verständlich.
- source_word: כַּנְפֵיהֶם יְשָׁרוֹת
  choice: waren ihre Flügel gerade ausgestreckt
  rationale: יְשָׁרוֹת beschreibt Geradheit beziehungsweise gerade Ausrichtung. „Gerade ausgestreckt“ gibt in diesem Zusammenhang sowohl Form als auch Haltung natürlich wieder.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: jeweils einer dem anderen zugewandt
  rationale: Die wörtliche feminine Paarformel „eine zu ihrer Schwester“ bezieht sich grammatisch auf die Flügel und bezeichnet ihre wechselseitige Ausrichtung. Die deutsche Formulierung wahrt den Sinn, ohne eine im Deutschen unnatürliche Feminisierung von „Flügel“ einzuführen.
- source_word: לְאִישׁ שְׁתַּיִם
  choice: Jedes Wesen hatte zwei Flügel
  rationale: 'לְאִישׁ wird hier distributiv gebraucht: „für jedes/einem jeden“. Das im Hebräischen elliptische „zwei“ wird aus dem Zusammenhang ausdrücklich als „zwei Flügel“ wiedergegeben.'
- source_word: מְכַסּוֹת לָהֵנָּה
  choice: die es bedeckten
  rationale: Das Partizip bezeichnet bedeckende Flügel. Der knappe pronominale Ausdruck ist syntaktisch schwierig; die Hauptfassung versteht die Flügel als Bedeckung des jeweiligen Wesens, während die Fußnote die Unsicherheit offenlegt.
- source_word: אֵת גְּוִיֹּתֵיהֶם
  choice: die seinen Körper bedeckten
  rationale: גְּוִיָּה bedeutet hier den Körper eines lebenden Wesens, nicht einen Leichnam. Der distributive Singular sorgt im Deutschen für einen klaren Bezug auf jedes einzelne Wesen.
