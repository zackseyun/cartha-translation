  naturalness: „Unter dem Gewölbe“ und „gerade ausgestreckt“ sind modernes, würdiges Deutsch. „Ein Flügel dem anderen zugewandt“ ist klarer als das substantivierte, maskuline „jeweils einer dem anderen“ und macht den Bezug der Formel deutlich. Die elliptische Wiederholung von „zwei“ kann im Deutschen erhalten bleiben, wenn die Anmerkung die syntaktische Schwierigkeit erläutert.
