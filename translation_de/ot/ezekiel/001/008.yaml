  text: ו/יד/ו אָדָ֗ם מִ/תַּ֨חַת֙ כַּנְפֵי/הֶ֔ם עַ֖ל אַרְבַּ֣עַת רִבְעֵי/הֶ֑ם וּ/פְנֵי/הֶ֥ם וְ/כַנְפֵי/הֶ֖ם לְ/אַרְבַּעְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/008.yaml
  text: And they had human hands under their wings on their four sides[b][a]; and the four of them had their faces and their wings.
translation:
  language: de
  text: An ihren vier Seiten hatten sie unter ihren Flügeln Menschenhände[a][b]. Alle vier hatten Gesichter und Flügel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist stark verkürzt; wörtlich etwa: „Und Menschenhände unter ihren Flügeln an ihren vier Seiten; und ihre Gesichter und ihre Flügel – für alle vier.“ Die Übersetzung macht die im Hebräischen nur angedeuteten Satzbeziehungen ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hände eines Menschen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וִידֵי אָדָם
  choice: Menschenhände
  rationale: Die Verbindung bezeichnet Hände menschlicher Art und hebt sie von den tierischen Merkmalen der Gestalten ab. Das deutsche Kompositum ist knapp, natürlich und gibt den attributiven Sinn von אָדָם wieder.
- source_word: מִתַּחַת כַּנְפֵיהֶם
  choice: unter ihren Flügeln
  rationale: מִתַּחַת bezeichnet die Lage unterhalb von etwas; die Formulierung entspricht dem räumlichen Bild des Hebräischen.
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶם
  choice: an ihren vier Seiten
  rationale: רִבְעֵיהֶם meint hier die vier Seiten beziehungsweise Bereiche der Gestalten. „An“ ist im Deutschen für diese räumliche Zuordnung idiomatisch.
- source_word: וּפְנֵיהֶם וְכַנְפֵיהֶם
  choice: Gesichter und Flügel
  rationale: Die beiden Substantive werden direkt wiedergegeben; die Possessivbeziehung wird im Deutschen zusammen mit „Alle vier hatten“ ausgedrückt.
- source_word: לְאַרְבַּעְתָּם
  choice: Alle vier hatten
  rationale: Die elliptische Wendung bezieht die genannten Merkmale auf sämtliche vier Gestalten. Die deutsche Formulierung macht diese Beziehung ausdrücklich, ohne zusätzliche Deutung einzuführen.
