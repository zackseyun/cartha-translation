translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die räumliche Bildsprache bleibt erhalten; »Fläche« ist bewusst weniger traditionell und weniger kosmologisch festgelegt als »Firmament«. Die mögliche Bedeutung »Stimme« wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote bewahrt.
