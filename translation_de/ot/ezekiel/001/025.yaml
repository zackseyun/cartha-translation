  text: And there was a sound from above the expanse that was over their heads[a]; when they stood still[b], they let down their wings.
translation:
  language: de
  text: Und es ertönte ein Laut[a] von oberhalb der Fläche, die über ihren Köpfen war. Wenn sie stillstanden, ließen sie ihre Flügel sinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und es ertönte eine Stimme von oberhalb der Fläche.« Das hebräische Wort qol kann sowohl »Laut« als auch »Stimme« bedeuten; im Haupttext steht »Laut«, weil hier noch keine artikulierte Rede ausdrücklich genannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Wayyiqtol-Form von היה führt im fortlaufenden Visionsbericht das Auftreten eines Phänomens ein. »Da kam« klingt im modernen Deutschen natürlich und wahrt den erzählerischen Fortgang.
- source_word: קוֹל
  choice: ein Laut
  rationale: קוֹל kann einen Laut, Schall oder eine Stimme bezeichnen. Da der Satz noch keine artikulierte Rede nennt, bewahrt »Laut« die Mehrdeutigkeit besser als »Stimme«.
- source_word: מֵעַל לָרָקִיעַ
  choice: von oberhalb der Fläche
  rationale: מֵעַל bezeichnet hier die Herkunft aus einem Bereich oberhalb der genannten räumlichen Struktur. »Fläche« gibt רָקִיעַ in verständlichem Deutsch wieder, ohne das traditionelle, kosmologisch stärker festgelegte »Firmament« zu verwenden.
- source_word: אֲשֶׁר עַל רֹאשָׁם
  choice: die über ihren Köpfen war
  rationale: Der Relativsatz bezieht sich auf die Fläche und gibt ihre Lage über den Köpfen der Lebewesen sachgerecht wieder.
- source_word: בְּעָמְדָם
  choice: Wenn sie stillstanden
  rationale: Der Infinitiv mit בְּ bezeichnet die zeitliche Begleitsituation. Im Zusammenhang mit Bewegung und Anhalten macht »stillstanden« deutlich, dass die Wesen ihre Bewegung eingestellt hatten.
- source_word: תְּרַפֶּינָה
  choice: ließen sie … sinken
  rationale: Die Hifil-Form von רפה bezeichnet ein Erschlaffenlassen oder Herabsinkenlassen. Bei Flügeln ist »sinken lassen« anschaulich und idiomatisch.
- source_word: כַנְפֵיהֶן
  choice: ihre Flügel
  rationale: Dies ist die natürliche Wiedergabe des Plurals von כָּנָף mit dem femininen Pluralsuffix, das sich im Kontext auf die Lebewesen bezieht.
