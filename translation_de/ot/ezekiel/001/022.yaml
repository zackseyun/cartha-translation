source:
  edition: WLC
  text: וּ/דְמ֞וּת עַל רָאשֵׁ֤י הַ/חַיָּה֙ רָקִ֔יעַ כְּ/עֵ֖ין הַ/קֶּ֣רַח הַ/נּוֹרָ֑א נָט֥וּי עַל רָאשֵׁי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/022.yaml
  text: And above the heads of the living creatures there was the likeness of an expanse[a], like the appearance of awe-inspiring ice[b], stretched out above their heads from above.
translation:
  language: de
  text: Und über den Köpfen der Lebewesen[a] war etwas, das einer ausgebreiteten Fläche[b] glich, anzusehen wie ehrfurchtgebietendes Eis[c], oben über ihren Köpfen ausgespannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine kollektive Singularform: „des Lebewesens“; die Fortsetzung spricht jedoch von „ihren Köpfen“.'
    reason: lexical_alternative
  - marker: b
    text: Oder „einem Gewölbe“ beziehungsweise „einer Ausdehnung“; gemeint ist etwas Ausgebreitetes oder Ausgespanntes.
    reason: lexical_alternative
  - marker: c
    text: Traditionell „Kristall“; das hebräische Wort bedeutet gewöhnlich „Eis“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: Und … war etwas, das … glich
  rationale: דְּמוּת bezeichnet Gestalt, Ähnlichkeit oder Abbild. Die Formulierung gibt die analoge Sehweise der Vision natürlich wieder, ohne das Gesehene unmittelbar mit der folgenden Erscheinung gleichzusetzen; וּ führt die Schilderung weiter.
- source_word: הַחַיָּה
  choice: der Lebewesen
  rationale: Die hebräische Form steht im Singular, wird hier aber kollektiv gebraucht, wie die anschließenden Pluralsuffixe in „ihren Köpfen“ zeigen. Der deutsche Plural macht diesen Bezug klar.
- source_word: רָקִיעַ
  choice: einer weiten Fläche
  rationale: רָקִיעַ bezeichnet etwas Ausgebreitetes oder Ausgespanntes. „Weite Fläche“ ist im Deutschen anschaulich und legt die Form nicht so stark auf ein festes Himmelsgewölbe fest.
- source_word: כְּעֵין
  choice: anzusehen wie
  rationale: Die Wendung bezeichnet den visuellen Eindruck und bewahrt eine weitere Vergleichsstufe in Hesekiels vorsichtiger Visionssprache.
- source_word: הַקֶּרַח
  choice: Eis
  rationale: Das Substantiv bedeutet gewöhnlich „Eis“. Die traditionelle Wiedergabe „Kristall“ beruht eher auf der Deutung des visionären Erscheinungsbildes und wird deshalb in der Fußnote genannt.
- source_word: הַנּוֹרָא
  choice: ehrfurchtgebietendes
  rationale: Das Wort bezeichnet etwas, das Furcht, Staunen oder Ehrfurcht hervorruft. „Ehrfurchtgebietend“ hält diese Bedeutungsbreite besser offen als nur „schrecklich“.
- source_word: נָטוּי
  choice: ausgespannt
  rationale: Das passive Partizip von נטה beschreibt etwas, das ausgestreckt oder ausgespannt ist; „ausgespannt“ passt zugleich zur räumlichen Vorstellung von רָקִיעַ.
- source_word: מִלְמָעְלָה
  choice: oben
  rationale: Das Adverb betont erneut die Lage oberhalb der Köpfe. Die im Deutschen leicht wiederholende Ortsangabe bleibt erhalten, weil auch der hebräische Text die vertikale Anordnung nachdrücklich hervorhebt.
theological_decisions:
- issue: Analoge Sprache der Vision
  choice: Die mehrfachen Signale des Vergleichs werden mit „etwas, das … glich“ und „anzusehen wie“ bewahrt.
  alternative: 'Eine direkte Beschreibung, etwa: „Über ihren Köpfen war eine weite Fläche aus glänzendem Kristall.“'
  rationale: Hesekiel identifiziert das Gesehene nicht schlicht, sondern beschreibt Ähnlichkeit und Erscheinung. Eine direkte Aussage würde die vorsichtige, spannungsreiche Visionssprache des Ausgangstextes unzulässig vereindeutigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Köpfe“ statt des gehobenen „Häupter“ und „Lebewesen“ statt „lebendige Wesen“ dienen der unmittelbaren Verständlichkeit. Die Satzstellung erhält die starke räumliche Betonung des Hebräischen, während die Vergleichssprache der Vision bewusst nicht geglättet wird.
