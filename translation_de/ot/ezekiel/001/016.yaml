source:
  edition: WLC
  text: מַרְאֵ֨ה הָ/אוֹפַנִּ֤ים וּ/מַעֲשֵׂי/הֶם֙ כְּ/עֵ֣ין תַּרְשִׁ֔ישׁ וּ/דְמ֥וּת אֶחָ֖ד לְ/אַרְבַּעְתָּ֑/ן וּ/מַרְאֵי/הֶם֙ וּ/מַ֣עֲשֵׂי/הֶ֔ם כַּ/אֲשֶׁ֛ר יִהְיֶ֥ה הָ/אוֹפַ֖ן בְּ/ת֥וֹךְ הָ/אוֹפָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/016.yaml
  text: The appearance of the wheels and their workmanship was like the gleam of beryl[a], and the four of them had the same likeness; and their appearance and their workmanship were as if a wheel were within a wheel.
translation:
  language: de
  text: Das Aussehen der Räder und ihre Machart waren wie der Glanz eines Tarschisch-Steins[a]. Alle vier hatten dieselbe Gestalt. Ihr Aussehen und ihre Machart waren, als wäre ein Rad mitten in einem Rad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Tarschisch; gemeint ist ein Edelstein, dessen genaue Art nicht sicher bestimmt werden kann. Traditionell wird er unter anderem als „Beryll“ oder „Chrysolith“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה הָאוֹפַנִּים
  choice: das Aussehen der Räder
  rationale: מַרְאֶה bezeichnet hier das sichtbare Erscheinungsbild; „Aussehen“ ist natürlich und wahrt den Bezug zur Vision.
- source_word: וּמַעֲשֵׂיהֶם
  choice: und ihre Machart
  rationale: מַעֲשֶׂה kann Werk, Ausführung oder Konstruktion bezeichnen. „Machart“ ist verständlich und erhält den Gedanken ihrer Beschaffenheit sowie die Wiederholung im Vers.
- source_word: כְּעֵין תַּרְשִׁישׁ
  choice: wie der Glanz eines Tarschisch-Steins
  rationale: עֵין bezeichnet in Verbindung mit einem Edelstein dessen sichtbare Farbe oder seinen Glanz. Da תַּרְשִׁישׁ nicht sicher identifiziert ist, bleibt die hebräische Bezeichnung im Text erhalten und wird in einer Fußnote erläutert.
- source_word: וּדְמוּת אֶחָד לְאַרְבַּעְתָּן
  choice: Alle vier hatten dieselbe Gestalt
  rationale: Die knappe Formulierung lautet wörtlich etwa „eine Gestalt für ihre vier“. Die Übersetzung gibt die gemeinsame, einheitliche Form der vier Räder klar wieder.
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: als wäre ein Rad mitten in einem Rad
  rationale: Die Formulierung bewahrt den vergleichenden, visionären Charakter und gibt בְּתוֹךְ räumlich als „mitten in“ wieder, ohne die genaue Konstruktion technisch festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Aussehen“ und „Machart“ bildet die hebräische Parallelstruktur ab. „Tarschisch-Stein“ bewahrt die lexikalische Unsicherheit des Ausgangstextes, statt eine bestimmte Mineralart vorzutäuschen.
