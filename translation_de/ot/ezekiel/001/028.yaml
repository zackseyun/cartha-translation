source:
  edition: WLC
  text: כְּ/מַרְאֵ֣ה הַ/קֶּ֡שֶׁת אֲשֶׁר֩ יִֽהְיֶ֨ה בֶ/עָנָ֜ן בְּ/י֣וֹם הַ/גֶּ֗שֶׁם כֵּ֣ן מַרְאֵ֤ה הַ/נֹּ֨גַהּ֙ סָבִ֔יב ה֕וּא מַרְאֵ֖ה דְּמ֣וּת כְּבוֹד יְהוָ֑ה וָֽ/אֶרְאֶה֙ וָ/אֶפֹּ֣ל עַל פָּנַ֔/י וָ/אֶשְׁמַ֖ע ק֥וֹל מְדַבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/028.yaml
  text: Like the appearance of the rainbow that is in the cloud on a day of rain[a], so was the appearance of the brightness all around. This was the appearance of the likeness of the glory of Yahweh. When I saw it, I fell on my face[d][c][b], and I heard the voice of one speaking.
translation:
  language: de
  text: Wie das Aussehen des Regenbogens, der an einem Regentag in der Wolke erscheint,[a] so war das Aussehen des Glanzes ringsum. Das war das Aussehen des Abbildes der Herrlichkeit Jahwes.[b] Als ich es sah, fiel ich auf mein Angesicht. Und ich hörte eine Stimme sprechen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „des Bogens“; im Zusammenhang von Wolke und Regen ist ein Regenbogen gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Formulierung lautet gestaffelt: „das Aussehen des Abbildes der Herrlichkeit Jahwes“. Sie beschreibt die Vision bewusst mit mehreren Einschränkungen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „Ich hörte die Stimme eines Sprechenden.“ Der Sprecher wird im Hebräischen in diesem Satz nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמַרְאֵה הַקֶּשֶׁת
  choice: Wie der Anblick des Bogens
  rationale: מַרְאֶה wird als „Anblick“ wiedergegeben, um das wiederholte visionäre Sehvokabular zu bewahren. קֶשֶׁת bedeutet grundsätzlich „Bogen“; der Zusammenhang mit Wolke und Regen weist auf den Regenbogen, doch die Grundbedeutung bleibt im Text sichtbar.
- source_word: אֲשֶׁר יִהְיֶה בֶעָנָן בְּיוֹם הַגֶּשֶׁם
  choice: der an einem Regentag in der Wolke erscheint
  rationale: Das hebräische „in der Wolke sein“ wird im Deutschen idiomatisch als sichtbares Erscheinen ausgedrückt, ohne den meteorologischen Bezug zu verändern.
- source_word: מַרְאֵה הַנֹּגַהּ סָבִיב
  choice: der Anblick des Glanzes ringsum
  rationale: נֹגַהּ bezeichnet Glanz, Helligkeit oder Lichtschein. „Glanz“ ist würdig und allgemein verständlich; סָבִיב wird knapp mit „ringsum“ wiedergegeben.
- source_word: מַרְאֵה דְּמוּת כְּבוֹד יְהוָה
  choice: der Anblick des Abbildes der Herrlichkeit Jahwes
  rationale: Die gestaffelte Ausdrucksweise Anblick–Abbild–Herrlichkeit wird erhalten, damit die vorsichtige, mehrfach qualifizierte Beschreibung der Gotteserscheinung nicht eingeebnet wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- source_word: וָאֶפֹּל עַל פָּנַי
  choice: fiel ich auf mein Angesicht
  rationale: Die körperlich-konkrete hebräische Wendung wird bewahrt; „Angesicht“ passt zum würdigen biblischen Register und bezeichnet die Niederwerfung.
- source_word: וָאֶשְׁמַע קוֹל מְדַבֵּר
  choice: ich hörte die Stimme eines Redenden
  rationale: Das Partizip nennt den Sprecher nicht ausdrücklich. „Eines Redenden“ erhält diese Unbestimmtheit, während קוֹל hier passend als „Stimme“ erscheint.
theological_decisions:
- issue: Mehrfach qualifizierte Beschreibung der göttlichen Erscheinung
  choice: der Anblick des Abbildes der Herrlichkeit Jahwes
  alternative: die Erscheinung der Herrlichkeit Jahwes
  rationale: Die drei hebräischen Begriffe werden nicht zu einer unmittelbaren Aussage über Gottes Wesen verkürzt. Dadurch bleiben der visionäre Charakter und die theologische Zurückhaltung des Verses erhalten.
- issue: Identität des Sprechers im Schlusssatz
  choice: die Stimme eines Redenden
  alternative: seine Stimme, die sprach
  rationale: Der hebräische Satz bestimmt den Sprecher an dieser Stelle nicht ausdrücklich. Die Übersetzung vermeidet daher eine vorzeitige Identifizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem visionärem Wiederholungsmuster („Anblick“) und der gestaffelten Qualifizierung der Gotteserscheinung. „Angesicht“ ist leicht erhöht, aber verständlich und erhält die konkrete Bildlichkeit der Niederwerfung.
