  text: וְ/גַ֨בֵּי/הֶ֔ן וְ/גֹ֥בַהּ לָ/הֶ֖ם וְ/יִרְאָ֣ה לָ/הֶ֑ם וְ/גַבֹּתָ֗/ם מְלֵאֹ֥ת עֵינַ֛יִם סָבִ֖יב לְ/אַרְבַּעְתָּֽ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/018.yaml
  text: As for their rims[a], they were high and fearsome, and the rims of all four were full of eyes all around.
translation:
  language: de
  text: 'Was ihre Felgen betrifft: Sie waren hoch und furchterregend[a], und die Felgen aller vier Räder waren ringsum voller Augen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ehrfurchtgebietend. Das hebräische Wort bezeichnet etwas, das Furcht oder Schrecken hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַבֵּיהֶן / גַבֹּתָם
  choice: ihre Felgen / die Felgen
  rationale: Im Zusammenhang mit den Rädern bezeichnet גַּב deren äußeren Ring beziehungsweise Felge. „Felgen“ ist im heutigen Deutsch anschaulich und wahrt die Wiederholung des hebräischen Begriffs.
- source_word: גֹבַהּ
  choice: hoch
  rationale: Das Substantiv bezeichnet Höhe; die prädikative Wiedergabe „sie waren hoch“ ist natürliches Deutsch und entspricht der beschreibenden hebräischen Konstruktion.
- source_word: יִרְאָה
  choice: furchterregend
  rationale: Das Wort bezeichnet hier Furcht beziehungsweise Schrecken. „Furchterregend“ drückt aus, welche Wirkung ihr Anblick hervorruft, ohne eine ausschließlich religiöse Ehrfurcht vorauszusetzen.
- source_word: לָהֶם
  choice: sie waren
  rationale: Die hebräische Zugehörigkeits- beziehungsweise Zustandskonstruktion wird idiomatisch prädikativ wiedergegeben.
- source_word: מְלֵאֹת עֵינַיִם
  choice: voller Augen
  rationale: Die enge Wiedergabe erhält das auffällige und bewusst nicht erklärte Bild.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ gibt die umfassende räumliche Bedeutung knapp und natürlich wieder.
- source_word: לְאַרְבַּעְתָּן
  choice: aller vier Räder
  rationale: Gemeint sind im unmittelbaren Kontext die vier Räder. Die Ergänzung „Räder“ macht den Bezug im Deutschen eindeutig, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Bedeutung von יִרְאָה
  choice: furchterregend
  alternative: ehrfurchtgebietend
  rationale: Der Text beschreibt die Furcht auslösende Erscheinung, legt aber nicht eindeutig fest, ob Schrecken oder ehrfürchtiges Staunen im Vordergrund steht. Die Hauptübersetzung wahrt die starke Grundbedeutung; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „Felgen“ und das fremdartige Bild der ringsum vorhandenen Augen bleiben erhalten.
