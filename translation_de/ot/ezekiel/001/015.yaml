  terminology: „Lebende Wesen“ ist als nicht voreilig identifizierende Bezeichnung passend. „Rad“ und „Gesichter“ sind beizubehalten. „Entsprechend den vier Gesichtern eines jeden“ gibt die distributive Lesart wieder, ohne eine konkrete mechanische oder räumliche Konstruktion zu behaupten.
