  text: וָ/אֵ֖רֶא הַ/חַיּ֑וֹת וְ/הִנֵּה֩ אוֹפַ֨ן אֶחָ֥ד בָּ/אָ֛רֶץ אֵ֥צֶל הַ/חַיּ֖וֹת לְ/אַרְבַּ֥עַת פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/015.yaml
  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
translation:
  language: de
  text: Als ich die lebenden Wesen ansah, siehe, da war ein Rad auf der Erde neben den lebenden Wesen, entsprechend den vier Gesichtern eines jeden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „zu seinen vier Gesichtern“. Die knappe hebräische Formulierung kann auch „seinen vier Gesichtern zugeordnet“ bedeuten. Das Singularsuffix kann distributiv auf jedes der lebenden Wesen bezogen sein; die genaue Beziehung des Rades zu dessen vier Gesichtern bleibt offen.'
    reason: Mehrdeutiger Bezug und Verhältnis in לְאַרְבַּעַת פָּנָיו.
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Als ich … betrachtete, sah ich
  rationale: Die Form führt den Visionsbericht weiter. Die deutsche Wendung gibt sowohl das aufmerksame Hinschauen als auch die anschließende Wahrnehmung natürlich wieder.
- source_word: הַחַיּוֹת
  choice: die lebenden Wesen
  rationale: חַיּוֹת bezeichnet hier die belebten Wesen der Vision. „Lebende Wesen“ ist verständlich und vermeidet eine vorzeitige Festlegung ihrer Identität.
- source_word: וְהִנֵּה
  choice: Da war
  rationale: הִנֵּה lenkt die Aufmerksamkeit unvermittelt auf ein neues Element der Vision. Die Voranstellung „Da war“ vermittelt diesen deiktischen Effekt in natürlichem modernem Deutsch.
- source_word: אוֹפַן אֶחָד
  choice: ein Rad
  rationale: אֶחָד hebt ein einzelnes Rad hervor. Im Deutschen gibt „ein Rad“ den Singular idiomatisch wieder, ohne durch „ein einziges Rad“ einen nicht zwingenden Ausschluss weiterer Räder auszudrücken.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: Die Wendung bezeichnet die Lage des Rades unten auf der Erde beziehungsweise am Boden; „auf der Erde“ entspricht dem gewöhnlichen Sinn von אֶרֶץ.
- source_word: אֵצֶל
  choice: neben
  rationale: Die Präposition bezeichnet räumliche Nähe und wird knapp und genau mit „neben“ wiedergegeben.
- source_word: לְאַרְבַּעַת פָּנָיו
  choice: bei den vier Gesichtern eines jeden
  rationale: Die knappe hebräische Fügung enthält ein singularisches Suffix nach dem pluralischen „lebenden Wesen“. Die distributive Formulierung macht verständlich, dass jedes Wesen vier Gesichter hat, ohne die genaue räumliche Zuordnung des Rades stärker festzulegen als der Ausgangstext.
theological_decisions:
- issue: Bezug und Numerus in לְאַרְבַּעַת פָּנָיו
  choice: 'Distributiv: „bei den vier Gesichtern eines jeden“'
  alternative: „seinen vier Gesichtern zugeordnet“ beziehungsweise „entsprechend seinen vier Gesichtern“
  rationale: Das singularische Suffix kann sich distributiv auf jedes der zuvor genannten lebenden Wesen beziehen. Die gewählte Fassung bewahrt den Zusammenhang mit den vier Gesichtern jedes Wesens aus Vers 6, während eine Fußnote die Unsicherheit über die genaue Beziehung zwischen Rad und Gesichtern offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der visionäre Erzählton bleibt lebendig; altertümliches „siehe“ wird vermieden, ohne den aufmerksamkeitslenkenden Impuls von הִנֵּה einzuebnen.
