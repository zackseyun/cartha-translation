reference: Ezekiel 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/דְמ֣וּת פְּנֵי/הֶם֮ פְּנֵ֣י אָדָם֒ וּ/פְנֵ֨י אַרְיֵ֤ה אֶל הַ/יָּמִין֙ לְ/אַרְבַּעְתָּ֔/ם וּ/פְנֵי שׁ֥וֹר מֵֽ/הַ/שְּׂמֹ֖אול לְ/אַרְבַּעְתָּ֑/ן וּ/פְנֵי נֶ֖שֶׁר לְ/אַרְבַּעְתָּֽ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/010.yaml
  text: 'As for the likeness of their faces: each had a human face; the four had a lion’s face on the right side[a], the four had an ox’s face on the left side, and the four had an eagle’s face.'
translation:
  language: de
  text: 'Was die Gestalt ihrer Gesichter betrifft: Jedes hatte ein Menschengesicht; alle vier hatten rechts ein Löwengesicht, alle vier links ein Stiergesicht und alle vier ein Adlergesicht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geier“. Das hebräische Wort נֶשֶׁר kann allgemeiner einen großen Greifvogel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: Was die Gestalt … betrifft
  rationale: דְּמוּת bezeichnet Gestalt, Erscheinungsform oder Ähnlichkeit. Die Wendung leitet hier auf natürliche Weise die Beschreibung der Gesichter ein.
- source_word: פְּנֵיהֶם
  choice: ihrer Gesichter
  rationale: פָּנִים bezeichnet hier die Gesichter der vier Lebewesen; der deutsche Plural gibt den Bezug klar wieder.
- source_word: פְּנֵי אָדָם
  choice: ein Menschengesicht
  rationale: אָדָם bezeichnet in diesem Gegensatz zu Tiergesichtern den Menschen als Art, nicht eigens einen männlichen Menschen.
- source_word: אַרְיֵה
  choice: Löwengesicht
  rationale: אַרְיֵה bedeutet eindeutig „Löwe“; das zusammengesetzte Substantiv ist im Deutschen knapp und anschaulich.
- source_word: אֶל הַיָּמִין
  choice: rechts
  rationale: Die Präpositionalgruppe bezeichnet die rechte Seite; „rechts“ ist idiomatisch und räumlich eindeutig.
- source_word: לְאַרְבַּעְתָּם / לְאַרְבַּעְתָּן
  choice: alle vier hatten
  rationale: Die wiederholte Formulierung bezieht die jeweilige Gesichtsform ausdrücklich auf alle vier Lebewesen. Der Wechsel des pronominalen Genus lässt sich im Deutschen nicht sinnvoll abbilden.
- source_word: שׁוֹר
  choice: Stier
  rationale: שׁוֹר bezeichnet ein Rind, besonders Stier oder Ochse. „Stiergesicht“ ist in dieser visionären Aufzählung natürlich und prägnant.
- source_word: מֵהַשְּׂמֹאול
  choice: links
  rationale: 'Obwohl die Präposition wörtlich „von“ lautet, hat die Formulierung hier räumlich-lokative Bedeutung: auf der linken Seite.'
- source_word: נֶשֶׁר
  choice: Adler
  rationale: נֶשֶׁר bezeichnet einen großen Greifvogel und wird traditionell sowie kontextgemäß mit „Adler“ wiedergegeben; „Geier“ bleibt als mögliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Beschreibung der Lebewesen
  choice: Menschengesicht
  alternative: Gesicht eines Mannes
  rationale: Der Text stellt die menschliche Gestalt Tiergestalten gegenüber. Eine ausdrückliche Festlegung auf männliches Geschlecht wäre hier nicht vom Kontext gefordert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Aussage „alle vier“ bewahrt die nachdrückliche Verteilung des hebräischen Textes; die kompakten Zusammensetzungen entsprechen dem visionären Aufzählungsstil.
