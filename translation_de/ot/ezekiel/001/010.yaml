  source_fidelity: 'Die Übersetzung gibt die Abfolge und distributive Aussage des Hebräischen zutreffend wieder: menschliches Gesicht, Löwengesicht rechts, Stiergesicht links und Adlergesicht bei allen vier Lebewesen. „Was die Gestalt ihrer Gesichter betrifft“ bildet die einleitende Funktion von וּדְמוּת פְּנֵיהֶם angemessen ab. Die räumlichen Angaben „rechts“ und „links“ sind kontextgerecht.'
