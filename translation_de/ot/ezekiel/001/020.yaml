source:
  edition: WLC
  text: עַ֣ל אֲשֶׁר֩ יִֽהְיֶה שָּׁ֨ם הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ שָׁ֥מָּ/ה הָ/ר֖וּחַ לָ/לֶ֑כֶת וְ/הָ/אוֹפַנִּ֗ים יִנָּשְׂאוּ֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/020.yaml
  text: Wherever the spirit wanted to go[a], they went there; and the wheels were lifted up alongside them[c][b], because the spirit of the living creature was in the wheels.
translation:
  language: de
  text: Wohin der Geist[a][c] gehen wollte, dahin gingen sie; und die Räder wurden neben ihnen[b] emporgehoben, denn der Geist des Lebewesens war in den Rädern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Wind« beziehungsweise »Atem«; das hebräische Wort רוּחַ kann alle diese Bedeutungen haben. Hier bezeichnet es die belebende oder lenkende Kraft in der Vision.
    reason: lexical_alternative
  - marker: b
    text: Oder »ihnen gegenüber« beziehungsweise »ihnen entsprechend«.
    reason: lexical_alternative
  - marker: c
    text: Manche verstehen »Geist« hier als Hinweis auf den Geist Gottes; der hebräische Text sagt dies nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרוּחַ / רוּחַ
  choice: der Geist / der Geist
  rationale: רוּחַ kann »Geist«, »Wind« oder »Atem« bedeuten. Im Zusammenhang bezeichnet es die belebende oder lenkende Kraft der Vision. »Geist« bewahrt diese Bedeutung, ohne den Ausdruck ausdrücklich mit Gottes Geist gleichzusetzen.
- source_word: עַל אֲשֶׁר יִהְיֶה שָּׁם
  choice: Wohin
  rationale: Die Wendung leitet hier eine unbestimmte Orts- beziehungsweise Richtungsangabe ein. Zusammen mit »dahin« gibt »Wohin … dahin« die gerichtete Bewegung natürlich wieder.
- source_word: לָלֶכֶת ... יֵלֵכוּ
  choice: gehen wollte … gingen sie
  rationale: Der Infinitiv beschreibt die vom Geist bestimmte Bewegungsrichtung; »gehen wollte« ist im Deutschen idiomatisch und lässt offen, wie genau dieses Wollen oder Lenken zu verstehen ist.
- source_word: שָׁמָּה
  choice: dahin
  rationale: Das lokale Adverb trägt Richtungsbedeutung; »dahin« gibt diese im Deutschen ausdrücklich wieder.
- source_word: הָאוֹפַנִּים
  choice: die Räder
  rationale: Der Ausdruck bezeichnet eindeutig die Räder der Vision.
- source_word: יִנָּשְׂאוּ
  choice: wurden emporgehoben
  rationale: Die passive Form des hebräischen Verbs wird durch das deutsche Passiv bewahrt; »emporgehoben« passt zur Aufwärtsbewegung innerhalb der Vision.
- source_word: לְעֻמָּתָם
  choice: neben ihnen
  rationale: Die Präposition bezeichnet eine räumliche Zuordnung oder Entsprechung. »Neben ihnen« ist im Bewegungskontext verständlich; andere mögliche Nuancen werden in der Fußnote erhalten.
- source_word: הַחַיָּה
  choice: des Lebewesens
  rationale: Der hebräische Ausdruck steht im Singular. »Lebewesen« bewahrt den grammatischen Numerus und ist im Deutschen für das visionäre Wesen angemessen.
theological_decisions:
- issue: Ob רוּחַ ausdrücklich als Gottes Geist beziehungsweise der Heilige Geist zu verstehen ist
  choice: Geist, ohne nähere Identifizierung
  alternative: Geist Gottes / Heiliger Geist
  rationale: Der hebräische Text bezeichnet die belebende oder lenkende Kraft, identifiziert sie jedoch nicht ausdrücklich als Gottes Geist. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Formulierung »Wohin … dahin« macht die Bewegungsrichtung klar. Die Wiederholung von »Geist« und »Räder« bleibt erhalten, ebenso das Passiv bei der Aufwärtsbewegung.
