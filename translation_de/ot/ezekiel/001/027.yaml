base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
translation:
  language: de
  text: Und ich sah etwas, das wie glänzendes Metall[a] aussah, wie Feuer, das ringsum darin war[b], oberhalb dessen, was wie seine Hüften aussah; und unterhalb dessen, was wie seine Hüften aussah, sah ich etwas, das wie Feuer aussah, und rings um ihn war ein heller Glanz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חַשְׁמַל (chaschmál) ist in seiner Bedeutung unsicher. Möglich sind auch „Bernstein“ oder „Elektron“, eine hell glänzende Metalllegierung.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwierig; sie enthält die Vorstellungen „innen“ und „ringsum“. Der Bezug von „darin“ ist nicht eindeutig; gemeint sein kann Feuer im Inneren oder eine ringsum eingeschlossene Feuererscheinung.
    reason: textual_difficulty
lexical_decisions:
- source_word: כְּעֵין חַשְׁמַל
  choice: etwas, das wie glänzendes Metall aussah
  rationale: Die Vergleichsform wahrt die vorsichtige Sprache der Vision. חַשְׁמַל ist selten und unsicher; „glänzendes Metall“ vermittelt den wahrscheinlich leuchtend-metallischen Eindruck, ohne einen bestimmten Stoff festzulegen.
- source_word: כְּמַרְאֵה
  choice: wie … aussah
  rationale: Die natürliche deutsche Formulierung bewahrt den wiederholten Hinweis auf eine wahrgenommene Erscheinung und vermeidet eine Gleichsetzung mit dem beschriebenen Gegenstand.
- source_word: בֵּית לָהּ סָבִיב
  choice: das ringsum in seinem Inneren war
  rationale: Die schwierige Wendung enthält die Vorstellungen von „innen“ und „ringsum“. Die Übersetzung folgt diesen räumlichen Angaben, ohne eine bestimmte Ummantelung oder Einfassung vorauszusetzen.
- source_word: מָתְנָיו
  choice: seine Hüften
  rationale: „Hüften“ ist eine verständliche heutige Wiedergabe des Körperbereichs; „Lenden“ wäre altertümlicher und „Taille“ enger festgelegt.
- source_word: נֹגַהּ
  choice: heller Glanz
  rationale: Das Wort bezeichnet leuchtende Helligkeit beziehungsweise Strahlenglanz. „Heller Glanz“ ist anschaulich und im heutigen Deutsch gut verständlich.
theological_decisions:
- issue: Bezug der männlichen Singularsuffixe in der menschenähnlichen Erscheinung
  choice: „seine Hüften“ und „rings um ihn“
  alternative: Unpersönlich „seine/deren Mitte“ und „rings darum“
  rationale: Die männlichen Singularsuffixe und der unmittelbare Zusammenhang mit der Gestalt in Menschengestalt rechtfertigen personale Pronomen. Damit wird die anthropomorphe Bildsprache bewahrt, ohne die Gestalt über den Wortlaut hinaus zu identifizieren.
- issue: Räumliche Deutung von בֵּית לָהּ סָבִיב
  choice: Feuer, das ringsum in seinem Inneren war
  alternative: Feuer, das ringsum eingeschlossen war
  rationale: Der hebräische Ausdruck ist schwierig. Die gewählte Fassung lässt offen, ob eine Einfassung, ein inneres Feuer oder eine andere räumliche Erscheinung gemeint ist, und löst die Spannung nicht dogmatisch auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Vergleichsformulierungen erhalten den tastenden Charakter der Vision; der Doppelpunkt gliedert die Beschreibung oberhalb und unterhalb der Hüften, ohne zusätzliche Sachdeutung einzuführen.
