source:
  edition: WLC
  text: בְּ/לֶכְתָּ֣/ם יֵלֵ֔כוּ וּ/בְ/עָמְדָ֖/ם יַֽעֲמֹ֑דוּ וּֽ/בְ/הִנָּשְׂאָ֞/ם מֵ/עַ֣ל הָ/אָ֗רֶץ יִנָּשְׂא֤וּ הָ/אֽוֹפַנִּים֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/021.yaml
  text: When they went[a], these went; and when they stood, these stood; and when they were lifted up from above the earth, the wheels were lifted up alongside them[c][b], for the spirit of the living creatures was in the wheels.
translation:
  language: de
  text: Wenn die Lebewesen gingen, gingen sie; und wenn sie stillstanden, standen sie still. Und wenn sie vom Erdboden emporgehoben wurden, wurden die Räder zugleich mit ihnen emporgehoben; denn der Geist[a] des Lebewesens[b] war in den Rädern.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Wind; oder: der Atem.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Singular; möglicherweise kollektiv auf die Lebewesen als eine Einheit bezogen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: ihnen entsprechend; ihnen gegenüber oder neben ihnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתָּם ... יֵלֵכוּ
  choice: Wenn sie gingen, gingen auch die Räder
  rationale: Die Präposition ב mit Infinitivus constructus ist temporal. Das im Hebräischen implizite Subjekt des zweiten Verbs wird im Deutschen als „die Räder“ verdeutlicht, entsprechend dem unmittelbaren Kontext.
- source_word: וּבְעָמְדָם יַעֲמֹדוּ
  choice: und wenn sie stehen blieben, blieben auch sie stehen
  rationale: עמד bezeichnet Stehen bzw. Stillstehen. „Stehen blieben“ gibt in natürlichem Deutsch den Bewegungsgegensatz zu „gingen“ wieder und bewahrt die Parallelität.
- source_word: וּבְהִנָּשְׂאָם מֵעַל הָאָרֶץ
  choice: und wenn die Lebewesen sich von der Erde erhoben
  rationale: Der Nifal von נשׂא kann „sich erheben/erhoben werden“ bedeuten. „Sich von der Erde erhoben“ ist idiomatisch und gibt מֵעַל als Bewegung aus einer Lage über bzw. an der Erde wieder, ohne das unnatürliche „von oberhalb der Erde“.
- source_word: יִנָּשְׂאוּ הָאוֹפַנִּים
  choice: erhoben sich die Räder
  rationale: Die Wiederholung von נשׂא wird durch „erhoben sich“ bewahrt und stellt die synchrone Bewegung heraus.
- source_word: לְעֻמָּתָם
  choice: zusammen mit ihnen
  rationale: Das Wort kann „ihnen gegenüber“, „ihnen entsprechend“ oder in koordinierter Zuordnung „bei/mit ihnen“ bedeuten. Im Bewegungszusammenhang drückt „zusammen mit ihnen“ die Entsprechung natürlich aus, ohne eine räumliche Gegenüberstellung festzulegen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die gleichlaufende Bewegung ein.
- source_word: רוּחַ
  choice: Geist
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. Hier bezeichnet es wahrscheinlich die belebende Kraft, ohne sie ausdrücklich mit dem Heiligen Geist gleichzusetzen; die Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: הַחַיָּה
  choice: des Lebewesens
  rationale: Der hebräische Ausdruck steht im Singular und wird daher im Haupttext formal als Singular bewahrt, obwohl er im Zusammenhang kollektiv auf die Lebewesen bezogen sein kann.
- source_word: בָּאוֹפַנִּים
  choice: war in den Rädern
  rationale: ב bezeichnet hier den Ort; „in den Rädern“ ist die direkte und natürliche Wiedergabe.
theological_decisions:
- issue: Bedeutung von רוּחַ in der Vision
  choice: Geist
  alternative: Wind oder Atem
  rationale: „Geist“ passt zum Gedanken einer belebenden Kraft, wird aber nicht als ausdrückliche Identifikation mit dem Heiligen Geist verstanden. Die lexikalischen Alternativen bleiben in der Fußnote sichtbar.
- issue: Numerus von הַחַיָּה
  choice: das Lebewesen (Singular)
  alternative: die Lebewesen (kollektiver Pluralsinn)
  rationale: Der masoretische Text hat den bestimmten Singular. Dieser wird bewahrt, während eine Fußnote auf den möglichen kollektiven Bezug auf mehrere Lebewesen hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhythmische Parallelität des hebräischen Verses wird erhalten, zugleich werden die im Deutschen nötigen Subjekte verdeutlicht. „Stehen blieben“ und „sich erhoben“ vermeiden schwerfällige Passivkonstruktionen, ohne den Bildgehalt zu verändern.
