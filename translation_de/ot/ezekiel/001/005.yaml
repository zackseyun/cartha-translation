  text: וּ/מִ֨/תּוֹכָ֔/הּ דְּמ֖וּת אַרְבַּ֣ע חַיּ֑וֹת וְ/זֶה֙ מַרְאֵֽי/הֶ֔ן דְּמ֥וּת אָדָ֖ם לָ/הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/005.yaml
  text: 'And from within it came the likeness of four living creatures[b][a]. And this was their appearance: they had the likeness of a man.'
translation:
  language: de
  text: 'Und aus ihrer Mitte kam die Gestalt von vier lebendigen Wesen[a] hervor. So sahen sie aus: Sie hatten die Gestalt eines Menschen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vier lebendige Geschöpfe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sie erschienen in menschlicher Gestalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתּוֹכָהּ
  choice: Und aus ihrer Mitte
  rationale: Die Wendung bezeichnet den Ausgangspunkt innerhalb der zuvor geschilderten Erscheinung. Das feminine Suffix nimmt diese Erscheinung aus dem Zusammenhang wieder auf.
- source_word: דְּמוּת
  choice: etwas, das … glich / die Gestalt
  rationale: דְּמוּת bezeichnet Ähnlichkeit beziehungsweise Gestalt und vermeidet eine unmittelbare Gleichsetzung. Die beiden natürlichen deutschen Formulierungen bewahren diese Zurückhaltung der Visionssprache.
- source_word: אַרְבַּע חַיּוֹת
  choice: vier lebendige Wesen
  rationale: חַיּוֹת bezeichnet hier belebte Wesen innerhalb der Vision. „Lebendige Wesen“ ist verständlich und legt sie weder auf Tiere noch ausdrücklich auf Engel fest.
- source_word: וְזֶה מַרְאֵיהֶן
  choice: So sahen sie aus
  rationale: מַרְאֶה bezeichnet das sichtbare Erscheinungsbild. Die deutsche Wendung gibt die hebräische Aussage idiomatisch und unmittelbar wieder.
- source_word: דְּמוּת אָדָם
  choice: die Gestalt eines Menschen
  rationale: אָדָם bezeichnet hier den Menschen beziehungsweise menschliche Gestalt, nicht notwendig einen bestimmten Mann. „Gestalt eines Menschen“ erhält zugleich den Vergleichscharakter von דְּמוּת.
- source_word: לָהֵנָּה
  choice: Sie hatten
  rationale: Die Präposition mit Pronomen bedeutet wörtlich „ihnen/bei ihnen“ und drückt hier idiomatisch Besitz beziehungsweise Zuordnung aus. „Sie hatten“ ist dafür natürliches modernes Deutsch.
theological_decisions:
- issue: Ontologischer Status der visionären Wesen
  choice: Die Ähnlichkeits- und Gestaltsprache bleibt erhalten; חַיּוֹת wird als „lebendige Wesen“ wiedergegeben.
  alternative: Die Wesen im Haupttext ausdrücklich als Engel oder Tiere bestimmen.
  rationale: Der Vers beschreibt, wie die Gestalten erscheinen, ohne ihr Wesen abschließend zu definieren. Die Übersetzung wahrt diese visionäre und theologische Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist flüssig, wahrt aber durch „glich“ und „Gestalt“ die vorsichtige, vergleichende Ausdrucksweise des hebräischen Visionstextes.
