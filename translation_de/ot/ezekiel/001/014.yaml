lexical_decisions:
- source_word: וְהַחַיּוֹת
  choice: Und die lebenden Wesen
  rationale: חַיּוֹת bezeichnet hier die belebten Wesen der Vision. „Lebende Wesen“ ist im Deutschen natürlich und hält die spätere Identifizierung in Hesekiel 10,20 zunächst offen.
- source_word: רָצוֹא וָשׁוֹב
  choice: liefen hin und her
  rationale: Die Verbindung der Infinitive von רוץ („laufen“) und שוב („zurückkehren“) beschreibt rasche, wiederholte Bewegung. „Liefen hin und her“ gibt dies verständlich wieder; die formnähere Alternative wird in der Fußnote bewahrt.
- source_word: כְּמַרְאֵה
  choice: wie der Anblick
  rationale: מַרְאֶה bezeichnet den Anblick bzw. die sichtbare Erscheinung. „Wie der Anblick“ erhält Hesekiels visionäre Ausdrucksweise, ohne den Vergleich unnötig auszudeuten.
- source_word: הַבָּזָק
  choice: eines Blitzes
  rationale: בָּזָק bezeichnet einen Blitz oder Blitzstrahl. Der deutsche unbestimmte Genitiv ergibt nach „Anblick“ eine natürliche Vergleichsformulierung.
