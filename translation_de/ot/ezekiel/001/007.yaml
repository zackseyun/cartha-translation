  text: וְ/רַגְלֵי/הֶ֖ם רֶ֣גֶל יְשָׁרָ֑ה וְ/כַ֣ף רַגְלֵי/הֶ֗ם כְּ/כַף֙ רֶ֣גֶל עֵ֔גֶל וְ/נֹ֣צְצִ֔ים כְּ/עֵ֖ין נְחֹ֥שֶׁת קָלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/007.yaml
  text: Their legs were straight[a], and the soles of their feet were like the sole of a calf’s foot[b], and they gleamed like the appearance of polished bronze.
translation:
  language: de
  text: Ihre Beine waren gerade, und ihre Fußsohlen waren wie die Fußsohle eines Kalbes[a]; sie glänzten wie polierte Bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »wie ein Kalbshuf«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »blanke Bronze« oder »poliertes Kupfer«. Das hebräische Wort kann Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: ihre Beine
  rationale: רֶגֶל kann »Fuß« oder »Bein« bezeichnen. Da anschließend ausdrücklich die Fußsohlen genannt werden, wahrt »Beine« die Unterscheidung des Hebräischen.
- source_word: רֶגֶל יְשָׁרָה
  choice: waren gerade
  rationale: Die singularische Wendung ist distributiv zu verstehen. »Gerade« gibt die schlichte Beschreibung wieder, ohne eine bestimmte Körperhaltung hineinzulesen.
- source_word: כַּף רַגְלֵיהֶם
  choice: ihre Fußsohlen
  rationale: כַּף bezeichnet bei Körperteilen die Handfläche beziehungsweise die Fußsohle; »Fußsohlen« ist hier die natürliche deutsche Entsprechung.
- source_word: כְּכַף רֶגֶל עֵגֶל
  choice: glichen der Sohle eines Kalbsfußes
  rationale: Diese Wiedergabe bewahrt die ausdrückliche anatomische Formulierung des Hebräischen. Das knappere »einem Kalbshuf« wird als idiomatische Alternative in der Fußnote genannt.
- source_word: וְנֹצְצִים
  choice: Sie glänzten
  rationale: Das Partizip beschreibt einen hellen, schimmernden oder funkelnden Eindruck. »Glänzten« ist im Deutschen anschaulich und natürlich.
- source_word: כְּעֵין
  choice: wie
  rationale: Die Wendung bedeutet hier »wie das Aussehen von«. Im Deutschen bringt der unmittelbare Vergleich mit dem Material denselben Sinn natürlicher zum Ausdruck.
- source_word: נְחֹשֶׁת קָלָל
  choice: polierte Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; קָלָל beschreibt hier wahrscheinlich ein blankes, poliertes oder glänzendes Aussehen. »Polierte Bronze« ist klar und passt zur Metallbildsprache, während die sachliche Unsicherheit in der Fußnote erhalten bleibt.
theological_decisions: []
