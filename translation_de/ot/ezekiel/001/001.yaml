id: EZK.1.1
reference: Ezekiel 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י בִּ/שְׁלֹשִׁ֣ים שָׁנָ֗ה בָּֽ/רְבִיעִי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ וַ/אֲנִ֥י בְ/תֽוֹךְ הַ/גּוֹלָ֖ה עַל נְהַר כְּבָ֑ר נִפְתְּחוּ֙ הַ/שָּׁמַ֔יִם וָ/אֶרְאֶ֖ה מַרְא֥וֹת אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/001.yaml
  text: It happened in the thirtieth year[a], in the fourth month, on the fifth day of the month, while I was among the exiles by the Kebar River, the heavens were opened[b], and I saw visions of God.
translation:
  language: de
  text: 'Es geschah im dreißigsten Jahr, im vierten Monat, am fünften Tag des Monats: Während ich unter den Verschleppten am Fluss Kebar[a] war, wurden die Himmel geöffnet, und ich sah Visionen Gottes.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise „am Kanal Kebar“. Das hebräische Wort bedeutet „Fluss“ oder „Strom“; bei dem Wasserlauf in Babylonien könnte es sich um einen großen Kanal gehandelt haben.
    reason: Historisch-geografische Erläuterung zur Art des Wasserlaufs.
  - marker: b
    text: 'Auch möglich: „göttliche Visionen“ oder „Visionen von Gott“.'
    reason: Die hebräische Genitivverbindung lässt Herkunft, Qualität oder Inhalt der Visionen offen.
lexical_decisions:
- source_word: וַיְהִי
  choice: Es geschah
  rationale: Die narrative Form von היה eröffnet den Bericht. „Es geschah“ gibt diese Funktion würdig und ohne einen im Hebräischen nicht ausdrücklich vorhandenen Zeitadverb-Zusatz wieder.
- source_word: בִּשְׁלֹשִׁים שָׁנָה
  choice: im dreißigsten Jahr
  rationale: Die Verbindung bezeichnet idiomatisch eine Jahresangabe. Welches Ereignis den Ausgangspunkt der Zählung bildet, bleibt wie im Hebräischen offen.
- source_word: בָּרְבִיעִי
  choice: im vierten Monat
  rationale: „Monat“ ist in der Datierungsformel sinngemäß ergänzt und wird im Deutschen zur Klarheit benötigt.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: am fünften Tag des Monats
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Datierungsformel; „Tag“ ist im Ausgangstext vorausgesetzt.
- source_word: וַאֲנִי
  choice: Während ich … war
  rationale: Die Form leitet hier eine begleitende Umstandsangabe ein. Die temporale Unterordnung bildet den Zusammenhang im Deutschen klar ab.
- source_word: בְתוֹךְ הַגּוֹלָה
  choice: unter den Verschleppten
  rationale: Das Kollektiv bezeichnet die aus ihrer Heimat deportierte Gemeinschaft. „Verschleppte“ ist verständlich und bewahrt stärker als „Exilierte“ den Zwangscharakter.
- source_word: עַל נְהַר כְּבָר
  choice: am Fluss Kebar
  rationale: עַל bezeichnet hier die Lage an einem Wasserlauf; נְהַר wird direkt mit „Fluss“ wiedergegeben. Dass es sich historisch möglicherweise um einen Kanal handelte, wird in einer Fußnote vermerkt.
- source_word: נִפְתְּחוּ הַשָּׁמַיִם
  choice: wurden die Himmel geöffnet
  rationale: Die Wiedergabe erhält sowohl die passive Verbform als auch den Plural von שָׁמַיִם und bewahrt den erhabenen visionären Ton.
- source_word: וָאֶרְאֶה
  choice: und ich sah
  rationale: Die einfache narrative Fortsetzung verbindet die Öffnung der Himmel mit der Wahrnehmung des Propheten.
- source_word: מַרְאוֹת אֱלֹהִים
  choice: Visionen Gottes
  rationale: Die knappe Genitivverbindung entspricht der hebräischen Konstruktion und legt nicht fest, ob Gott Quelle, Inhalt oder nähere Bestimmung der Visionen ist.
theological_decisions:
- issue: Bedeutung des Genitivs in מַרְאוֹת אֱלֹהִים
  choice: Visionen Gottes
  alternative: göttliche Visionen; Visionen von Gott
  rationale: Die hebräische Genitivverbindung kann die göttliche Herkunft oder Qualität der Visionen bezeichnen, aber auch Gott als ihren Inhalt verstehen lassen. Die Hauptübersetzung bewahrt diese Mehrdeutigkeit.
- issue: Numerus und Passiv in נִפְתְּחוּ הַשָּׁמַיִם
  choice: wurden die Himmel geöffnet
  alternative: öffnete sich der Himmel
  rationale: Die gewählte Form bewahrt das grammatische Passiv und den hebräischen Plural, ohne ausdrücklich zu benennen, wer die Himmel öffnete.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Datierungsformel bleibt knapp, und der ungeklärte Bezug des „dreißigsten Jahres“ wird nicht ergänzt. „Die Himmel“ ist im heutigen Deutsch markierter als der Singular, bewahrt hier aber bewusst Form und visionären Klang des hebräischen Textes.
