source:
  edition: WLC
  text: וּ/דְמ֨וּת הַ/חַיּ֜וֹת מַרְאֵי/הֶ֣ם כְּ/גַחֲלֵי אֵ֗שׁ בֹּֽעֲרוֹת֙ כְּ/מַרְאֵ֣ה הַ/לַּפִּדִ֔ים הִ֕יא מִתְהַלֶּ֖כֶת בֵּ֣ין הַ/חַיּ֑וֹת וְ/נֹ֣גַהּ לָ/אֵ֔שׁ וּ/מִן הָ/אֵ֖שׁ יוֹצֵ֥א בָרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/013.yaml
  text: And as for the likeness of the living creatures[a], their appearance was like burning coals of fire, like the appearance of torches; it was moving about among the living creatures, and the fire had brightness[c][b], and from the fire lightning was coming forth.
translation:
  language: de
  text: 'Und was die Gestalt der Lebewesen betrifft: Ihr Aussehen war wie glühende Feuerkohlen[a], wie das Aussehen von Fackeln. Es bewegte sich zwischen den Lebewesen hin und her[b]. Das Feuer strahlte hell[c], und aus dem Feuer kam ein Blitz hervor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie brennende Feuerkohlen“ oder „wie feurige Kohlen, die brannten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Es bewegte sich unter den Lebewesen umher.“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Und Helligkeit war dem Feuer“; gemeint ist, dass das Feuer strahlte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת הַחַיּוֹת
  choice: Und was die Gestalt der Lebewesen betrifft
  rationale: „Gestalt“ gibt דְמוּת wieder, ohne es mit dem unmittelbar folgenden מַרְאֵיהֶם gleichzusetzen. Die eröffnende Wendung bildet die thematische Konstruktion des Hebräischen natürlich nach.
- source_word: מַרְאֵיהֶם
  choice: ihr Aussehen
  rationale: Die Wiedergabe bewahrt das Possessivsuffix und die bewusste Wiederholung der visuellen Beschreibung nach „Gestalt“.
- source_word: כְגַחֲלֵי אֵשׁ בֹּעֲרוֹת
  choice: wie glühende Feuerkohlen
  rationale: „Feuerkohlen“ entspricht גַחֲלֵי אֵשׁ; „glühend“ vermittelt im Deutschen natürlich den sichtbaren Zustand aktiv brennender Kohlen. Die wörtlichere Alternative steht in der Fußnote.
- source_word: כְּמַרְאֵה הַלַּפִּדִים
  choice: wie das Aussehen von Fackeln
  rationale: Die Formulierung erhält sowohl מַרְאֵה als auch das konkrete Bild der לַפִּדִים.
- source_word: הִיא מִתְהַלֶּכֶת
  choice: Es bewegte sich ... hin und her
  rationale: Das unpersönliche „Es“ lässt den genauen Bezug des femininen Pronomens offen; „hin und her“ bringt den wiederholten beziehungsweise umhergehenden Charakter des Hitpael zum Ausdruck.
- source_word: בֵּין הַחַיּוֹת
  choice: zwischen den Lebewesen
  rationale: „Zwischen“ ist die direkte Entsprechung von בֵּין und passt zur Bewegung innerhalb der Gruppe.
- source_word: וְנֹגַהּ לָאֵשׁ
  choice: Das Feuer strahlte hell
  rationale: Die idiomatische deutsche Formulierung gibt die dem Feuer zukommende Helligkeit beziehungsweise Strahlkraft wieder, ohne ein zusätzliches Objekt einzuführen.
- source_word: וּמִן הָאֵשׁ יוֹצֵא בָרָק
  choice: und aus dem Feuer kam ein Blitz hervor
  rationale: „Hervorkommen“ bildet יצא ab; der Singular „ein Blitz“ wahrt den Numerus von בָּרָק. Die Verlaufsbedeutung des Partizips ist im Deutschen aus dem visionären Zusammenhang erkennbar.
theological_decisions:
- issue: Bezug des femininen Singularpronomens הִיא
  choice: Unpersönliches „Es“, ohne einen eindeutigen Bezug festzulegen
  alternative: „Das Feuer bewegte sich“ oder „Die Erscheinung bewegte sich“
  rationale: Der Zusammenhang spricht für das feurige Phänomen beziehungsweise dessen Erscheinung, doch der genaue grammatische Bezug bleibt offen. „Es“ bewahrt diese Unbestimmtheit und vermeidet eine Personifizierung oder Festlegung auf ein einzelnes Lebewesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte visuelle Beschreibung mit „Gestalt“ und „Aussehen“ bleibt erhalten; kurze Hauptsätze machen die dichte Vision verständlich, ohne ihre Fremdartigkeit oder die Unklarheit des Pronominalbezugs aufzulösen.
