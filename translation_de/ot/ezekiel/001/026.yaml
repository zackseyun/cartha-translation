  text: וּ/מִ/מַּ֗עַל לָ/רָקִ֨יעַ֙ אֲשֶׁ֣ר עַל רֹאשָׁ֔/ם כְּ/מַרְאֵ֥ה אֶֽבֶן סַפִּ֖יר דְּמ֣וּת כִּסֵּ֑א וְ/עַל֙ דְּמ֣וּת הַ/כִּסֵּ֔א דְּמ֞וּת כְּ/מַרְאֵ֥ה אָדָ֛ם עָלָ֖י/ו מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/026.yaml
  text: And above the expanse that was over their heads was the likeness of a throne[a], in appearance like sapphire stone; and above the likeness of the throne was a likeness with the appearance of a man above it.
translation:
  language: de
  text: Und über der Fläche, die über ihren Köpfen war, befand sich die Gestalt eines Thrones, die im Aussehen einem Saphirstein glich[a]. Und über der Gestalt des Thrones war eine Gestalt, die im Aussehen einem Menschen glich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Lapislazulistein“; welcher Edelstein mit dem hebräischen Wort sappir genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָקִיעַ
  choice: Fläche
  rationale: Im Zusammenhang der Vision bezeichnet das Wort die ausgebreitete, plattformartige Fläche über den lebenden Wesen. „Fläche“ ist modern und vermeidet die altertümliche sowie kosmologisch stärker festgelegte Wiedergabe „Firmament“.
- source_word: כְּמַרְאֵה
  choice: dem Aussehen nach wie / das wie … aussah
  rationale: Die variierte Wiedergabe erhält die wiederholte Sprache des sichtbaren Eindrucks und zugleich ein natürliches modernes Deutsch; sie kennzeichnet Ähnlichkeit statt unmittelbarer Gleichsetzung.
- source_word: אֶבֶן סַפִּיר
  choice: Saphirstein
  rationale: Die traditionelle Edelsteinbezeichnung bleibt erhalten; „-stein“ entspricht אֶבֶן und macht deutlich, dass ein Stein und nicht bloß eine Farbe gemeint ist. Die genaue antike Mineralbestimmung bleibt unsicher.
- source_word: דְּמוּת
  choice: etwas wie / Gebilde
  rationale: „Etwas wie“ ist bei der ersten Konstruktion idiomatisch; „Gebilde“ bewahrt bei den weiteren Vorkommen die vorsichtige, analogische Beschreibung, ohne eine unmittelbare Identität zu behaupten.
- source_word: כִּסֵּא
  choice: Thron
  rationale: Der königliche Visionskontext verlangt die Bedeutung „Thron“ statt des allgemeineren „Sitz“.
- source_word: אָדָם
  choice: Mensch
  rationale: Gemeint ist eine einzelne menschlich erscheinende Gestalt. Das deutsche „Mensch“ gibt אָדָם hier natürlich wieder, ohne die Gestalt mit der Menschheit insgesamt gleichzusetzen.
- source_word: עָלָיו מִלְמָעְלָה
  choice: oben über dem Gebilde des Thrones
  rationale: Die Formulierung bewahrt beide räumlichen Elemente des Hebräischen und vermeidet die nicht ausdrücklich genannte Aussage, die Gestalt habe auf dem Thron gesessen.
theological_decisions:
- issue: Anthropomorphe Beschreibung der Gestalt über dem Thron
  choice: „ein Gebilde, das wie ein Mensch aussah“
  alternative: „jemand, der wie ein Mensch aussah“ oder „eine menschliche Gestalt“
  rationale: Die Wiedergabe erhält sowohl דְּמוּת als auch die Vergleichsformel כְּמַרְאֵה und damit Hesekiels abgestufte Sprache der Ähnlichkeit. Sie identifiziert die göttliche Erscheinung weder schlicht mit einem menschlichen Körper noch beseitigt sie deren menschenähnlichen Charakter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Vergleichs- und Erscheinungssprache des hebräischen Visionstextes wird bewusst erhalten. „Gebilde“ dient als natürliche, aber zurückhaltende Entsprechung für דְּמוּת; die Syntax vermeidet den im Hebräischen nicht ausdrücklich enthaltenen Zusatz, die menschenähnliche Gestalt habe auf dem Thron gesessen.
