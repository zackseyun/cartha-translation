revisions:
- from: Und über der Fläche, die sich über ihren Köpfen befand, war etwas wie ein Thron, dem Aussehen nach wie ein Saphirstein[a]. Und oben über dem Gebilde des Thrones war ein Gebilde, das wie ein Mensch aussah.
  to: Und über der Fläche, die über ihren Köpfen war, befand sich die Gestalt eines Thrones, die im Aussehen einem Saphirstein glich[a]. Und über der Gestalt des Thrones war eine Gestalt, die im Aussehen einem Menschen glich.
  rationale: 'Die Revision ersetzt die unnatürliche und inkonsistente Wortwahl „Gebilde“ durch „Gestalt“ und macht damit die dreifache vorsichtige Beschreibung der Erscheinung nachvollziehbar: Gestalt eines Thrones, Gestalt über dem Thron und menschenähnliches Aussehen. Sie erhält die räumliche Anordnung des Hebräischen, ohne zu behaupten, die Gestalt sitze auf dem Thron. Die Edelstein-Fußnote bleibt erhalten.'
