source:
  edition: WLC
  text: וָ/אֵ֡רֶא וְ/הִנֵּה֩ ר֨וּחַ סְעָרָ֜ה בָּאָ֣ה מִן הַ/צָּפ֗וֹן עָנָ֤ן גָּדוֹל֙ וְ/אֵ֣שׁ מִתְלַקַּ֔חַת וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִ֑יב וּ/מִ֨/תּוֹכָ֔/הּ כְּ/עֵ֥ין הַ/חַשְׁמַ֖ל מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/004.yaml
  text: And I looked[a], and behold, a storm wind was coming from the north, a great cloud with fire flashing continually, and brightness all around it; and from its midst was something like the appearance of glowing metal[c][b], from the midst of the fire.
translation:
  language: de
  text: 'Und ich sah: Siehe, ein Sturmwind[a] kam von Norden her, eine große Wolke und ständig aufloderndes Feuer[b]. Rings um sie war ein heller Glanz, und aus ihrer Mitte, mitten aus dem Feuer, erschien etwas wie glühendes Metall[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wirbelwind“. Die hebräische Wendung bezeichnet einen heftigen Sturm; ob ausdrücklich eine wirbelnde Bewegung gemeint ist, bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Form ist schwierig. Traditionell auch: „Feuer, das sich ineinanderschlug“; wahrscheinlich ist fortwährend bewegtes oder immer neu aufloderndes Feuer gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch chaschmál, ein seltenes Wort von unsicherer Bedeutung; möglicherweise ist Elektron, eine glänzende Metalllegierung, oder ein bernsteinartiger Glanz gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 'Und ich sah: Siehe'
  rationale: „Ich sah“ gibt ראה unmittelbar wieder; „siehe“ bewahrt die Aufmerksamkeit lenkende und die Vision vergegenwärtigende Kraft von הִנֵּה. Der Doppelpunkt macht die Folge im heutigen Deutsch lesbar.
- source_word: רוּחַ סְעָרָה
  choice: ein Sturmwind
  rationale: Die Wortgruppe bezeichnet einen heftigen, stürmischen Wind. „Sturmwind“ bleibt lexikalisch transparent und legt anders als „Wirbelwind“ keine bestimmte Rotationsform fest.
- source_word: בָּאָה מִן הַצָּפוֹן
  choice: kam von Norden her
  rationale: Die Form schildert das Herankommen innerhalb der Vision. Das deutsche Präteritum ist natürlich und „von Norden her“ bildet die Herkunftsrichtung klar ab.
- source_word: עָנָן גָּדוֹל
  choice: eine große Wolke
  rationale: Die schlichte Wiedergabe bewahrt Größe und Würde des Bildes, ohne es weiter auszudeuten.
- source_word: אֵשׁ מִתְלַקַּחַת
  choice: ständig aufloderndes Feuer
  rationale: Die schwierige reflexive Form beschreibt offenbar Feuer in fortwährender, sich erneuernder Bewegung. „Auflodernd“ vermittelt diese Dynamik, ohne die unsichere Bildvorstellung als präzisen Vorgang festzulegen.
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: Rings um sie war ein heller Glanz
  rationale: נֹגַהּ bezeichnet Helligkeit oder Glanz, סָבִיב das Umgebende. Das feminine Pronomen bezieht sich im Deutschen natürlich auf die Wolke, ohne den gesamten Erscheinungskomplex auszuschließen.
- source_word: וּמִתּוֹכָהּ ... מִתּוֹךְ הָאֵשׁ
  choice: aus ihrer Mitte, mitten aus dem Feuer
  rationale: Die Wiederholung von „Mitte“ bewahrt die gestufte räumliche Darstellung des Hebräischen und bleibt zugleich idiomatisch.
- source_word: כְּעֵין הַחַשְׁמַל
  choice: etwas wie glühendes Metall
  rationale: כְּעֵין kennzeichnet einen vorsichtigen Erscheinungsvergleich. חַשְׁמַל ist ein seltenes, unsicheres Wort; „glühendes Metall“ gibt den leuchtend-metallischen Eindruck wieder, ohne eine bestimmte Legierung zu behaupten.
theological_decisions:
- issue: Deutung der visionären, theophanischen Erscheinung
  choice: 'Vergleichende, phänomenologische Sprache: „etwas wie glühendes Metall“'
  alternative: Das Material bestimmt als „Bernstein“ oder „Elektron“ benennen
  rationale: Der hebräische Text beschreibt die Erscheinung analogisch und verwendet ein seltenes, nicht sicher bestimmbares Substantiv. Die Übersetzung wahrt diese Unbestimmtheit, statt die Vision materiell oder theologisch genauer festzulegen, als es die Quelle erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst visionärem Ton. „Siehe“ bleibt als gehobenes Signalwort erhalten, während Satzbau und Bildsprache für heutige Leser verständlich gehalten werden. Die Wiederholung der räumlichen Mitte und die Unsicherheit der beiden schwierigen Bildausdrücke werden nicht eingeebnet.
