source:
  edition: WLC
  text: הָיֹ֣ה הָיָ֣ה דְבַר יְ֠הוָה אֶל יְחֶזְקֵ֨אל בֶּן בּוּזִ֧י הַ/כֹּהֵ֛ן בְּ/אֶ֥רֶץ כַּשְׂדִּ֖ים עַל נְהַר כְּבָ֑ר וַ/תְּהִ֥י עָלָ֛י/ו שָׁ֖ם יַד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/003.yaml
  text: the word of Yahweh came indeed to Ezekiel son of Buzi[a], the priest, in the land of the Chaldeans by the Kebar River[c][b], and there the hand of Yahweh came upon him.
translation:
  language: de
  text: Das Wort Jahwes erging tatsächlich an Ezechiel, den Sohn Busis, den Priester,[a] im Land der Chaldäer[b] am Fluss Kebar,[c] und dort kam die Hand Jahwes über ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Den Priester“ wird gewöhnlich auf Ezechiel bezogen; nach der hebräischen Wortstellung kann die Bezeichnung formal auch zu seinem Vater Busi gehören.
    reason: syntaktische_ambiguität
  - marker: b
    text: 'Oder: „im Land der Babylonier“. Wörtlich steht im Hebräischen „Chaldäer“.'
    reason: lexikalische_alternative
  - marker: c
    text: 'Der Kebar war wahrscheinlich ein Kanal in Babylonien; daher auch: „am Kebar-Kanal“.'
    reason: historisch_geografische_alternative
lexical_decisions:
- source_word: הָיֹה הָיָה
  choice: erging … mit Gewissheit
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Form von היה verstärkt die Aussage. „Mit Gewissheit“ gibt diese Betonung in natürlichem Deutsch wieder, ohne die hebräische Konstruktion mechanisch nachzuahmen.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel wird mit „Wort“ wiedergegeben; dies bewahrt sowohl ihren formalen Charakter als auch ihre theologische Weite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יְחֶזְקֵאל בֶּן בּוּזִי
  choice: Ezechiel, den Sohn Busis
  rationale: Die etablierten deutschen Namensformen werden verwendet; das Abstammungsverhältnis bleibt ausdrücklich erhalten.
- source_word: הַכֹּהֵן
  choice: den Priester
  rationale: Die substantivische Apposition wird direkt wiedergegeben. Ihre Stellung nach dem Patronym lässt formal offen, ob sie Ezechiel oder Busi näher bezeichnet; diese Ambiguität wird in einer Fußnote benannt.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: im Land der Chaldäer
  rationale: „Chaldäer“ entspricht dem hebräischen Volksnamen unmittelbar; die kontextuell mögliche geografische Wiedergabe „Babylonier“ wird in der Fußnote genannt.
- source_word: עַל נְהַר כְּבָר
  choice: am Fluss Kebar
  rationale: עַל ist hier lokal zu verstehen. „Fluss Kebar“ folgt der herkömmlichen Bezeichnung, während die mögliche Identifikation als Kanal in der Fußnote erhalten bleibt.
- source_word: וַתְּהִי עָלָיו שָׁם יַד יְהוָה
  choice: und dort kam die Hand Jahwes über ihn
  rationale: Die Wiedergabe erhält das konkrete prophetische Bild der „Hand Jahwes“ und den ereignishaften Charakter der Verbform, ohne das Bild vorschnell als Kraft, Inspiration oder Zwang auszulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Die prophetische Wendung „Hand Jahwes“
  choice: das Bild wörtlich als „die Hand Jahwes“ bewahren
  alternative: die Macht Jahwes / Jahwe ergriff ihn
  rationale: Das Bild kann göttliche Wirksamkeit, Offenbarung, Bevollmächtigung oder überwältigenden Zugriff bezeichnen. Die wörtliche Wiedergabe hält diese Bedeutungsweite offen.
- issue: Bezug von הַכֹּהֵן („der Priester“)
  choice: im Haupttext syntaktisch offen belassen und die Mehrdeutigkeit anmerken
  alternative: eindeutig auf Ezechiel oder eindeutig auf Busi beziehen
  rationale: Die Wortstellung erlaubt formal beide Bezüge, auch wenn Ezechiel gewöhnlich als der Priester verstanden wird. Eine eindeutige Festlegung im Haupttext würde die vorhandene Ambiguität stärker auflösen als nötig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Formel und konkreter Bildsprache. „Mit Gewissheit“ trägt die hebräische Emphase idiomatisch; „kam … über ihn“ hält den Schluss ereignishaft und vermeidet eine rein statische oder deutende Paraphrase.
