  text: עַל אַרְבַּ֥עַת רִבְעֵי/הֶ֖ן בְּ/לֶכְתָּ֣/ם יֵלֵ֑כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/017.yaml
  text: As they went[a], they went in any of their four directions; they did not turn as they went.
translation:
  language: de
  text: Wenn sie gingen, gingen sie nach ihren vier Seiten hin; sie wandten sich beim Gehen nicht um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶן
  choice: nach jeder ihrer vier Seiten
  rationale: Die Wendung bezeichnet die räumliche Ausrichtung der Bewegung. „Seiten“ bewahrt die Grundbedeutung von רְבָעִים, während „nach“ im Deutschen eine Bewegung in der jeweiligen Ausrichtung natürlich ausdrückt. „Jeder“ verdeutlicht idiomatisch, dass Bewegung zu allen vier Seiten möglich war, ohne eine fünfte Richtung einzuführen.
- source_word: בְּלֶכְתָּם
  choice: wenn sie sich bewegten
  rationale: Der Infinitiv mit ב bezeichnet eine gleichzeitige Handlung. „Sich bewegten“ gibt den Vorgang natürlich wieder und vermeidet zunächst die unmittelbare Wiederholung von „gingen“.
- source_word: יֵלֵכוּ
  choice: gingen sie
  rationale: Das Imperfekt beschreibt hier die charakteristische Bewegung innerhalb der Vision; das deutsche Präteritum passt zur erzählenden Beschreibung.
- source_word: לֹא יִסַּבּוּ
  choice: sie wandten sich nicht um
  rationale: Die Verneinung mit dem Nifal von סבב besagt, dass sie beim Richtungswechsel keine Wendung vollzogen. „Sich umwenden“ bleibt nahe am Bild und vermeidet die stärkere Auslegung „die Richtung nicht ändern“.
- source_word: בְּלֶכְתָּן
  choice: wenn sie gingen
  rationale: Auch die zweite Konstruktion mit ב ist temporal. Die Wiederaufnahme von „gingen“ bewahrt die auffällige Wiederholung des Hebräischen; der Wechsel des Genus im Suffix wird im Deutschen nicht sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die räumliche Mehrdeutigkeit von „vier Seiten“ beziehungsweise „vier Richtungen“ bleibt in Text und Fußnote erhalten; die Wiederholung des Bewegungsverbs wird teilweise bewahrt.
