revisions:
- from: Wenn sie sich bewegten[a], gingen sie nach jeder ihrer vier Seiten; sie wandten sich nicht um, wenn sie gingen.
  to: Wenn sie gingen, gingen sie nach ihren vier Seiten hin; sie wandten sich beim Gehen nicht um.
  rationale: Die Formulierung „nach ihren vier Seiten hin“ ersetzt die überbestimmende Wendung „nach jeder ihrer vier Seiten“ und bewahrt die im Hebräischen vorhandene räumliche Mehrdeutigkeit. Die doppelte Bewegungsformel und die Aussage, dass sie sich nicht umwandten, bleiben erhalten. Die Fußnote bietet die idiomatische Deutung mit „Richtungen“ als echte lexikalische Alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:01:57Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur mit zweimaliger Bewegungsformel und der Aussage, dass keine Wendung erfolgte, ist zutreffend. „Nach jeder ihrer vier Seiten“ legt jedoch im Deutschen nahe, dass sie sich zu jeder einzelnen Seite bewegten, während das Hebräische die Bewegung in Bezug auf ihre vier Seiten/Quartiere beschreibt, ohne diese Verteilung genauer festzulegen.
  naturalness: Der Entwurf ist überwiegend verständlich, doch „nach jeder ihrer vier Seiten“ ist in diesem Zusammenhang weniger idiomatisch und semantisch zu bestimmt. Die Wiederholung von „wenn sie gingen“ ist im Deutschen als bewusste Nähe zur hebräischen Wiederholung möglich; „beim Gehen“ im zweiten Satz wirkt zugleich flüssig.
  terminology: „Sich umwenden“ gibt יִסַּבּוּ angemessen wieder. „Seiten“ bewahrt die räumliche Bildsprache von רִבְעֵיהֶן; die mögliche Deutung als Richtungen sollte in der Fußnote stehen bleiben. Die im Hebräischen unterschiedlichen grammatischen Suffixe werden im Deutschen nicht künstlich aufgelöst.
  issues:
  - severity: medium
    issue: „nach jeder ihrer vier Seiten“ ist überbestimmt.
    rationale: „Jeder“ kann bedeuten, dass die Bewegung nacheinander oder zugleich zu allen vier Seiten erfolgte. Der hebräische Ausdruck nennt die vier Seiten/Quartiere, bestimmt aber nicht ausdrücklich eine solche Verteilung. „Nach ihren vier Seiten hin“ bleibt näher an der Formulierung und wahrt die räumliche Offenheit.
  revised_text: Wenn sie gingen, gingen sie nach ihren vier Seiten hin; sie wandten sich beim Gehen nicht um.
  revised_footnotes:
  - marker: a
    text: 'Oder: „Wenn sie gingen, gingen sie in jede ihrer vier Richtungen; sie wandten sich beim Gehen nicht um.“ Der hebräische Ausdruck kann räumliche Seiten oder die entsprechenden Richtungen bezeichnen.'
    reason: lexical_alternative
