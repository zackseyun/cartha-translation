  text: וָ/אֶשְׁמַ֣ע אֶת ק֣וֹל כַּנְפֵי/הֶ֡ם כְּ/קוֹל֩ מַ֨יִם רַבִּ֤ים כְּ/קוֹל שַׁדַּי֙ בְּ/לֶכְתָּ֔/ם ק֥וֹל הֲמֻלָּ֖ה כְּ/ק֣וֹל מַחֲנֶ֑ה בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
translation:
  language: de
  text: 'Und ich hörte den Schall ihrer Flügel: Wenn sie gingen, war er wie das Rauschen vieler Wassermassen, wie der Schall des Allmächtigen[a], ein Getöse wie der Lärm eines Heerlagers[b]. Wenn sie stillstanden, ließen sie ihre Flügel sinken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie der Schall Schaddais“. Das Hebräische gebraucht hier den Gottestitel שַׁדַּי (Schaddai), der traditionell mit „der Allmächtige“ wiedergegeben wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie der Lärm eines Lagers“. Das hebräische Wort מַחֲנֶה bezeichnet häufig ein militärisches Lager.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Und ich hörte
  rationale: Die Form führt das nächste Ereignis im Visionsbericht ein. „Und ich hörte“ bewahrt die erzählerische Abfolge, ohne die zeitliche Nuance stärker festzulegen.
- source_word: קוֹל
  choice: Schall / Lärm
  rationale: קוֹל bezeichnet je nach Zusammenhang Stimme, Schall oder Geräusch. „Schall“ eignet sich für die wiederholten Vergleiche, während beim Heerlager das natürliche deutsche Wort „Lärm“ denselben Sinn wiedergibt.
- source_word: כַּנְפֵיהֶם
  choice: ihrer Flügel
  rationale: Wörtliche Wiedergabe des Plurals mit Suffix; der Bezug gilt den zuvor genannten lebenden Wesen.
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: wie der Schall gewaltiger Wassermassen
  rationale: Die Formulierung bewahrt das Wasserbild und vermittelt im heutigen Deutsch dessen überwältigende Fülle und Lautstärke.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der traditionelle und semantisch passende deutsche Titel gibt die Gottesbezeichnung wieder, ohne sie als Eigennamen festzulegen.
- source_word: בְּלֶכְתָּם
  choice: wenn sie sich bewegten
  rationale: Die temporale Infinitivkonstruktion beschreibt den Zeitpunkt des Flügelschalls. „Sich bewegten“ passt zum visionären Zusammenhang und bildet den Gegensatz zum Stillstehen.
- source_word: הֲמֻלָּה
  choice: mächtiges Getöse
  rationale: Das Substantiv bezeichnet einen lauten, erregten Tumult. „Getöse“ erfasst hier die akustische Wucht; „mächtig“ macht die idiomatisch schwer wiederzugebende Verbindung mit קוֹל natürlich verständlich.
- source_word: כְּקוֹל מַחֲנֶה
  choice: wie der Lärm eines Heerlagers
  rationale: מַחֲנֶה kann allgemein „Lager“, häufig aber ein militärisches Lager bezeichnen. Im Vergleich mit kollektivem Getöse ist „Heerlager“ die wahrscheinliche Bedeutung.
- source_word: בְּעָמְדָם
  choice: Wenn sie stillstanden
  rationale: Die temporale Konstruktion steht im deutlichen Gegensatz zu ihrer Bewegung; „stillstanden“ bringt diesen Kontrast im Deutschen klar zum Ausdruck.
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: ließen sie ihre Flügel sinken
  rationale: Die Hifil-Form von רפה bedeutet hier, die Flügel erschlaffen oder herabsinken zu lassen. Die gewählte Formulierung ist anschaulich und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottestitels שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Die Übersetzung als Titel entspricht dem üblichen Bedeutungsgehalt und vermeidet es, die im Hebräischen mögliche Auffassung als Gottesbezeichnung oder Name unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Schall“ bewahrt die eindringliche Klangstruktur des Hebräischen; „Getöse“ und „Heerlager“ machen das gewaltige akustische Bild verständlich. Die Satzgliederung verdeutlicht Bewegung und Stillstand, ohne die Bildfolge theologisch auszudeuten.
