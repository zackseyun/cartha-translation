lexical_decisions:
- source_word: חֹבְרֹת
  choice: waren miteinander verbunden
  rationale: Das passive Partizip von חבר bezeichnet einen verbundenen bzw. zusammengefügten Zustand. Die Formulierung ist im Deutschen natürlich und bewahrt den stativ-passiven Sinn.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: miteinander
  rationale: Wörtlich steht »eine Frau zu ihrer Schwester«, eine distributive Wendung für einander entsprechende Teile. »Miteinander« gibt die Funktion idiomatisch wieder; die ungewöhnliche Bildsprache wird in der Fußnote kenntlich gemacht.
- source_word: כַּנְפֵיהֶם
  choice: ihre Flügel
  rationale: Direkte und kontextgemäße Wiedergabe; im deutschen Satz fungiert die Wortgruppe natürlich als Subjekt.
- source_word: לֹא יִסַּבּוּ
  choice: drehten sie sich nicht um
  rationale: סבב bezeichnet hier das Wenden oder Ändern der Bewegungsrichtung. »Sich umdrehen« passt zur Fortbewegung der Wesen und wahrt den Gegensatz zum Gehen in Blickrichtung.
- source_word: בְּלֶכְתָּן
  choice: wenn sie sich bewegten
  rationale: Der Infinitiv mit ב bezeichnet eine begleitende bzw. gleichzeitige Handlung. »Wenn sie sich bewegten« ist verständlich und passt zum beschreibenden Charakter der Vision.
- source_word: אִישׁ
  choice: jedes Wesen
  rationale: אִישׁ wird distributiv gebraucht und bezieht sich auf die zuvor genannten lebenden Wesen. Die Wiedergabe vermeidet eine unbeabsichtigte Aussage über ihr Geschlecht.
- source_word: אֶל עֵבֶר פָּנָיו
  choice: in die Richtung, in die sein Gesicht wies
  rationale: Die Wendung bedeutet wörtlich ungefähr »zur Seite/Richtung seines Gesichts«. Die deutsche Formulierung bewahrt den Bezug auf das jeweilige Gesicht genauer als das interpretierende »geradeaus«.
- source_word: יֵלֵכוּ
  choice: ging
  rationale: הלך ist das gewöhnliche Verb für gehen bzw. sich fortbewegen. Das Präteritum entspricht dem visionären Erzählzusammenhang.
