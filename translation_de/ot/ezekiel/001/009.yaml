  yaml_path: translation/ot/ezekiel/001/009.yaml
  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
translation:
  language: de
  text: Ihre Flügel waren miteinander verbunden[a]. Beim Gehen wandten sie sich nicht; jedes Wesen ging in die Richtung, in die sein Gesicht wies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eine [weibliche] zu ihrer Schwester«; gemeint sind einander entsprechende Flügel, die miteinander verbunden waren.'
