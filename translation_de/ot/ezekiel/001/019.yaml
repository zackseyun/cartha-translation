source:
  edition: WLC
  text: וּ/בְ/לֶ֨כֶת֙ הַֽ/חַיּ֔וֹת יֵלְכ֥וּ הָ/אוֹפַנִּ֖ים אֶצְלָ֑/ם וּ/בְ/הִנָּשֵׂ֤א הַֽ/חַיּוֹת֙ מֵ/עַ֣ל הָ/אָ֔רֶץ יִנָּשְׂא֖וּ הָ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/019.yaml
  text: When the living creatures moved[a], the wheels moved beside them; and when the living creatures were lifted up from the earth[b], the wheels were lifted up.
translation:
  language: de
  text: Wenn die Lebewesen sich bewegten[a], bewegten sich die Räder neben ihnen; und wenn die Lebewesen von der Erde emporgehoben wurden[b], wurden die Räder emporgehoben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gingen«. Für die Bewegung der Lebewesen und der Räder steht im Hebräischen dasselbe Verb.'
    reason: lexical_alternative
  - marker: b
    text: Hesekiel bezeichnet diese »Lebewesen« später als Cherubim (siehe Hesekiel 10,20).
    reason: cross_reference
lexical_decisions:
- source_word: וּבְלֶכֶת
  choice: Wenn ... sich bewegten
  rationale: Die Präposition ב mit dem Infinitivus constructus von הלך bezeichnet hier den zeitlichen Begleitumstand. Die Formulierung ist im Deutschen natürlich und wahrt den Zusammenhang der koordinierten Bewegung.
- source_word: הַחַיּוֹת
  choice: die Lebewesen
  rationale: Der Ausdruck bezeichnet in dieser Vision belebte Thronwesen, nicht gewöhnliche Tiere. „Lebewesen“ bleibt allgemein und nimmt ihre spätere Identifizierung als Cherubim nicht vorweg.
- source_word: יֵלְכוּ
  choice: bewegten sich
  rationale: הלך bedeutet gewöhnlich „gehen“, umfasst hier aber auch die Bewegung der Räder. „Sich bewegen“ lässt sich auf Wesen und Räder gleichermaßen beziehen und bewahrt ihre koordinierte Bewegung.
- source_word: הָאוֹפַנִּים
  choice: die Räder
  rationale: אופן bezeichnet unmittelbar ein Rad; der Plural meint die Räder bei den Lebewesen in der Vision.
- source_word: אֶצְלָם
  choice: neben ihnen
  rationale: אצל bezeichnet räumliche Nähe. „Neben ihnen“ gibt die enge Zuordnung knapp und idiomatisch wieder.
- source_word: וּבְהִנָּשֵׂא
  choice: und wenn ... sich ... erhoben
  rationale: Der Nifal-Infinitiv von נשׂא beschreibt das Emporgehobenwerden beziehungsweise Sich-Erheben. Die deutsche reflexive Form wahrt die im Hebräischen offene Frage nach der verursachenden Kraft und klingt natürlich.
- source_word: מֵעַל הָאָרֶץ
  choice: von der Erde
  rationale: Die Wendung bedeutet wörtlich „von über/auf der Erde“. „Von der Erde“ bezeichnet hier den Ausgangspunkt der Aufwärtsbewegung, ohne unnötig festzulegen, ob „Erdboden“ oder „Land“ gemeint ist.
- source_word: יִנָּשְׂאוּ
  choice: erhoben sich
  rationale: Dieselbe Wiedergabe wie beim vorausgehenden נשׂא erhält die bewusste Wiederholung und unterstreicht die parallele Bewegung der Lebewesen und Räder.
- source_word: וּ... הָאוֹפַנִּים
  choice: auch die Räder
  rationale: Das deutsche „auch“ macht die im Satzbau ausgedrückte entsprechende Bewegung idiomatisch deutlich, ohne dem Sachgehalt etwas hinzuzufügen.
theological_decisions:
- issue: Identität der הַחַיּוֹת in Hesekiels Vision
  choice: Im Haupttext allgemein mit „die Lebewesen“ wiedergeben
  alternative: „die Cherubim“
  rationale: Hesekiel 10,20 identifiziert die Wesen später als Cherubim; der vorliegende Vers verwendet jedoch den allgemeineren Ausdruck חַיּוֹת. Die Übersetzung bewahrt deshalb die Bezeichnung des unmittelbaren Textes.
- issue: Agens des Erhebens
  choice: „sich erhoben“
  alternative: „emporgehoben wurden“
  rationale: Der hebräische Nifal kann ein passives oder medial-reflexives Verständnis zulassen. Die gewählte Form wahrt diese Offenheit eher, statt ausdrücklich ein ungenanntes äußeres Agens einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die wiederholten Verben bilden die streng koordinierte Bewegung des hebräischen Textes ab. „Lebewesen“ vermeidet sowohl das missverständliche „Tiere“ als auch die Vorwegnahme der späteren Identifizierung.
