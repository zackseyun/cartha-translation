  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ שַׁ֜עַר הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ הַ/פֹּנֶ֣ה קָדִ֔ים יִהְיֶ֣ה סָג֔וּר שֵׁ֖שֶׁת יְמֵ֣י הַֽ/מַּעֲשֶׂ֑ה וּ/בְ/י֤וֹם הַ/שַּׁבָּת֙ יִפָּתֵ֔חַ וּ/בְ/י֥וֹם הַ/חֹ֖דֶשׁ יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/001.yaml
  text: 'Thus says the Lord GOD: The gate of the inner court that faces east shall be shut during the six working days[a], but on the Sabbath day it shall be opened, and on the day of the new moon it shall be opened.'
translation:
  language: de
  text: 'So spricht der Herr, Jahwe: Das Tor des inneren Vorhofs, das nach Osten weist, soll während der sechs Arbeitstage geschlossen bleiben. Am Sabbat aber soll es geöffnet werden, und am Neumondtag[a] soll es ebenfalls geöffnet werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „am Tag des Neumonds“; gemeint ist die monatliche Neumondfeier.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen etablierte Wiedergabe kennzeichnet den zusammengesetzten Gottestitel und vermeidet das missverständliche „Herr HERR“; die Großschreibung von HERR weist auf den Gottesnamen JHWH hin.
- source_word: שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: Das Tor des inneren Vorhofs
  rationale: Die Genitivverbindung gibt die Zugehörigkeit des Tores zum inneren Tempelvorhof präzise und idiomatisch wieder.
- source_word: הַפֹּנֶה קָדִים
  choice: das nach Osten weist
  rationale: Die partizipiale Richtungsangabe wird natürlich wiedergegeben, ohne ihre beschreibende Funktion zu verändern.
- source_word: יִהְיֶה סָגוּר
  choice: soll ... geschlossen bleiben
  rationale: Die Verbindung aus היה und dem passiven Partizip bezeichnet einen fortdauernden Zustand; „soll“ entspricht dem anordnenden Kontext.
- source_word: שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה
  choice: an den sechs Arbeitstagen
  rationale: Die Formulierung bezeichnet die sechs gewöhnlichen Tage der Arbeit im Gegensatz zum Sabbat; „Arbeitstage“ ist hier klarer als das rechtlich mehrdeutige deutsche „Werktage“.
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: Am Sabbat aber
  rationale: „Aber“ macht den im hebräischen Zusammenhang angelegten Gegensatz zu den sechs Arbeitstagen deutlich.
- source_word: יִפָּתֵחַ
  choice: soll es geöffnet werden
  rationale: Das Nifal Imperfekt wird als passive Handlung wiedergegeben und behält den anordnenden Ton bei.
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: und am Neumondtag
  rationale: Im kultisch-kalendarischen Zusammenhang bezeichnet חֹדֶשׁ den Neumond beziehungsweise die monatliche Neumondfeier, nicht lediglich den Monat.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr JHWH
  rationale: Die gewählte traditionelle deutsche Form ist verständlich und unterscheidet den Gottesnamen durch HERR in Großbuchstaben, ohne eine bestimmte Aussprache des Tetragramms festzulegen.
- issue: Bedeutung von הַחֹדֶשׁ im Festkalender
  choice: Neumondtag
  alternative: Tag des Monats
  rationale: Sabbat und חֹדֶשׁ stehen hier als kultische Zeiten nebeneinander; daher ist die Neumondfeier gemeint. Die Fußnote erläutert den kulturellen Bezug, ohne zusätzliche theologische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer und rechtlich-anordnender Tonlage. Der Satzbau bleibt nahe am Hebräischen, wird aber für heutige Leser durch „geschlossen bleiben“, den Kontrastmarker „aber“ und „ebenfalls“ flüssig gestaltet. Der Fußnotenmarker steht unmittelbar bei „Neumondtag“, auf den die Anmerkung tatsächlich Bezug nimmt.
