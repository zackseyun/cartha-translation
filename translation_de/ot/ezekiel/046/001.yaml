    rationale: „Gott, der HERR“ ist eine etablierte deutsche Bibelkonvention, lässt aber den im Grundtext stehenden Eigennamen JHWH nur typografisch erkennen. Der englische Audit Trail verlangt ausdrücklich „Yahweh“; im Deutschen ist „Jahwe“ die übliche entsprechende Schreibung. „der Herr, Jahwe“ wahrt zudem die Zweigliedrigkeit des hebräischen Titels.
  - severity: low
    issue: „an den sechs Arbeitstagen“ kann punktuell gelesen werden.
    rationale: Die hebräische Zeitangabe bezeichnet die Dauer der sechs gewöhnlichen Arbeitstage. „Während der sechs Arbeitstage“ bringt den fortdauernden Zustand des Geschlossenseins präziser zum Ausdruck.
