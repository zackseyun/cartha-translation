  source_fidelity: Die Regelung für das ostwärts gerichtete Tor des inneren Vorhofs, seine Schließung an den sechs Arbeitstagen sowie seine Öffnung am Sabbat und am Neumond ist zutreffend wiedergegeben. Der zusammengesetzte Gottesname אֲדֹנָי יְהוִה sollte jedoch deutlicher als Titel plus Eigenname wiedergegeben werden, statt den Eigennamen allein durch die traditionsbedingte Schreibung „HERR“ zu ersetzen.
  naturalness: Der deutsche Satz ist klar, idiomatisch und dem anordnenden Register angemessen. „Während der sechs Arbeitstage“ entspricht der zeitlichen Ausdehnung des hebräischen Ausdrucks etwas genauer als „an den sechs Arbeitstagen“.
  terminology: „Innerer Vorhof“, „Sabbat“ und „Neumondtag“ sind im Tempel- und Kalenderkontext passend. „der Herr, Jahwe“ gibt אֲדֹנָי יְהוִה transparent als Herrentitel und Gottesnamen wieder und folgt der im englischen Prüfnachweis dokumentierten Namensentscheidung.
  issues:
