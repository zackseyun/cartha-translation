  yaml_path: translation/ot/ezekiel/046/023.yaml
  text: A row ran around within them[a], around all four of them, and hearths had been made beneath the rows all around.
translation:
  language: de
  text: In allen vieren verlief innen ringsum eine Reihe; ringsum unter den Reihen waren Kochstellen angelegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Einfassungen“, „unter den Vorsprüngen“ oder „unter den Mauern“; die genaue architektonische Bedeutung des hebräischen Ausdrucks ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוּר
  choice: Reihe
  rationale: Das Substantiv bezeichnet hier wahrscheinlich eine umlaufende bauliche Reihe oder Schicht. „Reihe“ bewahrt die räumliche Vorstellung, ohne die architektonische Form genauer festzulegen, als der hebräische Text erlaubt.
- source_word: סָבִיב ... סָבִיב
  choice: ringsum ... rings um ... ringsum
  rationale: Die auffällige Wiederholung unterstreicht, dass die baulichen Anlagen die Höfe vollständig umgaben; die deutsche Fassung erhält diese räumliche Betonung.
- source_word: בָּהֶם
  choice: in ihnen
  rationale: Das Pronomen verweist auf die vier Höfe aus dem vorhergehenden Vers. „In ihnen“ gibt den Innenraumbezug knapp und natürlich wieder.
- source_word: לְאַרְבַּעְתָּם
  choice: um alle vier
  rationale: Die Form bezieht das umlaufende Bauelement auf sämtliche vier Höfe. „Alle vier“ macht diesen umfassenden Bezug deutlich.
- source_word: מְבַשְּׁלוֹת
  choice: Kochstellen
  rationale: Das Wort ist von בשׁל, „kochen/sieden“, abgeleitet und bezeichnet Einrichtungen zum Kochen. „Kochstellen“ ist im Deutschen klar und lässt ihre genaue bauliche Gestalt offen.
- source_word: עָשׂוּי
  choice: waren ... angelegt
  rationale: Das passive Partizip beschreibt die Kochstellen als fertig hergestellte Anlagen. „Waren angelegt“ gibt diesen resultativen Zustand im architektonischen Zusammenhang idiomatisch wieder.
- source_word: מִתַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet die räumliche Lage unterhalb des genannten Bauelements.
- source_word: הַטִּירוֹת
  choice: den Reihen
  rationale: Der Ausdruck ist in seiner genauen architektonischen Bedeutung unsicher und dürfte mit der zuvor genannten umlaufenden Reihe zusammenhängen. Die einheitliche Wiedergabe erhält diesen Zusammenhang; Alternativen werden in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von „ringsum“ bildet die räumliche Eindringlichkeit des Hebräischen ab. „Kochstellen“ ist verständlich und vermeidet eine unbelegte Festlegung auf Feuerstellen oder Herde. Der Fußnotenmarker steht am Versende, weil er die unsichere Deutung des architektonischen Ausdrucks „Reihen“ erläutert.
