  text: וְ/כִֽי יִתֵּ֨ן מַתָּנָ֜ה מִ/נַּחֲלָת֗/וֹ לְ/אַחַד֙ מֵֽ/עֲבָדָ֔י/ו וְ/הָ֤יְתָה לּ/וֹ֙ עַד שְׁנַ֣ת הַ/דְּר֔וֹר וְ/שָׁבַ֖ת לַ/נָּשִׂ֑יא אַ֚ךְ נַחֲלָת֔/וֹ בָּנָ֖י/ו לָ/הֶ֥ם תִּהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/017.yaml
  text: But if he gives a gift from his inheritance to one of his servants[a], it shall belong to him until the year of liberty; then it shall return to the prince. Only his inheritance belongs to his sons; it shall be theirs.
translation:
  language: de
  text: Wenn er aber einem seiner Diener ein Geschenk aus seinem Erbbesitz gibt, soll es diesem bis zum Jahr der Freiheit[a] gehören; dann fällt es an den Fürsten zurück. Nur seinen Söhnen soll sein Erbbesitz gehören; er soll ihnen gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahr der Freilassung«. Wahrscheinlich ist ein dem Jubeljahr entsprechendes Jahr gemeint, in dem Besitz zurückgegeben wird; im Hebräischen steht hier jedoch ein Wort für »Freiheit« und nicht der übliche Ausdruck für »Jubeljahr«.'
    reason: Lexikalische Alternative und sachlicher Bezug, ohne דְּרוֹר mit dem nicht im Text stehenden יוֹבֵל gleichzusetzen.
lexical_decisions:
- source_word: וְכִי
  choice: Wenn er aber
  rationale: Die Formulierung leitet einen bedingten Fall ein und stellt ihn dem zuvor geregelten Fall gegenüber.
- source_word: מַתָּנָה מִנַּחֲלָתוֹ
  choice: ein Geschenk aus seinem Erbbesitz
  rationale: מַתָּנָה bezeichnet eine Gabe oder Schenkung; נַחֲלָה meint hier den erblichen Landbesitz und nicht bloß beliebiges Eigentum.
- source_word: לְאַחַד מֵעֲבָדָיו
  choice: einem seiner Diener
  rationale: עֶבֶד kann je nach sozialem und rechtlichem Kontext »Diener« oder »Sklave« bedeuten. Hier steht der Gegensatz zwischen einem abhängigen Angehörigen des Haushalts und den Söhnen im Vordergrund; »Diener« wahrt die Mehrdeutigkeit am besten.
- source_word: וְהָיְתָה לּוֹ
  choice: soll es diesem … gehören
  rationale: Das Pronomen »diesem« macht eindeutig, dass der beschenkte Diener gemeint ist; »gehören« gibt den zeitlich begrenzten Besitzanspruch wieder.
- source_word: עַד שְׁנַת הַדְּרוֹר
  choice: bis zum Jahr der Freilassung
  rationale: דְּרוֹר bezeichnet Freiheit beziehungsweise Freilassung. »Freilassung« passt im Deutschen zum rechtlich geregelten Rückfall des Besitzes, ohne den nicht verwendeten Fachausdruck »Jubeljahr« in den Haupttext einzutragen.
- source_word: וְשָׁבַת לַנָּשִׂיא
  choice: dann fällt es an den Fürsten zurück
  rationale: שׁוב bezeichnet die Rückkehr beziehungsweise den Rückfall des Besitzes. »Fürst« ist in Hesekiels Tempelvision die angemessene Wiedergabe von נָשִׂיא.
- source_word: אַךְ נַחֲלָתוֹ בָּנָיו לָהֶם תִּהְיֶה
  choice: Nur sein Erbbesitz soll seinen Söhnen gehören; er soll ihnen bleiben
  rationale: אַךְ wirkt einschränkend. Die zweigliedrige Formulierung erhält die hebräische Betonung des dauerhaften Erbrechts der Söhne und bildet einen klaren Gegensatz zur nur vorübergehenden Schenkung an einen Diener.
theological_decisions:
- issue: Sozialrechtliche Bedeutung von עֶבֶד
  choice: Diener
  alternative: Sklave
  rationale: Der hebräische Ausdruck umfasst unterschiedliche Formen abhängiger Arbeit. Da der Vers den rechtlichen Unterschied zwischen Dienern und erbberechtigten Söhnen behandelt, ohne den genauen Status näher festzulegen, wird die Mehrdeutigkeit nicht durch die engere Wiedergabe »Sklave« aufgelöst.
- issue: Bezeichnung des Jahres mit דְּרוֹר
  choice: Jahr der Freilassung
  alternative: Jahr der Freiheit; Jubeljahr
  rationale: Der Kontext erinnert an die Wiederherstellung von Besitz im Jubeljahr, doch der Text verwendet nicht den üblichen Ausdruck יוֹבֵל. Daher bleibt der Haupttext beim Wortsinn von דְּרוֹר; die mögliche Beziehung zum Jubeljahr wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. »Erbbesitz«, »Freilassung« und »zurückfallen« bewahren den land- und eigentumsrechtlichen Charakter des Verses. Der Fußnotenmarker steht unmittelbar bei dem erklärten Ausdruck.
