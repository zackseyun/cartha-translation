  terminology: „Vorhof“, „Höfe“, „eingefasste“ und „Maß“ sind im Tempelbaukontext passend. „Eingefasste Höfe“ wahrt gegenüber stärkeren Festlegungen wie „gemauerte“ oder „verschlossene“ Höfe die lexikalische Unsicherheit von קְטֻרוֹת. Die Fußnoten erläutern sowohl die implizite Maßeinheit als auch die schwierigen seltenen Formen sachgerecht.
