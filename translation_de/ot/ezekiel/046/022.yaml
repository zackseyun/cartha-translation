  source_fidelity: 'Der deutsche Text gibt die architektonische Abfolge des Hebräischen zuverlässig wieder: die vier Ecken des Vorhofs, die umgrenzten Höfe, die elliptisch angegebenen Maße und die Gleichheit der Maße aller vier Höfe. Die nicht ausdrücklich genannte Einheit wird zutreffend nicht in den Haupttext eingefügt. Die unsichere Nuance von מְהֻקְצָעוֹת wird nicht überdeutet und ist angemessen in der Fußnote kenntlich gemacht.'
