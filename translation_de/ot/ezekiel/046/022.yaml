source:
  edition: WLC
  text: בְּ/אַרְבַּ֜עַת מִקְצֹע֤וֹת הֶֽ/חָצֵר֙ חֲצֵר֣וֹת קְטֻר֔וֹת אַרְבָּעִ֣ים אֹ֔רֶךְ וּ/שְׁלֹשִׁ֖ים רֹ֑חַב מִדָּ֣ה אַחַ֔ת לְ/אַרְבַּעְתָּ֖/ם מְׄהֻׄקְׄצָׄעֽׄוֹׄתׄ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/022.yaml
  text: In the four corners of the court there were enclosed courts[a], forty long and thirty wide[c][b]; the four of them had the same measurement.
translation:
  language: de
  text: An den vier Ecken des Vorhofs befanden sich eingefasste Höfe[a], vierzig lang und dreißig breit[b]. Alle vier hatten dasselbe Maß.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »umschlossene Höfe« oder »abgetrennte Höfe«. Das seltene hebräische Adjektiv bezeichnet sie wahrscheinlich als eingefasste Bereiche.'
    reason: lexical_alternative
  - marker: b
    text: Die Maßeinheit »Ellen« wird hier im Hebräischen nicht ausdrücklich genannt, ist aber aufgrund der Maßangaben im Zusammenhang vorauszusetzen.
    reason: cultural_note
  - marker: c
    text: Das letzte hebräische Wort ist selten und in seiner Bedeutung unsicher. Es kann zusätzlich betonen, dass es sich um die vier Eckhöfe handelte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֹעוֹת
  choice: Ecken
  rationale: Im architektonischen Zusammenhang bezeichnet das Wort die Ecken oder Eckbereiche des Vorhofs; »Ecken« ist hier die natürliche deutsche Wiedergabe.
- source_word: חֲצֵרוֹת
  choice: Höfe
  rationale: Gemeint sind kleinere Hofbereiche innerhalb des größeren Vorhofs. »Höfe« ist prägnant und passt zum Tempelbau.
- source_word: קְטֻרוֹת
  choice: eingefasste
  rationale: Das seltene Adjektiv beschreibt die Höfe wahrscheinlich als abgeschlossene oder umgrenzte Bereiche, ohne erkennen zu lassen, wie die Einfassung baulich ausgeführt war.
- source_word: אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב
  choice: vierzig lang und dreißig breit
  rationale: Die elliptische Maßangabe wird im Deutschen verständlich wiedergegeben, ohne die im Vers nicht ausdrücklich genannte Einheit »Ellen« in den Haupttext einzufügen.
- source_word: מִדָּה אַחַת לְאַרְבַּעְתָּם
  choice: Alle vier hatten dasselbe Maß
  rationale: Die Wendung stellt heraus, dass die vier Höfe übereinstimmende Abmessungen hatten.
- source_word: מְהֻקְצָעוֹת
  choice: befanden sich … an den vier Ecken / Fußnotenhinweis
  rationale: Die seltene und schwierige Form scheint die Lage oder Gestaltung als Eckhöfe zu betonen. Ihre Aussage wird durch die Ortsangabe im Satz aufgenommen, während die Unsicherheit in einer Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe architektonische Sprache des Hebräischen bleibt erhalten; die ausgelassene Maßeinheit wird nicht stillschweigend ergänzt, und die Unsicherheit der seltenen Wörter wird in den Fußnoten offengelegt.
