  text: וְ/אֵיפָ֨ה לַ/פָּ֜ר וְ/אֵיפָ֤ה לָ/אַ֨יִל֙ יַעֲשֶׂ֣ה מִנְחָ֔ה וְ/לַ֨/כְּבָשִׂ֔ים כַּ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/007.yaml
  text: And he shall provide as a grain offering an ephah for the bull and an ephah for the ram[a], and for the lambs whatever his hand can afford, and a hin of oil with each ephah.
translation:
  language: de
  text: Und als Speiseopfer soll er für den Stier ein Efa und für den Widder ein Efa darbringen, für die Lämmer aber so viel, wie er aufbringen kann[a], dazu ein Hin Öl je Efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „so viel, wie seine Hand erreicht“; gemeint ist: so viel, wie seine Mittel erlauben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפָה
  choice: Efa
  rationale: Das antike Trockenmaß bleibt als kultisch und textlich bedeutsame Maßeinheit unummgerechnet erhalten.
- source_word: פַּר
  choice: der Stier
  rationale: Der Artikel in לַפָּר verweist auf den in der Vorschrift genannten Opferstier.
- source_word: אַיִל
  choice: der Widder
  rationale: Der Artikel in לָאַיִל bezeichnet den in der Vorschrift genannten Opferwidder.
- source_word: יַעֲשֶׂה מִנְחָה
  choice: als Speiseopfer … darbringen
  rationale: מִנְחָה bezeichnet hier das begleitende Opfer aus Getreide; „Speiseopfer“ ist der etablierte deutsche Kultbegriff, während „darbringen“ die idiomatische Bedeutung von יַעֲשֶׂה im Opferkontext wiedergibt.
- source_word: כְּבָשִׂים
  choice: die Lämmer
  rationale: Die allgemeine Bezeichnung „Lämmer“ gibt den Ausdruck ohne eine im Deutschen unnötige zusätzliche Geschlechtsangabe wieder.
- source_word: כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: so viel, wie er aufbringen kann
  rationale: Die natürliche deutsche Wendung gibt den Sinn des hebräischen Hand-Idioms wieder; dessen konkretes Bild wird in der Fußnote offengelegt.
- source_word: שֶׁמֶן הִין לָאֵיפָה
  choice: ein Hin Öl je Efa
  rationale: „Je Efa“ bringt das Mengenverhältnis knapp und eindeutig zum Ausdruck; auch das antike Flüssigkeitsmaß Hin bleibt erhalten.
theological_decisions: []
