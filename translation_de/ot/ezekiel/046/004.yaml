base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/004.yaml
  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
translation:
  language: de
  text: Und das Brandopfer, das der Fürst Jahwe am Sabbat darbringt,[a] soll aus sechs makellosen Lämmern und einem makellosen Widder bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nahebringt“; das hebräische Verb wird hier als Fachausdruck für das Darbringen eines Opfers gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹלָה
  choice: Und das Brandopfer
  rationale: עֹלָה ist im Opferkontext die übliche Bezeichnung für das vollständig verbrannte Opfer. „Brandopfer“ ist die etablierte, präzise deutsche Wiedergabe.
- source_word: אֲשֶׁר יַקְרִב
  choice: das ... darbringt
  rationale: Der Hifil von קרב bedeutet im Opfergebrauch, eine Gabe herzuzubringen beziehungsweise darzubringen. „Darbringt“ ist im Deutschen natürlich und kultisch passend; die wörtliche Grundvorstellung wird in der Fußnote vermerkt.
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: נָשִׂיא bezeichnet in Ezechiels Tempelvision den anerkannten Herrscher, ohne ihn ausdrücklich als König zu kennzeichnen. „Fürst“ ist die herkömmliche und kontextgerechte Wiedergabe.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet hier den Empfänger beziehungsweise die Widmung des Opfers. Mit „Jahwe ... darbringt“ wird dies idiomatisch ausgedrückt; der Gottesname יהוה bleibt als Eigenname sichtbar.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbat
  rationale: Die Wendung nennt den Zeitpunkt des Opfers. „Am Sabbat“ ist knappes, natürliches Standarddeutsch und gibt den bestimmten hebräischen Ausdruck angemessen wieder.
- source_word: שִׁשָּׁה כְבָשִׂים
  choice: sechs ... Lämmern
  rationale: כְבָשִׂים bezeichnet in Opferlisten gewöhnlich Lämmer. Der Dativ folgt der deutschen Konstruktion „aus ... bestehen“.
- source_word: תְּמִימִם / תָּמִים
  choice: makellosen / makellosen
  rationale: תמים bezeichnet bei Opfertieren die Freiheit von körperlichen Fehlern. „Makellos“ ist verständlich, prägnant und wird bei beiden Tierarten einheitlich wiedergegeben.
- source_word: וְאַיִל
  choice: und einem ... Widder
  rationale: אַיִל bedeutet „Widder“. „Einem“ entspricht der singularischen Form und bildet zusammen mit den sechs Lämmern eine natürliche deutsche Aufzählung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn im Haupttext als Gottes persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Opferhandlung in יַקְרִב
  choice: darbringt
  alternative: herzubringt
  rationale: „Darbringen“ bezeichnet die kultische Handlung sachgerecht, ohne eine zusätzliche Aussage über deren Ablauf oder theologische Wirkung einzutragen. Die konkrete Grundbedeutung „nahebringen/herzubringen“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird aber mit „aus ... bestehen“ idiomatisch gestaltet. Opferterminologie und Herrschertitel werden traditionsnah und allgemein verständlich wiedergegeben.
