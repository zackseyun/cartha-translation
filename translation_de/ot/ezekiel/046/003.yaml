id: EZK.46.3
reference: Ezekiel 46:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִשְׁתַּחֲו֣וּ עַם הָ/אָ֗רֶץ פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא בַּ/שַּׁבָּת֖וֹת וּ/בֶ/חֳדָשִׁ֑ים לִ/פְנֵ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/003.yaml
  text: And the people of the land shall bow down at the entrance of that gate[a], before Yahweh[b], on the Sabbaths and on the new moons.
translation:
  language: de
  text: Und das Volk des Landes[a] soll sich am Eingang jenes Tores vor Jahwe[b] niederwerfen, an den Sabbaten und an den Neumonden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Volk des Landes“ ist hier wahrscheinlich die übrige Bevölkerung im Unterschied zum Fürsten und zu den Priestern gemeint.
    reason: cultural_note
  - marker: b
    text: Hebräisch יהוה (JHWH), der Gottesname; traditionell auch mit „der HERR“ wiedergegeben.
    reason: translation_note
lexical_decisions:
- source_word: וְהִשְׁתַּחֲווּ
  choice: soll sich niederwerfen
  rationale: Die Verbform bezeichnet eine ehrfürchtige körperliche Verneigung und kann im kultischen Zusammenhang zugleich Anbetung ausdrücken. „Sich niederwerfen“ bewahrt diese konkrete Handlung, ohne sie auf einen rein inneren Vorgang zu reduzieren.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die wörtliche Wiedergabe erhält die soziale Bezeichnung des Hebräischen. Im Zusammenhang sind wahrscheinlich die gewöhnlichen Angehörigen des Volkes im Unterschied zum Fürsten und zu den Priestern gemeint; diese Deutung wird nicht in den Haupttext eingetragen.
- source_word: פֶּתַח הַשַּׁעַר הַהוּא
  choice: am Eingang jenes Tores
  rationale: פֶּתַח bezeichnet den Eingang oder die Öffnung; das Demonstrativ הַהוּא verweist ausdrücklich auf das zuvor behandelte Tor. „Jenes Tor“ bewahrt diesen Rückverweis.
- source_word: בַּשַּׁבָּתוֹת
  choice: an den Sabbaten
  rationale: Der Plural bezeichnet die wiederkehrenden Sabbattage und wird im Deutschen beibehalten.
- source_word: וּבֶחֳדָשִׁים
  choice: und an den Neumonden
  rationale: חֹדֶשׁ bezeichnet hier aufgrund des kultischen Kalenders die Neumondtage beziehungsweise Neumondfeste, nicht lediglich Monate.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet das Sich-Niederwerfen in Gottes Gegenwart. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, während „der HERR“ die traditionelle jüdische Lesung beziehungsweise deren Übersetzung widerspiegelt.
- issue: Bedeutung von השתחוה im kultischen Zusammenhang
  choice: sich niederwerfen
  alternative: anbeten
  rationale: Der Ausdruck verbindet eine konkrete ehrfürchtige Körperhaltung mit kultischer Verehrung. Die gewählte Formulierung bewahrt die körperliche Bedeutung und lässt die religiöse Funktion aus dem Zusammenhang hervorgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Sprachgebrauch, während die konkreten räumlichen und kultischen Angaben sowie der Rückverweis „jenes Tores“ erhalten bleiben.
