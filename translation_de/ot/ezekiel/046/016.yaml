source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה כִּֽי יִתֵּ֨ן הַ/נָּשִׂ֤יא מַתָּנָה֙ לְ/אִ֣ישׁ מִ/בָּנָ֔י/ו נַחֲלָת֥/וֹ הִ֖יא לְ/בָנָ֣י/ו תִּֽהְיֶ֑ה אֲחֻזָּתָ֥/ם הִ֖יא בְּ/נַחֲלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/016.yaml
  text: 'Thus says the Lord GOD: If the prince gives a gift to any one of his sons[a], it is his inheritance[b]; it shall belong to his sons as their property by inheritance.'
translation:
  language: de
  text: 'So spricht der Herr, Yahweh: Wenn der Fürst einem seiner Söhne ein Geschenk gibt, so ist es dessen Erbbesitz; es soll seinen Söhnen als ihr erbliches Eigentum gehören.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Wiedergabe der prophetischen Botenformel ist natürlich, würdevoll und wahrt ihren formelhaften Charakter.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Gibt sowohl den Herrentitel אֲדֹנָי als auch den ausdrücklich überlieferten Gottesnamen יהוה wieder, ohne die beiden Bestandteile zusammenfallen zu lassen.
- source_word: כִּי
  choice: Wenn
  rationale: Leitet hier innerhalb rechtlicher Bestimmungen einen Bedingungsfall ein.
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: Bezeichnet in Hesekiels Tempelordnung den zivilen Amtsträger; „Fürst“ wahrt den technischen Titel und den Kontext.
- source_word: מַתָּנָה
  choice: ein Geschenk
  rationale: Bezeichnet allgemein eine Gabe; „Geschenk“ ist im Deutschen klar und lässt die genauere Art der Zuwendung offen.
- source_word: לְאִישׁ מִבָּנָיו
  choice: einem seiner Söhne
  rationale: Das wörtliche „einem Mann aus seinen Söhnen“ ist eine distributive Wendung für ein einzelnes Mitglied aus der Gruppe seiner Söhne; die deutsche Form gibt dies idiomatisch wieder.
- source_word: נַחֲלָתוֹ הִיא
  choice: so ist es dessen Erbbesitz
  rationale: Das Pronomen bezieht sich im Zusammenhang am natürlichsten auf den beschenkten Sohn. „Dessen“ verhindert im Deutschen eine irreführende Rückbeziehung auf den Fürsten; „Erbbesitz“ erfasst den vererbbaren Besitzcharakter von נַחֲלָה.
- source_word: לְבָנָיו תִּהְיֶה
  choice: es soll seinen Söhnen ... gehören
  rationale: Die Söhne sind die Nachkommen des beschenkten Sohnes; „gehören“ drückt die fortdauernde rechtliche Zuordnung natürlich aus.
- source_word: אֲחֻזָּתָם ... בְּנַחֲלָה
  choice: als ihr erbliches Eigentum
  rationale: אֲחֻזָּה bezeichnet festen Besitz beziehungsweise Grundeigentum, während בְּנַחֲלָה dessen erblichen Rechtscharakter angibt. Die zusammengezogene deutsche Wendung vermeidet eine schwerfällige Dopplung.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR / der Herr GOTT
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und gibt den im hebräischen Text stehenden Bundesnamen sichtbar wieder, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
- issue: Bezug der Possessivformen in נַחֲלָתוֹ und לְבָנָיו
  choice: auf den beschenkten Sohn
  alternative: auf den Fürsten
  rationale: Die Abfolge besagt, dass die Gabe zum Erbbesitz des Empfängers wird und an dessen Söhne weitergeht. Dies entspricht auch dem Kontrast zum folgenden Vers, der eine Gabe an einen Diener nur befristet gelten lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich geprägter, aber allgemein verständlicher Wortwahl. Die syntaktische Verdichtung „erbliches Eigentum“ gibt אֲחֻזָּה und בְּנַחֲלָה gemeinsam wieder; keine Fußnote ist für das Verständnis erforderlich.
