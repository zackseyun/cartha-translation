  text: וּ/בַ/חַגִּ֣ים וּ/בַ/מּוֹעֲדִ֗ים תִּהְיֶ֤ה הַ/מִּנְחָה֙ אֵיפָ֤ה לַ/פָּר֙ וְ/אֵיפָ֣ה לָ/אַ֔יִל וְ/לַ/כְּבָשִׂ֖ים מַתַּ֣ת יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/011.yaml
  text: At the festivals and the appointed times[a], the grain offering shall be one ephah for the bull and one ephah for the ram, and for the lambs as much as he is able to give, with a hin of oil to each ephah.
translation:
  language: de
  text: An den Festen und zu den festgesetzten Zeiten soll das Speiseopfer für den Stier ein Efa und für den Widder ein Efa betragen; für die Lämmer soll er so viel geben, wie er vermag[a], dazu ein Hin Öl für jedes Efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Gabe seiner Hand“; gemeint ist eine Gabe entsprechend dem, was er zu geben vermag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחַגִּים
  choice: An den Festen
  rationale: חַגִּים bezeichnet kultische Festanlässe; „Feste“ ist im Deutschen natürlich und bewahrt den Bezug zum Festkalender.
- source_word: וּבַמּוֹעֲדִים
  choice: und zu den festgesetzten Zeiten
  rationale: מוֹעֲדִים meint bestimmte, festgelegte Zeiten oder Termine, häufig im kultischen Kalender. Die Wiedergabe unterscheidet den Ausdruck bewusst von חַגִּים.
- source_word: תִּהְיֶה הַמִּנְחָה
  choice: soll das Speiseopfer … betragen
  rationale: מִנְחָה bezeichnet hier wegen der Maßangaben für Getreide und Öl das Speiseopfer. „soll … betragen“ gibt die Vorschrift idiomatisch wieder.
- source_word: אֵיפָה
  choice: ein Efa
  rationale: אֵיפָה ist ein Trockenmaß. Die traditionelle Maßbezeichnung wird erhalten, da eine moderne Umrechnung unsicher wäre und die antike Vorschrift verändern könnte.
- source_word: לַפָּר
  choice: für den Stier
  rationale: פַּר bezeichnet hier den als Opfer bestimmten jungen Stier; der bestimmte Singular wird entsprechend wiedergegeben.
- source_word: וְאֵיפָה לָאַיִל
  choice: und für den Widder ein Efa
  rationale: Die parallele Wortstellung macht die gleiche vorgeschriebene Menge für den Widder deutlich.
- source_word: וְלַכְּבָשִׂים מַתַּת יָדוֹ
  choice: für die Lämmer soll er so viel geben, wie er vermag
  rationale: Wörtlich steht „die Gabe seiner Hand“. Die deutsche Formulierung gibt den idiomatischen Sinn nach Leistungsvermögen wieder, während die Fußnote das Bild des Ausgangstextes dokumentiert.
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  choice: dazu ein Hin Öl für jedes Efa
  rationale: Die Formulierung bezeichnet das Verhältnis von einem Hin Öl je Efa; „für jedes“ macht den distributiven Sinn klar. Das antike Flüssigkeitsmaß bleibt unkonvertiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die antiken Maße Efa und Hin werden beibehalten; die parallele Struktur der Opferbestimmungen bleibt erkennbar.
