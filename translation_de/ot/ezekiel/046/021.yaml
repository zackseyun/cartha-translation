  terminology: „äußerer Vorhof“ ist im Tempelkontext angemessen; „Hof“ für die kleineren Höfe wahrt die begriffliche Unterscheidung. „Und siehe“ passt zum visionären Register. Die Fußnote dokumentiert die auffällige hebräische Wiederholung und deren im Kontext naheliegende distributive Bedeutung.
