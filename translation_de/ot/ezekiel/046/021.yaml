base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/021.yaml
  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
translation:
  language: de
  text: 'Dann führte er mich hinaus in den äußeren Vorhof und führte mich an den vier Ecken des Vorhofs vorbei.[a] Und siehe: In jeder Ecke des Vorhofs befand sich ein Hof.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen folgt wörtlich die Wiederholung: „ein Hof in der Ecke des Vorhofs, ein Hof in der Ecke des Vorhofs“. Nach der Erwähnung der vier Ecken ist der Sinn offenbar verteilend: In jeder der vier Ecken befand sich ein Hof.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Dann führte er mich hinaus
  rationale: Die Hifil-Form von יצא mit Suffix der 1. Person Singular bezeichnet das Herausführen. „Dann“ gibt die fortschreitende Erzählung natürlich wieder.
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: in den äußeren Vorhof
  rationale: חָצֵר bezeichnet hier einen Hof; im Zusammenhang der Tempelanlage ist „Vorhof“ der übliche und anschauliche deutsche Architekturbegriff. Die Richtungsangabe ergibt sich aus dem Bewegungsverb.
- source_word: וַיַּעֲבִירֵנִי
  choice: ließ mich … vorübergehen
  rationale: Das Hifil von עבר beschreibt, dass jemand zum Vorüber- oder Hindurchgehen veranlasst wird. Die Wiedergabe bewahrt diese Bewegungsnuance und legt nicht bloß ein Ankommen an den Ecken nahe.
- source_word: אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר
  choice: an den vier Ecken des Vorhofs
  rationale: מִקְצוֹעַ bezeichnet eine Ecke beziehungsweise einen Winkel. „An den vier Ecken“ verbindet sich idiomatisch mit „vorübergehen“.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die Aufmerksamkeitspartikel lenkt den Blick auf eine überraschend oder besonders wahrgenommene Gegebenheit. „Und siehe“ wahrt den würdevollen visionären Stil.
- source_word: חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר
  choice: In jeder Ecke des Vorhofs befand sich ein Hof
  rationale: Nach der ausdrücklichen Nennung der vier Ecken ist die wiederholte hebräische Formulierung distributiv zu verstehen. Die deutsche Fassung gibt diesen Sinn natürlich wieder; die formale Wiederholung wird in einer Fußnote dokumentiert.
