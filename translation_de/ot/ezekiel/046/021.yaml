  to: 'Dann führte er mich hinaus in den äußeren Vorhof und führte mich an den vier Ecken des Vorhofs vorbei.[a] Und siehe: In jeder Ecke des Vorhofs befand sich ein Hof.'
  rationale: Die direkte Formulierung „führte mich … vorbei“ ersetzt die im Deutschen schwerfällige Konstruktion „ließ mich … vorübergehen“. Sie gibt die durch das Hifil ausgedrückte geführte Bewegung wieder, ohne ein bloßes Ankommen an den Ecken zu behaupten. Die Fußnote wurde nur geringfügig an die Satzformulierung angeglichen.
