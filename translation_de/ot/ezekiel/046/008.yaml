source:
  edition: WLC
  text: וּ/בְ/ב֖וֹא הַ/נָּשִׂ֑יא דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/בְ/דַרְכּ֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/008.yaml
  text: When the prince enters[a], he shall enter by way of the porch of the gate, and he shall go out by the same way.
translation:
  language: de
  text: Wenn der Fürst eintritt, soll er durch die Vorhalle des Tores hineingehen und auf demselben Weg[a] wieder hinausgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf seinem Weg«; gemeint ist der Weg, auf dem er hineingegangen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/ב֖וֹא
  choice: Wenn … eintritt
  rationale: Die Verbindung aus Konjunktion, Präposition und Infinitivus constructus von בוא hat hier zeitliche Funktion. »Wenn … eintritt« gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: הַ/נָּשִׂיא
  choice: der Fürst
  rationale: נָשִׂיא bezeichnet in Hesekiels Tempelvision den führenden weltlichen Amtsträger, ohne ihn ausdrücklich als König zu bestimmen. »Fürst« wahrt den etablierten Sprachgebrauch und lässt seine genauere Identität offen.
- source_word: דֶּ֣רֶךְ
  choice: durch
  rationale: דֶּרֶךְ bezeichnet den Weg oder die Route. In Verbindung mit einem Gebäudeteil wird die Wegangabe im Deutschen natürlich mit »durch« ausgedrückt.
- source_word: אוּלָ֤ם
  choice: die Vorhalle
  rationale: אוּלָם bezeichnet den vorgelagerten Hallen- oder Vorraum des Torgebäudes. »Vorhalle« ist verständlich und architektonisch passend.
- source_word: הַ/שַּׁ֨עַר
  choice: des Tores
  rationale: Der Status constructus mit אוּלָם wird als »Vorhalle des Tores« wiedergegeben.
- source_word: יָב֔וֹא
  choice: soll er … hineingehen
  rationale: Das Imperfekt hat im Zusammenhang der kultischen Verfahrensanweisungen regelnde Kraft. »Soll« gibt diese wieder, während »hineingehen« die Bewegungsrichtung idiomatisch ausdrückt.
- source_word: וּ/בְ/דַרְכּ֖/וֹ
  choice: auf demselben Weg
  rationale: Wörtlich steht »auf seinem Weg«. Im Zusammenhang verweist das Suffix auf den gerade beschriebenen Zugangsweg; »auf demselben Weg« macht die beabsichtigte Übereinstimmung der Ein- und Ausgangsroute verständlich. Die wörtliche Form wird in der Fußnote bewahrt.
- source_word: יֵצֵֽא
  choice: wieder hinausgehen
  rationale: יצא ist das gewöhnliche Verb für das Hinausgehen. »Wieder« verdeutlicht im Deutschen die Rückbewegung, ohne eine zusätzliche Route einzuführen.
theological_decisions:
- issue: Identität und Stellung des הַנָּשִׂיא in Hesekiels Tempelvision
  choice: Neutral als »der Fürst« wiedergegeben
  alternative: »der Herrscher« oder ausdrücklich »der messianische Fürst«
  rationale: Der Vers regelt lediglich den Weg beim Betreten und Verlassen des Tempelbereichs. Er entscheidet nicht, ob der Fürst messianisch zu verstehen ist, und bezeichnet ihn auch nicht ausdrücklich als König; diese Spannung bleibt daher offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist als klare Verfahrensanweisung gestaltet; architektonische Fachsprache wird auf das verständliche »Vorhalle des Tores« begrenzt.
