source:
  edition: WLC
  text: וּ/בְ/ב֨וֹא עַם הָ/אָ֜רֶץ לִ/פְנֵ֣י יְהוָה֮ בַּ/מּֽוֹעֲדִים֒ הַ/בָּ֡א דֶּרֶךְ שַׁ֨עַר צָפ֜וֹן לְ/הִֽשְׁתַּחֲוֺ֗ת יֵצֵא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב וְ/הַ/בָּא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב יֵצֵ֖א דֶּרֶךְ שַׁ֣עַר צָפ֑וֹנָ/ה לֹ֣א יָשׁ֗וּב דֶּ֤רֶךְ הַ/שַּׁ֨עַר֙ אֲשֶׁר בָּ֣א ב֔/וֹ כִּ֥י נִכְח֖/וֹ יצאו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/009.yaml
  text: And when the people of the land come before Yahweh at the appointed times[a], whoever enters by way of the north gate to worship shall go out by way of the south gate, and whoever enters by way of the south gate shall go out by way of the north gate. He shall not return by way of the gate through which he entered[c][b], but shall go out straight ahead.
translation:
  language: de
  text: Wenn das Volk des Landes zu den festgesetzten Zeiten[a] vor Jahwe kommt, soll, wer durch das Nordtor hineingeht, um sich niederzuwerfen[b], durch das Südtor hinausgehen; und wer durch das Südtor hineingeht, soll durch das Nordtor hinausgehen. Er soll nicht durch das Tor zurückkehren, durch das er hineingegangen ist; denn geradeaus sollen sie hinausgehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den festgesetzten Festzeiten“ oder „bei den Festen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb bezeichnet das Niederbeugen oder Sich-Niederwerfen als Handlung der Verehrung; daher auch: „um anzubeten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „denn ihnen/ihm gegenüber sollen sie hinausgehen“. Gemeint ist wahrscheinlich, dass sie weiter geradeaus gehen und durch das gegenüberliegende Tor hinausgehen, statt zum Eingangstor zurückzukehren.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die formnahe Wiedergabe bewahrt die im Tempelkontext erkennbare Bezeichnung der allgemeinen Bevölkerung im Unterschied zum Fürsten und zu den Priestern, ohne vorschnell „das einfache Volk“ einzutragen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ bewahrt den kultischen Sinn des Erscheinens in Gottes Gegenwart; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בַּמּוֹעֲדִים
  choice: zu den festgesetzten Zeiten
  rationale: מוֹעֵד kann sowohl festgesetzte Zeiten als auch Festzeiten bezeichnen. Die gewählte Formulierung erhält diese Breite; eine engere Festdeutung steht in der Fußnote.
- source_word: הַבָּא ... לְהִשְׁתַּחֲוֺת
  choice: wer ... hineingeht, um sich niederzuwerfen
  rationale: Die generische Partizipialkonstruktion wird idiomatisch mit „wer“ wiedergegeben. „Sich niederwerfen“ erhält die körperliche und kultische Bedeutung des Verbs deutlicher als das allgemeinere „anbeten“.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹן / דֶּרֶךְ שַׁעַר נֶגֶב
  choice: durch das Nordtor / durch das Südtor
  rationale: Im Deutschen bezeichnet „durch das Tor“ den Ein- und Ausgang natürlich und erhält die räumliche Anweisung.
- source_word: יֵצֵא
  choice: soll ... hinausgehen
  rationale: Der Imperfekt hat in dieser Vorschrift normativen Sinn; deutsches „soll“ gibt ihn klar und würdig wieder.
- source_word: לֹא יָשׁוּב
  choice: soll ... nicht zurückkehren
  rationale: Dies entspricht der Grundbedeutung von שוב und der untersagten Umkehr zum Eingangstor.
- source_word: אֲשֶׁר בָּא בוֹ
  choice: durch das er hineingegangen ist
  rationale: Die deutsche Relativkonstruktion gibt das Tor als Weg des Eintritts idiomatisch wieder.
- source_word: כִּי נִכְחוֹ יֵצֵאוּ
  choice: sondern sie sollen geradeaus auf der gegenüberliegenden Seite hinausgehen
  rationale: נִכְחוֹ kann „ihm/ihm gegenüber“ oder „gerade vor ihm“ bedeuten. Die Formulierung vermittelt die räumliche Folge der Vorschrift und bewahrt mit „gegenüberliegend“ den Kern des Ausdrucks. Der hebräische Wechsel vom generischen Singular zum Plural wird im Deutschen sichtbar erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְהִשְׁתַּחֲוֺת
  choice: um sich niederzuwerfen
  alternative: um anzubeten
  rationale: Die gewählte Wiedergabe bewahrt sowohl die konkrete Körperhandlung als auch ihren kultischen Zusammenhang, ohne beides vollständig gleichzusetzen.
- issue: Numeruswechsel im Schlusssatz
  choice: vom generischen Singular „niemand“ zum Plural „sie“
  alternative: 'durchgehend Singular: „er soll ... hinausgehen“'
  rationale: Der masoretische Text wechselt vom Singular der vorausgehenden Regel zum pluralischen יֵצֵאוּ. Die Übersetzung glättet diesen Wechsel nicht stillschweigend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Vorschriftssprache. Die Satzstruktur bleibt eng am hebräischen Bewegungsablauf. Der auffällige Numeruswechsel am Versende und die räumliche Mehrdeutigkeit von נִכְחוֹ werden nicht unmarkiert beseitigt.
