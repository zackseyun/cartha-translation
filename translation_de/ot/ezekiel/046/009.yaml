revisions:
- from: Wenn das Volk des Landes zu den festgesetzten Zeiten[a] vor Jahwe kommt, soll, wer durch das Nordtor hineingeht, um sich niederzuwerfen[b], durch das Südtor hinausgehen; und wer durch das Südtor hineingeht, soll durch das Nordtor hinausgehen. Niemand soll durch das Tor zurückkehren, durch das er hineingegangen ist, sondern sie sollen geradeaus auf der gegenüberliegenden Seite hinausgehen.[c]
  to: Wenn das Volk des Landes zu den festgesetzten Zeiten[a] vor Jahwe kommt, soll, wer durch das Nordtor hineingeht, um sich niederzuwerfen[b], durch das Südtor hinausgehen; und wer durch das Südtor hineingeht, soll durch das Nordtor hinausgehen. Er soll nicht durch das Tor zurückkehren, durch das er hineingegangen ist; denn geradeaus sollen sie hinausgehen.[c]
  rationale: Die Revision beschränkt sich auf den Schlusssatz. Sie gibt כִּי als Begründung wieder, vermeidet im Haupttext die zu starke räumliche Festlegung „auf der gegenüberliegenden Seite“ und bewahrt dennoch mit „geradeaus“ die naheliegende Bewegungsrichtung. Der Singular-Plural-Wechsel des masoretischen Textes bleibt erhalten.
