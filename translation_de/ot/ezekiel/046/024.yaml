source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י אֵ֚לֶּה בֵּ֣ית הַֽ/מְבַשְּׁלִ֔ים אֲשֶׁ֧ר יְבַשְּׁלוּ שָׁ֛ם מְשָׁרְתֵ֥י הַ/בַּ֖יִת אֶת זֶ֥בַח הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/024.yaml
  text: Then he said to me[b][a], “These are the kitchens where the ministers of the temple shall boil the people's sacrifice.”
translation:
  language: de
  text: 'Dann sagte er zu mir: »Dies sind die Küchen[a], in denen die Diener des Tempels[b] das Schlachtopfer des Volkes kochen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »das Haus der Kochenden«; auch: »die Kochräume«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »die Tempeldiener« oder »die Bediensteten des Tempels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָי
  choice: Dann sagte er zu mir
  rationale: Das Narrativ-Waw führt die Handlung fort; »Dann« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: בֵּית הַמְבַשְּׁלִים
  choice: die Küchen
  rationale: Wörtlich etwa »Haus der Kochenden«; im architektonischen Zusammenhang sind dafür bestimmte Küchenräume gemeint. Der Plural entspricht dem deiktischen אֵלֶּה und dem Kontext der zuvor genannten Räume.
- source_word: יְבַשְּׁלוּ
  choice: kochen
  rationale: בשׁל kann »kochen« beziehungsweise »sieden« bedeuten. »Kochen« ist im Deutschen natürlich und lässt die genaue Zubereitungsart offen.
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: die Diener des Tempels
  rationale: מְשָׁרְתֵי bezeichnet Personen im offiziellen Dienst; הַבַּיִת meint in dieser Vision den Tempel. »Diener des Tempels« wahrt sowohl den Dienstcharakter als auch den kultischen Zusammenhang.
- source_word: זֶבַח הָעָם
  choice: das Schlachtopfer des Volkes
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer und nicht bloß eine allgemeine Gabe; der Genitiv gibt die Zuordnung zum Volk wieder.
- source_word: שָׁם
  choice: in denen
  rationale: Das örtliche »dort« wird nach der Bezeichnung der Räume idiomatisch als Relativanschluss wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schlachtopfer« hält den konkreten kultischen Sinn von זֶבַח fest; »kochen« vermeidet eine unbelegte Verengung auf ausschließliches Sieden.
