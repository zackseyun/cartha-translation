  yaml_path: translation/ot/ezekiel/046/005.yaml
  text: And the grain offering shall be an ephah with the ram[a], and with the lambs a grain offering as much as his hand can give[b], and a hin of oil with each ephah.
translation:
  language: de
  text: Und das Speiseopfer soll für den Widder ein Efa betragen[a] und für die Lämmer eine Menge, die er geben kann[b], dazu ein Hin Öl je Efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Widder“ und entsprechend „zu den Lämmern“; die hebräische Präposition kann in Opferbestimmungen eine Zuordnung oder Bestimmung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Gabe seiner Hand“; gemeint ist eine Gabe entsprechend dem, was er zu geben vermag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im Zusammenhang der Opferbestimmungen bezeichnet מִנְחָה ein aus pflanzlichen Erzeugnissen bestehendes Opfer; „Speiseopfer“ ist die geläufige, präzise deutsche Wiedergabe.
- source_word: אֵיפָה
  choice: Efa
  rationale: Das hebräische Trockenmaß wird transliteriert, damit die kultische Maßangabe erhalten bleibt.
- source_word: לָאַיִל
  choice: zum Widder
  rationale: Die Präposition ל ordnet das Speiseopfer dem Widder zu und kann hier sowohl begleitende Zuordnung als auch Bestimmung ausdrücken.
- source_word: לַכְּבָשִׂים
  choice: zu den Lämmern
  rationale: Die parallele Formulierung bewahrt die Zuordnung des Speiseopfers zu den Lämmern, ohne eine festgesetzte Menge vorwegzunehmen.
- source_word: מַתַּת יָדוֹ
  choice: so viel seine Hand geben kann
  rationale: Die konkrete Bildsprache des hebräischen Ausdrucks bleibt erhalten; zugleich wird verständlich, dass sich die Menge nach dem Vermögen des Gebenden richtet.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Dies ist die sachlich und kontextuell eindeutige Wiedergabe in den Opferbestimmungen.
- source_word: הִין
  choice: Hin
  rationale: Das hebräische Flüssigkeitsmaß wird transliteriert, um die technische Maßangabe zu bewahren.
- source_word: לָאֵיפָה
  choice: für jedes Efa
  rationale: Die Wendung bezeichnet das Verhältnis der Ölmenge zur jeweiligen Efa-Menge; die distributive Wiedergabe ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Bedeutung der Präposition ל bei Widder und Lämmern
  choice: „zum Widder“ und „zu den Lämmern“ im Text, mit Fußnote zur möglichen Wiedergabe „für“
  alternative: „für den Widder“ und „für die Lämmer“
  rationale: Das Hebräische lässt in den Opferanweisungen sowohl begleitende Zuordnung als auch Bestimmung erkennen; die Übersetzung entscheidet diese Nuance nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Speiseopfer“, „Efa“ und „Hin“ bleiben erhalten. Die Satzstellung wurde für gute Verständlichkeit leicht gegliedert, ohne die parallele Struktur oder die bildhafte Rede von der Hand einzuebnen.
