  text: ו/עשו אֶת הַ/כֶּ֧בֶשׂ וְ/אֶת הַ/מִּנְחָ֛ה וְ/אֶת הַ/שֶּׁ֖מֶן בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר עוֹלַ֖ת תָּמִֽיד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/015.yaml
  text: They shall provide the lamb, the grain offering, and the oil, morning by morning, as a regular burnt offering.
translation:
  language: de
  text: Man soll das Lamm, das Speiseopfer und das Öl Morgen für Morgen als regelmäßiges Brandopfer darbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Man soll ... darbringen
  rationale: Das Verb עשה bedeutet wörtlich „machen/tun“, wird im Opferkontext aber natürlich mit „darbringen“ wiedergegeben. Die unbestimmte deutsche Konstruktion wahrt, dass das hebräische Pluralsubjekt im unmittelbaren Vers nicht ausdrücklich benannt ist.
- source_word: הַכֶּבֶשׂ
  choice: das Lamm
  rationale: Direkte und kontextgerechte Wiedergabe des Opfertiers.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: מִנְחָה bezeichnet hier die zum Brandopfer gehörende unblutige Opfergabe; „Speiseopfer“ ist eine verständliche und etablierte deutsche Kultbezeichnung.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Gibt die distributive Wiederholung idiomatisch und präzise wieder.
- source_word: עֹלַת תָּמִיד
  choice: als regelmäßiges Brandopfer
  rationale: עֹלָה ist das vollständig verbrannte Opfer; תָּמִיד bezeichnet die beständige beziehungsweise regelmäßig wiederkehrende Darbringung.
theological_decisions:
- issue: Verhältnis der aufgeführten Gaben zum Brandopfer
  choice: „als regelmäßiges Brandopfer“
  alternative: „für ein regelmäßiges Brandopfer“
  rationale: Die appositionale Formulierung des Hebräischen wird mit „als“ wiedergegeben, ohne die Getreidegabe und das Öl künstlich vom täglichen Opferkomplex zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe „Speiseopfer“ und „Brandopfer“ bleiben wegen ihrer Präzision erhalten; der Satzbau ist zugleich klar und allgemein verständlich.
