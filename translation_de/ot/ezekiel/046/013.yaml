  text: וְ/כֶ֨בֶשׂ בֶּן שְׁנָת֜/וֹ תָּמִ֗ים תַּעֲשֶׂ֥ה עוֹלָ֛ה לַ/יּ֖וֹם לַֽ/יהֹוָ֑ה בַּ/בֹּ֥קֶר בַּ/בֹּ֖קֶר תַּעֲשֶׂ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
translation:
  language: de
  text: Und du sollst Jahwe täglich ein einjähriges, makelloses männliches Lamm als Brandopfer darbringen. Morgen für Morgen sollst du es darbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶבֶשׂ
  choice: Lamm
  rationale: כֶבֶשׂ bezeichnet ein Lamm beziehungsweise junges Schaf. „Lamm“ ist im Deutschen die natürliche und sachlich angemessene Wiedergabe; ein ausdrücklich männliches Tier wird durch das Substantiv hier nicht zweifelsfrei zusätzlich bezeichnet.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjährig
  rationale: Die hebräische Wendung bedeutet wörtlich „Sohn seines Jahres“ und bezeichnet ein Tier im Alter von einem Jahr. „Einjährig“ gibt die Altersangabe knapp und idiomatisch wieder.
- source_word: תָּמִים
  choice: makellos
  rationale: Im Opferkontext bezeichnet תָּמִים ein Tier ohne körperlichen Fehler. „Makellos“ ist verständlich, würdig und kultisch passend.
- source_word: תַּעֲשֶׂה
  choice: darbringen
  rationale: עשה bedeutet grundsätzlich „tun/machen“, wird hier mit עוֹלָה jedoch im Sinn der rituellen Zubereitung und Darbringung eines Opfers gebraucht. „Darbringen“ trifft diesen Zusammenhang im Deutschen.
- source_word: עוֹלָה
  choice: Brandopfer
  rationale: עוֹלָה ist der feste hebräische Begriff für das vollständig auf dem Altar verbrannte Opfer. „Brandopfer“ ist die etablierte deutsche Entsprechung.
- source_word: לַיּוֹם
  choice: täglich
  rationale: Die Wendung bezeichnet hier die regelmäßige Wiederholung an jedem Tag. „Täglich“ ist präzise und natürlich.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung von בַּבֹּקֶר hat distributive Bedeutung und betont die regelmäßige Darbringung an jedem Morgen. „Morgen für Morgen“ bewahrt sowohl Sinn als auch Nachdruck.
- source_word: אֹתוֹ
  choice: es
  rationale: Das Pronomen verweist auf das Lamm beziehungsweise das Brandopfer zurück; „es“ entspricht dem deutschen Genus und ist eindeutig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den göttlichen Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus von „täglich“ und „Morgen für Morgen“ bleibt erhalten, da er die tägliche Pflicht und ihren festgelegten Zeitpunkt ausdrückt. Die zweimalige Form von תַּעֲשֶׂה wird durch die Wiederholung von „darbringen“ bewusst sichtbar gemacht.
