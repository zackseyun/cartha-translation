source:
  edition: WLC
  text: וּ/בָ֣א הַ/נָּשִׂ֡יא דֶּרֶךְ֩ אוּלָ֨ם הַ/שַּׁ֜עַר מִ/ח֗וּץ וְ/עָמַד֙ עַל מְזוּזַ֣ת הַ/שַּׁ֔עַר וְ/עָשׂ֣וּ הַ/כֹּהֲנִ֗ים אֶת עֽוֹלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו וְ/הִֽשְׁתַּחֲוָ֛ה עַל מִפְתַּ֥ן הַ/שַּׁ֖עַר וְ/יָצָ֑א וְ/הַ/שַּׁ֥עַר לֹֽא יִסָּגֵ֖ר עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/002.yaml
  text: And the prince shall enter by way of the porch of the gate from outside[a], and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings, and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
translation:
  language: de
  text: Der Fürst soll von draußen durch die Vorhalle des Tores hineingehen und am Torpfosten stehen bleiben. Die Priester sollen sein Brandopfer und seine Friedensopfer[a] darbringen. Er soll sich an der Schwelle des Tores anbetend niederwerfen und dann hinausgehen. Das Tor aber soll bis zum Abend nicht geschlossen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: „Fürst“ bezeichnet in Hesekiels Tempelvision eine hervorgehobene politische oder fürstliche Gestalt, ohne sie ausdrücklich zum König oder zum Messias zu erklären.
- source_word: דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ
  choice: von draußen durch die Vorhalle des Tores hineingehen
  rationale: Die Wiedergabe erhält sowohl den Ausgangspunkt מִחוּץ („von draußen“) als auch den Weg durch die Vorhalle; „hineingehen“ macht die räumliche Bewegung im Deutschen natürlich verständlich.
- source_word: מְזוּזַת הַשַּׁעַר
  choice: am Torpfosten
  rationale: מְזוּזָה bezeichnet den Pfosten beziehungsweise die Laibung eines Eingangs. „Torpfosten“ ist hier architektonisch passend und knapp.
- source_word: וְעָשׂוּ הַכֹּהֲנִים אֶת עֹלָתוֹ
  choice: Die Priester sollen sein Brandopfer ... darbringen
  rationale: עָשָׂה bezeichnet im Opferzusammenhang die rituelle Ausführung beziehungsweise Darbringung. „Darbringen“ ist im Deutschen präzise und idiomatisch.
- source_word: שְׁלָמָיו
  choice: seine Friedensopfer
  rationale: „Friedensopfer“ bewahrt die traditionelle und sprachlich naheliegende Verbindung von שְׁלָמִים mit Frieden und Wohlergehen; „Gemeinschaftsopfer“ bleibt als mögliche funktionale Wiedergabe in der Fußnote erhalten.
- source_word: וְהִשְׁתַּחֲוָה
  choice: sich anbetend niederwerfen
  rationale: Die Formulierung gibt sowohl die körperliche Geste des Niederwerfens als auch ihren kultischen Sinn wieder.
- source_word: מִפְתַּן הַשַּׁעַר
  choice: an der Schwelle des Tores
  rationale: מִפְתָּן bezeichnet die Schwelle beziehungsweise den Tür- oder Torsims; die direkte Wiedergabe erhält die architektonische Ortsangabe.
- source_word: לֹא יִסָּגֵר עַד הָעָרֶב
  choice: soll bis zum Abend nicht geschlossen werden
  rationale: Die passive Form von סגר wird unmittelbar wiedergegeben; die Soll-Konstruktion entspricht dem regelnden Kontext des Abschnitts.
theological_decisions:
- issue: Identität und Stellung des Fürsten in Hesekiels Tempelvision
  choice: נָשִׂיא wird als „Fürst“ wiedergegeben, ohne die Gestalt ausdrücklich messianisch oder königlich zu bestimmen.
  alternative: „Oberhaupt“, „Herrscher“ oder eine ausdrücklich messianische Deutung
  rationale: Der Vers beschreibt besondere kultische Rechte und Grenzen dieser Gestalt, legt ihre weitergehende Identität aber nicht fest. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer räumlicher und kultischer Terminologie. Die wiederholte Soll-Form gibt den regelnden Charakter des Kontexts wieder. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die lexikalische Alternative bezieht.
