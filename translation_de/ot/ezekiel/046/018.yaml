  text: וְ/לֹא יִקַּ֨ח הַ/נָּשִׂ֜יא מִ/נַּחֲלַ֣ת הָ/עָ֗ם לְ/הֽוֹנֹתָ/ם֙ מֵ/אֲחֻזָּתָ֔/ם מֵ/אֲחֻזָּת֖/וֹ יַנְחִ֣ל אֶת בָּנָ֑י/ו לְמַ֨עַן֙ אֲשֶׁ֣ר לֹֽא יָפֻ֣צוּ עַמִּ֔/י אִ֖ישׁ מֵ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
translation:
  language: de
  text: Der Fürst soll nichts vom Erbbesitz des Volkes nehmen, indem er sie aus ihrem Eigentum bedrückt.[a] Aus seinem eigenen Eigentum soll er seinen Söhnen Erbbesitz zuteilen, damit niemand aus meinem Volk von seinem Eigentum zerstreut wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem er ihnen Unrecht tut“; im Zusammenhang mit Landbesitz auch: „indem er sie aus ihrem Eigentum verdrängt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mein Volk, jeder von seinem Eigentum“. Gemeint ist jedes einzelne Mitglied des Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: In Ezechiel bezeichnet נָשִׂיא den besonderen weltlichen Führer und wird von der Bezeichnung für einen König unterschieden. „Fürst“ bewahrt diesen kontextuellen Titel.
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  choice: nichts vom Erbbesitz des Volkes nehmen
  rationale: Die Verbindung von לקח mit מן bezeichnet das Nehmen aus dem Besitz des Volkes; „Erbbesitz“ erhält den rechtlichen und generationenübergreifenden Sinn von נַחֲלָה.
- source_word: לְהוֹנֹתָם מֵאֲחֻזָּתָם
  choice: sie so aus ihrem Eigentum verdrängen
  rationale: Die Hifil-Form von ינה kann bedrücken, übervorteilen oder Unrecht zufügen bedeuten. Im Zusammenhang mit Landbesitz bezeichnet die Formulierung die Folge eines solchen Unrechts, nämlich die Verdrängung aus dem eigenen Grundbesitz, ohne die lexikalische Mehrdeutigkeit zu verschweigen.
- source_word: מֵאֲחֻזָּתוֹ יַנְחִל אֶת־בָּנָיו
  choice: Aus seinem eigenen Eigentum soll er seinen Söhnen Erbbesitz geben
  rationale: Das Hifil von נחל bedeutet, jemanden erben zu lassen oder ihm Erbbesitz zuzuteilen. Die Wortstellung hebt den Gegensatz zwischen dem eigenen Eigentum des Fürsten und dem Besitz des Volkes hervor.
- source_word: לְמַעַן אֲשֶׁר לֹא יָפֻצוּ
  choice: damit ... nicht ... zerstreut wird
  rationale: פוץ bedeutet zerstreuen oder versprengen. Das Bild bleibt erhalten, während der Kontext erkennen lässt, dass es um Vertreibung aus dem Landbesitz geht.
- source_word: עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  choice: niemand aus meinem Volk von seinem Eigentum
  rationale: אִישׁ ist hier distributiv gebraucht. Im natürlichen Deutschen gibt „niemand aus meinem Volk“ innerhalb der verneinten Aussage den Sinn jedes einzelnen Angehörigen des Volkes präzise wieder.
theological_decisions:
- issue: Distributiver Gebrauch des maskulinen Singulars אִישׁ
  choice: niemand aus meinem Volk
  alternative: jeder Mann aus meinem Volk
  rationale: אִישׁ bezeichnet in dieser verneinten distributiven Konstruktion jedes einzelne Mitglied des Volkes. Die gewählte deutsche Form ist nicht geschlechtsspezifisch einschränkend und bewahrt den individuellen Bezug, ohne eine theologische Aussage über Geschlecht einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbbesitz“ gibt נַחֲלָה wieder, „Eigentum“ dagegen אֲחֻזָּה; so bleibt die begriffliche Abstufung des Hebräischen erkennbar. Die etwas ungewöhnliche Wendung „von seinem Eigentum zerstreut“ bewahrt bewusst das Bild und die Spannung des Ausgangstextes.
