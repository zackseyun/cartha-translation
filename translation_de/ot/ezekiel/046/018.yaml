revisions:
- from: Der Fürst soll nichts vom Erbbesitz des Volkes nehmen und sie so aus ihrem Eigentum verdrängen.[a] Aus seinem eigenen Eigentum soll er seinen Söhnen Erbbesitz geben, damit niemand aus meinem Volk von seinem Eigentum zerstreut wird.[b]
  to: Der Fürst soll nichts vom Erbbesitz des Volkes nehmen, indem er sie aus ihrem Eigentum bedrückt.[a] Aus seinem eigenen Eigentum soll er seinen Söhnen Erbbesitz zuteilen, damit niemand aus meinem Volk von seinem Eigentum zerstreut wird.[b]
  rationale: Die Revision stellt die Grundbedeutung „bedrücken/ausbeuten“ von לְהוֹנוֹתָם im Haupttext wieder her und behält die landbezogene Konkretisierung durch „aus ihrem Eigentum“ bei. Die mögliche ausdrückliche Lesart der Verdrängung wird in der Fußnote transparent ausgewiesen. Zudem wird יַנְחִיל mit der idiomatischeren und präziseren Wendung „als Erbbesitz zuteilen“ wiedergegeben.
  reviewer_model: gpt-5.6-terra
