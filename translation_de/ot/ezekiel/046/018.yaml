review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Besitzterminologie sind zutreffend: נַחֲלָה wird sinnvoll als „Erbbesitz“, אֲחֻזָּה als „Eigentum“ wiedergegeben, und der Kontrast zwischen dem Besitz des Volkes und dem eigenen Besitz des Fürsten bleibt erhalten. Die Verdrängung aus dem Besitz ist im Kontext eine plausible Konkretisierung von לְהוֹנוֹתָם מֵאֲחֻזָּתָם, sollte aber die Grundbedeutung „bedrücken/ausbeuten“ nicht im Haupttext ersetzen. Die distributive Schlusswendung wird mit „niemand ...“ idiomatisch und sinnentsprechend wiedergegeben.'
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Standarddeutsch. „Erbbesitz geben“ ist jedoch weniger idiomatisch als „als Erbbesitz zuteilen“. Eine Formulierung mit „indem er sie aus ihrem Eigentum verdrängt“ verbindet die Ausbeutung und ihre landrechtliche Folge klarer und natürlicher.
  terminology: „Fürst“ ist für הַנָּשִׂיא in Ezechiels Tempelordnung angemessen. „Erbbesitz“ für נַחֲלָה und „Eigentum“ für אֲחֻזָּה sind konsistent. „Bedrücken“ bildet die lexikalische Kernbedeutung von הונה ab; „aus ihrem Eigentum verdrängen“ erläutert hier den kontextuellen Vollzug, ohne eine engere Alternative auszuschließen.
  issues:
  - severity: medium
    issue: Die Haupttextformulierung „und sie so aus ihrem Eigentum verdrängen“ gibt nur die kontextuelle Folge wieder, nicht die lexikalische Kernaussage von לְהוֹנוֹתָם.
    rationale: Das Hifil von ינה bezeichnet primär Bedrücken, Ausbeuten oder Unrecht tun. Der Zusatz „aus ihrem Eigentum“ erlaubt zwar eine auf Enteignung bezogene Konkretisierung, doch sollte der Haupttext die Ausbeutung ausdrücklich nennen und die Verdrängung als Weise bzw. Folge verbinden.
  - severity: low
    issue: „seinen Söhnen Erbbesitz geben“ klingt im Deutschen leicht unidiomatisch.
    rationale: יַנְחִיל bedeutet, jemanden etwas erben zu lassen bzw. ihm etwas als Erbe zuzuteilen. „Als Erbbesitz zuteilen“ ist präziser und flüssiger.
