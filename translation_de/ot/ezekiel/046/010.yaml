base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/010.yaml
  text: And the prince shall be among them[a]; when they enter, he shall enter, and when they go out[b], he shall go out.
translation:
  language: de
  text: Und der Fürst soll mitten unter ihnen sein; wenn sie hineingehen, soll er hineingehen, und wenn sie hinausgehen, sollen sie hinausgehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text hat hier die Mehrzahl: »sollen sie hinausgehen«, nicht die Einzahl: »soll er hinausgehen«.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: נָשִׂיא ist in Ezechiel 40–48 die feststehende Bezeichnung für den mit dem Tempelkult verbundenen weltlichen Würdenträger. »Fürst« bewahrt diesen Titel, ohne seine Identität darüber hinaus theologisch festzulegen.
- source_word: בְּתוֹכָם
  choice: mitten unter ihnen
  rationale: Die Wendung bedeutet wörtlich »in ihrer Mitte«. »Mitten unter ihnen« ist im Deutschen natürlich und bringt zum Ausdruck, dass der Fürst sich gemeinsam mit dem Volk bewegt.
- source_word: בְּבוֹאָם יָבוֹא
  choice: wenn sie hineingehen, soll er hineingehen
  rationale: Die Präposition mit dem Infinitiv und dem Suffix der 3. Person Plural bezeichnet den Zeitpunkt. Das finite Verb steht in der 3. Person Singular und bezieht sich auf den Fürsten; »soll« entspricht dem regelnden Kontext.
- source_word: וּבְצֵאתָם יֵצֵאוּ
  choice: und wenn sie hinausgehen, sollen sie hinausgehen
  rationale: Sowohl das Suffix am Infinitiv als auch das abschließende finite Verb stehen nach dem masoretischen Text in der 3. Person Plural. Die bewusst repetitive Wiedergabe wahrt diese grammatische Form und korrigiert sie nicht zugunsten der erwartbaren symmetrischen Einzahl.
theological_decisions:
- issue: Rolle und Status des Fürsten in Ezechiels Tempelvision
  choice: נָשִׂיא wird mit »Fürst« wiedergegeben, ohne den Titel ausdrücklich messianisch oder königlich zu deuten.
  alternative: Oberhaupt; Herrscher; eine ausdrückliche messianische Identifizierung
  rationale: Der Vers regelt die Bewegung des Fürsten im Zusammenhang mit den Gottesdienstbesuchern, bestimmt aber seine weitergehende Identität nicht.
- issue: Numerus im letzten Satzteil
  choice: Die masoretische Mehrzahl »sollen sie hinausgehen« bleibt im Haupttext erhalten.
  alternative: »soll er hinausgehen«, als symmetrische Aussage über den Fürsten
  rationale: Der überlieferte hebräische Text hat יֵצֵאוּ in der 3. Person Plural. Eine Änderung zur Einzahl würde eine textliche Spannung stillschweigend auflösen und dem Ausgangstext widersprechen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verben »hineingehen« und »hinausgehen« bewahren die räumliche und sprachliche Parallelität des Hebräischen. Die auffällige Wiederholung im Schlusssatz bleibt wegen der eindeutigen masoretischen Mehrzahl stehen und wird durch eine knappe Fußnote erläutert.
