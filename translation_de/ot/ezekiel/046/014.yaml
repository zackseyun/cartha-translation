  text: וּ/מִנְחָה֩ תַעֲשֶׂ֨ה עָלָ֜י/ו בַּ/בֹּ֤קֶר בַּ/בֹּ֨קֶר֙ שִׁשִּׁ֣ית הָֽ/אֵיפָ֔ה וְ/שֶׁ֛מֶן שְׁלִישִׁ֥ית הַ/הִ֖ין לָ/רֹ֣ס אֶת הַ/סֹּ֑לֶת מִנְחָה֙ לַֽ/יהוָ֔ה חֻקּ֥וֹת עוֹלָ֖ם תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/014.yaml
  text: And you shall prepare with it[a], morning by morning, a grain offering of a sixth of an ephah, and a third of a hin of oil to moisten the fine flour—a grain offering to Yahweh[c][b], a perpetual statute continually.
translation:
  language: de
  text: 'Und dazu sollst du Morgen für Morgen ein Speisopfer bereiten: ein Sechstel Efa und ein Drittel Hin Öl, um das Feinmehl anzufeuchten[a] – ein Speisopfer für Jahwe, als immerwährende Ordnung, beständig.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um das Feinmehl zu vermischen“. Das seltene hebräische Verb bezeichnet wahrscheinlich das Anfeuchten mit Öl.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Satzungen auf Dauer, beständig“; die Häufung betont, dass diese Vorschrift dauerhaft und regelmäßig gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָה
  choice: Und ... ein Speisopfer
  rationale: מִנְחָה bezeichnet im Opferkontext die aus Feinmehl und Öl bestehende Opfergabe. „Speisopfer“ ist die geläufige, knappe deutsche Fachbezeichnung.
- source_word: תַעֲשֶׂה
  choice: sollst du ... bereiten
  rationale: Die Form ist 2. Person Maskulinum Singular. „Bereiten“ gibt עשה in einer kultischen Anweisung natürlich wieder.
- source_word: עָלָיו
  choice: dazu
  rationale: Das Pronomen verweist wahrscheinlich auf das tägliche Opfer des vorigen Verses; „dazu“ drückt die Hinzufügung aus, ohne die örtliche Grundbedeutung „darauf“ zu erzwingen.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung hat distributive Bedeutung und betont die tägliche Regelmäßigkeit.
- source_word: שִׁשִּׁית הָאֵיפָה
  choice: ein Sechstel Efa
  rationale: Die antike Maßeinheit bleibt erhalten; die Mengenangabe wird im Deutschen idiomatisch formuliert.
- source_word: וְשֶׁמֶן שְׁלִישִׁית הַהִין
  choice: und ein Drittel Hin Öl
  rationale: Die hebräische Mengenangabe wird klar und knapp wiedergegeben, ohne die historische Maßeinheit umzurechnen.
- source_word: לָרֹס
  choice: anzufeuchten
  rationale: Das seltene Verb רוס bezeichnet wahrscheinlich das Befeuchten des Feinmehls mit Öl. Die Unsicherheit gegenüber „vermischen“ wird in einer Fußnote bewahrt.
- source_word: אֶת הַסֹּלֶת
  choice: das Feinmehl
  rationale: סֹלֶת ist feines, für Opfer verwendetes Mehl; „Feinmehl“ ist präzise und im Deutschen verständlich.
- source_word: מִנְחָה לַיהוָה
  choice: ein Speisopfer für Jahwe
  rationale: Die Wiederaufnahme von מִנְחָה bleibt erhalten; יהוה wird als der Eigenname „Jahwe“ wiedergegeben.
- source_word: חֻקּוֹת עוֹלָם תָּמִיד
  choice: eine immerwährende Ordnung, die beständig einzuhalten ist
  rationale: Die kumulative Betonung von Dauer und Regelmäßigkeit wird in natürlichem Deutsch bewahrt. Der hebräische Plural kann hier idiomatisch eine festgesetzte Ordnung bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ wahrt dessen Funktion als Eigenname und folgt der vorgegebenen Entscheidung der konsultierten Fassung.
- issue: Bezug von עָלָיו
  choice: dazu, auf das tägliche Opfer aus Vers 13 bezogen
  alternative: darauf / für ihn
  rationale: Der unmittelbare Kontext legt eine zusätzliche, das tägliche Brandopfer begleitende Getreidegabe nahe. „Dazu“ bewahrt den Bezug, ohne eine räumliche Deutung festzuschreiben.
- issue: Zeitliche Geltung von חֻקּוֹת עוֹלָם תָּמִיד
  choice: immerwährende, beständig einzuhaltende Ordnung
  alternative: ewige Satzungen, fortwährend
  rationale: Die Übersetzung gibt die starke Dauerformel wieder, ohne eine über den Text hinausgehende systematisch-theologische Bestimmung ihrer heilsgeschichtlichen Anwendung vorzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe „Speisopfer“ und „Feinmehl“ sowie die antiken Maße Efa und Hin bleiben erhalten. Die hebräische Wiederholung wird mit „Morgen für Morgen“ rhythmisch und verständlich abgebildet.
