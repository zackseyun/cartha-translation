base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/020.yaml
  text: Then he said to me[a], “This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the grain offering, so as not to bring them out into the outer court to make the people holy.”
translation:
  language: de
  text: 'Dann sagte er zu mir: „Dies ist der Ort, an dem die Priester das Schuldopfer und das Sündopfer kochen und das Speiseopfer backen sollen, damit sie diese Opfer nicht in den äußeren Vorhof hinausbringen und dadurch das Volk heiligen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das Volk weihen“. Das hebräische Verb bedeutet „heilig machen“. In diesem Tempelkontext ist wahrscheinlich gemeint, dass Heiligkeit durch den Kontakt mit den heiligen Opfergaben auf Menschen übergeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Dann sagte er zu mir
  rationale: Das Narrativ-Waw führt die Handlung fort; „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: זֶה הַמָּקוֹם
  choice: Dies ist der Ort
  rationale: Direkte und würdige Wiedergabe der hinweisenden Ortsbestimmung.
- source_word: יְבַשְּׁלוּ ... הָאָשָׁם וְאֶת הַחַטָּאת
  choice: das Schuldopfer und das Sündopfer kochen
  rationale: בשל bezeichnet hier die Zubereitung der Opfer, wahrscheinlich durch Kochen. „Schuldopfer“ und „Sündopfer“ sind die geläufigen deutschen Bezeichnungen der kultischen Opferarten.
- source_word: יֹאפוּ אֶת הַמִּנְחָה
  choice: das Speiseopfer backen
  rationale: אפה bedeutet „backen“; מִנְחָה bezeichnet in diesem kultischen Zusammenhang das Speiseopfer.
- source_word: לְבִלְתִּי הוֹצִיא
  choice: damit sie diese Opfer nicht ... hinausbringen
  rationale: Die Konstruktion drückt Vermeidung beziehungsweise Zweck aus. Das im Hebräischen unausgesprochene Objekt wird zur Klarheit als „diese Opfer“ aufgenommen.
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: in den äußeren Vorhof
  rationale: „Äußerer Vorhof“ ist die natürliche architektonische Bezeichnung im Kontext von Ezechiels Tempelvision.
- source_word: לְקַדֵּשׁ אֶת הָעָם
  choice: und dadurch das Volk heiligen
  rationale: Der Hifil von קדש bedeutet „heilig machen/heiligen“. „Dadurch“ verdeutlicht den naheliegenden Zusammenhang mit dem Hinausbringen der heiligen Opfer, ohne die kultische Aussage auf eine bestimmte Wirkungslehre festzulegen.
theological_decisions:
- issue: Bedeutung der Heiligung in לְקַדֵּשׁ אֶת הָעָם
  choice: Die wörtliche Aussage „das Volk heiligen“ bleibt im Text erhalten; „dadurch“ kennzeichnet die Heiligung als mögliche Folge des Hinausbringens.
  alternative: „das Volk weihen“ oder eine Umschreibung, nach der Heiligkeit durch Berührung mit den Opfergaben übertragen würde
  rationale: Der Tempelkontext legt eine durch Kontakt mit heiligen Opfergaben bewirkte Heiligung nahe. Der hebräische Wortlaut benennt den Mechanismus jedoch nicht ausdrücklich; deshalb wahrt die Übersetzung diese Spannung und erläutert sie in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die kultischen Fachbegriffe bleiben erhalten; unnötig altertümliche Formen werden vermieden.
