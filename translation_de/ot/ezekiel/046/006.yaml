  text: וּ/בְ/י֣וֹם הַ/חֹ֔דֶשׁ פַּ֥ר בֶּן בָּקָ֖ר תְּמִימִ֑ם וְ/שֵׁ֧שֶׁת כְּבָשִׂ֛ם וָ/אַ֖יִל תְּמִימִ֥ם יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/006.yaml
  text: And on the day of the new moon[a], there shall be an unblemished young bull from the herd, and six lambs and a ram; they shall be unblemished.
translation:
  language: de
  text: Und am Neumondstag[a] sollen ein fehlerloser junger Stier aus der Rinderherde, sechs Lämmer und ein Widder fehlerlos sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tag des Monats“; im kultischen Zusammenhang ist damit der Neumondstag gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/י֣וֹם הַ/חֹ֔דֶשׁ
  choice: Und am Neumondstag
  rationale: Im kultischen Kalender bezeichnet בְּיוֹם הַחֹדֶשׁ den Tag des Neumonds. „Neumondstag“ gibt diese Funktion im Deutschen knapp und verständlich wieder; die wörtliche Form wird in der Fußnote genannt.
- source_word: פַּר בֶּן בָּקָר
  choice: ein junger Stier aus der Rinderherde
  rationale: Die feste Opferformel bezeichnet einen jungen Stier beziehungsweise einen Stier aus dem Rinderbestand. Die deutsche Formulierung bewahrt beide Bedeutungsanteile, ohne das unnatürliche „Sohn eines Rindes“ zu verwenden.
- source_word: תְּמִימִם
  choice: fehlerlos
  rationale: Im Opferkontext bezeichnet תמים ein Tier ohne körperlichen Makel. „Fehlerlos“ ist in modernem Deutsch klarer und weniger missverständlich als „vollkommen“.
- source_word: וְ/שֵׁ֧שֶׁת כְּבָשִׂ֛ים
  choice: sechs Lämmer
  rationale: כְּבָשִׂים bezeichnet hier die für das Opfer bestimmten Lämmer. Das grammatische Geschlecht wird nicht eigens als biologisches Geschlecht ausgedrückt, da der Kontext dies nicht verlangt.
- source_word: וָ/אַ֖יִל
  choice: und ein Widder
  rationale: אַיִל ist die übliche Bezeichnung für einen Widder in Opferlisten.
- source_word: יִהְיֽוּ
  choice: sollen ... bereitstehen; sie sollen ... sein
  rationale: Das pluralische יִהְיוּ hat hier vorschreibende Kraft. „Bereitstehen“ ermöglicht eine natürliche deutsche Aufzählung, ohne ausdrücklich ein im Vers nicht genanntes Opferverb einzufügen; der zweite Satzteil bewahrt die hebräische Aussage „sie sollen fehlerlos sein“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Fachbedeutung wird verständlich wiedergegeben; die Wiederholung von „fehlerlos“ bleibt erhalten, weil sie die Form und den Nachdruck des hebräischen Textes widerspiegelt.
