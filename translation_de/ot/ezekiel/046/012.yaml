source:
  edition: WLC
  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
translation:
  language: de
  text: Wenn aber der Fürst Jahwe eine freiwillige Gabe darbringt, sei es als Brandopfer oder als Heilsopfer[a], soll man ihm das Tor öffnen, das nach Osten weist. Er soll sein Brandopfer und seine Heilsopfer ebenso darbringen, wie er es am Sabbat tut. Danach soll er hinausgehen, und nachdem er hinausgegangen ist, soll man das Tor schließen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Friedensopfer; auch „Gemeinschaftsopfer“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen ist sowohl beim Öffnen als auch beim Schließen des Tores der Handelnde nicht ausdrücklich genannt.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְכִי
  choice: Wenn aber
  rationale: Leitet innerhalb der kultischen Ordnung einen besonderen Fall ein; die Nachstellung von „aber“ markiert den Übergang natürlich.
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: Bezeichnet in Ezechiels Tempelordnung einen politischen und kultischen Amtsträger, ohne ihn ausdrücklich als König zu bestimmen.
- source_word: נְדָבָה
  choice: eine freiwillige Gabe
  rationale: Bezeichnet eine aus freiem Entschluss dargebrachte Opfergabe; „Gabe“ vermeidet die missverständliche Doppelung „freiwilliges Opfer ... als Brandopfer“.
- source_word: עוֹלָה
  choice: Brandopfer
  rationale: Eingebürgerte und genaue Bezeichnung für das vollständig verbrannte Opfer.
- source_word: שְׁלָמִים
  choice: Heilsopfer
  rationale: Gängige deutsche Wiedergabe des Opferbegriffs mit seinem Bedeutungsfeld von Heil, Wohlergehen und Frieden; eine mögliche Alternative wird in der Fußnote genannt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen wieder; bei „darbringen“ bezeichnet der Dativ natürlich den Empfänger.
- source_word: וּפָתַח לוֹ
  choice: soll man ihm ... öffnen
  rationale: Das hebräische Verb steht in der dritten Person Singular, nennt aber keinen Handelnden. Das unpersönliche „man“ bewahrt diese Unbestimmtheit und klingt im Deutschen natürlicher als ein Passiv.
- source_word: הַשַּׁעַר הַפֹּנֶה קָדִים
  choice: das Tor, das nach Osten weist
  rationale: Klare und natürliche Wiedergabe der partizipialen Bestimmung des Tores.
- source_word: וְעָשָׂה
  choice: soll ... darbringen
  rationale: Im Opferkontext bedeutet עשה, das Opfer zu vollziehen beziehungsweise darzubringen.
- source_word: כַּאֲשֶׁר יַעֲשֶׂה בְּיוֹם הַשַּׁבָּת
  choice: ebenso ..., wie er es am Sabbat tut
  rationale: Bezieht die Verfahrensweise auf die zuvor beschriebene regelmäßige Sabbatpraxis.
- source_word: וְיָצָא
  choice: Danach soll er hinausgehen
  rationale: Gibt den nächsten Schritt der vorgeschriebenen Abfolge deutlich wieder.
- source_word: וְסָגַר אֶת־הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  choice: sobald er hinausgegangen ist, soll man das Tor schließen
  rationale: Bewahrt den nicht genannten Handelnden durch „man“ und gibt die zeitliche Folge von Weggang und Schließung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer / Gemeinschaftsopfer
  rationale: „Heilsopfer“ hält das breite Bedeutungsfeld von Frieden, Wohlergehen und Heil offen; „Gemeinschaftsopfer“ würde einen einzelnen Aspekt stärker auslegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit verständlicher kultischer Terminologie. Die Satzfolge bleibt gesetzlich-prozedural; der ungenannte Handelnde beim Öffnen und Schließen wird nicht näher bestimmt.
