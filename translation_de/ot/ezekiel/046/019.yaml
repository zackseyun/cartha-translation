  naturalness: Der Text ist flüssiges, modernes Standarddeutsch und bewahrt mit „Und siehe“ angemessen den visionären Registerton. „nach Norden ausgerichtet waren“ ist ebenso natürlich und genauer.
  terminology: „Heilige Kammern“, „Priester“ und „äußerstes westliches Ende“ passen zum tempelarchitektonischen Kontext. „Ort“ ist für מָקוֹם etwas unmittelbarer als „Platz“. Die Fußnote sollte die räumlich-offene Grundbedeutung von יַרְכְתָם nicht mit „äußersten“ als wörtliche Wiedergabe ausgeben.
