  text: וַ/יְבִיאֵ֣/נִי בַ/מָּבוֹא֮ אֲשֶׁ֣ר עַל כֶּ֣תֶף הַ/שַּׁעַר֒ אֶל הַ/לִּשְׁכ֤וֹת הַ/קֹּ֨דֶשׁ֙ אֶל הַ/כֹּ֣הֲנִ֔ים הַ/פֹּנ֖וֹת צָפ֑וֹנָ/ה וְ/הִנֵּה שָׁ֣ם מָק֔וֹם ב/ירכת/ם יָֽמָּ/ה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/019.yaml
  text: Then he brought me through the entrance that was beside the gate to the holy chambers for the priests[a], which faced north; and behold, there was a place there at their far western end.
translation:
  language: de
  text: Dann führte er mich durch den Eingang an der Seite des Tores zu den heiligen Kammern für die Priester, die nach Norden ausgerichtet waren. Und siehe, dort war an ihrem äußersten westlichen Ende ein Ort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an ihrem hinteren Ende westwärts“.'
    reason: Die Fußnote gibt die räumlich-offenere Bedeutung von יַרְכְתָם sowie die Richtungsform יָמָּה wieder.
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Dann führte er mich
  rationale: Das Wayyiqtol führt die Erzählfolge fort; der Hifil von בוא bezeichnet hier das Hinführen. „Dann“ gibt die Abfolge natürlich wieder.
- source_word: בַמָּבוֹא
  choice: durch den Eingang
  rationale: מָבוֹא bezeichnet einen Eingang oder Zugang. Im Zusammenhang der geführten Bewegung gibt „durch den Eingang“ den Weg über diesen Zugang idiomatisch wieder.
- source_word: אֲשֶׁר עַל כֶּתֶף הַשַּׁעַר
  choice: an der Seite des Tores
  rationale: כֶּתֶף bedeutet wörtlich „Schulter“, in architektonischer Verwendung jedoch „Seite“ oder „Flanke“. Die Formulierung wahrt die räumliche Aussage ohne ein im Deutschen missverständliches Bild.
- source_word: אֶל הַלִּשְׁכוֹת הַקֹּדֶשׁ
  choice: zu den heiligen Kammern
  rationale: לִשְׁכָּה bezeichnet im Tempelzusammenhang einen Nebenraum oder eine Kammer; „heilige Kammern“ ist präzise und dem würdigen architektonischen Register angemessen.
- source_word: אֶל הַכֹּהֲנִים
  choice: für die Priester
  rationale: Das zweite אֶל bezeichnet hier am natürlichsten die Zuordnung beziehungsweise Bestimmung der Kammern. „Für die Priester“ vermeidet die unverständliche wörtliche Wiederholung „zu den Priestern“.
- source_word: הַפֹּנוֹת צָפוֹנָה
  choice: nach Norden gelegenen
  rationale: Das feminine Pluralpartizip bezieht sich grammatisch auf die Kammern und beschreibt ihre Ausrichtung nach Norden. Die attributive Stellung macht diesen Bezug im Deutschen eindeutig.
- source_word: וְהִנֵּה שָׁם מָקוֹם
  choice: Und siehe, dort war … ein Platz
  rationale: „Siehe“ bewahrt die aufmerksamkeitslenkende und visionäre Funktion von הִנֵּה. מָקוֹם wird schlicht als „Platz“ wiedergegeben.
- source_word: בְּיַרְכְתָם יָמָּה
  choice: an ihrem äußersten westlichen Ende
  rationale: Der Suffix -ם wird mit „ihrem“ ausdrücklich wiedergegeben und bezieht sich auf die Kammern. יַרְכָה bezeichnet den hintersten oder entlegensten Teil; יָמָּה weist nach Westen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kammern“ erhält den tempelarchitektonischen Charakter; „Und siehe“ bewahrt bewusst den visionären Ton. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge oder räumlichen Beziehungen zu verändern.
