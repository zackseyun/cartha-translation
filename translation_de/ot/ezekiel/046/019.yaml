revisions:
- from: Dann führte er mich durch den Eingang an der Seite des Tores zu den nach Norden gelegenen heiligen Kammern für die Priester. Und siehe, dort war an ihrem äußersten westlichen Ende ein Platz.[a]
  to: Dann führte er mich durch den Eingang an der Seite des Tores zu den heiligen Kammern für die Priester, die nach Norden ausgerichtet waren. Und siehe, dort war an ihrem äußersten westlichen Ende ein Ort.[a]
  rationale: Die Revision unterscheidet die Ausrichtung der Kammern von ihrer bloßen geographischen Lage und präzisiert die Fußnote, ohne die architektonische Deutung des Haupttexts oder die Mehrdeutigkeit des hebräischen Ortsausdrucks einzuengen.
