source:
  edition: WLC
  text: יָעַ֥צְתָּ בֹּ֖שֶׁת לְ/בֵיתֶ֑/ךָ קְצוֹת עַמִּ֥ים רַבִּ֖ים וְ/חוֹטֵ֥א נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/010.yaml
  text: You have devised shame for your house by cutting off many peoples[a], and have sinned against your own life.
translation:
  language: de
  text: Du hast Schande für dein Haus geplant, indem du viele Völker vernichtet hast, und machst dich an deinem eigenen Leben schuldig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an deiner eigenen Seele“ oder „an dir selbst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָעַצְתָּ
  choice: du hast … geplant
  rationale: Das Qal Perfekt 2. Person maskulin Singular bezeichnet hier das absichtsvolle Planen eines verderblichen Vorgehens. „Geplant“ ist im heutigen Deutsch natürlich und behält die Verantwortlichkeit des Angeredeten bei.
- source_word: בֹּשֶׁת
  choice: Schande
  rationale: „Schande“ gibt sowohl die Beschämung als auch den öffentlichen Ehrverlust prägnant wieder.
- source_word: לְבֵיתֶךָ
  choice: für dein Haus
  rationale: '„Haus“ wahrt die Bedeutungsbreite von בַּיִת: Gebäude, Haushalt, Familie oder Dynastie. Die Präposition לְ wird als „für“ wiedergegeben, da das geplante Handeln dem eigenen Haus Schande einträgt.'
- source_word: קְצוֹת
  choice: indem du … vernichtet hast
  rationale: Der Infinitiv bezeichnet hier das Abschneiden beziehungsweise Beseitigen vieler Völker. „Vernichtet“ vermittelt die gewaltsame, umfassende Bedeutung im Kontext klarer als das im Deutschen missverständliche „abgeschnitten“; „indem“ bildet die instrumentale Beziehung zum Hauptsatz ab.
- source_word: עַמִּים רַבִּים
  choice: viele Völker
  rationale: „Völker“ entspricht dem kollektiven Plural und vermeidet die modernen staatsrechtlichen Anklänge von „Nationen“.
- source_word: וְחוֹטֵא
  choice: und dich … versündigt
  rationale: Das Qal-Partizip führt die Anklage fort. Die idiomatische Verbindung „sich an jemandem versündigen“ lässt sich mit נַפְשֶׁךָ natürlich verbinden und bewahrt die Vorstellung schuldhaften Handelns gegen das eigene Leben.
- source_word: נַפְשֶׁךָ
  choice: deinem eigenen Leben
  rationale: נֶפֶשׁ kann Leben, Selbst oder Seele bezeichnen. „Eigenes Leben“ hebt hier die selbstzerstörerische Folge des Unrechts hervor, ohne eine später entwickelte Leib-Seele-Terminologie einzutragen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang prophetischen Gerichts
  choice: Leben
  alternative: Seele; dich selbst
  rationale: Im Kontext richtet sich das gewaltsame Handeln gegen den Täter selbst und gefährdet sein Leben. „Leben“ gibt diese konkrete Gerichtsfolge wieder; die lexikalisch möglichen Alternativen werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt anklagend und direkt; „Haus“ bewahrt die mögliche Bedeutung von Haushalt oder Dynastie. Die Partizipialkonstruktion wird zugunsten eines natürlichen deutschen Satzbaus als koordinierte Verbform wiedergegeben.
