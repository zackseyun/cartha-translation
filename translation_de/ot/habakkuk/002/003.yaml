  text: כִּ֣י ע֤וֹד חָזוֹן֙ לַ/מּוֹעֵ֔ד וְ/יָפֵ֥חַ לַ/קֵּ֖ץ וְ/לֹ֣א יְכַזֵּ֑ב אִם יִתְמַהְמָהּ֙ חַכֵּה ל֔/וֹ כִּֽי בֹ֥א יָבֹ֖א לֹ֥א יְאַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/003.yaml
  text: For the vision is still for the appointed time[a]; it hastens toward the end and will not lie. If it delays, wait for it, for it will surely come[b]; it will not be late.
translation:
  language: de
  text: Denn die Vision ist noch für die festgesetzte Zeit bestimmt; sie drängt dem Ende entgegen[a] und wird nicht täuschen. Wenn sie sich verzögert, warte auf sie[b]; denn sie wird ganz gewiss kommen, sie wird nicht zu spät kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb ist schwierig. Auch möglich: „sie keucht dem Ende entgegen“ oder „sie spricht vom Ende“. Der Haupttext gibt den Sinn wieder, dass die Vision ihrer festgesetzten Erfüllung entgegengeht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Wenn er sich verzögert, warte auf ihn.“ Die hebräische Formulierung ist in ihren grammatischen Bezügen schwierig und kann auch persönlich verstanden werden. Hebräer 10,37 nimmt die Aussage in diesem Sinn auf.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוֹן
  choice: Vision
  rationale: Die übliche Wiedergabe für eine prophetische Schau oder Offenbarung; sie passt zum unmittelbaren Zusammenhang dessen, was Habakuk aufschreiben und erwarten soll.
- source_word: לַמּוֹעֵד
  choice: für die festgesetzte Zeit bestimmt
  rationale: מוֹעֵד bezeichnet einen festgelegten Zeitpunkt. Die Formulierung bewahrt den Gedanken, dass die Erfüllung einen bestimmten Zeitpunkt hat.
- source_word: וְיָפֵחַ לַקֵּץ
  choice: sie drängt dem Ende entgegen
  rationale: Das schwierige Verb kann ein Keuchen oder Atemholen und damit eine dringliche Bewegung zum Ziel ausdrücken. Die Wiedergabe ist im Deutschen verständlich, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: וְלֹא יְכַזֵּב
  choice: und wird nicht täuschen
  rationale: Das Verb bedeutet lügen, trügen oder sich als falsch erweisen. „Nicht täuschen“ erhält die Personifizierung der Vision und klingt im modernen Deutschen natürlich.
- source_word: אִם יִתְמַהְמָהּ
  choice: Wenn sie sich verzögert
  rationale: Das Verb bezeichnet ein Zögern, Säumen oder Sichverzögern. Die Formulierung bewahrt die Spannung zur abschließenden Zusage, sie werde nicht zu spät kommen.
- source_word: חַכֵּה לוֹ
  choice: warte auf sie
  rationale: Das maskuline hebräische Suffix bezieht sich im Kontext am ehesten auf das ebenfalls maskuline Substantiv חָזוֹן. Da „Vision“ im Deutschen feminin ist, lautet der sachlich entsprechende Rückbezug „sie“.
- source_word: כִּי בֹא יָבֹא
  choice: denn sie wird ganz gewiss kommen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Gewissheit des Kommens; „ganz gewiss“ gibt diese Betonung idiomatisch wieder.
- source_word: לֹא יְאַחֵר
  choice: sie wird nicht zu spät kommen
  rationale: Das Verb bezeichnet ein Zuspätkommen oder eine Verzögerung. Die Wiedergabe stellt klar, dass die Vision trotz scheinbaren Säumens zum festgesetzten Zeitpunkt eintrifft.
theological_decisions:
- issue: Bezug der Pronomen in der zweiten Vershälfte
  choice: Die Pronomen beziehen sich im Haupttext auf die Vision und ihre Erfüllung.
  alternative: Die Aussagen können persönlich verstanden und mit „er/ihn“ wiedergegeben werden; Hebräer 10,37 nimmt die Zeile in persönlicher Weise auf.
  rationale: Im hebräischen Zusammenhang ist חָזוֹן, „Vision“, der nächstliegende Bezug. Da dieses Wort im Hebräischen maskulin ist, erklären sich die maskulinen Formen ohne einen Wechsel zu einer Person. Die persönliche Lesart ist für die Wirkungsgeschichte bedeutsam, soll aber nicht in den Haupttext von Habakuk eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am prophetischen Duktus, vermeidet jedoch altertümliche Wörter wie „harren“ oder „säumen“. Die scheinbare Spannung zwischen Verzögerung und pünktlichem Eintreffen bleibt bewusst erhalten.
