  text: וַ/יַּעֲנֵ֤/נִי יְהוָה֙ וַ/יֹּ֔אמֶר כְּת֣וֹב חָז֔וֹן וּ/בָאֵ֖ר עַל הַ/לֻּח֑וֹת לְמַ֥עַן יָר֖וּץ ק֥וֹרֵא בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/002.yaml
  text: 'Then Yahweh answered me and said: “Write the vision; make it plain on tablets[a], so that one who reads it may run.”'
translation:
  language: de
  text: 'Da antwortete mir Jahwe und sagte: »Schreib die Vision auf und halte sie auf Tafeln klar fest, damit der, der sie liest, laufen kann.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit der, der sie liest, mit ihr laufen kann«; oder: »damit man sie im Laufen lesen kann«; oder: »damit man sie rasch lesen kann«. Die knappe hebräische Formulierung lässt mehrere Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעֲנֵנִי
  choice: Da antwortete mir
  rationale: ענה bedeutet hier natürlich »antworten«; das Suffix der 1. Person Singular wird mit »mir« bewahrt. »Da« gibt die hebräische Erzählfolge idiomatisch wieder.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: Direkte, natürliche Wiedergabe der fortlaufenden hebräischen Erzählform.
- source_word: כְּתוֹב חָזוֹן
  choice: Schreib die Vision auf
  rationale: כתב ist ein direkter Schreibbefehl; »aufschreiben« klingt im Deutschen beim Festhalten einer prophetischen Vision natürlich. Der Kontext bestimmt חזון als die konkrete Vision.
- source_word: וּבָאֵר עַל הַלֻּחוֹת
  choice: und halte sie deutlich auf Tafeln fest
  rationale: Das Piel von באר bezeichnet hier ein deutliches beziehungsweise klar lesbares Festhalten. Die Formulierung bindet den Ausdruck natürlich an das Schreiben auf Tafeln, ohne deren Material näher zu bestimmen.
- source_word: לְמַעַן
  choice: damit
  rationale: Natürliche deutsche Einleitung eines Zweck- oder Folgesatzes.
- source_word: יָרוּץ קוֹרֵא בוֹ
  choice: damit der, der sie liest, laufen kann
  rationale: Der substantivisch gebrauchte Partizip bezeichnet den Lesenden; רוץ wird zunächst mit seinem direkten Sinn »laufen« wiedergegeben. Das feminine Pronomen »sie« bezieht sich idiomatisch auf »die Vision«.
theological_decisions:
- issue: Deutung von לְמַעַן יָרוּץ קוֹרֵא בוֹ
  choice: damit der, der sie liest, laufen kann
  alternative: damit der, der sie liest, mit ihr laufen kann; damit man sie im Laufen oder rasch lesen kann
  rationale: Die knappe hebräische Wendung lässt mehrere plausible syntaktische und pragmatische Deutungen zu. Der Haupttext lässt den Leser als Subjekt von »laufen« stehen und ergänzt kein im Hebräischen unausgedrücktes Objekt. Die echten Alternativen werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Imperativ ist unmittelbar und verständlich; »Tafeln« bleibt hinsichtlich des Materials unbestimmt. Die ungewöhnliche Bildsprache des Laufens wird im Haupttext nicht geglättet.
