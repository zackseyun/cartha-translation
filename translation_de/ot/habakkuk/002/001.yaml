revisions:
- from: Ich will auf meinem Wachposten stehen und mich auf dem Wall aufstellen. Ich will Ausschau halten, um zu sehen, was er in mir[a] reden wird und was ich auf meine Beschwerde[b] erwidern soll.
  to: Ich will auf meinem Wachposten stehen und mich auf dem Wall aufstellen. Ich will Ausschau halten, um zu sehen, was er zu mir reden wird[a] und was ich auf meine Klage[b] antworten soll.
  rationale: Die Revision stellt eine natürliche deutsche Hauptlesart für die göttliche Ansprache her, ohne die durch בִּי eröffnete Möglichkeit innerer prophetischer Rede zu verlieren. Sie verbessert außerdem die Kollokation im letzten Satzteil und erhält sämtliche inhaltlichen und textkritischen Mehrdeutigkeiten mittels korrekt verankerter Fußnoten.
