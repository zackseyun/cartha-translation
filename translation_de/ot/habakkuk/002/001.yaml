source:
  edition: WLC
  text: עַל מִשְׁמַרְתִּ֣/י אֶעֱמֹ֔דָה וְ/אֶֽתְיַצְּבָ֖ה עַל מָצ֑וֹר וַ/אֲצַפֶּ֗ה לִ/רְאוֹת֙ מַה יְדַבֶּר בִּ֔/י וּ/מָ֥ה אָשִׁ֖יב עַל תּוֹכַחְתִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/001.yaml
  text: I will stand at my guard post and station myself on the rampart[a]; I will keep watch to see what he will speak in me[b], and what I should answer concerning my complaint.
translation:
  language: de
  text: Ich will auf meinem Wachposten stehen und mich auf dem Wall aufstellen. Ich will Ausschau halten, um zu sehen, was er zu mir reden wird[a] und was ich auf meine Klage[b] antworten soll.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was er in mir reden wird“; dies kann auf innere prophetische Rede hinweisen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „auf meine Zurechtweisung“ beziehungsweise „auf meinen Einwand/meinen Streitfall“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמַרְתִּי
  choice: meinem Wachposten
  rationale: Das Substantiv bezeichnet hier den Ort oder die Aufgabe des Wachens. „Wachposten“ bewahrt das konkrete Bild eines Wächters und ist im modernen Deutschen natürlich.
- source_word: אֶעֱמֹדָה
  choice: Ich will … stehen
  rationale: Die kohortativisch gefärbte Form drückt einen festen Entschluss aus. „Ich will“ gibt diese entschlossene Haltung deutlicher wieder als ein bloßes Futur.
- source_word: וְאֶתְיַצְּבָה
  choice: und mich … aufstellen
  rationale: Der Hitpael bezeichnet das bewusste Einnehmen einer festen Position; die reflexive Form bleibt erhalten.
- source_word: מָצוֹר
  choice: dem Wall
  rationale: Im Zusammenhang ist eine befestigte erhöhte Stellung gemeint. „Wall“ vermittelt das Bild knapp und verständlich, ohne die mögliche Bedeutung „Belagerungswerk“ in den Vordergrund zu rücken.
- source_word: וַאֲצַפֶּה
  choice: Ich will Ausschau halten
  rationale: Das Verb bezeichnet aufmerksames, erwartungsvolles Beobachten. „Ausschau halten“ drückt die anhaltende Erwartung idiomatisch aus.
- source_word: לִרְאוֹת
  choice: um zu sehen
  rationale: Der Infinitiv bezeichnet den Zweck des Ausschauhaltens und wird unmittelbar wiedergegeben.
- source_word: מַה יְדַבֶּר בִּי
  choice: was er in mir reden wird
  rationale: בִּי lautet formal „in mir“. Diese Wiedergabe bewahrt die mögliche Vorstellung innerer prophetischer Rede; die ebenfalls mögliche idiomatische Deutung „zu mir“ wird in einer Fußnote genannt.
- source_word: אָשִׁיב
  choice: was ich … erwidern soll
  rationale: Der Hiphil von שוב kann das Zurückgeben einer Antwort bezeichnen. „Erwidern soll“ gibt sowohl den Antwortcharakter als auch das abwägende Moment im Kontext wieder.
- source_word: עַל תּוֹכַחְתִּי
  choice: auf meine Beschwerde
  rationale: תּוֹכַחַת kann Beschwerde, Zurechtweisung oder Streitfall bezeichnen. Im Anschluss an Habakuks Klage ist „Beschwerde“ gut verständlich; andere mögliche Nuancen bleiben in der Fußnote erhalten.
theological_decisions:
- issue: Deutung von בִּי bei der göttlichen Rede
  choice: „in mir“ als formnahe Wiedergabe möglicher innerer prophetischer Rede
  alternative: „zu mir“ als idiomatische Bezeichnung einer an den Propheten gerichteten Rede
  rationale: Die hebräische Präposition unterstützt unmittelbar „in mir“, während der Gesprächszusammenhang auch „zu mir“ nahelegt. Haupttext und Fußnote bewahren beide Möglichkeiten, ohne die prophetologische Frage abschließend zu entscheiden.
- issue: Bedeutung von תּוֹכַחְתִּי
  choice: die Beschwerde des Propheten
  alternative: meine Zurechtweisung oder mein Streitfall/Einwand
  rationale: Der vorausgehende Abschnitt enthält Habakuks Protest, weshalb „Beschwerde“ kontextuell naheliegt. Die lexikalisch möglichen konfrontativen und forensischen Bedeutungen werden nicht ausgeschlossen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Wächterbildsprache. Die Satzstruktur folgt dem parallelen Aufbau des Hebräischen; „Ich will“ bringt den entschlossenen Ton der Verbformen zum Ausdruck. Die genuine Mehrdeutigkeit von בִּי und תּוֹכַחְתִּי wird durch markierte Fußnoten bewahrt.
