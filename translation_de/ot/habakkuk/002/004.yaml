  terminology: „Gerechte“ und „Treue“ sind sachgerecht. Die Fußnote dokumentiert ausgewogen, dass אֱמוּנָה je nach Kontext auch glaubendes Vertrauen bzw. Glauben bezeichnen kann, ohne den unmittelbaren Kontrast von Hochmut und Beständigkeit zu verwischen. Der Bezug von „seine“ auf den Gerechten wird korrekt beibehalten.
