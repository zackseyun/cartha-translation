source:
  edition: WLC
  text: הִנֵּ֣ה עֻפְּלָ֔ה לֹא יָשְׁרָ֥ה נַפְשׁ֖/וֹ בּ֑/וֹ וְ/צַדִּ֖יק בֶּ/אֱמוּנָת֥/וֹ יִחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/004.yaml
  text: 'Look: his soul is puffed up; it is not upright within him, but the righteous will live by his faithfulness.'
translation:
  language: de
  text: 'Sieh: Aufgeblasen ist seine Seele; sie ist nicht aufrichtig in ihm. Der Gerechte aber wird durch seine Treue leben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Gerechte aber wird durch seinen Glauben (sein Vertrauen) leben.“ Das hebräische Wort kann Treue, Verlässlichkeit oder glaubendes Vertrauen bezeichnen.'
    reason: Macht die echte Bedeutungsbreite von אֱמוּנָה sichtbar und bewahrt zugleich die traditionsgeschichtlich bedeutsame alternative Wiedergabe.
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und unmittelbar wieder.
- source_word: עֻפְּלָה
  choice: aufgeblasen
  rationale: Bewahrt das Bild von Überheblichkeit beziehungsweise innerem Aufgeblähtsein, ohne es auf eine einzige abstrakte Deutung zu reduzieren.
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: Formnahe Wiedergabe, die hier die innere Person bezeichnet und die Bildsprache des Ausgangstextes erhält.
- source_word: יָשְׁרָה
  choice: aufrichtig
  rationale: Entspricht dem moralisch-räumlichen Bild des Geradeseins und klingt im Deutschen natürlich.
- source_word: בֶּאֱמוּנָתוֹ
  choice: durch seine Treue
  rationale: אֱמוּנָה bezeichnet hier Festigkeit, Verlässlichkeit oder Treue; die Präposition kann Mittel oder Grundlage ausdrücken. Die Wiedergabe lässt den Bezug des Possessivpronomens beim Gerechten bestehen.
- source_word: יִחְיֶה
  choice: wird leben
  rationale: Bewahrt die offene Zukunfts- beziehungsweise Folgebedeutung, ohne das Leben vorschnell nur zeitlich oder ausschließlich eschatologisch festzulegen.
theological_decisions:
- issue: Bedeutung von אֱמוּנָה
  choice: Treue
  alternative: Glaube / Vertrauen
  rationale: Im hebräischen Kontext steht die standhafte Verlässlichkeit des Gerechten im Kontrast zur aufgeblasenen, nicht aufrichtigen Person. Zugleich wird die traditionsgeschichtlich wichtige Bedeutungsnähe zu Glauben und Vertrauen in einer Fußnote kenntlich gemacht.
- issue: Bezug von „seine“ in „seine Treue“
  choice: Bezug auf den Gerechten
  alternative: Bezug auf Gott
  rationale: Die nächstliegende grammatische Zuordnung ist die Treue des Gerechten. Eine ausdrückliche Umdeutung auf Gottes Treue würde einen im hebräischen Wortlaut nicht genannten Bezug einführen.
- issue: Sinn von „leben“
  choice: unbestimmt als „leben“ belassen
  alternative: am Leben bleiben / ewiges Leben haben
  rationale: Der Vers lässt Reichweite und Zeithorizont des Lebens offen; die Übersetzung soll diese theologische Spannung nicht einengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „Sieh“ wahrt den markanten Auftakt; zwei Hauptsätze machen den Gegensatz klar. „Seele“ erhält bewusst die hebräische Bildsprache, während „in ihm“ idiomatisch genug bleibt.
