revisions:
- from: Werden nicht plötzlich deine Gläubiger[a] aufstehen und die aufwachen, die dich erzittern lassen? Dann wirst du ihnen zur Beute.
  to: Werden nicht plötzlich deine Gläubiger aufstehen und die, die dich zittern lassen, erwachen? Dann wirst du ihnen zur Beute werden.
  rationale: Die Revision beseitigt eine deutsche syntaktische Mehrdeutigkeit, ohne die offene poetische Beziehung zwischen den beiden Gegnerbezeichnungen zu verändern. »Zittern lassen« ist gegenüber »erzittern lassen« die geläufigere moderne Formulierung und wahrt die kausative Bildsprache. Die Fußnote bleibt unverändert, da sie die lexikalische Ambivalenz von נֹשְׁכֶיךָ angemessen dokumentiert.
