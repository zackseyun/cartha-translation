base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/007.yaml
  text: Will not your creditors suddenly rise[a], and those who make you tremble awake? Then you will become plunder for them.
translation:
  language: de
  text: Werden nicht plötzlich deine Gläubiger aufstehen und die, die dich zittern lassen, erwachen? Dann wirst du ihnen zur Beute werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: Werden nicht
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet, und passt zur Zukunftsbedeutung der folgenden Verben.
- source_word: פֶתַע
  choice: plötzlich
  rationale: Gibt die adverbiale Bedeutung der unvermittelten, überraschenden Wendung knapp und natürlich wieder.
- source_word: יָקוּמוּ
  choice: aufstehen
  rationale: Bewahrt die Grundbedeutung von קום und lässt im Kontext das feindliche Sich-Erheben erkennen.
- source_word: נֹשְׁכֶיךָ
  choice: deine Gläubiger
  rationale: Das Wort hängt mit נשׁך, »beißen«, zusammen, kann im wirtschaftlichen Zusammenhang aber diejenigen bezeichnen, die eine Schuld samt Zins eintreiben. »Gläubiger« macht die Umkehrung gegenüber dem räuberischen Schuldner verständlich; das mögliche Beißbild bleibt in der Fußnote erhalten.
- source_word: וְיִקְצוּ
  choice: aufwachen
  rationale: Gibt wahrscheinlich יקץ, »erwachen«, wieder und erhält den poetischen Parallelismus zu »aufstehen«.
- source_word: מְזַעְזְעֶיךָ
  choice: die dich erzittern lassen
  rationale: Bewahrt die verursachende und bildhafte Bedeutung des Erschütterns beziehungsweise In-Schrecken-Versetzens, ohne sie unnötig festzulegen.
- source_word: וְהָיִיתָ
  choice: Dann wirst du
  rationale: »Dann« verdeutlicht im Deutschen natürlich die Folge, die aus der rhetorischen Frage hervorgeht.
- source_word: לִמְשִׁסּוֹת
  choice: zur Beute
  rationale: Bezeichnet etwas, das als Plündergut geraubt wird; »zur Beute« ist idiomatisch und bewahrt das Motiv der vergeltenden Umkehr.
- source_word: לָמוֹ
  choice: ihnen
  rationale: Bezieht das pronominale Element knapp und natürlich auf die zuvor genannten Angreifer.
