base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/012.yaml
  text: Woe to him who builds a city with bloodshed and establishes a town by injustice[a][b].
translation:
  language: de
  text: Wehe dem, der eine Stadt mit Blutvergießen[a] baut und eine Ortschaft durch Unrecht gründet[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Blut(en)“; der hebräische Plural bezeichnet idiomatisch Blutvergießen oder Blutschuld.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder für „gründet“: „fest errichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Wehe-Ruf-Formel kündigt Gericht an und kann zugleich Klage anklingen lassen. „Wehe“ bewahrt diese knappe, eindringliche Kraft.
- source_word: בֹּנֶה
  choice: der … baut
  rationale: Das qal-Partizip bezeichnet denjenigen, der baut; die substantivische Konstruktion wird im Deutschen natürlich mit einem Relativsatz wiedergegeben.
- source_word: עִיר
  choice: Stadt
  rationale: Die übliche Bedeutung ist „Stadt“. Die Wiedergabe unterscheidet den Ausdruck vom folgenden, annähernd synonymen קִרְיָה.
- source_word: בְּדָמִים
  choice: mit Blutvergießen
  rationale: Der hebräische Plural „Blute“ bezeichnet idiomatisch Blutvergießen beziehungsweise Blutschuld. „Mit Blutvergießen“ erhält die instrumentale Bedeutung der Präposition und ist im Deutschen verständlich.
- source_word: וְכוֹנֵן
  choice: und … gründet
  rationale: Das Verb bezeichnet das feste Errichten oder Gründen. „Gründet“ passt zur Entstehung eines Gemeinwesens, wahrt die Parallelität zu „baut“ und lässt den Aspekt dauerhafter Festigung erkennen.
- source_word: קִרְיָה
  choice: Ortschaft
  rationale: Das Wort ist ein poetisches Nahsynonym zu עִיר. „Ortschaft“ bildet die lexikalische Variation ab, ohne einen präzisen Größenunterschied zu behaupten.
- source_word: בְּעַוְלָה
  choice: durch Unrecht
  rationale: Das Substantiv bezeichnet Unrecht oder Ungerechtigkeit. „Durch“ macht das Unrecht als Mittel der Gründung klar und entspricht dem instrumentalen Gebrauch von בְּ.
theological_decisions:
- issue: Charakter des Weherufs
  choice: Prophetischer Weheruf gegen den Aufbau eines Gemeinwesens durch Gewalt und Unrecht
  alternative: Allgemeine Klage über städtische Verderbtheit
  rationale: Der Wortlaut verurteilt ausdrücklich die Mittel des Bauens und Gründens—Blutvergießen und Unrecht—ohne die Aussage auf ein späteres theologisches System oder eine ausdrücklich benannte Macht einzuengen.
- issue: Bedeutung von בְּדָמִים
  choice: Blutvergießen als gewaltsames Mittel
  alternative: Blutschuld als daraus entstehender Schuldzustand
  rationale: Der idiomatische Plural kann beide Vorstellungen berühren. Im Haupttext steht die konkrete Gewalt im Vordergrund; die Fußnote bewahrt die mögliche Nuance der Blutschuld.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Schärfe. „Ortschaft“ wahrt die hebräische Synonymvariation, ohne einen sicheren Größenunterschied zwischen עִיר und קִרְיָה zu unterstellen. Die beiden instrumentalen Wendungen werden zur natürlichen deutschen Variation mit „mit“ und „durch“ wiedergegeben.
