  source_fidelity: Die Grundstruktur folgt dem Hebräischen, doch mehrere Formulierungen sind unnötig interpretierend oder im Deutschen unpräzise. שׂבע meint allgemein »gesättigt sein«, nicht spezifisch »sattgetrunken«. תִּסּוֹב עָלֶיךָ bezeichnet das Sich-Wenden des Gerichtsbechers gegen den Angeredeten. קִיקָלוֹן wird am besten mit der konkreten, drastischen Bedeutung »schändliches Erbrochenes« wiedergegeben; »Unrat« ist dafür zu unspezifisch.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. »Kommt zu dir herum« ist keine natürliche deutsche Wiedergabe; »wird sich gegen dich wenden« gibt Bild und Sinn klar wieder. Die Parallelität von »Ehre« am Anfang und Ende macht den hebräischen Kontrast sichtbar.
  terminology: »Ehre« gibt כָּבוֹד in diesem Kontext von öffentlichem Ansehen präziser wieder als »Herrlichkeit«. »Unbeschnittenheit« bewahrt das im Text stehende körperliche und entehrende Bild, ohne es auszudeuten. HERR bleibt als etablierte Wiedergabe des Tetragramms bestehen.
