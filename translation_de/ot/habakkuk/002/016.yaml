source:
  edition: WLC
  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/016.yaml
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
translation:
  language: de
  text: Du hast dich mit Schande gesättigt statt mit Ehre. Trink auch du und zeig deine Unbeschnittenheit![a] Der Becher aus der rechten Hand des HERRN wird sich gegen dich wenden, und schändliches Erbrochenes wird über deine Ehre kommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine abweichende Lesung lautet: »Trink auch du und taumle!«'
    reason: Die schwierige Form וְהֵעָרֵל wird teils aufgrund einer anderen Vokalisierung beziehungsweise Textauffassung von einer Wurzel für Taumeln hergeleitet.
  - marker: b
    text: Das mit »schändliches Erbrochenes« wiedergegebene seltene hebräische Wort kann ein beschämendes Erbrechen bezeichnen und spielt offenbar klanglich mit dem Wort für »Schande« am Versanfang.
    reason: Die drastische Bedeutung und das Wortspiel von קִיקָלוֹן lassen sich in einer knappen deutschen Haupttextfassung nicht vollständig abbilden.
lexical_decisions:
- source_word: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד
  choice: Du hast dich an Schande sattgetrunken statt an Herrlichkeit
  rationale: 'שׂבע bezeichnet das Sattwerden bzw. Sich-satt-Trinken; מן ist hier vergleichend beziehungsweise substitutiv: Schande anstelle der erstrebten Herrlichkeit.'
- source_word: וְהֵעָרֵל
  choice: und zeig dich unbeschnitten
  rationale: Der schwierige Imperativ wird nach der masoretischen Lesung als Aufforderung verstanden, den unbeschnittenen, entehrten Zustand sichtbar werden zu lassen. Die Formulierung bewahrt das konkrete Beschneidungsbild.
- source_word: כּוֹס יְמִין יְהוָה
  choice: Der Becher in der rechten Hand des HERRN
  rationale: Die knappe hebräische Genitivverbindung bezeichnet am natürlichsten den Becher, den die rechte Hand des HERRN hält bzw. reicht; 'HERR' folgt der etablierten deutschen Wiedergabe des Tetragramms.
- source_word: וְקִיקָלוֹן
  choice: und schändlicher Unrat
  rationale: Das seltene Wort enthält wahrscheinlich ein bewusst drastisches Wortspiel mit קָלוֹן und wird häufig mit Erbrochenem oder Unrat verbunden. Die Wiedergabe erhält sowohl die Körperlichkeit als auch den Schandaspekt.
- source_word: עַל כְּבוֹדֶךָ
  choice: kommt über deine Herrlichkeit
  rationale: עַל wird räumlich-metaphorisch wiedergegeben; die vermeintliche Herrlichkeit wird von entehrendem Unrat bedeckt.
theological_decisions:
- issue: Der Becher als Bild des göttlichen Gerichts
  choice: Der Becher in der rechten Hand des HERRN kommt zu dir herum
  alternative: Der Becher von der rechten Hand des HERRN
  rationale: Die Fassung wahrt das alttestamentliche Gerichtsbild und vermeidet eine erklärende dogmatische Ausdeutung.
- issue: Unbeschnittenheit als öffentliche Entehrung
  choice: zeig dich unbeschnitten
  alternative: taumle
  rationale: Die Konsonanten und die masoretische Vokalisierung stützen 'unbeschnitten sein/werden'. Eine verbreitete abweichende Lesung versteht die Form hingegen als 'taumeln'; diese echte Textunsicherheit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildsprache. Die drastische Schlusswendung wird nicht verharmlost; die unsichere Lesung in der Versmitte wird transparent ausgewiesen.
