  text: וְ/אַף֙ כִּֽי הַ/יַּ֣יִן בּוֹגֵ֔ד גֶּ֥בֶר יָהִ֖יר וְ/לֹ֣א יִנְוֶ֑ה אֲשֶׁר֩ הִרְחִ֨יב כִּ/שְׁא֜וֹל נַפְשׁ֗/וֹ וְ/ה֤וּא כַ/מָּ֨וֶת֙ וְ/לֹ֣א יִשְׂבָּ֔ע וַ/יֶּאֱסֹ֤ף אֵלָי/ו֙ כָּל הַ/גּוֹיִ֔ם וַ/יִּקְבֹּ֥ץ אֵלָ֖י/ו כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/005.yaml
  text: Moreover[a], wine betrays; an arrogant man does not remain at rest. He enlarges his appetite like Sheol, and he is like death and is never satisfied[c][b]. He gathers to himself all the nations and collects to himself all the peoples.
translation:
  language: de
  text: Mehr noch:[a] Der Wein ist trügerisch; ein überheblicher Mann kommt nicht zur Ruhe.[b] Er weitet seine Gier wie die Scheol,[c] er ist wie der Tod und wird niemals satt. Er sammelt alle Nationen bei sich und versammelt alle Völker um sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ja, mehr noch“. Das Hebräische ist knapp und nicht leicht zu deuten; manche beziehen die Aussage über den Wein umfassender auf den berauschten Hochmut des stolzen Eroberers.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „bleibt nicht zu Hause“, „bleibt nicht“ oder „ruht nicht“. Das hebräische Verb ist schwierig; der Haupttext gibt im Zusammenhang die rastlose Unbeständigkeit wieder.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Scheol ist der Bereich der Toten; auch möglich: „das Totenreich“ oder „das Grab“.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאַף כִּי
  choice: Mehr noch
  rationale: Die Verbindung wirkt hier verstärkend und überleitend, nicht eindeutig kausal. „Mehr noch“ gibt diese additive Steigerung knapp und natürlich wieder.
- source_word: הַיַּיִן בּוֹגֵד
  choice: Der Wein ist treulos
  rationale: Der hebräische Text nennt ausdrücklich den Wein und beschreibt ihn mit einem Partizip für treuloses oder betrügerisches Handeln. Die Personifikation und die interpretative Schwierigkeit bleiben erhalten.
- source_word: גֶּבֶר יָהִיר
  choice: ein überheblicher Mann
  rationale: גֶּבֶר bezeichnet hier den Mann, während יָהִיר seine anmaßende, hochmütige Haltung kennzeichnet. „Überheblich“ trifft den moralischen Ton in heutigem Deutsch.
- source_word: וְלֹא יִנְוֶה
  choice: kommt nicht zur Ruhe
  rationale: Das schwierige Verb kann mit wohnen, bleiben oder ruhen verbunden werden. Die gewählte Fassung bringt im Kontext die rastlose Unersättlichkeit zum Ausdruck, ohne die engere Deutung „bleibt nicht zu Hause“ festzuschreiben.
- source_word: הִרְחִיב ... נַפְשׁוֹ
  choice: weitet seine Gier
  rationale: Das Hifil bezeichnet ein Weitmachen; נֶפֶשׁ kann hier das begehrende Selbst beziehungsweise den unersättlichen Appetit bezeichnen. „Gier“ vermittelt die gefräßige Begierde idiomatisch, während „weitet“ das Bild des Ausgangstextes bewahrt.
- source_word: כִּשְׁאוֹל
  choice: wie der Scheol
  rationale: Der Eigenbegriff für den Bereich der Toten wird beibehalten, damit das Bild seiner Unersättlichkeit nicht auf ein einzelnes Grab verengt wird.
- source_word: וְלֹא יִשְׂבָּע
  choice: wird niemals satt
  rationale: Die Wendung beschreibt fortdauernde Unersättlichkeit. „Niemals satt“ greift zugleich das Bild der ausgeweiteten Gier natürlich auf.
- source_word: וַיֶּאֱסֹף ... וַיִּקְבֹּץ
  choice: rafft ... an sich und sammelt ... bei sich
  rationale: Die zwei parallelen Verben des Zusammenbringens werden unterschieden wiedergegeben. „Rafft an sich“ macht beim ersten Verb den aggressiven Eroberungsdrang hörbar, ohne den Parallelismus aufzulösen.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Totenreich; das Grab
  rationale: Der Ausdruck bezeichnet in der alttestamentlichen Vorstellungswelt den Bereich der Toten und nicht lediglich eine Grabstätte. Die Beibehaltung des Begriffs wahrt die Bildwelt und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen, kräftigen Sätzen. Die personifizierenden Bilder von Wein, Scheol und Tod sowie der Parallelismus von Nationen und Völkern bleiben erhalten. Die schwierigen Stellen werden nicht stillschweigend vereindeutigt, sondern im Haupttext lesbar und in den Fußnoten transparent wiedergegeben.
