source:
  edition: WLC
  text: הֲ/לוֹא אֵ֣לֶּה כֻלָּ֗/ם עָלָי/ו֙ מָשָׁ֣ל יִשָּׂ֔אוּ וּ/מְלִיצָ֖ה חִיד֣וֹת ל֑/וֹ וְ/יֹאמַ֗ר ה֚וֹי הַ/מַּרְבֶּ֣ה לֹּא ל֔/וֹ עַד מָתַ֕י וּ/מַכְבִּ֥יד עָלָ֖י/ו עַבְטִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/006.yaml
  text: Will not all of these take up a taunt against him[a], with mockery and riddles about him, and say, “Woe to him who heaps up what is not his—how long?—and loads himself with pledged goods!”
translation:
  language: de
  text: 'Werden nicht alle diese über ihn einen Spottvers anheben, eine höhnische Rede in Rätseln über ihn vortragen und sagen:


    »Wehe dem, der anhäuft, was ihm nicht gehört – wie lange noch? –

    und sich mit Pfandgut belastet[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sich mit dickem Lehm belastet«. Das seltene hebräische Wort kann auf als Pfand genommenes Gut hinweisen, möglicherweise aber zugleich mit dem Bild einer schweren Lehmmasse spielen, die den Sammler selbst belastet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָשָׁל
  choice: Spottlied
  rationale: Im prophetischen Gerichtskontext bezeichnet das Wort hier keinen neutralen Weisheitsspruch, sondern einen formelhaften, höhnischen Spruch gegen den Unterdrücker. »Spottlied« gibt Funktion und Ton natürlich wieder.
- source_word: יִשָּׂאוּ
  choice: anstimmen
  rationale: Mit מָשָׁל bildet das Verb die Wendung, einen Spruch zu erheben beziehungsweise vorzutragen. »Ein Spottlied anstimmen« ist im Deutschen idiomatisch und bewahrt den feierlich-öffentlichen Charakter.
- source_word: מְלִיצָה חִידוֹת
  choice: einen spöttischen Rätselspruch
  rationale: Die Verbindung beschreibt eine höhnische, zugleich zugespitzte und rätselhafte Rede. Die Einzahl »Rätselspruch« ist im Deutschen natürlicher, während der Sammelcharakter des hebräischen Plurals mitgemeint bleibt.
- source_word: הוֹי
  choice: Wehe
  rationale: »Wehe« bewahrt den für prophetische Gerichtsansagen typischen Klang zwischen Klage und Verurteilung.
- source_word: הַמַּרְבֶּה לֹּא לוֹ
  choice: der anhäuft, was ihm nicht gehört
  rationale: Die Form bezeichnet fortgesetztes Vermehren oder Ansammeln. Die Übersetzung macht den Vorwurf unrechtmäßiger Bereicherung deutlich, ohne die Art des Besitzes enger festzulegen.
- source_word: עַד מָתַי
  choice: wie lange noch?
  rationale: Die konventionelle Protestfrage erhält durch »noch« ihre natürliche deutsche Dringlichkeit und bleibt als abrupter Einschub stehen.
- source_word: וּמַכְבִּיד עָלָיו
  choice: und sich … belastet
  rationale: Die Konstruktion vermittelt das Bild, dass der Raffende eine schwere Last auf sich selbst bringt. Die reflexive Wiedergabe passt zum Zusammenhang und bewahrt die ironische Umkehr.
- source_word: עַבְטִיט
  choice: Pfandgut
  rationale: Das seltene Wort wird im wirtschaftlichen Zusammenhang als Pfänder beziehungsweise als auf Schuld beruhendes Gut verstanden. »Pfandgut« ist knapp und lässt den Bezug auf ausbeuterische Aneignung erkennen; die traditionelle Deutung als schwere Lehmmasse bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Deutung des seltenen Ausdrucks עַבְטִיט
  choice: 'wirtschaftliches Bild: »Pfandgut«'
  alternative: »dicker Lehm« beziehungsweise »Lehmklumpen«
  rationale: Der Zusammenhang verurteilt räuberisches Anhäufen und wirtschaftliche Ausbeutung; daher ist die wirtschaftliche Deutung im Haupttext am wahrscheinlichsten. Da das seltene Wort möglicherweise zugleich eine schwere Masse bezeichnet oder ein entsprechendes Wortspiel enthält, wird diese echte lexikalische Spannung nicht beseitigt, sondern in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die öffentliche, höhnische Form des Gerichtsspruchs wird durch »Spottlied anstimmen« und »Rätselspruch« bewahrt. Der abrupte Einschub »wie lange noch?« erhält die rhetorische Spannung des Hebräischen.
