source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה שַׁלּ֨וֹתָ֙ גּוֹיִ֣ם רַבִּ֔ים יְשָׁלּ֖וּ/ךָ כָּל יֶ֣תֶר עַמִּ֑ים מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/008.yaml
  text: Because you have plundered many nations[a], all the remnant of the peoples will plunder you—because of human blood and violence done to the land, to the city, and to all who dwell in it.
translation:
  language: de
  text: Weil du viele Nationen ausgeplündert hast, werden alle, die von den Völkern übrig geblieben sind, dich ausplündern – wegen des Blutes von Menschen[a] und wegen der Gewalt gegen das Land, die Stadt und alle, die darin wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen des Vergießens von Menschenblut“.'
    reason: 'Lexikalische Alternative: Der hebräische Ausdruck lautet wörtlich „wegen des Blutes von Menschen“ und kann idiomatisch das Vergießen menschlichen Blutes bezeichnen.'
lexical_decisions:
- source_word: שַׁלּוֹתָ / יְשָׁלּוּךָ
  choice: ausgeplündert hast / werden … ausplündern
  rationale: '„Ausplündern“ bezeichnet die gewaltsame Wegnahme von Beute und bewahrt durch die Wiederholung desselben Verbs die im Hebräischen betonte Umkehrung: Der Plünderer wird selbst geplündert.'
- source_word: גּוֹיִם רַבִּים
  choice: viele Nationen
  rationale: „Nationen“ gibt den internationalen und politischen Sinn von גּוֹיִם im Zusammenhang imperialer Eroberung treffend wieder.
- source_word: כָּל יֶתֶר עַמִּים
  choice: alle, die von den Völkern übrig geblieben sind
  rationale: Die Formulierung bewahrt den Gedanken des verbliebenen Restes bzw. der Überlebenden und gibt zugleich den lexikalischen Wechsel von גּוֹיִם zu עַמִּים mit „Völker“ wieder.
- source_word: מִדְּמֵי אָדָם
  choice: wegen des Blutes von Menschen
  rationale: מִן ist hier kausal. Die konkrete Blutmetaphorik und der generische menschliche Bezug von אָדָם bleiben erhalten, ohne im Deutschen das missverständliche generische „Mann“ zu verwenden.
- source_word: וַחֲמַס
  choice: und wegen der Gewalt gegen
  rationale: חָמָס bezeichnet Gewalt, gewaltsames Unrecht oder Frevel. Die Wiederaufnahme von „wegen“ verdeutlicht im Deutschen die elliptische kausale Konstruktion, ohne ihren Inhalt zu erweitern.
- source_word: אֶרֶץ
  choice: das Land
  rationale: Im Kontext bezeichnet אֶרֶץ am ehesten das von der Eroberung verwüstete Land, nicht notwendig die gesamte Erde.
- source_word: קִרְיָה
  choice: die Stadt
  rationale: „Stadt“ ist die natürliche Standardentsprechung für קִרְיָה.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: und alle, die darin wohnen
  rationale: Diese Formulierung bewahrt die verbale Kraft des hebräischen Partizips und ist zugleich natürliches modernes Deutsch.
theological_decisions:
- issue: Generischer menschlicher Bezug von אָדָם in דְּמֵי אָדָם
  choice: Blut von Menschen
  alternative: Menschenblut / an Menschen begangenes Blutvergießen
  rationale: אָדָם ist hier kollektiv und nicht männlich-spezifisch. „Menschen“ gibt diesen Umfang im Deutschen eindeutig wieder; die Fußnote nennt die idiomatische Deutung als Blutvergießen, ohne sie allein in den Haupttext einzutragen.
- issue: Bezug von יֶתֶר עַמִּים
  choice: die von den Völkern übrig Gebliebenen
  alternative: der ganze Rest der Völker / alle übrigen Völker
  rationale: Die gewählte Fassung lässt offen, ob kollektiv an Restvölker oder konkret an Überlebende gedacht ist, und vermeidet, den Ausdruck bloß im Sinn von „die anderen Völker“ zu verflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Form „ausplündern“ erhält das Wortspiel der Vergeltung; die etwas ausführlichere Wiedergabe von יֶתֶר macht den Gedanken des verbliebenen Restes verständlich. Der Gedankenstrich markiert den nachgestellten Grund der Vergeltung.
