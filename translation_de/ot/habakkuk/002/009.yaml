source:
  edition: WLC
  text: ה֗וֹי בֹּצֵ֛עַ בֶּ֥צַע רָ֖ע לְ/בֵית֑/וֹ לָ/שׂ֤וּם בַּ/מָּרוֹם֙ קִנּ֔/וֹ לְ/הִנָּצֵ֖ל מִ/כַּף רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/009.yaml
  text: Woe to him who gains evil profit for his house, to set his nest on high, to escape from the grasp of harm.
translation:
  language: de
  text: Wehe dem, der für sein Haus unrechtmäßigen Gewinn macht, um sein Nest hoch oben anzulegen und der Hand des Unheils zu entkommen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּצֵעַ בֶּצַע רָע
  choice: unrechten Gewinn anhäuft
  rationale: Die Wortverbindung bezeichnet das Erlangen oder Anhäufen eines bösen beziehungsweise unrechtmäßigen Gewinns. Die deutsche Fassung gibt sowohl die fortgesetzte Bereicherung als auch ihre moralische Verwerflichkeit natürlich wieder.
- source_word: לְבֵיתוֹ
  choice: für sein Haus
  rationale: בַּיִת kann sowohl das konkrete Haus als auch Haushalt oder Dynastie bezeichnen. „Haus“ bewahrt diese im Kontext wichtige Mehrdeutigkeit.
- source_word: לָשׂוּם בַּמָּרוֹם קִנּוֹ
  choice: um sein Nest in der Höhe anzulegen
  rationale: Das Bild vom hoch gelegenen Nest steht für vermeintliche Sicherheit und wird im Deutschen direkt und verständlich erhalten.
- source_word: מִכַּף רָע
  choice: dem Zugriff des Unheils
  rationale: כַּף bedeutet wörtlich „Handfläche/Hand“ und bezeichnet idiomatisch Gewalt oder Zugriff; רָע kann Böses, Schaden oder Unheil meinen. „Zugriff des Unheils“ bewahrt die personifizierende Bildkraft, ohne die Aussage auf eine bestimmte Art von Katastrophe einzuengen.
theological_decisions:
- issue: Reichweite von „Haus“
  choice: Haus
  alternative: Familie / Dynastie
  rationale: Die offene Bedeutung des hebräischen בַּיִת wird nicht auf Familie, Besitz oder Herrscherhaus festgelegt.
- issue: Bedeutung von רָע am Versende
  choice: Unheil
  alternative: Böses / Schaden / Katastrophe
  rationale: Im Zusammenhang geht es um das Unheil, dem der Täter durch seine erhöhte Stellung entkommen will. „Unheil“ lässt offen, ob menschlicher Schaden, Gericht oder beides gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Weheruf bleibt knapp und eindringlich; das Bild des hoch angelegten Nestes und die Mehrdeutigkeit von „Haus“ werden bewahrt.
