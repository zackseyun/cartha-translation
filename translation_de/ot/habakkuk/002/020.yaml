  text: וַֽ/יהוָ֖ה בְּ/הֵיכַ֣ל קָדְשׁ֑/וֹ הַ֥ס מִ/פָּנָ֖י/ו כָּל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/020.yaml
  text: But Yahweh is in his holy temple[c][b][a]; let all the earth be silent before him.
translation:
  language: de
  text: Doch Jahwe[a] ist in seinem heiligen Tempel. Sei still vor ihm, ganze Erde![b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Gottesname יהוה mit „der HERR“ wiedergegeben; auch die Form „Jehova“ ist gebräuchlich.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Schweig vor ihm“ beziehungsweise „Still vor ihm“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch kann auch bedeuten: „ganzes Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Doch Jahwe
  rationale: Das ו verbindet den Satz mit dem scharfen Gegensatz zu den leblosen Götzen im vorherigen Vers; daher ist „Doch“ kontextgerecht. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: ist in seinem heiligen Tempel
  rationale: הֵיכָל kann „Tempel“, „Palast“ oder „Heiligtum“ bedeuten. „Tempel“ wahrt hier sowohl den kultischen Bezug als auch die mögliche Vorstellung vom himmlischen oder irdischen Heiligtum, ohne sie festzulegen. Die im Hebräischen fehlende Kopula wird im Deutschen mit „ist“ ergänzt.
- source_word: הַס
  choice: Still
  rationale: Die Interjektion fordert unmittelbar und feierlich zum Schweigen auf. „Still!“ bewahrt die knappe, eindringliche Form des Hebräischen besser als eine ausführlichere Umschreibung.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die Wendung bezeichnet wörtlich die Gegenwart beziehungsweise das Angesicht einer Person. „Vor ihm“ ist die natürliche deutsche Entsprechung und wahrt den Gedanken ehrfürchtiger Gegenwart.
- source_word: כָּל הָאָרֶץ
  choice: ganze Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der universale Aufruf im Höhepunkt des Abschnitts spricht für „Erde“, während die mögliche engere Bedeutung in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הֵיכָל als Ort der Gegenwart Gottes
  choice: Tempel
  alternative: Palast; Heiligtum
  rationale: „Tempel“ erhält die kultische Bildwelt und lässt zugleich offen, ob konkret der irdische Tempel oder Gottes himmlischer Thronsaal im Blick ist.
- issue: Reichweite von כָּל הָאָרֶץ
  choice: ganze Erde
  alternative: ganzes Land
  rationale: Der Zusammenhang legt einen umfassenden Aufruf nahe, doch die lexikalisch mögliche engere Deutung als „Land“ wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze Ausruf „Still vor ihm, ganze Erde!“ bildet die feierliche Knappheit des hebräischen הַס nach. Die direkte Anrede „ganze Erde“ hält den universalen und poetischen Charakter des Schlusses fest.
