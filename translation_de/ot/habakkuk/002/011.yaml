  source_fidelity: 'Die Übersetzung gibt die beiden parallelen Bildhälften präzise wieder: אֶבֶן („Stein“), קִיר („Mauer“), זעק („schreien“), כָפִיס als hölzernes Bauteil („Balken“), עֵץ im Baukontext („Holzwerk“) sowie ענה („antworten“). Die futurische Wiedergabe der Imperfekta entspricht dem englischen POB-Audittext und ist im prophetischen Kontext gut vertretbar.'
