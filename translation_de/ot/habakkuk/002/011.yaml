base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/011.yaml
  text: For a stone will cry out from the wall, and a beam from the woodwork will answer it.
translation:
  language: de
  text: Denn der Stein wird aus der Mauer schreien, und der Balken aus dem Holzwerk wird ihm antworten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶבֶן
  choice: Stein
  rationale: Die gewöhnliche und im Bildzusammenhang genaue Entsprechung; der verbaute Stein wird als Zeuge personifiziert.
- source_word: מִקִּיר
  choice: aus der Mauer
  rationale: Gibt die Herkunftsangabe mit מִן natürlich und präzise wieder.
- source_word: תִּזְעָק
  choice: wird schreien
  rationale: Bewahrt die starke Bedeutung von זעק, einem lauten Hilferuf oder Anklageschrei, ohne sie auf eine einzige Funktion festzulegen.
- source_word: כָפִיס
  choice: Balken
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich ein hölzernes Bauteil; „Balken“ ist verständlich und wahrt die Parallelität zum Stein der Mauer.
- source_word: מֵעֵץ
  choice: aus dem Holzwerk
  rationale: Der Ausdruck bezeichnet wörtlich etwas „aus dem Holz“; im baulichen Kontext vermittelt „Holzwerk“ die gemeinte Gebäudestruktur natürlich.
- source_word: יַעֲנֶנָּה
  choice: wird ihm antworten
  rationale: Gibt das Antwortmotiv direkt wieder. Das maskuline deutsche Pronomen richtet sich grammatisch nach „Stein“, während das hebräische Suffix auf das feminine אֶבֶן zurückweist.
theological_decisions:
- issue: Personifizierte Anklage durch das Bauwerk
  choice: „schreien“ und „antworten“ wörtlich beibehalten
  alternative: Das Bauwerk ausdrücklich als Zeugnis gegen den Gewalttäter deuten
  rationale: Der Vers lässt die ausbeuterisch errichteten Bauteile selbst sprechen. Die Übersetzung bewahrt dieses starke poetische Bild, ohne seine Funktion erklärend einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die Personifikation des hebräischen Textes bleiben erhalten.
