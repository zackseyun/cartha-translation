source:
  edition: WLC
  text: כִּ֣י חֲמַ֤ס לְבָנוֹן֙ יְכַסֶּ֔/ךָּ וְ/שֹׁ֥ד בְּהֵמ֖וֹת יְחִיתַ֑/ן מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/017.yaml
  text: For the violence done to Lebanon will cover you[a], and the destruction of beasts will terrify you, because of the blood of man and the violence done to the land, to the city[b], and to all who dwell in it.
translation:
  language: de
  text: Denn die Gewalt gegen den Libanon wird dich bedecken[a], und die Vernichtung der Tiere wird sie in Schrecken versetzen[b] – wegen des vergossenen Menschenblutes[c] und der Gewalt gegen das Land, die Stadt und alle, die darin wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird dich überwältigen“. Hebräisch wörtlich: „wird dich bedecken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „wird sie in Schrecken versetzen“. Das pluralische „sie“ kann die angesprochene Tätergruppe meinen, obwohl sie zuvor in der Einzahl angeredet wird; manche Übersetzungen gleichen den Wechsel zu „dich“ an.'
    reason: textual_ambiguity
  - marker: c
    text: 'Wörtlich: „wegen des Blutes des Menschen“; gemeint ist menschliches Blutvergießen.'
    reason: lexical_clarification
lexical_decisions:
- source_word: חֲמַס לְבָנוֹן
  choice: die Gewalttat am Libanon
  rationale: חָמָס bezeichnet gewaltsames Unrecht; mit לְבָנוֹן ist hier am natürlichsten die gegen den Libanon verübte Gewalt gemeint. „Am Libanon“ hält die Formulierung knapp und lässt offen, ob besonders das Land oder seine Wälder im Blick sind.
- source_word: יְכַסֶּךָּ
  choice: wird dich bedecken
  rationale: Das Verb כסה bedeutet wörtlich „bedecken“. Das Bild der vergeltenden Gewalt, die den Täter selbst bedeckt oder überzieht, bleibt erhalten.
- source_word: שֹׁד בְּהֵמוֹת
  choice: die Vernichtung der Tiere
  rationale: שֹׁד bezeichnet gewaltsame Verwüstung oder Vernichtung; בְּהֵמוֹת meint hier Tiere allgemein und wird als betroffenes Genitivattribut verstanden, ohne es auf Nutzvieh einzuengen.
- source_word: יְחִיתַן
  choice: wird sie in Schrecken versetzen
  rationale: Die Hifil-Form von חתת bedeutet „in Schrecken versetzen“. Der masoretische Text hat ein pluralisches Objektsuffix („sie“), obwohl zuvor ein einzelner Angeredeter mit „dich“ bezeichnet wird; dieser auffällige Wechsel wird nicht stillschweigend geglättet.
- source_word: מִדְּמֵי אָדָם
  choice: wegen des vergossenen Menschenblutes
  rationale: מִן ist kausal („wegen“), und der Plural דָּמִים bezeichnet in diesem Zusammenhang Blutvergießen. „Menschenblut“ gibt den repräsentativen Gebrauch von אָדָם natürlich und geschlechtsübergreifend wieder.
- source_word: וַחֲמַס אֶרֶץ קִרְיָה
  choice: und der Gewalttat an Land und Stadt
  rationale: Die wiederholte Wendung חָמָס wird parallel als an Land und Stadt verübte Gewalt verstanden. Die artikellosen hebräischen Substantive werden knapp ohne bestimmten Artikel wiedergegeben.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: und an allen, die darin wohnen
  rationale: Die partizipiale Wendung wird verbal wiedergegeben und bewahrt so den Bezug auf sämtliche Bewohner der genannten Stadt beziehungsweise des Landes.
theological_decisions:
- issue: Repräsentativer Sinn von אָדָם
  choice: Menschenblut
  alternative: Blut eines Menschen
  rationale: אָדָם kann den Menschen repräsentativ bezeichnen. „Menschenblut“ bewahrt den Bezug auf menschliches Blut, ohne den Kontext unnötig auf einen einzelnen Mann oder eine einzelne Person zu beschränken.
- issue: Numeruswechsel beim Objekt von יְחִיתַן
  choice: sie in Schrecken versetzen
  alternative: dich in Schrecken versetzen
  rationale: Der masoretische Konsonantentext und die Punktierung weisen auf ein pluralisches Objekt hin. Obwohl die Einzahl „dich“ im Kontext leichter erscheint, wird die textliche Spannung beibehalten und in einer Fußnote erläutert.
translation_notes:
  register: Moderne, würdige Prophetensprache mit klarer Satzführung. Das konkrete Bild „bedecken“ und der auffällige Wechsel von „dich“ zu „sie“ bleiben erhalten; schwer verständliche Einzelheiten werden knapp in Fußnoten erläutert.
