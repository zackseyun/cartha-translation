base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/018.yaml
  text: What profit is an idol when its maker has carved it— a cast image and a teacher of lies? For the one who formed it trusts in it[d][c][b][a], making mute idols.
translation:
  language: de
  text: Was nützt ein Götzenbild, dass sein Bildner es geschnitzt hat – ein Gussbild[a] und ein Lehrer der Lüge[b]? Denn sein Bildner vertraut darauf, um stumme Götzen[c] herzustellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Metallbild“. Das hebräische Wort bezeichnet gewöhnlich ein gegossenes Bild.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Lehrer der Lüge“; das Götzenbild wird personifiziert als etwas, das seine Verehrer irreführt.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch den Sinn „wertlose Götzen“ oder „Nichtse“ tragen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הוֹעִיל
  choice: Was nützt
  rationale: Die rhetorische Frage nach Nutzen oder Gewinn wird im modernen Deutschen knapp und natürlich wiedergegeben.
- source_word: פֶּסֶל
  choice: Götzenbild
  rationale: Das Wort bezeichnet ein geschnitztes Kultbild; „Götzenbild“ macht seine Funktion als Gegenstand falscher Verehrung deutlich, während das folgende Verb die Herstellungsweise nennt.
- source_word: כִּי פְסָלוֹ יֹצְרוֹ
  choice: wenn sein Schöpfer es geschnitzt hat
  rationale: כִּי leitet hier die Begründung für die Nutzlosigkeit ein. „Schöpfer“ bewahrt den ironischen Gegensatz zwischen dem Hersteller und dem von ihm geschaffenen Gegenstand; „geschnitzt“ gibt פסל konkret wieder.
- source_word: מַסֵּכָה
  choice: gegossenes Bild
  rationale: Gemeint ist ein durch Metallguss hergestelltes Bild; die Formulierung ist im heutigen Deutschen verständlich.
- source_word: וּמוֹרֶה שָּׁקֶר
  choice: und ein Lehrer der Lüge
  rationale: 'Die wörtliche, personifizierende Metapher bleibt erhalten: Das Bild täuscht seine Verehrer und vermittelt Lüge.'
- source_word: כִּי בָטַח יֹצֵר יִצְרוֹ עָלָיו
  choice: Denn der es geformt hat, vertraut darauf
  rationale: Die Formulierung folgt der hebräischen Wiederholung von יצר soweit natürlich möglich und lässt das Pronomen עָלָיו ausdrücklich auf das Bild zurückverweisen.
- source_word: לַעֲשׂוֹת אֱלִילִים אִלְּמִים
  choice: und macht stumme Götzen
  rationale: Der Infinitiv wird als koordinierte Handlung wiedergegeben. „Stumm“ bezeichnet präzise die Unfähigkeit der Götzen zu sprechen; „Götzen“ trägt den kultisch-polemischen Sinn von אֱלִילִים.
theological_decisions:
- issue: Bezug von „Lehrer der Lüge“
  choice: Die Wendung beschreibt das Götzenbild personifizierend als irreführenden Lehrer.
  alternative: Die Wendung könnte auf einen menschlichen falschen Lehrer oder den Handwerker bezogen werden.
  rationale: Die Syntax verbindet „gegossenes Bild“ und „Lehrer der Lüge“ am natürlichsten als parallele Bezeichnungen desselben Götzenbildes, ohne die Metapher dogmatisch auszuweiten.
- issue: Bedeutungsnuance von אֱלִילִים
  choice: Götzen
  alternative: Nichtse; wertlose Götzen
  rationale: „Götzen“ ist im Haupttext klar und idiomatisch; die mögliche pejorative Nuance der Nichtigkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhetorischer Schärfe. Die personifizierende Bildsprache und die ironische Gegenüberstellung von Schöpfer und Geschaffenem bleiben erhalten; unnötig altertümliche Ausdrücke werden vermieden.
