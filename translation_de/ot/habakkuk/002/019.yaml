source:
  edition: WLC
  text: ה֣וֹי אֹמֵ֤ר לָ/עֵץ֙ הָקִ֔יצָ/ה ע֖וּרִי לְ/אֶ֣בֶן דּוּמָ֑ם ה֣וּא יוֹרֶ֔ה הִנֵּה ה֗וּא תָּפוּשׂ֙ זָהָ֣ב וָ/כֶ֔סֶף וְ/כָל ר֖וּחַ אֵ֥ין בְּ/קִרְבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/019.yaml
  text: Woe to the one who says to wood[a], “Wake up!” and to silent stone, “Arise!” Can it teach? Look— it is overlaid with gold and silver, yet there is no breath at all within it.
translation:
  language: de
  text: 'Wehe dem, der zum Holz sagt: »Wach auf!«, und zum stummen Stein: »Steh auf!« Kann er etwa unterweisen? Sieh: Er ist mit Gold und Silber überzogen, aber in seinem Inneren ist überhaupt kein Atem[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geist«. Das hebräische Wort kann »Atem«, »Wind« oder »Geist« bedeuten. Hier hebt es hervor, dass das Götzenbild kein Leben in sich hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Bewahrt die Kraft des prophetischen Wehrufs und seinen Gerichtston.
- source_word: אֹמֵר
  choice: dem, der … sagt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet im Singular den Menschen, der den Götzen anredet; die Formulierung ist im heutigen Deutsch natürlich.
- source_word: לָעֵץ
  choice: zum Holz
  rationale: Gemeint ist das Material des Götzenbildes, nicht einfach ein Baum; zugleich bleibt die knappe Parallele zum Stein erhalten.
- source_word: הָקִיצָה
  choice: Wach auf!
  rationale: Der Imperativ richtet sich spöttisch an den leblosen Gegenstand und macht die Absurdität der Anrede deutlich.
- source_word: עוּרִי
  choice: Reg dich!
  rationale: Die Formulierung wahrt die poetische Variation gegenüber »Wach auf!« und fordert den unbeweglichen Stein ironisch zum Tätigwerden auf.
- source_word: לְאֶבֶן דּוּמָם
  choice: zum stummen Stein
  rationale: »Stumm« gibt die fehlende Fähigkeit zu sprechen oder zu antworten prägnant wieder und trägt die Ironie des Zusammenhangs.
- source_word: הוּא יוֹרֶה
  choice: Kann er etwa unterweisen?
  rationale: Die rhetorische Frage entspricht der polemischen Stoßrichtung. »Unterweisen« bewahrt den lehrenden Sinn des Hifil von ירה.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Lenkt mit natürlichem, gegenwärtigem Deutsch nachdrücklich auf den sichtbaren Widerspruch hin.
- source_word: תָּפוּשׂ זָהָב וָכֶסֶף
  choice: Er ist mit Gold und Silber überzogen
  rationale: Gibt wieder, dass das Bild mit Edelmetall umhüllt beziehungsweise beschichtet ist.
- source_word: וְכָל רוּחַ אֵין בְּקִרְבּוֹ
  choice: aber in seinem Inneren ist überhaupt kein Atem
  rationale: »Atem« hebt hier die völlige Leblosigkeit hervor; »überhaupt kein« bildet die durch כָל verstärkte Verneinung ab.
theological_decisions:
- issue: Bedeutung von רוּחַ im Schlusssatz
  choice: Atem
  alternative: Geist
  rationale: Im Zusammenhang der Götzenpolemik steht die Leblosigkeit des Bildes im Vordergrund. »Atem« drückt das unmittelbar aus, während die Fußnote die echte Bedeutungsbreite des hebräischen Wortes offenhält.
- issue: Auffassung von הוּא יוֹרֶה
  choice: 'rhetorische Frage: »Kann er etwa unterweisen?«'
  alternative: 'Aussage oder erwartungsvolle Frage: »Er soll unterweisen?« / »Wird er unterweisen?«'
  rationale: Der Kontext verspottet das Vertrauen auf einen leblosen Götzen. Die rhetorische Frage macht dies verständlich, ohne dem Bild tatsächlich Lehrfähigkeit zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Schärfe. Die maskulinen Pronomen nehmen den im Hebräischen maskulinen »Stein« beziehungsweise das als Einheit gedachte Götzenbild auf. Die beiden Befehle sind bewusst unterschiedlich formuliert, um den poetischen Parallelismus nicht einzuebnen.
