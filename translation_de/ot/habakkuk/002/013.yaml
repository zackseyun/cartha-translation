review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist getroffen: Die rhetorische Frage, die Herkunft von Jahwe, der Titel „Herr der Heerscharen“ sowie die Parallelität von Völkern/Nationen und Feuer/Leeres sind erhalten. Die Formulierung „Ist es nicht so …, dass“ setzt jedoch ein zusätzliches „so“ ein und verschachtelt die rhetorische Frage unnötig. „Für nichts“ kann im Deutschen zudem eher „ohne Grund“ als das hebräische Bild von Nichtigkeit/Leerheit bedeuten.'
  naturalness: Die Gedankenstrich-Konstruktion „Ist es nicht so – siehe, es kommt von … –, dass“ ist schwerfällig. Eine direkte Frage mit vorangestelltem „Siehe“ ist klarer und entspricht der knappen, eindringlichen Satzführung besser. „Sich für Leeres abmühen“ ist in würdevoller moderner Bibelsprache verständlich und wahrt die Bildsprache.
  terminology: „Jahwe“ ist eine sachgerechte Wiedergabe des Tetragramms; „Herr der Heerscharen“ ist als traditionelle, nicht einengende Wiedergabe von צְבָאוֹת passend. „Völker“ und „Nationen“ können zur Abbildung der lexikalischen Variation beibehalten werden. „Leeres“ ist hier gegenüber „nichts“ vorzuziehen.
  issues:
  - severity: medium
    issue: Unnötig verschachtelte Satzkonstruktion
    rationale: Die Verbindung „Ist es nicht so – siehe, es kommt von … –, dass“ ist zwar deutbar, aber stilistisch belastet und fügt mit „so“ ein nicht im Ausgangstext ausgedrücktes Element ein. Eine direkte rhetorische Frage bildet הֲלוֹא הִנֵּה klarer ab.
  - severity: medium
    issue: „für nichts“ ist semantisch zu unspezifisch
    rationale: בְּדֵי רִיק bezeichnet das Leere, Nichtige bzw. Vergebliche. „Für nichts“ kann im heutigen Deutsch vor allem „grundlos“ heißen. „Für Leeres“ bewahrt das konkrete Bild und die Aussage der Nichtigkeit.
  - severity: low
    issue: Fußnote a wiederholt weitgehend den Text
    rationale: 'Da der Text bereits „fürs Feuer“ lautet, ist „Oder: für das Feuer“ keine eigenständige sinnvolle Alternative. Die Fußnote sollte stattdessen die im Idiom liegende Bedeutung erläutern.'
  revised_text: Siehe, ist es nicht von Jahwe, dem Herrn der Heerscharen, dass Völker sich fürs Feuer abmühen und Nationen sich für Leeres abmühen?
