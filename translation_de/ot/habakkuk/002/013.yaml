  variant: modern standard German
source:
  edition: WLC
  text: הֲ/ל֣וֹא הִנֵּ֔ה מֵ/אֵ֖ת יְהוָ֣ה צְבָא֑וֹת וְ/יִֽיגְע֤וּ עַמִּים֙ בְּ/דֵי אֵ֔שׁ וּ/לְאֻמִּ֖ים בְּ/דֵי רִ֥יק יִעָֽפוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/013.yaml
  text: Is it not indeed from Yahweh of hosts that peoples labor for fire[b][a], and nations weary themselves for emptiness?
translation:
  language: de
  text: Siehe, ist es nicht von Jahwe, dem Herrn der Heerscharen, dass Völker sich fürs Feuer abmühen und Nationen sich für Leeres abmühen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא הִנֵּה
  choice: Ist es nicht so – siehe
  rationale: Bewahrt sowohl die bejahende rhetorische Frage als auch den hervorhebenden Hinweis הִנֵּה. „Siehe“ ist in gehobener heutiger Bibelsprache verständlich, ohne die Frage in eine bloße Feststellung umzuwandeln.
- source_word: מֵאֵת
  choice: es kommt von
  rationale: Gibt Herkunft beziehungsweise Veranlassung idiomatisch wieder. Die ergänzte Verbform macht den im Hebräischen knappen Nominalsatz im Deutschen verständlich.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, dem Herrn der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen direkt wieder; „Herr der Heerscharen“ bewahrt die traditionelle Weite des Titels, ohne ihn ausschließlich auf irdische Armeen einzuengen.
- source_word: וְיִיגְעוּ עַמִּים
  choice: dass Völker sich … abmühen
  rationale: „Sich abmühen“ bezeichnet anstrengende, aufreibende Arbeit. „Völker“ hält diesen parallelen Ausdruck von לְאֻמִּים unterscheidbar.
- source_word: בְּדֵי אֵשׁ
  choice: fürs Feuer
  rationale: Bewahrt das knappe Bild einer Arbeit, deren Ertrag dem Feuer zufällt beziehungsweise von ihm verzehrt wird. Die mögliche sinngemäße Auslegung wird in der Fußnote genannt.
- source_word: וּלְאֻמִּים
  choice: und Nationen
  rationale: „Nationen“ bildet ein natürliches Gegenstück zu „Völker“ und wahrt die lexikalische Variation des hebräischen Parallelismus.
- source_word: בְּדֵי רִיק
  choice: für nichts
  rationale: Drückt die Zweck- beziehungsweise Ergebnislosigkeit in natürlichem modernem Deutsch aus. Die wörtlichere Bildsprache „für Leeres“ bleibt als Fußnotenalternative erhalten.
- source_word: יִעָפוּ
  choice: sich erschöpfen
  rationale: 'Gibt die intensive, resultative Bedeutung wieder: Die Nationen werden durch ihr vergebliches Mühen völlig müde.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen in der im modernen Deutschen üblichen Form wieder.
- issue: Aussage über Gottes Veranlassung und das Handeln der Völker
  choice: Das Ergebnis ihres Mühens – Feuer und Nichtigkeit – kommt von Jahwe als Gericht.
  alternative: 'Jahwe ist lediglich Beobachter; oder: Jahwe ist moralischer Urheber des bösen Strebens der Völker.'
  rationale: מֵאֵת bezeichnet Quelle oder Veranlassung. Die Übersetzung lässt die starke Aussage göttlicher Verfügung stehen, behauptet jedoch nicht, Gott habe den bösen Willen der Völker hervorgebracht.
- issue: Zeitliche Aussage der Verbformen
  choice: Präsentische Formulierung innerhalb der rhetorischen Aussage
  alternative: 'Futurisch: „werden sich abmühen … werden sich erschöpfen“'
  rationale: Die hebräischen Imperfektformen können hier das sich ergebende beziehungsweise charakteristische Geschehen ausdrücken. Das deutsche Präsens fügt sich natürlich in die rhetorische Frage ein, ohne den Ausgang auf eine einzige Zeitstufe festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst knapper Parallelstruktur. „Siehe“ erhält den hervorhebenden Charakter des Ausgangstextes; Gedankenstriche gliedern die im Deutschen sonst schwer verständliche Einbettung. Die beiden parallelen Substantive werden als „Völker“ und „Nationen“ unterschieden.
