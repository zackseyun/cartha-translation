revisions:
- from: Ist es nicht so – siehe, es kommt von Jahwe, dem Herrn der Heerscharen –, dass Völker sich fürs Feuer[a] abmühen und Nationen sich für nichts[b] erschöpfen?
  to: Siehe, ist es nicht von Jahwe, dem Herrn der Heerscharen, dass Völker sich fürs Feuer abmühen und Nationen sich für Leeres abmühen?
  rationale: Die Revision stellt die rhetorische Frage und die Hervorhebung הִנֵּה in einer im Deutschen klaren Reihenfolge wieder her. „Für Leeres“ gibt רִיק präziser wieder als „für nichts“ und lässt die Bildlichkeit bestehen. Die parallele Wiederholung von „sich abmühen“ ist als bewusste, quellnahe Wiedergabe des hebräischen Parallelismus vertretbar; die Fußnoten erläutern die idiomatischen Wendungen, ohne eine theologische Deutung in den Text einzutragen.
