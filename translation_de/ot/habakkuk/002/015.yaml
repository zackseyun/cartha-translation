id: HAB.2.15
reference: Habakkuk 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֚וֹי מַשְׁקֵ֣ה רֵעֵ֔/הוּ מְסַפֵּ֥חַ חֲמָתְ/ךָ֖ וְ/אַ֣ף שַׁכֵּ֑ר לְמַ֥עַן הַבִּ֖יט עַל מְעוֹרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/015.yaml
  text: Woe to him who makes his neighbor drink[a], pouring out your wrath and even making him drunk[c][b], in order to look on their nakedness.
translation:
  language: de
  text: Wehe dem, der seinen Nächsten trinken lässt, indem du deinen Zorn[a] beimischst und ihn sogar betrunken machst[b], um ihre Blöße[c] anzusehen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Gift“. Das hebräische Wort für „Zorn“ kann auch Hitze oder Gift bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Wortlaut ist schwierig. Andere verstehen den Ausdruck etwa als „indem du deine Flasche hinzufügst“ oder glätten den Personenwechsel zu „seinen Zorn“.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „ihre Schamteile“. Das hebräische Wort bezeichnet entblößte Nacktheit in einem beschämenden Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe dem
  rationale: Die prophetische Weheruf-Formel leitet eine scharfe Gerichtsankündigung ein; „Wehe dem“ ist im modernen Deutschen würdig und verständlich.
- source_word: מַשְׁקֵה
  choice: der … trinken lässt
  rationale: Das Hifil-Partizip bezeichnet das Veranlassen zum Trinken. Die Formulierung bewahrt den Zwangscharakter, ohne mehr auszusagen als der hebräische Text.
- source_word: רֵעֵהוּ
  choice: seinen Nächsten
  rationale: רֵעַ kann einen Mitmenschen, Nachbarn oder Gefährten bezeichnen. „Nächsten“ passt zum ethischen Zusammenhang und lässt die genaue soziale Beziehung offen.
- source_word: מְסַפֵּחַ
  choice: beimischst
  rationale: Die schwierige Form hat die Grundvorstellung des Hinzufügens oder Anfügens. Im Bild eines berauschenden Getränks gibt „beimischst“ den Zusammenhang natürlich wieder, ohne die Unsicherheit völlig zu verdecken.
- source_word: חֲמָתְךָ
  choice: deinen Zorn
  rationale: חֵמָה bedeutet häufig Zorn oder Grimm, kann aber auch Hitze beziehungsweise Gift bezeichnen. „Zorn“ wahrt den üblichen Sinn; die kontextuell mögliche Bedeutung „Gift“ steht in der Fußnote.
- source_word: וְאַף
  choice: und … sogar
  rationale: Die Partikel steigert die Aussage. „Sogar“ bildet diese Zuspitzung idiomatisch ab.
- source_word: שַׁכֵּר
  choice: ihn … betrunken machst
  rationale: Das Verb bezeichnet das Verursachen von Trunkenheit; die direkte Formulierung erhält die feindselige Absicht.
- source_word: לְמַעַן
  choice: um … zu
  rationale: Die Zweckkonjunktion unterstreicht, dass die Bloßstellung beabsichtigt ist.
- source_word: הַבִּיט
  choice: anzusehen
  rationale: Das Verb bedeutet hinsehen oder betrachten. „Ansehen“ ist natürlich und überlässt die moralische Wertung dem Kontext.
- source_word: מְעוֹרֵיהֶם
  choice: ihre Blöße
  rationale: Das seltene Wort bezeichnet entblößte Nacktheit, möglicherweise ausdrücklich die Schamteile. „Blöße“ bewahrt den beschämenden Beiklang und bleibt würdig.
theological_decisions:
- issue: Wechsel von der dritten zur zweiten Person bei חֲמָתְךָ
  choice: Der Personenwechsel bleibt als „indem du deinen Zorn … beimischst“ erhalten.
  alternative: Den Satz grammatisch glätten, etwa mit „seinen Zorn“, oder aufgrund einer abweichenden Deutung „deinen Schlauch/deine Flasche hinzufügen“ übersetzen.
  rationale: Der masoretische Text weist den auffälligen Wechsel zur zweiten Person tatsächlich auf. Er wird nicht stillschweigend beseitigt; die textliche Schwierigkeit und alternative Deutungen werden in einer Fußnote genannt.
- issue: Bild der sexuellen Beschämung
  choice: „um ihre Blöße anzusehen“
  alternative: „um ihre Schamteile anzusehen“ oder „um ihre Schande zu sehen“
  rationale: Der Text verurteilt das absichtliche Betrunkenmachen mit dem Ziel entwürdigender Entblößung. „Blöße“ erhält diesen Sinn, ohne zusätzliche sexuelle Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der prophetische Weheruf bleibt prägnant; der auffällige Personenwechsel und die lexikalischen Unsicherheiten werden nicht harmonisiert, sondern im Haupttext beziehungsweise in den Fußnoten bewahrt.
