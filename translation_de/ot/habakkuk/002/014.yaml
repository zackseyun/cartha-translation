id: HAB.2.14
reference: Habakkuk 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֚י תִּמָּלֵ֣א הָ/אָ֔רֶץ לָ/דַ֖עַת אֶת כְּב֣וֹד יְהוָ֑ה כַּ/מַּ֖יִם יְכַסּ֥וּ עַל יָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/014.yaml
  text: For the earth will be filled with the knowledge of the glory of Yahweh[a], as the waters cover the sea.
translation:
  language: de
  text: Denn die Erde[a] wird erfüllt sein von der Erkenntnis der Herrlichkeit Jahwes, wie das Wasser das Meer bedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“, wenn das Wort hier räumlich enger verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erklärung des vorausgehenden Gerichtszusammenhangs ein und bewahrt den verbindenden Charakter der hebräischen Konjunktion.
- source_word: תִּמָּלֵא
  choice: wird erfüllt sein
  rationale: Das Nifal-Imperfekt von מלא bezeichnet hier einen zukünftigen passiven Ergebniszustand. Die Formulierung ist im Deutschen natürlich und bleibt nah am verbalen Bild.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann auch „Land“ bedeuten; der weit gespannte prophetische Horizont und der Vergleich mit dem vom Wasser bedeckten Meer sprechen hier jedoch für die universale Bedeutung „Erde“.
- source_word: לָדַעַת
  choice: von der Erkenntnis
  rationale: Der Infinitiv mit ל erhält nach „erfüllt sein“ substantivische Bedeutung. „Von der Erkenntnis“ gibt die Fügung idiomatisch wieder, ohne sie auf bloße Information zu verengen.
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist bei כבוד in Bezug auf Gott die umfassendste geläufige Wiedergabe und schließt Ehre, Gewicht und Majestät ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- source_word: כַּמַּיִם
  choice: wie das Wasser
  rationale: Das Präfix כ markiert den Vergleich. Obwohl מַיִם formal pluralisch ist, wird der Stoffname im natürlichen Deutschen kollektiv als „das Wasser“ ausgedrückt.
- source_word: יְכַסּוּ עַל־יָם
  choice: das Meer bedeckt
  rationale: Die hebräische Wendung lautet wörtlich „über dem Meer bedecken“. Das Deutsche verwendet idiomatisch das direkte Objekt; das Präsens gibt im Vergleich den allgemeinen Sachverhalt wieder.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: 'universal: „die Erde“'
  alternative: 'lokal oder regional: „das Land“'
  rationale: Der Vers entwirft eine umfassende Vision von der Erkenntnis der Herrlichkeit Jahwes. „Erde“ wahrt diesen naheliegenden universalen Horizont; die lexikalisch mögliche engere Lesart wird in der Fußnote offengehalten.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die Satzstruktur bleibt bildhaft und knapp; „Jahwe“ bewahrt den Eigennamen, und die mögliche lokale Bedeutung von אֶרֶץ wird nicht stillschweigend ausgeschlossen.
