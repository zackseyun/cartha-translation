  terminology: „Pferde“ ist modernes Standarddeutsch und erhält das konkrete Bild. Die Anrede mit „Du“ und das Präteritum passen zum Gebets- und Theophaniekontext. Die Fußnote kennzeichnet die schwierige Lexik von חֹמֶר zutreffend und bietet eine mögliche, nicht als sicher ausgegebene Alternative.
