  text: You marched through the sea with your horses[a], through the heap of mighty waters.
translation:
  language: de
  text: Du zogst mit deinen Pferden durch das Meer, durch die Masse gewaltiger Wasser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den aufgewühlten Schwall vieler Wasser“. Das hebräische Wort für „Masse“ ist an dieser Stelle schwierig und kann die aufgehäufte oder turbulente Wassermenge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַכְתָּ
  choice: du zogst
  rationale: Das Verb bezeichnet ein Treten oder Schreiten. Im Zusammenhang des poetischen Gottesauftritts gibt „zogst“ die zielgerichtete Bewegung natürlich wieder, ohne das Bild göttlichen Vorrückens abzuschwächen.
- source_word: בַיָּם
  choice: durch das Meer
  rationale: Die Präposition ב bedeutet gewöhnlich „in“, kann bei einer Bewegungsangabe aber den durchquerten Raum bezeichnen. „Durch das Meer“ entspricht hier dem Zusammenhang und ist idiomatisches Deutsch.
- source_word: סוּסֶיךָ
  choice: mit deinen Pferden
  rationale: Wörtlich steht „deine Pferde“. Die instrumentale beziehungsweise begleitende Beziehung ist im Hebräischen knapp ausgedrückt; „mit deinen Pferden“ macht sie im Deutschen verständlich, ohne das konkrete Bild zu allegorisieren.
- source_word: חֹמֶר
  choice: Masse
  rationale: Das seltene und an dieser Stelle schwierige Wort kann eine aufgehäufte oder aufgewühlte Masse bezeichnen. „Masse“ wahrt die Unbestimmtheit besser als stärker deutende Wiedergaben wie „Gischt“ oder „Schlamm“.
- source_word: מַיִם רַבִּים
  choice: gewaltiger Wasser
  rationale: Die Wendung bedeutet wörtlich „vieler Wasser“. Das poetische „gewaltiger Wasser“ vermittelt sowohl Fülle als auch Kraft und bewahrt den Plural der hebräischen Dichtung.
theological_decisions:
- issue: Bild Gottes als göttlicher Krieger im poetischen Gottesauftritt
  choice: Das konkrete Bild, dass Gott mit seinen Pferden durch das Meer zieht, bleibt erhalten.
  alternative: Die Pferde als Wolken oder Engelwesen deuten oder das Bild zu einer allgemeinen Aussage über Gottes Macht über das Meer verflachen.
  rationale: Der hebräische Text bietet eine konkrete dichterische Szene. Die Übersetzung legt ihre Bildelemente nicht allegorisch fest und löst die theologische Spannung nicht auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Färbung. „Pferde“ ist gegenüber dem altertümlicheren „Rosse“ allgemein verständlich; „gewaltiger Wasser“ bewahrt bewusst den poetischen Plural.
