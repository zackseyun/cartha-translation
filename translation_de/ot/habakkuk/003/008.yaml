base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/008.yaml
  text: Was your anger against the rivers[a], Yahweh? Was your wrath against the rivers, or your fury against the sea, that you rode on your horses, on your chariots of salvation?
translation:
  language: de
  text: Zürntest du den Flüssen, Jahwe? Galt dein Zorn den Flüssen oder dein Grimm dem Meer, dass du auf deinen Pferden reitest, auf deinen Wagen des Heils[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf deinen siegreichen Wagen“. Das hebräische יְשׁוּעָה kann hier Heil, Rettung oder Sieg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבִנְהָרִים חָרָה יְהוָה
  choice: Zürntest du den Flüssen, Jahwe?
  rationale: Die Fragepartikel הֲ und die Präposition בְּ kennzeichnen eine rhetorische Frage nach dem Ziel des göttlichen Zorns. Das Verb חרה bezeichnet bildlich ein Entbrennen im Zorn; „zürnen“ gibt dies im Deutschen knapp und poetisch wieder. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אִם בַּנְּהָרִים אַפֶּךָ
  choice: Galt dein Zorn den Flüssen
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet idiomatisch aber den Zorn. „Galt … den Flüssen“ gibt die Präposition בְּ natürlich wieder und vermeidet eine schwerfällige Wiederholung von „zürnen“.
- source_word: אִם בַּיָּם עֶבְרָתֶךָ
  choice: oder dein Grimm dem Meer
  rationale: עֶבְרָה ist ein starkes Wort für heftigen Zorn. „Grimm“ bewahrt die Steigerung und den poetischen Parallelismus; יָם bleibt wörtlich „Meer“.
- source_word: כִּי תִרְכַּב עַל סוּסֶיךָ
  choice: dass du auf deinen Pferden rittest
  rationale: כִּי wird hier als Anschluss der erklärenden beziehungsweise folgernden Frage verstanden. Das deutsche „dass“ erhält den Zusammenhang mit der rhetorischen Frage, ohne ihn zu einer selbstständigen Aussage umzudeuten. רכב wird schlicht mit „reiten“ wiedergegeben.
- source_word: מַרְכְּבֹתֶיךָ יְשׁוּעָה
  choice: auf deinen Wagen zum Heil
  rationale: Die knappe hebräische Verbindung lässt das genaue Verhältnis zwischen „Wagen“ und יְשׁוּעָה offen. „Wagen zum Heil“ bewahrt den umfassenden Sinn von Rettung und Heil, ohne ihn ausschließlich auf militärischen Sieg zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von יְשׁוּעָה in der kriegerischen Theophanie
  choice: Heil
  alternative: Rettung; Sieg
  rationale: יְשׁוּעָה kann hier rettendes Eingreifen und siegreiche Befreiung bezeichnen. „Heil“ hält den weiteren theologischen Sinn offen; die militärisch zugespitzte Möglichkeit wird in der Fußnote genannt.
- issue: Syntaktische Funktion von כִּי
  choice: dass
  alternative: denn; weil; als
  rationale: כִּי kann begründend oder erklärend anschließen. Die gewählte Fassung bindet den Ritt an die vorausgehende rhetorische Frage und bewahrt deren Spannung; eine kausale Deutung bleibt grammatisch möglich.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die rhetorische Wiederholung und der Parallelismus von Flüssen und Meer sowie von Zorn und Grimm bleiben erhalten; übermäßig altertümliche Wendungen wurden vermieden.
