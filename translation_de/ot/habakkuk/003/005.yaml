  text: Before him goes pestilence[b][a], and plague comes out at his feet.
translation:
  language: de
  text: Vor ihm her zieht die Pest, und die Seuche[a] geht zu seinen Füßen[b] hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Glutseuche“, „Fieber“ oder „Reschef“, der Name einer mit Seuchen verbundenen Gottheit, auf die das poetische Bild möglicherweise anspielt.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „zu seinen Füßen“; gemeint sein kann auch, dass die Seuche hinter ihm herzieht oder in seinem Gefolge kommt.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: vor ihm her
  rationale: Die Wendung bezeichnet die Position vor jemandem. „Vor ihm her“ gibt im Deutschen zugleich die Bewegungsrichtung und das Bild eines vorausziehenden Begleiters wieder.
- source_word: יֵלֶךְ
  choice: zieht
  rationale: הלך bezeichnet hier in lebendiger poetischer Darstellung ein Gehen. „Zieht“ passt zur Erscheinung Gottes als machtvoll voranschreitender Gestalt und klingt im Deutschen natürlicher als „geht“, ohne die Bildlichkeit auszubauen.
- source_word: דָּבֶר
  choice: Pest
  rationale: דבר bezeichnet häufig eine verheerende Seuche, besonders in Gerichtszusammenhängen. „Pest“ ist knapp, geläufig und bewahrt das personifizierte poetische Bild.
- source_word: וְיֵצֵא
  choice: und … geht … hervor
  rationale: יצא bedeutet hinausgehen oder hervorgehen. „Geht hervor“ erhält die Vorstellung, dass die zerstörerische Macht bei Gottes Voranschreiten hervortritt.
- source_word: רֶשֶׁף
  choice: Seuche
  rationale: רשף kann Glut, Fieber oder eine pestartige Plage bezeichnen und möglicherweise zugleich auf Reschef anspielen. „Seuche“ passt zum Parallelismus mit דבר, ohne die mögliche mythologische Anspielung im Haupttext festzuschreiben.
- source_word: לְרַגְלָיו
  choice: zu seinen Füßen
  rationale: Die konkrete hebräische Formulierung lautet „zu/an seinen Füßen“. Sie kann im Bild des göttlichen Zuges zugleich etwas bezeichnen, das ihm auf dem Fuß folgt oder in seinem Gefolge erscheint.
theological_decisions:
- issue: Möglicher mythologischer Hintergrund von רֶשֶׁף
  choice: Im Haupttext als Gattungsbegriff „Seuche“ wiedergegeben.
  alternative: „Reschef“ als Eigenname einer mit Seuche und Glut verbundenen Gottheit.
  rationale: Der poetische Zusammenhang kann altorientalische Bildsprache anklingen lassen, doch der Parallelismus mit דבר erlaubt und begünstigt hier eine Bezeichnung der zerstörerischen Macht. Die Übersetzung vermeidet daher, eine mögliche Anspielung als eindeutige Person zu behandeln, und hält die Alternative in der Fußnote offen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Parallelismus und die personifizierte Darstellung der beiden zerstörerischen Mächte bleiben erhalten. Die bewusst ungewohnte Wendung „zu seinen Füßen“ bewahrt das konkrete hebräische Bild; die möglichen räumlichen Deutungen werden nicht im Haupttext vereinheitlicht.
