base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/001.yaml
  text: A prayer of Habakkuk the prophet[a], according to Shigionoth.
translation:
  language: de
  text: Ein Gebet des Propheten Habakuk. Nach Schigjonot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „mit/über Schigjonot“; vermutlich eine musikalische oder liturgische Bezeichnung für eine Stilart, Melodie oder ein leidenschaftlich bewegtes Lied.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Ein Gebet
  rationale: Das Substantiv bezeichnet ein Gebet oder Gebetslied. In einer deutschen Überschrift ist „Ein Gebet“ natürlich und wahrt den Charakter der Gattungsangabe.
- source_word: לַחֲבַקּוּק
  choice: des … Habakuk
  rationale: Die Präposition ל kann in Überschriften Urheberschaft oder Zuordnung kennzeichnen. Der deutsche Genitiv gibt diese Beziehung knapp und idiomatisch wieder, ohne sie stärker festzulegen.
- source_word: הַנָּבִיא
  choice: Propheten
  rationale: Der appositionelle Titel wird in die natürliche deutsche Genitivfügung „des Propheten Habakuk“ aufgenommen und behält seine Bestimmtheit.
- source_word: עַל
  choice: Nach
  rationale: In musikalischen oder liturgischen Überschriften kann עַל eine Melodie, Stilart oder Vortragsweise anzeigen. „Nach“ klingt im Deutschen überschriftartig und lässt die genaue Beziehung offen.
- source_word: שִׁגְיֹנוֹת
  choice: Schigjonot
  rationale: Der seltene Ausdruck ist in seiner genauen Bedeutung unsicher und dürfte eine musikalische oder liturgische Angabe sein. Die Transliteration vermeidet falsche Präzision; die Unsicherheit wird in der Fußnote erläutert.
theological_decisions: []
