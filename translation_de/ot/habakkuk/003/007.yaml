  - severity: low
    issue: „Zeltdecken“ für יְרִיעוֹת
    rationale: Zeltdecken kann zwar textile Abdeckungen meinen, ist aber weniger genau und weniger geläufig als „Zeltbehänge“ für die Vorhänge bzw. Tuchbahnen eines Zelts.
