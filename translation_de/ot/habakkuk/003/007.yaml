  terminology: „Kuschan“ und „Midian“ sind korrekt beibehalten. „Not“ gibt אָוֶן hier kontextgerecht wieder, ohne eine moralische Schuldzuschreibung zu behaupten. „Zeltbehänge“ gibt יְרִיעוֹת als textile Zeltteile angemessen wieder.
