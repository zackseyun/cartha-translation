  text: I saw the tents of Cushan under affliction; the tent curtains of the land of Midian were trembling.
translation:
  language: de
  text: In Not sah ich die Zelte Kuschans; die Zeltbehänge des Landes Midian erbebten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אָוֶן
  choice: Unter Unheil
  rationale: תַּחַת bezeichnet hier eine Lage unter bzw. im Einfluss von etwas; אָוֶן kann Unheil, Not, Mühsal oder Verderben meinen. „Unter Unheil“ bewahrt die knappe, ungewöhnliche Formulierung und lässt offen, ob erlittene Not oder drohendes Verderben gemeint ist.
- source_word: רָאִיתִי
  choice: sah ich
  rationale: Direkte Wiedergabe des qal Perfekt der ersten Person Singular.
- source_word: אָהֳלֵי כוּשָׁן
  choice: die Zelte Kuschans
  rationale: Der Eigenname כּוּשָׁן wird als Kuschan transliteriert; die Genitivverbindung bleibt erhalten.
- source_word: יְרִיעוֹת אֶרֶץ מִדְיָן
  choice: die Zeltdecken des Landes Midian
  rationale: יְרִיעוֹת sind Tuchbahnen bzw. Zeltdecken. Der ausdrücklich genannte Landesbezug wird beibehalten.
- source_word: יִרְגְּזוּן
  choice: erbebten
  rationale: רגז bezeichnet heftiges Zittern, Beben oder Erschrecken. „erbebten“ passt zum poetischen Parallelismus und gibt die Vergangenheitswahrnehmung des Sprechers natürlich wieder.
theological_decisions:
- issue: Deutung von אָוֶן
  choice: Unheil
  alternative: Not / Mühsal / Frevel
  rationale: Der Kontext beschreibt die erschütternde Gotteserscheinung und ihre Wirkung auf die Völker. „Unheil“ erhält die negative Breite des Wortes, ohne Kuschan ausdrücklich Schuld oder Frevel zuzuschreiben.
- issue: Beziehung von תַּחַת אָוֶן zum Satz
  choice: Als vorangestellte Zustandsangabe zu den Zelten Kuschans wiedergegeben
  alternative: „Ich sah die Zelte Kuschans in Not“ oder eine adverbiale Beziehung zum Sehen
  rationale: Die hebräische Wortstellung ist mehrdeutig. Die deutsche Voranstellung „Unter Unheil“ bewahrt diese poetische Spannung weitgehend, statt die syntaktische Beziehung zu stark festzulegen.
translation_notes:
  register: Poetisch, knapp und würdevoll. „Zeltdecken“ ist gegenwärtig verständlich und bildet mit „Zelte“ einen natürlichen Parallelismus. Der seltene Name Kuschan bleibt unverändert; keine erklärende Identifikation mit Kusch oder einer bestimmten Volksgruppe wird in den Text eingeführt.
