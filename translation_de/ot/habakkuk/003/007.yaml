  source_fidelity: 'Die Grundstruktur wird getroffen: Der Sprecher sieht die Zelte Kuschans, und die Zeltbehänge Midians beben. „Unter Unheil“ ist jedoch keine idiomatische deutsche Entsprechung für תַּחַת אָוֶן und verdeckt die naheliegende Zustandsangabe „in Not/Bedrängnis“. „Zeltdecken“ ist möglich, aber für יְרִיעוֹת weniger präzise als „Zeltbehänge“ bzw. „Zeltvorhänge“.'
