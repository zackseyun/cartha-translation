source:
  edition: WLC
  text: יְהוָ֗ה שָׁמַ֣עְתִּי שִׁמְעֲ/ךָ֮ יָרֵאתִי֒ יְהוָ֗ה פָּֽעָלְ/ךָ֙ בְּ/קֶ֤רֶב שָׁנִים֙ חַיֵּ֔י/הוּ בְּ/קֶ֥רֶב שָׁנִ֖ים תּוֹדִ֑יעַ בְּ/רֹ֖גֶז רַחֵ֥ם תִּזְכּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/002.yaml
  text: Yahweh[a], I have heard the report of you; I stand in awe. Yahweh, revive your work in the midst of the years; in the midst of the years make it known[e][d][c][b]; in wrath remember mercy.
translation:
  language: de
  text: Jahwe, ich habe gehört, was man über dich berichtet[a], und ich fürchte mich[b]. Jahwe, lass dein Werk inmitten der Jahre[c] neu lebendig werden[d]; inmitten der Jahre mach es bekannt. Im Zorn[e] denke an Erbarmen[f]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „deinen Ruf“ oder „die Kunde von dir“. Gemeint ist das, was man über Jahwe gehört hat.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann Furcht, Angst oder ehrfürchtiges Erschauern ausdrücken.
    reason: lexical_alternative
  - marker: c
    text: '„Inmitten der Jahre“ ist eine bewusst wörtliche Wiedergabe; möglich ist auch: „noch in diesen Jahren“ oder sinngemäß „in unserer Zeit“.'
    reason: translation_clarity
  - marker: d
    text: 'Wörtlich: „lass es leben“; auch: „erhalte es am Leben“ oder „erneuere es“.'
    reason: lexical_alternative
  - marker: e
    text: 'Auch: „im Aufruhr“, „in der Erregung“ oder „im Toben“.'
    reason: lexical_alternative
  - marker: f
    text: 'Hebräisch kann auch bedeuten: „denke daran, dich zu erbarmen“ oder „habe Erbarmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der Eigenname im hebräischen Text sichtbar bleibt.
- source_word: שָׁמַעְתִּי שִׁמְעֲךָ
  choice: ich habe gehört, was von dir berichtet wird
  rationale: Die Formulierung gibt sowohl das Hören als auch den Bericht über Jahwe natürlich wieder, ohne den Ausdruck auf bloßen Ruhm einzuengen.
- source_word: יָרֵאתִי
  choice: ich fürchte mich
  rationale: Das Verb bezeichnet Furcht und kann zugleich ehrfürchtiges Erschauern einschließen. Die direkte Wiedergabe bewahrt diese Spannung.
- source_word: פָּעָלְךָ
  choice: dein Werk
  rationale: „Werk“ lässt offen, welche geschichtlichen Taten Gottes konkret gemeint sind.
- source_word: בְּקֶרֶב שָׁנִים
  choice: inmitten der Jahre
  rationale: Die auffällige hebräische Wendung wird in ihrer poetischen Unbestimmtheit bewahrt und nicht vorschnell als „in unserer Zeit“ gedeutet.
- source_word: חַיֵּהוּ
  choice: lass ... neu lebendig werden
  rationale: Die Piel-Form bedeutet wörtlich, etwas leben zu lassen bzw. lebendig zu machen. „Neu lebendig werden“ drückt hier die Bitte um Belebung oder Erneuerung aus.
- source_word: תּוֹדִיעַ
  choice: mach es bekannt
  rationale: Die Hifil-Form von ידע bedeutet direkt „bekannt machen“; das Pronomen bezieht sich im Zusammenhang auf Gottes Werk.
- source_word: בְּרֹגֶז
  choice: im Zorn
  rationale: Im Zusammenhang mit der Bitte um Erbarmen ist göttlicher Zorn wahrscheinlich, doch das Wort kann auch Erregung oder Aufruhr bezeichnen.
- source_word: רַחֵם תִּזְכּוֹר
  choice: denke an Erbarmen
  rationale: Die knappe Gebetsform wahrt sowohl das Erinnerungsmotiv als auch den verbalen Gedanken des Erbarmens.
theological_decisions:
- issue: Art der Reaktion des Propheten
  choice: „ich fürchte mich“ mit Hinweis auf ehrfürchtiges Erschauern
  alternative: „ich bin von Ehrfurcht erfüllt“
  rationale: Die direkte Formulierung erhält die Möglichkeit wirklicher Furcht und reduziert die Reaktion nicht auf bewundernde Ehrfurcht.
- issue: Bitte um die Belebung von Gottes Werk
  choice: Bitte, Gottes Werk neu lebendig werden zu lassen
  alternative: Bitte, Gottes Werk am Leben zu erhalten
  rationale: Die Form kann Erneuerung oder Bewahrung des Lebens ausdrücken. Der Haupttext folgt der im Kontext naheliegenden Erneuerung, während die Alternative vermerkt wird.
- issue: Bedeutung von רֹגֶז
  choice: göttlicher Zorn
  alternative: Aufruhr, Erregung oder Toben
  rationale: Die Gegenüberstellung mit Erbarmen legt Zorn nahe, doch die lexikalische Mehrdeutigkeit wird nicht verschwiegen.
translation_notes:
  register: Moderne, würdige Gebetssprache mit poetischer Wiederholung. Die ungewöhnliche Zeitangabe bleibt im Haupttext erhalten; Fußnoten erläutern echte lexikalische und syntaktische Alternativen.
