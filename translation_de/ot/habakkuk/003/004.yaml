  text: וְ/נֹ֨גַהּ֙ כָּ/א֣וֹר תִּֽהְיֶ֔ה קַרְנַ֥יִם מִ/יָּד֖/וֹ ל֑/וֹ וְ/שָׁ֖ם חֶבְי֥וֹן עֻזֹּֽ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/004.yaml
  text: His brightness was like the light; rays were from his hand[a], and there his power was hidden.
translation:
  language: de
  text: Sein Glanz war wie das Licht; Strahlen gingen von seiner Hand aus[a], und dort lag seine Macht verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hörner von seiner Hand.“ „Hörner“ wird hier bildlich als Strahlen oder Lichtbündel verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  choice: Glanz
  rationale: Das Wort bezeichnet Helligkeit oder strahlenden Glanz. „Glanz“ ist im Deutschen poetisch, klar und passt zum Vergleich mit dem Licht.
- source_word: כָּאוֹר
  choice: wie das Licht
  rationale: Die Präposition כְּ kennzeichnet den Vergleich; אוֹר bedeutet „Licht“. Die Formulierung bewahrt das Bild ohne es auf Sonnenlicht einzuengen.
- source_word: תִּהְיֶה
  choice: war
  rationale: Die Imperfektform wird innerhalb der geschauten Gotteserscheinung als poetische Beschreibung wiedergegeben. Das Präteritum fügt sich in den berichtenden Zusammenhang, obwohl formal auch eine präsentische oder zukünftige Nuance möglich ist.
- source_word: קַרְנַיִם
  choice: Strahlen
  rationale: Wörtlich bezeichnet die Dualform „Hörner“. Im Zusammenhang des leuchtenden Glanzes sind vorspringende Lichtstrahlen gemeint; die konkrete Grundbedeutung wird in der Fußnote bewahrt.
- source_word: מִיָּדוֹ
  choice: von seiner Hand aus
  rationale: יָד bedeutet gewöhnlich „Hand“, und מִן bezeichnet hier den Ausgangspunkt. Die anthropomorphe Bildsprache bleibt erhalten.
- source_word: לוֹ
  choice: in der deutschen Satzfügung nicht gesondert wiedergegeben
  rationale: Das pronominale Element ist syntaktisch schwierig und verweist auf die göttliche Gestalt. Eine zusätzliche Wiedergabe als „ihm“ oder „für ihn“ wäre im Deutschen unklar; der Bezug wird bereits durch „seiner Hand“ ausgedrückt.
- source_word: וְשָׁם
  choice: und dort
  rationale: Konjunktion und Ortsadverb werden bewahrt; „dort“ verbindet die sichtbaren Strahlen mit der zugleich verborgenen Macht.
- source_word: חֶבְיוֹן
  choice: lag … verborgen
  rationale: Das Substantiv bezeichnet Verbergung oder ein Versteck. Die idiomatische verbale Wendung gibt den Sinn wieder, ohne den Ort der Verborgenheit näher zu bestimmen.
- source_word: עֻזּוֹ
  choice: seine Macht
  rationale: עֹז bezeichnet Stärke, Kraft oder Macht. „Macht“ passt zur Gotteserscheinung und erhält die Spannung zwischen sichtbarem Glanz und verborgener Gewalt.
theological_decisions:
- issue: Anthropomorphe Bildsprache der Gotteserscheinung
  choice: „seine Hand“ bleibt als Ursprung der Strahlen stehen.
  alternative: Abstrakter „von seiner Seite“ oder „von ihm aus“.
  rationale: Der hebräische Text verwendet bewusst körperliche Bildsprache. Sie wird weder entmythologisiert noch als wörtliche Aussage über Gottes Gestalt erklärt.
- issue: Sichtbarkeit und Verborgenheit göttlicher Macht
  choice: Die Macht bleibt gerade dort verborgen, wo die Strahlen hervorgehen.
  alternative: Die Strahlen ausdrücklich als Offenbarung oder Ausübung seiner Macht deuten.
  rationale: Der Text hält sichtbaren Glanz und verborgene Macht spannungsvoll zusammen; die Übersetzung löst diese theologische Spannung nicht auf.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Semikolonrhythmus erhält die Parallelität; „gingen … aus“ und „lag … verborgen“ geben die knappen hebräischen Nominalsätze natürlich wieder.
