id: HAB.3.18
reference: Habakkuk 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֖י בַּ/יהוָ֣ה אֶעְל֑וֹזָה אָגִ֖ילָה בֵּ/אלֹהֵ֥י יִשְׁעִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/018.yaml
  text: Yet I will rejoice in Yahweh[b][a]; I will exult in the God of my salvation.
translation:
  language: de
  text: Doch ich will über Yahweh jubeln[a], will mich freuen über den Gott meiner Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „frohlocken“. Die beiden hebräischen Verben dieses Verses sind bedeutungsnah und steigern gemeinsam den Ausdruck der Freude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Doch ich
  rationale: Die Konjunktion mit dem ausdrücklich gesetzten Personalpronomen hebt den persönlichen Entschluss des Sprechers als Kontrast zur Verwüstung in Vers 17 hervor.
- source_word: בַּיהוָה
  choice: über Yahweh
  rationale: Das deutsche Verb „jubeln“ verbindet sich natürlich mit „über“; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: אֶעְלוֹזָה
  choice: will jubeln
  rationale: Das Verb bezeichnet ausgelassene, triumphierende Freude. „Jubeln“ bewahrt die kräftige poetische Aussage.
- source_word: אָגִילָה
  choice: will mich freuen
  rationale: גיל bezeichnet freudiges Frohlocken. Die Wiedergabe variiert den Ausdruck natürlich, ohne die Nähe der beiden hebräischen Verben zu verdecken.
- source_word: בֵּאלֹהֵי
  choice: über den Gott
  rationale: Die wiederholte Präposition ב wird entsprechend der natürlichen deutschen Rektion erneut mit „über“ ausgedrückt; die Status-constructus-Verbindung bleibt erhalten.
- source_word: יִשְׁעִי
  choice: meiner Rettung
  rationale: ישע kann „Rettung“, „Hilfe“ oder „Heil“ bedeuten. „Rettung“ ist konkret und verständlich und lässt offen, ob Gottes rettendes Handeln oder die von ihm gewährte Rettung im Vordergrund steht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der ausdrücklich gebrauchte Gottesname wird transliteriert, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutung von יִשְׁעִי
  choice: meiner Rettung
  alternative: meines Heils; meiner Hilfe
  rationale: „Rettung“ bewahrt den Grundsinn des hebräischen Nomens und legt nicht enger fest, welche Form der Befreiung gemeint ist.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch. Der starke Gegensatz zum vorangehenden Vers wird mit „Doch ich“ markiert; die beiden parallelen Freudenäußerungen bleiben als eigenständige Verben erhalten.
