source:
  edition: WLC
  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
translation:
  language: de
  text: Auch wenn der Feigenbaum nicht blüht[a] und die Weinstöcke keinen Ertrag bringen, wenn die Olivenernte ausbleibt[b] und die Felder keine Nahrung hervorbringen, wenn die Herde von der Hürde abgeschnitten ist und kein Rindvieh in den Ställen ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn der Feigenbaum blüht nicht …“ Das hebräische Einleitungswort kann sowohl kausal („denn“) als auch konzessiv („auch wenn“) verstanden werden. Die konzessive Lesart passt zum Jubel trotz aller Not im folgenden Vers.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „das Erzeugnis des Ölbaums täuscht“ beziehungsweise „erweist sich als falsch“; gemeint ist, dass die erwartete Olivenernte ausbleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Auch wenn
  rationale: Die Partikel kann kausal oder konzessiv verstanden werden. Im Übergang zum dennoch ausgedrückten Jubel in Vers 18 gibt „auch wenn“ die konzessive Aussage natürlich wieder, ohne die kausale Möglichkeit zu verschweigen.
- source_word: תְאֵנָה לֹא תִפְרָח
  choice: der Feigenbaum nicht blüht
  rationale: תְאֵנָה bezeichnet den Feigenbaum, und פרח sein Blühen beziehungsweise Ausschlagen. Die Wiedergabe bewahrt das konkrete landwirtschaftliche Bild.
- source_word: אֵין יְבוּל בַּגְּפָנִים
  choice: die Weinstöcke keinen Ertrag bringen
  rationale: יְבוּל ist der landwirtschaftliche Ertrag; גְּפָנִים sind hier Weinstöcke. Die verbale Formulierung klingt im Deutschen natürlich.
- source_word: כִּחֵשׁ מַעֲשֵׂה זַיִת
  choice: die Olivenernte ausbleibt
  rationale: Wörtlich „das Erzeugnis des Ölbaums täuscht/erweist sich als falsch“. Gemeint ist, dass der erwartete Ertrag versagt; „die Olivenernte ausbleibt“ vermittelt diese idiomatische Bedeutung klar.
- source_word: שְׁדֵמוֹת לֹא עָשָׂה אֹכֶל
  choice: die Felder keine Nahrung hervorbringen
  rationale: Die kultivierten Felder „machen“ wörtlich keine Nahrung. „hervorbringen“ ist im Deutschen für landwirtschaftliche Erzeugung idiomatisch.
- source_word: גָּזַר מִמִּכְלָה צֹאן
  choice: die Herde aus der Hürde verschwunden ist
  rationale: גָּזַר bedeutet „abschneiden, beseitigen“. Die Formulierung beschreibt den vollständigen Verlust der Herde in natürlichem Deutsch; „Herde“ lässt offen, dass צֹאן Schafe und Ziegen umfassen kann.
- source_word: אֵין בָּקָר בָּרְפָתִים
  choice: kein Rind mehr in den Ställen steht
  rationale: בָּקָר bezeichnet kollektiv Rinder, רְפָתִים Viehställe. Das ergänzte „mehr“ verdeutlicht den resultierenden Zustand, ohne den Sinn zu verändern.
theological_decisions:
- issue: Verhältnis der Notlage in Vers 17 zum Jubel in Vers 18
  choice: Konzessive Einleitung mit „Auch wenn“
  alternative: Kausale Einleitung mit „Denn“
  rationale: Der hebräische Text lässt beide Funktionen von כִּי zu. Die konzessive Lesart bildet im Deutschen den naheliegenden Gegensatz zum folgenden „so will ich dennoch jubeln“ ab; die kausale Möglichkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Rhythmus. Die wiederholten „wenn“-Sätze bilden die Reihe umfassender landwirtschaftlicher Verluste ab; die Schlussform bleibt wegen des syntaktischen Anschlusses an Vers 18 offen.
