source:
  edition: WLC
  text: שָׁמַ֣עְתִּי וַ/תִּרְגַּ֣ז בִּטְנִ֗/י לְ/קוֹל֙ צָלֲל֣וּ שְׂפָתַ֔/י יָב֥וֹא רָקָ֛ב בַּ/עֲצָמַ֖/י וְ/תַחְתַּ֣/י אֶרְגָּ֑ז אֲשֶׁ֤ר אָנ֨וּחַ֙ לְ/י֣וֹם צָרָ֔ה לַ/עֲל֖וֹת לְ/עַ֥ם יְגוּדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/016.yaml
  text: I heard[a], and my inward parts trembled; at the sound my lips quivered. Rot enters into my bones, and beneath me I tremble, as I wait quietly for the day of distress[b], for the coming up of the people who will invade us.
translation:
  language: de
  text: Ich hörte es, und mein Inneres bebte; bei dem Klang zitterten meine Lippen. Fäulnis dringt in meine Knochen, und wo ich stehe, bebe ich. Doch ich warte still[a] auf den Tag der Not, wenn das Volk heraufzieht, das uns überfällt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit ich am Tag der Not Ruhe finde“. Das hebräische Verb kann „ruhen“, „still sein“ oder „still warten“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Die knappe hebräische Satzfügung kann auch bedeuten: „bis der Tag der Not über das Volk kommt, das uns überfällt“. Das Verb für „überfallen“ kann auch „angreifen“ oder „plündern“ heißen.'
    reason: syntactic_and_lexical_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ich hörte es
  rationale: Das Perfekt von שמע bezeichnet hier das Hören, das die körperliche Reaktion des Propheten auslöst. Das ergänzte „es“ ist im Deutschen idiomatisch und verweist offen auf das zuvor Vernommene.
- source_word: וַתִּרְגַּז בִּטְנִי
  choice: und mein Inneres bebte
  rationale: בטן bedeutet wörtlich „Bauch“, kann poetisch aber das leiblich empfundene Innere bezeichnen. „Mein Inneres“ bewahrt den körperlich-viszeralen Charakter, ohne unnatürlich anatomisch zu klingen.
- source_word: לְקוֹל
  choice: bei dem Klang
  rationale: קול kann „Stimme“, „Laut“ oder „Klang“ bedeuten. „Klang“ hält offen, ob eine Stimme oder das vernommene Geschehen gemeint ist.
- source_word: צָלֲלוּ שְׂפָתַי
  choice: zitterten meine Lippen
  rationale: Das seltene Verb צלל beschreibt hier eine körperliche Erschütterung. „Zittern“ ist im Deutschen anschaulich und verständlich.
- source_word: יָבוֹא רָקָב בַּעֲצָמַי
  choice: Fäulnis dringt in meine Knochen
  rationale: רקב bezeichnet Fäulnis oder Verfall. Die Gegenwartsform vergegenwärtigt das poetisch geschilderte Zusammenbrechen der Kräfte; „dringt“ gibt die Bewegung in die Knochen wieder.
- source_word: וְתַחְתַּי אֶרְגָּז
  choice: und wo ich stehe, bebe ich
  rationale: תַּחְתַּי bedeutet wörtlich „unter mir/an meinem Platz“. Die Wiedergabe wahrt das Bild eines erschütterten Standes, ohne ausdrücklich „Beine“ oder „Boden“ einzutragen.
- source_word: אֲשֶׁר אָנֻוּחַ
  choice: Doch ich warte still
  rationale: נוח kann „ruhen“, „sich niederlassen“ oder „still sein“ bedeuten. Im Zusammenhang körperlicher Angst und erwarteter Not bezeichnet „still warten“ am ehesten die gespannte, vertrauende Ruhe; „doch“ verdeutlicht den poetischen Gegensatz, ohne die Furcht aufzulösen.
- source_word: לְיוֹם צָרָה
  choice: auf den Tag der Not
  rationale: צרה bezeichnet Bedrängnis, Not oder Drangsal. „Not“ ist knapp, würdig und lässt die Art des kommenden Unheils offen.
- source_word: לַעֲלוֹת
  choice: wenn ... heraufzieht
  rationale: עלה bedeutet grundsätzlich „hinaufgehen/heraufziehen“ und wird auch für den Vormarsch eines Heeres gebraucht. „Heraufziehen“ bewahrt zugleich Bewegungsbild und militärischen Beiklang.
- source_word: לְעַם יְגוּדֶנּוּ
  choice: das Volk ..., das uns überfällt
  rationale: גדד bezeichnet das Bilden einer Schar sowie das Plündern oder Überfallen. „Überfällt“ gibt die feindliche Handlung natürlich wieder; das Suffix wird als erste Person Plural verstanden.
theological_decisions:
- issue: Bedeutung von אֲשֶׁר אָנֻוּחַ im Zusammenhang
  choice: Der Prophet wartet trotz seines körperlichen Entsetzens still auf den Tag der Not.
  alternative: Der Prophet wird am Tag der Not Ruhe finden.
  rationale: נוח lässt sowohl Ruhe als auch stilles Verharren zu. Der Kontext verbindet Erschrecken mit erwartungsvoller Standhaftigkeit; die Hauptfassung bewahrt diese Spannung, während die Fußnote die andere mögliche Nuance nennt.
- issue: Syntaktischer Bezug von לַעֲלוֹת לְעַם יְגוּדֶנּוּ
  choice: Das feindliche Volk zieht herauf und überfällt „uns“.
  alternative: Der Tag der Not kommt über das Volk, das uns überfällt.
  rationale: Die knappe hebräische Infinitivkonstruktion erlaubt unterschiedliche Zuordnungen von „heraufziehen/kommen“ und „Volk“. Die Hauptfassung folgt der unmittelbar möglichen militärischen Lesart; die Fußnote hält die alternative, theologisch bedeutsame Gerichtsperspektive offen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Körperbildlichkeit. Unnatürliche Hebraismen werden behutsam geglättet; die Mehrdeutigkeit des stillen Wartens beziehungsweise Ruhens und der Schlussklausel wird nicht dogmatisch aufgelöst.
