review_pass:
  verdict: revise
  source_fidelity: 'Die Hauptfassung gibt die körperliche Erschütterung und die Fäulnis-Metapher im Wesentlichen treffend wieder. Die Schlusszeile ist jedoch nicht quellentreu genug: לְעַם bezeichnet hier am ehesten das Ziel des Heranziehens („gegen das Volk“), während das Objekt von יְגוּדֶנּוּ wahrscheinlich singularisch ist („es/ihn“), nicht „uns“.'
  naturalness: Die Sprache ist modern, würdig und gut lesbar. „Doch“ legt allerdings einen ausdrücklichen Gegensatz nahe, der im Hebräischen nicht markiert ist. „bei dem Klang“ ist möglich, aber „als ich den Klang hörte“ verbindet den Bezug natürlicher.
  terminology: „Inneres“, „Fäulnis“, „Knochen“ und „Tag der Not“ sind angemessen. Die militärische Ausdrucksweise sollte den Angreifer nicht mit dem angegriffenen Volk verschmelzen; „gegen das Volk heranzieht, um es zu überfallen“ gibt die Konstruktion verständlich und ohne konfessionelle Festlegung wieder.
  issues:
  - severity: high
    issue: Die Schlussklausel macht das heranziehende Volk zugleich zum Subjekt von „überfällt“ und setzt dessen Objekt als „uns“ an.
    rationale: לַעֲלוֹת לְעַם weist grammatisch auf ein Heranziehen gegen ein Volk. Das Suffix in יְגוּדֶנּוּ ist in der überlieferten Form am naheliegendsten ein singularisches Objekt. Die Fassung „das Volk ..., das uns überfällt“ verändert daher die Rollenverteilung und die Referenz.
  - severity: medium
    issue: „Doch“ ist als adversative Ergänzung nicht im Ausgangstext markiert.
    rationale: Die Wendung אֲשֶׁר אָנֻחַ leitet den Zweck bzw. die Folge des Erzitterns und ruhigen Wartens ein; ein expliziter Gegensatz sollte nicht ergänzt werden.
  - severity: low
    issue: Die Fußnote b formuliert eine alternative Satzdeutung, während die Hauptfassung bereits die wahrscheinlichere Objektbeziehung verfehlt.
    rationale: Die Fußnote sollte die syntaktische Unsicherheit knapp benennen, ohne die Hauptaussage auf „uns“ festzulegen.
  revised_text: Ich hörte, und mein Inneres bebte; als ich den Klang hörte, zitterten meine Lippen. Fäulnis dringt in meine Knochen, und wo ich stehe, bebe ich. Ich warte still[a] auf den Tag der Not, wenn ein Angreifer gegen das Volk heranzieht, um es zu überfallen.[b]
  revised_footnotes:
  - marker: a
    text: 'Oder: „damit ich am Tag der Not Ruhe finde“. Das hebräische Verb kann „ruhen“, „still sein“ oder, im Zusammenhang, „still warten“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „beim Heranziehen gegen ein Volk, das er/es überfällt“. Die knappe hebräische Satzfügung und der Bezug des Suffixes sind umstritten. Das Verb kann auch „angreifen“ oder „plündern“ bedeuten.'
    reason: syntactic_and_lexical_ambiguity
  revision_rationale: Die Revision beseitigt die nicht gedeckte Gleichsetzung des angegriffenen Volkes mit den Angreifern sowie das nicht ausdrücklich vorhandene „uns“. Sie lässt die schwierige Syntax der letzten Zeile durch eine verständliche Hauptfassung und eine präzise Fußnote erkennbar offen. Ferner wird das hinzugefügte adversative „Doch“ entfernt.
