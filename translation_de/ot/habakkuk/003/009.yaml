source:
  edition: WLC
  text: עֶרְיָ֤ה תֵעוֹר֙ קַשְׁתֶּ֔/ךָ שְׁבֻע֥וֹת מַטּ֖וֹת אֹ֣מֶר סֶ֑לָה נְהָר֖וֹת תְּבַקַּע אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/009.yaml
  text: Your bow is laid bare[a]; the rods are sworn by command. Selah[b]. You split the earth with rivers.
translation:
  language: de
  text: Du entblößt deinen Bogen völlig; geschworen sind die Stäbe durch einen Ausspruch.[a] Sela. Mit Strömen spaltest du die Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wortgruppe ist sehr schwer verständlich. Statt „Geschworen sind die Stäbe durch einen Ausspruch“ kann man etwa auch lesen: „Schwüre für die Stämme sind ausgesprochen.“ Das Wort für „Stäbe“ kann auch „Stämme“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְיָה תֵעוֹר
  choice: Entblößt, ja entblößt ist
  rationale: Die emphatische Verbindung aus absolutem Infinitiv und finitem Verb wird durch die Wiederholung wiedergegeben. Im Zusammenhang bezeichnet עור wahrscheinlich das Entblößen beziehungsweise Freilegen des Bogens, nicht sein Aufwecken.
- source_word: קַשְׁתֶּךָ
  choice: dein Bogen
  rationale: Bewahrt die direkte Anrede Gottes und das kriegerische Bild.
- source_word: שְׁבֻעוֹת
  choice: Schwüre
  rationale: Die gewöhnliche Bedeutung des Plurals wird beibehalten; eine Ableitung im Sinn von „siebenfach“ ist hier weniger wahrscheinlich.
- source_word: מַטּוֹת
  choice: die Stäbe
  rationale: Das Wort kann „Stäbe“ oder „Stämme“ bedeuten. „Stäbe“ passt zum kriegerischen Bild, doch die Alternative bleibt wegen der schwierigen Syntax in der Fußnote erhalten.
- source_word: אֹמֶר
  choice: nach deinem Wort
  rationale: אֹמֶר bedeutet „Wort, Ausspruch“. Das im Deutschen ergänzte Possessivpronomen bezieht die schwer verständliche Zeile auf die unmittelbar angeredete göttliche Person, ohne „Wort“ vorschnell zu „Befehl“ umzudeuten.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung ist unsicher; daher wird der überlieferte Ausdruck transliteriert.
- source_word: נְהָרוֹת
  choice: mit Strömen
  rationale: Gibt den Plural wieder und versteht ihn instrumental zu „spalten“.
- source_word: תְּבַקַּע
  choice: spaltest du
  rationale: Das Piel bezeichnet ein kräftiges Spalten oder Aufbrechen; die zweite Person Singular bewahrt die direkte Anrede.
- source_word: אָרֶץ
  choice: die Erde
  rationale: Im kosmischen Rahmen der Gotteserscheinung ist „Erde“ angemessener als das ebenfalls mögliche „Land“.
theological_decisions:
- issue: Deutung von שְׁבֻעוֹת מַטּוֹת אֹמֶר
  choice: Schwüre sind die Stäbe nach deinem Wort
  alternative: Schwüre für die Stämme sind ausgesprochen
  rationale: Die hebräische Zeile ist stark verdichtet und in Syntax wie Bildsprache umstritten. Der Haupttext erhält die Grundbegriffe „Schwüre“, „Stäbe“ und „Wort“, ohne eine bestimmte heilsgeschichtliche oder waffentechnische Deutung festzuschreiben; bedeutende Alternativen werden ausdrücklich vermerkt.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die emphatische hebräische Konstruktion wird hörbar gemacht; die ungewöhnliche Bildfolge bleibt bewusst erhalten, und die genuine Unsicherheit der mittleren Zeile wird nicht geglättet.
