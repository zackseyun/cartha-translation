base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/019.yaml
  text: 'The LORD, my Lord, is my strength; he makes my feet like the deer’s, and he causes me to tread on my heights.


    For the choir director: with my stringed instruments.'
translation:
  language: de
  text: 'Der HERR, mein Herr, ist meine Kraft. Er macht meine Füße denen der Hirschkühe gleich und lässt mich auf meinen Höhen schreiten.


    Für den musikalischen Leiter. Mit meinen Saiteninstrumenten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֲדֹנָי
  choice: Der HERR, mein Herr
  rationale: Gibt den Gottesnamen gemäß deutscher Bibeltradition als „HERR“ wieder und bewahrt zugleich das unmittelbar folgende אֲדֹנָי als „mein Herr“, ohne die Doppelung einzuebnen.
- source_word: חֵילִי
  choice: meine Kraft
  rationale: חַיִל bezeichnet hier Kraft bzw. Stärke; „meine Kraft“ ist natürlich und kontextgerecht.
- source_word: כָּאַיָּלוֹת
  choice: denen der Hirschkühe gleich
  rationale: Die feminine Pluralform אַיָּלוֹת bezeichnet Hirschkühe; die Ergänzung „denen“ macht den Vergleich der Füße im Deutschen eindeutig.
- source_word: בָּמוֹתַי
  choice: meinen Höhen
  rationale: Bewahrt das Possessivsuffix und die bildhafte, möglicherweise mehrdeutige Rede von erhöhtem bzw. schwierigem Gelände.
- source_word: יַדְרִכֵנִי
  choice: lässt mich … schreiten
  rationale: Das Hifil von דרך bedeutet hier, jemanden treten bzw. schreiten zu lassen; die Wiedergabe bewahrt Gottes Ermöglichung.
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die kultisch-musikalische Funktionsbezeichnung ist nicht völlig sicher; diese übliche Wiedergabe passt zum anschließenden Hinweis auf Saiteninstrumente.
- source_word: בִּנְגִינוֹתָי
  choice: Mit meinen Saiteninstrumenten
  rationale: Bewahrt die erste Person Singular des hebräischen Suffixes und gibt נְגִינוֹת im musikalischen Kontext konkret wieder.
theological_decisions:
- issue: Verhältnis von Gottesname und Herrentitel
  choice: Der HERR, mein Herr
  alternative: Der HERR, der Herr
  rationale: Die gewählte Form bewahrt sowohl den Gottesnamen als auch das Suffix der persönlichen Zugehörigkeit in אֲדֹנָי.
- issue: Bedeutung von „meinen Höhen“
  choice: Bildhafte Formulierung unverändert bewahren
  alternative: über die Höhen / über Feindeshöhen gehen
  rationale: Der hebräische Text spezifiziert weder eindeutig Gelände noch Sieg über Feinde; eine Ausdeutung würde die genuine Offenheit verengen.
- issue: Stellung der musikalischen Notiz
  choice: Als eigenen Schlussabsatz des Verses
  alternative: Als Überschrift des folgenden Stücks behandeln
  rationale: Im masoretischen Text steht die Notiz am Ende des Gebets; ihre Position wird daher beibehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus bleibt erkennbar; unnötige Archaismen werden vermieden. „Hirschkühe“ wahrt das grammatische Geschlecht und die Präzision des Hebräischen.
