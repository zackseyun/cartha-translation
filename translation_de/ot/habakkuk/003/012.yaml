  text: בְּ/זַ֖עַם תִּצְעַד אָ֑רֶץ בְּ/אַ֖ף תָּד֥וּשׁ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/012.yaml
  text: In wrath you marched through the earth[b][a]; in anger you threshed the nations.
translation:
  language: de
  text: Im Grimm durchschreitest du die Erde[a]; im Zorn drischst du die Nationen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“; das hebräische Wort אֶרֶץ kann sowohl die Erde im Allgemeinen als auch ein bestimmtes Land bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zertrittst du die Nationen“; das hebräische Verb bezeichnet das Dreschen, das häufig durch Zertreten geschah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזַעַם
  choice: Im Grimm
  rationale: Die Verbindung aus בְּ und זַעַם bezeichnet hier die Art und Weise des göttlichen Handelns. „Im Grimm“ gibt die heftige Entrüstung knapp wieder und bildet eine natürliche poetische Parallele zu „im Zorn“.
- source_word: תִּצְעַד
  choice: durchschreitest du
  rationale: צעד bezeichnet ein Schreiten oder kraftvolles Voranschreiten. „Durchschreitest“ vermittelt in der theophanischen Dichtung eine zielgerichtete Bewegung über einen Bereich hinweg, ohne die militärische Nuance von „marschieren“ überzubetonen.
- source_word: אָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann sowohl die ganze Erde als auch ein bestimmtes Land bezeichnen. Der weite, theophanische Zusammenhang und die parallele Erwähnung der Nationen sprechen hier eher für „die Erde“; die engere Bedeutung bleibt in einer Fußnote erhalten.
- source_word: בְּאַף
  choice: im Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet idiomatisch aber Zorn. „Im Zorn“ ist die natürliche deutsche Wiedergabe und bewahrt den Parallelismus des Verses.
- source_word: תָּדוּשׁ
  choice: drischst du
  rationale: דושׁ bezeichnet das Dreschen, häufig durch Zertreten. „Drischst“ bewahrt das kräftige landwirtschaftliche Bild des Hebräischen; die kontextuell mögliche Wiedergabe „zertrittst“ wird als Alternative vermerkt.
- source_word: גּוֹיִם
  choice: die Nationen
  rationale: גּוֹיִם bezeichnet Nationen beziehungsweise Völker. „Die Nationen“ entspricht dem gerichtlichen Kontext und vermeidet die Eintragung einer späteren heilsgeschichtlichen Unterscheidung, die mit „Heiden“ verbunden sein könnte.
theological_decisions:
- issue: Reichweite von אָרֶץ im Zusammenhang des theophanischen Gerichts
  choice: die Erde
  alternative: das Land
  rationale: Die kosmisch wirkende Darstellung von Gottes machtvollem Schreiten und die Erwähnung der Nationen legen den weiteren Bezug nahe. Da das hebräische Wort ebenso ein bestimmtes Land meinen kann, wird diese echte Mehrdeutigkeit nicht ausgeschlossen, sondern in der Fußnote ausgewiesen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der parallele Satzbau und die kraftvollen Verben bewahren den Charakter der theophanischen Dichtung; seltenere Bildsprache wie „drischst“ bleibt wegen ihrer Anschaulichkeit erhalten und wird durch eine Fußnote erschlossen.
