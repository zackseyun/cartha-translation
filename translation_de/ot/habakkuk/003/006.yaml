  source_fidelity: 'Der Text gibt die Abfolge und die Bildsprache des Hebräischen zuverlässig wieder: Gottes Stehen, Messen der Erde, sein Blick auf die Völker, deren Erschütterung sowie das Zerbrechen und Niedersinken der uralten Landschaft. „ließ die Völker erbeben“ ist für das lexikalisch umstrittene וַיַּתֵּר eine vertretbare, nicht überdeutende Wiedergabe. „Seine Wege sind ewig“ bleibt für הֲלִיכוֹת עוֹלָם לוֹ angemessen offen.'
