id: HAB.3.6
reference: Habakkuk 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עָמַ֣ד וַ/יְמֹ֣דֶד אֶ֗רֶץ רָאָה֙ וַ/יַּתֵּ֣ר גּוֹיִ֔ם וַ/יִּתְפֹּֽצְצוּ֙ הַרְרֵי עַ֔ד שַׁח֖וּ גִּבְע֣וֹת עוֹלָ֑ם הֲלִיכ֥וֹת עוֹלָ֖ם לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/006.yaml
  text: He stood and measured the earth[a]; he looked and made nations tremble. The ancient mountains were shattered; the everlasting hills sank low[b]. His ways are everlasting.
translation:
  language: de
  text: Er stand da und maß die Erde; er sah hin und ließ die Völker erbeben.[a] Die uralten Berge zersprangen, die ewigen Hügel sanken nieder. Seine Wege sind ewig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und schreckte die Völker auf“; möglicherweise auch: „und zerstreute die Völker“. Das hebräische Verb ist schwierig, und seine genaue Bedeutung ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seine Gänge sind ewig“ beziehungsweise: „Seine Pfade sind von alters her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמַד
  choice: Er stand da
  rationale: Gibt die Grundbedeutung „stehen“ natürlich und mit der feierlichen Präsenz der Theophanie wieder, ohne zusätzliche Deutung einzutragen.
- source_word: וַיְמֹדֶד אֶרֶץ
  choice: und maß die Erde
  rationale: Folgt der naheliegenden Bedeutung von מדד „messen“. Kontextuell mögliche Deutungen wie „erschüttern“ werden nicht in den Haupttext eingetragen.
- source_word: רָאָה
  choice: er sah hin
  rationale: Bewahrt den knappen, anschaulichen Ablauf göttlicher Handlungen; „hinsah“ wäre ebenfalls möglich, doch die getrennte Form klingt hier würdiger.
- source_word: וַיַּתֵּר גּוֹיִם
  choice: und ließ die Völker erbeben
  rationale: Das schwierige Verb bezeichnet hier wahrscheinlich eine heftige Erregung oder Bestürzung der Völker. Die Übersetzung passt zur Theophanie, während andere mögliche Nuancen in der Fußnote erhalten bleiben.
- source_word: וַיִּתְפֹּצְצוּ
  choice: zersprangen
  rationale: Drückt das gewaltsame Auseinanderbrechen der Berge knapp und bildstark aus.
- source_word: הַרְרֵי עַד
  choice: die uralten Berge
  rationale: עַד hebt hier die seit unvordenklicher Zeit bestehende Dauer hervor; „uralt“ ist im Deutschen natürlich und vermeidet eine unnötige Wiederholung von „ewig“.
- source_word: שַׁחוּ
  choice: sanken nieder
  rationale: Bewahrt sowohl die räumliche Vorstellung des Niedersinkens als auch den möglichen poetischen Anklang an Unterwerfung.
- source_word: גִּבְעוֹת עוֹלָם
  choice: die ewigen Hügel
  rationale: Gibt die als dauerhaft geltenden Hügel in feierlicher poetischer Sprache wieder und bildet den Parallelismus mit den uralten Bergen ab.
- source_word: הֲלִיכוֹת עוֹלָם לוֹ
  choice: Seine Wege sind ewig
  rationale: הליכות kann „Gänge“, „Wege“ oder „Bahnen“ bezeichnen. „Wege“ ist verständlich und lässt sowohl Gottes machtvolles Schreiten als auch sein dauerhaftes Handeln anklingen.
theological_decisions:
- issue: Anthropomorphe und kosmisch-theophanische Bildsprache
  choice: Die Handlungen werden als erhabene poetische Darstellung von Gottes Erscheinen und Wirken wiedergegeben.
  alternative: Die Aussagen ausschließlich als politische Metaphern oder ausschließlich als buchstäbliche kosmologische Beschreibung festzulegen.
  rationale: Habakuk 3 verbindet Gottes Auftreten gegenüber den Völkern mit der Erschütterung der Schöpfung. Die Übersetzung bewahrt diese Spannung, ohne die Dichtung auf ein einziges Erklärungsschema zu verengen.
- issue: Bedeutung von הֲלִיכוֹת עוֹלָם לוֹ
  choice: Seine Wege sind ewig
  alternative: Seine Gänge sind von alters her / Seine Pfade sind ewig
  rationale: Die gewählte Fassung wahrt die mögliche theologische Aussage über Gottes dauerhafte Wege, während die Fußnote auf die konkretere Bewegungsbedeutung hinweist.
translation_notes:
  register: Moderne deutsche Standardsprache mit feierlichem, poetischem Ton. Kurze Hauptsätze erhalten den kraftvollen Rhythmus der hebräischen Theophanie; seltene oder konfessionell geprägte Formulierungen werden vermieden.
