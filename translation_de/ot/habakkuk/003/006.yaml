  terminology: „Völker“, „uralten Berge“, „ewigen Hügel“ und „Wege“ sind treffend und registergerecht. Die Fußnoten bewahren die Unsicherheit bei וַיַּתֵּר sowie die möglichen konkreteren Bedeutungen von הֲלִיכוֹת, ohne eine dogmatische Deutung einzutragen. Die Anker stehen jeweils an der sachlich passenden Stelle.
