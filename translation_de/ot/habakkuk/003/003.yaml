id: HAB.3.3
reference: Habakkuk 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱל֨וֹהַ֙ מִ/תֵּימָ֣ן יָב֔וֹא וְ/קָד֥וֹשׁ מֵֽ/הַר פָּארָ֖ן סֶ֑לָה כִּסָּ֤ה שָׁמַ֨יִם֙ הוֹד֔/וֹ וּ/תְהִלָּת֖/וֹ מָלְאָ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/003.yaml
  text: God comes from Teman[a], and the Holy One from Mount Paran. Selah. His splendor covers the heavens[d][c][b], and his praise fills the earth.
translation:
  language: de
  text: Gott kommt von Teman[a], und der Heilige vom Berg Paran. Sela.[b] Sein Glanz[c] bedeckt den Himmel, und sein Lobpreis erfüllt die Erde.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teman kann auch allgemeiner „der Süden“ bedeuten; hier ist wegen der Parallele zum Berg Paran wahrscheinlich der Ortsname gemeint.
    reason: lexical_alternative
  - marker: b
    text: Sela ist vermutlich ein liturgischer oder musikalischer Ausdruck. Seine genaue Bedeutung ist unbekannt; traditionell bleibt er unübersetzt.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Seine Hoheit“ oder „Seine Herrlichkeit“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Sein Lob hat die Erde erfüllt.“ Die hebräische Verbform kann in diesem poetischen Zusammenhang auch als Vergangenheit oder Zukunft wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַ
  choice: Gott
  rationale: Das singularische Gotteswort bezeichnet hier schlicht Gott; „Gott“ ist die natürliche und inhaltlich unverengte deutsche Wiedergabe.
- source_word: מִתֵּימָן
  choice: von Teman
  rationale: תֵּימָן kann den Süden bezeichnen, ist hier aber aufgrund der Parallele zum Berg Paran wahrscheinlich als Ortsname zu verstehen.
- source_word: יָבוֹא
  choice: kommt
  rationale: Das Imperfekt wird in der poetischen Theophanie als vergegenwärtigendes Präsens wiedergegeben; so bleibt die hymnische Unmittelbarkeit erhalten.
- source_word: וְקָדוֹשׁ
  choice: und der Heilige
  rationale: Das substantivierte Adjektiv steht parallel zu „Gott“ und dient hier als Gottesbezeichnung.
- source_word: מֵהַר פָּארָן
  choice: vom Berg Paran
  rationale: Die geografische Wendung wird direkt und verständlich wiedergegeben.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und genaue liturgische Funktion des Ausdrucks unsicher sind, wird er traditionell unübersetzt übernommen.
- source_word: כִּסָּה
  choice: bedeckt
  rationale: Das Präsens führt die vergegenwärtigende Darstellung der Gotteserscheinung fort.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Im Deutschen ist der singularische Sammelbegriff „Himmel“ die natürliche Entsprechung für das hebräische שָׁמַיִם und bewahrt den kosmischen Bezug.
- source_word: הוֹדוֹ
  choice: sein Glanz
  rationale: הוֹד bezeichnet Glanz, Hoheit oder Majestät; „Glanz“ passt besonders zur bildhaften Aussage, dass er den Himmel bedeckt.
- source_word: וּתְהִלָּתוֹ
  choice: und sein Lobpreis
  rationale: „Lobpreis“ bewahrt die Grundbedeutung von תְּהִלָּה und lässt offen, ob das Gott dargebrachte Lob oder seine Lobwürdigkeit im Vordergrund steht.
- source_word: מָלְאָה הָאָרֶץ
  choice: erfüllt die Erde
  rationale: „Erde“ entspricht dem kosmischen Umfang der parallelen Nennung des Himmels; das Präsens erhält die lebendige poetische Schau.
theological_decisions:
- issue: Zeitliche Darstellung der Gotteserscheinung
  choice: 'Vergegenwärtigendes Präsens: „kommt“, „bedeckt“, „erfüllt“'
  alternative: Vergangenheit („kam“, „bedeckte“, „erfüllte“) oder Zukunft („wird kommen“, „wird bedecken“, „wird erfüllen“)
  rationale: Die poetische Gotteserscheinung erinnert an Gottes Handeln und stellt es zugleich hymnisch vor Augen. Das Präsens bewahrt diese Unmittelbarkeit, ohne die Aussage ausschließlich auf Vergangenheit oder Zukunft festzulegen.
- issue: Bezug von „der Heilige“
  choice: Gottesbezeichnung parallel zu „Gott“
  alternative: Bezeichnung einer von Gott unterschiedenen heiligen Gestalt
  rationale: Der poetische Parallelismus weist stark darauf hin, dass beide Ausdrücke denselben göttlichen Handelnden bezeichnen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. „Sela“ bleibt als unsicherer Fachausdruck stehen; „Glanz“ und „Lobpreis“ erhalten die Bildkraft und semantische Spannung des Hebräischen.
