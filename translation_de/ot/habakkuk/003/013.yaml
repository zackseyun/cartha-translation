base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/013.yaml
  text: You went out for the salvation of your people[a], for the salvation of your anointed one; you crushed the head of the house of the wicked, laying bare the foundation up to the neck[c][b]. Selah
translation:
  language: de
  text: Du bist ausgezogen, um dein Volk zu retten, um deinen Gesalbten zu retten[a]. Du hast das Haupt des Hauses des Frevlers zerschmettert und das Fundament bis zum Hals entblößt[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dein Gesalbter“ kann den davidischen König, das Volk in repräsentativer Gestalt oder in messianischer beziehungsweise typologischer Sicht den Messias bezeichnen; das Hebräische legt hier keine einzelne Deutung zwingend fest.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „und legtest den Grund bis zum Hals bloß“. Das hebräische Bild ist schwer verständlich und verbindet möglicherweise die Zerstörung eines Hauses mit der Entblößung eines Körpers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָאתָ
  choice: Du bist ausgezogen
  rationale: Das Qal Perfekt 2. Person maskulin Singular von יצא bezeichnet Gottes entschlossenes Ausziehen zum Handeln. „Ausgezogen“ bewahrt im Deutschen sowohl die Bewegungsrichtung als auch den möglichen militärischen Klang, ohne diesen ausdrücklich hinzuzufügen.
- source_word: לְיֵשַׁע ... לְיֵשַׁע
  choice: um ... zu retten, um ... zu retten
  rationale: יֵשַׁע bezeichnet Rettung oder Befreiung. Die verbale Wiedergabe ist im modernen Deutsch natürlicher als die zweimalige Formulierung „zur Rettung“, wahrt aber die betonte hebräische Wiederholung.
- source_word: עַמֶּךָ
  choice: dein Volk
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der 2. Person maskulin Singular; der kollektive Bundesbezug bleibt erhalten.
- source_word: מְשִׁיחֶךָ
  choice: deinen Gesalbten
  rationale: מָשִׁיחַ bedeutet „Gesalbter“. Die substantivierte deutsche Form gibt den Ausdruck transparent wieder, ohne ihn im Haupttext eindeutig als den Titel „Messias“ festzulegen.
- source_word: מָחַצְתָּ
  choice: Du hast ... zerschmettert
  rationale: מחץ bezeichnet ein vernichtendes Zerschlagen oder Zermalmen. „Zerschmettert“ passt zur gewaltsamen Siegesbildsprache und zur Verbindung mit „Haupt“.
- source_word: רֹאשׁ מִבֵּית רָשָׁע
  choice: das Haupt vom Haus des Frevlers
  rationale: „Haupt“ bewahrt die mögliche Körper-, Führungs- und Gebäudemetaphorik von רֹאשׁ. „Vom Haus“ bildet מִן ab und lässt offen, wie genau Haupt und Haus syntaktisch beziehungsweise bildlich zusammengehören. Der bestimmte Singular „des Frevlers“ wahrt die personale Möglichkeit von רָשָׁע.
- source_word: עָרוֹת יְסוֹד
  choice: das Fundament ... entblößt
  rationale: ערה bedeutet aufdecken oder entblößen, יְסוֹד Fundament beziehungsweise Grund. Die Formulierung bewahrt das drastische, möglicherweise gemischte Bild.
- source_word: עַד צַוָּאר
  choice: bis zum Hals
  rationale: Wörtliche Wiedergabe der schwierigen Wendung; sie vermeidet eine spekulative Auflösung des Bildes.
- source_word: סֶלָה
  choice: Sela
  rationale: Transliteration des unklaren liturgischen oder musikalischen Ausdrucks; eine Übersetzung würde größere Sicherheit vortäuschen, als die Quellenlage erlaubt.
theological_decisions:
- issue: Bezug von „deinen Gesalbten“
  choice: Deskriptiv als „deinen Gesalbten“ wiedergegeben, ohne den Bezug näher festzulegen.
  alternative: Möglich sind der davidische König, das Volk in repräsentativer Gestalt oder eine messianische beziehungsweise typologische Deutung.
  rationale: Das hebräische מְשִׁיחֶךָ besitzt königliche und theologische Resonanz, zwingt in diesem Vers aber nicht zu einer einzigen Identifikation. Die Übersetzung bewahrt diese Spannung.
- issue: Identität des רָשָׁע
  choice: Als singularischer „Frevler“ wiedergegeben.
  alternative: Generisch „der Gottlose“ oder kollektiv „die Frevler“.
  rationale: Die grammatische Singularform wird erhalten, ohne den Gegner mit einer bestimmten endzeitlichen Gestalt gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit nachvollziehbarer Satzstruktur. Die zweimalige Zweckangabe bewahrt den Parallelismus. „Haupt“, „Fundament“ und „Hals“ erhalten bewusst die spannungsvolle Mischbildlichkeit des Hebräischen; „Sela“ bleibt unübersetzt.
