source:
  edition: WLC
  text: שֶׁ֥מֶשׁ יָרֵ֖חַ עָ֣מַד זְבֻ֑לָ/ה לְ/א֤וֹר חִצֶּ֨י/ךָ֙ יְהַלֵּ֔כוּ לְ/נֹ֖גַהּ בְּרַ֥ק חֲנִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/011.yaml
  text: Sun and moon stood in their lofty place[a]; at the light of your arrows they went[c][b], at the brightness of the flash of your spear.
translation:
  language: de
  text: Sonne und Mond standen in ihrer erhabenen Stätte.[a] Beim Licht deiner Pfeile zogen sie dahin,[b] beim Glanz des Blitzes deines Speeres.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „standen in ihrer Wohnstatt“; das hebräische Wort bezeichnet eine hoch gelegene Wohnstätte oder einen erhabenen Ort.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische ist stark verdichtet. „Sie zogen dahin“ kann sich auf Sonne und Mond beziehen; wahrscheinlich sind jedoch die göttlichen Pfeile beziehungsweise die Waffenbilder im Blick.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „beim Glanz des Aufleuchtens deines Speeres“; „Blitz“ kann hier auch das Aufblitzen oder Leuchten der Waffe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ יָרֵחַ
  choice: Sonne und Mond
  rationale: Die beiden Himmelskörper werden wie im hebräischen poetischen Paar ohne Artikel genannt; das wirkt im Deutschen knapp und feierlich.
- source_word: עָמַד
  choice: standen
  rationale: Das Qal bezeichnet hier ein Stehen oder Stillstehen. „Standen“ wahrt die Bildsprache, ohne die Art des Stillstands näher festzulegen.
- source_word: זְבֻלָה
  choice: an ihrer erhabenen Stätte
  rationale: זְבוּל bezeichnet eine hoch gelegene oder erhabene Wohnstätte. Der Pluralbezug „ihrer“ folgt im Deutschen dem Paar „Sonne und Mond“, während „erhabene Stätte“ den räumlich-poetischen Sinn erhält.
- source_word: לְאוֹר חִצֶּיךָ
  choice: beim Licht deiner Pfeile
  rationale: Die Wendung bewahrt das Lichtbild und die martialische Metapher. „Beim“ lässt den genauen Umstands- oder Richtungsbezug der Präposition offen.
- source_word: יְהַלֵּכוּ
  choice: zogen sie dahin
  rationale: Die Piel-Form von הלך bezeichnet hier poetisch Bewegung. „Zogen … dahin“ ist würdig und lässt durch das Pronomen offen, worauf sich das Subjekt bezieht.
- source_word: לְנֹגַהּ בְּרַק חֲנִיתֶךָ
  choice: beim Glanz deines blitzenden Speeres
  rationale: Die Formulierung gibt sowohl נֹגַהּ („Glanz, Helligkeit“) als auch בָּרָק („Blitz, Aufleuchten“) in natürlichem Deutsch wieder und erhält die Parallelität zum Licht der Pfeile.
theological_decisions:
- issue: Bezugswort des pluralischen Verbs יְהַלֵּכוּ
  choice: Das Pronomen „sie“ bewahrt die verdichtete Mehrdeutigkeit; im unmittelbaren Satzbau kann es auf Sonne und Mond zurückweisen, im Bildzusammenhang aber auch die dahinfliegenden göttlichen Geschosse aufnehmen.
  alternative: Das Subjekt ausdrücklich als „deine Pfeile“ bestimmen oder Sonne und Mond ausdrücklich als die sich bewegenden Größen deuten.
  rationale: Der hebräische Vers nennt beim Verb kein neues ausdrückliches Subjekt. Eine eindeutige Ergänzung würde die poetische Spannung unzulässig auflösen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit knapper poetischer Satzführung. Die Wiederholung von „beim“ bildet den hebräischen Parallelismus ab; ungewöhnliche Bildverbindungen werden nicht rationalisierend geglättet.
