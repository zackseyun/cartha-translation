  text: רָא֤וּ/ךָ יָחִ֨ילוּ֙ הָרִ֔ים זֶ֥רֶם מַ֖יִם עָבָ֑ר נָתַ֤ן תְּהוֹם֙ קוֹל֔/וֹ ר֖וֹם יָדֵ֥י/הוּ נָשָֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/010.yaml
  text: The mountains saw you and writhed[a]; a torrent of waters swept by. The deep gave its voice[c][b]; it lifted its hands on high.
translation:
  language: de
  text: Die Berge sahen dich und wanden sich[a]; eine Wasserflut zog vorüber[b]. Die Tiefe erhob ihre Stimme; sie hob ihre Hände empor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »bebten«, »krümmten sich vor Schmerzen« oder »erzitterten«. Das hebräische Verb kann Beben oder ein wehenartiges, krampfhaftes Sichwinden bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »ging vorüber« oder »zog vorbei«. Im Zusammenhang mit der Wasserflut kann das Verb eine machtvolle Bewegung ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich ist von den »Händen« der Tiefe die Rede. Manche verstehen sie bildlich als ihre sich auftürmenden Wellen.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: sahen dich
  rationale: Das Qal Perfekt von ראה mit Suffix der 2. Person maskulin Singular bedeutet direkt »sahen dich« und bewahrt die Personifizierung der Berge.
- source_word: יָחִילוּ
  choice: wanden sich
  rationale: Das Verb חול/חיל kann Beben, Sichwinden oder wehenartige Qual bezeichnen. »Wanden sich« gibt die heftige, beinahe geburtswehenartige Bewegung wieder, ohne die mögliche Bedeutung auf bloßes Zittern zu verengen.
- source_word: זֶרֶם מַיִם
  choice: eine Flut von Wassern
  rationale: זֶרֶם bezeichnet einen reißenden Wasserstrom, eine Überschwemmung oder einen Wolkenbruch. Die Formulierung hält das pluralische מַיִם und die machtvolle Wasserbildlichkeit fest.
- source_word: עָבָר
  choice: zog vorüber
  rationale: עבר bedeutet grundlegend »vorübergehen, hinüberziehen«. Beim Subjekt »Flut von Wassern« vermittelt »zog vorüber« Bewegung und Wucht, ohne die Grundbedeutung interpretierend zu übersteigern.
- source_word: נָתַן תְּהוֹם קוֹלוֹ
  choice: Die Tiefe erhob ihre Stimme
  rationale: Die hebräische Wendung lautet wörtlich etwa »die Tiefe gab ihre Stimme«. »Erhob ihre Stimme« ist natürliches Deutsch und bewahrt sowohl das Sprechen als auch die Personifizierung.
- source_word: תְּהוֹם
  choice: die Tiefe
  rationale: »Die Tiefe« gibt die kosmischen Tiefenwasser wieder, ohne zusätzliche Vorstellungen einzutragen, die »Abgrund« nahelegen könnte.
- source_word: רוֹם
  choice: empor
  rationale: רוֹם bezeichnet Höhe und wird hier adverbial zur Hebebewegung verstanden. »Empor« ist knapp, poetisch und im modernen Deutschen verständlich.
- source_word: יָדֵיהוּ נָשָׂא
  choice: ihre Hände hob sie
  rationale: Die wörtliche Rede von den »Händen« der personifizierten Tiefe wird beibehalten, statt sie bereits in der Übersetzung als Wellen auszulegen.
theological_decisions:
- issue: Personifizierte kosmische Bilder in einer Theophanie
  choice: Berge und Tiefe reagieren als personifizierte Teile der Schöpfung auf Gott.
  alternative: Die Bilder rein naturkundlich als Erdbeben, Wasserflut und aufsteigende Wellen wiedergeben.
  rationale: Die hebräische Poesie schreibt Bergen und Tiefe Wahrnehmung, Stimme und Hände zu. Das Beibehalten dieser Spannung wahrt die theophanische Bildwelt und vermeidet eine rationalisierende Auflösung.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallelen Kurzsätze und die Personifizierung der Schöpfung bleiben erhalten. Ungewöhnliche Bilder werden nicht im Haupttext aufgelöst, sondern durch knappe Fußnoten erläutert.
