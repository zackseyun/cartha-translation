  text: נָקַ֤בְתָּ בְ/מַטָּי/ו֙ רֹ֣אשׁ פרז/ו יִסְעֲר֖וּ לַ/הֲפִיצֵ֑/נִי עֲלִ֣יצֻתָ֔/ם כְּמוֹ לֶ/אֱכֹ֥ל עָנִ֖י בַּ/מִּסְתָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/014.yaml
  text: You pierced the head of his warriors with his own staffs; they stormed out to scatter me[a], their exultation like one about to devour the poor in secret.
translation:
  language: de
  text: Mit seinen eigenen Stäben durchbohrtest du das Haupt seiner Krieger[a]. Sie stürmten heran, um mich zu zerstreuen; ihr Jubel, als wollten sie den Armen im Verborgenen verschlingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Dörfer“ beziehungsweise „seiner Scharen“. Der hebräische Ausdruck ist schwierig; vielfach wird er allgemein auf die feindlichen Truppen oder deren Anführer bezogen.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָקַבְתָּ
  choice: durchbohrtest du
  rationale: Das Qal von נקב bezeichnet ein Durchstechen oder Durchbohren. „Durchbohren“ bewahrt das gewaltsame Bild und ist im Deutschen klar verständlich.
- source_word: בְמַטָּיו
  choice: mit seinen eigenen Stäben
  rationale: מַטֶּה bedeutet gewöhnlich „Stab“ oder „Stock“; der Plural mit Suffix heißt wörtlich „mit seinen Stäben“. „Eigenen“ verdeutlicht die im Kontext hervortretende Ironie, ohne die Gegenstände vorschnell als Speere festzulegen.
- source_word: רֹאשׁ
  choice: das Haupt
  rationale: רֹאשׁ kann den Kopf, das Haupt oder übertragen einen Anführer bezeichnen. „Das Haupt“ erhält das hebräische Bild und lässt einen übertragenen Sinn offen.
- source_word: פְּרָזָיו
  choice: seiner Krieger
  rationale: Die Form und Bedeutung sind umstritten. Im unmittelbaren Zusammenhang eines stürmischen Angriffs ist eine Bezeichnung für feindliche Kämpfer oder Scharen wahrscheinlich; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: יִסְעֲרוּ
  choice: sie stürmten heran
  rationale: סער beschreibt stürmisches, ungestümes Losbrechen. „Stürmten heran“ gibt sowohl die heftige Bewegung als auch das Wetterbild natürlich wieder.
- source_word: לַהֲפִיצֵנִי
  choice: um mich zu zerstreuen
  rationale: Das Hifil von פוץ bedeutet „zerstreuen“ oder „auseinandertreiben“. Die direkte Wiedergabe bewahrt auch den auffälligen Wechsel zum Sprecher in der ersten Person.
- source_word: עֲלִיצֻתָם
  choice: ihr Jubel
  rationale: Das Substantiv bezeichnet ausgelassene Freude oder Frohlocken. „Jubel“ klingt im Deutschen natürlich und vermittelt hier die grausame Vorfreude der Angreifer.
- source_word: כְּמוֹ לֶאֱכֹל
  choice: wie der eines Menschen, der … verschlingen will
  rationale: Die Vergleichskonstruktion beschreibt die begierige Absicht der Angreifer. „Verschlingen will“ bringt die zielgerichtete, räuberische Bildsprache idiomatisch zum Ausdruck.
- source_word: עָנִי
  choice: den Armen
  rationale: עָנִי kann einen Armen, Bedürftigen oder Bedrängten bezeichnen. „Den Armen“ passt zur sozialen Unterdrückung im Bild und lässt die Einzahl des Hebräischen erkennen.
- source_word: בַּמִּסְתָּר
  choice: im Verborgenen
  rationale: Das Wort bezeichnet einen verborgenen Ort beziehungsweise Heimlichkeit. „Im Verborgenen“ erhält beide Nuancen besser als eine rein adverbiale Wiedergabe.
theological_decisions:
- issue: Deutung des schwierigen Nomens פְּרָזָיו im kriegerischen Zusammenhang
  choice: seiner Krieger
  alternative: seiner Dörfer / seiner Scharen
  rationale: Der Vers schildert Angreifer, die heranstürmen, um den Sprecher zu zerstreuen und den Armen zu verschlingen. Daher passt ein militärischer Bezug am besten zum unmittelbaren Zusammenhang. Weil Form und Bedeutung des hebräischen Ausdrucks tatsächlich unsicher sind, werden andere mögliche Deutungen in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischer Bildkraft. „Haupt“ erhält die mögliche wörtliche wie übertragene Bedeutung; „Stäbe“ vermeidet eine nicht zwingende Festlegung auf Speere. Der Satzbau wurde für natürliche deutsche Lesbarkeit leicht entfaltet, ohne die Ambiguität des schwierigen Nomens zu verdecken.
