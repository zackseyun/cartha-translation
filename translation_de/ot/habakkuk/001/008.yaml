base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/008.yaml
  text: His horses are swifter than leopards and fiercer than wolves at dusk[a]. His horsemen spread out; his horsemen come from far away. They fly like an eagle hurrying to devour.
translation:
  language: de
  text: Seine Pferde sind schneller als Leoparden und wilder als Wölfe am Abend. Seine Reiter schwärmen aus; seine Reiter kommen aus der Ferne. Sie fliegen wie ein Adler[a], der eilt, um zu verschlingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Geier, der eilt, um zu verschlingen“. Das hebräische נֶשֶׁר kann allgemeiner einen großen Aas- oder Greifvogel bezeichnen und meint nicht zwingend den Adler im heutigen zoologischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלּוּ מִנְּמֵרִים
  choice: schneller als Leoparden
  rationale: קלל bezeichnet hier im Vergleich mit Raubtieren Schnelligkeit; נמר wird im Deutschen am klarsten mit „Leopard“ wiedergegeben.
- source_word: וְחַדּוּ מִזְּאֵבֵי עֶרֶב
  choice: und grimmiger als Wölfe am Abend
  rationale: חדד trägt hier bildlich den Sinn von Schärfe beziehungsweise Wildheit. „Grimmiger“ bewahrt das Raubtierbild; „am Abend“ gibt die Zeitangabe עֶרֶב ohne zusätzliche Deutung wieder.
- source_word: וּפָשׁוּ פָּרָשָׁיו
  choice: Seine Reiter schwärmen aus
  rationale: „Ausschwärmen“ beschreibt die weiträumige, sich ausbreitende Bewegung der Reiterei natürlich und lässt die genaue militärische Formation offen.
- source_word: וּפָרָשָׁיו מֵרָחוֹק יָבֹאוּ
  choice: seine Reiter kommen aus der Ferne
  rationale: Die Wiederholung von פָּרָשָׁיו wird erhalten; „aus der Ferne“ entspricht der schlichten räumlichen Aussage.
- source_word: יָעֻפוּ כְּנֶשֶׁר
  choice: Sie fliegen wie ein Adler
  rationale: Die direkte Flugmetapher bleibt erhalten. נֶשֶׁר kann einen Adler oder allgemeiner einen großen Greif- beziehungsweise Aasvogel bezeichnen; die zoologische Alternative wird in der Fußnote genannt.
- source_word: חָשׁ לֶאֱכוֹל
  choice: der herbeieilt, um zu verschlingen
  rationale: Die Formulierung gibt sowohl die Eile als auch die räuberische Gewalt des Bildes idiomatisch wieder; „verschlingen“ ist im Kontext treffender als das schwächere „essen“.
