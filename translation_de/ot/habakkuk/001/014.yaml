source:
  edition: WLC
  text: וַ/תַּעֲשֶׂ֥ה אָדָ֖ם כִּ/דְגֵ֣י הַ/יָּ֑ם כְּ/רֶ֖מֶשׂ לֹא מֹשֵׁ֥ל בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/014.yaml
  text: You make man like the fish of the sea[a], like creeping things that have no ruler over them.
translation:
  language: de
  text: Du machst den Menschen[a] wie die Fische des Meeres, wie kriechende Tiere, die keinen Herrscher über sich haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Menschheit“. Das hebräische Wort steht im Singular, kann hier aber die Menschen insgesamt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲשֶׂה
  choice: Du machst
  rationale: Das mit waw eingeleitete Imperfekt richtet sich unmittelbar an Gott. Im Zusammenhang der Klage beschreibt es sein gegenwärtig erfahrenes Handeln; „Du machst“ gibt den Vorwurf natürlich und direkt wieder.
- source_word: אָדָם
  choice: den Menschen
  rationale: Das singularische אָדָם bezeichnet hier den Menschen repräsentativ beziehungsweise die Menschheit als Kollektiv. „Den Menschen“ bewahrt im Deutschen sowohl die Singularform als auch den allgemeinen Bezug.
- source_word: כִּדְגֵי הַיָּם
  choice: wie die Fische im Meer
  rationale: Die Formulierung gibt den Vergleich klar und in natürlichem modernem Deutsch wieder. „Im Meer“ entspricht idiomatisch der hebräischen Genitivverbindung „Fische des Meeres“.
- source_word: כְּרֶמֶשׂ
  choice: wie die Kriechtiere
  rationale: רֶמֶשׂ ist eine Sammelbezeichnung für kleine Tiere, die kriechen oder sich am Boden bewegen. „Kriechtiere“ wahrt das Bild, ohne eine moderne zoologische Klasse wie „Reptilien“ festzulegen.
- source_word: לֹא מֹשֵׁל בּוֹ
  choice: die keinen Herrscher über sich haben
  rationale: מֹשֵׁל bezeichnet einen Herrschenden beziehungsweise Herrscher. Obwohl das hebräische Pronomen singularisch ist, bezieht sich die Wendung kollektiv auf die verglichenen Lebewesen; der deutsche Pluralanschluss ist idiomatisch und erhält den Herrschaftsbegriff.
theological_decisions:
- issue: Generisch-kollektive Bedeutung von אָדָם
  choice: den Menschen
  alternative: die Menschheit
  rationale: „Den Menschen“ erhält die grammatische Singularform und lässt zugleich den kollektiven Bezug zu. „Die Menschheit“ würde diesen Bezug eindeutiger ausdrücken, aber die repräsentative Singularform des Hebräischen auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede Gottes. Die Bildsprache bleibt konkret; weder die kollektive Bedeutung von „Mensch“ noch die Reichweite von רֶמֶשׂ wird unnötig verengt.
