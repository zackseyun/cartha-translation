source:
  edition: WLC
  text: עַל כֵּן֙ יְזַבֵּ֣חַ לְ/חֶרְמ֔/וֹ וִֽ/יקַטֵּ֖ר לְ/מִכְמַרְתּ֑/וֹ כִּ֤י בָ/הֵ֨מָּה֙ שָׁמֵ֣ן חֶלְק֔/וֹ וּ/מַאֲכָל֖/וֹ בְּרִאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/016.yaml
  text: Therefore he sacrifices to his net and burns incense to his dragnet[a], because by them his portion is rich and his food is plentiful.
translation:
  language: de
  text: Darum opfert er seinem Netz und verbrennt seinem Fangnetz[a] Weihrauch; denn durch sie ist sein Anteil üppig und seine Nahrung reichlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Schleppnetz“. Die beiden hebräischen Wörter bezeichnen unterschiedliche Fangnetze; ihre genaue Bauart lässt sich im Deutschen nicht sicher wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt den folgernden Anschluss an den vorausgehenden Erfolg des Eroberers knapp und natürlich wieder.
- source_word: יְזַבֵּחַ
  choice: opfert er
  rationale: Das Piel bezeichnet hier kultisches Opfern und nicht bloßes Schlachten.
- source_word: לְחֶרְמוֹ
  choice: seinem Netz
  rationale: חֵרֶם bezeichnet im Fischfangbild ein Fanggerät; „Netz“ ist im Deutschen natürlich und lässt die Bildsprache stehen.
- source_word: וִיקַטֵּר
  choice: verbrennt ... Weihrauch
  rationale: Das Piel von קטר trägt hier kultische Bedeutung und bewahrt das Bild abgöttischer Verehrung.
- source_word: לְמִכְמַרְתּוֹ
  choice: seinem Fangnetz
  rationale: מִכְמֶרֶת meint ein größeres Fang- bzw. Umschließungsnetz. „Fangnetz“ unterscheidet es wenigstens sprachlich vom ersten Netz, ohne den unsicheren genauen Netztyp zu überbestimmen.
- source_word: כִּי בָהֵמָּה
  choice: denn durch sie
  rationale: 'Die Präposition ב ist instrumental: Mittels dieser Fanggeräte erlangt er seinen Wohlstand.'
- source_word: שָׁמֵן חֶלְקוֹ
  choice: sein Anteil üppig
  rationale: שָׁמֵן bedeutet wörtlich „fett“, bezeichnet hier bildlich aber einen reichen, ertragreichen Anteil. „Üppig“ bewahrt etwas von der Füllemetaphorik.
- source_word: וּמַאֲכָלוֹ בְּרִיאָה
  choice: seine Nahrung reichlich
  rationale: בְּרִיאָה kann „fett, wohlgenährt, erlesen“ bedeuten; im Zusammenhang bezeichnet es reichliche bzw. gehaltvolle Nahrung, ohne dass die genaue Nuance eindeutig wäre.
theological_decisions:
- issue: Kultische Sprache für militärische beziehungsweise fangbildliche Machtmittel
  choice: Die ausdrücklichen Opfer- und Weihrauchbegriffe werden wörtlich als kultische Verehrung der eigenen Erfolgsmittel wiedergegeben.
  alternative: Die Aussage lediglich als übermäßiges Vertrauen auf die eigene Macht paraphrasieren.
  rationale: Der hebräische Text verwendet eindeutige Kultsprache. Ob konkrete Götzenverehrung oder eine zugespitzte Darstellung der Selbstvergötterung gemeint ist, bleibt in der Bildsprache offen und wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche kultische Verbindung „seinem Fangnetz Weihrauch verbrennen“ bleibt bewusst erhalten. Das Semikolon markiert den Übergang von Handlung zu Begründung.
