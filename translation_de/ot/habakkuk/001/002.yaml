  text: עַד אָ֧נָה יְהוָ֛ה שִׁוַּ֖עְתִּי וְ/לֹ֣א תִשְׁמָ֑ע אֶזְעַ֥ק אֵלֶ֛י/ךָ חָמָ֖ס וְ/לֹ֥א תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/002.yaml
  text: How long, O LORD, have I cried for help and you do not hear? I cry out to you, “Violence!” and you do not save.
translation:
  language: de
  text: 'Wie lange, HERR, habe ich schon um Hilfe gerufen, und du hörst nicht? Ich schreie zu dir: »Gewalt!«, und du rettest nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Wie lange
  rationale: Gibt die klagende Frage nach der Dauer natürlich und unmittelbar wieder.
- source_word: יְהוָה
  choice: HERR
  rationale: Folgt der etablierten deutschsprachigen Bibelkonvention für den Gottesnamen, ohne die Anrede abzuschwächen.
- source_word: שִׁוַּעְתִּי
  choice: habe ich schon um Hilfe gerufen
  rationale: Das Perfekt beschreibt den bis in die Gegenwart anhaltenden Hilferuf; »schon« macht die in der Klage liegende Dauer im Deutschen deutlich.
- source_word: תִשְׁמָע
  choice: hörst
  rationale: Bewahrt das konkrete Bild des Hörens; im Zusammenhang ist ein erhörendes Eingreifen gemeint, ohne dies im Text ausdrücklich festzulegen.
- source_word: חָמָס
  choice: Gewalt
  rationale: Bezeichnet gewaltsames Unrecht und steht hier als alarmierender Ausruf.
- source_word: תוֹשִׁיעַ
  choice: rettest
  rationale: Entspricht der Grundbedeutung des Hifil von ישׁע und lässt offen, auf welche konkrete Weise Gott retten soll.
theological_decisions:
- issue: Gottes scheinbares Nichthören
  choice: ohne dass du hörst
  alternative: ohne dass du erhörst
  rationale: Die konkrete Aussage des Hebräischen wird bewahrt. Die Spannung zwischen Gottes Hören und seinem ausbleibenden Eingreifen wird nicht durch eine interpretierende Formulierung aufgelöst.
- issue: Zeitliche Aussage der Klage
  choice: habe ich schon um Hilfe gerufen
  alternative: soll ich um Hilfe rufen
  rationale: Die hebräische Perfektform blickt auf wiederholtes beziehungsweise andauerndes Rufen zurück; sie wird nicht als rein zukünftige Frage wiedergegeben.
translation_notes:
  register: Moderne, würdige Klagesprache. Die Anrede »HERR« folgt der üblichen deutschen Wiedergabe des Tetragramms; der knappe Ruf »Gewalt!« erhält die Dringlichkeit des Hebräischen.
