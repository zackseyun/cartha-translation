id: HAB.1.5
reference: Habakkuk 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רְא֤וּ בַ/גּוֹיִם֙ וְֽ/הַבִּ֔יטוּ וְ/הִֽתַּמְּה֖וּ תְּמָ֑הוּ כִּי פֹ֨עַל֙ פֹּעֵ֣ל בִּֽ/ימֵי/כֶ֔ם לֹ֥א תַאֲמִ֖ינוּ כִּ֥י יְסֻפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/005.yaml
  text: Look among the nations and see[a]; be astonished, be astounded[b]. For I am doing a work in your days that you would not believe if it were told.
translation:
  language: de
  text: Schaut euch unter den Völkern um und seht hin[a]; staunt, ja, staunt[b]! Denn ich vollbringe in euren Tagen ein Werk[c], das ihr nicht glauben würdet, wenn man davon erzählte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schaut auf die Völker und seht hin.«'
    reason: Die Präposition ב kann hier sowohl den Bereich (»unter den Völkern«) als auch das Ziel des Blicks (»auf die Völker«) bezeichnen.
  - marker: b
    text: 'Wörtlich steht dasselbe Verb zweimal: »staunt, staunt«; die Wiederholung verstärkt die Aufforderung.'
    reason: Die hebräische Doppelung wird im Haupttext mit »ja« idiomatisch verdeutlicht.
  - marker: c
    text: 'Oder: »Denn in euren Tagen wird ein Werk vollbracht«; im Hebräischen ist das handelnde Subjekt nicht ausdrücklich genannt.'
    reason: Die alternative Fassung bewahrt die formale Unbestimmtheit des hebräischen Satzes.
lexical_decisions:
- source_word: רְאוּ בַגּוֹיִם
  choice: Schaut euch unter den Völkern um
  rationale: Der pluralische Imperativ fordert zum Beobachten auf. »Unter den Völkern« gibt die wahrscheinlichste räumliche Bedeutung der Präposition wieder; »Völker« bezeichnet hier politische beziehungsweise ethnische Gemeinschaften.
- source_word: וְהַבִּיטוּ
  choice: und seht hin
  rationale: הביט bezeichnet gezieltes Hinschauen. Die Formulierung bewahrt den zweiten Imperativ und klingt neben »schaut euch … um« natürlich.
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  choice: staunt, ja, staunt
  rationale: Die Wiederholung desselben hebräischen Verbs dient der starken Hervorhebung. Das deutsche »ja« macht diese Intensivierung verständlich, ohne sie durch eine zusätzliche Deutung zu ersetzen.
- source_word: פֹעַל פֹּעֵל
  choice: ich vollbringe … ein Werk
  rationale: Die Verbindung von Substantiv und Partizip betont die Handlung. »Ein Werk vollbringen« ist würdig und gegenwärtig verständlich; das »ich« ergibt sich aus dem göttlichen Sprecher im Zusammenhang.
- source_word: בִּימֵיכֶם
  choice: in euren Tagen
  rationale: Die wörtliche und im Deutschen verständliche Wendung wahrt den unmittelbaren zeitlichen Bezug auf die Angesprochenen.
- source_word: לֹא תַאֲמִינוּ כִּי יְסֻפָּר
  choice: das ihr nicht glauben würdet, wenn man davon erzählte
  rationale: Der Konjunktiv bildet den sinngemäß konditionalen Zusammenhang natürlich ab. Das unpersönliche »man« wahrt den passiven Charakter von יְסֻפָּר.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt des Wirkens
  choice: Denn ich vollbringe … ein Werk
  alternative: Denn ein Werk wird … vollbracht
  rationale: Im Hebräischen steht in diesem Satz kein ausdrückliches Personalpronomen. Der unmittelbare prophetische Redekontext legt jedoch den HERRN als Sprecher und Handelnden nahe. Die Fußnote bewahrt die grammatisch mögliche unpersönliche Wiedergabe.
- issue: Nachdruck der doppelten Aufforderung zum Staunen
  choice: staunt, ja, staunt
  alternative: seid entsetzt und erstarrt vor Staunen
  rationale: Die gewählte Fassung erhält die auffällige Wiederholung, ohne die Art des Staunens theologisch oder emotional näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die imperativische Dringlichkeit und die hebräische Wiederholung bleiben hörbar; ungewöhnliche Satzstellung und unnötig altertümliche Wörter werden vermieden.
