base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/017.yaml
  text: Will he therefore keep emptying his net and continually slaughtering nations without mercy?[a][b]
translation:
  language: de
  text: Soll er darum immer wieder sein Netz[a] leeren und unaufhörlich Völker töten, ohne sie zu verschonen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Schleppnetz“. Das hebräische Wort bezeichnet im Zusammenhang ein Fangnetz.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne Mitleid mit ihnen zu haben“. Das hebräische Verb kann sowohl „verschonen“ als auch „Mitleid haben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל כֵּן
  choice: Soll er darum
  rationale: Die Fragepartikel mit עַל־כֵּן leitet eine rhetorische, aus dem Vorangehenden folgernde Frage ein. „Soll er darum“ gibt sowohl den Schlussbezug als auch den fragenden Ton natürlich wieder.
- source_word: יָרִיק
  choice: immer wieder … leeren
  rationale: Das Hifil von ריק bedeutet „leeren, ausleeren“. Im Bild des Fischers ist das Leeren des Netzes gemeint; „immer wieder“ bringt den fortdauernden beziehungsweise wiederholten Aspekt des Imperfekts zum Ausdruck.
- source_word: חֶרְמוֹ
  choice: sein Schleppnetz
  rationale: חֵרֶם bezeichnet hier im fortgeführten Fischfangbild ein Netz, wahrscheinlich ein Schleppnetz. Die konkrete Wiedergabe bewahrt das Bild und unterscheidet dieses Fanggerät von den anderen Netzbezeichnungen im Kontext.
- source_word: וְתָמִיד
  choice: und unaufhörlich
  rationale: תָּמִיד bezeichnet beständige, fortgesetzte Dauer. „Unaufhörlich“ unterstreicht die schonungslose Wiederholung des Tötens.
- source_word: לַהֲרֹג
  choice: töten
  rationale: Der Infinitiv von הרג bezeichnet das Töten. Im Zusammenhang mit ganzen Völkern ist die Massengewalt deutlich, ohne dass durch ein stärker wertendes deutsches Verb zusätzliche Bedeutung eingetragen wird.
- source_word: גּוֹיִם
  choice: Völker
  rationale: גּוֹיִם meint hier die vom Eroberer angegriffenen ethnisch-politischen Gemeinschaften. „Völker“ ist im prophetischen Kontext natürlich und vermeidet die missverständliche Wiedergabe „Heiden“.
- source_word: לֹא יַחְמֹל
  choice: ohne sie zu verschonen
  rationale: חמל kann „verschonen“ oder „Mitleid haben“ bedeuten. Die Formulierung bewahrt die Verneinung und den unmittelbaren Bezug auf die Völker; die Mitleidsnuance wird in einer Fußnote genannt.
theological_decisions: []
