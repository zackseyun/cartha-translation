base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/003.yaml
  text: Why do you make me see wrongdoing[a], and why do you look at trouble? Destruction and violence are before me; strife comes to be[c][b], and contention rises up.
translation:
  language: de
  text: Warum zeigst du mir Unrecht[a], und warum siehst du Elend an? Verwüstung[b] und Gewalt sind vor meinen Augen; Streit entsteht[c], und Zwietracht erhebt sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum lässt du mich Unrecht sehen?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zerstörung“ oder „Plünderung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Streit bricht aus, und Hader kommt auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Warum
  rationale: Die knappe Fragepartikel entspricht der direkten Form der Klage.
- source_word: תַרְאֵנִי
  choice: lässt du mich … sehen
  rationale: Die Hifil-Form von ראה mit Suffix der 1. Person Singular ist kausativ. Im Deutschen gibt „lässt du mich sehen“ diese Veranlassung natürlich wieder, ohne die theologische Spannung abzuschwächen.
- source_word: אָוֶן
  choice: Unrecht
  rationale: Hier bezeichnet das Wort moralisch verwerfliches Handeln; „Unrecht“ ist verständlich und passt zum Kontext gesellschaftlicher Gewalt.
- source_word: עָמָל
  choice: Elend
  rationale: Das Wort kann Mühsal, Not oder von Menschen verursachtes Unheil bezeichnen. „Elend“ bewahrt die belastende Wirkung, ohne es auf neutrale Arbeit zu verengen.
- source_word: תַּבִּיט
  choice: schaust du … zu
  rationale: נבט bedeutet ansehen oder hinschauen. Das deutsche „zuschauen“ ist in dieser Konstruktion natürlich und lässt den Vorwurf scheinbarer Untätigkeit anklingen, ohne ihn erklärend aufzulösen.
- source_word: שֹׁד
  choice: Verwüstung
  rationale: שֹׁד bezeichnet gewaltsame Zerstörung oder Plünderung. „Verwüstung“ erfasst hier die zerstörerische Folge und bildet mit „Gewalt“ ein klares Paar.
- source_word: חָמָס
  choice: Gewalt
  rationale: Der prophetische Begriff bezeichnet häufig gewaltsames Unrecht; „Gewalt“ ist die direkte und geläufige Wiedergabe.
- source_word: לְנֶגְדִּי
  choice: vor meinen Augen
  rationale: Die Wendung bezeichnet das, was dem Propheten unmittelbar vor Augen steht. Die idiomatische Form macht die erzwungene Wahrnehmung deutlich.
- source_word: וַיְהִי
  choice: entsteht
  rationale: Die Verbform von היה bezeichnet hier das Eintreten oder Entstehen eines Zustands; „entsteht“ erhält diese verbale Dynamik.
- source_word: רִיב
  choice: Streit
  rationale: רִיב kann einen Rechtsstreit oder allgemeinen Streit bezeichnen. Im Parallelismus passt der breitere soziale Sinn.
- source_word: מָדוֹן
  choice: Zwietracht
  rationale: Das Wort bezeichnet Hader oder fortwirkenden Konflikt. „Zwietracht“ unterscheidet es leicht von רִיב und wahrt den Parallelismus.
- source_word: יִשָּׂא
  choice: erhebt sich
  rationale: Wörtlich liegt das Bild des Erhobenwerdens oder Sich-Erhebens vor; „erhebt sich“ bewahrt dieses Bild in natürlichem Deutsch.
theological_decisions:
- issue: Ob die Anfangsverben Gottes Verursachung oder lediglich seine Zulassung ausdrücken sollen
  choice: Die direkte Anrede und die kausative Aussage bleiben mit „lässt du mich … sehen“ erhalten; Gottes Zuschauen wird nicht erklärend abgeschwächt.
  alternative: „Warum zeigst du mir …?“ oder „Warum erlaubst du, dass ich … sehe, und duldest …?“
  rationale: Der hebräische Text formuliert eine unvermittelte Klage an Gott. Die Übersetzung bewahrt diese theologische Spannung und fügt keine Erklärung über Gottes Verhältnis zum Bösen ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Klage bleibt scharf und verständlich; der poetische Parallelismus wird durch „Streit“ und „Zwietracht“ sowie „entsteht“ und „erhebt sich“ gewahrt.
