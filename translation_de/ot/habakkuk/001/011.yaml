base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/011.yaml
  text: Then he sweeps by like the wind and passes on—he becomes guilty[b][a]; this strength of his is his god.
translation:
  language: de
  text: Dann fegt er wie der Wind[b] dahin und zieht weiter; er wird schuldig — seine Kraft ist sein Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird schuldig, indem er diese Kraft seinem Gott zuschreibt“; möglicherweise auch: „Seine Kraft gehört seinem Gott.“ Der hebräische Schlusssatz ist sehr knapp und lässt mehrere Deutungen zu.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch mit „Geist“ wiedergegeben werden; hier spricht der Zusammenhang für das Bild schneller, machtvoller Bewegung wie die des Windes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Zeitadverb leitet die nächste Phase der Schilderung ein; „Dann“ ist natürlich und prägnant.
- source_word: חָלַף
  choice: fegt er dahin
  rationale: Zusammen mit רוּחַ bezeichnet das Verb hier am ehesten eine rasche, gewaltsame Bewegung; „dahinfe­gen“ gibt die Wucht des Angreifers wieder.
- source_word: רוּחַ
  choice: wie der Wind
  rationale: רוּחַ kann „Wind“ oder „Geist“ bedeuten. Im Zusammenhang überwiegt das Bild schneller, unaufhaltsamer Bewegung; die Vergleichspartikel wird zum natürlichen deutschen Verständnis ergänzt.
- source_word: וַיַּעֲבֹר
  choice: und zieht weiter
  rationale: Die Form führt die Bewegungsfolge fort. „zieht weiter“ passt zum Vormarsch eines Heeres und klingt im Deutschen natürlich.
- source_word: וְאָשֵׁם
  choice: Doch er wird schuldig
  rationale: Das Verb bezeichnet das Schuldigwerden beziehungsweise das Auf-sich-Laden von Schuld. „Doch“ macht den inhaltlichen Umschlag zur Beurteilung deutlich, ohne die Aussage auszubauen.
- source_word: זוּ
  choice: diese / seine eigene
  rationale: Die knappe Hinweisform wird im gewählten Verständnis auf die zuvor geschilderte Kraft bezogen; idiomatisches Deutsch verlangt eine syntaktische Glättung.
- source_word: כֹחוֹ
  choice: seine eigene Kraft
  rationale: Gemeint ist die militärische Macht des Eroberers. „eigene“ verdeutlicht im gewählten Satzbau, dass er gerade seine Macht vergöttlicht.
- source_word: לֵאלֹהוֹ
  choice: ist sein Gott
  rationale: Die Lamed-Konstruktion ist mehrdeutig. Im Kontext lässt sie sich am plausibelsten so verstehen, dass der Eroberer seine eigene Kraft zum Gott erhebt.
theological_decisions:
- issue: Deutung der Schlusswendung זוּ כֹחוֹ לֵאלֹהוֹ
  choice: Der Eroberer wird schuldig, weil seine eigene Kraft für ihn Gott ist.
  alternative: 'Er wird schuldig, indem er diese Kraft seinem Gott zuschreibt; oder: Seine Kraft gehört seinem Gott.'
  rationale: Der hebräische Ausdruck ist äußerst knapp und syntaktisch mehrdeutig. Die gewählte Lesart verbindet die Schuldaussage schlüssig mit der prophetischen Kritik an selbstvergöttlichter militärischer Macht; plausible Alternativen werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren die gedrängte Wucht des Hebräischen. Die echte Mehrdeutigkeit der Schlusswendung wird im Haupttext sinnvoll wiedergegeben und in der Fußnote ausdrücklich offengehalten.
