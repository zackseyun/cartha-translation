  text: עַל כֵּן֙ תָּפ֣וּג תּוֹרָ֔ה וְ/לֹֽא יֵצֵ֥א לָ/נֶ֖צַח מִשְׁפָּ֑ט כִּ֤י רָשָׁע֙ מַכְתִּ֣יר אֶת הַ/צַּדִּ֔יק עַל כֵּ֛ן יֵצֵ֥א מִשְׁפָּ֖ט מְעֻקָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/004.yaml
  text: Therefore the law grows numb, and justice never goes forth. For the wicked surrounds the righteous; therefore justice goes forth twisted.
translation:
  language: de
  text: Darum verliert die Weisung[a] ihre Kraft, und Recht ergeht niemals. Denn der Frevler umzingelt den Gerechten; darum ergeht verdrehtes Recht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Gesetz.'
    reason: Die Alternative macht den geläufigen engeren Sinn von תּוֹרָה sichtbar, ohne ihn im Haupttext festzuschreiben.
lexical_decisions:
- source_word: תּוֹרָה (tôrāh)
  choice: Weisung
  rationale: Das Wort bezeichnet hier Gottes maßgebende Weisung beziehungsweise das Gesetz. „Weisung“ bewahrt den weiteren Bedeutungsumfang und klingt im Deutschen natürlich.
- source_word: תָּפוּג (tāfûg)
  choice: verliert … ihre Kraft
  rationale: Das Verb bezeichnet ein Erschlaffen oder Wirkungsloswerden. Die Formulierung gibt die bildhafte Aussage idiomatisch wieder, ohne sie auf bloße Nichtbeachtung zu verengen.
- source_word: מִשְׁפָּט (mišpāṭ)
  choice: Recht
  rationale: Der Begriff kann Recht, Rechtsprechung oder Urteil bezeichnen. „Recht“ passt an beiden Stellen und erhält die bewusste Wiederholung.
- source_word: מַכְתִּיר (maḵtîr)
  choice: umzingelt
  rationale: Die Kausativform der Wurzel כתר beschreibt hier ein Umschließen oder Umringen; „umzingelt“ bewahrt die Bedrohlichkeit des Bildes.
- source_word: מְעֻקָּל (məʿuqqāl)
  choice: verdreht
  rationale: Das Wort bedeutet gekrümmt oder verdreht und bezeichnet hier entstelltes, verfälschtes Recht.
theological_decisions:
- issue: Bedeutungsumfang von תּוֹרָה
  choice: „Weisung“ im Haupttext
  alternative: „Gesetz“
  rationale: Der Kontext spricht von der Wirkungslosigkeit verbindlicher göttlicher Ordnung, legt den Begriff aber nicht auf eine engere dogmatische Kategorie fest.
- issue: Verhältnis der beiden Aussagen über מִשְׁפָּט
  choice: Zuerst setzt sich das Recht nicht durch; anschließend kommt verdrehtes Recht zustande.
  alternative: Zuerst ergeht überhaupt kein Urteil; anschließend ergeht ein falsches Urteil.
  rationale: 'Die Wiedergabe erhält die Spannung des hebräischen Textes: Wahres Recht gelangt nicht zur Geltung, während eine entstellte Form von Recht hervorgebracht wird.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wiederholung von „Recht“ wird bewahrt; die Wendungen sind idiomatisch, ohne die juristische und moralische Spannung des hebräischen Textes aufzulösen.
