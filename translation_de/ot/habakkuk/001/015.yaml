source:
  edition: WLC
  text: כֻּלֹּ/ה֙ בְּ/חַכָּ֣ה הֵֽעֲלָ֔ה יְגֹרֵ֣/הוּ בְ/חֶרְמ֔/וֹ וְ/יַאַסְפֵ֖/הוּ בְּ/מִכְמַרְתּ֑/וֹ עַל כֵּ֖ן יִשְׂמַ֥ח וְ/יָגִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/015.yaml
  text: He brings all of them up with a hook[a]; he drags him away with his net, and gathers him in with his dragnet[b]. Therefore he rejoices and exults.
translation:
  language: de
  text: Er holt sie alle mit einem Haken herauf; er zieht ihn mit seinem Netz fort[a] und sammelt ihn in seinem Schleppnetz ein[b]. Darum freut er sich und jubelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wechselt das Bild von der Gesamtheit der Gefangenen zu einem im Singular bezeichneten Beutestück: wörtlich »ihn«.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Hier stehen zwei verschiedene hebräische Wörter für Fischernetze: »Netz« und »Schleppnetz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: sie alle
  rationale: Die grammatisch singularische Form bezeichnet hier kollektiv die zuvor als Fische dargestellten Menschen. »Sie alle« gibt diesen kollektiven Sinn im Deutschen natürlich wieder.
- source_word: בְּחַכָּה
  choice: mit einem Haken
  rationale: חַכָּה bezeichnet einen zum Fischfang verwendeten Haken. Die Wiedergabe bewahrt das Bild, ohne es unnötig zu spezifizieren.
- source_word: הֵעֲלָה
  choice: holt … herauf
  rationale: Der Hifil von עלה beschreibt, wie der Fang aus dem Wasser heraufgebracht wird; »heraufholen« ist im Deutschen idiomatisch.
- source_word: יְגֹרֵהוּ
  choice: er zieht ihn … heraus
  rationale: Das Verb bezeichnet hier das Ziehen beziehungsweise Herausholen der Beute. Das singularische Objektsuffix wird als »ihn« erhalten.
- source_word: בְחֶרְמוֹ
  choice: mit seinem Fangnetz
  rationale: חֵרֶם bezeichnet in diesem Zusammenhang ein Fischernetz. »Fangnetz« unterscheidet es verständlich vom folgenden Schleppnetz.
- source_word: וְיַאַסְפֵהוּ
  choice: und sammelt ihn … ein
  rationale: אָסַף bedeutet sammeln oder einbringen. »Einsammeln« passt zum Einholen des Fangs und erhält das singularische Objektsuffix.
- source_word: בְּמִכְמַרְתּוֹ
  choice: in seinem Schleppnetz
  rationale: מִכְמֶרֶת bezeichnet ein Fang- oder Schleppnetz. »Schleppnetz« hält die beiden verschiedenen hebräischen Netzbegriffe auseinander.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung kennzeichnet die Folge seines erfolgreichen Beutezugs knapp und natürlich.
- source_word: יִשְׂמַח וְיָגִיל
  choice: freut er sich und jubelt
  rationale: Die zwei Verben bezeichnen Freude und gesteigerte, jubelnde Freude; die deutsche Paarung erhält diese Intensivierung.
theological_decisions:
- issue: Bezug des Fischfangbildes
  choice: Das Bild beschreibt den Eroberer, der Menschen beziehungsweise Völker wie Fische fängt.
  alternative: Eine rein wörtliche Beschreibung des Fischfangs.
  rationale: Der unmittelbare Zusammenhang in Habakuk 1,14–17 verwendet das Fischfangmotiv für gewaltsame Eroberung. Die Übersetzung erhält das Bild, ohne es im Vers auszudeuten.
- issue: Wechsel vom Kollektiv zum Singular
  choice: Der Wechsel von »sie alle« zu »ihn« wird im Haupttext bewahrt.
  alternative: Durchgehend pluralisch »sie«, um die deutsche Kongruenz zu glätten.
  rationale: Die beiden hebräischen Verben tragen singularische maskuline Objektsuffixe. Die auffällige Bewegung von der kollektiven Gesamtheit zur einzelnen Beute soll nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem prophetischem Ton. Die konkrete Fischfangmetaphorik und der auffällige Numeruswechsel des Hebräischen bleiben erhalten.
