id: HAB.1.7
reference: Habakkuk 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/007.yaml
  text: It is dreadful and fearsome; its justice and authority[a] come from itself.
translation:
  language: de
  text: Es ist schrecklich und furchterregend; sein Recht und seine Hoheit[a] gehen von ihm selbst aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Autorität; auch: seine Würde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָיֹם
  choice: schrecklich
  rationale: Bezeichnet etwas, das Schrecken oder Grauen hervorruft. „Schrecklich“ passt zum bedrohlichen Auftreten des zuvor genannten Volkes.
- source_word: וְנוֹרָא
  choice: und furchterregend
  rationale: Verstärkt אָיֹם und bewahrt den Sinn von etwas, das Furcht einflößt.
- source_word: הוּא
  choice: es ist
  rationale: Das maskuline Singularpronomen verweist kollektiv auf das zuvor beschriebene Volk; im Deutschen ist bei dem gedachten Bezugswort „Volk“ das Neutrum natürlich.
- source_word: מִמֶּנּוּ
  choice: von ihm selbst
  rationale: Die Präposition bezeichnet den Ursprung. Die Formulierung betont, dass das Volk Recht und Hoheit aus sich selbst herleitet.
- source_word: מִשְׁפָּטוֹ
  choice: sein Recht
  rationale: מִשְׁפָּט kann Recht, Rechtsentscheidung oder Gericht bezeichnen. „Recht“ gibt hier knapp die selbstgesetzte Rechtsordnung beziehungsweise Rechtsausübung wieder.
- source_word: וּשְׂאֵתוֹ
  choice: seine Hoheit
  rationale: Das Substantiv bezeichnet Erhabenheit, hohen Rang oder daraus folgende Autorität. „Hoheit“ bewahrt diese Bedeutungsbreite; „Autorität“ wird als kontextuell mögliche Alternative vermerkt.
- source_word: יֵצֵא
  choice: gehen … aus
  rationale: Das Verb bezeichnet das Hervorgehen aus einer Quelle. Wegen der beiden verbundenen Subjekte verlangt natürliches Deutsch den Plural „gehen“.
theological_decisions:
- issue: Ursprung von Recht und Hoheit
  choice: „von ihm selbst“ als Aussage über die Selbstermächtigung des Volkes
  alternative: bloßes „von ihm“ ohne ausdrückliche Rückbezüglichkeit
  rationale: מִמֶּנּוּ bezeichnet hier den inneren Ursprung; „selbst“ macht die im Kontext wichtige Unabhängigkeit von einer höheren Instanz deutlich, ohne diese theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Einzahl des Hebräischen bleibt durch „es/ihm“ erhalten. „Hoheit“ wahrt die Mehrdeutigkeit zwischen erhöhtem Rang, Würde und herrschaftlicher Autorität.
