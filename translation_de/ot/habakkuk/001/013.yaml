  terminology: »Böses«, »Unrecht«, »Treulosen«, »Gottlose« und »verschlingt« sind im Kontext tragfähige Wiedergaben. Insbesondere vermeidet die Fassung eine dogmatisch überdehnte Aussage, Gott könne Böses nicht wahrnehmen, und erhält die relative Bedeutung von צַדִּיק מִמֶּנּוּ.
