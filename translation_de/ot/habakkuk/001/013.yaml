  source_fidelity: 'Die Übersetzung gibt die hebräische poetische Spannung und den Satzbau zuverlässig wieder: Gottes Augen sind »zu rein«, um Böses zu sehen; er kann auf עָמָל nicht blicken; dennoch wird sein Blick auf die בּוֹגְדִים und sein Schweigen beim Verschlingen des relativ Gerechteren beklagt. »einen, der gerechter ist als er« bewahrt den ausdrücklichen Vergleich und behauptet keine absolute Gerechtigkeit.'
