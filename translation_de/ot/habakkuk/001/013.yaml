id: HAB.1.13
reference: Habakkuk 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
translation:
  language: de
  text: Deine Augen sind zu rein, um Böses anzusehen[a], und Unrecht kannst du nicht mit ansehen[b]. Warum blickst du dann auf die Treulosen und schweigst, wenn der Gottlose einen verschlingt, der gerechter ist als er?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »zu rein an Augen, um Böses zu sehen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Unheil«, »Mühsal« oder »Bosheit«.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen steht ein Vergleich: Der Verschlungene ist gerechter als der Gottlose; damit wird nicht notwendigerweise absolute Schuldlosigkeit ausgesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְהוֹר עֵינַיִם מֵרְאוֹת רָע
  choice: Deine Augen sind zu rein, um Böses anzusehen
  rationale: Die hebräische Wendung lautet wörtlich etwa »rein an Augen, vom Sehen des Bösen«. Die deutsche Infinitivkonstruktion bewahrt das Bild und gibt die durch מִן ausgedrückte Unvereinbarkeit natürlich wieder, ohne zu behaupten, Gott nehme Böses überhaupt nicht wahr.
- source_word: וְהַבִּיט אֶל עָמָל לֹא תוּכָל
  choice: und Unrecht kannst du nicht mit ansehen
  rationale: עָמָל kann Unheil, Mühsal oder schuldhaftes Unrecht bezeichnen. Im Zusammenhang der Klage über gewaltsame Ungerechtigkeit steht der ethische Aspekt im Vordergrund. »Mit ansehen« gibt zugleich das anhaltende Hinblicken und die im Kontext mitschwingende Unvereinbarkeit wieder.
- source_word: לָמָּה תַבִּיט
  choice: Warum blickst du dann auf
  rationale: »Dann« macht den rhetorischen Gegensatz zur vorausgehenden Aussage deutlich, ohne ihn inhaltlich aufzulösen. »Auf … blicken« bleibt nahe beim Bild des hebräischen Verbs.
- source_word: בּוֹגְדִים
  choice: die Treulosen
  rationale: Das Partizip bezeichnet Menschen, die treulos, unzuverlässig oder verräterisch handeln. »Die Treulosen« ist knapp, verständlich und bewahrt die moralische Charakterisierung.
- source_word: תַּחֲרִישׁ
  choice: schweigst
  rationale: Das Verb bezeichnet hier das Stillsein beziehungsweise Nichtreden. Die knappe Wiedergabe erhält die Anklage der empfundenen göttlichen Untätigkeit, ohne diese weiter auszudeuten.
- source_word: בְּבַלַּע רָשָׁע
  choice: wenn der Gottlose … verschlingt
  rationale: Die Präposition mit dem Infinitiv bezeichnet den zeitlichen Begleitumstand. »Verschlingt« bewahrt das drastische Bild eines Raubtiers.
- source_word: צַדִּיק מִמֶּנּוּ
  choice: einen, der gerechter ist als er
  rationale: מִן kennzeichnet ausdrücklich einen Vergleich. Die Formulierung spricht daher von relativer Gerechtigkeit und erklärt den Betroffenen nicht für absolut schuldlos.
theological_decisions:
- issue: Gottes Verhältnis zum Bösen im ersten Versglied
  choice: Die Aussage wird als poetisch-rhetorische Behauptung über Gottes Reinheit und seine Unvereinbarkeit mit dem Bösen wiedergegeben.
  alternative: Eine streng wörtlich verstandene Formulierung könnte nahelegen, Gott könne Böses in keinerlei Sinn sehen; eine stärker deutende Übersetzung wäre »du kannst Unrecht nicht dulden«.
  rationale: Die folgende Frage stellt gerade Gottes augenscheinliches Hinblicken auf die Treulosen der Eingangsaussage gegenüber. Die Übersetzung bewahrt diese theologische Spannung, ohne sie als Aussage gegen Gottes Allwissenheit oder als ausdrückliche Aussage über sein Dulden aufzulösen.
- issue: Gerechtigkeit des vom Gottlosen Verschlungenen
  choice: Der Betroffene wird als gerechter als der Gottlose bezeichnet.
  alternative: Die substantivische Wiedergabe »der Gerechte« könnte als Behauptung vollkommener oder absoluter Gerechtigkeit verstanden werden.
  rationale: Der hebräische Vergleich צַדִּיק מִמֶּנּוּ ist relativ. Diese Nuance soll nicht zugunsten einer theologischen Verallgemeinerung eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität der beiden ersten Versglieder und das drastische Bild des Verschlingens bleiben erhalten. Die Formulierung ist verständlich, ohne die rhetorische Spannung der Klage zu glätten.
