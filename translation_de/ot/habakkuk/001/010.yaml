source:
  edition: WLC
  text: וְ/הוּא֙ בַּ/מְּלָכִ֣ים יִתְקַלָּ֔ס וְ/רֹזְנִ֖ים מִשְׂחָ֣ק ל֑/וֹ ה֚וּא לְ/כָל מִבְצָ֣ר יִשְׂחָ֔ק וַ/יִּצְבֹּ֥ר עָפָ֖ר וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/010.yaml
  text: He mocks kings[a], and rulers are a laughingstock to him. He laughs at every fortress; he heaps up earth and captures it.
translation:
  language: de
  text: Er verspottet Könige, und Machthaber sind für ihn ein Gespött. Über jede Festung lacht er; er häuft Erde an[a] und nimmt sie ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er häuft Staub/Erde an.“ Gemeint ist wahrscheinlich, dass Erde zu einer Belagerungsrampe aufgeschüttet wird, um den befestigten Ort einzunehmen.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתְקַלָּס
  choice: verspottet
  rationale: Der Hitpael bezeichnet hier verächtlichen Spott. „Verspottet“ gibt die aktive, herabsetzende Haltung knapp und natürlich wieder.
- source_word: רֹזְנִים
  choice: Machthaber
  rationale: Das Wort bezeichnet hochgestellte Herrscher oder Würdenträger. „Machthaber“ ist im modernen Deutsch verständlich und wahrt den politischen Sinn, ohne eine bestimmte Amts- oder Adelsform vorauszusetzen.
- source_word: מִשְׂחָק לוֹ
  choice: sind für ihn ein Gespött
  rationale: Die Wendung bezeichnet Personen als Gegenstand höhnischen Lachens. „Ein Gespött“ bewahrt die Verachtung und passt zum würdevollen Register.
- source_word: מִבְצָר
  choice: Festung
  rationale: Gemeint ist ein befestigter Ort. „Festung“ ist präzise, geläufig und lässt den militärischen Zusammenhang erkennen.
- source_word: יִשְׂחָק
  choice: lacht ... über
  rationale: Der Qal von שׂחק beschreibt hier höhnisches Lachen. Die Formulierung erhält das konkrete Bild und vermeidet eine unnötige Angleichung an „verspottet“ im ersten Satz.
- source_word: וַיִּצְבֹּר עָפָר
  choice: er häuft Erde an
  rationale: Die wörtliche Handlung ist das Anhäufen von Erde, im Zusammenhang wohl zum Bau einer Belagerungsrampe. Die Übersetzung erhält das Bild; die kulturelle Erklärung steht in der Fußnote.
- source_word: וַיִּלְכְּדָהּ
  choice: nimmt sie ein
  rationale: Das Verb bedeutet militärisch erobern oder einnehmen. Das feminine Pronomen bezieht sich auf die Festung; „nimmt sie ein“ ist im Deutschen idiomatisch.
- source_word: הוּא
  choice: Er
  rationale: Das Pronomen greift den im Zusammenhang als kollektive Einzelgestalt beschriebenen Angreifer auf. Das maskuline Singularpronomen bewahrt die hebräische Darstellung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Bildsprache. Die parallelen Ausdrücke des Spotts bleiben erkennbar, ohne im Deutschen steif zu wirken. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung „Erde anhäufen“.
