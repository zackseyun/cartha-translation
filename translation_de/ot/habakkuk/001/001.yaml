lexical_decisions:
- source_word: הַמַּשָׂא
  choice: der Ausspruch
  rationale: מַשָּׂא bezeichnet in prophetischen Überschriften eine gewichtige prophetische Botschaft, häufig mit Gerichtston. „Ausspruch“ ist im modernen Deutschen verständlich, wahrt den Charakter einer Verkündigung und legt weder ausschließlich Gericht noch eine subjektiv empfundene Last fest.
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen verbindet die Überschrift mit dem Verb und richtet sich im Deutschen nach dem maskulinen Akkusativ „Ausspruch“.
- source_word: חָזָה
  choice: schaute
  rationale: Das Verb bedeutet wörtlich „sehen/schauen“ und wird für prophetische Wahrnehmung gebraucht. „Schaute“ bewahrt diese Bildsprache sowie den Offenbarungscharakter, ohne die genaue Art der Vision näher festzulegen.
- source_word: חֲבַקּוּק
  choice: Habakuk
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Die Rollenbezeichnung wird ihrem Sinn entsprechend übersetzt und identifiziert Habakuk als Propheten.
theological_decisions:
- issue: Wiedergabe der prophetischen Überschrift מַשָּׂא
  choice: Ausspruch
  alternative: Last; Botschaft; Weissagung
  rationale: „Ausspruch“ kennzeichnet den Text als prophetische Mitteilung, ohne ihn vorschnell ausschließlich als Gerichtswort oder als persönliche Belastung Habakuks zu deuten. Die mögliche Konnotation einer gewichtigen „Last“ wird in der Fußnote erhalten.
translation_notes:
  register: Knappe, würdige Überschrift in modernem Standarddeutsch. „Schaute“ ist bewusst leicht gehoben und bewahrt die traditionelle prophetische Bildsprache des hebräischen Verbs.
