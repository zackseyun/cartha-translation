  text: The oracle that Habakkuk the prophet saw:[a]
translation:
  language: de
  text: Der Ausspruch, den der Prophet Habakuk schaute:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Last“ beziehungsweise „Botschaft“. Das hebräische Wort massāʾ bezeichnet als prophetische Überschrift eine gewichtige Botschaft.'
