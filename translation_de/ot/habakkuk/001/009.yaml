source:
  edition: WLC
  text: כֻּלֹּ/ה֙ לְ/חָמָ֣ס יָב֔וֹא מְגַמַּ֥ת פְּנֵי/הֶ֖ם קָדִ֑ימָ/ה וַ/יֶּאֱסֹ֥ף כַּ/ח֖וֹל שֶֽׁבִי׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/009.yaml
  text: All of them come for violence[a]; the set of their faces is forward[c][b], and they gather captives like sand.
translation:
  language: de
  text: Sie alle kommen, um Gewalt zu üben. Ihr Blick ist nach vorn gerichtet[a], und sie sammeln[b] Gefangene[c] wie Sand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Streben ist nach Osten gerichtet.“ Der hebräische Ausdruck ist schwierig: קָדִימָה kann „nach vorn“ oder „nach Osten“ bedeuten; מְגַמַּת kann die Ausrichtung, das Ziel oder das Streben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht das Verb in der Einzahl: „und er sammelt“. Dadurch wird die heranrückende Streitmacht als eine kollektive Einheit behandelt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Gefangenschaft“. Das hebräische שֶׁבִי kann sowohl Gefangene als auch den Zustand der Gefangenschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: Sie alle
  rationale: Die singularische Form bezeichnet im Zusammenhang kollektiv die gesamte heranrückende Streitmacht; im Deutschen gibt „sie alle“ diesen Sinn natürlich wieder.
- source_word: לְחָמָס
  choice: um Gewalt zu üben
  rationale: חָמָס bezeichnet gewaltsames Unrecht oder Brutalität. Die finale Wendung gibt die knappe Zweckrichtung von לְ idiomatisch wieder.
- source_word: יָבֹוא
  choice: kommen
  rationale: Die Grundbedeutung von בוא bleibt erhalten; der militärische Vormarsch ergibt sich aus dem Zusammenhang.
- source_word: מְגַמַּת פְּנֵיהֶם
  choice: Ihr Blick ist … gerichtet
  rationale: Das seltene מְגַמָּה kann Ausrichtung, Ziel oder Streben bezeichnen. „Ihr Blick ist gerichtet“ überträgt das hebräische Bild der Gesichter verständlich, ohne es rein psychologisch festzulegen.
- source_word: קָדִימָה
  choice: nach vorn
  rationale: Das Wort kann räumlich „ostwärts“ oder in einer Bewegungsrichtung „vorwärts/nach vorn“ bedeuten. Im Bild des unaufhaltsamen Vormarschs passt „nach vorn“, während die echte Alternative in der Fußnote erhalten bleibt.
- source_word: וַיֶּאֱסֹף
  choice: und sie sammeln
  rationale: Obwohl das hebräische Verb singularisch ist und die Streitmacht als kollektive Einheit behandelt, verlangt der deutsche Bezug auf „sie alle“ eine natürliche Pluralform.
- source_word: כַּחוֹל
  choice: wie Sand
  rationale: Die knappe Vergleichsform bezeichnet eine unübersehbare Menge und ist im Deutschen ebenso idiomatisch.
- source_word: שֶׁבִי
  choice: Gefangene
  rationale: שֶׁבִי kann sowohl den Zustand der Gefangenschaft als auch Gefangene bezeichnen. Als Objekt von „sammeln“ ist der personale Sinn im Zusammenhang am wahrscheinlichsten.
