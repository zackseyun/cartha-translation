id: HAB.1.12
reference: Habakkuk 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/ל֧וֹא אַתָּ֣ה מִ/קֶּ֗דֶם יְהוָ֧ה אֱלֹהַ֛/י קְדֹשִׁ֖/י לֹ֣א נָמ֑וּת יְהוָה֙ לְ/מִשְׁפָּ֣ט שַׂמְתּ֔/וֹ וְ/צ֖וּר לְ/הוֹכִ֥יחַ יְסַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/012.yaml
  text: Are you not from of old, O Yahweh my God, my Holy One? We will not die.[a] O Yahweh, you have appointed him for judgment, and you, O Rock, have established him for reproof.
translation:
  language: de
  text: Bist du nicht von alters her, Yahweh, mein Gott, mein Heiliger? Wir werden nicht sterben.[a] Yahweh, zum Gericht hast du ihn bestimmt, und du, Fels, hast ihn zur Zurechtweisung eingesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer abweichenden Lesart, die in einigen Überlieferungen bewahrt ist: »Du stirbst nicht.« Der hebräische masoretische Text lautet: »Wir werden nicht sterben.«'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹוא
  choice: Bist du nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: מִקֶּדֶם
  choice: von alters her
  rationale: Gibt die zeitliche Tiefe idiomatisch wieder, ohne die Wendung ausdrücklich zu einer metaphysischen Aussage über Ewigkeit auszuweiten.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Entspricht der ersten Person Singular mit Possessivsuffix und bewahrt die persönliche Anrede.
- source_word: קְדֹשִׁי
  choice: mein Heiliger
  rationale: Gibt das substantivierte Adjektiv mit Possessivsuffix als ehrfurchtsvollen Gottestitel wieder.
- source_word: לֹא נָמוּת
  choice: Wir werden nicht sterben
  rationale: Folgt der masoretischen Vokalisierung und der Form der ersten Person Plural; die traditionsgeschichtlich bezeugte Alternative wird in der Fußnote genannt.
- source_word: לְמִשְׁפָּט
  choice: zum Gericht
  rationale: Drückt den gerichtlichen Zweck der Einsetzung im Kontext knapp und natürlich aus.
- source_word: שַׂמְתּוֹ
  choice: hast du ihn bestimmt
  rationale: Vermittelt die zielgerichtete göttliche Bestimmung des babylonischen Werkzeugs.
- source_word: צוּר
  choice: Fels
  rationale: Bewahrt den bildhaften Gottestitel, der Beständigkeit und Stärke ausdrückt.
- source_word: לְהוֹכִיחַ
  choice: zur Zurechtweisung
  rationale: Erhält sowohl den tadelnden als auch den korrigierenden Sinn, ohne ihn auf bloße Bestrafung zu verengen.
- source_word: יְסַדְתּוֹ
  choice: hast du ihn eingesetzt
  rationale: Gibt im Zusammenhang das feste Einsetzen für einen bestimmten Zweck natürlich wieder.
theological_decisions:
- issue: Subjekt und Sinn von לֹא נָמוּת
  choice: Wir werden nicht sterben
  alternative: Du stirbst nicht
  rationale: Der masoretische Text bietet die erste Person Plural. Dadurch bleibt Habakuks Vertrauen bestehen, dass Gottes Volk im Gericht nicht völlig vernichtet wird. Die alternative Überlieferung, die Gottes Unsterblichkeit ausdrücklich anspricht, wird als echte textgeschichtliche Variante in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt prägnant; »von alters her« und der Gottestitel »Fels« bewahren den poetisch-prophetischen Ton. Der Marker [a] steht unmittelbar nach dem betreffenden Satz.
