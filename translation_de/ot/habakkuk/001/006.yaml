base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/006.yaml
  text: For behold[a], I am raising up the Chaldeans, that bitter and hasty nation[b], which marches through the broad places of the earth to seize dwelling places not its own.
translation:
  language: de
  text: 'Denn seht: Ich lasse die Chaldäer[a] aufstehen[b], dieses grimmige und ungestüme Volk, das durch die Weiten der Erde zieht, um Wohnstätten in Besitz zu nehmen, die ihm nicht gehören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylonier“. Im Hebräischen steht die historische Volksbezeichnung „Chaldäer“, die mit der neubabylonischen Macht verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich stachle sie auf.“ Das hebräische Verb kann das Hervorbringen bzw. Aufstehenlassen oder das Antreiben zum Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung bzw. Erklärung der vorausgehenden göttlichen Antwort ein.
- source_word: הִנְנִי
  choice: 'seht: Ich'
  rationale: Bewahrt den aufmerksamkeitslenkenden und nachdrücklichen Charakter der hebräischen Wendung in natürlichem, würdigem Deutsch.
- source_word: מֵקִים
  choice: lasse ... aufstehen
  rationale: Gibt den Hifil von קום und damit Gottes verursachendes Handeln wieder, ohne die genaue Art dieses Wirkens weiter festzulegen.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Bewahrt die genaue historische Volksbezeichnung; „Babylonier“ ist eine verständliche kontextuelle Entsprechung.
- source_word: הַגּוֹי הַמַּר וְהַנִּמְהָר
  choice: dieses erbitterte und ungestüme Volk
  rationale: „Erbittert“ erhält den Bezug zur Grundbedeutung „bitter“, klingt als Charakterisierung eines Volkes im Deutschen jedoch natürlicher; „ungestüm“ verbindet Schnelligkeit mit aggressiver Impulsivität.
- source_word: הַהוֹלֵךְ לְמֶרְחֲבֵי אֶרֶץ
  choice: das durch die Weiten der Erde zieht
  rationale: Gibt die fortdauernde Bewegung und die ausgedehnte territoriale Reichweite idiomatisch wieder, ohne das allgemeinere Verb militärisch zu überprägen.
- source_word: לָרֶשֶׁת
  choice: in Besitz zu nehmen
  rationale: Deckt die Bedeutung von ירשׁ als Besitzergreifung ab; der Eroberungskontext macht den gewaltsamen Charakter deutlich.
- source_word: מִשְׁכָּנוֹת לֹא לוֹ
  choice: Wohnstätten ..., die ihm nicht gehören
  rationale: Bewahrt den kollektiven Singular des Volkes und hebt die widerrechtliche Aneignung klar hervor.
theological_decisions:
- issue: Göttliches Handeln beim Aufstieg der Chaldäer
  choice: Ich lasse die Chaldäer aufstehen
  alternative: Ich stachle die Chaldäer auf
  rationale: Der hebräische Text schreibt ihr Auftreten ausdrücklich Gottes Wirken zu. Die gewählte Fassung erhält diese Spannung, ohne die Art der Verursachung über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ wahrt den prophetischen Nachdruck ohne das altertümliche „siehe“. Der Satz bleibt nah an der hebräischen Bild- und Gedankenführung.
