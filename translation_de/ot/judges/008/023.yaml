base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: de
  text: 'Doch Gideon sagte zu ihnen[a]: »Ich werde nicht über euch herrschen, und mein Sohn wird nicht über euch herrschen. Jahwe wird über euch herrschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und Gideon sagte zu ihnen.« Die hebräische Konjunktion kann als schlichtes erzählendes »und« wiedergegeben werden; »doch« hebt hier den Gegensatz zur Bitte des Volkes im vorherigen Vers hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das Waw setzt die Erzählung fort; im Zusammenhang weist Gideon jedoch die Bitte des Volkes aus dem vorigen Vers zurück. „Doch“ gibt diesen Gegensatz natürlich wieder.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Die Präposition mit Pronominalsuffix bezeichnet hier die Adressaten der Rede.
- source_word: גִּדְעוֹן
  choice: Gideon
  rationale: Der Personenname wird in der im Deutschen eingebürgerten biblischen Form wiedergegeben.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: Ich werde nicht über euch herrschen
  rationale: מָשַׁל bezeichnet das Ausüben von Herrschaft. Das ausdrückliche אֲנִי wird durch das vorangestellte „Ich“ angemessen repräsentiert, ohne eine zusätzliche Verstärkung einzutragen.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: und auch mein Sohn wird nicht über euch herrschen
  rationale: Die Formulierung bewahrt die parallele Verneinung und macht natürlich verständlich, dass auch eine dynastische Nachfolge abgelehnt wird, ohne diese Deutung ausdrücklich in den Text einzufügen.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Der Singular mit Suffix der ersten Person wird direkt wiedergegeben; eine Verallgemeinerung zu „Nachkommen“ würde über den Wortlaut hinausgehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der gebräuchlichen deutschen Transkription wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: Jahwe wird über euch herrschen
  rationale: Die Wiederholung von מָשַׁל wird mit demselben deutschen Verb bewahrt und erhält so den ausdrücklichen Kontrast zwischen Gideon, seinem Sohn und Jahwe.
theological_decisions:
- issue: Gideons Ablehnung menschlicher und dynastischer Herrschaft
  choice: Gideon lehnt die Herrschaft für sich und seinen Sohn ab und stellt dem Jahwes Herrschaft gegenüber.
  alternative: Gideon lehnt nur den formalen Königstitel ab, übt aber faktisch weiterhin königliche Herrschaft aus.
  rationale: Der Vers verwendet wiederholt מָשַׁל („herrschen“) und keinen eigenen Ausdruck für „König sein“. Deshalb bleibt die Übersetzung bei der Aussage über Herrschaft und entscheidet die weitergehende politische Spannung nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederaufnahme von „über euch herrschen“ bewahrt die rhetorische Struktur und den theologischen Kontrast des Hebräischen.
