base_translation:
  language: en
  yaml_path: translation/ot/judges/008/029.yaml
  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: de
  text: Jerubbaal, der Sohn des Joasch, ging und wohnte in seinem Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ sich in seinem Haus nieder“ oder „nahm in seinem Haus Wohnsitz“. Das hebräische Verb kann wohnen, bleiben oder sich niederlassen bezeichnen, nicht nur körperliches Sitzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging weg
  rationale: הלך bezeichnet hier in der fortlaufenden Erzählung das Weggehen. „Kehrte zurück“ würde eine Rückkehr ausdrücklich machen, die zwar im Zusammenhang naheliegen kann, aber nicht im Verb selbst steht.
- source_word: יְרֻבַּעַל
  choice: Jerubbaal
  rationale: Der hebräische Text verwendet hier ausdrücklich den Namen Jerubbaal; er wird daher nicht durch den bekannteren Alternativnamen Gideon ersetzt.
- source_word: בֶּן יוֹאָשׁ
  choice: der Sohn des Joasch
  rationale: Dies gibt die gewöhnliche hebräische Abstammungsangabe direkt und in natürlichem Deutsch wieder.
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: ישב kann sitzen, bleiben, wohnen oder sich niederlassen bedeuten. Zusammen mit „in seinem Haus“ bezeichnet es hier am natürlichsten das Wohnen.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Die Präposition ב mit „Haus“ und dem Suffix der 3. Person Singular wird wörtlich und zugleich verständlich als „in seinem Haus“ wiedergegeben.
- source_word: וַ...וַ
  choice: ging weg und wohnte
  rationale: Die beiden aufeinanderfolgenden Verbformen führen die Erzählung weiter. Die deutsche Verbindung mit „und“ bildet diese Abfolge flüssig ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namensform Jerubbaal und die konkrete Wendung „in seinem Haus“ bleiben erhalten; die mögliche Bedeutungsbreite von ישב wird in der Fußnote sichtbar gemacht.
