  text: וַ/יֹּ֨אמֶר֙ לְ/אַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָ/עָ֖ם אֲשֶׁ֣ר בְּ/רַגְלָ֑/י כִּי עֲיֵפִ֣ים הֵ֔ם וְ/אָנֹכִ֗י רֹדֵ֛ף אַחֲרֵ֛י זֶ֥בַח וְ/צַלְמֻנָּ֖ע מַלְכֵ֥י מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: de
  text: 'Und er sagte zu den Männern von Sukkot: „Gebt doch den Leuten, die mir folgen,[a] einige Brotlaibe; denn sie sind erschöpft. Ich aber verfolge Sebach und Zalmunna, die Könige von Midian.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die an meinen Füßen sind“; gemeint sind diejenigen, die ihn begleiten oder ihm folgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: zu den Männern von Sukkot
  rationale: אַנְשֵׁי bezeichnet hier die Männer der Stadt, wahrscheinlich ihre männlichen Vertreter; die Wiedergabe bewahrt die maskuline Form.
- source_word: תְּנוּ נָא
  choice: Gebt doch
  rationale: Der Imperativ mit נָא drückt eine höfliche oder dringliche Bitte aus. „Gebt doch“ klingt im modernen Deutschen natürlich und wahrt den bittenden Ton.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: einige Brotlaibe
  rationale: כִּכָּר bezeichnet hier einen Laib beziehungsweise einen runden Brotfladen. „Brotlaibe“ gibt den konkreten Plural natürlich wieder; „einige“ ist im Deutschen zur idiomatischen Kennzeichnung der unbestimmten Menge ergänzt.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: den Leuten, die mir folgen
  rationale: Wörtlich stehen die Leute „an meinen Füßen“; die hebräische Wendung bezeichnet diejenigen, die Gideon begleiten beziehungsweise ihm folgen. Die Hauptübersetzung gibt die idiomatische Bedeutung wieder, die Fußnote bewahrt das konkrete Bild.
- source_word: עֲיֵפִים
  choice: erschöpft
  rationale: Das Adjektiv bezeichnet durch Anstrengung ermüdete Menschen. „Erschöpft“ ist im Kontext der fortgesetzten Verfolgung klar und natürlich, ohne zwingend körperlichen Zusammenbruch auszudrücken.
- source_word: רֹדֵף אַחֲרֵי
  choice: verfolge
  rationale: Das Partizip bezeichnet die andauernde Verfolgung; im Deutschen bringt das Präsens nach „ich“ diesen fortlaufenden Vorgang natürlich zum Ausdruck.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Sebach und Zalmunna
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: מַלְכֵי מִדְיָן
  choice: die Könige von Midian
  rationale: Die Status-constructus-Verbindung wird direkt und würdevoll als „die Könige von Midian“ wiedergegeben.
