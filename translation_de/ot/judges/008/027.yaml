base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: de
  text: Gideon machte daraus einen Ephod[a] und stellte ihn in seiner Stadt, in Ofra, auf. Und ganz Israel ging ihm dort in kultischer Untreue nach[b], und er wurde Gideon und seinem Haus zum Fallstrick.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein »Ephod« war ein kultischer Gegenstand, der mit priesterlichem Gebrauch verbunden war. Welche Gestalt oder genaue Funktion er hier hatte, sagt der Text nicht eindeutig.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich verwendet das Hebräische eine Metapher aus dem Bereich der Prostitution: Israel »prostituierte sich ihm nach«. Sie beschreibt hier kultische Untreue gegenüber dem Ephod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: zu einem Ephod
  rationale: Die Präposition לְ bei עשה bezeichnet hier am besten das Ergebnis der Herstellung. אֵפוֹד wird als »Ephod« wiedergegeben, ohne seine im Kontext nicht näher bestimmte Gestalt oder Funktion festzulegen.
- source_word: וַיַּצֵּג
  choice: stellte ihn ... auf
  rationale: Die Verbform bezeichnet das Aufstellen oder feste Platzieren eines Gegenstands und passt zur öffentlichen beziehungsweise kultischen Installation.
- source_word: בְעִירוֹ בְעָפְרָה
  choice: in seiner Stadt Ofra
  rationale: עִיר wird formal als »Stadt« wiedergegeben; Ofra steht als nähere Ortsbestimmung dazu.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: prostituierte sich ..., indem es ihm nachlief
  rationale: Die Wiedergabe bewahrt sowohl die starke sexuelle Metapher von זנה als auch die mit אַחֲרֵי ausgedrückte Hinwendung zu dem Ephod. Der Singular »es« nimmt das Kollektiv »ganz Israel« auf.
- source_word: שָׁם
  choice: dort
  rationale: Die Ortsangabe bleibt erhalten und bezieht Israels Abfall ausdrücklich auf Ofra.
- source_word: לְמוֹקֵשׁ
  choice: zur Falle
  rationale: מוֹקֵשׁ bezeichnet wörtlich eine Fangvorrichtung und metaphorisch etwas, das zu Schuld oder Verderben führt. »Falle« bewahrt dieses Bild in natürlichem Deutsch.
- source_word: וּלְבֵיתוֹ
  choice: seinem Haus
  rationale: »Haus« bewahrt die Bedeutungsbreite von בַּיִת, das hier Gideons Familie, Haushalt oder Geschlecht umfassen kann.
theological_decisions:
- issue: Metapher für Israels götzendienerische Hinwendung zum Ephod
  choice: Die sexuelle Untreue-Metapher wird mit »prostituierte sich« ausdrücklich bewahrt.
  alternative: »wurde ihm untreu« oder »verfiel ihm«
  rationale: זנה beschreibt Israels kultische Untreue mit bewusst starker sexueller Bildsprache. Eine allgemeinere Formulierung würde die theologische Schärfe des hebräischen Textes abschwächen.
- issue: Art und Funktion von Gideons Ephod
  choice: Der Gegenstand wird schlicht »Ephod« genannt.
  alternative: »Priestergewand«, »Götzenbild« oder »Orakelgegenstand«
  rationale: Der Vers bestimmt weder Gestalt noch genaue Funktion des Ephods eindeutig. Die Transliteration wahrt diese historische und theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich starke Formulierung »prostituierte sich« ist wegen der ausdrücklichen hebräischen Bildsprache beibehalten und durch eine Fußnote erläutert. »Ephod« und »Haus« bewahren die sachliche beziehungsweise semantische Offenheit des Ausgangstextes.
