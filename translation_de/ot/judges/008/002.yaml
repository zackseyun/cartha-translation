source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: „Was habe ich denn jetzt im Vergleich zu euch getan? Ist nicht die Nachlese[a] Ephraims besser als die Weinlese Abiesers?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: die nach der eigentlichen Weinlese zurückgebliebenen Trauben.'
    reason: Das Bild der „Nachlese“ kann heutigen Lesern ohne landwirtschaftlichen Hintergrund unklar sein; die Anmerkung erläutert den konkreten Sinn, ohne die Metapher im Haupttext aufzulösen.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Er aber sagte zu ihnen
  rationale: Das Narrativ-Waw führt die Handlung fort; „aber“ gibt zugleich den Gegensatz zwischen dem Vorwurf der Ephraimiten und Gideons beschwichtigender Antwort natürlich wieder.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: Was habe ich denn im Vergleich zu euch getan?
  rationale: כָּכֶם bezeichnet hier den Vergleich. Das idiomatische „denn“ gibt die diskursive Funktion von עַתָּה wieder, ohne es unnatürlich mit einem rein zeitlichen „jetzt“ zu überladen.
- source_word: הֲלוֹא טוֹב
  choice: Ist nicht … besser als
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet; טוֹב erhält durch die Vergleichskonstruktion mit מִן komparative Bedeutung.
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: die Nachlese Ephraims
  rationale: עֹלְלוֹת bezeichnet die nach der eigentlichen Ernte zurückgebliebenen und später gesammelten Trauben. „Nachlese“ bewahrt das Weinbergsbild und den pointierten Gegensatz zur Haupternte.
- source_word: מִבְצִיר אֲבִיעֶזֶר
  choice: als die Weinlese Abiesers
  rationale: בָּצִיר bezeichnet die Trauben- beziehungsweise Weinlese; das vorangestellte מִן markiert den Vergleich. „Abieser“ ist die im Deutschen übliche Namensform des Clans Gideons.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Selbstzurücknahme Gideons und das Weinbergsbild des Hebräischen bleiben erhalten; „denn“ macht die Frage natürlich, ohne ihre Aussage zu verstärken.
