source:
  edition: WLC
  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: de
  text: Und sie erwiesen dem Haus Jerubbaals, also Gideons, keine Güte, entsprechend all dem Guten, das er Israel erwiesen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: Güte
  rationale: Bezeichnet hier loyale, dankbare Zuwendung gegenüber Gideons Familie; „Güte erweisen“ bewahrt den ethischen und beziehungsbezogenen Gehalt.
- source_word: בֵּית
  choice: Haus
  rationale: „Haus“ steht wie im Hebräischen für die Familie beziehungsweise Nachkommenschaft Gideons und erhält zugleich die biblische Ausdrucksweise.
- source_word: כְּכָל הַטּוֹבָה
  choice: trotz all des Guten
  rationale: Das כ kann einen Maßstab beziehungsweise eine Entsprechung ausdrücken; im negierten Satz gibt „trotz“ den kontrastiven Sinn im natürlichen Deutschen wieder, ohne die Aussage inhaltlich zu erweitern.
- source_word: עָשָׂה עִם יִשְׂרָאֵל
  choice: das er für Israel getan hatte
  rationale: Das idiomatische עשה עם bezeichnet hier das Wohltun an Israel; „für“ ist im Deutschen natürlicher als das wörtliche „mit“.
theological_decisions:
- issue: Verhältnis der Namen Jerubbaal und Gideon
  choice: „Jerubbaals, also Gideons“ als Identifizierung derselben Person
  alternative: „Jerubbaal-Gideons“ oder eine Fußnote zur Namensgleichheit
  rationale: Die Apposition גִּדְעוֹן identifiziert Jerubbaal unmittelbar als Gideon; die Übersetzung macht dies verständlich, ohne eine zusätzliche Deutung einzuführen.
- issue: Bedeutung von חֶסֶד gegenüber Gideons Haus
  choice: allgemein als „Güte“ wiedergegeben
  alternative: „Bundestreue“, „Loyalität“ oder „Dankbarkeit“
  rationale: Der Kontext umfasst Loyalität und Dankbarkeit, legt aber keinen ausdrücklich theologischen Bundesbegriff fest. „Güte“ bewahrt die semantische Breite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „dem Haus … Güte erweisen“ bewahrt den biblischen Familienbegriff, während „also Gideons“ die hebräische Apposition klar und ohne Fußnote wiedergibt.
