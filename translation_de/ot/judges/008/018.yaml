translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp. Der Ortsname „Tabor“ wird nicht im Haupttext zu „Berg Tabor“ erweitert, da das hebräische Original lediglich den Eigennamen nennt. Die englischen Fußnotenmarker scheinen gegenüber ihrem Inhalt vertauscht zu sein; die deutsche Fußnote folgt deshalb der tatsächlichen sprachlichen Schwierigkeit des hebräischen Vergleichssatzes.
