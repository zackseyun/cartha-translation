base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: de
  text: 'Dann sagte er zu Sebach und Zalmunna: „Wo sind die Männer, die ihr auf dem Tabor getötet habt?“ Sie antworteten: „Sie waren wie du; jeder hatte das Aussehen eines Königssohns.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Wie du, so sie; jeder wie die Gestalt von Königssöhnen.“ Der hebräische Vergleichssatz ist elliptisch; gemeint ist, dass jeder von ihnen die Erscheinung eines Königssohns hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה הָאֲנָשִׁים
  choice: Wo sind die Männer
  rationale: Die Fragepartikel bezeichnet den Ort; die im Hebräischen ausgelassene Kopula wird im Deutschen natürlich mit „sind“ ergänzt. אֲנָשִׁים meint hier die identifizierbaren männlichen Opfer.
- source_word: הֲרַגְתֶּם
  choice: die ihr … getötet habt
  rationale: „Töten“ gibt den Grundsinn wieder, ohne wie „ermorden“ bereits eine rechtliche Bewertung einzutragen.
- source_word: בְּתָבוֹר
  choice: am Tabor
  rationale: Die Präposition ב bezeichnet hier den Ort des Geschehens. „Am Tabor“ ist im Deutschen idiomatisch und lässt den Eigennamen unaufgelöst.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: Sie waren wie du
  rationale: Die knappe, elliptische Vergleichsformel wird verständlich wiedergegeben, ohne mehr als die erkennbare Ähnlichkeit mit Gideon auszusagen.
- source_word: אֶחָד
  choice: jeder
  rationale: אֶחָד wird im Zusammenhang distributiv gebraucht und bezieht sich auf jeden einzelnen der getöteten Männer.
- source_word: כְּתֹאַר בְּנֵי הַמֶּלֶךְ
  choice: sah aus wie ein Königssohn
  rationale: תֹאַר bezeichnet Gestalt oder äußeres Erscheinungsbild. Die singularische Formulierung entspricht dem distributiven „jeder“; „Königssohn“ bewahrt das hebräische Bild, statt es deutend mit „Prinz“ zu ersetzen.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: Dann sagte er … Sie antworteten
  rationale: Die Erzählfolge wird mit „Dann“ natürlich markiert. Im zweiten Satz ist „antworteten“ im Deutschen idiomatischer und entspricht der klaren Gesprächsfunktion des allgemeinen Verbs „sagen“.
