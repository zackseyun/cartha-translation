  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: de
  text: Gideon kam an den Jordan und überquerte ihn mit den dreihundert Männern, die bei ihm waren. Sie waren erschöpft und setzten die Verfolgung fort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »erschöpft und verfolgend«. Die hebräische Verbindung kann die Aussagen schlicht aneinanderreihen oder den Gegensatz ausdrücken: Sie waren erschöpft, verfolgten aber weiter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier die Bewegung zum genannten Ziel; »kam« gibt die fortlaufende Erzählbewegung knapp und natürlich wieder.
- source_word: הַיַּרְדֵּנָה
  choice: an den Jordan
  rationale: Das Richtungs-ה kennzeichnet die Bewegung zum Jordan hin. Im Deutschen ist »an den Jordan« idiomatischer als das wörtlichere »zum Jordan«.
- source_word: עֹבֵר הוּא
  choice: und setzte über, er
  rationale: Das Partizip mit dem ausdrücklichen Pronomen schildert Gideon als den Übersetzenden und leitet zur Einbeziehung seiner Männer über. »Setzte über« ist bei einer Flussüberquerung natürlich und bewahrt die hervorgehobene Nennung Gideons.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: er und die dreihundert Männer, die bei ihm waren
  rationale: Die Formulierung gibt Gideon und seine militärische Begleitung ausdrücklich als gemeinsam Handelnde wieder; »Männer« entspricht dem konkreten militärischen Zusammenhang.
- source_word: עֲיֵפִים
  choice: erschöpft
  rationale: Das Wort bezeichnet körperliche Ermüdung; »erschöpft« ist im heutigen Deutsch klar und kräftig, ohne völlige Handlungsunfähigkeit zu behaupten.
- source_word: וְרֹדְפִים
  choice: setzten die Verfolgung aber fort
  rationale: Das Partizip bezeichnet die andauernde Verfolgung. Die deutsche Formulierung macht den Fortgang trotz Erschöpfung verständlich; der adversative Sinn des ו wird wegen seiner möglichen schlichteren Bedeutung in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der erste Satz hält die hervorgehobene Folge »er und die dreihundert Männer« nahe am Hebräischen; der zweite Satz löst die gedrängten Partizipien für gutes heutiges Deutsch auf. Die Fußnote bewahrt die Mehrdeutigkeit der Verbindung zwischen Erschöpfung und fortgesetzter Verfolgung.
