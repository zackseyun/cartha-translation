base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: de
  text: 'Er nahm einen jungen Mann unter den Männern von Sukkot gefangen und befragte ihn. Dieser schrieb ihm die Namen der Obersten von Sukkot und ihrer Ältesten auf: siebenundsiebzig Männer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: nahm … gefangen
  rationale: לכד bezeichnet hier das Ergreifen beziehungsweise Gefangennehmen einer Person und passt zum militärischen Erzählzusammenhang.
- source_word: נַעַר
  choice: einen jungen Mann
  rationale: נַעַר kann einen Jungen, Jugendlichen, jungen Mann oder Diener bezeichnen. Da die Person zu den Männern Sukkots gehört und Auskunft über die städtische Führung geben kann, ist „junger Mann“ am wenigsten einengend.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: aus Sukkot
  rationale: Wörtlich ist der junge Mann „von/aus den Männern Sukkots“. Natürliches Deutsch kann seine Zugehörigkeit zur Stadt knapp mit „aus Sukkot“ ausdrücken.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: befragte ihn
  rationale: שׁאל bedeutet fragen oder sich erkundigen. „Befragen“ gibt die gezielte Auskunftssuche wieder, ohne die stärkeren modernen Nebenbedeutungen von „verhören“ einzutragen.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: Der schrieb ihm … auf
  rationale: Der junge Gefangene ist im Hebräischen das naheliegende Subjekt des Schreibens; אֵלָיו bezeichnet Gideon als Empfänger. Die Subjektwiederaufnahme „Der“ macht den Wechsel im Deutschen klar.
- source_word: שָׂרֵי סֻכּוֹת
  choice: die führenden Männer … von Sukkot
  rationale: שׂרים kann Amtsträger, Oberste oder führende Männer bezeichnen. Die gewählte Form ist im städtischen Kontext natürlich und vermeidet das moderne Missverständnis erblicher „Fürsten“.
- source_word: זְקֵנֶיהָ
  choice: die Ältesten von Sukkot
  rationale: Die Ältesten sind anerkannte leitende Männer der Stadt. Die Wiederholung des Ortsnamens ist im Deutschen klarer als ein sachliches Possessivpronomen.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: siebenundsiebzig Männer
  rationale: Die hebräische Zahl ist eindeutig 77; „Männer“ gibt das ausdrückliche אִישׁ wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Text macht den Subjektwechsel zum jungen Mann deutlich, ohne zusätzliche Namen einzuführen. Die mögliche Reichweite der Zahl 77 wird in einer Fußnote offengehalten.
