revisions:
- from: 'Er nahm einen jungen Mann aus Sukkot gefangen und befragte ihn. Der schrieb ihm die Namen der führenden Männer und der Ältesten von Sukkot auf: siebenundsiebzig Männer.[a]'
  to: 'Er nahm einen jungen Mann unter den Männern von Sukkot gefangen und befragte ihn. Dieser schrieb ihm die Namen der Obersten von Sukkot und ihrer Ältesten auf: siebenundsiebzig Männer.'
  rationale: Die unbegründete Fußnote zur Reichweite der Zahl wird entfernt. Die Revision bewahrt die Auswahl aus den Männern Sukkots genauer, markiert den Subjektwechsel klar und gibt die schriftliche Liste idiomatisch als Namensliste wieder. Die 77 Männer beziehen sich ohne zusätzliche Einschränkung auf die zuvor gemeinsam genannten Obersten und Ältesten.
