base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: de
  text: Von dort zog er hinauf nach Pnuël[a] und sprach ebenso zu ihnen.[b] Die Männer von Pnuël antworteten ihm genauso, wie die Männer von Sukkot geantwortet hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ort wird an anderen Stellen auch Pniël genannt.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „und sprach so zu ihnen“. Das Hebräische verweist auf die Bitte beziehungsweise Rede im vorhergehenden Vers zurück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: Von dort zog er hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „zog ... hinauf“ bewahrt diese Richtungsangabe und passt natürlich zu Gideons Weiterreise.
- source_word: פְּנוּאֵל
  choice: Pnuël
  rationale: Die Form gibt den Ortsnamen dieses Verses im Deutschen knapp und quellennah wieder.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: und sprach ebenso zu ihnen
  rationale: כָזֹאת bedeutet wörtlich „so/auf diese Weise“ und verweist hier zurück auf Gideons im vorigen Vers berichtete Bitte, ohne deren Wortlaut erneut auszuführen.
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: antworteten ihm
  rationale: ענה mit Personenobjekt bedeutet hier schlicht „jemandem antworten“.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: die Männer von Pnuël
  rationale: אַנְשֵׁי ist ausdrücklich die maskuline soziale Bezeichnung „Männer von“; eine Neutralisierung zu „Leute“ wäre weniger genau.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: genauso, wie die Männer von Sukkot geantwortet hatten
  rationale: כַּאֲשֶׁר stellt den Vergleich her. Das Plusquamperfekt macht im Deutschen deutlich, dass die Antwort der Männer von Sukkot bereits zuvor erfolgt war.
- source_word: סֻכּוֹת
  choice: Sukkot
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Ortsnamens.
theological_decisions: []
