source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ אִֽישׁ יִשְׂרָאֵל֙ אֶל גִּדְע֔וֹן מְשָׁל בָּ֨/נוּ֙ גַּם אַתָּ֔ה גַּם בִּנְ/ךָ֖ גַּ֣ם בֶּן בְּנֶ֑/ךָ כִּ֥י הוֹשַׁעְתָּ֖/נוּ מִ/יַּ֥ד מִדְיָֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: de
  text: 'Da sagten die Männer Israels zu Gideon: »Herrsche über uns – du, dein Sohn und auch der Sohn deines Sohnes[a] –, denn du hast uns aus der Hand Midians gerettet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Sohn deines Sohnes«; das Hebräische nennt die aufeinanderfolgenden Generationen ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Das formal singularische אִישׁ wird mit dem Pluralverb kollektiv gebraucht. „Die Männer Israels“ bewahrt sowohl den kollektiven als auch den geschlechtsspezifischen Ausdruck.
- source_word: מְשָׁל בָּנוּ
  choice: Herrsche über uns
  rationale: משׁל bezeichnet hier politische Herrschaft. „Herrsche“ ist unmittelbar und lässt die Art der Herrschaft so offen wie der hebräische Ausdruck.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: du, dein Sohn und auch der Sohn deines Sohnes
  rationale: Die wiederholte Partikel גַּם hebt die aufeinanderfolgenden Generationen hervor. Die wörtliche Wendung bewahrt die ausdrücklich genannte Abstammungsfolge.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für die Aufforderung ein; „denn“ ist im Deutschen klar und würdig.
- source_word: הוֹשַׁעְתָּנוּ
  choice: du hast uns ... gerettet
  rationale: Die Form von ישׁע bezeichnet Rettung beziehungsweise Befreiung. „Gerettet“ wahrt die breitere biblische Wortbedeutung, ohne den militärischen Zusammenhang zu verdecken.
- source_word: מִיַּד מִדְיָן
  choice: aus der Hand Midians
  rationale: Das hebräische Bild der Hand bezeichnet Macht oder Gewalt. Es ist auch im Deutschen verständlich und bewahrt die Bildsprache des Ausgangstextes.
theological_decisions:
- issue: Art der Gideon angebotenen Herrschaft
  choice: Die Aufforderung wird als Angebot einer generationenübergreifenden, erblichen Herrschaft wiedergegeben.
  alternative: Eine allgemeinere Bitte um Führung ohne dynastische Bedeutung.
  rationale: Der Imperativ von משׁל und die ausdrückliche Folge „du ... dein Sohn ... der Sohn deines Sohnes“ weisen auf fortdauernde Herrschaft innerhalb der Familie. Der Text wird jedoch nicht mit einem hier nicht verwendeten Königstitel ergänzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Hand-Metapher und die ausdrückliche Generationenfolge bleiben erhalten.
