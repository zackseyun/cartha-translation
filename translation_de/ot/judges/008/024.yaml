base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: de
  text: 'Da sagte Gideon zu ihnen: »Ich möchte euch um etwas bitten: Jeder soll mir einen Ohrring aus seiner Beute geben.« Denn sie hatten goldene Ohrringe, weil sie Ismaeliter waren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: Ich möchte euch um etwas bitten
  rationale: Gibt die idiomatische Verstärkung des hebräischen Verbs mit zugehörigem Substantiv in natürlichem, würdevollem Deutsch wieder.
- source_word: אִישׁ
  choice: Jeder
  rationale: Bezeichnet hier distributiv jeden einzelnen Mann aus der angesprochenen Gruppe; im Deutschen ist »jeder« in diesem Zusammenhang klar und natürlich.
- source_word: נֶזֶם
  choice: Ohrring
  rationale: Der Kontext nennt goldenen Schmuck der besiegten Ismaeliter; »Ohrring« entspricht der wahrscheinlichen Bedeutung und dem unmittelbaren Zusammenhang.
- source_word: שְׁלָלוֹ
  choice: seiner Beute
  rationale: Bewahrt den individuellen Possessivbezug des hebräischen Textes.
- source_word: יִשְׁמְעֵאלִים
  choice: Ismaeliter
  rationale: Etablierter deutscher Volksname für die im hebräischen Text bezeichnete Gruppe.
theological_decisions:
- issue: Begründung für den Goldschmuck
  choice: weil sie Ismaeliter waren
  alternative: denn sie waren Ismaeliter
  rationale: Bewahrt die ausdrückliche kausale Verknüpfung des hebräischen כִּי, ohne zusätzliche historische oder ethnische Erklärung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit natürlicher direkter Rede und würdigem Erzählton. Die Formulierung bleibt nahe am hebräischen Sinn, vermeidet aber eine im Deutschen schwerfällige Nachbildung der figura etymologica.
