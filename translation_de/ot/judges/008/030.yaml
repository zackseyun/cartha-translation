  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: de
  text: Gideon hatte siebzig leibliche Söhne[a], denn er hatte viele Ehefrauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die aus seiner Hüfte (oder: Lende) hervorgingen“; eine hebräische Redewendung für seine leiblichen Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: Gideon hatte
  rationale: Die Verbindung aus היה und ל drückt Besitz aus. Das Deutsche gibt sie natürlich mit „Gideon hatte“ wieder; das vorangestellte ו dient hier als Erzählverknüpfung und muss nicht eigens mit „und“ übersetzt werden.
- source_word: שִׁבְעִים בָּנִים
  choice: siebzig Söhne
  rationale: בָּנִים bezeichnet hier ausdrücklich Söhne, nicht allgemein Kinder.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: die von ihm selbst abstammten
  rationale: Die wörtliche Wendung „die aus seiner Hüfte/Lende hervorgingen“ ist ein hebräisches Idiom für leibliche Nachkommen. Die gewählte Formulierung gibt den Sinn in natürlichem modernem Deutsch wieder; die Bildsprache wird in der Fußnote bewahrt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die große Zahl der Söhne ein. „Denn“ verbindet die Sätze im Deutschen klar und würdevoll.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: er hatte viele Frauen
  rationale: Im Zusammenhang bezeichnet נָשִׁים die Frauen Gideons im ehelichen Sinn. Die übliche deutsche Wendung „viele Frauen haben“ bewahrt diesen Sinn, ohne unnötig technisch zu klingen.
theological_decisions:
- issue: Beschreibung eines polygynen Haushalts
  choice: Die familiäre Situation wird sachlich mit „er hatte viele Frauen“ wiedergegeben.
  alternative: „viele Ehefrauen“ oder eine wertende Erweiterung
  rationale: Der Vers berichtet Gideons Familiensituation, ohne sie ausdrücklich moralisch zu beurteilen. Die Übersetzung soll den ehelichen Zusammenhang weder verschleiern noch Zustimmung oder Missbilligung hinzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die körperbezogene hebräische Redewendung wird im Haupttext sinngemäß und in der Fußnote wörtlicher wiedergegeben.
