source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: de
  text: Und als Gideon gestorben war, wandten sich die Israeliten wieder den Baalen zu, denen sie sich wie Prostituierte hingaben.[a] Sie machten sich Baal-Berit[b] zu ihrem Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie hurten den Baalen nach.“ Das Hebräische beschreibt den Götzendienst mit dem sexuellen Bild der Prostitution und damit als Untreue.'
    reason: lexical_alternative
  - marker: b
    text: Baal-Berit bedeutet wahrscheinlich „Baal des Bundes“ oder „Herr des Bundes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Und als
  rationale: Die knappe deutsche Erzählformel gibt den zeitlichen Übergang natürlich wieder; ein wörtliches „Und es geschah, als“ wäre hier unnötig schwerfällig.
- source_word: וַיָּשׁוּבוּ
  choice: wandten sich … wieder ab
  rationale: שׁוב bezeichnet hier den Rückfall in den früheren Abfall. „Sich wieder abwenden“ macht im Deutschen die religiöse Abkehr deutlich, ohne ein Objekt hinzuzufügen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die Bezeichnung meint das Volk Israel insgesamt. „Die Israeliten“ ist im modernen Deutschen natürlich und schließt Frauen und Männer ein.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: liefen … nach wie Prostituierte
  rationale: Die Wiedergabe bewahrt sowohl die Bewegungsrichtung von אַחֲרֵי als auch das ausdrücklich sexuelle Bild von זנה und bleibt verständlich.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Der Plural bezeichnet verschiedene lokale Erscheinungsformen beziehungsweise Kulte des Baal.
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: Sie machten sich
  rationale: Die Formulierung gibt das Einsetzen oder Annehmen einer Gottheit für sich selbst idiomatisch wieder.
- source_word: בַּעַל בְּרִית
  choice: Baal-Berit
  rationale: Der kultische Eigenname wird transliteriert; seine mögliche Bedeutung steht in der Fußnote.
- source_word: לֵאלֹהִים
  choice: zu ihrem Gott
  rationale: Das ל bezeichnet die Bestimmung als Gottheit; „zu ihrem Gott“ bringt zusammen mit לָהֶם den Bezug auf Israel natürlich zum Ausdruck.
theological_decisions:
- issue: Sexuelles Bild für Israels Götzendienst
  choice: liefen den Baalen nach wie Prostituierte
  alternative: wurden untreu und folgten den Baalen
  rationale: Das Hebräische verwendet ausdrücklich זנה. Das sexuelle Bild der Untreue wird deshalb nicht zu einer allgemeinen Aussage über Untreue abgeschwächt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Gemeint ist das ganze Volk als handelnde Gemeinschaft. Die idiomatische Volksbezeichnung vermeidet im Deutschen den irreführenden Eindruck, ausschließlich Männer seien gemeint.
- issue: Status von Baal-Berit
  choice: zu ihrem Gott
  alternative: als Gott
  rationale: Die Übersetzung bewahrt die Aussage, dass Israel Baal-Berit für sich als Gottheit annahm, ohne darüber hinausgehende theologische Präzisierungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Erzählformel ist gestrafft, während das anstößige, theologisch gewichtige Bild von זנה klar erhalten bleibt. Der Eigenname Baal-Berit wird nicht übersetzt.
