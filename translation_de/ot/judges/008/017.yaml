  yaml_path: translation/ot/judges/008/017.yaml
  text: He tore down the tower of Penuel and killed the men of the city[a].
translation:
  language: de
  text: Den Turm von Pnuël riss er nieder, und er tötete die Männer der Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pnuël: traditionell auch „Pniël“ geschrieben.'
