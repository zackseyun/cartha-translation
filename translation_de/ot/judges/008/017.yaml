lexical_decisions:
- source_word: מִגְדַּל
  choice: Turm
  rationale: Das Substantiv bezeichnet gewöhnlich einen Turm oder erhöhten befestigten Bau; „Turm“ ist hier die direkte und natürliche Wiedergabe.
- source_word: פְּנוּאֵל
  choice: Pnuël
  rationale: Der Ortsname wird nach der hier vorliegenden Konsonantenform wiedergegeben. „Pnuël“ ist eine im Deutschen geläufige biblische Schreibweise; die traditionelle Variante „Pniël“ wird in der Fußnote bewahrt.
- source_word: נָתָץ
  choice: riss … nieder
  rationale: Das Verb bezeichnet das Niederreißen oder Zerstören eines Bauwerks. „riss … nieder“ ist anschaulich, gegenwärtig und entspricht der Satzstellung mit vorangestelltem Objekt.
- source_word: וַיַּהֲרֹג
  choice: tötete
  rationale: Das Verb bedeutet direkt „töten“. Die schlichte Wiedergabe vermeidet sowohl altertümliche Sprache als auch zusätzliche Bildlichkeit.
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Die Wendung bedeutet wörtlich „die Männer der Stadt“. Im militärischen Strafkontext wird die männliche Bezeichnung beibehalten und nicht zu „Einwohner“ verallgemeinert.
