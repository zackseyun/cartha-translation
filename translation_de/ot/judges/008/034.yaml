revisions:
- from: Und die Söhne Israels dachten nicht an Jahwe, ihren Gott, der sie aus der Hand all ihrer Feinde ringsum gerettet hatte.[a]
  to: Und die Söhne Israels[a] erinnerten sich nicht an Jahwe, ihren Gott, der sie aus der Hand all ihrer Feinde ringsum gerettet hatte.
  rationale: Die Revision ersetzt die leicht weniger präzise Wendung „dachten nicht an“ durch die direkte, idiomatische Entsprechung „erinnerten sich nicht an“ und setzt den bestehenden Fußnotenanker an die von ihm erläuterte Wortgruppe. Die übrigen Entscheidungen bleiben unverändert, da sie den hebräischen Text und ein modernes, würdiges Deutsch angemessen wiedergeben.
