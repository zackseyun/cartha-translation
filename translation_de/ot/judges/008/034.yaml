  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: de
  text: Und die Söhne Israels[a] erinnerten sich nicht an Jahwe, ihren Gott, der sie aus der Hand all ihrer Feinde ringsum gerettet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Hebräisch: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Und ... nicht
  rationale: Die Verbindung setzt den Erzählfluss des vorhergehenden Verses fort; „Und“ bildet die hebräische Satzfolge natürlich ab.
- source_word: זָכְרוּ
  choice: dachten ... an
  rationale: זכר bezeichnet hier nicht bloßes Erinnern, sondern ein loyales Gedenken. Die idiomatische Wendung „an jemanden denken“ bewahrt im Kontext diese weitere Bedeutung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die konkrete männliche Kollektivbezeichnung des Hebräischen wird formal bewahrt; das idiomatischere „die Israeliten“ steht als Alternative in der Fußnote.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: Die Form bezeichnet mit Jahwe als Bezug eindeutig den einen Gott und drückt zugleich die Beziehung zu Israel aus.
- source_word: הַמַּצִּיל
  choice: der ... gerettet hatte
  rationale: Das artikulierte Partizip kennzeichnet Jahwe durch sein rettendes Handeln. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass diese Rettung dem mangelnden Gedenken vorausging.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Metapher für Macht oder Gewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: כָּל אֹיְבֵיהֶם
  choice: all ihrer Feinde
  rationale: Dies gibt die umfassende Aussage der hebräischen Wortgruppe direkt wieder.
- source_word: מִסָּבִיב
  choice: ringsum
  rationale: „Ringsum“ drückt knapp und natürlich aus, dass die Feinde sie von allen Seiten umgaben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektivbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptübersetzung bewahrt die grammatisch männliche und bildhafte Ausgangsform; die im heutigen Deutsch idiomatischere Kollektivbezeichnung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. „Ringsum“ vermeidet eine schwerfällige Formulierung; die wörtliche Kollektivbezeichnung wird im Haupttext beibehalten und idiomatisch erläutert.
