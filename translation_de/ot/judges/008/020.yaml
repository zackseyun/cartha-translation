  text: וַ/יֹּ֨אמֶר֙ לְ/יֶ֣תֶר בְּכוֹר֔/וֹ ק֖וּם הֲרֹ֣ג אוֹתָ֑/ם וְ/לֹא שָׁלַ֨ף הַ/נַּ֤עַר חַרְבּ/וֹ֙ כִּ֣י יָרֵ֔א כִּ֥י עוֹדֶ֖/נּוּ נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: de
  text: 'Da sagte er zu seinem Erstgeborenen Jeter: „Steh auf und töte sie!“ Doch der junge Mann[a] zog sein Schwert nicht, denn er hatte Angst, weil er noch ein junger Mann war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann je nach Zusammenhang auch „Junge“ oder „Jugendlicher“ bedeuten und reicht in seiner Verwendung von der Kindheit bis ins junge Erwachsenenalter. Hier steht „junger Mann“, weil Jeter ein Schwert trägt und als fähig angesehen wird, die Gefangenen zu töten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das konsekutive Waw führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: לְיֶתֶר
  choice: zu ... Jeter
  rationale: Der Personenname יֶתֶר wird in einer für das Deutsche passenden Form als „Jeter“ wiedergegeben.
- source_word: בְּכוֹרוֹ
  choice: zu seinem Erstgeborenen
  rationale: „Erstgeborener“ bewahrt die Bedeutung von בְּכוֹר und seine Hervorhebung der Geburtsfolge genauer als das deutendere „ältester Sohn“.
- source_word: קוּם
  choice: Steh auf
  rationale: Der Imperativ von קום bezeichnet hier das Aufstehen beziehungsweise Sich-Erheben zum Handeln; „Steh auf“ ist direkt und gegenwärtig.
- source_word: הֲרֹג אוֹתָם
  choice: und töte sie
  rationale: הרג ist das gewöhnliche, direkte Verb für „töten“. Das im Deutschen ergänzte „und“ verbindet die aufeinander bezogenen Befehle natürlich, ohne ihren Sinn zu verändern.
- source_word: וְלֹא שָׁלַף
  choice: Doch ... zog ... nicht
  rationale: „Doch“ macht den Gegensatz zwischen dem Befehl und Jeters ausbleibender Handlung deutlich; שׁלף חֶרֶב wird idiomatisch mit „das Schwert ziehen“ wiedergegeben.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר kann einen Jungen, Jugendlichen oder jungen Mann bezeichnen. Da Jeter ein Schwert trägt und zur Tötung der Gefangenen aufgefordert wird, passt „junger Mann“ zum Kontext, ohne sein genaues Alter festzulegen.
- source_word: חַרְבּוֹ
  choice: sein Schwert
  rationale: Die Possessivform wird unmittelbar und eindeutig wiedergegeben.
- source_word: כִּי יָרֵא
  choice: denn er hatte Angst
  rationale: Das erste כִּי begründet, warum er das Schwert nicht zog. „Hatte Angst“ ist natürliches modernes Deutsch und bewahrt die kausale Aussage.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: weil er noch ein junger Mann war
  rationale: Das zweite כִּי führt den Grund für seine Angst an; עוֹדֶנּוּ bezeichnet das Fortbestehen seines jugendlichen Alters. Die erneute Wiedergabe von נַעַר als „junger Mann“ bewahrt die Wiederholung des Hebräischen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil mit direkter Befehlsform. Die zweimalige Bezeichnung Jeters als „junger Mann“ wurde trotz der im Deutschen auffälligen Wiederholung beibehalten, um die Wiederholung von נַעַר und die Begründungsstruktur des hebräischen Textes sichtbar zu machen.
