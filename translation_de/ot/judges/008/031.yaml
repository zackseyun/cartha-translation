  text: וּ/פִֽילַגְשׁ/וֹ֙ אֲשֶׁ֣ר בִּ/שְׁכֶ֔ם יָֽלְדָה לּ֥/וֹ גַם הִ֖יא בֵּ֑ן וַ/יָּ֥שֶׂם אֶת שְׁמ֖/וֹ אֲבִימֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: de
  text: Und seine Nebenfrau, die in Sichem war, gebar ihm ebenfalls einen Sohn, und er gab ihm den Namen Abimelech.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Und seine Nebenfrau
  rationale: פִּילֶגֶשׁ bezeichnet eine Frau mit eheähnlichem, aber gegenüber einer vollberechtigten Ehefrau nachgeordnetem Status. „Nebenfrau“ gibt diese soziale Unterscheidung im Deutschen sachlich und verständlich wieder; וּ wird mit „Und“ wiedergegeben.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: die in Sichem war
  rationale: Die Relativkonstruktion identifiziert die Frau durch ihren Ort. „In Sichem war“ wahrt die unspezifische Aussage des hebräischen בּ, ohne ausdrücklich einen dauerhaften Wohnsitz anzunehmen.
- source_word: יָלְדָה לּוֹ
  choice: gebar ihm
  rationale: יַלד mit לּוֹ bezeichnet hier, dass sie ihm ein Kind gebar. Die knappe deutsche Wendung entspricht dem hebräischen Ausdruck.
- source_word: גַם הִיא
  choice: ebenfalls
  rationale: גַם הִיא hebt hervor, dass auch diese Frau einen Sohn gebar. „Ebenfalls“ stellt den Anschluss an die zuvor genannten Söhne natürlich her.
- source_word: בֵּן
  choice: einen Sohn
  rationale: Das Substantiv ist hier indefinit; „einen Sohn“ ist die natürliche deutsche Wiedergabe.
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: und er gab ihm den Namen
  rationale: Die wörtliche hebräische Wendung „seinen Namen setzen“ bezeichnet die Namensgebung. „Gab ihm den Namen“ überträgt den Sinn idiomatisch und lässt Gideon klar als Handelnden erkennen.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: „Abimelech“ ist die im Deutschen etablierte biblische Namensform und gibt den hebräischen Namen אֲבִימֶלֶךְ wieder.
theological_decisions: []
