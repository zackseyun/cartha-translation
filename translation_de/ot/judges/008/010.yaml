  text: וְ/זֶ֨בַח וְ/צַלְמֻנָּ֜ע בַּ/קַּרְקֹ֗ר וּ/מַחֲנֵי/הֶ֤ם עִמָּ/ם֙ כַּ/חֲמֵ֤שֶׁת עָשָׂר֙ אֶ֔לֶף כֹּ֚ל הַ/נּ֣וֹתָרִ֔ים מִ/כֹּ֖ל מַחֲנֵ֣ה בְנֵי קֶ֑דֶם וְ/הַ/נֹּ֣פְלִ֔ים מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: de
  text: Sebach und Zalmunna waren in Karkor, und ihre Heerlager waren bei ihnen, etwa fünfzehntausend Mann – alle, die vom gesamten Heer der Söhne des Ostens übrig geblieben waren. Hundertzwanzigtausend mit dem Schwert bewaffnete Männer waren gefallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: in Karkor
  rationale: Die Präposition ב bezeichnet hier den Ort; bei diesem Ortsnamen ist „in Karkor“ im Deutschen natürlich.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: und ihre Heerlager waren bei ihnen
  rationale: מַחֲנֵיהֶם ist formal Plural und bezeichnet militärische Lager beziehungsweise die dort versammelten Truppen. „Heerlager“ erhält den Plural und den militärischen Zusammenhang; עִמָּם wird ausdrücklich mit „bei ihnen“ wiedergegeben.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: etwa fünfzehntausend Mann
  rationale: Das Präfix כ kennzeichnet eine ungefähre Zahl; „etwa“ macht dies sichtbar.
- source_word: כֹּל הַנּוֹתָרִים
  choice: alle, die … übrig geblieben waren
  rationale: Das Nifal-Partizip von יתר bezeichnet die Verbliebenen beziehungsweise Überlebenden; die resultative Bedeutung wird natürlich wiedergegeben.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: vom gesamten Heer der Söhne des Ostens
  rationale: מִן wird partitiv mit „von“ wiedergegeben. מַחֲנֶה bezeichnet hier kollektiv das Heer. „Söhne des Ostens“ bewahrt die hebräische ethnogeografische Bezeichnung.
- source_word: וְהַנֹּפְלִים
  choice: waren gefallen
  rationale: Das Partizip von נפל bezeichnet hier die im Kampf Gefallenen; die deutsche Form fügt sich klar in den rückblickenden Bericht ein.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: hundertzwanzigtausend
  rationale: Die Zahl wird nach gegenwärtiger deutscher Rechtschreibung zusammengeschrieben.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: mit dem Schwert bewaffnete Männer
  rationale: Die Wendung bezeichnet kampffähige, bewaffnete Männer. Die idiomatische deutsche Wiedergabe vermeidet das missverständliche Bild eines gerade aus der Scheide gezogenen Schwertes, ohne die militärische Aussage zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Der Plural „Heerlager“ bleibt erhalten; die kollektive Bedeutung von מַחֲנֶה im zweiten Vorkommen wird als „Heer“ ausgedrückt. Keine ergänzende Fußnote erforderlich.
