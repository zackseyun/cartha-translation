base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: de
  text: Und Gideon, der Sohn des Joasch, starb in gutem, hohem Alter und wurde im Grab seines Vaters Joasch[a] in Ofra der Abiëseriter[b] bestattet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Gruft seines Vaters Joasch“. Das hebräische Wort kann ein Grab, eine Gruft oder eine Begräbnisstätte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in Ofra des Abiëseriters“; gemeint ist Ofra, das zum Clan der Abiëseriter gehörte.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Verb מות bedeutet hier direkt „sterben“; „starb“ gibt die Aussage schlicht und ohne beschönigende Umschreibung wieder.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideon, der Sohn des Joasch
  rationale: Die Abstammungsangabe wird in natürlichem, modernem Deutsch wiedergegeben; die Namensformen entsprechen dem etablierten deutschen Bibelgebrauch.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: in hohem Alter
  rationale: Die Wendung bezeichnet ein positiv bewertetes, hohes Alter. „In hohem Alter“ klingt im Deutschen natürlich, ohne die Aussage als Lebenssattheit oder besondere Erfüllung auszudeuten.
- source_word: וַיִּקָּבֵר
  choice: wurde … bestattet
  rationale: Der Nifal von קבר ist hier passiv. „Bestattet“ vermeidet zusammen mit „Grab“ eine schwerfällige Wortwiederholung.
- source_word: בְּקֶבֶר
  choice: im Grab
  rationale: קֶבֶר kann ein Grab, eine Gruft oder eine Begräbnisstätte bezeichnen. „Grab“ ist die unmittelbare und allgemein verständliche Wiedergabe; die Alternative wird in einer Fußnote genannt.
- source_word: יוֹאָשׁ אָבִיו
  choice: seines Vaters Joasch
  rationale: Diese deutsche Wortstellung gibt die Zugehörigkeit des Grabes und Joaschs Beziehung zu Gideon klar und idiomatisch wieder.
- source_word: בְּעָפְרָה
  choice: in Ofra
  rationale: Der Ortsname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: אֲבִי הָעֶזְרִי
  choice: der Stadt der Abiëseriter
  rationale: Die hebräische Singularform ist eine gentilizische Bezeichnung und ordnet Ofra dem Abiëseriter-Clan zu. „Stadt“ ist zur natürlichen deutschen Verknüpfung ergänzt und wird durch die Fußnote transparent gemacht.
