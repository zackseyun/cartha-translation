  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: de
  text: 'Er sagte auch zu den Männern von Penuel[a]: »Wenn ich in Frieden zurückkehre[b], werde ich diesen Turm[c] niederreißen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Männern von Penuel« sind wahrscheinlich die männlichen Vertreter oder führenden Männer der Stadt gemeint, nicht unbedingt alle Einwohner.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »in Frieden«; im Zusammenhang kann dies auch eine sichere, erfolgreiche und unversehrte Rückkehr bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Der »Turm« kann ein Wehrturm oder Teil einer Befestigungsanlage in Penuel gewesen sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Kennzeichnet die Fortsetzung von Gideons Drohung gegenüber einer weiteren Gruppe und gibt den additiven Zusammenhang knapp wieder.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: zu den Männern von Pnuël
  rationale: Bewahrt die konkrete Bedeutung von אַנְשֵׁי; im städtischen Zusammenhang sind wahrscheinlich die männlichen Vertreter oder führenden Männer gemeint.
- source_word: בְּשׁוּבִי
  choice: Wenn ich ... zurückkehre
  rationale: Die Infinitivkonstruktion mit Präposition und Suffix hat hier temporale Bedeutung; diese Wiedergabe ist im modernen Deutschen natürlich.
- source_word: בְשָׁלוֹם
  choice: wohlbehalten
  rationale: שָׁלוֹם bezeichnet hier wahrscheinlich eine sichere und unversehrte, womöglich auch erfolgreiche Rückkehr aus dem Kampf. »Wohlbehalten« gibt den kontextuellen Sinn natürlich wieder; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: אֶתֹּץ
  choice: werde ich ... niederreißen
  rationale: Das Verb נתץ bezeichnet das gewaltsame Abbrechen oder Zerstören eines Bauwerks; »niederreißen« ist präzise und kräftig.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: diesen Turm
  rationale: מִגְדָּל bedeutet konkret »Turm«; eine mögliche Funktion als Befestigungsanlage wird nicht in den Haupttext hineingedeutet, sondern erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und drohend. Die Schreibweise »Pnuël« macht die hebräische Silbenstruktur erkennbar. Sämtliche Fußnotenmarker stehen unmittelbar bei dem Ausdruck, den sie erläutern.
