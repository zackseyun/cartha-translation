  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: de
  text: So wurde Midian von den Israeliten bezwungen, und die Midianiter erhoben ihr Haupt nicht wieder.[a] Das Land hatte zur Zeit Gideons vierzig Jahre lang Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie kamen nicht wieder zu Kräften oder gewannen ihre Macht nicht zurück.'
    reason: Die hebräische Wendung „das Haupt erheben“ kann erneute Stärke, Selbstbehauptung oder Macht bezeichnen.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: wurde … unterworfen
  rationale: Der Niphal von כנע bezeichnet hier im militärischen Zusammenhang, dass Midian in Abhängigkeit und Niederlage gebracht wurde. „Unterworfen“ gibt den passiven Sinn klar und idiomatisch wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition wird entsprechend der hebräischen Wendung mit „vor“ wiedergegeben und bezeichnet Midians Unterwerfung gegenüber Israel, ohne die Beziehung stärker als „durch“ oder „von“ auszudeuten.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die wörtliche Form lautet „den Söhnen Israels“, fungiert hier jedoch als herkömmliche Volksbezeichnung. „Den Israeliten“ ist im modernen Standarddeutsch natürlich und inhaltlich genau.
- source_word: וְלֹא יָסְפוּ
  choice: nicht wieder
  rationale: יסף mit Infinitiv drückt hier aus, dass die zuvor ausgeübte Macht oder Erhebung nicht erneut eintrat.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: sie erhoben ihr Haupt
  rationale: Die konkrete hebräische Metapher für erneute Stärke, Selbstbehauptung oder Macht wird im Haupttext bewahrt; ihre Bedeutungsweite wird in der Fußnote erläutert.
- source_word: וַתִּשְׁקֹט
  choice: hatte … Ruhe
  rationale: Das Verb bezeichnet in den wiederkehrenden Zusammenfassungen des Richterbuches eine Zeit ohne kriegerische Bedrängnis. „Hatte Ruhe“ ist dafür eine klare, traditionelle und natürliche Wiedergabe.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das Land Israel als Lebensraum des Volkes; „das Land“ wahrt die knappe Form des Ausgangstextes.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre
  rationale: Die Zeitangabe wird unmittelbar und ohne interpretierende Erweiterung wiedergegeben.
- source_word: בִּימֵי גִדְעוֹן
  choice: in den Tagen Gideons
  rationale: Die formnahe Wendung bewahrt die zeitliche Aussage, ohne sie ausdrücklich auf Gideons gesamte Lebenszeit festzulegen.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  alternative: den Söhnen Israels
  rationale: Die hebräische maskuline Pluralform ist hier eine feste nationale Bezeichnung. „Israeliten“ bezeichnet dasselbe Volk präzise und klingt im modernen Deutsch natürlicher, ohne die Referenz auszuweiten oder zu neutralisieren.
- issue: Bewahrung der Metapher לָשֵׂאת רֹאשָׁם
  choice: sie erhoben ihr Haupt nicht wieder
  alternative: sie kamen nicht wieder zu Kräften / gewannen ihre Macht nicht zurück
  rationale: Der Haupttext bewahrt das Bild und damit seine Bedeutungsbreite. Die Fußnote erläutert mögliche kontextuelle Bedeutungen, ohne die Spannung zwischen Kraft, Selbstbehauptung und politisch-militärischer Macht einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. Die geläufige Volksbezeichnung „Israeliten“ dient der Verständlichkeit; die markante hebräische Haupt-Metapher bleibt dagegen bewusst erhalten.
