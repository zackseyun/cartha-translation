    issue: Unidiomatische und potenziell missverständliche Wiedergabe von „vor den Israeliten unterworfen“
    rationale: Das Hebräische לִפְנֵי ist hier Teil einer Unterwerfungsformel. Deutsch „jemanden vor jemandem unterwerfen“ ist nicht geläufig und kann eine andere Relation nahelegen. „von den Israeliten bezwungen“ gibt die im Kontext gemeinte Relation natürlich wieder.
  - severity: medium
    issue: Mehrdeutiger Bezug von „sie erhoben ihr Haupt nicht wieder“
    rationale: Nach „den Israeliten“ liegt im Deutschen ein Bezug von „sie“ auf die Israeliten nahe. Im Hebräischen bezieht sich die Pluralform auf Midian als kollektive Größe, also auf die Midianiter. Eine ausdrückliche Benennung stellt den Bezug klar.
  revised_text: So wurde Midian von den Israeliten bezwungen, und die Midianiter erhoben ihr Haupt nicht wieder.[a] Das Land hatte zur Zeit Gideons vierzig Jahre lang Ruhe.
