revisions:
- from: So wurde Midian vor den Israeliten unterworfen, und sie erhoben ihr Haupt nicht wieder.[a] Das Land hatte vierzig Jahre Ruhe in den Tagen Gideons.
  to: So wurde Midian von den Israeliten bezwungen, und die Midianiter erhoben ihr Haupt nicht wieder.[a] Das Land hatte zur Zeit Gideons vierzig Jahre lang Ruhe.
  rationale: Die Revision verbessert die deutsche Idiomatik und klärt den Bezug der pluralischen Aussage, ohne den militärisch-politischen Gehalt des Hebräischen zu verändern. Die Bildsprache von „das Haupt erheben“ und die zeitlich nicht weiter spezifizierte Wendung zu Gideons Zeit bleiben erhalten.
