base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: de
  text: Das Gewicht der goldenen Ringe, um die er gebeten hatte, betrug 1.700 Schekel Gold[a], außer dem Halbmondschmuck, den Anhängern und den Purpurgewändern, die die Könige von Midian trugen, sowie den Halsketten an den Hälsen ihrer Kamele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „1.700 Gold“; „Schekel“ ist als die hier vorausgesetzte Gewichtseinheit ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: Gewicht
  rationale: Das Substantiv bezeichnet das gemessene Gewicht und nicht bloß eine Menge.
- source_word: נִזְמֵי הַזָּהָב
  choice: goldenen Ringe
  rationale: נזם kann einen am Ohr oder an der Nase getragenen Ring bezeichnen; „Ringe“ vermeidet eine im Kontext nicht ausdrücklich festgelegte Körperstelle.
- source_word: אֲשֶׁר שָׁאָל
  choice: die er erbeten hatte
  rationale: Das Verb bezeichnet hier Gideons Bitte um einen Anteil an der Beute; das Plusquamperfekt macht im Deutschen den Rückbezug auf die vorausgehende Bitte deutlich.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 1.700 Schekel Gold
  rationale: Im Hebräischen steht wörtlich „1.700 Gold“; Schekel ist als Gewichtseinheit aus dem Zusammenhang zu ergänzen und wird in einer Fußnote kenntlich gemacht.
- source_word: לְבַד מִן
  choice: abgesehen von … sowie
  rationale: Die Wendung schließt die anschließend genannten Schmuckstücke und Gewänder aus der zuvor angegebenen Gewichtssumme aus.
- source_word: הַשַּׂהֲרֹנִים
  choice: Halbmonden
  rationale: Der Ausdruck bezeichnet halbmondförmige Schmuckstücke; „Halbmonde“ ist knapp und im Schmuckkontext verständlich.
- source_word: הַנְּטִפוֹת
  choice: Anhängern
  rationale: Das Wort meint wahrscheinlich herabhängende Schmuckstücke; „Anhänger“ bleibt angemessen allgemein.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: purpurfarbenen Gewändern
  rationale: Gemeint sind durch Purpurstoff oder Purpurfarbe gekennzeichnete, kostbare Gewänder.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: die die Könige von Midian getragen hatten
  rationale: Bei Kleidern bezeichnet עַל hier konkret das Tragen am Körper; die natürliche deutsche Formulierung bewahrt diesen Sinn.
- source_word: הָעֲנָקוֹת
  choice: Halsketten
  rationale: Das Wort bezeichnet Schmuck für den Hals; der folgende Hinweis auf die Kamelhälse bestätigt diese Bedeutung.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: an den Hälsen ihrer Kamele
  rationale: Die Formulierung gibt den Ort der Halsketten natürlich und quellennah wieder.
