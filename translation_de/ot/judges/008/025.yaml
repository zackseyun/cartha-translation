source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ נָת֣וֹן נִתֵּ֑ן וַֽ/יִּפְרְשׂוּ֙ אֶת הַ/שִּׂמְלָ֔ה וַ/יַּשְׁלִ֣יכוּ שָׁ֔מָּ/ה אִ֖ישׁ נֶ֥זֶם שְׁלָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: de
  text: 'Da sagten sie[a]: »Wir werden sie auf jeden Fall geben.« Dann breiteten sie den Mantel[b] aus, und jeder warf einen Ring[c] aus seiner Beute darauf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit einer hebräischen Verstärkungsform: »Wir werden sie ganz gewiss geben.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Obergewand«; gemeint ist ein Kleidungsstück, das zum Einsammeln der Ringe ausgebreitet wurde.'
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort kann einen Ohrring oder einen Nasenring bezeichnen; hier ist wahrscheinlich ein Ohrring gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: Wir werden sie auf jeden Fall geben
  rationale: Der absolute Infinitiv zusammen mit dem finiten Verb verstärkt die Aussage. »Auf jeden Fall« gibt diese Bekräftigung natürlich wieder, ohne ausdrücklich eine im Hebräischen nicht genannte freudige Bereitschaft einzutragen. »Sie« bezieht sich aus dem vorherigen Vers auf die Ringe.
- source_word: הַשִּׂמְלָה
  choice: den Mantel
  rationale: שִׂמְלָה bezeichnet ein Kleidungsstück, häufig einen Mantel oder ein Obergewand. »Mantel« vermittelt anschaulich ein ausgebreitetes Kleidungsstück, auf dem die Beute gesammelt werden kann.
- source_word: וַיִּפְרְשׂוּ
  choice: breiteten ... aus
  rationale: פרשׂ bedeutet hier, etwas flächig auszubreiten; die deutsche Wendung ist idiomatisch und quellennah.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: warf ... darauf
  rationale: שלך bezeichnet ein Werfen, nicht bloß ein Ablegen. Das örtliche שָׁמָּה (»dorthin«) bezieht sich auf den ausgebreiteten Mantel; »darauf« macht diesen Bezug im Deutschen natürlich deutlich.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird hier distributiv gebraucht. »Jeder« bewahrt den Einzelsinn, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: נֶזֶם
  choice: einen Ring
  rationale: נֶזֶם kann je nach Zusammenhang einen Ohrring oder Nasenring bezeichnen. Da der Vers selbst die Trageweise nicht festlegt, wahrt »Ring« die echte lexikalische Mehrdeutigkeit; die wahrscheinlichere Deutung als Ohrring steht in der Fußnote.
- source_word: שְׁלָלוֹ
  choice: aus seiner Beute
  rationale: שָׁלָל ist im militärischen Zusammenhang erbeutetes Gut. Das Possessivsuffix wird durch »seiner« bewahrt und entspricht dem distributiven »jeder«.
