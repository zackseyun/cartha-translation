base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: de
  text: 'Dann kam er zu den Männern von Sukkot und sagte: „Hier sind Sebach und Zalmunna, wegen derer ihr mich verhöhnt habt[a], als ihr sagtet: ‚Sind Sebach und Zalmunna jetzt schon in deiner Hand[b], dass wir deinen erschöpften Männern Brot geben sollten?‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb bezeichnet eine höhnische oder verächtliche Schmähung; auch möglich: „mit denen ihr mich verspottet habt“ oder „über die ihr mich verhöhnt habt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Ist die Handfläche Sebachs und Zalmunnas jetzt in deiner Hand?“ Gemeint ist: „Hast du sie bereits gefangen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: die Männer von Sukkot
  rationale: Die Form bezeichnet wörtlich die Männer von Sukkot und wahrt den im Zusammenhang angesprochenen männlichen Personenkreis.
- source_word: הִנֵּה
  choice: Hier sind
  rationale: Die deiktische Partikel weist unmittelbar auf die nun vorgeführten Gefangenen hin; diese Wiedergabe ist natürlich und präzise.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Sebach und Zalmunna
  rationale: Die Eigennamen werden in einer im Deutschen üblichen biblischen Umschrift wiedergegeben.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: derentwegen ihr mich verhöhnt habt
  rationale: חרף bezeichnet hier eine höhnische, verächtliche Schmähung Gideons im Zusammenhang mit den beiden Königen. „Derentwegen“ gibt den Bezug des Relativsatzes idiomatisch wieder.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: Sind ... in deiner Hand
  rationale: Die hebräische Wendung fragt bildhaft, ob die Könige bereits gefangen und in Gideons Gewalt sind; das deutsche Bild „in deiner Hand“ bleibt verständlich.
- source_word: עַתָּה
  choice: jetzt schon
  rationale: Im rhetorischen Rückblick bringt „jetzt schon“ den spöttischen Zweifel zum Ausdruck, ob Gideon die Könige denn bereits gefangen habe.
- source_word: כִּי נִתֵּן
  choice: sodass wir ... geben sollten
  rationale: Die Formulierung gibt die im rhetorischen Fragesatz ausgedrückte Folge beziehungsweise Begründung der verweigerten Hilfe in natürlichem Deutsch wieder.
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: deinen erschöpften Männern
  rationale: יְעֵפִים bezeichnet starke Ermüdung infolge der Verfolgung; „erschöpft“ vermittelt diese Intensität klar.
- source_word: לָחֶם
  choice: Brot
  rationale: „Brot“ ist die direkte Entsprechung und kann auch im Deutschen stellvertretend für Nahrung stehen.
