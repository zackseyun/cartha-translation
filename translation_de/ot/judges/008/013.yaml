  yaml_path: translation/ot/judges/008/013.yaml
  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: de
  text: Da kehrte Gideon, der Sohn des Joasch, aus der Schlacht zurück, über den Anstieg von Heres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „vom Anstieg der Sonne her“. Die hebräische Wendung ist schwierig; הֶחָרֶס kann als Ortsname („Heres“) oder als „die Sonne“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Da kehrte ... zurück
  rationale: Das Wayyiqtol führt die Erzählung fort. „Da“ gibt den narrativen Anschluss natürlich wieder, während „kehrte zurück“ die Grundbedeutung von שוב bewahrt.
- source_word: גִּדְעוֹן
  choice: Gideon
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בֶּן יוֹאָשׁ
  choice: der Sohn des Joasch
  rationale: Die hebräische Herkunftsangabe wird im Deutschen idiomatisch als Apposition mit bestimmtem Artikel wiedergegeben.
- source_word: מִן הַמִּלְחָמָה
  choice: aus der Schlacht
  rationale: מִלְחָמָה kann „Krieg“ oder „Schlacht“ bedeuten; hier bezeichnet es am ehesten das konkrete Kampfgeschehen.
- source_word: מִלְמַעֲלֵה
  choice: über den Anstieg von
  rationale: Die Formulierung bewahrt den topografischen Sinn von מַעֲלֶה und gibt die Präposition als Routenangabe wieder, ohne die schwierige Wendung unnötig festzulegen.
- source_word: הֶחָרֶס
  choice: Heres
  rationale: Die Konsonanten können als Ortsbezeichnung verstanden werden. Die Transliteration im Haupttext erhält diese Möglichkeit; die ebenfalls mögliche Bedeutung „Sonne“ wird in der Fußnote genannt.
