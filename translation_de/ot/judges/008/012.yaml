base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: de
  text: Sebach und Zalmunna flohen. Gideon verfolgte sie und nahm die beiden Könige von Midian gefangen, Sebach und Zalmunna. Das ganze Heerlager versetzte er in Panik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er erschreckte das ganze Heerlager“ beziehungsweise „Er schlug das ganze Heerlager in die Flucht.“ Das hebräische Verb bezeichnet das Versetzen in Zittern oder Schrecken und kann hier militärische Panik oder Auflösung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: flohen
  rationale: Das Qal von נוס bezeichnet Flucht oder Entkommen; „flohen“ gibt die knappe Erzählweise natürlich wieder.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Sebach und Zalmunna
  rationale: Die Personennamen werden nach üblicher deutscher Bibeltradition aus dem Hebräischen wiedergegeben.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: Gideon verfolgte sie
  rationale: רדף mit אחרי bedeutet „hinter jemandem her sein/verfolgen“. Das im Hebräischen nur durch die Verbform bezeichnete Subjekt wird zur eindeutigen und natürlichen deutschen Wiedergabe als Gideon benannt.
- source_word: וַיִּלְכֹּד
  choice: nahm ... gefangen
  rationale: לכד bezeichnet im militärischen Zusammenhang das Ergreifen oder Gefangennehmen; die deutsche Wendung passt zur Gefangennahme der Könige.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: die beiden Könige von Midian
  rationale: Diese Formulierung bewahrt die hebräische Genitivbeziehung und klingt zugleich natürlich.
- source_word: וְכָל הַמַּחֲנֶה
  choice: das ganze Heerlager
  rationale: מחנה bezeichnet hier das Lager beziehungsweise die dort versammelte Streitmacht; „Heerlager“ macht den militärischen Zusammenhang deutlich.
- source_word: הֶחֱרִיד
  choice: versetzte ... in Panik
  rationale: Das Hifil von חרד bedeutet, Zittern oder Schrecken zu verursachen. Im militärischen Zusammenhang erfasst „in Panik versetzen“ sowohl die kausative Bedeutung als auch die ausgelöste Unordnung.
