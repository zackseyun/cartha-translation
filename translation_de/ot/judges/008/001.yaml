  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ אֶפְרַ֗יִם מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/בִלְתִּי֙ קְרֹ֣אות לָ֔/נוּ כִּ֥י הָלַ֖כְתָּ לְ/הִלָּחֵ֣ם בְּ/מִדְיָ֑ן וַ/יְרִיב֥וּ/ן אִתּ֖/וֹ בְּ/חָזְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: de
  text: 'Da sagten die Männer von Ephraim[a] zu ihm: „Was hast du uns da angetan, dass du uns nicht gerufen hast, als du loszogst, um gegen Midian zu kämpfen?“ Und sie stritten heftig mit ihm.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ephraimiter“. Wörtlich steht im Hebräischen „der Mann Ephraims“; die Wendung ist hier kollektiv für den Stamm gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und sie gingen hart mit ihm ins Gericht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: die Männer von Ephraim
  rationale: Obwohl אִישׁ der Form nach Singular ist, bezeichnet die Verbindung hier kollektiv die Angehörigen des Stammes Ephraim; die folgenden Verben im Plural bestätigen dies. Die Wiedergabe bewahrt die hebräische Ausdrucksweise und bleibt im Deutschen verständlich.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: Was hast du uns da angetan
  rationale: Die Formulierung gibt die vorwurfsvolle rhetorische Frage natürlich wieder. „Da“ greift das demonstrative הַזֶּה auf, während „angetan“ die im Zusammenhang empfundene Kränkung ausdrückt, ohne eine konkrete Schädigung festzulegen.
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: dass du uns nicht gerufen hast
  rationale: Die deutsche Konstruktion bezeichnet verständlich den beanstandeten Umstand. „Gerufen“ bleibt näher am gewöhnlichen Bedeutungsbereich von קרא als das stärkere „aufgeboten“.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: als du loszogst, um gegen Midian zu kämpfen
  rationale: כִּי wird im Zusammenhang temporal verstanden. „Loszogst“ passt zum militärischen Kontext, und „gegen Midian“ gibt die gegnerische Bedeutung der Präposition בְּ bei נלחם wieder.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: Und sie stritten heftig mit ihm
  rationale: ריב bezeichnet Streit oder Auseinandersetzung; בְּחָזְקָה verstärkt dessen Intensität. „Stritten heftig“ ist gegenwärtiges, klares Deutsch und lässt offen, ob die Auseinandersetzung nur aus Worten bestand oder darüber hinausging.
