  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: de
  text: 'Da sagten Sebach und Zalmunna: „Steh du auf und erschlag uns![a] Denn wie der Mann ist, so ist seine Kraft.“[b] Da stand Gideon auf und tötete Sebach und Zalmunna. Dann nahm er die halbmondförmigen Schmuckstücke[c], die an den Hälsen ihrer Kamele waren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Steh du auf und stoß uns nieder!“ Das hebräische Verb kann „angreifen“ oder „niederstoßen“ bedeuten; hier ist ein tödlicher Schlag gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn wie der Mann, so seine Kraft.“ Gemeint ist sprichwörtlich, dass die Kraft eines Mannes seiner Person beziehungsweise seiner Tüchtigkeit entspricht.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Mondsicheln“; gemeint sind halbmondförmige Schmuckstücke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... זֶבַח וְצַלְמֻנָּע
  choice: Da sagten Sebach und Zalmunna
  rationale: Das singularische Verb vor dem zusammengesetzten Subjekt ist im Hebräischen idiomatisch; im Deutschen steht natürlich der Plural. „Da“ führt die Handlung erzählerisch fort.
- source_word: קוּם אַתָּה
  choice: Steh du auf
  rationale: Das ausdrücklich gesetzte Pronomen אַתָּה verleiht dem Imperativ Nachdruck; „du“ bewahrt diesen Kontrast und die Aufforderung.
- source_word: וּפְגַע בָּנוּ
  choice: und erschlag uns
  rationale: פגע kann ein Treffen, Angreifen oder Niederstoßen bezeichnen. Im unmittelbaren Hinrichtungskontext ist die tödliche Absicht eindeutig; „erschlag uns“ gibt sie in natürlichem Deutsch wieder.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: Denn wie der Mann ist, so ist seine Kraft
  rationale: Die knappe sprichwörtliche Parallelität bleibt erhalten. „Kraft“ gibt גְּבוּרָה wieder, ohne die Bedeutung auf Körpergröße oder Tapferkeit allein einzuengen.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: Da stand Gideon auf
  rationale: Die Formulierung greift bewusst das zuvor verwendete קוּם auf und zeigt Gideons unmittelbare Reaktion.
- source_word: וַיַּהֲרֹג
  choice: und tötete
  rationale: „Tötete“ ist die klare, moderne Wiedergabe des gewöhnlichen Verbs הרג und unterscheidet sich sprachlich von פגע im vorangehenden Befehl.
- source_word: הַשַּׂהֲרֹנִים
  choice: die halbmondförmigen Schmuckstücke
  rationale: Das Wort bezeichnet mondsichel- beziehungsweise halbmondförmigen Schmuck. Die gewählte Formulierung ist anschaulich und vermeidet das missverständliche wörtliche „Monde“.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: die ihre Kamele am Hals trugen
  rationale: Die Umformung in einen natürlichen deutschen Relativsatz bewahrt die genaue Ortsangabe und macht deutlich, dass der Schmuck an den Kamelen angebracht war.
theological_decisions:
- issue: Maskuline Form des Spruches כָאִישׁ
  choice: wie der Mann ist, so ist seine Kraft
  alternative: wie jemand ist, so ist seine Kraft
  rationale: Der hebräische Ausdruck ist grammatisch maskulin und bezieht sich im Kontext konkret auf die Kampfkraft eines männlichen Kriegers. Die maskuline Form wird deshalb beibehalten, ohne den Spruch geschlechtsneutral umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählführung. Die Wiederholung „Steh ... auf / stand ... auf“ bildet die hebräische Wortverbindung ab. Der sprichwörtliche Satz bleibt bewusst knapp und in seiner Reichweite offen.
