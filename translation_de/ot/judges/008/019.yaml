base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: de
  text: 'Da sagte er: „Es waren meine Brüder, die Söhne meiner Mutter[a]. So wahr Jahwe lebt: Hättet ihr sie am Leben gelassen, würde ich euch nicht töten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Söhne meiner Mutter“ bezeichnet hier seine Brüder, die dieselbe Mutter hatten, nicht bloß Verwandte oder Stammesbrüder.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Da sagte er
  rationale: Gibt das narrative Wayyiqtol natürlich wieder und kennzeichnet Gideons anschließende Antwort, ohne mehr als die Abfolge auszudrücken.
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: Es waren meine Brüder, die Söhne meiner Mutter
  rationale: „Meine Brüder“ bewahrt die konkrete familiäre Bedeutung; die Apposition „die Söhne meiner Mutter“ wird ausdrücklich erhalten und bezeichnet Brüder derselben Mutter.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Entspricht der üblichen deutschen Form einer feierlichen Schwurformel und gibt den Gottesnamen als Jahwe wieder.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: Hättet ihr sie am Leben gelassen
  rationale: Das irreale לוּ mit dem Hifil von חיה bezeichnet die nicht eingetretene Bedingung, dass die Männer am Leben erhalten worden wären.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: würde ich euch nicht töten
  rationale: 'Die deutsche Gegenwartsform im irrealen Folgesatz wahrt den naheliegenden situativen Sinn: Weil die Brüder getötet wurden, steht Gideons Tötung der Angesprochenen nun bevor. Die hebräische Perfektform lässt jedoch auch eine rückblickende Wiedergabe zu.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Schwurformel
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug des irrealen Folgesatzes
  choice: würde ich euch nicht töten
  alternative: hätte ich euch nicht getötet
  rationale: Im Erzählzusammenhang leben die angesprochenen Könige noch, sodass die bevorstehende Tötung gemeint sein kann. Zugleich ist die hebräische Perfektform formal mehrdeutig; die alternative rückblickende Deutung wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel bleibt feierlich, während der Bedingungssatz natürlich und unmittelbar formuliert ist. Sämtliche Fußnotenmarker stehen im Haupttext.
