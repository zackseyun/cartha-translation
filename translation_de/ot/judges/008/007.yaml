  text: וַ/יֹּ֣אמֶר גִּדְע֔וֹן לָ/כֵ֗ן בְּ/תֵ֧ת יְהוָ֛ה אֶת זֶ֥בַח וְ/אֶת צַלְמֻנָּ֖ע בְּ/יָדִ֑/י וְ/דַשְׁתִּי֙ אֶת בְּשַׂרְ/כֶ֔ם אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: de
  text: 'Gideon sagte: »Darum werde ich, wenn Jahwe Sebach und Zalmunna in meine Hand gibt, euer Fleisch mit den Dornen der Wildnis und mit Dornengestrüpp[a] dreschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Disteln«; welche stachlige Pflanze mit dem hebräischen Wort genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet Gideons Drohung als Folgerung aus der Weigerung der Männer von Sukkot im vorhergehenden Vers.
- source_word: בְּתֵת
  choice: wenn … gibt
  rationale: Die Präposition ב mit dem Infinitiv von נתן hat hier natürlichen temporalen Sinn und blickt auf den erwarteten Sieg voraus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: בְּיָדִי
  choice: in meine Hand
  rationale: Bewahrt das konkrete hebräische Bild für die Übergabe in Gideons Gewalt und ist im Deutschen verständlich.
- source_word: וְדַשְׁתִּי
  choice: werde ich … dreschen
  rationale: Bewahrt die brutale landwirtschaftliche Metapher des hebräischen Verbs דושׁ, statt sie durch ein allgemeineres Strafverb abzuschwächen.
- source_word: בְּשַׂרְכֶם
  choice: euer Fleisch
  rationale: Ist die direkte und bewusst drastische Entsprechung; „eure Körper“ wäre weniger bildkräftig.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: die Dornen der Wildnis
  rationale: Bewahrt sowohl die Pflanzenbezeichnung als auch den Bezug zur unbewohnten, trockenen Landschaft.
- source_word: הַבַּרְקֳנִים
  choice: Dornengestrüpp
  rationale: Bezeichnet eine verletzende, stachlige Pflanze, ohne die botanisch nicht sicher bestimmbare Art zu präzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers verwendet das Tetragramm ausdrücklich; die Umschrift bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Gewissheit von Gideons Aussage über den erwarteten Sieg
  choice: wenn Jahwe … gibt
  alternative: falls Jahwe … gibt
  rationale: Die temporale Formulierung wahrt Gideons zuversichtliche Erwartung, ohne aus dem Satz eine ausdrückliche Bedingung des Zweifels zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde für natürliches Deutsch geordnet, während „Darum“, „in meine Hand“, „euer Fleisch“ und „dreschen“ die Folgerung sowie die Härte und Bildsprache des Hebräischen bewahren.
