  terminology: „Jahwe“ entspricht dem ausdrücklich gebrauchten Gottesnamen. Sebach und Zalmunna sind etablierte, sachgerechte deutsche Namensformen. „Dornen der Wildnis“ und „Dornengestrüpp“ vermitteln die hebräische Pflanzenbildlichkeit; die Fußnote markiert die botanische Unsicherheit angemessen.
