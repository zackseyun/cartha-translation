  text: וַ/יֹּ֨אמֶר֙ שָׂרֵ֣י סֻכּ֔וֹת הֲ֠/כַף זֶ֧בַח וְ/צַלְמֻנָּ֛ע עַתָּ֖ה בְּ/יָדֶ֑/ךָ כִּֽי נִתֵּ֥ן לִֽ/צְבָאֲ/ךָ֖ לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: de
  text: 'Da sagten die führenden Männer von Sukkot: »Hast du Sebach und Zalmunna etwa schon in deiner Gewalt, dass wir deinem Heer Brot geben sollten?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: die führenden Männer von Sukkot
  rationale: שָׂרִים bezeichnet hier die leitenden Amtsträger der Stadt; »führende Männer« ist natürlich und lässt die genaue Amtsstruktur offen.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע ... בְּיָדֶךָ
  choice: Hast du Sebach und Zalmunna etwa schon in deiner Gewalt
  rationale: 'Die wörtliche Wendung »Ist die Handfläche ... in deiner Hand?« ist idiomatisch und spöttisch gemeint: Gideon hat die beiden Könige noch nicht gefangen beziehungsweise unter seiner Kontrolle. Die Wiedergabe vermeidet im Deutschen eine missverständliche Körperteil-Metapher.'
- source_word: לִצְבָאֲךָ
  choice: deinem Heer
  rationale: צָבָא bezeichnet Gideons kämpfende Truppe; »Heer« gibt den militärischen Zusammenhang knapp und würdig wieder.
- source_word: כִּי נִתֵּן ... לֶחֶם
  choice: dass wir ... Brot geben sollten
  rationale: כִּי führt hier die abschätzige Folgerung beziehungsweise Begründung der rhetorischen Frage ein; der deutsche Konjunktiv bildet die verweigernde Haltung natürlich ab.
theological_decisions:
- issue: Rhetorischer Spott der Stadtführer
  choice: »etwa schon« und eine rhetorische Frage
  alternative: eine neutrale Frage ohne Modalpartikel
  rationale: Der Kontext und die Frageform zeigen, dass die Männer Gideons Erfolg bezweifeln und deshalb Hilfe verweigern; die Modalpartikel macht diesen Ton sichtbar, ohne zusätzliche Motive einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Namen folgen den im Deutschen gebräuchlichen Formen »Sukkot«, »Sebach« und »Zalmunna«. Keine Fußnote ist erforderlich.
