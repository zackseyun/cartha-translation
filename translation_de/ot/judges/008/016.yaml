  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: de
  text: Dann nahm er die Ältesten der Stadt, Dornen aus der Wüste und Disteln und züchtigte damit die Männer von Sukkot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ließ er die Männer von Sukkot durch sie erkennen/wissen“. Der hebräische Ausdruck ist schwierig; im Zusammenhang ist offenbar eine Strafhandlung mit den Dornen und Disteln gemeint. Andere geben ihn stärker wieder, etwa mit „drosch“ oder „bestrafte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: die Ältesten der Stadt
  rationale: Die wörtliche Amtsbezeichnung „Älteste“ bleibt erhalten und bezeichnet hier die führenden Männer der Stadt.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: Dornen aus der Wüste
  rationale: Die Wiedergabe bewahrt das konkrete Bild dorniger Pflanzen und drückt die Herkunftsbeziehung in natürlichem Deutsch aus.
- source_word: הַבַּרְקֳנִים
  choice: Disteln
  rationale: Das seltene Substantiv bezeichnet stachelige Pflanzen; „Disteln“ ist eine verständliche, bildhafte Wiedergabe, ohne die Pflanzenart übermäßig genau festzulegen.
- source_word: וַיֹּדַע בָּהֶם
  choice: züchtigte damit
  rationale: Die Hifil-Form von ידע bedeutet gewöhnlich „wissen lassen/lehren“, bezeichnet hier angesichts der Dornen und des vorausgehenden Versprechens aber eine körperliche Strafhandlung. „Züchtigte“ wahrt den möglichen Anklang an Belehrung durch Strafe, ohne das umstrittene Bild als „dreschen“ festzulegen.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: die Männer von Sukkot
  rationale: אַנְשֵׁי ist maskulin und bedeutet hier wörtlich „Männer von“; die Wiedergabe vermeidet eine unbegründete Verallgemeinerung zu allen Einwohnern.
