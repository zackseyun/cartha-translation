  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: de
  text: Da zog Gideon auf dem Weg der Zeltbewohner östlich von Nobach und Jogbeha hinauf und schlug das Lager, als das Lager sich sicher wähnte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als das Lager sorglos war“. Das hebräische Wort bezeichnet Sicherheit oder Zuversicht und kann hier bedeuten, dass das Lager nicht mit einem Angriff rechnete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: Bewahrt die Grundbedeutung von עלה und den hebräischen Bewegungsausdruck, ohne bereits einen militärischen Angriff in das Verb hineinzulesen.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: auf dem Weg der Zeltbewohner
  rationale: Gibt die Wegangabe knapp und verständlich wieder; „Zeltbewohner“ bleibt näher am Hebräischen als das deutendere „Nomaden“.
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: östlich von Nobach und Jogbeha
  rationale: Im geografischen Zusammenhang bezeichnet מִקֶּדֶם die Lage östlich der genannten Orte.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: schlug das Lager
  rationale: „Schlug“ erhält die Breite und Direktheit von נכה; die genaue militärische Wirkung wird nicht überbestimmt.
- source_word: בֶטַח
  choice: während es sich in Sicherheit wähnte
  rationale: Die Formulierung bewahrt den Bedeutungsbereich von Sicherheit und Zuversicht und macht im Kontext verständlich, dass das Lager nicht mit einem Angriff rechnete.
