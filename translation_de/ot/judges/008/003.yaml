source:
  edition: WLC
  text: בְּ/יֶדְ/כֶם֩ נָתַ֨ן אֱלֹהִ֜ים אֶת שָׂרֵ֤י מִדְיָן֙ אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֔ב וּ/מַה יָּכֹ֖לְתִּי עֲשׂ֣וֹת כָּ/כֶ֑ם אָ֗ז רָפְתָ֤ה רוּחָ/ם֙ מֵֽ/עָלָ֔י/ו בְּ/דַבְּר֖/וֹ הַ/דָּבָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: de
  text: Gott hat die Fürsten von Midian, Oreb und Seeb, in eure Hand gegeben. Was habe ich im Vergleich zu euch vollbringen können? Als er das sagte, ließ ihr Zorn gegen ihn nach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da ließ ihr Geist von über ihm ab.“ Gemeint ist, dass ihre feindselige Erregung nachließ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: Gott hat … in eure Hand gegeben
  rationale: Die deutsche Wendung bewahrt das hebräische Bild der Hand als Macht- und Verfügungsbereich. Das Perfekt passt zum gegenwärtigen Ergebnis des kurz zuvor erfolgten Sieges.
- source_word: שָׂרֵי מִדְיָן
  choice: die Fürsten von Midian
  rationale: „Fürsten“ gibt den Rang der שָׂרִים würdig und präzise wieder; gemeint sind die namentlich genannten midianitischen Anführer.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: Oreb und Seeb
  rationale: Die Eigennamen werden in den im Deutschen bibelsprachlich etablierten Formen wiedergegeben.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: Was habe ich im Vergleich zu euch vollbringen können?
  rationale: כָכֶם ist hier vergleichend. Gideon stellt seine eigene Leistung beschwichtigend hinter die der Ephraimiter zurück; „vollbringen“ klingt dabei natürlich und würdig.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: ließ ihr Zorn gegen ihn nach
  rationale: Die wörtliche Wendung „ihr Geist ließ von über ihm ab“ bezeichnet im Kontext das Abklingen ihrer feindseligen Erregung. Die idiomatische Wiedergabe macht den Sinn klar, während die Fußnote das hebräische Bild bewahrt.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: Als er das sagte
  rationale: Die Infinitivkonstruktion bezeichnet den Anlass beziehungsweise Zeitpunkt. „Als er das sagte“ ist im modernen Deutschen natürlicher als die formale Wiedergabe „als er dieses Wort sprach“.
