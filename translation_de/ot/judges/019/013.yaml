  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: de
  text: 'Er sagte zu seinem Begleiter[a]: „Komm, lass uns zu einem der Orte weitergehen und in Gibea oder Rama übernachten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jungen Mann“; auch „Diener“ oder „Bediensteter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: zu seinem Begleiter
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Im Zusammenhang ist der männliche Reisebegleiter des Leviten gemeint; „Begleiter“ beschreibt seine Funktion, ohne sein Alter oder seinen sozialen Status stärker festzulegen als der Kontext.
- source_word: לְךָ
  choice: Komm
  rationale: Der Imperativ von הלך bedeutet wörtlich „Geh“. In Verbindung mit dem anschließenden Kohortativ, der zu gemeinsamem Handeln auffordert, ist „Komm“ im Deutschen die natürliche Einladung zum gemeinsamen Weitergehen.
- source_word: וְנִקְרְבָה
  choice: lass uns … weiterziehen
  rationale: Der Kohortativ bezeichnet eine Aufforderung zu gemeinsamer Bewegung auf ein Ziel zu. „Weiterziehen“ gibt dies im vorliegenden Reisekontext natürlich wieder; die Zielrichtung wird durch „zu einem dieser Orte“ ausgedrückt.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: zu einem dieser Orte
  rationale: Gemeint ist einer der in Betracht gezogenen nahe gelegenen Orte, die unmittelbar danach als Gibea und Rama benannt werden. „Dieser“ macht den situativen Bezug im Deutschen deutlich.
- source_word: וְלַנּוּ
  choice: übernachten
  rationale: לון bezeichnet das Verbringen der Nacht beziehungsweise das nächtliche Quartiernehmen. „Übernachten“ ist die klare und natürliche moderne Wiedergabe.
- source_word: בַגִּבְעָה
  choice: in Gibea
  rationale: Der Ortsname wird in der im Deutschen üblichen biblischen Form „Gibea“ wiedergegeben; „in“ passt zum Aufenthalt innerhalb einer Ortschaft.
- source_word: בָרָמָה
  choice: in Rama
  rationale: Der Ortsname wird in der im Deutschen üblichen biblischen Form „Rama“ wiedergegeben und parallel zu Gibea mit „in“ verbunden.
