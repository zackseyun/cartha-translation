  naturalness: Der Satz ist flüssiges modernes Standarddeutsch. „Weiterziehen“ ist im Reisebericht möglich, legt aber gegenüber dem mit „sich nähern/nahe kommen“ formulierten hebräischen Verb eine stärkere Fortsetzungsnuance nahe. „zu einem der Orte weitergehen“ ist ebenso natürlich und näher am Ausgangstext.
  terminology: „Begleiter“ ist als kontextuelle Wiedergabe von נַעַר vertretbar und wahrt die nicht eindeutig festlegbare soziale Rolle. Die Fußnote sollte die Alternativen idiomatisch und vollständig benennen.
