source:
  edition: WLC
  text: וַ/יָּ֨קָם אֲדֹנֶ֜י/הָ בַּ/בֹּ֗קֶר וַ/יִּפְתַּח֙ דַּלְת֣וֹת הַ/בַּ֔יִת וַ/יֵּצֵ֖א לָ/לֶ֣כֶת לְ/דַרְכּ֑/וֹ וְ/הִנֵּ֧ה הָ/אִשָּׁ֣ה פִֽילַגְשׁ֗/וֹ נֹפֶ֨לֶת֙ פֶּ֣תַח הַ/בַּ֔יִת וְ/יָדֶ֖י/הָ עַל הַ/סַּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: de
  text: 'Am Morgen stand ihr Herr auf, öffnete die Türen des Hauses und ging hinaus, um weiterzuziehen. Und siehe: Die Frau, seine Nebenfrau, lag[a] am Eingang des Hauses, ihre Hände auf der Schwelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „war hingefallen“ oder „lag gefallen da“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: ihr Herr
  rationale: Das Substantiv אֲדוֹן mit Suffix bedeutet wörtlich „ihr Herr“. Die Wiedergabe bewahrt das im Hebräischen bezeichnete asymmetrische Verhältnis, ohne die gegenseitiger klingende Bezeichnung „ihr Mann“ einzutragen.
- source_word: בַּבֹּקֶר
  choice: Am Morgen
  rationale: Schlichte und natürliche Wiedergabe der Zeitangabe.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: die Türen des Hauses
  rationale: Der Plural „Türen“ und das konkrete „Haus“ werden entsprechend dem Hebräischen bewahrt.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: ging hinaus, um weiterzuziehen
  rationale: Die Zweckkonstruktion wird erhalten; „weiterzuziehen“ gibt das Gehen auf seinem Weg in natürlichem modernem Deutsch wieder.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Der aufmerksamkeitslenkende Erzählmarker wird nicht zu einem bloßen zeitlichen Anschluss abgeflacht, sondern behält seine eindringliche Wirkung.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: Die Frau, seine Nebenfrau
  rationale: Die appositionelle Struktur bleibt erhalten. „Nebenfrau“ bezeichnet פִילֶגֶשׁ in verständlichem Deutsch genauer als das heute oft anders konnotierte „Konkubine“.
- source_word: נֹפֶלֶת
  choice: lag
  rationale: Das Partizip beschreibt hier ihren vorgefundenen Zustand am Eingang. „Lag“ ist idiomatisch; die formnähere Möglichkeit „war hingefallen“ wird in der Fußnote ausgewiesen.
- source_word: פֶּתַח הַבַּיִת
  choice: am Eingang des Hauses
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang; diese konkrete Ortsangabe passt zum Zusammenhang.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: ihre Hände auf der Schwelle
  rationale: Die verblosen hebräischen Worte werden als knappe, bildhafte Ergänzung beibehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, erschütternde Bildfolge des Hebräischen bleibt gewahrt. „Und siehe“ ist bewusst leicht gehoben, um die deiktische und dramatische Funktion von וְהִנֵּה wiederzugeben.
