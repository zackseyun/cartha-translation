  terminology: '»Ihr Mann«, »junger Diener«, »ein Paar Esel« und »die junge Frau« sind sachgerecht. Die Fußnote soll die konkrete textliche Schwierigkeit präziser benennen: Der Konsonantentext hat bei »zurückbringen« eine männliche Endung, während die Lesetradition die feminine Lesung bietet.'
