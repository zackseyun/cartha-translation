base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: de
  text: Da machte sich ihr Mann auf und ging ihr nach, um ihr zu Herzen zu reden und sie zurückzubringen.[a] Er hatte seinen jungen Diener und ein Paar Esel bei sich. Sie brachte ihn in das Haus ihres Vaters. Als der Vater der jungen Frau ihn sah, freute er sich, ihm entgegenzugehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um zu ihrem Herzen zu reden«. Die hebräische Wendung kann liebevolles oder eindringlich-überzeugendes Reden bezeichnen. Beim folgenden »zurückzubringen« hat der Konsonantentext eine männliche Endung; die Lesetradition und der Zusammenhang beziehen das Wort auf die Frau.'
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: Wörtlich »ihr Mann«; im ehelichen Zusammenhang bezeichnet der Ausdruck ihren Ehemann und klingt im Deutschen natürlich.
- source_word: לְדַבֵּר עַל לִבָּהּ
  choice: ihr zu Herzen reden
  rationale: Die deutsche Wendung bewahrt das hebräische Bild und kann wie das Original ein liebevolles oder eindringlich-überzeugendes Reden bezeichnen.
- source_word: ל/השיב/ו
  choice: sie zurückzubringen
  rationale: Der Zusammenhang verlangt die Frau als Ziel des Zurückbringens; die überlieferte Form ist jedoch textlich auffällig und wird deshalb in der Fußnote kenntlich gemacht.
- source_word: נַעֲרוֹ
  choice: seinen jungen Diener
  rationale: נַעַר kann einen jungen Mann oder Diener bezeichnen; als Reisebegleiter ist hier »junger Diener« sachgerecht.
- source_word: צֶמֶד חֲמֹרִים
  choice: ein Paar Esel
  rationale: צֶמֶד bezeichnet ein Paar; die Übersetzung vermeidet die nicht zwingende Festlegung, dass die Tiere eingespannt waren.
- source_word: וַתְּבִיאֵהוּ
  choice: Sie führte ihn
  rationale: Das feminine Verb nennt die Frau als Subjekt; »führte ihn in das Haus« gibt die gerichtete Bewegung natürlich wieder.
- source_word: הַנַּעֲרָה
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet hier die zuvor genannte Frau; »junge Frau« ist modern und weniger missverständlich als »Mädchen«.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: freute er sich, ihm entgegenzugehen
  rationale: Die Formulierung gibt sowohl die Freude als auch die in לִקְרָאתוֹ enthaltene Bewegung auf den Ankommenden zu wieder.
