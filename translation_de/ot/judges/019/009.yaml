base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: de
  text: 'Als der Mann aufstand, um mit seiner Nebenfrau und seinem Diener aufzubrechen, sagte sein Schwiegervater, der Vater der jungen Frau, zu ihm: „Sieh, der Tag neigt sich dem Abend zu. Bleibt doch über Nacht. Sieh, der Tag ist fast vorüber[a]. Bleib hier über Nacht und sei guten Mutes. Morgen brecht ihr früh zu eurer Weiterreise auf[b], und du gehst nach Hause[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der Tag lagert sich“ – ein Bild dafür, dass der Tag zur Ruhe beziehungsweise zu Ende kommt.'
    reason: source_image
  - marker: b
    text: „Brecht ihr auf“ steht im Plural und richtet sich an die Reisegruppe; das folgende „du gehst“ steht im Singular und richtet sich an den Mann.
    reason: grammar
  - marker: c
    text: 'Wörtlich: „Geh zu deinem Zelt“; hier eine herkömmliche Ausdrucksweise für die Heimkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Die gewöhnliche Bezeichnung „Mann“ bewahrt den Erzählstil; „Ehemann“ wäre hier spezifischer als der hebräische Ausdruck.
- source_word: פִילַגְשׁוֹ
  choice: seine Nebenfrau
  rationale: „Nebenfrau“ bezeichnet die damalige soziale Stellung verständlich und angemessen, ohne sie zu einer Ehefrau im uneingeschränkten Sinn umzudeuten.
- source_word: נַעֲרוֹ
  choice: sein Diener
  rationale: Im Zusammenhang bezeichnet נַעַר den mitreisenden Bediensteten; sein Alter steht nicht im Vordergrund.
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: sein Schwiegervater, der Vater der jungen Frau
  rationale: Die Apposition erklärt das Verwandtschaftsverhältnis ausdrücklich und wird vollständig bewahrt.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: der Tag neigt sich dem Abend zu
  rationale: Die Formulierung gibt das Schwinden des Tageslichts idiomatisch und bildhaft wieder.
- source_word: לִינוּ נָא
  choice: Bleibt doch über Nacht
  rationale: Der Imperativ steht im Plural und schließt die Reisegruppe ein; „doch“ vermittelt die bittende Partikel נָא natürlich.
- source_word: חֲנוֹת הַיּוֹם
  choice: der Tag ist fast vorüber
  rationale: Die Hauptzeile vermittelt den zeitlichen Sinn der ungewöhnlichen Wendung; das wörtliche Bild vom sich lagernden Tag wird in der Fußnote dokumentiert.
- source_word: לִין פֹּה
  choice: Bleib hier über Nacht
  rationale: Dieser zweite Imperativ steht im Singular und richtet sich unmittelbar an den Mann.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: dein Herz soll guter Dinge sein
  rationale: Die Wiedergabe bewahrt das hebräische Herzbild und drückt zugleich innere Freude beziehungsweise Wohlbefinden in verständlichem Deutsch aus.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר לְדַרְכְּכֶם
  choice: Morgen brecht ihr früh zu eurer Weiterreise auf
  rationale: Die Pluralformen sprechen die Reisegruppe an; „Weiterreise“ gibt den Weg im Zusammenhang natürlich wieder.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: und du gehst nach Hause
  rationale: Der Singular richtet sich wieder an den Mann. „Zu deinem Zelt“ ist hier eine herkömmliche Wendung für die Rückkehr nach Hause und könnte wörtlich missverstanden werden.
