- from: So zogen sie weiter. Als sie sich Gibea näherten, das zu Benjamin gehört, ging die Sonne über ihnen unter.[a]
  to: So zogen sie weiter und gingen ihres Weges; die Sonne ging ihnen nahe bei Gibea unter, das zu Benjamin gehört.[a]
  rationale: Die Revision stellt die Ortsangabe „nahe bei Gibea“ wieder her, bindet sie syntaktisch an den Sonnenuntergang und bewahrt zugleich die Abfolge der beiden Bewegungsverben in natürlichem Deutsch. Die Fußnote bleibt als sachgerechte, nicht einengende lexikalische Alternative erhalten.
