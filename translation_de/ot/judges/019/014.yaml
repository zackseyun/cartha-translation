base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: de
  text: So zogen sie weiter und gingen ihres Weges; die Sonne ging ihnen nahe bei Gibea unter, das zu Benjamin gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das im Gebiet Benjamins liegt“. Der hebräische Ausdruck ordnet Gibea dem Stamm beziehungsweise Stammesgebiet Benjamin zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ וַיֵּלֵכוּ
  choice: So zogen sie weiter
  rationale: Die beiden aufeinanderfolgenden Bewegungsverben beschreiben, dass die Reisenden am zuvor erwogenen Ort vorbeiziehen und ihre Reise fortsetzen. Im Deutschen gibt „zogen sie weiter“ dies natürlich wieder, ohne die hebräische Doppelung schwerfällig nachzuahmen.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: ging die Sonne über ihnen unter
  rationale: Die Wendung bedeutet in diesem Reisebericht, dass sie bei Sonnenuntergang noch unterwegs waren beziehungsweise die Nacht sie einholte. Die gewählte Formulierung bewahrt das Bild der über ihnen untergehenden Sonne.
- source_word: אֵצֶל
  choice: als sie sich … näherten
  rationale: אֵצֶל bezeichnet räumliche Nähe. Zusammen mit dem Bewegungszusammenhang ist die verbale deutsche Formulierung idiomatisch und macht deutlich, dass sie in die Nähe Gibéas gelangten.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Hier bezeichnet das Wort aufgrund des Zusammenhangs und der Zuordnung zu Benjamin den Ortsnamen Gibea, nicht allgemein einen Hügel.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: das zu Benjamin gehört
  rationale: Die Konstruktion mit לְ kennzeichnet die Zugehörigkeit Gibéas zu Benjamin, also zum Stamm beziehungsweise Stammesgebiet.
