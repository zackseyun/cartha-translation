source:
  edition: WLC
  text: הֵ֣ם עִם יְב֔וּס וְ/הַ/יּ֖וֹם רַ֣ד מְאֹ֑ד וַ/יֹּ֨אמֶר הַ/נַּ֜עַר אֶל אֲדֹנָ֗י/ו לְכָ/ה נָּ֛א וְ/נָס֛וּרָה אֶל עִֽיר הַ/יְבוּסִ֥י הַ/זֹּ֖את וְ/נָלִ֥ין בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: de
  text: 'Als sie bei Jebus[a] waren und der Tag schon weit fortgeschritten war[b], sagte der junge Mann[c] zu seinem Herrn: »Komm doch, lass uns in diese Stadt der Jebusiter abbiegen und dort übernachten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jebus ist der frühere Name Jerusalems.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher: »und der Tag war schon sehr weit gesunken«; sinngemäß: »es war schon sehr spät geworden«.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann je nach Zusammenhang auch einen Diener oder Begleiter bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: als sie bei Jebus waren
  rationale: עִם bedeutet gewöhnlich »mit«, bezeichnet hier im Reisekontext bei einem Ortsnamen aber die räumliche Nähe. »Bei Jebus« gibt den Sinn knapp und natürlich wieder.
- source_word: יְבוּס
  choice: Jebus
  rationale: Der ältere Ortsname des hebräischen Textes bleibt erhalten und wird nicht im Haupttext durch die spätere Bezeichnung Jerusalem ersetzt.
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: und der Tag schon weit fortgeschritten war
  rationale: Die Wendung beschreibt das deutliche Sinken beziehungsweise Verstreichen des Tages gegen Abend. Die Übersetzung bewahrt dieses Zeitbild in verständlichem Deutsch.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר kann einen Jungen, jungen Mann oder kontextuell einen Diener beziehungsweise Begleiter bezeichnen. »Der junge Mann« wahrt die lexikalische Offenheit; seine untergeordnete Stellung ergibt sich aus der Anrede seines Herrn.
- source_word: אֲדֹנָיו
  choice: seinem Herrn
  rationale: אֲדוֹן bezeichnet hier den gesellschaftlich übergeordneten Herrn des jungen Begleiters. »Herr« ist im Deutschen natürlich und kontextgerecht.
- source_word: לְכָה נָּא
  choice: Komm doch
  rationale: Der Bewegungsimperativ wird durch נָא als Bitte oder dringlicher Vorschlag abgemildert. »Komm doch« gibt beides idiomatisch wieder.
- source_word: וְנָסוּרָה
  choice: lass uns … abbiegen
  rationale: Die Kohortativform bezeichnet das Abweichen vom bisherigen Reiseweg, um den Ort aufzusuchen. »Abbiegen« ist in diesem Wegkontext natürlich und präzise.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: diese Stadt der Jebusiter
  rationale: Das Gentiliz ist kollektiv auf die Volksgruppe bezogen; der Demonstrativ wird ausdrücklich mit »diese« wiedergegeben.
- source_word: וְנָלִין בָּהּ
  choice: und dort übernachten
  rationale: לוּן bezeichnet das Verbringen der Nacht. Das adverbiale »dort« bezieht sich im Deutschen natürlicher auf die genannte Stadt als das wörtlichere »in ihr«.
