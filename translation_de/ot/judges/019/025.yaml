  terminology: „Nebenfrau“ ist für פילגש eine gut verständliche moderne Bezeichnung. Die Fußnote sollte nicht behaupten, die deutsche Haupttextformulierung sei wörtlich; sie muss ausdrücklich den hebräischen Wortlaut erläutern. „Vergewaltigung“ ist angesichts des unmittelbaren Zwangskontexts als Kontextklärung gerechtfertigt.
