base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: de
  text: Aber die Männer wollten nicht auf ihn hören. Da packte der Mann seine Nebenfrau und brachte sie zu ihnen hinaus. Sie hatten Geschlechtsverkehr mit ihr[a] und misshandelten sie die ganze Nacht bis zum Morgen. Beim Anbruch der Morgenröte ließen sie sie gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie erkannten sie“; im Hebräischen ein verhüllender Ausdruck für Geschlechtsverkehr. Im vorliegenden Kontext bezeichnet er sexuelle Gewalt, also Vergewaltigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ
  choice: wollten nicht
  rationale: Gibt die fehlende Bereitschaft beziehungsweise Weigerung knapp und natürlich wieder.
- source_word: לִשְׁמֹעַ לוֹ
  choice: auf ihn hören
  rationale: Bewahrt die mögliche Bedeutung von Hören beziehungsweise Befolgen, ohne sie auf ausdrücklichen Gehorsam festzulegen.
- source_word: וַיַּחֲזֵק
  choice: packte
  rationale: Drückt das gewaltsame Ergreifen klar aus und vermeidet ein verharmlosendes „nahm“.
- source_word: פִּילַגְשׁוֹ
  choice: seine Nebenfrau
  rationale: Bezeichnet die soziale Stellung im Deutschen verständlicher als das heute fremd oder abwertend klingende „Konkubine“.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: brachte sie zu ihnen hinaus
  rationale: Gibt sowohl den kausativen Sinn von יצא als auch הַחוּץ wieder, ohne unnatürliche Wiederholung.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: sie erkannten sie
  rationale: Bewahrt den hebräischen Euphemismus und seine erschütternde Zurückhaltung; die Fußnote erklärt den sexuellen und gewaltsamen Sinn im Kontext.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: misshandelten sie
  rationale: Gibt die entwürdigende, gewaltsame Behandlung klar und in heutigem Deutsch wieder.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: die ganze Nacht bis zum Morgen
  rationale: Bewahrt Dauer und zeitliche Grenze der Aussage unmittelbar.
- source_word: וַיְשַׁלְּחוּהָ
  choice: ließen sie sie gehen
  rationale: Entspricht hier dem kontextuellen Sinn von Freilassen beziehungsweise Fortgehenlassen.
- source_word: בעלות הַשָּׁחַר
  choice: Beim Anbruch der Morgenröte
  rationale: Gibt das Bild des aufgehenden Tages natürlich und würdig wieder.
theological_decisions:
- issue: Darstellung der sexuellen Gewalt
  choice: Der hebräische Euphemismus bleibt im Haupttext erhalten und wird in einer Fußnote eindeutig erläutert.
  alternative: „Sie vergewaltigten sie“ unmittelbar im Haupttext.
  rationale: So bleiben sowohl die Ausdrucksweise des Ausgangstextes als auch der im Kontext unzweideutige Zwang sichtbar, ohne die Gewalt zu beschönigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze bewahren die harte Erzählweise. „Nebenfrau“ ist verständlich und sozialgeschichtlich annähernd, während die Fußnote den bewusst verhüllenden Ausdruck für die sexuelle Gewalt erklärt.
