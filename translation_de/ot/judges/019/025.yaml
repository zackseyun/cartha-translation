  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen hebräischen Ausdrücke insgesamt treffend wieder: die Männer verweigern die Bitte, der Mann ergreift seine Nebenfrau und bringt sie hinaus; die Gewalt dauert die ganze Nacht, und bei Tagesanbruch wird sie fortgeschickt. „Nebenfrau“, „packte“, „brachte sie zu ihnen hinaus“, „misshandelten“ und „ließen sie sie gehen“ sind quellentreu und angemessen. Problematisch ist allein „Sie erkannten sie“: Im heutigen Deutsch bedeutet dies gewöhnlich, dass sie sie wiedererkannten, und vermittelt daher weder die sexuelle Bedeutung von ידע noch dessen hier funktionierenden Euphemismus.'
