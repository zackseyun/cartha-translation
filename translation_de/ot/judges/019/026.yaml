base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: de
  text: Die Frau kam, als der Morgen anbrach[a], und fiel am Eingang des Hauses des Mannes nieder, wo ihr Herr[b] war. Dort blieb sie liegen, bis es hell wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen Morgen“ beziehungsweise „vor Tagesanbruch“. Wörtlich: „beim Sich-Wenden des Morgens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Gebieter“. Das hebräische Wort bezeichnet eine Autoritätsperson und bedeutet hier nicht ausdrücklich „ihr Mann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: als der Morgen anbrach
  rationale: Die Wendung mit פנה bezeichnet das Herannahen beziehungsweise Anbrechen des Morgens. Die deutsche Formulierung ist natürlich und bewahrt den zeitlichen Übergang, ohne ihn auf einen exakten Zeitpunkt festzulegen.
- source_word: וַתָּבֹא
  choice: kam
  rationale: בוא ist das allgemeine Verb für kommen oder eintreffen. „Kehrte zurück“ wäre im Zusammenhang denkbar, fügte aber eine im Verb selbst nicht ausdrücklich enthaltene Bedeutung hinzu.
- source_word: וַתִּפֹּל
  choice: fiel … nieder
  rationale: נפל bedeutet unmittelbar „fallen“. „Brach zusammen“ würde Ursache und Heftigkeit stärker ausdeuten. Der anschließende Satz „Dort blieb sie liegen“ macht im Deutschen den durch עַד הָאוֹר vorausgesetzten andauernden Zustand verständlich.
- source_word: פֶּתַח בֵּית הָאִישׁ
  choice: am Eingang des Hauses des Mannes
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang. הָאִישׁ bleibt entsprechend dem schlichten hebräischen Ausdruck „der Mann“, ohne ihn erklärend als Hausherrn oder alten Mann zu bezeichnen.
- source_word: אֲדוֹנֶיהָ
  choice: ihr Herr
  rationale: אדון mit Suffix bedeutet „ihr Herr/Gebieter“ und bezeichnet hier ein Autoritätsverhältnis. „Ihr Mann“ würde die Beziehung eindeutiger als der hebräische Wortlaut bestimmen.
- source_word: אֲשֶׁר ... שָׁם
  choice: wo … war
  rationale: Die Verbindung aus Relativpartikel und Ortsadverb wird im Deutschen idiomatisch mit „wo“ wiedergegeben.
- source_word: עַד הָאוֹר
  choice: bis es hell wurde
  rationale: Die Wendung bezeichnet die Dauer bis zum Tageslicht. Diese Wiedergabe ist natürlich und vermeidet das im Deutschen ungewöhnliche wörtliche „bis zum Licht“.
theological_decisions:
- issue: Bezeichnung des Leviten als אֲדוֹנֶיהָ
  choice: ihr Herr
  alternative: ihr Mann / ihr Gebieter
  rationale: „Ihr Herr“ erhält die soziale und autoritative Spannung des Ausdrucks, ohne die Beziehung ausdrücklich als Ehe zu definieren oder mit „Gebieter“ interpretierend zu verschärfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Härte der Erzählung bleibt erhalten. Der zweite Satz ergänzt lediglich den im Hebräischen durch „bis es hell wurde“ vorausgesetzten fortdauernden Zustand und verhindert die missverständliche deutsche Lesart, das Fallen selbst habe bis zum Morgen gedauert.
