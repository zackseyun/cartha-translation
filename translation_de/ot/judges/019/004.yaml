base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: de
  text: Da drängte ihn sein Schwiegervater[a], der Vater der jungen Frau, zu bleiben, und er blieb drei Tage bei ihm; sie aßen und tranken und übernachteten dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »setzte ihm zu«, »bewog ihn« oder »hielt ihn zurück«. Die hebräische Wendung lautet wörtlich: Sein Schwiegervater »war stark gegen ihn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: Da drängte ihn … zu bleiben
  rationale: Die Wendung חזק ב bezeichnet hier nachdrückliches Einwirken. »Zu bleiben« ergibt sich aus dem folgenden Satz und macht den Zusammenhang im Deutschen natürlich verständlich, ohne Zwang zu unterstellen.
- source_word: חֹתְנוֹ
  choice: sein Schwiegervater
  rationale: Das Verwandtschaftswort bezeichnet hier den Vater der Frau aus der Perspektive des Leviten; »Schwiegervater« ist die natürliche deutsche Entsprechung.
- source_word: אֲבִי הַנַּעֲרָה
  choice: der Vater der jungen Frau
  rationale: Die Apposition präzisiert »Schwiegervater«. נַעֲרָה wird im ehelichen Kontext angemessen mit »junge Frau« wiedergegeben.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: So blieb er … bei ihm
  rationale: ישב bedeutet hier im Erzählzusammenhang, weiterhin bei jemandem zu bleiben; »so« bildet die Folge des Drängens natürlich ab.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage
  rationale: Direkte Wiedergabe der Zeitangabe.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: sie aßen und tranken
  rationale: Die beiden einfachen Verben werden unverändert wiedergegeben und nicht deutend zu »feierten« oder »hielten ein Festmahl« zusammengezogen.
- source_word: וַיָּלִינוּ שָׁם
  choice: und übernachteten dort
  rationale: לון bezeichnet das Verbringen der Nacht. Der Plural und der dreitägige Zusammenhang lassen wiederholtes Übernachten erkennen.
