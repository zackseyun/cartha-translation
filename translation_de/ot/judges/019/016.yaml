  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: de
  text: Und da kam am Abend ein alter Mann von seiner Arbeit auf dem Feld. Der Mann stammte aus dem Bergland Ephraim und hielt sich als Fremder in Gibea[a] auf; die Männer des Ortes aber waren Benjaminiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch mit „wohnte als Fremder“ oder „hielt sich als Zugezogener auf“ wiedergegeben werden. Es bezeichnet ihn als jemanden, der nicht aus Gibea stammte, ohne eindeutig zu sagen, wie dauerhaft sein Aufenthalt war.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh, da
  rationale: Bewahrt das hebräische Aufmerksamkeitssignal und den erzählerischen Einsatz in natürlichem, gehobenem Deutsch.
- source_word: אִישׁ זָקֵן
  choice: ein alter Mann
  rationale: Direkte und allgemein verständliche Wiedergabe von Substantiv und Adjektiv.
- source_word: בָּא מִמַּעֲשֵׂהוּ מִן־הַשָּׂדֶה
  choice: kam von seiner Arbeit auf dem Feld
  rationale: Gibt beide mit מן eingeleiteten Angaben idiomatisch wieder, ohne im Deutschen ein schwerfälliges doppeltes „von“ zu erzeugen.
- source_word: בָּעֶרֶב
  choice: am Abend
  rationale: Knappes und natürliches deutsches Zeitadverbial.
- source_word: מֵהַר אֶפְרַיִם
  choice: stammte aus dem Bergland Ephraim
  rationale: „Bergland Ephraim“ bezeichnet hier die geografische Region; „stammte aus“ drückt die Herkunft idiomatisch aus.
- source_word: גָר בַּגִּבְעָה
  choice: lebte als Fremder in Gibea
  rationale: גור bezeichnet das Wohnen oder Sich-Aufhalten eines Ortsfremden und lässt offen, ob der Aufenthalt zeitlich begrenzt war.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: die Männer des Ortes aber
  rationale: Das nachgestellte „aber“ macht den sachlichen Kontrast zwischen der Herkunft des alten Mannes und der Stammeszugehörigkeit der Einheimischen sichtbar.
- source_word: בְּנֵי יְמִינִי
  choice: Benjaminiter
  rationale: Idiomatiche moderne Wiedergabe der Stammesbezeichnung, wörtlich „Söhne Benjamins“.
