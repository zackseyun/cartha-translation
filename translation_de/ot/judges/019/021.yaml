  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: de
  text: Da brachte er ihn in sein Haus und mischte Futter für die Esel[a]. Dann wuschen sie sich die Füße[b], aßen und tranken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bereitete Futter für die Esel zu“; wörtlich steht ein Verb mit der Bedeutung „mischen“.'
    reason: lexical_alternative
  - marker: b
    text: Das Waschen der Füße gehörte im Alten Vorderen Orient zur üblichen Gastfreundschaft gegenüber Reisenden.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: Da brachte er ihn
  rationale: Der Hifil von בוא bezeichnet hier das Hineinbringen; die Formulierung bewahrt den handelnden Gastgeber und den aufgenommenen Leviten als Objekt.
- source_word: לְבֵיתוֹ
  choice: in sein Haus
  rationale: Nach dem Bewegungsverb gibt לְבֵיתוֹ das Ziel und im Kontext den Eintritt in das Haus an.
- source_word: וַיָּבָול
  choice: mischte Futter
  rationale: Die seltene Form wird im Kontext von בלל „mischen“ her verstanden und bezeichnet das Zubereiten beziehungsweise Mischen von Tierfutter. Die konkrete Wiedergabe bewahrt mehr vom hebräischen Ausdruck als das allgemeinere „fütterte“.
- source_word: לַחֲמוֹרִים
  choice: für die Esel
  rationale: חֲמוֹרִים bezeichnet Esel; die Präposition markiert hier die Tiere, für die das Futter zubereitet wurde.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: sie wuschen sich die Füße
  rationale: Die deutsche reflexive Form ist idiomatisch und gibt die Handlung der Reisegruppe natürlich wieder.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: aßen und tranken
  rationale: Die knappe Koordination entspricht dem fortlaufenden hebräischen Erzählstil.
