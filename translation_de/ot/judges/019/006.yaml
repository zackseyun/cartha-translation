  text: וַ/יֵּשְׁב֗וּ וַ/יֹּאכְל֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וַ/יִּשְׁתּ֑וּ וַ/יֹּ֜אמֶר אֲבִ֤י הַֽ/נַּעֲרָה֙ אֶל הָ/אִ֔ישׁ הֽוֹאֶל נָ֥א וְ/לִ֖ין וְ/יִטַ֥ב לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: de
  text: 'Da setzten sich die beiden zusammen, aßen und tranken. Dann sagte der Vater der jungen Frau zu dem Mann: »Bitte, bleib doch über Nacht, und lass dein Herz froh sein.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatisch: „und sei guter Dinge.“'
    reason: Die hebräische Wendung וְיִטַב לִבֶּךָ lautet wörtlich etwa „und dein Herz werde gut/wohl“ und bezeichnet in diesem Zusammenhang eine frohe oder zuversichtliche Stimmung.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Da setzten sie sich
  rationale: ישׁב eröffnet hier in der fortlaufenden Erzählung die gemeinsame Mahlzeit. „Sich setzen“ gibt den Vorgang im Deutschen natürlich wieder, ohne ein längeres Verweilen vorauszusetzen.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: die beiden zusammen
  rationale: Die Formulierung bewahrt die nachdrückliche Verbindung von „beide“ und „zusammen“.
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: aßen und tranken
  rationale: Direkte Wiedergabe der beiden Verben; wie im Hebräischen wird bei „tranken“ kein Objekt ergänzt.
- source_word: אֲבִי הַנַּעֲרָה
  choice: der Vater der jungen Frau
  rationale: נַעֲרָה bezeichnet hier eine junge Frau. Diese Wiedergabe ist im heutigen Deutsch natürlich und dem erzählerischen Zusammenhang angemessen.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Obwohl der weitere Kontext seine Beziehung zu der jungen Frau erkennen lässt, steht hier ausdrücklich das allgemeine Wort אִישׁ; daher wird nicht „Ehemann“ eingesetzt.
- source_word: הוֹאֶל נָא
  choice: Bitte, sei bereit
  rationale: יאל bezeichnet Bereitschaft beziehungsweise Einwilligung; נָא verleiht der Aufforderung einen höflich-bittenden Ton.
- source_word: וְלִין
  choice: über Nacht zu bleiben
  rationale: לון bedeutet, die Nacht an einem Ort zu verbringen. Die gewählte Formulierung ist klar und modern.
- source_word: וְיִטַב לִבֶּךָ
  choice: und lass dein Herz fröhlich sein
  rationale: Die Wendung lautet sinngemäß, dass es dem Herzen gut gehen oder es guter Dinge sein soll. Die Übersetzung bewahrt das im Hebräischen ausdrücklich genannte Herz und gibt die gastfreundliche Einladung verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfliche Bitte und die konkrete Herz-Metaphorik des Hebräischen bleiben erhalten; der Satzbau ist für eine flüssige deutsche Erzählung leicht geglättet.
