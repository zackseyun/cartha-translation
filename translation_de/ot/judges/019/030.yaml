base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: de
  text: 'Und jeder, der es sah, sagte: »So etwas ist von dem Tag an, an dem die Söhne Israels[a] aus dem Land Ägypten heraufzogen, bis zum heutigen Tag weder geschehen noch gesehen worden. Denkt darüber nach, beratet euch und sprecht!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Israeliten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: Und jeder, der es sah, sagte
  rationale: וְהָיָה führt hier die eingetretene Reaktion ein. Im modernen Deutschen gibt die fortlaufende Formulierung mit „Und jeder … sagte“ diese Diskursfunktion natürlich wieder, ohne das altertümlich wirkende „Und es geschah“ einzuschieben.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: So etwas ist … weder geschehen noch gesehen worden
  rationale: Die weder-noch-Konstruktion bewahrt die doppelte Verneinung und beide Verben des Hebräischen. „So etwas“ gibt das substantivisch gebrauchte כָּזֹאת idiomatisch wieder.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: von dem Tag an, an dem die Söhne Israels aus dem Land Ägypten heraufzogen
  rationale: Die Formulierung bildet den zeitlichen Ausgangspunkt und die Exodus-Wendung mit עֲלוֹת genau ab. „Söhne Israels“ wahrt die konkrete Form des hebräischen Ethnonyms; die geläufigere Wiedergabe steht in der Fußnote.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Dies entspricht der zeitlichen Spanne bis zur Gegenwart des Erzählers und klingt im Deutschen klar und würdevoll.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: Denkt darüber nach
  rationale: Die hebräische Wendung fordert dazu auf, die Sache bewusst zu bedenken. Die deutsche Formulierung gibt diesen idiomatischen Sinn natürlich wieder, ohne ein im Ausgangstext nicht ausdrücklich genanntes „Herz“ einzuführen.
- source_word: עֻצוּ
  choice: beratet euch
  rationale: Der Imperativ bezeichnet gemeinschaftliche Beratung und Abwägung; das reflexive „beratet euch“ trifft diesen Sinn im Deutschen.
- source_word: וְדַבֵּרוּ
  choice: und sprecht
  rationale: Die knappe, objektlose Aufforderung des Hebräischen bleibt bewusst offen und nachdrücklich.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptfassung bewahrt die formale Bildlichkeit und grammatische Gestalt des hebräischen Ausdrucks. Da er zugleich als festes Ethnonym für das ganze Volk gebraucht wird, nennt die Fußnote die natürliche deutsche Alternative, ohne den Text konfessionell festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die erschütternde Feststellung und die drei abschließenden Aufforderungen bleiben knapp und ungemildert; die offene Bedeutung von „sprecht“ wird nicht durch einen ergänzten Gegenstand eingeengt.
