  source_fidelity: 'Der Text gibt die hebräische Satzfolge und Aussage zuverlässig wieder: die allgemeine Reaktion aller Betrachter, die zweigliedrige Aussage vom beispiellosen Geschehen bzw. Gesehenwerden, den Zeitraum seit dem Auszug aus Ägypten sowie die drei knappen Aufforderungen. „Sprecht!“ lässt den im Hebräischen nicht genannten Gegenstand zu Recht offen.'
  naturalness: Modernes Standarddeutsch in einem angemessen würdigen Erzählregister. Die Formulierung „weder geschehen noch gesehen worden“ ist trotz der bewusst nahen Abbildung der hebräischen Doppelung verständlich und idiomatisch vertretbar. „Bis zum heutigen Tag“ funktioniert als etablierte erzählerische Zeitformel.
  terminology: „Söhne Israels“ bildet בני ישראל formal getreu ab; die Fußnote bietet mit „die Israeliten“ die natürliche ethnonymische Alternative. „Aus dem Land Ägypten heraufzogen“ entspricht der biblisch-hebräischen Exodusformel. Die Imperative „Denkt darüber nach, beratet euch und sprecht!“ treffen die deliberative und abschließend offene hebräische Aufforderung.
