  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֛רְא אֶת הָ/אִ֥ישׁ הָ/אֹרֵ֖חַ בִּ/רְחֹ֣ב הָ/עִ֑יר וַ/יֹּ֨אמֶר הָ/אִ֧ישׁ הַ/זָּקֵ֛ן אָ֥נָה תֵלֵ֖ךְ וּ/מֵ/אַ֥יִן תָּבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: de
  text: 'Er blickte auf und sah den Reisenden auf dem Platz der Stadt[a]. Da fragte der alte Mann: »Wohin gehst du, und woher kommst du?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der breiten Straße der Stadt«. Das hebräische Wort bezeichnet einen breiten öffentlichen Raum, meist einen Platz, kann aber auch eine breite Straße meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Er blickte auf
  rationale: Die hebräische Wendung bedeutet wörtlich »er erhob seine Augen«. »Er blickte auf« gibt die idiomatische Bedeutung im modernen Deutschen natürlich wieder.
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Verb bezeichnet hier schlicht das visuelle Wahrnehmen; »sah« ist direkt und lässt offen, ob ein besonderes Bemerken gemeint ist.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: den Reisenden
  rationale: אֹרֵחַ bezeichnet einen Menschen auf der Reise. »Reisenden« ist modern und vermeidet, ihn bereits als aufgenommenen Gast darzustellen.
- source_word: בִּרְחֹב הָעִיר
  choice: auf dem Platz der Stadt
  rationale: רְחוֹב bezeichnet typischerweise einen breiten öffentlichen Platz. Die Präposition »auf« entspricht dem natürlichen deutschen Sprachgebrauch bei einem Platz.
- source_word: הָאִישׁ הַזָּקֵן
  choice: der alte Mann
  rationale: Die Formulierung gibt die Altersangabe unmittelbar und erzählerisch natürlich wieder.
- source_word: אָנָה תֵלֵךְ
  choice: Wohin gehst du
  rationale: אָנָה fragt nach dem Ziel; die deutsche Präsensform passt zur unmittelbaren Reisesituation.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: und woher kommst du
  rationale: Die Wendung fragt nach der Herkunft beziehungsweise dem Ausgangspunkt der Reise und bildet den Ziel-Herkunft-Kontrast des Hebräischen natürlich ab.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die koordinierte hebräische Satzfolge wird durch einen Punkt und »Da fragte« natürlich gegliedert. Die Anrede steht entsprechend den singularischen Verbformen im vertraulichen Singular.
