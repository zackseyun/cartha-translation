base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: de
  text: 'Da ging der Mann, der Hausherr, zu ihnen hinaus und sagte: „Nein, meine Brüder! Tut doch bitte nichts Böses! Da dieser Mann in mein Haus gekommen ist, begeht nicht diese Schandtat[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „diese abscheuliche Tat“ oder „diese empörende Tat“. Das hebräische Wort bezeichnet eine schändliche, moralisch empörende Tat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: der Hausherr
  rationale: Die Bezeichnung meint den Mann, der dem Haus vorsteht. „Hausherr“ gibt Stellung und Verantwortung knapp und idiomatisch wieder, ohne ihn lediglich als Eigentümer oder ausdrücklich als Gastgeber zu bezeichnen.
- source_word: אַחַי
  choice: meine Brüder
  rationale: Die wörtliche Anrede bleibt erhalten. Im Zusammenhang richtet sie sich an die Männer der Stadt; eine Erweiterung zu „Freunde“ oder „Mitbürger“ wäre deutender.
- source_word: תָּרֵעוּ
  choice: tut … nichts Böses
  rationale: Das Verb bezeichnet hier moralisch verwerfliches Handeln. Die geläufige deutsche Wendung bewahrt den ethischen Ernst des Verbots.
- source_word: נָא
  choice: doch bitte
  rationale: Die Partikel verleiht der Aufforderung den Charakter einer dringenden Bitte. „Doch bitte“ klingt im modernen Deutschen eindringlich und natürlich.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: Da dieser Mann in mein Haus gekommen ist
  rationale: Die Konstruktion bezeichnet den eingetretenen Umstand, der den Appell des Hausherrn begründet beziehungsweise verschärft. „Da“ gibt diesen im Kontext naheliegenden Zusammenhang natürlich wieder, ohne ihn weiter auszudeuten.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: diese Schandtat
  rationale: נְבָלָה bezeichnet eine schändliche, moralisch empörende Tat. „Schandtat“ ist kräftig, verständlich und dem Gewicht des Ausdrucks angemessen; „Torheit“ wäre im heutigen Deutsch zu schwach.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: ging … zu ihnen hinaus
  rationale: Die Formulierung gibt sowohl die Bewegung aus dem Haus als auch die Hinwendung zu der draußen stehenden Gruppe wieder.
