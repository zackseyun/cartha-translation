source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: de
  text: 'Er sagte zu ihm: „Wir sind von Bethlehem in Juda unterwegs in die entlegenen Gegenden des Berglands von Ephraim. Von dort stamme ich. Ich bin nach Bethlehem in Juda gegangen und bin auf dem Weg zum Haus Jahwes[a]. Doch niemand nimmt mich in sein Haus auf.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und bin auf dem Weg nach Hause“ beziehungsweise „zu meinem Haus“. Manche verstehen das Hebräische hier idiomatisch oder nehmen eine abweichende Lesart an, weil „das Haus Jahwes“ in diesem Zusammenhang unerwartet ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: wir sind … unterwegs
  rationale: Die Partizipialkonstruktion bezeichnet eine gegenwärtige Reise. Die deutsche Formulierung ist natürlich und lässt offen, ob die Reisenden einen Ort lediglich durchqueren.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: von Bethlehem in Juda
  rationale: Die Ortsangabe unterscheidet dieses Bethlehem geografisch; „in Juda“ ist im modernen Deutsch idiomatisch.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: die entlegenen Gegenden des Berglands von Ephraim
  rationale: יַרְכְּתֵי bezeichnet äußerste beziehungsweise abgelegene Bereiche; הַר אֶפְרַיִם ist die geografische Bezeichnung für das Bergland von Ephraim.
- source_word: מִשָּׁם אָנֹכִי
  choice: Von dort stamme ich
  rationale: Die knappe deutsche Wendung gibt die Herkunftsaussage direkt wieder.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: Ich war nach Bethlehem in Juda gegangen
  rationale: Die Vorvergangenheit verdeutlicht im deutschen Erzählzusammenhang, dass der Besuch in Bethlehem der gegenwärtigen Rückreise vorausging, und wahrt die vergangene Aussage des hebräischen Verbs.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: und bin nun auf dem Weg zum Haus Jahwes
  rationale: Der masoretische Text nennt ausdrücklich das Haus JHWHs. „auf dem Weg“ gibt die laufende Bewegung idiomatisch wieder; die kontextuell schwierige Lesart bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: Doch niemand nimmt mich in sein Haus auf
  rationale: אסף bezeichnet hier gastfreundliche Aufnahme. „Niemand“ ist im Deutschen die natürliche Entsprechung der verneinten Existenzkonstruktion אֵין אִישׁ; „in sein Haus aufnehmen“ macht den vom Kontext geforderten Sinn deutlich.
theological_decisions:
- issue: Deutung von וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: auf dem Weg zum Haus Jahwes
  alternative: auf dem Weg nach Hause / zu meinem Haus
  rationale: Der überlieferte masoretische Text lautet ausdrücklich „Haus JHWHs“, obwohl dies im Reiseverlauf unerwartet erscheint. Die Hauptübersetzung folgt dem Text; die verbreitete alternative Deutung wird in einer Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bildet den hebräischen Gottesnamen unmittelbar ab und vermeidet die Ersetzung durch einen Titel.
- issue: Verneintes אִישׁ in der Gastfreundschaftsaussage
  choice: niemand
  alternative: kein Mann
  rationale: In der Konstruktion אֵין אִישׁ fungiert אִישׁ idiomatisch als negatives Indefinitpronomen. „Niemand“ ist daher semantisch genau und im modernen Deutschen natürlicher, ohne eine theologische Festlegung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reisebeschreibung wurde flüssig formuliert, ohne die ungewöhnliche Angabe „Haus Jahwes“ im Haupttext zu glätten. Der Fußnotenmarker [a] steht unmittelbar an der strittigen Wendung.
