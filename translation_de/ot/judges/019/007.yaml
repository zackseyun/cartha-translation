base_translation:
  language: en
  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: de
  text: Da stand der Mann auf, um aufzubrechen. Doch sein Schwiegervater drängte ihn[a], und so kehrte er um und übernachtete dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „setzte ihm beharrlich zu“ oder „bat ihn inständig“. Das hebräische Verb bezeichnet nachdrückliches, anhaltendes Zureden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet hier im Erzählablauf das Aufstehen mit der Absicht, anschließend fortzugehen.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: אִישׁ bedeutet wörtlich „Mann“. Obwohl damit im Zusammenhang der Levit gemeint ist, bleibt die allgemeine Erzählbezeichnung des Hebräischen erhalten.
- source_word: לָלֶכֶת
  choice: um aufzubrechen
  rationale: Der Infinitiv von הלך nach קום gibt den Zweck des Aufstehens an. „Aufbrechen“ drückt im Deutschen natürlich aus, dass der Mann fortgehen wollte, ohne ein bereits vollzogenes Weggehen vorauszusetzen.
- source_word: וַיִּפְצַר בּוֹ
  choice: drängte ihn
  rationale: פצר mit ב bezeichnet nachdrückliches, beharrliches Zureden. „Drängte ihn“ gibt diese Intensität knapp und idiomatisch wieder.
- source_word: חֹתְנוֹ
  choice: sein Schwiegervater
  rationale: Das Verwandtschaftswort bezeichnet hier aufgrund des Zusammenhangs eindeutig den Vater der Frau in seiner Beziehung zu dem Mann.
- source_word: וַיָּשָׁב
  choice: kehrte er um
  rationale: שׁוב bezeichnet ein Zurückkehren oder Umkehren. Da der Mann gerade zum Aufbruch ansetzen wollte, bringt „umkehren“ die Richtungsänderung treffend zum Ausdruck.
- source_word: וַיָּלֶן שָׁם
  choice: übernachtete dort
  rationale: לון bezeichnet das Verbringen der Nacht an einem Ort. „Übernachtete dort“ ist eine klare und natürliche deutsche Wiedergabe.
theological_decisions: []
