  source_fidelity: 'Die Übersetzung gibt die wesentlichen Aussagen des Hebräischen zuverlässig wieder: der menschliche Herr spricht zu seinem Diener, lehnt das Einkehren in einer nichtisraelitischen Stadt ab und will bis Gibea weiterziehen. Der pluralische Relativsatz bezieht sich sinnvoll auf die als „Fremde“ bezeichneten Bewohner und wahrt damit die im Hebräischen angelegte kollektive Ausdrucksweise.'
