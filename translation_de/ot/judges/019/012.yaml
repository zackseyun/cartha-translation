source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲדֹנָ֔י/ו לֹ֤א נָסוּר֙ אֶל עִ֣יר נָכְרִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵ֑נָּה וְ/עָבַ֖רְנוּ עַד גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: de
  text: 'Doch sein Herr sagte zu ihm: „Wir werden nicht in eine Stadt von Fremden einkehren, die nicht zu den Israeliten[a] gehören, sondern bis nach Gibea weiterziehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“. „Israeliten“ ist die übliche deutsche Wiedergabe dieser hebräischen Volksbezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: sein Herr
  rationale: Im Erzählzusammenhang bezeichnet das Wort den menschlichen Herrn des Dieners, nicht Gott. „Sein Herr“ gibt das Autoritätsverhältnis knapp und natürlich wieder.
- source_word: נָסוּר
  choice: wir werden nicht … einkehren
  rationale: סור bezeichnet hier das Abweichen vom Reiseweg, um in einer Stadt zu übernachten. „Einkehren“ macht diese kontextuelle Absicht im Deutschen idiomatisch deutlich.
- source_word: עִיר נָכְרִי
  choice: eine Stadt von Fremden
  rationale: Die Wendung kennzeichnet die Stadt als von Nichtisraeliten bewohnt. „Stadt von Fremden“ bewahrt diesen ethnischen Gegensatz natürlicher als das im Deutschen potenziell politische „ausländische Stadt“.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: die nicht zu den Israeliten gehören
  rationale: Das feminine Pluralpronomen weist auf die Bewohner der Stadt; der Relativsatz schließt sie aus Israel aus. Der Anschluss an „Fremden“ bildet Numerus und Aussage klar ab, ohne die kollektiv gedachte Stadt zum grammatischen Subjekt zu machen.
- source_word: וְעָבַרְנוּ
  choice: sondern … weiterziehen
  rationale: עבר bedeutet hier, an der erwogenen Station vorbeizugehen und die Reise fortzusetzen. „Weiterziehen“ ist im Reisekontext natürlich.
- source_word: עַד גִּבְעָה
  choice: bis nach Gibea
  rationale: עַד bezeichnet das Ziel beziehungsweise die Grenze der Weiterreise. „Bis nach Gibea“ gibt dies idiomatisch und präzise wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einkehren“ und „weiterziehen“ halten den Reise- und Übernachtungskontext verständlich; „Stadt von Fremden“ bewahrt den im Vers ausdrücklich gesetzten Gegensatz zwischen Nichtisraeliten und Israeliten.
