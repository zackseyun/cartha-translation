source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: de
  text: Und es geschah in jenen Tagen[a] – es gab keinen König in Israel –, dass ein Levit als Fremder in den entlegenen Gebieten des Berglands von Ephraim wohnte; und er nahm sich eine Frau, eine Nebenfrau[b], aus Bethlehem in Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und es gab keinen König in Israel.« Die hebräische Klausel ist koordiniert und kann als selbstständige Aussage oder als zeitlicher Hintergrund wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: Eine »Nebenfrau« war eine Frau in einer anerkannten Verbindung, deren sozialer Status unter dem einer Ehefrau lag; gemeint ist nicht bloß eine gelegentliche Partnerin.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Und es geschah in jenen Tagen
  rationale: Bewahrt die hebräische Eröffnungsformel und den zeitlichen Ausdruck in würdigem, verständlichem Deutsch.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: damals gab es keinen König in Israel
  rationale: Die koordinierte hebräische Aussage wird als eingeschobener zeitgeschichtlicher Hintergrund wiedergegeben, ohne sie wertend auszulegen.
- source_word: אִישׁ לֵוִי
  choice: ein Levit
  rationale: Im Deutschen bezeichnet »Levit« bereits einen männlichen Angehörigen des Stammes Levi; »ein levitischer Mann« wäre unnötig schwerfällig.
- source_word: גָּר
  choice: als Fremder … lebte
  rationale: גור bezeichnet häufig das Wohnen als ortsfremder oder rechtlich abhängiger Ansässiger. »Als Fremder lebte« bewahrt diese Nuance besser als das neutrale »wohnte«.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: in den entlegenen Gebieten des Berglands von Ephraim
  rationale: יַרְכְּתֵי bezeichnet abgelegene beziehungsweise äußerste Bereiche; הַר אֶפְרַיִם meint die Berglandregion, nicht einen einzelnen Berg.
- source_word: וַיִּקַּח לוֹ
  choice: Er nahm sich
  rationale: Das Reflexivpronomen לוֹ wird durch »sich« aufgenommen; die Wendung bezeichnet hier das Eingehen einer Verbindung.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: eine Frau, eine Nebenfrau
  rationale: Beide hebräischen Substantive bleiben sichtbar. Die Apposition kennzeichnet die Frau näher nach ihrem gesellschaftlichen Status.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: aus Bethlehem in Juda
  rationale: Die natürliche deutsche Ortsangabe unterscheidet dieses Bethlehem durch seine Lage in Juda.
theological_decisions:
- issue: Richterrefrain über das fehlende Königtum
  choice: 'als eingeschobene Hintergrundangabe: »damals gab es keinen König in Israel«'
  alternative: 'als selbstständige koordinierte Aussage: »und es gab keinen König in Israel«'
  rationale: Die Übersetzung lässt den Satz als erzählerischen Kontext stehen und fügt weder eine Billigung noch eine Verurteilung der Monarchie hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Eröffnungsformel bleibt bewusst leicht feierlich. Gedankenstriche kennzeichnen den Königsrefrain als Hintergrundangabe; die soziale Fremdenstellung des Leviten und der besondere Status der Frau werden nicht eingeebnet.
