    rationale: Das Hebräische verbindet einen singularischen Imperativ mit einem pluralischen Imperativ. Die Pluralform kann die Begleitung des angesprochenen Mannes einschließen, wirkt im Deutschen nach einer unmarkierten Singularanrede aber wie ein Fehler. Das explizite Pronomen »du« macht den quellensprachlichen Wechsel transparent und lesbar.
  - severity: low
    issue: »erst« fügt eine zeitliche Nuance hinzu, die im Hebräischen nicht ausdrücklich ausgedrückt ist.
    rationale: Die Bitte setzt Essen vor das weitere Verweilen zwar kontextuell voraus, אך »erst« ist als explizite Einschränkung entbehrlich. Weglassen hält die Formulierung näher am Text.
