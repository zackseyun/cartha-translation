base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: de
  text: 'Am fünften Tag stand er früh am Morgen auf, um aufzubrechen. Doch der Vater der jungen Frau sagte: »Stärke du dich bitte mit etwas zu essen[a], und bleibt, bis sich der Tag neigt.« Da aßen die beiden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Stärke bitte dein Herz.« Die Wendung meint hier, durch Essen neue Kraft zu gewinnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: stand er früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet frühes Aufstehen beziehungsweise frühes Beginnen; die Formulierung ist im modernen Deutsch natürlich und wahrt die Zeitangabe.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Am fünften Tag
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Zeitangabe.
- source_word: לָלֶכֶת
  choice: um aufzubrechen
  rationale: הלך bedeutet grundsätzlich »gehen«; im Erzählzusammenhang ist die beabsichtigte Abreise gemeint, die »aufbrechen« im Deutschen knapp und natürlich ausdrückt.
- source_word: אֲבִי הַנַּעֲרָה
  choice: der Vater der jungen Frau
  rationale: נַעֲרָה kann ein Mädchen oder eine junge Frau bezeichnen. Wegen des ehelichen Zusammenhangs ist »junge Frau« angemessen und nicht verniedlichend.
- source_word: סְעָד נָא לְבָבְךָ
  choice: Stärke dich bitte erst mit etwas zu essen
  rationale: Wörtlich ist vom Stärken beziehungsweise Stützen des Herzens die Rede; idiomatisch bezeichnet die Wendung eine Stärkung durch Essen. Die Übersetzung vermittelt den Sinn natürlich, während die Fußnote das Bild bewahrt.
- source_word: וְהִתְמַהְמְהוּ
  choice: und wartet
  rationale: Der Hitpael von מהה bedeutet verweilen, zögern oder sich aufhalten. Der Plural bezieht neben dem angesprochenen Mann offenbar dessen Begleitung ein und wird daher beibehalten.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: bis sich der Tag neigt
  rationale: Die bildhafte Wendung beschreibt das Fortschreiten des Tages in Richtung Abend; »bis sich der Tag neigt« erhält dieses Bild.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: Da aßen die beiden
  rationale: »Die beiden« gibt שְׁנֵיהֶם ausdrücklich wieder; »Da« markiert natürlich die erzählerische Folge.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Bildsprache beim sich neigenden Tag bleibt erhalten; das weniger transparente Bild vom Stärken des Herzens wird im Text idiomatisch wiedergegeben und in der Fußnote dokumentiert.
