  to: 'Am fünften Tag stand er früh am Morgen auf, um aufzubrechen. Doch der Vater der jungen Frau sagte: »Stärke du dich bitte mit etwas zu essen[a], und bleibt, bis sich der Tag neigt.« Da aßen die beiden.'
  rationale: Die Revision beseitigt die im Deutschen missverständliche, aber im Hebräischen tatsächlich vorhandene Anredezahlfolge, indem sie den Singular mit »du« ausdrücklich markiert und den anschließenden Plural bewahrt. Außerdem wird das nicht ausdrücklich im Ausgangstext stehende »erst« entfernt. Bedeutung, Register, Bildsprache und bestehender Fußnotenanker bleiben erhalten.
