review_pass:
  verdict: revise
  source_fidelity: Der Haupttext gibt die masoretisch vokalisierte Lesart von וַתִּזְנֶה עָלָיו angemessen als sexuelle Untreue wieder. „Nebenfrau“, die Trennung, das Haus des Vaters, Bethlehem in Juda und die Dauer von vier Monaten sind sachgerecht wiedergegeben. Die abweichende alte Deutung muss weiterhin als Alternative kenntlich bleiben.
  naturalness: Der Text ist modernes, verständliches Standarddeutsch. Eine geringfügige Umstellung mit Komma macht die Zielangabe „nach Bethlehem in Juda“ syntaktisch eindeutiger. Die bisherige Fußnotenformulierung „trieb Hurerei gegen ihn“ ist im heutigen Deutsch unnötig altertümlich und zugleich stilistisch holprig.
  terminology: „Nebenfrau“ ist hier als Bezeichnung einer sozial nachgeordneten, anerkannten Partnerin vertretbar und weniger missverständlich als ein rein außerehelich verstandenes „Konkubine“. „Untreu“ wahrt die sexuelle Konnotation von זנה, ohne Prostitution im engeren, kommerziellen Sinn zu behaupten.
  issues:
