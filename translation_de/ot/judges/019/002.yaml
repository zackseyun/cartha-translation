  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: de
  text: Doch seine Nebenfrau wurde ihm untreu[a]. Sie ging von ihm weg zum Haus ihres Vaters, nach Bethlehem in Juda, und blieb dort vier Monate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie trieb Unzucht gegen ihn.“ Einige alte Auslegungstraditionen verstanden den Satz anders, etwa: „Sie wurde zornig auf ihn“ oder: „Sie stritt sich mit ihm.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  choice: wurde untreu
  rationale: Das Verb זנה bezeichnet gewöhnlich sexuelle Untreue oder Prostitution. „Wurde untreu“ gibt den wahrscheinlichen Sinn natürlich wieder, ohne gewerbsmäßige Prostitution zu unterstellen; abweichende alte Deutungen werden in der Fußnote bewahrt.
- source_word: עָלָיו
  choice: ihm
  rationale: In Verbindung mit „untreu werden“ gibt der Dativ idiomatisch die gegen den Mann gerichtete Untreue wieder.
- source_word: פִּילַגְשׁוֹ
  choice: seine Nebenfrau
  rationale: „Nebenfrau“ bezeichnet verständlich eine anerkannte, aber sozial niedriger gestellte eheähnliche Partnerin und klingt im modernen Deutschen natürlicher als „Konkubine“.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Sie ging von ihm weg
  rationale: Die Formulierung bewahrt sowohl die Bewegung als auch die durch מן + אֵת ausgedrückte Trennung.
- source_word: אֶל בֵּית אָבִיהָ
  choice: zum Haus ihres Vaters
  rationale: Nahe und zugleich idiomatische Wiedergabe des hebräischen Ausdrucks für den väterlichen Haushalt.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: nach Bethlehem in Juda
  rationale: Die Wiedergabe kennzeichnet den Ort klar als Bethlehem im Gebiet Juda.
- source_word: וַתְּהִי שָׁם
  choice: blieb dort
  rationale: Im Erzählzusammenhang drückt „blieb dort“ die durch היה + שם bezeichnete Anwesenheit über den anschließenden Zeitraum natürlich aus.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: vier Monate
  rationale: Die hebräische Zeitangabe bedeutet idiomatisch eine Dauer von vier Monaten; eine wortwörtliche Wiedergabe von ימים wäre im Deutschen missverständlich.
theological_decisions:
- issue: Deutung von וַתִּזְנֶה in einer moralisch belasteten Erzählung
  choice: sexuelle Untreue („wurde untreu“)
  alternative: '„trieb Hurerei gegen ihn“; nach einer alten abweichenden Auslegung: „wurde zornig auf ihn“ oder „stritt sich mit ihm“'
  rationale: Die masoretische Vokalisierung und der gewöhnliche lexikalische Sinn von זנה sprechen für sexuelle Untreue. Da alte Ausleger und Übersetzungstraditionen die Aussage teilweise anders verstanden, wird diese Spannung in einer Fußnote offengelegt und nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, klare Erzählstruktur; „Nebenfrau“ vermeidet den heute teils rein außerehelich verstandenen Ausdruck „Konkubine“, ohne den niedrigeren sozialen Status der Beziehung zu verschweigen.
