    issue: Die Formulierung der Fußnote ist im Deutschen unnatürlich.
    rationale: „Hurerei treiben gegen ihn“ ist zwar an älteren Bibelstil angelehnt, bildet die Konstruktion aber im modernen Standarddeutsch nicht klar ab. „Unzucht gegen ihn“ ist als bewusst nähere, aber verständliche Erläuterung geeigneter.
  - severity: low
    issue: Die beiden Zielangaben können klarer gegliedert werden.
    rationale: Ein Komma vor „nach Bethlehem in Juda“ verdeutlicht, dass Bethlehem den Ort des väterlichen Hauses bezeichnet und nicht eine weitere, davon getrennte Zielrichtung.
