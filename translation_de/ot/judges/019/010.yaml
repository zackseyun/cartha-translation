base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: de
  text: Doch der Mann war nicht bereit zu übernachten. Er stand auf, ging los und kam bis gegenüber von Jebus – das ist Jerusalem.[a] Bei ihm waren zwei gesattelte Esel und seine Nebenfrau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis in die Nähe von Jebus« beziehungsweise »bis an einen Punkt vor Jebus«. Der hebräische Ausdruck bezeichnet einen Ort gegenüber oder vor der Stadt, nicht eindeutig einen Ort innerhalb der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: war nicht bereit
  rationale: Das Verb bezeichnet Bereitschaft beziehungsweise Zustimmung. Die Wiedergabe bringt seine bewusste Weigerung zum Ausdruck, ohne sie unnötig zu verschärfen.
- source_word: לָלוּן
  choice: die Nacht dort zu verbringen
  rationale: Der Infinitiv bezeichnet ausdrücklich das Übernachten; die Formulierung ist im modernen Deutschen natürlich und klar.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: Er stand auf, zog weiter und kam
  rationale: Die drei aufeinanderfolgenden Erzählverben bleiben erhalten und geben so Ablauf und Rhythmus des hebräischen Textes wieder.
- source_word: עַד נֹכַח
  choice: bis gegenüber von
  rationale: Die Wendung bezeichnet einen Punkt gegenüber beziehungsweise vor der Stadt und sagt nicht eindeutig, dass der Mann sie bereits betreten hatte.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: Jebus – das ist Jerusalem
  rationale: Die erklärende Apposition identifiziert den älteren Ortsnamen Jebus mit Jerusalem.
- source_word: צֶמֶד חֲמוֹרִים
  choice: zwei Esel
  rationale: צֶמֶד bezeichnet hier ein Paar Tiere. Im Deutschen ist die konkrete Mengenangabe natürlicher als „ein Paar Esel“.
- source_word: חֲבוּשִׁים
  choice: gesattelte
  rationale: Bei für eine Reise ausgerüsteten Eseln bezeichnet das Partizip am ehesten das Anlegen von Sattel beziehungsweise Reisezeug; „gesattelt“ ist knapp und anschaulich.
- source_word: פִּילַגְשׁוֹ
  choice: seine Nebenfrau
  rationale: „Nebenfrau“ gibt den besonderen, einer Ehefrau nachgeordneten Status im Deutschen verständlicher wieder als das heute oft anders konnotierte Fremdwort „Konkubine“.
