base_translation:
  language: en
  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: de
  text: Dort bogen sie ab, um nach Gibea zu gehen und dort zu übernachten. Er ging hinein und setzte sich auf den Platz der Stadt[a], aber kein Mann nahm sie in sein Haus auf, um dort zu übernachten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der breiten Straße der Stadt«. Das hebräische Wort kann eine breite öffentliche Fläche, einen Platz oder eine Straße bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Und es war kein Mann, der sie ins Haus aufnahm, um zu übernachten.« Gemeint ist, dass kein Bewohner ihnen Unterkunft anbot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: Da bogen sie dorthin ab
  rationale: סור bezeichnet im Reisekontext das Abbiegen beziehungsweise Verlassen der bisherigen Route, nicht nur einen Halt.
- source_word: לָבוֹא לָלוּן
  choice: um ... hineinzugehen und dort zu übernachten
  rationale: Die beiden Infinitive geben Zweck und Ziel der Bewegung an; „übernachten“ gibt לון klar und zeitgemäß wieder.
- source_word: בַּגִּבְעָה
  choice: nach Gibea
  rationale: Mit dem Bewegungsverb entspricht „nach Gibea hineingehen“ der Zielrichtung; der Ortsname wird in gebräuchlicher deutscher Form wiedergegeben.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: Er ging hinein und setzte sich
  rationale: Der hebräische Text wechselt in den Singular und stellt damit den führenden Reisenden als Vertreter der Gruppe in den Vordergrund.
- source_word: בִּרְחוֹב הָעִיר
  choice: auf den freien Platz der Stadt
  rationale: רְחוֹב kann eine breite öffentliche Fläche oder einen Platz bezeichnen; „freier Platz“ wahrt diese Bedeutung, ohne vorschnell einen modernen Marktplatz vorauszusetzen.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: Doch niemand nahm sie bei sich zu Hause auf
  rationale: Wörtlich steht „kein Mann“, doch die Aussage betrifft im Kontext das Ausbleiben jeglicher Gastfreundschaft. „Bei sich zu Hause aufnehmen“ gibt die Richtung zum Haus und den idiomatischen Sinn von אסף natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Wechsel vom pluralischen „sie“ zum singularischen „er“ bleibt erhalten. Die Schlussformulierung wird im Deutschen idiomatisch als verweigerte Gastfreundschaft ausgedrückt; die wörtlichere Struktur steht in der Fußnote.
