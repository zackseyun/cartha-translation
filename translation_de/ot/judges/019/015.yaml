  naturalness: Die Erzählung ist überwiegend modern und verständlich. »auf dem Platz der Stadt« ist idiomatischer und lässt, mit der Fußnote, den Bedeutungsbereich von רְחוֹב offen. »um dort zu übernachten« ist direkter und natürlicher als die Konstruktion mit »damit ... konnten«.
  terminology: »Gibea« ist die geläufige deutsche Namensform. »kein Mann« erhält die explizite Formulierung des hebräischen Textes; »in sein Haus aufnehmen« gibt die im Kontext gemeinte Gastfreundschaft klar und idiomatisch wieder.
