source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֤ישׁ הַ/זָּקֵן֙ שָׁל֣וֹם לָ֔/ךְ רַ֥ק כָּל מַחְסוֹרְ/ךָ֖ עָלָ֑/י רַ֥ק בָּ/רְח֖וֹב אַל תָּלַֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: de
  text: 'Der alte Mann sagte: »Friede sei mit dir! Nur: Für alles, was du brauchst, sorge ich; nur übernachte nicht auf dem öffentlichen Platz.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der Straße«. Das hebräische Wort bezeichnet genauer einen öffentlichen, offenen Bereich oder Platz innerhalb der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: der alte Mann
  rationale: Die natürliche deutsche Erzählform gibt Substantiv und Adjektiv knapp und ohne klinischen Beiklang wieder.
- source_word: שָׁלוֹם לָךְ
  choice: Friede sei mit dir
  rationale: Die feste Wendung bewahrt den Gehalt von שָׁלוֹם und klingt im Deutschen zugleich wie Zuspruch und Friedenswunsch.
- source_word: רַק
  choice: nur
  rationale: Die Partikel begrenzt beziehungsweise betont die Aussage. Im Deutschen wird ihre entscheidende einschränkende Funktion vor dem Verbot ausdrücklich mit „nur“ wiedergegeben; beim Versorgungsangebot wäre eine doppelte Wiedergabe unnatürlich.
- source_word: כָּל מַחְסוֹרְךָ
  choice: alles, was du brauchst
  rationale: מַחְסוֹר bezeichnet Mangel oder Bedarf. Die gewählte Form ist idiomatisch und umfasst den gesamten Bedarf des Gastes.
- source_word: עָלָי
  choice: sorge ich
  rationale: Das wörtliche „auf mir“ drückt hier die persönliche Übernahme der Versorgung aus; „sorge ich“ vermittelt diese Verantwortungszusage in natürlichem Deutsch.
- source_word: בָּרְחוֹב
  choice: auf dem öffentlichen Platz
  rationale: רְחוֹב meint hier einen frei zugänglichen offenen Bereich innerhalb der Stadt, eher einen Platz als lediglich eine Fahrstraße.
- source_word: אַל תָּלַן
  choice: übernachte nicht
  rationale: לון bezeichnet das Verweilen beziehungsweise Unterkommen über Nacht; der deutsche Imperativ gibt das Verbot knapp und genau wieder.
theological_decisions: []
translation_notes:
  register: 'Moderne, würdige Erzählsprache mit direkter und verständlicher Rede. Das zweimalige רַק wird nicht mechanisch verdoppelt: Die einschränkende Pointe bleibt durch „Nur“ beim Übernachtungsverbot erhalten, während das Versorgungsangebot idiomatisch formuliert ist.'
