source:
  edition: WLC
  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: de
  text: 'Während sie guter Dinge waren, da umringten plötzlich die Männer der Stadt – nichtswürdige Männer[a] – das Haus und hämmerten gegen die Tür. Sie sagten zu dem alten Mann, dem Hausherrn: »Bring den Mann heraus, der in dein Haus gekommen ist, damit wir ihn erkennen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Männer, Söhne der Nichtswürdigkeit«; gemeint sind gesetzlose, moralisch verkommene Männer.'
    reason: lexical_alternative
  - marker: b
    text: »Erkennen« ist hier ein sexueller Euphemismus. Die Männer beabsichtigten, ihn sexuell zu missbrauchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: guter Dinge waren
  rationale: Die hebräische Wendung bedeutet wörtlich, dass sie ihr Herz froh machten, und bezeichnet hier ihr vergnügtes Beisammensein. »Guter Dinge sein« gibt den Sinn natürlich und mit gehobenem, aber verständlichem Klang wieder.
- source_word: וְהִנֵּה
  choice: da … plötzlich
  rationale: Die Formulierung markiert den abrupten, bedrohlichen Umschwung der Szene. Im modernen Deutschen vermittelt »da … plötzlich« diese Erzählwirkung natürlicher als das altertümlich wirkende »siehe«.
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Direkte und im Kontext klare Wiedergabe der hebräischen Genitivverbindung.
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: nichtswürdige Männer
  rationale: Die idiomatische Bezeichnung charakterisiert die Männer als moralisch verkommen und gesetzlos. »Nichtswürdig« bleibt näher am Bild der Wertlosigkeit als das stärker auslegende »böse«.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: umringten … das Haus
  rationale: Das Verb bezeichnet das Umschließen oder Umgeben eines Ortes; »umringen« vermittelt zugleich den bedrohlichen Charakter der Handlung.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: hämmerten gegen die Tür
  rationale: Das Partizip beschreibt wiederholtes, heftiges Schlagen. »Hämmern« gibt diese aggressive Dauerhandlung prägnant wieder.
- source_word: בַּעַל הַבַּיִת
  choice: Hausherr
  rationale: Die Wendung bezeichnet den Mann, der dem Haus vorsteht. »Hausherr« ist eine natürliche, knappe deutsche Entsprechung.
- source_word: הוֹצֵא
  choice: Bring … heraus
  rationale: Der Imperativ fordert, den Gast aus dem Haus nach draußen zu bringen; die deutsche Formulierung gibt dies unmittelbar wieder.
- source_word: וְנֵדָעֶנּוּ
  choice: damit wir ihn erkennen
  rationale: Das Verb »erkennen« bewahrt den hebräischen sexuellen Euphemismus und den literarischen Anklang an 1. Mose 19. Eine Fußnote erklärt die hier eindeutig gewaltsame Absicht.
theological_decisions:
- issue: Wiedergabe des sexuellen Euphemismus וְנֵדָעֶנּוּ
  choice: Den Euphemismus im Haupttext mit »damit wir ihn erkennen« bewahren und seine gewaltsame sexuelle Bedeutung in einer Fußnote erläutern.
  alternative: »damit wir mit ihm verkehren« oder »damit wir ihn sexuell missbrauchen«
  rationale: Die wörtlichere Wiedergabe erhält Sprachgestalt und literarischen Bezug des Hebräischen. Die Fußnote verhindert zugleich, dass die tatsächliche Absicht der Männer als bloßes Kennenlernen oder als einvernehmlicher Geschlechtsverkehr missverstanden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung wahrt den abrupten Übergang zur Bedrohung; »Hausherr« und »nichtswürdig« sind gehoben, aber allgemein verständlich. Gedankenstriche setzen die moralische Kennzeichnung der Männer als erläuternde Apposition ab.
