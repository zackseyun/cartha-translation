base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: de
  text: 'Am vierten Tag standen sie früh am Morgen auf, und er stand auf, um aufzubrechen. Doch der Vater der jungen Frau sagte zu seinem Schwiegersohn: »Stärke dich erst mit einem Bissen Brot[a]; danach könnt ihr aufbrechen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Stärke dein Herz mit einem Bissen Brot.« Gemeint ist, sich durch Essen zu stärken.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb steht im Plural und richtet sich wohl an die ganze Reisegruppe, obwohl der Vater unmittelbar seinen Schwiegersohn anspricht.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Am vierten Tag
  rationale: Die schlichte Zeitangabe wahrt die Erzählfolge, ohne einen im Hebräischen nicht ausdrücklich genannten Zusatz einzufügen.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: standen sie früh am Morgen auf
  rationale: Die Wiedergabe erhält sowohl den Plural als auch die Betonung des frühen Aufstehens.
- source_word: וַיָּקָם לָלֶכֶת
  choice: er machte sich bereit aufzubrechen
  rationale: Der Singular richtet den Blick wieder auf den Leviten; die deutsche Formulierung gibt das Aufstehen mit der Absicht zu gehen natürlich wieder.
- source_word: אֲבִי הַנַּעֲרָה
  choice: der Vater der jungen Frau
  rationale: נַעֲרָה bezeichnet hier eine junge Frau; diese Wiedergabe ist modern und vermeidet die möglicherweise zu junge Konnotation von »Mädchen«.
- source_word: חֲתָנוֹ
  choice: seinem Schwiegersohn
  rationale: Im Kontext bezeichnet das Wort das Verhältnis des Vaters zum Leviten.
- source_word: סְעָד לִבְּךָ
  choice: Stärke dich
  rationale: Die Wendung bedeutet wörtlich, das Herz zu stärken bzw. zu stützen, und meint hier die Stärkung durch Essen. Die natürliche deutsche idiomatische Wiedergabe bewahrt den Sinn ohne ein befremdliches Bild im Haupttext.
- source_word: פַּת לֶחֶם
  choice: mit einem Bissen Brot
  rationale: Die konkrete und bescheidene Speiseangabe sowie der gastfreundliche Ton bleiben erhalten.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: danach könnt ihr aufbrechen
  rationale: Der hebräische Schlussverb ist Plural und bezieht sich wahrscheinlich auf die gesamte Reisegruppe, obwohl der Vater unmittelbar den Schwiegersohn anspricht.
