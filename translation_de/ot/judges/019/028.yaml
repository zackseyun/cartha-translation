  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und die wesentlichen Bedeutungen zuverlässig wieder: die feminine Aufforderung, den Kohortativ „lasst uns gehen“, das Ausbleiben einer Antwort, das Aufladen auf den Esel sowie das anschließende Aufstehen und Gehen des Mannes. Er legt nicht unzulässig fest, dass die Frau in diesem Vers bereits tot sei.'
  naturalness: „Wir wollen gehen“ ist möglich, doch „Lass uns gehen“ gibt den auffordernden Kohortativ im heutigen Deutsch unmittelbarer wieder. „An seinen Ort“ ist als Zielangabe im modernen Standarddeutsch wenig idiomatisch; „zu seinem Ort“ ist näher am hebräischen לִמְקֹמוֹ und sprachlich sauberer.
  terminology: „Esel“ ist die angemessene moderne Wiedergabe von חֲמוֹר. Die Formulierung „hob er sie auf den Esel“ erläutert den kontextuellen Sinn von לקח hinreichend, ohne eine über das Hebräische hinausgehende Aussage zu treffen. Die Fußnoten bewahren die relevanten Alternativen und sind korrekt verankert.
