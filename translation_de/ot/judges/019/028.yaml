base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: de
  text: 'Er sagte zu ihr: „Steh auf, lass uns gehen.“ Doch niemand antwortete.[a] Da hob er sie auf den Esel.[b] Dann stand der Mann auf und ging zu seinem Ort.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da war niemand, der antwortete.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Da nahm er sie auf den Esel.“ Das hebräische Verb bedeutet grundsätzlich „nehmen“ und bezeichnet hier das Aufheben oder Hinaufsetzen auf das Tier.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu sich nach Hause“. Wörtlich: „zu seinem Ort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Er sagte zu ihr
  rationale: Gibt die fortlaufende hebräische Erzählform im natürlichen modernen Deutsch wieder; ein einleitendes „Und“ ist nicht erforderlich.
- source_word: קוּמִי
  choice: Steh auf
  rationale: Die feminine Singularform des Imperativs richtet sich an die Frau; „Steh auf“ ist direkt und idiomatisch.
- source_word: וְנֵלֵכָה
  choice: wir wollen gehen
  rationale: Der Kohortativ der ersten Person Plural drückt Aufforderung beziehungsweise gemeinsamen Entschluss aus.
- source_word: וְאֵין עֹנֶה
  choice: Doch niemand antwortete
  rationale: Die wörtliche Wendung „da war kein Antwortender“ bezeichnet idiomatisch das Ausbleiben jeder Reaktion; „Doch“ bildet den Gegensatz zur Aufforderung ab.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: Da hob er sie auf den Esel
  rationale: לקח bedeutet grundsätzlich „nehmen“; mit עַל und dem Tier bezeichnet es hier das Aufheben beziehungsweise Hinaufsetzen. „Hob ... auf“ bewahrt mehr von der Grundbedeutung als bloßes „setzte“.
- source_word: וַיָּקָם הָאִישׁ
  choice: Dann stand der Mann auf
  rationale: Bewahrt קום als eigene Handlung vor dem anschließenden Gehen und folgt der ausdrücklichen Nennung „der Mann“.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: und ging an seinen Ort
  rationale: „Seinen Ort“ hält die Bedeutungsbreite von מָקוֹם offen; im Kontext kann sein Wohnort oder Zuhause gemeint sein.
theological_decisions:
- issue: Ob die Frau zu diesem Zeitpunkt bereits tot war
  choice: Der Vers sagt lediglich, dass niemand antwortete
  alternative: Ausdrücklich formulieren, sie sei tot gewesen
  rationale: Der hebräische Text stellt ihren Tod in diesem Vers nicht ausdrücklich fest. Die Übersetzung bewahrt diese erzählerische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, erschütternde Erzählweise des Hebräischen wird ohne erklärende Zusätze bewahrt. Sämtliche Fußnotenmarker stehen unmittelbar an den betreffenden Formulierungen.
