source:
  edition: WLC
  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: de
  text: Seht, hier sind meine Tochter, die noch Jungfrau ist, und seine Nebenfrau. Lasst mich sie bitte hinausbringen. Vergewaltigt sie[a] und tut mit ihnen, was in euren Augen gut ist.[b] Aber diesem Mann dürft ihr diese Schandtat[c] nicht antun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann sexuelle Verletzung, Misshandlung und Erniedrigung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „was gut ist in euren Augen“; gemeint ist, was euch selbst gut oder recht erscheint.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „diese schändliche Tat“ beziehungsweise „diese Freveltat“. Das hebräische Wort bezeichnet eine empörende, moralisch verwerfliche Handlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die deiktische Interjektion fordert in der angespannten Situation unmittelbar Aufmerksamkeit. „Seht“ ist gegenwärtiges, natürliches Deutsch und wahrt den Nachdruck.
- source_word: בִתִּי הַבְּתוּלָה
  choice: meine Tochter, die noch Jungfrau ist
  rationale: Die appositionelle Formulierung kennzeichnet die Tochter ausdrücklich als Jungfrau. Die Relativsatzlösung klingt im Deutschen natürlicher als „meine jungfräuliche Tochter“, ohne den lexikalischen Gehalt abzuschwächen.
- source_word: וּפִילַגְשֵׁהוּ
  choice: und seine Nebenfrau
  rationale: „Nebenfrau“ bezeichnet die kulturell besondere, einer Ehefrau nachgeordnete Stellung verständlicher und weniger missverständlich als das heute oft anders konnotierte „Konkubine“.
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: Ich will sie doch hinausbringen
  rationale: Der Kohortativ drückt den Willen des Sprechers aus; נָא verleiht der Äußerung einen bittenden beziehungsweise dringlichen Ton, den „doch“ hier knapp wiedergibt.
- source_word: וְעַנּוּ אוֹתָם
  choice: Tut ihnen Gewalt an
  rationale: ענה im Piel bezeichnet hier erniedrigende Gewalt und hat im Kontext eindeutig sexuelle Tragweite. Die Formulierung macht die Gewalttat deutlich, ohne die mögliche Bedeutungsbreite des Verbs auf einen einzelnen juristischen Begriff zu verengen.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: und macht mit ihnen, was in euren Augen gut ist
  rationale: Die bildhafte hebräische Wendung wird formal bewahrt und bleibt im Deutschen verständlich; sie bezeichnet, was den Angesprochenen selbst gut beziehungsweise recht erscheint.
- source_word: וְלָאִישׁ הַזֶּה לֹא תַעֲשׂוּ
  choice: Aber diesem Mann dürft ihr ... nicht antun
  rationale: Die Voranstellung von „diesem Mann“ erhält den scharfen Kontrast zu den zuvor angebotenen Frauen. „Dürft ... nicht“ gibt das direkte Verbot in natürlichem Deutsch wieder.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: diese Schandtat
  rationale: נְבָלָה bezeichnet hier keine bloße Torheit, sondern eine empörende, moralisch verwerfliche Tat. „Schandtat“ drückt diese Wertung prägnant aus.
theological_decisions:
- issue: Klarheit und Bedeutungsumfang der sexuell gewaltsamen Sprache
  choice: „Tut ihnen Gewalt an“ im Haupttext, mit „Vergewaltigt sie“ als Fußnotenalternative
  alternative: „Vergewaltigt sie“ unmittelbar im Haupttext
  rationale: Der Erzählzusammenhang macht sexuelle Gewalt deutlich. Zugleich hat das hebräische Verb einen Bedeutungsumfang, der Erniedrigung und Misshandlung einschließt. Haupttext und Fußnote benennen beides, ohne die Gewalt zu beschönigen oder die lexikalische Mehrdeutigkeit aufzuheben.
- issue: Moralische Wertung durch נְבָלָה
  choice: „Schandtat“
  alternative: „schändliche Tat“ oder „Freveltat“
  rationale: Die Wiedergabe bewahrt die ausdrückliche moralische Verurteilung der beabsichtigten Tat und vermeidet das im heutigen Deutsch zu schwache „Torheit“.
- issue: Ethische Spannung in der unterschiedlichen Behandlung der Frauen und des männlichen Gastes
  choice: Den Kontrast der hebräischen Aussage unverändert stehen lassen
  alternative: Den Vorschlag des Hausherrn durch erklärende oder verurteilende Zusätze im Vers kommentieren
  rationale: Der Text stellt den entsetzlichen Vorschlag und seine verzerrte Wertung unvermittelt dar. Die Übersetzung darf diese Spannung weder entschärfen noch durch nicht im Vers stehende Kommentierung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze erhalten die Dringlichkeit und Härte der Rede. Die drastische Gewalt wird nicht beschönigt; zugleich bleiben die Bedeutungsbreite von ענה und die verstörende moralische Spannung des Verses sichtbar.
