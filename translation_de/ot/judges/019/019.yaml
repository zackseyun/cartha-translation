revisions:
- from: Wir haben auch Stroh und Futter für unsere Esel sowie Brot und Wein für mich, für deine Dienerin[a] und für den jungen Mann, der bei deinen Dienern ist. Es fehlt uns an nichts.[b]
  to: Wir haben sowohl Stroh als auch Futter für unsere Esel und Brot und Wein für mich, für deine Dienerin[a] und für den jungen Mann bei deinen Dienern. Uns fehlt nichts.[b]
  rationale: Die Revision erhält sämtliche Inhalte des Entwurfs, gibt die doppelte additive Hervorhebung klarer wieder und vermeidet beim jungen Mann eine über den hebräischen Nominalausdruck hinausgehende syntaktische Festlegung. Die überlieferte, auffällige Bezugnahme auf „deinen Dienern“ bleibt bewusst stehen.
