base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: de
  text: Wir haben sowohl Stroh als auch Futter für unsere Esel und Brot und Wein für mich, für deine Dienerin[a] und für den jungen Mann bei deinen Dienern. Uns fehlt nichts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Deine Dienerin“ ist eine ehrerbietige Bezeichnung für die Frau, die mit ihm reist.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Es fehlt an keinerlei Sache.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... גַם
  choice: auch ... sowie
  rationale: Gibt die wiederholte additive Hervorhebung des Hebräischen in natürlichem Deutsch wieder, ohne einen im Ausgangstext nicht eindeutigen Gegensatz einzuführen.
- source_word: תֶּבֶן
  choice: Stroh
  rationale: Die übliche konkrete Bezeichnung für Stroh, das hier als Versorgung der Tiere genannt wird.
- source_word: מִסְפּוֹא
  choice: Futter
  rationale: Bezeichnet Tierfutter und ist im modernen Deutschen natürlicher als „Viehfutter“ oder das veraltete „Futterstroh“.
- source_word: לַחֲמוֹרֵינוּ
  choice: für unsere Esel
  rationale: Bewahrt die Präpositionalfügung und den Possessivsuffix der hebräischen Form.
- source_word: לֶחֶם וָיַיִן
  choice: Brot und Wein
  rationale: Bewahrt die beiden konkret genannten Lebensmittel.
- source_word: יֶשׁ לִי
  choice: für mich
  rationale: Die Verfügbarkeitskonstruktion wird im Deutschen zusammen mit „Wir haben“ idiomatisch ausgedrückt.
- source_word: אֲמָתֶךָ
  choice: deine Dienerin
  rationale: Bewahrt Genus und ehrerbietige Selbstbezeichnung, ohne archaisches „Magd“.
- source_word: לַנַּעַר
  choice: für den jungen Mann
  rationale: Bewahrt die breite Bedeutung von נַעַר; der Kontext kann einen jungen Begleiter oder Diener meinen.
- source_word: עִם עֲבָדֶיךָ
  choice: der bei deinen Dienern ist
  rationale: Bewahrt den überlieferten Suffix der zweiten Person und bezieht die Phrase syntaktisch auf den jungen Mann, ohne die auffällige Form stillschweigend zu ändern.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: Es fehlt uns an nichts
  rationale: Gibt die hebräische Wendung für vollständige Versorgung knapp und idiomatisch wieder.
