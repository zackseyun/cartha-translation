  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: de
  text: So ließ Jahwe diese Völker[a] bleiben, ohne sie schnell zu vertreiben; er gab sie nicht in die Hand Josuas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese Nationen«. Das hebräische Verb kann hier auch mit »bleiben lassen« oder »an ihrem Ort lassen« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: ließ … bleiben
  rationale: Die Hifil-Form von נוח bezeichnet hier, dass Jahwe die Völker im Land verbleiben ließ. Die deutsche Formulierung gibt diesen kausativen Sinn natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: diese Völker
  rationale: גּוֹיִם bezeichnet hier die in Kanaan verbliebenen ethnisch-politischen Gruppen; »Völker« ist im Deutschen idiomatischer als »Nationen«.
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: ohne sie … zu vertreiben
  rationale: Die negative Infinitivkonstruktion kann Zweck oder Ergebnis ausdrücken. »Ohne … zu« bewahrt diese Offenheit und ergibt einen natürlichen deutschen Satz.
- source_word: מַהֵר
  choice: schnell
  rationale: Das Adverb bedeutet »schnell« oder »rasch«; »schnell« ist die geläufigste moderne Entsprechung.
- source_word: וְלֹא נְתָנָם
  choice: er gab sie nicht
  rationale: Die einfache Vergangenheitsform entspricht der hebräischen Erzählfolge und erhält die Verknüpfung mit dem vorherigen Satzteil.
- source_word: בְּיַד יְהוֹשֻׁעַ
  choice: in Josuas Hand
  rationale: Die hebräische Wendung bezeichnet Übergabe in die Gewalt oder Verfügungsgewalt einer Person. Das Bild »in Josuas Hand« bleibt im Deutschen verständlich und bewahrt die Ausdrucksweise des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Tetragrammaton. »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Absicht oder Ergebnis der nicht erfolgten Vertreibung
  choice: ohne sie schnell zu vertreiben
  alternative: damit er sie nicht schnell vertrieb
  rationale: לְבִלְתִּי mit Infinitiv kann Zweck oder Ergebnis bezeichnen. Die gewählte Formulierung legt nicht eindeutiger als der hebräische Text eine ausdrückliche Absicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und erzählerisch; das hebräische Machtbild »in Josuas Hand« wird bewusst erhalten.
