id: JDG.2.5
reference: Judges 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: de
  text: Da nannten sie jenen Ort Bochim[a] und brachten dort Yahweh Schlachtopfer dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bochim klingt wie das hebräische Wort für »Weinende« oder »die Weinenden«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: Da nannten sie
  rationale: Die hebräische Wendung bedeutet wörtlich, dass sie dem Ort einen Namen gaben. Im modernen Deutschen gibt „nannten sie“ den Sinn natürlich und knapp wieder.
- source_word: הַמָּקוֹם הַהוּא
  choice: jenen Ort
  rationale: „Jenen“ bildet das rückverweisende Demonstrativpronomen הַהוּא ab und klingt im erzählenden Kontext würdig und natürlich.
- source_word: בֹּכִים
  choice: Bochim
  rationale: Das Wort fungiert als Ortsname und wird daher transliteriert; seine Verbindung mit dem Weinen wird in der Fußnote erläutert.
- source_word: וַיִּזְבְּחוּ
  choice: brachten ... Schlachtopfer dar
  rationale: זבח bezeichnet das Schlachten beziehungsweise Darbringen eines Opfers. „Schlachtopfer darbringen“ macht den kultischen Sinn im Deutschen präzise kenntlich.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf den soeben benannten Ort zurück.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als Eigenname „Yahweh“ wiedergegeben; die Präposition ל wird in der deutschen Konstruktion „jemandem ein Opfer darbringen“ durch den Dativ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Transliteration „Yahweh“ bewahrt den Charakter als persönlicher Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Übersetzung oder Transliteration von בֹּכִים
  choice: Bochim
  alternative: Weinende; die Weinenden
  rationale: Da בֹּכִים hier als Ortsname gebraucht wird, bleibt der Name im Haupttext erhalten. Die sprachliche Bedeutung wird in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der hebräische Namensgebungsidiom wird idiomatisch wiedergegeben; der kultische Gehalt von זבח bleibt durch „Schlachtopfer darbringen“ sichtbar.
