base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: de
  text: 'Da entbrannte der Zorn Jahwes gegen Israel, und er sagte: »Weil dieses Volk meinen Bund übertreten hat[a], den ich ihren Vorfahren geboten habe, und nicht auf meine Stimme gehört hat[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »meinen Bund gebrochen hat«. Das hebräische Verb bedeutet wörtlich »überschreiten« und bezeichnet im Zusammenhang mit einem Bund dessen Verletzung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »meiner Stimme nicht gehorcht hat«. Die hebräische Wendung »auf die Stimme hören« schließt häufig Gehorsam ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte der Zorn
  rationale: Bewahrt das hebräische Bild des brennenden Zorns und klingt zugleich natürlich und würdig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּיִשְׂרָאֵל
  choice: gegen Israel
  rationale: Die Präposition kennzeichnet bei einem Ausdruck des Zorns dessen Ziel.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet knapp und sachgerecht den Grund für die folgende Erklärung ein.
- source_word: עָבְרוּ
  choice: übertreten hat
  rationale: Das Verb bedeutet wörtlich ein Überschreiten und bezeichnet mit »Bund« als Objekt dessen Verletzung.
- source_word: הַגּוֹי הַזֶּה
  choice: dieses Volk
  rationale: Im Deutschen bezeichnet »Volk« Israel hier natürlicher als »Nation«, ohne den kollektiven Sinn von גוי abzuschwächen.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: »Bund« ist die sachlich und theologisch passende Wiedergabe für ברית.
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: den ich ihren Vorfahren geboten habe
  rationale: Gibt die verdichtete Konstruktion so wieder, dass der Bund als Gegenstand des Gebots erkennbar bleibt.
- source_word: וְלֹא שָׁמְעוּ לְקוֹלִי
  choice: und nicht auf meine Stimme gehört hat
  rationale: Bewahrt das Hörbild des hebräischen Idioms; im Zusammenhang schließt es Gehorsam ein. Der Singular folgt dem kollektiven Subjekt »dieses Volk«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen. »Jahwe« bewahrt ihn als Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Bundesrechtliche Sprache
  choice: meinen Bund übertreten ... nicht auf meine Stimme gehört
  alternative: meinen Bund gebrochen ... mir nicht gehorcht
  rationale: Die gewählte Fassung erhält sowohl das Bild des Überschreitens als auch das hebräische Hörmotiv, ohne den darin enthaltenen Sinn von Bundesbruch und Ungehorsam zu verdecken.
- issue: Numerus beim Kollektivbegriff הַגּוֹי הַזֶּה
  choice: dieses Volk ... hat ... hat
  alternative: diese Nation ... hat; dieses Volk ... sie haben
  rationale: Das Hebräische verbindet den singularischen Kollektivbegriff mit pluralischen Verben. Idiomatisches Deutsch verwendet hier durchgehend den Singular; der kollektive Bezug bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt wie im Ausgangstext syntaktisch offen, da der Satz im folgenden Vers fortgeführt wird. »Vorfahren« ist heute allgemein verständlicher als »Väter«, ohne den generationsbezogenen Sinn einzuschränken.
