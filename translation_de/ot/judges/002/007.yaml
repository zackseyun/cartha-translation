  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: de
  text: Das Volk diente Jahwe, solange Josua lebte, und auch solange die Ältesten lebten, die Josua überlebten und das ganze große Werk[a] Jahwes gesehen hatten, das er für Israel vollbracht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen der Singular „das große Werk“; möglich sind auch „die große Tat“ oder „das große Handeln“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: diente
  rationale: עבד mit Jahwe als Objekt bezeichnet den Dienst in bundestreuer Hingabe; dazu gehört Anbetung, doch der Ausdruck ist weiter gefasst.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bezeichnet hier die israelitische Gemeinschaft als Ganzes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹּל יְמֵי יְהוֹשֻׁעַ
  choice: solange Josua lebte
  rationale: Die hebräische Zeitformel bezeichnet die gesamte Lebenszeit Josuas; die deutsche Formulierung ist natürlich und inhaltlich präzise.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: Der Ausdruck bezeichnet anerkannte ältere Führungspersonen und bewahrt zugleich die traditionelle soziale Bezeichnung.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשׁוּעַ
  choice: die Josua überlebten
  rationale: Die Wendung besagt, dass diese Ältesten nach Josua weiterlebten.
- source_word: רָאוּ
  choice: gesehen hatten
  rationale: Das Plusquamperfekt verdeutlicht, dass ihr Erleben der Taten Jahwes ihrer fortdauernden Treue vorausging.
- source_word: כָּל מַעֲשֵׂה יְהוָה הַגָּדוֹל
  choice: das ganze große Werk Jahwes
  rationale: Der singularische Ausdruck fasst Jahwes machtvolles Handeln für Israel als ein Gesamtwerk zusammen.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: für Israel vollbracht hatte
  rationale: לְ ist hier benefaktiv; „vollbracht“ gibt das bedeutungsvolle Handeln im Deutschen natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עבד im Verhältnis zu Jahwe
  choice: dienen
  alternative: anbeten
  rationale: „Dienen“ erhält den umfassenden Gedanken der Bundestreue; „anbeten“ würde die Bedeutung stärker auf kultische Verehrung verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „solange … lebte“ bildet die beiden hebräischen Zeitangaben natürlich ab; der Gottesname wird als „Jahwe“ wiedergegeben.
