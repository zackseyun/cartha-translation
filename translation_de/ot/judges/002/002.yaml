source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: de
  text: Ihr aber solltet keinen Bund mit den Bewohnern dieses Landes schließen[a]; ihre Altäre solltet ihr niederreißen. Doch ihr habt nicht auf meine Stimme gehört. Was habt ihr da getan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Bund schneiden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: einen Bund schließen
  rationale: Die hebräische Wendung lautet wörtlich »einen Bund schneiden«. »Einen Bund schließen« ist die entsprechende natürliche deutsche Redewendung und bewahrt den umfassenderen Bundesbegriff gegenüber dem engeren »einen Vertrag schließen«.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: mit den Bewohnern dieses Landes
  rationale: Das substantivierte Partizip bezeichnet die Menschen, die in dem Land wohnen; »Bewohner« ist präzise und allgemein verständlich. »Dieses Landes« gibt den Demonstrativbezug wieder.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: ihre Altäre solltet ihr niederreißen
  rationale: נתץ bezeichnet das Einreißen oder Zerstören von Bauwerken und Altären. »Niederreißen« ist anschaulich und idiomatisch. »Solltet« stellt die im Rückblick angeführte Verpflichtung dar.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: Doch ihr habt nicht auf meine Stimme gehört
  rationale: שמע בקול schließt im Kontext Gehorsam ein. Die Formulierung bewahrt das Bild der Stimme, ohne die Bedeutung ausdrücklich auf »gehorchen« zu verengen; »doch« macht den Gegensatz zur vorausgehenden Weisung deutlich.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: Was habt ihr da getan?
  rationale: Das deutsche »da« gibt die nachdrückliche, vorwurfsvolle Funktion von זֹּאת natürlich wieder. Die Frage richtet sich auf die Tat und wird daher nicht als Warum-Frage wiedergegeben.
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: Ihr aber solltet keinen ...; ... solltet ihr
  rationale: Die Imperfektformen rufen frühere göttliche Weisungen in Erinnerung, bevor der folgende Perfektsatz Israels Versagen feststellt. Die rückblickende Verpflichtung wird im Deutschen passend mit »solltet« ausgedrückt.
theological_decisions:
- issue: Bezeichnung der untersagten Beziehung zu den Bewohnern des Landes
  choice: einen Bund schließen
  alternative: einen Vertrag schließen
  rationale: »Bund« bewahrt die Breite und das biblisch-theologische Gewicht von בְּרִית, ohne die Beziehung auf einen rein politischen Vertrag zu beschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Anrede im Plural und das Bild »auf meine Stimme gehört« bleiben erhalten. Die Schlussfrage ist natürlich formuliert, bewahrt aber durch »da« ihren scharfen, vorwurfsvollen Nachdruck.
