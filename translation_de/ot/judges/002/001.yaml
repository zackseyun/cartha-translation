source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: de
  text: 'Da zog der Engel Jahwes[a] von Gilgal nach Bochim[b] hinauf und sagte: »Ich habe euch aus Ägypten heraufgeführt[c] und euch in das Land gebracht, das ich euren Vätern zugeschworen hatte. Ich sagte: ›Ich werde meinen Bund mit euch niemals brechen.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: Bochim bedeutet wahrscheinlich »Weinende« oder bezeichnet einen Ort des Weinens.
    reason: cultural_note
  - marker: c
    text: Die hebräische Verbform kann wörtlich auch mit »Ich werde euch aus Ägypten heraufführen« wiedergegeben werden; im Zusammenhang bezeichnet sie wahrscheinlich die bereits geschehene Herausführung.
    reason: textual_ambiguity
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten. »Engel Jahwes« ist in diesem Erzählzusammenhang die geläufige, natürliche Wiedergabe; die mögliche Bedeutung »Bote« bleibt in einer Fußnote erhalten. Der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. »zog … hinauf« bewahrt die räumliche Richtung und klingt im Deutschen bei einer Ortsveränderung natürlich.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Der Ortsname wird in seiner etablierten deutschen Form beibehalten.
- source_word: הַבֹּכִים
  choice: Bochim
  rationale: Die Form wird als Ortsname transliteriert. Ihre erkennbare Beziehung zum Weinen wird in einer Fußnote erläutert, statt den Namen im Haupttext aufzulösen.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: Ich habe euch aus Ägypten heraufgeführt
  rationale: Die Verbform ist formal ein Imperfekt und kann für sich genommen futurisch verstanden werden. Im Zusammenhang blickt die Rede jedoch auf die bereits geschehene Herausführung und Landgabe zurück; das deutsche Perfekt gibt diesen Rückblick natürlich wieder. Die formale Alternative wird in einer Fußnote vermerkt.
- source_word: וָאָבִיא אֶתְכֶם אֶל הָאָרֶץ
  choice: und euch in das Land gebracht
  rationale: Das Hifil von בוא bedeutet »hineinbringen« beziehungsweise »bringen«; das Ziel wird mit »in das Land« klar und idiomatisch ausgedrückt.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: das ich euren Vätern zugeschworen hatte
  rationale: »euren Vätern« bewahrt die ausdrücklich maskuline Form und den Bezug auf die Väter Israels. »zugeschworen« verbindet den Eid im Deutschen natürlich mit dem verheißenen Land.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: Ich werde meinen Bund mit euch niemals brechen
  rationale: הפר bezeichnet beim Bund das Brechen, Aufheben oder Verletzen. »einen Bund brechen« ist die klare deutsche Wendung; die Verbindung aus Verneinung und לְעוֹלָם wird idiomatisch mit »niemals« wiedergegeben.
theological_decisions:
- issue: Identität des מַלְאַךְ יְהוָה
  choice: »Engel Jahwes«, ohne seine Identität näher festzulegen
  alternative: »Bote Jahwes«; Deutung als geschaffenes Engelwesen oder als Erscheinung Jahwes selbst
  rationale: Der Sprecher wird als Engel beziehungsweise Bote Jahwes eingeführt, redet aber in der ersten Person von Jahwes eigenen Heilstaten und seinem Bund. Die Übersetzung bewahrt diese Spannung und entscheidet nicht, wie die Gestalt ontologisch einzuordnen ist.
- issue: Geltung der Bundeszusage
  choice: Die unbedingte Formulierung »niemals brechen« wird beibehalten
  alternative: Eine konditionale oder zeitlich begrenzte Umschreibung
  rationale: Der hebräische Satz formuliert Jahwes Aussage nachdrücklich und ohne hier ausdrücklich genannte Bedingung. Die Übersetzung fügt keine systematische Einschränkung hinzu; die folgende Anklage des Abschnitts darf die Spannung entfalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt klar gegliedert; »zugeschworen« und »Bund« bewahren den feierlichen Bundescharakter, ohne altertümlich zu wirken. Der Gottesname wird konsequent als »Jahwe« wiedergegeben.
