  terminology: »Engel Jahwes«, »Jahwe«, »Bund«, »Gilgal« und »Bochim« sind konsistent und sachgerecht. Die Fußnote zu »Bote Jahwes« bewahrt die lexikalische Alternative, ohne die im Text vorhandene theologische Spannung aufzulösen. Die Erklärung von Bochim als »Weinende« bzw. Ort des Weinens ist angemessen.
