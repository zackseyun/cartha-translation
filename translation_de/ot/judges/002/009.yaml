  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: de
  text: Und sie begruben ihn im Gebiet seines Erbbesitzes, in Timnat-Heres[a], im Bergland Ephraim, nördlich des Berges Gaasch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Josua 24,30 lautet der Ortsname »Timnat-Serach« statt »Timnat-Heres«. Die Namensvariation wird hier in den parallelen Berichten über die Bestattung beibehalten.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אוֹתוֹ
  choice: Und sie begruben ihn
  rationale: Das Wayyiqtol führt die Erzählung mit einem vergangenen Ereignis fort; אוֹתוֹ bezeichnet Josua als direktes Objekt.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: im Gebiet seines Erbbesitzes
  rationale: גְּבוּל meint hier das abgegrenzte Gebiet, nicht nur dessen Grenze. נַחֲלָה bezeichnet den als Erbe beziehungsweise Anteil zugewiesenen Landbesitz.
- source_word: בְּתִמְנַת חֶרֶס
  choice: in Timnat-Heres
  rationale: Der Ortsname wird in einer dem Deutschen angemessenen Transliteration wiedergegeben; die Präposition bezeichnet den Bestattungsort.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraim
  rationale: הַר bezeichnet in dieser geografischen Verbindung eine Bergregion und nicht einen einzelnen Berg.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: nördlich vom Berg Gaasch
  rationale: Die Wendung gibt die relative Lage zu dem als Bergnamen verstandenen גָּעַשׁ an.
theological_decisions: []
translation_notes:
  register: Natürliche, würdige Standardsprache. »Erbbesitz« bewahrt den Gedanken des zugewiesenen Landanteils; »Bergland« macht die geografische Bedeutung von הַר אֶפְרָיִם deutlich. Der Fußnotenmarker steht unmittelbar beim betroffenen Ortsnamen.
