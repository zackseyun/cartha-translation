  text: וַ/יַּעַזְב֖וּ אֶת יְהוָ֑ה וַ/יַּעַבְד֥וּ לַ/בַּ֖עַל וְ/לָ/עַשְׁתָּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: de
  text: Sie verließen Jahwe und dienten dem Baal und den Astarten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie kehrten Jahwe den Rücken und verehrten den Baal und die Astarten.“'
    reason: Lexikalische Alternativen für עזב und עבד; die Hauptfassung bewahrt jeweils die breitere Grundbedeutung.
  - marker: b
    text: Hebräisch „die Aschtarot“, eine Pluralform. Gemeint sein können mehrere Erscheinungsformen oder Kultbilder der auch Aschtoret beziehungsweise Astarte genannten Göttin.
    reason: Die morphologische Mehrzahl und ihre sachliche Mehrdeutigkeit sollen sichtbar bleiben.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: sie verließen
  rationale: עזב bedeutet verlassen, aufgeben oder im Stich lassen. „Verließen“ ist natürliches modernes Deutsch und lässt hier im Zusammenhang den Gedanken der Untreue erkennen, ohne ihn stärker auszudeuten als das Verb selbst.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der persönliche Name im Ausgangstext erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: עבד kann sowohl allgemein „dienen“ als auch im kultischen Zusammenhang „verehren“ bedeuten. „Dienten“ bewahrt die Bedeutungsbreite; der religiöse Sinn ergibt sich aus den genannten Gottheiten.
- source_word: לַבַּעַל
  choice: dem Baal
  rationale: Der hebräische Ausdruck trägt den Artikel. „Dem Baal“ bewahrt ihn und ist im Deutschen als Bezeichnung der Gottheit beziehungsweise des Gottheitstyps verständlich.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: den Astarten
  rationale: עַשְׁתָּרוֹת ist eine Pluralform. „Den Astarten“ gibt den Plural in geläufiger deutscher Namensform wieder, ohne ihn zu einer einzelnen Göttin zu vereinheitlichen.
theological_decisions:
- issue: Pluralform עַשְׁתָּרוֹת
  choice: den Astarten
  alternative: der Astarte / der Aschtoret
  rationale: Der Haupttext wahrt den grammatischen Plural. Ob damit mehrere Göttinnen, lokale Erscheinungsformen oder Kultbilder gemeint sind, bleibt offen und wird in der Fußnote erläutert.
- issue: Kultische Bedeutung von עבד
  choice: dienten
  alternative: verehrten
  rationale: „Dienten“ folgt der breiteren Grundbedeutung des hebräischen Verbs und lässt dessen kultische Nuance im Kontext bestehen, ohne sie auf „anbeten“ einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und entspricht der hebräischen Abfolge. „Jahwe“ bewahrt den Gottesnamen; „dem Baal“ den im Hebräischen vorhandenen Artikel; „Astarten“ macht die Pluralform verständlich. Alle Fußnotenmarker stehen im Haupttext.
