  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: de
  text: um Israel durch sie[a] auf die Probe zu stellen, ob sie den Weg Jahwes befolgen würden, indem sie auf ihm gingen, wie ihre Väter ihn befolgt hatten, oder nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit ihnen«. Das hebräische Pronomen bezieht sich auf die im Land zurückgelassenen Völker (siehe den vorhergehenden Zusammenhang).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: um … zu
  rationale: Gibt die Zweckangabe im Deutschen natürlich und präzise wieder.
- source_word: נַסּוֹת
  choice: auf die Probe zu stellen
  rationale: Bezeichnet hier das Prüfen Israels; die Wendung ist im modernen Deutschen idiomatischer als das schlichte „zu prüfen“.
- source_word: בָּם
  choice: durch sie
  rationale: Das Pronomen verweist auf die im Land zurückgelassenen Völker und lässt sich instrumental als „durch sie“ verstehen.
- source_word: הֲשֹׁמְרִים
  choice: ob sie … bewahren … würden
  rationale: Die Fragepartikel mit Partizip bezeichnet den Inhalt der Prüfung. Der deutsche Konjunktiv II fügt sich natürlich in die abhängige Frage ein.
- source_word: דֶּרֶךְ יְהוָה
  choice: den Weg Jahwes
  rationale: Bewahrt das biblische Bild eines von Jahwe vorgegebenen Lebensweges und gibt den Gottesnamen als Eigennamen wieder.
- source_word: לָלֶכֶת בָּם
  choice: auf ihm gehen
  rationale: Gibt das Bild des Gehens auf dem Weg wieder. Obwohl das hebräische Pronomen formal pluralisch ist, bezieht es sich sinngemäß auf „Weg“.
- source_word: שָׁמְרוּ אֲבוֹתָם
  choice: ihre Väter ihn bewahrt hatten
  rationale: Wiederholt bewusst dasselbe Verb wie zuvor und erhält die ausdrücklich männliche genealogische Bezeichnung.
- source_word: אִם לֹא
  choice: oder nicht
  rationale: Vervollständigt die indirekte Entscheidungsfrage im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung der Vorfahren אֲבוֹתָם
  choice: ihre Väter
  alternative: ihre Vorfahren
  rationale: „Väter“ entspricht der ausdrücklich maskulinen und genealogischen Form des Hebräischen; die neutralere Alternative ist möglich, aber weniger formnah.
- issue: Verhältnis von „den Weg bewahren“ und „auf ihm gehen“
  choice: beide Wendungen beibehalten
  alternative: den Weg Jahwes einhalten
  rationale: Die Bildsprache und die erläuternde Doppelung des Hebräischen bleiben sichtbar, ohne sie zu einer abstrakten Gehorsamsformel zusammenzuziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als zweckangebender Anschluss an den vorhergehenden Vers fragmentarisch, wie es der hebräische Zusammenhang verlangt. Die Wegmetaphorik und die Wiederholung von „bewahren“ wurden erhalten.
