  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: de
  text: Und sie verließen Jahwe, den Gott ihrer Väter, der sie aus dem Land Ägypten herausgeführt hatte. Sie liefen anderen Göttern nach, Göttern der Völker rings um sie[a], warfen sich vor ihnen nieder und reizten Jahwe zum Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lässt sich die Wendung auch mit „von den Göttern der Völker rings um sie“ wiedergeben. Das hebräische מִן kann hier eine Auswahl bezeichnen: Sie folgten einigen der Götter, die von den umliegenden Völkern verehrt wurden.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: sie verließen
  rationale: עזב bezeichnet hier die Abkehr von Jahwe. „Verließen“ ist modernes, natürliches Deutsch und bewahrt die relationale Aussage, ohne den Bundesbruch ausdrücklich in den Text hineinzuerklären.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: den Gott ihrer Väter
  rationale: Die traditionelle und im Deutschen verständliche Bundesformel gibt den maskulinen Plural אֲבוֹתָם unmittelbar wieder.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: der sie aus dem Land Ägypten herausgeführt hatte
  rationale: Der attributive Partizipialsatz kennzeichnet Jahwe durch den Exodus. Das Plusquamperfekt fügt sich in die rückblickende Erzählfolge ein.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: sie liefen … nach
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des Hinterhergehens und bezeichnet zugleich Gefolgschaft.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: אֲחֵרִים bedeutet direkt „andere“; „fremde“ wäre stärker deutend.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: Göttern der Völker rings um sie
  rationale: Die appositionelle Formulierung ist im Deutschen natürlich und ordnet die anderen Götter den umliegenden Völkern zu. Die mögliche partitive Nuance von מִן wird in der Fußnote offengelegt.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: warfen sich vor ihnen nieder
  rationale: Die konkrete Körperhandlung des Sich-Niederwerfens bleibt erhalten; im Zusammenhang ist ihre kultische Bedeutung deutlich.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: reizten Jahwe zum Zorn
  rationale: Die Formulierung gibt die kausative Bedeutung des Hifil von כעס präzise und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen. Die gebräuchliche deutsche Form „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bundesbezogene Bedeutung des Abfalls Israels
  choice: Die relationale Sprache des Ausgangstextes beibehalten
  alternative: Den Vorgang ausdrücklich als Bundesbruch bezeichnen
  rationale: Verlassen, anderen Göttern nachlaufen, Niederwerfen und Zum-Zorn-Reizen tragen das theologische Gewicht bereits. Eine ausdrückliche Deutung als „Bundesbruch“ würde über den Wortlaut hinausgehen.
- issue: Status der „anderen Götter“
  choice: Die Redeweise des Textes unverändert als „Götter“ wiedergeben
  alternative: Götzen; vermeintliche Götter
  rationale: Der Vers nennt sie אֱלֹהִים, ohne hier ihre ontologische Wirklichkeit zu erläutern. „Götzen“ oder „vermeintliche Götter“ würde diese Spannung interpretierend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde nach dem Relativsatz geteilt, um die Verständlichkeit zu erhöhen; die Abfolge der Handlungen bleibt erhalten. „Väter“ wahrt die biblische Bundesformel, während „rings um sie“ gegenwärtig und allgemein verständlich ist.
