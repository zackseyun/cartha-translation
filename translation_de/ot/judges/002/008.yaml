source:
  edition: WLC
  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: de
  text: Und Josua, der Sohn Nuns, der Diener Jahwes[a], starb im Alter von hundertzehn Jahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Sklave Jahwes“. Das hebräische Wort kann sowohl „Diener“ als auch „Sklave“ bedeuten; hier wird es als ehrender Titel für Josua gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Und … starb
  rationale: Das Qal-Wayyiqtol von מות führt die Erzählung fort; die deutsche Satzverbindung wird mit „Und“ wiedergegeben.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: בִּן נוּן
  choice: der Sohn Nuns
  rationale: Die Constructusverbindung bezeichnet die Abstammung; „Sohn Nuns“ ist im Deutschen natürlich und eindeutig.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: עֶבֶד kann „Diener“ oder „Sklave“ bedeuten. Hier ist es ein ehrender Titel für Josua; „Diener“ gibt diese Funktion angemessen wieder, ohne die mögliche stärkere Bedeutung zu verschweigen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben, statt es durch den Titel „der HERR“ zu ersetzen.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: im Alter von hundertzehn Jahren
  rationale: Die wörtliche hebräische Altersangabe „ein Sohn von hundertzehn Jahren“ wird in natürliches modernes Deutsch übertragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Namen und entspricht der üblichen deutschen wissenschaftlichen Form.
- issue: Wiedergabe von עֶבֶד als Titel Josuas
  choice: Diener
  alternative: Sklave
  rationale: Das Wort umfasst beide Bedeutungen. In diesem Zusammenhang fungiert es als ehrender Beziehungstitel; „Diener“ ist daher im Haupttext angemessen, während die Fußnote die stärkere lexikalische Alternative bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erzählerische Anfangsverknüpfung und der Gottesname bleiben erhalten; die hebräische Altersformel wird idiomatisch wiedergegeben.
