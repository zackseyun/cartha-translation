  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: de
  text: 'Darum habe auch ich gesagt: »Ich werde sie nicht vor euch vertreiben. Sie werden euch zu Widersachern[a], und ihre Götter werden euch zur Falle.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu Seiten«. Einige alte Übersetzungen sowie ähnliche Stellen verstehen die Wendung im Sinn von »Dornen in euren Seiten«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אָמַרְתִּי
  choice: Darum habe auch ich gesagt
  rationale: „Darum“ gibt im Zusammenhang die folgernde Kraft der Verbindung wieder; „auch ich“ bewahrt die Hervorhebung durch גַם. Das Perfekt entspricht dem hebräischen אָמַרְתִּי und klingt in modernem Deutsch natürlich.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: Ich werde sie nicht vertreiben
  rationale: גרש bezeichnet hier das Vertreiben der im Land verbliebenen Völker. Die Zukunftsform gibt den nicht eintretenden göttlichen Eingriff klar wieder.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die knappe räumliche Wendung bewahrt das hebräische Bild, ohne die im Deutschen schwerfällige Form „vor eurem Angesicht“ zu verwenden.
- source_word: לְצִדִּים
  choice: zu Widersachern
  rationale: Der masoretische Text lautet wörtlich „zu Seiten“, eine schwierige Formulierung, deren Sinn wahrscheinlich feindlicher Druck oder Bedrängnis ist. „Widersacher“ gibt diesen Sinn verständlich wieder; die ungewöhnliche Ausgangslesart und die alte Deutung als „Dornen in euren Seiten“ werden in der Fußnote offengelegt.
- source_word: וֵאלֹהֵיהֶם
  choice: und ihre Götter
  rationale: Die übliche und kontextgerechte Wiedergabe von אֱלֹהִים mit dem Suffix der dritten Person Plural.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: werden euch zur Falle werden
  rationale: מוֹקֵשׁ bezeichnet eine Falle oder Schlinge und wird hier bildlich für die religiöse Verführung und ihre Gefahr gebraucht. „Falle“ ist im heutigen Deutsch klar und bewahrt das Bild.
theological_decisions:
- issue: Die schwierige masoretische Lesart לְצִדִּים
  choice: Widersacher
  alternative: 'Dornen in euren Seiten; wörtlich: Seiten'
  rationale: Die Übersetzung ersetzt den überlieferten Konsonantentext nicht stillschweigend durch die aus alten Übersetzungen und Parallelstellen bekannte Dornen-Lesart. Im Haupttext steht der wahrscheinlich gemeinte feindliche Sinn; die Fußnote nennt sowohl den ungewöhnlichen Wortlaut als auch die traditionelle Alternative und erhält so die textliche Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; unnatürliche Wörtlichkeit wird vermieden, während die schwierige hebräische Lesart durch die unmittelbar markierte Fußnote transparent bleibt.
