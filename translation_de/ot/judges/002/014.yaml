  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Hebräischen zutreffend wieder: der entbrennende Zorn Jahwes, die Auslieferung an Plünderer, das Ausplündern, das Verkaufen in die Gewalt der umliegenden Feinde und die anschließende Wehrlosigkeit Israels. »standhalten« ist eine natürliche und sachgerechte Wiedergabe von לַעֲמֹד לִפְנֵי in diesem Kontext.'
  naturalness: »In die Hand von Plünderern« ist im modernen Standarddeutsch weniger idiomatisch als »in die Hand der Plünderer«. Die entsprechende Genitivfügung ist auch bei »ihrer Feinde« die übliche Form. Die Wiederholung der hebräischen Hand-Metapher bleibt dabei erhalten.
  terminology: »Jahwe«, »Zorn«, »Plünderer/ausplünderten« und »verkaufte« sind quellentreu und im gegebenen Register passend. Die Fußnoten sollten die zwei im englischen Audit getrennt ausgewiesenen Punkte – die Hand-Wendung und »ringsum« – an ihren jeweiligen Textstellen gesondert verankern.
