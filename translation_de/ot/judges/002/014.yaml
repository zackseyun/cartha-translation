base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: de
  text: Da entbrannte der Zorn Jahwes über Israel[a]. Er gab sie in die Hand der Plünderer[b], die sie ausplünderten. Er verkaufte sie in die Hand ihrer Feinde ringsum[c], sodass sie ihren Feinden nicht länger standhalten konnten.
