  - severity: low
    issue: Zusammengezogene Fußnotenverankerung
    rationale: Die Erklärung der hebräischen Wendung »in die Hand« und die Alternative zu »ringsum« betreffen unterschiedliche Ausdrücke. Getrennte Marker unmittelbar an den jeweiligen Ausdrücken sind klarer und entsprechen dem englischen Audit.
