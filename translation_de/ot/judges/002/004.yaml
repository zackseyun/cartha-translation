  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: de
  text: Als der Engel Jahwes[a] diese Worte zu allen Israeliten[b] sprach, erhob das Volk seine Stimme und weinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zu allen Söhnen Israels«.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Als ... gesprochen hatte
  rationale: Die Konstruktion aus וַיְהִי und dem Infinitiv mit כְּ leitet einen zeitlichen Nebensatz ein. Das deutsche Perfekt gibt natürlich wieder, dass die Reaktion auf die abgeschlossene Rede folgt.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten. Im festen erzählerischen Ausdruck מַלְאַךְ יְהוָה ist »Engel Jahwes« die geläufige Hauptwiedergabe; die echte lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים bezeichnet hier den unmittelbar zuvor gesprochenen Inhalt; »Worte« bewahrt den sprachlichen Bezug.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: zu allen Söhnen Israels
  rationale: Die formnahe Wiedergabe erhält die konkrete hebräische Wendung בְּנֵי יִשְׂרָאֵל. Das idiomatischere »zu allen Israeliten« steht als Alternative in der Fußnote.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: erhob das Volk seine Stimme
  rationale: Die deutsche Wendung bildet den hebräischen Singular des Kollektivums הָעָם und das singularische קוֹלָם möglichst eng ab und bezeichnet ein hörbares gemeinsames Klagen.
- source_word: וַיִּבְכּוּ
  choice: und weinte
  rationale: בכה bedeutet »weinen«; der deutsche Singular richtet sich idiomatisch nach dem Kollektivsubjekt »das Volk«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. »Jahwe« bewahrt ihn, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Bedeutung von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Die Übersetzung »Engel« folgt dem etablierten biblischen Sprachgebrauch, ohne die lexikalisch mögliche Bedeutung »Bote« zu verschweigen oder die Gestalt darüber hinaus theologisch zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formnaher Bewahrung zentraler hebräischer Wendungen. Die Satzstellung bleibt natürlich; »erhob das Volk seine Stimme« wahrt bewusst den kollektiven Singular.
