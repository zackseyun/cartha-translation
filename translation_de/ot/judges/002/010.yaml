source:
  edition: WLC
  text: וְ/גַם֙ כָּל הַ/דּ֣וֹר הַ/ה֔וּא נֶאֶסְפ֖וּ אֶל אֲבוֹתָ֑י/ו וַ/יָּקָם֩ דּ֨וֹר אַחֵ֜ר אַחֲרֵי/הֶ֗ם אֲשֶׁ֤ר לֹא יָֽדְעוּ֙ אֶת יְהוָ֔ה וְ/גַם֙ אֶת הַֽ/מַּעֲשֶׂ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: de
  text: Auch jene ganze Generation wurde zu ihren Vorfahren versammelt[a]. Nach ihnen kam eine andere Generation auf, die Jahwe[b] nicht kannte und auch nicht das Werk, das er für Israel getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräische Wendung für das Sterben und die Vereinigung mit den Vorfahren.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Jahwe nicht anerkannte“. Das hebräische Wort kann neben sachlichem Wissen auch erfahrungsbezogene, relationale oder bundesmäßige Kenntnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: Auch jene ganze Generation
  rationale: וְגַם setzt den Vers additiv zum vorherigen Zusammenhang fort; „auch“ gibt dies im Deutschen natürlich wieder. כָּל wird mit „ganze“ ausdrücklich erhalten.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: wurde zu ihren Vorfahren versammelt
  rationale: Die hebräische Todesformel bleibt als Bild erhalten; „Vorfahren“ ist im heutigen Deutsch verständlicher und geschlechtsübergreifender als das wörtliche „Väter“.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: Nach ihnen kam eine andere Generation auf
  rationale: „kam … auf“ bezeichnet idiomatisch das Auftreten einer nachfolgenden Generation und bewahrt mit „nach ihnen“ die zeitliche und personale Folge.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: die Jahwe nicht kannte
  rationale: „kennen“ lässt die Bandbreite von sachlicher Kenntnis bis zu erfahrungsbezogener und bundesmäßiger Anerkennung offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt ihn als Eigennamen.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה
  choice: und auch nicht das Werk
  rationale: Im Anschluss an die Verneinung gibt „und auch nicht“ die additive Kraft von וְגַם natürlich wieder; „Werk“ kann die Gesamtheit von Jahwes Taten zusammenfassend bezeichnen.
- source_word: אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: das er für Israel getan hatte
  rationale: Das ל wird im Kontext benefaktiv verstanden. Das Plusquamperfekt verdeutlicht, dass die Taten vor dem Auftreten dieser Generation lagen.
theological_decisions:
- issue: Bedeutung von „Jahwe nicht kennen“
  choice: Die breite Formulierung „nicht kannte“ bleibt im Haupttext erhalten.
  alternative: „Jahwe nicht anerkannte“ oder „nichts von Jahwe wusste“
  rationale: יָדַע kann Wissen, Erfahrung, Beziehung und bundesmäßige Anerkennung umfassen. Der Kontext verbindet die fehlende Kenntnis Jahwes mit der fehlenden Kenntnis seines Werkes, ohne das Verhältnis beider Aspekte abschließend festzulegen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname entspricht dem hebräischen Text und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Sinn von „zu ihren Vorfahren versammelt“
  choice: Die traditionelle Todesformel wird bildhaft bewahrt.
  alternative: „starb“
  rationale: Eine bloße Wiedergabe mit „starb“ würde das Generationenmotiv und die Vorstellung der Verbindung mit den Vorfahren abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Todesformel und die Mehrdeutigkeit von „kennen“ bleiben erhalten; ungewöhnliche Elemente werden knapp in Fußnoten erläutert.
