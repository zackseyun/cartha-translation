  terminology: „Jahwe“, „Richter“, „rettete“ und „aus der Gewalt ihrer Feinde“ sind sachgerecht. Die Fußnote soll die Bedeutungsbreite von יִנָּחֵם bewahren, ohne die Hauptaussage dogmatisch zu verengen.
