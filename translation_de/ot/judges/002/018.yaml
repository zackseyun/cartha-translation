  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: de
  text: Immer wenn Jahwe ihnen Richter einsetzte, war Jahwe mit dem jeweiligen Richter und rettete sie aus der Gewalt ihrer Feinde, solange der Richter lebte. Denn Jahwe ließ sich durch ihr Stöhnen unter ihren Bedrängern und Unterdrückern zum Mitleid bewegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Jahwe ließ sich wegen ihres Stöhnens unter ihren Bedrängern und Unterdrückern umstimmen.“ Das hebräische Verb kann sowohl eine Änderung der Haltung als auch eine mitleidsvolle Reaktion ausdrücken.'
    reason: lexikalische Alternative bei יִנָּחֵם und Bewahrung der Bedeutungsbreite
lexical_decisions:
- source_word: וְכִי
  choice: Immer wenn
  rationale: Im zusammenfassenden Kontext bezeichnet die Wendung ein wiederkehrendes Geschehen.
- source_word: הֵקִים
  choice: einsetzte
  rationale: Das Hifil bezeichnet hier Jahwes Initiative, Richter auftreten zu lassen beziehungsweise zu bestellen; „einsetzen“ ist im Deutschen natürlich und präzise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שֹׁפְטִים
  choice: Richter
  rationale: „Richter“ ist die etablierte und kontextuell angemessene Bezeichnung für diese von Gott berufenen Führungsgestalten.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: war Jahwe mit dem jeweiligen Richter
  rationale: Die Formulierung bewahrt die Aussage von Jahwes wirksamer Gegenwart; „jeweiligen“ verdeutlicht den distributiven Sinn im wiederkehrenden Ablauf.
- source_word: וְהוֹשִׁיעָם
  choice: rettete sie
  rationale: Das Hifil von ישׁע bezeichnet Rettung beziehungsweise Befreiung; der folgende Ausdruck benennt die feindliche Gewalt, aus der gerettet wird.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: aus der Gewalt ihrer Feinde
  rationale: Die hebräische Hand-Metapher bezeichnet hier Macht oder Verfügungsgewalt; die idiomatische deutsche Wiedergabe vermittelt diesen Sinn klar.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: solange der Richter lebte
  rationale: Die Wendung bezeichnet in diesem Zusammenhang die gesamte Lebens- beziehungsweise Wirkungszeit des Richters; die natürliche deutsche Form macht den zeitlichen Sinn deutlich.
- source_word: יִנָּחֵם
  choice: ließ sich … zum Mitleid bewegen
  rationale: Das Nifal von נחם kann hier eine mitleidsvolle Reaktion oder ein Sich-anders-Besinnen ausdrücken. Die Hauptfassung bewahrt die emotionale Reaktion, ohne eine moralische Verfehlung Gottes anzudeuten.
- source_word: מִנַּאֲקָתָם
  choice: durch ihr Stöhnen
  rationale: Die Präposition bezeichnet den Anlass, der Jahwes Reaktion hervorruft.
- source_word: מִפְּנֵי לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: über ihre Bedränger und Unterdrücker
  rationale: Die beiden Partizipien benennen diejenigen, die Israel bedrängen und unter Druck setzen; die substantivische Wiedergabe erhält die parallele Ausdrucksweise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Göttliche Reaktion in יִנָּחֵם יְהוָה
  choice: Jahwe ließ sich … zum Mitleid bewegen
  alternative: Jahwe ließ sich umstimmen / hatte Mitleid
  rationale: Die Formulierung gibt die im Text dargestellte responsive, mitleidsvolle Hinwendung wieder. Die Fußnote bewahrt zugleich die lexikalische Möglichkeit einer Änderung der Haltung, ohne die Spannung dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aus der Gewalt“ gibt die hebräische Hand-Metapher idiomatisch wieder. „Bedränger und Unterdrücker“ erhält die zwei annähernd parallelen Täterbezeichnungen. Der Fußnotenmarker steht unmittelbar nach dem Satzteil, auf den sich die Bedeutungsalternative bezieht.
