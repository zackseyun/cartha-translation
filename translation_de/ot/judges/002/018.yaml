  source_fidelity: 'Die Übersetzung gibt die wiederholte Handlung von וְכִי angemessen mit „Immer wenn“ wieder und bewahrt die Abfolge: Jahwe setzt Richter ein, ist mit dem Richter, rettet Israel aus feindlicher Gewalt und reagiert auf ihr Stöhnen. „Solange der Richter lebte“ ist im Kontext eine natürliche Entfaltung von „alle Tage des Richters“. Die Formulierung „über ihre Bedränger“ ist jedoch als Ursache des Stöhnens weniger eindeutig als das hebräische מִפְּנֵי; „unter ihren Bedrängern und Unterdrückern“ gibt den Bedrängungszusammenhang klarer wieder.'
