source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: de
  text: Und die Israeliten[a] taten, was böse war in den Augen Jahwes, und dienten den Baalen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »dienten« übersetzte hebräische Verb kann in diesem Zusammenhang auch »verehrten« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: taten
  rationale: Das häufige Verb עשה bedeutet »tun/machen«. In der Verbindung mit הָרַע ist »taten, was böse war« im Deutschen natürlich und gibt die moralische Bewertung präzise wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich »die Söhne Israels«. Hier bezeichnet die Wendung das Volk insgesamt; »die Israeliten« ist die natürliche, inklusive deutsche Entsprechung, während die wörtliche Form in der Fußnote erhalten bleibt.
- source_word: אֶת הָרַע
  choice: was böse war
  rationale: Das substantivierte הָרַע, wörtlich »das Böse«, steht als Objekt von »tun«. Die deutsche Wendung »taten, was böse war« bewahrt den Sinn ohne unnatürliche Formulierung.
- source_word: בְעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Metapher für Jahwes Beurteilung lässt sich im Deutschen verständlich und würdevoll wörtlich bewahren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als »Jahwe« wiedergegeben, der im modernen Deutschen üblichen Form des Tetragramms.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: עבד kann sowohl allgemeinen Dienst als auch kultische Verehrung bezeichnen. »Dienten« bewahrt diese Bedeutungsbreite und den Gegensatz zwischen dem Dienst für Jahwe und dem Dienst für andere Götter.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Der hebräische Plural bezeichnet die verschiedenen örtlichen Erscheinungsformen beziehungsweise Kulte des Baal. »Den Baalen« erhält diesen Plural.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den persönlichen Gottesnamen. »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד im Zusammenhang des Götzendienstes
  choice: dienten
  alternative: verehrten
  rationale: Der Kontext schließt kultische Verehrung ein, doch »dienten« bleibt näher am breiten Bedeutungsfeld des Verbs und bewahrt den theologischen Gegensatz des Dienstes für unterschiedliche Herren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die eröffnende Konjunktion »Und« bildet den fortlaufenden hebräischen Erzählzusammenhang ab. Die idiomatische Volksbezeichnung steht im Haupttext; die wörtliche familiäre Wendung wird in der Fußnote dokumentiert.
