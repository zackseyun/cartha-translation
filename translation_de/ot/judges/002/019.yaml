  source_fidelity: Der Entwurf gibt die temporale Einleitung, den Rückfall, die Steigerung gegenüber früheren Generationen, das Nachlaufen hinter anderen Göttern sowie die beiden unterschiedlichen kultischen Verben zuverlässig wieder. Auch die abschließende Aussage, dass sie ihre Taten und ihren verhärteten Lebensweg nicht aufgaben, ist sachlich getroffen.
  naturalness: 'Der Stil ist modernes, verständliches Standarddeutsch. Die Koordination „von keiner ihrer Taten und von ihrem eigensinnigen Weg ablassen“ ist jedoch syntaktisch und hinsichtlich der Negationsweite uneinheitlich: „keiner“ bezieht sich nur klar auf „Taten“. „weder ... noch ...“ ist idiomatischer und bildet die zweigliedrige hebräische Konstruktion sauber ab.'
  terminology: „Richter“, „andere Götter“, „dienten“ und „warfen sich ... nieder“ sind angemessen und bewahren die Begriffe und Unterschiede des hebräischen Textes. „Vorfahren“ ist hier eine natürliche kontextuelle Wiedergabe von „Väter“. „eigensinniger Weg“ ist als Wiedergabe von „harter/starrer Weg“ vertretbar.
