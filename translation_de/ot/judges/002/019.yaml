  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: de
  text: 'Und wenn der Richter starb, wandten sie sich wieder ab und handelten noch verderblicher als ihre Vorfahren: Sie liefen anderen Göttern nach, dienten ihnen und warfen sich vor ihnen nieder. Sie ließen weder von ihren Taten noch von ihrem eigensinnigen Weg ab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sie ließen nichts von ihren Taten und von ihrem harten Weg fallen.« Gemeint ist, dass sie diese nicht aufgaben.'
    reason: Das ungewöhnliche hebräische Bild mit dem Hifil von נפל wird im Haupttext idiomatisch wiedergegeben und hier transparent gemacht.
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: Und wenn der Richter starb
  rationale: Die hebräische Erzählformel wird als natürlicher deutscher Temporalsatz wiedergegeben. „Richter“ bewahrt die für das Buch charakteristische Bezeichnung des von Gott erweckten Retters und Leiters.
- source_word: יָשֻׁבוּ וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: wandten sie sich wieder ab und handelten noch verderblicher als ihre Vorfahren
  rationale: שׁוב bezeichnet hier den Rückfall nach dem Tod des Richters; „sich wieder abwenden“ macht im Zusammenhang die erneute Abkehr deutlich. Der Hifil von שׁחת bezeichnet verderbliches Handeln, und מִן trägt den Vergleich aus.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: Sie liefen anderen Göttern nach
  rationale: Die Bewegungsmetapher für Gefolgschaft und Loyalität bleibt erhalten. „Andere Götter“ gibt den covenantalen Gegensatz ohne zusätzliche ethnische Deutung wieder.
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: dienten ihnen und warfen sich vor ihnen nieder
  rationale: „Dienen“ wahrt die eigene Bedeutung von עבד; „sich niederwerfen“ erhält bei השתחוה die körperliche und kultische Dimension.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: Sie ließen von keiner ihrer Taten … ab
  rationale: Die Konstruktion bedeutet idiomatisch, nichts von den betreffenden Handlungen aufzugeben. „Von keiner … ablassen“ ist natürliches Deutsch und bewahrt durch die vollständige Negation den Sinn des hebräischen Bildes.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: und von ihrem eigensinnigen Weg
  rationale: דֶּרֶךְ bezeichnet bildlich ihre Lebens- und Verhaltensweise. קָשֶׁה beschreibt hier moralische Härte beziehungsweise Halsstarrigkeit; „eigensinnig“ ist verständlich und würdevoll.
theological_decisions:
- issue: אֱלֹהִים אֲחֵרִים im Zusammenhang des Abfalls Israels
  choice: andere Götter
  alternative: fremde Götter
  rationale: Der hebräische Ausdruck betont zunächst Gottheiten außer dem HERRN. „Fremde Götter“ könnte zusätzlich eine ethnische Herkunft in den Vordergrund rücken, die hier nicht ausdrücklich bezeichnet wird.
- issue: Vergleich mit מֵאֲבוֹתָם
  choice: noch verderblicher als ihre Vorfahren
  alternative: mehr als ihre Väter verdarben sie ihr Handeln
  rationale: Die gewählte Form gibt den Vergleich klar wieder, ohne eine Aussage über einen inneren ontologischen Zustand statt über ihr Verhalten einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. „Vorfahren“ ist im heutigen Deutsch natürlicher und inklusiver für frühere Generationen als das missverständliche „Väter“. Die drei Handlungen gegenüber den anderen Göttern bleiben als unterschiedliche Ausdrücke erhalten.
