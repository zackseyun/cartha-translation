  source_fidelity: 'Die Übersetzung trifft den Grundsinn: Jahwes Hand richtet sich gegen Israel, mit Unheil als Folge, entsprechend seinem vorherigen Reden und Schwören; Israel gerät in schwere Bedrängnis. „Brachte Unheil über sie“ macht jedoch aus der prädikativen hebräischen Aussage („war gegen sie zum Unheil“) eine zusätzliche verbale Handlung. Außerdem sollte die zweimalige Vergleichsstruktur des Hebräischen erkennbar bleiben.'
