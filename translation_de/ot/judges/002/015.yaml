  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: de
  text: Wohin sie auch auszogen,[a] war die Hand Jahwes gegen sie, zu ihrem Unheil, ebenso wie Jahwe gesagt hatte und wie Jahwe ihnen geschworen hatte; und sie gerieten in große Bedrängnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sooft sie auszogen“; möglicherweise ist besonders der Auszug zum Kampf oder zu einem Feldzug gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: Wohin sie auch auszogen
  rationale: Die Wendung bezeichnet umfassend alle Unternehmungen beziehungsweise Auszüge Israels. Die Übersetzung bleibt räumlich offen und legt den militärischen Bezug, den der Kontext nahelegt, nicht zwingend fest.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Die hebräische Metapher für Jahwes wirksame Macht und sein Eingreifen bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָיְתָה בָם לְרָעָה
  choice: war ... gegen sie und brachte Unheil über sie
  rationale: Die Formulierung gibt sowohl die gegen Israel gerichtete göttliche Wirksamkeit als auch deren schädliche Folge wieder. „Unheil“ bezeichnet hier erfahrene Not beziehungsweise Verderben, nicht moralische Bosheit.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: genauso wie Jahwe es angekündigt ... hatte
  rationale: דבר verweist rückblickend auf Jahwes vorausgegangene Warnung. „Angekündigt“ klingt im Deutschen natürlich und macht den Bezug verständlich, ohne den Inhalt zu ergänzen.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: und ihnen geschworen hatte
  rationale: נשבע mit ל bezeichnet einen an sie gerichteten Eid. Die knappe deutsche Wiedergabe bewahrt diese Aussage.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: So gerieten sie in große Bedrängnis
  rationale: Die idiomatische Formulierung drückt die schwere Not aus, in die Israel infolge des göttlichen Gerichts geriet; מְאֹד wird durch „große“ wiedergegeben.
theological_decisions:
- issue: Göttliche Gegnerschaft im Bundesgericht
  choice: die Hand Jahwes war gegen sie und brachte Unheil über sie
  alternative: die Hand Jahwes war gegen sie zum Bösen
  rationale: Der Vers schreibt Jahwe aktiv das gegen Israel gerichtete Gericht zu. „Unheil“ bewahrt diese theologische Spannung, ohne רָעָה als moralische Bosheit Gottes misszuverstehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Gottesname erscheint als „Jahwe“; die hebräische Hand-Metapher bleibt erhalten.
