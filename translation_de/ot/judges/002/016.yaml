  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: de
  text: Da ließ Jahwe Richter auftreten, und sie retteten sie aus der Hand derer, die sie ausplünderten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ließ … auftreten
  rationale: 'Der Hifil von קום bezeichnet hier Jahwes veranlassendes Handeln: Er lässt Führungsgestalten auftreten. Die Formulierung bewahrt die göttliche Initiative und klingt im modernen Deutschen natürlicher als das wörtlichere „richtete … auf“.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Eigenname erhalten bleibt.
- source_word: שֹׁפְטִים
  choice: Richter
  rationale: „Richter“ ist die direkte und im Buch etablierte Wiedergabe. Dass diese Gestalten zugleich Retter und Anführer sind, bringt das folgende Verb zum Ausdruck, ohne die Amtsbezeichnung einzuengen.
- source_word: וַיּוֹשִׁיעוּם
  choice: sie retteten sie
  rationale: ישע bezeichnet hier die Befreiung aus konkreter feindlicher Gewalt. „retteten“ gibt den Vorgang klar wieder, ohne ihn unnötig zu theologisieren.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Metapher für Macht oder Gewalt ist auch im Deutschen verständlich und wird daher bewahrt.
- source_word: שֹׁסֵיהֶם
  choice: derer, die sie ausplünderten
  rationale: Die Form bezeichnet Menschen, die andere gewaltsam berauben beziehungsweise ausplündern. „ausplünderten“ erhält diese räuberische Nuance besser als das allgemeinere „unterdrückten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Rolle der שֹׁפְטִים als Richter und Retter
  choice: Die Amtsbezeichnung „Richter“ bleibt erhalten; ihre rettende Funktion wird durch „sie retteten“ ausgedrückt.
  alternative: Retter
  rationale: Der hebräische Satz unterscheidet zwischen Bezeichnung und Tätigkeit. Beide Elemente bleiben so sichtbar, ohne die Richter ausschließlich über eine ihrer Funktionen zu definieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Machtmetapher „aus der Hand“ bleibt erhalten. Das einleitende „Da“ führt die erzählerische Folge knapp und natürlich weiter.
