base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: de
  text: Auch ich werde vor ihnen keines der Völker mehr vertreiben, die Josua zurückließ, als er starb[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Josua zurückließ, und er starb“. Das Hebräische hat schlicht „und er starb“; „als er starb“ gibt den zeitlichen Zusammenhang in flüssigem Deutsch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Auch ich
  rationale: Bewahrt die Betonung des selbstständigen Pronomens und den anknüpfenden Sinn von גַּם in natürlichem Deutsch.
- source_word: לֹא אוֹסִיף
  choice: nicht mehr / kein … mehr
  rationale: Die verneinte Hifil-Konstruktion von יסף mit Infinitiv bezeichnet das Aufhören einer bisher ausgeübten Handlung. Die deutsche Konstruktion mit „mehr“ gibt dies idiomatisch wieder.
- source_word: לְהוֹרִישׁ
  choice: vertreiben
  rationale: Im Zusammenhang der Landnahme bezeichnet das Verb das Entfernen der bisherigen Bewohner; „vertreiben“ ist klarer und natürlicher als „enteignen“ oder „des Landes berauben“.
- source_word: אִישׁ מִן הַגּוֹיִם
  choice: kein einziges von den Völkern
  rationale: 'אִישׁ hat hier im verneinten, partitiven Ausdruck verstärkende beziehungsweise distributive Kraft: nicht einmal eines aus der Gruppe. Die Wiedergabe folgt dem Kontext, in dem die Völker als diejenigen bezeichnet werden, die nicht mehr vertrieben werden.'
- source_word: מִפְּנֵיהֶם
  choice: vor ihnen
  rationale: Bewahrt das hebräische Bild der Entfernung aus ihrer Gegenwart und verbindet sich im Deutschen natürlich mit „vertreiben“.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: die Josua übrig ließ
  rationale: עזב bedeutet hier „zurücklassen/übrig lassen“ und bezeichnet die nach Josuas Wirken verbliebenen Völker.
- source_word: וַיָּמֹת
  choice: als er starb
  rationale: Die zeitliche Wiedergabe ist in modernem Deutsch flüssig und stellt den im Zusammenhang naheliegenden Bezug zu Josuas Tod her; die formnähere Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Unausgesprochener göttlicher Sprecher
  choice: Die erste Person Singular „ich“ bleibt ohne ergänzende Benennung des Sprechers stehen.
  alternative: „Der HERR“ zur Verdeutlichung in den Vers einfügen.
  rationale: Der hebräische Vers enthält nur die erste Person; der Zusammenhang bestimmt den Sprecher bereits. Eine ausdrückliche Ergänzung würde über den Wortlaut hinausgehen.
- issue: Verhältnis von Josuas Zurücklassen der Völker zu seinem Tod
  choice: וַיָּמֹת wird im Haupttext temporal mit „als er starb“ wiedergegeben.
  alternative: 'Formnäher: „und dann starb er“.'
  rationale: Der hebräische Wortlaut lässt die einfache Fortsetzung mit „und“ erkennen, während der Kontext einen zeitlichen Zusammenhang nahelegt. Die Fußnote hält die formale Alternative offen, ohne eine weitergehende theologische Folgerung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stellung „vor ihnen“ bewahrt das hebräische Bild; „kein einziges … mehr“ verbindet die verstärkende Verneinung mit dem Aufhören der bisherigen Handlung.
