source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: de
  text: Da entließ Josua das Volk, und die Israeliten[a] gingen, jeder zu seinem Erbbesitz, um das Land in Besitz zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: entließ
  rationale: שׁלח bezeichnet hier das Aussenden beziehungsweise Entlassen einer versammelten Gruppe. „Entließ“ gibt den Vorgang im Deutschen knapp und natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: Der hebräische Text nennt ausdrücklich „das Volk“; diese Bezeichnung wird ohne erklärende Erweiterung beibehalten.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet idiomatisch „die Israeliten“. Das natürliche deutsche Äquivalent vermeidet das missverständliche „Söhne Israels“, ohne den gemeinschaftlichen Bezug zu verändern.
- source_word: אִישׁ
  choice: jeder
  rationale: 'אִישׁ hat hier distributive Funktion: Die Angehörigen Israels gingen jeweils zu ihrem eigenen Erbbesitz. „Jeder“ bildet diese Funktion idiomatisch ab.'
- source_word: לְנַחֲלָתוֹ
  choice: zu seinem Erbbesitz
  rationale: נַחֲלָה bezeichnet hier den erblich zugeteilten Landbesitz. „Erbbesitz“ wahrt sowohl den Landbezug als auch den Gedanken der zugewiesenen Erbschaft.
- source_word: לָרֶשֶׁת
  choice: um … in Besitz zu nehmen
  rationale: Der Infinitiv von ירשׁ bezeichnet hier den Zweck des Gehens und hat im Siedlungskontext den aktiven Sinn der Besitzergreifung.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Kontext ist das Israel zugeteilte Land gemeint; „das Land“ ist dafür die sachlich und stilistisch passende Wiedergabe.
theological_decisions:
- issue: Bundesgeschichtliche Bezeichnung Israels
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: בְנֵי יִשְׂרָאֵל ist eine idiomatische Bezeichnung des Volkes. Das moderne deutsche „Israeliten“ gibt den kollektiven Bezug klar wieder; die wörtliche Form bleibt in der Fußnote sichtbar.
- issue: Terminologie der Landzuteilung
  choice: Erbbesitz
  alternative: Erbe
  rationale: „Erbbesitz“ bewahrt den theologischen Erbgedanken und macht zugleich deutlich, dass es um den zugeteilten Landbesitz geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem hebräischen Erzählgang, bleibt aber in Wortstellung und Idiomatik natürlich. Die Wiederholung von „Besitz“ in „Erbbesitz“ und „in Besitz nehmen“ spiegelt die sachliche Beziehung zwischen Landzuteilung und tatsächlicher Besitzergreifung.
