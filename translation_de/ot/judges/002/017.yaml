- from: Doch selbst auf ihre Richter hörten sie nicht, sondern sie liefen anderen Göttern nach wie eine Prostituierte[a] und warfen sich vor ihnen nieder. Schnell wichen sie von dem Weg ab, den ihre Vorfahren gegangen waren, indem sie den Geboten Jahwes gehorchten. Sie handelten nicht wie sie.
  to: Doch selbst auf ihre Richter hörten sie nicht, denn sie prostituierten sich, indem sie anderen Göttern nachliefen und sich vor ihnen niederwarfen. Schnell wichen sie von dem Weg ab, den ihre Vorfahren gegangen waren, indem sie den Geboten Jahwes gehorchten. So handelten sie nicht.[a]
  rationale: Die Revision stellt die kausale Funktion von כִּי mit „denn“ wieder her, formuliert die Metapher von זָנוּ direkt und idiomatisch und klärt den abschließenden Rückverweis. Der Fußnotenanker wird an den Schluss gesetzt, weil die Anmerkung die bereits im Vers verwendete Metapher als Ganzes erläutert; Bedeutung und Umfang des hebräischen Textes bleiben unverändert.
