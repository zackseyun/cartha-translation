source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: de
  text: Doch selbst auf ihre Richter hörten sie nicht, denn sie prostituierten sich, indem sie anderen Göttern nachliefen und sich vor ihnen niederwarfen. Schnell wichen sie von dem Weg ab, den ihre Vorfahren gegangen waren, indem sie den Geboten Jahwes gehorchten. So handelten sie nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie hurten anderen Göttern nach“. Das Hebräische verwendet das Bild sexueller Untreue für Götzendienst und Bundesuntreue.'
    reason: Die Fußnote erläutert die im Haupttext beibehaltene starke Metapher und bietet eine noch formnähere, im heutigen Deutsch jedoch rauer klingende Wiedergabe.
lexical_decisions:
- source_word: וְגַם אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: Doch selbst auf ihre Richter hörten sie nicht
  rationale: „Doch selbst“ gibt den steigernden und im Kontext leicht gegensätzlichen Sinn von וְגַם wieder. „Auf jemanden hören“ bewahrt das hebräische Bild und schließt das Nichtgehorchen ein.
- source_word: כִּי
  choice: sondern
  rationale: Die Partikel begründet bzw. erläutert hier die Aussage davor. Im Deutschen stellt „sondern“ den sachlichen Gegensatz zwischen dem Hören auf die Richter und der tatsächlichen Hinwendung zu anderen Göttern natürlich heraus.
- source_word: זָנוּ אַחֲרֵי
  choice: sie liefen … nach wie eine Prostituierte
  rationale: Die Wiedergabe erhält sowohl das Nachlaufen aus אַחֲרֵי als auch die bewusst anstößige Metapher sexueller beziehungsweise ehelicher Untreue aus זנה.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: und warfen sich vor ihnen nieder
  rationale: Die Formulierung bewahrt die körperliche Bedeutung des Sich-Niederwerfens, die im Zusammenhang kultische Verehrung ausdrückt.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Schnell wichen sie von dem Weg ab
  rationale: „Vom Weg abweichen“ erhält das Wegbild von סור und דרך; „schnell“ entspricht מַהֵר.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: den ihre Vorfahren gegangen waren
  rationale: „Vorfahren“ ist im modernen Deutsch natürlicher als „Väter“, während das Bild des Gehens auf einem Weg erhalten bleibt.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: indem sie den Geboten Jahwes gehorchten
  rationale: Bei Geboten bezeichnet שׁמע das Befolgen beziehungsweise Gehorchen. Die modale Formulierung bezieht den Ausdruck auf die Art, wie die Vorfahren den Weg gingen.
- source_word: לֹא עָשׂוּ כֵן
  choice: Sie handelten nicht wie sie
  rationale: Das adverbiale כֵן verweist auf das unmittelbar beschriebene Verhalten der Vorfahren; die deutsche Formulierung macht diesen Rückbezug knapp verständlich.
theological_decisions:
- issue: Metapher des Bundesbruchs in זָנוּ
  choice: Sexuelle Untreue wird mit „wie eine Prostituierte“ ausdrücklich beibehalten.
  alternative: „Sie wurden untreu“ oder „sie hurten anderen Göttern nach“.
  rationale: Eine bloße Aussage von Untreue würde die Schärfe des hebräischen Bildes abschwächen; „hurten“ wirkt dagegen im heutigen Standarddeutsch unnötig altertümlich und kann missverständlich sein.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den im hebräischen Text stehenden Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: 'Die Wendung beschreibt, wie die Vorfahren auf dem Weg gingen: indem sie Jahwes Geboten gehorchten.'
  alternative: 'Finaler Bezug: Sie gingen den Weg, um den Geboten zu gehorchen.'
  rationale: Der modale beziehungsweise erläuternde Anschluss ergibt im Satzgefüge den natürlicheren Sinn, ohne den engen Zusammenhang zwischen Weg und Gehorsam aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten Weg-, Gehorsams- und Niederwerfungsbildern. Die starke Untreuemetapher bleibt im Haupttext erkennbar und wird in der Fußnote erläutert.
