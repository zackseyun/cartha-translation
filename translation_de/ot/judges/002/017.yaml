  terminology: „Richter“, „andere Götter“, „Gebote Jahwes“ und „sich niederwerfen“ sind angemessen. „Jahwe“ ist im modernen deutschen Bibelgebrauch eine etablierte Wiedergabe des Tetragramms. Die Metapher sexueller Untreue bleibt ausdrücklich erhalten, ohne eine konfessionelle Deutung hinzuzufügen.
