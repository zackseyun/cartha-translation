  text: וְ/אִם יָרֵ֥א אַתָּ֖ה לָ/רֶ֑דֶת רֵ֥ד אַתָּ֛ה וּ/פֻרָ֥ה נַעַרְ/ךָ֖ אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: de
  text: Wenn du aber Angst hast hinabzugehen, dann geh mit Pura, deinem Diener[a], zum Lager hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinem jungen Mann« beziehungsweise »deinem Begleiter«. Das hebräische Wort kann je nach Zusammenhang einen jungen Mann, einen Diener oder einen Begleiter bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel leitet eine einschränkende Bedingung zum vorherigen Befehl ein; die Nachstellung von »aber« ist im Deutschen natürlich.
- source_word: יָרֵא אַתָּה
  choice: du Angst hast
  rationale: Die Form bezeichnet Gideons gegenwärtigen Zustand. »Angst haben« ist idiomatisches modernes Deutsch und gibt die Aussage unverstärkt wieder.
- source_word: לָרֶדֶת … רֵד
  choice: hinabzugehen … geh … hinab
  rationale: Die Wiederholung desselben hebräischen Verbs ירד wird bewahrt. Das trennbare Verb erfordert im deutschen Hauptsatz die Stellung »geh … hinab«.
- source_word: וּפֻרָה
  choice: mit … Pura
  rationale: Das Präfix וְ bezeichnet hier im Zusammenhang die Begleitung; »mit« gibt dies natürlicher wieder als ein bloßes »und«.
- source_word: נַעַרְךָ
  choice: deinem Diener
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Im Zusammenhang ist Pura Gideons untergeordneter persönlicher Begleiter; »Diener« ist hier natürlich, während die lexikalische Spannweite in der Fußnote erhalten bleibt.
- source_word: אֶל הַמַּחֲנֶה
  choice: zum Lager
  rationale: אֶל bezeichnet die Richtung auf ein Ziel hin. »Zum Lager« bleibt näher am Wortlaut als das stärker deutende »ins Lager«.
theological_decisions: []
