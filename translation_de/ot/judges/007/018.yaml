  terminology: »Jahwe« gibt יהוה konsistent wieder. »Widderhorn« ist für שׁוֹפָר sachgerecht; die anschließende pluralische Kurzform »Hörner« ist im Kontext natürlich. »Lager« trifft מַחֲנֶה. Die Fußnote erläutert zutreffend, dass kein Metallinstrument gemeint ist.
