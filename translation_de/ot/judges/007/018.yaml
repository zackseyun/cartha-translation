  source_fidelity: 'Der deutsche Haupttext gibt die hebräische Abfolge und Aussage zuverlässig wieder: Gideon und seine Begleiter blasen das Horn, die Angesprochenen sollen ebenfalls rings um das gesamte Lager blasen und den kurzen Ruf aussprechen. »Für Jahwe und für Gideon!« bewahrt die zweimalige Präposition ל und ergänzt das im hebräischen Vers nicht vorhandene »Schwert« nicht.'
