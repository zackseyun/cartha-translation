source:
  edition: WLC
  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: de
  text: 'Wenn ich und alle, die bei mir sind, ins Widderhorn[a] blasen, dann sollt auch ihr rings um das ganze Lager in die Hörner blasen und sagen: »Für Jahwe und für Gideon!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שׁוֹפָר bezeichnet ein Blashorn, häufig aus einem Widderhorn, nicht eine metallene Trompete.
    reason: cultural_note
  - marker: b
    text: 'Manche Übersetzungen ergänzen nach Richter 7,20: »Das Schwert für Jahwe und für Gideon!« Der hebräische Text dieses Verses lautet jedoch schlicht: »Für Jahwe und für Gideon!«'
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: blasen
  rationale: תקע bezeichnet in Verbindung mit שׁוֹפָר das Blasen beziehungsweise Ertönenlassen eines Horns. »Blasen« ist im Deutschen konkret und idiomatisch.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: Widderhorn / Hörner
  rationale: שׁוֹפָר bezeichnet ein Blashorn, häufig ein Widderhorn, nicht eine metallene Trompete. Die erste Nennung wird zur Anschaulichkeit mit »Widderhorn«, der Plural natürlich mit »Hörner« wiedergegeben.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: ich und alle, die bei mir sind
  rationale: Die Formulierung bezeichnet Gideon und seine Begleiter und folgt der hebräischen Satzstruktur in natürlichem modernem Deutsch.
- source_word: גַּם אַתֶּם
  choice: auch ihr
  rationale: גַּם schließt die Angesprochenen ausdrücklich ein; »auch ihr« bewahrt diesen Nachdruck.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: rings um das ganze Lager
  rationale: Die Wendung beschreibt die umfassende räumliche Umzingelung des gesamten Lagers.
- source_word: וַאֲמַרְתֶּם
  choice: sagen
  rationale: אמר ist das gewöhnliche Verb für »sagen«. Obwohl der Zusammenhang einen lauten Schlachtruf nahelegt, wird die im Hebräischen nicht ausdrücklich bezeichnete Lautstärke nicht in den Haupttext eingetragen.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: Für Jahwe und für Gideon
  rationale: Das jeweils vorangestellte ל wird parallel mit »für« wiedergegeben und bezeichnet im Schlachtruf Zugehörigkeit oder Einsatz. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Schlachtrufs לַיהוָה וּלְגִדְעוֹן
  choice: Für Jahwe und für Gideon!
  alternative: Das Schwert für Jahwe und für Gideon!
  rationale: Der masoretische Text dieses Verses enthält weder »Schwert« noch eine entsprechende Ellipse, die ausdrücklich ergänzt werden müsste. Die kürzere Form bewahrt den Wortlaut und seine Spannung; die bekannte längere Form beruht auf dem nahen Wortlaut in Richter 7,20.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Rings um« gibt die umfassende räumliche Aussage knapp wieder. Der Gottesname steht als »Jahwe«. Die Aufforderung wird mit »sollt« ausgedrückt; beim Schlachtruf bleibt das schlichte hebräische »sagen« erhalten.
