base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: de
  text: 'Sein Gefährte antwortete: „Das kann nichts anderes sein als das Schwert Gideons, des Sohnes von Joasch, eines Mannes aus Israel. Gott hat Midian und das ganze Heerlager in seine Hand gegeben.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„In seine Hand gegeben“ bedeutet: seiner Macht oder Gewalt ausgeliefert.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: Sein Gefährte antwortete
  rationale: Die deutsche Wiedergabe fasst die hebräische Dialogformel natürlich zusammen; „Gefährte“ passt in den militärischen Zusammenhang.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: Das kann nichts anderes sein als
  rationale: Gibt die nachdrückliche, ausschließende Identifikation idiomatisch und ohne Abschwächung wieder.
- source_word: חֶרֶב גִּדְעוֹן
  choice: das Schwert Gideons
  rationale: Bewahrt das Bild des Schwertes als Bezeichnung für das im Traum angekündigte Werkzeug der Niederlage.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideon, der Sohn von Joasch
  rationale: Natürliche deutsche Wiedergabe des Patronyms.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ein Mann aus Israel
  rationale: Bewahrt sowohl das ausdrücklich männliche Singularwort אִישׁ als auch Gideons Zugehörigkeit zu Israel.
- source_word: נָתַן הָאֱלֹהִים
  choice: Gott hat … gegeben
  rationale: Das Perfekt wird als gegenwärtig relevante, aus Sicht des Sprechers bereits feststehende Übergabe wiedergegeben.
- source_word: בְּיָדוֹ
  choice: in seine Hand
  rationale: Bewahrt die anschauliche hebräische Wendung; ihre Bedeutung wird in einer Fußnote erläutert.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: Midian und das ganze Heerlager
  rationale: „Heerlager“ macht im militärischen Kontext deutlich, dass מַחֲנֶה das feindliche Lager beziehungsweise die dort versammelte Streitmacht bezeichnet.
theological_decisions:
- issue: Bedeutung von אִישׁ יִשְׂרָאֵל
  choice: ein Mann aus Israel
  alternative: ein Israelit
  rationale: Die gewählte Form bewahrt das ausdrücklich männliche אִישׁ und die nationale Zuordnung, ohne zusätzliche Deutung.
- issue: Aspekt von נָתַן in der sicheren Traumdeutung
  choice: Gott hat … gegeben
  alternative: Gott gab …
  rationale: Das deutsche Perfekt vermittelt, dass der Sprecher die Übergabe aufgrund des Traumes als bereits feststehend betrachtet, ohne die zeitliche und theologische Spannung weiter aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte hebräische Redeeinleitung wird idiomatisch zu „antwortete“ zusammengezogen. Das konkrete Hand-Bild bleibt im Haupttext erhalten und wird knapp erläutert.
