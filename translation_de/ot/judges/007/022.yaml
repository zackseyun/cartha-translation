revisions:
- from: Da bliesen sie die dreihundert Hörner[a]. Jahwe richtete das Schwert eines jeden gegen seinen Gefährten und gegen das ganze Lager[b]. Das Lager floh bis Bet-Schitta in Richtung Zerera und bis an den Rand von Abel-Mehola[c][d], bei Tabbat.
  to: Da bliesen sie die dreihundert Hörner[a]. Jahwe richtete im ganzen Lager das Schwert eines jeden gegen seinen Gefährten[b]. Das Heer floh bis Bet-Schitta in Richtung Zerera und bis an den Rand von Abel-Mehola[c][d], bei Tabbat.
  rationale: Die Revision ersetzt zwei im Deutschen missverständliche beziehungsweise unnatürliche Formulierungen. „Im ganzen Lager“ bildet die räumliche Funktion von בְּכָל־הַמַּחֲנֶה im Kontext natürlicher ab; die im englischen Prüfpfad genannte weitere Möglichkeit bleibt ausdrücklich als Fußnote erhalten. „Das Heer floh“ gibt die hier bewegte, fliehende Bedeutung von מַחֲנֶה idiomatisch wieder. Alle Fußnotenmarker sind weiterhin vorhanden und korrekt verankert.
