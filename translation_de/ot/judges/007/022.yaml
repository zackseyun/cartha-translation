    rationale: Die hebräische Kollektivbezeichnung מַחֲנֶה kann hier die Streitmacht meinen. Deutsch „Lager“ bezeichnet primär den Ort und kann nicht ohne merkliche Härte fliehen. „Das Heer floh“ ist kontextgerecht und wahrt die kollektive Aussage.
