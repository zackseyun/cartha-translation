id: JDG.7.22
reference: Judges 7:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: de
  text: Da bliesen sie die dreihundert Hörner[a]. Jahwe richtete im ganzen Lager das Schwert eines jeden gegen seinen Gefährten[b]. Das Heer floh bis Bet-Schitta in Richtung Zerera und bis an den Rand von Abel-Mehola[c][d], bei Tabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die dreihundert Widderhörner“. Das hebräische Wort bezeichnet Signalhörner, die oft aus Widderhörnern gefertigt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gegen seinen Gefährten und gegen das ganze Lager“. Das Hebräische kann die Ausbreitung des Geschehens im gesamten Lager hervorheben oder das ganze Lager als weitere Zielangabe verstehen lassen.'
    reason: alternative_reading
  - marker: c
    text: Bet-Schitta, Zerera, Abel-Mehola und Tabbat sind Ortsnamen entlang des Fluchtwegs des Heeres.
    reason: cultural_note
  - marker: d
    text: Statt „Rand“ ist auch „Ufer“ oder „Grenze“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... שְׁלֹשׁ מֵאוֹת הַשּׁוֹפָרוֹת
  choice: Da bliesen sie die dreihundert Hörner
  rationale: Das Verb steht aktiv im Plural; der Zusammenhang liefert die Bläser als Subjekt. שׁוֹפָר bezeichnet ein Signalhorn, häufig ein Widderhorn. „Hörner“ bewahrt den konkreten Klangkörper besser als das allgemeinere „Trompeten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: richtete das Schwert eines jeden gegen seinen Gefährten
  rationale: Die Formulierung bewahrt das hebräische Bild, nach dem Jahwe das Schwert jedes Einzelnen gegen dessen Gefährten richtet. „Gefährte“ bezeichnet hier den Mitkämpfer im selben Heer.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: und gegen das ganze Lager
  rationale: Die Wiederholung der Präposition wird formal als weitere Zielangabe wiedergegeben. Da auch eine räumliche Bedeutung „im ganzen Lager“ möglich ist, wird diese in einer Fußnote genannt.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: Das Lager floh
  rationale: מַחֲנֶה kann sowohl das Lager als auch das dort versammelte Heer bezeichnen. „Das Lager floh“ erhält die markante hebräische Kollektivformulierung.
- source_word: עַד בֵּית הַשִּׁטָּה צְרֵרָתָה
  choice: bis Bet-Schitta in Richtung Zerera
  rationale: Die Ortsnamen werden deutsch transliteriert; die Richtungsendung an צְרֵרָתָה wird mit „in Richtung“ ausgedrückt.
- source_word: עַד שְׂפַת אָבֵל מְחוֹלָה
  choice: bis an den Rand von Abel-Mehola
  rationale: שָׂפָה bedeutet wörtlich „Lippe“ und geografisch „Rand“, „Ufer“ oder „Grenze“. „Rand“ wahrt die räumliche Offenheit, ohne ein Gewässer vorauszusetzen.
- source_word: עַל טַבָּת
  choice: bei Tabbat
  rationale: עַל bezeichnet hier wahrscheinlich die Lage in der Nähe des Ortes. „Bei“ ist natürlich und legt die genaue räumliche Beziehung nicht unnötig fest.
- source_word: אִישׁ
  choice: eines jeden
  rationale: 'Die distributive Bedeutung wird ausdrücklich erhalten: Das Schwert jedes Einzelnen richtet sich gegen einen Gefährten.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt seinen Charakter als Eigenname, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Jahwes unmittelbares Handeln in der Verwirrung des Lagers
  choice: Jahwe richtete das Schwert eines jeden gegen seinen Gefährten
  alternative: Jahwe ließ jeden sein Schwert gegen den anderen richten
  rationale: Die direkte Aussage des hebräischen Textes über Gottes Wirken bleibt stehen, ohne den genauen psychologischen oder kausalen Vorgang weiter zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen Sätzen und weitgehend erhaltener hebräischer Bildsprache. Die ungewöhnliche Kollektivformulierung „Das Lager floh“ wurde bewusst beibehalten. Ortsnamen folgen einer gut lesbaren deutschen Transliteration.
