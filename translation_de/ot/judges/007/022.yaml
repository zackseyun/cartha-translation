    rationale: Die Formulierung ist zwar formal möglich, legt im Deutschen aber nahe, dass jedes Schwert gegen die Gesamtheit des Lagers gerichtet sei. Im Kontext der durch Jahwe ausgelösten gegenseitigen Bekämpfung ist „im ganzen Lager“ die natürlichere Wiedergabe; die alternative Zielnuance kann in der Fußnote stehen.
