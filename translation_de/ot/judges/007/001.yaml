review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Personenbezeichnung, die militärisch-topografische Situation und insbesondere das singularische לוֹ in „nördlich von ihm“ zutreffend. „brachen … auf“ gibt וַיַּשְׁכֵּם jedoch eher als Aufbruch wieder, während das hebräische Verb ausdrücklich das frühe Aufstehen bezeichnet.
  naturalness: Der Satz ist insgesamt gut verständlich und im modernen erzählenden Register gehalten. Mit „standen … auf“ wird die Abfolge des hebräischen Textes zugleich genauer und idiomatisch wiedergegeben.
  terminology: „Jerubbaal“, „Gideon“, „Midian“, „Harod“ und „More“ sind konsistent wiedergegeben. „Volk“ wahrt die Weite von עָם. Die Fußnote erklärt die mögliche Ortsnamenschreibung angemessen.
  issues:
  - severity: medium
    issue: „brachen … früh am Morgen auf“ für וַיַּשְׁכֵּם
    rationale: Das Verb שׁכם in dieser Form bedeutet „früh aufstehen/aufbrechen am frühen Morgen“, doch im vorliegenden Zusammenhang bezeichnet die deutsche Wendung „brachen auf“ vorrangig das Losziehen und nicht das im Hebräischen explizite Aufstehen. Da anschließend unmittelbar das Lagern genannt wird, kann „aufbrechen und lagern“ zudem eine nicht beabsichtigte Bewegungsabfolge nahelegen. „standen … früh am Morgen auf“ bewahrt den Grundsinn ohne Erweiterung.
  revised_text: Da standen Jerubbaal, das ist Gideon, und das ganze Volk, das bei ihm war, früh am Morgen auf und lagerten an der Quelle Harod.[a] Das Lager Midians lag nördlich von ihm, beim Hügel More, im Tal.
  revised_footnotes:
  - marker: a
    text: 'Oder: „bei En-Harod“. Der hebräische Name enthält wörtlich das Wort für „Quelle“.'
    reason: lexical_alternative
  revision_rationale: Die einzige notwendige Änderung ersetzt die semantisch zu spezifische und im Kontext missverständliche Formulierung „brachen … auf“ durch „standen … auf“. Alle übrigen Formulierungen, einschließlich der singularischen Bezugsangabe „von ihm“, bleiben erhalten.
