  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: de
  text: Da standen Jerubbaal, das ist Gideon, und das ganze Volk, das bei ihm war, früh am Morgen auf und lagerten an der Quelle Harod.[a] Das Lager Midians lag nördlich von ihm, beim Hügel More, im Tal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei En-Harod“. Der hebräische Name enthält wörtlich das Wort für „Quelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: brachen … früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet den frühen Beginn einer Handlung. Die deutsche Wendung ist natürlich und bewahrt die zeitliche Nuance.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: Jerubbaal, das ist Gideon
  rationale: Das selbstständige Pronomen הוּא setzt beide Namen erklärend gleich; beide werden beibehalten.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: und das ganze Volk, das bei ihm war
  rationale: עָם bedeutet allgemein „Volk“; trotz des militärischen Zusammenhangs wird es nicht zu „Truppen“ verengt.
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: חנה bedeutet „lagern, ein Lager aufschlagen“. „Lagerten“ ist knapp, gegenwärtig und dem Erzählstil angemessen.
- source_word: עַל עֵין חֲרֹד
  choice: an der Quelle Harod
  rationale: עֵין bezeichnet eine Quelle und ist zugleich Bestandteil der Ortsbezeichnung. Die Wiedergabe macht die Bedeutung im Deutschen transparent.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: Das Lager Midians
  rationale: Die hebräische Status-constructus-Verbindung wird direkt wiedergegeben, ohne „Midian“ ausdrücklich als Volksbezeichnung umzudeuten.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: lag nördlich von ihm
  rationale: Das singularische Suffix לוֹ wird als „ihm“ bewahrt und auf Gideon als genannten Anführer bezogen, statt es an die Mehrzahl der Gruppe anzugleichen.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: beim Hügel More
  rationale: Das מִן dient hier innerhalb der topografischen Angabe wahrscheinlich der räumlichen Einordnung; „beim“ gibt die Nähe natürlich wieder.
- source_word: בָּעֵמֶק
  choice: im Tal
  rationale: עֵמֶק bezeichnet gewöhnlich ein Tal; die schlichte Wiedergabe wahrt die geografische Angabe.
