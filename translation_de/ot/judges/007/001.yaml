- from: Da brachen Jerubbaal, das ist Gideon, und das ganze Volk, das bei ihm war, früh am Morgen auf und lagerten an der Quelle Harod.[a] Das Lager Midians lag nördlich von ihm, beim Hügel More, im Tal.
  to: Da standen Jerubbaal, das ist Gideon, und das ganze Volk, das bei ihm war, früh am Morgen auf und lagerten an der Quelle Harod.[a] Das Lager Midians lag nördlich von ihm, beim Hügel More, im Tal.
  rationale: Die einzige notwendige Änderung ersetzt die semantisch zu spezifische und im Kontext missverständliche Formulierung „brachen … auf“ durch „standen … auf“. Alle übrigen Formulierungen, einschließlich der singularischen Bezugsangabe „von ihm“, bleiben erhalten.
