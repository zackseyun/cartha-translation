  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מִמֶּ֥/נִּי תִרְא֖וּ וְ/כֵ֣ן תַּעֲשׂ֑וּ וְ/הִנֵּ֨ה אָנֹכִ֥י בָא֙ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֔ה וְ/הָיָ֥ה כַ/אֲשֶׁר אֶעֱשֶׂ֖ה כֵּ֥ן תַּעֲשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Schaut auf mich und macht es genauso. Seht: Wenn ich an den Rand des Lagers komme, dann macht es genauso, wie ich es mache.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: Schaut auf mich
  rationale: Die Verbindung von ראה mit מן fordert hier dazu auf, Gideon als Vorbild genau zu beobachten. „Schaut auf mich“ ist im Deutschen natürlich und leitet unmittelbar zur Nachahmung über.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: und macht es genauso
  rationale: כֵן bezeichnet die entsprechende Art und Weise. Die Formulierung gibt den Imperativ klar und idiomatisch wieder.
- source_word: וְהִנֵּה
  choice: Sobald
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die unmittelbar bevorstehende Situation. Zusammen mit dem folgenden Partizip und der anschließenden Anweisung lässt sich dies im Deutschen natürlich durch den temporalen Einsatz „Sobald“ ausdrücken.
- source_word: אָנֹכִי בָא
  choice: ich ... angekommen bin
  rationale: Das Partizip bezeichnet die bevorstehende Bewegung zum Rand des Lagers. Im deutschen Temporalsatz ist „angekommen bin“ idiomatisch und hebt das Erreichen des Einsatzortes hervor.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: am Rand des Lagers
  rationale: קָצֶה bezeichnet das äußerste Ende beziehungsweise den Rand; „am Rand des Lagers“ ist präzise und natürlich.
- source_word: כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: sollt ihr genau das tun, was ich tue
  rationale: Die Nachahmungsformel wird klar und mit ihrer direktiven Kraft wiedergegeben. „sollt“ entspricht hier der situationsbedingten Anweisung, ohne eine zusätzliche Verpflichtungsnuance einzutragen.
theological_decisions: []
