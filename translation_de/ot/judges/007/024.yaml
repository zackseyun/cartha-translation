  text: וּ/מַלְאָכִ֡ים שָׁלַ֣ח גִּדְעוֹן֩ בְּ/כָל הַ֨ר אֶפְרַ֜יִם לֵ/אמֹ֗ר רְד֞וּ לִ/קְרַ֤את מִדְיָן֙ וְ/לִכְד֤וּ לָ/הֶם֙ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּ֑ן וַ/יִּצָּעֵ֞ק כָּל אִ֤ישׁ אֶפְרַ֨יִם֙ וַ/יִּלְכְּד֣וּ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: de
  text: 'Und Gideon sandte Boten durch das ganze Bergland Ephraims und ließ ausrichten: »Zieht hinab, Midian entgegen, und nehmt die Gewässer[a] bis Bet-Bara und bis zum Jordan in Besitz.« Da wurden alle Männer Ephraims[b] aufgeboten[c], und sie nahmen die Gewässer bis Bet-Bara und bis zum Jordan in Besitz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »die Wasser«; gemeint sein können Wasserläufe, Wasserstellen oder Furten, die als strategische Übergänge dienten.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch »jeder Mann Ephraims«; der kollektive Singular bezeichnet hier wahrscheinlich die zum Kampf aufgebotenen Männer Ephraims.
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Verbform ist schwierig. Sie kann auch näher am Wortsinn als »da schrie jeder Mann Ephraims« verstanden werden; im Zusammenhang liegt jedoch der Sinn »wurde aufgeboten« oder »wurde zusammengerufen« nahe.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: Boten
  rationale: Im Erzählzusammenhang sind menschliche Überbringer einer Nachricht gemeint, nicht Engel.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: durch das ganze Bergland Ephraim
  rationale: הַר bezeichnet hier die gebirgige Region Ephraims und nicht einen einzelnen Berg.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: Zieht hinab, Midian entgegen
  rationale: Die Formulierung bewahrt sowohl die topografische Bewegung aus dem Bergland als auch den militärischen Sinn des Entgegenziehens, ohne ihn unnötig zu verstärken.
- source_word: וְלִכְדוּ לָהֶם
  choice: und besetzt vor ihnen
  rationale: לכד verlangt hier die Einnahme strategischer Punkte. Das Dativpronomen לָהֶם wird mit „vor ihnen“ wiedergegeben und drückt aus, dass Ephraim den Midianitern zuvorkommen soll.
- source_word: אֶת הַמַּיִם
  choice: die Gewässer
  rationale: Die Wiedergabe bleibt nahe beim wörtlichen „die Wasser“, klingt aber im Deutschen natürlicher. Welche strategischen Wasserstellen oder Übergänge genau gemeint sind, bleibt im Haupttext offen.
- source_word: עַד בֵּית בָּרָה
  choice: bis Bet-Bara
  rationale: עַד gibt die räumliche Ausdehnung an; der Ortsname wird deutsch transliteriert.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: Da wurden alle Männer Ephraims aufgeboten
  rationale: Die schwierige Verbform wird im Zusammenhang mit Gideons Botschaft als Zusammenrufen beziehungsweise Aufbieten verstanden. Der kollektive Singular „jeder Mann“ bezeichnet die kampffähigen Männer Ephraims.
- source_word: וַיִּלְכְּדוּ
  choice: sie besetzten
  rationale: Die Wiederholung von לכד wird entsprechend dem vorausgehenden Befehl mit demselben deutschen Verb wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. „Bergland“, „entgegenziehen“ und „aufbieten“ sind allgemein verständliche, zugleich sachlich passende Ausdrücke für den geografischen und militärischen Zusammenhang. Die ungewöhnliche Wendung über die Gewässer wird nicht auf eine einzige konkrete Art von Übergang festgelegt; die Fußnote bewahrt die lexikalische und geografische Mehrdeutigkeit.
