    rationale: לָהֶם ist nicht als »vor ihnen« zu übersetzen. Die Formulierung legt zudem nahe, dass die Midianiter ausdrücklich genannt oder als Bezug des Pronomens markiert seien; beides bietet der Text nicht.
  - severity: low
