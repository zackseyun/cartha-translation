revisions:
- from: 'Und Gideon sandte Boten durch das ganze Bergland Ephraim und ließ sagen: »Zieht hinab, Midian entgegen, und besetzt vor ihnen die Gewässer[a] bis Bet-Bara sowie den Jordan.« Da wurden alle Männer Ephraims[b] aufgeboten[c], und sie besetzten die Gewässer bis Bet-Bara sowie den Jordan.'
  to: 'Und Gideon sandte Boten durch das ganze Bergland Ephraims und ließ ausrichten: »Zieht hinab, Midian entgegen, und nehmt die Gewässer[a] bis Bet-Bara und bis zum Jordan in Besitz.« Da wurden alle Männer Ephraims[b] aufgeboten[c], und sie nahmen die Gewässer bis Bet-Bara und bis zum Jordan in Besitz.'
  rationale: Die ungestützte Ergänzung »vor ihnen« wurde entfernt. Zugleich wurde die Wiedergabe von לכד zu einer im Deutschen natürlicheren, im Kontext weiterhin hinreichend starken Formulierung vereinheitlicht. Bedeutung, geografische Offenheit und die dokumentierten textlichen Unsicherheiten bleiben erhalten.
