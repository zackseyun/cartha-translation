  register: Moderne, würdige Standardsprache mit leicht biblischer Färbung durch „siehe“. Die lebhafte Wiederholung der hebräischen Aufmerksamkeitspartikel und die figura etymologica „einen Traum geträumt“ bleiben erhalten. Die Bildfolge wird nicht theologisch ausgedeutet.
