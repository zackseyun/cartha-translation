base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: de
  text: 'Als Gideon ankam, da erzählte gerade ein Mann seinem Gefährten einen Traum. Er sagte: »Sieh, ich habe einen Traum geträumt: Siehe, ein runder Laib Gerstenbrot[a] rollte im Lager Midians umher. Er kam bis an das Zelt und traf es, sodass es umfiel; der Laib drehte es um, und das Zelt stürzte ein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gerstenkuchen“ beziehungsweise „ein Gerstenfladen“. Das hier verwendete hebräische Wort ist selten und bezeichnet wahrscheinlich einen runden Kuchen, Fladen oder Brotlaib.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Als Gideon ankam
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; mit „als“ wird zugleich der zeitliche Rahmen für das gerade stattfindende Traumerzählen natürlich wiedergegeben.
- source_word: וְהִנֵּה
  choice: siehe, da / Siehe
  rationale: Die Aufmerksamkeitspartikel wird im Erzählertext mit „siehe, da“ und in der direkten Rede mit „Siehe“ wiedergegeben, um ihre vergegenwärtigende Kraft zu bewahren.
- source_word: מְסַפֵּר לְרֵעֵהוּ
  choice: erzählte gerade … seinem Gefährten
  rationale: Das Partizip bezeichnet eine im Gang befindliche Handlung. „Gefährte“ passt zum militärischen Zusammenhang, ohne besondere Freundschaft vorauszusetzen.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: Sieh, ich habe einen Traum geträumt
  rationale: Die Verbindung von Verb und stammverwandtem Substantiv bleibt sichtbar und klingt zugleich in modernem Deutsch verständlich.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: ein runder Laib Gerstenbrot
  rationale: Das seltene צלול bezeichnet wahrscheinlich einen runden Brotlaib oder Fladen. Die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: מִתְהַפֵּךְ
  choice: rollte … umher
  rationale: Der Hitpael beschreibt ein fortgesetztes Sichdrehen oder Überschlagen; im Bild eines runden Brotes ist „rollen“ eine natürliche Wiedergabe.
- source_word: בְּמַחֲנֵה מִדְיָן
  choice: im Lager Midians
  rationale: Die Präposition ב wird ihrem gewöhnlichen lokalen Sinn entsprechend mit „in/im“ wiedergegeben, ohne eine Bewegung in das Lager hinein ausdrücklich einzutragen.
- source_word: עַד הָאֹהֶל
  choice: bis an das Zelt
  rationale: עַד bezeichnet hier das erreichte Ziel beziehungsweise die Grenze der Bewegung.
- source_word: וַיַּכֵּהוּ
  choice: traf es
  rationale: Die Form bezeichnet einen kräftigen Stoß oder Schlag; „traf“ ist im Deutschen natürlich und lässt das rollende Brot als handelndes Subjekt bestehen.
- source_word: וַיְהַפְכֵהוּ לְמַעְלָה
  choice: er kehrte es nach oben um
  rationale: Die maskulinen Formen lassen im Zusammenhang den Brotlaib als fortgeführtes Subjekt und das Zelt als Objekt verstehen; „nach oben“ bewahrt die ungewöhnliche Richtungsangabe לְמַעְלָה.
- source_word: וְנָפַל הָאֹהֶל
  choice: und das Zelt stürzte ein
  rationale: Das ausdrücklich genannte Subjekt „das Zelt“ beseitigt am Satzende die mögliche Referenzunsicherheit; „stürzte ein“ gibt den zerstörerischen Fall eines Zeltes idiomatisch wieder.
