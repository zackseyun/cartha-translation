revisions:
- from: 'Als Gideon ankam, siehe, da erzählte gerade ein Mann seinem Gefährten einen Traum. Er sagte: »Sieh, ich habe einen Traum geträumt: Siehe, ein runder Laib Gerstenbrot[a] rollte im Lager Midians umher. Er kam bis an das Zelt und traf es, sodass es umfiel; er kehrte es nach oben um, und das Zelt stürzte ein.«'
  to: 'Als Gideon ankam, da erzählte gerade ein Mann seinem Gefährten einen Traum. Er sagte: »Sieh, ich habe einen Traum geträumt: Siehe, ein runder Laib Gerstenbrot[a] rollte im Lager Midians umher. Er kam bis an das Zelt und traf es, sodass es umfiel; der Laib drehte es um, und das Zelt stürzte ein.«'
  rationale: Die Änderung beschränkt sich auf die problematische letzte Handlungsfolge. Der Laib wird als fortgeführtes Subjekt explizit genannt, und „drehte es um“ ist eine natürliche deutsche Entsprechung, ohne die auffällige, bildhafte Abfolge des hebräischen Textes zu glätten. Fußnotenanker und Fußnotentext bleiben intakt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:19:59Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Szene, die fortlaufende Traumerzählung, das seltene Wort für einen runden Gerstenlaib sowie die Abfolge der Handlungen insgesamt zuverlässig wieder. Die Pronomenfolge nach dem Schlag ist im Hebräischen bildhaft und im Deutschen leicht missverständlich; der Laib sollte dort ausdrücklich als Handelnder kenntlich sein.
  naturalness: „Er kehrte es nach oben um“ ist im modernen Standarddeutsch nicht idiomatisch und bleibt zudem wegen des maskulinen „er“ referenziell unnötig unklar. „Der Laib drehte es um“ bildet die ungewöhnlich personifizierte Traumbildfolge verständlicher ab. Die übrige Sprache ist modern und angemessen würdig.
  terminology: „Gideon“, „Midian“, „Lager“, „Gefährte“ und „Gerstenbrot“ sind passend. Die Fußnote wahrt die lexikalische Unsicherheit von צְלוּל und bietet sachgerechte Alternativen.
