source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: de
  text: 'Da bliesen die drei Abteilungen die Hörner und zerschlugen die Krüge. Sie hielten die Fackeln in ihren linken Händen und die Hörner zum Blasen in ihren rechten Händen. Dann riefen sie: »Ein Schwert für Jahwe und für Gideon!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Schwert Jahwes und Gideons!«'
    reason: Die hebräische verblos-elliptische Wendung lässt sowohl eine Wiedergabe mit »für« als auch die traditionelle Genitivdeutung zu.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: die drei Abteilungen
  rationale: Im militärischen Zusammenhang bezeichnet רָאשִׁים die drei von Gideon gebildeten Gruppen; »Abteilungen« ist natürlich und sachlich passend.
- source_word: שׁוֹפָרוֹת
  choice: Hörner
  rationale: שׁוֹפָר bezeichnet hier das als Signalinstrument verwendete Horn. »Hörner« wahrt den konkreten Gegenstand besser als das allgemeinere »Trompeten«.
- source_word: הַכַּדִּים
  choice: die Krüge
  rationale: כַּד bezeichnet ein Gefäß beziehungsweise einen Krug; »Krüge« ist im Deutschen klar und kontextgerecht.
- source_word: וַיַּחֲזִיקוּ
  choice: Sie hielten
  rationale: Das Hifil von חזק beschreibt hier das Halten beziehungsweise feste Ergreifen; »hielten« gibt die Handlung ohne unnötige Verstärkung wieder.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: in ihren linken Händen ... in ihren rechten Händen
  rationale: Der hebräische Singular ist distributiv gebraucht; der deutsche Plural macht deutlich, dass jeder Mann je einen Gegenstand in jeder Hand hielt.
- source_word: לַפִּדִים
  choice: die Fackeln
  rationale: לַפִּיד bezeichnet einen brennenden Leuchtkörper; »Fackeln« ist die natürliche deutsche Entsprechung.
- source_word: לִתְקֹעַ
  choice: zum Blasen
  rationale: Der Infinitiv bezeichnet Zweck beziehungsweise vorgesehene Handlung und bezieht sich auf die Hörner.
- source_word: וַיִּקְרְאוּ
  choice: Dann riefen sie
  rationale: קרא bezeichnet hier den lauten Schlachtruf; »riefen« gibt dies knapp und kraftvoll wieder.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Ein Schwert für Jahwe und für Gideon!
  rationale: Die verblos-elliptische Form und die Präposition לְ werden möglichst unmittelbar bewahrt; die abrupte Form passt zu einem Schlachtruf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Deutung des Schlachtrufs חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Ein Schwert für Jahwe und für Gideon!
  alternative: Das Schwert Jahwes und Gideons!
  rationale: Das Hebräische ist syntaktisch verkürzt. Die Hauptfassung wahrt die Präposition לְ und vermeidet eine stillschweigende Ergänzung; die geläufige Genitivdeutung bleibt als plausible Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, handlungsbetonte Sätze bewahren Tempo und Kraft der Erzählung; der Schlachtruf bleibt bewusst knapp und mehrdeutig.
