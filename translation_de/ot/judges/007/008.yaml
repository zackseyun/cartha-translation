- from: Da nahmen sie die Vorräte des Volkes und dessen Hörner[a] an sich. Alle anderen Männer Israels schickte er fort, jeden zu seinem Zelt; die dreihundert Männer aber behielt er bei sich. Das Lager der Midianiter lag unterhalb von ihm im Tal.
  to: Da nahmen sie die Vorräte des Volkes und seine Schofarhörner an sich. Alle Männer Israels schickte er fort, jeden zu seinem Zelt; die dreihundert Männer aber behielt er bei sich. Das Lager der Midianiter lag unterhalb von ihm im Tal.
  rationale: Die nicht ausdrücklich im Ausgangstext enthaltene Ergänzung „anderen“ wurde entfernt. „Schofarhörner“ macht den Instrumentcharakter des hebräischen Begriffs klar, während die Fußnote die lexikalischen Alternativen offenhält. Der übrige Satzbau und die räumliche Aussage bleiben eng am hebräischen Text.
