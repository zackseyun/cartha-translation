base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: de
  text: Da nahmen sie die Vorräte des Volkes und seine Schofarhörner an sich. Alle Männer Israels schickte er fort, jeden zu seinem Zelt; die dreihundert Männer aber behielt er bei sich. Das Lager der Midianiter lag unterhalb von ihm im Tal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Da nahmen sie
  rationale: Das narrative Wayyiqtol von לקח wird schlicht mit „nahmen“ wiedergegeben; das Subjekt sind die ausgewählten Männer.
- source_word: צֵדָה הָעָם
  choice: die Vorräte des Volkes
  rationale: צֵדָה bezeichnet Reise- oder Heeresvorräte und ist weiter als bloß „Essen“; הָעָם bleibt formal als „des Volkes“ erhalten.
- source_word: בְּיָדָם
  choice: an sich
  rationale: Die deutsche Wendung gibt idiomatisch wieder, dass die ausgewählten Männer die Vorräte und Hörner in Besitz beziehungsweise zum Tragen übernahmen. Die Formulierung vermeidet ein missverständliches wörtliches „in ihren Händen“.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: dessen Hörner
  rationale: שׁוֹפָר ist ein als Signalgerät verwendetes Horn. „Hörner“ bewahrt die konkrete Art des Instruments; das Possessivpronomen bezieht sich im Hebräischen auf das Volk, dessen Ausrüstung die Dreihundert übernehmen.
- source_word: וְאֵת כָּל־אִישׁ יִשְׂרָאֵל שִׁלַּח אִישׁ לְאֹהָלָיו
  choice: Alle anderen Männer Israels schickte er fort, jeden zu seinem Zelt
  rationale: Der Singular שִׁלַּח hat Gideon als unausgesprochenes Subjekt. „fortschicken“ trifft im Kontext die Entlassung; „anderen“ verdeutlicht natürlich, dass die dreihundert Ausgewählten ausgenommen sind. Die distributive Formulierung „jeden zu seinem Zelt“ bleibt erhalten.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: die dreihundert Männer aber behielt er bei sich
  rationale: הֶחֱזִיק bedeutet hier festhalten beziehungsweise behalten. „Bei sich behalten“ stellt den Gegensatz zum Fortschicken der übrigen Männer klar dar.
- source_word: מַחֲנֵה מִדְיָן
  choice: das Lager der Midianiter
  rationale: Die Konstruktverbindung wird in natürlichem Deutsch als Bezeichnung des midianitischen Heereslagers wiedergegeben.
- source_word: מִתַּחַת בָּעֵמֶק
  choice: unterhalb von ihm im Tal
  rationale: Die räumliche Lage auf niedrigerem Gelände wird bewahrt; „Tal“ entspricht dem topografischen Zusammenhang von עֵמֶק.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der erste Satz wahrt die hebräische Zuordnung der Vorräte und Hörner zum Volk, während „an sich nehmen“ den Vorgang im Deutschen verständlich ausdrückt. Die militärische Situation wird ohne unnötige Fachsprache wiedergegeben.
