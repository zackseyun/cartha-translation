translation:
  language: de
  text: Dann wirst du hören, was sie sagen; danach werden deine Hände stark werden, und du wirst in das Lager hinabsteigen.« Da ging er mit seinem Diener[a] Pura hinab bis an den Rand der bewaffneten Männer[b], die im Lager waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »seinem jungen Mann«; das hebräische Wort kann einen jungen Mann, Diener oder Begleiter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bis an den äußersten Bereich der kampfbereiten Truppen«; der hebräische Ausdruck bezeichnet für den Kampf ausgerüstete Männer.'
