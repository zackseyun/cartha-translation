  rationale: Die Revision beschränkt sich auf sichere sprachliche und aspektuelle Präzisierungen. Sie erhält die Reihenfolge, die Bildsprache der „Hände“, die vorsichtige räumliche Annäherung sowie die durch Fußnoten dokumentierten Bedeutungsalternativen.
