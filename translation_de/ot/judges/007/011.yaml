lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: Dann wirst du hören, was sie sagen
  rationale: Die mit וְ fortgeführte Verbfolge bezeichnet hier den nächsten Schritt; das Imperfekt יְדַבֵּרוּ beschreibt die Rede, die Gideon im Lager hören wird.
- source_word: וְאַחַר
  choice: Danach
  rationale: Gibt die zeitliche Abfolge knapp und natürlich wieder.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: werden deine Hände stark sein
  rationale: Bewahrt das hebräische Bild der stark werdenden Hände als Ausdruck von Mut und Entschlossenheit, ohne es durch eine reine Deutung zu ersetzen.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: du wirst in das Lager hinabziehen
  rationale: ירד bezeichnet das Hinabgehen beziehungsweise Hinabziehen; בְּ wird hier räumlich als Bewegung in das Lager verstanden.
- source_word: וַיֵּרֶד הוּא
  choice: Da ging er … hinab
  rationale: Das Wayyiqtol führt die Erzählung fort und berichtet Gideons unmittelbare Reaktion.
- source_word: וּפֻרָה
  choice: Pura
  rationale: Der Eigenname wird in einer im Deutschen gut lesbaren Form wiedergegeben.
- source_word: נַעֲרוֹ
  choice: sein Diener
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen; im militärischen Zusammenhang ist „Diener“ eine natürliche, jedoch nicht alternativlose Wiedergabe.
- source_word: אֶל קְצֵה
  choice: bis an den Rand
  rationale: קָצֶה bezeichnet Rand, Ende oder äußersten Bereich; „bis an den Rand“ passt zur vorsichtigen Annäherung an das Lager.
- source_word: הַחֲמֻשִׁים
  choice: die Bewaffneten
  rationale: Die Form bezeichnet hier für den Kampf ausgerüstete beziehungsweise bewaffnete Männer.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: die im Lager waren
  rationale: Die Relativkonstruktion ordnet die Bewaffneten dem Lager zu.
