  to: Da kamen Gideon und die hundert Männer, die bei ihm waren, zu Beginn der mittleren Nachtwache[a] an den Rand des Lagers, als man die Wachen gerade erst aufgestellt hatte. Sie bliesen die Hörner[b] und zerschmetterten die Krüge, die sie in den Händen hielten.
  rationale: Die Zeitangabe wurde gezielt zu „als man die Wachen gerade erst aufgestellt hatte“ geändert. Damit wird die im Hebräischen hervorgehobene frische Wachablösung wiedergegeben, während das unpersönliche „man“ die im Text nicht ausdrücklich benannte handelnde Gruppe offenlässt. Alle übrigen Formulierungen können bestehen bleiben.
