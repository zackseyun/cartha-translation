base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: de
  text: Da kamen Gideon und die hundert Männer, die bei ihm waren, zu Beginn der mittleren Nachtwache[a] an den Rand des Lagers, als man die Wachen gerade erst aufgestellt hatte. Sie bliesen die Hörner[b] und zerschmetterten die Krüge, die sie in den Händen hielten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der zweiten Nachtwache“. Gemeint ist ein Abschnitt, in den die Nacht zur Bewachung eingeteilt war.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch schofarot: Signalhörner, meist aus Tierhorn; traditionell auch „Trompeten“ genannt.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: an den Rand des Lagers
  rationale: קָצֶה bezeichnet den äußersten Bereich oder Rand. Die Formulierung gibt die räumliche Aussage natürlich und präzise wieder.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: zu Beginn der mittleren Nachtwache
  rationale: רֹאשׁ bezeichnet hier idiomatisch den Anfang eines Zeitabschnitts; אַשְׁמֹרֶת meint einen Abschnitt der nächtlichen Wachzeit. „Nachtwache“ macht dies für heutige Leser unmittelbar verständlich.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: gerade als man die Wachen aufgestellt hatte
  rationale: אַךְ bezeichnet hier die genaue zeitliche Nähe. Der Infinitivus absolutus mit der finiten Hifil-Form von קום hebt das Aufstellen der Wachen hervor. Das unpersönliche „man“ lässt offen, wer sie aufstellte, und vermeidet eine im Deutschen missverständliche Wiederholung von „sie“.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: Sie bliesen die Hörner
  rationale: שׁוֹפָר bezeichnet ein Signalhorn, gewöhnlich aus Tierhorn. „Hörner“ ist sachlich genauer als das traditionelle, aber materiell weniger bestimmte „Trompeten“.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: und zerschmetterten die Krüge
  rationale: נפץ bezeichnet ein gewaltsames Zerbrechen oder Zerschmettern; כַּד ist ein Krug oder Gefäß. Die Wortwahl bewahrt die Plötzlichkeit und Kraft der Handlung.
- source_word: אֲשֶׁר בְּיָדָם
  choice: die sie in den Händen hielten
  rationale: Die natürliche deutsche Formulierung gibt wieder, dass die Männer die genannten Krüge bei sich beziehungsweise in ihren Händen hatten.
