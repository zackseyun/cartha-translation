base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Gideon: „Durch die dreihundert Männer, die geleckt haben, werde ich euch retten und Midian in deine Hand geben. Das ganze Volk aber soll gehen, jeder an seinen Ort.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner gebräuchlichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: Durch die dreihundert Männer
  rationale: Das בְּ ist instrumental; „durch“ macht deutlich, dass diese Gruppe das von Gott gebrauchte Mittel der Rettung ist.
- source_word: הַמֲלַקְקִים
  choice: die geleckt haben
  rationale: Bewahrt die konkrete, aus dem vorherigen Zusammenhang bekannte Handlung, ohne das hier nicht wiederholte Objekt „Wasser“ einzufügen.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: werde ich euch retten
  rationale: Die Hifil-Form von ישׁע bezeichnet Rettung beziehungsweise Befreiung. Das plurale „euch“ wird ausdrücklich erhalten.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: und Midian in deine Hand geben
  rationale: Bewahrt die hebräische Sieges- und Herrschaftsmetapher; „deine“ ist im Hebräischen singular und richtet sich an Gideon.
- source_word: וְכָל הָעָם
  choice: das ganze übrige Volk
  rationale: „Volk“ entspricht עָם; „übrige“ ist eine knappe kontextuelle Verdeutlichung, da die dreihundert Männer ausgenommen sind.
- source_word: יֵלְכוּ
  choice: soll gehen
  rationale: Der Imperfekt hat hier auffordernden beziehungsweise anordnenden Sinn, nicht bloß futurische Bedeutung.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: jeder an seinen Ort
  rationale: Gibt die distributive Wendung natürlich wieder und vermeidet die nicht ausdrücklich im Text stehende Präzisierung „nach Hause“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext nennt ausdrücklich das Tetragramm; die Transliteration bewahrt den Eigennamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Instrument der Rettung
  choice: Durch die dreihundert Männer
  alternative: Mit den dreihundert Männern
  rationale: Beide Wiedergaben sind sprachlich möglich. „Durch“ bildet den instrumentalen Sinn der Präposition klar ab, ohne Gottes alleinige Urheberschaft der Rettung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt knapp und militärisch geprägt. Der Wechsel vom pluralen „euch“ zum singularen „deine“ wird entsprechend dem Hebräischen bewahrt.
