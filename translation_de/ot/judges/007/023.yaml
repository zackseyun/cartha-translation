source:
  edition: WLC
  text: וַ/יִּצָּעֵ֧ק אִֽישׁ יִשְׂרָאֵ֛ל מִ/נַּפְתָּלִ֥י וּ/מִן אָשֵׁ֖ר וּ/מִן כָּל מְנַשֶּׁ֑ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: de
  text: Da wurden die Männer Israels[b] aus Naftali, aus Ascher und aus ganz Manasse zusammengerufen[a], und sie verfolgten Midian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wurden aufgeboten“; wörtlicher ließe sich das schwierige hebräische Verb mit „wurden ausgerufen“ wiedergeben. Im Zusammenhang geht es darum, dass Israel zur Verfolgung zusammengerufen wird.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „der Mann Israels“; der Ausdruck ist kollektiv gemeint und bezeichnet die Männer Israels.
    reason: lexical_alternative
  - marker: c
    text: „Midian“ steht hier für die midianitischen Streitkräfte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: wurden … zusammengerufen
  rationale: Die Nifal-Form ist hier im Zusammenhang als passives Zusammenrufen beziehungsweise Aufbieten zur Verfolgung zu verstehen. Die deutsche Wiedergabe macht den militärischen Sammlungsvorgang deutlich, ohne die schwierige Verbform zu überdeuten.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Obwohl אִישׁ formal im Singular steht, ist der Ausdruck kollektiv gebraucht; das folgende Verb וַיִּרְדְּפוּ steht im Plural. „Die Männer Israels“ gibt zugleich den kollektiven und den männlichen Bezug wieder.
- source_word: מִנַּפְתָּלִי
  choice: aus Naftali
  rationale: Die Präposition מִן bezeichnet hier die Herkunft der Aufgebotenen.
- source_word: וּמִן אָשֵׁר
  choice: aus Ascher
  rationale: Die Wendung setzt die Aufzählung der Stammesgebiete fort; die Konjunktion wird in der natürlichen deutschen Reihung vor dem letzten Glied ausgedrückt.
- source_word: וּמִן כָּל מְנַשֶּׁה
  choice: und aus ganz Manasse
  rationale: כָּל hebt die umfassende Beteiligung Manasses hervor. „Aus ganz Manasse“ bewahrt diese Aussage knapp und idiomatisch.
- source_word: וַיִּרְדְּפוּ
  choice: sie verfolgten
  rationale: רדף bezeichnet in militärischen Erzählungen gewöhnlich die Verfolgung eines fliehenden Gegners.
- source_word: אַחֲרֵי מִדְיָן
  choice: Midian
  rationale: Mit רדף bildet אַחֲרֵי eine Verbindung, die im Deutschen idiomatisch mit einem direkten Objekt wiedergegeben wird. „Midian“ bleibt entsprechend dem Hebräischen als Bezeichnung für die midianitischen Streitkräfte stehen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Zusammengerufen“ ist allgemein verständlich und bildet den militärischen Sammlungssinn ab; die Fußnote bewahrt die lexikalische Schwierigkeit. Die Stammesnamen folgen den geläufigen deutschen Formen Naftali, Ascher und Manasse.
