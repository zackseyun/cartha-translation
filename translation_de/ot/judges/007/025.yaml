  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: de
  text: Sie nahmen die beiden Fürsten Midians gefangen, Oreb und Seeb.[a] Oreb töteten sie am Oreb-Felsen, und Seeb töteten sie an der Seeb-Kelter. Dann verfolgten sie Midian. Die Köpfe Orebs und Seebs brachten sie über den Jordan zu Gideon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oreb hängt mit dem hebräischen Wort für „Rabe“ zusammen, Seeb mit dem Wort für „Wolf“. Im Haupttext stehen beide als Personennamen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von/jenseits des Jordan“. Die Wendung kann Gideons Lage auf der anderen Seite des Jordan bezeichnen; die Hauptübersetzung gibt die Bewegung zu ihm wieder.'
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: nahmen … gefangen
  rationale: לכד bezeichnet im militärischen Zusammenhang das Ergreifen oder Gefangennehmen. Die deutsche Wendung ist klar und idiomatisch.
- source_word: שָׂרֵי מִדְיָן
  choice: Fürsten Midians
  rationale: שַׂר bezeichnet hier hochrangige politische oder militärische Anführer. „Fürsten“ bewahrt ihren Rang und den würdigen Erzählton.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: Oreb und Seeb
  rationale: Die Personennamen werden in ihren im Deutschen geläufigen biblischen Formen wiedergegeben; ihre Bedeutungsbezüge zu „Rabe“ und „Wolf“ werden in einer Fußnote erläutert.
- source_word: בְּצוּר עוֹרֵב
  choice: am Orebfelsen
  rationale: צוּר bedeutet „Fels“ oder „Felsen“. Das deutsche Kompositum erhält die im Hebräischen erkennbare Verbindung zwischen Ort und Personenname.
- source_word: בְיֶקֶב זְאֵב
  choice: an der Seebkelter
  rationale: יֶקֶב bezeichnet eine Kelter beziehungsweise einen Kelterplatz. „An der …kelter“ gibt die Ortsangabe neutral und natürlich wieder.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: Dann verfolgten sie Midian
  rationale: רדף mit אֶל beschreibt hier die fortgesetzte Verfolgung Midians beziehungsweise der Midianiter. „Dann“ macht die Erzählfolge natürlich, ohne zusätzliche Inhalte einzuführen.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: Die Köpfe Orebs und Seebs
  rationale: Obwohl רֹאשׁ formal im Singular steht, ist die Verbindung mit beiden Namen distributiv zu verstehen. Im Deutschen vermittelt der Plural eindeutig, dass die Köpfe beider Männer gemeint sind.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: von der anderen Seite des Jordan her
  rationale: Die Formulierung gibt die räumliche Grundbedeutung „von jenseits/der anderen Seite des Jordan“ wieder, ohne die vom jeweiligen Standort abhängige Perspektive genauer festzulegen.
