  to: 'Da sagte der HERR zu Gideon: „Das Volk ist noch immer zu zahlreich. Führe sie zum Wasser hinunter; dort werde ich sie für dich prüfen. Und es soll geschehen: Derjenige, von dem ich dir sage: ‚Dieser soll mit dir gehen‘, der soll mit dir gehen; und jeder, von dem ich dir sage: ‚Dieser soll nicht mit dir gehen‘, der soll nicht mit dir gehen.“'
