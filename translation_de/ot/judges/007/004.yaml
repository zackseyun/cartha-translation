  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן עוֹד֮ הָ/עָ֣ם רָב֒ הוֹרֵ֤ד אוֹתָ/ם֙ אֶל הַ/מַּ֔יִם וְ/אֶצְרְפֶ֥/נּוּ לְ/ךָ֖ שָׁ֑ם וְ/הָיָ֡ה אֲשֶׁר֩ אֹמַ֨ר אֵלֶ֜י/ךָ זֶ֣ה יֵלֵ֣ךְ אִתָּ֗/ךְ ה֚וּא יֵלֵ֣ךְ אִתָּ֔/ךְ וְ/כֹ֨ל אֲשֶׁר אֹמַ֜ר אֵלֶ֗י/ךָ זֶ֚ה לֹא יֵלֵ֣ךְ עִמָּ֔/ךְ ה֖וּא לֹ֥א יֵלֵֽךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: de
  text: 'Da sagte der HERR zu Gideon: „Das Volk ist noch immer zu zahlreich. Führe sie zum Wasser hinunter; dort werde ich sie für dich prüfen. Und es soll geschehen: Derjenige, von dem ich dir sage: ‚Dieser soll mit dir gehen‘, der soll mit dir gehen; und jeder, von dem ich dir sage: ‚Dieser soll nicht mit dir gehen‘, der soll nicht mit dir gehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit HERR in Kapitälchen entspricht dem Kontext und vermeidet eine unbegründete Festlegung der Aussprache.
- source_word: הָעָם רָב
  choice: Das Volk ist noch immer zu zahlreich
  rationale: רַב bezeichnet hier im Zusammenhang mit der Auslese nicht bloß eine große Zahl, sondern eine für Gottes Absicht zu große Menge; עוֹד wird mit „noch immer“ wiedergegeben.
- source_word: וְאֶצְרְפֶנּוּ לְךָ
  choice: dort werde ich sie für dich prüfen
  rationale: צרף bezeichnet ein prüfendes Aussondern wie beim Läutern. Das kollektive Suffix bezieht sich auf das Volk; natürliches Deutsch verwendet hier den Plural „sie“.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: Wenn ich zu dir über einen sage
  rationale: Die Konstruktion bezeichnet jeweils denjenigen, über den Gott zu Gideon spricht. „Über einen“ macht diesen Bezug verständlich, ohne die Auswahl näher auszudeuten.
theological_decisions:
- issue: Bestimmung der Kämpfer durch Gottes Aussage
  choice: Die wiederholte göttliche Festlegung wird parallel und unmittelbar wiedergegeben.
  alternative: Die Aussage als bloßen Rat oder als von Gideon selbst durchzuführenden Test formulieren.
  rationale: Der hebräische Text weist die Entscheidung ausdrücklich JHWH zu und lässt offen, auf welche Weise er Gideon die einzelnen Männer bezeichnet.
- issue: Bedeutung des Prüfens/Läuterns
  choice: Neutral mit „prüfen“ wiedergegeben.
  alternative: „aussondern“, „läutern“ oder „erproben“.
  rationale: „Prüfen“ bewahrt die Bild- und Bedeutungsbreite von צרף, ohne moralische Bewährung oder eine bestimmte Auswahlmethode vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bewahrt die markante Wiederholung des hebräischen Textes, wird jedoch syntaktisch so gefasst, dass die jeweiligen Einzelpersonen klar erkennbar sind.
