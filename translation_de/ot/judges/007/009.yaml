source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: de
  text: 'Und in jener Nacht geschah es, dass Jahwe zu ihm sagte: »Steh auf, geh hinab ins Lager; denn ich habe es in deine Hand gegeben.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in deine Hand«; eine hebräische Redewendung für »in deine Gewalt« oder »unter deine Kontrolle«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Und in jener Nacht geschah es
  rationale: Die erzählende Wendung eröffnet eine neue Szene. Die Formulierung bewahrt diese Funktion und bleibt in modernem Deutsch verständlich.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: dass Jahwe zu ihm sagte
  rationale: אמר ist das gewöhnliche Verb für »sagen«; die Konstruktion fügt sich natürlich an die einleitende Ereignisformel an.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: קוּם
  choice: Steh auf
  rationale: Der Imperativ fordert Gideon zu sofortigem Handeln auf. »Steh auf« ist direkt, würdig und gegenwärtig.
- source_word: רֵד
  choice: geh hinab
  rationale: ירד bezeichnet eine abwärts gerichtete Bewegung; »geh hinab« wahrt den topografischen Sinn.
- source_word: בַּמַּחֲנֶה
  choice: ins Lager
  rationale: Bei einem Bewegungsverb bezeichnet ב hier das Ziel beziehungsweise das Hineingehen in das Lager. »Ins Lager« ist im Deutschen idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für den vorausgehenden Befehl ein.
- source_word: נְתַתִּיו
  choice: ich habe es gegeben
  rationale: Das Suffix bezieht sich grammatisch auf das Lager und damit sinngemäß auf die dort versammelte feindliche Streitmacht. Das Perfekt stellt die Übergabe als bereits vollzogen dar.
- source_word: בְּיָדֶךָ
  choice: in deine Hand
  rationale: Die wörtliche Wiedergabe erhält das anschauliche hebräische Bild; eine Fußnote erklärt dessen Bedeutung als Auslieferung in Gideons Gewalt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. Die Transliteration bewahrt diesen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Zeitwert von נְתַתִּיו
  choice: ich habe es gegeben
  alternative: ich werde es geben
  rationale: Die hebräische Perfektform bezeichnet die Übergabe als feststehende, bereits vollzogene göttliche Handlung, obwohl ihre geschichtliche Ausführung noch bevorsteht. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Erzähleinleitung und das Bild von der »Hand« bleiben erhalten, ohne altertümliche Formen wie »es begab sich« oder »mache dich auf« zu verwenden.
