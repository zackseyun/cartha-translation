base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: de
  text: 'Und Jahwe sagte zu Gideon: „Die Leute, die bei dir sind, sind zu zahlreich, als dass ich Midian in ihre Hand geben könnte. Damit Israel sich nicht mir gegenüber rühmt und sagt: ‚Meine eigene Hand hat mich gerettet[b].‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „befreit“. Das hebräische Verb kann „retten“ oder „befreien“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen als gebräuchliche wissenschaftliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: Das Volk, das bei dir ist, ist zu zahlreich
  rationale: רַב bedeutet wörtlich „zahlreich/viel“; der folgende Zusammenhang zeigt, dass die Anzahl für Gottes beabsichtigtes Handeln zu groß ist.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: als dass ich Midian in seine Hand geben könnte
  rationale: Die deutsche Konstruktion gibt die durch מִן mit Infinitiv ausgedrückte Unangemessenheit bzw. Verhinderung natürlich wieder. Das singularische „seine“ bezieht sich auf das Kollektiv „Volk“; „in die Hand geben“ bewahrt das hebräische Macht- und Kontrollidiom.
- source_word: פֶּן
  choice: Sonst könnte
  rationale: Drückt die befürchtete negative Folge in natürlichem modernem Deutsch aus, ohne sie als sichere Folge darzustellen.
- source_word: יִתְפָּאֵר עָלַי
  choice: sich mir gegenüber rühmen
  rationale: Bewahrt sowohl die reflexive Selbstüberhebung des Hitpael als auch die relationale Bedeutung von עַל, ohne unnötig ein ausdrücklich feindseliges „gegen mich“ festzulegen.
- source_word: יָדִי הוֹשִׁיעָה לִּי
  choice: Meine eigene Hand hat mich gerettet
  rationale: „eigene“ bringt die emphatische Selbstzuschreibung zum Ausdruck; „gerettet“ ist die direkte und im Kontext passende Wiedergabe von ישׁע.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Name wird als Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die übliche deutsche Form.
- issue: Israel als singularisches Kollektiv
  choice: Israel … ‚Meine eigene Hand hat mich gerettet‘
  alternative: die Israeliten … ‚Unsere eigenen Hände haben uns gerettet‘
  rationale: Der hebräische Text behandelt Israel grammatisch als ein singularisches Kollektiv. Diese Perspektive und ihre theologische Zuspitzung werden bewahrt.
- issue: Ausrichtung des Rühmens gegenüber Gott
  choice: sich mir gegenüber rühmen
  alternative: sich gegen mich rühmen
  rationale: עָלַי kann eine gegen Gott gerichtete Selbstüberhebung ausdrücken. „mir gegenüber“ erhält diese Spannung, ohne die Präposition enger als nötig auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählverknüpfung „Und“ und das Hand-Idiom bleiben erhalten; schwer verständliche hebräische Syntax wird idiomatisch wiedergegeben. Alle Fußnotenmarker stehen unmittelbar an den einschlägigen Textstellen.
