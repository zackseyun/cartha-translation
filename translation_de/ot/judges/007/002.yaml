  to: 'Und Jahwe sagte zu Gideon: „Die Leute, die bei dir sind, sind zu zahlreich, als dass ich Midian in ihre Hand geben könnte. Damit Israel sich nicht mir gegenüber rühmt und sagt: ‚Meine eigene Hand hat mich gerettet[b].‘“'
