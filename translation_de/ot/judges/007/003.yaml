  text: וְ/עַתָּ֗ה קְרָ֨א נָ֜א בְּ/אָזְנֵ֤י הָ/עָם֙ לֵ/אמֹ֔ר מִֽי יָרֵ֣א וְ/חָרֵ֔ד יָשֹׁ֥ב וְ/יִצְפֹּ֖ר מֵ/הַ֣ר הַ/גִּלְעָ֑ד וַ/יָּ֣שָׁב מִן הָ/עָ֗ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים נִשְׁאָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: de
  text: 'Und nun ruf doch vor dem Volk aus: »Wer sich fürchtet und zittert, soll umkehren und sich vom Berg Gilead[a] entfernen.[b]« Da kehrten zweiundzwanzigtausend aus dem Volk um, und zehntausend blieben übrig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Berg Gilead“ gibt den hebräischen Wortlaut unmittelbar wieder. Die geografische Bezeichnung ist an dieser Stelle jedoch schwierig; möglicherweise ist allgemeiner das Bergland von Gilead gemeint.
    reason: cultural_note
  - marker: b
    text: Das mit „sich entfernen“ wiedergegebene hebräische Verb (וְיִצְפֹּר) ist selten und in seiner Bedeutung umstritten. Es kann einen frühen Aufbruch oder ein rasches beziehungsweise unauffälliges Weggehen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Das hebräische וְעַתָּה enthält ausdrücklich das Zeit- und Übergangswort „nun“; die Verbindung mit וְ wird als „Und nun“ wiedergegeben.
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: ruf bitte vor den Ohren des Volkes aus
  rationale: קרא bezeichnet hier eine öffentliche Ausrufung; נָא mildert die Aufforderung höflich ab. Die hebräische Wendung „in den Ohren des Volkes“ wird bewusst anschaulich, aber im Deutschen verständlich wiedergegeben.
- source_word: מִי יָרֵא וְחָרֵד
  choice: Wer sich fürchtet und zittert
  rationale: 'Die beiden Ausdrücke steigern einander: ירא bezeichnet Furcht, חרד das dadurch hervorgerufene Zittern oder Beben.'
- source_word: יָשֹׁב
  choice: soll umkehren
  rationale: Die Jussivform erteilt den Furchtsamen die Anweisung beziehungsweise Erlaubnis, zurückzukehren.
- source_word: וְיִצְפֹּר
  choice: und … fortgehen
  rationale: Das seltene und umstrittene Verb bezeichnet im Zusammenhang den Rückzug vom Aufgebot. „Fortgehen“ bewahrt den Kernsinn, ohne die unsichere Nuance eines frühen oder heimlichen Aufbruchs festzulegen.
- source_word: מֵהַר הַגִּלְעָד
  choice: vom Berg Gilead
  rationale: הַר ist im Singular zunächst als „Berg“ wiedergegeben. Da die geografische Zuordnung schwierig ist, wird die mögliche breitere Bedeutung in einer Fußnote genannt.
- source_word: וַיָּשָׁב מִן הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: Da kehrten zweiundzwanzigtausend aus dem Volk um
  rationale: Die hebräische Kollektivkonstruktion mit singularischem Verb und nachfolgender Zahl wird in natürliches deutsches Erzählen mit pluralischem Subjekt übertragen.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: und zehntausend blieben übrig
  rationale: נשאר bezeichnet diejenigen, die nach dem Weggang der anderen zurück- beziehungsweise übrigbleiben.
theological_decisions: []
