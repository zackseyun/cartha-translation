  text: וּ/מִדְיָ֨ן וַ/עֲמָלֵ֤ק וְ/כָל בְּנֵי קֶ֨דֶם֙ נֹפְלִ֣ים בָּ/עֵ֔מֶק כָּ/אַרְבֶּ֖ה לָ/רֹ֑ב וְ/לִ/גְמַלֵּי/הֶם֙ אֵ֣ין מִסְפָּ֔ר כַּ/ח֛וֹל שֶׁ/עַל שְׂפַ֥ת הַ/יָּ֖ם לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: de
  text: Die Midianiter, die Amalekiter und alle Völker des Ostens[a] lagerten[b] im Tal, so zahlreich wie Heuschrecken. Ihre Kamele waren nicht zu zählen, so unermesslich viele wie der Sand am Meeresufer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne des Ostens«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet wörtlich »fallend« oder »gefallen«; hier beschreibt es wahrscheinlich das im Tal lagernde beziehungsweise ausgebreitete Heer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק
  choice: Die Midianiter, die Amalekiter
  rationale: Die hebräischen Volksnamen stehen kollektiv. Die deutschen Einwohnerbezeichnungen machen deutlich, dass die Angehörigen dieser Völker gemeint sind.
- source_word: בְּנֵי קֶדֶם
  choice: Völker des Ostens
  rationale: Wörtlich »Söhne des Ostens«; die gewählte Form gibt die ethnogeografische Sammelbezeichnung in natürlichem modernem Deutsch wieder.
- source_word: נֹפְלִים
  choice: lagerten
  rationale: Das Partizip von נפל bedeutet wörtlich »fallend/gefallen«, beschreibt hier im militärischen Zusammenhang jedoch das im Tal liegende beziehungsweise ausgebreitete Heerlager. Eine Fußnote bewahrt die Bildhaftigkeit und Mehrdeutigkeit.
- source_word: בָּעֵמֶק
  choice: im Tal
  rationale: Direkte und im Zusammenhang natürliche Wiedergabe von עֵמֶק.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: so zahlreich wie Heuschrecken
  rationale: Die idiomatische Vergleichsform gibt sowohl das Heuschreckenbild als auch die überwältigende Menge wieder.
- source_word: וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Ihre Kamele waren nicht zu zählen
  rationale: Natürliche deutsche Wiedergabe der wörtlichen Aussage »für ihre Kamele gab es keine Zahl« mit ihrer hyperbolischen Kraft.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: so unermesslich viele wie der Sand am Meeresufer
  rationale: Bewahrt den geläufigen hebräischen Vergleich und bringt durch »unermesslich viele« auch das abschließende לָרֹב als erneute Mengenbetonung zum Ausdruck.
