source:
  edition: WLC
  text: וַ/יַּ֛חַץ אֶת שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ שְׁלֹשָׁ֣ה רָאשִׁ֑ים וַ/יִּתֵּ֨ן שׁוֹפָר֤וֹת בְּ/יַד כֻּלָּ/ם֙ וְ/כַדִּ֣ים רֵקִ֔ים וְ/לַפִּדִ֖ים בְּ/ת֥וֹךְ הַ/כַּדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: de
  text: Dann teilte er die dreihundert Männer in drei Abteilungen[a] und gab jedem von ihnen ein Schofarhorn[b] in die Hand sowie einen leeren Krug[c] mit einer Fackel darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in drei Häupter«; gemeint sind drei Gruppen oder Abteilungen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Schofar ist ein als Blas- und Signalinstrument verwendetes Horn.
    reason: lexical_clarification
  - marker: c
    text: 'Oder: »Gefäß«; das hebräische Wort bezeichnet einen Krug oder ein ähnliches Behältnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: teilte
  rationale: Das Verb חצה bezeichnet hier die Aufteilung der Streitmacht in mehrere Gruppen; »teilte« ist natürlich und sachlich.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: die dreihundert Männer
  rationale: אִישׁ bedeutet wörtlich »Mann«; »Männer« bleibt näher am Hebräischen als das interpretierende »Soldaten«.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: drei Abteilungen
  rationale: Wörtlich steht »drei Häupter«; hier bezeichnet der Ausdruck drei organisatorische Gruppen der Streitmacht.
- source_word: שׁוֹפָרוֹת
  choice: Schofarhorn
  rationale: שׁוֹפָר bezeichnet ein als Signal- oder Blasinstrument verwendetes Horn. »Schofarhorn« bewahrt die konkrete Eigenart des Instruments und ist im Deutschen verständlich.
- source_word: בְּיַד כֻּלָּם
  choice: jedem von ihnen ... in die Hand
  rationale: Die kollektive Formulierung »in die Hand von ihnen allen« hat distributiven Sinn; im Deutschen gibt »jedem von ihnen ... in die Hand« diesen präzise und natürlich wieder.
- source_word: כַדִּים רֵקִים
  choice: einen leeren Krug
  rationale: כַּד bezeichnet ein Gefäß beziehungsweise einen Krug; der distributive Singular passt zur Übergabe an jeden einzelnen Mann. רֵקִים wird ausdrücklich mit »leer« wiedergegeben.
- source_word: לַפִּדִים
  choice: Fackel
  rationale: לַפִּיד bezeichnet eine Fackel oder einen Feuerbrand; »Fackel« ist die klare, gegenwärtige Standardbezeichnung.
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: darin
  rationale: Der hebräische Ausdruck lokalisiert die Fackeln im Inneren der Krüge; »darin« vermeidet im Deutschen eine schwerfällige Wiederholung.
theological_decisions: []
translation_notes:
  register: 'Moderne, würdige Standardsprache. Die Verteilung wird idiomatisch im distributiven Singular formuliert: Jeder Mann erhält ein Horn, einen Krug und eine darin befindliche Fackel. Die ungewöhnliche hebräische Wendung »drei Häupter« wird im Haupttext sinngemäß und in der Fußnote wörtlich wiedergegeben.'
