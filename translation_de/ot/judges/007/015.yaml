base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: de
  text: 'Als Gideon hörte, wie der Traum erzählt und gedeutet wurde, warf er sich nieder. Dann kehrte er zum Lager Israels zurück und sagte: »Steht auf! Denn der HERR hat das Lager Midians in eure Hand gegeben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: wie der Traum erzählt ... wurde
  rationale: מִסְפָּר bezeichnet hier das Erzählen bzw. den Bericht des Traums; die deutsche Nebensatzform gibt den Zusammenhang natürlich wieder.
- source_word: שִׁבְרוֹ
  choice: gedeutet
  rationale: שֵׁבֶר meint in diesem Kontext die Deutung bzw. Auslegung des Traums.
- source_word: וַיִּשְׁתָּחוּ
  choice: warf er sich nieder
  rationale: Das Verb bezeichnet ein körperliches Niederwerfen oder Sich-Verneigen. Der deutsche Text bewahrt die Handlung, ohne ein im hebräischen Satz nicht ausdrücklich genanntes Objekt der Anbetung einzufügen.
- source_word: קוּמוּ
  choice: Steht auf!
  rationale: Der Pluralimperativ fordert Gideons Männer unmittelbar zum Aufstehen und Handeln auf.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: hat ... in eure Hand gegeben
  rationale: Die hebräische Siegesformel wird bewusst bildhaft und traditionsnah wiedergegeben.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht verbreiteter Bibelpraxis und unterscheidet ihn von אֲדֹנָי.
theological_decisions:
- issue: Bedeutung des Niederwerfens
  choice: warf er sich nieder
  alternative: betete er an
  rationale: Im Kontext ist Anbetung wahrscheinlich, doch וַיִּשְׁתָּחוּ nennt für sich genommen die Geste. Die Übersetzung bewahrt diese sprachliche Offenheit und vermeidet die Ergänzung eines unausgesprochenen Objekts.
- issue: Prophetisches Perfekt in נָתַן
  choice: hat ... gegeben
  alternative: wird ... geben
  rationale: Die vollendete Verbform stellt den bevorstehenden Sieg als bereits gewiss dar; das Perfekt wird daher nicht futurisch geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Direkte Rede wird lebendig, aber nicht umgangssprachlich formuliert. Keine Fußnoten erforderlich.
