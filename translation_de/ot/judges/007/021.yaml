  text: וַ/יַּֽעַמְדוּ֙ אִ֣ישׁ תַּחְתָּ֔י/ו סָבִ֖יב לַֽ/מַּחֲנֶ֑ה וַ/יָּ֧רָץ כָּל הַֽ/מַּחֲנֶ֛ה וַ/יָּרִ֖יעוּ ו/יניסו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: de
  text: Jeder stand an seinem Platz rings um das Lager. Da rannte das ganze Lager los; sie schrien laut[a] und flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stießen einen Kriegsschrei aus“. Das hebräische Verb kann einen lauten Ruf im Kampf, aber auch einen Schrei in Angst oder Aufruhr bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: blieb … stehen
  rationale: עמד bezeichnet das Stehen oder Einnehmen einer Position. Im Zusammenhang hebt die Form hervor, dass Gideons Männer ihre Position hielten, während im Lager Panik ausbrach.
- source_word: אִישׁ תַּחְתָּיו
  choice: jeder … an seinem Platz
  rationale: Die distributive Wendung bedeutet idiomatisch, dass jeder Einzelne an seiner eigenen Stelle stand.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: rings um das Lager
  rationale: סביב mit ל bezeichnet die Stellung rund um das Lager; „rings um“ ist knapp, natürlich und gibt die umfassende Verteilung wieder.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: da rannte das ganze Lager los
  rationale: רץ bedeutet gewöhnlich „rennen“. „Rannte … los“ bewahrt das konkrete Bild und lässt offen, ob zunächst chaotische Bewegung oder bereits Flucht gemeint ist.
- source_word: וַיָּרִיעוּ
  choice: sie schrien laut
  rationale: ריע kann einen lauten Ruf im Kampf oder einen Schrei in Angst und Aufruhr bezeichnen. Die allgemeine Wiedergabe bewahrt diese Mehrdeutigkeit.
- source_word: ויניסו
  choice: flohen
  rationale: Im überlieferten Verständnis des Satzes bezeichnet die Form die Flucht des Lagers. „Flohen“ ist im Deutschen die klare und kontextgerechte Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und das wiederholte Bewegungsbild des Hebräischen bleiben erhalten; die Mehrdeutigkeit des lauten Rufens wird nicht im Haupttext aufgelöst.
