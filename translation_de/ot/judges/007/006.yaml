  source_fidelity: Der Entwurf gibt die Zählung, die dreihundert Männer und den Kontrast zu den übrigen zutreffend wieder. Die Wendung „das Wasser mit der Hand zum Mund leckten“ ist jedoch im Deutschen syntaktisch und bildlich missverständlich; sie kann nahelegen, dass die Hand selbst geleckt wird. Der hebräische Ausdruck verbindet das Lecken ausdrücklich mit dem Heranführen des Wassers durch die Hand zum Mund.
  naturalness: Die Überarbeitung formuliert den Hand-zu-Mund-Vorgang verständlich in modernem Standarddeutsch und bewahrt zugleich das auffällige Bild des Leckens. „Alle Übrigen aus dem Volk“ ist idiomatischer als „alle übrigen aus dem Volk“.
