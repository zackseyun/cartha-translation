  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: de
  text: Die Zahl derer, die Wasser mit der Hand zum Mund führten und es leckten[a], betrug dreihundert Mann; alle Übrigen aus dem Volk knieten nieder, um Wasser zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die mit ihrer Hand zu ihrem Mund leckten“. Der hebräische Ausdruck hebt hervor, dass sie das Wasser mit der Hand zum Mund führten, statt zum unmittelbaren Trinken niederzuknien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: Die Zahl ... betrug
  rationale: Gibt die hebräische Mengenangabe in natürlichem, gehobenem Standarddeutsch wieder.
- source_word: הַמֲלַקְקִים
  choice: derer, die ... leckten
  rationale: Bewahrt das anschauliche Bild des Verbs לקק und vermeidet das unnatürliche substantivierte „Lecker“.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: mit der Hand zum Mund
  rationale: Die distributive Einzahl entspricht dem hebräischen Ausdruck und macht deutlich, dass jeder das Wasser mit der Hand zum Mund führte.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: dreihundert Mann
  rationale: „Mann“ passt zum militärischen Kontext und ist nach einer Zahl im Deutschen idiomatisch.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: alle übrigen aus dem Volk aber
  rationale: Das nachgestellte „aber“ verdeutlicht den sachlichen Gegensatz, ohne die Verbindungspartikel überzubetonen.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: knieten sich hin
  rationale: Gibt die Körperhaltung knapp und idiomatisch wieder; „auf ihre Knie“ wäre im Deutschen unnötig redundant.
- source_word: לִשְׁתּוֹת מָיִם
  choice: um Wasser zu trinken
  rationale: Die finale Bedeutung des Infinitivs und das ausdrücklich genannte Wasser bleiben erhalten.
