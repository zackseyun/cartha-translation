base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: de
  text: 'Da führte er das Volk zum Wasser hinunter. Und Jahwe sagte zu Gideon: »Jeden, der mit seiner Zunge vom Wasser leckt, wie ein Hund leckt, sollst du gesondert aufstellen[a], ebenso jeden, der sich zum Trinken auf die Knie niederlässt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sollst du ihn für sich allein hinstellen«; das Verb kann bedeuten, jemanden gesondert hinzustellen oder zu positionieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: führte ... hinunter
  rationale: 'Der Hifil von ירד ist kausativ: Gideon veranlasste das Volk hinabzugehen. »führte ... hinunter« gibt dies im Deutschen natürlich wieder.'
- source_word: הָעָם
  choice: das Volk
  rationale: עם bezeichnet allgemein das Volk beziehungsweise die versammelte Menge. Obwohl militärischer Kontext vorliegt, bleibt die hebräische Formulierung allgemein.
- source_word: אֶל הַמָּיִם
  choice: zum Wasser
  rationale: מים ist formal pluralisch, wird hier aber als Stoffbezeichnung gebraucht; »zum Wasser« ist idiomatisches Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ מִן הַמַּיִם
  choice: Jeden, der mit seiner Zunge vom Wasser leckt
  rationale: Die distributive Konstruktion wird mit »jeden, der« wiedergegeben. »mit seiner Zunge« bewahrt das konkrete Bild; מן wird als Herkunftsangabe »vom Wasser« übersetzt.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: wie ein Hund leckt
  rationale: Der Vergleich bleibt ausdrücklich und anschaulich; der bestimmte Artikel hat hier im Deutschen natürliche Gattungsbedeutung mit »ein Hund«.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: sollst du gesondert aufstellen
  rationale: Der Hifil von יצג bezeichnet das Hinstellen beziehungsweise Positionieren; לְבָד kennzeichnet die Trennung von den anderen.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: ebenso jeden, der sich zum Trinken auf die Knie niederlässt
  rationale: כרע bezeichnet das Niederknien. Die ausdrückliche Nennung der Knie und der Zweck des Trinkens werden bewahrt. »ebenso« macht die elliptisch fortgeführte Sortieranweisung verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: »Jahwe« bewahrt den persönlichen Gottesnamen des Ausgangstextes, statt ihn durch einen Titel zu ersetzen.
- issue: Elliptische Anweisung für die zweite Gruppe
  choice: »ebenso« führt die Aufforderung zum gesonderten Aufstellen sinngemäß fort
  alternative: rein koordinierendes »und jeden« ohne Verdeutlichung
  rationale: Im Hebräischen hängt die zweite Gruppe elliptisch an derselben Sortieranweisung. »ebenso« macht die Syntax verständlich, ohne festzulegen, welche der beiden Gruppen später ausgewählt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche Wiederholung von »leckt« sowie die ausdrückliche Wendung »auf die Knie« bleiben erhalten. Das generische Maskulinum entspricht der einzeln distributiven maskulinen Form des hebräischen Militärkontexts.
