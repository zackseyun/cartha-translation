  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: de
  text: 'Jefta sagte zu den Ältesten von Gilead: »Wenn ihr mich zurückholt, damit ich gegen die Ammoniter kämpfe, und Jahwe sie mir preisgibt, dann werde ich euer Oberhaupt[a] sein.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Kopf«; gemeint ist der Anführer oder Herrscher.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Gesprächszusammenhang kann der letzte Satz auch als bestätigende Frage verstanden werden: »Werde ich dann euer Oberhaupt sein?« Der hebräische Wortlaut ist formal ein Aussagesatz.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים אַתֶּם אוֹתִי
  choice: ihr mich zurückholt
  rationale: Der Hifil von שוב bezeichnet hier das Veranlassen einer Rückkehr. »Zurückholen« ist im Deutschen natürlich und erinnert daran, dass Jefta zuvor vertrieben worden war.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: damit ich gegen die Ammoniter kämpfe
  rationale: Der Infinitiv von לחם bezeichnet den Kampf; ב trägt in diesem Zusammenhang gegnerischen Sinn. »Ammoniter« gibt die Volksbezeichnung בְּנֵי עַמּוֹן idiomatisch wieder.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: und Jahwe sie mir preisgibt
  rationale: נתן mit לפני beschreibt hier, dass Gott die Gegner Jefta überlässt und ihm den Sieg ermöglicht. »Mir preisgibt« ist natürliches Deutsch und vermeidet die nicht im Hebräischen stehende Wendung »in meine Hand«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als persönlicher Name wiedergegeben; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: לְרֹאשׁ
  choice: Oberhaupt
  rationale: רֹאשׁ bedeutet wörtlich »Kopf« und bezeichnet übertragen eine führende Person. »Oberhaupt« bewahrt diese Metapher im Deutschen besser als das hier missverständliche wörtliche »Kopf«.
- source_word: אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: dann werde ich euer Oberhaupt sein
  rationale: Die hebräische Form ist ein Aussagesatz und enthält kein Fragezeichen oder Fragewort. Das betonte אָנֹכִי unterstreicht Jeftas Anspruch; der Gesprächszusammenhang lässt jedoch auch eine bestätigende Frage als pragmatische Deutung zu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen, nicht den Titel אֲדֹנָי. Die Namensform wahrt diesen Unterschied.
- issue: Satzfunktion von אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: 'Aussage: »Dann werde ich euer Oberhaupt sein.«'
  alternative: 'Bestätigungsfrage: »Werde ich dann euer Oberhaupt sein?«'
  rationale: Grammatisch liegt ohne Fragepartikel ein Aussagesatz vor. Da Jefta im Dialog seine Bedingungen aushandelt, kann der Satz pragmatisch auch als Frage nach Zustimmung verstanden werden; diese Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und mündlich, ohne salopp zu wirken. »Oberhaupt« wahrt die hebräische Körpermetapher in einer geläufigen deutschen Führungsbezeichnung; »preisgibt« vermittelt die militärische Bedeutung von נתן לפני ohne eine im Ausgangstext fehlende Hand-Metapher.
