base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: de
  text: 'Er sagte: »Geh!« Da schickte er sie für zwei Monate fort. Sie ging, sie und ihre Gefährtinnen, und weinte auf den Bergen über ihre Jungfräulichkeit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »wegen ihrer Jungfräulichkeit«. Im Hebräischen wird ihre Jungfräulichkeit ausdrücklich als Gegenstand ihrer Klage genannt; dieses Detail ist für die unterschiedlichen Deutungen des größeren Abschnitts entscheidend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: Geh!
  rationale: Der Imperativ der 2. Person Singular feminin von הלך ist eine knappe direkte Aufforderung; »Geh!« gibt sie natürlich und genau wieder.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: Da ließ er sie … gehen
  rationale: שׁלח mit direktem Objekt bezeichnet hier, dass er ihr die erbetene Abwesenheit gestattete. »Ließ er sie gehen« passt zum Zusammenhang, ohne eine Verstoßung anzudeuten.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: für zwei Monate
  rationale: Die Wortgruppe bezeichnet die Dauer der gewährten Abwesenheit; im Deutschen ist die Wiedergabe mit »für« idiomatisch.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: Sie ging, sie und ihre Gefährtinnen
  rationale: Die Wiederaufnahme durch das ausdrückliche Pronomen הִיא wird beibehalten und bewahrt die leichte Hervorhebung der Tochter.
- source_word: רֵעוֹתֶיהָ
  choice: ihre Gefährtinnen
  rationale: Die feminine Pluralform bezeichnet weibliche Begleiterinnen bzw. Freundinnen. »Gefährtinnen« entspricht dem würdevollen Erzählregister und macht die grammatisch erkennbare Personengruppe deutlich.
- source_word: וַתֵּבְךְּ
  choice: weinte
  rationale: בכה bezeichnet Weinen oder Klagen. »Weinte« ist im Deutschen unmittelbar und trägt den ernsten Ton.
- source_word: עַל בְּתוּלֶיהָ
  choice: über ihre Jungfräulichkeit
  rationale: Die Präpositionalgruppe nennt ausdrücklich ihre Jungfräulichkeit als Gegenstand ihres Weinens. Die Formulierung wahrt diesen Fokus, ohne die weitergehende Deutung der Erzählung vorwegzunehmen.
- source_word: עַל הֶהָרִים
  choice: auf den Bergen
  rationale: Die Wiedergabe folgt der gewöhnlichen Bedeutung von הָרִים und der Präposition עַל eng; der Kontext erlaubt sowohl Berge als auch bergiges Hochland.
theological_decisions:
- issue: Bedeutung der Klage über die Jungfräulichkeit von Jiftachs Tochter
  choice: Der Haupttext hält am ausdrücklichen Gegenstand ihrer Klage, ihrer Jungfräulichkeit, fest und entscheidet die weitergehende Deutung nicht.
  alternative: Die Klage unmittelbar als Trauer über ihren bevorstehenden Tod oder ausschließlich als Trauer über lebenslange Ehelosigkeit und Kinderlosigkeit auslegen.
  rationale: Der Vers selbst sagt, dass sie über ihre Jungfräulichkeit weinte. Eine präzisere Festlegung würde eine aus dem größeren Erzählzusammenhang gewonnene Interpretation in diesen Vers eintragen und seine Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe direkte Rede und die leicht markierte hebräische Satzstruktur »sie und ihre Gefährtinnen« bleiben erhalten; zugleich wird der Text ohne altertümliche Formen verständlich formuliert.
