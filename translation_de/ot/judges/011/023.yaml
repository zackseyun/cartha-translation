- from: Und nun hat Jahwe, der Gott Israels, die Amoriter vor seinem Volk Israel aus ihrem Besitz verdrängt. Und du willst ihn nun in Besitz nehmen?[a]
  to: Und nun hat Jahwe, der Gott Israels, die Amoriter vor seinem Volk Israel aus ihrem Land vertrieben. Und du willst es in Besitz nehmen?[a]
  rationale: Die Revision stellt den Bezug des hebräischen Objektssuffixes mit „es“ auf das implizierte Land klar, verbessert die deutsche Idiomatik und vermeidet eine nicht im Ausgangstext angelegte doppelte Wiedergabe von „nun“. Die zugespitzte rhetorische Frage sowie der für das Argument zentrale Besitzbezug bleiben erhalten.
