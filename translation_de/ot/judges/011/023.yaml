  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: de
  text: Und nun hat Jahwe, der Gott Israels, die Amoriter vor seinem Volk Israel aus ihrem Land vertrieben. Und du willst es in Besitz nehmen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es erben“ beziehungsweise „es als Besitz erhalten“. Das hebräische Verb kann sowohl das Empfangen als auch das Inbesitznehmen von Land bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft als auch den Übergang zur Schlussfolgerung in Jiftachs Argumentation.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen gebräuchliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Natürliche und transparente Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: הוֹרִישׁ
  choice: aus ihrem Besitz verdrängt
  rationale: Der Hifil von ירש bezeichnet hier nicht nur ein Vertreiben, sondern den Verlust des Landbesitzes; die Formulierung wahrt diesen für das Argument entscheidenden Besitzaspekt.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der morphologische Singular bezeichnet kollektiv die Volksgruppe; im Deutschen ist der Plural idiomatisch.
- source_word: מִפְּנֵי עַמּוֹ יִשְׂרָאֵל
  choice: vor seinem Volk Israel
  rationale: Bewahrt das räumliche Bild des hebräischen Ausdrucks und die appositionelle Bezeichnung Israels als Jahwes Volk.
- source_word: וְאַתָּה
  choice: Und du willst nun
  rationale: Das selbstständige Pronomen ist betont. Die deutsche Formulierung bringt den konfrontativen Charakter der rhetorischen Frage zum Ausdruck; „nun“ markiert die daraus gezogene Folgerung.
- source_word: תִּירָשֶׁנּוּ
  choice: ihn in Besitz nehmen
  rationale: Der Qal von ירש bezeichnet hier das Erlangen beziehungsweise Antreten von Landbesitz. Das maskuline Pronomen „ihn“ nimmt sinngemäß den zuvor vorausgesetzten Landbesitz auf, ohne die Amoriter zum Objekt des Besitznehmens zu machen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt dies; „Jahwe“ ist die übliche moderne deutsche Umschrift.
- issue: Bedeutung von ירש in der rhetorischen Frage
  choice: in Besitz nehmen
  alternative: erben
  rationale: Im Zusammenhang geht es um den Anspruch auf ein Gebiet. „In Besitz nehmen“ gibt diesen Sinn unmittelbar wieder, während „erben“ im Deutschen leicht eine familiäre Erbfolge nahelegen würde; die semantische Möglichkeit des Erbens wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von „Besitz“ spiegelt bewusst das hebräische Wortspiel mit zwei Formen derselben Wurzel ירש wider. Der Ton der abschließenden Frage bleibt zugespitzt und rhetorisch.
