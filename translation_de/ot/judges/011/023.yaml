    issue: Falsches grammatisches Bezugswort bei „ihn“
    rationale: Das Objektssuffix von תירשנו bezeichnet in diesem Kontext das Land bzw. Gebiet, das Israel den Amoritern abgenommen hat. Im Deutschen muss deshalb das Neutrum „es“ stehen, wenn „Land“ mitgedacht wird.
  - severity: low
    issue: „aus ihrem Besitz verdrängt“ ist stilistisch weniger idiomatisch
    rationale: „Aus ihrem Land vertrieben“ gibt sowohl die Entfernung der Amoriter als auch den territorialen Besitzbezug des Hifil von ירש klar und natürlich wieder.
  - severity: low
