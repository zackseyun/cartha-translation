  source_fidelity: Die Grundwiedergabe trifft die rhetorische Argumentation, den Gottesnamen und den Besitzbezug von ירש gut. Das Suffix in תירשנו bezieht sich jedoch auf das erschlossene Land/Gebiet, nicht auf die Amoriter; daher ist „ihn“ im Deutschen nicht korrekt referenziert.
  naturalness: „Aus ihrem Besitz verdrängt“ ist verständlich, aber mit „verdrängt“ weniger idiomatisch als eine Formulierung mit „vertrieben“. Die rhetorische Frage ist mit „Willst du ...?“ natürlich und zugespitzt.
  terminology: „Jahwe“, „der Gott Israels“ und „Amoriter“ sind sachgerecht. Die Fußnote bewahrt die lexikalische Alternative „erben“ angemessen.
