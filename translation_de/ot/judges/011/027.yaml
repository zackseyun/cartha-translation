id: JDG.11.27
reference: Judges 11:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: de
  text: Ich habe mich nicht an dir versündigt, du aber tust mir Unrecht, indem du gegen mich Krieg führst. Jahwe, der Richter, richte heute[a] zwischen den Israeliten und den Ammonitern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe, der Richter, wird heute richten“.'
    reason: Die hebräische Verbform kann hier als Wunsch beziehungsweise Aufforderung oder als futurische Aussage verstanden werden.
  - marker: b
    text: 'Wörtlich: „zwischen den Söhnen Israels und den Söhnen Ammons“.'
    reason: Die Fußnote dokumentiert die wörtliche korporative Ausdrucksweise des Hebräischen.
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: ich habe mich nicht an dir versündigt
  rationale: חטא bezeichnet ein Sündigen beziehungsweise schuldhaftes Verfehlen; mit ל wird die betroffene Person bezeichnet. „Sich an jemandem versündigen“ bewahrt im Deutschen die moralisch-rechtliche Kraft und passt zum diplomatischen Zusammenhang.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: du tust mir Unrecht
  rationale: Die Wendung bedeutet wörtlich etwa „du tust Böses an/mit mir“. „Du tust mir Unrecht“ gibt den rechtlichen Vorwurf natürlich wieder und entspricht dem Gegensatz zur vorangehenden Unschuldsbeteuerung.
- source_word: לְהִלָּחֶם בִּי
  choice: indem du gegen mich Krieg führst
  rationale: Der Infinitiv erläutert, worin das Unrecht besteht. Im zwischenstaatlichen Zusammenhang ist „Krieg führen“ genauer als das allgemeinere „kämpfen“.
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: der Richter, richte
  rationale: Die Wiederholung der Wurzel שׁפט wird durch „Richter/richte“ erhalten. Die Form wird im Haupttext als auffordernder Wunsch beziehungsweise feierliche Anrufung verstanden; die mögliche futurische Lesart wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen übliche Wiedergabe des Tetragramms als Eigenname und ersetzt ihn nicht durch den Titel „HERR“.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ ist die natürliche moderne Entsprechung und bewahrt die Unmittelbarkeit des Rechtsappells.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: zwischen den Israeliten und den Ammonitern
  rationale: Die idiomatischen Volksbezeichnungen geben die korporative Bedeutung der wörtlichen Formulierung „Söhne Israels ... Söhne Ammons“ in natürlichem Deutsch wieder; der Wortlaut wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, während „der HERR“ eine traditionelle Ersatzlesung wäre.
- issue: Modalität von יִשְׁפֹּט im Rechtsappell
  choice: richte
  alternative: wird richten
  rationale: Im Kontext übergibt Jiftach die Streitsache feierlich dem göttlichen Richter; daher ist die jussivische Wiedergabe „richte“ gut begründet. Da die unpräfigierte Kontextmarkierung des Hebräischen auch eine futurische Aussage zulässt, bleibt diese Möglichkeit in der Fußnote sichtbar.
- issue: Korporative Bezeichnung בְּנֵי
  choice: Israeliten ... Ammoniter
  alternative: Söhne Israels ... Söhne Ammons
  rationale: בְּנֵי bezeichnet hier Volksgruppen und nicht ausschließlich leibliche männliche Nachkommen. Die idiomatische Übersetzung macht den Sinn klar, ohne den wörtlichen Ausdruck zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält den rechtlich-feierlichen Ton und die rhetorische Wiederholung „Richter/richte“, vermeidet aber unnötig hölzerne Volksbezeichnungen im Haupttext.
