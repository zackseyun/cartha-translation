base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: de
  text: 'Und sie sagten zu Jiftach: »Komm und werde unser Befehlshaber, dann wollen wir gegen die Ammoniter kämpfen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Und sie sagten
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Und sie sagten“ gibt den Anschluss schlicht und quellennah wieder.
- source_word: לְיִפְתָּח
  choice: zu Jiftach
  rationale: Der hebräische Eigenname יִפְתָּח wird in einer im Deutschen geläufigen, hebräischnahen Form wiedergegeben.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ von הלך dient hier als Aufforderung, sich zu den Sprechern zu begeben; „Komm“ ist im Deutschen natürlich.
- source_word: וְהָיִיתָה לָּנוּ
  choice: und werde unser
  rationale: Wörtlich „und sei/werde für uns“; zusammen mit dem folgenden Amtstitel ist „werde unser“ idiomatisch und bewahrt den Eintritt in die gewünschte Rolle.
- source_word: לְקָצִין
  choice: Befehlshaber
  rationale: קָצִין bezeichnet einen Führer beziehungsweise militärischen Anführer. Der Kriegskontext legt „Befehlshaber“ nahe, ohne die umfassendere Führungsbezeichnung רֹאשׁ aus Vers 8 vorwegzunehmen.
- source_word: וְנִלָּחֲמָה
  choice: dann wollen wir … kämpfen
  rationale: Die Kohortativform der ersten Person Plural drückt den beabsichtigten gemeinsamen Kampf im Anschluss an die Aufforderung aus. „Dann wollen wir“ wahrt diese voluntative Folge, ohne sie eindeutig als Zweck festzulegen.
- source_word: בִּבְנֵי עַמּוֹן
  choice: gegen die Ammoniter
  rationale: Bei לחם bezeichnet ב den Kriegsgegner; בְּנֵי עַמּוֹן, wörtlich „Söhne Ammons“, ist die übliche ethnische Bezeichnung für die Ammoniter.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge bleibt eng am Hebräischen; „dann wollen wir“ gibt die Kohortativform natürlich wieder und vermeidet eine unnötige Festlegung auf einen reinen Zwecksatz.
