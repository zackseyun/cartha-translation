  yaml_path: translation/ot/judges/011/004.yaml
  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: de
  text: Nach einiger Zeit[a] kämpften die Ammoniter gegen Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und es geschah nach Tagen“; eine hebräische Redewendung dafür, dass einige Zeit vergangen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Nach einiger Zeit
  rationale: Die hebräische Wendung bezeichnet idiomatisch den Ablauf einer unbestimmten Zeitspanne. „Nach einiger Zeit“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: וַיִּלָּחֲמוּ
  choice: kämpften
  rationale: Die Form von לחם bezeichnet hier das Führen eines Kampfes oder Krieges. Zusammen mit „gegen Israel“ ist „kämpften“ klar und idiomatisch.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Der Ausdruck bezeichnet das Volk Ammon. „Die Ammoniter“ ist die gebräuchliche deutsche Völkerbezeichnung.
- source_word: עִם יִשְׂרָאֵל
  choice: gegen Israel
  rationale: Obwohl עִם grundsätzlich „mit“ bedeutet, kennzeichnet es in Verbindung mit לחם die gegnerische Partei; daher gibt „gegen Israel“ die gemeinte Beziehung treffend wieder.
