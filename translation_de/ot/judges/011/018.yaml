  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen geografischen Aussagen des hebräischen Textes zuverlässig wieder: Zug durch die Wüste, Umgehung Edoms und Moabs, Ankunft auf der Ostseite Moabs, Lager jenseits des Arnon und kein Betreten moabitischen Gebiets. Der Wechsel vom kollektiven Singular zu einem pluralischen Bezug ist im Deutschen nachvollziehbar umgesetzt. „Jenseits des Arnon“ bewahrt die perspektivische Offenheit von בְּעֵבֶר.'
