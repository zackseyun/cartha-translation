  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: de
  text: Dann zog Israel durch die Wüste, umging das Land Edom und das Land Moab und gelangte östlich des Landes Moab an.[a] Sie lagerten jenseits des Arnon[b], betraten aber das Gebiet Moabs nicht; denn der Arnon war die Grenze Moabs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kam vom Sonnenaufgang her an das Land Moab“; die Wendung bezeichnet hier die Annäherung von Osten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf der anderen Seite des Arnon“. Die Bezeichnung hängt vom jeweiligen geografischen Bezugspunkt ab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: zog Israel durch die Wüste
  rationale: הלך bezeichnet hier das Ziehen auf einer Route; zusammen mit בַּמִּדְבָּר ergibt sich natürlich „durch die Wüste“. Das im Hebräischen nur erschließbare kollektive Subjekt wird zur Klarheit als Israel benannt.
- source_word: וַיָּסָב
  choice: umging
  rationale: סבב beschreibt hier eine Route um die genannten Länder herum. „Umging“ gibt knapp wieder, dass Israel nicht durch deren Gebiet zog.
- source_word: אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: das Land Edom und das Land Moab
  rationale: אֶרֶץ bedeutet hier Land beziehungsweise Herrschaftsgebiet. „Land“ bewahrt die einfache geografische Ausdrucksweise.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: kam von Osten her an das Land Moab
  rationale: מִזְרַח שֶׁמֶשׁ heißt wörtlich „vom Sonnenaufgang her“ und bezeichnet den Osten. „An das Land Moab“ bewahrt die Annäherung, ohne einen Eintritt in moabitisches Gebiet anzudeuten.
- source_word: וַיַּחֲנוּן
  choice: sie lagerten
  rationale: חנה bedeutet lagern. Der hebräische Text wechselt beim kollektiven Subjekt Israel vom Singular zum Plural; dieser Wechsel bleibt sichtbar.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: jenseits des Arnon
  rationale: עֵבֶר bezeichnet die andere beziehungsweise gegenüberliegende Seite. „Jenseits“ lässt den vom Bezugspunkt abhängigen Ausdruck angemessen offen.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: betraten aber das Gebiet Moabs nicht
  rationale: בוא mit בִּגְבוּל bezeichnet hier das Hineingelangen in den von Moab beherrschten Raum. „Gebiet“ gibt diese Bedeutung idiomatisch wieder.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: denn der Arnon war die Grenze Moabs
  rationale: Die Nominalkonstruktion erklärt, weshalb Israel das Gebiet Moabs nicht betrat; „Grenze“ gibt גְּבוּל hier geografisch präzise wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Erzählweise wird durch den Wechsel von „Israel“ im Singular zu „sie“ im Plural bewahrt. Die geografischen Aussagen werden klar formuliert, ohne die perspektivische Offenheit von בְּעֵבֶר einzuebnen.
