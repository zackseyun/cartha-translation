  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: de
  text: Und Jahwe, der Gott Israels, gab Sihon und sein ganzes Volk in die Hand Israels[a], und sie schlugen sie nieder. So nahm Israel das ganze Land der Amoriter in Besitz, die in jenem Land wohnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Hand Israels«; eine hebräische Wendung mit der Bedeutung »in Israels Gewalt«.'
    reason: Erklärung eines hebräischen Idioms
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: gab ... in die Hand Israels
  rationale: Bewahrt die konkrete hebräische Wendung; sie bezeichnet hier die Übergabe in Israels Gewalt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte Wiedergabe der hebräischen Genitivverbindung.
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Im Deutschen übliche Umschrift des Personennamens.
- source_word: כָּל עַמּוֹ
  choice: sein ganzes Volk
  rationale: עַם bedeutet grundsätzlich »Volk«; der militärische Kontext allein rechtfertigt keine Verengung auf »Heer«.
- source_word: וַיַּכּוּם
  choice: sie schlugen sie
  rationale: Gibt נכה konkret wieder und erhält, anders als »besiegten«, die knappe Formulierung des Ausgangstextes; das erste Pronomen bezeichnet Israel, das zweite Sihon und sein Volk.
- source_word: וַיִּירַשׁ
  choice: nahm ... in Besitz
  rationale: Im Kontext bezeichnet ירש die Besitzergreifung des Landes nach dem Sieg; die Wiedergabe lässt die Bedeutungsnuancen von Erben beziehungsweise Verdrängen im Hintergrund bestehen.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: das ganze Land der Amoriter
  rationale: Der hebräische Singular ist eine kollektive Volksbezeichnung; der deutsche Plural ist hier natürlich.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: die in jenem Land wohnten
  rationale: Das singularische Partizip stimmt mit der kollektiven Volksbezeichnung überein und wird im Deutschen sinngemäß pluralisch angeschlossen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Göttliches Handeln beim militärischen Sieg
  choice: gab Sihon und sein ganzes Volk in die Hand Israels
  alternative: ließ Israel Sihon und sein ganzes Volk besiegen
  rationale: Die direkte Zuschreibung des Sieges an Jahwe und die Spannung dieser Aussage werden nicht abgeschwächt oder erklärend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt erzählerisch knapp und nahe am Hebräischen; die altertümelnde Form »innewohnten« und eine militärische Verengung von »Volk« wurden vermieden.
