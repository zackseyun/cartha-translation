revisions:
- from: Und Jahwe, der Gott Israels, gab Sihon und sein ganzes Volk in die Hand Israels[a], und sie schlugen sie. So nahm Israel das ganze Land der Amoriter in Besitz, die in jenem Land wohnten.
  to: Und Jahwe, der Gott Israels, gab Sihon und sein ganzes Volk in die Hand Israels[a], und sie schlugen sie nieder. So nahm Israel das ganze Land der Amoriter in Besitz, die in jenem Land wohnten.
  rationale: Die einzige Änderung ergänzt bei »schlugen« das im deutschen Erzählstil übliche »nieder«. Dadurch wird die militärische Bedeutung des hebräischen Verbs natürlich und präzise wiedergegeben; Satzstruktur, Pluralbezug und alle übrigen Bedeutungsnuancen bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:20:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzglieder und den Verlauf des hebräischen Textes zuverlässig wieder: Jahwe übergibt Sihon samt seinem Volk an Israel; Israel schlägt sie und nimmt das Land der Amoriter in Besitz. »Jahwe«, »der Gott Israels«, »sein ganzes Volk«, »in die Hand Israels« und »in Besitz nehmen« sind quellentreue Entscheidungen. Die Pluralform von וַיַּכּוּם wird mit »sie« bewahrt.'
  naturalness: »Sie schlugen sie« ist im heutigen Deutsch zwar verständlich, klingt ohne eine Ergänzung jedoch unidiomatisch und kann lediglich körperliche Schläge statt eines entscheidenden militärischen Sieges nahelegen. »Sie schlugen sie nieder« ist natürliches Standarddeutsch und bewahrt die konkrete Bildlichkeit von נכה besser als ein rein abstraktes »besiegten«.
  terminology: Die Namensform »Sihon«, die ethnische Kollektivbezeichnung »Amoriter« und die wissenschaftlich gebräuchliche Wiedergabe des Gottesnamens als »Jahwe« sind angemessen. Die Fußnote erklärt das hebräische Idiom zutreffend und ist korrekt an »Hand Israels« verankert.
  issues:
  - severity: low
    issue: Die Wiedergabe »sie schlugen sie« ist stilistisch zu knapp und im modernen Deutsch semantisch weniger präzise.
    rationale: Das hebräische נכה bezeichnet hier den Schlag bzw. die Niederlage im Kampf. Die Ergänzung »nieder« macht diesen Sinn im Deutschen idiomatisch kenntlich, ohne den Text über das Hebräische hinaus auszudeuten.
  revised_text: Und Jahwe, der Gott Israels, gab Sihon und sein ganzes Volk in die Hand Israels[a], und sie schlugen sie nieder. So nahm Israel das ganze Land der Amoriter in Besitz, die in jenem Land wohnten.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: »in die Hand Israels«; eine hebräische Wendung mit der Bedeutung »in Israels Gewalt«.'
    reason: Erklärung eines hebräischen Idioms
  revision_rationale: Die einzige Änderung ergänzt bei »schlugen« das im deutschen Erzählstil übliche »nieder«. Dadurch wird die militärische Bedeutung des hebräischen Verbs natürlich und präzise wiedergegeben; Satzstruktur, Pluralbezug und alle übrigen Bedeutungsnuancen bleiben erhalten.
