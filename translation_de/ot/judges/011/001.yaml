id: JDG.11.1
reference: Judges 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יִפְתָּ֣ח הַ/גִּלְעָדִ֗י הָיָה֙ גִּבּ֣וֹר חַ֔יִל וְ/ה֖וּא בֶּן אִשָּׁ֣ה זוֹנָ֑ה וַ/יּ֥וֹלֶד גִּלְעָ֖ד אֶת יִפְתָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: de
  text: Jiftach, der Gileaditer, war ein tapferer Krieger[a]. Er war der Sohn einer Prostituierten[b], und Gilead war sein Vater[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »ein mächtiger Mann von Tatkraft«; die Wendung bezeichnet häufig einen starken, tüchtigen oder kampferprobten Mann.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der Sohn einer Frau, die als Prostituierte tätig war«.'
    reason: lexical_alternative
  - marker: c
    text: Gilead ist hier der Name von Jiftachs Vater, nicht nur die Bezeichnung der Landschaft.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: der Gileaditer
  rationale: Die gentilizische Form bezeichnet Jiftachs Herkunft beziehungsweise regionale Zugehörigkeit; »der Gileaditer« gibt dies knapp und eindeutig wieder.
- source_word: גִּבּוֹר חַיִל
  choice: ein tapferer Krieger
  rationale: Die Wortverbindung bezeichnet hier sehr wahrscheinlich einen durch Stärke und militärische Tüchtigkeit ausgezeichneten Mann. Die Formulierung ist natürlich, gegenwärtig und bewahrt den martialischen Sinn.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: der Sohn einer Prostituierten
  rationale: זוֹנָה bezeichnet am unmittelbarsten eine Prostituierte. Die Wiedergabe ist klar und modern, ohne den Ausdruck abzuschwächen oder altertümlich zu formulieren.
- source_word: וַיּוֹלֶד
  choice: war sein Vater
  rationale: Der Hifil von ילד drückt hier die biologische Vaterschaft aus. Die idiomatische deutsche Formulierung vermeidet das altertümliche »zeugte«, ohne den genealogischen Gehalt zu verlieren.
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Der Eigenname ist Subjekt der Vaterschaftsaussage und bezeichnet hier eine Person, nicht lediglich die Landschaft.
- source_word: וְ
  choice: unmarkierter Satzanschluss
  rationale: Das einleitende וְ verbindet den Abschnitt mit dem Kontext. Im modernen Deutschen ist kein ausdrückliches »Und« oder »Nun« nötig; der Anschluss bleibt durch die fortlaufende Erzählung erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste hebräische Satz wird zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert. Die abschließende Vaterschaftsaussage wird idiomatisch wiedergegeben; die Fußnote klärt, dass Gilead hier ein Personenname ist.
