  text: וְ/לֹ֣א שָׁמַ֔ע מֶ֖לֶךְ בְּנֵ֣י עַמּ֑וֹן אֶל דִּבְרֵ֣י יִפְתָּ֔ח אֲשֶׁ֥ר שָׁלַ֖ח אֵלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/028.yaml
  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: de
  text: Doch der König der Ammoniter hörte nicht auf die Worte Jiftachs, die dieser ihm gesandt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע ... אֶל
  choice: Doch ... hörte nicht auf
  rationale: Die Konstruktion bezeichnet hier, dass der König Jiftachs Botschaft kein Gehör schenkte beziehungsweise ihr nicht folgte; „auf ... hören“ ist im Deutschen natürlich und wahrt diese Bedeutungsbreite.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: der König der Ammoniter
  rationale: בְּנֵי עַמּוֹן bezeichnet das Volk der Ammoniter; die geläufige deutsche Volksbezeichnung ist klar und knapp.
- source_word: דִּבְרֵי יִפְתָּח אֲשֶׁר שָׁלַח אֵלָיו
  choice: die Worte, die Jiftach ihm ausrichten ließ
  rationale: Der Relativsatz bezieht sich grammatisch auf „Worte“. „Ausrichten ließ“ gibt idiomatisch wieder, dass Jiftach seine Botschaft durch Gesandte übermitteln ließ, ohne den Inhalt näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ setzt den ablehnenden Ausgang der vorangehenden Botschaft markant fort. Der Name יפתח wird in der im Deutschen etablierten Form „Jiftach“ wiedergegeben.
