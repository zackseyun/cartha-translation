  revised_text: Als Jeftah nach Mizpa zu seinem Haus kam, da kam seine Tochter heraus, ihm mit Handtrommeln und Tänzen entgegen. Sie war sein einziges Kind[a]; außer ihr hatte er weder Sohn noch Tochter.
