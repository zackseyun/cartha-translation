  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: de
  text: Als Jeftah nach Mizpa zu seinem Haus kam, da kam seine Tochter heraus, ihm mit Handtrommeln und Tänzen entgegen. Sie war sein einziges Kind[a]; außer ihr hatte er weder Sohn noch Tochter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Einzige“; gemeint ist sein einziges Kind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Als … kam
  rationale: Die fortschreitende Erzählung wird in natürlichem Deutsch als zeitlicher Anschluss wiedergegeben.
- source_word: הַמִּצְפָּה
  choice: nach Mizpa
  rationale: Der hebräische Ortsname wird trotz des Artikels als Eigenname wiedergegeben; „nach“ ist bei Ortsnamen idiomatisch.
- source_word: אֶל בֵּיתוֹ
  choice: zu seinem Haus
  rationale: Bewahrt das konkrete Substantiv בַּיִת, ohne es deutender als „nach Hause“ wiederzugeben.
- source_word: וְהִנֵּה
  choice: da
  rationale: Das präsentierende Signal hebt die überraschende Szene in natürlichem, würdigem Deutsch hervor, ohne das archaisch wirkende „siehe“ zu verlangen.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: kam ihm … entgegen
  rationale: Gibt das Entgegengehen idiomatisch wieder; der hebräische Partizip stellt die Tochter beim Eintreffen Jeftahs lebendig als gerade herauskommend dar.
- source_word: בְתֻפִּים
  choice: mit Handtrommeln
  rationale: תֹּף bezeichnet eine geschlagene Rahmentrommel; „Handtrommeln“ ist genauer und moderner als „Pauken“ oder „Tamburine“.
- source_word: וּבִמְחֹלוֹת
  choice: und Tänzen
  rationale: Bewahrt die substantivische Pluralform und den festlichen Charakter.
- source_word: וְרַק הִיא יְחִידָה
  choice: Sie war sein einziges Kind
  rationale: יְחִידָה bedeutet hier im Licht des folgenden Satzes „einziges Kind“; die Ergänzung „Kind“ macht den Sinn auf Deutsch eindeutig.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: außer ihr hatte er weder Sohn noch Tochter
  rationale: Gibt die ausschließende Aussage und die umfassende Verneinung idiomatisch und präzise wieder.
theological_decisions:
- issue: Bedeutung der Stellung von Jeftahs Tochter
  choice: 'Der Vers wird rein erzählerisch wiedergegeben: Sie ist Jeftahs einziges Kind und kommt ihm feiernd entgegen.'
  alternative: Die Hervorhebung könnte im Licht der Folgeverse entweder mit einer tatsächlichen Opferung oder mit bleibender Jungfräulichkeit und Kinderlosigkeit verbunden werden.
  rationale: Der vorliegende Vers entscheidet die spätere Auslegungsfrage nicht. Die Übersetzung soll diese theologische Spannung nicht vorwegnehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Da“ bewahrt die dramatische Präsentation von וְהִנֵּה ohne unnötigen Archaismus; „Handtrommeln“ bezeichnet die antiken Rahmentrommeln anschaulich.
