id: JDG.11.10
reference: Judges 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: de
  text: 'Da sagten die Ältesten von Gilead zu Jiftach: »Jahwe soll Zeuge zwischen uns sein[a], wenn wir nicht so handeln, wie du es gesagt hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Jahwe soll der sein, der zwischen uns hört« – also als Zeuge oder Richter zwischen den beiden Parteien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das narrative Waw führt die Handlung fort; »Da sagten« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: זִקְנֵי גִלְעָד
  choice: die Ältesten von Gilead
  rationale: Die Status-constructus-Verbindung bezeichnet die anerkannten Ältesten beziehungsweise führenden Männer Gileads.
- source_word: יִפְתָּח
  choice: Jiftach
  rationale: Die Form gibt den hebräischen Namen יִפְתָּח in einer im Deutschen nachvollziehbaren Transliteration wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: soll Zeuge zwischen uns sein
  rationale: 'Wörtlich steht hier, Jahwe solle beziehungsweise werde »zwischen uns hören«. Im Zusammenhang der bindenden Zusage hat das Hören eine rechtliche Funktion: Gott wird als Zeuge oder Richter zwischen den Parteien angerufen. »Soll« wahrt den oathartigen/jussivischen Sinn der Aussage.'
- source_word: אִם לֹא
  choice: wenn ... nicht
  rationale: Die Wendung leitet hier die Bedingung ein, unter der Jahwe gegen die Sprecher als Zeuge auftreten soll.
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: so handeln, wie du es gesagt hast
  rationale: Die natürliche deutsche Formulierung gibt die Verpflichtung wieder, entsprechend Jiftachs zuvor genannten Bedingungen zu handeln.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; »Jahwe« bewahrt diesen als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Rolle Jahwes in der gegenseitigen Verpflichtung
  choice: Zeuge zwischen uns
  alternative: der zwischen uns Hörende / Richter zwischen uns
  rationale: Das Partizip שֹׁמֵעַ bedeutet formal »hörend«. Im rechtlich-eidlichen Kontext impliziert es Zeugenschaft und möglicherweise richterliche Prüfung. Die Übersetzung verwendet »Zeuge«, während die Fußnote die wörtliche Form und die weiter reichende richterliche Nuance erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; »Jiftach« und »Jahwe« geben die hebräischen Eigennamen wieder. Die idiomatische Hauptübersetzung wird durch eine Fußnote zur ungewöhnlichen hebräischen Wendung ergänzt.
