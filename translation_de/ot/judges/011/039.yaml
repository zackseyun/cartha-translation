base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: de
  text: 'Nach Ablauf von zwei Monaten kehrte sie zu ihrem Vater zurück, und er erfüllte an ihr das Gelübde, das er abgelegt hatte.[a] Sie aber hatte mit keinem Mann Geschlechtsverkehr gehabt.[b] Und es wurde zum Brauch in Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er tat an ihr sein Gelübde, das er gelobt hatte.“ Die Ausleger sind sich uneinig, ob dies bedeutet, dass Jeftah sie opferte oder sie zu lebenslanger Jungfräulichkeit bestimmte. Der hebräische Wortlaut selbst entscheidet diese Frage hier nicht ausdrücklich.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Sie hatte keinen Mann erkannt.“ Dies ist eine hebräische Umschreibung dafür, dass sie keinen Geschlechtsverkehr gehabt hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: Am Ende der zwei Monate
  rationale: Gibt die zeitliche Grenze von מִקֵּץ ausdrücklich und natürlich wieder.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: kehrte sie zu ihrem Vater zurück
  rationale: Bewahrt sowohl die Rückkehrbewegung von שׁוּב als auch das ausdrücklich genannte Ziel.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: er tat an ihr, was er gelobt hatte
  rationale: Bewahrt die auffallend direkte Formulierung mit עשה und vermeidet es, die Art der Erfüllung des Gelübdes interpretierend festzulegen.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: Sie aber hatte mit keinem Mann geschlechtlich verkehrt
  rationale: Gibt den Sinn des hebräischen Idioms in verständlichem modernem Deutsch wieder, ohne lediglich den allgemeineren Begriff „Jungfrau“ einzusetzen.
- source_word: חֹק
  choice: Brauch
  rationale: Im erzählerischen Zusammenhang bezeichnet חֹק die anschließend beschriebene, regelmäßig ausgeübte Praxis in Israel; „Brauch“ passt hier besser als ein formell-rechtliches „Satzung“.
theological_decisions:
- issue: Art der Erfüllung von Jiftachs Gelübde
  choice: Die Hauptübersetzung lässt offen, ob die Tochter geopfert oder zu dauernder Ehelosigkeit bestimmt wurde.
  alternative: Explizite Wiedergabe als Brandopfer oder als lebenslange Weihe beziehungsweise Jungfräulichkeit.
  rationale: Der hebräische Wortlaut sagt nur, dass er an ihr tat, was er gelobt hatte, und löst die überlieferte Auslegungsfrage in diesem Vers nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte und theologisch umstrittene Aussage über das Gelübde bleibt bewusst unaufgelöst. Der abschließende Doppelpunkt entspricht dem Übergang zur Erklärung des Brauchs im folgenden Vers.
