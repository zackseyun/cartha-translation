source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: de
  text: 'Jefta sagte zu den Ältesten von Gilead: „Habt ihr mich nicht gehasst und aus dem Haus meines Vaters vertrieben? Warum seid ihr dann jetzt zu mir gekommen, wo ihr in Bedrängnis seid?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche hebräische Erzählform mit אמר wird im Deutschen schlicht und natürlich mit „sagte“ wiedergegeben.
- source_word: זִקְנֵי גִלְעָד
  choice: die Ältesten von Gilead
  rationale: זָקֵן bezeichnet hier die gemeinschaftlichen und politischen Repräsentanten; „Älteste“ bewahrt diese Funktion.
- source_word: הֲלֹא
  choice: Habt ihr nicht ...?
  rationale: Die Partikel leitet eine rhetorische Frage ein, die Zustimmung erwartet; diese Form ist im modernen Deutschen idiomatisch.
- source_word: שְׂנֵאתֶם
  choice: gehasst
  rationale: שׂנא bedeutet direkt „hassen“; eine Abschwächung zu „abgelehnt“ wäre nicht erforderlich.
- source_word: וַתְּגָרְשׁוּנִי
  choice: mich ... vertrieben
  rationale: גרשׁ bezeichnet ein gewaltsames oder nachdrückliches Fortjagen; „vertreiben“ gibt diese Kraft natürlich wieder.
- source_word: מִבֵּית אָבִי
  choice: aus dem Haus meines Vaters
  rationale: Die Formulierung bewahrt das konkrete Bild und lässt zugleich den möglichen Sinn von Haushalt oder Familienverband offen.
- source_word: וּמַדּוּעַ
  choice: Warum ... dann
  rationale: „Dann“ bringt den folgernden Zusammenhang mit Jeftas vorausgehender Anklage idiomatisch zum Ausdruck.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: seid ihr jetzt zu mir gekommen
  rationale: Das deutsche Perfekt passt zur direkten Rede, während „jetzt“ den zeitlichen Nachdruck von עַתָּה erhält.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: wo ihr in Bedrängnis seid
  rationale: Die Wendung bezeichnet die bedrängte Lage, die den Besuch veranlasst; „Bedrängnis“ bewahrt die Enge- und Notvorstellung, ohne die Ursache genauer festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. „Haus meines Vaters“ erhält die familiär-rechtliche Bildsprache; „in Bedrängnis“ ist gehoben, aber allgemein verständlich.
