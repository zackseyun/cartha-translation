source:
  edition: WLC
  text: וַ/יִּבְרַ֤ח יִפְתָּח֙ מִ/פְּנֵ֣י אֶחָ֔י/ו וַ/יֵּ֖שֶׁב בְּ/אֶ֣רֶץ ט֑וֹב וַ/יִּֽתְלַקְּט֤וּ אֶל יִפְתָּח֙ אֲנָשִׁ֣ים רֵיקִ֔ים וַ/יֵּצְא֖וּ עִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: de
  text: Da floh Jiftach vor seinen Brüdern und lebte im Land Tob. Da sammelten sich zwielichtige Männer[a] um Jiftach und zogen mit ihm aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „leere Männer“; die hebräische Wendung bezeichnet Männer von geringem Ansehen oder fragwürdigem Charakter, nicht bloß mittellose Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: floh
  rationale: Das Verb bezeichnet die Flucht vor Gefahr oder Feindseligkeit; „floh“ gibt die erzwungene Entfernung knapp und natürlich wieder.
- source_word: מִפְּנֵי אֶחָיו
  choice: vor seinen Brüdern
  rationale: Die Präposition bezeichnet hier die Flucht weg von den feindseligen Brüdern. Die deutsche Wendung „vor jemandem fliehen“ entspricht dem Sinn und klingt natürlich.
- source_word: וַיֵּשֶׁב
  choice: lebte
  rationale: ישׁב kann sitzen, wohnen, bleiben oder sich niederlassen bedeuten. „lebte“ bezeichnet hier den Aufenthalt, ohne eine dauerhafte Ansiedlung vorauszusetzen.
- source_word: בְּאֶרֶץ טוֹב
  choice: im Land Tob
  rationale: אֶרֶץ bezeichnet Land oder Gebiet; „Land Tob“ bewahrt die Ortsbezeichnung und ist im Deutschen klar.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: sammelten sich um Jiftach
  rationale: Die Hitpael-Form beschreibt das Sichzusammenfinden, und אֶל zeigt die Hinwendung zu Jiftach. „um Jiftach“ drückt die entstehende Gefolgschaft idiomatisch aus.
- source_word: אֲנָשִׁים רֵיקִים
  choice: zwielichtige Männer
  rationale: Das wörtliche „leere Männer“ ist ein Idiom für Männer von geringem Ansehen oder fragwürdigem Charakter. „zwielichtig“ vermittelt diese negative Wertung, ohne sie ausdrücklich zu Verbrechern zu erklären.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: zogen mit ihm aus
  rationale: יצא bedeutet „hinausgehen/ausziehen“. Die Wiedergabe bewahrt offen, zu welchem Zweck sie Jiftach begleiteten, und ergänzt daher weder Raubzüge noch Krieg.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die wiederholte Satzverknüpfung mit „Da“ spiegelt den hebräischen Erzählfluss, ohne altertümlich zu wirken. Der ungenannte Zweck ihres Ausziehens bleibt bewusst offen.
