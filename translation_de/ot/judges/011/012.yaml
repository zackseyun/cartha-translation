source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִפְתָּח֙ מַלְאָכִ֔ים אֶל מֶ֥לֶךְ בְּנֵֽי עַמּ֖וֹן לֵ/אמֹ֑ר מַה לִּ֣/י וָ/לָ֔/ךְ כִּֽי בָ֥אתָ אֵלַ֖/י לְ/הִלָּחֵ֥ם בְּ/אַרְצִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: de
  text: 'Darauf sandte Jiftach Boten zum König der Ammoniter und ließ ihm sagen: »Was habe ich mit dir zu schaffen,[a] dass du gegen mich herangezogen bist, um in meinem Land Krieg zu führen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was ist zwischen mir und dir?« Die hebräische Wendung drückt Abgrenzung, Streit oder Feindschaft zwischen den Beteiligten aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Darauf sandte
  rationale: Das Waw consecutivum führt die Erzählung weiter. „Darauf“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: יִפְתָּח
  choice: Jiftach
  rationale: Die im modernen deutschen Bibelgebrauch geläufige, quellennähere Umschrift des hebräischen Personennamens.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im diplomatischen Zusammenhang sind menschliche Gesandte gemeint; „Boten“ ist klar und vermeidet die hier unzutreffende Bedeutung „Engel“.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: zum König der Ammoniter
  rationale: „Söhne Ammons“ ist eine ethnische Bezeichnung; „Ammoniter“ gibt sie im Deutschen idiomatisch wieder.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Die Konstruktion leitet die direkte Rede ein. „Ließ ihm sagen“ verbindet sie im Deutschen natürlich mit der Entsendung von Boten.
- source_word: מַה לִּי וָלָךְ
  choice: Was haben wir miteinander zu schaffen
  rationale: Die hebräische Wendung bezeichnet eine strittige oder feindselige Beziehung. Die deutsche Formulierung ist verständlich und bewahrt die offene, konfrontative Frage.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion führt hier den Inhalt beziehungsweise Anlass der Beschwerde ein.
- source_word: בָאתָ אֵלַי
  choice: du gegen mich herangezogen bist
  rationale: Wörtlich steht „du zu mir gekommen bist“; der folgende Kriegszweck verleiht der Bewegung jedoch eindeutig feindliche Richtung. „Herangezogen“ passt zum militärischen Kontext.
- source_word: לְהִלָּחֵם
  choice: um ... Krieg zu führen
  rationale: Der Infinitiv bezeichnet das Kämpfen beziehungsweise Kriegführen. Die Wiedergabe macht den militärischen Zweck natürlich deutlich.
- source_word: בְּאַרְצִי
  choice: in meinem Land
  rationale: Die Präposition bedeutet hier örtlich „in“; die Formulierung bleibt nah am Hebräischen und ist im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: 'Moderner, würdevoller Erzählstil. Die diplomatische Konfrontation wird klar wiedergegeben, ohne die hebräische Redewendung unnötig zu glätten. Die Anrede wechselt nicht: Der König wird durchgehend mit „du“ angesprochen.'
