revisions:
- from: 'Der König der Ammoniter antwortete den Boten Jiftachs: »Weil Israel mein Land genommen hat, als es aus Ägypten heraufzog, vom Arnon bis zum Jabbok und bis zum Jordan, gebt es nun friedlich zurück.«'
  to: 'Der König der Ammoniter sagte zu den Boten Jiftachs: »Weil Israel mein Land genommen hat, als es aus Ägypten heraufzog, vom Arnon bis zum Jabbok und bis zum Jordan, gib sie nun in Frieden zurück.«'
  rationale: 'Die Änderungen beschränken sich auf zwei grammatisch und semantisch sichere Punkte: das unmarkierte hebräische Sprechverb sowie den singularischen Imperativ. Das feminine Pluralobjekt wird mit „sie“ erhalten, damit der im Hebräischen mögliche Bezug auf die genannten Gebiete nicht durch das singularische „Land“ eingeebnet wird.'
