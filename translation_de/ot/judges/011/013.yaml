  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ בְּנֵי עַמּ֜וֹן אֶל מַלְאֲכֵ֣י יִפְתָּ֗ח כִּֽי לָקַ֨ח יִשְׂרָאֵ֤ל אֶת אַרְצִ/י֙ בַּ/עֲלוֹת֣/וֹ מִ/מִּצְרַ֔יִם מֵ/אַרְנ֥וֹן וְ/עַד הַ/יַּבֹּ֖ק וְ/עַד הַ/יַּרְדֵּ֑ן וְ/עַתָּ֕ה הָשִׁ֥יבָ/ה אֶתְ/הֶ֖ן בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: de
  text: 'Der König der Ammoniter sagte zu den Boten Jiftachs: »Weil Israel mein Land genommen hat, als es aus Ägypten heraufzog, vom Arnon bis zum Jabbok und bis zum Jordan, gib sie nun in Frieden zurück.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: weil
  rationale: Gibt die ausdrücklich kausale Form der Antwort wieder und bewahrt dabei die im Hebräischen etwas gedrängte Satzfügung.
- source_word: לָקַח
  choice: genommen hat
  rationale: Das einfache Verb bezeichnet hier die vom Ammoniterkönig behauptete Inbesitznahme; eine stärkere Wertung wie »geraubt« würde über den Wortlaut hinausgehen.
- source_word: הָשִׁיבָה
  choice: gebt ... zurück
  rationale: Der Imperativ mit verstärkender Endung fordert nachdrücklich die Rückgabe. Der Plural richtet sich sinngemäß an Jiftach beziehungsweise Israel, auch wenn der hebräische Imperativ formal Singular ist.
- source_word: בְּשָׁלוֹם
  choice: friedlich
  rationale: 'Bewahrt die adverbiale Bedeutung: Die Rückgabe soll ohne Kampf erfolgen.'
theological_decisions:
- issue: Anspruch des Ammoniterkönigs auf das Land
  choice: Als direkte Behauptung des Königs wiedergegeben, ohne sie redaktionell zu bestätigen.
  alternative: Durch »angeblich« oder eine erklärende Einschränkung den Anspruch ausdrücklich relativieren.
  rationale: Der Vers berichtet die Anklage; ihre historische und theologische Bewertung folgt aus dem weiteren Erzählzusammenhang und soll hier nicht vorweggenommen werden.
- issue: Bezugswort des Objektsuffixes in אֶתְהֶן
  choice: Mit dem singularischen »es« auf »mein Land« bezogen.
  alternative: »Gebt sie zurück«, bezogen auf die genannten Gebiete oder Landstriche.
  rationale: Das feminine Pluralsuffix ist formal auffällig und kann die Gebiete meinen; im natürlichen Deutschen ist der kollektive Rückbezug auf »mein Land« am klarsten, ohne den territorialen Umfang zu verändern.
translation_notes:
  register: Moderne, würdige Standardsprache. »Jiftach« folgt einer hebräischen Namensform; »Ammoniter« ist die geläufige deutsche Volksbezeichnung. Die mehrfachen Grenzangaben bleiben eng am hebräischen Wortlaut.
