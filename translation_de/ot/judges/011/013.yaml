    issue: „antwortete“ statt „sagte“
    rationale: Das hebräische וַיֹּאמֶר bezeichnet hier keine ausdrücklich markierte Antwort, sondern eine Redehandlung. „Sagte“ ist quellentreuer und neutral.
  - severity: high
    issue: Pluralischer Imperativ „gebt“
    rationale: הָשִׁיבָה ist formal ein maskuliner Singularimperativ mit paragogischem -ה. Die deutsche Aufforderung soll daher im Singular stehen; das pluralische Objekt bleibt erhalten.
  revised_text: 'Der König der Ammoniter sagte zu den Boten Jiftachs: »Weil Israel mein Land genommen hat, als es aus Ägypten heraufzog, vom Arnon bis zum Jabbok und bis zum Jordan, gib sie nun in Frieden zurück.«'
