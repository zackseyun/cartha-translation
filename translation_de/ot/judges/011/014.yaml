  text: וַ/יּ֥וֹסֶף ע֖וֹד יִפְתָּ֑ח וַ/יִּשְׁלַח֙ מַלְאָכִ֔ים אֶל מֶ֖לֶךְ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/014.yaml
  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: de
  text: Darauf sandte Jeftah noch einmal Boten zum König der Ammoniter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum König der Söhne Ammons“; damit ist das ammonitische Volk gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: Darauf … noch einmal
  rationale: Die Verbindung יָסַף עוֹד mit einem weiteren Verb bezeichnet die Wiederholung beziehungsweise Fortsetzung einer Handlung. „Noch einmal“ gibt den Kern idiomatisch wieder; „Darauf“ führt die Erzählfolge fort.
- source_word: יִפְתָּח
  choice: Jeftah
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form „Jeftah“ wiedergegeben.
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Im erzählenden und diplomatischen Zusammenhang ist „sandte“ eine natürliche, würdevolle Wiedergabe von שׁלח.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Hier sind menschliche Überbringer einer diplomatischen Nachricht gemeint, nicht Engel. „Boten“ ist klar und weniger spezialisiert als „Gesandte“.
- source_word: אֶל
  choice: zum
  rationale: Die Richtungsangabe wird im Deutschen idiomatisch mit der Verschmelzung „zum“ wiedergegeben.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: König der Ammoniter
  rationale: בְּנֵי עַמּוֹן ist eine übliche ethnische Bezeichnung für das ammonitische Volk. „Ammoniter“ gibt den Bezug im Deutschen natürlich wieder.
