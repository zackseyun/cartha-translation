source:
  edition: WLC
  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: de
  text: Doch Sihon vertraute Israel nicht genug, um es durch sein Gebiet ziehen zu lassen.[a] Daher versammelte Sihon sein ganzes Volk,[b] und sie schlugen ihr Lager bei Jahaz auf. Dann kämpfte er gegen Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Doch Sihon glaubte Israel nicht, dass es durch sein Gebiet ziehen würde.“ Gemeint ist, dass er Israel nicht genügend vertraute, um den Durchzug zu gestatten.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „sein ganzes Volk“. Der militärische Zusammenhang legt zwar Streitkräfte nahe, doch von einem „Heer“ spricht der Text nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch wörtlich: „kämpfte mit Israel“; gemeint ist hier ein Kampf gegen Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: vertraute … nicht genug
  rationale: Der Hifil von אמן bezeichnet hier Vertrauen bzw. Zutrauen. Die Ergänzung „genug“ in Verbindung mit dem Folgesatz gibt idiomatisch wieder, dass Sihon Israel keinen sicheren Durchzug zutraute, ohne das Verb bloß als „erlaubte nicht“ wiederzugeben.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: um es durch sein Gebiet ziehen zu lassen
  rationale: עבר mit ב und גבול bezeichnet hier den Durchzug durch das von Sihon beherrschte Territorium. Die deutsche Konstruktion gibt zugleich den vom Kontext vorausgesetzten verweigerten Durchzug natürlich wieder.
- source_word: וַיֶּאֱסֹף
  choice: versammelte
  rationale: אסף bezeichnet hier das Zusammenziehen bzw. Aufbieten der Menschen. „Versammelte“ bleibt näher am Wortlaut als eine ausdrückliche militärische Deutung wie „bot auf“.
- source_word: כָּל עַמּוֹ
  choice: sein ganzes Volk
  rationale: Der hebräische Text sagt ausdrücklich „sein ganzes Volk“, nicht „sein Heer“. Trotz des militärischen Zusammenhangs wird die allgemeinere Bezeichnung bewahrt.
- source_word: וַיַּחֲנוּ בְּיָהְצָה
  choice: sie schlugen ihr Lager bei Jahaz auf
  rationale: Der Plural bezieht sich auf das versammelte Volk. „Das Lager aufschlagen“ ist eine natürliche, würdige Wiedergabe von חנה; „bei Jahaz“ bezeichnet den Ort des Lagers.
- source_word: וַיִּלָּחֶם עִם יִשְׂרָאֵל
  choice: Dann kämpfte er gegen Israel
  rationale: Obwohl עם wörtlich „mit“ bedeutet, ist לחם עם im Kontext eindeutig feindlich. Deutsch verlangt hier idiomatisch „gegen Israel kämpfen“; der Singular bewahrt Sihon als Subjekt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die koordinierte hebräische Satzfolge wird leicht gegliedert, ohne den Ablauf zu verändern. Das Pronomen „es“ behandelt „Israel“ entsprechend üblichem deutschem Sprachgebrauch als sächliches Ländernamenswort.
