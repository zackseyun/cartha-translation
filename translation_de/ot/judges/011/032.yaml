source:
  edition: WLC
  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: de
  text: Da zog Jiftach zu den Ammonitern hinüber, um gegen sie zu kämpfen[a], und Jahwe gab sie in seine Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zog zu den Söhnen Ammons hinüber, um gegen sie zu kämpfen«. »Söhne Ammons« bezeichnet die Ammoniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog … hinüber
  rationale: Das Verb עבר bezeichnet ein Hinübergehen oder Überschreiten. Die Formulierung bewahrt die konkrete Bewegung, ohne sie vorschnell als militärisches »Vorrücken« auszudeuten.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die Richtung auf die Ammoniter zu. Die feindliche Absicht wird bereits durch »um gegen sie zu kämpfen« ausgedrückt.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Wörtlich steht »Söhne Ammons«; gemeint ist idiomatisch das Volk der Ammoniter. Die Volksbezeichnung ist im heutigen Deutsch klar und natürlich.
- source_word: לְהִלָּחֶם בָּם
  choice: um gegen sie zu kämpfen
  rationale: Der Infinitiv von לחם mit ב bezeichnet den Kampf gegen jemanden. Die deutsche Zweckkonstruktion gibt die syntaktische Beziehung und den militärischen Sinn natürlich wieder.
- source_word: וַיִּתְּנֵם
  choice: gab sie
  rationale: נתן bildet zusammen mit »in seine Hand« eine feste Siegesformel. Die wörtlich-bildhafte Wiedergabe bewahrt den hebräischen Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
- source_word: בְּיָדוֹ
  choice: in seine Hand
  rationale: Das Bild bezeichnet, dass die Gegner Jiftachs Gewalt beziehungsweise Kontrolle unterstellt wurden. Die konkrete Bildsprache des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliches Handeln beim Sieg Jiftachs
  choice: Jahwe gab sie in seine Hand
  alternative: Jahwe ließ ihn über sie siegen
  rationale: Die hebräische Aussage schreibt den Sieg unmittelbar Jahwes Handeln zu. Die bildhafte Formulierung wird beibehalten, ohne sie abzuschwächen oder weiter theologisch zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zog … hinüber« bewahrt die Bewegungsangabe des Hebräischen; »gab sie in seine Hand« erhält die traditionelle, verständliche Siegesmetapher.
