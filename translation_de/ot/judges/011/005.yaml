  text: וַ/יְהִ֕י כַּ/אֲשֶׁר נִלְחֲמ֥וּ בְנֵֽי עַמּ֖וֹן עִם יִשְׂרָאֵ֑ל וַ/יֵּֽלְכוּ֙ זִקְנֵ֣י גִלְעָ֔ד לָ/קַ֥חַת אֶת יִפְתָּ֖ח מֵ/אֶ֥רֶץ טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: de
  text: Als nun die Ammoniter gegen Israel kämpften, gingen die Ältesten von Gilead hin, um Jiftach aus dem Land Tob zu holen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als nun
  rationale: Die hebräische Erzählformel leitet das nächste Geschehen zeitlich ein. „Als nun“ gibt dies in natürlichem, gehobenem Deutsch wieder, ohne das wörtliche „Und es geschah“ unnötig nachzuahmen.
- source_word: נִלְחֲמוּ
  choice: kämpften
  rationale: Der Niphal von לחם bezeichnet hier den bewaffneten Kampf; das Präteritum passt zur fortlaufenden deutschen Erzählung.
- source_word: בְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Dies ist die übliche deutsche Bezeichnung für die Volksgruppe und entspricht idiomatisch dem hebräischen Ausdruck „Söhne Ammons“.
- source_word: עִם יִשְׂרָאֵל
  choice: gegen Israel
  rationale: עִם bedeutet grundsätzlich „mit“, kennzeichnet bei נלחם jedoch die gegnerische Partei; „gegen“ macht die feindliche Beziehung im Deutschen klar.
- source_word: זִקְנֵי גִלְעָד
  choice: die Ältesten von Gilead
  rationale: Die Wendung bezeichnet die anerkannten führenden Männer Gileads und wird mit der geläufigen biblischen Amts- und Gruppenbezeichnung wiedergegeben.
- source_word: לָקַחַת
  choice: zu holen
  rationale: לקח bedeutet häufig „nehmen“. Da die Ältesten zu Jiftach gehen, um ihn aus Tob zurückzubringen, drückt „holen“ die kontextuelle Bewegungsrichtung im Deutschen präzise und natürlich aus.
- source_word: אֶת יִפְתָּח
  choice: Jiftach
  rationale: Der direkte Objektmarker bleibt unübersetzt; der Personenname wird in einer im modernen deutschen Bibelgebrauch etablierten, hebräisch nahen Form wiedergegeben.
- source_word: מֵאֶרֶץ טוֹב
  choice: aus dem Land Tob
  rationale: אֶרֶץ bezeichnet hier das Gebiet namens Tob; „Land Tob“ ist knapp, verständlich und wahrt die Ortsbezeichnung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit flüssiger Erzählsyntax. „Als nun“ erhält den narrativen Anschluss, „hingehen, um … zu holen“ bildet sowohl die Bewegung der Ältesten als auch den Zweck ihres Weges ab.
