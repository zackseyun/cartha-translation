  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: de
  text: Denn als sie aus Ägypten heraufzogen, zog Israel durch die Wüste bis zum Roten Meer[a] und kam nach Kadesch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schilfmeer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt im Zusammenhang die begründende beziehungsweise erläuternde geschichtliche Rückblende ein; „Denn“ gibt diese Funktion natürlich wieder.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: als sie aus Ägypten heraufzogen
  rationale: Die Präposition ב mit dem Infinitiv constructus und Suffix bildet einen Temporalsatz. „Heraufzogen“ bewahrt die im Hebräischen übliche Exodus-Richtungsangabe.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: zog Israel durch die Wüste
  rationale: הלך bezeichnet das Gehen oder Ziehen; zusammen mit בַּמִּדְבָּר beschreibt es hier den Reiseweg. „Durch die Wüste ziehen“ ist im Deutschen natürlich und dem Kontext angemessen.
- source_word: עַד יַם סוּף
  choice: bis zum Roten Meer
  rationale: עַד bezeichnet die räumliche Erstreckung bis zu einem Zielpunkt. Die traditionelle und allgemein verständliche Wiedergabe von יַם סוּף lautet „Rotes Meer“; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: und kam nach Kadesch
  rationale: בוא bezeichnet das Kommen beziehungsweise Eintreffen; das direktive ה an קָדֵשָׁה drückt die Bewegung nach Kadesch aus.
