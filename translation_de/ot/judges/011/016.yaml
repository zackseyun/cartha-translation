  source_fidelity: 'Der deutsche Text gibt die hebräische Satzfolge und die wesentlichen Bedeutungen treffend wieder: כִּי als begründend-erläuterndes „Denn“, die temporale Wendung „als sie aus Ägypten heraufzogen“, Israels Zug durch die Wüste bis zum ים סוף sowie das Eintreffen in Kadesch. „Bis zum“ entspricht עַד angemessen, und „nach Kadesch“ gibt die Richtung durch das he locale wieder.'
