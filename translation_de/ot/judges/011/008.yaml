  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: de
  text: 'Und die Ältesten von Gilead sagten zu Jiftach: „Deshalb sind wir jetzt zu dir zurückgekehrt[a], damit du mit uns ziehst, gegen die Ammoniter[b] kämpfst und unser Oberhaupt über alle Bewohner Gileads wirst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sind wir zu dir zurückgekommen; haben wir uns wieder an dich gewandt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: gegen die Söhne Ammons.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: die Ältesten von Gilead
  rationale: „Älteste“ bezeichnet hier die anerkannten Vertreter und führenden Männer der Gemeinschaft und bewahrt die gesellschaftlich-politische Funktion des hebräischen Ausdrucks.
- source_word: לָכֵן עַתָּה
  choice: Deshalb ... jetzt
  rationale: Die Formulierung gibt sowohl die Folgerung aus Jiftachs Einwand im vorherigen Vers als auch die gegenwärtige Dringlichkeit wieder.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: sind wir ... zu dir zurückgekehrt
  rationale: שׁוּב bedeutet gewöhnlich „zurückkehren“. Die Wiedergabe bleibt nahe am Hebräischen und passt dazu, dass die Ältesten nach der früheren Zurückweisung Jiftachs erneut zu ihm kommen.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: damit du mit uns gehst
  rationale: „Mit uns gehst“ wahrt die Grundbedeutung von הלך und fügt sich natürlich in den von der Rückkehr der Ältesten abhängigen Zwecksatz ein.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: und gegen die Ammoniter kämpfst
  rationale: „Ammoniter“ ist die übliche deutsche Bezeichnung für die wörtlich genannten „Söhne Ammons“; „gegen“ gibt den feindlichen Sinn der Konstruktion mit בְּ wieder.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: Dann sollst du unser Oberhaupt sein
  rationale: „Oberhaupt“ bewahrt die Leitungsmetapher von רֹאשׁ. „Unser“ gibt לָנוּ idiomatisch wieder, während „sollst“ die zugesagte künftige Stellung ausdrückt, ohne sie auf einen bloßen militärischen Auftrag zu verengen.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: das Oberhaupt aller Bewohner Gileads
  rationale: Die Apposition macht deutlich, dass „unser“ sämtliche Bewohner Gileads umfasst. „Bewohner“ gibt das substantivierte Partizip יֹשְׁבֵי knapp und natürlich wieder.
theological_decisions:
- issue: Umfang der Jiftach zugesagten Vollmacht
  choice: Die Ältesten sagen Jiftach eine umfassende Führungsstellung über alle Bewohner Gileads zu.
  alternative: Die Zusage bezeichnet lediglich einen zeitlich begrenzten militärischen Oberbefehl.
  rationale: Die Wendung „unser Oberhaupt ... aller Bewohner Gileads“ reicht über den unmittelbaren Kampfauftrag hinaus. Die Übersetzung bewahrt diesen weiteren Umfang, ohne spätere politische oder konfessionelle Kategorien einzutragen.
- issue: Verhältnis von Kampfauftrag und Führungszusage
  choice: Der Kampf wird als Zweck der Rückkehr genannt; die Stellung als Oberhaupt folgt als zugesagte Konsequenz.
  alternative: 'Alle drei Verbformen können als gleichgeordnete Bestandteile eines einzigen Zwecksatzes verstanden werden: mitgehen, kämpfen und Oberhaupt werden.'
  rationale: Die hebräischen Verbformen lassen eine enge Reihung zu. Die Satzteilung mit „Dann“ gibt den natürlichen Fortgang wieder, legt aber keine weitergehende dogmatische Unterscheidung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jiftach“ folgt einer gängigen, quellennahen deutschen Umschrift. Die Wiederholung von „Oberhaupt“ verdeutlicht den Bezug von לָנוּ auf alle Bewohner Gileads und vermeidet ein missverständliches „Oberhaupt über uns über alle Bewohner“.
