source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֖ה אָמַ֣ר יִפְתָּ֑ח לֹֽא לָקַ֤ח יִשְׂרָאֵל֙ אֶת אֶ֣רֶץ מוֹאָ֔ב וְ/אֶת אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: de
  text: 'Und er sagte zu ihm: „So spricht Jiftach: Israel hat weder das Land Moab noch das Land der Ammoniter[a] genommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Ammons“; das heißt: der Ammoniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Und er sagte zu ihm
  rationale: Die Erzählfolge und der Bezug des Pronomens werden direkt wiedergegeben; „sagte zu ihm“ ist im modernen Standarddeutsch natürlich und genau.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird in ihrer feierlich-deklarativen Funktion bewahrt; das deutsche Präsens entspricht dem formelhaften hebräischen Perfekt.
- source_word: יִפְתָּח
  choice: Jiftach
  rationale: Der Personenname wird nach einer im Deutschen gebräuchlichen, quellennahen Umschrift wiedergegeben.
- source_word: לֹא לָקַח
  choice: hat weder … noch … genommen
  rationale: „Nehmen“ bewahrt die semantische Breite von לקח. Die einmalige hebräische Verneinung vor zwei koordinierten Objekten wird im Deutschen idiomatisch durch „weder … noch“ ausgedrückt.
- source_word: אֶרֶץ
  choice: Land
  rationale: „Land“ gibt sowohl den geografischen als auch den politischen Sinn wieder und bewahrt die Wiederholung der Aussage gedanklich, ohne im Deutschen schwerfällig zu wirken.
- source_word: מוֹאָב
  choice: Moab
  rationale: Gebräuchliche deutsche Form des Orts- und Volksnamens.
- source_word: בְּנֵי עַמּוֹן
  choice: Ammoniter
  rationale: Die hebräische Wendung „Söhne Ammons“ ist hier ein Ethnonym. „Ammoniter“ ist im modernen Deutsch klar und natürlich; die wörtliche Form bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formelhafter Erhabenheit in „So spricht“. Die diplomatische Behauptung bleibt knapp und ohne interpretierende Zusätze. Der Fußnotenmarker steht unmittelbar bei der idiomatischen Wiedergabe des hebräischen Ethnonyms.
