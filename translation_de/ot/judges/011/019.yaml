  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: de
  text: 'Da sandte Israel Boten[a] zu Sihon, dem König der Amoriter, dem König von Heschbon. Israel sagte zu ihm: »Lass uns bitte durch dein Land ziehen bis zu meinem Ort.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gesandte«. In diesem Zusammenhang handelt es sich um diplomatische Vertreter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »bis zu meinem Ort«. Israel spricht hier als kollektive Einheit in der Einzahl.'
    reason: textual_clarification
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das narrative Wayyiqtol wird mit einer natürlichen deutschen Erzählfortführung wiedergegeben.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im diplomatischen Zusammenhang sind menschliche Abgesandte gemeint; »Boten« ist klar und bewahrt die Grundbedeutung.
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: dem König der Amoriter
  rationale: Die Amts- und Volksbezeichnung wird transparent wiedergegeben.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: dem König von Heschbon
  rationale: Der zweite, appositionelle Herrschertitel des Hebräischen bleibt erhalten.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: Israel sagte zu ihm
  rationale: Die ausdrückliche Wiederholung von »Israel« im Hebräischen wird nicht geglättet.
- source_word: נַעְבְּרָה נָּא
  choice: Lass uns bitte … ziehen
  rationale: Der Kohortativ zusammen mit נָא drückt eine höfliche Bitte aus; die Formulierung ist im heutigen Deutsch natürlich.
- source_word: בְאַרְצְךָ
  choice: durch dein Land
  rationale: In Verbindung mit עבר bezeichnet die Präposition die Bewegung durch ein Gebiet.
- source_word: עַד מְקוֹמִי
  choice: bis zu meinem Ort
  rationale: Das hebräische Suffix steht in der ersten Person Singular. Die Übersetzung bewahrt diese auffällige kollektive Singularrede Israels, statt sie zu »unserem Ort« zu harmonisieren.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die doppelte Königsbezeichnung und die Wiederholung von »Israel« folgen bewusst der hebräischen Satzgestalt. Die Spannung zwischen dem pluralischen »uns« und dem singularischen »meinem« bleibt erhalten.
