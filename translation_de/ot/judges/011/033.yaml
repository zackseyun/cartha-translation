source:
  edition: WLC
  text: וַ/יַּכֵּ֡/ם מֵ/עֲרוֹעֵר֩ וְ/עַד בּוֹאֲ/ךָ֨ מִנִּ֜ית עֶשְׂרִ֣ים עִ֗יר וְ/עַד֙ אָבֵ֣ל כְּרָמִ֔ים מַכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּכָּֽנְעוּ֙ בְּנֵ֣י עַמּ֔וֹן מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: de
  text: Und er schlug sie von Aroër bis zum Zugang zu Minnit[a] – zwanzig Städte – und bis Abel-Keramim[b] und brachte ihnen eine überaus schwere Niederlage bei.[c] So wurden die Ammoniter vor den Israeliten bezwungen.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis nach Minnit“ beziehungsweise „bis zum Eingang von Minnit“. Der hebräische Ausdruck ist nicht eindeutig und kann den Zugang zur Stadt oder die Stadt selbst meinen.'
    reason: alternative_reading
  - marker: b
    text: Abel-Keramim ist ein Ortsname. Seine Bestandteile können etwa „Wiese der Weinberge“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „mit einem überaus schweren Schlag“; im militärischen Zusammenhang kann damit eine verheerende Niederlage oder ein großes Blutbad gemeint sein.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „die Söhne Ammons“ und „die Söhne Israels“. Gemeint sind die Ammoniter und die Israeliten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Und er schlug sie
  rationale: נכה bezeichnet konkret das Schlagen im Kampf. Die Formulierung bewahrt dieses Bild, ohne bereits im Verb den Umfang der Tötung festzulegen.
- source_word: מֵעֲרוֹעֵר
  choice: von Aroër
  rationale: Der Ortsname wird transliteriert; die Schreibung mit Trema macht die Silbentrennung im Deutschen deutlich.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: bis zum Zugang nach Minnit
  rationale: בואך ist in dieser geografischen Angabe schwierig und kann den Zugang beziehungsweise die Annäherung an den Ort bezeichnen. „Zugang nach Minnit“ bleibt verständlich und lässt offen, ob der Stadteingang oder das unmittelbare Umfeld gemeint ist.
- source_word: עֶשְׂרִים עִיר
  choice: zwanzig Städte
  rationale: Direkte und im Kontext natürliche Wiedergabe von Numerale und Substantiv.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: und bis Abel-Keramim
  rationale: Die Wortgruppe fungiert als Ortsname und wird daher nicht als „Weinbergswiese“ übersetzt.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: eine überaus schwere Niederlage
  rationale: מכה kann im militärischen Zusammenhang einen vernichtenden Schlag oder eine Niederlage bezeichnen. Die Wiedergabe vermittelt die Stärke der Aussage, ohne ausdrücklich ein vollständiges Blutbad zu behaupten.
- source_word: וַיִּכָּנְעוּ
  choice: wurden ... bezwungen
  rationale: Das Nifal von כנע bezeichnet hier das militärisch-politische Unterliegen beziehungsweise Unterworfenwerden.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die idiomatische deutsche Volksbezeichnung gibt die hebräische Abstammungsformel natürlich wieder.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: „Vor“ bewahrt die relationale Kraft von מפני; „Israeliten“ ist die natürliche deutsche Wiedergabe von „Söhne Israels“ als Volksbezeichnung.
theological_decisions: []
