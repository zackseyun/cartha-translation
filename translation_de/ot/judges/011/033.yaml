  to: Und er schlug sie von Aroër bis zum Zugang zu Minnit[a] – zwanzig Städte – und bis Abel-Keramim[b] und brachte ihnen eine überaus schwere Niederlage bei.[c] So wurden die Ammoniter vor den Israeliten bezwungen.[d]
  rationale: Ausschließlich die deutsche Präposition bei der unsicheren Ortsangabe wird von „nach“ zu „zu“ korrigiert. Dadurch wird die Formulierung idiomatischer, während die Fußnote die im Hebräischen bestehende Auslegungsunsicherheit weiterhin ausdrücklich bewahrt. Alle Fußnotenanker bleiben erhalten und korrekt zugeordnet.
