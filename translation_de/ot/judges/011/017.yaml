base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: de
  text: 'Da sandte Israel Boten zum König von Edom und ließ ihm sagen: »Lass mich doch durch dein Land ziehen!«[a] Aber der König von Edom hörte nicht darauf. Auch zum König von Moab sandte Israel Boten, doch der war nicht dazu bereit.[b] So blieb Israel in Kadesch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen die erste Person Singular: „Lass mich … ziehen.“ Israel spricht dabei als ein einziges Volk; sinngemäß ist auch „Lass uns … ziehen“ möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch der willigte nicht ein“; stärker formuliert: „doch der weigerte sich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das narrative Wayyiqtol wird mit einem schlichten deutschen Erzähltempus wiedergegeben; „da“ markiert den Fortgang der Erzählung.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im diplomatischen Zusammenhang sind menschliche Boten gemeint; „Engel“ wäre hier irreführend.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Diese natürliche deutsche Redeformel gibt die Beauftragung der Boten idiomatisch wieder.
- source_word: אֶעְבְּרָה נָּא
  choice: Lass mich doch … ziehen
  rationale: Die erste Person Singular wird bewahrt, weil Israel als kollektive Einheit spricht; „doch“ gibt die höflich-bittende Nuance von נָא wieder.
- source_word: בְאַרְצֶךָ
  choice: durch dein Land
  rationale: In Verbindung mit עבר bezeichnet die Präposition das Durchqueren eines Gebiets.
- source_word: וְלֹא שָׁמַע
  choice: hörte nicht darauf
  rationale: שׁמע meint hier nicht bloß akustisches Hören, sondern das Beachten beziehungsweise Erhören der Bitte.
- source_word: וְגַם אֶל מֶלֶךְ מוֹאָב שָׁלַח
  choice: Auch zum König von Moab sandte Israel Boten
  rationale: Das im Hebräischen nicht ausdrücklich wiederholte Subjekt und Objekt werden im Deutschen zur eindeutigen, flüssigen Verständlichkeit ergänzt.
- source_word: וְלֹא אָבָה
  choice: doch der war nicht dazu bereit
  rationale: אָבָה bezeichnet Bereitschaft oder Einwilligung; die Formulierung vermeidet die möglicherweise stärkere Nuance von „weigerte sich“.
- source_word: וַיֵּשֶׁב
  choice: So blieb
  rationale: Im Reisebericht bezeichnet das Verb den weiteren Aufenthalt, nicht notwendig eine dauerhafte Ansiedlung.
- source_word: בְּקָדֵשׁ
  choice: in Kadesch
  rationale: Natürliche deutsche Wiedergabe des Aufenthalts an dem genannten Ort.
