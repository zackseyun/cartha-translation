  text: וַ/תֵּ֧לֶד אֵֽשֶׁת גִּלְעָ֛ד ל֖/וֹ בָּנִ֑ים וַ/יִּגְדְּל֨וּ בְֽנֵי הָ/אִשָּׁ֜ה וַ/יְגָרְשׁ֣וּ אֶת יִפְתָּ֗ח וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא תִנְחַ֣ל בְּ/בֵית אָבִ֔י/נוּ כִּ֛י בֶּן אִשָּׁ֥ה אַחֶ֖רֶת אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: de
  text: 'Gileads Frau gebar ihm Söhne. Als die Söhne der Frau herangewachsen waren, vertrieben sie Jiftach und sagten zu ihm: „Du wirst im Haus unseres Vaters nicht erben, denn du bist der Sohn einer anderen Frau.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי הָאִשָּׁה
  choice: die Söhne der Frau
  rationale: Bewahrt die auffällige bestimmte Formulierung des Hebräischen und folgt der durch den Kontext bezeichneten Ehefrau Gileads, ohne das im Masoretischen Text nicht ausdrücklich stehende Possessivpronomen „seiner“ einzufügen.
- source_word: לֹא תִנְחַל
  choice: du sollst keinen Erbteil ... bekommen
  rationale: Gibt das Erbverb נחל in natürlichem modernem Deutsch wieder und lässt den Ausspruch als entschiedenen Ausschluss vom Erbe erkennen.
- source_word: בְּבֵית אָבִינוּ
  choice: im Haus unseres Vaters
  rationale: Erhält die familien- und erbrechtliche Bedeutung von בית; „Haus“ bezeichnet hier den väterlichen Haushalt beziehungsweise Familienverband.
- source_word: אִשָּׁה אַחֶרֶת
  choice: einer anderen Frau
  rationale: Entspricht der neutralen hebräischen Formulierung und wiederholt nicht die abwertende Bezeichnung aus Vers 1.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jiftach“ folgt einer quellenahen deutschen Umschrift. Die markierte Wiederholung „die Söhne der Frau“ wurde trotz ihrer leichten Ungewöhnlichkeit beibehalten, weil sie im hebräischen Text ausdrücklich steht.
