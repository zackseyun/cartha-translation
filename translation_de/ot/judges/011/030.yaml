id: JDG.11.30
reference: Judges 11:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִפְתָּ֥ח נֶ֛דֶר לַ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָת֥וֹן תִּתֵּ֛ן אֶת בְּנֵ֥י עַמּ֖וֹן בְּ/יָדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: de
  text: 'Und Jeftah legte Jahwe ein Gelübde ab und sagte: „Wenn du mir die Ammoniter wirklich in die Hand gibst,[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Wenn du die Ammoniter ganz gewiss in meine Hand gibst“. Das Hebräische verstärkt das Verb durch einen vorangestellten Infinitiv derselben Wortwurzel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: legte ... ein Gelübde ab
  rationale: Die deutsche Wendung gibt Verb und stammverwandtes Objekt natürlich wieder, ohne das Gelübde inhaltlich vorwegzunehmen.
- source_word: יִפְתָּח
  choice: Jeftah
  rationale: Eingebürgerte deutsche Form des hebräischen Namens.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: אִם
  choice: Wenn
  rationale: Leitet den Bedingungssatz des Gelübdes ein, dessen Fortsetzung im nächsten Vers folgt.
- source_word: נָתוֹן תִּתֵּן
  choice: wirklich ... gibst
  rationale: Das vorangestellte Infinitivus absolutus verstärkt die finite Verbform; „wirklich“ vermittelt diese Hervorhebung in natürlichem Deutsch.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die übliche deutsche Bezeichnung für das Volk der Söhne Ammons.
- source_word: בְּיָדִי
  choice: mir ... in die Hand
  rationale: Bewahrt das hebräische Bild der Übergabe in Jeftahs Gewalt und die Singularform „Hand“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Eigennamen; „Jahwe“ macht diesen Namen sichtbar, ohne eine konfessionelle Deutung einzutragen.
- issue: Nachdruck in נָתוֹן תִּתֵּן
  choice: wirklich ... gibst
  alternative: ganz gewiss ... gibst
  rationale: Die emphatische Konstruktion wird erkennbar wiedergegeben, ohne festzulegen, ob der Nachdruck als Gewissheit, Bitte oder feierliche Bedingung zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wie im Hebräischen offen, da der Nachsatz des Gelübdes erst im folgenden Vers steht. Die Stellung des Fußnotenzeichens vor dem schließenden Anführungszeichen ordnet die Anmerkung der gesamten Bedingungsformulierung zu.
