  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: de
  text: Wirst du nicht das in Besitz nehmen, was Kemosch, dein Gott, dir zum Besitz gibt? Und alles, was Jahwe, unser Gott, vor uns vertrieben hat, das werden wir in Besitz nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die wiederholte hebräische Wortwurzel kann je nach Form und Zusammenhang „in Besitz nehmen“, „zum Besitz geben“ oder „vertreiben“ bedeuten; beim Landbesitz sind Besitznahme und Verdrängung der bisherigen Bewohner eng miteinander verbunden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Solltest du nicht
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet, und passt zum diplomatischen Argument Jiftachs.
- source_word: יוֹרִישְׁךָ
  choice: dir zum Besitz gibt
  rationale: Der Hifil von ירשׁ bezeichnet hier, jemanden in den Besitz von Land zu bringen, wobei die Verdrängung bisheriger Bewohner mitgedacht sein kann.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: Kemosch, dein Gott
  rationale: Der Eigenname wird in geläufiger deutscher Form wiedergegeben; die Apposition bleibt unmittelbar erhalten.
- source_word: תִירָשׁ
  choice: in Besitz nehmen
  rationale: Gibt den territorialen Sinn von ירשׁ in diesem politisch-militärischen Zusammenhang natürlich wieder.
- source_word: הוֹרִישׁ
  choice: vertrieben hat
  rationale: Bewahrt beim Hifil die Verdrängung der bisherigen Bewohner und ist im Deutschen klarer und natürlicher als das fachsprachliche „enteignet hat“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפָּנֵינוּ
  choice: vor uns
  rationale: Entspricht der räumlichen hebräischen Wendung und bezeichnet die Beseitigung von Hindernissen beziehungsweise Bewohnern vor Israel.
- source_word: נִירָשׁ
  choice: werden wir in Besitz nehmen
  rationale: Hält den territorialen Sinn und die Wiederholung des Verbs aus der ersten Satzhälfte aufrecht.
theological_decisions:
- issue: Kemosch wird in Jiftachs Rede als „dein Gott“ bezeichnet
  choice: Die Formulierung wird ohne distanzierende Zusätze wiedergegeben.
  alternative: Anführungszeichen, „vermeintlicher Gott“ oder eine ironisierende Paraphrase.
  rationale: Der Vers gibt Jiftachs rhetorisch-diplomatisches Argument wieder. Die Formulierung bestätigt weder erzählerisch Kemoschs Göttlichkeit noch verlangt sie eine ausdrückliche Distanzierung.
- issue: Handlung Kemoschs im rhetorischen Argument
  choice: „was Kemosch … dir zum Besitz gibt“ bewahrt die Aussage als direkte Rede.
  alternative: Die Handlung durch „nach deiner Auffassung“ ausdrücklich relativieren.
  rationale: Eine solche Relativierung ist zwar pragmatisch mitgemeint, steht aber nicht ausdrücklich im Hebräischen und würde die Spannung des Textes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Parallelität bleibt erhalten; „in Besitz nehmen“ ist verständlich und bildet den territorialen Zusammenhang genauer ab als „erben“.
