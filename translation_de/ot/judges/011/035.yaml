base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: de
  text: 'Und als er sie sah, zerriss er seine Kleider und sagte: »Ach, meine Tochter! Du hast mich tief niedergebeugt, und du bist zu meinem Unglück geworden. Denn ich habe vor Jahwe meinen Mund aufgetan[a] und kann es nicht zurücknehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Ich habe Jahwe ein Gelübde gelobt.« Wörtlich steht im Hebräischen: »Ich habe vor Jahwe meinen Mund aufgetan.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: Und als er sie sah
  rationale: Die hebräische Erzählformel וַיְהִי mit temporalem Infinitiv wird im modernen Deutschen natürlich als temporaler Nebensatz wiedergegeben; ein zusätzliches »es geschah« wäre hier unnötig schwerfällig.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: zerriss er seine Kleider
  rationale: קרע mit בגדים bezeichnet die bekannte Trauer- und Verzweiflungsgeste. »Kleider« ist verständlich und bewahrt den biblisch-würdigen Ton.
- source_word: אֲהָהּ בִּתִּי
  choice: Ach, meine Tochter!
  rationale: »Ach« gibt den Ausruf von Schmerz und Bestürzung natürlich wieder; בִּתִּי ist eine direkte Anrede.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: Du hast mich tief niedergebeugt
  rationale: Infinitivus absolutus und finite Verbform verstärken כרע. »Tief niedergebeugt« bewahrt sowohl die intensive Wirkung als auch das Bild des Herabbeugens, ohne eine körperliche Handlung zu behaupten.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: und du bist zur Ursache meines Unglücks geworden
  rationale: עכר bezeichnet das Herbeiführen von Not oder Unglück. Die Formulierung gibt Jiftachs schmerzliche Zuschreibung wieder, ohne sie zu einer noch stärkeren moralischen Anklage auszuweiten.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: Denn ich habe meinen Mund vor Jahwe aufgetan
  rationale: Die konkrete hebräische Wendung »den Mund öffnen« bleibt erhalten; im Kontext bezeichnet sie die feierliche Äußerung eines Gelübdes. Die Fußnote nennt diesen Sinn ausdrücklich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: und kann nicht zurück
  rationale: שוב bedeutet hier, von der ausgesprochenen Verpflichtung zurückzukehren. Die knappe Formulierung bewahrt die Ausdrucksweise und lässt den Kontext den Bezug bestimmen.
theological_decisions:
- issue: Ob Jiftachs Aussage im Haupttext ausdrücklich als Gelübde bezeichnet werden soll
  choice: Die hebräische Wendung »ich habe meinen Mund vor Jahwe aufgetan« bleibt im Haupttext erhalten.
  alternative: »Ich habe Jahwe ein Gelübde abgelegt« oder »Ich habe Jahwe mein Wort gegeben«.
  rationale: Der Zusammenhang macht den Bezug auf das Gelübde deutlich, doch der hebräische Text verwendet eine feierliche bildhafte Wendung. Ihre Beibehaltung vermeidet unnötige Explikation; die Fußnote erläutert den gemeinten Sinn.
- issue: Wie stark Jiftachs Worte an seine Tochter als Schuldzuweisung erscheinen sollen
  choice: »Du hast mich tief niedergebeugt« und »du bist zur Ursache meines Unglücks geworden«.
  alternative: »Du hast mich zugrunde gerichtet« oder »du bist meine Verderberin geworden«.
  rationale: Der Vers drückt heftige Verzweiflung und eine Zuschreibung an die Tochter aus. Noch stärkere Formulierungen könnten jedoch moralische Schuld oder bewusste Zerstörungsabsicht nahelegen, die der Text nicht ausdrücklich behauptet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bewahrt die emotionale Intensität und die feierliche hebräische Bildsprache. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
