source:
  edition: WLC
  text: וַ/יִּ֣ירְשׁ֔וּ אֵ֖ת כָּל גְּב֣וּל הָ/אֱמֹרִ֑י מֵֽ/אַרְנוֹן֙ וְ/עַד הַ/יַּבֹּ֔ק וּ/מִן הַ/מִּדְבָּ֖ר וְ/עַד הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: de
  text: So nahmen sie das ganze Gebiet der Amoriter[a] in Besitz, vom Arnon bis zum Jabbok und von der Wüste bis zum Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „des Amoriters“; der Singular bezeichnet hier kollektiv das Volk der Amoriter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: So nahmen sie … in Besitz
  rationale: ירשׁ bezeichnet im Eroberungskontext die aktive Inbesitznahme eines Gebiets; „in Besitz nehmen“ gibt diesen Sinn natürlich wieder, ohne ihn auf „erben“ oder ausdrücklich „vertreiben“ festzulegen.
- source_word: כָּל גְּבוּל
  choice: das ganze Gebiet
  rationale: כָּל bewahrt den umfassenden Sinn, während גְּבוּל hier angesichts der folgenden Grenzangaben das Land innerhalb der Grenzen bezeichnet und daher idiomatisch mit „Gebiet“ wiedergegeben wird.
- source_word: הָאֱמֹרִי
  choice: der Amoriter
  rationale: Der hebräische Singular ist kollektiv gebraucht; im Deutschen ist die pluralische Volksbezeichnung hier natürlich.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק
  choice: vom Arnon bis zum Jabbok
  rationale: Die knappe deutsche Wendung bildet das erste Paar geografischer Grenzpunkte genau und flüssig ab.
- source_word: וּמִן הַמִּדְבָּר וְעַד הַיַּרְדֵּן
  choice: und von der Wüste bis zum Jordan
  rationale: „Wüste“ kann im Deutschen auch unbesiedeltes, trockenes Land bezeichnen und gibt מִדְבָּר in diesem geografischen Zusammenhang verständlich wieder; die parallele Grenzform bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper geografischer Parallelstruktur. „Gebiet“ ist gegenüber „Grenze“ kontextgemäß, und „in Besitz nehmen“ bewahrt die Bedeutungsbreite des hebräischen Verbs.
