base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: de
  text: 'Und sie sagte zu ihrem Vater: »Dies möge mir gewährt werden: Lass mir zwei Monate Zeit[a], damit ich fortgehen und ins Bergland hinabziehen kann, um über meine Jungfräulichkeit[b] zu weinen, ich und meine Freundinnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Lass für zwei Monate von mir ab«; gemeint ist, dass ihr diese Zeit zugestanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »über meine Jungfräulichkeit«. Hervorgehoben werden ihr unverheirateter Zustand und die damit verbundene Kinderlosigkeit; die umfassendere Deutung der Erzählung wird hier nicht entschieden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Dies möge mir gewährt werden
  rationale: Die passive, auffordernde Form wird im Deutschen natürlich wiedergegeben. »Gewährt werden« bringt den Sinn einer Bitte zum Ausdruck, ohne diese ausdrücklich in den Text einzutragen.
- source_word: הַרְפֵּה מִמֶּנִּי שְׁנַיִם חֳדָשִׁים
  choice: Lass mir zwei Monate Zeit
  rationale: Die Wendung bittet darum, für zwei Monate freigelassen beziehungsweise unbehelligt gelassen zu werden. Die gewählte Formulierung ist idiomatisch und wahrt den zeitlichen Rahmen.
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: damit ich fortgehen und ins Bergland hinabziehen kann
  rationale: Beide hebräischen Bewegungsverben bleiben erhalten. »Bergland« gibt den pluralischen Geländebegriff natürlich wieder; »hinabziehen« bewahrt die Bewegungsrichtung, statt sie als bloßes Umherwandern zu deuten.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: um über meine Jungfräulichkeit zu weinen
  rationale: Die konkrete Aussage des Hebräischen wird bewahrt. Der Text nennt ihre Jungfräulichkeit beziehungsweise ihren unverheirateten Zustand, ohne in diesem Vers den weiteren Ausgang ausdrücklich zu erklären.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: ich und meine Freundinnen
  rationale: Die feminine Pluralform bezeichnet weibliche Gefährtinnen oder Freundinnen. »Freundinnen« ist im heutigen Deutsch klar und natürlich.
theological_decisions:
- issue: Bedeutung der Klage über die Jungfräulichkeit von Jiftachs Tochter
  choice: Der Vers spricht ausdrücklich von ihrer Jungfräulichkeit und lässt die weitergehende Deutung offen.
  alternative: Die Formulierung als ausdrückliche Klage über den bevorstehenden Tod oder ausschließlich über eine lebenslange kultische Jungfräulichkeit deuten.
  rationale: Der hebräische Wortlaut nennt hier Jungfräulichkeit, nicht ausdrücklich Tod. Daher wird weder eine buchstäbliche Opferung noch eine ausschließliche Weihe zur lebenslangen Jungfräulichkeit in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich, aber gut verständlich. Unnatürliche Wörtlichkeit wird vermieden, während beide Bewegungsverben und die ausdrückliche Bezugnahme auf die Jungfräulichkeit erhalten bleiben.
