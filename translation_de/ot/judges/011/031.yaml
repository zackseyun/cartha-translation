base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: de
  text: dann soll das, was aus der Tür meines Hauses herauskommt, um mir entgegenzukommen, wenn ich in Frieden von den Ammonitern zurückkehre, dem HERRN gehören[a], und ich werde es als Brandopfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll dem HERRN gehören, oder ich werde es als Brandopfer darbringen.“ Manche verstehen die hebräische Konjunktion hier im trennenden Sinn, sodass je nachdem, wer oder was herauskäme, zwei verschiedene Möglichkeiten gemeint wären.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: das, was … entgegenkommt
  rationale: Die hebräische maskuline Singularform kann im Zusammenhang einen Menschen oder ein Tier bezeichnen. Die neutrale deutsche Konstruktion legt die Identität dessen, was herauskommt, nicht vorzeitig fest.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: aus den Türen meines Hauses
  rationale: Dies gibt den Plural דַּלְתֵי formal wieder und bleibt im Deutschen verständlich; gemeint ist das Herauskommen aus dem Hausbereich durch dessen Türen.
- source_word: לִקְרָאתִי
  choice: mir … entgegenkommt
  rationale: Die Form bezeichnet eine Bewegung auf eine Begegnung hin. „Mir entgegenkommt“ ist dafür eine natürliche deutsche Wiedergabe.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: wenn ich in Frieden … zurückkehre
  rationale: „In Frieden“ bewahrt die hebräische Ausdrucksweise und umfasst sichere, unversehrte Rückkehr sowie Wohlergehen.
- source_word: מִבְּנֵי עַמּוֹן
  choice: von den Ammonitern
  rationale: Die wörtliche Bezeichnung „Söhne Ammons“ wird als üblicher deutscher Volksname wiedergegeben.
- source_word: וְהָיָה לַיהוָה
  choice: soll … dem HERRN gehören
  rationale: Die Wendung bezeichnet Zugehörigkeit beziehungsweise Weihung an JHWH, ohne die genaue Art dieser Hingabe zusätzlich auszudeuten.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname JHWH wird im Haupttext traditionsgemäß mit „HERR“ in Kapitälchen wiedergegeben; die Dativform ist syntaktisch erforderlich.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: und ich werde es als Brandopfer darbringen
  rationale: Die Hifil-Konstruktion mit עוֹלָה ist die übliche Opferformel. „Es“ nimmt die bewusst offene Formulierung „das, was“ auf; „und“ entspricht dem normalen Wert der Konjunktion ו.
theological_decisions:
- issue: Ob Jiftachs Gelübde ein einziges Ergebnis oder zwei alternative Möglichkeiten bezeichnet
  choice: Ein einziges Ergebnis mit verbindendem „und“
  alternative: 'Zwei Möglichkeiten mit trennendem „oder“: Das Herauskommende gehört entweder dem HERRN oder wird als Brandopfer dargebracht.'
  rationale: Die Konjunktion ו bedeutet gewöhnlich „und“, und die Syntax lässt sich am unmittelbarsten als zusammenhängendes Gelübde lesen. Da jedoch eine disjunktive Deutung vertreten wird, wird sie in einer Fußnote dokumentiert, ohne die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Satzstruktur, ist aber flüssig lesbar. Die offene Identität des aus dem Haus Kommenden und die umstrittene Bedeutung der Konjunktion werden nicht stillschweigend festgelegt.
