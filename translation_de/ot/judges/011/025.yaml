id: JDG.11.25
reference: Judges 11:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: de
  text: 'Und nun: Bist du wirklich besser als Balak, der Sohn Zippors, der König von Moab?[a] Hat er je mit Israel gestritten[b] oder je gegen sie gekämpft?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bist du etwa besser als Balak, der Sohn Zippors, der König von Moab?“ Im Hebräischen wird das Wort für „gut“ emphatisch wiederholt und dadurch der Vergleich verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hat er je mit Israel einen Rechtsstreit geführt oder je Krieg gegen sie geführt?“ Das erste Verb kann einen Streit oder eine rechtliche Auseinandersetzung bezeichnen, während das zweite ausdrücklich das Kämpfen meint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den Übergang zur rhetorischen Herausforderung durch עַתָּה.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: Bist du wirklich besser
  rationale: Das wiederholte טוֹב verstärkt den Vergleich; „wirklich besser“ gibt diese Emphase in natürlichem Deutsch wieder.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: als Balak, der Sohn Zippors, der König von Moab
  rationale: Gibt den Vergleich und die hebräische Apposition klar und würdig wieder.
- source_word: הֲרֹב רָב
  choice: Hat er je ... gestritten
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb wird durch „je“ rhetorisch verstärkt; „streiten“ wahrt die mögliche Bedeutung zwischen Auseinandersetzung, Rechtsstreit und Konflikt.
- source_word: עִם יִשְׂרָאֵל
  choice: mit Israel
  rationale: Entspricht der Grundbedeutung von עִם und hält die erste Aussage von dem ausdrücklich militärischen zweiten Verb unterschieden.
- source_word: אִם
  choice: oder
  rationale: Leitet hier das zweite Glied einer rhetorischen Alternativfrage ein.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: je gegen sie gekämpft
  rationale: „Gegen sie gekämpft“ gibt den militärischen Sinn von לחם wieder; „je“ vermittelt die emphatische hebräische Verbwiederholung idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, standardsprachliches Deutsch mit würdigem Ton. Die beiden Verben werden bewusst als „streiten“ und „kämpfen“ unterschieden, damit die Bedeutungsbreite des ersten Verbs und die militärische Bestimmtheit des zweiten erhalten bleiben.
