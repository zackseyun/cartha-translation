base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: de
  text: Da ging Jeftah mit den Ältesten von Gilead, und das Volk setzte ihn als Oberhaupt und Befehlshaber über sich ein.[a] Jeftah sprach alle seine Worte vor Jahwe in Mizpa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Befehlshaber« kann auch »Herrscher«, »Anführer« oder »Hauptmann« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Jeftah sprach alle seine Worte vor Jahwe in Mizpa.« Dies kann sich auf seine zuvor geäußerten Worte beziehen, ohne dass der Text ausdrücklich sagt, ob er sie wiederholte, bestätigte oder in anderer Weise vortrug.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: Da ging Jeftah mit den Ältesten von Gilead
  rationale: Gibt die erzählende Fortführung des Wayyiqtol sowie die Begleitung durch die regionalen Führungspersonen schlicht und natürlich wieder.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: und das Volk setzte ihn ... über sich ein
  rationale: שׂים mit Objekt und עַל bezeichnet hier die Einsetzung in ein Amt; „über sich“ wahrt den Bezug auf das Volk und klingt im Deutschen natürlich.
- source_word: לְרֹאשׁ וּלְקָצִין
  choice: als Oberhaupt und Befehlshaber
  rationale: „Oberhaupt“ erhält die Führungsmetapher von רֹאשׁ, während „Befehlshaber“ angesichts des bevorstehenden Krieges die wahrscheinlich militärische, aber nicht ausschließlich militärische Funktion von קָצִין ausdrückt.
- source_word: וַיְדַבֵּר ... אֶת כָּל דְּבָרָיו
  choice: trug ... alles vor, was er gesagt hatte
  rationale: Die Wendung lautet wörtlich „sprach alle seine Worte“. „Trug ... alles vor“ ist idiomatisches Deutsch und bewahrt die Offenheit, ob Jeftah seine Bedingungen wiederholte, die Vereinbarung bestätigte oder die Angelegenheit feierlich darlegte.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Bewahrt die Gegenwart Gottes als feierlichen Bezugsrahmen und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: בַּמִּצְפָּה
  choice: in Mizpa
  rationale: Der Ortsname wird in geläufiger deutscher Form wiedergegeben; „in“ bezeichnet den Ort des öffentlichen und religiös bedeutsamen Vorgangs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art von Jeftahs Rede vor Jahwe
  choice: trug ... alles vor, was er gesagt hatte
  alternative: wiederholte vor Jahwe alle seine Bedingungen
  rationale: Der Text kann eine feierliche Bestätigung der Abmachung, eine Erklärung oder eine religiös-rechtliche Bekräftigung meinen. Die Übersetzung legt ihn nicht ausschließlich auf Vertragsbedingungen, Eid oder Gebet fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Jeftah“, „Gilead“ und „Mizpa“ folgen geläufigen deutschen Namensformen. Die Formulierung wahrt die knappe hebräische Erzählweise und erklärt echte Bedeutungsbreiten nur in den Fußnoten.
