  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bündelt die drei Ortsangaben unter dem zeitlichen Rahmen von dreihundert Jahren; der Doppelpunkt leitet die rhetorische Frage klar ein. Das traditionelle Bild »Tochterstädte« bleibt erhalten und wird erläutert.
