  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: de
  text: 'Während Israel dreihundert Jahre lang in Heschbon und seinen Tochterstädten[a], in Aroër und seinen Tochterstädten sowie in all den Städten am Arnon wohnte: Warum habt ihr sie damals nicht zurückgewonnen?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »seinen Töchtern«; gemeint sind kleinere Ortschaften, die von einer größeren Stadt abhängig waren.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Warum habt ihr sie damals nicht entrissen?« Das hebräische Verb kann »retten« oder »entreißen« bedeuten; hier geht es um die Rückgewinnung des beanspruchten Gebiets.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת
  choice: Während Israel … wohnte
  rationale: Die Präposition ב mit dem Infinitiv constructus von ישׁב bezeichnet hier einen zeitlichen Begleitumstand. Die deutsche Nebensatzkonstruktion gibt den andauernden Aufenthalt natürlich wieder.
- source_word: בְּנוֹתֶיהָ
  choice: seinen Tochterstädten
  rationale: Wörtlich »seinen Töchtern«; gemeint sind kleinere, von einer Hauptstadt abhängige Ortschaften. »Tochterstädte« bewahrt das hebräische Bild, die Fußnote erläutert es.
- source_word: עַרְעוֹר
  choice: Aroër
  rationale: Gebräuchliche deutsche Wiedergabe des Ortsnamens mit Trema zur Kennzeichnung der getrennten Vokale.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: am Arnon
  rationale: Die Wendung bedeutet »an der Seite von, entlang, nahe bei«. »Am Arnon« ist im Deutschen knapp und natürlich und eignet sich für mehrere dort gelegene Städte.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: dreihundert Jahre lang
  rationale: »Jahre lang« macht die im Hebräischen ausgedrückte Zeitdauer idiomatisch deutlich.
- source_word: וּמַדּוּעַ
  choice: Warum
  rationale: Das einleitende ו verbindet die rhetorische Frage mit dem vorausgehenden Zeitumstand; nach dem Doppelpunkt ist eine ausdrückliche Wiedergabe durch »und« im Deutschen nicht nötig.
- source_word: הִצַּלְתֶּם
  choice: habt ihr sie … zurückgewonnen
  rationale: Der Hifil von נצל bedeutet gewöhnlich »retten, entreißen«. Im Zusammenhang des territorialen Anspruchs bezeichnet er die Rückgewinnung der genannten Städte; das im Hebräischen unausgesprochene Objekt wird mit »sie« aufgenommen.
- source_word: בָּעֵת הַהִיא
  choice: damals
  rationale: Die knappe deutsche Zeitangabe bewahrt den Rückverweis auf den genannten langen Zeitraum und klingt natürlicher als »zu jener Zeit«.
