base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: de
  text: Jahr für Jahr gingen die Töchter Israels hin, um der Tochter Jeftahs, des Gileaditers, vier Tage im Jahr zu gedenken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Tochter Jeftahs zu beklagen; möglicherweise auch: von ihr zu erzählen oder sie zu besingen. Das entsprechende hebräische Verb ist selten, und seine Bedeutung ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: Jahr für Jahr
  rationale: Die idiomatische Wendung bezeichnet eine regelmäßig wiederkehrende jährliche Handlung; „Jahr für Jahr“ gibt dies natürlich wieder.
- source_word: תֵּלַכְנָה
  choice: gingen … hin
  rationale: Das Imperfekt beschreibt hier eine gewohnheitsmäßig wiederholte Handlung in der Vergangenheit.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: die Töchter Israels
  rationale: Die formnahe Wendung bewahrt den hebräischen Ausdruck, ohne Alter oder Familienstand näher festzulegen.
- source_word: לְתַנּוֹת
  choice: zu gedenken
  rationale: Das seltene Verb ist in diesem Zusammenhang umstritten. „Gedenken“ bezeichnet die jährliche Erinnerungsfeier, ohne vorschnell festzulegen, ob dabei Klage, Lob oder Erzählen im Vordergrund stand.
- source_word: לְבַת יִפְתָּח הַגִּלְעָדִי
  choice: der Tochter Jeftahs, des Gileaditers
  rationale: Die Genitivkonstruktion identifiziert die Tochter und gibt Jeftahs Herkunftsbezeichnung formnah wieder.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: vier Tage im Jahr
  rationale: Die Wendung gibt Dauer beziehungsweise Umfang der jährlich wiederkehrenden Handlung knapp und natürlich wieder.
theological_decisions:
- issue: Art des jährlichen Gedenkens an Jeftahs Tochter
  choice: Im Haupttext steht das offene „gedenken“.
  alternative: „beklagen“, „von ihr erzählen“ oder „sie besingen/preisen“
  rationale: Die Bedeutung des seltenen Verbs ist umstritten und hängt mit der nicht ausdrücklich ausformulierten Deutung des Schicksals von Jeftahs Tochter zusammen. Die Übersetzung bewahrt diese Spannung, statt eine bestimmte Auslegung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Töchter Israels“ bewahrt bewusst die biblische Ausdrucksweise; der Satzbau wurde für gute Verständlichkeit im Deutschen leicht geordnet.
