  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: de
  text: Da kam der Geist Yahwehs über Jiftach. Er zog durch Gilead und Manasse, dann durch Mizpa in Gilead; und von Mizpa in Gilead zog er weiter zu den Ammonitern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zog er zu den Ammonitern hinüber« beziehungsweise »rückte er gegen die Ammoniter vor«. Das hebräische Verb kann je nach Zusammenhang ein Durchqueren, Hinüberziehen oder Vorrücken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה
  choice: Da kam der Geist Yahwehs über Jiftach
  rationale: Die Wendung bezeichnet im Zusammenhang des Richterbuchs die göttliche Befähigung Jiftachs. „Kam … über“ gibt den ereignishaften Charakter wieder, ohne über den Text hinauszugehen.
- source_word: יִפְתָּח
  choice: Jiftach
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Personennamens.
- source_word: וַיַּעֲבֹר אֶת הַגִּלְעָד וְאֶת מְנַשֶּׁה
  choice: Er zog durch Gilead und Manasse
  rationale: עָבַר bezeichnet hier eine Bewegung durch die genannten Gebiete. „Zog durch“ klingt im militärischen Erzählzusammenhang natürlich, ohne bereits einen Angriff auszudrücken.
- source_word: מִצְפֵּה גִלְעָד
  choice: Mizpa in Gilead
  rationale: Die Fügung wird als Ortsname verstanden. „In Gilead“ bezeichnet die Lage idiomatischer als eine starre Wiedergabe mit „von“, ohne den Ortsbezug zu verändern.
- source_word: עָבַר בְּנֵי עַמּוֹן
  choice: zog er weiter zu den Ammonitern
  rationale: Das Verb kann ein Hinüberziehen, Weiterziehen oder Vorrücken bezeichnen. Die gewählte Formulierung bewahrt die Bewegung auf die Ammoniter zu, ohne einen unmittelbaren Angriff ausdrücklich in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Yahweh“ gibt ihn als Eigennamen wieder.
- issue: Bedeutung von רוּחַ יְהוָה
  choice: der Geist Yahwehs
  alternative: der Wind/Hauch Yahwehs
  rationale: Die feste Erzählformel im Richterbuch bezeichnet Gottes befähigenden Geist. Die Übersetzung wahrt diese Aussage, ohne die Art oder Dauer der Befähigung näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Nennung Mizpas in Gilead bleibt erhalten, weil sie die Bewegungsfolge des hebräischen Textes strukturiert; ein Semikolon macht diese Folge im Deutschen gut lesbar.
