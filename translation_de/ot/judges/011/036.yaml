base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: de
  text: 'Da sagte sie zu ihm: »Mein Vater, du hast deinen Mund vor Jahwe aufgetan.[a] Verfahre mit mir nach dem, was aus deinem Mund hervorgegangen ist, nachdem Jahwe für dich Rache an deinen Feinden, den Ammonitern, genommen hat.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »den Mund vor Jahwe auftun« bezeichnet hier das feierliche Aussprechen eines Gelübdes.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »an den Söhnen Ammons«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ אֶל־יְהוָה
  choice: du hast deinen Mund vor Jahwe aufgetan
  rationale: Die konkrete hebräische Redeweise bleibt erhalten; im Zusammenhang bezeichnet sie das feierliche Aussprechen eines Gelübdes vor Jahwe. „Aufgetan“ klingt würdevoll, ohne unverständlich zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲשֵׂה לִי
  choice: Tu mit mir
  rationale: Die Wendung gibt ihre Bereitschaft wieder, die Folgen des Gelübdes an sich vollziehen zu lassen, ohne die umstrittene Art seiner Erfüllung festzulegen.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: wie es aus deinem Mund hervorgegangen ist
  rationale: Die bildhafte Verknüpfung mit dem zuvor geöffneten Mund und die bindende Kraft des gesprochenen Wortes bleiben erhalten.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: nachdem
  rationale: Die Übersetzung bewahrt zunächst den zeitlichen Sinn der hebräischen Verbindung; im Zusammenhang schwingt zugleich eine begründende Bedeutung mit.
- source_word: עָשָׂה לְךָ יְהוָה נְקָמוֹת
  choice: Jahwe für dich Rache … genommen hat
  rationale: Natürliches Deutsch für die hebräische Aussage, dass Jahwe zu ihren Gunsten vergeltend gegen die Feinde gehandelt hat.
- source_word: מִבְּנֵי עַמּוֹן
  choice: an den Ammonitern
  rationale: Die übliche deutsche Volksbezeichnung ist verständlicher als die wörtliche Form „an den Söhnen Ammons“ und bezeichnet klar das Ziel der Vergeltung.
theological_decisions:
- issue: Art der Erfüllung von Jiftachs Gelübde
  choice: Die Worte der Tochter werden wiedergegeben, ohne zu bestimmen, ob das Gelübde ein tatsächliches Opfer oder eine lebenslange Weihe bedeutete.
  alternative: Die Aussage ausdrücklich auf ihren Tod als Opfer oder auf dauernde Jungfräulichkeit und Dienst beziehen.
  rationale: Dieser Vers nennt die konkrete Form der Erfüllung nicht. Die Übersetzung bewahrt deshalb die im Vers bestehende Offenheit und die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Bildsprache vom Mund bleibt bewusst erhalten; „Ammoniter“ wird im Haupttext idiomatisch wiedergegeben. Die Fußnotenmarker wurden den jeweils sachlich passenden Textstellen zugeordnet.
