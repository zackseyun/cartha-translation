    rationale: Die Formulierung »Tu mit mir, wie ...« klingt im modernen Standarddeutsch holprig. »Verfahre mit mir nach dem, was ...« gibt die Aufforderung wieder, ohne die umstrittene konkrete Ausführung des Gelübdes vorwegzunehmen.
  - severity: low
    issue: Unklare beziehungsweise schwerfällige doppelte Ergänzung zu »Rache nehmen«
    rationale: »Rache an deinen Feinden ..., an den Ammonitern« wiederholt die Präposition und kann zwei getrennte Zielgruppen nahelegen. Die Ammoniter sind im Hebräischen eine nähere Bestimmung der Feinde; »deinen Feinden, den Ammonitern« macht dies deutlich.
