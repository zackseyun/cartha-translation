revisions:
- from: 'Da sagte sie zu ihm: »Mein Vater, du hast deinen Mund vor Jahwe aufgetan.[a] Tu mit mir, wie es aus deinem Mund hervorgegangen ist, nachdem Jahwe für dich Rache an deinen Feinden genommen hat, an den Ammonitern.[b]«'
  to: 'Da sagte sie zu ihm: »Mein Vater, du hast deinen Mund vor Jahwe aufgetan.[a] Verfahre mit mir nach dem, was aus deinem Mund hervorgegangen ist, nachdem Jahwe für dich Rache an deinen Feinden, den Ammonitern, genommen hat.[b]«'
  rationale: Die Revision verbessert ausschließlich die moderne deutsche Idiomatik und verdeutlicht die appositionelle Beziehung von »den Ammonitern« zu »deinen Feinden«. Sie erhält die hebräische Mund-Bildsprache, die zeitliche Formulierung sowie die Auslegungsfreiheit hinsichtlich der Erfüllung von Jiftachs Gelübde.
