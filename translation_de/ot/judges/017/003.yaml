base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: de
  text: 'Da gab er seiner Mutter die elfhundert Silberstücke zurück. Seine Mutter sagte: »Ich hatte das Silber aus meinem Besitz[a] Jahwe feierlich für meinen Sohn geweiht, um ein geschnitztes Bild und ein gegossenes Bild[b] anzufertigen. Nun gebe ich es dir zurück.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus meiner Hand«; ein hebräisches Idiom für persönlichen Besitz oder persönliche Verfügung.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »ein Metallbild«. Die beiden hebräischen Bezeichnungen können zwei Bilder meinen oder verschiedene Beschreibungen eines einzigen Bildes sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: gab … zurück
  rationale: Der Hifil von שוב bezeichnet hier das Zurückgeben des zuvor genommenen Silbers; die deutsche Wendung ist natürlich und wahrt den Erstattungssinn.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: die elfhundert Silberstücke
  rationale: Der hebräische Text nennt keine ausdrückliche Gewichtseinheit. »Silberstücke« ist verständlich, ohne vorschnell »Schekel« zu ergänzen.
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: hatte … feierlich … geweiht
  rationale: Infinitivus absolutus und finites Verb verstärken den kultischen Akt. »Feierlich geweiht« gibt sowohl Nachdruck als auch sakrale Aussonderung wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die wörtlich nahe Wiedergabe bewahrt das hebräische Idiom, das persönliche Verfügung, Besitz oder eigenes Handeln ausdrücken kann.
- source_word: לִבְנִי
  choice: für meinen Sohn
  rationale: Das ל bezeichnet hier am ehesten den vorgesehenen Empfänger beziehungsweise Begünstigten.
- source_word: פֶּסֶל
  choice: ein geschnitztes Bild
  rationale: Die Wiedergabe benennt die Herstellungsart konkret und vermeidet sowohl das altertümliche »Schnitzbild« als auch die bereits wertende Übersetzung »Götzenbild«.
- source_word: וּמַסֵּכָה
  choice: und ein gegossenes Bild
  rationale: מסכה bezeichnet hier ein durch Gießen, typischerweise aus Metall, hergestelltes Bild. Die Formulierung bleibt gegenüber der möglichen Beziehung beider Bezeichnungen zueinander offen.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: Nun gebe ich es dir zurück
  rationale: Der Hifil-Imperfekt kann kontextuell gegenwärtig oder unmittelbar zukünftig verstanden werden; die präsentische Wiedergabe passt zur direkten Rede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt den im Ausgangstext ausdrücklich gebrauchten Bundesnamen.
- issue: Weihesprache im Zusammenhang mit der Herstellung von Bildern
  choice: »Jahwe geweiht, um … ein Bild … anzufertigen« ohne erklärende Abschwächung
  alternative: Die Aussage als vermeintlich unechte oder fehlgeleitete Weihe ausdrücklich zu bewerten
  rationale: Der Text stellt kultische Weihe und Bilderherstellung spannungsvoll nebeneinander. Die Übersetzung bewahrt diese theologische Spannung, ohne sie zu harmonisieren.
- issue: Verhältnis von פֶּסֶל und מַסֵּכָה
  choice: zwei durch »und« verbundene Bildbezeichnungen
  alternative: beide Begriffe als ein einziges »geschnitztes, gegossenes Bild« zusammenziehen
  rationale: Die hebräische Koordination lässt offen, ob zwei Gegenstände oder zwei Beschreibungen eines Gegenstands gemeint sind; die formale Verbindung wird deshalb erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, während »gab … zurück« und »Silberstücke« idiomatisch verständlich sind. Das markierte hebräische Idiom »aus meiner Hand« wird bewusst erhalten und ist im Zusammenhang hinreichend transparent.
