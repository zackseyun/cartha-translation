revisions:
- from: 'Da gab er seiner Mutter die elfhundert Silberstücke zurück. Seine Mutter sagte: »Ich hatte das Silber feierlich aus meiner Hand für meinen Sohn Jahwe geweiht, um ein geschnitztes Bild und ein gegossenes Bild[a] anzufertigen. Nun gebe ich es dir zurück.«'
  to: 'Da gab er seiner Mutter die elfhundert Silberstücke zurück. Seine Mutter sagte: »Ich hatte das Silber aus meinem Besitz[a] Jahwe feierlich für meinen Sohn geweiht, um ein geschnitztes Bild und ein gegossenes Bild[b] anzufertigen. Nun gebe ich es dir zurück.«'
  rationale: Die Revision ordnet die Satzglieder so, dass Jahwe eindeutig der Empfänger der Weihung ist, und überträgt das Idiom „aus meiner Hand“ idiomatisch, ohne dessen Wortlaut oder Deutungsspielraum zu verbergen. Die Koordination der beiden Bildbezeichnungen bleibt erhalten; die Fußnote wahrt die sachliche lexikalische Alternative und die offene Referenzfrage.
