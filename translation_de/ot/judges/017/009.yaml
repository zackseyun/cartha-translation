base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: de
  text: 'Micha fragte ihn: „Woher kommst du?“ Er antwortete ihm: „Ich bin ein Levit aus Bethlehem in Juda und bin unterwegs, um als Fremder zu wohnen, wo immer ich einen Platz finde.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wo immer ich finde“. Das Hebräische lässt unausgesprochen, was er zu finden hofft. „Als Fremder wohnen“ kann einen vorläufigen Aufenthalt als ortsfremder oder abhängiger Bewohner bezeichnen.'
    reason: Die Ergänzung „einen Platz“ wird offengelegt; die mögliche soziale und vorläufige Nuance von לָגוּר wird erläutert, ohne individuellen fehlenden Landbesitz zu behaupten.
lexical_decisions:
- source_word: מֵאַיִן
  choice: Woher kommst du?
  rationale: Die Frage zielt auf die Herkunft. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt die Bewegungsbedeutung von תָּבוֹא.
- source_word: לֵוִי
  choice: ein Levit
  rationale: Die Bezeichnung benennt die Zugehörigkeit zu Levi; bei der Selbstvorstellung ist der unbestimmte Artikel im Deutschen idiomatisch.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: aus Bethlehem in Juda
  rationale: Gemeint ist Bethlehem im Gebiet Juda. „In Juda“ unterscheidet den Ort klar und natürlich von anderen gleichnamigen Orten.
- source_word: הֹלֵךְ
  choice: bin unterwegs
  rationale: Das Partizip bezeichnet eine gegenwärtige, fortdauernde Bewegung. „Bin unterwegs“ gibt dies natürlich wieder, ohne die Reiseart festzulegen.
- source_word: לָגוּר
  choice: um als Fremder zu wohnen
  rationale: גור bezeichnet häufig das Wohnen ohne erblichen Landbesitz beziehungsweise als ortsfremder oder abhängiger Bewohner. Die Wendung bewahrt diese soziale Nuance besser als das möglicherweise dauerhaft klingende „sich niederlassen“.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: wo immer ich einen Platz finde
  rationale: Die hebräische Formulierung ist offen und lässt das Objekt von „finden“ unausgesprochen. „Einen Platz“ wird für natürliches Deutsch ergänzt und die Unbestimmtheit durch „wo immer“ bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; die hebräische Wiederholung „er sagte zu ihm“ wird idiomatisch als „er antwortete ihm“ wiedergegeben.
