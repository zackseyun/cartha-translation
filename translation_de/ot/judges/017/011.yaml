  text: וַ/יּ֥וֹאֶל הַ/לֵּוִ֖י לָ/שֶׁ֣בֶת אֶת הָ/אִ֑ישׁ וַ/יְהִ֤י הַ/נַּ֨עַר֙ ל֔/וֹ כְּ/אַחַ֖ד מִ/בָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: de
  text: So erklärte sich der Levit bereit, bei dem Mann zu bleiben,[a] und der junge Mann wurde ihm wie einer seiner Söhne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „willigte ein, bei dem Mann zu wohnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Der junge Mann wurde ihm wie einer seiner Söhne.“ Gemeint ist eine sohnähnliche Stellung in Michas Haushalt.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: erklärte sich bereit
  rationale: Das Hifil von יאל bezeichnet hier Bereitschaft bzw. Zustimmung. „Erklärte sich bereit“ ist natürliches modernes Deutsch und bewahrt beide Bedeutungsaspekte.
- source_word: הַלֵּוִי
  choice: der Levit
  rationale: Der bestimmte Ausdruck verweist auf den bereits eingeführten Leviten; „Levit“ ist die übliche präzise Bezeichnung.
- source_word: לָשֶׁבֶת
  choice: zu bleiben
  rationale: ישׁב kann sitzen, wohnen oder bleiben bedeuten. Im Zusammenhang mit der Annahme des Angebots drückt „bleiben“ den Aufenthalt beim Mann idiomatisch aus.
- source_word: אֶת הָאִישׁ
  choice: bei dem Mann
  rationale: אֵת bezeichnet bei ישׁב hier Gemeinschaft bzw. Aufenthalt bei einer Person. Das deutsche „bei“ gibt diese Beziehung natürlich wieder.
- source_word: וַיְהִי
  choice: wurde
  rationale: היה beschreibt hier den eintretenden beziehungsweise daraus folgenden Zustand; „wurde“ bildet diese Entwicklung knapp ab.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר kann einen Jungen, jungen Mann oder Diener bezeichnen. Da der Levit selbstständig handelt, passt „junger Mann“ am besten.
- source_word: כְּאַחַד מִבָּנָיו
  choice: wie einer seiner Söhne
  rationale: Die Vergleichspartikel כ wird ausdrücklich mit „wie“ wiedergegeben; die Formulierung bewahrt den familiären Vergleich, ohne eine tatsächliche Adoption zu behaupten.
theological_decisions:
- issue: Art des familiären Verhältnisses
  choice: „wie einer seiner Söhne“ als Vergleich beibehalten
  alternative: „als einen seiner Söhne“ beziehungsweise eine ausdrückliche Aufnahme als Sohn
  rationale: Der hebräische Text verwendet die Vergleichspartikel כ und bezeichnet daher eine sohnähnliche Stellung, ohne rechtliche Adoption oder biologische Sohnschaft festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfolge und der Vergleich bleiben weitgehend sichtbar; „bei dem Mann bleiben“ ist gegenüber einem steifen „mit dem Mann wohnen“ idiomatischer.
