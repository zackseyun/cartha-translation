  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: de
  text: Es gab einen jungen Mann aus Betlehem in Juda, aus der Sippe Judas[a]. Er war ein Levit und hielt sich dort als Fremder auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Familie Judas“. Das hebräische Wort kann einen Familien- oder Sippenverband bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wohnte dort“ beziehungsweise „hielt sich dort auf“. Das hebräische Verb bezeichnet häufig das Wohnen oder Verweilen als Ortsfremder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Es gab
  rationale: Die Form führt eine neue Person in die Erzählung ein. „Es gab“ gibt dies natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: נַעַר
  choice: junger Mann
  rationale: Das Wort kann je nach Zusammenhang einen Jungen, Jugendlichen, jungen Mann oder Diener bezeichnen. Hier steht nicht eine Dienerfunktion, sondern die Person und ihre Herkunft im Vordergrund.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: aus Betlehem in Juda
  rationale: „Juda“ bestimmt hier die Lage Betlehems und unterscheidet den Ort von einem anderen Betlehem. „In Juda“ ist im modernen Deutsch klar und natürlich.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: aus der Sippe Judas
  rationale: מִשְׁפָּחָה bezeichnet häufig einen Familien- oder Sippenverband. „Sippe“ wahrt die soziale beziehungsweise genealogische Aussage genauer als das weiter gefasste „Stamm“.
- source_word: לֵוִי
  choice: ein Levit
  rationale: Die knappe Personenbezeichnung entspricht dem hebräischen Ausdruck und lässt die Spannung zur unmittelbar zuvor genannten Zugehörigkeit zu Juda bestehen.
- source_word: גָר שָׁם
  choice: hielt sich dort als Fremder auf
  rationale: גור bezeichnet das Wohnen oder Verweilen an einem Ort, an dem man nicht ursprünglich beheimatet ist. Die Formulierung gibt diesen Fremdlingscharakter verständlich wieder, ohne einen besonderen Rechtsstatus festzulegen.
theological_decisions:
- issue: Spannung zwischen der Zugehörigkeit zur Sippe Judas und der Bezeichnung als Levit
  choice: Beide Angaben stehen unverändert nebeneinander.
  alternative: Die Angabe zu Juda ausschließlich geografisch oder sozial deuten und entsprechend glätten.
  rationale: Der hebräische Text nennt unmittelbar nacheinander sowohl die Sippe Judas als auch die levitische Identität. Die Übersetzung bewahrt diese Spannung, statt sie durch eine harmonisierende Paraphrase aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze halten den erzählerischen Charakter fest; „als Fremder“ bewahrt den Bedeutungsgehalt von גור, ohne das altertümliche „weilen“ oder den fachsprachlichen Ausdruck „Beisasse“ zu verwenden.
