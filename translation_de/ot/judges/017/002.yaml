base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: de
  text: 'Er sagte zu seiner Mutter: »Die elfhundert Silberstücke, die dir weggenommen wurden und derentwegen du einen Fluch ausgesprochen und auch vor meinen Ohren davon geredet hast[a] – sieh, das Silber ist bei mir; ich habe es genommen.« Da sagte seine Mutter: »Mein Sohn sei von Jahwe gesegnet!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch bedeuten, dass sie einen Eid oder eine eidliche Beschwörung ausgesprochen hatte; hier legt der Zusammenhang einen Fluch nahe.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Gesegnet mein Sohn für/von Jahwe«; die knappe hebräische Segensformel lässt die Beziehung zu Jahwe unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: die elfhundert Silberstücke
  rationale: Die Einheit wird im Hebräischen nicht ausdrücklich genannt. »Silberstücke« gibt den quantifizierten Silberbetrag natürlich wieder, ohne »Schekel« zu ergänzen.
- source_word: לֻקַּח לָךְ
  choice: die dir weggenommen wurden
  rationale: Das passive Verb bedeutet zunächst »genommen/weggenommen werden«; »gestohlen« wäre im Kontext plausibel, aber ausdrücklicher als der Wortlaut.
- source_word: וְאַתִּי אָלִית
  choice: derentwegen du einen Fluch ausgesprochen hast
  rationale: אלה kann einen Fluch oder eine eidliche Beschwörung bezeichnen. Der Erzählzusammenhang spricht eher für einen gegen den Täter ausgesprochenen Fluch; die Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: und auch vor meinen Ohren davon geredet hast
  rationale: Die konkrete hebräische Wendung »in meinen Ohren« wird in einer verständlichen deutschen Form erhalten und zeigt, dass der Sohn es selbst hörte.
- source_word: הִנֵּה
  choice: sieh
  rationale: Der Aufmerksamkeitsmarker wird knapp und gegenwärtig wiedergegeben, ohne das altertümlichere »siehe«.
- source_word: הַכֶּסֶף אִתִּי
  choice: das Silber ist bei mir
  rationale: Dies folgt eng und zugleich idiomatisch der hebräischen Besitzkonstruktion.
- source_word: אֲנִי לְקַחְתִּיו
  choice: ich habe es genommen
  rationale: Das ausdrücklich gesetzte Pronomen betont das Geständnis; im Deutschen trägt das eigenständige »ich« in diesem Zusammenhang die notwendige Hervorhebung.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: Mein Sohn sei von Jahwe gesegnet
  rationale: Die kompakte nominale Segensformel wird als natürlicher deutscher Wunschsatz wiedergegeben. Die Präposition ל kann hier die Beziehung zu Jahwe beziehungsweise ihn als Segensgeber anzeigen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; »Jahwe« bewahrt seine Funktion als Eigenname.
- issue: Bedeutung von אלה in der Aussage der Mutter
  choice: einen Fluch ausgesprochen
  alternative: einen Eid geschworen / eine eidliche Beschwörung ausgesprochen
  rationale: Das Wort kann sowohl einen Fluch als auch einen Eid beziehungsweise eine Beschwörung bezeichnen. Der Verlustkontext legt einen Fluch gegen den Täter nahe, ohne die andere Möglichkeit auszuschließen.
- issue: Beziehung des Segens zu Jahwe in לַיהוָה
  choice: von Jahwe gesegnet
  alternative: Jahwe geweiht / für Jahwe gesegnet
  rationale: Im Zusammenhang ist die Wendung am ehesten eine Segensformel, in der Jahwe als Segensgeber verstanden wird. Die knappe hebräische Konstruktion erlaubt jedoch mehr als eine relationale Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Direkte Rede bleibt lebendig; »Silberstücke« vermeidet eine nicht ausdrücklich genannte Gewichtseinheit. Die Gottesbezeichnung wird als »Jahwe« transliteriert. Alle Fußnotenmarker stehen im Haupttext.
