  text: וַֽ/יְהִי אִ֥ישׁ מֵֽ/הַר אֶפְרָ֖יִם וּ/שְׁמ֥/וֹ מִיכָֽיְהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: de
  text: Es gab einen Mann aus dem Bergland Ephraim, und sein Name war Michajehu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Name mit „Micha“ wiedergegeben. Im Hebräischen steht hier die Form „Michajehu“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Es gab
  rationale: Die Erzählform mit היה führt eine neue Handlungseinheit und eine Person ein. „Es gab“ gibt dies in natürlichem modernem Deutsch wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „Nun“ einzufügen.
- source_word: אִישׁ
  choice: einen Mann
  rationale: אִישׁ bezeichnet hier schlicht eine männliche Einzelperson; eine Wiedergabe wie „einen gewissen Mann“ würde eine nicht ausdrücklich markierte Bestimmtheit hinzufügen.
- source_word: מֵהַר אֶפְרָיִם
  choice: aus dem Bergland Ephraim
  rationale: הַר bezeichnet hier die mit Ephraim verbundene gebirgige Region, nicht einen einzelnen Berg. „Bergland Ephraim“ ist geografisch treffend und im Deutschen geläufig.
- source_word: וּשְׁמוֹ
  choice: und sein Name war
  rationale: Die koordinierte Form des Hebräischen wird bewahrt; zugleich bleibt die Formulierung klar und natürlich.
- source_word: מִיכָיְהוּ
  choice: Michajehu
  rationale: „Michajehu“ bildet die in diesem Vers belegte hebräische Namensform nach deutschen Umschriftgewohnheiten ab, statt sie durch die traditionelle Kurzform „Micha“ zu ersetzen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die hebräische Satzverknüpfung bleibt erhalten; ein zusätzlicher Diskursmarker wie „Nun“ wird vermieden. Der Fußnotenmarker steht unmittelbar beim erläuterten Namen.
