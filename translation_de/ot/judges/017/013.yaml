source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: de
  text: 'Da sagte Micha: „Nun weiß ich, dass Jahwe mir Gutes tun wird, weil ich den Leviten[a] als Priester habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Leviten“. Im Hebräischen steht der bestimmte Artikel („den Leviten“); er kann sich auf den bereits eingeführten Leviten beziehen. Im Deutschen ist auch die unbestimmte Wiedergabe möglich, wenn seine levitische Herkunft als für Michas Schlussfolgerung bedeutsam hervorgehoben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: מִיכָה
  choice: Micha
  rationale: Die im Deutschen übliche Form des hebräischen Personennamens.
- source_word: עַתָּה יָדַעְתִּי
  choice: Nun weiß ich
  rationale: Das Perfekt bezeichnet hier einen erreichten Erkenntniszustand; das deutsche Präsens gibt diesen im Kontext natürlich wieder.
- source_word: כִּי
  choice: dass
  rationale: Das erste כִּי leitet den Inhalt dessen ein, was Micha nun zu wissen meint.
- source_word: יֵיטִיב
  choice: Gutes tun wird
  rationale: Das Hifil von יטב bedeutet, jemandem Gutes zu tun oder gut mit ihm zu verfahren; die Wiedergabe vermeidet die engere Festlegung auf materiellen Wohlstand.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: לִי
  choice: mir
  rationale: Der Präpositionalausdruck bezeichnet den Begünstigten und entspricht idiomatisch „mir Gutes tun“.
- source_word: כִּי
  choice: weil
  rationale: Das zweite כִּי nennt den Grund für Michas Zuversicht.
- source_word: הָיָה לִי
  choice: ich ... habe
  rationale: Die hebräische Konstruktion bezeichnet Besitz beziehungsweise eine bestehende Zuordnung; „ich habe“ ist die natürliche deutsche Entsprechung.
- source_word: הַלֵּוִי
  choice: den Leviten
  rationale: Der bestimmte Artikel wird bewahrt und verweist wahrscheinlich auf den zuvor eingeführten Leviten. Da zugleich dessen Zugehörigkeit zum Stamm Levi der Grund für Michas Schlussfolgerung ist, wird die mögliche klassifizierende Nuance in einer Fußnote genannt.
- source_word: לְכֹהֵן
  choice: als Priester
  rationale: Die Präposition לְ bezeichnet hier Amt oder Funktion; „als Priester“ ist im Deutschen klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Transliteration „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Michas Erwartung göttlicher Gunst
  choice: als Aussage Michas ohne bestätigende Wertung wiedergegeben
  alternative: die Erwartung ausdrücklich als richtig oder irrig kennzeichnen
  rationale: Der Vers berichtet Michas Schlussfolgerung, ohne sie hier ausdrücklich theologisch zu bestätigen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Moderner, würdiger Standardstil. „Da sagte“ sorgt für natürlichen Erzählfluss; „mir Gutes tun“ bleibt nah an der hebräischen Aussage, ohne sie auf materiellen Erfolg einzuengen.
