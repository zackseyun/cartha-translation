base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: de
  text: Der Mann zog aus der Stadt, aus Betlehem in Juda, fort, um als Fremder zu wohnen, wo immer er einen Platz fände. Er kam ins Bergland Ephraim bis zum Haus Michas, um seinen Weg fortzusetzen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um seinen Weg zu machen“. Möglich ist auch: „während er unterwegs war“.'
    reason: Die hebräische Wendung לַעֲשׂוֹת דַּרְכּוֹ ist idiomatisch. Die Übersetzung gibt die naheliegende Zwecknuance wieder, während die Fußnote die mögliche begleitende Bedeutung offenhält.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: zog … fort
  rationale: Das narrative Verb הלך bezeichnet hier das Aufbrechen und Fortziehen; die deutsche Wendung gibt die Bewegung vom Ausgangsort natürlich wieder.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der Vers verwendet ausdrücklich אִישׁ, nicht die im Kontext mögliche genauere Bezeichnung „junger Mann“ oder „Levit“.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: aus der Stadt, aus Betlehem in Juda
  rationale: Die wiederholte Herkunftsangabe des Hebräischen bleibt erkennbar. „Stadt“ entspricht עִיר; „in Juda“ gibt die geografische Zuordnung idiomatisch wieder.
- source_word: לָגוּר
  choice: um sich als Fremder niederzulassen
  rationale: גור bezeichnet den Aufenthalt beziehungsweise die Niederlassung eines Menschen, der am Ort nicht beheimatet ist. „Als Fremder“ bewahrt diese Nuance, ohne die Dauer genauer festzulegen.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: wo immer er einen Platz fände
  rationale: Das nicht ausdrücklich genannte Objekt von „finden“ wird im Deutschen als „einen Platz“ ergänzt; der offene, suchende Charakter der Formulierung bleibt durch „wo immer“ und den Konjunktiv erhalten.
- source_word: הַר אֶפְרַיִם
  choice: das Bergland Ephraim
  rationale: Die Wortgruppe bezeichnet die Bergregion Ephraims und nicht einen einzelnen Berg.
- source_word: עַד בֵּית מִיכָה
  choice: bis zum Haus Michas
  rationale: עַד bezeichnet hier den erreichten Endpunkt beziehungsweise die Reichweite der Bewegung.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: auf seinem Weg
  rationale: Die wörtliche Wendung „seinen Weg machen“ beschreibt idiomatisch das Unterwegssein beziehungsweise die Fortsetzung einer Reise. Die knappe deutsche Fassung ist natürlich; die mögliche Zwecknuance wird in der Fußnote offengehalten.
