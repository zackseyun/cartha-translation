  terminology: „Betlehem“, „Juda“, „Bergland Ephraim“ und „Haus Michas“ sind angemessen. „Als Fremder wohnen“ wahrt die für גּוּר relevante Außenstehenden- bzw. Aufenthaltsnuance besser, ohne eine bestimmte Aufenthaltsdauer festzulegen.
