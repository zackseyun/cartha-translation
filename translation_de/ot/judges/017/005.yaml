base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: de
  text: Der Mann Micha hatte eine Kultstätte[a]. Er fertigte ein Efod und Hausgötzen an und setzte einen seiner Söhne als Priester ein[b]; dieser wurde sein Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Haus Gottes“, „ein Haus eines Gottes“ oder „ein Haus von Göttern“; die Wendung kann ein Heiligtum, möglicherweise ein privates Heiligtum, bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „füllte die Hand eines seiner Söhne“ – eine hebräische Wendung für die Einsetzung oder Weihe zum Priesterdienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: eine eigene Kultstätte
  rationale: Die Wendung bezeichnet hier im Zusammenhang mit Efod und Terafim Michas privaten Kultraum. „Kultstätte“ gibt die Funktion natürlich wieder, ohne die Einrichtung als rechtmäßiges Heiligtum auszuweisen; die wörtlichere und mehrdeutige Form wird in der Fußnote genannt.
- source_word: אֵפוֹד
  choice: Efod
  rationale: Für diesen kultischen Gegenstand beziehungsweise dieses kultische Kleidungsstück gibt es keine eindeutige moderne deutsche Entsprechung; die etablierte Umschrift bewahrt die sachliche Unbestimmtheit.
- source_word: תְרָפִים
  choice: Hausgötzen
  rationale: Das Wort bezeichnet häusliche Kultbilder. „Hausgötzen“ ist verständlich und gibt sowohl ihren häuslichen Gebrauch als auch ihren Bildcharakter wieder.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: setzte … als Priester ein
  rationale: Die hebräische Wendung bedeutet wörtlich „die Hand füllen“ und bezeichnet die Einsetzung beziehungsweise Weihe zum Priesterdienst. Die gewählte Formulierung ist idiomatisches modernes Deutsch und vermeidet unnötig konfessionelle Fachsprache.
- source_word: אַחַד מִבָּנָיו
  choice: einen seiner Söhne
  rationale: Die partitive Konstruktion wird direkt wiedergegeben; das ausdrücklich männliche „Söhne“ bleibt erhalten.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: dieser wurde sein Priester
  rationale: „Wurde“ wahrt den resultativen Sinn von וַיְהִי; „dieser“ macht eindeutig, dass der eingesetzte Sohn gemeint ist.
- source_word: וְהָאִישׁ מִיכָה
  choice: Der Mann Micha
  rationale: Die Wiedergabe erhält den bestimmten Ausdruck „der Mann“ und den Namen, ohne ein zeitliches „nun“ einzuführen, das im Hebräischen nicht ausdrücklich steht.
theological_decisions:
- issue: Ob בֵּית אֱלֹהִים als rechtmäßiges „Haus Gottes“ oder als private Kultstätte zu verstehen ist
  choice: eine eigene Kultstätte
  alternative: 'ein Gotteshaus / ein Haus Gottes (oder: einer Gottheit)'
  rationale: Der unmittelbare Zusammenhang beschreibt eine private, unregelmäßige Kulteinrichtung mit Efod, Terafim und einem von Micha selbst eingesetzten Priester. „Kultstätte“ gibt diese Funktion wieder, ohne die Einrichtung theologisch als legitim zu beurteilen. Die Fußnote bewahrt die mögliche wörtlichere Deutung von אֱלֹהִים.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze sorgen für Verständlichkeit; „Efod“ bleibt als historischer Fachbegriff stehen. „Kultstätte“ und „setzte … als Priester ein“ vermeiden sowohl altertümliche als auch konfessionell eng gefasste Ausdrucksweisen.
