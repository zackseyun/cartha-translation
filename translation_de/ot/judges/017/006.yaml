  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: de
  text: In jenen Tagen gab es keinen König in Israel. Jeder tat, was in seinen eigenen Augen richtig war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Die geläufige Erzählformel gibt den rückblickenden zeitlichen Rahmen natürlich und würdig wieder.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: gab es keinen König in Israel
  rationale: Die Existenzverneinung אֵין bezeichnet schlicht das Fehlen eines Königs; diese Formulierung ist im modernen Deutsch idiomatisch.
- source_word: אִישׁ
  choice: Jeder
  rationale: Das maskuline Singularwort wird hier distributiv und repräsentativ gebraucht. „Jeder“ bewahrt diese Struktur, ohne den Sinn unnötig auf erwachsene Männer einzuengen.
- source_word: הַיָּשָׁר
  choice: was … richtig war
  rationale: יָשָׁר bezeichnet hier das nach dem eigenen Urteil Richtige; die deutsche Wendung ist natürlich und erhält den wertenden Sinn.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Die hebräische Redewendung bezeichnet das subjektive eigene Urteil. „eigenen“ macht den reflexiven Nachdruck im Deutschen deutlich.
- source_word: יַעֲשֶׂה
  choice: tat
  rationale: Der Imperfekt drückt in diesem zusammenfassenden Erzählkontext gewohnheitsmäßiges Handeln in der Vergangenheit aus; das deutsche Präteritum gibt dies knapp wieder.
theological_decisions:
- issue: Erzählerische Bewertung des Zustands Israels, ohne das Königtum ausdrücklich als uneingeschränktes theologisches Ideal festzulegen
  choice: Die Aussage bleibt beschreibend formuliert und lässt die negative Wertung durch „was in seinen eigenen Augen richtig war“ hervortreten.
  alternative: Den Satz entweder als rein neutrale historische Notiz oder als ausdrückliches Plädoyer für die Monarchie wiederzugeben.
  rationale: Der wiederkehrende Kehrvers im Richterbuch kennzeichnet literarisch gesellschaftliche und religiöse Unordnung. Die Übersetzung bewahrt diese Spannung, ohne eine politische Theologie hinzuzufügen, die der Vers selbst nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Erzählprosa. Die Satzstruktur bleibt nahe am Hebräischen, klingt aber natürlich; „Jeder“ gibt den repräsentativ-distributiven Gebrauch von אִישׁ angemessen wieder.
