  text: וַ/יְמַלֵּ֤א מִיכָה֙ אֶת יַ֣ד הַ/לֵּוִ֔י וַ/יְהִי ל֥/וֹ הַ/נַּ֖עַר לְ/כֹהֵ֑ן וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: de
  text: Daraufhin setzte Micha den Leviten in sein Amt ein[a]. Der junge Mann wurde sein Priester und war in Michas Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »füllte die Hand des Leviten«; eine hebräische Redewendung für die Einsetzung in den priesterlichen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד הַלֵּוִי
  choice: setzte den Leviten in sein Amt ein
  rationale: Die Wendung »die Hand füllen« ist ein hebräisches Idiom für die Einsetzung in den priesterlichen Dienst. Die funktionale Wiedergabe ist im modernen Deutsch verständlich, ohne die Rechtmäßigkeit der Einsetzung zu behaupten; der wörtliche Ausdruck wird in der Fußnote bewahrt.
- source_word: הַלֵּוִי
  choice: den Leviten
  rationale: Die Bezeichnung ordnet den Mann seiner Stammes- beziehungsweise Sippenzugehörigkeit zu und wird im Deutschen natürlich substantiviert wiedergegeben.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר kann je nach Zusammenhang einen Jungen, Jugendlichen, Diener oder jungen Mann bezeichnen. Da er hier selbstständig als Priester tätig wird, passt »junger Mann« am besten.
- source_word: וַיְהִי לוֹ ... לְכֹהֵן
  choice: wurde sein Priester
  rationale: Die Konstruktion bezeichnet den Übergang in eine Rolle für Micha. »Wurde sein Priester« gibt sowohl den Rollenwechsel als auch die persönliche Zuordnung knapp und natürlich wieder.
- source_word: וַיְהִי בְּבֵית מִיכָה
  choice: blieb in Michas Haus
  rationale: Das Verb היה bezeichnet hier im Zusammenhang den fortdauernden Aufenthalt. »Blieb« ist idiomatischer als ein bloßes »war«, während »in Michas Haus« den räumlich-häuslichen Sinn bewahrt.
theological_decisions:
- issue: Einsetzung in einen privaten Kult, ohne deren Rechtmäßigkeit zu unterstellen
  choice: setzte den Leviten in sein Amt ein
  alternative: weihte den Leviten zum Priester; füllte dem Leviten die Hand
  rationale: Der hebräische Text berichtet Michas Einsetzungshandlung, erklärt sie aber nicht ausdrücklich für legitim. »In sein Amt einsetzen« beschreibt den Vorgang neutraler als »weihen« und vermeidet zugleich die Unverständlichkeit einer unkommentierten wörtlichen Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und erzählerisch flüssig; die auffällige hebräische Amtsidiomatik bleibt durch die Fußnote sichtbar.
