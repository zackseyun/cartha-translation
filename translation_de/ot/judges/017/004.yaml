base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: de
  text: Da gab er seiner Mutter das Silber zurück. Seine Mutter nahm zweihundert Silberstücke[a] und gab sie dem Silberschmied. Der fertigte daraus ein Schnitzbild und ein Gussbild[b] an; es befand sich im Haus Michas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zweihundert Schekel Silber“. Im Hebräischen steht hier nur „zweihundert Silber“; die Maßeinheit wird in diesem Vers nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ein gemeißeltes Bild und ein gegossenes Bild“.'
    reason: lexical_alternative
  - marker: c
    text: Nach „ein Schnitzbild und ein Gussbild“ verwendet der hebräische Text ein Verb im Singular („es war/befand sich“). Möglicherweise werden das angefertigte Werk oder beide Teile als Einheit aufgefasst.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת הַכֶּסֶף לְאִמּוֹ
  choice: Da gab er seiner Mutter das Silber zurück
  rationale: Die Hifilform von שוב bezeichnet hier die Rückgabe; „das Silber“ bewahrt angesichts der anschließenden Verarbeitung den konkreten Stoffbezug von כֶּסֶף.
- source_word: מָאתַיִם כֶּסֶף
  choice: zweihundert Silberstücke
  rationale: Im Hebräischen steht keine ausdrückliche Maßeinheit. „Silberstücke“ ist verständlich, ohne „Schekel“ mit unangezeigter Sicherheit in den Haupttext einzutragen.
- source_word: לַצּוֹרֵף
  choice: dem Silberschmied
  rationale: צֹרֵף kann einen Metallhandwerker oder Läuterer bezeichnen; wegen des verarbeiteten Silbers passt „Silberschmied“ im Kontext am besten.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Der fertigte daraus ... an
  rationale: Das maskuline Subjekt ist am natürlichsten der Silberschmied; „daraus“ gibt den Objektbezug auf das Silber und dessen Verarbeitung wieder.
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: ein Schnitzbild und ein Gussbild
  rationale: Die beiden Herstellungsbezeichnungen werden konkret und ohne zusätzliche wertende Paraphrase wiedergegeben.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: es kam in das Haus Michas
  rationale: Das singularische Verb wird bewahrt. „Kam“ gibt das resultative ויהי in natürlichem Deutsch wieder, ohne aus dem grammatischen Singular einen Plural zu machen.
theological_decisions:
- issue: Explizit abwertende Wiedergabe der Kultbilder
  choice: ein Schnitzbild und ein Gussbild
  alternative: ein Götzenbild und ein gegossenes Götzenbild
  rationale: Der Zusammenhang macht den problematischen kultischen Charakter deutlich, doch die Übersetzung gibt zunächst die konkreten hebräischen Bildbegriffe wieder und fügt keine stärkere theologische Wertung ein.
- issue: Verhältnis der zwei Bildbezeichnungen zum singularischen Schlussverb
  choice: Die zwei Bezeichnungen bleiben nebeneinander stehen; der Singular wird mit „es“ bewahrt.
  alternative: „sie kamen in das Haus Michas“ oder Zusammenfassung zu einem einzigen Bild
  rationale: Der hebräische Text nennt Schnitzbild und Gussbild, verwendet danach aber ein singularisches Verb. Diese Spannung wird nicht durch Harmonisierung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Schnitzbild“ und „Gussbild“ sind präzise und verständlich; die altertümlichen Ausdrücke „geschnitztes Bildnis“ oder „gegossenes Bildnis“ werden vermieden. Die Wiederholung von „seiner Mutter/Seine Mutter“ folgt der ausdrücklichen Wiederaufnahme im Hebräischen.
