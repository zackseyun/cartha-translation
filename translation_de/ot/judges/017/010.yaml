  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: de
  text: 'Micha sagte zu ihm: »Bleib bei mir und sei mir Vater und Priester. Ich werde dir jährlich zehn Silberstücke[a], eine Ausstattung mit Kleidern[b] und deinen Lebensunterhalt geben.« Da ging der Levit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »zehn Silber«; eine Maßeinheit wird nicht genannt. Häufig wird »zehn Schekel Silber« übersetzt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Kleiderzulage« beziehungsweise »einen Satz Kleider«; die hebräische Wendung ist nicht eindeutig.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder dem Zusammenhang nach: »Da ging der Levit hinein« beziehungsweise »mit ihm«. Im Hebräischen steht lediglich »ging«; ein Ziel wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: Bleib bei mir
  rationale: Die Aufforderung lädt den Leviten dazu ein, dauerhaft bei Micha zu wohnen. »Bleib bei mir« ist natürliches modernes Deutsch und bewahrt den Sinn des Verweilens beziehungsweise Wohnens.
- source_word: לְאָב וּלְכֹהֵן
  choice: Vater und Priester
  rationale: »Vater« wird als ausdrückliche soziale und religiöse Ehrenbezeichnung beibehalten, ohne sie als leibliche Vaterschaft zu deuten; כֹהֵן bedeutet eindeutig »Priester«.
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: zehn Silberstücke
  rationale: Der hebräische Text nennt zehn Einheiten Silber, bezeichnet die Einheit aber nicht. »Silberstücke« wahrt diese Unbestimmtheit besser als die traditionelle Ergänzung »Schekel«.
- source_word: לַיָּמִים
  choice: jährlich
  rationale: Die idiomatische Wendung bezeichnet hier eine jährlich gewährte Zahlung.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: eine Ausstattung mit Kleidern
  rationale: Die schwierige Wendung bezeichnet eine bemessene beziehungsweise bereitgestellte Menge Kleidung. Die Formulierung bleibt konkret, lässt aber offen, ob ein Kleidersatz oder eine Kleiderzulage gemeint ist.
- source_word: וּמִחְיָתֶךָ
  choice: und deinen Lebensunterhalt
  rationale: מִחְיָה umfasst Versorgung und Unterhalt und sollte nicht ohne Not auf Nahrung verengt werden.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: Da ging der Levit
  rationale: Das Verb bedeutet formal »gehen«. Da Ziel oder Begleitung nicht ausdrücklich genannt werden, verzichtet der Haupttext auf Zusätze wie »hinein« oder »mit ihm«; die im Kontext mögliche Bedeutung wird in einer Fußnote erläutert.
theological_decisions:
- issue: Die Bezeichnung des Leviten als »Vater« im Zusammenhang mit Michas nicht legitimiertem Heiligtum
  choice: Das Bild »Vater« wörtlich beibehalten
  alternative: Ratgeber; geistlicher Vater
  rationale: Der hebräische Text verwendet ausdrücklich die familiäre Metapher. Ihre Beibehaltung wahrt die soziale und religiöse Spannung des Textes, ohne Michas Kult zu legitimieren oder spätere kirchliche Begrifflichkeit einzutragen.
- issue: Nicht genannte Einheit des Silbers
  choice: Im Haupttext keine Schekel ergänzen
  alternative: zehn Schekel Silber
  rationale: Die Maßeinheit steht nicht im hebräischen Text. »Silberstücke« gibt die unbestimmte Ausdrucksweise verständlich wieder.
- issue: Mehrdeutiger Abschluss וַיֵּלֶךְ
  choice: Die Grundbedeutung »ging« im Haupttext bewahren
  alternative: ging hinein; ging mit; willigte ein
  rationale: Der Zusammenhang kann den Eintritt in Michas Haushalt oder das Mitgehen nahelegen, doch das hebräische Verb selbst nennt weder Ziel noch Zustimmung ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit schlichter direkter Rede. Die ungewöhnliche Ehrenbezeichnung »Vater« und der knappe, mehrdeutige Versschluss werden nicht geglättet; notwendige Erläuterungen stehen in den Fußnoten.
