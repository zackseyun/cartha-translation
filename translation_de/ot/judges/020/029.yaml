  text: וַ/יָּ֤שֶׂם יִשְׂרָאֵל֙ אֹֽרְבִ֔ים אֶל הַ/גִּבְעָ֖ה סָבִֽיב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/029.yaml
  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: de
  text: Darauf stellte Israel rings um Gibea Männer zum Hinterhalt auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Israel stellte Auflauernde zu/gegen Gibea ringsum auf.« Die Gesamtwendung bezeichnet die Aufstellung einer Hinterhaltstruppe im Umkreis der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: legte
  rationale: שׂוּם bedeutet »setzen, stellen, legen«. In Verbindung mit Personen im Hinterhalt gibt »legte … in den Hinterhalt« die konkrete militärische Anordnung natürlich wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier kollektiv das israelitische Heer.
- source_word: אֹרְבִים
  choice: Männer in den Hinterhalt
  rationale: Das Partizip von ארב bezeichnet Personen, die auflauern. Die Formulierung bewahrt den personalen Sinn deutlicher als das abstrakte »einen Hinterhalt«.
- source_word: אֶל … סָבִיב
  choice: rings um
  rationale: אֶל kann »zu, gegen, bei« bedeuten; zusammen mit סָבִיב bezeichnet die Wendung hier die Positionierung im Umkreis von Gibea. »rings um« gibt die räumliche Aussage knapp und idiomatisch wieder.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Der hebräische Ortsname wird in der im Deutschen üblichen biblischen Form wiedergegeben; der hebräische Artikel wird beim Eigennamen nicht eigens übersetzt.
- source_word: סָבִיב
  choice: rings um
  rationale: סָבִיב bezeichnet eine umliegende beziehungsweise umgebende Position.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Darauf« führt die Erzählung flüssig fort; »rings um« erhält die räumliche Betonung des Hebräischen. Die Fußnote macht die ungewöhnliche Verbindung von אֶל und סָבִיב sowie den personalen Sinn von אֹרְבִים sichtbar.
