  to: Darauf stellte Israel rings um Gibea Männer zum Hinterhalt auf.[a]
  rationale: Die Revision ersetzt die etwas sperrige Konstruktion „legte … Männer in den Hinterhalt“ durch eine idiomatische deutsche militärische Formulierung, ohne den personalen Charakter der Auflauernden oder die räumliche Aussage des Hebräischen abzuschwächen. Die Fußnote wurde sprachlich geglättet und hält die im Einzelwort אֶל mögliche Richtungsnuance fest, während sie die kontextuell naheliegende Gesamtbedeutung erklärt.
