  terminology: „Nebenfrau“ ist als historisch-soziale Bezeichnung für פִּילֶגֶשׁ angemessen. „Vergewaltigten“ benennt angesichts des unmittelbaren Kontexts die sexuelle Gewalt klar; die Formulierung „und sie starb“ fügt keine über das Hebräische hinausgehende explizite Kausalrelation hinzu.
