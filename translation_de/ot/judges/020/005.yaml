  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: de
  text: Da erhoben sich die Männer von Gibea gegen mich und umstellten nachts das Haus. Mich wollten sie töten, und meine Nebenfrau vergewaltigten sie, und sie starb.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: die Männer von Gibea
  rationale: Die pluralische Konstruktverbindung bezeichnet hier idiomatisch die männlichen Einwohner beziehungsweise maßgeblichen Männer der Stadt, nicht Adlige oder Eigentümer.
- source_word: וַיָּקֻמוּ עָלַי
  choice: erhoben sich gegen mich
  rationale: Die Wendung קום על drückt feindseliges Vorgehen aus; die deutsche Formulierung bewahrt zugleich das Bild des hebräischen Verbs.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: umzingelten meinetwegen das Haus
  rationale: Das Haus ist das direkte Objekt von סבב. Das wiederholte עָלַי wird mit „meinetwegen“ wiedergegeben und nicht stillschweigend ausgelassen.
- source_word: לָיְלָה
  choice: nachts
  rationale: Der adverbiale Akkusativ bezeichnet den Zeitpunkt; „nachts“ ist knapp und natürlich.
- source_word: אוֹתִי דִּמּוּ לַהֲרֹג
  choice: Mich wollten sie töten
  rationale: דמה mit Infinitiv bezeichnet hier Absicht oder Vorhaben. Die Voranstellung von „Mich“ bildet die Hervorhebung durch אוֹתִי nach.
- source_word: פִּילַגְשִׁי
  choice: meine Nebenfrau
  rationale: „Nebenfrau“ bezeichnet die historisch-soziale Stellung verständlicher als das im heutigen Deutsch teils missverständliche „Konkubine“, ohne sie als unverheiratete Geliebte darzustellen.
- source_word: עִנּוּ
  choice: vergewaltigten
  rationale: Das Piel von ענה kann demütigen oder misshandeln bedeuten; der unmittelbare Erzählkontext in Richter 19–20 macht hier sexuelle Gewalt eindeutig.
- source_word: וַתָּמֹת
  choice: sodass sie starb
  rationale: Die Form führt die Erzählung fort; im Zusammenhang wird ihr Tod als Folge der vorausgehenden Gewalttat dargestellt. Das Deutsche macht diesen Ergebniszusammenhang natürlich kenntlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische sexuelle Gewalt wird klar und ohne beschönigenden Euphemismus benannt. Die ungewöhnliche Doppelung von עָלַי wird soweit möglich erhalten, ohne den deutschen Satz unverständlich zu machen.
