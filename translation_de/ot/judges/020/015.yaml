base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: de
  text: 'An jenem Tag wurden die Söhne Benjamins aus den Städten gemustert[a]: 26.000 Männer, die das Schwert zogen. Außerdem wurden die Einwohner Gibeas gemustert: 700 ausgewählte Männer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gezählt“ oder „zum Kriegsdienst erfasst“. Das hebräische Verb bezeichnet hier das Zählen beziehungsweise Erfassen für den Kriegsdienst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „700 junge Männer“. Das hebräische Wort kann sowohl junge als auch ausgewählte Männer bezeichnen; im militärischen Zusammenhang ist die Wiedergabe „ausgewählte“ naheliegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: wurden … gemustert
  rationale: Das Hitpael von פקד bezeichnet hier das Erfassen beziehungsweise Zählen für den Kriegsdienst. „Mustern“ verbindet den Zählvorgang mit dem militärischen Zusammenhang und wahrt die Wiederholung sinngemäß.
- source_word: בְנֵי בִנְיָמִן
  choice: die Söhne Benjamins
  rationale: Die Formulierung bewahrt das familiär-stammesbezogene Bild des Hebräischen; „Benjaminiter“ wäre natürlicher, aber weniger formnah.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Zeitangabe, die den demonstrativen Nachdruck wiedergibt.
- source_word: מֵהֶעָרִים
  choice: aus den Städten
  rationale: Bezeichnet die Orte, aus denen die erfassten Truppen stammten.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: 26.000 … Männer
  rationale: Direkte Wiedergabe der Zahl und von אִישׁ; der militärische Status ergibt sich aus dem Zusammenhang und der folgenden Wendung.
- source_word: שֹׁלֵף חָרֶב
  choice: mit dem Schwert bewaffnete
  rationale: Die wörtliche Wendung „das Schwert ziehend“ ist eine feste Bezeichnung für kampffähige Bewaffnete. Die gewählte Formulierung gibt ihre Funktion in natürlichem Deutsch wieder und bewahrt das konkrete Schwertmotiv.
- source_word: לְבַד
  choice: Dazu kamen
  rationale: Kennzeichnet die Bewohner von Gibea als zusätzlich zur vorher genannten Zahl gezählte Gruppe.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: die Einwohner von Gibea
  rationale: Natürliche Wiedergabe der substantivierten Partizipialkonstruktion mit ihrem örtlich-bürgerlichen Sinn.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: 700 … Männer
  rationale: Direkte Wiedergabe der Zahlenangabe.
- source_word: בָּחוּר
  choice: ausgewählte
  rationale: Im militärischen Kontext bezeichnet das Wort wahrscheinlich ausgesuchte, kampftüchtige Männer; die mögliche Altersbedeutung wird in der Fußnote offengehalten.
