  text: וַ/יָּבֹאוּ֩ מִ/נֶּ֨גֶד לַ/גִּבְעָ֜ה עֲשֶׂרֶת֩ אֲלָפִ֨ים אִ֤ישׁ בָּחוּר֙ מִ/כָּל יִשְׂרָאֵ֔ל וְ/הַ/מִּלְחָמָ֖ה כָּבֵ֑דָה וְ/הֵם֙ לֹ֣א יָדְע֔וּ כִּֽי נֹגַ֥עַת עֲלֵי/הֶ֖ם הָ/רָעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: de
  text: Da rückten zehntausend ausgewählte Männer aus ganz Israel gegen Gibea vor. Der Kampf war heftig; doch die Benjaminiter wussten nicht, dass das Unheil auf sie zukam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass das Unheil sie berührte/erreichte“; auch möglich: „dass das Unheil sie einholte“.'
    reason: Die ungewöhnliche hebräische Wendung verwendet נגע („berühren, erreichen“) und beschreibt das Unheil als herannahend bzw. die Benjaminiter erreichend.
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: gegen Gibea vor
  rationale: מִנֶּגֶד bezeichnet zunächst eine Stellung gegenüber oder vor einem Ort. Im militärischen Zusammenhang gibt „gegen Gibea vorrücken“ sowohl die räumliche als auch die feindliche Bewegung natürlich wieder.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: zehntausend ausgewählte Männer
  rationale: בָּחוּר bezeichnet hier im militärischen Zusammenhang ausgewählte, kampftüchtige Männer und nicht lediglich junge Männer.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: aus ganz Israel
  rationale: Die Männer waren aus der Gesamtheit Israels ausgewählt worden; die knappe deutsche Form entspricht dem hebräischen Ausdruck.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: Der Kampf war heftig
  rationale: כָּבֵד beschreibt hier die Schwere und Intensität des Kampfes, nicht körperliches Gewicht.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: doch die Benjaminiter wussten nicht
  rationale: Das kontrastive „doch“ ist im Deutschen natürlich. Das im Hebräischen nur durch „sie“ bezeichnete Subjekt wird aus dem Erzählzusammenhang als die Benjaminiter kenntlich gemacht, um eine mögliche Verwechslung mit den unmittelbar zuvor genannten Israeliten zu vermeiden.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: dass das Unheil sie bereits erreichte
  rationale: הָרָעָה meint hier bevorstehendes Unheil, nicht moralisch Böses. Das Partizip נֹגַעַת („berührend/erreichend“) zeichnet das Verderben als unmittelbar herangekommen; „bereits erreichte“ wahrt dieses Bild, ohne den Ausgang ausdrücklich vorwegzunehmen.
theological_decisions: []
