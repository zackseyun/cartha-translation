  register: Modernes, würdiges Standarddeutsch. Kurze, klare Sätze bilden die abrupte Kampfhandlung nach. „Gibea“ folgt der üblichen deutschen Namensform; die explizite Benennung der Benjaminiter dient der referenziellen Klarheit.
