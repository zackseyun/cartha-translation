base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: de
  text: 'Da zogen die Israeliten hinauf und weinten vor Jahwe bis zum Abend. Sie befragten Jahwe: »Soll ich weiterhin[a] zum Kampf gegen die Benjaminiter antreten – gegen meinen Bruder[b]?« Jahwe sagte: »Zieht gegen ihn hinauf!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Soll ich noch einmal zum Kampf gegen die Benjaminiter antreten?« Das hebräische Verb kann sowohl Fortsetzung als auch Wiederholung des Angriffs ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Söhne Benjamins, mein Bruder«. Der Singular »mein Bruder« bleibt trotz der pluralischen Bezeichnung der Benjaminiter erhalten und bezeichnet Benjamin kollektiv als Bruderstamm.'
    reason: grammar_and_corporate_reference
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Da zogen ... hinauf
  rationale: Bewahrt die Richtungsbedeutung von עלה, ohne ein im Vers nicht ausdrücklich genanntes Ziel einzutragen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Gibt die hebräische Volksbezeichnung im modernen Standarddeutsch natürlich wieder; der familiäre Zusammenhang bleibt durch »meinen Bruder« ausdrücklich erhalten.
- source_word: וַיִּבְכּוּ
  choice: weinten
  rationale: Entspricht der Klagebedeutung von בכה in diesem Zusammenhang.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Gibt לִפְנֵי knapp und idiomatisch wieder und bewahrt den Gottesnamen als Eigennamen.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: befragten sie Jahwe
  rationale: »Befragen« lässt den religiös-orakelhaften Sinn der Wendung erkennen und ist natürliches Deutsch.
- source_word: הַאוֹסִיף
  choice: Soll ich noch einmal
  rationale: Der Hifil von יסף kann hier die Wiederholung des bereits unternommenen Angriffs bezeichnen. »Noch einmal« passt zum unmittelbaren Erzählzusammenhang, ohne die alternative Nuance des Fortfahrens auszuschließen.
- source_word: לָגֶשֶׁת לַמִּלְחָמָה
  choice: zum Kampf ... antreten
  rationale: Gibt das Herantreten zur Schlacht in einer natürlichen deutschen militärischen Wendung wieder.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: gegen die Benjaminiter
  rationale: Obwohl עִם grundsätzlich »mit« bedeutet, bezeichnet es im Kampfkontext die gegnerische Partei; »gegen« macht die gemeinte Beziehung im Deutschen eindeutig.
- source_word: אָחִי
  choice: meinen Bruder
  rationale: Bewahrt auffällig den singularischen Sprecherbezug und die Spannung zwischen dem kollektiven Israel und Benjamin als Bruderstamm.
- source_word: עֲלוּ אֵלָיו
  choice: Zieht gegen ihn hinauf
  rationale: Erhält das Bewegungsverb עלה und gibt אֵלָיו im militärischen Zusammenhang als feindliche Hinwendung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; »Jahwe« bewahrt den Charakter als Gottesname.
- issue: Numeruswechsel zwischen der fragenden Gruppe und אָחִי
  choice: »Soll ich ... meinen Bruder«
  alternative: »Sollen wir ... unsere Brüder«
  rationale: Die masoretische Konsonanten- und Vokalüberlieferung hat הַאוֹסִיף und אָחִי in der ersten Person Singular. Die ungewöhnliche kollektive Selbstrede wird daher nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der ungewöhnliche Wechsel von der pluralischen Erzählerreferenz zur ersten Person Singular in der direkten Rede bleibt erhalten. Die militärische Bedeutung wird idiomatisch ausgedrückt, ohne den Bruderkonflikt abzuschwächen.
