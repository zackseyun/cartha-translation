base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: de
  text: 'Die Männer Israels wandten sich wieder gegen die Benjaminiter[a] und schlugen sie mit der Schneide des Schwertes, Stadt für Stadt: Menschen und Vieh, alles, was sie fanden.[b] Auch alle Städte, die sie vorfanden, steckten sie in Brand.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Benjamins“, das heißt die Benjaminiter.'
    reason: Die hebräische Abstammungsformel wird im Haupttext durch die natürliche deutsche Volksbezeichnung wiedergegeben.
  - marker: b
    text: 'Die hebräische Wendung hinter „Stadt für Stadt: Menschen“ ist schwer zu deuten. Gemeint ist wahrscheinlich, dass sie die Bewohner der Städte vollständig niederschlugen, zusammen mit dem Vieh und allem, was sie dort fanden.'
    reason: Die sprachliche Unsicherheit von מֵעִיר מְתֹם soll sichtbar bleiben, ohne den Haupttext unverständlich zu machen.
  - marker: c
    text: 'Wörtlich etwa: „sie sandten sie ins Feuer“.'
    reason: Die Fußnote bewahrt das Bild der hebräischen Redewendung hinter der idiomatischen deutschen Übersetzung.
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Das formal singularische אִישׁ steht bei einem Verb im Plural kollektiv beziehungsweise distributiv. Im militärischen Zusammenhang bezeichnet es die Männer Israels.
- source_word: שָׁבוּ אֶל
  choice: wandten sich wieder gegen
  rationale: שׁוב bezeichnet hier eine Umkehr der Bewegung; wegen der folgenden feindlichen Handlung gibt „gegen“ die Funktion von אֶל im Deutschen angemessen wieder.
- source_word: בְּנֵי בִנְיָמִן
  choice: Benjaminiter
  rationale: Die natürliche deutsche Volksbezeichnung gibt die hebräische Abstammungsformel „Söhne Benjamins“ wieder, ohne ihre Bedeutung zu verändern.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: schlugen sie mit der Schärfe des Schwertes
  rationale: נכה bleibt als „schlagen“ breit wiedergegeben, während die folgende feste Wendung die tödliche Anwendung des Schwertes bezeichnet. „Schärfe“ bewahrt das konkrete Bild der Schwertschneide.
- source_word: מֵעִיר מְתֹם
  choice: Stadt für Stadt
  rationale: Die hebräische Wortfolge ist schwierig. Im Zusammenhang wird sie distributiv als Ausweitung der vollständigen Vernichtung über die Städte verstanden; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: Menschen wie Vieh, alles, was sie fanden
  rationale: Die wiederholte Konstruktion mit עַד erweitert den Umfang bis zum Vieh und zu allem Vorgefundenen. „Menschen“ erschließt den wahrscheinlich gemeinten menschlichen Bezug von מְתֹם im Kontext.
- source_word: כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: alle Städte, auf die sie stießen
  rationale: Das Partizip von מצא bezeichnet hier am natürlichsten die Städte, die die Israeliten vorfanden beziehungsweise erreichten.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: steckten sie in Brand
  rationale: Die hebräische Wendung lautet wörtlich etwa „sie sandten ins Feuer“ und ist idiomatisch als Inbrandsetzen zu verstehen.
