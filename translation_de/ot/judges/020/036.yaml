source:
  edition: WLC
  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: de
  text: Da sahen die Benjaminiter, dass sie besiegt waren. Die Männer Israels waren nämlich vor Benjamin zurückgewichen[a], weil sie sich auf den Hinterhalt[b] verließen, den sie gegen Gibea gelegt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hatten Benjamin Raum gegeben“. Gemeint ist ein bewusstes taktisches Zurückweichen, durch das Benjamin herausgelockt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf die Männer im Hinterhalt“. Das hebräische Wort אֹרֵב kann sowohl den Hinterhalt selbst als auch die dort lauernde Truppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Da sahen sie
  rationale: Die Grundbedeutung von ראה („sehen“) bleibt erhalten; im Zusammenhang schwingt das Erkennen der Niederlage mit.
- source_word: בְנֵי בִנְיָמִן
  choice: die Benjaminiter
  rationale: Die natürliche moderne deutsche Bezeichnung gibt die hebräische Zugehörigkeitsform verständlich wieder.
- source_word: כִּי נִגָּפוּ
  choice: dass sie besiegt waren
  rationale: Das Nifal von נגף bezeichnet hier die militärische Niederlage; „besiegt“ ist präzise und idiomatisch.
- source_word: וַיִּתְּנוּ אִישׁ יִשְׂרָאֵל מָקוֹם לְבִנְיָמִן
  choice: Die Männer Israels waren nämlich vor Benjamin zurückgewichen
  rationale: Die Wendung „Raum geben“ bezeichnet ein taktisches Zurückweichen. Das Plusquamperfekt macht deutlich, dass der Erzähler den zuvor geschilderten Eindruck erklärt.
- source_word: כִּי בָטְחוּ
  choice: weil sie sich … verließen
  rationale: בטח bezeichnet Vertrauen oder Sichverlassen; die deutsche Wendung passt natürlich zu einem militärischen Plan beziehungsweise einer Truppe.
- source_word: אֶל הָאֹרֵב
  choice: auf den Hinterhalt
  rationale: אֹרֵב kann den Hinterhalt als Maßnahme oder die im Hinterhalt liegende Truppe bezeichnen; die Hauptübersetzung wahrt den üblichen kollektiven Sinn.
- source_word: אֲשֶׁר שָׂמוּ אֶל הַגִּבְעָה
  choice: den sie bei Gibea gelegt hatten
  rationale: „Einen Hinterhalt legen“ ist idiomatisches Deutsch; „bei Gibea“ gibt die örtlich beziehungsweise taktisch ausgerichtete Bedeutung von אֶל wieder, ohne sie unnötig festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und das Plusquamperfekt verdeutlichen den erklärenden Rückblick, ohne die knappe Erzählweise des Hebräischen aufzugeben. „Benjaminiter“ ist im Deutschen natürlicher als die formale Wiedergabe „Söhne Benjamins“.
