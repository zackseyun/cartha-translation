  text: וַֽ/יִּפְּלוּ֙ מִ/בִּנְיָמִ֔ן שְׁמֹנָֽה עָשָׂ֥ר אֶ֖לֶף אִ֑ישׁ אֶת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: de
  text: Und von Benjamin fielen 18.000 Mann; sie alle waren tapfere Krieger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: fielen
  rationale: Das Verb נפל bedeutet wörtlich „fallen“ und bezeichnet im Kampfzusammenhang das Fallen im Tod. „Fielen“ bewahrt sowohl das hebräische Bild als auch den militärischen Ton.
- source_word: מִבִּנְיָמִן
  choice: von Benjamin
  rationale: 'Die Präposition מִן kennzeichnet hier Herkunft beziehungsweise Zugehörigkeit: Die Gefallenen gehörten zum Stamm Benjamin.'
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: 18.000 Mann
  rationale: אִישׁ steht ausdrücklich nach der Zahl. Die im Deutschen übliche Zählform „Mann“ gibt dies knapp und natürlich wieder, ohne die militärische Funktion zusätzlich auszudeuten.
- source_word: אֶת כָּל אֵלֶּה
  choice: sie alle
  rationale: Die Wendung fasst die zuvor genannten Gefallenen appositionell zusammen. „Sie alle“ ist im modernen Deutsch natürlicher als das wörtlichere „alle diese“.
- source_word: אַנְשֵׁי חָיִל
  choice: tapfere Krieger
  rationale: Im militärischen Zusammenhang bezeichnet die Wendung kampffähige, tüchtige und mutige Männer. „Tapfere Krieger“ vermittelt Mut und militärische Funktion in natürlichem modernem Deutsch.
theological_decisions: []
