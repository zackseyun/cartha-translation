  text: וְ/כֹ֣ל אִ֣ישׁ יִשְׂרָאֵ֗ל קָ֚מוּ מִ/מְּקוֹמ֔/וֹ וַ/יַּעַרְכ֖וּ בְּ/בַ֣עַל תָּמָ֑ר וְ/אֹרֵ֧ב יִשְׂרָאֵ֛ל מֵגִ֥יחַ מִ/מְּקֹמ֖/וֹ מִ/מַּֽעֲרֵה גָֽבַע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: de
  text: Da erhoben sich alle Männer Israels von ihrem Platz und stellten sich bei Baal-Tamar zum Kampf auf. Und Israels Hinterhalt brach aus seiner Stellung hervor, von Maare-Geba[a] her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Maare-Geba kann als Ortsname verstanden werden. Möglich sind auch beschreibende Wiedergaben wie „von der Lichtung bei Geba“ oder „von der Wiese bei Geba“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: אִישׁ steht zwar im Singular, wird mit כֹל hier jedoch kollektiv beziehungsweise distributiv gebraucht. Im militärischen Zusammenhang ist der Plural im Deutschen natürlich und sachgerecht.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: erhoben sich … von ihrem Platz
  rationale: Das pluralische Verb bezieht sich auf die Gesamtheit der Männer; das singularische Suffix bei „Platz“ ist distributiv zu verstehen. Die Formulierung wahrt die Bewegungsbedeutung von קום.
- source_word: וַיַּעַרְכוּ
  choice: stellten sich … zum Kampf auf
  rationale: ערך bezeichnet im militärischen Kontext das geordnete Aufstellen zur Schlacht. Die deutsche Wendung ist verständlich, ohne über den Text hinauszugehen.
- source_word: בְּבַעַל תָּמָר
  choice: bei Baal-Tamar
  rationale: Der Ausdruck ist als Ortsname zu behandeln; „bei“ gibt den lokativen Gebrauch natürlich wieder.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: die Männer aus Israels Hinterhalt
  rationale: Das substantivierte Partizip bezeichnet den beziehungsweise die im Hinterhalt Liegenden. Die Wiedergabe macht deutlich, dass der Hinterhalt zu Israel gehört, nicht gegen Israel gerichtet ist.
- source_word: מֵגִיחַ
  choice: brachen … hervor
  rationale: Die Form bezeichnet hier das plötzliche Hervorkommen der verborgenen Truppe und erhält die Dynamik des militärischen Geschehens.
- source_word: מִמְּקוֹמוֹ
  choice: von ihrem Platz
  rationale: Das singularische Suffix steht bei der kollektiv bezeichneten Truppe. Der deutsche Pluralbezug ist idiomatisch; zugleich bleibt die Wiederholung von מָקוֹם im Vers sichtbar.
- source_word: מִמַּעֲרֵה גָבַע
  choice: von Maare-Geba her
  rationale: Die schwierige Wortfolge kann als Ortsname verstanden werden. Die Transliteration bewahrt die Unsicherheit; beschreibende Deutungen werden in der Fußnote genannt.
