  text: וַֽ/יִּשְׁלְח֞וּ שִׁבְטֵ֤י יִשְׂרָאֵל֙ אֲנָשִׁ֔ים בְּ/כָל שִׁבְטֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר מָ֚ה הָ/רָעָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר נִהְיְתָ֖ה בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: de
  text: 'Da sandten die Stämme Israels Männer zu allen Sippen Benjamins[a] und sagten: „Was ist das für eine böse Tat[b], die unter euch geschehen ist?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „zu/in allen Stämmen Benjamins“. Gemeint sein können die Sippen oder Stammesgruppen innerhalb Benjamins; die hebräische Präposition kann auch distributiv im Sinn von „durch alle … hindurch“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: Oder „was ist das für ein Unrecht“ beziehungsweise „was ist das für eine Bosheit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Da sandten
  rationale: Das Verb שׁלח bezeichnet hier schlicht das Aussenden. „Da“ gibt die fortlaufende hebräische Erzählweise natürlich wieder.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: die Stämme Israels
  rationale: Die Status-constructus-Verbindung wird direkt und im Deutschen idiomatisch wiedergegeben.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Der Ausgangstext nennt sie wörtlich „Männer“ und bezeichnet sie nicht ausdrücklich als Boten oder Abgesandte.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: zu allen Sippen Benjamins
  rationale: Da Benjamin selbst ein Stamm ist, bezeichnet der ungewöhnliche Plural שִׁבְטֵי hier am ehesten seine inneren Stammesgruppen oder Sippen. „Zu“ versteht die Präposition ב distributiv; die sprachliche Besonderheit und eine weitere Deutung werden in der Fußnote offengelegt.
- source_word: לֵאמֹר
  choice: und ließen sagen
  rationale: Die feste hebräische Redeeinleitung wird in diesem Sendungskontext mit einer natürlichen deutschen Botenformel wiedergegeben.
- source_word: מָה הָרָעָה הַזֹּאת
  choice: Was ist das für eine böse Tat
  rationale: מָה fragt nach der Art des Geschehens. רָעָה bezeichnet hier angesichts des Kontexts nicht nur abstraktes Böses, sondern eine moralisch verwerfliche Tat.
- source_word: אֲשֶׁר נִהְיְתָה בָּכֶם
  choice: die unter euch geschehen ist
  rationale: Der Nifal von היה beschreibt ein eingetretenes Geschehen; בָּכֶם lokalisiert es innerhalb der benjaminitischen Gemeinschaft.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Mehrzahl „Stämme Benjamins“ wird im Haupttext verständlich als „Sippen Benjamins“ wiedergegeben, während die formale und präpositionale Mehrdeutigkeit in der Fußnote erhalten bleibt.
