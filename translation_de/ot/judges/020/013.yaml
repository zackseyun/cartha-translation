source:
  edition: WLC
  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: de
  text: Gebt nun die nichtswürdigen Männer[a] aus Gibea heraus, damit wir sie töten und das Böse aus Israel entfernen. Doch Benjamin wollte nicht auf die Stimme seiner Brüder, der Israeliten, hören[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne der Nichtswürdigkeit“; traditionell: „Söhne Belials“.'
    reason: lexical_alternative
  - marker: b
    text: „Auf die Stimme … hören“ kann hier auch „… gehorchen“ oder „… Folge leisten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: nun
  rationale: Der masoretische Text enthält ausdrücklich וְעַתָּה („und nun/jetzt“). Im Deutschen gibt „nun“ den folgernden Übergang natürlich wieder.
- source_word: תְּנוּ
  choice: Gebt … heraus
  rationale: Im gerichtlichen Zusammenhang wird die Auslieferung der Täter verlangt; „herausgeben“ bewahrt diese Bedeutung idiomatisch.
- source_word: בְּנֵי בְלִיַּעַל
  choice: nichtswürdige Leute
  rationale: Die hebräische Wendung bezeichnet moralisch verkommene Menschen. Diese Wiedergabe ist verständlich und vermeidet, „Belial“ hier vorschnell als Eigennamen zu deuten.
- source_word: וּנְמִיתֵם
  choice: damit wir sie töten
  rationale: Der Kohortativ bezeichnet die beabsichtigte Folge der Auslieferung. „Töten“ gibt das Verb direkt wieder, ohne zusätzliche institutionelle Einzelheiten einzutragen.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: und das Böse aus Israel wegschaffen
  rationale: Die feste gerichtliche Wendung fordert die Beseitigung des Bösen aus der Gemeinschaft; „wegschaffen“ ist klar und bewahrt das Bild des Entfernens.
- source_word: וְלֹא אָבוּ בִנְיָמִן
  choice: Doch Benjamin wollte nicht
  rationale: Der Stammesname steht kollektiv im Singular; die deutsche Form wahrt dies und gibt die verweigerte Bereitschaft wieder.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: auf die Stimme … hören
  rationale: Die konkrete hebräische Redewendung bleibt erhalten; im Kontext kann sie zugleich „gehorchen“ oder „Folge leisten“ bedeuten.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: seiner Brüder, der Israeliten
  rationale: „Brüder“ bewahrt die Verwandtschaftssprache zwischen den Stämmen; „Israeliten“ gibt die erläuternde Apposition natürlich wieder.
theological_decisions:
- issue: Deutung von בְּנֵי בְלִיַּעַל
  choice: nichtswürdige Leute
  alternative: Söhne Belials / Söhne der Nichtswürdigkeit
  rationale: Im vorliegenden Zusammenhang ist die Wendung eine moralische Charakterisierung. Die Übersetzung vermeidet sowohl einen missverständlichen Eigennamen als auch eine im Deutschen unnatürliche wörtliche Formel; die traditionelle Form wird in der Fußnote dokumentiert.
- issue: Gerichtlich-bundestheologische Formel וּנְבַעֲרָה רָעָה
  choice: das Böse aus Israel wegschaffen
  alternative: das Böse aus Israel ausrotten / entfernen
  rationale: Die Formulierung bewahrt das Ziel gemeinschaftlicher Reinigung, ohne die Art der Handlung über den Text hinaus zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verwandtschaftssprache „Brüder“ und die konkrete Hör-Redewendung bleiben erhalten; schwer verständliche hebräische Idiomatik wird im Haupttext natürlich wiedergegeben und in Fußnoten transparent gemacht.
