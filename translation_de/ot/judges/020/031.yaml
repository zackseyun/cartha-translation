  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: de
  text: Da zogen die Söhne Benjamins[a] dem Volk entgegen und wurden von der Stadt fortgelockt[b]. Wie die vorigen Male[c] begannen sie, auf den Straßen – die eine führt hinauf nach Bet-El, die andere nach Gibea durch offenes Gelände[d] – Männer aus dem Volk zu erschlagen, etwa dreißig Israeliten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Benjaminiter“. Wörtlich steht im Hebräischen: „die Söhne Benjamins“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wurden von der Stadt weggezogen“ oder „von der Stadt getrennt“. Gemeint ist, dass sie sich vom Schutz der Stadt entfernen ließen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie zuvor“. Die hebräische Wendung vergleicht den Angriff mit den früheren Kämpfen.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „im Feld“. Die Angabe beschreibt wahrscheinlich die Strecke durch offenes Gelände; ihre genaue syntaktische Zuordnung ist nicht völlig eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Da zogen … entgegen
  rationale: Das Verb bezeichnet das Herausziehen aus der Stadt; zusammen mit לִקְרַאת ergibt sich im Deutschen natürlich „jemandem entgegenziehen“.
- source_word: בְנֵי בִנְיָמִן
  choice: die Söhne Benjamins
  rationale: Die hebräische Verwandtschaftsbezeichnung bleibt erhalten; gemeint sind die Angehörigen des Stammes Benjamin.
- source_word: לִקְרַאת הָעָם
  choice: dem Volk entgegen
  rationale: עָם bezeichnet hier im Zusammenhang das israelitische Aufgebot, doch „Volk“ wahrt die Wortwahl des Erzählers.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: wurden von der Stadt fortgelockt
  rationale: Die passive Form beschreibt die taktische Entfernung der Benjaminiter aus dem Schutzbereich der Stadt. Die zielgerichtete Nuance ergibt sich aus dem unmittelbaren Kontext, bleibt aber in einer Fußnote als lexikalisch weniger ausdrückliche Alternative erkennbar.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת
  choice: begannen sie … zu erschlagen
  rationale: Die Konstruktion bezeichnet den Beginn des Schlagens; חֲלָלִים zeigt hier, dass die Getroffenen getötet wurden.
- source_word: מֵהָעָם חֲלָלִים
  choice: Männer aus dem Volk zu erschlagen
  rationale: מִן ist partitiv, und חֲלָלִים bezeichnet Erschlagene beziehungsweise Gefallene. „Männer“ wird durch die abschließende Zählung mit אִישׁ gestützt.
- source_word: כְּפַעַם בְּפַעַם
  choice: wie die vorigen Male
  rationale: Die idiomatische Wendung vergleicht das Geschehen mit den früheren Kämpfen dieses Kapitels.
- source_word: בַּמְסִלּוֹת
  choice: auf den Straßen
  rationale: מְסִלּוֹת sind angelegte beziehungsweise erhöhte Verkehrswege; „Straßen“ ist im modernen Deutsch klarer und weniger anachronistisch als „Heerstraßen“.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: Die eine Straße führt nach Bet-El hinauf
  rationale: עלה hat hier die übliche topografische Bedeutung des Hinaufführens.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: die andere nach Gibea hinaus ins freie Feld
  rationale: Die Richtungsform bei Gibea und בַּשָּׂדֶה werden räumlich wiedergegeben. Die genaue Zuordnung von „im Feld“ zur Route bleibt in der Fußnote kenntlich.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: etwa dreißig Israeliten
  rationale: Die knappe deutsche Form gibt die ungefähre Zahl und die Zugehörigkeit zu Israel natürlich wieder.
