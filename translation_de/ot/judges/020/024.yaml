  - marker: b
    text: 'Wörtlich: »die Söhne Israels« und »die Söhne Benjamins«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: rückten … vor
  rationale: Das Qal von קרב bezeichnet ein Herankommen oder Sichnähern. Im unmittelbaren militärischen Zusammenhang gibt »rückten … vor« die Bewegung natürlich wieder, ohne bereits ausdrücklich einen Angriff zu behaupten.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich »die Söhne Israels«; hier bezeichnet die Wendung kollektiv die israelitischen Stammestruppen. »Die Israeliten« ist im modernen Deutschen die natürliche Entsprechung.
- source_word: אֶל
  choice: gegen
  rationale: אֶל bedeutet grundsätzlich »zu« oder »auf … zu«. Bei einem militärischen Vorrücken ist »gegen« im Deutschen idiomatisch; die gerichtete Bewegung bleibt dabei erhalten.
- source_word: בְנֵי בִנְיָמִן
  choice: die Benjaminiter
  rationale: Wörtlich »die Söhne Benjamins«; gemeint sind die Angehörigen beziehungsweise Truppen des Stammes Benjamin. »Die Benjaminiter« ist eine klare, natürliche Stammesbezeichnung.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Am zweiten Tag
  rationale: Die hebräische Wendung nennt ausdrücklich den ordinal gezählten »zweiten Tag« und nicht lediglich den nächsten Tag.
