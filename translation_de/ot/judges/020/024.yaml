base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: de
  text: Am zweiten Tag näherten sich die Israeliten den Benjaminitern.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im militärischen Zusammenhang: »Die Israeliten rückten gegen die Benjaminiter vor.«'
