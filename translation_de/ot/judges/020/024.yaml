  register: Modernes, würdiges Standarddeutsch. Die idiomatischen Volks- und Stammesbezeichnungen stehen im Haupttext; die wörtlichen hebräischen Familienbezeichnungen werden in einer Fußnote bewahrt. Die Satzstellung hebt wie im Hebräischen den zweiten Tag als zeitlichen Rahmen hervor.
