  text: וְ/הָ/אֹרֵ֣ב הֵחִ֔ישׁוּ וַֽ/יִּפְשְׁט֖וּ אֶל הַ/גִּבְעָ֑ה וַ/יִּמְשֹׁךְ֙ הָ/אֹרֵ֔ב וַ/יַּ֥ךְ אֶת כָּל הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: de
  text: Da eilten die Männer im Hinterhalt herbei und stürmten gegen Gibea vor. Der Hinterhalt rückte vor[a] und schlug die ganze Stadt mit der Schärfe des Schwertes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Der Hinterhalt zog/streckte sich aus«; das Verb kann ausdrücken, dass die Truppe sich nach vorn ausdehnte oder weiter in die Stadt eindrang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: die Männer im Hinterhalt / der Hinterhalt
  rationale: Das formal singularische Wort bezeichnet hier kollektiv die im Hinterhalt liegende Truppe. Die erste Wiedergabe macht die handelnden Personen deutlich; die zweite greift die knappe Kollektivbezeichnung des Hebräischen auf.
- source_word: הֵחִישׁוּ
  choice: eilten ... herbei
  rationale: Das Verb bezeichnet hastiges, beschleunigtes Handeln und passt zur plötzlichen militärischen Bewegung.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: stürmten gegen ... vor
  rationale: פשׁט kann hier das Ausschwärmen oder den schnellen Angriff einer Truppe bezeichnen; mit אֶל ist eine gegen Gibea gerichtete Vorwärtsbewegung gemeint.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Der Ortsname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וַיִּמְשֹׁךְ
  choice: rückte weiter vor
  rationale: Das Grundwort bedeutet »ziehen«; im knappen militärischen Zusammenhang beschreibt es wahrscheinlich das weitere Vordringen beziehungsweise Sich-Vorstrecken der Hinterhaltstruppe. Die Unsicherheit wird in der Fußnote bewahrt.
- source_word: וַיַּךְ
  choice: schlug
  rationale: Die breite Bedeutung »schlagen« bleibt erhalten; die folgende Schwertformel zeigt, dass tödliche Gewalt gemeint ist.
- source_word: כָּל הָעִיר
  choice: die ganze Stadt
  rationale: Die hebräische Wendung wird formal bewahrt, ohne sie ausdrücklich auf die Einwohner zu verengen.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die feste hebräische Wendung lautet wörtlich »mit dem Mund des Schwertes«. »Mit der Schärfe des Schwertes« bewahrt das Bild in verständlichem Deutsch.
