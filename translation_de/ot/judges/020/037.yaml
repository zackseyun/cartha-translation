  terminology: »Gibea«, »Hinterhalt« und »mit der Schärfe des Schwertes« sind passend. Die letzte Wendung ist eine verständliche, traditionell anschlussfähige Wiedergabe der hebräischen Schwertformel, ohne deren Metaphorik zu stark auszudeuten.
