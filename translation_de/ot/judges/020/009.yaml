  text: וְ/עַתָּ֕ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר נַעֲשֶׂ֖ה לַ/גִּבְעָ֑ה עָלֶ֖י/הָ בְּ/גוֹרָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/009.yaml
  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: de
  text: 'Doch nun wollen wir Folgendes gegen Gibea tun: gegen sie nach dem Los vorgehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen sie durch Losentscheid vorgehen«. Das Hebräische ist knapp und kann bedeuten, dass das Vorgehen gegen Gibea durch das Los bestimmt oder zugeteilt werden soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Kennzeichnet den Übergang vom bisherigen Beschluss zum weiteren Vorgehen und kann hier leicht adversativ verstanden werden.
- source_word: זֶה הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: wollen wir … Folgendes tun
  rationale: Gibt die hebräische Wendung idiomatisch wieder; der Imperfekt bezeichnet im Beratungskontext die beabsichtigte Handlung.
- source_word: לַגִּבְעָה
  choice: mit Gibea
  rationale: Das ל bezeichnet Gibea als Ziel der geplanten Handlung. Die deutsche Wendung »mit Gibea Folgendes tun« lässt die feindliche Ausrichtung erst durch den folgenden Satzteil hervortreten.
- source_word: עָלֶיהָ
  choice: gegen die Stadt
  rationale: על hat im militärischen Zusammenhang feindliche Bedeutung. »Die Stadt« nimmt das grammatisch feminine Pronomen natürlich auf und vermeidet ein missverständliches deutsches »sie«.
- source_word: בְּגוֹרָל
  choice: nach dem Los
  rationale: Bezeichnet eine durch Losentscheid bestimmte oder zugeteilte Vorgehensweise; die knappe Form des Hebräischen bleibt erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ellipse des Hebräischen wird durch das neutrale »soll … vorgegangen werden« verständlich gemacht, ohne ein im Ausgangstext fehlendes Verb wie »hinaufziehen« oder die stärkere Deutung »angreifen« einzusetzen.
