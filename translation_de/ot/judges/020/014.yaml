  text: וַ/יֵּאָסְפ֧וּ בְנֵֽי בִנְיָמִ֛ן מִן הֶ/עָרִ֖ים הַ/גִּבְעָ֑תָ/ה לָ/צֵ֥את לַ/מִּלְחָמָ֖ה עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: de
  text: Da sammelten sich die Benjaminiter aus den Städten in Gibea, um gegen die Israeliten in den Kampf zu ziehen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »mit den Söhnen Israels«; im Zusammenhang des Kampfes bedeutet dies »gegen die Israeliten«.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Söhne Benjamins … gegen die Söhne Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: Da sammelten sich
  rationale: Das Nifal von אסף bezeichnet hier das Zusammenkommen. Die reflexive Formulierung ist im Deutschen natürlich und gibt die Bedeutung präzise wieder.
- source_word: בְנֵי בִנְיָמִן
  choice: die Benjaminiter
  rationale: Die hebräische Stammesbezeichnung bedeutet wörtlich »Söhne Benjamins«; im modernen Deutschen ist »Benjaminiter« klarer und idiomatischer.
- source_word: מִן הֶעָרִים
  choice: aus den Städten
  rationale: Die Präposition מן bezeichnet die Herkunft; »aus den Städten« gibt die Bewegung aus den benjaminitischen Siedlungen treffend wieder.
- source_word: הַגִּבְעָתָה
  choice: in Gibea
  rationale: Das direktionale ה zeigt eine Bewegung nach Gibea an. Nach dem deutschen Verb »sich sammeln« ist »in Gibea« idiomatisch; wörtlicher wäre »nach Gibea«.
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: um ... in den Kampf zu ziehen
  rationale: Die militärische Wendung verbindet יצא mit מלחמה. »In den Kampf ziehen« ist eine natürliche, würdevolle deutsche Entsprechung.
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: gegen die Israeliten
  rationale: Obwohl עִם gewöhnlich »mit« bedeutet, hat es im Zusammenhang eines Kampfes adversative Bedeutung. »Israeliten« gibt die hebräische Volksbezeichnung idiomatisch wieder.
