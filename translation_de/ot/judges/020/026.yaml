source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: de
  text: Da zogen alle Söhne Israels, das ganze Volk, hinauf und kamen nach Bethel. Sie weinten und saßen dort vor Jahwe. An jenem Tag fasteten sie bis zum Abend. Dann brachten sie vor Jahwe Brandopfer und Heilsopfer[a] dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Friedensopfer; auch: Gemeinschaftsopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zogen ... hinauf
  rationale: Bewahrt die Richtungsangabe von עלה und klingt in einem erzählenden Reisekontext natürlich.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: alle Söhne Israels, das ganze Volk
  rationale: „Söhne Israels“ erhält den familial-nationalen Ausdruck des Hebräischen; die Apposition „das ganze Volk“ wahrt die emphatische Wiederaufnahme, ohne im Deutschen ein missverständliches zusätzliches Volk anzudeuten.
- source_word: בֵית אֵל
  choice: Bethel
  rationale: Die im Deutschen übliche Form des Ortsnamens; keine Deutung als „Haus Gottes“ wird in den Text eingetragen.
- source_word: וַיִּבְכּוּ
  choice: sie weinten
  rationale: Gibt das Klagen nach der Niederlage schlicht und präzise wieder.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: sie saßen dort vor Jahwe
  rationale: Bewahrt den konkreten Grundsinn von ישב; „blieben“ wäre ebenfalls möglich, ist hier aber weniger anschaulich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וַיָּצוּמוּ
  choice: fasteten
  rationale: Die übliche und genaue Wiedergabe des Verzichts auf Nahrung als Trauer- und Frömmigkeitshandlung.
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: An jenem Tag ... bis zum Abend
  rationale: Bewahrt die im Hebräischen genannten zeitlichen Grenzen in natürlichem Deutsch.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: brachten ... Brandopfer ... dar
  rationale: עלה bezeichnet in dieser Konstruktion das Darbringen eines Opfers; „darbringen“ ist im Deutschen idiomatisch und würdig.
- source_word: שְׁלָמִים
  choice: Heilsopfer
  rationale: „Heilsopfer“ ist eine etablierte deutsche Wiedergabe von שְׁלָמִים und vermeidet eine zu enge Festlegung auf nur den Friedens- oder Gemeinschaftsaspekt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Umschrift wahrt den Eigennamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Nationale Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die Hauptfassung bewahrt die konkrete familiale Ausdrucksweise des Hebräischen. „Israeliten“ wäre flüssiger, würde diese Bildlichkeit jedoch einebnen.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer / Gemeinschaftsopfer
  rationale: Der Opferbegriff umfasst Frieden, Wohlergehen und Gemeinschaft. „Heilsopfer“ hält diesen Bedeutungsraum vergleichsweise offen; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze entlasten die lange hebräische Verbfolge. Die Wiederholung „alle Söhne Israels, das ganze Volk“ wird appositionell gefasst, um die hebräische Betonung zu erhalten und zugleich natürlich zu klingen.
