source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל הִתְפָּֽקְד֗וּ לְ/בַד֙ מִ/בִּנְיָמִ֔ן אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב כָּל זֶ֖ה אִ֥ישׁ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: de
  text: 'Und die Männer Israels wurden, ohne Benjamin, gemustert: 400.000 Mann, die das Schwert zogen; sie alle waren kriegstüchtige Männer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie alle waren Männer des Krieges.“'
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: אִישׁ steht formal im Singular, wird hier aber wegen des pluralischen Verbs kollektiv gebraucht. Die Wiedergabe bewahrt den männlichen, militärischen Bezug.
- source_word: הִתְפָּקְדוּ
  choice: wurden gemustert
  rationale: Der Hitpael von פקד kann in militärischem Zusammenhang das Zählen beziehungsweise Erfassen zum Kriegsdienst bezeichnen; „gemustert“ verbindet beide Aspekte natürlich.
- source_word: לְבַד מִ/בִּנְיָמִן
  choice: ohne Benjamin
  rationale: Die Wendung schließt Benjamin aus der genannten Gesamtzahl aus. „Ohne Benjamin“ ist knapp und eindeutig.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: 400.000 Mann
  rationale: Das Zahlwort wird im Deutschen idiomatisch mit dem unveränderten Kollektiv „Mann“ verbunden und wahrt den militärischen Zählungscharakter.
- source_word: שֹׁלֵף חָרֶב
  choice: die das Schwert zogen
  rationale: Die wörtlich-bildhafte hebräische Wendung wird erhalten; im Zusammenhang bezeichnet sie bewaffnete, kampffähige Männer.
- source_word: כָּל זֶה אִישׁ מִלְחָמָה
  choice: sie alle waren kriegstüchtige Männer
  rationale: „Sie alle“ gibt den kollektiven Rückbezug von כָּל זֶה natürlich wieder. „Kriegstüchtige Männer“ drückt אִישׁ מִלְחָמָה verständlich und würdig aus, ohne die Aussage durch das modern-institutionelle „Soldaten“ zu verengen.
