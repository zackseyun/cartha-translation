  text: וַ/יָּקֻ֜מוּ וַ/יַּעֲל֣וּ בֵֽית אֵל֮ וַ/יִּשְׁאֲל֣וּ בֵ/אלֹהִים֒ וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֚י יַעֲלֶה לָּ֣/נוּ בַ/תְּחִלָּ֔ה לַ/מִּלְחָמָ֖ה עִם בְּנֵ֣י בִנְיָמִ֑ן וַ/יֹּ֥אמֶר יְהוָ֖ה יְהוּדָ֥ה בַ/תְּחִלָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: de
  text: 'Da erhoben sie sich und zogen nach Bethel hinauf. Dort befragten sie Gott. Die Israeliten sagten: »Wer soll für uns zuerst zum Kampf gegen die Benjaminiter hinaufziehen?« Jahwe[a] antwortete: »Juda zuerst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Häufig wiedergegeben mit »der HERR«; im Hebräischen JHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da brachen sie auf
  rationale: Das Qal-Wayyiqtol von קום führt die Erzählung fort. »Aufbrechen« gibt im Deutschen den Beginn der anschließenden Reise natürlicher wieder als das wörtlichere »aufstehen«.
- source_word: וַיַּעֲלוּ בֵית אֵל
  choice: zogen nach Bethel hinauf
  rationale: עלה bezeichnet das Hinaufgehen beziehungsweise Hinaufziehen und wird hier nicht zum bloßen »gehen« abgeschwächt; בֵית אֵל wird als üblicher Ortsname »Bethel« wiedergegeben.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: Dort befragten sie Gott
  rationale: שׁאל mit ב bezeichnet hier das Einholen göttlicher Weisung. »Gott befragen« ist präzise, natürlich und unterscheidet den Vorgang von einer gewöhnlichen Frage.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste kollektive Bezeichnung bedeutet wörtlich »Söhne Israels«. »Israeliten« bezeichnet im modernen Deutschen das Volk klar und natürlich, ohne den korporativen Sinn zu verändern.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: Wer soll für uns zuerst … hinaufziehen?
  rationale: Die Formulierung bewahrt לָנוּ als »für uns«, עלה als »hinaufziehen« und בַתְּחִלָּה idiomatisch als »zuerst«. Das deutsche »soll« entspricht dem Ersuchen um göttliche Weisung.
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: zum Kampf gegen die Benjaminiter
  rationale: Im Kriegskontext bezeichnet עִם die gegnerische Partei. »Gegen« macht diese Relation eindeutig; »Benjaminiter« gibt die kollektive Wendung »Söhne Benjamins« natürlich wieder.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Jahwe antwortete
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben. »Antwortete« entspricht im Dialogzusammenhang dem Sinn von אמר, ohne zusätzliche Aussage einzuführen.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: Juda zuerst
  rationale: Die knappe, elliptische Antwort des Hebräischen bleibt erhalten; eine Ergänzung wie »soll hinaufziehen« ist zum Verständnis nicht nötig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen wieder; die im Deutschen verbreitete Ersatzlesung »der HERR« wird in der Fußnote genannt.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist eine kollektive Volksbezeichnung. Das natürliche deutsche Ethnikon wahrt diesen Sinn, ohne festzulegen, dass ausnahmslos nur leibliche Söhne gemeint seien.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die wiederholte Bewegungsrichtung »hinauf« sowie die knappe göttliche Antwort bleiben erhalten. »Dort« verdeutlicht lediglich den natürlichen Ortsbezug des zweiten Satzes.
