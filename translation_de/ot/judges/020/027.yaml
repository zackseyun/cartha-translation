  source_fidelity: Die Wiedergabe von וַיִּשְׁאֲלוּ בַּיהוָה als „befragten Jahwe“ trifft den hier kultisch-orakulären Sinn gut. „Israeliten“, „Jahwe“, „Bundeslade Gottes“ und „in jenen Tagen/damals“ geben die hebräischen Ausdrücke sachgerecht wieder. Das einleitende וְ bei וְשָׁם bedeutet jedoch zunächst nur „und“; ein ausdrücklich erklärendes oder begründendes „nämlich“ ist im Hebräischen nicht markiert, auch wenn der Satz im Erzählzusammenhang als Einschub gelesen werden kann.
