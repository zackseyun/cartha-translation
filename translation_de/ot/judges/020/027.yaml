  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: de
  text: Und die Israeliten befragten Jahwe – die Bundeslade Gottes befand sich in jenen Tagen dort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“. Gemeint sind die Israeliten als Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  choice: befragten Jahwe
  rationale: שׁאל mit ב und dem Gottesnamen bezeichnet hier das Einholen göttlicher Weisung, nicht eine beiläufige Frage. „Jahwe befragen“ ist im Deutschen idiomatisch und bewahrt den kultisch-religiösen Sinn.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“; im Erzählzusammenhang bezeichnet die Wendung das Volk Israel insgesamt. „Die Israeliten“ ist die natürliche moderne deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְשָׁם
  choice: nämlich ... dort
  rationale: Die Wortfolge führt eine erläuternde Angabe zum Ort beziehungsweise zu den Umständen der Befragung ein. „Nämlich“ macht diese Funktion im Deutschen deutlich, ohne sie stärker kausal festzulegen.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: die Bundeslade Gottes
  rationale: Dies ist die geläufige und präzise deutsche Wiedergabe der hebräischen Konstruktverbindung; „Lade des Bundes Gottes“ wäre formaler, aber weniger natürlich.
- source_word: בַּיָּמִים הָהֵם
  choice: in jenen Tagen
  rationale: Die traditionelle temporale Wendung gibt den hebräischen Ausdruck genau und in würdigem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen Namen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Funktion des Hinweises auf die Bundeslade
  choice: erläuternder Einschub mit „nämlich“
  alternative: bloße Fortsetzung mit „und“
  rationale: Der Hinweis erklärt den erzählerischen Rahmen der Befragung. Die Übersetzung kennzeichnet diese erläuternde Funktion, ohne daraus eine ausdrückliche Aussage zu machen, dass allein die Gegenwart der Lade die Befragung ermöglichte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet den erläuternden Einschub. Die Formulierung bleibt knapp und folgt der hebräischen Satzstruktur, vermeidet jedoch die im Deutschen schwerfällige Wendung „Lade des Bundes Gottes“.
