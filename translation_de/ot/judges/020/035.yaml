base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: de
  text: Und Jahwe schlug Benjamin vor Israel nieder[a]. An jenem Tag vernichteten die Israeliten 25.100 Mann aus Benjamin, alle Männer, die das Schwert zogen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „besiegte Benjamin vor Israel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „alle diese, die das Schwert ziehen“.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: schlug … nieder
  rationale: Das Verb נָגַף bezeichnet im militärischen Zusammenhang ein Schlagen beziehungsweise Besiegen. „Schlug … nieder“ wahrt die kraftvolle Bildsprache und lässt offen, ob der Akzent auf Niederlage oder Tötung liegt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: vor Israel
  rationale: Die knappe Wendung erhält die hebräische Ausdrucksweise und bezeichnet hier die Niederlage Benjamins im Kampf gegen Israel.
- source_word: וַיַּשְׁחִיתוּ
  choice: vernichteten
  rationale: Der Hifil von שׁחת kann „vernichten“ bedeuten; im Schlachtbericht ist tödliche Zerstörung gemeint. „Vernichteten“ gibt die Härte des Ausdrucks wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“. Im modernen Deutschen bezeichnet „die Israeliten“ dieselbe Volksgruppe idiomatisch und passt hier zu den kämpfenden Männern.
- source_word: בְּבִנְיָמִן
  choice: aus Benjamin
  rationale: Die Präposition bezeichnet hier den Personenkreis, aus dem die Gefallenen stammten. „Mann aus Benjamin“ ist im Deutschen klar und natürlich.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: 25.100 Mann
  rationale: Die Zahl wird direkt wiedergegeben; אִישׁ bezeichnet in dieser Zählformel männliche Kämpfer.
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: sie alle zogen das Schwert
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild vom Ziehen des Schwertes, das kampffähige beziehungsweise bewaffnete Männer bezeichnet.
theological_decisions:
- issue: Göttliches und menschliches Handeln beim Ausgang der Schlacht
  choice: 'Beide Handlungsträger bleiben ausdrücklich genannt: Jahwe schlägt Benjamin nieder, und die Israeliten vernichten dessen Männer.'
  alternative: Den Sieg entweder ausschließlich als Gottes unmittelbares Handeln oder ausschließlich als menschlichen militärischen Erfolg darstellen.
  rationale: Der hebräische Text stellt göttliches und menschliches Handeln nebeneinander, ohne ihr Verhältnis näher aufzulösen. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Schlachtbericht, wird jedoch für natürliche deutsche Lesbarkeit in zwei Sätze gegliedert. „Jahwe“ bewahrt den Gottesnamen; „Israeliten“ vermeidet die im heutigen Deutsch unnatürliche Formulierung „Söhne Israels“.
