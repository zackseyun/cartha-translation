  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: de
  text: 'Und Pinhas, der Sohn Eleasars, des Sohnes Aarons, stand damals vor ihr[a] und fragte: »Soll ich noch einmal zum Kampf gegen die Söhne meines Bruders Benjamin[b] ausziehen, oder soll ich davon ablassen?« Da sprach Jahwe: »Zieht hinauf! Denn morgen werde ich ihn[c] in deine Hand geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stand damals vor ihm“, wobei sich das Pronomen auf Jahwe statt auf die in Vers 27 genannte Bundeslade bezieht.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „die Söhne Benjamins, meines Bruders“. Die Verwandtschaftssprache bewahrt die Bezeichnung Benjamins als Bruder trotz des Bürgerkriegs.'
    reason: cultural_note
  - marker: c
    text: 'Das singularische „ihn“ bezeichnet wahrscheinlich den Stamm Benjamin als kollektive Einheit. Auch möglich: „ihn in deine Gewalt geben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: Und Pinhas, der Sohn Eleasars, des Sohnes Aarons
  rationale: Die genealogische Folge wird vollständig bewahrt; die Namensformen entsprechen geläufiger deutscher Bibelsprache.
- source_word: עֹמֵד לְפָנָיו בַּיָּמִים הָהֵם
  choice: stand damals vor ihr
  rationale: Das Partizip wird im erzählenden Zusammenhang als fortdauernde damalige Tätigkeit wiedergegeben. Das Pronomen bezieht sich im unmittelbaren Kontext wahrscheinlich auf die Bundeslade aus Vers 27; im Deutschen verlangt deren grammatisches Geschlecht „ihr“.
- source_word: לֵאמֹר
  choice: und fragte
  rationale: Die hebräische Redeeinleitung wird im Deutschen entsprechend der folgenden Entscheidungsfrage natürlich und präzise wiedergegeben.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: Soll ich noch einmal zum Kampf … ausziehen
  rationale: יסף mit עוד bezeichnet hier die Wiederholung eines bereits unternommenen Feldzugs; „ausziehen“ bewahrt das militärische Bild.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: gegen die Söhne Benjamins, meines Bruders
  rationale: Im Kampfzusammenhang bezeichnet עִם die gegnerische Partei. Die wörtliche Verwandtschaftssprache wird trotz ihrer ungewohnten Form bewahrt.
- source_word: אִם אֶחְדָּל
  choice: oder soll ich davon ablassen?
  rationale: חדל meint aufhören beziehungsweise von einem Vorhaben ablassen; die gewählte Formulierung ist klares modernes Deutsch.
- source_word: עֲלוּ
  choice: Zieht hinauf!
  rationale: Der Plural und die Grundbedeutung der militärischen Bewegung werden erhalten; eine bloße Wiedergabe als „Greift an“ wäre stärker deutend.
- source_word: כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ
  choice: Denn morgen werde ich ihn in deine Hand geben
  rationale: Das Bild der Übergabe in die Hand sowie die auffälligen Singularformen des Objekts und des Adressaten bleiben erhalten.
theological_decisions:
- issue: Bezugswort des Suffixes in לְפָנָיו
  choice: 'Bezug auf die in Vers 27 genannte Bundeslade: „vor ihr“'
  alternative: 'Bezug auf Jahwe: „vor ihm“'
  rationale: Die Bundeslade ist das nächste ausdrücklich genannte Bezugswort und passt sachlich zur priesterlichen Stellung des Pinhas. Da die Lade im Hebräischen maskulin ist, lässt das maskuline Suffix den Bezug auf Jahwe ebenfalls zu; diese echte Mehrdeutigkeit wird in einer Fußnote offengehalten.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die überlieferte Namensform wird als Eigenname wiedergegeben, ohne sie durch einen Titel zu ersetzen.
- issue: Wechsel zwischen Singular und Plural
  choice: „Soll ich …?“; „Zieht …!“; „ihn“; „deine Hand“
  alternative: Vereinheitlichung auf einen durchgehenden Numerus
  rationale: Der hebräische Text wechselt bewusst zwischen dem kollektiv sprechenden Israel, der pluralischen Aufforderung und Benjamin als singularisch behandelter Stammesgröße. Eine Vereinheitlichung würde diese Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten hebräischen Erzähl- und Verwandtschaftsbildern. Ungewohnte Numeruswechsel und die Mehrdeutigkeit des Pronominalbezugs werden nicht stillschweigend geglättet.
