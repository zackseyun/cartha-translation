translation_notes:
  register: Moderne, würdige Erzählsprache. „Die Verfolger“ verdeutlicht den im Hebräischen nur aus dem Zusammenhang erkennbaren Subjektwechsel von den fliehenden Benjaminitern zu ihren Verfolgern. Die Ortsnamen Rimmon und Gidom bleiben erhalten; unnötige militärische Fachsprache wird vermieden.
