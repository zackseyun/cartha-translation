base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: de
  text: Da wandten sie sich um und flohen in Richtung der Wüste, zum Felsen Rimmon. Auf den Straßen machten die Verfolger fünftausend Mann von ihnen nieder[a]. Sie jagten ihnen bis Gidom nach und erschlugen zweitausend Mann von ihnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb hat eigentlich das Bild der „Nachlese“. Es bezeichnet hier bildhaft das Aufgreifen und Töten der fliehenden Überlebenden.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen bei „ihnen nach“ und „von ihnen“ Singularformen („ihm nach“, „von ihm“), die sich kollektiv auf die fliehenden Benjaminiter beziehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיָּנֻסוּ
  choice: Da wandten sie sich zur Flucht und flohen
  rationale: פנה bezeichnet den Richtungswechsel, נוס die Flucht. Die Verbindung „sich zur Flucht wenden und fliehen“ gibt beide Verben wieder, ohne eine Rückkehr an einen früheren Ort anzudeuten.
- source_word: הַמִּדְבָּרָה
  choice: in Richtung Wüste
  rationale: Die Richtungsendung -ה bezeichnet eine Bewegung auf die Wüste zu; „in Richtung“ bewahrt diese Nuance, ohne zwingend das Betreten der Wüste auszusagen.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: zum Felsen Rimmon
  rationale: סֶלַע bedeutet „Fels“ bzw. „Felsen“; Rimmon wird als Eigenname beibehalten.
- source_word: וַיְעֹלְלֻהוּ
  choice: machten ... nieder
  rationale: Das Verb verwendet hier wahrscheinlich das Bild der Nachlese für das Aufgreifen und Töten der auf der Flucht Verbliebenen. „Niedermachen“ vermittelt den militärischen Sinn; das zugrunde liegende Bild wird in der Fußnote bewahrt.
- source_word: בַּמְסִלּוֹת
  choice: auf den Straßen
  rationale: מְסִלּוֹת bezeichnet angelegte bzw. erhöhte Verkehrswege. „Straßen“ ist im heutigen Deutsch natürlich und lässt offen, wie groß diese Wege waren.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: fünftausend Mann
  rationale: Die wörtliche militärische Zählangabe wird knapp und geschlechtsgenau wiedergegeben.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: Sie jagten ihnen ... nach
  rationale: Die Hifilform von דבק bezeichnet ein dichtes Nachsetzen bzw. Verfolgen. „Nachjagen“ gibt die energische Verfolgung wieder, ohne ein tatsächliches Einholen ausdrücklich zu behaupten.
- source_word: עַד גִּדְעֹם
  choice: bis Gidom
  rationale: עַד nennt den räumlichen Endpunkt der Verfolgung; der Ortsname wird transliteriert.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: erschlugen zweitausend Mann von ihnen
  rationale: נכה bezeichnet im Kampf das tödliche Schlagen. „Von ihnen“ gibt den partitiven Sinn des kollektiv gebrauchten Singularsuffixes wieder; ein „weitere“ wird nicht ergänzt, da es im Hebräischen nicht ausdrücklich steht.
