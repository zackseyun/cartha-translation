lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Partikel wird als würdiger, gegenwartsnaher Aufruf wiedergegeben.
- source_word: כֻלְּכֶם בְּנֵי יִשְׂרָאֵל
  choice: ihr alle seid Israeliten
  rationale: Die Anrede bezeichnet die gesamte versammelte Gemeinschaft; „Israeliten“ gibt „Söhne Israels“ im modernen Deutschen natürlich und inklusiv im Sinn der Volkszugehörigkeit wieder.
- source_word: הָבוּ לָכֶם דָּבָר וְעֵצָה
  choice: Beratet euch ... und sagt, was zu tun ist
  rationale: Wörtlich etwa „Gebt euch ein Wort und Rat“. Die idiomatische Wiedergabe bewahrt die Aufforderung, gemeinsam Rat zu fassen und eine Stellungnahme beziehungsweise einen Handlungsbeschluss vorzulegen.
- source_word: הֲלֹם
  choice: hier
  rationale: Das Ortsadverb bezieht die Aufforderung auf die gegenwärtige Versammlung.
