base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: de
  text: Doch sechshundert Mann wandten sich um und flohen in Richtung der Wüste zum Felsen von Rimmon[a]. Sie blieben vier Monate am Felsen von Rimmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »zum Felsen des Rimmon«; auch als Ortsname »zum Rimmon-Felsen« wiederzugeben. Die hebräische Richtungsform bei »Wüste« kann eine Bewegung zur Wüste hin oder in das Wüstengebiet hinein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: wandten sich ab
  rationale: Das Verb bezeichnet einen Richtungswechsel; »wandten sich ab« gibt im Zusammenhang mit der Flucht die Abkehr vom Kampf natürlich wieder.
- source_word: וַיָּנֻסוּ
  choice: flohen
  rationale: נוּס bedeutet gewöhnlich »fliehen« und bewahrt die Dringlichkeit des militärischen Zusammenhangs.
- source_word: הַמִּדְבָּרָה
  choice: zur Wüste hin
  rationale: Die Richtungsendung bezeichnet eine Bewegung zur Wüste beziehungsweise in sie hinein; die Formulierung bewahrt diese Offenheit.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: zum Felsen von Rimmon
  rationale: Die Wiedergabe erhält die hebräische Konstruktion und behandelt Rimmon als Namen.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: sechshundert Mann
  rationale: אִישׁ zählt hier im militärischen Kontext erwachsene Männer; »Mann« ist nach der Zahl im Deutschen idiomatisch.
- source_word: וַיֵּשְׁבוּ
  choice: Sie blieben
  rationale: ישׁב kann sitzen, wohnen oder bleiben bedeuten; bei einem viermonatigen Zufluchtsaufenthalt ist »blieben« natürlich und zeitlich passend.
- source_word: בְּסֶלַע רִמּוֹן
  choice: am Felsen von Rimmon
  rationale: Die Präposition בְּ bezeichnet hier den Aufenthaltsort; »am« ist für einen benannten felsigen Zufluchtsort natürlich, ohne eine Höhle vorauszusetzen.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: vier Monate
  rationale: Direkte und idiomatische Wiedergabe der Zeitdauer.
- source_word: וַ
  choice: Doch
  rationale: 'Das narrative Waw wird im Kontext kontrastiv wiedergegeben: Diese sechshundert bilden die Ausnahme gegenüber den zuvor getöteten Benjamin­itern.'
