  text: וַ/יַּ֜עַן הָ/אִ֣ישׁ הַ/לֵּוִ֗י אִ֛ישׁ הָ/אִשָּׁ֥ה הַ/נִּרְצָחָ֖ה וַ/יֹּאמַ֑ר הַ/גִּבְעָ֨תָ/ה֙ אֲשֶׁ֣ר לְ/בִנְיָמִ֔ן בָּ֛אתִי אֲנִ֥י וּ/פִֽילַגְשִׁ֖/י לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: de
  text: 'Da antwortete der Levit, der Mann der ermordeten Frau: »Ich kam mit meiner Nebenfrau nach Gibea, das zu Benjamin gehört, um dort zu übernachten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Die übliche erzählerische Bedeutung von ענה wird bewahrt, auch wenn im unmittelbaren Vers keine ausdrückliche Frage steht.
- source_word: הָאִישׁ הַלֵּוִי
  choice: der Levit
  rationale: Natürliche und etablierte deutsche Wiedergabe der Bezeichnung nach Stammes- beziehungsweise Kultzugehörigkeit.
- source_word: אִישׁ הָאִשָּׁה
  choice: der Mann der ... Frau
  rationale: Die Konstruktion bezeichnet hier ihren männlichen Partner. »Mann« wahrt die Beziehungsangabe, ohne das Verhältnis über den im Kontext verwendeten Begriff Nebenfrau hinaus zu systematisieren.
- source_word: הַנִּרְצָחָה
  choice: der ermordeten Frau
  rationale: Das passive Partizip von רצח bezeichnet eine durch verbrecherische Gewalt Getötete; »ermordet« erhält diese Schwere.
- source_word: וַיֹּאמַר
  choice: '[in der deutschen Redeeinleitung nicht zusätzlich wiedergegeben]'
  rationale: Die hebräische Doppelung »antwortete und sagte« ist idiomatisch. Im modernen Deutschen führt »antwortete« die direkte Rede bereits vollständig und würdig ein.
- source_word: הַגִּבְעָתָה
  choice: nach Gibea
  rationale: Das Richtungs-he bezeichnet die Bewegung auf den Ort zu; »nach Gibea« ist die natürliche deutsche Entsprechung.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: das zu Benjamin gehört
  rationale: Die Formulierung gibt die territoriale beziehungsweise stammesbezogene Zuordnung wieder, ohne sie unnötig zu präzisieren.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: Ich kam mit meiner Nebenfrau
  rationale: Das explizite Pronomen und die koordinierte Wendung werden in natürlichem Deutsch als gemeinsames Kommen ausgedrückt; der Sprecher bleibt als Subjekt hervorgehoben.
- source_word: וּפִילַגְשִׁי
  choice: meine Nebenfrau
  rationale: »Nebenfrau« ist eine verständliche, sachliche deutsche Entsprechung für פילגש und bildet den eheähnlichen, aber nachgeordneten Status besser ab als das heute oft anders konnotierte »Konkubine«.
- source_word: לָלוּן
  choice: um dort zu übernachten
  rationale: Der Infinitiv bezeichnet das Verbringen der Nacht. »Übernachten« ist knapp, modern und bedeutungsgetreu; »dort« verdeutlicht im Deutschen natürlich den Ortsbezug.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Redeeinleitungsformel wurde idiomatisch gestrafft. Keine konfessionellen oder über den Text hinausgehenden Deutungen wurden eingeführt.
