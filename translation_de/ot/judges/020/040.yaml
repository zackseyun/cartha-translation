base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: de
  text: 'Doch das Zeichen begann als Rauchsäule aus der Stadt aufzusteigen[a]. Benjamin wandte sich um[b], und siehe: Die ganze Stadt stieg zum Himmel empor[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Signalfeuer begann als Rauchsäule aus der Stadt aufzusteigen.“ Das hebräische Wort bezeichnet etwas Emporgehobenes und meint hier wahrscheinlich das verabredete Signal.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Benjamin wandte sich hinter sich.“ Gemeint sein kann, dass die Benjaminiter umkehrten oder hinter sich blickten.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Die ganze Stadt ging zum Himmel auf“, das heißt in Flammen und Rauch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: das Zeichen
  rationale: Im Zusammenhang bezeichnet das Wort das verabredete Signal des Hinterhalts. „Zeichen“ gibt diese kommunikative Funktion natürlich wieder, ohne die konkrete Form bereits im Substantiv festzulegen.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: begann … aufzusteigen
  rationale: Die Konstruktion bezeichnet den Beginn einer Aufwärtsbewegung und passt idiomatisch zur folgenden Rauchsäule.
- source_word: עַמּוּד עָשָׁן
  choice: eine Rauchsäule
  rationale: Die kompakte deutsche Zusammensetzung gibt die sichtbare, senkrecht aufsteigende Rauchwolke präzise und natürlich wieder.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: Benjamin wandte sich um
  rationale: „Benjamin“ steht kollektiv für den Stamm beziehungsweise dessen Kämpfer. „Sich umwenden“ bewahrt die Bewegungsbedeutung, ohne das Verb auf ein bloßes Zurückblicken zu verengen.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Wendung markiert die plötzliche Wahrnehmung und erhält die dramatische Kraft des hebräischen Erzählstils.
- source_word: כְלִיל הָעִיר
  choice: die ganze Stadt
  rationale: כְלִיל bezeichnet hier die Stadt in ihrer Gesamtheit.
- source_word: עָלָה … הַשָּׁמָיְמָה
  choice: stieg zum Himmel empor
  rationale: Die Formulierung bewahrt die bildhafte Aufwärtsbewegung, ohne ausdrücklich zu ergänzen, ob vor allem Feuer oder Rauch aufstieg.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Benjamin“ bleibt entsprechend dem hebräischen kollektiven Singular als Stammesbezeichnung stehen; „und siehe“ bewahrt bewusst den dramatischen Wahrnehmungsmarker.
