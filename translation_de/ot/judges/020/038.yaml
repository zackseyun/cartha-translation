source:
  edition: WLC
  text: וְ/הַ/מּוֹעֵ֗ד הָיָ֛ה לְ/אִ֥ישׁ יִשְׂרָאֵ֖ל עִם הָ/אֹרֵ֑ב הֶ֕רֶב לְ/הַעֲלוֹתָ֛/ם מַשְׂאַ֥ת הֶ/עָשָׁ֖ן מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: de
  text: Das vereinbarte Zeichen zwischen den Männern Israels und dem Hinterhalt[a][b] bestand darin, eine große Rauchsäule aus der Stadt aufsteigen zu lassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vereinbarte Abmachung“ beziehungsweise „das festgesetzte Signal“. Das hebräische Wort מוֹעֵד bezeichnet oft eine festgesetzte Zeit, hier aber eine vorherige Absprache beziehungsweise deren Zeichen im Kampf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „für die Männer Israels mit dem Hinterhalt“; gemeint sind die beiden Parteien der Vereinbarung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eine große Rauchmasse“ beziehungsweise „eine Rauchwolke“. Gemeint ist auffällig aufsteigender Rauch aus der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: das vereinbarte Zeichen
  rationale: מוֹעֵד bezeichnet gewöhnlich einen festgesetzten Zeitpunkt oder eine Verabredung; im militärischen Zusammenhang ist hier das zuvor vereinbarte Signal gemeint. „Vereinbartes Zeichen“ gibt sowohl die Absprache als auch ihre Funktion wieder.
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: zwischen den Männern Israels und dem Hinterhalt
  rationale: Die Verbindung von לְ und עִם nennt die beiden an der Vereinbarung beteiligten Parteien. אִישׁ יִשְׂרָאֵל bezeichnet hier die männlichen israelitischen Kämpfer; הָאֹרֵב steht kollektiv für die im Hinterhalt liegende Truppe.
- source_word: הֶרֶב
  choice: große
  rationale: Die intensive Form von רבה verstärkt das Aufsteigen beziehungsweise den Umfang des sichtbaren Rauchzeichens. Im Deutschen wird dies natürlich durch „große“ bei „Rauchsäule“ ausgedrückt.
- source_word: לְהַעֲלוֹתָם
  choice: aufsteigen zu lassen
  rationale: Der Hifil von עלה bedeutet „hinaufbringen, aufsteigen lassen“. Das Suffix verweist auf diejenigen, die das vereinbarte Zeichen ausführen sollten, ohne dass sie im Deutschen nochmals ausdrücklich genannt werden müssen.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: eine große Rauchsäule
  rationale: מַשְׂאַת bezeichnet hier eine aufsteigende, deutlich sichtbare Rauchmasse. „Rauchsäule“ ist im Deutschen eine natürliche und anschauliche Wiedergabe, ohne den Ausdruck ausdrücklich als technisches Signal umzudeuten.
- source_word: מִן הָעִיר
  choice: aus der Stadt
  rationale: Die Präposition מִן bezeichnet den räumlichen Ausgangspunkt; „aus der Stadt“ entspricht dem Kontext präzise.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Satzstruktur, verwendet aber idiomatisches Deutsch. „Männer Israels“ bewahrt im militärischen Kontext die konkrete maskuline Bezeichnung; „Hinterhalt“ gibt das kollektiv gebrauchte Partizip knapp wieder. Die Konjunktion וְ wird nicht mit einem unbegründeten temporalen „Nun“ wiedergegeben.
