  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: de
  text: Da zogen alle Israeliten aus, und die Gemeinde versammelte sich wie ein Mann, von Dan bis Beerscheba und aus dem Land Gilead, bei Jahwe in Mizpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „zu Jahwe, Mizpa“. Die Formulierung kann bedeuten, dass die Versammlung zu Jahwe nach Mizpa kam, oder dass sie sich in Jahwes Gegenwart in Mizpa versammelte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ כָּל בְּנֵי יִשְׂרָאֵל
  choice: Da zogen alle Israeliten aus
  rationale: יצא bezeichnet hier das Ausziehen zur anschließenden Versammlung. בְּנֵי יִשְׂרָאֵל ist eine feste hebräische Bezeichnung für die Israeliten als Volk; die natürliche deutsche Wiedergabe vermeidet das missverständliche „Söhne Israels“, das hier nicht nur männliche Einzelpersonen meint.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: und die Gemeinde versammelte sich
  rationale: עֵדָה bezeichnet die gemeinschaftlich handelnde Volksgemeinde. „Gemeinde“ erhält den korporativen Sinn, ohne die Versammlung ausschließlich kultisch zu bestimmen.
- source_word: כְּאִישׁ אֶחָד
  choice: wie ein Mann
  rationale: Die bildhafte hebräische Wendung wird bewahrt und drückt geschlossenes, einmütiges Handeln aus.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע וְאֶרֶץ הַגִּלְעָד
  choice: von Dan bis Beerscheba und aus dem Land Gilead
  rationale: „Von Dan bis Beerscheba“ bezeichnet die räumliche Ausdehnung des westjordanischen Israel; Gilead wird als zusätzlich vertretenes Gebiet östlich des Jordan genannt. Das ergänzte „aus“ verdeutlicht diese syntaktische Beziehung.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: bei Jahwe in Mizpa
  rationale: אֶל bezeichnet wörtlich eine Ausrichtung „zu“ Jahwe; im Zusammenhang einer Versammlung in Mizpa ist im Deutschen „bei Jahwe“ als Zusammenkunft in seiner Gegenwart natürlich. „In Mizpa“ bezeichnet den Versammlungsort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֶל יְהוָה bei der Versammlung in Mizpa
  choice: bei Jahwe in Mizpa
  alternative: zu Jahwe nach Mizpa
  rationale: Die Formulierung kann sowohl die Ausrichtung der Versammlung auf Jahwe als auch das Zusammenkommen in seiner Gegenwart bezeichnen. Die Hauptfassung ist im Deutschen idiomatisch; die Fußnote bewahrt die direktere Richtungsbedeutung.
- issue: Maskuline korporative Sprache
  choice: „Israeliten“, aber „wie ein Mann“
  alternative: „Söhne Israels“ und „wie ein Mann“
  rationale: Die feste Volksbezeichnung בְּנֵי יִשְׂרָאֵל wird verständlich als „Israeliten“ wiedergegeben, während die anschauliche Einheitsmetapher כְּאִישׁ אֶחָד in ihrer Form erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da zogen … aus“ trägt den erzählerischen Anschluss; Gedankenstriche gliedern die weit gespannte Herkunftsangabe. Die traditionelle Ortsform „Mizpa“ und der Gottesname „Jahwe“ werden verwendet.
