  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: de
  text: 'Da sagten die Benjaminiter: »Sie werden vor uns geschlagen wie beim ersten Mal[a].« Die Israeliten aber sagten: »Lasst uns fliehen und sie von der Stadt weg auf die Straßen[c] ziehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wie beim ersten«; gemeint sind die früheren Kämpfe in diesem Kapitel. Möglich ist auch: »wie zuvor«.'
    reason: cross_reference
  - marker: b
    text: 'Im Hebräischen steht das Objekt im Singular: »ihn wegziehen«. Gemeint ist wahrscheinlich kollektiv Benjamin beziehungsweise dessen Streitmacht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Hauptstraßen« oder »Landstraßen«. Das hebräische Wort kann ausgebaute oder größere Straßen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: werden geschlagen
  rationale: Das passive Partizip bezeichnet im militärischen Zusammenhang, dass die Israeliten im Kampf geschlagen werden. Die Formulierung bewahrt das konkrete Bild, ohne bereits eine endgültige Niederlage auszusagen.
- source_word: לְפָנֵינוּ
  choice: vor uns
  rationale: Die übliche räumlich-militärische Wendung passt zum triumphierenden Urteil der Benjaminiter.
- source_word: כְּבָרִאשֹׁנָה
  choice: wie beim ersten Mal
  rationale: Die Wendung verweist auf die früheren Kämpfe dieses Kapitels, ohne das im Hebräischen nicht ausdrücklich wiederholte Wort »Kampf« einzufügen.
- source_word: נָנוּסָה
  choice: Lasst uns fliehen
  rationale: Der Kohortativ drückt einen gemeinsamen Entschluss beziehungsweise Plan aus. »Fliehen« wahrt dabei die konkrete Bedeutung besser als das stärker militärtechnische »sich zurückziehen«.
- source_word: וּנְתַקְּנֻהוּ
  choice: und sie … weg … ziehen
  rationale: Das Verb נתק bedeutet hier »wegziehen/fortziehen«. Die deutsche Wiedergabe vermeidet das stärker deutende »weglocken«, macht aber die beabsichtigte Bewegung fort von der Stadt deutlich.
- source_word: הוּא suffix in וּנְתַקְּנֻהוּ
  choice: sie
  rationale: Das hebräische Objektssuffix steht im Singular und bezieht sich wahrscheinlich kollektiv auf Benjamin oder dessen Streitmacht. Im Deutschen bezeichnet »sie« die zuvor genannten Benjaminiter natürlich; die formale Abweichung wird in einer Fußnote offengelegt.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עִיר bezeichnet hier die Stadt Gibea, von der die benjaminitische Streitmacht fortgezogen werden soll.
- source_word: הַמְסִלּוֹת
  choice: die Landstraßen
  rationale: מְסִלּוֹת bezeichnet ausgebaute beziehungsweise größere Straßen. »Landstraßen« ist im heutigen Deutsch verständlich und unterscheidet sie von innerstädtischen Straßen, ohne moderne Autobahnen nahezulegen.
