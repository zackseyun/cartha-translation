translation_notes:
  register: Moderne, würdige Erzählprosa. »Benjaminiter« und »Israeliten« sind im Deutschen natürlicher als die formale Wiedergabe »Söhne Benjamins/Israels«. Das Plusquamperfekt »hatten gesagt« kennzeichnet den zuvor gefassten israelitischen Schlachtplan und macht den zeitlichen Zusammenhang verständlich.
