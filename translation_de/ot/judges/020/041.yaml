source:
  edition: WLC
  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: de
  text: Da wandten sich die Männer Israels um[a], und die Männer Benjamins gerieten in Schrecken; denn sie sahen, dass das Unheil über sie gekommen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen die Ausdrücke „Mann Israels“ und „Mann Benjamins“ sowie „er sah“ und „über ihn“ im Singular; sie bezeichnen hier jeweils kollektiv die gegnerischen Streitkräfte und werden deshalb im Deutschen im Plural wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Da … die Männer Israels
  rationale: אִישׁ steht formal im Singular, bezeichnet hier aber kollektiv die israelitische Streitmacht. Der Plural ist im Deutschen natürlich und sachgerecht; וְ wird als fortführendes „Da“ wiedergegeben.
- source_word: הָפַךְ
  choice: wandten sich … um
  rationale: הפך bezeichnet hier die taktische Kehrtwende im Kampf. „Sich umwenden“ bleibt nahe am Hebräischen, ohne ein Zurückweichen zu unterstellen.
- source_word: וַ/יִּבָּהֵל
  choice: gerieten in Schrecken
  rationale: בהל bezeichnet plötzliches Erschrecken bis hin zu Bestürzung oder Panik. Die gewählte Formulierung ist kräftig, würdig und nicht umgangssprachlich.
- source_word: אִישׁ בִּנְיָמִן
  choice: die Männer Benjamins
  rationale: Der formale Singular wird wie bei Israel kollektiv auf Benjamins Streitmacht bezogen und deshalb im Deutschen pluralisch wiedergegeben.
- source_word: כִּי רָאָה
  choice: denn sie sahen
  rationale: Das erste כִּי begründet Benjamins Schrecken. Das singularische Verb wird entsprechend dem kollektiven Subjekt im Deutschen im Plural wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: Das zweite כִּי leitet den Inhalt dessen ein, was die Benjaminiter erkannten.
- source_word: נָגְעָה עָלָיו
  choice: über sie gekommen war
  rationale: Die Wendung נגע על beschreibt hier das Eintreffen eines verhängnisvollen Geschehens. Die Wiedergabe wahrt das Bild eines über jemanden kommenden Unheils; das singularische Suffix wird kollektiv pluralisch übersetzt.
- source_word: הָרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet im Kontext nicht moralische Bosheit, sondern das Verderben beziehungsweise die Katastrophe, die Benjamin im Kampf trifft. „Unheil“ ist präzise und idiomatisch.
