  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: de
  text: Da versammelten sich alle Männer Israels zur Stadt[a], wie ein Mann, fest verbunden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Stadt“. Der Zusammenhang ist militärisch und feindlich, doch die Präposition selbst bedeutet nicht ausdrücklich „gegen“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Formulierung „wie ein Mann, verbunden“ betont ihre vollständige Geschlossenheit im Handeln.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: versammelten sich
  rationale: Der Nifal bezeichnet hier das Zusammenkommen der kollektiv genannten Männer. Die reflexive deutsche Form ist natürlich und gibt den Vorgang sachgerecht wieder.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: Die singularische Wendung mit כָּל ist kollektiv beziehungsweise distributiv gemeint. Im Zusammenhang des militärischen Aufgebots sind ausdrücklich die Männer Israels im Blick.
- source_word: אֶל הָעִיר
  choice: bei der Stadt
  rationale: אֶל bezeichnet zunächst die Bewegung zur Stadt hin. „Bei der Stadt“ gibt im Deutschen das Ergebnis des Zusammenkommens natürlich wieder, ohne die vom Kontext nahegelegte feindliche Absicht mit „gegen die Stadt“ in die Präposition selbst einzutragen.
- source_word: כְּאִישׁ אֶחָד
  choice: wie ein Mann
  rationale: Die feste Wendung beschreibt vollständige Geschlossenheit im Handeln und bewahrt zugleich das Bild des hebräischen Textes.
- source_word: חֲבֵרִים
  choice: fest verbunden
  rationale: Das Wort aus der Wurzel חבר verstärkt die Vorstellung, dass die Männer zusammengeschlossen und solidarisch handelten. „Fest verbunden“ gibt diese zusätzliche Bedeutung wieder, ohne sie mit dem vorangehenden Idiom zu verschmelzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ führt die Erzählung knapp fort; die bildhafte Einheitsformel des Hebräischen bleibt erhalten. Die Übersetzung vermeidet es, die im Kontext erkennbare feindliche Ausrichtung bereits in אֶל hineinzulesen.
