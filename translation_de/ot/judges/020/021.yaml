  - severity: low
    issue: „aus Gibea herausziehen“ ist stilistisch weniger glatt als „aus Gibea ausziehen“.
    rationale: Bei dem trennbaren Verb „ausziehen“ ist „zogen ... aus Gibea aus“ die reguläre deutsche Wortstellung und vermittelt weiterhin den militärischen Ausfall.
