  text: וַ/יֵּצְא֥וּ בְנֵֽי בִנְיָמִ֖ן מִן הַ/גִּבְעָ֑ה וַ/יַּשְׁחִ֨יתוּ בְ/יִשְׂרָאֵ֜ל בַּ/יּ֣וֹם הַ/ה֗וּא שְׁנַ֨יִם וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: de
  text: Da zogen die Benjaminiter aus Gibea aus und streckten an jenem Tag zweiundzwanzigtausend Männer Israels zu Boden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da zogen die Benjaminiter aus Gibea aus und töteten an jenem Tag zweiundzwanzigtausend Männer Israels.“'
    reason: 'Lexikalische Alternative: וַיַּשְׁחִיתוּ bezeichnet im Kontext der gezählten Verluste tödliches Vernichten und kann daher mit „töteten“ wiedergegeben werden; „zu Boden strecken“ bewahrt zusätzlich das Bild von אָרְצָה.'
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Da zogen … heraus
  rationale: Das wayyiqtol führt die Erzählung fort; „herausziehen“ bezeichnet im militärischen Zusammenhang natürlich den Ausfall aus der Stadt.
- source_word: בְנֵי בִנְיָמִן
  choice: die Benjaminiter
  rationale: Die moderne deutsche Volksbezeichnung gibt den hebräischen Stammesausdruck verständlich und würdig wieder; „Söhne Benjamins“ wäre formaler, klingt hier aber weniger natürlich.
- source_word: מִן הַגִּבְעָה
  choice: aus Gibea
  rationale: Die Präposition bezeichnet den Ausgangspunkt; Gibea ist der Ortsname.
- source_word: וַיַּשְׁחִיתוּ
  choice: streckten … zu Boden
  rationale: Der Hifil von שׁחת bezeichnet hier angesichts der Verlustzahl tödliche Vernichtung. Zusammen mit אָרְצָה bewahrt „zu Boden strecken“ sowohl die tödliche Kampfbedeutung als auch das Bild des hebräischen Textes.
- source_word: בְיִשְׂרָאֵל
  choice: aus Israel
  rationale: In Verbindung mit der gezählten Personengruppe bezeichnet ב die Betroffenen innerhalb Israels; idiomatisches Deutsch verwendet hier „Mann aus Israel“.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Formulierung gibt den bestimmten zeitlichen Rückverweis präzise und in natürlichem Erzählstil wieder.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: zweiundzwanzigtausend
  rationale: Dies ist die übliche deutsche Wiedergabe der hebräischen Zahl.
- source_word: אִישׁ
  choice: Mann
  rationale: Nach einer bestimmten Zahl steht „Mann“ im Deutschen idiomatisch im Singular. „Soldaten“ wäre eine kontextuelle Präzisierung, die im Wort selbst nicht ausdrücklich enthalten ist.
- source_word: אָרְצָה
  choice: zu Boden
  rationale: Der direktionale Ausdruck bedeutet „zur Erde/zum Boden hin“ und wird im Deutschen im Bild „zu Boden strecken“ bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit natürlichem Erzählfluss. „Benjaminiter“ vermeidet den heute schwerfällig wirkenden Ausdruck „Söhne Benjamins“, während „zu Boden strecken“ das konkrete Bild und die tödliche Bedeutung des Ausgangstextes erhält.
