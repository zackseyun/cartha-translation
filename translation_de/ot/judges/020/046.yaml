  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים מִ/בִּנְיָמִ֗ן עֶשְׂרִים֩ וַ/חֲמִשָּׁ֨ה אֶ֥לֶף אִ֛ישׁ שֹׁ֥לֵֽף חֶ֖רֶב בַּ/יּ֣וֹם הַ/ה֑וּא אֶֽת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: de
  text: An jenem Tag fielen aus Benjamin insgesamt 25.000 Männer, die das Schwert führten; sie alle waren tapfere Krieger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tüchtige Männer“ oder „Männer von Stärke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָל הַנֹּפְלִים
  choice: So betrug die Gesamtzahl …, die … fielen
  rationale: Die Formulierung gibt die zusammenfassende Fortführung der Erzählung natürlich wieder; das substantivierte Partizip bezeichnet die im Kampf Gefallenen.
- source_word: מִבִּנְיָמִן
  choice: aus Benjamin
  rationale: Die Präposition מן bezeichnet hier die Zugehörigkeit zur Stammesgruppe Benjamin; „aus Benjamin“ wahrt die hebräische Ausdrucksweise.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: 25.000 Männer
  rationale: Dies entspricht der Zahlenangabe und gibt אִישׁ ohne unnötigen Zusatz wieder.
- source_word: שֹׁלֵף חֶרֶב
  choice: führten das Schwert
  rationale: Die Wendung bezeichnet schwerttragende beziehungsweise kampffähige Männer. „Das Schwert führen“ bewahrt das Bild und klingt im Deutschen natürlicher als eine streng wörtliche Wiedergabe mit „ziehen“.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die deutsche Wendung gibt den bestimmten zeitlichen Rückverweis genau und idiomatisch wieder.
- source_word: אֶת כָּל אֵלֶּה
  choice: sie alle
  rationale: Die resumptive Hervorhebung der zuvor genannten Gesamtzahl wird im Deutschen knapp und deutlich aufgenommen.
- source_word: אַנְשֵׁי חָיִל
  choice: tapfere Krieger
  rationale: Im militärischen Zusammenhang bezeichnet חַיִל tüchtige, kampferprobte beziehungsweise tapfere Männer. „Tapfere Krieger“ vermittelt diese Bedeutung in aktuellem, verständlichem Deutsch.
