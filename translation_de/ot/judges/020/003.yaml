source:
  edition: WLC
  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: de
  text: 'Die Söhne Benjamins hörten, dass die Söhne Israels nach Mizpa hinaufgezogen waren.[a] Da sagten die Söhne Israels: »Sagt uns: Wie ist dieses Böse[b] geschehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die Benjaminiter“ und „die Israeliten“. Im Hebräischen steht wiederholt wörtlich „die Söhne Benjamins“ und „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „diese Bosheit“ oder „dieses Unrecht“. Das hebräische Wort hat hier ein starkes moralisches Gewicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: hörten
  rationale: שׁמע bezeichnet hier das Hören beziehungsweise Bekanntwerden einer Nachricht. „Hörten“ gibt den schlichten Erzählstil direkt wieder.
- source_word: בְּנֵי בִנְיָמִן / בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Benjamins / die Söhne Israels
  rationale: Die wörtliche Wiedergabe bewahrt die wiederholte hebräische Stammesbezeichnung und den formalen Gleichklang beider Gruppen; idiomatisch wären auch „Benjaminiter“ und „Israeliten“ möglich.
- source_word: כִּי עָלוּ
  choice: dass ... hinaufgezogen waren
  rationale: עלה bedeutet gewöhnlich „hinaufziehen“. Das Plusquamperfekt verdeutlicht, dass der Aufbruch nach Mizpa dem Hören der Nachricht vorausging.
- source_word: הַמִּצְפָּה
  choice: nach Mizpa
  rationale: Der Ausdruck bezeichnet den Ortsnamen Mizpa. Im Deutschen steht bei Ortsnamen gewöhnlich kein Artikel.
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: אמר bedeutet schlicht „sagen“. „Da“ gibt den erzählerischen Anschluss natürlich wieder, ohne ein nicht vorhandenes ausdrückliches Zeitwort wie „nun“ einzuführen.
- source_word: דַּבְּרוּ
  choice: Sagt uns
  rationale: Der Imperativ bedeutet wörtlich „redet/sprecht“, fordert hier aber einen Bericht. „Sagt uns“ ist im Deutschen natürlich; „uns“ ist aus der Gesprächssituation erschlossen.
- source_word: אֵיכָה נִהְיְתָה
  choice: Wie ist ... geschehen?
  rationale: Die Verbindung fragt direkt danach, wie das Ereignis zustande kam. „Geschehen“ ist eine natürliche Wiedergabe von היה in diesem ereignishaften Gebrauch.
- source_word: הָרָעָה הַזֹּאת
  choice: dieses Böse
  rationale: רָעָה kann Böses, Bosheit, Unrecht oder Unheil bezeichnen. Im Zusammenhang trägt das Wort deutlich moralisches Gewicht; „dieses Böse“ wahrt zugleich die gewisse Bedeutungsbreite.
