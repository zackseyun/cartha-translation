  text: וַ/יִּפְנ֞וּ לִ/פְנֵ֨י אִ֤ישׁ יִשְׂרָאֵל֙ אֶל דֶּ֣רֶךְ הַ/מִּדְבָּ֔ר וְ/הַ/מִּלְחָמָ֖ה הִדְבִּיקָ֑תְ/הוּ וַ/אֲשֶׁר֙ מֵ/הֶ֣/עָרִ֔ים מַשְׁחִיתִ֥ים אוֹת֖/וֹ בְּ/תוֹכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: de
  text: Da wandten sie sich von den Männern Israels ab und dem Weg zur Wüste zu[a]. Doch der Kampf holte sie ein[b], und die aus den Städten vernichteten sie mitten unter ihnen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „vor den Männern Israels“; die Wendung kann idiomatisch im Sinn von „von den Männern Israels weg“ verstanden werden, also als Rückzug vor ihnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und der Kampf erreichte sie“.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Wortlaut des letzten Satzteils ist knapp und schwer verständlich. Wahrscheinlich sind israelitische Truppen gemeint, die aus den Städten oder aus ihren Hinterhaltsstellungen kamen und Benjamin innerhalb seiner Formation vernichteten.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: da wandten sie sich
  rationale: פנה bedeutet grundsätzlich „sich wenden“. Im Zusammenhang ist ein Rückzug gemeint, doch die Wiedergabe bewahrt zunächst das hebräische Bild.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: vor den Männern Israels
  rationale: Die Formulierung folgt dem Hebräischen und bewahrt den militärischen Bezug auf die Männer Israels; idiomatisch kann sie auch eine Bewegung von ihnen weg bezeichnen.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: dem Weg zur Wüste zu
  rationale: Diese natürliche deutsche Formulierung gibt sowohl die Richtung als auch דֶּרֶךְ („Weg“) wieder.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: doch der Kampf holte sie ein
  rationale: Das Hifil von דבק bezeichnet hier das Einholen; „doch“ macht den im Zusammenhang erkennbaren Gegensatz idiomatisch deutlich.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: und die aus den Städten
  rationale: Die knappe, elliptische Konstruktion wird bewusst nicht näher bestimmt, da der schwierige hebräische Wortlaut nur die Herkunft aus den Städten ausdrücklich nennt.
- source_word: מַשְׁחִיתִים
  choice: vernichteten
  rationale: Das Partizip von שׁחת bezeichnet im militärischen Zusammenhang zerstörendes Töten; „vernichteten“ bleibt nahe am lexikalischen Sinn.
- source_word: אוֹתוֹ
  choice: sie
  rationale: Das hebräische Singularpronomen bezieht sich kollektiv auf Benjamin beziehungsweise dessen Heer; im Deutschen ist der Plural verständlicher.
- source_word: בְּתוֹכוֹ
  choice: mitten unter ihnen
  rationale: Der Singularsuffix ist kollektiv zu verstehen. Die Wendung bewahrt die räumliche Vorstellung, ohne die taktische Situation über den Wortlaut hinaus festzulegen.
