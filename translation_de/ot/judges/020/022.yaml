source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֥ק הָ/עָ֖ם אִ֣ישׁ יִשְׂרָאֵ֑ל וַ/יֹּסִ֨פוּ֙ לַ/עֲרֹ֣ךְ מִלְחָמָ֔ה בַּ/מָּק֕וֹם אֲשֶׁר עָ֥רְכוּ שָׁ֖ם בַּ/יּ֥וֹם הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: de
  text: Doch das Volk, die Männer Israels, fasste neuen Mut[a] und stellte sich wieder zur Schlacht auf, an demselben Ort, an dem es sich am ersten Tag aufgestellt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stärkte sich“. Das Hebräische kann nach der Niederlage ein erneutes Erstarken oder neuen Mut bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: fasste neuen Mut
  rationale: Das Hitpael von חזק bezeichnet hier nach der Niederlage ein erneutes Erstarken beziehungsweise eine erneuerte Entschlossenheit. „Fasste neuen Mut“ gibt dies im Deutschen natürlich wieder; die formalere Alternative wird in der Fußnote genannt.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: das Volk, die Männer Israels
  rationale: Die appositionelle Verbindung von „Volk“ und „Mann/Männer Israels“ bleibt erhalten und macht zugleich deutlich, dass die kämpfenden Männer gemeint sind. „Heer“ wäre stärker interpretierend.
- source_word: וַיֹּסִפוּ
  choice: wieder
  rationale: In Verbindung mit dem Infinitiv bezeichnet יסף die Wiederholung beziehungsweise Wiederaufnahme der Handlung.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: stellte sich zur Schlacht auf
  rationale: ערך mit מלחמה bezeichnet das Ordnen beziehungsweise Aufstellen zum Kampf. Die deutsche Wendung ist natürlich und bewahrt das militärische Bild.
- source_word: בַּמָּקוֹם
  choice: an demselben Ort
  rationale: Der bestimmte Ort wird durch den folgenden Relativsatz näher bezeichnet. „An demselben Ort“ macht den Rückbezug im Deutschen idiomatisch deutlich.
- source_word: אֲשֶׁר עָרְכוּ שָׁם
  choice: an dem es sich ... aufgestellt hatte
  rationale: Der Relativsatz nimmt denselben militärischen Aufstellungsbegriff wieder auf. Das kollektive Singularpronomen bezieht sich auf „das Volk“.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: am ersten Tag
  rationale: Eine direkte und natürliche Wiedergabe der Zeitangabe.
