  text: וַ/יַּעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/יַּעַרְכ֥וּ אֶל הַ/גִּבְעָ֖ה כְּ/פַ֥עַם בְּ/פָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: de
  text: Am dritten Tag zogen die Israeliten gegen die Benjaminiter hinauf und stellten sich wie zuvor gegen Gibea zur Schlacht auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zogen ... hinauf
  rationale: עלה bedeutet gewöhnlich „hinaufziehen“. Die Formulierung bewahrt die hebräische Bewegungsangabe und passt zugleich in den militärischen Zusammenhang.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung lautet wörtlich „die Söhne Israels“, bezeichnet hier aber idiomatisch das Volk beziehungsweise dessen Kämpfer. „Die Israeliten“ ist im modernen Deutschen natürlich.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: gegen die Benjaminiter
  rationale: אֶל bezeichnet grundsätzlich eine Bewegung „zu/auf ... hin“, erhält im militärischen Kontext jedoch feindliche Bedeutung. „Gegen“ gibt diese Beziehung im Deutschen klar wieder.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der Zeitangabe.
- source_word: וַיַּעַרְכוּ
  choice: stellten sich ... zur Schlacht auf
  rationale: ערך bezeichnet im militärischen Kontext das Ordnen oder Aufstellen von Truppen. Die gewählte Wendung macht diesen Sinn ausdrücklich und idiomatisch wieder.
- source_word: אֶל הַגִּבְעָה
  choice: gegen Gibea
  rationale: In Verbindung mit der militärischen Aufstellung bezeichnet אֶל die Ausrichtung gegen die Stadt. Der Ortsname wird als „Gibea“ wiedergegeben.
- source_word: כְּפַעַם בְּפָעַם
  choice: wie zuvor
  rationale: Die idiomatische Wendung bedeutet „wie bei den früheren Malen“ beziehungsweise „wie zuvor“. Die knappe Wiedergabe ist natürlich und kontextgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ethnischen Bezeichnungen „Israeliten“ und „Benjaminiter“ geben die hebräischen Abstammungsformeln idiomatisch wieder; die parallele Gruppenbezeichnung bleibt erhalten. Die deutsche Satzstellung setzt die Zeitangabe voran, ohne den Sinn zu verändern.
