base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: de
  text: Benjamin zog am zweiten Tag aus Gibea aus, ihnen entgegen[a], und sie streckten weitere achtzehntausend Mann von den Israeliten zu Boden[b]; sie alle waren Männer, die das Schwert zogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gegen sie. Die hebräische Wendung kann im militärischen Zusammenhang eine feindliche Begegnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: von den Söhnen Israels.'
    reason: source_transparency
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … aus
  rationale: יצא bezeichnet hier das Ausziehen aus der Stadt zum Kampf; „zog aus“ ist im deutschen Erzähl- und Militärkontext natürlich.
- source_word: לִקְרָאתָם
  choice: ihnen entgegen
  rationale: Die Wendung bezeichnet eine Begegnung und kann im militärischen Zusammenhang feindliche Konfrontation ausdrücken. „Ihnen entgegen“ bewahrt diese Offenheit, während der Kontext die feindliche Absicht erkennen lässt.
- source_word: מִן הַגִּבְעָה
  choice: aus Gibea
  rationale: Die Präposition markiert den Ausgangsort; der Ortsname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: am zweiten Tag
  rationale: Entspricht unmittelbar der hebräischen Ordinalangabe und ist im Deutschen idiomatisch.
- source_word: וַיַּשְׁחִיתוּ
  choice: sie streckten … zu Boden
  rationale: Der Hifil von שׁחת bezeichnet hier im Kampf die tödliche Vernichtung. Zusammen mit אָרְצָה gibt „zu Boden strecken“ die militärische Tötung natürlich und anschaulich wieder.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: von den Israeliten
  rationale: ב markiert die betroffene Gruppe. „Israeliten“ ist die natürliche deutsche Wiedergabe von „Söhne Israels“, ohne die nationale Zugehörigkeit abzuschwächen.
- source_word: עוֹד
  choice: weitere
  rationale: Das Wort kennzeichnet zusätzliche Verluste gegenüber dem vorigen Kampftag.
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: achtzehntausend Mann
  rationale: „Mann“ erhält die personenbezogene Zählform des Hebräischen und passt zum militärischen Zusammenhang.
- source_word: אָרְצָה
  choice: zu Boden
  rationale: Die Richtungsform bedeutet hier, dass die Getöteten zu Boden fallen; sie wird mit dem Verb zu einer natürlichen deutschen Wendung verbunden.
- source_word: כָּל אֵלֶּה
  choice: sie alle
  rationale: Natürliche deutsche Rückverweisung auf die zuvor genannten achtzehntausend Mann.
- source_word: שֹׁלְפֵי חָרֶב
  choice: Schwertträger
  rationale: Die Wendung bedeutet wörtlich „die das Schwert ziehen“. „Schwertträger“ gibt im Kontext knapp wieder, dass alle genannten Männer bewaffnete Kämpfer waren; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
