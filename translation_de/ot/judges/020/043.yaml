  text: כִּתְּר֤וּ אֶת בִּנְיָמִן֙ הִרְדִיפֻ֔/הוּ מְנוּחָ֖ה הִדְרִיכֻ֑/הוּ עַ֛ד נֹ֥כַח הַ/גִּבְעָ֖ה מִ/מִּזְרַח שָֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: de
  text: Sie umzingelten Benjamin[a], verfolgten ihn ohne Rast und traten ihn nieder bis gegenüber von Gibea, östlich davon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie umzingelten Benjamin, verfolgten ihn von Menuha aus«. מְנוּחָה kann möglicherweise als Ortsname statt adverbial verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und trieben ihn weiter bis gegenüber von Gibea, ostwärts«. Das hebräische Verb kann hier entweder gewaltsames Niedertreten oder das Veranlassen einer Bewegung bezeichnen; die abschließende Ortsangabe lautet wörtlich etwa »von Osten her« bzw. »von der Seite des Sonnenaufgangs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: umzingelten
  rationale: Das Verb bezeichnet ein militärisches Einschließen; »umzingelten« gibt dies im Deutschen präzise und natürlich wieder.
- source_word: אֶת בִּנְיָמִן
  choice: Benjamin
  rationale: Der Eigenname steht kollektiv für den Stamm beziehungsweise dessen Streitmacht. Die Form bewahrt zugleich den Bezug der folgenden maskulinen Singularsuffixe.
- source_word: הִרְדִיפֻהוּ
  choice: verfolgten ihn
  rationale: רדף bezeichnet im militärischen Zusammenhang das Verfolgen eines fliehenden Gegners.
- source_word: מְנוּחָה
  choice: ohne Rast
  rationale: 'Das schwierige Substantiv bedeutet »Ruhe/Rast« und wird hier wahrscheinlich adverbial verstanden: Die Verfolgung ließ Benjamin keine Ruhe. Die mögliche Deutung als Ortsname bleibt in einer Fußnote erhalten.'
- source_word: הִדְרִיכֻהוּ
  choice: traten ihn nieder
  rationale: Der Hifil von דרך kann ein gewaltsames Niedertreten ausdrücken. Im Verlauf der Kampfhandlung ist diese konkrete, feindliche Bedeutung plausibel; die mögliche kausative Bewegungsbedeutung wird in der Fußnote genannt.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: bis gegenüber von Gibea
  rationale: נֹכַח bezeichnet eine Lage gegenüber oder vor einem Ort; die Wiedergabe bleibt bewusst räumlich.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: auf der Ostseite
  rationale: Wörtlich steht hier »von der Richtung des Sonnenaufgangs/Ostens«. Im Zusammenhang bezeichnet die Wendung wahrscheinlich die Ostseite von Gibea; natürliches Deutsch ist hier klarer als eine Nachbildung von »Osten der Sonne«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular »Benjamin … ihn« folgt bewusst der hebräischen Darstellung. Die Unsicherheiten bei מְנוּחָה, הִדְרִיכֻהוּ und der abschließenden Richtungsangabe werden nicht im Haupttext überladen, sondern in den Fußnoten offengelegt.
