  text: וַ/יָּ֨קָם֙ כָּל הָ/עָ֔ם כְּ/אִ֥ישׁ אֶחָ֖ד לֵ/אמֹ֑ר לֹ֤א נֵלֵךְ֙ אִ֣ישׁ לְ/אָהֳל֔/וֹ וְ/לֹ֥א נָס֖וּר אִ֥ישׁ לְ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/008.yaml
  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: de
  text: 'Da erhob sich das ganze Volk wie ein Mann und sagte: »Keiner von uns wird zu seinem Zelt gehen, und keiner von uns wird sich seinem Haus zuwenden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da erhob sich
  rationale: Gibt das erzählende wayyiqtol und die körperliche, zugleich entschlossene Reaktion natürlich und würdig wieder.
- source_word: כְּאִישׁ אֶחָד
  choice: wie ein Mann
  rationale: Bewahrt das prägnante hebräische Bild für das geschlossene, einmütige Handeln des ganzen Volkes.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: Keiner von uns wird zu seinem Zelt gehen
  rationale: Das distributive אִישׁ wird im Deutschen idiomatisch mit »keiner von uns« wiedergegeben; der konkrete Ausdruck »Zelt« bleibt erhalten.
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: und keiner von uns wird in sein Haus zurückkehren
  rationale: סוּר bezeichnet hier im Zusammenhang das Abweichen beziehungsweise Sich-Wenden zum eigenen Haus; »zurückkehren« drückt die gemeinte Heimkehr natürlich aus, ohne den Aussagegehalt zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die kollektive Entschlossenheit und der Parallelismus des Hebräischen werden bewahrt; keine Fußnote ist erforderlich.
