base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: de
  text: 'Da wandten sich die Männer Israels im Kampf, und Benjamin begann, unter den Männern Israels etwa dreißig Mann zu erschlagen[a]. Denn sie sagten: »Ganz gewiss ist Israel vor uns geschlagen[b], wie in der ersten Schlacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »begann, Erschlagene unter den Männern Israels zu schlagen, etwa dreißig Mann«. Die hebräische Wendung ist knapp und in der Sprache des Kampfes idiomatisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verwendet die Einzahl: »Er ist ganz gewiss vor uns geschlagen.« Gemeint ist wahrscheinlich Israel als Gesamtheit; möglich wäre sinngemäß auch: »Sie sind ganz gewiss vor uns geschlagen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Da wandten sich
  rationale: Das Verb bezeichnet hier eine Wendung oder Richtungsänderung im Kampf. Die Formulierung wahrt diese Offenheit, ohne ausdrücklich Flucht oder Gegenangriff festzulegen.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Der formal singularische Ausdruck wird im militärischen Zusammenhang kollektiv gebraucht und bezeichnet Israels Kämpfer.
- source_word: בַּמִּלְחָמָה
  choice: im Kampf
  rationale: Die knappe Formulierung gibt den Schauplatz der Wendung natürlich wieder; ebenso möglich wäre »in der Schlacht«.
- source_word: וּבִנְיָמִן
  choice: und Benjamin
  rationale: Der Stammesname steht metonymisch für die benjaminitischen Kämpfer. Die Wiedergabe mit dem Namen bewahrt die Ausdrucksweise des Hebräischen.
- source_word: הֵחֵל לְהַכּוֹת
  choice: begann … zu erschlagen
  rationale: הֵחֵל bezeichnet den Beginn der Handlung; נכה meint im Kriegskontext ein tödliches Niederschlagen.
- source_word: חֲלָלִים בְּאִישׁ יִשְׂרָאֵל כִּשְׁלֹשִׁים אִישׁ
  choice: unter den Männern Israels etwa dreißig Mann zu erschlagen
  rationale: Die hebräische Wendung ist knapp und bezeichnet im Kampf Erschlagene beziehungsweise Gefallene. Im Deutschen wird der Vorgang idiomatisch ausgedrückt, während die Fußnote die formnähere Alternative festhält.
- source_word: אַךְ נִגּוֹף נִגָּף הוּא
  choice: Ganz gewiss ist Israel … geschlagen
  rationale: Infinitivus absolutus und finite Verbform verstärken die Aussage. »Ganz gewiss« gibt die nachdrückliche Siegesgewissheit wieder; »Israel« macht den singularischen kollektiven Bezug verständlich.
- source_word: לְפָנֵינוּ
  choice: vor uns
  rationale: Die räumlich-kämpferische Wendung wird nah am Hebräischen bewahrt und meint, dass Israel im Kampf gegen Benjamin geschlagen sei.
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: wie in der ersten Schlacht
  rationale: Die Formulierung verweist ausdrücklich auf die erste vorherige Schlacht und wird im Deutschen natürlich wiedergegeben.
