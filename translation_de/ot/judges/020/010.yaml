  terminology: „Proviant“, „Volk“ und „Schandtat“ passen zum Kontext und Register. „Gibea in Benjamin“ ist als Ortsbezeichnung verständlich. Die Fußnote zur Schandtat sollte grammatisch vollständige Alternativen bieten.
