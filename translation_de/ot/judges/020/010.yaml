source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: de
  text: Wir wollen aus allen Stämmen Israels je zehn Männer von hundert nehmen, hundert von tausend und tausend von zehntausend. Sie sollen Proviant für das Volk holen, damit das Volk bei seiner Ankunft in Gibea in Benjamin entsprechend der ganzen Schandtat vorgeht, die Gibea in Israel begangen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um bei ihrem Kommen nach Gibea in Benjamin entsprechend der ganzen Schandtat zu handeln“. Die hebräische Formulierung ist verdichtet; das Subjekt von „begangen hat“ kann im Kontext auf Gibea beziehungsweise dessen Bewohner bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: Wir wollen … nehmen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ beschreibt hier im Beratungskontext den gemeinsam gefassten Plan. Die deutsche Wendung mit „wollen“ gibt diesen prospektiv-volitiven Sinn natürlich wieder.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: zehn Männer von je hundert … hundert von je tausend und tausend von je zehntausend
  rationale: Die Zahlenfolge bezeichnet eine anteilige Auswahl. „Von je“ macht das Verhältnis im Deutschen klar und bewahrt zugleich das Zahlenmuster des Hebräischen.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: Im Zusammenhang mit der anteiligen Aushebung bezeichnet die Präposition die Gesamtheit, aus der die Männer ausgewählt werden.
- source_word: לָקַחַת צֵדָה
  choice: Proviant … holen
  rationale: צֵדָה bezeichnet Verpflegung beziehungsweise Vorräte für eine Reise oder einen Feldzug. „Proviant“ ist im militärischen Zusammenhang prägnant und allgemein verständlich.
- source_word: לָעָם
  choice: für das Volk
  rationale: Die Grundbedeutung von עָם bleibt erhalten. Im Kontext ist damit das versammelte Aufgebot gemeint, doch „Volk“ vermeidet eine unnötige Verengung auf „Heer“ oder „Truppen“.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: damit dieses bei seiner Ankunft … handelt
  rationale: Die hebräische Infinitivfolge ist stark verdichtet. Die Übersetzung entfaltet den Zweckbezug und verbindet das Handeln verständlich mit der Ankunft, ohne die Art der vorgesehenen Maßnahme näher zu bestimmen.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: in Gibea in Benjamin
  rationale: Die Formulierung bezeichnet das Ziel der Ankunft. Das zweite „in“ versteht Benjamin als Stammesgebiet; alternativ wäre „Gibea der Benjaminiter“ möglich.
- source_word: כְּכָל הַנְּבָלָה
  choice: entsprechend der ganzen Schandtat
  rationale: נְבָלָה bezeichnet hier eine empörende, moralisch verwerfliche Tat. „Schandtat“ bewahrt die starke ethische Wertung, ohne eine spätere dogmatische Kategorie einzutragen.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: die die Stadt in Israel begangen hat
  rationale: Das Verb steht maskulin Singular. „Die Stadt“ macht den im Kontext naheliegenden korporativen Bezug auf Gibea verständlich, ohne die Täterschaft auf eine einzelne ausdrücklich ungenannte Person festzulegen.
theological_decisions:
- issue: Wiedergabe der moralisch stark wertenden Bezeichnung נְבָלָה
  choice: Schandtat
  alternative: empörende Tat; schändliche Tat; Torheit
  rationale: „Schandtat“ vermittelt die Schwere des Vergehens in natürlichem modernem Deutsch. „Torheit“ wäre zwar eine mögliche Grundbedeutung, würde hier aber die moralische und gesellschaftliche Empörung zu schwach ausdrücken.
- issue: Subjekt der in Israel begangenen Tat
  choice: Gibea als korporativ verantwortliche Stadt
  alternative: 'unpersönlich: „die in Israel begangen wurde“; personenbezogen: „die er begangen hat“'
  rationale: Der maskuline Singular lässt einen korporativen Bezug auf den Ort beziehungsweise seine Bewohner zu. Die Formulierung bewahrt die aktive Verantwortungszuschreibung, ohne einen einzelnen Täter in den Text einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zahlenfolge bleibt bewusst vollständig erhalten. Der verdichtete hebräische Zweckausdruck wird nur so weit entfaltet, wie es für verständliches Deutsch nötig ist; die genaue Art des Handelns gegen Gibea bleibt wie im Ausgangstext offen.
