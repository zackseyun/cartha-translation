base_translation:
  language: en
  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: de
  text: Da machten sich die Israeliten am Morgen auf und schlugen ihr Lager gegen Gibea auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֥וּמוּ
  choice: machten sich … auf
  rationale: Das Wayyiqtol von קום führt die Handlung erzählerisch fort. Im militärischen Zusammenhang gibt „sich aufmachen“ die Bewegung natürlicher wieder als das wörtlichere „aufstehen“, ohne ein bestimmtes Ziel hinzuzufügen.
- source_word: בְנֵֽי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet hier das Volk Israel. „Die Israeliten“ ist im modernen Deutschen die natürliche und genaue Entsprechung; „die Söhne Israels“ wäre missverständlich und unnötig wörtlich.
- source_word: בַּבֹּ֑קֶר
  choice: am Morgen
  rationale: Die Präposition mit dem bestimmten Substantiv bezeichnet den Zeitpunkt; „am Morgen“ ist die idiomatische deutsche Wiedergabe.
- source_word: וַיַּֽחֲנ֖וּ
  choice: schlugen ihr Lager … auf
  rationale: חנה bezeichnet das Lagern beziehungsweise Aufschlagen eines Lagers. Die gewählte Formulierung ist gegenwärtiges, gut verständliches Deutsch.
- source_word: עַל
  choice: gegenüber von
  rationale: Bei einer Ortsangabe kann עַל die Position bei beziehungsweise vor einem Ort ausdrücken. Der Zusammenhang ist feindlich, doch die Präposition selbst muss nicht ausdrücklich „gegen“ bedeuten; „gegenüber von“ bewahrt die räumliche Aussage und lässt den militärischen Kontext wirken.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Der Ausdruck bezeichnet den Ortsnamen Gibea. Der hebräische Artikel wird im Deutschen nicht gesondert wiedergegeben.
theological_decisions: []
translation_notes:
  register: Natürliche, würdige moderne Erzählsprache. Die Satzfolge bildet die beiden aufeinanderfolgenden hebräischen Wayyiqtol-Formen ab, ohne hebraisierende Wortstellung.
