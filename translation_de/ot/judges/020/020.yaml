  text: וַ/יֵּצֵא֙ אִ֣ישׁ יִשְׂרָאֵ֔ל לַ/מִּלְחָמָ֖ה עִם בִּנְיָמִ֑ן וַ/יַּעַרְכ֨וּ אִתָּ֧/ם אִֽישׁ יִשְׂרָאֵ֛ל מִלְחָמָ֖ה אֶל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: de
  text: Die Männer Israels zogen zum Kampf gegen Benjamin aus und stellten sich bei Gibea gegen sie zur Schlacht auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zogen … aus
  rationale: יצא bezeichnet im militärischen Erzählzusammenhang das Ausziehen zum Kampf; die deutsche Verbklammer gibt dies natürlich wieder.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Der morphologische Singular אִישׁ wird hier kollektiv für die israelitischen Kämpfer gebraucht; der deutsche Plural wahrt sowohl den kollektiven als auch den männlichen Bezug.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Präpositionalverbindung bezeichnet Ziel beziehungsweise Zweck des Ausziehens und wird knapp und idiomatisch wiedergegeben.
- source_word: עִם בִּנְיָמִן
  choice: gegen Benjamin
  rationale: עִם kann wörtlich »mit« bedeuten, bezeichnet im eindeutigen Kriegskontext hier jedoch die gegnerische Partei.
- source_word: וַיַּעַרְכוּ … מִלְחָמָה
  choice: stellten sich … zur Schlacht auf
  rationale: ערך mit מִלְחָמָה bezeichnet das Ordnen beziehungsweise Aufstellen von Truppen zur Schlacht.
- source_word: אִתָּם
  choice: gegen sie
  rationale: Obwohl die Präposition formal »mit ihnen« lauten kann, ist ihr Verhältnis hier feindlich; »gegen sie« verhindert im Deutschen das Missverständnis eines gemeinsamen Aufmarschs.
- source_word: אֶל הַגִּבְעָה
  choice: bei Gibea
  rationale: אֶל bezeichnet hier im Zusammenhang der Truppenaufstellung wahrscheinlich die örtliche Ausrichtung beziehungsweise Lage bei der Stadt; »bei Gibea« ist natürlich und überbestimmt die Richtung nicht.
theological_decisions:
- issue: Geschlechtsspezifischer Kollektivausdruck אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  alternative: Israel / die israelitischen Streitkräfte
  rationale: Der Ausdruck bezeichnet in diesem Kampfbericht kollektiv die männlichen Kämpfer. Die Übersetzung erhält diesen konkreten Bezug, statt ihn durch eine geschlechtsneutrale Abstraktion zu ersetzen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Die Wiederholung von »die Männer Israels« im Hebräischen wird im zweiten Satzglied durch das natürliche deutsche Reflexivpronomen aufgenommen, ohne den Referenten zu verdunkeln.
