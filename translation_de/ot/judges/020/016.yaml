  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: de
  text: Aus diesem ganzen Volk waren siebenhundert ausgewählte Männer in der rechten Hand eingeschränkt[a]. Jeder von ihnen konnte einen Stein nach einem Haar schleudern und es nicht verfehlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Linkshänder«. Wörtlicher beschreibt das Hebräische Männer, die in ihrer rechten Hand eingeschränkt oder behindert waren; im militärischen Zusammenhang ist wahrscheinlich gemeint, dass sie mit der linken Hand kämpften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: Unter diesem ganzen Volk
  rationale: Die partitive Bedeutung »aus der Gesamtheit dieses Volkes« wird in natürlichem Deutsch wiedergegeben, ohne עָם vorschnell auf »Truppen« einzuengen.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: siebenhundert ausgewählte Männer
  rationale: אִישׁ dient als Zählwort für erwachsene Männer; בָּחוּר bezeichnet hier ausgesuchte beziehungsweise besonders geeignete Männer.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: deren rechte Hand eingeschränkt war
  rationale: Die Wiedergabe wahrt die konkrete hebräische Formulierung einer Einschränkung der rechten Hand; im militärischen Zusammenhang ist damit wahrscheinlich linkshändiges Kämpfen gemeint.
- source_word: כָּל זֶה
  choice: Jeder von ihnen
  rationale: Die distributive Aussage über die Fähigkeit jedes einzelnen Mannes kommt so klar und idiomatisch zum Ausdruck.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: konnte einen Stein ... schleudern
  rationale: Das Partizip beschreibt eine charakteristische Fertigkeit; »konnte« drückt diese Fähigkeit im Deutschen natürlich aus.
- source_word: אֶל הַשַּׂעֲרָה
  choice: auf ein Haar
  rationale: Die konkrete Metapher für äußerste Zielgenauigkeit bleibt erhalten.
- source_word: וְלֹא יַחֲטִא
  choice: ohne es zu verfehlen
  rationale: חטא bedeutet hier konkret, ein Ziel zu verfehlen, nicht moralisch zu sündigen.
