  source_fidelity: Die partitive Wendung מִכֹּל הָעָם הַזֶּה bedeutet „aus/von diesem ganzen Volk“; „unter diesem ganzen Volk“ ist dagegen vorwiegend lokativ und daher ungenau. Die vorsichtige Wiedergabe der hebräischen Idiomatik zu der rechten Hand sollte beibehalten werden, ohne die wahrscheinliche Bedeutung „Linkshänder“ im Haupttext festzuschreiben. Die Aussage über das Treffen eines Haares und das Nichtverfehlen wird in der Revision idiomatischer und weiterhin bildhaft wiedergegeben.
  naturalness: „Aus diesem ganzen Volk“ ist im Deutschen die natürliche partitive Form. „In der rechten Hand eingeschränkt“ ist verständlicher und weniger missverständlich als „deren rechte Hand eingeschränkt war“. Die bisherige Verbindung „auf ein Haar schleudern“ ist unidiomatisch; „nach einem Haar schleudern und es nicht verfehlen“ gibt Bild und Sinn klar wieder.
  terminology: „Ausgewählte Männer“ und „Stein“ sind angemessen. Die Fußnote bewahrt die lexikalische und idiomatische Offenheit von אִטֵּר יַד יְמִינוֹ und nennt „Linkshänder“ nur als wahrscheinliche kontextuelle Deutung.
