  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֞וּ פִּנּ֣וֹת כָּל הָ/עָ֗ם כֹּ֚ל שִׁבְטֵ֣י יִשְׂרָאֵ֔ל בִּ/קְהַ֖ל עַ֣ם הָ/אֱלֹהִ֑ים אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ רַגְלִ֖י שֹׁ֥לֵֽף חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: de
  text: 'Und die führenden Männer des ganzen Volkes[a], aller Stämme Israels, nahmen ihren Platz in der Versammlung des Volkes Gottes ein: 400.000 Fußsoldaten, die das Schwert zogen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »die Ecken des ganzen Volkes«; eine bildhafte Bezeichnung für seine führenden oder maßgeblichen Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: nahmen ihren Platz ein
  rationale: Das Hitpael von יצב bezeichnet das bewusste Einnehmen einer Position. Die Formulierung ist im Deutschen natürlich und lässt sowohl die geordnete Aufstellung als auch die Bereitschaft der Versammelten anklingen.
- source_word: פִּנּוֹת
  choice: die führenden Männer
  rationale: Wörtlich bedeutet das Wort »Ecken«; hier ist es metaphorisch auf die tragenden beziehungsweise maßgeblichen Männer des Volkes bezogen. »Führende Männer« gibt das Idiom verständlich wieder, ohne einen bestimmten Amtstitel einzuführen.
- source_word: כָּל הָעָם
  choice: des ganzen Volkes
  rationale: Die Übersetzung bewahrt den umfassenden Sinn des hebräischen Kollektivausdrucks.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aller Stämme Israels
  rationale: 'Die Genitivfügung erhält die appositionelle Erläuterung: Das ganze Volk wird durch alle Stämme Israels repräsentiert.'
- source_word: בִּקְהַל
  choice: in der Versammlung
  rationale: קהל bezeichnet hier die zusammengekommene Gemeinschaft. »Versammlung« ist gegenwärtig, würdig und vermeidet eine unnötig kirchliche Einengung.
- source_word: עַם הָאֱלֹהִים
  choice: des Volkes Gottes
  rationale: Die formnahe Wiedergabe bewahrt die theologische Bezeichnung Israels und die hebräische Genitivstruktur.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: '400.000'
  rationale: Direkte Wiedergabe der Zahl in moderner deutscher Schreibweise.
- source_word: אִישׁ רַגְלִי
  choice: Fußsoldaten
  rationale: Der Ausdruck meint Männer, die zu Fuß kämpfen. »Fußsoldaten« ist verständlich und weniger fachsprachlich als »Infanteristen«.
- source_word: שֹׁלֵף חָרֶב
  choice: die das Schwert zogen
  rationale: Die singularische Wendung nach der großen Zahlenangabe hat kollektiven beziehungsweise distributiven Sinn. Der Relativsatz bewahrt das lebhafte Bild des Schwertziehens, ohne durch »jeder« die Verteilung ausdrücklich festzulegen.
theological_decisions:
- issue: Wiedergabe von עַם הָאֱלֹהִים
  choice: Volk Gottes
  alternative: Gottes Volk
  rationale: »Volk Gottes« bildet die hebräische Konstruktion transparent ab und bewahrt die feierliche, theologische Bezeichnung, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt stellt die nachfolgende Truppenstärke als nähere Bestimmung der Versammlung heraus. Das ungewöhnliche hebräische Bild »Ecken« wird im Text idiomatisch wiedergegeben und in der Fußnote offengelegt.
