source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אִֽם תַּעֲשׂ֖וּ/ן כָּ/זֹ֑את כִּ֛י אִם נִקַּ֥מְתִּי בָ/כֶ֖ם וְ/אַחַ֥ר אֶחְדָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: de
  text: 'Da sagte Simson zu ihnen: »Wenn ihr so handelt, dann werde ich mich an euch rächen, und danach werde ich aufhören.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: Wenn ihr so handelt
  rationale: Gibt die konditionale Wendung natürlich wieder; כָּזֹאת verweist auf das unmittelbar zuvor berichtete Vorgehen der Philister.
- source_word: כִּי אִם
  choice: werde ich nicht ruhen, bis
  rationale: Die Verbindung nach dem vorangestellten Bedingungssatz ist emphatisch und kann idiomatisch als Entschlossenheit wiedergegeben werden. Ein ausdrücklicher Schwur steht im Hebräischen nicht.
- source_word: נִקַּמְתִּי בָכֶם
  choice: ich mich an euch gerächt habe
  rationale: Das perfektische Verb bezeichnet hier im Zusammenhang mit dem folgenden וְאַחַר אֶחְדָּל eine erst noch abzuschließende Vergeltung.
- source_word: וְאַחַר אֶחְדָּל
  choice: Danach höre ich auf
  rationale: Bewahrt die knappe zeitliche Folge und lässt offen, wovon Simson dann ablässt.
theological_decisions:
- issue: Schwur oder emphatische Entschlossenheit
  choice: Keinen ausdrücklichen Schwur ergänzen
  alternative: »dann schwöre ich«
  rationale: כִּי אִם verstärkt Simsons Aussage, enthält aber kein explizites Schwurverb. Die Übersetzung soll diese Kategorie nicht ohne klare sprachliche Grundlage einführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und knapper Rede. Die Wiederholung von »Danach« wahrt Simsons angekündigte Abfolge; die Formulierung vermeidet eine unnötige Präzisierung dessen, womit er aufhören will.
