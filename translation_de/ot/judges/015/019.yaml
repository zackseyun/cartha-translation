source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: de
  text: Da spaltete Gott die Vertiefung, die in Lehi war[a], und Wasser kam aus ihr hervor. Er trank; da kehrte sein Geist zurück, und er lebte wieder auf. Darum gab er ihr den Namen En-Hakkore[b]. Sie befindet sich bis auf den heutigen Tag in Lehi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere mögliche Wiedergabe: „Da spaltete Gott die Vertiefung im Kieferknochen, und Wasser kam aus ihm hervor.“ Das hebräische Wort Lehi kann auch „Kiefer“ oder „Kieferknochen“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: En-Hakkore bedeutet wahrscheinlich „Quelle des Rufenden“ oder „Quelle dessen, der rief“ und nimmt damit auf Simsons Hilferuf zu Gott Bezug.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: spaltete
  rationale: Das Verb bezeichnet ein gewaltsames Aufspalten oder Aufbrechen. „Spaltete“ gibt die konkrete Handlung knapp und anschaulich wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang handelt der Gott Israels unmittelbar; „Gott“ ist die sachgemäße Wiedergabe.
- source_word: הַמַּכְתֵּשׁ
  choice: die Vertiefung
  rationale: Das Substantiv kann einen Mörser beziehungsweise eine mörserartige Mulde bezeichnen. Hier passt die topografische Bedeutung „Vertiefung“, ohne ein Haushaltsgerät in den Text hineinzutragen.
- source_word: בַּלֶּחִי
  choice: bei Lehi
  rationale: Lehi dient in diesem Zusammenhang als Ortsname. „Bei Lehi“ entspricht zudem der abschließenden Ortsangabe des Verses.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: und Wasser kam aus ihr hervor
  rationale: Der hebräische Pluralausdruck für Wasser wird im Deutschen idiomatisch als Singular wiedergegeben. „Kam … hervor“ bleibt nah am beschriebenen Vorgang.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: da kehrte sein Geist zurück
  rationale: רוּחַ kann Geist, Atem oder Lebenskraft bezeichnen. Die formnahe Wiedergabe „Geist“ bewahrt diese Bedeutungsweite, statt sie auf körperliche Kraft oder Atmung festzulegen.
- source_word: וַיֶּחִי
  choice: und er lebte wieder auf
  rationale: Gemeint ist die Wiederherstellung seiner Lebenskraft nach dem Zusammenbruch, nicht eine Auferstehung von den Toten. „Lebte wieder auf“ trifft diesen Sinn natürlich.
- source_word: קָרָא שְׁמָהּ
  choice: gab er ihr den Namen
  rationale: Die deutsche Namengebungsformel ist natürlicher als eine wörtliche Wiedergabe mit „nannte ihren Namen“. Das feminine Suffix wird mit „ihr“ bewahrt und auf die benannte Quelle beziehungsweise Örtlichkeit bezogen.
- source_word: עֵין הַקּוֹרֵא
  choice: En-Hakkore
  rationale: Der Eigenname wird im Haupttext transliteriert; seine für die Erzählung bedeutsame Bedeutung wird in einer Fußnote erklärt.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Dies ist eine geläufige, würdige deutsche Wiedergabe der hebräischen Zeitformel.
theological_decisions:
- issue: Bezug von בַּלֶּחִי und Ort der Wasserquelle
  choice: Lehi wird im Haupttext als Ortsname verstanden; die Vertiefung befindet sich bei Lehi.
  alternative: Gott spaltete die Vertiefung im Kieferknochen, und das Wasser kam aus ihm hervor.
  rationale: Der unmittelbare Zusammenhang verwendet Lehi wiederholt als Ortsnamen, und die Schlussaussage, die benannte Quelle befinde sich dort „bis auf den heutigen Tag“, stützt die geografische Deutung. Da לֶחִי zugleich „Kiefer/Kieferknochen“ bedeutet, wird die andere mögliche Lesart in einer Fußnote erhalten.
translation_notes:
  register: 'Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die kurzen Satzfolgen spiegeln den hebräischen Erzählfluss. „Geist“ bewahrt bewusst die Mehrdeutigkeit von רוּחַ zwischen Geist, Atem und Lebenskraft. Die Fußnotenmarker sind nach ihrem tatsächlichen Bezug gesetzt: [a] erläutert die alternative Kieferknochen-Lesart bei Lehi, [b] die Bedeutung von En-Hakkore.'
