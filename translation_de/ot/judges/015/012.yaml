review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die beiden Zweckangaben („um dich zu fesseln“ und „[um] dich … auszuliefern“) sowie die hebräische Bildwendung „in die Hand der Philister“ zutreffend wieder. Die betonte Anrede אַתֶּם ist mit „ihr selbst“ sachgerecht erfasst. Für פֶּן תִּפְגְּעוּן בִּי ist „angreift“ eine klare, kontextgemäße und weniger idiomatisch mehrdeutige Wiedergabe.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. In der Schlussfrage steht „selbst“ in „dass ihr nicht selbst über mich herfallt“ jedoch an einer Stelle, an der es auch die Art des Angriffs statt die hervorgehobenen Handelnden akzentuieren kann. „dass ihr selbst mich nicht angreift“ ist klarer und entspricht dem heutigen Sprachgebrauch besser.
  terminology: „fesseln“, „ausliefern“ und „in die Hand der Philister“ sind treffend. Der Eigenname „Simson“ ist die etablierte deutsche Form. Es sind keine theologischen Fachbegriffe oder Fußnotenanker betroffen.
  issues:
  - severity: low
    issue: Stellung und Idiomatik von „selbst“ in der Schlussklausel
    rationale: Das ausdrücklich gesetzte hebräische אַתֶּם hebt hervor, dass die Männer Judas Simson nicht selbst angreifen sollen. Die Umstellung zu „dass ihr selbst mich nicht angreift“ macht diesen Bezug eindeutig, ohne die kontrollierte Offenheit von פגע („angreifen/über jemanden herfallen“) unnötig einzuengen.
