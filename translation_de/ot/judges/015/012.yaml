base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: de
  text: 'Sie sagten zu ihm: »Wir sind herabgekommen, um dich zu fesseln und dich in die Hand der Philister auszuliefern.« Simson sagte zu ihnen: »Schwört mir, dass ihr selbst mich nicht angreift.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: um dich zu fesseln
  rationale: Der Infinitiv von אסר bezeichnet hier das Binden beziehungsweise Fesseln einer Person.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: dich in die Hand der Philister auszuliefern
  rationale: Die hebräische Wendung wird in ihrem Bild bewahrt; „ausliefern“ gibt die beabsichtigte Übergabe natürlich wieder.
- source_word: פֶּן תִּפְגְּעוּן בִּי אַתֶּם
  choice: dass ihr nicht selbst über mich herfallt
  rationale: פגע kann hier einen feindlichen Angriff bezeichnen. „selbst“ gibt das ausdrücklich gesetzte Pronomen אַתֶּם wieder und stellt die Judäer den Philistern gegenüber.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtliche Bildsprache „in die Hand“ bleibt erhalten; „über mich herfallen“ vermittelt die gewaltsame Bedeutung des Verbs im Kontext, ohne den Ausgang näher festzulegen.
