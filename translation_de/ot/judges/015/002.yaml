  source_fidelity: Die Grundbedeutung wird weitgehend zutreffend wiedergegeben, einschließlich der beiden verstärkenden Infinitivkonstruktionen, des offenen Begriffs für den Gefährten und des substitutiven „an ihrer Stelle“. Der Konjunktiv „du würdest ... hassen“ verschiebt jedoch die hebräische Annahme des Vaters von einem bereits bestehenden bzw. vergangenen Hass zu einem zukünftigen Hass.
  naturalness: Die direkte Rede ist klar und modern. „Du würdest sie ... hassen“ klingt hier allerdings semantisch unpassend, weil es eine Zukunftserwartung ausdrückt. Eine Perfektform gibt die beabsichtigte Annahme idiomatisch und präzise wieder.
  terminology: „Gefährte“ ist als bewusst weiter Begriff für מֵרֵעַ angemessen. „Jüngere Schwester“, „besser“ und „an ihrer Stelle“ bewahren die semantische Offenheit des Hebräischen. Die Fußnote ist inhaltlich angemessen, wird aber sprachlich geglättet.
