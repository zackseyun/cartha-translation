base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: de
  text: 'Da sagte ihr Vater: »Ich war wirklich der Meinung, dass du sie ganz und gar gehasst hast; deshalb gab ich sie deinem Gefährten[a]. Ist nicht ihre jüngere Schwester besser als sie? Bitte nimm sie an ihrer Stelle.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinem Freund«. Das hebräische Wort kann allgemein einen Freund, Gefährten oder Vertrauten bezeichnen. In diesem Hochzeitszusammenhang verstehen manche darunter den Mann, der Simson bei der Hochzeit als Begleiter zur Seite stand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֹר אָמַרְתִּי
  choice: Ich dachte wirklich
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. Die gewählte Formulierung gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: du würdest sie ganz und gar hassen
  rationale: Die hebräische Intensivkonstruktion wird ausdrücklich wiedergegeben; der Konjunktiv markiert den Inhalt der damaligen Annahme des Vaters.
- source_word: וָאֶתְּנֶנָּה
  choice: deshalb gab ich sie
  rationale: Das erzählende Waw hat hier im Gedankengang des Vaters eine folgernde Funktion.
- source_word: לְמֵרֵעֶךָ
  choice: deinem Gefährten
  rationale: מֵרֵעַ bezeichnet einen Freund, Gefährten oder Vertrauten. »Gefährte« bleibt bewusst weiter als eine spezifische Hochzeitsfunktion.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: ihre jüngere Schwester
  rationale: Bei Geschwistern bezeichnet קְטַנָּה idiomatisch die jüngere Schwester.
- source_word: טוֹבָה מִמֶּנָּה
  choice: besser als sie
  rationale: טוֹבָה lässt die Art der Überlegenheit offen; die Übersetzung engt sie nicht auf Schönheit oder Attraktivität ein.
- source_word: תְּהִי נָא לְךָ תַּחְתֶּיהָ
  choice: Bitte nimm sie an ihrer Stelle
  rationale: Die Formulierung gibt die höflich vorgebrachte Aufforderung und den Gedanken des Ersatzes natürlich wieder, ohne das im Hebräischen nur implizierte Heiraten ausdrücklich hinzuzufügen.
