id: JDG.15.3
reference: Judges 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן נִקֵּ֥יתִי הַ/פַּ֖עַם מִ/פְּלִשְׁתִּ֑ים כִּֽי עֹשֶׂ֥ה אֲנִ֛י עִמָּ֖/ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: de
  text: 'Und Simson sagte zu ihnen: „Diesmal bin ich gegenüber den Philistern frei von Schuld[a], wenn ich ihnen Schaden zufüge[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bin ich hinsichtlich der Philister unschuldig“; gemeint ist das Freisein von Schuld oder Haftung ihnen gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Böses antue“. Im Zusammenhang bezeichnet der Ausdruck eine schädigende, feindselige Handlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; „Und“ bewahrt den hebräischen Erzählfluss, ohne eine genauere zeitliche Beziehung festzulegen.
- source_word: לָהֶם
  choice: zu ihnen
  rationale: Gibt die Präposition mit dem Suffix der 3. Person maskulin Plural unmittelbar wieder; auf wen sich das Pronomen bezieht, ergibt sich aus dem Kontext.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Entspricht der im Deutschen üblichen biblischen Namensform.
- source_word: נִקֵּיתִי
  choice: bin … frei von Schuld
  rationale: נקה bezeichnet hier das Freisein von Schuld oder Haftung. Die resultativ-stative Aussage wird im Deutschen natürlich mit dem Präsens wiedergegeben.
- source_word: הַפַּעַם
  choice: Diesmal
  rationale: Die idiomatische Zeitangabe kennzeichnet eine neue Stufe des Konflikts.
- source_word: מִפְּלִשְׁתִּים
  choice: gegenüber den Philistern
  rationale: מִן bezeichnet nach נקה das Freisein von Schuld in Bezug auf eine Personengruppe; „gegenüber“ gibt diese Beziehung präzise und idiomatisch wieder.
- source_word: כִּי
  choice: wenn
  rationale: כִּי führt hier den Umstand ein, unter dem Simson sich für schuldlos hält. Die konditional-temporale Wiedergabe erhält die im Zusammenhang naheliegende Logik, ohne die Konjunktion ausdrücklich kausal festzulegen.
- source_word: עֹשֶׂה אֲנִי
  choice: ich … zufüge
  rationale: Das Partizip mit ausdrücklich gesetztem Pronomen kann eine bevorstehende oder einsetzende Handlung bezeichnen. Im deutschen wenn-Satz ist das Präsens dafür natürlich.
- source_word: עִמָּם
  choice: ihnen
  rationale: עשה mit עִם bedeutet in dieser Verbindung, jemandem etwas anzutun; der deutsche Dativ ist idiomatisch.
- source_word: רָעָה
  choice: Schaden
  rationale: רָעָה kann „Böses“ bedeuten, bezeichnet hier aber konkret die schädigende Vergeltungshandlung. „Schaden zufügen“ gibt den Vorgang natürlich wieder, ohne die mögliche wörtlich-moralische Nuance zu verschweigen.
theological_decisions:
- issue: Simsons Behauptung, frei von Schuld zu sein
  choice: Als direkte Selbsteinschätzung Simsons wiedergegeben, ohne sie zu bestätigen oder zu verurteilen.
  alternative: Die Aussage durch „im Recht“ oder eine wertende Ergänzung moralisch zu deuten.
  rationale: Der hebräische Text berichtet Simsons Anspruch, spricht aber an dieser Stelle kein ausdrückliches göttliches Urteil darüber aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frei von Schuld“ wahrt den rechtlich-moralischen Klang von נקה; „Schaden zufügen“ ist im Vergeltungskontext natürlich, während die Fußnote die wörtlichere Wiedergabe „Böses antun“ dokumentiert.
