  text: וַ/יִּמְצָ֥א לְחִֽי חֲמ֖וֹר טְרִיָּ֑ה וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יַּךְ בָּ֖/הּ אֶ֥לֶף אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: de
  text: Da fand er einen frischen Eselskinnbacken[a]. Er streckte seine Hand aus, nahm ihn und erschlug damit tausend Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen neuen Eselskinnbacken“. Das hebräische Adjektiv kann etwas Frisches beziehungsweise noch nicht Ausgetrocknetes oder etwas neu Verfügbares bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Da fand er
  rationale: Das narrative Wayyiqtol wird als schlichtes vergangenes Geschehen wiedergegeben; „da“ wahrt den erzählerischen Fortgang.
- source_word: לְחִי חֲמוֹר
  choice: Eselskinnbacken
  rationale: לְחִי bezeichnet hier den Kinnbacken beziehungsweise Kieferknochen; im Deutschen ist „Eselskinnbacken“ eine natürliche und anschauliche Bezeichnung für den als Waffe verwendeten Knochen.
- source_word: טְרִיָּה
  choice: frischen
  rationale: Das Adjektiv bezeichnet etwas Frisches, noch nicht Ausgetrocknetes; dies lässt zugleich die mögliche Nuance „neu“ offen.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Er streckte seine Hand aus
  rationale: Die konkrete hebräische Wendung wird formal nah und zugleich idiomatisch deutsch wiedergegeben.
- source_word: וַיִּקָּחֶהָ
  choice: nahm ihn
  rationale: Das Suffix bezieht sich auf den im Deutschen maskulinen „Kinnbacken“; לקח bedeutet hier schlicht „nehmen“.
- source_word: וַיַּךְ בָּהּ
  choice: erschlug damit
  rationale: נכה bezeichnet ein Schlagen, das im Kampfzusammenhang tödlich ist. „Erschlug“ gibt das Ergebnis knapp und natürlich wieder; „damit“ bewahrt die instrumentale Formulierung.
- source_word: אֶלֶף אִישׁ
  choice: tausend Mann
  rationale: Die Wendung bezeichnet im Kampfkontext tausend männliche Gegner; „tausend Mann“ ist im Deutschen idiomatisch und präzise.
