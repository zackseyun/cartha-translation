source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ לֵ/אמֹ֗ר לֹ֚א כִּֽי אָסֹ֤ר נֶֽאֱסָרְ/ךָ֙ וּ/נְתַנּ֣וּ/ךָ בְ/יָדָ֔/ם וְ/הָמֵ֖ת לֹ֣א נְמִיתֶ֑/ךָ וַ/יַּאַסְרֻ֗/הוּ בִּ/שְׁנַ֨יִם֙ עֲבֹתִ֣ים חֲדָשִׁ֔ים וַֽ/יַּעֲל֖וּ/הוּ מִן הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: de
  text: 'Sie sagten zu ihm: „Nein! Wir werden dich ganz gewiss binden und ihnen ausliefern[a]; aber töten werden wir dich auf keinen Fall.“ Dann banden sie ihn mit zwei neuen Seilen und führten ihn vom Felsen[b] hinauf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wir werden dich in ihre Hand geben“; gemeint ist: in ihre Gewalt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von der Felsklippe“. Das hebräische Wort kann einen Felsen, eine Klippe oder eine felsige Höhe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Nein! … aber
  rationale: Die Wendung weist Simsons Befürchtung zurück und stellt ihr eine Einschränkung beziehungsweise Richtigstellung gegenüber. Die deutsche Formulierung gibt diesen Kontrast natürlich wieder.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: wir werden dich ganz gewiss binden
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Aussage; „ganz gewiss“ bewahrt diesen Nachdruck.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: ihnen ausliefern
  rationale: Die hebräische Wendung „in ihre Hand geben“ bezeichnet die Übergabe in ihre Gewalt. „Ihnen ausliefern“ gibt den Sinn in natürlichem modernem Deutsch wieder; das Handbild wird in der Fußnote dokumentiert.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: aber töten werden wir dich auf keinen Fall
  rationale: Die vorangestellte Verbform und die Konstruktion mit Infinitivus absolutus verleihen der Verneinung besonderen Nachdruck. Die deutsche Wortstellung und „auf keinen Fall“ bilden ihn deutlich ab.
- source_word: וַיַּאַסְרֻהוּ
  choice: banden sie ihn
  rationale: Die Wiederholung von „binden“ wahrt die lexikalische Verbindung zur unmittelbar vorausgehenden Zusage.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: mit zwei neuen Stricken
  rationale: עֲבֹתִים bezeichnet kräftige Schnüre oder Stricke. „Stricke“ ist im Deutschen klar und behält die erzählerisch bedeutsame Angabe „neu“ bei.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: führten ihn vom Felsen hinauf
  rationale: Die Hifil-Form von עלה bezeichnet hier ein Hinaufführen oder Hinaufbringen. סֶלַע kann einen Felsen, eine Felsklippe oder ein felsiges Gelände bezeichnen.
