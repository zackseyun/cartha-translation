revisions:
- from: Da ging Simson hin und fing dreihundert Füchse[a]. Er nahm Fackeln, wandte die Tiere Schwanz gegen Schwanz und steckte jeweils eine Fackel zwischen die beiden Schwänze, in die Mitte.
  to: Da ging Simson hin, fing dreihundert Füchse[a], nahm Fackeln, wandte sie Schwanz an Schwanz und setzte jeweils eine Fackel mitten zwischen die beiden Schwänze.
  rationale: 'Die Revision glättet zwei deutsche Formulierungen, ohne den Sinn zu erweitern: Die Tiere werden weiterhin lediglich Schwanz an Schwanz ausgerichtet, nicht ausdrücklich festgebunden; die Fackel wird je Paar mitten zwischen den zwei Schwänzen platziert. Die Fußnote erhält die sachlich vertretbare Alternative „Schakale“ und formuliert die lexikalische Reichweite zurückhaltend.'
