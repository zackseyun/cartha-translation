base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: de
  text: Da ging Simson hin, fing dreihundert Füchse[a], nahm Fackeln, wandte sie Schwanz an Schwanz und setzte jeweils eine Fackel mitten zwischen die beiden Schwänze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schakale“. Das hebräische Wort שׁוּעָלִים kann Füchse oder ähnliche Hundeartige bezeichnen und kann sich auch auf Schakale beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging hin
  rationale: Gibt den einleitenden wayyiqtol von הלך als schlichte Fortführung der Erzählung wieder.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Verwendet die im Deutschen fest etablierte biblische Namensform.
- source_word: וַיִּלְכֹּד
  choice: fing
  rationale: לכד bezeichnet hier das Einfangen lebender Tiere; „fing“ ist präzise und natürlich.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: dreihundert
  rationale: Direkte Wiedergabe der Zahlkonstruktion.
- source_word: שׁוּעָלִים
  choice: Füchse
  rationale: שׁוּעָלִים wird gewöhnlich mit „Füchse“ wiedergegeben, kann aber auch Schakale oder ähnliche Hundeartige bezeichnen; die Alternative bleibt in einer Fußnote erhalten.
- source_word: לַפִּדִים / לַפִּיד
  choice: Fackeln
  rationale: Moderne, verständliche Wiedergabe für brennende Fackeln oder Feuerbrände.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: wandte die Tiere Schwanz gegen Schwanz
  rationale: Bewahrt die Grundbedeutung von פנה („wenden“) und ergänzt das im Deutschen nötige Objekt, ohne ein im Hebräischen nicht ausdrücklich genanntes Festbinden einzutragen.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: steckte jeweils eine Fackel
  rationale: „Steckte“ bezeichnet die konkrete Platzierung zwischen den Schwänzen natürlich; „jeweils“ macht den wiederholten Vorgang deutlich.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת
  choice: zwischen die beiden Schwänze
  rationale: Formnahe Wiedergabe von „zwischen den zwei Schwänzen“; der distributive Sinn wird durch „jeweils“ ausgedrückt.
- source_word: בַּתָּוֶךְ
  choice: in die Mitte
  rationale: Bewahrt die abschließende, im Hebräischen ausdrücklich genannte Ortsbestimmung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die parataktische Handlungsfolge des Hebräischen bleibt erkennbar, wird aber in zwei deutsche Sätze gegliedert. Die ungewöhnliche Formulierung „Schwanz gegen Schwanz“ wahrt das konkrete Bild und vermeidet die nicht ausdrücklich belegte Ergänzung „band“.
