  source_fidelity: 'Die Abfolge und die wesentlichen Einzelheiten des Hebräischen sind zutreffend wiedergegeben: Simson fängt dreihundert Tiere, ordnet sie paarweise Schwanz an Schwanz an und bringt je Paar eine Fackel zwischen den Schwänzen an. Die lexikalische Alternative zu שׁוּעָלִים ist angemessen durch eine Fußnote markiert.'
  naturalness: Der Entwurf ist überwiegend verständlich, doch „steckte ... in die Mitte“ klingt im Deutschen unnötig konkret und die abschließende Ortsangabe ist nach „zwischen“ schwerfällig. „Setzte ... mitten zwischen“ gibt die Platzierung natürlicher wieder. „Schwanz an Schwanz“ ist die gebräuchlichere deutsche Entsprechung für die Anordnung.
  terminology: „Simson“, „Füchse“ und „Fackeln“ sind im modernen deutschen Bibelregister passend. Die Fußnote sollte die lexikalische Unsicherheit knapp ausdrücken, ohne die Zuordnung zu Schakalen als unbeschränkte Gewissheit darzustellen.
