  text: וַ/יִּשְׁפֹּ֧ט אֶת יִשְׂרָאֵ֛ל בִּ/ימֵ֥י פְלִשְׁתִּ֖ים עֶשְׂרִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/020.yaml
  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: de
  text: Und er richtete Israel in der Zeit der Philister zwanzig Jahre lang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er führte Israel in der Zeit der Philister zwanzig Jahre lang.“ Das hebräische Verb kann eine umfassendere Leitungsaufgabe bezeichnen, nicht nur richterliche Entscheidungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: richtete
  rationale: Das Verb שׁפט bezeichnet im Richterbuch die Tätigkeit eines Richters, die über gerichtliche Entscheidungen hinaus auch Leitung umfassen kann. „Richtete“ bewahrt den wiederkehrenden Schlüsselbegriff und die Verbindung zur Bezeichnung des Buches.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Eigenname steht als direktes Objekt; „Israel“ ist im Deutschen sowohl quellennah als auch idiomatisch.
- source_word: בִּימֵי פְלִשְׁתִּים
  choice: in der Zeit der Philister
  rationale: Die hebräische Wendung bedeutet wörtlich „in den Tagen der Philister“. „In der Zeit der Philister“ gibt den zeitlichen Sinn in natürlichem modernem Deutsch wieder, ohne ein Besitz- oder Herrschaftsverhältnis ausdrücklich hinzuzufügen.
- source_word: עֶשְׂרִים שָׁנָה
  choice: zwanzig Jahre lang
  rationale: Die Ergänzung „lang“ kennzeichnet die Angabe im Deutschen eindeutig als Dauer.
theological_decisions:
- issue: Bedeutungsumfang von שׁפט für Simsons Rolle
  choice: „richtete Israel“
  alternative: „führte Israel“ oder „war zwanzig Jahre lang Richter über Israel“
  rationale: „Richtete“ erhält die für das Richterbuch prägende Terminologie und legt Simsons Rolle weder auf moderne Rechtsprechung noch auf umfassende politische Herrschaft fest. Die Fußnote weist auf den weiteren möglichen Leitungssinn hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst bibelsprachliche Formulierung „richtete Israel“ bewahrt den Schlüsselbegriff des Richterbuches; „in der Zeit“ vermeidet die heute altertümlich wirkende Wendung „in den Tagen“.
