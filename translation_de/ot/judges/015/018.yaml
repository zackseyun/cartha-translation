source:
  edition: WLC
  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: de
  text: 'Da wurde er sehr durstig. Er rief zu Jahwe und sagte: »Du hast durch die Hand deines Dieners diese große Rettung[a] geschenkt. Und nun soll ich vor Durst sterben und in die Hand der Unbeschnittenen[b] fallen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesen großen Sieg“ beziehungsweise „diese große Befreiung“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind hier besonders die Philister. „Die Unbeschnittenen“ ist eine vom Zeichen des Bundes her geprägte Bezeichnung für Israels Feinde.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: Da wurde er sehr durstig
  rationale: Die Form bezeichnet im Zusammenhang den Eintritt starken Durstes; die deutsche Wendung ist natürlich und gibt מְאֹד deutlich wieder.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Er rief zu Jahwe
  rationale: קרא אל bezeichnet hier den an Gott gerichteten Ruf beziehungsweise die Bitte. „Rief zu“ bewahrt die Gebetssprache, ohne eine zusätzliche emotionale Wertung aufzudrängen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes statt ihn durch einen Titel zu ersetzen.
- source_word: אַתָּה נָתַתָּ בְיַד עַבְדְּךָ
  choice: Du hast durch die Hand deines Dieners … geschenkt
  rationale: בְיַד bezeichnet hier am ehesten das Mittel beziehungsweise die handelnde Person. „Durch die Hand“ erhält das hebräische Bild; „deines Dieners“ gibt Simsons ehrerbietige Selbstbezeichnung wieder.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: diese große Rettung
  rationale: תשועה umfasst Rettung, Befreiung und Sieg. „Rettung“ hält die konkrete militärische und die von Gott gewährte Dimension zusammen.
- source_word: וְעַתָּה אָמוּת בַּצָּמָא
  choice: Und nun soll ich vor Durst sterben?
  rationale: Die Fragekraft ergibt sich pragmatisch aus Simsons Klage, obwohl keine ausdrückliche Fragepartikel steht. „Vor Durst“ gibt die Ursache idiomatisch wieder.
- source_word: וְנָפַלְתִּי בְּיַד הָעֲרֵלִים
  choice: und in die Hand der Unbeschnittenen fallen
  rationale: נפל ביד bedeutet, in jemandes Gewalt zu geraten. Die wörtlich-nahe Form bewahrt sowohl das Hand-Bild als auch die bundestheologisch aufgeladene Bezeichnung der Gegner.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, ohne einen Titel an seine Stelle zu setzen.
- issue: Bedeutungsumfang von תְּשׁוּעָה
  choice: Rettung
  alternative: Sieg
  rationale: Im unmittelbaren Zusammenhang handelt es sich um einen militärischen Sieg, doch das Wort stellt zugleich Gottes rettendes Eingreifen heraus. „Rettung“ lässt beide Aspekte bestehen; die Alternative wird in der Fußnote genannt.
- issue: Bundesbezogene Bezeichnung הָעֲרֵלִים
  choice: die Unbeschnittenen
  alternative: die Philister
  rationale: Der Ausdruck bezeichnet hier besonders die Philister, formuliert dies aber aus Israels bundestheologischer Perspektive. Die wörtliche Wiedergabe erhält diese Spannung.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Satzbau folgt der rhetorischen Bewegung des Hebräischen: auf die eben erfahrene große Rettung folgt Simsons zugespitzte Klage. Das wiederkehrende Bild der „Hand“ bleibt erhalten, ohne die deutsche Verständlichkeit unnötig zu erschweren.'
