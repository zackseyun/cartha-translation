  source_fidelity: 'Der deutsche Text gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Simsons starker Durst, sein Anruf an Jahwe, die Anerkennung der durch ihn gewährten großen Rettung sowie die rhetorische Frage nach Tod durch Durst und Auslieferung an die „Unbeschnittenen“. „Durch die Hand deines Dieners“ bewahrt die hebräische Agentivmetapher; „in die Hand ... fallen“ gibt נפל ביד treffend wieder.'
