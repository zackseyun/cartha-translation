  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: de
  text: Als er Lehi[a] erreichte, kamen ihm die Philister mit lautem Geschrei entgegen. Da kam der Geist Jahwes mit Macht über ihn. Die Stricke an seinen Armen wurden wie Flachs, der im Feuer brennt, und seine Fesseln schmolzen ihm von den Händen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lehi ist ein Ortsname. Das hebräische Wort bedeutet auch „Kinnbacken“, ein wichtiges Motiv in der umgebenden Erzählung.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: Lehi
  rationale: Im Kontext bezeichnet das Wort den bereits genannten Ortsnamen. Seine Bedeutung „Kinnbacken“ bleibt für das Motiv der umgebenden Erzählung wichtig und wird deshalb in der Fußnote erläutert.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: kamen ihm ... mit lautem Geschrei entgegen
  rationale: הֵרִיעוּ bezeichnet einen lauten Ruf, häufig im Kampf oder Triumph; לִקְרָאתוֹ drückt das Entgegenkommen zur Begegnung aus. Die Wiedergabe erhält beide Aspekte, ohne den Ruf enger als „Kriegsgeschrei“ festzulegen.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Da kam der Geist Jahwes mit Macht über ihn
  rationale: צלח mit רוּחַ יְהוָה beschreibt in Richter ein plötzliches, kraftvolles göttliches Wirken. „Mit Macht über ihn kommen“ ist im Deutschen natürlich und bewahrt die Dynamik, ohne zusätzliche theologische Kategorien einzutragen.
- source_word: הָעֲבֹתִים
  choice: die Stricke
  rationale: Das Wort bezeichnet starke Schnüre oder Stricke, mit denen jemand gebunden wird. „Stricke“ passt natürlich zum erzählten Vorgang.
- source_word: זְרוֹעוֹתָיו
  choice: seinen Armen
  rationale: זְרוֹעַ bezeichnet hier allgemein den Arm; „Unterarme“ wäre unnötig spezifisch.
- source_word: כַּפִּשְׁתִּים
  choice: wie Flachs
  rationale: פִשְׁתִּים bezeichnet Flachs. Die knappe Wiedergabe erhält das konkrete Vergleichsbild.
- source_word: אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: der im Feuer verbrannt ist
  rationale: Die Formulierung beschreibt Flachs, dessen Festigkeit durch Feuer zerstört wurde. Das deutsche Perfekt bewahrt den resultativen Sinn des Bildes.
- source_word: וַיִּמַּסּוּ
  choice: schmolzen ... weg
  rationale: מסס bedeutet „schmelzen, sich auflösen“. Die bildhafte Ausdrucksweise des Hebräischen wird beibehalten.
- source_word: אֱסוּרָיו
  choice: seine Fesseln
  rationale: Das Nomen bezeichnet das, womit er gebunden war. „Fesseln“ ist verständlich und legt anders als „Ketten“ kein Metall nahe.
- source_word: מֵעַל יָדָיו
  choice: von seinen Händen weg
  rationale: Dies gibt das wörtliche Bild „von über seinen Händen“ in natürlichem Deutsch wieder, ohne interpretierend „Handgelenke“ einzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Befähigung Simsons
  choice: der Geist Jahwes kam mit Macht über ihn
  alternative: der Geist Jahwes stürmte auf ihn ein
  rationale: Die gewählte Formulierung bewahrt die plötzliche und kraftvolle Wirkung des hebräischen Idioms, klingt im modernen Standarddeutsch jedoch natürlicher und vermeidet den möglichen Eindruck eines feindlichen Angriffs.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge und die konkreten Bilder des Hebräischen bleiben weitgehend erhalten; ungewöhnliche hebräische Metaphorik wie das Wegschmelzen der Fesseln wird nicht geglättet.
