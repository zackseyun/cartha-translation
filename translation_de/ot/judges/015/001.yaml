  text: וַ/יְהִ֨י מִ/יָּמִ֜ים בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּפְקֹ֨ד שִׁמְשׁ֤וֹן אֶת אִשְׁתּ/וֹ֙ בִּ/גְדִ֣י עִזִּ֔ים וַ/יֹּ֕אמֶר אָבֹ֥אָה אֶל אִשְׁתִּ֖/י הֶ/חָ֑דְרָ/ה וְ/לֹֽא נְתָנ֥/וֹ אָבִ֖י/הָ לָ/בֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: de
  text: 'Einige Zeit später, zur Zeit der Weizenernte, besuchte Simson seine Frau und brachte ein Zicklein mit. Er sagte: »Ich will zu meiner Frau ins innere Zimmer[a] gehen.« Doch ihr Vater ließ ihn nicht hinein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Kammer«. Das Hebräische bezeichnet wahrscheinlich einen inneren Raum; im Zusammenhang ist ein privater ehelicher Raum gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Einige Zeit später
  rationale: Die hebräische Wendung bezeichnet einen nicht näher bestimmten Zeitabstand. Die Übersetzung gibt dies natürlich wieder, ohne die erzählerische Formel unnötig wörtlich abzubilden.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: zur Zeit der Weizenernte
  rationale: Diese Formulierung bewahrt die konkrete jahreszeitliche Angabe und klingt im modernen Deutschen natürlicher als eine wörtliche Wiedergabe mit »in den Tagen«.
- source_word: וַיִּפְקֹד
  choice: besuchte
  rationale: פקד bedeutet hier kontextbedingt, jemanden aufzusuchen beziehungsweise zu besuchen, nicht mustern, einsetzen oder bestrafen.
- source_word: אֶת אִשְׁתּוֹ
  choice: seine Frau
  rationale: Obwohl die Beziehung durch den vorangehenden Konflikt belastet ist, bezeichnet der hebräische Text sie weiterhin ausdrücklich als seine Frau.
- source_word: בִּגְדִי עִזִּים
  choice: und brachte ein Ziegenböckchen mit
  rationale: גְּדִי עִזִּים bezeichnet ein junges Tier aus der Ziegenherde. »Ziegenböckchen« ist verständlich und stellt im Kontext klar heraus, dass Simson es mitbrachte.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: Ich will zu meiner Frau … gehen
  rationale: Die Kohortativform drückt Simsons Absicht beziehungsweise sein Verlangen aus. Die Übersetzung wahrt dies, ohne die im Deutschen unnatürliche Formulierung »zu meiner Frau hineingehen« zu erzwingen.
- source_word: הֶחָדְרָה
  choice: ins Gemach
  rationale: Die Richtungsform bezeichnet das Hineingehen in einen abgeschlossenen inneren Raum. »Gemach« bewahrt die räumliche und intime Bedeutung, ohne ausdrücklich »Schlafzimmer« in den Text einzutragen.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: Doch ihr Vater ließ ihn nicht hinein
  rationale: Die Formulierung bringt die aktive Weigerung des Vaters prägnant zum Ausdruck und nimmt die Richtung des vorausgehenden Hineingehens wieder auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Erzählweise. Die intime Bedeutung des Hineingehens wird durch den Zusammenhang und die Fußnote erkennbar, aber nicht stärker ausgedeutet, als es der hebräische Wortlaut verlangt.
