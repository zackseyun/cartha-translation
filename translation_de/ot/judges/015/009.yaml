  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: de
  text: Da zogen die Philister hinauf, schlugen ihr Lager in Juda auf und breiteten sich bei Lehi aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellten sich bei Lehi auf“. Das hebräische Verb kann das Ausbreiten beziehungsweise Aufstellen einer Streitmacht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zogen … hinauf
  rationale: עלה bezeichnet hier die aufwärts gerichtete geografische beziehungsweise militärische Bewegung; die übliche deutsche Wendung bewahrt diese Richtungsangabe.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Die geläufige deutsche Bezeichnung für diese Volksgruppe.
- source_word: וַיַּחֲנוּ
  choice: schlugen ihr Lager … auf
  rationale: חנה bedeutet, ein Lager zu beziehen; diese Formulierung ist modern, natürlich und im militärischen Zusammenhang eindeutig.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präposition ב bezeichnet hier am wahrscheinlichsten den Ort. Der folgende Ausdruck nennt mit Lehi den genaueren Standort.
- source_word: וַיִּנָּטְשׁוּ
  choice: breiteten sich … aus
  rationale: נטשׁ beschreibt in diesem Zusammenhang das räumliche Ausbreiten beziehungsweise Aufstellen einer Streitmacht, ohne zwingend einen technischen militärischen Ausdruck zu verlangen.
- source_word: בַּלֶּחִי
  choice: bei Lehi
  rationale: Lehi ist hier ein Ortsname; „bei“ gibt die Positionierung an diesem Ort natürlich wieder.
