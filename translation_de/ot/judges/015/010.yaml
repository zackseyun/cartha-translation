source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ יְהוּדָ֔ה לָ/מָ֖ה עֲלִיתֶ֣ם עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ לֶ/אֱס֤וֹר אֶת שִׁמְשׁוֹן֙ עָלִ֔ינוּ לַ/עֲשׂ֣וֹת ל֔/וֹ כַּ/אֲשֶׁ֖ר עָ֥שָׂה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: de
  text: 'Da fragten die Männer von Juda: »Warum seid ihr gegen uns heraufgezogen?« Sie antworteten: »Wir sind heraufgezogen, um Simson zu fesseln und ihm das anzutun, was er uns angetan hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: die Männer von Juda
  rationale: אִישׁ steht formal im Singular, wird hier aber kollektiv gebraucht, wie das pluralische וַיֹּאמְרוּ zeigt. Die Wiedergabe im Plural ist im Deutschen natürlich und bewahrt die männliche Kollektivbezeichnung.
- source_word: לָמָה
  choice: Warum
  rationale: Die übliche und natürliche deutsche Entsprechung für die Frage nach dem Grund.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: seid ihr gegen uns heraufgezogen
  rationale: עלה mit עַל bezeichnet hier eine feindlich gerichtete Bewegung. »Gegen uns heraufgezogen« bewahrt sowohl die räumliche Ausdrucksweise als auch die gegnerische Stoßrichtung, ohne bereits ausdrücklich einen Angriff zu behaupten.
- source_word: לֶאֱסוֹר
  choice: um … zu fesseln
  rationale: אָסַר bedeutet binden, fesseln oder gefangen setzen. Im Zusammenhang mit Simsons Ergreifung ist »fesseln« präzise und idiomatisch.
- source_word: עָלִינוּ
  choice: Wir sind heraufgezogen
  rationale: Das im Hebräischen nur als Verbform erkennbare עָלִינוּ wiederholt עלה aus der Frage. Die Übersetzung erhält diese bewusste Wiederaufnahme.
- source_word: לַעֲשׂוֹת לוֹ
  choice: ihm das anzutun
  rationale: עשה mit ל kann je nach Kontext »jemandem tun/antun« bedeuten. Der Vergeltungszusammenhang verlangt hier die nicht-benefaktive Bedeutung; »antun« macht sie im Deutschen natürlich deutlich.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: was er uns angetan hat
  rationale: Die Formulierung gibt die vergleichende und vergeltende Entsprechung idiomatisch wieder. Das Perfekt passt im heutigen deutschen Dialog zur vorausliegenden Tat mit gegenwärtiger Relevanz.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Rede. Die Wiederholung von »heraufgezogen« bewahrt die rhetorische Verbindung zwischen Frage und Antwort; »antun« bringt die Vergeltungsabsicht klar, aber ohne zusätzliche Deutung zum Ausdruck.
