revisions:
- from: Er zündete die Fackeln[a] an und ließ sie in das stehende Getreide der Philister laufen. So verbrannte er alles, vom aufgeschichteten Getreide bis zum stehenden Getreide und bis zu den Olivenhainen.[b]
  to: Er setzte die Fackeln[a] in Brand und ließ die Tiere in das stehende Getreide der Philister laufen. Dabei verbrannte er das aufgeschichtete Getreide, das stehende Getreide und die Olivenhaine.[b]
  rationale: Die Revision klärt das aus dem Kontext stammende Objekt des Loslassens und beseitigt dadurch einen im Deutschen zwingend nahegelegten Fehlbezug. Sie vermeidet die zusätzliche Verallgemeinerung „alles“ und gibt die im Hebräischen genannten Bereiche als natürliche deutsche Aufzählung wieder. Die Fußnote bewahrt die wörtliche Von-bis-Struktur und den kollektiven möglichen Sinn des Singulars.
