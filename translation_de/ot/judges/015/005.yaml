translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Übersetzung hält die hebräische Von-bis-Struktur fest, erklärt aber die etwas ungewöhnliche Aufzählung in einer Fußnote. „Aufgeschichtetes Getreide“ vermeidet das heute wenig geläufige „Garbenhaufen“.
