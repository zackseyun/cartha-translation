base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: de
  text: Er setzte die Fackeln[a] in Brand und ließ die Tiere in das stehende Getreide der Philister laufen. Dabei verbrannte er das aufgeschichtete Getreide, das stehende Getreide und die Olivenhaine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerbrände“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Getreidestapel bis zum stehenden Getreide und bis zum Olivenhain“. Die hebräische Von-bis-Wendung bezeichnet den Umfang der vom Brand betroffenen Erzeugnisse; „Olivenhain“ steht im Hebräischen im Singular und kann kollektiv gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: Er zündete die Fackeln an
  rationale: Die Hifil-Form von בער bezeichnet hier das Entzünden; אֵשׁ wird im natürlichen deutschen Verb „anzünden“ mit ausgedrückt. לַפִּידִים kann Fackeln oder Feuerbrände bezeichnen.
- source_word: וַיְשַׁלַּח
  choice: ließ sie … laufen
  rationale: Das Verb bedeutet „senden/loslassen“. Der unmittelbare Erzählzusammenhang zeigt, dass die zuvor genannten Tiere losgelassen wurden; „laufen“ gibt die Bewegung natürlich wieder, ohne die Tiere erneut ausdrücklich zu benennen.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: in das stehende Getreide der Philister
  rationale: קָמָה bezeichnet noch auf dem Halm stehendes Getreide. Die Formulierung bewahrt diese landwirtschaftliche Unterscheidung.
- source_word: וַיַּבְעֵר
  choice: So verbrannte er alles
  rationale: Die zweite Hifil-Form von בער beschreibt die verursachte Verbrennung. „So“ verdeutlicht den unmittelbaren narrativen Zusammenhang; „alles“ nimmt die anschließend beschriebene Ausdehnung idiomatisch auf.
- source_word: מִגָּדִישׁ וְעַד קָמָה
  choice: vom aufgeschichteten Getreide bis zum stehenden Getreide
  rationale: Die Konstruktion מִן … וְעַד bezeichnet eine Spannweite. גָּדִישׁ ist ein Haufen oder Stapel geernteten Getreides; „aufgeschichtetes Getreide“ ist im heutigen Deutsch klarer als ein spezieller landwirtschaftlicher Fachausdruck.
- source_word: וְעַד כֶּרֶם זָיִת
  choice: und bis zu den Olivenhainen
  rationale: כֶּרֶם bezeichnet eine kultivierte Pflanzung und wird durch זַיִת als Olivenpflanzung bestimmt. „Olivenhaine“ ist die natürliche deutsche Bezeichnung; der Singular des Hebräischen kann kollektiv verstanden werden.
