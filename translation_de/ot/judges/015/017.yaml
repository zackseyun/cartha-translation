base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: de
  text: Als er zu Ende geredet hatte, warf er den Kinnbacken aus seiner Hand und nannte jenen Ort Ramat-Lechi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ramat-Lechi bedeutet wahrscheinlich »Kinnbackenhöhe« oder »Höhe des Kinnbackens«. Der Name bewahrt das Wortspiel mit dem hebräischen lechi, »Kinnbacken«.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: als er zu Ende geredet hatte
  rationale: Die Präposition כְּ mit dem Infinitiv von כלה und לְדַבֵּר bezeichnet den Zeitpunkt nach Abschluss des Redens. Die gewählte Formulierung ist natürliches Deutsch und wahrt die zeitliche Abfolge.
- source_word: וַיַּשְׁלֵךְ
  choice: warf
  rationale: Das Verb bezeichnet hier das Werfen beziehungsweise Wegwerfen. „Warf“ ist klar und überzeichnet die Stärke der Bewegung nicht.
- source_word: הַלְּחִי
  choice: den Kinnbacken
  rationale: Im Zusammenhang ist der Kinnbacken des Esels gemeint, den Simson als Waffe benutzt hatte. „Kinnbacken“ bewahrt zudem die Verbindung zum Ortsnamen.
- source_word: מִיָּדוֹ
  choice: aus seiner Hand
  rationale: Dies gibt die Bewegung des Gegenstands aus seiner Hand idiomatisch und zugleich eng am hebräischen Ausdruck wieder.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: und nannte jenen Ort
  rationale: קרא bezeichnet in dieser Konstruktion die Benennung eines Ortes. „Nannte“ ist im modernen Deutschen natürlicher als eine wörtliche Wiedergabe mit „rief“.
- source_word: רָמַת לֶחִי
  choice: Ramat-Lechi
  rationale: Der Ortsname wird nach deutschen Laut- und Schreibgewohnheiten transliteriert. Seine wörtliche Bedeutung und das Wortspiel mit לֶחִי werden in der Fußnote erläutert.
theological_decisions: []
