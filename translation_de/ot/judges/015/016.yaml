source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֔וֹן בִּ/לְחִ֣י הַ/חֲמ֔וֹר חֲמ֖וֹר חֲמֹרָתָ֑יִם בִּ/לְחִ֣י הַ/חֲמ֔וֹר הִכֵּ֖יתִי אֶ֥לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: de
  text: 'Da sagte Simson[a]: »Mit dem Kieferknochen eines Esels – ein Haufen, zwei Haufen! Mit dem Kieferknochen eines Esels habe ich tausend Mann erschlagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen liegt ein Wortspiel vor: Das Wort für „Esel“ klingt ähnlich wie die hier mit „Haufen“ wiedergegebene Form. Der genaue Sinn der Wendung ist unsicher; möglich ist auch: „Haufen über Haufen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Eingebürgerte deutsche Namensform.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: Mit dem Kieferknochen eines Esels
  rationale: לְחִי bezeichnet hier den als Waffe verwendeten Kieferknochen; בְּ markiert das Mittel. Die Formulierung ist präzise und im Deutschen verständlich.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: ein Haufen, zwei Haufen
  rationale: Die möglichst formnahe Wiedergabe bewahrt die auffällige Steigerung und lässt das hebräische Wortspiel zwischen „Esel“ und „Haufen“ in einer Fußnote erklären, ohne die schwierige Wendung vorschnell zu glätten.
- source_word: הִכֵּיתִי
  choice: habe ich ... erschlagen
  rationale: נכה bedeutet „schlagen“ und bezeichnet in diesem Kampfzusammenhang tödliches Niederschlagen. „Erschlagen“ ist knapp, würdig und kontextgerecht.
- source_word: אֶלֶף אִישׁ
  choice: tausend Mann
  rationale: אִישׁ steht kollektiv für männliche Kämpfer; „tausend Mann“ ist im militärischen Zusammenhang idiomatisch.
