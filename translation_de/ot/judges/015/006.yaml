base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: de
  text: 'Da fragten die Philister: „Wer hat das getan?“ Man antwortete: „Simson, der Schwiegersohn des Timniters, weil der Timniter ihm seine Frau weggenommen und sie einem Gefährten Simsons[a] gegeben hatte.“ Da zogen die Philister hinauf und verbrannten sie und ihren Vater im Feuer.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „einem Freund Simsons“. Das hebräische Wort kann einen Gefährten oder Freund bezeichnen; im Zusammenhang der Hochzeit verstehen manche es genauer als einen Brautführer oder Trauzeugen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie verbrannten sie und ihren Vater mit Feuer.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Die im Deutschen übliche Bezeichnung des in diesem Zusammenhang bekannten Volkes.
- source_word: מִי עָשָׂה זֹאת
  choice: Wer hat das getan?
  rationale: Das deutsche Perfekt ist in direkter Rede natürlich und gibt die Frage nach der bereits geschehenen Tat treffend wieder.
- source_word: חֲתַן הַתִּמְנִי
  choice: der Schwiegersohn des Timniters
  rationale: חָתָן kann einen Bräutigam oder eine angeheiratete männliche Verwandtschaftsbeziehung bezeichnen. Aus der Perspektive des timnitischen Vaters ist Simson dessen Schwiegersohn.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung dafür ein, weshalb Simson als Täter genannt wird, und verbindet sich im Deutschen natürlich mit der vorangehenden Identifizierung.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: der hat ihm seine Frau weggenommen
  rationale: Das ausdrücklich gesetzte „ihm“ macht im Deutschen verständlich, dass der Timniter Simson dessen Frau nahm; „weggenommen“ gibt in diesem Kontext die durch לָקַח bezeichnete Entziehung natürlicher wieder als schlichtes „genommen“.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: und sie seinem Gefährten gegeben
  rationale: „Gefährte“ bewahrt die Bedeutungsbreite von מֵרֵעַ, ohne die konkrete Rolle vorschnell als Trauzeugen oder besten Freund festzulegen.
- source_word: וַיַּעֲלוּ
  choice: Da zogen ... hinauf
  rationale: Bewahrt die Bewegungsangabe des hebräischen Verbs und entspricht dem erzählerischen Stil des Zusammenhangs.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: und verbrannten sie und ihren Vater im Feuer
  rationale: Bewahrt sowohl die beiden Opfer als auch die ausdrückliche Nennung des Feuers, ohne das im Hebräischen nicht ausdrücklich genannte „zu Tode“ einzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt knapp und erzählerisch. Das semantisch weitere „Gefährte“ steht im Haupttext; eine mögliche besondere Funktion im Hochzeitszusammenhang wird nur in der Fußnote genannt. Die drastische Schlussformulierung folgt dem Hebräischen, ohne „bei lebendigem Leib“ oder „zu Tode“ ergänzend einzutragen.
