revisions:
- from: 'Da fragten die Philister: „Wer hat das getan?“ Man antwortete: „Simson, der Schwiegersohn des Timniters; denn der hat ihm seine Frau weggenommen und sie seinem Gefährten[a] gegeben.“ Da zogen die Philister hinauf und verbrannten sie und ihren Vater im Feuer.[b]'
  to: 'Da fragten die Philister: „Wer hat das getan?“ Man antwortete: „Simson, der Schwiegersohn des Timniters, weil der Timniter ihm seine Frau weggenommen und sie einem Gefährten Simsons[a] gegeben hatte.“ Da zogen die Philister hinauf und verbrannten sie und ihren Vater im Feuer.[b]'
