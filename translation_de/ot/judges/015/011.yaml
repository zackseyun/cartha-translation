  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: de
  text: 'Da gingen dreitausend Männer aus Juda zur Felsspalte von Etam[a] hinab und sagten zu Simson: »Weißt du nicht, dass die Philister über uns herrschen? Was hast du uns da angetan?« Er antwortete ihnen: »Wie sie mir gegenüber gehandelt haben, so habe ich ihnen gegenüber gehandelt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur Felsschlucht von Etam«.'
    reason: Lexikalische Alternative für סְעִיף, das eine Spalte, einen Einschnitt oder eine schluchtartige Felsformation bezeichnen kann.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: gingen … hinab
  rationale: Bewahrt die Richtungsangabe des hebräischen Verbs ירד und klingt im deutschen Erzählstil natürlich.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: dreitausend Männer aus Juda
  rationale: Gibt die gezählte männliche Gruppe und ihre Herkunft beziehungsweise Zugehörigkeit klar und idiomatisch wieder.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: zur Felsspalte von Etam
  rationale: סְעִיף bezeichnet hier wahrscheinlich eine Spalte oder einen Einschnitt im Fels. Die kompakte deutsche Fügung vermeidet das schwerfällige »Spalte des Felsens von Etam«.
- source_word: הֲלֹא יָדַעְתָּ
  choice: Weißt du nicht
  rationale: Gibt die rhetorische Frage unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: dass die Philister über uns herrschen
  rationale: Das Partizip מֹשְׁלִים bezeichnet die andauernde politische Vorherrschaft; »über uns herrschen« wahrt den verbalen und bedrängenden Sinn.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Was hast du uns da angetan?
  rationale: »Da« nimmt das demonstrative זֹּאת idiomatisch auf; »angetan« bringt zum Ausdruck, dass die Männer Judas Simsons Handeln als etwas gegen sie Gerichtetes beziehungsweise für sie Schädliches beklagen.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: Wie sie mir getan haben, so habe ich ihnen getan
  rationale: Bewahrt die knappe korrelative Form des Hebräischen und beschreibt die Vergeltung, ohne sie moralisch zu bewerten.
theological_decisions:
- issue: Ton von Simsons Antwort als vergeltende Gegenseitigkeit
  choice: 'Schlichte Wiedergabe als Begründung seiner Vergeltung: »Wie sie mir getan haben, so habe ich ihnen getan.«'
  alternative: Die Aussage ausdrücklich als gerechtfertigte Vergeltung oder negativ als persönliche Rache kennzeichnen.
  rationale: Der Vers berichtet Simsons Begründung, bewertet sie aber nicht ausdrücklich. Die Übersetzung bewahrt diese theologische und moralische Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache mit natürlichem Erzählfluss. Die direkte Rede bleibt knapp und eindringlich. Der Fußnotenmarker steht unmittelbar bei der topografisch mehrdeutigen Wendung.
