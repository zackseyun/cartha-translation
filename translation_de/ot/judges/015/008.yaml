revisions:
- from: Und er schlug sie mit einer vernichtenden Niederlage, Hüfte samt Schenkel[a]. Dann ging er hinab und blieb in der Felsspalte von Etam.
  to: Und er schlug sie – Hüfte auf Schenkel – mit einem gewaltigen Schlag. Dann ging er hinab und blieb in der Felsspalte des Felsens von Etam.
  rationale: Die Revision beseitigt die im Deutschen unidiomatische Konstruktion, ohne den Sinn zu erweitern. Die schwer deutbare hebräische Wendung bleibt im Haupttext sichtbar und wird in der Fußnote als unsicher gekennzeichnet. Der „gewaltige Schlag“ entspricht der großen Kampfhandlung, ohne ein vollständiges Töten oder Vernichten zu behaupten. Da die Fußnote auf die Wortgruppe unmittelbar nach „sie“ zielt, ist der Anker dort zu setzen.
