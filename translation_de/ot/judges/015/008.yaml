  source_fidelity: Die vorliegende Fassung gibt die Erzählhandlung, das Hinabgehen und den Aufenthalt in der Felsspalte grundsätzlich zutreffend wieder. Die Stellung und Verknüpfung von „Hüfte samt Schenkel“ mit „mit einer vernichtenden Niederlage“ verwischt jedoch die hebräische Wortfolge und macht die Kampfbeschreibung syntaktisch missverständlich. Außerdem verstärkt „vernichtend“ גדלה unnötig.
  naturalness: '„Er schlug sie mit einer vernichtenden Niederlage“ ist im Deutschen nicht idiomatisch: Man fügt jemandem eine Niederlage zu, schlägt ihn aber nicht mit einer Niederlage. Die revidierte Fassung wahrt die bildhafte, schwierige Wendung in einer als Einschub lesbaren Form und bleibt dabei verständlich.'
  terminology: „gewaltiger Schlag“ gibt מַכָּה גְדוֹלָה nahe und ohne die nicht explizite Behauptung einer völligen Vernichtung wieder. „Hüfte auf Schenkel“ bildet die Präposition על transparenter ab als „samt“; die Fußnote erläutert behutsam den unsicheren idiomatischen Sinn. „Felsspalte des Felsens von Etam“ bewahrt die konstruktartige Verbindung mit סלע.
  issues:
