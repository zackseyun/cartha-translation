  - severity: low
    issue: „samt“ glättet die umstrittene hebräische Wendung zu stark
    rationale: Die Formulierung kann den Eindruck einer klaren koordinierenden Bedeutung erwecken. „auf“ erhält die im Hebräischen stehende Präposition und damit die Schwierigkeit der Wendung sichtbarer.
  - severity: low
    issue: „von Etam“ lässt den im Hebräischen genannten Felsen aus
    rationale: בִּסְעִיף סֶלַע עֵיטָם bezeichnet die Spalte eines Felsens von Etam; die revidierte Formulierung gibt beide Nomina wieder.
  revised_text: Und er schlug sie – Hüfte auf Schenkel – mit einem gewaltigen Schlag. Dann ging er hinab und blieb in der Felsspalte des Felsens von Etam.
