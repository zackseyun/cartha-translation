base_translation:
  language: en
  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: de
  text: Und er schlug sie – Hüfte auf Schenkel – mit einem gewaltigen Schlag. Dann ging er hinab und blieb in der Felsspalte des Felsens von Etam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: er schlug sie
  rationale: נכה bedeutet grundsätzlich „schlagen“; die Schwere und das Ergebnis des Angriffs werden durch מַכָּה גְדוֹלָה ausgedrückt, ohne beim Verb den Tod jedes Einzelnen festzulegen.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: Hüfte samt Schenkel
  rationale: Die seltene und umstrittene Wendung wird bildhaft bewahrt. „Samt“ gibt die zusammenfassende Kraft von עַל in dieser idiomatischen Verbindung natürlich wieder, ohne ihre genaue Bedeutung vorschnell festzulegen.
- source_word: מַכָּה גְדוֹלָה
  choice: mit einer vernichtenden Niederlage
  rationale: מַכָּה kann im Kampf eine schwere Niederlage oder ein Gemetzel bezeichnen. Die gewählte Formulierung vermittelt die Heftigkeit, vermeidet aber die nicht zwingende Aussage, alle seien getötet worden.
- source_word: וַיֵּרֶד
  choice: Dann ging er hinab
  rationale: Bewahrt die räumliche Richtung und führt den nächsten Erzählabschnitt in natürlichem Deutsch ein.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישב kann „sitzen“, „wohnen“ oder „sich aufhalten“ bedeuten. „Blieb“ passt zu einem vorübergehenden Aufenthalt, ohne eine dauerhafte Ansiedlung anzudeuten.
- source_word: בִּסְעִיף סֶלַע
  choice: in der Felsspalte
  rationale: סְעִיף bezeichnet hier wahrscheinlich eine Spalte oder Kluft; die deutsche Zusammensetzung gibt die Verbindung mit סֶלַע knapp und natürlich wieder.
- source_word: עֵיטָם
  choice: Etam
  rationale: Der Ortsname wird transliteriert.
