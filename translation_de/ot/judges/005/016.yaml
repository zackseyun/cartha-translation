base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: de
  text: Warum bist du zwischen den Schafhürden sitzen geblieben, um das Pfeifen bei den Herden zu hören? Bei den Abteilungen Rubens[a] gab es große Erwägungen des Herzens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an den Wasserläufen Rubens. Das hebräische Wort kann „Abteilungen“ oder „Wasserläufe“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Gibt die direkte Frage nach dem Grund für Rubens Untätigkeit knapp und natürlich wieder.
- source_word: יָשַׁבְתָּ
  choice: bist du … sitzen geblieben
  rationale: Bewahrt sowohl das konkrete Bild des Sitzens als auch den im Kontext naheliegenden Sinn des Verharrens.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: zwischen den Schafhürden
  rationale: Die traditionelle Deutung als Schafhürden passt zum unmittelbar folgenden Bild der Herden; „zwischen“ bildet die Präposition genau ab.
- source_word: לִשְׁמֹעַ
  choice: um … zu hören
  rationale: Gibt den Infinitiv als Zweckangabe wieder.
- source_word: שְׁרִקוֹת עֲדָרִים
  choice: das Pfeifen für die Herden
  rationale: Bezeichnet wahrscheinlich die gepfiffenen Rufe, mit denen Hirten ihre Herden lenken; die Formulierung bleibt knapp und bildhaft.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: Bei den Abteilungen Rubens
  rationale: פְלַגּוֹת kann Stammesabteilungen oder Gruppen bezeichnen. „Bei“ gibt die relationale Funktion der Präposition idiomatisch wieder, ohne eine eindeutige Kausalbeziehung einzutragen.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: gab es ein tiefes Erforschen des Herzens
  rationale: Bewahrt das poetische Bild gründlicher innerer Prüfung. „Tief“ gibt die Intensivierung durch גְּדוֹלִים im natürlichen Deutschen wieder.
theological_decisions:
- issue: Art der inneren Bewegung bei Ruben
  choice: ein tiefes Erforschen des Herzens
  alternative: große Entschlüsse des Herzens
  rationale: Der hebräische Ausdruck bezeichnet eher prüfendes Nachdenken oder innere Selbstbefragung als eindeutig gefasste Entschlüsse. Die Übersetzung lässt die Spannung zwischen ernsthafter Erwägung und ausbleibendem Handeln bestehen.
translation_notes:
  register: Moderne, würdige poetische Sprache. Das konkrete Hirtenbild und der vorwurfsvolle Frageton bleiben erhalten; ungewöhnliche, aber bedeutungstragende Bildsprache wird nicht vorschnell geglättet.
