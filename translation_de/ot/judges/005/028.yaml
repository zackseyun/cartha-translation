  text: בְּעַד֩ הַ/חַלּ֨וֹן נִשְׁקְפָ֧ה וַ/תְּיַבֵּ֛ב אֵ֥ם סִֽיסְרָ֖א בְּעַ֣ד הָֽ/אֶשְׁנָ֑ב מַדּ֗וּעַ בֹּשֵׁ֤שׁ רִכְבּ/וֹ֙ לָ/ב֔וֹא מַדּ֣וּעַ אֶֽחֱר֔וּ פַּעֲמֵ֖י מַרְכְּבוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: de
  text: 'Durch das Fenster blickte Siseras Mutter hinaus und jammerte[a] durch das Gitter: »Warum lässt sein Wagen so lange auf sich warten? Warum zögern die Tritte seiner Wagen?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »klagte« oder »rief klagend«. Das seltene hebräische Verb bezeichnet vermutlich einen klagenden oder angstvollen Ruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Schritte/Tritte seiner Wagen«. Das Bild kann die Bewegung oder das hörbare Nahen der Wagen bezeichnen; die genaue Vorstellung bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: durch das Fenster
  rationale: Die Präposition bezeichnet bei einem Fenster den Blick durch eine Öffnung; die räumliche Vorstellung bleibt erhalten.
- source_word: נִשְׁקְפָה
  choice: blickte … hinaus
  rationale: Das Verb bezeichnet häufig das Hinaus- oder Herabschauen von einem Fenster oder erhöhten Ort.
- source_word: וַתְּיַבֵּב
  choice: klagte
  rationale: Das seltene Verb bezeichnet wahrscheinlich einen klagenden oder angstvollen Ruf. »Klagte« wahrt die emotionale Färbung, ohne die genaue Lautäußerung zu stark festzulegen.
- source_word: אֵם סִיסְרָא
  choice: Siseras Mutter
  rationale: Die hebräische Genitivverbindung wird im Deutschen natürlich als vorangestellter possessiver Genitiv wiedergegeben.
- source_word: בְּעַד הָאֶשְׁנָב
  choice: hinter dem Gitterfenster
  rationale: אֶשְׁנָב bezeichnet eine vergitterte oder mit einem Gitter versehene Fensteröffnung. Beim Rufen bezeichnet בְּעַד hier plausibel die Position hinter beziehungsweise an dieser Öffnung.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: lässt sein Wagen so lange auf sich warten
  rationale: Gibt die Verzögerung der erwarteten Ankunft in natürlichem modernem Deutsch wieder.
- source_word: אֶחֱרוּ
  choice: verspätet sich
  rationale: Der Plural des hebräischen Verbs bezieht sich auf die folgenden פַּעֲמֵי מַרְכְּבוֹתָיו; im Deutschen steht bei der kollektiven Wiedergabe »das Rasseln« der Singular.
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: das Rasseln seiner Wagen
  rationale: Wörtlich sind die »Schritte/Tritte« oder wiederholten Schläge der Wagen gemeint. »Rasseln« vermittelt idiomatisch das erwartete Geräusch der herannahenden Streitwagen, ohne ausdrücklich Pferdehufe oder Räder einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bringt die wachsende Sorge der Mutter natürlich zum Ausdruck. Die Wiederholung der Fensterbegriffe wird bewahrt, aber so formuliert, dass keine unnatürliche doppelte Verwendung von »durch« entsteht.
