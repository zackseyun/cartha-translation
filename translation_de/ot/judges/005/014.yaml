source:
  edition: WLC
  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: de
  text: Aus Ephraim kamen die, deren Wurzel in Amalek war[a]; dir nach, Benjamin, inmitten deiner Volksgruppen[b]. Aus Machir kamen Befehlshaber herab[c][d], und aus Sebulon die, die den Stab des Schreibers führten[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren Wurzel gegen Amalek gerichtet war“ beziehungsweise „deren Wurzel im Bergland von Amalek lag“. Die hebräische Verszeile ist schwierig und wohl poetisch-geografisch zu verstehen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Benjamin folgte dir unter deinen Sippen“. Der Ausdruck „inmitten deiner Volksgruppen“ gibt eine ungewöhnliche hebräische Wendung möglichst nah wieder.'
    reason: lexical_alternative
  - marker: c
    text: Machir ist die führende Sippe innerhalb des Stammes Manasse; manche Übersetzungen geben deshalb den umfassenderen Stammesnamen „Manasse“ wieder.
    reason: cultural_note
  - marker: d
    text: 'Oder: „Herrscher“ beziehungsweise „Gesetzgeber“. Das hebräische Wort kann Personen bezeichnen, die gebieten oder Anordnungen erlassen.'
    reason: lexical_alternative
  - marker: e
    text: 'Auch möglich: „die mit dem Stab des Schreibers zogen“ oder „die den Stab des Heerführers trugen“. Der seltene hebräische Ausdruck kann sich auf die Einberufung oder Erfassung von Truppen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: Aus Ephraim
  rationale: Die Präposition bezeichnet Herkunft oder Ausgangspunkt. „Aus Ephraim“ führt die poetische Aufzählung der Stämme natürlich fort.
- source_word: שָׁרְשָׁם
  choice: deren Wurzel
  rationale: Die wörtliche Metapher „Wurzel“ bleibt erhalten; sie kann Herkunft, Verwurzelung oder einen dort ansässigen Stammesteil bezeichnen.
- source_word: בַּעֲמָלֵק
  choice: in Amalek
  rationale: Die Präposition lässt sich am ehesten örtlich verstehen. Die Wiedergabe wahrt jedoch die schwierige poetisch-geografische Aussage, ohne einen militärischen Sinn festzulegen.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: dir nach, Benjamin
  rationale: Die knappe poetische Wendung drückt eine Folge aus, ohne im Hebräischen ausdrücklich ein Verb zu setzen. Die deutsche Form bewahrt diese Kürze.
- source_word: בַּעֲמָמֶיךָ
  choice: inmitten deiner Volksgruppen
  rationale: Der ungewöhnliche Plural von „Volk“ mit Suffix wird verständlich, aber nicht zu eng als Clans oder Truppen gedeutet.
- source_word: מִנִּי מָכִיר
  choice: Aus Machir
  rationale: Der hebräische Eigenname wird beibehalten, statt ihn durch den umfassenderen Stammesnamen Manasse zu ersetzen.
- source_word: יָרְדוּ
  choice: kamen herab
  rationale: Das Verb bezeichnet eine Abwärtsbewegung. „Kamen herab“ passt zur Perspektive des Siegesliedes.
- source_word: מְחֹקְקִים
  choice: Befehlshaber
  rationale: Das Wort kann Herrscher, Gebietende oder Erlassende bezeichnen. Im Zusammenhang des militärischen Aufgebots ist „Befehlshaber“ eine naheliegende, aber nicht alternativlose Wiedergabe.
- source_word: וּמִזְּבוּלֻן
  choice: und aus Sebulon
  rationale: Die Herkunftsangabe setzt die Aufzählung der beteiligten Stammesgruppen fort.
- source_word: מֹשְׁכִים
  choice: die … führten
  rationale: Das Partizip bedeutet wörtlich „ziehend“. In Verbindung mit einem Stab gibt „führten“ den aktiven Umgang mit dem Gegenstand natürlich wieder.
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: den Stab des Schreibers
  rationale: „Stab“ und „Schreiber“ geben die seltene hebräische Wortverbindung direkt wieder und lassen offen, ob ein Schreibgerät, Amtsstab oder militärisches Zeichen gemeint ist.
