  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: de
  text: Erwache, erwache, Debora! Erwache, erwache, trag ein Lied vor![a] Steh auf, Barak, und führe deine Gefangenen fort,[b] Sohn Abinoams!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sprich ein Lied.“ Das kann ein gesungenes oder rezitiertes Vortragen meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Nimm deine Gefangenen gefangen.“ Das hebräische Wort kann auch „deine Gefangenschaft“ bedeuten. Die Wortfigur beschreibt den Sieg über Feinde und ihr Wegführen als Gefangene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Erwache
  rationale: Der feminine Singular des Imperativs wird viermal wiederholt. „Erwache“ bewahrt den eindringlichen, poetischen Weckruf und klingt würdevoll, ohne altertümlich zu sein.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: דַּבְּרִי שִׁיר
  choice: trag ein Lied vor
  rationale: Wörtlich steht „sprich ein Lied“. „Trag ein Lied vor“ ist im modernen Deutschen natürlich und lässt offen, ob das Lied gesungen oder rezitiert wird; die ungewöhnliche Ausdrucksweise des Hebräischen wird in einer Fußnote sichtbar gemacht.
- source_word: קוּם
  choice: Steh auf
  rationale: Der maskuline Singular richtet sich an Barak. „Steh auf“ wahrt den unmittelbaren Aufruf zum Handeln.
- source_word: בָּרָק
  choice: Barak
  rationale: Der Personenname wird in der etablierten Transliteration wiedergegeben.
- source_word: וּשֲׁבֵה
  choice: und führe … fort
  rationale: Der Imperativ von שבה bezeichnet das Gefangennehmen beziehungsweise Wegführen als Gefangene. In Verbindung mit שֶׁבְיְךָ ergibt „führe deine Gefangenen fort“ eine klare deutsche Wiedergabe.
- source_word: שֶׁבְיְךָ
  choice: deine Gefangenen
  rationale: שֶׁבִי kann kollektiv „Gefangene“ oder abstrakt „Gefangenschaft“ bedeuten. Der militärische Siegeskontext spricht hier für die kollektive Bedeutung; die formale Mehrdeutigkeit wird in der Fußnote genannt.
- source_word: בֶּן אֲבִינֹעַם
  choice: Sohn Abinoams
  rationale: Die patronymische Identifikation wird knapp und formal beibehalten.
