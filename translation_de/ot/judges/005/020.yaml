  text: מִן שָׁמַ֖יִם נִלְחָ֑מוּ הַ/כּֽוֹכָבִים֙ מִ/מְּסִלּוֹתָ֔/ם נִלְחֲמ֖וּ עִם סִיסְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: de
  text: Vom Himmel her kämpften die Sterne; von ihren Bahnen[a] aus kämpften sie gegen Sisera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihren Wegen aus“ oder „von ihren Pfaden aus“. Das hebräische Wort kann Straßen, Wege oder Bahnen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Sisera“. In Verbindung mit „kämpfen“ bezeichnet diese hebräische Wendung gewöhnlich den Gegner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: Vom Himmel her
  rationale: Die Wendung gibt den Ausgangspunkt natürlich und poetisch wieder; das formal plurale שָׁמַיִם wird im Deutschen idiomatisch mit dem Singular „Himmel“ übersetzt.
- source_word: נִלְחָמוּ
  choice: kämpften
  rationale: Das Nifal von לחם bezeichnet hier den Kampf. Die Wiederholung wird wie im Hebräischen beibehalten.
- source_word: הַכּוֹכָבִים
  choice: die Sterne
  rationale: Die direkte Bedeutung bewahrt das kosmische Bild, ohne es näher auszudeuten.
- source_word: מִמְּסִלּוֹתָם
  choice: auf ihren Bahnen
  rationale: מְסִלּוֹת kann Straßen, Wege oder Bahnen bezeichnen. Bei Sternen ist „Bahnen“ im Deutschen natürlich und erhält zugleich die Bildsprache. Die Präposition מִן ist hier räumlich vom Standort bzw. Verlauf her verstanden; eine formalere Wiedergabe wäre „von ihren Bahnen aus“.
- source_word: עִם סִיסְרָא
  choice: gegen Sisera
  rationale: Obwohl עִם gewöhnlich „mit“ bedeutet, bezeichnet die Verbindung mit לחם im Kampfkontext den Gegner; „gegen Sisera kämpfen“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Art der Beteiligung der Sterne am Kampf
  choice: Die poetische Aussage, dass die Sterne kämpften, bleibt ohne nähere Erklärung stehen.
  alternative: Wörtliche kosmische Mitwirkung, Bild für das himmlische Heer oder poetische Darstellung von Gottes Vorsehung durch Naturkräfte.
  rationale: Das Deboralied erläutert nicht, auf welche Weise die Sterne am Kampf beteiligt waren. Eine offene Wiedergabe bewahrt die Bildkraft und die theologische Spannung des Textes.
translation_notes:
  register: Gehobene, aber gut verständliche poetische Standardsprache. Die parallele Wiederholung von „kämpften“ und das unaufgelöste kosmische Bild des hebräischen Liedes bleiben erhalten.
