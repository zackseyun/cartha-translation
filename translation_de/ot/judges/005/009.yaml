source:
  edition: WLC
  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: de
  text: Mein Herz ist bei den Anführern Israels[a], die sich im Volk freiwillig zur Verfügung stellten. Preist Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Herz ist bei den Gesetzgebern Israels, die sich im Volk bereitwillig hingaben.«'
    reason: 'Lexikalische Alternative: חֹקְקִים kann wörtlicher als »Gesetzgeber« beziehungsweise »Anordnende« verstanden werden; הִתְנַדֵּב kann stärker als freiwillige Selbsthingabe ausgedrückt werden.'
lexical_decisions:
- source_word: לִבִּי
  choice: Mein Herz gehört
  rationale: Bewahrt das hebräische Herz-Idiom und drückt in natürlichem Deutsch Deboras innere Verbundenheit aus; die im Hebräischen nur angedeutete Beziehung wird durch den folgenden ל-Ausdruck ergänzt.
- source_word: לְחוֹקְקֵי
  choice: den Anführern
  rationale: Die von חקק abgeleitete Bezeichnung kann Menschen meinen, die Anordnungen geben und Verantwortung ausüben. »Anführer« trifft im Kontext des Deboralieds die Leitungsfunktion besser als das modern-rechtlich klingende »Gesetzgeber«; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Natürliche deutsche Genitivverbindung zur Kennzeichnung der Anführer als Anführer Israels.
- source_word: הַמִּתְנַדְּבִים
  choice: die sich freiwillig zur Verfügung stellten
  rationale: Das Hitpael-Partizip von נדב bezeichnet ein bereitwilliges Sich-zur-Verfügung-Stellen. Die Formulierung wahrt die freiwillige Selbsthingabe deutlicher als das alleinstehende »sich meldeten«.
- source_word: בָּעָם
  choice: im Volk
  rationale: עם bedeutet grundsätzlich »Volk«. »Im Volk« bewahrt die breite soziale Bedeutung, ohne den Ausdruck kontextuell auf »Truppen« zu verengen.
- source_word: בָּרֲכוּ
  choice: Preist
  rationale: Der Pluralimperativ von ברך bedeutet wörtlich »segnet«. Wenn Menschen zum ברך Gottes aufgefordert werden, bezeichnet das idiomatisch lobendes Preisen; »Preist« ist im heutigen Deutsch klar und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen; »der HERR« wäre eine traditionelle Ersetzung durch einen Titel.
- issue: Bedeutung von ברך in einer an Menschen gerichteten Aufforderung bezüglich Gottes
  choice: Preist Jahwe
  alternative: Segnet Jahwe
  rationale: Die Grundbedeutung »segnen« bleibt anerkannt, doch in dieser Richtung der Handlung meint das hebräische Idiom, Gott lobend zu preisen. Die Wahl vermeidet im Deutschen die mögliche Fehlvorstellung, Menschen verliehen Gott Segen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Klang. »Mein Herz gehört« erhält das Bild des Ausgangstextes; »zur Verfügung stellten« macht die freiwillige Übernahme von Verantwortung verständlich. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
