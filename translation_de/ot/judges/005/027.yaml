base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: de
  text: Zwischen ihren Füßen sank er nieder[a], fiel, lag; zwischen ihren Füßen sank er nieder, fiel; wo er niedersank, da fiel er – vernichtet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zu ihren Füßen«. Wörtlicher: »Zwischen ihren Füßen«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch »zugrunde gerichtet«, »völlig überwältigt« oder im Kontext »erschlagen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: zwischen ihren Füßen
  rationale: Gibt die konkrete räumliche Formulierung und ihre Wiederholung möglichst unmittelbar wieder. Das idiomatischere »zu ihren Füßen« bleibt als Fußnotenalternative erhalten.
- source_word: כָּרַע
  choice: sank er nieder / er niedersank
  rationale: Bezeichnet hier das Einknicken und Niedersinken des tödlich Getroffenen, ohne freiwilliges Knien oder ehrerbietiges Beugen nahezulegen.
- source_word: נָפַל
  choice: fiel er
  rationale: Die gewöhnliche Bedeutung wird an allen drei Stellen beibehalten, um Wiederholung und Steigerung des hebräischen Gedichts zu wahren.
- source_word: שָׁכָב
  choice: lag da
  rationale: Die knappe Zustandsfolge wird in natürlichem Deutsch wiedergegeben; »da« unterstreicht den endgültigen Zustand, ohne zusätzliche Handlung einzuführen.
- source_word: בַּאֲשֶׁר
  choice: wo
  rationale: Knappe adverbiale Wiedergabe von »an dem Ort, wo«.
- source_word: שָׁם
  choice: da
  rationale: Bewahrt die pointierte Ortskorrespondenz »wo … da«.
- source_word: שָׁדוּד
  choice: erschlagen
  rationale: Das passive Partizip bezeichnet den völlig Überwältigten beziehungsweise gewaltsam Getöteten. Im Kontext einer getöteten Person ist »erschlagen« natürlicher als das sachlich mögliche, aber im Deutschen unpassende »verwüstet«.
