  register: Poetisch verdichtetes, würdevolles Standarddeutsch. Die kurzen Verbfolgen, die Wiederholung und die Ortskorrespondenz »wo … da« bleiben erhalten; die ungewöhnliche Bildlichkeit wird nicht geglättet.
