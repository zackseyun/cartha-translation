base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: de
  text: Hört, ihr Könige! Horcht auf, ihr Herrscher![a] Ich, ich will für Jahwe singen; ich will für Jahwe musizieren, den Gott Israels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen zwei bedeutungsnahe Aufforderungen parallel: „Hört“ und „Horcht auf“. Dadurch wird der poetische Aufruf verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verwendet zwei verwandte, aber verschiedene Verben: „singen“ und „musizieren“; das zweite kann auch „Lob singen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ Plural eröffnet den poetischen Aufruf knapp und unmittelbar.
- source_word: מְלָכִים
  choice: Könige
  rationale: Die konkrete Bezeichnung politischer Herrscher wird unverändert wiedergegeben.
- source_word: הַאֲזִינוּ
  choice: Horcht auf
  rationale: Die Wendung bewahrt gegenüber „Hört“ die bedeutungsnahe, aber verstärkende zweite Aufforderung und klingt im Deutschen poetisch und verständlich.
- source_word: רֹזְנִים
  choice: Herrscher
  rationale: Das Wort bezeichnet hochgestellte Machthaber oder Würdenträger; „Herrscher“ passt zum politischen Parallelismus mit „Könige“.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: Ich, ... ich
  rationale: Die ungewöhnliche Wiederholung des selbstständigen Pronomens wird zur Wahrung des emphatischen poetischen Ausdrucks beibehalten.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bei Verben des Singens kann Ausrichtung oder Widmung ausdrücken; „für“ ist hier natürlich und bewahrt diesen Sinn.
- source_word: יהוה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: אָשִׁירָה
  choice: will ich singen
  rationale: Die Form trägt einen voluntativen Beiklang; „will ich singen“ drückt den entschlossenen Vorsatz idiomatisch aus.
- source_word: אֲזַמֵּר
  choice: ich will musizieren
  rationale: „Musizieren“ hält den zweiten Musikbegriff von „singen“ unterscheidbar, ohne ein bestimmtes Instrument vorauszusetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Constructusverbindung wird transparent und konventionell wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht im Ausgangstext ausdrücklich; „Jahwe“ macht diese personale Bundesbezeichnung sichtbar, statt sie durch einen Titel zu ersetzen.
- issue: Bedeutung von לַיהוָה bei den Verben des Singens
  choice: für Jahwe
  alternative: Jahwe / dem Jahwe / zu Jahwe
  rationale: Das ל kann Zielrichtung, Empfänger oder Widmung bezeichnen. „Für Jahwe“ gibt die Widmung natürlich wieder, ohne die Aussage ausschließlich als direkte Anrede festzulegen.
translation_notes:
  register: Moderne, gehobene Liedsprache mit klarer Anrede und bewahrtem Parallelismus. Die emphatische Wiederholung „Ich ... ich“ bleibt bewusst erhalten, obwohl sie im gewöhnlichen deutschen Satzbau ungewöhnlich wirkt.
