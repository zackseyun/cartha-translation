lexical_decisions:
- source_word: מַיִם
  choice: Wasser
  rationale: Die Grundbedeutung ist wörtlich „Wasser“; der Begriff bezeichnet das von Sisera Erbetene und bildet den Kontrast zur gereichten Milch.
- source_word: שָׁאַל
  choice: bat um
  rationale: Das Qal Perfekt 3. Person maskulin Singular bedeutet „bitten, verlangen“. „Bat um“ ist im modernen Deutschen natürlich und passt zur Verbindung mit dem erbetenen Wasser.
- source_word: חָלָב
  choice: Milch
  rationale: Die reguläre Bedeutung ist „Milch“; sie trägt den Kontrast zwischen Siseras Bitte und Jaëls großzügigerer Bewirtung.
- source_word: נָתָנָה
  choice: sie gab ihm
  rationale: Das Qal Perfekt 3. Person feminin Singular bezieht sich auf Jaël. Das im Hebräischen nur aus dem Zusammenhang erschlossene indirekte Objekt wird im Deutschen zur natürlichen Lesbarkeit mit „ihm“ ausgedrückt.
- source_word: בְּסֵפֶל
  choice: in einer Schale
  rationale: סֵפֶל bezeichnet ein schalen- oder beckenartiges Gefäß. „Schale“ ist hier eine natürliche, zum Bewirtungskontext passende deutsche Entsprechung.
- source_word: אַדִּירִים
  choice: für Vornehme
  rationale: Das substantivierte Pluralwort kann „Vornehme“, „Mächtige“ oder „Edle“ bezeichnen. „Für Vornehme“ gibt die naheliegende Verbindung mit dem hochwertigen Gefäß idiomatisch wieder, ohne den wörtlichen Genitiv als eindeutig festzulegen.
- source_word: הִקְרִיבָה
  choice: reichte sie ihm
  rationale: Der Hifil von קרב bedeutet wörtlich „heranbringen“. Im Rahmen der Bewirtung gibt „reichen“ die Handlung klar und ohne kultischen Beiklang wieder; „ihm“ benennt den aus dem Kontext ersichtlichen Empfänger.
- source_word: חֶמְאָה
  choice: Dickmilch
  rationale: Der Ausdruck bezeichnet ein gehaltvolles Milchprodukt und kann je nach Kontext als Dickmilch, Rahm oder Butter verstanden werden. „Dickmilch“ wahrt den Bezug zu einem eingedickten beziehungsweise gesäuerten Milchprodukt; Alternativen werden in der Fußnote erhalten.
