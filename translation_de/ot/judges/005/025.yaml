translation:
  language: de
  text: Er bat um Wasser; sie gab ihm Milch. In einer Schale der Vornehmen[a] reichte sie ihm Sahne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in einer Schale für Vornehme“; wörtlich „in einer Schale der Vornehmen/Mächtigen“.
