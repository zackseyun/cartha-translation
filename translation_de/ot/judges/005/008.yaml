  text: יִבְחַר֙ אֱלֹהִ֣ים חֲדָשִׁ֔ים אָ֖ז לָחֶ֣ם שְׁעָרִ֑ים מָגֵ֤ן אִם יֵֽרָאֶה֙ וָ/רֹ֔מַח בְּ/אַרְבָּעִ֥ים אֶ֖לֶף בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: de
  text: Sie wählten neue Götter[a]; da war Krieg an den Toren[b]. War unter vierzigtausend in Israel auch nur ein Schild oder Speer zu sehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er wählte neue Götter.“ Das hebräische Verb steht im Singular; es kann hier jedoch unbestimmt („man“) oder kollektiv von Israel beziehungsweise dem Volk verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Der hebräische Wortlaut dieser Zeile ist schwierig; möglich ist auch: „da wurde an den Toren gekämpft“ oder ähnlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: Sie erwählten
  rationale: Die Verbform ist morphologisch 3. Person Singular, wird hier aber im Zusammenhang am besten mit einem unbestimmten oder kollektiven menschlichen Subjekt verstanden, nämlich Israel beziehungsweise das Volk. Die Fußnote bewahrt die formale Auffälligkeit.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: neue Götter
  rationale: Im Kontext sind fremde Gottheiten gemeint. Die direkte Wiedergabe erhält die polemische Aussage.
- source_word: אָז
  choice: da
  rationale: Das temporale Adverb verbindet die Hinwendung zu neuen Göttern mit der anschließenden Bedrängnis; „da“ klingt in poetischer Erzählung natürlich und würdig.
- source_word: לָחֶם שְׁעָרִים
  choice: Krieg an den Toren
  rationale: Die hebräische Wendung ist knapp und schwierig. Die nominale Deutung von לָחֶם als „Krieg/Kampf“ ergibt im Zusammenhang den Sinn, dass der Konflikt bis an die Tore gelangte.
- source_word: מָגֵן
  choice: Schild
  rationale: Geläufige und genaue Bezeichnung der Schutzwaffe.
- source_word: אִם יֵרָאֶה
  choice: War ... zu sehen?
  rationale: Die Konstruktion wird als rhetorische Frage verstanden und bringt den Mangel an Waffen natürlich zum Ausdruck.
- source_word: וָרֹמַח
  choice: oder Speer
  rationale: „Speer“ ist die klare moderne Standardbezeichnung; das hebräische ו kann in der negativen rhetorischen Frage idiomatisch mit „oder“ wiedergegeben werden.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: unter vierzigtausend
  rationale: Die Präposition bezeichnet die Gruppe, innerhalb derer keine Waffen zu sehen waren. „Unter vierzigtausend“ ist im Deutschen idiomatisch.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Wendung bezeichnet den nationalen beziehungsweise sozialen Bereich.
theological_decisions:
- issue: Subjekt des einleitenden Verbs
  choice: 'Israel beziehungsweise das Volk als kollektives Subjekt: „Sie erwählten neue Götter.“'
  alternative: „Er erwählte neue Götter“ oder „Man erwählte neue Götter“; formal könnte auch Gott als grammatisches Subjekt erwogen werden.
  rationale: Der unmittelbare Zusammenhang handelt von Israels Abkehr und der daraus folgenden Bedrängnis. Gott zum Subjekt der Erwählung „neuer Götter“ zu machen, passt weder zur Aussageabsicht noch zum Kontext. Weil das hebräische Verb jedoch Singular ist und das Subjekt nicht ausdrücklich genannt wird, wird diese Spannung in einer Fußnote offengelegt.
translation_notes:
  register: Modernes Standarddeutsch mit dichterischer, würdiger Knappheit. „Erwählten“ trägt dem poetischen Register Rechnung, ohne altertümlich zu wirken. Die rhetorische Frage wird durch „auch nur“ idiomatisch verstärkt, ohne ihre Aussage in eine bloße Feststellung umzuwandeln.
