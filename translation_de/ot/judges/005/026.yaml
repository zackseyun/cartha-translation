base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: de
  text: Sie streckte ihre Hand nach dem Zeltpflock aus, ihre Rechte nach dem Hammer der Arbeiter[a]. Dann schlug sie Sisera, zerschmetterte seinen Kopf[b], zerschlug und durchbohrte seine Schläfe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem Hammer der Handwerker“; möglicherweise ist ein Arbeitshammer oder Schlägel gemeint. Die hebräische Wortverbindung ist ungewöhnlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zerquetschte seinen Kopf“. Das Hebräische reiht mehrere kraftvolle Verben aneinander und steigert so poetisch die Gewaltdarstellung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „durchdrang seine Schläfe“ beziehungsweise „fuhr durch seine Schläfe“. Das Verb bezeichnet wahrscheinlich ein Durchdringen oder Hindurchgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: sie streckte ihre Hand ... aus
  rationale: Die Wendung bezeichnet das Ausstrecken der Hand nach einem Gegenstand und wird im Deutschen natürlich und zugleich bildhaft wiedergegeben.
- source_word: לַיָּתֵד
  choice: nach dem Zeltpflock
  rationale: Der Zusammenhang der Jaël-Erzählung macht deutlich, dass es sich um einen Zeltpflock handelt.
- source_word: וִימִינָהּ
  choice: ihre Rechte
  rationale: Die substantivierte Form bewahrt den poetischen Parallelismus zu „ihre Hand“ und klingt im Deutschen würdevoll.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: nach dem Hammer der Arbeiter
  rationale: Die seltene hebräische Verbindung bezeichnet ein Schlagwerkzeug und seine Nutzer; die wörtlich-nahe Form erhält die ungewöhnliche Ausdrucksweise, ohne sie vorschnell auf eine bestimmte Hammerart festzulegen.
- source_word: וְהָלְמָה
  choice: Dann schlug sie
  rationale: Das Verb bezeichnet einen heftigen Schlag; „Dann“ gibt die Fortführung der Handlung im Deutschen flüssig wieder.
- source_word: מָחֲקָה
  choice: zerschmetterte
  rationale: Das kräftige Verb drückt vernichtendes Zerschlagen oder Zerquetschen aus und trägt zur gesteigerten Gewaltdarstellung des Gedichts bei.
- source_word: וּמָחֲצָה
  choice: zerschlug
  rationale: Eine von der vorherigen verschiedene, aber ebenfalls kraftvolle Wiedergabe bewahrt die Häufung ähnlicher Gewaltverben.
- source_word: וְחָלְפָה
  choice: durchbohrte
  rationale: Im Zusammenhang bezeichnet das Verb wahrscheinlich ein Hindurchgehen beziehungsweise Durchdringen; „durchbohrte“ drückt dies idiomatisch aus.
- source_word: רַקָּתוֹ
  choice: seine Schläfe
  rationale: Das Wort bezeichnet hier die seitliche Kopfpartie; „Schläfe“ ist im Deutschen die präzise und kontextgerechte Entsprechung.
