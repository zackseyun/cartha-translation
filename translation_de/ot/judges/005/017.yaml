  text: גִּלְעָ֗ד בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ שָׁכֵ֔ן וְ/דָ֕ן לָ֥/מָּה יָג֖וּר אֳנִיּ֑וֹת אָשֵׁ֗ר יָשַׁב֙ לְ/ח֣וֹף יַמִּ֔ים וְ/עַ֥ל מִפְרָצָ֖י/ו יִשְׁכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: de
  text: Gilead blieb jenseits des Jordan; und Dan – warum hielt er sich bei den Schiffen auf?[a] Ascher saß am Meeresufer und blieb bei seinen Buchten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum wohnte er bei Schiffen?“ Das hebräische Verb kann „wohnen“ oder „sich als Fremder aufhalten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei seinen Häfen“ beziehungsweise „an seinen Meeresarmen“. Das hebräische Wort bezeichnet Öffnungen oder Einschnitte und meint hier wahrscheinlich Buchten, Meeresarme oder Hafenplätze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Der Eigenname bleibt erhalten; im Zusammenhang bezeichnet er metonymisch die Bevölkerung beziehungsweise das Stammesgebiet östlich des Jordan.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die knappe, geläufige geografische Wendung bewahrt die Perspektive des hebräischen Ausdrucks.
- source_word: שָׁכֵן
  choice: blieb
  rationale: Das Verb bezeichnet Wohnen beziehungsweise Verbleiben; „blieb“ lässt im Lied zugleich den Vorwurf der Untätigkeit anklingen, ohne ihn auszudeuten.
- source_word: יָגוּר
  choice: hielt er sich … auf
  rationale: גור kann wohnen oder sich als Fremder aufhalten bedeuten. Die Formulierung ist im modernen Deutsch natürlich und bewahrt die hier mögliche Bedeutung eines vorübergehenden oder andauernden Aufenthalts.
- source_word: אֳנִיּוֹת
  choice: bei den Schiffen
  rationale: Der Plural bezeichnet Schiffe; die Präposition wird räumlich mit „bei“ wiedergegeben.
- source_word: יָשַׁב
  choice: saß
  rationale: Die konkrete Grundbedeutung wird bewahrt und verstärkt im poetischen Zusammenhang das Bild der Untätigkeit.
- source_word: לְחוֹף יַמִּים
  choice: an der Küste der Meere
  rationale: Die Wiedergabe erhält den auffälligen hebräischen Plural יַמִּים, statt ihn stillschweigend zu einem singularischen „Meer“ zu glätten.
- source_word: מִפְרָצָיו
  choice: seinen Buchten
  rationale: Das Wort bezeichnet Öffnungen oder Einschnitte; im Küstenkontext ist „Buchten“ eine anschauliche, nicht unnötig funktionalisierende Wiedergabe.
- source_word: יִשְׁכּוֹן
  choice: blieb
  rationale: Wie das erste Wohnverb beschreibt es Verweilen oder Wohnen und trägt hier den poetischen Vorwurf des Fernbleibens.
