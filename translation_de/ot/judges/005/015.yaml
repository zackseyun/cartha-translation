base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: de
  text: Und die Fürsten Issachars waren mit Debora[a], und ebenso Issachar mit Barak. Ins Tal wurde er entsandt, ihm auf dem Fuß folgend[b]. Unter den Abteilungen Rubens gab es große Erwägungen des Herzens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Anführer Issachars“ beziehungsweise „die Obersten Issachars“. Die hebräische Form ist poetisch und wohl idiomatisch zu verstehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an seinen Füßen“; gemeint ist wahrscheinlich, dass Issachar Barak dicht folgte. Das singularische „er“ kann Issachar als Stamm kollektiv bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „große Entschlüsse des Herzens“ beziehungsweise „großes Forschen des Herzens“. Die hebräische Wendung ist schwierig und hebt im Zusammenhang wahrscheinlich Rubens inneres Abwägen statt entschlossenen Handelns hervor.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי
  choice: die Fürsten Issachars
  rationale: Die poetische Form mit Suffix wird hier idiomatisch auf Issachars führende Männer bezogen. „Fürsten“ wahrt den gehobenen Ton; „Anführer“ wäre ebenfalls möglich.
- source_word: עִם
  choice: mit
  rationale: Bezeichnet schlicht Begleitung beziehungsweise gemeinsames Handeln.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: und ebenso Issachar mit Barak
  rationale: כֵּן drückt Entsprechung aus. Die Ellipse des Hebräischen bleibt in einer im Deutschen verständlichen poetischen Form erhalten.
- source_word: בָּעֵמֶק
  choice: ins Tal
  rationale: Im Zusammenhang mit שֻׁלַּח bezeichnet die Präpositionalfügung die Richtung der militärischen Bewegung.
- source_word: שֻׁלַּח
  choice: wurde er entsandt
  rationale: Die morphologisch singularische Verbform wird bewahrt und auf das kollektiv verstandene Issachar bezogen; so bleibt die grammatische Spannung des poetischen Textes sichtbar.
- source_word: בְּרַגְלָיו
  choice: ihm auf dem Fuß folgend
  rationale: Die Wendung bewahrt das Bild von den Füßen und macht zugleich idiomatisch deutlich, dass Issachar Barak dicht folgte.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: bei den Abteilungen Rubens
  rationale: פְּלַגּוֹת bezeichnet Unterteilungen oder Gruppierungen; „Abteilungen“ bleibt nahe am Wortlaut, ohne den Begriff sicher als Clans festzulegen.
- source_word: גְּדֹלִים
  choice: große
  rationale: Direkte Wiedergabe der verstärkenden Bedeutung.
- source_word: חִקְקֵי לֵב
  choice: Erwägungen des Herzens
  rationale: Die schwierige poetische Wendung bezeichnet im Kontext wohl innere Überlegungen oder Entschlüsse. „Erwägungen“ lässt die Spannung zwischen Beratung und ausbleibendem Handeln bestehen.
