  naturalness: „Ins Tal wurde er ihm auf dem Fuß folgend entsandt“ ist verständlich, aber durch die Stellung der Partizipialgruppe unnötig schwerfällig. Eine abgesetzte Formulierung ist im gehobenen poetischen Register klarer.
