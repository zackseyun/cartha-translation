source:
  edition: WLC
  text: נַ֤חַל קִישׁוֹן֙ גְּרָפָ֔/ם נַ֥חַל קְדוּמִ֖ים נַ֣חַל קִישׁ֑וֹן תִּדְרְכִ֥י נַפְשִׁ֖/י עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: de
  text: 'Der Bach Kischon riss sie fort —

    der uralte Bach[a], der Bach Kischon.

    Schreite kraftvoll voran, meine Seele![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der Bach aus alter Zeit“ oder „der Bach der Urzeit“. Das hebräische קְדוּמִים bezeichnet hohes Alter beziehungsweise frühere Zeiten; möglich ist auch eine verstärkende poetische Beschreibung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Tritt einher, meine Seele, in Kraft!“ oder „Tritt nieder, meine Seele, mit Macht!“ Die hebräische Wendung ist knapp und poetisch; das Verb kann neben dem Voranschreiten auch Treten oder Niedertreten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: Bach
  rationale: נַחַל bezeichnet einen Wasserlauf, ein Bachtal oder einen zeitweise reißenden Strom. Im Deutschen ist „Bach Kischon“ natürlich und traditionsnah; die Gewalt des Hochwassers wird durch „riss sie fort“ deutlich.
- source_word: קִישׁוֹן
  choice: Kischon
  rationale: Der Eigenname des Wasserlaufs wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: גְּרָפָם
  choice: riss sie fort
  rationale: Das Verb גרף bedeutet wegschwemmen oder fortreißen. „Riss sie fort“ bewahrt die gewaltsame Wasserbildlichkeit und gibt das Suffix der 3. Person Plural wieder.
- source_word: נַחַל קְדוּמִים
  choice: der uralte Bach
  rationale: קְדוּמִים verweist auf Vorzeit beziehungsweise hohes Alter. „Uralte“ wahrt den gehobenen poetischen Ton, ohne zwingend mythische Vorstellungen einzutragen.
- source_word: תִּדְרְכִי
  choice: Schreite … voran
  rationale: דרך kann treten, einherschreiten oder niedertreten bedeuten. „Schreite voran“ gibt die an die eigene Seele gerichtete, imperativisch wirkende Selbstaufforderung natürlich wieder; die kämpferischere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die wörtliche Selbstanrede bewahrt die poetische Rhetorik des Hebräischen besser als eine Auflösung mit „ich“ oder „mein Selbst“.
- source_word: עֹז
  choice: kraftvoll
  rationale: עֹז bedeutet Kraft oder Stärke. Das Adverb „kraftvoll“ gibt die wahrscheinlich adverbiale Funktion in der knappen poetischen Wendung idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene und zugleich verständliche poetische Sprache. Die Wiederholung von „Bach Kischon“ und die direkte Anrede „meine Seele“ bleiben erhalten. Zeilenumbrüche bilden den Parallelismus ab.
