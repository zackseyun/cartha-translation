source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: de
  text: Jahwe[a], als du von Seïr auszogst, als du vom offenen Land Edoms[b] einherschrittest, bebte die Erde; auch der Himmel tropfte, auch die Wolken tropften Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text schreibt den Gottesnamen mit den Konsonanten JHWH; „Jahwe“ ist die gebräuchliche deutsche Wiedergabe.
    reason: textual_or_pronunciation_clarification
  - marker: b
    text: 'Wörtlich: „vom Feld Edoms“; auch möglich: „vom Gebiet Edoms“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: JHWH
  rationale: Die vier Konsonanten des Gottesnamens werden als „JHWH“ wiedergegeben. So bleibt der im Hebräischen ausdrücklich verwendete Eigenname sichtbar, ohne eine unsichere Vokalisierung als eindeutig auszugeben.
- source_word: בְּצֵאתְךָ
  choice: als du … auszogst
  rationale: Die Präposition mit dem Infinitiv constructus bezeichnet hier den Zeitpunkt. „Auszogst“ gibt die gerichtete Bewegung und den feierlich-militärischen Kontext natürlich wieder.
- source_word: מִשֵּׂעִיר
  choice: von Seïr
  rationale: Der Ortsname wird transliteriert; die Trema-Schreibung macht im Deutschen die getrennte Aussprache der Vokale deutlich.
- source_word: בְּצַעְדְּךָ
  choice: als du … einherschrittest
  rationale: צעד bezeichnet ein Schreiten oder Marschieren. „Einherschrittest“ bewahrt die feierliche, zielgerichtete Bewegung der poetischen Gotteserscheinung, ohne sie ausdrücklich militärisch festzulegen.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: vom offenen Land Edoms
  rationale: שׂדה kann Feld, Flur oder offenes Land bezeichnen. „Offenes Land“ ist im Deutschen verständlich und bewahrt den räumlichen Charakter besser als das allgemeinere „Land Edom“.
- source_word: אֶרֶץ רָעָשָׁה
  choice: bebte die Erde
  rationale: Im Parallelismus mit Himmel und Wolken liegt die kosmische Bedeutung „Erde“ nahe. רָעשׁ bezeichnet heftiges Erzittern oder Beben.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: auch der Himmel tropfte
  rationale: נטף bedeutet tropfen oder triefen. Die bewusst ungewöhnliche poetische Aussage wird erhalten; „Himmel“ entspricht der idiomatischen deutschen Wiedergabe von שׁמים.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: auch die Wolken tropften Wasser
  rationale: Die Wiederholung von נטף wird auch im Deutschen wiederholt. Das ausdrücklich genannte מָיִם bleibt als Objekt „Wasser“ erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: JHWH
  alternative: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen selbst und nicht einen Titel wie „Herr“. Die Konsonantenschreibung „JHWH“ bewahrt diesen Unterschied und lässt die historisch nicht völlig sichere Aussprache offen.
- issue: Kosmische oder regionale Bedeutung von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Die anschließende Nennung von Himmel und Wolken spricht für eine kosmische Szene. Die mögliche regionale Lesart „Land“ wird dennoch nicht als unmöglich ausgeschlossen.
translation_notes:
  register: Moderne, gehobene poetische Standardsprache. Der Parallelismus und die wiederholte Formulierung mit „auch“ und „tropfte/tropften“ bleiben erhalten. „Einherschrittest“ setzt einen feierlichen Akzent, ohne die Bildsprache unnötig zu erklären.
