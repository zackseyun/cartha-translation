    rationale: אַבִּירָיו bedeutet primär „seine Mächtigen/Starken“; die Deutung als Hengste ergibt sich aus dem Kontext. Die Fußnote sollte dies als kontextuelle Bezugsmöglichkeit kennzeichnen.
