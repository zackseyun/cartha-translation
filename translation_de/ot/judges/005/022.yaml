  source_fidelity: 'Der Entwurf gibt die Abfolge und Bildlichkeit des Hebräischen grundsätzlich zutreffend wieder: אָז als „Da“, הָלְמוּ als kräftiges Aufschlagen und עִקְּבֵי סוּס kollektiv als Pferdehufe. Auch die Wiederholung von דַּהֲרוֹת wird sinnvoll beibehalten. אַבִּירָיו bleibt im Text offen und wird nicht unzulässig auf Hengste oder Krieger festgelegt.'
  naturalness: „Vom Galoppieren“ ist nach „stampften die Hufe“ im modernen Deutschen schwerfällig und idiomatisch wenig überzeugend. „Seiner Starken“ wirkt zudem als substantivierte Personenbezeichnung künstlich. „Dahinstürmen“ bewahrt den bewegten, poetischen Charakter und kann sowohl von Pferden als auch von Kämpfern gesagt werden; „seiner Mächtigen“ ist die natürliche gehobene deutsche Entsprechung für אַבִּירָיו.
  terminology: „Mächtigen“ gibt אַבִּירָיו angemessen wieder, ohne die umstrittene nähere Referenz festzulegen. Die Fußnote sollte nicht behaupten, der Ausdruck bezeichne selbst „starke Pferde“; sie kann im Kontext auf Hengste bezogen verstanden werden, kann aber auch die zugehörigen mächtigen Krieger meinen.
