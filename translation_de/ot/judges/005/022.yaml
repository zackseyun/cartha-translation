  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: de
  text: Da hämmerten die Hufe der Pferde vom Dahinstürmen, vom Dahinstürmen seiner Mächtigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Blick auf die Pferde: „vom Dahinstürmen seiner starken Hengste“; oder: „vom Anstürmen seiner mächtigen Krieger“. Das hebräische Wort bedeutet „seine Mächtigen“ und kann sich in diesem Zusammenhang auf die Pferde oder auf die mit ihnen verbundenen Krieger beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Markiert in dem Lied den nächsten lebhaft geschilderten Augenblick und klingt im Deutschen poetisch und natürlich.
- source_word: הָלְמוּ
  choice: stampften
  rationale: Gibt das kraftvolle, hörbare Aufschlagen der Pferdehufe idiomatisch wieder.
- source_word: עִקְּבֵי סוּס
  choice: die Hufe der Pferde
  rationale: עִקְּבֵי bezeichnet wörtlich Fersen beziehungsweise den hinteren Teil des Fußes; im Zusammenhang mit Pferden ist ‚Hufe‘ die natürliche Wiedergabe. Der Singular סוּס wird kollektiv verstanden.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: vom Galoppieren, vom Galoppieren
  rationale: Das Präfix מִן bezeichnet hier Ursache oder Ausgangspunkt. Die Wiederholung wird bewahrt, weil sie die Bewegung und Wucht poetisch verstärkt.
- source_word: אַבִּירָיו
  choice: seiner Starken
  rationale: Die substantivierte Bezeichnung meint ‚seine Mächtigen/Starken‘ und kann hier starke Pferde oder die mit ihnen verbundenen Krieger bezeichnen. Die offene Formulierung bewahrt diese Mehrdeutigkeit.
theological_decisions:
- issue: Bezug von אַבִּירָיו und des Suffixes der 3. Person Singular
  choice: seiner Starken
  alternative: seiner starken Hengste; seiner mächtigen Krieger
  rationale: Der poetische Zusammenhang legt die feindliche Streitmacht nahe, legt aber nicht eindeutig fest, ob unmittelbar Pferde oder Krieger gemeint sind. Die Übersetzung entscheidet dies nicht über den hebräischen Text hinaus.
translation_notes:
  register: Moderne, gehobene und zugleich verständliche Liedsprache. Die Wiederholung bildet die Wucht des hebräischen Verses nach; die ungewöhnliche Wendung „seiner Starken“ bleibt wegen der echten Mehrdeutigkeit des Ausgangstextes bewusst offen.
