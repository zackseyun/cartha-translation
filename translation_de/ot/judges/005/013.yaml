id: JDG.5.13
reference: Judges 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: de
  text: Da zog der Rest gegen die Vornehmen hinab[a]; Jahwes Volk zog für mich[b] gegen die Mächtigen hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Da zog ein Überlebender zu den Vornehmen hinab.“ Der hebräische Wortlaut dieser poetischen Zeile ist schwierig; die Präpositionen können auch nicht feindlich im Sinn von „zu“, „für“, „mit“ oder „unter“ verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich „für mich“; wahrscheinlich spricht Debora hier in dichterischer Form von sich selbst.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Leitet knapp und natürlich die nächste Bewegung innerhalb des poetischen Berichts ein.
- source_word: יְרַד / יְרַד
  choice: zog … hinab
  rationale: Bewahrt die zweimalige Verwendung desselben hebräischen Verbs und klingt im militärisch-poetischen Zusammenhang natürlicher als „stieg herab“.
- source_word: שָׂרִיד
  choice: der Rest
  rationale: Das singularische Kollektiv bezeichnet das, was beziehungsweise wer übrig geblieben ist; „der Rest“ erhält diese kollektive Offenheit.
- source_word: לְאַדִּירִים
  choice: gegen die Vornehmen
  rationale: אַדִּירִים bezeichnet hochgestellte oder mächtige Personen. Die feindliche Deutung der Präposition passt zum Kampfzusammenhang, bleibt aber in einer Fußnote als unsicher ausgewiesen.
- source_word: עָם יְהוָה
  choice: Jahwes Volk
  rationale: Gibt die Zugehörigkeit des Volkes zu JHWH knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen gebräuchliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לִי
  choice: für mich
  rationale: Entspricht der naheliegenden Bedeutung der Präposition mit dem Suffix der ersten Person und wahrt den möglichen Selbstbezug Deboras.
- source_word: בַּגִּבּוֹרִים
  choice: gegen die Mächtigen
  rationale: Der Kampfzusammenhang erlaubt eine feindliche Deutung der Präposition; „Mächtige“ bewahrt zugleich den weiteren Bedeutungsumfang von גִּבּוֹרִים.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich; die Umschrift bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Präpositionen in beiden Vershälften
  choice: 'feindliche Bedeutung: „gegen die Vornehmen“ und „gegen die Mächtigen“'
  alternative: 'nicht feindliche Bedeutung: „zu/für die Vornehmen“ und „mit/unter den Mächtigen“'
  rationale: Der militärische Zusammenhang und der Parallelismus sprechen für die feindliche Bedeutung. Da die poetische Syntax jedoch schwierig und mehrdeutig ist, werden andere Möglichkeiten ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Satzstruktur. Die Wiederholung „zog … hinab“ bildet die hebräische Wiederholung ab; die echte syntaktische Mehrdeutigkeit wird nicht im Haupttext geglättet, sondern in der Fußnote offengelegt.
