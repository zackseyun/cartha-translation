source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: de
  text: Fern von den Rufen der Bogenschützen zwischen den Wasserstellen erzählen sie dort von den gerechten Taten Jahwes, von den gerechten Taten seiner Dorfbewohner in Israel.[a] Dann zog Jahwes Volk hinab zu den Toren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die eröffnende Wendung ist schwierig. Das hier wiedergegebene „fern von“ versteht die Präposition trennend und passt zum Zusammenhang sicherer Wasserstellen. Auch möglich: „Beim Ruf der Bogenschützen an den Wasserstellen“ oder „Von den Rufen der Bogenschützen an den Wasserstellen her“. „Zwischen“ gibt das hebräische Wort wörtlicher wieder als „an“. Das mit „Dorfbewohner“ wiedergegebene hebräische Wort ist ebenfalls umstritten; es kann auch Landbevölkerung oder unbefestigte Siedlungen bezeichnen, weniger wahrscheinlich „Herrscher“.'
    reason: alternative_reading
  - marker: b
    text: Die Stadttore waren öffentliche Versammlungsorte. Dort spielten sich gemeinschaftliches Leben und Rechtsprechung ab; zugleich standen sie für die Sicherheit der Stadt.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: Von den Rufen der Bogenschützen her
  rationale: מִקּוֹל bezeichnet hier den Ausgangspunkt beziehungsweise den hörbaren Zusammenhang; die partizipiale Form מְחַצְצִים wird im Kontext als Bezeichnung für Bogenschützen verstanden. Die schwierige und mehrdeutige Wendung wird in einer Fußnote offengehalten.
- source_word: בֵּין מַשְׁאַבִּים
  choice: zwischen den Wasserschöpfstellen
  rationale: Die Wiedergabe bildet sowohl בֵּין als auch die Orte des Wasserschöpfens konkret und ohne unnötige Verallgemeinerung ab.
- source_word: יְתַנּוּ
  choice: erzählen sie
  rationale: Das Piel bezeichnet hier das mündliche Wiedergeben oder Rühmen von Taten. »Erzählen« lässt offen, ob dies gesprochen oder gesungen geschieht.
- source_word: צִדְקוֹת יְהוָה
  choice: die gerechten Taten Jahwes
  rationale: Der Plural bezeichnet konkrete Taten, in denen sich Jahwes Gerechtigkeit und rettendes Handeln zeigen; die Wiedergabe vermeidet die Verengung auf bloße Siege.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Umschrift gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: die gerechten Taten seiner Dorfbewohner
  rationale: Die schwierige Form פִּרְזֹנוֹ wird entsprechend der verwandten Form in Richter 5,7 auf die ländliche Dorfbevölkerung bezogen. Andere mögliche Deutungen werden in einer Fußnote genannt.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: Dann zog … hinab zu den Toren
  rationale: »Dann« gibt den zeitlichen beziehungsweise folgernden Anschluss wieder; »hinabziehen« bewahrt die Bewegungsrichtung des Verbs ירד.
- source_word: עַם יְהוָה
  choice: Jahwes Volk
  rationale: Die knappe deutsche Genitivverbindung entspricht der hebräischen Status-constructus-Verbindung und bewahrt die Zugehörigkeitsaussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« gibt ihn in geläufiger deutscher Form wieder, anstatt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צִדְקוֹת im Siegeslied
  choice: gerechte Taten
  alternative: Rettungstaten
  rationale: Die gewählte Formulierung bewahrt den Bezug zur Gerechtigkeit und lässt zugleich zu, dass die Taten im Zusammenhang als rettendes Handeln verstanden werden.
- issue: Genitivische Zuordnung in צִדְקֹת פִּרְזֹנוֹ
  choice: gerechte Taten seiner Dorfbewohner
  alternative: gerechte Taten an seiner Landbevölkerung
  rationale: Der hebräische Ausdruck lässt offen, ob die ländliche Bevölkerung als Handelnde oder als Begünstigte im Blick ist. Der formnähere Genitiv bleibt im Haupttext stehen; die lexikalische Unsicherheit wird vermerkt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Satzführung. Konkrete Bildwörter wie »Wasserschöpfstellen« und »Tore« bleiben erhalten; textliche Unsicherheiten werden nicht im Haupttext geglättet, sondern knapp in den Fußnoten ausgewiesen.
