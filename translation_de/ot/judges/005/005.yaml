  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: de
  text: Die Berge strömten herab vor Jahwe[a], dieser Sinai vor Jahwe[a], dem Gott Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »vom Angesicht Jahwes her« beziehungsweise »vor der Gegenwart Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: die Berge
  rationale: Der bestimmte Artikel wird wiedergegeben; »Berge« entspricht dem üblichen Sinn und passt zur Sinai-Theophanie.
- source_word: נָזְלוּ
  choice: flossen dahin
  rationale: Das Verb bezeichnet ein Fließen, Strömen oder Tropfen. Die Formulierung bewahrt das auffällige poetische Bild, statt es kontextuell zu »erbebten« umzudeuten.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Wendung bedeutet wörtlich »vom Angesicht her/vor dem Angesicht von« und bezeichnet hier die Reaktion auf Jahwes Gegenwart; »vor« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: זֶה סִינַי
  choice: dieser Sinai
  rationale: Die abrupte demonstrative Form des poetischen Hebräisch bleibt erhalten; »Berg« wird nicht ergänzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die Apposition identifiziert Jahwe als Israels Gott; der Dativ fügt sich natürlich an das zweite »vor Jahwe« an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt dessen persönliche und bundesgeschichtliche Funktion.
- issue: Poetisches Theophanie-Bild in נָזְלוּ
  choice: Die Berge flossen dahin
  alternative: Die Berge schmolzen / erbebten
  rationale: »Flossen dahin« hält am lexikalischen Bild fest. »Schmolzen« erklärt das Bild bereits, während »erbebten« zwar in den Zusammenhang passt, aber nicht die gewöhnliche Bedeutung des Verbs wiedergibt.
translation_notes:
  register: Gehobene, aber verständliche poetische Standardsprache. Die ungewöhnliche Wendung »dieser Sinai« und das Bild der dahinfließenden Berge wurden bewusst nicht geglättet, damit die Verdichtung und Mehrdeutigkeit des hebräischen Liedes erhalten bleiben.
