  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: de
  text: Das Dorfleben[a] kam in Israel zum Erliegen; es kam zum Erliegen, bis ich, Debora, aufstand — bis ich als Mutter in Israel aufstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Dorfbewohner in Israel gab es nicht mehr“ beziehungsweise „die Landbevölkerung in Israel gab es nicht mehr“. Das hebräische Substantiv ist schwer zu deuten und kann die Bewohner der Dörfer oder allgemeiner das dörfliche Leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: kam zum Erliegen / es kam zum Erliegen
  rationale: Die wiederholte Form von חדל bezeichnet ein Aufhören. „Zum Erliegen kommen“ gibt den Zusammenbruch des normalen ländlichen Lebens natürlich und würdevoll wieder; die Wiederholung bewahrt die poetische Eindringlichkeit.
- source_word: פְרָזוֹן
  choice: das Leben in den Dörfern
  rationale: Das schwierige Substantiv kann die Bewohner unbefestigter Ortschaften, die ländliche Bevölkerung oder das dörfliche Leben bezeichnen. Die gewählte Formulierung erfasst den sozialen Zustand, ohne die lexikalische Unsicherheit im Haupttext unnötig zu verengen.
- source_word: בְּיִשְׂרָאֵל
  choice: Israels / in Israel
  rationale: Beim „Leben in den Dörfern Israels“ wird die Zugehörigkeit idiomatisch ausgedrückt; bei „Mutter in Israel“ bleibt die örtlich-soziale Formulierung des Hebräischen unmittelbar erhalten.
- source_word: עַד
  choice: bis
  rationale: „Bis“ markiert den Wendepunkt, an dem Deboras Auftreten die zuvor herrschende Lage beendet.
- source_word: שַׁקַּמְתִּי
  choice: ich ... aufstand
  rationale: קום bezeichnet hier Deboras Auftreten zum Handeln. „Aufstand“ wahrt die Ich-Form und die poetische Wiederholung.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: אֵם
  choice: Mutter
  rationale: Die Formulierung beschreibt Deboras schützende und führende Rolle. Nach „als“ steht im Deutschen idiomatisch kein unbestimmter Artikel.
theological_decisions:
- issue: Metaphorische Bedeutung von אֵם בְּיִשְׂרָאֵל
  choice: „als Mutter in Israel“
  alternative: „als Mutter Israels“ oder eine rein wörtlich-biologische Deutung
  rationale: Das Hebräische sagt „Mutter in Israel“, nicht „Mutter Israels“. Die Wiedergabe bewahrt diese Beziehung und lässt die metaphorische Bedeutung einer schützenden, fürsorglichen Führungsrolle offen hervortreten, ohne daraus einen stärkeren Titel zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Wiederholung. „Zum Erliegen kommen“ ist verständlich und bringt den gesellschaftlichen Stillstand stärker zum Ausdruck als das schlichtere „aufhören“. Der Gedankenstrich kennzeichnet den nachdrücklichen Neuansatz der wiederholten Aussage.
