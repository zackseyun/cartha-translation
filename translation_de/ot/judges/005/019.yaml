  text: בָּ֤אוּ מְלָכִים֙ נִלְחָ֔מוּ אָ֤ז נִלְחֲמוּ֙ מַלְכֵ֣י כְנַ֔עַן בְּ/תַעְנַ֖ךְ עַל מֵ֣י מְגִדּ֑וֹ בֶּ֥צַע כֶּ֖סֶף לֹ֥א לָקָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: de
  text: Könige kamen; sie kämpften. Da kämpften die Könige Kanaans bei Taanach, an den Wassern von Megiddo. Beute an Silber nahmen sie nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Silbergewinn« beziehungsweise »Gewinn an Silber«. Der hebräische Ausdruck kann allgemein materiellen Gewinn bezeichnen; im Zusammenhang der Schlacht liegt »Beute an Silber« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: Könige kamen
  rationale: Die artikellose Nominalphrase und das knappe Verb ergeben einen pointierten poetischen Auftakt; die hebräische Wortstellung wird im natürlichen Deutschen umgestellt.
- source_word: נִלְחָמוּ
  choice: sie kämpften
  rationale: Das Nifal von לחם bezeichnet hier schlicht das Kämpfen beziehungsweise den Kampf; die kurze Form wahrt den poetischen Rhythmus.
- source_word: אָז
  choice: Damals
  rationale: אָז kann sowohl zeitlich als »damals« als auch fortschreitend als »da/dann« verstanden werden. »Damals« passt hier zur rückblickenden Liedsprache, ohne eine engere Abfolge zu erzwingen.
- source_word: מַלְכֵי כְנַעַן
  choice: die Könige Kanaans
  rationale: Die Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und würdig wieder.
- source_word: בְּתַעְנַךְ
  choice: bei Taanach
  rationale: Die Präposition ב bezeichnet hier den Ort des Kampfes; »bei« ist angesichts des Schlachtgebiets idiomatisch und vermeidet die Behauptung, der Kampf habe innerhalb der Stadt stattgefunden.
- source_word: עַל מֵי מְגִדּוֹ
  choice: an den Wassern von Megiddo
  rationale: עַל bezeichnet hier die Lage bei einem Gewässer beziehungsweise Wasserlauf. Die traditionelle geografische Wendung bleibt erhalten, ohne die nicht näher bezeichneten »Wasser« zu präzisieren.
- source_word: בֶּצַע כֶּסֶף
  choice: Silberne Beute
  rationale: בֶּצַע kann Gewinn, Profit oder Beute bezeichnen. Im Schlachtzusammenhang ist »Beute« naheliegend; »silberne Beute« bewahrt zugleich die Verbindung mit כֶּסֶף.
- source_word: לֹא לָקָחוּ
  choice: nahmen sie nicht
  rationale: Die einfache negierte Verbform wird direkt wiedergegeben; die Endstellung von »nicht« betont im Deutschen den ausbleibenden Gewinn.
