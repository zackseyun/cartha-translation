translation_notes:
  register: Knappe, rhythmische und gehobene Liedsprache in modernem Standarddeutsch. Die Wiederholung von »kamen/kämpften« sowie die geografischen Angaben bleiben bewusst erhalten; der mehrdeutige Ausdruck בֶּצַע כֶּסֶף wird im Text kontextuell übersetzt und in der Fußnote offengehalten.
