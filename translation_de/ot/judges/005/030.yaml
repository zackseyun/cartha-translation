  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: de
  text: »Finden und verteilen sie nicht die Beute? Einen Mutterleib[a], zwei Mutterleiber für jeden Mann; Beute aus gefärbten Stoffen für Sisera, Beute aus gefärbten Stoffen – bestickter Stoff – gefärbter Stoff[b], zwei Stickereien für die Hälse der Beute.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »ein Mutterleib, zwei Mutterleiber« – eine brutale Metonymie für Frauen, die als sexuelle Kriegsbeute genommen werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für die Hälse der Gefangenen / der als Beute Genommenen«. Die hebräische Schlusswendung ist schwierig und kann sich auf bestickte Stoffe beziehen, die gefangene Frauen am Hals tragen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  choice: Finden und verteilen sie nicht gerade
  rationale: Die rhetorische Frage und die erwartete, lebhaft vorgestellte Handlung werden im natürlichen deutschen Präsens wiedergegeben; „gerade“ vermittelt den fortlaufenden Charakter, ohne eine abgeschlossene Handlung festzulegen.
- source_word: שָׁלָל
  choice: Beute
  rationale: Ein geläufiger militärischer Ausdruck für im Krieg Genommenes; er funktioniert sowohl bei Personen als auch bei Textilien und erhält dadurch die harte Mehrdeutigkeit des Verses.
- source_word: רַחַם רַחֲמָתַיִם
  choice: einen Mutterleib, zwei Mutterleiber
  rationale: Die wörtliche, entmenschlichende Metonymie wird bewahrt, statt sie beschönigend mit „Frau“ oder „Mädchen“ wiederzugeben. Der Dual wird ausdrücklich mit „zwei“ wiedergegeben.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: für jeden Mann
  rationale: Das distributive Idiom „für den Kopf eines Mannes“ bedeutet hier „pro Mann“; die natürliche deutsche Form wahrt Geschlecht und Verteilungssinn.
- source_word: צְבָעִים
  choice: gefärbte Stoffe
  rationale: Bezeichnet farbig gefärbte Textilien innerhalb der Beute; „Stoffe“ vermeidet die unbelegte Festlegung auf fertige Kleidungsstücke.
- source_word: רִקְמָה
  choice: bestickter Stoff
  rationale: Die textile Bedeutung wird explizit und verständlich wiedergegeben, während die appositionelle Reihung erhalten bleibt.
- source_word: צֶבַע רִקְמָתַיִם
  choice: gefärbter Stoff, zwei Stickereien
  rationale: Die gedrängte hebräische Folge und der Dual bleiben sichtbar; eine syntaktische Glättung zu einem einzigen doppelt bestickten Kleidungsstück wäre stärker interpretierend.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: für die Hälse der Beute
  rationale: Die schwierige und mehrdeutige Formulierung wird im Haupttext eng am Hebräischen belassen; mögliche personale Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Die sexualisierte Kriegsbeute-Metonymie רַחַם רַחֲמָתַיִם
  choice: Wörtlich „einen Mutterleib, zwei Mutterleiber“
  alternative: „eine Frau, zwei Frauen“ oder „ein Mädchen, zwei Mädchen“
  rationale: Die Worte geben die brutale Erwartung aus Siseras Umfeld wieder, nicht die moralische Billigung des Erzählers. Die wörtliche Metonymie erhält die Entmenschlichung und den erschütternden Ton.
- issue: Die schwierige Schlusswendung לְצַוְּארֵי שָׁלָל
  choice: Nahe Wiedergabe „für die Hälse der Beute“ mit erklärender Fußnote
  alternative: „für die Hälse der Gefangenen“ beziehungsweise „der als Beute genommenen Frauen“
  rationale: Syntax und Bezug sind umstritten. Der Haupttext soll die echte Unbestimmtheit nicht vorschnell auflösen; die verständlichere personale Deutung wird als Möglichkeit ausgewiesen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst harter, quellennaher Wortwahl. Die poetische Aufzählung und Wiederholung der Textilien bleiben erhalten; schwer verständliche Hebraismen werden nur dort idiomatisch geglättet, wo ihr Sinn hinreichend klar ist.
