  text: בִּ/פְרֹ֤עַ פְּרָעוֹת֙ בְּ/יִשְׂרָאֵ֔ל בְּ/הִתְנַדֵּ֖ב עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: de
  text: Als in Israel die Anführer vorangingen[a], als das Volk sich freiwillig stellte, preist den HERRN!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist unsicher. Möglich ist auch: „Als man in Israel das Haar frei wallen ließ“; dies könnte die Bereitschaft der Kämpfer oder eine Gelübdepraxis bezeichnen.'
    reason: Die seltene Verbindung von פרע mit פרעות lässt sowohl eine Deutung im Sinn von Führung als auch eine auf ungebundenes Haar bezogene Deutung zu; diese echte lexikalische Mehrdeutigkeit soll sichtbar bleiben.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: Als … die Anführer vorangingen
  rationale: Die seltene und poetische Wendung ist umstritten. Im Zusammenhang mit dem freiwilligen Einsatz des Volkes lässt sie sich plausibel auf das führende Vorangehen beziehen; die mögliche Bedeutung des freien beziehungsweise ungebundenen Haupthaars wird in der Fußnote bewahrt.
- source_word: בְּהִתְנַדֵּב עָם
  choice: als das Volk sich freiwillig stellte
  rationale: Das Hitpael von נדב bezeichnet freiwillige Bereitschaft beziehungsweise freiwilligen Einsatz. „Sich freiwillig stellen“ klingt im Deutschen natürlich und passt zum militärischen Kontext des Liedes.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: Der Piel-Imperativ Plural von ברך fordert die Hörenden auf, JHWH lobend zu segnen; „preist“ gibt diese Funktion in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wahrt die erkennbare Unterscheidung des Gottesnamens, ohne eine bestimmte Rekonstruktion seiner Aussprache vorauszusetzen.
translation_notes:
  register: Poetisch, feierlich und zugleich in modernem Standarddeutsch verständlich. Die parallelen „Als“-Sätze und der abschließende Aufruf bewahren den hymnischen Rhythmus des Deboraliedes.
