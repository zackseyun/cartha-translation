  text: חַכְמ֥וֹת שָׂרוֹתֶ֖י/הָ תַּעֲנֶ֑ינָּה אַף הִ֕יא תָּשִׁ֥יב אֲמָרֶ֖י/הָ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: de
  text: 'Ihre weisesten Fürstinnen antworten ihr; ja, sie selbst antwortet sich mit ihren Worten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: die Weisesten ihrer Fürstinnen
  rationale: חַכְמוֹת ist hier am ehesten als superlativisch gebrauchte Bezeichnung innerhalb der Fürstinnen zu verstehen; „Fürstinnen“ gibt שָׂרוֹת im höfischen Zusammenhang natürlich und würdig wieder.
- source_word: תַּעֲנֶינָּה
  choice: antworten
  rationale: Die feminine Pluralform bezeichnet die Antwort der Fürstinnen an Sisera’s Mutter.
- source_word: אַף הִיא
  choice: ja, sie selbst
  rationale: אַף verstärkt hier die Aussage und hebt hervor, dass auch die Mutter selbst spricht.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: erwidert sich ihre eigenen Worte
  rationale: Die Konstruktion lässt wörtlich erkennen, dass sie ihre Worte an sich selbst richtet beziehungsweise sich selbst Antwort gibt; die Formulierung wahrt diese ungewöhnliche, dichterische Selbstadressierung.
theological_decisions: []
translation_notes:
  register: Poetisch verdichtetes, modernes Standarddeutsch. Die ungewöhnliche Selbstantwort der Mutter wird nicht psychologisierend erklärt oder geglättet; der Doppelpunkt erhält den Übergang zur folgenden direkten Rede.
