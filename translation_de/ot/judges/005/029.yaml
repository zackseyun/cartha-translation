  source_fidelity: 'Die Wiedergabe von חַכְמוֹת als „Die Weisesten ihrer Fürstinnen“ verschiebt die Syntax: Sie kann im Deutschen eine Auswahl innerhalb einer Gruppe von Fürstinnen ausdrücken. Der hebräische Ausdruck bezeichnet ihre weisen bzw. im Kontext ihre weisesten Fürstinnen. Die Selbstadressierung in תָּשִׁיב אֲמָרֶיהָ לָהּ soll erhalten bleiben.'
