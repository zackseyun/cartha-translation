    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: sangen
  rationale: Von שׁיר, »singen«. Das feminine Singularverb stimmt grammatisch mit Debora als erstgenanntem Subjekt überein; da Barak anschließend mit וּ angeschlossen wird, gibt der deutsche Plural den gemeinsamen Gesang natürlich wieder.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: וּבָרָק
  choice: und Barak
  rationale: Die Konjunktion und der Personenname werden unmittelbar wiedergegeben.
- source_word: בֶּן אֲבִינֹעַם
  choice: der Sohn Abinoams
  rationale: Natürliche deutsche Wiedergabe der hebräischen Abstammungsangabe; der Genitiv kennzeichnet den Vater.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Bewahrt die temporale Präposition und verweist in würdigem, geläufigem Deutsch auf den bestimmten Tag.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Das hebräische Quotativ leitet den folgenden Liedtext ein. Im Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als die formelhafte Wiedergabe »und sprachen« oder »mit den Worten«.
