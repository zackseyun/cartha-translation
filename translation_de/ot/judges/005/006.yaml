  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: de
  text: Zur Zeit Schamgars, des Sohnes Anats, zur Zeit Jaëls wurden die Hauptstraßen nicht mehr benutzt[a]; wer auf den Pfaden unterwegs war, ging auf verschlungenen Wegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Straßen hörten auf“ – das heißt, der gewöhnliche Verkehr auf ihnen kam zum Erliegen.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „verschlungenen Wegen“ sind wahrscheinlich indirekte Ausweichrouten gemeint, die man aus Sicherheitsgründen nahm, nicht moralisch verwerfliche Wege.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: zur Zeit
  rationale: Gibt die hebräische Zeitangabe in natürlichem, gehobenem Standarddeutsch wieder.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Schamgar, der Sohn Anats
  rationale: Die Eigennamen werden nach geläufiger deutscher Bibeltradition übertragen; die Abstammungsangabe bleibt wörtlich erhalten.
- source_word: יָעֵל
  choice: Jaël
  rationale: Geläufige deutsche Form des Eigennamens.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: die Hauptstraßen wurden nicht mehr benutzt
  rationale: חָדַל bedeutet wörtlich „aufhören“; bei Straßen ist gemeint, dass ihre gewöhnliche Nutzung ausblieb. „Hauptstraßen“ verdeutlicht den Gegensatz zu den anschließend genannten Pfaden, ohne moderne Fernstraßen anzudeuten.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: wer auf den Pfaden unterwegs war
  rationale: Gibt die Wendung „die auf Pfaden Gehenden“ idiomatisch wieder und bewahrt נְתִיבוֹת als eigene Wegbezeichnung.
- source_word: יֵלְכוּ
  choice: ging
  rationale: Das Imperfekt beschreibt im poetischen Rückblick ein wiederholtes beziehungsweise übliches Verhalten.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: auf verschlungenen Wegen
  rationale: Bewahrt das Bild verdrehter beziehungsweise gewundener Wege und bezeichnet im Kontext wahrscheinlich indirekte Ausweichrouten.
