  register: Poetisch-gehobenes, aber allgemein verständliches Standarddeutsch. Die Wiederholung „zur Zeit“ und der Wechsel zwischen Hauptstraßen, Pfaden und verschlungenen Wegen bewahren Struktur und Bildsprache des Hebräischen.
