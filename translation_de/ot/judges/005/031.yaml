base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: de
  text: So mögen alle deine Feinde umkommen, Jahwe! Doch die ihn lieben[a], mögen sein wie die Sonne, wenn sie in ihrer Kraft aufgeht[b]. Und das Land hatte vierzig Jahre Ruhe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wechselt hier von der direkten Anrede „deine Feinde“ zur dritten Person „die ihn lieben“. Gemeint ist weiterhin Jahwe.
    reason: pronoun_referent
  - marker: b
    text: 'Wörtlicher: „wie das Hervortreten der Sonne in ihrer Kraft“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Das Land war ruhig“. Im Buch der Richter bezeichnet diese Wendung gewöhnlich eine Zeit des Friedens und der Ruhe nach einem Konflikt.'
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: So sollen … umkommen
  rationale: כֵּן leitet den abschließenden Wunsch ein; der imperfektische Verbgebrauch hat hier jussivischen Sinn. „Sollen … umkommen“ gibt diesen Wunsch in natürlichem Deutsch wieder, ohne die Art des Untergangs näher festzulegen.
- source_word: כָל אוֹיְבֶיךָ
  choice: alle deine Feinde
  rationale: Gibt die Gesamtheit und den Suffix der zweiten Person Singular direkt wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des göttlichen Eigennamens bewahrt den im Hebräischen ausdrücklich stehenden Namen statt ihn durch einen Titel zu ersetzen.
- source_word: וְאֹהֲבָיו
  choice: Doch die ihn lieben
  rationale: Das וְ bildet hier einen inhaltlichen Gegensatz zu Jahwes Feinden. Das maskuline Suffix der dritten Person verweist auf Jahwe; der Wechsel von direkter Anrede zu dritter Person bleibt erhalten.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ
  choice: wie die Sonne, wenn sie … aufgeht
  rationale: יצא bezeichnet beim Sonnenlauf ihr Hervortreten beziehungsweise Aufgehen. Die Formulierung ist bildhaft, klar und entspricht natürlichem modernem Deutsch.
- source_word: בִּגְבֻרָתוֹ
  choice: in ihrer Kraft
  rationale: Das Suffix bezieht sich auf die Sonne und beschreibt ihr kraftvolles Erscheinen. Wegen des grammatischen Geschlechts von „Sonne“ steht im Deutschen „ihrer“.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: Und das Land hatte … Ruhe
  rationale: Das Verb bezeichnet hier nicht bloß akustische Stille, sondern die Ruhe des Landes nach dem Konflikt, wie in der wiederkehrenden Richter-Formel.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich; „Jahwe“ bewahrt ihn und ersetzt ihn nicht durch einen Titel.
- issue: Bezug des Pronomens in וְאֹהֲבָיו
  choice: „ihn“ bezieht sich auf Jahwe; der Personenwechsel bleibt sichtbar
  alternative: 'Wiederholung der direkten Anrede: „die dich lieben“'
  rationale: Das hebräische Suffix steht in der dritten Person Singular, obwohl Jahwe unmittelbar zuvor direkt angeredet wird. Die Übersetzung glättet diesen auffälligen Wechsel nicht.
- issue: Modalität der zweiten Vergleichshälfte
  choice: „sollen sein“ als Fortführung des abschließenden Wunsches
  alternative: 'Aussage: „sind wie“'
  rationale: Im Hebräischen steht in der zweiten Hälfte kein ausdrückliches Verb. Im Zusammenhang liegt die Fortführung des vorangehenden jussivischen Wunsches nahe; die Ergänzung bleibt jedoch als syntaktische Deutung kenntlich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die direkte Anrede und der anschließende Wechsel zur dritten Person wurden bewusst beibehalten; die wiederkehrende Schlussformel des Richterbuches wurde idiomatisch wiedergegeben.
