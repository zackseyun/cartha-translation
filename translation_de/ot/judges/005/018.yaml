base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: de
  text: Sebulon war ein Volk, das sein Leben bis zum Tod aufs Spiel setzte[a], und Naftali ebenso auf den Höhen des Feldes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »das sein Leben bis zum Tod verachtete«; gemeint ist, dass es sein Leben selbst angesichts des Todes aufs Spiel setzte. Im Hebräischen steht Sebulon als Kollektiv im Singular.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf den Höhen des offenen Landes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: Sebulon
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: עַם
  choice: ein Volk
  rationale: Bewahrt die substantivische, kollektiv-singularische Bezeichnung Sebulons.
- source_word: חֵרֵף נַפְשׁוֹ
  choice: setzte sein Leben aufs Spiel
  rationale: Gibt im kriegerischen Zusammenhang idiomatisch wieder, dass Sebulon das eigene Leben geringschätzte beziehungsweise der Todesgefahr aussetzte; die wörtlichere Bedeutungsnuance wird in der Fußnote bewahrt.
- source_word: לָמוּת
  choice: bis zum Tod
  rationale: Bezeichnet das äußerste Ausmaß beziehungsweise mögliche Ergebnis der Selbstgefährdung.
- source_word: וְנַפְתָּלִי
  choice: und Naftali ebenso
  rationale: Die Ellipse übernimmt die vorherige Aussage auch für Naftali; »ebenso« macht den Parallelismus im Deutschen deutlich.
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: auf den Höhen des Feldes
  rationale: Bewahrt das topografische Bild und vermeidet die nicht ausdrücklich im Hebräischen stehende Deutung als Schlachtfeld.
