  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: de
  text: »Verflucht Meroz!«, sagte der Engel[a] Jahwes. »Verflucht, ja, verflucht die Bewohner von Meroz! Denn sie kamen Jahwe nicht zu Hilfe, Jahwe nicht zu Hilfe gegen die Mächtigen.[b]«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist mehrdeutig: Sie kann „gegen die Mächtigen“, wörtlicher „unter den Mächtigen“ oder auch „mit den mächtigen Kriegern“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: Verflucht / Verflucht, ja, verflucht
  rationale: Die Imperative von ארר drücken einen starken Fluch aus. Die Verbindung von Imperativ und absolutem Infinitiv wird durch „ja“ verstärkend wiedergegeben, ohne die Aussage unnötig auszubauen.
- source_word: מֵר֗וֹז
  choice: Meroz
  rationale: Der Eigenname wird transliteriert; wahrscheinlich ist ein Ort gemeint, doch der Vers nennt nur den Namen.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Engel“ oder „Bote“ bedeuten. In dieser biblischen Wendung ist „Engel Jahwes“ natürlich; die mögliche Bedeutung „Bote“ bleibt in einer Fußnote sichtbar.
- source_word: יֹשְׁבֶ֑יהָ
  choice: seine Bewohner
  rationale: Das feminine Suffix bezieht sich auf Meroz als Ortschaft. Im Deutschen ist der Ortsname grammatisch maskulin, daher „seine“.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: Denn sie kamen ... nicht
  rationale: כִּי führt die Begründung für den Fluch ein; „denn“ wahrt den poetischen und erklärenden Zusammenhang.
- source_word: לְעֶזְרַ֣ת יְהוָ֔ה
  choice: Jahwe zu Hilfe
  rationale: Die idiomatische deutsche Wendung bewahrt die nominale Vorstellung des Hebräischen und lässt die rhetorische Wiederholung natürlich klingen.
- source_word: בַּגִּבּוֹרִֽים
  choice: gegen die Helden
  rationale: Die Präposition בְּ ist hier syntaktisch mehrdeutig. „Gegen die Helden“ ergibt im Kampfzusammenhang einen plausiblen Sinn; andere mögliche Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass der im hebräischen Text ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Identität und Funktion von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Die Übersetzung entscheidet nicht, ob damit ein geschaffenes Engelwesen, ein menschlicher Bote oder eine besondere Erscheinungsweise Jahwes gemeint ist; sie gibt die traditionelle und kontextuell natürliche Bedeutung wieder und nennt die lexikalische Alternative.
- issue: Bezug von בַּגִּבּוֹרִים
  choice: gegen die Helden
  alternative: unter den Helden / mit den Helden
  rationale: Der Kampfkontext begünstigt „gegen die Helden“, doch die ungewöhnliche Konstruktion erlaubt auch andere Beziehungen. Diese Spannung wird nicht verschwiegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Direktrede. Die Wiederholung des hebräischen Liedtextes bleibt erhalten; schwer verständliche Wörtlichkeit wird nur dort idiomatisch geglättet, wo der Sinn sonst verdeckt würde.
