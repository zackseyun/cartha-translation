  text: תְּבֹרַךְ֙ מִ/נָּשִׁ֔ים יָעֵ֕ל אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י מִ/נָּשִׁ֥ים בָּ/אֹ֖הֶל תְּבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: de
  text: Unter Frauen sei Jaël,[a] die Frau Hebers, des Keniters, am meisten gesegnet; unter Frauen im Zelt[b] sei sie am meisten gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Mehr als Frauen sei Jaël gesegnet … mehr als Frauen im Zelt sei sie gesegnet.« Die hebräische Vergleichskonstruktion kann sowohl mit »unter … am meisten« als auch mit »mehr als/über« wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »im Zelt«. Gemeint sein können Frauen des Zeltes, also zeltbewohnende Frauen; im Hebräischen steht jedoch der Singular.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: sei … gesegnet
  rationale: Der Pual Jussiv/Imperfekt von ברך lässt sich als Segenswunsch wiedergeben. In Verbindung mit der Vergleichskonstruktion מִן trägt »mehr als alle Frauen« die gesteigerte Aussage; die Wiederholung wahrt den poetischen Rahmen.
- source_word: מִנָּשִׁים
  choice: mehr als alle Frauen
  rationale: מִן kennzeichnet hier den Vergleich. Diese Formulierung gibt den komparativ-superlativen Sinn natürlich wieder und bewahrt zugleich die mögliche Bedeutung »über/mehr als« deutlicher als ein ausschließlich gruppenbezogenes »unter«.
- source_word: יָעֵל
  choice: Jaël
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition mit Trema geschrieben, damit die getrennte Aussprache der Vokale erkennbar bleibt.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: die Frau Hebers, des Keniters
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Jaël als Hebers Ehefrau und Heber als Angehörigen der Keniter. Die Apposition ist im Deutschen klar und würdig.
- source_word: בָּאֹהֶל
  choice: im Zelt
  rationale: Die singularische hebräische Form wird wörtlich bewahrt. Sie kann im Zusammenhang Frauen der Zeltgemeinschaft oder zeltbewohnende Frauen bezeichnen, ohne dass diese Deutung in den Haupttext eingetragen wird.
- source_word: תְּבֹרָךְ
  choice: sei sie gesegnet
  rationale: Die erneute Wiedergabe desselben Verbs erhält die emphatische Wiederholung und den poetischen Klang des Verses.
theological_decisions: []
translation_notes:
  register: Poetisch gehobenes, aber modernes Standarddeutsch. Die zweimalige Segensformel und die parallele Satzstruktur bleiben erhalten; die echte Ambiguität zwischen Segenswunsch und Feststellung sowie zwischen »unter« und »mehr als« wird durch Haupttext und Fußnote sichtbar gemacht.
