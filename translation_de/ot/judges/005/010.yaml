  text: רֹכְבֵי֩ אֲתֹנ֨וֹת צְחֹר֜וֹת יֹשְׁבֵ֧י עַל מִדִּ֛ין וְ/הֹלְכֵ֥י עַל דֶּ֖רֶךְ שִֽׂיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: de
  text: Ihr, die ihr auf weißen Eselinnen reitet, ihr, die ihr auf Teppichen[a] sitzt, und ihr, die ihr auf der Straße geht – sprecht[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „auf Satteldecken“ beziehungsweise „auf Decken“. Das hebräische Wort ist selten und seine Bedeutung unsicher.
    reason: lexical_alternative
  - marker: b
    text: Oder „erzählt davon“ oder „sinnt darüber nach“. Das hebräische Verb kann sowohl Sprechen und Erzählen als auch Nachsinnen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: ihr, die ihr … reitet
  rationale: Das Qal-Partizip im Plural steht hier wie die folgenden Partizipien als Anrede. Die direkte Anrede gibt den poetischen Aufruf natürlich wieder.
- source_word: אֲתֹנוֹת
  choice: Eselinnen
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich weibliche Esel. Im Deutschen ist „Eselinnen“ verständlich und bewahrt diese konkrete Bedeutung.
- source_word: צְחֹרוֹת
  choice: weiß
  rationale: Das Adjektiv bezeichnet am ehesten eine weiße oder helle Farbe; „weiße Eselinnen“ ist die naheliegende traditionelle Deutung.
- source_word: יֹשְׁבֵי
  choice: die ihr … sitzt
  rationale: Das parallele Partizip wird ebenfalls als direkte Anrede wiedergegeben. „Sitzen“ passt zur folgenden Bezeichnung einer Sitzunterlage.
- source_word: מִדִּין
  choice: Teppichen
  rationale: Das seltene Wort ist unsicher. Im Zusammenhang mit Reitenden und Reisenden sind kostbare Decken, Teppiche oder Sitzunterlagen wahrscheinlicher als eine rechtliche Bedeutung.
- source_word: וְהֹלְכֵי
  choice: und ihr, die ihr … geht
  rationale: Die konkrete Bewegung des Partizips „gehen“ bleibt erhalten, während die wiederholte Anrede die poetische Parallelstruktur sichtbar macht.
- source_word: דֶּרֶךְ
  choice: Straße
  rationale: Das häufige Wort kann Weg oder Straße bedeuten. Hier bezeichnet es den Verkehrsweg der zu Fuß Reisenden.
- source_word: שִׂיחוּ
  choice: sprecht
  rationale: Der Imperativ kann sprechen, erzählen, nachsinnen oder besingen bedeuten. „Sprecht“ bewahrt die Weite des Ausdrucks, ohne den nicht genannten Gegenstand ausdrücklich zu ergänzen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Anrede mit bewahrter dreigliedriger Parallelstruktur. Das spezifische „Eselinnen“ folgt dem Hebräischen; die beiden wesentlichen lexikalischen Unsicherheiten werden in Fußnoten offengehalten.
