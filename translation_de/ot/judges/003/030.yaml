  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: de
  text: So wurde Moab an jenem Tag der Macht Israels unterworfen[a], und das Land hatte achtzig Jahre lang Ruhe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter der Hand Israels«; gemeint ist: unter Israels Macht oder Herrschaft.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »und das Land blieb achtzig Jahre lang ungestört« beziehungsweise »war achtzig Jahre lang still«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: wurde … gebeugt
  rationale: Der Niphal von כנע beschreibt hier, dass Moab militärisch-politisch unterworfen beziehungsweise niedergehalten wurde. »Wurde gebeugt« bewahrt das Bild des hebräischen Ausdrucks, ohne eine Vernichtung anzudeuten.
- source_word: מוֹאָב
  choice: Moab
  rationale: Die im Deutschen übliche Form des Völker- und Landesnamens.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der temporalen Wendung mit erhaltener demonstrativer Bedeutung.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: unter Israels Hand
  rationale: Die hebräische Metapher bezeichnet Israels Macht oder Herrschaft. Ihre Beibehaltung bewahrt die Bildsprache; eine Fußnote erläutert den Sinn.
- source_word: וַתִּשְׁקֹט
  choice: hatte … Ruhe
  rationale: שׁקט bezeichnet Ruhe und das Ausbleiben von Störung oder Krieg. Im Kontext des Richterbuchs drückt die Form eine längere friedliche Ruhezeit aus.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Die naheliegende und kontextgerechte Wiedergabe; sie lässt offen, ob besonders Israel oder die gesamte betroffene Region im Blick ist.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: achtzig Jahre lang
  rationale: Idiomatiche deutsche Angabe einer Zeitdauer.
theological_decisions:
- issue: Art der Unterordnung Moabs unter Israel
  choice: militärisch-politische Unterwerfung in der überlieferten Bildsprache »unter Israels Hand«
  alternative: bloße Demütigung oder vollständige Vernichtung Moabs
  rationale: Der Zusammenhang berichtet von Moabs Niederlage und Israels anschließender Ruhezeit. Der Text bezeichnet Herrschaft beziehungsweise Unterwerfung, sagt aber weder nur eine innere Demütigung noch die Auslöschung Moabs aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Metapher »unter Israels Hand« bleibt im Haupttext erhalten und wird erläutert; »hatte … Ruhe« ist verständlich und bewahrt zugleich die für das Richterbuch typische Formel.
