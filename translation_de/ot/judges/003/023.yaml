  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: de
  text: Dann ging Ehud in den Vorraum[a] hinaus, schloss die Türen des oberen Raumes hinter sich und verriegelte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Vorhalle“, „in das Vorzimmer“ oder „in den Säulengang“; das seltene hebräische Wort bezeichnet einen angrenzenden Gebäudebereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging … hinaus/in den Vorraum
  rationale: Das Qal-Wayyiqtol von יצא bezeichnet im Erzählfluss das Hinausgehen. In Verbindung mit dem direkt folgenden Richtungsziel wird die Bewegung idiomatisch als „ging … in den Vorraum“ wiedergegeben.
- source_word: הַמִּסְדְּרוֹנָה
  choice: in den Vorraum
  rationale: מִסְדְּרוֹן ist eine seltene Architekturbezeichnung; das Richtungs-ה zeigt eine Bewegung in diesen angrenzenden Bereich an. „Vorraum“ ist verständlich und legt die genaue Bauform nicht unnötig fest.
- source_word: וַיִּסְגֹּר
  choice: schloss
  rationale: סגר bedeutet hier, Türen zu schließen; „schloss“ ist die natürliche deutsche Erzählform.
- source_word: דַּלְתוֹת
  choice: die Türen
  rationale: Der Plural kann Türflügel beziehungsweise eine mehrteilige Tür bezeichnen. „Die Türen“ bewahrt die grammatische Mehrzahl.
- source_word: הָעֲלִיָּה
  choice: des Obergemachs
  rationale: עֲלִיָּה bezeichnet einen erhöht gelegenen Raum. „Obergemach“ ist präzise, würdig und im biblischen Architekturkontext verständlich.
- source_word: בַּעֲדוֹ
  choice: hinter sich
  rationale: Bei Verben des Schließens bezeichnet בעד die räumliche Abschirmung hinter einer Person. Das deutsche Reflexivpronomen bezieht sich eindeutig auf Ehud.
- source_word: וְנָעָל
  choice: und verriegelte sie
  rationale: נעל bezeichnet hier das Sichern beziehungsweise Versperren einer Tür. „Verriegelte“ passt zur antiken Türtechnik, ohne einen modernen Schließmechanismus vorauszusetzen; das Objekt „sie“ nimmt die Türen auf.
