  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: de
  text: 'Sie warteten, bis es ihnen peinlich wurde[a], und siehe: Er öffnete die Türen des oberen Raums[b] nicht. Da nahmen sie den Schlüssel und öffneten sie. Und siehe: Ihr Herr[c] lag tot am Boden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „bis sie sich schämten“. Die hebräische Wendung kann Scham oder gesellschaftliche Verlegenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Türen des Obergemachs“ oder „die Türen des Dachgemachs“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „Gebieter“. Gemeint ist hier ihr menschlicher Herr, Eglon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: sie warteten
  rationale: Das Verb bezeichnet hier das fortgesetzte Warten der Diener vor dem verschlossenen Raum. „Sie warteten“ ist im Deutschen natürlich und gibt die Erzählhandlung klar wieder.
- source_word: עַד בּוֹשׁ
  choice: bis es ihnen peinlich wurde
  rationale: Die Wendung bezeichnet den Punkt, an dem das lange Warten Scham oder gesellschaftliche Verlegenheit auslöste. Die unpersönliche Formulierung bewahrt die situative Nuance, ohne moralische Schuld anzudeuten.
- source_word: וְהִנֵּה
  choice: doch siehe / und siehe
  rationale: Die Partikel hebt jeweils eine überraschende Wahrnehmung hervor. Beim ersten Vorkommen verbindet „doch“ den Befund mit der enttäuschten Erwartung; „siehe“ erhält die anschauliche Erzählwirkung.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: er öffnete … nicht
  rationale: Die Konstruktion beschreibt, dass das erwartete Öffnen ausblieb. Das deutsche Präteritum gibt dies im Erzählzusammenhang idiomatisch wieder; ein zusätzliches „noch immer“ wäre zwar kontextuell möglich, steht aber nicht ausdrücklich im Hebräischen.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: die Türen des Obergemachs
  rationale: עֲלִיָּה bezeichnet einen erhöhten beziehungsweise oberen Raum. „Obergemach“ ist präzise, würdig und in diesem historischen Erzählzusammenhang verständlich; der Plural „Türen“ bleibt erhalten.
- source_word: הַמַּפְתֵּחַ
  choice: den Schlüssel
  rationale: Direkte und eindeutige Wiedergabe des hebräischen Substantivs.
- source_word: וַיִּפְתָּחוּ
  choice: und öffneten sie
  rationale: Das Pronomen nimmt die zuvor genannten Türen auf und vermeidet eine unnötige Wiederholung.
- source_word: אֲדֹנֵיהֶם
  choice: ihr Herr
  rationale: Das Wort bezeichnet hier Eglon als menschlichen Herrn beziehungsweise Vorgesetzten seiner Diener, nicht Gott.
- source_word: נֹפֵל אַרְצָה מֵת
  choice: lag tot am Boden
  rationale: Die Wendung schildert den beim Öffnen vorgefundenen Zustand. „Lag tot am Boden“ ist im Deutschen natürlich und vermittelt das Ergebnis des Zu-Boden-Fallens, ohne einen in der deutschen Formulierung unpassenden Ablauf zu konstruieren.
theological_decisions:
- issue: Bedeutung von אֲדֹנֵיהֶם
  choice: „ihr Herr“ als Bezeichnung für Eglon
  alternative: „ihr Gebieter“ oder „ihr Dienstherr“
  rationale: Der Kontext verlangt eine menschliche Herrschaftsbezeichnung. Die Übersetzung vermeidet eine Deutung als Gottesbezeichnung, ohne die soziale Rangordnung abzuschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das zweimalige „siehe“ bewahrt den markanten Wahrnehmungswechsel des hebräischen Textes. „Obergemach“ hält den historischen räumlichen Bezug fest, ohne altertümliche Syntax zu verwenden.
