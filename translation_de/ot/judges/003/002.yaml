  terminology: „Söhne Israels“ kann als bewusst wörtliche Wiedergabe von בְּנֵי יִשְׂרָאֵל beibehalten werden; die Alternative „Israeliten“ bleibt sinnvoll in der Fußnote. „Kriegführen“ gibt מִלְחָמָה im Zusammenhang mit לְלַמְּדָם angemessen wieder. Die Schlussformulierung verwendet im Deutschen das singuläre „ihn“ zu „Krieg“; die Abweichung von der pluralischen hebräischen Objektendung wird transparent vermerkt.
