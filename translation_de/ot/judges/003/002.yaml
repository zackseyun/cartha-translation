source:
  edition: WLC
  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: de
  text: nur damit die Generationen der Söhne Israels[a] Krieg kennenlernten, um sie im Kriegführen zu unterweisen – nur diejenigen, die ihn zuvor nicht kannten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“. Wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Objektpronomen ist pluralisch; sein genauer Bezug ist umstritten. Sinngemäß kann gemeint sein: „die zuvor keine Kriegserfahrung hatten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: nur / allerdings nur
  rationale: Die zweimalige Einschränkung wird bewahrt. Beim zweiten Vorkommen verdeutlicht „allerdings“ den einschränkenden Anschluss, ohne die Wiederholung von „nur“ aufzugeben.
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet einen Zwecksatz ein und entspricht natürlichem modernem Deutsch.
- source_word: דַּעַת
  choice: davon Kenntnis bekämen
  rationale: Der Infinitiv von ידע bezeichnet hier das Erlangen von Kenntnis oder Erfahrung. Die Formulierung lässt den Bezug zum Krieg aus dem folgenden Satzteil offen, ohne bereits ausdrücklich „erfahren“ zu sagen.
- source_word: דֹּרוֹת
  choice: die Generationen
  rationale: Gibt den Plural und die Konstruktverbindung unmittelbar wieder; „künftige“ ist kontextuell naheliegend, steht aber nicht ausdrücklich im Hebräischen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die konkrete hebräische Bezeichnung des Volkes; die idiomatische Wiedergabe „Israeliten“ wird in einer Fußnote genannt.
- source_word: לְלַמְּדָם
  choice: um sie … zu unterweisen
  rationale: Gibt den Piel von למד mit dem Objektpronomen wieder. „Unterweisen“ passt zum militärischen Gegenstand, ohne den allgemeinen Lehrbegriff unnötig auf „ausbilden“ zu verengen.
- source_word: מִלְחָמָה
  choice: in der Kriegführung
  rationale: Im Deutschen verlangt die Verbindung mit „unterweisen“ eine idiomatische Fassung. „Kriegführung“ bezeichnet das Erlernen des Krieges als Tätigkeit, nicht bloß eine einzelne Schlacht.
- source_word: אֲשֶׁר לְפָנִים
  choice: die … früher
  rationale: Gibt den relativen Anschluss und den zeitlichen Rückblick knapp und natürlich wieder.
- source_word: לֹא יְדָעוּם
  choice: sie … nicht gekannt hatten
  rationale: Das maskuline Pluralobjekt -ם wird formal als „sie“ bewahrt. Sein Bezug ist im Hebräischen nicht völlig durchsichtig; eine Fußnote erläutert die naheliegende sinngemäße Deutung als fehlende Kriegserfahrung.
theological_decisions:
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptfassung bewahrt die grammatisch maskuline, traditionelle Volksbezeichnung, ohne zu behaupten, dass nur männliche Einzelpersonen gemeint seien. Die idiomatische kollektive Bedeutung steht in der Fußnote.
- issue: Bedeutung und Bezug von „Krieg kennen“
  choice: davon Kenntnis bekämen … sie früher nicht gekannt hatten
  alternative: Kriegserfahrung sammelten … zuvor keinen Krieg erlebt hatten
  rationale: Die Übersetzung hält sich an ידע („kennen/wissen“) und bewahrt beim abschließenden Pluralpronomen die formale Mehrdeutigkeit, statt den Ausdruck ausschließlich als praktische Kriegserfahrung auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Formulierung „Söhne Israels“ folgt bewusst der hebräischen Volksbezeichnung; „in der Kriegführung unterweisen“ ist gegenüber dem unnatürlichen „Krieg lehren“ idiomatisch. Die syntaktische Abhängigkeit vom vorausgehenden Vers und die Wiederholung von רַק bleiben erkennbar.
