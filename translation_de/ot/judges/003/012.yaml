  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: de
  text: Und die Israeliten taten erneut, was böse war in den Augen Jahwes. Da stärkte Jahwe Eglon, den König von Moab, gegen Israel, weil sie getan hatten, was böse war in den Augen Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: taten erneut
  rationale: Die Verbindung von יסף mit dem Infinitiv bezeichnet hier die Wiederholung der Handlung. „Taten erneut“ gibt den zyklischen Zusammenhang im Richterbuch natürlich und präzise wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne Israels“, dient hier aber als übliche Volksbezeichnung. „Die Israeliten“ ist im modernen Deutschen klar und schließt das ganze Volk ein.
- source_word: לַעֲשׂוֹת הָרַע
  choice: taten, was böse war
  rationale: Die Formulierung gibt den substantivierten Ausdruck הָרַע idiomatisch wieder, ohne die moralische Bewertung abzuschwächen.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die im Hebräischen geläufige Bewertungsmetapher bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיְחַזֵּק
  choice: stärkte
  rationale: Der Piel von חזק bezeichnet ein aktives Stärken. Die direkte Wiedergabe bewahrt die ausdrückliche göttliche Urheberschaft und die theologische Spannung des Satzes.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Eglon, den König von Moab
  rationale: Die Apposition wird mit Kommas natürlich und eindeutig ins Deutsche übertragen.
- source_word: עַל יִשְׂרָאֵל
  choice: gegen Israel
  rationale: Im feindlichen Zusammenhang bezeichnet עַל die gegen Israel gerichtete Machtstellung beziehungsweise Aktion.
- source_word: עַל כִּי
  choice: weil
  rationale: Die Partikelverbindung leitet den ausdrücklich genannten Grund für Jahwes Handeln ein.
- source_word: עָשׂוּ אֶת הָרַע
  choice: sie getan hatten, was böse war
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass Israels böses Handeln den vorausliegenden Grund für die Strafhandlung bildet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Göttliche Urheberschaft in וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן
  choice: Da stärkte Jahwe Eglon
  alternative: Da ließ Jahwe Eglon stark werden
  rationale: Das Verb schreibt Jahwe aktives Handeln zu. Die Übersetzung wahrt diese Aussage und löst die darin liegende theologische Spannung nicht durch eine bloße Zulassungsformulierung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Metapher „in den Augen“ und die Wiederholung der moralischen Bewertung bleiben bewusst erhalten. „Israeliten“ wird der im Deutschen missverständlicheren wörtlichen Form „Söhne Israels“ vorgezogen.
