base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: de
  text: 'Als er hinausgegangen war, kamen seine Diener. Da sahen sie: Die Türen des Oberzimmers waren verschlossen. Sie sagten: »Sicher erleichtert er sich[a] im kühlen Raum.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Er bedeckt seine Füße« – eine hebräische verhüllende Ausdrucksweise für das Verrichten der Notdurft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: Als er hinausgegangen war
  rationale: Die temporale Wiedergabe macht den Rückbezug auf Ehuds Weggang und die anschließende Ankunft der Diener im Deutschen natürlich deutlich, ohne den hebräischen Erzählablauf zu verändern.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im königlichen Haushalt bezeichnet das Wort hier Eglons Bedienstete; ihr rechtlicher Status steht nicht im Vordergrund.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: Als sie nachsahen, waren
  rationale: Die Formulierung gibt sowohl das Wahrnehmen als auch den überraschenden Befund von וְהִנֵּה in flüssigem modernem Deutsch wieder.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: die Türen des Obergemachs
  rationale: עֲלִיָּה bezeichnet einen erhöht gelegenen Raum beziehungsweise ein Oberzimmer; „Obergemach“ passt zum architektonischen und erzählerischen Kontext.
- source_word: נְעֻלוֹת
  choice: verschlossen
  rationale: Das Partizip bezeichnet den Zustand verriegelter oder abgeschlossener Türen; „verschlossen“ lässt die genaue Schließvorrichtung offen.
- source_word: אַךְ
  choice: Sicher
  rationale: Die Partikel leitet hier die zuversichtliche Vermutung der Diener ein.
- source_word: מֵסִיךְ הוּא אֶת רַגְלָיו
  choice: erleichtert er sich
  rationale: Die wörtliche Wendung „seine Füße bedecken“ ist ein hebräischer Euphemismus für die Verrichtung der Notdurft. Die idiomatische Bedeutung steht zur Verständlichkeit im Haupttext, die Bildsprache in der Fußnote.
- source_word: בַּחֲדַר הַמְּקֵרָה
  choice: im kühlen Gemach
  rationale: Die Wendung bezeichnet ein privates, mit Kühlung beziehungsweise Kühle verbundenes Gemach. Die Übersetzung bewahrt diese Funktion, ohne eine nicht ausdrücklich genannte bauliche Anlage festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Euphemismus wird im Haupttext sinngemäß wiedergegeben; seine konkrete hebräische Bildsprache bleibt in der Fußnote erhalten. „Obergemach“ und „Gemach“ bewahren die räumliche Unterscheidung des Ausgangstextes.
