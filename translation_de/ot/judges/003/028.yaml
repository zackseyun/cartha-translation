  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Folgt mir[a], denn Jahwe hat eure Feinde, Moab, in eure Hand gegeben.« Da zogen sie ihm folgend hinab und besetzten die Jordanfurten in Richtung Moab[b]; sie ließen niemanden hinübergehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Setzt mir nach.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Jordanübergänge gegen Moab«. Die hebräische Präposition kann hier Richtung, Zuordnung oder einen feindlichen Bezug ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: Folgt mir
  rationale: רדף bedeutet meist »verfolgen«; hier ist jedoch Ehuds Aufforderung an seine Mitkämpfer gemeint, ihm im militärischen Vorgehen nachzusetzen. »Folgt mir« ist natürliches Deutsch, während die Verfolgungsnuance in einer Fußnote erhalten bleibt.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: hat ... in eure Hand gegeben
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt eines anderen. Die bildhafte Formulierung ist auch im Deutschen verständlich und bewahrt den abgeschlossenen, Zuversicht begründenden Charakter der Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: eure Feinde, Moab
  rationale: »Moab« steht als Apposition zu »eure Feinde«. Die Wiedergabe erhält sowohl die hebräische Struktur als auch die kollektive Bezeichnung des Volkes durch den Ländernamen.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: Da zogen sie hinter ihm hinab
  rationale: ירד bezeichnet das Hinabziehen aus dem Bergland in Richtung Jordantal; »hinter ihm« nimmt die räumliche und führungsbezogene Aussage von אַחֲרָיו auf.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: die Jordanfurten
  rationale: Gemeint sind passierbare Übergangsstellen des Jordan; »Furten« ist dafür der präzise und im militärischen Zusammenhang natürliche Ausdruck.
- source_word: לְמוֹאָב
  choice: nach Moab hin
  rationale: Die Präposition לְ kann hier Richtung, Zuordnung oder feindlichen Bezug anzeigen. »Nach Moab hin« bewahrt den naheliegenden Richtungssinn, ohne die im Kontext mögliche Beziehung zu Moab zu überpräzisieren.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: sie ließen niemanden hinübergehen
  rationale: Die wörtliche Konstruktion »sie gaben keinen Mann, hinüberzugehen« ist eine Erlaubnisformel. »Sie ließen niemanden hinübergehen« gibt sie idiomatisch und vollständig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext verwendet den Eigennamen; »Jahwe« bewahrt diesen, statt ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: מוֹאָב als kollektive nationale Bezeichnung
  choice: Moab
  alternative: die Moabiter
  rationale: Der hebräische Text nennt ausdrücklich »Moab« und nicht die entsprechende Volksbezeichnung. Die Apposition bleibt dadurch in ihrer ungewohnten, aber verständlichen Form erhalten.
- issue: Bezug von לְמוֹאָב
  choice: nach Moab hin
  alternative: gegen Moab
  rationale: לְ erlaubt im Zusammenhang mehrere Nuancen. Die Übersetzung wahrt den Richtungssinn; die alternative adversative Deutung wird nicht stillschweigend festgeschrieben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der narrative Fluss bleibt knapp; militärisch-geografische Begriffe werden präzise wiedergegeben. Die appositionelle Form »eure Feinde, Moab« und die Mehrdeutigkeit von לְמוֹאָב werden bewusst bewahrt.
