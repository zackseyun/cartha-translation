  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: de
  text: Er überreichte Eglon, dem König von Moab, den Tribut.[a] Eglon war ein sehr dicker Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gabe« oder »Geschenk«. Das hebräische Wort mincha kann eine Gabe oder Opfergabe bezeichnen; hier ist wahrscheinlich ein Tribut gemeint, den ein unterworfenes Volk seinem Herrscher entrichtete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Er überreichte
  rationale: Der Hifil von קרב bezeichnet hier das Heranbringen beziehungsweise feierliche Übergeben an einen Herrscher. »Überreichte« gibt den höfischen Vorgang natürlich wieder.
- source_word: הַמִּנְחָה
  choice: die Abgabe
  rationale: מִנְחָה kann Gabe, Geschenk oder Opfergabe bedeuten; im Zusammenhang der moabitischen Fremdherrschaft ist eine von Unterworfenen an den Herrscher entrichtete Abgabe gemeint. »Abgabe« ist im modernen Deutsch natürlicher als »Tribut«, ohne den politischen Zwang auszublenden.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Eglon, dem König von Moab
  rationale: Die Apposition wird im Deutschen idiomatisch mit Artikel und Dativ wiedergegeben.
- source_word: וְעֶגְלוֹן
  choice: Eglon aber
  rationale: Das Waw leitet eine erläuternde Beschreibung Eglons ein. »Aber« markiert diesen Übergang im Deutschen knapp und natürlich.
- source_word: אִישׁ
  choice: Mann
  rationale: Das maskuline Substantiv bezeichnet konkret Eglon; »Mann« entspricht Form und Bezug.
- source_word: בָּרִיא מְאֹד
  choice: sehr dicker
  rationale: בָּרִיא bezeichnet hier körperliche Fülle; מְאֹד verstärkt die Aussage. Die direkte Formulierung ist für den weiteren Erzählverlauf bedeutsam.
