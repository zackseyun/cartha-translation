base_translation:
  language: en
  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: de
  text: Und die Israeliten lebten unter den Kanaanitern, den Hetitern, den Amoritern, den Perisitern, den Hiwitern und den Jebusitern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Und die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ bezeichnet hier das Volk Israel insgesamt. „Israeliten“ gibt diesen kollektiven Sinn im modernen Deutschen natürlich und ohne sachlichen Bedeutungsverlust wieder.
- source_word: יָשְׁבוּ
  choice: lebten
  rationale: Das Verb ישׁב kann „sitzen, wohnen, leben, bleiben“ bedeuten. Hier beschreibt es den fortdauernden Aufenthalt unter den Völkern des Landes; „lebten“ ist klar und gegenwärtig.
- source_word: בְּקֶרֶב
  choice: unter
  rationale: In Verbindung mit dem Wohnen bezeichnet בְּקֶרֶב das Leben inmitten einer Gruppe. Deutsch „unter“ ist dafür idiomatisch und bewahrt den relationalen Sinn.
- source_word: הַכְּנַעֲנִי
  choice: den Kanaanitern
  rationale: Der morphologische Singular ist ein kollektives Ethnonym und wird im Deutschen natürlich als pluralische Volksbezeichnung wiedergegeben.
- source_word: הַחִתִּי
  choice: den Hetitern
  rationale: Kollektives Ethnonym; die deutsche Pluralform bezeichnet die Volksgruppe idiomatisch.
- source_word: הָאֱמֹרִי
  choice: den Amoritern
  rationale: Kollektives Ethnonym; als deutsche pluralische Volksbezeichnung wiedergegeben.
- source_word: הַפְּרִזִּי
  choice: den Perisitern
  rationale: Kollektives Ethnonym; die Form „Perisiter“ entspricht einer gebräuchlichen deutschen biblischen Namensform.
- source_word: הַחִוִּי
  choice: den Hiwitern
  rationale: Kollektives Ethnonym; als pluralische Volksbezeichnung idiomatisch wiedergegeben.
- source_word: הַיְבוּסִי
  choice: den Jebusitern
  rationale: Kollektives Ethnonym; als pluralische Volksbezeichnung idiomatisch wiedergegeben.
