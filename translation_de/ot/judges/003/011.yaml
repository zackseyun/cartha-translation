base_translation:
  language: en
  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: de
  text: So hatte das Land vierzig Jahre lang Ruhe. Dann starb Otniel, der Sohn des Kenas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: So hatte … Ruhe
  rationale: שׁקט bezeichnet hier einen Zustand der Ruhe und Ungestörtheit nach der Befreiung. „Ruhe haben“ ist im Deutschen natürlich und deutet nicht mehr an, als der Kontext hergibt.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ meint im Zusammenhang des Richterbuches das Land beziehungsweise das Gebiet Israels, nicht die ganze Erde.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: Die Zeitangabe bezeichnet die Dauer der Ruhe; „Jahre lang“ gibt diese Funktion idiomatisch wieder.
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Waw mit Imperfekt führt die Erzählung zeitlich weiter. „Dann“ bildet diesen Fortgang im modernen Deutschen klar ab.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition wiedergegeben.
- source_word: בֶּן קְנַז
  choice: der Sohn des Kenas
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Otniels Abstammung. Die bestimmte Apposition klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und erzählerisch. Die Formulierung bewahrt den Zusammenhang zwischen Befreiung und anschließender Ruhe, ohne vollständigen Wohlstand oder absolute Friedensverhältnisse ausdrücklich zu behaupten.
