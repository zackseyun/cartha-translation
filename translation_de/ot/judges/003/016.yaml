base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: de
  text: Ehud fertigte sich ein Schwert an, das zwei Schneiden hatte[a] und eine Gomed lang war[b]. Er befestigte es unter seinen Kleidern an seinem rechten Oberschenkel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Schwert, und es hatte zwei Münder“; gemeint ist ein zweischneidiges Schwert.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Längenmaß Gomed kommt nur selten vor; seine genaue Länge ist unbekannt. Es wird häufig ungefähr als eine Elle oder Unterarmlänge verstanden.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: fertigte sich … an
  rationale: Die Verbindung von עשה mit לוֹ bezeichnet, dass Ehud die Waffe für den eigenen Gebrauch herstellte. „Fertigte sich … an“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: חֶרֶב
  choice: Schwert
  rationale: חֶרֶב ist die allgemeine Bezeichnung für ein Schwert. Trotz der offenbar kurzen Waffe wird nicht das engere „Dolch“ gewählt, weil der hebräische Ausdruck diese Festlegung nicht verlangt.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: das zwei Schneiden hatte
  rationale: Wörtlich hat das Schwert „zwei Münder“; dies ist ein hebräisches Bild für zwei Schneiden. Die gewählte Formulierung bewahrt die konkrete Aussage, ohne im Deutschen missverständlich zu wirken.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: etwa eine Unterarmlänge lang
  rationale: גֹּמֶד ist ein seltenes und in seiner genauen Länge unbekanntes Maß, das wahrscheinlich einer kurzen Elle beziehungsweise Unterarmlänge entsprach. „Etwa“ macht kenntlich, dass die moderne Angabe nur eine Annäherung ist.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: befestigte es
  rationale: חגר bezeichnet das Umgürten oder Anschnallen eines Gegenstands. „Befestigte“ ist in Verbindung mit dem genannten Ort natürlich und vermeidet die altertümliche Wendung „gürtete es um“.
- source_word: מִתַּחַת לְמַדָּיו
  choice: unter seinen Kleidern
  rationale: מַד kann ein Kleidungsstück oder Kleidung bezeichnen. Der Plural wird allgemein und ohne unnötige Festlegung auf eine bestimmte Gewandart wiedergegeben.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: an seinem rechten Oberschenkel
  rationale: יָרֵךְ bezeichnet den Oberschenkel beziehungsweise Hüftbereich. „Am rechten Oberschenkel“ gibt die körperliche Lage der verborgenen Waffe klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seltene Maßangabe wird verständlich angenähert, ihre Unsicherheit aber ausdrücklich in der Fußnote bewahrt. Die Waffe bleibt entsprechend dem allgemeinen hebräischen Begriff ein „Schwert“ und wird nicht als „Dolch“ präzisiert.
