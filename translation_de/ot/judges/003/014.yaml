  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: de
  text: Und die Söhne Israels dienten Eglon, dem König von Moab, achtzehn Jahre lang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, interpretierend: „Die Israeliten waren Eglon, dem König von Moab, achtzehn Jahre lang unterworfen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: Das Verb עבד bezeichnet hier den Dienst unter einem fremden Herrscher und damit politische Unterwerfung, nicht Gottesdienst. „Dienten“ wahrt die hebräische Ausdrucksweise; die eindeutigere Deutung steht in der Fußnote.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bildet die hebräische kollektive und geschlechtlich markierte Bezeichnung formal genau ab; „die Israeliten“ wäre im Deutschen idiomatischer, aber weniger quellennah.
- source_word: אֶת עֶגְלוֹן
  choice: Eglon
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und wird im Deutschen nicht eigens wiedergegeben. Der Personenname wird in der üblichen Form „Eglon“ wiedergegeben.
- source_word: מֶלֶךְ מוֹאָב
  choice: dem König von Moab
  rationale: Die Apposition verlangt nach dem deutschen Verb „dienen“ den Dativ und wird daher natürlich als „Eglon, dem König von Moab“ formuliert.
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: achtzehn Jahre lang
  rationale: Der hebräische Akkusativ der Zeitdauer wird im Deutschen idiomatisch mit „achtzehn Jahre lang“ ausgedrückt.
