source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: de
  text: Er versammelte die Ammoniter und Amalek[a] um sich, zog los und schlug Israel. Dann nahmen sie die Palmenstadt[b] in Besitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Amalekiter“. Das Hebräische verwendet „Amalek“ als kollektive Bezeichnung für das Volk.'
    reason: lexical_alternative
  - marker: b
    text: Damit ist wahrscheinlich Jericho gemeint; vergleiche 5. Mose 34,3 und 2. Chronik 28,15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: Er versammelte … um sich
  rationale: אָסַף mit אֵלָיו bezeichnet hier das Zusammenziehen von Verbündeten unter Eglons Führung. Die Formulierung gibt den Bezug auf ihn selbst natürlich und nah am Hebräischen wieder.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Das deutsche Ethnonym ist in diesem Zusammenhang natürlicher als die formale Wiedergabe „die Söhne Ammons“.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der hebräische Eigenname bezeichnet hier kollektiv die Volksgruppe. Die quellennähere Form bleibt im Haupttext erhalten; die idiomatische Alternative steht in der Fußnote.
- source_word: וַיֵּלֶךְ
  choice: zog los
  rationale: הלך bedeutet grundsätzlich „gehen“. Im erzählenden militärischen Zusammenhang ist „zog los“ natürlich, ohne ein über den Kontext hinausgehendes Detail wie eine förmliche Heeresaufstellung einzutragen.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: schlug Israel
  rationale: נכה bedeutet häufig „schlagen“. Die Wiedergabe bewahrt die knappe militärische Aussage und legt sich nicht ausdrücklich auf das stärker deutende „besiegte“ fest.
- source_word: וַיִּירְשׁוּ
  choice: sie nahmen … in Besitz
  rationale: Das Verb ירשׁ kann das Inbesitznehmen, Beerben oder Verdrängen bezeichnen. Die Form ist 3. Person Plural und verweist daher auf Eglons verbündete Streitkräfte, nicht allein auf Eglon.
- source_word: עִיר הַתְּמָרִים
  choice: die Palmenstadt
  rationale: Die kompakte deutsche Ortsbezeichnung bewahrt das Bild des hebräischen Ausdrucks und lässt seine wahrscheinliche Identifikation mit Jericho im Haupttext offen.
theological_decisions:
- issue: Identifikation von עִיר הַתְּמָרִים
  choice: Im Haupttext „die Palmenstadt“, ohne sie ausdrücklich mit Jericho gleichzusetzen.
  alternative: „Jericho“
  rationale: Der hebräische Text nennt hier eine beschreibende Ortsbezeichnung und nicht ausdrücklich den Namen Jericho. Die wahrscheinliche Identifikation wird deshalb nur in einer Fußnote genannt, damit die Aussage des Ausgangstextes nicht stillschweigend vereindeutigt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. „Palmenstadt“ bewahrt die bildhafte Ortsbezeichnung; „schlug“ erhält die bewusst knappe Aussage des hebräischen Verbs. Der Wechsel vom Singular „er“ zum Plural „sie“ wird sichtbar beibehalten.
