  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/הַקְרִ֖יב אֶת הַ/מִּנְחָ֑ה וַ/יְשַׁלַּח֙ אֶת הָ/עָ֔ם נֹשְׂאֵ֖י הַ/מִּנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: de
  text: Als er die Übergabe des Tributs[a] beendet hatte, schickte er die Leute fort, die den Tribut getragen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Geschenks“ oder „der Gabe“. Das hebräische Wort bezeichnet hier wahrscheinlich einen Tribut, der einem Herrscher übergeben wurde, und kein Opfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet den nächsten Vorgang zeitlich ein; im modernen Deutschen gibt „Als“ dies natürlich und knapp wieder.
- source_word: כִּלָּה
  choice: beendet hatte
  rationale: Das Verb bezeichnet das Beenden oder Vollenden. Das Plusquamperfekt macht deutlich, dass die Übergabe abgeschlossen war, bevor Ehud die Begleiter fortschickte.
- source_word: לְהַקְרִיב
  choice: die Übergabe
  rationale: Der Hifil von קרב bedeutet hier, etwas herzubringen bzw. zu überreichen. Die nominale Wendung klingt im politischen Kontext natürlich und vermeidet einen unnötig kultischen Beiklang.
- source_word: הַמִּנְחָה
  choice: den Tribut
  rationale: Im Zusammenhang bezeichnet der Ausdruck wahrscheinlich die Abgabe an einen Herrscher, nicht ein kultisches Opfer. Die Wiederholung wird im Vers beibehalten.
- source_word: וַיְשַׁלַּח
  choice: schickte er ... fort
  rationale: Dies gibt die Bedeutung „wegschicken, entlassen“ klar und idiomatisch wieder.
- source_word: הָעָם
  choice: die Leute
  rationale: Das Wort bedeutet allgemein „Volk/Leute“. Hier bezeichnet es Ehuds Begleitgruppe; „die Leute“ ist im Deutschen kontextgerecht, ohne das Geschlecht festzulegen.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: die den Tribut getragen hatten
  rationale: Die partizipiale Bezeichnung wird als Relativsatz natürlich wiedergegeben. Das Plusquamperfekt entspricht dem Umstand, dass das Tragen bis zur Übergabe bereits erfolgt war.
