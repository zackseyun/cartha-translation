  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: de
  text: Dann streckte Ehud seine linke Hand aus, nahm das Schwert[a] von seinem rechten Oberschenkel und stieß es ihm in den Bauch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet allgemein ein Schwert; nach dem Zusammenhang könnte es sich um ein Kurzschwert oder einen Dolch gehandelt haben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Unterleib“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: streckte … aus
  rationale: Das Verb bezeichnet hier das Ausstrecken der Hand, um nach der Waffe zu greifen; die deutsche Formulierung bildet die konkrete Bewegung natürlich ab.
- source_word: יַד שְׂמֹאלוֹ
  choice: seine linke Hand
  rationale: Das hebräische Substantiv nennt ausdrücklich die Hand und betont Ehuds Handeln mit der linken Hand.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Eine schlichte und kontextgerechte Wiedergabe des Verbs in der fortlaufenden Handlung.
- source_word: הַחֶרֶב
  choice: das Schwert
  rationale: חֶרֶב ist die allgemeine Bezeichnung für ein Schwert; der Kontext lässt zwar an eine kurze Stichwaffe denken, verlangt aber nicht die engere Wiedergabe „Dolch“.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: von seiner rechten Hüfte
  rationale: Die Wendung bezeichnet den Ort, an dem Ehud die Waffe trug. „Von seiner rechten Hüfte“ ist im Deutschen konkret und idiomatisch.
- source_word: וַיִּתְקָעֶהָ
  choice: stieß es … in
  rationale: Das Verb beschreibt ein kraftvolles Hineinstoßen; „stieß“ gibt die gewaltsame Bewegung prägnant wieder.
- source_word: בְּבִטְנוֹ
  choice: ihm in den Bauch
  rationale: בֶּטֶן bezeichnet Bauch oder Unterleib. Der possessive Dativ ist im Deutschen natürlich und macht im Kontext deutlich, dass Eglons Körper gemeint ist.
