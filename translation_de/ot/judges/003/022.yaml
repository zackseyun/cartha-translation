base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: de
  text: Sogar der Griff[a] drang nach der Klinge in seinen Bauch ein, und das Fett schloss sich um die Klinge, denn er zog das Schwert nicht aus seinem Bauch. Und der Kot trat aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Heft“; das hebräische Wort bezeichnet hier den Teil des Schwertes hinter der Klinge.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort ist selten und seine Bedeutung unsicher. Traditionell wird es als „Kot“ oder „Darminhalt“ verstanden. Die Form kann jedoch auch als Ortsangabe gedeutet werden: „Und er ging in den Vorraum hinaus.“'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: הַנִּצָּב
  choice: der Griff
  rationale: Im Zusammenhang mit dem Schwert bezeichnet das Wort den hinter der Klinge liegenden Teil der Waffe. „Griff“ ist im heutigen Deutsch natürlich und verständlich; möglich wären auch „Heft“ oder allgemeiner „Handhabe“.
- source_word: הַלַּהַב
  choice: die Klinge
  rationale: Obwohl das Substantiv sonst „Flamme“ bedeuten kann, bezeichnet es hier eindeutig die Klinge des Schwertes.
- source_word: גַם
  choice: auch … noch
  rationale: Die Kombination macht deutlich, dass nicht nur die Klinge, sondern sogar der Griff eindrang, und gibt den Nachdruck der hebräischen Partikel natürlich wieder.
- source_word: וַיִּסְגֹּר … בְּעַד
  choice: schloss sich um
  rationale: Das Verb bezeichnet ein Schließen oder Umschließen. In Verbindung mit dem Fett und der Klinge gibt „schloss sich um“ das körperliche Bild idiomatisch wieder.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: Die konkrete, drastische Körperlichkeit der Erzählung wird ohne klinische Umschreibung bewahrt.
- source_word: שָׁלַף
  choice: zog … aus
  rationale: Das Verb wird häufig vom Ziehen einer Waffe gebraucht; da das Schwert bereits im Körper steckt, ist „aus … ziehen“ im Deutschen die natürliche Formulierung.
- source_word: מִבִּטְנוֹ
  choice: aus seinem Bauch
  rationale: „Bauch“ entspricht dem anschaulichen, nicht klinischen Erzählstil besser als „Unterleib“ oder „Abdomen“.
- source_word: הַפַּרְשְׁדֹנָה
  choice: der Kot trat aus
  rationale: Die traditionelle Deutung versteht das seltene Wort als Kot beziehungsweise Darminhalt. Da Form und Bedeutung umstritten sind und auch eine Ortsangabe möglich ist, wird diese Unsicherheit ausdrücklich in einer Fußnote erhalten.
- source_word: וַיֵּצֵא
  choice: trat aus
  rationale: Bei der traditionellen Deutung mit „Kot“ gibt „trat aus“ den einfachen Vorgang des Herauskommens knapp und würdig wieder.
