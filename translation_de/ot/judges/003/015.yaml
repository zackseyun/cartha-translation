    issue: „ließ ihnen einen Retter auftreten“
    rationale: Die Wendung kann ein Auftreten im Sinn eines öffentlichen oder theatralischen Erscheinens nahelegen. Das hebräische Kausativ von קום bezeichnet hier das Erwecken/Bestellen eines Befreiers. „Erweckte ihnen einen Retter“ ist idiomatischer und präziser.
