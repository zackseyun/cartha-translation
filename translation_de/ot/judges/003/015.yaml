  source_fidelity: 'Der Entwurf gibt die Satzfolge und die wesentlichen Bedeutungen des Hebräischen zuverlässig wieder: den Notschrei, Jahwes Erweckung eines menschlichen Retters, Ehuds benjaminitische Zugehörigkeit, die vorsichtig wiedergegebene ungewöhnliche Beschreibung seiner rechten Hand sowie die politische Abgabe an Eglon. „Durch ihn“ gibt בְּיָדוֹ angemessen als Vermittlung/Überbringung wieder. Die Fußnote wahrt die umstrittene Deutung als Linkshändigkeit, ohne sie dem Haupttext aufzuzwingen.'
  naturalness: „ließ ihnen einen Retter auftreten“ ist zwar verständlich, klingt im modernen Standarddeutsch jedoch unnötig bühnensprachlich und ist für וַיָּקֶם ... מוֹשִׁיעַ weniger idiomatisch. „Erweckte ihnen einen Retter“ ist die natürliche, würdevolle und quellennähere Formulierung. Die übrige Syntax einschließlich der Akkusativ-Appositionen nach „einen Retter“ ist korrekt.
  terminology: „Jahwe“, „Söhne Israels“, „Retter“, „Benjaminiter“ und „Tribut“ sind terminologisch passend. „An seiner rechten Hand eingeschränkt“ bewahrt die semantische Vorsicht der hebräischen Wendung; die Fußnote nennt die verbreitete Alternative sachgerecht.
  issues:
