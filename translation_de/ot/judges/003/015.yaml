source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: de
  text: 'Da schrien die Söhne Israels zu Jahwe, und Jahwe erweckte ihnen einen Retter: Ehud, den Sohn Geras, einen Benjaminiter, einen Mann, der an seiner rechten Hand eingeschränkt war.[a] Die Söhne Israels sandten durch ihn Tribut an Eglon, den König von Moab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach verbreiteter Deutung: „ein Linkshänder“. Wörtlich beschreibt das Hebräische Ehud als einen Mann, der an seiner rechten Hand eingeschränkt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Da schrien ... zu ...
  rationale: Das Verb bezeichnet einen dringlichen Hilferuf. „Schrien“ bewahrt die Intensität, ohne das im Hebräischen nur implizierte „um Hilfe“ ausdrücklich hinzuzufügen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die geläufige deutsche Bibelwendung bildet den hebräischen Ausdruck transparent und würdig ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: ließ ihnen einen Retter auftreten
  rationale: Die Formulierung gibt Gottes Veranlassung beziehungsweise Beauftragung eines menschlichen Befreiers natürlich wieder. „Retter“ wahrt zugleich die im Richterbuch wiederkehrende Terminologie.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: Ehud, den Sohn Geras
  rationale: Die Eigennamen werden nach gängiger deutscher Konvention transkribiert; das Abstammungsverhältnis bleibt ausdrücklich erhalten.
- source_word: בֶּן הַיְמִינִי
  choice: einen Benjaminiter
  rationale: Der Ausdruck bezeichnet hier die Stammeszugehörigkeit und wird im Deutschen idiomatisch als Gentilizium wiedergegeben.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: einen Mann, der an seiner rechten Hand eingeschränkt war
  rationale: Die ungewöhnliche hebräische Wendung beschreibt wörtlich eine Einschränkung der rechten Hand. Die Übersetzung bewahrt diese Besonderheit und legt sich im Haupttext nicht ausschließlich auf Linkshändigkeit fest.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: sandten durch ihn
  rationale: בְּיָדוֹ bezeichnet hier Ehud als Vermittler beziehungsweise Überbringer. „Durch ihn“ gibt diese Funktion in natürlichem Deutsch wieder, ohne die hebräische Körperteilmetapher hölzern nachzubilden.
- source_word: מִנְחָה
  choice: Tribut
  rationale: Im politischen Zusammenhang bezeichnet das Wort eine Abgabe an einen übergeordneten Herrscher; „Tribut“ ist daher präziser als „Geschenk“ oder „Opfergabe“.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: an Eglon, den König von Moab
  rationale: Die Apposition wird in natürlichem Standarddeutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von אִטֵּר יַד יְמִינוֹ
  choice: an seiner rechten Hand eingeschränkt
  alternative: linkshändig
  rationale: Die genaue Nuance der seltenen Wendung ist umstritten. Der Haupttext bewahrt ihre wörtliche Ausrichtung auf eine Einschränkung der rechten Hand; die verbreitete Deutung als Linkshändigkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll formaler biblischer Erzählweise. „Söhne Israels“ bewahrt die hebräische Gruppenbezeichnung; „durch ihn“ vermeidet dagegen eine im Deutschen unnötig hölzerne Wiedergabe von בְיָדוֹ. Die mehrdeutige Beschreibung von Ehuds rechter Hand bleibt im Haupttext erhalten.
