base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: de
  text: Diese Völker waren dazu da, Israel auf die Probe zu stellen[a], um zu erkennen, ob die Israeliten auf die Gebote Jahwes hören würden[b], die er ihren Vätern[c] durch Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um Israel durch sie auf die Probe zu stellen“; „sie“ bezieht sich auf die im Land verbliebenen Völker.'
    reason: Das hebräische בָּם nennt die Völker ausdrücklich als Mittel der Prüfung.
  - marker: b
    text: „Auf die Gebote hören“ bedeutet hier, sie zu beachten und ihnen zu gehorchen.
    reason: שׁמע kann im Zusammenhang mit Geboten sowohl das Hören als auch das daraus folgende Befolgen ausdrücken.
  - marker: c
    text: 'Wörtlich: „ihren Vätern“; gemeint sind die Vorväter Israels.'
    reason: אֲבוֹתָם lautet ausdrücklich „ihren Vätern“ und bezeichnet hier frühere Generationen Israels.
lexical_decisions:
- source_word: וַיִּהְיוּ ... לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: Diese Völker waren dazu da, Israel auf die Probe zu stellen
  rationale: Das Subjekt wird aus dem unmittelbaren Zusammenhang ausdrücklich als „diese Völker“ aufgenommen. Die Formulierung gibt die Zweckbestimmung der zurückgelassenen Völker natürlich wieder; das instrumentale בָּם wird in einer Fußnote ausdrücklich kenntlich gemacht.
- source_word: לָדַעַת
  choice: um zu erkennen
  rationale: Die Zweckangabe bleibt erhalten. „Erkennen“ wahrt die Nähe zum hebräischen ידע, ohne festzulegen, wem zuvor Wissen gefehlt hätte.
- source_word: הֲיִשְׁמְעוּ
  choice: ob ... hören würden
  rationale: שׁמע bezeichnet bei Geboten ein Hören, das Befolgen einschließt. „Hören“ bewahrt das hebräische Sprachbild; die Fußnote erläutert den Gehorsamsaspekt.
- source_word: מִצְוֺת יְהוָה
  choice: die Gebote Jahwes
  rationale: „Gebote“ ist die übliche und klare Wiedergabe von מִצְוֺת. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֲבוֹתָם
  choice: ihren Vorfahren
  rationale: Im Zusammenhang bezeichnet אבות die früheren Generationen Israels. „Vorfahren“ gibt den gemeinten genealogischen Bezug in modernem Deutsch natürlich wieder.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die hebräische Wendung „durch die Hand Moses“ bezeichnet Vermittlung oder Beauftragung; „durch Mose“ gibt diese Funktion idiomatisch wieder.
theological_decisions:
- issue: Sinn der Prüfung Israels
  choice: Die verbliebenen Völker dienen als Mittel, durch das Israels Bereitschaft zum Gehorsam geprüft wird.
  alternative: Die Aussage lediglich als historische Beobachtung ohne Zweckcharakter wiederzugeben.
  rationale: Die Infinitive לְנַסּוֹת und לָדַעַת bezeichnen ausdrücklich einen Zweck. Wer durch die Prüfung zur Erkenntnis gelangt, wird nicht ergänzend festgelegt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt den persönlichen Gottesnamen des hebräischen Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht geglättet; Zweck, Mittel der Prüfung und das hebräische Bild des Hörens bleiben erhalten.
