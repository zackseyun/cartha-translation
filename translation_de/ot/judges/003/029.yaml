  text: וַ/יַּכּ֨וּ אֶת מוֹאָ֜ב בָּ/עֵ֣ת הַ/הִ֗יא כַּ/עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ כָּל שָׁמֵ֖ן וְ/כָל אִ֣ישׁ חָ֑יִל וְ/לֹ֥א נִמְלַ֖ט אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: de
  text: Damals erschlugen sie etwa zehntausend Moabiter[a], alles kräftige[b] und kampftüchtige Männer[c]. Kein Einziger entkam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Moab«; gemeint sind hier die Moabiter, wie die anschließende Zahl erkennen lässt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »jeder Fette«; wahrscheinlich sind wohlgenährte, kräftige Männer gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »tapfere Männer«, »tüchtige Männer« oder »mächtige Männer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: erschlugen sie
  rationale: נכה bezeichnet im militärischen Zusammenhang das tödliche Niederschlagen; »erschlugen« gibt Ergebnis und Gewaltsamkeit knapp wieder.
- source_word: אֶת מוֹאָב
  choice: Moabiter
  rationale: Wörtlich steht »Moab«; die anschließende Zählung von etwa zehntausend Männern zeigt, dass die Moabiter als Personengruppe gemeint sind.
- source_word: בָּעֵת הַהִיא
  choice: Damals
  rationale: Natürliche und prägnante Wiedergabe der üblichen Zeitangabe »zu jener Zeit«.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: etwa zehntausend
  rationale: Die Präposition כ markiert hier eine ungefähre Zahl; das folgende אִישׁ wird im Deutschen bereits durch »Moabiter« und die anschließenden Personenbezeichnungen ausgedrückt.
- source_word: כָּל שָׁמֵן
  choice: durchweg kräftige Männer
  rationale: שָׁמֵן bedeutet wörtlich »fett« und bezeichnet hier wahrscheinlich wohlgenährte, kräftige Männer. »Kräftig« wahrt den kontextuellen Sinn, ohne die konkrete Grundbedeutung in der Fußnote zu verschweigen.
- source_word: וְכָל אִישׁ חָיִל
  choice: und kampftüchtige Männer
  rationale: אִישׁ חַיִל kann einen tüchtigen, starken oder tapferen Mann bezeichnen; im unmittelbaren Kampfkontext ist »kampftüchtig« natürlich und sachgerecht.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: Kein Einziger entkam
  rationale: Die Formulierung gibt die distributive Verneinung und den Nachdruck der vollständigen Niederlage idiomatisch wieder.
