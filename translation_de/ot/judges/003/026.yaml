  register: Moderne, gut verständliche und zugleich erzählerisch würdevolle Standardsprache. Die zweimalige Verwendung von „entkam“ bewahrt die auffällige Wiederholung des Ausgangstextes; die Satzfolge bleibt knapp und spannungsvoll.
