base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: de
  text: Ehud aber entkam, während sie zögerten; er ging an den Götzenbildern[a] vorbei und entkam nach Seïra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den geschnitzten Bildern« oder »den Götzen«.'
    reason: lexical_alternative
  - marker: b
    text: Auch als »Seïrat« oder »Seïrath« transkribiert.
    reason: alternative_reading
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: entkam
  rationale: Das Nifal von מלט bezeichnet hier die gelungene Flucht aus einer Gefahr. Die Wiederholung von „entkam“ bildet die Wiederholung des hebräischen Verbs ab.
- source_word: עַד הִתְמַהְמְהָם
  choice: während sie noch zögerten
  rationale: Die Wendung bezeichnet den Zeitraum, in dem Ehud entkam. „Noch“ unterstreicht natürlich den fortdauernden Aufschub, ohne eine zusätzliche Aussage einzuführen.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: war an den Götzenbildern vorbeigekommen
  rationale: עבר mit direktem Objekt beschreibt hier das Passieren eines bekannten Wegpunkts. Das Plusquamperfekt macht im Deutschen deutlich, dass dieses Passieren der abschließenden Flucht nach Seïra vorausging.
- source_word: הַפְּסִילִים
  choice: die Götzenbilder
  rationale: פסילים bezeichnet geschnitzte beziehungsweise behauene Bilder und im Kontext wahrscheinlich kultische Bildwerke. „Götzenbilder“ ist im Deutschen verständlich und bewahrt beide Aspekte; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: הַשְּׂעִירָתָה
  choice: nach Seïra
  rationale: Die Ortsbezeichnung wird transliteriert; das lokale He markiert die Richtung und wird mit „nach“ wiedergegeben. Das Trema verhindert, dass „ei“ als deutscher Diphthong gelesen wird.
- source_word: וְ
  choice: aber
  rationale: Die Konjunktion setzt Ehuds erfolgreiche Flucht in Kontrast zum Zögern der Diener im vorausgehenden Zusammenhang.
