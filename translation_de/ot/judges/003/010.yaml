base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: de
  text: Da kam der Geist Jahwes über ihn[a], und er richtete Israel. Er zog in den Kampf, und Jahwe gab Kuschan-Rischatajim, den König von Aram[b], in seine Hand. Und seine Hand war Kuschan-Rischatajim überlegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Geist Jahwes war auf ihm.“ Die hebräische Wendung lässt auch eine statischere Wiedergabe zu; der Erzählzusammenhang legt jedoch „kam über ihn“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: Aram ist der hebräische Landesname, der in älteren Übersetzungen häufig mit „Syrien“ wiedergegeben wird.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: Da kam der Geist Jahwes über ihn
  rationale: Die Konstruktion היה על mit רוּחַ bezeichnet hier im Erzählzusammenhang das Eintreten göttlicher Befähigung. „Kam ... über ihn“ ist im Deutschen natürlich und bewahrt zugleich gegenüber dem statischeren „war auf ihm“ die mögliche dynamische Nuance.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der Eigenname des hebräischen Textes erkennbar bleibt und nicht durch einen Titel ersetzt wird.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: und er richtete Israel
  rationale: שׁפט bezeichnet im Richterbuch die Tätigkeit eines Richters, die Rechtsprechung, Führung und Rettung umfassen kann. „Richtete“ erhält die Leitwortverbindung zur Bezeichnung „Richter“, ohne den Sinn vorschnell auf „regierte“ oder „befreite“ festzulegen.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: Er zog in den Kampf
  rationale: Die militärische Wendung wird idiomatisch und würdig wiedergegeben. „Zog“ entspricht dem Ausrücken zum Kampf besser als das im Deutschen schwerfälligere „ging hinaus“.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: Jahwe gab ... in seine Hand
  rationale: Die geläufige hebräische Metapher für die Auslieferung eines Gegners in die Gewalt eines anderen bleibt erhalten und ist im Kontext verständlich.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Kuschan-Rischatajim
  rationale: Der Personenname wird in einer an deutschen Transkriptionsgewohnheiten orientierten Form wiedergegeben und als zusammengesetzter Name mit Bindestrich geschrieben.
- source_word: מֶלֶךְ אֲרָם
  choice: König von Aram
  rationale: אֲרָם wird direkt als „Aram“ wiedergegeben; „Syrien“ wäre eine traditionelle, aber weniger quellennähere geografische Gleichsetzung.
- source_word: וַתָּעָז יָדוֹ עַל
  choice: So gewann seine Hand die Oberhand über
  rationale: Die Wiedergabe bewahrt das Bild der „Hand“ und vermittelt zugleich die Aussage von Stärke und Vorherrschaft. Das einleitende „So“ macht den resultativen Fortgang im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe der Aussage über den Geist Jahwes
  choice: Da kam der Geist Jahwes über ihn
  alternative: Der Geist Jahwes war auf ihm
  rationale: Die gewählte Fassung entspricht dem narrativen Einsetzen göttlicher Befähigung, während die Fußnote die grammatisch mögliche statischere Lesart offenhält. Eine weitergehende pneumatologische Deutung wird nicht in den Vers hineingetragen.
- issue: Funktion Otniels als Richter
  choice: er richtete Israel
  alternative: er führte Israel als Richter
  rationale: Die knappe Wiedergabe wahrt das Leitwort שׁפט und lässt dessen im Richterbuch breites Bedeutungsfeld bestehen, statt die Funktion auf politische Führung oder Rechtsprechung zu verengen.
- issue: Geografische Bezeichnung אֲרָם
  choice: Aram
  alternative: Syrien
  rationale: „Aram“ folgt unmittelbar dem hebräischen Ortsnamen und vermeidet eine traditionsbedingte oder potenziell anachronistische Gleichsetzung mit Syrien.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Hebräische Leitbegriffe und Bilder („richtete“, „in seine Hand“, „seine Hand“) werden soweit möglich bewahrt, ohne unnatürliche deutsche Syntax zu erzeugen.
