source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: de
  text: Da entbrannte Jahwes Zorn gegen Israel, und er verkaufte sie in die Hand Kuschan-Rischatajims, des Königs von Aram-Naharajim.[a] Und die Israeliten[b] dienten Kuschan-Rischatajim acht Jahre lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mesopotamien“; hebräisch „Aram-Naharajim“, traditionell als „Aram der zwei Ströme“ verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte ... Zorn
  rationale: Bewahrt das hebräische Bild des brennenden Zorns und klingt zugleich natürlich und würdig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die geläufige deutsche Form.
- source_word: וַיִּמְכְּרֵם
  choice: er verkaufte sie
  rationale: Bewahrt die konkrete Metapher des Verbs מכר und die scharfe Gerichtssprache des Richterbuchs.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Erhält das hebräische Bild für Macht und Verfügungsgewalt, das auch im Deutschen verständlich ist.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Kuschan-Rischataïm
  rationale: Transliteriert die Personenbezeichnung in einer für deutsche Leser aussprechbaren Form.
- source_word: אֲרַם נַהֲרָיִם
  choice: Aram-Naharajim
  rationale: Bewahrt den hebräischen Ortsnamen; die traditionelle Deutung wird in der Fußnote genannt.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: Gibt die Grundbedeutung von עבד direkt wieder und lässt die im Zusammenhang erkennbare politische Unterwerfung bestehen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung wird im modernen Deutschen natürlich als „die Israeliten“ wiedergegeben; die wörtliche Form steht in der Fußnote.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: acht Jahre lang
  rationale: Natürliche deutsche Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Eigennamen; die deutsche Form „Jahwe“ macht dies sichtbar, ohne einen bloßen Titel einzusetzen.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung bezeichnet hier das gesamte Bundesvolk. „Die Israeliten“ ist im heutigen Deutsch eindeutig und natürlich, während eine Fußnote die wörtliche Gestalt transparent macht.
- issue: Gerichtsmetapher וַיִּמְכְּרֵם
  choice: er verkaufte sie
  alternative: er lieferte sie aus
  rationale: Die wörtliche Metapher wahrt die theologische und rhetorische Härte des Textes, ohne die Art der Unterwerfung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder „Zorn entbrannte“, „verkaufte“ und „in die Hand“ bleiben erhalten; feste Volksbezeichnungen werden idiomatisch wiedergegeben. Sämtliche Fußnotenmarker stehen unmittelbar im Haupttext.
