  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: de
  text: Die Israeliten[a] taten, was in den Augen Jahwes böse war.[b] Sie vergaßen Jahwe, ihren Gott, und dienten den Baalen und den Ascheren.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«; gemeint sind die Israeliten als Volk.'
    reason: lexical_alternative
  - marker: b
    text: »Böse in den Augen Jahwes« ist eine feste hebräische Wendung für das, was Jahwe als böse beurteilt.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »den Aschera-Pfählen«. Das hebräische Wort kann mit Aschera verbundene Kultgegenstände bezeichnen oder möglicherweise auf Aschera beziehungsweise ihren Kult verweisen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »die Söhne Israels«, bezeichnet hier aber das Volk Israel insgesamt. »Die Israeliten« ist im modernen Deutsch natürlich und schließt die gesamte Gemeinschaft ein.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: was in den Augen Jahwes böse war
  rationale: Die Formulierung bewahrt die hebräische Bewertungsformel und macht deutlich, dass Jahwes Urteil über das Handeln Israels gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des göttlichen Eigennamens erhält den Namenscharakter des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּשְׁכְּחוּ
  choice: sie vergaßen
  rationale: Die Grundbedeutung von שׁכח wird direkt wiedergegeben. Der Zusammenhang lässt zugleich die praktische Abkehr von Jahwe erkennen, ohne sie ausdrücklich in die Übersetzung einzutragen.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: Das Bezugswort Jahwe verlangt hier die singularische Bedeutung »ihren Gott«.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: »Dienten« erhält sowohl den kultischen Sinn des Verehrens als auch den allgemeineren Gedanken der Unterordnung.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Der deutsche Plural bewahrt die hebräische Mehrzahl, die auf verschiedene lokale Erscheinungsformen oder Kultbilder des Baal hinweisen kann.
- source_word: הָאֲשֵׁרוֹת
  choice: den Ascheren
  rationale: Die eingedeutschte Pluralform wahrt möglichst die Unbestimmtheit, ob konkrete Kultgegenstände oder örtliche Erscheinungsformen beziehungsweise die Verehrung Ascheras gemeint sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. »Jahwe« bewahrt diesen als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Deutung von הָאֲשֵׁרוֹת
  choice: die Ascheren
  alternative: die Aschera-Pfähle
  rationale: Das hebräische Wort kann Kultgegenstände bezeichnen, die mit Aschera verbunden waren, möglicherweise aber auch örtliche Erscheinungsformen oder allgemeiner den Aschera-Kult. Die Hauptübersetzung legt sich nicht unnötig auf eine einzelne Deutung fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze bilden die Abfolge des hebräischen Textes ab; ungebräuchliche kultische Begriffe werden durch Fußnoten erläutert.
