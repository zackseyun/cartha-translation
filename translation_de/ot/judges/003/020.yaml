base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: de
  text: 'Ehud kam zu ihm, während dieser in seinem kühlen Raum auf dem Dach[a] saß, den er für sich allein hatte. Ehud sagte: »Ich habe ein Wort von Gott[b] für dich.« Da stand er von seinem Sitz[c] auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kühlen Obergemach«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Botschaft von Gott«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »von dem Sitz«; je nach Zusammenhang auch »vom Stuhl« oder »vom Thron«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: kam
  rationale: Das Verb bezeichnet Ehuds Kommen zu Eglon, ohne die Art der Annäherung näher festzulegen.
- source_word: יֹשֵׁב
  choice: saß
  rationale: Das Partizip beschreibt die andauernde Hintergrundsituation, in der Ehud eintritt.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: kühles Dachgemach
  rationale: עֲלִיָּה bezeichnet ein Ober- oder Dachgemach; הַמְּקֵרָה weist wahrscheinlich auf einen kühlen beziehungsweise belüfteten Raum hin. Die Wiedergabe bewahrt sowohl den baulichen als auch den klimatischen Aspekt.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: allein
  rationale: Die Wendung hebt hervor, dass Eglon den Raum für sich allein hatte. Im Deutschen bringt »allein« die erzählerisch entscheidende Abgeschiedenheit knapp zum Ausdruck.
- source_word: דְּבַר אֱלֹהִים
  choice: ein Wort von Gott
  rationale: Die Konstruktion bezeichnet eine von Gott kommende Mitteilung. »Wort« bleibt nahe am Hebräischen, während »von Gott« im Deutschen die Herkunft natürlich ausdrückt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die Form morphologisch pluralisch ist, wird אֱלֹהִים häufig singularisch für Gott gebraucht; in dieser Wendung und diesem Zusammenhang ist die Einzahl am naheliegendsten.
- source_word: וַיָּקָם
  choice: stand ... auf
  rationale: Diese natürliche deutsche Wendung gibt das Aufstehen aus sitzender Haltung präzise wieder.
- source_word: מֵעַל הַכִּסֵּא
  choice: von seinem Sitz
  rationale: כִּסֵּא kann Sitz, Stuhl oder Thron bedeuten. »Sitz« wahrt die Bedeutungsbreite, ohne in der privaten Raumszene unnötig eine förmliche Thronsituation vorauszusetzen.
theological_decisions:
- issue: Deutung von אֱלֹהִים in Ehuds Aussage
  choice: Gott
  alternative: Göttern / einer Gottheit
  rationale: Der grammatisch mögliche Formaspekt wird vom üblichen singularischen Gebrauch und vom Kontext zugunsten von »Gott« bestimmt. Die Übersetzung berichtet Ehuds Aussage, ohne ihre Absicht oder ihren theologischen Wahrheitsanspruch zusätzlich auszulegen.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die Satzfügung erhält den Hintergrundcharakter von Eglons Sitzen und lässt die räumliche sowie lexikalische Mehrdeutigkeit durch knappe Fußnoten sichtbar.
