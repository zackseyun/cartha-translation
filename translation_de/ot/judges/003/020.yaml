  to: 'Ehud kam zu ihm, während dieser in seinem kühlen Raum auf dem Dach[a] saß, den er für sich allein hatte. Ehud sagte: »Ich habe ein Wort von Gott[b] für dich.« Da stand er von seinem Sitz[c] auf.'
  rationale: Die Revision verankert die Wendung »für sich allein« beim Raum und bewahrt damit die possessiv-private Nuance des hebräischen Relativsatzes. Zugleich ersetzt sie das potenziell missverständliche »Dachgemach« durch eine moderne, architektonisch transparente Formulierung und entfernt das nicht notwendige adversative »aber«.
