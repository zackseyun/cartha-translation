  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: de
  text: Sie nahmen sich deren Töchter zu Frauen und gaben ihre Töchter deren Söhnen; sie dienten deren Göttern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie verehrten deren Götter“.'
    reason: Lexikalische Alternative für עבד im religiösen Zusammenhang.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: sie nahmen sich
  rationale: לקח bedeutet wörtlich „nehmen“ und bezeichnet in diesem Zusammenhang die Eheschließung. Das reflexive „sich“ gibt לָהֶם natürlich wieder; „zu Frauen“ macht den ehelichen Sinn ausdrücklich.
- source_word: בְּנוֹתֵיהֶם
  choice: deren Töchter
  rationale: Das Suffix verweist im Zusammenhang auf die zuvor genannten Völker. „Deren“ verdeutlicht im Deutschen den Rückbezug, ohne die Völker im Vers erneut ausdrücklich zu nennen.
- source_word: לָהֶם לְנָשִׁים
  choice: sich … zu Frauen
  rationale: Die Formulierung bewahrt sowohl den Bezug auf die Handelnden („sich“) als auch die Bestimmung zur Ehe („zu Frauen“) und klingt zugleich würdig und verständlich.
- source_word: וְאֶת בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: und gaben ihre eigenen Töchter deren Söhnen
  rationale: נתן wird mit „geben“ wiedergegeben; der Heiratszusammenhang ist aus dem parallelen ersten Satzteil ersichtlich. „Ihre eigenen“ und „deren“ machen den im Kontext vorausgesetzten Wechsel der Bezugsgruppe verständlich.
- source_word: וַיַּעַבְדוּ
  choice: und sie dienten
  rationale: עבד kann bei Gottheiten sowohl „dienen“ als auch „verehren“ bedeuten. „Dienten“ bleibt näher am Grundverb und bewahrt den Gedanken religiöser Gefolgschaft.
- source_word: אֱלֹהֵיהֶם
  choice: deren Göttern
  rationale: Der Ausdruck bezeichnet die Götter der umliegenden Völker. „Deren Göttern“ hält diesen Rückbezug im Deutschen eindeutig fest.
theological_decisions:
- issue: Religiöse Gefolgschaft, ausgedrückt durch עבד in Verbindung mit fremden Göttern
  choice: sie dienten deren Göttern
  alternative: sie verehrten deren Götter
  rationale: „Dienen“ umfasst kultische Verehrung, betont aber zugleich die weiter reichende Bindung und Gefolgschaft. „Verehren“ ist ebenfalls lexikalisch möglich und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Parallelismus des Hebräischen bleibt erhalten; ein neuer Satz vor dem abschließenden Abfall hebt die Folge der Mischehen klar hervor. Die unterscheidenden Pronomen helfen, den kontextuell vorausgesetzten Wechsel zwischen Israel und den umliegenden Völkern nachzuvollziehen.
