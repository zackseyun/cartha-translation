source:
  edition: WLC
  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: de
  text: Nach ihm kam Schamgar, der Sohn Anats. Er erschlug sechshundert Philister mit einem Rinderstachel[a]. Auch er rettete Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Rinderstachel war ein zugespitzter Stock, mit dem man Rinder antrieb.
    reason: cultural_note
  - marker: b
    text: 'Oder: befreite Israel. Das hebräische Verb kann besonders im militärischen Zusammenhang Rettung oder Befreiung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Nach ihm
  rationale: Bewahrt den rückbezüglichen Anschluss an den zuvor genannten Richter, ohne den Namen Ehud ergänzend in den Text einzutragen.
- source_word: הָיָה
  choice: kam
  rationale: Das schlichte הָיָה führt hier die nächste Gestalt der Erzählfolge ein. „Kam“ ist im Deutschen natürlicher als das wörtliche, aber schwerfällige „war“, ohne ein ausdrückliches „trat auf“ oder „erhob sich“ einzutragen.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Schamgar, der Sohn Anats
  rationale: Der Name wird nach gängiger deutscher Bibeltradition wiedergegeben. „Sohn Anats“ bildet die hebräische Form transparent ab, ohne zu entscheiden, ob sie Abstammung oder einen Beinamen bezeichnet.
- source_word: וַיַּךְ
  choice: erschlug
  rationale: נכה bezeichnet hier im kriegerischen Zusammenhang ein tödliches Niederschlagen; „erschlug“ gibt dies knapp und würdig wieder.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ ... פְּלִשְׁתִּים
  choice: sechshundert Philister
  rationale: Die natürliche deutsche Form gibt die gezählten Angehörigen des Volkes wieder; das im Hebräischen nach der Zahl stehende אִישׁ muss nicht eigens mit „Männer“ ausgedrückt werden.
- source_word: בְּמַלְמַד הַבָּקָר
  choice: mit einem Rinderstachel
  rationale: Bezeichnet einen zugespitzten Stock zum Antreiben von Rindern. „Rinderstachel“ ist ein präziser deutscher Sachbegriff und vermeidet den modernen Eindruck eines elektrischen Viehtreibers.
- source_word: וַיֹּשַׁע
  choice: rettete
  rationale: ישע bezeichnet im Richterbuch die Befreiung Israels aus feindlicher Bedrängnis. „Rettete“ ist verständlich und lässt den militärischen Umfang der Rettung offen.
- source_word: גַּם הוּא
  choice: Auch er
  rationale: Bewahrt den additiven Nachdruck und ordnet Schamgar als weiteren Retter Israels ein.
theological_decisions:
- issue: Art und Umfang von Schamgars Rettung
  choice: Auch er rettete Israel
  alternative: Auch er befreite Israel
  rationale: Der Vers schreibt Schamgar wirkliche Rettung zu, bestimmt aber weder deren Umfang noch Dauer. „Rettete“ bewahrt die Mehrdeutigkeit des Verbs und trägt keine weitergehende heilsgeschichtliche Aussage ein.
- issue: Bedeutung von „Sohn Anats“
  choice: wörtliche Wiedergabe ohne Deutung
  alternative: Deutung als Beiname oder militärischer Titel
  rationale: Die hebräische Form kann eine Abstammungsangabe sein, doch andere Deutungen sind diskutiert. Der Haupttext entscheidet diese Frage nicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdiger Erzählweise. Die Satzteilung vermeidet einen schwerfälligen deutschen Periodenbau. Sachliche und lexikalische Erläuterungen stehen in Fußnoten; Unsicherheiten werden nicht konfessionell aufgelöst.
