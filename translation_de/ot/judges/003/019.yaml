  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: de
  text: 'Er selbst aber kehrte von den Schnitzbildern[a] nahe Gilgal[b] zurück und sagte: »Ich habe eine geheime Botschaft[c] für dich, König.« Da sagte er: »Still!« Darauf gingen alle, die bei ihm standen, aus seiner Gegenwart hinaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Götzenbilder«. Das hebräische Wort bezeichnet geschnitzte Bilder und wird häufig für Kultbilder gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bei Gilgal«. Die hebräische Ortsangabe ist knapp formuliert und kann Nähe oder Lage bei Gilgal bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »ein geheimes Wort« oder »eine vertrauliche Angelegenheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב מִן
  choice: kehrte bei … um
  rationale: Das Verb bezeichnet eine Rückkehr beziehungsweise Umkehr; מִן markiert den Ort, von dem aus Ehud zurückgeht. Die deutsche Formulierung gibt die erzählte Richtungsänderung natürlich wieder.
- source_word: הַפְּסִילִים
  choice: die Schnitzbilder
  rationale: Das Wort bezeichnet geschnitzte beziehungsweise behauene Bilder und wird häufig für Kultbilder gebraucht. »Schnitzbilder« bewahrt zunächst den konkreten Wortsinn; die kultische Deutung steht als Alternative in der Fußnote.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: nahe Gilgal
  rationale: Die knappe, elliptische Ortsangabe bezeichnet die Lage der Bilder in Beziehung zu Gilgal. »Nahe Gilgal« ist verständlich, ohne die syntaktische Verdichtung zu überladen.
- source_word: דְּבַר סֵתֶר
  choice: eine geheime Botschaft
  rationale: דָּבָר kann »Wort«, »Angelegenheit« oder »Botschaft« bedeuten; סֵתֶר bezeichnet etwas Verborgenes oder Geheimes. Im Rahmen einer königlichen Audienz klingt »geheime Botschaft« natürlich und lässt Ehuds tatsächliche Absicht unausgesprochen.
- source_word: לִי אֵלֶיךָ
  choice: Ich habe … für dich
  rationale: Die wörtlich stark verdichtete Verbindung von Besitz und Richtung wird idiomatisch wiedergegeben, ohne den Aussagegehalt zu verändern.
- source_word: הַמֶּלֶךְ
  choice: König
  rationale: Der bestimmte Titel fungiert hier als direkte Anrede. Das schlichte »König« wirkt im modernen Deutschen würdig und natürlicher als »o König«.
- source_word: הָס
  choice: Still!
  rationale: Der kurze Zuruf verlangt Schweigen beziehungsweise Ruhe. »Still!« bewahrt seine abrupte Kürze, ohne ausdrücklich festzulegen, an wen der Befehl gerichtet ist.
- source_word: כָּל־הָעֹמְדִים עָלָיו
  choice: alle, die bei ihm standen
  rationale: Die Wendung bezeichnet die beim König stehenden Anwesenden oder Bediensteten. Die gewählte Fassung bleibt eng am Bild des hebräischen Textes.
- source_word: מֵעָלָיו
  choice: aus seiner Gegenwart
  rationale: Wörtlich bezeichnet die Wendung eine Bewegung von seiner Seite weg; im höfischen Zusammenhang ist damit das Verlassen der königlichen Gegenwart gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählweise. Die direkte Rede bleibt abrupt; weder der Adressat von »Still!« noch der genaue kultische Charakter der Bilder wird im Haupttext stärker festgelegt, als es der hebräische Wortlaut erlaubt.
