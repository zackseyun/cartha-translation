  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: de
  text: 'Da schrien die Israeliten zu Jahwe, und Jahwe erweckte den Israeliten einen Retter[a], der sie rettete: Otniël, den Sohn Kenas, den jüngeren Bruder Kalebs.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen Befreier.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Fügung wird gewöhnlich auf Otniël bezogen: Er war Kalebs Bruder und jünger als Kaleb. Die Zuordnung der Verwandtschaftsangabe wird jedoch diskutiert; sie kann auch auf Kenas bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: da schrien ... zu
  rationale: Das Verb bezeichnet hier einen dringenden Hilferuf an Gott; „schrien zu“ gibt sowohl die Not als auch die Zielrichtung natürlich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form „Söhne Israels“ bezeichnet idiomatisch das Volk Israel. „Die Israeliten“ ist im modernen Deutschen natürlich und schließt hier das ganze Volk ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּקֶם
  choice: ließ ... auftreten
  rationale: Der Hifil von קום besagt, dass Jahwe einen Menschen für eine Aufgabe hervortreten ließ. Die Formulierung ist im Deutschen natürlicher als „richtete ... auf“ und weniger amtlich als „setzte ein“.
- source_word: מוֹשִׁיעַ
  choice: Retter
  rationale: Das Wort bezeichnet einen Menschen, durch den Gott Israel aus Bedrängnis befreit. „Retter“ wahrt den Zusammenhang mit dem folgenden Verb und ist im Deutschen kontextgemäß.
- source_word: וַיּוֹשִׁיעֵם
  choice: der sie rettete
  rationale: Das Verb bezeichnet die konkrete Rettung aus Unterdrückung. Der Relativsatz macht die appositionelle Identifizierung Otniëls im Deutschen klar, ohne die Handlung umzudeuten.
- source_word: עָתְנִיאֵל בֶּן קְנַז
  choice: Otniël, den Sohn des Kenas
  rationale: Die Namen werden in gebräuchlicher deutscher Bibelschreibung transliteriert; die Apposition identifiziert den Retter.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: den jüngeren Bruder Kalebs
  rationale: Die wahrscheinlichste syntaktische Deutung ist, dass Otniël Kalebs Bruder und jünger als Kaleb war. „Jüngster Bruder“ würde den Komparativ überdehnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מוֹשִׁיעַ
  choice: Retter
  alternative: Befreier
  rationale: Im Richterbuch ist ein menschlicher, von Gott berufener Retter gemeint. „Retter“ erhält die hebräische Wortverbindung mit „rettete“, ohne Otniël mit Gott gleichzusetzen.
- issue: Bezug von אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: Otniël ist der jüngere Bruder Kalebs
  alternative: Kenas ist der jüngere Bruder Kalebs
  rationale: Die übliche und syntaktisch naheliegende Lesart bezieht „Bruder Kalebs, jünger als er“ auf Otniël. Da die kompakte hebräische Fügung einen möglichen Beziehungszweifel zulässt, wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ setzt die Erzählfolge knapp fort. „Die Israeliten“ ist gegenüber dem wörtlichen „die Söhne Israels“ im heutigen Deutschen verständlicher. Die Wiederholung von „Jahwe“ sowie die Wortverbindung „Retter/rettete“ bewahren die Struktur und den theologischen Akzent des Hebräischen.
