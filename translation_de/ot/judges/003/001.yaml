source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: de
  text: 'Und dies sind die Völker, die Jahwe übrig ließ, um durch sie Israel auf die Probe zu stellen, nämlich alle, die keinen der Kriege Kanaans miterlebt hatten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen wahrt den erzählerischen Anschluss und leitet zugleich den neuen Abschnitt ein.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die ethnisch-politischen Gruppen, die im Land verblieben waren; „Völker“ ist im Deutschen sachgerecht und natürlich.
- source_word: הִנִּיחַ
  choice: übrig ließ
  rationale: Die Hifil-Form bezeichnet hier das Zurück- beziehungsweise Verbleibenlassen; „übrig ließ“ verdeutlicht knapp, dass diese Völker nach den bisherigen Kämpfen noch da waren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: um durch sie Israel auf die Probe zu stellen
  rationale: Die Zweckangabe und das Mittel des Prüfens werden klar wiedergegeben. „Auf die Probe stellen“ ist gegenwärtiges, würdiges Deutsch und vermeidet die irreführende Bedeutung „versuchen“.
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: nämlich alle, die … nicht miterlebt hatten
  rationale: Die Wendung erläutert, welche Israeliten gemeint sind. Das Plusquamperfekt entspricht dem zeitlichen Verhältnis im Kontext.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: keinen der Kriege um Kanaan
  rationale: Unter der Verneinung gibt „keinen der Kriege“ den hebräischen Gesamtausdruck idiomatisch wieder. „Um Kanaan“ bezeichnet natürlich die mit der Eroberung des Landes verbundenen Kriege, ohne den Genitiv übermäßig festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diese Textgestalt.
- issue: Göttliches Prüfen Israels
  choice: um durch sie Israel auf die Probe zu stellen
  alternative: um Israel durch sie zu erproben
  rationale: Die Zweckbestimmung des Textes bleibt ohne Abschwächung oder zusätzliche theologische Erklärung erhalten.
- issue: Bedeutung von ידע in Verbindung mit Kriegen
  choice: miterlebt hatten
  alternative: gekannt hatten
  rationale: ידע bezeichnet hier sehr wahrscheinlich Erfahrungswissen. „Miterlebt“ gibt diesen Sinn im Deutschen eindeutig und natürlich wieder, ohne mehr zu behaupten als der Kontext.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt bleibt erhalten, weil Vers 1 syntaktisch auf die folgende Erläuterung hinführt.
