base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: de
  text: Als er ankam, blies er im Bergland Ephraims das Horn. Die Israeliten zogen mit ihm vom Bergland hinab, und er ging ihnen voran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: und er war vor ihnen.'
    reason: Die Fußnote bewahrt die knappe räumliche Formulierung des Hebräischen neben der im Bewegungskontext natürlichen Wiedergabe.
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: Als er dort ankam
  rationale: Die Konstruktion leitet idiomatisch einen neuen zeitlichen Abschnitt ein. „Dort“ verdeutlicht im Deutschen die aus dem Zusammenhang erkennbare Ankunft, ohne einen neuen Ort festzulegen.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: blies er … das Horn
  rationale: שׁוֹפָר bezeichnet ein als Signalinstrument verwendetes Horn. „Das Horn blasen“ ist im Deutschen natürlich und wahrt die Instrumentenart, ohne das Material unnötig auf ein Widderhorn festzulegen.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraims
  rationale: הַר bezeichnet in dieser geografischen Verbindung das Berg- oder Hügelland Ephraims, nicht einen einzelnen Berg.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: Die Israeliten zogen mit ihm … hinab
  rationale: בְנֵי יִשְׂרָאֵל ist formal „Söhne Israels“, fungiert hier aber als Volks- beziehungsweise Gruppenbezeichnung. „Die Israeliten“ ist im modernen Deutschen klar und gibt den kollektiven Sinn wieder.
- source_word: מִן הָהָר
  choice: vom Bergland
  rationale: Der Ausdruck nimmt das zuvor genannte Bergland Ephraims wieder auf; der Singular hat kollektive geografische Bedeutung.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: und er ging ihnen voran
  rationale: Die hebräische Wendung besagt, dass Ehud sich vor ihnen befand. Im Bewegungskontext gibt „ging ihnen voran“ diese räumliche Aussage natürlich wieder, ohne die mögliche Führungsfunktion ausdrücklich als „führen“ zu deuten.
theological_decisions:
- issue: Kollektive, grammatisch maskuline Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist hier eine übliche kollektive Volksbezeichnung und bezieht sich im Erzählzusammenhang auf die mit Ehud ziehende israelitische Streitmacht. Die idiomatische Wiedergabe vermeidet im Deutschen das mögliche Missverständnis leiblicher Abstammung einzelner „Söhne“, ohne eine Aussage über die genaue Zusammensetzung der Gruppe hinzuzufügen.
- issue: Ehuds Stellung vor der Gruppe
  choice: er ging ihnen voran
  alternative: er war vor ihnen
  rationale: Der Text beschreibt unmittelbar Ehuds Position; dass diese zugleich Leitung ausdrückt, bleibt eine naheliegende, aber nicht ausdrücklich ausformulierte Folgerung. Daher wird nicht stärker deutend mit „er führte sie an“ übersetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Satzfolge bleibt nah an der raschen hebräischen Handlungsabfolge; ein übermäßig altertümlicher Bibelton wird vermieden.
