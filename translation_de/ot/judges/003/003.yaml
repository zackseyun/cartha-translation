base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: de
  text: die fünf Fürsten der Philister und alle Kanaaniter und Sidonier sowie die Hiwiter, die im Bergland des Libanon wohnten, vom Berg Baal-Hermon bis nach Lebo-Hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis dorthin, wo man nach Hamat gelangt«. Der hebräische Ausdruck kann entweder als Ortsname Lebo-Hamat oder beschreibend verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: die fünf Fürsten der Philister
  rationale: Die Konstruktverbindung bezeichnet die fünf politischen Oberhäupter der Philister. »Fürsten« ist im Deutschen die etablierte und verständliche Wiedergabe des besonderen philistäischen Herrschertitels, ohne ihn mit dem persischen »Satrapen« gleichzusetzen.
- source_word: כָל הַכְּנַעֲנִי
  choice: alle Kanaaniter
  rationale: Der ethnische Singular wird kollektiv gebraucht; der deutsche Plural gibt die gemeinte Volksgruppe natürlich wieder.
- source_word: הַצִּידֹנִי
  choice: Sidonier
  rationale: Der kollektive ethnische Singular wird idiomatisch als pluralische Volksbezeichnung wiedergegeben.
- source_word: הַחִוִּי
  choice: die Hiwiter
  rationale: Der kollektive ethnische Singular bezeichnet die Volksgruppe und wird daher im Deutschen pluralisch wiedergegeben.
- source_word: יֹשֵׁב
  choice: die … wohnten
  rationale: Das Partizip beschreibt hier die Hiwiter. Im erzählenden Zusammenhang ist ein Relativsatz im Präteritum natürlich.
- source_word: הַר הַלְּבָנוֹן
  choice: im Bergland des Libanon
  rationale: Wörtlich steht »Berg des Libanon«; gemeint ist die Gebirgsregion und nicht notwendig ein einzelner Gipfel. »Bergland« vermittelt diesen geografischen Sinn klar.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: vom Berg Baal-Hermon
  rationale: Der Ortsname wird als Bezeichnung eines Berges transliteriert; der Bindestrich macht seine Zusammensetzung im Deutschen transparent.
- source_word: עַד לְבוֹא חֲמָת
  choice: bis nach Lebo-Hamat
  rationale: Die Wendung kann als bekannter Ortsname verstanden werden. »Nach« ist bei einem Zielort idiomatisches Deutsch; die alternative beschreibende Deutung bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die listenartige Struktur des Hebräischen bleibt erkennbar; »sowie« entlastet die wiederholte Reihung leicht. Die geografische und sprachliche Mehrdeutigkeit am Versende wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote offengehalten.
