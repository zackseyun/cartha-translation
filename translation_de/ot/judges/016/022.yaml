  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: de
  text: Doch das Haar auf seinem Kopf begann wieder zu wachsen, nachdem es abgeschoren worden war.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „begann zu wachsen“. Das hebräische Verb enthält nicht ausdrücklich die Bedeutung „wieder“; sie ergibt sich aus dem Zusammenhang der vorausgegangenen Schur.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als es abgeschoren worden war“ oder „nachdem er geschoren worden war“. Der hebräische Ausdruck lässt unterschiedliche Wiedergaben des zeitlichen Verhältnisses und des mitgemeinten Bezugs zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: begann
  rationale: Das Verb bezeichnet hier im Zusammenhang mit dem folgenden Infinitiv den Beginn eines Vorgangs.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: das Haar auf seinem Kopf
  rationale: Die Formulierung gibt die hebräische Genitivverbindung natürlich wieder und bewahrt die erzählerisch bedeutsame Betonung des Kopfhaars Simsons.
- source_word: לְצַמֵּחַ
  choice: wieder zu wachsen
  rationale: צמח bedeutet „wachsen, sprossen“. „Wieder“ ist nicht ausdrücklich Bestandteil des Verbs, ergibt sich aber natürlich aus dem Zusammenhang der vorausgegangenen Schur.
- source_word: כַּאֲשֶׁר
  choice: nachdem
  rationale: Die Konjunktion kann „als“, „wenn“ oder im gegebenen Zusammenhang zeitlich „nachdem“ bedeuten; „nachdem“ drückt die Abfolge im Deutschen klar aus.
- source_word: גֻּלָּח
  choice: es abgeschoren worden war
  rationale: Die passive Verbform wird bewahrt. Das sächliche Pronomen bezieht sich im Deutschen natürlich auf „das Haar“; sachlich ist auch eine auf Simson bezogene Wiedergabe möglich.
