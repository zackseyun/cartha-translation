  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: de
  text: Das Haus war voller Männer und Frauen, und alle Fürsten der Philister waren dort. Auf dem Dach befanden sich etwa dreitausend Männer und Frauen, die Simson bei seiner Darbietung zusahen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „die Simson beim Spiel zusahen“. Das hebräische Wort aus der Wurzel שׂחק kann Lachen, Spielen, Kurzweil oder unterhaltende Darbietung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die Grundbedeutung ist „Haus“ beziehungsweise „Gebäude“. Der Zusammenhang deutet auf den Versammlungsbau im Tempelbereich Dagons, doch der hebräische Text legt sich hier nicht ausdrücklich auf „Tempel“ fest.
- source_word: מָלֵא הָאֲנָשִׁים וְהַנָּשִׁים
  choice: war voller Männer und Frauen
  rationale: Die Formulierung gibt den statischen Sinn von מָלֵא natürlich wieder und bewahrt die ausdrückliche Nennung beider Geschlechter.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: alle Fürsten der Philister
  rationale: סְרָנִים bezeichnet die charakteristischen philistäischen Machthaber. „Fürsten“ wahrt ihren politischen Rang, ohne einen modernen Amtstitel einzutragen.
- source_word: וְעַל הַגָּג
  choice: Auf dem Dach
  rationale: גָּג bedeutet „Dach“ oder „Dachfläche“. Die vorangestellte Ortsangabe entspricht der Hervorhebung im Hebräischen.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: etwa dreitausend
  rationale: Das Präfix כ־ kennzeichnet hier eine ungefähre Zahl.
- source_word: אִישׁ וְאִשָּׁה
  choice: Männer und Frauen
  rationale: Die Singularformen werden kollektiv beziehungsweise distributiv gebraucht; im Deutschen ist der Plural die natürliche Wiedergabe.
- source_word: הָרֹאִים בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: die Simson bei seiner Darbietung zusahen
  rationale: הָרֹאִים beschreibt die Zuschauer, während שׂחק ein Bedeutungsfeld von Lachen, Spielen, Kurzweil und Unterhaltung hat. „Darbietung“ ist im Kontext verständlich, ohne ausdrücklich ein im Hebräischen nicht genanntes Objekt wie „sie“ hinzuzufügen; die verbleibende Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
