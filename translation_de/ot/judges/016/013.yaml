  text: וַ/תֹּ֨אמֶר דְּלִילָ֜ה אֶל שִׁמְשׁ֗וֹן עַד הֵ֜נָּה הֵתַ֤לְתָּ בִּ/י֙ וַ/תְּדַבֵּ֤ר אֵלַ/י֙ כְּזָבִ֔ים הַגִּ֣ידָ/ה לִּ֔/י בַּ/מֶּ֖ה תֵּאָסֵ֑ר וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם תַּאַרְגִ֗י אֶת שֶׁ֛בַע מַחְלְפ֥וֹת רֹאשִׁ֖/י עִם הַ/מַּסָּֽכֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: de
  text: 'Da sagte Delila zu Simson: »Bis jetzt hast du mich zum Narren gehalten und mir Lügen erzählt. Sag mir, womit man dich fesseln kann!« Er antwortete ihr: »Wenn du die sieben Haarsträhnen auf meinem Kopf mit dem Gewebe verwebst[a] …«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in das Gewebe einwebst«. Der hebräische Ausdruck ist ein Fachwort des Webens und kann das Gewebe beziehungsweise die Webarbeit am Webstuhl bezeichnen. Der Satz wird im nächsten Vers fortgeführt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: du hast mich zum Narren gehalten
  rationale: Die Wendung bezeichnet hier ein täuschendes Spiel mit jemandem. Die deutsche Formulierung ist natürlich und grenzt sich von der unmittelbar folgenden Aussage über Lügen ab.
- source_word: כְּזָבִים
  choice: Lügen
  rationale: Das Substantiv bezeichnet falsche Aussagen; „Lügen“ ist die klare und geläufige deutsche Entsprechung.
- source_word: הַגִּידָה לִּי
  choice: Sag mir
  rationale: Der Imperativ von נגד verlangt in diesem Zusammenhang eine direkte Mitteilung; „Sag mir“ ist knapp und idiomatisch.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: womit man dich fesseln kann
  rationale: „Womit“ bewahrt den instrumentalen Sinn von בַּמֶּה. Die unpersönliche aktive Form gibt das passive hebräische Verb im Deutschen natürlich wieder, ohne das mögliche oder wirksame Fesseln überzubestimmen.
- source_word: תַּאַרְגִי
  choice: einwebst
  rationale: Das Verb ארג bedeutet „weben“. Mit „in das Gewebe einwebst“ wird die konkrete Verbindung der Haare mit dem Webstück im Deutschen verständlich ausgedrückt.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: die sieben Haarsträhnen meines Kopfes
  rationale: מחלפות bezeichnet Haarsträhnen, Locken oder möglicherweise geflochtene Haarpartien. „Haarsträhnen“ ist verständlich und legt eine Flechtform nicht unnötig fest.
- source_word: עִם הַמַּסָּכֶת
  choice: in das Gewebe
  rationale: מַסֶּכֶת ist hier ein Fachwort aus dem Bereich des Webens und kann das Gewebe beziehungsweise die Webarbeit am Webstuhl bezeichnen. Die Präposition עִם lautet formal „mit“; idiomatisch beschreibt „in das Gewebe“ den wahrscheinlich gemeinten Vorgang, während die Fußnote die Unsicherheit offenlegt.
