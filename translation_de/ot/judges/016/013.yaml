  to: 'Da sagte Delila zu Simson: »Bis jetzt hast du mich zum Narren gehalten und mir Lügen erzählt. Sag mir, womit man dich fesseln kann!« Er antwortete ihr: »Wenn du die sieben Haarsträhnen auf meinem Kopf mit dem Gewebe verwebst[a] …«'
