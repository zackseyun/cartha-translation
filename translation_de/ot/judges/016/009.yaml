review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft den Handlungsablauf und die wesentlichen Bilder gut. Eine Revision ist angezeigt, weil הָאֹרֵב im Hebräischen grammatisch Singular ist; „Männer“ legt ohne Not eine Mehrzahl fest. „Flachsfaden“ ist zudem weniger genau als ein Faden aus Flachswerg (נְעֹרֶת).
  naturalness: Der Entwurf ist insgesamt gut lesbar und hat einen passenden erzählerischen Register. „Ein Mann lag ... auf der Lauer“ und „blieb seine Kraft unbekannt“ sind im modernen Deutsch natürlicher als die bisherigen Formulierungen, ohne den Sinn zu erweitern.
  terminology: „Simson“, „Philister“ und „Sehnen“ sind angemessen. „Faden aus Flachswerg“ gibt das Material des Vergleichs genauer wieder als „Flachsfaden“ und bleibt verständlich.
  issues:
  - severity: medium
    issue: „Männer“ statt Singular
    rationale: הָאֹרֵב („der Lauernde/der im Hinterhalt Liegende“) steht im Singular. Zwar kann ein Singular kollektiv verstanden werden, doch der Text selbst nennt hier keine Mehrzahl; die deutsche Übersetzung sollte diese Festlegung nicht vorwegnehmen.
  - severity: low
    issue: „Flachsfaden“ für פְּתִיל הַנְּעֹרֶת
    rationale: נְעֹרֶת bezeichnet Flachswerg bzw. lose Flachsfasern, nicht einfach Flachs. „Ein Faden aus Flachswerg“ bewahrt sowohl die Materialangabe als auch die Bildhaftigkeit präziser.
  - severity: low
    issue: „So wurde seine Kraft nicht entdeckt“
    rationale: Die passive Form ist möglich, klingt aber im Deutschen technisch. „So blieb seine Kraft unbekannt“ gibt וְלֹא נוֹדַע כֹּחוֹ idiomatisch wieder, ohne eine bestimmte Person als Entdecker vorauszusetzen.
