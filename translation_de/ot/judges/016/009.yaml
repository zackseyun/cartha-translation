base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: de
  text: 'Im inneren Zimmer lag für sie ein Mann auf der Lauer. Sie rief ihm zu: »Die Philister fallen über dich her, Simson!« Doch er zerriss die Sehnen, wie ein Faden aus Flachswerg zerreißt, wenn er Feuer riecht. So blieb seine Kraft unbekannt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹרֵב
  choice: Männer … im Hinterhalt
  rationale: Das substantivierte Singularwort bezeichnet hier kollektiv die im Hinterhalt lauernden Männer; die Wiedergabe macht den Bezug im Deutschen natürlich verständlich.
- source_word: לָהּ
  choice: für sie
  rationale: 'Bewahrt den Dativbezug des Hebräischen: Die Männer stehen Delila für ihren Plan zur Verfügung.'
- source_word: הַיְתָרִים
  choice: die Sehnen
  rationale: Bezeichnet die zuvor genannten frischen Sehnen beziehungsweise daraus gefertigten Fesseln; „Sehnen“ hält den Anschluss an Vers 7–8.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: ein Flachsfaden
  rationale: נְעֹרֶת meint Flachswerg beziehungsweise lose Flachsfasern. „Flachsfaden“ ist präzise und für heutige Leser verständlicher als „Wergfaden“.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: So wurde seine Kraft nicht entdeckt
  rationale: Gibt die passive Aussage eng wieder und bewahrt den Gedanken, dass die Ursache beziehungsweise das Geheimnis seiner Kraft weiterhin unbekannt blieb.
theological_decisions:
- issue: Art der Kraft Simsons
  choice: Der Text sagt nur, dass seine Kraft nicht entdeckt wurde.
  alternative: Ausdrücklich vom „Geheimnis“ oder der „Quelle“ seiner Kraft sprechen.
  rationale: Die Übersetzung vermeidet eine zusätzliche Deutung und lässt die Spannung der Erzählung bestehen.
translation_notes:
  register: Modernes, würdevolles Erzählendeutsch. Der Alarmruf wird idiomatisch mit „fallen über dich her“ wiedergegeben; das bildhafte „Feuer riecht“ bleibt entsprechend dem Hebräischen erhalten.
