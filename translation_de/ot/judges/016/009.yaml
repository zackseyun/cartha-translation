  to: 'Im inneren Zimmer lag für sie ein Mann auf der Lauer. Sie rief ihm zu: »Die Philister fallen über dich her, Simson!« Doch er zerriss die Sehnen, wie ein Faden aus Flachswerg zerreißt, wenn er Feuer riecht. So blieb seine Kraft unbekannt.'
