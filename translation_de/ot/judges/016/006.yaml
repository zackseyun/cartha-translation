base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: de
  text: 'Da sagte Delila zu Simson: »Sag mir doch, worin deine große Kraft liegt und womit man dich fesseln könnte, um dich zu bezwingen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um dich zu demütigen« oder »um dich zu bedrücken«. Das hebräische Verb kann »bedrücken«, »demütigen« oder »peinigen« bedeuten; im Zusammenhang kann es das Bezwingen oder Überwältigen Simsons bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das wayyiqtol führt die Erzählung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: דְּלִילָה ... שִׁמְשׁוֹן
  choice: Delila ... Simson
  rationale: Die Personennamen folgen ihrer etablierten deutschen Form.
- source_word: הַגִּידָה נָּא לִי
  choice: Sag mir doch
  rationale: הגיד bedeutet »mitteilen/sagen«; נא verleiht der Aufforderung einen bittenden oder werbenden Ton, den »doch« im Deutschen natürlich wiedergibt.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: worin deine große Kraft liegt
  rationale: במה heißt wörtlich »worin«; die gewählte Wendung ist idiomatisches Deutsch und bewahrt die Frage nach dem Grund oder Geheimnis seiner Kraft.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: und womit man dich fesseln könnte
  rationale: אסר im Nifal bezeichnet das Gebunden- oder Gefesseltwerden. Die unpersönliche Konstruktion mit »man« klingt im Deutschen natürlicher als ein Passiv und bewahrt die Frage nach dem Mittel.
- source_word: לְעַנּוֹתֶךָ
  choice: um dich zu bezwingen
  rationale: ענה im Piel kann »bedrücken, demütigen, quälen« bedeuten; im unmittelbaren Zusammenhang zielt die Handlung darauf, Simson zu überwältigen. »Bezwingen« gibt diesen kontextuellen Sinn verständlich wieder, während die Fußnote die Bedeutungsbreite offenhält.
theological_decisions:
- issue: Bedeutungsbreite von ענה im Piel
  choice: bezwingen
  alternative: demütigen, bedrücken oder quälen
  rationale: Der Kontext legt das Überwältigen Simsons nahe, doch das hebräische Verb kann auch eine leidvolle Behandlung oder Erniedrigung bezeichnen. Diese Spannung wird nicht dogmatisch festgelegt, sondern durch eine Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. »Sag mir doch« wahrt Delilas bittend-werbenden Ton; »womit man dich fesseln könnte« vermeidet ein schwerfälliges deutsches Passiv. Die Anführungszeichen entsprechen deutscher Typografie.
