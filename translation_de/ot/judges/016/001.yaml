source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: de
  text: Simson ging nach Gaza. Dort sah er eine Prostituierte und schlief mit ihr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und er ging zu ihr hinein« – in diesem Zusammenhang eine übliche Umschreibung für Geschlechtsverkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das Verb הלך bezeichnet in der erzählenden Abfolge eine gewöhnliche Bewegung und wird im Deutschen natürlich mit »ging« wiedergegeben.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Die im Deutschen eingebürgerte Form des hebräischen Personennamens wird beibehalten.
- source_word: עַזָּתָה
  choice: nach Gaza
  rationale: Das Richtungs-He am Ortsnamen zeigt eine Bewegung auf die Stadt zu an; bei Städtenamen drückt modernes Deutsch dies idiomatisch mit »nach« aus.
- source_word: וַיַּרְא שָׁם
  choice: Dort sah er
  rationale: שָׁם bedeutet »dort«; die gewählte Wortstellung entspricht natürlichem deutschem Erzählstil und hebt zugleich den Schauplatz hervor.
- source_word: אִשָּׁה זוֹנָה
  choice: eine Prostituierte
  rationale: זוֹנָה bezeichnet hier eine Frau, die der Prostitution nachgeht. »Prostituierte« ist gegenwärtig, präzise und weniger altertümlich als »Hure«.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: und ging zu ihr hinein
  rationale: Die Wendung בוא אל ist in diesem Zusammenhang eine sexuelle Umschreibung. »Ging zu ihr hinein« bewahrt Bildhaftigkeit und indirekte Ausdrucksweise des Hebräischen; die Fußnote erläutert den stark naheliegenden Sinn.
theological_decisions:
- issue: Ob der sexuelle Sinn von וַיָּבֹא אֵלֶיהָ im Haupttext ausdrücklich genannt oder die hebräische Umschreibung bewahrt werden soll
  choice: Die umschreibende Wendung »ging zu ihr hinein« wird im Haupttext bewahrt.
  alternative: »hatte Geschlechtsverkehr mit ihr« oder »schlief mit ihr«
  rationale: Der Kontext legt Geschlechtsverkehr deutlich nahe, doch der hebräische Text verwendet eine konventionelle Umschreibung. Die Übersetzung sollte dessen Grad an Explizitheit nicht ohne Not erhöhen; die Fußnote macht den Sinn transparent.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der erste Satz wird zur natürlichen Gliederung vom folgenden Geschehen getrennt. Die sexuelle Umschreibung bleibt bewusst erhalten, wird aber durch eine unmittelbar zugeordnete Fußnote erläutert.
