  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אֵ֚יךְ תֹּאמַ֣ר אֲהַבְתִּ֔י/ךְ וְ/לִבְּ/ךָ֖ אֵ֣ין אִתִּ֑/י זֶ֣ה שָׁלֹ֤שׁ פְּעָמִים֙ הֵתַ֣לְתָּ בִּ֔/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֥ גָדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: de
  text: 'Da sagte sie zu ihm: „Wie kannst du sagen: ‚Ich liebe dich‘, wenn dein Herz nicht bei mir ist? Nun hast du mich schon dreimal zum Narren gehalten[a] und mir nicht verraten, worin deine große Kraft liegt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit mir gespielt“, „mich getäuscht“ oder „mich verspottet“. Das hebräische Verb bezeichnet ein täuschendes Spiel, durch das jemand zum Gespött gemacht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie kannst du
  rationale: Gibt Delilas ungläubig-vorwurfsvoller rhetorischer Frage im modernen Deutschen natürlich Ausdruck.
- source_word: אֲהַבְתִּיךְ
  choice: Ich liebe dich
  rationale: Das hebräische Perfekt bezeichnet hier in direkter Rede Simsons behauptete fortdauernde Liebe und wird daher präsentisch wiedergegeben.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: dein Herz nicht bei mir ist
  rationale: Bewahrt das hebräische Bild für innere Verbundenheit und Loyalität, ohne es enger auszudeuten.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: Nun hast du mich schon dreimal
  rationale: Eine natürliche deutsche Wiedergabe der hebräischen Wendung, die auf die drei vorausgegangenen Täuschungen verweist.
- source_word: הֵתַלְתָּ בִּי
  choice: mich zum Narren gehalten
  rationale: Erfasst das trügerische Spiel und die persönliche Demütigung; die mögliche Nuance des Verspottens wird in der Fußnote offengehalten.
- source_word: הִגַּדְתָּ לִּי
  choice: mir nicht verraten
  rationale: Passt zum vertraulichen, zugleich bedrängenden Gespräch und bezeichnet hier das verlangte Offenlegen eines Geheimnisses.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: worin deine große Kraft liegt
  rationale: Drückt idiomatisch die Frage nach dem Grund beziehungsweise Geheimnis seiner außergewöhnlichen Kraft aus.
