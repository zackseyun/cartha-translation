  text: וַ/יִּקְרָ֥א שִׁמְשׁ֛וֹן אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהֹוִ֡ה זָכְרֵ֣/נִי נָא֩ וְ/חַזְּקֵ֨/נִי נָ֜א אַ֣ךְ הַ/פַּ֤עַם הַ/זֶּה֙ הָ/אֱלֹהִ֔ים וְ/אִנָּקְמָ֧ה נְקַם אַחַ֛ת מִ/שְּׁתֵ֥י עֵינַ֖/י מִ/פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: de
  text: 'Da rief Simson zu Jahwe und sagte: »Herr Jahwe, denk doch an mich! Stärke mich doch nur dieses eine Mal, Gott, damit ich an den Philistern mit einem einzigen Racheakt Vergeltung für meine beiden Augen[a] üben kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für meine beiden Augen«; gemeint ist, dass die Philister Simson geblendet hatten.'
    reason: Die knappe hebräische Wendung nennt die Augen selbst und setzt den erzählerischen Zusammenhang der Blendung voraus.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל יְהוָה
  choice: Da rief Simson zu Jahwe
  rationale: קרא אל bezeichnet hier das Anrufen Gottes. „Rief zu“ ist natürlich und bewahrt die Gebetssituation; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: Herr Jahwe
  rationale: Die Verbindung bewahrt sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יהוה, ohne beide zu einem allgemeinen Gottesbegriff zusammenzuziehen.
- source_word: זָכְרֵנִי נָא
  choice: denk doch an mich
  rationale: Der Imperativ mit נָא ist eine eindringliche Bitte. „Doch“ gibt den flehentlichen Ton im heutigen Deutsch natürlich wieder.
- source_word: וְחַזְּקֵנִי נָא אַךְ הַפַּעַם הַזֶּה
  choice: Stärke mich doch nur noch dieses eine Mal
  rationale: חזק im Piel bittet um verliehene Kraft; אַךְ begrenzt die Bitte ausdrücklich auf diesen einen Anlass.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der bestimmte Ausdruck steht als direkte Anrede. Im Deutschen macht die Satzstellung die Anrede deutlich, ohne das altertümliche „o Gott“ zu benötigen.
- source_word: וְאִנָּקְמָה נְקַם אַחַת
  choice: damit ich ... mit einem einzigen Racheakt Vergeltung ... üben kann
  rationale: Der Kohortativ drückt Simsons beabsichtigtes Ziel aus. Die Verbindung von Verb und verwandtem Substantiv sowie אַחַת betont eine einzige Vergeltungstat.
- source_word: מִשְּׁתֵי עֵינַי מִפְּלִשְׁתִּים
  choice: an den Philistern ... Vergeltung für meine beiden Augen
  rationale: Die Präpositionen werden entsprechend der deutschen Verbindung „an jemandem Vergeltung für etwas üben“ wiedergegeben. „Für meine beiden Augen“ bleibt nahe am knappen und leicht mehrdeutigen Hebräisch.
theological_decisions:
- issue: Wiedergabe der Gottesnamen in Simsons Gebet
  choice: „Jahwe“ für יהוה und „Herr Jahwe“ für אֲדֹנָי יֱהֹוִה
  alternative: „der HERR“ beziehungsweise „Herr HERR“ oder „Herr, Jahwe“
  rationale: Die Übersetzung unterscheidet den offenbarten Eigennamen vom Titel „Herr“ und erhält die doppelte Anrede des hebräischen Textes.
- issue: Moralische Bewertung von Simsons Rachebitte
  choice: Die Bitte wird ohne zustimmenden oder verurteilenden Zusatz wiedergegeben.
  alternative: Die Bitte durch wertende Formulierungen theologisch einordnen.
  rationale: Der Vers berichtet Simsons Worte, ohne an dieser Stelle ausdrücklich ein moralisches Urteil über sein Rachebegehren zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetstypischer Eindringlichkeit. Die zweimalige Partikel נָא wird durch „doch“ wiedergegeben; „nur noch dieses eine Mal“ bewahrt die nachdrückliche Begrenzung. Der Fußnotenmarker steht unmittelbar nach dem Zitat.
