  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. »trugen ihn fort« ist in diesem Kontext präziser und ebenso natürlich. »richtete Israel« ist als etablierte Formel des Richterbuchs verständlich und bewahrt den knappen, formelhaften Charakter des Hebräischen.
