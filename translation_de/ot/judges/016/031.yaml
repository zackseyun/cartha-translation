base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: de
  text: Da kamen seine Brüder und die ganze Familie seines Vaters herab, trugen ihn fort, brachten ihn hinauf und begruben ihn zwischen Zora und Eschtaol im Grab seines Vaters Manoach. Er richtete Israel zwanzig Jahre lang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hatte Israel zwanzig Jahre lang gerichtet.« Das Hebräische kann auch als rückblickende Zusammenfassung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: kamen ... herab
  rationale: Bewahrt die im Verb bezeichnete Abwärtsbewegung und gibt den erzählerischen Blickpunkt in natürlichem Deutsch wieder.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Die naheliegende Bedeutung sind leibliche Brüder; der Kontext verlangt keine Erweiterung zu »Verwandte«.
- source_word: כָל בֵּית אָבִיהוּ
  choice: die ganze Familie seines Vaters
  rationale: Das hebräische Idiom bezeichnet die väterliche Großfamilie beziehungsweise Hausgemeinschaft; »Familie« ist hier verständlicher als das wörtliche »Haus«.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: nahmen ihn mit
  rationale: Im Bestattungskontext bezeichnet נשׂא das Aufnehmen und Forttragen des Leichnams; die Formulierung ist natürlich und wahrt den Sinn.
- source_word: וַיַּעֲלוּ
  choice: brachten ihn hinauf
  rationale: Gibt die topografische Aufwärtsbewegung wieder und ergänzt das im Hebräischen aus dem Zusammenhang erschlossene Objekt.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: begruben ihn
  rationale: Direkte und geläufige Entsprechung des Bestattungsverbs.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: zwischen Zora und Eschtaol
  rationale: Gibt die Ortsangabe direkt wieder und verwendet im Deutschen gebräuchliche Namensformen.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: im Grab seines Vaters Manoach
  rationale: קֶבֶר kann Grab oder Gruft bedeuten. »Grab« ist neutral und natürlich; die Apposition »sein Vater« bleibt erhalten.
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: Er hatte Israel ... als Richter geführt
  rationale: Die retrospektive Formulierung passt nach der Bestattung und bewahrt durch »als Richter« die für das Richterbuch wichtige Amts- und Retterterminologie, während idiomatisches Deutsch vermieden wird, das wie gerichtliche Rechtsprechung allein klänge.
- source_word: עֶשְׂרִים שָׁנָה
  choice: zwanzig Jahre lang
  rationale: Direkte Wiedergabe; »lang« macht die Zeitdauer im Deutschen natürlich deutlich.
theological_decisions:
- issue: Erzählerische Zusammenfassung von Simsons Richterzeit
  choice: Er hatte Israel zwanzig Jahre lang als Richter geführt.
  alternative: Er führte Israel zwanzig Jahre lang als Richter.
  rationale: Nach dem Bericht von Simsons Tod und Bestattung liegt eine rückblickende Zusammenfassung nahe. Das Hebräische lässt jedoch auch eine einfache Vergangenheitsformel zu; diese echte Aspekt- und Diskursambiguität wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bewegungsrichtungen »herab« und »hinauf« bleiben erhalten. »Als Richter geführt« vermittelt die besondere Bedeutung von שׁפט im Richterbuch verständlicher als das missverständliche bloße »richtete Israel«.
