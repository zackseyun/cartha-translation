  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יֶּאֱהַ֥ב אִשָּׁ֖ה בְּ/נַ֣חַל שֹׂרֵ֑ק וּ/שְׁמָ֖/הּ דְּלִילָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: de
  text: Danach liebte er eine Frau im Tal Sorek[a]. Sie hieß Delila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Wadi Sorek«. Das hebräische Wort נַחַל kann ein Tal, ein Bachbett oder einen saisonalen Wasserlauf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die hebräische Erzählungsformel bedeutet wörtlich »Und es geschah danach«. »Danach« gibt die zeitliche Abfolge in natürlichem, modernem Deutsch knapp wieder.
- source_word: וַיֶּאֱהַב
  choice: liebte er
  rationale: Das Verb אָהַב bedeutet hier unmittelbar »lieben«. Die Wiedergabe vermeidet die zusätzliche romantische Nuance von »verliebte sich«.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אִשָּׁה kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten. Da keine Ehebeziehung genannt wird, bleibt »eine Frau« sachlich und offen.
- source_word: בְּנַחַל שֹׂרֵק
  choice: im Tal Sorek
  rationale: נַחַל kann ein Tal, Bachbett oder saisonales Fließgewässer bezeichnen. »Tal Sorek« ist verständlich und bewahrt den geografischen Sinn; die genauere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: וּשְׁמָהּ
  choice: Sie hieß
  rationale: Die natürliche deutsche Formulierung gibt die ausdrückliche Einführung des Namens präzise wieder, ohne den Inhalt zu verändern.
- source_word: דְּלִילָה
  choice: Delila
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form »Delila« wiedergegeben.
