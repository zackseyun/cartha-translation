  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: de
  text: Da ergriff Simson die beiden mittleren Pfeiler[a], auf denen das Haus ruhte, und stützte sich auf sie[b], den einen zu seiner Rechten und den anderen zu seiner Linken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die beiden zentralen Pfeiler“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und lehnte sich an sie“. Das hebräische Verb kann ein Anlehnen oder Sich-Abstützen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: ergriff
  rationale: Das seltene Verb bezeichnet ein festes Ergreifen oder Umfassen. „Ergriff“ gibt die gezielte körperliche Handlung natürlich und würdig wieder, ohne ihre Stärke zu überzeichnen.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: die beiden mittleren Pfeiler
  rationale: עַמּוּדֵי bezeichnet Pfeiler, הַתָּוֶךְ ihre Lage in der Mitte beziehungsweise im Zentrum. Die Formulierung ist im Deutschen klar und architektonisch natürlich.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: auf denen das Haus ruhte
  rationale: נָכוֹן beschreibt hier das feste Stehen beziehungsweise Getragensein des Hauses auf den Pfeilern. „Ruhte“ bringt ihre tragende Funktion knapp zum Ausdruck.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: und stemmte sich gegen sie
  rationale: סמך kann hier ein Sich-Anlehnen oder Sich-Abstützen bezeichnen. Im Zusammenhang mit Simsons unmittelbar folgender Kraftanstrengung gibt „stemmte sich gegen“ die wahrscheinliche körperliche Haltung treffend wieder, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: gegen den einen mit seiner rechten Hand und gegen den anderen mit seiner linken
  rationale: Die distributive Wendung ordnet je einen Pfeiler Simsons rechter und linker Seite zu. Aufgrund des vorausgehenden Ergreifens ist der Bezug auf die Hände im Deutschen natürlich und sachlich naheliegend.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: „Haus“ entspricht der üblichen Grundbedeutung des hebräischen Wortes und bewahrt die Ausdrucksweise des Ausgangstextes, auch wenn im Zusammenhang ein großes Kultgebäude gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Der Gedankenstrich gliedert die Verteilung der beiden Hände auf die beiden Pfeiler. Die im Hebräischen vorhandene Bedeutungsbreite bei der Lage der Pfeiler und bei Simsons Körperhaltung wird in den Fußnoten bewahrt.
