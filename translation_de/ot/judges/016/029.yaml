    issue: „stemmte sich gegen sie“ ist semantisch enger und dynamischer als das hebräische Verb.
    rationale: וַיִּסָּמֵךְ עֲלֵיהֶם bedeutet primär, dass Simson sich auf die Pfeiler lehnte bzw. auf ihnen abstützte. Die folgende Handlung darf nicht bereits in diese Verbwahl eingetragen werden.
  - severity: low
    issue: Die Nennung der rechten und linken Hand ist eine zusätzliche Konkretisierung.
    rationale: Der hebräische Text ordnet die Pfeiler „zu seiner Rechten“ und „zu seiner Linken“ zu; Hände sind zwar kontextuell denkbar, stehen aber nicht ausdrücklich im Text.
  revised_text: Da ergriff Simson die beiden mittleren Pfeiler[a], auf denen das Haus ruhte, und stützte sich auf sie[b], den einen zu seiner Rechten und den anderen zu seiner Linken.
