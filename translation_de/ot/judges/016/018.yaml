base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: de
  text: 'Als Delila sah, dass er ihr sein ganzes Herz offenbart hatte, schickte sie nach den Fürsten der Philister und ließ sie rufen. Sie sagte: »Kommt diesmal herauf, denn er hat ihr sein ganzes Herz offenbart.«[a] Da kamen die Fürsten der Philister zu ihr herauf und brachten das Silber in ihren Händen mit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im überlieferten hebräischen Text steht innerhalb von Delilas direkter Rede »ihr«. Dem Zusammenhang nach wäre »mir« zu erwarten.
    reason: textual_variant
  - marker: b
    text: Das Silber war als Bezahlung bestimmt.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Als Delila sah
  rationale: Das Verb ראה wird in seiner gewöhnlichen Bedeutung »sehen« wiedergegeben; die temporale Einleitung mit »Als« bildet den Erzählzusammenhang natürlich ab, ohne interpretierend »erkannte« zu setzen.
- source_word: הִגִּיד ... אֶת כָּל לִבּוֹ
  choice: sein ganzes Herz offenbart hatte
  rationale: נגד im Hifil bezeichnet das Mitteilen oder Offenbaren. »Sein ganzes Herz offenbaren« bewahrt das hebräische Bild und macht zugleich die vollständige Preisgabe verständlich.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: schickte sie nach ... und ließ sie rufen
  rationale: Beide Verben der hebräischen Folge bleiben erkennbar; die deutsche Formulierung bezeichnet natürlich das Aussenden einer Botschaft und die Vorladung.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: Fürsten der Philister
  rationale: סרן bezeichnet die führenden Amtsträger der philistäischen Städte. »Fürsten« ist eine geläufige, würdige Wiedergabe; »Herren« könnte die besondere politische Stellung weniger deutlich ausdrücken.
- source_word: עֲלוּ הַפַּעַם
  choice: Kommt diesmal herauf
  rationale: »Heraufkommen« bewahrt die Bewegungsrichtung von עלה zu Delilas Aufenthaltsort; »diesmal« gibt הַפַּעַם wieder und signalisiert, dass nun die entscheidende Gelegenheit gekommen ist.
- source_word: כִּי הִגִּיד לָהּ אֶת כָּל לִבּוֹ
  choice: denn er hat ihr sein ganzes Herz offenbart
  rationale: Der masoretische Text hat auch innerhalb der direkten Rede das Pronomen der dritten Person feminin Singular, »ihr«. Diese auffällige Form wird nicht stillschweigend zu »mir« geändert.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: brachten das Silber in ihren Händen mit
  rationale: הַכֶּסֶף wird wörtlich als »das Silber« wiedergegeben. »Mitbringen« vermittelt im Deutschen natürlich, dass die Fürsten es als vorgesehene Zahlung bei sich trugen; »in ihren Händen« bewahrt die konkrete Ausdrucksweise des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das hebräische Herz-Bild und die auffällige dritte Person in Delilas direkter Rede bleiben erhalten. »Fürsten der Philister« bezeichnet ihre führenden Amtsträger ohne unnötig feudale oder konfessionell geprägte Nebenbedeutungen.
