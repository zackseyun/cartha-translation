  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: de
  text: 'Er sagte zu ihr: „Wenn sie mich mit neuen Stricken fesseln, mit denen noch keine Arbeit verrichtet worden ist[a], dann werde ich schwach und wie jeder andere Mensch sein[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die noch nie benutzt worden sind“.'
    reason: 'Die hebräische Wendung lautet wörtlicher: „mit denen keine Arbeit verrichtet worden ist“ und beschreibt unbenutzte Stricke.'
  - marker: b
    text: 'Wörtlicher: „wie einer der Menschen“; gemeint ist ein gewöhnlicher Mensch ohne außergewöhnliche Kraft.'
    reason: Die hebräische Vergleichsformel kann formal-partitiv oder idiomatisch verallgemeinernd verstanden werden.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Er sagte zu ihr
  rationale: Das narrative Wayyiqtol führt Simsons Antwort fort. Im natürlichen Deutschen muss das einleitende וַ nicht eigens mit „und“ wiedergegeben werden.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: Wenn sie mich … fesseln
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Bindevorgang. Das deutsche „fesseln“ bezeichnet bereits ein wirksames, festes Binden und vermeidet den möglicherweise überdeutlichen Zusatz „fest“.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: mit neuen Stricken
  rationale: עֲבֹתִים bezeichnet kräftige Stricke oder Seile; „Stricke“ ist im Zusammenhang des Fesselns präzise und geläufig. חֲדָשִׁים bedeutet „neu“.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: mit denen noch keine Arbeit verrichtet worden ist
  rationale: Die passive hebräische Formulierung wird eng am Wortlaut wiedergegeben und bringt zum Ausdruck, dass die Stricke noch unbenutzt sind.
- source_word: וְחָלִיתִי
  choice: dann werde ich schwach
  rationale: חלה bezeichnet hier im Gegensatz zu Simsons außergewöhnlicher Kraft das Schwachwerden, nicht eine Erkrankung.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: und wie jeder andere Mensch sein
  rationale: Die idiomatische deutsche Formulierung gibt den Vergleich mit einem gewöhnlichen Menschen ohne außergewöhnliche Kraft wieder. Eine Fußnote bewahrt die formnähere mögliche Wiedergabe.
theological_decisions:
- issue: Bedeutung von כְּאַחַד הָאָדָם
  choice: wie jeder andere Mensch
  alternative: wie einer der Menschen
  rationale: Der Zusammenhang stellt Simsons außergewöhnliche Kraft dem gewöhnlichen menschlichen Zustand gegenüber. „Mensch“ gibt אָדָם hier natürlich wieder, ohne eine über den hebräischen Text hinausgehende geschlechtliche oder theologische Festlegung; die partitiv-formale Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fesseln“ ist im Kontext natürlicher als die wörtliche Wiederholung von „binden“ und trägt die emphatische Konstruktion mit, ohne „fest“ ausdrücklich hinzuzufügen. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
