  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: de
  text: 'Da kamen die Fürsten der Philister zu ihr herauf und sagten zu ihr: »Verlocke ihn und finde heraus, worin seine große Kraft liegt und wie wir ihn überwältigen können, damit wir ihn fesseln und demütigen können. Und jeder von uns wird dir elfhundert Silberstücke[a] geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »elfhundert Silber«. Gemeint sind wahrscheinlich elfhundert Silberstücke oder Silberschekel von jedem einzelnen Philisterfürsten.'
    reason: Das Hebräische nennt weder „Stücke“ noch ausdrücklich die Gewichtseinheit Schekel; die Fußnote bewahrt diese sprachliche Unbestimmtheit.
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: Da kamen ... zu ihr herauf
  rationale: Bewahrt die Bewegungsrichtung von עלה zu der Frau hin; „heraufkommen“ ist im Deutschen natürlich und lässt die möglicherweise topografische Nuance stehen.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: die Fürsten der Philister
  rationale: סרן bezeichnet die führenden Herrscher der philistäischen Stadtstaaten; „Fürsten“ ist eine geläufige, würdige deutsche Wiedergabe des besonderen Amtstitels.
- source_word: פַּתִּי
  choice: Verlocke
  rationale: Der Piel-Imperativ fordert dazu auf, Simson manipulativ zu einer Preisgabe zu bringen. „Verlocke“ bildet dies ab, ohne eine vom Verb nicht zwingend verlangte sexuelle Bedeutung einzutragen.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: und finde heraus, worin seine große Kraft liegt
  rationale: Das wörtliche „sieh“ hat hier den Sinn des Ermittelns. Die Formulierung gibt die Frage nach der Grundlage beziehungsweise dem Geheimnis seiner ausdrücklich als groß bezeichneten Kraft natürlich wieder.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: und wie wir ihn überwältigen können
  rationale: יכל ל bezeichnet das Überwinden oder Bezwingen eines Gegners. „Überwältigen“ passt zum geplanten gewaltsamen Zugriff und gibt die idiomatische Wendung klar wieder.
- source_word: וַאֲסַרְנֻהוּ
  choice: damit wir ihn fesseln
  rationale: אסר bedeutet hier binden beziehungsweise fesseln; „damit“ macht den inhaltlichen Zweckzusammenhang im Deutschen verständlich.
- source_word: לְעַנֹּתוֹ
  choice: und bezwingen können
  rationale: ענה im Piel kann demütigen, niederdrücken, misshandeln oder unterwerfen bedeuten. Im Zusammenhang der Gefangennahme wahrt „bezwingen“ die Breite des Ausdrucks, ohne eine bestimmte Art der Misshandlung festzulegen.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: Dann wird jeder von uns dir elfhundert Silberstücke geben
  rationale: 'איש ist distributiv: Jeder einzelne Fürst verspricht diesen Betrag. Da im Hebräischen nur „elfhundert Silber“ steht, ergänzt der Haupttext idiomatisch „Silberstücke“, ohne ausdrücklich eine Gewichtseinheit festzulegen.'
