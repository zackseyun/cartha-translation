  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: de
  text: Simson blieb bis Mitternacht liegen. Um Mitternacht stand er auf, packte die Torflügel des Stadttores und die beiden Torpfosten und riss sie samt dem Riegel heraus.[a] Dann legte er sie auf seine Schultern und trug sie auf den Gipfel des Berges hinauf, der Hebron gegenüberliegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zog sie samt dem Riegel heraus“. Das hebräische Verb kann ein Herausziehen oder Losreißen aus der Verankerung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Hebron zugewandt ist“. Die hebräische Wendung lautet wörtlich „der vor dem Angesicht Hebrons liegt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: blieb … liegen
  rationale: שׁכב bezeichnet hier das Liegen beziehungsweise Sichniederlegen. „Blieb … liegen“ gibt zusammen mit עַד den zeitlichen Verlauf natürlich wieder, ohne ausdrücklich zu behaupten, dass Simson schlief.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: bis Mitternacht / um Mitternacht
  rationale: Die wörtliche Wendung „Hälfte/Mitte der Nacht“ wird im heutigen Deutsch am natürlichsten mit „Mitternacht“ wiedergegeben.
- source_word: וַיֶּאֱחֹז
  choice: packte
  rationale: „Packte“ bewahrt die kraftvolle, entschlossene Handlung des Verbs und klingt in der Erzählung natürlich.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: die Torflügel des Stadttores
  rationale: דְּלָתוֹת bezeichnet die beiden beweglichen Flügel des Stadttores; „Torflügel“ ist architektonisch präziser als „Türen“.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: und die beiden Torpfosten
  rationale: מְזוּזוֹת sind hier die seitlichen Pfosten des Tores. „Torpfosten“ ist im Kontext klarer als das allgemeinere „Türpfosten“.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: riss sie samt dem Riegel heraus
  rationale: נסע kann in diesem Zusammenhang das Herausziehen oder Losreißen aus der Verankerung bezeichnen. עִם zeigt, dass der Riegel zusammen mit den Torbestandteilen mitgenommen wurde; „samt“ vermeidet die missverständliche Deutung, der Riegel sei das Werkzeug gewesen.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: legte er sie auf seine Schultern
  rationale: Dies gibt die konkrete Tragweise schlicht und idiomatisch wieder.
- source_word: וַיַּעֲלֵם
  choice: trug sie … hinauf
  rationale: Das Tragen ergibt sich aus dem vorherigen Auflegen auf die Schultern; „hinauf“ bewahrt die durch עלה bezeichnete Aufwärtsbewegung.
- source_word: אֶל רֹאשׁ הָהָר
  choice: auf den Gipfel des Berges
  rationale: רֹאשׁ bezeichnet die Spitze beziehungsweise den Gipfel, הַר einen Berg oder eine Anhöhe. „Gipfel des Berges“ bewahrt die Bildlichkeit des Hebräischen in natürlichem Deutsch.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: der Hebron gegenüberliegt
  rationale: עַל־פְּנֵי beschreibt hier eine räumliche Lage vor, gegenüber oder mit Blick auf Hebron. „Gegenüberliegt“ erhält diese Relation, ohne sie genauer festzulegen.
