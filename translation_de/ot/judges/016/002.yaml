base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: de
  text: 'Den Einwohnern von Gaza wurde berichtet[a]: »Simson ist hierhergekommen.« Da umstellten sie ihn[d] und lauerten ihm die ganze Nacht am Stadttor auf. Sie blieben die ganze Nacht still[b] und sagten: »Wir warten bis zum Morgenlicht[c]; dann töten wir ihn.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische formuliert elliptisch: »Den Einwohnern von Gaza wurde gesagt: Simson ist hierhergekommen.« Das Verb der Mitteilung ist im Deutschen ergänzt.'
    reason: textual_ambiguity
  - marker: b
    text: 'Oder: »schwiegen sie«; das hebräische Verb kann stilles oder schweigendes Verhalten beim Warten im Hinterhalt bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »bis zum Licht des Morgens«; gemeint ist der Tagesanbruch.'
    reason: lexical_alternative
  - marker: d
    text: Das Objekt von »umstellten« ist im Hebräischen nicht ausdrücklich genannt. Gemeint kann Simson sein; auch sein Aufenthaltsort beziehungsweise der betreffende Bereich wird erwogen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: den Einwohnern von Gaza
  rationale: Das Gentiliz bezeichnet die Bewohner Gazas; diese Formulierung ist im modernen Deutsch klarer und natürlicher als »Gaziter«.
- source_word: לֵאמֹר
  choice: wurde berichtet
  rationale: Die elliptische Konstruktion leitet die gemeldete Rede ein. Das unpersönliche Passiv gibt den Sinn im Deutschen natürlich wieder, ohne einen Boten zu ergänzen.
- source_word: בָּא ... הֵנָּה
  choice: ist hierhergekommen
  rationale: Das Perfekt bezeichnet Simsons eingetretene und gegenwärtig relevante Ankunft.
- source_word: וַיָּסֹבּוּ
  choice: umstellten sie ihn
  rationale: סבב bezeichnet hier ein taktisches Umringen. Das Objekt ist im Hebräischen nicht ausdrücklich genannt; »ihn« folgt dem unmittelbaren Kontext, während »den Ort« ebenfalls denkbar wäre.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: lauerten ihm ... auf
  rationale: Die idiomatische deutsche Wiedergabe drückt das feindliche Warten im Hinterhalt aus.
- source_word: כָל הַלַּיְלָה
  choice: die ganze Nacht
  rationale: Bewahrt die ausdrücklich bezeichnete vollständige Dauer.
- source_word: בְּשַׁעַר הָעִיר
  choice: am Stadttor
  rationale: Bezeichnet den Torbereich als strategischen Ausgang der Stadt und ist idiomatisches modernes Deutsch.
- source_word: וַיִּתְחָרְשׁוּ
  choice: verhielten sie sich still
  rationale: Die Form bezeichnet stilles beziehungsweise schweigendes Verhalten und passt zum heimlichen Warten der Männer.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: bis zum Morgenlicht
  rationale: Bewahrt das konkrete Lichtmotiv des hebräischen Ausdrucks und bleibt im Deutschen verständlich.
- source_word: וַהֲרְגְנֻהוּ
  choice: dann töten wir ihn
  rationale: Die Kohortativ-/Imperfektform mit Objektsuffix bezeichnet den beabsichtigten anschließenden Vollzug; »dann« macht den zeitlichen Zusammenhang idiomatisch deutlich.
