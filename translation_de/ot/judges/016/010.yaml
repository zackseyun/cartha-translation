source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הִנֵּה֙ הֵתַ֣לְתָּ בִּ֔/י וַ/תְּדַבֵּ֥ר אֵלַ֖/י כְּזָבִ֑ים עַתָּה֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה תֵּאָסֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: de
  text: 'Da sagte Delila zu Simson: »Sieh doch, du hast deinen Spott mit mir getrieben[a] und mir Lügen erzählt. Nun sag mir bitte, womit du gefesselt werden kannst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »du hast mich zum Narren gehalten«; das hebräische Verb kann ein täuschendes Verspotten oder ein Spiel auf Kosten eines anderen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Die Waw-Konsekutivform führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die Partikel lenkt nachdrücklich die Aufmerksamkeit auf Delilas Vorwurf. „Sieh doch“ bewahrt diese Funktion in heutigem Deutsch.
- source_word: הֵתַלְתָּ בִּי
  choice: du hast deinen Spott mit mir getrieben
  rationale: Das Verb bezeichnet hier ein täuschendes Verspotten oder ein Spiel auf Kosten eines anderen. Die Wendung wahrt sowohl den Spott als auch die persönliche Kränkung, ohne sie auf bloße Täuschung zu reduzieren.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: und mir Lügen erzählt
  rationale: Die Formulierung gibt das Sprechen zu Delila und den Plural „Lügen“ idiomatisch wieder, ohne die Aussage zum allgemeineren „mich belogen“ zu verkürzen.
- source_word: עַתָּה
  choice: Nun
  rationale: „Nun“ markiert knapp den Übergang vom Vorwurf zur erneuten Bitte.
- source_word: הַגִּידָה נָּא לִי
  choice: sag mir bitte
  rationale: Der Imperativ mit נָא wird als eindringliche Bitte und nicht als schroffer Befehl wiedergegeben.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: womit du gefesselt werden kannst
  rationale: „Womit“ erhält den instrumentalen Sinn der Frage; die passive Form von אסר und die kontextuelle Möglichkeit werden mit „gefesselt werden kannst“ bewahrt.
theological_decisions: []
