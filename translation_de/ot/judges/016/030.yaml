  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: de
  text: 'Und Simson sagte[a]: »Ich will mit den Philistern sterben!« Dann beugte er sich mit aller Kraft, und das Haus[c] stürzte auf die Herrscher[b] und auf alle Menschen, die darin waren. So war die Zahl derer, die er bei seinem Tod tötete, größer als die Zahl derer, die er während seines Lebens getötet hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Meine Seele soll mit den Philistern sterben.« »Meine Seele« bezeichnet hier idiomatisch Simson selbst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Fürsten« oder »Herren«. Gemeint sind die führenden Männer der Philister.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Gebäude«. Im Hebräischen steht das gewöhnliche Wort für »Haus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: Ich will sterben
  rationale: Wörtlich etwa »Meine Seele/mein Leben sterbe«. נֶפֶשׁ bezeichnet hier idiomatisch Simson selbst; »Ich will sterben« gibt den Wunsch beziehungsweise Entschluss natürlich wieder, ohne eine vom Körper getrennte Seele vorauszusetzen.
- source_word: עִם פְּלִשְׁתִּים
  choice: mit den Philistern
  rationale: עִם bedeutet schlicht »mit« und bezeichnet hier das gemeinsame Sterben Simsons und seiner Feinde.
- source_word: וַיֵּט בְּכֹחַ
  choice: Dann stemmte er sich mit aller Kraft dagegen
  rationale: נטה kann »sich neigen, beugen, ausstrecken« bedeuten. Im Zusammenhang mit den Säulen gibt »sich dagegenstemmen« die körperliche Bewegung und Kraftanstrengung im Deutschen anschaulich wieder; »mit aller Kraft« entspricht dem kontextuellen Nachdruck von בְּכֹחַ.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: בַּיִת ist das gewöhnliche Wort für »Haus« und kann auch ein Gebäude bezeichnen. Die Übersetzung bleibt nahe am Hebräischen und vermeidet die interpretierende Festlegung auf »Tempel«.
- source_word: הַסְּרָנִים
  choice: die Fürsten
  rationale: סְרָנִים ist die besondere Bezeichnung für die führenden Herrscher der Philister. »Fürsten« ist im biblisch-historischen Kontext verständlich und weniger feudal missverständlich als »Herren«.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: alle Menschen, die darin waren
  rationale: הָעָם kann kollektiv »das Volk/die Leute« bedeuten. »Alle Menschen« gibt die Gesamtheit der im Gebäude Anwesenden natürlich wieder.
- source_word: הַמֵּתִים אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: die Zahl derer, die er bei seinem Tod tötete
  rationale: Die hebräische Formulierung spricht substantivisch von den Toten, die er in seinem Sterben tötete. Die deutsche Wiedergabe mit »die Zahl derer« macht den anschließenden Zahlenvergleich klar, ohne seinen Inhalt zu verändern.
- source_word: רַבִּים מֵאֲשֶׁר
  choice: größer als die Zahl derer
  rationale: Die Vergleichskonstruktion besagt, dass die Anzahl der bei seinem Tod Getöteten die Anzahl der zuvor Getöteten übertraf.
- source_word: בְּחַיָּיו
  choice: während seines Lebens
  rationale: Die temporale Wendung bildet einen klaren Gegensatz zu »bei seinem Tod«.
theological_decisions:
- issue: Simsons letzte Aussage, ohne eine Lehre über eine vom Körper getrennte Seele einzutragen
  choice: Ich will mit den Philistern sterben
  alternative: Meine Seele soll mit den Philistern sterben
  rationale: נֶפֶשׁ steht hier idiomatisch für die eigene Person beziehungsweise das eigene Leben. Die gewählte Formulierung bewahrt den Sinn und vermeidet eine metaphysische Festlegung, die der Vers nicht beabsichtigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählfluss, wird beim abschließenden Zahlenvergleich jedoch für natürliches und eindeutiges Deutsch leicht entfaltet. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
