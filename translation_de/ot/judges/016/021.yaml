base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: de
  text: Da packten ihn die Philister, stachen ihm die Augen aus, brachten ihn nach Gaza hinab und fesselten ihn mit bronzenen Fesseln. Und er mahlte im Gefängnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im Haus der Gefangenen«.'
    reason: Die Fußnote erhält die konkrete hebräische Bezeichnung des Gefängnisses, ohne die Tätigkeit oder die Art der Fesseln über den Text hinaus zu spezifizieren.
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: Da packten ihn
  rationale: אחז bezeichnet ein kräftiges Ergreifen. »packten« gibt die feindselige, gewaltsame Handlung natürlich und prägnant wieder.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Die im Deutschen übliche Bezeichnung des bekannten Volks.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: stachen ihm die Augen aus
  rationale: נקר bezeichnet hier die konkrete Verstümmelung der Augen; die Formulierung wahrt die Härte des hebräischen Ausdrucks, ohne sie auf das bloße Ergebnis »blendeten ihn« zu reduzieren.
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: brachten ihn nach Gaza hinab
  rationale: Der Hifil von ירד drückt ein Hinabbringen aus; das Richtungssuffix an עַזָּתָה wird mit »nach Gaza« wiedergegeben.
- source_word: וַיַּאַסְרוּהוּ
  choice: fesselten ihn
  rationale: אסר bedeutet binden oder fesseln. Die Übersetzung lässt die anschließende Gefangenschaft als eigenen Sachverhalt bestehen.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: mit bronzenen Fußfesseln
  rationale: Die Dualform bezeichnet ein Paar metallener Fesseln, wahrscheinlich für die Füße; »bronzen« entspricht dem üblichen Werkstoffsinn von נְחֹשֶׁת.
- source_word: וַיְהִי טוֹחֵן
  choice: musste er die Mühle drehen
  rationale: Das Partizip beschreibt eine andauernde Tätigkeit. Die idiomatische deutsche Wendung verdeutlicht die durch טחן bezeichnete Mühlarbeit und ihren im Kontext erzwungenen Charakter.
- source_word: בְּבֵית הָאֲסִירִים
  choice: im Gefängnis
  rationale: Wörtlich »im Haus der Gefangenen«; »im Gefängnis« ist die natürliche moderne deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die gewaltsame Blendung wird nicht euphemistisch abgeschwächt. »Die Mühle drehen« ist für heutige Leser verständlicher als das alleinstehende »mahlen«; die wörtlichere Form steht in der Fußnote.
