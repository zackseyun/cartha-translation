  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: de
  text: 'Da nahm Delila neue Stricke[a] und band ihn damit. Dann rief sie ihm zu: »Die Philister sind über dir, Simson!« Der Lauernde[b] aber saß im inneren Raum[c]. Doch er riss die Stricke von seinen Armen wie einen Faden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seile« bzw. »Schnüre«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Hinterhalt«. Im Hebräischen steht ein substantiviertes Partizip im Singular; es kann einen einzelnen verborgenen Beobachter oder den Hinterhalt kollektiv bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »in der Kammer« bzw. »im Zimmer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: Stricke
  rationale: Das Wort bezeichnet starke Bindeseile. »Stricke« ist im Deutschen natürlich, passt zum Fesseln und bildet einen klaren Gegensatz zum »Faden« am Versende.
- source_word: חֲדָשִׁים
  choice: neue
  rationale: Gibt den einfachen adjektivischen Sinn wieder und bewahrt die erzählerische Betonung ungebrauchter Bindemittel.
- source_word: וַתַּאַסְרֵהוּ
  choice: band ihn
  rationale: Entspricht dem Verb אסר direkt und wahrt einen würdevollen, zugleich allgemein verständlichen Erzählstil.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Die Philister sind über dir
  rationale: Bewahrt den wiederkehrenden, dringlichen Warnruf und die räumliche Bildlichkeit des hebräischen Ausdrucks, ohne ihn als bereits begonnenen Angriff auszudeuten.
- source_word: וְהָאֹרֵב
  choice: der Hinterhalt
  rationale: Das substantivierte Partizip steht im Singular und kann den Lauernden oder kollektiv den Hinterhalt bezeichnen. »Der Hinterhalt« ist idiomatisch und erhält die mögliche kollektive Funktion.
- source_word: יֹשֵׁב
  choice: saß
  rationale: Gibt die konkrete Bedeutung des Partizips wieder; das lauernde Warten ergibt sich aus dem Zusammenhang.
- source_word: בֶּחָדֶר
  choice: im inneren Zimmer
  rationale: חֶדֶר kann einen privaten, innen gelegenen Raum bezeichnen. Die Wiedergabe erklärt den Ort des verborgenen Hinterhalts, ohne unnötig zu präzisieren.
- source_word: וַיְנַתְּקֵם
  choice: riss die Stricke ... ab
  rationale: Das Verb bezeichnet gewaltsames Losreißen oder Zerreißen. Die deutsche Formulierung verbindet die Handlung natürlich mit der Ortsangabe an seinen Armen.
- source_word: מֵעַל זְרֹעֹתָיו
  choice: von seinen Armen
  rationale: Bewahrt die räumliche Aussage der hebräischen Präpositionen in natürlichem Deutsch.
- source_word: כַּחוּט
  choice: wie einen Faden
  rationale: Erhält das anschauliche Singularbild und betont, wie mühelos die starken Stricke zerrissen.
