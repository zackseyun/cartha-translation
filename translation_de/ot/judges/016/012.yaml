  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge, die neuen Bindestricke, den Warnruf, den im Raum befindlichen verborgenen Akteur und Simsons gewaltsames Losreißen insgesamt zuverlässig wieder. Bei הָאֹרֵב steht jedoch ein singularisches substantiviertes Partizip mit singularischem Prädikat. »Der Hinterhalt aber saß« ist im Deutschen semantisch und syntaktisch weniger präzise, da ein Hinterhalt keine sitzende Person ist.
  naturalness: Der Erzählton ist überwiegend modernes, verständliches Standarddeutsch. »Der Lauernde aber saß im inneren Raum« ist sowohl idiomatischer als auch näher am konkreten Bild des hebräischen Partizips. Der Warnruf »Die Philister sind über dir!« ist bewusst eng am idiomatischen hebräischen Alarmruf gehalten und im biblisch-erzählenden Register noch verständlich.
  terminology: »Delila«, »Simson«, »Philister«, »Stricke« und »Faden« sind angemessen. »Innerer Raum« wahrt die mögliche Bedeutung von חֶדֶר, ohne eine spezifische Raumfunktion festzulegen. Die Fußnote zu הָאֹרֵב erläutert weiterhin sachgerecht die mögliche kollektive Deutung.
