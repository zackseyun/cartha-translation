base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: de
  text: 'Dann befestigte sie es mit dem Webstift[a] und rief ihm zu: »Die Philister fallen über dich her, Simson!« Da erwachte er aus seinem Schlaf und riss den Webstift und das Gewebe[c] heraus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dem Pflock«. Das hebräische Wort kann einen Pflock oder einen Stift bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »riss … los«. Das hebräische Verb bezeichnet hier ein kräftiges Entfernen.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: den auf dem Webstuhl befindlichen gewebten Stoff; möglicherweise ist spezieller die Kette gemeint.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: befestigte
  rationale: תקע kann »hineintreiben«, »einschlagen« oder »befestigen« bedeuten. Da das Objekt im Hebräischen unausgesprochen bleibt und der genaue Mechanismus nicht beschrieben wird, gibt »befestigte« die Handlung natürlich wieder, ohne sie unnötig zu präzisieren.
- source_word: בַּיָּתֵד
  choice: mit dem Pflock
  rationale: יָתֵד bezeichnet einen Pflock oder Stift. Im Zusammenhang mit dem Weben ist ein Webstift denkbar; »Pflock« bewahrt jedoch die übliche Grundbedeutung und passt auch zur späteren Verbindung mit dem Webstuhl.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Die Philister sind über dir
  rationale: Die im Simsonbericht wiederkehrende Alarmformel wird nahe am hebräischen Idiom wiedergegeben. So bleiben Dringlichkeit und erzählerische Wiederholung erhalten.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: Da erwachte er aus seinem Schlaf
  rationale: Dies gibt Verb und Präpositionalfügung direkt und in einem würdigen deutschen Erzählstil wieder.
- source_word: וַיִּסַּע
  choice: riss … heraus
  rationale: נסע bezeichnet hier das gewaltsame Los- oder Herausreißen der am Haar befestigten Teile. »Riss … heraus« trifft die konkrete Bewegung besser als das sonst mögliche »aufbrechen/weiterziehen«.
- source_word: הַיְתַד הָאֶרֶג
  choice: den Pflock des Webstuhls
  rationale: Die Wortverbindung bezeichnet den zum Webvorgang beziehungsweise Webstuhl gehörenden Pflock. Die deutsche Fügung bleibt anschaulich und lehnt sich eng an die hebräische Konstruktion an.
- source_word: הַמַּסָּכֶת
  choice: das Gewebe
  rationale: מַסָּכֶת bezeichnet hier das auf dem Webstuhl befindliche gewebte Material. »Gewebe« ist verständlich und vermeidet die möglicherweise zu technische Festlegung auf die Kette.
