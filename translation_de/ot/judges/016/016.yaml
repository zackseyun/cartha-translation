id: JDG.16.16
reference: Judges 16:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ֠/יְהִי כִּֽי הֵצִ֨יקָה לּ֧/וֹ בִ/דְבָרֶ֛י/הָ כָּל הַ/יָּמִ֖ים וַ/תְּאַֽלֲצֵ֑/הוּ וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: de
  text: Und als sie ihn Tag für Tag mit ihren Worten bedrängte und ihm zusetzte, wurde er es bis zum Sterben leid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Seine Seele wurde kurz bis zum Sterben.« Die hebräische Wendung bezeichnet äußerste innere Bedrängnis, Ungeduld oder Erschöpfung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Und als
  rationale: Gibt den hebräischen Erzählübergang knapp und in natürlichem modernem Deutsch wieder; ein wörtlicheres »Und es geschah, als« wäre hier unnötig schwerfällig.
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: sie ihn mit ihren Worten bedrängte
  rationale: Bewahrt sowohl den durch Worte ausgeübten Druck als auch die konkrete Formulierung des Hebräischen.
- source_word: כָּל הַיָּמִים
  choice: Tag für Tag
  rationale: Drückt die fortgesetzte, wiederholte Bedrängung idiomatisch aus. »Alle Tage« wäre möglich, klingt im heutigen Deutsch jedoch weniger natürlich.
- source_word: וַתְּאַלֲצֵהוּ
  choice: und ihm zusetzte
  rationale: Gibt die verstärkende, hartnäckige Einwirkung wieder, ohne das bereits verwendete »bedrängte« zu wiederholen.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: wurde er es leid
  rationale: Überträgt die hebräische Wendung von der »kurz werdenden Seele« verständlich als äußerste innere Erschöpfung und Gereiztheit, ohne sie auf nur eine Gefühlsregung festzulegen.
- source_word: לָמוּת
  choice: bis zum Sterben
  rationale: Bewahrt die drastische Grenzangabe des Hebräischen und vermeidet die weitergehende Behauptung, Simson habe ausdrücklich sterben wollen.
theological_decisions:
- issue: Bedeutungsumfang der Wendung וַתִּקְצַר נַפְשׁוֹ לָמוּת
  choice: wurde er es bis zum Sterben leid
  alternative: seine Seele wurde kurz bis zum Sterben
  rationale: Die gewählte Fassung ist im Deutschen verständlich, während die Fußnote die Bildsprache und den offenen Bedeutungsumfang zwischen Qual, Ungeduld und Erschöpfung sichtbar hält. Eine ausdrückliche Todessehnsucht wird nicht in den Text hineingelesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Verben »bedrängte« und »zusetzte« bilden den zunehmenden Druck ab; »bis zum Sterben leid« erhält die drastische Zuspitzung, während die Fußnote die ungewöhnliche hebräische Bildsprache dokumentiert.
