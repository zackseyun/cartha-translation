lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: Da brachten … ihr
  rationale: Das Hifil von עלה bedeutet wörtlich „hinaufbringen“. Im Zusammenhang steht die Übergabe der verlangten Gegenstände im Vordergrund; „brachten … ihr“ gibt dies im Deutschen natürlich wieder, ohne eine im Zielkontext unklare Höhenbewegung zu erzwingen.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: die Fürsten der Philister
  rationale: סֶרֶן bezeichnet die führenden politischen Amtsträger der Philister. „Fürsten“ ist im deutschen Bibelregister verständlich und würdevoll; eine Fußnote weist auf den besonderen Amtstitel hin.
- source_word: שִׁבְעָה יְתָרִים
  choice: sieben Bogensehnen
  rationale: יֶתֶר kann eine Schnur oder Sehne, besonders eine Bogensehne, bezeichnen. Im unmittelbaren Erzählzusammenhang ist „Bogensehnen“ die wahrscheinlichste konkrete Bedeutung.
- source_word: לַחִים
  choice: frische
  rationale: Das Adjektiv bezeichnet hier noch feuchtes beziehungsweise nicht ausgetrocknetes Material. „Frisch“ ist eine natürliche deutsche Bezeichnung dafür und wird durch den folgenden Relativsatz präzisiert.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: die noch nicht getrocknet waren
  rationale: Die Form beschreibt den noch nicht eingetretenen trockenen Zustand. „Noch nicht getrocknet waren“ bewahrt diesen resultativen Sinn und klingt im modernen Deutsch natürlich.
- source_word: וַתַּאַסְרֵהוּ בָּהֶם
  choice: und sie band ihn damit
  rationale: אסר bedeutet „binden, fesseln“; בָּהֶם bezeichnet das Mittel. „Band ihn damit“ ist knapp, erzählerisch passend und gibt beides präzise wieder.
