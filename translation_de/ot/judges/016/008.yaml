  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: de
  text: Da brachten die Fürsten der Philister[a] ihr sieben frische Sehnen, die noch nicht getrocknet waren, und sie band ihn damit.
  philosophy: optimal-equivalence
  footnotes:
