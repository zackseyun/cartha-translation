  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: de
  text: 'Die Herrscher der Philister versammelten sich, um ihrem Gott Dagon ein großes Schlachtopfer darzubringen und zu feiern. Sie sagten: »Unser Gott hat unseren Feind Simson in unsere Hand gegeben[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»In unsere Hand gegeben« bedeutet: unserer Gewalt oder Kontrolle ausgeliefert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: Herrscher
  rationale: סֶרֶן bezeichnet die führenden Amtsträger der philistäischen Stadtstaaten. »Herrscher« ist gegenwärtig, verständlich und gibt ihren politischen Rang wieder.
- source_word: נֶאֱסְפוּ
  choice: versammelten sich
  rationale: Der Nifal von אסף bezeichnet hier das Zusammenkommen einer Gruppe.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: ein großes Schlachtopfer darzubringen
  rationale: Die Verbindung von Verb und stammverwandtem Substantiv bezeichnet eine große Opferhandlung. »Schlachtopfer darbringen« bewahrt den kultischen Sinn ohne unnatürliche Wortwiederholung.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: ihrem Gott Dagon
  rationale: Dagon ist der Empfänger des Opfers und wird als Gott der Philister bezeichnet. Die deutsche Wortstellung ist natürlich und eindeutig.
- source_word: וּלְשִׂמְחָה
  choice: und ein Freudenfest zu feiern
  rationale: שִׂמְחָה kann Freude wie auch eine festliche Feier bezeichnen; im Zusammenhang eines öffentlichen Siegesfestes trifft »Freudenfest feiern« den Zweck anschaulich.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: hat ... in unsere Hand gegeben
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen. Die Bildsprache bleibt im Haupttext erhalten und wird in der Fußnote erklärt.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
- source_word: אוֹיְבֵינוּ
  choice: unseren Feind
  rationale: Obwohl die Form äußerlich pluralisch ist, bezieht sie sich im Satz auf die einzelne Person Simson; der Singular entspricht dem Sinn.
theological_decisions:
- issue: Wiedergabe von אֱלֹהֵיהֶם / אֱלֹהֵינוּ im heidnischen Zusammenhang
  choice: Gott / Unser Gott
  alternative: Götter / Unsere Götter
  rationale: Beide Vorkommen beziehen sich im unmittelbaren Zusammenhang auf den ausdrücklich genannten Dagon. Der Singular folgt daher Syntax und Aussage, ohne eine Mehrzahl von Gottheiten in diesen Satz hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Schlachtopfer« wahrt den kultischen Charakter, »Freudenfest« verdeutlicht den festlichen Sinn. Die wörtliche hebräische Hand-Metapher bleibt aus Gründen der Bildtreue stehen und wird knapp erläutert.
