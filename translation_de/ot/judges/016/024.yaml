base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: de
  text: 'Als das Volk ihn sah, priesen sie ihren Gott, denn sie sagten: »Unser Gott hat unseren Feind in unsere Hand gegeben, den Verwüster unseres Landes und den, der die Zahl unserer Erschlagenen vermehrt hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: priesen sie
  rationale: Gibt das intensive Lob ihres Gottes natürlich und würdig wieder.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: hat ... in unsere Hand gegeben
  rationale: Bewahrt das hebräische Bild für Auslieferung und Sieg, das im Deutschen verständlich bleibt.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: den Verwüster unseres Landes
  rationale: Gibt das Partizip substantivisch und die gewaltsame Zerstörung prägnant wieder.
- source_word: הִרְבָּה אֶת חֲלָלֵינוּ
  choice: der so viele von uns erschlagen hat
  rationale: Natürliches Deutsch für die idiomatische Aussage, dass er die Zahl ihrer Erschlagenen vermehrte; vermeidet das unnatürliche »unsere Erschlagenen vermehrte«.
theological_decisions:
- issue: Bezeichnung des Philistergottes
  choice: ihren Gott / Unser Gott
  alternative: ihren Gott / unser Gott mit distanzierenden Anführungszeichen oder »Götzen«
  rationale: Das Hebräische verwendet אֱלֹהִים ohne abwertenden Zusatz. Die Übersetzung wahrt die Erzählperspektive und importiert keine polemische Deutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Wechsel vom kollektiven Singular »das Volk« zum sinngemäßen Plural »sie« entspricht natürlichem Deutsch; die direkte Rede bleibt knapp und feierlich.
