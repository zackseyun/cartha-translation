  terminology: „Simson“ und „Jahwe“ sind korrekt. „von ihm gewichen war“ gibt סר מעליו angemessen wieder und vermeidet jede dogmatische Einengung des göttlichen Rückzugs. Die Fußnote bewahrt die engere lexikalische Möglichkeit zu וְאִנָּעֵר.
