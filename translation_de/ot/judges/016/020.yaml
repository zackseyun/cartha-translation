base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: de
  text: 'Da sagte sie: »Die Philister fallen über dich her, Simson!« Er erwachte aus seinem Schlaf und sagte: »Ich werde hinausgehen wie zuvor und mich losschütteln[a].« Doch er wusste nicht, dass Jahwe von ihm gewichen war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mich schütteln«; der Ausdruck kann hier das Sich-Losschütteln oder -Befreien meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Die Philister sind über dir
  rationale: Die Wendung mit עַל und einem feindlichen Subjekt bezeichnet einen unmittelbar drohenden Angriff oder Zugriff. Die bildhafte Formulierung bleibt erhalten und ist im Zusammenhang verständlich.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: Er erwachte aus seinem Schlaf
  rationale: Dies gibt das Verb יקץ mit der Präpositionalphrase direkt, würdevoll und in modernem Standarddeutsch wieder.
- source_word: אֵצֵא
  choice: Ich werde hinausgehen
  rationale: יצא bedeutet hier schlicht »hinausgehen«. Dass Simson den Angreifern entgegentreten will, liegt nahe, wird aber nicht ausdrücklich ergänzt.
- source_word: כְּפַעַם בְּפַעַם
  choice: wie die Male zuvor
  rationale: Die idiomatische Wiederholung verweist auf mehrere frühere Gelegenheiten. Die deutsche Fassung bewahrt diesen wiederholten Rückbezug.
- source_word: וְאִנָּעֵר
  choice: und mich losschütteln
  rationale: Der Niphal von נער kann hier das Sich-Schütteln mit dem naheliegenden Sinn des Loskommens ausdrücken. »Losschütteln« bildet diese im Kontext wahrscheinliche Bedeutung knapp ab; die formal engere Möglichkeit wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: סָר מֵעָלָיו
  choice: von ihm gewichen war
  rationale: סור mit מֵעַל bezeichnet das Weichen oder Sich-Entfernen. Die Formulierung bewahrt den feierlichen Ernst der Aussage, ohne Art oder Dauer des göttlichen Rückzugs näher zu bestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Transliteration bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Art des göttlichen Rückzugs in סָר מֵעָלָיו
  choice: dass Jahwe von ihm gewichen war
  alternative: dass Jahwes stärkende Gegenwart ihn verlassen hatte
  rationale: Der Vers erklärt nicht, ob speziell die Befähigung, die Bundesgunst oder ein anderer Aspekt der göttlichen Gegenwart gemeint ist. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und lebendig. »Über dir« bewahrt das feindliche Bild des Hebräischen; »von ihm gewichen« erhält die feierliche, theologisch offene Aussage des Schlusses.
