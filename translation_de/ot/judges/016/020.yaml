  source_fidelity: 'Die wesentlichen Elemente des hebräischen Textes sind zutreffend wiedergegeben: die Warnung vor den Philistern, Simsons Erwachen, sein Vorsatz, hinauszugehen und sich zu lösen, sowie Jahwes Rückzug. Die Wiedergabe „Die Philister sind über dir“ bildet zwar die hebräische Bildlichkeit formal nach, ist im modernen Standarddeutsch jedoch missverständlich räumlich und vermittelt den feindlichen Zugriff nicht zuverlässig.'
