  source_fidelity: Die Übersetzung von הַנִּיחָה אוֹתִי als »Lass mich los« ist im Kontext des an der Hand gehaltenen Simson möglich. Das folgende וְהַמִישֵׁנִי bezieht sich jedoch auf das Ertasten/Berühren der Säulen, nicht auf ein Führen zu ihnen. Die vorliegende Fassung folgt hier der englischen Audit-Fassung, verfehlt aber den hebräischen Wortlaut.
  naturalness: Die Revision bleibt knapp, idiomatisch und erzählerisch in modernem Standarddeutsch. Die Wiederholung von »lass mich« bildet die zwei hebräischen Aufforderungen verständlich ab.
  terminology: »Säulen« ist passend für עַמּוּדִים. »Ertasten« gibt die einschlägige Bedeutung von משש präzise wieder. »auf denen das Haus ruht« ist eine natürliche Wiedergabe der Aussage, dass das Haus auf den Säulen gegründet/aufgestellt ist.
