base_translation:
  language: en
  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: de
  text: 'Da sagte Simson zu dem jungen Mann, der ihn an der Hand hielt: »Lass mich los und lass mich die Säulen ertasten, auf denen das Haus ruht, damit ich mich an sie lehnen kann.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּיחָה אוֹתִי
  choice: Lass mich los
  rationale: Die Wendung bedeutet hier, dass der junge Mann Simson freigeben bzw. nicht länger festhalten soll. Im Deutschen gibt »Lass mich los« dies im unmittelbaren Zusammenhang mit dem Halten an der Hand natürlich wieder.
- source_word: ו/הימש/ני
  choice: und führe mich zu
  rationale: Die überlieferte Form ist textlich bzw. morphologisch auffällig; der Kontext verlangt eine Bewegung oder Führung zu den Säulen. »Führe mich zu« bewahrt den situationsbezogenen Sinn, ohne ein Ertasten ausdrücklich in den Text einzutragen.
- source_word: הָעַמֻּדִים אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: die Säulen, auf denen das Haus steht
  rationale: נָכוֹן bezeichnet hier das feste Gegründet- oder Aufgestelltsein des Hauses auf den Säulen. Die Formulierung ist klar, würdig und nahe am Hebräischen.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: damit ich mich an sie lehnen kann
  rationale: Die Kohortativform drückt Simsons beabsichtigte Handlung aus; »damit« macht diesen Zweck im Deutschen natürlich deutlich.
