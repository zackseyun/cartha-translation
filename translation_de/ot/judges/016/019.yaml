base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: de
  text: Da ließ sie ihn auf ihren Knien[a] einschlafen. Dann rief sie einen Mann herbei[b] und schor die sieben Haarflechten[c] auf seinem Kopf ab. So begann sie, ihn zu bedrängen, und seine Kraft wich von ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ihrem Schoß“; wörtlich: „auf ihren Knien“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „rief nach einem Mann“ beziehungsweise „rief einen Mann“. Der hebräische Ausdruck kann das Herbeirufen eines Mannes für diese Aufgabe bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „die sieben Haarsträhnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: ließ sie ihn … einschlafen
  rationale: Der Hifil von ישׁן ist kausativ. Die Formulierung gibt wieder, dass Delila Simson zum Einschlafen brachte, ohne die Art und Weise näher festzulegen.
- source_word: עַל בִּרְכֶּיהָ
  choice: auf ihren Knien
  rationale: Dies entspricht dem konkreten hebräischen Ausdruck. Das idiomatischere „auf ihrem Schoß“ bleibt als Fußnotenalternative erhalten.
- source_word: וַתִּקְרָא לָאִישׁ
  choice: rief sie einen Mann herbei
  rationale: קרא mit ל kann hier das Herbeirufen beziehungsweise Rufen nach einem Mann bezeichnen. Der nicht determinierte Ausdruck אִישׁ wird als „einen Mann“ wiedergegeben.
- source_word: וַתְּגַלַּח
  choice: schor … ab
  rationale: Das Verb ist feminin Singular und führt Delila als grammatisches Subjekt fort, auch wenn der herbeigerufene Mann als Ausführender mitgedacht sein kann. „Abscheren“ passt zum Entfernen der Haare.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: die sieben Haarflechten auf seinem Kopf
  rationale: מַחְלְפוֹת kann Haarflechten oder Haarsträhnen bezeichnen. „Haarflechten“ ist anschaulich, ohne eine darüber hinausgehende Deutung einzuführen.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: So begann sie, ihn zu bezwingen
  rationale: ענה im Piel hat ein breites Bedeutungsspektrum wie bedrängen, demütigen oder bezwingen. Im Kontext bezeichnet es Delilas einsetzendes Vorgehen gegen Simson; „bezwingen“ bewahrt den Handlungszusammenhang, ohne eine bestimmte Methode festzulegen.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: seine Kraft wich von ihm
  rationale: Die hebräische Wendung bezeichnet das Verschwinden seiner Kraft. „Wich von ihm“ ist würdig, verständlich und bildet die räumliche Ausdrucksweise des Originals gut ab.
theological_decisions:
- issue: Ursprung und Wesen von Simsons verlorener Kraft
  choice: „seine Kraft wich von ihm“ ohne ausdrückliche Ergänzung eines Verweises auf den HERRN
  alternative: „die Kraft des HERRN verließ ihn“
  rationale: Der Vers selbst sagt lediglich, dass seine Kraft von ihm wich. Der weitere Zusammenhang verbindet sie mit Gottes Wirken und Simsons Nasiräerstatus, doch eine ausdrückliche Ergänzung würde diese Beziehung hier interpretierend in den Wortlaut eintragen.
- issue: Wer Simsons Haare abschnitt
  choice: Delila bleibt entsprechend der femininen Verbform das grammatische Subjekt
  alternative: „der Mann schor … ab“ oder „sie ließ … abscheren“
  rationale: Der masoretisch punktierte hebräische Text hat וַתְּגַלַּח in der femininen Singularform. Zugleich lässt das Herbeirufen eines Mannes eine mittelbare Ausführung denkbar erscheinen; diese Spannung wird nicht durch einen Subjektwechsel aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah am Hebräischen, wird aber durch „Dann“ und „So“ natürlich gegliedert. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
