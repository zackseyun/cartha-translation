  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: de
  text: 'Da offenbarte er ihr alles, was in seinem Herzen war[a], und sagte zu ihr: »Kein Schermesser hat je meinen Kopf berührt; denn ich bin von Mutterleib an ein Nasiräer Gottes[b]. Wenn man mir die Haare abschert, wird meine Kraft von mir weichen, und ich werde schwach und wie jeder andere Mann sein[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da erzählte er ihr alles, was ihm auf dem Herzen lag.«'
    reason: lexical_alternative
  - marker: b
    text: Ein Nasiräer war jemand, der Gott in besonderer Weise geweiht war. Zu dieser Weihe gehörte, dass kein Schermesser seinen Kopf berührte.
    reason: cultural_note
  - marker: c
    text: 'Oder: »wie irgendein anderer Mann«; wörtlich: »wie jeder Mann«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  choice: Da offenbarte er ihr sein ganzes Herz
  rationale: Die Formulierung bewahrt das hebräische Herzbild für vollständige Offenheit. „Offenbarte“ macht im modernen Deutschen deutlich, dass Simson ihr sein bisher verborgenes Geheimnis vollständig anvertraut.
- source_word: מוֹרָה
  choice: Schermesser
  rationale: Das Wort bezeichnet hier das zum Abscheren der Haare verwendete Messer. „Schermesser“ ist präziser als das heute leicht missverständliche allgemeine „Rasiermesser“.
- source_word: לֹא עָלָה עַל רֹאשִׁי
  choice: Noch nie ist ... an meinen Kopf gekommen
  rationale: Diese Wiedergabe erhält das Bild des hebräischen Ausdrucks und klingt zugleich verständlich; gemeint ist, dass sein Haar nie abgeschoren wurde.
- source_word: נְזִיר אֱלֹהִים
  choice: ein Nasiräer Gottes
  rationale: „Nasiräer“ bewahrt den technischen Begriff für einen Gott besonders Geweihten und die Verbindung zur Nasiräerordnung; „Gottes“ gibt die Genitivbeziehung wieder.
- source_word: מִבֶּטֶן אִמִּי
  choice: von Mutterleib an
  rationale: 'Die feste deutsche Wendung gibt die zeitliche Bedeutung knapp und natürlich wieder: Simsons Weihe besteht seit seiner Zeit im Mutterleib beziehungsweise von Geburt an.'
- source_word: אִם גֻּלַּחְתִּי
  choice: Wenn man mir die Haare abschert
  rationale: Die unpersönliche Form gibt das hebräische Passiv wieder und verdeutlicht im Deutschen den aus dem Zusammenhang erschlossenen Gegenstand des Scherens, ohne anzudeuten, Simson schere sich selbst.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: wird meine Kraft von mir weichen
  rationale: „Von mir weichen“ bildet die Bewegungsmetapher des hebräischen Verbs ab und ist in würdigem modernem Deutsch verständlich.
- source_word: וְחָלִיתִי
  choice: ich werde schwach
  rationale: Im Zusammenhang bezeichnet das Verb den Verlust von Kraft, nicht eine Erkrankung.
- source_word: כְּכָל הָאָדָם
  choice: wie jeder andere Mann
  rationale: Die idiomatische Wiedergabe macht den Vergleich mit gewöhnlichen Männern deutlich. „Andere“ ist kontextuell ergänzt, um im Deutschen den Gegensatz zu Simsons außergewöhnlicher Kraft natürlich auszudrücken.
theological_decisions:
- issue: Wiedergabe von נְזִיר in Simsons Selbstbeschreibung
  choice: Nasiräer Gottes
  alternative: ein Gott Geweihter
  rationale: Der Fachbegriff wahrt die Verbindung zu Simsons Berufung und zur Nasiräerordnung, ohne die besondere Form seiner Weihe durch eine allgemeine Umschreibung einzuebnen.
- issue: Bezug zwischen der Nasiräerweihe, dem ungeschorenen Haar und Simsons Kraft
  choice: Die Aussagen werden nebeneinandergestellt, ohne die Kraft ausdrücklich als magische Eigenschaft des Haares zu erklären.
  alternative: Meine Kraft steckt in meinen Haaren.
  rationale: Der hebräische Text sagt, dass seine Kraft nach dem Scheren weichen wird, erklärt aber nicht ausdrücklich, das Haar selbst sei die Quelle der Kraft. Diese Spannung bleibt erhalten.
- issue: Wiedergabe von הָאָדָם im Schlussvergleich
  choice: Mann
  alternative: Mensch
  rationale: Im konkreten Erzählzusammenhang vergleicht der männliche Sprecher sich mit anderen gewöhnlichen Männern. Die Wiedergabe bleibt geschlechtsgenau und macht daraus keine Aussage über die Menschheit als Abstraktum.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Bildsprache. Der technische Ausdruck „Nasiräer“ bleibt stehen und wird in einer Fußnote knapp erläutert. Direkte Rede wird mit deutschen Anführungszeichen gesetzt; unnötige Archaismen werden vermieden.
