  terminology: „Nasiräer Gottes“ bewahrt den technischen Begriff נְזִיר und die ausdrücklich genannte Gottesbeziehung. „Von Mutterleib an“, „Kraft wird von mir weichen“ und „wie jeder andere Mann“ sind im Kontext angemessen. Die Fußnote zur Nasiräerbezeichnung wird knapp und sachlich formuliert.
