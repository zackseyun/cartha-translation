  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen des Hebräischen zutreffend wieder: vollständige Preisgabe des Geheimnisses, das nie benutzte Schermesser, die Nasiräerweihe seit dem Mutterleib, das passive Geschorenwerden sowie der anschließende Kraftverlust. Die Formulierung „an meinen Kopf gekommen“ ist jedoch im Deutschen keine natürliche Entsprechung für das hebräische Bild und die Fußnote zu „ganzes Herz“ bezeichnet eine nicht wörtliche Formulierung fälschlich als wörtlich.'
