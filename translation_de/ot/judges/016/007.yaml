  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: de
  text: 'Und Simson sagte zu ihr: „Wenn man mich mit sieben frischen Bogensehnen bindet, die noch nicht getrocknet sind, dann werde ich schwach und wie jeder andere Mensch sein.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: Und Simson sagte zu ihr
  rationale: Das narrative Wayyiqtol wird mit „Und“ wiedergegeben; die deutsche Wortstellung ist natürlich und bewahrt den Erzählfluss.
- source_word: יַאַסְרֻנִי
  choice: man mich ... bindet
  rationale: Die dritte Person Plural hat hier unbestimmte Bedeutung. Das deutsche „man“ gibt diesen Sinn idiomatisch wieder, ohne ein bestimmtes Subjekt einzuführen.
- source_word: בְּשִׁבְעָה יְתָרִים לַחִים
  choice: mit sieben frischen Bogensehnen
  rationale: „Mit“ gibt das instrumentale ב wieder. יְתָרִים bezeichnet im Zusammenhang Bogensehnen; לַחִים meint frisch beziehungsweise noch feucht.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: die noch nicht getrocknet sind
  rationale: Die Form bezeichnet einen bislang nicht eingetretenen Trocknungszustand; „noch nicht“ macht den zeitlichen Gegensatz im Deutschen klar.
- source_word: וְחָלִיתִי
  choice: dann werde ich schwach
  rationale: חלה bezeichnet hier nicht Krankheit, sondern den Verlust von Kraft. „werde ... schwach“ wahrt den resultativen Sinn.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: und bin wie jeder andere Mensch
  rationale: Die hebräische Vergleichsformel meint im Kontext einen gewöhnlichen Menschen ohne Simsons außergewöhnliche Kraft. Diese Wiedergabe ist im modernen Deutsch natürlich und wahrt den generisch-menschlichen Sinn von אָדָם.
theological_decisions:
- issue: Vergleichsformel כְּאַחַד הָאָדָם
  choice: wie jeder andere Mensch
  alternative: wie einer der Menschen / wie jeder andere Mann
  rationale: אָדָם kann hier kollektiv beziehungsweise generisch „Menschheit/Menschen“ bezeichnen. Der Kontext betrifft zwar Simsons körperliche Stärke, doch der hebräische Ausdruck legt nicht zwingend eine ausschließlich männliche Vergleichsgruppe fest. „Jeder andere Mensch“ gibt die idiomatische Bedeutung wieder, ohne die Aussage dogmatisch einzuengen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; „Bogensehnen“ ist sachlich präzise, und die unbestimmte Handlung wird idiomatisch mit „man“ ausgedrückt.
