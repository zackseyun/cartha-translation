base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: de
  text: 'Als sie in guter Stimmung waren, sagten sie: »Ruft Simson, damit er uns belustigt!«[a] Da holten sie Simson aus dem Gefängnis[b], und er trat vor ihnen zu ihrer Belustigung auf. Sie stellten ihn zwischen die Säulen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann auch bedeuten: »damit er für uns auftritt« oder »damit er uns zum Gespött dient«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »aus dem Haus der Gefangenen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: als sie guter Stimmung waren
  rationale: Die Wendung spricht wörtlich davon, dass ihr Herz »gut« war, und bezeichnet eine heitere, ausgelassene Stimmung. Die deutsche idiomatische Wiedergabe wahrt den Sinn, ohne unnatürlich zu klingen.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: Ruft Simson
  rationale: קרא mit ל bezeichnet hier das Herbeirufen einer Person. Der knappe Imperativ passt zur Befehlssituation.
- source_word: וִישַׂחֶק לָנוּ
  choice: damit er uns belustigt
  rationale: שׂחק kann hier Unterhaltung, Vorführung und das Zum-Gespött-Machen umfassen. »belustigt« bewahrt diese Spannweite besser als eine ausschließlich harmlose Formulierung.
- source_word: מִבֵּית הָאֲסִירִים
  choice: aus dem Gefängnis
  rationale: Wörtlich steht »aus dem Haus der Gefangenen«. »Gefängnis« ist die natürliche moderne deutsche Bezeichnung für denselben Ort.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: und er musste vor ihnen zur Belustigung auftreten
  rationale: Die Formulierung macht sowohl das öffentliche Auftreten »vor ihnen« als auch Simsons erzwungene Rolle als Gegenstand ihrer Unterhaltung deutlich, ohne die genaue Art der Darbietung festzulegen.
- source_word: וַיַּעֲמִידוּ אוֹתוֹ בֵּין הָעַמּוּדִים
  choice: Dann stellten sie ihn zwischen die Säulen
  rationale: 'Der Hifil von עמד hat kausative Bedeutung: Sie brachten ihn dazu beziehungsweise positionierten ihn so, dass er zwischen den Säulen stand.'
theological_decisions: []
