  to: 'Als sie in guter Stimmung waren, sagten sie: »Ruft Simson, damit er uns belustigt!«[a] Da holten sie Simson aus dem Gefängnis[b], und er trat vor ihnen zu ihrer Belustigung auf. Sie stellten ihn zwischen die Säulen.'
  rationale: Die einleitende Zeitangabe wurde idiomatisch geglättet. Die ausdrückliche, im Wortlaut nicht markierte Modalität „musste“ wurde entfernt und die öffentliche Vorführung zugleich durch „vor ihnen ... auf“ beibehalten. Die Fußnote zu שׂחק wurde so formuliert, dass sie die Bedeutungsspanne erklärt, ohne eine bestimmte Art der Darbietung oder Misshandlung festzulegen.
