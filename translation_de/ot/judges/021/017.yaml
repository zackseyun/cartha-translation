  text: וַ/יֹּ֣אמְר֔וּ יְרֻשַּׁ֥ת פְּלֵיטָ֖ה לְ/בִנְיָמִ֑ן וְ/לֹֽא יִמָּחֶ֥ה שֵׁ֖בֶט מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: de
  text: 'Da sagten sie: „Für die Überlebenden Benjamins muss es Erbbesitz geben[a], damit kein Stamm aus Israel ausgelöscht wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Überrest für Benjamin [muss bleiben]“ oder: „Erbbesitz für die Überlebenden Benjamins“. Im Hebräischen stehen „Erbbesitz/Erbteil“ und „Überrest/Überlebende“ knapp nebeneinander; ihr genaues Verhältnis kann unterschiedlich verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Die Wayyiqtol-Form führt die Rede im fortlaufenden Erzählzusammenhang ein; „Da sagten sie“ ist im Deutschen natürlich und wahrt den narrativen Anschluss.
- source_word: יְרֻשַּׁת
  choice: Erbbesitz
  rationale: Das Substantiv bezeichnet erblichen Besitz beziehungsweise einen erblich zugewiesenen Anteil. „Erbbesitz“ passt hier zur Fortdauer des Stammes und seines Landanteils.
- source_word: פְּלֵיטָה
  choice: die Überlebenden
  rationale: Das Wort bezeichnet Entronnene beziehungsweise Überlebende. Im Kontext sind die nach der beinahe vollständigen Vernichtung verbliebenen Benjaminiter gemeint; „Überlebende“ ist klar und gegenwärtig.
- source_word: לְבִנְיָמִן
  choice: Benjamins
  rationale: 'Die Zugehörigkeit zu Benjamin wird idiomatisch als Genitiv ausgedrückt: „die Überlebenden Benjamins“. Die kompakte hebräische Nominalfügung bleibt jedoch mehrdeutig, was die Fußnote vermerkt.'
- source_word: וְלֹא יִמָּחֶה
  choice: damit ... nicht ausgelöscht wird
  rationale: Das Nifal von מחה bezeichnet das Auslöschen oder Tilgen. Der Kontext legt einen finalen Zusammenhang nahe, der im Deutschen mit „damit“ natürlich wiedergegeben wird.
- source_word: שֵׁבֶט
  choice: kein Stamm
  rationale: In Verbindung mit der Verneinung ist „kein Stamm“ im Deutschen die natürliche Entsprechung und bezeichnet einen der Stämme Israels.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: 'Die Präposition מן hat hier trennende Bedeutung: Der Stamm soll nicht aus der Gesamtheit Israels verschwinden.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe verblosen Nominalfügung des Hebräischen wird für verständliches Deutsch mit „muss es ... geben“ ergänzt; die echte syntaktische Mehrdeutigkeit wird in der Fußnote bewahrt.
