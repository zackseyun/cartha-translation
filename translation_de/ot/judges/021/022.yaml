base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: de
  text: 'Und wenn ihre Väter oder Brüder kommen, um mit uns zu streiten[a], werden wir zu ihnen sagen: »Gewährt sie uns als Gunst[b]! Denn wir haben im Krieg nicht für jeden Mann eine Frau genommen[c]. Ihr habt sie ihnen nicht selbst gegeben; sonst würdet ihr euch jetzt schuldig machen[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um sich bei uns zu beschweren“ beziehungsweise „um gegen uns einen Rechtsstreit zu führen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Seid uns ihretwegen gnädig.“ Die knappe hebräische Formulierung kann als Bitte verstanden werden, den Benjaminitern die Frauen ausnahmsweise zu überlassen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Denn wir haben im Krieg nicht für jeden Mann seine Frau genommen.“ Die Formulierung ist knapp; im Zusammenhang ist wahrscheinlich gemeint, dass im Kriegszug nicht für jeden Mann aus Benjamin eine Frau genommen worden war.'
    reason: cultural_note
  - marker: d
    text: 'Der hebräische Schlusssatz ist schwierig und sehr knapp. Er wird häufig als unausgesprochene Folgerung verstanden: Weil die Familien die Frauen nicht förmlich zur Ehe gegeben hatten, würden sie sich nicht schuldig machen; im Zusammenhang steht dies mit dem Eid Israels.'
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: לָרִיב
  choice: um mit uns zu streiten
  rationale: Das Qere לָרִיב bezeichnet das Austragen eines Streits oder einer Beschwerde. „Mit uns zu streiten“ bewahrt den gegnerischen Sinn, ohne vorschnell ein förmliches Gerichtsverfahren vorauszusetzen.
- source_word: חָנּוּנוּ אוֹתָם
  choice: Gewährt sie uns als Gunst
  rationale: חנן bedeutet „Gunst erweisen, gnädig sein“. Mit dem nachfolgenden weiblichen Objekt „sie“ ist hier sinngemäß die Bitte gemeint, die Frauen den Benjaminitern zu überlassen; die ungewöhnliche hebräische Fügung bleibt in einer Fußnote sichtbar.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: wir haben im Krieg nicht für jeden Mann eine Frau erbeutet
  rationale: Die knappe Wendung bedeutet im Zusammenhang wahrscheinlich, dass im vorausgegangenen Kriegszug nicht genug Frauen gewonnen wurden, um jedem Benjaminiter eine Frau zu geben. „Erbeutet“ macht die gewaltsame Gewinnung im Krieg deutlich.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: Ihr habt sie ihnen ja nicht selbst gegeben
  rationale: Das betonte אַתֶּם stellt heraus, dass die Familien die Frauen nicht eigenhändig zur Ehe gegeben haben. Dadurch wird erklärt, weshalb ihr Eid nach der Argumentation der Sprecher nicht verletzt wurde.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: sonst würdet ihr euch jetzt schuldig machen
  rationale: 'Die schwierige Schlusswendung verbindet die gegenwärtige Zeitangabe mit dem Eintritt von Schuld. Im Kontext liegt eine nicht eingetretene Folge nahe: Hätten die Angehörigen die Frauen gegeben, wären sie nun schuldig.'
theological_decisions:
- issue: Schuld aufgrund des Eides Israels
  choice: 'Die Aussage wird als Argument der Ältesten wiedergegeben: Weil die Angehörigen die Frauen nicht selbst gaben, sollen sie durch den Eid nicht schuldig geworden sein.'
  alternative: 'Die Schlussworte könnten unmittelbarer lauten: „Jetzt würdet ihr schuldig werden.“'
  rationale: Der Vers berichtet eine menschliche Begründung innerhalb der Erzählung; die Übersetzung bestätigt weder ihre moralische noch ihre theologische Richtigkeit als Urteil des Erzählers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und erzählerisch natürlich. „Als Gunst“ bewahrt den Gedanken von חנן; „erbeutet“ benennt den kriegerischen Kontext ohne das Vorgehen moralisch zu beschönigen. Die Fußnoten erhalten die Mehrdeutigkeit der schwierigen hebräischen Wendungen.
