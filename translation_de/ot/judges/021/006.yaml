  text: וַ/יִּנָּֽחֲמוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל בִּנְיָמִ֖ן אָחִ֑י/ו וַ/יֹּ֣אמְר֔וּ נִגְדַּ֥ע הַ/יּ֛וֹם שֵׁ֥בֶט אֶחָ֖ד מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: de
  text: 'Da trauerten die Israeliten um ihren Bruder Benjamin[a] und sagten: »Heute ist ein Stamm von Israel abgeschnitten worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hatten Mitleid mit ihrem Bruder Benjamin« oder: »empfanden Bedauern wegen ihres Bruders Benjamin«. Das hebräische Verb kann je nach Zusammenhang Trauer, Mitleid oder ein Bereuen beziehungsweise Einlenken ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: trauerten
  rationale: Der Nifal von נחם bezeichnet hier angesichts des beinahe vernichteten Stammes tiefen Schmerz; »trauerten« gibt diesen Sinn natürlich wieder, ohne die ebenfalls mögliche Nuance des Mitleids oder Bedauerns auszuschließen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische moderne Wiedergabe ist verständlicher als das im Deutschen steife »die Söhne Israels«; der familiäre Zusammenhang bleibt durch »ihren Bruder Benjamin« erhalten.
- source_word: אֶל
  choice: um
  rationale: In Verbindung mit »trauerten« bezeichnet die Präposition die Person, der die Trauer gilt.
- source_word: בִּנְיָמִן אָחִיו
  choice: ihren Bruder Benjamin
  rationale: Das singularische Suffix bei »Bruder« ist kollektiv auf die Israeliten bezogen und stellt Benjamin als ihren Bruderstamm dar.
- source_word: נִגְדַּע
  choice: ist … abgeschnitten worden
  rationale: Die Wiedergabe bewahrt das Bild von גדע, dem Abhauen oder Abschneiden, und deutet die Aussage nicht vorschnell als vollständige Vernichtung.
- source_word: הַיּוֹם
  choice: Heute
  rationale: Natürliche moderne Entsprechung mit derselben zeitlichen Unmittelbarkeit.
- source_word: שֵׁבֶט אֶחָד
  choice: ein Stamm
  rationale: Direkte und idiomatische Bezeichnung einer der Stammesgruppen Israels.
- source_word: מִיִּשְׂרָאֵל
  choice: von Israel
  rationale: Die Präposition bezeichnet hier die Abtrennung vom Gesamtvolk; mit »abgeschnitten« ist »von Israel« im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Israeliten« vermeidet eine unnötig steife Hebraismenwiedergabe; »abgeschnitten« bewahrt dagegen bewusst das eindringliche Bild des Ausgangstextes.
