source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: de
  text: 'Und sie sagten: »Warum, Jahwe, Gott Israels, ist das in Israel geschehen, dass Israel heute ein Stamm fehlt?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Genauer: »dass heute aus Israel ein Stamm fehlt«.'
    reason: Die hebräische Präposition מִן bezeichnet das Fehlen eines Stammes aus dem Gesamtverband Israels; die Dativkonstruktion »Israel fehlt ein Stamm« ist im Deutschen natürlicher.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Und sie sagten
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung fort; »Und sie sagten« gibt diesen Anschluss schlicht wieder.
- source_word: לָמָה
  choice: Warum
  rationale: Die direkte Frage drückt hier Klage und Unverständnis aus; »Warum« ist die natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als Eigenname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Die Status-constructus-Verbindung bezeichnet Jahwe als den Gott Israels; die traditionelle deutsche Wendung ist klar und prägnant.
- source_word: הָיְתָה זֹּאת
  choice: ist das geschehen
  rationale: Wörtlich steht »ist das gewesen«; in diesem Zusammenhang bezeichnet die hebräische Wendung jedoch idiomatisch ein Geschehen.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition bezeichnet hier den Bereich beziehungsweise die Gemeinschaft, in der das Geschehen eingetreten ist.
- source_word: לְהִפָּקֵד
  choice: fehlt
  rationale: Der Niphal-Infinitiv von פקד beschreibt hier das Nichtvorhandensein eines Stammes. Das deutsche »fehlen« gibt diesen Zustand natürlich wieder.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die Übersetzung bewahrt die zeitliche Hervorhebung des hebräischen Ausdrucks.
- source_word: מִיִּשְׂרָאֵל שֵׁבֶט אֶחָד
  choice: Israel heute ein Stamm fehlt
  rationale: Das hebräische מן markiert das Fehlen aus dem Gesamtverband. Die deutsche Dativkonstruktion drückt idiomatisch aus, dass dem Volk nun ein Stamm fehlt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname. »Jahwe« bewahrt ihn als Namen, während »der HERR« ihn durch einen Titel ersetzen würde.
- issue: Beziehung des Schlusssatzes zum vorausgehenden Geschehen
  choice: sodass
  alternative: dass
  rationale: 'Die ל-Konstruktion beschreibt hier am ehesten die eingetretene Folge: Israel fehlt nun ein Stamm. »Sodass« macht diesen Zusammenhang deutlich, ohne die Klage als göttliche Absicht auszulegen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der klagende Fragesatz bleiben erhalten; die hebräische Wiederholung von »Israel« wird nicht unnötig geglättet.
