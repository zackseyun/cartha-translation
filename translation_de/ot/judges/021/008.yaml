  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: de
  text: 'Da sagten sie: »Welcher der Stämme Israels ist nicht zu Jahwe nach Mizpa hinaufgezogen?« Und tatsächlich: Aus Jabesch-Gilead war kein einziger Mann ins Lager, zur Versammlung, gekommen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Frage kann auch verstanden werden: »Welcher der Stämme Israels ist nicht vor Jahwe in Mizpa erschienen?« Gemeint ist dann das Erscheinen vor Jahwe am Versammlungsort.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Der deutsche Erzählanschluss gibt den fortschreitenden wayyiqtol-Stil natürlich wieder.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: Wer von den Stämmen Israels
  rationale: Die Wendung fragt nach der einen fehlenden Gruppe aus der Gesamtheit der israelitischen Stämme; im Deutschen ist „Wer von …“ idiomatisch, ohne den Singularfokus unnötig zu erklären.
- source_word: לֹא עָלָה אֶל יְהוָה הַמִּצְפָּה
  choice: ist nicht zu Jahwe nach Mizpa hinaufgezogen
  rationale: „Hinaufziehen“ bewahrt die Bewegungsnuance von עלה. Die zwei Zielbezüge werden im Deutschen mit „zu Jahwe“ und „nach Mizpa“ klar unterschieden; die mögliche kultische Bedeutung des Kommens vor Jahwe wird in der Fußnote offengehalten.
- source_word: וְהִנֵּה
  choice: Und tatsächlich
  rationale: Die Formulierung signalisiert die überraschende beziehungsweise bestätigende Feststellung von הִנֵּה in natürlichem modernem Deutsch.
- source_word: לֹא בָא אִישׁ
  choice: war kein einziger Mann … gekommen
  rationale: „Kein einziger Mann“ erhält die emphatische distributive Aussage der negierten Singularform אִישׁ.
- source_word: מִיָּבֵשׁ גִּלְעָד
  choice: Aus Jabesch-Gilead
  rationale: Die Präposition מן bezeichnet die Herkunft; der Ortsname wird in geläufiger deutscher Form wiedergegeben.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: ins Lager, zur Versammlung
  rationale: Beide mit אֶל eingeleiteten Angaben bleiben erhalten. Die appositionale Beziehung wird nicht zu einer eindeutigen Gleichsetzung geglättet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֶל יְהוָה im Zusammenhang der Versammlung
  choice: zu Jahwe
  alternative: vor Jahwe
  rationale: Die Hauptübersetzung folgt der gewöhnlichen Richtungsbedeutung von אֶל. Da die Wendung zugleich das Erscheinen vor Jahwe am Versammlungsort bezeichnen kann, wird diese sachlich naheliegende Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und tatsächlich“ vermittelt die Diskursfunktion von וְהִנֵּה natürlicher als das heute altertümliche „siehe“. Die betonte Aussage „kein einziger Mann“ bleibt im Haupttext erhalten; deshalb ist dafür keine eigene Fußnote nötig.
