  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: de
  text: Da sandte die ganze Gemeinde eine Botschaft an die Söhne Benjamins, die sich am Felsen Rimmon aufhielten, sprach zu ihnen und bot ihnen Frieden an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: sandte … Boten
  rationale: Das Verb bedeutet schlicht „senden“. Da unmittelbar das Reden mit Benjamin folgt, sind entsandte Überbringer vorausgesetzt; „Boten“ macht den deutschen Satz natürlich, ohne den Inhalt der Botschaft vorwegzunehmen.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels; „Gemeinde“ bewahrt den gemeinschaftlichen Sinn, und „ganze“ gibt כָּל wieder.
- source_word: וַיְדַבְּרוּ אֶל
  choice: ließ … reden mit
  rationale: Die Konstruktion bedeutet „zu jemandem reden“. In Verbindung mit dem vorausgehenden „sandte“ gibt die kausative deutsche Form natürlich wieder, dass die Gemeinde durch die Entsandten mit Benjamin sprach.
- source_word: בְּנֵי בִנְיָמִן
  choice: die Nachkommen Benjamins
  rationale: Wörtlich steht „Söhne Benjamins“. „Nachkommen Benjamins“ bewahrt die genealogisch-stammesbezogene Ausdrucksweise und ist im modernen Deutschen verständlich, ohne nur die unmittelbar männlichen Kinder zu bezeichnen.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: die sich am Felsen Rimmon aufhielten
  rationale: סֶלַע bedeutet „Fels/Felsen“. Die Formulierung kann als beschreibende Ortsangabe oder als fester Ortsname verstanden werden; im Haupttext steht die transparente beschreibende Wiedergabe.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: bot ihnen Frieden an
  rationale: Die Wendung bezeichnet im Kontext die förmliche Erklärung beziehungsweise das Angebot friedlicher Beziehungen. „Bot ihnen Frieden an“ ist natürliches Deutsch und lässt den versöhnenden Vorgang erkennen.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: Hier geht es um die Wiederherstellung friedlicher Beziehungen, nicht bloß um persönliches Wohlergehen.
