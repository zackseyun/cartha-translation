revisions:
- from: Da sandte die ganze Gemeinde Boten und ließ mit den Nachkommen Benjamins reden, die sich am Felsen Rimmon[a] aufhielten, und bot ihnen Frieden an.
  to: Da sandte die ganze Gemeinde eine Botschaft an die Söhne Benjamins, die sich am Felsen Rimmon aufhielten, sprach zu ihnen und bot ihnen Frieden an.
  rationale: Die Revision entfernt die nicht ausdrücklich genannten „Boten“ und die kausative Umschreibung, stellt die drei hebräischen Handlungen als gemeinschaftliches Handeln der Gemeinde dar und verwendet für בני בנימן die quellentreue Bezeichnung „Söhne Benjamins“. Die Ortsnamenambiguität bleibt durch die angepasste Fußnote erhalten.
