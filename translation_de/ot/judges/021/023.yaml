  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: de
  text: 'Die Männer von Benjamin machten es so: Sie nahmen sich entsprechend ihrer Zahl Frauen von den Tänzerinnen, die sie geraubt hatten.[a] Dann zogen sie fort und kehrten in ihr Erbgebiet zurück. Sie bauten die Städte wieder auf[b] und wohnten in ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sie gewaltsam fortgerissen“ beziehungsweise „verschleppt hatten“. Das hebräische Verb bezeichnet ein gewaltsames Wegnehmen oder Rauben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie bauten die Städte“. Der Zusammenhang zeigt, dass die zuvor zerstörten Städte wiederaufgebaut wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: machten es so
  rationale: Gibt die hebräische Erzählformel knapp und in natürlichem modernem Deutsch wieder und verweist auf den zuvor beschriebenen Plan.
- source_word: בְּנֵי בִנְיָמִן
  choice: die Männer von Benjamin
  rationale: Im Zusammenhang sind die männlichen Angehörigen des Stammes gemeint. Die Formulierung bewahrt den Stammesbezug, ohne das im Deutschen missverständliche „Söhne Benjamins“ zu verwenden.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: sie nahmen sich … Frauen
  rationale: Bewahrt die hebräische Wendung und ihren sozialen Vorgang deutlicher als das glättende „sie heirateten“; der folgende Relativsatz macht den Zwang unmissverständlich.
- source_word: לְמִסְפָּרָם
  choice: entsprechend ihrer Zahl
  rationale: Drückt aus, dass die Zahl der genommenen Frauen der Zahl der noch unverheirateten Männer entsprach.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: von den Tänzerinnen
  rationale: Das hebräische Partizip steht im Femininum Plural und bezeichnet ausdrücklich die tanzenden Frauen.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: die sie geraubt hatten
  rationale: גזל bezeichnet gewaltsames Wegnehmen oder Rauben. „Geraubt“ erhält die harte, moralisch belastete Aussage des Ausgangstextes und beschönigt das Geschehen nicht.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: Dann zogen sie fort und kehrten … zurück
  rationale: 'Gibt beide hebräischen Verben wieder: den Aufbruch vom Fest und die Rückkehr in das eigene Stammesgebiet.'
- source_word: אֶל נַחֲלָתָם
  choice: in ihr Erbgebiet
  rationale: Verbindet die Bedeutung eines zugeteilten Landbesitzes mit einer im Deutschen verständlichen Gebietsbezeichnung und bewahrt so den erb- und stammesrechtlichen Klang von נַחֲלָה.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: Sie bauten die Städte wieder auf
  rationale: Das Verb bedeutet wörtlich „bauen“; der vorausgehende Bericht über die Zerstörung der benjaminitischen Städte zeigt jedoch, dass hier ihr Wiederaufbau gemeint ist.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: und wohnten darin
  rationale: Eine natürliche, genaue Wiedergabe des Wohnens beziehungsweise Sich-Niederlassens in den Städten.
theological_decisions:
- issue: Moralische Aussagekraft von גָּזָלוּ
  choice: „die sie geraubt hatten“
  alternative: „die sie mitgenommen hatten“ oder „die sie fortgeführt hatten“
  rationale: Die Erzählung berichtet die Handlung, ohne dass die Übersetzung sie billigen oder verharmlosen darf. Das gewaltsame Moment des hebräischen Verbs bleibt daher ausdrücklich erhalten.
- issue: Wiedergabe von נַחֲלָה im Stammeslandkontext
  choice: „Erbgebiet“
  alternative: „Erbbesitz“, „Landanteil“ oder „Gebiet“
  rationale: „Erbgebiet“ bewahrt sowohl den Gedanken des zugeteilten Erbbesitzes als auch den territorialen Sinn, ohne eine weitergehende theologische Deutung einzutragen.
- issue: Explizierung des Wiederaufbaus
  choice: „bauten die Städte wieder auf“
  alternative: 'Wörtlich: „bauten die Städte“'
  rationale: Der Kontext berichtet zuvor von der Zerstörung der Städte Benjamins. „Wieder aufbauen“ macht diesen sachlich vorausgesetzten Bezug verständlich, während eine Fußnote die wörtliche Form offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die gewaltsame Wegnahme der Frauen wird nicht durch eine neutrale Heiratsformel abgeschwächt. „Männer von Benjamin“ vermeidet die im heutigen Deutsch leicht genealogisch verstandene Form „Söhne Benjamins“, bezeichnet aber weiterhin präzise die handelnden männlichen Stammesangehörigen.
