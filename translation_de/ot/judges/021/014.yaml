  text: וַ/יָּ֤שָׁב בִּנְיָמִן֙ בָּ/עֵ֣ת הַ/הִ֔יא וַ/יִּתְּנ֤וּ לָ/הֶם֙ הַ/נָּשִׁ֔ים אֲשֶׁ֣ר חִיּ֔וּ מִ/נְּשֵׁ֖י יָבֵ֣שׁ גִּלְעָ֑ד וְ/לֹֽא מָצְא֥וּ לָ/הֶ֖ם כֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: de
  text: Zu jener Zeit kehrte Benjamin zurück. Da gaben sie ihnen die Frauen aus Jabesch-Gilead, die sie am Leben gelassen hatten. Doch auf diese Weise fanden sie nicht genug Frauen für sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Doch so fanden sie nicht für sie.“ Die hebräische Formulierung ist verkürzt; gemeint ist offenbar, dass auf diese Weise nicht genügend Frauen für sie gefunden wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte zurück
  rationale: שׁוב bezeichnet hier in der erzählenden Abfolge am natürlichsten die Rückkehr der überlebenden Benjaminiter; das kollektive Subjekt wird entsprechend im Singular wiedergegeben.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Der Stammesname steht formal im Singular, bezeichnet im Zusammenhang aber kollektiv den Stamm. Die deutsche Wiedergabe bewahrt diese Ausdrucksweise.
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die geläufige Zeitangabe bewahrt den erzählerischen Anschluss und klingt in würdigem modernem Deutsch natürlich.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: Da gaben sie ihnen
  rationale: נתן bedeutet hier schlicht „geben“. Wie im Hebräischen bleibt das aus dem Zusammenhang erschließbare Subjekt unausgesprochen.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: Das Nomen bezeichnet ausdrücklich „Frauen“, nicht spezifisch „Ehefrauen“, auch wenn sie im Kontext als Ehefrauen vorgesehen sind.
- source_word: אֲשֶׁר חִיּוּ
  choice: die sie … am Leben gelassen hatten
  rationale: Der Piel von חיה drückt hier aus, dass diese Frauen bei der Tötung verschont worden waren. „Am Leben gelassen“ gibt dies idiomatisch und genau wieder.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: von den Frauen aus Jabesch-Gilead
  rationale: Die Präposition מן bezeichnet Herkunft beziehungsweise Auswahl aus einer Gruppe. „Aus Jabesch-Gilead“ ist für die Herkunft der Frauen im Deutschen natürlich.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: Doch auf diese Weise fanden sie nicht genug für sie
  rationale: Die hebräische Wendung ist elliptisch; כֵּן bedeutet wörtlich „so/auf diese Weise“. Der Kontext legt nahe, dass nicht genügend Frauen für alle vorhanden waren. Die Übersetzung macht nur diese notwendige Ergänzung ausdrücklich und kennzeichnet die Ellipse in einer Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an die hebräische Erzählstruktur. Das kollektive „Benjamin“ und die unbestimmten handelnden Personen bleiben wie im Ausgangstext erhalten; die Ellipse am Versende wird im Text behutsam verständlich gemacht und in der Fußnote offengelegt.
