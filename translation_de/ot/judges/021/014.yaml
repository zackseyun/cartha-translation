  terminology: „Benjamin“ als kollektiver Stammesname, „Frauen“, „am Leben gelassen“ und „Jabesch-Gilead“ sind angemessen. Die Übersetzung vermeidet es zutreffend, נשים ohne Weiteres zu „Ehefrauen“ zu spezifizieren.
