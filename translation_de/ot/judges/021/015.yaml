base_translation:
  language: en
  yaml_path: translation/ot/judges/021/015.yaml
  text: And the people grieved for Benjamin, because the LORD had made a breach among the tribes of Israel.
translation:
  language: de
  text: Das Volk empfand Mitleid mit Benjamin, denn der HERR hatte unter den Stämmen Israels eine Bresche geschlagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: trauerte um Benjamin
  rationale: Das Nifal von נחם bezeichnet hier schmerzliche Anteilnahme bzw. Trauer angesichts des Schicksals Benjamins. „Trauerte um“ ist im Deutschen natürlich und bewahrt den emotionalen Gehalt.
- source_word: עָשָׂה ... פֶּרֶץ
  choice: eine Lücke ... entstehen lassen hatte
  rationale: פֶּרֶץ bezeichnet einen Bruch oder eine Bresche. Im Zusammenhang mit dem drohenden Wegfall eines Stammes gibt „Lücke“ das Bild verständlich wieder; „entstehen lassen“ bildet die kausative Aussage idiomatisch ab.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird beibehalten.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: unter den Stämmen Israels
  rationale: Die Präposition ב bezeichnet hier den Bereich, innerhalb dessen die Lücke entstanden ist; „unter“ ist dafür natürliches Deutsch.
theological_decisions:
- issue: Göttliche Verursachung der Lücke
  choice: weil der HERR eine Lücke ... entstehen lassen hatte
  alternative: weil unter den Stämmen Israels eine vom HERRN verursachte Lücke entstanden war
  rationale: Der hebräische Satz schreibt das Geschehen ausdrücklich JHWH als handelndem Subjekt zu. Diese Spannung wird nicht abgeschwächt oder durch eine bloß passive Formulierung verdeckt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Bild, ohne im Deutschen unnötig technisch zu klingen.
