  text: מַה נַּעֲשֶׂ֥ה לָ/הֶ֛ם לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים וַ/אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ בַֽ/יהוָ֔ה לְ/בִלְתִּ֛י תֵּת לָ/הֶ֥ם מִ/בְּנוֹתֵ֖י/נוּ לְ/נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: de
  text: Was sollen wir für sie, die Übriggebliebenen, tun, damit sie Frauen bekommen?[a] Denn wir haben bei Jahwe geschworen, ihnen keine von unseren Töchtern zur Frau zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für Frauen“; gemeint ist, für die Übriggebliebenen Ehefrauen zu finden.'
    reason: Die im Hebräischen knappe Wendung לְנָשִׁים wird im Deutschen zur Verständlichkeit sinngemäß entfaltet.
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָהֶם
  choice: Was sollen wir für sie tun
  rationale: Die Frage mit dem Imperfekt der 1. Person Plural drückt eine gemeinsame Beratung über das weitere Vorgehen aus; לָהֶם bezeichnet hier die Begünstigten.
- source_word: לַנּוֹתָרִים
  choice: für die Übriggebliebenen
  rationale: Die substantivierte Partizipialform bezeichnet die Männer aus Benjamin, die nach dem Kampf noch übrig sind. „Übriggebliebene“ bleibt näher an der Formulierung als das ebenfalls mögliche „Überlebende“.
- source_word: לְנָשִׁים
  choice: damit sie Frauen bekommen
  rationale: Die knappe hebräische Wendung lautet wörtlich nur „zu/für Frauen“. Im Deutschen muss die im Zusammenhang vorausgesetzte Beziehung zum Finden von Ehefrauen sprachlich ergänzt werden.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: Denn wir haben geschworen
  rationale: Das ו führt hier den Grund für die schwierige Lage an. Das Perfekt bezeichnet einen früher geleisteten, weiterhin bindenden Schwur.
- source_word: בַיהוָה
  choice: bei Jahwe
  rationale: ב kennzeichnet in der Schwurformel denjenigen, bei dem geschworen wird; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לְבִלְתִּי תֵּת לָהֶם מִבְּנוֹתֵינוּ לְנָשִׁים
  choice: ihnen keine von unseren Töchtern zur Frau zu geben
  rationale: לְבִלְתִּי mit Infinitiv gibt den Inhalt des Schwurs an. מן ist partitiv („keine aus der Gruppe unserer Töchter“), und לְנָשִׁים bezeichnet beim Geben die Eheschließung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eingeschobene Wiederaufnahme „für sie – für die Übriggebliebenen –“ bewahrt die appositionsartige Struktur des Hebräischen. „Frauen“ entspricht dem üblichen biblischen Sprachgebrauch für Ehefrauen; „zur Frau geben“ gibt die damalige Heiratssprache wieder, ohne das Handeln der Erzählfiguren moralisch zu kommentieren.
