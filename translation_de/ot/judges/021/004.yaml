base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: de
  text: Am nächsten Tag stand das Volk früh auf, baute dort einen Altar und brachte Brandopfer und Friedensopfer[a] dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“ oder „Heilsopfer“. Der hebräische Begriff bezeichnet eine Opferart, die mit Wohlergehen, Unversehrtheit und Gemeinschaft verbunden ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Am nächsten Morgen
  rationale: Die hebräische Erzählungsformel וַיְהִי wird im natürlichen deutschen Erzählstil nicht eigens wiedergegeben. מִמָּחֳרָת bezeichnet den folgenden Tag; im Zusammenhang mit dem frühen Aufstehen ist „am nächsten Morgen“ idiomatisch und präzise.
- source_word: וַיַּשְׁכִּימוּ
  choice: stand ... früh auf
  rationale: Das Verb bezeichnet frühes Aufstehen und wird unmittelbar und natürlich wiedergegeben.
- source_word: הָעָם
  choice: das Volk
  rationale: Dies entspricht dem allgemeinen hebräischen Ausdruck. Der Bezug auf Israel wird nicht ausdrücklich in die Übersetzung eingefügt.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: Sie bauten dort einen Altar
  rationale: Die Übersetzung bewahrt das ausdrücklich genannte Ortsadverb שָׁם und verwendet natürliche deutsche Wortstellung.
- source_word: וַיַּעֲלוּ
  choice: brachten ... dar
  rationale: Im Opferkontext bezeichnet das Verb das Darbringen von Opfern; „darbringen“ ist im Deutschen klar und würdig.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für das vollständig auf dem Altar verbrannte Opfer.
- source_word: וּשְׁלָמִים
  choice: Friedensopfer
  rationale: „Friedensopfer“ ist eine etablierte Wiedergabe. Eine Fußnote hält die Bedeutungsaspekte von Gemeinschaft, Heil und Wohlergehen offen.
theological_decisions:
- issue: Wiedergabe der Opferbegriffe
  choice: Brandopfer und Friedensopfer
  alternative: Brandopfer und Gemeinschaftsopfer / Heilsopfer
  rationale: Der Text nennt zwei israelitische Opferarten, ohne sie theologisch auszudeuten. Etablierte deutsche Begriffe bleiben im Haupttext erhalten; die Bedeutungsbreite von שְׁלָמִים wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Kurze Hauptsätze vermeiden eine schwerfällige Kette und bewahren zugleich die Abfolge der hebräischen Erzählung.
