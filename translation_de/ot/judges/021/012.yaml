source:
  edition: WLC
  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: de
  text: Unter den Einwohnern von Jabesch-Gilead fanden sie vierhundert junge Frauen, Jungfrauen, die noch mit keinem Mann geschlafen hatten. Sie brachten sie in das Lager bei Schilo im Land Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: unter den Einwohnern von Jabesch-Gilead
  rationale: Das hebräische מִן bezeichnet hier die Gruppe, innerhalb derer die Frauen gefunden wurden; idiomatisches modernes Deutsch verwendet dafür „unter“.
- source_word: נַעֲרָה בְתוּלָה
  choice: junge Frauen, Jungfrauen
  rationale: Bewahrt sowohl die Alters- beziehungsweise Statusangabe נַעֲרָה als auch die ausdrückliche Bezeichnung בְתוּלָה, ohne beides zu einem einzigen Begriff zu verschmelzen.
- source_word: אֲשֶׁר לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: die noch mit keinem Mann geschlafen hatten
  rationale: Gibt den hebräischen Euphemismus „einen Mann kennen“ samt der präzisierenden Wendung zum Geschlechtsverkehr natürlich und eindeutig wieder.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: in das Lager bei Schilo
  rationale: Die unmarkierte Folge „das Lager, Schilo“ bezeichnet das bei beziehungsweise in Schilo gelegene Lager; „bei Schilo“ ist im Deutschen klar und vermeidet die Fehlvorstellung, Schilo selbst sei das Lager.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die Relativkonstruktion lokalisiert Schilo beziehungsweise das Lager; im Deutschen lässt sich dies knapp und natürlich als Ortsangabe wiedergeben.
