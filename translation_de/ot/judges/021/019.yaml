  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: de
  text: 'Und sie sagten: »Seht! In Silo findet Jahr für Jahr[a] ein Fest Jahwes statt. Silo liegt nördlich von Bethel, östlich der Straße, die von Bethel nach Sichem hinaufführt, und südlich von Lebona.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von Tagen zu Tagen«; gemeint ist die regelmäßige jährliche Wiederkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht!
  rationale: Bewahrt die aufmerksamkeitslenkende Funktion des hebräischen Ausdrucks in einer natürlichen modernen Form.
- source_word: חַג יְהוָה
  choice: ein Fest Jahwes
  rationale: חַג bezeichnet ein religiöses Fest, möglicherweise mit Wallfahrtscharakter; die Genitivverbindung gibt die Zugehörigkeit zu Jahwe wieder, ohne sie näher auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und ersetzt ihn nicht durch einen Titel.
- source_word: מִיָּמִים יָמִימָה
  choice: Jahr für Jahr
  rationale: Gibt die regelmäßige jährliche Wiederkehr idiomatisch und verständlich wieder; die wörtliche Ausdrucksweise wird in einer Fußnote genannt.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: östlich der Straße
  rationale: Der wörtliche Bezug auf den Sonnenaufgang bezeichnet hier in einer Ortsangabe die Himmelsrichtung Osten; מְסִלָּה ist eine ausgebaute oder bedeutendere Straße.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: die von Bethel nach Sichem hinaufführt
  rationale: Bewahrt sowohl die Richtungsangabe nach Sichem als auch die topografische Vorstellung des Hinaufführens.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: und südlich von Lebona
  rationale: Gibt die abschließende geografische Lagebestimmung knapp und eindeutig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname; seine Wiedergabe als »Jahwe« erhält diesen Unterschied gegenüber einem bloßen Herrschaftstitel.
- issue: Verhältnis des Festes zu Jahwe
  choice: ein Fest Jahwes
  alternative: ein Fest für Jahwe
  rationale: Der hebräische Genitiv lässt die genaue Art der Beziehung offen. »Fest Jahwes« bewahrt diese knappe Formulierung, statt ausdrücklich Zweck oder Widmung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange hebräische Ortsbeschreibung wurde zur besseren Verständlichkeit in einen eigenen Satz überführt; der sachliche Zusammenhang mit Silo bleibt erhalten. Die traditionellen deutschen Ortsnamen Bethel, Sichem und Lebona werden verwendet.
