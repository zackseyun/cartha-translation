  text: וַ/יִּתְהַלְּכ֨וּ מִ/שָּׁ֤ם בְּנֵֽי יִשְׂרָאֵל֙ בָּ/עֵ֣ת הַ/הִ֔יא אִ֥ישׁ לְ/שִׁבְט֖/וֹ וּ/לְ/מִשְׁפַּחְתּ֑/וֹ וַ/יֵּצְא֣וּ מִ/שָּׁ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: de
  text: Zu jener Zeit zogen die Israeliten von dort fort, jeder zu seinem Stamm und zu seiner Sippe[a]. Sie brachen von dort auf, jeder in seinen Erbbesitz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu seinem Familienverband“. Das hebräische Wort bezeichnet häufig eine größere Verwandtschaftsgruppe als die unmittelbare Familie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in sein zugeteiltes Land“. Gemeint ist der erbliche Landbesitz jedes Einzelnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: zogen … fort
  rationale: Der Hitpael von הלך beschreibt hier idiomatisch das Fortziehen beziehungsweise Auseinandergehen und nicht bloß das Gehen zu Fuß.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche deutsche Volksbezeichnung gibt die hebräische Wendung בְּנֵי יִשְׂרָאֵל im heutigen Standarddeutsch präzise und verständlich wieder.
- source_word: בָּעֵת הַהִיא
  choice: zu jener Zeit
  rationale: Die Wendung bewahrt den rückverweisenden zeitlichen Bezug des Hebräischen und entspricht einem würdigen deutschen Erzählstil.
- source_word: אִישׁ
  choice: jeder
  rationale: Das distributive אִישׁ bezeichnet hier jeweils einen Angehörigen Israels. „Jeder“ erhält diese Funktion natürlich, ohne das im Zusammenhang bereits erkennbare Bezugsfeld unnötig zu wiederholen.
- source_word: לְשִׁבְטוֹ
  choice: zu seinem Stamm
  rationale: „Stamm“ ist die etablierte und sachlich genaue Bezeichnung für שֵׁבֶט in Israels gesellschaftlicher Gliederung.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: und zu seiner Sippe
  rationale: מִשְׁפָּחָה meint hier wahrscheinlich einen größeren verwandtschaftlichen Verband als die moderne Kernfamilie; „Sippe“ bildet diese soziale Einheit besser ab.
- source_word: וַיֵּצְאוּ
  choice: sie brachen … auf
  rationale: Das Verb bezeichnet das Weggehen vom Versammlungsort. „Aufbrechen“ ist im Deutschen idiomatisch und wahrt die zweite, parallele Abgangsformulierung.
- source_word: לְנַחֲלָתוֹ
  choice: zu seinem Erbbesitz
  rationale: נַחֲלָה bezeichnet den erblich zugewiesenen Besitz, hier besonders das Landgebiet. „Erbbesitz“ bewahrt sowohl den erblichen als auch den territorialen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Abgangsverben des Hebräischen bleiben durch „zogen … fort“ und „brachen … auf“ erkennbar. „Israeliten“ wird gegenüber dem formalen „Söhne Israels“ bevorzugt, da es im Deutschen natürlich und semantisch vollständig ist.
