    rationale: Der englische Audit Trail bezeichnet die Form als 3. Person Plural, doch der angegebene WLC-Text hat וַיְצַו, eine Wayyiqtol-Form der 3. Person Singular. Der deutsche Singular „er befahl“ ist daher quellentreu und darf nicht an die englische Entscheidung angeglichen werden.
