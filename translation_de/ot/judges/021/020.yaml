  text: ו/יצו אֶת בְּנֵ֥י בִנְיָמִ֖ן לֵ/אמֹ֑ר לְכ֖וּ וַ/אֲרַבְתֶּ֥ם בַּ/כְּרָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/020.yaml
  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: de
  text: 'Dann befahl er den Söhnen Benjamins: »Geht und legt euch in den Weinbergen auf die Lauer.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geht und legt in den Weinbergen einen Hinterhalt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Dann befahl er
  rationale: Die vorliegende hebräische Form ist ein Wayyiqtol in der 3. Person Singular und bedeutet „und er befahl“. Der Singular bleibt erhalten, auch wenn der weitere Zusammenhang eine Gruppe als handelnde Instanz nahelegen kann.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: den Söhnen Benjamins
  rationale: Die hebräische Verwandtschaftsbezeichnung wird direkt und im Deutschen noch verständlich wiedergegeben; gemeint sind die Angehörigen des Stammes Benjamin.
- source_word: לֵאמֹר
  choice: Einleitung der direkten Rede durch Doppelpunkt
  rationale: Die formelhafte hebräische Wendung „indem er sagte“ wird im natürlichen modernen Deutsch durch einen Doppelpunkt wiedergegeben.
- source_word: לְכוּ
  choice: Geht
  rationale: Direkte Wiedergabe des pluralischen Imperativs von הלך.
- source_word: וַאֲרַבְתֶּם
  choice: legt euch … auf die Lauer
  rationale: ארב bezeichnet das verborgene Warten auf einen geeigneten Augenblick zum Überfall oder Zugriff. Die deutsche Wendung gibt den hier fortgesetzten Befehlscharakter natürlich wieder.
- source_word: בַּכְּרָמִים
  choice: in den Weinbergen
  rationale: Direkte und kontextgerechte Wiedergabe der Präposition ב und des Plurals von כרם.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der grammatische Singular des hebräischen Verbs wird nicht nach dem Kontext in einen Plural umgedeutet; die direkte Rede ist idiomatisch gesetzt.
