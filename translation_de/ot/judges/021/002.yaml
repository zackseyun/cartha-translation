  text: וַ/יָּבֹ֤א הָ/עָם֙ בֵּֽית אֵ֔ל וַ/יֵּ֤שְׁבוּ שָׁם֙ עַד הָ/עֶ֔רֶב לִ/פְנֵ֖י הָ/אֱלֹהִ֑ים וַ/יִּשְׂא֣וּ קוֹלָ֔/ם וַ/יִּבְכּ֖וּ בְּכִ֥י גָדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: de
  text: Dann kam das Volk nach Bethel. Dort saßen sie bis zum Abend vor Gott. Sie erhoben ihre Stimmen und weinten sehr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „weinten ein großes Weinen“; im Hebräischen verstärken das Verb und das stammverwandte Substantiv gemeinsam die Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier im fortlaufenden Erzählstil das Eintreffen an einem genannten Ort; „kam“ gibt dies knapp und natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bezeichnet die versammelten Israeliten als Gemeinschaft und nicht ausschließlich das Heer.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Die Form bezeichnet hier den Ortsnamen; dieser wird nach der üblichen deutschen Namensform wiedergegeben.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Dort saßen sie
  rationale: ישב kann sitzen, wohnen oder bleiben bedeuten. In diesem Zusammenhang bewahrt „saßen“ den konkreten Sinn und schließt zugleich das Verweilen bis zum Abend ein.
- source_word: עַד הָעֶרֶב
  choice: bis zum Abend
  rationale: Die Zeitangabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: vor Gott
  rationale: לפני bezeichnet die Gegenwart beziehungsweise das Angesicht Gottes; „vor Gott“ ist prägnant und wahrt die Formulierung des Hebräischen.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: Sie erhoben ihre Stimmen
  rationale: Die hebräische Wendung bezeichnet hörbares, lautes Klagen. Die deutsche Pluralform entspricht dem kollektiven Subjekt auf natürliche Weise.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: weinten sehr
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv verstärkt das Weinen. „Weinten sehr“ vermittelt diese Intensivierung in natürlichem modernem Deutsch; die formnähere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים in einem kultischen Zusammenhang
  choice: Gott
  alternative: der HERR
  rationale: Der Ausgangstext hat הָאֱלֹהִים und nicht den Gottesnamen JHWH. Daher wird keine Angleichung an „der HERR“ vorgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze halten den Erzählfluss klar; die leicht gehobene Wendung „erhoben ihre Stimmen“ bewahrt das hebräische Bild. Die ungewöhnliche figura etymologica beim Weinen wird im Haupttext idiomatisch und in der Fußnote formal transparent wiedergegeben.
