base_translation:
  language: en
  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: de
  text: 'Das Volk wurde gemustert, und siehe: Von den Einwohnern von Jabesch-Gilead war kein Mann dort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Von den Einwohnern von Jabesch-Gilead war niemand dort.« Wörtlich heißt es im Hebräischen: »Dort war kein Mann«; die männliche Form kann mit dem repräsentativen oder militärischen Zusammenhang zusammenhängen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: Als das Volk gemustert wurde
  rationale: Die Hitpael-Form von פקד bezeichnet hier im militärisch-korporativen Zusammenhang eine Musterung beziehungsweise Erfassung. Die deutsche Passivform gibt diesen Vorgang natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet gewöhnlich das Volk; der Kontext ist zwar militärisch, doch »Volk« vermeidet die enger deutende Wiedergabe »Heer«.
- source_word: וְהִנֵּה
  choice: stellte sich heraus
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das überraschende Ergebnis der Musterung. »Stellte sich heraus« überträgt diese Funktion in natürlichem modernem Deutsch.
- source_word: אֵין שָׁם אִישׁ
  choice: war kein Mann dort
  rationale: Die hebräische Wendung enthält ausdrücklich das maskuline Singularwort אִישׁ. Die Übersetzung bewahrt diese Formulierung und damit den möglichen Bezug auf männliche Vertreter oder Wehrfähige.
- source_word: מִיּוֹשְׁבֵי
  choice: von den Einwohnern von
  rationale: Das substantivierte Partizip von ישב bezeichnet die Bewohner eines Ortes. »Einwohner« ist idiomatisch und sachlich.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Jabesch-Gilead
  rationale: Der Ortsname wird in seiner etablierten deutschen Form mit Bindestrich wiedergegeben.
