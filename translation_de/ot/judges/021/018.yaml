  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: de
  text: 'Wir aber können ihnen keine Frauen aus unseren Töchtern geben, denn die Söhne Israels haben geschworen: »Verflucht ist, wer Benjamin[a] eine Frau gibt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist hier der Stamm Benjamin beziehungsweise ein Benjaminiter; im Hebräischen steht unmittelbar der Stammesname »Benjamin«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Wir aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt das Subjekt hervor und markiert hier einen Gegensatz im Gedankengang.
- source_word: לֹא נוּכַל
  choice: können … nicht
  rationale: יכל bezeichnet Fähigkeit oder Möglichkeit. Der Zusammenhang erklärt die durch den Eid bedingte Unmöglichkeit, ohne ausdrücklich »dürfen« zu sagen.
- source_word: לָתֵת לָהֶם
  choice: ihnen … geben
  rationale: Dies gibt נתן mit dem indirekten Objekt knapp und idiomatisch wieder.
- source_word: נָשִׁים
  choice: Frauen
  rationale: Im Zusammenhang sind Ehefrauen gemeint; die deutsche Wendung »jemandem eine Frau geben« bringt den Heiratsbezug bereits klar zum Ausdruck.
- source_word: מִבְּנוֹתֵינוּ
  choice: aus unseren Töchtern
  rationale: Die Präposition מן bezeichnet die Herkunft beziehungsweise Auswahl aus der eigenen Gruppe.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für die zuvor genannte Unmöglichkeit ein; »denn« ist in diesem Aussagesatz natürlich und würdig.
- source_word: נִשְׁבְּעוּ
  choice: haben geschworen
  rationale: Das Perfekt gibt einen früher abgelegten Eid wieder, dessen Wirkung in der gegenwärtigen Beratung fortbesteht.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formal maskuline Quellenform wird transparent bewahrt, statt sie zum allgemeineren »Israeliten« zu glätten.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der hebräische Redeinführungsinfinitiv wird im natürlichen modernen Deutsch durch direkte Rede nach einem Doppelpunkt wiedergegeben.
- source_word: אָרוּר
  choice: Verflucht
  rationale: Das Wort bezeichnet, dass jemand unter einem Fluch steht; »verflucht« ist die klare standarddeutsche Entsprechung.
- source_word: נֹתֵן אִשָּׁה
  choice: wer … eine Frau gibt
  rationale: Das Partizip wird generisch gebraucht. »Wer« gibt diese Funktion im Deutschen natürlich wieder und erhält den Singular.
- source_word: לְבִנְיָמִן
  choice: Benjamin
  rationale: Der hebräische Text verwendet unmittelbar den Stammesnamen. Die knappe Wiedergabe bewahrt diese Ausdrucksweise und erläutert ihre Bedeutung in einer Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die oath-bound Unmöglichkeit wird nicht zu einem ausdrücklich rechtlichen »dürfen nicht« umgedeutet. Der Stammesname Benjamin bleibt im Haupttext entsprechend der hebräischen Form stehen.
