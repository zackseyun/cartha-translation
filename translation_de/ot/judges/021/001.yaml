  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: de
  text: 'Die Männer Israels hatten in Mizpa geschworen: »Keiner von uns soll seine Tochter einem Benjaminiter[a] zur Frau geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Benjamin; der Name kann hier den Stamm Benjamin oder einen Angehörigen dieses Stammes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Die Männer Israels
  rationale: Das morphologisch singularische אִישׁ hat hier kollektive Bedeutung und bezeichnet im Kontext die israelitischen Männer als Gruppe. Das verbindende וְ wird am Kapitelanfang im Deutschen nicht eigens wiedergegeben.
- source_word: נִשְׁבַּע
  choice: hatten … geschworen
  rationale: Das Plusquamperfekt macht deutlich, dass der Schwur den nun folgenden Ereignissen vorausging; „schwören“ gibt den Niphal von שׁבע prägnant wieder.
- source_word: בַּמִּצְפָּה
  choice: in Mizpa
  rationale: Die Präposition bezeichnet den Ort, an dem der Schwur geleistet wurde. „In Mizpa“ ist bei einem Ortsnamen natürliches Deutsch.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die hebräische Einleitungsformel wird im modernen Deutschen idiomatisch durch die direkte Rede nach einem Doppelpunkt wiedergegeben.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Keiner von uns
  rationale: 'Die Wendung hat distributive Bedeutung: Kein einzelner Mann aus der Gruppe darf entsprechend handeln.'
- source_word: לֹא יִתֵּן
  choice: soll … geben
  rationale: Der negierte Imperfekt formuliert innerhalb des Schwurs eine bindende Verpflichtung. „Soll“ bewahrt diesen verpflichtenden Charakter besser als ein bloßes Futur.
- source_word: בִּתּוֹ
  choice: seine Tochter
  rationale: Direkte Wiedergabe des singularischen Nomens mit Possessivsuffix.
- source_word: לְבִנְיָמִן
  choice: einem Benjaminiter
  rationale: Der Name Benjamin steht hier im Zusammenhang einer Eheschließung metonymisch für einen Angehörigen des Stammes. Die Fußnote bewahrt die wörtliche Form und ihre mögliche kollektive Reichweite.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste Verbindung bezeichnet die Übergabe einer Frau zur Eheschließung; „zur Frau geben“ ist im Deutschen klar und dem hebräischen Ausdruck eng entsprechend.
theological_decisions:
- issue: Bezug von „Benjamin“
  choice: Im Haupttext als Angehöriger des Stammes („Benjaminiter“) wiedergegeben
  alternative: „dem Stamm Benjamin“ oder wörtlich „Benjamin“
  rationale: Da eine Tochter einem einzelnen Mann zur Frau gegeben wird, liegt der individuelle Bezug nahe. Der hebräische Stammesname selbst kann jedoch kollektiv stehen; diese Offenheit wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Schwurcharakter bleibt durch „geschworen“ und „soll“ deutlich; unnötig altertümliche Formulierungen werden vermieden.
