- from: 'Und die Israeliten[a] sagten: »Wer von allen Stämmen Israels ist nicht mit der Versammlung zu Jahwe hinaufgezogen?« Denn gegen jeden, der nicht zu Jahwe nach Mizpa hinaufgezogen war, galt der große Schwur: »Er muss unbedingt getötet werden.«'
  to: 'Und die Israeliten[a] sagten: »Wer von allen Stämmen Israels ist nicht zur Versammlung zu Jahwe hinaufgezogen?« Denn für jeden, der nicht zu Jahwe nach Mizpa hinaufgezogen war, galt der große Schwur: »Er muss unbedingt getötet werden.«'
