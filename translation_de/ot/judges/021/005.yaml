  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: de
  text: 'Und die Israeliten[a] sagten: »Wer von allen Stämmen Israels ist nicht zur Versammlung zu Jahwe hinaufgezogen?« Denn für jeden, der nicht zu Jahwe nach Mizpa hinaufgezogen war, galt der große Schwur: »Er muss unbedingt getötet werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne Israels«, bezeichnet hier aber das Volk als Kollektiv. »Die Israeliten« gibt dies im modernen Deutschen natürlich und genau wieder; die formale Ausdrucksweise wird in der Fußnote genannt.
- source_word: מִי אֲשֶׁר
  choice: Wer ... ist
  rationale: Die Verbindung aus Frage- und Relativpronomen fragt nach der Person beziehungsweise Gruppe, auf die die folgende Beschreibung zutrifft.
- source_word: לֹא עָלָה
  choice: nicht ... hinaufgezogen
  rationale: עלה bezeichnet häufig das Hinaufgehen oder Hinaufziehen zu einem Ort oder einer Versammlung. »Hinaufgezogen« bewahrt die räumliche Bildlichkeit des Hebräischen.
- source_word: בַקָּהָל
  choice: mit der Versammlung
  rationale: קהל bezeichnet die versammelte Gemeinschaft. Das hebräische ב kann hier die Zugehörigkeit zur Versammlung ausdrücken; »mit der Versammlung« ist im Deutschen verständlicher als das wörtlichere, aber missverständliche »in der Versammlung«.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Die Präposition אֶל bezeichnet eine Richtung oder Hinwendung; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: der große Schwur
  rationale: Die direkte Wiedergabe bewahrt Substantiv und Adjektiv. »Feierlicher Schwur« wäre idiomatischer, würde die Bedeutung von גָּדוֹל jedoch interpretierend einengen.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: gegen jeden ... galt
  rationale: Die Konstruktion bezeichnet denjenigen, auf den sich der Schwur mit seiner Strafandrohung richtete. Die deutsche Formulierung macht diese rechtliche Geltung deutlich, ohne die Aussage als bereits vollzogene Handlung darzustellen.
- source_word: הַמִּצְפָּה
  choice: nach Mizpa
  rationale: Die vorangehende Richtungspräposition אֶל verlangt hier im Deutschen »nach«. Der Artikel des Hebräischen wird beim deutschen Ortsnamen nicht wiedergegeben.
- source_word: מוֹת יוּמָת
  choice: Er muss unbedingt getötet werden
  rationale: Die Verbindung aus absolutem Infinitiv und passiver Verbform verstärkt die Gewissheit beziehungsweise Verbindlichkeit der Todesstrafe. »Getötet werden« bewahrt den passiven, von Menschen vollzogenen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen יהוה. »Jahwe« gibt ihn als Namen wieder, während »der HERR« die traditionelle ersetzende Lesung darstellt.
- issue: Kollektive, grammatisch männliche Wendung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist grammatisch männlich, fungiert hier jedoch als übliche Volksbezeichnung. Die natürliche deutsche Kollektivbezeichnung vermeidet den falschen Eindruck, der Text spreche nur von leiblichen Söhnen, während die Fußnote die Form des Hebräischen transparent macht.
- issue: Reichweite des singularischen מִי und לַאֲשֶׁר
  choice: Wer ... / gegen jeden
  alternative: Welcher Stamm ... / gegen denjenigen
  rationale: Das Hebräische formuliert singularisch und kann eine Person oder kollektiv eine Gruppe bezeichnen. Die Übersetzung legt nicht ausdrücklich fest, ob zunächst ein Einzelner oder eine Gemeinschaft gesucht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. »Hinaufgezogen«, »großer Schwur« und die passive Tötungsform bewahren markante Züge des Hebräischen, während »die Israeliten« und »mit der Versammlung« für heutige Leser natürlich formuliert sind.
