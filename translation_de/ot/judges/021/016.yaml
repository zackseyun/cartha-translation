  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: de
  text: 'Da sagten die Ältesten der Gemeinde: „Wie sollen wir den Übriggebliebenen zu Frauen verhelfen? Denn die Frauen aus Benjamin sind vernichtet worden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn aus Benjamin ist eine Frau vernichtet worden.“ Das hebräische Wort „Frau“ steht im Singular und bezeichnet hier kollektiv die Frauen aus Benjamin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: die Ältesten der Gemeinde
  rationale: Der Status constructus זִקְנֵי bezeichnet die Ältesten der עֵדָה, also der versammelten Gemeinschaft. „Gemeinde“ bewahrt den gemeinschaftlichen Sinn und ist im Deutschen geläufig.
- source_word: מַה נַּעֲשֶׂה
  choice: Was sollen wir … tun
  rationale: Das Fragewort mit dem Imperfekt der 1. Person Plural drückt gemeinsames Überlegen über das weitere Handeln aus.
- source_word: לַנּוֹתָרִים
  choice: für die Übriggebliebenen
  rationale: Die substantivierte Form bezeichnet diejenigen, die nach dem Gemetzel noch übrig sind. Die Wiedergabe bleibt nah am hebräischen Ausdruck, ohne ihn stärker als nötig auszudeuten.
- source_word: לְנָשִׁים
  choice: damit sie Frauen bekommen
  rationale: Im Kontext sind Frauen als Ehefrauen gemeint. Die deutsche Formulierung macht den Zweck idiomatisch verständlich, ohne ein zusätzliches Verb des Heiratens in den Ausgangstext einzutragen.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für die vorausgehende Frage ein.
- source_word: נִשְׁמְדָה
  choice: sind vernichtet worden
  rationale: Der Niphal von שׁמד bezeichnet das Vernichtet- oder Ausgerottetwerden. Das Passiv des Ausgangstextes bleibt erhalten.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: die Frauen aus Benjamin
  rationale: Das Hebräische verwendet אִשָּׁה im Singular kollektiv. Im natürlichen Deutschen wird der gemeinte Plural ausgedrückt; „aus Benjamin“ bewahrt die Herkunftskonstruktion mit מִן.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die beratende Frage der Ältesten und die Härte von נִשְׁמְדָה werden bewahrt. Der kollektiv gebrauchte Singular wird im Haupttext idiomatisch als Plural wiedergegeben und in der Fußnote offengelegt.
