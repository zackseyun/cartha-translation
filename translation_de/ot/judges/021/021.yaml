revisions:
- from: Haltet Ausschau, und sobald die Töchter von Silo herauskommen, um bei den Reigentänzen zu tanzen, dann kommt aus den Weinbergen hervor und raubt euch jeder seine Frau[a] von den Töchtern Silos; danach zieht ins Land Benjamin.
  to: 'Haltet Ausschau: Wenn die Töchter von Silo herauskommen, um bei den Tänzen zu tanzen, dann kommt aus den Weinbergen hervor, und jeder von euch raube sich[a] eine Frau aus den Töchtern von Silo; dann zieht ins Land Benjamin.'
  rationale: Die Revision bewahrt die konditionale Form von אִם mit „wenn“, ohne die im Handlungsablauf naheliegende zeitliche Funktion zu verlieren. Sie ersetzt die nicht sicher belegbare Spezifizierung „Reigentänze“ durch „Tänze“ und glättet die deutsche distributive Syntax. Der Haupttext bleibt bei „raube sich“ als starker, aber nicht überinterpretierender Wiedergabe von חטף; die Fußnote dokumentiert mögliche schärfere deutsche Alternativen.
  reviewer_model: gpt-5.6-terra
