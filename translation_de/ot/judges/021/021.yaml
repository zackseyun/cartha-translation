review_pass:
  verdict: revise
  source_fidelity: Die Anweisungsfolge, das Hervorkommen der Frauen, das Tanzen, das Hervorkommen aus den Weinbergen, die gewaltsame Aneignung und der Zug in das Gebiet Benjamins sind im Entwurf grundsätzlich zutreffend wiedergegeben. Allerdings macht „sobald“ aus der mit אִם formulierten Bedingung stärker einen sicheren, unmittelbar eintretenden Zeitpunkt. „Reigentänzen“ legt zudem eine konkrete Tanzform nahe, die der hebräische Plural מְחֹלוֹת nicht sicher bestimmt.
  naturalness: Der Satz ist weitgehend verständlich, aber „raubt euch jeder seine Frau von den Töchtern Silos“ ist in der Wortstellung schwerfällig. Eine distributive Formulierung mit „jeder von euch“ ist im modernen Standarddeutsch klarer. „Haltet Ausschau“ bewahrt den Kontext des Beobachtens bzw. Lauernden gut.
  terminology: „Silo“ ist als deutsche biblische Namensform vertretbar. „Rauben“ gibt die Gewalt von חטף deutlich wieder, ohne den modernrechtlichen Begriff „entführen“ in den Haupttext einzutragen. „Tänze“ ist gegenüber „Reigentänzen“ die weniger festlegende und daher quellentreuere Wiedergabe.
  issues:
  - severity: medium
    issue: „sobald“ verschärft die Bedingung
    rationale: אִם ist formal konditional. Im Kontext kann es zeitlich als erwartetes Ereignis verstanden werden, doch „wenn“ bewahrt diese Offenheit besser als „sobald“, das unmittelbare zeitliche Folge und einen erwartungssicheren Eintritt stärker vorgibt.
  - severity: medium
    issue: „Reigentänze“ ist zu spezifisch
    rationale: מְחֹלוֹת bezeichnet hier Tänze bzw. Tanzveranstaltungen; ob es sich genauer um Reigentänze handelte, ist nicht ausdrücklich gesagt.
  - severity: low
    issue: Distributive Wortstellung beim gewaltsamen Nehmen
    rationale: „raubt euch jeder seine Frau“ ist möglich, klingt aber syntaktisch gedrängt. „jeder von euch raube sich eine Frau“ gibt die distributive hebräische Konstruktion klar und natürlich wieder.
  revised_text: 'Haltet Ausschau: Wenn die Töchter von Silo herauskommen, um bei den Tänzen zu tanzen, dann kommt aus den Weinbergen hervor, und jeder von euch raube sich[a] eine Frau aus den Töchtern von Silo; dann zieht ins Land Benjamin.'
  revised_footnotes:
