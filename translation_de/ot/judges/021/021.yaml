  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: de
  text: 'Haltet Ausschau: Wenn die Töchter von Silo herauskommen, um bei den Tänzen zu tanzen, dann kommt aus den Weinbergen hervor, und jeder von euch raube sich[a] eine Frau aus den Töchtern von Silo; dann zieht ins Land Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »reiße sich eine Frau an sich« oder »verschleppe eine Frau«; das hebräische Verb bezeichnet ein plötzliches, gewaltsames Ergreifen oder Wegnehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Haltet Ausschau
  rationale: Die formal futurische Verbform hat in dieser Anweisungsfolge auffordernde Kraft. „Haltet Ausschau“ gibt das aufmerksame Beobachten beim Auflauern natürlich wieder.
- source_word: וְהִנֵּה אִם
  choice: und sobald
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das erwartete Eintreten, während אִם formal eine Bedingung einführt. Im geplanten Ablauf gibt „sobald“ die zeitlich-bedingte Bedeutung idiomatisch wieder, ohne den Eintritt als bloß ungewiss darzustellen.
- source_word: בְנוֹת שִׁילוֹ
  choice: die Töchter von Silo / die Töchter Silos
  rationale: Die hebräische Ortszugehörigkeitsformel bleibt sichtbar; sie bezeichnet die weiblichen Angehörigen beziehungsweise jungen Frauen des Ortes, ohne ihr Alter ausdrücklich festzulegen.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: bei den Reigentänzen zu tanzen
  rationale: Das Verb bezeichnet hier Tanzen; das Substantiv im Plural meint Tänze, wahrscheinlich Gruppentänze. „Reigentänze“ bildet diese Vorstellung knapp und verständlich ab, ohne eine genaue Choreografie festzulegen.
- source_word: וַחֲטַפְתֶּם
  choice: raubt
  rationale: Das Verb bezeichnet ein plötzliches, gewaltsames Ergreifen beziehungsweise Wegnehmen. „Raubt“ macht die Gewalt der Handlung deutlich und vermeidet eine beschönigende Wiedergabe.
- source_word: אִישׁ אִשְׁתּוֹ
  choice: jeder seine Frau
  rationale: Die distributive Konstruktion weist jedem der angesprochenen Männer jeweils eine Frau zu. Die knappe deutsche Form bewahrt diesen Sinn.
- source_word: וַהֲלַכְתֶּם אֶרֶץ בִּנְיָמִן
  choice: danach zieht ins Land Benjamin
  rationale: „Zieht“ ist für die gemeinschaftliche Reiseanweisung idiomatisch. „Danach“ verdeutlicht die Abfolge der waw-verknüpften Anweisungen.
theological_decisions:
- issue: Moralische Darstellung der gewaltsamen Wegnahme
  choice: raubt euch jeder seine Frau
  alternative: nehmt euch jeder seine Frau / entführt euch jeder eine Frau
  rationale: Die Übersetzung darf die im Verb חטף enthaltene Gewalt nicht abschwächen. „Raubt“ beschreibt die erzwungene Wegnahme deutlich, ohne die Erzählung durch eine zusätzliche moralische Rechtfertigung oder Verurteilung zu erweitern.
- issue: Geschlechtsspezifische distributive Formulierung
  choice: jeder seine Frau
  alternative: jeder von euch eine Frau
  rationale: Der hebräische Ausdruck ist ausdrücklich männlich-singularisch und distributiv. Die gewählte Form bewahrt, dass jeder angesprochene Mann eine der Frauen nehmen soll.
- issue: Bedingung oder erwarteter Zeitpunkt
  choice: sobald
  alternative: wenn / falls
  rationale: אִם ist formal konditional, doch die Anweisung setzt das erwartete Herauskommen als Signal zum Handeln voraus. „Sobald“ bewahrt die Abhängigkeit des Handelns vom Ereignis und klingt im Deutschen natürlicher als „falls“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die imperativische Anweisungsfolge bleibt direkt; die Gewalt der beschriebenen Handlung wird weder beschönigt noch durch moderne juristische Fachsprache überbestimmt. Der Aufmerksamkeitspartikel הִנֵּה wird zusammen mit אִם idiomatisch durch „sobald“ wiedergegeben.
