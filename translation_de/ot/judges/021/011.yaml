source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: de
  text: 'Und dies ist es, was ihr tun sollt: Alle männlichen Personen und jede Frau, die mit einem Mann geschlafen hat, sollt ihr dem Bann weihen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck bezeichnet die Übergabe an den Bann zur Vernichtung, nicht lediglich gewöhnliches Töten.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Und dies ist es, was ihr tun sollt
  rationale: Gibt die einleitende hebräische Wendung idiomatisch wieder, bewahrt dabei den Anschluss durch וְ und die verpflichtende Aussageform.
- source_word: כָּל זָכָר
  choice: alles Männliche
  rationale: זָכָר bezeichnet das männliche Geschlecht und ist nicht auf erwachsene Männer beschränkt; die substantivierte Form wahrt diesen umfassenden Sinn.
- source_word: וְ/כָל אִשָּׁה
  choice: und jede Frau
  rationale: אִשָּׁה bezeichnet hier eine Frau, deren sexuelle Erfahrung anschließend näher bestimmt wird; „Ehefrau“ wäre zu eng.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: die mit einem Mann geschlafen hat
  rationale: Die hebräische Umschreibung bezeichnet sexuellen Verkehr. Die deutsche Formulierung ist natürlich, eindeutig genug und wahrt einen gewissen euphemistischen Charakter.
- source_word: תַּחֲרִימוּ
  choice: sollt ihr dem Untergang weihen
  rationale: Der Hifil von חרם bezeichnet die Vollstreckung des Banns zur Vernichtung und meint mehr als gewöhnliches Töten; „dem Untergang weihen“ bewahrt den kultisch-rechtlichen Beiklang.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang von Krieg und Gericht
  choice: dem Untergang weihen
  alternative: vollständig vernichten; dem Bann unterwerfen
  rationale: Die gewählte Formulierung bewahrt sowohl den Weihe- beziehungsweise Banncharakter als auch das Ziel der Vernichtung, ohne den Ausdruck auf bloßes Töten zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sexuelle Umschreibung wird natürlich wiedergegeben; der technische Bannbegriff bleibt durch „dem Untergang weihen“ erkennbar. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Wendung.
