source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: de
  text: In jenen Tagen gab es keinen König in Israel. Jeder tat, was in seinen eigenen Augen richtig war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Die übliche rückblickende Zeitformel wird im modernen Standarddeutsch natürlich und würdevoll wiedergegeben.
- source_word: אֵין מֶלֶךְ
  choice: gab es keinen König
  rationale: Die negative Existenzaussage wird idiomatisch wiedergegeben und bewahrt die Aussage über das Fehlen eines Königs.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Orts- beziehungsweise Bereichsangabe wird unmittelbar übernommen.
- source_word: אִישׁ
  choice: Jeder
  rationale: Das maskuline Singularwort wird hier distributiv gebraucht. „Jeder“ bewahrt im Deutschen sowohl die distributive als auch die grammatisch maskuline Form, ohne die Aussage unnötig auf erwachsene Männer einzuengen.
- source_word: הַיָּשָׁר
  choice: was … richtig war
  rationale: Das substantivierte Adjektiv bezeichnet das, was als richtig oder recht gilt; „was richtig war“ ist natürlich und erhält den wertenden Sinn.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Die hebräische Wendung bezeichnet das persönliche Urteil. „eigenen“ macht den rückbezüglichen und subjektiven Sinn im Deutschen deutlich.
- source_word: יַעֲשֶׂה
  choice: tat
  rationale: Die Imperfektform beschreibt in diesem rückblickenden Summarium gewohnheitsmäßiges Handeln; das deutsche Präteritum gibt dies im Kontext knapp und natürlich wieder.
theological_decisions:
- issue: Distributive und grammatisch maskuline Sprache in אִישׁ
  choice: Jeder
  alternative: Jeder Mann; alle
  rationale: „Jeder“ entspricht dem distributiven maskulinen Singular des Hebräischen und ist im Deutschen natürlich. „Jeder Mann“ könnte den Bezug stärker als nötig auf erwachsene Männer beschränken; „alle“ würde die Singularstruktur einebnen.
- issue: Implizite Bewertung des Schlussrefrains
  choice: Die Aussage ohne deutende Verstärkung wiedergeben
  alternative: Jeder tat, was ihm beliebte; alle machten, was sie wollten
  rationale: Der literarische Zusammenhang legt eine negative Beurteilung nahe, doch der hebräische Wortlaut sagt, jeder habe getan, was in seinen Augen richtig war. Die Übersetzung bewahrt diese Spannung, ohne zusätzliche Motive wie Willkür ausdrücklich einzutragen.
- issue: Verhältnis der beiden Satzhälften
  choice: Zwei selbstständige Sätze ohne erklärende Verknüpfung
  alternative: …; deshalb tat jeder …
  rationale: Der hebräische Text stellt beide Aussagen nebeneinander, ohne eine ausdrückliche kausale Konjunktion. Die Übersetzung vermeidet es daher, den Zusammenhang durch „deshalb“ festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Erzählprosa. Die vertraute Wendung „in seinen eigenen Augen“ bewahrt das hebräische Bild und die theologische Spannung.
