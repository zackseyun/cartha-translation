  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: de
  text: 'Da sandte die Versammlung zwölftausend kampftüchtige Männer dorthin und befahl ihnen: »Geht hin und erschlagt die Einwohner von Jabesch-Gilead mit der Schärfe des Schwertes, auch die Frauen und die Kinder.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: die Versammlung
  rationale: Bezeichnet hier die versammelte Gemeinschaft Israels; »Versammlung« ist sachlich und vermeidet eine unnötig kultische Einengung.
- source_word: מִבְּנֵי הֶחָיִל
  choice: kampftüchtige Männer
  rationale: Die idiomatische Wendung bezeichnet in diesem militärischen Zusammenhang tüchtige bzw. wehrfähige Kämpfer; eine wörtliche Wiedergabe als »Söhne der Tapferkeit« wäre im Deutschen unnatürlich.
- source_word: וְהִכִּיתֶם
  choice: erschlagt
  rationale: Im Zusammenhang mit dem Schwert und dem ausdrücklichen Einschluss von Frauen und Kindern meint das Verb tödliche Gewalt, nicht bloß einen Angriff.
- source_word: לְפִי חֶרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Bewahrt das hebräische Bild vom »Mund« bzw. der Schneide des Schwertes in einer geläufigen deutschen Formulierung.
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: auch die Frauen und die Kinder
  rationale: Das koordinierende וְ schließt diese Gruppen ausdrücklich in den Tötungsbefehl ein; טַף bezeichnet die kleinen bzw. abhängigen Kinder, im natürlichen Deutsch hier schlicht »Kinder«.
theological_decisions:
- issue: Darstellung des umfassenden Gewaltbefehls
  choice: Der Einschluss von Frauen und Kindern wird ausdrücklich und ungemildert wiedergegeben.
  alternative: Eine verallgemeinernde Formulierung wie »vernichtet die Stadt vollständig«.
  rationale: Der hebräische Text nennt Frauen und Kinder ausdrücklich. Die Übersetzung darf die moralische und theologische Spannung der Erzählung weder abschwächen noch durch zusätzliche Deutung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der militärische Befehl bleibt knapp und hart; die Satzstruktur ist gegenüber dem hebräischen »und sie befahlen ihnen, indem sie sagten« natürlich verdichtet.
