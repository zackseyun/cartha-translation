base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: de
  text: So stellten sie das geschnitzte Bild[a] Michas, das er angefertigt hatte, für sich auf, solange das Haus Gottes in Schilo war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götzenbild“. Das hebräische Wort bezeichnet ein geschnitztes, kultisch verwendetes Bild. „Geschnitztes Bild“ hebt seine konkrete Beschaffenheit hervor, „Götzenbild“ seine Funktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: stellten sie … für sich auf
  rationale: שׂים bedeutet grundsätzlich „setzen, stellen, aufstellen“. Im kultischen Zusammenhang bezeichnet „aufstellen“ passend die Installation des Bildes; לָהֶם wird mit „für sich“ bewahrt.
- source_word: פֶּסֶל
  choice: geschnitzte Bild
  rationale: פֶּסֶל bezeichnet ein für kultische Zwecke gefertigtes, typischerweise geschnitztes Bild. „Geschnitztes Bild“ bewahrt den konkreten Herstellungssinn, ohne die Funktion bereits durch „Götzenbild“ auszudeuten.
- source_word: מִיכָה
  choice: Micha
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: אֲשֶׁר עָשָׂה
  choice: das er angefertigt hatte
  rationale: Das Relativpronomen bezieht sich auf das Bild; das Plusquamperfekt macht natürlich deutlich, dass seine Anfertigung dem Aufstellen vorausging.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: solange … war
  rationale: Die hebräische Zeitangabe bedeutet wörtlich etwa „alle Tage des Bestehens“. „Solange … war“ gibt ihre durative Bedeutung in natürlichem Deutsch wieder.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die direkte Wiedergabe erhält die sachliche Bezeichnung der anerkannten Gottesdienststätte und vermeidet eine interpretierende Präzisierung.
- source_word: בְּשִׁלֹה
  choice: in Schilo
  rationale: Verwendet die gebräuchliche deutsche Form des Ortsnamens und gibt die Präposition direkt wieder.
theological_decisions:
- issue: Wiedergabe von בֵּית הָאֱלֹהִים im Kontrast zwischen dem Kult in Dan und der zentralen Gottesdienststätte Israels
  choice: das Haus Gottes
  alternative: das Heiligtum Gottes
  rationale: „Das Haus Gottes“ folgt dem hebräischen Ausdruck eng und lässt die erzählerische Spannung zwischen dem geschnitzten Bild und der Gottesdienststätte in Schilo bestehen, ohne sie durch eine erklärende Wertung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält „für sich“ nahe beim Verb und vermeidet dadurch, dass es als Teil des Besitzerausdrucks „Michas“ verstanden wird. Die Fußnotenmarke steht unmittelbar nach der Aussage über die Anfertigung des Bildes.
