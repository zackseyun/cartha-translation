  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die drei direkten Fragen bleiben knapp und eindringlich. Die elliptischen hebräischen Wendungen werden im Haupttext idiomatisch wiedergegeben, während echte lexikalische Alternativen in den Fußnoten erhalten bleiben.
