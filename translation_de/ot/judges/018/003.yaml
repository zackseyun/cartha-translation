base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: de
  text: 'Als sie bei Michas Haus waren, erkannten sie die Stimme des jungen Leviten. Da bogen sie dorthin ab und fragten ihn: »Wer hat dich hierher gebracht? Was machst du hier?[a] Und was hast du hier?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Was machst du in diesem?“ Möglich ist auch: „Was machst du damit?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und was hast du hier zu suchen?“ beziehungsweise: „Und was ist dein Anliegen hier?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: Als sie beim Haus Michas waren
  rationale: עִם bezeichnet hier räumliche Nähe. „Beim Haus Michas“ gibt die Ortsangabe im Deutschen natürlich wieder; die Konstruktion wird als begleitender Umstand verstanden.
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: erkannten sie die Stimme des jungen Leviten
  rationale: Das Hifil von נכר bedeutet hier „erkennen/wiedererkennen“; קוֹל bezeichnet in diesem Zusammenhang die Stimme. נַעַר wird altersbezogen als „jung“ verstanden.
- source_word: וַיָּסוּרוּ שָׁם
  choice: Da bogen sie dorthin ab
  rationale: סור beschreibt das Abweichen vom bisherigen Weg beziehungsweise das Abbiegen zu einem Ort. „Dorthin“ gibt שָׁם in dieser Bewegungsangabe idiomatisch wieder.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: Wer hat dich hierhergebracht?
  rationale: Das Hifil von בוא ist kausativ („bringen“), und הֲלֹם bezeichnet eine Bewegung „hierher“.
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: Was machst du hier?
  rationale: בָּזֶה lautet wörtlich „in diesem/damit“, ist hier jedoch elliptisch und wahrscheinlich örtlich gemeint. Die natürliche deutsche Ortsfrage bewahrt den Sinn; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: וּמַה לְּךָ פֹה
  choice: Und was hast du hier?
  rationale: Die Wendung מַה לְךָ פֹה kann nach dem fragen, was jemand an diesem Ort hat, oder allgemeiner nach seinem Anliegen beziehungsweise seiner Tätigkeit dort. Die Hauptfassung bleibt nah an der konkreten Formulierung.
