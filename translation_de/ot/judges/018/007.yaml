  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: de
  text: Da gingen die fünf Männer und kamen nach Lajisch. Sie sahen, dass das Volk dort in Sicherheit lebte, nach der Art der Sidonier, ruhig und sicher. Im Land gab es niemanden, der sie in irgendeiner Sache beschämte und Herrschaft ausübte.[a] Sie waren weit von den Sidoniern entfernt und standen mit niemandem in Verbindung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig; wörtlich etwa: „Es gibt niemanden, der im Land in irgendeiner Sache beschämt, der Macht besitzt.“ Wahrscheinlich ist gemeint, dass kein Machthaber vorhanden war, der sie demütigte oder beherrschte.'
    reason: textual_difficulty
  - marker: b
    text: 'Oder: „Sie hatten mit niemandem ein Bündnis“ beziehungsweise „nichts zu schaffen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: nach Lajisch
  rationale: Das ה locale bezeichnet die Richtung; der Ortsname wird in der im Deutschen etablierten biblischen Form „Lajisch“ wiedergegeben.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: in Sicherheit lebte
  rationale: Die Verbindung beschreibt eine dauerhaft sichere Lebenslage; die deutsche Form ist natürlich und bewahrt den durativen Sinn des Partizips.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: nach der Art der Sidonier
  rationale: מִשְׁפָּט bezeichnet hier wahrscheinlich die Lebensweise oder gesellschaftliche Ordnung, nicht ein Gerichtsurteil.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: ruhig und sorglos
  rationale: Die Wortpaarung schildert ungestörte Ruhe und ein Sicherheitsgefühl. „Sorglos“ lässt zugleich anklingen, dass das Volk keine Gefahr erwartete.
- source_word: מַכְלִים דָּבָר
  choice: der sie in irgendeiner Sache demütigte
  rationale: Das Hifil von כלם bezeichnet das Beschämen oder Demütigen; „in irgendeiner Sache“ bildet דָּבָר möglichst offen ab.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: und Herrschaft ausübte
  rationale: Die schwierige Wendung scheint im Zusammenhang eine Person mit Zwangs- oder Herrschaftsmacht zu bezeichnen. Die Übersetzung gibt diesen wahrscheinlichen Funktionssinn wieder, ohne einen bestimmten Amtstitel einzutragen.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: Sie waren weit von den Sidoniern entfernt
  rationale: Die räumliche Distanz erklärt die politische und militärische Isolation Lajischs; צִדֹנִים wird als Personenbezeichnung verstanden.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: hatten mit niemandem Beziehungen
  rationale: Die idiomatische Verbindung bezeichnet fehlende Beziehungen, Absprachen oder Kontakte. „Beziehungen“ hält die genaue Art bewusst offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Sicherheitsmotivs wird bewahrt; „ruhig und sorglos“ klingt natürlich, ohne die spätere Gewalt gegen Lajisch moralisch zu rechtfertigen. Die syntaktisch und lexikalisch schwierige Herrschaftsklausel wird im Haupttext lesbar wiedergegeben und in der Fußnote ausdrücklich offengehalten.
