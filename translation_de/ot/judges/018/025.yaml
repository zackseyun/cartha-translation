review_pass:
  verdict: revise
  source_fidelity: Die Stammesbezeichnung, die Warnung vor einem gewaltsamen Angriff und der drohende Verlust von Leben sind zutreffend wiedergegeben. Das hebräische Pluralpronomen in „über euch herfallen“ ist richtig, während die anschließende Anrede wieder Singular ist. Das modal abschwächende „könnten“ gibt die drohende Folge nach פֶּן jedoch weniger direkt wieder als der Text nahelegt.
  naturalness: „Lass deine Stimme bei uns nicht hören“ ist verständlich, aber im modernen Deutschen weniger idiomatisch. „Lass deine Stimme nicht bei uns hören“ bewahrt das Bild und klingt natürlicher. Für den kollektiven Hausverband ist „das Leben deines Hausstands“ klarer als das singularische und missverständliche „das Leben deiner Angehörigen“.
  terminology: „Söhne Dans“ ist als formnahe Stammesbezeichnung vertretbar. „Verbitterte Männer“ ist eine mögliche, zurückhaltende Wiedergabe von אֲנָשִׁים מָרֵי נֶפֶשׁ; die Fußnote dokumentiert angemessen die semantische Spannweite. „Hausstand“ gibt בֵּיתֶךָ hier ohne konfessionelle oder übermäßig interpretierende Einengung wieder.
  issues:
