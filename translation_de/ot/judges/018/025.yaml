- from: 'Da sagten die Söhne Dans zu ihm: »Lass deine Stimme bei uns nicht hören, sonst könnten verbitterte Männer über euch herfallen[a], und du verlierst dein Leben und das Leben deiner Angehörigen[b].«'
  to: 'Da sagten die Söhne Dans zu ihm: »Lass deine Stimme nicht bei uns hören, sonst fallen verbitterte Männer über euch her[a], und du verlierst dein Leben und das Leben deines Hausstands[b].«'
  rationale: Die Revision glättet die deutsche Syntax, gibt die Warnung vor der möglichen Folge unmittelbarer wieder und verdeutlicht den kollektiven Bezug von „Haus“ beziehungsweise „Hausstand“. Die Ambiguität der Bezeichnung für die gefährlichen Männer bleibt im Text und in der Fußnote gewahrt.
