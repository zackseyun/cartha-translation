  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ בְּנֵי דָ֔ן אַל תַּשְׁמַ֥ע קוֹלְ/ךָ֖ עִמָּ֑/נוּ פֶּֽן יִפְגְּע֣וּ בָ/כֶ֗ם אֲנָשִׁים֙ מָ֣רֵי נֶ֔פֶשׁ וְ/אָסַפְתָּ֥ה נַפְשְׁ/ךָ֖ וְ/נֶ֥פֶשׁ בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: de
  text: 'Da sagten die Söhne Dans zu ihm: »Lass deine Stimme nicht bei uns hören, sonst fallen verbitterte Männer über euch her[a], und du verlierst dein Leben und das Leben deines Hausstands[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Männer von bitterer Seele«; auch: »erbitterte«, »wilde« oder »verzweifelte Männer«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das Leben deines Hauses«; gemeint sind die Menschen, die zu seinem Hausverband gehören.'
    reason: lexical_clarification
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: die Söhne Dans
  rationale: Die formale Stammesbezeichnung des Hebräischen bleibt erhalten und ist im Deutschen verständlich; »Daniter« wäre ebenfalls möglich.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: Lass deine Stimme bei uns nicht hören
  rationale: Bewahrt das hebräische Bild vom Hören der Stimme und vermittelt zugleich die Warnung, in ihrer Gegenwart nicht weiterzureden.
- source_word: פֶּן
  choice: sonst könnten
  rationale: Gibt die warnende Folgebeziehung natürlich wieder, ohne den angedrohten Angriff als bereits feststehend darzustellen.
- source_word: יִפְגְּעוּ בָכֶם
  choice: über euch herfallen
  rationale: Drückt die hier gemeinte feindselige Begegnung anschaulich und idiomatisch aus.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: verbitterte Männer
  rationale: Die Wendung bezeichnet innerlich erbitterte und deshalb gefährliche Männer. Die deutsche Form ist verständlich und bleibt nahe am Bild des bitteren Gemüts.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: und du verlierst dein Leben
  rationale: Die idiomatische Verbindung bezeichnet hier den Verlust des Lebens, nicht ein wörtliches Einsammeln.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: und das Leben deiner Angehörigen
  rationale: בַּיִת meint hier den Hausverband beziehungsweise die Angehörigen. Der hebräische Singular נֶפֶשׁ bleibt durch »das Leben« sichtbar, während der kollektive Bezug verständlich ausgedrückt wird.
