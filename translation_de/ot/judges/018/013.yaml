base_translation:
  language: en
  yaml_path: translation/ot/judges/018/013.yaml
  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: de
  text: Von dort zogen sie durch das Bergland Ephraim und kamen bis zum Haus Michas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: zogen sie durch
  rationale: עבר bezeichnet hier die Bewegung durch ein Gebiet. „zogen … durch“ ist im deutschen Reisebericht natürlich und gibt den regionalen Durchzug treffend wieder.
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die Ortsangabe bezeichnet den Ausgangspunkt und wird idiomatisch und genau mit „Von dort“ wiedergegeben.
- source_word: הַר אֶפְרָיִם
  choice: das Bergland Ephraim
  rationale: Die Verbindung ist eine regionale Bezeichnung und meint nicht nur einen einzelnen Berg. „Bergland Ephraim“ bewahrt den geografischen Sinn und die traditionelle Namensform.
- source_word: וַיָּבֹאוּ
  choice: und kamen
  rationale: בוא bezeichnet das Kommen beziehungsweise Erreichen eines Ortes; „und kamen“ führt die hebräische Erzählfolge knapp und natürlich fort.
- source_word: עַד
  choice: bis zum
  rationale: עַד markiert hier das erreichte Ziel beziehungsweise die Grenze der Bewegung. Im Deutschen gibt „bis zum“ dies präzise wieder.
- source_word: בֵּית מִיכָה
  choice: zum Haus Michas
  rationale: Die Status-constructus-Verbindung bedeutet „Haus des Micha“. „Haus Michas“ ist eine natürliche, würdige deutsche Genitivkonstruktion und lässt wie das Hebräische offen, ob primär das Gebäude oder der Haushalt gemeint ist.
theological_decisions: []
translation_notes:
  register: Moderner, knapper und würdiger Erzählstil. „Bergland Ephraim“ wird als geografische Regionsbezeichnung verstanden; unnötige Fußnoten werden vermieden.
