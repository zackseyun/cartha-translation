  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: de
  text: In jenen Tagen gab es keinen König in Israel. Und in jenen Tagen suchte der Stamm der Daniter für sich nach einem Erbbesitz, um sich dort niederzulassen; denn bis zu jenem Tag war ihm unter den Stämmen Israels noch kein Erbbesitz zugefallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist vom „Zufallen“ eines Erbbesitzes die Rede; die Wendung bezeichnet die Zuteilung des Stammeslandes und kann an die Verteilung durch das Los erinnern.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: gab es keinen König in Israel
  rationale: Die deutsche Existenzkonstruktion gibt die hebräische Verneinung natürlich und direkt wieder, ohne die politische Aussage auszudeuten.
- source_word: שֵׁבֶט הַדָּנִי
  choice: der Stamm der Daniter
  rationale: Die Formulierung bezeichnet den von Dan abstammenden Stammesverband und bewahrt dessen kollektiven Charakter.
- source_word: מְבַקֵּשׁ לוֹ
  choice: suchte ... für sich
  rationale: Das Partizip beschreibt eine andauernde Suche; das rückbezügliche „für sich“ entspricht dem grammatisch singularischen Bezug auf „Stamm“.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Im Zusammenhang der Stammesgebiete bezeichnet das Wort das als bleibenden Besitz zugeteilte Land. „Erbbesitz“ bewahrt sowohl den territorialen als auch den erb- und bundestheologischen Klang.
- source_word: לָשֶׁבֶת
  choice: um sich dort niederzulassen
  rationale: Im Kontext der Landsuche geht es nicht nur um Wohnen, sondern um die dauerhafte Ansiedlung in einem Gebiet.
- source_word: כִּי לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: denn ... war ihm ... noch kein Erbbesitz zugefallen
  rationale: „Zugefallen“ bewahrt das hebräische Bild des Zufallens bei einer Landzuteilung und ist zugleich idiomatisches Deutsch; „noch“ macht die bis zu diesem Zeitpunkt fortbestehende Lage deutlich.
- source_word: עַד הַיּוֹם הַהוּא
  choice: bis zu jenem Tag
  rationale: Die Wendung wahrt die rückblickende Erzählperspektive und entspricht dem zeitlichen Bezug des Hebräischen.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: unter den Stämmen Israels
  rationale: Dies ist die natürliche deutsche Wiedergabe der Einordnung innerhalb der Gesamtheit der israelitischen Stämme.
theological_decisions:
- issue: Die Aussage „Es gab keinen König in Israel“
  choice: Als historisch-politische Feststellung ohne interpretierenden Zusatz wiedergegeben.
  alternative: Die Formel ausdrücklich als Kritik an der Richterzeit oder als Befürwortung des Königtums kennzeichnen.
  rationale: Der hebräische Text nennt den Zustand, legt hier aber dessen theologische oder politische Bewertung nicht ausdrücklich fest. Die Übersetzung wahrt diese Spannung.
- issue: נַחֲלָה als Stammesland und Erbbesitz
  choice: „Erbbesitz“
  alternative: „Gebiet“, „Landbesitz“ oder „Landanteil“
  rationale: „Erbbesitz“ erhält die im Wort liegende Verbindung von Landzuteilung, dauerhaftem Besitz und Weitergabe, ohne eine bestimmte konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbbesitz“ und „zugefallen“ bewahren die zentrale Land- und Zuteilungsterminologie; „sich dort niederzulassen“ verdeutlicht den territorialen Zusammenhang ohne unnötige Altertümlichkeit.
