  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: de
  text: 'Da sagten sie zu ihm: „Sei still[a], leg deine Hand auf den Mund und komm mit uns. Sei uns Vater[b] und Priester. Was ist besser für dich: Priester für das Haus eines einzelnen Mannes zu sein oder Priester für einen Stamm und eine Sippe[c] in Israel?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schweig!“ Das hebräische Verb kann hier auch mit „Sei ruhig“ oder „Verstumme“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: „Vater“ ist hier keine Bezeichnung biologischer Verwandtschaft, sondern ein Titel für eine soziale oder religiöse Leitungs- und Vertrauensstellung.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Großfamilie“. Das hebräische Wort bezeichnet einen verwandtschaftlichen Verband innerhalb eines Stammes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: Sei still
  rationale: Der Imperativ von חרשׁ fordert hier zum Schweigen auf. „Sei still“ ist im modernen Deutschen natürlich und bewahrt die Schärfe der Aufforderung.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: leg deine Hand auf den Mund
  rationale: Die konkrete Geste des Schweigens oder der Selbstbeherrschung bleibt bildhaft und quellennah erhalten.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: Sei uns Vater und Priester
  rationale: Die beiden Rollen werden ohne interpretierende Verengung wiedergegeben; die knappe Dativkonstruktion entspricht dem Hebräischen und klingt würdevoll.
- source_word: לְאָב
  choice: Vater
  rationale: Der wörtliche kulturelle Titel bleibt erhalten. Deutungen wie „Berater“, „Schutzherr“ oder „Anführer“ würden die Bedeutung vorzeitig festlegen.
- source_word: כֹהֵן
  choice: Priester
  rationale: Dies ist die übliche und kontextuell eindeutige Wiedergabe von כֹהֵן.
- source_word: הֲטוֹב
  choice: Was ist besser für dich
  rationale: Obwohl טוֹב formal „gut“ bedeutet, stellt die Frage zwei Möglichkeiten vergleichend gegenüber; „besser“ macht diesen im Satz angelegten Vergleich idiomatisch deutlich.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: im Haus eines einzelnen Mannes
  rationale: „Haus“ bewahrt die mögliche Bedeutungsspanne von Gebäude, Haushalt und Hausverband; „eines einzelnen Mannes“ hebt den Kontrast zur größeren Gemeinschaft hervor.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: für einen Stamm und eine Sippe in Israel
  rationale: שֵׁבֶט bezeichnet den Stamm; מִשְׁפָּחָה bezeichnet hier einen verwandtschaftlichen Teilverband und wird deshalb mit „Sippe“ wiedergegeben, ohne beide sozialen Ebenen gleichzusetzen.
- source_word: עִמָּנוּ
  choice: mit uns
  rationale: Direkte und eindeutige Wiedergabe der Präpositionalverbindung.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Da sagten sie zu ihm
  rationale: „Da“ führt die fortlaufende Erzählung im Deutschen natürlich weiter und gibt die narrative Folgefunktion des Waw wieder.
theological_decisions:
- issue: „Vater“ als sozial-religiöser Titel
  choice: Der Titel „Vater“ wird wörtlich beibehalten.
  alternative: Berater, Schutzherr oder Anführer
  rationale: Der Text verbindet „Vater“ mit „Priester“, ohne die genaue Funktion näher zu definieren. Die wörtliche Wiedergabe bewahrt diese kulturelle und theologische Offenheit.
- issue: Bedeutung von מִשְׁפָּחָה
  choice: Wiedergabe mit „Sippe“ in Unterscheidung zu „Stamm“
  alternative: Familie
  rationale: „Sippe“ bezeichnet hier verständlich einen größeren Verwandtschaftsverband und erhält die im Vers erkennbare Abstufung vom Haus eines Mannes zu einer umfassenderen Gemeinschaft in Israel.
- issue: Bewertung der angebotenen Priesterrolle
  choice: Die vergleichende Frage wird wiedergegeben, ohne die nicht legitime Kultpraxis als theologisch gutzuheißen.
  alternative: Eine Formulierung, die die größere Priesterstelle ausdrücklich als gut oder rechtmäßig bezeichnet
  rationale: Die Sprecher stellen einen Vorteil heraus; der Erzähler bestätigt damit nicht, dass die religiöse Einrichtung rechtmäßig ist. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und nachdrücklich. Konkrete hebräische Bilder und kulturelle Titel werden bewahrt; erklärungsbedürftige Bedeutungen stehen in knappen Fußnoten.
