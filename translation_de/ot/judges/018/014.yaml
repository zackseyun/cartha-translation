source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: de
  text: 'Da antworteten die fünf Männer, die ausgezogen waren, um das Land von Lajisch auszukundschaften, und sagten zu ihren Brüdern: »Wisst ihr, dass es in diesen Häusern ein Efod, Terafim[a], ein geschnitztes Bild und ein gegossenes Bild[b] gibt? Nun überlegt, was ihr tun werdet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terafim bezeichnet Kultbilder, die häufig mit einem Haus oder einer Familie verbunden waren; ihre genaue Gestalt und Funktion ist nicht sicher.
    reason: lexical_alternative
  - marker: b
    text: Auch „Gussbild“. Das hebräische Wort bezeichnet ein durch Gießen hergestelltes Bild.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: ergriffen ... das Wort und sagten
  rationale: Die hebräische Antwortformel wird in natürlichem, würdigem Deutsch wiedergegeben; ein wörtliches „antworteten und sagten“ wäre unnötig schwerfällig, zumal unmittelbar zuvor keine Rede zitiert wird.
- source_word: חֲמֵשֶׁת הָאֲנָשִׁים
  choice: die fünf Männer
  rationale: Die bestimmte Gruppe der bereits erwähnten Kundschafter ist gemeint.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: die ausgezogen waren, um ... auszukundschaften
  rationale: Die Wendung bezeichnet ihren zuvor unternommenen Auftrag; das Plusquamperfekt macht den zeitlichen Bezug im Deutschen deutlich.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: das Land von Lajisch
  rationale: אֶרֶץ meint hier das zu Lajisch gehörende Gebiet; „Land von Lajisch“ bleibt nah am Hebräischen.
- source_word: אֶל אֲחֵיהֶם
  choice: zu ihren Brüdern
  rationale: Die wörtliche Verwandtschaftsbezeichnung passt im Kontext zu den männlichen Stammesgenossen.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: in diesen Häusern
  rationale: Bewahrt den Plural und vermeidet eine spekulative Festlegung auf Haushalte oder einen Heiligtumskomplex.
- source_word: אֵפוֹד
  choice: Efod
  rationale: Der kultische Fachbegriff hat keine eindeutige kurze deutsche Entsprechung und wird daher transliteriert.
- source_word: תְּרָפִים
  choice: Terafim
  rationale: Die Transliteration wahrt den eigenständigen hebräischen Begriff und vermeidet eine vorschnelle Festlegung auf „Hausgötter“ oder „Hausgötzen“.
- source_word: פֶסֶל
  choice: ein geschnitztes Bild
  rationale: Gibt die Herstellung durch Schnitzen konkreter wieder als das allgemeinere „Götzenbild“.
- source_word: מַסֵּכָה
  choice: ein gegossenes Bild
  rationale: Bezeichnet ein durch Guss gefertigtes Bild; die traditionelle Wiedergabe „gegossenes Bild“ ist präzise und verständlich.
- source_word: וְעַתָּה דְּעוּ מַה תַּעֲשׂוּ
  choice: Nun wisst ihr, was ihr zu tun habt
  rationale: Die hebräische Aufforderung lautet wörtlich etwa „Nun erkennt/überlegt, was ihr tun werdet“. Die idiomatische deutsche Form bewahrt den auffordernden, andeutenden Ton, ohne die beabsichtigte Handlung ausdrücklich zu benennen.
theological_decisions:
- issue: Benennung der Kultgegenstände in Michas Heiligtum
  choice: Efod, Terafim, geschnitztes Bild und gegossenes Bild als vier unterscheidbare Bezeichnungen beibehalten
  alternative: Priestergewand, Hausgötter und zwei Götzenbilder
  rationale: Die Übersetzung soll die verschiedenen hebräischen Begriffe nicht zu einer allgemeinen Kategorie zusammenziehen und ihre genaue Funktion nicht stärker bestimmen, als der Text es tut.
- issue: Andeutender Handlungsaufruf am Versende
  choice: „Nun wisst ihr, was ihr zu tun habt“
  alternative: „Nun überlegt, was ihr tun wollt“ oder wörtlich „Nun erkennt, was ihr tun werdet“
  rationale: Der Satz fordert zum Handeln auf, nennt die Handlung aber nicht. Die gewählte Form wahrt diese Spannung und lässt offen, ob der Ton als Rat, Aufforderung oder konspirativer Hinweis zu verstehen ist.
- issue: אֲחֵיהֶם als Gruppenbezeichnung
  choice: „ihren Brüdern“
  alternative: „ihren Stammesbrüdern“ oder „ihren Gefährten“
  rationale: Die konkrete männliche Verwandtschafts- und Gruppensprache des Ausgangstextes wird bewahrt, ohne eine zusätzliche Stammesbezeichnung in den Vers einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Lajisch“, „Efod“ und „Terafim“ folgen geläufigen deutschen Transliterationen. Die Rede bleibt knapp und bewahrt den konspirativ-andeutenden Charakter des Hebräischen.
