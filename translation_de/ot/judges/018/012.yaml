base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: de
  text: Sie zogen hinauf und lagerten bei Kirjat-Jearim in Juda. Deshalb nannte man diesen Ort Machane-Dan[a], und so heißt er bis heute. Siehe, er liegt westlich von Kirjat-Jearim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Machane-Dan bedeutet »Lager Dans«.
    reason: Erläutert den bedeutungstragenden hebräischen Ortsnamen.
  - marker: b
    text: 'Wörtlich: hinter Kirjat-Jearim.'
    reason: Bewahrt die konkrete räumliche Ausdrucksweise des Hebräischen und macht die Deutung als Himmelsrichtung transparent.
lexical_decisions:
- source_word: מַחֲנֵה דָן
  choice: Machane-Dan
  rationale: Der Ortsname wird als Eigenname lautnah wiedergegeben; seine Bedeutung wird in einer Fußnote erklärt.
- source_word: אַחֲרֵי
  choice: westlich von
  rationale: Wörtlich bedeutet das Wort hier „hinter“. Da Richtungsangaben aus der nach Osten gewandten Perspektive formuliert werden können, bezeichnet „hinter“ den Westen; die wörtliche Lesart bleibt in der Fußnote sichtbar.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt das ausdrückliche hebräische Hinweiswort in knapper, würdiger Form.
- source_word: עַל כֵּן קָרְאוּ
  choice: Deshalb nannte man
  rationale: Das unbestimmte Subjekt des hebräischen Plurals wird im Deutschen idiomatisch mit „man“ wiedergegeben.
