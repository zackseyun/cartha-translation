  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: de
  text: 'Da sagten sie zu ihm: »Befrage doch Gott, damit wir erfahren, ob unser Weg, den wir gehen, Erfolg haben wird.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Da sagten sie zu ihm
  rationale: Das narrative Wayyiqtol führt die nächste Handlung fort. »Da« gibt den Erzählfluss im modernen Deutschen natürlich wieder, ohne eine stärkere zeitliche Folgerung zu behaupten.
- source_word: שְׁאַל נָא
  choice: Befrage doch
  rationale: שׁאל bezeichnet hier das Einholen göttlicher Auskunft; נָא mildert die Aufforderung. »doch« vermittelt diese höflich-bittende Nuance idiomatisch.
- source_word: בֵאלֹהִים
  choice: Gott
  rationale: Bei שׁאל bezeichnet die Präposition ב die Instanz, bei der Auskunft eingeholt wird. Im unmittelbaren Kontext ist die singularische Bedeutung von אֱלֹהִים am natürlichsten.
- source_word: וְנֵדְעָה
  choice: damit wir erfahren
  rationale: Die Kohortativform drückt hier Zweck beziehungsweise beabsichtigtes Ergebnis aus. »erfahren« passt zur erbetenen Auskunft besser als das statischere »wissen«.
- source_word: הֲתַצְלִיחַ
  choice: ob … zum Erfolg führt
  rationale: Das Hifil von צלח bezeichnet Gelingen oder Erfolg. Da grammatisch דֶּרֶךְ das Subjekt ist, wahrt »zum Erfolg führt« diesen Bezug und klingt im Deutschen natürlich.
- source_word: דַּרְכֵּנוּ
  choice: der Weg
  rationale: Wörtlich steht »unser Weg«. In der deutschen Relativkonstruktion »der Weg, den wir gehen« ist die Zugehörigkeit bereits ausgedrückt; »unser Weg, den wir gehen« wäre schwerfällig. »Weg« bewahrt zudem das hebräische Bild.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: den wir gehen
  rationale: Die Wendung beschreibt den Weg, auf dem sie unterwegs sind. Das idiomatische deutsche »einen Weg gehen« bewahrt das Bild ohne die unnatürliche Formulierung »auf dem wir gehen«.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים
  choice: Gott (Singular)
  alternative: Götter
  rationale: אֱלֹהִים ist der Form nach mehrdeutig, doch im Kontext einer durch den Priester eingeholten göttlichen Auskunft ist die singularische Referenz am wahrscheinlichsten. Die Übersetzung fügt keine konfessionelle Deutung hinzu.
translation_notes:
  register: Moderne, würdige Standardsprache mit natürlichem Erzählfluss. Die direkte Rede bleibt knapp und verständlich; das Wegbild des Hebräischen wird erhalten.
