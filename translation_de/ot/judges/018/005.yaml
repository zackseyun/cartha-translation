  naturalness: „Da sagten sie zu ihm“ und „Befrage doch Gott“ sind natürliches, angemessen würdiges modernes Deutsch. „unser Weg, den wir gehen“ ist trotz der Wiederaufnahme idiomatisch und bewahrt die hebräische Bildsprache.
