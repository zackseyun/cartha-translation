source:
  edition: WLC
  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: de
  text: Niemand rettete sie, denn die Stadt lag weit von Sidon entfernt, und ihre Bewohner standen mit niemandem in Verbindung. Sie lag in dem Tal, das zu Bet-Rehob gehörte.[a] Dann bauten sie die Stadt wieder auf und wohnten darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dem Tal bei Bet-Rehob“. Die hebräische Wendung ist verkürzt; die Präposition kann statt Zugehörigkeit auch räumliche Nähe bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: rettete
  rationale: Das Hifil-Partizip von נצל bezeichnet jemanden, der aus Gefahr rettet. Die finite Formulierung „Niemand rettete sie“ gibt die hebräische Existenzkonstruktion im Deutschen natürlich wieder; „sie“ bezieht sich aus dem Zusammenhang auf die Bewohner der Stadt.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: die Stadt lag weit von Sidon entfernt
  rationale: Das feminine Pronomen bezieht sich auf die Stadt. Die ausdrückliche Wiederaufnahme mit „die Stadt“ verhindert im Deutschen eine mehrdeutige Zuordnung und „lag … entfernt“ ist eine natürliche geografische Formulierung.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: ihre Bewohner standen mit niemandem in Verbindung
  rationale: Die wörtlich elliptische Wendung „für sie war keine Sache mit einem Menschen“ bezeichnet hier soziale oder politische Isolation. Die gewählte Formulierung ist verständlich, ohne völlige Abwesenheit menschlichen Kontakts zu behaupten.
- source_word: אָדָם
  choice: niemandem
  rationale: אָדָם ist hier generisch gebraucht; „niemandem“ trifft die Funktion im negierten Satz idiomatisch und ohne unnötige geschlechtliche Markierung.
- source_word: בָּעֵמֶק
  choice: in dem Tal
  rationale: עֵמֶק bezeichnet gewöhnlich ein Tal oder Tiefland; „Tal“ ist hier die naheliegende geografische Wiedergabe.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: das zu Bet-Rehob gehörte
  rationale: Die elliptische Konstruktion mit לְ kann Zugehörigkeit oder räumliche Beziehung ausdrücken. Im Haupttext steht die wahrscheinliche territoriale Bedeutung; die mögliche räumliche Bedeutung wird in der Fußnote bewahrt.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: Dann bauten sie die Stadt wieder auf
  rationale: Das hebräische Verb bedeutet formal „bauen“. Da die Stadt unmittelbar zuvor niedergebrannt wurde, bringt „wieder aufbauen“ die im Kontext vorausgesetzte Bedeutung im Deutschen klar zum Ausdruck.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: und wohnten darin
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise dauerhafte Ansiedeln. „Wohnten darin“ ist modern, klar und nahe an der hebräischen Aussage.
- source_word: בֵית רְחוֹב
  choice: Bet-Rehob
  rationale: Der Ortsname wird in einer im Deutschen üblichen, quellennahen Umschrift wiedergegeben.
theological_decisions: []
