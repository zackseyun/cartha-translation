base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: de
  text: Da brachen sechshundert Mann aus der Sippe der Daniter von dort auf, aus Zora und Eschtaol, mit Kriegswaffen ausgerüstet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Kriegswaffen gegürtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brachen … auf
  rationale: נסע bezeichnet hier im fortlaufenden Erzählstil das Aufbrechen und Losziehen; „aufbrechen“ ist natürliches modernes Deutsch.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Gibt das Ortsadverb direkt und idiomatisch wieder.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: aus der Sippe der Daniter
  rationale: מִשְׁפָּחָה bezeichnet eine verwandtschaftliche Untereinheit des Stammes; „Sippe“ wahrt diese Ebene besser als „Stamm“ und klingt im historischen Kontext angemessen.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: von Zora und Eschtaol
  rationale: Die Ortsnamen werden in etablierter deutscher Form wiedergegeben; die Präposition bezeichnet den Ausgangsort.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: sechshundert Mann
  rationale: אִישׁ bezeichnet in der Zahl- und Militärangabe erwachsene Männer; „Mann“ ist im Deutschen nach Zahlwörtern idiomatisch.
- source_word: חָגוּר כְּלֵי מִלְחָמָה
  choice: mit Kriegswaffen gegürtet
  rationale: 'Die bewusst konkrete hebräische Wendung wird formal und verständlich bewahrt: חָגוּר bedeutet „gegürtet“, כְּלֵי מִלְחָמָה militärische Waffen beziehungsweise Ausrüstung.'
