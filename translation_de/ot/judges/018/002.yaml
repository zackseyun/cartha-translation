source:
  edition: WLC
  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: de
  text: 'Da sandten die Söhne Dans fünf tüchtige Männer aus ihrer Sippe, aus ihrer Mitte, aus Zora und Eschtaol, um das Land auszukundschaften und zu erforschen. Sie sagten zu ihnen: »Geht und erforscht das Land!« So kamen sie ins Bergland Ephraims bis zum Haus Michas[a] und übernachteten dort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus Michas« kann auch Michas gesamtes Anwesen oder Hauswesen gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: die Söhne Dans
  rationale: Gibt die hebräische Stammes- und Verwandtschaftsbezeichnung formal transparent wieder; »Daniter« wäre idiomatischer, würde aber das Bild der Abstammung einebnen.
- source_word: מִמִּשְׁפַּחְתָּם
  choice: aus ihrer Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier eine größere Verwandtschaftsgruppe innerhalb des Stammes; »Sippe« trifft diese soziale Ebene besser als das modern engere »Familie«.
- source_word: מִקְצוֹתָם
  choice: aus ihrer Mitte
  rationale: 'Die Wendung ist partitiv zu verstehen: Die Männer wurden aus der Gesamtgruppe ausgewählt. Eine wörtliche Wiedergabe mit »Enden« wäre im Deutschen irreführend.'
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: tüchtige Männer
  rationale: Die Wendung kann Stärke, Tapferkeit, Befähigung oder Tatkraft ausdrücken. Im Zusammenhang der Erkundungsmission vermittelt »tüchtige Männer« ihre Eignung, ohne die mögliche militärische Nuance auszuschließen.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: aus Zora und Eschtaol
  rationale: Gebräuchliche deutsche Umschrift der Ortsnamen.
- source_word: לְרַגֵּל
  choice: auszukundschaften
  rationale: Das Verb bezeichnet gezielte Erkundung beziehungsweise Spionage; »auskundschaften« bewahrt diesen Zweck im natürlichen Deutschen.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: zu erforschen / erforscht
  rationale: חקר bezeichnet gründliches Untersuchen. Die einheitliche Wiedergabe wahrt die Wiederholung des hebräischen Stammes und unterscheidet sie von רגל.
- source_word: הַר אֶפְרַיִם
  choice: das Bergland Ephraims
  rationale: Die Bezeichnung meint das ephraimitische Hochland, nicht einen einzelnen Berg.
- source_word: עַד בֵּית מִיכָה
  choice: bis zum Haus Michas
  rationale: עַד bezeichnet das erreichte Ziel beziehungsweise die räumliche Ausdehnung; בֵּית kann sowohl das Gebäude als auch den zugehörigen Hausverband oder Anwesenkomplex meinen.
- source_word: וַיָּלִינוּ שָׁם
  choice: und übernachteten dort
  rationale: לון bezeichnet hier das Verbringen der Nacht; »übernachteten« ist knapp und gegenwärtig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem hebräischen Erzählfluss, wird jedoch für natürliche deutsche Lesbarkeit leicht gegliedert. Die beiden Verben für Erkundung bleiben lexikalisch unterschieden; die Mehrdeutigkeit von בֵּית wird in einer Fußnote bewahrt.
