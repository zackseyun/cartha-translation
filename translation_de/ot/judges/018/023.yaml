base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: de
  text: 'Da riefen sie den Danitern[a] zu. Diese wandten sich um und sagten zu Micha: »Was ist mit dir, dass du laut gerufen hast?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Dans“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass du geschrien hast?“ / „dass du einen Aufschrei erhoben hast?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל בְּנֵי דָן
  choice: Da riefen sie den Danitern nach
  rationale: קרא bezeichnet hier einen hörbaren Zuruf; aus dem Erzählzusammenhang ergibt sich, dass Michas Leute den bereits weiterziehenden Danitern nachrufen. „Daniter“ gibt בְּנֵי דָן im heutigen Deutsch natürlich wieder.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: Die drehten sich um
  rationale: Die wörtliche Wendung „sie wandten ihre Gesichter“ ist im Deutschen unnatürlich; „drehten sich um“ gibt die Handlung klar wieder.
- source_word: לְמִיכָה
  choice: Micha
  rationale: Übliche deutsche Form des Eigennamens; die Präposition wird durch das Verb „fragen“ syntaktisch aufgenommen.
- source_word: מַה לְּךָ
  choice: Was ist mit dir
  rationale: Die idiomatische Frage erkundigt sich nach dem Anlass seines Verhaltens. Die knappe deutsche Wendung bewahrt dabei den direkten, konfrontativen Ton.
- source_word: כִּי נִזְעָקְתָּ
  choice: dass du ein solches Geschrei erhebst
  rationale: Das Nifal von זעק kann ein lautes Rufen, Klagegeschrei oder einen Aufschrei bezeichnen. „Geschrei erheben“ passt zum spöttisch-konfrontativen Kontext, ohne die Ursache des Rufens näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Daniter“ vermeidet die im heutigen Deutsch sperrige wörtliche Stammesbezeichnung; die Fußnote bewahrt deren Form. Der direkte Ton der Rede bleibt erhalten.
