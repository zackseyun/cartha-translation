- from: 'Er sagte zu ihnen: „So und so hat Micha für mich gehandelt: Er hat mich angestellt, und ich bin sein Priester geworden.“'
  to: 'Er sagte zu ihnen: „Micha hat dies und das für mich getan[a], er hat mich in seinen Dienst genommen, und ich bin sein Priester geworden.“'
  rationale: Die Revision verbessert die idiomatische Wiedergabe der hebräischen Formel כָּזֹה וְכָזֶה עָשָׂה לִי und präzisiert die Anwerbung durch שכר, ohne den Aussagegehalt zu erweitern. Die Mehrdeutigkeit von היה hinsichtlich »sein/werden« bleibt durch die im narrativen Zusammenhang gut begründete Formulierung »bin ... geworden« erhalten. Die Fußnote dokumentiert die summarische Funktion der Formel.
