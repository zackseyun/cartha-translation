  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Micha hat dies und das für mich getan[a], er hat mich in seinen Dienst genommen, und ich bin sein Priester geworden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „so und so“; eine hebräische Wendung, die zuvor geschilderte Handlungen zusammenfasst, ohne sie zu wiederholen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Er sagte zu ihnen
  rationale: Die Wayyiqtol-Form führt die Antwort des Leviten in der fortlaufenden Erzählung ein; im Deutschen ist kein zusätzliches einleitendes „Und“ nötig.
- source_word: כָּזֹה וְכָזֶה
  choice: so und so
  rationale: Die hebräische Wendung fasst bereits bekannte Vorgänge zusammen, ohne sie nochmals aufzuzählen. „So und so“ bewahrt diese unbestimmte, rückverweisende Funktion in natürlichem Deutsch.
- source_word: עָשָׂה לִי
  choice: hat … für mich gehandelt
  rationale: עשה mit ל beschreibt hier, was Micha in Bezug auf beziehungsweise zugunsten des Leviten getan hat. „Für mich gehandelt“ gibt die Relation wieder, ohne die Einzelheiten zu ergänzen.
- source_word: מִיכָה
  choice: Micha
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: Er hat mich angestellt
  rationale: Das Verb bezeichnet die entlohnte Anstellung des Leviten. „Angestellt“ klingt im modernen Deutschen hier natürlicher als „gemietet“ und hält den Beschäftigungscharakter fest.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: und ich bin sein Priester geworden
  rationale: היה kann „sein“ oder „werden“ bedeuten; in der Abfolge nach der Anstellung bezeichnet es plausibel den Eintritt in eine neue Funktion. „Sein Priester“ gibt die persönliche Zuordnung zu Micha knapp wieder.
theological_decisions:
- issue: Priesterliche Funktion in einem irregulären Kultzusammenhang
  choice: sein Priester
  alternative: Priester für ihn
  rationale: לוֹ לְכֹהֵן bezeichnet den Dienst für Micha in priesterlicher Funktion. Die Übersetzung gibt diese persönliche Zuordnung wieder, ohne die Rechtmäßigkeit des Kultes zu bestätigen oder zu bestreiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt gliedert die zusammenfassende Wendung und ihre konkret genannten Folgen. Die eigentümliche Unbestimmtheit des hebräischen Idioms bleibt erhalten.
