  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: de
  text: Da wandten sie sich um und zogen weiter. Die kleinen Kinder, das Vieh und ihre Habe[a] stellten sie vor sich auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ihren Besitz“, „ihr Gepäck“ oder „ihre kostbaren Güter“. Das hebräische Wort bezeichnet hier mitgeführten Besitz, nicht „Herrlichkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie stellten/setzten … vor sich“ beziehungsweise „vor ihnen“. Auch: „sie ordneten … vor sich an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: sie wandten sich um
  rationale: פנה bezeichnet hier eine Richtungsänderung; „sich umwenden“ gibt den Grundsinn im Erzählzusammenhang natürlich wieder.
- source_word: וַיֵּלֵכוּ
  choice: sie zogen weiter
  rationale: הלך setzt die Bewegung fort. „Weiterziehen“ passt natürlich zu einer wandernden Gruppe mit Kindern, Vieh und Besitz.
- source_word: וַיָּשִׂימוּ
  choice: sie ließen … hergehen
  rationale: שׂים bedeutet wörtlich „setzen/stellen/platzieren“. In Verbindung mit Menschen und Vieh gibt „vor sich hergehen lassen“ die konkrete Anordnung beim Weiterziehen im Deutschen natürlicher wieder.
- source_word: הַטַּף
  choice: die kleinen Kinder
  rationale: טף bezeichnet die Kleinen beziehungsweise die jungen, nicht kämpfenden Angehörigen der Gruppe; „die kleinen Kinder“ bewahrt diesen Sinn.
- source_word: הַמִּקְנֶה
  choice: das Vieh
  rationale: מקנה umfasst den Tierbestand beziehungsweise die Herdentiere allgemein; „Vieh“ ist im Deutschen breit genug und kontextgerecht.
- source_word: הַכְּבוּדָּה
  choice: ihre Habe
  rationale: כבודה meint hier mitgeführten Besitz oder wertvolle Güter. „Habe“ bezeichnet beweglichen Besitz, ohne die unpassende Grundbedeutung „Herrlichkeit“ einzutragen.
- source_word: לִפְנֵיהֶם
  choice: vor sich her
  rationale: Die Wendung bedeutet wörtlich „vor ihnen“. Das reflexive „vor sich her“ macht im Deutschen klar, dass Kinder, Vieh und Habe vor der ziehenden Gruppe angeordnet wurden.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Habe“ ist leicht gehoben, aber geläufig und im Reisekontext präzise; die dynamische Formulierung „vor sich hergehen lassen“ vermeidet die im Deutschen unnatürliche Vorstellung, Kinder und Vieh würden wie Gegenstände „hingestellt“.
