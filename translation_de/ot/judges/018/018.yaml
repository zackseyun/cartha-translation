  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: de
  text: 'Diese Männer gingen in Michas Haus und nahmen das Schnitzbild, den Efod[a], die Terafim und das gegossene Bild. Da sagte der Priester zu ihnen: »Was macht ihr?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut kann auch als »das Schnitzbild des Efods« verstanden werden. Nach Vers 17 sind Schnitzbild und Efod jedoch wahrscheinlich als zwei Gegenstände gemeint.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Diese Männer
  rationale: Das Demonstrativpronomen verweist im unmittelbaren Zusammenhang auf die fünf Männer. Die ausdrückliche Wiedergabe mit »Männer« macht den Bezug im Deutschen natürlich und klar.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: gingen in Michas Haus
  rationale: בוא bezeichnet hier zusammen mit dem Ziel die Bewegung in das Haus hinein. »Gingen in« folgt der Erzählperspektive und klingt im Deutschen natürlich.
- source_word: וַיִּקְחוּ
  choice: nahmen
  rationale: Die Grundbedeutung »nehmen« genügt; ein stärkeres Wort wie »rauben« würde die Handlung deutender wiedergeben als der hebräische Ausdruck.
- source_word: פֶּסֶל
  choice: Schnitzbild
  rationale: Der Ausdruck bezeichnet ein geschnitztes Kultbild. »Schnitzbild« bewahrt die konkrete Herstellungsart, ohne den Gegenstand lediglich mit dem allgemeineren Wort »Götze« zu bezeichnen.
- source_word: הָאֵפוֹד
  choice: den Efod
  rationale: Efod ist die etablierte Bezeichnung für einen kultischen Gegenstand beziehungsweise ein priesterliches Kleidungsstück. Eine nähere Festlegung wäre im Kontext der nicht legitimen Kultpraxis zu eng.
- source_word: הַתְּרָפִים
  choice: die Terafim
  rationale: Der kulturspezifische Begriff bleibt als verständliche biblische Sachbezeichnung erhalten. Er bezeichnet Haus- oder Kultbilder, deren genaue Form nicht sicher feststeht.
- source_word: הַמַּסֵּכָה
  choice: das gegossene Bild
  rationale: Das Substantiv bezeichnet ein durch Metallguss hergestelltes Bild. Die Formulierung ist gegenwärtig und erhält den Unterschied zum Schnitzbild.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: Da sagte der Priester zu ihnen
  rationale: »Da« gibt die fortschreitende Erzählfolge des Waw-Konsekutivs idiomatisch wieder.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: Was macht ihr da?
  rationale: Die deutsche Wendung gibt die unmittelbare, alarmierte Frage natürlich wieder. Das idiomatische »da« fügt keine eigenständige Ortsangabe hinzu.
theological_decisions:
- issue: Wiedergabe der kultischen Gegenstände
  choice: Die einzelnen Gegenstände werden mit »Schnitzbild«, »Efod«, »Terafim« und »gegossenes Bild« unterschieden.
  alternative: Alle Gegenstände pauschal als »Götzenbilder« wiederzugeben.
  rationale: Der hebräische Text zählt verschiedene Kultgegenstände auf. Ihre Unterscheidung wird bewahrt, ohne ihre Funktion oder Gestalt über das sprachlich Gesicherte hinaus festzulegen.
- issue: Verhältnis von פֶּסֶל und הָאֵפוֹד
  choice: 'Im Haupttext als zwei aufgezählte Gegenstände: »das Schnitzbild, den Efod«.'
  alternative: 'Als Genitivverbindung: »das Schnitzbild des Efods«.'
  rationale: Der unmittelbare Parallelvers 18,17 führt Schnitzbild und Efod ausdrücklich als getrennte Gegenstände auf. Die ungewöhnliche Formulierung des vorliegenden Verses lässt jedoch auch eine Genitivlesart zu; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählführung. Kulturspezifische Begriffe werden nicht konfessionell ausgedeutet; eine echte syntaktische Mehrdeutigkeit wird durch die Fußnote offengehalten.
