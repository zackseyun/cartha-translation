  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: de
  text: Da stellten die Söhne Dans das geschnitzte Bild für sich auf. Jonatan aber, der Sohn Gerschoms, des Sohnes Moses,[a] und seine Söhne waren Priester für den Stamm der Daniter bis zu dem Tag, an dem das Land in die Verbannung geführt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Mose“. In der masoretischen Überlieferung steht ein schwebend geschriebenes Nun, wodurch die traditionelle Lesung „Manasse“ entsteht.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: stellten … auf
  rationale: Der Hifil von קום bezeichnet hier das Aufstellen bzw. Errichten des Kultbildes; „aufstellen“ ist im Deutschen natürlich und sachlich genau.
- source_word: לָהֶם
  choice: für sich
  rationale: Die Dativform bezeichnet, dass die Daniter das Bild zu ihrem eigenen Gebrauch aufstellten.
- source_word: בְּנֵי דָן
  choice: die Söhne Dans
  rationale: Die formnahe Wiedergabe bewahrt die hebräische Bezeichnung und unterscheidet sie von der späteren gentilizischen Form „Daniter“.
- source_word: הַפָּסֶל
  choice: das geschnitzte Bild
  rationale: פֶּסֶל bezeichnet ein durch Schnitzen bzw. Behauen hergestelltes Bild; die Wiedergabe bleibt konkret, ohne die wertende Bedeutung von „Götzenbild“ zusätzlich einzutragen.
- source_word: וִיהוֹנָתָן
  choice: Jonatan
  rationale: Der Personenname wird nach üblicher deutscher Bibelnamenschreibung wiedergegeben.
- source_word: בֶּן גֵּרְשֹׁם
  choice: der Sohn Gerschoms
  rationale: Direkte und idiomatische Wiedergabe der genealogischen Verbindung.
- source_word: בֶּן מְהוּא
  choice: des Sohnes Moses
  rationale: Die Grundgestalt des masoretischen Konsonantentextes verweist auf Mose; das schwebend geschriebene Nun ermöglicht die traditionelle Lesung „Manasse“. Die Hauptlesart steht im Text, die Alternative in der Fußnote.
- source_word: וּבָנָיו
  choice: und seine Söhne
  rationale: Zusammen mit „Jonatan“ bildet die Wortgruppe das Subjekt von „waren Priester“; die deutsche Satzstellung macht dies deutlich.
- source_word: כֹהֲנִים
  choice: Priester
  rationale: Standardentsprechung im kultischen Zusammenhang.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: für den Stamm der Daniter
  rationale: „Für“ gibt den Dienst zugunsten des Stammes wieder; „Daniter“ bewahrt die gentilizische Form הַדָּנִי.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: bis zu dem Tag, an dem das Land in die Verbannung geführt wurde
  rationale: Die Formulierung gibt die ungewöhnliche und knappe hebräische Wendung verständlich wieder, ohne festzulegen, welches historische Exil gemeint ist.
theological_decisions:
- issue: Genealogische Identifizierung von Jonatans Vorfahren
  choice: Sohn Moses
  alternative: Sohn Manasses
  rationale: Der masoretisch überlieferte Text bewahrt durch ein schwebendes Nun bewusst eine Spannung zwischen „Mose“ und der traditionellen Lesung „Manasse“. Der Haupttext folgt der zugrunde liegenden Lesung „Mose“, während die alternative Überlieferung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Übersetzung bleibt bei den Stammesbezeichnungen und der genealogischen Angabe formnah, formuliert den abschließenden Ausdruck zur Verbannung jedoch in verständlichem Deutsch. Die historische Zuordnung der Verbannung wird bewusst offengelassen.
