  terminology: „geschnitztes Bild“, „Priester“, „Stamm der Daniter“ und die Namensformen Jonatan, Gerschom und Mose sind sachgerecht. Die Fußnote bildet die masoretische Besonderheit korrekt und neutral ab, ohne die alternative Lesung dogmatisch zu entscheiden.
