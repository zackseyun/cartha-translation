  source_fidelity: 'Der deutsche Text gibt die wesentlichen hebräischen Elemente zuverlässig wieder: die Daniten stellen das geschnitzte Bild zu ihrem eigenen Gebrauch auf; Jonatan wird als Sohn Gerschoms und Nachkomme Moses bezeichnet; er und seine Söhne dienen als Priester; die zeitliche Schlussangabe bleibt hinsichtlich des gemeinten Exils offen. „Das Land in die Verbannung geführt wurde“ ist eine verständliche Entfaltung der knappen, syntaktisch ungewöhnlichen Wendung גְּלוֹת הָאָרֶץ, ohne eine konkrete historische Zuordnung festzulegen.'
