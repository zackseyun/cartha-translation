source:
  edition: WLC
  text: וְ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ חֲגוּרִים֙ כְּלֵ֣י מִלְחַמְתָּ֔/ם נִצָּבִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר אֲשֶׁ֖ר מִ/בְּנֵי דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: de
  text: Und die sechshundert Männer, mit ihren Kriegswaffen ausgerüstet, standen am Eingang des Tores; sie gehörten zu den Söhnen Dans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie waren Daniter“. Wörtlich: „sie waren von den Söhnen Dans“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: Und die sechshundert Männer
  rationale: Das וְ führt die Erzählung weiter und wird natürlich mit „Und“ wiedergegeben. אִישׁ steht nach der Zahl kollektiv; im Deutschen ist der Plural „Männer“ erforderlich.
- source_word: חֲגוּרִים כְּלֵי מִלְחַמְתָּם
  choice: mit ihren Kriegswaffen ausgerüstet
  rationale: חֲגוּרִים bedeutet wörtlich „gegürtet“, bezeichnet hier aber das Tragen militärischer Ausrüstung. „Ausgerüstet“ gibt diesen Sinn idiomatisch wieder; „Kriegswaffen“ bewahrt die ausdrückliche militärische Bestimmung von כְּלֵי מִלְחָמָה.
- source_word: נִצָּבִים
  choice: standen
  rationale: Das Partizip beschreibt die Männer in stehender beziehungsweise postierter Haltung. „Standen“ ist im deutschen Erzählstil natürlich und lässt offen, ob sie ausdrücklich als Wachen aufgestellt waren.
- source_word: פֶּתַח הַשָּׁעַר
  choice: am Eingang des Tores
  rationale: 'Die Formulierung gibt beide Substantive wieder: פֶּתַח als „Eingang“ und שַׁעַר als „Tor“.'
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: sie gehörten zu den Söhnen Dans
  rationale: Die Wendung identifiziert die Männer als Angehörige der Nachkommenschaft beziehungsweise Stammesgruppe Dans. „Söhne Dans“ bewahrt die hebräische Verwandtschaftsbezeichnung; die Fußnote nennt die natürliche ethnische Wiedergabe.
theological_decisions: []
