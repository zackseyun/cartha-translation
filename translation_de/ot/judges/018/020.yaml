  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: de
  text: Da wurde dem Priester froh ums Herz, und er nahm das Efod, die Hausgötzen[a] und das geschnitzte Bild[b] und kam mitten unter das Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Terafim“. Der hebräische Ausdruck bezeichnet Hausgottheiten oder kultisch verwendete Gegenstände im häuslichen Bereich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Götzenbild“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: Da wurde dem Priester froh ums Herz
  rationale: Die natürliche deutsche Wendung bewahrt das hebräische Bild vom froh bzw. gut werdenden Herzen und gibt zugleich die Bedeutung wieder, dass der Priester erfreut war.
- source_word: הָאֵפוֹד
  choice: das Efod
  rationale: Der kultische Fachbegriff wird in seiner etablierten deutschen Form wiedergegeben, da eine knappe und eindeutige Sachentsprechung fehlt.
- source_word: הַתְּרָפִים
  choice: die Hausgötzen
  rationale: Der Ausdruck bezeichnet kultisch verwendete Hausgottheiten oder entsprechende Kultbilder. „Hausgötzen“ ist verständlich und vermeidet, die genaue Beschaffenheit der Gegenstände stärker festzulegen, als der Text es erlaubt.
- source_word: הַפָּסֶל
  choice: das Schnitzbild
  rationale: פסל bezeichnet ein durch Schnitzen oder Behauen hergestelltes Bild. „Schnitzbild“ bewahrt diesen konkreten Aspekt; „Götzenbild“ wäre ebenfalls möglich, aber stärker wertend.
- source_word: בְּקֶרֶב הָעָם
  choice: mitten unter die Leute
  rationale: Die Formulierung gibt sowohl die Bewegung als auch die räumliche Bedeutung „in die Mitte, mitten unter“ idiomatisch wieder. Im Kontext bezeichnet העם die versammelte Gruppe und nicht notwendig ein ganzes Volk.
