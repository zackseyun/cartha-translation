    issue: Register von „Leute“
    rationale: Die Wendung „mitten unter die Leute“ ist verständlich, aber etwas umgangssprachlicher als der übrige Text. הָעָם ist hier als bestimmte versammelte Gruppe bzw. als „Volk“ wiederzugeben.
  - severity: low
    issue: „Schnitzbild“ ist weniger transparent
    rationale: Das Wort ist zwar verständlich, aber weniger geläufig und kann enger an Holzschnitzerei denken lassen. „Das geschnitzte Bild“ ist im modernen Standarddeutsch klarer und bildet die konkrete Bezeichnung פֶּסֶל angemessen ab.
  revised_text: Da wurde dem Priester froh ums Herz, und er nahm das Efod, die Hausgötzen[a] und das geschnitzte Bild[b] und kam mitten unter das Volk.
