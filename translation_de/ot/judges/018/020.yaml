revisions:
- from: Da wurde dem Priester froh ums Herz, und er nahm das Efod, die Hausgötzen[a] und das Schnitzbild[b] und ging mitten unter die Leute.
  to: Da wurde dem Priester froh ums Herz, und er nahm das Efod, die Hausgötzen[a] und das geschnitzte Bild[b] und kam mitten unter das Volk.
  rationale: 'Die Revision beschränkt sich auf zwei stilistisch-lexikalische Präzisierungen: „Volk“ ersetzt das umgangssprachlichere „Leute“, und „das geschnitzte Bild“ ersetzt das weniger geläufige „Schnitzbild“. Die Bedeutung, die Reihenfolge der Gegenstände und die mit dem Hebräischen vereinbare Offenheit bleiben erhalten.'
