review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Begriffe des Hebräischen zutreffend wieder: Der Priester freut sich, nimmt Efod, Terafim und das geschnitzte Bild und begibt sich in die Mitte der Gruppe. „Hausgötzen“ ist für תְּרָפִים eine vertretbare, verständliche Wiedergabe; die Fußnote wahrt die sachliche Offenheit. Für פֶּסֶל sollte die deutsche Formulierung jedoch unmittelbarer erkennen lassen, dass ein geschnitztes bzw. gehauenes Bild gemeint ist.'
  naturalness: „Da wurde dem Priester froh ums Herz“ ist idiomatisch und bewahrt das hebräische Herzbild. „Mitten unter die Leute“ klingt im modernen Deutsch eher umgangssprachlich; „mitten unter das Volk“ entspricht dem würdig-sachlichen Register und dem bestimmten הָעָם besser. „Das geschnitzte Bild“ ist geläufiger und transparenter als das weniger gebräuchliche Kompositum „Schnitzbild“.
  terminology: „Efod“ ist die etablierte deutsche Wiedergabe. „Hausgötzen“ und „geschnitztes Bild“ unterscheiden die beiden im Hebräischen getrennt genannten Gegenstände angemessen. Die Alternative „Götzenbild“ in der Fußnote ist möglich, sollte aber nicht den Haupttext bestimmen, weil „geschnitztes Bild“ die Herstellungsweise von פֶּסֶל genauer abbildet.
  issues:
