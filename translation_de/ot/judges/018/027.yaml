base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: de
  text: Sie nahmen also das mit, was Micha angefertigt hatte, ebenso den Priester, der zu ihm gehörte. Dann zogen sie gegen Lajisch, gegen ein Volk, das ruhig und sicher lebte. Sie schlugen sie mit der Schneide des Schwertes[a] und verbrannten die Stadt mit Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Mund des Schwertes“; eine hebräische Redewendung für die Schneide des Schwertes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: Sie nahmen also mit
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor und führt die Erzählung weiter. „Also“ gibt den folgernden Anschluss natürlich wieder; „mitnehmen“ passt sowohl zu den Kultgegenständen als auch zum Priester.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: was Micha angefertigt hatte
  rationale: Die relative Wendung wird idiomatisch wiedergegeben. „Angefertigt“ verweist sachlich auf die zuvor genannten Kultgegenstände, ohne sie hier ausdrücklich aufzuzählen.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: ebenso den Priester, der bei ihm gewesen war
  rationale: Das hebräische היה לוֹ bezeichnet eine Zuordnung zu Micha. „Bei ihm gewesen war“ bewahrt diese Beziehung, ohne ein Eigentumsverhältnis über eine Person nahezulegen.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: Dann zogen sie gegen Lajisch
  rationale: בוא על bezeichnet im militärischen Zusammenhang eine feindliche Bewegung gegen einen Ort. „zogen ... gegen“ wahrt diese Bedeutung, ohne den folgenden Angriff vorwegzunehmen.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: und seine ruhigen und sorglosen Bewohner
  rationale: עַם meint hier die Bevölkerung von Lajisch. שֹׁקֵט bezeichnet Ruhe, בֹטֵחַ ein Gefühl der Sicherheit; „sorglos“ bringt in diesem Angriffskontext die unbesorgte Sicherheit natürlich zum Ausdruck.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Sie schlugen sie
  rationale: נכה kann schlagen, niederschlagen oder töten bedeuten. Die zurückhaltende Wiedergabe „schlugen“ erhält die lexikalische Breite; der Schwertausdruck verdeutlicht die tödliche Gewalt.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die wörtlich „mit dem Mund des Schwertes“ lautende feste Wendung bezeichnet die Schwertschneide. „Mit der Schärfe des Schwertes“ bleibt bildnah und ist im Deutschen verständlich.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: und brannten die Stadt nieder
  rationale: Die Verbindung „mit Feuer verbrennen“ ist im Deutschen redundant; „niederbrennen“ gibt Handlung und vollständige Verwüstung natürlich und prägnant wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Gewalt wird sachlich und ohne beschönigende Zusätze wiedergegeben. Der Ortsname wird in der im Deutschen üblichen Form „Lajisch“ geschrieben.
