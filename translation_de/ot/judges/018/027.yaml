  to: Sie nahmen also das mit, was Micha angefertigt hatte, ebenso den Priester, der zu ihm gehörte. Dann zogen sie gegen Lajisch, gegen ein Volk, das ruhig und sicher lebte. Sie schlugen sie mit der Schneide des Schwertes[a] und verbrannten die Stadt mit Feuer.
