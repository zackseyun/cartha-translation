  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: de
  text: 'Dann kamen sie zu ihren Brüdern[a] nach Zora und Eschtaol. Ihre Brüder fragten sie: »Was ist mit euch?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu ihren Verwandten«. Das hebräische Wort für »Brüder« kann hier auch Angehörige derselben Sippe oder desselben Stammes bezeichnen, nicht nur leibliche Brüder.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Frage ist sehr knapp und elliptisch, wörtlich etwa: »Was, ihr?« Gemeint ist wahrscheinlich eine Aufforderung, über ihre Lage oder ihre Erkundung zu berichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dann kamen sie
  rationale: Das Wayyiqtol von בוא führt die Erzählung weiter; »Dann« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: אֶל אֲחֵיהֶם
  choice: zu ihren Brüdern
  rationale: אָח kann sowohl leibliche Brüder als auch Verwandte beziehungsweise Angehörige derselben Sippe oder Stammesgruppe bezeichnen. »Brüder« bewahrt die konkrete hebräische Ausdrucksweise; die weitere Bedeutung wird in einer Fußnote genannt.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: nach Zora und Eschtaol
  rationale: Die Ortsnamen werden in ihren gebräuchlichen deutschen biblischen Formen wiedergegeben. »Nach« bezeichnet hier idiomatisch das Ziel der Bewegung.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: Ihre Brüder fragten sie
  rationale: Das Verb אמר bedeutet grundsätzlich »sagen«, leitet hier jedoch eine direkte Frage ein; »fragten« ist im Deutschen natürlich und erhält das ausdrücklich genannte Subjekt.
- source_word: מָה אַתֶּם
  choice: Was ist mit euch?
  rationale: Die hebräische Frage ist äußerst knapp und elliptisch, wörtlich etwa »Was, ihr?«. Die deutsche Formulierung bewahrt die Offenheit, ohne den vermutlich erbetenen Bericht ausdrücklich in den Text einzutragen.
