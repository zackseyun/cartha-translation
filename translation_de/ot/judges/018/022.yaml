  text: הֵ֥מָּה הִרְחִ֖יקוּ מִ/בֵּ֣ית מִיכָ֑ה וְ/הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר בַּ/בָּתִּים֙ אֲשֶׁר֙ עִם בֵּ֣ית מִיכָ֔ה נִֽזְעֲק֔וּ וַ/יַּדְבִּ֖יקוּ אֶת בְּנֵי דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: de
  text: Als sie sich ein gutes Stück von Michas Haus entfernt hatten, wurden die Männer, die in den Häusern nahe bei Michas Haus waren, zusammengerufen[a], und sie holten die Söhne Dans ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlugen Alarm“. Das hebräische Verb kann sowohl einen Alarmruf als auch das dadurch ausgelöste Zusammenrufen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen greift die zuvor genannten Daniten auf; im Deutschen genügt das Subjektpronomen.
- source_word: הִרְחִיקוּ מִבֵּית מִיכָה
  choice: sich schon ein Stück von Michas Haus entfernt hatten
  rationale: Die Form von רחק bezeichnet hier das Gewinnen räumlicher Entfernung. „Ein Stück“ gibt den erzählerischen Sinn natürlich wieder, ohne eine große Entfernung vorauszusetzen.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das hebräische Wort bezeichnet ausdrücklich Männer und wird entsprechend konkret wiedergegeben.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: die in den Häusern nahe bei Michas Haus waren
  rationale: עִם drückt hier räumliche Nähe beziehungsweise Zuordnung aus. Die Wiedergabe wahrt sowohl die Häuser als auch deren Nähe zu Michas Haus.
- source_word: נִזְעֲקוּ
  choice: wurden zusammengerufen
  rationale: Der Niphal von זעק kann das Zusammenrufen beziehungsweise Sichsammeln infolge eines Hilferufs bezeichnen. Der Zusammenhang der anschließenden Verfolgung stützt diese Wiedergabe; die mögliche Bedeutung „Alarm schlagen“ bleibt in der Fußnote erhalten.
- source_word: וַיַּדְבִּיקוּ
  choice: und sie holten … ein
  rationale: Das Verb bezeichnet das Aufholen und Erreichen der vorausgehenden Gruppe; „einholen“ ist dafür im modernen Deutschen präzise und idiomatisch.
- source_word: אֶת בְּנֵי דָן
  choice: die Söhne Dans
  rationale: Die formale Verwandtschaftsbezeichnung des Hebräischen wird bewahrt; gemeint sind die Angehörigen des Stammes Dan.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die etwas ausführliche Beschreibung der benachbarten Häuser bleibt nahe an der hebräischen Satzstruktur; die genuine Mehrdeutigkeit von נִזְעֲקוּ wird durch eine Fußnote offengehalten.
