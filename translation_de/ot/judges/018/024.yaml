  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: de
  text: 'Er sagte[a]: »Ihr habt meine Götter, die ich gemacht habe, und den Priester genommen und seid fortgegangen. Was bleibt mir jetzt noch? Wie könnt ihr da zu mir sagen: ›Was ist denn mit dir los?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »mein Gott«. Das hebräische Wort kann je nach Zusammenhang Singular oder Plural bezeichnen; hier spricht der weitere Kontext eher für »meine Götter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: meine Götter
  rationale: Der Plural passt im Kontext zu Michas Kultgegenständen und bewahrt zugleich die im Hebräischen liegende Ironie, dass er seine Götter selbst gemacht hat. Da die Form in bestimmten Zusammenhängen auch singularisch verstanden werden kann, wird die Alternative in einer Fußnote genannt.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: die ich gemacht habe
  rationale: Die schlichte Wiedergabe von עשה bewahrt die pointierte Aussage, dass Micha die von ihm so bezeichneten Götter selbst hergestellt beziehungsweise herstellen lassen hat.
- source_word: לְקַחְתֶּם
  choice: ihr habt … genommen
  rationale: Das Perfekt bezeichnet die vollzogene Wegnahme mit fortdauernder Folge. Die deutsche Perfektform klingt in direkter Rede natürlich.
- source_word: הַכֹּהֵן
  choice: den Priester
  rationale: Der bestimmte Artikel wird beibehalten; gemeint ist der zuvor bei Micha dienende Priester.
- source_word: וַתֵּלְכוּ
  choice: und seid fortgegangen
  rationale: Die zweite Person Plural bleibt ausdrücklich erhalten. „Fortgegangen“ gibt die räumliche Trennung im Zusammenhang natürlich wieder.
- source_word: וּמַה לִּי עוֹד
  choice: Was bleibt mir jetzt noch?
  rationale: Diese natürliche deutsche Wendung drückt Michas Verlust und seine Klage aus; עוֹד wird durch „noch“ wiedergegeben, während „jetzt“ die gegenwärtige Folge hervorhebt.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: Wie könnt ihr da zu mir sagen
  rationale: Die idiomatische, entrüstete Frage wird im Deutschen als vorwurfsvoller Einwand wiedergegeben. „Da“ stellt den Folgerungsbezug zur vorherigen Klage her.
- source_word: מַה לָּךְ
  choice: Was ist mit dir?
  rationale: Knappes, natürliches deutsches Äquivalent der idiomatischen Frage nach dem Grund seiner Erregung.
theological_decisions:
- issue: Wiedergabe von אֱלֹהַי im Zusammenhang mit häuslichen Kultgegenständen
  choice: meine Götter
  alternative: mein Gott / meine Gottesbilder / meine Götzen
  rationale: „Götter“ wahrt den lexikalischen Wortlaut und die erzählerische Spannung, ohne die Gegenstände im Haupttext bereits deutend als „Götzen“ zu bezeichnen. Die mögliche Singular- beziehungsweise Bilddeutung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher direkter Rede. Die Entrüstung wird klar ausgedrückt, ohne den hebräischen Wortlaut unnötig zu glätten; die Anredeformen im Plural bleiben sichtbar.
