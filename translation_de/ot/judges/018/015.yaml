  text: וַ/יָּס֣וּרוּ שָׁ֔מָּ/ה וַ/יָּבֹ֛אוּ אֶל בֵּֽית הַ/נַּ֥עַר הַ/לֵּוִ֖י בֵּ֣ית מִיכָ֑ה וַ/יִּשְׁאֲלוּ ל֖/וֹ לְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: de
  text: Sie bogen dorthin ab und kamen zum Haus des jungen Leviten, zum Haus Michas. Sie fragten ihn, ob es ihm gut gehe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie begrüßten ihn“ beziehungsweise: „Sie erkundigten sich nach seinem Wohlergehen.“ Die hebräische Wendung spricht wörtlich davon, nach Frieden oder Wohlergehen zu fragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: Sie bogen dorthin ab
  rationale: סור bezeichnet hier das Abbiegen bzw. Verlassen des bisherigen Weges; שָׁמָּה hat eine richtungsanzeigende Bedeutung und wird daher mit „dorthin“ wiedergegeben.
- source_word: וַיָּבֹאוּ אֶל
  choice: und kamen zu
  rationale: בוא mit אֶל bezeichnet die Ankunft an einem Ziel. „Kamen zu“ bewahrt diese Bewegungsnuance, ohne ein tatsächliches Eintreten ausdrücklich zu behaupten.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: zum Haus des jungen Leviten
  rationale: נַעַר kennzeichnet ihn als jungen Mann, während הַלֵּוִי seine Zugehörigkeit zu den Leviten angibt. Die knappe deutsche Formulierung gibt beides natürlich wieder.
- source_word: בֵּית מִיכָה
  choice: zum Haus Michas
  rationale: Die wiederholte Hausbezeichnung steht appositionell und stellt klar, dass das Haus des jungen Leviten zu Michas Haus gehört bzw. damit gemeint ist. Die Wiederholung bleibt zur Wahrung der hebräischen Struktur erhalten.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: Sie fragten ihn, ob es ihm gut gehe
  rationale: Die Wendung שׁאל לְשָׁלוֹם bedeutet, sich nach dem Frieden bzw. Wohlergehen eines Menschen zu erkundigen. Die gewählte Form ist idiomatisches modernes Deutsch und bewahrt den Sinn einer Erkundigung nach seinem Befinden.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die appositionelle Wiederholung „zum Haus …, zum Haus …“ bewahrt die auffällige Struktur des Hebräischen; die idiomatische Friedensformel wird im Haupttext natürlich wiedergegeben und in der Fußnote erläutert.
