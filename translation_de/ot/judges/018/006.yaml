base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: de
  text: 'Und der Priester sagte zu ihnen: „Geht in Frieden! Der Weg, den ihr geht, liegt vor Jahwe.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Euer Weg ist vor Jahwes Augen. Die Formulierung besagt nicht unbedingt, dass Jahwe das Vorhaben ausdrücklich billigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Der Wayyiqtol führt die Erzählung weiter. „Und … sagte“ gibt den hebräischen Erzählfluss wieder, ohne eine genauere zeitliche Beziehung einzutragen.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der bestimmte Ausdruck bezeichnet den bereits aus dem Zusammenhang bekannten Priester.
- source_word: לְכוּ לְשָׁלוֹם
  choice: Geht in Frieden!
  rationale: Die Verbindung ist eine übliche Segens- oder Abschiedsformel. Die deutsche Wendung bewahrt sowohl den Imperativ als auch den friedvollen, zusprechenden Klang.
- source_word: נֹכַח
  choice: liegt vor
  rationale: נֹכַח bezeichnet hier die Lage vor beziehungsweise in der Gegenwart von jemandem. „Liegt vor“ bleibt nahe am Bild des Hebräischen und vermeidet eine ausdrückliche Zusage von Billigung oder Erfolg.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: דַּרְכְּכֶם
  choice: der Weg … ihr
  rationale: דֶּרֶךְ bedeutet wörtlich „Weg“ und bezeichnet im Zusammenhang zugleich die Reise der Männer. Die Zuordnung zu ihnen wird im Deutschen durch den Relativsatz natürlich ausgedrückt.
- source_word: אֲשֶׁר תֵּלְכוּ בָהּ
  choice: den ihr geht
  rationale: Der Relativsatz bezieht sich auf den Weg. Die Formulierung ist idiomatisches modernes Deutsch und erhält das hebräische Bild des Gehens auf einem Weg.
theological_decisions:
- issue: Aussagekraft der Worte des Priesters über Jahwe und den Weg der Daniter
  choice: „Der Weg, den ihr geht, liegt vor Jahwe.“
  alternative: „Jahwe heißt euren Weg gut“ oder „Euer Weg steht unter Jahwes Schutz.“
  rationale: נֹכַח יְהוָה sagt unmittelbar, dass ihr Weg vor beziehungsweise in der Gegenwart Jahwes liegt. Der Wortlaut erklärt nicht ausdrücklich, dass Jahwe das Vorhaben billigt, schützt oder ihm Erfolg zusichert; diese Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede klingt natürlich, während „liegt vor Jahwe“ bewusst die knappe und mehrdeutige Formulierung des Hebräischen bewahrt.
