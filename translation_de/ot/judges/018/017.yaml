  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: de
  text: Da gingen die fünf Männer hinauf, die ausgezogen waren, um das Land auszukundschaften. Sie kamen dorthin und nahmen das geschnitzte Bild, das Efod, die Hausgötter[a] und das gegossene Bild[b] an sich, während der Priester zusammen mit den sechshundert Männern, die mit Kriegswaffen ausgerüstet waren, am Eingang des Tores stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Terafim«; damit sind häusliche Kultobjekte oder Hausgötter gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: »Gussbild« oder »gegossenes Götterbild«. Gemeint ist ein durch Gießen hergestelltes Bild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: gingen hinauf
  rationale: Die Grundbedeutung von עלה ist »hinaufgehen«. Die räumliche Richtung bleibt im Kontext zwar unbestimmt, doch die Wiedergabe wahrt bewusst die hebräische Verbalwahl; die mögliche kontextuelle Bedeutung »hineingehen« wird in einer Fußnote genannt.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: die ausgezogen waren, um das Land auszukundschaften
  rationale: רגל bezeichnet hier eine gezielte Erkundung zu militärisch-strategischen Zwecken. Die vorzeitige Formulierung macht deutlich, dass dies der frühere Auftrag der fünf Männer war.
- source_word: בָּאוּ שָׁמָּה
  choice: Sie kamen dorthin
  rationale: Die schlichte Ortsangabe wird bewahrt, ohne ein im Hebräischen nicht ausdrücklich genanntes Gebäude als Ziel zu ergänzen.
- source_word: לָקְחוּ
  choice: nahmen … an sich
  rationale: לקח bedeutet gewöhnlich »nehmen«. »An sich nehmen« klingt im Deutschen in der Aufzählung natürlich und lässt den Erzählzusammenhang erkennen, ohne das Verb interpretierend als »stehlen« wiederzugeben.
- source_word: הַפֶּסֶל
  choice: das geschnitzte Bild
  rationale: פסל bezeichnet ein durch Schnitzen oder Behauen hergestelltes Bild. Die konkrete Herstellungsart bleibt sichtbar; »Götzenbild« wäre stärker wertend und »Schnitzbild« weniger allgemeinverständlich.
- source_word: הָאֵפוֹד
  choice: das Efod
  rationale: Der kulturspezifische Gegenstand wird transliteriert, da es keine eindeutige kurze deutsche Entsprechung gibt. Eine Präzisierung als ausschließlich priesterliches Kleidungsstück wäre an dieser Stelle zu eng.
- source_word: הַתְּרָפִים
  choice: die Hausgötter
  rationale: תרפים bezeichnet häusliche Kultobjekte beziehungsweise Hausgottheiten. »Hausgötter« ist verständlich; die Transliteration »Terafim« und die sachliche Bedeutungsbreite stehen in der Fußnote.
- source_word: הַמַּסֵּכָה
  choice: das gegossene Bild
  rationale: מסכה bezeichnet hier ein durch Gießen hergestelltes, gewöhnlich metallenes Bild. Die Formulierung ist modern und erhält den Gegensatz zum geschnitzten Bild.
- source_word: וְהַכֹּהֵן נִצָּב
  choice: während der Priester … stand
  rationale: Die Klausel beschreibt einen gleichzeitigen Begleitumstand zur Wegnahme der Gegenstände. »Während« gibt diese syntaktische Beziehung im Deutschen klar wieder.
- source_word: פֶּתַח הַשַּׁעַר
  choice: am Eingang des Tores
  rationale: Die Wiedergabe erhält sowohl פתח (Eingang, Öffnung) als auch שער (Tor), statt beide in »Toreingang« zusammenzuziehen.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: zusammen mit den sechshundert Männern, die mit Kriegswaffen ausgerüstet waren
  rationale: Der kollektive singularische Ausdruck wird im Deutschen idiomatisch pluralisch wiedergegeben. חגור bezeichnet das Umgegürtetsein beziehungsweise Ausgerüstetsein; die Formulierung vermittelt den militärischen Sinn ohne das heute altertümliche »gegürtet«.
theological_decisions:
- issue: Benennung der תְּרָפִים
  choice: Hausgötter
  alternative: Terafim / häusliche Kultbilder
  rationale: Die Übersetzung macht die kultische Funktion verständlich, ohne festzulegen, ob der Ausdruck primär die dargestellten Gottheiten oder die zugehörigen Kultobjekte bezeichnet; diese Unschärfe wird in der Fußnote offengelegt.
- issue: Wertung der Kultbilder
  choice: neutrale Gegenstandsbezeichnungen »geschnitztes Bild« und »gegossenes Bild«
  alternative: Götzenbild
  rationale: Der Vers selbst zählt die Gegenstände auf. Die stärker theologisch wertende Bezeichnung »Götze« wird daher nicht in die Lexeme hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kulturspezifische Bezeichnung »Efod« bleibt erhalten; sonst werden verständliche Gegenstandsbezeichnungen verwendet. Die lange hebräische Satzfolge wird zur besseren Lesbarkeit in zwei Sätze gegliedert, ohne die zeitliche und räumliche Beziehung der Handlungen aufzulösen.
