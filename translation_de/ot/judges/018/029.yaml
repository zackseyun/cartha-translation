  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: de
  text: Und sie nannten die Stadt Dan[a], nach Dan, ihrem Vater, der Israel als Sohn geboren worden war. Zuvor aber hatte die Stadt Lajisch geheißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihrem Vorfahren«; das hebräische Wort für »Vater« kann auch einen Stammvater bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: sie nannten die Stadt
  rationale: קרא mit שׁם bezeichnet hier die Namensgebung. Die natürliche deutsche Wendung gibt den Sinn der hebräischen Konstruktion wieder, ohne das schwerfällige »sie nannten den Namen der Stadt« nachzubilden.
- source_word: דָּן
  choice: Dan
  rationale: Der Personen- und Stadtname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בְּשֵׁם דָּן אֲבִיהֶם
  choice: nach Dan, ihrem Vater
  rationale: בְּשֵׁם bezeichnet hier die Benennung nach einer Person. אָב kann neben dem unmittelbaren Vater auch einen Vorfahren bezeichnen; die direkte Wiedergabe »Vater« bleibt im Haupttext erhalten.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: der Israel geboren worden war
  rationale: Die passive Form von ילד mit ל wird quellennah wiedergegeben. »Israel« bleibt entsprechend dem hebräischen Text stehen und wird nicht interpretierend durch »Jakob« ersetzt.
- source_word: וְאוּלָם
  choice: aber
  rationale: Die adversative Partikel markiert den Gegensatz zwischen dem neuen und dem früheren Namen; »aber« ist im Deutschen natürlich und prägnant.
- source_word: לַיִשׁ
  choice: Lajisch
  rationale: Der Ortsname wird nach üblicher deutscher Bibeltransliteration wiedergegeben.
- source_word: לָרִאשֹׁנָה
  choice: zuvor
  rationale: Der Ausdruck verweist auf den früheren Zustand vor der Umbenennung; »zuvor« gibt diesen zeitlichen Bezug idiomatisch wieder.
theological_decisions:
- issue: Genealogische Bezeichnung אֲבִיהֶם
  choice: ihrem Vater
  alternative: ihrem Vorfahren
  rationale: Das hebräische אָב kann einen Vater oder weiter gefasst einen Vorfahren bezeichnen. Der Haupttext bewahrt die konkrete Verwandtschaftsbezeichnung, während die Fußnote den hier sachlich naheliegenden weiteren Sinn kenntlich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Namensformel wird zugunsten natürlichen Deutschen als »die Stadt nennen« formuliert; die genealogische Mehrdeutigkeit wird durch eine Fußnote bewahrt.
