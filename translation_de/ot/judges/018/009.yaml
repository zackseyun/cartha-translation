  to: 'Da sagten sie: „Auf, lasst uns gegen sie hinaufziehen! Denn wir haben das Land gesehen, und siehe, es ist sehr gut. Und ihr schweigt! Seid nicht zu träge, hinzugehen, hineinzuziehen und das Land in Besitz zu nehmen!“'
