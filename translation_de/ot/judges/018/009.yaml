base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: de
  text: 'Da sagten sie: „Auf, lasst uns gegen sie hinaufziehen! Denn wir haben das Land gesehen, und siehe, es ist sehr gut. Und ihr schweigt! Seid nicht zu träge, hinzugehen, hineinzuziehen und das Land in Besitz zu nehmen!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: Auf
  rationale: Die Aufforderung dient hier idiomatisch als Aufbruchsruf; „Auf“ gibt sie in natürlichem, würdigem Deutsch wieder.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: lasst uns gegen sie hinaufziehen
  rationale: Bewahrt sowohl die militärische Bedeutung von עַל als auch das Bewegungsverb עלה.
- source_word: מַחְשִׁים
  choice: ihr zögert noch
  rationale: Im Kontext bezeichnet das Schweigen bzw. Untätigbleiben ein Zögern; die Frageform gibt den vorwurfsvollen Impuls des Satzes natürlich wieder.
- source_word: אַל תֵּעָצְלוּ
  choice: Seid nicht zu träge
  rationale: Gibt die Warnung vor Nachlässigkeit oder mangelnder Entschlossenheit direkt wieder.
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: loszuziehen, in das Land zu kommen und es in Besitz zu nehmen
  rationale: Erhält die dreigliedrige Abfolge der Infinitive, ohne sie im Deutschen unnötig hölzern zu formulieren.
- source_word: טוֹבָה מְאֹד
  choice: wirklich sehr gut
  rationale: „Wirklich“ vermittelt zusammen mit „sehr gut“ die hervorhebende Wirkung von וְהִנֵּה und מְאֹד.
