  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: de
  text: Wenn ihr dort ankommt, werdet ihr auf ein Volk treffen, das sich sicher fühlt[a], und das Land ist weit[b]; denn Gott hat es in eure Hand gegeben – einen Ort, an dem es an nichts fehlt, was es im Land gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein Volk, das in Sicherheit lebt“ oder „ein argloses Volk“. Das Hebräische beschreibt Menschen, die sich sicher wissen oder sicher fühlen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „weit an Händen“; eine hebräische Redewendung für ein geräumiges, weitläufiges Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם תָּבֹאוּ
  choice: Wenn ihr dort ankommt, werdet ihr zu ... kommen
  rationale: Die Verbindung aus Infinitivkonstruktion und finitem Verb bezeichnet den Zeitpunkt des Eintreffens und bewahrt zugleich die Wiederholung des hebräischen Verbs, ohne im Deutschen unverständlich zu wirken.
- source_word: עַם בֹּטֵחַ
  choice: ein Volk, das sich sicher fühlt
  rationale: בֹּטֵחַ beschreibt das Sicherheitsgefühl des Volkes. Die Formulierung lässt offen, ob es tatsächlich geschützt oder lediglich arglos ist.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: Das Land ist weit
  rationale: Die hebräische Wendung bedeutet idiomatisch, dass das Land geräumig oder weitläufig ist. Das konkrete Bild der „Hände“ wird in einer Fußnote dokumentiert.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: denn Gott hat es in eure Hand gegeben
  rationale: Das Perfekt stellt die Übergabe aus Sicht der Kundschafter als bereits gewiss dar. Der kollektive Singular „Hand“ bewahrt die hebräische Wendung.
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: ein Ort, an dem es an nichts fehlt
  rationale: Die natürliche deutsche Formulierung gibt מַחְסוֹר als Mangel oder Fehlen wieder.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: was es im Land gibt
  rationale: הָאָרֶץ verweist im unmittelbaren Zusammenhang auf das besprochene Gebiet, nicht notwendig auf die ganze Erde.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים
  choice: Gott
  alternative: Götter / ein Gott
  rationale: Das zugehörige Verb steht im Singular; im Ausspruch der Kundschafter bezeichnet אֱלֹהִים daher Gott als den Handelnden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht entsprechend dem Hebräischen im Plural. Die Mehrdeutigkeit zwischen tatsächlicher Sicherheit und bloßer Arglosigkeit bleibt erhalten.
