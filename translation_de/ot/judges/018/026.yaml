base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: de
  text: Die Söhne Dans zogen ihres Weges. Als Micha sah, dass sie stärker waren als er, wandte er sich um und kehrte in sein Haus zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: die Söhne Dans
  rationale: Die im Hebräischen ethnisch gebrauchte familiäre Bezeichnung bleibt transparent erhalten; „Daniter“ wäre glatter, aber weniger formnah.
- source_word: לְדַרְכָּם
  choice: zogen ihres Weges
  rationale: Eine natürliche, würdige deutsche Wiedergabe dafür, dass sie ihren Weg fortsetzten.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: sie stärker waren als er
  rationale: Gibt die Vergleichskonstruktion mit מן direkt wieder, ohne sie deutend zu „zu stark für ihn“ zuzuspitzen.
- source_word: וַיִּפֶן
  choice: wandte er sich um
  rationale: Gibt die körperliche Richtungsänderung wieder und hält sie von der anschließenden Rückkehr unterschieden.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: kehrte in sein Haus zurück
  rationale: Bewahrt sowohl den Rückkehrgedanken von שׁוב als auch das ausdrückliche Ziel „sein Haus“.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: Entspricht der Grundbedeutung von בית genauer als das idiomatischere „nach Hause“.
