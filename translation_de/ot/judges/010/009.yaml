  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: de
  text: Dann überquerten die Ammoniter den Jordan, um auch gegen Juda, Benjamin und das Haus Ephraim zu kämpfen, und Israel geriet in sehr große Bedrängnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Israel war sehr bedrängt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: überschritten
  rationale: Mit אֶת הַיַּרְדֵּן als direktem Objekt bezeichnet עבר konkret das Überqueren des Jordan; „überschritten“ ist präzise und erzählerisch angemessen.
- source_word: בְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die übliche deutsche Volksbezeichnung gibt den hebräischen Ausdruck idiomatisch wieder.
- source_word: אֶת הַיַּרְדֵּן
  choice: den Jordan
  rationale: Die im Deutschen geläufige Bezeichnung benötigt den Zusatz „Fluss“ nicht.
- source_word: לְהִלָּחֵם
  choice: um … zu kämpfen
  rationale: Der Infinitiv bezeichnet hier den Zweck des Überschreitens und das Führen bewaffneter Auseinandersetzungen.
- source_word: גַּם
  choice: auch
  rationale: Das Wort erweitert den Angriff über die zuvor genannten Gebiete östlich des Jordan hinaus.
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: gegen Juda, Benjamin und das Haus Ephraim
  rationale: Die Präposition בְּ bezeichnet im Zusammenhang mit לְהִלָּחֵם die Ziele der Kampfhandlungen. „Haus Ephraim“ bewahrt das ausdrücklich vorhandene בֵּית.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: Dadurch geriet Israel in sehr große Bedrängnis
  rationale: Die unpersönliche feminine Verbform beschreibt, dass Israel in äußerste Enge beziehungsweise Not geriet. Die deutsche Umformung nennt Israel als betroffene Größe und gibt מְאֹד deutlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Ephraim“ erhält die soziale und territoriale Breite des hebräischen Ausdrucks; „Bedrängnis“ bewahrt das Bild bedrückender Not, ohne die Ursache enger als der Ausgangstext festzulegen.
