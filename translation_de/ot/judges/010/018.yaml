base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: de
  text: 'Und die Leute, die führenden Männer von Gilead, sagten zueinander: »Wer ist der Mann, der den Kampf gegen die Ammoniter beginnt? Er soll Oberhaupt aller Bewohner Gileads werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: das Volk, die führenden Männer von Gilead
  rationale: 'Die unverbundene Wortfolge lässt sich am ehesten appositionell verstehen: Das Volk wird hier durch seine führenden Männer näher bestimmt. Die Wiedergabe bewahrt beide hebräischen Bestandteile und vermeidet das im Deutschen missverständliche »das Volk der Obersten«.'
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: einer zum anderen
  rationale: Die distributive Wendung bedeutet wörtlich »ein Mann zu seinem Gefährten« und bezeichnet hier ein wechselseitiges Gespräch. »Einer zum anderen« ist idiomatisch und bleibt der Bildform des Hebräischen nahe.
- source_word: מִי הָאִישׁ
  choice: Wer ist der Mann
  rationale: Das ausdrücklich gesetzte אִישׁ wird beibehalten, da nach einem bestimmten männlichen Heerführer gefragt wird.
- source_word: יָחֵל לְהִלָּחֵם
  choice: den Kampf … beginnt
  rationale: Der Hifil von חלל bedeutet hier »beginnen«; zusammen mit dem Infinitiv von לחם ergibt sich im Deutschen natürlich »den Kampf beginnen«.
- source_word: בִּבְנֵי עַמּוֹן
  choice: gegen die Ammoniter
  rationale: Wörtlich steht »gegen die Söhne Ammons«; »Ammoniter« ist die übliche deutsche Bezeichnung des Volkes und gibt den ethnischen Sinn klar wieder.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: Er soll Oberhaupt … werden
  rationale: רֹאשׁ bezeichnet metaphorisch den führenden Mann. »Oberhaupt« bewahrt den Leitungsbegriff, und »werden« bringt die resultative Ernennung im Kontext zum Ausdruck.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: aller Bewohner Gileads
  rationale: Die substantivierte Partizipialform bezeichnet alle, die in Gilead wohnen; »Bewohner« ist gegenwärtiges, klares Standarddeutsch.
theological_decisions:
- issue: Ausdrücklich männliche Bezeichnung bei der Auswahl eines militärischen Führers
  choice: »der Mann« im Haupttext beibehalten
  alternative: »derjenige« oder »die Person«
  rationale: Der hebräische Text verwendet ausdrücklich אִישׁ, und der historische Zusammenhang betrifft die Bestimmung eines männlichen militärischen Führers. Eine geschlechtsneutrale Form würde dieses Merkmal unnötig einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionelle Konstruktion des Hebräischen bleibt sichtbar, wird aber durch »führende Männer« verständlich gemacht. »Oberhaupt« ist natürlicher als das wörtliche »Haupt«, ohne die politische Leitungsfunktion abzuschwächen.
