  text: וַֽ/יִּזְעֲקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל יְהוָ֖ה לֵ/אמֹ֑ר חָטָ֣אנוּ לָ֔/ךְ וְ/כִ֤י עָזַ֨בְנוּ֙ אֶת אֱלֹהֵ֔י/נוּ וַֽ/נַּעֲבֹ֖ד אֶת הַ/בְּעָלִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: de
  text: 'Da schrien die Israeliten zum HERRN[a]: »Wir haben gegen dich gesündigt, denn wir haben unseren Gott verlassen und den Baalen gedient.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: HERR steht hier für den hebräischen Gottesnamen JHWH.
    reason: Macht transparent, dass im Ausgangstext der Eigenname Gottes steht.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Bezeichnung gibt wörtlich »die Söhne Israels« natürlich und sachlich genau wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wird beibehalten; eine Fußnote weist auf den hebräischen Namen hin.
- source_word: וְכִי
  choice: denn
  rationale: Leitet hier die Begründung beziehungsweise Erläuterung des Sündenbekenntnisses ein, ohne die Aussage unnötig zu verengen.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Der hebräische Plural bezeichnet die verschiedenen örtlichen Erscheinungsformen beziehungsweise Kulte des Baal; der Plural bleibt im Deutschen erhalten.
theological_decisions:
- issue: Bezug von »unseren Gott« in der direkten Anrede
  choice: unseren Gott
  alternative: dich, unseren Gott
  rationale: Der hebräische Text nennt das Objekt ausdrücklich als »unseren Gott«, ohne es grammatisch mit »dich« gleichzusetzen. Die Übersetzung bewahrt diese Ausdrucksweise und vermeidet eine erklärende Ergänzung.
- issue: Verhältnis zwischen Sündenbekenntnis und Begründung
  choice: »gesündigt, denn wir haben …«
  alternative: »gesündigt, und zwar dadurch, dass wir …«
  rationale: »Denn« gibt die kausale beziehungsweise erläuternde Funktion von וְכִי natürlich wieder und lässt offen, ob das Folgende die Sünde begründet oder näher bestimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Da schrien« führt die Erzählung knapp fort; »die Israeliten« ist gegenüber dem wörtlichen »die Söhne Israels« im heutigen Deutsch natürlicher. Der Plural »Baalen« bewahrt die Form des hebräischen Textes.
