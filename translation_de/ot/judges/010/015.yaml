source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: de
  text: 'Da sagten die Israeliten zu Jahwe: „Wir haben gesündigt. Handle an uns nach allem, was in deinen Augen gut ist.[a] Nur rette uns doch heute!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach allem Guten in deinen Augen“; gemeint ist: nach allem, was du für gut hältst.'
    reason: Die Fußnote dokumentiert die hebräische Bildsprache und erläutert die idiomatische Bedeutung der Haupttextfassung.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sagten“ gibt diesen Fortgang in natürlichem Deutsch wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die deutsche Volksbezeichnung gibt den hebräischen Ausdruck natürlich und einschließlich des ganzen Volkes wieder; „Söhne Israels“ wäre hier unnötig missverständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: חָטָאנוּ
  choice: Wir haben gesündigt
  rationale: Das Perfekt formuliert das vollzogene Handeln als gegenwärtig relevantes Schuldbekenntnis.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: Tu mit uns
  rationale: Die direkte Form bewahrt sowohl den Imperativ als auch die vorbehaltlose Unterwerfung der Sprecher.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: was immer gut ist in deinen Augen
  rationale: Die Wendung bewahrt das hebräische Bild und gibt כְּכָל idiomatisch als uneingeschränkte Zustimmung zu Gottes Urteil wieder.
- source_word: אַךְ
  choice: Nur
  rationale: Die Partikel schränkt die vorausgehende Unterwerfung durch eine einzige dringende Bitte ein.
- source_word: הַצִּילֵנוּ
  choice: rette uns
  rationale: Der Hifil von נצל bezeichnet hier die Befreiung aus akuter Bedrängnis; „rette“ ist dafür natürlich und prägnant.
- source_word: נָא
  choice: doch
  rationale: Das Modalpartikel „doch“ vermittelt im deutschen Imperativ den flehentlichen Ton von נָא natürlicher als ein isoliertes „bitte“.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: „Heute“ gibt die zeitliche Unmittelbarkeit der hebräischen Wendung in modernem Deutsch präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname erhält diesen Unterschied gegenüber einem göttlichen Titel.
- issue: Umfang von בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Im Kontext bezeichnet die feste hebräische Wendung das Volk Israel als Kollektiv. Die natürliche deutsche Volksbezeichnung legt keine Beschränkung auf männliche Personen nahe.
- issue: Bedeutung von הַצִּילֵנוּ
  choice: rette uns
  alternative: befreie uns
  rationale: Beide Möglichkeiten bezeichnen Rettung aus Gefahr; „rette uns“ wahrt die Dringlichkeit, ohne eine weitergehende heilsgeschichtliche Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und eindringlicher Rede. Die hebräische Augen-Metapher bleibt im Haupttext erhalten; die Satzführung ist zugleich für heutige Leser natürlich.
