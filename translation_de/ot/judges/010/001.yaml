source:
  edition: WLC
  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: de
  text: Nach Abimelech trat Tola, der Sohn Puas, des Sohnes Dodos[a], auf, um Israel zu retten. Er war ein Mann aus Issachar und wohnte in Schamir im Bergland Ephraims.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Sohnes seines Onkels“. Das Hebräische בֶּן־דּוֹדוֹ kann „Sohn Dodos“ bedeuten, wenn Dodo ein Personenname ist, oder als Verwandtschaftsbezeichnung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: trat … auf
  rationale: In diesem erzählerischen Zusammenhang bezeichnet קום das Hervortreten eines neuen Retters. „Trat auf“ klingt im modernen Deutschen natürlich und legt keine förmliche Ernennung nahe.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: Nach Abimelech
  rationale: Die knappe Zeitangabe gibt die zeitliche Abfolge unmittelbar wieder.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: um Israel zu retten
  rationale: Das Hifil von ישׁע bedeutet „retten“ oder „befreien“. „Retten“ bewahrt die umfassende Aussage, ohne sie ausschließlich auf militärische Befreiung einzuengen.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Der Personenname wird in gebräuchlicher deutscher Form transkribiert.
- source_word: בֶּן־פּוּאָה
  choice: der Sohn Puas
  rationale: Die genealogische Verbindung wird klar und idiomatisch wiedergegeben; der Name Puah erhält die im Deutschen übliche Genitivform „Puas“.
- source_word: בֶּן־דּוֹדוֹ
  choice: des Sohnes Dodos
  rationale: Die masoretische Punktierung versteht Dodo hier als Personennamen und die Wendung als weitere genealogische Angabe. Die sprachlich mögliche appellativische Lesart wird in einer Fußnote erhalten.
- source_word: אִישׁ יִשָּׂשכָר
  choice: ein Mann aus Issachar
  rationale: Die Formulierung bleibt nahe am Hebräischen und bezeichnet verständlich Tolas Stammeszugehörigkeit.
- source_word: וְהוּא יֹשֵׁב
  choice: und wohnte
  rationale: Das Partizip beschreibt den Wohnort; „wohnte“ ist gegenwärtiges, natürliches Standarddeutsch.
- source_word: בְּשָׁמִיר
  choice: in Schamir
  rationale: Der Ortsname wird nach deutscher Bibeltradition als „Schamir“ wiedergegeben.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraims
  rationale: „Bergland“ bezeichnet die geografische Region treffender als das möglicherweise missverständliche „Gebirge“.
theological_decisions:
- issue: Art von Tolas Rettung Israels
  choice: „Israel zu retten“ ohne nähere Bestimmung
  alternative: „Israel militärisch zu befreien“
  rationale: Der hebräische Text nennt weder ausdrücklich einen Feind noch die Art der Rettung. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde leicht gegliedert, damit die mehrstufige Abstammungsangabe verständlich bleibt. Archaische Wendungen wie „er erhob sich“ oder „er wohnte daselbst“ wurden vermieden.
