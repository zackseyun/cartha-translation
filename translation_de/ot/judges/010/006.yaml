id: JDG.10.6
reference: Judges 10:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: de
  text: Und die Israeliten taten erneut, was böse war in den Augen Jahwes[a]. Sie dienten den Baalen und den Astarten, den Göttern Arams, den Göttern Sidons, den Göttern Moabs, den Göttern der Ammoniter[b] und den Göttern der Philister. Sie verließen Jahwe und dienten ihm nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fuhren fort, zu tun, was böse war in den Augen Jahwes“. Das hebräische Verb kann Wiederholung oder Fortsetzung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Göttern der Söhne Ammons“, das heißt den Göttern, denen die Ammoniter dienten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: taten erneut
  rationale: יסף mit Infinitiv kann Wiederholung oder Fortsetzung ausdrücken. Im wiederkehrenden Erzählmuster des Richterbuchs gibt „taten erneut“ den zyklischen Sinn natürlich wieder; die mögliche Fortsetzungsbedeutung wird in Fußnote [a] bewahrt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung ist verständlicher und natürlicher als das im Deutschen missverständliche „die Söhne Israels“, ohne den Referenten zu verändern.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: taten ..., was böse war in den Augen Jahwes
  rationale: Bewahrt die hebräische Bewertungsmetapher „in den Augen“ und formuliert zugleich in natürlichem, würdigem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen; „Jahwe“ ist die im Deutschen etablierte Form.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: dienten / dienten ihm
  rationale: Die einheitliche Wiedergabe von עבד erhält den deutlichen Gegensatz zwischen dem Dienst an den fremden Göttern und dem unterlassenen Dienst an Jahwe.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Die Pluralform bezeichnet verschiedene lokale Erscheinungsformen beziehungsweise Kulte Baals; der Eigenname und der hebräische Plural bleiben erkennbar.
- source_word: הָעַשְׁתָּרוֹת
  choice: den Astarten
  rationale: „Astarten“ ist eine geläufige deutsche Wiedergabe des pluralischen Kultnamens und steht parallel zu „Baalen“.
- source_word: אֱלֹהֵי אֲרָם
  choice: den Göttern Arams
  rationale: Bewahrt den historischen Eigennamen Aram, statt ihn mit dem späteren geografischen Namen Syrien gleichzusetzen.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: den Göttern der Ammoniter
  rationale: Gibt die hebräische Wendung „Söhne Ammons“ im modernen Deutschen idiomatisch als Volksbezeichnung wieder; die wörtlichere Form wird in Fußnote [b] dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt seinen Charakter als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד im Götzendienstkontext
  choice: dienen
  alternative: verehren / anbeten
  rationale: „Dienen“ erhält die lexikalische und rhetorische Verbindung zwischen beiden Vorkommen des Verbs und umfasst sowohl kultische Verehrung als auch Loyalität.
- issue: Syntaktischer Bezug der Schlussaussage
  choice: „ihm“ bezieht sich auf Jahwe
  alternative: keine sachlich plausible Alternative im Kontext
  rationale: Das maskuline Singularsuffix in עֲבָדוּהוּ nimmt Jahwe als unmittelbaren singularischen Bezug auf und bildet den Gegensatz zum Dienst an den zuvor genannten Göttern.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die wiederholte Reihung „den Göttern ...“ bildet die eindringliche hebräische Aufzählung nach, während „Israeliten“ und „Ammoniter“ unnötig wörtliche, im Deutschen missverständliche Abstammungsformeln vermeiden.
