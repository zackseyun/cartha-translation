lexical_decisions:
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: Er war … Richter über Israel
  rationale: שׁפט bezeichnet im Richterbuch die Tätigkeit eines Richters, der Israel leitete. Die substantivische deutsche Wendung bewahrt die wiederkehrende Amtsbezeichnung und klingt natürlicher als „er richtete Israel“.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: dreiundzwanzig Jahre lang
  rationale: Die moderne deutsche Zahlform gibt die Dauer genau und idiomatisch wieder; „lang“ verdeutlicht die Zeitspanne.
- source_word: וַיָּמָת
  choice: Dann starb er
  rationale: Das narrative וַ führt die Handlung zeitlich weiter. „Dann“ drückt die Abfolge natürlich aus, ohne einen Gegensatz einzutragen.
- source_word: וַיִּקָּבֵר
  choice: wurde … begraben
  rationale: Die Nifal-Form wird als Passiv wiedergegeben, ohne einen Handelnden zu ergänzen.
- source_word: בְּשָׁמִיר
  choice: in Schamir
  rationale: Die Präposition בְּ ist hier lokal; der Ortsname wird in üblicher deutscher Transliteration wiedergegeben.
