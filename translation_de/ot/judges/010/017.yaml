base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: de
  text: Da wurden die Ammoniter zusammengerufen und lagerten in Gilead.[a] Auch die Israeliten versammelten sich und lagerten bei Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da stießen die Ammoniter einen Ruf aus und lagerten in Gilead.« Das hebräische Verb bedeutet gewöhnlich »schreien/rufen«, kann hier im militärischen Zusammenhang aber das Zusammenrufen zum Kampf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: Da wurden ... zusammengerufen
  rationale: צעק bedeutet gewöhnlich »schreien/rufen«. Im militärischen Zusammenhang und vor dem anschließenden Lagern bezeichnet die Form wahrscheinlich das Zusammenrufen zum Kampf. Da die Grundbedeutung weiterhin möglich ist, wird sie in einer Fußnote bewahrt.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die wörtliche Wendung »Söhne Ammons« bezeichnet hier das Volk der Ammoniter; die gebräuchliche deutsche Volksbezeichnung gibt den Bezug natürlich und eindeutig wieder.
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: חנה bezeichnet das Aufschlagen eines Lagers. »lagerten« ist im erzählenden und militärischen Zusammenhang natürlich und präzise.
- source_word: בַּגִּלְעָד
  choice: in Gilead
  rationale: Gilead ist hier eine Region; daher entspricht »in Gilead« der Präposition und dem deutschen Sprachgebrauch.
- source_word: וַיֵּאָסְפוּ
  choice: versammelten sich
  rationale: Die Nifalform von אסף beschreibt hier das Sichsammeln beziehungsweise Zusammenkommen der Israeliten.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Bezeichnung »Söhne Israels« meint hier das Volk Israel. »die Israeliten« ist im modernen Deutschen natürlich, umfassend und referenzgenau.
- source_word: בַּמִּצְפָּה
  choice: bei Mizpa
  rationale: Bei einem Ort als Lager- und Sammelpunkt ist »bei Mizpa« idiomatisch und lässt offen, ob das Lager innerhalb oder im unmittelbaren Umfeld der Siedlung lag.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte hebräische Erzählweise wird mit »Da« und »Auch« flüssig wiedergegeben. Die mögliche Mehrdeutigkeit von צעק bleibt durch die Fußnote sichtbar; der Ortsname מִצְפָּה wird in der etablierten deutschen Form »Mizpa« wiedergegeben.
