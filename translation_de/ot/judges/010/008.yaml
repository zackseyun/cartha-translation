  text: וַֽ/יִּרְעֲצ֤וּ וַ/יְרֹֽצְצוּ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/שָּׁנָ֖ה הַ/הִ֑יא שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה שָׁנָ֗ה אֶֽת כָּל בְּנֵ֤י יִשְׂרָאֵל֙ אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן בְּ/אֶ֥רֶץ הָ/אֱמֹרִ֖י אֲשֶׁ֥ר בַּ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: de
  text: In jenem Jahr zerschlugen und zermalmten sie die Israeliten[b]; achtzehn Jahre lang unterdrückten sie alle Israeliten jenseits des Jordan, im Land der Amoriter, das in Gilead liegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist hier knapp und ungewöhnlich gebaut: Nach „in jenem Jahr“ folgt ohne wiederholtes Verb „achtzehn Jahre“. Gemeint sein kann, dass die Bedrängnis in jenem Jahr einsetzte und insgesamt achtzehn Jahre dauerte.'
    reason: textual_syntax
  - marker: b
    text: 'Oder: „brachen und bedrängten“. Das Hebräische verbindet zwei kraftvolle, bedeutungsnahe Verben und verstärkt so die Schwere der Unterdrückung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ וַיְרֹצְצוּ
  choice: zerschlugen und zermalmten
  rationale: Die beiden kraftvollen, nahezu synonymen Verben werden als anschauliches Wortpaar wiedergegeben, damit die steigernde Wirkung des Hebräischen erhalten bleibt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt die hebräische Wendung natürlich und präzise wieder; ihre Wiederholung im Vers bleibt erhalten.
- source_word: בַּשָּׁנָה הַהִיא
  choice: in jenem Jahr
  rationale: Nahe und zugleich natürlich formulierte Wiedergabe der Zeitangabe.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: achtzehn Jahre lang
  rationale: „Lang“ kennzeichnet im Deutschen eindeutig die Dauer der Bedrängnis.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bewahrt die räumliche Perspektive des Hebräischen, ohne eine Himmelsrichtung festzulegen.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: im Land der Amoriter
  rationale: Der hebräische Singular bezeichnet hier kollektiv das Gebiet der Amoriter; die deutsche Pluralform ist die übliche geografische Bezeichnung.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: das in Gilead liegt
  rationale: Der Relativsatz wird ausdrücklich beibehalten und auf das Land der Amoriter bezogen.
theological_decisions:
- issue: Verhältnis von „in jenem Jahr“ zur Dauer von achtzehn Jahren
  choice: Zwei aufeinander bezogene Sätze; im zweiten wird „unterdrückten sie“ sinngemäß ergänzt.
  alternative: 'Die Zeitangaben unmittelbar zusammenziehen: „in jenem Jahr – achtzehn Jahre lang“.'
  rationale: Der hebräische Satz ist stark verdichtet und wiederholt für die achtzehn Jahre kein Verb. Die Ergänzung macht die fortdauernde Bedrängnis im Deutschen verständlich, ohne festzulegen, dass beide Zeitangaben identisch seien; die syntaktische Schwierigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Gewalt des hebräischen Verbpaares bleibt erhalten; die schwerfällige wörtliche Wiedergabe „Söhne Israels“ wird zugunsten des üblichen „Israeliten“ vermieden. Die verdichtete Zeitsyntax wird lesbar gemacht und zugleich in einer Fußnote transparent gehalten.
