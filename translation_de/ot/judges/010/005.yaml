lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Verb מות bezeichnet hier in der schlichten Erzählform den Tod; „starb“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: יָאִיר
  choice: Jaïr
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert; das Trema macht kenntlich, dass a und i getrennt gesprochen werden.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Der Niphal von קבר ist passiv und wird im Deutschen idiomatisch mit „wurde begraben“ wiedergegeben.
- source_word: בְּקָמוֹן
  choice: in Kamon
  rationale: Die Präposition בְּ bezeichnet hier den Ort der Bestattung; „in Kamon“ ist im Deutschen die naheliegende Ortsangabe.
