source:
  edition: WLC
  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: de
  text: Da entfernten sie die fremden Götter aus ihrer Mitte und dienten Jahwe. Da konnte er Israels Not nicht länger ertragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da wurde er wegen Israels Not ungeduldig.“ Wörtlich: „Da wurde seine Seele kurz angesichts der Not Israels.“ Die hebräische Wendung kann ausdrücken, dass jemand ungeduldig wird oder etwas nicht länger ertragen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: entfernten
  rationale: Der Hifil von סור bezeichnet hier das Wegschaffen beziehungsweise Entfernen; „entfernten“ ist modern und bewahrt die konkrete Handlung.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: die fremden Götter
  rationale: Die Wendung bezeichnet fremde, nichtisraelitische Gottheiten; „fremde Götter“ ist klar und im Deutschen geläufig.
- source_word: מִקִּרְבָּם
  choice: aus ihrer Mitte
  rationale: Die räumlich-gemeinschaftliche Formulierung gibt das hebräische קֶרֶב knapp und treffend wieder.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: עבד umfasst gegenüber Gott sowohl Gottesdienst als auch Gehorsam und Loyalität; „dienten“ erhält diese Breite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: Da konnte er … nicht länger ertragen
  rationale: Wörtlich wird seine נֶפֶשׁ „kurz“; die deutsche idiomatische Wiedergabe drückt aus, dass Jahwe Israels Not nicht länger mitansehen beziehungsweise ertragen konnte, ohne das Bild unnatürlich zu übersetzen.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: Israels Not
  rationale: עָמָל bezeichnet hier Bedrängnis, Mühsal oder Elend; „Not“ passt prägnant zum erzählerischen Zusammenhang.
theological_decisions:
- issue: Anthropopathische Rede in וַתִּקְצַר נַפְשׁוֹ
  choice: „Da konnte er Israels Not nicht länger ertragen“
  alternative: „Da wurde er wegen Israels Not ungeduldig“
  rationale: Die Formulierung bewahrt Jahwes persönliche und emotionale Reaktion, legt die schwer deutbare Wendung aber im Kontext als Unvermögen aus, die Not länger zu ertragen. Die alternative Bedeutung „ungeduldig werden“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Erzählfolge; die schwierige Schlusswendung wird idiomatisch wiedergegeben und ihre echte Bedeutungsbreite durch die Fußnote erhalten.
