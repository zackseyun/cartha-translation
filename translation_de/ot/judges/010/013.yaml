source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: de
  text: Ihr aber habt mich verlassen und anderen Göttern gedient. Darum werde ich euch nicht länger retten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befreien“ oder „aus der Not retten“. Das hebräische Verb kann besonders die Befreiung von Feinden bezeichnen, hat aber auch die allgemeinere Bedeutung „retten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion zusammen mit dem ausdrücklich genannten Pronomen hebt den Gegensatz zum vorausgehenden Handeln Gottes hervor; „Ihr aber“ gibt diese adversative Betonung im Deutschen natürlich wieder.
- source_word: עֲזַבְתֶּם
  choice: habt ... verlassen
  rationale: עזב bezeichnet hier das Verlassen beziehungsweise Aufgeben der Bindung an Gott. „Verlassen“ ist verständlich und bewahrt das relationale und bundesbezogene Gewicht.
- source_word: אוֹתִי
  choice: mich
  rationale: Direktes Objektpronomen in der ersten Person Singular.
- source_word: וַתַּעַבְדוּ
  choice: und ... gedient
  rationale: עבד bezeichnet im Zusammenhang mit Gottheiten religiösen Dienst und Verehrung. „Dienen“ ist nah am Hebräischen und lässt sowohl kultische Verehrung als auch Loyalität anklingen.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Die feste Wortverbindung bezeichnet andere Götter im Gegensatz zu JHWH; „andere Götter“ ist die direkte und kontextgerechte Wiedergabe.
- source_word: לָכֵן
  choice: Darum
  rationale: Das Wort leitet die Folgerung beziehungsweise das Gericht aus Israels Verhalten ein. „Darum“ stellt diesen Zusammenhang klar und idiomatisch her.
- source_word: לֹא אוֹסִיף
  choice: werde ich ... nicht länger
  rationale: יסף mit Negation und folgendem Infinitiv drückt hier aus, dass Gott mit dem Retten nicht fortfahren wird. „Nicht länger“ gibt diesen Aspekt natürlicher wieder als ein missverständliches „nicht wieder“.
- source_word: לְהוֹשִׁיעַ
  choice: retten
  rationale: ישע kann retten, befreien oder aus Gefahr heraushelfen bedeuten. „Retten“ wahrt die Breite des Verbs; der konkrete Kontext der Befreiung von Bedrängern wird in der Fußnote erläutert.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Direktes Objektpronomen in der zweiten Person Plural.
theological_decisions:
- issue: Wiedergabe von ישע im Kontext des Richterbuches
  choice: retten
  alternative: befreien; aus der Not retten
  rationale: Im unmittelbaren Erzählzusammenhang geht es um Befreiung von feindlicher Unterdrückung. Das hebräische Verb ist jedoch weiter gefasst. „Retten“ bewahrt diese Bedeutungsbreite, ohne die Aussage auf eine ausschließlich geistliche Rettung einzuengen; die kontextnahen Alternativen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die betonte Gegenüberstellung wird mit „Ihr aber“ wiedergegeben. „Anderen Göttern gedient“ bleibt bewusst näher am religiösen Loyalitäts- und Dienstverhältnis des hebräischen Ausdrucks als das engere „angebetet“.
