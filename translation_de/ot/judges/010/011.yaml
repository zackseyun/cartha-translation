source:
  edition: WLC
  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: de
  text: 'Und Jahwe sagte zu den Israeliten[a]: »Habe ich euch nicht aus Ägypten sowie von den Amoritern, den Ammonitern und den Philistern befreit?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen Israels«.'
    reason: Die hebräische Verwandtschaftsbezeichnung wird im Haupttext idiomatisch als Volksname wiedergegeben.
  - marker: b
    text: Der hebräische Satz ist an dieser Stelle elliptisch; »Habe ich euch … befreit?« ist aus dem Zusammenhang ergänzt.
    reason: Die Ergänzung des im Hebräischen vorausgesetzten Satzteils wird transparent gemacht.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Wiedergabe der narrativen Redeeinleitung mit אמר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Umschrift des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die wörtliche Wendung »Söhne Israels« bezeichnet hier idiomatisch das Volk Israel; »Israeliten« ist im modernen Deutschen natürlich und schließt die gesamte angesprochene Gemeinschaft ein.
- source_word: הֲלֹא
  choice: Habe ich euch nicht …?
  rationale: Die Verbindung aus Fragepartikel und Verneinung leitet eine rhetorische Frage ein; Person, Objekt und Verb werden entsprechend dem Zusammenhang ergänzt.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Bei einem Land bezeichnet מן den Ausgangspunkt; »aus Ägypten« ist die natürliche deutsche Formulierung.
- source_word: הָאֱמֹרִי
  choice: den Amoritern
  rationale: Der morphologische Kollektivsingular bezeichnet hier die Volksgruppe und wird im Deutschen idiomatisch im Plural wiedergegeben.
- source_word: בְּנֵי עַמּוֹן
  choice: den Ammonitern
  rationale: Der feste deutsche Volksname gibt die wörtliche Bezeichnung »Söhne Ammons« idiomatisch wieder.
- source_word: פְּלִשְׁתִּים
  choice: den Philistern
  rationale: Übliche deutsche Bezeichnung dieser Volksgruppe.
- source_word: '[aus dem Zusammenhang ergänztes Verb]'
  choice: befreit
  rationale: Der hebräische Vers ist elliptisch. »Befreit« macht die Aussage im Deutschen vollständig und gibt das im Kontext gemeinte Retten aus der Gewalt von Bedrängern wieder, ohne eine zusätzliche geistliche Bedeutung einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift wahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch einen Titel würde die Form des Ausgangstextes verdecken.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische Verwandtschaftsformel dient hier als Volksbezeichnung. Die idiomatische Wiedergabe vermeidet im heutigen Deutschen den falschen Eindruck, nur männliche Nachkommen seien angesprochen; die wörtliche Form wird in einer Fußnote dokumentiert.
- issue: Ergänzung der Ellipse
  choice: Habe ich euch nicht … befreit?
  alternative: Nicht aus Ägypten und von den Amoritern …?
  rationale: Der Ausgangstext nennt in diesem Vers nur die Herkunft beziehungsweise die Bedränger und setzt die Handlung aus dem Zusammenhang voraus. Die Ergänzung ist für einen vollständigen deutschen Satz nötig und wird ausdrücklich kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; »sowie« verbindet den anders konstruierten Ausgangspunkt Ägypten flüssig mit den anschließend genannten Volksgruppen.
