source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: de
  text: Geht und schreit zu den Göttern, die ihr euch erwählt habt! Sie sollen euch zur Zeit eurer Not retten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden euch retten.“ Die hebräische Verbform kann als einfache Zukunftsaussage wiedergegeben werden; im Zusammenhang wirkt sie jedoch als ironische Herausforderung.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Geht
  rationale: Der Imperativ Plural von הלך wirkt hier als schroffe Aufforderung; „Geht“ gibt ihn knapp und natürlich wieder.
- source_word: וְזַעֲקוּ
  choice: und schreit
  rationale: זעק bezeichnet einen dringlichen Hilferuf. „Schreit zu“ bewahrt die Intensität und passt zur Anrufung von Gottheiten.
- source_word: אֶל הָאֱלֹהִים
  choice: zu den Göttern
  rationale: Der Kontext sowie das folgende betonte Pluralpronomen und das Verb im Plural zeigen, dass fremde Gottheiten gemeint sind.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: die ihr euch erwählt habt
  rationale: בחר mit ב bezeichnet hier die Wahl dieser Gottheiten. Das reflexive „euch erwählt“ klingt im Deutschen idiomatisch und hebt Israels eigene Entscheidung hervor.
- source_word: הֵמָּה
  choice: Sie
  rationale: Das selbstständige Pronomen setzt die Götter betont als Subjekt ab. Die Satzstellung und der neue Satz geben diese Hervorhebung natürlich wieder.
- source_word: יוֹשִׁיעוּ
  choice: sollen euch retten
  rationale: Der Hifil von ישׁע bedeutet „retten“. Im Zusammenhang fungiert die Form nicht bloß als Vorhersage, sondern als ironische Herausforderung; „sollen ... retten“ bewahrt diesen Aufforderungscharakter.
- source_word: בְּעֵת צָרַתְכֶם
  choice: wenn ihr in Not seid
  rationale: Die temporale Nominalfügung bedeutet wörtlich „zur Zeit eurer Not“. Der Nebensatz gibt ihren Sinn in natürlichem modernem Deutsch prägnant wieder.
theological_decisions:
- issue: Aussagekraft von יוֹשִׁיעוּ im Kontext
  choice: 'Ironische Aufforderung: „Sie sollen euch retten“'
  alternative: 'Schlichte Zukunftsaussage: „Sie werden euch retten“'
  rationale: Gottes Rede weist Israel scharf auf die selbst gewählten fremden Götter zurück. Der Kontext legt eine herausfordernde, ironische Verwendung der formal auch futurisch deutbaren Verbform nahe, ohne diese grammatische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und konfrontativ. „Schreit zu“ bewahrt die Dringlichkeit; „wenn ihr in Not seid“ vermeidet eine unnötig steife Nominalformulierung.
