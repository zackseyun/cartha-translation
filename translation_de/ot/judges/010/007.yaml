id: JDG.10.7
reference: Judges 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: de
  text: Da entbrannte Jahwes Zorn gegen Israel[a], und er verkaufte sie[b] in die Hand der Philister und in die Hand der Ammoniter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da wurde Jahwe zornig auf Israel.“ Wörtlicher: „Da entbrannte Jahwes Nase gegen Israel“; „Nase“ ist hier eine hebräische Ausdrucksweise für Zorn.'
    reason: lexical_alternative
  - marker: b
    text: „Verkaufte sie“ ist im Richterbuch eine wiederkehrende Wendung dafür, dass Jahwe Israel als Gericht der Herrschaft seiner Feinde überließ.
    reason: cross_reference
  - marker: c
    text: 'Wörtlicher: „in die Hand der Philister und in die Hand der Söhne Ammons“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte … Zorn
  rationale: Die hebräische Wendung beschreibt Zorn bildhaft als etwas, das entbrennt. Die deutsche Formulierung bewahrt dieses Bild und klingt zugleich natürlich und würdevoll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: בְּיִשְׂרָאֵל
  choice: gegen Israel
  rationale: In Verbindung mit der Zorneswendung bezeichnet ב das Ziel, gegen das sich der Zorn richtet.
- source_word: וַיִּמְכְּרֵם
  choice: und er verkaufte sie
  rationale: מכר bedeutet grundsätzlich „verkaufen“. Diese Wiedergabe erhält das wiederkehrende und harte Gerichtsbild des Richterbuchs, statt es mit „ausliefern“ abzuschwächen.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die konkrete hebräische Metapher für Gewalt und Verfügungsgewalt ist auch im Deutschen verständlich und wird daher bewahrt.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die etablierte deutsche Bezeichnung des Volkes.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: „Ammoniter“ ist die natürliche deutsche Volksbezeichnung; die wörtliche Form „Söhne Ammons“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ wahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Gottes Handeln in וַיִּמְכְּרֵם
  choice: er verkaufte sie
  alternative: er lieferte sie aus
  rationale: Der Satz schreibt Jahwe aktives Gerichtshandeln zu. Die Verkaufsmetapher wird beibehalten, ohne Gottes Urheberschaft abzuschwächen oder über den Text hinaus zu erklären.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die hebräischen Bilder vom entbrennenden Zorn, vom Verkaufen und von der Hand als Machtbereich bleiben erhalten; ungebräuchliche Wörtlichkeit wird in den Fußnoten erläutert.
