  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: de
  text: Auch die Sidonier, Amalek[a] und Maon[b] unterdrückten euch. Da schriet ihr zu mir um Hilfe, und ich rettete euch aus ihrer Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Amalekiter“. Im Hebräischen steht „Amalek“, womit hier das Volk als Ganzes gemeint sein kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Maoniter“. Im Hebräischen steht „Maon“, wahrscheinlich als Bezeichnung einer mit Maon verbundenen Volksgruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: die Sidonier
  rationale: Das gentilizische Substantiv im Plural bezeichnet die Bewohner beziehungsweise das Volk von Sidon; „Sidonier“ ist die übliche knappe deutsche Bezeichnung.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der hebräische Text hat den Eigennamen „Amalek“, der hier kollektiv für das Volk stehen kann. Die Wiedergabe bewahrt die Form des Ausgangstextes; die verdeutlichende Alternative steht in der Fußnote.
- source_word: מָעוֹן
  choice: Maon
  rationale: Der masoretische Text bietet den Eigennamen „Maon“. Da offenbar eine Volksgruppe gemeint ist, wird diese Deutung als Alternative in einer Fußnote genannt, ohne sie in den Haupttext einzutragen.
- source_word: לָחֲצוּ
  choice: unterdrückten
  rationale: Das Verb bezeichnet feindliches Bedrängen oder Unterdrücken und beschreibt hier die Fremdherrschaft über Israel.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: Da schriebt ihr zu mir um Hilfe
  rationale: Die Wendung bezeichnet einen dringlichen Hilferuf an Gott. „Um Hilfe schreien“ gibt die emotionale Kraft und die Ausrichtung des Rufes natürlich wieder.
- source_word: וָאוֹשִׁיעָה
  choice: ich rettete
  rationale: Das Verb ישׁע bedeutet retten oder befreien. „Retten“ ist klar und bewahrt die Verbindung zur biblischen Rettungssprache.
- source_word: מִיָּדָם
  choice: aus ihrer Hand
  rationale: Die wörtliche hebräische Wendung bezeichnet die Befreiung aus der Gewalt oder Herrschaft anderer. Das bildhafte Idiom ist auch im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auch“ nimmt den fortlaufenden Charakter der Aufzählung aus dem vorherigen Vers auf. Die Eigennamen und das Bild „aus ihrer Hand“ bleiben quellennah, während „zu mir um Hilfe schreien“ die hebräische Wendung idiomatisch wiedergibt.
