  text: וַ/יָּ֣קָם אַחֲרָ֔י/ו יָאִ֖יר הַ/גִּלְעָדִ֑י וַ/יִּשְׁפֹּט֙ אֶת יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: de
  text: Nach ihm trat Jair, der Gileaditer, auf[a] und richtete Israel 22 Jahre lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Nach ihm kam Jair, der Gileaditer.'
    reason: Lexikalische Alternative für die einleitende Nachfolgeformel וַיָּקָם אַחֲרָיו.
lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: Nach ihm trat … auf
  rationale: Die Verbindung bezeichnet im erzählerischen Zusammenhang das Auftreten des nächsten Richters. „Nach ihm“ bewahrt den persönlichen Bezug zum Vorgänger; „trat … auf“ gibt קום natürlich wieder, ohne die Nachfolgeformel übermäßig auszudeuten.
- source_word: יָאִיר
  choice: Jair
  rationale: Der Personenname wird gemäß der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: הַגִּלְעָדִי
  choice: der Gileaditer
  rationale: Das Herkunfts- beziehungsweise Zugehörigkeitsadjektiv wird als traditionelle und knappe deutsche Personenbezeichnung wiedergegeben.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: und richtete Israel
  rationale: „Richtete“ bewahrt den wiederkehrenden Leitbegriff des Richterbuches. Im Kontext umfasst das Verb mehr als moderne Rechtsprechung und bezeichnet Jairs Wirken als Richter und Leiter Israels.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: 22 Jahre lang
  rationale: Die Zeitangabe wird in natürlichem modernem Deutsch ausgedrückt; „lang“ verdeutlicht idiomatisch die Dauer, ohne zusätzliche Bedeutung einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die traditionelle Buchterminologie „richtete Israel“ bleibt erhalten; die alternative Wiedergabe der Nachfolgeformel wird in der Fußnote ausgewiesen.
