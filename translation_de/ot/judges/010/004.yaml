  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: de
  text: Er hatte dreißig Söhne, die auf dreißig Eseln ritten, und ihnen gehörten dreißig Städte. Diese nennt man bis heute Hawwot-Jaïr; sie liegen im Land Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲיָרִים
  choice: Esel
  rationale: Das Wort bezeichnet hier männliche Esel beziehungsweise Eselfohlen; im natürlichen deutschen Erzählstil genügt „Esel“.
- source_word: עֲיָרִים
  choice: Ortschaften
  rationale: Das gleichlautend geschriebene zweite Vorkommen bezeichnet im Kontext Siedlungen; „Ortschaften“ wahrt die Bedeutung, ohne ihre Größe genauer festzulegen.
- source_word: חַוֺּת יָאִיר
  choice: Hawwot-Jaïr
  rationale: Der Ortsgruppenname wird als Eigenname transliteriert; die Schreibung bildet den hebräischen Namen angemessen ab.
- source_word: יִקְרְאוּ
  choice: nennt man
  rationale: Die unpersönliche deutsche Wendung gibt den pluralischen Benennungsausdruck natürlich wieder, ohne einen ausdrücklich handelnden Personenkreis einzuführen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die beiden Vorkommen von עֲיָרִים werden entsprechend ihrem jeweiligen Kontext verschieden wiedergegeben. Der unklare grammatische Bezug des abschließenden Relativsatzes wird durch einen neuen Hauptsatz natürlich auf die Ortschaften bezogen.
