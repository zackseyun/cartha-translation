base_translation:
  language: en
  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: de
  text: Und Ephraim vertrieb die Kanaaniter nicht, die in Geser wohnten; und die Kanaaniter wohnten in Geser mitten unter ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seiner Mitte“. Das singularische Pronomen bezieht sich auf Ephraim als Stammeseinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: vertrieb
  rationale: Der Hifil von ירשׁ bezeichnet hier das Entfernen beziehungsweise Vertreiben der bisherigen Bewohner. „Vertrieb“ ist im Deutschen natürlich und gibt die Aussage im Zusammenhang der Landnahme klar wieder.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Die morphologisch singularische Volksbezeichnung wird hier kollektiv gebraucht. Der deutsche Plural bezeichnet die betreffende Volksgruppe natürlich und eindeutig.
- source_word: הַיּוֹשֵׁב
  choice: die … wohnten
  rationale: Das Partizip von ישׁב bezeichnet den fortdauernden Wohnsitz. „Wohnten“ ist gegenwärtiges, würdevolles Standarddeutsch.
- source_word: בְּגָזֶר
  choice: in Geser
  rationale: Die Präposition ב bezeichnet den Ort; „in Geser“ ist für das Wohnen in einer Stadt die natürliche deutsche Formulierung.
- source_word: וַיֵּשֶׁב
  choice: und … wohnten
  rationale: Die Wayyiqtol-Form von ישׁב führt die Erzählung fort. Das schlichte „und“ bewahrt die hebräische Verknüpfung, ohne ausdrücklich eine nicht markierte Kausalbeziehung einzutragen.
- source_word: בְּקִרְבּוֹ
  choice: mitten unter ihnen
  rationale: Wörtlich steht „in seiner Mitte“, wobei das singularische Suffix auf Ephraim als Stammeseinheit zurückweist. „Mitten unter ihnen“ gibt diesen kollektiven Sinn im Deutschen natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die zweimalige Nennung der Kanaaniter und die koordinierende Verbindung mit „und“ bleiben entsprechend dem Hebräischen erhalten; der kollektive Sinn des singularischen Ethnikons und des Rückverweises auf Ephraim wird idiomatisch wiedergegeben.
