base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: de
  text: Sie fanden Adoni-Besek in Besek[a], kämpften gegen ihn und schlugen die Kanaaniter und die Perisiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adoni-Besek kann seiner Wortbildung nach auch als „Herr von Besek“ verstanden werden; hier wird die Bezeichnung als Personenname wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Sie fanden
  rationale: מצא bedeutet in erzählenden Texten häufig „finden“ oder „antreffen“. „Sie fanden“ gibt die hebräische Form direkt und natürlich wieder.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Besek
  rationale: Die Wortfolge wird im Kontext als Personenname behandelt und entsprechend übertragen; ihre mögliche titelartige Bedeutung wird in der Fußnote festgehalten.
- source_word: בְּבֶזֶק
  choice: in Besek
  rationale: Die Präposition ב bezeichnet hier den Ort; „in Besek“ ist im Deutschen eine natürliche Wiedergabe.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: kämpften gegen ihn
  rationale: Das Niphal von לחם mit ב bezeichnet den Kampf gegen einen Gegner. Die Formulierung gibt den gegnerischen Bezug klar wieder.
- source_word: וַיַּכּוּ
  choice: schlugen
  rationale: נכה kann „schlagen“, „niederschlagen“ oder im militärischen Zusammenhang „besiegen“ bedeuten. „Schlugen“ bewahrt die semantische Breite, ohne die vollständige Tötung aller Angehörigen zu behaupten.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Das morphologisch singularische Volkswort ist kollektiv gebraucht; der deutsche Plural gibt die Volksgruppe im Kampfkontext natürlich wieder.
- source_word: הַפְּרִזִּי
  choice: die Perisiter
  rationale: Auch dieses singularische Volkswort hat kollektive Bedeutung und wird daher im Deutschen im Plural wiedergegeben.
