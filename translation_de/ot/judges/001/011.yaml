reference: Judges 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֔ם אֶל יוֹשְׁבֵ֖י דְּבִ֑יר וְ/שֵׁם דְּבִ֥יר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: de
  text: Von dort zog er gegen die Einwohner von Debir[a]. Debir hieß früher Kirjat-Sefer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Einwohnern von Debir“. Die hebräische Präposition bedeutet wörtlicher „zu“ oder „auf … zu“; im Zusammenhang des Eroberungszugs bezeichnet sie hier wahrscheinlich eine feindliche Bewegung.'
    reason: lexical_alternative
  - marker: b
    text: Der Name Kirjat-Sefer kann möglicherweise „Stadt des Buches“ oder „Stadt der Schreiber“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: zog er
  rationale: Das einfache Bewegungsverb הלך bezeichnet hier im Eroberungsbericht ein Weiterziehen. „zog“ klingt im Deutschen natürlich und lässt die militärische Nuance des Zusammenhangs erkennen, ohne ausdrücklich „marschierte“ zu sagen.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die adverbiale Wendung bezeichnet den Ausgangspunkt der Bewegung.
- source_word: אֶל
  choice: gegen
  rationale: Die Präposition bedeutet grundsätzlich „zu/auf … zu“. Im Zusammenhang eines Eroberungszugs gibt „gegen“ die feindliche Ausrichtung natürlich wieder; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: יוֹשְׁבֵי
  choice: die Einwohner von
  rationale: Das substantivisch gebrauchte Partizip von ישׁב bezeichnet die Bewohner eines Ortes. „Einwohner“ ist gegenwärtiges, gut verständliches Standarddeutsch.
- source_word: דְּבִיר
  choice: Debir
  rationale: Der Ortsname wird transliteriert.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: Debir hieß früher
  rationale: Diese natürliche deutsche Formulierung gibt die Aussage „Der Name Debirs war früher …“ klar und knapp wieder.
- source_word: קִרְיַת סֵפֶר
  choice: Kirjat-Sefer
  rationale: Der Ortsname wird transliteriert statt durch eine unsichere etymologische Deutung ersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „zog“ passt zum erzählenden und militärischen Zusammenhang, ohne das allgemeine hebräische Bewegungsverb zu überpräzisieren. Die erklärende Namensklausel wurde idiomatisch als eigener Satz wiedergegeben.
