source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: de
  text: 'Nach Josuas Tod befragten die Söhne Israels Yahweh: „Wer soll für uns zuerst gegen die Kanaaniter hinaufziehen, um gegen sie zu kämpfen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: Nach Josuas Tod
  rationale: Die hebräische Eröffnungsformel leitet die neue Erzähleinheit ein. Im modernen Deutschen gibt die knappe Zeitangabe ihre Funktion natürlicher wieder als das schwerfällige „Und es geschah nach dem Tod Josuas“.
- source_word: וַיִּשְׁאֲלוּ בְּנֵי יִשְׂרָאֵל בַּיהוָה
  choice: fragten die Söhne Israels Yahweh
  rationale: שׁאל ב bezeichnet hier das Einholen göttlicher Weisung. „Yahweh fragen“ ist direkt und verständlich; „die Söhne Israels“ bewahrt die konkrete Formulierung בְּנֵי יִשְׂרָאֵל.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das quotative „indem sie sagten“ wäre im Deutschen unnötig schwerfällig; der Doppelpunkt erfüllt dieselbe Einleitungsfunktion.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Wer von uns soll ... hinaufziehen
  rationale: לָנוּ kann „für uns“ beziehungsweise „auf unserer Seite“ bedeuten. Im Zusammenhang der Stämme, die nach der Kampfreihenfolge fragen, drückt „von uns“ den gemeinten Bezug natürlich aus, ohne den militärischen Sinn von עלה aufzugeben.
- source_word: אֶל הַכְּנַעֲנִי
  choice: gegen die Kanaaniter
  rationale: Der morphologische Singular „der Kanaaniter“ ist kollektiv gebraucht. Der deutsche Plural bezeichnet die Volksgruppe idiomatisch; „gegen“ ergibt sich aus dem ausdrücklich genannten Kampf.
- source_word: בַּתְּחִלָּה
  choice: zuerst
  rationale: Gemeint ist der erste Zug in der Reihenfolge der militärischen Unternehmungen.
- source_word: לְהִלָּחֶם בּוֹ
  choice: um gegen sie zu kämpfen
  rationale: Das singularische Suffix nimmt den kollektiven Singular „der Kanaaniter“ auf. Nach der deutschen Wiedergabe im Plural ist „sie“ die natürliche Kongruenz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Yahweh“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die traditionellere deutsche Lautform.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Eröffnungsformel wurde idiomatisch verdichtet, während „Söhne Israels“ und das militärische „hinaufziehen“ die hebräische Ausdrucksweise sichtbar halten. Keine Fußnote ist nötig, da der kollektive Singular im Deutschen unmittelbar und sachgerecht als Plural wiedergegeben wird.
