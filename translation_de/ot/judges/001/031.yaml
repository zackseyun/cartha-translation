  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: de
  text: Ascher vertrieb weder die Bewohner von Akko[a] noch die Bewohner von Sidon noch die Bewohner von Achlab noch die Bewohner von Achsib noch die Bewohner von Helba noch die Bewohner von Afek noch die Bewohner von Rehob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akko wird mit der heutigen Küstenstadt Akko identifiziert, die international auch Acre genannt wird.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: vertrieb
  rationale: Der Hifil von ירש bezeichnet in diesem Landnahmekontext, dass die bisherigen Bewohner aus ihrem Besitz entfernt werden. „Vertreiben“ ist im modernen Deutsch natürlich und bewahrt den konkreten Sinn.
- source_word: יֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das Partizip von ישב bezeichnet kollektiv die Menschen, die an einem Ort wohnen; „Bewohner“ gibt dies knapp und idiomatisch wieder.
- source_word: עַכּוֹ
  choice: Akko
  rationale: Der Ortsname wird in einer im Deutschen üblichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: אַחְלָב
  choice: Achlab
  rationale: Der Eigenname wird lautnah aus dem Hebräischen übertragen.
- source_word: אַכְזִיב
  choice: Achsib
  rationale: Der Eigenname wird in einer deutschen Transliteration wiedergegeben.
- source_word: חֶלְבָּה
  choice: Helba
  rationale: Die Form folgt dem masoretischen Text dieses Verses; abweichende Überlieferungstraditionen werden nicht in den Haupttext eingetragen.
- source_word: אֲפִיק
  choice: Afek
  rationale: Deutsche lautnahe Wiedergabe des Ortsnamens.
- source_word: רְחֹב
  choice: Rehob
  rationale: Übliche deutsche Transliteration des Ortsnamens.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: weder ... noch
  rationale: Nach dem verneinten Verb gibt „weder … noch“ die koordinierte und distributive Aufzählung im Deutschen klar und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ortsnamen werden deutsch und möglichst hebräischnah transliteriert. Die Wiederholung von „Bewohner“ wird teilweise durch „die von“ aufgefangen, ohne den Bezug auf die Bevölkerung der genannten Orte zu verlieren.
