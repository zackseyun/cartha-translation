  source_fidelity: 'Der Grundsinn ist zutreffend: Ascher vertrieb die Bewohner der aufgeführten Orte nicht. Die Ortsnamen folgen insgesamt plausiblen deutschen, hebräischnahen Formen. Die vollständige Wiederholung der Ortsbezüge sollte jedoch im Text stehen, damit die im Hebräischen durchgehend als Bewohner der jeweiligen Orte bezeichneten Gruppen nicht am Ende der Aufzählung zu einer bloßen Ortsliste verkürzt werden.'
  naturalness: „Weder … noch“ ist im modernen Standarddeutsch idiomatisch. Eine durchgehende Folge von „noch die Bewohner von …“ ist trotz der Wiederholung klar, würdig und bei einer Ortsliste dieses Umfangs natürlich.
  terminology: „vertrieb“ gibt הוֹרִישׁ im Kontext angemessen wieder; „Bewohner“ entspricht יֹשְׁבֵי. Die Fußnote sollte Akko nicht irreführend als später „Akkon“ bezeichnet darstellen. Die antike Stadt wird mit dem heutigen Akko/Acre identifiziert.
