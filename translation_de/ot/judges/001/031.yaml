    rationale: Die Formulierung ist verständlich, schwächt aber die wiederholte syntaktische Struktur des Ausgangstextes. Die explizite Wiederholung von „die Bewohner von“ erhält Bezug und Umfang der Aufzählung präziser.
  - severity: medium
    issue: Die Fußnote behauptet, Akko sei später unter dem Namen „Akkon“ bekannt geworden.
    rationale: Diese historische Einordnung ist mindestens missverständlich und entspricht nicht der sinnvollen Identifikationsnotiz. Sicher ist die Identifikation der antiken Stadt mit dem heutigen Akko, international auch Acre genannt.
