  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: de
  text: Als Israel stark wurde, verpflichtete es die Kanaaniter zur Zwangsarbeit[a]; doch es vertrieb sie nicht vollständig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Frondienst“. Das hebräische Wort bezeichnet eine von einer herrschenden Macht auferlegte Arbeitsleistung.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen ein singularisches Objekt („ihn“), das sich kollektiv auf die kanaanitische Bevölkerung bezieht.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Als
  rationale: Die hebräische Erzählformel leitet hier einen zeitlichen Nebensatz ein. Das schlichte „Als“ gibt die zeitliche Beziehung natürlich wieder, ohne die Formel hölzern mit „Und es geschah, als“ nachzubilden.
- source_word: חָזַק
  choice: stark geworden war
  rationale: Das Verb bezeichnet in diesem Zusammenhang Israels Erstarken beziehungsweise die erlangte Vormachtstellung. Das Plusquamperfekt fügt sich im Deutschen natürlich in den zeitlichen Satzbau ein.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Die morphologisch singularische Volksbezeichnung wird kollektiv gebraucht. Im Deutschen gibt der Plural die gemeinte Bevölkerungsgruppe idiomatisch wieder.
- source_word: וַיָּשֶׂם ... לָמַס
  choice: verpflichtete ... zur Zwangsarbeit
  rationale: Die Verbindung bezeichnet die Auferlegung von Frondienst beziehungsweise Arbeitszwang durch eine herrschende Macht. „Zur Zwangsarbeit verpflichten“ ist verständlich und bewahrt den Zwangscharakter.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: doch es vertrieb sie keineswegs vollständig
  rationale: Der Infinitivus absolutus zusammen mit dem finiten Verb verstärkt hier die verneinte Aussage. „Keineswegs vollständig“ wahrt diese Emphase; „vertreiben“ passt zum Zusammenhang der Landnahme. Das singularische Objektpronomen bezieht sich kollektiv auf die kanaanitische Bevölkerung.
theological_decisions:
- issue: Israels Umgang mit den Kanaanitern
  choice: Israel unterwarf die Kanaaniter der Zwangsarbeit, statt sie vollständig zu vertreiben.
  alternative: מַס könnte abgeschwächt als bloße Abgabe oder Tribut wiedergegeben werden.
  rationale: Der hebräische Ausdruck bezeichnet hier eine auferlegte Dienst- beziehungsweise Arbeitsleistung. Die Übersetzung soll den Zwangscharakter nicht verdecken und zugleich keine über den Wortlaut hinausgehende Bewertung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist flüssig und hält Israel durch das Pronomen „es“ als grammatisches Subjekt fest. „Zwangsarbeit“ macht den auferlegten Charakter des מַס verständlich; die Fußnote nennt „Frondienst“ als sachnahe Alternative. Die emphatische Verneinung bleibt mit „keineswegs vollständig“ erhalten.
