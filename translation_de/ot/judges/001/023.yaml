  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: de
  text: Und das Haus Josef ließ Bethel[a] auskundschaften; früher hieß die Stadt Lus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erkundete Bethel“ oder „kundschaftete Bethel aus“. Das hebräische Verb kann in diesem Zusammenhang das Erkunden selbst oder das Auskundschaften durch Kundschafter bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: erkundete
  rationale: Das seltene Verb wird hier im militärischen Zusammenhang als Auskundschaften oder Erkunden verstanden. „Erkundete“ ist im modernen Deutschen natürlich und lässt offen, ob Späher ausgesandt wurden.
- source_word: בֵית יוֹסֵף
  choice: das Haus Josef
  rationale: Die formnahe Wiedergabe bewahrt die biblische Stammes- und Sippenbezeichnung, ohne ihren genauen sozialen Umfang festzulegen.
- source_word: בְּבֵית אֵל
  choice: Bethel
  rationale: Die Präposition kennzeichnet hier im Zusammenhang mit dem Verb das Ziel der Erkundung; im Deutschen steht dieses direkt als Objekt.
- source_word: וְשֵׁם הָעִיר לְפָנִים
  choice: früher hieß die Stadt
  rationale: Diese idiomatische deutsche Formulierung gibt die Aussage über den früheren Namen klar und knapp wieder.
- source_word: לוּז
  choice: Lus
  rationale: Der Ortsname wird gemäß der im Deutschen etablierten biblischen Schreibweise transliteriert.
