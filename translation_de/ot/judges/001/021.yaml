  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: de
  text: Doch die Benjaminiter vertrieben die Jebusiter[a], die in Jerusalem wohnten, nicht. Daher wohnen die Jebusiter bis zum heutigen Tag mit den Benjaminitern in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen jeweils „der Jebusiter“; der Singular bezeichnet hier die Volksgruppe als Ganzes.
    reason: Der hebräische kollektive Singular wird im natürlichen deutschen Plural wiedergegeben.
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: die Jebusiter
  rationale: Die hebräische Singularform bezeichnet hier kollektiv die Volksgruppe; im modernen Deutschen ist der Plural natürlich und eindeutig.
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: die in Jerusalem wohnten
  rationale: Das Partizip bezeichnet einen andauernden Wohnzustand; die Formulierung gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: הוֹרִישׁוּ
  choice: vertrieben ... nicht
  rationale: Im Zusammenhang der Landnahme bedeutet das Verb, die bisherigen Bewohner aus ihrem Gebiet zu vertreiben.
- source_word: בְּנֵי בִנְיָמִן
  choice: die Nachkommen Benjamins
  rationale: Die Wendung bewahrt den genealogisch-stammesbezogenen Charakter des Hebräischen und klingt im Deutschen natürlicher als das wörtliche »Söhne Benjamins«.
- source_word: וַיֵּשֶׁב
  choice: So wohnen
  rationale: Zusammen mit »bis zum heutigen Tag« beschreibt das Verb einen Zustand, der bis in die Gegenwart des Erzählers fortbesteht.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: mit den Nachkommen Benjamins
  rationale: אֶת bezeichnet hier Begleitung beziehungsweise gemeinsames Wohnen, nicht ein direktes Objekt.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die geläufige deutsche Wendung erhält den Bezug auf die Gegenwart des Erzählers.
- source_word: וְ
  choice: Doch
  rationale: Die Konjunktion hat im Kontext einen kontrastierenden Sinn und stellt Benjamins ausbleibende Vertreibung den vorausgehenden Erfolgen gegenüber.
