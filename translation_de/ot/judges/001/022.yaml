source:
  edition: WLC
  text: וַ/יַּעֲל֧וּ בֵית יוֹסֵ֛ף גַּם הֵ֖ם בֵּֽית אֵ֑ל וַֽ/יהוָ֖ה עִמָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: de
  text: Auch das Haus Josef zog gegen Bet-El hinauf[a], und Jahwe war mit ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zog nach Bet-El hinauf«. Das hebräische Verb bedeutet wörtlich »hinaufziehen«; im militärischen Zusammenhang ist wahrscheinlich ein Vorrücken gegen die Stadt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zog ... hinauf
  rationale: Das Verb עלה bedeutet wörtlich »hinaufgehen/‑ziehen«. »Hinaufziehen« bewahrt das hebräische Bild und passt zugleich zu einem militärischen Aufbruch.
- source_word: בֵית יוֹסֵף
  choice: das Haus Josef
  rationale: Die formale Stammes- und Sippenbezeichnung wird beibehalten; sie meint hier die zu Josef gehörenden Stämme beziehungsweise Nachkommen.
- source_word: גַּם הֵם
  choice: Auch
  rationale: Die Wendung verbindet diesen Feldzug mit den zuvor berichteten Unternehmungen und lässt sich im Deutschen knapp und natürlich mit »Auch« wiedergeben.
- source_word: בֵּית אֵל
  choice: Bet-El
  rationale: Der Ortsname wird in einer im Deutschen verständlichen Transliteration wiedergegeben; die Schreibung mit Bindestrich lässt seine Namensform erkennen.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: עִמָּם
  choice: war mit ihnen
  rationale: Die direkte Wendung bewahrt sowohl den Gedanken göttlicher Gegenwart als auch den möglichen Beiklang göttlicher Unterstützung, ohne ihn stärker auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. »Jahwe« gibt den Bundesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Richtung oder feindlicher Angriff in וַיַּעֲלוּ בֵּית אֵל
  choice: zog gegen Bet-El hinauf
  alternative: zog nach Bet-El hinauf
  rationale: Der militärische Zusammenhang legt eine feindliche Bewegung gegen die Stadt nahe. Da das Verb selbst jedoch nur »hinaufziehen« sagt, wird die echte Bedeutungsalternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formale Bezeichnung »Haus Josef« und das Bild des Hinaufziehens bleiben erhalten; die Fußnote wahrt die lexikalische Mehrdeutigkeit.
