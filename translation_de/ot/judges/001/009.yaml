  register: Moderner, würdevoller Erzählstil. Die konkrete Abwärtsbewegung bleibt erhalten; die drei geografischen Zonen werden als regionale Bezeichnungen wiedergegeben. Der Fachname „Schefela“ steht zur Präzisierung in der Fußnote.
