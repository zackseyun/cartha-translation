  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: de
  text: Danach zogen die Söhne Judas hinab, um gegen die Kanaaniter zu kämpfen, die im Bergland, im Negev und in der Niederung[a] wohnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in der Schefela, dem judäischen Hügelland zwischen dem Bergland und der Küstenebene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Danach
  rationale: Gibt die zeitliche Abfolge knapp und natürlich wieder, ohne den zeitlichen Abstand näher festzulegen.
- source_word: יָרְדוּ
  choice: zogen ... hinab
  rationale: Bewahrt die konkrete topografische Bewegungsrichtung des Verbs ירד und klingt zugleich idiomatisch im deutschen Erzählstil.
- source_word: בְּנֵי יְהוּדָה
  choice: die Söhne Judas
  rationale: Entspricht der hebräischen Formulierung und bezeichnet hier kollektiv die Angehörigen des Stammes Juda, ohne die Formulierung unnötig zu verallgemeinern.
- source_word: לְהִלָּחֵם
  choice: um ... zu kämpfen
  rationale: Gibt den finalen Infinitiv und die Grundbedeutung von לחם klar und natürlich wieder.
- source_word: בַּכְּנַעֲנִי
  choice: gegen die Kanaaniter
  rationale: Der morphologische Singular wird im Hebräischen kollektiv für die Volksgruppe gebraucht; der Kontext des Kampfes verlangt im Deutschen „gegen“.
- source_word: יוֹשֵׁב
  choice: die ... wohnten
  rationale: Der Partizipialausdruck bezeichnet die ansässige Bevölkerung; ein Relativsatz ist im modernen Deutschen natürlich.
- source_word: הָהָר
  choice: im Bergland
  rationale: Bezeichnet hier eine geografische Höhenregion und nicht nur einen einzelnen Berg.
- source_word: הַנֶּגֶב
  choice: im Negev
  rationale: In der Aufzählung geografischer Regionen ist der Eigenname präziser als die allgemeinere Bedeutung „Süden“.
- source_word: הַשְּׁפֵלָה
  choice: im Hügelland
  rationale: Bezeichnet die judäische Vorgebirgs- und Hügellandzone zwischen dem Bergland und der Küstenebene; die verständliche Übersetzung wird durch eine Fußnote mit dem Fachnamen ergänzt.
theological_decisions: []
