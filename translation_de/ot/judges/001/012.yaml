base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: de
  text: 'Da sagte Kaleb: »Wer[a] Kirjat-Sefer angreift und einnimmt, dem gebe ich meine Tochter Achsa zur Frau.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Derjenige, der Kirjat-Sefer angreift und einnimmt, dem gebe ich meine Tochter Achsa zur Frau.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; »Da sagte« gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Die im Deutschen übliche biblische Namensform wird beibehalten.
- source_word: אֲשֶׁר
  choice: Wer
  rationale: Das Relativwort leitet hier eine unbestimmte Bedingung beziehungsweise offene Aufforderung ein; »Wer« ist knapp und idiomatisch.
- source_word: יַכֶּה
  choice: angreift
  rationale: Die Hifil-Form von נכה bezeichnet hier militärisches Vorgehen gegen eine Stadt. »Angreift« ist im Zusammenhang natürlicher als das wörtlichere »schlägt« und lässt dem folgenden Verb die Bedeutung der erfolgreichen Einnahme.
- source_word: קִרְיַת סֵפֶר
  choice: Kirjat-Sefer
  rationale: Der Ortsname wird in einer geläufigen deutschen Transliteration mit Bindestrich wiedergegeben.
- source_word: וּלְכָדָהּ
  choice: und einnimmt
  rationale: לכד bedeutet im militärischen Zusammenhang, eine Stadt zu erobern beziehungsweise einzunehmen; das feminine Suffix bezieht sich auf die Stadt.
- source_word: וְנָתַתִּי לוֹ
  choice: dem gebe ich
  rationale: Die deutsche Korrelativkonstruktion »Wer …, dem …« gibt die Zusage präzise und natürlich wieder; das Präsens kann eine verbindliche zukünftige Zusage ausdrücken.
- source_word: עַכְסָה
  choice: Achsa
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird verwendet.
- source_word: בִתִּי
  choice: meine Tochter
  rationale: Die Besitz- und Verwandtschaftsbeziehung wird ausdrücklich bewahrt.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste deutsche Wendung gibt die hebräische Formel für die Eheschließung knapp und eindeutig wieder.
