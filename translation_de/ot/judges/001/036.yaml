  source_fidelity: Die Übersetzung gibt die nominale Grenzangabe des Hebräischen sachgerecht wieder. »Grenze der Amoriter«, »vom Anstieg von Akrabbim«, »von Sela« und »an aufwärts« entsprechen den maßgeblichen geografischen Elementen; die kollektiv verstandene Volksbezeichnung ist im Deutschen idiomatisch.
