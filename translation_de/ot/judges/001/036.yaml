  text: וּ/גְבוּל֙ הָ/אֱמֹרִ֔י מִֽ/מַּעֲלֵ֖ה עַקְרַבִּ֑ים מֵ/הַ/סֶּ֖לַע וָ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: de
  text: Und die Grenze der Amoriter verlief vom Anstieg von Akrabbim[a], von Sela[b] an aufwärts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Akrabbim bedeutet »Skorpione«; auch möglich: »vom Skorpionenanstieg«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vom Felsen«, wenn das hebräische Wort nicht als Ortsname Sela, sondern als Gattungsbezeichnung verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ
  choice: Und
  rationale: Die Konjunktion verbindet die geografische Notiz schlicht mit dem vorherigen Zusammenhang.
- source_word: גְבוּל
  choice: Grenze
  rationale: Das Wort bezeichnet hier die Grenzlinie, nicht das gesamte Gebiet.
- source_word: הָאֱמֹרִי
  choice: der Amoriter
  rationale: Der morphologische Singular ist kollektiv gebraucht; im Deutschen gibt der Genitiv Plural die Volksgruppe natürlich wieder.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: vom Anstieg von Akrabbim
  rationale: מַעֲלֵה bezeichnet einen Anstieg beziehungsweise Aufstieg. Akrabbim wird als Bestandteil des Ortsnamens transliteriert; seine wörtliche Bedeutung steht in der Fußnote.
- source_word: מֵהַסֶּלַע
  choice: von Sela
  rationale: Im geografischen Zusammenhang kann Sela als Ortsname verstanden werden. Da die hebräische Form zugleich das gewöhnliche Wort für »Fels« ist, bleibt diese Alternative in einer Fußnote erhalten.
- source_word: וָמָעְלָה
  choice: an aufwärts
  rationale: Die Wendung bezeichnet die Fortsetzung nach oben beziehungsweise über den genannten Ausgangspunkt hinaus. Zusammen mit »von Sela« ergibt sich im Deutschen die natürliche Formulierung »von Sela an aufwärts«.
