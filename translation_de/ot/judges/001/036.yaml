  register: Modernes, würdiges Standarddeutsch. »Verlief« macht die im Hebräischen verblos formulierte Grenzangabe idiomatisch, ohne ihre geografische Aussage zu erweitern. Die doppelte Herkunftsangabe bleibt bewusst eng am hebräischen Satzbau.
