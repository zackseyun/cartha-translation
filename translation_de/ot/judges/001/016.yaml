base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: de
  text: Und die Nachkommen des Keniters[a], des Schwiegervaters von Mose, zogen mit den Nachkommen Judas aus der Palmenstadt[b] hinauf in die Wüste Juda, die im Negev von Arad liegt. Dann zog er und ließ sich bei dem Volk nieder.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines angeheirateten Verwandten von Mose“. Das hebräische Wort kann eine weitere Bedeutung haben als „Schwiegervater“, doch „Schwiegervater“ ist hier die wahrscheinlichste Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: Mit der „Palmenstadt“ ist wahrscheinlich Jericho gemeint.
    reason: cross_reference
  - marker: c
    text: 'Das Hebräische wechselt hier vom Plural zum Singular: „Dann zog er und ließ sich nieder.“ Gemeint sein kann der kenitische Clan als Einheit; manche verstehen die Aussage jedoch sinngemäß im Plural.'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Oder: „unter dem Volk“. Einige alte Textzeugen lesen statt „bei dem Volk“: „bei Amalek“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: Und die Nachkommen des Keniters
  rationale: בְּנֵי bezeichnet in einem genealogisch-stammesbezogenen Zusammenhang die Nachkommen bzw. Angehörigen eines Clans. Der Singular „des Keniters“ bewahrt die hebräische Form des Gentiliziums.
- source_word: חֹתֵן מֹשֶׁה
  choice: des Schwiegervaters von Mose
  rationale: חֹתֵן bedeutet hier am wahrscheinlichsten „Schwiegervater“, kann jedoch allgemeiner einen angeheirateten Verwandten bezeichnen; diese Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: עָלוּ מֵעִיר הַתְּמָרִים
  choice: zogen … aus der Palmenstadt hinauf
  rationale: Die Ortsbezeichnung wird entsprechend dem Hebräischen wörtlich wiedergegeben; „hinaufziehen“ bewahrt zudem die Bewegungs- und mögliche topografische Nuance von עלה.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: mit den Nachkommen Judas
  rationale: אֶת wird hier assoziativ als „mit“ verstanden. „Nachkommen Judas“ gibt den stammesbezogenen Sinn von בְּנֵי natürlich wieder.
- source_word: מִדְבַּר יְהוּדָה
  choice: in die Wüste Juda
  rationale: Die Richtungsangabe ergibt sich aus dem Bewegungsverb. „Wüste Juda“ ist die geläufige deutsche geografische Bezeichnung und muss nicht eine reine Sandwüste meinen.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: die im Negev von Arad liegt
  rationale: נֶגֶב kann den Negev als Region oder das südliche Gebiet bezeichnen. Die Formulierung bewahrt die geografische Ausdrucksweise und ihre leichte Offenheit.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Dann zog er weiter und ließ sich … nieder
  rationale: Die morphologisch auffälligen Singularformen werden nicht zum Plural harmonisiert. „zog … weiter“ macht den Fortgang der Wanderung in natürlichem Deutsch deutlich, während „ließ sich nieder“ den Siedlungskontext von ישׁב wiedergibt.
- source_word: אֶת הָעָם
  choice: bei dem Volk
  rationale: Das zweite אֶת wird assoziativ verstanden. „Bei dem Volk“ bewahrt den unbestimmten Bezug des masoretischen Textes, ohne ihn eigenmächtig mit Juda oder einem anderen Volk gleichzusetzen.
