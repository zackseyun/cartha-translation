  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ הַ/שָּׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: de
  text: 'Als sie kam, drängte sie ihn, ihren Vater um das Feld zu bitten. Dann stieg sie vom Esel ab[a], und Kaleb fragte sie: „Was möchtest du?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann sprang sie vom Esel herab“; das hebräische Verb kann eine deutliche oder rasche Abwärtsbewegung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Was ist dir?“ Je nach Zusammenhang kann die Wendung auch bedeuten: „Was hast du?“ oder „Was ist los mit dir?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: Als sie kam
  rationale: Die Konstruktion aus בְּ, Infinitiv und Suffix bezeichnet den Zeitpunkt ihres Kommens. Die knappe Wiedergabe bewahrt zugleich die mögliche Rückbindung an den unmittelbaren Erzählzusammenhang.
- source_word: וַתְּסִיתֵהוּ
  choice: drängte sie ihn
  rationale: סות kann zum Bewegen, Überreden oder Anstiften bezeichnen. „drängte“ passt zum familiären Anliegen, ohne dem Vorgang unnötig eine moralisch negative Färbung zu geben.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: ihren Vater um das Feld zu bitten
  rationale: Diese deutsche Konstruktion gibt sowohl die Bitte als auch deren Adressaten und Gegenstand idiomatisch wieder; der bestimmte Artikel in הַשָּׂדֶה wird mit „das Feld“ erhalten.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: Dann glitt sie vom Esel herab
  rationale: צנח beschreibt eine deutliche Abwärtsbewegung und kann ein Herabgleiten oder Herabspringen bezeichnen. „glitt ... herab“ erhält mehr von diesem Bild als das rein funktionale „stieg ab“, ohne einen Sturz festzulegen.
- source_word: מַה לָּךְ
  choice: Was möchtest du?
  rationale: Die Wendung lautet wörtlich „Was ist dir?“ und fragt kontextuell nach ihrem Anliegen. „Was möchtest du?“ ist im Deutschen natürlich und weniger schroff als „Was willst du?“.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
theological_decisions: []
