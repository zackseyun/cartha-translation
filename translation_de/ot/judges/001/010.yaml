base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: de
  text: Dann zog Juda gegen die Kanaaniter, die in Hebron wohnten – Hebron hieß früher Kirjat-Arba[a] – und sie schlugen Scheschai, Ahiman und Talmai nieder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „gegen den Kanaaniter, der in Hebron wohnte“. Die Singularformen werden hier wahrscheinlich kollektiv für die kanaanitische Bevölkerung gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: „Schlugen … nieder“ kann in diesem militärischen Zusammenhang auch „besiegten“ oder „töteten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶל
  choice: Dann zog Juda gegen
  rationale: הלך mit אֶל und einem feindlichen Gegenüber leitet hier einen militärischen Zug ein. „zog … gegen“ bewahrt sowohl die Bewegung als auch den feindlichen Zusammenhang; „Juda“ bleibt wie im Hebräischen kollektiv formuliert.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Die morphologisch singularische Volksbezeichnung wird hier am natürlichsten als Kollektiv verstanden und im Deutschen im Plural wiedergegeben.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: die in Hebron wohnten
  rationale: Das Partizip bezeichnet die dort ansässige Bevölkerung. Der Plural stimmt mit der kollektiven Wiedergabe „Kanaaniter“ überein.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: Hebron hieß früher Kirjat-Arba
  rationale: Die erklärende Namensangabe wird in natürlichem Deutsch wiedergegeben; לְפָנִים bezeichnet die frühere Zeit.
- source_word: וַיַּכּוּ
  choice: und sie schlugen … nieder
  rationale: נכה bezeichnet im militärischen Zusammenhang einen entscheidenden Schlag. „niederschlagen“ bewahrt die konkrete Bildlichkeit, ohne zwingend ausdrücklich „töten“ festzulegen.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: Scheschai, Ahiman und Talmai
  rationale: Die Personennamen werden nach geläufigen deutschen Transkriptionskonventionen wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zog … gegen“ trägt den militärischen Zusammenhang natürlich aus; die Parenthese bewahrt die erklärende Ortsnamensangabe. Die wechselnden Numeri des hebräischen Kollektivs werden im Deutschen verständlich als Plural wiedergegeben.
