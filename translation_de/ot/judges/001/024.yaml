source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: de
  text: 'Die Wachposten sahen einen Mann aus der Stadt kommen. Sie sagten zu ihm: »Zeig uns bitte den Zugang zur Stadt[a], dann werden wir dir Güte erweisen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Weg in die Stadt hinein«.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch ḥesed; je nach Zusammenhang auch mit »Freundlichkeit«, »Loyalität« oder »beständiger Liebe« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: die Wachposten
  rationale: Das substantivierte Partizip von שׁמר bezeichnet hier Männer, die die Stadt beobachten. »Wachposten« bewahrt den Gedanken des Wachens, ohne sie mit den Verteidigern der Stadt gleichzusetzen.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das maskuline Singularsubstantiv bezeichnet hier ausdrücklich eine männliche Einzelperson.
- source_word: יוֹצֵא מִן־הָעִיר
  choice: aus der Stadt kommen
  rationale: Das Partizip von יצא beschreibt die Bewegung aus der Stadt heraus; die Formulierung gibt die Perspektive der Beobachter natürlich wieder.
- source_word: מְבוֹא הָעִיר
  choice: den Zugang zur Stadt
  rationale: מְבוֹא kann den Eingang oder den Weg hinein bezeichnen. »Zugang« erhält diese leichte Offenheit und passt zum militärischen Zusammenhang.
- source_word: נָא
  choice: bitte
  rationale: Die Partikel mildert die Aufforderung ab und wird im modernen Deutsch natürlich mit »bitte« wiedergegeben.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: dann werden wir dir Güte erweisen
  rationale: Die Wendung verspricht dem Mann wohlwollende Behandlung. »Güte erweisen« bewahrt den Beziehungscharakter von חֶסֶד, ohne hier ausdrücklich eine Bundesbedeutung einzutragen.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד
  choice: Güte
  alternative: Freundlichkeit, Loyalität oder beständige Liebe
  rationale: In dieser Verhandlungsszene bezeichnet חֶסֶד am ehesten eine zugesagte wohlwollende beziehungsweise gnädige Behandlung. »Güte« lässt den weiteren Bedeutungsumfang erkennen, ohne den Begriff vorschnell als Bundestreue zu deuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; »Güte erweisen« ist bewusst etwas gehobener, um den Bedeutungsumfang von חֶסֶד nicht auf bloße Freundlichkeit zu verengen.
