base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: de
  text: 'Sie sagte zu ihm: »Gib mir doch einen Segen! Du hast mir das Land im Negev[a] gegeben; gib mir auch Wasserquellen[b].« Da gab Kaleb ihr die oberen und die unteren Quellen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Südland« beziehungsweise »das Trockenland«. Das hebräische Negev kann als Name der südlichen Region oder als Bezeichnung für südliches, trockenes Land verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck kann Quellen, Wasserstellen oder Wasserbecken bezeichnen; »Wasserquellen« passt besonders zum Zusammenhang eines trockenen Gebiets.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי בְרָכָה
  choice: Gib mir doch einen Segen
  rationale: הָבָה leitet hier eine nachdrückliche Bitte ein; »doch« gibt den bittenden Ton im modernen Deutschen wieder. »Segen« bewahrt die konkrete Bild- und Bedeutungswelt des hebräischen בְרָכָה, das in diesem Zusammenhang zugleich eine wohltuende Gabe bezeichnet.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: Land im Negev
  rationale: נֶגֶב kann als geografischer Name für die südliche Trockengegend oder allgemeiner als Bezeichnung für das Süd- beziehungsweise Trockenland verstanden werden. »im Negev« ist im Deutschen geografisch klar und wird durch eine Fußnote ergänzt.
- source_word: גֻּלֹּת מָיִם
  choice: Wasserquellen
  rationale: Die seltene Wendung bezeichnet Wasserstellen beziehungsweise Wasserquellen. »Wasserquellen« passt zum trockenen Land und lässt den konkreten Charakter der erbetenen Versorgung erkennen, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: גֻּלֹּת עִלִּית וְגֻלֹּת תַּחְתִּית
  choice: die oberen und die unteren Quellen
  rationale: Die gegensätzlichen Adjektive werden als topografische Zuordnung wiedergegeben. Nach der vorherigen Nennung der Wasserquellen genügt im Deutschen die knappe Wiederaufnahme mit »Quellen«.
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: Da gab Kaleb ihr
  rationale: »Da« führt die unmittelbare erzählerische Reaktion auf ihre Bitte natürlich fort; das ausdrücklich genannte Subjekt Kaleb bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Rede. Der bittende Ton wird durch »doch« ausgedrückt. Die Wiederholung von »gib mir« bewahrt die Struktur und Eindringlichkeit des Hebräischen; die echten lexikalischen Mehrdeutigkeiten bei Negev und den Wasserstellen werden in Fußnoten offengehalten.
