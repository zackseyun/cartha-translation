review_pass:
  verdict: revise
  source_fidelity: 'Die Ortsfolge, die zugehörigen kleineren Siedlungen, die kollektive Bezeichnung „die Kanaaniter“ und die demonstrative Wendung „diesem Land“ sind zutreffend wiedergegeben. Die Ergänzung „Bewohner von“ bei Bet-Schean und Taanach ist zwar sachlich naheliegend, nivelliert jedoch die im Hebräischen vorhandene Unterscheidung: Bei diesen beiden Orten stehen die Ortsnamen selbst, bei Dor, Jibleam und Megiddo ausdrücklich die Bewohner. Die Revision bewahrt diese Unterscheidung, ohne die Aussage unverständlich zu machen.'
  naturalness: Der Entschluss der Kanaaniter wird mit „waren entschlossen“ idiomatischer und unmittelbarer ausgedrückt als mit „bestanden darauf“. Die Reihung mit „weder … noch“ bleibt im modernen Standarddeutsch klar lesbar.
  terminology: '„Zugehörige Ortschaften“ ist eine verständliche Wiedergabe des idiomatischen „Töchter“. Die Fußnote wird berichtigt: Sie darf nicht von einer „Hauptstadt“ sprechen, da der hebräische Ausdruck lediglich eine Hauptsiedlung mit abhängigen kleineren Orten bezeichnet; außerdem lautet die wörtliche Formulierung „seine/ihre Töchter“, nicht „ihren Töchtern“. Die etablierten Ortsnamen können beibehalten werden.'
  issues:
  - severity: medium
    issue: Die Ergänzung „Bewohner von“ bei Bet-Schean und Taanach gleicht die unterschiedliche hebräische Konstruktion an.
    rationale: Der Text nennt bei Bet-Schean und Taanach die Orte selbst, bei den folgenden drei Orten dagegen ausdrücklich deren Bewohner. Eine Übersetzung kann die implizierten Einwohner verständlich machen, sollte die formale und semantische Differenz hier jedoch nicht unnötig verwischen.
  - severity: medium
    issue: Die Fußnote erklärt die Tochterorte als von der jeweiligen „Hauptstadt“ abhängig und gibt die wörtliche Form fehlerhaft wieder.
    rationale: „Hauptstadt“ ist anachronistisch bzw. zu spezifisch; gemeint sind kleinere, einer Hauptsiedlung zugeordnete Orte. בְּנוֹתֶיהָ bedeutet wörtlich „ihre Töchter“.
  - severity: low
    issue: „Die Kanaaniter bestanden darauf, … zu wohnen“ ist weniger natürlich als eine direkte Entschlossenheitsaussage.
    rationale: יאל kann hier Bereitschaft bzw. entschlossenen Willen ausdrücken. „Waren entschlossen“ gibt dies idiomatisch wieder und wahrt die in der Fußnote genannte Alternative.
