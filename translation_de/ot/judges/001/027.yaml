  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: de
  text: Doch Manasse vertrieb weder Bet-Schean mit den dazugehörigen Ortschaften noch Taanach mit den dazugehörigen Ortschaften, noch die Bewohner von Dor mit den dazugehörigen Ortschaften, noch die Bewohner von Jibleam mit den dazugehörigen Ortschaften, noch die Bewohner von Megiddo mit den dazugehörigen Ortschaften.[a] Die Kanaaniter waren entschlossen, in diesem Land zu wohnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine/ihre Töchter“; gemeint sind kleinere Ortschaften oder Siedlungen, die einer Hauptsiedlung zugeordnet waren.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Die Kanaaniter wollten in diesem Land wohnen.“ Das hebräische Verb kann Bereitschaft oder Entschlossenheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: vertrieb
  rationale: Der Hifil von ירשׁ bezeichnet hier, dass die bisherigen Bewohner aus ihrem Besitz verdrängt werden. „Vertrieb“ gibt dies in natürlichem Deutsch wieder, ohne den im Deutschen ungebräuchlichen Ausdruck „enteignete die Stadt“ zu erzwingen.
- source_word: בְּנוֹתֶיהָ
  choice: die dazugehörigen Ortschaften
  rationale: Wörtlich „ihre Töchter“; gemeint sind kleinere, von der jeweiligen Hauptstadt abhängige Siedlungen. Die idiomatische Wiedergabe ist im Haupttext unmittelbar verständlich, während die Fußnote das hebräische Bild bewahrt.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: die Bewohner von Dor … Jibleam … Megiddo
  rationale: Die Partizipialformen von ישׁב bezeichnen kollektiv die dort Wohnenden. Bei Bet-Schean und Taanach wird „Bewohner“ zur Verdeutlichung ergänzt, da das Verb sachlich Menschen und nicht bloß Ortsnamen zum Objekt hat.
- source_word: וַיּוֹאֶל
  choice: bestanden darauf
  rationale: יאל kann Bereitschaft, Entschlossenheit oder Beharren ausdrücken. Im Zusammenhang bezeichnet es den entschiedenen Willen der Kanaaniter, im Land wohnen zu bleiben; die Fußnote hält eine engere Alternative offen.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Die grammatisch singularische Bezeichnung wird hier kollektiv gebraucht und im Deutschen natürlich als Volksbezeichnung im Plural wiedergegeben.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: in diesem Land zu wohnen
  rationale: Die Infinitivkonstruktion bezeichnet, worauf der Wille der Kanaaniter gerichtet war. „Dieses Land“ bewahrt die demonstrative Bestimmtheit.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: Bet-Schean, Taanach, Dor, Jibleam, Megiddo
  rationale: Die Ortsnamen folgen geläufigen deutschsprachigen biblischen Umschriften.
theological_decisions: []
