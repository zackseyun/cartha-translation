revisions:
- from: Doch Manasse vertrieb weder die Bewohner von Bet-Schean und den dazugehörigen Ortschaften[a] noch die Bewohner von Taanach und den dazugehörigen Ortschaften, noch die Bewohner von Dor und den dazugehörigen Ortschaften, noch die Bewohner von Jibleam und den dazugehörigen Ortschaften, noch die Bewohner von Megiddo und den dazugehörigen Ortschaften. Die Kanaaniter bestanden darauf, in diesem Land zu wohnen.[b]
  to: Doch Manasse vertrieb weder Bet-Schean mit den dazugehörigen Ortschaften noch Taanach mit den dazugehörigen Ortschaften, noch die Bewohner von Dor mit den dazugehörigen Ortschaften, noch die Bewohner von Jibleam mit den dazugehörigen Ortschaften, noch die Bewohner von Megiddo mit den dazugehörigen Ortschaften.[a] Die Kanaaniter waren entschlossen, in diesem Land zu wohnen.[b]
  rationale: Die Revision erhält die Ortsnamen und die Aussage des Verses, stellt aber die hebräische Unterscheidung zwischen den zunächst genannten Orten und den anschließend ausdrücklich genannten Bewohnern wieder her. Die Erläuterung zu den „Tochterorten“ wird sprachlich und sachlich präzisiert. Für וַיּוֹאֶל wird eine im Deutschen natürliche Formulierung gewählt, die den möglichen entschlossenen Willen ausdrückt, ohne ihn zu verstärken.
