  text: וַ/יִּתְּנ֤וּ לְ/כָלֵב֙ אֶת חֶבְר֔וֹן כַּֽ/אֲשֶׁ֖ר דִּבֶּ֣ר מֹשֶׁ֑ה וַ/יּ֣וֹרֶשׁ מִ/שָּׁ֔ם אֶת שְׁלֹשָׁ֖ה בְּנֵ֥י הָ/עֲנָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: de
  text: Sie gaben Kaleb Hebron, wie Mose gesagt hatte, und er vertrieb von dort die drei Söhne Enaks.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die drei Nachkommen Enaks« beziehungsweise »die drei Anakiter«. Im Hebräischen steht »Söhne Enaks«; damit können auch Angehörige einer Abstammungsgruppe oder Sippe gemeint sein, nicht nur unmittelbare Söhne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  choice: Sie gaben Kaleb Hebron
  rationale: Der Erzählfortschritt des Wayyiqtol wird im Deutschen natürlich mit dem Präteritum wiedergegeben. לְ markiert Kaleb als Empfänger; Hebron bleibt das direkte Objekt.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: wie Mose gesagt hatte
  rationale: כַּאֲשֶׁר bedeutet hier »wie«; דִּבֶּר wird sachlich mit »gesagt« wiedergegeben. Das Plusquamperfekt macht den zeitlichen Rückbezug im Deutschen deutlich, ohne »versprochen« in den Text einzutragen.
- source_word: וַיּוֹרֶשׁ
  choice: und er vertrieb
  rationale: Der Hifil von ירש bezeichnet hier das Vertreiben bzw. Verdrängen der Bewohner. »Vertrieb« ist im heutigen Deutsch klarer und natürlicher als »enteignete« oder »nahm in Besitz«.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die adverbiale Wendung verweist auf Hebron zurück und wird formal und idiomatisch bewahrt.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: die drei Söhne Enaks
  rationale: בְּנֵי heißt wörtlich »Söhne von«. Diese transparente Wiedergabe bleibt im Haupttext erhalten; die mögliche Bedeutung »Nachkommen« oder »Anakiter« wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählstil. Die Namensform »Enak« folgt der im Deutschen geläufigen biblischen Wiedergabe von עֲנָק. Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext stehen, während ihre semantische Bandbreite in der Fußnote gesichert wird.
