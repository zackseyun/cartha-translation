base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: de
  text: 'Und Juda sagte zu seinem Bruder Simeon: »Zieh mit mir hinauf in mein durch das Los zugeteiltes Gebiet[a], und lass uns gegen die Kanaaniter kämpfen. Auch ich will mit dir in dein durch das Los zugeteiltes Gebiet ziehen.« Da zog Simeon mit ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in mein Los«; ebenso später: »in dein Los«. Gemeint ist jeweils das durch das Los zugeteilte Gebiet.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise von גּוֹרָל und erklärt ihre metonymische Bedeutung im Zusammenhang.
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוּדָה
  choice: Und Juda sagte
  rationale: Das narrative Wayyiqtol führt das nächste Ereignis der Erzählung ein; »und« bewahrt den hebräischen Erzählfluss, ohne eine stärkere zeitliche oder kausale Beziehung einzutragen.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: zu seinem Bruder Simeon
  rationale: אָחִיו bezeichnet ausdrücklich seinen Bruder. Im Zusammenhang sind Juda und Simeon zugleich Stammväter und die nach ihnen benannten Stämme; die konkrete Verwandtschaftssprache bleibt erhalten.
- source_word: עֲלֵה אִתִּי
  choice: Zieh mit mir hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung oder einen Aufbruch. »Hinaufziehen« ist im militärisch-geografischen Zusammenhang natürlich und bewahrt diese Nuance.
- source_word: בְּגוֹרָלִי / בְּגוֹרָלֶךָ
  choice: in mein/dein durch das Los zugeteiltes Gebiet
  rationale: גּוֹרָל bedeutet wörtlich »Los«, bezeichnet hier aber metonymisch das durch Los zugewiesene Stammesgebiet. Die Übersetzung macht den Gemeinten klar und hält zugleich das Losverfahren ausdrücklich fest.
- source_word: וְנִלָּחֲמָה
  choice: und lasst uns ... kämpfen
  rationale: Die Kohortativform der ersten Person Plural drückt eine gemeinsame Aufforderung beziehungsweise Entschlossenheit aus; »lasst uns kämpfen« gibt diese hortative Kraft wieder.
- source_word: בַּכְּנַעֲנִי
  choice: gegen die Kanaaniter
  rationale: Die morphologische Einzahl dient hier als Kollektivbezeichnung für die Volksgruppe und wird im Deutschen natürlich im Plural wiedergegeben.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: Dann will auch ich mit dir ... ziehen
  rationale: Die Formulierung gibt Judas gegenseitiges Versprechen wieder; »auch ich« erhält die Hervorhebung durch גַם אֲנִי.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: Da zog Simeon mit ihm
  rationale: »Da« gibt die anschließende Erfüllung der Bitte im fortlaufenden Erzählzusammenhang knapp und natürlich wieder.
theological_decisions:
- issue: Verwandtschaftsbezeichnung אָחִיו
  choice: seinem Bruder
  alternative: seinem Stammesbruder / seinem Verwandten
  rationale: Der Ausgangstext verwendet ausdrücklich das Wort »Bruder«. Die wörtliche Verwandtschaftsbezeichnung wahrt zugleich die geschichtliche und die stammesbezogene Ebene, ohne sie erklärend einzuengen.
- issue: Bedeutung von גּוֹרָל im Zusammenhang der Landverteilung
  choice: durch das Los zugeteiltes Gebiet
  alternative: Los / Losanteil
  rationale: Gemeint ist das Stammesgebiet, das durch das Los zugewiesen wurde. Die gewählte Wiedergabe vermeidet die mögliche Fehlvorstellung eines bloßen Losgegenstands, ohne die theologisch und erzählerisch bedeutsame Zuteilung durch das Los zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Satzführung. Die direkte Rede bleibt knapp und handlungsorientiert; »hinaufziehen« bewahrt den biblisch-geografischen Bewegungsaspekt, ohne altertümlich zu wirken.
