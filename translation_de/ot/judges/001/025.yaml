base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: de
  text: Da zeigte er ihnen den Zugang zur Stadt. Sie schlugen die Stadt mit der Schärfe des Schwertes[a]; den Mann aber und seine ganze Familie[b] ließen sie gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Mund des Schwertes“; eine hebräische Wendung für „mit der Schwertschneide“ bzw. „mit dem Schwert“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine ganze Sippe“ beziehungsweise „sein ganzes Haus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: Da zeigte er ihnen
  rationale: 'Die Form von ראה mit dem Suffix der 3. Person Plural hat hier kausativen Sinn: Der Mann machte ihnen den Zugang sichtbar beziehungsweise wies ihn ihnen.'
- source_word: מְבוֹא הָעִיר
  choice: den Zugang zur Stadt
  rationale: מָבוֹא bezeichnet den Eingang, Zugang oder Weg hinein. „Zugang zur Stadt“ ist im militärischen Zusammenhang natürlich und lässt offen, ob ein Tor oder ein verborgener Zugang gemeint ist.
- source_word: וַיַּכּוּ
  choice: Sie schlugen
  rationale: נכה hat das breite Bedeutungsspektrum „schlagen, angreifen, besiegen“. „Schlugen“ bewahrt die Bildsprache und verbindet sich mit der folgenden Schwertformel.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die feste hebräische Wendung bedeutet wörtlich „mit dem Mund des Schwertes“ und bezeichnet einen vernichtenden Angriff mit dem Schwert. Die deutsche Formulierung erhält das Bild, ohne das ungewöhnliche „Mund“ in den Haupttext zu übernehmen.
- source_word: שִׁלֵּחוּ
  choice: ließen sie gehen
  rationale: Im Zusammenhang bedeutet das Verb, dass die Angreifer den Mann und die Seinen verschonten und freiließen.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: seine ganze Familie
  rationale: מִשְׁפָּחָה kann Familie, Großfamilie oder Sippe bezeichnen. „Ganze Familie“ ist klar und natürlich; die größere soziale Reichweite bleibt in einer Fußnote sichtbar.
- source_word: הָאִישׁ
  choice: den Mann
  rationale: Der bestimmte Ausdruck verweist auf den bereits im vorherigen Vers erwähnten Mann zurück.
