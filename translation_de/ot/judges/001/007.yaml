base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: de
  text: 'Da sagte Adoni-Besek: »Siebzig Könige, denen die Daumen und die großen Zehen abgeschnitten waren,[a] lasen unter meinem Tisch Essensreste auf.[b] Wie ich getan habe, so hat Gott mir vergolten.[c]« Dann brachten sie ihn nach Jerusalem, und dort starb er.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deren Daumen ihrer Hände und Füße abgeschnitten waren«; gemeint sind die Daumen und die großen Zehen.'
    reason: Die hebräische Formulierung nennt Hände und Füße ausdrücklich; בֹּהֶן bezeichnet je nach Körperteil den Daumen oder die große Zehe.
  - marker: b
    text: Das hebräische Verb bedeutet »sammeln, auflesen«; ein Gegenstand wird nicht ausdrücklich genannt. Aus der Situation unter dem Tisch sind Essensreste zu erschließen.
    reason: Die Ergänzung »Essensreste« macht die im Zusammenhang vorausgesetzte Handlung auf Deutsch verständlich, während die Fußnote die formale Offenheit des Hebräischen bewahrt.
  - marker: c
    text: Das hebräische Wort für »Gott« hat eine pluralische Form, steht hier aber mit einem Verb im Singular.
    reason: Die Fußnote dokumentiert, warum trotz der äußeren Pluralform singularisch übersetzt wird.
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Besek
  rationale: Die Bezeichnung wird im Zusammenhang als Eigenname gebraucht und daher in einer dem Deutschen angepassten Form transliteriert; die mögliche Bedeutung »Herr von Besek« wird nicht in den Text hineingedeutet.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: die Daumen und die großen Zehen
  rationale: בֹּהֶן bezeichnet an der Hand den Daumen und am Fuß die große Zehe. Die natürliche deutsche Wiedergabe benennt beide Körperteile eindeutig, ohne die hebräische Konstruktion »Daumen ihrer Hände und ihrer Füße« nachzuahmen.
- source_word: מְקֻצָּצִים
  choice: abgeschnitten
  rationale: Das passive Partizip von קצץ bezeichnet hier das Abtrennen von Körperteilen; »abgeschnitten« ist klar und sachlich.
- source_word: הָיוּ מְלַקְּטִים
  choice: lasen … auf
  rationale: Die Verbindung aus הָיוּ und Partizip beschreibt eine wiederholte beziehungsweise gewohnheitsmäßige Handlung in der Vergangenheit. לקט bedeutet sammeln oder auflesen.
- source_word: תַּחַת שֻׁלְחָנִי
  choice: unter meinem Tisch
  rationale: Die räumliche Angabe wird unmittelbar und natürlich wiedergegeben.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: Wie ich getan habe, so
  rationale: Die entsprechende Vergeltung zwischen früherem Handeln und gegenwärtigem Ergehen bleibt in der formelhaften Gegenüberstellung erhalten.
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: hat Gott mir vergolten
  rationale: Das Piel von שׁלם bezeichnet Vergeltung beziehungsweise angemessene Rückzahlung. »Vergolten« bewahrt den ernsten Zusammenhang, ohne die Aussage moralisch weiter auszudeuten.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: Dann brachten sie ihn nach Jerusalem
  rationale: Die fortlaufende Erzählform wird mit einem natürlichen deutschen Erzählanschluss wiedergegeben; das ungenannte männliche Pluralsubjekt bleibt als »sie« erhalten.
- source_word: וַיָּמָת שָׁם
  choice: und dort starb er
  rationale: Die Ortsangabe wird für einen flüssigen deutschen Satz vorangestellt; Inhalt und erzählerische Folge bleiben unverändert.
theological_decisions:
- issue: Bezug von אֱלֹהִים in Adoni-Beseks Aussage
  choice: Gott
  alternative: die Götter
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, steht das zugehörige Verb שִׁלַּם im Singular. Daher bezeichnet der Ausdruck hier Gott. Die Übersetzung legt jedoch nicht fest, wie umfassend Adoni-Beseks persönliche Gotteserkenntnis war.
- issue: Deutung der Vergeltungsaussage
  choice: hat Gott mir vergolten
  alternative: hat Gott es mir heimgezahlt
  rationale: Die Übersetzung gibt Adoni-Beseks eigene Deutung seines Schicksals wieder, ohne daraus über den Wortlaut hinaus eine allgemeine Lehre über göttliche Vergeltung abzuleiten.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Die direkte Rede bleibt knapp und eindringlich. »Vergolten« ist leicht gehoben, aber allgemein verständlich und trägt der feierlichen Aussage besser Rechnung als das umgangssprachliche »heimgezahlt«.
