base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: de
  text: So lebten die Ascheriter mitten unter den Kanaanitern[a], den Bewohnern des Landes, denn sie vertrieben sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen kollektiv gebrauchte Singularformen: wörtlich etwa „der Ascheriter … der Kanaaniter … er vertrieb ihn nicht“. Gemeint sind der Stamm Ascher und die Kanaaniter als Volksgruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: So lebten
  rationale: ישׁב bezeichnet hier das Wohnen bzw. Leben an einem Ort. „lebten“ ist modern und natürlich; „So“ nimmt den erzählerischen Anschluss durch וַ auf.
- source_word: הָאָשֵׁרִי
  choice: die Ascheriter
  rationale: Der bestimmte Gentilname im Singular ist kollektiv gebraucht und bezeichnet die Angehörigen des Stammes Ascher. Der deutsche Plural gibt diesen Sinn verständlich wieder.
- source_word: בְּקֶרֶב
  choice: mitten unter
  rationale: Die Wendung bezeichnet das Leben inmitten einer Bevölkerungsgruppe. „mitten unter“ bewahrt gegenüber dem bloßen „unter“ den Nachdruck des hebräischen Ausdrucks.
- source_word: הַכְּנַעֲנִי
  choice: den Kanaanitern
  rationale: Die morphologische Singularform ist kollektiv gemeint; der folgende pluralische Ausdruck „Bewohner des Landes“ bestätigt den Bezug auf die Volksgruppe.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: den Bewohnern des Landes
  rationale: Die partizipiale Wortgruppe steht als nähere Bestimmung zu den Kanaanitern und lässt sich im Deutschen präzise und idiomatisch so wiedergeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die zuvor beschriebene Lage. „denn“ wahrt den erzählenden Zusammenhang natürlicher als ein unterordnendes „weil“.
- source_word: לֹא הוֹרִישׁוֹ
  choice: sie hatten sie nicht vertrieben
  rationale: Der Hifil von ירשׁ bezeichnet in diesem Zusammenhang das Vertreiben bzw. Verdrängen der Landesbewohner. Das Plusquamperfekt macht im Deutschen deutlich, dass das unterlassene Vertreiben die vorausliegende Ursache ihres Zusammenlebens war; die Pluralformen geben die kollektiven Singularformen sinngemäß wieder.
theological_decisions:
- issue: Kollektiv gebrauchte Singularformen für Stamm und Volksgruppe
  choice: 'Kollektiv im Plural wiedergeben: „die Ascheriter“, „die Kanaaniter“, „sie … sie“.'
  alternative: 'Die grammatischen Singularformen formal nachbilden: „der Ascheriter … der Kanaaniter … er … ihn“.'
  rationale: Der Kontext handelt nicht von zwei Einzelpersonen, sondern von Stamm und Bevölkerungsgruppe. Der deutsche Plural bewahrt den gemeinten kollektiven Sinn und vermeidet eine irreführende Individualisierung.
- issue: Verhältnis zwischen Ascheritern und Kanaanitern
  choice: „mitten unter den Kanaanitern“
  alternative: „neben den Kanaanitern“ oder eine Formulierung, die Gleichordnung nahelegt
  rationale: Der hebräische Text betont, dass die Ascheriter inmitten der ansässigen Kanaaniter lebten, weil sie diese nicht vertrieben hatten. Die Übersetzung bewahrt diese Spannung, ohne weitere politische oder theologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiv gebrauchten hebräischen Singularformen werden zur Vermeidung eines missverständlichen individuellen Bezugs im Deutschen pluralisch wiedergegeben; eine Fußnote dokumentiert die Form des Ausgangstextes.
