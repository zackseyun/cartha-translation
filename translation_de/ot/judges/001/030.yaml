source:
  edition: WLC
  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: de
  text: Sebulon vertrieb weder die Bewohner von Kitron noch die Bewohner von Nahalol[a]. Und die Kanaaniter lebten in Sebulons Mitte[b] und wurden zu Fronarbeitern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Nahalal“; in verwandten Stellen und in der Überlieferung begegnet diese Form des Ortsnamens.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich steht im Hebräischen: „Der Kanaaniter lebte in seiner Mitte.“ „Kanaaniter“ ist kollektiv gebraucht; „seiner“ bezieht sich wahrscheinlich auf Sebulon als Stamm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: vertrieb
  rationale: Der Hifil von ירש bezeichnet hier die Vertreibung der bisherigen Bewohner aus dem Land. „Vertrieb“ ist im Deutschen natürlich und bewahrt den militärisch-siedlungsgeschichtlichen Sinn.
- source_word: יוֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das Partizip von ישב bezeichnet die an einem Ort Wohnenden; „Bewohner von“ ist knapp und idiomatisch.
- source_word: קִטְרוֹן
  choice: Kitron
  rationale: Der Ortsname wird gemäß der masoretischen Vokalisierung transliteriert.
- source_word: נַהֲלֹל
  choice: Nahalol
  rationale: Die Form folgt unmittelbar der Vokalisierung des WLC in diesem Vers; „Nahalal“ ist eine mögliche traditionelle Namensform.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: Daher lebten die Kanaaniter mitten unter ihm
  rationale: הַכְּנַעֲנִי steht als kollektiver Singular und wird im Deutschen natürlich im Plural wiedergegeben. Das singularische Suffix in בְּקִרְבּוֹ wird als Bezug auf den Stamm Sebulon bewahrt, statt stillschweigend in einen Plural umgedeutet zu werden.
- source_word: לָמַס
  choice: zu Fronarbeitern
  rationale: מַס bezeichnet hier auferlegte Zwangs- beziehungsweise Fronarbeit, nicht bloß eine Geldabgabe. „Fronarbeiter“ gibt den Status der unterworfenen Bevölkerung natürlich wieder.
theological_decisions:
- issue: Kollektiver Singular הַכְּנַעֲנִי und singularisches Suffix בְּקִרְבּוֹ
  choice: „die Kanaaniter … mitten unter ihm“, wobei „ihm“ auf den Stamm Sebulon als kollektive Einheit verweist
  alternative: „die Kanaaniter lebten unter ihnen“ oder formal „der Kanaaniter lebte in seiner Mitte“
  rationale: Das Hebräische verbindet die kollektive Bezeichnung des Volkes mit einem singularischen Bezug auf Sebulon. Die Übersetzung macht den kollektiven Sinn verständlich, bewahrt aber durch „ihm“ die grammatische Spannung des Ausgangstextes; eine Fußnote erläutert den Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fronarbeiter“ ist verständlich und historisch passend; die kollektive Redeweise wird im Haupttext lesbar gestaltet, ohne den singularischen Stammesbezug zu verdecken.
