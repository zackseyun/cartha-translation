  text: וַ/יִּלָּחֲמ֤וּ בְנֵֽי יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם וַ/יִּלְכְּד֣וּ אוֹתָ֔/הּ וַ/יַּכּ֖וּ/הָ לְ/פִי חָ֑רֶב וְ/אֶת הָ/עִ֖יר שִׁלְּח֥וּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: de
  text: Die Söhne Judas kämpften gegen Jerusalem[a], nahmen die Stadt ein, schlugen sie mit der Schärfe des Schwertes[b] und steckten sie in Brand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kämpften in Jerusalem“. Im Zusammenhang ist „gegen Jerusalem“ wahrscheinlicher.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch wörtlich: „mit dem Mund des Schwertes“; gemeint ist die Schärfe beziehungsweise Schneide des Schwertes.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ בְנֵי יְהוּדָה בִּירוּשָׁלִַם
  choice: Die Söhne Judas kämpften gegen Jerusalem
  rationale: לחם bezeichnet hier den Kampf; ב markiert im kriegerischen Zusammenhang am wahrscheinlichsten das Angriffsziel. בְנֵי יְהוּדָה wird als korporative Stammesbezeichnung quellennah mit „Söhne Judas“ wiedergegeben.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: nahmen die Stadt ein
  rationale: לכד bezeichnet bei einer Stadt ihre militärische Einnahme. Das ausdrücklich genannte „die Stadt“ vermeidet im Deutschen die unnatürliche feminine Rückverweisung auf „Jerusalem“.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: schlugen sie mit der Schärfe des Schwertes
  rationale: Die Wiedergabe bewahrt sowohl das breite Verb נכה („schlagen“) als auch das Bild der idiomatischen Wendung פִי חֶרֶב, wörtlich „Mund/Schärfe des Schwertes“.
- source_word: וְאֶת הָעִיר שִׁלְּחוּ בָאֵשׁ
  choice: und steckten sie in Brand
  rationale: Die Konstruktion שלח באש bedeutet, etwas dem Feuer preiszugeben beziehungsweise anzuzünden. „In Brand stecken“ ist eine natürliche, präzise deutsche Wiedergabe.
theological_decisions: []
