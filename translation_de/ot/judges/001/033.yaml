- from: Die Naftaliter vertrieben weder die Bewohner von Bet-Schemesch noch die Bewohner von Bet-Anat. Sie lebten unter den Kanaanitern, den Bewohnern des Landes. Die Bewohner von Bet-Schemesch und Bet-Anat aber mussten für sie Frondienst leisten.[a]
  to: Der Stamm Naftali vertrieb weder die Bewohner von Bet-Schemesch noch die Bewohner von Bet-Anat. Er lebte unter den Kanaanitern, den Bewohnern des Landes. Die Bewohner von Bet-Schemesch und Bet-Anat wurden für den Stamm Naftali zu Fronarbeit herangezogen.[a]
  rationale: Die Überarbeitung wahrt den kollektiven Singular des hebräischen Stammesnamens, verwendet die geläufige Stammesbezeichnung „der Stamm Naftali“ und gibt die Unterwerfung zu verpflichtender Arbeitsleistung mit einer resultativen, idiomatischen deutschen Formulierung wieder. Die Apposition und die Wiederholung der Ortsbewohner bleiben erhalten.
