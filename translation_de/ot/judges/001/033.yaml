base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: de
  text: Der Stamm Naftali vertrieb weder die Bewohner von Bet-Schemesch noch die Bewohner von Bet-Anat. Er lebte unter den Kanaanitern, den Bewohnern des Landes. Die Bewohner von Bet-Schemesch und Bet-Anat wurden für den Stamm Naftali zu Fronarbeit herangezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet verpflichtenden Arbeitsdienst (Fronarbeit), nicht lediglich die Zahlung von Tribut.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: die Naftaliter
  rationale: Der Stammesname steht im Hebräischen als kollektiver Singular. Der deutsche Plural bezeichnet die Angehörigen des Stammes natürlich und passt zugleich zum späteren pluralischen Pronomen לָהֶם.
- source_word: הוֹרִישׁ
  choice: vertrieben
  rationale: Der Hifil von ירש bezeichnet hier die Vertreibung der bisherigen Bewohner aus dem Land; „vertrieben“ gibt den konkreten militärisch-siedlungsgeschichtlichen Sinn wieder.
- source_word: יֹשְׁבֵי
  choice: die Bewohner
  rationale: Das substantivierte Partizip bezeichnet die in den genannten Orten beziehungsweise im Land ansässigen Menschen.
- source_word: בֵית שֶׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der Ortsname wird nach üblicher deutscher Bibelnamenschreibung transliteriert.
- source_word: בֵית עֲנָת
  choice: Bet-Anat
  rationale: Der Ortsname wird transliteriert und nicht etymologisch übersetzt.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: Sie lebten unter
  rationale: Die hebräische Wendung bedeutet idiomatisch, innerhalb beziehungsweise inmitten einer Bevölkerungsgruppe zu wohnen. Der deutsche Plural entspricht der kollektiven Wiedergabe von נַפְתָּלִי.
- source_word: הַכְּנַעֲנִי
  choice: den Kanaanitern
  rationale: Der morphologische Singular ist eine kollektive Volksbezeichnung und wird im Deutschen natürlich im Plural wiedergegeben.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: den Bewohnern des Landes
  rationale: Die appositionelle Bestimmung der Kanaaniter bleibt erhalten und wird nicht als entbehrliche Wiederholung ausgelassen.
- source_word: הָיוּ לָהֶם לָמַס
  choice: mussten für sie Frondienst leisten
  rationale: מַס bezeichnet verpflichtenden Arbeitsdienst. Die modale Formulierung ist im heutigen Deutsch natürlicher als eine wörtliche Konstruktion mit „wurden“, bewahrt aber den Zwangscharakter und den Dienst zugunsten der Naftaliter.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stammesbezeichnung wird kollektiv als „die Naftaliter“ wiedergegeben; Ortsnamen folgen einer geläufigen deutschen Transliteration. Die Wiederholung von „Bewohner“ und die Apposition „den Bewohnern des Landes“ bleiben als Merkmale des hebräischen Textes erhalten.
