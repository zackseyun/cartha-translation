  terminology: „Bet-Schemesch“, „Bet-Anat“, „Kanaaniter“ und „Fronarbeit“ sind angemessen. Die Fußnote erklärt מַס sachgerecht als verpflichtenden Arbeitsdienst statt bloßen Tributs.
