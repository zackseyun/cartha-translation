  yaml_path: translation/ot/judges/001/018.yaml
  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: de
  text: Juda eroberte Gaza und sein Gebiet[a], Aschkelon und sein Gebiet sowie Ekron und sein Gebiet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Grenze“; ebenso bei den weiteren Vorkommen von „sein Gebiet“. Das hebräische Wort kann sowohl eine Grenze als auch das von ihr umschlossene Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: eroberte
  rationale: Das Verb לכד bezeichnet häufig die gewaltsame Einnahme einer Stadt oder eines Ortes. „Eroberte“ ist im militärischen Zusammenhang natürlich und präzise.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname steht hier kollektiv für den Stamm. Die knappe Wiedergabe „Juda“ bewahrt die Ausdrucksweise des Hebräischen, ohne „der Stamm“ ergänzend einzutragen.
- source_word: גְּבוּלָהּ
  choice: sein Gebiet
  rationale: גְּבוּל kann eine Grenze oder das von ihr umschlossene Gebiet bezeichnen. In der Aufzählung eroberter Städte ist „sein Gebiet“ idiomatisch und erfasst wahrscheinlich den zugehörigen Bezirk; die echte lexikalische Alternative wird in der Fußnote erhalten.
- source_word: עַזָּה
  choice: Gaza
  rationale: Im Deutschen gebräuchliche Form des Ortsnamens.
- source_word: אַשְׁקְלוֹן
  choice: Aschkelon
  rationale: Im modernen Standarddeutsch gebräuchliche Form des Ortsnamens.
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Im Deutschen gebräuchliche Form des Ortsnamens.
