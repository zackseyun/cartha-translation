  text: וַ/יִּלְחֲצ֧וּ הָ/אֱמֹרִ֛י אֶת בְּנֵי דָ֖ן הָ/הָ֑רָ/ה כִּי לֹ֥א נְתָנ֖/וֹ לָ/רֶ֥דֶת לָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: de
  text: Die Amoriter drängten die Söhne Dans ins Bergland zurück[a], denn sie ließen sie nicht ins Tal hinabziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Die Amoriter drängten die Söhne Dans zum Bergland hin, denn sie ließen sie nicht ins Tal hinabziehen.“ Das hebräische Wort für „Amoriter“ steht formal im Singular, bezeichnet hier aber kollektiv das Volk; die Verben stehen im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: drängten … zurück
  rationale: Das Verb bezeichnet bedrängen oder in eine eingeengte Lage zwingen. Im Zusammenhang mit der Richtungsangabe gibt „zurückdrängen“ die feindliche Verdrängung natürlich wieder.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der morphologische Singular ist hier als kollektive Bezeichnung des Volkes zu verstehen; im Deutschen ist der Plural idiomatisch.
- source_word: בְּנֵי דָן
  choice: die Söhne Dans
  rationale: Die formnahe Wiedergabe bewahrt die familiär-stammesbezogene Ausdrucksweise des Hebräischen und ist im biblischen Erzählstil verständlich.
- source_word: הָהָרָה
  choice: ins Bergland
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum Berggebiet hin. „Bergland“ bildet zudem einen klaren geografischen Gegensatz zum Tal.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung des vorhergehenden Geschehens ein; „denn“ ist in diesem Satz natürlich und eindeutig kausal.
- source_word: לֹא נְתָנוֹ
  choice: sie ließen sie nicht
  rationale: Der hebräische Text verwendet kollektiv-singularische Formen. Die pluralische Wiedergabe macht den gemeinten Bezug auf Amoriter und Daniten im Deutschen verständlich.
- source_word: לָרֶדֶת
  choice: hinabziehen
  rationale: Das Verb bezeichnet topografisch das Hinabgehen. „Hinabziehen“ passt natürlich zur Bewegung einer Stammesgruppe.
- source_word: לָעֵמֶק
  choice: ins Tal
  rationale: עֵמֶק bezeichnet ein Tal beziehungsweise eine Niederung; „Tal“ ist hier die direkte und zum Bergland passende Entsprechung.
