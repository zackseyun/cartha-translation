base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: de
  text: Und der Mann ging in das Land der Hethiter, baute eine Stadt und nannte sie Lus. So heißt sie bis heute.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ הָאִישׁ
  choice: Und der Mann zog
  rationale: Die narrative Wayyiqtol-Form von הלך bezeichnet das Weggehen beziehungsweise Ziehen; „zog“ ist im Zusammenhang einer Reise in ein anderes Land natürlich und bewahrt den bestimmten Rückbezug von הָאִישׁ.
- source_word: אֶרֶץ הַחִתִּים
  choice: in das Land der Hetiter
  rationale: Die Constructusverbindung bedeutet wörtlich „Land der Hetiter“ und lässt die genaue politische oder geografische Beschaffenheit des Gebiets offen.
- source_word: וַיִּבֶן עִיר
  choice: Dort baute er eine Stadt
  rationale: בנה mit עִיר bedeutet unmittelbar „eine Stadt bauen“. „Dort“ verdeutlicht lediglich den im Hebräischen durch die Satzfolge gegebenen Ortsbezug, ohne „gründete“ interpretierend einzutragen.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: und nannte sie Lus
  rationale: Die wörtliche hebräische Wendung „und er nannte ihren Namen Lus“ wird im modernen Deutschen idiomatisch mit „nannte sie Lus“ wiedergegeben; das feminine Pronomen bezieht sich auf die Stadt.
- source_word: לוּז
  choice: Lus
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form „Lus“ wiedergegeben.
- source_word: הוּא שְׁמָהּ עַד הַיּוֹם הַזֶּה
  choice: So heißt sie bis auf den heutigen Tag
  rationale: Die Nominalkonstruktion besagt, dass dies weiterhin ihr Name ist. Die deutsche Wendung gibt den fortdauernden Zustand und die feste Zeitformel natürlich und würdig wieder.
theological_decisions: []
translation_notes:
  register: Moderner, gut verständlicher Standarddeutsch-Stil mit würdigem Erzählton. Die hebräische Satzkette wird zur natürlichen deutschen Gliederung in zwei Sätze aufgeteilt; echte inhaltliche Mehrdeutigkeiten werden nicht dogmatisch aufgelöst.
