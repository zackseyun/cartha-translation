  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: de
  text: 'Da sagte der HERR: »Juda soll hinaufziehen. Siehe, ich habe das Land in seine Hand gegeben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenform; sie entspricht der konsultierten englischen Fassung und ist im modernen Bibeldeutsch geläufig.
- source_word: יַעֲלֶה
  choice: soll hinaufziehen
  rationale: Das Verb עלה bezeichnet hier den militärischen Aufbruch gegen das Gebiet; »hinaufziehen« bewahrt das räumliche Bild und gibt die kontextuelle Aufforderung angemessen wieder.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel wird als direkte Aufforderung wiedergegeben und behält ihre hervorhebende Funktion.
- source_word: נָתַתִּי
  choice: ich habe ... gegeben
  rationale: Das hebräische Perfekt stellt die Übergabe als feststehende beziehungsweise bereits vollzogene göttliche Handlung dar.
- source_word: בְּיָדוֹ
  choice: in seine Hand
  rationale: Die hebräische Herrschafts- und Verfügungsmetapher bleibt erhalten, statt sie interpretierend mit »in seine Gewalt« oder »ihm« aufzulösen.
theological_decisions:
- issue: Bezug von »Juda« und des männlichen Pronomens
  choice: »Juda« wird als handelnde Stammesgröße mit dem Singularpronomen »seine« wiedergegeben.
  alternative: Pluralische Wiedergabe als »die Judäer ... ihre Hand«
  rationale: Der hebräische Text verwendet sowohl für Juda als auch für das Possessivsuffix den grammatischen Singular; diese mögliche kollektive Personifizierung soll sichtbar bleiben.
- issue: Zeitlicher beziehungsweise gewissheitsbezogener Sinn von נָתַתִּי
  choice: 'Perfektisch: »ich habe ... gegeben«'
  alternative: 'Futurisch oder präsentisch: »ich werde ... geben« beziehungsweise »ich gebe ...«'
  rationale: Die Form ist ein Perfekt. Die Spannung zwischen der erklärten Übergabe und der erst folgenden Eroberung wird nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblisch geläufiger, aber verständlicher Syntax. »Hinaufziehen« und »in seine Hand geben« bewahren zentrale Bilder des hebräischen Textes; »Seht« wirkt unmittelbar und entspricht der hervorgehobenen Anrede.
