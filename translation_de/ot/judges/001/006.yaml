  terminology: »Adoni-Besek« ist eine angemessene deutsche Transkription eines als Eigen- bzw. Titelnamen verwendeten Ausdrucks. »Große Zehen« ist verständlich und treffend; keine fachsprachliche oder konfessionell geprägte Terminologie liegt vor. Die Fußnote erklärt die wörtliche hebräische Körperteilbezeichnung korrekt und sinnvoll.
