source:
  edition: WLC
  text: וַ/יָּ֨נָס֙ אֲדֹ֣נִי בֶ֔זֶק וַֽ/יִּרְדְּפ֖וּ אַחֲרָ֑י/ו וַ/יֹּאחֲז֣וּ אֹת֔/וֹ וַֽ/יְקַצְּצ֔וּ אֶת בְּהֹנ֥וֹת יָדָ֖י/ו וְ/רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: de
  text: Adoni-Besek aber floh. Sie verfolgten ihn, ergriffen ihn und schnitten ihm die Daumen und die großen Zehen ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Daumen seiner Hände und seiner Füße«; gemeint sind seine Daumen und großen Zehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: floh
  rationale: Das Verb נוּס bezeichnet hier die Flucht. »Floh« gibt die Erzählbewegung knapp wieder und vermeidet das unzutreffende »entkam«, da Adoni-Besek anschließend gefasst wird.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Besek
  rationale: Die Wortgruppe kann ihrem Aufbau nach »Herr von Besek« bedeuten, fungiert im Zusammenhang jedoch als Eigen- beziehungsweise Titelname und wird daher transliteriert.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: Sie verfolgten ihn
  rationale: רדף mit אַחַר bedeutet »jemandem nachjagen/verfolgen«. »Sie verfolgten ihn« ist natürliches, dem Erzählstil angemessenes Deutsch.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: ergriffen ihn
  rationale: אחז bezeichnet das feste Ergreifen oder Packen. »Ergriffen ihn« vermittelt hier die gewaltsame Gefangennahme prägnant.
- source_word: וַיְקַצְּצוּ
  choice: schnitten … ab
  rationale: קצץ bezeichnet in diesem Zusammenhang das Abtrennen von Körperteilen. Die deutsche Verbklammer »schnitten … ab« gibt dies klar wieder.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: die Daumen und die großen Zehen
  rationale: בֹּהֶן bezeichnet an der Hand den Daumen und am Fuß die große Zehe. Die idiomatische deutsche Wiedergabe entfaltet die knappe hebräische Formulierung, ohne ihren Sinn zu verändern.
