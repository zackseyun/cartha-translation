  rationale: Die Revision ersetzt die missverständliche Bannformel durch eine im modernen Deutsch klare und zugleich quellentreue Wiedergabe von חרם. Sie entfernt die nicht notwendige zeitliche Ergänzung „Danach“, bewahrt die hebräische Singularform beim Benennen und ergänzt dazu eine erläuternde Fußnote. Die Ortsnamen und der erzählerisch-würdige Registerton bleiben erhalten.
