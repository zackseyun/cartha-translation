  naturalness: „Da zog Juda mit seinem Bruder Simeon“ und „sie schlugen die Kanaaniter“ sind in einem würdevoll-biblischen, aber verständlichen modernen Standarddeutsch natürlich. „gab der Stadt den Namen“ ist eine idiomatische deutsche Namensformel. Die ersatzweise gewählte Formulierung „weihten die Stadt der Vernichtung“ ist klarer als „vollstreckten an der Stadt den Bann“.
