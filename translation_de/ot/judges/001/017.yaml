  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: de
  text: Da zog Juda mit seinem Bruder Simeon, und sie schlugen die Kanaaniter, die in Zefat wohnten, und weihten die Stadt der Vernichtung[a]. Und er gab der Stadt den Namen Horma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie belegten die Stadt mit dem Bann“ oder „sie vernichteten sie vollständig“. Das hebräische Verb bezeichnet die unwiderrufliche Weihung an den Bann (ḥerem), gewöhnlich mit Vernichtung als Folge.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Verb lautet Singular („er gab den Namen“); es kann sich auf Juda als kollektive oder repräsentative Größe beziehen. Horma klingt zudem an das hebräische Wort für den Bann (ḥerem) an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: Da zog Juda mit seinem Bruder Simeon
  rationale: הלך bedeutet zunächst „gehen/ziehen“; אֶת bezeichnet hier die Begleitung. „zog … mit“ passt natürlich in den militärischen Erzählzusammenhang, ohne ausdrücklich einen Feldzug in den Text einzutragen. „Juda“ und „Simeon“ können hier kollektiv für die jeweiligen Stämme stehen.
- source_word: וַיַּכּוּ אֶת הַכְּנַעֲנִי
  choice: sie schlugen die Kanaaniter
  rationale: נכה bezeichnet im militärischen Kontext das Schlagen oder Besiegen. Der morphologische Singular „der Kanaaniter“ ist kollektiv gebraucht und wird im Deutschen sinnvoll als Plural wiedergegeben.
- source_word: יוֹשֵׁב צְפַת
  choice: die in Zefat wohnten
  rationale: Das Partizip יֹשֵׁב bezeichnet die ansässige Bevölkerung. „wohnten“ ist klar und idiomatisch; „Zefat“ gibt den Ortsnamen in deutscher Transkription wieder.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: und vollstreckten an der Stadt den Bann
  rationale: Das Hifil von חרם bezeichnet, etwas unwiderruflich dem Bann zu übergeben, gewöhnlich mit der Folge der Vernichtung. „den Bann vollstrecken“ bewahrt den sakralen und den destruktiven Gehalt. Das feminine Pronomen bezieht sich naheliegend auf die Stadt.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: Danach nannte er die Stadt
  rationale: Der hebräische Text hat ausdrücklich ein Verb im Singular. „nannte er die Stadt“ bewahrt diese Form und gibt die hebräische Namensformel in natürlichem Deutsch wieder; das Subjekt ist am ehesten Juda als kollektive Größe.
- source_word: חָרְמָה
  choice: Horma
  rationale: Der Ortsname wird transkribiert. Sein Anklang an חרם ist für die Erzählung bedeutsam und wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe der Bannterminologie חרם
  choice: vollstreckten an der Stadt den Bann
  alternative: weihten sie der Vernichtung / vernichteten sie vollständig
  rationale: חרם verbindet unwiderrufliche Aussonderung mit Vernichtung. Die gewählte Formulierung erhält diese theologische Spannung, statt den Ausdruck entweder auf bloße Zerstörung oder auf eine unverbindliche Weihe zu reduzieren.
- issue: Numerus beim Benennen der Stadt
  choice: nannte er
  alternative: nannten sie
  rationale: וַיִּקְרָא ist morphologisch Singular. Obwohl der vorausgehende Handlungsträger pluralisch ist und idiomatische Übersetzungen glätten können, bewahrt der Haupttext die auffällige Singularform und lässt Juda als kollektives oder repräsentatives Subjekt zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „den Bann vollstrecken“ ist bewusst etwas gehobener, weil es den besonderen kultisch-militärischen Begriff חרם abbildet. Die hebräische Singularform „nannte er“ bleibt trotz des möglichen kollektiven Bezugs erhalten.
