base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: de
  text: Da zog Juda hinauf, und Jahwe gab die Kanaaniter und die Perisiter[a] in ihre Hand[b]. Bei Besek schlugen sie zehntausend Mann nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „den Kanaaniter und den Perisiter“; die Einzahl bezeichnet hier jeweils das Volk als Ganzes.'
    reason: lexical_alternative
  - marker: b
    text: „In ihre Hand“ ist eine hebräische Wendung für „in ihre Macht“ oder „in ihre Gewalt“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog hinauf
  rationale: עלה bedeutet grundsätzlich „hinaufgehen“; im militärischen Erzählzusammenhang bezeichnet es den Aufbruch beziehungsweise Vormarsch, ohne dass die geografische oder taktische Nuance näher festgelegt wird.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname bezeichnet hier den Stamm beziehungsweise dessen Streitmacht. Die Kollektivbedeutung erklärt den späteren Wechsel zum Pluralpronomen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: die Kanaaniter und die Perisiter
  rationale: Die morphologisch singularischen Volksbezeichnungen sind kollektiv gebraucht; im Deutschen gibt der Plural diesen Sinn natürlich wieder.
- source_word: בְּיָדָם
  choice: in ihre Hand
  rationale: Die hebräische Wendung נתן ביד bezeichnet die Übergabe in die Macht oder Gewalt eines anderen. Die bildhafte Formulierung bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: וַיַּכּוּם
  choice: schlugen sie nieder
  rationale: נכה kann schlagen, niederschlagen oder besiegen bedeuten. „Niederschlagen“ bewahrt im militärischen Zusammenhang die gewaltsame Aussage, ohne ausdrücklich mehr als das Verb festzulegen.
- source_word: בְּבֶזֶק
  choice: bei Besek
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Kampfes; „bei Besek“ ist dafür im Deutschen idiomatisch.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: zehntausend Mann
  rationale: Die Wendung bezeichnet wörtlich zehntausend Männer; „Mann“ passt zum militärischen Zusammenhang, ohne das interpretierende „Soldaten“ einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliches und menschliches Handeln
  choice: Jahwe gibt die Gegner in ihre Hand; die judäischen Kämpfer schlagen sie nieder
  alternative: Juda durchgehend als singularisches Subjekt wiedergeben oder den letzten Satz passiv formulieren
  rationale: Der hebräische Text unterscheidet zwischen Jahwes Gewährung des Sieges und dem Handeln der Stammestruppen. Der Wechsel vom singularischen Kollektiv „Juda“ zum pluralischen „sie/ihre“ wird daher bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll bewahrter hebräischer Bildsprache. Der kollektive Wechsel von „Juda“ zu „ihre/sie“ bleibt erhalten. Die Fußnotenmarkierung zur Kollektivform steht unmittelbar bei den beiden Volksnamen.
