base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: de
  text: Otniël, der Sohn des Kenas, Kalebs jüngerer Bruder,[a] nahm die Stadt ein. Da gab Kaleb ihm seine Tochter Achsa zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Otniël, Sohn des Kenas, des jüngeren Bruders Kalebs“; oder: „Otniël, Sohn des Kenas, Kalebs jüngerer Verwandter“. Der hebräische Wortlaut lässt sich am natürlichsten mit „Bruder Kalebs, jünger als er“ wiedergeben; der Ausdruck für „Bruder“ kann jedoch auch weiter gefasst werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: nahm die Stadt ein
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme einer Stadt. Das feminine Suffix verweist auf die im vorherigen Vers genannte Stadt; die ausdrückliche Wiederaufnahme als „die Stadt“ ist im Deutschen klarer als „sie“.
- source_word: עָתְנִיאֵל
  choice: Otniël
  rationale: Der Personenname wird in einer gebräuchlichen deutschen Form wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: בֶּן קְנַז
  choice: der Sohn des Kenas
  rationale: Die genealogische Konstruktion wird unmittelbar und natürlich wiedergegeben.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: Kalebs jüngerer Bruder
  rationale: Die naheliegende syntaktische Bedeutung ist „Bruder Kalebs, jünger als er“. Die mögliche weitere Bedeutung des Verwandtschaftsbegriffs wird in der Fußnote bewahrt.
- source_word: וַיִּתֶּן לוֹ
  choice: Da gab Kaleb ihm
  rationale: Das hebräische Verb hat ein implizites Subjekt. „Kaleb“ wird zur eindeutigen Zuordnung eingesetzt, da zwei männliche Personen genannt sind.
- source_word: עַכְסָה
  choice: Achsa
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
- source_word: בִתּוֹ
  choice: seine Tochter
  rationale: Das Possessivsuffix bezieht sich im Kontext auf Kaleb.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Dies ist die natürliche deutsche Entsprechung der hebräischen Wendung für die Übergabe einer Frau zur Ehe.
theological_decisions:
- issue: Verwandtschaftsverhältnis Otniëls zu Kaleb
  choice: Otniël wird im Haupttext als Kalebs jüngerer Bruder bezeichnet.
  alternative: Otniël kann möglicherweise als Kalebs jüngerer Verwandter oder als Sohn von Kalebs jüngerem Bruder verstanden werden.
  rationale: Der hebräische Wortlaut bedeutet am natürlichsten „Bruder Kalebs, jünger als er“. Da אָח jedoch gelegentlich einen weiteren Verwandtschaftsbegriff ausdrücken kann und die Zuordnung diskutiert wird, bleibt die Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Namens Kaleb und die Wiedergabe des pronominalen Objekts als „die Stadt“ vermeiden mehrdeutige Pronomen, ohne den Sinn zu erweitern.
