  text: וַ/יּ֤וֹאֶל הָֽ/אֱמֹרִי֙ לָ/שֶׁ֣בֶת בְּ/הַר חֶ֔רֶס בְּ/אַיָּל֖וֹן וּ/בְ/שַֽׁעַלְבִ֑ים וַ/תִּכְבַּד֙ יַ֣ד בֵּית יוֹסֵ֔ף וַ/יִּהְי֖וּ לָ/מַֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: de
  text: Doch die Amoriter bestanden darauf, auf dem Berg Heres, in Ajalon und in Schaalbim wohnen zu bleiben. Da lastete die Hand des Hauses Josef schwer auf ihnen[a], und sie wurden zur Zwangsarbeit verpflichtet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde die Hand des Hauses Josef immer mächtiger“. Wörtlich: „wurde schwer“. Die hebräische Wendung kann zunehmende Stärke oder drückende Herrschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mussten sie Frondienst leisten“. Das hebräische Wort bezeichnet einen verpflichtenden Arbeitsdienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל ... לָשֶׁבֶת
  choice: bestanden darauf, ... wohnen zu bleiben
  rationale: Das Verb יאל mit Infinitiv kann Bereitschaft, Entschlossenheit oder das Unternehmen einer Handlung ausdrücken. Im Kontext bezeichnet es das beharrliche Verbleiben der Amoriter.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Die grammatisch singularische Volksbezeichnung wird kollektiv gebraucht; der folgende Plural bestätigt den Bezug auf die Volksgruppe.
- source_word: בְּהַר חֶרֶס
  choice: auf dem Berg Heres
  rationale: הַר kann einen Berg oder ein Bergland bezeichnen. Die Wiedergabe als Berg bewahrt den Ortsnamen und bleibt im Deutschen natürlich.
- source_word: בְּאַיָּלוֹן וּבְשַׁעַלְבִים
  choice: in Ajalon und in Schaalbim
  rationale: Gebräuchliche deutsche Umschrift der beiden Ortsnamen.
- source_word: וַתִּכְבַּד יַד בֵּית יוֹסֵף
  choice: die Hand des Hauses Josef schwer auf ihnen lag
  rationale: Die hebräische Bildrede ‚die Hand wurde schwer‘ bezeichnet zunehmende, drückende Macht. Die Ergänzung ‚auf ihnen‘ macht den im Kontext gegebenen Bezug im Deutschen verständlich, ohne das Bild aufzulösen.
- source_word: וַיִּהְיוּ לָמַס
  choice: wurden sie zur Zwangsarbeit verpflichtet
  rationale: מַס bezeichnet verpflichtenden Arbeitsdienst beziehungsweise Fronarbeit. Diese Formulierung gibt den Vorgang natürlich wieder, ohne ihn auf eine bloße Geldabgabe zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildrede von der schweren Hand bleibt erhalten; die ungewöhnliche Konstruktion mit מַס wird als verpflichtender Arbeitsdienst verständlich wiedergegeben.
