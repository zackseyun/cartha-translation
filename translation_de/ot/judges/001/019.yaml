  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: de
  text: Und Jahwe war mit Juda, und Juda nahm das Bergland in Besitz. Doch die Bewohner der Ebene[a] konnte Juda nicht vertreiben, denn sie hatten eiserne Streitwagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Tals“ oder „der Niederung“. Das hebräische Wort kann ein breites Talgebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Namen JHWH in der im Deutschen geläufigen wissenschaftlichen Form wieder.
- source_word: אֶת־יְהוּדָה
  choice: mit Juda
  rationale: אֵת bezeichnet hier Begleitung; »Juda« bewahrt die knappe metonymische Bezeichnung des Stammes.
- source_word: וַיֹּרֶשׁ
  choice: nahm … in Besitz
  rationale: Da das Bergland Objekt ist, bezeichnet der Hifil hier passend die Besitzergreifung; im folgenden Satz wird die Bedeutung »vertreiben« eigens ausgedrückt.
- source_word: הָהָר
  choice: das Bergland
  rationale: Gemeint ist die gebirgige Region, nicht ein einzelner Berg.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: Doch … konnte … nicht vertreiben
  rationale: Die verdichtete hebräische Konstruktion bezeichnet im Kontext das misslungene Vertreiben und steht im Gegensatz zur vorherigen erfolgreichen Besitznahme.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: die Bewohner der Ebene
  rationale: עֵמֶק bezeichnet hier das tiefer gelegene, breite Tal- oder Ebenenland im Gegensatz zum Bergland.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: denn sie hatten eiserne Streitwagen
  rationale: Natürliche deutsche Wiedergabe der Besitzkonstruktion; »Streitwagen« macht die militärische Funktion von רֶכֶב deutlich.
theological_decisions:
- issue: Subjekt und Aussage des Unvermögens im zweiten Satz
  choice: Juda konnte die Bewohner der Ebene nicht vertreiben.
  alternative: 'Wörtlicher und weniger bestimmt: »doch nicht, um die Bewohner der Ebene zu vertreiben« beziehungsweise lediglich »Juda vertrieb sie nicht«.'
  rationale: Der Zusammenhang und die anschließende Begründung durch die eisernen Streitwagen legen ein Unvermögen Judas nahe. Die Spannung zur vorausgehenden Aussage, Jahwe sei mit Juda gewesen, wird nicht abgeschwächt oder theologisch aufgelöst.
- issue: Explizite Wiederholung des Subjekts
  choice: Juda wird in beiden Teilsätzen als Subjekt genannt.
  alternative: Im zweiten Teilsatz könnte nur das Pronomen »er« stehen.
  rationale: Das Hebräische lässt das Subjekt durch den Zusammenhang erkennen. Die Wiederholung vermeidet im Deutschen, dass »Jahwe« als nächstliegendes maskulines Bezugswort irrtümlich zum Subjekt von »konnte nicht vertreiben« gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp und bewahrt bewusst die theologische Spannung zwischen Jahwes Beistand und Judas militärischem Scheitern. »Ebene« bildet den geografischen Gegensatz zu »Bergland« natürlich ab; die ebenfalls möglichen Nuancen »Tal« oder »Niederung« erfordern hier keine Fußnote.
