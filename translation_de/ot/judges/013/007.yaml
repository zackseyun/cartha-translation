base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: de
  text: 'Und er sagte zu mir: »Sieh, du wirst schwanger werden und einen Sohn gebären.[a] Und nun trink weder Wein noch berauschendes Getränk und iss nichts Unreines. Denn der Junge wird vom Mutterleib an bis zum Tag seines Todes ein Nasiräer Gottes sein.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann die hebräische Formulierung lauten: „Sieh, du bist schwanger und wirst einen Sohn gebären.“ Im Zusammenhang hat sie ankündigenden Sinn.'
    reason: lexical_alternative
  - marker: b
    text: Ein Nasiräer war ein Mensch, der Gott in besonderer Weise geweiht war; hier sollte diese Weihe schon vom Mutterleib an gelten.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Und er sagte zu mir
  rationale: Das einleitende וַ wird als schlichte Fortführung des Berichts wiedergegeben. Ein begründendes „denn“ steht im Hebräischen an dieser Stelle nicht.
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  choice: Sieh, du wirst schwanger werden und einen Sohn gebären
  rationale: הִנֵּה wird mit dem gegenwärtigen „Sieh“ wiedergegeben. הָרָה ist formal „schwanger“, hat hier im Zusammenhang der Ankündigung jedoch Zukunftssinn; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וְעַתָּה
  choice: Darum … jetzt
  rationale: Die Formulierung leitet aus der Ankündigung die nun geltende Anweisung ab. „Darum“ macht diesen Zusammenhang in natürlichem Deutsch deutlich, während „jetzt“ den Zeitbezug wahrt.
- source_word: אַל תִּשְׁתִּי יַיִן וְשֵׁכָר
  choice: trink weder Wein noch berauschendes Getränk
  rationale: שֵׁכָר bezeichnet ein berauschendes alkoholisches Getränk neben Wein. „Berauschendes Getränk“ ist verständlich und legt sich nicht unnötig auf Bier oder eine bestimmte Getränkeart fest.
- source_word: וְאַל תֹּאכְלִי כָּל טֻמְאָה
  choice: iss nichts Unreines
  rationale: Die konkrete deutsche Formulierung gibt die Speisevorschrift natürlich wieder, ohne das hebräische Abstraktum „Unreinheit“ nachzuahmen.
- source_word: נְזִיר אֱלֹהִים
  choice: ein Nasiräer Gottes
  rationale: „Nasiräer“ bewahrt den fachsprachlichen Ausdruck für einen Menschen mit besonderer Weihe. Der Genitiv lässt die Beziehung zu Gott bewusst knapp und entspricht der hebräischen Verbindung.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: Im Zusammenhang der angekündigten Geburt bezeichnet das Wort den männlichen Nachwuchs; „Junge“ bewahrt diese Bestimmtheit.
- source_word: מִן הַבֶּטֶן
  choice: vom Mutterleib an
  rationale: Die Wendung bewahrt das hebräische Bild und bezeichnet den Beginn der Weihe, ohne sie lediglich mit „von Geburt an“ zu umschreiben.
- source_word: עַד יוֹם מוֹתוֹ
  choice: bis zum Tag seines Todes
  rationale: Dies ist eine direkte und würdige Wiedergabe der zeitlichen Begrenzung.
theological_decisions:
- issue: Bezeichnung der besonderen Weihe
  choice: ein Nasiräer Gottes
  alternative: ein Gott Geweihter
  rationale: Der technische Begriff נָזִיר wird nicht zu einer allgemeinen Aussage über Heiligkeit oder Hingabe verflacht. Eine kurze Fußnote erschließt ihn, ohne zusätzliche konfessionelle Deutung einzutragen.
- issue: Zeitbezug der Schwangerschaftsankündigung
  choice: du wirst schwanger werden und einen Sohn gebären
  alternative: du bist schwanger und wirst einen Sohn gebären
  rationale: Die Formulierung kann formal gegenwärtig verstanden werden, steht im Erzählzusammenhang aber als Ankündigung. Die Hauptübersetzung gibt den naheliegenden Zukunftssinn wieder; die grammatisch wörtlichere Lesart bleibt in der Fußnote sichtbar.
- issue: Dauer der Nasiräerweihe
  choice: vom Mutterleib an bis zum Tag seines Todes
  alternative: sein ganzes Leben lang
  rationale: Die bildhafte und theologisch gewichtige Zeitangabe des Hebräischen wird bewahrt, statt sie verallgemeinernd zusammenzufassen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist klar gegliedert; altertümliche Wörter wie „siehe“ und missverständliche Wendungen wie „starkes Getränk“ werden vermieden. Der Fachbegriff „Nasiräer“ bleibt wegen seiner sachlichen und theologischen Bedeutung erhalten und wird in einer Fußnote knapp erklärt.
