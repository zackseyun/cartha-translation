  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: de
  text: Und die Israeliten[a] taten wieder, was in den Augen Jahwes böse war, und Jahwe gab sie vierzig Jahre lang in die Hand der Philister[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Söhne Israels“; gemeint ist das Volk Israel als Ganzes.
    reason: lexical_alternative
  - marker: b
    text: '„In die Hand der Philister“ bedeutet hier: unter ihre Gewalt oder Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: taten wieder
  rationale: יסף mit folgendem Infinitiv bezeichnet hier die Wiederholung früheren Handelns. „taten wieder“ gibt die wiederkehrende Richter-Zyklusformel natürlich wieder, ohne das im Deutschen unübliche wörtliche „fügten hinzu zu tun“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ ist eine korporative Bezeichnung für das ganze Volk. „die Israeliten“ vermittelt diese Bedeutung im heutigen Deutsch klar und schließt nicht fälschlich nur männliche Personen ein.
- source_word: לַעֲשׂוֹת הָרַע
  choice: taten, was böse war
  rationale: Die in Richter häufige Wendung wird idiomatisch und zugleich bedeutungsnah wiedergegeben. Der bestimmte Ausdruck הָרַע bezeichnet das, was als böse bewertet wird.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Metapher für Jahwes Beurteilung bleibt erhalten und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וַיִּתְּנֵם
  choice: gab sie
  rationale: Die einfache Bedeutung von נתן wird bewahrt; zusammen mit „in die Hand“ drückt sie die Auslieferung unter fremde Macht aus.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: in die Hand der Philister
  rationale: Die hebräische Machtmetapher wird formal bewahrt. Eine Fußnote erläutert den idiomatischen Sinn.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: „lang“ kennzeichnet im Deutschen natürlich die Zeitdauer, die im Hebräischen ohne Präposition ausgedrückt wird.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration wahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische maskuline Pluralform bezeichnet hier das Volk als Ganzes. Die natürliche deutsche Volksbezeichnung gibt den korporativen Umfang genauer wieder und beschränkt die Aussage nicht auf Männer.
- issue: Göttliche Übergabe an die Philister
  choice: Jahwe gab sie ... in die Hand der Philister
  alternative: Jahwe lieferte sie der Macht der Philister aus
  rationale: Die Formulierung bewahrt sowohl Jahwes aktive Rolle im Gericht als auch das hebräische Bild der „Hand“, ohne Ursache, Schuld oder Umfang der Unterwerfung weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Satzreihung und Bildsprache. „Israeliten“ ist natürlicher als die missverständliche wörtliche Form „Söhne Israels“; „in die Hand“ bleibt als verständliche biblische Machtmetapher stehen.
