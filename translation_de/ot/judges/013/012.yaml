  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: de
  text: 'Da sagte Manoach: „Nun mögen deine Worte eintreffen.[a] Welche Vorschrift soll für den Jungen und für sein Tun gelten?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn deine Worte eintreffen“. Der hebräische Satz kann als Wunsch oder als zeitliche Voraussetzung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „Welche Vorschrift gilt für den Jungen und für sein Tun?“ „Vorschrift“ kann hier auch seine Ordnung, Lebensweise oder das für ihn geltende Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das wayyiqtol führt die Erzählung fort; „Da sagte“ gibt die Abfolge in natürlichem Deutsch wieder.
- source_word: מָנוֹחַ
  choice: Manoach
  rationale: Die im Deutschen übliche biblische Namensform wird verwendet.
- source_word: עַתָּה
  choice: Nun
  rationale: „Nun“ bezeichnet hier den gegenwärtigen Erwartungsmoment knapp und idiomatisch.
- source_word: יָבֹא דְבָרֶיךָ
  choice: möge dein Wort eintreffen
  rationale: Wörtlich geht es darum, dass das Gesagte „kommt“ beziehungsweise eintrifft. Der Singular „Wort“ ist im Deutschen als Sammelbegriff für die Ankündigung natürlich; die Wunschform bleibt erhalten.
- source_word: מַה יִּהְיֶה
  choice: Welche ... gilt
  rationale: Die deutsche Frageform verbindet das zukünftige beziehungsweise vorgesehene Gelten idiomatisch mit מִשְׁפַּט.
- source_word: מִשְׁפַּט
  choice: Vorschrift
  rationale: Das Wort kann Recht, festgelegte Regel, Brauch oder Lebensordnung bezeichnen. „Vorschrift“ passt zur erbetenen Anweisung, ohne eine einzelne konfessionelle Deutung einzutragen.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: Die maskuline Bezeichnung des noch ungeborenen Kindes wird ausdrücklich bewahrt.
- source_word: וּמַעֲשֵׂהוּ
  choice: und was soll er tun
  rationale: Das Substantiv bezeichnet sein Tun, Werk oder seine Aufgabe. Die verbale Wiedergabe ist im Deutschen natürlich und wahrt die offene Frage nach Verhalten oder Aufgabe.
theological_decisions:
- issue: Modus von יָבֹא דְבָרֶיךָ
  choice: 'Wunsch: „möge dein Wort eintreffen“'
  alternative: 'Temporal: „wenn dein Wort eintrifft“'
  rationale: Die unmarkierte Verbform kann hier als Wunsch oder im Zusammenhang als zeitliche Voraussetzung verstanden werden. Der Haupttext folgt der naheliegenden Wunschlesart; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
- issue: Bedeutungsumfang von וּמַעֲשֵׂהוּ
  choice: „was soll er tun“
  alternative: '„was wird seine Aufgabe sein?“ / wörtlicher: „sein Tun“'
  rationale: Der Kontext kann Lebensführung, vorgeschriebenes Verhalten oder künftige Aufgabe meinen. Die Übersetzung lässt dies möglichst offen und legt keine besondere Berufung im Wortlaut fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich und relativ nah am Hebräischen; echte lexikalische und syntaktische Mehrdeutigkeit wird durch Fußnoten sichtbar gemacht.
