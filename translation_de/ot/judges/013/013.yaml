id: JDG.13.13
reference: Judges 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר מַלְאַ֥ךְ יְהוָ֖ה אֶל מָנ֑וֹחַ מִ/כֹּ֛ל אֲשֶׁר אָמַ֥רְתִּי אֶל הָ/אִשָּׁ֖ה תִּשָּׁמֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: de
  text: 'Und der Engel Jahwes[a] sagte zu Manoach: »Die Frau soll sich genau an alles halten, was ich ihr gesagt habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«. Das hebräische Wort kann sowohl »Engel« als auch »Bote« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die fortlaufende hebräische Erzählungsform wird mit dem natürlichen deutschen Erzählanschluss „Und … sagte“ wiedergegeben.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann „Engel“ oder „Bote“ bedeuten; im Erzählzusammenhang ist „Engel“ die geläufige Bezeichnung für den himmlischen Boten. Die mögliche Bedeutung „Bote“ bleibt in der Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מָנוֹחַ
  choice: zu Manoach
  rationale: Die Präposition und der Eigenname werden im Deutschen idiomatisch als „zu Manoach“ wiedergegeben.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: an alles …, was ich ihr gesagt habe
  rationale: Im Zusammenhang mit תִּשָּׁמֵר bezeichnet מִכֹּל אֲשֶׁר den gesamten Umfang der zuvor erteilten Anweisung. „Sich an alles halten“ ist natürliches Deutsch und bewahrt diesen umfassenden Sinn.
- source_word: הָאִשָּׁה
  choice: Die Frau
  rationale: Der bestimmte Ausdruck wird wörtlich als „die Frau“ wiedergegeben; „deine Frau“ wäre zwar kontextuell eindeutig, steht aber nicht ausdrücklich im Hebräischen.
- source_word: תִּשָּׁמֵר
  choice: soll sich genau … halten
  rationale: Die Nifal-Form von שׁמר fordert hier sorgfältige Beachtung der Anweisungen. Diese Wendung gibt den reflexiven und verpflichtenden Sinn natürlich wieder, ohne ein zusätzliches Tätigkeitsverb in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsbreite von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: „Engel“ passt zum übernatürlichen Erscheinungszusammenhang und ist im Deutschen die geläufige Wiedergabe; die lexikalisch echte Alternative „Bote“ wird durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist klar und mündlich gut verständlich; „sich genau an alles halten“ vermittelt die sorgfältige Befolgung der Anweisung, ohne die Frau ausdrücklich als „deine Frau“ zu bezeichnen.
