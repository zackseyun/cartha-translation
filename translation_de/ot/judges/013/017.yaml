    issue: Unidiomatische Wiedergabe von יָבֹא דְבָרֶיךָ
    rationale: „Deine Worte eintreffen“ ist im modernen Deutsch für das Wahrwerden einer Ankündigung nicht natürlich. „Deine Worte in Erfüllung gehen“ bewahrt den Plural und gibt die idiomatische Bedeutung wieder.
  - severity: low
    issue: Numerusfehler in der Fußnote
    rationale: Die Alternative zu „Engel Jahwes“ lautet „Bote Jahwes“, nicht „Boten Jahwes“, da מַלְאַךְ im Singular steht.
