  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: de
  text: 'Da sagte Manoach zum Engel Jahwes[a]: »Wie heißt du? Wenn deine Worte in Erfüllung gehen, möchten wir dich ehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bote Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten. Weil die Gestalt in diesem Erzählzusammenhang übernatürlich erscheint, ist »Engel« im Deutschen die natürlichste Wiedergabe; die Alternative »Bote« bleibt in der Fußnote erhalten.
- source_word: מִי שְׁמֶךָ
  choice: Wie heißt du?
  rationale: Die hebräische Wendung fragt idiomatisch nach dem Namen. »Wie heißt du?« ist im modernen Deutsch natürlicher als die wörtlichere Form »Was ist dein Name?«.
- source_word: כִּי
  choice: Wenn
  rationale: Im Zusammenhang leitet כִּי den Zeitpunkt beziehungsweise Umstand ein, unter dem Manoach den Boten ehren will. Die parataktische deutsche Satzfolge wahrt zugleich die mögliche Zweck- oder Folgerelation, ohne sie stärker als der hebräische Text festzulegen.
- source_word: יָבֹא דְבָרֶיךָ
  choice: deine Worte eintreffen
  rationale: דְבָרֶיךָ ist formal Plural. »Eintreffen« gibt die idiomatische Bedeutung wieder, dass das Angekündigte Wirklichkeit wird, und bewahrt mit »Worte« die Numerusform.
- source_word: וְכִבַּדְנוּךָ
  choice: wollen wir dich ehren
  rationale: Das Piel von כבד bedeutet hier »ehren«. »Wollen wir« gibt die Absicht Manoachs wieder, ohne die Aussage als sichere Zukunftsprognose zu überzeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Die im Deutschen geläufige Form »Jahwe« bewahrt den Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Identität und Bezeichnung von מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Die Übersetzung bezeichnet die Gestalt entsprechend ihrem übernatürlichen Auftreten als »Engel«, legt aber keine weitergehende christologische oder trinitarische Identifikation fest. Die lexikalisch mögliche Wiedergabe »Bote« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Direkte Rede wird natürlich formuliert; die Pluralform »deine Worte« und die Offenheit hinsichtlich der genaueren Identität des Engels bleiben erhalten.
