  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Lexeme insgesamt zutreffend wieder: Manoach fragt den Engel Jahwes nach seinem Namen und verbindet dies mit dem Eintreten der angekündigten Worte sowie der beabsichtigten Ehrung. Das hebräische כִּי ist hier am besten temporal als „wenn“ zu verstehen. „deine Worte eintreffen“ ist jedoch im Deutschen semantisch unidiomatisch; Worte „gehen in Erfüllung“ bzw. „treffen ein“ nur in eingeschränktem Sinn als Nachrichten. Die Formulierung „in Erfüllung gehen“ gibt den gemeinten Eintritt des Angekündigten präzise wieder.'
  naturalness: „Wie heißt du?“ und „Engel Jahwes“ sind modernes, verständliches Standarddeutsch. Mit „Wenn deine Worte in Erfüllung gehen, möchten wir dich ehren“ wird die Rede idiomatischer und die Absicht bzw. der volitive Charakter von וְכִבַּדְנוּךָ angemessen wiedergegeben.
  terminology: „Jahwe“ entspricht der projektintern vorgegebenen Wiedergabe des Tetragramms. „Engel“ ist im Erzählkontext eine angemessene Hauptwiedergabe von מַלְאָךְ, ohne eine weitergehende dogmatische Identifikation zu behaupten. Die Fußnote muss die lexikalische Alternative im Singular („Bote Jahwes“) nennen; der hebräische Ausdruck ist Singular.
  issues:
