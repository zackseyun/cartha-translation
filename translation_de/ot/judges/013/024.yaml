  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: de
  text: Und die Frau gebar einen Sohn und gab ihm den Namen Simson. Der Junge wuchs heran, und Jahwe segnete ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Qal-Wayyiqtol von ילד bezeichnet hier die Geburt; „gebar“ ist knapp, würdig und entspricht dem hebräischen Erzählstil.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Text bezeichnet Manoachs Frau ausdrücklich als „die Frau“; diese Wiederaufnahme wird ohne ergänzende Präzisierung bewahrt.
- source_word: בֵּן
  choice: einen Sohn
  rationale: בן bezeichnet im Geburtszusammenhang ein männliches Kind; „Sohn“ ist die natürliche deutsche Entsprechung.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: gab ihm den Namen
  rationale: Die hebräische Namensformel lautet wörtlich „sie nannte seinen Namen“. Die gewählte deutsche Form ist idiomatisch und bewahrt den ausdrücklichen Benennungsakt.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: וַיִּגְדַּל
  choice: wuchs heran
  rationale: גדל beschreibt hier die Entwicklung des Kindes; „wuchs heran“ gibt diesen Sinn natürlich wieder, ohne „groß werden“ im Sinn von Bedeutung hineinzulesen.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נער kann ein Kind, einen Jungen oder jungen Mann bezeichnen. Nach der Geburtsnotiz passt „der Junge“ zum Entwicklungskontext und wahrt die altersbezogene Offenheit weitgehend.
- source_word: וַיְבָרְכֵהוּ
  choice: segnete ihn
  rationale: ברך bedeutet „segnen“; die direkte Wiedergabe erhält das theologische Gewicht des göttlichen Handelns.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ ist die übliche wissenschaftlich begründete deutsche Wiedergabe und bewahrt den Unterschied zwischen Name und Titel.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die Satzfolge mit „Und“ bildet die fortlaufende hebräische Narration ab; „gab ihm den Namen“ ist gegenüber einer wörtlichen Nachbildung im heutigen Standarddeutsch natürlicher.
