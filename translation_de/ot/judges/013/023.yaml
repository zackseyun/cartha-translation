base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: de
  text: 'Doch seine Frau sagte zu ihm: »Wenn der HERR uns hätte töten wollen, hätte er aus unserer Hand kein Brandopfer und Speisopfer angenommen. Er hätte uns auch nicht all dies sehen lassen und uns jetzt nicht so etwas angekündigt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: hätte … wollen
  rationale: Gibt im irrealen Bedingungssatz die Bedeutung »Gefallen haben an / beabsichtigen / wollen« natürlich und präzise wieder.
- source_word: לָקַח מִיָּדֵנוּ
  choice: aus unserer Hand … angenommen
  rationale: Bewahrt das hebräische Bild und bezeichnet im Opferkontext Gottes Annahme der dargebrachten Gaben.
- source_word: עֹלָה וּמִנְחָה
  choice: Brandopfer noch Speisopfer
  rationale: Etablierter deutscher Opferwortschatz; מִנְחָה bezeichnet hier aufgrund des Zusammenhangs das Speisopfer.
- source_word: הֶרְאָנוּ אֶת כָּל אֵלֶּה
  choice: uns … all dies sehen lassen
  rationale: Gibt den Kausativ von ראה wieder und lässt den Bezug auf die erlebten Zeichen offen.
- source_word: הִשְׁמִיעָנוּ כָּזֹאת
  choice: uns … so etwas angekündigt
  rationale: Der Hifil von שׁמע bedeutet wörtlich »hören lassen«; »angekündigt« passt zum vorausgesagten Geschehen, ohne den Inhalt weiter festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Folgt der im deutschen Bibelgebrauch weithin verständlichen Wiedergabekonvention, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Logik der Aussage über die Annahme des Opfers
  choice: als Schlussfolgerung der Frau im irrealen Bedingungssatz wiedergegeben
  alternative: als ausdrückliche göttliche Zusicherung formulieren
  rationale: Der Text berichtet die begründete Aussage der Frau; er kennzeichnet sie nicht zusätzlich als unmittelbares Gotteswort.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Begründung des Hebräischen bleibt erhalten; zur natürlichen deutschen Lesbarkeit werden der zweite und dritte Teil als neuer Satz fortgeführt.
