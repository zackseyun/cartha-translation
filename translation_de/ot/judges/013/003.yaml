source:
  edition: WLC
  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: de
  text: 'Da erschien der Engel des HERRN der Frau und sagte zu ihr: »Sieh doch: Du bist unfruchtbar und hast kein Kind geboren. Aber du wirst schwanger werden und einen Sohn zur Welt bringen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel des HERRN
  rationale: מַלְאַךְ bezeichnet einen Boten beziehungsweise Engel; die traditionelle Wiedergabe »Engel des HERRN« wahrt die feste biblische Bezeichnung. Das Tetragramm wird entsprechend deutscher Bibelkonvention als HERR wiedergegeben.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das Folgende; נָא mildert oder unterstreicht die Äußerung. »Sieh doch« gibt beides natürlich und knapp wieder.
- source_word: עֲקָרָה
  choice: unfruchtbar
  rationale: Das Adjektiv bezeichnet hier eine Frau, die keine Kinder bekommen kann.
- source_word: וְלֹא יָלַדְתְּ
  choice: und hast kein Kind geboren
  rationale: Das Hebräische spricht wörtlich vom Nicht-Gebären; die Ergänzung »Kind« ist im Deutschen idiomatisch und legt das Geschlecht nicht fest.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: Aber du wirst schwanger werden und einen Sohn zur Welt bringen
  rationale: Die Formen werden im Kontext als Ankündigung verstanden. »Aber« bildet den sachlichen Gegensatz zwischen bisheriger Kinderlosigkeit und der verheißenen Empfängnis ab; »zur Welt bringen« ist eine natürliche Wiedergabe von ילד.
theological_decisions:
- issue: Benennung des göttlichen Namens in מַלְאַךְ יְהוָה
  choice: Engel des HERRN
  alternative: Engel Jahwes
  rationale: »HERR« folgt der etablierten deutschen Wiedergabekonvention für das Tetragramm, ohne die Identität oder das Wesen des Engels über den Wortlaut hinaus zu bestimmen.
- issue: Zeitwert von וְהָרִית וְיָלַדְתְּ
  choice: 'zukünftige Ankündigung: »du wirst …«'
  alternative: 'imperativische Deutung: »werde schwanger und bringe … zur Welt«'
  rationale: Im Erzählzusammenhang kündigt der Engel die bevorstehende Empfängnis und Geburt an. Die Übersetzung hält diese natürliche kontextuelle Lesart fest, ohne zusätzliche Aussagen über deren Ablauf einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; »Sieh doch« bewahrt die aufmerksamkeitslenkende und zugleich abgetönte Wirkung von הִנֵּה נָא.
