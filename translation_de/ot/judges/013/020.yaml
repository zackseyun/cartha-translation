base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: de
  text: Als die Flamme vom Altar zum Himmel emporstieg, stieg der Engel[a] Jahwes in der Flamme des Altars empor. Manoach und seine Frau sahen zu; da fielen sie mit dem Gesicht zur Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Bote Jahwes. Das hebräische Wort kann sowohl „Engel“ als auch „Bote“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: Als ... emporstieg
  rationale: Die Konstruktion eröffnet einen temporalen Begleitsatz. „Als“ gibt den Erzählfluss natürlich wieder, ohne die hebräische Wendung mit „Und es geschah“ unnötig wörtlich abzubilden.
- source_word: הַלַּהַב
  choice: die Flamme
  rationale: לַהַב bezeichnet eine Flamme oder loderndes Feuer; „Flamme“ ist konkret, geläufig und entspricht dem Bild des Verses.
- source_word: הַשָּׁמַיְמָה
  choice: zum Himmel
  rationale: Die Richtungsendung bezeichnet eine Bewegung himmelwärts. „Zum Himmel“ wahrt diese Ausrichtung, ohne zwingend das Erreichen eines Zielpunkts zu betonen.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Wegen der übernatürlichen Erscheinung ist „Engel“ im Haupttext angemessen; die lexikalische Alternative wird in einer Fußnote bewahrt. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: in der Flamme des Altars
  rationale: Das ב wird hier entsprechend dem sichtbaren Vorgang lokativ wiedergegeben. So bleibt offen, wie genau das Emporsteigen in beziehungsweise mit der Flamme zu verstehen ist.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: Manoach und seine Frau sahen es
  rationale: Das Partizip schildert ihr gleichzeitiges Sehen. Die deutsche Formulierung ist natürlich und macht den zuvor beschriebenen Vorgang zum Objekt, ohne zusätzliche Deutung einzuführen.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: und fielen mit dem Gesicht zur Erde nieder
  rationale: Die Formulierung bewahrt die konkrete Körperhaltung des hebräischen Idioms und klingt zugleich in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Identität und Wiedergabe von מַלְאַךְ יְהוָה
  choice: „der Engel Jahwes“, ohne seine Identität weiter zu bestimmen
  alternative: „der Bote Jahwes“ oder eine ausdrückliche Deutung als Theophanie
  rationale: Der hebräische Ausdruck bezeichnet die Gestalt als Engel beziehungsweise Boten Jahwes, entscheidet aber nicht ausdrücklich zwischen weitergehenden theologischen Identifikationen. Der Haupttext lässt diese Frage daher offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das wiederholte „emporstieg“ bildet die bewusste Wiederholung des hebräischen Verbs nach; „Jahwe“ bewahrt den Eigennamen. Der einzige Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
