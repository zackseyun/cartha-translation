  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: de
  text: Und Gott erhörte Manoach. Der Engel Gottes kam wieder zu der Frau, während sie auf dem Feld saß; ihr Mann Manoach war nicht bei ihr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל מָנוֹחַ
  choice: Und Gott erhörte Manoach
  rationale: Die Verbindung שׁמע בקול bezeichnet hier nicht bloß akustisches Hören, sondern Gottes wohlwollende Reaktion auf Manoachs Bitte im vorherigen Vers. „Erhörte“ gibt diesen Sinn im Deutschen natürlich und knapp wieder, ohne das im Deutschen schwerfällige „hörte auf die Stimme Manoachs“ nachzubilden.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: der Engel Gottes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Der Zusammenhang beschreibt einen übernatürlichen göttlichen Boten; „Engel Gottes“ ist daher sachgemäß und im Deutschen geläufig.
- source_word: עוֹד
  choice: wieder
  rationale: Das Wort bezeichnet hier die Wiederholung des früheren Erscheinens.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Die direkte Wiedergabe wahrt die Bezeichnung der Erzählung; ihre Beziehung zu Manoach wird am Versende ausdrücklich genannt.
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: während sie auf dem Feld saß
  rationale: Das Partizip schildert die begleitende Hintergrundsituation. „Auf dem Feld“ ist die idiomatische deutsche Ortsangabe.
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: אִישׁ mit dem Suffix der 3. Person feminin Singular bezeichnet in diesem Zusammenhang idiomatisch ihren Ehemann.
- source_word: אֵין עִמָּהּ
  choice: war nicht bei ihr
  rationale: Die negative Existenzkonstruktion mit עִם drückt aus, dass Manoach zu diesem Zeitpunkt nicht bei ihr anwesend war.
- source_word: מָנוֹחַ
  choice: Manoach
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition als „Manoach“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים
  choice: Gott
  alternative: die Götter
  rationale: Obwohl אֱלֹהִים formal pluralisch ist, bezeichnet es hier Israels Gott und steht mit einem Verb im Singular. „Gott“ folgt daher Syntax und Erzählzusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte hebräische Satzfolge wird zur besseren deutschen Lesbarkeit in zwei Hauptsätze gegliedert; das Semikolon hält die eng zusammengehörigen Umstände der zweiten Aussage verbunden. Keine Fußnoten erforderlich.
