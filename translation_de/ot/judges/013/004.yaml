id: JDG.13.4
reference: Judges 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: de
  text: Und nun gib bitte auf dich acht[a] und trink weder Wein noch berauschendes Getränk[b] und iss nichts Unreines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sei bitte auf der Hut“; auch: „nimm dich bitte in Acht“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind berauschende alkoholische Getränke außer Wein.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt den fortführenden Diskurs- und Zeitmarker natürlich wieder; das einleitende וְ bleibt erhalten.
- source_word: הִשָּׁמְרִי נָא
  choice: gib bitte auf dich acht
  rationale: Der feminine Imperativ im Nifal fordert zu wachsamer Selbstbeachtung auf; „bitte“ bildet die höflich-mahnende Partikel נָא ab.
- source_word: וְאַל תִּשְׁתִּי
  choice: Trink weder
  rationale: Gibt das an die Frau gerichtete Verbot idiomatisch wieder; zusammen mit dem zweiten Getränk entsteht im Deutschen die natürliche Verbindung „weder … noch“.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte und eindeutige lexikalische Entsprechung.
- source_word: וְשֵׁכָר
  choice: berauschendes Getränk
  rationale: Bezeichnet ein alkoholisches beziehungsweise berauschendes Getränk neben Wein. „Starkes Getränk“ wäre im heutigen Deutsch missverständlich, „Bier“ zu eng.
- source_word: וְאַל תֹּאכְלִי כָּל טָמֵא
  choice: und iss nichts Unreines
  rationale: Die substantivierte Form von טָמֵא bezeichnet hier etwas kultisch Unreines; „nichts Unreines“ ist natürlich und bewahrt die umfassende Verneinung.
theological_decisions:
- issue: Bedeutung von טָמֵא in diesem Zusammenhang
  choice: Unreines
  alternative: Unreines oder Unreines zu essen / etwas Unreines
  rationale: „Unrein“ bewahrt die kultisch-bundestheologische Kategorie der Tora und reduziert sie weder auf Hygiene noch auf moralische Verwerflichkeit.
- issue: Verhältnis der Aufforderung zur Selbstbeachtung zu den folgenden Verboten
  choice: Doppelpunkt nach der allgemeinen Mahnung
  alternative: Koordination nur mit Kommas und „und“
  rationale: Der Doppelpunkt lässt die folgenden Verbote als inhaltliche Entfaltung der Mahnung erkennen, ohne den hebräischen Sinn festzulegen oder zusätzliche Theologie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Anrede ist in den Verbformen des Deutschen nicht sichtbar, ergibt sich aber aus dem Zusammenhang. „Berauschendes Getränk“ ist präziser und gegenwärtig verständlicher als das altertümliche oder missverständliche „starkes Getränk“.
