source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: de
  text: 'Da sagte der Engel Jahwes zu Manoach: „Wenn du mich zurückhältst, werde ich nichts von deiner Speise[a] essen. Wenn du aber ein Brandopfer zubereitest, bring es Jahwe dar.“ Denn Manoach wusste nicht, dass er der Engel Jahwes war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von deinem Brot“. „Brot“ kann hier allgemein Speise oder eine Mahlzeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten; die übernatürliche Gestalt der Erzählung spricht hier für die im Deutschen natürliche Wiedergabe »Engel«. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: תַּעְצְרֵנִי
  choice: du mich zum Bleiben drängst
  rationale: עצר bezeichnet hier das Zurückhalten beziehungsweise Dabehalten des Besuchers, während eine Mahlzeit bereitet wird. Die Formulierung gibt den Sinn natürlich wieder, ohne Zwang oder Gefangensetzung nahezulegen.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: werde ich nichts von deiner Speise essen
  rationale: לֶחֶם bedeutet wörtlich »Brot«, kann aber metonymisch Speise oder Mahlzeit bezeichnen. Der Kontext verlangt den weiteren Sinn.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: ein Brandopfer zubereitest
  rationale: עשה bezeichnet hier das Herrichten des Opfers; dadurch bleibt es vom folgenden תעלנה, dem eigentlichen Darbringen, unterschieden.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: bring es Jahwe dar
  rationale: Der Hifil von עלה bezeichnet im Opferzusammenhang das Hinaufbringen beziehungsweise Darbringen. »Darbringen« ist im modernen Deutschen klar und würdig.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: Denn Manoach wusste nicht
  rationale: כִּי leitet hier die erklärende Erzählerbemerkung ein; »denn« wahrt diese Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« gibt ihn im modernen deutschen Bibelgebrauch als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität der Gestalt als מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Die Übersetzung bezeichnet die Gestalt entsprechend dem Erzählzusammenhang als übernatürlichen Engel, ohne darüber hinaus ihre ontologische oder trinitarische Identität festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zwei hebräischen Verben für das Zubereiten und Darbringen des Brandopfers bleiben semantisch unterschieden. Keine Fußnote ist nötig, da die idiomatische Bedeutung von לֶחֶם und die Opferterminologie im Haupttext klar wiedergegeben werden.
