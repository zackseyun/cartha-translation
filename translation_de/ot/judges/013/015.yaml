  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: de
  text: 'Da sagte Manoach zum Engel des HERRN: »Bitte lass dich von uns noch aufhalten, damit wir dir ein Ziegenböckchen zubereiten können.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: Bitte lass dich von uns noch aufhalten
  rationale: Die Kohortativform mit נָא drückt eine höfliche Bitte aus. »Aufhalten« gibt das Zurückhalten bzw. Bleibenlassen natürlich wieder; »noch« verdeutlicht idiomatisch den gemeinten vorübergehenden Aufenthalt, ohne eine neue Aussage einzuführen.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: damit wir dir … zubereiten können
  rationale: Das Verb עשה bedeutet hier im Zusammenhang mit dem Ziegenböckchen »zubereiten«. לְפָנֶיךָ heißt wörtlich »vor dir«, bezeichnet hier aber idiomatisch die Zubereitung für den Gast.
- source_word: גְּדִי עִזִּים
  choice: ein Ziegenböckchen
  rationale: Die Wortverbindung bezeichnet ein junges Tier aus den Ziegen; »Ziegenböckchen« ist knapp, konkret und im Deutschen natürlich.
- source_word: מַלְאַךְ יְהוָה
  choice: Engel des HERRN
  rationale: Die traditionelle und verständliche Wiedergabe bewahrt die grammatische Beziehung der hebräischen Wortgruppe. Das Tetragramm wird gemäß verbreiteter deutscher Bibelkonvention mit HERR wiedergegeben.
theological_decisions: []
