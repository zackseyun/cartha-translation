language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: de
  text: Und der Engel Jahwes erschien Manoach und seiner Frau nicht wieder.[a] Da erkannte Manoach, dass er der Engel Jahwes war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«. Das hebräische Wort kann sowohl »Bote« als auch »Engel« bedeuten; hier bezeichnet es eine übernatürliche Gestalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָסַף עוֹד ... לְהֵרָאֹה
  choice: erschien ... nicht wieder
  rationale: Die Verbindung von יָסַף mit עוֹד und Infinitiv bezeichnet hier das Ausbleiben eines weiteren Geschehens; die natürliche deutsche Wiedergabe lautet »erschien ... nicht wieder«.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten. Der erzählerische Zusammenhang kennzeichnet die Gestalt als übernatürlich; »Engel« ist daher im Haupttext angemessen, während die lexikalische Alternative in der Fußnote erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, sodass der im Hebräischen ausdrücklich stehende Eigenname sichtbar bleibt.
- source_word: לְהֵרָאֹה
  choice: erschien
  rationale: Der Niphal-Infinitiv von ראה bedeutet hier »erscheinen« beziehungsweise »gesehen werden«; »erschien« ist im Deutschen idiomatisch und kontextgerecht.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: Manoach und seiner Frau
  rationale: Das wiederholte אֶל bezeichnet die Personen, denen die Gestalt erscheint. Im Deutschen ist die gemeinsame Dativkonstruktion natürlich und bildet den Sinn vollständig ab.
- source_word: אָז יָדַע
  choice: Da erkannte
  rationale: אָז führt die aus dem Geschehen folgende Einsicht ein. יָדַע bezeichnet hier nicht bloß vorhandenes Wissen, sondern das Erkennen der Identität; »Da erkannte« gibt diese narrative Folge natürlich wieder.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: dass er der Engel Jahwes war
  rationale: Das Personalpronomen הוּא verweist auf die zuvor erschienene Gestalt. Die personale Wiedergabe »er« bewahrt diesen Rückbezug, ohne die weitergehende theologische Identität der Gestalt festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Eigennamen und vermeidet eine stillschweigende Ersetzung durch einen Titel.
- issue: Bezeichnung und Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Der Kontext spricht für eine übernatürliche Gestalt, weshalb »Engel« im Haupttext gewählt wird. Die Formulierung bleibt jedoch bei der Bezeichnung des Textes und löst die theologische Spannung zwischen Jahwe und seinem Engel nicht näher auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der hebräischen Erzählstruktur; »Da erkannte« klingt dabei natürlicher als das im Deutschen missverständliche »Da wusste«.
