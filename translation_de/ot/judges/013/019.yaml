  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: de
  text: Da nahm Manoach das Zicklein und das Getreideopfer und brachte beides auf dem Felsen dem HERRN dar. Dabei geschah etwas Wunderbares[a], während Manoach und seine Frau zusahen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und er handelte wunderbar“. Der Handelnde wird im Hebräischen nicht noch einmal ausdrücklich genannt; dem Zusammenhang nach ist wohl der Bote des HERRN gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: das Ziegenböckchen
  rationale: Natürliche deutsche Bezeichnung für eine junge Ziege; sie bewahrt den Bezug auf das Opfertier.
- source_word: הַמִּנְחָה
  choice: das Speisopfer
  rationale: Im Opferzusammenhang bezeichnet מִנְחָה gewöhnlich eine unblutige, meist aus Getreide bestehende Opfergabe; „Speisopfer“ ist die geläufige prägnante Wiedergabe.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: brachte beides auf dem Felsen dem HERRN dar
  rationale: עלה bezeichnet hier das Darbringen eines Opfers. „Beides“ macht im Deutschen natürlich deutlich, dass Ziegenböckchen und Speisopfer gemeint sind, obwohl das hebräische Verb im Singular steht.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens יהוה als „HERR“ ist verständlich, würdig und markiert den Namen typografisch.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: Dabei tat er etwas Wunderbares
  rationale: Die Formulierung gibt die komprimierte Wendung mit dem maskulinen Singular wieder, ohne den im Vers nicht ausdrücklich genannten Handelnden zu identifizieren.
- source_word: רֹאִים
  choice: zusahen
  rationale: Das Partizip beschreibt ein andauerndes Zuschauen; „zusahen“ ist dafür idiomatisches modernes Deutsch.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וּמַפְלִא לַעֲשׂוֹת
  choice: Das Subjekt bleibt als „er“ unausgesprochen identifiziert; aus dem Zusammenhang liegt der Bote des HERRN nahe.
  alternative: „Der Engel des HERRN tat etwas Wunderbares“ oder unpersönlich „Dabei geschah etwas Wunderbares“.
  rationale: Der hebräische Satz ist elliptisch und nennt das Subjekt nicht erneut. Der Kontext weist auf den Boten des HERRN, doch eine ausdrückliche Benennung im Haupttext würde die Mehrdeutigkeit stärker auflösen als die Vorlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt erzählerisch klar; „Dabei“ verbindet das wunderbare Handeln mit der Opferhandlung, ohne die hebräische Ellipse unnötig aufzulösen.
