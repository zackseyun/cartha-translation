id: JDG.13.22
reference: Judges 13:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: de
  text: 'Und Manoach sagte zu seiner Frau: „Wir werden ganz gewiss sterben, denn wir haben Gott[a] gesehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Gott“ oder „ein göttliches Wesen“. Das hebräische Wort אֱלֹהִים kann je nach Zusammenhang auch allgemeiner ein göttliches Wesen bezeichnen; hier spricht der Zusammenhang eher für „Gott“.'
    reason: Lexikalische Alternative und Bewahrung der möglichen Mehrdeutigkeit von אֱלֹהִים.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Der Narrativanschluss mit Waw-Konsekutiv wird schlicht und ohne zusätzliche Deutung wiedergegeben.
- source_word: מָנוֹחַ
  choice: Manoach
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶל אִשְׁתּוֹ
  choice: zu seiner Frau
  rationale: Dies ist die natürliche deutsche Wiedergabe der ehelichen Beziehung in diesem Kontext.
- source_word: מוֹת נָמוּת
  choice: wir werden ganz gewiss sterben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; „ganz gewiss“ bewahrt diesen Nachdruck in natürlichem Deutsch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Manoachs Todesfurcht ein.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Zusammenhang legt die Bezeichnung des Gottes Israels nahe und erklärt Manoachs Furcht; die grundsätzlich mögliche weitere Bedeutung wird in einer Fußnote offengehalten.
- source_word: רָאִינוּ
  choice: wir haben … gesehen
  rationale: Das deutsche Perfekt drückt natürlich aus, dass die soeben gemachte Erfahrung Manoachs gegenwärtige Reaktion begründet.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים nach der Erscheinung des Engels des HERRN
  choice: Gott
  alternative: ein Gott; ein göttliches Wesen
  rationale: Manoachs Todesfurcht entspricht der biblischen Vorstellung, dass ein Mensch die unmittelbare Begegnung mit Gott nicht überlebt. Zugleich wird die geheimnisvolle Beziehung zwischen dem Engel des HERRN und Gott nicht weiter aufgelöst, als es der Text selbst tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische hebräische Konstruktion wird verständlich mit „ganz gewiss“ wiedergegeben. Der Fußnotenmarker steht unmittelbar bei „Gott“, da sich die Anmerkung auf אֱלֹהִים bezieht.
