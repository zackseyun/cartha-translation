- from: 'Da stand Manoach auf und folgte seiner Frau.[a] Er kam zu dem Mann und fragte ihn: »Bist du der Mann, der mit der Frau gesprochen hat?«[b] Er antwortete: »Ja, der bin ich.«[c]'
  to: 'Da stand Manoach auf, ging seiner Frau hinterher[a] und kam zu dem Mann. Er fragte ihn: »Bist du der Mann, der zu der Frau gesprochen hat?«[b] Er antwortete: »Ich bin es.«[c]'
