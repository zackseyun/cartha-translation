  - severity: low
    issue: »mit der Frau gesprochen« glättet die Richtung von דִּבֶּר אֶל.
    rationale: Im Deutschen ist »mit« zwar idiomatisch, kann aber ein gegenseitiges Gespräch stärker andeuten. »Zu der Frau gesprochen« erhält die Ausrichtung der Rede und bleibt natürlich.
  - severity: low
