base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: de
  text: 'Da stand Manoach auf, ging seiner Frau hinterher[a] und kam zu dem Mann. Er fragte ihn: »Bist du der Mann, der zu der Frau gesprochen hat?«[b] Er antwortete: »Ich bin es.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »folgte seiner Frau«. Wörtlich: »ging hinter seiner Frau her«.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht »die Frau«, nicht »meine Frau«.
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch nur: »Ich«; auch möglich: »Ich bin derjenige«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand auf
  rationale: Das Qal wayyiqtol von קום bezeichnet hier den Beginn der Handlung. Die geläufige deutsche Erzählformel »stand auf« gibt dies natürlich und präzise wieder.
- source_word: וַיֵּלֶךְ מָנוֹחַ אַחֲרֵי אִשְׁתּוֹ
  choice: Manoach folgte seiner Frau
  rationale: הלך bezeichnet die Bewegung, während אַחֲרֵי die Richtung beziehungsweise das Folgen angibt. Im Deutschen bündelt »folgte« beides idiomatisch, ohne eine besondere Fortbewegungsart festzulegen.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: Er kam zu dem Mann
  rationale: בוא mit אֶל wird direkt als »zu jemandem kommen« wiedergegeben. »Der Mann« bewahrt die Bezeichnung des Besuchers an dieser Stelle der Erzählung.
- source_word: הַאַתָּה הָאִישׁ
  choice: Bist du der Mann
  rationale: Die Verbindung aus Fragepartikel und Pronomen bildet eine direkte Identitätsfrage; die gewählte Form ist im modernen Deutsch klar und ungezwungen.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: der mit der Frau gesprochen hat
  rationale: Das Deutsche verwendet bei »sprechen« idiomatisch »mit«, auch wenn das hebräische אֶל wörtlich eine Ausrichtung »zu« ausdrückt. »Die Frau« wahrt den ausdrücklichen Wortlaut statt ihn zu »meiner Frau« zu verdeutlichen.
- source_word: וַיֹּאמֶר
  choice: Er antwortete
  rationale: Das wiederholte »und er sagte« wird im unmittelbaren Frage-Antwort-Zusammenhang natürlich als »er antwortete« wiedergegeben.
- source_word: אָנִי
  choice: Ja, der bin ich
  rationale: Die hebräische verblosе Antwort lautet wörtlich nur »Ich«. Im Deutschen gibt »Ja, der bin ich« die bejahende Selbstidentifikation eindeutig und natürlich wieder.
theological_decisions:
- issue: Identität des Besuchers
  choice: הָאִישׁ wird als »der Mann« wiedergegeben.
  alternative: »der Engel« oder »der Bote«
  rationale: Obwohl der weitere Zusammenhang den Besucher als Engel des HERRN erkennen lässt, nennt ihn dieser Vers אִישׁ, »Mann«. Die Übersetzung bewahrt damit die schrittweise Enthüllung innerhalb der Erzählung.
- issue: Möglicher theologischer Anklang der Antwort אָנִי
  choice: Die Antwort wird idiomatisch als »Ja, der bin ich« übersetzt.
  alternative: »Ich bin«
  rationale: אָנִי ist hier eine knappe Antwort auf die Identitätsfrage und keine eigenständige Gottesformel. Die deutsche Fassung vermeidet deshalb einen im Hebräischen nicht zwingend vorhandenen Anklang an eine besondere Selbstoffenbarung.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die Satzfolge bleibt nahe am hebräischen Narrativstil, wird jedoch durch »folgte« und »antwortete« idiomatisch geglättet. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
