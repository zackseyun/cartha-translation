base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: de
  text: Und der Geist Jahwes begann, ihn in Machane-Dan[a], zwischen Zora und Eschtaol, anzutreiben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Machane-Dan bedeutet „Lager Dans“; hier wird die Bezeichnung als Ortsname verwendet.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ihn aufzurütteln“ beziehungsweise „ihn zu bewegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחֶל
  choice: begann
  rationale: Die Hifil-Form von חלל bezeichnet hier den Beginn eines Geschehens; „begann“ gibt den ingressiven Erzählfortgang natürlich wieder.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: Im Zusammenhang der Simson-Erzählung bezeichnet רוּחַ die wirksame, befähigende Gegenwart Jahwes und nicht Wind oder Atem.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְפַעֲמוֹ
  choice: ihn anzutreiben
  rationale: Das Verb פעם kann hier „antreiben“, „bewegen“ oder „in Bewegung versetzen“ bedeuten. „Antreiben“ bewahrt die Kraft des göttlichen Impulses, ohne dessen genaue innere oder äußere Form festzulegen.
- source_word: בְּמַחֲנֵה דָן
  choice: in Mahane-Dan
  rationale: Die Verbindung bedeutet wörtlich „Lager Dans“, fungiert hier jedoch als Ortsname; daher wird sie transliteriert.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: zwischen Zora und Eschtaol
  rationale: Die geografische Angabe wird direkt mit den im Deutschen gebräuchlichen Formen der Ortsnamen wiedergegeben.
theological_decisions:
- issue: Bedeutung von רוּחַ יְהוָה
  choice: der Geist Jahwes als wirksame göttliche Gegenwart
  alternative: der Wind Jahwes / der Atem Jahwes
  rationale: Im Kontext beginnt Simsons göttliche Befähigung; die personale bzw. wirksame Bedeutung „Geist“ passt daher besser als meteorologischer Wind, ohne spätere dogmatische Ausformulierung in den Vers einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text enthält den Eigennamen YHWH; „Jahwe“ gibt ihn im modernen Standarddeutsch direkt wieder.
- issue: Art des Wirkens an Simson in לְפַעֲמוֹ
  choice: anzutreiben
  alternative: aufzurütteln / zu bewegen
  rationale: Der Ausdruck beschreibt den einsetzenden göttlichen Impuls, lässt aber offen, wie Simson ihn subjektiv erlebte und welche konkrete Handlung unmittelbar daraus folgte.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzstellung bleibt gut lesbar und hält zugleich den Beginn des Wirkens des Geistes im Vordergrund. Die Ortsnamen werden als Eigennamen behandelt; die echte Bedeutungsbreite von פעם wird in einer Fußnote bewahrt.
