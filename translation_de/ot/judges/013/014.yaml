source:
  edition: WLC
  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: de
  text: Sie darf nichts essen, was vom Weinstock kommt[a]. Sie darf weder Wein noch starkes Getränk trinken und nichts Unreines essen. Alles, was ich ihr geboten habe, soll sie befolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von allem, was aus dem Weinstock des Weines hervorgeht“; gemeint ist alles, was vom Weinstock stammt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: nichts …, was vom Weinstock kommt
  rationale: Bewahrt den umfassenden Charakter der Wendung und die verbale Aussage יֵצֵא („herauskommt“, „hervorgeht“), klingt zugleich im modernen Deutschen natürlich.
- source_word: לֹא תֹאכַל
  choice: sie darf nichts essen
  rationale: Gibt die prohibitive Kraft in natürlichem Gegenwartsdeutsch wieder.
- source_word: יַיִן
  choice: Wein
  rationale: Die übliche und direkte deutsche Entsprechung.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: Bezeichnet breit ein alkoholisches beziehungsweise berauschendes Getränk neben Wein, ohne die Bedeutung unnötig auf Bier einzuengen.
- source_word: אַל תֵּשְׁתְּ
  choice: weder … trinken
  rationale: Die mit אַל ausgedrückte Untersagung wird zusammen mit dem vorangehenden „darf“ idiomatisch wiedergegeben.
- source_word: כָל טֻמְאָה
  choice: nichts Unreines
  rationale: Bewahrt die breite, unbestimmte Formulierung und den biblischen Reinheitsbegriff.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ
  choice: alles, was ich ihr geboten habe
  rationale: Gibt die umfassende Formulierung direkt wieder; das Perfekt passt zum zuvor erteilten Gebot.
- source_word: תִּשְׁמֹר
  choice: soll sie befolgen
  rationale: שׁמר bedeutet hier, die Anweisungen zu beachten und einzuhalten; „befolgen“ ist im Deutschen klarer als das wörtliche „bewahren“.
theological_decisions:
- issue: Umfang des Verbots von Erzeugnissen des Weinstocks
  choice: Die Wendung wird umfassend auf alles bezogen, was vom Weinstock kommt.
  alternative: Das Verbot enger auf Trauben oder essbare Traubenerzeugnisse beziehen.
  rationale: Der hebräische Wortlaut ist bewusst umfassend. Der Zusammenhang weist auf besondere Weihevorschriften, ohne dass im Haupttext eine spätere technische Bezeichnung ergänzt werden muss.
- issue: Wiedergabe von טֻמְאָה
  choice: „Unreines“
  alternative: '„Unreines/Unreine“ als „Unreines“ oder „etwas Unreines“; sachlich auch „Unreines/Unreines“ im Sinn von „Unreines bzw. Unreines“; mögliche Übersetzung: „Unreines“ statt „Unreines/Unreines“'
  rationale: „Unrein“ erhält den kultisch-biblischen Bedeutungsrahmen und die Bezüge zu den Reinheitsvorschriften der Tora besser als das allgemeinere „unlauter“ oder ein rein hygienisch verstandener Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebote werden klar und natürlich formuliert; der Parallelismus wird zugunsten eines flüssigen deutschen Satzbaus leicht gegliedert. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Wendung.
