base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: de
  text: 'Da kam die Frau und sagte zu ihrem Mann: »Ein Mann Gottes kam zu mir. Sein Aussehen war wie das Aussehen des Engels Gottes[a] – überaus furchtgebietend.[b] Ich fragte ihn nicht, woher er sei, und seinen Namen nannte er mir nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch »Bote« bedeuten. Die Frau vergleicht das Aussehen des Mannes mit dem Aussehen eines Engels beziehungsweise Boten Gottes, ohne damit ausdrücklich zu sagen, dass sie ihn schon als Gottes Boten erkannt habe.
    reason: lexical_and_narrative_ambiguity
  - marker: b
    text: 'Oder: »überaus ehrfurchtgebietend« beziehungsweise »überaus erschreckend«. Das hebräische Wort bezeichnet einen Anblick, der heftige Furcht und ehrfürchtiges Staunen auslöst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשָּׁה
  choice: die Frau
  rationale: Der bestimmte Ausdruck bezeichnet Manoachs bereits eingeführte Frau; „die Frau“ bewahrt die hebräische Erzählweise.
- source_word: לְאִישָׁהּ
  choice: zu ihrem Mann
  rationale: Im ehelichen Zusammenhang bedeutet אִישׁ mit dem Suffix der 3. Person Femininum Singular idiomatisch „ihr Mann“.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ein Mann Gottes
  rationale: Die feste Bezeichnung wird erhalten; der fehlende Artikel bei אִישׁ spricht hier für eine unbestimmte Wiedergabe.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: Sein Aussehen war wie das Aussehen
  rationale: Die Wiederholung von מַרְאֶה wird bewahrt, weil sie den ausdrücklichen Vergleich des sichtbaren Erscheinungsbildes trägt.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: des Engels Gottes
  rationale: „Engel“ ist im übernatürlichen Erzählzusammenhang die natürliche deutsche Wiedergabe. Die Konstruktverbindung mit dem bestimmten הָאֱלֹהִים ist als bestimmt wiedergegeben.
- source_word: נוֹרָא מְאֹד
  choice: überaus furchtgebietend
  rationale: נוֹרָא bezeichnet etwas, das starke Furcht und ehrfürchtiges Staunen hervorruft; „furchtgebietend“ hält beide Aspekte eher offen als „schrecklich“.
- source_word: אֵי מִזֶּה הוּא
  choice: woher er sei
  rationale: Die Wendung fragt nach der Herkunft; der Konjunktiv passt im Deutschen zur indirekten Frage.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: und seinen Namen nannte er mir nicht
  rationale: Die Voranstellung von „seinen Namen“ bildet die hebräische Hervorhebung natürlich nach.
theological_decisions:
- issue: Identität des מַלְאַךְ הָאֱלֹהִים
  choice: der Engel Gottes
  alternative: ein Engel Gottes; ein Bote Gottes
  rationale: Die bestimmte Konstruktverbindung wird grammatisch abgebildet, ohne den Vergleich der Frau in eine ausdrückliche Identifizierung umzudeuten. Die Fußnote hält die Grundbedeutung „Bote“ sichtbar.
- issue: Bedeutung von נוֹרָא im Blick auf Furcht und Ehrfurcht
  choice: furchtgebietend
  alternative: ehrfurchtgebietend; schrecklich
  rationale: Die gewählte Formulierung bewahrt die Spannung zwischen Schrecken und überwältigender Ehrfurcht, statt nur einen Pol festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Formulierung „Sein Aussehen war wie das Aussehen“ bewahrt die markante hebräische Wiederholung; „woher er sei“ klingt in berichteter Rede natürlich und gehoben, ohne altertümlich zu wirken.
