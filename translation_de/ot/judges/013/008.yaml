  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: de
  text: 'Da flehte Manoach zu Jahwe und sagte: »Bitte, Herr, lass den Mann Gottes, den du gesandt hast, doch noch einmal zu uns kommen und uns lehren, was wir mit dem Jungen tun sollen, der geboren werden soll.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: Da flehte Manoach zu
  rationale: Das Verb עתר bezeichnet hier ein ernstes, an Gott gerichtetes Flehen; „flehte zu“ bewahrt sowohl die Intensität als auch den Gebetscharakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּי אֲדֹנָי
  choice: Bitte, Herr
  rationale: בִּי fungiert als höflich-eindringliche Bitte; אֲדֹנָי ist hier die ehrerbietige Anrede „Herr“.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die wörtliche und im Deutschen geläufige Wendung bewahrt Manoachs damalige Wahrnehmung der Gestalt, ohne ihre Identität vorzeitig näher zu bestimmen.
- source_word: אֲשֶׁר שָׁלַחְתָּ
  choice: den du gesandt hast
  rationale: Die Relativkonstruktion wird direkt und natürlich wiedergegeben; „gesandt“ entspricht dem würdevollen Erzählregister.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: soll doch noch einmal zu uns kommen
  rationale: „soll doch“ gibt die höfliche, bittende Kraft von Jussiv und נָא wieder; „noch einmal“ entspricht עוֹד.
- source_word: וְיוֹרֵנוּ
  choice: und uns lehren
  rationale: Der Hifil von ירה bezeichnet Unterweisung; „lehren“ ist präzise, verständlich und stilistisch angemessen.
- source_word: מַה נַּעֲשֶׂה
  choice: was wir … tun sollen
  rationale: Die Formulierung bewahrt den deliberativen Sinn der Frage nach dem gebotenen praktischen Handeln.
- source_word: לַנַּעַר
  choice: für den Jungen
  rationale: נַעַר ist maskulin und bezeichnet im Kontext den angekündigten Sohn; „Junge“ erhält diese konkrete Geschlechtsangabe.
- source_word: הַיּוּלָּד
  choice: der geboren werden wird
  rationale: Das passive Partizip bezeichnet hier prospektiv den Jungen, dessen Geburt noch bevorsteht; die Wiedergabe bewahrt diese futurische Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bildet ihn ab, ohne ihn durch den Titel „HERR“ zu ersetzen.
- issue: Identität des אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  alternative: Bote Gottes / Engel Gottes
  rationale: Manoach bezeichnet die Gestalt an dieser Stelle als „Mann Gottes“. Diese Wiedergabe wahrt die Erzählperspektive und löst die spätere Erkenntnis über ihre Identität nicht vorweg auf.
- issue: Geschlechtsspezifische Wiedergabe von לַנַּעַר
  choice: für den Jungen
  alternative: für das Kind
  rationale: Die maskuline Bezeichnung passt zum angekündigten Sohn. „Kind“ wäre möglich, würde die im Ausgangstext vorhandene Geschlechtsangabe aber abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da flehte“ schließt natürlich an den Erzählzusammenhang an; „soll doch noch einmal“ vermittelt die eindringliche Bitte ohne altertümliche Satzform. Die Wiederholung von „soll“ ist semantisch klar und im gesprochenen Gebet natürlich.
