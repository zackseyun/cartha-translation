  to: 'Da flehte Manoach zu Jahwe und sagte: »Bitte, Herr, lass den Mann Gottes, den du gesandt hast, doch noch einmal zu uns kommen und uns lehren, was wir mit dem Jungen tun sollen, der geboren werden soll.«'
  rationale: Die Revision verbessert ausschließlich die idiomatische und semantische Wiedergabe der Anweisung in Bezug auf den Jungen sowie die prospektive Geburtsform. Sie bewahrt alle wesentlichen lexikalischen und erzählerischen Entscheidungen des Entwurfs, einschließlich des Gottesnamens und der bewusst nicht weiter ausgelegten Bezeichnung „Mann Gottes“.
