  - severity: medium
    issue: Fußnotenanker steht nicht beim Bezugswort
    rationale: Die Fußnote erläutert die lexikalische Alternative zu „retten“, ist aber erst nach dem Satzzeichen platziert. Der Anker soll unmittelbar an „retten“ stehen.
