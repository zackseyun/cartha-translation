source:
  edition: WLC
  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: de
  text: Denn sieh, du bist schwanger und wirst einen Sohn gebären. Kein Schermesser soll auf sein Haupt kommen; denn der Junge wird vom Mutterleib an ein Nasiräer Gottes sein. Er wird beginnen, Israel aus der Hand der Philister zu retten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israel aus der Hand der Philister zu befreien“. Das hebräische Verb kann je nach Zusammenhang „retten“ oder „befreien“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: sieh
  rationale: Die deiktische Partikel lenkt nachdrücklich die Aufmerksamkeit auf die folgende Ankündigung. „Sieh“ bewahrt diese Funktion in natürlichem, würdigem Deutsch.
- source_word: הָרָה
  choice: du bist schwanger
  rationale: Das Wort bezeichnet hier als prädikatives Adjektiv einen gegenwärtigen Zustand, nicht einen erst zukünftigen Vorgang der Empfängnis.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: und wirst einen Sohn gebären
  rationale: Im Zusammenhang der Ankündigung hat die Form Zukunftsbezug; „gebären“ gibt die Aussage präzise und natürlich wieder.
- source_word: מוֹרָה
  choice: Schermesser
  rationale: Im Zusammenhang des Nasiräertums bezeichnet das Substantiv ein Gerät zum Abscheren der Haare.
- source_word: לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: soll auf sein Haupt kommen
  rationale: Die Formulierung erhält das hebräische Bild und bringt zugleich das Verbot verständlich zum Ausdruck.
- source_word: נְזִיר אֱלֹהִים
  choice: ein Nasiräer Gottes
  rationale: „Nasiräer“ bewahrt den technischen Ausdruck für die besondere Weihe; „Gottes“ gibt die ausdrückliche Genitivverbindung wieder.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: Der Ausdruck bezeichnet hier den angekündigten männlichen Nachwuchs und bleibt näher am Hebräischen als eine Verallgemeinerung zu „Kind“.
- source_word: מִן הַבָּטֶן
  choice: vom Mutterleib an
  rationale: Die Wiedergabe erhält den ausdrücklichen Bezug auf den Mutterleib und damit die schon vor der Geburt geltende Weihe.
- source_word: יָחֵל
  choice: wird damit beginnen
  rationale: Die Form bedeutet hier „beginnen“ und macht deutlich, dass der angekündigte Retter Israels Befreiung einleitet, nicht notwendig vollendet.
- source_word: לְהוֹשִׁיעַ
  choice: zu retten
  rationale: Das Verb kann sowohl „retten“ als auch „befreien“ bedeuten. „Retten“ ist im Haupttext idiomatisch; die kontextuell passende Alternative wird in der Fußnote bewahrt.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: aus der Hand der Philister
  rationale: Die Wiedergabe bewahrt das hebräische Bild von Herrschaft beziehungsweise feindlicher Gewalt und ist im Deutschen verständlich.
theological_decisions:
- issue: Art der Weihe Simsons
  choice: ein Nasiräer Gottes vom Mutterleib an
  alternative: ein Gott Geweihter von Geburt an
  rationale: Der technische Ausdruck נְזִיר und der ausdrückliche Bezug auf den Mutterleib werden beibehalten, ohne die Aussage zu verallgemeinern oder spätere Lehrvorstellungen einzutragen.
- issue: Umfang von Simsons Rolle bei Israels Rettung
  choice: Er wird damit beginnen, Israel zu retten
  alternative: Er wird Israel retten
  rationale: יָחֵל kennzeichnet ausdrücklich den Anfang des Rettungsgeschehens. Die Alternative ohne „beginnen“ würde den Umfang seiner Rolle überzeichnen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. „Haupt“ und „aus der Hand“ bewahren zentrale hebräische Bildsprache; „Nasiräer“ erhält den technischen Begriff.
