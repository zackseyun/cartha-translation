base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: de
  text: 'Da beeilte sich die Frau, lief und berichtete ihrem Mann: „Sieh, der Mann, der damals[a] zu mir kam, ist mir erschienen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der an jenem Tag zu mir kam“; gemeint ist sein früherer Besuch.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: eilte … davon
  rationale: Das Verb מהר bezeichnet eiliges Handeln. „eilte … davon“ klingt in modernem Erzähldeutsch natürlich und hält die Aussage vom folgenden physischen Laufen unterscheidbar.
- source_word: וַתָּרָץ
  choice: lief zu ihrem Mann
  rationale: רוץ bezeichnet hier das Laufen. Das Ziel ergibt sich aus dem anschließenden Bericht an ihren Mann; die Formulierung gibt die dringliche Bewegung natürlich wieder.
- source_word: וַתַּגֵּד
  choice: berichtete
  rationale: Das Hifil von נגד bedeutet „mitteilen, berichten“. „berichtete“ passt zur erzählenden Sprache und zur Weitergabe einer bedeutsamen Nachricht.
- source_word: לְאִישָׁהּ
  choice: ihrem Mann
  rationale: אִישׁ mit dem Suffix der 3. Person Singular feminin bezeichnet in diesem häuslichen Zusammenhang idiomatisch ihren Ehemann.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die unmittelbar folgende Nachricht hervor. „Sieh“ bewahrt diese Funktion in würdiger, aber nicht veralteter Sprache.
- source_word: נִרְאָה אֵלַי
  choice: ist mir erschienen
  rationale: Das Nifal von ראה bezeichnet hier ein Sichtbarwerden beziehungsweise Erscheinen. Das deutsche Perfekt passt zum unmittelbaren Bericht über das gerade Geschehene.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Die bestimmte Bezeichnung verweist auf die zuvor begegnete Gestalt. Sie gibt die Perspektive der Frau wieder, ohne deren Identität an dieser Stelle weiter auszudeuten.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: der damals zu mir kam
  rationale: Die ungewöhnliche Wendung בַיּוֹם lautet wörtlich „an dem Tag“ und verweist im Zusammenhang auf den früheren Besuch. „damals“ ist dafür eine natürliche deutsche Wiedergabe; die wörtlichere Form wird in der Fußnote genannt.
theological_decisions:
- issue: Identität von הָאִישׁ in der Rede der Frau
  choice: der Mann
  alternative: der Engel; der Bote Gottes
  rationale: Obwohl der weitere Zusammenhang die Gestalt als Engel des HERRN bezeichnet, nennt die Frau sie hier lediglich „den Mann“. Die Übersetzung bewahrt ihre unmittelbare Perspektive und trägt keine weitergehende Identifizierung in den Vers ein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die beiden Verben für das eilige Handeln und das Laufen bleiben unterscheidbar; unnötig altertümliche Wendungen werden vermieden.
