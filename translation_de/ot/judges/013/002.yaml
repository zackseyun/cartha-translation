  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֧ד מִ/צָּרְעָ֛ה מִ/מִּשְׁפַּ֥חַת הַ/דָּנִ֖י וּ/שְׁמ֣/וֹ מָנ֑וֹחַ וְ/אִשְׁתּ֥/וֹ עֲקָרָ֖ה וְ/לֹ֥א יָלָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: de
  text: Es gab einen Mann aus Zora, der aus der Sippe der Daniter stammte. Sein Name war Manoach. Seine Frau war unfruchtbar und hatte keine Kinder geboren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und hatte nicht geboren“. Im Hebräischen steht kein ausdrückliches Wort für „Kinder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִישׁ אֶחָד
  choice: Es gab einen Mann
  rationale: Die Wendung führt eine bestimmte, zunächst noch nicht näher vorgestellte Person in die Erzählung ein. „Es gab einen Mann“ gibt diese Funktion natürlich wieder; „einen bestimmten Mann“ wäre im Deutschen unnötig schwerfällig.
- source_word: מִצָּרְעָה
  choice: aus Zora
  rationale: Die Präposition מִן bezeichnet die Herkunft. Der Ortsname צָרְעָה wird in der geläufigen deutschen Form „Zora“ wiedergegeben.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: der aus der Sippe der Daniter stammte
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untergruppe innerhalb des Stammes; „Sippe“ ist daher genauer als „Stamm“. Die Relativkonstruktion vermeidet im Deutschen eine schwerfällige Wiederholung von „aus“.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: Sein Name war Manoach
  rationale: Die ausdrückliche hebräische Namensformel bleibt erhalten. מָנוֹחַ wird nach geläufiger deutscher biblischer Schreibweise als „Manoach“ wiedergegeben.
- source_word: עֲקָרָה
  choice: unfruchtbar
  rationale: „Unfruchtbar“ ist eine klare, gegenwärtig verständliche und sachlich genaue Wiedergabe des Zustands, den das hebräische Adjektiv bezeichnet.
- source_word: וְלֹא יָלָדָה
  choice: und hatte keine Kinder geboren
  rationale: Das Verb ילד bezeichnet bei weiblichem Subjekt das Gebären. „Keine Kinder geboren“ ist idiomatisches Deutsch und vermeidet die unnatürliche Ellipse „hatte nicht geboren“; die im Hebräischen nicht ausdrücklich genannte Ergänzung wird in einer Fußnote kenntlich gemacht.
