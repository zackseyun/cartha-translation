  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: de
  text: 'Da sagte der Engel Jahwes zu ihm: »Warum fragst du nach meinem Namen? Denn er ist wunderbar.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unbegreiflich«, »außergewöhnlich«; möglicherweise auch: »geheim«. Das hebräische Wort bezeichnet etwas Außergewöhnliches und Wunderbares, das sich menschlichem Begreifen entzieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ bezeichnet einen Boten und in diesem Erzählzusammenhang einen übernatürlichen Gesandten; »Engel« ist daher im Deutschen natürlich. Der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: לָמָּה זֶּה
  choice: Warum
  rationale: Die hebräische Wendung leitet eine rhetorische Frage ein; »Warum« gibt ihre Funktion knapp und idiomatisch wieder.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: fragst du nach meinem Namen
  rationale: שׁאל mit ל und »Name« bedeutet, nach jemandes Namen zu fragen. Diese Formulierung ist natürliches modernes Deutsch.
- source_word: וְהוּא
  choice: Er ist
  rationale: Das Pronomen bezieht sich grammatisch auf שֵׁם, »Name«, das im Deutschen maskulin ist. Ein neuer deutscher Satz bewahrt die Aussage, ohne den Zusammenhang übermäßig kausal festzulegen.
- source_word: פֶלִאי
  choice: unfassbar wunderbar
  rationale: Das seltene Adjektiv bezeichnet etwas außergewöhnlich Wunderbares, das menschliches Begreifen übersteigt. Die zweigliedrige Wiedergabe erhält sowohl den Aspekt des Wunderbaren als auch den der Unbegreiflichkeit.
theological_decisions:
- issue: Mögliche theophanische oder christologische Bedeutung von פֶלִאי
  choice: Lexikalisch als »unfassbar wunderbar« wiedergeben, ohne die Identität des Engels in der Übersetzung zu bestimmen.
  alternative: Als titelartige Bezeichnung »Wunderbar« oder rein kognitiv als »unbegreiflich« wiedergeben.
  rationale: Der Text kann theologische Bezüge nahelegen, legt die Identität des Engels hier aber nicht ausdrücklich fest. Die Übersetzung bewahrt diese Spannung und vermeidet eine konfessionelle Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und rhetorisch; »Jahwe« bewahrt den persönlichen Gottesnamen.
