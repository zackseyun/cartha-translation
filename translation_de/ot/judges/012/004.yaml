  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: de
  text: 'Da rief Jeftah alle Männer Gileads zusammen und kämpfte gegen Efraim. Die Männer Gileads schlugen Efraim nieder, weil die Efraimiter gesagt hatten: »Ihr Gileaditer seid Flüchtlinge Efraims, mitten in Efraim und mitten in Manasse!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut der abschließenden Beschimpfung ist schwer verständlich. Möglich ist auch: »Ihr seid Flüchtlinge Efraims, Gilead, unter Efraim und unter Manasse!«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: rief … zusammen
  rationale: קבץ bezeichnet das Sammeln oder Zusammenrufen; im militärischen Zusammenhang ist „zusammenrufen“ natürlich und lässt offen, wie förmlich die Mobilisierung war.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: alle Männer Gileads
  rationale: Die Formulierung bleibt nahe am Hebräischen und bezeichnet im Kampfzusammenhang die kampffähigen Männer, ohne ausdrücklich „Krieger“ einzutragen.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: kämpfte gegen Efraim
  rationale: Das Nifal von לחם bedeutet hier „kämpfen“; „gegen“ bezeichnet im Deutschen die gegnerische Partei idiomatisch.
- source_word: וַיַּכּוּ
  choice: schlugen … nieder
  rationale: נכה kann schlagen, niederschlagen oder besiegen bedeuten. „niederschlagen“ bewahrt die gewaltsame militärische Aussage, ohne den Tod jedes Betroffenen zu behaupten.
- source_word: כִּי
  choice: weil
  rationale: כִּי führt hier den Anlass beziehungsweise Grund für den Angriff ein; „weil“ ist in modernem Deutsch klar.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: Flüchtlinge aus Efraim
  rationale: פְּלִיטֵי bezeichnet Entkommene oder Geflüchtete. „Flüchtlinge“ erhält den abwertenden Kern des Zurufs; „aus“ gibt die mögliche Herkunftsbeziehung wieder, ohne die schwierige Syntax vollständig aufzulösen.
- source_word: אַתֶּם גִּלְעָד
  choice: ihr Gileaditer
  rationale: Der Ortsname Gilead steht kollektiv für seine Bewohner; „Gileaditer“ ist die natürliche deutsche Personenbezeichnung.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: mitten in Efraim und mitten in Manasse
  rationale: בְּתוֹךְ bedeutet „inmitten/mitten in“ oder „unter“. Die Wiederholung wird entsprechend dem Hebräischen bewahrt; „zwischen“ wäre stärker deutend.
theological_decisions:
- issue: Syntaktisch schwierige Beschimpfung im letzten Satzteil
  choice: „Ihr Gileaditer seid Flüchtlinge aus Efraim, mitten in Efraim und mitten in Manasse!“
  alternative: „Ihr seid Flüchtlinge Efraims, Gilead, unter Efraim und unter Manasse!“
  rationale: Der hebräische Wortlaut ist gedrängt und syntaktisch unsicher. Der Haupttext bietet verständliches Deutsch, behält jedoch die auffällige Wiederholung und den Ausdruck „Flüchtlinge“ bei. Die Fußnote macht eine näher am Wortlaut liegende alternative Zuordnung sichtbar, statt die Spannung stillschweigend zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählverben sind knapp und anschaulich gehalten. Die traditionelle deutsche Namensform „Jeftah“ und die Schreibungen „Efraim“ und „Manasse“ werden verwendet. Der Fußnotenmarker [a] steht unmittelbar nach der betroffenen direkten Rede.
