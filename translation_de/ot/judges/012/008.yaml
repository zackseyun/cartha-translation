  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אִבְצָ֖ן מִ/בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: de
  text: Nach ihm richtete Ibzan aus Bethlehem[a] Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Bethlehem“. Die hebräische Präposition kann Herkunft oder Zugehörigkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: richtete
  rationale: Das Verb שׁפט bezeichnet im Richterbuch wiederholt die Tätigkeit eines Richters, der Israel Recht verschafft und führt. „Richtete“ bewahrt diese Leitwortverbindung, ohne sie auf bloßes Regieren oder militärisches Führen einzuengen.
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Präposition mit Pronominalsuffix kennzeichnet die zeitliche beziehungsweise amtliche Nachfolge. Der Bezug auf Jiftach ist aus dem Zusammenhang ersichtlich und muss im Vers nicht ausdrücklich ergänzt werden.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: אֶת markiert das direkte Objekt; im Deutschen wird diese Markierung nicht eigens wiedergegeben.
- source_word: אִבְצָן
  choice: Ibzan
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: מִבֵּית לָחֶם
  choice: aus Bethlehem
  rationale: Die Präposition מִן bezeichnet hier am natürlichsten die Herkunft Ibzans. Daneben ist eine allgemeinere örtliche Zuordnung möglich.
theological_decisions: []
translation_notes:
