  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: de
  text: Er hatte vierzig Söhne und dreißig Enkel, die auf siebzig Eseln ritten. Er war acht Jahre lang Richter über Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: Enkel
  rationale: Wörtlich »Söhne der Söhne«; im Deutschen bezeichnet »Enkel« die gemeinte Verwandtschaft natürlich und präzise.
- source_word: עֲיָרִם
  choice: Eseln
  rationale: Die maskuline Pluralform bezeichnet hier Esel; eine genauere Geschlechtsbestimmung ist im Deutschen nicht erforderlich.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: Er war ... Richter über Israel
  rationale: Im Richterbuch meint das Verb nicht nur gerichtliches Urteilen, sondern die Amts- und Leitungsfunktion eines Richters; diese Wiedergabe macht den historischen Sinn idiomatisch deutlich.
