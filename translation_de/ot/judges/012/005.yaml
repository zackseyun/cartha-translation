  text: וַ/יִּלְכֹּ֥ד גִּלְעָ֛ד אֶֽת מַעְבְּר֥וֹת הַ/יַּרְדֵּ֖ן לְ/אֶפְרָ֑יִם וְֽ֠/הָיָה כִּ֣י יֹאמְר֞וּ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אֶעֱבֹ֔רָה וַ/יֹּ֨אמְרוּ ל֧/וֹ אַנְשֵֽׁי גִלְעָ֛ד הַֽ/אֶפְרָתִ֥י אַ֖תָּה וַ/יֹּ֥אמֶֽר לֹֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: de
  text: 'Gilead nahm die Furten[a] des Jordan gegen Ephraim ein. Sooft nun einer der Flüchtlinge aus Ephraim sagte: »Lass mich hinübergehen«, fragten ihn die Männer von Gilead: »Bist du ein Ephraimit?« Wenn er antwortete: »Nein«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Übergänge«. Gemeint sind die flachen Stellen im Fluss, an denen man den Jordan überqueren konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: besetzte
  rationale: Das Verb bezeichnet hier die militärische Einnahme und Kontrolle strategischer Übergänge. „Besetzte“ gibt diese situationsbezogene Bedeutung im Deutschen natürlich wieder.
- source_word: מַעְבְּרוֹת
  choice: Furten
  rationale: Gemeint sind passierbare, gewöhnlich flache Stellen zum Überqueren des Jordan; „Furten“ ist dafür die präzise deutsche Bezeichnung.
- source_word: לְאֶפְרָיִם
  choice: gegen Ephraim
  rationale: Die Präposition wird im feindlichen Kontext als Ausrichtung gegen Ephraim verstanden. Die knappe Formulierung bewahrt dabei die Nähe zum Hebräischen.
- source_word: וְהָיָה כִּי
  choice: Sooft nun
  rationale: Die Wendung leitet hier einen wiederholten Ablauf ein. „Sooft“ macht diesen iterativen Sinn deutlich.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: Flüchtlinge aus Ephraim
  rationale: פָּלִיט bezeichnet Menschen, die aus einer Niederlage oder Gefahr entkommen sind. „Flüchtlinge“ passt zum unmittelbaren militärischen Zusammenhang.
- source_word: אֶעֱבֹרָה
  choice: Lass mich hinübergehen
  rationale: Die Kohortativform drückt hier einen Wunsch beziehungsweise eine Bitte aus.
- source_word: הַאֶפְרָתִי
  choice: ein Ephraimit
  rationale: Das Gentiliz bezeichnet die Stammeszugehörigkeit; im deutschen Prädikatsnomen steht natürlich der unbestimmte Artikel.
- source_word: וַיֹּאמְרוּ לוֹ ... אַתָּה
  choice: fragten ihn ... „Bist du ein Ephraimit?“
  rationale: Das hebräische „sie sagten zu ihm“ führt eine direkte Frage ein. „Fragten“ ist im Deutschen idiomatisch und der wiederholte Vorgang wird durch „sooft“ getragen.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Wenn er antwortete: „Nein“'
  rationale: Im beschriebenen wiederkehrenden Prüfverfahren ist die Aussage funktional konditional. „Wenn“ verdeutlicht den Zusammenhang mit dem im folgenden Vers geschilderten Schritt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederholte Ablauf wird mit „sooft“ und „wenn“ klar dargestellt. Der Satz endet entsprechend dem versübergreifenden hebräischen Zusammenhang mit einem Komma.
