  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אֵיל֖וֹן הַ/זְּבֽוּלֹנִ֑י וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל עֶ֥שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/011.yaml
  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: de
  text: Nach ihm richtete Elon, der Sebuloniter, Israel. Er richtete Israel zehn Jahre lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: richtete
  rationale: Das Verb שׁפט bezeichnet im Richterbuch die Tätigkeit der Richter. „Richtete“ bewahrt die wiederkehrende Terminologie und legt Elons Aufgabe nicht einseitig als militärische Führung oder politische Herrschaft aus.
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die pronominale Form verweist auf den zuvor genannten Richter. „Nach ihm“ gibt den Wortlaut wieder, ohne den Namen aus dem Kontext ergänzend einzusetzen.
- source_word: אֵילוֹן
  choice: Elon
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַזְּבוּלֹנִי
  choice: der Sebuloniter
  rationale: Die Herkunftsbezeichnung kennzeichnet Elon als Angehörigen des Stammes Sebulon; „der Sebuloniter“ gibt die adjektivische Form präzise und knapp wieder.
- source_word: עֶשֶׂר שָׁנִים
  choice: zehn Jahre lang
  rationale: Die Ergänzung „lang“ ist im Deutschen eine natürliche Kennzeichnung der Zeitdauer.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: richtete ... Israel. Er richtete Israel
  rationale: Die Wiederholung des Verbs und des Objekts im Hebräischen wird bewahrt. Zwei kurze Sätze halten den deutschen Text klar und geben zugleich die Struktur der Vorlage wieder.
theological_decisions:
- issue: Bedeutungsumfang von שׁפט im Richterbuch
  choice: richtete Israel
  alternative: führte Israel / regierte Israel
  rationale: „Richtete“ wahrt die Verbindung zur Bezeichnung „Richter“ und lässt offen, in welchem Verhältnis Rechtsprechung, Leitung und Herrschaft bei Elons Tätigkeit standen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe annalistische Ausdrucksweise und die auffällige Wiederholung der hebräischen Vorlage bleiben erhalten.
