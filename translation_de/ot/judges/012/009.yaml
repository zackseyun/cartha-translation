  - severity: low
    issue: Die Abweichung von „Töchter“ zu „Frauen“ im zweiten Satzteil benötigt einen Hinweis.
    rationale: Das Deutsche vermeidet damit die missverständliche Wendung „Töchter für seine Söhne“, während der hebräische Wortlaut in beiden Satzteilen בנות („Töchter“) hat.
