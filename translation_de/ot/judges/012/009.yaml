revisions:
- from: Er hatte dreißig Söhne und dreißig Töchter, die er nach außerhalb verheiratete; und für seine Söhne holte er dreißig Frauen von außerhalb. Er richtete Israel sieben Jahre lang.
  to: Er hatte dreißig Söhne und dreißig Töchter. Dreißig Töchter schickte er fort[a], und für seine Söhne holte er dreißig Frauen von außerhalb. Sieben Jahre lang richtete er Israel.
  rationale: Die Überarbeitung ersetzt die unnatürliche und stärker interpretierende Wendung „nach außerhalb verheiratete“ durch „schickte ... fort“, das die hebräische Aussage unmittelbar abbildet. Der wahrscheinliche Heiratskontext sowie die wörtliche Wiederholung von „Töchter“ werden transparent in der Fußnote erläutert. Die Richterterminologie bleibt erhalten.
  reviewer_model: gpt-5.6-terra
