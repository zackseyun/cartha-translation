  text: וַ/יְהִי ל֞/וֹ שְׁלֹשִׁ֣ים בָּנִ֗ים וּ/שְׁלֹשִׁ֤ים בָּנוֹת֙ שִׁלַּ֣ח הַ/ח֔וּצָ/ה וּ/שְׁלֹשִׁ֣ים בָּנ֔וֹת הֵבִ֥יא לְ/בָנָ֖י/ו מִן הַ/ח֑וּץ וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל שֶׁ֥בַע שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: de
  text: Er hatte dreißig Söhne und dreißig Töchter. Dreißig Töchter schickte er fort[a], und für seine Söhne holte er dreißig Frauen von außerhalb. Sieben Jahre lang richtete er Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wahrscheinlich ist gemeint, dass er dreißig seiner Töchter außerhalb seines Hauses bzw. seiner Sippe verheiratete und für seine Söhne dreißig Frauen von außerhalb holte. Im Hebräischen steht in beiden Satzteilen wörtlich „Töchter“.
    reason: Die Anmerkung hält die wahrscheinlich eheliche Bedeutung fest, ohne sie dem knappen Wortlaut des Haupttextes aufzuzwingen, und erklärt die kontextuelle Wiedergabe „Frauen“ im zweiten Satzteil.
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Er hatte
  rationale: Die hebräische Konstruktion היה + ל drückt Besitz aus; „Er hatte“ ist die natürliche deutsche Wiedergabe.
- source_word: שְׁלֹשִׁים בָּנִים
  choice: dreißig Söhne
  rationale: Direkte und geschlechtsgenaue Wiedergabe der Zahlenangabe.
- source_word: וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה
  choice: und dreißig Töchter, die er nach außerhalb verheiratete
  rationale: שׁלח bedeutet wörtlich „senden/fortschicken“, doch der parallele Satz über Frauen für seine Söhne macht einen Heiratsaustausch mit Gruppen außerhalb des eigenen Hauses oder Verbands deutlich. „Nach außerhalb verheiratete“ gibt diesen kontextuellen Sinn natürlich wieder, ohne „außer Landes“ zu unterstellen.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: und für seine Söhne holte er dreißig Frauen von außerhalb
  rationale: בנות heißt wörtlich „Töchter“, bezeichnet hier aber im parallelen Heiratskontext Frauen, die für seine Söhne geholt wurden. „Frauen“ ist im Deutschen verständlicher als die missverständliche Formulierung „Töchter für seine Söhne“.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Er richtete Israel
  rationale: „Richten“ bewahrt die wiederkehrende Terminologie des Richterbuchs und reduziert die Tätigkeit nicht auf modernes juristisches Urteilen.
- source_word: שֶׁבַע שָׁנִים
  choice: sieben Jahre lang
  rationale: Natürliche deutsche Wiedergabe einer Zeitdauer.
theological_decisions: []
