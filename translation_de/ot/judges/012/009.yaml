review_pass:
  verdict: revise
  source_fidelity: Die Deutung des Verses als Heiratsarrangement ist durch den Parallelismus gut begründet, doch der hebräische Text verwendet in beiden Satzteilen ausdrücklich „Töchter“ und sagt bei der ersten Handlung lediglich „(nach) draußen/fort schicken“. Die Formulierung „nach außerhalb verheiratete“ ist daher im Haupttext zu explizit und zugleich unidiomatisch. Die zweite Formulierung mit „Frauen“ kann als kontextuelle Verdeutlichung bestehen, sollte aber durch eine Anmerkung an die wörtliche hebräische Wortwahl gebunden werden.
  naturalness: „Nach außerhalb verheiratete“ ist kein natürliches modernes Standarddeutsch. Eine Satzgliederung und „fortschickte“ sind klar, idiomatisch und bewahren die zurückhaltendere Aussage des Ausgangstextes. „Sieben Jahre lang richtete er Israel“ ist in einem würdigen Bibelregister natürlich und erhält die Terminologie des Richterbuches.
  terminology: „Richtete Israel“ bewahrt das im Richterbuch prägende Verb שפט. „Söhne“, „Töchter“ und die Zahlenangaben sind korrekt. „Frauen von außerhalb“ verdeutlicht im zweiten Satzteil den wahrscheinlich ehelichen Kontext, ohne „Ausland“ oder eine bestimmte soziale Grenze einzutragen; die Fußnote vermerkt, dass dort im Hebräischen ebenfalls „Töchter“ steht.
