  register: Modernes, würdiges Standarddeutsch. Der erste Satz wird zur besseren Lesbarkeit syntaktisch gegliedert. Die Heiratsbedeutung wird aufgrund des engen Parallelismus ausdrücklich wiedergegeben; „von/nach außerhalb“ lässt offen, ob Haus, Sippe oder ein größerer sozialer Verband gemeint ist.
