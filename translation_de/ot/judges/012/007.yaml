  text: וַ/יִּשְׁפֹּ֥ט יִפְתָּ֛ח אֶת יִשְׂרָאֵ֖ל שֵׁ֣שׁ שָׁנִ֑ים וַ/יָּ֗מָת יִפְתָּח֙ הַ/גִּלְעָדִ֔י וַ/יִּקָּבֵ֖ר בְּ/עָרֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: de
  text: Jefta richtete Israel sechs Jahre lang. Dann starb Jefta, der Gileaditer, und wurde in den Städten Gileads begraben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Städten Gileads“. Der Plural kann hier möglicherweise eine nicht näher bezeichnete Stadt in der Region meinen.'
    reason: Der hebräische Plural ist bei der Bestattung einer einzelnen Person auffällig. Die Hauptübersetzung bewahrt ihn; die Fußnote nennt die mögliche idiomatische Deutung, ohne sie festzuschreiben.
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: richtete
  rationale: Das Verb שׁפט bezeichnet im Richterbuch wiederkehrend die Tätigkeit eines Richters und Retters. „Richtete“ bewahrt diesen Leitbegriff, ohne Jeftas Aufgabe auf Regierung oder militärische Führung zu verengen.
- source_word: שֵׁשׁ שָׁנִים
  choice: sechs Jahre lang
  rationale: Die Zeitangabe wird natürlich und genau wiedergegeben; „lang“ kennzeichnet im Deutschen idiomatisch die Dauer.
- source_word: הַגִּלְעָדִי
  choice: der Gileaditer
  rationale: Die Herkunftsbezeichnung identifiziert Jefta als Mann aus Gilead. „Der Gileaditer“ ist knapp und bewahrt die Form des hebräischen Gentiliziums.
- source_word: וַיִּקָּבֵר
  choice: wurde … begraben
  rationale: Die passive Verbform des Hebräischen wird im Deutschen entsprechend wiedergegeben.
- source_word: בְּעָרֵי גִלְעָד
  choice: in den Städten Gileads
  rationale: Die Übersetzung bewahrt den auffälligen Plural des masoretischen Textes, statt ihn stillschweigend als „in einer der Städte“ zu deuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der traditionelle Buchbegriff „richten“ wird wegen seiner literarischen Bedeutung beibehalten. Die schwer verständliche Ortsangabe bleibt im Haupttext formal nah am Hebräischen und wird durch eine knappe Fußnote erläutert.
