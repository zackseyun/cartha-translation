base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: de
  text: Dann starb Elon, der Sebuloniter, und wurde in Ajalon im Land Sebulon begraben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählfolge ein. „Dann starb“ gibt den schlichten Sinn und den Fortgang im Deutschen natürlich wieder.
- source_word: אֵלוֹן
  choice: Elon
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, quellenahen Form wiedergegeben.
- source_word: הַזְּבוּלֹנִי
  choice: der Sebuloniter
  rationale: Das Gentiliz mit Artikel bezeichnet Elons Stammeszugehörigkeit; „der Sebuloniter“ ist knapp und idiomatisch.
- source_word: וַיִּקָּבֵר
  choice: und wurde ... begraben
  rationale: Der Nifal von קבר hat hier passive Bedeutung. Die deutsche Passivform entspricht dem hebräischen Ausdruck.
- source_word: בְּאַיָּלוֹן
  choice: in Ajalon
  rationale: Die Präposition בְּ bezeichnet den Ort der Bestattung; „in Ajalon“ ist im Deutschen natürlich.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: im Land Sebulon
  rationale: אֶרֶץ bezeichnet hier das Land beziehungsweise Gebiet des Stammes Sebulon. „im Land Sebulon“ ist quellenah und verständlich.
