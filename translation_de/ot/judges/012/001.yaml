base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: de
  text: 'Da wurden die Männer Efraims[b] zusammengerufen. Sie zogen nach Zafon[a] hinüber und sagten zu Jeftah: „Warum bist du hinübergezogen, um gegen die Ammoniter zu kämpfen, und hast uns nicht gerufen, mit dir zu gehen? Wir werden dein Haus über dir niederbrennen!“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Norden“, falls צָפוֹנָה als Richtungsangabe und nicht als Ortsname Zafon verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht im Hebräischen „Mann Efraims“. Die Verben im Zusammenhang zeigen jedoch, dass die Efraimiter als Gruppe gemeint sind.
    reason: lexical_alternative
  - marker: c
    text: 'Die Drohung bedeutet wahrscheinlich: „Wir werden dein Haus niederbrennen, während du darin bist.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: Da wurden die Männer Efraims zusammengerufen
  rationale: Das singularische אִישׁ bezeichnet hier kollektiv die Efraimiter; das folgende וַיֹּאמְרוּ steht im Plural. Die Nifalform von צעק wird im Zusammenhang am besten als militärisches Zusammenrufen verstanden.
- source_word: וַיַּעֲבֹר
  choice: Sie zogen
  rationale: Obwohl die hebräische Verbform singularisch ist, bezieht sie sich auf das kollektive Subjekt und wird im Deutschen entsprechend im Plural wiedergegeben.
- source_word: צָפוֹנָה
  choice: nach Zafon
  rationale: Die Form wird im Haupttext als Ortsname verstanden; die ebenfalls mögliche Richtungsangabe „nach Norden“ bleibt in einer Fußnote erhalten.
- source_word: עָבַרְתָּ לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: bist du hinübergezogen, um gegen die Ammoniter zu kämpfen
  rationale: „Hinüberziehen“ bewahrt die Bewegungsaussage von עבר; „Ammoniter“ gibt בְּנֵי עַמּוֹן natürlich und präzise wieder.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: ohne uns zu rufen, damit wir mit dir gingen
  rationale: קרא bezeichnet hier den Aufruf zur Teilnahme am Feldzug. Die deutsche Formulierung gibt den Vorwurf flüssig wieder, ohne „rufen“ interpretierend zu „einladen“ abzuschwächen.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: Wir werden dein Haus über dir im Feuer verbrennen
  rationale: Die Formulierung hält das ungewöhnliche und drastische Bild des Hebräischen fest. Eine Fußnote erläutert die wahrscheinliche Bedeutung, ohne sie im Haupttext festzuschreiben.
