  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: de
  text: 'Dann sagten sie zu ihm: »Sag bitte ›Schibbolet‹[a].« Er aber sagte: »Sibbolet«, denn er war nicht imstande, es so auszusprechen. Da packten sie ihn und schlachteten ihn an den Furten des Jordan. Zu jener Zeit fielen 42.000 aus Ephraim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Schibbolet bedeutet wahrscheinlich »Ähre« oder »Wasserlauf/Flut«; hier wird das Wort jedoch als Ausspracheprobe verwendet.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Sag doch
  rationale: Der Imperativ mit נָא hat hier einen auffordernden, leicht höflichen Ton. »Sag doch« klingt im modernen Deutschen natürlich, ohne die Situation übermäßig höflich erscheinen zu lassen.
- source_word: שִׁבֹּלֶת
  choice: Schibbolet
  rationale: Das Wort dient hier als Ausspracheprobe; daher wird es transliteriert statt nach seiner möglichen lexikalischen Bedeutung übersetzt. Die deutsche Schreibung macht den entscheidenden sch-Laut hörbar.
- source_word: סִבֹּלֶת
  choice: Sibbolet
  rationale: Die Transliteration bewahrt den für die Erzählung entscheidenden Gegensatz zwischen dem anfänglichen sch- und s-Laut.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: denn er war nicht imstande, es so auszusprechen
  rationale: Wörtlich geht es darum, nicht dazu fähig beziehungsweise darauf eingestellt zu sein, »so zu sprechen«. Im Zusammenhang bezeichnet die Wendung die fehlende Fähigkeit, den verlangten Laut hervorzubringen.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: Da packten sie ihn
  rationale: אחז bezeichnet ein Ergreifen oder Festhalten. »Packten« gibt die unmittelbare gewaltsame Ergreifung natürlich und anschaulich wieder.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: schlachteten ihn
  rationale: שׁחט ist stärker und drastischer als ein allgemeines »töten«. »Schlachteten« bewahrt die Härte des hebräischen Ausdrucks.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: an den Furten des Jordan
  rationale: מַעְבְּרוֹת bezeichnet Übergangsstellen eines Flusses, hier präzise die Furten des Jordan.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: So fielen ... Mann aus Ephraim
  rationale: נפל bezeichnet in diesem kriegerischen Zusammenhang den Tod. »Aus Ephraim« bewahrt die Zugehörigkeitsformulierung des Hebräischen; »Mann« verdeutlicht idiomatisch, dass Menschen gezählt werden.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: '42.000'
  rationale: Die Zahl wird unverändert in moderner deutscher Zahlenschreibung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit bewusst drastischem »schlachteten«. Die Formen »Schibbolet« und »Sibbolet« machen den Ausspracheunterschied für deutschsprachige Leser unmittelbar erkennbar. Die direkte Rede verwendet deutsche Anführungszeichen und einfache Anführungszeichen für das zitierte Testwort.
