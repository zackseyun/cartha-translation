  text: Nach ihm richtete Abdon, der Piratoniter, Sohn Hillels, Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: richtete
  rationale: Das Verb שׁפט ist ein Leitwort des Richterbuchs. „Richtete“ bewahrt diesen Zusammenhang und lässt hier den weiteren Sinn des Regierens oder Führens offen.
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung bezeichnet die zeitliche beziehungsweise amtliche Nachfolge auf den zuvor genannten Richter.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: אֵת kennzeichnet das direkte Objekt und wird im Deutschen nicht eigens wiedergegeben.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Der Personenname wird in der etablierten deutschen Bibelschreibung wiedergegeben.
- source_word: בֶּן־הִלֵּל
  choice: der Sohn Hillels
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Abdons Abstammung; die gewählte Form ist natürliches, würdiges Deutsch.
- source_word: הַפִּרְעָתוֹנִי
  choice: aus Piraton
  rationale: Das Gentiliz bezeichnet einen Mann aus Piraton. Die Herkunftsangabe ist im modernen Deutsch verständlicher und gibt den sachlichen Gehalt präzise wieder.
