source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: de
  text: Als ich sah, dass du nicht zu Hilfe kamst, setzte ich mein Leben aufs Spiel[a] und zog gegen die Ammoniter. Da gab Jahwe sie in meine Hand. Warum seid ihr dann heute gegen mich heraufgezogen, um gegen mich zu kämpfen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich legte mein Leben in meine Hand« – eine hebräische Redewendung dafür, das eigene Leben zu riskieren.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Als ich sah
  rationale: Der Qal-Wayyiqtol von ראה leitet Jiftachs Wahrnehmung als Anlass seines folgenden Handelns ein; die temporale Wiedergabe ist im Deutschen natürlich.
- source_word: כִּי אֵינְךָ מוֹשִׁיעַ
  choice: dass du nicht zu Hilfe kamst
  rationale: מוֹשִׁיעַ bezeichnet hier militärische Rettung oder Beistand. Die Formulierung gibt die singularische Anrede wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt einzusetzen.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: setzte ich mein Leben aufs Spiel
  rationale: Die hebräische Wendung bedeutet, das eigene Leben einer unmittelbaren Gefahr auszusetzen. Eine wörtliche deutsche Wiedergabe mit »in die Hand« wäre leicht als selbstbestimmtes Handeln misszuverstehen.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: und zog gegen die Ammoniter
  rationale: עבר mit אֶל beschreibt im Kampfzusammenhang die Bewegung auf den Gegner zu. »zog gegen« gibt Richtung und feindliche Absicht natürlich wieder.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Dies ist die übliche deutsche Volksbezeichnung für die wörtlich genannten »Söhne Ammons«.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: Da gab Jahwe sie in meine Hand
  rationale: Die verbreitete Siegesformel und ihr Handbild bleiben erhalten; »da« markiert den erzählerischen Fortgang.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי
  choice: Warum seid ihr dann heute gegen mich heraufgezogen
  rationale: Die pluralische Anrede des Hebräischen wird gegenüber dem vorausgehenden Singular bewahrt. עלה bezeichnet hier ein feindliches Heraufziehen, was der folgende Zwecksatz bestätigt.
- source_word: לְהִלָּחֶם בִּי
  choice: um gegen mich zu kämpfen
  rationale: Der Niphal-Infinitiv von לחם mit ב bezeichnet den Kampf gegen eine Person; der deutsche Zwecksatz entspricht der syntaktischen Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel zwischen singularischer und pluralischer Anrede
  choice: »du« bei אֵינְךָ, danach »ihr« bei עֲלִיתֶם
  alternative: durchgehend »ihr«
  rationale: Der auffällige Numeruswechsel gehört zum hebräischen Text und kann die angesprochene Führungsperson beziehungsweise das Volk als Kollektiv gegenüber der ganzen Gruppe unterscheiden; er wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Haupttextfassung vermeidet die im Deutschen missverständliche wörtliche Hand-Metapher; diese bleibt in der Fußnote sichtbar. Der Wechsel von singularischer zu pluralischer Anrede wird entsprechend dem Ausgangstext bewahrt.
