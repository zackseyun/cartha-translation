base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: de
  text: Und Abdon, der Sohn Hillels, der Piratoniter, starb und wurde in Piraton begraben, im Land Ephraim, im Bergland der Amalekiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler: »im Bergland des Amalekiters«. Das Hebräische verwendet eine singularische Herkunftsbezeichnung, wahrscheinlich in kollektivem oder territorialem Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Verb מות bezeichnet hier unmittelbar den Tod; »starb« ist die klare, nicht beschönigende deutsche Entsprechung.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert.
- source_word: בֶּן הִלֵּל
  choice: der Sohn Hillels
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Abstammung. Der deutsche Genitiv gibt sie natürlich und präzise wieder.
- source_word: הַפִּרְעָתוֹנִי
  choice: der Piratoniter
  rationale: Das Gentiliz mit Artikel kennzeichnet Abdon nach seiner Herkunft aus Piraton; die substantivische Herkunftsbezeichnung bewahrt diese Form knapp.
- source_word: וַיִּקָּבֵר
  choice: wurde … begraben
  rationale: Der Nifal von קבר bezeichnet hier das passive Begrabenwerden. Die deutsche Passivform entspricht dem hebräischen Sinn.
- source_word: בְּפִרְעָתוֹן
  choice: in Piraton
  rationale: Die Präposition בְּ ist lokativ gebraucht; der Ortsname wird transliteriert.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: im Land Ephraim
  rationale: Die ausdrückliche Nennung von אֶרֶץ wird mit »Land« bewahrt, statt die Angabe auf »in Ephraim« zu verkürzen.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: im Bergland der Amalekiter
  rationale: הַר kann in geografischen Angaben ein Berg- oder Hügelland bezeichnen. Das morphologisch singularische Gentiliz wird wahrscheinlich kollektiv oder territorial gebraucht; die deutsche Mehrzahl vermittelt diesen wahrscheinlichen Sinn, während die formale Alternative in der Fußnote erhalten bleibt.
