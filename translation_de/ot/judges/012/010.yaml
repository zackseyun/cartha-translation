lexical_decisions:
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Waw-Konsekutiv führt die Erzählung zeitlich weiter. „Dann“ gibt diese Abfolge im modernen Deutsch natürlich wieder; מוּת bedeutet „sterben“.
- source_word: אִבְצָן
  choice: Ibzan
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: וַיִּקָּבֵר
  choice: wurde … begraben
  rationale: Die Nifal-Form bezeichnet hier einen passiven Vorgang. „Wurde begraben“ ist die klare und idiomatische deutsche Wiedergabe.
- source_word: בְּבֵית לָחֶם
  choice: in Bethlehem
  rationale: Die Präposition בְּ bezeichnet hier den Ort; der Ortsname wird in seiner geläufigen deutschen Form „Bethlehem“ wiedergegeben.
