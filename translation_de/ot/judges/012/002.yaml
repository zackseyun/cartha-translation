  - severity: low
    issue: Die Fußnote ist als wörtliche Wiedergabe zu bestimmt und bildet die hebräische Struktur nicht optimal ab.
    rationale: Die Wortfolge „mit den Ammonitern, sehr“ lässt die syntaktisch schwierige Stellung von מְאֹד nur ungenau erkennen. Eine mit „Wörtlich etwa“ eingeleitete, bewusst markierte Annäherung ist transparenter.
  revised_text: 'Jefta sagte zu ihnen[a]: „Mein Volk und ich waren in einen heftigen Konflikt mit den Ammonitern verwickelt. Ich rief euch um Hilfe, aber ihr habt mich nicht aus ihrer Hand gerettet.“'
