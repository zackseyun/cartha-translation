  to: 'Jefta sagte zu ihnen[a]: „Mein Volk und ich waren in einen heftigen Konflikt mit den Ammonitern verwickelt. Ich rief euch um Hilfe, aber ihr habt mich nicht aus ihrer Hand gerettet.“'
