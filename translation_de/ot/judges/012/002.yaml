  verdict: revise
  source_fidelity: 'Der Haupttext gibt die Aussage insgesamt zuverlässig wieder: Jefta und sein Volk standen mit den Ammonitern in einem stark intensivierten Streit/Konflikt; er rief die Ephraimiter um Hilfe, doch sie retteten ihn nicht aus der Gewalt der Ammoniter. „Aus ihrer Hand“ bewahrt zutreffend das hebräische Bild מִיָּדָם. Die Hilfskomponente von זעק ist im Kontext angemessen expliziert.'
  naturalness: „Ich und mein Volk lagen in heftigem Kampf“ ist im modernen Standarddeutsch weniger idiomatisch; besonders „in Kampf liegen“ wirkt hier unüblich. „Mein Volk und ich waren in einen heftigen Konflikt ... verwickelt“ ist natürlich, behält den nicht näher bestimmten Charakter von רִיב besser bei als das stärker militärische „Kampf“ und wahrt die Intensivierung durch מְאֹד.
  terminology: „Jefta“, „Ammoniter“, „Volk“ und „retteten“ sind angemessene moderne deutsche Wiedergaben. Die Fußnote sollte die hebräische Nominalform und die ungewohnte Wortstellung als annähernd wörtlich kennzeichnen, statt eine scheinbar glatte, aber strukturell verschobene Literalübersetzung zu bieten.
