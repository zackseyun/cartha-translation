  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ אֲלֵי/הֶ֔ם אִ֣ישׁ רִ֗יב הָיִ֛יתִי אֲנִ֛י וְ/עַמִּ֥/י וּ/בְנֵֽי עַמּ֖וֹן מְאֹ֑ד וָ/אֶזְעַ֣ק אֶתְ/כֶ֔ם וְ/לֹֽא הוֹשַׁעְתֶּ֥ם אוֹתִ֖/י מִ/יָּדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: de
  text: 'Jefta sagte zu ihnen[a]: „Mein Volk und ich waren in einen heftigen Konflikt mit den Ammonitern verwickelt. Ich rief euch um Hilfe, aber ihr habt mich nicht aus ihrer Hand gerettet.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ein Mann des Streites war ich, ich und mein Volk, mit den Ammonitern sehr.“'
    reason: Die Fußnote dokumentiert die hebräische Nominalform אִישׁ רִיב sowie die ungewöhnliche Stellung der Verstärkung מְאֹד, die im deutschen Haupttext idiomatisch wiedergegeben wird.
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: lagen in heftigem Kampf
  rationale: Die wörtliche Wendung „ein Mann des Streites“ beschreibt mit הָיִיתִי Jeftas Lage und nicht notwendig seinen Charakter. „In heftigem Kampf liegen“ gibt den konflikthaften Sinn von רִיב und die Verstärkung durch מְאֹד in natürlichem Deutsch wieder.
- source_word: וְעַמִּי
  choice: und mein Volk
  rationale: עַם bezeichnet gewöhnlich das Volk beziehungsweise die Jefta zugehörige Gemeinschaft; eine Verengung auf „Heer“ ist nicht erforderlich.
- source_word: וּבְנֵי עַמּוֹן
  choice: mit den Ammonitern
  rationale: „Ammoniter“ ist die übliche deutsche Wiedergabe des Volksnamens בְּנֵי עַמּוֹן.
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: Ich rief euch um Hilfe
  rationale: זעק bezeichnet hier einen Hilferuf. Die Ergänzung „um Hilfe“ macht den im Zusammenhang gemeinten Zweck auf Deutsch klar, ohne ihn auf eine bestimmte Form militärischer Unterstützung einzuengen.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: aber ihr habt mich nicht ... gerettet
  rationale: Der Hifil von ישׁע bedeutet retten oder befreien. „Retten“ ist im militärischen Zusammenhang direkt verständlich und vermeidet eine unnötige theologische Einengung.
- source_word: מִיָּדָם
  choice: aus ihrer Hand
  rationale: Die Wiedergabe bewahrt das hebräische Bild für Gewalt und Verfügungsbereich; im Deutschen ist die Wendung in gehobenem biblischem Erzählstil verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und kräftig; „aus ihrer Hand“ bewahrt bewusst das hebräische Bild, während die schwer verständliche Konstruktion אִישׁ רִיב im Haupttext idiomatisch formuliert und in der Fußnote formal dokumentiert wird.
