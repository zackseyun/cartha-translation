  text: וַ/יָּ֤שָׁב מִ/יָּמִים֙ לְ/קַחְתָּ֔/הּ וַ/יָּ֣סַר לִ/רְא֔וֹת אֵ֖ת מַפֶּ֣לֶת הָ/אַרְיֵ֑ה וְ/הִנֵּ֨ה עֲדַ֧ת דְּבוֹרִ֛ים בִּ/גְוִיַּ֥ת הָ/אַרְיֵ֖ה וּ/דְבָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: de
  text: Nach einiger Zeit kehrte er zurück, um sie zu heiraten. Er bog vom Weg ab, um sich den Kadaver des Löwen anzusehen. Da war ein Bienenschwarm im Leib des Löwen und Honig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַחְתָּהּ
  choice: um sie zu heiraten
  rationale: Wörtlich »um sie zu nehmen«; im Zusammenhang bezeichnet die Wendung die Heimholung beziehungsweise Eheschließung und wird im heutigen Deutsch so verständlich wiedergegeben.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: den Kadaver des Löwen
  rationale: מַפֶּלֶת bezeichnet hier den hingestreckten, verendeten Körper; »Kadaver« gibt den konkreten Sinn natürlich wieder.
- source_word: עֲדַת דְּבוֹרִים
  choice: ein Bienenschwarm
  rationale: עֵדָה bedeutet eine Ansammlung oder Gemeinschaft; bei Bienen ist »Schwarm« die idiomatische deutsche Bezeichnung.
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: im Leib des Löwen
  rationale: גְּוִיָּה kann Körper oder Leichnam bedeuten. »Leib« bewahrt die körperliche Vorstellung, ohne die unmittelbar zuvor verwendete Wiedergabe »Kadaver« zu wiederholen.
- source_word: וּדְבָשׁ
  choice: und Honig
  rationale: Die knappe hebräische Nominalfügung wird bewusst beibehalten; aus dem Kontext ergibt sich, dass sich dort auch Honig befand.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erzählerische Abfolge bleibt klar und knapp; das hebräische וְהִנֵּה wird mit dem anschaulichen »Da war« wiedergegeben.
