  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Wiederholung von נגד wird wegen unterschiedlicher deutscher Idiomatik mit „sagte“ und „verriet“ wiedergegeben. Die semantische Spannung zwischen dem bloßen Weinen und seiner bedrängenden Wirkung bleibt durch Haupttext und Fußnote erhalten.
