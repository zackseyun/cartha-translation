base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: de
  text: Sie weinte sieben Tage lang bei ihm[a], während sie das Fest feierten. Am siebten Tag sagte er es ihr, weil sie ihn bedrängte. Darauf verriet sie das Rätsel den Männern ihres Volkes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die hebräische Wendung etwa: „Sie weinte auf/über ihm.“ Sie beschreibt ihr anhaltendes, auf ihn gerichtetes Weinen und kann im Zusammenhang auch den Druck andeuten, den sie dadurch auf ihn ausübte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Söhnen ihres Volkes“; gemeint sind hier wohl die Männer aus ihrem eigenen Volk, im unmittelbaren Zusammenhang vermutlich die philistäischen Festbegleiter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: Sie weinte vor ihm
  rationale: בכה bedeutet „weinen“; עַל mit Suffix richtet ihr Weinen auf Simson und lässt an anhaltenden emotionalen Druck denken. „Vor ihm weinen“ ist im Deutschen natürlich; die ungewöhnlichere hebräische Wendung und ihre Druckwirkung werden in der Fußnote kenntlich gemacht.
- source_word: שִׁבְעַת הַיָּמִים
  choice: während der sieben Tage
  rationale: Die bestimmte Zeitangabe bezeichnet die ganze siebentägige Festzeit. Die temporale Formulierung ist im Deutschen klar und bewahrt die zeitliche Bestimmtheit.
- source_word: אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: an denen sie das Fest feierten
  rationale: מִשְׁתֶּה bezeichnet ein Festmahl beziehungsweise Trink- oder Hochzeitsfest. Die Wiedergabe bleibt allgemein genug und ergibt einen natürlichen deutschen Relativsatz.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Die Formel führt hier vor allem die Erzählung zeitlich weiter; eine ausdrückliche Wiedergabe von וַיְהִי als „es geschah“ ist im Deutschen nicht erforderlich.
- source_word: וַיַּגֶּד לָהּ
  choice: sagte er es ihr
  rationale: נגד bedeutet „mitteilen, kundtun“. Das deutsche Pronomen „es“ nimmt den aus dem Zusammenhang bekannten Inhalt auf, ohne ihn ausdrücklich als Lösung auszudeuten.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: weil sie ihn so sehr bedrängt hatte
  rationale: Die Hifilform von צוק bezeichnet starken, anhaltenden Druck. „Bedrängen“ gibt sowohl die Beharrlichkeit als auch den Zwang natürlich wieder.
- source_word: וַתַּגֵּד הַחִידָה
  choice: Darauf verriet sie das Rätsel
  rationale: נגד wird erneut für das Bekanntmachen gebraucht. „Das Rätsel verraten“ ist im Deutschen idiomatisch und lässt im Kontext erkennen, dass sein Geheimnis beziehungsweise seine Lösung weitergegeben wurde, ohne den hebräischen Gegenstand durch „Lösung“ zu ersetzen.
- source_word: לִבְנֵי עַמָּהּ
  choice: den Männern ihres Volkes
  rationale: Wörtlich steht „den Söhnen ihres Volkes“. Im Kontext sind die männlichen Angehörigen ihres eigenen Volkes gemeint; „Männer“ gibt die geschlechtliche Referenz natürlich wieder.
