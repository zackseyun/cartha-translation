  naturalness: Der Text ist insgesamt natürliches modernes Standarddeutsch. „Sie weinte sieben Tage lang bei ihm“ ist idiomatisch und verbindet die räumlich-gerichtete Aussage mit dem Kontext des anhaltenden Bedrängens besser als „vor ihm während der sieben Tage“.
  terminology: „Fest“, „bedrängte“, „Rätsel“ und „Männer ihres Volkes“ sind angemessen. „Verriet sie das Rätsel“ ist im Kontext idiomatisch und lässt offen, ob das Rätsel selbst oder dessen Lösung mitgeteilt wurde; diese im hebräischen Ausdruck angelegte Kontexterschließung wird nicht unnötig präzisiert.
