revisions:
- from: Sie weinte vor ihm[a] während der sieben Tage, an denen sie das Fest feierten. Am siebten Tag sagte er es ihr, weil sie ihn so sehr bedrängt hatte. Darauf verriet sie das Rätsel den Männern ihres Volkes[b].
  to: Sie weinte sieben Tage lang bei ihm[a], während sie das Fest feierten. Am siebten Tag sagte er es ihr, weil sie ihn bedrängte. Darauf verriet sie das Rätsel den Männern ihres Volkes[b].
  rationale: Die Revision ersetzt die räumlich neutrale Formulierung „vor ihm“ durch „bei ihm“, ordnet die Zeitangabe natürlicher an und korrigiert die wörtliche Erläuterung in Fußnote a. Das Präteritum „bedrängte“ bildet den im Erzählzusammenhang andauernden Druck idiomatisch ab, ohne gegenüber dem hebräischen Perfekt eine unnötig starke Vorzeitigkeit zu behaupten. Inhalt, Ambiguitäten und die Fußnotenanker bleiben erhalten.
