base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: de
  text: 'Da ging er hinauf und berichtete seinem Vater und seiner Mutter davon. Er sagte: „Ich habe in Timna eine Frau gesehen, eine der Töchter der Philister. Holt sie mir nun zur Frau.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Da ging er hinauf
  rationale: עלה bezeichnet wörtlich das Hinaufgehen. Die Formulierung bewahrt die mögliche topografische Bedeutung, ohne sie näher auszudeuten.
- source_word: וַיַּגֵּד
  choice: berichtete … davon
  rationale: נגד im Hifil bedeutet „mitteilen, berichten“. „Davon berichten“ ist im Deutschen natürlich und leitet die anschließende direkte Rede gut ein.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: seinem Vater und seiner Mutter
  rationale: Die beiden Possessivbezüge werden im Deutschen ausdrücklich wiedergegeben.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Da die Heirat erst anschließend verlangt wird, passt hier „Frau“.
- source_word: רָאִיתִי
  choice: Ich habe … gesehen
  rationale: Das deutsche Perfekt gibt in direkter Rede natürlich eine zurückliegende Wahrnehmung wieder.
- source_word: בְתִמְנָתָה
  choice: in Timna
  rationale: Die Ortsangabe wird im modernen Deutschen idiomatisch mit „in“ wiedergegeben.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: eine von den Töchtern der Philister
  rationale: Die Formulierung wahrt sowohl den partitiven Sinn von מִן als auch das hebräische Familienbild „Töchter der Philister“.
- source_word: וְעַתָּה
  choice: nun
  rationale: „Nun“ markiert knapp den Übergang von der Mitteilung zur daraus folgenden Aufforderung.
- source_word: קְחוּ אוֹתָהּ לִּי לְאִשָּׁה
  choice: Holt sie mir … zur Frau
  rationale: Der Plural richtet sich an beide Eltern. „Jemandem eine Frau holen“ gibt den Zusammenhang einer von den Eltern zu vermittelnden Eheschließung natürlich wieder; „zur Frau“ bewahrt den Zweck der Bitte.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte und fordernde Rede Simsons bleibt erhalten; die verwandtschaftliche Wendung „Töchter der Philister“ wird nicht zu „Philisterinnen“ eingeebnet.
