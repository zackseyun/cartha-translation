  text: וַ/יֵּ֖רֶד וַ/יְדַבֵּ֣ר לָ/אִשָּׁ֑ה וַ/תִּישַׁ֖ר בְּ/עֵינֵ֥י שִׁמְשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: de
  text: Dann ging er hinab und sprach mit der Frau, und sie war recht in Simsons Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder natürlicher: „sie gefiel Simson“ oder „sie erschien Simson passend“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Dann ging er hinab
  rationale: ירד bezeichnet ein Hinabgehen. „ging … hinab“ bewahrt die geografische Bewegung nach Timna; „Dann“ gibt die hebräische Erzählfolge natürlich wieder.
- source_word: וַיְדַבֵּר לָאִשָּׁה
  choice: sprach mit der Frau
  rationale: דבר mit ל bezeichnet hier das Sprechen mit bzw. zu jemandem. Im Deutschen ist „sprach mit der Frau“ natürlich und lässt eine Begegnung erkennen, ohne einen längeren Dialog vorauszusetzen.
- source_word: לָאִשָּׁה
  choice: der Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Da die Heirat noch nicht erfolgt ist, vermeidet „Frau“ eine verfrühte Festlegung.
- source_word: וַתִּישַׁר
  choice: sie war recht
  rationale: Die Form von ישר bezeichnet hier eine positive Beurteilung als recht, passend oder gefällig. Die bewusst etwas markante Formulierung bewahrt die Verbindung zum folgenden Augen-Idiom.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: in Simsons Augen
  rationale: Die hebräische Wendung bezeichnet Simsons persönliche Einschätzung. Ihre bildhafte Wiedergabe erhält einen möglichen literarischen Anklang an das Motiv dessen, was in den eigenen Augen recht ist.
theological_decisions:
- issue: Möglicher thematischer Anklang an das Richter-Motiv dessen, was in den eigenen Augen recht ist
  choice: „sie war recht in Simsons Augen“ im Haupttext beibehalten
  alternative: „sie gefiel Simson“ oder „sie erschien Simson passend“
  rationale: Die wörtlichkeitsnahe Wendung bewahrt die mögliche literarisch-theologische Spannung, ohne zu behaupten, dass Simsons Urteil tatsächlich moralisch richtig gewesen sei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichere Wendung „recht in Simsons Augen“ ist bewusst beibehalten, um das hebräische Bild und seinen möglichen Zusammenhang mit einem Leitmotiv des Richterbuches zu erhalten; die Fußnote bietet idiomatischere Lesarten.
