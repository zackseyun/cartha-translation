source:
  edition: WLC
  text: וַ/יֵּ֥רֶד שִׁמְשׁ֖וֹן תִּמְנָ֑תָ/ה וַ/יַּ֥רְא אִשָּׁ֛ה בְּ/תִמְנָ֖תָ/ה מִ/בְּנ֥וֹת פְּלִשְׁתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: de
  text: Dann ging Simson nach Timna hinab. Dort sah er eine Frau aus den Reihen der Philisterinnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: von den Töchtern der Philister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ging … hinab
  rationale: Das Verb ירד bedeutet wörtlich „hinabgehen“. Die Wiedergabe bewahrt die topografische Erzählweise des Hebräischen und klingt im Deutschen natürlich.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: תִּמְנָתָה
  choice: nach Timna
  rationale: Das angehängte Richtungs-he bezeichnet eine Bewegung auf den Ort zu; „nach Timna“ ist die natürliche deutsche Wiedergabe.
- source_word: וַיַּרְא
  choice: sah er
  rationale: ראה ist das gewöhnliche Verb für „sehen“. Die schlichte Wiedergabe fügt der Wahrnehmung keine Deutung hinzu.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אשה kann je nach Kontext „Frau“ oder „Ehefrau“ bedeuten. Da Simson sie hier erst sieht und eine Heirat erst später anstrebt, ist „eine Frau“ sachlich und unbelastet.
- source_word: בְּתִמְנָתָה
  choice: dort
  rationale: Die Ortsangabe „in Timna“ wird durch „dort“ aufgenommen. So wird die unmittelbare Wiederholung im Deutschen vermieden, ohne Information zu verlieren.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: aus den Reihen der Philisterinnen
  rationale: Die hebräische Wendung lautet wörtlich „von den Töchtern der Philister“. Die gewählte Form gibt die Zugehörigkeit zu den philistäischen Frauen idiomatisch wieder; die wörtlichere Familienbezeichnung bleibt in der Fußnote erhalten.
