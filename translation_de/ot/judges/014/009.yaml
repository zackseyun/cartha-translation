base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: de
  text: Er schöpfte den Honig in seine Hände[a] und ging weiter, während er davon aß. Dann ging er zu seinem Vater und seiner Mutter und gab ihnen etwas davon, und sie aßen. Aber er sagte ihnen nicht, dass er den Honig aus dem Kadaver des Löwen geschöpft hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er nahm ihn heraus“; das hebräische Verb bezeichnet hier das Herausnehmen des Honigs aus dem Inneren des Kadavers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: Er schabte den Honig
  rationale: רדה bezeichnet hier das Herausnehmen des Honigs aus dem Löwenkadaver. „schabte“ gibt die konkrete Handbewegung anschaulich wieder; das im Hebräischen pronominal ausgedrückte Objekt wird zur Klarheit als „den Honig“ benannt.
- source_word: אֶל כַּפָּיו
  choice: in seine Hände
  rationale: כַּף kann „Handfläche“ oder „Hand“ bedeuten. „in seine Hände“ ist im Deutschen natürlich und bewahrt das Bild des aufgenommenen Honigs.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: ging weiter, wobei er unterwegs davon aß
  rationale: Die Verbindung aus finitem Verb und Infinitivformen schildert eine fortgesetzte, begleitende Handlung. Die Wiedergabe macht deutlich, dass Simson während des Weitergehens aß.
- source_word: וַיִּתֵּן לָהֶם
  choice: gab ihnen etwas davon
  rationale: Das Objekt ist aus dem Zusammenhang als ein Teil des Honigs zu ergänzen. „etwas davon“ ist idiomatisch und macht den impliziten partitiven Sinn transparent.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: Aber er sagte ihnen nicht
  rationale: נגד im Hifil bedeutet „mitteilen, sagen“. „Aber“ bringt den sachlichen Kontrast zum Weitergeben und Essen des Honigs natürlich zum Ausdruck.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: aus dem Kadaver des Löwen
  rationale: גְּוִיָּה bezeichnet den leblosen Körper. Bei einem Tier ist „Kadaver“ präzise und bewahrt die drastische Konkretheit des Ausgangstextes.
- source_word: רָדָה הַדְּבָשׁ
  choice: den Honig … geschabt hatte
  rationale: Die Wiederholung von רדה wird entsprechend der ersten Verwendung wiedergegeben. Das Plusquamperfekt passt zur rückblickenden Begründung mit כִּי.
theological_decisions:
- issue: Mögliche kultische Bedeutung der Berührung des Löwenkadavers
  choice: Keine Deutung in den Vers eingefügt
  alternative: Die Handlung ausdrücklich als Verunreinigung oder Gesetzesübertretung bezeichnen
  rationale: Der Vers berichtet das Entnehmen und Verschweigen des Honigs, bewertet die Handlung hier aber nicht ausdrücklich. Eine theologische Folgerung soll nicht in den Text importiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. „Kadaver“ erhält die konkrete und unangenehme Bildwirkung des Hebräischen; „wobei er unterwegs davon aß“ bildet den fortlaufenden Charakter der Handlung natürlich ab.
