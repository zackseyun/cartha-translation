  to: Er schöpfte den Honig in seine Hände[a] und ging weiter, während er davon aß. Dann ging er zu seinem Vater und seiner Mutter und gab ihnen etwas davon, und sie aßen. Aber er sagte ihnen nicht, dass er den Honig aus dem Kadaver des Löwen geschöpft hatte.
