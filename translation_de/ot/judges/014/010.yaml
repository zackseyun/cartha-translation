  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Elemente des Hebräischen zuverlässig wieder: das Hinabgehen des Vaters Simsons zur Frau, Simsons Ausrichten eines מִשְׁתֶּה an diesem Ort und die abschließende Begründung als Brauch junger Männer. „Pflegten ... zu tun“ macht den gewohnheitsmäßigen Sinn des Imperfekts angemessen sichtbar, ohne mehr zu behaupten als der Text hergibt.'
