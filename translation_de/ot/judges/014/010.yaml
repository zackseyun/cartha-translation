source:
  edition: WLC
  text: וַ/יֵּ֥רֶד אָבִ֖י/הוּ אֶל הָ/אִשָּׁ֑ה וַ/יַּ֨עַשׂ שָׁ֤ם שִׁמְשׁוֹן֙ מִשְׁתֶּ֔ה כִּ֛י כֵּ֥ן יַעֲשׂ֖וּ הַ/בַּחוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: de
  text: Da ging sein Vater zu der Frau hinab, und Simson veranstaltete dort ein Fest[a], denn so pflegten es die jungen Männer zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Festmahl“ beziehungsweise „ein Trinkfest“. Das hebräische Wort מִשְׁתֶּה bezeichnet häufig ein festliches Mahl, zu dem auch das Trinken gehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ging ... hinab
  rationale: Bewahrt die konkrete Richtungsangabe des Verbs ירד und entspricht dem üblichen erzählerischen Sprachgebrauch.
- source_word: אָבִיהוּ
  choice: sein Vater
  rationale: Das maskuline Suffix der 3. Person Singular bezieht sich im Kontext auf Simson.
- source_word: אֶל הָאִשָּׁה
  choice: zu der Frau
  rationale: Gibt die bestimmte Nominalgruppe wörtlich wieder, ohne sie ausdrücklich als Braut oder Ehefrau zu bestimmen.
- source_word: וַיַּעַשׂ
  choice: veranstaltete
  rationale: In Verbindung mit מִשְׁתֶּה bezeichnet עשה idiomatisch das Ausrichten beziehungsweise Veranstalten eines Festes.
- source_word: שָׁם
  choice: dort
  rationale: Natürliche deutsche Entsprechung des Ortsadverbs.
- source_word: מִשְׁתֶּה
  choice: ein Fest
  rationale: Bezeichnet ein festliches Mahl, bei dem gewöhnlich auch getrunken wurde; „Fest“ ist verständlich und legt den Trinkaspekt nicht stärker fest als der Kontext.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: denn so pflegten es ... zu tun
  rationale: Der Imperfekt beschreibt hier einen Brauch; die Formulierung macht den gewohnheitsmäßigen Charakter im Deutschen deutlich.
- source_word: הַבַּחוּרִים
  choice: die jungen Männer
  rationale: בָּחוּר bezeichnet gewöhnlich einen jungen Mann im heiratsfähigen oder kräftigen Alter; die neutrale Wiedergabe vermeidet die engere Deutung „Junggesellen“.
theological_decisions: []
