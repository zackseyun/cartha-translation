  text: וַ/יְהִ֖י כִּ/רְאוֹתָ֣/ם אוֹת֑/וֹ וַ/יִּקְחוּ֙ שְׁלֹשִׁ֣ים מֵֽרֵעִ֔ים וַ/יִּהְי֖וּ אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: de
  text: Als sie ihn sahen, holten sie dreißig Gefährten[a], und sie waren bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Freunde“; möglicherweise sind speziell Hochzeitsbegleiter gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם
  choice: Als sie … sahen
  rationale: Die Konstruktion aus וַיְהִי und כ mit dem Infinitiv von ראה leitet hier einen zeitlichen Nebensatz in der Erzählung ein. Im Deutschen gibt „Als sie … sahen“ den Sinn natürlich wieder, ohne die hebräische Einleitungsformel unnötig wörtlich abzubilden.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das direkte Objekt bezieht sich im Kontext auf Simson.
- source_word: וַיִּקְחוּ
  choice: holten sie
  rationale: לקח bedeutet grundsätzlich „nehmen“. Da Personen herangezogen werden, um bei Simson zu sein, ist „holten“ im Deutschen natürlicher als „nahmen“, ohne die mögliche Auswahl oder Bestellung näher festzulegen.
- source_word: שְׁלֹשִׁים
  choice: dreißig
  rationale: Die Kardinalzahl wird unmittelbar wiedergegeben.
- source_word: מֵרֵעִים
  choice: Gefährten
  rationale: Das Substantiv bezeichnet Gefährten oder Freunde. „Gefährten“ wahrt die allgemeine relationale Bedeutung und legt keine bestimmte zeremonielle Funktion fest.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: die bei ihm sein sollten
  rationale: Wörtlich heißt die Wendung „und sie waren bei ihm“. Als deutscher Relativsatz macht sie den Zweck ihres Heranholens verständlich und bleibt nahe an der einfachen Aussage des Hebräischen.
theological_decisions: []
translation_notes:
