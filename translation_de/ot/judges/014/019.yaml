revisions:
- from: Da kam der Geist Jahwes mit Macht über ihn. Er ging nach Aschkelon hinab, erschlug von ihnen dreißig Männer, nahm ihnen ihre Gewänder ab[a] und gab die Kleider zum Wechseln denen, die das Rätsel beantwortet hatten. Sein Zorn entbrannte, und er ging hinauf in das Haus seines Vaters.
  to: Da kam der Geist Jahwes mit Macht über ihn. Er ging nach Aschkelon hinab, erschlug dreißig von ihnen, nahm ihre Gewänder[a] und gab die Wechselkleider denen, die das Rätsel beantwortet hatten. Sein Zorn entbrannte, und er ging hinauf in das Haus seines Vaters.
  rationale: Die Revision beseitigt die unidiomatische Stellung von „von ihnen“, ohne die partitive Nuance des Hebräischen aufzugeben. Zugleich wird die Formulierung zu den Gewändern auf den Wortlaut konzentriert; die mögliche Bedeutung als von den Getöteten abgenommene Beutekleidung bleibt sachgerecht in der Fußnote vermerkt.
