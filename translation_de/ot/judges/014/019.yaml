base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: de
  text: Da kam der Geist Jahwes mit Macht über ihn. Er ging nach Aschkelon hinab, erschlug dreißig von ihnen, nahm ihre Gewänder[a] und gab die Wechselkleider denen, die das Rätsel beantwortet hatten. Sein Zorn entbrannte, und er ging hinauf in das Haus seines Vaters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann besonders Kleider bezeichnen, die den Erschlagenen abgenommen und als Beute mitgeführt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Da kam der Geist Jahwes mit Macht über ihn
  rationale: צלח mit dem Geist Jahwes bezeichnet hier ein plötzliches, kraftvolles Ergreifen bzw. Befähigen. „Kam ... mit Macht über ihn“ gibt die Intensität idiomatisch wieder, ohne eine moralische Bewertung von Simsons anschließender Tat hinzuzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift des göttlichen Eigennamens bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: Er ging nach Aschkelon hinab
  rationale: „Hinabgehen“ wahrt die Richtungsangabe von ירד und klingt im deutschen Erzählstil natürlich.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: erschlug von ihnen dreißig Männer
  rationale: נכה bezeichnet im Kontext tödliches Schlagen; „erschlug“ macht dies eindeutig. „Von ihnen“ bewahrt die partitive Bedeutung von מֵהֶם.
- source_word: חֲלִיצוֹתָם
  choice: nahm ihnen ihre Gewänder ab
  rationale: Die Formulierung lässt erkennen, dass die Kleider den Erschlagenen abgenommen wurden, ohne den im Kontext naheliegenden Beutecharakter als ausdrücklich im Nomen enthalten auszugeben.
- source_word: הַחֲלִיפוֹת
  choice: die Kleider zum Wechseln
  rationale: חליפות bezeichnet hier die beim Rätsel zugesagten Wechselkleider beziehungsweise Kleidungssets. Die gewählte Form ist verständlicher als das heute ungebräuchliche „Wechselgewänder“.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: denen, die das Rätsel beantwortet hatten
  rationale: נגד meint hier das Kundtun der Lösung. „Beantwortet“ gibt die Funktion im Zusammenhang natürlich wieder, ohne ein ausführliches Erklären vorauszusetzen.
- source_word: וַיִּחַר אַפּוֹ
  choice: Sein Zorn entbrannte
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des brennenden Zorns und entspricht einem würdigen modernen Erzählregister.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: er ging hinauf in das Haus seines Vaters
  rationale: „Ging hinauf“ bewahrt עלה; „in das Haus“ gibt das richtungsbezogene Ziel ohne ein im Hebräischen nicht ausdrücklich stehendes „zurück“ wieder.
theological_decisions:
- issue: Göttliche Befähigung und Simsons anschließende Gewalttat
  choice: Der Geist Jahwes kam mit Macht über ihn
  alternative: Der Geist Jahwes trieb ihn an
  rationale: Die Übersetzung stellt wie der hebräische Text die göttliche Machteinwirkung fest, deutet sie jedoch weder als ausdrückliche Billigung jedes Einzelaspekts der folgenden Tat noch schwächt sie den erzählten Zusammenhang ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer narrativer Syntax. Der Fußnotenmarker steht unmittelbar bei „Gewänder“, da sich die lexikalische Anmerkung auf חֲלִיצוֹתָם bezieht.
