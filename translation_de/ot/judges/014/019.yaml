    issue: Unnatürliche Stellung der partitiven Ergänzung
    rationale: „erschlug von ihnen dreißig Männer“ ist im modernen Deutschen holprig. „erschlug dreißig von ihnen“ bewahrt מֵהֶם ebenso, ist aber idiomatisch.
