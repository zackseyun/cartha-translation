  terminology: „Simson“, „Rätsel“, „Söhne meines Volkes“ und die Fußnote sind terminologisch stimmig. „verraten“ legt stärker als das hebräische נגד nahe, dass ein Geheimnis preisgegeben wird; „gesagt“ bildet das allgemeine hebräische Verb neutraler ab.
