  text: וַ/תֵּבְךְּ֩ אֵ֨שֶׁת שִׁמְשׁ֜וֹן עָלָ֗י/ו וַ/תֹּ֨אמֶר֙ רַק שְׂנֵאתַ֨/נִי֙ וְ/לֹ֣א אֲהַבְתָּ֔/נִי הַֽ/חִידָ֥ה חַ֨דְתָּ֙ לִ/בְנֵ֣י עַמִּ֔/י וְ/לִ֖/י לֹ֣א הִגַּ֑דְתָּה וַ/יֹּ֣אמֶר לָ֗/הּ הִנֵּ֨ה לְ/אָבִ֧/י וּ/לְ/אִמִּ֛/י לֹ֥א הִגַּ֖דְתִּי וְ/לָ֥/ךְ אַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: de
  text: 'Da weinte Simsons Frau vor ihm und sagte: »Du hasst mich nur und liebst mich nicht! Du hast den Söhnen meines Volkes[a] das Rätsel aufgegeben, aber mir hast du es nicht gesagt.« Er sagte zu ihr: »Sieh doch, meinem Vater und meiner Mutter habe ich es nicht gesagt – und dir sollte ich es sagen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Söhnen meines Volkes«. Gemeint sind hier wahrscheinlich die Männer ihres Volkes.'
    reason: Die wörtliche maskuline Form wird im Text bewahrt; die Fußnote erläutert ihren wahrscheinlichen Bezug im erzählerischen Zusammenhang.
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: weinte ... vor ihm
  rationale: בכה bedeutet „weinen“. עַל mit einer Person bezeichnet hier am ehesten das Weinen vor beziehungsweise im Beisein der Person, vermutlich auch als emotionalen Druck; „vor ihm“ bleibt natürlich und vermeidet das missverständliche „über ihn“.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: Simsons Frau
  rationale: Die Constructusverbindung bezeichnet eindeutig die Ehefrau Simsons; „Simsons Frau“ ist natürliches modernes Deutsch.
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: Du hasst mich nur und liebst mich nicht!
  rationale: „nur“ gibt die zuspitzende Funktion von רַק wieder. Der direkte Gegensatz von „hassen“ und „lieben“ bleibt erhalten.
- source_word: הַחִידָה חַדְתָּ
  choice: Du hast ... das Rätsel aufgegeben
  rationale: חִידָה ist in diesem Zusammenhang ein Rätsel; חוד bezeichnet das Stellen oder Aufgeben dieses Rätsels. Die deutsche Verbindung „ein Rätsel aufgeben“ ist idiomatisch.
- source_word: לִבְנֵי עַמִּי
  choice: den Söhnen meines Volkes
  rationale: Die Formulierung bewahrt das ausdrücklich maskuline בְּנֵי („Söhne“). Im Kontext sind wahrscheinlich die Männer ihres Volkes beziehungsweise die männlichen Hochzeitsgefährten gemeint.
- source_word: לֹא הִגַּדְתָּה / לֹא הִגַּדְתִּי / אַגִּיד
  choice: die Lösung nicht verraten / die Lösung verraten
  rationale: נגד im Hifil bedeutet „mitteilen, bekannt machen“. Da nicht der Wortlaut des Rätsels, sondern seine Lösung geheim gehalten wird, macht „die Lösung verraten“ den im Deutschen erforderlichen Bezug klar, ohne den Sinn zu verändern.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: „Sieh doch“ gibt den aufmerksamkeitslenkenden und nachdrücklichen Gesprächswert von הִנֵּה in natürlichem modernem Deutsch wieder.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: nicht einmal meinem Vater und meiner Mutter habe ich die Lösung verraten
  rationale: „nicht einmal“ verdeutlicht die im Kontext angelegte Steigerung. Beide Elternteile werden entsprechend dem Hebräischen ausdrücklich genannt.
- source_word: וְלָךְ אַגִּיד
  choice: und dir sollte ich sie verraten?
  rationale: Der Imperfekt steht hier als rhetorische Frage. „sollte ich“ bewahrt den fragenden, zurückweisenden Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges und gut verständliches Standarddeutsch. Der emotionale Vorwurf klingt direkt, ohne umgangssprachlich zu werden. Die Wiederholung von „die Lösung verraten“ schafft im Deutschen einen eindeutigen Bezug und entspricht dem Sinn des hebräischen Dialogs.
