source:
  edition: WLC
  text: וַ/יֵּ֧רֶד שִׁמְשׁ֛וֹן וְ/אָבִ֥י/ו וְ/אִמּ֖/וֹ תִּמְנָ֑תָ/ה וַ/יָּבֹ֨אוּ֙ עַד כַּרְמֵ֣י תִמְנָ֔תָ/ה וְ/הִנֵּה֙ כְּפִ֣יר אֲרָי֔וֹת שֹׁאֵ֖ג לִ/קְרָאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: de
  text: Da ging Simson mit seinem Vater und seiner Mutter nach Timna hinab. Sie kamen bis zu den Weinbergen von Timna. Da kam ihm plötzlich ein junger Löwe[a] brüllend entgegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen eine ungewöhnliche Verbindung, etwa „ein Junglöwe von Löwen“; gemeint ist ein junger Löwe.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ein junger Löwe brüllte ihm entgegen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ging … hinab
  rationale: Das Verb ירד bezeichnet ein Hinabgehen. Die Formulierung bewahrt die Richtungsangabe und klingt für den Weg aus dem Bergland nach Timna natürlich.
- source_word: תִּמְנָתָה
  choice: nach Timna
  rationale: Das angehängte Richtungs-ה bezeichnet die Bewegung auf einen Ort zu; im Deutschen gibt „nach Timna“ das Ziel idiomatisch wieder.
- source_word: וַיָּבֹאוּ עַד
  choice: sie kamen bis zu
  rationale: בוא mit עַד beschreibt das Erreichen eines bestimmten Punktes auf dem Weg. „Bis zu“ erhält diese räumliche Abstufung.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: die Weinberge von Timna
  rationale: Die Status-constructus-Verbindung bezeichnet die zu Timna gehörenden beziehungsweise bei Timna gelegenen Weinberge.
- source_word: וְהִנֵּה
  choice: Da … plötzlich
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf ein überraschendes, lebhaft geschildertes Ereignis. „Da … plötzlich“ gibt diese Erzählfunktion in gegenwärtigem Deutsch wieder, ohne das heute gehobene „siehe“ zu erzwingen.
- source_word: כְּפִיר אֲרָיוֹת
  choice: ein junger Löwe
  rationale: כְּפִיר bezeichnet einen jungen Löwen, nicht notwendig ein kleines Löwenjunges. Die ganze hebräische Wendung wird idiomatisch als „ein junger Löwe“ wiedergegeben.
- source_word: שֹׁאֵג
  choice: brüllend
  rationale: Das Partizip stellt das Brüllen als gleichzeitig andauernde Handlung dar; das deutsche Partizip bewahrt diese Anschaulichkeit.
- source_word: לִקְרָאתוֹ
  choice: kam ihm … entgegen
  rationale: לִקְרַאת kann eine Bewegung zur Begegnung hin oder auf jemanden zu bezeichnen. „Kam ihm entgegen“ drückt die Bewegung aus, ohne über den Kontext hinaus eine ausdrückliche Angriffsabsicht festzulegen.
