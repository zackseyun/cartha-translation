translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung vermeidet die im Hebräischen nicht ausdrücklich wiederholte Bezeichnung „Frau“ und gibt לְ bei היה als Übergabe beziehungsweise neue Zuordnung wieder. Die Fußnote bewahrt die alternative Deutung der verwandten Ausdrücke als „Freund“ und „begleiten“.
