  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: de
  text: Und Simsons Frau wurde die Frau seines Gefährten, der sein Freund gewesen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… die Frau seines Freundes, der ihm als Gefährte verbunden gewesen war.“ Im Hebräischen stehen hier verwandte Wörter aus der Wortgruppe רעה für freundschaftliche oder gesellschaftliche Verbundenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: wurde … gegeben
  rationale: Die Form von היה bezeichnet hier das Ergebnis eines Wechsels. Zusammen mit לְ gibt die deutsche Formulierung den Übergang der Frau an einen anderen Mann natürlich wieder, ohne eine zweite Eheschließung ausdrücklich zu behaupten.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: Simsons Frau
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet schlicht die eheliche Beziehung; die deutsche Genitivkonstruktion ist natürlich und präzise.
- source_word: לְמֵרֵעֵהוּ
  choice: seinem Gefährten
  rationale: Die Präposition לְ markiert bei היה die neue Zuordnung. מֵרֵעַ bezeichnet hier einen Gefährten oder engen Bekannten, im Kontext wohl einen Hochzeitsgefährten.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: der ihm als Freund zur Seite gestanden hatte
  rationale: Das Verb aus der Wortgruppe רעה bezeichnet hier gesellschaftliche Verbindung oder freundschaftlichen Umgang, nicht das Hüten. Die Formulierung wahrt zugleich die sprachliche Verwandtschaft zum vorausgehenden Gefährten.
