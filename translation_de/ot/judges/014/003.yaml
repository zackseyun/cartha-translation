base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: de
  text: 'Doch sein Vater und seine Mutter sagten zu ihm: »Gibt es denn unter den Töchtern deiner Brüder[a] und in meinem ganzen Volk keine Frau, dass du hingehst, um dir eine Frau von den unbeschnittenen Philistern zu nehmen?« Simson aber sagte zu seinem Vater: »Hol sie mir, denn sie ist recht in meinen Augen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Töchtern deiner Brüder« sind wahrscheinlich allgemein Frauen aus Simsons Verwandtschaft oder seinem Volk gemeint, nicht nur die leiblichen Töchter seiner Brüder.
    reason: cultural_note
  - marker: b
    text: 'Oder: »denn sie gefällt mir« beziehungsweise »denn sie ist in meinen Augen die Richtige«. Die hebräische Wendung kann persönliche Zustimmung oder Anziehung ausdrücken; die Übersetzung im Haupttext bewahrt zugleich den Anklang an ein wiederkehrendes Motiv im Richterbuch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: Gibt es denn … keine
  rationale: Gibt die verneinte rhetorische Frage im Deutschen idiomatisch wieder; »denn« unterstreicht den erstaunten Einwand der Eltern.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: unter den Töchtern deiner Brüder
  rationale: Bewahrt die konkrete Verwandtschaftssprache des Hebräischen; die wahrscheinlich weitere Bedeutung wird in einer Fußnote erläutert.
- source_word: וּבְכָל עַמִּי
  choice: und in meinem ganzen Volk
  rationale: Erhält den singularischen Suffix der hebräischen Textgestalt (»mein Volk«), statt ihn stillschweigend zu »unser Volk« zu ändern.
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: hingehst, um dir eine Frau … zu nehmen
  rationale: Bildet die hebräische Bewegungskonstruktion und den ehelichen Sinn von »eine Frau nehmen« hinreichend eng und verständlich ab.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: von den unbeschnittenen Philistern
  rationale: Bewahrt sowohl die Volksbezeichnung als auch die im israelitischen Kontext bedeutsame, wertende Bezeichnung »unbeschnitten«.
- source_word: אוֹתָהּ קַח לִי
  choice: Hol sie mir
  rationale: Gibt den Imperativ und die Rolle des Vaters bei der Anbahnung der Ehe in natürlichem Deutsch wieder, ohne eine ausdrückliche Eheschließungsformel hinzuzufügen.
- source_word: יָשְׁרָה בְעֵינַי
  choice: sie ist recht in meinen Augen
  rationale: Bewahrt das hebräische Bild und die sprachliche Verbindung zum wiederkehrenden Motiv im Richterbuch, auch wenn die Formulierung im Deutschen bewusst markant klingt.
theological_decisions:
- issue: Erzählerischer Nachhall von יָשְׁרָה בְעֵינַי im Richterbuch
  choice: sie ist recht in meinen Augen
  alternative: sie gefällt mir / sie ist in meinen Augen die Richtige
  rationale: Die Alternativen geben persönliche Gefälligkeit oder Eignung natürlicher wieder, schwächen aber den Anklang an die wiederkehrende Formel ab, nach der jemand tut, was in seinen eigenen Augen recht ist. Der Haupttext bewahrt diese Spannung, ohne Simsons Beweggrund weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und mündlich, während markante hebräische Formulierungen wie »mein ganzes Volk«, »unbeschnitten« und »recht in meinen Augen« bewusst erhalten werden. Die Fußnotenmarker wurden jeweils an die tatsächlich erläuterte Wendung gesetzt.
