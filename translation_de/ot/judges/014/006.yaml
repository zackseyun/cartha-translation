  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: de
  text: Da kam der Geist Jahwes mit Macht über ihn[a], und er riss den Löwen auseinander, wie man ein Ziegenjunges auseinanderreißt[b], obwohl er nichts in der Hand hatte. Seinem Vater und seiner Mutter erzählte er aber nicht, was er getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Da ergriff ihn der Geist Jahwes mit Macht.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet ein Ziegenjunges.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: Da kam … mit Macht über ihn
  rationale: צלח mit עַל bezeichnet hier das plötzliche, machtvolle Wirken des Geistes an Simson. Die Formulierung ist im Deutschen natürlich und bewahrt den Gedanken übernatürlicher Befähigung, ohne die mögliche Bewegungsmetapher mit „stürzte sich auf ihn“ zu überzeichnen.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: רוּחַ bezeichnet in diesem Zusammenhang Gottes befähigenden Geist, nicht Wind oder bloße Gemütskraft. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: er riss den Löwen auseinander
  rationale: שׁסע bezeichnet gewaltsames Zerreißen oder Spalten. Das maskuline Suffix verweist auf den im Kontext genannten Löwen; die ausdrückliche Wiederaufnahme vermeidet im Deutschen ein unklares Pronomen.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: wie man ein Ziegenböckchen auseinanderreißt
  rationale: Die unpersönliche Formulierung gibt den knappen hebräischen Vergleich idiomatisch wieder. גְּדִי bezeichnet ein Ziegenjunges; „Ziegenböckchen“ ist eindeutig und verständlich.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: obwohl er nichts in der Hand hatte
  rationale: Die konzessive Wiedergabe macht deutlich, dass Simson keine Waffe oder kein Werkzeug benutzte, und entspricht dem Sinnzusammenhang.
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: Seinem Vater und seiner Mutter erzählte er aber nicht
  rationale: Die Voranstellung der Eltern und „aber“ bilden im Deutschen den leichten Kontrast zur außergewöhnlichen Tat natürlich ab.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: was er getan hatte
  rationale: 'Das Plusquamperfekt verdeutlicht die zeitliche Abfolge: Die Tat lag vor dem Verschweigen.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רוּחַ im Zusammenhang
  choice: Geist
  alternative: Kraft oder Wind
  rationale: Die Verbindung רוּחַ יְהוָה und der erzählerische Zusammenhang bezeichnen Jahwes befähigendes Wirken. Die Übersetzung lässt offen, wie dieses Wirken ontologisch näher zu bestimmen ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählstruktur. „Ziegenböckchen“ vermeidet die mögliche Unklarheit von „Zicklein“, während „den Löwen“ den kontextuellen Bezug des hebräischen Pronomens ausdrücklich macht.
