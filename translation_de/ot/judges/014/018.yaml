  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אַנְשֵׁ֨י הָ/עִ֜יר בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י בְּ/טֶ֨רֶם֙ יָבֹ֣א הַ/חַ֔רְסָ/ה מַה מָּת֣וֹק מִ/דְּבַ֔שׁ וּ/מֶ֥ה עַ֖ז מֵ/אֲרִ֑י וַ/יֹּ֣אמֶר לָ/הֶ֔ם לוּלֵא֙ חֲרַשְׁתֶּ֣ם בְּ/עֶגְלָתִ֔/י לֹ֥א מְצָאתֶ֖ם חִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: de
  text: 'Da sagten die Männer der Stadt am siebten Tag zu ihm, bevor die Sonne unterging[a]: »Was ist süßer als Honig, und was ist stärker als ein Löwe?« Er antwortete ihnen: »Hättet ihr nicht mit meiner jungen Kuh gepflügt[b], hättet ihr mein Rätsel nicht herausgefunden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bevor die Sonne hereinkam«; eine hebräische Wendung für die Zeit vor Sonnenuntergang.'
    reason: lexical_alternative
  - marker: b
    text: Simson bezeichnet seine Frau bildhaft als seine »junge Kuh« und wirft den Männern vor, sie benutzt zu haben, um die Lösung des Rätsels zu erfahren.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Die Wiedergabe entspricht der ausdrücklich maskulinen Pluralform und ist im Deutschen klarer und näher am Hebräischen als eine Verallgemeinerung wie »die Leute der Stadt«.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: am siebten Tag
  rationale: Natürliche und formal genaue deutsche Zeitangabe.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: bevor die Sonne unterging
  rationale: Die wörtliche Wendung »bevor die Sonne hereinkam« bezeichnet idiomatisch die Zeit vor Sonnenuntergang; die Übersetzung gibt den gemeinten Vorgang natürlich wieder.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: Was ist süßer als Honig
  rationale: מִן hat hier vergleichende Bedeutung; der deutsche Komparativ bewahrt Aufbau und Sinn der Rätselantwort.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: und was ist stärker als ein Löwe
  rationale: עַז kann »stark«, »mächtig« oder »wild« bedeuten. Im parallelen Vergleich ist »stärker« die klarste natürliche Wiedergabe, ohne die Grundbedeutung einzuengen.
- source_word: לוּלֵא ... לֹא
  choice: Hättet ihr nicht …, hättet ihr … nicht
  rationale: Der irreale Bedingungssatz wird im Deutschen idiomatisch durch den Konjunktiv II der Vorzeitigkeit wiedergegeben.
- source_word: חֲרַשְׁתֶּם
  choice: gepflügt
  rationale: Die konkrete landwirtschaftliche Metapher bleibt erhalten und wird nicht zum allgemeineren »benutzt« oder »bearbeitet« abgeschwächt.
- source_word: בְּעֶגְלָתִי
  choice: mit meiner jungen Kuh
  rationale: עֶגְלָה bezeichnet eine junge Kuh bzw. Färse. »Junge Kuh« ist für heutige Leser unmittelbar verständlich und bewahrt das anstößige Bild; der Bezug auf Simsons Frau wird in der Fußnote erklärt.
- source_word: מְצָאתֶם חִידָתִי
  choice: hättet ihr mein Rätsel nicht herausgefunden
  rationale: מצא bedeutet grundsätzlich »finden«; »herausfinden« macht im Zusammenhang eines Rätsels den Sinn natürlich deutlich, ohne ausdrücklich »lösen« in den Text einzutragen.
