  naturalness: „Garnituren Kleidung“ ist im heutigen Standarddeutsch keine natürliche Verbindung. Auch die Koordination mit „nennen und herausfinden könnt“ ist syntaktisch und semantisch unnötig belastet. Die Revision formuliert die beiden hebräischen Verben mit gemeinsamem Bezug auf „die Lösung“ klar und idiomatisch.
  terminology: „Simson“, „Festmahl“, „Leinengewänder“ und „Wechselkleider“ sind registergerecht und sachlich. „Wechselkleider“ gibt חֲלִפֹת בְּגָדִים natürlich wieder, während die Fußnote die historische Ungewissheit wahrt.
