base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: de
  text: 'Und Simson sagte zu ihnen: »Ich möchte euch ein Rätsel aufgeben. Wenn ihr mir die Lösung innerhalb der sieben Tage des Festmahls wirklich sagt und sie herausfindet,[a] werde ich euch dreißig Leinengewänder und dreißig Wechselkleider geben.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und ihr findet sie«; gemeint ist, die Lösung des Rätsels herauszufinden.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Art der genannten Kleidungsstücke ist unsicher. Das Hebräische spricht von Leinengewändern und von Garnituren beziehungsweise Wechselkleidung.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא לָכֶם חִידָה
  choice: Ich möchte euch ein Rätsel aufgeben
  rationale: Der Kohortativ von חוד mit נָא drückt einen höflichen Vorschlag aus. „Ein Rätsel aufgeben“ ist dafür im Deutschen die natürliche feste Wendung.
- source_word: אִם הַגֵּד תַּגִּידוּ אוֹתָהּ לִי
  choice: Wenn ihr es mir … wirklich nennen … könnt
  rationale: Infinitivus absolutus und finite Verbform verstärken die Aussage. „Wirklich“ gibt diese Betonung wieder; „nennen“ bezeichnet hier das Mitteilen der Rätsellösung. Das ergänzte „könnt“ gehört im Deutschen natürlich zur gemeinsamen Bedingung mit „herausfinden“, ohne die Aussage auf bloße Fähigkeit zu reduzieren.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: innerhalb der sieben Tage des Festmahls
  rationale: מִשְׁתֶּה bezeichnet ein Festmahl beziehungsweise Gelage, im Kontext das Hochzeitsfest. „Innerhalb“ bringt die zeitliche Frist der Wette zum Ausdruck.
- source_word: וּמְצָאתֶם
  choice: und herausfinden
  rationale: Wörtlich bedeutet das Verb „finden“; bei einem Rätsel meint es, die Lösung herauszufinden. Die Formulierung bewahrt das Bild näher als das ebenfalls mögliche „lösen“.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: dreißig Leinengewänder
  rationale: סְדִינִים bezeichnet Kleidungsstücke aus Leinen, deren genaue Form unsicher ist. „Leinengewänder“ bleibt hinreichend allgemein.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: dreißig Garnituren Kleidung
  rationale: Die Wendung bezeichnet Wechsel- oder vollständige Sätze von Kleidern. „Garnituren Kleidung“ vermeidet die im Deutschen missverständliche Vorstellung von dreißig einzelnen Kleidungsstücken.
- source_word: וְנָתַתִּי לָכֶם
  choice: werde ich euch … geben
  rationale: Das mit וְ eingeleitete Verb bildet sinngemäß den Folgesatz der Bedingung; die deutsche Verbform stellt diesen Zusammenhang natürlich dar.
