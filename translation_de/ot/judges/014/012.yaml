  to: 'Und Simson sagte zu ihnen: »Ich möchte euch ein Rätsel aufgeben. Wenn ihr mir die Lösung innerhalb der sieben Tage des Festmahls wirklich sagt und sie herausfindet,[a] werde ich euch dreißig Leinengewänder und dreißig Wechselkleider geben.«[b]'
