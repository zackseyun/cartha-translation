base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: de
  text: Doch sein Vater und seine Mutter wussten nicht, dass dies von Jahwe kam; denn er suchte einen Anlass gegen die Philister.[a] Zu jener Zeit herrschten die Philister über Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er suchte bei den Philistern einen Anlass“. Das mit „er“ bezeichnete Subjekt kann im Hebräischen auch als Jahwe verstanden werden; der Zusammenhang weist jedoch eher auf Simson.'
    reason: Bewahrt sowohl die mögliche Nuance von מִן als auch die grammatische Mehrdeutigkeit des nicht ausdrücklich genannten Subjekts.
lexical_decisions:
- source_word: מֵיְהוָה
  choice: von Jahwe
  rationale: Gibt den persönlichen Bundesnamen יְהוָה transparent als „Jahwe“ wieder.
- source_word: הִיא
  choice: dies
  rationale: Das feminine Pronomen verweist auf die zur Rede stehende Angelegenheit; „dies“ ist im Deutschen natürlich und wahrt den Rückbezug.
- source_word: תֹאֲנָה
  choice: einen Anlass
  rationale: „Anlass“ lässt offen, ob eine Gelegenheit oder ein Vorwand für ein Vorgehen gemeint ist, ohne vorschnell Unaufrichtigkeit zu unterstellen.
- source_word: מְבַקֵּשׁ
  choice: er suchte
  rationale: Der durative Sinn des Partizips wird im narrativen deutschen Präteritum idiomatisch wiedergegeben.
- source_word: מִפְּלִשְׁתִּים
  choice: gegenüber den Philistern
  rationale: Das hebräische מִן bedeutet formal „von“, bezeichnet hier aber im Zusammenhang den Gegner, bei dem beziehungsweise gegen den ein Anlass gesucht wird. „Gegenüber“ bewahrt diese Offenheit besser als ein eindeutig feindliches „gegen“.
- source_word: וּבָעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Natürliche und würdige deutsche Zeitangabe.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: herrschten … über Israel
  rationale: Gibt die fortdauernde politische Herrschaft der Philister klar und idiomatisch wieder.
- source_word: וְאָבִיו וְאִמּוֹ
  choice: sein Vater und seine Mutter
  rationale: Bewahrt den wiederholten Possessivbezug des Hebräischen in natürlichem Deutsch.
- source_word: לֹא יָדְעוּ
  choice: wussten nicht
  rationale: Direkte, idiomatische Wiedergabe des hebräischen Perfekts im Erzählzusammenhang.
theological_decisions:
- issue: Göttliches Wirken und Simsons Handeln
  choice: Die Angelegenheit kam von Jahwe, während Simson nach einem Anlass gegenüber den Philistern suchte.
  alternative: Jahwe ist selbst das Subjekt von „suchte“.
  rationale: Der Text führt die Angelegenheit ausdrücklich auf Jahwe zurück und lässt zugleich im Erzählzusammenhang Simson als naheliegendes Subjekt des Suchens erscheinen. Beide Aussageebenen bleiben bestehen, ohne ihr Verhältnis systematisch festzulegen.
- issue: Subjekt von מְבַקֵּשׁ („suchte“)
  choice: Simson
  alternative: Jahwe
  rationale: Der weitere Erzählzusammenhang spricht eher für Simson; da das Hebräische das Subjekt jedoch nicht ausdrücklich nennt, wird die mögliche Beziehung auf Jahwe in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Übersetzung wahrt die Mehrdeutigkeit beim Subjekt von „suchte“ und vermeidet eine unnötig enge Festlegung der Wendung תֹאֲנָה מִפְּלִשְׁתִּים.
