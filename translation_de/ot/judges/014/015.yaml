  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt scharf und bedrohlich. Die Mehrdeutigkeit von בֵּית אָבִיךְ wird im Haupttext nicht vorschnell auf Gebäude oder Familie festgelegt; die Fußnote macht beide Möglichkeiten sichtbar.
