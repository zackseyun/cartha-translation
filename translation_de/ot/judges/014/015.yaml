  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יֹּאמְר֤וּ לְ/אֵֽשֶׁת שִׁמְשׁוֹן֙ פַּתִּ֣י אֶת אִישֵׁ֗/ךְ וְ/יַגֶּד לָ֨/נוּ֙ אֶת הַ֣/חִידָ֔ה פֶּן נִשְׂרֹ֥ף אוֹתָ֛/ךְ וְ/אֶת בֵּ֥ית אָבִ֖י/ךְ בָּ/אֵ֑שׁ הַ/לְ/יָרְשֵׁ֕/נוּ קְרָאתֶ֥ם לָ֖/נוּ הֲ/לֹֽא׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: de
  text: 'Am siebten Tag sagten sie zu Simsons Frau: „Überrede deinen Mann, uns die Lösung des Rätsels zu verraten! Sonst verbrennen wir dich und das Haus deines Vaters[a]. Habt ihr uns etwa eingeladen, um uns um unseren Besitz zu bringen[b]? Oder nicht?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus deines Vaters“ kann sowohl das Gebäude als auch den Haushalt beziehungsweise die Familie des Vaters bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb kann auch bedeuten: „etwas in Besitz nehmen“ oder „jemanden aus seinem Besitz verdrängen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: Überrede
  rationale: Der Piel-Imperativ bezeichnet ein beeinflussendes, hier deutlich manipulatives Überreden. „Überrede“ ist im Deutschen natürlich und bewahrt den nötigen Nachdruck, ohne zwingend Täuschung zu behaupten.
- source_word: אִישֵׁךְ
  choice: deinen Mann
  rationale: אִישׁ bezeichnet in diesem Zusammenhang idiomatisch den Ehemann.
- source_word: וְיַגֶּד לָנוּ
  choice: uns … zu verraten
  rationale: Die Verbverbindung drückt nach dem Imperativ den beabsichtigten Zweck aus. Beim Rätsel ist „die Lösung verraten“ sinngemäß gemeint; die knappe Form „das Rätsel verraten“ ist natürlich und wahrt den Kontext.
- source_word: הַחִידָה
  choice: das Rätsel
  rationale: חִידָה ist hier die übliche Bezeichnung für ein Rätsel.
- source_word: פֶּן נִשְׂרֹף אוֹתָךְ וְאֶת בֵּית אָבִיךְ בָּאֵשׁ
  choice: Sonst verbrennen wir dich und das Haus deines Vaters
  rationale: פֶּן leitet hier eine Drohung ein und wird im modernen Deutsch natürlich mit „sonst“ wiedergegeben. „Verbrennen“ erhält die ausdrückliche Gewaltandrohung; „mit Feuer“ wäre im Deutschen redundant.
- source_word: בֵּית אָבִיךְ
  choice: das Haus deines Vaters
  rationale: Die formale Wiedergabe bewahrt die echte Mehrdeutigkeit zwischen Gebäude und väterlichem Haushalt beziehungsweise Familie; eine Fußnote erläutert sie.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: um uns unseres Besitzes zu berauben
  rationale: ירשׁ kann hier das Inbesitznehmen beziehungsweise Verdrängen aus dem Besitz bezeichnen. Die Formulierung passt zur drohenden Einbuße durch die Wette und ist verständlicher als das gehobene „enteignen“ oder „besitzlos machen“.
- source_word: קְרָאתֶם לָנוּ
  choice: Habt ihr uns etwa eingeladen
  rationale: קרא mit ל bezeichnet im Festkontext das Einladen. Das pluralische „ihr“ folgt der hebräischen Verbform und kann Simson und seine Familie beziehungsweise Gastgeber einschließen.
- source_word: הֲלֹא
  choice: Oder nicht?
  rationale: Die kurze rhetorische Schlussfrage bewahrt den anklagenden Nachdruck der hebräischen Partikel.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
