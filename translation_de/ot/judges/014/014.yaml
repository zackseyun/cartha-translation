base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: de
  text: 'Da sagte er zu ihnen: »Aus dem Fresser kam Speise, und aus dem Starken[a] kam Süßes.« Doch drei Tage lang konnten sie die Lösung des Rätsels nicht nennen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Wilden kam Süßes“. Das hebräische Adjektiv kann „stark“, „mächtig“ oder, je nach Zusammenhang, „wild/grimmig“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Doch drei Tage lang konnten sie das Rätsel nicht erklären/deuten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da sagte er“ klingt im modernen deutschen Erzählstil natürlich, ohne eine genauere zeitliche Abfolge zu erzwingen.
- source_word: מֵהָאֹכֵל
  choice: Aus dem Fresser
  rationale: Das substantivierte Qal-Partizip bezeichnet wörtlich den, der frisst. „Fresser“ bewahrt die knappe, rätselhafte Bildsprache und passt zum später erkennbaren Löwen.
- source_word: יָצָא
  choice: kam
  rationale: In der Verbindung „aus … kam“ gibt „kam“ das Hervorgehen idiomatisch und knapp wieder.
- source_word: מַאֲכָל
  choice: Speise
  rationale: Das Substantiv bezeichnet Nahrung beziehungsweise etwas Essbares. „Speise“ ist prägnant und erhält den gehobenen, spruchartigen Parallelismus.
- source_word: וּמֵעַז
  choice: und aus dem Starken
  rationale: עַז kann „stark“, „mächtig“ oder „wild/grimmig“ bedeuten. „Der Starke“ bewahrt die Mehrdeutigkeit und deutet das Rätsel nicht vorzeitig auf den Löwen hin.
- source_word: מָתוֹק
  choice: Süßes
  rationale: Das Adjektiv wird substantivisch gebraucht. „Süßes“ ist im heutigen Deutsch natürlicher als „Süßigkeit“ und kann konkret auf den Honig weisen, ohne ihn ausdrücklich zu nennen.
- source_word: לֹא יָכְלוּ
  choice: konnten sie … nicht
  rationale: Dies ist die knappe und idiomatische Wiedergabe der verneinten Form von יכל.
- source_word: לְהַגִּיד הַחִידָה
  choice: die Lösung des Rätsels … nennen
  rationale: נגד bedeutet grundsätzlich „mitteilen/sagen“. Im Kontext eines aufgegebenen Rätsels ist gemeint, dass sie dessen Antwort nicht nennen konnten; die Fußnote hält die wörtlichere beziehungsweise erklärende Alternative offen.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage lang
  rationale: Die Wendung gibt die im Hebräischen genannte Zeitspanne idiomatisch wieder, ohne sie als Fristende zu präzisieren.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, parallel gebauter Rätselsprache. „Speise“ hält den spruchartigen Ton, während „Süßes“ gegenüber dem heute oft anders verstandenen „Süßigkeit“ natürlicher ist. Die Fußnotenmarker wurden den jeweils erläuterten Ausdrücken zugeordnet.
