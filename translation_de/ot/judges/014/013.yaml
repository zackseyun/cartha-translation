base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: de
  text: 'Wenn ihr es mir aber nicht sagen könnt, dann müsst ihr mir dreißig Leinengewänder[a] und dreißig Wechselkleider geben.« Sie sagten zu ihm: »Gib uns dein Rätsel auf, damit wir es hören!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Leinentücher«. Das hebräische Wort kann feine Gegenstände aus Leinen bezeichnen; hier sind parallel zu den Wechselkleidern wahrscheinlich tragbare Kleidungsstücke gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: ihr ... nicht ... könnt
  rationale: Die Form von יכל bezeichnet die Fähigkeit; im Bedingungssatz gibt »nicht könnt« die Unfähigkeit natürlich wieder.
- source_word: לְהַגִּיד לִי
  choice: es mir ... sagen
  rationale: נגד im Hifil bedeutet gewöhnlich »sagen/mitteilen«. Das Pronomen »es« nimmt im Deutschen natürlich die zuvor genannte Lösung des Rätsels auf.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: dann müsst ihr mir ... geben
  rationale: Das Perfekt mit Waw bezeichnet hier die verbindliche Folge der Bedingung; »müsst ... geben« bringt diesen Einsatzcharakter idiomatisch zum Ausdruck. Das ausdrücklich gesetzte Pronomen אַתֶּם wird durch »ihr« bewahrt.
- source_word: סְדִינִים
  choice: Leinengewänder
  rationale: Das Wort bezeichnet feine Leinenstücke beziehungsweise Kleidungsstücke. Im Zusammenhang mit dem Kleiderpreis passt »Leinengewänder«, ohne die moderne Assoziation von Bettlaken hervorzurufen.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: Wechselkleider
  rationale: Die Wendung bezeichnet austauschbare beziehungsweise zusätzliche Garnituren Kleidung; »Wechselkleider« ist knapp, verständlich und bewahrt die Kleidungsterminologie.
- source_word: חוּדָה חִידָתְךָ
  choice: Gib uns dein Rätsel auf
  rationale: חוד bezeichnet hier das Stellen eines Rätsels. Die idiomatische deutsche Wendung lautet »ein Rätsel aufgeben«; »uns« macht den im folgenden Kohortativ bezeichneten Hörerkreis natürlich deutlich.
- source_word: וְנִשְׁמָעֶנָּה
  choice: damit wir es hören
  rationale: Der Kohortativ der ersten Person Plural mit femininem Suffix bezieht sich auf das Rätsel und drückt den Wunsch beziehungsweise Zweck des Hörens aus.
