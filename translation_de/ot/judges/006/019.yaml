base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: de
  text: Da ging Gideon hinein und bereitete ein Zicklein sowie ungesäuertes Brot aus einem Efa Mehl zu. Das Fleisch legte er in einen Korb und die Brühe in einen Topf. Dann brachte er alles zu ihm hinaus, unter die Terebinthe[a], und setzte es ihm vor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter die Eiche“. Das hebräische Wort bezeichnet wahrscheinlich eine Terebinthe; „Eiche“ ist eine traditionelle Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „brachte es heran“; auch „reichte es dar“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: ging hinein
  rationale: Im Zusammenhang verlässt Gideon den Besucher, um die Speisen zuzubereiten. „Ging hinein“ gibt diese Bewegung natürlicher wieder als das isolierte „kam“.
- source_word: וַיַּעַשׂ
  choice: bereitete … zu
  rationale: Bei Speisen entspricht „zubereiten“ dem weiten Sinn des Verbs und ist im Deutschen idiomatisch.
- source_word: גְּדִי עִזִּים
  choice: ein Ziegenböckchen
  rationale: Die Verbindung bezeichnet ein junges Tier der Ziegen; „Ziegenböckchen“ ist präzise und gut verständlich.
- source_word: אֵיפַת קֶמַח
  choice: ein Efa Mehl
  rationale: Die konkrete hebräische Maßeinheit bleibt erhalten; „Mehl“ ist die natürliche deutsche Bezeichnung im Zusammenhang.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Die Wiedergabe benennt klar Brot ohne Sauerteig, ohne dessen genaue Form als Fladen oder Laibe festzulegen.
- source_word: הַבָּשָׂר
  choice: das Fleisch
  rationale: Im Zusammenhang der Speisenzubereitung ist „Fleisch“ die natürliche Entsprechung.
- source_word: סַּל
  choice: Korb
  rationale: Dies ist die übliche und hinreichend genaue Bezeichnung für das genannte Behältnis.
- source_word: הַמָּרַק
  choice: Brühe
  rationale: Das Wort bezeichnet die Kochflüssigkeit beziehungsweise Brühe; „Brühe“ passt am besten zur Szene.
- source_word: פָּרוּר
  choice: Topf
  rationale: „Topf“ ist eine knappe und natürliche Wiedergabe des Gefäßes für die Brühe.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: brachte er alles zu ihm hinaus
  rationale: Das singularische hebräische Verb kann die gesamte zubereitete Gabe zusammenfassend erfassen. „Alles“ nimmt Fleisch, Brot und Brühe natürlich auf, ohne die grammatische Zahl unnötig nachzuahmen.
- source_word: תַּחַת הָאֵלָה
  choice: unter die Terebinthe
  rationale: אֵלָה bezeichnet wahrscheinlich eine Terebinthe. Die traditionelle Wiedergabe „Eiche“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: וַיַּגַּשׁ
  choice: setzte es ihm vor
  rationale: Das Verb bedeutet „heranbringen“ beziehungsweise „darreichen“. Die Formulierung passt zur Bewirtung und erklärt die Handlung nicht vorschnell als Opfer.
theological_decisions:
- issue: Mögliche Opferbedeutung von Gideons Handlung
  choice: Sprache des Darreichens beziehungsweise Vorsetzens
  alternative: brachte es als Opfer dar
  rationale: Der Vers berichtet vom Zubereiten, Hinausbringen und Heranbringen der Speisen. Opferanklänge entstehen im Fortgang der Erzählung, werden hier aber noch nicht ausdrücklich benannt; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Maßeinheit „Efa“ und die Baumbezeichnung „Terebinthe“ bewahren die Eigenart des Ausgangstextes; der Satzbau bleibt zugleich für heutige Leser flüssig. Die Schlussformulierung vermeidet eine vorzeitige sakramentale oder opfertheologische Festlegung.
