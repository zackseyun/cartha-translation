  terminology: „Engel Jahwes“, „Terebinthe“, „Ofra“, „Joasch“, „Weinkelter“ und „Midian“ sind angemessen. „Abiesriter“ wahrt die besondere gentilizische Form des hebräischen Textes; die Verbindung mit der Sippe Abiëser kann als Alternative erläutert werden.
