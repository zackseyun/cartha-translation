base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: de
  text: Da kam der Engel Jahwes und setzte sich unter die Terebinthe[a] in Ofra, die Joasch, dem Abiesriter[b], gehörte. Gideon, sein Sohn, schlug gerade Weizen in der Weinkelter aus, um ihn vor Midian in Sicherheit zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Eiche. Die genaue Baumart des hebräischen Ausdrucks ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: Abiëseriter; gemeint ist ein Angehöriger der Sippe Abiëser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten; die Erzählung stellt die Gestalt als himmlischen Boten dar. »Engel Jahwes« bewahrt zugleich die offene Frage nach ihrer genaueren Identität.
- source_word: הָאֵלָה
  choice: die Terebinthe
  rationale: אֵלָה bezeichnet wahrscheinlich eine Terebinthe oder einen ähnlich großen Baum. »Terebinthe« ist botanisch genauer; die geläufige Alternative »Eiche« wird in einer Fußnote genannt.
- source_word: בְּעָפְרָה
  choice: bei Ofra
  rationale: Die Präposition lokalisiert den Baum in bzw. bei Ofra. Im Deutschen klingt »die Terebinthe bei Ofra« natürlich und vermeidet die missverständliche Vorstellung, der Baum befinde sich innerhalb eines Gebäudes oder eng umgrenzten Ortes.
- source_word: אֲבִי הָעֶזְרִי
  choice: dem Abiëseriter
  rationale: Das Gentiliz bezeichnet Joaschs Zugehörigkeit zur Sippe Abiëser. Die Schreibung mit Trema macht die Silbentrennung im Deutschen deutlich.
- source_word: חֹבֵט חִטִּים
  choice: schlug gerade Weizen … aus
  rationale: חבט bezeichnet das Ausschlagen von Getreide. Die konkrete Wiedergabe passt besonders zum ungewöhnlichen Arbeitsort in einer Weinkelter.
- source_word: בַּגַּת
  choice: in der Weinkelter
  rationale: Die Präposition und der Kontext zeigen, dass Gideon im Kelterbereich arbeitete, offenbar um verborgen zu bleiben.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: um ihn vor Midian in Sicherheit zu bringen
  rationale: Das Hifil von נוס bedeutet wörtlich etwa »fliehen lassen/wegschaffen«. Die Formulierung wahrt stärker als bloßes »verstecken« den Gedanken, den Weizen dem Zugriff Midians zu entziehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« gibt ihn im Deutschen als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung und Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Im Erzählzusammenhang ist ein übernatürlicher Bote gemeint. Die Übersetzung nennt ihn dennoch nur so, wie der Text ihn bezeichnet, und legt seine weitergehende Identität nicht dogmatisch fest.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der erste hebräische Satz wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. »Gerade« gibt die gleichzeitige Hintergrundhandlung des hebräischen Partizips wieder; »Weinkelter« bewahrt den auffälligen Kontrast zwischen Drescharbeit und verborgenem Arbeitsort.
