  source_fidelity: 'Die wesentlichen Handlungen und Beziehungen sind zutreffend wiedergegeben: Der Engel Jahwes kommt und setzt sich unter den Baum in Ofra; Gideon, Joaschs Sohn, schlägt Weizen in der Weinkelter aus, um ihn dem Zugriff Midians zu entziehen. „Bei Ofra“ schwächt jedoch die einfache Lokalangabe בְּעָפְרָה („in Ofra“) unnötig ab. Außerdem ist für das Gentiliz הָעֶזְרִי im Deutschen die etablierte, näher am hebräischen Wortlaut bleibende Form „Abiesriter“ vorzuziehen.'
