  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה קַ֤ח אֶת פַּר הַ/שּׁוֹר֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וּ/פַ֥ר הַ/שֵּׁנִ֖י שֶׁ֣בַע שָׁנִ֑ים וְ/הָרַסְתָּ֗ אֶת מִזְבַּ֤ח הַ/בַּ֨עַל֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וְ/אֶת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו תִּכְרֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: de
  text: 'In jener Nacht sagte Jahwe zu ihm: »Nimm den Stier deines Vaters und den zweiten Stier, der sieben Jahre alt ist. Reiß den Baalsaltar nieder, der deinem Vater gehört, und fälle die Aschera[a], die sich darauf befindet[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Ascherapfahl« beziehungsweise »den heiligen Pfahl«. Das hebräische Wort bezeichnet hier ein Kultobjekt, das mit Aschera verbunden ist; seine genaue Gestalt bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die auf ihm ist«. Gemeint sein kann, dass die Aschera auf, über oder unmittelbar bei dem Altar stand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: In jener Nacht
  rationale: Die knappe deutsche Erzählform gibt den zeitlichen Übergang natürlich wieder; ein zusätzliches „es geschah“ wäre im modernen Deutsch unnötig schwerfällig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des göttlichen Eigennamens bewahrt dessen Namenscharakter.
- source_word: קַח
  choice: Nimm
  rationale: Entspricht unmittelbar dem hebräischen Imperativ.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: den Stier deines Vaters
  rationale: Gibt die schwierige, teilweise appositionelle Wortgruppe verständlich wieder, ohne eine im Hebräischen nicht näher bestimmte Funktion des Tieres hinzuzufügen.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: und den zweiten Stier, der sieben Jahre alt ist
  rationale: Liest die mit וּ verbundene Wortgruppe als zweites Tier und gibt Alter und Ordnungsbezeichnung ausdrücklich wieder.
- source_word: וְהָרַסְתָּ
  choice: Reiß ... nieder
  rationale: Eine kraftvolle und im Deutschen übliche Bezeichnung für die Zerstörung eines Altars.
- source_word: מִזְבַּח הַבַּעַל
  choice: den Baalsaltar
  rationale: Die deutsche Zusammensetzung ist eine natürliche und genaue Wiedergabe der hebräischen Genitivverbindung.
- source_word: אֲשֶׁר לְאָבִיךָ
  choice: der deinem Vater gehört
  rationale: Drückt das hebräische Besitzverhältnis klar und idiomatisch aus.
- source_word: הָאֲשֵׁרָה
  choice: die Aschera
  rationale: Die transliterierte Kultbezeichnung lässt offen, ob konkret ein Pfahl, ein Baum oder ein anderes mit der Göttin Aschera verbundenes Kultobjekt gemeint ist.
- source_word: אֲשֶׁר עָלָיו
  choice: die sich darauf befindet
  rationale: Bewahrt die Grundbedeutung „auf/über ihm“ und vermeidet die unbelegte Festlegung auf „daneben“; „befindet“ lässt die genaue räumliche Anordnung offen.
- source_word: תִּכְרֹת
  choice: fälle
  rationale: Gibt das Abschlagen beziehungsweise Niederhauen eines hölzernen oder baumartigen Kultobjekts knapp und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Identität und Gestalt der אֲשֵׁרָה
  choice: die Aschera
  alternative: der Ascherapfahl / der heilige Pfahl
  rationale: Die Umschrift bewahrt die historische und sachliche Mehrdeutigkeit des Kultbegriffs, statt ihn eindeutig als Pfahl zu bestimmen.
- issue: Räumliche Beziehung der Aschera zum Altar
  choice: die sich darauf befindet
  alternative: die daneben steht
  rationale: עָלָיו bedeutet grundsätzlich „auf ihm/darauf“, kann im räumlichen Zusammenhang aber eine weniger exakt bestimmbare Zuordnung ausdrücken. Der Haupttext bleibt quellennah; die Fußnote nennt die Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper hebräischer Erzählführung. Die direkte Rede bleibt klar und kraftvoll. „Baalsaltar“ ist idiomatisch; „Aschera“ bewahrt bewusst die kultgeschichtliche Mehrdeutigkeit.
