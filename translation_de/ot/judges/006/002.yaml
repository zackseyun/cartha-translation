base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: de
  text: Die Hand Midians gewann die Oberhand über Israel. Wegen Midian richteten sich die Israeliten die Verstecke in den Bergen, die Höhlen und die Festungen ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Verstecke“ wiedergegebene hebräische Wort ist selten und in seiner genauen Bedeutung unsicher; möglich sind auch „Schlupfwinkel“, „Erdlöcher“ oder „Stollen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז יַד מִדְיָן עַל יִשְׂרָאֵל
  choice: Doch die Hand Midians wurde mächtig gegen Israel
  rationale: Bewahrt das hebräische Bild der „Hand“ als Ausdruck wirksamer Macht und gibt וַתָּעָז als Erstarken bzw. Übermacht wieder. „Doch“ nimmt den erzählerischen Anschluss des וַ auf.
- source_word: מִפְּנֵי מִדְיָן
  choice: Aus Angst vor Midian
  rationale: מִפְּנֵי bezeichnet hier die durch Midians Bedrohung ausgelöste Reaktion. Die Formulierung macht den kontextuell naheliegenden Flucht- und Schutzgedanken natürlich verständlich.
- source_word: עָשׂוּ לָהֶם בְּנֵי יִשְׂרָאֵל
  choice: legten sich die Israeliten … an
  rationale: Gibt das Herstellen bzw. Herrichten für den eigenen Gebrauch idiomatisch wieder. „Israeliten“ ist im Deutschen die natürliche kollektive Bezeichnung für בְּנֵי יִשְׂרָאֵל.
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: die Schlupfwinkel im Gebirge
  rationale: Das seltene מִנְהָרוֹת bezeichnet wahrscheinlich schwer zugängliche Verstecke, Löcher oder Zufluchtsorte. „Schlupfwinkel“ wahrt die Unsicherheit besser als eine präzise bauliche Festlegung; die Ortsangabe wird ausdrücklich erhalten.
- source_word: הַמְּעָרוֹת
  choice: die Höhlen
  rationale: Übliche und klare deutsche Entsprechung.
- source_word: הַמְּצָדוֹת
  choice: die Bergfesten
  rationale: Bezeichnet befestigte oder natürlich geschützte Zufluchtsorte. „Bergfesten“ passt zum Gebirgskontext und unterscheidet sie von den Höhlen und Schlupfwinkeln.
