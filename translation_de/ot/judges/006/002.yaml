revisions:
- from: Doch die Hand Midians wurde mächtig gegen Israel. Aus Angst vor Midian legten sich die Israeliten die Schlupfwinkel im Gebirge, die Höhlen und die Bergfesten an.[a]
  to: Die Hand Midians gewann die Oberhand über Israel. Wegen Midian richteten sich die Israeliten die Verstecke in den Bergen, die Höhlen und die Festungen ein.[a]
  rationale: Die Revision entfernt die nicht ausdrücklich genannte Angst, gibt die Ortsangabe ohne Ausweitung auf die Festungen wieder und ersetzt das unzutreffend lokalisierende „Bergfesten“ durch „Festungen“. Die Unsicherheit des seltenen Begriffs bleibt in der Fußnote transparent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:45:05Z'
review_pass:
  verdict: revise
  source_fidelity: „Aus Angst vor Midian“ legt einen ausdrücklich psychologischen Grund (Angst) in den Text hinein; מִפְּנֵי bezeichnet hier allgemein den Anlass bzw. Druck durch Midian. „Bergfesten“ überträgt zudem die Ortsangabe „in den Bergen“, die im Hebräischen nur die seltenen מִנְהָרוֹת näher bestimmt, unzulässig auf den letzten Listeneintrag. Die revidierte Fassung bewahrt die Hand-Metapher, die kausale Aussage und die begrenzte Ortszuordnung.
  naturalness: Die Formulierung „Die Hand Midians gewann die Oberhand über Israel“ ist modernes, verständliches Standarddeutsch und erhält zugleich das hebräische Bild. Die Aufzählung ist klar und idiomatisch.
  terminology: „Verstecke“ ist für das seltene und semantisch unsichere מִנְהָרוֹת vorsichtig gewählt und wird durch die Fußnote abgesichert. „Höhlen“ und „Festungen“ entsprechen den folgenden, klareren Begriffen; „Israeliten“ ist im Deutschen die natürliche Wiedergabe von בני ישראל.
  issues:
  - severity: medium
    issue: „Aus Angst vor Midian“ ist interpretierend.
    rationale: Der hebräische Ausdruck מִפְּנֵי מִדְיָן bedeutet hier „wegen Midian“ bzw. aufgrund von Midians Bedrängung. Angst ist plausibel, aber nicht ausdrücklich gesagt.
  - severity: medium
    issue: „Bergfesten“ erweitert die Ortsangabe.
    rationale: „In den Bergen“ bezieht sich syntaktisch auf die ersten genannten Zufluchtsorte (מִנְהָרוֹת), nicht auf die Festungen (מְצָדוֹת).
  - severity: low
    issue: Das adversative „Doch“ ist nicht erforderlich.
    rationale: Das einleitende וַ־ markiert den Erzählfortgang; ein ausdrücklicher Gegensatz wird im Vers nicht signalisiert.
