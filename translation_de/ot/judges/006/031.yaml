  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: de
  text: 'Doch Joasch sagte zu allen, die sich gegen ihn stellten: »Wollt ihr für Baal streiten? Wollt ihr ihn retten? Wer für ihn streitet, soll bis zum Morgen getötet werden. Wenn er ein Gott ist, soll er selbst für sich streiten, denn jemand hat seinen Altar niedergerissen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »denn er hat seinen Altar niedergerissen«. Das Subjekt wird im Hebräischen nicht ausdrücklich genannt; im Kontext liegt Gideon nahe.'
    reason: Das hebräische Verb steht in der 3. Person maskulin Singular, ohne ein ausdrücklich genanntes Subjekt. Die Anmerkung dokumentiert die formnähere Wiedergabe, ohne die kontextuelle Identifizierung als Bestandteil des Wortlauts auszugeben.
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: die sich gegen ihn stellten
  rationale: Die Wendung bezeichnet im Zusammenhang die feindselige Konfrontation mit Joasch, nicht bloß eine räumliche Stellung.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: streiten / streitet / soll ... streiten
  rationale: Die Wiederholung von ריב prägt die Rhetorik des Verses. »Streiten« bewahrt diese Wiederholung und lässt sowohl den rechtlichen als auch den kämpferischen Beiklang offen.
- source_word: תּוֹשִׁיעוּן
  choice: retten
  rationale: Die direkte Wiedergabe erhält die Ironie der Frage, ob Menschen ihren Gott retten müssen.
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: Wer für ihn streitet
  rationale: Die unbestimmte Relativkonstruktion wird in natürlichem modernem Deutsch als allgemeine Aussage wiedergegeben.
- source_word: יוּמַת
  choice: soll ... getötet werden
  rationale: Die passive Kausativform bezeichnet nicht nur das Sterben, sondern das Vollstrecken der Todesstrafe.
- source_word: עַד הַבֹּקֶר
  choice: noch vor dem Morgen
  rationale: Im Zusammenhang der Drohung bezeichnet die Wendung eine Frist bis zum kommenden Morgen; die Formulierung ist im Deutschen klar und idiomatisch.
- source_word: אֱלֹהִים הוּא
  choice: Wenn er ein Gott ist
  rationale: אֱלֹהִים bezieht sich hier auf Baals Anspruch, eine Gottheit zu sein, nicht auf den Gott Israels.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: denn man hat seinen Altar niedergerissen
  rationale: Das hebräische Verb steht in der 3. Person Singular, nennt sein Subjekt aber nicht ausdrücklich. Das unpersönliche »man« lässt die Person im Haupttext unausgesprochen; die formal nähere Alternative wird in der Fußnote dokumentiert.
- source_word: וַיֹּאמֶר
  choice: Doch Joasch sagte
  rationale: Das Anschlusswort leitet hier Joaschs gegensätzliche Antwort auf die Forderung der Männer ein; »doch« gibt diesen narrativen Kontrast natürlich wieder.
theological_decisions:
- issue: Bezug von אֱלֹהִים auf Baal
  choice: »ein Gott«
  alternative: »Gott«
  rationale: Joasch spricht von Baals behauptetem Gottsein, ohne ihn mit dem Gott Israels gleichzusetzen oder als den wahren Gott zu bestätigen.
- issue: Unausgesprochenes Subjekt von נָתַץ
  choice: Unpersönliches »man« im Haupttext
  alternative: »denn er hat seinen Altar niedergerissen«, wobei Gideon als Subjekt verstanden wird
  rationale: Die Verbform ist maskulin Singular, doch das Subjekt wird nicht ausdrücklich genannt. Die Übersetzung vermeidet es, Gideon im Haupttext ausdrücklich einzusetzen, und hält die alternative syntaktische Auffassung in der Fußnote fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die dreifache Wiederholung von »streiten« bildet die rhetorische Wiederholung des hebräischen Stammes ריב ab. »Baal« und »Altar« bleiben als allgemein verständliche biblische Begriffe erhalten.
