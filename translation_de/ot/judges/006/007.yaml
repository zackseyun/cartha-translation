source:
  edition: WLC
  text: וַ/יְהִ֕י כִּֽי זָעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה עַ֖ל אֹד֥וֹת מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: de
  text: Und es geschah, als die Israeliten[a] wegen Midian[b] zu Jahwe um Hilfe schrien,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aufgrund Midians“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Form führt eine neue Entwicklung in der Erzählung ein. Die Wiedergabe bewahrt dieses hebräische Erzählsignal in würdigem, noch verständlichem Deutsch.
- source_word: כִּי
  choice: als
  rationale: Nach וַיְהִי leitet כִּי hier den zeitlichen Nebensatz ein.
- source_word: זָעֲקוּ
  choice: um Hilfe schrien
  rationale: Das Verb bezeichnet einen dringenden Hilferuf aus Bedrängnis; die Formulierung gibt Dringlichkeit und Ziel des Rufens natürlich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung ist inklusiv und gut verständlich; die wörtliche hebräische Ausdrucksweise wird in einer Fußnote genannt.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bezeichnet die Ausrichtung des Hilferufs auf den Angerufenen; der Gottesname wird als Jahwe wiedergegeben.
- source_word: עַל אֹדוֹת
  choice: wegen
  rationale: Die Wendung bezeichnet hier den Anlass beziehungsweise Grund des Hilferufs und wird im Deutschen knapp und idiomatisch mit „wegen“ ausgedrückt.
- source_word: מִדְיָן
  choice: Midian
  rationale: Dies ist die im Deutschen etablierte Form des Namens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen. „Jahwe“ macht den Namen sichtbar, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Erzählmarker bleibt erhalten; der Hilferuf wird idiomatisch verdeutlicht. Das abschließende Komma wahrt den im folgenden Vers weitergeführten Satz.
