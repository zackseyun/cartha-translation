  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/עָשִׂ֤יתָ לִּ/י֙ א֔וֹת שָׁ/אַתָּ֖ה מְדַבֵּ֥ר עִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: de
  text: 'Da sagte er zu ihm: »Wenn ich Gunst in deinen Augen gefunden habe, dann gib mir bitte ein Zeichen dafür, dass du es bist, der mit mir redet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Wenn ich wirklich Gunst in deinen Augen gefunden habe
  rationale: Die hebräische Höflichkeitsformel wird nah am Wortlaut und zugleich in verständlichem Deutsch wiedergegeben; נָא verstärkt hier die eindringliche Bitte und wird mit »wirklich« ausgedrückt.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: dann gib mir ein Zeichen
  rationale: Das idiomatische deutsche »ein Zeichen geben« trifft die Bedeutung von עשה ... אות natürlicher als das wörtliche »ein Zeichen machen«.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: dafür, dass du es bist, der mit mir redet
  rationale: Die hervorgehobene Anrede אַתָּה bleibt durch »du es bist« erkennbar; der fortlaufende Charakter des Partizips מְדַבֵּר wird mit dem Präsens wiedergegeben.
theological_decisions:
- issue: Identität des Sprechers
  choice: Keine ausdrückliche Identifizierung im Vers ergänzt
  alternative: Den Sprecher als den HERRN oder als den Engel des HERRN benennen
  rationale: Der hebräische Vers verwendet lediglich Pronomen. Die Identität ergibt sich aus dem Kontext und soll hier nicht über den Wortlaut hinaus festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung »Gunst in deinen Augen finden« bewahrt die Bildsprache des Hebräischen und bleibt allgemein verständlich.
