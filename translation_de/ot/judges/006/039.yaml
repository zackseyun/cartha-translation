revisions:
- from: 'Da sagte Gideon zu Gott: »Lass deinen Zorn nicht gegen mich entbrennen, und lass mich nur noch dieses eine Mal reden. Bitte lass mich nur noch dieses eine Mal mit dem Wollvlies eine Probe machen:[a] Nur das Vlies soll trocken sein, während auf dem ganzen Boden Tau liegt.«[b]'
  to: 'Da sagte Gideon zu Gott: »Lass deinen Zorn nicht gegen mich entbrennen und lass mich nur dieses eine Mal reden. Bitte lass mich nur dieses eine Mal mit dem Vlies einen Versuch machen:[a] Nur das Vlies soll trocken sein, und auf dem ganzen Boden soll Tau liegen.«[b]'
  rationale: Die Überarbeitung macht beide erbetenen Zustände ausdrücklich als Bitte kenntlich, ohne die theologische Spannung der erneuten Probe aufzulösen. Sie ersetzt die missverständliche Fußnotenformulierung durch eine idiomatische Alternative und vermeidet die nicht ausdrücklich im hebräischen Wortlaut stehende Spezifizierung »Woll-«.
