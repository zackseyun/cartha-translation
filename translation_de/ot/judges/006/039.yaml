  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: de
  text: 'Da sagte Gideon zu Gott: »Lass deinen Zorn nicht gegen mich entbrennen und lass mich nur dieses eine Mal reden. Bitte lass mich nur dieses eine Mal mit dem Vlies einen Versuch machen:[a] Nur das Vlies soll trocken sein, und auf dem ganzen Boden soll Tau liegen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bitte lass mich nur dieses eine Mal mit dem Vlies eine Probe machen.« Das hebräische Verb kann sowohl »prüfen« als auch »erproben« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: »Boden« kann auch mit »Land« oder »Erde« übersetzt werden; hier ist der Boden rings um das Vlies gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: Lass deinen Zorn nicht gegen mich entbrennen
  rationale: Bewahrt das hebräische Bild vom entbrennenden Zorn und klingt zugleich in modernem Deutsch natürlich und würdevoll.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: und lass mich nur noch dieses eine Mal reden
  rationale: Der Kohortativ wird als ehrfürchtige Bitte wiedergegeben; die Einschränkung auf ein letztes Mal bleibt deutlich.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם
  choice: Bitte lass mich nur noch dieses eine Mal … eine Probe machen
  rationale: נסה bezeichnet ein Prüfen oder Erproben. »Eine Probe machen« vermeidet im Deutschen die mögliche Fehlvorstellung, Gideon wolle das Wollvlies selbst auf seine Qualität prüfen.
- source_word: בַּגִּזָּה
  choice: mit dem Wollvlies
  rationale: Die Präposition kennzeichnet hier das Mittel beziehungsweise den Gegenstand der Probe. »Wollvlies« bezeichnet die abgeschorene Wolle eindeutig.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: Nur das Vlies soll trocken sein
  rationale: Gibt die örtlich begrenzte Trockenheit idiomatisch wieder, ohne חֹרֶב als großräumige Dürre misszuverstehen.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: während auf dem ganzen Boden Tau liegt
  rationale: הָאָרֶץ bezeichnet im unmittelbaren Gegensatz zum Vlies den umliegenden Boden, nicht notwendig die ganze Erde. »Während« macht den Kontrast natürlich deutlich.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck bezeichnet hier im erzählerischen Zusammenhang den einen Gott; im Deutschen steht der Name ohne Artikel.
theological_decisions:
- issue: Gideons erneute Bitte als Prüfung Gottes
  choice: Die Formulierung zeigt eine vorsichtige Bitte um eine weitere bestätigende Probe, ohne sie ausdrücklich zu billigen oder zu verurteilen.
  alternative: Man könnte »dich prüfen« formulieren und dadurch den möglichen Vorwurf vermessenen Handelns stärker hervorheben; ebenso könnte man die Bitte als bloßes Zeichenbitten abschwächen.
  rationale: Der hebräische Text verbindet Gideons Furcht vor Gottes Zorn mit der ausdrücklichen Bitte um eine weitere Probe. Diese Spannung bleibt erhalten, ohne eine theologische Bewertung hinzuzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das wiederholte »nur noch dieses eine Mal« bildet Gideons nachdrückliche Begrenzung seiner Bitte ab. Die direkte Rede bleibt ehrfürchtig, ohne altertümliche Formen zu verwenden.
