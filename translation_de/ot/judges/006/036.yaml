source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר גִּדְע֖וֹן אֶל הָ/אֱלֹהִ֑ים אִם יֶשְׁ/ךָ֞ מוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: de
  text: 'Da sagte Gideon zu Gott: „Wenn du Israel durch meine Hand retten wirst, wie du gesagt hast,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt diese zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: Der Ausdruck bezeichnet hier eindeutig den Gott Israels, an den Gideon sich wendet. Im Deutschen steht der Eigenname „Gott“ ohne Artikel.
- source_word: אִם
  choice: Wenn
  rationale: Die Konjunktion eröffnet den Bedingungssatz, der erst im folgenden Vers fortgeführt wird.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: du … retten wirst
  rationale: Die Verbindung von יֵשׁ mit Pronominalsuffix und Partizip bezeichnet eine bevorstehende beziehungsweise beabsichtigte Handlung. Das deutsche Futur bewahrt den prospektiven Sinn, ohne Gideons Frage vorschnell als Aussage über Gottes bloße Bereitschaft zu deuten.
- source_word: בְּיָדִי
  choice: durch meine Hand
  rationale: Die konkrete hebräische Wendung für das handelnde Werkzeug bleibt erhalten und ist im Deutschen verständlich; gemeint ist Gottes Rettung durch Gideon.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der Akkusativmarker אֵת bleibt unübersetzt; Israel ist das Objekt der Rettung.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: wie du gesagt hast
  rationale: Die Formulierung verweist auf Gottes vorausgegangene Zusage und klingt zugleich natürlich und würdig.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in Gideons Anrede
  choice: Gott
  alternative: der Gott
  rationale: Im Zusammenhang spricht Gideon den Gott Israels an, nicht irgendeine Gottheit. Die übliche deutsche Schreibung „Gott“ bringt diese bestimmte Referenz zum Ausdruck, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Prospektiver Sinn von יֶשְׁךָ מוֹשִׁיעַ
  choice: du … retten wirst
  alternative: du … retten willst
  rationale: „Retten wirst“ lässt offen, ob der Schwerpunkt auf Absicht, bevorstehender Handlung oder erwarteter Erfüllung liegt. „Retten willst“ könnte im heutigen Deutsch stärker nach bloßer Bereitschaft klingen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Der Satz bleibt bewusst unvollendet, da der mit „Wenn“ eröffnete Bedingungssatz in Richter 6,37 weitergeht.
