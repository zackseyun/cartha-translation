  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: de
  text: 'Da wandte sich Jahwe ihm zu und sagte: „Geh mit dieser deiner Kraft[a] und rette Israel aus der Hand Midians![b] Habe ich dich nicht gesandt?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in dieser deiner Kraft“. Die hebräische Präposition kann ein Mittel („mit“) oder den Bereich beziehungsweise Zustand („in“) bezeichnen; „dieser“ setzt einen besonderen Nachdruck.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „aus der Hand Midians“; „Hand“ ist hier ein Bild für Macht oder Herrschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: Da wandte sich Jahwe ihm zu
  rationale: פנה bezeichnet ein Sichwenden; mit אֵלָיו ist „ihm zuwenden“ im Deutschen natürlich und bewahrt die erzählte Handlung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ wahrt den unmittelbaren Auftrag an Gideon.
- source_word: בְּכֹחֲךָ זֶה
  choice: mit dieser Kraft, die du hast
  rationale: Die Formulierung gibt das demonstrative זֶה und das Possessivsuffix natürlich wieder. בְּ kann hier instrumental („mit“) oder als Sphäre („in“) verstanden werden; diese Mehrdeutigkeit wird in der Fußnote offengehalten.
- source_word: וְהוֹשַׁעְתָּ
  choice: und rette
  rationale: Nach dem vorausgehenden Imperativ hat die Verbform im Zusammenhang den Sinn eines fortgesetzten Auftrags. „Rette“ ist direkt und idiomatisch.
- source_word: מִכַּף מִדְיָן
  choice: aus der Hand Midians
  rationale: Die hebräische Bildrede für Macht oder Herrschaft bleibt erhalten und ist im Deutschen verständlich.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: Habe ich dich nicht gesandt?
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet; „gesandt“ bewahrt zugleich die Auftragssprache von שלח.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Transliteration bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Quelle von Gideons Kraft
  choice: Mehrdeutige Formulierung „mit dieser Kraft, die du hast“
  alternative: „in dieser deiner Kraft“ oder eine ausdrückliche Deutung als von Gott verliehene Kraft
  rationale: Der Vers selbst bestimmt nicht ausdrücklich, ob auf Gideons gegenwärtige Tatkraft, auf die Kraft der göttlichen Beauftragung oder auf beides verwiesen wird. Die Übersetzung legt diese theologische Spannung nicht einseitig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und kraftvoll; „gesandt“ trägt einen leicht feierlichen Ton, ohne altertümlich zu wirken. Die hebräische Bildsprache „aus der Hand“ wird im Haupttext bewahrt.
