  naturalness: Der Stil ist modernes, würdevolles Standarddeutsch. »Bring deinen Sohn heraus, und er soll sterben!« ist als direkte, gewaltsame Forderung idiomatisch und sachgerecht. »Die bei ihm stand« ist natürlich und hält die Ortsbeziehung weniger eng fest.
