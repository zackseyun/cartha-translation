base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: de
  text: 'Da sagten die Männer der Stadt zu Joasch: »Bring deinen Sohn heraus, und er soll sterben! Denn er hat den Altar des Baal niedergerissen und die Aschera[a] umgehauen, die bei ihm stand[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Aschera-Pfahl«. Das hebräische Wort kann den mit der Göttin Aschera verbundenen Kultgegenstand bezeichnen; hier weist »umgehauen« eher auf den Gegenstand als auf die Göttin selbst.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die auf ihm war«. Die hebräische Präposition kann hier auch eine Lage bei oder neben dem Altar bezeichnen.'
    reason: spatial_ambiguity
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Die maskuline Form wird genau wiedergegeben und bezeichnet hier wahrscheinlich die männlichen Akteure der Stadtgemeinschaft.
- source_word: הוֹצֵא
  choice: Bring ... heraus
  rationale: Der Kausativ von יצא fordert Joasch auf, seinen Sohn herauszubringen; die deutsche Formulierung ist klar und idiomatisch.
- source_word: וְיָמֹת
  choice: und er soll sterben
  rationale: Die Verbindung aus Konjunktion und Jussiv drückt den verlangten Tod als Folge des Herausbringens aus, ohne ausdrücklich ein förmliches Hinrichtungsverfahren in den Text einzutragen.
- source_word: נָתַץ
  choice: niedergerissen
  rationale: Das Verb bezeichnet das Einreißen oder Zerstören eines Bauwerks und passt idiomatisch zu einem Altar.
- source_word: מִזְבַּח הַבַּעַל
  choice: den Altar des Baal
  rationale: Die Genitivverbindung gibt die hebräische Constructus-Verbindung klar und sachlich wieder.
- source_word: כָרַת
  choice: umgehauen
  rationale: Bei einem hölzernen Kultgegenstand bezeichnet das Verb das Fällen beziehungsweise Umhauen.
- source_word: הָאֲשֵׁרָה
  choice: die Aschera
  rationale: Die Wiedergabe bewahrt den kultischen Fachbegriff und legt nicht im Haupttext fest, welche genaue Gestalt der mit Aschera verbundene Gegenstand hatte.
- source_word: אֲשֶׁר עָלָיו
  choice: die daneben stand
  rationale: על kann hier die räumliche Nähe zum Altar bezeichnen. „Daneben“ gibt den wahrscheinlichen Sinn natürlich wieder; „stand“ verdeutlicht im Deutschen die örtliche Anordnung, ohne den Gegenstand genauer zu bestimmen.
theological_decisions:
- issue: Bedeutung von אֲשֵׁרָה im polemischen Kultkontext
  choice: die Aschera
  alternative: der Aschera-Pfahl; die Göttin Aschera
  rationale: Das Verb „umhauen“ weist auf einen Kultgegenstand, doch der hebräische Ausdruck bestimmt dessen Form nicht eindeutig. Der Fachbegriff im Haupttext und die alternative Erklärung in der Fußnote erhalten diese Spannung.
- issue: Aussagekraft von וְיָמֹת
  choice: und er soll sterben
  alternative: damit er stirbt; er muss getötet werden
  rationale: Der Jussiv formuliert die Todesforderung. Die gewählte Fassung wahrt diesen Nachdruck, ohne die passive Form einer förmlichen Hinrichtung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist nachdrücklich, bleibt aber nah an der hebräischen Satzfolge. Der kultische Fachbegriff „Aschera“ wird wegen seiner sachlichen Mehrdeutigkeit beibehalten und in einer Fußnote erläutert.
