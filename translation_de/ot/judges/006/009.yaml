source:
  edition: WLC
  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: de
  text: Und ich rettete euch aus der Gewalt Ägyptens und aus der Gewalt all eurer Unterdrücker. Ich vertrieb sie vor euch her und gab euch ihr Land.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: ich rettete
  rationale: Das Verb נצל bezeichnet hier die Rettung oder Befreiung aus fremder Gewalt. „rettete“ ist im modernen Deutsch klar und gibt die konkrete Befreiungstat treffend wieder.
- source_word: מִיַּד
  choice: aus der Gewalt
  rationale: Wörtlich „aus der Hand“. In diesem Zusammenhang bezeichnet die Hand Macht oder Verfügungsgewalt; „aus der Gewalt“ bewahrt den Sinn in natürlichem Deutsch.
- source_word: מִצְרַיִם
  choice: Ägyptens
  rationale: Übliche deutsche Wiedergabe des Orts- und Ländernamens; der Genitiv folgt auf „aus der Gewalt“.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: all eurer Unterdrücker
  rationale: לֹחֲצִים sind Menschen oder Mächte, die bedrängen und unterdrücken. „Unterdrücker“ ist präziser als das allgemeinere „Feinde“.
- source_word: וָאֲגָרֵשׁ
  choice: Ich vertrieb
  rationale: גרש bedeutet vertreiben oder hinausjagen. „vertrieb“ ist würdig, knapp und für den Zusammenhang der Landnahme passend.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die Wendung bedeutet räumlich „vor eurem Angesicht/euch weg“. „vor euch“ erhält das hebräische Bild, ohne im Deutschen unverständlich zu wirken.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: und gab euch ihr Land
  rationale: Direkte und natürliche Wiedergabe von נתן mit indirektem und direktem Objekt; Gottes Handeln bleibt ausdrücklich hervorgehoben.
theological_decisions:
- issue: Gottes Handeln bei Israels Rettung und Landbesitz
  choice: 'Gott bleibt bei allen drei Handlungen das ausdrücklich sprechende Subjekt: Er rettet, vertreibt und gibt.'
  alternative: Die Ereignisse unpersönlicher oder als überwiegend menschliches Handeln formulieren.
  rationale: Die hebräischen Verben in der ersten Person Singular betonen unmittelbar Gottes eigenes Handeln. Die Übersetzung bewahrt diese Aussage, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „aus der Gewalt“ bildet die parallele hebräische Struktur ab. Der zweite Satz vermeidet eine schwerfällige durchgehende Satzkette, wahrt aber die Abfolge und den Nachdruck der göttlichen Ich-Aussagen.
