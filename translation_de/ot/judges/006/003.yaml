source:
  edition: WLC
  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: de
  text: Und sooft Israel säte, zogen Midian, Amalek und die Völker des Ostens gegen Israel[a] herauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier ein männliches Singularpronomen („gegen ihn“), das sich kollektiv auf Israel bezieht.
    reason: Die Fußnote bewahrt die grammatische Form des Hebräischen, während der Haupttext den kollektiven Bezug in natürlichem Deutsch ausdrückt.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Und sooft
  rationale: Die Verbindung leitet hier keinen einmaligen Bedingungsfall, sondern einen wiederkehrenden Vorgang ein. „Sooft“ gibt diesen iterativen Sinn natürlich und knapp wieder.
- source_word: זָרַע
  choice: säte
  rationale: Das Verb bezeichnet das Aussäen von Saatgut; „säte“ ist die direkte und im landwirtschaftlichen Zusammenhang passende Wiedergabe.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier kollektiv das Volk.
- source_word: וְעָלָה … וְעָלוּ
  choice: zogen … herauf
  rationale: עלה bezeichnet die Aufwärtsbewegung beziehungsweise den militärischen Anmarsch. Das deutsche Präteritum drückt im Zusammenhang mit „sooft“ den wiederholten Vorgang aus.
- source_word: מִדְיָן וַעֲמָלֵק
  choice: Midian, Amalek
  rationale: Der hebräische Text verwendet die Eigennamen als kollektive Bezeichnungen für die betreffenden Völker und nicht ausdrücklich die Volksadjektive.
- source_word: וּבְנֵי קֶדֶם
  choice: die Völker des Ostens
  rationale: Wörtlich „Söhne des Ostens“; die gewählte Formulierung vermittelt die regionale und kollektive Bedeutung in verständlichem modernem Deutsch.
- source_word: עָלָיו
  choice: gegen Israel
  rationale: Die Präposition bezeichnet hier feindliches Vorgehen. Die Wiederholung von „Israel“ gibt den kollektiven Bezug des maskulinen Singularsuffixes eindeutig und natürlich wieder, ohne die Form als individuelles männliches Pronomen misszuverstehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende Handlung wird durch „sooft“ mit dem Präteritum klar ausgedrückt; die Eigennamen bleiben entsprechend der hebräischen Form als kollektive Volksbezeichnungen stehen.
