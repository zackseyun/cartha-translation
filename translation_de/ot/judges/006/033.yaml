  text: וְ/כָל מִדְיָ֧ן וַ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם נֶאֶסְפ֣וּ יַחְדָּ֑ו וַ/יַּעַבְר֥וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: de
  text: Da versammelten sich alle Midianiter, Amalekiter und die Völker des Ostens[a]; sie zogen hinüber und schlugen ihr Lager in der Ebene von Jesreel auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne des Ostens«; eine hebräische Bezeichnung für östlich lebende Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: ganz Midian
  rationale: Die kollektive Bezeichnung des Hebräischen wird quellennah bewahrt; gemeint ist hier die versammelte midianitische Streitmacht.
- source_word: וַ/עֲמָלֵק
  choice: Amalek
  rationale: Der Volksname steht wie im Hebräischen kollektiv und wird nicht ausdrücklich zu »die Amalekiter« erweitert.
- source_word: וּ/בְנֵי קֶדֶם
  choice: die Völker des Ostens
  rationale: Die wörtliche Wendung »Söhne des Ostens« bezeichnet idiomatisch östlich lebende Volksgruppen; »Völker des Ostens« ist natürlich und wahrt den ethnisch-geografischen Sinn.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: versammelten sich
  rationale: Die Form bezeichnet das gemeinsame Zusammenkommen; im Deutschen gibt das reflexive Verb den Zusammenhang natürlich wieder, ohne das ohnehin enthaltene Moment des Gemeinsamen unnötig zu verdoppeln.
- source_word: וַ/יַּעַבְרוּ
  choice: zogen hinüber
  rationale: Das Ziel beziehungsweise das überquerte Hindernis bleibt im Hebräischen unausgesprochen. »Zogen hinüber« erhält diese Offenheit und passt zur militärischen Bewegung.
- source_word: וַֽ/יַּחֲנוּ
  choice: lagerten
  rationale: Das Verb חנה bezeichnet hier das Aufschlagen eines militärischen Lagers; »lagerten« ist klar und würdig.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: in der Jesreel-Ebene
  rationale: עֵמֶק kann Tal oder Ebene bezeichnen. »Jesreel-Ebene« ist im Deutschen die geläufige geografische Benennung und passt zur weiten Talsenke.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit erzählerisch-würdigem Ton. Die kollektiven Volksnamen »Midian« und »Amalek« bleiben entsprechend dem hebräischen Ausdruck erhalten; die Satzfolge wird zur natürlichen deutschen Lesbarkeit in zwei Sätze gegliedert.
