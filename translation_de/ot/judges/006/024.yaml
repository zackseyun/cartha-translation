base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: de
  text: Da baute Gideon dort einen Altar für Jahwe und nannte ihn[a] »Jahwe ist Frieden«. Er steht noch heute in Ofra der Abiëseriter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH Schalom; traditionell auch »Jahwe-Schalom« wiedergegeben.'
    reason: Die Fußnote bewahrt die hebräische Namensform und weist auf die verbreitete Transliteration hin.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: Die übliche und natürliche Wiedergabe von בנה beim Errichten eines Altars.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: Der reguläre kultische Ausdruck wird im Deutschen direkt mit »Altar« wiedergegeben.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier Widmung beziehungsweise Bestimmung; »für« ist dafür natürliches Deutsch. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: וַיִּקְרָא לוֹ
  choice: nannte ihn
  rationale: קרא + ל bezeichnet in diesem Zusammenhang die Namensgebung. Das maskuline Pronomen bezieht sich im Deutschen auf »Altar«.
- source_word: יְהוָה שָׁלוֹם
  choice: Jahwe ist Frieden
  rationale: Die verblos formulierte hebräische Benennung wird mit ergänztem »ist« verständlich wiedergegeben, ohne den Aussagegehalt festzulegen oder abzuschwächen.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: »Frieden« ist in der Namensformel knapp und geläufig; die weiteren Bedeutungsnuancen von Wohlergehen und Unversehrtheit bleiben dabei mitgedacht.
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: Er steht noch heute
  rationale: Die Formulierung bringt das Fortbestehen des Altars bis in die Gegenwart des Erzählers in natürlichem Deutsch zum Ausdruck.
- source_word: בְּעָפְרָת
  choice: in Ofra
  rationale: Der Ortsname wird nach üblicher deutscher biblischer Schreibweise transliteriert.
- source_word: אֲבִי הָעֶזְרִי
  choice: das den Abiëseritern gehört
  rationale: Die gentilizische Bezeichnung ordnet Ofra dem abiëseritischen Clan zu; die Relativkonstruktion ist im Deutschen klarer als eine attributive Häufung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Widmung und im Namen des Altars
  choice: Jahwe / Jahwe ist Frieden
  alternative: der HERR / Der HERR ist Frieden; Jahwe-Schalom
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den Eigennamen; die Übersetzung der gesamten Namensformel vermittelt zugleich ihre Bedeutung.
- issue: Aussagekraft der verblosen Formel יְהוָה שָׁלוֹם
  choice: Jahwe ist Frieden
  alternative: Jahwe-Frieden; Jahwe schafft Frieden
  rationale: Die Kopula ist im Hebräischen unausgesprochen. Das deutsche »ist« gibt die naheliegende Nominalaussage wieder, ohne eine stärker kausative Deutung wie »schafft Frieden« einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt erzählerisch knapp. »Er« nimmt den maskulinen »Altar« auf; »das den Abiëseritern gehört« verdeutlicht die Clanzugehörigkeit des Ortes ohne unnötige Fachsprache.
