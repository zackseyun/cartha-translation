base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: de
  text: 'Und ich sagte zu euch: »Ich bin Jahwe, euer Gott. Fürchtet nicht die Götter der Amoriter, in deren Land ihr wohnt. Doch ihr habt nicht auf meine Stimme gehört[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Auf meine Stimme gehört“ kann hier auch mit „mir gehorcht“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: Und ich sagte zu euch
  rationale: Die Wayyiqtol-Form führt die vorausgegangene Rede Jahwes fort. „Sagte“ gibt אמר unmittelbar wieder.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euer Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהִים bezeichnet mit dem Suffix hier eindeutig den einen Gott Israels.
- source_word: לֹא תִירְאוּ
  choice: Fürchtet nicht
  rationale: Die verneinte Imperfektform drückt hier ein Verbot aus. „Fürchtet nicht“ ist im Deutschen direkt, würdig und natürlich.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: die Götter der Amoriter
  rationale: Der hebräische kollektive Singular der Volksbezeichnung wird im Deutschen idiomatisch als Plural „Amoriter“ wiedergegeben.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: in deren Land ihr wohnt
  rationale: Die Relativkonstruktion bezieht sich auf die Amoriter; ישׁב bezeichnet hier das Wohnen beziehungsweise Ansässigsein.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: Doch ihr habt nicht auf meine Stimme gehört
  rationale: Die hebräische Wendung שׁמע בקול wird bildnah wiedergegeben und schließt zugleich den Sinn des Gehorchens ein. „Doch“ macht den Gegensatz zwischen Gebot und Verhalten deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; die Transliteration „Jahwe“ bewahrt diese Unterscheidung gegenüber einem Titel.
- issue: Bedeutung von שׁמע בקול
  choice: auf meine Stimme gehört
  alternative: mir gehorcht
  rationale: Die bildhafte hebräische Formulierung bleibt erhalten, ohne ihren kontextuellen Gehorsamssinn auszuschließen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede und der hebräische Stimmidiom werden bewahrt; unnötig altertümliche Formen werden vermieden.
