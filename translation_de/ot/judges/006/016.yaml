base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: de
  text: 'Und Jahwe sagte zu ihm: „Denn ich werde mit dir sein, und du wirst Midian schlagen, als wäre es ein einziger Mann.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie einen einzigen Mann“. Die hebräische Wendung kann ausdrücken, dass Midian so leicht oder entschieden geschlagen wird, als wäre es nur ein einzelner Mann.'
    reason: Lexikalische Alternative und vorsichtige Erläuterung der idiomatischen hebräischen Wendung
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Und … sagte zu ihm
  rationale: Das narrative Waw mit אמר führt die Handlung fort. Die schlichte deutsche Verbindung wahrt den Erzählfluss, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: כִּי
  choice: Ja
  rationale: כִּי hat hier im Zuspruch eine bekräftigende Funktion. „Ja“ gibt diese Zusicherung knapp und natürlich wieder, ohne den Ausdruck eindeutig kausal festzulegen.
- source_word: אֶהְיֶה עִמָּךְ
  choice: ich werde mit dir sein
  rationale: Der Imperfekt von היה bezeichnet im Zusammenhang der Verheißung Gottes künftigen Beistand.
- source_word: וְהִכִּיתָ
  choice: und du wirst … schlagen
  rationale: Die Verbform bezeichnet hier die zugesagte Folge von Gottes Beistand. „Schlagen“ bleibt nahe an נכה und legt das Ergebnis nicht stärker als nötig auf „besiegen“ fest.
- source_word: אֶת מִדְיָן
  choice: Midian
  rationale: Wie im Hebräischen bezeichnet der Name hier kollektiv das feindliche Volk beziehungsweise dessen Streitmacht.
- source_word: כְּאִישׁ אֶחָד
  choice: wie einen einzigen Mann
  rationale: Die konkrete singularische Bildsprache des Hebräischen bleibt erhalten. Im Zusammenhang wird Midian als eine einzige, geschlossen zu treffende Größe dargestellt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug und Aussage von כְּאִישׁ אֶחָד
  choice: wie einen einzigen Mann
  alternative: wie ein Mann; als wäre es nur ein Mann
  rationale: Die Übersetzung bewahrt das mehrdeutige hebräische Bild. Es kann hervorheben, dass Midian als geschlossene Einheit beziehungsweise so entschieden geschlagen wird, als wäre das ganze Volk nur ein einzelner Mann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am hebräischen Zuspruch, ohne im Deutschen steif zu wirken. Die Fußnotenmarke steht unmittelbar bei der erläuterten Wendung.
