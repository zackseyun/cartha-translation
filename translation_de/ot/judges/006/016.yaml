  terminology: „Jahwe“ ist eine geeignete Wiedergabe von יְהוָה. „Midian“ und „schlagen“ bewahren die Terminologie und den Grad der Aussage des hebräischen Textes. Die Fußnote soll die möglichen Nuancen der idiomatischen Wendung nennen, ohne eine einzelne Deutung als gesichert auszugeben.
