base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: de
  text: Da bekleidete der Geist Jahwes Gideon[a]. Er blies das Schofar[b], und die Sippe Abiëser wurde aufgeboten, ihm zu folgen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Geist Jahwes kam über Gideon.« Wörtlich: »Der Geist Jahwes bekleidete Gideon.«'
    reason: lexical_alternative
  - marker: b
    text: Ein Schofar ist ein Horn, das als Signalinstrument verwendet wurde.
    reason: cultural_note
  - marker: c
    text: 'Oder: »und Abiëser wurde hinter ihm her aufgeboten«. Die Wendung kann das Sammeln zur Unterstützung Gideons bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: רוּחַ bezeichnet hier im Zusammenhang der göttlichen Befähigung den Geist; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: לָבְשָׁה אֶת־גִּדְעוֹן
  choice: bekleidete Gideon
  rationale: Die ungewöhnliche, kraftvolle Metapher des hebräischen Verbs לבשׁ (»bekleiden/anziehen«) bleibt erhalten, statt sie mit »kam über« aufzulösen.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Er blies das Schofar
  rationale: שׁוֹפָר bezeichnet ein als Signalinstrument verwendetes Horn. Das im Deutschen gebräuchliche Lehnwort bewahrt die kulturelle Besonderheit.
- source_word: וַיִּזָּעֵק
  choice: wurde zusammengerufen
  rationale: 'Der Nifal lässt sich hier passiv verstehen: Die Sippe wurde durch das Hornsignal aufgeboten beziehungsweise zum Anschluss an Gideon gesammelt.'
- source_word: אֲבִיעֶזֶר
  choice: Abiëser
  rationale: Der Eigenname bezeichnet in diesem Zusammenhang kollektiv die Sippe Abiëser; die deutsche Umschrift folgt der hebräischen Namensform.
- source_word: אַחֲרָיו
  choice: ihm zu folgen
  rationale: Die Wendung bedeutet wörtlich »hinter ihm/her«, bezeichnet hier aber wahrscheinlich das Sammeln zur Unterstützung und Gefolgschaft Gideons.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird transparent als »Jahwe« wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bild für die Wirkung des Geistes auf Gideon
  choice: der Geist Jahwes bekleidete Gideon
  alternative: der Geist Jahwes kam über Gideon
  rationale: Die Übersetzung bewahrt das auffällige hebräische Bild und legt nicht näher fest, wie das Verhältnis zwischen Geist und Gideon ontologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Bekleidungsmetapher bleibt im Haupttext erhalten; Fußnoten erläutern die idiomatischere Alternative, das Schofar und die mehrdeutige Formulierung für das Aufgebot der Sippe.
