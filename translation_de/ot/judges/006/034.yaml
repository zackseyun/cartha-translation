revisions:
- from: Da bekleidete der Geist Jahwes Gideon[a]. Er blies das Schofar[b], und Abiëser wurde zusammengerufen, ihm zu folgen[c].
  to: Da bekleidete der Geist Jahwes Gideon[a]. Er blies das Schofar[b], und die Sippe Abiëser wurde aufgeboten, ihm zu folgen[c].
  rationale: Die Revision macht die kollektive Bedeutung von Abiëser im Haupttext transparent und ersetzt die missverständliche wörtliche Erläuterung in Fußnote c durch eine sprachlich klare, quellennahe Alternative. Die Metapher des Bekleidens, der Gottesname und die terminologische Entscheidung für „Schofar“ bleiben unverändert.
