  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: de
  text: Da streckte der Engel Jahwes den Stab, den er in der Hand hielt, mit seiner Spitze aus und berührte damit das Fleisch[a] und die ungesäuerten Brote. Feuer stieg aus dem Felsen empor und verzehrte das Fleisch und die ungesäuerten Brote. Dann ging der Engel Jahwes ihm aus den Augen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Fleisch«; hier ist zubereitetes Fleisch als Speise gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ging von seinen Augen fort«; das heißt, er war für Gideon nicht mehr sichtbar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; das übernatürliche Handeln in diesem Zusammenhang legt im Deutschen »Engel« nahe, während die hebräische Verbindung mit dem Gottesnamen erhalten bleibt.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: die Spitze des Stabes
  rationale: קָצֶה bezeichnet das Ende oder äußerste Ende, מִשְׁעֶנֶת einen Stab beziehungsweise eine Stütze; die Formulierung gibt das konkrete Bild natürlich wieder.
- source_word: וַיִּשְׁלַח
  choice: streckte … aus
  rationale: Mit der Stabspitze als Objekt bezeichnet das Verb hier das Ausstrecken, nicht das Senden.
- source_word: וַיִּגַּע
  choice: berührte
  rationale: נגע bedeutet gewöhnlich »berühren«; der Text verlangt keine stärkere Handlung wie Schlagen.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: Das deutsche »Fleisch« deckt sowohl die wörtliche Bedeutung als auch den kulinarischen Bezug auf die zubereitete Opfergabe ab.
- source_word: מַצּוֹת
  choice: ungesäuerte Brote
  rationale: Der Plural wird bewahrt; »ungesäuert« gibt das wesentliche Merkmal der Speise klar und traditionsnah wieder.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: Feuer stieg aus dem Felsen empor
  rationale: Die Formulierung bewahrt die im Hebräischen ausgedrückte Aufwärtsbewegung und den Ursprung des Feuers im beziehungsweise am Felsen.
- source_word: וַתֹּאכַל
  choice: verzehrte
  rationale: Das Verb bedeutet wörtlich »aß«; bei Feuer ist »verzehrte« die natürliche deutsche Entsprechung.
- source_word: הָלַךְ מֵעֵינָיו
  choice: entschwand … seinen Blicken
  rationale: Die Wendung bedeutet wörtlich, dass er von Gideons Augen fortging. Die deutsche Formulierung drückt aus, dass er nicht mehr sichtbar war, ohne ausdrücklich die Art seines Fortgangs festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Identität und Bezeichnung von מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Das Substantiv kann sprachlich »Bote« oder »Engel« heißen. Wegen des übernatürlichen Zeichens ist »Engel« kontextuell passend; eine weitergehende dogmatische Identifizierung der Gestalt wird nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerisch natürlichem Satzfluss. »Da« setzt die Handlung fort; »entschwand seinen Blicken« ist gehoben, aber allgemein verständlich. Die genuine Mehrdeutigkeit von מַלְאָךְ wird in den Entscheidungen dokumentiert, ohne die Übersetzung mit einer unnötigen Fußnote zu überladen.
