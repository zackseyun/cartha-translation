revisions:
- from: Da streckte der Engel Jahwes die Spitze des Stabes aus, den er in der Hand hielt, und berührte das Fleisch[a] und die ungesäuerten Brote. Feuer stieg aus dem Felsen empor und verzehrte das Fleisch und die ungesäuerten Brote. Dann entschwand der Engel Jahwes seinen Blicken.[b]
  to: Da streckte der Engel Jahwes den Stab, den er in der Hand hielt, mit seiner Spitze aus und berührte damit das Fleisch[a] und die ungesäuerten Brote. Feuer stieg aus dem Felsen empor und verzehrte das Fleisch und die ungesäuerten Brote. Dann ging der Engel Jahwes ihm aus den Augen.[b]
  rationale: Die Revision glättet die deutsche Syntax bei der Verwendung des Stabes und ersetzt die potenziell stärker deutende Formulierung »entschwand seinen Blicken« durch eine idiomatische Wiedergabe des Fortgehens aus Gideons Sichtfeld. Die Fußnote zu »Fleisch« bleibt lexikalisch und kontextbezogen, ohne die Opferkategorie als zusätzliche Aussage des Einzelworts festzulegen.
