source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: de
  text: 'Da sandte Jahwe einen Mann, einen Propheten, zu den Israeliten. Er sagte zu ihnen: »So spricht Jahwe, der Gott Israels: Ich habe euch aus Ägypten heraufgeführt und euch aus dem Sklavenhaus herausgeführt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das narrative Waw führt die Handlung fort; »Da« gibt die zeitlich-narrative Folge im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: אִישׁ נָבִיא
  choice: einen Mann, einen Propheten
  rationale: Die appositionale Verbindung beider Substantive bleibt erhalten, ohne sie auf das bloße »einen Propheten« zu verkürzen.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: zu den Israeliten
  rationale: Die feste kollektive Bezeichnung bedeutet hier idiomatisch das Volk Israel; »Israeliten« ist im modernen Deutschen natürlicher als das missverständliche »Söhne Israels«.
- source_word: וַיֹּאמֶר לָהֶם
  choice: Er sagte zu ihnen
  rationale: Ein neuer deutscher Satz macht den Bezug des männlichen Singulars auf den zuvor genannten Propheten klar und wahrt den Erzählfluss.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die etablierte, würdige deutsche Wiedergabe der prophetischen Botenformel; das Präsens vergegenwärtigt die übermittelte Gottesrede.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Bundesbezeichnung wird klar und eng am hebräischen Genitivverhältnis wiedergegeben.
- source_word: אָנֹכִי הֶעֱלֵיתִי
  choice: Ich habe euch ... heraufgeführt
  rationale: Die eigenständige Form אָנֹכִי unterstreicht das göttliche Ich; die deutsche Voranstellung von »Ich« bewahrt diese Betonung hinreichend. Der Hifil von עלה bezeichnet das Heraufführen aus Ägypten.
- source_word: וָאֹצִיא
  choice: und euch ... herausgeführt
  rationale: Der Hifil von יצא bezeichnet das Veranlassen des Herausgehens; »herausgeführt« bewahrt sowohl Richtung als auch Befreiungsmotiv.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Die kompakte deutsche Zusammensetzung bewahrt das konkrete Bild von בֵּית und gibt den durch עֲבָדִים bezeichneten Ort beziehungsweise Zustand der Knechtschaft natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Die Wiedergabe »Jahwe« bewahrt den Namen, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Kollektivbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung bezeichnet hier das Volk Israel insgesamt. »Israeliten« wahrt den sachlichen Umfang und vermeidet im heutigen Deutschen die mögliche Fehlvorstellung, nur unmittelbar leibliche Söhne oder ausschließlich Männer seien gemeint.
- issue: Bildsprache von בֵּית עֲבָדִים
  choice: Sklavenhaus
  alternative: Haus der Sklaverei
  rationale: »Sklavenhaus« erhält die konkrete Hausmetapher und bezeichnet zugleich verständlich den Ort der Versklavung, ohne die Wendung unnötig zu abstrahieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel bleibt traditionell und prägnant; zugleich werden schwerfällige Hebraismen vermieden. Die Wiederholung von »geführt« entspricht der parallelen hebräischen Aussage und unterstreicht Jahwes befreiendes Handeln.
