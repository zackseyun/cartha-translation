source:
  edition: WLC
  text: כִּ֡י הֵם֩ וּ/מִקְנֵי/הֶ֨ם יַעֲל֜וּ וְ/אָהֳלֵי/הֶ֗ם יבאו כְ/דֵֽי אַרְבֶּה֙ לָ/רֹ֔ב וְ/לָ/הֶ֥ם וְ/לִ/גְמַלֵּי/הֶ֖ם אֵ֣ין מִסְפָּ֑ר וַ/יָּבֹ֥אוּ בָ/אָ֖רֶץ לְ/שַׁחֲתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: de
  text: Denn wenn sie mit ihrem Vieh heraufzogen, kamen ihre Zeltlager so zahlreich wie Heuschrecken[a]. Sie und ihre Kamele waren nicht zu zählen. So drangen sie in das Land ein, um es zu verwüsten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihre Zelte kamen zahlreich wie Heuschrecken.“ Mit den Zelten sind die Lager der Eindringlinge gemeint.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „um es zu zerstören“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die im Zusammenhang geschilderte Verarmung Israels ein.
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: wenn sie mit ihrem Vieh heraufzogen
  rationale: Der Imperfekt beschreibt wiederholtes Geschehen in der Vergangenheit. Die koordinierte hebräische Form wird im Deutschen natürlich mit „mit ihrem Vieh“ wiedergegeben.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: kamen ihre Zeltlager
  rationale: „Zelte“ steht metonymisch für die Lager der Eindringlinge; „Zeltlager“ bewahrt das Bild und ist im Deutschen unmittelbar verständlich.
- source_word: כְּדֵי אַרְבֶּה לָרֹב
  choice: so zahlreich wie Heuschrecken
  rationale: Gibt den Vergleich und den Gedanken der überwältigenden Menge idiomatisch wieder.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Sie und ihre Kamele waren nicht zu zählen
  rationale: Bewahrt die Betonung, dass sowohl die Menschen als auch ihre Kamele zahllos erschienen.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: So drangen sie in das Land ein
  rationale: „Eindringen“ passt zum feindlichen Einfall; „so“ führt die Erzählfolge natürlich fort.
- source_word: לְשַׁחֲתָהּ
  choice: um es zu verwüsten
  rationale: Im Zusammenhang bezeichnet שׁחת die verheerende Schädigung des Landes; „verwüsten“ ist präziser als eine Aussage über dessen völlige Vernichtung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Einfälle werden durch die Vergangenheitskonstruktion mit „wenn“ ausgedrückt; die konkrete Bildsprache der Zelte und Heuschrecken bleibt erhalten.
