  source_fidelity: Der Text gibt die wiederholten Einfälle durch die Vergangenheitskonstruktion mit „wenn ... heraufzogen“ zutreffend wieder. „mit ihrem Vieh“ fasst die im Hebräischen koordinierte Nennung von Angreifern und Vieh idiomatisch zusammen. Die Metonymie der „Zelte“ als „Zeltlager“, der Heuschreckenvergleich, die Unzählbarkeit von Menschen und Kamelen sowie der Zweck des Eindringens werden sachgerecht wiedergegeben.
