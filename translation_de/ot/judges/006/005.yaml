  terminology: „Vieh“, „Zeltlager“, „Kamele“ und „verwüsten“ sind kontextgerecht. „Verwüsten“ ist für שׁחת in diesem Zusammenhang eine tragfähige, nicht überzogene Wiedergabe; die Alternative „zerstören“ ist korrekt als Fußnote vermerkt.
