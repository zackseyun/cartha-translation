  terminology: „Jahwe“ gibt den im Ausgangstext stehenden Gottesnamen wieder; die Fußnote informiert sachgerecht über die traditionelle Wiedergabe. „Die Israeliten“ ist als korporative deutsche Wiedergabe von בְנֵי יִשְׂרָאֵל idiomatisch und wird durch die wörtliche Fußnote transparent gemacht.
