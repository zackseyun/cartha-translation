  source_fidelity: Die Übersetzung gibt וַיִּדַּל ... מְאֹד angemessen als „wurde ... sehr geschwächt“ wieder und vermeidet damit die zu enge Festlegung auf wirtschaftliche Armut. „durch Midian“ trifft die kausale Funktion von מִפְּנֵי. Der Notschrei zu Jahwe entspricht וַיִּזְעֲקוּ ... אֶל־יְהוָה; „um Hilfe“ macht die in זעק liegende Notlage idiomatisch explizit, ohne den Sinn zu verändern.
