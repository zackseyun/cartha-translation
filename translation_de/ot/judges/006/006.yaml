reference: Judges 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּדַּ֧ל יִשְׂרָאֵ֛ל מְאֹ֖ד מִ/פְּנֵ֣י מִדְיָ֑ן וַ/יִּזְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: de
  text: So wurde Israel durch Midian sehr geschwächt[a], und die Israeliten[b] schrien zu Jahwe[c] um Hilfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So wurde Israel durch Midian sehr erniedrigt« beziehungsweise »sehr arm«. Das hebräische Verb kann bedeuten, dass jemand geschwächt, vermindert, verarmt oder tief herabgebracht wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Söhne Israels«; eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch JHWH; traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל
  choice: wurde … sehr geschwächt
  rationale: Das Verb דל bezeichnet hier, dass Israel unter der Unterdrückung stark vermindert, geschwächt oder erniedrigt wurde. Die Formulierung wahrt die Bedeutungsbreite und legt den Zustand nicht ausschließlich wirtschaftlich als Verarmung aus.
- source_word: מְאֹד
  choice: sehr
  rationale: Die übliche deutsche Intensivierung gibt die adverbiale Verstärkung klar und natürlich wieder.
- source_word: מִפְּנֵי מִדְיָן
  choice: durch Midian
  rationale: 'Die Präposition bezeichnet im Kontext die Ursache: Midians Unterdrückung führte Israels geschwächten Zustand herbei.'
- source_word: וַיִּזְעֲקוּ
  choice: schrien … um Hilfe
  rationale: זעק bezeichnet einen dringlichen Schrei aus Not. Im Deutschen macht »um Hilfe schreien« den situationsbedingten Sinn natürlich deutlich, ohne bereits eine ausdrückliche Bitte zu formulieren.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht »die Söhne Israels«; als feste kollektive Volksbezeichnung meint der Ausdruck hier das Volk Israel insgesamt. »Die Israeliten« ist dafür im modernen Deutschen klar und idiomatisch.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל gibt die Richtung des Hilferufs an. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bildet ihn als Eigennamen ab; die traditionelle Ersatzlesung »der HERR« wird in einer Fußnote genannt.
- issue: Kollektive Bedeutung von בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die wörtlich maskuline Form ist hier eine etablierte Bezeichnung des gesamten Volkes, nicht nur seiner männlichen Angehörigen. Die idiomatische Übersetzung verhindert eine sachlich irreführende Einschränkung; die Form des Hebräischen bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sehr geschwächt« bewahrt die Breite des hebräischen Verbs besser als das ausschließlich wirtschaftlich klingende »sehr arm«. Der Hilferuf wird idiomatisch formuliert; die wörtlichen beziehungsweise traditionellen Alternativen werden transparent in Fußnoten ausgewiesen.
