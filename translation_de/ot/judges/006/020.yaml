source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: de
  text: 'Da sagte der Engel Gottes zu ihm[a]: »Nimm das Fleisch und die ungesäuerten Brote, lege sie auf diesen Felsen und gieß die Brühe darüber aus.« Und er tat es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Gottes«. Das hebräische Wort kann sowohl einen menschlichen Boten als auch einen himmlischen Gesandten bezeichnen; hier spricht der Zusammenhang für einen übernatürlichen Gesandten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: der Engel Gottes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten. Im erzählerischen Zusammenhang ist ein übernatürlicher Gesandter gemeint; die Fußnote bewahrt die lexikalische Alternative.
- source_word: קַח
  choice: Nimm
  rationale: Der Imperativ von לקח bedeutet unmittelbar »nehmen«; eine Richtungsangabe wie bei »bringen« steht nicht ausdrücklich im Verb.
- source_word: הַבָּשָׂר
  choice: das Fleisch
  rationale: Im Speisekontext bezeichnet בָּשָׂר das zum Essen zubereitete Fleisch; »Fleisch« ist im Deutschen natürlich und präzise.
- source_word: הַמַּצּוֹת
  choice: die ungesäuerten Brote
  rationale: מַצּוֹת bezeichnet ungesäuerte Backwaren im Plural. »Ungesäuerte Brote« erhält hier den Plural und bleibt allgemein verständlich.
- source_word: וְהַנַּח
  choice: lege sie
  rationale: Der Hifil-Imperativ von נוח bedeutet hier »hinlegen« oder »platzieren«. Das Pronomen nimmt beide zuvor genannten Speisen auf.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: auf diesen Felsen
  rationale: סֶלַע bezeichnet einen Felsen oder Felsblock; mit dem Verb des Ablegens gibt »auf« die räumliche Beziehung idiomatisch wieder. הַלָּז weist auf den betreffenden Felsen hin.
- source_word: הַמָּרַק
  choice: die Brühe
  rationale: מָרָק bezeichnet Brühe beziehungsweise Kochflüssigkeit; »Brühe« ist die treffende heutige Entsprechung.
- source_word: שְׁפֹוךְ
  choice: gieß ... darüber aus
  rationale: שפך bedeutet »(aus)gießen«. »Darüber« macht im Deutschen natürlich deutlich, dass die Brühe auf den Felsen beziehungsweise über die dort abgelegten Speisen gegossen werden soll, ohne ein neues Ziel einzuführen.
- source_word: וַיַּעַשׂ כֵּן
  choice: Und er tat es
  rationale: Die knappe Wendung berichtet, dass Gideon die Anweisung ausführte. »Er tat es« ist gegenwärtiges, natürliches Deutsch.
theological_decisions:
- issue: Bezeichnung des göttlichen Gesandten in einem theophanischen Zusammenhang
  choice: der Engel Gottes
  alternative: der Bote Gottes
  rationale: Das hebräische מַלְאַךְ lässt beide Wiedergaben zu. Der Kontext von Richter 6 spricht für einen übernatürlichen Gesandten, doch die Fußnote hält die eigentliche Wortbreite offen und legt das genaue Verhältnis zwischen Gesandtem und Gotteserscheinung nicht weiter fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und handlungsorientiert; »ungesäuerte Brote« erhält die grammatische Mehrzahl des Hebräischen.
