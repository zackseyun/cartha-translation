  text: וַ/יִּקְרָא ל֥/וֹ בַ/יּוֹם הַ/ה֖וּא יְרֻבַּ֣עַל לֵ/אמֹ֑ר יָ֤רֶב בּ/וֹ֙ הַ/בַּ֔עַל כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: de
  text: 'An jenem Tag nannte er ihn Jerubbaal[a] und sagte: »Baal soll gegen ihn streiten[b], weil er seinen Altar niedergerissen hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Name Jerubbaal klingt an das hebräische Verb für »streiten« an; die folgende Aussage erklärt ihn: »Baal soll gegen ihn streiten.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Baal möge gegen ihn streiten.« Das Hebräische kann als Wunsch beziehungsweise Aufforderung verstanden werden. Möglich ist auch die Aussage: »Baal wird gegen ihn streiten.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: nannte er ihn
  rationale: קרא mit ל und Pronominalsuffix bezeichnet hier die Benennung. Die singuläre Subjektform bleibt als »er« erhalten, ohne den im Vers nicht ausdrücklich genannten Bezug festzulegen.
- source_word: בַיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Gibt die mit ב eingeleitete Zeitangabe natürlich und in einem würdigen modernen Erzählstil wieder.
- source_word: יְרֻבַּעַל
  choice: Jerubbaal
  rationale: Der Eigenname wird transliteriert; sein Wortspiel mit ריב wird durch den anschließenden Erklärungssatz und eine Fußnote sichtbar gemacht.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Leitet die wörtliche Erklärung der Namensgebung idiomatisch ein.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: Baal soll gegen ihn streiten
  rationale: Die Form wird am ehesten als Jussiv verstanden. »streiten« bewahrt den weiten gegnerischen Sinn von ריב und zugleich den Anklang an Jerubbaal.
- source_word: כִּי
  choice: weil
  rationale: Kennzeichnet hier den Grund für die Aufforderung beziehungsweise die Namensgebung.
- source_word: נָתַץ
  choice: niedergerissen hat
  rationale: נתץ bezeichnet das Niederreißen oder Zerstören eines Bauwerks, besonders eines Altars.
- source_word: אֶת מִזְבְּחוֹ
  choice: seinen Altar
  rationale: Das maskuline Suffix bezieht sich im unmittelbaren Zusammenhang am natürlichsten auf Baal; das Pronomen des Hebräischen bleibt gewahrt.
theological_decisions:
- issue: Wiedergabe von בַּעַל im polemischen Zusammenhang
  choice: Baal
  alternative: der Herr
  rationale: בעל bezeichnet hier die kanaanäische Gottheit. Der Eigenname »Baal« bewahrt die Götzenpolemik und verhindert eine Verwechslung mit dem HERRN.
- issue: Modalität von יָרֶב
  choice: Baal soll gegen ihn streiten
  alternative: Baal wird gegen ihn streiten
  rationale: Die Form kann als jussivischer Wunsch beziehungsweise Aufforderungssatz oder als indikativische Aussage verstanden werden. Der Haupttext folgt der wahrscheinlich jussivischen Lesart; die echte Mehrdeutigkeit wird in der Fußnote genannt.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die hebräische Wortstellung wurde zugunsten eines natürlichen deutschen Satzes leicht geglättet; Namenswortspiel und modale Mehrdeutigkeit bleiben durch Fußnoten erhalten.
