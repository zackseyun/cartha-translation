source:
  edition: WLC
  text: אַל נָ֨א תָמֻ֤שׁ מִ/זֶּה֙ עַד בֹּאִ֣/י אֵלֶ֔י/ךָ וְ/הֹֽצֵאתִי֙ אֶת מִנְחָתִ֔/י וְ/הִנַּחְתִּ֖י לְ/פָנֶ֑י/ךָ וַ/יֹּאמַ֕ר אָנֹכִ֥י אֵשֵׁ֖ב עַ֥ד שׁוּבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: de
  text: '»Geh bitte nicht von hier fort, bis ich zu dir komme, meine Gabe[a] herausbringe und sie vor dir niederlege.« Er sagte: »Ich werde bleiben, bis du zurückkommst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Opfergabe“ beziehungsweise „Tribut“. Das hebräische Wort kann allgemein eine dargebrachte Gabe und in bestimmten Zusammenhängen eine Opfergabe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: geh … nicht von hier fort
  rationale: Das Verb מוש bezeichnet hier das Weggehen vom gegenwärtigen Ort. Die deutsche Wendung ist natürlich und gibt Gideons Bitte wieder, der Besucher möge an Ort und Stelle bleiben.
- source_word: נָא
  choice: bitte
  rationale: Die Partikel kennzeichnet eine höfliche, nachdrückliche Bitte; „bitte“ entspricht dem heutigen deutschen Sprachgebrauch.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: bis ich zu dir komme
  rationale: Der Infinitiv mit Suffix wird im Deutschen idiomatisch als Nebensatz wiedergegeben.
- source_word: וְהוֹצֵאתִי
  choice: herausbringe
  rationale: Der Hifil von יצא bezeichnet, dass Gideon die vorbereitete Gabe von einem anderen Ort heraus- und zu dem Besucher bringt.
- source_word: מִנְחָתִי
  choice: meine Gabe
  rationale: מִנְחָה kann eine dargebrachte Gabe, einen Tribut oder eine Opfergabe bezeichnen. „Gabe“ bewahrt im Deutschen die lexikalische Offenheit, ohne die im Fortgang entstehende kultische Bedeutung auszuschließen.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: und sie vor dir niederlege
  rationale: Die Formulierung gibt das Platzieren der Gabe in der Gegenwart des Besuchers natürlich und zugleich würdevoll wieder.
- source_word: אָנֹכִי אֵשֵׁב
  choice: Ich werde bleiben
  rationale: ישב bedeutet wörtlich oft „sitzen“, bezeichnet hier aber das Verbleiben an einem Ort.
- source_word: עַד שׁוּבֶךָ
  choice: bis du zurückkommst
  rationale: Der Infinitiv mit Suffix wird als natürlicher deutscher Temporalsatz wiedergegeben.
theological_decisions:
- issue: Bedeutung von מִנְחָה bei Gideons Darbringung
  choice: Gabe
  alternative: Opfergabe; Tribut
  rationale: Der Erzählzusammenhang entwickelt zwar kultische Züge, doch das hebräische Wort legt an dieser Stelle nicht eindeutig eine formelle Opferkategorie fest. „Gabe“ erhält diese Spannung; die Fußnote nennt die religiöse und politische Bedeutungsnuance.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und höflich; die lexikalische Mehrdeutigkeit von מִנְחָה wird im Haupttext bewahrt und in der Fußnote erläutert.
