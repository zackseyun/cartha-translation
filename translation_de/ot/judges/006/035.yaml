  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: de
  text: Und er sandte Boten durch ganz Manasse, und auch Manasse wurde aufgerufen, ihm zu folgen. Ebenso sandte er Boten durch Asser, Sebulon und Naftali; und sie zogen hinauf, ihnen entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Worauf sich „ihnen“ bezieht, wird im Hebräischen nicht ausdrücklich gesagt. Wahrscheinlich sind die feindlichen Heere gemeint; möglich ist auch ein Bezug auf Gideon und seine Streitkräfte.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im Zusammenhang der militärischen Mobilmachung sind menschliche Überbringer des Aufrufs gemeint, nicht Engel.
- source_word: בְּכָל מְנַשֶּׁה
  choice: durch ganz Manasse
  rationale: Die Präposition bezeichnet hier die Verbreitung des Aufrufs im gesamten Stammesgebiet beziehungsweise Stammesverband.
- source_word: וַיִזָּעֵק
  choice: wurde aufgerufen
  rationale: 'Die Niphal-Form hat hier im militärischen Zusammenhang passiven Sinn: Manasse wurde zum Aufgebot gerufen.'
- source_word: אַחֲרָיו
  choice: ihm zu folgen
  rationale: Die Wendung bezeichnet das Sich-Gideon-Anschließen; die natürliche deutsche Formulierung macht diesen Mobilisierungssinn deutlich.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: durch Asser, Sebulon und Naftali
  rationale: Die wiederholte Präposition stellt die Stammesgebiete als Bereiche dar, durch die die Boten zogen.
- source_word: וַיַּעֲלוּ
  choice: sie zogen hinauf
  rationale: Bewahrt sowohl die Grundbedeutung des Hinaufziehens als auch den militärischen Bewegungssinn.
- source_word: לִקְרָאתָם
  choice: ihnen entgegen
  rationale: Das hebräische Suffix ist plural. Sein Bezug bleibt im unmittelbaren Wortlaut unausgesprochen und wird daher nicht durch eine erklärende Ergänzung festgelegt.
theological_decisions:
- issue: Bezug des Pluralsuffixes in לִקְרָאתָם
  choice: 'Plural im Haupttext bewahren: „ihnen entgegen“'
  alternative: Gemeint könnten Gideon und seine Streitkräfte sein; manche verstehen die Bewegung als ein Entgegenziehen zu Gideon.
  rationale: Das Suffix ist eindeutig plural, sein Bezugswort jedoch nicht ausdrücklich genannt. Wahrscheinlich bezieht es sich im militärischen Zusammenhang auf die gegnerischen Heere; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufgerufen“ ist allgemein verständlich und gibt den militärischen Aufgebotssinn wieder, ohne altertümlich zu wirken. Die Stammesnamen folgen den im Deutschen geläufigen Formen.
