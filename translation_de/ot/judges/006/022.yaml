base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: de
  text: 'Da erkannte Gideon, dass er der Engel Jahwes[a] war. Gideon sagte: »Ach, Herr Jahwe! Denn ich habe den Engel Jahwes von Angesicht zu Angesicht gesehen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«. Das hebräische Wort kann sowohl »Engel« als auch »Bote« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Da erkannte
  rationale: ראה bedeutet grundsätzlich „sehen“, bezeichnet mit folgendem כִּי hier aber das Erkennen der Identität des Gegenübers. „Da erkannte“ gibt den fortschreitenden Erzählzusammenhang und den inhaltlichen Sinn natürlich wieder.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Der Zusammenhang beschreibt einen übernatürlichen Gesandten; „Engel“ passt daher im Haupttext, während die lexikalische Alternative in einer Fußnote erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden Eigennamen statt eines ersetzenden Titels abzubilden.
- source_word: אֲהָהּ
  choice: Ach
  rationale: Die Interjektion drückt Gideons Erschrecken und Bestürzung aus. „Ach“ ist knapp, würdig und im modernen Deutschen verständlich.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Die Wiedergabe bewahrt sowohl den Titel אֲדֹנָי als auch den Gottesnamen יְהוָה, ohne beide zu einem einzigen Ausdruck zu verschmelzen.
- source_word: כִּי עַל כֵּן
  choice: ja
  rationale: Die Partikelfolge begründet beziehungsweise unterstreicht Gideons erschrockenen Ausruf. Das deutsche „ja“ vermittelt hier idiomatisch den Grund seiner Bestürzung.
- source_word: רָאִיתִי
  choice: ich habe ... gesehen
  rationale: Das Perfekt bezeichnet das unmittelbar vorausgegangene Geschehen mit gegenwärtiger Folge; das deutsche Perfekt ist in direkter Rede natürlich.
- source_word: פָּנִים אֶל פָּנִים
  choice: von Angesicht zu Angesicht
  rationale: Die feste, würdige deutsche Wendung bewahrt das hebräische Bild einer unmittelbaren persönlichen Begegnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: „Engel“ entspricht dem übernatürlichen Kontext, doch die mögliche Bedeutung „Bote“ wird in der Fußnote ausdrücklich bewahrt. Die Übersetzung legt die genaue theologische Identität der Gestalt nicht weiter fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Von Angesicht zu Angesicht“ erhält die feierliche Bildsprache; der kurze Ausruf gibt Gideons unmittelbares Erschrecken wieder.
