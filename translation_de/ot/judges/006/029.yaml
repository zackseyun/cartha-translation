base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: de
  text: 'Da fragte einer den anderen: »Wer hat das getan?« Sie forschten nach und suchten; dann sagten sie: »Gideon, der Sohn Joaschs, hat das getan.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: einer den anderen
  rationale: Die hebräische Wendung bezeichnet das wechselseitige Fragen unter den Männern des Ortes. Die deutsche Formulierung gibt diesen verteilenden Sinn natürlich und prägnant wieder.
- source_word: מִי
  choice: Wer
  rationale: Direkte Wiedergabe des Fragepronomens, das nach dem Urheber der Tat fragt.
- source_word: עָשָׂה הַדָּבָר הַזֶּה
  choice: hat das getan
  rationale: Im Kontext bezeichnet דָּבָר die entdeckte Tat. „Hat das getan“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „Sache“ und entspricht der abgeschlossenen Handlung.
- source_word: וַיִּדְרְשׁוּ וַיְבַקְשׁוּ
  choice: sie forschten nach und suchten
  rationale: 'Die beiden Verben der Ermittlung bleiben unterschieden: דרשׁ bezeichnet das Nachforschen beziehungsweise Erkunden, בקשׁ das Suchen.'
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: Gideon, der Sohn Joaschs
  rationale: Der hebräische Vatersname wird in einer natürlichen deutschen Genitivkonstruktion wiedergegeben.
- source_word: וַיֹּאמְרוּ
  choice: dann sagten sie
  rationale: אמר bleibt mit dem neutralen Verb „sagen“ wiedergegeben. „Dann“ macht lediglich die hebräische Erzählungsfolge im Deutschen deutlich, ohne eine stärkere Schlussfolgerung einzutragen.
