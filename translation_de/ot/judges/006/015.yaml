source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: de
  text: 'Doch er sagte zu ihm: „Bitte, mein Herr[a], wie soll ich Israel retten? Sieh doch: Meine Sippe[b] ist die schwächste[c] in Manasse, und ich bin der Jüngste[d] im Haus meines Vaters.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Herr“ als göttliche Anrede; der hebräische Ausdruck kann sowohl eine respektvolle Anrede als auch einen göttlichen Titel wiedergeben.'
    reason: theologische_und_lexikalische_mehrdeutigkeit
  - marker: b
    text: 'Wörtlich: „mein Tausend“; der hebräische Ausdruck kann eine Sippe oder eine andere Untergliederung eines Stammes bezeichnen.'
    reason: lexikalische_alternative
  - marker: c
    text: 'Oder: „die ärmste“ beziehungsweise „die geringste“.'
    reason: lexikalische_alternative
  - marker: d
    text: 'Oder: „der Geringste“.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: בִּי
  choice: Bitte
  rationale: Die Gesprächspartikel leitet eine höfliche, respektvolle Einwendung ein. „Bitte“ gibt diese Funktion in heutigem Deutsch knapp wieder.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die Form kann hier als respektvolle Anrede verstanden werden. Die Kleinschreibung bewahrt die erzählerische Offenheit über die Identität des Angesprochenen.
- source_word: בַּמָּה
  choice: wie soll ich
  rationale: Die Wendung fragt nach der Möglichkeit beziehungsweise den Mitteln, mit denen Gideon Israel retten könnte; die idiomatische Frage bewahrt seinen Einwand.
- source_word: אוֹשִׁיעַ
  choice: ich Israel retten
  rationale: Der Hifil von יָשַׁע bezeichnet das Retten oder Befreien aus Bedrängnis. „Retten“ ist hier breit verständlich und sachlich passend.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Der Aufmerksamkeitsmarker hebt Gideons folgende Begründung hervor; „Sieh doch“ wirkt im Deutschen natürlich und nachdrücklich.
- source_word: אַלְפִּי
  choice: meine Sippe
  rationale: אֶלֶף kann neben der wörtlichen Zahl „tausend“ eine soziale beziehungsweise militärische Untergliederung des Stammes bezeichnen. Im Zusammenhang ist „Sippe“ verständlicher als eine wörtliche Zahlenangabe.
- source_word: הַדַּל
  choice: die schwächste
  rationale: דַּל kann schwach, gering oder arm bedeuten. „Die schwächste“ passt zu Gideons Einwand gegen seine Befähigung, ohne die möglichen Nuancen in der Fußnote auszublenden.
- source_word: הַצָּעִיר
  choice: der Jüngste
  rationale: Das Wort kann den Jüngsten, Kleinsten oder Geringsten bezeichnen. Innerhalb des väterlichen Hauses liegt die Altersbedeutung nahe.
- source_word: בְּבֵית אָבִי
  choice: im Haus meines Vaters
  rationale: Die hebräische Wendung bezeichnet den väterlichen Haushalt beziehungsweise Familienverband. Die Formulierung bleibt bildnah und ist im Deutschen verständlich.
theological_decisions:
- issue: Bedeutung von אֲדֹנָי in Gideons Anrede
  choice: Respektvolle Anrede „mein Herr“ mit kleingeschriebenem „Herr“
  alternative: Göttlicher Titel „Herr“
  rationale: An dieser Stelle lässt die Erzählung Gideons Erkenntnis der Identität seines Gegenübers noch in Spannung. Die Übersetzung legt daher nicht vorzeitig eine ausdrücklich göttliche Anrede fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt schlicht und nachvollziehbar; „Sieh doch“ erhält den nachdrücklichen Charakter von Gideons Einwand. Die sozialen und theologischen Mehrdeutigkeiten werden nicht im Haupttext überladen, sondern durch Fußnoten offengehalten.
