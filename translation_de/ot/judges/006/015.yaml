  terminology: „Israel“, „Manasse“, „mein Herr“ und „Haus meines Vaters“ sind konsistent und angemessen. Die Kleinschreibung von „Herr“ bewahrt die im unmittelbaren Erzählverlauf bestehende Ambiguität der Anrede und legt keine theologische Deutung vorzeitig fest. Die Fußnoten zu Sippe, schwächste und Jüngste sind sachlich und korrekt verankert.
