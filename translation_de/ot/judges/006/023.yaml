lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Wiedergabe des narrativen wayyiqtol von אמר; im Zusammenhang leitet es Jahwes direkte Antwort ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שָׁלוֹם לְךָ
  choice: Friede sei mit dir!
  rationale: Die Wendung ist hier eine Zusage der Unversehrtheit und Beruhigung; die gewählte Form bewahrt zugleich den Grundbegriff שָׁלוֹם.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht!
  rationale: Natürliche, würdige Wiedergabe der hebräischen Verbotsform und der geläufigen göttlichen Beruhigungsformel.
- source_word: לֹא תָּמוּת
  choice: Du wirst nicht sterben.
  rationale: Das Imperfekt bezeichnet hier im Anschluss an die Beruhigung eine sichere zukünftige Folge beziehungsweise Zusage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; die Umschrift bewahrt ihn als Eigennamen.
- issue: Bedeutung von שָׁלוֹם לְךָ im Zusammenhang
  choice: Friede sei mit dir!
  alternative: Dir wird nichts geschehen.
  rationale: Die Übersetzung bewahrt die lexikalische Weite von שָׁלוֹם und lässt die folgende Zusage „Du wirst nicht sterben“ die konkrete Beruhigung erläutern.
