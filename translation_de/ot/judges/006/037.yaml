  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: de
  text: Sieh, ich lege ein Wollvlies auf die Tenne. Wenn nur auf dem Vlies Tau liegt, während der gesamte Boden trocken ist,[a] werde ich daran erkennen, dass du Israel durch meine Hand retten wirst, wie du gesagt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während das ganze Land trocken ist“ beziehungsweise „während die ganze Erde trocken ist“. Das hebräische Wort kann den Boden vor Ort, ein Land oder die Erde bezeichnen; hier ist wahrscheinlich die umliegende Bodenfläche gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden, deiktischen Nachdruck und klingt in würdiger moderner Standardsprache natürlich.
- source_word: מַצִּיג
  choice: ich lege
  rationale: Das Partizip mit אָנֹכִי bezeichnet die gegenwärtige oder unmittelbar bevorstehende Handlung; „lege“ ist für das Platzieren des Vlieses idiomatisch.
- source_word: גִּזַּת הַצֶּמֶר
  choice: ein Wollvlies
  rationale: Gibt die Bedeutung der hebräischen Konstruktverbindung knapp, konkret und im Deutschen natürlich wieder.
- source_word: בַּגֹּרֶן
  choice: auf die Tenne
  rationale: „Tenne“ ist die übliche Bezeichnung für den zum Dreschen vorbereiteten Platz; bei einer Ablage auf seiner Fläche ist „auf“ idiomatisch.
- source_word: טַל יִהְיֶה
  choice: Tau liegt
  rationale: Drückt das Vorhandensein des Taus aus, ohne den hebräischen Wortlaut durch eine bestimmte Vorstellung seines Fallens zu überpräzisieren.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: nur auf dem Vlies
  rationale: Gibt die durch לְבַדָּהּ bezeichnete Ausschließlichkeit klar und natürlich wieder.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: während der ganze Boden trocken ist
  rationale: Im unmittelbaren Kontext bezeichnet הָאָרֶץ wahrscheinlich die umliegende Bodenfläche; die nominale Aussage mit חֹרֶב wird im Deutschen idiomatisch als Zustand formuliert.
- source_word: וְיָדַעְתִּי
  choice: werde ich daran erkennen
  rationale: Der erfüllte Bedingungssatz führt zur Erkenntnis; „daran“ macht den Bezug auf das Zeichen im Deutschen natürlich deutlich.
- source_word: כִּי תוֹשִׁיעַ
  choice: dass du ... retten wirst
  rationale: Das Hifil von יָשַׁע bezeichnet hier Gottes künftige Rettung beziehungsweise Befreiung Israels.
- source_word: בְּיָדִי
  choice: durch meine Hand
  rationale: Bewahrt das hebräische Bild für Gideons vermittelnde Rolle und bleibt im Deutschen verständlich.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: wie du gesagt hast
  rationale: Gibt דִּבַּרְתָּ direkt wieder und vermeidet, mit „versprochen“ eine stärkere Nuance ausdrücklich einzutragen.
theological_decisions:
- issue: Reichweite von הָאָרֶץ im Zeichen
  choice: Boden
  alternative: Land oder Erde
  rationale: Der Gegensatz gilt in der Szene wahrscheinlich dem Vlies und der umliegenden Bodenfläche. Die breiteren Bedeutungen des hebräischen Wortes bleiben in einer Fußnote sichtbar.
- issue: Gideons Beteiligung an Israels Rettung
  choice: durch meine Hand
  alternative: durch mich
  rationale: Die bildhafte Agensformulierung des Hebräischen wird bewahrt, ohne Gottes Rolle als eigentlichen Retter abzuschwächen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Tenne“ ist ein etablierter Sachbegriff; Satzbau und Wortwahl bleiben gut verständlich. Die örtliche Deutung von הָאָרֶץ steht im Haupttext, die echte lexikalische Spannweite in der Fußnote.
