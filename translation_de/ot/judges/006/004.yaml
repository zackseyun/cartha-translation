base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: de
  text: Immer wieder schlugen sie ihr Lager gegen sie auf und vernichteten den Ertrag des Landes bis nach Gaza[a]. Sie ließen in Israel nichts zum Leben übrig, weder Schaf noch Rind noch Esel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bis zu deinem Kommen nach Gaza«; eine hebräische Wendung für die Ausdehnung bis in Richtung Gaza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: Sie lagerten sich gegen sie
  rationale: חנה bezeichnet das Lagern; עַל ist hier im feindlichen Sinn mit »gegen« wiedergegeben. Der wiederholte Vorgang ergibt sich im Deutschen aus dem Zusammenhang.
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: und vernichteten den Ertrag des Landes
  rationale: שׁחת im Hifil bezeichnet Vernichten oder Verwüsten; יְבוּל ist der landwirtschaftliche Ertrag, ohne auf einzelne Feldfrüchte beschränkt zu sein.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: bis nach Gaza
  rationale: Die wörtliche Wendung »bis zu deinem Kommen nach Gaza« ist eine idiomatische Streckenangabe. »Bis nach Gaza« gibt ihre räumliche Bedeutung natürlich wieder; die hebräische Form wird in einer Fußnote ausgewiesen.
- source_word: וְלֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: Sie ließen in Israel nichts zum Leben übrig
  rationale: מִחְיָה meint Lebensunterhalt beziehungsweise das zum Überleben Nötige. »Nichts zum Leben« bewahrt die Breite des Ausdrucks und ist gegenwartsnah.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: weder Schaf noch Rind noch Esel
  rationale: Die singularischen Tierbezeichnungen haben kollektive beziehungsweise repräsentative Bedeutung. Die deutsche Aufzählung folgt der hebräischen Form eng und bleibt natürlich.
