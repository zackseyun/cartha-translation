source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: de
  text: 'Als die Männer der Stadt früh am Morgen aufstanden, sahen sie: Der Altar des Baal war niedergerissen und die Aschera[a], die sich darauf befunden hatte[b], war umgehauen worden. Der zweite Stier war auf dem Altar, der gebaut worden war, als Opfer dargebracht worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Aschera-Pfahl“ beziehungsweise „der Kultpfahl“; hebräisch: „die Aschera“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf ihm“; gemeint sein kann auch: „bei ihm“ oder „neben ihm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ אַנְשֵׁי הָעִיר בַּבֹּקֶר
  choice: Als die Männer der Stadt früh am Morgen aufstanden
  rationale: שׁכם bezeichnet hier das frühe Aufstehen; die maskuline Bezeichnung אַנְשֵׁי wird mit „Männer“ wiedergegeben.
- source_word: וְהִנֵּה
  choice: 'sahen sie:'
  rationale: Die präsentative Partikel markiert die überraschende Entdeckung. „Da sahen sie“ beziehungsweise hier „sahen sie:“ gibt diese Erzählfunktion in natürlichem Deutsch wieder.
- source_word: נֻתַּץ מִזְבַּח הַבַּעַל
  choice: Der Altar des Baal war niedergerissen
  rationale: Das Passiv von נתץ bezeichnet das Niederreißen oder Zerstören eines Bauwerks; das Plusquamperfekt entspricht dem bereits vorgefundenen Zustand.
- source_word: הָאֲשֵׁרָה
  choice: die Aschera
  rationale: Der hebräische Ausdruck kann die mit der Göttin Aschera verbundene Kultgestalt oder den Kultgegenstand bezeichnen. Die Transliteration vermeidet die vorschnelle Festlegung auf einen Pfahl.
- source_word: אֲשֶׁר עָלָיו
  choice: die sich darauf befunden hatte
  rationale: עַל bedeutet gewöhnlich „auf/über“, kann aber räumliche Zuordnung ausdrücken. „darauf“ bewahrt den formalen Bezug, ohne die genaue Gestalt oder Anordnung weiter auszudeuten.
- source_word: כֹּרָתָה
  choice: war umgehauen worden
  rationale: Das Passiv von כרת bezeichnet hier das Fällen beziehungsweise Umhauen des offenbar hölzernen Kultgegenstands.
- source_word: הַפָּר הַשֵּׁנִי
  choice: der zweite Stier
  rationale: Die Wiedergabe folgt der Grundbedeutung von פַּר und hält den Rückbezug auf den zuvor genannten zweiten Stier fest.
- source_word: הֹעֲלָה
  choice: war als Opfer dargebracht worden
  rationale: Der Hophal von עלה hat im Opferkontext die Bedeutung, etwas als Opfer darzubringen; die Formulierung ist natürlich und macht den kultischen Gebrauch deutlich.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: dem Altar, der gebaut worden war
  rationale: Das passive Partizip bezeichnet den bereits errichteten Altar; ein Relativsatz ist im Deutschen die natürliche Wiedergabe.
theological_decisions:
- issue: Bedeutung von אֲשֵׁרָה
  choice: Aschera
  alternative: Aschera-Pfahl; Kultpfahl
  rationale: Der hebräische Begriff kann sowohl auf Aschera als Kultgestalt als auch auf ihren Kultgegenstand bezogen sein. Die Hauptübersetzung erhält diese Unbestimmtheit; die sachlich mögliche Konkretisierung steht in der Fußnote.
- issue: Räumliche Bedeutung von עָלָיו
  choice: darauf
  alternative: dabei; daneben
  rationale: Die Grundbedeutung der Präposition wird im Haupttext bewahrt. Da der Ausdruck je nach räumlicher Anordnung auch eine enge Zuordnung zum Altar bezeichnen kann, nennt die Fußnote die weniger wörtliche Möglichkeit, ohne sie in den Text einzutragen.
- issue: Opferbedeutung von הֹעֲלָה
  choice: als Opfer dargebracht
  alternative: hinaufgebracht; als Brandopfer dargebracht
  rationale: Der Kontext verlangt eine Opferhandlung. „Brandopfer“ ist aus dem Zusammenhang naheliegend, wird durch dieses Verb allein jedoch nicht ausdrücklich benannt; deshalb bleibt die Übersetzung allgemeiner.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das präsentative וְהִנֵּה wird funktional durch „sahen sie:“ wiedergegeben. Die wiederholten Passivformen und der Charakter der Szene als nachträgliche Entdeckung bleiben erhalten.
