review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem hebräischen Text insgesamt genau: Gideon nimmt zehn Männer aus seinen Dienern, handelt nach Jahwes Weisung und vollzieht die Tat wegen seiner Furcht nachts. Die Formulierung „wollte“ schwächt jedoch die im Hebräischen ausgedrückte verhindernde Wirkung der Furcht zu einer bloßen Absicht ab. Außerdem ist „Haus seines Vaters“ im Deutschen in der Verbindung mit „sich vor ... fürchten“ unnötig leicht als Gebäude misszuverstehen, während בֵּית אָבִיו hier die Hausgemeinschaft bzw. den Haushalt bezeichnet.'
  naturalness: Der Text ist weitgehend modernes, verständliches Deutsch. „Da er sich ... fürchtete und es deshalb nicht am Tag tun wollte“ ist zwar verständlich, klingt aber semantisch weniger präzise als eine Satzfügung, die ausdrückt, dass er es gerade wegen seiner Furcht nicht tagsüber tat. „Hausgemeinschaft seines Vaters“ ist hier idiomatischer und kontextuell klarer.
  terminology: „Jahwe“, „zehn Männer“, „Diener“ und „Männer der Stadt“ sind angemessen und quellennah. „Hausgemeinschaft seines Vaters“ gibt die soziale Bedeutung von בֵּית אָבִיו wieder, ohne eine bestimmte rechtliche oder verwandtschaftliche Einengung vorzunehmen. Die Fußnote wird auf die tatsächlich relevante hebräische Konstruktion mit מן plus Infinitiv ausgerichtet.
  issues:
  - severity: medium
    issue: „... es deshalb nicht am Tag tun wollte“
    rationale: Das Hebräische beschreibt, dass Gideons Furcht ihn vom Handeln am Tag abhielt (מֵעֲשׂוֹת יוֹמָם), nicht ausdrücklich, dass ihm der Wille dazu fehlte. Die Revision bewahrt den Kausal- und Verhinderungssinn ohne die zusätzliche Volitionsnuance.
  - severity: low
    issue: „vor dem Haus seines Vaters“
    rationale: Obwohl „Haus“ die hebräische Mehrdeutigkeit formal abbildet, legt die deutsche Präpositionalkonstruktion leicht ein Gebäude als Gegenstand der Furcht nahe. Der Kontext und der englische Audit Trail sprechen für die Hausgemeinschaft bzw. den Haushalt.
  - severity: low
    issue: Fußnote a bezeichnet keine präzise wörtlichere Alternative
    rationale: Die bisherige Fußnote formuliert den Gesamtgedanken frei und enthält die zusätzliche Wendung „aus Furcht“. Sie sollte die hebräische Infinitivkonstruktion und deren verhindernden Sinn direkt erläutern.
  revised_text: Gideon nahm zehn Männer aus dem Kreis seiner Diener und tat, was Jahwe ihm gesagt hatte. Weil er sich aber vor der Hausgemeinschaft seines Vaters und den Männern der Stadt fürchtete, tat er es nicht am Tag[a], sondern in der Nacht.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: „vom Tun bei Tag“. Die hebräische Wendung besagt, dass seine Furcht ihn davon abhielt, es tagsüber zu tun.'
    reason: lexikalische und syntaktische Alternative
  revision_rationale: Die Revision ersetzt die nicht im Ausgangstext ausgedrückte Willensnuance durch eine direkte Aussage über die durch Furcht bedingte Unterlassung am Tag. Sie verdeutlicht zugleich die soziale Referenz von בֵּית אָבִיו als Hausgemeinschaft und dokumentiert die syntaktisch markierte hebräische Wendung in einer präzisen Fußnote.
