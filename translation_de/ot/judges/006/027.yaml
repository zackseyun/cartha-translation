base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: de
  text: Gideon nahm zehn Männer aus dem Kreis seiner Diener und tat, was Jahwe ihm gesagt hatte. Weil er sich aber vor der Hausgemeinschaft seines Vaters und den Männern der Stadt fürchtete, tat er es nicht am Tag[a], sondern in der Nacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Tun bei Tag“. Die hebräische Wendung besagt, dass seine Furcht ihn davon abhielt, es tagsüber zu tun.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: Das narrative וַ־ mit לקח führt die nächste Handlung fort; „Da nahm“ ist im Deutschen natürlich und gibt die Erzählfolge wieder.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: zehn Männer
  rationale: Das Hebräische bezeichnet ausdrücklich zehn Männer; diese Geschlechtsangabe wird beibehalten.
- source_word: מֵעֲבָדָיו
  choice: aus dem Kreis seiner Diener
  rationale: Das partitive מִן wird mit „aus dem Kreis“ wiedergegeben. עֶבֶד kann Diener oder Sklave bedeuten; der Kontext betont hier die Zugehörigkeit zu Gideons Hauspersonal, nicht den Rechtsstatus.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: und tat, was Jahwe ihm gesagt hatte
  rationale: Die Formulierung bewahrt den Bezug zwischen Jahwes Anweisung und Gideons Gehorsam, klingt aber in modernem Deutsch natürlicher als „wie Jahwe zu ihm geredet hatte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Weil ... aber
  rationale: Die hebräische Wendung leitet hier den erklärenden Umstand ein. Die deutsche Satzfügung bringt sowohl die Begründung als auch den Kontrast zur vorherigen Aussage idiomatisch zum Ausdruck.
- source_word: יָרֵא
  choice: sich fürchtete
  rationale: Das Verb bezeichnet hier Gideons Furcht vor Menschen; „sich vor ... fürchten“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: בֵּית אָבִיו
  choice: das Haus seines Vaters
  rationale: „Haus“ wahrt die Mehrdeutigkeit von בַּיִת zwischen Familie, Hausgemeinschaft und Haushalt, ohne sie vorschnell auf nur eine dieser Bedeutungen festzulegen.
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Die Übersetzung erhält die ausdrücklich männliche Bezeichnung und den Bezug auf die städtische Gemeinschaft.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: und es deshalb nicht am Tag tun wollte
  rationale: Die Konstruktion מן plus Infinitiv nach ירא bezeichnet, dass die Furcht Gideon vom Handeln am Tag abhielt. Die Wiedergabe macht diesen Sinn verständlich; die wörtlichere Struktur steht in der Fußnote.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: tat er es in der Nacht
  rationale: „In der Nacht“ ist modernes Deutsch und bildet den klaren Gegensatz zu „am Tag“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בֵּית אָבִיו
  choice: das Haus seines Vaters
  alternative: die Hausgemeinschaft seines Vaters; seine väterliche Familie
  rationale: Der hebräische Ausdruck kann eine Familie beziehungsweise Hausgemeinschaft bezeichnen. „Haus“ erhält diese soziale Bedeutungsmöglichkeit ebenso wie die formale Bildsprache des Ausgangstextes.
translation_notes:
  register: Moderne, gut verständliche und zugleich würdevolle Erzählsprache. „Haus seines Vaters“ bewahrt die hebräische Bedeutungsbreite; die ungewöhnliche Verhinderungskonstruktion wird im Haupttext verständlich entfaltet und in der Fußnote näher am Wortlaut dokumentiert.
