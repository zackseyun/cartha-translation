revisions:
- from: Da nahm Gideon zehn Männer aus dem Kreis seiner Diener und tat, was Jahwe ihm gesagt hatte. Weil er sich aber vor dem Haus seines Vaters und den Männern der Stadt fürchtete und es deshalb nicht am Tag tun wollte[a], tat er es in der Nacht.
  to: Gideon nahm zehn Männer aus dem Kreis seiner Diener und tat, was Jahwe ihm gesagt hatte. Weil er sich aber vor der Hausgemeinschaft seines Vaters und den Männern der Stadt fürchtete, tat er es nicht am Tag[a], sondern in der Nacht.
  rationale: Die Revision ersetzt die nicht im Ausgangstext ausgedrückte Willensnuance durch eine direkte Aussage über die durch Furcht bedingte Unterlassung am Tag. Sie verdeutlicht zugleich die soziale Referenz von בֵּית אָבִיו als Hausgemeinschaft und dokumentiert die syntaktisch markierte hebräische Wendung in einer präzisen Fußnote.
