  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: de
  text: Dann baue für Yahweh, deinen Gott, auf dem Gipfel dieser Festung einen Altar in geordneter Weise[a]; nimm den zweiten Stier und bring ihn mit dem Holz der Aschera, die du umhauen sollst,[b] als Brandopfer dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „auf der Aufschichtung“ oder „mit der Aufschichtung“. Das hebräische Wort kann eine geordnete Anordnung bezeichnen; worauf es sich genau bezieht – etwa auf den Altarbau, eine Steinlage oder eine Holzschichtung –, ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: „Aschera“ kann ein hölzernes Kultobjekt bezeichnen, das mit der Göttin Aschera verbunden ist; oft wird „Ascherapfahl“ übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: Dann baue
  rationale: Das Qal Perfekt 2. Person Singular mit ו setzt die Anweisungsfolge fort und hat hier auffordernden Sinn. „Dann“ gibt diese Abfolge im Deutschen natürlich wieder.
- source_word: מִזְבֵּחַ לַיהוָה אֱלֹהֶיךָ
  choice: für Yahweh, deinen Gott, einen Altar
  rationale: מִזְבֵּחַ bezeichnet den Opferaltar; ל markiert hier Widmung beziehungsweise Bestimmung. Der Gottesname יהוה wird als „Yahweh“ wiedergegeben, אֱלֹהֶיךָ ausdrücklich als „deinen Gott“.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: oben auf dieser befestigten Höhe
  rationale: רֹאשׁ meint den oberen Teil beziehungsweise Gipfel; מָעוֹז bezeichnet einen starken, geschützten oder befestigten Ort. Die Formulierung verbindet den Höhenbezug mit dem Aspekt der Befestigung, ohne zwingend eine eigentliche Festung vorauszusetzen.
- source_word: בַּמַּעֲרָכָה
  choice: in der vorgesehenen Anordnung
  rationale: מַעֲרָכָה bezeichnet eine geordnete Aufstellung oder Anordnung. Die konkrete Referenz ist unsicher; daher wird weder ausdrücklich „Steinsetzung“ noch „Holzschichtung“ in den Haupttext eingetragen.
- source_word: הַפָּר הַשֵּׁנִי
  choice: den zweiten Stier
  rationale: פַּר bezeichnet einen Stier; הַשֵּׁנִי wird wörtlich als „der zweite“ bewahrt und knüpft an den Kontext an.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: bring ihn als Brandopfer dar
  rationale: Die Hifil-Form von עלה zusammen mit עֹלָה ist eine feste Opfersprache. „Als Brandopfer darbringen“ ist im Deutschen idiomatisch und sachlich genau.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה
  choice: mit dem Holz der Aschera
  rationale: אֲשֵׁרָה kann die Göttin beziehungsweise, in diesem Zusammenhang wahrscheinlicher, ein ihr zugehöriges hölzernes Kultobjekt bezeichnen. Die knappe Wiedergabe „Aschera“ erhält die Unbestimmtheit.
- source_word: אֲשֶׁר תִּכְרֹת
  choice: die du umhauen wirst
  rationale: Das Relativpronomen bezieht sich grammatisch auf die feminine Aschera. Das Imperfekt bezeichnet im Anweisungskontext die noch auszuführende Handlung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm. „Yahweh“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Referenz von אֲשֵׁרָה
  choice: Aschera
  alternative: Ascherapfahl; Ascherabild; Kultbaum der Aschera
  rationale: Die genaue Gestalt des bezeichneten Kultgegenstands ist umstritten. Der Haupttext vermeidet eine unbelegte Festlegung; die Fußnote erläutert die wahrscheinliche kultische Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortlaufende Anweisung wird klar und natürlich formuliert. Zwei echte lexikalische Unsicherheiten—במערכה und אשרה—werden nicht im Haupttext vereindeutigt, sondern in Fußnoten offengelegt.
