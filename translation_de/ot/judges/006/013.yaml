source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: de
  text: 'Gideon sagte zu ihm: „Bitte, mein Herr[a], wenn Jahwe mit uns ist, warum ist uns dann all dies widerfahren? Und wo sind all seine Wundertaten[b], von denen unsere Väter uns erzählt haben, als sie sagten: ‚Hat Jahwe uns nicht aus Ägypten heraufgeführt?‘ Doch jetzt hat Jahwe uns verlassen und uns in die Hand Midians gegeben.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit Verlaub, mein Herr.“ Die hebräische Wendung ist eine höfliche Anrede.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wunder“ bzw. „wunderbare Taten“.'
    reason: lexical_alternative
  - marker: c
    text: '„In die Hand Midians“ bedeutet: unter Midians Macht oder Gewalt.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Bitte, mein Herr
  rationale: בִּי ist eine höfliche Einleitung im Sinn von „bitte“ oder „mit Verlaub“; אֲדֹנִי ist hier zunächst eine respektvolle Anrede. „Mein Herr“ bewahrt diese Höflichkeit, ohne die Anrede bereits eindeutig als Gottestitel festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: wenn Jahwe mit uns ist
  rationale: Obwohl die Form wörtlich mit „und Jahwe ist mit uns“ beginnen kann, ergibt Gideons anschließende Warum-Frage im Deutschen natürlich eine konditionale Aussage. Die rhetorische Spannung bleibt erhalten.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: warum ist uns dann all dies widerfahren?
  rationale: מצא bezeichnet bei einem Unheil als Subjekt dessen Eintreffen über jemanden. „Widerfahren“ ist idiomatisch, würdevoll und bildet die Vorstellung ab, dass die Not Israel getroffen hat.
- source_word: נִפְלְאֹתָיו
  choice: seine Wundertaten
  rationale: Das Wort bezeichnet außerordentliche, Staunen erregende Taten Gottes. „Wundertaten“ wahrt den Handlungsaspekt besser als das möglicherweise mehrdeutige deutsche „Wunder“.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: von denen unsere Väter uns erzählt haben
  rationale: „Unsere Väter“ entspricht der konkreten Bezeichnung der israelitischen Vorfahren und Überlieferungsträger; „erzählt haben“ gibt das berichtende סִפֵּר natürlich wieder.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: Hat Jahwe uns nicht aus Ägypten heraufgeführt?
  rationale: Die Frage erwartet Zustimmung. „Heraufgeführt“ bewahrt die übliche hebräische Ausdrucksweise für den Auszug aus Ägypten.
- source_word: וְעַתָּה נְטָשָׁנוּ יְהוָה
  choice: Doch jetzt hat Jahwe uns verlassen
  rationale: „Doch jetzt“ bringt den scharfen Gegensatz zwischen der überlieferten Rettung und der gegenwärtigen Not zum Ausdruck. נטש wird klar und gegenwärtig mit „verlassen“ wiedergegeben.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: und uns in die Hand Midians gegeben
  rationale: Die wörtliche Metapher der „Hand“ bezeichnet Macht und Gewalt. Sie ist auch im Deutschen verständlich und bewahrt das Bild des Ausgangstextes.
- source_word: מִדְיָן
  choice: Midian
  rationale: Übliche deutsche Wiedergabe des Volks- und Gebietnamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bezug von אֲדֹנִי in Gideons Anrede
  choice: respektvolle Anrede „mein Herr“
  alternative: Gottestitel „Herr“
  rationale: An dieser Stelle kann Gideon den Boten zunächst ehrerbietig anreden, ohne dass der einzelne Ausdruck seine Identität abschließend bestimmt. Die Kleinschreibung von „mein“ und die Formulierung vermeiden eine vorschnelle theologische Festlegung.
- issue: Gideons Aussage über Jahwes Gegenwart
  choice: konditionale Wiedergabe „wenn Jahwe mit uns ist“
  alternative: formnäher „und Jahwe ist mit uns“
  rationale: Der hebräische Wortlaut lässt formal eine mit וְ eingeleitete Feststellung erkennen; im rhetorischen Zusammenhang fungiert sie jedoch als bestrittene Voraussetzung. Die konditionale deutsche Fassung macht Gideons Argument verständlich, ohne seine Klage abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller direkter Rede. Die hebräischen Bilder „heraufführen“ und „in die Hand geben“ bleiben erhalten; ungebräuchliche altertümliche Formen werden vermieden. Sämtliche Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
