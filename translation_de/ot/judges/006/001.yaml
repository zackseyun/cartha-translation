  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: de
  text: Die Israeliten[a] taten, was in den Augen Jahwes[b] böse war. Jahwe gab sie sieben Jahre lang in die Hand Midians[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor Jahwe«.'
    reason: lexical_alternative
  - marker: c
    text: '»In die Hand Midians« ist eine hebräische Wendung und bedeutet: unter Midians Macht oder Herrschaft.'
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »die Söhne Israels«, bezeichnet hier aber das Volk Israel als Ganzes. »Die Israeliten« gibt diesen kollektiven Sinn im modernen Deutschen natürlich und genau wieder.
- source_word: הָרַע
  choice: was böse war
  rationale: In Verbindung mit עשה bezeichnet der Ausdruck ein Tun, das moralisch böse ist. Die Formulierung bewahrt die wertende Kraft des Hebräischen.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die transparente Wiedergabe bewahrt das hebräische Bild und bezeichnet Jahwes Urteil über das Handeln Israels.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen etablierten Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּתְּנֵם
  choice: Da gab Jahwe sie
  rationale: Das Verb נתן wird in Verbindung mit »in die Hand« bewusst strukturgleich wiedergegeben; der folgende Ausdruck vermittelt die Unterwerfung unter fremde Macht.
- source_word: בְּיַד מִדְיָן
  choice: in die Hand Midians
  rationale: Die Übersetzung bewahrt das hebräische Bild der »Hand« als Ausdruck von Macht und Herrschaft; eine Fußnote erläutert die Bedeutung.
- source_word: שֶׁבַע שָׁנִים
  choice: sieben Jahre lang
  rationale: »Lang« kennzeichnet im Deutschen natürlich die im Hebräischen ausgedrückte Zeitdauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als persönlichen Namen, während »der HERR« ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Kollektive Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist formal maskulin, fungiert hier jedoch als feste kollektive Bezeichnung für das Volk Israel. Die natürliche deutsche Volksbezeichnung wahrt diesen Umfang, ohne den Ausdruck auf männliche Personen einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Richterformel bleibt erkennbar; zugleich werden die kollektive Volksbezeichnung und die Zeitangabe natürlich deutsch formuliert. Das Bild der Hand wird im Haupttext bewahrt und in der Fußnote erläutert.
