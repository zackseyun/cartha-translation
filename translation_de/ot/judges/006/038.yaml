base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: de
  text: Und so geschah es. Am nächsten Morgen stand er früh auf, drückte das Vlies aus[a] und presste Tau daraus – eine Schale voll Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „presste das Vlies zusammen“. Im Hebräischen stehen nacheinander zwei Verben: Das erste bezeichnet das Zusammendrücken des Vlieses, das zweite das Herauspressen der Flüssigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Eine natürliche deutsche Bestätigung, dass das erbetene Zeichen genau so eintrat.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: Als er am nächsten Morgen früh aufstand
  rationale: Gibt sowohl das frühe Aufstehen als auch den folgenden Morgen klar und idiomatisch wieder.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: drückte er das Vlies aus
  rationale: Das seltene Verb bezeichnet hier das Zusammendrücken des Vlieses; „ausdrücken“ ist im Deutschen anschaulich und bereitet die anschließende Flüssigkeitsgewinnung vor.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: und presste Tau daraus
  rationale: Bewahrt den zweiten, die Flüssigkeitsgewinnung bezeichnenden Verbvorgang und vermeidet eine schwerfällige Wiederholung von „Vlies“.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: eine Schale voll Wasser
  rationale: Natürliches Deutsch für die Wassermenge, die eine Schale füllte; die Gefäßgröße wird nicht unnötig präzisiert.
