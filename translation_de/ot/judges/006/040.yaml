  text: וַ/יַּ֧עַשׂ אֱלֹהִ֛ים כֵּ֖ן בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יְהִי חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ הָ֥יָה טָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: de
  text: 'Und Gott tat es in jener Nacht so: Nur das Vlies war trocken, und auf dem ganzen Boden[a] lag Tau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem ganzen Land“. Das hebräische Wort אֶרֶץ kann „Boden“, „Land“ oder „Erde“ bedeuten; im unmittelbaren Zusammenhang von Gideons Zeichen passt „Boden“ am besten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: Und Gott tat es … so
  rationale: Die Wendung verweist knapp auf Gideons Bitte im vorherigen Vers zurück. „Tat es so“ gibt sowohl das Verb עשה als auch den rückverweisenden Sinn von כֵּן natürlich wieder.
- source_word: בַּלַּיְלָה הַהוּא
  choice: in jener Nacht
  rationale: Diese idiomatische Zeitangabe bewahrt die Bestimmtheit und den erzählerischen Rückbezug des Hebräischen.
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: Nur das Vlies war trocken
  rationale: Das hebräische Substantiv חֹרֶב bezeichnet Trockenheit; im Deutschen gibt die prädikative Form „war trocken“ den konkreten Zustand natürlicher wieder. „Nur“ bewahrt die Ausschließlichkeit von לְבַדָּהּ.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: und auf dem ganzen Boden
  rationale: אֶרֶץ bezeichnet hier im unmittelbaren Zusammenhang am ehesten den Boden rings um das Vlies. „Boden“ erhält den lokalen, sichtbaren Gegensatz zum Vlies.
- source_word: הָיָה טָל
  choice: lag Tau
  rationale: „Tau lag“ ist eine natürliche deutsche Wiedergabe der hebräischen Existenzkonstruktion und hält den Gegensatz zum trockenen Vlies klar fest.
