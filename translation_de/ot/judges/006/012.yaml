  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: de
  text: 'Da erschien ihm der Engel Jahwes[a] und sagte zu ihm: »Jahwe ist mit dir, du tapferer Krieger[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«. Das hebräische Wort kann sowohl »Bote« als auch »Engel« bedeuten; in dieser Erscheinungsszene liegt »Engel« näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »starker Held«; traditionell: »tapferer Held«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Der Niphal von ראה bezeichnet hier in erzählender Sprache ein Sichtbarwerden beziehungsweise Erscheinen; »erschien« ist im Deutschen natürlich und sachlich genau.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. In dieser Erscheinungsszene ist »Engel« die naheliegende Hauptübersetzung; die echte lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: und sagte zu ihm
  rationale: Die Übersetzung hält sich an das hebräische Pronomen und ergänzt den Namen Gideon nicht.
- source_word: יְהוָה עִמְּךָ
  choice: Jahwe ist mit dir
  rationale: Der verblosen hebräischen Aussage entspricht im Kontext am ehesten eine Feststellung im Präsens, nicht ein Wunsch oder Segensgruß.
- source_word: גִּבּוֹר הֶחָיִל
  choice: du tapferer Krieger
  rationale: Die Wendung bezeichnet hier einen kraftvollen, tüchtigen und kampffähigen Mann. »Tapferer Krieger« gibt den militärischen Sinn in natürlichem, modernem Deutsch wieder; das Anredewort »du« macht die syntaktische Funktion deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen. Damit bleibt der persönliche Gottesname des hebräischen Textes erkennbar.
- issue: Deutung von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Der Haupttext wählt die im Erscheinungskontext naheliegende Bedeutung, ohne den Engel dogmatisch näher zu identifizieren. Die sprachlich mögliche Wiedergabe »Bote« bleibt in einer Fußnote erhalten.
- issue: Aussage oder Wunsch in יְהוָה עִמְּךָ
  choice: Jahwe ist mit dir
  alternative: Jahwe sei mit dir
  rationale: Die Übersetzung versteht den verblosen Satz als Zusage beziehungsweise Feststellung. Da das Hebräische formal auch als Grußformel verstanden werden könnte, wird die Entscheidung aus dem erzählerischen Kontext getroffen, ohne zusätzliche theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Da erschien« führt die neue Szene natürlich fort. Die direkte Rede ist klar und mündlich, ohne Umgangssprache; »tapferer Krieger« wahrt die militärische Kraft der hebräischen Wendung.
