  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ בָּרָ֔ק אִם תֵּלְכִ֥י עִמִּ֖/י וְ/הָלָ֑כְתִּי וְ/אִם לֹ֥א תֵלְכִ֛י עִמִּ֖/י לֹ֥א אֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: de
  text: 'Barak sagte zu ihr: „Wenn du mit mir gehst, werde ich gehen; wenn du aber nicht mit mir gehst, werde ich nicht gehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: sagte zu ihr
  rationale: Die Erzählform von אמר leitet direkte Rede ein; אֶל mit Suffix bezeichnet die Adressatin Debora. „Sagte zu ihr“ ist im modernen deutschen Erzählstil direkt und natürlich.
- source_word: בָּרָק
  choice: Barak
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אִם תֵּלְכִי עִמִּי
  choice: wenn du mit mir gehst
  rationale: אִם eröffnet die Bedingung; der Imperfekt von הלך bezeichnet hier kein ausdrücklich markiertes Futur, sondern eine mögliche Handlung. Das deutsche Präsens ist im Konditionalsatz idiomatisch und bewahrt diese Offenheit.
- source_word: וְהָלָכְתִּי
  choice: werde ich gehen
  rationale: Das Perfekt steht als Folge der vorangehenden Bedingung. Das deutsche Futur verdeutlicht Baraks daraus folgenden Entschluss, ohne ein im Hebräischen nicht vorhandenes „dann“ ergänzen zu müssen.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: wenn du aber nicht mit mir gehst
  rationale: Die zweite Bedingung steht im deutlichen Gegensatz zur ersten. „Aber“ gibt die kontrastive Funktion des וְ in natürlichem Deutsch wieder.
- source_word: לֹא אֵלֵךְ
  choice: werde ich nicht gehen
  rationale: Der negierte Imperfekt drückt Baraks Weigerung beziehungsweise seinen festen Entschluss für den Fall aus, dass Debora ihn nicht begleitet.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, eng am hebräischen Satzbau orientierter Konditionalstruktur. Die feminine Anredeform ist im Deutschen nicht morphologisch sichtbar, wird aber durch „zu ihr“ und den Kontext eindeutig gehalten.
