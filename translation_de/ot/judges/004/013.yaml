  text: וַ/יַּזְעֵ֨ק סִֽיסְרָ֜א אֶת כָּל רִכְבּ֗/וֹ תְּשַׁ֤ע מֵאוֹת֙ רֶ֣כֶב בַּרְזֶ֔ל וְ/אֶת כָּל הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ מֵ/חֲרֹ֥שֶׁת הַגּוֹיִ֖ם אֶל נַ֥חַל קִישֽׁוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: de
  text: Da bot Sisera alle seine Streitwagen auf, neunhundert eiserne Streitwagen, und das ganze Volk, das bei ihm war, von Haroschet-Haggojim zum Bach Kischon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „zum Fluss Kischon“, „zum Wadi Kischon“ oder „zum Sturzbach Kischon“. Das hebräische Wort kann einen Bach, ein zeitweise trockenes Bachbett oder ein von einem saisonalen Wasserlauf durchzogenes Tal bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: bot … auf
  rationale: Das Verb kann „rufen“ oder „aufschreien“ bedeuten, bezeichnet hier mit den Streitkräften als direktem Objekt jedoch das militärische Aufbieten beziehungsweise Zusammenrufen.
- source_word: רִכְבּוֹ
  choice: seine Streitwagen
  rationale: רֶכֶב kann kollektiv die Streitwagenmacht bezeichnen; die folgende Erläuterung „neunhundert eiserne Streitwagen“ legt hier die konkrete Wiedergabe nahe.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: neunhundert eiserne Streitwagen
  rationale: Die knappe deutsche Form entspricht der hebräischen Zahlen- und Genitivverbindung, ohne die Art der Eisenausstattung näher festzulegen.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: das ganze Volk, das bei ihm war
  rationale: „Volk“ bewahrt die Grundbedeutung von עָם; der militärische Zusammenhang macht deutlich, dass Siseras Mannschaft beziehungsweise Truppen gemeint sind.
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: von Haroschet-Haggojim
  rationale: Der Ortsname wird in einer dem Deutschen angepassten Umschrift wiedergegeben; die Präposition מִן erscheint als „von“.
- source_word: נַחַל קִישׁוֹן
  choice: Bach Kischon
  rationale: נַחַל kann einen Bach, ein Bachtal, ein Wadi oder einen saisonalen Sturzbach bezeichnen. „Bach Kischon“ ist im Deutschen verständlich, ohne die Gewässerart zu stark festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bot … auf“ hält den militärischen Zusammenhang fest; „das ganze Volk“ bewahrt zugleich die konkrete Ausdrucksweise des Hebräischen. Die Ortsnamen sind deutsch lesbar transliteriert.
