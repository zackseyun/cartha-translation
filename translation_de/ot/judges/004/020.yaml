  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ עֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/הָיָה֩ אִם אִ֨ישׁ יָב֜וֹא וּ/שְׁאֵלֵ֗/ךְ וְ/אָמַ֛ר הֲ/יֵֽשׁ פֹּ֥ה אִ֖ישׁ וְ/אָמַ֥רְתְּ אָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: de
  text: 'Und er sagte zu ihr: „Stell dich an den Eingang des Zeltes. Wenn ein Mann kommt und dich fragt: ‚Ist hier ein Mann?‘, dann sag: ‚Nein.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲמֹד
  choice: Stell dich
  rationale: Der Qal-Imperativ fordert dazu auf, am Zelteingang Stellung zu beziehen bzw. dort zu stehen. „Stell dich“ ist in diesem Zusammenhang natürlich und direkt.
- source_word: פֶּתַח הָאֹהֶל
  choice: an den Eingang des Zeltes
  rationale: פֶּתַח bezeichnet die Öffnung bzw. den Eingang. Beim Zelt ist „Eingang“ idiomatischer als „Tür“.
- source_word: וְהָיָה אִם
  choice: Wenn
  rationale: Die hebräische Wendung führt eine Bedingung ein. Im Deutschen gibt „Wenn“ diese Funktion natürlich wieder; das vorangestellte וְ wird im Satzfluss nicht eigens abgebildet.
- source_word: אִישׁ
  choice: jemand … ein Mann
  rationale: Im Bedingungssatz ist אִישׁ idiomatisch indefinit als „jemand“ wiedergegeben; in der direkten Frage bleibt das konkrete „ein Mann“ erhalten. So werden natürlicher deutscher Ausdruck und die sachliche Bedeutung verbunden.
- source_word: יָבוֹא
  choice: kommt
  rationale: בוא bedeutet hier schlicht, dass jemand zum Zelt kommt.
- source_word: וּשְׁאֵלֵךְ וְאָמַר
  choice: dich fragt
  rationale: Die koordinierte hebräische Folge „dich fragt und sagt“ wird im Deutschen natürlich als Einleitung der unmittelbar folgenden Frage formuliert.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: Ist hier ein Mann?
  rationale: Die Existenzfrage und das lokale פֹּה werden knapp und unmittelbar wiedergegeben.
- source_word: וְאָמַרְתְּ אָיִן
  choice: 'dann sag: ‚Nein.‘'
  rationale: Das feminine Verb richtet sich an Jaël. אָיִן ist eine knappe Verneinung, die im Deutschen am natürlichsten mit „Nein“ wiedergegeben wird.
