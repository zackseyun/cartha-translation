id: JDG.4.17
reference: Judges 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: de
  text: Sisera aber floh zu Fuß zum Zelt Jaëls, der Frau des Keniters Heber, denn zwischen Jabin, dem König von Hazor, und dem Haus des Keniters Heber herrschte Frieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ Hebers ist sein Haushalt, seine Familie oder seine Sippe gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: Sisera aber
  rationale: Das ו setzt die Erzählung fort und markiert hier zugleich einen Kontrast zur Niederlage des Heeres und zur Flucht Siseras vom Wagen. Die Nachstellung von „aber“ ist im Deutschen natürlich.
- source_word: נָ֣ס
  choice: floh
  rationale: Das Qal von נוס bezeichnet hier unmittelbar das Fliehen.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: zu Fuß
  rationale: Die wörtliche Wendung „mit/an seinen Füßen“ wird durch die übliche deutsche Entsprechung wiedergegeben und stellt den Gegensatz zum Streitwagen heraus.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: zum Zelt Jaëls
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und natürlich wieder.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: der Frau des Keniters Heber
  rationale: Die Apposition identifiziert Jaël als Hebers Frau; „der Keniter“ wird im Deutschen idiomatisch vor den Namen gestellt.
- source_word: כִּ֣י
  choice: denn
  rationale: Die Konjunktion führt den Grund dafür an, weshalb Sisera gerade dort Zuflucht suchte. „Denn“ bewahrt den erzählerischen Satzanschluss.
- source_word: שָׁל֗וֹם
  choice: Frieden
  rationale: שָׁלוֹם bezeichnet hier friedliche Beziehungen, ohne zwingend einen formellen Bund oder Vertrag vorauszusetzen.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: zwischen Jabin, dem König von Hazor, und
  rationale: Die Apposition wird im modernen Standarddeutsch durch Kommas kenntlich gemacht.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: dem Haus des Keniters Heber
  rationale: „Haus“ wahrt die soziale Bedeutungsbreite von בֵּית; gemeint sein kann Hebers Haushalt, Familie oder Sippe.
theological_decisions:
- issue: Art der friedlichen Beziehung
  choice: Frieden
  alternative: freundschaftliche Beziehungen / Bündnis
  rationale: Der hebräische Text nennt שָׁלוֹם, legt aber nicht fest, ob ein formeller Vertrag bestand. Die Übersetzung sollte diese Offenheit bewahren.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Sisera aber“ bildet den narrativen Kontrast ab; „Haus“ bleibt wegen der Bedeutungsbreite des hebräischen Sozialbegriffs im Text und wird in der Fußnote erläutert.
