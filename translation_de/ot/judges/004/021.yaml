base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: de
  text: Da nahm Jaël[a], die Frau Hebers, einen Zeltpflock und den Hammer in die Hand und ging leise zu ihm. Sie trieb den Pflock in seine Schläfe, und der Pflock drang bis in die Erde.[b] Er aber schlief fest und war erschöpft, und er starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jaël: auch Jael.'
    reason: Namensform
  - marker: b
    text: 'Wörtlich: „und sie sank in die Erde“. Das feminine hebräische Verb bezieht sich im Kontext wahrscheinlich auf den im Hebräischen femininen Zeltpflock; syntaktisch könnte es auch auf Jaël bezogen werden.'
    reason: Syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: Zeltpflock / den Pflock
  rationale: Das Wort bezeichnet hier einen Pflock zur Befestigung eines Zeltes. „Zeltpflock“ ist im modernen Deutschen konkret und idiomatisch.
- source_word: הַמַּקֶּבֶת
  choice: Hammer
  rationale: Bezeichnet ein Schlagwerkzeug; „Hammer“ ist die natürliche und hinreichend genaue deutsche Entsprechung.
- source_word: בְּיָדָהּ
  choice: ergriff den Hammer
  rationale: Die hebräische Wendung lautet wörtlich „legte den Hammer in ihre Hand“. Die deutsche Formulierung gibt die Handlung natürlich wieder, ohne zusätzliche Information einzutragen.
- source_word: בַּלָּאט
  choice: leise
  rationale: Das Adverb beschreibt eine stille, unauffällige Annäherung. „Leise“ wahrt dies, ohne ausdrücklich eine heimliche Absicht zu unterstellen.
- source_word: וַתִּתְקַע
  choice: trieb
  rationale: Im Zusammenhang mit Hammer und Pflock bezeichnet das Verb das gewaltsame Eintreiben.
- source_word: בְּרַקָּתוֹ
  choice: in seine Schläfe
  rationale: רַקָּה bezeichnet die Schläfe beziehungsweise die Kopfseite. „In seine Schläfe“ ist präzise und legt nicht unnötig fest, dass der Pflock sie vollständig durchbohrte.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: und er drang bis in die Erde
  rationale: Die feminine Verbform verweist am natürlichsten auf den ebenfalls femininen Pflock. „Bis in die Erde“ gibt das Hinabdringen wieder; eine Fußnote weist auf die mögliche syntaktische Mehrdeutigkeit hin.
- source_word: נִרְדָּם
  choice: fest eingeschlafen
  rationale: Das Partizip beschreibt seinen Schlafzustand; die Formulierung entspricht der erzählerischen Betonung tiefen Schlafes.
- source_word: וַיָּעַף
  choice: erschöpft
  rationale: Das Verb bezeichnet Müdigkeit oder Erschöpfung und passt zu Siseras Zustand nach der Flucht.
- source_word: וַיָּמֹת
  choice: so starb er
  rationale: Die knappe Formulierung bewahrt die abrupte Endgültigkeit der hebräischen Erzählung.
- source_word: אֵשֶׁת חֶבֶר
  choice: die Frau Hebers
  rationale: Eine natürliche deutsche Wiedergabe der hebräischen Apposition „die Frau Hebers“.
