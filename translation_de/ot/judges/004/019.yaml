source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: de
  text: 'Er sagte zu ihr: »Gib mir bitte ein wenig Wasser zu trinken, denn ich habe Durst.« Da öffnete sie den Milchschlauch[a], gab ihm zu trinken und deckte ihn zu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein solcher Schlauch war ein Behälter aus Tierhaut, keine moderne Flasche.
    reason: Kulturgeschichtlicher Hinweis zur Art des Behälters.
lexical_decisions:
- source_word: הַשְׁקִינִי נָא
  choice: Gib mir bitte … zu trinken
  rationale: Der Hifil-Imperativ von שׁקה mit Suffix bedeutet, jemandem zu trinken zu geben; נָא mildert die Aufforderung höflich ab. Die deutsche Formulierung ist natürlich und bewahrt beide Aspekte.
- source_word: מְעַט מַיִם
  choice: ein wenig Wasser
  rationale: מְעַט bezeichnet eine kleine Menge. »Ein wenig Wasser« entspricht dem hebräischen Ausdruck eng und klingt in modernem Deutsch natürlich.
- source_word: כִּי צָמֵאתִי
  choice: denn ich habe Durst
  rationale: Die mit כִּי eingeleitete Aussage begründet die Bitte. »Ich habe Durst« ist die übliche moderne deutsche Wiedergabe von צָמֵאתִי.
- source_word: נֹאוד הֶחָלָב
  choice: Milchschlauch
  rationale: נֹאוד bezeichnet einen Behälter aus Tierhaut. Das Kompositum macht knapp deutlich, dass der Schlauch Milch enthielt, und bewahrt den Gegensatz zum erbetenen Wasser.
- source_word: וַתַּשְׁקֵהוּ
  choice: gab ihm zu trinken
  rationale: Auch hier bezeichnet der Hifil von שׁקה das Geben eines Getränks. Da unmittelbar zuvor der Milchschlauch genannt wird, bleibt das Getränk eindeutig, ohne dass »Milch« wiederholt werden muss.
- source_word: וַתְּכַסֵּהוּ
  choice: deckte ihn zu
  rationale: כסה bedeutet hier, ihn zu bedecken. Wie im Hebräischen bleibt unausgesprochen, womit sie ihn zudeckte.
