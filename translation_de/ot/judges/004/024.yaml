  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: de
  text: Die Hand der Israeliten[a] lastete immer schwerer auf Jabin, dem König von Kanaan, bis sie Jabin, den König von Kanaan, vernichteten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet wörtlich „abschnitten“ und meint hier, dass sie ihn endgültig beseitigten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: Die Hand … lastete
  rationale: Die hebräische Wendung beschreibt die wirksame Macht Israels. Die konkrete Metapher „Hand“ bleibt erhalten; zusammen mit „lastete“ wird die fortschreitende feindliche Einwirkung im Deutschen natürlich ausgedrückt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige deutsche Volksbezeichnung gibt das hebräische „Söhne Israels“ in diesem erzählenden Zusammenhang natürlich und ohne Bedeutungsverlust wieder.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: immer schwerer
  rationale: Die Verbindung mit dem Infinitivus absolutus bezeichnet eine stetige Intensivierung. „Immer schwerer“ bewahrt die Vorstellung zunehmenden Drucks und passt idiomatisch zu „lastete“.
- source_word: עַל
  choice: auf
  rationale: Mit „lasten“ gibt „auf“ sowohl die hebräische Präposition als auch die gegen Jabin gerichtete Übermacht treffend wieder.
- source_word: הִכְרִיתוּ
  choice: vernichteten
  rationale: Der Hifil von כרת bedeutet wörtlich „abschneiden“ und bezeichnet hier die endgültige Beseitigung beziehungsweise Vernichtung Jabins.
