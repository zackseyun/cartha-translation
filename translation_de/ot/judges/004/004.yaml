  text: וּ/דְבוֹרָה֙ אִשָּׁ֣ה נְבִיאָ֔ה אֵ֖שֶׁת לַפִּיד֑וֹת הִ֛יא שֹׁפְטָ֥ה אֶת יִשְׂרָאֵ֖ל בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: de
  text: Debora, eine Frau und Prophetin, die Frau Lappidots, richtete zu jener Zeit Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: eine Frau und Prophetin
  rationale: Gibt beide ausdrücklich genannten Elemente wieder und bewahrt die Hervorhebung, dass Debora eine Frau war; im Deutschen verbindet „und“ die appositionellen Angaben natürlich.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: die Frau Lappidots
  rationale: Die naheliegende Lesart versteht אֵשֶׁת als Ehefrau und לַפִּידוֹת als Personenname im Genitiv.
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: war Richterin in Israel
  rationale: Das Partizip mit הִיא bezeichnet ihre damalige fortdauernde richterliche Tätigkeit bzw. ihr Amt; „Richterin in Israel“ ist idiomatisch und vermeidet die im Deutschen mögliche Engführung von „Israel richten“ auf Verurteilung.
- source_word: בָּעֵת הַהִיא
  choice: zu jener Zeit
  rationale: Entspricht der zeitlichen Rückverweisung und klingt in erzählender Standardsprache natürlich.
theological_decisions:
- issue: Deboras richterliche Leitungsfunktion
  choice: Richterin in Israel
  alternative: richtete Israel
  rationale: Die feminine Amtsbezeichnung macht Geschlecht und Funktion deutlich, ohne den Umfang ihrer Aufgabe über den hebräischen Text hinaus dogmatisch festzulegen.
- issue: Deutung von לַפִּידוֹת
  choice: Personenname „Lappidot“
  alternative: attributive Deutung wie „eine Frau von Fackeln/feurigem Geist“
  rationale: Die traditionelle und syntaktisch naheliegende Auffassung als Name wird im Haupttext verwendet; die seltene Form erlaubt zwar andere Vorschläge, doch diese sind für eine Textnote hier nicht zwingend.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ausdrückliche Bezeichnung Deboras als Frau bleibt erhalten; zugleich wird die hebräische Satzstruktur für natürliches Deutsch behutsam geglättet.
