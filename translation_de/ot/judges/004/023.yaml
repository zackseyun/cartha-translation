  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: de
  text: An jenem Tag unterwarf Gott Jabin, den König von Kanaan, vor den Söhnen Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den Israeliten“ oder „vor den Kindern Israels“. Wörtlich steht im Hebräischen: „vor den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: So unterwarf
  rationale: Das Hifil von כנע bezeichnet hier, dass Gott den feindlichen König niederzwang und unterwarf. „Unterwarf“ gibt den militärisch-politischen Sinn prägnant wieder; „so“ nimmt die folgernde Erzählverknüpfung des וַ auf.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier eindeutig den Gott Israels als handelndes Subjekt.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Formulierung bewahrt den zeitlichen Rückverweis und klingt in modernem Standarddeutsch natürlich und würdig.
- source_word: אֵת יָבִין
  choice: Jabin
  rationale: אֵת kennzeichnet das bestimmte direkte Objekt; der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: מֶלֶךְ כְּנָעַן
  choice: den König von Kanaan
  rationale: Die Apposition erhält im Deutschen den vom Verb verlangten Akkusativ; die Constructusverbindung bedeutet „König von Kanaan“.
- source_word: לִפְנֵי
  choice: vor
  rationale: „Vor“ bewahrt die knappe räumlich-relationale Ausdrucksweise des Hebräischen und lässt offen, ob besonders Gegenwart, Augenzeugenschaft oder Überlegenheit im Blick ist.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die wörtliche gendermarkierte Wendung des Hebräischen wird im Haupttext erhalten; geläufigere sachliche Alternativen stehen in der Fußnote.
theological_decisions:
- issue: Göttliches Handeln bei Israels Sieg
  choice: Gott bleibt das ausdrückliche Subjekt, das Jabin unterwirft.
  alternative: Eine unpersönliche Formulierung oder eine Wiedergabe, die Israels militärischen Erfolg in den Vordergrund stellt.
  rationale: Im Hebräischen ist אֱלֹהִים ausdrücklich das Subjekt. Die Übersetzung darf die göttliche Urheberschaft nicht abschwächen.
- issue: Geschlechtlich markierte Bezeichnung des Bundesvolkes
  choice: „die Söhne Israels“
  alternative: „die Israeliten“ oder „die Kinder Israels“
  rationale: בְּנֵי יִשְׂרָאֵל lautet formal „Söhne Israels“. Diese Form bleibt im Haupttext erhalten, während die idiomatischen deutschen Entsprechungen als Alternativen genannt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. „Unterwarf“ ist klarer und gegenwärtiger als „demütigte“ und passt zum militärisch-politischen Zusammenhang. Die etwas bibelsprachliche Wendung „vor den Söhnen Israels“ bewahrt bewusst die Ausdrucksweise und Mehrdeutigkeit des Originals.
