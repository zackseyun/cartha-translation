  terminology: „Unterwarf“ trifft den militärisch-politischen Sinn des Hifil von כנע angemessen. „Gott“, „Jabin“ und „Kanaan“ sind korrekt. Die Haupttextform „Söhne Israels“ wahrt die Formulierung des Hebräischen; die Fußnotenalternativen müssen syntaktisch im Dativ nach „vor“ stehen.
