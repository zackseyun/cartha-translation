  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: de
  text: Da versetzte Jahwe Sisera[a], alle Streitwagen und das ganze Heer[b] vor Barak mit der Schärfe des Schwertes[c] in Verwirrung. Sisera aber stieg von seinem Streitwagen und floh zu Fuß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brachte Sisera in Panik“ beziehungsweise „trieb Sisera in die Flucht“; das hebräische Verb bezeichnet im Kampf das Versetzen in Schrecken oder Verwirrung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das ganze Lager“; im militärischen Zusammenhang kann das hebräische Wort auch die gesamte Streitmacht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „mit dem Mund des Schwertes“; gemeint ist die Schärfe beziehungsweise Schneide des Schwertes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: versetzte ... in Verwirrung
  rationale: Das Verb המם bezeichnet im militärischen Zusammenhang das Verwirren, Erschrecken oder In-Panik-Versetzen. Die Formulierung bewahrt die verursachende Bedeutung, ohne bereits im Verb eine vollständige Vernichtung auszudrücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen deutschen Bibelregister als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָרֶכֶב
  choice: alle Streitwagen
  rationale: רֶכֶב kann kollektiv die Wagen oder die Streitwagenabteilung bezeichnen. „Streitwagen“ ist hier verständlich und militärisch eindeutig.
- source_word: הַמַּחֲנֶה
  choice: das ganze Heer
  rationale: מַחֲנֶה bedeutet wörtlich auch „Lager“, bezeichnet hier im Kampfzusammenhang aber die gesamte Streitmacht.
- source_word: לְפִי חֶרֶב
  choice: durch die Schärfe des Schwertes
  rationale: Die hebräische Wendung lautet wörtlich „durch den Mund des Schwertes“. „Schärfe des Schwertes“ bildet das Bild verständlich und relativ formal ab.
- source_word: לִפְנֵי בָרָק
  choice: vor Barak
  rationale: Die knappe räumlich-militärische Wendung entspricht לִפְנֵי, ohne näher festzulegen, ob Baraks Angriff oder seine Gegenwart hervorgehoben wird.
- source_word: מֵעַל הַמֶּרְכָּבָה
  choice: von seinem Streitwagen
  rationale: Der hebräische Text hat den bestimmten Artikel; im Deutschen bezeichnet der idiomatische Possessivartikel eindeutig den Wagen, auf dem Sisera fuhr.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: floh zu Fuß
  rationale: Die idiomatische Wendung bezeichnet die Flucht ohne Wagen und stellt den Kontrast zum Verlassen des Streitwagens klar heraus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen YHWH. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Art der göttlich bewirkten Niederlage
  choice: versetzte ... in Verwirrung
  alternative: schlug vernichtend / trieb in die Flucht
  rationale: המם kann Panik, Verwirrung oder militärisches Aufreiben bezeichnen. Die gewählte Fassung lässt den genauen Umfang der Wirkung offen und bewahrt so die lexikalische Spannung.
translation_notes:
  register: Natürliche, gehobene deutsche Erzählsprache mit moderater formaler Nähe zum Hebräischen. Die Objektkette bleibt erhalten; bei „Heer“ und dem Possessiv „seinem“ wird zugunsten unmittelbarer Verständlichkeit idiomatisch übersetzt.
