  register: Modernes, würdevolles Standarddeutsch. Der habitualische Charakter wird ausdrücklich wiedergegeben; Ortsnamen folgen den geläufigen deutschen Formen. Die Satzteilung erhöht die Lesbarkeit, ohne den erzählerischen Zusammenhang aufzulösen.
