base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: de
  text: Sie saß gewöhnlich unter der Palme Deboras, zwischen Rama und Bethel im Bergland Ephraim. Die Söhne Israels[a] zogen zu ihr hinauf, um sich Recht sprechen zu lassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Wörtlich steht im Hebräischen „die Söhne Israels“, eine übliche Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zum Rechtsspruch“; der hebräische Ausdruck kann eine richterliche Entscheidung oder die Gewährung von Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: saß gewöhnlich
  rationale: Das Partizip beschreibt im Zusammenhang Deboras regelmäßigen Aufenthalts- und Gerichtsplatz, nicht nur eine einmalige Handlung.
- source_word: תֹּמֶר דְּבוֹרָה
  choice: die Palme Deboras
  rationale: Die Genitivverbindung bezeichnet die mit Debora verbundene Palme als bekannten Ort; die Formulierung bleibt natürlich und vermeidet die mögliche Deutung von „Debora-Palme“ als Pflanzenart.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraim
  rationale: Das hebräische Singularwort bezeichnet hier die gebirgige Region Ephraims, nicht einen einzelnen Berg.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: zogen zu ihr hinauf
  rationale: Die Wendung bewahrt die topografische Bewegungsrichtung von עלה und klingt im erzählenden Zusammenhang natürlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale Bundes- und Volksbezeichnung des Hebräischen wird bewahrt; eine Fußnote erklärt, dass damit die Israeliten als Volk gemeint sind.
- source_word: לַמִּשְׁפָּט
  choice: um sich Recht sprechen zu lassen
  rationale: Die idiomatische deutsche Formulierung gibt den gerichtlichen Zweck des Kommens wieder, ohne festzulegen, ob vor allem Urteil, Rechtsentscheidung oder Rechtspflege gemeint ist.
theological_decisions:
- issue: Geschlechtlich markierte kollektive Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die hebräische Ausdrucksform wird sichtbar erhalten, zugleich stellt die Fußnote klar, dass sie hier das Volk Israel insgesamt bezeichnet und nicht ausschließlich männliche Personen.
- issue: Bedeutungsumfang von מִשְׁפָּט
  choice: um sich Recht sprechen zu lassen
  alternative: zum Gericht / für eine Rechtsentscheidung
  rationale: Die Übersetzung lässt den Zusammenhang von richterlicher Entscheidung und Gewährung von Recht bestehen, statt den Begriff auf nur eine dieser Nuancen zu verengen.
