  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: de
  text: Und die Israeliten taten wieder, was in den Augen Jahwes böse war, nachdem Ehud gestorben war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: taten wieder
  rationale: יסף mit folgendem Infinitiv bezeichnet hier die Wiederholung eines Verhaltens. „Taten wieder“ gibt den erneuten Rückfall im Erzählzyklus natürlich wieder; „fuhren fort“ könnte dagegen eine ununterbrochene Fortsetzung nahelegen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet „Söhne Israels“, bezeichnet hier jedoch das Volk als Ganzes. „Die Israeliten“ ist im modernen Deutschen die natürliche, genaue Kollektivbezeichnung und schließt nicht unbeabsichtigt Frauen aus.
- source_word: לַעֲשׂוֹת הָרַע
  choice: taten, was böse war
  rationale: Der substantivierte Ausdruck הָרַע wird idiomatisch als „was böse war“ wiedergegeben und bewahrt die moralische Wertung der wiederkehrenden Formel.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die deutsche Wendung erhält das hebräische Bild und ist zugleich klar und geläufig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen übliche Form.
- source_word: וְאֵהוּד מֵת
  choice: nachdem Ehud gestorben war
  rationale: Die mit וְ angeschlossene Nominalkonstruktion gibt im Kontext den zeitlichen Umstand des erneuten Abfalls an. Der deutsche Plusquamperfekt macht deutlich, dass Ehuds Tod dem erneuten bösen Handeln vorausging.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Namen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die maskuline hebräische Form ist eine herkömmliche Bezeichnung für die gesamte Volksgemeinschaft. Im Deutschen gibt „die Israeliten“ diesen Referenzumfang genauer und natürlicher wieder, ohne die hebräische Formulierung zu einer Aussage nur über Männer zu verengen.
- issue: Zeitliches Verhältnis von Ehuds Tod und Israels erneutem Abfall
  choice: nachdem Ehud gestorben war
  alternative: und Ehud war gestorben
  rationale: Der Zusammenhang stellt Ehuds Tod als zeitlichen Hintergrund des erneuten Abfalls dar. „Nachdem“ macht diese im Diskurs erkennbare Beziehung deutlich, ohne eine zusätzliche theologische Ursache zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Richterformel bleibt durch „taten wieder, was böse war in den Augen Jahwes“ erkennbar; der Satz ist zugleich für heutige Leser unmittelbar verständlich.
