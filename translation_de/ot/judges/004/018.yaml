base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: de
  text: 'Jaël ging Sisera entgegen und sagte zu ihm[a]: »Kehr zu mir ein, mein Herr, kehr zu mir ein! Hab keine Angst.« Da kehrte er zu ihr ins Zelt ein, und sie deckte ihn mit einer Decke[b] zu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Bieg ab, mein Herr, bieg zu mir ab.« Gemeint ist, dass Sisera seinen Weg verlassen und bei Jaël einkehren soll.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch einen Teppich, Überwurf oder anderen Stoff zum Bedecken bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: ging … entgegen
  rationale: יצא bezeichnet das Hinausgehen. Zusammen mit לִקְרַאת wird die Bewegung aus dem Zelt auf Sisera zu im Deutschen natürlich durch »ging … entgegen« ausgedrückt.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: לִקְרַאת bezeichnet eine zielgerichtete Bewegung auf eine Person zu; »entgegengehen« ist idiomatisch und präzise.
- source_word: סוּרָה
  choice: Kehr ein
  rationale: סור bedeutet wörtlich »abbiegen, vom Weg abweichen«. Im Kontext ist damit die Einladung gemeint, den Weg zu verlassen und bei Jaël ins Zelt einzutreten. »Kehr ein« bewahrt diese Bewegungsvorstellung und die Wiederholung, klingt aber natürlicher als »Bieg ab«.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die ehrerbietige Anrede bezeichnet hier einen gesellschaftlich höhergestellten Mann, nicht Gott. »Mein Herr« erhält den höflich-unterwürfigen Ton.
- source_word: אַל תִּירָא
  choice: Hab keine Angst
  rationale: Die prohibitive Wendung mit ירא wird in verständlichem modernem Deutsch als direkte beruhigende Aufforderung wiedergegeben.
- source_word: וַיָּסַר
  choice: kehrte … ein
  rationale: Die Wiederaufnahme desselben Verbs wie in Jaëls Einladung zeigt, dass Sisera ihr folgt. Die deutsche Wiederholung wahrt diesen Zusammenhang.
- source_word: הָאֹהֱלָה
  choice: ins Zelt
  rationale: Die Richtungsendung -ה bezeichnet eine Bewegung zum Zelt hin; im Kontext ist der Eintritt gemeint.
- source_word: וַתְּכַסֵּהוּ
  choice: deckte ihn … zu
  rationale: כסה bedeutet grundlegend »bedecken, zudecken«. »Zudecken« gibt die konkrete Handlung wieder, ohne ausdrücklich ein Verbergen zu behaupten.
- source_word: בַּשְּׂמִיכָה
  choice: mit einer Decke
  rationale: שׂמיכה bezeichnet einen textilen Gegenstand zum Bedecken, möglicherweise auch einen Teppich oder Überwurf. »Decke« ist die verständlichste kontextgerechte Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich und wiederholt das Verb wie im Hebräischen. »Kehr ein« vermittelt die konkrete Einladung natürlicher als ein rein wörtliches »Bieg ab«; die Fußnote dokumentiert das zugrunde liegende Bild. Der Name wird nach deutscher Bibeltradition als »Jaël« geschrieben.
