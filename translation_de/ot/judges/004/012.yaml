  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: de
  text: Da meldete man Sisera, dass Barak, der Sohn Abinoams, auf den Berg Tabor hinaufgestiegen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: Da meldete man
  rationale: Der Hifil-Wayyiqtol von נגד bedeutet hier „melden/berichten“. Das unbestimmte deutsche „man“ gibt das nicht näher bezeichnete pluralische Subjekt natürlich wieder; „da“ führt die Erzählung fort.
- source_word: לְסִיסְרָא
  choice: Sisera
  rationale: Die Präposition לְ kennzeichnet den Empfänger der Meldung; im Deutschen steht dieser nach „melden“ natürlich im Dativ, formal jedoch ohne sichtbare Markierung.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet nach dem Verb des Meldens den Inhalt der Nachricht ein, nicht eine Begründung.
- source_word: עָלָה
  choice: hinaufgezogen war
  rationale: עלה bezeichnet eine Bewegung nach oben. „Hinaufgezogen“ passt sowohl zur Topografie als auch zum militärischen Zusammenhang; das Plusquamperfekt verdeutlicht, dass der Aufstieg der Meldung vorausging, ohne eine zusätzliche Bedeutungsnuance einzuführen.
- source_word: בָּרָק
  choice: Barak
  rationale: Übliche deutsche Wiedergabe des Personennamens.
- source_word: בֶּן אֲבִינֹעַם
  choice: der Sohn Abinoams
  rationale: Die hebräische Vatersangabe wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: הַר תָּבוֹר
  choice: den Berg Tabor
  rationale: הַר bezeichnet hier den namentlich genannten Berg Tabor. Mit dem Richtungsverb steht im Deutschen „auf den Berg“.
