source:
  edition: WLC
  text: וּ/מָשַׁכְתִּ֨י אֵלֶ֜י/ךָ אֶל נַ֣חַל קִישׁ֗וֹן אֶת סִֽיסְרָא֙ שַׂר צְבָ֣א יָבִ֔ין וְ/אֶת רִכְבּ֖/וֹ וְ/אֶת הֲמוֹנ֑/וֹ וּ/נְתַתִּ֖י/הוּ בְּ/יָדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: de
  text: Und ich werde Sisera, den Heerführer Jabins, mit seinen Streitwagen und seiner Menge zu dir an den Kischonbach[a] heranziehen und ihn in deine Hand geben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an das Bachtal des Kischon“ oder „an den Wildbach Kischon“; das hebräische Wort kann ein Wadi, ein Bachbett oder einen Wildbach bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: '„In deine Hand geben“ bedeutet: deiner Gewalt ausliefern.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: ich werde … ziehen
  rationale: Das Verb משׁך bezeichnet hier, dass Gott Sisera an den bestimmten Ort kommen lässt. „Ziehen“ bewahrt das Bild, ohne die nicht ausdrücklich genannte Nuance eines Anlockens einzutragen.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition mit Suffix bezeichnet die Bewegung auf Barak zu.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: an den Bach Kischon
  rationale: נחל kann einen Bach, ein zeitweise wasserführendes Flusstal oder einen reißenden Wasserlauf bezeichnen. „Bach Kischon“ ist im Deutschen natürlich und lässt die genaue Gewässerart offen; die Alternative wird in der Fußnote erläutert.
- source_word: שַׂר צְבָא יָבִין
  choice: den Heerführer Jabins
  rationale: שׂר צבא bezeichnet den militärischen Befehlshaber. „Heerführer“ ist knapp, verständlich und würdevoll.
- source_word: רִכְבּוֹ
  choice: seinen Streitwagen
  rationale: רכב kann kollektiv die Streitwagen beziehungsweise die Streitwagenabteilung bezeichnen. Der Plural gibt den militärischen Zusammenhang natürlich wieder.
- source_word: הֲמוֹנוֹ
  choice: seiner ganzen Menge
  rationale: המון ist breiter als ein technischer Ausdruck für Heer oder Truppen und bezeichnet eine Menge oder Masse. „Ganze Menge“ bewahrt diese lexikalische Weite im militärischen Kontext.
- source_word: וּנְתַתִּיהוּ בְּיָדֶךָ
  choice: und ihn in deine Hand geben
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt eines anderen. Die bildhafte Formulierung bleibt im Deutschen verständlich und wird nicht vorschnell auf „besiegen“ verengt.
theological_decisions:
- issue: Göttliches Handeln und menschlicher Kampf
  choice: 'Die erste Person wird ausdrücklich beibehalten: Gott zieht Sisera heran und gibt ihn in Baraks Hand.'
  alternative: 'Freier: Gott lässt Sisera kommen und verhilft Barak zum Sieg.'
  rationale: Der Ausgangstext verbindet Gottes souveränes Handeln mit Baraks Beteiligung, ohne diese Spannung aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem biblischem Ton. Die Satzstruktur folgt dem Hebräischen, bleibt aber deutsch lesbar. „Heerführer“ vermeidet archaisches „Heeroberster“; „ganze Menge“ erhält bewusst die Breite von המון.
