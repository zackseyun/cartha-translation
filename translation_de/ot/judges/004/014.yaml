language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: de
  text: 'Da sagte Debora zu Barak: »Auf! Denn dies ist der Tag, an dem Jahwe Sisera in deine Hand gegeben hat.[a] Ist nicht Jahwe vor dir ausgezogen?[b]« Da stieg Barak vom Berg Tabor hinab, und zehntausend Mann folgten ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: in deine Gewalt gegeben oder dir ausgeliefert.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Ist nicht Jahwe dir vorausgezogen?'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Auf!
  rationale: Der knappe Imperativ ruft Barak unmittelbar zum Handeln auf. »Auf!« ist prägnant, würdevoll und im modernen Deutschen verständlich.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: Denn dies ist der Tag, an dem
  rationale: Bewahrt die demonstrative Hervorhebung dieses Tages und gibt כִּי als Begründung für Deboras Aufforderung wieder.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: in deine Hand gegeben hat
  rationale: Bewahrt das hebräische Macht- und Siegesidiom. Das Perfekt stellt den bevorstehenden Sieg als von Jahwe bereits gewiss verfügt dar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als gebräuchliche deutsche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הֲלֹא
  choice: Ist nicht
  rationale: Erhält die rhetorische Frage, die eine zustimmende Antwort erwartet.
- source_word: יָצָא לְפָנֶיךָ
  choice: vor dir ausgezogen
  rationale: Bewahrt das Bewegungsbild von יצא und lässt zugleich den im Kontext naheliegenden militärischen Klang erkennen, ohne ihn zu überbestimmen.
- source_word: וַיֵּרֶד
  choice: stieg ... hinab
  rationale: Natürliche deutsche Wiedergabe der Abwärtsbewegung vom Berg.
- source_word: מֵהַר תָּבוֹר
  choice: vom Berg Tabor
  rationale: Verwendet die geläufige deutsche geografische Bezeichnung.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: und zehntausend Mann folgten ihm
  rationale: Gibt die ausdrücklich männlich bezeichneten Kämpfer und ihre Bewegung hinter Barak in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Gottesnamen; »der HERR« wäre die traditionelle Ersatzlesung.
- issue: Zeitwert von נָתַן in der Siegesankündigung
  choice: gegeben hat
  alternative: geben wird
  rationale: Die Perfektform wird formal bewahrt und stellt den noch auszuführenden Sieg als gewiss dar, ohne die Spannung zwischen göttlicher Zusage und folgendem Kampf aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und knapp; das hebräische Hand-Idiom sowie die rhetorische Frage werden bewahrt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
