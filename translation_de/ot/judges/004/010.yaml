source:
  edition: WLC
  text: וַ/יַּזְעֵ֨ק בָּרָ֜ק אֶת זְבוּלֻ֤ן וְ/אֶת נַפְתָּלִי֙ קֶ֔דְשָׁ/ה וַ/יַּ֣עַל בְּ/רַגְלָ֔י/ו עֲשֶׂ֥רֶת אַלְפֵ֖י אִ֑ישׁ וַ/תַּ֥עַל עִמּ֖/וֹ דְּבוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: de
  text: Da rief Barak Sebulon und Naftali nach Kedesch zusammen. Zehntausend Mann zogen in seinem Gefolge hinauf[a], und Debora zog mit ihm hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu seinen Füßen«; gemeint ist, dass sie ihm folgten beziehungsweise unter seiner Führung mitzogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: rief … zusammen
  rationale: Die Hifil-Form von זעק bezeichnet hier das Zusammenrufen von Stammesangehörigen für einen militärischen Einsatz. „Rief … zusammen“ ist natürlich und legt keine förmliche Einberufung nahe.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: Sebulon und Naftali
  rationale: Die Stammesnamen werden in den im Deutschen gebräuchlichen biblischen Formen wiedergegeben.
- source_word: קֶדְשָׁה
  choice: nach Kedesch
  rationale: Das direktionale He kennzeichnet eine Bewegung auf den Ort zu; bei Ortsnamen gibt „nach“ dies im Deutschen idiomatisch wieder.
- source_word: וַיַּעַל
  choice: zogen … hinauf
  rationale: עלה bezeichnet das Hinaufgehen oder Hinaufziehen. Im militärischen Zusammenhang ist „hinaufziehen“ natürlich und bewahrt zugleich die Bewegungsrichtung.
- source_word: בְּרַגְלָיו
  choice: in seinem Gefolge
  rationale: Wörtlich steht „zu seinen Füßen“. Die Wendung bezeichnet hier die Männer, die Barak folgen beziehungsweise unter seiner Führung mitziehen; „in seinem Gefolge“ gibt diesen Sinn ohne zusätzliche Rang- oder Befehlsvorstellungen wieder.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: zehntausend Mann
  rationale: Die hebräische Zahlenformel bezeichnet eine Streitmacht von zehntausend Männern. „Mann“ ist in dieser festen deutschen Mengenangabe idiomatisch.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: und Debora zog mit ihm hinauf
  rationale: Die Wiedergabe erhält das wiederholte Verb עלה und die ausdrückliche Aussage, dass Debora Barak begleitete.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „hinaufziehen“ bildet den hebräischen Erzählrhythmus ab; das mehrfach koordinierende ו wird am Satzanfang mit „Da“ und anschließend mit „und“ natürlich wiedergegeben.
