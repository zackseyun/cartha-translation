base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: de
  text: 'Da verfolgte Barak Sisera. Jaël ging ihm entgegen und sagte zu ihm: »Komm, ich zeige dir den Mann, den du suchst.« Er ging zu ihr hinein, und da lag Sisera tot da, den Zeltpflock in seiner Schläfe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Da … / und da
  rationale: Das hebräische Aufmerksamkeitssignal markiert jeweils eine überraschende Wahrnehmung oder neue Situation. Im natürlichen Deutschen gibt »da« diese Funktion besser wieder als das heute feierlich oder altertümlich wirkende »siehe«.
- source_word: רֹדֵף
  choice: der … verfolgte
  rationale: Das Partizip beschreibt Barak als gerade mit der Verfolgung beschäftigt; die deutsche Verlaufsbedeutung ergibt sich aus dem Relativsatz und dem Kontext.
- source_word: לֵךְ
  choice: Komm
  rationale: Obwohl das Verb gewöhnlich »geh« bedeutet, dient es hier idiomatisch als Aufforderung, Jaël zu folgen; »Komm« ist im Deutschen situationsgerecht.
- source_word: נֹפֵל מֵת
  choice: lag … tot da
  rationale: Wörtlich etwa »hingefallen/gefallen, tot«. Gemeint ist der sichtbar daliegende Leichnam; die Formulierung bewahrt sowohl Lage als auch Todeszustand.
- source_word: יָתֵד
  choice: Zeltpflock
  rationale: Der Kontext von Jaëls Zelt und der vorangehende Bericht bestimmen den Pflock als Zeltpflock.
- source_word: רַקָּה
  choice: Schläfe
  rationale: Bezeichnet die seitliche Kopfregion; »Schläfe« ist die präzise und geläufige deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die zweimalige hebräische Wahrnehmungsformel וְהִנֵּה wird natürlich mit »Da« beziehungsweise »und da« wiedergegeben, ohne die erzählerische Überraschung zu glätten. Keine konfessionellen Zusätze.
