base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: de
  text: Da schrien die Israeliten zum HERRN, denn er verfügte über neunhundert eiserne Streitwagen und unterdrückte die Israeliten zwanzig Jahre lang mit harter Hand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die übliche moderne deutsche Bezeichnung gibt den kollektiven Sinn von »Söhne Israels« natürlich und präzise wieder.
- source_word: רֶכֶב בַּרְזֶל
  choice: eiserne Streitwagen
  rationale: Die knappe hebräische Verbindung bezeichnet Streitwagen, die durch Eisen bewaffnet oder verstärkt waren; die traditionelle Wiedergabe wahrt das konkrete Bild, ohne technische Einzelheiten hinzuzufügen.
- source_word: לָחַץ ... בְחָזְקָה
  choice: unterdrückte ... mit harter Gewalt
  rationale: לָחַץ bezeichnet bedrängen oder unterdrücken; בְחָזְקָה verstärkt dies als gewaltsam und unerbittlich. Die Formulierung ist idiomatisch und erhält die Härte des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die Kapitälchenform folgt der etablierten deutschen Bibelkonvention für das Tetragramm und kennzeichnet, dass im Hebräischen der persönliche Gottesname steht, ohne eine unsichere Aussprache in den Haupttext einzutragen.
- issue: Bezug des männlichen Pronomens in לֹו וְהוּא
  choice: er
  alternative: Sisera oder Jabin ausdrücklich nennen
  rationale: Der hebräische Text nennt in diesem Vers keinen Namen. Das Pronomen bewahrt die im unmittelbaren Kontext bestehende Bezugsoffenheit, statt sie durch eine interpretierende Namensnennung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Begründungsstruktur, während »die Israeliten« und »verfügte über« einen natürlichen heutigen Ausdruck bieten.
