base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: de
  text: 'Sie schickte nach Barak, dem Sohn Abinoams, aus Kedesch in Naftali und ließ ihn rufen. Sie sagte zu ihm: »Hat nicht der HERR[a], der Gott Israels, geboten: ›Geh, zieh[b] auf den Berg Tabor und nimm zehntausend Mann von den Naftalitern und den Sebulonitern mit dir‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: Transparenz über die mit »HERR« wiedergegebene Ausgangsform.
  - marker: b
    text: Das hebräische Verb kann hier auch im Sinn von »rücke aus« oder »stelle dich auf« verstanden werden.
    reason: Bewahrt die lexikalische Mehrdeutigkeit des militärisch gebrauchten Verbs משׁך.
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: Sie sandte hin und ließ … rufen
  rationale: Gibt beide aufeinanderfolgenden Verben wieder und klingt im modernen Deutschen natürlicher als eine wörtliche Doppelung wie »sandte und rief«.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: aus Kedesch in Naftali
  rationale: Versteht Naftali als Gebietsangabe zur Stadt Kedesch und vermeidet die im Deutschen ungebräuchliche Zusammensetzung »Kedesch-Naftali«.
- source_word: וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: zieh auf den Berg Tabor
  rationale: Das Verb משׁך bezeichnet grundsätzlich ein Ziehen und kann hier militärisches Ausrücken bzw. Hinaufziehen ausdrücken. Die knappe Wiedergabe wahrt die Bildlichkeit und passt zur Richtungsangabe.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: zehntausend Mann von den Naftalitern und den Sebulonitern
  rationale: »Mann« entspricht אִישׁ in der militärischen Zählung; die Volksbezeichnungen geben die idiomatische Bedeutung von »Söhne/Nachkommen Naftalis und Sebulons« wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR mit Fußnote zum Gottesnamen
  alternative: JHWH oder Jahwe im Haupttext
  rationale: Die traditionelle deutsche Wiedergabe bleibt lesbar und würdevoll; die Fußnote macht zugleich transparent, dass im hebräischen Text der Eigenname Gottes steht.
- issue: Rhetorische Frage הֲלֹא צִוָּה
  choice: »Hat nicht … geboten?«
  alternative: »Der HERR hat dir doch geboten«
  rationale: Die Frageform des Hebräischen bleibt erhalten, ohne ihre nachdrückliche Funktion in eine bloße Aussage aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird klar gestaffelt; Eigennamen folgen gebräuchlichen deutschen Formen.
