  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: de
  text: Heber, der Keniter, hatte sich von den Kenitern, den Nachkommen Hobabs, des Schwiegervaters von Mose,[a] getrennt und sein Zelt bis zu der Eiche in Zaanannim[b] aufgeschlagen, die bei Kedesch steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des angeheirateten Verwandten von Mose“. Das hebräische Wort kann eine weitere Bedeutung als „Schwiegervater“ haben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „bis zu der Terebinthe in Zaanannim“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: hatte sich … getrennt
  rationale: Das Nifal von פרד bezeichnet hier die Trennung von einer Gruppe. Das Plusquamperfekt gibt den rückblickenden, erklärenden Charakter des Verses natürlich wieder.
- source_word: מִקַּיִן / הַקֵּינִי
  choice: von den Kenitern / der Keniter
  rationale: Im Kontext bezeichnen beide Formen die Volks- beziehungsweise Sippenzugehörigkeit und nicht die Einzelperson Kain.
- source_word: מִבְּנֵי חֹבָב
  choice: den Nachkommen Hobabs
  rationale: בני bedeutet wörtlich „Söhne“, bezeichnet hier jedoch die von Hobab abstammende Sippe; „Nachkommen“ ist im Deutschen eindeutig und natürlich.
- source_word: חֹתֵן מֹשֶׁה
  choice: des Schwiegervaters von Mose
  rationale: חֹתֵן bezeichnet einen angeheirateten Verwandten und meint häufig den Schwiegervater. Die mögliche weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: וַיֵּט אָהֳלוֹ
  choice: hatte sein Zelt … aufgeschlagen
  rationale: נטה אהל ist die übliche Wendung für das Aufschlagen eines Zeltes. Das Plusquamperfekt entspricht der Hintergrundinformation des Verses.
- source_word: עַד
  choice: bis zu
  rationale: עַד bezeichnet die räumliche Erstreckung bis an einen Ort; „bis zu“ bildet dies knapp und idiomatisch ab.
- source_word: אֵלוֹן
  choice: Eiche
  rationale: אֵלוֹן bezeichnet einen großen Baum und kann als Eiche oder Terebinthe verstanden werden. Die botanische Alternative wird in einer Fußnote genannt.
- source_word: בצענים
  choice: von Zaanannim
  rationale: Der Ausdruck enthält den Ortsnamen Zaanannim; im Deutschen verbindet „von“ den markanten Baum natürlich mit dem Ort.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: die bei Kedesch steht
  rationale: Die Konstruktion bezeichnet die Nähe zu Kedesch. Das ergänzte „steht“ schafft einen natürlichen deutschen Relativsatz, ohne die räumliche Aussage zu verändern.
theological_decisions:
- issue: Bedeutung von חֹתֵן in Bezug auf Mose
  choice: Schwiegervater von Mose
  alternative: angeheirateter Verwandter von Mose
  rationale: „Schwiegervater“ ist im Zusammenhang der Moseüberlieferung die herkömmliche und wahrscheinlichste Deutung. Da das hebräische Wort eine weitere angeheiratete Verwandtschaft bezeichnen kann, wird diese Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers wird als rückblickende Hintergrundinformation formuliert. Die Satzteilung verbessert die Verständlichkeit, ohne den inhaltlichen Zusammenhang aufzulösen; echte lexikalische Unsicherheiten bleiben in den Fußnoten sichtbar.
