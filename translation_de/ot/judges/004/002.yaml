id: JDG.4.2
reference: Judges 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: de
  text: Da verkaufte Jahwe sie in die Hand Jabins[a], des Königs von Kanaan, der in Hazor regierte. Sein Heerführer war Sisera; er wohnte in Haroschet-Gojim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „verkaufte sie in die Hand Jabins“; eine Wendung dafür, dass Jahwe sie Jabins Gewalt auslieferte.'
    reason: lexical_alternative
  - marker: b
    text: Der Ortsname bedeutet möglicherweise „Haroschet der Völker“.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: Da verkaufte … sie
  rationale: מכר bedeutet wörtlich „verkaufen“. Die Wiedergabe bewahrt das wiederkehrende, scharfe Gerichtsbild des Richterbuchs, statt es zu „überließ“ abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Umschrift des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּיַד יָבִין
  choice: in die Hand Jabins
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt eines anderen. Das deutsche Bild bleibt verständlich und wird in der Fußnote erläutert.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: Jabins, des Königs von Kanaan
  rationale: Die Apposition macht Jabins Stellung klar und entspricht natürlichem deutschem Erzählstil.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: der in Hazor regierte
  rationale: מלך bezeichnet das Herrschen als König; der Relativsatz bezieht sich am natürlichsten auf Jabin.
- source_word: וְשַׂר צְבָאוֹ
  choice: Sein Heerführer war
  rationale: שׂר צבא bezeichnet den Befehlshaber des Heeres. „Heerführer“ ist knapp, würdig und im Deutschen klar.
- source_word: וְהוּא יוֹשֵׁב
  choice: er wohnte
  rationale: Die Partizipialkonstruktion nennt Siseras Wohn- oder Aufenthaltsort. Ein neuer Hauptsatz vermeidet einen schwerfälligen Relativsatz.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: in Haroschet-Gojim
  rationale: Der Ortsname wird umschrieben, ohne seine mögliche Bedeutung im Haupttext interpretierend festzulegen.
theological_decisions:
- issue: Göttliches Handeln bei Israels Unterwerfung
  choice: Jahwe „verkaufte“ sie in Jabins Hand.
  alternative: Jahwe ließ zu, dass sie unter Jabins Gewalt gerieten.
  rationale: Der hebräische Text schreibt Jahwe unmittelbar aktives Handeln zu. Die Übersetzung bewahrt diese theologische Härte und deutet sie nicht zu bloßer Zulassung um.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das markante hebräische Bild „verkaufen in die Hand“ bleibt erhalten; die Fußnote erschließt seine Bedeutung. Die Satzteilung gibt die hebräischen Bezüge klar wieder.
