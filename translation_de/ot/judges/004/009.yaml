source:
  edition: WLC
  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: de
  text: 'Und sie sagte: „Ich werde auf jeden Fall mit dir gehen. Doch auf dem Weg, den du gehst, wird die Ehre nicht dir gehören; denn Jahwe wird Sisera in die Hand einer Frau verkaufen.[a]“ Da machte sich Debora auf und ging mit Barak nach Kedesch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „denn Jahwe wird Sisera einer Frau ausliefern.“'
    reason: Die Grundbedeutung von יִמְכֹּר lautet „verkaufen“; im militärischen Zusammenhang ist damit die Übergabe in die Gewalt einer anderen Person gemeint.
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: Ich werde auf jeden Fall … gehen
  rationale: Die Verbindung aus Infinitivus absolutus und Imperfekt verstärkt die Aussage. „Auf jeden Fall“ gibt diesen Nachdruck in natürlichem Deutsch wieder.
- source_word: אֶפֶס
  choice: Doch
  rationale: Die Partikel leitet eine einschränkende, gegensätzliche Ergänzung zu Deboras Zusage ein.
- source_word: תִּפְאַרְתְּךָ
  choice: die Ehre wird nicht dir gehören
  rationale: תִּפְאֶרֶת bezeichnet hier Ehre, Ruhm oder Ansehen. Die Formulierung bewahrt die Aussage, dass Barak nicht der Ruhm für den entscheidenden Sieg zukommen wird.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: auf dem Weg, den du gehst
  rationale: Die Wiedergabe erhält das Wegmotiv des Hebräischen, ohne vorschnell festzulegen, ob nur die Reise oder auch Baraks Vorhaben gemeint ist.
- source_word: בְיַד אִשָּׁה
  choice: in die Hand einer Frau
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt einer Person; das Bild der Hand bleibt im Haupttext erhalten.
- source_word: יִמְכֹּר
  choice: verkaufen
  rationale: Die Grundbedeutung des Verbs ist „verkaufen“. Im Zusammenhang bedeutet es, jemanden der Gewalt eines anderen auszuliefern; diese idiomatische Bedeutung wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַתָּקָם
  choice: machte sich … auf
  rationale: Die deutsche Erzählform gibt das Aufstehen beziehungsweise entschlossene Aufbrechen natürlich wieder.
- source_word: קֶדְשָׁה
  choice: nach Kedesch
  rationale: Das Ortsnamensuffix zeigt die Richtung an; der Ortsname wird in üblicher deutscher Form transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bezug der angekündigten Frau
  choice: nicht näher bestimmt
  alternative: ausdrückliche Identifizierung mit Debora oder Jaël
  rationale: Der Vers sagt lediglich „eine Frau“. Die Übersetzung bewahrt diese zunächst offene Ankündigung und nimmt die spätere Erzählentwicklung nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Zusage klingt natürlich, während das Weg- und Handbild des Hebräischen erhalten bleibt. Der Haupttext wahrt die auffällige Metapher „verkaufen“ und erläutert ihre kontextuelle Bedeutung in einer Fußnote.
