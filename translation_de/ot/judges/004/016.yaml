  text: וּ/בָרָ֗ק רָדַ֞ף אַחֲרֵ֤י הָ/רֶ֨כֶב֙ וְ/אַחֲרֵ֣י הַֽ/מַּחֲנֶ֔ה עַ֖ד חֲרֹ֣שֶׁת הַגּוֹיִ֑ם וַ/יִּפֹּ֞ל כָּל מַחֲנֵ֤ה סִֽיסְרָא֙ לְ/פִי חֶ֔רֶב לֹ֥א נִשְׁאַ֖ר עַד אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: de
  text: Barak verfolgte die Streitwagen[a] und das Heer bis nach Haroschet der Völker[b]. Das ganze Heer Siseras fiel durch die Schneide des Schwertes; nicht ein Einziger blieb übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Streitwagentruppe“; das hebräische Wort kann kollektiv die gesamte Wagenstreitmacht bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Haroschet der Völker“; traditionell „Haroschet-Haggojim“.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: verfolgte
  rationale: Die Verbindung bezeichnet eine aktive militärische Verfolgung; „verfolgte“ ist im Deutschen präzise und idiomatisch.
- source_word: הָרֶכֶב
  choice: die Streitwagen
  rationale: Das singularische Kollektiv bezeichnet hier die Streitwagen beziehungsweise die Streitwagentruppe; „Streitwagen“ bewahrt das konkrete Bild.
- source_word: הַמַּחֲנֶה
  choice: das Heer
  rationale: Im Schlachtbericht ist nicht lediglich das Lager, sondern die militärische Streitmacht gemeint.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: bis nach Haroschet der Völker
  rationale: „Bis nach“ bezeichnet das Ziel beziehungsweise die Reichweite der Verfolgung. Der Ortsname wird teilweise übertragen, sodass das transparente Element „der Völker“ erhalten bleibt.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: Das ganze Heer Siseras fiel
  rationale: Das kollektive Subjekt bezeichnet Siseras gesamte Streitmacht; „fiel“ bewahrt die hebräische Kampfformulierung.
- source_word: לְפִי חֶרֶב
  choice: durch die Schärfe des Schwertes
  rationale: Die wörtlich bildhafte Wendung „durch den Mund des Schwertes“ bezeichnet das Töten mit dem Schwert. „Schärfe“ erhält das Bild in verständlichem Deutsch.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: nicht ein Einziger blieb übrig
  rationale: Die Formulierung gibt die emphatische Aussage vollständiger Vernichtung natürlich und genau wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Erzählregister. Militärische Begriffe werden klar wiedergegeben, während die hebräischen Bilder bei „fiel“ und „durch die Schärfe des Schwertes“ erhalten bleiben. Die Fußnotenmarker stehen jeweils an der sachlich zugehörigen Stelle.
