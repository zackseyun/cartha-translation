  text: וַ/יִּקַּ֣ח אֶת הָ/עָ֗ם וַֽ/יֶּחֱצֵ/ם֙ לִ/שְׁלֹשָׁ֣ה רָאשִׁ֔ים וַ/יֶּאֱרֹ֖ב בַּ/שָּׂדֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הָ/עָם֙ יֹצֵ֣א מִן הָ/עִ֔יר וַ/יָּ֥קָם עֲלֵי/הֶ֖ם וַ/יַּכֵּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: de
  text: Er nahm die Leute, teilte sie in drei Abteilungen[a] und legte sich im Feld auf die Lauer. Als er sah, dass die Leute aus der Stadt herauskamen, erhob er sich gegen sie und schlug sie nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in drei Köpfe“; eine hebräische Wendung für Gruppen oder Abteilungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: Er nahm seine Leute
  rationale: עָם bedeutet wörtlich „Volk/Leute“, bezeichnet hier im militärischen Zusammenhang aber Abimelechs Gefolgschaft. „Seine Leute“ macht den Bezug im Deutschen verständlich, ohne sie ausdrücklich als Soldaten zu bezeichnen.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: teilte sie in drei Abteilungen
  rationale: חצה bedeutet „teilen“. Das wörtliche „drei Köpfe“ ist eine hebräische Wendung für drei Gruppen oder Abteilungen; „Abteilungen“ passt zum militärischen Zusammenhang.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: legte sich auf dem Feld in den Hinterhalt
  rationale: ארב bezeichnet das lauernde Warten aus einem Hinterhalt. Die Formulierung gibt sowohl das Sich-Verbergen als auch das Abwarten wieder; שָׂדֶה wird direkt mit „Feld“ übersetzt.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Als er sah, dass
  rationale: Die hebräische Erzählfolge mit הִנֵּה hebt die plötzlich wahrgenommene Situation hervor. Im modernen Deutschen gibt die temporale Konstruktion den Zusammenhang natürlich wieder, ohne das schwerfällige „siehe“ einzuführen.
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: die Leute aus der Stadt kamen
  rationale: Das Partizip יֹצֵא stellt das Herauskommen als beobachteten, im Gang befindlichen Vorgang dar. „Die Leute“ bewahrt die allgemeine Bedeutung von עָם und unterscheidet sie durch den Kontext von Abimelechs Leuten.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: erhob er sich gegen sie
  rationale: קום על kann „sich gegen jemanden erheben“ und im Kontext „jemanden angreifen“ bedeuten. Die gewählte Formulierung bleibt nahe am hebräischen Bild und ist im Deutschen verständlich.
- source_word: וַיַּכֵּם
  choice: und schlug sie nieder
  rationale: נכה hat das breite Bedeutungsspektrum „schlagen, niederschlagen, besiegen“. „Schlug sie nieder“ vermittelt die entscheidende Gewalttat, ohne ausdrücklich zu behaupten, dass ausnahmslos alle getötet wurden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Militärische Bezüge werden aus dem Kontext verständlich gemacht, ohne das allgemeinere עָם unnötig auf „Soldaten“ zu verengen. Die beiden Vorkommen von עָם werden durch „seine Leute“ und „die Leute“ kontextgerecht unterschieden.
