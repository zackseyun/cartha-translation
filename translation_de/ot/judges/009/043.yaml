revisions:
- from: Er nahm seine Leute, teilte sie in drei Abteilungen[a] und legte sich auf dem Feld in den Hinterhalt. Als er sah, dass die Leute aus der Stadt kamen, erhob er sich gegen sie und schlug sie nieder.
  to: Er nahm die Leute, teilte sie in drei Abteilungen[a] und legte sich im Feld auf die Lauer. Als er sah, dass die Leute aus der Stadt herauskamen, erhob er sich gegen sie und schlug sie nieder.
  rationale: Die Revision entfernt die nicht ausdrücklich im hebräischen Text enthaltene Besitzanzeige und glättet die Hinterhaltsformulierung idiomatisch. Die Aussage, der militärische Kontext, die absichtlich allgemeine Bezeichnung עָם sowie die offene Reichweite von נכה bleiben erhalten.
