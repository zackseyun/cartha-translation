review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Handlung und die militärische Gliederung zutreffend wieder. Das possessive „seine“ bei „seine Leute“ ist jedoch im hebräischen Text nicht ausgedrückt; „die Leute“ bewahrt עָם genauer. „im Feld auf die Lauer“ entspricht dem Ort und dem Hinterhaltsverb idiomatischer als „auf dem Feld in den Hinterhalt“.
  naturalness: Die vorgeschlagene Fassung ist modernes, verständliches Standarddeutsch in angemessen sachlich-erzählendem Register. „Aus der Stadt herauskamen“ macht den beobachteten Vorgang des Partizips klar.
  terminology: „Abteilungen“ ist für die idiomatischen „drei Köpfe“ angemessen. Die Fußnote erklärt die hebräische Wendung korrekt, ohne eine übermäßig enge militärische Fachbedeutung zu behaupten. „Niederschlagen“ bleibt für נכה breit genug und legt keine vollständige Tötung fest.
  issues:
  - severity: low
    issue: „seine Leute“ ergänzt ein Possessivpronomen, das im Ausgangstext fehlt.
    rationale: Der Kontext lässt die Zugehörigkeit zu Abimelech erkennen, doch עָם lautet hier schlicht „die Leute/das Volk“. Die unergänzte Formulierung ist quellennäher und bleibt natürlich.
  - severity: low
    issue: „legte sich auf dem Feld in den Hinterhalt“ ist weniger idiomatisch.
    rationale: „Sich im Feld auf die Lauer legen“ gibt die Bedeutung von ארב natürlich wieder und wahrt den Singular des hebräischen Verbs.
