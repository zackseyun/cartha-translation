source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: de
  text: 'Sprecht doch zu allen führenden Männern Sichems: »Was ist besser für euch: dass siebzig Männer, alle Söhne Jerubbaals, über euch herrschen, oder dass ein einziger Mann über euch herrscht? Und denkt daran, dass ich euer Gebein und euer Fleisch bin.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „euer Gebein und euer Fleisch“; eine hebräische Wendung für enge Blutsverwandtschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: Sprecht doch
  rationale: Der Imperativ Plural mit נָא formuliert eine nachdrückliche Bitte. „Doch“ gibt diese bittende Aufforderung im Deutschen natürlich wieder.
- source_word: בְּאָזְנֵי
  choice: vor
  rationale: Die hebräische Wendung bedeutet wörtlich „in die Ohren von“ und bezeichnet hier ein Reden, das die Angesprochenen hören sollen. „Vor allen …“ bewahrt den öffentlichen Charakter, ohne im Deutschen schwerfällig zu wirken.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: Bürgern Sichems
  rationale: בַּעֲלֵי kann Besitzer, Herren oder die vollberechtigten beziehungsweise maßgeblichen Männer einer Stadt bezeichnen. „Bürger“ passt zum städtisch-politischen Zusammenhang, ohne ausdrücklich ein bestimmtes Amt zu unterstellen.
- source_word: מַה טּוֹב לָכֶם
  choice: Was ist besser für euch
  rationale: Der folgende Entweder-oder-Vergleich verleiht טוֹב hier einen vergleichenden Sinn. Die deutsche Formulierung macht diesen im Kontext angelegten Vergleich deutlich.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: über euch herrschen ... über euch herrscht
  rationale: משל bezeichnet in diesem politischen Zusammenhang die Ausübung von Herrschaft. Die Wiederholung des Verbs wird im Deutschen beibehalten.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: siebzig Männer, alle Söhne Jerubbaals
  rationale: אִישׁ zählt hier ausdrücklich männliche Personen; der Nachsatz identifiziert sie als Jerubbaals Söhne.
- source_word: אִישׁ אֶחָד
  choice: ein einziger Mann
  rationale: „Ein einziger“ hebt den rhetorischen Gegensatz zu den siebzig Männern klar hervor.
- source_word: וּזְכַרְתֶּם
  choice: Denkt auch daran
  rationale: Die Form hat im Zusammenhang auffordernde Kraft. „Denkt daran“ ist gegenwärtiges, natürliches Deutsch; „auch“ nimmt das verbindende וּ auf.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: euer Gebein und euer Fleisch
  rationale: Die konkrete hebräische Verwandtschaftsformel bleibt erhalten. „Gebein“ gibt עֶצֶם würdig und erkennbar wieder; eine Fußnote erläutert den idiomatischen Sinn.
theological_decisions:
- issue: Verwandtschaftsformel und mögliche Überdeutung
  choice: Die konkrete Wendung „euer Gebein und euer Fleisch“ bleibt im Haupttext stehen.
  alternative: „Ich bin euer Fleisch und Blut“ oder „Ich bin euer Verwandter“.
  rationale: Die hebräische Bildsprache bezeichnet enge leibliche Verwandtschaft. Ihre Beibehaltung vermeidet eine Verengung auf eine bloße Sachangabe; die Fußnote erklärt den Sinn.
- issue: Geschlechtsspezifische Bezeichnung der Herrschenden
  choice: „siebzig Männer“ und „ein einziger Mann“
  alternative: „siebzig Personen“ und „eine einzelne Person“
  rationale: Der Text spricht ausdrücklich von Jerubbaals Söhnen und stellt ihnen Abimelech als einzelnen Mann gegenüber. Eine geschlechtsneutrale Wiedergabe wäre hier ungenau.
- issue: Sozialer Status der בַּעֲלֵי שְׁכֶם
  choice: „Bürger Sichems“
  alternative: „Herren Sichems“, „führende Männer Sichems“ oder „Einwohner Sichems“
  rationale: Der Ausdruck kann eine politisch maßgebliche oder vollberechtigte Gruppe bezeichnen, ohne ihre genaue institutionelle Stellung festzulegen. „Bürger“ wahrt diese Offenheit besser als eine ausdrücklich amtliche Bezeichnung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Herrschaftsformulierung und die konkrete Verwandtschaftsmetapher bleiben erhalten; die Anrede klingt nach öffentlicher politischer Überzeugungsrede.
