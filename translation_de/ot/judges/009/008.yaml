  text: הָל֤וֹךְ הָֽלְכוּ֙ הָ/עֵצִ֔ים לִ/מְשֹׁ֥חַ עֲלֵי/הֶ֖ם מֶ֑לֶךְ וַ/יֹּאמְר֥וּ לַ/זַּ֖יִת מלוכ/ה עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: de
  text: 'Die Bäume machten sich auf, um einen König über sich zu salben.[a] Sie sagten zum Ölbaum: »Sei König über uns!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen eine verstärkende Wendung: »gehend gingen sie«. Möglich ist auch: »Die Bäume zogen tatsächlich los, um einen König über sich zu salben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: machten sich auf
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb von הלך hebt das Losgehen hervor. »Machten sich auf« gibt den zielgerichteten Aufbruch in natürlichem, würdigem Deutsch wieder, ohne die hebräische Wiederholung hölzern nachzubilden.
- source_word: הָעֵצִים
  choice: die Bäume
  rationale: Der Plural bezeichnet in Jotams Fabel die personifizierten Bäume.
- source_word: לִמְשֹׁחַ
  choice: um … zu salben
  rationale: משׁח bezeichnet die Salbung zur Einsetzung in ein Amt. »Salben« bewahrt das konkrete königliche Bild.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: einen König über sich
  rationale: מֶלֶךְ ist hier unbestimmt, und על bezeichnet die Herrschaft über die Bäume; das reflexive »über sich« gibt den Bezug zum Subjekt knapp wieder.
- source_word: וַיֹּאמְרוּ לַזַּיִת
  choice: Sie sagten zum Ölbaum
  rationale: אמר ist das gewöhnliche Verb des Sagens; זית bezeichnet hier als personifiziertes Gegenüber den Ölbaum.
- source_word: מְלֹכָה עָלֵינוּ
  choice: Sei König über uns!
  rationale: Der Imperativ von מלך fordert den Ölbaum auf, das Königsamt auszuüben. »Sei König« hält den unmittelbaren Bezug zum zuvor genannten König deutlicher fest als das abstraktere »Herrsche«.
