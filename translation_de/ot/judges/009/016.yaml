  source_fidelity: Die Abfolge der drei offenen Bedingungssätze, die Namen Abimelech und Jerubbaal sowie die weite Bedeutung von „Haus“ sind im Entwurf im Wesentlichen zutreffend wiedergegeben. Die Wendung כִּגְמוּל יָדָיו verlangt jedoch eine Behandlung entsprechend dem, was seine Taten eingebracht bzw. verdient haben; „ihm nach dem vergolten habt, was seine Hände getan haben“ verschiebt dies zu einer Vergeltung bloß für die ausgeführten Handlungen und ist syntaktisch schwer verständlich.
  naturalness: „Gut an Jerubbaal und seinem Haus gehandelt“ ist im modernen Standarddeutsch wenig idiomatisch. „Jerubbaal und seinem Haus Gutes getan“ ist klar, würdig und wahrt die Bedeutung. Die abschließende, im Hebräischen absichtlich noch nicht aufgelöste Wenn-Periode bleibt erhalten.
  terminology: „Wahrheit und Aufrichtigkeit“, „zum König gemacht“, „Jerubbaal“ und „sein Haus“ sind angemessen. Die Fußnote sollte den hebräischen Ausdruck als „Lohn seiner Hände“ statt als „Ertrag seiner Hände“ erklären; „Ertrag“ legt zu stark einen materiellen Gewinn nahe.
