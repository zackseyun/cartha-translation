  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: de
  text: Und nun, wenn ihr in Wahrheit und Aufrichtigkeit gehandelt habt, als ihr Abimelech zum König gemacht habt, und wenn ihr Jerubbaal und seinem Haus Gutes getan habt, und wenn ihr an ihm gehandelt habt, wie es seinen Taten entsprach[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gemäß dem Lohn seiner Hände“. Die hebräische Wendung bezeichnet eine Behandlung, die seinen Taten entspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt den hebräischen Übergangsmarker natürlich wieder; der folgernde Zusammenhang ergibt sich aus Jotams fortlaufender Rede.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: in Wahrheit und Aufrichtigkeit
  rationale: 'Bewahrt die Paarung zweier ethischer Begriffe: verlässliches, wahrhaftiges Handeln und ungeteilte Lauterkeit.'
- source_word: וַתַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ
  choice: als ihr Abimelech zum König gemacht habt
  rationale: Das Hifil von מלך bezeichnet das Einsetzen zum König; „als“ stellt im Deutschen den sachlichen Bezug zum vorausgehenden Handeln klar her.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: gut an … gehandelt
  rationale: Gibt die Wendung nahe am Hebräischen und zugleich verständlich als wohlwollendes beziehungsweise angemessenes Behandeln wieder.
- source_word: בֵּיתוֹ
  choice: seinem Haus
  rationale: Bewahrt die familiäre und dynastische Weite von בית, die über einen bloßen Haushalt hinausreichen kann.
- source_word: כִּגְמוּל יָדָיו עֲשִׂיתֶם לוֹ
  choice: ihm nach dem vergolten habt, was seine Hände getan haben
  rationale: Erhält sowohl den Gedanken einer den Taten entsprechenden Vergeltung als auch das konkrete hebräische Bild der Hände.
theological_decisions:
- issue: Bewertung des Handelns an Jerubbaal
  choice: Die Bedingung bleibt offen und rhetorisch formuliert.
  alternative: Die Aussage ausdrücklich als Vorwurf oder als Anerkennung formulieren.
  rationale: Der Vers enthält eine Reihe von Wenn-Sätzen; ihre ironische beziehungsweise anklagende Kraft wird erst im Kontext deutlich und soll nicht in eine eindeutige Behauptung umgeformt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Bedingungssätze und das Handbild des Hebräischen bleiben erhalten; ungewöhnliche Semantik wird durch eine knappe Fußnote erschlossen.
