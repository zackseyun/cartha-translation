  text: וַ/אֲבִימֶ֗לֶךְ וְ/הָ/רָאשִׁים֙ אֲשֶׁ֣ר עִמּ֔/וֹ פָּשְׁט֕וּ וַ/יַּ֣עַמְד֔וּ פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וּ/שְׁנֵ֣י הָֽ/רָאשִׁ֗ים פָּֽשְׁט֛וּ עַֽל כָּל אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה וַ/יַּכּֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: de
  text: Abimelech und die Anführer, die bei ihm waren, stürmten vor und bezogen am Eingang des Stadttores Stellung. Die beiden anderen Abteilungen[a] stürmten auf alle los, die sich auf dem Feld befanden, und schlugen sie nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die beiden Anführer« oder »die beiden Häupter«. Im Zusammenhang sind wahrscheinlich die beiden übrigen Truppenabteilungen der drei in Vers 43 genannten Gruppen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: stürmten vor / stürmten auf … los
  rationale: Das Verb bezeichnet hier im militärischen Zusammenhang ein rasches Vorrücken beziehungsweise einen Angriff. Die beiden kontextgerechten deutschen Wendungen geben die jeweilige Zielrichtung natürlich wieder.
- source_word: הָרָאשִׁים
  choice: die Anführer
  rationale: Wörtlich steht »die Häupter«. In der ersten Satzhälfte bezeichnet der Ausdruck am ehesten die führenden Männer beziehungsweise Befehlshaber bei Abimelech.
- source_word: וַיַּעַמְדוּ
  choice: bezogen … Stellung
  rationale: Die Wendung beschreibt nicht bloß ein Stehen, sondern das bewusste Einnehmen einer militärischen Position am Stadttor.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: am Eingang des Stadttores
  rationale: Die Übersetzung bewahrt die konkrete Ortsangabe der hebräischen Genitivverbindung und ist im Deutschen verständlich.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: die beiden anderen Abteilungen
  rationale: Wörtlich lautet der schwierige Ausdruck »die beiden Häupter/Anführer«. Aufgrund der drei in Vers 43 genannten Truppenabteilungen sind hier wahrscheinlich die beiden übrigen Abteilungen gemeint; die wörtliche Lesart wird in der Fußnote offengelegt.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: auf alle …, die sich auf dem Feld befanden
  rationale: Das folgende pluralische Objektsuffix bei »schlugen sie nieder« weist darauf hin, dass Menschen und nicht Sachen oder Feldfrüchte gemeint sind.
- source_word: וַיַּכּוּם
  choice: schlugen sie nieder
  rationale: נכה kann schlagen, niederschlagen oder töten bedeuten. »Schlugen sie nieder« gibt die Gewalt deutlich wieder, ohne ausdrücklich festzulegen, dass ausnahmslos alle getötet wurden.
