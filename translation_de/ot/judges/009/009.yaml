  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: de
  text: 'Doch der Ölbaum sagte zu ihnen: »Soll ich mein kostbares Öl[b] aufgeben, mit dem man Götter[a] und Menschen ehrt, und hingehen, um über den Bäumen hin und her zu schwanken?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott“. Das hebräische Wort hat hier eine plurale Form und steht mit einem Verb im Plural; es kann jedoch auch als Bezeichnung für den einen Gott verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „meine Fettigkeit“ – ein Bild für den reichen Ertrag des Ölbaums, besonders sein Öl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזַּיִת
  choice: der Ölbaum
  rationale: Im Kontext der Fabel bezeichnet das Substantiv den als Figur sprechenden Olivenbaum; „Ölbaum“ ist die traditionelle und natürliche deutsche Bezeichnung.
- source_word: הֶחֳדַלְתִּי
  choice: Soll ich … aufgeben
  rationale: Das Perfekt steht hier in einer rhetorischen Frage. Die Wiedergabe mit „Soll ich“ erfasst den kontextuellen Sinn im heutigen Deutsch.
- source_word: דִּשְׁנִי
  choice: mein kostbares Öl
  rationale: Wörtlich bezeichnet das Wort die „Fettigkeit“ oder „Fülle“ des Ölbaums. Gemeint ist sein wertvoller Ertrag, besonders das Olivenöl; die Fußnote bewahrt das hebräische Bild.
- source_word: אֲשֶׁר בִּי
  choice: mit dem
  rationale: Die Formulierung wird instrumental verstanden und bezieht sich auf den Ertrag beziehungsweise das Öl des Baumes.
- source_word: יְכַבְּדוּ
  choice: man … ehrt
  rationale: Das hebräische Verb ist aktiv und plural, lässt das handelnde Subjekt in dieser Deutung jedoch unausgesprochen. Das deutsche „man“ bewahrt diese Unbestimmtheit natürlich.
- source_word: אֱלֹהִים
  choice: Götter
  rationale: Die morphologisch plurale Form und das plurale Verb stützen hier die Wiedergabe „Götter“. Die traditionsreiche Lesart „Gott“ wird in einer Fußnote offengehalten.
- source_word: וַאֲנָשִׁים
  choice: und Menschen
  rationale: „Menschen“ gibt den generischen Plural im modernen Deutsch natürlich und genau wieder.
- source_word: וְהָלַכְתִּי
  choice: und hingehen
  rationale: Die Verbform führt die rhetorische Frage fort; „hingehen“ wahrt die Bewegung zu der angebotenen Herrscherstellung.
- source_word: לָנוּעַ
  choice: um … zu schwanken
  rationale: „Schwanken“ bewahrt das Bild der sich bewegenden Baumkrone und zugleich die ironische Vorstellung, über den anderen Bäumen zu stehen.
- source_word: עַל הָעֵצִים
  choice: über den Bäumen
  rationale: Die Präposition bezeichnet hier die erhöhte beziehungsweise herrschende Stellung gegenüber den übrigen Bäumen.
theological_decisions:
- issue: Bezug und Numerus von אֱלֹהִים
  choice: Götter
  alternative: Gott
  rationale: Form und Verb sind plural und erlauben die Lesart „Götter“. Da אֱלֹהִים jedoch auch den Gott Israels bezeichnen kann und Olivenöl im Gottesdienst gebraucht wurde, wird „Gott“ als echte Auslegungs- und Übersetzungsalternative in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage und das ironische Baumbild bleiben erhalten; „kostbares Öl“ vermittelt den konkreten Sinn, während die Fußnote die bildhafte hebräische Ausdrucksweise dokumentiert.
