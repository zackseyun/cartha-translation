base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: de
  text: Sie gingen aufs Feld hinaus, lasen die Trauben ihrer Weinberge, traten sie aus und veranstalteten ein Fest[a]. Dann gingen sie in das Haus ihres Gottes[b], aßen und tranken und verfluchten Abimelech.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „veranstalteten ein Erntefest“ oder „feierten ausgelassen“. Das hebräische Wort bezeichnet eine festliche Feier, wahrscheinlich im Zusammenhang mit der Weinlese.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Haus ihrer Götter“. Die hebräische Form kann pluralisch verstanden werden, ist hier aber wahrscheinlich singularisch gemeint und bezeichnet die Gottheit, die in diesem Heiligtum verehrt wurde.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: Sie gingen aufs Feld hinaus
  rationale: Die Richtungsendung bezeichnet die Bewegung hinaus auf das Feld beziehungsweise ins offene Land. Die Formulierung ist im Deutschen natürlich und bewahrt die räumliche Bewegung.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: lasen die Trauben ihrer Weinberge
  rationale: בצר bezeichnet im Weinbau das Ernten beziehungsweise Lesen von Trauben. Die Ergänzung „die Trauben“ macht das im Hebräischen vorausgesetzte Erntegut klar.
- source_word: וַיִּדְרְכוּ
  choice: traten sie aus
  rationale: דרך bezeichnet hier das Treten der Trauben zur Saftgewinnung. „Austraten“ bewahrt das konkrete Bild besser als das allgemeinere „pressten“.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: veranstalteten ein Fest
  rationale: הִלּוּלִים bezeichnet hier eine festliche Feier, wahrscheinlich im Zusammenhang mit der Weinlese. Die genaue Art der Feier bleibt offen und wird in der Fußnote kenntlich gemacht.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: das Haus ihres Gottes
  rationale: „Haus“ gibt בֵּית formal wieder, ohne vorschnell „Tempel“ oder „Heiligtum“ einzusetzen. אֱלֹהֵיהֶם ist der Form nach auch pluralisch deutbar, bezeichnet im Zusammenhang aber wahrscheinlich die einzelne dort verehrte Gottheit.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: aßen und tranken
  rationale: Die direkte Wiedergabe wahrt die erzählerische Abfolge und fügt die im Kontext naheliegende Vorstellung eines Gelages nicht ausdrücklich hinzu.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: verfluchten Abimelech
  rationale: קלל im Piel bedeutet hier „verfluchen“ und bezeichnet mehr als bloßes Beschimpfen.
theological_decisions:
- issue: Wiedergabe von אֱלֹהֵיהֶם im Kontext eines nichtisraelitischen Kultes
  choice: ihres Gottes
  alternative: ihrer Götter
  rationale: Die hebräische Form kann morphologisch pluralisch verstanden werden; im unmittelbaren Zusammenhang ist jedoch wahrscheinlich die bestimmte Gottheit des aufgesuchten Heiligtums gemeint. Die Fußnote bewahrt die alternative Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Trauben lesen“ entspricht dem üblichen deutschen Ausdruck für die Weinernte; „austreten“ erhält das anschauliche Bild der Kelterarbeit. Die Satzfolge bleibt eng am hebräischen Erzählstil, wird aber durch „Dann“ natürlich gegliedert.
