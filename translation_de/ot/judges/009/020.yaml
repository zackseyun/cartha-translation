base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: de
  text: Wenn aber nicht, soll Feuer von Abimelech ausgehen und die führenden Männer von Sichem[a] und Bet-Millo[b] verzehren. Und Feuer soll von den führenden Männern Sichems und von Bet-Millo ausgehen und Abimelech verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die Herren von Sichem“. Gemeint sind die maßgeblichen oder führenden Männer der Stadt.'
    reason: lexical_alternative
  - marker: b
    text: Bet-Millo kann auch mit „das Haus Millo“ wiedergegeben werden; wahrscheinlich ist eine mit Sichem verbundene Örtlichkeit oder führende Gruppe gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: Wenn aber nicht
  rationale: Die knappe negative Bedingung führt den Gegensatz zum vorherigen Vers fort. Die Formulierung ist im Deutschen natürlich und lässt den im Kontext vorausgesetzten Sachverhalt unausgesprochen.
- source_word: תֵּצֵא אֵשׁ
  choice: soll Feuer … ausgehen
  rationale: Das Yiqtol hat hier im Rahmen des Fluchspruchs jussivischen Charakter. „Soll … ausgehen“ bewahrt diesen Wunsch- beziehungsweise Fluchton, ohne die Aussage auf eine bloße Zukunftsvorhersage festzulegen.
- source_word: וְתֹאכַל
  choice: und … verzehren
  rationale: אכל bezeichnet in Verbindung mit Feuer das Verzehren. Das deutsche Verb bewahrt das kräftige Feuerbild und klingt zugleich würdig und gegenwärtig.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: die führenden Männer von Sichem
  rationale: בעלים bezeichnet hier wahrscheinlich die politisch maßgeblichen Männer beziehungsweise Herren der Stadt, nicht allgemein sämtliche Einwohner. Die Wiedergabe macht ihre gesellschaftliche Stellung verständlich, ohne einen förmlichen Amtstitel vorauszusetzen.
- source_word: בֵּית מִלּוֹא
  choice: Bet-Millo
  rationale: Die Wendung wird als Eigenname einer mit Sichem verbundenen Örtlichkeit oder Gruppe transliteriert. Eine Fußnote hält die wörtlichere und sachlich mögliche Deutung offen.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: Und Feuer soll von den führenden Männern Sichems und von Bet-Millo ausgehen
  rationale: Die parallele Satzgestaltung wird beibehalten, damit die wechselseitige Struktur des Fluchspruchs deutlich bleibt.
theological_decisions:
- issue: Bedeutung des Feuerbildes
  choice: Das konkrete Bild des Feuers bleibt innerhalb des Fluchspruchs unaufgelöst stehen.
  alternative: „Feuer“ ausdrücklich als gewaltsamen Konflikt oder als unmittelbar von Gott gesandtes Gericht deuten.
  rationale: Der hebräische Text nennt Feuer und deutet damit im Kontext die gegenseitige Vernichtung an, legt aber nicht ausdrücklich fest, ob das Bild wörtlich, metaphorisch oder in beiderlei Sinn zu verstehen ist.
- issue: Charakter der Aussage
  choice: Die jussivische Fluchform wird mit „soll“ wiedergegeben.
  alternative: Die Verben als reine Zukunftsaussage mit „wird“ übersetzen.
  rationale: Die Verbformen stehen hier im Zusammenhang von Jotams Fluchwort. Die Übersetzung wahrt dessen verwünschenden Charakter, ohne eine Vorhersage auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die symmetrische Satzform und das wiederholte Feuerbild bilden die gegenseitige Vernichtung des hebräischen Fluchspruchs nach. „Sichem“ folgt der etablierten deutschen Namensform; „Bet-Millo“ bewahrt den wahrscheinlichen Eigennamen.
