  text: וַ/יֹּ֨סֶף ע֣וֹד גַּעַל֮ לְ/דַבֵּר֒ וַ/יֹּ֕אמֶר הִנֵּה עָם֙ יֽוֹרְדִ֔ים מֵ/עִ֖ם טַבּ֣וּר הָ/אָ֑רֶץ וְ/רֹאשׁ אֶחָ֣ד בָּ֔א מִ/דֶּ֖רֶךְ אֵל֥וֹן מְעוֹנְנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: de
  text: 'Gaal sprach weiter und sagte: „Sieh, da kommen Leute von der Mitte des Landes[a] herab, und eine Gruppe kommt auf dem Weg von der Wahrsager-Eiche[b] her.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Nabel des Landes“; gemeint ist wahrscheinlich der mittlere oder zentrale Teil des Landes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wahrsager-Terebinthe“ beziehungsweise „Eiche von Meonenim“. Die Baumart und die Bedeutung des letzten Namenselements sind unsicher; möglicherweise bezieht es sich auf Wahrsager oder Zeichendeuter.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: Gaal redete noch einmal
  rationale: Die hebräische Verbindung bedeutet idiomatisch, dass Gaal erneut das Wort ergreift. Die Wiedergabe ist natürlich und bewahrt die Wiederholung.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel weist nachdrücklich auf das gerade Beobachtete hin; „Seht“ ist modern, unmittelbar und hier an mehrere Anwesende gerichtet.
- source_word: עָם יֹרְדִים
  choice: da kommen Leute ... herab
  rationale: עָם bezeichnet allgemein Menschen bzw. Leute und legt für sich genommen keine militärische Bezeichnung fest. Das Partizip beschreibt die sichtbar fortschreitende Bewegung.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: von der Mitte des Landes
  rationale: טַבּוּר bedeutet wörtlich „Nabel“, bezeichnet geografisch jedoch die Mitte beziehungsweise den zentralen Teil eines Gebietes. Eine Fußnote bewahrt das Bild.
- source_word: וְרֹאשׁ אֶחָד
  choice: und eine Abteilung
  rationale: רֹאשׁ heißt wörtlich „Kopf“, bezeichnet hier aber offenbar eine gesonderte Gruppe der herannahenden Leute. „Abteilung“ vermittelt dies, ohne die Gruppe ausdrücklich als militärische Einheit festzulegen.
- source_word: מִדֶּרֶךְ
  choice: auf dem Weg von ... her
  rationale: Die Wendung kann Route oder Herkunftsrichtung bezeichnen. Diese Formulierung hält beide Aspekte im Deutschen eng zusammen.
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: Wahrsager-Eiche
  rationale: אֵלוֹן bezeichnet einen großen Baum, traditionell Eiche oder Terebinthe. מְעוֹנְנִים wird wahrscheinlich mit Wahrsagerei verbunden, kann aber auch als unübersetztes Ortsnamenelement verstanden werden; die Unsicherheit wird in der Fußnote genannt.
