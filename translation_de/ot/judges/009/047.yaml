  text: וַ/יֻּגַּ֖ד לַ/אֲבִימֶ֑לֶךְ כִּ֣י הִֽתְקַבְּצ֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/047.yaml
  text: And it was reported to Abimelech that all the leaders of the tower of Shechem had gathered together.
translation:
  language: de
  text: Abimelech wurde mitgeteilt, dass sich alle führenden Männer des Turms von Sichem versammelt hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: Abimelech wurde gemeldet
  rationale: Das unpersönliche Passiv von נגד wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: בַּעֲלֵי
  choice: führenden Männer
  rationale: בעל bezeichnet hier im Zusammenhang mit der Stadtbevölkerung nicht wörtlich »Herren« oder Besitzer, sondern maßgebliche männliche Angehörige beziehungsweise führende Bürger der Gemeinschaft.
- source_word: מִגְדַּל שְׁכֶם
  choice: des Turms von Sichem
  rationale: Die formale Ortsbezeichnung bleibt erhalten; der Kontext lässt offen, ob damit ein befestigter Turm, eine Zitadelle oder die zugehörige Siedlung gemeint ist.
- source_word: הִתְקַבְּצוּ
  choice: sich … versammelt hatten
  rationale: Das Hitpael drückt das Zusammenkommen aus; das Plusquamperfekt macht deutlich, dass die Versammlung vor der Meldung lag.
