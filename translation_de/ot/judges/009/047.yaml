  source_fidelity: Der hebräische Satz besagt, dass Abimelech Nachricht erhielt, alle baʿalê des Turms von Sichem hätten sich versammelt. „führenden Männer“ ist im Kontext als Wiedergabe von בַּעֲלֵי vertretbar und wahrt die im englischen Audit gewählte Bedeutung „leaders“.
  naturalness: „Abimelech wurde gemeldet“ ist im modernen Standarddeutsch syntaktisch missverständlich, weil Abimelech dabei wie der Gegenstand der Meldung wirken kann. „Abimelech wurde mitgeteilt“ gibt den gemeinten Dativbezug klar und idiomatisch wieder.
  terminology: Abimelech und Sichem sind angemessene Namensformen. „Turm von Sichem“ bewahrt die Ortsbezeichnung ohne eine nicht gesicherte Präzisierung als Zitadelle. Keine Fußnote ist erforderlich.
