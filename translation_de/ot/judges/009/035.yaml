  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: de
  text: Gaal, der Sohn Ebeds, ging hinaus[a] und stand am Eingang des Stadttores. Da erhoben sich Abimelech und die Leute, die bei ihm waren, aus dem Hinterhalt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kam heraus«. Das hebräische Verb bezeichnet lediglich eine Bewegung nach draußen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vom Ort des Hinterhalts«. Das hebräische Substantiv kann sowohl den Hinterhalt selbst als auch dessen Standort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging hinaus
  rationale: יצא bezeichnet eine Bewegung nach draußen. »Ging hinaus« gibt die Erzählbewegung natürlich wieder, ohne den Ausgangspunkt näher festzulegen.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal, der Sohn Ebeds
  rationale: Die Namen werden in geläufiger deutscher Form wiedergegeben; die hebräische Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: וַיַּעֲמֹד
  choice: stellte sich
  rationale: עמד kann »stehen« oder »sich hinstellen/Aufstellung nehmen« bedeuten. Im Kontext bezeichnet es, dass Gaal am Tor seinen Platz einnimmt, ohne zwingend eine militärische Nuance hinzuzufügen.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: an den Eingang des Stadttores
  rationale: Die Formulierung bewahrt die konstruktive Verbindung »Eingang/Öffnung des Stadttores« und klingt im Deutschen natürlich.
- source_word: וַיָּקָם
  choice: erhoben sich
  rationale: קום beschreibt hier das Aufstehen beziehungsweise Hervorkommen zum Handeln. »Erhoben sich« bleibt nahe am hebräischen Ausdruck; der folgende Satzteil liefert den taktischen Zusammenhang.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: und die Leute, die bei ihm waren
  rationale: עם bedeutet wörtlich »Volk/Leute«. Im militärischen Zusammenhang sind Abimelechs Begleiter gemeint; »Leute« ist verständlich, ohne ausdrücklich »Truppen« in den Text einzutragen.
- source_word: מִן הַמַּאְרָב
  choice: aus dem Hinterhalt
  rationale: מארב kann den Hinterhalt als taktische Anordnung oder den Ort des Hinterhalts bezeichnen. »Aus dem Hinterhalt« ist idiomatisch und bewahrt diese Offenheit weitgehend.
