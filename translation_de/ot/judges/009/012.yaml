  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: de
  text: 'Da sagten die Bäume zum Weinstock: »Komm, herrsche als König über uns!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Geh, du, sei König über uns!« Die hebräische Aufforderungsform wird im Deutschen natürlicher mit »Komm, herrsche als König über uns!« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Waw-Consecutivum führt die Handlung weiter. »Da sagten« gibt die zeitliche Abfolge im Deutschen natürlich wieder; »Und die Bäume sagten« wäre ebenfalls möglich.
- source_word: הָעֵצִים
  choice: die Bäume
  rationale: Im Zusammenhang von Jotams Fabel bezeichnet der Plural konkrete Bäume, nicht Holz als Material.
- source_word: לַגָּפֶן
  choice: zum Weinstock
  rationale: גֶּפֶן bezeichnet den Weinstock beziehungsweise die Weinrebe. »Weinstock« ist im Deutschen eindeutig und passt zur Personifikation.
- source_word: לְכִי
  choice: Komm
  rationale: הלך bedeutet grundsätzlich »gehen«; in dieser auffordernden Verbindung mit einem weiteren Imperativ ist »Komm« im Deutschen die natürliche Einladung, die Herrschaft zu übernehmen.
- source_word: אַתְּ
  choice: im Imperativ mitgedacht
  rationale: Das feminine Singularpronomen hebt die angesprochene, im Hebräischen grammatisch feminine Weinrebe hervor. Im natürlichen Deutschen muss »du« neben dem Imperativ nicht ausdrücklich stehen.
- source_word: מְלֹכִי
  choice: herrsche als König
  rationale: Der feminine Singularimperativ von מלך bezeichnet königliches Herrschen. »Herrsche als König« bewahrt den königlichen Bedeutungsanteil deutlicher als das allgemeinere »herrsche«.
- source_word: עָלֵינוּ
  choice: über uns
  rationale: Mit מלך bezeichnet עַל den Herrschaftsbereich; die natürliche deutsche Verbindung lautet »über uns herrschen«.
