base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: de
  text: Da versammelten sich alle führenden Männer von Sichem und ganz Bet-Millo[a]. Sie gingen hin und machten Abimelech zum König bei der Eiche des aufgerichteten Denkmals[b], die in Sichem war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Millo kann „Haus Millo“ bedeuten; wahrscheinlich dient der Ausdruck hier jedoch als Name eines Ortes oder einer Gruppe.
    reason: cultural_note
  - marker: b
    text: 'Oder: „bei der Eiche, die bei einem aufgerichteten Denkmal stand“. Der hebräische Ausdruck ist schwierig; insbesondere die genaue Bedeutung von מֻצָּב und seine Beziehung zu „Eiche“ sind unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: die führenden Männer von Sichem
  rationale: בַּעֲלִים bezeichnet wörtlich Besitzer, Herren oder Machthaber. Im städtisch-politischen Zusammenhang sind die maßgeblichen Männer der Stadt gemeint; „führende Männer“ gibt diese Funktion verständlich wieder, ohne eine feudale Herrschaftsordnung vorauszusetzen.
- source_word: בֵּית מִלּוֹא
  choice: Bet-Millo
  rationale: Der Ausdruck dient hier wahrscheinlich als Orts- oder Gruppenname. Die Umschrift bewahrt die Unsicherheit über den genauen Bezug und vermeidet die voreilige Deutung als gewöhnliches „Haus“ oder als Haushalt.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: machten Abimelech zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen. Die Formulierung bleibt nah am Hebräischen und fügt keine ausdrücklich erwähnte Krönungszeremonie hinzu.
- source_word: עִם
  choice: bei
  rationale: In Verbindung mit einem örtlichen Bezugspunkt bezeichnet עִם hier die Nähe; „bei“ ist im Deutschen eine natürliche räumliche Wiedergabe.
- source_word: אֵלוֹן
  choice: Eiche
  rationale: אֵלוֹן bezeichnet einen großen Baum, oft eine Eiche oder Terebinthe. „Eiche“ ist eine herkömmliche, gut verständliche Wiedergabe; die genaue Baumart lässt sich nicht sicher bestimmen.
- source_word: מֻצָּב
  choice: Standmal
  rationale: Das Wort bezeichnet wahrscheinlich etwas Aufgerichtetes oder Stehendes. „Standmal“ bewahrt den Bezug auf einen errichteten Gegenstand, ohne ihn sicher als Säule oder Stein festzulegen; die schwierige Verbindung mit אֵלוֹן wird in einer Fußnote kenntlich gemacht.
- source_word: וַיֵּאָסְפוּ
  choice: versammelten sich
  rationale: Das Verb bezeichnet das Zusammenkommen einer Gruppe. „Versammelten sich“ ist präzise, natürlich und dem erzählenden Stil angemessen.
