  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: de
  text: So ließ Gott Abimelechs Bosheit auf ihn selbst zurückfallen, die er an seinem Vater begangen hatte, indem er seine siebzig Brüder tötete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „So ließ Gott Abimelechs Bosheit zurückkehren.“ Das hebräische Bild besagt, dass seine Bosheit auf ihn selbst zurückfiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: So ließ ... auf ihn selbst zurückfallen
  rationale: Der Hifil von שוב bezeichnet hier, dass Gott Abimelechs Bosheit auf ihn zurückkehren ließ. Die Formulierung bewahrt das hebräische Bild und die ausdrückliche göttliche Verursachung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort bezeichnet hier mit dem singularischen Verb den einen Gott, der als Handelnder im Gericht auftritt.
- source_word: רָעַת
  choice: Bosheit
  rationale: Gemeint ist nicht bloß erlittenes Unheil, sondern die moralisch verwerfliche Tat Abimelechs. „Bosheit“ gibt diese ethische Bedeutung natürlich wieder.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er ... begangen hatte
  rationale: Das Plusquamperfekt verdeutlicht im rückblickenden Erzählsatz, dass die Tat dem nun geschilderten Gericht vorausging.
- source_word: לְאָבִיו
  choice: an seinem Vater
  rationale: Die Präposition kennzeichnet den von der Bosheit Betroffenen. „An seinem Vater“ ist im Deutschen idiomatisch und lässt die folgende Erläuterung den konkreten Inhalt der Tat bestimmen.
- source_word: לַהֲרֹג
  choice: indem er ... tötete
  rationale: Der Infinitiv erläutert, worin die am Vater begangene Bosheit bestand. „Indem“ stellt diesen inhaltlichen Zusammenhang klar dar.
- source_word: שִׁבְעִים אֶחָיו
  choice: seine siebzig Brüder
  rationale: Die direkte Wiedergabe bewahrt sowohl die Zahl als auch die für das Verbrechen zentrale familiäre Beziehung.
- source_word: וַ
  choice: So
  rationale: Die Konjunktion führt hier die zusammenfassende Folge des vorangegangenen Geschehens ein; „So“ gibt diesen resultativen Zusammenhang natürlich wieder.
theological_decisions:
- issue: Göttliches Handeln im Gericht
  choice: Gott ließ Abimelechs Bosheit aktiv auf ihn selbst zurückfallen.
  alternative: Gott ließ lediglich zu, dass Abimelechs Bosheit Folgen für ihn hatte.
  rationale: Gott ist im hebräischen Satz ausdrücklich Subjekt des kausativen Verbs. Die Übersetzung wahrt diese direkte göttliche Gerichtswirkung, ohne sie zu einer bloßen Zulassung abzuschwächen.
- issue: Die Bosheit gegenüber Abimelechs Vater
  choice: Die Ermordung der siebzig Brüder wird als Bosheit an seinem Vater bezeichnet.
  alternative: Die Formulierung könnte freier als eine Tat „gegen das Haus seines Vaters“ erklärt werden.
  rationale: Der Text nennt ausdrücklich „seinen Vater“. Diese auffällige familiäre Perspektive bleibt erhalten, statt durch eine erklärende Erweiterung vereindeutigt zu werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte hebräische Gerichtssprache wird im Haupttext weitgehend bewahrt; „auf ihn selbst“ macht ihren Zielbezug verständlich. Der Fußnotenmarker steht unmittelbar nach dem Satz.
