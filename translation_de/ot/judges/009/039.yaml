  text: וַ/יֵּ֣צֵא גַ֔עַל לִ/פְנֵ֖י בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּלָּ֖חֶם בַּ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: de
  text: Da zog Gaal vor den führenden Männern von Sichem aus und kämpfte gegen Abimelech.a
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … aus
  rationale: Das Qal-Wayyiqtol von יצא bezeichnet im erzählenden Zusammenhang das Hinausziehen; im militärischen Kontext ist „zog aus“ natürlich und präzise.
- source_word: גַעַל
  choice: Gaal
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: לִפְנֵי
  choice: an der Spitze
  rationale: Wörtlich bedeutet die Präposition „vor“. In diesem militärischen Zusammenhang bezeichnet sie plausibel Gaals führende Stellung vor den Männern von Sichem; „an der Spitze“ gibt diese idiomatische Funktion natürlich wieder.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: der führenden Männer von Sichem
  rationale: בעלים meint hier die maßgeblichen Männer beziehungsweise politisch einflussreichen Bürger der Stadt. „Führende Männer“ vermeidet den feudalen Beiklang von „Herren“.
- source_word: וַיִּלָּחֶם
  choice: kämpfte
  rationale: Das Niphal-Wayyiqtol von לחם bedeutet hier „kämpfen“ beziehungsweise „eine Schlacht führen“.
- source_word: בַּאֲבִימֶלֶךְ
  choice: gegen Abimelech
  rationale: Bei לחם kennzeichnet ב den Gegner; im Deutschen wird dies eindeutig mit „gegen“ ausgedrückt.
