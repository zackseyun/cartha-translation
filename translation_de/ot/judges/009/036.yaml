source:
  edition: WLC
  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: de
  text: 'Als Gaal das Volk sah, sagte er zu Sebul: »Sieh, da kommt ein Volk von den Gipfeln der Berge herunter.« Sebul aber sagte zu ihm: »Du hältst den Schatten der Berge für Männer.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Du siehst den Schatten der Berge wie Männer.«'
    reason: Die hebräische Vergleichskonstruktion mit כְּ kann wörtlicher wiedergegeben werden; der Haupttext drückt die im Zusammenhang naheliegende Fehlwahrnehmung idiomatisch aus.
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Qal wayyiqtol von ראה bezeichnet in der fortlaufenden Erzählung schlicht das Sehen.
- source_word: הָעָם / עָם
  choice: das Volk / ein Volk
  rationale: עָם bedeutet gewöhnlich »Volk« beziehungsweise eine Menschengruppe. Der Zusammenhang legt zwar eine Truppe nahe, doch der hebräische Text bezeichnet sie nicht ausdrücklich als Heer oder Soldaten.
- source_word: הִנֵּה
  choice: Sieh, da
  rationale: Die aufmerksamkeitslenkende Partikel wird in direkter Rede mit einer natürlichen, gegenwärtigen deutschen Wendung wiedergegeben.
- source_word: יוֹרֵד
  choice: kommt ... herunter
  rationale: Das morphologisch singularische Verb stimmt mit dem Kollektivnomen עָם überein; auch im Deutschen ist bei »ein Volk« der Singular angemessen. »Herunterkommen« gibt die Bewegung vom höher gelegenen Gelände aus der Perspektive des Beobachters wieder.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: von den Gipfeln der Berge
  rationale: רֹאשׁ bezeichnet im Zusammenhang mit Bergen deren Spitze oder Gipfel; die Formulierung wahrt den hebräischen Plural.
- source_word: צֵל הֶהָרִים
  choice: den Schatten der Berge
  rationale: צֵל bedeutet »Schatten« oder »Schutz/Schattenplatz«; hier passt »Schatten« zu der von Sebul behaupteten optischen Täuschung.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: Du hältst ... für Männer
  rationale: Die idiomatische deutsche Formulierung bringt die von Sebul behauptete Fehlwahrnehmung klar zum Ausdruck. Die wörtlichere Vergleichskonstruktion bleibt in der Fußnote erhalten.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Das grammatisch maskuline Pluralwort bezeichnet hier im militärischen Erzählzusammenhang wahrgenommene männliche Gestalten; »Männer« ist daher genauer als das allgemeinere »Menschen«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die direkte Rede ist klar und natürlich formuliert; altertümliches »siehe« wird vermieden. Die im Hebräischen angelegte Spannung zwischen wörtlichem Vergleich und behaupteter Fehlwahrnehmung wird durch die Fußnote bewahrt.
