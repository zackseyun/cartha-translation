  source_fidelity: 'Der Entwurf gibt die Erzählabfolge und die zentralen hebräischen Ausdrücke zutreffend wieder: Gaal sieht „das Volk“, meldet ein herabkommendes „Volk“, und Sebul erklärt das Gesehene als Schatten der Berge, die Gaal für Männer hält. „Für Männer halten“ gibt die von Sebul behauptete Fehlwahrnehmung idiomatisch wieder, ohne die militärische Identität der Gruppe expliziter zu bestimmen als der Ausgangstext.'
