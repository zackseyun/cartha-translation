  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: de
  text: Und Gott ließ all das Böse der Männer von Sichem auf ihre eigenen Köpfe zurückfallen, und der Fluch Jotams, des Sohnes Jerubbaals, kam über sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: ließ … zurückfallen
  rationale: Der Hifil von שוב bezeichnet hier, mit dem Bösen als Objekt und »auf ihren Kopf« als Ergänzung, das vergeltende Zurückbringen ihrer eigenen Taten. Die Formulierung bewahrt sowohl Gottes aktive Verursachung als auch das hebräische Bild.
- source_word: רָעַת
  choice: das Böse
  rationale: רָעָה bezeichnet hier die moralisch bösen Taten der Männer von Sichem und nicht bloß ein Unglück.
- source_word: בְּרֹאשָׁם
  choice: auf ihren eigenen Kopf
  rationale: 'Die Wendung bewahrt das hebräische Vergeltungsbild: Die Folgen treffen die Täter selbst.'
- source_word: קִלֲלַת
  choice: der Fluch
  rationale: Gemeint ist Jotams zuvor ausgesprochener Fluch; »Fluch« ist im Deutschen natürlich und kontextuell eindeutig.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: kam über sie
  rationale: Die Formulierung erhält das Bewegungsbild und drückt aus, dass der Fluch an ihnen wirksam wurde.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: die Männer von Sichem
  rationale: Dies entspricht der grammatisch männlichen und konkreten Bezeichnung im Hebräischen, ohne sie zu »Bewohner« oder »Führer« zu verallgemeinern.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort bezeichnet hier mit singularischer Verbform eindeutig Gott als handelndes Subjekt.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: Jotams, des Sohnes Jerubbaals
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Göttliche Vergeltung
  choice: Gott ließ das Böse aktiv auf die Täter zurückfallen.
  alternative: Gott erlaubte lediglich, dass ihr Böses auf sie zurückfiel.
  rationale: Gott ist das grammatische Subjekt des kausativen Verbs הֵשִׁיב. Die Übersetzung bewahrt daher seine aktive richterliche Handlung und schwächt sie nicht zu bloßer Zulassung ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche hebräische Vergeltungsformel »auf ihren eigenen Kopf« bleibt bewusst erhalten; »ließ … zurückfallen« klingt natürlich und bildet zugleich die kausative Aussage des Ausgangstextes ab.
