id: JDG.9.34
reference: Judges 9:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: de
  text: Da standen Abimelech und alle Leute, die bei ihm waren, in der Nacht auf und legten sich in vier Gruppen[a] gegen Sichem auf die Lauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vier Köpfe“; gemeint sind vier Gruppen oder Abteilungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: standen … auf
  rationale: Das Verb קום bezeichnet hier im fortlaufenden Erzählstil das Aufstehen und Sich-in-Bewegung-Setzen. „standen … auf“ bewahrt das konkrete Bild, ohne bereits einen Aufbruch hineinzulesen.
- source_word: לָיְלָה
  choice: in der Nacht
  rationale: Der Ausdruck dient als adverbiale Zeitangabe. „in der Nacht“ ist im modernen Deutschen natürlich und legt keine Dauer über die ganze Nacht nahe.
- source_word: וַיֶּאֶרְבוּ
  choice: legten sich … auf die Lauer
  rationale: ארב bezeichnet ein verborgenes Warten mit feindlicher Absicht. Die deutsche Wendung gibt den Hinterhalt anschaulich und idiomatisch wieder.
- source_word: עַל שְׁכֶם
  choice: gegen Sichem
  rationale: עַל bezeichnet zusammen mit ארב hier am ehesten das feindliche Ziel des Hinterhalts und nicht bloß dessen Ort.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: in vier Gruppen
  rationale: Wörtlich steht „vier Köpfe“. Gemeint sind vier getrennte Einheiten. „Gruppen“ ist klar und vermeidet eine militärische Spezifizierung, die der hebräische Ausdruck nicht ausdrücklich enthält.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: alle Leute, die bei ihm waren
  rationale: עַם ist grundsätzlich „Volk/Leute“. Im Deutschen bezeichnet „alle Leute“ in diesem Zusammenhang natürlich die gesamte bei Abimelech befindliche Schar, ohne ausdrücklich „Männer“ oder „Truppen“ einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die feindliche Ausrichtung des Hinterhalts bleibt durch „gegen Sichem“ erhalten; die ungewöhnliche hebräische Wendung wird in einer Fußnote sichtbar gemacht.
