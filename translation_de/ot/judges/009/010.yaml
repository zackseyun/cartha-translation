base_translation:
  language: en
  yaml_path: translation/ot/judges/009/010.yaml
  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: de
  text: 'Da sagten die Bäume zum Feigenbaum: »Komm du und herrsche über uns!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Waw mit der narrativen Verbform führt die Handlung weiter. »Da« gibt die zeitlich-fortschreitende Erzählbewegung im Deutschen natürlich wieder.
- source_word: הָעֵצִים
  choice: die Bäume
  rationale: Im Zusammenhang der Fabel bezeichnet der Plural עֵצִים eindeutig die als handelnde und sprechende Figuren dargestellten Bäume.
- source_word: לַתְּאֵנָה
  choice: zum Feigenbaum
  rationale: תְּאֵנָה bezeichnet hier den Feigenbaum, nicht dessen Frucht; die Präposition ל markiert den Adressaten.
- source_word: לְכִי אַתְּ
  choice: Komm du
  rationale: Der feminine Singular des Imperativs von הלך und das ausdrücklich gesetzte Pronomen אַתְּ bilden eine nachdrückliche Aufforderung. »Komm du« bewahrt diese Hervorhebung in natürlichem Deutsch.
- source_word: מָלְכִי
  choice: herrsche
  rationale: Der feminine Imperativ von מלך fordert den Feigenbaum auf, königliche Herrschaft auszuüben. »Herrsche« gibt die verbale Bedeutung knapp und idiomatisch wieder.
- source_word: עָלֵינוּ
  choice: über uns
  rationale: Bei מלך bezeichnet עַל diejenigen, über die geherrscht wird; »über uns« ist die übliche deutsche Verbindung.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Erzählton. Das betonte selbstständige Pronomen wird durch »du« wiedergegeben; das grammatische Femininum des Hebräischen lässt sich beim deutschen Maskulinum »Feigenbaum« nicht formal abbilden.
