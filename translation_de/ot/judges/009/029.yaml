  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: de
  text: 'Wenn ich dieses Volk doch in meiner Hand hätte[a]! Dann würde ich Abimelech beseitigen. Und er sagte zu Abimelech[b]: »Verstärke dein Heer und rück aus!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Wer gäbe dieses Volk in meine Hand? Dann würde ich Abimelech beseitigen.« Die hebräische Frageform ist eine Wunschformel.'
    reason: lexical_alternative
  - marker: b
    text: Die Aufforderung »Verstärke dein Heer und rück aus!« ist wohl eine an Abimelech gerichtete Verhöhnung oder Herausforderung, ob unmittelbar ausgesprochen oder rhetorisch formuliert.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: Wenn … doch
  rationale: Die hebräische Wendung drückt idiomatisch einen Wunsch aus, keine gewöhnliche Informationsfrage. Die deutsche Konstruktion mit »doch« gibt diesen Wunsch natürlich wieder.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: עָם bezeichnet hier kollektiv die betreffende Bevölkerung beziehungsweise Gefolgschaft. »Dieses Volk« bewahrt die singularische Kollektivform, ohne den Ausdruck vorschnell auf ein Heer einzuengen.
- source_word: בְּיָדִי
  choice: in meiner Hand
  rationale: Die wörtliche Metapher bezeichnet Verfügungsgewalt oder Kontrolle und ist auch im Deutschen verständlich.
- source_word: וְאָסִירָה
  choice: würde ich … beseitigen
  rationale: Der Hifil von סור bedeutet entfernen oder wegschaffen. »Beseitigen« lässt offen, ob Vertreibung, Entmachtung oder Tötung gemeint ist, und passt zur feindseligen Drohung.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: Und er sagte zu Abimelech
  rationale: ל kennzeichnet am naheliegendsten den Adressaten. Der Wortlaut wird daher als an Abimelech gerichtete Herausforderung wiedergegeben, ohne festzulegen, ob er sie unmittelbar hören konnte.
- source_word: רַבֶּה צְבָאֲךָ
  choice: Verstärke dein Heer
  rationale: רבה fordert dazu auf, das Heer größer beziehungsweise zahlreicher zu machen. »Verstärke dein Heer« ist im modernen Deutschen militärisch natürlich und bewahrt den Sinn.
- source_word: וָצֵאָה
  choice: und rück aus
  rationale: יצא bedeutet hinausgehen. Im Zusammenhang einer militärischen Herausforderung gibt »rück aus« die gemeinte Bewegung prägnant und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wunschformel wird idiomatisch wiedergegeben; die Hand-Metapher und die mögliche Unbestimmtheit von Abimelechs »Beseitigung« bleiben erhalten. Der militärische Schluss ist knapp und herausfordernd formuliert.
