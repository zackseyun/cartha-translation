  text: וַ/יֵּ֥לֶךְ אֲבִימֶ֖לֶךְ אֶל תֵּבֵ֑ץ וַ/יִּ֥חַן בְּ/תֵבֵ֖ץ וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: de
  text: Dann zog Abimelech nach Tebez, schlug sein Lager vor Tebez auf[a] und nahm die Stadt ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lagerte sich bei Tebez“. Die hebräische Präposition kann auch „in Tebez“ bedeuten; im militärischen Zusammenhang ist jedoch wahrscheinlich ein Lager vor beziehungsweise gegen die Stadt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: zog
  rationale: הלך bezeichnet zunächst das Gehen oder Ziehen. Im militärischen Erzählzusammenhang ist „zog“ natürlich, ohne die stärkere Färbung von „marschierte“ einzutragen.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶל תֵּבֵץ
  choice: nach Tebez
  rationale: אֶל bezeichnet hier die Bewegung auf einen Ort zu. Bei Städtenamen ist „nach“ im Deutschen die natürliche Entsprechung.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: schlug sein Lager vor Tebez auf
  rationale: חנה bedeutet „lagern, das Lager aufschlagen“. Obwohl בְּ häufig „in“ bedeutet, legt der militärische Zusammenhang eine Stellung vor beziehungsweise gegen die Stadt nahe.
- source_word: וַיִּלְכְּדָהּ
  choice: nahm die Stadt ein
  rationale: לכד bezeichnet bei einer Stadt ihre Eroberung oder Einnahme. Das feminine Suffix verweist auf Tebez als Stadt; die ausdrückliche Wiedergabe mit „die Stadt“ ist im Deutschen klarer als „sie“.
theological_decisions: []
