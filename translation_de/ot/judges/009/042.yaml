  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֵּצֵ֥א הָ/עָ֖ם הַ/שָּׂדֶ֑ה וַ/יַּגִּ֖דוּ לַ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: de
  text: Am nächsten Tag ging das Volk hinaus aufs Feld, und man meldete es Abimelech.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die hebräische Erzählungsformel leitet das nächste Geschehen ein. Im modernen Deutschen gibt die knappe Zeitangabe den natürlichen Erzählungsfortgang wieder, ohne ein schwerfälliges »Und es geschah«.
- source_word: וַיֵּצֵא
  choice: ging … hinaus
  rationale: יצא bezeichnet hier die Bewegung aus der Stadt beziehungsweise dem bisherigen Aufenthaltsort ins offene Land.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם ist eine kollektive Bezeichnung für die Bevölkerung beziehungsweise die Leute und ist nicht auf Männer beschränkt.
- source_word: הַשָּׂדֶה
  choice: aufs Feld
  rationale: שָׂדֶה bezeichnet hier das offene oder bewirtschaftete Land außerhalb der Stadt; »aufs Feld« ist in Verbindung mit »hinausgehen« idiomatisches Deutsch.
- source_word: וַיַּגִּדוּ
  choice: man meldete es
  rationale: Die dritte Person Plural hat ein unbestimmtes Subjekt. Das deutsche unpersönliche »man« bewahrt diesen Sinn natürlich und bleibt näher an der aktiven Form als ein Passiv.
- source_word: לַאֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Eigenname אֲבִימֶלֶךְ wird in der im Deutschen etablierten biblischen Form »Abimelech« wiedergegeben.
theological_decisions: []
