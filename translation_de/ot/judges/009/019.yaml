source:
  edition: WLC
  text: וְ/אִם בֶּ/אֱמֶ֨ת וּ/בְ/תָמִ֧ים עֲשִׂיתֶ֛ם עִם יְרֻבַּ֥עַל וְ/עִם בֵּית֖/וֹ הַ/יּ֣וֹם הַ/זֶּ֑ה שִׂמְחוּ֙ בַּ/אֲבִימֶ֔לֶךְ וְ/יִשְׂמַ֥ח גַּם ה֖וּא בָּ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: de
  text: Und wenn ihr heute gegenüber Jerubbaal und seinem Haus[a] in Treue und Aufrichtigkeit gehandelt habt, dann freut euch über Abimelech, und auch er soll sich über euch freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Haus“ kann hier Jerubbaals Haushalt, Familie oder Dynastie gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Gedankengang als auch die konditionale Form.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: in Treue und Aufrichtigkeit
  rationale: אֱמֶת bezeichnet hier verlässliches, loyales Handeln, während תָמִים die Lauterkeit beziehungsweise ungeteilte Integrität des Handelns hervorhebt.
- source_word: עֲשִׂיתֶם עִם
  choice: ihr … an … gehandelt habt
  rationale: Gibt die relationale Wendung עשה עם in natürlichem, würdigem Deutsch wieder.
- source_word: יְרֻבַּעַל
  choice: Jerubbaal
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: בֵּיתוֹ
  choice: seinem Haus
  rationale: Bewahrt die Bildsprache und die Bedeutungsbreite von בַּיִת, die Haushalt, Familie oder Sippe umfassen kann.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Natürliche moderne Wiedergabe des wörtlichen Ausdrucks „an diesem Tag“.
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: freut euch über Abimelech
  rationale: Bei שׂמח mit ב bezeichnet die Präposition hier den Anlass beziehungsweise Gegenstand der Freude; „über“ ist im Deutschen natürlicher als „in“.
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: und auch er soll sich über euch freuen
  rationale: Der Imperfekt nach dem Imperativ hat auffordernden beziehungsweise jussivischen Sinn und wahrt die pointierte Gegenseitigkeit.
theological_decisions:
- issue: Ob Jotams Aufforderung echte Billigung oder ironisch-sarkastische Zuspitzung ist
  choice: Die bedingte Aufforderung wird ohne ausdrückliche Ironiemarkierung übersetzt.
  alternative: '„dann nur zu: Freut euch …“ oder eine andere klar sarkastische Formulierung'
  rationale: Der Zusammenhang legt Ironie nahe, doch die hebräische Satzform lässt sie pragmatisch entstehen und bezeichnet sie nicht ausdrücklich. Die Übersetzung soll diese rhetorische Spannung nicht vorentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konditionale Rhetorik und die symmetrische Aufforderung zur Freude bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
