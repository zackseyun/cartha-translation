  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: de
  text: Als Sebul, der Vorsteher der Stadt, die Worte Gaals, des Sohnes Ebeds, hörte, entbrannte sein Zorn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Nase brannte“; eine hebräische Redewendung dafür, dass jemand zornig wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bezeichnet hier das Vernehmen von Gaals Worten. Die Konstruktion mit „Als … hörte“ gibt den erzählerischen Zusammenhang im Deutschen natürlich wieder.
- source_word: זְבֻל
  choice: Sebul
  rationale: Der Personenname wird gemäß der im Deutschen gebräuchlichen biblischen Namensform wiedergegeben.
- source_word: שַׂר הָעִיר
  choice: der Befehlshaber der Stadt
  rationale: שַׂר bezeichnet einen führenden Amtsträger. „Befehlshaber“ lässt Sebuls Autoritätsstellung erkennen, ohne ein modernes Verwaltungsamt wie „Bürgermeister“ vorauszusetzen.
- source_word: אֶת דִּבְרֵי
  choice: die Worte
  rationale: Die konkrete hebräische Wendung wird formal bewahrt und ist auch im Deutschen idiomatisch.
- source_word: גַּעַל בֶּן עָבֶד
  choice: Gaals, des Sohnes Ebeds
  rationale: Die Namen werden in ihren gebräuchlichen deutschen biblischen Formen wiedergegeben; der Genitiv fügt die Herkunftsangabe natürlich in den Satz ein.
- source_word: וַיִּחַר אַפּוֹ
  choice: entbrannte sein Zorn
  rationale: 'Die Wiedergabe bewahrt das hebräische Bild des Brennens, vermittelt aber zugleich verständlich dessen idiomatische Bedeutung: Sebul wurde zornig.'
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der Satzbau ist flüssig, während das Bild des entbrennenden Zorns erhalten bleibt. Die Amtsbezeichnung wird bewusst allgemein gehalten, da die genaue institutionelle Funktion von שַׂר hier nicht näher bestimmt ist.
