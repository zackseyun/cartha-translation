base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: de
  text: 'Als man Jotam davon berichtete, ging er hin, stellte sich auf den Gipfel des Berges Garizim, erhob seine Stimme und rief ihnen zu: »Hört auf mich, ihr Herren von Sichem[a], damit Gott auf euch hört.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr führenden Männer von Sichem«. Hebräisch wörtlich: »Herren/Besitzer von Sichem«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und möge Gott auf euch hören«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: Als man Jotam davon berichtete
  rationale: Das unbestimmte pluralische Subjekt wird im Deutschen natürlich mit »man« wiedergegeben. »Davon« macht den im Kontext vorausgesetzten Inhalt des Berichtens kenntlich, ohne ihn näher auszudeuten.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: ging er hin, stellte sich
  rationale: Die Folge der hebräischen Erzählformen bleibt gewahrt; »stellte sich« gibt das Einnehmen eines Standorts natürlicher wieder als bloßes »stand«.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: auf den Gipfel des Berges Garizim
  rationale: רֹאשׁ bezeichnet hier die Spitze beziehungsweise den Gipfel; »Berg Garizim« ist die geläufige deutsche Namensform.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא
  choice: erhob seine Stimme und rief ihnen zu
  rationale: Die hebräische Wendung bezeichnet lautes Sprechen. Die bildhafte Formulierung bleibt erhalten, während »rief ihnen zu« die öffentliche Anrede natürlich ausdrückt.
- source_word: שִׁמְעוּ אֵלַי
  choice: Hört auf mich
  rationale: שמע mit אֶל bezeichnet aufmerksames Hören auf eine Person; die Wiederholung des Verbs »hören« im Folgesatz spiegelt das hebräische Wortspiel.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: Herren von Sichem
  rationale: בַּעֲלִים bedeutet wörtlich »Herren/Besitzer« und bezeichnet hier die maßgeblichen Männer beziehungsweise Machthaber der Stadt. Die formale Wiedergabe bewahrt die lexikalische Schärfe; die verständlichere Funktionsangabe steht in der Fußnote.
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: damit Gott auf euch hört
  rationale: Der mit וְ angeschlossene Imperfekt kann nach dem Imperativ Zweck oder Folge ausdrücken. »Damit« bildet diese rhetorische Beziehung ab; »hört« bewahrt die Wiederholung von שמע.
theological_decisions:
- issue: Sinn der Schlussklausel
  choice: »damit Gott auf euch hört« als Zweck- beziehungsweise Folgesatz
  alternative: »und möge Gott auf euch hören« als Wunsch
  rationale: 'Die hebräische Verknüpfung ist mehrdeutig. Im Haupttext wird die rhetorische Entsprechung gewählt: Die Sichemiten sollen Jotam anhören, damit Gott sie anhört. Die mögliche Wunschlesart wird in einer Fußnote offengehalten.'
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer öffentlicher Rede. Die polysyndetische hebräische Erzählfolge wird im Deutschen leicht geglättet, ohne Handlungsschritte auszulassen. Die Namen folgen den geläufigen deutschen Formen »Jotam«, »Garizim« und »Sichem«.
