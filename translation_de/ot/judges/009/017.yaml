  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als begründender Nebensatz an den vorhergehenden Vers gebunden. Die hebräische Bildsprache „aus der Hand“ wird bewahrt; die schwer verständliche Wendung zum Lebenseinsatz wird idiomatisch wiedergegeben und in der Fußnote erläutert.
