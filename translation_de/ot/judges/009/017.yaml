source:
  edition: WLC
  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: de
  text: weil mein Vater für euch kämpfte, sein Leben aufs Spiel setzte[a] und euch aus der Hand Midians befreite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sein Leben von sich warf“; gemeint ist, dass er sich tödlicher Gefahr aussetzte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „euch aus der Gewalt Midians rettete“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: weil
  rationale: Das Relativwort nimmt hier im Zusammenhang begründende Funktion an und führt den Grund für Jotams Vorwurf aus dem vorhergehenden Vers an.
- source_word: נִלְחַם אָבִי עֲלֵיכֶם
  choice: mein Vater für euch kämpfte
  rationale: Das Niphal von לחם bezeichnet das Kämpfen; עַל bezeichnet hier angesichts der anschließenden Rettung den Einsatz zugunsten der Angesprochenen.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: sein Leben aufs Spiel setzte
  rationale: Die wörtliche Wendung vom Wegwerfen bzw. Aussetzen des eigenen Lebens bezeichnet die bewusste Hingabe in tödliche Gefahr. Die deutsche Redewendung gibt diesen Sinn natürlich und prägnant wieder.
- source_word: וַיַּצֵּל
  choice: befreite
  rationale: Das Hiphil von נצל bedeutet entreißen, retten oder befreien; im militärisch-politischen Zusammenhang ist „befreite“ idiomatisch.
- source_word: מִיַּד מִדְיָן
  choice: aus der Hand Midians
  rationale: Die Hand steht bildlich für Macht oder Gewalt. Die verständliche biblische Bildsprache bleibt im Haupttext erhalten.
