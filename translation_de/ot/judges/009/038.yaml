translation_notes:
  register: Modernes, würdevolles Erzählungsdeutsch mit bewusst scharfem Spott in der direkten Rede. »Großes Maul« ist markiert umgangssprachlich, entspricht hier aber der beleidigenden Bildhaftigkeit und dem höhnischen Ton des Hebräischen; die Fußnote dokumentiert die formale Lesart.
