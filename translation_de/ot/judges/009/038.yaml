base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: de
  text: 'Da sagte Sebul zu ihm: »Wo ist nun dein Maul[a], mit dem du gesagt hast: ›Wer ist Abimelech, dass wir ihm dienen sollten?‹ Ist das nicht das Volk, das du verachtet hast? Zieh jetzt hinaus und kämpfe gegen dieses Volk!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wo ist nun dein Mund?« – eine spöttische Anspielung auf seine früheren großsprecherischen Worte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: Wo ist nun dein großes Maul
  rationale: Die wörtliche Wendung lautet »Wo ist nun dein Mund?« und verspottet Gaals frühere großsprecherische Worte. »Großes Maul« bewahrt das Körperbild und gibt den scharfen, höhnischen Ton im heutigen Deutsch natürlich wieder; die Fußnote weist auf den genauen Wortlaut hin.
- source_word: אֲשֶׁר תֹּאמַר
  choice: mit dem du gesagt hast
  rationale: Der Relativsatz bezieht sich auf den »Mund« und damit auf Gaals frühere Äußerung. Diese Formulierung erhält den Zusammenhang des hebräischen Bildes.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: Wer ist Abimelech, dass wir ihm dienen sollten?
  rationale: Die rhetorisch-geringschätzige Frage wird eng am Hebräischen wiedergegeben; »dienen sollten« vermittelt die Zurückweisung seiner Herrschaft.
- source_word: הֲלֹא זֶה הָעָם
  choice: Ist das nicht das Volk
  rationale: Die rhetorische Frage und das kollektive Substantiv עָם bleiben erhalten. Im Kontext bezeichnet »Volk« Abimelechs heranrückende Streitmacht.
- source_word: אֲשֶׁר מָאַסְתָּה בּוֹ
  choice: das du verachtet hast
  rationale: מָאַס bezeichnet Ablehnung beziehungsweise Verachtung; hier passt »verachtet« zum spöttischen Ton Sebuls.
- source_word: צֵא נָא עַתָּה
  choice: Zieh jetzt hinaus
  rationale: Der Imperativ fordert Gaal auf, die Stadt zum Kampf zu verlassen. נָא wirkt hier dringlich oder herausfordernd und wird nicht als höfliches »bitte« missverstanden.
- source_word: וְהִלָּחֶם בּוֹ
  choice: und kämpfe gegen sie
  rationale: Das Suffix ist grammatisch singular und nimmt das kollektive הָעָם (»Volk«) auf. Im natürlichen Deutschen wird die gemeinte Gruppe mit dem Pluralpronomen »sie« bezeichnet, ohne den Bezug auf die Streitmacht zu verlieren.
