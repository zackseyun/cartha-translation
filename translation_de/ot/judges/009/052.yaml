base_translation:
  language: en
  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: de
  text: Abimelech rückte bis an den Turm heran und griff ihn an. Dann trat er bis an den Eingang des Turms heran, um ihn mit Feuer in Brand zu setzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד
  choice: rückte bis an ... heran
  rationale: Gibt die zielgerichtete Annäherung an den Turm im Kampfzusammenhang natürlich wieder; die hebräische Form bezeichnet nicht ausdrücklich eine Aufwärtsbewegung.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: griff ihn an
  rationale: Das Verb mit ב bezeichnet hier den Kampf gegen den Turm beziehungsweise seine Verteidiger; „griff ihn an“ ist im Deutschen idiomatisch und bewahrt den Turm als grammatischen Bezug.
- source_word: וַיִּגַּשׁ עַד פֶּתַח הַמִּגְדָּל
  choice: trat ... bis an den Eingang des Turms heran
  rationale: Bewahrt sowohl die Annäherung als auch das durch עַד markierte Erreichen des Eingangsbereichs.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: um ihn in Brand zu setzen
  rationale: Idiomatiches modernes Deutsch für das Verbrennen mittels Feuer; das pronominale Objekt bleibt auf den Turm bezogen.
