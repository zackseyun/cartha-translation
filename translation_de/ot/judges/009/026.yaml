translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgliederung macht den Wechsel vom Singular („Gaal kam“) zum Plural („sie zogen“) sichtbar. Sachliche Mehrdeutigkeiten bei der Bewegung nach beziehungsweise durch Sichem und bei der gesellschaftlichen Stellung der בעלי שכם werden in Fußnoten bewahrt.
