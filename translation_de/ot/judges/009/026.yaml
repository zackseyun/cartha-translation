base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: de
  text: Dann kam Gaal, der Sohn Ebeds, mit seinen Brüdern; sie zogen nach Sichem hinein.[a] Die führenden Männer von Sichem[b] setzten ihr Vertrauen in ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „sie zogen durch Sichem“ oder „sie gingen nach Sichem hinüber“. Das hebräische Verb kann ein Hinübergehen oder Durchziehen bezeichnen; die genaue Bewegungsrichtung ist hier nicht eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die Herren von Sichem“; gemeint sind wohl die maßgeblichen Männer der Stadt, möglicherweise deren Bürger oder Machthaber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dann kam
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal, der Sohn Ebeds
  rationale: Der Personenname wird transliteriert, die hebräische Patronymform idiomatisch und zugleich eng am Ausgangstext wiedergegeben.
- source_word: וְאֶחָיו
  choice: mit seinen Brüdern
  rationale: Das hebräische וְ bedeutet formal „und“, bezeichnet hier nach dem Verb des Kommens aber natürlich die Begleitung. „Mit seinen Brüdern“ ist im Deutschen klar und idiomatisch.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: sie zogen nach Sichem hinein
  rationale: Die neue Pluralform wird mit „sie“ ausdrücklich aufgenommen. עבר bezeichnet ein Hinübergehen oder Durchziehen; zusammen mit בְּ und dem Ortsnamen bleibt die genaue Bewegungsrichtung kontextuell offen, weshalb eine Fußnote Alternativen nennt.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: setzten ihr Vertrauen auf ihn
  rationale: בטח mit בְּ drückt Vertrauen oder Zuversicht aus, die auf eine Person gerichtet ist. Die Formulierung bewahrt diese relationale Ausrichtung.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: die führenden Männer von Sichem
  rationale: בעלי einer Stadt bezeichnet hier deren maßgebliche, vollberechtigte beziehungsweise einflussreiche Männer, nicht unterschiedslos alle Einwohner. Die Wiedergabe ist verständlich, ohne den Ausdruck vorschnell auf ein bestimmtes politisches Amt festzulegen.
