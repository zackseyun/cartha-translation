  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: de
  text: 'Da stieg Abimelech auf den Berg Zalmon, er und das ganze Volk, das bei ihm war. Abimelech nahm die Äxte zur Hand, hieb ein Bündel Zweige[a] ab, hob es auf und legte es auf seine Schulter. Dann sagte er zu dem Volk, das bei ihm war: »Was ihr mich habt tun sehen, das macht schnell genauso!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen großen Ast«, »eine Ladung Reisig« oder »ein Bündel Gestrüpp«. Das seltene hebräische Wort bezeichnet eine Masse von Ästen, Zweigen oder Reisig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: stieg … hinauf
  rationale: עלה bezeichnet hier die Aufwärtsbewegung auf einen Berg; die deutsche Verbklammer mit »auf den Berg … steigen« gibt dies natürlich wieder.
- source_word: הַר צַלְמוֹן
  choice: den Berg Zalmon
  rationale: הר mit einem Eigennamen wird im Deutschen idiomatisch als »der Berg Zalmon« wiedergegeben; der Ortsname wird transliteriert.
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: er und das ganze Volk, das bei ihm war
  rationale: Die ausdrückliche Wiederaufnahme des Subjekts und das umfassende כל bleiben erhalten. Obwohl wohl seine Truppe gemeint ist, bezeichnet עָם allgemein das Volk beziehungsweise die Leute und wird nicht zu »Kriegern« verengt.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: nahm die Äxte zur Hand
  rationale: Der morphologische Plural »Äxte« bleibt gewahrt; »zur Hand nehmen« ist eine natürliche deutsche Wendung für das Ergreifen der Werkzeuge.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: hieb ein Bündel Zweige ab
  rationale: Das seltene שׂוֹכַת bezeichnet offenbar eine tragbare Masse aus Ästen, Zweigen oder Gestrüpp. »Bündel Zweige« passt zum anschließenden Tragen, ohne die genaue Gestalt übermäßig festzulegen; die Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: hob es auf und legte es auf seine Schulter
  rationale: Die Abfolge von נשא, dem Aufheben beziehungsweise Hochheben, und שׂים, dem Auflegen, wird in zwei aufeinanderfolgenden Handlungen wiedergegeben.
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: Was ihr mich habt tun sehen
  rationale: 'Die knappe hebräische Konstruktion wird idiomatisch geglättet, ohne ihren Sinn zu verändern: Die Leute sollen die beobachtete Handlung nachahmen.'
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: das tut schnell ebenso wie ich
  rationale: Beide pluralischen Imperative und die Dringlichkeit von מהר bleiben erhalten; »ebenso wie ich« gibt das wörtliche »wie ich« wieder und bezieht es natürlich auf die vorgeführte Handlung.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil mit klarer Handlungskette. Die Wiederholung »das bei ihm war« bildet die Wiederholung des Hebräischen ab. Der seltene Sachbegriff wird lesbar übersetzt und zugleich durch eine Fußnote als lexikalisch unsicher ausgewiesen.
