  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אֲבִימֶ֖לֶךְ בְּ/תָרְמָ֣ה לֵ/אמֹ֑ר הִנֵּה֩ גַ֨עַל בֶּן עֶ֤בֶד וְ/אֶחָי/ו֙ בָּאִ֣ים שְׁכֶ֔מָ/ה וְ/הִנָּ֛/ם צָרִ֥ים אֶת הָ/עִ֖יר עָלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: de
  text: 'Da sandte er heimlich[a] Boten zu Abimelech und ließ ihm sagen: »Sieh, Gaal, der Sohn Ebeds, und seine Brüder sind nach Sichem gekommen; und nun wiegeln sie die Stadt gegen dich auf.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hinterlistig. Das seltene hebräische Wort bezeichnet eine verdeckte oder arglistige Vorgehensweise.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist schwierig. Wörtlicher lässt sie sich auch verstehen als: »sie bedrängen (oder: belagern) die Stadt gegen dich«; im Zusammenhang ist wahrscheinlich gemeint, dass sie die Stadtbevölkerung gegen Abimelech aufbringen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: Da sandte er … Boten
  rationale: Die narrative Wayyiqtol-Form wird im Deutschen natürlich mit dem Präteritum wiedergegeben. מַלְאָכִים bezeichnet hier menschliche Boten.
- source_word: אֶל אֲבִימֶלֶךְ
  choice: zu Abimelech
  rationale: Die Zielangabe wird direkt wiedergegeben; der Name folgt der im Deutschen geläufigen biblischen Form.
- source_word: בְּתָרְמָה
  choice: heimlich
  rationale: Das seltene Wort bezeichnet hier am ehesten eine verdeckte beziehungsweise hinterlistige Art der Übermittlung. „Heimlich“ gibt den kontextuellen Sinn wieder, ohne die moralische Wertung unnötig zu verstärken.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Die deutsche Botenformel gibt die Funktion des hebräischen Infinitivs natürlich wieder und macht deutlich, dass die folgende Rede als Nachricht übermittelt wird.
- source_word: הִנֵּה … וְהִנָּם
  choice: Sieh … und nun
  rationale: Das erste Aufmerksamkeitssignal bleibt ausdrücklich erhalten; beim zweiten gibt „und nun“ den hinweisenden, aktualisierenden Nachdruck idiomatisch wieder, ohne ein schwerfälliges doppeltes „Sieh“ zu erzeugen.
- source_word: גַעַל בֶּן עֶבֶד וְאֶחָיו
  choice: Gaal, der Sohn Ebeds, und seine Brüder
  rationale: Die Verwandtschaftsbezeichnungen werden formal bewahrt; „Brüder“ kann im Kontext auch engere männliche Verwandte oder Gefolgsleute einschließen, sollte aber nicht vorschnell verallgemeinert werden.
- source_word: בָּאִים שְׁכֶמָה
  choice: sind nach Sichem gekommen
  rationale: Das Partizip bezeichnet hier eine bereits erfolgte Ankunft mit gegenwärtiger Relevanz; die Richtungsendung wird mit „nach Sichem“ wiedergegeben.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: wiegeln sie die Stadt gegen dich auf
  rationale: Die Wendung ist lexikalisch schwierig. Im Erzählzusammenhang bezeichnet sie wahrscheinlich das Aufbringen der Stadtbevölkerung gegen Abimelech. „Die Stadt“ bleibt als kollektive Bezeichnung erhalten; die mögliche konkretere Bedeutung „bedrängen/belagern“ wird in einer Fußnote dokumentiert.
