  terminology: Die Namen „Abimelech“, „Gaal“, „Ebed“ und „Sichem“ sind konsistent und im deutschen Bibelgebrauch verständlich. „Brüder“ bewahrt den Wortlaut, ohne die mögliche weitere soziale Bedeutung interpretierend in den Haupttext zu verlagern.
