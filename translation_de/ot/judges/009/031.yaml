  source_fidelity: 'Der Text gibt den hebräischen Bericht zuverlässig wieder: menschliche „Boten“, die verdeckte Übermittlung, Gaal als Sohn Ebeds samt seinen Brüdern, die Ankunft in Sichem und die gegen Abimelech gerichtete Aktivität. Die schwierige Wendung צָרִים אֶת־הָעִיר עָלֶיךָ wird mit „wiegeln sie die Stadt gegen dich auf“ kontextgerecht wiedergegeben, ohne die im hebräischen Verb liegende Unsicherheit zu verschweigen.'
