base_translation:
  language: en
  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: de
  text: Da floh Jotam, entkam und ging nach Beer[a]. Dort lebte er, fern von seinem Bruder Abimelech.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beera“. Das Hebräische בְּאֵרָה kann „Beer“ mit direktionalem -ah („nach Beer“) oder die Ortsnamensform „Beera“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: floh
  rationale: Das Verb נוס bezeichnet die Flucht vor einer Gefahr; „floh“ ist im deutschen Erzählstil knapp und natürlich.
- source_word: וַיִּבְרַח
  choice: entkam
  rationale: ברח bezeichnet ebenfalls Flucht. „entkam“ bewahrt neben „floh“ die auffällige Folge zweier bedeutungsnaher Verben, ohne im Deutschen schwerfällig zu wirken.
- source_word: בְּאֵרָה
  choice: nach Beer
  rationale: Die Form wird als Ortsname בְּאֵר mit direktionalem ה verstanden und bezeichnet daher die Bewegung „nach Beer“, nicht einen eigenständigen Ortsnamen „Beera“.
- source_word: וַיֵּשֶׁב שָׁם
  choice: Dort lebte er
  rationale: ישׁב kann sitzen, bleiben, wohnen oder leben bedeuten. Im Zusammenhang bezeichnet es Jotams Aufenthalt beziehungsweise Wohnsitz an diesem Ort.
- source_word: מִפְּנֵי
  choice: fern von
  rationale: Die Wendung bedeutet wörtlich „vom Angesicht/von der Gegenwart weg“ und drückt hier aus, dass Jotam sich dem Zugriff Abimelechs entzog. „fern von“ gibt diese räumlich bedingte Distanz natürlich wieder.
- source_word: אָחִיו
  choice: seinem Bruder
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung bleibt erhalten und unterstreicht die familiäre Spannung der Erzählung.
theological_decisions: []
