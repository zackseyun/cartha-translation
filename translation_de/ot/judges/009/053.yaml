  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: de
  text: Doch eine Frau warf einen oberen Mühlstein[a] auf Abimelechs Kopf und zerschmetterte ihm den Schädel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Stück des oberen Mühlsteins“; die hebräische Wendung kann ein Teilstück oder Bruchstück des oberen Mühlsteins bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: warf
  rationale: Das Verb שׁלך bezeichnet hier im fortlaufenden Erzählzusammenhang ein gezieltes Werfen; „warf“ ist natürlich und bewahrt die aktive Handlung.
- source_word: אִשָּׁה אַחַת
  choice: eine Frau
  rationale: Wörtlich „eine Frau“ bzw. „eine einzige Frau“. Im Deutschen gibt „eine Frau“ die idiomatische unbestimmte Einführung der sonst ungenannten Person wieder.
- source_word: פֶּלַח רֶכֶב
  choice: den oberen Mühlstein
  rationale: רֶכֶב bezeichnet den oberen, beweglichen Mühlstein. פֶּלַח kann das Stück bzw. Segment bezeichnen; diese lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: עַל רֹאשׁ אֲבִימֶלֶךְ
  choice: auf Abimelechs Kopf
  rationale: Die räumliche Wendung wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: וַתָּרִץ
  choice: zerschmetterte
  rationale: רצץ bezeichnet ein Zerschlagen oder Zertrümmern. „Zerschmetterte“ gibt die Gewalt und das Ergebnis des Schlages präzise wieder.
- source_word: גֻּלְגָּלְתּוֹ
  choice: ihm den Schädel
  rationale: גֻּלְגֹּלֶת bezeichnet spezifisch den Schädel. Die deutsche Dativkonstruktion ist idiomatisch und bewahrt den possessiven Sinn des hebräischen Suffixes.
