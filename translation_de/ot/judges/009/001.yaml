source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: de
  text: 'Abimelech, der Sohn Jerubbaals, ging nach Sichem zu den Brüdern seiner Mutter und sprach zu ihnen und zu der ganzen Sippe des Hauses des Vaters seiner Mutter[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus des Vaters seiner Mutter« ist die Großfamilie beziehungsweise die Abstammungslinie seines mütterlichen Großvaters gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das narrative Waw führt die Handlung weiter; im Deutschen genügt das Präteritum ohne einen nicht ausdrücklich vorhandenen Zeitmarker wie »nun« oder »dann«.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבַּעַל
  choice: Abimelech, der Sohn Jerubbaals
  rationale: Die Eigennamen werden transliteriert; die Apposition gibt die Abstammungsangabe natürlich und eindeutig wieder.
- source_word: שְׁכֶמָה
  choice: nach Sichem
  rationale: Das Direktivsuffix bezeichnet die Bewegung auf den Ort zu; bei Städtenamen ist »nach« die idiomatische deutsche Entsprechung.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: zu den Brüdern seiner Mutter
  rationale: Die Wiedergabe bewahrt die wörtliche Verwandtschaftsbezeichnung; gemeint sind Abimelechs Onkel mütterlicherseits.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: Er sprach mit ihnen
  rationale: דבר bedeutet hier »sprechen«. Ein neuer deutscher Satz vermeidet eine schwerfällige Reihung, ohne den Handlungsablauf zu verändern.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: und mit der ganzen Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier einen größeren Verwandtschaftsverband; »Sippe« ist präziser als die im heutigen Deutsch meist engere »Familie«.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: aus dem Haus des Vaters seiner Mutter
  rationale: Die Formulierung hält die hebräische Verwandtschaftsstruktur sichtbar. »Haus« bezeichnet in diesem Zusammenhang Haushalt und Abstammungslinie, nicht bloß ein Gebäude.
- source_word: לֵאמֹר
  choice: 'und sagte:'
  rationale: Der Infinitiv leitet die in Vers 2 folgende direkte Rede ein; im Deutschen ist die finite Fortsetzung mit Doppelpunkt natürlich.
