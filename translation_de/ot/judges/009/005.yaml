source:
  edition: WLC
  text: וַ/יָּבֹ֤א בֵית אָבִי/ו֙ עָפְרָ֔תָ/ה וַֽ/יַּהֲרֹ֞ג אֶת אֶחָ֧י/ו בְּנֵֽי יְרֻבַּ֛עַל שִׁבְּעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/יִּוָּתֵ֞ר יוֹתָ֧ם בֶּן יְרֻבַּ֛עַל הַ/קָּטֹ֖ן כִּ֥י נֶחְבָּֽא־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: de
  text: Dann ging er zum Haus seines Vaters nach Ofra und tötete dort seine Brüder, die Söhne Jerubbaals — siebzig Männer — auf einem einzigen Stein.[a] Doch Jotam, der jüngste Sohn Jerubbaals, blieb übrig,[b] weil er sich versteckt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Auf einem einzigen Stein“ bezeichnet möglicherweise einen gemeinsamen Hinrichtungsort oder einen Stein, auf dem die Tötungen vollzogen wurden.
    reason: cultural_note
  - marker: b
    text: 'Oder: „blieb am Leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: Dann ging er zum Haus seines Vaters nach Ofra
  rationale: Die Erzählform führt die Handlung fort. Die Richtungsendung bei עָפְרָתָה bezeichnet das Ziel; die konkrete Ortsangabe legt bei בֵית אָבִיו eher das Haus als den weiteren Haushalt nahe.
- source_word: וַיַּהֲרֹג
  choice: tötete
  rationale: Dies gibt den Grundsinn wieder, ohne eine zusätzliche rechtliche Wertung in das Verb einzutragen.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: seine Brüder, die Söhne Jerubbaals
  rationale: Die Apposition bleibt erhalten und identifiziert die Brüder ausdrücklich als Jerubbaals Söhne.
- source_word: שִׁבְעִים אִישׁ
  choice: siebzig Männer
  rationale: אִישׁ bezeichnet nach der Zahl hier die männlichen Angehörigen, nämlich Jerubbaals Söhne.
- source_word: עַל אֶבֶן אֶחָת
  choice: auf einem einzigen Stein
  rationale: Die konkrete und eindringliche Bildsprache des Hebräischen wird bewahrt; „einzigen“ hebt wie אֶחָת hervor, dass derselbe Stein gemeint ist, ohne die Art der Hinrichtung näher festzulegen.
- source_word: וַיִּוָּתֵר
  choice: blieb übrig
  rationale: Die Form kann „übrig bleiben“ beziehungsweise „zurückgelassen werden“ bedeuten. „Blieb übrig“ ist im Deutschen natürlich und lässt den Kontext sein Überleben anzeigen.
- source_word: הַקָּטֹן
  choice: der jüngste
  rationale: Im Zusammenhang mit Geschwistern ist dies die natürliche Wiedergabe von „der Kleine/Junge“.
- source_word: כִּי נֶחְבָּא
  choice: weil er sich versteckt hatte
  rationale: Der Satz nennt den Grund seines Überlebens; das Plusquamperfekt verdeutlicht, dass das Verstecken der Verschonung vorausging.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die harte Bildsprache des Ausgangstextes bleibt erhalten; „dort“ macht idiomatisch deutlich, dass die Tötung am genannten Ziel geschah, ohne zusätzliche Sachinformation einzuführen.
