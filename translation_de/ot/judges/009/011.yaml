source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/תְּאֵנָ֔ה הֶ/חֳדַ֨לְתִּי֙ אֶת מָתְקִ֔/י וְ/אֶת תְּנוּבָתִ֖/י הַ/טּוֹבָ֑ה וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: de
  text: 'Doch der Feigenbaum sagte zu ihnen: »Soll ich meine Süße und meine gute Frucht aufgeben und hingehen, um über den Bäumen zu schwanken[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über die Bäume zu herrschen«. Das hebräische Verb bedeutet wörtlich »schwanken« oder »sich hin und her bewegen«; in der Fabel klingt zugleich das Herrschen über die Bäume an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Doch ... sagte
  rationale: Das Waw führt die Erzählung fort; »Doch« gibt zugleich den Kontrast der erneuten Ablehnung in Jotams Fabel natürlich wieder.
- source_word: הַתְּאֵנָה
  choice: der Feigenbaum
  rationale: Das Substantiv bezeichnet hier den Feigenbaum als sprechende Gestalt der Fabel.
- source_word: הֶחֳדַלְתִּי
  choice: Soll ich ... aufgeben
  rationale: Die Perfektform hat in der rhetorischen Frage deliberative Bedeutung. »Aufgeben« erfasst hier das Einstellen dessen, was den Feigenbaum auszeichnet.
- source_word: מָתְקִי
  choice: meine Süße
  rationale: Die wörtliche Bezeichnung der Süße bewahrt die personifizierende und bildhafte Ausdrucksweise.
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: meine gute Frucht
  rationale: תְּנוּבָה bezeichnet Ertrag oder Frucht; beim Feigenbaum ist »Frucht« die natürliche kontextuelle Entsprechung.
- source_word: וְהָלַכְתִּי
  choice: und hingehen
  rationale: Der Ausdruck setzt die deliberative Frage fort und wahrt zugleich die Bewegungsbedeutung von הלך.
- source_word: לָנוּעַ
  choice: um über ... zu schwanken
  rationale: נוע bedeutet sich bewegen, schwanken oder hin und her schwingen. »Schwanken« bewahrt das Baumbild, während der Zusammenhang zugleich Herrschaft andeutet.
- source_word: עַל הָעֵצִים
  choice: über den Bäumen
  rationale: עַל kann hier räumliches Darübersein und im Fabelkontext zugleich eine übergeordnete Herrschaftsstellung ausdrücken.
theological_decisions:
- issue: Bildhafte Bewegung oder ausdrückliche Herrschaft
  choice: über den Bäumen zu schwanken
  alternative: über die Bäume zu herrschen
  rationale: Der hebräische Wortlaut verwendet das Bewegungsverb נוע und lässt die Herrschaftsbedeutung durch den Fabelkontext entstehen. Die Übersetzung bewahrt diese Spannung, statt sie im Haupttext aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Baum-Metaphorik und die Mehrdeutigkeit des Herrschaftsbildes bleiben erhalten.
