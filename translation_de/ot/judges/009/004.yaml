base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: de
  text: Und sie gaben ihm siebzig Silberstücke[b] aus dem Haus des Baal-Berit[a]. Mit diesem Geld warb Abimelech nichtsnutzige und leichtfertige Männer[c] an, und sie schlossen sich ihm an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Tempel des Baal-Berit«. Das hebräische Wort bedeutet »Haus«, kann aber in einem kultischen Zusammenhang einen Tempel oder ein Heiligtum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »siebzig Silberschekel«. Wörtlich: »siebzig Silber«; gemeint ist ein nach Gewicht bestimmter Geldbetrag.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »leere und leichtfertige Männer«; auch möglich: »nichtsnutzige und rücksichtslose Männer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: siebzig Silberstücke
  rationale: Das Hebräische sagt wörtlich »siebzig Silber« und bezeichnet damit einen nach Gewicht bestimmten Geldbetrag. »Silberstücke« ist im Deutschen natürlich, ohne die nicht ausdrücklich genannte Einheit Schekel in den Haupttext einzutragen.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: aus dem Haus des Baal-Berit
  rationale: בַּיִת bedeutet »Haus«, kann im kultischen Zusammenhang jedoch einen Tempel oder ein Heiligtum bezeichnen. Die Wiedergabe bewahrt das hebräische Bild; Baal-Berit wird als Name bzw. Titel transkribiert.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: Mit diesem Geld warb ... an
  rationale: Die Präposition mit dem Pronomen verweist auf das Silber als Mittel der Anwerbung. »Mit diesem Geld« stellt den Bezug im Deutschen eindeutig und idiomatisch her.
- source_word: אֲנָשִׁים רֵיקִים
  choice: nichtsnutzige Männer
  rationale: רֵיקִים heißt wörtlich »leere«, charakterisiert hier aber Männer ohne Wert, Substanz oder verlässliche Stellung. »Nichtsnutzige« gibt die abwertende soziale und moralische Aussage natürlich wieder.
- source_word: וּפֹחֲזִים
  choice: verwegene
  rationale: Das Wort bezeichnet unbeherrschte, leichtfertige oder rücksichtslose Menschen. »Verwegen« bewahrt die Vorstellung von gefährlicher Unbedachtheit, ohne die stärkere Deutung »gesetzlos« festzulegen.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: sie schlossen sich ihm an
  rationale: Wörtlich heißt die Wendung »sie gingen hinter ihm her«. Im Zusammenhang bezeichnet sie, dass die angeworbenen Männer Abimelech als Gefolgsleute folgten.
