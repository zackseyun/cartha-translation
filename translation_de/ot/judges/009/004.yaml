revisions:
- from: Und sie gaben ihm siebzig Silberstücke[b] aus dem Haus des Baal-Berit[a]. Mit diesem Geld warb Abimelech nichtsnutzige und verwegene Männer[c] an, und sie schlossen sich ihm an.
  to: Und sie gaben ihm siebzig Silberstücke[b] aus dem Haus des Baal-Berit[a]. Mit diesem Geld warb Abimelech nichtsnutzige und leichtfertige Männer[c] an, und sie schlossen sich ihm an.
