base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: de
  text: 'Da rief er schnell den jungen Mann, der seine Waffen trug, und sagte zu ihm: »Zieh dein Schwert und töte mich, damit man nicht von mir sagt: ›Eine Frau hat mich getötet.‹« Da durchbohrte ihn sein Waffenträger, und er starb.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: Da rief er schnell
  rationale: Das Wayyiqtol führt die Erzählung fort; »da« bildet die Abfolge im Deutschen natürlich ab. מְהֵרָה bezeichnet die Eile und wird klar mit »schnell« wiedergegeben.
- source_word: הַנַּעַר
  choice: den jungen Mann
  rationale: נַעַר bezeichnet gewöhnlich einen jungen Mann oder Diener. Die Übersetzung bewahrt hier zunächst den unmittelbaren lexikalischen Sinn, statt die Funktion vorwegzunehmen.
- source_word: נֹשֵׂא כֵלָיו
  choice: der seine Waffen trug
  rationale: Die Wendung bedeutet wörtlich den Träger seiner Geräte beziehungsweise Waffen. Im militärischen Zusammenhang ist »Waffenträger« möglich, doch die ausformulierte Wiedergabe bleibt transparent und quellennah.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Zieh dein Schwert
  rationale: שׁלף bezeichnet das Herausziehen einer Waffe, hier des Schwertes. »Das Schwert ziehen« ist die übliche prägnante deutsche Wendung.
- source_word: וּמוֹתְתֵנִי
  choice: und töte mich
  rationale: Die Form verlangt im Kontext, dass der Angesprochene Abimelechs Tod herbeiführt. »Töte mich« gibt dies direkt und natürlich wieder.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: damit man nicht von mir sagt
  rationale: פֶּן leitet die befürchtete Folge beziehungsweise den negativen Zweck ein. Das unbestimmte hebräische Subjekt wird im Deutschen idiomatisch mit »man« wiedergegeben; לִי ist kontextgemäß »von mir«.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: Eine Frau hat ihn getötet
  rationale: Die aktive Form und die Voranstellung von »eine Frau« bleiben erhalten und bewahren die im Erzählzusammenhang bedeutsame Beschämung.
- source_word: וַיִּדְקְרֵהוּ
  choice: Da durchbohrte ihn
  rationale: דקר bezeichnet das Durchbohren oder Durchstechen mit einer Waffe. »Durchbohrte« bewahrt die konkrete Gewalthandlung.
- source_word: נַעֲרוֹ
  choice: sein junger Mann
  rationale: Die Wiedergabe hält die lexikalische Verbindung zum früheren הַנַּעַר sichtbar. Die funktionale Alternative »sein Waffenträger« wird in der Fußnote genannt.
