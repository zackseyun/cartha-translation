  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: de
  text: damit die Gewalttat an den siebzig Söhnen Jerubbaals käme[a] und ihr Blut auf Abimelech, ihren Bruder, der sie getötet hatte, und auf die führenden Männer von Sichem[b] gelegt würde, die seine Hände gestärkt hatten[c], damit er seine Brüder tötete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung lässt offen, auf wen die Gewalttat „kommt“; im Zusammenhang steht sie für die Folgen beziehungsweise Vergeltung der an Jerubbaals Söhnen verübten Gewalttat.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Herren von Sichem“; gemeint sind die maßgeblichen Männer oder Machthaber der Stadt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die seine Hände gestärkt hatten“, das heißt, die ihn unterstützten oder ihm Rückhalt gaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: damit die Gewalttat … über die Schuldigen käme
  rationale: Der mit ל eingeleitete Infinitiv bezeichnet hier Zweck oder Folge. חמס meint die an den Söhnen begangene gewaltsame Untat. Die Ergänzung „über die Schuldigen“ macht das im Zusammenhang vorausgesetzte Ziel des „Kommens“ im Deutschen verständlich, ohne die Verantwortlichen vorzeitig auf nur eine Gruppe einzugrenzen.
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: die siebzig Söhne Jerubbaals
  rationale: Direkte Wiedergabe der hebräischen Genitivverbindung; der Personenname wird transliteriert.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: und ihr Blut … angelastet würde
  rationale: „Blut“ bewahrt die bildhafte Sprache für die Verantwortung an vergossenem Blut; „anlasten“ gibt die gerichtliche Bedeutung von שׂים על in natürlichem Deutsch wieder.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: Abimelech, ihrem Bruder
  rationale: Die Apposition kennzeichnet Abimelech ausdrücklich als Bruder der Getöteten und erhält so die rhetorische Schärfe.
- source_word: הָרַג
  choice: getötet hatte
  rationale: Das allgemeine Verb הרג bedeutet „töten“. Die Übersetzung vermeidet es, durch „ermorden“ eine im Lexem selbst nicht ausdrücklich markierte rechtliche Wertung einzutragen.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: die führenden Männer von Sichem
  rationale: בעלי bezeichnet hier die maßgeblichen Männer beziehungsweise Machthaber der Stadt, nicht notwendig sämtliche Einwohner.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: die ihn darin bestärkt hatten
  rationale: Die wörtliche Wendung „seine Hände stärken“ bedeutet, jemanden zu unterstützen oder ihm Rückhalt zu geben. Die idiomatische deutsche Formulierung ist klar und bewahrt den Gedanken aktiver Mitverantwortung.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: seine Brüder zu töten
  rationale: Direkte Wiedergabe der finalen Infinitivverbindung; „Brüder“ entspricht dem Kontext der männlichen Geschwister.
theological_decisions:
- issue: Bildsprache der Blutschuld
  choice: „ihr Blut … angelastet würde“
  alternative: „ihre Blutschuld … zugerechnet würde“ oder „die Rache für ihr Blut … käme“
  rationale: Die Übersetzung behält „Blut“ als Metonymie für die Verantwortung am Blutvergießen bei und löst die Aussage weder vollständig in den abstrakten Begriff „Blutschuld“ noch in eine ausdrückliche Vergeltungsaussage auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange Zweck- und Folgesatz des Hebräischen bleibt erkennbar, wird aber durch klare Bezüge lesbar gemacht. Die Blutmetaphorik bleibt erhalten; die schwer verständliche Hand-Metapher wird im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
