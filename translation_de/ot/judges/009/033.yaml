base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: de
  text: Am Morgen, sobald die Sonne aufgeht, brich früh auf und rücke gegen die Stadt vor. Siehe, er und die Leute, die bei ihm sind, werden zu dir herauskommen; dann tu ihm, was in deiner Macht steht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie deine Hand findet“; gemeint ist: wie es in deiner Macht steht oder wie sich die Gelegenheit bietet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: Am Morgen aber
  rationale: Die einleitende Wendung führt die zeitliche Abfolge der Anweisung weiter. „Am Morgen aber“ ist im Deutschen natürlich und gibt den Übergang wieder, ohne das hebräische Existenzverb mechanisch abzubilden.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: sobald die Sonne aufgeht
  rationale: כ mit dem Infinitiv bezeichnet den Zeitpunkt. „Sobald“ passt zur Dringlichkeit des militärischen Plans, ohne über den Kontext hinauszugehen.
- source_word: תַּשְׁכִּים
  choice: brich früh auf
  rationale: Die Hifil-Form von שׁכם bezeichnet frühes Aufstehen beziehungsweise frühes Beginnen. Im Zusammenhang einer militärischen Bewegung ist „brich früh auf“ natürlich und präzise.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: und rücke gegen die Stadt vor
  rationale: פשט kann im militärischen Gebrauch das Ausschwärmen, Vorrücken oder Angreifen bezeichnen. „Rücke gegen … vor“ erhält die militärische Stoßrichtung, ohne die genaue Angriffsweise zu stark festzulegen.
- source_word: וְהִנֵּה
  choice: 'Du wirst sehen:'
  rationale: הנה lenkt die Aufmerksamkeit auf die unmittelbar folgende Entwicklung. Diese Wendung gibt seine deiktische Funktion in modernem, würdigem Deutsch wieder.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: Er und die Leute, die bei ihm sind
  rationale: עָם bezeichnet hier die Gruppe bei dem genannten Mann. „Leute“ bleibt weiter und textnäher als die stärker deutende Wiedergabe „Truppen“.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: werden zu dir herauskommen
  rationale: אֶל bezeichnet zunächst die Richtung „zu dir“. Der feindliche Zusammenhang bleibt aus der Szene erkennbar, ohne dass „gegen dich“ in die Präposition hineingelesen wird.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: Dann tu ihm
  rationale: Das singularische Suffix wird als „ihm“ beibehalten. So bleibt offen, ob ausschließlich der Anführer oder dieser stellvertretend für seine Leute im Blick ist.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: was in deiner Macht steht
  rationale: Die wörtliche Wendung „wie deine Hand findet“ ist ein hebräisches Idiom für das, was jemand nach Vermögen und Gelegenheit tun kann. Die deutsche Wiedergabe vermittelt den Sinn verständlich; die Bildform wird in der Fußnote dokumentiert.
