base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: de
  text: 'Da redeten die Brüder seiner Mutter vor allen führenden Männern von Sichem[a] alle diese Worte über ihn. Und ihr Herz wandte sich Abimelech zu, denn sie sagten: „Er ist unser Bruder.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „allen Herren von Sichem“ beziehungsweise „allen maßgeblichen Männern von Sichem“. Der hebräische Ausdruck bezeichnet hier die einflussreichen Männer der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: redeten
  rationale: Das Piel von דבר bezeichnet hier das Vortragen der zuvor genannten Worte; „redeten“ ist natürlich und bewahrt den erzählerischen Vorgang.
- source_word: אֲחֵי אִמּוֹ
  choice: die Brüder seiner Mutter
  rationale: Die Wendung bezeichnet konkret die männlichen Geschwister seiner Mutter, nicht allgemein Verwandte.
- source_word: עָלָיו
  choice: seinetwegen
  rationale: Die Präposition kann „über ihn“ oder „für ihn“ bedeuten. Im Zusammenhang treten die Onkel für Abimelechs Anliegen ein; „seinetwegen“ wahrt den Bezug, ohne die Fürsprache zu stark auszudeuten.
- source_word: בְּאָזְנֵי
  choice: vor
  rationale: Wörtlich „in den Ohren von“; deutsch gibt „vor“ eine an eine versammelte Zuhörerschaft gerichtete Rede natürlich wieder.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: allen führenden Männern von Sichem
  rationale: בעלי bezeichnet hier wahrscheinlich die einflussreichen beziehungsweise politisch maßgeblichen Männer der Stadt; „führende Männer“ ist präziser als „Einwohner“ und weniger feudal gefärbt als „Herren“.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: genau diese Worte
  rationale: דברים kann „Worte“ oder „Dinge/Angelegenheiten“ bedeuten. Hier verweist es auf Abimelechs im vorigen Vers formulierten Auftrag; „Worte“ wahrt den sprachlichen Rückbezug, und „genau“ gibt die Gesamtheit idiomatisch wieder.
- source_word: וַיֵּט לִבָּם
  choice: ihr Herz neigte sich
  rationale: Der hebräische Text verwendet „Herz“ im Singular für die gemeinsame innere Haltung der Gruppe. Die deutsche Form bewahrt dieses kollektive Bild und den intransitiven Sinn.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: Abimelech zu
  rationale: Wörtlich steht „hinter Abimelech her“; gemeint ist die Hinwendung zu ihm als bevorzugtem Kandidaten. „sich ... zu neigen“ ist im Deutschen natürlich und bewahrt die Vorstellung einer inneren Ausrichtung.
- source_word: כִּי אָמְרוּ
  choice: denn sie sagten
  rationale: כִּי führt hier die Begründung für ihre Hinwendung ein; „denn“ gibt diese Funktion klar wieder.
- source_word: אָחִינוּ הוּא
  choice: Er ist unser Bruder
  rationale: Die direkte Wiedergabe bewahrt den rhetorischen Appell an die Verwandtschaft und lässt offen, wie weit „Bruder“ hier im Sippenverständnis gefasst ist.
