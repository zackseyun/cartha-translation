source:
  edition: WLC
  text: וּ/מִגְדַּל עֹז֮ הָיָ֣ה בְ/תוֹךְ הָ/עִיר֒ וַ/יָּנֻ֨סוּ שָׁ֜מָּ/ה כָּל הָ/אֲנָשִׁ֣ים וְ/הַ/נָּשִׁ֗ים וְ/כֹל֙ בַּעֲלֵ֣י הָ/עִ֔יר וַֽ/יִּסְגְּר֖וּ בַּעֲדָ֑/ם וַֽ/יַּעֲל֖וּ עַל גַּ֥ג הַ/מִּגְדָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: de
  text: Mitten in der Stadt stand jedoch ein starker Turm[a]. Dorthin flohen alle Männer und Frauen sowie alle führenden Männer der Stadt[b]. Sie schlossen sich darin ein und stiegen auf das Dach des Turms.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein befestigter Turm“. Die hebräische Wendung verbindet „Turm“ mit „Stärke“ und hebt seinen wehrhaften Charakter hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „alle Herren/Besitzer der Stadt“; gemeint sein können die maßgeblichen Männer der Stadt. Die genaue gesellschaftliche Bezeichnung bleibt mehrdeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: ein starker Turm
  rationale: Die Verbindung von מִגְדָּל („Turm“) und עֹז („Stärke“) bezeichnet einen wehrhaften, Schutz bietenden Turm. „Starker Turm“ bleibt nah am Hebräischen; die mögliche Deutung „befestigter Turm“ wird in der Fußnote genannt.
- source_word: בְּתוֹךְ הָעִיר
  choice: mitten in der Stadt
  rationale: בְּתוֹךְ bezeichnet das Innere beziehungsweise die Mitte. „Mitten in der Stadt“ gibt den räumlichen Ausdruck präzise und natürlich wieder.
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: dorthin flohen
  rationale: נוּס bedeutet „fliehen“. Die Formulierung bewahrt die ausdrücklich genannte Zielrichtung, ohne den Zweck als Zufluchtnahme zusätzlich auszudeuten.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: alle Männer und Frauen
  rationale: Der hebräische Text nennt Männer und Frauen ausdrücklich; diese Unterscheidung bleibt erhalten.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: sowie alle führenden Männer der Stadt
  rationale: בַּעֲלֵי הָעִיר bedeutet wörtlich etwa „Herren/Besitzer der Stadt“ und kann als Bezeichnung der maßgeblichen oder führenden Männer verstanden werden. Die Übersetzung vermeidet das zu breite „Einwohner“, markiert die lexikalische Spannung aber in einer Fußnote.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: Sie schlossen sich darin ein
  rationale: Die Wendung besagt, dass sie hinter beziehungsweise um sich schlossen. „Sich darin einschließen“ ist im Deutschen idiomatisch und ergänzt kein im Hebräischen ausdrücklich genanntes Objekt wie „Tür“ oder „Tor“.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: stiegen auf das Dach des Turms
  rationale: עָלָה bezeichnet das Hinaufgehen, גַּג ausdrücklich das Dach. Die Formulierung gibt Bewegung und Ziel knapp und genau wieder.
