source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: de
  text: 'Da sagte Gaal, der Sohn Ebeds: »Wer ist Abimelech, und wer ist Sichem[a], dass wir ihm dienen sollten? Ist er nicht der Sohn Jerubbaals, und ist Sebul nicht sein Beauftragter[b]? Dient den Männern Hamors, des Vaters von Sichem[c]! Warum sollten ausgerechnet wir ihm dienen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier: »wer ist Sichem?« Der Name bezeichnet wahrscheinlich stellvertretend die Stadt oder ihre führende Gemeinschaft. Möglich ist sinngemäß auch: »was ist Sichem?«'
    reason: lexical_alternative
  - marker: b
    text: »Beauftragter« kann auch mit »Stellvertreter« oder »eingesetzter Amtsträger« wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind die von Hamor abstammenden oder mit ihm verbundenen Menschen. Hamor galt als Vater beziehungsweise Ahnherr Sichems; siehe 1. Mose 34.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: Wer ist Abimelech, und wer ist Sichem
  rationale: Das zweimalige מִי wird formal als »wer« wiedergegeben. »Sichem« bleibt wie im Hebräischen ausdrücklich genannt; der Name kann metonymisch für die Stadt oder ihre maßgebliche Gemeinschaft stehen.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: dass wir ihm dienen sollten
  rationale: עבד bezeichnet hier politische Unterordnung beziehungsweise Loyalität, nicht gewöhnliche Arbeit. Die Formulierung bewahrt zugleich den rhetorischen Charakter der Frage.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: Ist er nicht der Sohn Jerubbaals
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet; die ausdrückliche Abstammungsbezeichnung trägt Gaals abwertende Argumentation.
- source_word: פְּקִידוֹ
  choice: sein Beauftragter
  rationale: פָּקִיד bezeichnet einen eingesetzten Amtsträger oder untergeordneten Verwalter. »Beauftragter« bleibt bewusst allgemein und legt Sebuls genaues Amt nicht näher fest.
- source_word: עִבְדוּ
  choice: Dient
  rationale: Der maskuline Pluralimperativ wird als knapper, direkter Befehl wiedergegeben.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: den Männern Hamors, des Vaters von Sichem
  rationale: »Männer Hamors« gibt אַנְשֵׁי חֲמוֹר eng wieder und lässt offen, ob Nachkommen oder eine mit Hamor verbundene Bevölkerungsgruppe gemeint sind.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: Warum sollten ausgerechnet wir ihm dienen?
  rationale: Das selbstständige Pronomen אֲנָחְנוּ ist emphatisch. »Ausgerechnet wir« bringt diese Hervorhebung im natürlichen Deutschen zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter rhetorischer Schärfe. Die Namensformen folgen dem im Deutschen üblichen biblischen Gebrauch. Die auffällige hebräische Formulierung »wer ist Sichem« wurde im Haupttext bewahrt und nicht stillschweigend zu »wer sind wir Sichemiten« umgedeutet.
