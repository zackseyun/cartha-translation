  terminology: Die Namensformen Abimelech, Sichem, Jerubbaal und Sebul sind im deutschen Bibelgebrauch möglich und konsistent. »Beauftragter« ist für פְּקִידוֹ ausreichend weit und vermeidet eine unzulässige Festlegung auf ein bestimmtes Amt. »dienen« trifft hier die politische Unterordnung beziehungsweise Loyalität. Die Fußnoten erläutern die lexikalische und historische Anspielung angemessen.
