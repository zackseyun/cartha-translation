  source_fidelity: 'Der deutsche Text gibt die rhetorische Struktur und die wesentlichen hebräischen Elemente zuverlässig wieder: die doppelte Frage mit מִי, die politische Bedeutung von עבד, die rhetorische Frage mit הֲלֹא, Sebul als untergeordneten Amtsträger, den Pluralimperativ sowie die emphatische Schlussfrage. Die auffällige Benennung »Sichem« bleibt erhalten, ohne die mögliche Metonymie im Haupttext aufzulösen.'
