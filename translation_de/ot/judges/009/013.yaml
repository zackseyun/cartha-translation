base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: de
  text: 'Aber der Weinstock erwiderte ihnen: »Soll ich aufhören, meinen jungen Wein hervorzubringen, der Götter und Menschen[a] erfreut, und hingehen, um über den Bäumen hin und her zu schwanken?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Gott und Menschen erfreut«.'
    reason: Alternative Deutung des mehrdeutigen hebräischen Wortes אֱלֹהִים.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: der Weinstock
  rationale: Bezeichnet in Jotams Fabel die sprechende Weinpflanze; »Weinstock« ist im Deutschen eindeutig und literarisch natürlich.
- source_word: הֶחֳדַלְתִּי אֶת תִּירוֹשִׁי
  choice: Soll ich meinen jungen Wein aufgeben
  rationale: Die Perfektform hat im Zusammenhang die Funktion einer rhetorisch-abwägenden Frage. »Aufgeben« gibt das Aufhören mit der Hervorbringung des Weins natürlich wieder, ohne im Haupttext ein zusätzliches »produzieren« einzufügen.
- source_word: תִּירוֹשִׁי
  choice: meinen jungen Wein
  rationale: תִּירוֹשׁ bezeichnet gewöhnlich jungen bzw. frischen Wein; »junger Wein« bewahrt diese Unterscheidung gegenüber dem allgemeinen Wort »Wein«.
- source_word: הַמְשַׂמֵּחַ
  choice: der … erfreut
  rationale: Das Partizip beschreibt die erfreuende Wirkung des jungen Weins und bewahrt den kausativen Sinn.
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: Götter und Menschen
  rationale: אֱלֹהִים ist der Form nach pluralisch und kann im Kontext der Fabel als »Götter« verstanden werden; »Menschen« ist im heutigen Deutsch natürlicher und inklusiver als »Männer«.
- source_word: וְהָלַכְתִּי לָנוּעַ עַל הָעֵצִים
  choice: und hingehen, um über den Bäumen zu schwanken
  rationale: Die Formulierung erhält das körperliche Bild des Hin-und-her-Schwankens und lässt zugleich den im Fabelkontext mitschwingenden Herrschaftsanspruch erkennen, ohne ihn durch »herrschen« festzulegen.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים in »der אֱלֹהִים und Menschen erfreut«
  choice: Götter
  alternative: Gott
  rationale: Die morphologisch pluralische Lesart passt zur bildhaften Sprache der Fabel und wird im Haupttext bewahrt. Da אֱלֹהִים auch den Gott Israels bezeichnen kann und »Gott und Menschen« eine alte Übersetzungstradition besitzt, wird diese echte Mehrdeutigkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und fabelhaft. »Schwanken« wahrt das konkrete Pflanzenbild; der Herrschaftssinn wird nicht durch eine eindeutige Paraphrase vorentschieden.
