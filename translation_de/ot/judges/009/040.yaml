- from: Abimelech verfolgte ihn, und er floh vor ihm. Dabei fielen viele Erschlagene bis zum Eingang des Stadttores.[a]
  to: Abimelech verfolgte ihn, und er floh vor ihm. Und viele fielen erschlagen bis zum Eingang des Tores.[a]
  rationale: Die Überarbeitung ersetzt die im Deutschen missverständliche Verbindung „viele Erschlagene fielen“ im Haupttext durch die natürliche Wendung „viele fielen erschlagen“, ohne die hebräische Bildsprache aufzugeben. Außerdem wird die nicht ausdrücklich im hebräischen Wortlaut enthaltene Spezifizierung „Stadt-“ vermieden und die Fußnotenalternative präzisiert.
