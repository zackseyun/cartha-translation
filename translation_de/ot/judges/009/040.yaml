base_translation:
  language: en
  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: de
  text: Abimelech verfolgte ihn, und er floh vor ihm. Und viele fielen erschlagen bis zum Eingang des Tores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und viele Erschlagene fielen bis zum Eingang des Tores.“ Das Hebräische verbindet bildhaft „fallen“ mit den im Kampf Getöteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: verfolgte ihn
  rationale: רדף bezeichnet häufig die Verfolgung eines Feindes. Die Wendung gibt das militärische Geschehen direkt und natürlich wieder.
- source_word: וַיָּנָס
  choice: er floh
  rationale: נוס bedeutet »fliehen«. Das singularische Pronomen verweist im Zusammenhang auf Gaal.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Wörtlich steht »von seinem Angesicht weg«; im Zusammenhang bezeichnet die Wendung die Flucht vor einem Verfolger.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: dabei fielen viele Erschlagene
  rationale: 'Die Verbindung bewahrt das eindrückliche hebräische Kampfbild: נפל heißt »fallen«, חֲלָלִים bezeichnet im Kampf Erschlagene beziehungsweise tödlich Verwundete. »Dabei« macht im Deutschen den Wechsel vom singularischen Gaal zu den zahlreichen Gefallenen verständlich, ohne den Sinn festzulegen.'
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: bis zum Eingang des Stadttores
  rationale: עַד gibt die räumliche Ausdehnung bis zu einem Endpunkt an; פתח ist der Eingang und שער hier im Erzählzusammenhang das Stadttor.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache des Hebräischen bleibt erhalten; »Stadttor« vermeidet die im Deutschen mögliche Vorstellung eines beliebigen Gebäudetores.
