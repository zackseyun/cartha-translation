    issue: „Stadttor“ spezifiziert das hebräische „Tor“.
    rationale: שער bedeutet hier schlicht „Tor“; die städtische Einordnung ergibt sich aus dem Kontext, wird aber nicht in diesem Ausdruck selbst genannt.
  - severity: medium
    issue: „Dabei fielen viele Erschlagene“ ist syntaktisch und stilistisch unnatürlich.
    rationale: Die deutsche Nominalgruppe „Erschlagene“ bezeichnet gewöhnlich bereits Getötete. Eine adverbiale Verwendung von „erschlagen“ bei „fielen“ vermittelt die hebräische Kampfformel klarer.
  - severity: low
    issue: Die Fußnotenalternative „Torweg“ ist für פתח השער nicht präzise.
    rationale: פתח bezeichnet den Eingang beziehungsweise die Öffnung; „Torweg“ kann einen Weg zum Tor bezeichnen und ist daher keine gleichwertige lexikalische Alternative.
  revised_text: Abimelech verfolgte ihn, und er floh vor ihm. Und viele fielen erschlagen bis zum Eingang des Tores.[a]
