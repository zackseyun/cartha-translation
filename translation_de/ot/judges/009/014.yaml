  text: וַ/יֹּאמְר֥וּ כָל הָ/עֵצִ֖ים אֶל הָ/אָטָ֑ד לֵ֥ךְ אַתָּ֖ה מְלָךְ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: de
  text: 'Da sagten alle Bäume zum Dornstrauch[a]: »Komm du, sei König über uns!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dornenbusch«. Das hebräische Wort bezeichnet einen dornigen Strauch; die genaue Pflanzenart ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Waw mit der Erzählform führt die Handlung weiter. »Da sagten« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: כָל הָעֵצִים
  choice: alle Bäume
  rationale: Direkte und im Deutschen natürliche Wiedergabe des umfassenden kollektiven Subjekts.
- source_word: הָאָטָד
  choice: der Dornstrauch
  rationale: אָטָד bezeichnet einen dornigen Strauch, ohne dass sich die botanische Art sicher bestimmen lässt. »Dornstrauch« wahrt diese Offenheit und passt in den bildhaften Zusammenhang der Fabel.
- source_word: לֵךְ אַתָּה
  choice: Komm du
  rationale: הלך steht hier vor einem weiteren Imperativ als auffordernde Einleitung. »Komm du« klingt im Deutschen natürlich und bewahrt die Hervorhebung durch das ausdrückliche Pronomen אַתָּה.
- source_word: מְלָךְ
  choice: sei König
  rationale: Das Verb bedeutet »König sein, als König herrschen«. »Sei König« erhält das ausdrücklich königliche Bild der Fabel.
- source_word: עָלֵינוּ
  choice: über uns
  rationale: Übliche Wiedergabe von עַל bei Herrschaft oder Königsherrschaft.
