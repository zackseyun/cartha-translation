  text: וַ/יָּשִׂ֣ימוּ ל/וֹ֩ בַעֲלֵ֨י שְׁכֶ֜ם מְאָרְבִ֗ים עַ֚ל רָאשֵׁ֣י הֶ/הָרִ֔ים וַ/יִּגְזְל֗וּ אֵ֛ת כָּל אֲשֶׁר יַעֲבֹ֥ר עֲלֵי/הֶ֖ם בַּ/דָּ֑רֶךְ וַ/יֻּגַּ֖ד לַ/אֲבִימֶֽלֶךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: de
  text: Da postierten die führenden Männer von Sichem[a] auf den Gipfeln der Berge Männer, die ihm auflauerten. Sie beraubten jeden, der auf der Straße an ihnen vorbeikam. Das wurde Abimelech gemeldet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die Bürger von Sichem« oder »die Machthaber von Sichem«. Der hebräische Ausdruck bedeutet wörtlich »die Besitzer/Herren von Sichem« und kann die maßgeblichen Männer oder politischen Machtträger der Stadt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: die führenden Männer von Sichem
  rationale: בַעֲלֵי bezeichnet wörtlich Besitzer, Herren oder Machthaber. Im städtisch-politischen Zusammenhang sind damit die maßgeblichen Männer der Stadt gemeint; die gewählte Formulierung gibt diese Funktion wieder, ohne feudale Herrschaft anzudeuten.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: legten ihm … einen Hinterhalt
  rationale: Die Verbindung von שׂים mit dem pluralischen Partizip מְאָרְבִים beschreibt das Aufstellen von Männern, die im Hinterhalt lauern. Die deutsche Wendung ist idiomatisch und bewahrt den gegen Abimelech gerichteten Sinn.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: auf den Gipfeln der Berge
  rationale: Die Formulierung bedeutet wörtlich „auf den Häuptern der Berge“. „Gipfel der Berge“ wahrt das konkrete Bild und die erhöhte Lage in natürlichem Deutsch.
- source_word: וַיִּגְזְלוּ
  choice: sie beraubten
  rationale: גזל bezeichnet gewaltsames Wegnehmen oder Raub. Da Reisende die unmittelbaren Betroffenen sind, passt „beraubten“ genauer als das allgemeinere „plünderten“.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: jeden, der auf der Straße an ihnen vorbeikam
  rationale: כָּל mit dem singularischen Verb hat distributiven Sinn. „Jeden“ gibt dies idiomatisch wieder; „auf der Straße“ entspricht der bestimmten Wegangabe.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: Das wurde Abimelech gemeldet
  rationale: Die unpersönliche Passivform lässt offen, wer die Nachricht überbrachte. Die deutsche Fassung bewahrt diese Unbestimmtheit.
