  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: de
  text: Als alle führenden Männer des Turms von Sichem[a] davon hörten, gingen sie in den inneren Raum[b] des Hauses El-Berits[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Migdal-Sichem“, wenn die hebräische Wendung als Ortsname und nicht als „Turm von Sichem“ verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch „Gewölbe“, „Festung“ oder einen geschützten Raum bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: El-Berit kann „Gott des Bundes“ bedeuten. Vergleiche den verwandten Namen Baal-Berit an anderen Stellen dieses Kapitels.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: davon hörten
  rationale: Das Verb bedeutet „hören“. Das im Hebräischen unausgesprochene Bezugsobjekt ergibt sich aus dem vorhergehenden Geschehen; „davon hörten“ ist im Deutschen natürlich und fügt keine neue Sachinformation hinzu.
- source_word: בַּעֲלֵי
  choice: führenden Männer
  rationale: Wörtlich bezeichnet das Wort „Herren“ oder „Besitzer“. Im städtisch-politischen Zusammenhang sind die maßgeblichen Männer beziehungsweise führenden Einwohner gemeint; „führende Männer“ gibt diese Funktion verständlich wieder.
- source_word: מִגְדַּל שְׁכֶם
  choice: Turm von Sichem
  rationale: מִגְדַּל bedeutet „Turm“. Die transparente Sachbedeutung steht im Haupttext; die mögliche Auffassung als Ortsname wird in einer Fußnote bewahrt.
- source_word: וַיָּבֹאוּ אֶל
  choice: gingen sie in
  rationale: Das Verb mit אֶל beschreibt hier die Bewegung zu beziehungsweise in den als Zuflucht dienenden Raum. „Gingen sie in“ ist im Deutschen kontextgerecht.
- source_word: צְרִיחַ
  choice: Schutzraum
  rationale: Das seltene Substantiv bezeichnet offenbar einen geschützten Innenraum, ein Gewölbe oder einen befestigten Raum. „Schutzraum“ macht seine Zufluchtsfunktion deutlich, ohne eine genaue bauliche Rekonstruktion festzulegen.
- source_word: בֵּית אֵל בְּרִית
  choice: Haus El-Berits
  rationale: בֵּית heißt wörtlich „Haus“ und kann ein Heiligtum oder einen Tempel bezeichnen. Die Wiedergabe bewahrt El-Berit als Namen oder Titel und harmonisiert ihn nicht mit Baal-Berit in anderen Versen.
theological_decisions:
- issue: Wiedergabe der Bezeichnung אֵל בְּרִית
  choice: El-Berit
  alternative: Gott des Bundes; durch Angleichung an den Kontext auch Baal-Berit
  rationale: Die Umschrift bewahrt die Mehrdeutigkeit zwischen einem Eigennamen und dem Titel „Gott des Bundes“. Eine Angleichung an Baal-Berit würde den Wortlaut dieses Verses interpretierend verändern.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satz folgt der knappen hebräischen Erzählstruktur. Seltene Orts- und Kultbezeichnungen werden nicht vorschnell vereindeutigt; echte lexikalische Alternativen stehen in den Fußnoten.
