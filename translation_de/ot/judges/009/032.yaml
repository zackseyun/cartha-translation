  text: וְ/עַתָּה֙ ק֣וּם לַ֔יְלָה אַתָּ֖ה וְ/הָ/עָ֣ם אֲשֶׁר אִתָּ֑/ךְ וֶ/אֱרֹ֖ב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: de
  text: Nun denn, steh bei Nacht[a] auf, du und das Volk, das bei dir ist, und leg dich auf dem Feld auf die Lauer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachts“. Die hebräische Zeitangabe bezeichnet eine Handlung während der Nacht, ohne zwingend „heute Nacht“ zu bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und lauere auf dem Feld“. Das hebräische Verb bedeutet, auf der Lauer zu liegen, oft im Sinn eines Hinterhalts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun denn
  rationale: Die Wendung leitet eine unmittelbare Aufforderung ein. „Nun denn“ gibt sowohl den Übergang als auch die Dringlichkeit in natürlichem Deutsch wieder.
- source_word: קוּם
  choice: steh ... auf
  rationale: Der singularische Imperativ von קום wird direkt wiedergegeben und bewahrt den bestimmten Befehlston.
- source_word: לַיְלָה
  choice: bei Nacht
  rationale: Der adverbiale Akkusativ bezeichnet nächtliches Handeln, ohne zwingend „heute Nacht“ zu bedeuten. „Bei Nacht“ passt zudem zum militärischen Zusammenhang.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten, um die hebräische Hervorhebung des Angesprochenen sichtbar zu machen.
- source_word: וְהָעָם אֲשֶׁר אִתָּךְ
  choice: und das Volk, das bei dir ist
  rationale: עָם wird unmittelbar mit „Volk“ wiedergegeben. „Truppen“ wäre im Zusammenhang möglich, würde die militärische Deutung jedoch stärker festlegen als der Ausgangstext.
- source_word: וֶאֱרֹב
  choice: und leg dich ... auf die Lauer
  rationale: ארב bezeichnet das verborgene Warten mit dem Ziel eines Hinterhalts. „Sich auf die Lauer legen“ bewahrt diesen Vorgang besser als eine Formulierung, die bereits den Angriff selbst bezeichnet.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שָׂדֶה kann ein Feld oder offenes Land bezeichnen. „Auf dem Feld“ ist die direkte, im taktischen Zusammenhang verständliche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem militärischem Befehlston. Die ausdrücklich genannte Verbindung „du und das Volk“ sowie die singularischen Befehlsformen des Hebräischen bleiben erhalten; mögliche kontextuelle Präzisierungen wie „Truppen“ oder „heute Nacht“ werden nicht in den Haupttext eingetragen.
