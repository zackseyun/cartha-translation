  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: de
  text: Ihr aber habt euch heute gegen das Haus meines Vaters erhoben und seine Söhne getötet, siebzig Männer auf einem einzigen Stein, und habt Abimelech, den Sohn seiner Sklavin[a], zum König über die führenden Männer von Sichem gemacht, weil er euer Bruder ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Dienerin“; sinngemäß möglicherweise: „seiner Nebenfrau“. Das hebräische Wort bezeichnet eine weibliche Dienerin oder Sklavin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: habt euch ... gegen ... erhoben
  rationale: Bewahrt das Bild des hebräischen Ausdrucks und zugleich seinen feindseligen, anklagenden Sinn.
- source_word: בֵּית אָבִי
  choice: das Haus meines Vaters
  rationale: „Haus“ bezeichnet hier die Familie beziehungsweise Sippe und bewahrt zugleich die konkrete Ausdrucksweise des Hebräischen.
- source_word: הַיּוֹם
  choice: heute
  rationale: Gibt die zeitliche Hervorhebung in Jotams Anklage unmittelbar wieder.
- source_word: וַתַּהַרְגוּ
  choice: getötet
  rationale: Der hebräische Wortlaut bezeichnet das Töten, ohne durch „ermordet“ zusätzlich eine rechtliche Wertung in das Verb einzutragen.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das Suffix bezieht sich am natürlichsten auf Jotams Vater und nicht auf dessen Haus.
- source_word: שִׁבְעִים אִישׁ
  choice: siebzig Männer
  rationale: Entspricht der üblichen hebräischen Zählweise für männliche Personen und passt zum Erzählzusammenhang.
- source_word: עַל אֶבֶן אֶחָת
  choice: auf einem einzigen Stein
  rationale: Bewahrt die drastische Konkretheit des hebräischen Ausdrucks; „einzigen“ hebt die gemeinsame Hinrichtungsstätte hervor, ohne ihre genaue Funktion festzulegen.
- source_word: וַתַּמְלִיכוּ
  choice: habt ... zum König ... gemacht
  rationale: Gibt die kausative Verbform direkt und in natürlichem Deutsch wieder.
- source_word: בֶּן אֲמָתוֹ
  choice: den Sohn seiner Magd
  rationale: „Magd“ gibt den Status einer weiblichen Dienerin beziehungsweise Sklavin knapp und traditionsunabhängig wieder; die mögliche soziale Nuance wird in der Fußnote offengehalten.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: die führenden Männer von Sichem
  rationale: Bezeichnet hier die maßgeblichen Männer beziehungsweise politischen Statusinhaber der Stadt; die Wendung ist verständlicher als das missverständliche „Herren von Sichem“.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: weil er euer Bruder ist
  rationale: 'Bewahrt die kausale Aussage und die anklagende Ironie: Die Verwandtschaft mit den Sichemitern war der Grund ihrer Parteinahme.'
theological_decisions:
- issue: Sozialer Status von Abimelechs Mutter in אֲמָתוֹ
  choice: seiner Magd
  alternative: seiner Sklavin; seiner Nebenfrau
  rationale: Das hebräische Substantiv bezeichnet unmittelbar eine weibliche Dienerin oder Sklavin. „Nebenfrau“ kann sich aus dem weiteren Erzählzusammenhang ergeben, ist hier aber nicht die eigentliche lexikalische Bezeichnung. Die Hauptfassung wahrt daher die soziale Herabsetzung, ohne einen institutionell genaueren Status festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anklagende Satzführung und die konkreten Bilder des Hebräischen bleiben erhalten. „Dann“ gliedert die lange hebräische Folge für heutige Leser, ohne die sachliche Reihenfolge zu verändern.
