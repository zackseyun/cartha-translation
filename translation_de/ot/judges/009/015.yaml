base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: de
  text: 'Da sagte der Dornstrauch[a] zu den Bäumen: »Wenn ihr mich wirklich zum König über euch salbt, dann kommt und sucht Zuflucht[b] in meinem Schatten. Wenn aber nicht, soll Feuer vom Dornstrauch ausgehen[c] und die Zedern des Libanon verzehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dornenbusch«. Das hebräische Wort bezeichnet einen dornigen Strauch; die genaue Pflanzenart ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »sucht Schutz in meinem Schatten«. Die Einladung wirkt wahrscheinlich ironisch, weil ein Dornstrauch kaum Schatten oder Schutz bietet.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »wird Feuer vom Dornstrauch ausgehen«. Die hebräische Verbform kann als fluchartiger Wunsch oder als Vorhersage verstanden werden.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: der Dornstrauch
  rationale: Das hebräische Wort bezeichnet einen dornigen Strauch. »Dornstrauch« ist im Deutschen natürlich und bewahrt den Kontrast zu den edlen Bäumen der Fabel, ohne eine botanisch zu enge Bestimmung vorzunehmen.
- source_word: אִם בֶּאֱמֶת
  choice: Wenn ihr mich wirklich
  rationale: »Wirklich« gibt die Frage nach der Ernsthaftigkeit beziehungsweise Aufrichtigkeit idiomatisch wieder.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: zum König über euch salbt
  rationale: »Salben« bewahrt den konkreten politischen und königlichen Ausdruck des Hebräischen, statt ihn zu »einsetzen« oder »machen« zu verallgemeinern.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: dann kommt und sucht Zuflucht in meinem Schatten
  rationale: Die Formulierung gibt beide Imperative wieder. »Zuflucht suchen« erfasst den Schutzgedanken von חסה; »Schatten« bewahrt zugleich die Ironie, da ein Dornstrauch kaum Schutz spendet.
- source_word: וְאִם אַיִן
  choice: Wenn aber nicht
  rationale: Die knappe deutsche Wendung markiert klar den Gegensatz zur vorangehenden Bedingung.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: soll Feuer vom Dornstrauch ausgehen
  rationale: »Soll« bewahrt die mögliche jussivische beziehungsweise fluchartige Aussage, ohne die ebenfalls mögliche Zukunftsbedeutung zu verschweigen.
- source_word: וְתֹאכַל
  choice: und ... verzehren
  rationale: Bei Feuer bedeutet אכל idiomatisch »verzehren«; die Wortwahl ist zugleich natürlich und würdevoll.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: die Zedern des Libanon
  rationale: Die geläufige deutsche Form bewahrt das majestätische Bild und die literarische Gegenüberstellung zum Dornstrauch.
theological_decisions:
- issue: Aussagemodus der Feuerdrohung
  choice: »soll Feuer ... ausgehen«
  alternative: »wird Feuer ... ausgehen«
  rationale: Die hebräische Imperfektform kann hier als jussivischer Fluch oder als Vorhersage verstanden werden. Der Haupttext gibt die fluchartige Nuance wieder; die Fußnote erhält die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. Die direkte Rede bleibt klar und knapp; die Bildsprache sowie die Ironie der Fabel werden bewahrt. Alle Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Ausdrücken.
