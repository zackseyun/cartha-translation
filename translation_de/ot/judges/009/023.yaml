  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: de
  text: Da sandte Gott einen bösen Geist[a] zwischen Abimelech und den führenden Männern von Sichem[b], und die führenden Männer von Sichem handelten treulos gegen Abimelech[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen unheilvollen Geist“. Der hebräische Ausdruck kann moralische Bosheit oder eine schädigende Wirkung hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Herren/Besitzer von Sichem“; gemeint sind hier wahrscheinlich die maßgeblichen Männer oder politischen Führer der Stadt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wurden Abimelech untreu“ beziehungsweise „verrieten Abimelech“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Die Erzählform von שׁלח bezeichnet direkt das Senden; „sandte“ wahrt die ausdrückliche göttliche Urheberschaft.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang bezeichnet אֱלֹהִים Gott als den Handelnden.
- source_word: רוּחַ רָעָה
  choice: einen bösen Geist
  rationale: Die direkte Wiedergabe bewahrt sowohl den personal klingenden Ausdruck רוּחַ als auch die moralische beziehungsweise schädigende Bedeutung von רָעָה; „einen unheilvollen Geist“ bleibt als mögliche Alternative vermerkt.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und
  rationale: Die paarige Präposition bezeichnet hier eine zwischen zwei Parteien wirkende Trennung beziehungsweise Feindschaft.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: die führenden Männer von Sichem
  rationale: בַּעֲלֵי bedeutet wörtlich „Herren/Besitzer“, bezeichnet in diesem städtisch-politischen Zusammenhang aber wahrscheinlich die maßgeblichen Männer beziehungsweise Machthaber Sichems.
- source_word: וַיִּבְגְּדוּ
  choice: handelten treulos
  rationale: בגד bezeichnet treuloses oder verräterisches Handeln. „Handelten treulos“ ist im Deutschen natürlich und wahrt die moralische Beziehungsdimension.
- source_word: בַּאֲבִימֶלֶךְ
  choice: an Abimelech
  rationale: Bei בגד bezeichnet ב die Person, an der treulos gehandelt wird. Die deutsche Verbindung „treulos an jemandem handeln“ gibt dies präzise wieder.
theological_decisions:
- issue: Göttliche Urheberschaft beim Senden des bösen Geistes
  choice: „Gott sandte einen bösen Geist“
  alternative: „Gott ließ einen bösen Geist zu“ beziehungsweise „Gott ließ einen Geist der Feindschaft entstehen“
  rationale: Verb und Satzbau schreiben das Senden ausdrücklich Gott zu. Eine Abschwächung zu bloßem Zulassen würde eine Deutung in den Text eintragen; die theologische Spannung bleibt daher bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sichem“ folgt der etablierten deutschen Namensform. Die Wiederholung von „die führenden Männer von Sichem“ bildet die Wiederaufnahme des hebräischen Subjekts ab; „an Abimelech treulos handeln“ erhält die Beziehungsrichtung des hebräischen Ausdrucks.
