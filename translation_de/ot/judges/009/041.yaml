source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב אֲבִימֶ֖לֶךְ בָּ/ארוּמָ֑ה וַ/יְגָ֧רֶשׁ זְבֻ֛ל אֶת גַּ֥עַל וְ/אֶת אֶחָ֖י/ו מִ/שֶּׁ֥בֶת בִּ/שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: de
  text: Abimelech blieb in Aruma, und Sebul vertrieb Gaal und seine Brüder, sodass sie nicht mehr in Sichem wohnen konnten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vom Wohnen in Sichem“; die hebräische Infinitivkonstruktion besagt, dass ihnen das weitere Wohnen dort verwehrt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann sitzen, wohnen oder bleiben bedeuten. Im erzählerischen Zusammenhang bezeichnet „blieb“ natürlich Abimelechs Aufenthalt beziehungsweise sein Verweilen in Aruma, ohne einen langfristigen Wohnsitz vorauszusetzen.
- source_word: בָּארוּמָה
  choice: in Aruma
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition als „Aruma“ wiedergegeben; die Präposition wird lokativ mit „in“ übersetzt.
- source_word: וַיְגָרֶשׁ
  choice: vertrieb
  rationale: גרשׁ bezeichnet ein gewaltsames oder entschiedenes Vertreiben. „Vertrieb“ ist knapp, idiomatisch und vermeidet die rechtliche Nebenbedeutung von „verbannte“.
- source_word: זְבֻל
  choice: Sebul
  rationale: Der Personenname wird in einer im Deutschen etablierten, an der hebräischen Lautung orientierten Form wiedergegeben.
- source_word: גַּעַל
  choice: Gaal
  rationale: Der Personenname wird in der geläufigen deutschen Form „Gaal“ wiedergegeben; der hebräische Kehllaut Ajin wird dabei nicht eigens markiert.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: אָח bedeutet primär „Bruder“. Da der Kontext keine sichere Erweiterung auf Verwandte oder Gefährten verlangt, bleibt die konkrete Verwandtschaftsbezeichnung erhalten.
- source_word: מִשֶּׁבֶת
  choice: sodass sie nicht mehr … wohnen konnten
  rationale: Die Verbindung מן mit dem Infinitiv von ישׁב drückt hier den Ausschluss vom weiteren Wohnen beziehungsweise Verweilen aus. Die resultative Formulierung gibt diese Funktion in natürlichem Deutsch klar wieder.
- source_word: בִּשְׁכֶם
  choice: in Sichem
  rationale: Der Ortsname wird in der etablierten deutschen Form „Sichem“ wiedergegeben; die Präposition ist lokativ.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die resultative Wiedergabe der hebräischen Infinitivkonstruktion vermeidet das im Deutschen schwerfällige „vom Wohnen vertreiben“; die Fußnote bewahrt die formnähere Ausdrucksweise.
