  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: de
  text: Abimelech kämpfte jenen ganzen Tag gegen die Stadt[a]. Er nahm die Stadt ein und tötete die Menschen, die sich darin befanden. Dann riss er die Stadt nieder und besäte sie mit Salz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »griff die Stadt an«. Das hebräische Verb bedeutet wörtlich »kämpfen« und bezeichnet mit der hier verwendeten Präposition wahrscheinlich militärisches Vorgehen gegen die Stadt.'
    reason: lexical_alternative
  - marker: b
    text: Das Besäen mit Salz ist ein symbolisches Zeichen der Verwüstung und Verfluchung und unterstreicht den Untergang der Stadt.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: kämpfte … gegen die Stadt
  rationale: לחם mit ב bezeichnet hier im Zusammenhang von Einnahme und Zerstörung militärisches Vorgehen gegen die Stadt. „Kämpfte gegen“ bleibt näher am hebräischen Verb als das ebenfalls mögliche „griff … an“.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: jenen ganzen Tag
  rationale: Die Wendung betont die Dauer des Kampfes an diesem bestimmten Tag und ist so in modernem Deutsch natürlich.
- source_word: וַיִּלְכֹּד
  choice: nahm … ein
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme einer Stadt; „eine Stadt einnehmen“ ist die idiomatische deutsche Entsprechung.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: die Menschen, die sich darin befanden
  rationale: עָם meint hier die in der Stadt befindliche Bevölkerung. Die Wiedergabe bewahrt den Relativsatz, ohne ausdrücklich „Einwohner“ in den Text einzutragen.
- source_word: הָרָג
  choice: tötete
  rationale: Das schlichte moderne Verb gibt die Bedeutung von הרג klar wieder, ohne archaische oder zusätzliche bildhafte Färbung.
- source_word: וַיִּתֹּץ
  choice: riss … nieder
  rationale: נתץ bezeichnet das Niederreißen beziehungsweise Zerstören von Bauwerken; „niederreißen“ passt natürlich zur Zerstörung einer Stadt.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: besäte sie mit Salz
  rationale: Die Formulierung erhält das konkrete Bild des hebräischen „mit Salz besäen“ und vermeidet die weniger genaue Verkürzung „salzen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Abfolge der hebräischen Erzählung bleibt erhalten; die militärischen Ausdrücke sind idiomatisch, ohne die Bildsprache des abschließenden Salzsäens aufzulösen.
