source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אִֽישׁ יִשְׂרָאֵ֖ל כִּ֣י מֵ֣ת אֲבִימֶ֑לֶךְ וַ/יֵּלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: de
  text: Als die Männer Israels sahen, dass Abimelech tot war, ging jeder an seinen Ort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Männer Israels … jeder an seinen Ort.“ Das singularische „jeder“ verteilt die Handlung auf die einzelnen Männer der Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: sahen
  rationale: 'Die Grundbedeutung von ראה passt in der erzählenden Abfolge: Die Männer nehmen Abimelechs Tod wahr und erkennen ihn. „Sahen“ bewahrt die Bildlichkeit und ist im Deutschen natürlich.'
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Das singularische אִישׁ wird wegen des pluralischen Verbs kollektiv verstanden. „Die Männer Israels“ erhält den ausdrücklich männlichen Bezug des hebräischen Ausdrucks.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Männer sahen beziehungsweise erkannten.
- source_word: מֵת
  choice: tot war
  rationale: מֵת beschreibt Abimelechs wahrgenommenen Zustand. „Tot war“ gibt diesen Zustandscharakter treffender wieder als das stärker ereignisbezogene „gestorben war“.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition transliteriert.
- source_word: וַיֵּלְכוּ
  choice: ging
  rationale: הלך bedeutet hier schlicht „gehen“. Wegen des anschließenden distributiven Singulars ist im Deutschen „ging jeder“ idiomatisch; „kehrte zurück“ würde mehr ausdrücken als der Text.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: jeder an seinen Ort
  rationale: Das singularische אִישׁ verteilt die pluralische Handlung auf die einzelnen Männer. מָקוֹם bezeichnet wörtlich den jeweiligen „Ort“ und nicht ausdrücklich das Zuhause.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. „An seinen Ort“ ist bewusst etwas formeller, bewahrt aber die Bedeutung von לִמְקֹמוֹ, ohne „nach Hause“ hineinzulesen.
