revisions:
- from: Da hieb auch das ganze Volk jeder einen Zweig ab[a]. Sie folgten Abimelech, legten die Zweige an den befestigten Innenraum und steckten ihn über ihnen in Brand. So starben auch alle Bewohner des Turms von Sichem, etwa tausend Männer und Frauen.
  to: Da hieb auch jeder vom ganzen Volk einen Zweig ab. Sie folgten Abimelech, legten die Zweige auf den inneren Schutzraum und steckten ihn über ihnen in Brand. So starben auch alle Bewohner des Turms von Sichem, etwa tausend Männer und Frauen.
  rationale: Die Revision glättet die deutsche Syntax, vermeidet eine nicht zwingend vom Hebräischen gedeckte bauliche Festlegung und entfernt die redundante Fußnote. Die narrative Abfolge, die räumliche Mehrdeutigkeit von עֲלֵיהֶם sowie die ungefähre Zahl bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:20:37Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Handlung, die Abfolge und die ungefähre Zahl zuverlässig wieder. Die Wiedergabe von צְרִיחַ als „befestigter Innenraum“ legt jedoch mit „befestigt“ ein Merkmal ausdrücklich fest, das der schwierige Ausdruck selbst nicht eindeutig bezeichnet. „Innerer Schutzraum“ wahrt die Abgrenzung zum anschließend genannten „Turm“, ohne die Bauform weiter festzulegen. Die räumliche Wendung עֲלֵיהֶם bleibt mit „über ihnen“ erhalten.
  naturalness: „Da hieb auch das ganze Volk jeder einen Zweig ab“ ist im modernen Standarddeutsch syntaktisch und stilistisch holprig. „Da hieb auch jeder vom ganzen Volk einen Zweig ab“ bildet die distributive hebräische Wendung klar und idiomatisch ab. Die übrige Erzählführung im Präteritum ist angemessen.
  terminology: Abimelech und Sichem sind etablierte deutsche Namensformen. „Bewohner des Turms von Sichem“ ist angesichts der folgenden Angabe „Männer und Frauen“ eine sachgerechte idiomatische Wiedergabe von אַנְשֵׁי. Der bisherige Fußnotenhinweis bietet keine echte Alternative, da die distributive Aussage bereits im deutschen Text ausgedrückt ist.
  issues:
  - severity: medium
    issue: Holprige und fehlerhafte Wortstellung im ersten Satz
    rationale: Die Verbindung „das ganze Volk jeder“ ist im Deutschen nicht natürlich. Die Umstellung auf „jeder vom ganzen Volk“ gibt sowohl כָּל־הָעָם als auch אִישׁ distributiv wieder.
  - severity: low
    issue: „befestigt“ ist eine unnötige Konkretisierung von צְרִיחַ
    rationale: Die genaue bauliche Bedeutung des seltenen Wortes ist unsicher. „Innerer Schutzraum“ ist kontextgerecht und weniger spezifisch.
  - severity: low
    issue: Fußnote a ist redundant
    rationale: Der Text sagt bereits klar „jeder ... einen Zweig“; die Fußnote fügt keine lexikalische Alternative oder notwendige Erklärung hinzu.
  revised_text: Da hieb auch jeder vom ganzen Volk einen Zweig ab. Sie folgten Abimelech, legten die Zweige auf den inneren Schutzraum und steckten ihn über ihnen in Brand. So starben auch alle Bewohner des Turms von Sichem, etwa tausend Männer und Frauen.
