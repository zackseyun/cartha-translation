base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: de
  text: Da hieb auch jeder vom ganzen Volk einen Zweig ab. Sie folgten Abimelech, legten die Zweige auf den inneren Schutzraum und steckten ihn über ihnen in Brand. So starben auch alle Bewohner des Turms von Sichem, etwa tausend Männer und Frauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרְתוּ גַם כָּל־הָעָם אִישׁ שׂוֹכֹה
  choice: Da hieb auch das ganze Volk jeder einen Zweig ab
  rationale: כרת bezeichnet hier das Abhauen von Zweigen. Die distributive Wendung אִישׁ שׂוֹכֹה wird im natürlichen Deutschen mit „jeder einen Zweig“ wiedergegeben.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: Sie folgten Abimelech
  rationale: Wörtlich gingen sie „hinter Abimelech her“; im Erzählzusammenhang bedeutet dies, dass sie seinem Beispiel beziehungsweise seiner Führung folgten.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: legten die Zweige an den befestigten Innenraum
  rationale: עַל kann hier angesichts der vorbereiteten Brandlegung räumlich „an/gegen“ bedeuten. Das im Hebräischen nicht eigens wiederholte Objekt wird zur Klarheit als „die Zweige“ aufgenommen.
- source_word: הַצְּרִיחַ
  choice: der befestigte Innenraum
  rationale: Der seltene Ausdruck bezeichnet wahrscheinlich den geschützten, umschlossenen Zufluchtsraum innerhalb der Turmanlage und wird so von מִגְדַּל, „Turm“, unterschieden.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת־הַצְּרִיחַ בָּאֵשׁ
  choice: steckten ihn über ihnen in Brand
  rationale: „Über ihnen“ bewahrt die räumliche Aussage von עֲלֵיהֶם, ohne genauer festzulegen, wie die Menschen innerhalb des Bauwerks untergebracht waren.
- source_word: כָּל־אַנְשֵׁי מִגְדַּל־שְׁכֶם
  choice: alle Bewohner des Turms von Sichem
  rationale: אַנְשֵׁי bezeichnet hier die zum Turm gehörenden Menschen; „Bewohner“ schließt entsprechend der anschließenden Präzisierung Männer und Frauen ein.
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  choice: etwa tausend Männer und Frauen
  rationale: Das Präfix כ־ kennzeichnet eine ungefähre Zahl; אִישׁ וְאִשָּׁה umfasst ausdrücklich beide Geschlechter.
