  text: וַ/יָּ֧שַׂר אֲבִימֶ֛לֶךְ עַל יִשְׂרָאֵ֖ל שָׁלֹ֥שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/022.yaml
  text: Abimelech ruled over Israel for three years.
translation:
  language: de
  text: Abimelech herrschte drei Jahre über Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: herrschte
  rationale: Das Verb שׂרר bezeichnet die Ausübung von Herrschaft. »Herrschte« gibt den politischen Sinn im Deutschen natürlich und prägnant wieder, ohne Abimelech ausdrücklich einen im Hebräischen hier nicht genannten Königstitel zuzuschreiben.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: עַל
  choice: über
  rationale: In Verbindung mit einem Verb des Herrschens bezeichnet עַל den Bereich beziehungsweise die Menschen, über die Autorität ausgeübt wird.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Die etablierte deutsche Form des Volks- und Landesnamens wird beibehalten.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: drei Jahre
  rationale: Die hebräische Zeitangabe bezeichnet die Dauer der Herrschaft; im Deutschen ist kein zusätzliches »lang« erforderlich.
theological_decisions:
- issue: Art und Legitimität von Abimelechs Stellung
  choice: Das neutrale Verb »herrschte« ohne Königstitel
  alternative: »war drei Jahre König über Israel« oder »regierte Israel«
  rationale: Der Vers verwendet das Verb שׂרר und nennt Abimelech hier nicht ausdrücklich König. »Herrschte« wahrt diese Zurückhaltung und legt weder die Legitimität noch die genaue Amtsform seiner Gewalt fest.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die Wortstellung hebt wie im Hebräischen Abimelech als handelnde Person hervor; die Dauerangabe steht idiomatisch vor »über Israel«.
