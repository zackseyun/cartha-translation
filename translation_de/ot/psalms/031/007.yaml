source:
  edition: WLC
  text: אָגִ֥ילָה וְ/אֶשְׂמְחָ֗ה בְּ/חַ֫סְדֶּ֥/ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת עָנְיִ֑/י יָ֝דַ֗עְתָּ בְּ/צָר֥וֹת נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: de
  text: Ich will jubeln und mich über deine treue Liebe freuen, denn du hast mein Elend gesehen; du hast meine Seele in ihren Nöten[a] erkannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann je nach Zusammenhang auch „Leben“ oder „ganze Person“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: Ich will jubeln
  rationale: Der Kohortativ der 1. Person Singular von גיל drückt einen entschlossenen, freudigen Ausruf aus. „Jubeln“ gibt die starke Freude natürlich und würdig wieder.
- source_word: וְאֶשְׂמְחָה
  choice: und mich … freuen
  rationale: שמח verstärkt zusammen mit גיל die Freude. Die Verbindung „jubeln und mich freuen“ bewahrt das poetische Wortpaar in natürlichem Deutsch.
- source_word: בְחַסְדֶּךָ
  choice: über deine treue Liebe
  rationale: חֶסֶד bezeichnet hier eine beständige, verlässliche und zugewandte Liebe. „Treue Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Verlässlichkeit, ohne den Begriff auf eine einzelne dogmatische Deutung zu verengen.
- source_word: אֲשֶׁר
  choice: denn
  rationale: Die Partikel führt hier sinngemäß den Grund für den Jubel ein. „Denn“ bildet diese kausale Funktion in gehobenem, aber gegenwärtigem Deutsch ab.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: du hast mein Elend gesehen
  rationale: עֳנִי bezeichnet Bedrängnis, Not oder Elend. „Mein Elend“ ist knapp, eindringlich und entspricht dem Klagepsalmregister.
- source_word: יָדַעְתָּ
  choice: du hast … erkannt
  rationale: ידע kann Wissen, Wahrnehmen und persönliches Kennen bezeichnen. „Erkannt“ vermittelt hier mehr als bloße Kenntnisnahme, ohne die relationale Weite des Verbs auszuschließen.
- source_word: בְּצָרוֹת נַפְשִׁי
  choice: die Nöte meiner Seele
  rationale: צָרוֹת steht im Plural und wird deshalb mit „Nöte“ wiedergegeben. נֶפֶשׁ kann Seele, Leben oder die ganze Person meinen; „Seele“ bewahrt die traditionelle Bildsprache und die persönliche Tiefe des Ausdrucks.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ im Klagepsalm
  choice: Seele
  alternative: Leben oder ganze Person
  rationale: „Seele“ bewahrt die anthropologische und poetische Tiefe des hebräischen Ausdrucks, soll aber nicht als Festlegung auf einen Leib-Seele-Dualismus verstanden werden. Die Fußnote hält die möglichen Bedeutungen „Leben“ und „ganze Person“ offen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte, Gnade oder Bundestreue
  rationale: „Treue Liebe“ verbindet liebevolle Zuwendung mit Beständigkeit, ohne den Ausdruck ausschließlich als technischen Bundesbegriff oder nur als Erbarmen zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. Das doppelte Freudmotiv und der Plural „Nöte“ bleiben erhalten; mögliche Bedeutungen von נֶפֶשׁ werden nicht stillschweigend vereinheitlicht.
