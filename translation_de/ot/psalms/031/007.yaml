  source_fidelity: 'Der erste Satzteil gibt die beiden kohortativen Freudenverben, חסד und den kausalen Anschluss angemessen wieder. Im zweiten Satzteil bezieht sich בְּצָרוֹת auf die Lage der נפש: Gott hat die betende Person »in/bei ihren Nöten« erkannt bzw. gekannt. Die Formulierung »die Nöte meiner Seele erkannt« ist zwar verständlich, macht die Nöte aber stärker zum direkten Erkenntnisobjekt als der hebräische Satz.'
