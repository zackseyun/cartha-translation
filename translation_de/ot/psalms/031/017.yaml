source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: de
  text: Jahwe, lass mich nicht zuschanden werden, denn ich habe zu dir gerufen! Die Frevler sollen zuschanden werden; im Totenreich sollen sie verstummen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Im Totenreich sollen sie still sein«; auch möglich: »Schweigend sollen sie ins Totenreich hinabgehen.« Das hebräische Verb kann Schweigen oder Regungslosigkeit bezeichnen. Das »Totenreich« ist der Bereich der Toten und nicht ohne Weiteres mit der Hölle gleichzusetzen.'
    reason: Die Bedeutungsbreite des Verbs und die örtliche beziehungsweise zielgerichtete Deutung der Präposition lassen mehrere sachlich vertretbare Wiedergaben zu.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben; die direkte Anrede ist bereits durch den Namen und den Imperativ erkennbar.
- source_word: אַל אֵבוֹשָׁה
  choice: lass mich nicht zuschanden werden
  rationale: אַל mit der folgenden Verbform drückt hier eine verneinte Bitte aus. »Zuschanden werden« bewahrt den Gedanken öffentlicher Beschämung und ermöglicht die Entsprechung zum folgenden יֵבֹשׁוּ.
- source_word: כִּי קְרָאתִיךָ
  choice: denn ich rufe zu dir
  rationale: כִּי begründet die Bitte. Das formal perfektive Verb bezeichnet im Gebetszusammenhang den vollzogenen beziehungsweise gegenwärtig geltenden Hilferuf; das deutsche Präsens klingt natürlich und gibt diesen Bezug passend wieder.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: Die Frevler sollen zuschanden werden
  rationale: Die Form hat Wunsch- beziehungsweise Verwünschungscharakter. »Frevler« ist im poetischen Register verständlich und gibt die moralische Wertung von רְשָׁעִים knapp wieder.
- source_word: יִדְּמוּ
  choice: sollen sie verstummen
  rationale: Das Verb bezeichnet hier das Still- oder Stummwerden. »Verstummen« gibt den Eintritt in diesen Zustand wieder, ohne ausdrücklich eine verursachende Passivform einzutragen; die mögliche Bedeutung »regungslos sein« bleibt in der Fußnote erhalten.
- source_word: לִשְׁאוֹל
  choice: im Totenreich
  rationale: שְׁאוֹל bezeichnet den Bereich der Toten. »Totenreich« ist für heutige Leser verständlicher als eine unkommentierte Transliteration und vermeidet die sachlich zu enge Wiedergabe »Grab« sowie die anachronistische Gleichsetzung mit der Hölle. Die Präposition ל kann im Zusammenhang örtlich beziehungsweise zielgerichtet verstanden werden; die Richtungsnuance wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Gottes Israels bleibt als Name sichtbar und wird nicht durch einen Titel ersetzt.
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol
  rationale: »Totenreich« vermittelt den althebräischen Bezug auf den Bereich der Toten, ohne ihn stillschweigend mit der Hölle gleichzusetzen. Die begriffliche Spannung wird durch die Fußnote gewahrt.
- issue: Verhältnis von Schweigen und Tod in יִדְּמוּ לִשְׁאוֹל
  choice: im Totenreich sollen sie verstummen
  alternative: schweigend sollen sie ins Totenreich hinabgehen
  rationale: Die Hauptfassung verbindet das Verstummen örtlich mit dem Totenreich, legt aber weder Vernichtung noch ewige Strafe in den Text hinein. Die mögliche Richtungslesart der Präposition und die Nuance des Stillseins werden ausdrücklich als Alternativen genannt.
translation_notes:
  register: Moderne, würdige Gebetssprache mit klarer poetischer Parallelität. »Zuschanden werden« ist leicht gehoben, aber allgemein verständlich und bewahrt die Wiederholung des hebräischen Verbs. Der Fußnotenmarker steht unmittelbar nach der mehrdeutigen Schlussaussage.
