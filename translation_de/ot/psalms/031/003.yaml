  text: כִּֽי סַלְעִ֣/י וּ/מְצוּדָתִ֣/י אָ֑תָּה וּ/לְמַ֥עַן שִׁ֝מְ/ךָ֗ תַּֽנְחֵ֥/נִי וּֽ/תְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: de
  text: Denn[a] du bist mein Fels und meine Festung[b]; um deines Namens willen wirst du mich führen und leiten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weil du mein Fels und meine Festung bist“. Das hebräische כִּי kann einen Grund oder eine Erläuterung einleiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Bergfeste“ beziehungsweise „meine Zuflucht“. Gemeint ist ein befestigter, sicherer Ort.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch als Bitte möglich: „Führe und leite mich.“ Die beiden hebräischen Verben sind bedeutungsnah; „führen“ und „leiten“ bewahren ihren poetischen Parallelismus.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier den Grund für die vorausgehende Bitte ein. „Denn“ verbindet Bekenntnis und Gebet im Deutschen natürlich; auch „weil“ ist grammatisch möglich.
- source_word: סַלְעִי
  choice: mein Fels
  rationale: סֶלַע bezeichnet einen Felsen oder eine Felsklippe und dient hier als Bild für sicheren Schutz. „Mein Fels“ bewahrt das konkrete, im Psalter vertraute Bild.
- source_word: מְצוּדָתִי
  choice: meine Festung
  rationale: Das Wort bezeichnet einen befestigten, sicheren Zufluchtsort. „Festung“ ist im modernen Deutsch anschaulich und passt zum Schutzbild des Felsens.
- source_word: אָתָּה
  choice: du bist
  rationale: Das selbstständige Pronomen hebt das angesprochene „du“ hervor; die im Hebräischen unausgesprochene Kopula muss im Deutschen ergänzt werden.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: um deines Namens willen
  rationale: Die feste Wendung bewahrt den Bezug auf Gottes Namen, der für seinen offenbarten Charakter, seine Ehre und Verlässlichkeit steht, ohne diese Bedeutungsfülle in der Übersetzung einzuengen.
- source_word: תַּנְחֵנִי
  choice: wirst du mich führen
  rationale: Das Hifil von נחה bedeutet „führen“ oder „geleiten“. Die Imperfektform wird im Gebetszusammenhang als zuversichtliche Erwartung wiedergegeben.
- source_word: וּתְנַהֲלֵנִי
  choice: und leiten
  rationale: נהל bezeichnet fürsorgliches Führen oder Leiten. „Leiten“ unterscheidet den Ausdruck vom parallelen „führen“, ohne die gewollte Bedeutungsnähe aufzulösen.
theological_decisions:
- issue: Bedeutung von „um deines Namens willen“
  choice: Gottes Handeln wird in seinem eigenen Namen, also seinem offenbarten Charakter, seiner Ehre und Verlässlichkeit, begründet.
  alternative: Die Wendung ausschließlich auf Gottes Ruf vor anderen Menschen zu beziehen.
  rationale: Die hebräische Rede vom „Namen“ hat eine größere Bedeutungsweite als bloße öffentliche Reputation. Die idiomatische Formulierung bleibt daher erhalten und wird nicht einengend ausgedeutet.
- issue: Aussageweise der Imperfektformen תַּנְחֵנִי und וּתְנַהֲלֵנִי
  choice: 'Zuversichtliche Erwartung: „du wirst mich führen und leiten“'
  alternative: 'Bitte oder Aufforderung: „führe und leite mich“'
  rationale: Die Formen können im Gebetskontext sowohl als vertrauensvolle Erwartung als auch mit auffordernder Färbung verstanden werden. Der Haupttext folgt dem Bekenntnis „du bist“ als Ausdruck der Zuversicht; die andere sachlich mögliche Lesart wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertrauten Schutzbilder „Fels“ und „Festung“ sowie die biblische Wendung „um deines Namens willen“ bleiben erhalten. Die Satzstellung ist natürlich deutsch und hebt durch „du bist“ zugleich die persönliche Anrede hervor.
