  source_fidelity: 'Der Text gibt die hebräische Struktur und die zentralen Aussagen zuverlässig wieder: בְּךָ als bei-dir-Zuflucht, das Perfekt חָסִיתִי, die dringliche negative Bitte אַל אֵבוֹשָׁה לְעוֹלָם sowie den Imperativ פַלְּטֵנִי. „Zuschanden werden“ trifft den über bloßes Schamempfinden hinausgehenden Sinn des öffentlichen Beschämtwerdens bzw. Scheiterns. Die offene Präpositionalbeziehung in בְּצִדְקָתְךָ bleibt in „In deiner Gerechtigkeit“ erhalten.'
