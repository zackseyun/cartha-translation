id: PSA.31.1
reference: Psalms 31:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/ךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל אֵב֣וֹשָׁה לְ/עוֹלָ֑ם בְּ/צִדְקָתְ/ךָ֥ פַלְּטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: de
  text: Bei dir, Jahwe, habe ich Zuflucht gesucht. Lass mich niemals zuschanden werden! In deiner Gerechtigkeit[a] rette mich!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Durch dein gerechtes Handeln.'
    reason: Die Verbindung בְּצִדְקָתְךָ kann sowohl auf den Bereich beziehungsweise Grund als auch auf das Mittel der Rettung hinweisen; צְדָקָה kann hier konkret Gottes gerechtes Handeln bezeichnen.
lexical_decisions:
- source_word: בְּךָ
  choice: Bei dir
  rationale: Das deutsche „bei dir“ bewahrt die räumliche Zufluchtsmetaphorik und verbindet sich natürlich mit „Zuflucht suchen“. „In dir“ wäre formnäher, klingt hier im Deutschen jedoch unidiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift des Tetragramms.
- source_word: חָסִיתִי
  choice: habe ich Zuflucht gesucht
  rationale: Das Perfekt bezeichnet eine vollzogene beziehungsweise feststehende Hinwendung zu Gott. „Zuflucht gesucht“ erhält das konkrete Schutzbild des hebräischen Verbs.
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  choice: Lass mich niemals zuschanden werden
  rationale: Die Formulierung gibt die flehentliche Verneinung wieder. „Zuschanden werden“ bezeichnet hier nicht nur ein inneres Schamgefühl, sondern das öffentliche Scheitern der Hoffnung.
- source_word: בְּצִדְקָתְךָ
  choice: In deiner Gerechtigkeit
  rationale: Die Wiedergabe bewahrt die Weite von צְדָקָה als Gottes rechtes, verlässliches Handeln. Die Präposition bleibt bewusst offen für den Gedanken des Grundes oder Mittels der Rettung.
- source_word: פַלְּטֵנִי
  choice: rette mich
  rationale: Der Piel-Imperativ bittet um aktives Befreien aus Gefahr. „Rette mich“ ist im heutigen Deutsch klar, knapp und dem Gebetsstil angemessen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. Die Umschrift bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsweite von צְדָקָה beim rettenden Handeln Gottes
  choice: Gerechtigkeit
  alternative: Recht / gerechtes Handeln
  rationale: „Gerechtigkeit“ erhält die lexikalische und theologische Breite. Im Zusammenhang kann zugleich Gottes rechtsschaffendes beziehungsweise rettendes Handeln gemeint sein; diese Spannung wird nicht auf einen einzigen engeren Sinn festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Bitten werden mit Ausrufezeichen als dringliches Gebet gestaltet; traditionelle, heute aber noch verständliche Psalmensprache bleibt auf „zuschanden werden“ beschränkt.
