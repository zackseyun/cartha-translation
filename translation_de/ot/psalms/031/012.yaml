source:
  edition: WLC
  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: de
  text: Ich bin vergessen wie ein Toter, aus dem Sinn; ich bin geworden wie ein verlorenes Gefäß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein Gefäß, das zugrunde geht« oder »wie ein zerbrochenes, unbrauchbares Gefäß«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: Ich bin vergessen
  rationale: Das Nifal Perfekt bezeichnet den gegenwärtigen Zustand des Beters als eines Vergessenen; das deutsche Präsens gibt diesen Ergebniszustand natürlich wieder.
- source_word: כְּמֵת
  choice: wie ein Toter
  rationale: Die Vergleichspartikel כ und das singularische מֵת werden genau und im Deutschen natürlich wiedergegeben.
- source_word: מִלֵּב
  choice: aus dem Sinn
  rationale: Wörtlich heißt der Ausdruck »aus dem Herzen«; לֵב bezeichnet hier jedoch den inneren Bereich des Denkens und Erinnerns. »Aus dem Sinn« bewahrt das hebräische Bild eines aus dem Gedächtnis Verschwundenen.
- source_word: הָיִיתִי
  choice: ich bin geworden
  rationale: Das Qal Perfekt beschreibt einen eingetretenen Zustand; »bin geworden« lässt sowohl den Übergang als auch dessen gegenwärtiges Ergebnis erkennen.
- source_word: כִּכְלִי
  choice: wie ein Gefäß
  rationale: כְּלִי kann allgemein einen Gegenstand, ein Gerät oder ein Gefäß bezeichnen. Im vorliegenden poetischen Vergleich ist »Gefäß« eine etablierte, anschauliche Wiedergabe, ohne das Material oder die genaue Art festzulegen.
- source_word: אֹבֵד
  choice: verlorenes
  rationale: Das Partizip von אבד kann »verloren«, »zugrunde gehend« oder »unbrauchbar/ruiniert« bedeuten. »Verlorenes Gefäß« bewahrt die knappe Formulierung und die lexikalische Mehrdeutigkeit besser als eine eindeutige Festlegung auf Zerstörung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die parallele Bildfolge und die knappe Syntax des Hebräischen bleiben erhalten. »Aus dem Sinn« gibt die hebräische Erinnerungssprache idiomatisch wieder; die Fußnote hält die Mehrdeutigkeit von אֹבֵד offen.
