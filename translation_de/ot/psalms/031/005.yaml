id: PSA.31.5
reference: Psalms 31:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: de
  text: In deine Hand lege ich meinen Geist; du hast mich erlöst, Jahwe, Gott der Wahrheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „treuer Gott“. Das hebräische Wort kann Wahrheit, Verlässlichkeit oder Treue bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: in deine Hand
  rationale: Die Präposition בְּ bezeichnet hier in Verbindung mit dem Anvertrauen die Richtung beziehungsweise Übergabe in Gottes Obhut. Der Singular „Hand“ entspricht dem Hebräischen.
- source_word: אַפְקִיד
  choice: lege ich
  rationale: Der Hifil von פקד bedeutet hier, etwas der Obhut eines anderen anzuvertrauen. „In deine Hand lege ich“ gibt diesen Sinn natürlich und würdevoll wieder, ohne das heute leicht missverständliche „befehlen“ zu verwenden.
- source_word: רוּחִי
  choice: meinen Geist
  rationale: רוּחַ kann Geist, Atem oder Lebenshauch bedeuten. Im Gebetskontext bezeichnet es das persönliche Leben beziehungsweise Selbst, das Gott anvertraut wird; „Geist“ bewahrt zugleich die theologische Tragweite.
- source_word: פָּדִיתָה
  choice: du hast mich erlöst
  rationale: פדה bezeichnet das Loskaufen oder Befreien. Das deutsche Perfekt drückt die vollendete Tat mit gegenwärtiger Bedeutung natürlich aus; „erlöst“ bewahrt die heilsgeschichtliche Resonanz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵל אֱמֶת
  choice: Gott der Wahrheit
  rationale: Die Konstruktverbindung wird formal transparent wiedergegeben. אֱמֶת umfasst Wahrheit, Verlässlichkeit und Treue; die kontextuell mögliche Wiedergabe „treuer Gott“ wird deshalb in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Bundesnamen. Die Transliteration bewahrt den Charakter als persönlichen Namen.
- issue: Bedeutungsbreite von אֱמֶת in אֵל אֱמֶת
  choice: Gott der Wahrheit
  alternative: treuer Gott
  rationale: Das hebräische Substantiv kann sowohl Wahrheit als auch Verlässlichkeit und Treue ausdrücken. Die Hauptfassung bleibt strukturell nah am Hebräischen; die Fußnote erhält die wichtige personale Nuance der Treue.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die vertraute Wendung „In deine Hand“ bleibt erhalten; das altertümlich oder missverständlich wirkende „befehle“ wird durch „lege“ ersetzt.
