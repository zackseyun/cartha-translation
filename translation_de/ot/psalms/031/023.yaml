  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: de
  text: Liebt den HERRN, all seine Getreuen![a] Der HERR behütet die Treuen und vergilt dem, der hochmütig handelt, reichlich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „all seine Heiligen“, „all seine Frommen“ oder „ihr alle, die ihr ihm treu seid“. Das hebräische Wort bezeichnet Menschen, deren Beziehung zum HERRN von Treue und loyaler Verbundenheit geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „vergilt er in vollem Maß“ oder „vergilt er im Übermaß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: Liebt
  rationale: Der Qal-Imperativ im Plural richtet einen unmittelbaren Aufruf an die versammelte Gemeinschaft. „Liebt“ gibt ihn knapp und natürlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Der Gottesname wird nach der üblichen deutschsprachigen Bibelkonvention mit „der HERR“ wiedergegeben.
- source_word: כָּל־חֲסִידָיו
  choice: all seine Getreuen
  rationale: חסיד bezeichnet Menschen, die durch loyale, fromme Verbundenheit mit Gott geprägt sind. „Getreue“ bewahrt den Beziehungs- und Loyalitätsaspekt, ohne spätere kirchliche Bedeutungen von „Heilige“ in den Vordergrund zu stellen.
- source_word: אֱמוּנִים
  choice: die Treuen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet zuverlässige beziehungsweise treue Menschen. „Die Treuen“ ist im Deutschen prägnant und nimmt zugleich den Gedanken des vorangehenden חֲסִידָיו auf.
- source_word: נֹצֵר
  choice: behütet
  rationale: נצר bedeutet sorgfältig bewahren oder schützen. „Behütet“ passt zum Zusammenhang göttlichen Schutzes und klingt zugleich natürlich und würdig.
- source_word: וּמְשַׁלֵּם
  choice: vergilt
  rationale: Die Piel-Form von שלם bezeichnet hier erwidernde Vergeltung. „Vergilt“ lässt den gerichtlichen Sinn erkennen, ohne ihn über den hebräischen Wortlaut hinaus auszudeuten.
- source_word: עַל־יֶתֶר
  choice: reichlich
  rationale: Die Wendung verstärkt das Maß der Vergeltung und kann Fülle oder Übermaß ausdrücken. „Reichlich“ erhält diese Intensivierung, während eine Fußnote die mögliche Wiedergabe „in vollem Maß“ nennt.
- source_word: עֹשֵׂה גַאֲוָה
  choice: dem, der hochmütig handelt
  rationale: Wörtlich steht „einer, der Hochmut tut“. Die gewählte Formulierung gibt das tätige, erkennbare Verhalten idiomatisch wieder.
theological_decisions:
- issue: Bundesbezogene Bezeichnung חֲסִידָיו
  choice: all seine Getreuen
  alternative: all seine Heiligen; all seine Frommen; ihr alle, die ihr ihm treu seid
  rationale: Die Wiedergabe betont die loyale Beziehung zu Gott und vermeidet es, den Ausdruck ausschließlich als kultischen oder späteren kirchlichen Statusbegriff zu verstehen.
- issue: Göttliche Bewahrung und Vergeltung
  choice: Der HERR behütet die Treuen, doch dem, der hochmütig handelt, vergilt er reichlich.
  alternative: Der HERR bewahrt die Treuen und vergilt dem Hochmütigen in vollem Maß.
  rationale: Das „doch“ macht den im Vers angelegten Gegensatz deutlich, ohne die Spannung zwischen Schutz für die Treuen und Gericht über hochmütiges Handeln abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Der direkte Aufruf und der Gegensatz zwischen Bewahrung und Vergeltung bleiben klar; traditionelle, potenziell missverständliche Fachsprache wird im Haupttext vermieden.
