id: PSA.31.19
reference: Psalms 31:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: de
  text: Wie groß ist deine Güte, die du für diejenigen aufbewahrt hast, die dich fürchten, und die du denen erwiesen hast, die bei dir Zuflucht suchen, vor den Menschen[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor den Menschensöhnen“; gemeint sind Menschen allgemein.'
    reason: Die Fußnote dokumentiert die konkrete hebräische Ausdrucksweise hinter der idiomatischen Übersetzung.
lexical_decisions:
- source_word: מָה רַב
  choice: Wie groß
  rationale: Das exklamative מָה mit רַב drückt staunend das große Ausmaß aus; „Wie groß“ ist im Deutschen natürlich und würdevoll.
- source_word: טוּבְךָ
  choice: deine Güte
  rationale: טוּב kann Güte, Gutes oder Wohltat bezeichnen. „Güte“ bewahrt sowohl die Wesenseigenschaft als auch ihre wohltätige Auswirkung.
- source_word: צָפַנְתָּ
  choice: du ... aufbewahrt hast
  rationale: Das Verb bezeichnet das Verwahren oder Bereithalten. „Aufbewahrt“ erhält das Bild einer für die Gottesfürchtigen bereitliegenden Güte.
- source_word: לִירֵאֶיךָ
  choice: für die, die dich fürchten
  rationale: Die Form bezeichnet Menschen, deren Haltung von Gottesfurcht geprägt ist. „Dich fürchten“ bewahrt den biblischen Ausdruck samt seiner Spannung zwischen Ehrfurcht und Furcht.
- source_word: פָּעַלְתָּ
  choice: du ... erwiesen hast
  rationale: פעל bezeichnet das Wirken oder Vollbringen. Im Zusammenhang mit Gottes Güte gibt „erwiesen“ die konkrete, öffentlich vollbrachte Wohltat in natürlichem Deutsch wieder.
- source_word: לַחֹסִים בָּךְ
  choice: denen ..., die bei dir Zuflucht suchen
  rationale: חסה bezeichnet konkret das Suchen von Schutz. Die Formulierung erhält das Zufluchtsbild, statt es auf abstraktes Vertrauen zu reduzieren.
- source_word: נֶגֶד
  choice: vor
  rationale: נֶגֶד bezeichnet hier öffentliche Sichtbarkeit bzw. ein Geschehen angesichts anderer.
- source_word: בְּנֵי אָדָם
  choice: den Menschen
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne des Menschen/Adams“, fungiert aber als Sammelbezeichnung für Menschen allgemein. Natürliches Deutsch gibt diesen konventionellen Sinn mit „den Menschen“ wieder.
theological_decisions:
- issue: Bedeutungsumfang der Gottesfurcht in לִירֵאֶיךָ
  choice: die dich fürchten
  alternative: die dich verehren
  rationale: Die wörtlichere Form wahrt die theologische Spannung des hebräischen Begriffs und beschränkt ihn nicht stillschweigend auf Ehrfurcht.
- issue: Bezug von נֶגֶד בְּנֵי אָדָם
  choice: vor den Menschen mit dem Erweisen der Güte verbunden
  alternative: vor den Menschen mit dem Zufluchtsuchen verbunden
  rationale: Die Wortstellung lässt einen gewissen Bezugsspielraum. Sinn und poetischer Parallelismus sprechen dafür, Gottes öffentlich erwiesene Güte hervorzuheben; die deutsche Stellung lässt zugleich die Nähe zum Zufluchtsuchen noch erkennen.
- issue: Anthropologische Wendung בְּנֵי אָדָם
  choice: den Menschen
  alternative: den Menschensöhnen
  rationale: Die Wendung bezeichnet Menschen im Allgemeinen. „Menschensöhne“ wäre formnäher, im modernen Deutschen jedoch ungewöhnlich und könnte fälschlich nur männliche Personen nahelegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetisch-würdigem Ton. Die Ausrufestruktur des hebräischen Verses wird beibehalten; konkrete biblische Bilder wie Gottesfurcht und Zuflucht bleiben erhalten.
