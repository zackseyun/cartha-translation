- from: Wie groß ist deine Güte, die du für die aufbewahrt hast, die dich fürchten, und die du vor den Menschen[a] denen erwiesen hast, die bei dir Zuflucht suchen!
  to: Wie groß ist deine Güte, die du für diejenigen aufbewahrt hast, die dich fürchten, und die du denen erwiesen hast, die bei dir Zuflucht suchen, vor den Menschen[a]!
  rationale: Die Revision beseitigt die schwer verständliche Wortstellung und ersetzt die doppelte Konstruktion „für die, die“ durch das idiomatischere „für diejenigen, die“. Die Stellung von „vor den Menschen“ macht deutlich, dass Gottes Güte öffentlich erwiesen wird. Die Fußnote wird näher an der hebräischen Wendung formuliert.
