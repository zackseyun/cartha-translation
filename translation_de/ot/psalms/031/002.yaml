  text: הַטֵּ֤ה אֵלַ֨/י אָזְנְ/ךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥/נִי הֱיֵ֤ה לִ֨/י לְֽ/צוּר מָ֭עוֹז לְ/בֵ֥ית מְצוּד֗וֹת לְ/הוֹשִׁיעֵֽ/נִי׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: de
  text: Neige dein Ohr zu mir, rette mich schnell! Sei mir ein schützender Fels[a], ein befestigtes Haus[b], um mich zu retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein starker Fels« oder »ein Fels der Zuflucht«. Das Hebräische verbindet das Bild des Felsens mit einem Ausdruck für starken Schutz oder eine Zuflucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Festung« oder »ein Haus der Festungen«. Das Hebräische bewahrt das Bild eines Hauses und beschreibt es zugleich als stark befestigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: Neige dein Ohr zu mir
  rationale: Die konkrete hebräische Metapher des geneigten Ohrs bleibt erhalten und bezeichnet Gottes aufmerksames Hören.
- source_word: מְהֵרָה הַצִּילֵנִי
  choice: rette mich schnell
  rationale: מְהֵרָה vermittelt die Dringlichkeit, während נצל die Befreiung aus unmittelbarer Gefahr bezeichnet.
- source_word: הֱיֵה לִי
  choice: Sei mir
  rationale: Die knappe Dativkonstruktion wird in natürlichem, zugleich würdigem Deutsch bewahrt.
- source_word: לְצוּר מָעוֹז
  choice: ein schützender Fels
  rationale: צוּר bezeichnet den Fels; מָעוֹז fügt den Gedanken starken Schutzes beziehungsweise einer Zuflucht hinzu. Die Wiedergabe bewahrt beide Bildkomponenten.
- source_word: לְבֵית מְצוּדוֹת
  choice: ein befestigtes Haus
  rationale: Die Hausmetapher von בֵּית bleibt erhalten; מְצוּדוֹת beschreibt starke Befestigungen beziehungsweise Festungen.
- source_word: לְהוֹשִׁיעֵנִי
  choice: um mich zu retten
  rationale: Der Infinitiv drückt Zweck oder Ziel aus. Die Wiederholung von „retten“ klingt im Deutschen natürlich und gibt die parallelen hebräischen Rettungsbegriffe wieder.
