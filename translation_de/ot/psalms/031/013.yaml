  text: כִּ֤י שָׁמַ֨עְתִּי דִּבַּ֥ת רַבִּים֮ מָג֪וֹר מִ/סָּ֫בִ֥יב בְּ/הִוָּסְדָ֣/ם יַ֣חַד עָלַ֑/י לָ/קַ֖חַת נַפְשִׁ֣/י זָמָֽמוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: de
  text: Denn ich habe das üble Gerede vieler gehört – Schrecken ringsum! –, als sie sich gemeinsam gegen mich verschworen und planten, mir das Leben zu nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Seele zu nehmen“. Das hebräische נֶפֶשׁ kann hier das Leben oder die Person selbst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die Bedrängnis des Beters ein, ohne die Nuance unnötig festzulegen.
- source_word: שָׁמַעְתִּי
  choice: ich habe … gehört
  rationale: Das Perfekt bezeichnet hier ein Hören, dessen Wirkung in der geschilderten Lage gegenwärtig ist; das deutsche Perfekt klingt zugleich natürlich und unmittelbar.
- source_word: דִּבַּת רַבִּים
  choice: das üble Gerede vieler
  rationale: דִּבָּה kann Gerücht, Getuschel oder verleumderische Rede bezeichnen. „Übles Gerede“ bewahrt die negative Bedeutung und lässt die genaue Form der feindseligen Rede offen.
- source_word: מָגוֹר מִסָּבִיב
  choice: Schrecken ringsum
  rationale: Gibt die knappe hebräische Wendung für allseits umgebende Bedrohung prägnant und idiomatisch wieder.
- source_word: בְּהִוָּסְדָם יַחַד
  choice: als sie sich gemeinsam … verschworen
  rationale: Die Form bezeichnet gemeinsames Beraten oder Sich-Zusammentun; im feindlichen Kontext bringt „verschworen“ die konspirative Absicht natürlich zum Ausdruck.
- source_word: עָלַי
  choice: gegen mich
  rationale: Der Kontext verlangt die adversative Bedeutung der Präposition.
- source_word: לָקַחַת נַפְשִׁי
  choice: mir das Leben zu nehmen
  rationale: נֶפֶשׁ bezeichnet hier das Leben beziehungsweise die Person des Beters, nicht eine abstrakte, vom Körper getrennte Seele.
- source_word: זָמָמוּ
  choice: planten
  rationale: Das Verb bezeichnet überlegtes, feindseliges Vorhaben. „Planten“ erhält die Absichtlichkeit und vermeidet eine unnötig freie Zuspitzung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf „Schrecken ringsum!“ bleibt als eingeschobene, verdichtete Wahrnehmung erhalten. Die negative, aber lexikalisch nicht völlig eindeutige Bedeutung von דִּבָּה wird mit „übles Gerede“ wiedergegeben.
