id: PSA.31.21
reference: Psalms 31:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: de
  text: Gepriesen sei Jahwe, denn er hat mir seine treue Liebe auf wunderbare Weise erwiesen in einer belagerten Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer befestigten Stadt“. Der hebräische Ausdruck kann sowohl eine belagerte als auch eine befestigte Stadt bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die passive Partizipialform steht hier als doxologischer Ausruf. „Gepriesen sei“ gibt diesen Segens- und Lobcharakter in würdigem, natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für den vorausgehenden Lobpreis ein.
- source_word: הִפְלִיא
  choice: auf wunderbare Weise erwiesen
  rationale: Der Hifil von פלא bezeichnet ein außergewöhnliches, staunenswertes Handeln. Zusammen mit חֶסֶד ist „auf wunderbare Weise erwiesen“ im Deutschen idiomatisch.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד umfasst beständige, loyale Güte und Liebe. „Treue Liebe“ bewahrt diesen Beziehungs- und Verlässlichkeitsaspekt ohne konfessionelle Zuspitzung.
- source_word: לִי
  choice: mir
  rationale: Die Präposition bezeichnet den persönlichen Empfänger der erwiesenen Liebe.
- source_word: בְּעִיר מָצוֹר
  choice: in einer belagerten Stadt
  rationale: מָצוֹר kann Belagerung, Befestigung oder einen befestigten Ort bezeichnen. „In einer belagerten Stadt“ passt zum Gefahren- und Rettungskontext, während die ebenfalls mögliche Bedeutung „befestigte Stadt“ in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird transparent als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בְּעִיר מָצוֹר
  choice: in einer belagerten Stadt
  alternative: in einer befestigten Stadt
  rationale: Die Wendung ist lexikalisch mehrdeutig. Der Haupttext wählt die im Kontext von Bedrängnis naheliegende Bedeutung; die andere echte Möglichkeit wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der doxologische Ton bleibt erhalten; die Mehrdeutigkeit der Schlusswendung wird nicht stillschweigend beseitigt.
