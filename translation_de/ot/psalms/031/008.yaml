id: PSA.31.8
reference: Psalms 31:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֣א הִ֭סְגַּרְתַּ/נִי בְּ/יַד אוֹיֵ֑ב הֶֽעֱמַ֖דְתָּ בַ/מֶּרְחָ֣ב רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/008.yaml
  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: de
  text: Und du hast mich nicht in die Hand des Feindes ausgeliefert[a]; du hast meine Füße auf weiten Raum gestellt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht in die Gewalt des Feindes gegeben“.'
    reason: lexical_alternative
  - marker: b
    text: Der „weite Raum“ ist ein Bild für Freiheit, Sicherheit und Befreiung aus Enge oder Bedrängnis.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: hast mich nicht … ausgeliefert
  rationale: Der Hifil von סגר bezeichnet hier die Übergabe in fremde Gewalt. „Ausgeliefert“ ist im Deutschen natürlich und gibt die feindliche Verfügungsmacht klar wieder.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die konkrete hebräische Wendung wird bewahrt; „in die Hand“ bezeichnet zugleich bildhaft die Gewalt oder Macht des Feindes.
- source_word: אוֹיֵב
  choice: des Feindes
  rationale: Der artikellose Singular kann hier generisch verstanden werden. „Des Feindes“ entspricht dem gehobenen, aber allgemein verständlichen Psalmstil.
- source_word: הֶעֱמַדְתָּ
  choice: hast … gestellt
  rationale: Der Hifil von עמד bedeutet „zum Stehen bringen“ beziehungsweise „hinstellen“. „Gestellt“ bewahrt das Bild eines sicheren Standorts.
- source_word: בַמֶּרְחָב
  choice: auf weiten Raum
  rationale: מֶרְחָב bezeichnet einen weiten, offenen Bereich im Gegensatz zu Bedrängnis und Enge. Die idiomatische deutsche Wendung bewahrt dieses räumliche Bild.
- source_word: רַגְלָי
  choice: meine Füße
  rationale: Der hebräische Plural wird direkt wiedergegeben und unterstreicht sicheren Stand sowie Bewegungsfreiheit.
- source_word: וְלֹא
  choice: Und … nicht
  rationale: „Und“ bildet die einfache Verknüpfung mit dem vorausgehenden Vers formal und natürlich ab.
theological_decisions: []
