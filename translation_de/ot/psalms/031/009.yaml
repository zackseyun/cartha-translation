base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: de
  text: Sei mir gnädig, Jahwe, denn ich bin in Bedrängnis! Mein Auge ist vor Kummer[a] schwach geworden, ebenso meine Seele[b] und mein Bauch[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Verdruss“, „vor Gram“ oder „vor Kränkung“.'
    reason: lexical_alternative
  - marker: b
    text: „Meine Seele“ kann auch „mein Leben“ oder „ich selbst“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort bedeutet wörtlich „mein Bauch“; es kann auch die inneren Körperteile oder das Innere des Menschen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sei mir gnädig
  rationale: Der Imperativ von חנן bittet um Gunst und gnädige Zuwendung. Die Formulierung ist im Deutschen natürlich und bewahrt den Charakter einer eindringlichen Bitte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Umschrift.
- source_word: כִּי צַר לִי
  choice: denn ich bin in Bedrängnis
  rationale: כִּי leitet die Begründung der Bitte ein; צַר לִי bezeichnet persönliche Enge oder Not und wird idiomatisch als Zustand der Bedrängnis ausgedrückt.
- source_word: עָשְׁשָׁה
  choice: ist dahingeschwunden
  rationale: Das Verb bezeichnet Schwinden, Verfallen oder Schwachwerden. „Dahingeschwunden“ vermittelt den fortschreitenden körperlichen und inneren Verfall des Klagegebets.
- source_word: בְכַעַס
  choice: vor Kummer
  rationale: כעס kann Ärger, Verdruss, Kränkung oder Kummer bezeichnen. Im Zusammenhang des Klagepsalms passt „Kummer“, ohne die mögliche Bedeutung „Verdruss“ auszuschließen.
- source_word: עֵינִי
  choice: mein Auge
  rationale: Der hebräische Singular wird bewahrt und entspricht der poetischen Redeweise des Psalms.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש kann Seele, Leben oder das eigene Selbst bezeichnen. „Seele“ bewahrt hier die anthropologische Weite und den poetischen Gegensatz zu Auge und Innerstem.
- source_word: וּבִטְנִי
  choice: und mein Innerstes
  rationale: בטן bezeichnet wörtlich den Bauch, kann aber auch die inneren Körperteile oder das Innere eines Menschen meinen. „Innerstes“ ist im deutschen Klagegebet natürlich; die konkrete Körpermetapher wird in der Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt den persönlichen Gottesnamen. Die Umschrift „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: meine Seele
  alternative: mein Leben; ich selbst
  rationale: Die Übersetzung lässt die begriffliche Spannung von נפש bestehen und legt den Ausdruck weder ausschließlich immateriell noch ausschließlich biologisch aus.
- issue: Bildsprache von בטן
  choice: mein Innerstes
  alternative: mein Bauch; mein Leib
  rationale: Der Ausdruck wird als körperlich-innerliche Bezeichnung verstanden, ohne die konkrete Grundbedeutung zu verbergen; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die direkte Anrede und der poetische Singular „mein Auge“ bleiben erhalten. „Dahingeschwunden“ trägt den Klagecharakter, ohne altertümliche Satzformen zu verwenden.
