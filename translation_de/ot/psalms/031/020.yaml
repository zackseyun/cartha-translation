id: PSA.31.20
reference: Psalms 31:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: de
  text: Du verbirgst sie im Schutz deiner Gegenwart vor den Anschlägen der Menschen[a]; du birgst sie in einer Hütte vor dem Streit der Zungen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den Verschwörungen der Menschen“ beziehungsweise „vor ihren Machenschaften“. Das zugrunde liegende hebräische Wort ist selten und in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: „Streit der Zungen“ meint feindseliges, anklagendes oder verleumderisches Reden.
    reason: idiom_explanation
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: du verbirgst sie
  rationale: Das Hifil von סתר bezeichnet das Verbergen beziehungsweise geschützte Verstecken; „verbirgst“ ist natürlich und bewahrt Gottes aktives Schutzhandeln.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: im Schutz deiner Gegenwart
  rationale: סֵתֶר bezeichnet einen verborgenen Ort oder Schutzraum; פָּנִים heißt wörtlich „Angesicht“, kann aber die persönliche Gegenwart bezeichnen. Die Wiedergabe verbindet Schutz und Nähe.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: vor den Anschlägen der Menschen
  rationale: רֻכְסֵי ist selten und semantisch unsicher; im Parallelismus liegt die Bedeutung feindlicher Machenschaften, Zusammenschlüsse oder Angriffe nahe. Der kollektive deutsche Plural gibt das repräsentative אִישׁ idiomatisch wieder, ohne die Unsicherheit zu verschweigen.
- source_word: תִּצְפְּנֵם
  choice: du birgst sie
  rationale: צפן bedeutet verbergen, verwahren oder aufbewahren. „Bergen“ vermeidet eine bloße Wiederholung und bringt zugleich verborgenes Bewahren zum Ausdruck.
- source_word: בְּסֻכָּה
  choice: in einer Hütte
  rationale: סֻכָּה bezeichnet konkret eine Hütte oder Laube, die hier als Schutzraum dient. Die konkrete Bildsprache bleibt erhalten.
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: vor dem Streit der Zungen
  rationale: רִיב bezeichnet Streit oder Auseinandersetzung; לְשֹׁנוֹת heißt wörtlich „Zungen“ und steht bildhaft für feindseliges oder verleumderisches Reden.
theological_decisions:
- issue: Wiedergabe von אִישׁ
  choice: der Menschen
  alternative: des Mannes / eines Menschen
  rationale: Der maskuline Singular ist hier wahrscheinlich generisch beziehungsweise kollektiv. Im Deutschen bezeichnet „der Menschen“ die menschlichen Gegner natürlich, ohne eine ausschließlich männliche Gruppe festzulegen.
- issue: פָּנֶיךָ als Angesicht oder Gegenwart
  choice: deiner Gegenwart
  alternative: deines Angesichts
  rationale: Die Schutzwirkung geht von Gottes persönlicher Nähe aus. „Gegenwart“ gibt den idiomatischen Sinn wieder; die wörtliche Bildform wird in der Fußnote genannt, ohne eine besondere dogmatische Deutung einzutragen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit erhaltener poetischer Bildlichkeit. „Gegenwart“ erläutert idiomatisch das wörtliche „Angesicht“; „Hütte“ und „Zungen“ bewahren die konkreten hebräischen Bilder.
