base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: de
  text: Denn mein Leben ist in Kummer zerronnen und meine Jahre in Seufzen; wegen meiner Schuld hat meine Kraft versagt[a], und meine Knochen sind schwach geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das hebräische Verb auch „strauchelt“ oder „wankt“ bedeuten; hier wird es bildlich von der Kraft gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Klage ein und bewahrt den kausalen Zusammenhang.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: mein Leben schwindet dahin vor Kummer
  rationale: כלה bezeichnet ein Zu-Ende-Gehen, Aufgezehrtwerden oder Schwinden. Die fortdauernde Formulierung gibt die beklagte Erschöpfung im natürlichen deutschen Ausdruck wieder; יגון wird als tiefer Kummer verstanden.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: und meine Jahre unter Seufzen
  rationale: Bewahrt den poetischen Parallelismus und gibt אֲנָחָה als wiederholtes Seufzen beziehungsweise Stöhnen wieder.
- source_word: כָּשַׁל ... כֹחִי
  choice: meine Kraft versagt
  rationale: Das Verb bedeutet wörtlich stolpern, straucheln oder wanken, bezeichnet hier aber bildlich das Nachlassen der Kraft. „Versagt“ ist im Deutschen klar und natürlich; die Bildlichkeit wird in einer Fußnote kenntlich gemacht.
- source_word: בַּעֲוֺנִי
  choice: wegen meiner Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folge bezeichnen. „Schuld“ erhält die moralische Dimension, ohne die mögliche Bedeutungsbreite endgültig festzulegen.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: und meine Knochen verfallen
  rationale: Die konkrete Körpermetapher der Knochen bleibt erhalten; עשׁשׁ beschreibt Verfall, Auszehrung oder Schwachwerden.
theological_decisions:
- issue: Bedeutungsbreite von עָוֹן in der Selbstbeschreibung des Beters
  choice: Schuld
  alternative: Vergehen; Schuldfolge
  rationale: Der hebräische Ausdruck kann sowohl die begangene Verfehlung als auch die daraus erwachsende Schuld oder deren Folgen bezeichnen. Der Haupttext wahrt den moralischen Bezug, während die Fußnote die theologische Spannung offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Der Parallelismus der beiden ersten Satzglieder und die körperliche Bildsprache des Hebräischen bleiben erhalten.
