lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Bezeichnung meint in Psalmüberschriften wahrscheinlich den Leiter der musikalischen Aufführung. „Chorleiter“ ist knapp, geläufig und wahrt den liturgisch-musikalischen Zusammenhang; die Präposition ל wird mit „für“ wiedergegeben.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Bezeichnung für ein vermutlich instrumental begleitetes Lied; „Psalm“ ist im Deutschen die natürliche und traditionsgemäße Entsprechung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv gibt die Zuordnung zu David natürlich wieder, ohne sie im Haupttext ausdrücklich auf Verfasserschaft, Widmung oder Zugehörigkeit festzulegen.
theological_decisions:
- issue: Bedeutungsumfang der davidischen Überschrift
  choice: Davids
  alternative: von David; für David
  rationale: Das hebräische לְ kann in Psalmüberschriften Verfasserschaft, Zugehörigkeit oder Widmung ausdrücken. Der Genitiv „Davids“ bewahrt diese Mehrdeutigkeit besser als eine eindeutige Festlegung.
translation_notes:
  register: Moderne, knappe und würdevolle Psalmüberschrift. Der Fußnotenmarker steht unmittelbar bei „Davids“, da sich die Anmerkung auf לְדָוִד bezieht.
