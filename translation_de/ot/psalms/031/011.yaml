base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: de
  text: Wegen all meiner Feinde bin ich zum Gespött geworden[a], ganz besonders für meine Nachbarn, und zum Schrecken für meine Bekannten. Die mich auf der Straße sehen[b], fliehen vor mir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von all meinen Feinden bin ich zum Gespött geworden.“ Manche verstehen den Anfang vergleichend: „Mehr als alle meine Feinde bin ich zum Gespött geworden.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „draußen“; gemeint ist hier die Begegnung in der Öffentlichkeit.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „gehen mir aus dem Weg“ beziehungsweise „entfernen sich von mir“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: Wegen all meiner Feinde
  rationale: מִן kann hier Ursache oder Ausgangspunkt bezeichnen. „Wegen“ gibt den im Zusammenhang wahrscheinlichsten kausalen Sinn natürlich wieder; die mögliche Ausgangs- oder Vergleichsbedeutung bleibt in der Fußnote erhalten.
- source_word: הָיִיתִי חֶרְפָּה
  choice: bin ich zum Gespött geworden
  rationale: היה mit einem Substantiv beschreibt einen eingetretenen, fortwirkenden Zustand. „Zum Gespött geworden“ ist modernes, verständliches Deutsch und bewahrt den Gedanken, zum Gegenstand von Schmach und Spott geworden zu sein.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: ganz besonders für meine Nachbarn
  rationale: מְאֹד verstärkt hier, wie stark die Schmach gerade im Verhältnis zu den Nachbarn empfunden wird. „Ganz besonders“ gibt diese Hervorhebung idiomatisch wieder.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: und zum Schrecken für meine Bekannten
  rationale: פַחַד bezeichnet Furcht oder Schrecken; מְיֻדָּעַי meint bekannte oder vertraute Personen, ohne zwingend enge Freunde zu bezeichnen.
- source_word: רֹאַי בַּחוּץ
  choice: Die mich auf der Straße sehen
  rationale: Der Ausdruck bedeutet wörtlich „die mich draußen sehen“. „Auf der Straße“ verdeutlicht den öffentlichen Raum, in dem andere ihm begegnen.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: fliehen vor mir
  rationale: נָדַד kann fliehen, fortziehen oder sich entfernen bedeuten. Im Zusammenhang der öffentlichen Ausgrenzung bringt „fliehen“ die starke, unmittelbare Abwendung zum Ausdruck. Das deutsche Präsens stellt das beschriebene, fortdauernde Erleben anschaulich dar.
