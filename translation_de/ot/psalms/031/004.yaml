  text: תּוֹצִיאֵ֗/נִי מֵ/רֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑/י כִּֽי אַ֝תָּה מָֽעוּזִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: de
  text: Führe mich aus dem Netz heraus, das sie für mich verborgen haben[a], denn du bist meine Festung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „das sie heimlich für mich ausgelegt haben“. Das Hebräische spricht von einem verborgenen Netz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: Führe mich … heraus
  rationale: Der Hifil von יצא bezeichnet das Veranlassen des Herausgehens. „Führe mich … heraus“ bewahrt den kausativen Sinn und klingt im Deutschen natürlich.
- source_word: מֵרֶשֶׁת
  choice: aus dem Netz
  rationale: רֶשֶׁת bezeichnet wörtlich ein Netz, das hier als Falle dient. „Netz“ erhält das konkrete Bild, statt es durch das allgemeinere „Falle“ zu ersetzen.
- source_word: זוּ
  choice: das
  rationale: זוּ kann hier relativisch auf das Netz bezogen werden. Die Wiedergabe als Relativsatz ist im Deutschen klar und bewahrt die syntaktische Mehrdeutigkeit besser als ein unnötig betontes „dieses“.
- source_word: טָמְנוּ לִי
  choice: das sie heimlich für mich ausgelegt haben
  rationale: טמן bedeutet verbergen oder verstecken. Bei einem Netz gibt „heimlich … ausgelegt“ die verdeckte, feindliche Handlung idiomatisch wieder; die wörtlichere Fassung wird in der Fußnote genannt.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet die Bitte mit dem Vertrauen auf Gottes Schutz. „Denn“ ist im heutigen gehobenen Deutsch natürlich und wahrt den begründenden Zusammenhang.
- source_word: מָעוּזִּי
  choice: meine Schutzburg
  rationale: מָעוֹז bezeichnet einen Ort oder eine Quelle der Stärke und des Schutzes. „Schutzburg“ erhält sowohl den Schutzgedanken als auch das befestigte Bild.
theological_decisions:
- issue: Schutzmetapher für Gott
  choice: du bist meine Schutzburg
  alternative: du bist meine Zuflucht / meine Festung
  rationale: Die Aussage beschreibt Gott bildhaft als schützende Stärke. „Schutzburg“ bewahrt die räumliche und wehrhafte Metapher, ohne sie zu einer engeren dogmatischen Aussage auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache des Netzes und der Schutzburg bleibt erhalten; die ungewöhnliche wörtliche Verbindung von „verbergen“ mit einem Netz wird im Haupttext idiomatisch und in der Fußnote formal wiedergegeben.
