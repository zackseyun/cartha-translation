source:
  edition: WLC
  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: de
  text: Ich hasse die, die sich an nichtige Götzen halten[a]; ich aber vertraue auf Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die nichtige Trugbilder beachten“; wörtlicher: „die leere Nichtigkeiten bewahren/beachten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Ich hasse
  rationale: Das Qal-Perfekt in der 1. Person Singular bezeichnet hier im poetischen Zusammenhang eine gefestigte, gegenwärtige Haltung; das deutsche Präsens gibt dies natürlich wieder.
- source_word: הַשֹּׁמְרִים
  choice: die sich an … halten
  rationale: שׁמר bedeutet grundsätzlich „bewahren, beachten, hüten“. Mit הַבְלֵי שָׁוְא als Objekt bezeichnet es hier eine beständige Hinwendung oder Bindung; „sich an … halten“ wahrt diese Bedeutung, ohne sie auf bloßes Bewachen zu verengen.
- source_word: הַבְלֵי שָׁוְא
  choice: nichtige Götzen
  rationale: Die Verbindung bezeichnet wörtlich etwas wie „Nichtigkeiten der Falschheit“ und trägt die Bedeutungen Leere, Wertlosigkeit und Trug. Im Gegensatz zum Vertrauen auf Jahwe liegt der Bezug auf falsche Kult- oder Vertrauensobjekte nahe; „Götzen“ macht diesen Bezug verständlich, während „nichtig“ die Bildsprache bewahrt.
- source_word: וַאֲנִי
  choice: ich aber
  rationale: Konjunktion und betontes Pronomen markieren einen deutlichen Gegensatz zu den zuvor genannten Menschen. „Ich aber“ ist im Deutschen knapp und idiomatisch.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: vertraue auf Jahwe
  rationale: Obwohl אֶל grundsätzlich „zu, auf … hin“ bedeutet, verlangt vertrauen im Deutschen idiomatisch „auf“. Das Perfekt drückt hier eine gefestigte gegenwärtige Zuversicht aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bezug von הַבְלֵי שָׁוְא
  choice: „nichtige Götzen“ im Haupttext
  alternative: „nichtige Trugbilder“, „leere Nichtigkeiten“ oder „trügerische Nichtigkeiten“
  rationale: Die hebräische Wendung bleibt semantisch weiter als das deutsche „Götzen“ und kann abstrakter verstanden werden. Der Zusammenhang stellt sie jedoch als falsche Gegenstände der Bindung dem Vertrauen auf Jahwe gegenüber. Die Fußnote hält die genuine lexikalische Offenheit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ich aber“ bildet den knappen hebräischen Kontrast nach; „sich an … halten“ ist verständlich und lässt sowohl Beachtung als auch Bindung anklingen.
