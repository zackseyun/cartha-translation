  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: de
  text: 'Ich aber vertraue auf dich, Jahwe; ich spreche: »Du bist mein Gott.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich aber habe auf dich vertraut, Jahwe; ich habe gesagt: ›Du bist mein Gott.‹« Die hebräischen Verbformen können vergangenheits- beziehungsweise perfektbezogen verstanden werden; im Haupttext stehen sie als gegenwärtige Aussagen fortdauernden Vertrauens und Bekennens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Doch ich
  rationale: Die Konjunktion mit dem ausdrücklich gesetzten Pronomen kennzeichnet einen betonten Gegensatz. »Doch ich« gibt diesen in natürlichem, dichterischem Deutsch wieder.
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: ich vertraue auf dich
  rationale: בטח mit על bezeichnet das vertrauensvolle Sichverlassen auf jemanden. Das Präsens gibt hier die fortdauernde Haltung des Beters wieder, während die mögliche Vergangenheits- bzw. Perfektbedeutung in der Fußnote erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָמַרְתִּי
  choice: ich sage
  rationale: Im poetischen Parallelismus mit »ich vertraue« ist die Form als gegenwärtiges Bekenntnis verständlich. Die ebenfalls mögliche Wiedergabe als Perfekt wird in der Fußnote genannt.
- source_word: אֱלֹהַי אָתָּה
  choice: Du bist mein Gott
  rationale: Das ausdrücklich gesetzte Pronomen אָתָּה trägt Nachdruck; die deutsche Wortstellung bewahrt diesen als direktes persönliches Bekenntnis.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« bewahrt ihn, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Zeitbezug der beiden Qatal-Formen בָטַחְתִּי und אָמַרְתִּי
  choice: 'gegenwärtige Aussagen: »ich vertraue« und »ich sage«'
  alternative: »ich habe vertraut« und »ich habe gesagt«
  rationale: Der unmittelbare Gebetszusammenhang lässt die Formen als gegenwärtige, fortdauernde Vertrauenshaltung und als aktuelles Bekenntnis verstehen. Da die Formen auch vergangenheits- oder perfektbezogen gelesen werden können, bleibt diese Möglichkeit ausdrücklich in der Fußnote stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. »Doch ich« wahrt den betonten Gegensatz, ohne die im Deutschen schwerfälligere Formulierung »Was aber mich betrifft« zu verwenden.
