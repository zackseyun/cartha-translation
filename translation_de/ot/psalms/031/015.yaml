source:
  edition: WLC
  text: בְּ/יָדְ/ךָ֥ עִתֹּתָ֑/י הַצִּ֘ילֵ֤/נִי מִ/יַּד א֝וֹיְבַ֗/י וּ/מֵ/רֹדְפָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/015.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: de
  text: Meine Zeiten liegen in deiner Hand[a]; rette mich aus der Hand meiner Feinde und meiner Verfolger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Lebenszeiten“ oder „meine Lebensumstände“. Das hebräische „meine Zeiten“ kann allgemein die Abschnitte und Ereignisse des Lebens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: in deiner Hand
  rationale: Die konkrete Hand-Metapher bleibt erhalten und bildet den beabsichtigten Gegensatz zu „aus der Hand meiner Feinde“.
- source_word: עִתֹּתָי
  choice: meine Zeiten
  rationale: Die offene poetische Bedeutung umfasst Lebenszeiten, Lebensabschnitte und wechselnde Lebensumstände, ohne sie auf Schicksal oder festgesetzte Termine zu verengen.
- source_word: הַצִּילֵנִי
  choice: rette mich
  rationale: Die Formulierung bezeichnet hier konkrete Befreiung aus unmittelbarer Gefahr und ist im modernen Deutsch klar und natürlich.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die Wiedergabe bewahrt das hebräische Bild von Macht und Gewalt sowie die poetische Entsprechung zur ersten Vershälfte.
- source_word: אֹיְבַי
  choice: meiner Feinde
  rationale: Direkte und geläufige Wiedergabe für die feindlichen Gegner des Beters.
- source_word: וּמֵרֹדְפָי
  choice: und meiner Verfolger
  rationale: Das Partizip bezeichnet diejenigen, die dem Beter nachsetzen. „Verfolger“ erhält dieses konkrete Bild knapp und verständlich.
theological_decisions:
- issue: Bedeutungsumfang von „meine Zeiten“
  choice: Breiter Bezug auf die Lebenszeiten, Lebensabschnitte und Umstände des Beters in Gottes Hand
  alternative: mein Schicksal; ausschließlich meine festgesetzten Zeiten
  rationale: Das Hebräische bleibt poetisch weit. Die Übersetzung bewahrt diese Offenheit und legt den Vers weder auf einen strengen Schicksalsbegriff noch auf einzelne festgesetzte Zeitpunkte fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Meine Zeiten“ bewahrt bewusst die poetische Weite des Hebräischen; „liegen in deiner Hand“ ist im Deutschen natürlich und erhält zugleich das zentrale Bild. Die Ergänzung „aus der Hand“ gilt grammatisch sowohl für die Feinde als auch für die Verfolger.
