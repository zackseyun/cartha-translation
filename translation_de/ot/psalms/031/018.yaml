  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: de
  text: Verstummen sollen die Lügenlippen, die vermessen gegen den Gerechten reden, in Hochmut und Verachtung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zum Schweigen gebracht werden sollen die Lügenlippen“. Das hebräische Verb kann sowohl das Verstummen als auch das Zum-Schweigen-Bringen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: Verstummen sollen
  rationale: Der Nifal-Imperfekt kann hier als Wunsch beziehungsweise Aufforderung verstanden werden. Die deutsche Voranstellung gibt diese jussive Kraft natürlich wieder, ohne eindeutig zwischen „verstummen“ und „zum Schweigen gebracht werden“ zu entscheiden.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: die Lügenlippen
  rationale: Die Konstruktion bedeutet wörtlich „Lippen der Lüge/Falschheit“. „Lügenlippen“ ist knapp, idiomatisch und bewahrt das konkrete Bild.
- source_word: הַדֹּבְרוֹת
  choice: die ... reden
  rationale: Das feminine Pluralpartizip bezieht sich auf „Lippen“ und wird im Deutschen natürlich durch einen Relativsatz wiedergegeben.
- source_word: עַל צַדִּיק
  choice: gegen den Gerechten
  rationale: Der substantivierte Singular צַדִּיק bezeichnet hier die gerechte Person als Ziel des feindseligen Redens; „den Gerechten“ erhält den repräsentativen Singular.
- source_word: עָתָק
  choice: frech
  rationale: Das Substantiv bezeichnet anmaßende, vermessene oder unverschämte Rede. Die adverbiale Wiedergabe „frech reden“ unterscheidet diesen Zug sprachlich von גַאֲוָה, dem ausdrücklich genannten Hochmut.
- source_word: בְּגַאֲוָה
  choice: voller Hochmut
  rationale: Die Präposition בְּ kennzeichnet die Art oder Haltung des Redens. „Voller Hochmut“ ist im Deutschen natürlich und gibt die stolze Überheblichkeit deutlich wieder.
- source_word: וָבוּז
  choice: und Verachtung
  rationale: בּוּז bezeichnet Verachtung, Geringschätzung oder Hohn. „Verachtung“ passt zur nominalen Reihung und bewahrt die starke moralische Wertung.
theological_decisions:
- issue: Identität des צַדִּיק
  choice: „der Gerechte“ bleibt als repräsentativer oder konkreter Singular offen
  alternative: „ein Gerechter“ oder ausdrücklich auf den Psalmisten bezogene Wiedergabe
  rationale: Der hebräische Text bestimmt nicht abschließend, ob eine einzelne gerechte Person, der Psalmist selbst oder der Gerechte als Typus gemeint ist. Die Übersetzung soll diese Offenheit nicht dogmatisch festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lügenlippen“ erhält die poetische Körpermetapher; „frech“ gibt die anmaßende Rede prägnant wieder und vermeidet eine unnötige Wiederholung von „Hochmut“.
