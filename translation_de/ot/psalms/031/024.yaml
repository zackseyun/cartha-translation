  terminology: „Jahwe“ gibt יהוה konsistent als Eigenname wieder. „Herz“ bewahrt das biblisch-poetische Bild für Mut und innere Festigkeit. Die Fußnote zu „harren/hoffen“ ist sachlich richtig und deutlich als lexikalische Alternative markiert.
