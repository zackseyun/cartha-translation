id: PSA.31.24
reference: Psalms 31:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: de
  text: Seid stark, und euer Herz fasse Mut, ihr alle, die ihr auf Jahwe harrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr alle, die ihr auf Jahwe hofft“. Das hebräische Partizip kann sowohl erwartungsvolles Warten als auch Hoffen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Seid stark
  rationale: Der Qal-Imperativ im Plural fordert die Angesprochenen unmittelbar zur Stärke auf; die knappe Formulierung bewahrt den imperativischen Nachdruck.
- source_word: וְיַאֲמֵץ
  choice: und euer Herz fasse Mut
  rationale: Der Hifil-Imperfekt steht nach dem Imperativ in aufforderndem, jussivischem Sinn. „Fasse Mut“ gibt die Stärkung beziehungsweise Festigung des Herzens natürlich wieder, ohne die Formulierung „seid stark“ bloß zu wiederholen.
- source_word: לְבַבְכֶם
  choice: euer Herz
  rationale: לֵבָב bezeichnet hier das innere Zentrum von Entschlossenheit, Willen und Mut. „Herz“ erhält das poetische Bild und ist im Deutschen verständlich.
- source_word: כָּל
  choice: ihr alle
  rationale: Der Quantor bezieht die abschließend bezeichnete Gruppe vollständig in die Aufforderung ein.
- source_word: הַמְיַחֲלִים
  choice: die ihr ... harrt
  rationale: Das Partizip von יחל verbindet erwartungsvolles Warten mit Hoffnung. „Harren“ bewahrt beide Nuancen in knapper, würdiger Psalmsprache; die geläufigere Alternative „hoffen“ wird in der Fußnote genannt.
- source_word: לַיהוָה
  choice: auf Jahwe
  rationale: Die Präposition ל bezeichnet bei יחל denjenigen, auf den sich das erwartungsvolle Warten richtet. „Auf Jahwe harren“ ist eine natürliche deutsche Verbindung und gibt den Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von יחל
  choice: harren
  alternative: hoffen
  rationale: Das Verb kann sowohl erwartungsvolles Warten als auch Hoffen ausdrücken. „Harren“ hält diese Spannung im Haupttext offen; die Alternative wird in der Fußnote sichtbar gemacht.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Harren“ ist gegenüber der Alltagssprache leicht gehoben, trägt hier aber die doppelte Bedeutung von Warten und Hoffen prägnant; Satzbau und Anrede bleiben klar und gut verständlich.
