id: PSA.31.22
reference: Psalms 31:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: de
  text: 'Ich aber sagte in meiner Bestürzung[a]: »Ich bin deinen Augen entzogen[b].« Doch du hast mein Flehen gehört, als ich zu dir um Hilfe schrie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in meiner Hast«. Das hebräische Wort kann Hast, Unruhe oder panische Bestürzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »abgeschnitten von vor deinen Augen«; sinngemäß: »deinem Blick entzogen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: in meiner Bestürzung
  rationale: Das Wort kann Hast, innere Unruhe oder panische Erregung bezeichnen. Im Zusammenhang der Klage steht der erschrockene Gemütszustand im Vordergrund; »Bestürzung« gibt ihn in natürlichem Deutsch wieder, ohne die mögliche Bedeutung »Hast« auszuschließen.
- source_word: נִגְרַזְתִּי
  choice: ich bin … entzogen
  rationale: Die Niphal-Form von גזר bezeichnet hier ein Abgeschnitten- oder Entferntsein. »Entzogen« verbindet sich im Deutschen natürlich mit dem folgenden Bild der Augen und bewahrt die passive Aussage.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: deinen Augen entzogen
  rationale: Die hebräische Wendung lautet bildhaft »von vor deinen Augen«. Die Übersetzung erhält das konkrete Augenmotiv und bezeichnet die empfundene Entfernung aus Gottes Blickfeld, ohne sie ausdrücklich als Verwerfung zu deuten.
- source_word: אָכֵן
  choice: Doch
  rationale: Hier hebt das Wort den starken Gegensatz zwischen der erschrockenen Einschätzung des Beters und Gottes tatsächlichem Hören hervor.
- source_word: קוֹל תַּחֲנוּנַי
  choice: mein Flehen
  rationale: Wörtlich steht »die Stimme/der Laut meiner Gnadengesuche«. »Mein Flehen« gibt den hörbaren Hilferuf knapp und idiomatisch wieder; das Hören im Satz bewahrt den akustischen Zusammenhang.
- source_word: בְּשַׁוְּעִי
  choice: als ich … um Hilfe schrie
  rationale: Das Verb bezeichnet ein dringendes Schreien um Hilfe. Die deutsche Wendung macht diese im Verb enthaltene Zielrichtung ausdrücklich und natürlich wieder.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition bezeichnet die Ausrichtung des Hilferufs auf Gott; »zu dir« gibt sie unmittelbar wieder.
theological_decisions:
- issue: Empfundene Gottesferne gegenüber tatsächlichem göttlichem Hören
  choice: 'Die Aussage des Beters bleibt als subjektive, erschrockene Wahrnehmung stehen: »Ich bin deinen Augen entzogen.« Darauf folgt kontrastierend Gottes tatsächliches Hören.'
  alternative: 'Deutender: »Ich dachte, du hättest mich verworfen.«'
  rationale: Der hebräische Text spricht bildhaft vom Entferntsein vor Gottes Augen, nicht ausdrücklich von göttlicher Verwerfung. Die Übersetzung bewahrt daher die Spannung zwischen menschlicher Wahrnehmung und Gottes Antwort.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede und das konkrete Bild der Augen bleiben erhalten; »Flehen« ist gehoben, aber allgemein verständlich. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar bei der betreffenden Wendung.
