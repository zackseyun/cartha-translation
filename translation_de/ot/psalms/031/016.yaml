  yaml_path: translation/ot/psalms/031/016.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: de
  text: Lass dein Angesicht über deinem Diener leuchten; rette mich durch deine beständige Liebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deiner beständigen Liebe“ oder „nach deiner beständigen Liebe“. Die hebräische Präposition kann hier in mehreren eng verwandten Bedeutungen verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: Lass … leuchten
  rationale: Der Hifil-Imperativ von אור ist kausativ. Die deutsche Wendung bewahrt die Bitte und klingt in Verbindung mit „Angesicht“ natürlich und würdevoll.
- source_word: פָנֶיךָ
  choice: dein Angesicht
  rationale: Die konkrete hebräische Bildsprache für Gottes wohlwollende Zuwendung bleibt erhalten; „Angesicht“ passt hier besser zum gehobenen Gebetsregister als „Gesicht“.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet hier die Ausrichtung göttlicher Gunst auf den Diener. „Über deinem Diener“ bewahrt die räumliche Bildsprache und ist im Deutschen idiomatisch.
- source_word: עַבְדֶּךָ
  choice: deinem Diener
  rationale: Im Gebet bezeichnet עבד die Beziehung des Beters zu Gott. „Diener“ gibt dies angemessen wieder, ohne hier nicht hervorgehobene Assoziationen der Sklaverei einzutragen.
- source_word: הוֹשִׁיעֵנִי
  choice: rette mich
  rationale: Der Imperativ von ישׁע bittet um Rettung aus Bedrängnis. „Rette mich“ ist im modernen Deutsch direkt und bewahrt zugleich die umfassendere theologische Resonanz.
- source_word: בְחַסְדֶּךָ
  choice: in deiner beständigen Liebe
  rationale: חסד bezeichnet Gottes verlässliche, loyale Liebe. Das Präfix ב wird im Haupttext möglichst formnah mit „in“ wiedergegeben; instrumentales „durch“ und maßgebendes „nach“ bleiben mögliche Deutungen.
theological_decisions:
- issue: Wiedergabe von חסד
  choice: beständige Liebe
  alternative: Gnade; Güte; Bundestreue
  rationale: „Beständige Liebe“ verbindet Zuneigung mit Verlässlichkeit und bewahrt so die theologische Spannung des Begriffs, ohne ihn auf bloßes Erbarmen oder einen technischen Bundesbegriff zu verengen.
- issue: Sinn der Präposition ב in בְחַסְדֶּךָ
  choice: in deiner beständigen Liebe
  alternative: durch deine beständige Liebe; nach deiner beständigen Liebe
  rationale: Die hebräische Präposition lässt hier eng verwandte lokale beziehungsweise sphärische, instrumentale und maßgebende Nuancen zu. Der Haupttext hält sich an die Form, während die Fußnote die echte Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. „Angesicht“ erhält die traditionelle biblische Bildsprache, ohne den Satz unnötig zu archaisieren.
