lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Bezeichnung meint in den Psalmüberschriften wahrscheinlich den Leiter der musikalischen Aufführung. „Chorleiter“ ist knapp, verständlich und gibt das vorangestellte לְ mit „für“ wieder.
- source_word: לְדָוִד
  choice: Von David
  rationale: Das לְ kann hier Urheberschaft, Zugehörigkeit oder Widmung bezeichnen. „Von David“ ist im Deutschen natürlich, bleibt jedoch erläuterungsbedürftig, da die hebräische Form semantisch weiter ist.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung für einen musikalisch vorgetragenen Psalm; „Ein Psalm“ ist die etablierte und klare deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung der davidischen Überschrift
  choice: „Von David“ mit Fußnote zur Bedeutungsbreite
  alternative: „Für David“ oder „David zugehörig“
  rationale: Die Überschrift zwingt nicht zu einer ausschließlichen Festlegung auf direkte Verfasserschaft. Die Fußnote bewahrt die im Hebräischen mögliche Zuordnung, Widmung oder Autorschaft.
translation_notes:
  register: Moderne, würdige Standardsprache; die knappe Form einer Psalmüberschrift bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
