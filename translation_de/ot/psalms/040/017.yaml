source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: de
  text: Ich aber bin arm und bedürftig; der Herr denkt an mich.[a] Du bist meine Hilfe und mein Retter. Mein Gott, zögere nicht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Herr achtet auf mich“; auch: „Der Herr wird an mich denken.“'
    reason: Das hebräische יַחֲשָׁב לִי kann sowohl das Denken an jemanden als auch dessen Beachtung ausdrücken; zudem ist der Zeitbezug der Verbform nicht eindeutig festgelegt.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das waw zusammen mit dem selbstständigen Pronomen hebt den Sprecher im Kontrast zum vorherigen Zusammenhang hervor; „Ich aber“ gibt dies im Deutschen natürlich wieder.
- source_word: עָנִי וְאֶבְיוֹן
  choice: arm und bedürftig
  rationale: Die beiden einander überlappenden Begriffe bezeichnen eine niedrige, bedrängte und hilfsbedürftige Lage; die feste deutsche Wortverbindung wahrt beide Aspekte.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Im Hebräischen steht der göttliche Titel Adonaj, nicht das Tetragramm; daher wird er als „der Herr“ wiedergegeben.
- source_word: יַחֲשָׁב לִי
  choice: denkt an mich
  rationale: חשב mit ל kann hier an jemanden denken beziehungsweise ihn beachten bedeuten. Die Formulierung bewahrt den persönlichen Bezug und legt weder Tempus noch Vorsehungsplanung stärker fest als der Ausgangstext.
- source_word: עֶזְרָתִי
  choice: meine Hilfe
  rationale: Das Substantiv bezeichnet Hilfe oder Beistand; „meine Hilfe“ erhält die knappe poetische Aussage.
- source_word: וּמְפַלְטִי
  choice: und mein Retter
  rationale: Die substantivisch gebrauchte Form bezeichnet den, der rettet oder in Sicherheit bringt; „Retter“ ist würdig, verständlich und prägnant.
- source_word: אֱלֹהַי אַל תְּאַחַר
  choice: Mein Gott, zögere nicht!
  rationale: Die direkte Anrede und das Verbot mit אַל drücken eine dringliche Bitte um unverzügliches Eingreifen aus.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: der Herr
  alternative: mein Herr
  rationale: Der masoretische Text bietet Adonaj als Gottesbezeichnung, ohne ein Possessivsuffix. „Der Herr“ unterscheidet den Titel sachgerecht vom Gottesnamen JHWH.
- issue: Bedeutung und Zeitbezug von יַחֲשָׁב לִי
  choice: der Herr denkt an mich
  alternative: der Herr achtet auf mich / der Herr wird an mich denken
  rationale: Das hebräische Imperfekt und die Wendung erlauben eine gegenwärtige, zukünftige oder modal gefärbte Aussage. Der Haupttext gibt den naheliegenden relationalen Sinn wieder; die Fußnote bewahrt die echte Bedeutungs- und Tempusoffenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Der abschließende Ausruf wahrt die Dringlichkeit des Gebets; altertümliche Wörter wie „harren“ oder „säumen“ werden vermieden.
