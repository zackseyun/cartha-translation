base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: de
  text: Deinen Willen zu tun, mein Gott, macht mir Freude, und deine Weisung[a] ist in meinem Innersten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesetz“. Das hebräische Wort Tora kann Gottes Unterweisung umfassender bezeichnen, nicht nur einzelne Rechtsvorschriften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: zu tun
  rationale: Der Infinitiv mit ל bezeichnet hier den Inhalt dessen, woran der Sprecher Freude hat. „Zu tun“ ist direkt und im Deutschen natürlich.
- source_word: רְצוֹנְךָ
  choice: deinen Willen
  rationale: רָצוֹן kann Willen, Wohlgefallen oder Wunsch bezeichnen. Zusammen mit „tun“ gibt „deinen Willen“ die Aussage idiomatisch und ohne unnötige Einengung wieder.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Form mit Suffix der ersten Person Singular bezeichnet die persönliche Anrede „mein Gott“.
- source_word: חָפָצְתִּי
  choice: macht mir Freude
  rationale: חפץ bezeichnet Gefallen, Freude oder Verlangen. Die Formulierung gibt die freudige innere Bereitschaft natürlich wieder; das hebräische Perfekt beschreibt hier die feste Haltung des Sprechers.
- source_word: וְתוֹרָתְךָ
  choice: und deine Weisung
  rationale: תּוֹרָה bezeichnet göttliche Unterweisung und kann je nach Zusammenhang auch mit „Gesetz“ wiedergegeben werden. „Weisung“ bewahrt hier die umfassendere Bedeutung und passt zur Verinnerlichung.
- source_word: בְּתוֹךְ
  choice: in
  rationale: Die Wendung bezeichnet eine Lage im Inneren; zusammen mit „meinem Innersten“ ergibt sich eine knappe, natürliche deutsche Formulierung.
- source_word: מֵעָי
  choice: meinem Innersten
  rationale: מֵעֶה meint wörtlich die Eingeweide, wird aber auch für das tiefe Innere des Menschen gebraucht. „Mein Innerstes“ wahrt dieses Bildfeld, ohne missverständliche anatomische Sprache zu verwenden.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im Zusammenhang innerlich angeeigneter Gottesoffenbarung
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ bildet den breiten Sinn von תּוֹרָה als Gottes Lehre und Wegweisung ab. „Gesetz“ bleibt wegen seiner bundestheologischen und schriftbezogenen Resonanz eine berechtigte Alternative und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt wie im Hebräischen „Deinen Willen zu tun“ hervor. „Macht mir Freude“ ist natürlicher als das steifere „daran habe ich Gefallen“; „in meinem Innersten tragen“ gibt die verinnerlichte Weisung verständlich wieder.
