base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: de
  text: Beschämt und gedemütigt sollen alle miteinander werden, die mir nach dem Leben[a] trachten, um es zu vernichten[b]. Zurückweichen und zuschanden werden sollen die, die sich über mein Unglück freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die mein Leben/meine Seele suchen“; נֶפֶשׁ bezeichnet hier das bedrohte Leben beziehungsweise die Person des Beters.'
    reason: lexical_alternative
  - marker: b
    text: Oder „um es hinwegzuraffen“ beziehungsweise „zu vertilgen“. Das hebräische Verb kann das vollständige Beseitigen oder Zu-Ende-Bringen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: Alle miteinander sollen beschämt und gedemütigt werden
  rationale: Die beiden Verben bezeichnen eng verwandte Erfahrungen von Scham und Erniedrigung; „alle miteinander“ gibt יַחַד wieder und bewahrt den gemeinsamen, verwünschenden Aussagecharakter.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: die mir nach dem Leben trachten
  rationale: נֶפֶשׁ meint hier das Leben beziehungsweise die Person des Beters. Die deutsche Wendung drückt die feindliche, tödliche Absicht natürlich und deutlich aus.
- source_word: לִסְפּוֹתָהּ
  choice: um es zu vernichten
  rationale: Das Verb bezeichnet hier das Beseitigen oder Zu-Ende-Bringen; das feminine Suffix verweist am natürlichsten auf נַפְשִׁי zurück. „Vernichten“ wahrt den starken Sinn, ohne ein im Deutschen unnatürliches Bild zu erzwingen.
- source_word: יִסֹּגוּ אָחוֹר
  choice: Zurückweichen
  rationale: Die Verbindung bezeichnet Rückzug oder Zurückweichen. Die knappe Wiedergabe erhält den Parallelismus und den Wunschcharakter.
- source_word: וְיִכָּלְמוּ
  choice: und zuschanden werden
  rationale: כּלם bezeichnet Schande oder Bloßstellung. „Zuschanden werden“ ist würdevoll, verständlich und unterscheidet sich im zweiten Halbvers angemessen von „beschämt und gedemütigt“.
- source_word: חֲפֵצֵי רָעָתִי
  choice: die sich über mein Unglück freuen
  rationale: חפץ kann Gefallen oder Freude bezeichnen, während רעה hier das dem Beter widerfahrende Unheil meint. Die Formulierung vermeidet das Missverständnis, es gehe um seine eigene moralische Bosheit.
