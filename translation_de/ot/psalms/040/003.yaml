source:
  edition: WLC
  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: de
  text: Er legte mir ein neues Lied in den Mund, einen Lobgesang für unseren Gott. Viele werden sehen, sich fürchten[a] und auf Jahwe vertrauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht empfinden“ oder „staunen“. Das hebräische Verb kann Furcht, Ehrfurcht oder ehrfürchtiges Staunen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּפִי
  choice: Er legte mir … in den Mund
  rationale: נתן bedeutet gewöhnlich „geben“, doch zusammen mit „in meinen Mund“ gibt „legte … in den Mund“ die konkrete hebräische Wendung natürlich wieder.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: Direkte und idiomatische Wiedergabe der Nominalgruppe; das neue Lied ist die frische Antwort auf Gottes rettendes Handeln.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: einen Lobgesang für unseren Gott
  rationale: Die Wendung steht appositionell zu „ein neues Lied“ und beschreibt es näher. „Lobgesang“ wahrt den Liedbezug und klingt im Deutschen natürlich.
- source_word: יִרְאוּ רַבִּים
  choice: Viele werden es sehen
  rationale: Das Objekt ist im Hebräischen unausgesprochen und ergibt sich aus Gottes Handeln beziehungsweise dessen sichtbarer Wirkung; „es“ ist im Deutschen für einen vollständigen Satz erforderlich, ohne den Bezug enger festzulegen.
- source_word: וְיִירָאוּ
  choice: und sich fürchten
  rationale: ירא kann Furcht, Ehrfurcht oder Staunen bezeichnen. „Sich fürchten“ bewahrt die stärkere Grundbedeutung und die theologische Spannung.
- source_word: וְיִבְטְחוּ בַּיהוָה
  choice: und auf Jahwe vertrauen
  rationale: בטח mit ב wird im Deutschen idiomatisch als „auf jemanden vertrauen“ wiedergegeben; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von וְיִירָאוּ
  choice: sich fürchten
  alternative: Ehrfurcht empfinden / staunen
  rationale: Die stärkere Wiedergabe erhält die mögliche Spannung zwischen Furcht und ehrfürchtigem Staunen; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallele Abfolge „sehen – sich fürchten – vertrauen“ bleibt erhalten; das im Hebräischen nicht ausdrücklich genannte Objekt von „sehen“ wird zurückhaltend mit „es“ ergänzt.
