  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigennamen wieder. „Heil“ ist im psalmischen Register treffend und wird durch die Fußnote sachgerecht erläutert. Die Fußnotenmarker sind korrekt an den jeweils erläuterten Ausdrücken verankert.
