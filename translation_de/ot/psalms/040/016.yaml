source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: de
  text: 'Alle, die dich suchen, sollen sich an dir freuen und jubeln. Alle, die dein Heil[a] lieben, sollen immer sagen: »Groß sei Jahwe!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Rettung« beziehungsweise »deine Befreiung«. Das hebräische Wort kann sowohl konkrete Rettung als auch umfassenderes Heil bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Jahwe werde groß!« Gemeint ist der Wunsch, dass Jahwes Größe offen anerkannt und verkündet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: sollen sich … freuen und jubeln
  rationale: Die beiden Imperfektformen drücken im Gebetszusammenhang einen Wunsch aus. Die zwei deutschen Verben bewahren die poetische Doppelung, ohne sie schwerfällig wörtlich wiederzugeben.
- source_word: בְּךָ
  choice: an dir
  rationale: Bei »sich freuen« gibt »an dir« den Bezug beziehungsweise Grund der Freude natürlich wieder und hält den Gottesbezug im Mittelpunkt.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: Alle, die dich suchen
  rationale: Die substantivierte Partizipialform bezeichnet Menschen, die dadurch gekennzeichnet sind, dass sie Gott suchen.
- source_word: יֹאמְרוּ תָמִיד
  choice: sollen immer sagen
  rationale: Das Imperfekt zusammen mit תָמִיד bezeichnet fortgesetztes oder wiederholtes Sprechen; »immer sagen« ist klar und idiomatisch.
- source_word: יִגְדַּל יְהוָה
  choice: Groß sei Jahwe!
  rationale: Die jussivische Wendung ist ein Wunsch beziehungsweise ein feierlicher Zuruf. »Groß sei Jahwe!« bewahrt diese Aussageform besser als eine bloße Feststellung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: die dein Heil lieben
  rationale: תְּשׁוּעָה umfasst Rettung, Befreiung und Heil. »Heil« ist hier knapp, würdig und lässt sowohl die konkrete als auch die umfassendere Bedeutung offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תְּשׁוּעָה
  choice: Heil
  alternative: Rettung oder Befreiung
  rationale: »Heil« wahrt im Gebets- und Lobkontext sowohl den Gedanken konkreter Rettung als auch die weiter reichende Heilsbedeutung, ohne den Ausdruck einseitig festzulegen.
- issue: Aussageform von יִגְדַּל יְהוָה
  choice: Groß sei Jahwe!
  alternative: Jahwe ist groß!
  rationale: Die Verbform ist hier am besten als Wunsch oder Akklamation zu verstehen. Eine indikativische Übersetzung würde die Spannung zwischen Bekenntnis und Wunsch einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wunschform »sollen« und der feierliche Zuruf »Groß sei Jahwe!« erhalten den Gebets- und Lobcharakter, ohne altertümlich zu wirken.
