id: PSA.40.10
reference: Psalms 40:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: de
  text: Deine Gerechtigkeit habe ich nicht in meinem Herzen verborgen[a]; von deiner Treue und deiner Rettung habe ich gesprochen. Deine beständige Liebe[b] und deine Wahrheit habe ich der großen Versammlung nicht verschwiegen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein gerechtes Handeln“. Das hebräische Wort kann sowohl Gerechtigkeit als Eigenschaft als auch gerechtes Handeln oder Rechtsschaffen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Bundestreue“. Das hebräische Wort bezeichnet liebevolle Güte, die sich als beständige Loyalität erweist.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „vor der großen Versammlung“. Die hebräische Formulierung kann den Menschen gelten, denen nichts verschwiegen wurde, und zugleich den öffentlichen Rahmen der Verkündigung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: deine Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die moralische und gemeinschaftsbezogene Weite von צְדָקָה; je nach Kontext kann das Wort auch Gottes gerechtes Handeln bezeichnen.
- source_word: כִסִּיתִי
  choice: habe ich nicht … verborgen
  rationale: כסה bedeutet wörtlich „bedecken“; zusammen mit „in meinem Herzen“ gibt „verbergen“ den idiomatischen Sinn natürlich wieder.
- source_word: בְּתוֹךְ לִבִּי
  choice: in meinem Herzen
  rationale: Die natürliche deutsche Wendung bewahrt das hebräische Bild des innerlichen Zurückhaltens.
- source_word: אֱמוּנָתְךָ
  choice: deine Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Beständigkeit, nicht menschlichen Glauben.
- source_word: וּתְשׁוּעָתְךָ
  choice: und deine Rettung
  rationale: תְּשׁוּעָה bezeichnet Rettung oder Befreiung; „Rettung“ ist im modernen Deutsch breit verständlich und passt zum göttlichen Eingreifen.
- source_word: אָמָרְתִּי
  choice: habe ich gesprochen
  rationale: Das einfache „ich sagte“ erhält mit den genannten Eigenschaften als Gegenstand im Deutschen idiomatisch die Bedeutung öffentlichen Bekundens.
- source_word: כִחַדְתִּי
  choice: habe ich … nicht verschwiegen
  rationale: כחד kann „verbergen, vorenthalten“ bedeuten. „Verschweigen“ passt zur öffentlichen Verkündigung und unterscheidet das zweite Verb stilistisch vom ersten, ohne den Parallelismus aufzulösen.
- source_word: חַסְדְּךָ
  choice: deine beständige Liebe
  rationale: חֶסֶד verbindet Liebe mit dauerhafter Loyalität und verlässlicher Güte; „beständige Liebe“ vermittelt dies verständlich, ohne den Bundesaspekt enger festzulegen, als der Vers verlangt.
- source_word: וַאֲמִתְּךָ
  choice: und deine Wahrheit
  rationale: אֱמֶת umfasst Wahrheit, Verlässlichkeit und Treue. „Wahrheit“ hält es sprachlich von אֱמוּנָה („Treue“) unterschieden.
- source_word: לְקָהָל רָב
  choice: der großen Versammlung
  rationale: Nach einem Verb des Verbergens kann לְ die Personengruppe bezeichnen, der etwas nicht vorenthalten wird. Der deutsche Dativ ist natürlich; zugleich kann der Zusammenhang eine Verkündigung vor der Versammlung nahelegen.
theological_decisions:
- issue: Unterscheidung der verwandten Gottesattribute אֱמוּנָה und אֱמֶת
  choice: אֱמוּנָה mit „Treue“ und אֱמֶת mit „Wahrheit“ wiedergeben
  alternative: Beide Wörter überlappend mit „Treue“ beziehungsweise „Verlässlichkeit“ wiedergeben
  rationale: Die unterschiedliche Wiedergabe bewahrt die Häufung verwandter, aber nicht identischer Begriffe und verhindert, dass die poetische Aussage auf eine einzige Eigenschaft reduziert wird.
- issue: Bedeutungsweite von חֶסֶד
  choice: beständige Liebe
  alternative: Bundesliebe; Güte; Huld
  rationale: „Beständige Liebe“ lässt sowohl Zuwendung als auch loyale Dauer anklingen, ohne eine bestimmte systematisch-theologische Deutung aufzuzwingen.
- issue: Zeitform der hebräischen Perfektformen
  choice: deutsches Perfekt
  alternative: Präteritum
  rationale: Das Perfekt klingt in gegenwärtigem Standarddeutsch als rückblickendes Zeugnis natürlich und bewahrt die fortwirkende Relevanz der vollzogenen Verkündigung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarem poetischem Parallelismus. „Versammlung“ wahrt den öffentlichen Gemeinschaftsbezug; „beständige Liebe“ ist verständlich und vermeidet archaische Ausdrücke wie „Huld“ oder „Liebesgüte“.
