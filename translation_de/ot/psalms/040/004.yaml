base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: de
  text: Glücklich zu preisen ist der Mann[a], der Jahwe zu seiner Zuversicht gemacht hat[b] und sich weder den Hochmütigen[c] noch denen zugewandt hat, die sich der Lüge zuwenden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. alternativ: „Wohl dem Mann“ oder „Glücklich ist der Mann“. Die männliche Einzahl hat hier exemplarische Bedeutung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „der sein Vertrauen auf Jahwe gesetzt hat“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „den Überheblichen“. Das hebräische Wort ist hier wahrscheinlich kein Eigenname („Rahab“).'
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „denen, die zur Falschheit abirren“. Die hebräische Reihung kann diese Menschen als weitere Gruppe nennen oder sie eng mit den Hochmütigen verbinden.'
    reason: ambiguity
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich zu preisen ist
  rationale: Die hebräische Seligpreisungsformel bezeichnet sowohl erfahrbares Glück als auch einen von Gott begünstigten, nachahmenswerten Zustand. „Glücklich zu preisen“ bewahrt diese Breite besser als ein bloßes „glücklich“ oder das im Deutschen stärker passiv klingende „gesegnet“.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: גֶּבֶר bezeichnet hier einen erwachsenen Mann und steht in der weisheitlichen Seligpreisung zugleich exemplarisch. Die Übersetzung erhält die maskuline Singularform des Ausgangstextes.
- source_word: שָׂם יְהוָה מִבְטַחוֹ
  choice: der Jahwe zu seiner Zuversicht gemacht hat
  rationale: שׂוּם bedeutet „setzen, machen“, מִבְטָח das, worauf man vertraut. Die deutsche Fügung gibt den abgeschlossenen Sinn des Verbs und das Vertrauensverhältnis kompakt wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: פָנָה אֶל
  choice: sich ... zugewandt hat
  rationale: Die Wendung bezeichnet ein Sich-Hinwenden, das hier Aufmerksamkeit, Orientierung und Vertrauen einschließt.
- source_word: רְהָבִים
  choice: den Hochmütigen
  rationale: Der Plural ist im Kontext am besten als Bezeichnung hochmütiger oder überheblicher Menschen zu verstehen, nicht als Eigenname „Rahab“.
- source_word: שָׂטֵי כָזָב
  choice: denen, die zur Lüge abirren
  rationale: Die partizipiale Wendung beschreibt Menschen, die vom rechten Weg abweichen und sich der Unwahrheit zuwenden. „Abirren“ wahrt das Bewegungsbild, ohne den Ausdruck vorschnell als „Abtrünnige“ theologisch zu verengen.
theological_decisions:
- issue: Weisheitliche Seligpreisung und repräsentativer maskuliner Singular
  choice: Glücklich zu preisen ist der Mann
  alternative: Glücklich ist der Mensch; Wohl dem Mann
  rationale: Die Übersetzung erhält sowohl die ausdrückliche maskuline Form גֶּבֶר als auch den exemplarischen Charakter der Aussage. Sie beschränkt die Geltung der Weisheitssentenz nicht ausdrücklich auf Männer.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ macht dies sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von רְהָבִים
  choice: die Hochmütigen
  alternative: die Überheblichen; Rahab
  rationale: Form und Parallelismus sprechen hier für eine Gruppe hochmütiger Menschen. Die mögliche Assoziation des Wortstamms mit „Rahab“ rechtfertigt in diesem Zusammenhang keine Festlegung auf den Eigennamen.
- issue: Bezug von שָׂטֵי כָזָב
  choice: eine zweite, appositionell angeschlossene Beschreibung derselben Zielgruppe
  alternative: 'eine eigenständige zweite Gruppe: „und denen, die zur Lüge abirren“'
  rationale: Die knappe hebräische Reihung lässt offen, ob eine zweite Gruppe hinzutritt oder die Hochmütigen näher beschrieben werden. Die appositionelle deutsche Fassung wahrt die enge Verbindung, ohne eine dogmatische Identifikation zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer gut verständlichen Seligpreisungsformel. Die Satzstruktur bleibt nahe am poetischen Parallelismus, wird aber durch die appositionelle Wiederaufnahme „denen“ im Deutschen lesbar gemacht.
