  variant: modern standard German
source:
  edition: WLC
  text: רַבּ֤וֹת עָשִׂ֨יתָ אַתָּ֤ה יְהוָ֣ה אֱלֹהַ/י֮ נִֽפְלְאֹתֶ֥י/ךָ וּ/מַחְשְׁבֹתֶ֗י/ךָ אֵ֫לֵ֥י/נוּ אֵ֤ין עֲרֹ֬ךְ אֵלֶ֗י/ךָ אַגִּ֥ידָה וַ/אֲדַבֵּ֑רָה עָ֝צְמ֗וּ מִ/סַּפֵּֽר׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: de
  text: 'Vieles hast du getan, Jahwe, mein Gott: deine Wunder und deine Pläne für uns.[a] Nichts kommt dir gleich. Wollte ich davon erzählen und reden – sie sind zu zahlreich, um sie aufzuzählen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Gedanken über uns“; auch: „deine Absichten für uns“.'
    reason: מַחְשָׁבוֹת kann Gedanken, Absichten oder Pläne bezeichnen; die Alternativen bewahren die lexikalische Mehrdeutigkeit.
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: Vieles hast du getan
  rationale: רַבּוֹת bezeichnet die große Zahl der Taten Gottes. „Vieles“ ergänzt im Deutschen das im Hebräischen nur sinngemäß vorhandene Objekt knapp und natürlich.
- source_word: יְהוָה אֱלֹהַי
  choice: Jahwe, mein Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהַי ist die persönliche Anrede „mein Gott“.
- source_word: נִפְלְאֹתֶיךָ
  choice: deine Wunder
  rationale: Das Substantiv bezeichnet staunenswerte, außergewöhnliche Taten Gottes. „Wunder“ bewahrt die knappe substantivische Form.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: und deine Pläne für uns
  rationale: מַחְשָׁבוֹת kann Gedanken, Absichten oder Pläne bezeichnen. Im Zusammenhang mit Gottes Taten bringt „Pläne“ die zielgerichtete Bedeutung idiomatisch zum Ausdruck; die wörtlichere Alternative steht in der Fußnote.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: Nichts kommt dir gleich
  rationale: Die Wendung drückt Unvergleichlichkeit aus. Das neutrale „Nichts“ vermeidet eine unnötige Einschränkung auf Personen und ist im Deutschen natürlich.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: Wollte ich davon erzählen und reden
  rationale: Die Kohortativformen können hier als hypothetischer Ansatz verstanden werden, der zur Feststellung der unüberschaubaren Menge führt. „Davon“ macht den Rückbezug im Deutschen deutlich.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: sie sind zu zahlreich, um sie aufzuzählen
  rationale: עָצְמוּ bezeichnet hier im Zusammenhang mit dem Zählen eine überwältigende Menge. Die Formulierung gibt den Sinn „mehr, als man zählen kann“ natürlich wieder.
theological_decisions:
- issue: Bedeutung von Gottes מַחְשָׁבוֹת gegenüber seinem Volk
  choice: „Pläne für uns“ als Ausdruck zielgerichteter göttlicher Absicht, ohne ein bestimmtes Lehrsystem vorauszusetzen
  alternative: „Gedanken über uns“ beziehungsweise „Gedanken, die uns gelten“
  rationale: Der Vers spricht von Gottes wohlwollender, auf sein Volk gerichteter Absicht, legt aber keine weitergehende Lehre über Vorsehung oder Vorherbestimmung fest. Die Fußnote bewahrt die lexikalische Offenheit.
- issue: Reichweite der Aussage אֵין עֲרֹךְ אֵלֶיךָ
  choice: „Nichts kommt dir gleich“
  alternative: „Niemand ist dir vergleichbar“
  rationale: Das Hebräische formuliert die Unvergleichlichkeit ohne ausdrücklich genanntes personales Subjekt. „Nichts“ hält die Aussage umfassend und vermeidet eine unbelegte Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt direkt und poetisch; der Gedankenstrich bildet den Übergang von der beabsichtigten Verkündigung zur Unmöglichkeit vollständiger Aufzählung ab. Der Fußnotenmarker [a] steht im Haupttext unmittelbar nach der betreffenden Wendung.
