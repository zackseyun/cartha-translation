  source_fidelity: 'Die Übersetzung gibt die hebräische Aussage zuverlässig wieder: Gottes vielfältige Taten, seine Wunder und auf „uns“ gerichteten Pläne, seine Unvergleichlichkeit sowie die Unmöglichkeit, die Fülle davon vollständig darzustellen. „Wollte ich“ gibt den hier gut vertretbaren hypothetisch-protatischen Sinn der Kohortative angemessen wieder.'
