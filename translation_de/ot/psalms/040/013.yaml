base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/013.yaml
  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: de
  text: Jahwe, sei gewillt[a], mich zu retten! Jahwe, eile[b] mir zu Hilfe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Hab Gefallen daran, mich zu retten.“ Oder: „Sei bereit, mich zu retten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Beeile dich, mir zu helfen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: sei gewillt
  rationale: Der Imperativ von רצה bittet Jahwe um wohlwollende Bereitschaft beziehungsweise Zustimmung. „Sei gewillt“ gibt diesen Willensaspekt in verständlichem, würdigem Deutsch wieder, ohne die im Hebräischen mögliche Nuance des Gefallens auszuschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְהַצִּילֵנִי
  choice: mich zu retten
  rationale: Der Hifil-Infinitiv von נצל mit Suffix der ersten Person Singular bezeichnet das Befreien oder Herausreißen aus Gefahr. „Mich zu retten“ ist im heutigen Deutsch natürlich und bewahrt den unmittelbaren Hilferuf.
- source_word: לְעֶזְרָתִי
  choice: mir zu Hilfe
  rationale: Die Wendung bedeutet wörtlich etwa „zu meiner Hilfe“. „Mir zu Hilfe“ erhält die substantivische Ausdrucksweise und ist im Deutschen idiomatisch.
- source_word: חוּשָׁה
  choice: eile
  rationale: Der Imperativ von חושׁ fordert zu unverzüglichem Handeln auf. „Eile“ bewahrt Dringlichkeit und Kürze des hebräischen Gebets.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt zweimal ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Namen wieder; die traditionelle Ersetzung durch „der HERR“ würde ihn durch einen Titel ersetzen.
translation_notes:
  register: Modernes, knappes und zugleich würdevolles Gebetsdeutsch. Die parallele zweimalige Anrede „Jahwe“ und die Dringlichkeit des Schlussimperativs bleiben erhalten.
