source:
  edition: WLC
  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: de
  text: Er zog mich herauf aus der Grube des Getöses[a], aus Schlamm und Morast. Er stellte meine Füße auf einen Felsen und gab meinen Schritten festen Halt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „aus der Grube des Lärms“; manche Übersetzungen deuten die Wendung als „Grube des Verderbens“ oder „öde Grube“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: Er zog mich herauf
  rationale: Die Hifil-Form von עלה bezeichnet hier das Heraufbringen aus einer Tiefe. „Zog mich herauf“ bewahrt das konkrete Bild einer Rettung aus einer Grube und klingt im Deutschen natürlich.
- source_word: מִבּוֹר
  choice: aus der Grube
  rationale: בּוֹר kann eine Grube, Zisterne oder ein verliesartiges Loch bezeichnen. Im poetischen Zusammenhang gibt „Grube“ das Bild treffend und ohne unnötige Festlegung wieder.
- source_word: שָׁאוֹן
  choice: tosenden
  rationale: שָׁאוֹן bezeichnet Lärm, Getöse, Tosen oder Aufruhr. Das attributive „tosenden“ ergibt im Deutschen eine verständliche, bildhafte Wendung, ohne den Ausdruck vorschnell als „Verderben“ zu deuten.
- source_word: מִטִּיט הַיָּוֵן
  choice: aus Schlamm und Morast
  rationale: טִיט und יָוֵן bezeichnen Schlamm, Lehm beziehungsweise morastigen Schlick. Die koordinierte Wiedergabe bewahrt die verstärkende Doppelung, ohne eine unnatürliche deutsche Wortfolge zu erzeugen.
- source_word: וַיָּקֶם עַל־סֶלַע רַגְלַי
  choice: Er stellte meine Füße auf einen Felsen
  rationale: Das Hifil von קום bedeutet „hinstellen, aufrichten, festen Stand geben“. Die konkrete Darstellung von Füßen auf einem Felsen bleibt erhalten.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: und gab meinen Schritten festen Halt
  rationale: כון im Polel bezeichnet das Festmachen oder Sichern; אֲשֻׁרִים sind Schritte beziehungsweise Tritte. Die Formulierung ist idiomatisch und bewahrt das Bild sicherer Bewegung.
theological_decisions:
- issue: Konkrete Rettungsbilder oder abstrakte geistliche Deutung
  choice: Die konkreten Bilder von Grube, Morast, Füßen, Felsen und Schritten bleiben im Haupttext erhalten.
  alternative: Abstraktere Wiedergaben wie „Er rettete mich aus dem Verderben“.
  rationale: Der hebräische Text stellt die Rettung poetisch durch körperlich-räumliche Bilder dar. Eine abstrakte Deutung würde die mögliche geistliche Bedeutung bereits im Wortlaut festlegen.
- issue: Deutung von שָׁאוֹן
  choice: Als hörbares und bewegtes „Tosen“ wiedergegeben.
  alternative: „Verderben“, „Verwüstung“ oder „Öde“.
  rationale: Die Grundbedeutung weist auf Lärm, Getöse oder Aufruhr. Die gewählte Fassung erhält diese lexikalische Offenheit, während die Fußnote gebräuchliche kontextuelle Deutungen nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konkreter poetischer Bildsprache. „Tosende Grube“ ist bewusst ungewöhnlich, aber verständlich; die Fußnote macht die Mehrdeutigkeit transparent.
