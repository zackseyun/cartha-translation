  source_fidelity: Die Grundstruktur und die zentralen Bilder folgen dem Hebräischen gut. Allerdings fügen „sodass“ eine ausdrücklich kausale Verknüpfung und „nicht mehr“ einen zeitlichen Aspekt hinzu, die der Text nicht ausdrücklich formuliert. „Sünden“ gibt עֲוֹנֹתַי im Deutschen zudem angemessener als schuldhaftes Unrecht wieder als das vergleichsweise abgeschwächte „Verfehlungen“.
  naturalness: Die Übersetzung ist insgesamt flüssiges, würdig-poetisches modernes Standarddeutsch. „Und ich kann nicht sehen“ ist ebenso natürlich und hält die hebräische Reihung genauer ein.
  terminology: „Übel“ bewahrt die offene Bedeutung von רָעוֹת als Unheil bzw. schlimme Widerfahrnisse. „Sünden“ ist für עֲוֹנֹתַי ein klarer, angemessen gewichtiger Haupttextbegriff; die Fußnote wahrt die mögliche Bedeutung von Schuld und Schuldlast. Das Bild „mein Herz hat mich verlassen“ bleibt treffend erhalten.
