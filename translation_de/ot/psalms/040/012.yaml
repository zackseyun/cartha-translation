  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: de
  text: Denn Übel ohne Zahl haben mich umringt[a]; meine Sünden[b] haben mich eingeholt, und ich kann nicht sehen. Sie sind zahlreicher als die Haare auf meinem Kopf, und mein Herz hat mich verlassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unzählige Übel“ beziehungsweise „mehr Übel, als man zählen kann“.'
    reason: lexical_alternative
  - marker: b
    text: „Sünden“ kann hier auch mit „Schuld“ wiedergegeben werden; das hebräische Wort kann sowohl das begangene Unrecht als auch die damit verbundene Schuldlast bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Bild kann den Verlust von Kraft, Mut oder innerem Halt ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die vorausgehende Bitte ein.
- source_word: אָפְפוּ עָלַי
  choice: haben mich umringt
  rationale: Bewahrt das Bild, von allen Seiten eingeschlossen und bedrängt zu sein.
- source_word: רָעוֹת
  choice: Übel
  rationale: Gibt die breite Bedeutung von Unheil, Nöten und Bösem wieder, ohne sie vorschnell auf bloße Schwierigkeiten oder moralisches Böses einzuengen.
- source_word: עַד אֵין מִסְפָּר
  choice: ohne Zahl
  rationale: Eine knappe, würdevolle Wiedergabe der hebräischen Aussage, dass die Übel unzählbar sind.
- source_word: הִשִּׂיגוּנִי
  choice: haben mich eingeholt
  rationale: Erhält das Bild des Einholens und zugleich den Sinn, dass der Sprecher von seinen Verfehlungen überwältigt wird.
- source_word: עֲוֹנֹתַי
  choice: meine Verfehlungen
  rationale: Bezeichnet schuldhaftes Unrecht und kann zugleich dessen Schuldlast einschließen; die Fußnote wahrt diese Bedeutungsbreite.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: sodass ich nicht mehr sehen kann
  rationale: Die Folgebeziehung ergibt sich natürlich aus dem Kontext der überwältigenden Schuld; „nicht mehr“ drückt den erreichten Zustand idiomatisch aus.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Sie sind zahlreicher als die Haare auf meinem Kopf
  rationale: Gibt den zahlenmäßigen Vergleich klar und natürlich wieder.
- source_word: וְלִבִּי עֲזָבָנִי
  choice: und mein Herz hat mich verlassen
  rationale: Bewahrt das auffällige hebräische Bild, ohne es ausschließlich als Mutlosigkeit, Kraftlosigkeit oder körperliches Versagen auszulegen.
theological_decisions:
- issue: Ob עֲוֹנֹתַי die eigenen sündhaften Taten, die Schuld oder die daraus erwachsende Schuldlast bezeichnet
  choice: meine Verfehlungen
  alternative: meine Schuld; die Folgen meiner Sünden
  rationale: Das Possessivsuffix spricht am natürlichsten von dem eigenen schuldhaften Unrecht des Psalmisten. Die Fußnote hält offen, dass das hebräische Wort auch Schuld und Schuldlast umfassen kann, statt die Spannung zwischen äußerem Unheil und eigener Schuld aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die markanten Bilder des Umringens, Einholens und Verlassenseins bleiben erhalten; erklärungsbedürftige Bedeutungsbreiten werden in Fußnoten ausgewiesen.
