  text: קַוֺּ֣ה קִוִּ֣יתִי יְהוָ֑ה וַ/יֵּ֥ט אֵ֝לַ֗/י וַ/יִּשְׁמַ֥ע שַׁוְעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: de
  text: Geduldig wartete ich auf Jahwe[a]; da wandte er sich mir zu und hörte meinen Hilferuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wartend wartete ich auf Jahwe.“ Diese hebräische Verstärkung kann geduldiges, beharrliches oder erwartungsvolles Warten ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: Geduldig wartete ich
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Warten. Die adverbiale Wiedergabe ist im heutigen Deutsch natürlich; die formale Emphase und die mögliche Nuance erwartungsvollen Wartens werden in der Fußnote offengelegt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: וַיֵּט אֵלַי
  choice: da wandte er sich mir zu
  rationale: נטה bezeichnet hier eine auf den Beter gerichtete Bewegung oder Zuwendung. „Sich jemandem zuwenden“ ist natürliches modernes Deutsch und bewahrt den relationalen Sinn.
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bezeichnet hier das aufmerksame Hören des Hilferufs. „Hörte“ wahrt die knappe Ausdrucksweise des Hebräischen, ohne die daraus folgende Antwort bereits ausdrücklich hinzuzufügen.
- source_word: שַׁוְעָתִי
  choice: meinen Hilferuf
  rationale: שַׁוְעָה ist ein aus Bedrängnis ausgestoßener Ruf um Hilfe. „Hilferuf“ gibt diese Zielrichtung knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und vermeidet die Ersetzung durch den Titel „der HERR“; „Jehova“ beruht auf einer späteren Mischlesung.
- issue: Bedeutung des erhörenden Hörens
  choice: hörte meinen Hilferuf
  alternative: erhörte meinen Hilferuf
  rationale: „Erhörte“ könnte eine ausdrückliche Gewährung der Bitte vorwegnehmen. Das schlichte „hörte“ folgt enger dem Verb שׁמע und bewahrt die im Kontext liegende, aber nicht eigens ausgesprochene Reaktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt das geduldige Warten hervor; „da“ markiert natürlich die anschließende Zuwendung Jahwes. Der Semikolon bewahrt die Zweiteilung des Verses.
