source:
  edition: WLC
  text: אָ֣ז אָ֭מַרְתִּי הִנֵּה בָ֑אתִי בִּ/מְגִלַּת סֵ֝֗פֶר כָּת֥וּב עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: de
  text: 'Da sagte ich: »Sieh, ich bin gekommen[b]; in der Buchrolle steht über mich geschrieben[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für mich« oder »mir vorgeschrieben«. Der hebräische Ausdruck kann sowohl das bezeichnen, was über den Sprecher geschrieben steht, als auch das, was für ihn festgelegt ist.'
    reason: alternative_reading
  - marker: b
    text: In Hebräer 10,7 wird dieser Vers im Zusammenhang mit dem Messias angeführt.
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Das temporale Adverb leitet die Reaktion des Sprechers auf den vorausgehenden Zusammenhang ein. »Da« gibt die zeitliche und folgernde Abfolge im Deutschen natürlich wieder.
- source_word: אָמַרְתִּי
  choice: sagte ich
  rationale: Die erste Person Singular des Verbs אמר wird schlicht und idiomatisch wiedergegeben und führt die folgende direkte Rede ein.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. »Sieh« bewahrt diesen Impuls in verständlichem, gehobenem Gegenwartsdeutsch, ohne das stärker altertümliche »Siehe« zu verlangen.
- source_word: בָאתִי
  choice: ich bin gekommen
  rationale: Die Perfektform bezeichnet hier das vollzogene Kommen beziehungsweise das Sich-Einstellen des Sprechers. Das deutsche Perfekt ist in direkter Rede natürlich.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: in der Buchrolle
  rationale: מְגִלָּה bezeichnet eine Rolle, סֵפֶר ein Schriftstück oder Buch. »Buchrolle« erhält das konkrete Bild des hebräischen Ausdrucks und ist natürlicher als »Rolle des Buches«.
- source_word: כָּתוּב
  choice: steht … geschrieben
  rationale: Das passive Partizip beschreibt einen bestehenden schriftlichen Inhalt. Die deutsche Wendung »steht geschrieben« gibt diesen Zustand idiomatisch und mit dem passenden feierlichen Ton wieder.
- source_word: עָלַי
  choice: über mich
  rationale: עַל mit Personalsuffix bedeutet hier am ehesten »über/betreffend«. Da auch »für mich« oder eine dem Sprecher auferlegte Vorschrift möglich ist, wird die Mehrdeutigkeit in einer Fußnote offengehalten.
theological_decisions:
- issue: Bedeutung von עָלַי vor dem Hintergrund der späteren christologischen Anführung in Hebräer 10
  choice: über mich
  alternative: für mich; mir vorgeschrieben
  rationale: »Über mich« gibt den naheliegenden Sinn des hebräischen Ausdrucks im Psalm wieder, ohne die spätere christologische Verwendung in den Wortlaut hineinzutragen. Die ebenfalls möglichen Bedeutungen werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. »Sieh« bewahrt den Nachdruck von הִנֵּה, während »Buchrolle« das historische Schriftbild verständlich erhält. Die Fußnotenzeichen stehen jeweils an der Textstelle, auf die ihre Erläuterung tatsächlich bezogen ist.
