source:
  edition: WLC
  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: de
  text: Ich habe Gerechtigkeit[a] in großer Versammlung verkündet. Siehe, meine Lippen habe ich nicht zurückgehalten[b]; Jahwe, du weißt es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Recht“. Das hebräische Wort kann moralische Gerechtigkeit ebenso wie gerechtes Recht und Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ich verschloss meine Lippen nicht.“ Gemeint ist, dass der Beter nicht schwieg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: ich habe … verkündet
  rationale: Das Piel von בּשׂר bezeichnet das öffentliche Überbringen oder Bekanntmachen einer Nachricht, häufig einer guten Nachricht. „Verkündet“ bewahrt den heroldhaften, öffentlichen Charakter, ohne dem Satz eine im Hebräischen nicht ausdrücklich markierte neutestamentliche Fachbedeutung aufzuerlegen.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: צֶדֶק umfasst moralische Richtigkeit und gerechtes Handeln beziehungsweise Recht. „Gerechtigkeit“ hält diese Bedeutungsbreite im Deutschen am ehesten offen.
- source_word: בְּקָהָל רָב
  choice: in großer Versammlung
  rationale: קָהָל bezeichnet eine einberufene Gemeinschaft oder Versammlung, רָב deren Größe. Da im Hebräischen kein Artikel steht, wird nicht unnötig „in der großen Versammlung“ festgelegt.
- source_word: הִנֵּה
  choice: Siehe
  rationale: „Siehe“ erhält die aufmerksamkeitslenkende und nachdrückliche Funktion von הִנֵּה sowie den gehobenen poetischen Ton.
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: meine Lippen hielt ich nicht zurück
  rationale: Die konkrete Metapher der Lippen bleibt erhalten. כלה bezeichnet hier das Zurückhalten oder Hemmen; die Vergangenheitsform passt zur vorausgehenden rückblickenden Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: יָדָעְתָּ
  choice: du weißt es
  rationale: Das hebräische Perfekt beschreibt hier Gottes gegenwärtiges Wissen. Das im Deutschen nötige „es“ verweist auf die unmittelbar vorausgehende Aussage, ohne ihren Inhalt näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: „Jahwe“ macht kenntlich, dass der hebräische Text einen persönlichen Namen und keinen bloßen Titel verwendet. Die genaue antike Aussprache ist nicht vollständig gesichert, doch „Jahwe“ ist die geläufige wissenschaftliche Rekonstruktion im Deutschen.
- issue: Bedeutungsumfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht; was recht ist
  rationale: Der Kontext erlaubt sowohl moralisch-bundestreue als auch rechtlich-gerichtliche Obertöne. Die Übersetzung entscheidet diese Spannung nicht enger als nötig; die Fußnote nennt die wichtigste Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Siehe“ ist bewusst gehoben, entspricht aber der emphatischen Funktion des hebräischen הִנֵּה. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betroffenen Formulierung.
