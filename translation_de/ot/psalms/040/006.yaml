source:
  edition: WLC
  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: de
  text: Schlachtopfer und Speisopfer hast du nicht gewollt; Ohren hast du mir gegraben[a]; Brandopfer und Sündopfer hast du nicht verlangt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ohren hast du mir gegraben“; wahrscheinlich ein Bild dafür, dass Gott zum Hören und Gehorchen befähigt hat. Die Septuaginta, der Hebräer 10,5 folgt, hat dagegen: „Einen Leib hast du mir bereitet.“'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח
  choice: Schlachtopfer
  rationale: Bezeichnet im kultischen Zusammenhang ein geschlachtetes Opfer und unterscheidet es klar von den folgenden Opferarten.
- source_word: מִנְחָה
  choice: Speisopfer
  rationale: Der Begriff bezeichnet hier wahrscheinlich das unblutige, meist aus Getreide bestehende Opfer; „Speisopfer“ ist die etablierte deutsche Fachbezeichnung.
- source_word: לֹא חָפַצְתָּ
  choice: hast du nicht gewollt
  rationale: Gibt den Willens- und Gefallensaspekt von חפץ knapp und natürlich wieder, ohne ihn auf bloßes emotionales Gefallen zu verengen.
- source_word: אָזְנַיִם כָּרִיתָ לִּי
  choice: Ohren hast du mir gegraben
  rationale: Bewahrt das auffällige Bild des hebräischen Verbs כרה („graben“). Die wahrscheinliche idiomatische Bedeutung wird in der Fußnote erläutert, statt das Bild im Haupttext aufzulösen.
- source_word: עוֹלָה
  choice: Brandopfer
  rationale: Etablierte und genaue Bezeichnung für das vollständig verbrannte Opfer.
- source_word: חֲטָאָה
  choice: Sündopfer
  rationale: Im Opferkontext bezeichnet das Substantiv eine Opferart und nicht abstrakt die Sünde.
- source_word: לֹא שָׁאָלְתָּ
  choice: hast du nicht verlangt
  rationale: „Verlangt“ ist im Deutschen in Bezug auf Opfer natürlicher als „erbeten“ und wahrt den Sinn von שאל, ohne die Aussage zu „gefordert“ zu verschärfen.
theological_decisions:
- issue: Verhältnis des hebräischen Wortlauts „Ohren hast du mir gegraben“ zur griechischen Fassung und zu Hebräer 10,5
  choice: Der hebräische Wortlaut bleibt im Haupttext als „Ohren hast du mir gegraben“ erhalten.
  alternative: '„Du hast mir die Ohren geöffnet“; nach der Septuaginta und Hebräer 10,5: „Einen Leib hast du mir bereitet.“'
  rationale: Der Psalm wird vorrangig aus dem masoretischen hebräischen Text übersetzt. Die Fußnote macht sowohl den wahrscheinlichen idiomatischen Sinn als auch die theologisch bedeutsame griechische Überlieferung transparent, ohne beide Fassungen stillschweigend zu harmonisieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit etablierten kultischen Begriffen. Die markante hebräische Bildsprache wird bewusst beibehalten und durch eine knappe textgeschichtliche Fußnote erschlossen.
