  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: de
  text: 'Wegen ihrer Schande sollen die bestürzt sein, die zu mir sagen: »Haha! Haha!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ruf »Haha! Haha!« drückt hämische Schadenfreude oder Spott aus.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: Entsetzt sollen ... zurückweichen
  rationale: Das Qal-Imperfekt von שׁמם kann Verödung, Entsetzen oder fassungsloses Erstarren bezeichnen. Die Verbindung aus »entsetzt« und »zurückweichen« gibt im Deutschen sowohl den Schock als auch die vernichtende Wirkung im Zusammenhang wieder.
- source_word: עַל עֵקֶב
  choice: wegen
  rationale: Die Wendung bezeichnet hier Ursache oder Folge. »Wegen« ist eine natürliche, knappe deutsche Wiedergabe, ohne die im Kontext nicht eindeutig entscheidbare kausale beziehungsweise konsekutive Nuance unnötig festzulegen.
- source_word: בָּשְׁתָּם
  choice: ihrer Schande
  rationale: Die direkte Wiedergabe wahrt den Gedanken öffentlicher Beschämung beziehungsweise Entehrung.
- source_word: הָאֹמְרִים לִי
  choice: die zu mir sagen
  rationale: Artikel und Partizip werden substantivisch gebraucht; der deutsche Relativsatz gibt diese Konstruktion natürlich wieder.
- source_word: הֶאָח הֶאָח
  choice: Haha! Haha!
  rationale: Die Interjektion drückt hämische Schadenfreude oder Spott aus. »Haha!« ist im heutigen Deutsch unmittelbar verständlich und bewahrt den höhnischen Ton.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. Die Mehrdeutigkeit von שׁמם wird im Haupttext durch »entsetzt ... zurückweichen« kontextgerecht gebündelt; der höhnische Charakter der Interjektion wird in der Fußnote erläutert.
