id: PSA.40.11
reference: Psalms 40:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: de
  text: Du, Jahwe, wirst dein Erbarmen nicht von mir zurückhalten[a]; deine beständige Liebe und deine Treue[b] werden mich stets bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Bitte: »Du, Jahwe, halte dein Erbarmen nicht von mir zurück.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »deine Wahrheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: Du
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und hebt Jahwe als handelndes Gegenüber hervor.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תִכְלָא
  choice: wirst ... nicht zurückhalten
  rationale: כלא bezeichnet hier das Zurück- oder Vorenthalten. Die futurische Wiedergabe versteht den Yiqtol als zuversichtliche Aussage; eine bittende Lesart bleibt in der Fußnote erhalten.
- source_word: רַחֲמֶיךָ
  choice: dein Erbarmen
  rationale: Der hebräische Intensiv- beziehungsweise Abstraktplural bezeichnet Gottes mitfühlende Zuwendung; im Deutschen ist der kollektive Singular »Erbarmen« natürlich.
- source_word: מִמֶּנִּי
  choice: von mir
  rationale: Gibt die Präposition mit Suffix im Zusammenhang mit »zurückhalten« unmittelbar wieder.
- source_word: חַסְדְּךָ
  choice: deine beständige Liebe
  rationale: Die Wendung verbindet liebevolle Güte mit Verlässlichkeit und gibt die tragende, dauerhafte Dimension von חסד verständlich wieder.
- source_word: אֲמִתְּךָ
  choice: deine Treue
  rationale: Im Parallelismus mit חסד bezeichnet אמת vor allem Gottes Verlässlichkeit; die ebenfalls mögliche Bedeutung »Wahrheit« wird in einer Fußnote genannt.
- source_word: תָּמִיד
  choice: stets
  rationale: Das knappe Adverb gibt die fortdauernde Schutzwirkung in natürlichem, gehobenem Deutsch wieder.
- source_word: יִצְּרוּנִי
  choice: werden mich ... bewahren
  rationale: נצר bezeichnet schützendes Hüten und Bewahren. Der Plural des Verbs entspricht dem zusammengesetzten Subjekt »Liebe und Treue«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Bundesname wird als Name erkennbar wiedergegeben, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Aussage oder Bitte bei לֹא תִכְלָא
  choice: 'zuversichtliche Aussage: »wirst ... nicht zurückhalten«'
  alternative: 'Bitte: »Halte ... nicht zurück«'
  rationale: Die Yiqtol-Form lässt im Gebetszusammenhang sowohl eine Aussage des Vertrauens als auch eine auffordernde Bitte zu. Die Hauptfassung folgt der formalen Zukunftslesart; die andere Deutung wird ausdrücklich dokumentiert.
- issue: Bedeutung von אֱמֶת im Paar חֶסֶד וֶאֱמֶת
  choice: Treue
  alternative: Wahrheit
  rationale: Als göttliche Eigenschaft, die den Beter bewahrt, betont אמת hier wahrscheinlich Verlässlichkeit und Beständigkeit. Die lexikalisch echte Alternative »Wahrheit« bleibt sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der parallele Satzbau bleiben erhalten; »beständige Liebe«, »Treue« und »bewahren« vermeiden Archaismen, ohne den theologischen Gehalt zu verflachen.
