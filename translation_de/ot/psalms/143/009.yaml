id: PSA.143.9
reference: Psalms 143:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: de
  text: Rette mich vor meinen Feinden, Jahwe! Bei dir habe ich Zuflucht gesucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Zu dir habe ich mich verborgen«; gemeint ist, bei Gott Schutz zu suchen.'
    reason: Die ungewöhnliche hebräische Wendung verbindet die Richtung »zu dir« mit dem Verb »verbergen« und kann daher sowohl bildhaft als auch als Ausdruck des Zufluchtsuchens wiedergegeben werden.
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von נצל mit Suffix der 1. Person Singular ist eine unmittelbare Bitte um Rettung. »Rette mich« ist im modernen Deutschen natürlich und bewahrt die Eindringlichkeit des Gebets.
- source_word: מֵאֹיְבַי
  choice: vor meinen Feinden
  rationale: מִן bezeichnet hier die Trennung beziehungsweise Befreiung von den Feinden. Im Deutschen ist »vor meinen Feinden retten« idiomatischer als das formal nähere »von meinen Feinden retten«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. »Jahwe« ist die im Deutschen übliche Form der wissenschaftlich begründeten Aussprache von יהוה.
- source_word: אֵלֶיךָ
  choice: Bei dir
  rationale: Wörtlich bedeutet אֵלֶיךָ »zu dir«. In Verbindung mit כסה bezeichnet die Wendung jedoch das Suchen von Schutz bei Gott; »bei dir« gibt dieses Schutzverhältnis im Deutschen natürlich wieder und bewahrt durch die Voranstellung den Nachdruck des Hebräischen.
- source_word: כִסִּתִי
  choice: habe ich Zuflucht gesucht
  rationale: Die Form ist ein Qal-Perfekt der 1. Person Singular von כסה, dessen Grundbedeutung »bedecken, verbergen« ist. Im Zusammenhang mit אֵלֶיךָ liegt das Bild nahe, sich bei Gott zu verbergen und so Schutz zu suchen. Die gewählte Fassung vermittelt den Sinn idiomatisch; die wörtlichere Bildsprache bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen und nicht den Titel אֲדֹנָי. Daher bleibt der Name als »Jahwe« erkennbar, statt durch einen Titel ersetzt zu werden.
- issue: Deutung von אֵלֶיךָ כִסִּתִי
  choice: Bei dir habe ich Zuflucht gesucht
  alternative: Zu dir habe ich mich verborgen
  rationale: Die hebräische Formulierung ist ungewöhnlich und lässt das konkrete Bild des Sich-Verbergens erkennen. Im Kontext einer Bitte um Rettung bezeichnet dieses Bild das Suchen von Schutz bei Gott. Die Hauptfassung gibt den idiomatischen Sinn wieder, ohne die wörtlichere Möglichkeit in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Der Ausruf nach »Jahwe« bildet den unmittelbaren Hilferuf ab. Die Voranstellung »Bei dir« entspricht dem Nachdruck und der Wortfolge des hebräischen Schlussglieds.
