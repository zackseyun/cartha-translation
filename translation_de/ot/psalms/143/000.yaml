source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/000.yaml
  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: de
  text: Ein Psalm Davids. HERR, höre mein Gebet, vernimm mein Flehen! Antworte mir in deiner Treue, in deiner Gerechtigkeit![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Antworte mir aufgrund deiner Treue«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »aufgrund deiner Gerechtigkeit«; »Gerechtigkeit« kann hier auch Gottes gerechtes Handeln oder Recht meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Ein Psalm Davids
  rationale: Die traditionelle und natürliche deutsche Wiedergabe bewahrt die mögliche Zuordnung zu David, ohne die genaue Funktion von לְ übermäßig festzulegen.
- source_word: הַאֲזִינָה
  choice: vernimm
  rationale: Gibt die Aufforderung zum aufmerksamen Hören würdig und idiomatisch wieder und unterscheidet sie stilistisch von שְׁמַע.
- source_word: תַּחֲנוּנַי
  choice: mein Flehen
  rationale: Bezeichnet inständige Bitten um Gnade; der deutsche Singular ist als Sammelbegriff natürlich.
- source_word: בֶּאֱמֻנָתְךָ
  choice: in deiner Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Treue. Die Präposition kann sowohl den Bereich als auch die Grundlage des Antwortens ausdrücken.
- source_word: בְּצִדְקָתֶךָ
  choice: in deiner Gerechtigkeit
  rationale: Bewahrt den zentralen Begriff Gerechtigkeit und die parallele Präpositionalform, ohne vorschnell zwischen Art und Grundlage des Handelns zu entscheiden.
theological_decisions:
- issue: Gottes Gerechtigkeit als Grund oder Weise der Antwort
  choice: in deiner Gerechtigkeit
  alternative: aufgrund deiner Gerechtigkeit / nach deinem Recht
  rationale: Die hebräische בְּ-Konstruktion ist mehrdeutig. Die gewählte Form bewahrt die Spannung zwischen Gottes gerechtem Wesen, seinem gerechten Handeln und der Grundlage der erbetenen Antwort.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname יהוה wird nach verbreiteter deutscher Bibelkonvention mit HERR wiedergegeben. Die parallele Struktur der beiden abschließenden Wendungen bleibt erhalten.
