  source_fidelity: 'Der vollständige hebräische Text ist wiedergegeben: Überschrift, Anrede an JHWH, die beiden parallelen Hörbitten sowie die abschließenden, mit בְ eingeleiteten Bitten um Antwort. „vernimm mein Flehen“ gibt הַאֲזִינָה אֶל־תַּחֲנוּנַי idiomatisch und sinngetreu wieder. „in deiner Treue, in deiner Gerechtigkeit“ bewahrt die parallele und semantisch mehrdeutige Präpositionalstruktur.'
