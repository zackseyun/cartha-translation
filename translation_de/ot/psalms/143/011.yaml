id: PSA.143.11
reference: Psalms 143:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֣ יְהוָ֣ה תְּחַיֵּ֑/נִי בְּ/צִדְקָתְ/ךָ֓ תוֹצִ֖יא מִ/צָּרָ֣ה נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: de
  text: Um deines Namens willen, Jahwe, erhalte mich am Leben[a]; in deiner Gerechtigkeit[b] führe mich aus der Bedrängnis heraus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „belebe mich neu“ oder „gib mir Leben“. Das hebräische Verb kann bedeuten, am Leben zu erhalten oder Leben und Kraft wiederherzustellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „durch deine Gerechtigkeit“ oder „in deinem Recht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „führe meine Seele aus der Bedrängnis heraus“; „meine Seele“ meint hier idiomatisch „mich“ oder „mein Leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: um deines Namens willen
  rationale: Die Wendung gibt den Beweggrund der Bitte wieder und bewahrt zugleich das biblische Bild vom Namen Gottes als Ausdruck seiner offenbarten Identität und Ehre.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תְּחַיֵּנִי
  choice: erhalte mich am Leben
  rationale: Das Piel von חיה kann das Bewahren oder Wiederherstellen des Lebens bezeichnen. Im Zusammenhang der Bitte um Rettung aus Bedrängnis ist diese Formulierung natürlich und lässt offen, ob Bewahrung oder neue Belebung im Vordergrund steht.
- source_word: בְּצִדְקָתְךָ
  choice: in deiner Gerechtigkeit
  rationale: Die Wiedergabe bewahrt sowohl die mögliche modale Bedeutung der Präposition ב als auch den moralisch-bundestreuen Sinn von צדקה; eine instrumentale Übersetzung mit „durch“ bleibt möglich.
- source_word: תוֹצִיא
  choice: führe … heraus
  rationale: Das Hifil von יצא bezeichnet ursächlich das Herausbringen. „Führe … heraus“ bewahrt dieses konkrete Bild besser als das allgemeinere „rette“.
- source_word: מִצָּרָה
  choice: aus der Bedrängnis
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Drangsal. „Bedrängnis“ passt zum Klagegebet und zum räumlichen Bild des Herausführens.
- source_word: נַפְשִׁי
  choice: mich
  rationale: נפשׁ bedeutet hier idiomatisch die eigene Person beziehungsweise das eigene Leben. „Mich“ ist im modernen Deutschen natürlich; die wörtliche Form wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von צדקה
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; Recht
  rationale: „Gerechtigkeit“ lässt Gottes moralische Geradheit und seine verlässliche Treue anklingen, ohne den Ausdruck ausschließlich auf richterliches Recht zu verengen.
- issue: Anthropologische Wendung נַפְשִׁי
  choice: idiomatisch „mich“
  alternative: „meine Seele“; „mein Leben“
  rationale: Hier bezeichnet נפשׁ den ganzen Menschen beziehungsweise sein Leben. Die idiomatische Wiedergabe vermeidet im Haupttext eine unnötige Trennung von Körper und Seele; die formale Entsprechung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildlichkeit. Die Anrede „Jahwe“ steht ohne das heute altertümlich wirkende „o“. Der Satz folgt eng der Parallelstruktur des Hebräischen, gibt נפשׁ jedoch idiomatisch wieder.
