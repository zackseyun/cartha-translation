source:
  edition: WLC
  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: de
  text: Antworte mir schnell, Jahwe; mein Geist schwindet. Verbirg dein Angesicht nicht vor mir, sonst werde ich denen gleich, die in die Grube hinabsteigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ins Grab hinabsteigen“. Die „Grube“ ist im Hebräischen ein poetisches Bild für den Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: schnell
  rationale: Der Imperativ hat hier adverbiale Funktion und verstärkt die Bitte um eine unverzügliche Antwort. „Schnell“ gibt die Dringlichkeit in natürlichem modernem Deutsch wieder.
- source_word: עֲנֵנִי
  choice: Antworte mir
  rationale: ענה bezeichnet im Gebetszusammenhang das Antworten auf einen Hilferuf. „Antworte mir“ ist direkt, verständlich und im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: כָּלְתָה רוּחִי
  choice: mein Geist schwindet
  rationale: כלה beschreibt hier das Zu-Ende-Gehen oder Erlöschen der inneren Kraft. „Mein Geist schwindet“ bewahrt die knappe, eindringliche Bildsprache, ohne „Geist“ vorschnell als bloße Lebenskraft auszulegen.
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: Verbirg dein Angesicht nicht vor mir
  rationale: Die körperhafte hebräische Wendung für den Entzug von Gegenwart oder Gunst bleibt erhalten. „Angesicht“ trägt den poetischen und würdevollen Ton besser als das alltäglichere „Gesicht“.
- source_word: וְנִמְשַׁלְתִּי
  choice: sonst werde ich denen gleich
  rationale: Der Niphal drückt aus, anderen gleich zu werden beziehungsweise ihnen gleichgestellt zu sein. Nach der verneinten Bitte gibt „sonst“ die drohende Folge im Deutschen natürlich wieder.
- source_word: יֹרְדֵי בוֹר
  choice: die in die Grube hinabsteigen
  rationale: Das Partizip bezeichnet Menschen, die zur Grube hinabsteigen. Die konkrete Todesmetapher „Grube“ bleibt im Haupttext stehen; „Grab“ wäre bereits eine Deutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der „Grube“
  choice: Die Todesmetapher „Grube“ im Haupttext bewahren
  alternative: Grab; Totenreich
  rationale: Das Bild verweist auf Tod und möglicherweise auf den Bereich der Toten, legt aber keine vollständig ausgearbeitete Lehre über den Zustand nach dem Tod fest. Die bildhafte Offenheit des Hebräischen bleibt daher erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Gebetssprache. Die parallelen Bitten und die körperhafte Bildsprache des Hebräischen bleiben erhalten. Der Fußnotenmarker steht bei „Grube“, da sich die Anmerkung auf dieses Todesbild bezieht.
