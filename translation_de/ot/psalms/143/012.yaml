base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: de
  text: Und in deiner treuen Liebe[a] wirst du meine Feinde vernichten, und alle, die mich bedrängen[b], wirst du zugrunde richten; denn ich bin dein Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch deine treue Liebe“; die hebräische Präposition kann sowohl den Bereich beziehungsweise Grund als auch das Mittel des Handelns bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Bedränger meiner Seele“. „Meine Seele“ kann auch „mein Leben“ oder einfach „mich“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: Und in deiner treuen Liebe
  rationale: חֶסֶד bezeichnet hier Gottes beständige, verlässliche Liebe und Güte. „Treue Liebe“ bewahrt sowohl den Beziehungs- als auch den Treueaspekt. Die Präposition ב wird als „in“ wiedergegeben; ein instrumentales „durch“ ist ebenfalls möglich.
- source_word: תַּצְמִית
  choice: wirst du … vernichten
  rationale: Der Hifil von צמת bezeichnet das Beenden oder Vernichten. „Vernichten“ erhält die starke Aussage des hebräischen Verbs, ohne sie abzuschwächen.
- source_word: אֹיְבָי
  choice: meine Feinde
  rationale: Direkte Wiedergabe des Plurals mit Suffix der ersten Person Singular.
- source_word: וְהַאֲבַדְתָּ
  choice: wirst du zugrunde richten
  rationale: Der Hifil von אבד bedeutet, jemanden umkommen zu lassen oder zu vernichten. „Zugrunde richten“ gibt die starke Bedeutung wieder und bewahrt zugleich die Variation gegenüber תַּצְמִית.
- source_word: כָּל צֹרֲרֵי נַפְשִׁי
  choice: alle Bedränger meiner Seele
  rationale: צֹרֲרֵי bezeichnet feindlich Bedrängende oder Widersacher. Die nominale Wiedergabe folgt der hebräischen Form; „meiner Seele“ erhält die Mehrdeutigkeit von נֶפֶשׁ zwischen Seele, Leben und Person.
- source_word: כִּי אֲנִי עַבְדֶּךָ
  choice: denn ich bin dein Diener
  rationale: כִּי begründet die Bitte. עֶבֶד drückt hier demütige Zugehörigkeit und Dienst gegenüber Gott aus; „Diener“ ist im heutigen Deutsch verständlich und vermeidet eine unnötige Verengung auf die soziale Institution der Sklaverei.
theological_decisions:
- issue: Gewaltsame Gerichtssprache über die Feinde
  choice: Die starken Aussagen „vernichten“ und „zugrunde richten“ werden beibehalten.
  alternative: Die Verben mit „besiegen“, „zum Schweigen bringen“ oder ähnlich abschwächen.
  rationale: Beide hebräischen Verben drücken die Beseitigung beziehungsweise Vernichtung der Feinde aus. Die Spannung des Gebets um Gottes Gericht darf nicht durch eine mildere Formulierung aufgelöst werden.
- issue: Bedeutung von נַפְשִׁי
  choice: „meiner Seele“
  alternative: „meines Lebens“ oder „mich“
  rationale: Die wörtlich-poetische Wiedergabe bewahrt die Bedeutungsbreite des hebräischen Ausdrucks, ohne eine bestimmte anthropologische Lehre festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. Die beiden starken hebräischen Verben werden durch unterschiedliche deutsche Ausdrücke wiedergegeben; die Mehrdeutigkeit von חֶסֶד, ב und נֶפֶשׁ wird nicht stillschweigend eingeengt.
