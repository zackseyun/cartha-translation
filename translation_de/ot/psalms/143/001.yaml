base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: de
  text: 'Ein Psalm Davids.[a]


    Jahwe, höre mein Gebet,

    vernimm mein Flehen um Gnade!

    In deiner Treue[b] antworte mir,

    in deiner Gerechtigkeit.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Präposition kann Autorschaft, Zuordnung oder Widmung ausdrücken.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »durch deine Treue« oder »aufgrund deiner Treue«.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: »durch deine Gerechtigkeit«, »aufgrund deiner Gerechtigkeit« oder »nach deinem Recht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Die etablierte und sachlich passende deutsche Gattungsbezeichnung für dieses Überschriftswort.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die knappe Überschrift entspricht natürlichem Deutsch; eine Fußnote bewahrt die mögliche Bedeutung »von«, »für« oder »David zugehörig«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: שְׁמַע
  choice: höre
  rationale: Direkte Wiedergabe des Imperativs; im Gebetszusammenhang ist aufmerksames Hören mitgemeint.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: Klare Wiedergabe des Nomens im Singular mit Suffix der ersten Person.
- source_word: הַאֲזִינָה
  choice: vernimm
  rationale: Bewahrt die poetische Parallelität zu »höre« und drückt aufmerksames Zuhören in natürlichem, würdigem Deutsch aus.
- source_word: תַּחֲנוּנַי
  choice: mein Flehen um Gnade
  rationale: Das Nomen bezeichnet eindringliche Bitten um Gunst oder Erbarmen; die Formulierung macht diesen Bedeutungsgehalt verständlich.
- source_word: בֶּאֱמֻנָתְךָ
  choice: in deiner Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit bzw. Treue. »In« erhält die Form des hebräischen Ausdrucks, während eine Fußnote die instrumentale oder begründende Nuance nennt.
- source_word: עֲנֵנִי
  choice: antworte mir
  rationale: Entspricht dem üblichen Gebetsausdruck; eine günstige Antwort wird nicht ausdrücklich hinzugefügt.
- source_word: בְּצִדְקָתֶךָ
  choice: in deiner Gerechtigkeit
  rationale: Bewahrt sowohl die traditionelle Kernbedeutung von צְדָקָה als auch die parallele Präposition; mögliche Nuancen von Recht und begründendem Handeln stehen in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen. »Jahwe« gibt ihn in der im Deutschen üblichen wissenschaftlichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Gottes Treue und Gerechtigkeit zur erbetenen Antwort
  choice: in deiner Treue … in deiner Gerechtigkeit
  alternative: durch/aufgrund deiner Treue … durch/aufgrund deiner Gerechtigkeit bzw. nach deinem Recht
  rationale: Die hebräische Präposition ב kann den Bereich, das Mittel oder den Grund bezeichnen. Die Hauptfassung erhält die formale und theologische Spannung; die Alternativen werden nicht stillschweigend festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. Die Imperative »höre« und »vernimm« erhalten den Parallelismus; »Flehen um Gnade« vermittelt den emotionalen und semantischen Gehalt ohne altertümliches »Flehen« isoliert oder fachsprachliches »Flehrufe«.
