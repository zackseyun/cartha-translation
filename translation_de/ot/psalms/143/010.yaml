base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
translation:
  language: de
  text: Lehre mich, deinen Willen zu tun, denn du bist mein Gott. Dein guter Geist[a] führe mich auf ebenem Boden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn von: „deine gute Gesinnung“. Das hebräische Wort kann Gottes Geist bezeichnen oder allgemeiner seine gute Gesinnung.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: Lehre mich
  rationale: Der Piel-Imperativ von למד mit Suffix der 1. Person Singular bedeutet, jemanden zu lehren oder zu unterweisen. „Lehre mich“ ist im Gebetsstil direkt und natürlich.
- source_word: לַעֲשׂוֹת רְצוֹנֶךָ
  choice: deinen Willen zu tun
  rationale: Der Infinitiv von עשה bezeichnet den Inhalt des Lernens; רצון meint hier das von Gott Gewollte. Die Formulierung bewahrt den schlichten und handlungsbezogenen Sinn.
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: denn du bist mein Gott
  rationale: כִּי begründet die Bitte. „Denn“ erhält den kausalen Zusammenhang und entspricht einem würdigen deutschen Gebetsregister.
- source_word: רוּחֲךָ טוֹבָה
  choice: dein guter Geist
  rationale: רוּחַ mit Suffix bedeutet „dein Geist“; טוֹבָה heißt „gut“. Die Großschreibung folgt der naheliegenden Deutung als Gottes eigener Geist, während die Fußnote die orthografisch offene Alternative wahrt.
- source_word: תַּנְחֵנִי
  choice: führe mich
  rationale: Der Hifil von נחה bedeutet „führen“ oder „leiten“. Der Konjunktiv „führe“ gibt den bittenden Charakter natürlich wieder.
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: auf ebenem Boden
  rationale: מִישׁוֹר bezeichnet eine ebene Fläche und kann bildlich Geradheit oder sicheres Vorankommen ausdrücken. „Auf ebenem Boden“ bewahrt das räumliche Bild in idiomatischem Deutsch.
theological_decisions:
- issue: Ob רוּחֲךָ als „Geist“ oder „geist“ beziehungsweise als Gottes Geist oder gute Gesinnung zu verstehen ist
  choice: dein guter Geist
  alternative: dein guter geist / deine gute Gesinnung
  rationale: Da Gott direkt angeredet wird und von „deinem רוח“ die Rede ist, liegt Gottes eigener Geist als Referent nahe. Das Hebräische kennt jedoch keine entsprechende Groß- und Kleinschreibung; deshalb wird die alternative Deutung nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die knappe Satzstruktur und das Bild des ebenen Bodens bleiben erhalten; die mögliche Mehrdeutigkeit von רוּחַ wird nicht stillschweigend beseitigt.
