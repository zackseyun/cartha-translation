  text: I spread out my hands to you; my soul is like a weary land for you[a]. Selah
translation:
  language: de
  text: Ich breite meine Hände zu dir aus; meine Seele dürstet nach dir wie dürres Land[a]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie müdes“ oder „erschöpftes Land“. Die Wendung beschreibt wahrscheinlich Land, das ausgedörrt ist und nach Wasser verlangt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: Ich breite … aus
  rationale: Das Qal von פרשׂ bezeichnet hier das Ausbreiten oder Ausstrecken der Hände als konkrete Gebärde des Gebets und Flehens.
- source_word: יָדַי
  choice: meine Hände
  rationale: Die Form mit Suffix der 1. Person Singular bezeichnet beide Hände; der deutsche Plural gibt die Gebärde natürlich wieder.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: אֶל bezeichnet die Ausrichtung auf den angeredeten Gott; „zu dir“ ist im Deutschen natürlich und bewahrt diese Richtung.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Leben, Selbst oder inneres Wesen bezeichnen. „Meine Seele“ bewahrt hier die poetische und geistlich-affektive Weite des Ausdrucks.
- source_word: כְּאֶרֶץ עֲיֵפָה
  choice: wie dürstendes Land
  rationale: עֲיֵפָה bedeutet wörtlich „müde, erschöpft, verschmachtend“. Auf Land bezogen bezeichnet die Metapher wahrscheinlich ein ausgedörrtes, nach Wasser verlangendes Land; „dürstend“ macht das Bild im Deutschen verständlich, ohne das Verlangen ausdrücklich zu ergänzen.
- source_word: לְךָ
  choice: vor dir
  rationale: Das poetisch knappe לְךָ ist mehrdeutig und kann eine Ausrichtung oder Beziehung zu Gott ausdrücken. „Vor dir“ lässt die Aussage im Deutschen stehen, ohne ein sonst leicht missverständliches „für dich“ an das Landbild anzuschließen.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des liturgisch-musikalischen Ausdrucks ist unsicher; daher wird er in üblicher deutscher Form transliteriert.
theological_decisions: []
