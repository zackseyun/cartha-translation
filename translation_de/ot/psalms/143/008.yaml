source:
  edition: WLC
  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: de
  text: Lass mich am Morgen deine treue Liebe hören[a], denn auf dich vertraue ich. Lass mich den Weg erkennen, den ich gehen soll[b], denn zu dir erhebe ich meine Seele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass mich am Morgen von deiner treuen Liebe hören.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Weg, den ich gehen werde“.'
    reason: lexical_alternative
  - marker: c
    text: „Die Seele zu Gott erheben“ ist eine hebräische Ausdrucksweise dafür, sich Gott anzuvertrauen oder das ganze innere Leben auf ihn auszurichten.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: Lass mich hören
  rationale: Der Hifil-Imperativ bedeutet wörtlich „lass mich hören“ bzw. „bewirke, dass ich höre“. Die gewählte Form bewahrt den bittenden Charakter und klingt im Deutschen natürlich.
- source_word: בַבֹּקֶר
  choice: am Morgen
  rationale: Die Zeitangabe bezeichnet am ehesten den Zeitpunkt. „Bis zum Morgen“ würde eine Frist ausdrücken, die im Hebräischen nicht ausdrücklich vorliegt.
- source_word: חַסְדֶּךָ
  choice: deine treue Liebe
  rationale: חסד verbindet liebevolle Zuwendung mit Beständigkeit und Loyalität. „Treue Liebe“ gibt beide Aspekte in gegenwärtigem Deutsch wieder, ohne den Begriff auf „Barmherzigkeit“ zu verengen.
- source_word: בְךָ בָטָחְתִּי
  choice: auf dich vertraue ich
  rationale: Das Perfekt beschreibt hier eine gefestigte Haltung des Vertrauens. Das deutsche Präsens bringt dieses gegenwärtige, fortdauernde Vertrauen idiomatisch zum Ausdruck.
- source_word: הוֹדִיעֵנִי
  choice: Lass mich erkennen
  rationale: Der Hifil-Imperativ von ידע bedeutet „lass mich wissen/erkennen“ oder „mach mir bekannt“. In Verbindung mit dem zu gehenden Weg ist „lass mich erkennen“ natürlich und bleibt nahe am Grundsinn.
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  choice: den Weg, den ich gehen soll
  rationale: Wörtlich steht „den Weg, den ich gehen werde“. Im Zusammenhang der Bitte um Führung bringt „gehen soll“ die gemeinte Orientierung idiomatisch zum Ausdruck; die wörtlichere Möglichkeit wird in einer Fußnote erhalten.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition bezeichnet die Ausrichtung auf Gott hin; „zu dir“ ist die natürliche deutsche Entsprechung.
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: ich erhebe meine Seele
  rationale: Die hebräische Wendung bezeichnet die vertrauensvolle Hinwendung des ganzen inneren Lebens zu Gott. Das Bild wird bewahrt, statt es durch eine eindeutige Deutung zu ersetzen.
theological_decisions:
- issue: Bedeutung von חסד in der an Gott gerichteten Bitte
  choice: deine treue Liebe
  alternative: deine Güte; deine beständige Liebe; deine Barmherzigkeit
  rationale: Die Formulierung wahrt sowohl Gottes liebevolle Zuwendung als auch deren Verlässlichkeit, ohne eine bestimmte Bundestheologie ausdrücklich in den Text einzutragen.
- issue: Bildhafte Wendung נָשָׂאתִי נַפְשִׁי
  choice: denn zu dir erhebe ich meine Seele
  alternative: denn dir vertraue ich mich an; denn auf dich richte ich mein Innerstes
  rationale: Die poetische und theologische Offenheit des hebräischen Bildes bleibt erhalten. Eine paraphrasierende Wiedergabe würde es auf Vertrauen, Sehnsucht oder Gebet allein festlegen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit bewahrter hebräischer Bildsprache. Die Satzführung ist klar und gut vorlesbar; unnötig altertümliche Wörter werden vermieden.
