base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: de
  text: 'Denn ein Feind hat mich[a] verfolgt;

    er hat mein Leben zu Boden zerschlagen;

    er hat mich in finsteren Orten wohnen lassen,

    wie die längst Verstorbenen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meine Seele«; das hebräische Wort kann hier die ganze Person oder ihr Leben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie die Toten der Vorzeit«.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Bitte im Zusammenhang ein und bewahrt die kausale Funktion.
- source_word: רָדַף
  choice: verfolgt
  rationale: Gibt die Grundbedeutung des Verbs natürlich wieder; das deutsche Präsens kann im poetischen Klagekontext die fortwirkende Bedrängnis ausdrücken.
- source_word: אוֹיֵב
  choice: ein Feind
  rationale: Entspricht dem artikellosen Singular, ohne ihn unnötig als einen bereits bestimmten Feind festzulegen.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ bezeichnet hier die bedrohte Person beziehungsweise ihr Leben. Die natürliche deutsche Wiedergabe vermeidet eine irreführende Beschränkung auf einen vom Körper getrennten Seelenteil.
- source_word: דִּכָּא
  choice: zu Boden zerschlagen
  rationale: Vermittelt die starke Vorstellung des Zermalmens oder Niederbrechens und verbindet sich idiomatisch mit לָאָרֶץ.
- source_word: חַיָּתִי
  choice: mein Leben
  rationale: Bezeichnet die lebendige Existenz des Beters; die Wiederholung ist im Deutschen verständlich und folgt der semantischen Nähe der beiden hebräischen Ausdrücke.
- source_word: הוֹשִׁיבַנִי
  choice: hat mich … wohnen lassen
  rationale: Bewahrt den kausativen Sinn des Hifil und beschreibt das erzwungene Verweilen an einem Ort.
- source_word: בְמַחֲשַׁכִּים
  choice: in Finsternissen
  rationale: Bewahrt auffällig die hebräische Pluralform und den poetischen Charakter verschiedener dunkler Bereiche oder Tiefen.
- source_word: כְּמֵתֵי עוֹלָם
  choice: wie die seit Langem Toten
  rationale: Versteht עוֹלָם temporal im Sinn längst vergangener Zeit, ohne die alternative Nuance ‚Tote der Vorzeit‘ zu verschweigen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: mein Leben
  alternative: meine Seele / mich
  rationale: Der Ausdruck bezeichnet im Kontext die ganze bedrohte Person oder ihr Leben; die Übersetzung legt keine anthropologische Trennung von Leib und Seele nahe.
- issue: Zeitbezug von מֵתֵי עוֹלָם
  choice: die seit Langem Toten
  alternative: die Toten der Vorzeit
  rationale: Die Wendung betont wahrscheinlich langes Totsein und Verlassenheit; die historische Lesart bleibt als Fußnotenalternative erhalten.
translation_notes:
  register: Modernes, würdiges Klagepsalm-Deutsch mit knapper Parallelstruktur. Die ungewöhnliche Pluralform »Finsternissen« bewahrt die poetische Bildlichkeit des Hebräischen; beide Fußnotenmarker stehen im Haupttext.
