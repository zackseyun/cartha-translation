  text: And my spirit grows faint within me[a]; my heart is appalled within me.
translation:
  language: de
  text: Und mein Geist wird schwach in mir[a]; in meinem Innern ist mein Herz erstarrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Und mein Geist ist in mir überwältigt; in meinem Innern ist mein Herz verstört.'
    reason: Lexikalisch sind bei עטף sowohl Schwachwerden als auch Überwältigtsein und bei שמם sowohl Erstarrung als auch tiefe Verstörung möglich.
lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: wird schwach
  rationale: Das Hitpael von עטף bezeichnet in Klagekontexten ein Schwachwerden, Verzagen oder Überwältigtsein. „Wird schwach“ ist gegenwärtiges, natürliches Deutsch und bewahrt das Bild des inneren Zusammenbrechens.
- source_word: עָלַי
  choice: in mir
  rationale: Die Präposition bedeutet wörtlich „auf/über mir“, bezeichnet hier zusammen mit dem Geist des Beters jedoch idiomatisch einen Zustand in seinem Inneren. „In mir“ entspricht zugleich dem poetischen Parallelismus mit בְּתוֹכִי.
- source_word: רוּחִי
  choice: mein Geist
  rationale: רוּחַ meint hier die innere Lebenskraft beziehungsweise das innere Selbst des Beters, nicht bloß den Atem. „Mein Geist“ wahrt die anthropologische und poetische Weite des Ausdrucks.
- source_word: בְּתוֹכִי
  choice: in meinem Innern
  rationale: Der Ausdruck bezeichnet das Innere der Person. „In meinem Innern“ ist klar, würdevoll und vermeidet eine stilistisch störende unmittelbare Wiederholung von „in mir“.
- source_word: יִשְׁתּוֹמֵם
  choice: ist … wie erstarrt
  rationale: Das Verb שמם kann Verödung, Entsetzen, Verstörung oder Erstarrung ausdrücken. „Wie erstarrt“ gibt den Zustand tiefster innerer Verstörung idiomatisch wieder, ohne eine bestimmte Ursache hinzuzufügen.
- source_word: לִבִּי
  choice: mein Herz
  rationale: לֵב bezeichnet den inneren Menschen mit Denken, Wollen und Empfinden. „Mein Herz“ ist die natürliche poetische Entsprechung und steht passend parallel zu „mein Geist“.
theological_decisions: []
