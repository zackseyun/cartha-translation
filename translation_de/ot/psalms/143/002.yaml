source:
  edition: WLC
  text: וְ/אַל תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ כִּ֤י לֹֽא יִצְדַּ֖ק לְ/פָנֶ֣י/ךָ כָל חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/002.yaml
  text: And do not enter into judgment with your servant[a], for no living one is righteous before you.
translation:
  language: de
  text: Und geh nicht mit deinem Diener ins Gericht, denn vor dir ist kein Lebender gerecht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn vor dir wird kein Lebender für gerecht erklärt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: Und … nicht
  rationale: Die Verbindung aus Konjunktion und Verneinung führt die Bitte aus dem vorigen Vers weiter; „Und“ wahrt diesen Zusammenhang, ohne einen Gegensatz einzutragen.
- source_word: תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ
  choice: geh nicht mit deinem Diener ins Gericht
  rationale: בוא mit בְּמִשְׁפָּט bezeichnet hier das Eintreten in ein gerichtliches Verfahren. Die deutsche Wendung „mit jemandem ins Gericht gehen“ gibt das Rechtsbild natürlich und präzise wieder. עֶבֶד wird im Gebetskontext angemessen mit „Diener“ wiedergegeben.
- source_word: כִּ֤י
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Bitte ein; „denn“ ist im poetischen Gebetsregister knapp und natürlich.
- source_word: לֹֽא יִצְדַּ֖ק
  choice: ist … gerecht
  rationale: Das Qal von צדק kann „gerecht sein“, „im Recht sein“ oder im forensischen Zusammenhang „gerechtfertigt werden“ bedeuten. „Ist gerecht“ bewahrt die umfassende Aussage, während der Gerichtskontext die forensische Färbung erkennen lässt.
- source_word: לְ/פָנֶ֣י/ךָ
  choice: vor dir
  rationale: Dies ist die natürliche deutsche Wiedergabe für eine Beurteilung in Gottes Gegenwart.
- source_word: כָל חָֽי
  choice: kein Lebender
  rationale: Wörtlich steht „jeder Lebende“ unter der Verneinung, sodass sich eine universale Negation ergibt. „Kein Lebender“ bleibt knapp, poetisch und auf lebende Menschen bezogen.
theological_decisions:
- issue: Forensische oder moralische Nuance von יִצְדַּק angesichts des göttlichen Gerichts
  choice: „vor dir ist kein Lebender gerecht“
  alternative: „vor dir wird kein Lebender für gerecht erklärt“ oder „vor dir kann kein Lebender im Recht bestehen“
  rationale: Die Übersetzung verbindet das gerichtliche Bild mit dem umfassenden Bekenntnis, dass kein Mensch vor Gott gerecht dasteht. Sie legt sich nicht auf eine spätere dogmatische Formulierung fest; die starke forensische Lesart wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter, weiterhin gut verständlicher Gerichtssprache. Die Satzstellung ist poetisch, aber natürlich; die Anrede Gottes bleibt in der Einzahl.
