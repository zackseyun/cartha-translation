  text: זְכָר זֹ֗את א֭וֹיֵב חֵרֵ֣ף יְהוָ֑ה וְ/עַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: de
  text: 'Denk daran: Der Feind hat Jahwe geschmäht[a], und ein törichtes[b] Volk hat deinen Namen verachtet[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verhöhnt“ oder „verspottet“.'
    reason: lexical_alternative
  - marker: b
    text: „Töricht“ bezeichnet hier moralische Verfehlung, nicht nur mangelnde Intelligenz; vgl. Psalm 14,1.
    reason: cross_reference
  - marker: c
    text: 'Oder: „mit Verachtung behandelt“; möglicherweise: „gelästert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר זֹאת
  choice: Denk daran
  rationale: Der Qal-Imperativ richtet eine unmittelbare Bitte an Gott. Die idiomatische deutsche Wendung gibt זְכָר זֹאת natürlich und prägnant wieder.
- source_word: אוֹיֵב
  choice: der Feind
  rationale: Das formal singularische Substantiv bezeichnet im Kontext den feindlichen Widersacher generisch beziehungsweise kollektiv.
- source_word: חֵרֵף
  choice: hat verhöhnt
  rationale: חרף bezeichnet eine verächtliche Schmähung oder Verspottung. „Verhöhnt“ bewahrt den starken, gegen Gott gerichteten Hohn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְעַם נָבָל
  choice: und ein törichtes Volk
  rationale: עַם bezeichnet hier kollektiv ein Volk; נָבָל meint moralisch-religiöse Torheit, nicht bloß geringe Intelligenz.
- source_word: נִאֲצוּ
  choice: hat ... verachtet
  rationale: נאץ drückt verächtliche Zurückweisung beziehungsweise Geringschätzung aus. Der deutsche Singular entspricht dem Kollektiv „Volk“.
- source_word: שְׁמֶךָ
  choice: deinen Namen
  rationale: Die konkrete Rede vom Namen bleibt erhalten; im Hebräischen umfasst sie zugleich Gottes offenbarte Identität, Ehre und Ansehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch „der HERR“ zu ersetzen.
- issue: Moralische Bedeutung von נָבָל
  choice: töricht
  alternative: gottlos
  rationale: „Töricht“ lässt die moralisch-geistliche Bedeutung bestehen, ohne die nicht ausdrücklich ausgesagte Deutung „gottlos“ in den Haupttext einzutragen.
- issue: Stärke von נאץ
  choice: verachtet
  alternative: gelästert
  rationale: „Verachtet“ bildet die breite Bedeutung des Ausdrucks ab; „gelästert“ ist möglich, legt die Art der Verachtung aber stärker fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Gebetssprache. „Denk daran“ ist gegenwärtig und natürlich; „verhöhnt“ und „verachtet“ erhalten den ernsten Klagecharakter. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
