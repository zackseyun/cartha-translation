  text: הָרִ֣ימָ/ה פְ֭עָמֶי/ךָ לְ/מַשֻּׁא֣וֹת נֶ֑צַח כָּל הֵרַ֖ע אוֹיֵ֣ב בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/003.yaml
  text: Lift up your steps to the perpetual ruins[a]; the enemy has devastated everything in the sanctuary.
translation:
  language: de
  text: Erhebe deine Schritte zu den ewigen Trümmern[a]; der Feind hat alles im Heiligtum verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den dauerhaften Verwüstungen«. Das Hebräische verbindet das Bild von Gottes Schritten mit einem Ausdruck für anhaltende Verwüstung.'
    reason: lexikalische Alternative und Bildsprache
lexical_decisions:
- source_word: הָרִימָה
  choice: Erhebe
  rationale: Der Imperativ von רום ist an Gott gerichtet. Zusammen mit »deine Schritte« bleibt das konkrete poetische Bild erhalten, ohne es zu »Komm« aufzulösen.
- source_word: פְעָמֶיךָ
  choice: deine Schritte
  rationale: פעם kann Schritte oder Füße bezeichnen. »Deine Schritte« bewahrt die anthropomorphe Bewegungsvorstellung und klingt im Deutschen würdig.
- source_word: לְמַשֻּׁאוֹת נֶצַח
  choice: zu den Trümmern, die für immer bleiben
  rationale: מַשֻּׁאוֹת bezeichnet Verwüstungen oder deren Ergebnis, die Trümmer; נֶצַח beschreibt hier wahrscheinlich deren anhaltenden Zustand. Die Formulierung ist verständlicher als das missverständliche »ewige Trümmer«.
- source_word: כָּל
  choice: alles
  rationale: Das Wort bezeichnet umfassend das ganze Ausmaß der Zerstörung und wird im Deutschen natürlich mit »alles« wiedergegeben.
- source_word: הֵרַע
  choice: hat ... verwüstet
  rationale: Das Hifil von רעע bedeutet hier Schaden zufügen, zugrunde richten oder verwüsten. Im Zusammenhang der Zerstörung des Heiligtums gibt »verwüstet« die Stärke angemessen wieder.
- source_word: אוֹיֵב
  choice: der Feind
  rationale: Der Singular bezeichnet den gegnerischen Akteur kollektiv oder repräsentativ; »der Feind« ist im Kontext sachgerecht.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: קֹדֶשׁ meint hier den heiligen Bezirk beziehungsweise das Tempelheiligtum. »Heiligtum« erhält den kultischen Sinn.
theological_decisions:
- issue: Anthropomorphe Aufforderung an Gott im ersten Halbvers
  choice: Das konkrete Bild »Erhebe deine Schritte« bleibt erhalten.
  alternative: »Komm«, »Mach dich auf« oder »Schreite voran«
  rationale: Der hebräische Text bittet Gott in anschaulicher, körperbezogener Sprache, sich dem verwüsteten Heiligtum zuzuwenden. Eine glättende Paraphrase würde die poetische Spannung abschwächen.
- issue: Bedeutung von נֶצַח bei den Verwüstungen
  choice: 'Als fortdauernder Zustand der Trümmer verstanden: »die für immer bleiben«.'
  alternative: »ewige Trümmer«, »alte Trümmer« oder adverbial »völlig verwüstet«
  rationale: Die knappe hebräische Verbindung ist mehrdeutig. Die Hauptfassung gibt den naheliegenden Gedanken an anhaltende Verwüstung wieder; die Fußnote wahrt die formnähere Alternative.
translation_notes:
  register: Modernes Standarddeutsch mit würdig-poetischem Ton. Die ungewöhnliche Aufforderung »Erhebe deine Schritte« wurde bewusst beibehalten; der Folgesatz wurde für natürliche deutsche Schwerpunktsetzung mit »alles im Heiligtum« eröffnet.
