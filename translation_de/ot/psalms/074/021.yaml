  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: de
  text: Lass den Unterdrückten[a] nicht beschämt[b] zurückkehren; Arme und Bedürftige sollen deinen Namen preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zerschlagenen“ beziehungsweise „Niedergedrückten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gedemütigt“ beziehungsweise „entehrt“. Das hebräische Wort kann öffentliche Beschämung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Lass ... nicht
  rationale: Die Negationspartikel bildet mit der folgenden Verbform eine bittende Aufforderung. „Lass ... nicht“ gibt den Gebetston im Deutschen natürlich wieder.
- source_word: יָשֹׁב
  choice: zurückkehren
  rationale: Das Verb שׁוב bedeutet „zurückkehren“ oder „umkehren“. Die Übersetzung lässt offen, woher oder wohin der Unterdrückte zurückkehrt.
- source_word: דַּךְ
  choice: der Unterdrückte
  rationale: Das Wort bezeichnet einen niedergedrückten, zerschlagenen oder unterdrückten Menschen. „Der Unterdrückte“ vermittelt die soziale und persönliche Not in natürlichem Deutsch.
- source_word: נִכְלָם
  choice: beschämt
  rationale: Die passive Form bezeichnet das Beschämt- oder Entehrtwerden. „Beschämt“ ist knapp und bewahrt sowohl die innere Scham als auch die mögliche öffentliche Demütigung.
- source_word: עָנִי
  choice: Arme
  rationale: Das Wort kann Arme, Bedrängte oder Demütige bezeichnen. In der Verbindung mit אֶבְיוֹן liegt hier die Bedeutung „Arme“ nahe.
- source_word: אֶבְיוֹן
  choice: Bedürftige
  rationale: Das Wort bezeichnet Bedürftige oder Mittellose. „Bedürftige“ wahrt die Unterscheidung vom vorangehenden עָנִי.
- source_word: יְהַלְלוּ
  choice: sollen ... preisen
  rationale: Die Verbform hat im Gebetszusammenhang auffordernden beziehungsweise wünschenden Sinn. „Sollen ... preisen“ bildet diesen Sinn idiomatisch ab, ohne eine sichere Zukunftsaussage daraus zu machen.
- source_word: שְׁמֶךָ
  choice: deinen Namen
  rationale: Die wörtliche Wendung bezeichnet Gottes offenbarten Charakter und Ruf. Sie ist auch im Deutschen verständlich und theologisch bedeutsam.
theological_decisions:
- issue: Bezug und Aussagekraft des letzten Satzteils
  choice: 'Der letzte Satzteil bleibt als Gebetswunsch formuliert: Arme und Bedürftige sollen Gottes Namen preisen.'
  alternative: Man könnte ihn ausdrücklich als Folge der erbetenen Rettung verstehen oder allgemeiner als Wunsch, dass Arme und Bedürftige Gott weiterhin preisen.
  rationale: Die Folge der hebräischen Verbformen verbindet beide Bitten, formuliert aber keinen ausdrücklichen Kausalsatz. Die Übersetzung bewahrt diesen Spielraum.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Singular im ersten Satzteil und der Plural im zweiten entsprechen dem hebräischen Text. Das Semikolon macht den Parallelismus sichtbar; die Formulierung vermeidet eine nicht ausdrücklich markierte kausale Deutung.
