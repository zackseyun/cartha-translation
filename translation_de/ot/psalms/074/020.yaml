source:
  edition: WLC
  text: הַבֵּ֥ט לַ/בְּרִ֑ית כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי אֶ֝֗רֶץ נְא֣וֹת חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: de
  text: Sieh auf den Bund[a], denn die dunklen Orte des Landes[b] sind voller Stätten der Gewalt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Bund“. Im Hebräischen steht „den Bund“; aus dem Zusammenhang ergibt sich, dass Gottes Bund mit seinem Volk gemeint ist.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „der Erde“. Das hebräische Wort kann je nach Zusammenhang „Land“ oder „Erde“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Wohnstätten der Gewalt“ beziehungsweise „Schlupfwinkel der Gewalt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: Achte auf
  rationale: Der Imperativ von נבט fordert Gott auf, dem Bund seine Aufmerksamkeit zuzuwenden. „Achte auf“ ist im Deutschen eine natürliche, eindringliche Bitte, ohne bereits eine bestimmte Art des Eingreifens festzulegen.
- source_word: לַבְּרִית
  choice: den Bund
  rationale: Der hebräische Ausdruck enthält den bestimmten Artikel, aber kein ausdrückliches Possessivsuffix. „Den Bund“ bewahrt diese Form; dass Gottes Bund mit seinem Volk gemeint ist, ergibt sich aus dem Zusammenhang.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die vorausgehende Bitte ein.
- source_word: מָלְאוּ
  choice: sind voller
  rationale: Das Qal Perfekt beschreibt hier einen bestehenden, aus einer Füllung hervorgegangenen Zustand. „Sind voller“ gibt diesen Zustand idiomatisch wieder.
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: die dunklen Orte des Landes
  rationale: Die Genitivverbindung bezeichnet dunkle beziehungsweise verborgene Orte. Im Kontext der Verwüstung Zions liegt „Land“ nahe; „Erde“ bleibt lexikalisch möglich.
- source_word: נְאוֹת
  choice: Stätten
  rationale: נָוֶה kann Wohnort, Aufenthaltsort oder Weide bezeichnen. Zusammen mit „Gewalt“ ist „Stätten“ natürlich und bewahrt den räumlichen Sinn, ohne ausdrücklich menschliche Wohnungen vorauszusetzen.
- source_word: חָמָס
  choice: Gewalt
  rationale: חָמָס bezeichnet Gewalt sowie gewaltsames Unrecht. „Gewalt“ ist hier die direkte und etablierte Wiedergabe.
theological_decisions:
- issue: Soll der Bund ausdrücklich als Gottes Bund bezeichnet werden?
  choice: den Bund
  alternative: deinen Bund
  rationale: Im Hebräischen steht der bestimmte Artikel, jedoch kein Possessivsuffix. Der Kontext identifiziert den Bund als Gottes Bund mit seinem Volk, doch der Haupttext fügt das nicht ausdrücklich hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gebetssprache und die räumliche Bildlichkeit des Hebräischen bleiben erhalten; lexikalische Mehrdeutigkeiten werden in Fußnoten ausgewiesen.
