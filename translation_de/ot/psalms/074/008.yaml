  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: de
  text: 'Sie sagten in ihrem Herzen: „Wir wollen sie allesamt vernichten[a].“ Sie verbrannten alle Versammlungsstätten Gottes[b] im Land.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort נִינָם ist schwierig. Möglich sind auch Wiedergaben wie „Wir wollen sie unterdrücken“ oder „Wir wollen sie bezwingen“; jedenfalls geht es um eine feindliche, zerstörerische Absicht.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle von Gott bestimmten Stätten“; traditionell auch „alle Synagogen Gottes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ בְלִבָּם
  choice: Sie sagten in ihrem Herzen
  rationale: Die hebräische Wendung bezeichnet inneres Reden beziehungsweise einen gefassten Entschluss; das Bild des Herzens bleibt erhalten. Der Singular entspricht dem distributiv-kollektiven hebräischen Ausdruck.
- source_word: נִינָם יָחַד
  choice: Wir wollen sie allesamt vernichten
  rationale: נִינָם ist lexikalisch und möglicherweise textkritisch schwierig. Im Zusammenhang drückt es am ehesten die umfassende feindliche Absicht aus, Gottes Volk zu beseitigen; יָחַד verstärkt hier die Gesamtheit.
- source_word: שָׂרְפוּ
  choice: Sie verbrannten
  rationale: Das Qal-Perfekt von שׂרף bezeichnet hier schlicht das Verbrennen der genannten Orte.
- source_word: כָּל מוֹעֲדֵי אֵל
  choice: alle Versammlungsstätten Gottes
  rationale: מוֹעֵד kann eine festgesetzte Zeit oder einen festgesetzten Ort der Zusammenkunft bezeichnen. Da diese Größen verbrannt werden und sich im Land befinden, ist die räumliche Bedeutung am wahrscheinlichsten.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Im Kontext ist das Land Israel gemeint; die Wiedergabe vermeidet die weiter gefasste Bedeutung „auf der Erde“.
theological_decisions:
- issue: Bedeutung von מוֹעֲדֵי אֵל
  choice: Versammlungsstätten Gottes
  alternative: Festzeiten Gottes; Synagogen Gottes
  rationale: Das Verb „verbrennen“ und die Ortsangabe sprechen für Gebäude oder Stätten. „Synagogen“ wäre historisch zu spezifisch, während „Festzeiten“ als unmittelbares Objekt von „verbrennen“ weniger naheliegt.
- issue: Deutung des schwierigen נִינָם
  choice: Ausdruck umfassender Vernichtungsabsicht
  alternative: „Wir wollen sie unterdrücken“ oder „Wir wollen sie bezwingen“; eine substantivische Deutung mit anderer Syntax
  rationale: Die genaue Form ist unsicher. Die Übersetzung gibt den feindlichen Sinn im Kontext wieder, ohne die Unsicherheit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Allesamt“ trägt die umfassende Kraft von יָחַד, ohne unnötig umständlich zu wirken. Die Fußnoten bewahren die beiden wesentlichen lexikalischen Unsicherheiten.
