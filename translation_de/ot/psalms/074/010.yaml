  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: de
  text: Wie lange, Gott, wird der Gegner dich verhöhnen? Wird der Feind deinen Namen für immer schmähen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wird der Feind deinen Namen für immer lästern?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Wie lange
  rationale: Die natürliche deutsche Klagefrage gibt die zeitliche Wendung idiomatisch und prägnant wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Vokativ wird im Deutschen durch die direkte Anrede und Kommasetzung deutlich; ein zusätzliches »o« wäre möglich, klänge aber stärker altertümlich.
- source_word: יְחָרֶף
  choice: verhöhnen
  rationale: Das Piel von חרף bezeichnet spöttisches Beschimpfen oder Verhöhnen. Die Wahl bewahrt den verbalen Angriff und den poetischen Ton.
- source_word: צָר
  choice: der Bedränger
  rationale: צָר bezeichnet einen Gegner oder Bedränger. Diese Wiedergabe unterscheidet das Wort vom folgenden אוֹיֵב, ohne den synonymen Parallelismus aufzugeben.
- source_word: יְנָאֵץ
  choice: schmähen
  rationale: Das Piel von נאץ drückt verächtliche Missachtung aus, hier gegenüber Gottes Namen. »Schmähen« lässt sowohl verbale Herabsetzung als auch tiefe Verachtung anklingen.
- source_word: אוֹיֵב
  choice: der Feind
  rationale: Die gebräuchliche deutsche Entsprechung wahrt zugleich eine leichte lexikalische Unterscheidung zu צָר.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die ausdrückliche Rede von Gottes Namen bleibt erhalten und trägt dessen Ehre, Ansehen und offenbarte Identität mit.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Formulierung gibt in natürlichem Deutsch die als endlos empfundene Dauer der Klage wieder.
theological_decisions:
- issue: Ob die Schmähung von Gottes Namen ausdrücklich als Lästerung Gottes bezeichnet werden soll
  choice: Die wörtliche Wendung »deinen Namen« bleibt im Haupttext erhalten.
  alternative: Soll der Feind dich für immer lästern?
  rationale: Der hebräische Text nennt ausdrücklich Gottes Namen. Diese theologisch gehaltvolle Formulierung bewahrt den Bezug auf Gottes Ehre und offenbarte Identität, ohne ihn paraphrastisch aufzulösen.
- issue: Modalität der ersten Frage
  choice: »darf der Bedränger dich verhöhnen?«
  alternative: »wird der Bedränger dich verhöhnen?«
  rationale: Die hebräische Imperfektform nach »Wie lange« bezeichnet den als andauernd beklagten Vorgang. Das deutsche »darf« gibt idiomatisch die empörte Klage über Gottes scheinbares Gewährenlassen wieder, ohne eine tatsächliche moralische Erlaubnis zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. »Bedränger« und »Feind« spiegeln die zwei unterschiedlichen hebräischen Gegnerbezeichnungen; »schmähen« vermeidet im Haupttext eine vorschnelle Festlegung auf den stärker theologischen Fachausdruck »lästern«.
