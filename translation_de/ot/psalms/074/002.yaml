  source_fidelity: 'Die Übersetzung gibt die Imperativbitte זְכֹר treffend wieder und bewahrt die wesentlichen Bezüge: Gottes frühere Aneignung der Gemeinde, ihre Erlösung als „Stamm“ seines Erbbesitzes sowie Zion als Ort seines Wohnens. Die Wiederaufnahme von „an“ verdeutlicht die im Hebräischen gedrängte Reihung, ohne den Sinn wesentlich zu verändern. „Auf dem du gewohnt hast“ ist für den Berg als Ortsbezeichnung idiomatisch und entspricht בּוֹ in diesem Zusammenhang.'
  naturalness: „Denk an deine Gemeinde“ ist modernes, würdiges Gebetsdeutsch. Die Satzstruktur mit den wiederholten Präpositionalanschlüssen ist etwas nachdrücklich, aber angesichts der poetisch-anhäufenden hebräischen Vorlage natürlich und gut verständlich. „Erbbesitz“ ist leicht gehoben, jedoch passend zum Psalmregister.
  terminology: „Gemeinde“, „erworben“, „erlöst“, „Stamm“ und „Berg Zion“ sind sachgerecht. „Erlöst“ bewahrt die Tragweite von גאל, ohne eine weitergehende dogmatische Deutung festzulegen. Die Fußnoten dokumentieren die relevanten lexikalischen Alternativen zu קנה, שׁבט und זֶה angemessen; die Marker stehen an den jeweils einschlägigen Stellen.
