id: PSA.74.2
reference: Psalms 74:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: de
  text: Denk an deine Gemeinde, die du vor langer Zeit[a] erworben[b] hast, an den Stamm deines Erbbesitzes[c], den du erlöst hast – an diesen Berg Zion[d], auf dem du gewohnt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: von alters her.'
    reason: lexical_alternative
  - marker: b
    text: „Erworben“ kann auch „gekauft“ bedeuten; in anderen Zusammenhängen kann das hebräische Wort mit „erschaffen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: Das mit „Stamm“ wiedergegebene hebräische Wort kann auch „Stab“ oder „Zepter“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: Wörtlich steht nach „Berg Zion“ das Hinweiswort „diesen“.
    reason: translation_clarity
lexical_decisions:
- source_word: זְכֹר
  choice: Denk an
  rationale: Der Imperativ richtet eine unmittelbare Bitte an Gott. „Denk an“ ist im modernen Deutschen natürlich und bewahrt den Gebetscharakter.
- source_word: עֲדָתְךָ
  choice: deine Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft beziehungsweise das Volk. „Gemeinde“ gibt den kollektiven Sinn würdig und verständlich wieder.
- source_word: קָנִיתָ
  choice: erworben
  rationale: קנה kann erwerben, kaufen, besitzen und in manchen Zusammenhängen erschaffen bedeuten. Hier legt die Parallele zu „erlöst“ nahe, dass Gott das Volk zu seinem Eigentum gemacht hat; „erworben“ wahrt diese Bedeutung, ohne ein Kaufgeschäft festzulegen.
- source_word: קֶּדֶם
  choice: vor langer Zeit
  rationale: Das Wort verweist auf eine weit zurückliegende Zeit. Die Formulierung ist modern und entspricht dem Rückblick auf Gottes frühes Handeln.
- source_word: גָּאַלְתָּ
  choice: erlöst
  rationale: גאל bezeichnet die befreiende Einlösung durch einen Löser und trägt hier das Gewicht von Gottes geschichtlicher Rettung seines Volkes.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: den Stamm deines Erbbesitzes
  rationale: שֵׁבֶט bedeutet hier im Zusammenhang mit der erlösten Gemeinde am wahrscheinlichsten „Stamm“. נַחֲלָה bezeichnet den Gott gehörenden Erbbesitz; die etwas markante Genitivverbindung bewahrt die Bildsprache des Hebräischen.
- source_word: הַר צִיּוֹן זֶה
  choice: diesen Berg Zion
  rationale: Das Demonstrativpronomen זֶה wird ausdrücklich auf den Berg Zion bezogen. „Diesen Berg Zion“ erhält den Hinweischarakter des hebräischen Ausdrucks.
- source_word: שָׁכַנְתָּ בוֹ
  choice: auf dem du gewohnt hast
  rationale: שׁכן bezeichnet das Wohnen oder Sich-Niederlassen und kann bei Gott seine bleibende Gegenwart anklingen lassen. Die deutsche Perfektform ist im Gebetskontext natürlich.
theological_decisions:
- issue: Bedeutet קָנִיתָ hier Gottes Erschaffen oder sein Erwerben des Volkes?
  choice: Gottes Erwerb der Gemeinde als seines Volkes
  alternative: Gottes Erschaffung beziehungsweise Formung der Gemeinde
  rationale: Die Parallele zu גָּאַלְתָּ („du hast erlöst“) und das folgende Bild vom Erbbesitz sprechen für die Aneignung des Volkes in der Heilsgeschichte. Die Fußnote hält die weiter reichende lexikalische Möglichkeit offen.
- issue: Bezeichnet שֵׁבֶט einen Stamm oder einen Stab beziehungsweise ein Zepter?
  choice: Stamm
  alternative: Stab oder Zepter
  rationale: Der Bezug auf die Gemeinde und das erlöste Volk macht die Bedeutung „Stamm“ im Kontext am wahrscheinlichsten. Die gegenständliche oder königliche Lesart wird jedoch in der Fußnote dokumentiert.
- issue: Wie ist der Berg Zion syntaktisch auf die vorangehende erlöste Gemeinde zu beziehen?
  choice: als weiterer, nachdrücklich genannter Gegenstand der Bitte „Denk an“
  alternative: als unmittelbare Apposition zum Stamm beziehungsweise zur Gemeinde
  rationale: Der hebräische Text reiht „Berg Zion, diesen“ abrupt an. Die Wiederholung von „an“ im Deutschen schafft einen verständlichen Satz, ohne Zion schlicht mit dem Volk gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die anaphorische Wiederholung von „an“ macht die gedrängte hebräische Reihung verständlich; „Erbbesitz“ und „erlöst“ bewahren zugleich die tragenden Bilder und theologischen Spannungen des Ausgangstextes.
