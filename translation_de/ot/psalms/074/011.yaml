  source_fidelity: 'Die Wiedergabe folgt dem Hebräischen eng: תָשִׁיב wird treffend als Zurückhalten der Hand verstanden; die doppelte Nennung von „Hand“ und „rechter Hand“ bleibt erhalten. „aus deinem Gewandbausch“ gibt מִקֶּרֶב חֵיקֶךָ als Bild einer im Gewand bzw. am Busen zurückgehaltenen Hand sachgerecht wieder. Der Schlussimperativ כַלֵּה hat im Hebräischen kein ausgedrücktes Objekt; die kontextuelle Ergänzung „ihnen“ ist durch die Fußnote transparent gemacht und entspricht dem englischen Audit Trail.'
