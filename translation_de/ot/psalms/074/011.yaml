  terminology: „Rechte Hand“ und „Gewandbausch“ sind kontextgerecht. „Mach ihnen ein Ende“ gibt die vernichtende bzw. endgültig beendende Kraft von כַלֵּה idiomatisch wieder, ohne eine spezifisch konfessionelle Deutung einzutragen. Die Fußnote benennt korrekt sowohl die wörtliche Formulierung als auch das fehlende explizite Objekt.
