source:
  edition: WLC
  text: לָ֤/מָּה תָשִׁ֣יב יָ֭דְ/ךָ וִֽ/ימִינֶ֑/ךָ מִ/קֶּ֖רֶב חוק/ך כַלֵּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: de
  text: Warum hältst du deine Hand zurück, deine rechte Hand? Zieh sie aus deinem Gewandbausch und mach ihnen ein Ende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „aus der Mitte deines Gewandbauschs – mach ein Ende“. Der letzte Imperativ hat kein ausdrücklich genanntes Objekt; „ihnen“ ist aus dem Zusammenhang mit den Feinden ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Die gewöhnliche Frage nach dem Grund eröffnet die Klage.
- source_word: תָשִׁיב
  choice: hältst du … zurück
  rationale: Der Hifil von שוב bedeutet mit „Hand“ als Objekt und im Zusammenhang mit dem Gewandbausch, dass Gott seine Hand zurückhält und nicht eingreift.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Das konkrete Bild und der poetische Parallelismus mit der rechten Hand bleiben erhalten.
- source_word: וִימִינֶךָ
  choice: deine rechte Hand
  rationale: Wörtliche Wiedergabe des Bildes für Kraft und entschlossenes Handeln, ohne es auszudeuten.
- source_word: מִקֶּרֶב חֹוקֶךָ
  choice: aus deinem Gewandbausch
  rationale: חֵיק bezeichnet hier den Brust- oder Bauschbereich des Gewandes, in dem die Hand verborgen bzw. untätig gehalten wird. „Gewandbausch“ vermittelt das antike Bild im Deutschen genauer als das heute missverständliche „Busen“.
- source_word: כַלֵּה
  choice: mach ihnen ein Ende
  rationale: Der Piel-Imperativ von כלה fordert dazu auf, etwas vollständig zu beenden oder zu vernichten. Die idiomatische Wendung wahrt die eindringliche Kraft; „ihnen“ wird aus dem Zusammenhang ergänzt.
theological_decisions:
- issue: Unausgesprochenes Objekt des Schlussimperativs
  choice: „mach ihnen ein Ende“, wobei „ihnen“ auf die feindlichen Verwüster im Kontext verweist
  alternative: Den Imperativ ohne Objekt wiedergeben oder allgemeiner auf Bedrohung und Hohn beziehen
  rationale: Im Hebräischen steht kein ausdrückliches Objekt. Der Psalmzusammenhang legt die Feinde nahe; die Ergänzung wird deshalb transparent in einer Fußnote ausgewiesen, statt die grammatische Offenheit zu verschweigen.
translation_notes:
  register: Moderne, würdevolle Klagesprache. „Gewandbausch“ ist etwas ungewohnt, bewahrt aber das konkrete Bild einer im Gewand zurückgehaltenen Hand. Die rhetorische Frage und der abrupte Imperativ bleiben erhalten.
