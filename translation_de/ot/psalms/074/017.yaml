id: PSA.74.17
reference: Psalms 74:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: de
  text: Du hast alle Grenzen der Erde festgesetzt[a]; Sommer und Winter – du hast sie geformt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aufgerichtet; oder: bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: gestaltet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: festgesetzt
  rationale: Der Hifil von נצב bezeichnet hier das feste Setzen beziehungsweise Bestimmen. »Festgesetzt« gibt sowohl die ordnende Handlung als auch die Beständigkeit der Grenzen wieder.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: alle Grenzen der Erde
  rationale: Im Zusammenhang mit Sommer und Winter ist eine kosmische Aussage über die geordnete Schöpfung gemeint. »Grenzen der Erde« passt daher besser als politisch verstandene Landesgrenzen und bewahrt sowohl כָּל als auch den Plural.
- source_word: קַיִץ וָחֹרֶף
  choice: Sommer und Winter
  rationale: Dies sind die üblichen deutschen Bezeichnungen für das Jahreszeitenpaar und geben die umfassende Gegenüberstellung natürlich wieder.
- source_word: יְצַרְתָּם
  choice: du hast sie geformt
  rationale: יצר bezeichnet häufig das Formen oder Gestalten. Das maskuline Pluralsuffix bezieht sich hier am natürlichsten auf Sommer und Winter.
- source_word: אַתָּה ... אַתָּה
  choice: Du ... du
  rationale: Die Wiederholung des selbstständigen Pronomens betont Gottes unmittelbares Handeln und wird deshalb in beiden Satzteilen ausdrücklich wiedergegeben.
theological_decisions:
- issue: Bedeutung der »Grenzen der Erde«
  choice: Kosmische Aussage über Gottes Ordnung der Welt
  alternative: Territoriale Grenzen von Ländern oder Völkern
  rationale: Die unmittelbare Verbindung mit Sommer und Winter stellt den Vers in den Zusammenhang der Schöpfungsordnung, nicht in einen geopolitischen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Anrede »Du ... du« bewahrt die hebräische Hervorhebung; der Gedankenstrich markiert den betonten Übergang zum zweiten Satzteil.
