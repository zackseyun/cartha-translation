id: PSA.74.12
reference: Psalms 74:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וֵ֭/אלֹהִים מַלְכִּ֣/י מִ/קֶּ֑דֶם פֹּעֵ֥ל יְ֝שׁוּע֗וֹת בְּ/קֶ֣רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: de
  text: Doch Gott ist mein König seit alters her; er vollbringt Rettungstaten mitten auf der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mitten im Land«. Das hebräische Wort kann sowohl die ganze Erde als auch ein bestimmtes Land oder Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: Doch Gott
  rationale: 'Das Präfix וְ wird im Zusammenhang adversativ verstanden: Der Satz stellt der gegenwärtigen Verwüstung das fortdauernde Vertrauen auf Gott gegenüber.'
- source_word: מַלְכִּי
  choice: mein König
  rationale: Das Substantiv mit Suffix der 1. Person Singular bedeutet unmittelbar »mein König«; die Großschreibung entspricht der deutschen Schreibung von Substantiven.
- source_word: מִקֶּדֶם
  choice: seit alters her
  rationale: Die Wendung bezeichnet weit zurückliegende Zeit beziehungsweise lange Dauer. »Seit alters her« bewahrt den poetischen Ton, ohne sie auf den absoluten Anfang festzulegen.
- source_word: פֹּעֵל
  choice: er vollbringt
  rationale: Das Partizip beschreibt Gottes kennzeichnendes beziehungsweise fortdauerndes Handeln. Die finite Wiedergabe ist im Deutschen natürlich und vermittelt tätiges Bewirken.
- source_word: יְשׁוּעוֹת
  choice: Rettungstaten
  rationale: Der hebräische Plural bezeichnet wiederholte Rettungen oder Befreiungen. »Rettungstaten« gibt diesen pluralischen und konkreten Sinn idiomatisch wieder.
- source_word: בְּקֶרֶב
  choice: mitten auf
  rationale: Die Präpositionalverbindung bezeichnet die Mitte beziehungsweise das Innere. In Verbindung mit »Erde« ist »mitten auf der Erde« natürlich und räumlich anschaulich.
- source_word: הָאָרֶץ
  choice: der Erde
  rationale: אֶרֶץ kann sowohl die ganze Erde als auch ein bestimmtes Land bezeichnen. Im Haupttext wird wegen der umfassenden Aussage über Gottes Königtum und Rettungshandeln »Erde« gewählt; die Alternative bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Reichweite von Gottes Rettungstaten
  choice: Erde
  alternative: Land
  rationale: Der hebräische Ausdruck אֶרֶץ lässt beide Bedeutungen zu. Die umfassende Perspektive des Psalms spricht hier eher für »Erde«, doch die mögliche örtliche Bedeutung darf nicht stillschweigend ausgeschlossen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Klang. »Seit alters her« erhält die zeitliche Tiefe des Hebräischen; »Rettungstaten« ist verständlich und bewahrt den Plural konkreter Heilserweise.
