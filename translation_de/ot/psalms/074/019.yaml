  source_fidelity: 'Die Übersetzung gibt beide Vorkommen von חַיַּת kontextgerecht wieder: zuerst als bedrohliches wildes Tier, sodann in der idiomatischen Verbindung als »Leben« der Elenden. »deiner Taube« bewahrt die offene, poetische Metapher von תּוֹרֶךָ. Die Auslieferungsbitte von אַל־תִּתֵּן und die zeitliche Zuspitzung לָנֶצַח werden zutreffend erfasst.'
