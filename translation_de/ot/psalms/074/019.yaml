source:
  edition: WLC
  text: אַל תִּתֵּ֣ן לְ֭/חַיַּת נֶ֣פֶשׁ תּוֹרֶ֑/ךָ חַיַּ֥ת עֲ֝נִיֶּ֗י/ךָ אַל תִּשְׁכַּ֥ח לָ/נֶֽצַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: de
  text: Gib das Leben deiner Taube nicht dem wilden Tier preis; vergiss das Leben deiner Elenden nicht für immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיַּת נֶפֶשׁ תּוֹרֶךָ
  choice: das Leben deiner Taube … dem wilden Tier
  rationale: Die ungewöhnliche Wortfolge wird so wiedergegeben, dass חַיַּת als »wildes Tier« und נֶפֶשׁ תּוֹרֶךָ als »das Leben deiner Taube« verständlich bleiben. »Taube« bewahrt das Bild des hebräischen תּוֹר.
- source_word: חַיַּת עֲנִיֶּיךָ
  choice: das Leben deiner Elenden
  rationale: חַיַּת wird hier im Sinn von »Leben« verstanden; der Singular kann das gemeinsame beziehungsweise kollektive Leben der bedrängten Angehörigen des Gottesvolkes bezeichnen.
- source_word: אַל תִּשְׁכַּח לָנֶצַח
  choice: vergiss … nicht für immer
  rationale: Die zeitlich zugespitzte Bitte wird ohne Abschwächung wiedergegeben.
theological_decisions:
- issue: Bezug der Taube
  choice: Das Bild bleibt als »deine Taube« unaufgelöst.
  alternative: Die Taube ausdrücklich als Gottes Volk oder Gemeinde identifizieren.
  rationale: Der poetische Zusammenhang legt eine kollektive Deutung nahe, doch der Vers selbst erklärt die Metapher nicht ausdrücklich.
- issue: Numerus bei »Leben«
  choice: 'Singular: »das Leben deiner Elenden«'
  alternative: 'Plural: »die Leben deiner Elenden« oder freier »deine Elenden«'
  rationale: Der hebräische Singular wird bewahrt und zugleich im Deutschen natürlich formuliert; seine kollektive Spannung wird nicht unnötig aufgelöst.
translation_notes:
  register: Moderne, würdige Gebetssprache. »Preisgeben« gibt die bedrohliche Auslieferung natürlich wieder; die parallele Wiederholung von »das Leben« bewahrt einen wichtigen Zug des hebräischen Verses.
