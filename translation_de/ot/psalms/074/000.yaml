  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף לָ/מָ֣ה אֱ֭לֹהִים זָנַ֣חְתָּ לָ/נֶ֑צַח יֶעְשַׁ֥ן אַ֝פְּ/ךָ֗ בְּ/צֹ֣אן מַרְעִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/000.yaml
  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: de
  text: Ein Maskil[a] von Asaf. Warum, Gott, hast du uns für immer verstoßen? Warum raucht dein Zorn gegen die Schafe deiner Weide?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Maskil“ ist ein Fachausdruck in Psalmüberschriften; möglicherweise bezeichnet er ein besinnliches oder lehrhaftes Lied.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Der technische Ausdruck der Psalmüberschrift bleibt als Umschrift erhalten, weil seine genaue Bedeutung unsicher ist; die Fußnote nennt die wichtigsten Deutungsmöglichkeiten.
- source_word: זָנַחְתָּ
  choice: hast du uns … verstoßen
  rationale: Das Verb bezeichnet entschiedenes Verwerfen oder Verstoßen; das im Hebräischen mitgemeinte Objekt der ersten Person Plural wird im Deutschen ausdrücklich wiedergegeben.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: raucht dein Zorn
  rationale: Die markante hebräische Bildsprache wird bewahrt, statt sie durch die bloße Aussage „entbrennt“ zu ersetzen.
- source_word: צֹאן מַרְעִיתֶךָ
  choice: die Schafe deiner Weide
  rationale: Die Hirtenmetapher wird konkret und verständlich wiedergegeben; צֹאן ist eine Kollektivbezeichnung für Kleinvieh beziehungsweise eine Schafherde.
theological_decisions:
- issue: Die zeitliche Aussage לָנֶצַח in der Klage
  choice: für immer
  alternative: auf ewig
  rationale: 'Die rhetorische Spannung der Klage bleibt bestehen: Der Beter erlebt Gottes Verstoßen als dauerhaft, ohne dass die Übersetzung daraus eine abschließende dogmatische Aussage macht.'
- issue: Zornesbild und Gottesbeziehung
  choice: „raucht dein Zorn gegen“
  alternative: „entbrennt dein Zorn über“
  rationale: Die anthropomorphe Bildsprache des Ausgangstextes wird nicht geglättet; zugleich wird keine zusätzliche theologische Erklärung eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Klage und das ungewöhnliche Rauchbild bleiben erhalten. „Asafs“ gibt die Zugehörigkeitsangabe knapp wieder, ohne festzulegen, ob Asaf als Verfasser, Tradent oder Bezugsperson gemeint ist.
