source:
  edition: WLC
  text: אַתָּ֤ה פוֹרַ֣רְתָּ בְ/עָזְּ/ךָ֣ יָ֑ם שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים עַל הַ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: de
  text: Du hast durch deine Kraft das Meer zerteilt[a]; du hast die Köpfe der Seeungeheuer[b] auf den Wassern zerschmettert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers kann sowohl Gottes Sieg über das chaotische Meer in poetischer Bildsprache als auch seine Rettungstat am Meer beim Exodus anklingen lassen.
    reason: cross_reference
  - marker: b
    text: Oder „Drachen“ beziehungsweise „große Meerestiere“. Das hebräische Wort תַנִּינִים kann große, schlangenartige Ungeheuer bezeichnen, die mit dem Wasser verbunden sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: zerteilt
  rationale: Die intensive Verbform bezeichnet ein Auseinanderbrechen oder Zerteilen. „Zerteilt“ ist im Zusammenhang mit dem Meer natürlich und bewahrt die entschiedene Kraft der Handlung.
- source_word: בְעָזְּךָ
  choice: durch deine Kraft
  rationale: עֹז bedeutet „Kraft“ oder „Macht“; die Präposition בְּ ist hier am besten instrumental mit „durch“ wiedergegeben.
- source_word: יָם
  choice: das Meer
  rationale: Der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch für das hier gemeinte Meer und lässt sowohl die kosmisch-poetische als auch die Exodus-Anspielung offen.
- source_word: שִׁבַּרְתָּ
  choice: zerschmettert
  rationale: שׁבר bedeutet „zerbrechen“. „Zerschmettert“ gibt die intensive, gewaltsame Aussage im poetischen Parallelismus treffend wieder.
- source_word: רָאשֵׁי
  choice: die Köpfe der
  rationale: Die anatomische Bildsprache des hebräischen Ausdrucks wird unmittelbar und ohne allegorische Auflösung bewahrt.
- source_word: תַנִּינִים
  choice: Seeungeheuer
  rationale: תַנִּינִים kann große, schlangenartige oder unheimliche Wasserwesen bezeichnen. „Seeungeheuer“ vermittelt die poetisch-kosmische Bildwelt verständlich, ohne sie auf gewöhnliche Tiere zu reduzieren.
- source_word: עַל הַמָּיִם
  choice: auf den Wassern
  rationale: „Auf“ gibt עַל direkt wieder; der poetische Plural „den Wassern“ bewahrt das ungewöhnliche Bild, statt es deutend zu „im Wasser“ zu glätten.
theological_decisions:
- issue: Deutung des Meeres und der תַנִּינִים
  choice: Die poetisch-kosmische Bildsprache bleibt im Haupttext erhalten und kann zugleich an Gottes Rettungstat beim Exodus erinnern.
  alternative: Den Vers ausschließlich auf den Exodus beziehen oder ausschließlich als kosmischen Chaoskampf verstehen.
  rationale: Der hebräische Text kann Schöpfungs- und Chaosbildsprache mit der geschichtlichen Rettung am Meer verbinden. Die Übersetzung soll diese Spannung nicht einseitig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit kräftigem poetischem Parallelismus. „Auf den Wassern“ ist bewusst etwas gehoben, da es die hebräische Präposition und den poetischen Plural erhält.
