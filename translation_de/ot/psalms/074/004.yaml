base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/004.yaml
  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: de
  text: Deine Feinde brüllten mitten in deiner Versammlungsstätte[a]; sie stellten ihre eigenen Zeichen als Zeichen auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mitten in deiner Versammlung“ beziehungsweise „an deinem Festort“. Das hebräische Wort kann eine festgesetzte Zeit, eine Versammlung oder eine dafür bestimmte Stätte bezeichnen; im Kontext ist wahrscheinlich ein Versammlungsort gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich wiederholt das Hebräische „Zeichen“: „Sie stellten ihre Zeichen als Zeichen auf.“ Gemeint sein können Embleme oder Feldzeichen, mit denen die Feinde Besitz oder Sieg demonstrierten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: brüllten
  rationale: Das Verb bezeichnet besonders das Brüllen eines Löwen und vermittelt hier einen lauten, bedrohlichen Triumphschrei.
- source_word: צֹרְרֶיךָ
  choice: deine Feinde
  rationale: Das substantivierte Partizip bezeichnet feindlich gesinnte Gegner; „Feinde“ ist im Deutschen natürlich und prägnant.
- source_word: בְּקֶרֶב
  choice: mitten in
  rationale: Die Wendung bezeichnet das Innere beziehungsweise die Mitte eines Ortes und bewahrt die räumliche Zuspitzung.
- source_word: מוֹעֲדֶךָ
  choice: deiner heiligen Versammlungsstätte
  rationale: מוֹעֵד kann eine festgesetzte Zeit, eine Versammlung oder deren Stätte bezeichnen. Im Zusammenhang der Tempelverwüstung liegt eine sakrale Ortsangabe nahe; „Versammlungsstätte“ hält den Bezug zum Zusammenkommen erkennbar.
- source_word: שָׂמוּ
  choice: sie stellten … auf
  rationale: שׂים bedeutet setzen oder stellen; „aufstellen“ passt zur demonstrativen Anbringung feindlicher Zeichen.
- source_word: אוֹתֹתָם אֹתוֹת
  choice: ihre eigenen Zeichen als Zeichen
  rationale: Die ungewöhnliche Wiederholung von אוֹת („Zeichen“) wird bewusst bewahrt. „Eigenen“ verdeutlicht lediglich das Possessivsuffix und den Gegensatz zur entweihten heiligen Stätte.
theological_decisions:
- issue: Bedeutung von מוֹעֵד in der Klage über die Verwüstung des Heiligtums
  choice: 'räumlich-kultisch: „heilige Versammlungsstätte“'
  alternative: „festgesetzte Zeit“, „Versammlung“ oder „Feststätte“
  rationale: Der Kontext schildert das Eindringen der Feinde in den heiligen Raum. Daher ist die örtliche Bedeutung am wahrscheinlichsten, ohne dass der umfassendere Sinn von מוֹעֵד völlig vereindeutigt werden sollte.
- issue: Deutung der doppelten Verwendung von „Zeichen“
  choice: Wiederholung im Haupttext bewahren
  alternative: „sie stellten dort ihre Feldzeichen auf“ oder „ihre Wahrzeichen“
  rationale: Ob Embleme, Feldzeichen oder andere Hoheitszeichen gemeint sind, bleibt im Hebräischen offen. Die Übersetzung vermeidet eine militärische oder kultische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Brüllten“ erhält die raue, tierhafte Gewalt des hebräischen Verbs. Die auffällige Wiederholung „Zeichen als Zeichen“ bleibt trotz ihrer Sperrigkeit erhalten, weil sie zum Ausdruck des Ausgangstextes gehört; die Fußnote erläutert mögliche konkrete Bezüge.
