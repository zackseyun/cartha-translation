  text: אַל תִּ֭שְׁכַּח ק֣וֹל צֹרְרֶ֑י/ךָ שְׁא֥וֹן קָ֝מֶ֗י/ךָ עֹלֶ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/023.yaml
  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: de
  text: Vergiss nicht die Stimme deiner Feinde[a], den Lärm derer, die sich gegen dich erheben; er steigt fortwährend auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Laut deiner Feinde“. Das hebräische Wort kann je nach Zusammenhang „Stimme“, „Laut“ oder „Geräusch“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher und knapper: „Der Lärm derer, die sich gegen dich erheben, steigt fortwährend auf.“'
    reason: syntax_alternative
lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: Vergiss nicht
  rationale: Die Verbindung aus אַל und Imperfekt drückt hier eine Bitte beziehungsweise Aufforderung mit Verneinung aus; die direkte deutsche Entsprechung bewahrt die Gebetssprache.
- source_word: קוֹל
  choice: Stimme
  rationale: קוֹל kann Stimme, Laut oder Geräusch bezeichnen. „Stimme“ erhält den konkreten Grundsinn und lässt im Zusammenhang zugleich den feindlichen Aufschrei anklingen.
- source_word: צֹרְרֶיךָ
  choice: deiner Feinde
  rationale: Das substantivierte Partizip bezeichnet Menschen, die Gott anfeinden; „Feinde“ ist im Deutschen direkt und natürlich.
- source_word: שְׁאוֹן
  choice: Lärm
  rationale: שְׁאוֹן bezeichnet lautes, unruhiges Getöse oder einen Tumult. „Lärm“ ist gegenwärtig, verständlich und bildet eine natürliche Parallele zu „Stimme“.
- source_word: קָמֶיךָ
  choice: derer, die sich gegen dich erheben
  rationale: Die Wiedergabe bewahrt das verbale Bild von קום und macht deutlich, dass das Sich-Erheben feindlich gegen Gott gerichtet ist.
- source_word: עֹלֶה
  choice: steigt ... auf
  rationale: Das Partizip von עלה schildert den Lärm als fortwährend aufsteigend. „steigt auf“ erhält dieses räumliche Bild.
- source_word: תָמִיד
  choice: unaufhörlich
  rationale: תָמִיד bezeichnet hier die beständige Dauer des feindlichen Lärms; „unaufhörlich“ ist idiomatisch und bringt dessen bedrängenden Charakter zum Ausdruck.
theological_decisions:
- issue: Bezug des aufsteigenden Lärms
  choice: Das Pronomen „er“ bezieht עֹלֶה auf den unmittelbar zuvor genannten „Lärm“.
  alternative: Eine engere, knappere Fügung wie „der Lärm ... steigt unaufhörlich auf“ ist ebenfalls möglich.
  rationale: Der hebräische Singular עֹלֶה stimmt mit שְׁאוֹן überein. Die deutsche Satzteilung verdeutlicht diesen Bezug, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede Gottes bleibt im vertrauten Singular „du“. Der Parallelismus und das Bild des aufsteigenden feindlichen Lärms werden bewahrt; die Satzteilung sorgt für natürliche Verständlichkeit.
