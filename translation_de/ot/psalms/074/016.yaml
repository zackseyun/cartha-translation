  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: de
  text: Dein ist der Tag, und dein ist auch die Nacht. Du hast das Licht[a] und die Sonne geordnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Leuchtkörper“. Manche verstehen damit wegen der Gegenüberstellung von Tag und Nacht den Mond; im hebräischen Text steht jedoch nicht ausdrücklich „Mond“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: dein ist
  rationale: Die Präposition ל mit Suffix drückt hier Besitz bzw. Zugehörigkeit aus. Die vorangestellte Formulierung „Dein ist“ bewahrt die Betonung des Hebräischen und klingt im poetischen Register würdig.
- source_word: יוֹם
  choice: der Tag
  rationale: Übliche Wiedergabe von יוֹם im Gegensatz zu „Nacht“.
- source_word: אַף
  choice: auch
  rationale: אַף fügt die Nacht nachdrücklich zum Tag hinzu; „auch“ gibt diese additive Bedeutung im modernen Deutsch klar wieder.
- source_word: לָיְלָה
  choice: die Nacht
  rationale: Übliche Wiedergabe in der Gegenüberstellung mit „Tag“.
- source_word: אַתָּה
  choice: Du
  rationale: 'Das ausdrücklich gesetzte Pronomen wird beibehalten und trägt die Betonung: Gott selbst hat die kosmische Ordnung geschaffen.'
- source_word: הֲכִינוֹתָ
  choice: fest an ihren Platz gesetzt
  rationale: Das Hifil von כון bezeichnet hier das Festsetzen, Einrichten oder Etablieren. Die Formulierung gibt die kosmische Ordnung anschaulich und natürlich wieder.
- source_word: מָאוֹר
  choice: das Licht
  rationale: מָאוֹר kann „Licht“ oder „Leuchtkörper“ bezeichnen. „Licht“ wahrt die lexikalische Offenheit und vermeidet, den nicht ausdrücklich genannten Mond in den Haupttext einzutragen.
- source_word: וָשָׁמֶשׁ
  choice: und die Sonne
  rationale: Direkte Wiedergabe der Konjunktion und des Nomens; der bestimmte Artikel ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutung von מָאוֹר neben שֶׁמֶשׁ
  choice: מָאוֹר wird als „Licht“ wiedergegeben und von „der Sonne“ unterschieden.
  alternative: „Leuchtkörper“; aufgrund der Gegenüberstellung von Tag und Nacht kontextuell auch „Mond“.
  rationale: Der hebräische Text nennt nicht ausdrücklich den Mond. „Licht“ bewahrt den Wortlaut und die Mehrdeutigkeit, ohne die poetische Bildwelt interpretierend festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischer Satzstellung. Die Wiederholung „Dein ist“ erhält den Parallelismus und die Besitzbetonung des Hebräischen; die Verbformulierung macht das kosmische Festsetzen natürlich verständlich.
