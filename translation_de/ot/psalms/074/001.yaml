id: PSA.74.1
reference: Psalms 74:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף לָ/מָ֣ה אֱ֭לֹהִים זָנַ֣חְתָּ לָ/נֶ֑צַח יֶעְשַׁ֥ן אַ֝פְּ/ךָ֗ בְּ/צֹ֣אן מַרְעִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: de
  text: 'Ein Maskil von Asaf.[a]

    Warum, Gott, hast du uns für immer verworfen? Warum raucht dein Zorn gegen die Schafe deiner Weide?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Maskil“ ist ein Fachbegriff in Psalmüberschriften; möglicherweise bezeichnet er ein besinnliches oder lehrhaftes Lied.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Der Fachbegriff der Psalmüberschrift hat eine unsichere genaue Bedeutung. Die Transliteration bewahrt diese Offenheit; mögliche Bedeutungen werden in der Fußnote erläutert.
- source_word: לְאָסָף
  choice: von Asaf
  rationale: Das Präfix ל kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung bezeichnen. „Von Asaf“ ist im Deutschen natürlich, ohne die Beziehung genauer festzulegen.
- source_word: לָמָה
  choice: Warum
  rationale: Die direkte Frage entspricht dem Klagecharakter und ist idiomatisches Deutsch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Vokativ wird im Deutschen durch die direkte Anrede ohne zusätzliches „o“ natürlich wiedergegeben.
- source_word: זָנַחְתָּ
  choice: hast du uns ... verworfen
  rationale: Das Verb bezeichnet Zurückweisung beziehungsweise Verstoßung. „Verworfen“ wahrt die starke Sprache der Bundesklage und bleibt verständlich.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte oder als endlos empfundene Dauer; „für immer“ ist natürlich und eindringlich.
- source_word: יֶעְשַׁן
  choice: raucht
  rationale: Die wörtliche Rauchmetapher wird bewahrt, statt sie zum bloßen „Brennen“ des Zorns abzuflachen.
- source_word: אַפְּךָ
  choice: dein Zorn
  rationale: Das wörtliche „deine Nase/dein Nasenloch“ ist ein hebräisches Idiom für Zorn. „Zorn“ vermittelt den Sinn, während „raucht“ einen Teil des Körperbildes erhält.
- source_word: בְּצֹאן מַרְעִיתֶךָ
  choice: gegen die Schafe deiner Weide
  rationale: Die konkrete Hirtenmetapher wird erhalten. „Gegen“ gibt die feindliche Ausrichtung des Zorns wieder.
theological_decisions:
- issue: Das Objekt der ersten Person Plural bei זָנַחְתָּ
  choice: hast du uns verworfen
  alternative: hast du [dein Volk] verworfen
  rationale: Der masoretische Text und der Zusammenhang der gemeinschaftlichen Klage vermitteln das Objekt „uns“. Die Übersetzung nennt es ausdrücklich, ohne es deutend zu „dein Volk“ zu erweitern.
- issue: Zeitliche Aussage von לָנֶצַח in der Klage
  choice: für immer
  alternative: auf Dauer
  rationale: Die starke, theologisch spannungsvolle Wahrnehmung der Betenden wird nicht abgeschwächt. Die Aussage wird als Klage wiedergegeben, nicht als systematische Behauptung über Gottes endgültiges Handeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Klageform und das markante Bild vom rauchenden Zorn bleiben erhalten. Der Fußnotenmarker steht nach der vollständigen Überschrift, damit klar ist, dass sich die Anmerkung auf „Maskil“ bezieht.
