  source_fidelity: Die Übersetzung gibt die hebräische Überschrift und beide Klagefragen treffend wieder. „uns“ ist durch die Verbform eingeschlossen; „für immer“ wahrt die zugespitzte Dauerangabe der Klage. „raucht dein Zorn“ erhält das auffällige Bild von יֶעְשַׁן אַפְּךָ, und „gegen die Schafe deiner Weide“ entspricht der pastoralen Metapher von בְּצֹאן מַרְעִיתֶךָ.
