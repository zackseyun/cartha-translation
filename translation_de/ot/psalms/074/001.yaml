  terminology: „Maskil“ ist sinnvoll transliteriert, da die genaue Gattungsbezeichnung unsicher ist; die Fußnote erläutert dies zurückhaltend. „Asaf“, „Zorn“, „Schafe“ und „Weide“ sind konsistent und verständlich.
