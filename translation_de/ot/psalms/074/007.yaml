source:
  edition: WLC
  text: שִׁלְח֣וּ בָ֭/אֵשׁ מִקְדָּשֶׁ֑/ךָ לָ֝/אָ֗רֶץ חִלְּל֥וּ מִֽשְׁכַּן שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: de
  text: Sie legten Feuer an dein Heiligtum[a]; bis auf den Grund entweihten sie die Wohnstätte deines Namens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sie sandten Feuer in dein Heiligtum.« Gemeint ist, dass sie es in Brand setzten.'
    reason: lexical_alternative
  - marker: b
    text: »Wohnstätte deines Namens« bezeichnet den Ort, den Gott erwählt hatte, damit sein Name dort wohne.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: legten Feuer an
  rationale: Die Verbindung bedeutet hier, dass die Feinde das Heiligtum in Brand setzten. Die deutsche Wendung gibt die Handlung natürlich wieder, ohne die hebräische Bildlichkeit unnötig auszubauen.
- source_word: מִקְדָּשֶׁךָ
  choice: dein Heiligtum
  rationale: מִקְדָּשׁ bezeichnet einen heiligen Ort. »Heiligtum« bewahrt die lexikalische Weite und legt den Ausdruck nicht vorschnell auf »Tempel« fest.
- source_word: לָאָרֶץ
  choice: bis auf den Grund
  rationale: In Verbindung mit der Entweihung bezeichnet die Wendung deren umfassendes, bis zur Zerstörung reichendes Ausmaß. Zugleich bleibt die Zuordnung im hebräischen Satz syntaktisch mehrdeutig.
- source_word: חִלְּלוּ
  choice: entweihten
  rationale: Das Piel von חלל bezeichnet die Entheiligung dessen, was heilig ist. »Entweihten« ist im heutigen Deutschen klar und kultisch passend.
- source_word: מִשְׁכַּן שְׁמֶךָ
  choice: die Wohnstätte deines Namens
  rationale: Die Wiedergabe erhält sowohl das Bild der Wohnstätte als auch die theologisch bedeutsame Rede vom dort wohnenden Namen Gottes.
theological_decisions:
- issue: Unterscheidung von מִקְדָּשׁ und מִשְׁכַּן
  choice: »Heiligtum« und »Wohnstätte«
  alternative: »Tempel« und »Heiligtum«
  rationale: 'Zwei verschiedene deutsche Begriffe spiegeln die beiden verwandten hebräischen Ausdrücke und bewahren den poetischen Gedanken: Der Ort ist heilig und zugleich Wohnstätte des Namens Gottes.'
- issue: Bewahrung der Namenstheologie
  choice: »Wohnstätte deines Namens«
  alternative: »deine Wohnstätte« oder »der Ort, an dem du wohnst«
  rationale: Der hebräische Text spricht ausdrücklich vom Namen Gottes. Diese Formulierung wahrt die Spannung zwischen Gottes Gegenwart am Heiligtum und seiner Nichtbegrenztheit auf ein Gebäude.
- issue: Syntaktische Zuordnung von לָאָרֶץ
  choice: 'Zu »entweihten« gezogen: »bis auf den Grund entweihten sie …«'
  alternative: 'Als Ergebnis der Zerstörung der Wohnstätte verstanden: »sie entweihten die Wohnstätte deines Namens bis auf den Grund«'
  rationale: Die Stellung im Hebräischen lässt eine gewisse Spannung zwischen Ausmaß der Entweihung und Niederwerfung des Heiligtums bestehen. Die Hauptfassung folgt der unmittelbaren Verbindung mit חִלְּלוּ, während eine Fußnote die alternative Akzentuierung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Kultbegriffe bleiben unterschieden; die biblische Rede von der Wohnstätte des göttlichen Namens wird nicht geglättet. »Bis auf den Grund« steht vor dem Verb, um die im Hebräischen naheliegende Verbindung mit der Entweihung auszudrücken; die alternative Lesart wird in der Fußnote bewahrt.
