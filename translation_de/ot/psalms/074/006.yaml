  yaml_path: translation/ot/psalms/074/006.yaml
  text: And now they smash all its carved work together with hatchet and hammers[a][b].
translation:
  language: de
  text: Und nun zerschlagen sie all ihre Schnitzereien mit Beil und Hämmern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Axt und Schlegeln“. Die hebräischen Wörter bezeichnen bestimmte Schneide- und Schlagwerkzeuge; ihre genaue moderne Entsprechung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַת
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb leitet die gegenwärtige Zerstörungsszene ein und wahrt den Zusammenhang mit dem vorherigen Vers.
- source_word: פִּתּוּחֶיהָ
  choice: ihre Schnitzereien
  rationale: Das Wort bezeichnet geschnitzten oder gravierten Schmuck; der feminine Suffixbezug wird mit „ihre“ bewahrt.
- source_word: יַחַד
  choice: all
  rationale: Hier drückt das Adverb die Gesamtheit der Schnitzereien aus. Im Deutschen gibt „all ihre Schnitzereien“ den Sinn natürlicher wieder als ein potenziell missverständliches „zusammen“.
- source_word: בְּכַשִּׁיל
  choice: mit Beil
  rationale: Gemeint ist ein schneidendes Werkzeug zur Holzbearbeitung; „Beil“ ist verständlich und wahrt die Einzahl, doch die genaue moderne Entsprechung ist unsicher.
- source_word: וְכֵילַפּוֹת
  choice: und Hämmern
  rationale: Das seltene Wort bezeichnet offenbar Schlagwerkzeuge. „Hämmer“ ist im Kontext natürlich, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: יַהֲלֹמוּן
  choice: zerschlagen sie
  rationale: Das Verb bezeichnet kräftiges Schlagen; „zerschlagen“ bringt im Zusammenhang die zerstörerische Wirkung angemessen zum Ausdruck.
