source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: de
  text: Steh auf, Gott! Führe deinen Rechtsstreit! Denk an deine Schmach durch den Tor, die ständig andauert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Tor“ ist hier kein bloß unverständiger Mensch gemeint, sondern ein sittlich verdorbener, gottloser Mensch.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ von קום mit paragogischem ה ist ein dringender Aufruf an Gott zum Handeln. „Steh auf“ ist gegenwärtiges, natürliches Deutsch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Direkte Anrede; der deutsche Vokativ benötigt kein zusätzliches „o“.
- source_word: רִיבָה רִיבֶךָ
  choice: Führe deinen Rechtsstreit
  rationale: Die figura etymologica aus Verb und Substantiv bezeichnet das aktive Austragen einer Rechtssache. „Führe deinen Rechtsstreit“ bewahrt das juristische Bild und klingt im Deutschen idiomatisch.
- source_word: זְכֹר
  choice: Denk daran
  rationale: Der Imperativ fordert Gott auf, sich der Sache erinnernd anzunehmen. „Denk daran“ gibt dies natürlich wieder, ohne die erbetene Handlung auszudeuten.
- source_word: חֶרְפָּתְךָ
  choice: wie … dich … verhöhnt
  rationale: חֶרְפָּה bezeichnet Schmach, Beschimpfung oder Verhöhnung. Die verbale Umformung macht im Deutschen klar und natürlich, dass der Spott gegen Gott gerichtet ist.
- source_word: מִנִּי נָבָל
  choice: wie der Tor dich … verhöhnt
  rationale: מִנִּי kennzeichnet hier den Urheber der Schmähung. נָבָל bezeichnet im Psalmenkontext einen sittlich verdorbenen, gottlosen Menschen, nicht bloß einen intellektuell Unverständigen.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung bezeichnet ein fortdauerndes Geschehen während des ganzen Tages; die gewählte Form ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Bezug von חֶרְפָּתְךָ („deine Schmach“)
  choice: Verhöhnung, die gegen Gott gerichtet ist
  alternative: Schmach, die Gottes Volk trifft und aufgrund seiner Zugehörigkeit zugleich Gott gilt
  rationale: Das Suffix bezieht die Schmähung am unmittelbarsten auf Gott und passt zu „deinen Rechtsstreit“. Der weitere Psalmzusammenhang verbindet jedoch die Entehrung Gottes mit den Angriffen auf sein Heiligtum und sein Volk; die Formulierung fügt keine konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Imperative bewahren die Dringlichkeit des Gebets; das juristische Sprachbild bleibt mit „Rechtsstreit“ erhalten. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen Begriff er sich bezieht.
