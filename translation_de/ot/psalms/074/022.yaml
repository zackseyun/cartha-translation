review_pass:
  verdict: revise
  source_fidelity: „Steh auf, Gott! Führe deinen Rechtsstreit!“ gibt die beiden dringlichen Imperative und die משפטlich-juridische figura etymologica רִיבָה רִיבֶךָ treffend wieder. Die Fassung „Denk daran, wie der Tor dich … verhöhnt“ entfaltet חֶרְפָּתְךָ jedoch zu einer eindeutigen Verhöhnung Gottes. Das ist gut möglich, legt aber die im hebräischen Possessiv-Ausdruck und im Psalmkontext verbleibende Deutung stärker fest als nötig.
  naturalness: Die vorgeschlagene Revision bleibt modernes, würdiges und gut verständliches Standarddeutsch. „Schmach“ ist hier als gehobenes, aber im Psalmregister natürliches Wort angemessen; „ständig“ gibt die fortdauernde zeitliche Angabe idiomatisch wieder.
  terminology: „Rechtsstreit“ bewahrt das juristische Bild. „Tor“ ist als traditionelle biblische Kategorie brauchbar, benötigt aber die vorhandene Fußnote, damit es nicht als bloße intellektuelle Einschränkung missverstanden wird. „Schmach“ entspricht חֶרְפָּה besser als die bereits interpretierende Verbform „verhöhnen“.
  issues:
  - severity: medium
    issue: Die Umformung von „deine Schmach“ zu „wie der Tor dich ... verhöhnt“ legt den Bezug der Schmach als direkt gegen Gott gerichteten Spott fest.
    rationale: חֶרְפָּתְךָ kann zwar sehr wohl die Gott zugefügte Schmähung meinen, doch die possessive Formulierung lässt im Zusammenhang des Psalms auch die mit Gottes Volk verbundene Schmach offen. Die Übersetzung sollte diese Spannung nicht auflösen.
  - severity: low
    issue: „den ganzen Tag“ wird in der deutschen Verbform ausschließlich der Handlung des Tors zugeordnet.
    rationale: Im Hebräischen ist die genaue syntaktische Reichweite der Zeitangabe nicht eigens markiert. „ständig“ bewahrt den Gedanken fortdauernder Schmähung ohne eine unnötig enge Satzgliederzuordnung.
