revisions:
- from: Steh auf, Gott! Führe deinen Rechtsstreit! Denk daran, wie der Tor dich den ganzen Tag verhöhnt.[a]
  to: Steh auf, Gott! Führe deinen Rechtsstreit! Denk an deine Schmach durch den Tor, die ständig andauert.[a]
  rationale: Die Revision behält Anrede, Dringlichkeit und das Rechtsbild bei, übersetzt חֶרְפָּתְךָ wieder als Nominalausdruck und vermeidet dadurch eine übermäßige Festlegung auf eine einzige Deutung des Besitzsuffixes. Die fortdauernde zeitliche Angabe wird natürlich wiedergegeben; der Fußnotenanker bleibt beim Ausdruck „Tor“.
