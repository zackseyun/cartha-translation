  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: de
  text: Du hast Quellen und Bäche aufgebrochen; du hast ständig fließende Flüsse ausgetrocknet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beständige Flüsse“.'
    reason: אֵיתָן kann bei Gewässern deren Dauerhaftigkeit bzw. beständigen Wasserfluss bezeichnen.
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: hast … aufbrechen lassen
  rationale: Das Verb bezeichnet ein Spalten oder Aufbrechen. Die deutsche Wendung bewahrt das Bild und lässt hier zugleich erkennen, dass dadurch Wasser hervortritt.
- source_word: מַעְיָן וָנָחַל
  choice: Quellen und Bäche
  rationale: מַעְיָן bezeichnet eine Quelle, נַחַל einen Bach, Wasserlauf oder ein Wadi. „Bäche“ ist im Deutschen natürlich und verständlich, ohne die Stelle unnötig auf eine bestimmte Landschaftsform festzulegen.
- source_word: נַהֲרוֹת אֵיתָן
  choice: immerzu fließende Ströme
  rationale: אֵיתָן beschreibt hier Dauerhaftigkeit beziehungsweise beständigen Wasserfluss; „immerzu fließend“ gibt den Gegensatz zum Austrocknen klar wieder.
theological_decisions:
- issue: Bezug der beiden Vershälften auf Schöpfung oder Heilsgeschichte
  choice: Die Bildsprache bleibt ohne ausdrückliche historische Zuordnung stehen.
  alternative: Die Formulierungen ausdrücklich auf Schöpfung, Wüstenwunder oder Jordandurchzug beziehen.
  rationale: Der hebräische Vers nennt kein einzelnes Ereignis; eine eindeutige Zuordnung würde die Offenheit des poetischen Rückblicks unzulässig einschränken.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Der parallele Satzbau und der starke Gegensatz zwischen hervorbrechendem und austrocknendem Wasser bleiben erhalten.
