lexical_decisions:
- source_word: יִוָּדַע
  choice: Er war zu erkennen
  rationale: Das Nifal Imperfekt 3. Person maskulin Singular von ידע bezeichnet hier in der poetischen Rückschau ein Erkanntwerden bzw. Sichtbarwerden. Die maskuline Einzahl bleibt erhalten; der genaue Bezug ist im knappen hebräischen Satz nicht ausdrücklich genannt.
- source_word: כְּמֵבִיא
  choice: wie einer, der … emporhebt
  rationale: כְּ kennzeichnet den Vergleich. Das Hifil-Partizip von בוא bedeutet formal „herbeibringend“ beziehungsweise „hinaufführend“; zusammen mit לְמָעְלָה und den Äxten gibt „emporhebt“ das Bild verständlich wieder, ohne bereits das Zuschlagen einzutragen.
- source_word: לְמָעְלָה
  choice: empor
  rationale: Die Wendung bezeichnet eine Bewegung nach oben und wird natürlich mit dem Verb „emporhebt“ verbunden.
- source_word: בִּסֲבָךְ
  choice: im Dickicht
  rationale: סְבָךְ bezeichnet dichtes Gehölz. Die Präposition בְּ wird hier örtlich als „im“ wiedergegeben; eine gerichtete Deutung wie „gegen“ oder „in … hinein“ bleibt möglich.
- source_word: עֵץ
  choice: der Bäume
  rationale: עֵץ kann „Baum“ oder „Holz“ heißen. Bei „Dickicht“ bezeichnet „der Bäume“ das bewachsene Gelände verständlicher, während die Alternative „Holz“ in der Fußnote bewahrt wird.
- source_word: קַרְדֻּמּוֹת
  choice: Äxte
  rationale: Der Plural bezeichnet Werkzeuge zum Behauen von Holz. „Äxte“ ist im Kontext sachgerecht und allgemein verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildfolge und der unklare Bezug des maskulinen Singulars werden nicht durch eine ausdrücklich ergänzte Personengruppe aufgelöst. „Emporhebt“ ist bildhaft, aber weniger deutend als „schwingt“ oder „schlägt“.
