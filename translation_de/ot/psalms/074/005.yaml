  text: He was known like one who lifts up axes in a thicket of trees[a][b][c].
translation:
  language: de
  text: Man erkannte ihn wie einen, der im Dickicht der Bäume Äxte emporhebt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wurde bekannt wie einer, der Äxte nach oben bringt.“ Der hebräische Satz ist knapp; insbesondere die genaue syntaktische Beziehung des Vergleichs bleibt unsicher.'
