  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: de
  text: Unsere Zeichen sehen wir nicht; es gibt keinen Propheten mehr, und niemand unter uns weiß, wie lange noch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: unsere Zeichen
  rationale: אוֹת bezeichnet allgemein ein Zeichen, Kennzeichen oder Wahrzeichen. „Zeichen“ bewahrt die im Hebräischen nicht näher bestimmte Bedeutung, ohne Tempelsymbole, göttliche Machterweise oder Feldzeichen festzulegen.
- source_word: לֹא רָאִינוּ
  choice: sehen wir nicht
  rationale: Das Perfekt beschreibt hier im Klagezusammenhang den gegenwärtig erfahrenen Zustand des Nichtsehens. Die präsentische Wiedergabe klingt im Deutschen natürlich und unmittelbar.
- source_word: אֵין עוֹד נָבִיא
  choice: kein Prophet ist mehr da
  rationale: אֵין עוֹד drückt aus, dass etwas nicht mehr vorhanden ist. Der Singular נָבִיא kann generisch verstanden werden; die Formulierung bezeichnet das völlige Fehlen eines Propheten.
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: und niemand bei uns weiß
  rationale: Die knappe hebräische Konstruktion besagt idiomatisch, dass sich in der Gemeinschaft niemand befindet, der es weiß. „Bei uns“ gibt אִתָּנוּ direkt und natürlich wieder.
- source_word: עַד מָה
  choice: wie lange noch
  rationale: עַד מָה ist in Klagepsalmen eine übliche Frage nach der Dauer. Das deutsche „noch“ verdeutlicht idiomatisch die erwartete Fortdauer, ohne einen Endzeitpunkt festzulegen.
theological_decisions:
- issue: Bezug von „unsere Zeichen“
  choice: Die offene Formulierung „unsere Zeichen“ bleibt erhalten.
  alternative: „unsere Feldzeichen“, „unsere Wahrzeichen“ oder „die Zeichen der Gegenwart Gottes bei uns“
  rationale: Der hebräische Text bestimmt die Zeichen nicht näher. Eine Festlegung auf kultische Symbole, Wunderzeichen oder militärische Feldzeichen würde eine historische oder theologische Deutung in die Übersetzung eintragen.
- issue: Reichweite des fehlenden Propheten
  choice: „kein Prophet ist mehr da“
  alternative: „es gibt keinen Propheten mehr“
  rationale: Die Aussage wird als umfassende Klage über das Fehlen prophetischer Auskunft wiedergegeben, ohne zu entscheiden, ob sie nur die konkrete Gemeinschaft und Krise oder eine größere Epoche meint.
translation_notes:
  register: Moderne, würdige Klagesprache mit natürlicher deutscher Satzstellung. Die Voranstellung „Unsere Zeichen“ nimmt die hebräische Hervorhebung auf. Das Semikolon bewahrt die enge Verbindung der drei Aussagen, ohne sie zu einem einzigen erklärenden Gedankengang zu glätten.
