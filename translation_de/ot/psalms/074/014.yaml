  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: de
  text: Du hast die Köpfe des Leviatan zerschmettert; du hast ihn den Wüstentieren[a] zur Speise gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Bewohnern der Wüste“. Der hebräische Ausdruck ist schwierig und kann Bewohner oder Tiere trockener Gegenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: zerschmettert
  rationale: Das Verb רצץ bezeichnet gewaltsames Zerbrechen oder Zermalmen; „zerschmettert“ bewahrt die Kraft des poetischen Bildes.
- source_word: רָאשֵׁי
  choice: die Köpfe
  rationale: Der hebräische Plural wird direkt wiedergegeben und bewahrt die Darstellung Leviatans als mehrköpfiges Ungeheuer.
- source_word: לִוְיָתָן
  choice: Leviatan
  rationale: Der mythopoetische Name wird transliteriert, damit seine innerbiblischen Bezüge und die Offenheit des Bildes erhalten bleiben.
- source_word: תִּתְּנֶנּוּ
  choice: du gabst ihn
  rationale: נתן bedeutet gewöhnlich „geben“; das maskuline Singularsuffix bezieht sich auf Leviatan.
- source_word: מַאֲכָל
  choice: zur Speise
  rationale: מַאֲכָל bezeichnet Nahrung; „zur Speise“ ist im Deutschen würdig und syntaktisch natürlich.
- source_word: לְעָם לְצִיִּים
  choice: den Wüstenbewohnern
  rationale: Die schwierige Wortgruppe bezeichnet wahrscheinlich Bewohner beziehungsweise Lebewesen trockener Gegenden. Die knappe Wiedergabe wahrt die lexikalische Offenheit; die mögliche tierische Bedeutung wird in der Fußnote genannt.
theological_decisions:
- issue: Art des Leviatan-Bildes
  choice: „Leviatan“ als poetisch-kosmisches Bild unverändert beibehalten
  alternative: Leviatan ausdrücklich als Seeungeheuer, Ägypten oder chaotische Mächte deuten
  rationale: Der Vers legt nicht eindeutig fest, ob ein wirkliches Wesen, ein mythopoetisches Symbol oder ein geschichtlicher Feind gemeint ist; die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger poetischer Bildsprache. „Zur Speise“ erhält den gehobenen Psalmton, ohne veraltet zu wirken.
