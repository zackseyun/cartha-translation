  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: de
  text: Dann werde ich zum Altar Gottes kommen, zu Gott, der Freude meines Jubels[a], und ich werde dich mit der Leier[b] preisen, Gott, mein Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „zu Gott, meiner höchsten Freude“. Wörtlich steht im Hebräischen „zu Gott, der Freude meines Jubels“; zwei verwandte Freudenwörter verstärken einander.'
    reason: lexical_alternative
  - marker: b
    text: Die Leier war ein antikes Saiteninstrument; traditionell wird hier auch „Harfe“ übersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: Dann werde ich … kommen
  rationale: Die Kohortativform der 1. Person Singular drückt im Zusammenhang die beabsichtigte Folge beziehungsweise den festen Entschluss aus. „Dann werde ich … kommen“ bewahrt sowohl die Bewegungsbedeutung von בוא als auch den Anschluss an die vorausgehenden Bitten.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: zum Altar Gottes
  rationale: Die deutsche Genitivverbindung gibt die hebräische Konstruktverbindung klar, würdig und unmittelbar wieder.
- source_word: אֶל אֵל
  choice: zu Gott
  rationale: אֵל bezeichnet hier parallel zu אֱלֹהִים Gott. Eine Wiedergabe als „der Mächtige“ würde eine Unterscheidung stärker hervorheben, als es der Kontext verlangt.
- source_word: שִׂמְחַת גִּילִי
  choice: der Freude meines Jubels
  rationale: Die Formulierung bewahrt die ungewöhnliche Verbindung zweier nah verwandter Freude-Wörter und damit die poetische Intensivierung, ohne sie auf eine einzige Steigerungsformel zu reduzieren.
- source_word: וְאוֹדְךָ
  choice: und ich werde dich … preisen
  rationale: ידה im Hifil kann Danken oder Preisen bezeichnen. Musikalischer Gottesdienst und direkte Anrede sprechen hier für „preisen“.
- source_word: בְכִנּוֹר
  choice: mit der Leier
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument, das wahrscheinlich eher einer Leier als einer modernen Harfe entsprach.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: Gott, mein Gott
  rationale: Die Wiederholung wird als direkte Anrede und persönliches Bekenntnis unverändert bewahrt; im Deutschen ist dafür kein zusätzliches „o“ nötig.
theological_decisions:
- issue: Wiedergabe der verschiedenen Gottesbezeichnungen אֱלֹהִים und אֵל
  choice: Beide werden mit „Gott“ wiedergegeben; die poetische Wiederholung bleibt erhalten.
  alternative: אֵל als „der mächtige Gott“ oder als „El“ wiedergeben.
  rationale: Der Vers setzt die Bezeichnungen poetisch parallel, ohne erkennbar eine lehrmäßige Unterscheidung zwischen ihnen zu entfalten. „Gott“ wahrt den gemeinsamen Bezug und vermeidet eine unbegründete Präzisierung.
- issue: Deutung der doppelten Freudesprache שִׂמְחַת גִּילִי
  choice: Die formale Spannung wird als „der Freude meines Jubels“ bewahrt.
  alternative: Sinngemäß „meine höchste Freude“ oder „meine übergroße Freude“.
  rationale: Die hebräische Wortverbindung kann als Intensivierung verstanden werden, nennt Gott aber wörtlich die Freude des Jubels des Beters. Die Übersetzung lässt diese poetische und theologische Aussage stehen, statt sie ausschließlich als Gradangabe aufzulösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Würde. Die auffällige hebräische Freudenformel bleibt im Haupttext sichtbar; die geläufigere sinngemäße Wiedergabe steht in der Fußnote. Die Satzstellung folgt dem hebräischen Gedankengang, bleibt aber im Deutschen gut verständlich.
