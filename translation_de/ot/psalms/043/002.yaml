  naturalness: Der Text ist modernes, würdiges Standarddeutsch und wahrt den poetischen Klagerhythmus. „Gott meiner Zuflucht“ ist in diesem Register idiomatisch. „Bedrückung durch den Feind“ ist klarer und natürlicher als eine genitivische Zuordnung, die den Feind missverständlich als den Bedrückten lesen lassen könnte.
