  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: de
  text: Denn du bist der Gott meiner Zuflucht[a]. Warum hast du mich verworfen? Warum gehe ich trauernd umher unter der Bedrückung durch den Feind[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Gott meiner Festung« oder »der Gott meiner Stärke«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Warum gehe ich verdüstert umher wegen der Bedrückung durch den Feind?« Das hebräische Wort bedeutet wörtlich etwa »dunkel, verdüstert« und kann Trauer ausdrücken; die Präposition kann die Bedrückung als Umstand oder Ursache kennzeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der Bitte ein und bewahrt den argumentativen Zusammenhang.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: der Gott meiner Zuflucht
  rationale: Bewahrt die Konstruktverbindung und den Schutzgedanken von מָעוֹז; auch »Festung« oder »Stärke« sind möglich.
- source_word: לָמָה
  choice: Warum
  rationale: Die zweimalige Wiedergabe erhält die eindringliche Wiederholung der Klage.
- source_word: זְנַחְתָּנִי
  choice: hast du mich verworfen
  rationale: זנח bezeichnet Zurückweisung oder Verwerfung; »verworfen« erhält die Schärfe der Klage, ohne vollständiges Verlassen ausdrücklich hinzuzufügen.
- source_word: קֹדֵר
  choice: trauernd
  rationale: Das Wort bezeichnet wörtlich einen verdüsterten Zustand und kann idiomatisch Trauer ausdrücken.
- source_word: אֶתְהַלֵּךְ
  choice: gehe ich ... umher
  rationale: Gibt die andauernde Bewegung beziehungsweise Lebenslage des Hitpael-Imperfekts natürlich wieder.
- source_word: בְּלַחַץ
  choice: unter dem Druck
  rationale: לַחַץ kann Bedrängnis, Unterdrückung oder Druck bezeichnen; die Formulierung bewahrt das Bild einer belastenden Lage.
- source_word: אוֹיֵב
  choice: des Feindes
  rationale: Der bestimmte Singular bezeichnet den bekannten oder repräsentativen Gegner.
theological_decisions:
- issue: Aussage über göttliche Verwerfung in der Klage
  choice: Warum hast du mich verworfen?
  alternative: Warum hast du mich verstoßen?
  rationale: Die direkte Klage und die Spannung zwischen Gott als Zuflucht und der erfahrenen Zurückweisung bleiben ungemildert stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und die Spannung der Klage werden bewahrt; »unter dem Druck« ist verständlich, ohne die möglichen Nuancen von Bedrängnis und Unterdrückung auszuschließen.
