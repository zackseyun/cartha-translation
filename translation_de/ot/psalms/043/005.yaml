base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: de
  text: 'Warum bist du so niedergeschlagen, meine Seele, und warum bist du so aufgewühlt in mir? Hoffe auf Gott! Denn ich werde ihn noch preisen: die Rettung meines Angesichts[a] und meinen Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Rettungen meines Angesichts und mein Gott“. Die hebräische Schlusswendung ist ungewöhnlich. Sie kann Gott als den bezeichnen, dessen Rettung das niedergeschlagene Angesicht wieder aufrichtet. Möglich ist auch: „die Hilfe meines Angesichts und meinen Gott“.'
    reason: Die Fußnote dokumentiert die Pluralform und die ungewöhnliche hebräische Konstruktion, ohne ihre Deutung im Haupttext festzulegen.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: bist du so niedergeschlagen
  rationale: Das Verb bezeichnet ein Sich-Niederbeugen und kann im Selbstgespräch des Psalms natürlich die seelische Niedergeschlagenheit ausdrücken; „niedergeschlagen“ bewahrt zugleich das Bild des gesenkten Inneren.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ bezeichnet hier das eigene Innere beziehungsweise Selbst. „Meine Seele“ ist im Deutschen verständlich und bewahrt die poetische Form der Selbstanrede.
- source_word: תֶּהֱמִי עָלָי
  choice: bist du so unruhig in mir
  rationale: Das Verb drückt Aufruhr oder erregte Unruhe aus. Obwohl עָלַי wörtlich „über/auf mir“ heißt, gibt „in mir“ den inneren Vorgang im Deutschen idiomatisch wieder.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Hoffe auf Gott
  rationale: Der Imperativ fordert zu erwartungsvollem, geduldigem Vertrauen auf. „Auf Gott hoffen“ ist die natürliche deutsche Verbindung.
- source_word: עוֹד אוֹדֶנּוּ
  choice: ich werde ihn wieder preisen
  rationale: עוֹד weist über die gegenwärtige Not hinaus auf künftiges beziehungsweise erneutes Lob; „wieder“ bringt diesen Zusammenhang natürlich zum Ausdruck. ידה bezeichnet hier lobendes Danken.
- source_word: יְשׁוּעֹת פָּנַי
  choice: der mein Angesicht rettet
  rationale: Wörtlich steht ungewöhnlich „Rettungen meines Angesichts“. Die verbale Wiedergabe bleibt eng an יְשׁוּעוֹת, macht im Deutschen aber verständlich, dass Gottes Rettung das niedergeschlagene Angesicht wiederherstellt.
- source_word: וֵאלֹהָי
  choice: und der mein Gott ist
  rationale: Die Relativkonstruktion bindet „mein Gott“ eindeutig an Gott als den Gepriesenen zurück und bewahrt das additive וְ, ohne die ungewöhnliche hebräische Schlussfügung zu glätten, als stünden zwei verschiedene Bezugsgrößen nebeneinander.
theological_decisions:
- issue: Deutung von יְשׁוּעֹת פָּנַי
  choice: der mein Angesicht rettet
  alternative: die Rettung meines Angesichts / die Hilfe meines Angesichts
  rationale: Der masoretische Text hat die auffällige Wendung „Rettungen meines Angesichts und mein Gott“. Die Übersetzung deutet sie nicht als abstrakte Heilslehre um, sondern erhält das konkrete Bild des durch Gottes Rettung wiederaufgerichteten Angesichts. Eine Fußnote dokumentiert den wörtlichen Ausdruck und seine Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdevolle Psalmensprache mit direkter Selbstanrede. „Meine Seele“ bewahrt den poetischen Klang; Satzbau und Wortwahl bleiben für heutige Leser verständlich. Das verstärkende „so“ gibt den klagenden Frageton von מַה idiomatisch wieder.
