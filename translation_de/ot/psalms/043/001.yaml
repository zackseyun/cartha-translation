source:
  edition: WLC
  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: de
  text: Verschaffe mir Recht, Gott, und führe meinen Rechtsstreit gegen ein treuloses Volk[a]. Rette mich vor dem betrügerischen und ungerechten Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gottloses Volk“; wörtlich: „ein nicht treues/loyales Volk“.'
    reason: lexikalische Alternative zu „treuloses“ für לֹא חָסִיד
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Verschaffe mir Recht
  rationale: Der Imperativ von שׁפט mit persönlichem Objekt ist hier eine Bitte um ein gerechtes, für den Beter eintretendes Urteil. Die Formulierung bewahrt den forensischen Sinn und ist modernes, natürliches Deutsch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die direkte Anrede wird im Deutschen ohne zusätzliches Anredepartikel natürlich und würdig wiedergegeben.
- source_word: וְרִיבָה רִיבִי
  choice: und führe meinen Rechtsstreit
  rationale: Verb und stammverwandtes Substantiv bilden eine juristische Wendung. „Meinen Rechtsstreit führen“ erhält das Rechtsbild und drückt aus, dass Gott den Fall des Beters übernimmt.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: gegen ein treuloses Volk
  rationale: מִן bezeichnet im Zusammenhang des Rechtsstreits die Gegenpartei. Das negierte חָסִיד beschreibt fehlende Loyalität beziehungsweise treue Hingabe; „treulos“ wahrt diese relationale und ethische Dimension.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: vor dem betrügerischen und ungerechten Menschen
  rationale: Die Abstrakta kennzeichnen den einzelnen Menschen durch Betrug und Unrecht. „Mensch“ bewahrt den generischen Singular, ohne das Geschlecht stärker hervorzuheben, als es der Zusammenhang verlangt.
- source_word: תְפַלְּטֵנִי
  choice: Rette mich
  rationale: Das Piel von פלט bezeichnet das In-Sicherheit-Bringen. „Rette mich“ ist unmittelbar, gegenwärtig und entspricht dem dringlichen Gebetston.
theological_decisions:
- issue: Wiedergabe von חָסִיד in der verneinten Wendung לֹא חָסִיד
  choice: treulos
  alternative: gottlos; ohne Bundestreue
  rationale: חָסִיד steht in Beziehung zu חֶסֶד und kann loyale, treue Hingabe bezeichnen. „Treulos“ erhält diese Beziehungsdimension, ohne die Aussage ausdrücklich auf eine bestimmte bundestheologische Deutung festzulegen; die Alternativen werden in der Fußnote genannt.
- issue: Singular אִישׁ in der Gegnerbeschreibung
  choice: Mensch
  alternative: Mann
  rationale: Der hebräische Singular wird bewahrt. „Mensch“ lässt offen, ob eine konkrete männliche Einzelperson oder ein repräsentativ verstandener Gegner gemeint ist, und importiert keine zusätzliche Identifikation.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Gebetston. Die juristische Bildsprache des hebräischen Textes bleibt deutlich; unnötig archaische Formen und konfessionell festgelegte Begriffe werden vermieden.
