source:
  edition: WLC
  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: de
  text: Sende dein Licht und deine Wahrheit[a]; sie sollen mich führen und mich bringen zu deinem heiligen Berg und zu deinen Wohnstätten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Treue“. Das hebräische Wort kann Wahrheit, Verlässlichkeit oder Treue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht die Mehrzahl; traditionell: „deine Wohnungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Sende
  rationale: Der Imperativ von שׁלח wird natürlich und würdig mit „Sende“ wiedergegeben; im Deutschen ist ein Zusatz wie „aus“ nicht nötig.
- source_word: אוֹרְךָ
  choice: dein Licht
  rationale: Bewahrt das konkrete poetische Bild, ohne es vorschnell als Führung oder Rettung auszudeuten.
- source_word: אֲמִתְּךָ
  choice: deine Wahrheit
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. „Wahrheit“ ist die direkte Wiedergabe; die semantische Alternative „Treue“ wird in einer Fußnote genannt.
- source_word: הֵמָּה
  choice: sie
  rationale: Das ausdrückliche Pluralpronomen greift „Licht“ und „Wahrheit“ personifizierend auf und wird im Deutschen durch „sie“ bewahrt.
- source_word: יַנְחוּנִי
  choice: sie sollen mich führen
  rationale: Der Hifil-Imperfekt hat im Anschluss an den Imperativ auffordernden bzw. wünschenden Sinn. „Sie sollen mich führen“ ist idiomatisch und erhält die poetische Personifikation.
- source_word: יְבִיאוּנִי
  choice: und mich bringen
  rationale: Das zweite Verb setzt parallel den Wunsch fort. Die Ellipse von „sie sollen“ ist im Deutschen natürlich und vermeidet schwerfällige Wiederholung.
- source_word: הַר קָדְשְׁךָ
  choice: deinem heiligen Berg
  rationale: Die Konstruktverbindung bedeutet idiomatisch „dein heiliger Berg“. Der mögliche Bezug auf Zion wird nicht erklärend in den Haupttext eingesetzt.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: deinen Wohnstätten
  rationale: „Wohnstätten“ bewahrt den hebräischen Plural und ist moderner sowie semantisch offener als das traditionelle „Wohnungen“ oder das fachsprachliche „Heiligtümer“.
theological_decisions:
- issue: Licht und Wahrheit als Eigenschaften oder personifizierte Führer
  choice: Die personifizierende Mehrzahl wird mit „sie sollen mich führen und mich bringen“ bewahrt.
  alternative: Die Wendung erklärend als Gottes rettende Führung wiedergeben.
  rationale: Das Hebräische nimmt beide Substantive ausdrücklich mit einem Pluralpronomen und Pluralverben auf. Die poetische Spannung soll nicht durch eine Deutung ersetzt werden.
- issue: Bestimmung des heiligen Berges und der Wohnstätten
  choice: Die allgemeinen Bilder „dein heiliger Berg“ und „deine Wohnstätten“ bleiben stehen.
  alternative: Im Haupttext ausdrücklich „Zion“ und „Tempel“ nennen.
  rationale: Zion und das Heiligtum sind wahrscheinliche Bezugspunkte, werden im hebräischen Wortlaut jedoch nicht ausdrücklich genannt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Parallelität. Die Anredeformen bleiben kleingeschrieben. Beide Fußnotenmarker stehen an den jeweils erläuterten Ausdrücken im Haupttext.
