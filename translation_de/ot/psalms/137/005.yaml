base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/005.yaml
  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: de
  text: Wenn ich dich vergesse, Jerusalem, möge meine rechte Hand vergessen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Möge meine rechte Hand ihr Können vergessen.“ Das Hebräische ist hier elliptisch; dieses ergänzte Verständnis wird aus dem Zusammenhang erschlossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet eine bedingte, eidähnliche Selbsterklärung ein. „Wenn“ gibt diese Funktion im Deutschen unmittelbar und natürlich wieder.
- source_word: אֶשְׁכָּחֵךְ
  choice: ich dich vergesse
  rationale: Qal Imperfekt, 1. Person Singular, mit Suffix der 2. Person feminin Singular. Die direkte Anrede Jerusalems bleibt erhalten.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Der Eigenname steht als direkte Anrede und wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: תִּשְׁכַּח
  choice: soll … vergessen
  rationale: Das Imperfekt der 3. Person feminin Singular hat hier im Rahmen der Selbstverwünschung jussivische Kraft. „Soll“ bringt den eidähnlichen Wunsch im Deutschen knapp zum Ausdruck.
- source_word: יְמִינִי
  choice: meine rechte Hand
  rationale: יָמִין bezeichnet hier die rechte Hand, wahrscheinlich als Werkzeug künstlerischer oder musikalischer Fertigkeit. Die konkrete Formulierung des Hebräischen bleibt gewahrt.
theological_decisions:
- issue: Elliptische Selbstverwünschung im zweiten Halbvers
  choice: soll meine rechte Hand vergessen
  alternative: soll meine rechte Hand ihr Können vergessen
  rationale: Der masoretische Text nennt kein Objekt zu „vergessen“. Die Hauptübersetzung bewahrt diese auffällige Kürze und löst die Ellipse nicht stillschweigend auf. Die aus dem Zusammenhang erschlossene Ergänzung wird in der Fußnote angeboten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewohnte Wendung „die rechte Hand soll vergessen“ ist bewusst beibehalten, um die Kürze und Mehrdeutigkeit des hebräischen Textes nicht zu glätten.
