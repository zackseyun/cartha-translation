  source_fidelity: 'Der Sinn des hebräischen Vergeltungssatzes ist im Entwurf zutreffend wiedergegeben: Babylon wird als personifizierte Tochterstadt angeredet, und die Seligpreisung gilt demjenigen, der ihr ihr Tun an Israel entsprechend vergilt. Die Fassung »was du uns angetan hast« gibt גמול/גמל idiomatisch wieder, auch wenn das hebräische Wortspiel nicht vollständig nachbildbar ist. Die Anrede und die Seligpreisung sollten jedoch nicht durch ein Ausrufezeichen voneinander getrennt werden, da sie im Hebräischen einen zusammenhängenden Satz bilden.'
  naturalness: »Tochter Babylon« und »du Verwüstete« sind als bewusst knappe, poetische Anrede in einem Psalm möglich. »Glücklich ist, wer« ist modernes, verständliches Standarddeutsch. Ein Komma statt Ausrufezeichen erhält den Satzfluss und die poetische Syntax besser.
  terminology: »vergilt« trifft den retributiven Charakter von שׁלם gut. Die Fußnote zu הַשְּׁדוּדָה sollte neben »ausgeplündert« auch die naheliegende Alternative »zerstört« nennen, da das passive Partizip sowohl erlittene Verwüstung als auch—im Kontext und nach verbreiteter Deutung—drohenden Untergang bezeichnen kann. Die Übersetzung selbst legt diese strittige zeitliche Nuance nicht fest.
