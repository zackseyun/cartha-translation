base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/008.yaml
  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
translation:
  language: de
  text: Tochter Babylon[a], du Verwüstete[b], glücklich ist, wer dir vergilt, was du uns angetan hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tochter von Babylon«; die hebräische poetische Ausdrucksweise stellt Babylon als Tochterstadt dar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du Zerstörte« oder »du Ausgeplünderte«; die hebräische Bezeichnung kann die erlittene Verwüstung oder die bevorstehende Zerstörung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  choice: Tochter Babylon
  rationale: Die poetische Personenbezeichnung für die Stadt und ihre Bevölkerung bleibt erhalten; die knappe Apposition entspricht dem Hebräischen und ist im Deutschen verständlich.
- source_word: הַשְּׁדוּדָה
  choice: du Verwüstete
  rationale: Das passive Partizip von שׁדד bezeichnet die als verwüstet beziehungsweise geplündert dargestellte Stadt. Die Anrede ist im Deutschen natürlich und legt die zeitliche Perspektive nicht unnötig fest.
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die geläufige Seligpreisungsformel bezeichnet den Begünstigten oder zu Preisenden. »Glücklich ist« ist gegenwärtiges, verständliches Deutsch und bewahrt den Aussagesatz.
- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: wer dir vergilt
  rationale: שׁלם bezeichnet hier die erwidernde Vergeltung; »vergelten« bewahrt den Gedanken entsprechender Rückzahlung in gehobenem, aber geläufigem Deutsch.
- source_word: אֶת גְּמוּלֵךְ שֶׁגָּמַלְתְּ לָנוּ
  choice: was du uns angetan hast
  rationale: גְּמוּל und גמל bilden ein Wortspiel um Tat und entsprechende Vergeltung. Die idiomatische Wendung macht die von Babylon zugefügte Schädigung klar, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Seligpreisung des Vergelters Babylons
  choice: Die Seligpreisung bleibt als unmittelbare Aussage bestehen und wird nicht abgeschwächt.
  alternative: Als bloße Zukunftsprognose formulieren oder den Gedanken der Vergeltung paraphrasierend mildern.
  rationale: Der hebräische Text preist ausdrücklich denjenigen glücklich, der Babylon entsprechend seinem Handeln vergilt. Die moralische und theologische Spannung des Rachepsalms ist zu bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Anrede. »Glücklich ist« vermeidet unnötig kirchensprachliche Festlegung, während »vergilt« den gehobenen Psalmton und die retributive Gegenseitigkeit wahrt.
