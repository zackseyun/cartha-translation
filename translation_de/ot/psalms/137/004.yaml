source:
  edition: WLC
  text: אֵ֗יךְ נָשִׁ֥יר אֶת שִׁיר יְהוָ֑ה עַ֝֗ל אַדְמַ֥ת נֵכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/004.yaml
  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: de
  text: Wie könnten wir das Lied Jahwes auf fremdem Boden singen?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „das Lied JHWHs“; traditionell wiedergegeben als „das Lied des HERRN“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in einem fremden Land“. Wörtlich spricht das Hebräische von „fremdem Boden/Grund“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie könnten
  rationale: Das Frageadverb bezeichnet die Art und Weise; im Zusammenhang schwingt die Frage nach Möglichkeit und Angemessenheit mit. Der Konjunktiv „könnten“ gibt die klagende rhetorische Kraft im heutigen Deutsch natürlich wieder.
- source_word: נָשִׁיר
  choice: wir … singen
  rationale: Qal Imperfekt, 1. Person Plural, von „singen“. Zusammen mit „könnten“ bezeichnet es die als kaum möglich oder unangebracht empfundene Handlung.
- source_word: אֶת
  choice: '[nicht wiedergegebenes Akkusativzeichen]'
  rationale: Das hebräische Zeichen markiert das bestimmte direkte Objekt und hat im Deutschen keine eigene Entsprechung.
- source_word: שִׁיר יְהוָה
  choice: das Lied Jahwes
  rationale: Die Status-constructus-Verbindung bezeichnet das zu Jahwe gehörende beziehungsweise ihm geltende Lied. Die bestimmte Form „das Lied“ bewahrt diesen spezifischen Bezug.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bedeutet konkret „auf/über“; mit „Boden“ ist „auf“ im Deutschen natürlich und erhält das räumliche Bild.
- source_word: אַדְמַת
  choice: Boden
  rationale: Das Wort bezeichnet Erde, Grund oder Land. „Boden“ bewahrt hier die konkrete Bildlichkeit des Hebräischen besser als das allgemeinere „Land“.
- source_word: נֵכָר
  choice: fremdem
  rationale: Das Wort bezeichnet, was einem anderen Volk oder Land angehört. „Fremd“ ist im modernen Deutsch klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt den Eigennamen, während „der HERR“ die traditionelle ersetzende Lesung wiedergibt.
- issue: Tragweite der rhetorischen Frage
  choice: Wie könnten wir … singen?
  alternative: Wie sollten wir … singen?
  rationale: Der hebräische Wortlaut lässt offen, ob vor allem Unmöglichkeit, Unangemessenheit oder beides beklagt wird. „Könnten“ hält die Möglichkeit im Vordergrund, ohne den Unterton der Unangemessenheit auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung ist idiomatisch, während „auf fremdem Boden“ die konkrete Bildsprache des hebräischen Textes erhält. Die beiden Fußnotenmarker stehen vollständig im Haupttext.
