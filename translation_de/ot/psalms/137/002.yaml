  text: On the poplars in its midst we hung our lyres[a][b].
translation:
  language: de
  text: An die Pappeln in ihrer Mitte hängten wir unsere Leiern[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weiden“. Der hebräische Baumname kann Weiden oder pappelartige Bäume bezeichnen; „Weiden“ ist die traditionelle Übersetzung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unsere Harfen“. Das hebräische Wort kinnor bezeichnet ein antikes Saiteninstrument, wahrscheinlich eine Leier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: an
  rationale: Bei einem Verb des Hängens gibt עַל hier die Stelle an, an der die Instrumente aufgehängt wurden; im Deutschen ist „an“ natürlicher als das räumlich unpassende „auf“.
- source_word: עֲרָבִים
  choice: Pappeln
  rationale: Der hebräische Baumname kann Weiden oder pappelartige Bäume bezeichnen. „Pappeln“ passt wahrscheinlich zum mesopotamischen Umfeld; die traditionelle und ebenfalls mögliche Wiedergabe „Weiden“ bleibt in der Fußnote erhalten.
- source_word: בְּתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Die feminine Singularendung verweist im Zusammenhang wohl auf Babylon. Die Formulierung bewahrt diesen Rückverweis, ohne im Haupttext ausdrücklich „Stadt“ oder „Land“ einzufügen.
- source_word: תָּלִינוּ
  choice: hängten wir
  rationale: Das Qal Perfekt 1. Person Plural von תלה bedeutet schlicht „hängen/aufhängen“. Die deutsche Form gibt die abgeschlossene Handlung natürlich wieder.
- source_word: כִּנֹּרוֹתֵינוּ
  choice: unsere Leiern
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument, wahrscheinlich eine Leier. „Harfen“ ist traditionell, aber instrumentenkundlich weniger genau, und wird deshalb als Alternative in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Poetisch, würdevoll und knapp. Die ungewöhnliche, aber textnahe Wendung „in ihrer Mitte“ bewahrt den femininen Rückverweis auf Babylon aus dem Zusammenhang; die Wortstellung stellt zunächst den Ort des Aufhängens heraus.
