  text: עַ֥ל נַהֲר֨וֹת בָּבֶ֗ל שָׁ֣ם יָ֭שַׁבְנוּ גַּם בָּכִ֑ינוּ בְּ֝/זָכְרֵ֗/נוּ אֶת צִיּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: de
  text: An den Flüssen Babylons[a], dort saßen wir; wir weinten auch, als wir uns an Zion erinnerten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An den Strömen Babylons“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Dort saßen wir und weinten, als wir uns an Zion erinnerten.“ Im Hebräischen steht vor „wir weinten“ zusätzlich eine Partikel mit der Bedeutung „auch“ oder „sogar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל נַהֲרוֹת
  choice: An den Flüssen
  rationale: עַל bezeichnet hier die Lage an oder bei den Gewässern; „an den Flüssen“ ist im Deutschen natürlich und bewahrt den räumlichen Sinn. נַהֲרוֹת wird regulär mit „Flüsse“ wiedergegeben.
- source_word: בָּבֶל
  choice: Babylons
  rationale: Der Ortsname wird in der im Deutschen üblichen Form wiedergegeben; der Genitiv entspricht der hebräischen Verbindung „Flüsse Babylons“.
- source_word: שָׁם
  choice: dort
  rationale: 'Das Ortsadverb wird zur Hervorhebung ausdrücklich beibehalten: Dort, fern von Zion, saßen die Verschleppten.'
- source_word: יָשַׁבְנוּ
  choice: saßen wir
  rationale: ישׁב kann „sitzen“ oder „wohnen“ bedeuten. Im Zusammenhang des Weinens an den Flüssen beschreibt „saßen wir“ die Klageszene am unmittelbarsten.
- source_word: גַּם
  choice: auch
  rationale: „Auch“ erhält die additive beziehungsweise verstärkende Funktion der Partikel, ohne ihr Verhältnis zu den benachbarten Aussagen enger festzulegen.
- source_word: בָּכִינוּ
  choice: wir weinten
  rationale: „Weinen“ gibt das Verb in einem natürlichen, würdigen poetischen Register wieder.
- source_word: בְּזָכְרֵנוּ
  choice: als wir … dachten
  rationale: Die Präposition בְּ mit dem Infinitivus constructus wird temporal wiedergegeben. Die feste deutsche Wendung „an Zion denken“ drückt hier das erinnernde Gedenken natürlich aus.
- source_word: אֶת צִיּוֹן
  choice: an Zion
  rationale: אֶת kennzeichnet das Objekt und wird nicht eigenständig übersetzt. Der Name „Zion“ bleibt erhalten, statt deutend durch „Jerusalem“ ersetzt zu werden.
theological_decisions:
- issue: Wiedergabe von צִיּוֹן
  choice: Zion
  alternative: Jerusalem
  rationale: Der hebräische Eigenname trägt eine geografische und zugleich poetisch-theologische Bedeutung. Seine Beibehaltung wahrt diese Resonanz, ohne den Ausdruck interpretierend zu verengen.
- issue: Bezug und Gewicht von גַּם
  choice: „auch“ beim Weinen beibehalten
  alternative: Die Partikel verstärkend mit „ja“ oder syntaktisch enger als „da saßen wir und weinten“ wiedergeben
  rationale: Die additive Partikel steht vor „wir weinten“. „Wir weinten auch“ bewahrt diese Form, lässt aber die im knappen poetischen Satz mögliche Nuance offen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit knapper poetischer Satzführung. Das betonte „dort“ und die additive Partikel „auch“ werden sichtbar erhalten; „Zion“ bleibt als Eigenname unaufgelöst.
