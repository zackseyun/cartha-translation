base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: de
  text: Möge meine Zunge an meinem Gaumen kleben, wenn ich mich nicht an dich erinnere, wenn ich Jerusalem nicht über meine höchste Freude stelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn ich Jerusalem nicht über das Haupt meiner Freude emporhebe“. Gemeint ist, Jerusalem den höchsten Vorrang zu geben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּק
  choice: soll … kleben
  rationale: Das Verb דבק bezeichnet ein Haften oder Kleben. Im Zusammenhang dieses Selbstfluchs gibt „soll … kleben“ den jussivischen Sinn natürlich und würdevoll wieder.
- source_word: לְשׁוֹנִי לְחִכִּי
  choice: meine Zunge … an meinem Gaumen
  rationale: Die konkrete körperliche Vorstellung bleibt erhalten; חֵךְ bezeichnet hier den Gaumen.
- source_word: אִם לֹא אֶזְכְּרֵכִי
  choice: wenn ich mich nicht an dich erinnere
  rationale: Die Bedingungsform und die direkte Anrede der grammatisch femininen Stadt werden bewahrt. „Sich erinnern“ gibt זכר ohne unnötige Ausdeutung wieder.
- source_word: אַעֲלֶה אֶת יְרוּשָׁלַם
  choice: Jerusalem … stelle
  rationale: Der Hifil von עלה bedeutet wörtlich „hinaufbringen/erheben“. Zusammen mit עַל רֹאשׁ bezeichnet er hier die Zuweisung des höchsten Vorrangs; „stellen“ ergibt im Deutschen mit „über“ eine klare Rangordnung.
- source_word: עַל רֹאשׁ שִׂמְחָתִי
  choice: über meine höchste Freude
  rationale: Wörtlich steht „über das Haupt meiner Freude“. Die gewählte Formulierung vermittelt die poetische Aussage, dass Jerusalem selbst gegenüber der größten Freude Vorrang haben soll, ohne das Bild im Haupttext unnatürlich nachzubilden.
theological_decisions:
- issue: Bezugswort des femininen Suffixes in אֶזְכְּרֵכִי
  choice: 'Direkte Anrede Jerusalems: „dich“'
  alternative: Poetischer Bezug auf Zion beziehungsweise die Stadt im weiteren Sinn
  rationale: Jerusalem ist im Kontext das naheliegende Bezugswort, und das feminine Suffix entspricht dem grammatischen Geschlecht der Stadt. Die direkte Anrede bewahrt die emotionale Spannung des Psalms.
- issue: Rang Jerusalems gegenüber der Freude des Sprechers
  choice: „Jerusalem … über meine höchste Freude stelle“
  alternative: „Jerusalem zu meiner höchsten Freude mache“ oder „Jerusalem an die Spitze meiner Freude stelle“
  rationale: Die Übersetzung wahrt die Aussage des hebräischen עַל רֹאשׁ, dass Jerusalem Vorrang vor der größten persönlichen Freude erhält, ohne daraus eine weitergehende theologische Rangordnung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Körpermetaphorik. Die Satzparallelität des Hebräischen bleibt durch die zweimalige Konstruktion „wenn ich … nicht“ erkennbar.
