source:
  edition: WLC
  text: זְכֹ֤ר יְהוָ֨ה לִ/בְנֵ֬י אֱד֗וֹם אֵת֮ י֤וֹם יְֽרוּשָׁ֫לִָ֥ם הָ֭/אֹ֣מְרִים עָ֤רוּ עָ֑רוּ עַ֝֗ד הַ/יְס֥וֹד בָּֽ/הּ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/007.yaml
  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: de
  text: 'Jahwe, rechne den Edomitern den Tag Jerusalems[a] an, als sie riefen: »Legt es bloß, legt es bloß[b] bis auf den Grund!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Tag Jerusalems«. Die knappe hebräische Wendung kann sich auf Jerusalems Unglückstag beziehen, ohne das Ereignis näher zu benennen.'
    reason: Die Fußnote erläutert den wahrscheinlichen Kontext, ohne den nicht näher bestimmten hebräischen Ausdruck im Haupttext oder in der Anmerkung auf den Fall der Stadt festzulegen.
  - marker: b
    text: 'Auch möglich: »Entblößt es völlig« oder, dem Ergebnis nach, »Reißt es nieder«. Das hebräische Verb beschreibt das vollständige Bloßlegen.'
    reason: Die Bildsprache des seltenen Verbs lässt sowohl eine lexikalisch engere als auch eine stärker wirkungsbezogene Übersetzung zu.
lexical_decisions:
- source_word: זְכֹר
  choice: rechne … an
  rationale: Der Imperativ bedeutet wörtlich »gedenke«. Zusammen mit לִבְנֵי אֱדוֹם hat er hier jedoch einen anklagenden, gerichtlichen Sinn. »Rechne … an« gibt diesen im modernen Deutschen natürlich wieder, ohne bereits eine bestimmte Strafe auszusprechen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִבְנֵי אֱדוֹם
  choice: den Edomitern
  rationale: Die hebräische Wendung lautet formal »den Söhnen Edoms«. Die geläufige Volksbezeichnung »Edomiter« ist im modernen Deutschen klarer; der Dativ gehört zur Wendung »jemandem etwas anrechnen« und bewahrt die gegen sie gerichtete Aussage.
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: den Tag Jerusalems
  rationale: Die knappe und mehrdeutige hebräische Genitivverbindung bleibt im Haupttext erhalten; der Kontext bezeichnet Jerusalems Unglückstag.
- source_word: הָאֹמְרִים
  choice: Sie riefen
  rationale: Das Partizip beschreibt den Ruf der Edomiter während des Geschehens. Ein eigener kurzer Satz wirkt auf Deutsch natürlich und vermittelt die lebhafte Szene.
- source_word: עָרוּ עָרוּ
  choice: Legt es bloß, legt es bloß
  rationale: Der wiederholte Imperativ von ערה bezeichnet das Entblößen oder Freilegen. Die Wiederholung und das Bild völliger Bloßlegung werden bewahrt; »reißt es nieder« wäre stärker auf das Ergebnis festgelegt.
- source_word: עַד הַיְסוֹד בָּהּ
  choice: bis auf den Grund
  rationale: Die Wendung bezeichnet eine vollständige Freilegung oder Zerstörung bis zur Grundlage. »Bis auf den Grund« ist idiomatisch und bewahrt den Singular.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als persönlichen Namen statt ihn durch einen Titel zu ersetzen.
- issue: Gerichtlicher Sinn von זכר mit ל
  choice: rechne den Edomitern … an
  alternative: gedenke der Edomiter
  rationale: Der Psalm bittet nicht um neutrales oder wohlwollendes Erinnern, sondern darum, das Verhalten Edoms bei Jerusalems Katastrophe gegen Edom in Anschlag zu bringen. Die Formulierung benennt diesen Kontext, ohne Art oder Ausmaß der erbetenen Vergeltung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die wiederholten Imperative erhalten die Dringlichkeit des Klage- und Vergeltungsgebets. »Edomiter« vermeidet die im heutigen Deutsch steife Form »Söhne Edoms«; »Tag Jerusalems« bewahrt bewusst die knappe Spannung des Hebräischen.
