source:
  edition: WLC
  text: אַשְׁרֵ֤י שֶׁ/יֹּאחֵ֓ז וְ/נִפֵּ֬ץ אֶֽת עֹ֝לָלַ֗יִ/ךְ אֶל הַ/סָּֽלַע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/009.yaml
  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: de
  text: Glücklich ist, wer deine kleinen Kinder[a] ergreift und am Felsen zerschmettert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Säuglinge. Das hebräische Wort bezeichnet sehr junge Kinder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die idiomatische Preisung bezeichnet einen Menschen als glücklich beziehungsweise glücklich zu preisen. Die direkte Wiedergabe bewahrt die feierliche Wertung und mildert sie trotz des erschütternden Zusammenhangs nicht ab.
- source_word: שֶׁיֹּאחֵז
  choice: wer … ergreift
  rationale: Das Relativwort mit dem Verb wird im Deutschen natürlich mit „wer“ wiedergegeben. „Ergreift“ bezeichnet ein festes, zielgerichtetes Packen, ohne die Gewaltsamkeit abzuschwächen.
- source_word: וְנִפֵּץ
  choice: und … zerschmettert
  rationale: Das Verb bezeichnet gewaltsames Zerbrechen oder Zerschlagen. „Zerschmettert“ gibt die Härte des Bildes klar und idiomatisch wieder.
- source_word: עֹלָלַיִךְ
  choice: deine kleinen Kinder
  rationale: Das Substantiv bezeichnet sehr junge Kinder. „Kleine Kinder“ ist im modernen Deutsch natürlich und bewahrt sowohl den Sinnumfang als auch die emotionale Wucht; „Säuglinge“ ist als engere Möglichkeit in der Fußnote genannt.
- source_word: אֶל הַסָּלַע
  choice: am Felsen
  rationale: Bei „zerschmettern“ bezeichnet „am Felsen“ im Deutschen idiomatisch die Fläche, gegen die der Aufprall erfolgt. „Felsen“ entspricht der konkreten Bildsprache des hebräischen סֶלַע.
theological_decisions:
- issue: Ethische und theologische Spannung der Preisung אַשְׁרֵי im Rachepsalm
  choice: Die Preisung wird unmittelbar mit „Glücklich ist“ wiedergegeben, ohne sie abzuschwächen oder durch einen moralischen Kommentar im Vers einzuhegen.
  alternative: „Wohl dem“ oder eine abschwächende Umschreibung wie „Gut wird es dem ergehen“
  rationale: Der hebräische Text spricht in seiner Klage über Babylon ausdrücklich eine Preisung aus. Die Übersetzung muss diese verstörende Spannung und den Ruf nach Vergeltung stehen lassen, statt sie stillschweigend aufzulösen oder als allgemeine Billigung persönlicher Grausamkeit umzudeuten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die drastische Bildsprache wird weder archaisiert noch beschönigt; die knappe Satzform erhält die Wucht des hebräischen Verses.
