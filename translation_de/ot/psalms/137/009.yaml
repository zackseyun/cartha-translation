  naturalness: „Glücklich ist, wer deine kleinen Kinder ergreift und am Felsen zerschmettert“ ist knappes, verständliches modernes Standarddeutsch. Die Verbindung „am Felsen zerschmettert“ ist bei dieser Gewalthandlung idiomatisch und bezeichnet den Felsen als Aufprallfläche.
