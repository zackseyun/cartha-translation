id: PSA.137.3
reference: Psalms 137:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י שָׁ֨ם שְֽׁאֵל֪וּ/נוּ שׁוֹבֵ֡י/נוּ דִּבְרֵי שִׁ֭יר וְ/תוֹלָלֵ֣י/נוּ שִׂמְחָ֑ה שִׁ֥ירוּ לָ֝֗/נוּ מִ/שִּׁ֥יר צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: de
  text: 'Denn dort verlangten die, die uns gefangen hielten, von uns Worte eines Liedes und die, die uns quälten[a], Fröhlichkeit: »Singt für uns eines von den Liedern Zions!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die uns verspotteten“; das seltene hebräische Wort kann misshandelnde Bedrängung oder höhnischen Spott bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das im vorigen Vers geschilderte Verstummen ein und bewahrt die erklärende beziehungsweise kausale Funktion.
- source_word: שָׁם
  choice: dort
  rationale: Bezeichnet im Kontext den Ort der Gefangenschaft in Babylon; „dort“ ist die natürliche deutsche Entsprechung.
- source_word: שְׁאֵלוּנוּ
  choice: verlangten … von uns
  rationale: שאל bezeichnet hier das Erbitten oder Fordern einer Darbietung. „Verlangten“ gibt im Zusammenhang der Gefangenschaft den drängenden Charakter wieder, ohne ausdrücklich Gewalt in das Verb einzutragen.
- source_word: שׁוֹבֵינוּ
  choice: die, die uns gefangen hielten
  rationale: Die Form bezeichnet diejenigen, die Menschen gefangen genommen haben. Die Umschreibung ist im heutigen Deutsch natürlicher und eindeutiger als „Gefangennehmer“ oder „Entführer“.
- source_word: דִּבְרֵי שִׁיר
  choice: Worte eines Liedes
  rationale: Die Wiedergabe bleibt nahe bei der hebräischen Verbindung „Worte von Lied/Gesang“ und macht deutlich, dass eine gesungene, textgebundene Darbietung verlangt wurde.
- source_word: וְתוֹלָלֵינוּ
  choice: und die, die uns quälten
  rationale: Das seltene Wort ist unsicher und kann misshandelnde Bedränger oder höhnische Spötter bezeichnen. „Die, die uns quälten“ passt zum Klageton; die mögliche Bedeutung „Spötter“ wird in der Fußnote bewahrt.
- source_word: שִׂמְחָה
  choice: Fröhlichkeit
  rationale: Das Substantiv bezeichnet Freude oder ausgelassene Heiterkeit. „Fröhlichkeit“ erhält die knappe Ellipse des Hebräischen und den Gegensatz zwischen erzwungener Unterhaltung und dem Leid der Verschleppten.
- source_word: שִׁירוּ לָנוּ
  choice: Singt für uns
  rationale: Der Imperativ mit ל fordert eine Darbietung zugunsten der Hörenden; „für uns“ ist dafür im Deutschen idiomatisch.
- source_word: מִשִּׁיר צִיּוֹן
  choice: eines von den Liedern Zions
  rationale: 'Die Präposition מִן ist hier partitiv: Verlangt wird ein Lied aus dem Bestand der mit Zion verbundenen Lieder.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Umschreibung „die, die uns …“ vermeidet unnatürliche Substantivbildungen und erhält zugleich den Parallelismus. Die knappe Ellipse vor „Fröhlichkeit“ folgt der poetischen Form des Hebräischen.
