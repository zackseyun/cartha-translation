base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: de
  text: Es ist gut, Jahwe zu danken und deinem Namen zu lobsingen, du Höchster.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: Es ist gut
  rationale: Das prädikative Adjektiv bewertet die beiden folgenden Infinitive; im Deutschen gibt „Es ist gut“ die offene, umfassende Wertung natürlich wieder.
- source_word: לְהֹדוֹת
  choice: zu danken
  rationale: ידה im Hifil bezeichnet im gottesdienstlichen Zusammenhang Danken beziehungsweise preisendes Bekennen. „danken“ bewahrt hier die Unterscheidung zum musikalischen Lob im zweiten Halbvers.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt das Tetragramm יהוה. „Jahwe“ gibt den Eigennamen transparent wieder, ohne ihn durch einen Titel zu ersetzen.
- source_word: וּלְזַמֵּר
  choice: und … zu singen
  rationale: זמר im Piel bezeichnet lobendes Musizieren, häufig Gesang. In Verbindung mit „deinem Namen“ ist „singen“ im Deutschen natürlich und lässt eine mögliche instrumentale Begleitung offen.
- source_word: לְשִׁמְךָ
  choice: deinem Namen
  rationale: Die Wendung wird bewahrt, weil „Name“ in biblischer Sprache mehr als eine bloße Anrede bezeichnet und für Gottes offenbarte Person und seinen Ruf steht.
- source_word: עֶלְיוֹן
  choice: Höchster
  rationale: Der göttliche Titel bedeutet „der Höchste“. Die Anredeform ohne zusätzliches „o“ ist in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ wahrt diesen Eigennamen; die Fußnote nennt die traditionelle deutsche Wiedergabe, ohne sie in den Haupttext einzutragen.
- issue: Bezug von עֶלְיוֹן
  choice: Anrede „Höchster“
  alternative: appositioneller Titel „du Höchster“
  rationale: Das Suffix „deinem“ zeigt die direkte Anrede Gottes an. Die knappe Anrede erhält zugleich die poetische Form des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Deinem Namen singen“ bewahrt die hebräische Ausdrucksweise und bleibt im Deutschen verständlich.
