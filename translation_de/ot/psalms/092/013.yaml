id: PSA.92.13
reference: Psalms 92:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׁ֭תוּלִים בְּ/בֵ֣ית יְהוָ֑ה בְּ/חַצְר֖וֹת אֱלֹהֵ֣י/נוּ יַפְרִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: de
  text: Gepflanzt im Haus Jahwes[a], werden sie in den Vorhöfen unseres Gottes aufblühen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; hier mit „Jahwe“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „werden sie sprossen“ oder „werden sie blühen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: Gepflanzt
  rationale: Das passive Partizip bezeichnet Pflanzen, die gepflanzt oder eingesetzt sind. „Gepflanzt“ bewahrt das Bild knapp und natürlich.
- source_word: בְּבֵית
  choice: im Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und kann hier den Tempel bezeichnen. „Haus“ erhält die hebräische Bildsprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּחַצְרוֹת
  choice: in den Vorhöfen
  rationale: חָצֵר bezeichnet hier die Höfe des Heiligtums. „Vorhöfe“ ist im Deutschen die geläufige Bezeichnung für die Tempelhöfe.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Die Form enthält das Suffix der ersten Person Plural und bedeutet direkt „unser Gott“; nach der Präposition steht im Deutschen der Genitiv.
- source_word: יַפְרִיחוּ
  choice: werden sie aufblühen
  rationale: Das Hifil von פרח kann „sprossen“, „blühen“ oder „gedeihen“ bedeuten. „Aufblühen“ erhält sowohl das Pflanzenbild als auch den Sinn kräftigen Gedeihens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen יהוה. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Pflanzenbild. Die vorangestellte Partizipialform folgt der hebräischen Versstruktur; „Vorhöfe“ macht den Bezug zum Heiligtum natürlich verständlich.
