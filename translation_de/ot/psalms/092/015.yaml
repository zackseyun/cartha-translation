source:
  edition: WLC
  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: de
  text: um zu verkünden, dass Jahwe gerecht ist. Er ist mein Fels, und kein Unrecht[a] ist an ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: keine Ungerechtigkeit.'
    reason: Lexikalische Alternative für עַוְלָתָה; „Ungerechtigkeit“ hebt den rechtlichen Aspekt stärker hervor.
lexical_decisions:
- source_word: לְהַגִּיד
  choice: um zu verkünden
  rationale: Der Infinitiv mit לְ bezeichnet hier Zweck beziehungsweise Ergebnis im Anschluss an den vorherigen Zusammenhang. „Verkünden“ bewahrt den öffentlichen, feierlichen Charakter.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was verkündet wird, nicht primär eine Begründung.
- source_word: יָשָׁר
  choice: gerecht
  rationale: Bei einer Aussage über Gottes Wesen bezeichnet יָשָׁר seine uneingeschränkte moralische Geradheit. „Gerecht“ ist im modernen Deutschen natürlich und würdevoll; „aufrichtig“ könnte zu eng als bloße Ehrlichkeit verstanden werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen gebräuchliche Form.
- source_word: צוּרִי
  choice: mein Fels
  rationale: Die konkrete und im Psalter zentrale Metapher bleibt erhalten, statt sie deutend durch „Zuflucht“ zu ersetzen.
- source_word: וְלֹא
  choice: und kein
  rationale: Die knappe hebräische Nominalaussage wird im Deutschen natürlich wiedergegeben, ohne ihren Inhalt auszuweiten.
- source_word: עַוְלָתָה
  choice: Unrecht
  rationale: Das Substantiv bezeichnet moralisches Unrecht beziehungsweise Ungerechtigkeit. „Unrecht“ ist prägnant und umfasst sowohl moralische als auch rechtliche Verkehrtheit.
- source_word: בּוֹ
  choice: an ihm
  rationale: „Kein Unrecht ist an ihm“ gibt die Aussage idiomatisch wieder, dass Gott keinerlei Unrecht anhaftet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutungsbeziehung zwischen יָשָׁר und עַוְלָתָה
  choice: „gerecht“ und „kein Unrecht“
  alternative: „aufrichtig“ und „keine Ungerechtigkeit“
  rationale: Die gewählte Formulierung erhält die moralische und rechtliche Spannung des Parallelismus, ohne Gottes Gerechtigkeit auf eine einzelne Facette zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang bleibt als zweckanzeigender Infinitiv formuliert, weil Vers 15 syntaktisch an den vorherigen Zusammenhang anschließt. Die Felsmetapher wird unverändert bewahrt.
