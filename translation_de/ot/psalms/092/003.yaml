  yaml_path: translation/ot/psalms/092/003.yaml
  text: On the ten-stringed instrument and on the harp[b][a], with melody on the lyre.
translation:
  language: de
  text: Auf dem zehnsaitigen Instrument und auf der Harfe, zum Klang der Leier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Art der genannten hebräischen Saiteninstrumente ist ungewiss. עָשׂוֹר bezeichnet ein zehnsaitiges Instrument; נָבֶל kann auch mit „Leier“ oder „Laute“ und כִּנּוֹר auch mit „Harfe“ wiedergegeben werden. הִגָּיוֹן kann außerdem „Nachsinnen“, „Murmeln“ oder einen resonanten musikalischen Klang beziehungsweise Vortrag bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵי עָשׂוֹר
  choice: zur zehnsaitigen Laute
  rationale: עָשׂוֹר bezeichnet hier ein zehnsaitiges Instrument. „Laute“ ergibt eine natürliche deutsche Instrumentenbezeichnung, ohne eine völlig sichere historische Identifizierung zu behaupten; die Unsicherheit wird in der Fußnote genannt.
- source_word: וַעֲלֵי נָבֶל
  choice: und zur Harfe
  rationale: Die wiederholte Präposition und die Konjunktion werden in der parallelen Fügung „und zur“ bewahrt. נָבֶל bezeichnet ein Saiteninstrument, dessen genaue Bauart ungewiss ist.
- source_word: עֲלֵי הִגָּיוֹן
  choice: zum Saitenspiel
  rationale: הִגָּיוֹן kann Nachsinnen, Murmeln oder einen klingenden beziehungsweise musikalischen Vortrag bezeichnen. Im Zusammenhang der Instrumente ist „Saitenspiel“ eine natürliche Wiedergabe, die den musikalischen Sinn ausdrückt, ohne das Wort auf „Melodie“ zu verengen.
- source_word: בְּכִנּוֹר
  choice: auf der Leier
  rationale: כִּנּוֹר bezeichnet ein Saiteninstrument und wird hier als „Leier“ wiedergegeben, damit es von נָבֶל unterschieden bleibt. בְּ kennzeichnet in diesem musikalischen Zusammenhang das Instrument.
