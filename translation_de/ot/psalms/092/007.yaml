  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: de
  text: Wenn die Gottlosen wie Gras sprossen und alle, die Unrecht tun, aufblühen, geschieht das, damit sie für immer vernichtet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zu ihrer Vernichtung für immer“ oder „nur um für immer vernichtet zu werden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: Wenn ... sprossen
  rationale: Die Präposition ב mit dem Infinitiv constructus bezeichnet hier am natürlichsten einen zeitlichen Umstand. „Sprossen“ bewahrt zusammen mit „Gras“ das Pflanzenbild.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die als böse bzw. schuldig charakterisiert werden. „Die Gottlosen“ ist im Psalmregister knapp und würdevoll, ohne einen konkreten Einzelverstoß einzutragen.
- source_word: כְּמוֹ עֵשֶׂב
  choice: wie Gras
  rationale: עֵשֶׂב bezeichnet Gras oder sonstigen Pflanzenwuchs; „Gras“ ist idiomatisch und trägt das Bild raschen, vergänglichen Wachstums.
- source_word: וַיָּצִיצוּ
  choice: aufblühen
  rationale: Das Verb צוץ bezeichnet das Hervorkommen bzw. Blühen. „Aufblühen“ hält den pflanzlichen Parallelismus aufrecht und kann zugleich sichtbares Gedeihen ausdrücken.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: alle, die Unrecht tun
  rationale: 'Die deutsche Relativkonstruktion gibt „alle Täter/Wirker von Unrecht“ natürlich und verständlich wieder. אָוֶן hat hier moralischen Sinn: Unrecht bzw. Böses.'
- source_word: לְהִשָּׁמְדָם
  choice: dann nur, damit sie ... vernichtet werden
  rationale: Der passive Niphal-Infinitiv mit ל und Personalsuffix lässt Ziel oder Ergebnis anklingen. „damit sie vernichtet werden“ bewahrt die passive Aussage, ohne ausdrücklich einen Handelnden zu ergänzen; „dann nur“ verdeutlicht die zugespitzte Verbindung zum vorübergehenden Aufblühen.
- source_word: עֲדֵי עַד
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist klares, modernes Deutsch.
theological_decisions:
- issue: Verhältnis zwischen dem Aufblühen der Gottlosen und ihrer endgültigen Vernichtung
  choice: „dann nur, damit sie für immer vernichtet werden“
  alternative: „zu ihrer Vernichtung für immer“ bzw. „nur um für immer vernichtet zu werden“
  rationale: Die ל-Konstruktion kann Ziel oder Ergebnis bezeichnen. Die Übersetzung erhält die Spannung zwischen zeitweiligem Gedeihen und endgültigem Gericht, nennt aber keinen ausdrücklichen göttlichen Urheber, da auch der hebräische Satz ihn nicht nennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Psalmton. Das durchgehende Pflanzenbild wird mit „sprossen“ und „aufblühen“ erhalten. Der Fußnotenmarker steht unmittelbar nach der betroffenen Schlussaussage.
