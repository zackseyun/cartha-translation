  verdict: revise
  source_fidelity: 'Die Grundentsprechungen sind zuverlässig: רְשָׁעִים als „die Gottlosen“, עֵשֶׂב als „Gras“, צוץ als „aufblühen“ und die passive Vernichtung „für immer“ geben Wortlaut und Pflanzenbild angemessen wieder. Die finale/resultative ל-Konstruktion in לְהִשָּׁמְדָם wird mit „damit sie ... vernichtet werden“ sachgerecht wiedergegeben. Allerdings fügt „dann nur“ eine ausschließende Einschränkung hinzu, die im Hebräischen nicht ausdrücklich steht.'
  naturalness: Der Satz ist in modernem Standarddeutsch klar und hat einen passenden, würdigen Psalmton. „Sprossen“ und „aufblühen“ erhalten den bildhaften Parallelismus. Mit „geschieht das“ wird die Satzverknüpfung ohne die nicht erforderliche Zuspitzung „nur“ natürlich und deutlich.
  terminology: „Die Gottlosen“ ist für רְשָׁעִים im Psalmregister etabliert und angemessen. „Alle, die Unrecht tun“ gibt כָּל פֹּעֲלֵי אָוֶן idiomatisch wieder; „Unrecht“ ist hier als Wiedergabe von אָוֶן vertretbar. „Vernichtet“ trifft die passive Aussage von שׁמד.
  issues:
  - severity: medium
    issue: „dann nur“ im Haupttext
    rationale: Das Hebräische enthält keine ausdrückliche Partikel für „nur“. Zwar kann die Konstruktion den Kontrast zwischen vorübergehendem Gedeihen und endgültiger Vernichtung zugespitzt darstellen, doch die exklusive Nuance sollte nicht in den Haupttext eingetragen werden. Sie kann als alternative Deutung in der Fußnote stehen.
  revised_text: Wenn die Gottlosen wie Gras sprossen und alle, die Unrecht tun, aufblühen, geschieht das, damit sie für immer vernichtet werden.[a]
