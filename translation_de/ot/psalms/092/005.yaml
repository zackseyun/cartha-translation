source:
  edition: WLC
  text: מַה גָּדְל֣וּ מַעֲשֶׂ֣י/ךָ יְהוָ֑ה מְ֝אֹ֗ד עָמְק֥וּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/005.yaml
  text: How great are your works[a], O Yahweh; your thoughts are very deep.
translation:
  language: de
  text: Wie groß sind deine Werke, Jahwe! Sehr tief sind deine Gedanken[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pläne“ oder „Absichten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: Wie groß sind
  rationale: Das exklamative מַה drückt hier staunende Bewunderung aus; das stativ gebrauchte Perfekt גָּדְלוּ wird im Deutschen natürlich mit dem Präsens wiedergegeben.
- source_word: מַעֲשֶׂיךָ
  choice: deine Werke
  rationale: מַעֲשֶׂה bezeichnet Werke oder Taten. „Werke“ bewahrt den weiten poetischen Sinn, der sowohl Schöpfungswerke als auch Gottes Handeln umfassen kann.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: מְאֹד עָמְקוּ
  choice: Sehr tief sind
  rationale: מְאֹד verstärkt das stativ gebrauchte עָמְקוּ. Die vorangestellte Formulierung erhält den poetischen Nachdruck des Hebräischen.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: deine Gedanken
  rationale: מַחֲשָׁבוֹת kann Gedanken, Pläne oder Absichten bezeichnen. „Gedanken“ ist die unmittelbarste Entsprechung und lässt die Bedeutungsbreite offen; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von מַחְשְׁבֹתֶיךָ
  choice: deine Gedanken
  alternative: deine Pläne / deine Absichten
  rationale: Der Kontext erlaubt sowohl Gottes Denken und Weisheit als auch seine planenden Absichten. Der Haupttext bewahrt mit „Gedanken“ die poetische Offenheit; die Fußnote nennt die sachlich möglichen engeren Lesarten.
translation_notes:
  register: Moderne, klare und zugleich würdige Psalmsprache. Die zwei kurzen Ausrufesätze bilden den hebräischen Parallelismus nach; die Umstellung „Sehr tief sind“ setzt den Intensitätsgrad poetisch hervor.
