lexical_decisions:
- source_word: לְהַגִּיד
  choice: zu verkünden
  rationale: Der Infinitiv mit לְ führt die Aussage des vorhergehenden Verses weiter und bezeichnet, was gut ist. „Verkünden“ bewahrt den öffentlichen, bezeugenden Charakter des Verbs.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Die Präposition בְּ mit dem bestimmten Substantiv bezeichnet hier die Zeit. „Am Morgen“ ist idiomatisches modernes Deutsch und bildet den zeitlichen Gegenpol zu den Nächten.
- source_word: חַסְדֶּךָ
  choice: deine beständige Liebe
  rationale: חֶסֶד umfasst zugewandte Liebe, Güte und verlässliche Loyalität. „Beständige Liebe“ gibt Zuneigung und Dauerhaftigkeit wieder, ohne den Begriff auf eine bestimmte theologische Deutung zu verengen.
- source_word: וֶאֱמוּנָתְךָ
  choice: und deine Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Beständigkeit. „Treue“ ist im Deutschen knapp, natürlich und passt zum Parallelismus mit „beständiger Liebe“.
- source_word: בַּלֵּילוֹת
  choice: in den Nächten
  rationale: Der hebräische Text verwendet den Plural „Nächte“. Die Übersetzung erhält diese Form und den poetischen Parallelismus, während die Fußnote auf den möglichen wiederholenden Sinn hinweist.
