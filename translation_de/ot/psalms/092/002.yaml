  language: de
  text: deine beständige Liebe am Morgen zu verkünden und deine Treue in den Nächten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nacht für Nacht.“ Der hebräische Text verwendet den Plural „Nächte“, der wiederholtes nächtliches Lob ausdrücken kann.'
