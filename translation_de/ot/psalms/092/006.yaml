  yaml_path: translation/ot/psalms/092/006.yaml
  text: 'A brutish man does not know[a], and a fool does not understand this:'
translation:
  language: de
  text: 'Ein stumpfsinniger Mensch erkennt es nicht,[a] und ein Narr versteht dies nicht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein unvernünftiger Mensch“ oder „Ein Mensch ohne Einsicht“. Das hebräische Wort beschreibt jemanden als geistig stumpf und bildlich einem Tier gleich, nicht bloß als ungebildet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Mensch
  rationale: Das Substantiv bezeichnet hier einen einzelnen Menschen als Vertreter eines allgemeinen Typus. „Mensch“ ist im heutigen Deutsch natürlich und bewahrt den allgemeinen Aussagecharakter.
- source_word: בַּעַר
  choice: unvernünftig
  rationale: Das Wort beschreibt einen in seiner Einsicht abgestumpften, tierähnlich unverständigen Menschen. „Unvernünftig“ gibt den Sinn klar wieder; die stärkeren bildhaften Alternativen werden in der Fußnote genannt.
- source_word: יֵדָע
  choice: erkennt es nicht
  rationale: ידע bezeichnet hier fehlende Erkenntnis oder Wahrnehmung. Das ergänzte „es“ verweist natürlich auf den im Kontext gemeinten Sachverhalt und bildet einen leichten Bedeutungsunterschied zu „versteht“ ab.
- source_word: כְסִיל
  choice: Narr
  rationale: כְסִיל ist ein geläufiger Weisheitsbegriff für einen moralisch wie geistig törichten Menschen. „Narr“ bewahrt den würdevollen poetischen Ton.
- source_word: יָבִין
  choice: versteht ... nicht
  rationale: בין betont Einsicht und Unterscheidungsvermögen. „versteht“ ist modernes, klares Deutsch und erhält den Parallelismus mit „erkennt“.
- source_word: אֶת זֹאת
  choice: dies
  rationale: Die Verbindung aus Objektmarker und Demonstrativpronomen weist auf den im Zusammenhang genannten beziehungsweise folgenden Sachverhalt. Der Doppelpunkt lässt die vorausweisende Funktion offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. „Mensch“ vermeidet eine unnötige Beschränkung auf männliche Personen, während „Narr“ den traditionellen Weisheitsbegriff erhält. Der Doppelpunkt bewahrt den möglichen Vorausverweis auf den folgenden Vers.
