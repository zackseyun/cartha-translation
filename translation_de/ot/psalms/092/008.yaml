base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/008.yaml
  text: But you are on high forever[a], O Yahweh.
translation:
  language: de
  text: Du aber bist auf ewig erhaben, Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell wird der Gottesname mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Du aber
  rationale: Die Verbindung aus Konjunktion und selbstständigem Pronomen hebt den Gegensatz zum Untergang der Frevler im vorherigen Vers hervor.
- source_word: מָרוֹם
  choice: erhaben
  rationale: Das Wort bezeichnet Höhe beziehungsweise einen erhöhten Zustand. »Erhaben« bewahrt hier die räumlich-metaphorische Bedeutung, ohne daraus den Titel »der Höchste« zu machen.
- source_word: לְ/עֹלָם
  choice: auf ewig
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; »auf ewig« ist im Deutschen klar, würdig und psalmengemäß.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in direkter Anrede
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die direkte Wiedergabe als »Jahwe« bewahrt den persönlichen Namen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Deutung von מָרוֹם
  choice: erhaben
  alternative: der Höchste
  rationale: Die Formulierung wird prädikativ verstanden. Damit bleibt offen, ob die Höhe räumlich oder als Bild für Gottes Überlegenheit gemeint ist, statt das Wort als festen Gottestitel festzulegen.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die knappe hebräische Nominalkonstruktion wird mit »bist« natürlich ergänzt; die direkte Anrede am Versende bleibt erhalten.
