id: PSA.92.14
reference: Psalms 92:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: de
  text: Noch im hohen Alter tragen sie Frucht; saftvoll und grün sind sie.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Noch im hohen Alter werden sie Frucht tragen; saftvoll und grün werden sie sein.“ Die hebräischen Verbformen können auch futurisch wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „fett und grün“. Im Pflanzenbild meint „fett“ üppige, gut genährte Lebenskraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: noch
  rationale: Das Adverb bezeichnet hier die Fortdauer der im Zusammenhang geschilderten Lebenskraft.
- source_word: יְנוּבוּן
  choice: tragen sie Frucht
  rationale: Das Verb נוב bezeichnet das Hervorbringen von Ertrag und fügt sich präzise in das umgebende Bild von Bäumen und Pflanzen ein.
- source_word: בְּשֵׂיבָה
  choice: im hohen Alter
  rationale: Das Substantiv verweist wörtlich auf graues Haar, bezeichnet idiomatisch jedoch das Alter; „im hohen Alter“ ist natürlich und wahrt den zeitlichen Akzent.
- source_word: דְּשֵׁנִים
  choice: saftvoll
  rationale: Wörtlich bedeutet das Wort „fett“ oder „üppig“; im Pflanzenbild bezeichnet es kräftige, gut genährte Frische. „Saftvoll“ gibt dieses Bild im Deutschen knapp und natürlich wieder.
- source_word: רַעֲנַנִּים
  choice: grün
  rationale: Das Wort bezeichnet frische, üppige Vegetation; „grün“ bewahrt das Pflanzenbild und bildet eine klare Parallele zu „saftvoll“.
- source_word: יִהְיוּ
  choice: sind sie
  rationale: Der hebräische Imperfekt kann in poetischer Sprache eine allgemeine oder fortdauernde Wirklichkeit ausdrücken; das deutsche Präsens passt zum beschreibenden Charakter des Verses.
theological_decisions:
- issue: Aspekt und Zeitstufe der hebräischen Imperfektformen
  choice: 'Präsentisch-allgemein: „tragen … sind“'
  alternative: 'Futurisch: „werden … Frucht tragen; werden … sein“'
  rationale: Im Zusammenhang beschreibt der Vers allgemein die fortdauernde Lebenskraft der Gerechten. Da die hebräischen Formen zugleich futurisch verstanden werden können, wird diese Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klar erkennbarem Pflanzenbild. Die invertierte zweite Vershälfte wahrt den poetischen Parallelismus, ohne altertümlich zu wirken.
