base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: de
  text: Mein Auge hat auf meine Widersacher geblickt[a]; meine Ohren werden von den Übeltätern hören, die sich gegen mich erheben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die geblickt, die mich feindselig beobachten“; das hebräische Wort kann wörtlicher feindliche Beobachter oder Aufpasser bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „meine Ohren hören“ oder „meine Ohren haben gehört“; die hebräische Verbform lässt im poetischen Zusammenhang unterschiedliche zeitliche Auffassungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: hat … geblickt
  rationale: נבט bezeichnet das Schauen oder Hinblicken. Das deutsche Perfekt gibt die abgeschlossene Handlung mit gegenwärtigem Bezug natürlich wieder, ohne Genugtuung oder Triumph ausdrücklich hinzuzufügen.
- source_word: עֵינִי
  choice: Mein Auge
  rationale: Der hebräische Singular wird beibehalten; er ist auch im Deutschen als poetische Redeweise verständlich.
- source_word: בְּשׁוּרָי
  choice: auf meine Widersacher
  rationale: Das seltene Wort kann feindliche Beobachter oder Aufpasser bezeichnen. Im Zusammenhang ist die gegnerische Bedeutung klar; „Widersacher“ bewahrt sie, ohne die Tätigkeit zu stark festzulegen.
- source_word: בַּקָּמִים עָלַי
  choice: die sich gegen mich erheben
  rationale: Die Verbindung von קום mit על bezeichnet feindliches Auftreten gegen jemanden. Die deutsche Formulierung erhält das Bild des Sich-Erhebens.
- source_word: מְרֵעִים
  choice: Übeltäter
  rationale: Das Partizip bezeichnet Menschen, die Böses tun oder Schaden anrichten. „Übeltäter“ ist knapp, verständlich und wahrt die moralische Aussage.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: meine Ohren werden … hören
  rationale: Das feminine Verb im Plural stimmt mit „Ohren“ überein. Die Zukunftsform bildet den hebräischen Imperfekt ab und bewahrt die poetische Personifikation; je nach Verständnis des poetischen Zusammenhangs ist auch eine gegenwärtige oder rückblickende Wiedergabe möglich.
theological_decisions:
- issue: Unausgesprochener Inhalt des Sehens und Hörens
  choice: Kein Ergebnis wie Niederlage, Vergeltung oder Untergang ergänzen
  alternative: „Mein Auge sieht den Sturz meiner Feinde, und meine Ohren hören von ihrer Niederlage“
  rationale: Der hebräische Text nennt nur die feindlichen Personen als Gegenstand des Blickens und Hörens; das konkrete Schicksal der Gegner bleibt unausgesprochen. Eine Ergänzung würde die im Ausgangstext vorhandene Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Der Singular „mein Auge“ und die Personifikation „meine Ohren hören“ folgen bewusst der Bildsprache des Hebräischen. Die seltene Bezeichnung der Gegner wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlicher erläutert.
