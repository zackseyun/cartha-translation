  text: כִּ֤י שִׂמַּחְתַּ֣/נִי יְהוָ֣ה בְּ/פָעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖י יָדֶ֣י/ךָ אֲרַנֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: de
  text: Denn du hast mich froh gemacht, Jahwe[a], durch dein Werk; über die Werke deiner Hände juble ich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der persönliche Name Gottes; traditionell oft mit „der HERR“ wiedergegeben.'
    reason: translation_convention
  - marker: b
    text: 'Oder: „singe ich vor Freude“. Das hebräische Verb kann sowohl jubelndes Singen als auch einen lauten Freudenruf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet den Grund für den vorausgehenden Lobpreis ein; „Denn“ bewahrt den kausalen Zusammenhang und passt zum poetischen Ton.
- source_word: שִׂמַּחְתַּנִי
  choice: du hast mich froh gemacht
  rationale: Die Piel-Form mit Suffix der 1. Person Singular bezeichnet, dass Jahwe den Beter froh gemacht hat. Die Formulierung ist klar, gegenwärtig und wahrt den kausativen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּפָעֳלֶךָ
  choice: durch dein Werk
  rationale: 'פֹּעַל bezeichnet ein Werk, Tun oder eine Tat. בְּ wird hier instrumental beziehungsweise kausal verstanden: Gottes Werk ist der Grund der Freude. Der Singular des Hebräischen bleibt erhalten.'
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: über die Werke deiner Hände
  rationale: Die konkrete hebräische Wendung „Werke deiner Hände“ bleibt erhalten. „Über“ bezeichnet natürlich den Anlass des Jubels, ohne die Bildsprache aufzulösen.
- source_word: אֲרַנֵּן
  choice: juble ich
  rationale: רנן kann freudiges Singen oder einen lauten Jubelruf bezeichnen. „Juble ich“ bewahrt diese Bedeutungsbreite besser als eine Festlegung allein auf Gesang; das Imperfekt wird im Zusammenhang als gegenwärtige Reaktion wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ macht dies sichtbar, statt den Namen durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Wiederholung von „Werk/Werke“ und das konkrete Bild „deiner Hände“ entsprechen der hebräischen Gestaltung; „juble ich“ erhält die Mehrdeutigkeit zwischen Gesang und Freudenruf.
