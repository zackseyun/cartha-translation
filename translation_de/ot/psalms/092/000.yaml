  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Der geläufige deutsche Fachbegriff gibt die Überschriftbezeichnung mit ihrer musikalischen Prägung natürlich und präzise wieder.
- source_word: שִׁיר
  choice: Lied
  rationale: Das gewöhnliche hebräische Wort für ein Lied bleibt als eigenes Substantiv erhalten, sodass die Paarung mit מִזְמוֹר nicht eingeebnet wird.
- source_word: לְיוֹם
  choice: für
  rationale: Die Präposition לְ bezeichnet hier Zweck oder Zuordnung. Im Deutschen gibt „für den Sabbat“ die Funktion idiomatisch wieder, ohne das im Deutschen entbehrliche „Tag“ ausdrücklich zu wiederholen.
- source_word: הַשַּׁבָּת
  choice: den Sabbat
  rationale: „Sabbat“ bezeichnet eindeutig den bestimmten Ruhetag und ist im modernen Standarddeutsch die natürliche Entsprechung.
theological_decisions:
- issue: Funktion des Verses als Überschrift statt als poetische Zeile
  choice: 'Als Überschrift in zwei knappen Nominalsätzen: „Ein Psalm. Ein Lied für den Sabbat.“'
  alternative: Als erste poetische Zeile ohne Überschriftencharakter oder als ein einziger Satz mit Apposition
  rationale: Der hebräische Text enthält keine finite Verbform und besteht aus typischen Elementen einer Psalmüberschrift. Die knappe Zeichensetzung wahrt diese literarische Funktion und lässt zugleich das Verhältnis zwischen „Psalm“ und „Lied“ offen.
translation_notes:
  register: Modernes, verständliches und würdevolles Standarddeutsch. Die Überschrift bleibt knapp; „Sabbat“ ist präziser und natürlicher als „Sabbattag“. Keine Fußnote ist nötig, da die formale Variante „für den Tag des Sabbats“ keinen wesentlichen zusätzlichen Sinn erschließt.
