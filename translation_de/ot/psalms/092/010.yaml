source:
  edition: WLC
  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: de
  text: Doch du hast mein Horn hoch erhoben wie das eines Wildstiers[a]; ich bin mit frischem Öl gesalbt worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ein mächtiges wildes Rind. Ältere Übersetzungen geben es bisweilen mit „Einhorn“ wieder.
    reason: cultural_note
  - marker: b
    text: 'Möglicherweise wörtlicher: „Ich bin mit frischem Öl benetzt worden.“ Auch „vermischt“ wird als Bedeutung des ungewöhnlichen hebräischen Verbs erwogen; seine genaue Nuance ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: du hast … hoch erhoben
  rationale: Die Form von רום bezeichnet das Erhöhen beziehungsweise Hochheben. Der direkte Bezug auf Gott und die poetische Bewegung des Bildes bleiben erhalten.
- source_word: כִּרְאֵים
  choice: wie das eines Wildstiers
  rationale: רְאֵם bezeichnet ein kräftiges wildes Rind, nicht das sagenhafte Einhorn. Die Formulierung macht im Deutschen deutlich, dass das Horn des Sprechers mit dem Horn des Wildstiers verglichen wird.
- source_word: קַרְנִי
  choice: mein Horn
  rationale: Das konkrete Bild für Kraft, Würde und Macht wird bewahrt und nicht durch eine Deutung ersetzt.
- source_word: בַּלֹּתִי
  choice: ich bin … gesalbt worden
  rationale: Das seltene Verb wird wegen seiner Verbindung mit Öl idiomatisch als Salbung wiedergegeben. Da seine genaue Bedeutung umstritten ist, nennt eine Fußnote die wörtlicheren Möglichkeiten.
- source_word: בְּשֶׁמֶן
  choice: mit … Öl
  rationale: Die Präposition wird in der Verbindung mit der gewählten passivischen Wiedergabe natürlich instrumental übersetzt.
- source_word: רַעֲנָן
  choice: frischem
  rationale: רַעֲנָן vermittelt Frische, Lebenskraft und Üppigkeit; „frisches Öl“ ist eine natürliche deutsche Verbindung.
theological_decisions:
- issue: Bildsprache des Horns
  choice: „Horn“ als Metapher beibehalten
  alternative: „Kraft“ oder „Macht“
  rationale: Das Bild trägt die poetische und theologische Aussage von verliehener Stärke und Würde und bleibt im Deutschen verständlich.
- issue: Bedeutung von בַּלֹּתִי in Verbindung mit Öl
  choice: „ich bin mit frischem Öl gesalbt worden“
  alternative: „ich bin mit frischem Öl benetzt/übergossen worden“ oder „ich bin mit frischem Öl vermischt“
  rationale: Die Salbung ist im Zusammenhang mit Öl eine plausible idiomatische Wiedergabe, darf aber wegen des ungewöhnlichen und umstrittenen Verbs nicht als einzig mögliche Bedeutung erscheinen; die Spannung wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die vertraute Hornmetapher wird formal bewahrt; „Wildstier“ vermeidet das sachlich irreführende „Einhorn“. Die Hauptzeile liest בַּלֹּתִי idiomatisch, während die Fußnote die echte lexikalische Unsicherheit sichtbar hält.
