  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: de
  text: 'Denn sieh: deine Feinde, Jahwe,

    denn sieh: deine Feinde werden untergehen;

    alle, die Unrecht tun, werden zerstreut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „alle Täter des Unrechts“. Für „werden zerstreut“ ist auch „werden sich zerstreuen“ oder „werden auseinandergehen“ möglich.'
    reason: Dokumentiert die nominale hebräische Wendung פֹּעֲלֵי אָוֶן und wahrt beim Hitpael יִתְפָּרְדוּ die offene Nuance des Sich-Trennens bzw. Auseinandergehens.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorhergehenden Vers und klingt im Deutschen natürlich.
- source_word: הִנֵּה
  choice: sieh
  rationale: Gibt den hinweisenden und nachdrücklich-vergewissernden Charakter wieder, ohne das heute altertümliche „siehe“ zu verwenden.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Direkte Wiedergabe des Plurals mit Suffix der zweiten Person Singular.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: Denn sieh ... denn sieh
  rationale: Erhält die markante poetische Wiederholung und ihren Nachdruck.
- source_word: יֹאבֵדוּ
  choice: werden untergehen
  rationale: Gibt אבד idiomatisch wieder, ohne die konkrete Art des Verderbens näher festzulegen.
- source_word: יִתְפָּרְדוּ
  choice: werden zerstreut
  rationale: Das Hitpael von פרד bezeichnet hier das Auseinandergehen beziehungsweise Zerstreutwerden; die Formulierung passt zum poetischen Parallelismus.
- source_word: כָּל
  choice: alle
  rationale: Bewahrt den umfassenden Geltungsbereich.
- source_word: פֹּעֲלֵי אָוֶן
  choice: alle, die Unrecht tun
  rationale: Natürliche moderne Wiedergabe der wörtlichen Wendung „Täter des Unrechts“, wobei sowohl das tätige Handeln als auch das moralisch Verwerfliche erhalten bleiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als direkte Anrede. „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. Die doppelte Formel „Denn sieh“ bleibt als bewusstes Stilmittel erhalten; unnötig altertümliche Wörter werden vermieden.
