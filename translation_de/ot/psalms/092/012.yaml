  text: צַ֭דִּיק כַּ/תָּמָ֣ר יִפְרָ֑ח כְּ/אֶ֖רֶז בַּ/לְּבָנ֣וֹן יִשְׂגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/012.yaml
  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: de
  text: Der Gerechte blüht wie eine Palme; wie eine Zeder auf dem Libanon wächst er empor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Gerechte gedeiht wie eine Palme; wie eine Zeder auf dem Libanon wird er groß.“'
    reason: Die beiden Verben können neben dem bildhaften „blühen“ und „emporwachsen“ auch allgemeiner kräftiges Gedeihen beziehungsweise Großwerden ausdrücken.
lexical_decisions:
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das singularische maskuline Adjektiv wird substantivisch gebraucht. „Der Gerechte“ bildet Form und repräsentativen Charakter natürlich ab, ohne ein zusätzliches Substantiv einzufügen.
- source_word: כַּתָּמָר
  choice: wie eine Palme
  rationale: Die Vergleichspartikel כ und תמר ergeben „wie eine Palme“. Der unbestimmte Artikel entspricht im Deutschen dem natürlichen Ausdruck eines Vergleichs.
- source_word: יִפְרָח
  choice: blüht
  rationale: פרח bezeichnet das Sprossen oder Blühen und übertragen das Gedeihen. „Blüht“ bewahrt hier das konkrete Pflanzenbild und trägt zugleich den übertragenen Sinn.
- source_word: כְּאֶרֶז
  choice: wie eine Zeder
  rationale: Die Wendung stellt einen Vergleich mit einer Zeder her; der unbestimmte Artikel ist im Deutschen idiomatisch.
- source_word: בַּלְּבָנוֹן
  choice: auf dem Libanon
  rationale: Die Präposition ב bezeichnet hier den Standort. Im Deutschen ist „auf dem Libanon“ als Bezeichnung des Gebirges natürlich und näher am hebräischen „im/auf dem Libanon“ als die traditionelle Herkunftsangabe „des Libanon“.
- source_word: יִשְׂגֶּה
  choice: wächst empor
  rationale: Das Verb שׂגה bezeichnet Zunehmen, Großwerden oder kräftiges Wachstum. „Wächst empor“ passt zum Zedernbild, ohne die mögliche Bedeutung so eng auf bloße Höhe festzulegen wie „wird hoch“.
theological_decisions: []
