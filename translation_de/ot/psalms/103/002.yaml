source:
  edition: WLC
  text: בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/אַל תִּ֝שְׁכְּחִ֗י כָּל גְּמוּלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/002.yaml
  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: de
  text: Lobe Jahwe, meine Seele, und vergiss nicht all seine Wohltaten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein ganzes Handeln“ oder „alle seine Vergeltungen“. Das hebräische Wort kann allgemein bezeichnen, was jemand von einem anderen empfängt; hier legt der Zusammenhang den positiven Sinn „Wohltaten“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Lobe
  rationale: Der feminine Singular des Imperativs richtet sich an נַפְשִׁי. Im Deutschen ist „Jahwe loben“ die natürliche religiöse Entsprechung; das wörtlichere „segnen“ wäre bei Gott als Objekt missverständlich.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש bezeichnet hier das eigene Selbst, das der Psalmist unmittelbar anspricht. „Meine Seele“ bewahrt die poetische Personifikation und ist im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאַל תִּשְׁכְּחִי
  choice: und vergiss nicht
  rationale: Die Verbindung aus וְ, der Verneinungspartikel אַל und der Verbform der 2. Person feminin Singular ergibt eine unmittelbar an die Seele gerichtete negative Aufforderung.
- source_word: כָּל גְּמוּלָיו
  choice: all seine Wohltaten
  rationale: גמול kann allgemein das von jemandem Empfangene, sein Handeln oder seine Vergeltung bezeichnen. Der folgende Kontext zählt Gottes gnädige Taten auf, weshalb „Wohltaten“ hier den positiven Sinn treffend wiedergibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diese Namensfunktion, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutungsumfang von גְּמוּלָיו
  choice: seine Wohltaten
  alternative: sein ganzes Handeln / alle seine Vergeltungen
  rationale: Der unmittelbare Dankkontext spricht für das Gute, das Gott gewährt. Da das Wort an sich breiter ist, wird diese echte lexikalische Spannweite in einer Fußnote offengelegt.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch. Die direkte Selbstanrede bleibt erhalten; „Lobe“ ist gegenüber dem wörtlicheren, im Deutschen jedoch missverständlichen „Segne“ idiomatisch.
