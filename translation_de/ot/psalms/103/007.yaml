  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: de
  text: Er machte Mose seine Wege bekannt, den Söhnen Israels[a] seine Taten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Kindern Israels“ oder „dem Volk Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: ließ … erkennen
  rationale: 'Das Hifil von ידע hat kausative Bedeutung: jemanden erkennen lassen bzw. etwas bekannt machen. Die Formulierung ist im Deutschen natürlich und bewahrt diesen Sinn.'
- source_word: דְּרָכָיו
  choice: seine Wege
  rationale: Die Wiedergabe bewahrt das hebräische Bild und bezeichnet hier Gottes Art und Weise zu handeln.
- source_word: לְמֹשֶׁה
  choice: Mose
  rationale: Mose ist der Empfänger dessen, was Gott erkennen ließ; die deutsche Konstruktion mit „ließ … erkennen“ benötigt keine Präposition.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formal genaue Wiedergabe erhält den maskulinen Plural des traditionellen hebräischen Volksnamens.
- source_word: עֲלִילוֹתָיו
  choice: seine Taten
  rationale: Das Substantiv bezeichnet Handlungen oder Taten. „Taten“ ist klar und fügt nicht die im Wort selbst unausgesprochene Wertung „mächtig“ hinzu.
theological_decisions:
- issue: Geschlechtlich geprägter Kollektivausdruck בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Kinder Israels; das Volk Israel
  rationale: Der hebräische Ausdruck ist ein grammatisch maskuliner Plural und zugleich eine feste Bezeichnung für das Bundesvolk. Der Haupttext gibt die Form genau wieder; die Fußnote nennt die im Deutschen geläufigeren kollektiven Wiedergaben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt erhalten; das im zweiten Halbvers ausgelassene Verb wird aus dem ersten Halbvers mitverstanden.
