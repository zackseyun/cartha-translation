id: PSA.103.8
reference: Psalms 103:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: de
  text: Barmherzig und gnädig ist Jahwe, langsam zum Zorn und reich an beständiger Liebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet beständige, verlässliche Liebe und Güte; je nach Zusammenhang auch „treue Liebe“ oder „Bundestreue“.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: barmherzig
  rationale: Das Adjektiv bezeichnet tiefes Erbarmen und mitfühlende Zuwendung. „Barmherzig“ ist im Deutschen verständlich, würdevoll und in dieser Gottesprädikation idiomatisch.
- source_word: חַנּוּן
  choice: gnädig
  rationale: „Gnädig“ bewahrt den Sinn frei gewährter Gunst und unterscheidet sich semantisch ausreichend von „barmherzig“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Die wörtliche hebräische Wendung „lang an den Nasenlöchern“ ist ein Idiom für verzögerten Zorn. Die gewählte Form gibt dieses Bild sinngemäß und knapp wieder.
- source_word: רַב
  choice: reich an
  rationale: In Verbindung mit חֶסֶד bezeichnet רַב eine große Fülle. „Reich an“ ist natürliches modernes Deutsch.
- source_word: חָסֶד
  choice: beständige Liebe
  rationale: Die Formulierung bringt sowohl liebevolle Zuwendung als auch Dauer und Verlässlichkeit zum Ausdruck, ohne den vielschichtigen Begriff ausschließlich auf Bundestreue einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Wiedergabe von חָסֶד
  choice: beständige Liebe
  alternative: treue Liebe; Bundestreue; Güte
  rationale: „Beständige Liebe“ hält Zuneigung und Verlässlichkeit zusammen. „Bundestreue“ wäre in diesem Vers enger und würde eine mögliche kontextuelle Dimension zur vollständigen Definition des Wortes machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Doppelprädikation folgt der hebräischen Hervorhebung; „langsam zum Zorn“ bewahrt die vertraute und zugleich verständliche idiomatische Form.
