  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: de
  text: 'Von David.[a]


    Preise Jahwe, meine Seele,

    ja, seinen heiligen Namen mit allem, was in mir ist!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Überschrift kann auch „Für David“ oder „David zugehörig“ bedeuten.
    reason: Die Präposition לְ bezeichnet die Beziehung zu David, legt aber Autorschaft, Widmung oder Zugehörigkeit nicht eindeutig fest.
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Überschrift kennzeichnet eine Beziehung zu David. „Von David“ ist im Deutschen knapp und idiomatisch, ohne die im Hebräischen nicht ausdrücklich festgelegte Art dieser Beziehung vollständig zu bestimmen.
- source_word: בָּרֲכִי
  choice: Preise
  rationale: Das Piel von ברך bedeutet gegenüber Gott, ihn ehrend zu rühmen beziehungsweise zu preisen. „Preise“ gibt den Sinn im heutigen Deutschen natürlicher wieder als das missverständliche „Segne“ und bewahrt den poetischen Aufruf.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש bezeichnet hier im Selbstaufruf die eigene Seele beziehungsweise das eigene Selbst. „Meine Seele“ wahrt die poetische Personifikation und ist im modernen Standarddeutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְכָל קְרָבַי
  choice: und alles in mir
  rationale: Der hebräische Ausdruck spricht wörtlich von allen inneren Teilen. „Alles in mir“ vermittelt idiomatisch, dass der ganze innere Mensch zum Preisen aufgerufen wird; die konkretere Bildsprache wird in einer Fußnote erhalten.
- source_word: שֵׁם קָדְשׁוֹ
  choice: seinen heiligen Namen
  rationale: Die hebräische Genitivverbindung bedeutet idiomatisch „seinen heiligen Namen“ und bewahrt sowohl den Namen als auch dessen Heiligkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ברך bei Gott als Objekt
  choice: Preise
  alternative: Segne; Lobe
  rationale: Wenn Menschen Gott „segnen“, ist ehrendes Preisen gemeint. „Preise“ vermeidet im Deutschen die mögliche Vorstellung, der Mensch verleihe Gott Segen, ohne die kultisch-reverente Aussage abzuschwächen.
translation_notes:
  register: Poetisch, würdig und in modernem Standarddeutsch. Die Verszeilen erhalten den parallelen Selbstaufruf; das Prädikat der zweiten Zeile ist wie im Hebräischen elliptisch aus der ersten mitzudenken.
