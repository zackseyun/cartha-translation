source:
  edition: WLC
  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: de
  text: Preist Jahwe, all seine Werke, an allen Orten seiner Herrschaft! Preise Jahwe, meine Seele!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: Preist / Preise
  rationale: ברך bedeutet in dieser an Gott gerichteten Aufforderung, ihn lobend zu rühmen. „Preisen“ ist im heutigen Deutschen natürlicher als „segnen“ und bewahrt durch die Wiederholung den poetischen Rahmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, wodurch der im Hebräischen ausdrücklich gebrauchte Eigenname sichtbar bleibt.
- source_word: כָּל מַעֲשָׂיו
  choice: all seine Werke
  rationale: מַעֲשֶׂה umfasst hier Gottes Taten und das von ihm Geschaffene; „Werke“ bewahrt diese Bedeutungsweite und eignet sich als Anrede der gesamten Schöpfung.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: an allen Orten seiner Herrschaft
  rationale: Die Wendung bezeichnet alle Orte, auf die sich Gottes Herrschaft erstreckt. Die räumliche Form des Hebräischen bleibt erhalten, ohne sie erklärend auf „überall“ zu verkürzen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ steht in direkter Selbstanrede. „Meine Seele“ ist im Deutschen würdig, verständlich und bewahrt die poetische Personifikation.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt diesen Eigennamecharakter, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutung von ברך bei einem menschlichen oder geschöpflichen Subjekt und Gott als Objekt
  choice: preisen
  alternative: segnen
  rationale: Wenn Geschöpfe Gott ברך, bringen sie lobende Verehrung zum Ausdruck. „Preisen“ vermittelt diese Funktion im modernen Deutschen klarer; „segnen“ wäre formnäher, kann aber missverständlich nach einer Segensspende an Gott klingen.
translation_notes:
  register: Poetisch, würdig und zugleich gegenwartsnah. Die zweimalige Aufforderung „Preist/Preise Jahwe“ bildet den hebräischen Refrain nach; der Wechsel vom Plural zur singularischen Selbstanrede bleibt sichtbar.
