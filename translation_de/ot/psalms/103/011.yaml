id: PSA.103.11
reference: Psalms 103:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: de
  text: Denn so hoch der Himmel über der Erde ist, so mächtig ist seine treue Liebe zu denen, die ihn fürchten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Barmherzigkeit“ oder „seine Bundestreue“. Das hebräische Wort חֶסֶד bezeichnet eine verlässliche, loyale und liebevolle Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem erklärenden Zusammenhang.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל הָאָרֶץ
  choice: so hoch der Himmel über der Erde ist
  rationale: Gibt den gradvergleichenden Sinn der כ-Konstruktion natürlich wieder; der deutsche Singular „Himmel“ ist hier idiomatisch und bezeichnet den sichtbaren beziehungsweise oberen Himmel.
- source_word: גָּבַר
  choice: so mächtig ist
  rationale: Bewahrt stärker als das allgemeinere „groß“ den Grundsinn von Stärke und Überlegenheit, ohne einen Kampf anzudeuten.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: Verbindet Zuneigung mit Beständigkeit und Loyalität und gibt so die Bedeutungsbreite von חֶסֶד im Kontext verständlich wieder.
- source_word: עַל יְרֵאָיו
  choice: zu denen, die ihn fürchten
  rationale: „Zu“ bezeichnet die relationale Ausrichtung der Liebe; „fürchten“ wahrt die direkte lexikalische Aussage und schließt ehrfürchtige Scheu ein.
theological_decisions:
- issue: Wiedergabe von חֶסֶד als Ausdruck beständiger, loyaler Zuwendung Gottes
  choice: seine treue Liebe
  alternative: seine Barmherzigkeit; seine Bundestreue
  rationale: „Treue Liebe“ bewahrt sowohl die persönliche Zuwendung als auch deren verlässlichen, loyalen Charakter, ohne den Begriff auf Erbarmen allein zu verengen oder einen im Vers nicht ausdrücklich genannten Bund einzutragen.
- issue: Bedeutung der Gottesfurcht in יְרֵאָיו
  choice: die ihn fürchten
  alternative: die ihn verehren
  rationale: Die direkte Wiedergabe erhält die Spannung des hebräischen Begriffs zwischen Furcht und Ehrfurcht; „verehren“ würde seine Stärke abschwächen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit klarer Vergleichsstruktur. „Mächtig“ erhält die Kraft des hebräischen Verbs; die Fußnote erschließt die Bedeutungsbreite des Schlüsselwortes חֶסֶד.
