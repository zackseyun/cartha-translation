  text: to those who keep his covenant[a], and to those who remember his precepts[b], to do them.
translation:
  language: de
  text: denen, die seinen Bund halten[a] und an seine Weisungen denken[b], um sie zu befolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Bund bewahren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Anordnungen“ oder „seine Vorschriften“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: die … halten
  rationale: Das Partizip von שׁמר kann bewahren, hüten oder einhalten bedeuten. In Verbindung mit einem Bund bezeichnet „halten“ idiomatisch die treue Beachtung und wahrt zugleich die traditionelle Bundessprache.
- source_word: בְרִיתוֹ
  choice: seinen Bund
  rationale: בְּרִית bezeichnet hier den Bund Gottes; „Bund“ bewahrt den biblisch-theologischen Gehalt besser als säkulare Alternativen wie „Vertrag“.
- source_word: וּלְזֹכְרֵי
  choice: und an … denken
  rationale: זכר bezeichnet hier ein erinnerndes Beachten, das auf entsprechendes Handeln zielt. „An … denken“ ist im modernen Deutsch natürlich; der folgende Zwecksatz macht die praktische Ausrichtung deutlich.
- source_word: פִקֻּדָיו
  choice: seine Weisungen
  rationale: פִּקּוּדִים sind von Gott auferlegte Anordnungen oder Vorgaben. „Weisungen“ ist verständlich und würdevoll und vermeidet das im heutigen Deutsch ungewöhnlichere „Vorschriften“ in poetischer Sprache.
- source_word: לַעֲשׂוֹתָם
  choice: um sie zu befolgen
  rationale: Der mit לְ gebildete Infinitiv bezeichnet hier die Ausrichtung des Erinnerns auf die Ausführung. Da man Weisungen im Deutschen natürlicherweise „befolgt“, gibt diese Formulierung die Handlung idiomatisch wieder.
theological_decisions:
- issue: Praktische Bedeutung des Erinnerns an Gottes Weisungen
  choice: „an seine Weisungen denken, um sie zu befolgen“
  alternative: „seiner Weisungen gedenken, sie zu tun“
  rationale: Die Wiedergabe erhält die syntaktische Verbindung zwischen Erinnern und Handeln. Sie beschreibt die im Vers genannte Bundestreue, ohne eine weitergehende Aussage über Verdienst oder Heilsgrund einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Psalmen-Syntax. „Weisungen“ und „befolgen“ vermitteln den ethischen Sinn verständlich, ohne die verschiedenen hebräischen Torah-Begriffe unnötig gleichzusetzen.
