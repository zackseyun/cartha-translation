source:
  edition: WLC
  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: de
  text: Preist Jahwe, ihr seine Engel, ihr starken Helden, die ihr sein Wort ausführt und auf die Stimme seines Wortes hört[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr sein Wort ausführt und der Stimme seines Wortes gehorcht.“'
    reason: Gibt den in שׁמע בקול möglichen Sinn des gehorsamen Hörens wieder, ohne die Verbindung zum vorausgehenden Partizip übermäßig festzulegen.
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Preist
  rationale: Der Pluralimperativ von ברך fordert die Engel auf, Jahwe lobpreisend zu segnen. Im Deutschen ist „Preist“ bei einer an Gott gerichteten Aufforderung natürlicher und unmissverständlicher als „Segnet“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מַלְאָכָיו
  choice: seine Engel
  rationale: מַלְאָךְ bezeichnet in diesem himmlischen Kontext Engel, nicht menschliche Boten.
- source_word: גִּבֹּרֵי כֹחַ
  choice: ihr Mächtigen an Kraft
  rationale: Bewahrt die substantivische Anrede und den Kraftbegriff des hebräischen Ausdrucks, ohne unnötig militärisch „Krieger“ zu sagen.
- source_word: עֹשֵׂי דְבָרוֹ
  choice: die ihr sein Wort ausführt
  rationale: Das Partizip beschreibt die Engel als solche, die Gottes Wort in die Tat umsetzen. „Ausführen“ ist im Deutschen natürlicher als „sein Wort tun“ und verengt דָּבָר nicht ausdrücklich auf „Befehl“.
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: und auf die Stimme seines Wortes hört
  rationale: Die feste Verbindung שׁמע בקול kann gehorsames Hören ausdrücken. Die Wiedergabe mit „auf ... hört“ bewahrt sowohl den Hörvorgang als auch den Gehorsamssinn und erhält das ungewöhnliche Bild „Stimme seines Wortes“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von שׁמע בקול
  choice: auf die Stimme ... hört
  alternative: der Stimme ... gehorcht
  rationale: Die Formulierung wahrt die im Hebräischen vorhandene Spannung zwischen Hören und Gehorchen. Im Deutschen kann „auf jemanden hören“ ebenfalls gehorsames Befolgen bezeichnen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit direkter Anrede. „Preist“ vermeidet das im heutigen Deutsch missverständliche „Segnet Jahwe“. Die Wiederholung von „Wort“ und das poetische Bild „Stimme seines Wortes“ bleiben bewusst erhalten.
