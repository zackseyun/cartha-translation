  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: de
  text: 'Von David.


    Lobe den HERRN, meine Seele, und alles, was in mir ist,[a] seinen heiligen Namen!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „all meine inneren Teile“; gemeint ist auch: „mein ganzes Inneres“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die hebräische Überschrift bezeichnet David als zugehörige Person; „von“ bewahrt die knappe Form, ohne die genaue Art der Beziehung weiter festzulegen.
- source_word: בָּרֲכִי
  choice: Lobe
  rationale: Im an Gott gerichteten deutschen Sprachgebrauch gibt „loben“ die Bedeutung von ברך idiomatisch und verständlich wieder; die feminine Singularform richtet sich an „meine Seele“.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die traditionelle und hier natürliche Wiedergabe wahrt die Selbstanrede des Beters, ohne נֶפֶשׁ auf einen bloß körperlosen Wesenskern zu verengen.
- source_word: כָל־קְרָבַי
  choice: alles, was in mir ist
  rationale: Die idiomatische Formulierung bezeichnet die gesamte innere Person; die konkretere hebräische Bildsprache wird in der Fußnote bewahrt.
- source_word: שֵׁם קָדְשׁוֹ
  choice: seinen heiligen Namen
  rationale: Die Wortfolge und der theologische Ausdruck des Hebräischen werden natürlich und eng am Ausgangstext wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERRN
  alternative: JHWH / Jahwe
  rationale: Die Schreibweise in Kapitälchen folgt der verbreiteten deutschsprachigen Bibelkonvention und macht kenntlich, dass im Hebräischen der Eigenname Gottes steht, ohne eine unsichere Vokalisierung festzulegen.
- issue: Bedeutung von נֶפֶשׁ in der Selbstanrede
  choice: Seele
  alternative: mein ganzes Wesen / mein Leben
  rationale: „Seele“ bewahrt die poetische Personifikation und die formale Verbindung zur Überlieferung; die Parallelzeile zeigt zugleich, dass die ganze innere Person gemeint ist.
translation_notes:
  register: Moderne, würdige Psalmsprache mit vertrauter Selbstanrede. Die Überschrift steht separat; der Gottesname wird nach deutscher Bibelkonvention als HERR wiedergegeben. Der Fußnotenmarker steht unmittelbar bei der idiomatischen Wiedergabe der hebräischen Wendung.
