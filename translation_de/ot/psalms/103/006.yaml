source:
  edition: WLC
  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: de
  text: Jahwe vollbringt gerechte Taten und schafft Recht für alle Unterdrückten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe übt Gerechtigkeit und vollzieht Rechtssprüche für alle, die unterdrückt werden.“'
    reason: 'Lexikalische Alternative: Die Pluralformen צְדָקוֹת und מִשְׁפָּטִים können auch kollektiv als „Gerechtigkeit“ beziehungsweise konkreter als „Rechtssprüche“ wiedergegeben werden.'
lexical_decisions:
- source_word: עֹשֵׂה
  choice: vollbringt
  rationale: Das prädikativ gebrauchte Qal-Partizip beschreibt Jahwes kennzeichnendes, fortdauerndes Handeln; „vollbringt“ verbindet diese Aussage mit dem pluralischen Objekt „gerechte Taten“ in natürlichem Deutsch.
- source_word: צְדָקוֹת
  choice: gerechte Taten
  rationale: Der Plural von צְדָקָה bezeichnet hier konkrete Erweise gerechten Handelns. Die Wiedergabe wahrt den Plural und unterscheidet den Ausdruck von den folgenden מִשְׁפָּטִים.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וּמִשְׁפָּטִים
  choice: und schafft Recht
  rationale: מִשְׁפָּטִים kann richterliche Entscheidungen oder Akte der Rechtsschaffung bezeichnen. „schafft Recht“ ist im Deutschen idiomatisch und bringt Jahwes wirksames Eintreten für Bedrückte zum Ausdruck.
- source_word: לְכָל
  choice: für alle
  rationale: לְ bezeichnet hier die Begünstigten beziehungsweise Empfänger des gerechten Handelns.
- source_word: עֲשׁוּקִים
  choice: Unterdrückten
  rationale: Das passive Partizip bezeichnet Menschen, denen durch Unterdrückung, Ausbeutung oder Unrecht Gewalt angetan wird; die substantivierte Form ist knapp und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname, statt ihn durch einen traditionellen Titel zu ersetzen.
- issue: Verhältnis von צְדָקוֹת und מִשְׁפָּטִים
  choice: gerechte Taten und schafft Recht
  alternative: Gerechtigkeit und Rechtssprüche
  rationale: 'Die gewählte Fassung hält die beiden Begriffe auseinander: Der erste bezeichnet gerechte Handlungen, der zweite richterliches beziehungsweise rechtschaffendes Eingreifen. So wird ihre Nähe bewahrt, ohne sie gleichzusetzen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schafft Recht“ ist eine geläufige biblisch-literarische Wendung, bleibt aber auch für heutige Leser verständlich; die Formulierung vermeidet eine unnötig abstrakte Doppelung von „Gerechtigkeit“ und „Recht“.
