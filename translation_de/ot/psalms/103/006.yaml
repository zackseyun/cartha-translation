  source_fidelity: Die Übersetzung gibt das prädikative Partizip עֹשֵׂה angemessen als fortdauerndes Handeln wieder. „gerechte Taten“ wahrt den Plural von צְדָקוֹת und unterscheidet ihn sinnvoll von מִשְׁפָּטִים. „schafft Recht“ ist eine idiomatische, kontextuell passende kollektive Wiedergabe der gerichtlichen bzw. rechtsschaffenden Handlungen für die Unterdrückten. Die Begünstigtenangabe „für alle Unterdrückten“ entspricht לְכָל עֲשׁוּקִים.
