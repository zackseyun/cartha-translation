  text: כִּ֤י ר֣וּחַ עָֽבְרָה בּ֣/וֹ וְ/אֵינֶ֑/נּוּ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/016.yaml
  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
translation:
  language: de
  text: Denn der Wind fährt über ihn hinweg, und er ist nicht mehr[a]; sein Ort kennt ihn nicht mehr[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und er ist nicht«; gemeint ist, dass er nicht mehr da ist.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text stellt den Ort bildlich als jemanden dar, der den Verschwundenen nicht mehr kennt oder wiedererkennt.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den Vergleich des menschlichen Lebens mit Gras und Feldblume im vorigen Vers ein.
- source_word: רוּחַ
  choice: Wind
  rationale: Im poetischen Zusammenhang von Gras und Blume ist »Wind« die naheliegendste Bedeutung; »Atem« oder »Geist« wären lexikalisch möglich, passen hier aber weniger gut zum Bild.
- source_word: עָבְרָה בּוֹ
  choice: fährt über ihn hinweg
  rationale: Bewahrt das einfache Bild des vorüberziehenden Windes. Das maskuline Pronomen wird beibehalten, weil es sich im unmittelbaren Zusammenhang wahrscheinlich auf den Menschen beziehungsweise auf das maskuline Bildträgerelement bezieht.
- source_word: וְאֵינֶנּוּ
  choice: und er ist nicht mehr
  rationale: Gibt die hebräische Existenzverneinung recht unmittelbar und zugleich idiomatisch wieder, ohne sie stärker als nötig zu »verschwunden« auszudeuten.
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד מְקוֹמוֹ
  choice: sein Ort kennt ihn nicht mehr
  rationale: Erhält die auffällige Personifikation des Ortes sowie die kompakte poetische Form des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Bildsprache. Die maskulinen Pronomen nehmen den Vergleich aus Vers 15 auf und lassen den Bezug auf den Menschen im Bild der vergänglichen Pflanze hörbar bleiben.
