source:
  edition: WLC
  text: אֱ֭נוֹשׁ כֶּ/חָצִ֣יר יָמָ֑י/ו כְּ/צִ֥יץ הַ֝/שָּׂדֶ֗ה כֵּ֣ן יָצִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/015.yaml
  text: As for man[a], his days are like grass; he flourishes like a flower of the field.
translation:
  language: de
  text: Der Mensch – seine Tage sind wie Gras; wie eine Feldblume, so blüht er.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „so blüht er auf.“ Das hebräische Verb bezeichnet das Blühen oder Aufblühen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: אֱנוֹשׁ bezeichnet den Menschen mit dem Beiklang seiner Schwachheit und Vergänglichkeit. „Der Mensch“ bewahrt die poetische Einzahl und bleibt im Deutschen natürlich; die Sterblichkeit wird durch das Bild des Grases deutlich.
- source_word: כֶּחָצִיר
  choice: wie Gras
  rationale: Das Präfix כ markiert einen Vergleich. „Wie Gras“ gibt ihn knapp und idiomatisch wieder.
- source_word: יָמָיו
  choice: seine Tage
  rationale: Die wörtliche Wiedergabe des Plurals mit Suffix bewahrt die hebräische Ausdrucksweise für die Lebenszeit des Menschen.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: wie eine Blume auf dem Feld
  rationale: צִיץ bezeichnet Blüte oder Blume. „Blume auf dem Feld“ bewahrt das Bild, ohne es durch „Wildblume“ näher festzulegen.
- source_word: כֵּן
  choice: so
  rationale: כֵּן bedeutet „so“ oder „ebenso“ und wird ausdrücklich wiedergegeben, um die Struktur des poetischen Vergleichs zu erhalten.
- source_word: יָצִיץ
  choice: blüht er
  rationale: Das Verb צוץ beschreibt das Blühen oder Aufblühen. „Blüht er“ bewahrt das konkrete Blumenbild und bezieht das maskuline Verb natürlich auf „der Mensch“ zurück.
