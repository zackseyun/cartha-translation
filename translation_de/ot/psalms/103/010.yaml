base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/010.yaml
  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: de
  text: Er hat uns nicht nach unseren Sünden[a] behandelt und uns nicht nach unseren Verfehlungen vergolten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat uns nicht angetan, was unsere Sünden verdienen, und uns nicht vergolten, was unsere Verfehlungen verdienen.“'
    reason: Die mit כ gebildeten Wendungen können ausdrücklich im Sinn dessen verstanden werden, was den Sünden und Verfehlungen entspräche bzw. was sie verdienten.
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  choice: nach unseren Sünden
  rationale: 'Das präfigierte כ bezeichnet hier Maß oder Entsprechung: Gott handelt nicht im Verhältnis zu den begangenen Sünden. „Nach“ ist im Deutschen knapp und idiomatisch.'
- source_word: עָשָׂה לָנוּ
  choice: handelt an uns
  rationale: עשה ist weit gefasst („tun, handeln“); zusammen mit לָנוּ bezeichnet es hier Gottes Verhalten uns gegenüber. Das Präsens gibt die im Psalm gepriesene, bleibend gültige Weise seines Handelns natürlich wieder.
- source_word: וְלֹא
  choice: und ... nicht
  rationale: Die Verbindung aus Konjunktion und Negation verknüpft die beiden parallelen Aussagen. Im Deutschen klingt „und ... nicht“ hier natürlicher als das gehobene „noch“ nach einem bereits verneinten ersten Satzglied.
- source_word: כַּעֲוֺנֹתֵינוּ
  choice: nach unseren Verfehlungen
  rationale: עון kann Verfehlung, Schuld oder Schuldfolge bezeichnen. „Verfehlungen“ bewahrt die Ausrichtung auf schuldhaftes Handeln und unterscheidet den Ausdruck von „Sünden“, ohne ihn auf das Schuldgefühl einzuengen.
- source_word: גָּמַל עָלֵינוּ
  choice: vergilt uns
  rationale: גמל bezeichnet hier das entsprechende Erweisen oder Zurückzahlen. „Vergelten“ vermittelt prägnant, dass Gott nicht das zukommen lässt, was den Verfehlungen entspräche; עָלֵינוּ wird dabei entsprechend deutscher Rektion als „uns“ wiedergegeben.
theological_decisions:
- issue: Aussage über Gottes Erbarmen, ohne eine bestimmte Theorie von Sühne oder Zeitpunkt des Gerichts einzutragen
  choice: Allgemeine Aussage, dass Gott nicht im Maß unserer Sünden und Verfehlungen an uns handelt
  alternative: Beschränkung auf zeitliche Strafen oder absolute Verneinung jedes göttlichen Gerichts
  rationale: Der hebräische Text spricht allgemein von Gottes barmherziger Zurückhaltung. Die Übersetzung legt weder ausschließlich irdische Folgen noch die völlige Aufhebung jedes Gerichts in den Vers hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Vergilt“ ist gehoben, aber allgemein verständlich; „Verfehlungen“ vermeidet das altertümliche „Missetaten“.
