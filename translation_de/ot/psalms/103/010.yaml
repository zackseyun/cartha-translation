  source_fidelity: 'Die Grundbedeutung wird getroffen: Gottes Handeln wird weder an den Sünden noch an den Verfehlungen bemessen. Die hebräischen Perfektformen עָשָׂה und גָּמַל bezeichnen jedoch hier Gottes erwiesene bzw. charakteristische Handlungsweise und werden im Deutschen am klarsten mit dem Perfekt wiedergegeben. „jemanden nach etwas behandeln“ ist zudem die natürliche deutsche Entsprechung zu עָשָׂה לָנוּ in diesem Kontext.'
  naturalness: „Er handelt an uns nicht“ ist verständlich, aber im modernen Standarddeutsch weniger idiomatisch und kann eine konkrete Einwirkung an Personen nahelegen. „Er hat uns nicht ... behandelt“ ist klar, würdig und bewahrt den Parallelismus. Die Fußnotenformulierung „Er tut uns nicht, was ...“ ist ohne „an“ nicht idiomatisch.
  terminology: „Sünden“ für חטאים ist passend. „Verfehlungen“ für עֲוֺנוֹת ist als moderne, nicht zu enge Wiedergabe vertretbar und erhält die lexikalische Variation gegenüber „Sünden“. „Vergolten“ gibt גָּמַל im Kontext angemessen wieder.
