revisions:
- from: Er handelt an uns nicht nach unseren Sünden[a] und vergilt uns nicht nach unseren Verfehlungen.
  to: Er hat uns nicht nach unseren Sünden[a] behandelt und uns nicht nach unseren Verfehlungen vergolten.
  rationale: Die Überarbeitung ersetzt die weniger idiomatische Konstruktion „an uns handeln“ durch „uns behandeln“, gibt die beiden hebräischen Perfektformen mit deutschem Perfekt wieder und korrigiert die Grammatik der Fußnote. Die Aussageweite, die poetische Zweigliedrigkeit und die Unterscheidung zwischen Sünden und Verfehlungen bleiben erhalten.
