    rationale: „an uns handeln“ ist hier weniger natürlich als „uns behandeln“; die Perfektformen des Hebräischen werden im Deutschen angemessen durch „hat ... behandelt / vergolten“ abgebildet.
  - severity: medium
    issue: Fußnote enthält die unidiomatische Formulierung „Er tut uns nicht, was ...“
    rationale: Deutsch verlangt in dieser Bedeutung „jemandem etwas antun“. Die alternative Wiedergabe sollte daher „Er hat uns nicht angetan, was ...“ lauten.
