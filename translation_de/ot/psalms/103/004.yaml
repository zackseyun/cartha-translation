  text: der dein Leben aus der Grube[a] erlöst, der dich mit beständiger Liebe und Erbarmen[b] krönt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „aus dem Verderben“ oder „aus dem Grab“.
