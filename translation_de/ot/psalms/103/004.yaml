    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: der … erlöst
  rationale: Das Partizip von גאל bezeichnet das Erlösen oder Zurückgewinnen und kann zugleich Rettungs- und Bundesanklänge tragen. „Erlöst“ bewahrt diese Weite, ohne das Bild auf eine rechtliche Löserfunktion einzuengen.
- source_word: מִשַּׁחַת
  choice: aus der Grube
  rationale: שַׁחַת kann eine Grube, das Grab oder das Verderben bezeichnen. „Grube“ gibt das konkrete poetische Bild wieder; die anderen möglichen Bedeutungen werden in einer Fußnote genannt.
- source_word: חַיָּיִכִי
  choice: dein Leben
  rationale: חַיִּים bezeichnet hier das Leben der angesprochenen Person. Der deutsche Singular ist idiomatisch und vermeidet die nicht erforderliche Verengung auf eine vom Körper getrennte „Seele“.
- source_word: הַמְעַטְּרֵכִי
  choice: der dich … krönt
  rationale: עטר kann „krönen“, „umgeben“ oder „schmücken“ bedeuten. „Krönt“ erhält das poetische Bild verliehener Ehre und Wohltaten.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Beständigkeit und Loyalität. „Beständige Liebe“ ist verständlich und bewahrt beide Aspekte, ohne das Wort ausdrücklich auf eine einzige Bundestheologie festzulegen.
- source_word: וְרַחֲמִים
  choice: und Erbarmen
  rationale: רַחֲמִים bezeichnet tiefes Mitgefühl, Erbarmen oder barmherzige Zuwendung. Das deutsche Kollektivum „Erbarmen“ klingt natürlich und kann die im hebräischen Plural liegende Fülle ausdrücken.
theological_decisions:
- issue: Reichweite des Erlösungsbildes
  choice: Poetisch weit gefasste Rettung des Lebens aus tödlicher Not
  alternative: Ausschließlich Rettung aus dem Grab beziehungsweise ausschließlich geistliches oder endzeitliches Heil
  rationale: Der hebräische Ausdruck lässt körperliche Rettung, Bewahrung vor dem Tod und umfassenderes Heil anklingen. Die Übersetzung legt ihn nicht auf nur eine dieser Deutungen fest.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die parallelen Partizipialwendungen werden mit „der …, der …“ wiedergegeben. Das konkrete Bild der Grube und die Krönungsmetapher bleiben erhalten.
