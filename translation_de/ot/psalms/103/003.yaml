base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/003.yaml
  text: who forgives all your iniquity[a], who heals all your diseases[b],
translation:
  language: de
  text: der dir all deine Schuld vergibt[a] und alle deine Krankheiten heilt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »all deine Verfehlung« oder »all deine Sünde«. Das hebräische Wort kann die Verfehlung, die Schuld oder die aus dem Unrecht erwachsende Schuldlast bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »alle deine Leiden« oder »alle deine Gebrechen«. Die Zeile spricht ihrem unmittelbaren Wortsinn nach von körperlicher Krankheit, kann im poetischen Zusammenhang aber auch weiter verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: der … vergibt
  rationale: Der mit Artikel versehene Partizip beschreibt hier Gottes kennzeichnendes, fortdauerndes Handeln. Im Deutschen gibt ein Relativsatz dies natürlich und parallel zum folgenden Glied wieder.
- source_word: לְכָל
  choice: all / alle
  rationale: Die umfassende Bedeutung wird in beiden Satzgliedern bewahrt; die Flexion richtet sich nach dem jeweiligen deutschen Substantiv.
- source_word: עֲוֺנֵכִי
  choice: all deine Schuld
  rationale: עָוֹן kann Verfehlung, Schuld und die aus ihr erwachsende Schuldlast bezeichnen. „Schuld“ ist in diesem Zusammenhang natürlich und bewahrt das moralische Gewicht; der hebräische Kollektivsingular bleibt im Deutschen erhalten.
- source_word: הָרֹפֵא
  choice: der … heilt
  rationale: Wie im ersten Satzglied bezeichnet das substantivierte Partizip Gottes kennzeichnendes Handeln. „Heilt“ wahrt den konkreten Sinn und die syntaktische Parallelität.
- source_word: תַּחֲלֻאָיִכִי
  choice: deine Krankheiten
  rationale: Das Substantiv bezeichnet Krankheiten oder Leiden. „Krankheiten“ ist eine klare, konkrete und im modernen Standarddeutsch geläufige Wiedergabe.
theological_decisions:
- issue: Ob die Aussage über Heilung bereits in der Übersetzung vergeistigt werden soll
  choice: Die konkrete Formulierung „alle deine Krankheiten heilt“ bleibt im Haupttext stehen.
  alternative: „alle deine geistlichen Krankheiten heilt“ oder eine ausdrücklich metaphorische Wiedergabe
  rationale: Der hebräische Ausdruck bezeichnet seinem unmittelbaren Wortsinn nach Krankheiten. Der poetische Zusammenhang kann einen weiteren Deutungshorizont eröffnen, doch die Übersetzung legt ihn weder auf ausschließlich körperliche noch auf ausschließlich geistliche Heilung fest.
- issue: Semantischer Umfang von עָוֹן
  choice: „Schuld“ im Haupttext, mit Alternativen in der Fußnote
  alternative: „Verfehlung“, „Sünde“ oder „Missetat“
  rationale: „Schuld“ hält sowohl die moralische Verfehlung als auch die daraus entstehende Schuldlast offen und vermeidet eine unnötige konfessionelle Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Fortsetzung des vorangehenden Satzes kleingeschrieben. Die weiblichen Singularformen des Hebräischen beziehen sich auf die in Psalm 103,1 angeredete »Seele«; im Deutschen verlangt der Anschluss daran das maskuline Relativpronomen »der«. Die parallelen Partizipialkonstruktionen werden durch zwei koordinierte Relativsätze wiedergegeben.
