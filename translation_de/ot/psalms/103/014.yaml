  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: de
  text: Denn er weiß, wie wir gebildet sind[a]; er denkt daran, dass wir Staub sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unser Gebilde« oder »unsere Beschaffenheit«. Das hebräische Wort bezeichnet das Geformte beziehungsweise die Art, wie etwas geformt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt die erklärende beziehungsweise kausale Funktion.
- source_word: הוּא
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten; im Zusammenhang ist Gott das Subjekt.
- source_word: יָדַע
  choice: weiß
  rationale: Das Qal-Perfekt bezeichnet hier ein feststehendes, gegenwärtig gültiges Wissen.
- source_word: יִצְרֵנוּ
  choice: wie wir gebildet sind
  rationale: יֵצֶר bezeichnet hier das Geformte beziehungsweise die Art der Formung. Die Wendung ist im heutigen Deutsch natürlich und wahrt den Bezug auf den Menschen als Geschöpf.
- source_word: זָכוּר
  choice: er denkt daran
  rationale: Die formal partizipiale beziehungsweise adjektivische Form beschreibt Gottes fortdauerndes Eingedenksein. Die deutsche Formulierung gibt dies klar und idiomatisch wieder.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion führt hier den Inhalt dessen ein, woran Gott denkt.
- source_word: עָפָר
  choice: Staub
  rationale: Die direkte Wiedergabe bewahrt das Schöpfungs- und Vergänglichkeitsbild des Hebräischen.
- source_word: אֲנָחְנוּ
  choice: wir … sind
  rationale: Die kopulalose hebräische Aussage wird im Deutschen mit dem erforderlichen Verb wiedergegeben.
theological_decisions:
- issue: Anthropologisches Bild menschlicher Geschöpflichkeit und Vergänglichkeit
  choice: dass wir Staub sind
  alternative: dass wir nur Staub sind
  rationale: Die schlichte Formulierung erhält das hebräische Bild von Geschöpflichkeit, Sterblichkeit und Schwäche, ohne durch „nur“ eine zusätzliche Abwertung einzutragen.
- issue: Bedeutung von יִצְרֵנוּ
  choice: wie wir gebildet sind
  alternative: unser Gebilde / unsere Beschaffenheit
  rationale: Die gewählte Form wahrt den Bezug auf Gottes Formen des Menschen, ohne den Ausdruck einseitig auf Körperbau, Charakter oder eine systematische Anthropologie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus von Gottes Wissen und seinem fortdauernden Gedenken bleibt erhalten; „wie wir gebildet sind“ ist natürlicher als das missverständliche „unser Gebilde“ im Haupttext.
