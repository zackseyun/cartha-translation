  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: de
  text: Wie ein Vater Erbarmen mit seinen Kindern hat, so hat Jahwe Erbarmen mit denen, die ihn fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּרַחֵם
  choice: Wie … Erbarmen … hat
  rationale: Das Präfix כְּ kennzeichnet den Vergleich; רחם bezeichnet tiefes, herzliches Erbarmen. Die Formulierung ist im modernen Deutschen natürlich und bewahrt die Wiederholung des hebräischen Verbs.
- source_word: אָב
  choice: ein Vater
  rationale: Der generische Singular bezeichnet keinen bestimmten Vater, sondern dient als allgemein verständliches Vergleichsbild.
- source_word: עַל
  choice: mit
  rationale: Bei „Erbarmen haben“ wird das Objekt im Deutschen idiomatisch mit „mit“ angeschlossen.
- source_word: בָּנִים
  choice: seinen Kindern
  rationale: Der grammatisch maskuline Plural bezeichnet hier im familiären Zusammenhang allgemein die Nachkommen eines Vaters; „Kindern“ gibt diesen Bezug sachgerecht wieder. Das Possessivpronomen ist aus der Vater-Kind-Beziehung erschlossen.
- source_word: רִחַם
  choice: hat Erbarmen
  rationale: Dieselbe Wiedergabe wie im ersten Halbvers erhält die poetische Wiederholung. Das deutsche Präsens gibt die allgemeingültige Aussage des hebräischen Perfekts im Kontext angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְרֵאָיו
  choice: denen, die ihn fürchten
  rationale: Die substantivierte Form bezeichnet Menschen, deren Haltung durch Gottesfurcht geprägt ist. „Fürchten“ bewahrt die direkte und theologisch spannungsreiche Bedeutung, ohne sie zu „verehren“ abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen unmittelbar; „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Geschlechtlicher Umfang von בָּנִים
  choice: Kinder
  alternative: Söhne
  rationale: Im Vater-Kind-Vergleich bezeichnet der maskuline Plural die Nachkommen allgemein; „Kinder“ engt den Bezug nicht unbegründet auf männliche Nachkommen ein.
- issue: Bedeutungsumfang von יְרֵאָיו
  choice: die ihn fürchten
  alternative: die ihn verehren
  rationale: „Fürchten“ erhält die im Hebräischen vorhandene Spannung zwischen Furcht, Ehrfurcht und frommer Bindung, statt sie interpretierend auf Verehrung zu reduzieren.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer poetischer Parallelität. Die zweimalige Wendung „Erbarmen … haben“ bildet die Wiederholung von רחם ab; „Jahwe“ steht als persönliche Namensform.
