  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: de
  text: So weit der Osten vom Westen entfernt ist, so weit hat er unsere Übertretungen[a] von uns entfernt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Vergehen“. Der Ausdruck kann besonders auch Auflehnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: So weit … entfernt ist
  rationale: Die Konstruktion vergleicht das Ausmaß einer Entfernung. Die deutsche Korrespondenz „So weit …, so weit …“ gibt diesen Vergleich natürlich und präzise wieder.
- source_word: מִזְרָח
  choice: der Osten
  rationale: Das Substantiv bezeichnet die Himmelsrichtung beziehungsweise den Ort des Sonnenaufgangs; im Richtungspaar ist „der Osten“ idiomatisches Standarddeutsch.
- source_word: מִמַּעֲרָב
  choice: vom Westen
  rationale: Die Präposition מִן markiert hier den räumlichen Ausgangs- beziehungsweise Vergleichspunkt; „vom Westen“ bildet mit „der Osten“ das im Hebräischen vorliegende Richtungspaar ab.
- source_word: הִרְחִיק
  choice: hat … entfernt
  rationale: Der Hifil von רחק bedeutet, etwas fern zu machen oder weit weg zu bringen. „Entfernt“ wahrt den räumlichen Bildgehalt und die kausative Aussage.
- source_word: מִמֶּנּוּ
  choice: von uns
  rationale: Das Suffix der ersten Person Plural bezeichnet ausdrücklich die betende Gemeinschaft als diejenigen, von denen die Vergehen weggebracht wurden.
- source_word: פְּשָׁעֵינוּ
  choice: unsere Vergehen
  rationale: פשע bezeichnet schuldhafte Übertretung und kann besonders den Aspekt der Auflehnung tragen. „Vergehen“ ist verständlich und würdevoll; die Fußnote bewahrt die stärkere Bedeutungsnuance.
theological_decisions:
- issue: Räumliches Bild für Vergebung
  choice: Das Bild der weitestmöglichen Trennung zwischen den Menschen und ihren Vergehen bleibt erhalten.
  alternative: Die Aussage allgemein als Vergebung wiedergeben und das Entfernungsbild abschwächen.
  rationale: Der hebräische Vers verbindet ausdrücklich die Entfernung zwischen Osten und Westen mit Gottes Wegschaffen der Vergehen. Die Bildsprache betont deren vollständige Entfernung, ohne den Vorgang darüber hinaus dogmatisch zu erklären.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Rhythmus. Die Wiederholung „So weit …, so weit …“ bewahrt die Parallelstruktur des Hebräischen; „entfernt“ wird bewusst wiederholt, um den räumlichen Vergleich eng mit Gottes Handeln zu verbinden.
