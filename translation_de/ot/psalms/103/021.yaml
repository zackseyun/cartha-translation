  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: de
  text: 'Preist Jahwe, all ihr seine Heerscharen,

    seine Diener, die seinen Willen tun!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Preist
  rationale: Der hebräische Imperativ von ברך bedeutet in der an Gott gerichteten Aufforderung, ihn zu loben bzw. zu preisen. „Preist“ ist im heutigen Deutsch natürlicher als „Segnet“ und bewahrt den wiederholten Aufruf des Psalms.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל צְבָאָיו
  choice: all seine Heerscharen
  rationale: צָבָא kann Heer oder Heerschar bezeichnen. „Heerscharen“ wahrt den gehobenen Ton und lässt den im Zusammenhang naheliegenden Bezug auf himmlische Wesen bestehen, ohne ihn ausdrücklich festzulegen.
- source_word: מְשָׁרְתָיו
  choice: seine Diener
  rationale: Das Wort bezeichnet Personen, die Dienst verrichten. „Diener“ ist verständlich und würdig; „Amtsträger“ oder „Minister“ wäre im modernen Deutsch missverständlich.
- source_word: עֹשֵׂי רְצוֹנוֹ
  choice: die seinen Willen tun
  rationale: Das substantivisch gebrauchte Partizip wird natürlich als Relativsatz wiedergegeben; רָצוֹן bezeichnet hier Gottes Willen beziehungsweise das, was ihm gefällt.
theological_decisions:
- issue: Bezug von „seine Heerscharen“ und „seine Diener“
  choice: Die Formulierung bleibt allgemein, wobei der Kontext vor allem himmlische Wesen nahelegt.
  alternative: Gottes irdische Diener im weiteren Sinn.
  rationale: Vers 20 nennt unmittelbar zuvor Gottes Engel. Dennoch benennt der hebräische Wortlaut in Vers 21 die Wesen nicht ausdrücklich als Engel; diese Offenheit wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Zeilengliederung folgt den beiden parallelen Anreden und der abschließenden näheren Bestimmung.
