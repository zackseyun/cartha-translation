source:
  edition: WLC
  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: de
  text: Doch Jahwes beständige Liebe währt von Ewigkeit zu Ewigkeit für alle, die ihn fürchten, und seine Gerechtigkeit[a] für ihre Kindeskinder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sein Recht. Das hebräische Wort kann in diesem Zusammenhang sowohl Gerechtigkeit als auch Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: Doch … beständige Liebe
  rationale: חֶסֶד bezeichnet hier Jahwes dauerhafte, verlässliche und bundestreue Liebe. „Beständige Liebe“ ist gegenwärtiges, verständliches Deutsch; „Doch“ gibt den Gegensatz zur Vergänglichkeit des Menschen im vorhergehenden Vers wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die paarige Wendung bezeichnet eine unbegrenzte Dauer und bewahrt in dieser geläufigen deutschen Form ihre poetische Kraft.
- source_word: עַל יְרֵאָיו
  choice: für alle, die ihn fürchten
  rationale: עַל bezeichnet hier die Menschen, denen Jahwes Liebe gilt. „Die ihn fürchten“ bewahrt sowohl den Ernst als auch den ehrfürchtigen Beziehungssinn des hebräischen Ausdrucks.
- source_word: וְצִדְקָתוֹ
  choice: und seine Gerechtigkeit
  rationale: צְדָקָה umfasst Gerechtigkeit, rechtes Handeln und die Verlässlichkeit göttlicher Ordnung. „Gerechtigkeit“ hält dieses breite Bedeutungsspektrum offen.
- source_word: לִבְנֵי בָנִים
  choice: bis zu den Kindeskindern
  rationale: Die wörtliche Generationenfolge „Kinder von Kindern“ wird mit dem natürlichen deutschen Ausdruck „Kindeskinder“ bewahrt; „bis zu“ verdeutlicht die generationenübergreifende Reichweite.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צְדָקָה im poetischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ bewahrt die umfassende moralische und bundestreue Dimension des Ausdrucks; die mögliche Bedeutung „Recht“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Der Kontrast zum vorhergehenden Vers wird durch „Doch“ markiert. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck „Gerechtigkeit“.
