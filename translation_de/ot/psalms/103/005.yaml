source:
  edition: WLC
  text: הַ/מַּשְׂבִּ֣יַע בַּ/טּ֣וֹב עֶדְיֵ֑/ךְ תִּתְחַדֵּ֖שׁ כַּ/נֶּ֣שֶׁר נְעוּרָֽיְ/כִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/005.yaml
  text: who satisfies you with good[b][a], so that your youth is renewed like the eagle’s.
translation:
  language: de
  text: 'der dich[a] mit Gutem sättigt,

    sodass deine Jugend sich erneuert wie die eines Adlers[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „deinen Schmuck“. Der Ausdruck ist schwierig. Häufig wird der Sinn als „der dich dein Leben lang mit Gutem sättigt“ verstanden; nach einer anderen Auslegungstradition heißt es „der deinen Mund mit Gutem sättigt“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wie die eines großen Greifvogels“. Das hebräische Wort wird traditionell mit „Adler“ wiedergegeben, kann zoologisch aber auch einen Geier bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: der … sättigt
  rationale: Das Hifil-Partizip von שׂבע führt die Reihe der Taten des HERRN fort. „Sättigt“ bezeichnet eine umfassende Versorgung und bewahrt die Bildkraft des Hebräischen.
- source_word: בַּטּוֹב
  choice: mit Gutem
  rationale: טוֹב wird substantivisch gebraucht. „Mit Gutem“ bleibt knapp, natürlich und legt nicht fest, um welche einzelnen guten Gaben es geht.
- source_word: עֶדְיֵךְ
  choice: dich
  rationale: Der masoretisch vokalisierte Ausdruck bedeutet gewöhnlich „dein Schmuck“, ist hier jedoch schwer verständlich. Im Zusammenhang wird die angesprochene Person als die mit Gutem Gesättigte wiedergegeben; die wörtliche Form und wichtige Deutungen werden in der Fußnote offengelegt.
- source_word: תִּתְחַדֵּשׁ
  choice: sich erneuert
  rationale: Das Hitpael von חדש hat hier eine reflexiv-passive Nuance. „Sich erneuert“ bildet Form und poetische Aussage gut ab.
- source_word: כַּנֶּשֶׁר
  choice: wie die eines Adlers
  rationale: נֶשֶׁר bezeichnet einen großen Greifvogel und wird traditionell mit „Adler“ wiedergegeben. Durch „die eines Adlers“ wird im Deutschen deutlich, dass die Jugend beziehungsweise Jugendkraft verglichen wird.
- source_word: נְעוּרָיִכִי
  choice: deine Jugend
  rationale: Das abstrakte Pluralwort bezeichnet Jugend beziehungsweise jugendliche Kraft. „Deine Jugend“ bewahrt die poetische Form, ohne den Sinn auf das Lebensalter zu verengen.
theological_decisions:
- issue: Art der verheißenen Erneuerung
  choice: „deine Jugend sich erneuert“
  alternative: „deine Jugendkraft erneuert wird“
  rationale: Die Übersetzung belässt offen, ob vor allem neue Lebenskraft, Wiederherstellung oder umfassende Erneuerung gemeint ist, und vermeidet eine dogmatische Präzisierung.
translation_notes:
  register: Moderne, würdige Psalmsprache mit engem Anschluss an die hebräische Satzstruktur. Die schwierige Lesart in der ersten Zeile wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht; die poetische Metapher der erneuerten Jugend bleibt erhalten.
