  text: Er wird nicht für immer rechten[a] und nicht ewig nachtragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „streiten“, „hadern“ oder „Anklage erheben“. Das Verb kann sowohl einen Streit als auch das Führen eines Rechtsfalls bezeichnen; ein Gegenüber wird im Hebräischen nicht genannt.'
    reason: lexical_alternative
  - marker: b
