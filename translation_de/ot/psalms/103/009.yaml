    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: nicht für immer
  rationale: Die Wendung bezeichnet eine unbegrenzt fortdauernde Dauer. „Nicht für immer“ ist im Deutschen natürlich und entspricht dem parallelen לְעוֹלָם.
- source_word: יָרִיב
  choice: mit uns rechten
  rationale: Das Verb ריב kann streiten, hadern oder einen Rechtsstreit führen bedeuten. „Mit uns rechten“ bewahrt sowohl den zwischenmenschlichen als auch den rechtlichen Klang; „uns“ ist als im Kontext naheliegendes Gegenüber ergänzt.
- source_word: לְעוֹלָם
  choice: nicht ewig
  rationale: עוֹלָם bezeichnet eine unbegrenzte oder dauerhafte Zeitspanne. „Ewig“ erhält den Parallelismus, ohne „für immer“ wörtlich zu wiederholen.
- source_word: יִטּוֹר
  choice: Groll hegen
  rationale: נטר bedeutet wörtlich bewahren oder festhalten und bezeichnet in diesem Zusammenhang idiomatisch das Festhalten an Zorn beziehungsweise Groll. „Groll hegen“ ist natürliches modernes Deutsch.
theological_decisions:
- issue: Das im Hebräischen unausgesprochene Gegenüber des Rechtens
  choice: „mit uns“ im ersten Halbvers ergänzen
  alternative: „Er wird nicht für immer rechten“
  rationale: Das Gegenüber ergibt sich aus dem gemeinschaftlichen Kontext des Psalms. Die Ergänzung macht den deutschen Satz idiomatisch, ohne Gottes Handeln inhaltlich enger als nötig zu bestimmen.
- issue: Das im Hebräischen unausgesprochene Objekt von יִטּוֹר
  choice: idiomatisch mit „Groll hegen“ wiedergeben
  alternative: „nicht ewig festhalten/bewahren“ ohne genanntes Objekt
  rationale: Im Hebräischen steht kein ausdrückliches Objekt; im Kontext bezeichnet das Verb jedoch das Bewahren von Zorn oder Groll. Die idiomatische Wiedergabe vermeidet im Deutschen eine unklare Leerstelle, während die Fußnote die Ellipse offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mit uns rechten“ erhält den rechtlich-relationalen Unterton des hebräischen Verbs; „Groll hegen“ gibt die zweite, im Hebräischen knappe Wendung idiomatisch wieder. Die beiden Zeitangaben werden abwechslungsreich und parallel als „für immer“ und „ewig“ formuliert.
