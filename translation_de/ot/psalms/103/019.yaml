id: PSA.103.19
reference: Psalms 103:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְֽהוָ֗ה בַּ֭/שָּׁמַיִם הֵכִ֣ין כִּסְא֑/וֹ וּ֝/מַלְכוּת֗/וֹ בַּ/כֹּ֥ל מָשָֽׁלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: de
  text: Jahwe hat seinen Thron im Himmel[a] fest gegründet, und seine Herrschaft[b] waltet über alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Himmeln“; das hebräische Wort steht in der Pluralform.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Königtum“, „seine Königsherrschaft“ oder „sein Reich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: בַּשָּׁמַיִם
  choice: im Himmel
  rationale: Das hebräische שָׁמַיִם hat eine Pluralform. Im modernen Standarddeutsch bezeichnet jedoch „im Himmel“ den himmlischen Bereich natürlich und würdevoll; die Form wird in einer Fußnote kenntlich gemacht.
- source_word: הֵכִין
  choice: fest gegründet
  rationale: Das Hifil von כון bezeichnet hier das feste Aufrichten beziehungsweise Gründen. „Fest gegründet“ bringt im Thronkontext sowohl das Errichten als auch die Beständigkeit zum Ausdruck.
- source_word: כִּסְאוֹ
  choice: seinen Thron
  rationale: Die übliche und kontextgemäße Wiedergabe von כִּסֵּא mit dem Suffix der dritten Person Singular.
- source_word: וּמַלְכוּתוֹ
  choice: und seine Herrschaft
  rationale: מַלְכוּת kann Reich, Königtum, Königsherrschaft oder Herrschaft bezeichnen. „Herrschaft“ ist im Deutschen natürlich und lässt sowohl die Ausübung der Königsmacht als auch ihren Herrschaftsbereich offen.
- source_word: בַּכֹּל
  choice: über alles
  rationale: In Verbindung mit משל bezeichnet die Präposition den umfassenden Bereich, über den sich die Herrschaft erstreckt.
- source_word: מָשָׁלָה
  choice: waltet
  rationale: Das feminine Verb stimmt mit מַלְכוּת überein. Das Präsens gibt die fortdauernde, allgemeingültige Aussage wieder; „waltet“ ist eine würdige und im Deutschen idiomatische Bezeichnung souveräner Herrschaft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname bewahrt den im hebräischen Text ausdrücklich genannten Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von מַלְכוּת
  choice: Herrschaft
  alternative: Reich; Königtum; Königsherrschaft
  rationale: „Herrschaft“ vermeidet eine vorschnelle Festlegung darauf, ob vor allem ein Herrschaftsgebiet, die Königswürde oder das aktive Regieren gemeint ist; mögliche Alternativen werden in der Fußnote genannt.
- issue: Zeitbezug von מָשָׁלָה
  choice: waltet
  alternative: hat geherrscht; herrschte
  rationale: Die hebräische Perfektform kann hier eine bestehende beziehungsweise allgemeingültige Wirklichkeit ausdrücken. Das deutsche Präsens vermittelt die fortdauernde universale Herrschaft, ohne sie auf einen vergangenen Vorgang zu begrenzen.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Fest gegründet“ bewahrt die Vorstellung eines dauerhaft aufgerichteten Thrones; „waltet“ vermeidet die im Deutschen schwerfällige Wiederholung „Herrschaft herrscht“.
