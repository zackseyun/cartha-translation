base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/020.yaml
  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: de
  text: Er sandte sein Wort und heilte sie; er rettete sie aus ihren Gruben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus ihrem Verderben« beziehungsweise »aus ihren Gräbern«. Das hebräische Wort kann Gruben, Gräber oder Zustände des Untergangs und Verderbens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: sandte
  rationale: Das Qal-Imperfekt steht im poetischen Rückblick auf Gottes Taten und wird im Deutschen natürlich mit dem Präteritum wiedergegeben.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: Die knappe Wiedergabe bewahrt sowohl den Grundsinn als auch die Aussage von Gottes wirksamem Reden, ohne »Wort« näher als Befehl, Botschaft oder Person zu bestimmen.
- source_word: וְיִרְפָּאֵם
  choice: und heilte sie
  rationale: רפא bedeutet im Qal schlicht »heilen«; das Suffix bezieht sich auf die zuvor geschilderten Leidenden.
- source_word: וִימַלֵּט
  choice: er rettete sie
  rationale: Der Piel-Stamm bezeichnet hier das Befreien beziehungsweise Entkommenlassen aus tödlicher Gefahr; »rettete« ist prägnant und idiomatisch.
- source_word: מִשְּׁחִיתוֹתָם
  choice: aus ihren Gruben
  rationale: Der Plural mit Suffix kann Gruben bezeichnen und passt zum Bild der Rettung aus Todesgefahr. Da auch Verderben oder Untergang möglich ist, bleibt diese Bedeutungsbreite in der Fußnote sichtbar.
theological_decisions:
- issue: Mögliche christologische oder hypostatische Deutung von »sein Wort«
  choice: Die Formulierung »sein Wort« bleibt ohne nähere Identifikation stehen.
  alternative: »seinen Befehl« oder eine ausdrückliche Identifikation des Wortes als Person
  rationale: Der hebräische Text spricht von Gottes wirksamem Wort, bestimmt es hier aber weder ausdrücklich als bloßen Befehl noch als personale oder messianische Gestalt.
- issue: Bildhafte oder abstrakte Bedeutung von מִשְּׁחִיתוֹתָם
  choice: Im Haupttext steht das konkrete Bild »aus ihren Gruben«.
  alternative: »aus ihrem Verderben«, »aus ihren Untergängen« oder »aus ihren Gräbern«
  rationale: »Gruben« ergibt im Zusammenhang mit drohendem Tod ein verständliches poetisches Bild; die lexikalische Mehrdeutigkeit wird nicht dogmatisch eingeengt, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus wird durch zwei Hauptsätze und ein Semikolon klar hörbar; unnötige theologische Explikation wird vermieden.
