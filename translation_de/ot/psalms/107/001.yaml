  text: הֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: de
  text: Dankt Jahwe, denn er ist gut, denn seine treue Liebe währt ewig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn seine Güte währt ewig.“ Das hebräische Wort חֶסֶד bezeichnet beständige, loyale Liebe und kann besonders Gottes treue Zuwendung im Bund einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: Dankt
  rationale: Der Hifil-Imperativ Plural von ידה fordert im Psalmkontext zum Dank auf; „Dankt“ ist knapp, idiomatisch und bewahrt den liturgischen Aufruf.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger des Dankes. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי nennt jeweils den Grund für die Aufforderung; „denn“ erhält diesen kausalen Zusammenhang und die parallele Satzform.
- source_word: טוֹב
  choice: gut
  rationale: „Gut“ gibt die umfassende moralische und wohltätige Bedeutung von טוֹב direkt und natürlich wieder.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. Mit „bleibt für immer“ wird die im nominalen hebräischen Satz mitgemeinte Fortdauer im Deutschen idiomatisch ausgedrückt.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד verbindet Liebe, Güte und verlässliche Loyalität. „Beständige Liebe“ bewahrt sowohl die Zuwendung als auch ihre Dauerhaftigkeit, ohne den Ausdruck allein auf einen Vertragsbegriff oder auf Erbarmen zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ macht den Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Bundestreue; Güte; Erbarmen
  rationale: Die gewählte Formulierung hält Liebe und verlässliche Dauer zusammen. Die Fußnote weist auf die ebenfalls enthaltene Dimension treuer, bundbezogener Zuwendung hin.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die zweimalige kausale Verbindung mit „denn“ folgt der hebräischen Parallelstruktur. Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
