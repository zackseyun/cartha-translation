  text: יָקֵ֣ם סְ֭עָרָה לִ/דְמָמָ֑ה וַ֝/יֶּחֱשׁ֗וּ גַּלֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/029.yaml
  text: He made the storm be still[c][b][a], and their waves were hushed.
translation:
  language: de
  text: Er brachte den Sturm zur Ruhe, und ihre Wellen[a] verstummten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Suffix lautet wörtlich „ihre“. Sein Bezug ist nicht ganz eindeutig; es kann die zuvor genannten Seeleute meinen oder im Zusammenhang auf Meer bzw. Wasser bezogen verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֵם
  choice: brachte … zur
  rationale: 'Der Hifil von קום hat hier zusammen mit לִדְמָמָה resultativ-kausative Bedeutung: Er bewirkte, dass der Sturm in einen Zustand der Ruhe überging.'
- source_word: סְעָרָה
  choice: den Sturm
  rationale: סְעָרָה bezeichnet im vorliegenden Zusammenhang einen Sturm oder Unwetterwind; „Sturm“ ist die klare und natürliche Wiedergabe.
- source_word: לִדְמָמָה
  choice: Ruhe
  rationale: דְּמָמָה bezeichnet Stille oder Ruhe; die Präposition לְ markiert hier das herbeigeführte Ergebnis. „Zur Ruhe bringen“ gibt die Konstruktion idiomatisch und zugleich nah am Hebräischen wieder.
- source_word: וַיֶּחֱשׁוּ
  choice: verstummten
  rationale: Das Verb bezeichnet das Still- oder Schweigsamwerden. Auf Wellen bezogen vermittelt „verstummten“ anschaulich, dass ihr Brausen aufhörte.
- source_word: גַּלֵּיהֶם
  choice: ihre Wellen
  rationale: Das hebräische Suffix ist formal 3. Person maskulin Plural („ihre“). Diese Form wird beibehalten, ohne den im Kontext nicht völlig eindeutigen Bezug stillschweigend festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die resultativ-kausative hebräische Wendung wird mit dem natürlichen Ausdruck „zur Ruhe bringen“ wiedergegeben; die auffällige Mehrzahl im Possessivpronomen bleibt erhalten und wird in der Fußnote erläutert.
