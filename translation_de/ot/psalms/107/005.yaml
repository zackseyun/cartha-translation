  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: de
  text: Hungrig und durstig[a], schwand ihre Lebenskraft in ihnen dahin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sowohl hungrig als auch durstig“; das Hebräische betont, dass beides zugleich zutraf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Seele verschmachtete in ihnen“, „ihr Leben schwand in ihnen“ oder „sie selbst wurden kraftlos“. Das hebräische Wort kann Seele, Leben, Lebenskraft oder die Person selbst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: Hungrig
  rationale: Das Adjektiv bezeichnet schlicht den Zustand des Hungers; „am Verhungern“ wäre stärker als der hebräische Ausdruck.
- source_word: גַּם
  choice: und
  rationale: Im Zusammenhang verbindet גַּם die beiden zugleich bestehenden Nöte. Das natürliche deutsche Wort „und“ gibt dies wieder; die additive Nuance wird in einer Fußnote angezeigt.
- source_word: צְמֵאִים
  choice: durstig
  rationale: Die direkte und idiomatische deutsche Entsprechung.
- source_word: נַפְשָׁם
  choice: Lebensmut
  rationale: נֶפֶשׁ kann Seele, Leben, Selbst oder Lebenskraft bezeichnen. Zusammen mit dem Verb beschreibt es hier das Schwinden der inneren Lebenskraft; „Lebensmut“ ergibt im Deutschen ein natürliches, bildhaftes Versglied, ohne die lexikalische Spannweite zu verschweigen.
- source_word: בָּהֶם
  choice: ihnen
  rationale: 'Die Verbindung wird idiomatisch als inneres Geschehen wiedergegeben: Der Lebensmut sank ihnen dahin. Das entspricht dem hebräischen „in ihnen“.'
- source_word: תִּתְעַטָּף
  choice: sank ... dahin
  rationale: Das Verb kann das Erlahmen, Verschmachten oder Ohnmächtigwerden der נֶפֶשׁ ausdrücken. „sank ... dahin“ bewahrt die fortschreitende innere Entkräftung und klingt in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: „Lebensmut“ im Haupttext mit offener lexikalischer Fußnote
  alternative: „ihre Seele“, „ihr Leben“ oder „sie selbst“
  rationale: Der Kontext verlangt keine dogmatische Festlegung auf eine vom Körper getrennte Seele. Die Übersetzung wahrt das Bild innerer Entkräftung und nennt die genuine Bedeutungsbreite in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. Die Satzstellung setzt Hunger und Durst nach hebräischem Vorbild voran. „Lebensmut“ ist gut verständlich; die Fußnote bewahrt die anthropologische Mehrdeutigkeit des Hebräischen.
