  text: וַ/יֹּ֗אמֶר וַֽ֭/יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה וַ/תְּרוֹמֵ֥ם גַּלָּֽי/ו׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/025.yaml
  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: de
  text: Denn er sprach und ließ einen Sturmwind aufkommen[a], der die Wellen des Meeres hoch auftürmte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er sprach und ließ einen Sturmwind sich erheben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: er sprach
  rationale: אמר bedeutet gewöhnlich „sagen“ oder „sprechen“. „Er sprach“ bewahrt hier die Vorstellung, dass der Sturm auf Gottes Wort hin entsteht, ohne das Verb ausdrücklich als „befehlen“ auszulegen.
- source_word: וַיַּעֲמֵד
  choice: ließ … aufkommen
  rationale: Der Hifil von עמד hat verursachende Bedeutung. „Aufkommen lassen“ gibt das Entstehen beziehungsweise Sich-Erheben des Sturmwinds natürlich und ohne unnötige Ausdeutung wieder.
- source_word: רוּחַ סְעָרָה
  choice: einen Sturmwind
  rationale: Die Verbindung bezeichnet einen von Sturm geprägten Wind. „Sturmwind“ ist knapp, anschaulich und bewahrt das ausdrücklich genannte Element des Windes.
- source_word: וַתְּרוֹמֵם
  choice: der … hoch auftürmte
  rationale: Das feminine Verb bezieht sich auf רוּחַ, den Sturmwind. Im Zusammenhang mit Wellen gibt „hoch auftürmen“ die Bewegung und Höhe idiomatisch wieder.
- source_word: גַּלָּיו
  choice: die Wellen des Meeres
  rationale: Wörtlich steht ein maskulines Possessivsuffix, „seine Wellen“. Gemeint sind im Kontext am natürlichsten die Wellen des Meeres; die ausdrückliche Benennung des Meeres verhindert im Deutschen den irreführenden Eindruck, der Wind besitze Wellen.
theological_decisions:
- issue: Unausgesprochenes göttliches Subjekt
  choice: „er“, im Zusammenhang auf Gott bezogen
  alternative: Eine unpersönliche Wiedergabe
  rationale: Die Verbformen haben ein persönliches Subjekt, und der unmittelbare Kontext beschreibt das Handeln des HERRN. Die Wiedergabe mit „er“ erhält den Erzählfluss, ohne über den Text hinauszugehen.
- issue: Bezug des Possessivsuffixes bei גַּלָּיו
  choice: Wellen des Meeres
  alternative: „seine Wellen“, formal möglicherweise auf ein maskulines Bezugswort bezogen
  rationale: Das feminine רוּחַ kann nicht ohne Weiteres Bezugswort des maskulinen Suffixes sein. Der Kontext des Seesturms legt das Meer als gemeinten Besitzer der Wellen nahe; die Übersetzung macht diesen impliziten Bezug verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Ablauf; „hoch auftürmte“ vermittelt das poetische Bild in natürlicher Gegenwartssprache.
