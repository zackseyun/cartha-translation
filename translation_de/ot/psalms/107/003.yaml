  yaml_path: translation/ot/psalms/107/003.yaml
  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: de
  text: und sie aus den Ländern sammelte, aus dem Osten und aus dem Westen, aus dem Norden und vom Meer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und aus dem Süden“. Wörtlich: „und vom Meer“. „Meer“ kann im Hebräischen als Richtungsangabe für den Westen dienen; der Westen wurde hier jedoch bereits ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: und … aus den Ländern
  rationale: Der Plural von אֶרֶץ bezeichnet hier die verschiedenen Länder oder Regionen, aus denen die Erlösten gesammelt wurden. „Länder“ ist natürlich und bewahrt den Plural.
- source_word: קִבְּצָם
  choice: sie … sammelte
  rationale: קבץ bedeutet „sammeln, zusammenbringen“. Die Form knüpft an Gottes Handeln im vorausgehenden Vers an; deshalb steht im Deutschen entsprechend „sammelte“.
- source_word: מִמִּזְרָח
  choice: aus dem Osten
  rationale: מִזְרָח bezeichnet den Osten, wörtlich die Gegend des Sonnenaufgangs. Die bestimmte Form ist im modernen Deutschen für Himmelsrichtungen idiomatisch.
- source_word: וּמִמַּעֲרָב
  choice: und aus dem Westen
  rationale: מַעֲרָב bezeichnet den Westen. Die Wiedergabe hält die parallele Richtungsfolge fest.
- source_word: מִצָּפוֹן
  choice: aus dem Norden
  rationale: צָפוֹן ist die Himmelsrichtung Norden; „aus dem Norden“ entspricht natürlichem modernem Deutsch.
- source_word: וּמִיָּם
  choice: und vom Meer
  rationale: יָם bedeutet gewöhnlich „Meer“. Obwohl es auch als Richtungsangabe für den Westen dienen kann, ist der Westen hier bereits ausdrücklich mit מַעֲרָב genannt. Daher bleibt „Meer“ die textnähere Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Reihung. Die Satzform bleibt wegen des versübergreifenden Anschlusses an Psalm 107,2 syntaktisch abhängig. Die ungewöhnliche vierte Herkunftsangabe „vom Meer“ wird im Haupttext bewahrt und nicht stillschweigend zu „aus dem Süden“ geglättet.
