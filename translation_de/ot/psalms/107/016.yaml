id: PSA.107.16
reference: Psalms 107:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי שִׁ֭בַּר דַּלְת֣וֹת נְחֹ֑שֶׁת וּ/בְרִיחֵ֖י בַרְזֶ֣ל גִּדֵּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/016.yaml
  text: For he shattered the doors of bronze and cut through the bars of iron[a].
translation:
  language: de
  text: 'Denn er zerbrach die Türen aus Bronze

    und hieb die Riegel aus Eisen entzwei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Tore aus Bronze«. Das hebräische Wort bezeichnet genauer Türen oder Türflügel; im Zusammenhang können jedoch befestigte Tore gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Dankaufruf ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: שִׁבַּר
  choice: zerbrach
  rationale: Bezeichnet ein gewaltsames, vollständiges Zerbrechen; »zerbrach« ist im Deutschen kräftig und idiomatisch.
- source_word: דַּלְתוֹת
  choice: Türen
  rationale: Gibt die konkrete lexikalische Bedeutung von Türflügeln beziehungsweise Türen wieder, ohne die im Kontext mögliche Vorstellung befestigter Tore in den Haupttext einzutragen.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Ist für das Metall beziehungsweise die Kupferlegierung in diesem Zusammenhang die übliche und historisch passende moderne Bezeichnung.
- source_word: בְרִיחֵי
  choice: Riegel
  rationale: Bezeichnet die querliegenden Sicherungen von Türen oder Toren und passt im Deutschen genau zum Bild.
- source_word: בַרְזֶל
  choice: Eisen
  rationale: Entspricht unmittelbar der üblichen Bedeutung des hebräischen Metallbegriffs.
- source_word: גִּדֵּעַ
  choice: hieb … entzwei
  rationale: Bewahrt den Gedanken des gewaltsamen Abhauens oder Durchtrennens und klingt in Verbindung mit eisernen Riegeln natürlich.
theological_decisions:
- issue: Bezug des unausgesprochenen göttlichen Subjekts
  choice: er
  alternative: der HERR
  rationale: Die hebräischen Verben stehen in der dritten Person Singular, ohne dass das Subjekt in diesem Vers erneut genannt wird; aus dem Kontext ist der HERR gemeint. »Er« bewahrt den hebräischen Textfluss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelem Versbau. Die Bildkraft der beiden gewaltsamen Verben bleibt erhalten; die lexikalische Genauigkeit von »Türen« wird durch eine Fußnote zur kontextuell möglichen Wiedergabe »Tore« ergänzt.
