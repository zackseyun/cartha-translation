  text: Then they cried out to Yahweh in their trouble[a]; he delivered them from their distresses.
translation:
  language: de
  text: Da schrien sie zu Jahwe in ihrer Not; er rettete sie aus ihren Bedrängnissen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Da schrien sie
  rationale: Das Wayyiqtol führt die Schilderung zeitlich weiter; „Da“ gibt diese Folge natürlich wieder. „schrien“ bewahrt die Dringlichkeit von צעק.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bezeichnet die Ausrichtung des Hilferufs. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בַּצַּר לָהֶם
  choice: in ihrer Not
  rationale: Die Wendung bezeichnet ihre bedrängte Lage. Das kollektive Singularwort צַר lässt sich im Deutschen knapp und idiomatisch mit „Not“ wiedergeben.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: aus all ihren Bedrängnissen
  rationale: מְצוּקוֹת ist ein Plural und bezeichnet bedrückende, einengende Notlagen. „Bedrängnisse“ erhält den Plural; „all“ macht dessen umfassende Kraft im natürlichen Deutschen deutlich, ohne eine einzelne Notlage anzunehmen.
- source_word: יַצִּילֵם
  choice: er rettete sie
  rationale: Der Hifil von נצל bedeutet retten oder herausreißen. Das Präteritum passt zur erzählenden Abfolge und „rettete“ ist modern, klar und würdevoll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderner, würdevoller Standarddeutschstil. Die parallele Bewegung von Hilferuf und Rettung bleibt knapp erhalten; „Not“ im Singular und „Bedrängnisse“ im Plural spiegeln den Wechsel der hebräischen Formen.
