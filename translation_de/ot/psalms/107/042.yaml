  text: יִרְא֣וּ יְשָׁרִ֣ים וְ/יִשְׂמָ֑חוּ וְ/כָל עַ֝וְלָ֗ה קָ֣פְצָה פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: de
  text: Die Aufrichtigen sehen und freuen sich, und alles Unrecht verschließt seinen Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und alle Ungerechtigkeit verschließt ihren Mund.« Im Hebräischen ist das Wort für »Unrecht/Ungerechtigkeit« feminin; auch das Suffix bei »Mund« ist feminin. So wird das Unrecht als zum Schweigen gebrachte Gestalt personifiziert.'
    reason: Lexikalische Alternative und Erläuterung der im Hebräischen grammatisch markierten Personifikation.
lexical_decisions:
- source_word: יִרְאוּ
  choice: sehen es
  rationale: Das Qal-Imperfekt 3. Person Plural von ראה wird im zusammenfassenden poetischen Kontext präsentisch wiedergegeben. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen durch »es« aus dem Kontext aufgenommen, damit der Satz natürlich klingt.
- source_word: יְשָׁרִים
  choice: die Aufrichtigen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch geradlinige Menschen. »Die Aufrichtigen« bewahrt diese Nuance, ohne den spezifischeren Begriff »die Gerechten« einzutragen.
- source_word: וְיִשְׂמָחוּ
  choice: und freuen sich
  rationale: Das Qal-Imperfekt von שמח bezeichnet freudige Reaktion. Die präsentische Wiedergabe passt zur allgemeinen, abschließenden Aussage des Psalms.
- source_word: וְכָל עַוְלָה
  choice: und alles Unrecht
  rationale: עַוְלָה ist ein abstraktes feminines Substantiv für Unrecht, Ungerechtigkeit oder Verkehrtheit. »Alles Unrecht« gibt den umfassenden abstrakten Sinn idiomatisch wieder.
- source_word: קָפְצָה פִּיהָ
  choice: verschließt seinen Mund
  rationale: Die Verbindung von קפץ mit »Mund« bedeutet, den Mund zu schließen. Das Perfekt wird hier als anschauliche, allgemeingültige Folge präsentisch wiedergegeben; die Personifikation bleibt erhalten.
theological_decisions:
- issue: Personifikation des Unrechts
  choice: Das abstrakte »Unrecht« wird als eine Größe dargestellt, die ihren Mund verschließt.
  alternative: »Alle Ungerechtigkeit verschließt ihren Mund« oder eine personale Wiedergabe wie »die Bösen verstummen«.
  rationale: Im Hebräischen steht das abstrakte feminine Substantiv עַוְלָה und kein ausdrücklicher Personenbegriff. Die Übersetzung bewahrt daher die poetische Personifikation und ersetzt das Unrecht nicht durch »die Bösen«.
- issue: Zeitbezug der Verbformen
  choice: 'Präsentische Wiedergabe: »sehen … freuen sich … verschließt«.'
  alternative: 'Futurisch: »werden sehen … werden sich freuen«; beim letzten Verb perfektisch: »hat ihren Mund verschlossen«.'
  rationale: Die hebräischen Verbformen erlauben im poetischen Zusammenhang unterschiedliche zeitliche Blickrichtungen. Das Präsens gibt die abschließende, allgemeine Aussage natürlich wieder, ohne eine ausschließlich zukünftige Erfüllung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. »Aufrichtige« ist allgemein verständlich; »verschließt seinen Mund« bewahrt das kräftige hebräische Bild. Das ergänzte »es« stellt im Deutschen den Rückbezug auf das zuvor geschilderte Handeln Gottes her.
