source:
  edition: WLC
  text: וַ/יְבָרֲכֵ֣/ם וַ/יִּרְבּ֣וּ מְאֹ֑ד וּ֝/בְהֶמְתָּ֗/ם לֹ֣א יַמְעִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: de
  text: Er segnete sie, und sie vermehrten sich sehr; ihr Vieh ließ er nicht abnehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und ihr Vieh nahm nicht ab.“ Das singularische hebräische Verb kann Gott als fortdauerndes Subjekt haben („ließ er nicht abnehmen“); der Satz kann aber auch sinngemäß als Ergebnis formuliert werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Er segnete sie
  rationale: Das Piel von ברך mit Suffix der 3. Person Plural bezeichnet hier das Gewähren von Segen und Gedeihen. Das singularische Subjekt bezieht sich im Zusammenhang auf Gott.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: sie vermehrten sich sehr
  rationale: רבה steht hier intransitiv im Plural und bezeichnet starke zahlenmäßige Zunahme; מְאֹד verstärkt diese Aussage.
- source_word: וּבְהֶמְתָּם
  choice: ihr Vieh
  rationale: בְּהֵמָה ist hier kollektiv für domestizierte Nutztiere gebraucht. „Vieh“ ist im Deutschen natürlich und weiter als „Rinder“.
- source_word: לֹא יַמְעִיט
  choice: ließ er nicht weniger werden
  rationale: Das Hifil von מעט bedeutet „vermindern, weniger werden lassen“. Die Form ist singularisch und kann Gott als fortdauerndes Subjekt haben; die deutsche Formulierung gibt den kausativen Sinn wieder.
theological_decisions:
- issue: Subjekt des letzten Teilsatzes
  choice: 'Gott bleibt das Subjekt: „ihr Vieh ließ er nicht weniger werden“.'
  alternative: „und ihr Vieh nahm nicht ab“
  rationale: Das singularische יַמְעִיט kann am natürlichsten das zuvor vorausgesetzte göttliche Subjekt fortführen. Zugleich lässt die knappe hebräische Satzfügung eine resultative Wiedergabe zu; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Wortstellung im letzten Teilsatz hält Gott als Subjekt fest, ohne die alternative resultative Auffassung zu verschweigen.
