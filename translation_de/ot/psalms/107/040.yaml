id: PSA.107.40
reference: Psalms 107:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שֹׁפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: de
  text: Er schüttet Verachtung über die Vornehmen aus[a] und lässt sie umherirren in pfadloser Öde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Fürsten“. Das hebräische Wort kann Vornehme, Fürsten oder einflussreiche Führende bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in Öde, kein Weg“ – also an einem verlassenen Ort ohne Weg oder Pfad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: schüttet ... aus
  rationale: Das Partizip von שׁפך bezeichnet das Ausgießen oder Ausschütten. Die bildhafte Wendung wird bewahrt; das Präsens entspricht der allgemeinen Beschreibung von Gottes Handeln im Psalm.
- source_word: בּוּז
  choice: Verachtung
  rationale: בּוּז bezeichnet Verachtung oder Hohn. „Verachtung“ verbindet sich im Deutschen natürlich mit „ausschütten“ und lässt zugleich öffentliche Erniedrigung anklingen.
- source_word: נְדִיבִים
  choice: die Vornehmen
  rationale: Das Wort kann Angehörige einer gehobenen, einflussreichen oder fürstlichen Schicht bezeichnen. „Die Vornehmen“ wahrt diese soziale Bedeutung, ohne die Gruppe enger als erbliche Fürsten festzulegen.
- source_word: וַיַּתְעֵם
  choice: lässt sie umherirren
  rationale: Der Hifil von תעה bedeutet, jemanden irren oder umherirren zu lassen. Hier steht das räumliche Bild des orientierungslosen Wanderns im Vordergrund.
- source_word: בְּתֹהוּ
  choice: in ... Öde
  rationale: תֹהוּ kann Öde, Leere oder Ungeordnetheit bezeichnen. Im Zusammenhang mit dem fehlenden Weg ist eine verlassene, unwegsame Gegend gemeint.
- source_word: לֹא דָרֶךְ
  choice: pfadloser
  rationale: Wörtlich lautet der Ausdruck „kein Weg“. Die adjektivische Wiedergabe „pfadlos“ ist knapp und natürlich und erhält das Bild eines Ortes ohne gangbaren Weg.
theological_decisions:
- issue: Unausgesprochenes Subjekt
  choice: „Er“ bezeichnet im Zusammenhang Gott als den Handelnden.
  alternative: Ein unpersönliches oder allgemein verstandenes Subjekt
  rationale: Der nähere Kontext von Psalm 107 schreibt solche Umkehrungen dem HERRN zu. Das im Deutschen notwendige Pronomen macht den im hebräischen Zusammenhang vorausgesetzten göttlichen Akteur sichtbar, ohne darüber hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Vornehme“ ist breit genug für die soziale und politische Bedeutung; „pfadlose Öde“ gibt die knappe hebräische Wendung natürlich wieder.
