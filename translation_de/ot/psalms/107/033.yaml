  text: יָשֵׂ֣ם נְהָר֣וֹת לְ/מִדְבָּ֑ר וּ/מֹצָ֥אֵי מַ֝֗יִם לְ/צִמָּאֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/033.yaml
  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: de
  text: Er macht Flüsse zur Wüste und Wasserquellen zu dürrem Land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu Durst«; gemeint ist ein ausgetrockneter, wasserloser Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: macht … zu
  rationale: Das Verb שׂים bedeutet grundsätzlich »setzen, stellen, machen«; zusammen mit dem Ergebnis-Lamed gibt »macht … zu« den beschriebenen Wandel knapp und idiomatisch wieder.
- source_word: נְהָרוֹת
  choice: Flüsse
  rationale: Der Plural bezeichnet hier unmittelbar Flüsse; die Wiedergabe erhält das konkrete poetische Bild.
- source_word: לְמִדְבָּר
  choice: zur Wüste
  rationale: מִדְבָּר kann Wüste oder unbewohnte Wildnis bezeichnen. Im Gegensatz zu den Flüssen bringt »Wüste« die trockene, öde Ergebnislage im Deutschen klar zum Ausdruck; לְ kennzeichnet den resultierenden Zustand.
- source_word: וּמֹצָאֵי מַיִם
  choice: und Wasserquellen
  rationale: מוֹצָאֵי מַיִם bezeichnet wörtlich die Austrittsorte beziehungsweise Ursprünge des Wassers. »Wasserquellen« ist natürlich, prägnant und bewahrt das Bild hervortretenden Wassers.
- source_word: לְצִמָּאוֹן
  choice: zu dürrem Land
  rationale: צִמָּאוֹן bedeutet wörtlich »Durst« beziehungsweise einen Zustand ausgetrockneter Dürre. »Dürres Land« gibt den örtlich-konkreten Sinn im Parallelismus natürlich wieder; die wörtlichere Metapher wird in der Fußnote bewahrt.
