id: PSA.107.21
reference: Psalms 107:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: de
  text: Sie sollen Jahwe danken für seine beständige Liebe und für seine Wundertaten an den Menschen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Söhnen des Menschen“; gemeint sind die Menschen allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für seine wunderbaren Werke“ bzw. „für seine Wunder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Sie sollen danken
  rationale: Der Hifil von ידה bezeichnet hier im wiederkehrenden Refrain die dankbare Antwort auf Gottes Rettung. Die deutsche Aufforderung gibt den hebräischen Jussiv natürlich wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: ל kennzeichnet den Empfänger des Dankes; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חסד umfasst treue, verlässliche Güte und Liebe. „Beständige Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Dauerhaftigkeit, ohne den Begriff allein auf Barmherzigkeit oder einen ausdrücklich genannten Bund zu verengen.
- source_word: וְנִפְלְאוֹתָיו
  choice: und für seine Wundertaten
  rationale: נפלאות bezeichnet außergewöhnliche, Staunen hervorrufende Taten. „Wundertaten“ ist im Deutschen konkret und zugleich bibelsprachlich verständlich.
- source_word: לִבְנֵי אָדָם
  choice: an den Menschen
  rationale: Die wörtliche Wendung „an den Söhnen Adams/Menschen“ ist eine generische Bezeichnung für Menschen. „An den Menschen“ gibt ihre Bedeutung natürlich wieder und lässt ל auf Gottes Wundertaten bezogen sein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen transparent wieder.
- issue: Generische Bedeutung von בני אדם
  choice: den Menschen
  alternative: den Menschenkindern; den Söhnen Adams
  rationale: Die hebräische maskuline Idiomatik bezeichnet hier die Menschheit allgemein. Die natürliche deutsche Wiedergabe vermeidet eine unbeabsichtigte Beschränkung auf männliche Personen.
- issue: Semantischer Umfang von חסד
  choice: beständige Liebe
  alternative: Güte; Gnade; Bundestreue
  rationale: Die gewählte Formulierung wahrt die Spannung zwischen liebevoller Güte und verlässlicher Treue, ohne einen Bund ausdrücklich einzutragen, der in diesem Vers nicht genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende Psalmaufforderung wird klar und direkt formuliert; „Wundertaten“ wahrt eine angemessen poetische Färbung.
