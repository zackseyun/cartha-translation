  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: de
  text: Sie sollen Jahwe[a] danken für seine treue Liebe und für seine Wundertaten zugunsten der Menschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat den Gottesnamen JHWH; traditionell wird er auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „für die Söhne des Menschen“; gemeint sind die Menschen insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Sie sollen danken
  rationale: Der Hifil-Imperfekt von ידה hat im wiederkehrenden Kehrvers von Psalm 107 auffordernden Sinn. „Sie sollen danken“ gibt diese Aufforderung im Deutschen natürlich wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger des Dankes. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen Form der Umschrift.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד bezeichnet verlässliche, loyale Güte und Liebe. „Treue Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Beständigkeit des Ausdrucks.
- source_word: וְנִפְלְאוֹתָיו
  choice: und für seine Wundertaten
  rationale: נִפְלָאוֹת sind außergewöhnliche Taten, die Staunen hervorrufen. „Wundertaten“ ist knapp, verständlich und handlungsbezogen; die Wiederholung von „für“ ist im Deutschen natürlich.
- source_word: לִבְנֵי אָדָם
  choice: an den Menschen
  rationale: Die hebräische Wendung bedeutet wörtlich „an/für die Söhne des Menschen/Adams“, bezeichnet hier aber kollektiv die Menschen. „An den Menschen“ bewahrt die Zielrichtung der göttlichen Taten und klingt im poetischen Zusammenhang würdig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen Namen, während eine Fußnote die verbreitete Wiedergabe „der HERR“ nennt.
- issue: Wiedergabe von בְּנֵי אָדָם
  choice: den Menschen
  alternative: den Menschensöhnen / den Söhnen Adams
  rationale: Die grammatisch maskuline hebräische Redeweise hat hier allgemein-menschliche, kollektive Bedeutung. „Den Menschen“ gibt diesen Sinn im heutigen Deutsch natürlich wieder; die wörtliche Bildform bleibt in der Fußnote sichtbar.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte / Huld / beständige Liebe
  rationale: „Treue Liebe“ hält Liebe, Loyalität und Beständigkeit zusammen, ohne den Ausdruck auf bloße Barmherzigkeit oder eine ausdrücklich technische Bundesformel einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Der auffordernde Charakter des Kehrverses bleibt erhalten; unnötig altertümliche Formen werden vermieden.
