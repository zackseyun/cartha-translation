  - severity: low
    issue: Die Fußnote bietet „Söhnen Adams“ als wörtliche Alternative.
    rationale: אָדָם kann zwar mit Adam zusammenhängen bzw. „Mensch“ bedeuten, doch die großgeschriebene deutsche Form „Adams“ erzeugt unnötig den Eindruck eines individuellen Eigennamens. Die wörtliche Angabe „Söhnen des Menschen“ genügt.
