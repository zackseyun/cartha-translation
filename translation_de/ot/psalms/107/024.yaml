source:
  edition: WLC
  text: הֵ֣מָּה רָ֭אוּ מַעֲשֵׂ֣י יְהוָ֑ה וְ֝/נִפְלְאוֹתָ֗י/ו בִּ/מְצוּלָֽה׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/024.yaml
  text: They saw the works of Yahweh[a], and his wonders in the deep.
translation:
  language: de
  text: Sie sahen die Taten Jahwes und seine Wunder in der Meerestiefe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Tiefen“. Das hebräische Wort bezeichnet besonders die tiefen Wasser und passt zum Zusammenhang der Seefahrt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Sie
  rationale: Das selbstständige Personalpronomen der 3. Person Plural hebt die Seeleute als diejenigen hervor, die dies selbst sahen; im Deutschen genügt das ausdrückliche „Sie“.
- source_word: רָאוּ
  choice: sahen
  rationale: Das Qal Perfekt schildert in der poetischen Rückschau, was die Seeleute erlebten; das Präteritum ist dafür natürlich.
- source_word: מַעֲשֵׂי
  choice: Taten
  rationale: Der Konstruktplural bezeichnet Jahwes wirksame Handlungen; „Taten“ ist im modernen Deutschen natürlicher als „Werke“ und passt zur parallelen Nennung seiner Wunder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְנִפְלְאוֹתָיו
  choice: und seine Wunder
  rationale: Der Plural von פלא bezeichnet staunenerregende Machttaten; das Suffix der 3. Person Singular wird mit „seine“ ausdrücklich bewahrt.
- source_word: בִּמְצוּלָה
  choice: in der Meerestiefe
  rationale: מְצוּלָה bezeichnet eine Tiefe, besonders die Tiefe des Meeres. Der maritime Kontext macht „Meerestiefe“ klar und anschaulich, ohne den Ausdruck unnötig auszubauen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. Seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelität. „Meerestiefe“ verdeutlicht den unmittelbaren maritimen Zusammenhang; die mögliche allgemeinere Wiedergabe bleibt in der Fußnote erhalten.
