source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: de
  text: Sie sollen Jahwe danken für seine beständige Liebe und für seine Wundertaten an den Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Menschenkindern“; auch: „an den Söhnen der Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Sie sollen danken
  rationale: Die Hifil-Form im Refrain hat auffordernden Sinn. „Sie sollen danken“ gibt diesen im modernen Deutschen natürlich wieder.
- source_word: לַיהוָה
  choice: Jahwe danken
  rationale: Die Präposition לְ kennzeichnet hier den Empfänger des Dankes; im Deutschen regiert „danken“ den Dativ. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חסד bezeichnet hier Gottes verlässliche, treue Güte und Liebe. „Beständige Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Dauerhaftigkeit.
- source_word: וְנִפְלְאוֹתָיו
  choice: und für seine Wundertaten
  rationale: Das Substantiv bezeichnet außergewöhnliche, staunenswerte Taten. „Wundertaten“ ist prägnant und wahrt den aktiven Sinn.
- source_word: לִבְנֵי אָדָם
  choice: an den Menschen
  rationale: Wörtlich lautet die Wendung „an den Söhnen/Kindern Adams“. Im Kontext bezeichnet sie die Menschen als Empfänger von Gottes Wundertaten; „an den Menschen“ ist idiomatisch und lässt sich durch eine Fußnote transparent machen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe der Wendung בני אדם
  choice: den Menschen
  alternative: den Menschenkindern
  rationale: Die hebräische maskuline Idiomatik meint hier die Menschheit beziehungsweise Menschen allgemein. Die Hauptfassung vermeidet im Deutschen eine unnötig geschlechtsspezifische oder altertümliche Form, während die Fußnote die Bildsprache offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederkehrende Psalmrefrain bleibt knapp und auffordernd; die hebräische Präposition vor בני אדם wird mit „an“ gewahrt.
