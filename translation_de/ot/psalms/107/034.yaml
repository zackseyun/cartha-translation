  text: a fruitful land into a salt waste[a], because of the evil of those who dwell in it.
translation:
  language: de
  text: fruchtbares Land in eine Salzwüste[a], wegen der Bosheit derer, die darin wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in salzhaltiges Land“; das hebräische Wort bezeichnet einen salzigen Zustand und legt hier eine unfruchtbare Gegend nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: fruchtbares Land
  rationale: Die Verbindung bezeichnet idiomatisch ein Land, das Frucht hervorbringt; „fruchtbares Land“ ist natürlich und bewahrt den landwirtschaftlichen Sinn.
- source_word: לִמְלֵחָה
  choice: in eine Salzwüste
  rationale: Das ל bezeichnet das Ergebnis der Verwandlung. מְלֵחָה beschreibt einen salzhaltigen, dadurch unfruchtbaren Zustand; „Salzwüste“ bewahrt das konkrete Salzbild und dessen Wirkung.
- source_word: מֵרָעַת
  choice: wegen der Bosheit
  rationale: מִן hat hier kausale Bedeutung, während רָעָה moralisches Übel beziehungsweise Bosheit bezeichnet.
- source_word: יֹשְׁבֵי בָהּ
  choice: derer, die darin wohnten
  rationale: Das Partizip bezeichnet die Bewohner des zuvor genannten Landes. Das Präteritum klingt in der rückblickenden Schilderung des Psalms natürlich.
theological_decisions:
- issue: Ursache der Verwüstung des Landes
  choice: Die Verwandlung wird ausdrücklich auf die Bosheit der Bewohner zurückgeführt.
  alternative: Die Veränderung lediglich als unpersönlichen Umweltvorgang oder historischen Prozess wiederzugeben.
  rationale: מֵרָעַת stellt einen klaren moralisch-kausalen Zusammenhang her; dieser darf in der Übersetzung nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Versstruktur wird beibehalten; „Salzwüste“ vermittelt zugleich das konkrete Bild und die Unfruchtbarkeit, ohne die moralische Ursache zu verwischen.
