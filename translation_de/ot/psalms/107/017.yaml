base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: de
  text: Törichte Menschen litten wegen ihres auflehnenden Lebenswandels[a] und wegen ihrer Verfehlungen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wegen des Weges ihrer Auflehnung“. „Weg“ bezeichnet hier ihren Lebenswandel; die hebräische Präposition kann formaler auch mit „von“ oder „aus“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Schuld“, „Sünden“ oder „Folgen der Schuld“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: Törichte Menschen
  rationale: Das Wort bezeichnet Menschen, deren Torheit vor allem moralischer Art ist. Die Formulierung ist im heutigen Deutsch verständlicher als das altertümlich wirkende „Toren“.
- source_word: מִדֶּרֶךְ פִּשְׁעָם
  choice: wegen ihres rebellischen Lebenswandels
  rationale: מִן wird hier am besten kausal verstanden. דֶּרֶךְ bezeichnet bildhaft den Lebensweg beziehungsweise die Lebensführung, und פֶּשַׁע trägt den Gedanken bewusster Auflehnung.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: und wegen ihrer Vergehen
  rationale: Die wiederholte Präposition wird auch im Deutschen wiedergegeben. עָוֹן kann schuldhafte Verfehlungen, Schuld oder deren Folgen bezeichnen; „Vergehen“ bewahrt hier den Bezug auf konkrete schuldhafte Taten.
- source_word: יִתְעַנּוּ
  choice: mussten … leiden
  rationale: Der Hitpael von ענה beschreibt hier ein Erleiden von Bedrängnis oder Beugung. „Mussten leiden“ gibt den resultierenden Zustand im erzählenden Rückblick natürlich wieder, ohne die Art des Leidens unnötig festzulegen.
theological_decisions:
- issue: Ursächlicher Zusammenhang zwischen Verfehlung und Leiden
  choice: Das Leiden dieser Menschen wird ausdrücklich auf ihren rebellischen Lebenswandel und ihre Vergehen zurückgeführt.
  alternative: Die Präpositionen könnten formaler mit „von/aus“ wiedergegeben werden, wodurch der ursächliche Zusammenhang weniger ausdrücklich wäre.
  rationale: Die beiden Vorkommen von מִן sind in diesem Zusammenhang wahrscheinlich kausal. Die Übersetzung beschränkt diese Aussage auf die hier beschriebenen Menschen und macht daraus keine allgemeine Lehre, nach der jedes Leiden auf persönliche Sünde zurückgehe.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. „Törichte Menschen“ hält die moralische Bedeutung fest, ohne altertümlich zu klingen; „rebellischer Lebenswandel“ entfaltet das hebräische Bild vom Weg knapp und natürlich.
