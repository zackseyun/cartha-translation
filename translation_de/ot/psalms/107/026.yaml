  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: de
  text: Sie steigen zum Himmel empor, sie sinken hinab in die Tiefen. Ihre Seele schmilzt in ihrer Not dahin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Leben schmilzt in der Not dahin.“ Das hebräische Wort נֶפֶשׁ kann „Seele“, „Leben“ oder „Selbst“ bedeuten; רָעָה kann „Not“, „Unheil“ oder „Unglück“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: steigen … empor
  rationale: Das Qal Imperfekt von עלה bezeichnet die Aufwärtsbewegung; das Präsens vergegenwärtigt die lebhafte poetische Schilderung.
- source_word: שָׁמַיִם
  choice: zum Himmel
  rationale: Im Deutschen ist „zum Himmel“ die natürliche poetische Entsprechung für die große Höhe, in die die Seeleute auf den Wellen gehoben werden.
- source_word: יֵרְדוּ
  choice: sinken hinab
  rationale: ירד steht als Gegenbewegung zu עלה. „Sinken hinab“ passt natürlich zur Bewegung in die Wellentäler, ohne das Bild auszudeuten.
- source_word: תְהוֹמוֹת
  choice: in die Tiefen
  rationale: Der Plural von תְּהוֹם bezeichnet hier die Meerestiefen beziehungsweise tiefen Wellentäler; „die Tiefen“ bewahrt das poetische Bild.
- source_word: נַפְשָׁם
  choice: ihre Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder das eigene Selbst bezeichnen. „Ihre Seele“ erhält die Bildkraft und die lexikalische Offenheit des Hebräischen.
- source_word: בְּרָעָה
  choice: vor Not
  rationale: רָעָה bezeichnet hier angesichts des Sturms Not, Unheil oder Bedrängnis, nicht moralisches Böses. „Vor Not“ ist im Deutschen idiomatisch und gibt den Grund ihres inneren Zusammenbrechens wieder.
- source_word: תִתְמוֹגָג
  choice: zerfließt
  rationale: Die Form von מוג beschreibt ein Schmelzen oder inneres Auflösen. „Zerfließt“ bewahrt die Metapher stärker als die bloße Deutung „verzagt“.
