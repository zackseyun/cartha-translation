base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/027.yaml
  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: de
  text: Sie taumeln und schwanken wie ein Betrunkener, und all ihre Weisheit[a] wird verschlungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Zusammenhang kann „Weisheit“ ihre praktische Sachkenntnis, besonders ihre seemännische Erfahrung, bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָח֣וֹגּוּ
  choice: sie taumeln
  rationale: Das Verb bezeichnet hier die unsichere, unkontrollierte Bewegung der Seeleute im Sturm; „taumeln“ ist anschaulich und natürlich.
- source_word: וְיָנוּעוּ
  choice: und schwanken
  rationale: Das Verb beschreibt ein Hin-und-her-Bewegtwerden. „Schwanken“ wahrt die poetische Paarung zweier ähnlicher Bewegungsverben, ohne sie gleichzusetzen.
- source_word: כַּשִּׁכּוֹר
  choice: wie ein Betrunkener
  rationale: Die substantivisch gebrauchte Einzahl bezeichnet einen betrunkenen Menschen und bildet den Vergleich für ihre Haltlosigkeit.
- source_word: וְכָל חָכְמָתָם
  choice: und all ihre Weisheit
  rationale: „Weisheit“ gibt חָכְמָה unmittelbar wieder; im Zusammenhang ist besonders ihre praktische Sachkenntnis und seemännische Erfahrung gemeint.
- source_word: תִּתְבַּלָּע
  choice: versagt
  rationale: Wörtlich wird ihre Weisheit „verschlungen“; idiomatisch beschreibt die Form hier, dass ihr Können in der Not nicht mehr weiterhilft. „Versagt“ vermittelt diesen kontextuellen Sinn klar, während die Fußnote das konkrete Bild bewahrt.
