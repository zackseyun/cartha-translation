lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: Sie sollen ihn … erheben
  rationale: Das Polel von רומם bezeichnet hier das ehrende Erheben beziehungsweise Hochpreisen. „Erheben“ bewahrt das Bild und klingt im poetischen Lobkontext natürlich.
- source_word: בִּקְהַל
  choice: in der Versammlung
  rationale: קהל bezeichnet eine einberufene oder versammelte Gemeinschaft. „Versammlung“ ist verständlich und weniger konfessionell geprägt als „Gemeinde“.
- source_word: עָם
  choice: des Volkes
  rationale: עָם meint hier das gemeinschaftlich versammelte Volk, nicht vorrangig einen modernen Nationalstaat.
- source_word: וּבְמוֹשַׁב
  choice: und … im Kreis
  rationale: מוֹשָׁב kann Sitz, Sitzung oder Zusammenkunft bedeuten. In Verbindung mit den Ältesten gibt „im Kreis“ eine sitzende, beratende Zusammenkunft natürlich wieder, ohne die konkrete Bildlichkeit völlig in „Rat“ aufzulösen.
- source_word: זְקֵנִים
  choice: der Ältesten
  rationale: זְקֵנִים bezeichnet in diesem Zusammenhang anerkannte Verantwortungsträger der Gemeinschaft und nicht bloß alte Männer.
- source_word: יְהַלְלוּהוּ
  choice: ihn … preisen
  rationale: Das Piel von הלל hat hier die geläufige Bedeutung „preisen“ und entspricht dem öffentlichen Gotteslob.
