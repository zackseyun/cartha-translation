  text: וַ/יַּכְנַ֣ע בֶּ/עָמָ֣ל לִבָּ֑/ם כָּ֝שְׁל֗וּ וְ/אֵ֣ין עֹזֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: de
  text: So demütigte er ihr Herz durch Mühsal[a]; sie strauchelten[b], und niemand half ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch schwere Arbeit“ oder „durch Elend“; das hebräische Wort kann beschwerliche Arbeit, Mühe oder Not bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie fielen“; das hebräische Verb kann Straucheln oder Zusammenbrechen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: So demütigte er
  rationale: Der Hifil von כנע bezeichnet ein Herabbringen oder Demütigen. Das nicht ausdrücklich genannte Subjekt ist im Zusammenhang Gott; die aktive Form bewahrt diese Aussage.
- source_word: בֶּעָמָל
  choice: durch Mühsal
  rationale: עָמָל kann Mühe, beschwerliche Arbeit oder Elend bezeichnen. „Mühsal“ bewahrt die Spannweite und legt den Ausdruck nicht unnötig auf Zwangsarbeit fest.
- source_word: לִבָּם
  choice: ihr Herz
  rationale: Der hebräische Singular „Herz“ mit pluralischem Bezug wird kollektiv gebraucht und bezeichnet das Innere beziehungsweise den Mut der Betroffenen.
- source_word: כָּשְׁלוּ
  choice: sie strauchelten
  rationale: כשל bezeichnet Straucheln und kann auch das daraus folgende Fallen einschließen. „Strauchelten“ erhält das Bild, ohne den Ausgang festzulegen.
- source_word: וְאֵין עֹזֵר
  choice: und niemand half ihnen
  rationale: Die idiomatische deutsche Form gibt die hebräische Aussage wieder, dass kein Helfer da war.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וַיַּכְנַע
  choice: Gott bleibt als Subjekt durch „er“ gegenwärtig.
  alternative: 'Unpersönlich: „Ihr Herz wurde gedemütigt.“'
  rationale: Der Kontext schreibt Bedrängnis und Rettung dem HERRN zu. Die aktive Verbform wahrt Gottes Handeln, ohne seinen Namen im Vers ergänzend einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mühsal“ ist leicht gehoben, aber allgemein verständlich und erhält die lexikalische Offenheit des Hebräischen. Der kollektive Singular „ihr Herz“ wurde bewusst bewahrt.
