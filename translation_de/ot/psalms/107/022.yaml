  language: en
  yaml_path: translation/ot/psalms/107/022.yaml
  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: de
  text: Sie sollen Dankopfer darbringen und seine Taten mit Jubel erzählen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und unter Jubel von seinen Taten erzählen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: Sie sollen … darbringen
  rationale: Die Imperfektform hat hier im poetischen Zusammenhang auffordernden Charakter. „Darbringen“ ist im Deutschen für Opfer idiomatisch und bewahrt den kultischen Sinn.
- source_word: זִבְחֵי תוֹדָה
  choice: Dankopfer
  rationale: 'Das deutsche Kompositum gibt die kultische Verbindung prägnant und natürlich wieder: Opfer, die als Ausdruck des Dankes dargebracht werden.'
- source_word: וִיסַפְּרוּ
  choice: erzählen
  rationale: Das Piel von ספר bezeichnet das berichtende Erzählen oder Verkünden. „Erzählen“ ist allgemein verständlich und passt zu Gottes Taten als Gegenstand.
- source_word: מַעֲשָׂיו
  choice: seine Taten
  rationale: „Taten“ bezeichnet hier Gottes wirksames Handeln natürlicher und konkreter als „Werke“.
- source_word: בְּרִנָּה
  choice: mit Jubel
  rationale: רִנָּה bezeichnet einen hörbaren Freudenausdruck, der Jubelruf oder freudigen Gesang umfassen kann. „Mit Jubel“ erhält diese Bedeutungsbreite.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Aufforderungen bleiben erhalten; „Dankopfer“ bewahrt den kultischen Bezug, während „mit Jubel“ die mögliche Bandbreite zwischen Jubelruf und freudigem Gesang offenlässt.
