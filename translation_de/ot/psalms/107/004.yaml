base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/004.yaml
  text: They wandered in the wilderness[a], in a desolate way; they found no city to dwell in.
translation:
  language: de
  text: Sie irrten in der Wüste umher, auf einem Weg durch die Einöde[a]; sie fanden keine Stadt, in der sie wohnen konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in der Einöde, auf einem Weg.'
    reason: Die knappe Verbindung בִּישִׁימוֹן דָּרֶךְ lässt die genaue Zuordnung von „Einöde“ und „Weg“ offen; beide Begriffe bleiben in der Alternative erhalten.
lexical_decisions:
- source_word: תָּעוּ
  choice: sie irrten … umher
  rationale: Das Verb תעה bezeichnet ein Umherirren oder Abirren. Hier stehen orientierungslose Reisende im Blick; „irrten … umher“ gibt Bewegung und Verlorenheit wieder, ohne eine moralische Verfehlung zu unterstellen.
- source_word: בַמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes Wüsten- oder Wildnisgebiet. „Wüste“ ist im Deutschen knapp, geläufig und passt zum folgenden Bild der Einöde.
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: auf einem Weg durch die Einöde
  rationale: יְשִׁימוֹן bezeichnet eine öde, verwüstete Gegend, דֶּרֶךְ einen Weg oder Pfad. Die Wiedergabe wahrt beide Begriffe und ergibt ein verständliches deutsches Bild; die gedrängte hebräische Verbindung lässt jedoch auch die Auffassung einer weglosen Öde zu.
- source_word: עִיר מוֹשָׁב
  choice: Stadt, in der sie wohnen konnten
  rationale: Die Wortverbindung meint eine bewohnte oder zum Aufenthalt geeignete Stadt. Der Relativsatz drückt im Deutschen natürlich aus, dass die Suchenden keinen Ort zur Niederlassung fanden.
- source_word: לֹא מָצָאוּ
  choice: sie fanden keine
  rationale: Die verneinte Perfektform stellt schlicht fest, dass ihre Suche erfolglos blieb.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Psalmenprosa mit leicht poetischem Rhythmus. „Irrten … umher“ vermeidet den moralisch stärker gefärbten Eindruck von „gingen in die Irre“. Der Relativsatz am Versende ist alltagssprachlich verständlich und bewahrt den Gedanken eines bewohnbaren Zielortes.
