revisions:
- from: So sollen es die von Jahwe Erlösten sagen, die er aus der Hand des Bedrängers befreit hat.[a]
  to: So sollen die Erlösten Jahwes sagen, die er aus der Hand des Bedrängers[a] erlöst hat.
