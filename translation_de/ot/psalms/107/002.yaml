    issue: Die Wiederholung der Wurzel גאל wird im Relativsatz durch „befreit hat“ aufgegeben.
    rationale: Der hebräische Vers verbindet „die Erlösten“ und „die er erlöst hat“ absichtlich durch dieselbe Wurzel. Auch wenn „befreien“ den allgemeinen Sinn trifft, sollte die Wiederholung hier erhalten bleiben.
  - severity: low
    issue: Unnatürliche Wortstellung in „So sollen es die von Jahwe Erlösten sagen“.
    rationale: Die Umstellung zu „So sollen die Erlösten Jahwes sagen“ klingt im modernen, zugleich poetischen Deutsch flüssiger, ohne den Sinn zu verändern.
  revised_text: So sollen die Erlösten Jahwes sagen, die er aus der Hand des Bedrängers[a] erlöst hat.
