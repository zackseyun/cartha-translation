review_pass:
  verdict: revise
  source_fidelity: Die Aufforderung, der Gottesname, die Erlösten-Terminologie und die Metapher „aus der Hand“ geben den hebräischen Text grundsätzlich zutreffend wieder. Die unterschiedliche Wiedergabe von גאל als „Erlösten“ und „befreit hat“ schwächt jedoch die im Vers bewusst wiederholte Wurzel und den Erlösungsbezug ab.
  naturalness: „So sollen es die von Jahwe Erlösten sagen“ ist verständlich, aber die Stellung von „es“ vor dem Subjekt wirkt im modernen Standarddeutsch unnötig schwerfällig. „So sollen die Erlösten Jahwes sagen“ ist idiomatischer und bewahrt den psalmischen Ton.
  terminology: „Jahwe“ ist angemessen. „Erlöste/erlöst“ erhält die Wiederholung des hebräischen גאל und ist gegenüber der Mischform „Erlösten/befreit“ terminologisch kohärenter. „Bedränger“ ist als kontextuell passende, bewusst nicht zu enge Wiedergabe von צָר möglich; die Fußnote dokumentiert die naheliegenden Alternativen.
  issues:
