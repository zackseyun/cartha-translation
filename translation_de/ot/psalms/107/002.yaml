  text: יֹ֭אמְרוּ גְּאוּלֵ֣י יְהוָ֑ה אֲשֶׁ֥ר גְּ֝אָלָ֗/ם מִ/יַּד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: de
  text: So sollen die Erlösten Jahwes sagen, die er aus der Hand des Bedrängers[a] erlöst hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Hand des Feindes“ beziehungsweise „des Gegners“. Das hebräische Wort kann einen Gegner, Feind oder Unterdrücker bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: So sollen ... sagen
  rationale: Die Imperfektform hat im Zusammenhang auffordernden Charakter. Die deutsche Wendung nimmt den Rückbezug auf den vorangehenden Dankaufruf natürlich auf.
- source_word: גְּאוּלֵי / גְּאָלָם
  choice: die ... Erlösten / befreit hat
  rationale: Das Partizip bezeichnet die von Jahwe Geretteten. Beim Verb vermeidet „befreit“ im Deutschen eine schwerfällige Wiederholung, während der konkrete Sinn göttlicher Auslösung aus feindlicher Gewalt erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Metapher für Macht oder Verfügungsgewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: צָר
  choice: Bedränger
  rationale: Das Substantiv kann einen Gegner, Feind oder Unterdrücker bezeichnen; „Bedränger“ bewahrt hier sowohl die feindliche als auch die bedrückende Komponente.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter.
- issue: Sinn der Erlösungssprache
  choice: Erlösten / befreit
  alternative: Losgekauften / losgekauft
  rationale: גאל bezeichnet hier die wirksame Rettung aus der Gewalt eines Gegners. Die Übersetzung wahrt den theologischen Erlösungsklang, ohne den Ausdruck auf einen ausdrücklich genannten Kaufpreis zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischem Klang. Die hebräische Hand-Metapher bleibt bewusst erhalten; die Aufforderung wird idiomatisch als „So sollen ... sagen“ formuliert.
