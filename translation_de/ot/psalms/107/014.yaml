source:
  edition: WLC
  text: יֽ֭וֹצִיאֵ/ם מֵ/חֹ֣שֶׁךְ וְ/צַלְמָ֑וֶת וּ/מוֹסְר֖וֹתֵי/הֶ֣ם יְנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: de
  text: Er führte sie aus Dunkelheit und Todesschatten[a] heraus und zerriss ihre Fesseln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tiefe Finsternis“. Das hebräische Wort kann „Todesschatten“ oder sehr tiefe Dunkelheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: Er führte sie heraus
  rationale: Der Hifil von יצא bezeichnet das Herausführen oder Herausbringen. Das deutsche Präteritum entspricht dem erzählenden Rückblick des Psalms.
- source_word: מֵחֹשֶׁךְ
  choice: aus Dunkelheit
  rationale: חֹשֶׁךְ ist die gewöhnliche Bezeichnung für Dunkelheit; die Präposition מִן wird natürlich mit „aus“ wiedergegeben.
- source_word: וְצַלְמָוֶת
  choice: und Todesschatten
  rationale: צַלְמָוֶת kann traditionell als „Todesschatten“ verstanden werden, möglicherweise aber auch allgemein sehr tiefe Dunkelheit bezeichnen. Die Mehrdeutigkeit wird durch eine Fußnote gewahrt.
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: ihre Fesseln
  rationale: מוֹסְרוֹת bezeichnet Fesseln oder Bande. „Fesseln“ ist im Deutschen anschaulich und passt zum Bild der Gefangenschaft.
- source_word: יְנַתֵּק
  choice: zerriss
  rationale: Der Piel von נתק bezeichnet ein gewaltsames Abreißen, Zerreißen oder Lösen. „Zerriss“ verbindet sich im Deutschen natürlich mit „Fesseln“ und bewahrt die Kraft des Verbs.
theological_decisions:
- issue: Bedeutung von צַלְמָוֶת
  choice: Todesschatten
  alternative: tiefster Dunkelheit
  rationale: Die traditionelle Deutung als „Todesschatten“ ist sprachlich vertretbar und lässt die tödliche Gefahr anklingen. Da das Wort auch intensive Dunkelheit bezeichnen kann, wird diese Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Bildsprache von Dunkelheit, Todesschatten und zerrissenen Fesseln bleibt knapp und anschaulich erhalten.
