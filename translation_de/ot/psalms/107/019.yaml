base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/019.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: de
  text: Da schrien sie in ihrer Not zu Jahwe[a]; aus ihren Bedrängnissen rettete er sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Da schrien sie
  rationale: Die Verbform führt die wiederkehrende Abfolge des Psalms fort; „Da“ gibt diesen zeitlich-folgernden Zusammenhang natürlich wieder. זעק bezeichnet einen dringenden Hilferuf.
- source_word: אֶל־יְהוָה
  choice: zu Jahwe
  rationale: אֶל bezeichnet die Richtung des Rufens; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בַּצַּר לָהֶם
  choice: in ihrer Not
  rationale: Wörtlich bezeichnet die Wendung die für sie bestehende Bedrängnis. „In ihrer Not“ ist im Deutschen natürlich und bewahrt den kollektiven Singular.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: aus ihren Bedrängnissen
  rationale: מְצוּקוֹת bezeichnet bedrängende Notlagen oder Zwangslagen. Der Plural und die lexikalische Unterscheidung zum vorherigen צַר bleiben erhalten.
- source_word: יוֹשִׁיעֵם
  choice: rettete er sie
  rationale: Der Hifil-Stamm von ישׁע bedeutet hier „retten“ oder „befreien“. Die deutsche Vergangenheitsform entspricht dem erzählenden Zusammenhang des Kehrverses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen יהוה. „Jahwe“ gibt ihn als Namen wieder, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung im zweiten Teilsatz hebt entsprechend dem hebräischen Ausgangspunkt die Herkunft der Rettung aus den Bedrängnissen hervor; die beiden verschiedenen Notbegriffe werden mit „Not“ und „Bedrängnissen“ unterschieden.
