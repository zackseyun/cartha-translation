  text: וַ/יִּזְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֻֽקוֹתֵי/הֶ֗ם יוֹשִׁיעֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/013.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: de
  text: Da schrien sie in ihrer Not zu Jahwe, und er rettete sie aus ihren Bedrängnissen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ihren Nöten“ beziehungsweise „aus ihren bedrängenden Notlagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Da schrien sie
  rationale: Das waw mit der Verbform führt die Erzählung weiter; „Da“ gibt zugleich das wiederkehrende Muster des Psalms natürlich wieder. זעק bezeichnet hier einen eindringlichen Hilferuf.
- source_word: אֶל־יְהוָה
  choice: zu Jahwe
  rationale: Die Präposition אֶל bezeichnet die Richtung des Rufens. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּצַּר לָהֶם
  choice: in ihrer Not
  rationale: Die Wendung bezeichnet die bedrängende Lage, in der sie sich befinden. „In ihrer Not“ ist im Deutschen idiomatisch und bewahrt den kollektiven Singular.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: aus ihren Bedrängnissen
  rationale: Das Substantiv bezeichnet bedrängende, einengende Notlagen. Der deutsche Plural entspricht der hebräischen Form.
- source_word: יוֹשִׁיעֵם
  choice: er rettete sie
  rationale: Der Hifil von ישׁע bedeutet retten oder befreien. „Rettete“ ist hier direkt, natürlich und bewahrt den heilsgeschichtlichen Wortklang der Wurzel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Die Transliteration „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von ישׁע
  choice: rettete
  alternative: befreite
  rationale: Beide Wiedergaben sind sprachlich möglich. „Rettete“ lässt den umfassenderen Sinn der Wurzel offen und beschränkt die Aussage nicht auf eine bestimmte Art der Befreiung.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bildet den knappen poetischen Parallelismus nach, ohne unnatürlich zu wirken. Der Wechsel vom kollektiven Singular „Not“ zum Plural „Bedrängnisse“ folgt dem Hebräischen.
