  source_fidelity: 'Die Übersetzung gibt den hebräischen Vers genau wieder: Das narrative וַ kennzeichnet den Fortgang („Da“), זעק wird mit dem dringlichen „schrien“ angemessen wiedergegeben, בַּצַּר לָהֶם als kollektives „in ihrer Not“, und der Plural מִמְּצֻקוֹתֵיהֶם als „aus ihren Bedrängnissen“. „Er rettete sie“ entspricht dem Hifil von ישׁע. Die Satzfolge und die pronominale Referenz sind klar.'
