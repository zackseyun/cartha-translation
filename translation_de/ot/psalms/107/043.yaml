source:
  edition: WLC
  text: מִי חָכָ֥ם וְ/יִשְׁמָר אֵ֑לֶּה וְ֝/יִתְבּֽוֹנְנ֗וּ חַֽסְדֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: de
  text: Wer ist weise? Der beherzige diese Dinge, und die Weisen sollen die Erweise der treuen Liebe Jahwes bedenken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische wechselt vom Singular („er beherzige“) zum Plural („sie sollen bedenken“). Die im Deutschen ergänzte Bezeichnung „die Weisen“ macht die vom einleitenden „Wer ist weise?“ vorausgesetzte pluralische Bezugsgruppe ausdrücklich.
    reason: Der ungewöhnliche Numeruswechsel soll erkennbar bleiben, ohne ein im Deutschen bezugsloses „sie“ zu erzeugen.
  - marker: b
    text: 'Hebräisch steht im Plural: „die Erweise der treuen Liebe“. Gemeint sind Jahwes vielfache Erweise von Güte, Treue und Barmherzigkeit.'
    reason: Der Plural von חַסְדֵי und die Bedeutungsbreite von חֶסֶד werden sichtbar gemacht.
lexical_decisions:
- source_word: מִי חָכָם
  choice: Wer ist weise?
  rationale: Die direkte rhetorische Frage gibt מִי und das prädikative חָכָם knapp und quellennah wieder, ohne sie zu einem glatten „Wer weise ist“ umzudeuten.
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: Er beherzige dies alles
  rationale: Das imperfektische Verb kann hier auffordernd verstanden werden. „Beherzigen“ bezeichnet im Deutschen das aufmerksame Bewahren und Befolgen der zuvor erzählten Dinge; „dies alles“ macht den Rückverweis des Demonstrativpronomens idiomatisch deutlich.
- source_word: וְיִתְבּוֹנְנוּ
  choice: und denke mit anderen … nach
  rationale: Die Form ist pluralisch und bezeichnet verständiges, eingehendes Betrachten. Die Wendung hält den unvermittelten Wechsel vom Singular zum Plural erkennbar, ohne im Deutschen ein beziehungsloses „sie“ einzuführen.
- source_word: חַסְדֵי
  choice: die Taten der treuen Liebe
  rationale: Der hebräische Plural bezeichnet hier wahrscheinlich die vielfachen Erweise von חֶסֶד. „Treue Liebe“ bewahrt die Bedeutungsbreite von beständiger Zuwendung, Güte und Bundestreue; „Taten“ macht den Plural natürlich sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch den Titel „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ gibt ihn in einer geläufigen deutschen Form wieder, ohne einen Titel an seine Stelle zu setzen.
- issue: Wechsel vom Singular zum Plural
  choice: Er beherzige … und denke mit anderen … nach
  alternative: Er beherzige … und sie sollen … nachdenken; die Weisen sollen … nachdenken
  rationale: Der Wechsel der Numeri bleibt inhaltlich erhalten. Zugleich vermeidet „mit anderen“ ein im Deutschen unklar bezogenes Pronomen und fügt nicht ausdrücklich das im zweiten Satzteil fehlende Substantiv „die Weisen“ ein.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Gnade; Güte; Bundestreue
  rationale: Die Formulierung hält Liebe, verlässliche Zuwendung und Treue zusammen, ohne den Ausdruck ausschließlich auf einen einzelnen theologischen Fachbegriff festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Eröffnung bleibt direkt; „beherzigen“ und „nachdenken“ sind allgemein verständlich. Der schwierige Numeruswechsel wird weder beseitigt noch durch ein unklar bezogenes „sie“ unnötig holprig gemacht.
