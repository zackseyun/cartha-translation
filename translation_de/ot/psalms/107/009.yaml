  source_fidelity: Die Grundstruktur, die Wiederholung von נֶפֶשׁ und die rückblickenden Perfektformen sind zutreffend wiedergegeben. שֹׁקֵקָה steht im Kontext für dürstendes bzw. stark verlangendes Begehren; die Übersetzung sollte im Deutschen jedoch die übliche Verbindung mit dem Verb berücksichtigen.
