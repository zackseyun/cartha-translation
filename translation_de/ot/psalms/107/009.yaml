source:
  edition: WLC
  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: de
  text: Denn er hat die durstige Seele[a] gestillt und die hungrige Seele mit Gutem[b] erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „den durstigen Menschen“. Das hebräische Wort für „Seele“ (nefesch) kann den ganzen lebenden Menschen bezeichnen, nicht nur einen immateriellen Teil.
    reason: lexical_alternative
  - marker: b
    text: Oder „mit guten Gaben“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zum Dank ein und bewahrt den erklärenden Zusammenhang.
- source_word: הִשְׂבִּיעַ
  choice: hat … gesättigt
  rationale: Das Hifil von שבע bezeichnet das Herbeiführen von Sättigung oder Befriedigung. Das Perfekt wird im erzählenden Rückblick des Psalms als vollendete Handlung wiedergegeben.
- source_word: נֶפֶשׁ
  choice: Seele
  rationale: נֶפֶשׁ bezeichnet hier den bedürftigen lebenden Menschen in seiner Ganzheit. „Seele“ bewahrt die poetische Wiederholung und Tiefe, ohne auf einen ausschließlich immateriellen Bestandteil festgelegt zu sein.
- source_word: שֹׁקֵקָה
  choice: dürstende
  rationale: Das Wort bezeichnet heftiges Verlangen; im Zusammenhang mit Hunger und Durst in Vers 5 sowie parallel zu „hungrig“ liegt die konkrete Wiedergabe „dürstend“ nahe.
- source_word: רְעֵבָה
  choice: hungrige
  rationale: Direkte und natürliche Wiedergabe des Adjektivs; sie erhält die Parallelität zu „dürstende“.
- source_word: מִלֵּא
  choice: hat … erfüllt
  rationale: Das Piel von מלא bedeutet „füllen, erfüllen“. Die Form wird parallel zum ersten Verb als vollendete Handlung wiedergegeben.
- source_word: טוֹב
  choice: mit Gutem
  rationale: Das substantivisch gebrauchte Singularwort bezeichnet das Gute beziehungsweise gute Gaben. „Mit Gutem“ bleibt nahe an der offenen hebräischen Formulierung.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: In beiden Vershälften mit „Seele“ wiedergegeben
  alternative: Mensch; Person; Leben; Selbst
  rationale: Die Wiederholung ist ein prägendes Element des hebräischen Parallelismus. „Seele“ erhält die poetische und theologische Resonanz, darf hier aber nicht dualistisch verengt werden; gemeint sein kann der ganze lebende Mensch.
- issue: Zeitbezug der beiden Perfektformen
  choice: 'Deutsches Perfekt: „hat … gesättigt“ und „hat … erfüllt“'
  alternative: 'Präsens als allgemeine Aussage: „sättigt“ und „erfüllt“'
  rationale: Der unmittelbare Kontext blickt auf Gottes konkrete Rettungstat zurück. Das Perfekt wahrt diesen Rückblick, ohne auszuschließen, dass der Satz eine allgemein gültige Aussage über Gottes Handeln trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst poetischer Parallelität. Die Verbindung „die dürstende Seele sättigen“ ist leicht markiert, bewahrt aber das hebräische Zusammenspiel von Durst, Hunger und Sättigung sowie die zweimalige Nennung von נֶפֶשׁ.
