    rationale: Die hebräische Konstruktion ist knapp und bildhaft; eine deutsche Wort-für-Wort-Wiedergabe mit „hinstellen“ verzerrt sie. Die Fußnote sollte stattdessen die wörtliche Struktur benennen und die Deutung des Vergleichs erläutern.
