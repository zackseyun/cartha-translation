  text: וַ/יְשַׂגֵּ֣ב אֶבְי֣וֹן מֵ/ע֑וֹנִי וַ/יָּ֥שֶׂם כַּ֝/צֹּ֗אן מִשְׁפָּחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: de
  text: Doch den Bedürftigen setzt er hoch, fern vom Elend, und macht die Familien zahlreich wie eine Herde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und setzt Familien wie eine Herde“. Der Vergleich kann das Anwachsen oder die Vermehrung der Familien ausdrücken.'
    reason: Die knappe hebräische Bildsprache wird transparent gemacht, ohne eine unidiomatische deutsche Wort-für-Wort-Formulierung in den Haupttext zu übernehmen.
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: bringt ... in Sicherheit
  rationale: שׂגב bezeichnet das Versetzen an einen hohen, geschützten Ort. Im Deutschen gibt „in Sicherheit bringen“ den Schutzsinn natürlich wieder, ohne eine gesellschaftliche Erhöhung nahezulegen.
- source_word: אֶבְיוֹן
  choice: den Bedürftigen
  rationale: אֶבְיוֹן bezeichnet einen Menschen in Not oder Armut. „Der Bedürftige“ bewahrt die Singularform und lässt die Art der Bedürftigkeit offen.
- source_word: מֵעֹנִי
  choice: aus dem Elend
  rationale: Die Präposition מִן markiert die Entfernung aus einem Zustand; עֹנִי kann Elend, Not, Bedrängnis oder Armut bezeichnen. „Aus dem Elend“ ist hier weit genug und idiomatisch.
- source_word: וַיָּשֶׂם
  choice: macht
  rationale: שׂים bedeutet grundsätzlich „setzen, stellen, machen“. Mit dem Vergleich und „Familien“ gibt „macht ... zahlreich wie“ die hier naheliegende Wirkung verständlich wieder.
- source_word: כַּצֹּאן
  choice: wie eine Herde
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Wie eine Herde“ bewahrt das pastorale Bild.
- source_word: מִשְׁפָּחוֹת
  choice: die Familien
  rationale: Der hebräische Plural steht ohne Possessivsuffix. „Die Familien“ bewahrt diese Form und vermeidet, eine nicht ausdrücklich bezeichnete Zugehörigkeit in den Haupttext einzutragen.
theological_decisions:
- issue: Beziehung der „Familien“ zum Bedürftigen
  choice: die Familien
  alternative: seine Familien / ihre Familien
  rationale: Der hebräische Text enthält kein Possessivpronomen. Der Zusammenhang kann eine Zugehörigkeit zum Bedürftigen nahelegen, doch der Haupttext lässt die grammatische Offenheit bestehen.
- issue: Sinn des Vergleichs „wie eine Herde“
  choice: macht die Familien zahlreich wie eine Herde
  alternative: stellt Familien wie eine Herde hin
  rationale: Im Kontext der Umkehr von Not zu Segen liegt Vermehrung nahe. Da das Verb selbst allgemein „setzen/machen“ bedeutet, wird die wörtlichere Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, bewahrt das Herdenbild und markiert die echte lexikalisch-syntaktische Offenheit durch eine Fußnote.
