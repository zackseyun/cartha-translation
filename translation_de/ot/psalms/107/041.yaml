  source_fidelity: Der Entwurf gibt אֶבְיוֹן, מֵעֳנִי und das Bild von משפחות „wie eine Herde“ im Wesentlichen zutreffend wieder. „In Sicherheit bringen“ trifft zwar den Schutzaspekt von וַיְשַׂגֵּב, lässt jedoch das Bild des Erhöhens bzw. Hochsetzens aus. Die revidierte Fassung bewahrt beide Aspekte, ohne den Sinn auf bloß sozialen Aufstieg zu verengen.
  naturalness: „Doch den Bedürftigen setzt er hoch, fern vom Elend“ ist modernes, poetisch angemessenes Standarddeutsch. „Macht die Familien zahlreich wie eine Herde“ ist idiomatisch und erschließt die im Vergleich naheliegende Vorstellung von Wachstum bzw. Vermehrung.
  terminology: „Bedürftigen“, „Elend“, „Familien“ und „Herde“ sind sachgerecht. Das nicht im Hebräischen ausgedrückte Possessivpronomen wird weiterhin nicht ergänzt. Die Fußnote vermeidet die unidiomatische und missverständliche Formulierung „stellt ... hin“.
