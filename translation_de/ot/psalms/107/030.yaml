  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: de
  text: Da freuten sie sich, weil es still geworden war[a], und er führte sie zu ihrem ersehnten Hafen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht ein Verb im Plural: „sie wurden still“. Gemeint sind wahrscheinlich die Wellen oder das Wasser; auch möglich: „weil die Wellen sich legten“ beziehungsweise „weil das Wasser ruhig wurde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zielort“; je nach Kontext auch „Anlegeplatz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Da freuten sie sich
  rationale: שׂמח bezeichnet Freude. „Da“ gibt die fortschreitende Erzählfolge des Wayyiqtol natürlich wieder.
- source_word: כִּי
  choice: weil
  rationale: כִּי führt hier den Grund ihrer Freude ein; „weil“ macht diesen Zusammenhang im Deutschen klar.
- source_word: יִשְׁתֹּקוּ
  choice: sie still wurden
  rationale: שׁתק bedeutet „still sein/werden“. Das nicht ausdrücklich genannte Bezugswort bleibt durch „sie“ offen; im Zusammenhang sind wahrscheinlich die Wellen beziehungsweise Wasser gemeint.
- source_word: וַיַּנְחֵם
  choice: und er führte sie
  rationale: נחה bedeutet „führen, leiten“. Das unausgesprochene maskuline Subjekt ist im Kontext Gott.
- source_word: מְחוֹז
  choice: Hafen
  rationale: Das seltene Substantiv bezeichnet hier im Seefahrtskontext den Ziel- oder Ankunftsort; „Hafen“ ist klar und bildgerecht.
- source_word: חֶפְצָם
  choice: ihrem ersehnten
  rationale: Die Form bezeichnet ihr Begehren oder Verlangen. „Ersehnt“ bringt den gewünschten Zielort idiomatisch zum Ausdruck.
theological_decisions:
- issue: Unausgesprochenes göttliches Subjekt von וַיַּנְחֵם
  choice: „er“ bleibt als Subjekt stehen und verweist im Kontext auf Gott.
  alternative: 'Passivisch: „sie wurden geführt“.'
  rationale: Die hebräische Verbform hat ein Subjekt in der dritten Person Singular. Der Zusammenhang identifiziert Gott als Handelnden, ohne dass sein Name in diesem Vers wiederholt wird.
- issue: Unausgesprochenes Subjekt von יִשְׁתֹּקוּ
  choice: Das Pronomen „sie“ bewahrt die formale Mehrdeutigkeit.
  alternative: 'Explizit: „die Wellen wurden still“ oder „das Wasser wurde ruhig“.'
  rationale: Im Hebräischen steht kein Substantiv als ausdrückliches Subjekt. Der Kontext legt Wellen oder Wasser nahe, doch die Übersetzung soll diese Deutung nicht unmarkiert in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Erzählweise bleibt erhalten; die Mehrdeutigkeit des unausgesprochenen Subjekts bei „still wurden“ wird im Haupttext bewahrt und in der Fußnote erläutert.
