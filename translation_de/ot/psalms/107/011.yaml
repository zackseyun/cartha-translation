id: PSA.107.11
reference: Psalms 107:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי הִמְר֥וּ אִמְרֵי אֵ֑ל וַ/עֲצַ֖ת עֶלְי֣וֹן נָאָֽצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: de
  text: Denn sie lehnten sich gegen Gottes Worte auf und verachteten den Rat des Höchsten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Denn sie widersetzten sich den Worten Gottes und verschmähten den Rat des Höchsten.'
    reason: Lexikalische Alternative für הִמְרוּ und נָאָצוּ; sie hebt Widerstand und geringschätzige Zurückweisung stärker hervor.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet den zuvor beschriebenen Zustand beziehungsweise das Gericht. „Denn“ wahrt den erklärenden Zusammenhang und passt zum gehobenen poetischen Stil.
- source_word: הִמְרוּ
  choice: lehnten sich … auf
  rationale: Das Verb מרה bezeichnet rebellischen Widerstand oder Ungehorsam. „Sich gegen … auflehnen“ gibt sowohl die aktive Auflehnung als auch den Beziehungsbruch natürlich wieder.
- source_word: אִמְרֵי
  choice: Worte
  rationale: Der Konstruktplural von אִמְרָה bezeichnet Äußerungen oder Worte. „Worte“ ist im Deutschen klar, natürlich und weit genug, um Gottes Reden allgemein zu bezeichnen.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier eine übliche Gottesbezeichnung. „Gott“ ist die klare, unmarkierte deutsche Wiedergabe.
- source_word: וַעֲצַת
  choice: und den Rat
  rationale: עֵצָה kann Rat, Plan oder Absicht bedeuten. „Rat“ bewahrt die mögliche Bedeutung göttlicher Weisung, ohne ein festes Dekret vorauszusetzen.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: „Der Höchste“ ist die etablierte und inhaltlich präzise Wiedergabe dieses göttlichen Titels.
- source_word: נָאָצוּ
  choice: verachteten
  rationale: נאץ bezeichnet Verachtung oder geringschätzige Zurückweisung. „Verachteten“ bringt die starke ablehnende Haltung knapp und idiomatisch zum Ausdruck.
theological_decisions:
- issue: Wiedergabe der parallelen Gottesbezeichnungen אֵל und עֶלְיוֹן
  choice: Gott … der Höchste
  alternative: der Mächtige … der Erhabene
  rationale: Die beiden unterschiedlichen Gottesbezeichnungen bleiben erkennbar, ohne zusätzliche dogmatische Nuancen einzutragen. „Gott“ und „der Höchste“ sind zugleich verständlich und würdevoll.
- issue: Bedeutungsumfang von עֵצָה
  choice: Rat
  alternative: Plan oder Absicht
  rationale: „Rat“ lässt offen, ob vor allem Gottes Weisung, sein Vorhaben oder sein Ratschluss gemeint ist, und bewahrt dadurch die semantische Spannung des hebräischen Ausdrucks.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, psalmengemäßem Ton. Die Satzstruktur folgt dem hebräischen Parallelismus, bleibt aber natürlich und unmittelbar verständlich.
