  text: יָשֵׂ֣ם מִ֭דְבָּר לַֽ/אֲגַם מַ֑יִם וְ/אֶ֥רֶץ צִ֝יָּ֗ה לְ/מֹצָ֥אֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/035.yaml
  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: de
  text: Er verwandelt die Wüste in einen Wasserteich[a] und dürres Land in Wasserquellen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einen Wassersee“; das hebräische Wort kann einen Teich, ein stehendes Gewässer oder ein Sumpfgebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in Austrittsorte des Wassers“; gemeint sind Quellen oder andere Stellen, an denen Wasser hervortritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: Er verwandelt
  rationale: שׂים bedeutet grundsätzlich „setzen, hinstellen, machen“. In der Gegenüberstellung zweier Zustände gibt „verwandelt“ den poetischen Sinn einer bewirkten Veränderung natürlich wieder.
- source_word: מִדְבָּר
  choice: die Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Land und kann je nach Zusammenhang „Wüste“ oder „Wildnis“ bedeuten. „Wüste“ bildet hier den klaren Gegensatz zum Wasserteich.
- source_word: לַאֲגַם מַיִם
  choice: in einen Wasserteich
  rationale: אֲגַם bezeichnet ein stehendes Gewässer, teils auch einen Sumpf oder Schilfteich. „Wasserteich“ bewahrt das konkrete poetische Bild.
- source_word: וְאֶרֶץ צִיָּה
  choice: und dürres Land
  rationale: צִיָּה bezeichnet ausgetrocknetes beziehungsweise dürres Gelände. Die knappe Wiedergabe erhält die Parallelität des Verses.
- source_word: לְמֹצָאֵי מָיִם
  choice: in Wasserquellen
  rationale: מוֹצָא bezeichnet einen Ausgang oder Ursprungsort; auf Wasser bezogen sind damit Stellen gemeint, an denen Wasser hervortritt. „Wasserquellen“ ist eine natürliche und bildgetreue Wiedergabe des hebräischen Plurals.
theological_decisions: []
