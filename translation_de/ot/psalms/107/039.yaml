base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/039.yaml
  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: de
  text: Dann wurden sie weniger und sanken nieder durch Bedrängnis, Unheil und Kummer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann nahmen sie ab und wurden durch Zwang, Unglück und Trauer gebeugt.“'
    reason: Lexikalische Alternativen für die Abnahme, das Gebeugtwerden sowie für עֹצֶר, רָעָה und יָגוֹן; „durch“ gibt die wahrscheinliche ursächliche Bedeutung von מִן wieder.
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: wurden sie weniger
  rationale: Das Qal-Verb von מעט bezeichnet hier eine Abnahme, besonders ein Wenigerwerden an Zahl oder Stärke. Die deutsche Formulierung bleibt nah am hebräischen Ausdruck, ohne eine ausdrücklich passive Ursache einzutragen.
- source_word: וַיָּשֹׁחוּ
  choice: sanken nieder
  rationale: Das Verb שחח beschreibt ein Niedersinken oder Gebeugtwerden. „Sanken nieder“ bewahrt sowohl die bildhafte als auch die übertragene Bedeutung.
- source_word: מֵעֹצֶר
  choice: unter Bedrängnis
  rationale: עֹצֶר bezeichnet Einengung, Zwang oder Bedrückung. Die Präposition מִן kann hier ursächlich verstanden werden; „unter“ gibt im Deutschen den belastenden Zustand natürlich wieder.
- source_word: רָעָה
  choice: Unheil
  rationale: רָעָה bezeichnet im Kontext widrige Not oder Unglück, nicht zwingend moralische Bosheit. „Unheil“ erhält diese Bedeutungsbreite und passt zum poetischen Register.
- source_word: וְיָגוֹן
  choice: und Kummer
  rationale: יָגוֹן bezeichnet seelischen Schmerz, Trauer oder Kummer. „Kummer“ ist verständlich, würdig und bildet die emotionale Zuspitzung der Dreierreihe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Rhythmus. Die Übersetzung wahrt die knappe hebräische Satzstruktur und lässt offen, ob das Niedersinken körperlich, gesellschaftlich oder innerlich zu verstehen ist.
