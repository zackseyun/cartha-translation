  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: de
  text: Da schrien sie in ihrer Not zu Jahwe, und er führte sie aus ihren Bedrängnissen heraus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Da schrien sie
  rationale: Das Narrativ-Waw führt die Abfolge weiter; „Da“ gibt den wiederkehrenden Erzählrhythmus von Psalm 107 natürlich wieder. „schrien“ bezeichnet hier einen dringenden Hilferuf.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bezeichnet die Richtung des Hilferufs. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּצַּר לָהֶם
  choice: in ihrer Not
  rationale: Die Wendung bezeichnet die bedrängende Lage, in der sie sich befinden; „in ihrer Not“ ist im Deutschen prägnant und idiomatisch.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: aus ihren Bedrängnissen
  rationale: מְצוּקוֹת bezeichnet Bedrängnisse oder bedrückende Zwangslagen. Der Plural bleibt erhalten, und „aus“ gibt die mit מן bezeichnete Herausbewegung wieder.
- source_word: יוֹצִיאֵם
  choice: er führte sie … heraus
  rationale: Der Hifil von יצא bedeutet wörtlich, jemanden hinauszuführen bzw. herauszubringen. Die konkrete räumliche Bildsprache bleibt so erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die parallelen Ausdrücke „Not“ und „Bedrängnisse“ sowie das konkrete Bild des Herausführens werden bewahrt.
