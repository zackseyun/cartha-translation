  yaml_path: translation/ot/psalms/107/018.yaml
  text: Their soul loathed all food[a], and they drew near to the gates of death.
translation:
  language: de
  text: Ihre Seele verabscheute jede Speise[a], und sie kamen bis an die Tore des Todes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Sie ekelten sich vor jeder Speise.“ Das hebräische Wort für „Seele“ (נֶפֶשׁ) kann je nach Zusammenhang das innere Selbst, das Leben oder – wie hier möglicherweise – den Appetit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: jede Speise
  rationale: כָּל mit אֹכֶל bezeichnet Nahrung umfassend. „Jede Speise“ bewahrt die Gesamtheit und passt zum gehobenen poetischen Register.
- source_word: תְּתַעֵב
  choice: verabscheute
  rationale: Der Piel von תעב drückt starke Abneigung oder Ekel aus. „Verabscheute“ gibt diese Intensität würdig und verständlich wieder.
- source_word: נַפְשָׁם
  choice: ihre Seele
  rationale: נֶפֶשׁ kann die Person, das Leben oder hier auch den Appetit bezeichnen. „Ihre Seele“ bewahrt das hebräische Menschenbild und lässt die kontextuelle Bedeutungsweite offen.
- source_word: וַיַּגִּיעוּ עַד
  choice: sie kamen bis an
  rationale: נגע im Hifil mit עַד beschreibt das Gelangen bis an eine Grenze. Die Formulierung erhält sowohl die räumliche Metapher als auch die unmittelbare Todesnähe.
- source_word: שַׁעֲרֵי מָוֶת
  choice: die Tore des Todes
  rationale: Die wörtliche Metapher bezeichnet die Schwelle zum Tod. „Tore des Todes“ bildet den hebräischen Ausdruck direkt ab, ohne einen nicht genannten Begriff wie Scheol einzuführen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang schwerer Krankheit
  choice: ihre Seele
  alternative: sie; ihr Appetit; ihr Leben
  rationale: Obwohl der Zusammenhang körperliche Krankheit und Nahrungsverweigerung beschreibt, steht im Hebräischen ausdrücklich נֶפֶשׁ. Die Hauptübersetzung bewahrt diese anthropologische Ausdrucksweise; die Fußnote weist auf die mögliche Bedeutung „Appetit“ und eine idiomatische Wiedergabe hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. „Speise“ trägt den poetischen Ton, ohne veraltet zu wirken; „bis an die Tore des Todes“ erhält das eindringliche Schwellenbild.
