review_pass:
  verdict: revise
  source_fidelity: Die kausative Wiedergabe von וַיּוֹשֶׁב durch „ließ ... wohnen“ trifft den hebräischen Hifil gut. „Dort“, „die Hungrigen“ und das anaphorische „er“ sind ebenfalls quellentreu. Für וַיְכוֹנְנוּ ist „gründeten“ im Zusammenhang mit einer Stadt eine treffende, idiomatische Wiedergabe von „errichteten/etablierten“. Die bisherige Fassung „eine Stadt als Wohnort“ gibt עִיר מוֹשָׁב zwar annähernd wieder, klingt aber semantisch und stilistisch unnötig schwerfällig.
  naturalness: „Dort ließ er die Hungrigen wohnen“ ist modernes, würdiges Standarddeutsch. „Sie gründeten eine Stadt, um dort zu wohnen“ ist deutlich natürlicher als „sie errichteten eine Stadt als Wohnort“ und bewahrt die Ziel- bzw. Bestimmungsangabe der hebräischen Konstruktion.
  terminology: „Stadt“ entspricht עִיר. „Hungrige“ ist als substantiviertes Adjektiv angemessen. Die Fußnotenalternative „eine Stadt als Wohnsitz“ hält eine engere nominale Wiedergabe von עִיר מוֹשָׁב fest, ohne eine übermäßige Bedeutungsfestlegung vorzunehmen.
  issues:
  - severity: low
    issue: Die Wendung „eine Stadt als Wohnort“ ist im Deutschen stilistisch und semantisch unidiomatisch.
    rationale: Ein Wohnort ist gewöhnlich der Ort, an dem jemand wohnt; die Wendung benennt daher die Funktion einer Stadt redundant und weniger klar als eine Zweckformulierung. Die hebräische Konstruktverbindung lässt sich natürlich als „eine Stadt, um dort zu wohnen“ ausdrücken.
  revised_text: Dort ließ er die Hungrigen wohnen, und sie gründeten eine Stadt, um dort zu wohnen.[a]
  revised_footnotes:
