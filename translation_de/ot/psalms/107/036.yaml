  text: וַ/יּ֣וֹשֶׁב שָׁ֣ם רְעֵבִ֑ים וַ֝/יְכוֹנְנ֗וּ עִ֣יר מוֹשָֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/036.yaml
  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: de
  text: Dort ließ er die Hungrigen wohnen, und sie gründeten eine Stadt, um dort zu wohnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Stadt als Wohnsitz“.'
    reason: Lexikalisch-syntaktische Alternative für עִיר מוֹשָׁב; die hebräische Konstruktverbindung kann nominal als eine Stadt verstanden werden, die als Wohn- bzw. Siedlungsort dient.
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: ließ er … wohnen
  rationale: 'Der Hifil von ישׁב ist kausativ: Er lässt Menschen wohnen beziehungsweise siedelt sie an. Die gewählte Form ist im Deutschen natürlich und bleibt nahe an der hebräischen Konstruktion.'
- source_word: שָׁם
  choice: dort
  rationale: Direkte und idiomatische Wiedergabe des Ortsadverbs.
- source_word: רְעֵבִים
  choice: die Hungrigen
  rationale: Das Adjektiv wird substantivisch gebraucht und bezeichnet kollektiv Menschen, die Hunger leiden.
- source_word: וַיְכוֹנְנוּ
  choice: sie errichteten
  rationale: כון bezeichnet in dieser Stammform das feste Einrichten oder Etablieren. Bei einer Stadt gibt „errichteten“ den Sinn natürlich wieder, ohne zwingend den engeren Gründungsakt hervorzuheben.
- source_word: עִיר
  choice: eine Stadt
  rationale: Dies entspricht der üblichen Bedeutung des hebräischen Wortes, auch wenn keine moderne Großstadt gemeint sein muss.
- source_word: מוֹשָׁב
  choice: als Wohnort
  rationale: Das Substantiv bezeichnet Wohnen, Wohnsitz oder Aufenthaltsort. Im Konstrukt עִיר מוֹשָׁב drückt „eine Stadt als Wohnort“ die Funktion der Stadt klar und knapp aus.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Singularverbs וַיּוֹשֶׁב
  choice: Das im Kontext vorausgesetzte Subjekt Gott wird entsprechend dem Hebräischen nur mit „er“ wiedergegeben.
  alternative: 'Unpersönlich oder mit unbestimmtem Subjekt: „man ließ … wohnen“; alternativ könnte „Gott“ ausdrücklich genannt werden.'
  rationale: Im Zusammenhang des Psalms bleibt der HERR der Handelnde. „Er“ bewahrt jedoch die Ausdrucksweise des Verses und fügt keinen dort ausdrücklich stehenden Gottesnamen ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausative Aussage und der Wechsel vom göttlichen Handeln zum Handeln der Angesiedelten bleiben erhalten. Der Fußnotenmarker steht bei der Wendung, auf die sich die Variante tatsächlich bezieht.
