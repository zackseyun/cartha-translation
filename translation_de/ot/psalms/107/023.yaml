  text: יוֹרְדֵ֣י הַ֭/יָּם בָּ/אֳנִיּ֑וֹת עֹשֵׂ֥י מְ֝לָאכָ֗ה בְּ/מַ֣יִם רַבִּֽים׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/023.yaml
  text: Those who go down to the sea in ships[a], doing business on great waters—
translation:
  language: de
  text: 'Die in Schiffen aufs Meer hinausfahren,

    die auf großen Wassern ihrer Arbeit nachgehen[a] –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die auf weiten Wassern Handel treiben«. Das Hebräische kann allgemein Arbeit oder berufliche Tätigkeit, in diesem Zusammenhang aber auch Seehandel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: die … hinausfahren
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet eine Gruppe von Menschen. Im Deutschen gibt »die … hinausfahren« den Vorgang natürlich wieder; »hinabfahren« wäre formaler, klingt hier jedoch weniger idiomatisch.
- source_word: הַיָּם
  choice: aufs Meer
  rationale: Das bestimmte Substantiv bezeichnet hier allgemein das Meer; in Verbindung mit dem Bewegungsverb ist »aufs Meer hinausfahren« natürliches modernes Deutsch.
- source_word: בָּאֳנִיּוֹת
  choice: in Schiffen
  rationale: Die Präposition בְּ mit dem Plural »Schiffe« bezeichnet das Verkehrsmittel beziehungsweise den Aufenthaltsort und wird direkt mit »in Schiffen« wiedergegeben.
- source_word: עֹשֵׂי מְלָאכָה
  choice: ihrer Arbeit nachgehen
  rationale: Die Verbindung aus dem Partizip von עשה und מְלָאכָה bezeichnet ausgeübte Arbeit oder berufliche Tätigkeit. Die Formulierung bleibt bewusst weiter als »Handel treiben«.
- source_word: בְּמַיִם רַבִּים
  choice: auf großen Wassern
  rationale: Die poetische Wendung bezeichnet die weiten beziehungsweise mächtigen Wasser des offenen Meeres. »Auf großen Wassern« bewahrt Bild und Mehrdeutigkeit des Hebräischen.
