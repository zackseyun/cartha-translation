  naturalness: „Er führte sie auf einem geraden Weg, damit sie zu einer Stadt kamen“ ist verständlich, aber im Deutschen stilistisch etwas schwerfällig, weil der Zweck mit einem Präteritum im Nebensatz formuliert wird. „… um zu einer Stadt zu gelangen, in der sie wohnen konnten“ ist natürlich und erhält die Zweckbeziehung.
  terminology: „gerader Weg“ ist im konkreten Reisebild angemessen. „Stadt“ für עִיר ist passend. „Wohnstadt“ wäre zwar kompakt, klingt im heutigen Standarddeutsch jedoch ungewohnt; die Umschreibung „eine Stadt zum Wohnen“ gibt die Konstruktion ohne zusätzliche theologische oder modale Deutung wieder.
