lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: Er führte sie
  rationale: Die Hifil-Form von דרך bedeutet, jemanden zu führen oder auf einem Weg zu leiten. „Er führte sie“ gibt den kausativen Sinn natürlich wieder.
- source_word: בְּדֶרֶךְ יְשָׁרָה
  choice: auf einem geraden Weg
  rationale: דֶּרֶךְ bezeichnet Weg, Straße oder Pfad; יָשָׁר bedeutet hier im konkreten Reisekontext „gerade“. Die Präposition ב wird idiomatisch mit „auf“ wiedergegeben.
- source_word: לָלֶכֶת אֶל
  choice: damit sie … kamen
  rationale: Der Infinitiv mit ל bezeichnet Ziel oder Zweck. Im Deutschen stellt „damit sie … kamen“ den Zielgedanken natürlich dar, ohne ein schwerfälliges „um zu einer Stadt zu gehen“.
- source_word: עִיר מוֹשָׁב
  choice: eine Stadt, in der sie wohnen konnten
  rationale: Die Constructusverbindung bedeutet formal „Stadt des Wohnens/der Wohnstätte“ und bezeichnet eine bewohnbare Stadt beziehungsweise einen Ort zum Wohnen. Die gewählte Formulierung ist verständlich und bewahrt den Zielgedanken.
