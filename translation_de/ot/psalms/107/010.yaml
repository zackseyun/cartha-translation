  text: Some sat in darkness and deep shadow[a], prisoners in affliction and irons,
translation:
  language: de
  text: Einige saßen in Finsternis und tiefem Dunkel[a], gefangen in Elend und Eisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
