lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: Einige saßen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die sitzen oder sich an einem Ort beziehungsweise in einer Lage befinden. Die finite Form klingt im Deutschen natürlich und fügt sich in die Darstellung verschiedener Gruppen innerhalb des Psalms ein.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Die übliche und poetisch angemessene Wiedergabe bezeichnet wörtliche oder bildliche Dunkelheit.
- source_word: צַלְמָוֶת
  choice: tiefes Dunkel
  rationale: Das Wort bezeichnet wahrscheinlich dichte, bedrückende Dunkelheit. Diese Wiedergabe bewahrt die poetische Intensität, ohne den Tod ausdrücklich in den Haupttext einzutragen.
- source_word: אֲסִירֵי
  choice: gefangen
  rationale: Die Konstruktform bezeichnet Gebundene oder Gefangene. Als prädikative Form ist „gefangen“ im deutschen Satz natürlich und erhält das Bild der Haft.
- source_word: עֳנִי
  choice: Elend
  rationale: Das Substantiv kann Bedrängnis, Elend oder Armut bezeichnen. „Elend“ wahrt hier die breite Bedeutung einer leidvollen Lage.
- source_word: בַרְזֶל
  choice: Eisen
  rationale: Der hebräische Singular bezeichnet metonymisch eiserne Fesseln. Das knappe „Eisen“ bewahrt die markante Bildsprache des Originals, ohne das nicht ausdrücklich genannte Wort „Fesseln“ in den Haupttext einzufügen.
