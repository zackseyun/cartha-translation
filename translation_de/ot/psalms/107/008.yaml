  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: de
  text: Sie sollen Jahwe für seine beständige Liebe danken und für seine Wundertaten für die Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּ
  choice: Sie sollen danken
  rationale: Der Hifil von ידה bezeichnet in diesem wiederkehrenden Psalmrefrain das Danken beziehungsweise dankbare Preisen. Die deutsche Aufforderung gibt den jussivischen Sinn natürlich wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Präposition ל kennzeichnet den Empfänger des Dankes.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד umfasst verlässliche Güte, Loyalität und bleibende Liebe. „Beständige Liebe“ bewahrt diese Dauerhaftigkeit, ohne den Ausdruck vorschnell auf einen einzelnen theologischen Fachbegriff festzulegen.
- source_word: וְנִפְלְאוֹתָיו
  choice: und für seine Wundertaten
  rationale: נִפְלָאוֹת bezeichnet außergewöhnliche, staunenswerte Taten. Das wiederholte „für“ verdeutlicht im Deutschen die Koordination mit „für seine beständige Liebe“.
- source_word: לִבְנֵי אָדָם
  choice: an den Menschen
  rationale: Die hebräische Wendung „Söhne/Kinder Adams“ ist eine geläufige kollektive Bezeichnung für Menschen. „An den Menschen“ gibt ihre Bedeutung idiomatisch wieder und lässt zugleich erkennen, dass Gottes Taten ihnen gelten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und folgt der vorgegebenen Entscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בני אדם
  choice: den Menschen
  alternative: den Menschenkindern; den Kindern Adams
  rationale: Die Wendung meint die Menschheit beziehungsweise Menschen allgemein. Eine wörtliche Wiedergabe wäre im heutigen Deutsch auffällig und könnte fälschlich auf leibliche Nachkommen oder Kinder im Altersinn eingeengt werden; die idiomatische Fassung wahrt den generischen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur des hebräischen Refrains bleibt durch die zweimalige Präposition „für“ hörbar; „Wundertaten“ erhält den aktiven Charakter der göttlichen Werke.
