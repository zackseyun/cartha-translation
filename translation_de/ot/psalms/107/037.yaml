lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: sie besäten Felder
  rationale: זרע bezeichnet das Säen; mit שׂדות ist „Felder besäen“ im Deutschen natürlicher als die formal mögliche Verbindung „Felder säen“.
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: und pflanzten Weinberge
  rationale: נטע bezeichnet hier das Anpflanzen, und כרמים meint Weinberge als Anlagen, nicht nur einzelne Weinstöcke.
- source_word: וַיַּעֲשׂוּ פְּרִי תְבוּאָה
  choice: sie brachten reiche Ernte ein
  rationale: Die wörtliche Verbindung „Frucht des Ertrags“ klingt im Deutschen unnatürlich. Die idiomatische Wiedergabe drückt aus, dass die angelegten Felder und Weinberge Ertrag hervorbrachten; die ungewöhnliche hebräische Formulierung wird in der Fußnote dokumentiert.
