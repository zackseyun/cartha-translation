  text: אָג֣וּרָה בְ֭/אָהָלְ/ךָ עוֹלָמִ֑ים אֶֽחֱסֶ֨ה בְ/סֵ֖תֶר כְּנָפֶ֣י/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/004.yaml
  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: de
  text: Lass mich für immer in deinem Zelt wohnen[a]; lass mich im Schutz deiner Flügel Zuflucht finden. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich will für immer in deinem Zelt wohnen“ oder „Möge ich für immer in deinem Zelt wohnen“. Die hebräische Verbform kann einen starken Wunsch oder einen festen Entschluss ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָג֣וּרָה
  choice: Lass mich … wohnen
  rationale: Der Qal-Kohortativ der 1. Person Singular drückt hier einen nachdrücklichen Wunsch oder eine Selbstverpflichtung aus. Die Gebetsform „Lass mich“ gibt die volitive Nuance im Deutschen natürlich wieder.
- source_word: בְ֭/אָהָלְ/ךָ
  choice: in deinem Zelt
  rationale: אָהֶל bezeichnet konkret ein Zelt. Im Psalm kann das Bild zugleich an Gottes Heiligtum und Gegenwart erinnern; „Zelt“ bewahrt diese Bildsprache, ohne sie vorschnell als „Tempel“ auszulegen.
- source_word: עוֹלָמִ֑ים
  choice: für immer
  rationale: Die Pluralform von עוֹלָם verstärkt die Vorstellung unbegrenzter Dauer. „Für immer“ ist im modernen Deutschen klar und idiomatisch.
- source_word: אֶֽחֱסֶ֨ה
  choice: lass mich … Zuflucht finden
  rationale: חסה bedeutet, Zuflucht oder Schutz zu suchen. Im Parallelismus mit dem vorausgehenden Kohortativ wird auch der Imperfekt am besten volitiv verstanden.
- source_word: בְ/סֵ֖תֶר
  choice: im Schutz
  rationale: סֵתֶר bezeichnet einen verborgenen, schützenden Ort. „Schutz“ vermittelt in diesem Zusammenhang die Schutzfunktion natürlich, während das Flügelbild erhalten bleibt.
- source_word: כְּנָפֶ֣י/ךָ
  choice: deiner Flügel
  rationale: Die wörtliche Bildsprache „deine Flügel“ wird bewahrt; zusammen mit „im Schutz“ ergibt sich eine natürliche deutsche Formulierung.
- source_word: סֶּֽלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des hebräischen liturgischen oder musikalischen Ausdrucks unsicher sind, wird er transliteriert und nicht deutend übersetzt.
theological_decisions:
- issue: Das Bild von Gottes Zelt
  choice: Die konkrete Metapher „dein Zelt“ bleibt stehen.
  alternative: dein Heiligtum / deine Wohnstätte
  rationale: Das Zelt kann Gottes Heiligtum und Gegenwart evozieren, doch der hebräische Text legt die genauere Deutung nicht ausdrücklich fest. Die konkrete Metapher bewahrt diese Offenheit.
- issue: Wunsch oder Entschluss des Beters
  choice: Die Hauptübersetzung gibt die Aussage als Bitte wieder.
  alternative: „Ich will für immer in deinem Zelt wohnen“ oder „Möge ich für immer in deinem Zelt wohnen“
  rationale: Der Kohortativ kann sowohl einen starken Wunsch als auch einen festen Entschluss ausdrücken. Im Gebetszusammenhang ist die Bitte natürlich, doch die Fußnote hält die genuine Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetston. Die konkreten Bilder „Zelt“ und „Flügel“ bleiben erhalten; „Sela“ wird wegen seiner unsicheren Bedeutung unübersetzt übernommen.
