  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְסֶה
  choice: Zuflucht
  rationale: Gibt den Schutz- und Zufluchtsgedanken des hebräischen Substantivs natürlich und präzise wieder.
- source_word: מִגְדַּל עֹז
  choice: ein starker Turm
  rationale: Die Verbindung bezeichnet einen Turm, der Stärke und Sicherheit bietet; »ein starker Turm« ist im modernen Deutsch klar und bewahrt das Bild.
- source_word: מִפְּנֵי אוֹיֵב
  choice: gegen den Feind
  rationale: מִפְּנֵי kann Schutz beziehungsweise Abwehr angesichts des Feindes ausdrücken. »gegen den Feind« bewahrt hier die defensive Schutzfunktion des Turms und entspricht dem Parallelismus.
