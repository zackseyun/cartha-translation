  text: כֵּ֤ן אֲזַמְּרָ֣ה שִׁמְ/ךָ֣ לָ/עַ֑ד לְֽ/שַׁלְּמִ֥/י נְדָרַ֗/י י֣וֹם יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/008.yaml
  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: de
  text: So will ich deinem Namen für immer lobsingen, um Tag für Tag meine Gelübde zu erfüllen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um Tag für Tag meine Gelübde zu bezahlen“ oder „… einzulösen“. Das hebräische Verb kann bei Gelübden „bezahlen“ oder allgemeiner „erfüllen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Die Partikel zieht aus dem vorausgehenden Gebet und Vertrauen eine Folgerung beziehungsweise bringt einen Entschluss zum Ausdruck.
- source_word: אֲזַמְּרָה
  choice: will ich … lobsingen
  rationale: Das Piel von זמר bezeichnet im Psalter häufig musikalisches Singen zum Lob Gottes; „lobsingen“ ist würdevoll, verständlich und knapp.
- source_word: שִׁמְךָ
  choice: deinem Namen
  rationale: Die direkte hebräische Wendung bleibt erhalten; „Name“ kann dabei zugleich Gottes offenbartes Wesen und seinen Ruf einschließen.
- source_word: לָעַד
  choice: für immer
  rationale: Gibt die zeitlich unbegrenzte Dauer in natürlichem modernem Deutsch wieder.
- source_word: לְשַׁלְּמִי
  choice: meine Gelübde erfüllen
  rationale: שלם im Piel kann bei Gelübden „bezahlen“, „einlösen“ oder „erfüllen“ bedeuten. „Erfüllen“ vermittelt die Verpflichtung im Deutschen am natürlichsten.
- source_word: נְדָרַי
  choice: meine Gelübde
  rationale: Direkte und im religiösen Kontext geläufige Wiedergabe von נדר.
- source_word: יוֹם יוֹם
  choice: Tag für Tag
  rationale: Die Wiederholung bezeichnet regelmäßige, fortgesetzte Ausübung; „Tag für Tag“ bewahrt diese iterative Kraft idiomatisch.
theological_decisions:
- issue: Verhältnis von fortwährendem Lob und täglicher Gelübdeerfüllung
  choice: Beides wird durch „und“ als zusammengehöriger Entschluss wiedergegeben.
  alternative: 'Die zweite Zeile final auffassen: „um Tag für Tag meine Gelübde zu erfüllen“.'
  rationale: Das hebräische לְ kann eine Absicht ausdrücken; im Satz kann die Gelübdeerfüllung jedoch auch als parallel fortgesetzte Handlung verstanden werden. Die deutsche Koordination bleibt natürlich, ohne eine enge Zweckbeziehung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lobsingen“ erhält den poetischen und gottesdienstlichen Ton; „Tag für Tag“ ist klar und rhythmisch. Der Fußnotenmarker steht unmittelbar nach dem ganzen Vers, weil die Anmerkung die Wendung zur Gelübdeerfüllung erläutert.
