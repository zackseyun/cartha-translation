  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: de
  text: Füge den Tagen des Königs weitere Tage hinzu[a]; mögen seine Jahre von Generation zu Generation währen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst den Tagen des Königs weitere Tage hinzufügen.“ Die hebräische Verbform kann statt als Bitte auch als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „wie Generation und Generation“; gemeint ist eine Dauer über aufeinanderfolgende Generationen hinweg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: den Lebenstagen des Königs weitere Tage
  rationale: Die Wendung bedeutet wörtlich, den Tagen des Königs Tage hinzuzufügen. „Lebenstage“ macht im Deutschen den Bezug auf die Lebensdauer deutlich, während „weitere Tage“ das hebräische Bild und die Wiederholung bewahrt.
- source_word: תּוֹסִיף
  choice: Füge … hinzu
  rationale: Der Hifil von יסף bedeutet „hinzufügen, vermehren“. Im Gebetszusammenhang wird die Imperfektform als Bitte an Gott wiedergegeben; die mögliche Zukunftsaussage bleibt in der Fußnote erhalten.
- source_word: שְׁנוֹתָיו
  choice: seine Jahre
  rationale: Das maskuline Suffix bezieht sich am natürlichsten auf den König.
- source_word: כְּמוֹ דֹר וָדֹר
  choice: währen von Generation zu Generation
  rationale: Die Vergleichspartikel und die wiederholte Generationenformel beschreiben eine Dauer über aufeinanderfolgende Generationen hinweg. „Von Generation zu Generation“ ist eine natürliche, würdige deutsche Wiedergabe.
theological_decisions:
- issue: Bitte um langes Leben oder Zukunftsaussage
  choice: 'Als Bitte: „Füge … hinzu; mögen … währen“'
  alternative: 'Als Zukunftsaussage: „Du wirst … hinzufügen; seine Jahre werden … währen“'
  rationale: Die hebräische Imperfektform erlaubt beide Deutungen. Der Gebetszusammenhang legt die Bitte nahe, doch die grammatische Alternative wird nicht ausgeschlossen und deshalb in einer Fußnote genannt.
- issue: Reichweite der königlichen Lebensdauer
  choice: Die bildhafte Formulierung „von Generation zu Generation“ bleibt stehen
  alternative: Explizite Deutung als dynastische Dauer oder als ewiges Leben des einzelnen Königs
  rationale: Der Vers selbst löst die Spannung zwischen persönlicher Langlebigkeit und generationenübergreifender Königsherrschaft nicht ausdrücklich auf; die Übersetzung importiert daher keine bestimmte theologische Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebetsform wird durch den Imperativ und den Optativ mit „mögen“ natürlich ausgedrückt; das hebräische Bild von Tagen und Jahren sowie die Spannung der generationenübergreifenden Aussage bleiben erhalten.
