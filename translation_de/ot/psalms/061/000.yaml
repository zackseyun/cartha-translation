lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Der Ausdruck bezeichnet in den Psalmüberschriften wahrscheinlich den Verantwortlichen für die musikalische Aufführung. „Musikalischer Leiter“ ist modern, verständlich und weniger eng als „Chorleiter“.
- source_word: עַל
  choice: mit
  rationale: In diesem musikalischen Zusammenhang führt die Präposition wahrscheinlich die Art der Begleitung an. „Mit“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: נְגִינַת
  choice: Saitenbegleitung
  rationale: Das Substantiv bezeichnet hier wahrscheinlich Musik auf Saiteninstrumenten beziehungsweise deren Begleitung. „Saitenbegleitung“ bewahrt den musikalischen Sinn, ohne eine bestimmte Instrumentengruppe näher festzulegen.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe deutsche Überschrift gibt die traditionelle Verbindung mit David wieder. Da die hebräische Präposition Autorschaft, Zuordnung oder Widmung ausdrücken kann, wird die verbleibende Mehrdeutigkeit in der Fußnote ausdrücklich kenntlich gemacht.
theological_decisions:
- issue: Bedeutung des ל in der davidischen Überschrift
  choice: Von David
  alternative: Für David; David zugehörig
  rationale: Die Überschrift wird nicht als eindeutige Behauptung unmittelbarer davidischer Autorschaft ausgelegt. Die Fußnote hält die im Hebräischen mögliche Zuordnung oder Widmung offen.
translation_notes:
  register: Knappe, würdige Form einer Psalmüberschrift in modernem Standarddeutsch. „Musikalischer Leiter“ vermeidet das enger gefasste „Chorleiter“, während „Saitenbegleitung“ die wahrscheinliche Aufführungspraxis verständlich ausdrückt.
