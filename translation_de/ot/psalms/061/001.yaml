base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/001.yaml
  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: de
  text: Höre, Gott, meinen Hilferuf[a]; achte auf mein Gebet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen lauten Ruf“, „mein Flehen“ oder „meinen Jubelruf“. Das hebräische Wort kann einen laut erschallenden Ruf und in manchen Zusammenhängen auch einen Jubelruf oder Gesang bezeichnen; hier legt der Zusammenhang des Gebets einen dringlichen Hilferuf nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Höre
  rationale: Der Qal-Imperativ von שׁמע richtet sich unmittelbar an Gott. „Höre“ bewahrt das konkrete Bild des Hörens und entspricht natürlicher deutscher Gebetssprache.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede. Im Deutschen zeigt die Stellung zwischen den Satzgliedern die Anrede klar an; ein zusätzliches „o“ wäre möglich, klänge aber gehobener und weniger gegenwärtig.
- source_word: רִנָּתִי
  choice: meinen Hilferuf
  rationale: רִנָּה kann einen lauten oder hell erschallenden Ruf, Jubelruf oder Gesang bezeichnen. Im Zusammenhang mit „mein Gebet“ bezeichnet es hier am ehesten einen dringlichen Ruf an Gott. „Hilferuf“ macht diese kontextuelle Dringlichkeit natürlich verständlich, während die Fußnote die weitere Bedeutungsbreite offenhält.
- source_word: הַקְשִׁיבָה
  choice: achte auf
  rationale: Der Hiphil-Imperativ von קשׁב bittet um aufmerksames Hören. „Achte auf“ gibt diese gesteigerte Aufmerksamkeit wieder und vermeidet eine bloße Wiederholung von „höre“.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: תְּפִלָּה ist die übliche Bezeichnung für ein Gebet. Die direkte Wiedergabe erhält den synonymen Parallelismus mit „meinen Hilferuf“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Gebetssprache. Die parallelen Aufforderungen werden durch „Höre“ und „achte auf“ unterschieden; die knappe Anrede „Gott“ vermeidet ein unnötig altertümliches „o Gott“.
