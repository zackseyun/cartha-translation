source:
  edition: WLC
  text: מִ/קְצֵ֤ה הָ/אָ֨רֶץ אֵלֶ֣י/ךָ אֶ֭קְרָא בַּ/עֲטֹ֣ף לִבִּ֑/י בְּ/צוּר יָר֖וּם מִמֶּ֣/נִּי תַנְחֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: de
  text: Vom Ende der Erde rufe ich zu dir, wenn mein Herz schwach wird.[a] Führe mich auf einen Felsen, der höher ist als ich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn mein Herz überwältigt ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der mir zu hoch ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: Vom Ende der Erde
  rationale: קָצֶה bezeichnet das äußerste Ende oder den Rand. Zusammen mit הָאָרֶץ bewahrt „Ende der Erde“ das poetische Bild großer Entfernung und äußerster Lage.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: rufe ich zu dir
  rationale: קרא kann „rufen“ oder „schreien“ bedeuten. „Zu dir rufen“ ist im heutigen Deutsch natürlich und bewahrt die Dringlichkeit des Gebets.
- source_word: בַּעֲטֹף לִבִּי
  choice: wenn mein Herz schwach wird
  rationale: עטף beschreibt hier ein Schwach- oder Kraftloswerden und kann auch ein Überwältigtsein ausdrücken. Die gewählte Formulierung ist verständlich, wahrt das Bild des Herzens und legt die genaue Art der Bedrängnis nicht unnötig fest.
- source_word: בְּצוּר
  choice: auf einen Felsen
  rationale: צוּר bezeichnet konkret einen Felsen und trägt im Kontext die Vorstellung von Schutz und sicherem Halt. Mit dem Verb des Führens ist „auf einen Felsen“ im Deutschen anschaulich und idiomatisch.
- source_word: יָרוּם מִמֶּנִּי
  choice: der höher ist als ich
  rationale: רוּם bedeutet „hoch/erhaben sein“, und מִמֶּנִּי lässt zunächst einen Vergleich zu. Die Übersetzung bewahrt diesen, ohne die ebenfalls mögliche Bedeutung „zu hoch für mich“ in den Haupttext einzutragen.
- source_word: תַנְחֵנִי
  choice: Führe mich
  rationale: Die Hifil-Form von נחה bedeutet „führen“ oder „leiten“. „Führe mich“ bringt die Bitte um abhängige Führung klar und würdig zum Ausdruck.
theological_decisions:
- issue: Metaphorische Bedeutung des Felsens
  choice: Das konkrete Bild „Felsen“ bleibt im Haupttext erhalten, ohne ausdrücklich mit Gott oder einem Zufluchtsort gleichgesetzt zu werden.
  alternative: „Führe mich an einen sicheren Ort“ oder „zu einer Zuflucht“.
  rationale: Der hebräische Text verwendet die konkrete Metapher צוּר. Ihre Beibehaltung bewahrt die poetische und theologische Resonanz, ohne die Bildsprache interpretierend aufzulösen.
- issue: Vergleich oder Ausdruck der Unerreichbarkeit
  choice: „der höher ist als ich“ gibt die grammatisch naheliegende Vergleichsbedeutung wieder.
  alternative: „der mir zu hoch ist“.
  rationale: מִן kann nach einem Höhenbegriff einen Vergleich markieren; im Zusammenhang kann die Wendung zugleich ausdrücken, dass der Felsen ohne Gottes Führung unerreichbar ist. Diese zweite Möglichkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Bildsprache. Der Satzbau bleibt nahe am hebräischen Parallelismus, ohne altertümliche Formen zu verwenden.
