source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: de
  text: Möge er für immer vor Gott thronen[a]! Bestelle Güte und Treue[b], ihn zu behüten!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Möge er für immer vor Gott wohnen (oder: bleiben).“ Das Verb kann „sitzen“, „bleiben“ oder „wohnen“ bedeuten; im königlichen Zusammenhang liegt auch die Bedeutung „thronen“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „beständige Liebe und Wahrheit“. Das hebräische Wortpaar bezeichnet Gottes loyale Zuwendung und Verlässlichkeit; das mit „Treue“ wiedergegebene Wort kann auch „Wahrheit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Möge er … thronen
  rationale: Das Qal-Imperfekt von ישׁב kann „sitzen“, „bleiben“ oder „wohnen“ bedeuten. Im königlichen und bittenden Zusammenhang gibt „thronen“ die mögliche Herrschaftsnuance wieder; „möge“ versteht die Form passend zum folgenden Imperativ als Wunsch beziehungsweise Bitte.
- source_word: עוֹלָם
  choice: für immer
  rationale: Die Wendung gibt die unbegrenzte, fortdauernde Zeitangabe in natürlichem modernem Deutsch wieder.
- source_word: לִפְנֵי אֱלֹהִים
  choice: vor Gott
  rationale: Die knappe Formulierung bewahrt sowohl den räumlich-bildlichen Sinn als auch die Bedeutung „in Gottes Gegenwart“.
- source_word: חֶסֶד
  choice: Güte
  rationale: חֶסֶד bezeichnet hier Gottes verlässliche, zugewandte und bundestreue Güte. „Güte“ ist im Deutschen würdig und verständlich, ohne den Begriff auf bloßes Erbarmen oder Gefühl zu verengen.
- source_word: אֱמֶת
  choice: Treue
  rationale: אֱמֶת kann „Wahrheit“, „Treue“ oder „Zuverlässigkeit“ bedeuten. In der festen Verbindung mit חֶסֶד hebt „Treue“ Gottes Verlässlichkeit natürlich hervor.
- source_word: מַן
  choice: Bestelle
  rationale: 'Die Form wird als Imperativ zu מנה verstanden: Gott wird gebeten, Güte und Treue als schützende Mächte einzusetzen. „Bestelle“ erhält den direkten Gebetscharakter und die Vorstellung einer Beauftragung.'
- source_word: יִנְצְרֻהוּ
  choice: ihn zu behüten
  rationale: Das Verb נצר bedeutet „bewahren“, „behüten“ oder „schützen“. Der hebräische Plural stellt Güte und Treue personifiziert als gemeinsam handelnde Beschützer des Königs dar.
theological_decisions:
- issue: Aussageweise des Imperfekts im königlichen Gebet
  choice: 'Als Wunsch beziehungsweise Bitte: „Möge er … thronen“'
  alternative: 'Als Zukunftsaussage: „Er wird … thronen“'
  rationale: Der zweite Halbvers richtet einen Imperativ an Gott; daher fügt sich die Wunschform gut in den Gebetszusammenhang. Die grammatisch mögliche Zukunftsaussage wird nicht als alleinige Lesart ausgegeben.
- issue: Bedeutung des Wortpaares חֶסֶד וֶאֱמֶת
  choice: „Güte und Treue“ als personifizierte göttliche Eigenschaften
  alternative: „beständige Liebe und Wahrheit“ beziehungsweise „Gnade und Wahrheit“
  rationale: Das hebräische Wortpaar bezeichnet häufig Gottes loyale Zuwendung und Verlässlichkeit. Die gewählte Wiedergabe bewahrt diese Bundesdimension, während die Fußnote die lexikalische Spannweite offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Kürze. Die beiden Ausrufeformen erhalten den Charakter einer eindringlichen Bitte. „Bestelle“ ist bewusst gehoben, aber allgemein verständlich, und bildet den Imperativ sowie das Einsetzen personifizierter Schutzmächte prägnant ab.
