  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: de
  text: Denn du, Gott, hast meine Gelübde gehört; du hast das Erbe derer gegeben[a], die deinen Namen fürchten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast mir das Erbe derer gegeben, die deinen Namen fürchten.“ Im Hebräischen wird „mir“ nicht ausdrücklich genannt.'
    reason: alternative_reading
  - marker: b
    text: Den Namen Gottes zu fürchten bedeutet, in ehrfürchtiger Scheu vor Gott zu leben.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte beziehungsweise Zuversicht ein und wahrt den Zusammenhang des Gebets.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Anrede ergibt sich eindeutig aus dem Pronomen und den Verben der zweiten Person; „du, Gott“ klingt im modernen Deutschen natürlich und würdevoll.
- source_word: שָׁמַעְתָּ
  choice: hast … gehört
  rationale: Das Perfekt bezeichnet hier eine abgeschlossene Handlung mit gegenwärtiger Bedeutung. „Gehört“ kann im Gebetskontext zugleich auf Gottes aufmerksames Erhören hinweisen, ohne dies ausdrücklich festzulegen.
- source_word: לִנְדָרָי
  choice: meine Gelübde
  rationale: נדר bezeichnet gewöhnlich ein feierliches Gelübde und nicht zwingend die damit verbundene Opfergabe.
- source_word: נָתַתָּ
  choice: hast … gegeben
  rationale: Gibt die abgeschlossene, weiterhin bedeutsame Handlung in natürlichem Deutsch wieder.
- source_word: יְרֻשַּׁת
  choice: das Erbe
  rationale: Bezeichnet einen ererbten beziehungsweise zugewiesenen Besitz. „Erbe“ bewahrt sowohl den konkreten als auch den heilsgeschichtlichen Bedeutungsraum.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: die deinen Namen fürchten
  rationale: Die wörtliche Formulierung bewahrt das theologische Gewicht von ירא; gemeint ist ehrfürchtige Gottesfurcht, nicht bloß Angst.
theological_decisions:
- issue: Empfänger in נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ
  choice: „mir“ im Haupttext, mit textkritisch-sprachlicher Erläuterung
  alternative: „du hast das Erbe derer gegeben, die deinen Namen fürchten“ ohne genannten Empfänger
  rationale: Im Hebräischen steht bei „gegeben“ kein ausdrückliches indirektes Objekt. Aus dem Ich-Kontext des Psalms lässt sich „mir“ jedoch natürlich ergänzen; die Fußnote hält die grammatische Offenheit sichtbar.
- issue: Bedeutung von „deinen Namen fürchten“
  choice: „fürchten“ beibehalten und als ehrfürchtige Haltung erläutern
  alternative: „deinen Namen verehren“
  rationale: „Fürchten“ bewahrt die biblische Spannung zwischen Scheu, Ehrfurcht und gehorsamer Ausrichtung besser als eine abschwächende Paraphrase.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Die Satzverbindung „Denn“ und die knappe Parallelstruktur orientieren sich eng am Hebräischen, während das ergänzte „mir“ idiomatisches Deutsch ermöglicht; die genuine Offenheit des Ausgangstextes bleibt in der Fußnote erhalten.
