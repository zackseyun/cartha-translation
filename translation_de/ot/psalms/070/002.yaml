  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: de
  text: Mögen alle, die mir nach dem Leben trachten[a], beschämt und gedemütigt werden; mögen alle, die sich über mein Unglück freuen, zurückweichen und zuschanden werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die meine Seele suchen“. „Seele“ (נפש) meint hier idiomatisch das Leben beziehungsweise die ganze Person, besonders angesichts einer tödlichen Bedrohung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: beschämt seien
  rationale: בוש bezeichnet das Erleben von Scham beziehungsweise das Beschämtwerden. Die Wunschform „seien“ gibt hier den bittend-verwünschenden Sinn der hebräischen Verbform wieder.
- source_word: וְיַחְפְּרוּ
  choice: und gedemütigt
  rationale: חפר bezeichnet hier Demütigung oder Beschämung. „gedemütigt“ wahrt neben „beschämt“ die verstärkende Paarung zweier verwandter, aber nicht völlig identischer Verben.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: alle, die mir nach dem Leben trachten
  rationale: נפש bezeichnet in diesem feindseligen Zusammenhang idiomatisch das Leben beziehungsweise die Person. Die deutsche Wendung macht die lebensbedrohliche Absicht natürlich und deutlich.
- source_word: יִסֹּגוּ אָחוֹר
  choice: zurückweichen
  rationale: סוג mit אָחוֹר bezeichnet das Zurückweichen oder den Rückzug. „zurückweichen“ ist knapp, idiomatisch und erhält die Bewegungsrichtung.
- source_word: וְיִכָּלְמוּ
  choice: und zuschanden werden
  rationale: כלם bezeichnet Schande oder Ehrverlust. „zuschanden werden“ unterscheidet das Verb sprachlich von בוש und bewahrt zugleich den öffentlichen Aspekt der Schmach.
- source_word: חֲפֵצֵי רָעָתִי
  choice: alle, die sich über mein Unglück freuen
  rationale: חפץ kann Gefallen oder Freude ausdrücken; רעה bezeichnet hier das den Beter treffende Unheil, nicht dessen moralische Bosheit. Die Formulierung gibt die boshafte Genugtuung natürlich wieder.
theological_decisions:
- issue: Bittend-verwünschende Bedeutung der Imperfektformen
  choice: Als Wunsch beziehungsweise Bitte mit „seien“ und „sollen“ wiedergeben
  alternative: 'Als bloße Zukunftsaussage formulieren: „Sie werden …“'
  rationale: Im Gebetszusammenhang tragen die Verbformen jussivischen beziehungsweise imprekatorischen Sinn. Die deutsche Wunschkonstruktion bewahrt diese Funktion, ohne die Aussagen zu einer sicheren Vorhersage umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Gebetsstruktur und die drei verwandten Begriffe für Beschämung, Demütigung und Schande bleiben erkennbar; die hebräischen Idiome werden natürlich wiedergegeben.
