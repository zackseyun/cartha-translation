  text: יָ֭שׁוּבוּ עַל עֵ֣קֶב בָּשְׁתָּ֑/ם הָ֝/אֹמְרִ֗ים הֶ֘אָ֥ח הֶאָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/003.yaml
  text: Let them turn back because of their shame[a], those who say, “Aha, aha!”
translation:
  language: de
  text: 'Sie sollen wegen ihrer Schande zurückweichen, die sagen: »Ha! Ha!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Sie sollen zurückweichen
  rationale: Der Qal-Imperfekt der 3. Person Plural hat hier im Verwünschungs- beziehungsweise Wunschkontext volitive Kraft. »Zurückweichen« gibt die Vorstellung des beschämten Rückzugs natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich markiertes Passiv einzuführen.
- source_word: עַל עֵקֶב
  choice: wegen
  rationale: Die Verbindung bezeichnet idiomatisch Grund oder Folge. »Wegen« ist im Deutschen knapp und verständlich; eine wörtliche Wiedergabe mit »Ferse« würde den Sinn verdunkeln.
- source_word: בָּשְׁתָּם
  choice: ihrer Schande
  rationale: Das Wort gehört zum Bedeutungsfeld von Scham und Schande. »Schande« bezeichnet hier natürlich die beschämende Erniedrigung, die den Spöttern widerfahren soll.
- source_word: הָאֹמְרִים
  choice: die sagen
  rationale: Der substantivierte Partizip bezeichnet die durch diesen Ausspruch charakterisierte Gruppe. »Die sagen« ist idiomatisch und bewahrt den beschreibenden Charakter.
- source_word: הֶאָח הֶאָח
  choice: Haha! Haha!
  rationale: Die wiederholte Interjektion drückt hämische Schadenfreude beziehungsweise triumphierenden Spott aus. Das deutsche »Haha!« vermittelt diese höhnische Funktion unmittelbar.
theological_decisions:
- issue: Volitive beziehungsweise verwünschende Aussage
  choice: Sie sollen zurückweichen
  alternative: Mögen sie zurückweichen
  rationale: Beide Wiedergaben bewahren den Wunsch- oder Verwünschungscharakter des hebräischen Imperfekts. »Sie sollen« klingt in modernem Deutsch kräftig und fügt weder einen ausdrücklich göttlichen Handelnden noch ein Passiv hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzform. Der hämische Ton der Interjektion bleibt erhalten; keine konfessionell geprägte Deutung wurde ergänzt.
