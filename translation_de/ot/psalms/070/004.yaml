base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: de
  text: 'Mögen alle, die dich suchen, jubeln und sich an dir freuen; mögen alle, die dein Heil lieben,[a] immer sagen: »Groß sei Gott!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Rettung«. Das hebräische Wort kann konkrete Befreiung aus Not oder Heil in einem umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Gott werde groß gepriesen!« Die hebräische Form drückt hier wahrscheinlich einen Wunsch oder einen Ausruf aus, der Gottes Größe bekennt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: sollen sich freuen und jubeln
  rationale: Die beiden Verben bezeichnen lebhafte Freude. Zwei unterschiedliche deutsche Verben bewahren den poetischen Parallelismus; die Formulierung mit »sollen« gibt den Wunschcharakter der hebräischen Imperfektformen wieder.
- source_word: בְּךָ
  choice: an dir
  rationale: Die Präposition bezeichnet hier den Bezugspunkt oder Grund der Freude. »Sich an dir freuen« ist natürliches, würdiges Deutsch und bewahrt die Ausrichtung auf Gott.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: alle, die dich suchen
  rationale: Die partizipiale Wendung bezeichnet die Gesamtheit der Menschen, die Gott suchen. Die gewählte Form ist klar und idiomatisch.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: sollen immer sagen
  rationale: תָמִיד beschreibt wiederholtes beziehungsweise anhaltendes Reden. »Immer sagen« gibt dies knapp und verständlich wieder.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: alle, die dein Heil lieben
  rationale: יְשׁוּעָה umfasst konkrete Rettung und umfassenderes Heil. »Heil« hält diese Weite offen, während die partizipiale Aussage »lieben« unverändert bewahrt wird.
- source_word: יִגְדַּל אֱלֹהִים
  choice: Groß sei Gott!
  rationale: Die jussivisch gebrauchte Imperfektform ist eine Wunsch- oder Bekenntnisformel. »Groß sei Gott!« erhält diesen volitiven Ton und vermeidet eine bloß feststellende Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Heil
  alternative: Rettung
  rationale: Das hebräische Wort kann sowohl die Rettung aus konkreter Not als auch Heil in einem weiteren Sinn bezeichnen. »Heil« bewahrt die theologische Weite; die Fußnote nennt die konkretere Alternative.
- issue: Aussagefunktion von יִגְדַּל אֱלֹהִים
  choice: Groß sei Gott!
  alternative: Gott werde groß gepriesen! / Gott ist groß!
  rationale: Der Kontext legt eine fortwährende Akklamation oder einen Wunsch nahe, nicht nur eine Tatsachenfeststellung. Die gewählte Form bewahrt diese Spannung, ohne Gott so darzustellen, als müsse seine Wesensgröße erst zunehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetisch-würdigem Klang. Die parallelen Freudeverben und die wiederholte Akklamation bleiben erkennbar; konfessionell festgelegte Deutungen werden vermieden.
