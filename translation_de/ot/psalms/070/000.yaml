  text: For the choirmaster. Of David. For remembrance[a].
translation:
  language: de
  text: Für den Chorleiter. Von David. Zur Erinnerung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Gedenken“, „um in Erinnerung zu rufen“; möglicherweise eine liturgische Angabe im Zusammenhang mit dem Erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Wendung bezeichnet in Psalmüberschriften herkömmlich den musikalischen Leiter. „Für“ gibt das präfigierte ל wieder; „Chorleiter“ ist im Deutschen verständlich und bewahrt die musikalisch-liturgische Funktion.
- source_word: לְדָוִד
  choice: Von David
  rationale: Das ל in Psalmüberschriften kann Urheberschaft, Zugehörigkeit, Widmung oder Zuordnung ausdrücken. „Von David“ ist eine knappe, herkömmliche Wiedergabe, ohne die genaue Art der Beziehung ausdrücklich festzulegen.
- source_word: לְהַזְכִּיר
  choice: Zum Gedenken
  rationale: Der Hifil-Infinitiv von זכר bedeutet, an etwas zu erinnern beziehungsweise etwas ins Gedächtnis zu rufen. „Zum Gedenken“ eignet sich als knappe Zweckangabe in der Überschrift und lässt offen, wessen oder welcher Art das Gedenken ist.
theological_decisions:
- issue: Funktion der Überschrift לְהַזְכִּיר
  choice: 'Neutrale Zweckangabe: „Zum Gedenken“'
  alternative: Als Hinweis auf ein Erinnerungsopfer, als Bitte, Gott möge sich erinnern, oder als Aufforderung an die Betenden, sich zu erinnern
  rationale: Der hebräische Wortlaut nennt weder das Subjekt noch den Gegenstand des Erinnerns. Die neutrale Formulierung bewahrt die mögliche liturgische Bedeutung und löst die theologische Mehrdeutigkeit nicht einseitig auf.
translation_notes:
  register: Knappe, würdige Form einer Psalmüberschrift in modernem Standarddeutsch. Die Satzglieder bleiben getrennt, entsprechend der kompakten hebräischen Reihung.
