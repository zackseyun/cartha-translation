  - severity: low
    issue: Die Fußnotenalternative „Als Gedenkzeichen“ ist semantisch enger als der hebräische Infinitiv.
    rationale: Sie kann als mögliche nominale Deutung gelten, sollte aber neben der näherliegenden verbalen Alternative stehen und die liturgische Ungewissheit ausdrücklich als solche markieren.
