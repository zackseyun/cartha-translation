id: PSA.70.5
reference: Psalms 70:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: de
  text: Ich aber bin arm und bedürftig. Gott, eile zu mir![a] Du bist meine Hilfe und mein Retter. Jahwe, zögere nicht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eile für mich!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Verbindung aus Konjunktion und Pronomen markiert einen Kontrast und wendet den Blick auf die Not des Beters.
- source_word: עָנִי וְאֶבְיוֹן
  choice: arm und bedürftig
  rationale: Die geläufige Wortverbindung beschreibt niedrige, bedrängte Lebensumstände und konkrete Hilfsbedürftigkeit, ohne sie auf geistliche Demut zu verengen.
- source_word: אֱלֹהִים חוּשָׁה לִי
  choice: Gott, eile zu mir!
  rationale: Der Vokativ und der Imperativ geben die Dringlichkeit des Gebets wieder. לִי bezeichnet hier am ehesten den Beter als Ziel der erbetenen Eile; „für mich“ bleibt möglich.
- source_word: עֶזְרִי
  choice: meine Hilfe
  rationale: Das Substantiv bezeichnet Hilfe oder Beistand; die sachliche Wiedergabe bewahrt die hebräische Nominalform.
- source_word: וּמְפַלְטִי
  choice: und mein Retter
  rationale: Die Form bezeichnet denjenigen, der Entkommen ermöglicht oder in Sicherheit bringt. „Retter“ ist im Deutschen knapp, würdig und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַל תְּאַחַר
  choice: zögere nicht
  rationale: Die verneinte Aufforderung bittet Gott eindringlich, sein Eingreifen nicht hinauszuschieben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als persönliche Anrede, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bezeichnung Gottes als עֶזְרִי וּמְפַלְטִי
  choice: meine Hilfe und mein Retter
  alternative: mein Helfer und mein Befreier
  rationale: Die gewählte Formulierung bewahrt sowohl die abstrakte Bezeichnung Gottes als Hilfe als auch seine handelnde Rolle als derjenige, der rettet, ohne die Aussage weiter dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen Sätzen, die den dringlichen Gebetston des Hebräischen bewahren. „Bedürftig“ erhält die traditionelle poetische Färbung, bleibt aber allgemein verständlich.
