  text: אֱלֹהִ֥ים לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָֽׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: de
  text: Gott, rette mich! Jahwe, eile mir zu Hilfe!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die direkte Anrede ist im Deutschen ohne ein zusätzliches „o“ natürlich und würdevoll.
- source_word: לְהַצִּילֵנִי
  choice: rette mich
  rationale: Der Hifil-Infinitiv von נצל bezeichnet das Herausreißen aus Gefahr. Da im ersten Halbvers ein ausdrückliches finites Verb fehlt, gibt „rette mich“ die knappe, dringliche Bitte natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְעֶזְרָתִי
  choice: mir zu Hilfe
  rationale: Die Verbindung aus ל und עֶזְרָה bezeichnet die erbetene Hilfe; „mir zu Hilfe“ bildet zusammen mit „eile“ eine natürliche deutsche Wendung.
- source_word: חוּשָׁה
  choice: eile
  rationale: Die imperativische Form fordert zu unverzüglichem Handeln auf. „Eile“ bewahrt die Dringlichkeit in knapper, psalmengemäßer Sprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Ergänzung des im ersten Halbvers fehlenden finiten Verbs
  choice: „rette mich“ als selbstständige Bitte
  alternative: „eile, mich zu retten“ unter gedanklicher Vorwegnahme von חוּשָׁה
  rationale: Der hebräische erste Halbvers ist elliptisch. Die gewählte Fassung wahrt seine Kürze und Dringlichkeit, ohne das erst im zweiten Halbvers stehende „eile“ ausdrücklich zu verdoppeln.
translation_notes:
  register: Moderne, knappe und würdevolle Gebetssprache. Die parallelen Anreden „Gott“ und „Jahwe“ sowie die Dringlichkeit des Verses bleiben erhalten; archaische Formen wie „o“ und „spoude dich“ werden vermieden.
