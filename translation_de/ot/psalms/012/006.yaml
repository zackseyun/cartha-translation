  text: אִֽמֲר֣וֹת יְהוָה֮ אֲמָר֪וֹת טְהֹ֫ר֥וֹת כֶּ֣סֶף צָ֭רוּף בַּ/עֲלִ֣יל לָ/אָ֑רֶץ מְ֝זֻקָּ֗ק שִׁבְעָתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: de
  text: 'Jahwes Worte sind reine Worte,

    wie Silber, geläutert im Schmelzofen[a] auf der Erde[b],

    siebenmal gereinigt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »im Schmelztiegel« oder »im Schmelzgefäß«. Das hebräische Wort ist selten; seine genaue Bedeutung ist unsicher, doch der Zusammenhang weist klar auf Metallverarbeitung hin.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch »auf der Erde«. Die Wendung kann den Ort oder die Umgebung des Läuterns bezeichnen; ihre genaue Bedeutung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: Worte
  rationale: Das wiederholte Substantiv bezeichnet gesprochene Worte oder Aussprüche allgemein. »Worte« ist im Deutschen natürlich und engt den Sinn nicht auf »Verheißungen« ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: טְהֹרוֹת
  choice: rein
  rationale: Das Adjektiv bezeichnet Reinheit und verbindet die Aussage über Jahwes Worte passend mit dem folgenden Bild der Metallveredelung.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Das Substantiv bezeichnet hier eindeutig das Metall Silber.
- source_word: צָרוּף
  choice: geläutert
  rationale: Der Ausdruck beschreibt veredeltes, von Verunreinigungen befreites Metall. »Geläutert« ist in deutscher Dichtung idiomatisch und wahrt das metallurgische Bild.
- source_word: בַּעֲלִיל
  choice: im Schmelzofen
  rationale: Das seltene Wort bezeichnet im Zusammenhang wahrscheinlich eine Vorrichtung oder ein Gefäß zum Läutern von Metall. »Schmelzofen« vermittelt das Bild verständlich, während eine Fußnote die lexikalische Unsicherheit offenhält.
- source_word: לָאָרֶץ
  choice: auf der Erde
  rationale: Die syntaktisch schwierige Wendung wird bewusst nah am Hebräischen wiedergegeben, ohne ihre genaue räumliche oder sonstige Funktion festzulegen.
- source_word: מְזֻקָּק
  choice: gereinigt
  rationale: Das Partizip führt das Bild der Metallreinigung fort. »Gereinigt« vermeidet eine unmittelbare Wiederholung von »geläutert«.
- source_word: שִׁבְעָתָיִם
  choice: siebenmal
  rationale: Die adverbiale Form bezeichnet eine siebenfache beziehungsweise vollständige Reinigung. »Siebenmal« ist transparent und natürlich.
theological_decisions:
- issue: Art der Reinheit von Jahwes Worten
  choice: Der Vers bezeugt die völlige Reinheit und Verlässlichkeit von Jahwes Worten durch das Bild gründlich gereinigten Silbers.
  alternative: Die Aussage ausschließlich auf moralische Reinheit zu beschränken oder sie zu einer späteren Lehre über Textbewahrung auszuweiten.
  rationale: Der hebräische Text macht eine poetische Aussage über Jahwes Worte und vergleicht sie mit geläutertem Silber. Die Übersetzung bewahrt diese Aussage, ohne spätere Lehrsysteme in den Vers hineinzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Zeilenführung. Die Wiederholung von »Worte« folgt dem Hebräischen. Die ungewöhnliche Formulierung »auf der Erde« bleibt erhalten, weil der Ausgangstext an dieser Stelle mehrdeutig ist; die Fußnote erläutert dies, ohne die Mehrdeutigkeit aufzulösen.
