  yaml_path: translation/ot/psalms/012/000.yaml
  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: de
  text: 'Für den Chorleiter: Nach der »Achten«[a]. Ein Psalm Davids[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »die Achte«; wahrscheinlich eine musikalische oder liturgische Bezeichnung, möglicherweise für eine Melodie, ein Instrument oder eine Oktavlage. Traditionell wird das Wort als »Scheminit« wiedergegeben.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »von David« oder »für David«; die hebräische Form lässt die genaue Beziehung zu David offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet das Wort herkömmlich den Leiter der musikalischen Aufführung. »Chorleiter« ist knapp, verständlich und wahrt den musikalisch-liturgischen Bezug.
- source_word: עַל
  choice: Nach
  rationale: In Überschriften kann עַל eine Melodie, Vortragsweise oder musikalische Einrichtung einführen. Das deutsche »nach« gibt diese Funktion natürlich wieder, ohne die Art der Bezeichnung festzulegen.
- source_word: הַשְּׁמִינִית
  choice: »Die Achte«
  rationale: Der Ausdruck bedeutet wörtlich »die Achte« und ist wahrscheinlich eine musikalische oder liturgische Bezeichnung. Die Übersetzung bleibt transparent; Anführungszeichen kennzeichnen den Ausdruck als Titel oder Fachbezeichnung.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: »Psalm« ist die etablierte und kontextgerechte deutsche Bezeichnung für diese Gattung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die hebräische Verbindung kann Autorschaft, Zugehörigkeit, Widmung oder Beziehung ausdrücken. Der deutsche Genitiv lässt den genauen Zusammenhang ähnlich offen.
theological_decisions:
- issue: Autorschaft oder Zuordnung durch לְדָוִד in der Überschrift
  choice: Ein Psalm Davids
  alternative: Ein Psalm von David / für David
  rationale: Der hebräische Ausdruck bestimmt die Art der Beziehung zu David nicht eindeutig. Der Genitiv bewahrt diese Offenheit besser, als Autorschaft oder Widmung ausdrücklich festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe Form einer Psalmüberschrift bleibt erhalten; die Satztrennung erhöht die natürliche Lesbarkeit im Deutschen. Die unklare musikalische Bezeichnung und die offene Beziehung zu David werden nicht vereindeutigt.
