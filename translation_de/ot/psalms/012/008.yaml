source:
  edition: WLC
  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: de
  text: Ringsum gehen die Gottlosen umher, wenn Niedertracht unter den Menschen hochgehalten wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter den Menschensöhnen«. Möglich ist auch: »Die Gottlosen gehen ringsum umher, während das Verächtliche unter den Menschen erhöht wird.«'
    reason: Die Fußnote bewahrt die hebräische anthropologische Redewendung und macht die mögliche begleitende Deutung der schwierigen Konstruktion כְּרֻם sichtbar, ohne זֻלּוּת mit dem missverständlichen deutschen Begriff „Niedrigkeit“ wiederzugeben.
lexical_decisions:
- source_word: סָבִיב
  choice: ringsum
  rationale: Das adverbiale »ringsum« gibt die Vorstellung einer Bewegung oder Präsenz auf allen Seiten knapp und natürlich wieder.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Die substantivierte Mehrzahl bezeichnet Menschen, die böse bzw. gottlos handeln; die traditionelle, weiterhin verständliche Wiedergabe bleibt prägnant.
- source_word: יִתְהַלָּכוּן
  choice: gehen … umher
  rationale: Der Hitpael von הלך bezeichnet ein Umhergehen. Diese Wiedergabe bewahrt das Bewegungsbild, ohne das stärker deutende »streifen umher« oder »lauern« einzutragen.
- source_word: כְּרֻם
  choice: wenn … hochgehalten wird
  rationale: Die schwierige Konstruktion mit כ wird als zeitlich-umständliche Angabe verstanden. »Hochgehalten« erfasst sowohl Erhöhung als auch gesellschaftliche Wertschätzung.
- source_word: זֻלּוּת
  choice: Niedertracht
  rationale: Das seltene Substantiv bezeichnet Niedriges, Wertloses oder moralisch Verächtliches. »Niedertracht« trägt im Zusammenhang die ethische Stoßrichtung, ohne die Bedeutung auf bloße Wertlosigkeit zu verengen.
- source_word: לִבְנֵי אָדָם
  choice: unter den Menschen
  rationale: Wörtlich steht »bei/unter den Menschensöhnen«. Die Wendung hat generischen Bezug auf die Menschheit; modernes Deutsch gibt diesen Sinn natürlich mit »unter den Menschen« wieder.
theological_decisions:
- issue: Generischer anthropologischer Ausdruck לִבְנֵי אָדָם
  choice: unter den Menschen
  alternative: unter den Menschensöhnen
  rationale: Die grammatisch maskuline hebräische Redewendung bezeichnet Menschen allgemein. Die Hauptfassung gibt den gemeinten Umfang idiomatisch wieder; die Fußnote bewahrt die Form des hebräischen Ausdrucks.
- issue: Beziehung von כְּרֻם zum Hauptsatz
  choice: 'zeitlich-umständlich: »wenn … hochgehalten wird«'
  alternative: 'vergleichend bzw. begleitend: »während/indem … hochgehalten wird«'
  rationale: Die knappe hebräische Konstruktion lässt die genaue Beziehung offen. »Wenn« ergibt im Kontext einen plausiblen Zusammenhang, ohne eine ausdrückliche Kausalität zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gottlose« wahrt den biblischen Registerton; »gehen umher« vermeidet eine unnötig wertende Verstärkung. Die Fußnotenmarke steht vollständig im Haupttext.
