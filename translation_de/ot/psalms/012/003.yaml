id: PSA.12.3
reference: Psalms 12:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: de
  text: Möge Jahwe alle schmeichelnden Lippen[a] ausrotten, die Zunge, die große Dinge redet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Lippen der Glätte“; gemeint ist glatte, schmeichelnde Rede.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „große Dinge“; im Zusammenhang sind prahlerische oder überhebliche Äußerungen gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: möge … ausrotten
  rationale: Das Hifil-Imperfekt von כרת kann Abschneiden, Beseitigen oder Vernichten bezeichnen. Hier gibt die Wunschform „möge“ den Gebets- beziehungsweise Verwünschungscharakter wieder; „ausrotten“ bewahrt zugleich die Schärfe des Bildes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: alle schmeichelnden Lippen
  rationale: חֲלָקוֹת bezeichnet wörtlich Glätte oder Geschmeidigkeit und beschreibt hier glatte, schmeichelnde Rede. Die deutsche Formulierung ist verständlich und erhält das konkrete Bild der Lippen.
- source_word: לָשׁוֹן מְדַבֶּרֶת
  choice: die Zunge, die … redet
  rationale: Der singularische Ausdruck wird nach dem Plural „Lippen“ als anschauliche, appositionelle Personifikation beibehalten.
- source_word: גְּדֹלוֹת
  choice: große Dinge
  rationale: Die wörtliche Bedeutung bleibt erhalten; im Zusammenhang sind überhebliche oder prahlerische Äußerungen gemeint, was die Fußnote verdeutlicht, ohne die Bildweite im Haupttext einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, während „der HERR“ ihn durch einen traditionellen Titel ersetzen würde.
- issue: Modale Kraft von יַכְרֵת
  choice: Möge Jahwe … ausrotten
  alternative: Jahwe wird … ausrotten
  rationale: Die Verbform kann formal auch als Zukunftsaussage verstanden werden. Im Psalmzusammenhang liegt jedoch ein Gebetswunsch beziehungsweise eine Verwünschung nahe; die gewählte Form wahrt diese Nuance, ohne sie als bloße Vorhersage festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Körperbilder „Lippen“ und „Zunge“ sowie die Härte des hebräischen Verbs bleiben erhalten. Die bewusst offene Wendung „große Dinge“ wird nicht im Haupttext deutend auf „Prahlerisches“ verengt.
