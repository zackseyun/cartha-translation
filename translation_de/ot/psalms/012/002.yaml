  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: de
  text: Nichtiges reden sie, jeder zu seinem Nächsten; mit schmeichelnden Lippen[a] und doppeltem Herzen[b] reden sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit glatten Lippen«; gemeint ist glatte, schmeichelnde und dadurch irreführende Rede.'
