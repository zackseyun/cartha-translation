lexical_decisions:
- source_word: שָׁוְא
  choice: Nichtiges
  rationale: Das substantivierte Adjektiv gibt wieder, was leer, unwahr oder wertlos ist, ohne die Bedeutung vorschnell auf ausdrückliche Lügen zu verengen.
- source_word: יְדַבְּרוּ … יְדַבֵּרוּ
  choice: reden sie … reden sie
  rationale: Die Wiederholung des gewöhnlichen Verbs für »reden« bewahrt den poetischen Rahmen und die Betonung des verderbten Redens.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: einer mit dem andern
  rationale: Die distributive Wendung bezeichnet das wechselseitige Reden im sozialen Umfeld und klingt im Deutschen natürlich, ohne den Sinn auf enge Freundschaft zu beschränken.
- source_word: שְׂפַת חֲלָקוֹת
  choice: mit schmeichelnden Lippen
  rationale: Die wörtlich »glatten« Lippen bezeichnen glatte, schmeichelnde und dadurch irreführende Rede; die Bildsprache der Lippen bleibt erhalten.
- source_word: בְּלֵב וָלֵב
  choice: mit doppeltem Herzen
  rationale: Die ungewöhnliche hebräische Formulierung »mit Herz und Herz« wird bildnah wiedergegeben und bezeichnet zwiespältige beziehungsweise heuchlerische Absicht.
