source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: de
  text: „Wegen der Gewalt gegen die Armen, wegen des Stöhnens der Bedürftigen werde ich jetzt aufstehen“, spricht Jahwe. „Ich werde ihn in Sicherheit bringen, nach der er sich sehnt.“[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut der Schlussklausel ist schwierig. Die Übersetzung folgt einer Deutung im Sinn von: „Ich werde ihn in Sicherheit bringen; er sehnt sich danach.“ Näher am Wortlaut lautet sie etwa: „Ich setze in Sicherheit; er schnaubt/pustet ihn an.“ Daher verstehen manche den Satz im Sinn von: „Ich bringe ihn in Sicherheit vor dem, der ihn anschnaubt“, oder ähnlich.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: Wegen der Gewalt gegen die Armen
  rationale: מִן wird im Zusammenhang als kausal verstanden. שֹׁד bezeichnet zerstörerische Gewalt, Verwüstung oder Ausplünderung; „Gewalt gegen die Armen“ ist im Deutschen natürlich und bewahrt die Schwere der Bedrückung.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: wegen des Stöhnens der Bedürftigen
  rationale: Die zweite מִן-Verbindung steht parallel zur ersten und wird ebenfalls kausal wiedergegeben. „Stöhnen“ vermittelt die hörbare Not; „Bedürftige“ unterscheidet אֶבְיוֹנִים von עֲנִיִּים, ohne den Parallelismus aufzuheben.
- source_word: עַתָּה אָקוּם
  choice: werde ich jetzt aufstehen
  rationale: Die Form bezeichnet hier unmittelbar bevorstehendes göttliches Eingreifen. „Aufstehen“ erhält das anschauliche Bild des hebräischen Verbs.
- source_word: יֹאמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die nachgestellte Redeeinleitung entspricht dem hebräischen Aufbau und klingt in gehobener deutscher Rede natürlich.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: Ich bringe ihn in die Sicherheit
  rationale: שׂים bedeutet setzen oder stellen; zusammen mit בְּיֵשַׁע bezeichnet die Wendung wahrscheinlich das Versetzen in einen Zustand der Rettung und Sicherheit. Die deutsche Fassung gibt dieses konkrete Ergebnis idiomatisch wieder.
- source_word: יָפִיחַ לוֹ
  choice: nach der er sich sehnt
  rationale: Die schwierige Wendung wird als Verlangen beziehungsweise Sehnen nach der Sicherheit verstanden. Da Wortlaut und Bezug umstritten sind, werden wörtlichere und abweichende Deutungen in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ gibt ihn in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Singulars im letzten Satzteil
  choice: ihn – als einzelne, stellvertretend bezeichnete bedürftige Person
  alternative: sie – kollektiv auf die Armen und Bedürftigen bezogen
  rationale: Der hebräische Ausdruck לוֹ steht im Singular. Die Übersetzung wahrt diesen Numerus, ohne festzulegen, ob eine bestimmte Einzelperson oder der einzelne Bedürftige als Vertreter der Gruppe gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Parallelismus. Die Satzstruktur bleibt nah am Hebräischen, während unnatürliche deutsche Wendungen vermieden werden. Die umstrittene Schlussklausel wird im Haupttext sinnvoll, aber nicht dogmatisch aufgelöst; ihre Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
