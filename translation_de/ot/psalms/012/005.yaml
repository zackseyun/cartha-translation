  rationale: Das Futur im zweiten Satz bildet die angekündigte Handlung Gottes klar parallel zum vorangehenden „werde ich ... aufstehen“. Die Fußnote wahrt die sinnvolle Haupttextdeutung, kennzeichnet sie aber nicht mehr als bloße wörtliche Wiedergabe und hält die umstrittene Bedeutung sowie die offenen Bezüge der hebräischen Schlussklausel sichtbar.
