source:
  edition: WLC
  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: de
  text: Du, Jahwe, wirst sie bewahren; du wirst ihn[a] vor dieser Generation behüten – für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wechselt die Form vom Plural („sie bewahren“) zum Singular („ihn behüten“). Manche Übersetzungen gleichen den zweiten Ausdruck an den Plural an oder geben ihn als „uns behüten“ wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: Du
  rationale: Das selbstständige, vorangestellte Personalpronomen hebt den Angeredeten hervor; die deutsche Voranstellung bewahrt diese Betonung natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תִּשְׁמְרֵם
  choice: wirst sie bewahren
  rationale: שׁמר bezeichnet hier schützendes Bewahren; das männliche Pluralsuffix wird mit „sie“ wiedergegeben.
- source_word: תִּצְּרֶנּוּ
  choice: wirst ihn behüten
  rationale: נצר bedeutet „behüten, bewahren, schützen“. Die masoretische Form weist auf ein männliches Singularobjekt; der auffällige Wechsel vom Plural zum Singular bleibt erhalten.
- source_word: מִן הַדּוֹר זּוּ
  choice: vor dieser Generation
  rationale: מִן bezeichnet hier die Gefahr, vor der jemand geschützt wird; דור wird direkt und verständlich mit „Generation“ wiedergegeben.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die geläufige deutsche Wendung gibt die unbegrenzte Dauer in diesem poetischen Gebetskontext natürlich wieder.
theological_decisions:
- issue: Numeruswechsel zwischen „sie“ und „ihn“
  choice: 'Den masoretischen Wechsel im Haupttext bewahren: „sie bewahren … ihn behüten“'
  alternative: 'Zum Plural angleichen: „sie bewahren … sie behüten“; oder als erste Person lesen: „uns behüten“'
  rationale: Der hebräische Text weist zunächst ein Pluralsuffix und danach eine als Singular verstandene Form auf. Die Übersetzung glättet diese Spannung nicht und legt auch nicht fest, auf wen der Singular verweist.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetisch ausgewogenem Parallelismus. Der Gedankenstrich hebt „für immer“ hervor, ohne die hebräische Mehrdeutigkeit der Pronomen aufzulösen.
