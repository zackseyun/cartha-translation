  text: אֲשֶׁ֤ר אָֽמְר֨וּ לִ/לְשֹׁנֵ֣/נוּ נַ֭גְבִּיר שְׂפָתֵ֣י/נוּ אִתָּ֑/נוּ מִ֖י אָד֣וֹן לָֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/004.yaml
  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: de
  text: 'die sagen: „Mit unserer Zunge setzen wir uns durch[a]; unsere Lippen sind auf unserer Seite[b] – wer ist Herr über uns?[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit unserer Zunge sind wir stark“ oder „Mit unserer Zunge werden wir überlegen sein“.'
    reason: Der Hifil von גבר kann das Starksein oder Überlegenwerden ausdrücken.
  - marker: b
    text: 'Wörtlich: „unsere Lippen sind mit uns“; möglich ist auch: „unsere Lippen gehören uns“ oder „über unsere Lippen verfügen wir selbst“.'
    reason: Die knappe hebräische Wendung kann Beistand, Besitz oder selbstbestimmte Verfügungsgewalt ausdrücken.
  - marker: c
    text: 'Oder: „Wer ist Gebieter über uns?“'
    reason: אָדוֹן kann sowohl „Herr“ als auch „Gebieter“ oder „Herrscher“ bedeuten.
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: die sagen
  rationale: Das Relativpronomen schließt die Beschreibung eng an den vorherigen Vers an. Das hebräische Perfekt kennzeichnet hier die typische Haltung der Sprecher; das deutsche Präsens gibt dies natürlich wieder.
- source_word: לִלְשֹׁנֵנוּ
  choice: Mit unserer Zunge
  rationale: Die Präposition ל wird im Zusammenhang instrumental verstanden. Das konkrete Bild der Zunge bleibt erhalten.
- source_word: נַגְבִּיר
  choice: setzen wir uns durch
  rationale: Der Hifil von גבר bezeichnet Stärke oder Überlegenheit. Im Zusammenhang prahlerischer Rede drückt „sich durchsetzen“ verständlich aus, dass die Sprecher durch ihre Worte die Oberhand gewinnen wollen.
- source_word: שְׂפָתֵינוּ אִתָּנוּ
  choice: unsere Lippen sind auf unserer Seite
  rationale: Die konkrete Metapher der Lippen bleibt erhalten. „Auf unserer Seite“ gibt das knappe hebräische אִתָּנוּ („mit uns“) als Aussage eigener Verfügungsgewalt oder eigenen Vorteils wieder, ohne die Mehrdeutigkeit völlig auf Besitz zu verengen.
- source_word: מִי אָדוֹן לָנוּ
  choice: wer ist Herr über uns?
  rationale: אָדוֹן bezeichnet hier allgemein einen Herrn oder Gebieter. Die Formulierung bewahrt die trotzige Bestreitung jeder übergeordneten Autorität.
theological_decisions:
- issue: Bedeutung von אָדוֹן im Zusammenhang der bestrittenen Autorität
  choice: Herr
  alternative: Gebieter
  rationale: Der Ausdruck ist kein Gottesname, kann aber grundsätzlich sowohl menschliche als auch göttliche Herrschaft bezeichnen. „Herr“ bewahrt diese Offenheit und die pointierte Frage, ohne Gott ausdrücklich einzusetzen oder auszuschließen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrten Körpermetaphern („Zunge“, „Lippen“). Die trotzige, selbstherrliche Rede bleibt knapp und zugespitzt; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten offengehalten.
