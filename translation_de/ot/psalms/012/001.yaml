  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: de
  text: Hilf, Jahwe, denn der Fromme ist nicht mehr; denn die Treuen sind unter den Menschen[a] verschwunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Söhnen Adams/des Menschen“; gemeint ist die menschliche Gemeinschaft.'
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Hilf
  rationale: Der verstärkte Imperativ von ישׁע ist ein dringender Hilferuf an Gott. „Hilf“ ist im Deutschen die natürliche, knappe Gebetssprache und umfasst hier Rettung und Befreiung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Beide Vorkommen führen die Begründung für den Hilferuf ein; „denn“ wahrt die knappe poetische Verknüpfung.
- source_word: גָמַר
  choice: ist nicht mehr
  rationale: Das Verb bezeichnet hier, dass jemand zu Ende beziehungsweise verschwunden ist. „Ist nicht mehr“ gibt dies bei einem menschlichen Subjekt natürlich wieder, ohne die genaue Ursache festzulegen.
- source_word: חָסִיד
  choice: der Fromme
  rationale: Der substantivierte maskuline Singular bezeichnet einen Menschen, der von Frömmigkeit beziehungsweise loyaler Verbundenheit geprägt ist. „Der Fromme“ bewahrt Singular und religiös-ethischen Sinn.
- source_word: פַסּוּ
  choice: sind ... verschwunden
  rationale: Der Plural bezeichnet das Aufhören beziehungsweise Verschwinden; „verschwunden“ bewahrt die bildhafte Klage.
- source_word: אֱמוּנִים
  choice: die Treuen
  rationale: Die substantivierte Pluralform bezeichnet zuverlässige, treue Menschen. „Die Treuen“ ist knapp und bewahrt den personalen sowie moralischen Sinn.
- source_word: מִבְּנֵי אָדָם
  choice: unter den Menschen
  rationale: Die wörtliche Wendung „von den Söhnen Adams/des Menschen“ ist ein hebräisches Idiom für die menschliche Gemeinschaft; „unter den Menschen“ gibt ihre Funktion in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Numerus und mögliche kollektive Bedeutung von חָסִיד
  choice: der Fromme ist nicht mehr
  alternative: die Frommen sind nicht mehr
  rationale: Die hebräische Form ist grammatisch maskulin und singular. Eine kollektive oder repräsentative Bedeutung ist im Kontext möglich, sollte aber nicht durch einen unbezeichneten Plural festgeschrieben werden.
- issue: Anthropologische Wendung בְּנֵי אָדָם
  choice: unter den Menschen
  alternative: unter den Menschensöhnen
  rationale: Die Wendung bezeichnet idiomatisch die menschliche Gemeinschaft. Natürliches Deutsch macht diese Bedeutung verständlich, ohne eine besondere männliche Teilgruppe zu behaupten.
translation_notes:
  register: Knappe, dringliche Gebetssprache mit poetischem Parallelismus. „Jahwe“ bewahrt den Eigennamen; „der Fromme“ hält den grammatischen Singular offen, während „die Treuen“ den ausdrücklichen Plural wiedergibt.
