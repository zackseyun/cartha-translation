  text: May Yahweh give increase to you[b][a]—to you and to your children.
translation:
  language: de
  text: Jahwe schenke euch Zuwachs[a] – euch und euren Kindern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe mehre euch – euch und eure Kinder.“ Das hebräische Verb kann „hinzufügen“ oder „vermehren“ bedeuten; die Art der Mehrung wird nicht näher bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵף
  choice: lasse … wachsen
  rationale: Das Hifil von יסף bedeutet „hinzufügen, vermehren“. Im Segenszusammenhang gibt die deutsche Wunschform „lasse … wachsen“ den volitiven Sinn natürlich wieder, ohne festzulegen, ob zahlenmäßige Vermehrung oder allgemeines Gedeihen gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  choice: euch … euch
  rationale: Die Präposition mit Suffix steht hier idiomatisch beim Verb. Die Wiederholung wird bewahrt; der Gedankenstrich kennzeichnet den zweiten Ausdruck als nachdrückliche Entfaltung.
- source_word: וְעַל בְּנֵיכֶם
  choice: und eure Kinder
  rationale: בנים kann je nach Zusammenhang „Söhne“ oder allgemeiner „Kinder“ bezeichnen. In diesem Familiensegen ist „Kinder“ die natürliche, nicht unnötig einengende Wiedergabe.
theological_decisions:
- issue: Volitive Bedeutung der Verbform im Segenszusammenhang
  choice: 'Wunsch/Segen: „Jahwe lasse …“'
  alternative: „Jahwe wird euch wachsen lassen“
  rationale: Der Zusammenhang von Psalm 115,12–15 spricht für eine Segensbitte. Die deutsche Konstruktion mit „lasse“ erhält diese Aussagefunktion, statt daraus eine eindeutige Vorhersage zu machen.
- issue: Genaue Art der verheißenen Mehrung
  choice: „wachsen“ ohne nähere Bestimmung
  alternative: „euch zahlreich werden lassen“ oder „euch mehr Segen schenken“
  rationale: Der hebräische Text nennt nicht ausdrücklich, worin die Mehrung besteht. Die Übersetzung bewahrt diese Offenheit.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt die Unterscheidung zwischen dem Gottesnamen und einem Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lasse … wachsen“ ist idiomatischer als „füge euch hinzu“ und bewahrt zugleich die im Hebräischen nicht näher bestimmte Mehrung. Der Gedankenstrich bildet die betonte Wiederaufnahme von „euch“ ab.
