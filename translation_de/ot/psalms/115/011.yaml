id: PSA.115.11
reference: Psalms 115:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
translation:
  language: de
  text: Ihr, die ihr Jahwe fürchtet[a], vertraut auf Jahwe! Er ist ihre Hilfe und ihr Schild.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Jahwe fürchten, sollen auf Jahwe vertrauen.« Das hebräische Partizip kann als direkte Anrede oder als Bezeichnung in der dritten Person verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  choice: Ihr, die ihr … fürchtet
  rationale: Das substantivierte Partizip im Konstruktus bezeichnet wörtlich die »Jahwe Fürchtenden«. Als direkte Anrede passt es zum folgenden Imperativ Plural; die ebenfalls mögliche Bezeichnung in der dritten Person wird in der Fußnote genannt.
- source_word: יְהוָה / בַיהוָה
  choice: Jahwe / auf Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben. Bei בטח mit ב entspricht »auf jemanden vertrauen« dem natürlichen deutschen Sprachgebrauch; die Wiederholung des Namens bleibt erhalten.
- source_word: בִּטְחוּ
  choice: vertraut
  rationale: Der Qal-Imperativ Plural wird knapp und unmittelbar als Aufforderung wiedergegeben.
- source_word: עֶזְרָם
  choice: ihre Hilfe
  rationale: עֵזֶר kann »Hilfe« oder »Helfer« bedeuten. »Hilfe« bewahrt die nominale Form und die vertraute poetische Aussage.
- source_word: וּמָגִנָּם
  choice: und ihr Schild
  rationale: Das konkrete Schutzbild von מָגֵן wird beibehalten und nicht zu »Beschützer« verallgemeinert.
- source_word: הוּא
  choice: Er ist
  rationale: Das selbstständige Pronomen hebt Jahwe als denjenigen hervor, der ihre Hilfe und ihr Schild ist; im Deutschen wird die Kopula ausdrücklich ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel von direkter Anrede zu Possessivformen der dritten Person
  choice: »vertraut … ihre Hilfe und ihr Schild«
  alternative: »vertraut … eure Hilfe und euer Schild«
  rationale: Der hebräische Text verbindet einen Imperativ Plural mit Suffixen der dritten Person Plural. Die Übersetzung bewahrt diesen auffälligen Wechsel, statt ihn stillschweigend an die direkte Anrede anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Die direkte Aufforderung und das Bild des Schildes bleiben erhalten; der ungewöhnliche Wechsel von »ihr« zu »ihre/ihr« folgt bewusst dem Hebräischen.
