base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/013.yaml
  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: de
  text: 'Er wird die segnen, die Jahwe fürchten: die Kleinen zusammen mit den Großen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Begriffe bezeichnen allgemein die Kleinen oder Geringen und die Großen; der Gegensatz legt nicht fest, ob etwa Alter, körperliche Größe oder gesellschaftliche Stellung gemeint ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֵךְ
  choice: Er wird … segnen
  rationale: Das Piel-Imperfekt 3. Person Singular bezeichnet hier im Zusammenhang am ehesten eine zusichernde zukünftige Handlung; das Subjekt ist Jahwe aus dem Kontext.
- source_word: יִרְאֵי יְהוָה
  choice: alle, die Jahwe fürchten
  rationale: Die substantivisch gebrauchte Partizipialverbindung wird idiomatisch wiedergegeben. „Fürchten“ bewahrt sowohl Ehrfurcht als auch Gottesfurcht, ohne den Ausdruck auf bloßen Respekt zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַקְּטַנִּים
  choice: die Kleinen
  rationale: Die substantivierte Adjektivform bleibt bewusst weit und kann geringe Stellung, Bedeutung oder andere Formen des Kleinseins bezeichnen.
- source_word: עִם
  choice: zusammen mit
  rationale: Die Präposition verbindet beide Gruppen ausdrücklich und unterstreicht ihre gemeinsame Einbeziehung.
- source_word: הַגְּדֹלִים
  choice: den Großen
  rationale: Die Wiedergabe erhält den Gegensatz zu „den Kleinen“ und lässt offen, ob vor allem gesellschaftliche Stellung, Bedeutung oder Ansehen gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen unmittelbar; „Jahwe“ bewahrt ihn als persönlichen Namen.
- issue: Aussageweise von יְבָרֵךְ
  choice: Er wird … segnen
  alternative: Er segne …
  rationale: Der Kontext der wiederholten Segenszusicherung in Psalm 115 spricht eher für eine Aussage als für einen Wunsch; die morphologische Möglichkeit eines jussivischen Verständnisses wird dadurch nicht grundsätzlich bestritten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ergänzte „alle“ macht die umfassende Paarformel im Deutschen natürlich verständlich; die Fußnote erläutert die breite Bedeutung des hebräischen Gegensatzpaares.
