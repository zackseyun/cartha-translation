id: PSA.115.9
reference: Psalms 115:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִ֭שְׂרָאֵל בְּטַ֣ח בַּ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/009.yaml
  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: de
  text: Israel, vertraue auf Jahwe![a] Er ist ihre Hilfe und ihr Schild.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Gottesname JHWH, wiedergegeben mit „Jahwe“.
    reason: divine_name
  - marker: b
    text: Der hebräische Text redet Israel zunächst im Singular an („vertraue“) und spricht anschließend von „ihrer“ Hilfe und „ihrem“ Schild.
    reason: grammatical_shift
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Bundesvolk und bleibt als direkte Anrede erhalten.
- source_word: בְּטַח
  choice: vertraue
  rationale: Der hebräische Imperativ steht grammatisch im maskulinen Singular, weil Israel als Gemeinschaft angesprochen wird. Der deutsche Singular bewahrt diese Form.
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: Bei בּטח bezeichnet die Präposition ב den Gegenstand des Vertrauens; im Deutschen ist „auf Jahwe vertrauen“ die natürliche und genaue Verbindung.
- source_word: עֶזְרָם
  choice: ihre Hilfe
  rationale: Das Substantiv עֵזֶר mit Suffix der 3. Person Plural wird konkret als „ihre Hilfe“ wiedergegeben, ohne es zum stärker deutenden „Helfer“ umzubilden.
- source_word: וּמָגִנָּם
  choice: und ihr Schild
  rationale: Die konkrete Schutzmetapher „Schild“ wird bewahrt; das Suffix der 3. Person Plural wird mit „ihr“ wiedergegeben.
- source_word: הוּא
  choice: Er ist
  rationale: Das selbstständige Pronomen hebt Jahwe als Hilfe und Schild hervor; die im Hebräischen unausgesprochene Kopula muss im Deutschen ergänzt werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel von direkter Anrede zu dritter Person Plural
  choice: „vertraue“ … „ihre Hilfe und ihr Schild“
  alternative: „vertraut“ … „eure Hilfe und euer Schild“
  rationale: 'Die gewählte Fassung bewahrt den auffälligen Wechsel des hebräischen Textes: Israel wird als eine Einheit im Singular angeredet, danach wird mit Pluralsuffixen auf seine Angehörigen Bezug genommen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze poetische Parallelismus und die konkrete Schildmetapher bleiben erhalten; der grammatische Wechsel zwischen kollektivem Singular und Pluralbezug wird nicht geglättet.
