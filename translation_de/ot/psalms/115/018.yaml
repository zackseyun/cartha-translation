source:
  edition: WLC
  text: וַ/אֲנַ֤חְנוּ נְבָ֘רֵ֤ךְ יָ֗הּ מֵֽ/עַתָּ֥ה וְ/עַד עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: de
  text: Doch wir werden Jah[a] preisen, von jetzt an bis in Ewigkeit. Preist Jah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Jah“, die kurze poetische Form des Gottesnamens; traditionell wird sie in manchen Übersetzungen mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Hebräisch „Preist Jah!“ Aus diesem Ausdruck ist die liturgische Form „Halleluja“ hervorgegangen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Doch wir
  rationale: Die Konjunktion zusammen mit dem ausdrücklich gesetzten Pronomen bildet einen Gegensatz zu den Toten im vorhergehenden Vers. „Doch wir“ gibt diesen Kontrast im heutigen Deutsch natürlich wieder.
- source_word: נְבָרֵךְ
  choice: werden … preisen
  rationale: Der Piel-Imperfekt in der 1. Person Plural drückt hier die fortdauernde und auf die Zukunft gerichtete Entschlossenheit der lebenden Gemeinschaft aus. Bei Gott bedeutet „preisen“ im Deutschen natürlich und verständlich, ihn anerkennend zu rühmen; das wörtlichere „segnen“ wäre an dieser Stelle missverständlich.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die kurze poetische Form des Gottesnamens. „Jah“ bewahrt diesen Unterschied gegenüber dem vollen Tetragramm und macht zugleich die Bildung von „Halleluja“ erkennbar.
- source_word: מֵעַתָּה
  choice: von jetzt an
  rationale: Die Wendung bezeichnet den gegenwärtigen Zeitpunkt als Beginn einer fortdauernden Handlung und wird so klar und zeitgemäß wiedergegeben.
- source_word: וְעַד עוֹלָם
  choice: bis in Ewigkeit
  rationale: Die hebräische Zeitangabe bezeichnet eine unbegrenzte Dauer. „Bis in Ewigkeit“ ist würdig, geläufig und bewahrt die zeitliche Ausrichtung der Präposition עַד.
- source_word: הַלְלוּ יָהּ
  choice: Preist Jah!
  rationale: Der Pluralimperativ הַלְלוּ und der Kurzname יָהּ werden semantisch transparent übersetzt. Die bekannte liturgische Form „Halleluja“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe der kurzen poetischen Form des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext verwendet zweimal ausdrücklich יָהּ und nicht das volle Tetragramm יהוה. „Jah“ erhält diese textliche und poetische Besonderheit, ohne eine konfessionelle Deutung einzutragen.
- issue: Bedeutung von ברך mit Gott als Objekt
  choice: preisen
  alternative: segnen
  rationale: Das hebräische Verb bedeutet grundsätzlich „segnen“; wenn Menschen Gott „segnen“, bezeichnet es ehrendes Rühmen und Preisen. „Preisen“ vermittelt diese relationale Bedeutung im modernen Deutschen klarer, während „segnen“ den Eindruck erwecken könnte, Menschen verliehen Gott Segen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Kontrast zum vorhergehenden Vers bleibt durch „Doch wir“ deutlich. Der Gottesname wird in seiner kurzen poetischen Form bewahrt; die Schlussaufforderung bleibt knapp und liturgisch kraftvoll.
