base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: de
  text: Hände haben sie, doch sie können nichts ertasten[a]; Füße haben sie, doch sie können nicht gehen; keinen Laut bringen sie aus ihrer Kehle hervor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hände haben sie, doch sie berühren nichts«; das hebräische Verb kann das Tasten oder Berühren mit den Händen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie bringen kein Murmeln aus ihrer Kehle hervor«; das hebräische Verb kann eine leise Äußerung oder ein Murmeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: Hände haben sie
  rationale: Die hebräische Nominalfügung bedeutet wörtlich »ihre Hände«. Die deutsche Formulierung macht den im Hebräischen vorausgesetzten Besitz deutlich und bewahrt zugleich den poetischen Parallelismus.
- source_word: יְמִישׁוּן
  choice: sie können nichts ertasten
  rationale: Die Hifil-Form von מושׁ bezeichnet hier den Gebrauch der Hände zum Tasten oder Berühren. »Nichts ertasten« ist im Deutschen natürlich und bringt die Funktionsunfähigkeit der Götzen zum Ausdruck, ohne bloßes körperliches Empfinden in den Vordergrund zu stellen.
- source_word: רַגְלֵיהֶם
  choice: Füße haben sie
  rationale: Die Wiederholung von »haben sie« gibt die parallele, verblosenartige Struktur verständlich wieder und lässt den Gegensatz zwischen vorhandenen Körperteilen und fehlender Fähigkeit hervortreten.
- source_word: יְהַלֵּכוּ
  choice: sie können nicht gehen
  rationale: Formal steht »sie gehen nicht«. Im Zusammenhang beschreibt die Verneinung jedoch die Unfähigkeit der Götzen; »können nicht gehen« gibt diese Aussage in natürlichem Deutsch wieder.
- source_word: יֶהְגּוּ
  choice: geben keinen Laut von sich
  rationale: הגה kann ein leises Äußern, Murmeln oder allgemeines Hervorbringen eines Lautes bezeichnen. Die gewählte Formulierung wahrt die semantische Breite und passt zur Erwähnung der Kehle.
- source_word: בִּגְרוֹנָם
  choice: mit ihrer Kehle
  rationale: גרון bedeutet »Kehle«. Das instrumentale »mit ihrer Kehle« ist im Deutschen verständlich und bleibt dem hebräischen Bild eng verbunden.
theological_decisions:
- issue: Art der Unfähigkeit der Götzen
  choice: 'Die Verneinungen bei Tasten und Gehen werden als Unfähigkeit wiedergegeben: »können nicht«.'
  alternative: 'Formal enger: »sie ertasten/berühren nicht; sie gehen nicht«.'
  rationale: Der Zusammenhang verspottet die Götzen als macht- und funktionslose Gebilde. Die Wiedergabe mit »können nicht« verdeutlicht diese im Kontext ausgesagte Unfähigkeit, ohne eine zusätzliche Lehrbestimmung einzuführen.
- issue: Umfang von יֶהְגּוּ
  choice: Allgemein als »keinen Laut von sich geben« wiedergegeben.
  alternative: Enger als »murmeln« oder »leise reden« wiedergeben.
  rationale: Das Verb kann verschiedene leise Lautäußerungen bezeichnen. Die allgemeinere Wiedergabe erhält die Aussage völliger Stimmlosigkeit im Kontext, während die lexikalische Alternative in der Fußnote sichtbar bleibt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Parallelstruktur. Die Voranstellung der Körperteile bewahrt den Kontrast des hebräischen Verses; die Formulierungen bleiben für heutige Leser unmittelbar verständlich.
