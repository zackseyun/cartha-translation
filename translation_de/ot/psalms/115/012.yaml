id: PSA.115.12
reference: Psalms 115:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: de
  text: Jahwe hat an uns gedacht[a]; er wird segnen. Er wird das Haus Israel segnen, er wird das Haus Aaron segnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe hat uns im Sinn.“'
    reason: Lexikalische Alternative für זְכָרָנוּ, die den Sinn fortdauernder fürsorglicher Zuwendung hervorhebt.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird in seiner im Deutschen etablierten Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: זְכָרָנוּ
  choice: hat an uns gedacht
  rationale: Das Qal-Perfekt mit Suffix der 1. Person Plural bezeichnet Gottes bereits erwiesenes Gedenken; die natürliche deutsche Wendung bewahrt den unmittelbaren Sinn.
- source_word: יְבָרֵךְ
  choice: er wird segnen
  rationale: Das wiederholte Imperfekt wird im Zusammenhang als zuversichtliche Zukunftsaussage verstanden. Die Wiederholung bleibt als poetische Bekräftigung erhalten.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die formelhafte biblische Bezeichnung wahrt den familiären und gemeinschaftlichen Sinn von בֵּית sowie den Parallelismus.
- source_word: בֵּית אַהֲרֹן
  choice: das Haus Aaron
  rationale: Die Bezeichnung der priesterlichen Familie wird parallel zu „Haus Israel“ ausdrücklich und knapp wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen direkt; die Übersetzung bewahrt ihn, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Modalität von יְבָרֵךְ
  choice: 'Zukunftsaussage: „er wird segnen“'
  alternative: 'Wunsch: „möge er segnen“'
  rationale: Der vorausgehende Perfektsatz begründet hier am ehesten eine zuversichtliche Erwartung. Die formal mögliche Wunschdeutung wird nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „segnen“ und die parallelen Wendungen „Haus Israel“ und „Haus Aaron“ bleiben wegen ihrer liturgisch-poetischen Wirkung erhalten.
