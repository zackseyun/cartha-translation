  text: פֶּֽה לָ֭/הֶם וְ/לֹ֣א יְדַבֵּ֑רוּ עֵינַ֥יִם לָ֝/הֶ֗ם וְ/לֹ֣א יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/005.yaml
  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: de
  text: Sie haben einen Mund, aber sie reden nicht; sie haben Augen, aber sie sehen nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: einen Mund
  rationale: 'Das hebräische Substantiv steht im Singular und wird mit dem pluralischen Besitzerausdruck distributiv gebraucht: Die Götzen haben jeweils einen Mund. Im Deutschen ist „Sie haben einen Mund“ natürlich und wahrt zugleich die Form des Ausgangstextes.'
- source_word: לָהֶם
  choice: sie haben
  rationale: Die Präposition ל mit Pronominalsuffix drückt hier idiomatisch Besitz aus („ihnen ist“ = „sie haben“). Die deutsche Haben-Konstruktion gibt dies klar und natürlich wieder.
- source_word: וְלֹא
  choice: aber … nicht
  rationale: Die Verbindung stellt den sichtbaren Körperteilen deren völlige Funktionslosigkeit gegenüber. „Aber“ bringt diesen Kontrast im Deutschen treffend zum Ausdruck.
- source_word: יְדַבֵּרוּ
  choice: reden
  rationale: Das Piel von דבר bezeichnet hier das Sprechen. „Reden“ ist in diesem Zusammenhang natürlich, würdevoll und entspricht dem poetischen Parallelismus.
- source_word: עֵינַיִם
  choice: Augen
  rationale: Die hebräische Dualform bezeichnet die Augen und wird im Deutschen regulär mit dem Plural „Augen“ wiedergegeben.
- source_word: יִרְאוּ
  choice: sehen
  rationale: Das Qal von ראה bezeichnet die Fähigkeit des Sehens. „Sehen“ bildet die sinnliche Unfähigkeit der Götzen präzise ab.
theological_decisions:
- issue: Bezug der pluralischen Pronomen
  choice: Die Pronomen werden auf die im vorausgehenden Kontext genannten Götzen bezogen und mit „sie“ wiedergegeben.
  alternative: Die hebräische Besitzkonstruktion formal als „Ein Mund ist ihnen … Augen sind ihnen …“ beibehalten.
  rationale: Der Vers setzt die Beschreibung der Götzen fort. Die persönliche Pronominalform gehört zur polemischen Darstellung des Psalms; die natürliche deutsche Wiedergabe verdeutlicht sie, ohne zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Rhythmus. Die Wiederholung von „sie haben“ macht den Parallelismus und den Kontrast deutlich.
