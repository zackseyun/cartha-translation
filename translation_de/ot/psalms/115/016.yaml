base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/016.yaml
  text: The heavens are Yahweh's heavens[c][b][a], but the earth he has given to the sons of man.
translation:
  language: de
  text: Der Himmel, ja, der Himmel gehört Jahwe[a]; doch die Erde hat er den Menschen[b] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische wiederholt das Wort für „Himmel“ zur Hervorhebung.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Söhnen des Menschen“; eine hebräische Bezeichnung für Menschen insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם שָׁמַיִם
  choice: Der Himmel, ja, der Himmel
  rationale: Die Wiederholung wird im Deutschen ausdrücklich bewahrt; „ja“ macht ihre hervorhebende Funktion natürlich verständlich. Das hebräische שָׁמַיִם steht der Form nach im Plural, bezeichnet hier aber den Himmel als Bereich und wird deshalb idiomatisch im deutschen Singular wiedergegeben.
- source_word: לַיהוָה
  choice: gehört Jahwe
  rationale: Die Präposition לְ bezeichnet hier Zugehörigkeit oder Besitz. „gehört“ bildet diese Beziehung in natürlichem Deutsch ab; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְהָאָרֶץ
  choice: doch die Erde
  rationale: וְ kann „und“ bedeuten; im antithetischen Parallelismus bringt „doch“ den Gegensatz zwischen Himmel und Erde klar zum Ausdruck.
- source_word: נָתַן
  choice: hat er ... gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit fortbestehender Wirkung. Das im Hebräischen enthaltene Subjekt verweist im Zusammenhang auf Jahwe.
- source_word: לִבְנֵי אָדָם
  choice: den Menschen
  rationale: Die feste hebräische Wendung „Söhne Adams/des Menschen“ bezeichnet die Menschen insgesamt. „den Menschen“ gibt diesen Sinn in gegenwärtigem Deutsch klar und ohne unnötig altertümliche Färbung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Bedeutungsumfang von בְנֵי אָדָם
  choice: den Menschen
  alternative: den Söhnen Adams / den Menschenkindern
  rationale: Die Wendung ist grammatisch männlich formuliert, meint aber die Menschheit beziehungsweise menschliche Wesen allgemein. Die Fußnote bewahrt die wörtliche Bildform.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Hervorhebung. Die Wiederholung des Hebräischen bleibt hörbar, während „Menschen“ die feste hebräische Wendung verständlich wiedergibt.
