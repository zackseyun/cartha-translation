  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/008.yaml
  text: Those who make them become like them[b][a], as does everyone who trusts in them.
translation:
  language: de
  text: Wie sie werden ihre Hersteller sein; ebenso alle, die auf sie vertrauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder beim ersten Verb: »sind«. Das hebräische Verb kann hier »sein« oder »werden« bedeuten. Gemeint ist die Ähnlichkeit mit den zuvor beschriebenen Götzenbildern: Sie können nicht reden, sehen, hören oder handeln.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: wie sie
  rationale: Die Vergleichspartikel mit Suffix bezeichnet die Ähnlichkeit mit den in den vorhergehenden Versen beschriebenen Götzen. Die knappe Form wahrt den Bezug.
- source_word: יִהְיוּ
  choice: werden
  rationale: היה kann hier sowohl »sein« als auch »werden« bedeuten. Im Deutschen bewahrt »werden« in der Verbindung »wie sie werden« die mögliche resultative Bedeutung, ohne eine ausführliche Deutung einzutragen.
- source_word: עֹשֵׂיהֶם
  choice: ihre Hersteller
  rationale: Das substantivisch gebrauchte Partizip bezeichnet diejenigen, die die Götzen anfertigen. »Hersteller« ist knapp, verständlich und gibt den Plural wieder.
- source_word: כֹּל אֲשֶׁר
  choice: jeder, der
  rationale: Die Wendung hat umfassenden Sinn und wird im modernen Standarddeutsch natürlich mit »jeder, der« wiedergegeben.
- source_word: בֹּטֵחַ בָּהֶם
  choice: auf sie vertraut
  rationale: בטח mit ב bezeichnet das Setzen von Vertrauen auf etwas oder jemanden. »Auf sie vertraut« ist im Deutschen idiomatisch und wahrt den religiösen Zusammenhang.
theological_decisions:
- issue: Art der Ähnlichkeit mit den Götzen
  choice: Der Haupttext stellt die Ähnlichkeit fest, ohne ihre einzelnen Aspekte zu bestimmen.
  alternative: Die Ähnlichkeit ausdrücklich als geistliche Empfindungslosigkeit oder Ohnmacht erklären.
  rationale: Der Vers selbst erläutert die Ähnlichkeit nicht; ihr unmittelbarer Kontext sind jedoch die stummen, blinden, tauben und machtlosen Götzen der vorhergehenden Verse. Diese Spannung bleibt im Text erhalten und wird nur in der Fußnote erschlossen.
- issue: Sein oder Werden
  choice: »werden«
  alternative: »sind« beziehungsweise »werden sein«
  rationale: Das hebräische יִהְיוּ ist formal imperfektiv und kann »sein/werden« ausdrücken. »Werden« bringt die wahrscheinliche resultative Warnung zur Geltung; die lexikalische Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Knappe, poetische und würdige Formulierung in modernem Standarddeutsch. Die Voranstellung »Wie sie« bildet die hebräische Hervorhebung nach. Das singuläre »jeder« folgt dem hebräischen כֹּל אֲשֶׁר mit dem singularischen Partizip.
