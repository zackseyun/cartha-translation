  terminology: „Jahwe“ ist im Deutschen eine etablierte Form des Gottesnamens. „Ehre“, „beständige Liebe“ und „Treue“ sind terminologisch verständlich, quellentreu und nicht konfessionell einengend. Der Fußnotenanker steht unmittelbar bei „Treue“, also bei dem erläuterten Ausdruck.
