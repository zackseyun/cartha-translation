  source_fidelity: Die Übersetzung bildet die emphatische Wiederholung לֹא לָנוּ korrekt ab und gibt den Gegensatz zu Gottes Namen angemessen wieder. „Jahwe“ entspricht dem ausdrücklich gebrauchten Tetragramm. „Beständige Liebe“ für חֶסֶד und „Treue“ für אֱמֶת treffen im poetischen Parallelismus den wahrscheinlichen Sinn; die lexikalisch mögliche Bedeutung „Wahrheit“ ist sachgerecht angemerkt. Die zweimalige kausale Wendung „um ... willen“ gibt עַל in diesem Kontext idiomatisch wieder.
