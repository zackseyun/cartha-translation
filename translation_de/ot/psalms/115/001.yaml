source:
  edition: WLC
  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: de
  text: Nicht uns, Jahwe, nicht uns, sondern deinem Namen gib Ehre – um deiner beständigen Liebe willen, um deiner Treue[a] willen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wahrheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen gebräuchlichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: Nicht uns ... nicht uns
  rationale: Die wörtliche Wiederholung bewahrt die nachdrückliche Zurückweisung jedes eigenen Anspruchs auf Ehre.
- source_word: כִּי לְשִׁמְךָ תֵּן כָּבוֹד
  choice: sondern deinem Namen gib Ehre
  rationale: Nach der doppelten Verneinung wird כִּי hier als kontrastive Hinwendung verstanden. „Gib Ehre“ erhält die konkrete hebräische Formulierung; „deinem Namen“ bezeichnet Gottes offenbarten Charakter und Ruf, ohne dies im Text auszudeuten.
- source_word: עַל חַסְדְּךָ
  choice: um deiner beständigen Liebe willen
  rationale: חֶסֶד bezeichnet verlässliche, bleibende und bundestreue Zuwendung. „Beständige Liebe“ ist verständlich und vermeidet sowohl archaische als auch konfessionell verengende Begriffe.
- source_word: עַל אֲמִתֶּךָ
  choice: um deiner Treue willen
  rationale: אֱמֶת bezeichnet hier parallel zu חֶסֶד besonders Gottes Verlässlichkeit. Die ebenso mögliche Bedeutung „Wahrheit“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ wahrt diesen Eigennamen in einer geläufigen deutschen Form, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von אֲמִתֶּךָ neben חַסְדְּךָ
  choice: deine Treue
  alternative: deine Wahrheit
  rationale: In der festen Verbindung mit חֶסֶד hebt אֱמֶת häufig Verlässlichkeit und Treue hervor. Da „Wahrheit“ lexikalisch ebenfalls möglich ist, bleibt diese Lesart in einer Fußnote sichtbar.
- issue: Funktion von כִּי nach der doppelten Verneinung
  choice: sondern
  alternative: denn; ja
  rationale: 'Im Zusammenhang markiert כִּי am natürlichsten den positiven Gegensatz: Die Ehre soll nicht den Betenden, sondern Gottes Namen gelten. Die anschließenden עַל-Ausdrücke nennen die Begründung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Wiederholung. Der Gedankenstrich gliedert die Bitte von ihrer zweifachen Begründung; die wiederholte Wendung „um ... willen“ spiegelt den Parallelismus des Hebräischen.
