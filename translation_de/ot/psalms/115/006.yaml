  source_fidelity: Der Entwurf gibt die hebräischen Besitzprädikationen und die verneinten Wahrnehmungsfähigkeiten präzise wieder. „Ohren“ entspricht אָזְנַיִם; „eine Nase“ bewahrt angemessen den im Hebräischen singularischen אַף in distributivem Bezug auf die pluralischen Götzenbilder. Die Stellung der Körperteile und die knappe Parallelität bleiben erhalten.
  naturalness: „Ohren haben sie, doch sie hören nicht; eine Nase haben sie, doch sie riechen nicht“ ist klares, modernes und zugleich würdiges Standarddeutsch. Der distributive Singular „eine Nase“ ist hier verständlich und stilistisch tragfähig; er unterstreicht neben „Ohren“ sogar die körperliche Bildlichkeit.
  terminology: Die Begriffe sind unmarkiert und sachgerecht. „Doch“ ist gegenüber dem formalen hebräischen „und nicht“ eine zulässige natürliche Wiedergabe des polemischen Kontrasts, ohne den Sinn zu erweitern. Die konkrete Darstellung der Götzen wird beibehalten und nicht theologisch überdeutet.
