source:
  edition: WLC
  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יִשְׁמָ֑עוּ אַ֥ף לָ֝/הֶ֗ם וְ/לֹ֣א יְרִיחֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/006.yaml
  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: de
  text: Ohren haben sie, doch sie hören nicht; eine Nase haben sie, doch sie riechen nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: Ohren
  rationale: Der Dual bezeichnet hier die Hörorgane; der deutsche Plural gibt die konkrete Körperteilbeschreibung natürlich wieder.
- source_word: לָהֶם
  choice: haben sie
  rationale: Die Präposition ל mit Suffix bildet hier eine Besitzkonstruktion, die im Deutschen idiomatisch mit „haben sie“ ausgedrückt wird.
- source_word: יִשְׁמָעוּ
  choice: hören
  rationale: Das Qal-Imperfekt von שׁמע bezeichnet in diesem Zusammenhang die fehlende Fähigkeit der Götzen, mit ihren Ohren zu hören.
- source_word: אַף
  choice: eine Nase
  rationale: אַף steht formal im Singular und bezeichnet hier konkret die Nase. Der Singular wird bewahrt, da er im Deutschen bei einem pluralischen Subjekt distributiv und natürlich verstanden wird.
- source_word: יְרִיחוּן
  choice: riechen
  rationale: Die Form bezeichnet hier die Sinneswahrnehmung des Riechens; „riechen“ erhält die knappe Parallelität des Hebräischen.
- source_word: וְלֹא
  choice: doch … nicht
  rationale: Wörtlich „und nicht“; „doch … nicht“ macht den im Hebräischen angelegten Kontrast zwischen vorhandenen Organen und fehlender Fähigkeit in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Anthropomorphe Beschreibung der Götzen
  choice: Konkrete Darstellung vorhandener Sinnesorgane ohne entsprechende Wahrnehmungsfähigkeit
  alternative: Deutende Wiedergabe, die ausdrücklich ihre geistliche Ohnmacht hervorhebt
  rationale: Der hebräische Text entfaltet seine Polemik durch konkrete Körperbilder. Die wörtlich-konkrete Wiedergabe bewahrt diese rhetorische Wirkung, ohne zusätzliche theologische Deutung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, paralleler Satzstruktur. Die Voranstellung der Körperteile spiegelt den hebräischen Fokus; „doch“ gibt den ironischen Gegensatz natürlich wieder.
