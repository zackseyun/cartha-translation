id: PSA.115.3
reference: Psalms 115:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וֵֽ/אלֹהֵ֥י/נוּ בַ/שָּׁמָ֑יִם כֹּ֭ל אֲשֶׁר חָפֵ֣ץ עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: de
  text: Doch unser Gott ist im Himmel[b]; er tut alles, was ihm gefällt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er tut alles, was er will.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in den Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: Doch unser Gott
  rationale: 'Das ו wird im Zusammenhang adversativ verstanden: Der lebendige Gott wird den machtlosen Götzen gegenübergestellt. „Doch“ gibt diesen Kontrast natürlich wieder.'
- source_word: בַשָּׁמַיִם
  choice: ist im Himmel
  rationale: Der hebräische Ausdruck steht formal im Plural („in den Himmeln“). Im modernen Standarddeutsch bezeichnet „im Himmel“ denselben Bereich idiomatisch und würdevoll; die Form des Hebräischen wird in einer Fußnote kenntlich gemacht.
- source_word: כֹּל אֲשֶׁר
  choice: alles, was
  rationale: Die Wendung bezeichnet uneingeschränkt die Gesamtheit dessen, worauf sich das folgende Verb bezieht. „Alles, was“ entspricht der hebräischen Konstruktion eng und klingt natürlich.
- source_word: חָפֵץ
  choice: ihm gefällt
  rationale: חפץ kann Gefallen, Begehren oder Wollen ausdrücken. „Was ihm gefällt“ bewahrt die Bedeutung des Gefallens, ohne den Ausdruck vorschnell als theologischen Fachbegriff für den Willen festzulegen.
- source_word: עָשָׂה
  choice: er tut
  rationale: Die hebräische Perfektform formuliert hier im Kontext eine allgemeine Aussage über Gottes wirksames Handeln. Das deutsche Präsens gibt diesen gnomischen Sinn angemessen wieder.
theological_decisions:
- issue: Formulierung der göttlichen Souveränität
  choice: er tut alles, was ihm gefällt
  alternative: er tut alles, was er will
  rationale: Der Vers stellt Gottes freie und wirksame Handlungsmacht der Ohnmacht der Götzen gegenüber. Die gewählte Formulierung wahrt diese Aussage und zugleich die Bedeutungsbreite von חפץ, ohne eine bestimmte systematisch-theologische Deutung einzutragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Doch“ markiert den Kontrast zum Kontext; „im Himmel“ ist idiomatisch, während die hebräische Pluralform in der Fußnote erhalten bleibt.
