source:
  edition: WLC
  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: de
  text: Haus Aaron, vertraut auf Jahwe! Er ist ihre[a] Hilfe und ihr Schild.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre“. Das Hebräische wechselt hier von der direkten Anrede („vertraut“) zur dritten Person; sinngemäß kann man auch „eure“ verstehen.'
    reason: grammatical_shift
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: Haus Aaron
  rationale: Die wörtliche Wendung bewahrt die hebräische Bezeichnung des priesterlichen Geschlechts und den Parallelismus des Psalms.
- source_word: בִּטְחוּ בַיהוָה
  choice: vertraut auf Jahwe
  rationale: Der Pluralimperativ wird direkt wiedergegeben; „auf jemanden vertrauen“ ist im modernen Deutschen die natürliche Verbindung.
- source_word: עֶזְרָם
  choice: ihre Hilfe
  rationale: Das Substantiv עֵזֶר trägt ein Suffix der 3. Person Plural. Daher wird der im Hebräischen auffällige Wechsel von der direkten Anrede zu „ihre“ bewahrt.
- source_word: וּמָגִנָּם
  choice: und ihr Schild
  rationale: „Schild“ erhält das konkrete und im Psalter häufige Schutzbild des hebräischen מָגֵן.
- source_word: הוּא
  choice: Er ist
  rationale: Das selbstständige Pronomen wird als betontes Subjekt der nominalen Aussage wiedergegeben; das im Deutschen erforderliche „ist“ wird ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel von der zweiten zur dritten Person
  choice: „vertraut … ihre Hilfe“
  alternative: „vertraut … eure Hilfe“
  rationale: Die hebräische Form wechselt vom Imperativ der 2. Person Plural zu Possessivsuffixen der 3. Person Plural. Dieser grammatische und rhetorische Wechsel wird nicht stillschweigend harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Anrede „Haus Aaron“ erhält den poetischen Parallelismus; ein altertümliches „O“ wird vermieden.
