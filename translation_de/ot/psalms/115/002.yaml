id: PSA.115.2
reference: Psalms 115:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֭/מָּה יֹאמְר֣וּ הַ/גּוֹיִ֑ם אַיֵּה נָ֝֗א אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: de
  text: 'Warum sollen die Völker sagen[a]: »Wo ist denn ihr Gott?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum sagen die Völker: ›Wo ist ihr Gott jetzt?‹«'
    reason: 'Lexikalisch-grammatische Alternative: Das Imperfekt kann präsentisch beziehungsweise wiederholt verstanden werden; נָא kann durch »jetzt« wiedergegeben werden.'
lexical_decisions:
- source_word: לָמָּה
  choice: Warum sollen
  rationale: Leitet zusammen mit dem Imperfekt eine rhetorische Frage ein. »Warum sollen« gibt den Einwand gegen den Spott der Völker im Deutschen natürlich wieder, ohne ihn als bloße Zukunftsaussage zu verstehen.
- source_word: יֹאמְרוּ
  choice: sagen
  rationale: Qal Imperfekt, 3. Person Plural, von אמר. In Verbindung mit »Warum sollen« bezeichnet es hier den möglichen beziehungsweise wiederholten Spott.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Bezeichnet hier die fremden Völker im Gegenüber zu Israel. »Die Völker« ist direkt und vermeidet die später stärker konfessionell geprägte Bezeichnung »Heiden«.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Lokales Fragewort; die deutsche Formulierung ergänzt entsprechend der Zielsprache die Kopula.
- source_word: נָא
  choice: denn
  rationale: Die Partikel verstärkt hier die spöttische Frage und ist keine höfliche Bitte. »Denn« vermittelt im Deutschen den herausfordernden, drängenden Ton; die zeitliche Wiedergabe »jetzt« bleibt als Alternative in der Fußnote erhalten.
- source_word: אֱלֹהֵיהֶם
  choice: ihr Gott
  rationale: Die Form bezeichnet in diesem Zusammenhang den Gott Israels im Singular. Die Großschreibung macht den konkreten Bezug deutlich.
theological_decisions:
- issue: Bezug von אֱלֹהֵיהֶם
  choice: ihr Gott
  alternative: ihr Gott beziehungsweise ihre Gottheit mit generischer Kleinschreibung
  rationale: Die Völker verspotten Israel, indem sie nach Israels Gott fragen. Die Großschreibung kennzeichnet diesen konkreten Bezug, ohne dem Text eine zusätzliche dogmatische Aussage hinzuzufügen.
- issue: Modaler oder gegenwärtiger Sinn von לָמָּה יֹאמְרוּ
  choice: Warum sollen die Völker sagen
  alternative: Warum sagen die Völker
  rationale: Der hebräische Imperfekt lässt im rhetorischen Zusammenhang sowohl eine modale als auch eine gegenwärtig-wiederholte Auffassung zu. Der Haupttext bewahrt den Einwandston mit »sollen«; die Fußnote nennt die ebenfalls mögliche präsentische Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede verwendet deutsche Anführungszeichen; »denn« erhält im Haupttext den spöttisch-herausfordernden Ton, während die Fußnote die zeitlichere Wiedergabe »jetzt« bewahrt.
