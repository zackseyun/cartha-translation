  text: בְּרוּכִ֣ים אַ֭תֶּם לַ/יהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/015.yaml
  text: May you be blessed by Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: de
  text: Ihr seid von Jahwe gesegnet[a], dem Schöpfer von Himmel und Erde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Gesegnet seid ihr von Jahwe“; als Segensformel kann der Satz auch heißen: „Möget ihr von Jahwe gesegnet sein.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Schöpfer der Himmel und der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם
  choice: Ihr seid … gesegnet
  rationale: Das passive Partizip mit ausdrücklichem Pluralpronomen wird als natürliche deutsche Segensaussage wiedergegeben. Die Form kann im Zusammenhang zugleich den Charakter eines Segenswunsches tragen; diese Spannung wird in einer Fußnote offengelegt.
- source_word: לַיהוָה
  choice: von Jahwe
  rationale: Die Präposition ל bezeichnet in dieser Segensformel sinngemäß die Quelle beziehungsweise den Urheber des Segens. „Von“ ist dafür im Deutschen idiomatisch.
- source_word: עֹשֵׂה
  choice: dem Schöpfer
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet Jahwe als den, der Himmel und Erde gemacht hat. „Schöpfer“ bewahrt den titularen Charakter und schließt als Apposition natürlich an.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: Himmel und Erde
  rationale: Die feste deutsche Wortverbindung gibt den hebräischen Merismus natürlich wieder und bezeichnet die gesamte Schöpfung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussage oder Segenswunsch
  choice: Ihr seid … gesegnet
  alternative: Möget ihr … gesegnet sein
  rationale: Die gewählte Fassung bildet die verblos-partizipiale hebräische Aussage formal näher ab. Da sie im Kontext als Segensformel auch Wunschcharakter haben kann, wird die alternative Deutung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Segensaussage bleibt knapp und feierlich; „Jahwe“ bewahrt den im Ausgangstext ausdrücklich verwendeten Gottesnamen.
