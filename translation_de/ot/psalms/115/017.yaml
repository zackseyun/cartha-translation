  text: לֹ֣א הַ֭/מֵּתִים יְהַֽלְלוּ יָ֑הּ וְ֝/לֹ֗א כָּל יֹרְדֵ֥י דוּמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
translation:
  language: de
  text: Die Toten loben Jah nicht; und auch keiner[a] von denen, die ins Schweigen[b] hinabsteigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen „alle“. Unter der Verneinung hat das Wort hier distributiven Sinn: keiner von ihnen.'
    reason: lexical_alternative
  - marker: b
    text: „Schweigen“ ist eine poetische Bezeichnung für den Zustand oder Bereich des Todes; manche verstehen damit genauer das Grab oder das Totenreich.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  choice: die Toten
  rationale: Die substantivierte Form bezeichnet verstorbene Menschen allgemein; „die Toten“ ist im Deutschen natürlich und präzise.
- source_word: יְהַלְלוּ
  choice: loben
  rationale: Das Piel von הלל bedeutet hier „loben“ und bewahrt den sprachlichen Bezug zum Lob Jahs.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die poetische Kurzform des Gottesnamens und wird nicht mit dem vollständigen Tetragramm gleichgesetzt.
- source_word: כָּל
  choice: keiner
  rationale: Im Geltungsbereich der Verneinung hat כָּל distributiven Sinn. „Auch keiner von denen“ gibt ihn im Deutschen natürlicher wieder als das formal wörtliche „auch nicht alle“.
- source_word: יֹרְדֵי
  choice: die … hinabsteigen
  rationale: Das Partizip von ירד charakterisiert allgemein diejenigen, die hinabsteigen; die deutsche Relativkonstruktion ist klar und bewahrt das Bild.
- source_word: דוּמָה
  choice: Schweigen
  rationale: Das Wort bezeichnet hier poetisch das Schweigen beziehungsweise den stillen Bereich des Todes. „Schweigen“ erhält das Bild, ohne es im Haupttext als Grab oder Scheol festzulegen.
theological_decisions:
- issue: Ob der Vers als umfassende Lehraussage über den Zustand nach dem Tod oder als poetische Rede vom Schweigen des Todes wiederzugeben ist
  choice: 'Die poetische Aussage bleibt ohne dogmatische Erweiterung stehen: Die Toten loben Jah nicht und steigen ins Schweigen hinab.'
  alternative: „Schweigen“ im Haupttext ausdrücklich als „Grab“, „Totenreich“ oder „Scheol“ deuten.
  rationale: Der Psalm stellt die lebenden Anbeter den Toten gegenüber und verwendet dabei dichterische Todessprache. Die Übersetzung bewahrt diese Spannung, ohne eine umfassende Lehre über das Bewusstsein nach dem Tod einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Das Semikolon macht den parallelen Gedankenbau sichtbar; „hinabsteigen“ bewahrt das räumliche Bild des Hebräischen.
