  yaml_path: translation/ot/psalms/115/004.yaml
  text: Their idols are silver and gold[a], the work of human hands.
translation:
  language: de
  text: Ihre Götzen sind Silber und Gold, das Werk menschlicher Hände.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Werk der Hände des Menschen“.'
    reason: Die Fußnote macht die konkrete hebräische Genitivkonstruktion sowie die singularisch-allgemeine Form von אָדָם sichtbar.
lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: ihre Götzen
  rationale: עָצָב bezeichnet hier im polemischen Zusammenhang Götzenbilder beziehungsweise Götzen. „Götzen“ macht den religiösen Bezug im Deutschen klar und passt zum Gegensatz zum lebendigen Gott.
- source_word: כֶּסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die beiden Materialbezeichnungen werden unmittelbar und in derselben Koordination wiedergegeben.
- source_word: מַעֲשֵׂה
  choice: ein Werk
  rationale: Das Substantiv bezeichnet ein Werk oder Erzeugnis. Die nominale Form bleibt erhalten und wirkt im Deutschen natürlich.
- source_word: יְדֵי אָדָם
  choice: von Menschenhänden
  rationale: Die idiomatische deutsche Zusammensetzung bewahrt das konkrete Bild der Hände und gibt אָדָם in seinem allgemeinen, menschheitsbezogenen Sinn wieder.
theological_decisions:
- issue: Allgemeine Bedeutung von אָדָם
  choice: Menschenhänden
  alternative: der Hände des Menschen
  rationale: אָדָם meint hier keinen bestimmten Mann, sondern den Menschen im Gegensatz zu Gott. „Menschenhänden“ gibt diesen allgemeinen Sinn prägnant wieder, ohne den theologischen Gegensatz abzuschwächen.
- issue: Sachlicher Charakter der Götzen
  choice: sind Silber und Gold
  alternative: bestehen aus Silber und Gold
  rationale: Die knappe Kopulaform folgt der pointierten hebräischen Aussage und lässt den polemischen Kontrast stehen; eine erklärende Umschreibung ist nicht nötig.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Parallelstruktur und das konkrete Bild menschlicher Hände bleiben erhalten.
