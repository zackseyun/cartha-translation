  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: de
  text: 'Vierzig Jahre lang war mir diese Generation zuwider[a], und ich sagte: »Sie sind ein Volk, das im Herzen in die Irre geht, und sie kannten meine Wege nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »war ich über diese Generation bekümmert«. Das hebräische Verb kann Abscheu, Überdruss oder Bekümmernis ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: Vierzig Jahre lang
  rationale: Die Formulierung gibt die Dauer ausdrücklich und in natürlichem Deutsch wieder.
- source_word: אָקוּט
  choice: war mir … zuwider
  rationale: Die Wendung bewahrt die starke emotionale Kraft des hebräischen Verbs, das Abscheu, Überdruss oder Bekümmernis ausdrücken kann, ohne unnötig drastisch zu klingen.
- source_word: בְּדוֹר
  choice: diese Generation
  rationale: Die Präposition bezeichnet hier den Gegenstand der ablehnenden Haltung. „Diese Generation“ verweist im Zusammenhang natürlich auf die Wüstengeneration.
- source_word: עַם
  choice: ein Volk
  rationale: Der kollektive Singular wird im Deutschen idiomatisch und nah am Hebräischen wiedergegeben.
- source_word: תֹּעֵי לֵבָב
  choice: das im Herzen in die Irre geht
  rationale: Die Übersetzung erhält sowohl den fortdauernden Charakter des Partizips als auch das Herz als Sitz der inneren Ausrichtung.
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: sie haben meine Wege nicht erkannt
  rationale: „Erkannt“ gibt ידע in diesem Zusammenhang als fehlendes Erfassen und Anerkennen von Gottes Wegen wieder; das Perfekt bezeichnet die festgestellte, anhaltend bedeutsame Verfehlung.
- source_word: וָאֹמַר
  choice: und ich sagte
  rationale: Die schlichte Satzverbindung bewahrt die Abfolge des hebräischen Textes.
theological_decisions:
- issue: Gottes Haltung, ausgedrückt durch קוט
  choice: 'Starke Ablehnung: „war mir … zuwider“'
  alternative: „war ich über diese Generation bekümmert“
  rationale: Das hebräische Verb kann Abscheu oder Überdruss ebenso wie Bekümmernis ausdrücken. Der Haupttext wahrt die Schärfe des göttlichen Urteils; die Fußnote erhält die weichere, ebenfalls mögliche Deutung.
- issue: Bedeutung und Aspekt von לֹא יָדְעוּ דְרָכָי
  choice: 'Festgestelltes Versagen: „sie haben meine Wege nicht erkannt“'
  alternative: „sie kannten meine Wege nicht“
  rationale: Das deutsche Perfekt lässt die Aussage als rückblickende Feststellung mit bleibender Bedeutung stehen und legt nicht fest, ob vor allem mangelnde Kenntnis, Einsicht oder Anerkennung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Generation“ ist für heutige Leser klarer als „Geschlecht“, während „im Herzen in die Irre geht“ das hebräische Bild bewahrt.
