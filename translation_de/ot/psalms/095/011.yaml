id: PSA.95.11
reference: Psalms 95:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁר נִשְׁבַּ֥עְתִּי בְ/אַפִּ֑/י אִם יְ֝בֹא֗וּ/ן אֶל מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/011.yaml
  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: de
  text: 'Darum schwor ich in meinem Zorn: »Sie werden nicht in meine Ruhe[b] eingehen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „Wenn sie in meine Ruhe eingehen …“ – eine Schwurformel mit der Bedeutung: „Sie werden nicht in meine Ruhe eingehen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Ruhestätte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Darum
  rationale: Das Wort knüpft hier folgernd an die vorausgehende Schilderung der Verirrung und Auflehnung des Volkes an. „Darum“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: נִשְׁבַּעְתִּי
  choice: schwor ich
  rationale: Der Nifal von שבע bedeutet gewöhnlich „schwören, einen Eid ablegen“. „schwor ich“ ist direkt, idiomatisch und dem gehobenen Ton des Psalms angemessen.
- source_word: בְאַפִּי
  choice: in meinem Zorn
  rationale: אַף bezeichnet wörtlich die Nase, wird aber idiomatisch für heftigen Zorn gebraucht. „in meinem Zorn“ gibt den Sinn klar und würdig wieder.
- source_word: אִם
  choice: nicht
  rationale: 'Nach einer Schwurformel bildet אִם einen elliptischen verneinenden Eid: Wörtlich steht „wenn sie eingehen“, gemeint ist jedoch nachdrücklich, dass sie nicht eingehen werden.'
- source_word: יְבֹאוּן
  choice: werden … eingehen
  rationale: בוא mit אֶל bezeichnet hier das Hineingelangen beziehungsweise Eintreten. „eingehen in“ ist im Deutschen verständlich und bewahrt zugleich die biblische Ausdrucksweise.
- source_word: אֶל
  choice: in
  rationale: Die Präposition bezeichnet die Bewegung auf ein Ziel hin beziehungsweise hinein und wird passend mit „in … eingehen“ wiedergegeben.
- source_word: מְנוּחָתִי
  choice: meine Ruhe
  rationale: מְנוּחָה kann sowohl den Zustand der Ruhe als auch einen Ruheort bezeichnen. „meine Ruhe“ erhält diese Bedeutungsweite und die knappe theologische Aussage des Hebräischen.
theological_decisions:
- issue: Elliptische Schwurformel mit אִם
  choice: 'Explizite Verneinung: „Sie werden nicht … eingehen.“'
  alternative: 'Wörtlich: „Wenn sie in meine Ruhe eingehen …“'
  rationale: Im Hebräischen drückt die unvollständige Wenn-Formel nach „ich schwor“ eine entschiedene Verneinung aus. Die deutsche Übersetzung macht diese tatsächliche Aussage verständlich, während die Fußnote die Form des Originals erkennen lässt.
- issue: Bedeutungsweite von מְנוּחָה
  choice: meine Ruhe
  alternative: meine Ruhestätte / meinen Ruheort
  rationale: Der Ausdruck kann einen Zustand oder einen Ort der Ruhe bezeichnen. „meine Ruhe“ legt den Text nicht unnötig auf nur eine dieser Möglichkeiten fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und feierlich; „eingehen in“ bewahrt die biblische Bildsprache, ohne unverständlich zu wirken.
