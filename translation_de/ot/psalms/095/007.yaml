base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: de
  text: Denn er ist unser Gott, und wir sind das Volk seiner Weide und die Schafe seiner Hand. Heute, wenn[a] ihr auf seine Stimme hört—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heute—wenn ihr doch auf seine Stimme hören würdet!“ Das hebräische Wort kann hier statt einer einfachen Bedingung auch einen dringenden Wunsch oder eine Aufforderung einleiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zur Anbetung ein und entspricht im Deutschen natürlich der erklärenden Funktion.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Gibt die Form mit dem Suffix der ersten Person Plural unmittelbar und idiomatisch wieder.
- source_word: עַם מַרְעִיתוֹ
  choice: das Volk seiner Weide
  rationale: Bewahrt das konkrete Hirtenbild und die enge formale Entsprechung der hebräischen Konstruktverbindung.
- source_word: צֹאן יָדוֹ
  choice: die Schafe seiner Hand
  rationale: Bewahrt die ungewöhnliche, aber verständliche Metapher des hebräischen Textes sowie den Parallelismus; Gottes leitende und schützende Fürsorge bleibt angedeutet, ohne sie auszudeuten.
- source_word: הַיּוֹם
  choice: Heute
  rationale: Natürliche deutsche Wiedergabe und zugleich die rhetorische Scharnierstelle zum folgenden Warnwort.
- source_word: אִם
  choice: wenn
  rationale: Gibt die bedingte Lesart wieder, die in den anschließenden Mahnruf hineinführt; die mögliche Wunsch- beziehungsweise Aufforderungsnuance wird in der Fußnote erhalten.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: ihr auf seine Stimme hört
  rationale: Das deutsche 'auf seine Stimme hören' bewahrt den Hörbezug und lässt zugleich den im Kontext naheliegenden Sinn des Gehorchens mitschwingen, ohne ihn ausdrücklich festzulegen.
theological_decisions:
- issue: Aussagekraft des Schlusssatzes הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ
  choice: 'Als bedingt-mahnender Auftakt wiedergegeben: „Heute, wenn ihr auf seine Stimme hört—“'
  alternative: 'Als Wunsch oder dringende Aufforderung: „Heute—wenn ihr doch auf seine Stimme hören würdet!“'
  rationale: אִם kann neben einer Bedingung in poetisch-mahnendem Zusammenhang einen wunschhaften Ton tragen. Der Haupttext bewahrt den syntaktischen Anschluss an das Verbot im folgenden Vers; die echte Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionellen Hirtenbilder „Volk seiner Weide“ und „Schafe seiner Hand“ bleiben bewusst erhalten. Der Gedankenstrich zeigt an, dass der Satz in Vers 8 weitergeführt wird.
