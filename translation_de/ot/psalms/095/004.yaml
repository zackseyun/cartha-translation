source:
  edition: WLC
  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ מֶחְקְרֵי אָ֑רֶץ וְ/תוֹעֲפ֖וֹת הָרִ֣ים לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/004.yaml
  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: de
  text: In seiner Hand sind die Tiefen der Erde[a], und ihm gehören die Höhen der Berge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die unergründlichen Orte der Erde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Gipfel der Berge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: In seiner Hand
  rationale: Der Relativanschluss bezieht sich auf den HERRN im vorigen Vers. Im Deutschen kann der Vers als fortgesetzter Satz mit „In seiner Hand“ natürlich anschließen; zugleich bleibt das konkrete Bild für Besitz und Herrschaft erhalten.
- source_word: מֶחְקְרֵי
  choice: die Tiefen
  rationale: Das Wort bezeichnet schwer erforschbare, verborgene oder tiefe Bereiche. „Tiefen“ ist im Deutschen poetisch und bildet einen klaren räumlichen Gegensatz zu den Höhen der Berge.
- source_word: אָרֶץ
  choice: der Erde
  rationale: Der Zusammenhang preist Gottes umfassende Herrschaft über die Schöpfung; daher ist „Erde“ gegenüber dem regionaleren „Land“ vorzuziehen.
- source_word: וְתוֹעֲפוֹת
  choice: die Höhen
  rationale: Der Ausdruck bezeichnet Erhebungen oder hochragende Bereiche. „Höhen“ bewahrt die poetische Gegenüberstellung zu „Tiefen“, ohne die Bedeutung unnötig auf Gipfel einzuengen.
- source_word: הָרִים
  choice: der Berge
  rationale: Die bestimmte hebräische Form wird im Deutschen natürlich mit „der Berge“ wiedergegeben und trägt zum umfassenden Schöpfungsbild bei.
- source_word: לוֹ
  choice: ihm gehören
  rationale: Die prädikative Besitzangabe wird im Deutschen mit „ihm gehören“ klar und knapp ausgedrückt; dies entspricht dem Sinn von „sind sein“ in idiomatischerer Form.
theological_decisions:
- issue: Reichweite von Gottes Besitz und Herrschaft in der Schöpfungsbildsprache
  choice: Der Vers beschreibt die umfassende Herrschaft des HERRN über die tiefsten und höchsten Bereiche der Erde.
  alternative: Eine örtlich begrenzte Aussage über das Land Israel und seine Landschaft.
  rationale: Die parallelen räumlichen Extreme sowie der universale Aufruf zur Anbetung im Psalm sprechen für eine kosmische Aussage, ohne dass die poetische Bildsprache in eine systematische Aussage aufgelöst wird.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Parallelstruktur. Die konkrete Hand-Metapher und der poetische Gegensatz zwischen Tiefen und Höhen bleiben erhalten.
