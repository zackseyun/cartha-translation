  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: de
  text: Ihm gehört das Meer[a], denn[b] er hat es gemacht; seine Hände haben das trockene Land geformt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Meer ist sein.“ Hebräisch wörtlich etwa: „dem [ist] das Meer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und er“. Das hebräische Bindewort bedeutet formal „und“, hat hier aber wahrscheinlich begründenden Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: Ihm gehört
  rationale: Die Relativkonstruktion mit לְ bezeichnet hier Besitz oder Zugehörigkeit. „Ihm gehört das Meer“ gibt den Sinn im modernen Deutschen natürlich wieder, ohne die possessive Aussage abzuschwächen.
- source_word: הַיָּם
  choice: das Meer
  rationale: „Meer“ ist die übliche und unmittelbare Entsprechung; „Ozean“ wäre enger und stärker deutend.
- source_word: וְהוּא
  choice: denn er
  rationale: 'Das וְ bedeutet formal „und“, stellt hier aber wahrscheinlich den begründenden Zusammenhang her: Das Meer gehört Gott, weil er es gemacht hat.'
- source_word: עָשָׂהוּ
  choice: hat es gemacht
  rationale: Das Suffix bezieht sich auf das grammatisch maskuline הַיָּם; im Deutschen verlangt das sächliche „Meer“ das Pronomen „es“. „Machen“ entspricht hier dem allgemeinen Schöpfungsverb עשה.
- source_word: וְיַבֶּשֶׁת
  choice: und das Festland
  rationale: יַבֶּשֶׁת bezeichnet das Trockene beziehungsweise Festland im Gegensatz zum Meer. „Festland“ macht diesen poetischen Gegensatz knapp und verständlich.
- source_word: יָדָיו
  choice: seine Hände
  rationale: Das konkrete poetische Bild wird bewahrt und nicht zu „er“ oder „seine Macht“ verflacht.
- source_word: יָצָרוּ
  choice: haben … geformt
  rationale: יצר bezeichnet gestaltendes Formen. „Geformt“ bewahrt die Abgrenzung zum allgemeineren עשה („gemacht“) und klingt im Deutschen natürlich.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Handeln
  choice: „seine Hände haben … geformt“ als poetisches Bild beibehalten
  alternative: „er hat … geformt“ oder „seine Macht hat … geformt“
  rationale: Der hebräische Text nennt ausdrücklich Gottes Hände. Das Bild gehört zur Aussageweise des Psalms und soll weder wörtlich-dogmatisch überdehnt noch erklärend aufgelöst werden.
- issue: Unterscheidung der Schöpfungsverben עשה und יצר
  choice: mit „gemacht“ und „geformt“ unterschiedlich wiedergeben
  alternative: beide Verben gleich wiedergeben
  rationale: Die unterschiedlichen deutschen Verben erhalten die lexikalische Variation und den poetischen Parallelismus, ohne daraus eine weitergehende dogmatische Unterscheidung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Formulierung „Ihm gehört“ betont die Zugehörigkeit; die Umstellung „das Festland haben seine Hände geformt“ bewahrt den poetischen Parallelismus und hebt den Gegensatz zwischen Meer und Festland hervor.
