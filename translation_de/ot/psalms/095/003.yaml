  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: de
  text: Denn Jahwe ist ein großer Gott und ein großer König über alle Götter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über alle göttlichen Wesen« oder »über alle himmlischen Wesen«. Das hebräische Wort אֱלֹהִים kann je nach Zusammenhang Götter, göttliche Wesen oder himmlische Wesen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aufforderung zur Anbetung ein und bewahrt die kausale Funktion.
- source_word: אֵל
  choice: Gott
  rationale: Bezeichnet Jahwe hier unmittelbar als Gott; die Großschreibung entspricht dem deutschen Gebrauch für den Gott Israels.
- source_word: גָּדוֹל
  choice: groß
  rationale: Gibt Größe und erhabenen Rang wieder und bewahrt durch die Wiederholung den Parallelismus beider Satzglieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: וּמֶלֶךְ
  choice: und ein großer König
  rationale: Verbindet die zweite Aussage über Jahwe mit der ersten und bewahrt die parallele Wiederholung von »groß«.
- source_word: עַל
  choice: über
  rationale: Drückt in diesem Vergleich Jahwes Vorrang und Herrschaft gegenüber allen anderen als אֱלֹהִים bezeichneten Wesen aus.
- source_word: כָּל אֱלֹהִים
  choice: alle Götter
  rationale: Bewahrt die naheliegende Bedeutung des hebräischen Plurals und lässt offen, ob falsche Götter, verehrte Mächte oder geistige Wesen gemeint sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֱלֹהִים in der Wendung »über alle Götter«
  choice: Götter
  alternative: göttliche Wesen
  rationale: »Götter« erhält die sprachliche und theologische Spannung des hebräischen Textes, ohne festzulegen, ob damit Götzen, falsche Götter oder wirkliche geistige Wesen gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die klare Satzstellung ist natürlich und bewahrt zugleich die Wiederholung von »groß« sowie den Parallelismus des hebräischen Verses.
