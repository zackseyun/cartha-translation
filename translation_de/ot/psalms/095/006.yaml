source:
  edition: WLC
  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: de
  text: Kommt, lasst uns anbetend niederfallen[a] und uns beugen; lasst uns vor Jahwe niederknien, der uns gemacht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bezeichnet ein tiefes Sich-Niederwerfen als Ausdruck der Verehrung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Kommt
  rationale: Der Imperativ im Plural ruft die versammelte Gemeinschaft zum gemeinsamen Gottesdienst auf; „Kommt“ ist im Deutschen natürlich und liturgisch angemessen.
- source_word: נִשְׁתַּחֲוֶה
  choice: lasst uns anbetend niederfallen
  rationale: Das Verb bezeichnet das tiefe Sich-Niederwerfen vor einem Höheren und trägt hier eindeutig kultischen Sinn. Die Wiedergabe erhält sowohl die körperliche Haltung als auch den Anbetungscharakter.
- source_word: וְנִכְרָעָה
  choice: und uns beugen
  rationale: כרע bezeichnet das Sich-Beugen beziehungsweise Niedersinken. „Uns beugen“ unterscheidet diese Bewegung von dem ausdrücklich folgenden Niederknien, ohne die poetische Reihung einzuebnen.
- source_word: נִבְרְכָה
  choice: lasst uns … niederknien
  rationale: Die masoretische Form ist hier als Kohortativ des Qal von ברך, „knien/niederknien“, zu verstehen. Die Deutung „segnen“ gehört gewöhnlich zum Piel und passt weder zur Vokalisation noch zur Folge der Körperhaltungen in diesem Vers.
- source_word: לִפְנֵי
  choice: vor
  rationale: „Vor“ gibt die räumlich und relational verstandene Gegenwart Jahwes knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: עֹשֵׂנוּ
  choice: der uns gemacht hat
  rationale: Das substantivierte Partizip mit Pluralsuffix bedeutet wörtlich „unser Macher/der uns macht“. „Der uns gemacht hat“ ist modernes, natürliches Deutsch und bewahrt den unmittelbaren Schöpfungsbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ macht ihn im Deutschen als Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von נִבְרְכָה
  choice: lasst uns niederknien
  alternative: lasst uns segnen/preisen
  rationale: Die masoretische Vokalisation weist auf das Qal mit der Bedeutung „knien“; „segnen“ wäre regulär eine Piel-Form. Auch die Parallelität mit Niederfallen und Sich-Beugen stützt „niederknien“. Die fehlerhafte englische Konsultationslesart wird daher nicht übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Die dreifache Abfolge körperlicher Haltungen bleibt erhalten, ohne durch unnötig altertümliche Wendungen belastet zu werden.
