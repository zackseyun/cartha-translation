  source_fidelity: 'Die deutsche Fassung folgt dem masoretischen Hebräisch präzise: בֹּאוּ als „Kommt“, die drei kohortativen Aufforderungen als Niederfallen, Beugen und Niederknien sowie עֹשֵׂנוּ als „der uns gemacht hat“. Besonders korrekt ist die Deutung von נִבְרְכָה als Qal von ברך II („knien“), nicht als Piel „segnen“; damit wird die problematische englische Audit-Lesart zu Recht nicht übernommen.'
  naturalness: „Kommt, lasst uns anbetend niederfallen und uns beugen; lasst uns vor Jahwe niederknien, der uns gemacht hat“ ist natürliches, würdevolles modernes Standarddeutsch. Die Reihung ist poetisch und liturgisch, ohne künstlich zu wirken.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen als Eigenname wieder. „Anbetend niederfallen“ vermittelt die kultische Bedeutung von השתחוה, während „uns beugen“ und „niederknien“ die unterscheidbaren Körperhaltungen sinnvoll erhalten. Die Fußnote ist korrekt verankert und erläutert den ersten Ausdruck sachgerecht.
