id: PSA.95.2
reference: Psalms 95:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נְקַדְּמָ֣ה פָנָ֣י/ו בְּ/תוֹדָ֑ה בִּ֝/זְמִר֗וֹת נָרִ֥יעַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/002.yaml
  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: de
  text: Lasst uns mit Dank vor sein Angesicht treten[a] und ihm mit Liedern zujubeln!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seine Gegenwart“. Hebräisch „vor sein Angesicht“; dies ist eine geläufige Wendung für die persönliche Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: Lasst uns … vor … treten
  rationale: Der Hifil-Kohortativ der 1. Person Plural fordert gemeinsam zum Herantreten beziehungsweise Entgegengehen auf. In Verbindung mit פָנָיו gibt „vor sein Angesicht treten“ die Bewegung und die feierliche Annäherung natürlich wieder.
- source_word: פָנָיו
  choice: sein Angesicht
  rationale: Wörtlich „sein Gesicht/Angesicht“, im Hebräischen häufig eine Bezeichnung für die persönliche Gegenwart. „Angesicht“ bewahrt das konkrete Bild und passt zum gehobenen, aber verständlichen Psalmregister.
- source_word: בְּתוֹדָה
  choice: mit Dank
  rationale: תּוֹדָה kann Dank, Lob oder ein Dankopfer bezeichnen. Der Parallelismus mit musikalischem Jubel spricht hier für den Ausdruck des Dankes; „mit Dank“ ist knapp und idiomatisch.
- source_word: בִּזְמִרוֹת
  choice: mit Liedern
  rationale: זְמִרוֹת bezeichnet gesungene beziehungsweise musikalische Lieder, oft zum Lob. „Lieder“ bleibt breit genug und vermeidet die zu enge Festlegung auf kanonische Psalmen.
- source_word: נָרִיעַ
  choice: lasst uns … zujubeln
  rationale: Der Hifil-Kohortativ bezeichnet einen lauten, freudigen Jubelruf. „Zujubeln“ verbindet die hörbare Äußerung mit ihrer freudigen Ausrichtung und ist im Deutschen natürlicher als „ein Freudengeschrei erheben“.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix bezeichnet die Richtung beziehungsweise den Adressaten des Jubels; „ihm“ gibt dies direkt wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache. „Angesicht“ bewahrt bewusst das hebräische Bild, während „vor … treten“ und „zujubeln“ im heutigen Standarddeutsch natürlich klingen. Die beiden Kohortative werden als gemeinsame Aufforderung wiedergegeben.
