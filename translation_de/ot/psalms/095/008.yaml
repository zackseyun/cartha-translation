id: PSA.95.8
reference: Psalms 95:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תַּקְשׁ֣וּ לְ֭בַבְ/כֶם כִּ/מְרִיבָ֑ה כְּ/י֥וֹם מַ֝סָּ֗ה בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/008.yaml
  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: de
  text: Verhärtet eure Herzen nicht wie bei Meriba[a][c], wie am Tag von Massa[b] in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba bedeutet „Streit“ oder „Hadern“.
    reason: lexical_alternative
  - marker: b
    text: Massa bedeutet „Prüfung“ oder „Erprobung“.
    reason: lexical_alternative
  - marker: c
    text: Siehe 2. Mose 17,7; 4. Mose 20,13 zu den hier angesprochenen Ereignissen in der Wüste.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: Verhärtet ... nicht
  rationale: Die Negationspartikel אַל mit der Verbform drückt ein Verbot aus; der Hifil von קשׁה bedeutet hier „hart machen, verhärten“.
- source_word: לְבַבְכֶם
  choice: eure Herzen
  rationale: Der hebräische Ausdruck steht mit einem Suffix der 2. Person Plural; im Deutschen gibt der Plural „eure Herzen“ die an mehrere Personen gerichtete Aufforderung natürlich wieder.
- source_word: כִּמְרִיבָה
  choice: wie bei Meriba
  rationale: מְרִיבָה bezeichnet hier im Zusammenhang mit Massa und der Wüste den geschichtlich benannten Ort beziehungsweise Vorfall; „bei“ lässt die lokale und ereignishafte Anspielung offen.
- source_word: כְּיוֹם מַסָּה
  choice: wie am Tag von Massa
  rationale: כְּיוֹם führt den zeitlichen Vergleich ein. „Tag von Massa“ folgt der hebräischen Wortfolge ohne ein nicht ausdrücklich vorhandenes „bei“ einzutragen.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist die natürliche standarddeutsche Entsprechung und bewahrt den Exoduskontext.
theological_decisions:
- issue: Sind מְרִיבָה und מַסָּה als Gattungsbegriffe oder als historische Namen wiederzugeben?
  choice: Beide werden als Namen „Meriba“ und „Massa“ wiedergegeben.
  alternative: „wie beim Streit, wie am Tag der Prüfung in der Wüste“
  rationale: Die Verbindung beider Ausdrücke mit der Wüste verweist auf konkrete Ereignisse und Ortsnamen. Die Namensform bewahrt diese intertextuelle Anspielung; die Wortbedeutungen werden in Fußnoten erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe parallele Satzstruktur des Hebräischen bleibt erhalten; die historischen Namen werden nicht paraphrasiert.
