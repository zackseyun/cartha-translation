  source_fidelity: Die Übersetzung gibt die örtlich auf den vorangehenden Vers zurückverweisende Funktion von אֲשֶׁר mit „wo“ angemessen wieder. נִסּוּנִי und בְּחָנוּנִי werden als parallele, aber nicht völlig identisch formulierte Prüfhandlungen wiedergegeben. Das Plusquamperfekt bei „gesehen hatten“ ist kontextuell gut begründet. Der einräumende Anschluss mit „obwohl“ ist eine plausible, idiomatische Auslegung von גַּם im Kontext; die näher am Wortlaut bleibende Möglichkeit wird in der Fußnote transparent gemacht.
  naturalness: „wo eure Väter mich auf die Probe stellten und mich prüften, obwohl sie mein Werk gesehen hatten“ ist flüssiges, modernes Standarddeutsch mit einem würdevollen, zum Psalm passenden Register. Die Wiederaufnahme von „mich“ vor „prüften“ ist natürlich und verdeutlicht die Parallelstruktur.
  terminology: „eure Väter“ wahrt die konkrete männliche Anrede des Hebräischen. „Auf die Probe stellen“ und „prüfen“ treffen den Sinnbereich der beiden Verben gut. „Mein Werk“ ist eine enge und im Deutschen verständliche Wiedergabe des singularischen פָעֳלִי.
