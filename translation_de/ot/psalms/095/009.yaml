  text: אֲשֶׁ֣ר נִ֭סּוּ/נִי אֲבוֹתֵי/כֶ֑ם בְּ֝חָנ֗וּ/נִי גַּם רָא֥וּ פָעֳלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/009.yaml
  text: where your fathers tested me and tried me[b][a], though they had seen my work.
translation:
  language: de
  text: wo eure Väter mich auf die Probe stellten und mich prüften[a], obwohl sie mein Werk gesehen hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich prüften und erprobten“. Die beiden hebräischen Verben haben ähnliche Bedeutungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher ist auch möglich: „wo eure Väter mich auf die Probe stellten; sie prüften mich und sahen auch mein Werk“. Im Zusammenhang ist wahrscheinlich ein einräumender Sinn gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: wo
  rationale: Das Relativwort verweist im Zusammenhang auf den im vorhergehenden Vers genannten Ort und wird daher örtlich wiedergegeben.
- source_word: נִסּוּנִי
  choice: mich auf die Probe stellten
  rationale: Die Wendung gibt das absichtliche Erproben Gottes natürlich und präzise wieder.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Väter
  rationale: Dies entspricht der grammatisch männlichen Form und bewahrt die direkte, geschichtliche Anrede.
- source_word: בְּחָנוּנִי
  choice: mich prüften
  rationale: Das Verb bezeichnet ein Prüfen oder Erproben. Die Wiedergabe erhält die Parallelität zum vorhergehenden Verb, ohne beide gleich zu übersetzen.
- source_word: גַּם
  choice: obwohl
  rationale: 'Im Zusammenhang liegt wahrscheinlich ein einräumender Sinn vor: Sie stellten Gott auf die Probe, obwohl sie sein Wirken bereits gesehen hatten.'
- source_word: רָאוּ
  choice: gesehen hatten
  rationale: Das Plusquamperfekt verdeutlicht, dass das Sehen von Gottes Werk ihrer Prüfung vorausging.
- source_word: פָעֳלִי
  choice: mein Werk
  rationale: Die singularische Kollektivbezeichnung für Gottes Wirken wird eng am Hebräischen wiedergegeben.
theological_decisions:
- issue: Einräumender Sinn des letzten Satzteils
  choice: obwohl sie mein Werk gesehen hatten
  alternative: sie prüften mich und sahen auch mein Werk
  rationale: גַּם bedeutet häufig „auch“ oder „sogar“. Im Kontext ist jedoch wahrscheinlich gemeint, dass die Väter Gott trotz seines bereits erfahrenen Wirkens prüften. Die Fußnote bewahrt die formal nähere Möglichkeit.
- issue: Wiedergabe von אֲבוֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Die wörtliche, männliche Bezeichnung gehört zur geschichtlichen und bündischen Rhetorik des Verses und wird nicht neutralisiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetisch knapper Satzführung. „Auf die Probe stellen“ ist idiomatisch; „prüfen“ bewahrt die hebräische Parallelität. Die echte Mehrdeutigkeit von גַּם wird in einer Fußnote offengehalten.
