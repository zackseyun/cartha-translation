id: PSA.95.1
reference: Psalms 95:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: de
  text: Kommt, lasst uns Jahwe[a] freudig besingen; lasst uns dem Felsen unseres Heils laut zujubeln!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Gottesname יהוה (JHWH) wird traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Kommt
  rationale: Der Imperativ Plural von הלך dient hier idiomatisch als einladender Aufruf. »Kommt« gibt diese auffordernde Funktion im Deutschen natürlich wieder.
- source_word: נְרַנְּנָה
  choice: lasst uns freudig besingen
  rationale: Der Kohortativ von רנן bezeichnet hörbaren, jubelnden Lobpreis. Die Wiedergabe verbindet den Gesang mit der im Verb liegenden Freude.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition kennzeichnet den Adressaten des Lobgesangs. Der Gottesname יהוה wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: נָרִיעָה
  choice: lasst uns … laut zujubeln
  rationale: Der Kohortativ im Hifil von רוע bezeichnet einen lauten Ruf, besonders einen Jubel- oder Siegesruf. »Laut zujubeln« bewahrt sowohl die hörbare Stärke als auch den positiven gottesdienstlichen Zusammenhang.
- source_word: לְצוּר
  choice: dem Felsen
  rationale: צוּר bedeutet wörtlich »Fels« und dient als Gottesmetapher für Beständigkeit, Schutz und Stärke. Der Dativ folgt im Deutschen natürlich aus »zujubeln«.
- source_word: יִשְׁעֵנוּ
  choice: unseres Heils
  rationale: Das Substantiv יֵשַׁע mit dem Suffix der ersten Person Plural bleibt als Nominalausdruck erhalten. »Heil« wahrt die Breite von Rettung und Befreiung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. »Jahwe« bewahrt ihn als Namen; die traditionelle Ersetzung durch »der HERR« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen und die Gottesmetapher »Fels unseres Heils« bleiben erhalten; »freudig besingen« und »laut zujubeln« unterscheiden die beiden Formen hörbaren Lobpreises.
