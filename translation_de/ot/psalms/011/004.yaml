base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: de
  text: Jahwe ist in seinem heiligen Tempel; Jahwe – sein Thron ist im Himmel. Seine Augen sehen; seine Lider prüfen die Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die Söhne des Menschen; gemeint sind die Menschen insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: in seinem heiligen Tempel
  rationale: הֵיכָל kann „Palast“ oder „Tempel“ bedeuten. Im Zusammenhang mit Gottes Thron und heiliger Wohnstätte gibt „heiliger Tempel“ die sakrale Bildsprache angemessen wieder, ohne sie ausdrücklich auf ein irdisches Gebäude festzulegen.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: sein Thron ist im Himmel
  rationale: Das im Hebräischen formal pluralische שָׁמַיִם wird im Deutschen idiomatisch als „Himmel“ wiedergegeben. Die hervorgehobene Wiederholung des Gottesnamens und die nachgestellte Aussage über seinen Thron bleiben erhalten.
- source_word: עֵינָיו יֶחֱזוּ
  choice: Seine Augen sehen
  rationale: חזה bedeutet hier „sehen, schauen“. „Sehen“ ist direkt und gegenwärtig, während die anthropomorphe Rede von Gottes Augen bewahrt wird.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: seine Lider prüfen
  rationale: Die wörtliche poetische Parallele zwischen „Augen“ und „Lidern“ wird nicht zu „Blick“ geglättet. בחן bezeichnet prüfendes Untersuchen oder Erproben; „prüfen“ wahrt diese Bedeutungsbreite.
- source_word: בְּנֵי אָדָם
  choice: die Menschen
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne Adams/des Menschen“, bezeichnet hier aber kollektiv die Menschheit. „Die Menschen“ ist im modernen Deutschen natürlich, inklusiv und inhaltlich genau; die wörtlichere Form wird in einer Fußnote genannt.
theological_decisions:
- issue: Gottes Wohnort und Thron
  choice: 'Die beiden Aussagen stehen nebeneinander: Jahwe ist in seinem heiligen Tempel, und sein Thron ist im Himmel.'
  alternative: „Tempel“ ausschließlich auf den irdischen Tempel oder ausschließlich als Synonym für den Himmel beziehen.
  rationale: Der hebräische Text erklärt die beiden Bilder nicht ausdrücklich für identisch und stellt sie auch nicht gegeneinander. Die Übersetzung bewahrt diese räumliche und theologische Spannung.
- issue: Kollektive Bedeutung von בְּנֵי אָדָם
  choice: die Menschen
  alternative: die Menschensöhne / die Söhne des Menschen
  rationale: Die Wendung umfasst Menschen allgemein. Die Hauptübersetzung gibt diese kollektive Bedeutung in natürlichem Deutsch wieder, ohne das generische Maskulinum als ausschließlich männlich missverständlich werden zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Parallelstruktur und Anthropomorphie. Der Gedankenstrich markiert die hervorgehobene Wiederaufnahme „Jahwe – sein Thron“, ohne den Satzbau unnötig zu glätten.
