source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: de
  text: 'Für den Chorleiter[a]. Von David[b].


    Beim HERRN habe ich Zuflucht gesucht. Wie könnt ihr zu mir sagen: »Flieht auf euren Berg wie ein Vogel!«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Für den musikalischen Leiter.'
    reason: Die genaue Amts- oder Aufführungsbezeichnung von מְנַצֵּחַ ist nicht völlig sicher.
  - marker: b
    text: Die hebräische Form kann auch eine David zugeordnete oder für David bestimmte Dichtung bezeichnen.
    reason: Die Überschrift לְדָוִד lässt neben der üblichen Autorenangabe weitere Zuordnungsnuancen zu.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Wendung bezeichnet wahrscheinlich den musikalischen Leiter bei der Aufführung; »Chorleiter« ist knapp, verständlich und im Psalter als Überschrift natürlich.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die traditionelle und im Kontext naheliegende Wiedergabe; die Präposition ל lässt jedoch auch eine Zuordnung oder Widmung zu.
- source_word: בַּיהוָה
  choice: Beim HERRN
  rationale: Die Verbindung mit חסיתי bezeichnet den HERRN als den, bei dem Schutz gesucht wird. »HERR« gibt den Gottesnamen יהוה gemäß etablierter deutscher Bibelkonvention wieder.
- source_word: חָסִיתִי
  choice: habe ich Zuflucht gesucht
  rationale: Das Perfekt beschreibt das vollzogene Vertrauen bzw. Schutzsuchen; die deutsche Wendung bewahrt das Bild der Zuflucht.
- source_word: לְנַפְשִׁי
  choice: zu mir
  rationale: נפש bezeichnet hier idiomatisch die eigene Person; wörtliches »zu meiner Seele« wäre im modernen Deutsch missverständlich.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Flieht auf euren Berg wie ein Vogel
  rationale: Die Wiedergabe erhält den pluralischen Imperativ und »euren Berg« sowie den überraschenden singularischen Vergleich »wie ein Vogel«, ohne den hebräischen Numerus auszugleichen.
theological_decisions:
- issue: Gottesname יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die konventionelle Wiedergabe ist im modernen deutschen Bibelregister verständlich und macht zugleich kenntlich, dass im Hebräischen der Eigenname Gottes steht, ohne eine unsichere Aussprache festzulegen.
- issue: Bezug von לְנַפְשִׁי
  choice: zu mir
  alternative: zu meiner Seele
  rationale: Der Ausdruck meint hier die ganze Person des Sprechers und setzt keine Trennung von Seele und Körper voraus.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt eindringlich; der ungewöhnliche Wechsel zwischen pluralischer Anrede und singularischem Vogelvergleich wird als Merkmal des hebräischen Textes bewahrt.
