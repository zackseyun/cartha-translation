base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: de
  text: 'Für den Chorleiter.[a] Von David.


    Bei Jahwe suche ich Zuflucht. Wie könnt ihr zu mir[b] sagen: »Flieht auf euren Berg, Vogel!«?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für den Leiter“. Bedeutung und Funktion der hebräischen Bezeichnung sind nicht völlig sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu meiner Seele“, das heißt: zu mir selbst.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Wortlaut ist schwierig. Er hat einen pluralischen Imperativ und ein pluralisches Possessivwort („Flieht auf euren Berg“), daneben aber „Vogel“ im Singular. Möglich ist, „Vogel“ nicht als Anrede, sondern im Sinn von „wie ein Vogel“ zu verstehen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die traditionelle Wiedergabe bezeichnet wahrscheinlich den musikalischen Leiter; die genaue Funktion des Ausdrucks bleibt jedoch unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: חָסִיתִי
  choice: suche ich Zuflucht
  rationale: Das hebräische Perfekt beschreibt hier plausibel eine bestehende Vertrauenshaltung. Das deutsche Präsens gibt diesen gegenwärtigen Sinn natürlich wieder.
- source_word: לְנַפְשִׁי
  choice: zu mir
  rationale: נֶפֶשׁ bezeichnet hier die eigene Person. „Zu mir“ ist im modernen Deutsch idiomatisch; die wörtlichere Form wird in der Fußnote bewahrt.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Flieht auf euren Berg, Vogel!
  rationale: Die ungewöhnliche Verbindung von pluralischem Imperativ und Possessiv mit dem singularischen „Vogel“ wird im Haupttext erhalten, statt die schwierige Syntax stillschweigend zu glätten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Lautung, ohne den Namen durch einen Titel zu ersetzen.
- issue: Zeitliche Nuance von חָסִיתִי
  choice: 'gegenwärtige Vertrauenshaltung: „suche ich Zuflucht“'
  alternative: „habe ich Zuflucht gesucht“
  rationale: Der Kontext stellt das bestehende Vertrauen des Beters dem Fluchtrat gegenüber; die Wiedergabe vermeidet dennoch eine weitergehende dogmatische Ausdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Psalmüberschrift bleibt knapp. Der Hauptsatz ist idiomatisch formuliert, während die auffällige Numerusspannung und die Mehrdeutigkeit des Schlusses bewusst sichtbar bleiben.
