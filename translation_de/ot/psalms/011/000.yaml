  terminology: „Jahwe“, „Chorleiter“ und „Zuflucht suchen“ sind angemessen. „Zu mir“ ist als idiomatische Wiedergabe von „zu meiner Seele“ vertretbar, sofern die wörtliche Form in der Anmerkung erhalten bleibt.
