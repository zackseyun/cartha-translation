    rationale: Der überlieferte Wortlaut enthält נוּדוּ und הַרְכֶם, beides Pluralformen. Gerade die Spannung zu צִפּוֹר im Singular ist Teil der textlichen Schwierigkeit und soll in der Anmerkung benannt statt stillschweigend nivelliert werden.
