id: PSA.11.3
reference: Psalms 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י הַ֭/שָּׁתוֹת יֵֽהָרֵס֑וּ/ן צַ֝דִּ֗יק מַה פָּעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: de
  text: Wenn die Fundamente niedergerissen werden[a], was kann der Gerechte tun?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn die Fundamente werden niedergerissen; was hat der Gerechte getan?“ Das Hebräische erlaubt beim letzten Verb eine stärker vergangenheitsbezogene Wiedergabe.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel kann kausal („denn“) oder konditional verstanden werden. Im Zusammenhang mit der folgenden rhetorischen Frage ergibt „wenn“ einen natürlichen Bedingungssatz, ohne die kausale Möglichkeit zu leugnen.
- source_word: הַשָּׁתוֹת
  choice: die Fundamente
  rationale: Das seltene Substantiv bezeichnet Grund- oder Fundamentstrukturen. „Fundamente“ bewahrt das konkrete Bild und lässt offen, ob soziale, rechtliche oder moralische Grundlagen gemeint sind.
- source_word: יֵהָרֵסוּן
  choice: niedergerissen werden
  rationale: Die Nifal-Form von הרס hat passive Bedeutung. „Niedergerissen werden“ gibt sowohl den Vorgang als auch das Bild eines zerstörten Bauwerks anschaulich wieder.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Singularadjektiv bezeichnet repräsentativ einen gerechten Menschen. Die traditionelle und im Deutschen verständliche Form „der Gerechte“ wahrt den Singular.
- source_word: מַה
  choice: was
  rationale: Das Fragewort leitet unmittelbar die rhetorische Frage ein.
- source_word: פָּעָל
  choice: kann … tun
  rationale: Die Form ist formal ein Qatal („hat getan“), doch im konditionalen Zusammenhang liegt die idiomatische Aussage über die Handlungsmöglichkeit des Gerechten nahe. Die stärker vergangenheitsbezogene Lesart wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutungsumfang der „Fundamente“
  choice: Das Bild bleibt unbestimmt und wird nicht auf eine bestimmte gesellschaftliche, rechtliche oder bundestheologische Ordnung festgelegt.
  alternative: Die Fundamente ausdrücklich als gesellschaftliche Ordnung, Gerechtigkeit oder moralische Grundlagen deuten.
  rationale: Der hebräische Ausdruck ist bildhaft und offen; eine nähere Bestimmung würde eine mögliche Auslegung in den Text eintragen.
- issue: Zeit- und Aussagewert von פָּעָל
  choice: 'Im Haupttext wird die kontextuell naheliegende Frage nach der Handlungsmöglichkeit wiedergegeben: „was kann der Gerechte tun?“'
  alternative: „Was hat der Gerechte getan?“
  rationale: Die Qatal-Form erlaubt formal eine vergangenheitsbezogene Wiedergabe. Der Zusammenhang unterstützt jedoch weithin die modale Deutung; die alternative Lesart bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fundamente“ erhält das konkrete hebräische Bild; „niedergerissen“ ist anschaulich und natürlich. Die knappe rhetorische Form des Verses bleibt gewahrt.
