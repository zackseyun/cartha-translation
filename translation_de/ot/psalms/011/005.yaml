  text: יְהוָה֮ צַדִּ֪יק יִ֫בְחָ֥ן וְ֭/רָשָׁע וְ/אֹהֵ֣ב חָמָ֑ס שָֽׂנְאָ֥ה נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: de
  text: Jahwe prüft den Gerechten; doch den Gottlosen und den, der Gewalt liebt, hasst seine Seele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Flüssiger: „Doch den Gottlosen und den, der Gewalt liebt, hasst er.“ Wörtlich heißt es im Hebräischen „hasst seine Seele“; diese Wendung drückt tiefe persönliche Abscheu aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: צַדִּיק
  choice: den Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet hier in generischer Einzahl den Menschen, der gerecht ist.
- source_word: יִבְחָן
  choice: prüft
  rationale: Das Verb bezeichnet ein prüfendes Untersuchen; „prüft“ ist knapp, natürlich und wahrt den wertenden Sinn.
- source_word: וְרָשָׁע
  choice: den Gottlosen
  rationale: Die substantivierte Bezeichnung steht parallel zu „den Gerechten“ und benennt eine moralische Kategorie.
- source_word: וְאֹהֵב חָמָס
  choice: und den, der Gewalt liebt
  rationale: Die Partizipialform beschreibt einen Menschen, der durch seine Liebe zur Gewalt gekennzeichnet ist.
- source_word: חָמָס
  choice: Gewalt
  rationale: Das Substantiv bezeichnet Gewalt beziehungsweise gewaltsames Unrecht; „Gewalt“ passt unmittelbar in den Zusammenhang.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: hasst seine Seele
  rationale: Die wörtliche Wendung bewahrt die nachdrückliche Aussage über Jahwes tiefste persönliche Abneigung und lässt die anthropomorphe Ausdrucksweise des Hebräischen stehen.
theological_decisions:
- issue: Bezug und Aussagekraft von „seine Seele“
  choice: „Seine Seele“ bezieht sich auf Jahwe und bringt seine tiefe persönliche Abscheu zum Ausdruck.
  alternative: Glättend könnte man nur „hasst er“ übersetzen.
  rationale: Die ausdrückliche Nennung der נֶפֶשׁ wird bewahrt, ohne über die Aussage des Verses hinaus eine Lehre über göttliche Affekte zu formulieren.
- issue: Syntaktischer Umfang des Hasses
  choice: Sowohl „den Gottlosen“ als auch „den, der Gewalt liebt“ werden als Objekte von „hasst seine Seele“ verstanden.
  alternative: Die Anfangsstellung von „den Gottlosen“ könnte oberflächlich als Fortsetzung zu „prüft“ aufgefasst werden.
  rationale: 'Wortstellung, Akzentuierung und Parallelismus stützen den Gegensatz: Jahwe prüft den Gerechten, seine Seele aber hasst den Gottlosen und den Liebhaber der Gewalt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die generischen substantivierten Formen und die markante hebräische Wendung „seine Seele“ bleiben erhalten; eine Fußnote bietet die natürlichere deutsche Glättung.
