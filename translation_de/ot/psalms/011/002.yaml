source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: de
  text: 'Denn sieh: Die Gottlosen spannen den Bogen; sie haben ihren Pfeil auf die Sehne gelegt, um im Dunkeln[a] auf Menschen mit aufrichtigem Herzen zu schießen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Dunkel«. Die hebräische Wendung kann entweder die dunklen Umstände des Angriffs oder das Versteck betonen, aus dem er erfolgt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und wahrt den argumentativen Zusammenhang.
- source_word: הִנֵּה
  choice: sieh
  rationale: Lenkt lebhaft die Aufmerksamkeit auf die unmittelbar drohende Gefahr, ohne altertümlich zu klingen.
- source_word: הָרְשָׁעִים
  choice: die Gottlosen
  rationale: Im Psalter geläufige, würdevolle Bezeichnung für Menschen, deren Handeln sich moralisch gegen Gott und die Gerechten richtet; nicht bloß im juristischen Sinn 'Schuldige'.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: spannen den Bogen
  rationale: Gibt die hebräische Wendung für das kampfbereite Herrichten des Bogens natürlich und anschaulich wieder.
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: sie haben ihren Pfeil auf die Sehne gelegt
  rationale: Bewahrt den singularischen Pfeil und vermittelt konkret das gezielte Bereitmachen zum Schuss.
- source_word: לִירוֹת
  choice: um ... zu schießen
  rationale: Gibt den finalen Infinitiv und die Bedeutung im Bogenschießen unmittelbar wieder.
- source_word: בְּמוֹ אֹפֶל
  choice: im Dunkeln
  rationale: Natürliches Deutsch für einen Angriff unter dunklen, verborgenen Bedingungen; die mögliche Ausgangsbedeutung 'aus dem Dunkel' bleibt in der Fußnote erhalten.
- source_word: לְיִשְׁרֵי לֵב
  choice: auf die ..., die aufrichtigen Herzens sind
  rationale: Bewahrt das hebräische Bild des Herzens als Sitz innerer moralischer Integrität und formuliert es zugleich idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung »sieh« erhält die Dringlichkeit; die traditionelle Psalmensprache »die Gottlosen« und »aufrichtigen Herzens« bleibt allgemein verständlich. Die Bildfolge des Bogenschießens wird konkret und ohne erklärende Zusätze wiedergegeben.
