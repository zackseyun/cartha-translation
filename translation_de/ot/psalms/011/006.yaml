source:
  edition: WLC
  text: יַמְטֵ֥ר עַל רְשָׁעִ֗ים פַּ֫חִ֥ים אֵ֣שׁ וְ֭/גָפְרִית וְ/ר֥וּחַ זִלְעָפ֗וֹת מְנָ֣ת כּוֹסָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: de
  text: Auf die Bösen wird er Fallen regnen lassen; Feuer, Schwefel und sengender Wind werden der Anteil ihres Bechers sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחִים (paḥim)
  choice: Fallen
  rationale: Die Grundbedeutung ist „Fallen“ beziehungsweise „Schlingen“. „Fallen“ gibt den masoretischen Text verständlich wieder und bewahrt das eindringliche Bild, dass das Gericht auf die Bösen herabregnet.
- source_word: רְשָׁעִים (reschaʿim)
  choice: die Bösen
  rationale: Bezeichnet Menschen, die schuldig und gottwidrig handeln. „Die Bösen“ ist in modernem Standarddeutsch unmittelbar verständlich, ohne eine bestimmte konfessionelle Deutung einzutragen.
- source_word: רוּחַ זִלְעָפוֹת (ruaḥ silʿafot)
  choice: sengender Wind
  rationale: Die Wortverbindung bezeichnet einen heftig glühenden beziehungsweise versengenden Wind. „Sengender Wind“ ist knapp, anschaulich und entspricht dem Gerichtsmotiv.
- source_word: מְנָת כּוֹסָם (menat kosam)
  choice: der Anteil ihres Bechers
  rationale: Die Übersetzung erhält das hebräische Becherbild und den Gedanken eines ihnen zugemessenen Loses, statt die Metapher erklärend aufzulösen.
theological_decisions:
- issue: Bildsprache des göttlichen Gerichts
  choice: Die Bilder von herabregnenden Fallen und dem zugeteilten Becher bleiben unverändert nebeneinander stehen.
  alternative: Die Metaphern zu einer allgemeinen Aussage wie „Gott wird sie schwer bestrafen“ auflösen.
  rationale: Der hebräische Text verbindet bewusst mehrere starke Gerichtsbilder. Ihre Spannung und Bildhaftigkeit sollen nicht durch eine dogmatisch oder erklärend vereinheitlichte Wiedergabe abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „Fallen regnen lassen“ wird als bewusstes poetisches Bild beibehalten; „Anteil ihres Bechers“ wahrt die biblische Metapher, bleibt aber grammatisch klar.
