  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: de
  text: Denn Jahwe ist gerecht; er liebt gerechte Taten. Die Aufrichtigen werden sein Angesicht[a] schauen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Angesicht“. Der Ausdruck kann auch seine Gegenwart oder Gunst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, weniger wahrscheinlich: „Sein Angesicht schaut auf die Aufrichtigen.“ Der hebräische Satzbau des letzten Satzteils wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Bezeichnet Jahwes moralisches Wesen und bewahrt die Wortstammverbindung zu צְדָקוֹת („gerechte Taten“).
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְדָקוֹת
  choice: gerechte Taten
  rationale: Der Plural bezeichnet hier am ehesten konkrete Handlungen, die der Gerechtigkeit entsprechen; zugleich bleibt die Verbindung zu „gerecht“ hörbar.
- source_word: אָהֵב
  choice: liebt
  rationale: Die einfache Gegenwartsform beschreibt Jahwes beständige Haltung unmittelbar und idiomatisch.
- source_word: יָשָׁר
  choice: die Aufrichtigen
  rationale: Das Adjektiv wird substantivisch und kollektiv verstanden; die Pluralform des folgenden Verbs stützt die Wiedergabe als Personenmehrzahl.
- source_word: יֶחֱזוּ
  choice: werden … schauen
  rationale: Bewahrt den gehobenen, aber verständlichen Ton des Verbs und gibt die nicht abgeschlossene Verbform in diesem Zusammenhang als Zukunftsaussage wieder.
- source_word: פָנֵימוֹ
  choice: sein Angesicht
  rationale: Bewahrt das konkrete hebräische Bild; mögliche Bedeutungsnuancen wie Gegenwart oder Gunst werden in der Fußnote genannt.
theological_decisions:
- issue: Subjekt und Objekt im letzten Satzteil
  choice: Die Aufrichtigen werden sein Angesicht schauen.
  alternative: Sein Angesicht schaut auf den Aufrichtigen.
  rationale: Die Pluralform יֶחֱזוּ legt nahe, dass die als Kollektiv verstandenen „Aufrichtigen“ das Subjekt sind. Die andere syntaktische Deutung ist möglich und wird deshalb nicht verschwiegen.
- issue: Bedeutungsumfang von „sein Angesicht“
  choice: Das konkrete Bild „sein Angesicht“ bleibt im Haupttext erhalten.
  alternative: seine Gegenwart oder seine Gunst
  rationale: Die wörtliche Bildsprache lässt die theologischen Nuancen offen, statt sie im Haupttext auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, psalmengemäßem Ton. „Angesicht“ ist bewusst etwas gehobener als „Gesicht“, bleibt aber allgemein verständlich und bewahrt die biblische Bildsprache.
