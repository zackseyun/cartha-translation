  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
translation:
  language: de
  text: 'Halleluja![a]

    Lobt Gott in seinem Heiligtum;[b]

    lobt ihn in der Weite seiner Macht![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Halleluja“ bedeutet „Preist Jah!“; „Jah“ ist die Kurzform des hebräischen Gottesnamens. Viele Übersetzungen geben den Gottesnamen mit „HERR“ wieder.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in seiner Heiligkeit“ beziehungsweise „an seiner heiligen Stätte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in der mächtigen Himmelsfeste“ beziehungsweise „in seinem mächtigen Himmelsraum“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Halleluja
  rationale: Die im Deutschen geläufige liturgische Akklamation gibt den hebräischen Aufruf knapp und würdig wieder; die wörtliche Bedeutung und der Kurzname Gottes werden in der Fußnote kenntlich gemacht.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier in der parallelen Aufforderung Gott, ohne dass eine verstärkende Wiedergabe wie „der Allmächtige“ nötig wäre.
- source_word: בְּקָדְשׁוֹ
  choice: in seinem Heiligtum
  rationale: קֹדֶשׁ kann Heiligkeit oder einen heiligen Ort bezeichnen. Der lokale Parallelismus mit בִּרְקִיעַ spricht hier am ehesten für „Heiligtum“; die echte Mehrdeutigkeit bleibt in der Fußnote erhalten.
- source_word: הַלְלוּהוּ
  choice: lobt ihn
  rationale: Der wiederholte Pluralimperativ mit Objektsuffix wird im Deutschen direkt und mit derselben auffordernden Kraft wiedergegeben.
- source_word: בִּרְקִיעַ
  choice: in der Weite
  rationale: רָקִיעַ bezeichnet etwas Ausgebreitetes beziehungsweise die Himmelsfeste. „Weite“ bewahrt das räumliche Bild in verständlichem Deutsch, ohne vorschnell ein bestimmtes kosmologisches Modell festzulegen.
- source_word: עֻזּוֹ
  choice: seiner Macht
  rationale: עֹז bezeichnet Stärke oder Macht. „Macht“ ist in diesem Lobkontext natürlich und erhält die hebräische Genitivverbindung.
theological_decisions:
- issue: Wiedergabe des göttlichen Kurznamens יָהּ
  choice: Halleluja mit erklärender Fußnote
  alternative: Preist Jah! / Lobt den HERRN!
  rationale: יָהּ ist die Kurzform des Gottesnamens. Die traditionelle deutsche Akklamation „Halleluja“ bewahrt den liturgischen Ausdruck; die Fußnote legt Bedeutung und Namensform offen, ohne יָהּ stillschweigend mit der vollen Form יהוה gleichzusetzen.
- issue: Ort beziehungsweise Eigenschaft in בְּקָדְשׁוֹ
  choice: in seinem Heiligtum
  alternative: in seiner Heiligkeit / an seinem heiligen Ort
  rationale: Der räumliche Parallelismus legt einen heiligen Ort nahe, doch die grammatisch mögliche abstrakte Bedeutung „Heiligkeit“ wird nicht ausgeschlossen und daher als Alternative dokumentiert.
- issue: Deutung von רְקִיעַ עֻזּוֹ
  choice: in der Weite seiner Macht
  alternative: an seiner mächtigen Himmelsfeste / in seinem mächtigen Himmelsraum
  rationale: 'Die gewählte Form bewahrt die auffällige hebräische Genitivverbindung und ihre theologische Spannung: Die Weite kann Gottes Macht zugeordnet sein oder sie sichtbar machen. Eine explizit kosmologische oder rein attributive Auflösung wird vermieden.'
translation_notes:
  register: Moderne, verständliche und zugleich liturgisch würdige Standardsprache. Die Wiederholung von „lobt“ und der parallele Aufbau des hebräischen Verses bleiben erhalten. „Halleluja“ wird wegen seiner festen Verankerung im deutschen Gottesdienstwortschatz beibehalten und in der Fußnote transparent erklärt.
