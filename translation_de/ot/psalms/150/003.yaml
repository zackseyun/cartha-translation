base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/003.yaml
  text: Praise him with the blast of the trumpet[a]; praise him with harp and lyre.
translation:
  language: de
  text: Lobt ihn mit dem Schall des Schofars[a]; lobt ihn mit Harfe und Leier!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Blasen des Schofars“. Der Schofar ist ein Horn, häufig ein Widderhorn, das im Gottesdienst und für Signale verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  choice: Lobt ihn
  rationale: Der Pluralimperativ von הלל mit Suffix der 3. Person Singular richtet einen knappen, unmittelbaren Aufruf an die versammelte Gemeinschaft; die Wiederholung wird bewahrt.
- source_word: בְּ/תֵקַע
  choice: mit dem Schall
  rationale: תֵּקַע bezeichnet das Blasen beziehungsweise den dabei hervorgebrachten Hornstoß. „Schall“ gibt hier das hörbare Ereignis natürlich wieder, ohne nur das Instrument zu nennen.
- source_word: שׁוֹפָר
  choice: des Schofars
  rationale: „Schofar“ bewahrt die konkrete Bezeichnung des im Gottesdienst und als Signal verwendeten Horns. Eine Fußnote erklärt den kulturellen Gegenstand.
- source_word: בְּ/נֵבֶל
  choice: mit Harfe
  rationale: נֵבֶל bezeichnet ein Saiteninstrument; „Harfe“ ist eine verständliche, etablierte deutsche Entsprechung, auch wenn die genaue Bauart nicht sicher bestimmbar ist.
- source_word: וְ/כִנּוֹר
  choice: und Leier
  rationale: כִּנּוֹר bezeichnet ein weiteres Saiteninstrument. „Leier“ unterscheidet es von נֵבֶל und erhält die Paarung zweier Instrumente.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. Der kulturspezifische Instrumentenname „Schofar“ bleibt im Text erhalten und wird knapp erklärt; das abschließende Ausrufezeichen trägt dem fortgesetzten Lobaufruf des Psalms Rechnung.
