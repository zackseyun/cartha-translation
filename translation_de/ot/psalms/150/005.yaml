  text: הַֽלְל֥וּ/הוּ בְ/צִלְצְלֵי שָׁ֑מַע הַֽ֝לְל֗וּ/הוּ בְּֽ/צִלְצְלֵ֥י תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/005.yaml
  text: Praise him with sounding cymbals[b][a]; praise him with clashing cymbals.
translation:
  language: de
  text: Lobt ihn mit hell klingenden Zimbeln; lobt ihn mit schallenden Zimbeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Zimbeln des Jubelrufs«; das hebräische Wort kann einen Jubelruf, einen Signalstoß oder lauten Schall bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Lobt ihn
  rationale: Der Pluralimperativ von הלל mit Suffix der 3. Person maskulin Singular richtet einen unmittelbaren Aufruf an die versammelte Gemeinschaft. Die Wiederholung wird beibehalten.
- source_word: בְצִלְצְלֵי
  choice: mit … Zimbeln
  rationale: Die Präposition ב ist hier instrumental gebraucht. „Mit Zimbeln“ ist im Deutschen natürlich und gibt das Mittel des Lobpreises wieder.
- source_word: שָׁמַע
  choice: hell klingenden
  rationale: Das Wort bezeichnet in dieser Verbindung wahrnehmbaren beziehungsweise deutlich hörbaren Klang. „Hell klingend“ passt zum Klang von Zimbeln, ohne die Wendung bloß als große Lautstärke festzulegen.
- source_word: תְרוּעָה
  choice: schallenden
  rationale: תְרוּעָה kann Jubelruf, Signalstoß oder lauten Schall bezeichnen. Auf Zimbeln bezogen gibt „schallend“ die intensive akustische Wirkung natürlich wieder und lässt den freudig-kultischen Ton anklingen.
