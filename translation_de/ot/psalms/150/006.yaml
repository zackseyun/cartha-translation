  text: כֹּ֣ל הַ֭/נְּשָׁמָה תְּהַלֵּ֥ל יָ֗הּ הַֽלְלוּ יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/006.yaml
  text: Let everything that has breath praise Yah[a]. Praise Yah!
translation:
  language: de
  text: Alles, was Atem hat, lobe Jah. Lobt Jah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halleluja!“ Der hebräische Ausdruck הַלְלוּ־יָהּ ist der Ursprung des liturgischen Rufes „Halleluja“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  choice: Alles, was Atem hat
  rationale: 'Die Wendung gibt den umfassenden Sinn des kompakten Hebräisch natürlich wieder: Gemeint ist alles Lebendige, das atmet. „Jeder Atem“ wäre im Deutschen zwar formnäher, könnte aber missverständlich wie ein einzelner Atemzug klingen.'
- source_word: תְּהַלֵּל
  choice: lobe
  rationale: Der Imperfekt hat hier im Zusammenhang des abschließenden Aufrufs auffordernde Kraft. Der deutsche Konjunktiv „lobe“ bewahrt diese jussivische Nuance knapp und würdig.
- source_word: יָהּ
  choice: Jah
  rationale: „Jah“ ist die im Deutschen geläufige Wiedergabe der poetischen Kurzform des Gottesnamens und bewahrt ihre Unterscheidung von der Vollform יהוה.
- source_word: הַלְלוּ יָהּ
  choice: Lobt Jah!
  rationale: Die imperativische Wendung wird übersetzt, statt nur in ihrer liturgischen Lehnform wiedergegeben zu werden. „Lobt“ bildet zudem den hebräischen Plural des direkten Aufrufs ab.
theological_decisions:
- issue: Wiedergabe der poetischen Kurzform יָהּ des Gottesnamens
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich die Kurzform יָהּ. „Jah“ erhält diese lexikalische und poetische Besonderheit, ohne sie mit der üblichen Wiedergabe der Vollform יהוה gleichzusetzen.
- issue: Übersetzung oder Übernahme des liturgischen Ausdrucks הַלְלוּ־יָהּ
  choice: Lobt Jah!
  alternative: Halleluja!
  rationale: Die Hauptübersetzung macht die Bedeutung des hebräischen Imperativs unmittelbar verständlich. Die vertraute liturgische Form bleibt als sachlich gleichwertige Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, feierlicher Psalmensprache. Die traditionelle Wendung „Alles, was Atem hat“ bewahrt das hebräische Bild, während „lobe“ den auffordernden Charakter ausdrückt.
