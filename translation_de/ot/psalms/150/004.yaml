base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/004.yaml
  text: Praise him with tambourine and dancing[b][a]; praise him with strings and pipe.
translation:
  language: de
  text: Lobt ihn mit Handtrommel und Tanz; lobt ihn mit Saiteninstrumenten[a] und Flöte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit Saitenspiel.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet wahrscheinlich eine Pfeife oder Rohrflöte, nicht eine moderne Tastenorgel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Lobt ihn
  rationale: Der Imperativ Plural von הלל mit Suffix der 3. Person maskulin Singular richtet sich an die versammelte Gemeinschaft und nimmt Gott als direktes Objekt auf.
- source_word: בְתֹף
  choice: mit Handtrommel
  rationale: תֹף bezeichnet eine mit der Hand gespielte Trommel, wahrscheinlich eine Rahmentrommel. „Handtrommel“ ist verständlich und vermeidet die möglicherweise irreführende Vorstellung eines modernen Tamburins mit Schellen.
- source_word: וּמָחוֹל
  choice: und Tanz
  rationale: מָחוֹל bezeichnet einen Tanz beziehungsweise das Tanzen. „Tanz“ gibt das Mittel des Lobens knapp und natürlich wieder, ohne eine bestimmte Tanzform vorauszusetzen.
- source_word: בְּמִנִּים
  choice: mit Saiteninstrumenten
  rationale: מִנִּים bezeichnet hier wahrscheinlich Saiten beziehungsweise Saiteninstrumente. Die ausgeschriebene Form ist im Deutschen klarer als das metonymische „mit Saiten“.
- source_word: וְעוּגָב
  choice: und Flöte
  rationale: עוּגָב bezeichnet ein altes Blasinstrument, wahrscheinlich eine Pfeife oder Rohrflöte. „Flöte“ ist modernes, verständliches Deutsch und vermeidet die irreführende traditionelle Wiedergabe „Orgel“.
