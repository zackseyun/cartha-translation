  text: הַֽלְל֥וּ/הוּ בִ/גְבוּרֹתָ֑י/ו הַֽ֝לְל֗וּ/הוּ כְּ/רֹ֣ב גֻּדְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/002.yaml
  text: Praise him for his mighty acts[b][a]; praise him according to the abundance of his greatness.
translation:
  language: de
  text: Lobt ihn für seine mächtigen Taten[a]; lobt ihn entsprechend der Fülle seiner Größe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen seiner Machttaten“; wörtlicher auch: „in/mit seinen Machttaten“. Die hebräische Präposition kann hier den Grund oder den Bereich des Lobes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Verhältnis zur Fülle seiner Größe“ oder „seiner überreichen Größe entsprechend“. Das Hebräische kann Entsprechung oder Maßverhältnis ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Lobt ihn
  rationale: Der Pluralimperativ von הלל mit Objektsuffix der 3. Person Singular richtet sich unmittelbar an die versammelte Gemeinschaft. „Lobt ihn“ ist im modernen Deutschen natürlich, knapp und würdig.
- source_word: בִגְבוּרֹתָיו
  choice: für seine mächtigen Taten
  rationale: גְּבוּרוֹת bezeichnet Machttaten beziehungsweise Taten, in denen sich Stärke erweist. Die Präposition ב wird hier am natürlichsten als Grund des Lobes wiedergegeben; die formaleren Möglichkeiten „wegen/in/mit“ werden in der Fußnote kenntlich gemacht.
- source_word: כְּרֹב
  choice: nach der Fülle
  rationale: 'כְּ mit רֹב bezeichnet Maß beziehungsweise Entsprechung: Das Lob soll der Fülle von Gottes Größe entsprechen. „Nach der Fülle“ bewahrt diesen proportionalen Zug und bleibt verständlich.'
- source_word: גֻּדְלוֹ
  choice: seiner Größe
  rationale: Das Substantiv bezeichnet Größe oder Erhabenheit. „Größe“ ist die unmittelbarste Wiedergabe und vermeidet die interpretativ stärkere Festlegung auf „Majestät“.
theological_decisions:
- issue: Grund und Maß des Lobes
  choice: Der erste Halbvers nennt Gottes mächtige Taten als Grund des Lobes; der zweite beschreibt das Lob entsprechend der Fülle seiner Größe.
  alternative: 'Beide Halbverse können allgemeiner als parallele Gründe des Lobes verstanden werden: wegen seiner Machttaten und wegen seiner überragenden Größe.'
  rationale: 'Die unterschiedlichen Präpositionen ב und כ legen verschiedene Nuancen nahe: Grund beziehungsweise Bereich im ersten, Maß oder Entsprechung im zweiten Halbvers. Die Übersetzung erhält diesen Unterschied, ohne eine streng mathematische Verhältnismäßigkeit zu behaupten.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gemeindetauglichem Register. Der parallele Imperativ „Lobt ihn“ bleibt erhalten. „Mächtige Taten“ ist konkret und allgemein verständlich; „nach der Fülle seiner Größe“ wahrt bewusst die ungewöhnliche, poetische Maßvorstellung des Hebräischen.
