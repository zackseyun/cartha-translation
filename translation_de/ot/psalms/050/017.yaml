  text: וְ֭/אַתָּה שָׂנֵ֣אתָ מוּסָ֑ר וַ/תַּשְׁלֵ֖ךְ דְּבָרַ֣/י אַחֲרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/017.yaml
  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: de
  text: Du aber[b] hasst Zurechtweisung[a] und wirfst meine Worte hinter dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unterweisung“, „Ermahnung“ oder „Zucht“. Das hebräische Wort bezeichnet erziehende und korrigierende Anleitung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und du hasst …“ beziehungsweise „Denn du hasst …“. Die hebräische Verbindung kann einen Gegensatz, eine Begründung oder eine Fortführung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Denn du
  rationale: Das explizite Pronomen hebt den Angeredeten hervor. Das וְ kann hier den vorausgehenden Vorwurf begründen oder einen Gegensatz markieren; „Denn du“ gibt den Zusammenhang natürlich wieder, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: שָׂנֵאתָ
  choice: hasst
  rationale: Das Qal-Perfekt 2. Person maskulin Singular beschreibt im anklagenden poetischen Zusammenhang eine kennzeichnende Haltung; das deutsche Präsens ist dafür idiomatisch.
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: מוּסָר umfasst erziehende Unterweisung, Korrektur und Zucht. „Zurechtweisung“ wahrt hier den korrigierenden und moralisch formenden Sinn, ohne auf körperliche Bestrafung zu verengen.
- source_word: וַתַּשְׁלֵךְ
  choice: wirfst
  rationale: Das Verb bezeichnet ein Werfen oder Schleudern. Das Präsens führt die charakterisierende Anklage fort und bewahrt das anschauliche Bild.
- source_word: דְּבָרַי
  choice: meine Worte
  rationale: Die schlichte Wiedergabe erhält die Breite des Ausdrucks, der Gottes Aussagen, Weisungen und Gebote umfassen kann, ohne dies im Haupttext auszudeuten.
- source_word: אַחֲרֶיךָ
  choice: hinter dich
  rationale: Die räumliche Metapher wird direkt erhalten und drückt Missachtung beziehungsweise Verwerfung aus. „Hinter deinem Rücken“ wäre irreführend, weil es im Deutschen Heimlichkeit nahelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Metapher „hinter dich werfen“ bleibt erhalten; „Zurechtweisung“ ist verständlich und gibt die korrigierende Bedeutung von מוּסָר wieder. Die Fußnotenmarker stehen jeweils an der für ihre Aussage einschlägigen Stelle.
