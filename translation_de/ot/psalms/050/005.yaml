  variant: modern standard German
source:
  edition: WLC
  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: de
  text: Versammelt mir meine Getreuen, die meinen Bund beim Opfer schließen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die meinen Bund über einem Opfer schneiden“; „einen Bund schneiden“ ist die hebräische Wendung für „einen Bund schließen“.'
    reason: Bewahrt die wörtliche Bundesformel und die Mehrdeutigkeit der Präposition עַל.
lexical_decisions:
- source_word: אִסְפוּ
  choice: Versammelt
  rationale: Der Qal-Imperativ im Plural fordert mehrere Angesprochene auf, Menschen zusammenzubringen. „Versammelt“ gibt diesen Aufruf natürlich und würdevoll wieder.
- source_word: לִי
  choice: mir
  rationale: Die Präposition ל mit Suffix der 1. Person Singular kann „mir“ oder „für mich“ bedeuten. Im Zusammenhang der Einberufung bezeichnet „mir“ knapp und idiomatisch das Versammeln zu Gott hin.
- source_word: חֲסִידָי
  choice: meine Getreuen
  rationale: חסיד bezeichnet hier Menschen, die Gott in loyaler, bundestreuer Verbundenheit zugehören. „Getreue“ bewahrt diesen Beziehungsaspekt, ohne spätere technische Vorstellungen von „Heiligen“ einzutragen.
- source_word: כֹּרְתֵי
  choice: die … schließen
  rationale: כרת bildet mit ברית die feste hebräische Wendung „einen Bund schneiden“. Im Deutschen ist „einen Bund schließen“ die entsprechende natürliche Wendung.
- source_word: בְרִיתִי
  choice: meinen Bund
  rationale: ברית mit Suffix der 1. Person Singular wird sachgerecht und theologisch offen mit „meinen Bund“ wiedergegeben.
- source_word: עֲלֵי זָבַח
  choice: beim Opfer
  rationale: על bezeichnet hier die Verbindung des Bundesschlusses mit dem Opfergeschehen. „Beim Opfer“ bewahrt diese rituelle Zuordnung, ohne die mögliche instrumentale Bedeutung stärker festzulegen als der hebräische Ausdruck.
theological_decisions:
- issue: Bedeutung von חֲסִידָי im Bundeszusammenhang
  choice: meine Getreuen
  alternative: meine Frommen; meine Heiligen; die mir treu sind
  rationale: „Meine Getreuen“ bringt die loyale Zugehörigkeit zu Gott zum Ausdruck und vermeidet zugleich konfessionell oder später kirchengeschichtlich geprägte Nebenbedeutungen.
- issue: Wiedergabe der Wendung כרת ברית
  choice: einen Bund schließen
  alternative: einen Bund schneiden
  rationale: Die wörtliche hebräische Metapher wäre im modernen Deutschen missverständlich. Die geläufige deutsche Bundesformel gibt die Bedeutung klar wieder; die wörtliche Form bleibt in der Fußnote sichtbar.
- issue: Verhältnis von Bundesschluss und Opfer in עֲלֵי זָבַח
  choice: beim Opfer
  alternative: durch ein Opfer; über einem Opfer
  rationale: Die Präposition על lässt die genaue Relation teilweise offen. „Beim Opfer“ bezeichnet die enge rituelle Verbindung, ohne eindeutig nur eine instrumentale Deutung festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Klang. „Getreue“ ist leicht gehoben, aber im Psalmenregister natürlich; die Satzstruktur folgt der knappen Aufforderung des Hebräischen.
