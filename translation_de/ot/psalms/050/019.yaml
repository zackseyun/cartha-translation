  text: You let your mouth loose for evil[b][a], and your tongue frames deceit.
translation:
  language: de
  text: Du lässt deinen Mund Böses reden[a], und deine Zunge verbindest du mit Täuschung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du gibst deinem Mund freien Lauf, Böses zu reden.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Zunge heftest du an Täuschung“ beziehungsweise „lässt du sie sich mit Täuschung verbinden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיךָ
  choice: deinen Mund
  rationale: Bewahrt das hebräische Körperbild und den poetischen Parallelismus mit „deine Zunge“; gemeint ist die Rede.
- source_word: שָׁלַחְתָּ
  choice: lässt du … los
  rationale: Gibt das Grundbild des Aussendens beziehungsweise Loslassens wieder und bezeichnet hier das ungehemmte Einsetzen des Mundes.
- source_word: בְרָעָה
  choice: auf Böses
  rationale: Gibt die Ausrichtung auf moralisch Böses wieder, ohne den Sinn auf bloßen Schaden zu verengen.
- source_word: וּלְשׁוֹנְךָ
  choice: und deine Zunge
  rationale: Erhält das konkrete Bild und den Parallelismus der beiden Vershälften.
- source_word: תַּצְמִיד
  choice: verbindest du mit
  rationale: Das Hifil von צמד bezeichnet ein Zusammenfügen oder Verbinden. Die aktive Form wahrt, dass der Angeredete seine Zunge mit Täuschung verknüpft; die genaue Bildnuance bleibt in der Fußnote sichtbar.
- source_word: מִרְמָה
  choice: Täuschung
  rationale: Eine breite, im Zusammenhang falscher Rede natürliche Wiedergabe; sie umfasst Irreführung und Trug.
