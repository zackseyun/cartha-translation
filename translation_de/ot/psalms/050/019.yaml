  register: Moderne, würdige poetische Standardsprache. Die Körperbilder „Mund“ und „Zunge“ sowie der Parallelismus bleiben erhalten. Die ungewöhnliche Verbindungsmetapher der zweiten Vershälfte wird nicht zu „Täuschung ersinnen“ oder „Lügen schmieden“ aufgelöst.
