base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/018.yaml
  text: If you saw a thief[a], you were pleased with him[b], and your portion was with adulterers.
translation:
  language: de
  text: Wenn du einen Dieb sahst, fandest du Gefallen an ihm[a], und deinen Anteil hattest du bei Ehebrechern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „billigtest du ihn“ beziehungsweise „stimmtest du ihm zu“. Das hebräische Verb kann Gefallen, Wohlwollen oder Annahme ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und bei Ehebrechern war dein Anteil“. Gemeint ist, dass du dich ihnen zugeselltest oder mit ihnen gemeinsame Sache machtest.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Partikel leitet hier einen rhetorisch geschilderten Fall beziehungsweise ein wiederkehrendes Verhalten ein; im Deutschen ist „wenn“ dafür natürlicher als das stärker hypothetische „falls“.
- source_word: רָאִיתָ
  choice: du sahst
  rationale: Das Qal Perfekt 2. Person Maskulin Singular wird in der anklagenden Rückschau mit dem Präteritum wiedergegeben.
- source_word: גַּנָּב
  choice: einen Dieb
  rationale: Direkte und im Deutschen idiomatische Wiedergabe der Bezeichnung für einen Dieb beziehungsweise Stehler.
- source_word: וַתִּרֶץ
  choice: fandest du Gefallen
  rationale: Das Verb רצה bezeichnet Gefallen, Wohlwollen oder Zustimmung. „Gefallen finden“ bewahrt den Grundsinn, ohne die Aussage auf bloße äußere Gesellschaft zu verengen.
- source_word: עִמּוֹ
  choice: an ihm
  rationale: Die deutsche Verbindung „Gefallen an jemandem finden“ erfordert „an“ und gibt die Beziehung des hebräischen עִם in diesem Zusammenhang natürlich wieder.
- source_word: מְנָאֲפִים
  choice: Ehebrechern
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Menschen, die Ehebruch begehen; „Ehebrecher“ ist knapp und präzise.
- source_word: חֶלְקֶךָ
  choice: deinen Anteil hattest du
  rationale: חלק bedeutet „Anteil“, „Teil“ oder „Los“. Die Formulierung bewahrt das hebräische Bild und lässt zugleich die gemeinte Zugehörigkeit beziehungsweise Beteiligung erkennen.
theological_decisions: []
