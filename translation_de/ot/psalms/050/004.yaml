id: PSA.50.4
reference: Psalms 50:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִקְרָ֣א אֶל הַ/שָּׁמַ֣יִם מֵ/עָ֑ל וְ/אֶל הָ֝/אָ֗רֶץ לָ/דִ֥ין עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: de
  text: Er ruft dem Himmel droben und der Erde zu[a], um sein Volk zu richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er ruft den Himmel droben und die Erde herbei.« Das Verb kann besonders in einem gerichtlichen Zusammenhang ein Herbeirufen oder Vorladen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: Er ruft … zu
  rationale: Das Qal-Imperfekt von קרא kann »rufen« oder »herbeirufen« bedeuten. Mit אֶל gibt »jemandem zurufen« die gerichtete Rede natürlich wieder, ohne die mögliche Bedeutung einer gerichtlichen Vorladung festzulegen.
- source_word: אֶל הַשָּׁמַיִם מֵעָל
  choice: dem Himmel droben
  rationale: שׁמים bezeichnet hier im kosmischen Gegensatz zur Erde den Himmel. מֵעָל wird adverbial als »droben« wiedergegeben; dies bewahrt den gehobenen poetischen Ton.
- source_word: וְאֶל הָאָרֶץ
  choice: und der Erde
  rationale: Im Parallelismus mit dem Himmel ist die ganze Erde gemeint, nicht ein bestimmtes Land.
- source_word: לָדִין
  choice: um … zu richten
  rationale: Der Infinitiv mit ל drückt den Zweck des Rufens aus. Die deutsche Infinitivkonstruktion gibt dies knapp und natürlich wieder.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עם bezeichnet hier Gottes Volk und bewahrt den relationalen Sinn des hebräischen Ausdrucks.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts
  choice: Das Subjekt bleibt als Pronomen »Er« unausgesprochen beziehungsweise aus dem Kontext erschließbar.
  alternative: Den Gottesnamen oder »Gott« ausdrücklich ergänzen.
  rationale: Die hebräische Verbform hat ein männliches Subjekt in der dritten Person Singular, nennt es in diesem Vers aber nicht ausdrücklich. »Er« folgt dem Textfluss, ohne eine Bezeichnung hinzuzufügen.
- issue: Funktion von Himmel und Erde
  choice: Der Haupttext lässt offen, ob Gott ihnen zuruft oder sie als Zeugen beziehungsweise Teilnehmer herbeiruft.
  alternative: Das Verb eindeutig als gerichtliches Herbeirufen verstehen.
  rationale: Der gerichtliche Zusammenhang legt eine Vorladung nahe, doch קרא אֶל kann auch allgemein ein Zurufen bezeichnen. Die Fußnote hält die kontextuell plausible Alternative sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischem »droben«. Die Wortstellung ist klar und bewahrt den kosmischen Parallelismus von Himmel und Erde.
