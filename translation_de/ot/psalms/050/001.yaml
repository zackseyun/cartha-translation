  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: de
  text: 'Ein Psalm Asafs.


    Der Mächtige[a], Gott, Jahwe, hat gesprochen und die Erde gerufen vom Aufgang der Sonne bis zu ihrem Untergang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott, Gott, Jahwe«; manche verstehen die einleitenden Gottesbezeichnungen auch als: »Der Gott der Götter, Jahwe«.'
    reason: Alternative Deutungen der syntaktisch mehrdeutigen Folge אֵל אֱלֹהִים יְהוָה.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Der etablierte deutsche Gattungsbegriff gibt die Überschrift knapp und sachgerecht wieder.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der Genitiv ist in deutschen Psalmüberschriften natürlich und lässt offen, ob Autorschaft, Zugehörigkeit oder Sammlung gemeint ist.
- source_word: אֵל
  choice: der Mächtige
  rationale: Die Wiedergabe unterscheidet אֵל von dem folgenden אֱלֹהִים und bewahrt die kraftvolle, dreifache Gottesbezeichnung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Eigenname יהוה und die singularischen Verben zeigen, dass hier der Gott Israels gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- source_word: דִּבֶּר
  choice: hat gesprochen
  rationale: Das Perfekt bezeichnet die vollzogene, für die folgende Szene maßgebliche Redehandlung.
- source_word: וַיִּקְרָא
  choice: und die Erde gerufen
  rationale: Die Form führt die Handlung vom Sprechen zum Rufen weiter; die schlichte Wiedergabe bewahrt sowohl den allgemeinen als auch den gerichtlichen Einberufungscharakter.
- source_word: אָרֶץ
  choice: die Erde
  rationale: Die anschließende Wendung vom Sonnenaufgang bis zum Sonnenuntergang weist auf einen weltweiten Horizont.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: vom Aufgang der Sonne
  rationale: Die bildhafte hebräische Formulierung wird bewahrt und nicht zum bloßen Richtungswort „Osten“ verkürzt.
- source_word: עַד מְבֹאוֹ
  choice: bis zu ihrem Untergang
  rationale: Das Suffix bezieht sich auf die Sonne; die Formulierung ist im Deutschen idiomatisch und erhält den umfassenden Merismus.
theological_decisions:
- issue: Die dreifache Gottesbezeichnung אֵל אֱלֹהִים יְהוָה
  choice: Der Mächtige, Gott, Jahwe
  alternative: 'Gott, Gott, Jahwe; oder: Der Gott der Götter, Jahwe'
  rationale: Der hebräische Text reiht drei Gottesbezeichnungen aneinander. Die gewählte Fassung gibt אֵל eigenständig wieder, ohne die mögliche Deutung als Wiederholung oder als Verbindung „Gott der Götter“ zu verschweigen.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die poetische Spannweite vom Sonnenaufgang bis zum Sonnenuntergang bleibt erhalten; die knappe Reihung der Gottesbezeichnungen folgt der feierlichen Form des Hebräischen.
