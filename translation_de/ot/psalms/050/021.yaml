source:
  edition: WLC
  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: de
  text: Das hast du getan, und ich schwieg; du dachtest, ich sei ganz wie du.[a] Ich werde dich zurechtweisen und es dir vor Augen stellen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Du dachtest, ich würde wie du sein.“ Die hebräische Konstruktion lässt die irrige Annahme leicht unterschiedlich ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und es vor deinen Augen ordnen/darlegen“. Das hebräische Verb kann „ordnen“ oder „darlegen“ bedeuten; was dargelegt wird, bleibt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: Das hast du getan
  rationale: Das pluralische Demonstrativpronomen verweist zusammenfassend auf die zuvor genannten Vergehen. Im Deutschen gibt „das“ diesen Rückbezug natürlicher wieder als „diese Dinge“.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: und ich schwieg
  rationale: Die knappe Formulierung bewahrt den Gegensatz zwischen Gottes bisherigem Schweigen und seiner nun angekündigten Zurechtweisung, ohne das Schweigen ausdrücklich als Zustimmung oder Nachsicht zu deuten.
- source_word: דִּמִּיתָ
  choice: Du dachtest
  rationale: Das Verb bezeichnet hier eine irrige Annahme oder Vorstellung. „Dachtest“ ist klar, gegenwärtig und nicht stärker wertend als der Ausgangstext.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: ich sei genauso wie du
  rationale: Der deutsche Konjunktiv gibt den Inhalt der irrigen Annahme wieder; „genauso“ vermittelt die nachdrückliche Verbindung von Infinitiv und finitem Verb, ohne eine bestimmte Art der Ähnlichkeit hinzuzufügen.
- source_word: אוֹכִיחֲךָ
  choice: ich werde dich zurechtweisen
  rationale: יכח hat hier einen anklagenden und korrigierenden Sinn. „Zurechtweisen“ ist würdig und verständlich, lässt aber die im Kontext mögliche gerichtliche Färbung bestehen.
- source_word: וְאֶעֶרְכָה לְעֵינֶיךָ
  choice: und dir alles vor Augen stellen
  rationale: ערך bedeutet „ordnen, anordnen, darlegen“; das Objekt bleibt im Hebräischen unausgesprochen. Die deutsche Wendung macht die offene Darlegung der Vergehen verständlich, während eine Fußnote die Ellipse und die wörtlichere Alternative festhält.
theological_decisions:
- issue: Bedeutung von Gottes Schweigen
  choice: Das Schweigen wird ohne erklärenden Zusatz wiedergegeben und deutlich von der folgenden Zurechtweisung abgesetzt.
  alternative: „Ich hielt still“ oder eine ausdrückliche Deutung als Geduld beziehungsweise Nachsicht.
  rationale: Der Zusammenhang zeigt, dass das Schweigen keine Billigung war; der Vers selbst benennt jedoch nicht ausdrücklich sein Motiv. Die Übersetzung wahrt diese Spannung.
- issue: Gerichtlicher Charakter der Schlussaussage
  choice: „zurechtweisen“ und „vor Augen stellen“ bewahren sowohl den Tadel als auch die geordnete Darlegung.
  alternative: „Ich werde dich anklagen und den Fall gegen dich darlegen.“
  rationale: Eine ausdrücklich juristische Formulierung wäre im Kontext möglich, würde aber den im Hebräischen nicht genannten Gegenstand von ערך stärker festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der scharfe Gegensatz zwischen Schweigen und Zurechtweisung bleiben erhalten. Implizite Inhalte werden nur so weit ergänzt, wie es für natürliches Deutsch nötig ist; die wesentlichen Alternativen stehen in den Fußnoten.
