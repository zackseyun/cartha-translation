  text: הַֽ֭/אוֹכַל בְּשַׂ֣ר אַבִּירִ֑ים וְ/דַ֖ם עַתּוּדִ֣ים אֶשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: de
  text: Esse ich etwa das Fleisch von Stieren oder trinke ich das Blut von Ziegenböcken?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: Esse ich etwa
  rationale: Die Fragepartikel הֲ mit dem Qal-Imperfekt der 1. Person Singular bildet eine rhetorische Frage. „Etwa“ macht diese erwartete Verneinung im natürlichen Deutschen hörbar, ohne sie ausdrücklich vorwegzunehmen.
- source_word: בְּשַׂר
  choice: das Fleisch von
  rationale: בשר bezeichnet konkret „Fleisch“. Diese Wiedergabe bewahrt das anschauliche Opferbild.
- source_word: אַבִּירִים
  choice: Stieren
  rationale: Das Wort kann allgemein „Starke/Mächtige“ bedeuten, bezeichnet hier im Zusammenhang mit Opfertieren jedoch kräftige männliche Rinder, also Stiere.
- source_word: וְדַם
  choice: oder ... das Blut von
  rationale: וְ bedeutet formal „und“. In einer zweiteiligen deutschen Alternativfrage gibt „oder“ die rhetorische Verknüpfung idiomatisch wieder, ohne die beiden parallelen Handlungen sachlich voneinander zu trennen.
- source_word: עַתּוּדִים
  choice: Ziegenböcken
  rationale: עתודים bezeichnet männliche Ziegen. „Ziegenböcke“ ist präzise und vermeidet die mögliche Verwechslung des kürzeren „Böcke“ mit männlichen Schafen.
- source_word: אֶשְׁתֶּה
  choice: trinke ich
  rationale: Das Qal-Imperfekt der 1. Person Singular setzt die rhetorische Frage des ersten Halbverses fort; die wiederholte Subjekt-Verb-Stellung klingt im Deutschen klar und würdevoll.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Essen und Trinken der Opfer
  choice: Die konkrete rhetorische Frage wird ohne Abschwächung wiedergegeben.
  alternative: Abstrakte Umschreibung wie „Brauche ich eure Opfer?“
  rationale: Der Vers bestreitet durch konkrete Opferbilder, dass Gott von tierischer Nahrung oder Blut abhängig sei. Eine abstrakte Paraphrase würde die Bildkraft und theologische Spannung des Hebräischen mindern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Formulierung bleibt nah an der konkreten Opfersprache und macht den rhetorischen Charakter durch „etwa“ deutlich.
