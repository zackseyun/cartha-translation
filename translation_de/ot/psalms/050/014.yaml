id: PSA.50.14
reference: Psalms 50:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זְבַ֣ח לֵ/אלֹהִ֣ים תּוֹדָ֑ה וְ/שַׁלֵּ֖ם לְ/עֶלְי֣וֹן נְדָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: de
  text: Bring Gott Dank als Opfer dar[a] und erfülle dem Höchsten deine Gelübde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bring Gott ein Dankopfer dar.“ Das hebräische Wort kann sowohl „Dank“ als auch, in diesem Opferzusammenhang, „Dankopfer“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: זְבַח
  choice: bring … als Opfer dar
  rationale: Der Imperativ von זבח bezeichnet das Darbringen eines Opfers. Die deutsche Wendung bewahrt den kultischen Sinn und verbindet sich natürlich mit „Dank“.
- source_word: לֵאלֹהִים
  choice: Gott
  rationale: Die Präposition ל kennzeichnet hier den Empfänger der Opferhandlung; im Deutschen wird dies in der Konstruktion „Gott … darbringen“ ohne zusätzliche Präposition idiomatisch ausgedrückt.
- source_word: תּוֹדָה
  choice: Dank als Opfer
  rationale: תּוֹדָה kann sowohl Dank als auch ein Dankopfer bezeichnen. Die Formulierung hält die dankende und die kultische Dimension zusammen, ohne den Ausdruck ausschließlich als technischen Opfertyp festzulegen.
- source_word: וְשַׁלֵּם
  choice: und erfülle
  rationale: Der Imperativ von שלם bedeutet im Zusammenhang mit Gelübden, die eingegangene Verpflichtung einzulösen. „Erfülle“ ist im modernen Deutsch natürlich und weniger geschäftlich als „bezahle“.
- source_word: לְעֶלְיוֹן
  choice: dem Höchsten
  rationale: עֶלְיוֹן ist hier ein Gottesprädikat und wird bedeutungsgemäß als „der Höchste“ übersetzt. Das Dativobjekt gibt ל idiomatisch wieder.
- source_word: נְדָרֶיךָ
  choice: deine Gelübde
  rationale: Der Plural mit Suffix der 2. Person Singular wird direkt und präzise wiedergegeben.
theological_decisions:
- issue: Kultischer Ausdruck זבח … תודה
  choice: „Dank als Opfer darbringen“
  alternative: „ein Dankopfer darbringen“ oder „Dank darbringen“
  rationale: Die gewählte Fassung bewahrt sowohl den möglichen allgemeinen Sinn „Dank“ als auch den Opferkontext. Die Fußnote nennt die engere kultische Deutung ausdrücklich.
- issue: Gottestitel עֶלְיוֹן
  choice: „der Höchste“
  alternative: „Eljon“
  rationale: Der Ausdruck fungiert als verständlicher Gottes- beziehungsweise Hoheitstitel; seine Übersetzung vermittelt die Bedeutung unmittelbar und vermeidet eine unnötige Festlegung als Eigenname.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darbringen“ bewahrt den kultischen Ton, bleibt aber allgemein verständlich; die Satzstruktur folgt dem parallelen Aufbau des Hebräischen.
