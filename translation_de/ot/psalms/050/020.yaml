  text: You sit and speak against your brother[a]; you slander your own mother's son.
translation:
  language: de
  text: Du sitzt da und redest gegen deinen Bruder; den Sohn deiner Mutter verleumdest du.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gegen den Sohn deiner Mutter gibst du Schmach.“ Das seltene hebräische Wort דֹּפִי kann Schmach, Tadel oder eine diffamierende Anschuldigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּשֵׁב
  choice: Du sitzt da
  rationale: Bewahrt das konkrete Bild von ישׁב und klingt im Deutschen zugleich natürlich; die Wendung unterstreicht das überlegte, eingespielte Handeln.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: redest gegen deinen Bruder
  rationale: בְּ bei דבר kann in einem feindseligen Redekontext adversativ verstanden werden. „Gegen deinen Bruder reden“ erhält sowohl die Struktur als auch den anklagenden Ton.
- source_word: בְּבֶן אִמְּךָ
  choice: den Sohn deiner Mutter
  rationale: Die formnahe Wiedergabe bewahrt die betonte enge Verwandtschaft und den Parallelismus mit „deinen Bruder“.
- source_word: תִּתֶּן דֹּפִי
  choice: verleumdest du
  rationale: Die seltene Verbindung bezeichnet das Auferlegen von Schmach, Tadel oder diffamierender Rede. „Verleumden“ gibt den Sinn im deutschen Redekontext knapp und idiomatisch wieder.
theological_decisions: []
