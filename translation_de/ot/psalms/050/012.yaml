id: PSA.50.12
reference: Psalms 50:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: de
  text: Wenn ich Hunger hätte, würde ich es dir nicht sagen; denn mir gehört die Welt und alles, was sie erfüllt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: Wenn ich Hunger hätte
  rationale: Die Verbindung aus אִם und Imperfekt eröffnet hier im Kontext eine rhetorisch-hypothetische Bedingung. Der deutsche Konjunktiv II gibt diesen Sinn natürlich wieder, ohne eine tatsächliche Bedürftigkeit Gottes zu behaupten.
- source_word: לֹא אֹמַר לָךְ
  choice: würde ich es dir nicht sagen
  rationale: אמר mit ל kann wörtlich »zu jemandem sagen« bedeuten; hier ist »es dir sagen« idiomatisch und nimmt den gedachten Hunger als Inhalt auf. »Würde« führt die hypothetische Konstruktion fort.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet die vorangehende Aussage. »Denn« bewahrt den erklärenden Zusammenhang und den würdigen poetischen Ton.
- source_word: לִי
  choice: mir gehört
  rationale: Die Präposition לְ bezeichnet hier Besitz. »Mir gehört« ist im Deutschen natürlicher als eine Konstruktion mit »ist mein« bei dem zusammengesetzten Gegenstand.
- source_word: תֵבֵל
  choice: die Welt
  rationale: תֵבֵל bezeichnet die Welt, besonders als bewohnten oder geordneten Erdkreis. »Die Welt« ist verständlich, knapp und in diesem Zusammenhang ausreichend präzise.
- source_word: וּמְלֹאָהּ
  choice: und alles, was sie erfüllt
  rationale: מְלֹא bezeichnet die Fülle beziehungsweise das, was etwas füllt. Die Formulierung entfaltet das kompakte hebräische Bild in natürlichem modernem Deutsch und wahrt zugleich dessen umfassenden Sinn.
theological_decisions:
- issue: Gottes Unabhängigkeit von menschlicher Versorgung im Opferkontext
  choice: 'Der Satz wird als rhetorische Hypothese formuliert: »Wenn ich Hunger hätte, würde ich es dir nicht sagen.«'
  alternative: »Wenn ich hungrig bin, werde ich es dir nicht sagen.«
  rationale: Der Zusammenhang weist die Vorstellung zurück, Gott sei für seine Versorgung auf Opfer angewiesen. Der Konjunktiv bewahrt die hypothetische Kraft, ohne über den Text hinaus eine philosophische Lehraussage einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Das Semikolon bildet die begründende Zweiteilung des hebräischen Verses ab. Keine Fußnote ist nötig, da »alles, was sie erfüllt« die Bedeutung von וּמְלֹאָהּ unmittelbar und verständlich wiedergibt.
