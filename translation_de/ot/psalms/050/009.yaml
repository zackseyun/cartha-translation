  yaml_path: translation/ot/psalms/050/009.yaml
  text: I will not take a bull from your house[a], or goats from your pens.
translation:
  language: de
  text: Ich werde keinen Stier aus deinem Haus nehmen und keine Ziegenböcke aus deinen Gehegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֶקַּח
  choice: Ich werde … nicht nehmen
  rationale: Das negierte Qal-Imperfekt 1. Person Singular bezeichnet hier Gottes erklärtes Handeln; die deutsche Futurform gibt den entschiedenen Aussagecharakter natürlich wieder.
- source_word: מִבֵּיתְךָ
  choice: aus deinem Haus
  rationale: בַּיִת bezeichnet hier am ehesten das konkrete Haus beziehungsweise den Besitzbereich des Angesprochenen, nicht dessen Familie.
- source_word: פָר
  choice: Stier
  rationale: פָר bezeichnet einen männlichen Rindstier, besonders im Opferzusammenhang; „Stier“ ist präzise und geläufig.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: aus deinen Gehegen
  rationale: מִכְלָאָה ist eine Einfriedung für Tiere. „Gehege“ ist modernes Standarddeutsch und lässt die genaue Bauart offen.
- source_word: עַתּוּדִים
  choice: Ziegenböcke
  rationale: Das hebräische Wort bezeichnet ausdrücklich männliche Ziegen; „Ziegenböcke“ bewahrt diese im Opferkontext relevante lexikalische Präzision.
theological_decisions: []
