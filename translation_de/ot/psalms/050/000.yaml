base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: de
  text: Ein Psalm Asafs. Gott, Gott, der HERR,[a] hat gesprochen und die Erde gerufen, vom Aufgang der Sonne bis zu ihrem Untergang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine Folge dreier Gottesbezeichnungen: „El, Elohim, JHWH“. Auch möglich: „Gott der Götter, der HERR“. „der HERR“ gibt den Gottesnamen JHWH wieder.'
    reason: Die hebräische Titelfolge ist syntaktisch mehrdeutig; die Anmerkung dokumentiert die alternative Deutung und die Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Ein Psalm Asafs
  rationale: Die knappe Überschrift wird natürlich und zugleich formnah wiedergegeben; die hebräische Präposition kann Zugehörigkeit, Autorschaft oder Zuordnung ausdrücken, ohne dies näher festzulegen.
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Der Mächtige, Gott, der HERR
  rationale: Die drei aufeinanderfolgenden Gottesbezeichnungen werden als emphatische Titelfolge bewahrt. אֵל wird hier mit „der Mächtige“ wiedergegeben, אֱלֹהִים mit „Gott“ und der Gottesname יהוה gemäß verbreiteter deutscher Bibelkonvention mit „der HERR“.
- source_word: וַיִּקְרָא אָרֶץ
  choice: und die Erde gerufen
  rationale: Das direkte Objekt steht im Hebräischen ohne Artikel; im Deutschen bezeichnet „die Erde“ natürlich die ganze Welt und passt zur anschließenden universalen Spannweite.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: vom Aufgang der Sonne bis zu ihrem Untergang
  rationale: Die bildhafte merismatische Wendung wird bewahrt und bezeichnet die gesamte Erde von Osten bis Westen.
theological_decisions:
- issue: Deutung der Titelfolge אֵל אֱלֹהִים יְהוָה
  choice: Der Mächtige, Gott, der HERR
  alternative: Der Gott der Götter, der HERR
  rationale: Die masoretische Akzentuierung und die syntaktische Kürze erlauben mehrere Auffassungen. Die Hauptfassung erhält alle drei Bezeichnungen als feierliche Appositionen, statt אֵל אֱלֹהִים eindeutig als Genitivverbindung zu deuten; die wichtige Alternative wird in der Fußnote genannt.
- issue: Wiedergabe des Tetragramms יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: „der HERR“ entspricht einer etablierten deutschen Bibelkonvention und ist für eine breite Leserschaft verständlich; zugleich macht die Fußnote deutlich, dass im Ausgangstext der Gottesname steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Spannweite „vom Aufgang der Sonne bis zu ihrem Untergang“ bleibt erhalten. Die Fußnote erläutert sowohl die echte syntaktische Mehrdeutigkeit der Gottesbezeichnungen als auch die Wiedergabe des Gottesnamens.
