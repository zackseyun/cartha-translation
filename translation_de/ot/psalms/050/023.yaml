source:
  edition: WLC
  text: זֹבֵ֥חַ תּוֹדָ֗ה יְֽכַ֫בְּדָ֥/נְנִי וְ/שָׂ֥ם דֶּ֑רֶךְ אַ֝רְאֶ֗/נּוּ בְּ/יֵ֣שַׁע אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: de
  text: Wer ein Dankopfer darbringt, ehrt mich; wer seinen Weg ordnet,[a] dem zeige ich Gottes Heil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer seinen Lebenswandel ordnet“; möglicherweise auch: „wer einen Weg bereitet“. Das Hebräische ist knapp und mehrdeutig.'
    reason: alternative_reading
  - marker: b
    text: „Gottes Heil“ kann auch „Gottes Rettung“ oder „Gottes Sieg“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ תּוֹדָה
  choice: Wer ein Dankopfer darbringt
  rationale: Das substantivisch gebrauchte Partizip זֹבֵחַ wird mit einer allgemeinen Personenbezeichnung wiedergegeben. תּוֹדָה bezeichnet hier Dank, der in Opferform Ausdruck findet; „Dankopfer“ bewahrt den kultischen und dankenden Sinn knapp und natürlich.
- source_word: יְכַבְּדָנְנִי
  choice: ehrt mich
  rationale: Das Piel von כבד bedeutet hier „ehren“ beziehungsweise „verherrlichen“. „Ehrt mich“ ist im modernen Deutsch klar und entspricht dem Zusammenhang.
- source_word: וְשָׂם דֶּרֶךְ
  choice: und wer seinen Weg ordnet
  rationale: Die knappe hebräische Wendung wird als parallele Bezeichnung einer Person verstanden, die ihren Lebensweg recht ausrichtet. „Seinen Weg ordnet“ erhält das Wegbild und vermeidet eine ausdeutende Paraphrase.
- source_word: אַרְאֶנּוּ
  choice: den lasse ich … sehen
  rationale: Der Hiphil von ראה mit Suffix bedeutet wörtlich „ich lasse ihn sehen“. Diese Wiedergabe erhält die kausative Form deutlicher als das ebenfalls mögliche „ich zeige ihm“.
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: Gottes Heil
  rationale: יֵשַׁע kann Heil, Rettung oder Sieg bezeichnen. „Gottes Heil“ ist im Psalmkontext natürlich und bewahrt die theologische Weite des Ausdrucks.
theological_decisions:
- issue: Deutung von וְשָׂם דֶּרֶךְ
  choice: wer seinen Weg ordnet
  alternative: wer einen Weg bereitet
  rationale: Die ethische Deutung als geordneter Lebenswandel passt zum Zusammenhang des Psalms, doch die sprachliche Kürze lässt auch eine stärker wörtliche Auffassung als Bereiten eines Weges zu; diese Mehrdeutigkeit wird in der Fußnote offengelegt.
- issue: Bedeutungsumfang von יֵשַׁע אֱלֹהִים
  choice: Gottes Heil
  alternative: Gottes Rettung oder Gottes Sieg
  rationale: „Heil“ umfasst die von Gott gewährte Rettung, ohne die Bedeutung vorschnell auf eine einzelne Art der Befreiung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und das Bild vom Weg bleiben erhalten; „Dankopfer“ ist verständlich und kultisch präzise.
