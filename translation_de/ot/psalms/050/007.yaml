source:
  edition: WLC
  text: שִׁמְעָ֤/ה עַמִּ֨/י וַ/אֲדַבֵּ֗רָה יִ֭שְׂרָאֵל וְ/אָעִ֣ידָה בָּ֑/ךְ אֱלֹהִ֖ים אֱלֹהֶ֣י/ךָ אָנֹֽכִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: de
  text: 'Höre, mein Volk, und ich will reden; Israel, ich will gegen dich aussagen[a]: Ich bin Gott, dein Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ich will gegen dich zeugen«. Das hebräische Verb hat rechtlich-zeugenschaftliche Bedeutung.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Höre
  rationale: Der Imperativ fordert zu aufmerksamem Hören auf. »Höre« bewahrt den feierlichen bundesrechtlichen und gerichtlichen Ton besser als das umgangssprachlichere »Hör zu«.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die Form mit Suffix der 1. Person Singular bezeichnet Israel als Gottes Volk und bewahrt die relationale, bundestheologische Aussage.
- source_word: וַאֲדַבֵּרָה
  choice: und ich will reden
  rationale: Der Kohortativ nach dem Imperativ drückt den entschlossenen Willen des Sprechers aus. »Ich will reden« gibt diese voluntative Nuance im Deutschen natürlich wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname steht als direkte Anrede und erläutert »mein Volk« näher.
- source_word: וְאָעִידָה בָּךְ
  choice: ich will gegen dich aussagen
  rationale: Der Hifil von עוד besitzt hier rechtlich-zeugenschaftliche Kraft. »Gegen dich aussagen« macht das Gerichtsbild in heutigem Deutsch klar; die mögliche Bedeutung »warnen/ermahnen« wird in der Fußnote offengehalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, bezeichnet sie hier eindeutig den einzelnen göttlichen Sprecher.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form mit Suffix der 2. Person Singular bewahrt die persönliche Bundesbeziehung zwischen Gott und Israel.
- source_word: אָנֹכִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen hebt die Selbstidentifikation hervor. Im Deutschen wird die nominale Aussage natürlich mit der Kopula »bin« wiedergegeben.
theological_decisions:
- issue: Wiedergabe der göttlichen Selbstidentifikation אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: Ich bin Gott, dein Gott
  alternative: Gott, dein Gott, bin ich
  rationale: Die gewählte Fassung gibt die nachdrückliche Selbstidentifikation und den Bundesanspruch klar und würdig wieder, ohne über den hebräischen Wortlaut hinauszugehen. Die Alternative bildet die hebräische Wortstellung enger ab, wirkt im heutigen Deutsch jedoch stärker markiert.
- issue: Rechtliche oder mahnende Bedeutung von וְאָעִידָה בָּךְ
  choice: ich will gegen dich aussagen
  alternative: ich will dich warnen / eindringlich ermahnen
  rationale: Der Zusammenhang der göttlichen Anklage stützt die forensische Bedeutung. Da das Verb auch warnendes oder mahnendes Bezeugen ausdrücken kann, wird diese echte lexikalische Möglichkeit in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Gerichts- und Bundeston. Die direkte Anrede »Israel« benötigt im Deutschen kein zusätzliches Anredepartikel; »gegen dich aussagen« ist verständlicher und gegenwärtiger als das stärker altertümliche »gegen dich zeugen«.
