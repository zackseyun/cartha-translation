source:
  edition: WLC
  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: de
  text: Begreift dies doch, ihr, die ihr Gott vergesst, sonst zerreiße ich euch, und niemand ist da, um euch zu retten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sonst zerreiße ich, und kein Retter ist da“.'
    reason: Der hebräische Text nennt beim Verb „zerreißen“ kein ausdrückliches Objekt und formuliert den letzten Satzteil als Existenzverneinung.
lexical_decisions:
- source_word: בִּינוּ
  choice: Begreift
  rationale: Der Imperativ Plural von בין fordert zu Einsicht und Verständnis auf. „Begreift“ ist unmittelbar, eindringlich und im modernen Deutsch natürlich.
- source_word: נָא
  choice: doch
  rationale: Die Partikel verstärkt hier die dringliche Aufforderung. Das deutsche „doch“ gibt diesen mahnenden Nachdruck idiomatisch wieder, ohne eine bloß zeitliche Bedeutung einzutragen.
- source_word: זֹאת
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf die vorausgehende Warnung. „Dies“ bleibt knapp und vermeidet eine deutende Ergänzung wie „diese Warnung“.
- source_word: שֹׁכְחֵי אֱלוֹהַּ
  choice: ihr, die ihr Gott vergesst
  rationale: Das Partizip mit Gottesbezeichnung steht als Anrede. Die Relativkonstruktion bewahrt den fortdauernden charakterisierenden Sinn und klingt im Deutschen natürlich.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die singuläre Gottesbezeichnung wird ohne unbegründete Erweiterung schlicht mit „Gott“ wiedergegeben.
- source_word: פֶּן
  choice: sonst
  rationale: Die Konjunktion leitet die angedrohte negative Folge ein. „Sonst“ ist im heutigen Deutsch klarer und natürlicher als das gehobene „damit nicht“ in dieser Satzstruktur.
- source_word: אֶטְרֹף
  choice: zerreiße ich euch
  rationale: טרף bezeichnet das Zerreißen von Beute. „Zerreißen“ bewahrt das drastische Raubtierbild; das im Hebräischen unausgesprochene Objekt wird aus der angeredeten Personengruppe ergänzt.
- source_word: וְאֵין מַצִּיל
  choice: und niemand rettet
  rationale: Die Negation der Existenz mit dem Hifil-Partizip von נצל besagt, dass kein Retter vorhanden ist. Die knappe Formulierung folgt der hebräischen Aussage und ist zugleich verständlich.
theological_decisions:
- issue: Bild göttlichen Gerichts in אֶטְרֹף
  choice: Das drastische Bild bleibt als „zerreiße ich euch“ erhalten.
  alternative: Abschwächend „vernichte ich euch“ oder „ergreife ich euch“.
  rationale: Der hebräische Text verwendet das anschauliche Bild vom Zerreißen der Beute. Eine abstrakte Wiedergabe würde die Schärfe der göttlichen Gerichtswarnung mindern.
- issue: Unausgesprochenes Objekt bei אֶטְרֹף
  choice: Das Objekt „euch“ wird im Haupttext ergänzt.
  alternative: 'Formal knapper: „sonst zerreiße ich, und niemand rettet“.'
  rationale: Die Angeredeten sind aus dem Kontext eindeutig als Betroffene erschließbar. Die Ergänzung ergibt natürliches Deutsch; eine Fußnote macht die formale Kürze des Hebräischen sichtbar.
translation_notes:
  register: Moderne, würdige Mahnrede mit direkter Anrede. „Begreift … doch“ vermittelt den dringlichen Imperativ, während „zerreiße“ das bewusst harte Bild des hebräischen Textes bewahrt. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die formale Alternative bezieht.
