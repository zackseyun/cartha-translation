  text: לֹ֣א עַל זְ֭בָחֶי/ךָ אוֹכִיחֶ֑/ךָ וְ/עוֹלֹתֶ֖י/ךָ לְ/נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: de
  text: Nicht wegen deiner Schlachtopfer weise ich dich zurecht; deine Brandopfer sind beständig vor mir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא עַל ... אוֹכִיחֶךָ
  choice: Nicht wegen ... weise ich dich zurecht
  rationale: Die Verneinung mit עַל bezeichnet hier den Anlass beziehungsweise Grund der Zurechtweisung. Die deutsche Wortstellung bewahrt den Nachdruck darauf, dass nicht die Opfer der Grund für Gottes Tadel sind.
- source_word: זְבָחֶיךָ
  choice: deiner Schlachtopfer
  rationale: זֶבַח bezeichnet im kultischen Zusammenhang ein geschlachtetes Opfer. „Schlachtopfer“ unterscheidet den Ausdruck präzise vom folgenden technischen Begriff für Brandopfer.
- source_word: אוֹכִיחֶךָ
  choice: weise ich dich zurecht
  rationale: Das Hifil von יכח bezeichnet hier Tadeln oder Zurechtweisen, ohne zwingend auf eine eng forensische Anklage festgelegt zu sein.
- source_word: וְעוֹלֹתֶיךָ
  choice: deine Brandopfer
  rationale: עוֹלָה ist der technische Ausdruck für das vollständig verbrannte Opfer; „Brandopfer“ ist die geläufige und sachlich genaue deutsche Wiedergabe.
- source_word: לְנֶגְדִּי
  choice: vor mir
  rationale: Die Wendung bezeichnet die Gegenwart beziehungsweise den Blick Gottes und wird im Deutschen natürlich mit „vor mir“ wiedergegeben.
- source_word: תָמִיד
  choice: beständig
  rationale: תָמִיד drückt fortdauernde oder regelmäßige Gegenwart aus. „Beständig“ wahrt diese Spannweite, ohne ausschließlich ununterbrochene Dauer zu behaupten.
theological_decisions:
- issue: Verhältnis der Aussage zum israelitischen Opferdienst
  choice: Gott weist Israel nicht wegen eines Mangels an Opfern zurecht.
  alternative: Gott verwirft den Opferdienst grundsätzlich.
  rationale: Der zweite Satzteil stellt fest, dass die Brandopfer beständig vor Gott sind. Damit liegt der Tadel nicht in ihrem Ausbleiben; die tieferliegende Kritik entfaltet erst der Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schlachtopfer“ und „Brandopfer“ bewahren die kultische Unterscheidung des Hebräischen; die vorangestellte Verneinung erhält den Fokus des Ausgangstextes.
