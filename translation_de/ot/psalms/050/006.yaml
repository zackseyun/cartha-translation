  yaml_path: translation/ot/psalms/050/006.yaml
  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
translation:
  language: de
  text: Und die Himmel verkünden seine Gerechtigkeit[a], denn Gott selbst ist Richter. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein gerechtes Handeln“.'
