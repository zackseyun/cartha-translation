  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und die wesentlichen Aussagen zuverlässig wieder: Die Himmel verkünden Gottes צדק, כִּי begründet dies kausal, und שֹׁפֵט הוּא wird angemessen durch die emphatische nominale Aussage „Gott selbst ist Richter“ wiedergegeben. „Sela“ belässt den unsicheren liturgischen Ausdruck zu Recht unübersetzt.'
