lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: verkünden
  rationale: Der Hifil von נגד bezeichnet hier das öffentliche Bekanntmachen. „Verkünden“ ist im Deutschen natürlich, würdevoll und bewahrt den feierlichen Ton.
- source_word: שָׁמַיִם
  choice: die Himmel
  rationale: Der hebräische Plural wird in poetischer Sprache angemessen mit „die Himmel“ wiedergegeben und behält das erhabene Bild bei.
- source_word: צִדְקוֹ
  choice: seine Gerechtigkeit
  rationale: צדק umfasst sowohl moralische Gerechtigkeit als auch gerechtes richterliches Handeln. „Gerechtigkeit“ wahrt diese semantische Breite.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für die Verkündigung durch die Himmel ein; „denn“ gibt diese Funktion knapp und idiomatisch wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der morphologischen Pluralform ist durch Prädikat und Pronomen eindeutig ein singularischer Bezug gegeben.
- source_word: שֹׁפֵט
  choice: Richter
  rationale: Das Partizip wird prädikativ und nominal verstanden. „Richter“ bewahrt diese Form besser als die verbale Wiedergabe „richtet“.
- source_word: הוּא
  choice: selbst
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor; „Gott selbst“ gibt diesen Nachdruck idiomatisch wieder.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des liturgischen Ausdrucks ist unsicher; daher wird er traditionsgemäß transliteriert statt spekulativ übersetzt.
theological_decisions:
- issue: Bedeutung von צדק im Zusammenhang mit Gottes Richteramt
  choice: seine Gerechtigkeit
  alternative: sein gerechtes Handeln
  rationale: „Gerechtigkeit“ erhält die umfassende moralische und relationale Bedeutung von צדק, ohne den Ausdruck allein auf den gerichtlichen Vollzug einzuengen. Die Fußnote macht die kontextuell mögliche handlungsbezogene Nuance sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetisch-feierlichem Klang. „Die Himmel“ und „Sela“ bewahren die Bildwelt und liturgische Eigenart des hebräischen Psalms; die Satzstruktur bleibt klar und gut verständlich.
