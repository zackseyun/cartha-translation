id: PSA.50.3
reference: Psalms 50:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יָ֤בֹ֥א אֱלֹהֵ֗י/נוּ וְֽ/אַל יֶ֫חֱרַ֥שׁ אֵשׁ לְ/פָנָ֥י/ו תֹּאכֵ֑ל וּ֝/סְבִיבָ֗י/ו נִשְׂעֲרָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: de
  text: Unser Gott kommt und schweigt nicht.[a] Vor ihm her lodert ein verzehrendes Feuer, und rings um ihn stürmt es gewaltig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unser Gott wird kommen und nicht schweigen.“ Die hebräischen Verbformen können in diesem poetischen Zusammenhang Zukunftsbedeutung haben.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher auch: „und rings um ihn stürmt es überaus heftig“; möglich ist ebenso: „rings um ihn tobt ein gewaltiger Sturm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: kommt
  rationale: Das Qal-Imperfekt kann in poetischer Rede gegenwärtige oder zukünftige Bedeutung haben. Das Präsens vergegenwärtigt Gottes Erscheinen; die mögliche Zukunftsbedeutung wird in Fußnote [a] bewahrt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der 1. Person Plural.
- source_word: וְאַל יֶחֱרַשׁ
  choice: und schweigt nicht
  rationale: Die knappe deutsche Formulierung gibt חרשׁ natürlich wieder und versteht die poetische Verbindung als Beschreibung von Gottes Kommen. Die mögliche auffordernde Nuance von אַל wird nicht dogmatisch ausgebaut.
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: Vor ihm her lodert ein verzehrendes Feuer
  rationale: Die Formulierung bewahrt die räumliche Vorstellung von לְפָנָיו und die verzehrende Wirkung von אכל. Die Umformung mit dem Partizipialadjektiv vermeidet im Deutschen die unnatürliche objektlose Wendung „ein Feuer verzehrt“.
- source_word: וּסְבִיבָיו
  choice: und rings um ihn
  rationale: Natürliche und bildhafte Wiedergabe der räumlichen Angabe.
- source_word: נִשְׂעֲרָה מְאֹד
  choice: stürmt es gewaltig
  rationale: Das Nifal bezeichnet heftiges Stürmen oder Toben; מְאֹד verstärkt die Aussage. Die unpersönliche deutsche Konstruktion fügt kein ausdrücklich genanntes Subjekt hinzu.
theological_decisions:
- issue: Zeitbezug von Gottes Kommen
  choice: 'Vergegenwärtigendes Präsens: „kommt“'
  alternative: 'Futur: „wird kommen“'
  rationale: Der hebräische Imperfekt lässt im poetischen Zusammenhang beide Bezüge zu. Der Haupttext wahrt die unmittelbare Darstellung der Gotteserscheinung, während Fußnote [a] die Zukunftslesart offenhält.
- issue: Gottes Erscheinen in Feuer und Sturm
  choice: Direkte, unkommentierte Darstellung der Theophanie
  alternative: Ausdrückliche Deutung auf ein bestimmtes späteres Gerichtsgeschehen
  rationale: Der Vers schildert Gottes machtvolles Kommen, legt aber selbst keinen christologischen oder konfessionellen Deutungsrahmen fest.
- issue: Funktion von אַל in וְאַל יֶחֱרַשׁ
  choice: 'Aussage: „und schweigt nicht“'
  alternative: 'Aufforderung/Wunsch: „er schweige nicht“'
  rationale: Im Zusammenhang lässt sich die Wendung als begleitende Aussage zu Gottes Kommen lesen. Die formal mögliche jussivische Nuance bleibt als sprachliche Spannung bestehen und wird nicht theologisch überbestimmt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit anschaulicher poetischer Bewegung. „Vor ihm her“ erhält die Prozessionsvorstellung der Gotteserscheinung; „verzehrendes Feuer“ gibt den verbalen Sinn idiomatisch wieder, ohne zusätzliche lehrmäßige Deutung.
