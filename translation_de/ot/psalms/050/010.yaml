source:
  edition: WLC
  text: כִּי לִ֥/י כָל חַיְת/וֹ יָ֑עַר בְּ֝הֵמ֗וֹת בְּ/הַרְרֵי אָֽלֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: de
  text: Denn mir gehört jedes Tier des Waldes, das Vieh auf tausend Bergen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die großen Tiere auf tausend Bergen“. Das hebräische Wort kann allgemein größere Tiere oder Tiere überhaupt bezeichnen; „Berge“ kann je nach Landschaft auch mit „Hügel“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und ist im Deutschen der natürliche kausale Anschluss.
- source_word: לִי
  choice: mir gehört
  rationale: Die Präpositionalfügung drückt Besitz aus; „mir gehört“ gibt dies idiomatisch und klar wieder.
- source_word: כָל חַיְתוֹ יָעַר
  choice: jedes Tier des Waldes
  rationale: Die singularische Kollektivform mit כָל hat distributive Kraft. „Tier des Waldes“ ist modern und bewahrt die Zugehörigkeitsbeziehung des Konstrukts.
- source_word: בְּהֵמוֹת
  choice: das Vieh
  rationale: Das Wort bezeichnet größere Tiere und kann hier im Gegenüber zu den Tieren des Waldes als Vieh verstanden werden; die breitere Bedeutung „Tiere“ bleibt in der Fußnote sichtbar.
- source_word: בְּהַרְרֵי
  choice: auf ... Bergen
  rationale: Die Präposition bezeichnet hier den Ort; הָרִים wird sachgerecht mit „Bergen“ wiedergegeben, ohne das Bild zu glätten.
- source_word: אָלֶף
  choice: tausend
  rationale: Die konkrete Zahl des hebräischen Textes wird beibehalten, auch wenn sie poetisch umfassende Fülle ausdrücken kann.
theological_decisions:
- issue: Umfang des göttlichen Besitzanspruchs
  choice: Das poetische Bild nennt Waldtiere und Vieh auf tausend Bergen und vermittelt so umfassenden göttlichen Besitz, ohne die Zahl auszudeuten.
  alternative: Eine streng wörtliche Beschränkung auf Vieh auf genau tausend Bergen oder die Paraphrase „alles Vieh überall“.
  rationale: Die konkrete Bildsprache und Zahl bleiben erhalten; zugleich wird keine dogmatische Präzisierung in den Text eingeführt.
- issue: Verhältnis der beiden Nominalgruppen
  choice: Asyndetische, appositionsnahe Reihung ohne ergänztes „und“.
  alternative: 'Ausdrückliche Koordination: „und das Vieh auf tausend Bergen“.'
  rationale: Im Hebräischen fehlt eine Konjunktion. Die deutsche Reihung bewahrt die knappe poetische Struktur und lässt das genaue syntaktische Verhältnis offen.
translation_notes:
  register: Knappe, würdige poetische Standardsprache. Die asyndetische Reihung folgt der hebräischen Form; „Vieh“ ist geläufig, während die Fußnote die größere Bedeutungsbreite offenhält.
