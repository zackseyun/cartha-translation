  source_fidelity: Der Entwurf gibt die adversative Anrede ("Doch zum"), רָשָׁע als moralisch qualifizierten „Frevler“, die zurechtweisende idiomatische Frage מַה־לְךָ („Welches Recht hast du“), die Satzungen und den Bund zuverlässig wieder. Die infinitivische Verbindung „aufzusagen und … in den Mund zu nehmen“ bildet die beiden hebräischen Handlungen natürlich und sinnentsprechend ab.
  naturalness: Modernes, würdevolles Standarddeutsch. „Welches Recht hast du“ ist klar und hat den nötigen vorwurfsvollen Ton; „meinen Bund in den Mund zu nehmen“ ist idiomatisch. „Frevler“ und „Satzungen“ sind leicht gehoben, aber für Psalmstil und Rechts-/Bundessprache angemessen.
  terminology: „Bund“ ist für בְּרִית konsequent und theologisch neutral. „Satzungen“ gibt חֻקַּי sachgerecht wieder. Die Fußnote bietet eine nachvollziehbare, stärker quellensprachlich geprägte Alternative und ist korrekt verankert.
