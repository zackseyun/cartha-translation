id: PSA.50.16
reference: Psalms 50:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָ֤/רָשָׁ֨ע אָ֘מַ֤ר אֱלֹהִ֗ים מַה לְּ֭/ךָ לְ/סַפֵּ֣ר חֻקָּ֑/י וַ/תִּשָּׂ֖א בְרִיתִ֣/י עֲלֵי פִֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: de
  text: 'Doch zum Frevler sagt Gott: »Welches Recht hast du, meine Satzungen aufzusagen und meinen Bund in den Mund zu nehmen?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Was hast du damit zu tun, meine Satzungen aufzuzählen, und meinen Bund auf deinem Mund zu tragen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: Doch zum Frevler
  rationale: Die Verbindung leitet einen Gegensatz zur vorherigen Anrede ein. „Frevler“ bezeichnet hier eine moralische Kategorie und nicht bloß einen forensisch Schuldigen.
- source_word: אָמַר אֱלֹהִים
  choice: sagt Gott
  rationale: Das hebräische Perfekt dient in der poetischen Einleitung der direkten Rede als lebendige, gegenwärtig wirkende Aussage.
- source_word: מַה לְּךָ
  choice: Welches Recht hast du
  rationale: Die Wendung bestreitet hier die Berechtigung beziehungsweise Angemessenheit des Handelns; die deutsche Formulierung gibt den vorwurfsvollen Sinn klar wieder.
- source_word: לְסַפֵּר
  choice: aufzusagen
  rationale: Das Verb bezeichnet hier das mündliche Wiedergeben oder Rezitieren. „Aufsagen“ ist im Deutschen natürlich und passt zur parallelen Erwähnung des Mundes.
- source_word: חֻקָּי
  choice: meine Satzungen
  rationale: „Satzungen“ bewahrt den rechtlich-bundestheologischen Sinn der vorgeschriebenen Bestimmungen.
- source_word: וַתִּשָּׂא
  choice: und … zu nehmen
  rationale: Das Verb bedeutet wörtlich „heben/tragen“, bezeichnet in Verbindung mit dem Mund aber das Aufgreifen in der Rede. Die infinitivische Koordination ist im Deutschen natürlich.
- source_word: בְרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die sachlich und kanonisch angemessene Wiedergabe des zentralen hebräischen Begriffs בְּרִית.
- source_word: עֲלֵי פִיךָ
  choice: in den Mund
  rationale: Die deutsche Wendung „in den Mund nehmen“ gibt das Bild und dessen Bezug auf das Sprechen idiomatisch wieder; die wörtlichere Form wird in der Fußnote genannt.
theological_decisions:
- issue: Art des Vorwurfs an den Frevler
  choice: Die Frage bestreitet dem Frevler wegen seines widersprüchlichen Lebens die moralische Berechtigung, Gottes Satzungen und Bund zu rezitieren.
  alternative: Ein ausnahmsloses Verbot, Gottes Bund überhaupt mündlich zu erwähnen.
  rationale: Die idiomatische Frage מַה לְּךָ stellt Anspruch und Angemessenheit infrage. Im Zusammenhang richtet sich der Vorwurf gegen heuchlerische Bundesrede, ohne jede Erwähnung Gottes durch einen Frevler pauschal zu verbieten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frevler“ erhält den moralischen Ernst des hebräischen Ausdrucks; „in den Mund nehmen“ und „aufsagen“ sorgen zugleich für natürliche Verständlichkeit.
