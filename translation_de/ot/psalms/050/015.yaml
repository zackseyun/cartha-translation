  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: de
  text: Ruf mich am Tag der Not an; ich werde dich retten, und du wirst mich ehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verherrlichen“. Das hebräische Verb kann „ehren“ oder „verherrlichen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: Ruf mich an
  rationale: קרא mit Objektsuffix bezeichnet hier den Hilferuf an Gott. „Mich anrufen“ ist im modernen Deutschen idiomatisch und bewahrt den Gebets- und Anrufungscharakter.
- source_word: בְּיוֹם
  choice: am Tag
  rationale: Die hebräische Zeitangabe bedeutet wörtlich „am/in dem Tag“. „Am Tag“ erhält die poetische Form und klingt zugleich natürlich.
- source_word: צָרָה
  choice: Not
  rationale: צָרָה bezeichnet Bedrängnis, Not oder eine bedrückende Lage. „Not“ ist knapp, gewichtig und im Kontext eines Hilferufs unmittelbar verständlich.
- source_word: אֲחַלֶּצְךָ
  choice: ich werde dich retten
  rationale: Das Piel von חלץ bedeutet hier, jemanden aus Gefahr zu befreien oder zu retten. „Retten“ ist präzise, natürlich und vermeidet unnötig altertümliche Sprache.
- source_word: וּתְכַבְּדֵנִי
  choice: und du wirst mich ehren
  rationale: Das Piel von כבד kann „ehren“ oder „verherrlichen“ bedeuten. „Mich ehren“ gibt den breiten Sinn wieder und lässt die gültige Alternative in der Fußnote sichtbar.
theological_decisions:
- issue: Reaktion des Menschen auf Gottes Rettung
  choice: und du wirst mich ehren
  alternative: und du wirst mich verherrlichen
  rationale: Der hebräische Text beschreibt die Ehrung Gottes als angemessene Antwort des Geretteten. „Ehren“ bewahrt den weiten Bedeutungsumfang, ohne die Aussage auf einen ausdrücklich doxologischen oder liturgischen Sinn zu verengen.
translation_notes:
  register: Moderne, würdevolle und gut verständliche Standardsprache. Der Imperativ ist direkt, die poetische Dreigliedrigkeit bleibt erhalten; „am Tag der Not“ bewahrt das hebräische Bild, ohne unnatürlich zu wirken.
