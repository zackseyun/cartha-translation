  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: de
  text: Von Zion, dem Inbegriff der Schönheit, strahlt Gott hervor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus Zion, dem Inbegriff der Schönheit, hat Gott hervorgestrahlt“; möglicherweise auch: „Von Zion strahlt Gott in vollkommener Schönheit hervor.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצִּיּוֹן
  choice: Von Zion
  rationale: Die Präposition מִן bezeichnet hier Ausgangspunkt oder Ursprung. „Von Zion“ ist im modernen Deutschen natürlich und bewahrt die räumliche Herkunftsangabe.
- source_word: מִכְלַל יֹפִי
  choice: der Vollendung der Schönheit
  rationale: מִכְלַל bezeichnet in der Verbindung mit יֹפִי Ganzheit oder vollkommene Ausprägung. Die Formulierung gibt die poetische Charakterisierung Zions als Inbegriff vollendeter Schönheit wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv ist wegen des Verbs im Singular eindeutig singularisch zu verstehen.
- source_word: הוֹפִיעַ
  choice: strahlt … hervor
  rationale: Der Hifil von יפע kann ein strahlendes Erscheinen bezeichnen. Das Präsens bewahrt die lebendige poetische Darstellung; aufgrund der hebräischen Perfektform ist auch eine vollendete Wiedergabe möglich.
theological_decisions:
- issue: Bezug von מִכְלַל יֹפִי auf Zion oder auf Gottes Erscheinen
  choice: 'Die Wendung wird als Apposition zu Zion verstanden: „Zion, der Vollendung der Schönheit“.'
  alternative: 'Adverbial auf Gottes Erscheinen bezogen: „Von Zion strahlt Gott in vollkommener Schönheit hervor.“'
  rationale: Die Wortfolge legt am ehesten eine appositionelle Beschreibung Zions nahe. Die Fußnote bewahrt die echte syntaktische Mehrdeutigkeit.
translation_notes:
  register: Gehobene, aber verständliche poetische Sprache. „Strahlt … hervor“ erhält sowohl das Lichtbild als auch den Gedanken des majestätischen Erscheinens; „Vollendung der Schönheit“ wahrt die ungewöhnliche Dichte des hebräischen Ausdrucks.
