  terminology: „Gott“ und „strahlt ... hervor“ sind treffend. „Inbegriff der Schönheit“ bewahrt den Sinn von מִכְלַל יֹפִי als höchste bzw. vollkommene Ausprägung, ohne die Bildsprache unnötig zu verflachen.
