  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: מִן bezeichnet den Ausgangspunkt („von/aus Zion“), אֱלֹהִים ist aufgrund des Singularverbs als „Gott“ zu verstehen, und הוֹפִיעַ beschreibt Gottes strahlendes Hervortreten. Die appositionelle Deutung von מִכְלַל יֹפִי zu Zion ist gut begründet; die alternative adverbiale Deutung bleibt sinnvollerweise in der Fußnote erhalten.'
