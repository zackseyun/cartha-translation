  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: de
  text: Ich kenne jeden Vogel der Berge, und die Tiere meiner Felder[a] sind bei mir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was sich auf meinen Feldern regt“ oder „die wilden Tiere meiner Felder“. Das hebräische Wort זִיז ist selten und in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „gehören mir“. Wörtlich steht im Hebräischen: „sind bei mir“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Ich kenne
  rationale: Das Qal-Perfekt der ersten Person Singular bezeichnet hier Gottes beständiges, umfassendes Wissen; im Deutschen gibt das Präsens diesen stativen Sinn natürlich wieder.
- source_word: כָּל עוֹף
  choice: jeden Vogel
  rationale: כָּל mit dem singularischen Kollektivbegriff עוֹף erhält distributiven Sinn. „Jeden Vogel“ ist im Deutschen natürlich und bringt die umfassende Kenntnis jedes einzelnen Vogels zum Ausdruck.
- source_word: הָרִים
  choice: der Berge
  rationale: Die Grundbedeutung des Plurals wird direkt wiedergegeben und bewahrt die wilde, erhöhte Landschaft des poetischen Bildes.
- source_word: וְזִיז
  choice: und die Tiere
  rationale: זִיז ist ein seltenes und schwieriges Wort, das hier wahrscheinlich die sich im offenen Land bewegenden Lebewesen bezeichnet. „Tiere“ ist verständlich und vermeidet eine unbegründete Festlegung auf eine bestimmte Tierart.
- source_word: שָׂדַי
  choice: des Feldes
  rationale: Der Singular bezeichnet in poetischer Sprache das offene Land; „des Feldes“ wahrt das Bild und den Parallelismus mit den Bergen.
- source_word: עִמָּדִי
  choice: sind bei mir
  rationale: Die hebräische Präposition bedeutet wörtlich „bei/mit mir“. Der Plural richtet sich im Deutschen natürlich nach „die Tiere“. Die Formulierung lässt die im Kontext mögliche Bedeutung von Zugehörigkeit anklingen, ohne sie ausdrücklich in den Text einzutragen.
theological_decisions:
- issue: Implizierter göttlicher Besitz in עִמָּדִי
  choice: „sind bei mir“ als möglichst direkte Wiedergabe
  alternative: „gehören mir“
  rationale: Im Zusammenhang spricht Gott von seiner souveränen Beziehung zur Schöpfung; Besitz kann mitgemeint sein. Da der hebräische Ausdruck jedoch wörtlich „bei mir“ lautet, bleibt diese Folgerung offen, statt sie ausdrücklich festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Der Parallelismus zwischen „Vogel der Berge“ und „Tiere des Feldes“ bleibt erhalten; die Unsicherheit des seltenen Wortes זִיז wird in der Fußnote kenntlich gemacht.
