  text: אַל יֹאמְר֣וּ בְ֭/לִבָּ/ם הֶאָ֣ח נַפְשֵׁ֑/נוּ אַל יֹ֝אמְר֗וּ בִּֽלַּעֲנֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: de
  text: 'Lass sie nicht in ihrem Herzen sagen: »Ha, ganz nach unserem Wunsch!«[a] Lass sie nicht sagen: »Wir haben ihn verschlungen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ha, unsere Seele!« Das hebräische Wort kann hier das innere Verlangen, den Wunsch oder dessen Befriedigung bezeichnen; daher auch: »Ha, unser Wunsch!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: Sie sollen nicht sagen
  rationale: אַל mit der Jussivform drückt hier im Gebet den Wunsch aus, dass die Feinde dies nicht sagen können. Die deutsche Soll-Form gibt diesen negativen Wunsch natürlich wieder.
- source_word: בְלִבָּם
  choice: in ihrem Herzen
  rationale: Die wörtliche kollektive Singularform bleibt erhalten und bezeichnet das innere Denken der Gegner.
- source_word: הֶאָח
  choice: Ha
  rationale: Die Interjektion drückt hämische Genugtuung oder triumphierenden Spott aus; »Ha« ist im heutigen Deutsch knapp und natürlich.
- source_word: נַפְשֵׁנוּ
  choice: genau das wollten wir
  rationale: נֶפֶשׁ bezeichnet hier wahrscheinlich das innere Verlangen beziehungsweise dessen Befriedigung, nicht eine immaterielle Seele. Die idiomatische Formulierung bewahrt den triumphierenden Sinn.
- source_word: בִּלַּעֲנוּהוּ
  choice: Wir haben ihn verschlungen
  rationale: בלע bedeutet wörtlich »verschlingen« oder »hinunterschlucken«. »Verschlungen« erhält das anschauliche Bild vollständiger Vernichtung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Ausruf wird idiomatisch verständlich wiedergegeben; die Fußnote bewahrt die ungewöhnliche hebräische Formulierung und ihre Mehrdeutigkeit. Die Wiederholung von »Sie sollen nicht sagen« und das Bild des Verschlingens bleiben erhalten.
