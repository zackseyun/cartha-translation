  language: en
  yaml_path: translation/ot/psalms/035/018.yaml
  text: I will give thanks to you in the great assembly[b][a]; among a mighty people I will praise you.
translation:
  language: de
  text: Ich will dir danken in einer großen Versammlung[a]; inmitten eines zahlreichen Volkes[b] will ich dich preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in großer Gemeinde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „inmitten eines mächtigen Volkes“; das hebräische Wort kann sowohl „zahlreich“ als auch „mächtig, stark“ bedeuten.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Ich will dir danken
  rationale: Das Hifil von ידה bezeichnet im gottesdienstlichen Zusammenhang häufig Danken oder lobendes Bekennen. „Danken“ wahrt hier den Unterschied zum ausdrücklichen „preisen“ im zweiten Halbvers.
- source_word: בְּקָהָל רָב
  choice: in einer großen Versammlung
  rationale: קהל bezeichnet eine versammelte Gemeinschaft; רב kann ihre Größe oder Zahl hervorheben. „Große Versammlung“ ist natürlich, würdevoll und hält die Aussage allgemein.
- source_word: בְּעַם עָצוּם
  choice: inmitten eines zahlreichen Volkes
  rationale: עם bedeutet „Volk“, während עצום sowohl große Zahl als auch Stärke/Macht ausdrücken kann. Wegen der Parallele zur großen Versammlung steht im Haupttext die zahlenmäßige Bedeutung; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: אֲהַלְלֶךָּ
  choice: will ich dich preisen
  rationale: Das Piel von הלל bedeutet regelmäßig „preisen“ oder „rühmen“. „Preisen“ ist im Deutschen direkt, verständlich und entspricht dem öffentlichen Lob in diesem Zusammenhang.
