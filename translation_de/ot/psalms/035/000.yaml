  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: de
  text: Von David. Streite, HERR, gegen die, die gegen mich streiten; kämpfe gegen die, die gegen mich kämpfen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe Überschrift bewahrt die im Hebräischen offene Beziehung des Psalms zu David; לְ kann Herkunft, Zuordnung oder Widmung ausdrücken.
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: Streite ... gegen die, die gegen mich streiten
  rationale: Die Wiedergabe erhält das hebräische Wortspiel und die Parallelität. ריב kann auch einen Rechtsstreit bezeichnen, doch der folgende Kampfbegriff stützt hier die breitere Bedeutung „streiten“.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen ist würdig, geläufig und unterscheidet ihn vom gewöhnlichen Titel „Herr“.
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: kämpfe gegen die, die gegen mich kämpfen
  rationale: Die etymologische Wiederholung des hebräischen Verbs und Partizips wird natürlich und prägnant nachgebildet.
theological_decisions:
- issue: Forensische oder allgemein-konflikthafte Bedeutung von ריב
  choice: Die allgemeinere Bedeutung „streiten“ steht im Haupttext.
  alternative: „Führe meinen Rechtsstreit gegen meine Gegner“ bzw. „Vertritt meine Sache“
  rationale: ריב besitzt sowohl rechtliche als auch allgemein konflikthafte Bedeutung. Die unmittelbare Parallele mit לחם („kämpfen“) begünstigt „streiten“, ohne die mögliche Gerichtssprache dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Die Wiederholungen sind bewusst erhalten, weil sie die eindringliche Form des hebräischen Textes tragen. „HERR“ gibt das Tetragramm wieder.
