  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: de
  text: Wach auf und erwache für mein Recht[a], mein Gott und mein Herr, für meine Sache[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu meinem Gericht“ oder „zu meiner Rechtfertigung“. Das hebräische Wort kann je nach Zusammenhang Gericht, Recht oder eine rechtliche Rechtfertigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für meinen Rechtsfall“ beziehungsweise „für meinen Rechtsstreit“. Das hebräische Wort bezeichnet eine Streitsache oder rechtliche Auseinandersetzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: Wach auf
  rationale: Der Hifil-Imperativ von עור ist eine dringliche Bitte an Gott, tätig einzugreifen. „Wach auf“ bewahrt das Bild scheinbarer Untätigkeit, ohne es erklärend aufzulösen.
- source_word: וְהָקִיצָה
  choice: und erhebe dich
  rationale: Das zweite Verb des Erwachens verstärkt den Aufruf. Die eigenständige Wiedergabe vermeidet eine schwerfällige Wiederholung und bringt den Ruf zum Eingreifen zum Ausdruck.
- source_word: לְמִשְׁפָּטִי
  choice: für mein Recht
  rationale: מִשְׁפָּט kann Gericht, Recht, richterliche Entscheidung oder Rechtfertigung bezeichnen. „Mein Recht“ ist im Deutschen natürlich, erhält den forensischen Sinn und legt das Ergebnis nicht so stark fest wie „meine Rechtfertigung“.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Direkte Anrede mit Possessivsuffix; entsprechend wörtlich und idiomatisch wiedergegeben.
- source_word: וַאדֹנָי
  choice: und mein Herr
  rationale: אֲדֹנָי ist hier eine ehrerbietige Gottesanrede. „Herr“ entspricht dem Titel in natürlicher deutscher Gebetssprache, ohne eine zusätzliche christologische Deutung einzutragen.
- source_word: לְרִיבִי
  choice: für meine Sache
  rationale: רִיב bezeichnet einen Rechtsstreit, eine Streitsache oder einen Rechtsfall. „Meine Sache“ ist verständlich und würdig; die rechtliche Färbung wird im Kontext und in der Fußnote sichtbar gehalten.
theological_decisions:
- issue: Die doppelte Gottesanrede אֱלֹהַי וַאדֹנָי
  choice: mein Gott und mein Herr
  alternative: mein Gott und mein Gebieter
  rationale: Die beiden ehrerbietigen Anreden bleiben nebeneinander stehen. „Herr“ ist für den göttlichen Titel angemessen und trägt keine speziell christologische Aussage in den Psalm ein.
- issue: Forensische Bedeutung von מִשְׁפָּטִי
  choice: für mein Recht
  alternative: für mein Gericht / zu meiner Rechtfertigung
  rationale: Die Formulierung bewahrt die Spannung zwischen Recht, Gerichtsentscheidung und vindizierender Entscheidung, statt eindeutig vorwegzunehmen, dass der Beter freigesprochen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Gebetssprache. Die beiden Imperative bleiben eindringlich; die hebräische Wortstellung mit der Gottesanrede zwischen den beiden Rechtsbegriffen wird weitgehend bewahrt. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
