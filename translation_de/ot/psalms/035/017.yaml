  text: אֲדֹנָ/י֮ כַּ/מָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָ/ה נַ֭פְשִׁ/י מִ/שֹּׁאֵי/הֶ֑ם מִ֝/כְּפִירִ֗ים יְחִידָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: de
  text: Herr, wie lange wirst du zusehen? Rette mein Leben aus ihren Verheerungen, mein Einziges vor den jungen Löwen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Einzige“. Gemeint ist wahrscheinlich das einzigartige und kostbare Leben des Beters; der poetische Ausdruck kann jedoch bewusst knapp und mehrdeutig sein.'
    reason: יְחִידָתִי ist eine feminine substantivierte Form („meine Einzige“). Im Parallelismus mit „mein Leben“ liegt die Deutung auf das kostbare, einzige Leben nahe; die Fußnote wahrt zugleich die poetische Offenheit des Ausdrucks.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die Anrede bezeichnet den souveränen Herrn; „Herr“ ist die natürliche und traditionsgemäße deutsche Wiedergabe.
- source_word: כַּמָּה תִרְאֶה
  choice: wie lange willst du zusehen?
  rationale: Wörtlich steht eine Frage nach dem Maß bzw. der Dauer des Sehens. Im Kontext drückt sie die Klage über Gottes ausbleibendes Eingreifen aus, ohne ihm Gleichgültigkeit zuzuschreiben.
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: Rette mein Leben
  rationale: נפש bezeichnet hier den bedrohten Menschen bzw. sein Leben. השיב kann in dieser Bitte „zurückholen, wiederherstellen, retten“ bedeuten; idiomatisches Deutsch verlangt hier „rette“.
- source_word: מִשֹּׁאֵיהֶם
  choice: vor ihren Verwüstungen
  rationale: Das seltene Wort ist wahrscheinlich von שׁאה im Sinn von Verwüstung oder Zerstörung abzuleiten. Die Wiedergabe bewahrt diese lexikalische Möglichkeit, statt die Angreifer selbst einzusetzen.
- source_word: יְחִידָתִי
  choice: mein einziges Gut
  rationale: Die feminine Form meint das einzige, einzigartige und daher besonders kostbare Leben des Beters. „Mein einziges Gut“ erhält die poetische Parallelität, ohne im Deutschen fälschlich eine weitere Person nahezulegen.
- source_word: כְּפִירִים
  choice: junge Löwen
  rationale: Das Wort bezeichnet junge, kräftige Löwen und dient hier als Bild für die gefährlichen Feinde.
theological_decisions:
- issue: Gottes scheinbares Nichteingreifen
  choice: „wie lange willst du zusehen?“
  alternative: „wie lange wirst du zusehen?“
  rationale: Die Formulierung bewahrt den eindringlichen Klagecharakter. Sie beschreibt die Erfahrung des Beters und trifft keine systematische Aussage über Gottes Wissen oder Fürsorge.
- issue: Verhältnis von „mein Leben“ und „mein einziges Gut“
  choice: Beide Ausdrücke bleiben parallel erhalten.
  alternative: Beide als „mein Leben“ wiedergeben.
  rationale: Der hebräische Parallelismus identifiziert das bedrohte Leben als das Einzige und Kostbare, lässt aber durch den Ausdruck יחידה eine poetische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Klagegebet mit direkter Anrede. Die Bildsprache und der Parallelismus werden bewahrt; seltene oder im Deutschen missverständliche Wendungen werden knapp erläutert.
