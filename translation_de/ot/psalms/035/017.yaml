review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Bildsprache entsprechen dem Hebräischen: Gottes langes Zuschauen, die Bitte um Rettung, die Verwüstungen der Feinde und die jungen Löwen. „Mein einziges Gut“ verengt יְחִידָתִי jedoch auf Besitz und ist weder vom Wortlaut noch vom Parallelismus mit „mein Leben“ gedeckt. Die Formulierung sollte die poetisch-substantivische und nicht völlig eindeutige Bezeichnung bewahren.'
  naturalness: „Herr, wie lange wirst du zusehen?“ ist im modernen würdigen Deutsch eine natürliche Klagefrage und gibt den hebräischen Imperfektgebrauch ohne den stärker voluntativen Unterton von „willst du“ wieder. „Aus ihren Verheerungen“ ist als Entsprechung zu „from their ravages“ idiomatischer und zielgenauer als „vor ihren Verwüstungen“.
  terminology: „Herr“, „Leben“ und „junge Löwen“ sind angemessen. „Mein Einziges“ bewahrt die ungewöhnliche, substantivierte Ausdrucksweise von יְחִידָתִי; die Fußnote erläutert die naheliegende Deutung auf das kostbare Leben, ohne sie zum Textsinn zu verabsolutieren.
  issues:
  - severity: medium
    issue: „mein einziges Gut“ für יְחִידָתִי
    rationale: „Gut“ bezeichnet im Deutschen vorrangig Besitz bzw. Eigentum. Der hebräische Ausdruck steht hier parallel zu נַפְשִׁי („mein Leben/meine Person“) und meint wahrscheinlich das einzigartige, kostbare Leben des Beters, behält aber eine poetische Mehrdeutigkeit. Die Besitzbedeutung ist daher irreführend.
  - severity: low
    issue: „vor ihren Verwüstungen“
    rationale: Die Präposition kann zwar im Deutschen die Rettung vor einer Gefahr ausdrücken, aber „aus ihren Verheerungen“ gibt die Rettung aus dem bereits erfahrenen Unheil sowie den hebräischen Ausdruck „aus/von ihren Verwüstungen“ unmittelbarer wieder.
  - severity: low
    issue: „wie lange willst du zusehen?“
    rationale: Die Lesart ist möglich, doch „wirst du zusehen?“ gibt die zeitlich offene Klagefrage des hebräischen Imperfekts neutraler wieder und vermeidet einen unnötig stark auf Gottes Wollen zielenden Unterton.
