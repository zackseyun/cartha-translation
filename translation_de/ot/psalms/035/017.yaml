revisions:
- from: Herr, wie lange willst du zusehen? Rette mein Leben vor ihren Verwüstungen, mein einziges Gut vor den jungen Löwen.[a]
  to: Herr, wie lange wirst du zusehen? Rette mein Leben aus ihren Verheerungen, mein Einziges vor den jungen Löwen.[a]
  rationale: Die Revision ersetzt die sachlich nicht gedeckte Besitzmetapher „mein einziges Gut“ durch „mein Einziges“ und erläutert deren wahrscheinliche Beziehung zu „mein Leben“ in einer knappen Fußnote. Außerdem werden die Rettung „aus ihren Verheerungen“ und die offene Zeitfrage idiomatischer und näher am hebräischen Wortlaut formuliert. Bedeutung, Parallelismus und feindliche Löwenmetaphorik bleiben erhalten.
