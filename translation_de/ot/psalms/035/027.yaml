  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: de
  text: 'Jubeln und sich freuen sollen alle, die Freude daran haben, dass mir Recht widerfährt[a]. Immer sollen sie sagen: »Jahwe werde groß gepriesen, der am Frieden[b] seines Dieners Gefallen hat!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alternativ: »die Gefallen an meiner Gerechtigkeit haben« oder »an meinem Recht«. Im Zusammenhang ist wahrscheinlich gemeint, dass der Psalmist als im Recht erwiesen wird.'
    reason: lexical_alternative
  - marker: b
    text: »Frieden« kann hier auch »Wohlergehen« oder »Gedeihen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: jubeln
  rationale: Das Verb bezeichnet einen lauten, freudigen Jubelruf; »jubeln« gibt diesen öffentlichen und überschwänglichen Charakter natürlich wieder.
- source_word: וְיִשְׂמְחוּ
  choice: und sich freuen
  rationale: שׂמח bezeichnet Freude oder Fröhlichkeit. Die Wendung bewahrt den parallelen zweiten Ausdruck neben »jubeln«.
- source_word: חֲפֵצֵי צִדְקִי
  choice: die Freude daran haben, dass mir Recht widerfährt
  rationale: חפץ drückt Gefallen oder Freude aus. Im Rechtsstreit des Psalms bezeichnet צִדְקִי wahrscheinlich die Bestätigung, dass der Psalmist im Recht ist. Die verbale Formulierung klingt im heutigen Deutsch natürlicher als »meine Rechtfertigung«, ohne die forensische Bedeutung aufzugeben.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: Immer sollen sie sagen
  rationale: Die Aufforderungs- beziehungsweise Wunschbedeutung wird mit »sollen« fortgeführt; »immer« gibt תָּמִיד knapp und idiomatisch wieder.
- source_word: יִגְדַּל יְהוָה
  choice: Jahwe werde groß gepriesen
  rationale: Der Jussiv ist als Wunsch- und Lobformel wiedergegeben. »Groß gepriesen« vermittelt im Deutschen idiomatisch, dass Jahwes Größe öffentlich bekannt und gerühmt werden soll.
- source_word: הֶחָפֵץ
  choice: der … Gefallen hat
  rationale: Das Partizip bezeichnet anhaltendes Wohlgefallen. »Gefallen haben« bewahrt diese Bedeutung und nimmt den Gedanken von חֲפֵצֵי aus der ersten Vershälfte auf.
- source_word: שְׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם kann Frieden, Wohlergehen und Gedeihen umfassen. »Frieden« ist die direkte Hauptwiedergabe; die weitere Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: עַבְדּוֹ
  choice: seines Dieners
  rationale: Im Verhältnis des Psalmisten zu Gott ist »Diener« die natürliche und kontextgemäße deutsche Wiedergabe.
theological_decisions:
- issue: Bedeutung von צִדְקִי
  choice: dass mir Recht widerfährt
  alternative: meine Gerechtigkeit; mein Recht; meine Rechtfertigung
  rationale: Der Zusammenhang handelt von Gegnern und Anklägern; daher liegt die forensische Bedeutung nahe, dass der Psalmist als im Recht erwiesen wird. Die Fußnote wahrt die breitere moralische und rechtliche Bedeutungsbreite.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname wird als »Jahwe« transliteriert und nicht durch einen Titel ersetzt.
- issue: Aussage über Gottes Gefallen am שְׁלוֹם seines Dieners
  choice: Frieden
  alternative: Wohlergehen; Gedeihen
  rationale: Die Hauptübersetzung wahrt den geläufigen Grundbegriff, während die Fußnote deutlich macht, dass umfassendes Wohlergehen mitgemeint sein kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Folge »Jubeln und sich freuen sollen …« erhält den poetischen Nachdruck des Hebräischen. Der Wunschcharakter der Verbformen bleibt erhalten; echte Bedeutungsbreiten werden in den Fußnoten offengelegt.
