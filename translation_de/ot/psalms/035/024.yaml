  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: de
  text: Verschaffe mir Recht nach deiner Gerechtigkeit[a], Jahwe, mein Gott, und lass sie nicht über mich jubeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach deinem Recht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Verschaffe mir Recht
  rationale: Der Imperativ von שׁפט mit persönlichem Objekt bittet in diesem Klagekontext um ein gerechtes Urteil zugunsten des Beters. Die Formulierung bewahrt den forensischen Sinn, ohne ein günstiges Urteil ausdrücklich vorwegzunehmen.
- source_word: כְצִדְקְךָ
  choice: nach deiner Gerechtigkeit
  rationale: צדק bezeichnet hier Gottes gerechtes Wesen beziehungsweise seinen gerechten Maßstab. „Gerechtigkeit“ bewahrt die lexikalische und theologische Weite; „Recht“ ist eine mögliche kontextuelle Alternative.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Das hebräische Suffix der ersten Person Singular wird direkt und natürlich wiedergegeben.
- source_word: וְאַל יִשְׂמְחוּ
  choice: und lass sie nicht … jubeln
  rationale: אַל mit dem Imperfekt drückt eine verneinte Bitte aus. „Lass sie nicht“ macht deutlich, dass die Bitte an Gott gerichtet ist.
- source_word: לִי
  choice: über mich
  rationale: Im feindseligen Zusammenhang bezeichnet לִי das hämische Freuen auf Kosten des Beters; „über mich jubeln“ ist dafür eine natürliche deutsche Wendung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der persönliche Gottesname des hebräischen Textes bleibt als Name erkennbar, statt durch „der HERR“ ersetzt zu werden.
- issue: Bedeutungsumfang von צִדְקְךָ
  choice: deiner Gerechtigkeit
  alternative: deinem Recht
  rationale: „Gerechtigkeit“ erhält die moralische und forensische Bedeutungsbreite des hebräischen Ausdrucks; die eng verwandte Lesart „Recht“ wird in der Fußnote genannt.
- issue: Forensische Aussage von שָׁפְטֵנִי
  choice: Verschaffe mir Recht
  alternative: Richte mich
  rationale: Im Kontext bittet der Psalmist um Gottes richterliches Eingreifen. Die gewählte Formulierung gibt den kontextuell erwarteten günstigen Ausgang wieder, ohne die Grundbedeutung des Richtens zu verlieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschaffe mir Recht“ ist verständlich und erhält den gerichtlichen Charakter der Bitte; „jubeln“ bringt den feindseligen Triumph knapp zum Ausdruck.
