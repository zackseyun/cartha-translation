id: PSA.35.2
reference: Psalms 35:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַחֲזֵ֣ק מָגֵ֣ן וְ/צִנָּ֑ה וְ֝/ק֗וּמָ/ה בְּ/עֶזְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/002.yaml
  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: de
  text: Ergreife Schild und Langschild[a] und erhebe dich, um mir zu helfen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet wahrscheinlich einen großen, den Körper deckenden Schild; im Vers stehen zwei verschiedene Wörter für Schilde.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Ergreife
  rationale: Der Imperativ fordert Gott im kriegerischen Bild dazu auf, die Waffen in die Hand zu nehmen. „Ergreife“ gibt die konkrete Handlung knapp und würdig wieder.
- source_word: מָגֵן
  choice: Schild
  rationale: מָגֵן ist die allgemeine Bezeichnung für einen Schild. Das einfache „Schild“ ist im Deutschen natürlich und bewahrt das militärische Bild.
- source_word: צִנָּה
  choice: Langschild
  rationale: צִנָּה bezeichnet wahrscheinlich einen größeren, den Körper stärker deckenden Schild und unterscheidet sich von מָגֵן. „Langschild“ macht diesen Unterschied in verständlichem modernem Deutsch sichtbar.
- source_word: וְקוּמָה
  choice: und erhebe dich
  rationale: Der Imperativ von קום mit paragogischem He ist ein dringender Ruf zum Eingreifen. „Erhebe dich“ bewahrt sowohl die Bewegung als auch den gehobenen Gebetston.
- source_word: בְּעֶזְרָתִי
  choice: um mir zu helfen
  rationale: Die Verbindung bezeichnet hier das Eingreifen zugunsten des Beters. Die verbale deutsche Formulierung ist natürlich und gibt den Sinn der hebräischen Wendung klar wieder.
theological_decisions:
- issue: Darstellung Gottes in kriegerischen Bildern
  choice: 'Das konkrete Bild bleibt erhalten: Gott ergreift zwei Arten von Schilden und erhebt sich, um dem Beter zu helfen.'
  alternative: Die Aussage zu einer allgemeinen Bitte um Schutz abschwächen.
  rationale: Der hebräische Text verwendet ausdrücklich militärische Bildsprache und stellt Gott als kämpferischen Beschützer dar. Diese Metapher soll nicht in eine abstrakte Schutzaussage aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Langschild“ hält die beiden hebräischen Schildbegriffe auseinander, ohne auf ein missverständliches oder veraltetes Fachwort auszuweichen.
