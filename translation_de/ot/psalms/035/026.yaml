  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥/י יִֽלְבְּשׁוּ בֹ֥שֶׁת וּ/כְלִמָּ֑ה הַֽ/מַּגְדִּילִ֥ים עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: de
  text: Alle, die sich über mein Unglück freuen, sollen sich allesamt schämen und zuschanden werden; mit Scham und Schande sollen sich die kleiden, die sich über mich erheben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gegen mich großtun“ oder „die sich mir gegenüber brüsten“. Wörtlich spricht das Hebräische davon, sich über jemanden groß zu machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sollen sich schämen
  rationale: Das Qal-Imperfekt steht hier im Kontext einer Bitte bzw. Verwünschung. „Sich schämen“ gibt den Zustands- und Ergebnissinn des Verbs wieder, ohne eine im Hebräischen nicht ausdrücklich bezeichnete handelnde Person einzuführen.
- source_word: וְיַחְפְּרוּ
  choice: und ... zuschanden werden
  rationale: חפר bezeichnet in diesem Zusammenhang Beschämung und Entehrung. „Zuschanden werden“ ist im gehobenen modernen Deutsch verständlich und hält die Nuance neben בוש fest.
- source_word: יַחְדָּו
  choice: miteinander
  rationale: Das Adverb bezeichnet das gemeinsame Ergehen der ganzen Gruppe; „miteinander“ fügt sich hier natürlicher in den deutschen Satz als „zusammen“.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: alle, die sich über mein Unglück freuen
  rationale: רָעָתִי meint hier das den Beter treffende Übel oder Unheil, nicht seine moralische Bosheit. „Unglück“ wahrt diese persönliche Unheilsbedeutung.
- source_word: יִלְבְּשׁוּ
  choice: sollen sich ... kleiden
  rationale: Die Wiedergabe bewahrt das hebräische Bild, nach dem Scham und Schande wie ein Kleid angelegt werden.
- source_word: בֹשֶׁת וּכְלִמָּה
  choice: Scham und Schande
  rationale: Die geläufige deutsche Wortpaarung erhält die beiden nahezu synonymen Substantive und ihre verstärkende Wirkung.
- source_word: הַמַּגְדִּילִים עָלָי
  choice: die sich über mich erheben
  rationale: Die Form bezeichnet ein Sich-groß-Machen über bzw. gegen den Beter. „Sich über mich erheben“ ist natürliches Deutsch und bewahrt sowohl die räumliche Bildlichkeit als auch den Hochmut, ohne die Bedeutung auf verbales Prahlen zu verengen.
