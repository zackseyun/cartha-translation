base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: de
  text: Unversehens komme Verderben über ihn[a]; sein Netz, das er verborgen hat, fange ihn[b]. In eben dieses Verderben falle er[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Verderben komme über ihn; er weiß es nicht.“ Auch möglich: „Unerwartet komme Verderben über ihn.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein Netz, das er verborgen hat, fange ihn.“'
    reason: formal_rendering
  - marker: c
    text: 'Das abschließende feminine hebräische Suffix kann sich auch auf das Netz beziehen: „In sein eigenes Netz falle er.“ Es kann jedoch „Verderben“ wiederaufnehmen und dieses betonen, wie im Haupttext.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: komme … über ihn
  rationale: Die Jussivform wird im Gebets- und Fluchkontext mit dem deutschen Konjunktiv I wiedergegeben; so bleibt die Grundbedeutung von בוא erhalten.
- source_word: שׁוֹאָה
  choice: Verderben
  rationale: Das Wort bezeichnet vernichtendes Unheil oder Untergang. „Verderben“ ist im Psalmregister würdig und kann an beiden Stellen einheitlich verwendet werden.
- source_word: לֹא יֵדָע
  choice: unversehens
  rationale: Wörtlich steht „er weiß es nicht“. „Unversehens“ gibt die fehlende Kenntnis beim Eintreffen des Unheils knapp und natürlich wieder; die wörtlichere Fassung steht in der Fußnote.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: das Netz, das er heimlich ausgelegt hat
  rationale: רשתו bedeutet „sein Netz“, und טמן „verbergen“. Im Zusammenhang einer Falle gibt „heimlich ausgelegt“ die verborgene Absicht idiomatisch wieder.
- source_word: תִּלְכְּדוֹ
  choice: fange ihn selbst
  rationale: לכד bezeichnet das Fangen oder Ergreifen. „Ihn selbst“ verdeutlicht im Deutschen natürlich die Umkehrung der von ihm gelegten Falle.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: In eben dieses Verderben soll er fallen
  rationale: Die vorangestellte Präpositionalphrase mit dem resumptiven femininen Pronomen kann emphatisch verstanden werden. „Eben dieses“ bildet die Betonung ab, ohne die hebräische Wiederholung unbeholfen nachzuahmen.
theological_decisions:
- issue: Bezug des femininen Suffixes in בָּהּ
  choice: Bezug auf שׁוֹאָה („Verderben“) als emphatische Wiederaufnahme
  alternative: 'Bezug auf רשת („Netz“): „In sein eigenes Netz soll er fallen“'
  rationale: Sowohl שׁוֹאָה als auch רשת sind feminin. Die unmittelbare Wiederholung von בְּשׁוֹאָה spricht im Haupttext für die Wiederaufnahme von „Verderben“; die echte syntaktische Mehrdeutigkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Psalmdeutsch. Der Konjunktiv „komme“ und die Formulierung „soll er fallen“ bewahren den bittenden beziehungsweise verwünschenden Charakter. „Unversehens“ ist leicht gehoben, aber allgemein verständlich; die Fußnote sichert die hebräische Ausdrucksweise. Alle Fußnotenmarker stehen im Haupttext.
