id: PSA.35.9
reference: Psalms 35:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: de
  text: Dann wird meine Seele sich über Jahwe freuen; sie wird über seine Rettung jubeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und meine Seele wird sich über Jahwe freuen; sie wird über sein Heil jubeln.“'
    reason: Das einleitende וְ kann schlicht mit „Und“ wiedergegeben werden; יְשׁוּעָה kann neben konkreter „Rettung“ auch umfassender „Heil“ bedeuten.
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Dann wird meine Seele
  rationale: נֶפֶשׁ bezeichnet hier poetisch das innere Selbst beziehungsweise die ganze Person. Das vorangestellte וְ knüpft an die erwartete Rettung im vorherigen Zusammenhang an und wird daher natürlich mit „Dann“ wiedergegeben.
- source_word: תָּגִיל
  choice: wird sich freuen
  rationale: גיל bezeichnet freudiges Frohlocken. „Sich freuen“ ist gegenwärtiges, verständliches Deutsch und lässt Raum für die Steigerung im parallelen zweiten Satzteil.
- source_word: בַּיהוָה
  choice: über Jahwe
  rationale: Die Präposition ב bezeichnet hier den Gegenstand beziehungsweise Grund der Freude. Im Deutschen ist „sich über Jahwe freuen“ natürlicher als „sich in Jahwe freuen“, ohne den Bezug abzuschwächen.
- source_word: תָּשִׂישׂ
  choice: wird jubeln
  rationale: שׂישׂ bezeichnet ausgelassene, intensive Freude. „Jubeln“ erhält die poetische Steigerung gegenüber „sich freuen“.
- source_word: בִּישׁוּעָתוֹ
  choice: über seine Rettung
  rationale: יְשׁוּעָה meint in diesem Kontext vor allem konkrete Rettung aus der Bedrohung. „Rettung“ bewahrt zugleich die weitere heilsgeschichtliche Bedeutungsbreite; das Suffix וֹ wird mit „seine“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: Im Zusammenhang des Psalms steht die Befreiung von Feinden im Vordergrund. „Rettung“ bildet diesen konkreten Sinn ab, ohne die mögliche umfassendere Bedeutung auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die Verben „sich freuen“ und „jubeln“ bewahren die Intensivierung der beiden hebräischen Halbverse; „Seele“ erhält das traditionelle poetische Bild.
