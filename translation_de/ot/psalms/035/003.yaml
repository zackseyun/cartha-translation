id: PSA.35.3
reference: Psalms 35:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: de
  text: 'Zieh den Speer und versperre meinen Verfolgern den Weg[a]; sprich zu meiner Seele[b]: »Ich bin deine Rettung.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zieh Speer und Streitaxt gegen meine Verfolger«, falls וּסְגֹר nicht als Verb »versperre«, sondern als Bezeichnung einer Waffe verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch »zu mir« oder »zu meinem Leben« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: Zieh
  rationale: Der Hifil-Imperativ von ריק bezeichnet hier wahrscheinlich das Herausziehen einer Waffe. »Zieh den Speer« ist im Deutschen natürlich und bewahrt das militärische Bild.
- source_word: חֲנִית
  choice: den Speer
  rationale: חֲנִית ist die gewöhnliche Bezeichnung für einen Speer. Der bestimmte Artikel entspricht hier natürlichem deutschem Sprachgebrauch, obwohl im Hebräischen kein Artikel steht.
- source_word: וּסְגֹר
  choice: versperre … den Weg
  rationale: Als Verb von סגר bedeutet die Form »schließe/versperre«. Das im Hebräischen unausgesprochene Objekt wird im Deutschen als »den Weg« ergänzt, um den Sinn verständlich wiederzugeben. Eine Deutung als Waffenname bleibt in der Fußnote erhalten.
- source_word: לִקְרַאת רֹדְפָי
  choice: meinen Verfolgern
  rationale: לִקְרַאת bezeichnet eine Bewegung zur Begegnung oder Konfrontation hin; zusammen mit »den Weg versperren« wird die feindliche Gegenbewegung im Deutschen idiomatisch ausgedrückt. רֹדְפָי bedeutet »meine Verfolger«.
- source_word: אֱמֹר
  choice: sprich
  rationale: Der einfache Imperativ von אמר wird direkt wiedergegeben. »Sprich« passt zum würdevollen poetischen Register des Psalms.
- source_word: לְנַפְשִׁי
  choice: zu meiner Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. »Zu meiner Seele« bewahrt die poetische Form und lässt die Bedeutungsbreite offen.
- source_word: יְשֻׁעָתֵךְ
  choice: deine Rettung
  rationale: יְשׁוּעָה bezeichnet Rettung oder Heil. Im unmittelbaren Zusammenhang einer Bedrohung ist »Rettung« natürlich und konkret, ohne die weiter reichende Bedeutung auszuschließen.
- source_word: אָֽנִי
  choice: Ich bin
  rationale: 'Das selbstständige Pronomen ist betont. Im Deutschen wird die nominale Aussage mit der Kopula formuliert: »Ich bin deine Rettung.«'
theological_decisions:
- issue: Wiedergabe von יְשׁוּעָה in einem Gebet um Befreiung
  choice: Rettung
  alternative: Heil
  rationale: Der unmittelbare Kontext spricht von konkreter Befreiung aus Verfolgung, weshalb »Rettung« hier besonders verständlich ist. »Heil« wäre ebenfalls möglich und könnte die umfassendere theologische Tragweite stärker anklingen lassen; die Übersetzung legt den Begriff jedoch nicht auf eine spätere dogmatische Bedeutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Direktheit. Die Satzstellung ist natürlich, bewahrt aber die kräftigen Imperative und die persönliche Gottesrede.
