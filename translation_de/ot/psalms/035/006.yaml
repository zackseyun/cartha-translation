  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: de
  text: Ihr Weg sei finster und schlüpfrig, während[a] der Engel Jahwes sie verfolgt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und der Engel Jahwes verfolgt sie“. Die hebräische Konjunktion kann auch als einfache Beiordnung verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: sei
  rationale: Der Jussiv von היה drückt hier einen Wunsch beziehungsweise Fluch aus. Der deutsche Konjunktiv „sei“ gibt diese volitive Kraft knapp und würdig wieder.
- source_word: דַרְכָּם
  choice: ihr Weg
  rationale: דֶּרֶךְ kann sowohl einen tatsächlichen Weg als auch den Lebensweg bezeichnen; „Weg“ bewahrt diese Bildweite.
- source_word: חֹשֶׁךְ
  choice: finster
  rationale: Das Substantiv „Finsternis“ steht prädikativ. Die adjektivische Wiedergabe „finster“ ist im Deutschen natürlich und erhält das Bild von Orientierungslosigkeit und Gefahr.
- source_word: וַחֲלַקְלַקּוֹת
  choice: und schlüpfrig
  rationale: Das pluralische Substantiv bezeichnet glatte beziehungsweise schlüpfrige Stellen. Die adjektivische Wiedergabe passt parallel zu „finster“ und vermittelt die Gefahr klar.
- source_word: וּמַלְאַךְ יְהוָה
  choice: während der Engel Jahwes
  rationale: Die Konjunktion ו kann einfache Beiordnung oder einen begleitenden Umstand ausdrücken. „Während“ gibt den wahrscheinlichen Begleitsinn in natürlichem Deutsch wieder; die Alternative wird in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רֹדְפָם
  choice: sie verfolgt
  rationale: Das Partizip von רדף bezeichnet ein andauerndes Verfolgen. Die finite deutsche Form ist idiomatisch und bewahrt den aktiven, feindlichen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Beziehung zwischen dem gefährlichen Weg und dem verfolgenden Engel
  choice: 'begleitender Umstand: „während“'
  alternative: 'einfache Beiordnung: „und“'
  rationale: Das hebräische ו lässt beide Beziehungen zu. Im Haupttext macht „während“ den naheliegenden Begleitsinn verständlich; die Fußnote bewahrt die echte syntaktische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Fluchformel und die Doppelmetapher des finsteren, schlüpfrigen Weges bleiben erhalten; unnötige konfessionelle Deutungen werden vermieden.
