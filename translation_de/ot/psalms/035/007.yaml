  text: כִּֽי חִנָּ֣ם טָֽמְנוּ לִ֭/י שַׁ֣חַת רִשְׁתָּ֑/ם חִ֝נָּ֗ם חָפְר֥וּ לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/007.yaml
  text: For without cause they hid their net's pit for me[d][c][b][a]; without cause they dug it for my life.
translation:
  language: de
  text: Denn grundlos verbargen sie für mich eine Grube ihres Netzes[a]; grundlos gruben sie sie, um mir ans Leben zu gehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „eine Grube ihres Netzes“. Die genaue Beziehung zwischen „Grube“ und „Netz“ ist im Hebräischen nicht eindeutig; möglich ist auch „eine Grube für ihr Netz“.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „für mein Leben“ oder „für meine Person“. Das hebräische Wort nefesch bezeichnet hier den Beter selbst beziehungsweise sein Leben, nicht notwendig die „Seele“ in einem späteren engeren theologischen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt im Zusammenhang die Begründung für die vorausgehende Bitte ein; „Denn“ wahrt diesen kausalen Anschluss.
- source_word: חִנָּם
  choice: grundlos
  rationale: Das Adverb bezeichnet ein Handeln ohne rechtfertigenden Anlass. Die Wiederholung in beiden Vershälften wird entsprechend beibehalten.
- source_word: טָמְנוּ
  choice: verbargen
  rationale: Das Verb bedeutet „verbergen, verstecken“ und beschreibt hier das heimliche Herrichten einer Falle.
- source_word: לִי
  choice: für mich
  rationale: Die Präposition kennzeichnet den Beter als Ziel der Falle. „Für mich“ bleibt nahe an der knappen hebräischen Formulierung.
- source_word: שַׁחַת רִשְׁתָּם
  choice: eine Grube mit ihrem Netz
  rationale: שַׁחַת bezeichnet hier eine Fanggrube, רִשְׁתָּם ihr Netz. Die genaue syntaktische Beziehung ist schwierig; die gewählte Fassung bewahrt beide Bestandteile und ergibt ein verständliches Bild, ohne die Unsicherheit in der Anmerkung zu verschweigen.
- source_word: חָפְרוּ
  choice: gruben sie sie
  rationale: Das Verb bezeichnet konkret das Graben. Das Pronomen nimmt im Deutschen die zuvor genannte Grube auf, die im zweiten hebräischen Teilsatz ausgelassen ist.
- source_word: לְנַפְשִׁי
  choice: um mir ans Leben zu gehen
  rationale: נֶפֶשׁ meint hier das Leben beziehungsweise die Person des Beters, nicht eine vom Körper getrennte „Seele“. Die idiomatische Wendung gibt die lebensbedrohliche Absicht wieder.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben beziehungsweise Person des Beters
  alternative: Seele im engeren theologischen Sinn
  rationale: Im Kontext einer tödlichen Falle bezeichnet נֶפֶשׁ den lebenden Menschen oder sein Leben; eine anthropologische Trennung von Leib und Seele wäre hier nicht vom Text gefordert.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Grundlos“ hält die nachdrückliche Wiederholung des Hebräischen fest; „mir ans Leben zu gehen“ ist gegenwärtiges Standarddeutsch und macht die Bedrohung verständlich, ohne eine besondere Lehrtradition einzutragen.
