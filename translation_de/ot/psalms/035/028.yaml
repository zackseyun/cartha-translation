  variant: modern standard German
source:
  edition: WLC
  text: וּ֭/לְשׁוֹנִ/י תֶּהְגֶּ֣ה צִדְקֶ֑/ךָ כָּל הַ֝/יּוֹם תְּהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/028.yaml
  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: de
  text: Und meine Zunge wird von deiner Gerechtigkeit reden[a][b] und den ganzen Tag von deinem Lob.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von deinem gerechten Handeln“ bzw. „von deinem Recht“. Das hebräische Wort kann Gerechtigkeit und Recht umfassen, besonders wenn Gott dem Beter Recht verschafft.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch „leise vor sich hin sprechen“, „murmeln“ oder „nachsinnen“ bedeuten. Weil die Zunge Subjekt ist, ist hier wahrscheinlich hörbares Reden gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht im zweiten Versglied knapp: „den ganzen Tag dein Lob“. Das Verb aus dem ersten Versglied ist sinngemäß mitzudenken.'
    reason: syntax_clarification
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: Und meine Zunge
  rationale: Bewahrt die hebräische Metonymie für das Reden und verbindet den Vers durch וּ mit dem vorausgehenden Zusammenhang.
- source_word: תֶּהְגֶּה
  choice: wird … reden
  rationale: הגה kann leises Sprechen, Äußern oder Nachsinnen bezeichnen. Da die Zunge Subjekt ist, steht hier die hörbare Äußerung im Vordergrund; „reden“ bleibt zugleich weniger spezifisch als „verkünden“.
- source_word: צִדְקֶךָ
  choice: von deiner Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die Breite des hebräischen Begriffs, der in diesem Zusammenhang auch Gottes gerechtes Handeln und Rechtsschaffen umfasst.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Natürliche moderne deutsche Wiedergabe der Zeitangabe mit durativem Sinn.
- source_word: תְּהִלָּתֶךָ
  choice: von deinem Lob
  rationale: Gibt die Suffixform knapp wieder und kann sowohl das Gott gebührende als auch das ihm dargebrachte Lob bezeichnen.
theological_decisions:
- issue: Bedeutungsumfang von צִדְקֶךָ im Kontext göttlicher Rechtfertigung
  choice: deiner Gerechtigkeit
  alternative: deinem gerechten Handeln / deinem Recht
  rationale: „Gerechtigkeit“ lässt sowohl Gottes sittliche Richtigkeit als auch sein gerechtes Eintreten für den Beter anklingen und verengt den Ausdruck nicht auf einen einzelnen Aspekt.
- issue: Sinn von תהגה bei „Zunge“ als Subjekt
  choice: wird … reden
  alternative: wird … nachsinnen / murmeln
  rationale: Das Subjekt „meine Zunge“ legt sprachliche Äußerung nahe, doch der mögliche Beiklang eines wiederholten oder leisen Sprechens wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Metonymie „meine Zunge“ bleibt erhalten. Die Wiederholung von „von“ sorgt für klare, natürliche Syntax, während die hebräische Zweigliedrigkeit erkennbar bleibt.
