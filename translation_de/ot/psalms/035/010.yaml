source:
  edition: WLC
  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: de
  text: 'Alle meine Gebeine werden sagen: »HERR, wer ist wie du? Du rettest den Armen vor dem, der stärker ist als er, den Armen und Bedürftigen vor dem, der ihn beraubt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: Alle meine Gebeine
  rationale: Bewahrt das eindrückliche hebräische Körperbild für das ganze, tiefste Sein des Beters; »Gebeine« ist würdevoll und im Psalmregister verständlich.
- source_word: יְהוָה
  choice: HERR
  rationale: Entspricht der verbreiteten deutschen Wiedergabekonvention für den Gottesnamen und dem konsultierten POB-Text.
- source_word: עָנִי
  choice: der Arme / den Armen
  rationale: Gibt hier die soziale Schutzlosigkeit des עָנִי natürlich wieder, ohne die Bedeutung unnötig auf inneres Leid zu verengen.
- source_word: אֶבְיוֹן
  choice: Bedürftigen
  rationale: Bezeichnet den materiell oder sozial Bedürftigen und ergänzt »Armen« passend.
- source_word: גֹּזְלוֹ
  choice: der ihn beraubt
  rationale: Gibt das aktive gewaltsame oder unrechtmäßige Entziehen durch den Partizipialausdruck direkt wieder.
theological_decisions:
- issue: Unvergleichlichkeit Gottes
  choice: »HERR, wer ist wie du?«
  alternative: »HERR, niemand ist wie du«
  rationale: Die rhetorische Frage des Hebräischen bleibt erhalten und wird nicht in eine ausdrückliche Aussage umgeformt.
- issue: Zeitwert der Rettungspartizipien
  choice: »Du rettest ...«
  alternative: »der du ... rettest«
  rationale: Die direkte Anrede führt den hebräischen Partizipialsatz natürlich fort und stellt Gottes kennzeichnendes Rettungshandeln heraus.
translation_notes:
  register: Modernes, würdiges Psalmdeutsch. Die ungewöhnliche, aber starke Wendung »Alle meine Gebeine« wurde bewusst bewahrt; die Syntax der zweiten Vershälfte wurde für klares natürliches Deutsch als direkte Anrede gestaltet.
