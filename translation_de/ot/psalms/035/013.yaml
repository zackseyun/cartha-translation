source:
  edition: WLC
  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: de
  text: Ich aber trug, als sie krank waren, Sacktuch[a]; ich demütigte mich durch Fasten[b], und mein Gebet kehrte in meinen Schoß zurück[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sacktuch war ein grobes Trauergewand und brachte Trauer, Not oder Buße zum Ausdruck.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »ich demütigte meine Seele durch Fasten«; dies ist eine hebräische Ausdrucksweise für Selbsterniedrigung oder Selbstverzicht durch Fasten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder sinngemäß: »mein Gebet kam unerhört zurück« oder »mein Gebet kam mir selbst zugute«. Die hebräische Wendung ist mehrdeutig und kann besagen, dass seine Fürbitte ihre Feindseligkeit nicht änderte oder dass ihr Segen zu ihm zurückkehrte.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: als sie krank waren
  rationale: Die Präposition ב mit dem Infinitiv und dem Suffix der 3. Person Plural bezeichnet den Zeitpunkt ihres Krankseins; die Wiedergabe ist natürlich und bewahrt den zeitlichen Sinn.
- source_word: לְבוּשִׁי שָׂק
  choice: war Sacktuch mein Gewand
  rationale: Die verblosen Nominalsatzstruktur »mein Gewand [war] Sacktuch« bleibt erhalten und hebt den Trauerzustand hervor.
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: ich demütigte mich durch Fasten
  rationale: Wörtlich steht »ich beugte/bedrückte meine Seele mit Fasten«. Die deutsche Form gibt den hebräischen Ausdruck für Selbsterniedrigung durch Fasten verständlich wieder.
- source_word: וּתְפִלָּתִי עַל חֵיקִי תָשׁוּב
  choice: und mein Gebet kehrte an meine Brust zurück
  rationale: Die konkrete, aber mehrdeutige hebräische Wendung wird bewahrt. חֵיק bezeichnet Brust, Schoß oder Gewandbausch; תָשׁוּב bedeutet »kehrt zurück« und kann hier im Erzählzusammenhang vergangen wiedergegeben werden.
theological_decisions:
- issue: Bedeutung von »mein Gebet kehrte an meine Brust zurück«
  choice: Das Bild des hebräischen Textes bleibt im Haupttext unaufgelöst.
  alternative: »mein Gebet kam unerhört zurück«; »mein Gebet kam mir selbst zugute«; »ich betete so, als ginge es um mich selbst«
  rationale: Die Wendung ist idiomatisch und tatsächlich mehrdeutig. Eine eindeutige Deutung im Haupttext würde eine nicht ausdrücklich festgelegte Aussage eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Gegenüberstellung »Ich aber« und das konkrete Bild der an die Brust zurückkehrenden Fürbitte bleiben erhalten; kulturelle und idiomatische Einzelheiten werden in Fußnoten erläutert.
