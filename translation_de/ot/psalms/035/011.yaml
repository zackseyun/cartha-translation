  text: יְ֭קוּמוּ/ן עֵדֵ֣י חָמָ֑ס אֲשֶׁ֥ר לֹא יָ֝דַ֗עְתִּי יִשְׁאָלֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/011.yaml
  text: Violent witnesses rise up[a]; they ask me about things I do not know.
translation:
  language: de
  text: Gewalttätige Zeugen treten auf[a]; sie fragen mich nach Dingen, von denen ich nichts weiß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „falsche Zeugen“ oder „böswillige Zeugen“; wörtlich: „Zeugen der Gewalt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: treten auf
  rationale: Das Verb קום bezeichnet hier das Hervortreten beziehungsweise Auftreten feindlicher Zeugen. „Treten auf“ klingt im Deutschen natürlich und bewahrt den anschaulichen, forensischen Zusammenhang.
- source_word: עֵדֵי חָמָס
  choice: gewalttätige Zeugen
  rationale: Wörtlich steht „Zeugen der Gewalt“. חָמָס kann Gewalt, Unrecht oder ruchloses Handeln bezeichnen. „Gewalttätige Zeugen“ wahrt die knappe Mehrdeutigkeit besser als das engere „falsche Zeugen“.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: Dinge, von denen ich nichts weiß
  rationale: Der hebräische Relativsatz nennt kein ausdrückliches Bezugswort. „Dinge“ wird für ein natürliches deutsches Verständnis sparsam ergänzt; „von denen ich nichts weiß“ gibt die behauptete Unkenntnis wieder.
- source_word: יִשְׁאָלוּנִי
  choice: sie fragen mich nach
  rationale: שׁאל bedeutet fragen, sich erkundigen oder fordern. Im feindlichen Zusammenhang ist „fragen mich nach“ sachlich und zurückhaltend; „verhören“ wäre stärker als der hebräische Wortlaut.
