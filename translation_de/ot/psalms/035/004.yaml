  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: de
  text: Die mir nach dem Leben trachten[a], sollen beschämt und gedemütigt werden; die Böses gegen mich planen[b], sollen zurückweichen und zuschanden werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die meine Seele suchen“; die hebräische Wendung bedeutet hier, dass sie dem Beter nach dem Leben trachten.'
    reason: lexikalische Alternative und Erklärung eines hebräischen Idioms
  - marker: b
    text: 'Oder: „die mein Unheil planen“ bzw. „die mir Schaden zufügen wollen“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: beschämt sollen werden
  rationale: Das Qal von בוש bezeichnet hier das Erleiden von Scham; die Wunschform gibt den im Gebetszusammenhang naheliegenden jussivischen Sinn wieder.
- source_word: וְיִכָּלְמוּ
  choice: und gedemütigt
  rationale: Das Niphal von כלם verstärkt die Schamterminologie und hat passiv-resultativen Sinn; „gedemütigt“ wahrt die Nuance gegenüber „beschämt“.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: die mir nach dem Leben trachten
  rationale: נפש bezeichnet in dieser feindseligen Verbindung idiomatisch das bedrohte Leben. Die deutsche Wendung ist natürlich und bewahrt die feindliche Absicht.
- source_word: יִסֹּגוּ אָחוֹר
  choice: zurückweichen sollen
  rationale: סוג mit אָחוֹר bezeichnet Rückzug oder Zurückweichen; die knappe deutsche Wiedergabe vermeidet die Redundanz von „rückwärts zurückweichen“.
- source_word: וְיַחְפְּרוּ
  choice: und zuschanden werden
  rationale: חפר bezeichnet hier Schande, nicht wörtliches Graben. „Zuschanden werden“ erhält das Schamwortfeld und unterscheidet sich sprachlich von den ersten beiden Verben.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: die Böses gegen mich planen
  rationale: חשב bedeutet planen oder ersinnen; רָעָתִי kann sowohl auf mir zugedachtes Unheil als auch auf Böses gegen mich bezogen werden. Die Wiedergabe hält die moralische und schädigende Dimension offen.
theological_decisions:
- issue: Jussivisch-imprekatorische Kraft der Imperfektformen
  choice: Wiedergabe als Wunsch bzw. Bitte mit „sollen“
  alternative: 'Indikativische Zukunft: „Sie werden beschämt werden …“'
  rationale: Im Gebetskontext sind die Formen am natürlichsten als Bitte um göttliches Gericht zu verstehen. „Sollen“ bewahrt die imprekatorische Kraft, ohne die Aussage zu einer bloßen Vorhersage zu machen.
- issue: Bedeutungsumfang von רָעָתִי
  choice: „Böses gegen mich“
  alternative: „mein Unheil“ bzw. „mir Schaden“
  rationale: Die Form kann das gegen den Beter geplante Böse beziehungsweise Unheil bezeichnen. Die Hauptfassung bewahrt die moralische Färbung; die Fußnote nennt die stärker schadensorientierte Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das dreifache Schamwortfeld des Hebräischen bleiben erkennbar; idiomatische Wendungen werden verständlich wiedergegeben.
