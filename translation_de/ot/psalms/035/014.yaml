id: PSA.35.14
reference: Psalms 35:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ/רֵֽעַ כְּ/אָ֣ח לִ֭/י הִתְהַלָּ֑כְתִּי כַּ/אֲבֶל אֵ֝֗ם קֹדֵ֥ר שַׁחֽוֹתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: de
  text: Als wäre er mein Freund, als wäre er mein Bruder, ging ich umher[a]; düster beugte ich mich nieder[b] wie einer, der um seine Mutter trauert[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wie ein Freund, wie ein Bruder für mich ging ich umher.“ Der knappe hebräische Ausdruck betont persönliche Nähe; aus dem Zusammenhang ist die behandelte Person mitzudenken.'
    reason: lexical_alternative
  - marker: b
    text: „Düster“ gibt ein hebräisches Wort wieder, das wörtlich „verdunkelt“ bedeuten kann und hier die niedergeschlagene Erscheinung eines Trauernden beschreibt.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht nur „Mutter“. Gemeint ist im Vergleich die Mutter des Trauernden.
    reason: clarification
lexical_decisions:
- source_word: כְּ/רֵעַ כְּ/אָח לִ/י
  choice: Als wäre er mein Freund, als wäre er mein Bruder
  rationale: Die beiden mit כְּ eingeleiteten Vergleiche bezeichnen enge persönliche Nähe. Das im Deutschen ergänzte „er“ ergibt sich aus dem Zusammenhang; לִי wird idiomatisch als Besitz- beziehungsweise Beziehungsangabe wiedergegeben.
- source_word: הִתְהַלָּכְתִּי
  choice: ging ich umher
  rationale: Der Hitpael von הלך beschreibt hier das Umhergehen beziehungsweise das entsprechende Verhalten und bewahrt zugleich das konkrete Bewegungsbild.
- source_word: כַּ/אֲבֶל אֵם
  choice: wie einer, der um seine Mutter trauert
  rationale: Die Wortverbindung bezeichnet einen um eine Mutter Trauernden. Im Deutschen wird die im Vergleich vorausgesetzte persönliche Beziehung idiomatisch mit „seine“ ausgedrückt.
- source_word: קֹדֵר
  choice: düster
  rationale: קדר bezeichnet wörtlich einen verdunkelten, finsteren Zustand und im Trauerzusammenhang eine niedergeschlagene Erscheinung. „Düster“ erhält dieses Bild, ohne es lediglich als „traurig“ aufzulösen.
- source_word: שַׁחֽוֹתִי
  choice: beugte ich mich nieder
  rationale: Das Verb bezeichnet eine gebeugte, niedergesunkene Körperhaltung und vermittelt die leibliche Gebärde tiefer Trauer.
