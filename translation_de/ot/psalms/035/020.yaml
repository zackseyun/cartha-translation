id: PSA.35.20
reference: Psalms 35:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י לֹ֥א שָׁל֗וֹם יְדַ֫בֵּ֥רוּ וְ/עַ֥ל רִגְעֵי אֶ֑רֶץ דִּבְרֵ֥י מִ֝רְמוֹת יַחֲשֹׁבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: de
  text: Denn sie reden nicht vom Frieden, sondern ersinnen trügerische Worte gegen die, die ruhig im Land leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Friedlichen im Land“ oder „gegen die, die im Land Ruhe haben“. Die hebräische Wendung meint wahrscheinlich Menschen, die ruhig und friedlich leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Klage oder Bitte und fügt sich natürlich in den Gedankengang des Psalms ein.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: sie reden nicht vom Frieden
  rationale: Die Wiedergabe bewahrt שָׁלוֹם als Gegenstand des Redens und vermeidet die verengende adverbiale Form „nicht friedlich“.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ gibt den Kerngehalt wieder und lässt die weiteren Bedeutungsanteile von Wohlergehen und Unversehrtheit mitschwingen.
- source_word: וְעַל
  choice: sondern … gegen
  rationale: Das deutsche „sondern“ macht den sachlichen Gegensatz zwischen fehlender Friedensrede und feindseligem Planen deutlich; „gegen“ gibt die Präposition עַל im Kontext wieder.
- source_word: רִגְעֵי אֶרֶץ
  choice: die, die ruhig im Land leben
  rationale: Die Wendung bezeichnet wahrscheinlich Menschen, die still und friedlich im Land leben. Diese natürliche Formulierung bewahrt den Personenbezug, ohne die schwierige hebräische Wendung zu stark festzulegen.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: trügerische Worte
  rationale: Die idiomatische deutsche Wortgruppe gibt den hebräischen Konstruktus „Worte des Trugs“ klar und natürlich wieder.
- source_word: יַחֲשֹׁבוּן
  choice: ersinnen
  rationale: Das Verb bezeichnet hier absichtsvolles Ausdenken oder Planen; „ersinnen“ erfasst den feindseligen, planvollen Charakter.
theological_decisions: []
