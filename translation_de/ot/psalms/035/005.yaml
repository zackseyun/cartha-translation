  text: יִֽהְי֗וּ כְּ/מֹ֥ץ לִ/פְנֵי ר֑וּחַ וּ/מַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: de
  text: Mögen sie wie Spreu vor dem Wind[a] sein, während der Engel Jahwes sie forttreibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… vor dem Wind sein, und der Engel Jahwes treibt sie fort.“ Das hebräische Bindewort kann schlicht „und“ bedeuten oder einen begleitenden Umstand ausdrücken; das Partizip kann auch mit „wegstößt“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Sie sollen … sein
  rationale: Die Verbform hat im Zusammenhang einen jussivisch-verwünschenden Sinn. „Sie sollen … sein“ gibt die Bitte beziehungsweise Verwünschung idiomatisch wieder, ohne sie als bloße Zukunftsaussage darzustellen.
- source_word: כְּמֹץ
  choice: wie Spreu
  rationale: מֹץ bezeichnet die leichte Spreu, die beim Worfeln vom Wind verweht wird. Die deutsche Wendung bewahrt das hebräische Vergleichsbild.
- source_word: לִפְנֵי רוּחַ
  choice: vor dem Wind
  rationale: Dies entspricht der räumlichen Bildsprache des Hebräischen und vermittelt, dass die Spreu dem Wind preisgegeben ist.
- source_word: וּמַלְאַךְ יְהוָה
  choice: und der Engel Jahwes
  rationale: Das ו wird formal als „und“ wiedergegeben; מַלְאָךְ bezeichnet in dieser festen Verbindung am ehesten einen übernatürlichen Boten, daher „Engel“. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: דּוֹחֶה
  choice: soll sie forttreiben
  rationale: Das Partizip von דחה bezeichnet ein gewaltsames Stoßen oder Vertreiben. „Forttreiben“ passt zum Bild der Spreu und bewahrt den gerichtlichen Nachdruck; das im Hebräischen unausgesprochene Objekt wird im Deutschen aus dem Zusammenhang ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: „Engel“ ist in dieser wiederkehrenden biblischen Verbindung und im vorliegenden göttlichen Gerichtshandeln die naheliegende Bedeutung. Darüber hinaus wird keine Aussage über die genaue Identität dieser Gestalt getroffen.
- issue: Verhältnis der beiden Vershälften
  choice: und der Engel Jahwes soll sie forttreiben
  alternative: während der Engel Jahwes sie forttreibt
  rationale: Die koordinierende Mehrdeutigkeit des hebräischen ו wird durch „und“ bewahrt. So wird nicht eindeutiger als im Ausgangstext festgelegt, ob die zweite Hälfte Begleitumstand, zusätzliche Bitte oder Fortführung des Bildes ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Parallelstruktur und Bildsprache. Die wiederholte Soll-Konstruktion macht den jussivisch-imprekatorischen Charakter deutlich; die Fußnote hält die syntaktische und lexikalische Offenheit des Hebräischen fest.
