  text: בְּ֭/חַנְפֵי לַעֲגֵ֣י מָע֑וֹג חָרֹ֖ק עָלַ֣/י שִׁנֵּֽי/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/016.yaml
  text: Among the godless mockers at a feast[a], they gnash their teeth at me.
translation:
  language: de
  text: Unter den gottlosen Spöttern beim Fest[a] knirschen sie mit den Zähnen gegen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unter ruchlosen Spöttern für einen Kuchen/Bissen“; das hier mit „beim Fest“ wiedergegebene hebräische Wort ist selten und seine Bedeutung unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: Unter den gottlosen
  rationale: Das von חנף abgeleitete Wort bezeichnet hier moralisch-religiös verdorbene oder ruchlose Menschen. „Gottlos“ gibt dies im Zusammenhang feindseliger Spötter treffend wieder; בְּ wird örtlich beziehungsweise assoziativ als „unter“ verstanden.
- source_word: לַעֲגֵי
  choice: Spöttern
  rationale: Das Wort bezeichnet Menschen, die höhnen oder spotten. „Spötter“ ist im Deutschen natürlich und bewahrt den feindseligen Ton.
- source_word: מָעוֹג
  choice: beim Fest
  rationale: Das seltene Wort ist in seiner Bedeutung unsicher. Es kann mit einem Festmahl verbunden werden, wird aber auch als „Kuchen“ oder „Bissen“ gedeutet. „Beim Fest“ gibt eine plausible gesellschaftliche Situation wieder; die Unsicherheit bleibt in der Fußnote sichtbar.
- source_word: חָרֹק
  choice: knirschen sie
  rationale: חרק bezeichnet das Knirschen oder Mahlen mit den Zähnen als Ausdruck von Feindseligkeit. Die finite Form ergibt einen natürlichen deutschen Satz.
- source_word: עָלַי
  choice: gegen mich
  rationale: Bei einer feindseligen Handlung gibt „gegen mich“ die Zielrichtung von עַל klar und idiomatisch wieder.
- source_word: שִׁנֵּימוֹ
  choice: mit den Zähnen
  rationale: Die Zähne gehören zum pluralischen Subjekt. Im Deutschen drückt der bestimmte Artikel bei Körperteilen die Zugehörigkeit natürlich aus, ohne ein ausdrückliches „ihren“ zu benötigen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Psalmsprache. „Gottlos“ bewahrt die moralisch-religiöse Aussage, ohne das Wort auf bloße Heuchelei zu verengen. Die schwierige Wortfolge und die Unsicherheit von מָעוֹג werden durch eine knappe Haupttextlösung und eine Fußnote transparent gemacht.
