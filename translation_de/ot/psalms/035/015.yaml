id: PSA.35.15
reference: Psalms 35:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: de
  text: Doch als ich ins Wanken geriet, freuten sie sich und rotteten sich zusammen[a]; gegen mich rotteten sie sich zusammen – Schläger, von denen ich nichts wusste[b]. Sie zerrissen mich und hörten nicht auf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ich hinkte“ oder „als ich strauchelte“. Das Hebräische kann körperliches Hinken oder allgemeiner einen Augenblick der Schwäche oder des Niedergangs bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das mit „Schläger“ wiedergegebene hebräische Wort ist selten und in seiner Bedeutung unsicher. Möglich sind auch „die mich schlugen“ oder „Gebrechliche“. Der folgende Satzteil kann außerdem bedeuten: „ohne dass ich davon wusste“.'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Oder: „Sie zerrissen mich und schwiegen nicht“, falls ein unablässiger verbaler Angriff gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: als ich ins Wanken geriet
  rationale: צלע kann hier körperliches Hinken oder allgemeiner einen Zustand des Strauchelns, der Schwäche oder des Niedergangs bezeichnen. Die Formulierung bewahrt die bildhafte Offenheit, ohne eine rein körperliche Verletzung festzulegen.
- source_word: שָׂמְחוּ
  choice: freuten sie sich
  rationale: Natürliches modernes Deutsch für das feindselige Frohsein der Gegner.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: rotteten sich zusammen; rotteten sie sich zusammen
  rationale: Die Wiederholung von אסף wird erhalten. „Sich zusammenrotten“ bringt im Kontext sowohl das Versammeln als auch die feindselige Absicht zum Ausdruck.
- source_word: עָלַי
  choice: gegen mich
  rationale: Die Präposition bezeichnet hier im feindlichen Zusammenhang die Ausrichtung gegen den Beter.
- source_word: נֵכִים
  choice: Schläger
  rationale: Das seltene und unsichere Wort wird wahrscheinlich von einer Wurzel mit der Bedeutung „schlagen“ her verstanden. „Schläger“ ist im Deutschen verständlich, während andere Deutungen in der Fußnote bewahrt werden.
- source_word: וְלֹא יָדַעְתִּי
  choice: von denen ich nichts wusste
  rationale: Die Wendung wird auf die unmittelbar vorausgehenden Personen bezogen, lässt aber offen, ob der Beter sie nicht kannte oder nichts von ihrem Vorgehen wusste.
- source_word: קָרְעוּ
  choice: sie zerrissen mich
  rationale: קרע bedeutet wörtlich „zerreißen“. Die direkte, starke Metapher bleibt erhalten, ohne festzulegen, ob körperliche Gewalt oder verletzende Rede gemeint ist.
- source_word: וְלֹא דָמּוּ
  choice: und hörten nicht auf
  rationale: דמם kann „still sein“ oder „aufhören“ bedeuten. „Hörten nicht auf“ passt zum unablässigen Angriff; die Alternative wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Formulierung „rotteten sich zusammen“ bewahrt die auffällige Wiederholung des hebräischen Verbs. Die seltene Bezeichnung נֵכִים und die Mehrdeutigkeit von דמם werden nicht stillschweigend vereindeutigt, sondern in Fußnoten ausgewiesen.
