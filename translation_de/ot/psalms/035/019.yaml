  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: de
  text: Lass nicht zu, dass meine Feinde sich zu Unrecht über mich freuen[a] und dass die, die mich grundlos hassen, mit den Augen zwinkern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass meine betrügerischen Feinde sich über mich freuen«; auch möglich: »dass meine Feinde sich auf betrügerische Weise über mich freuen«. Die knappe hebräische Formulierung kann entweder die Feinde als von Falschheit geprägt kennzeichnen oder ihr Verhalten beziehungsweise ihre Schadenfreude als falsch und unberechtigt beschreiben.'
    reason: lexical_alternative
  - marker: b
    text: Das Zwinkern mit den Augen ist hier eine hämische oder verschwörerische Geste, die Spott oder heimliche Feindseligkeit ausdrückt.
    reason: cultural_note
lexical_decisions:
- source_word: אַל יִשְׂמְחוּ לִי
  choice: sollen sich nicht über mich freuen
  rationale: אַל mit dem Imperfekt drückt hier im Gebet einen verneinten Wunsch aus. לִי bezeichnet im feindseligen Zusammenhang das triumphierende Sichfreuen über den Beter.
- source_word: אֹיְבַי שֶׁקֶר
  choice: meine Feinde, die lügen
  rationale: Die knappe hebräische Verbindung lässt offen, ob שֶׁקֶר die Feinde als lügnerisch kennzeichnet oder ihr Verhalten gegenüber dem Beter als falsch bezeichnet. Die Formulierung bewahrt den Bezug zur Lüge, ohne die Feindschaft als bloß vorgetäuscht erscheinen zu lassen.
- source_word: שֹׂנְאַי חִנָּם
  choice: die mich grundlos hassen
  rationale: Das Partizip bezeichnet Menschen, die den Beter hassen; חִנָּם beschreibt diesen Hass als unbegründet.
- source_word: יִקְרְצוּ עָיִן
  choice: einander mit den Augen zuzwinkern
  rationale: Die konkrete Körpergeste wird bewahrt. Im Zusammenhang bezeichnet sie ein hämisches oder verschwörerisches Zeichen; „einander“ macht die kommunikative Funktion der deutschen Wendung natürlich verständlich.
