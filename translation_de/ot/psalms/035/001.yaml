source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: de
  text: 'Von David.


    Streite, Jahwe, gegen die, die gegen mich streiten;

    kämpfe gegen die, die gegen mich kämpfen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Überschrift mit לְ und einem Personennamen wird traditionell und plausibel mit „Von David“ wiedergegeben. Das lässt Autorschaft oder Zuordnung offen, ohne so eng wie „verfasst von“ zu formulieren.
- source_word: רִיבָה
  choice: Streite
  rationale: Der Imperativ von ריב kann sowohl einen Rechtsstreit als auch allgemein eine Auseinandersetzung bezeichnen. „Streite“ bewahrt diese Spannweite und erhält die bewusste Wortwiederholung mit יְרִיבַי.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת יְרִיבַי
  choice: gegen die, die gegen mich streiten
  rationale: Die Relativkonstruktion ist im modernen Deutsch natürlich und spiegelt die Wortwurzel von רִיבָה wider.
- source_word: לְחַם
  choice: kämpfe gegen
  rationale: Der Imperativ von לחם bezeichnet kämpferisches oder kriegerisches Vorgehen. „Kämpfe gegen“ ist direkt, verständlich und idiomatisch.
- source_word: אֶת לֹחֲמָי
  choice: gegen die, die gegen mich kämpfen
  rationale: Die Wiedergabe als Relativsatz bezeichnet die Angreifer klar und bewahrt die rhetorische Wiederholung derselben Wortwurzel wie beim Imperativ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur und die Wiederholung der hebräischen Verben werden bewusst nachgebildet. Die rechtliche Nebenbedeutung von ריב bleibt durch „streiten“ grundsätzlich offen, ohne den im Hebräischen nicht ausdrücklich genannten Ausdruck „meine Sache“ einzufügen.
