  register: Poetisch, knapp und in modernem Standarddeutsch. Der zweite Halbvers wird als Nominalsatz verstanden und mit „meine Seele ist verwaist“ idiomatisch wiedergegeben; das ungewöhnliche hebräische Bild bleibt dabei erhalten.
