base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/012.yaml
  text: They repay me evil for good[b][a], bereavement to my soul.
translation:
  language: de
  text: Sie vergelten mir Gutes mit Bösem; meine Seele erleidet Verlust.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Beraubung/Verlust für meine Seele“. Das hebräische Wort für „Seele“ kann auch „Leben“ oder die eigene Person meinen. Das Wort für „Verlust“ bezeichnet oft schmerzliche Beraubung, mitunter besonders durch den Verlust von Kindern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: Sie vergelten mir
  rationale: Das Piel von שׁלם bezeichnet hier das feindselige Zurückzahlen beziehungsweise Vergelten. „Sie vergelten mir“ ist im Deutschen idiomatisch und bewahrt den Gedanken der Erwiderung.
- source_word: רָעָה תַּחַת טוֹבָה
  choice: Gutes mit Bösem
  rationale: תַּחַת kennzeichnet hier Austausch oder Gegenleistung. Die deutsche Wendung „Gutes mit Bösem vergelten“ gibt die knappe Gegenüberstellung natürlich wieder, auch wenn sie die Reihenfolge der hebräischen Wörter umstellt.
- source_word: שְׁכוֹל
  choice: verwaist
  rationale: Das Substantiv bezeichnet Beraubung oder Verwaisung, häufig durch den Verlust von Kindern. Die prädikative Wiedergabe „ist verwaist“ bewahrt das eindringliche Bild, ohne einen konkreten Verlust hinzuzufügen.
- source_word: לְנַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann „Seele“, „Leben“ oder die eigene Person bezeichnen. „Meine Seele“ erhält hier die poetische Bildkraft und lässt die Bedeutungsbreite in einer Fußnote sichtbar werden.
theological_decisions: []
