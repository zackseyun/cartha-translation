  terminology: „Jahwe“ gibt יְהוָה angemessen als Eigenname wieder; „Herr“ entspricht dem anschließenden Gottesprädikat אֲדֹנָי und hält beide Bezeichnungen unterscheidbar. „Schweige nicht“ trifft חרשׁ im Kontext. Es sind keine Fußnotenanker im deutschen Text erforderlich.
