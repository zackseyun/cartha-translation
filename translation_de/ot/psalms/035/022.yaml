  source_fidelity: 'Der hebräische Text lautet wörtlich etwa: „Du hast gesehen, Jahwe; schweige nicht! Herr, sei nicht fern von mir!“ Das Perfekt רָאִיתָ stimmt mit „Du hast gesehen“ überein. Im Hebräischen fehlt jedoch ein ausdrückliches Objekt; das ergänzte „es“ legt den Bezug zwar kontextuell nahe, ist für eine optimal-äquivalente Wiedergabe aber nicht erforderlich. „Bleib mir nicht fern“ ist verständlich, kann jedoch ein Fortdauern ausdrücken, das רחק hier nicht eigens bezeichnet; „sei mir nicht fern“ bildet die Bitte unmittelbarer ab.'
