  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: de
  text: Du hast gesehen, Jahwe; schweige nicht! Herr, sei mir nicht fern!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Du hast es gesehen
  rationale: Das Qal-Perfekt 2. Person Singular richtet sich unmittelbar an Gott und verweist auf das bereits Wahrgenommene. Das im Deutschen nötige Korrelat „es“ nimmt die zuvor geschilderte Not bzw. das Unrecht auf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und damit vom folgenden Gottestitel אֲדֹנָי unterschieden.
- source_word: אַל תֶּחֱרַשׁ
  choice: schweige nicht
  rationale: חרשׁ bedeutet hier „schweigen“. Der verneinte Jussiv formuliert eine dringliche Bitte an Gott, nicht stumm und damit scheinbar untätig zu bleiben.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier der gebräuchliche Gottestitel „Herr“; die Anrede bleibt vom Eigennamen Jahwe unterscheidbar.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: bleib mir nicht fern
  rationale: רחק mit מן bezeichnet das Fernsein von jemandem. „Bleib mir nicht fern“ ist natürliches Deutsch und bewahrt das räumlich-relationale Bild sowie den im Kontext naheliegenden Gedanken fortdauernder Distanz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn und hält ihn vom Titel אֲדֹנָי („Herr“) auseinander.
- issue: Bedeutung des göttlichen Schweigens und Fernseins
  choice: Die Bildsprache bleibt unaufgelöst stehen
  alternative: Deutende Wiedergabe als Untätigkeit oder fehlende Hilfe
  rationale: Der Vers bittet Gott wörtlich, nicht zu schweigen und nicht fernzubleiben. Die Übersetzung erklärt diese Bilder nicht einseitig als Untätigkeit, sondern bewahrt ihre relationale und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Imperative geben die Dringlichkeit des hebräischen Gebets wieder; „Herr“ wird nicht in Versalien gesetzt, damit der Unterschied zwischen dem Gottesnamen Jahwe und dem Titel אֲדֹנָי sichtbar bleibt.
