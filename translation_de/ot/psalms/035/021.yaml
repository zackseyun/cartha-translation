lexical_decisions:
- source_word: וַיַּרְחִיבוּ עָלַי פִּיהֶם
  choice: Sie rissen gegen mich den Mund weit auf
  rationale: Das Hifil von רחב bedeutet wörtlich »weit machen«. In Verbindung mit »Mund« bezeichnet es hier das weite Aufreißen des Mundes in feindseligem Spott. Der hebräische kollektive Singular »ihr Mund« bleibt im Deutschen idiomatisch als gemeinsamer Ausdruck erhalten.
- source_word: עָלַי
  choice: gegen mich
  rationale: עַל kennzeichnet im Zusammenhang feindseliger Rede die gegen den Beter gerichtete Haltung.
- source_word: אָמְרוּ
  choice: und sagten
  rationale: Das finite Erzählverb leitet die direkte Rede schlicht und natürlich ein.
- source_word: הֶאָח הֶאָח
  choice: Ha, ha!
  rationale: Die wiederholte Interjektion drückt höhnischen Triumph aus. »Ha, ha!« gibt den Spott im heutigen Deutschen natürlicher wieder als »Aha, aha!«.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: Unsere Augen haben es gesehen
  rationale: Wörtlich steht »Unser Auge hat gesehen«; der kollektive Ausdruck wird im natürlichen Deutschen pluralisch wiedergegeben. Das ergänzte »es« bezeichnet den im Kontext vorausgesetzten Anlass ihres Triumphs, ohne ihn näher festzulegen.
