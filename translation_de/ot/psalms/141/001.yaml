  - severity: low
    issue: „Höre auf meine Stimme“ ist mehrdeutig.
    rationale: Die Formulierung kann auch als Aufforderung zum Gehorchen verstanden werden. „Höre meine Stimme“ bewahrt die Bedeutung von הַאֲזִינָה קוֹלִי ohne diese unerwünschte Nebenbedeutung.
