  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֣ה קְ֭רָאתִי/ךָ ח֣וּשָׁ/ה לִּ֑/י הַאֲזִ֥ינָ/ה ק֝וֹלִ֗/י בְּ/קָרְאִ/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: de
  text: Ein Psalm Davids. Jahwe[a], ich rufe zu dir; eile zu mir! Höre meine Stimme, wenn ich zu dir rufe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, der Eigenname Gottes; traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Die etablierte deutsche Bezeichnung für diese Gattung und für die Überschrift; sie entspricht dem hebräischen מִזְמוֹר.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der Genitiv bewahrt die mögliche Zuordnung zu David, ohne die Präposition לְ eindeutig auf Verfasserschaft festzulegen.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms ist im Haupttext natürlich und würdig; eine Fußnote nennt die hebräische Form und die mögliche Wiedergabe »Jahwe«.
- source_word: קְרָאתִיךָ
  choice: ich rufe zu dir
  rationale: Das Perfekt kann im unmittelbaren Gebetszusammenhang gegenwärtigen bzw. bereits eingesetzten Vollzug ausdrücken; die präsentische Wiedergabe passt zudem zum parallelen Schluss des Verses.
- source_word: חוּשָׁה לִּי
  choice: eile zu mir
  rationale: Gibt die dringliche Aufforderung knapp und in gehobenem, aber verständlichem Deutsch wieder.
- source_word: הַאֲזִינָה
  choice: Höre auf
  rationale: Bringt das verlangte aufmerksame Hören idiomatisch zum Ausdruck, ohne die unnatürliche Lehnwendung »Neige dein Ohr« zu benötigen.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Entspricht unmittelbar dem hebräischen Substantiv und vermeidet die interpretierende Verengung auf »Hilferuf«.
- source_word: בְּקָרְאִי לָךְ
  choice: wenn ich zu dir rufe
  rationale: Der Infinitiv mit בְּ hat hier plausibel temporale Bedeutung; »wenn« ist im Deutschen natürlich und bewahrt den Gebetszusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR mit Fußnote
  alternative: Jahwe
  rationale: Der Haupttext folgt der im Deutschen weithin verständlichen traditionellen Ersatzlesung, während die Fußnote transparent macht, dass im Hebräischen der Eigenname JHWH steht und »Jahwe« als direkte Wiedergabe möglich ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Dringlichkeit. Die Imperative werden durch Ausrufezeichen hervorgehoben; die Wiederholung von »rufen« und die wörtliche »Stimme« bleiben erhalten.
