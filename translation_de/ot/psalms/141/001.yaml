- from: Ein Psalm Davids. HERR[a], ich rufe zu dir; eile zu mir! Höre auf meine Stimme, wenn ich zu dir rufe!
  to: Ein Psalm Davids. Jahwe[a], ich rufe zu dir; eile zu mir! Höre meine Stimme, wenn ich zu dir rufe!
  rationale: Die Revision stellt den im hebräischen Ausgangstext verwendeten Gottesnamen im deutschen Haupttext wieder her und dokumentiert die traditionelle Ersatzlesung sachgerecht in der Fußnote. Zudem wird die potenziell missverständliche Verbindung „auf meine Stimme hören“ durch die klare und natürliche Bitte „Höre meine Stimme“ ersetzt. Bedeutung, Dringlichkeit, Wiederholung von „rufen“ und die Zuordnungsambiguität der Überschrift bleiben erhalten.
