review_pass:
  verdict: revise
  source_fidelity: Die Überschrift und die dringliche Bitte sind im Wesentlichen treffend wiedergegeben. Die präsentische Wiedergabe von קְרָאתִיךָ ist im Gebetskontext vertretbar; auch die temporale Fassung von בְּקָרְאִי ist angemessen. Allerdings wird יְהוָה im Zieltext als Eigenname durch die Ersatzlesung „HERR“ ersetzt, obwohl die englische POB-Audit-Trail und die vorgegebene Terminologie die Wiedergabe des Tetragramms als „Yahweh“ verlangen. Für modernes Standarddeutsch ist „Jahwe“ die etablierte Transkription.
  naturalness: „Eile zu mir“ ist knapp, idiomatisch und dem poetischen Register angemessen. „Höre auf meine Stimme“ kann im Deutschen jedoch auch „gehorche meiner Stimme“ bedeuten. „Höre meine Stimme“ ist natürlicher und gibt die Bitte um aufmerksames Hören klar wieder.
  terminology: „Psalm Davids“ wahrt die in לְדָוִד liegende Zuordnungsambiguität. Der Gottesname sollte konsequent als „Jahwe“ erscheinen; die Fußnote kann die traditionelle Ersatzwiedergabe „der HERR“ dokumentieren, darf den Eigennamen aber nicht als bloße Alternative zum Haupttext behandeln.
