  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֣ה קְ֭רָאתִי/ךָ ח֣וּשָׁ/ה לִּ֑/י הַאֲזִ֥ינָ/ה ק֝וֹלִ֗/י בְּ/קָרְאִ/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: de
  text: 'Ein Psalm Davids.[a]


    HERR[b], ich rufe zu dir; eile zu mir! Höre meine Stimme, wenn ich zu dir rufe!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Überschrift kann auch »Ein Psalm für David« oder allgemeiner »ein David zugeordneter Psalm« bedeuten.
    reason: source_ambiguity
  - marker: b
    text: 'Hebräisch JHWH, traditionell mit »der HERR« wiedergegeben; alternativ: »Jahwe«.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Ein Psalm Davids
  rationale: Die traditionelle und natürliche deutsche Wiedergabe versteht die lamed-Verbindung als Zuordnung zu David; die mögliche Bedeutung »für David« wird in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: HERR
  rationale: Die im Deutschen etablierte Wiedergabe des Gottesnamens mit Kapitälchen wird verwendet; der hebräische Name und die mögliche Wiedergabe »Jahwe« werden in der Fußnote genannt.
- source_word: חוּשָׁה לִּי
  choice: eile zu mir
  rationale: Gibt den dringlichen Imperativ und die Ausrichtung auf den Beter knapp und unmittelbar wieder.
- source_word: הַאֲזִינָה קוֹלִי
  choice: Höre meine Stimme
  rationale: Bewahrt die Bitte um aufmerksames Hören in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe des Tetragramms JHWH
  choice: HERR
  alternative: Jahwe
  rationale: Die traditionelle deutsche Form bleibt im Haupttext, ohne den Eigennamencharakter zu verdecken; die Alternative wird ausdrücklich in der Fußnote ausgewiesen.
- issue: Bedeutung der Überschrift לְדָוִד
  choice: Davids
  alternative: für David / David zugeordnet
  rationale: Die grammatische Konstruktion kann Autorschaft, Zugehörigkeit oder Widmung bezeichnen. Der Haupttext folgt der geläufigen knappen Form, während die Fußnote die Mehrdeutigkeit bewahrt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die parallelen Bitten bleiben knapp und dringlich; die Ausrufezeichen bilden den imperativischen Charakter ab.
