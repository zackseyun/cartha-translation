base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: de
  text: Neige mein Herz nicht zu irgendeiner bösen Sache[a], dazu, frevelhafte Taten zusammen mit Männern zu verüben, die Unrecht tun[b]; und lass mich nicht von ihren Köstlichkeiten essen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einer bösen Angelegenheit“ oder „zu einem bösen Wort“. Das hebräische Wort kann „Sache“, „Angelegenheit“ oder „Wort“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder knapper: „mit Übeltätern“. Wörtlich: „mit Männern, die Unrecht tun“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind erlesene Speisen oder angenehme Dinge; die Wendung kann zugleich die Teilnahme an ihren sündigen Genüssen anklingen lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּט לִבִּי
  choice: Neige mein Herz nicht
  rationale: Die direkte Bitte an Gott und das Bild vom Sichneigen des Herzens bleiben erhalten. Dadurch wird die im Hebräischen liegende Spannung hinsichtlich göttlichen Handelns und menschlicher moralischer Verantwortung nicht abgeschwächt.
- source_word: לְדָבָר רָע
  choice: zu irgendeiner bösen Sache
  rationale: דָּבָר kann Sache, Angelegenheit oder Wort bedeuten. „Sache“ hält die Aussage allgemein, während „irgendeiner“ den unbestimmten, umfassenden Sinn im Deutschen natürlich wiedergibt.
- source_word: לְהִתְעוֹלֵל עֲלִילוֹת בְּרֶשַׁע
  choice: sodass ich frevelhafte Taten verübe
  rationale: Die Infinitivkonstruktion bezeichnet das tätige Einlassen auf Handlungen. „Frevelhafte Taten verüben“ gibt deren moralische Qualität idiomatisch und mit angemessenem Gewicht wieder; „sodass“ drückt den Zusammenhang mit der Neigung des Herzens aus.
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: mit Männern, die Unheil tun
  rationale: „Männer“ entspricht dem ausdrücklich maskulinen אִישִׁים. Die Relativkonstruktion bewahrt das verbale Bild von Menschen, deren Tun durch אָוֶן geprägt ist.
- source_word: וּבַל אֶלְחַם
  choice: und lass mich nicht … essen
  rationale: Die negative Fortsetzung wird als weitere Bitte wiedergegeben. Das konkrete Bild des Essens bleibt stehen und wird nicht vorschnell als bloße Metapher aufgelöst.
- source_word: בְּמַנְעַמֵּיהֶם
  choice: von ihren Köstlichkeiten
  rationale: Das Wort bezeichnet angenehme oder erlesene Dinge und kann besonders feine Speisen meinen. „Köstlichkeiten“ passt zum Verb „essen“, lässt aber den möglichen Beiklang verlockender Genüsse erkennen.
theological_decisions:
- issue: Göttliches Handeln und menschliche Verantwortung in der Bitte um das Herz
  choice: Die direkte Form „Neige mein Herz nicht“ wird beibehalten.
  alternative: „Lass mein Herz sich nicht zum Bösen neigen.“
  rationale: Der hebräische Text bittet Gott unmittelbar, das Herz des Beters nicht zum Bösen zu neigen. Die Übersetzung bewahrt diese theologische Spannung, statt die göttliche Beteiligung durch eine reine Erlaubnisformulierung abzuschwächen.
- issue: Köstlichkeiten als Speise oder als Teilnahme an sündigen Genüssen
  choice: Das konkrete Essensbild bleibt im Haupttext erhalten.
  alternative: „Lass mich nicht an ihren sündigen Genüssen teilhaben.“
  rationale: Der Wortlaut spricht vom Essen ihrer Köstlichkeiten. Eine weitergehende moralische Bedeutung ist im Zusammenhang möglich, soll aber nicht an die Stelle des Bildes gesetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von Herz, Taten und Essen bleibt erhalten. „Frevelhaft“ und „Unheil tun“ tragen das moralische Gewicht des Hebräischen, ohne konfessionelle Fachsprache einzuführen.
