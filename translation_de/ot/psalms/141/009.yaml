base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/009.yaml
  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
translation:
  language: de
  text: Bewahre mich vor dem Zugriff der Falle, die sie mir gestellt haben,[a][b] und vor den Schlingen derer, die Böses tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus den Händen der Falle“. „Hand“ bezeichnet im Hebräischen auch Macht oder Zugriff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bewahre mich vor der Falle, die sie mir gestellt haben, und vor den Schlingen derer, die Böses tun.“'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Bewahre mich
  rationale: Der Imperativ von שׁמר bezeichnet hier die Bitte, geschützt oder behütet zu werden. „Bewahre mich“ ist im Gebetskontext natürlich und würdevoll.
- source_word: מִידֵי
  choice: vor der Gewalt
  rationale: Wörtlich steht „aus/von den Händen“. Bei einer Falle bezeichnet „Hand“ bildhaft deren Macht oder Zugriff. „Vor der Gewalt“ gibt diese idiomatische Kraft wieder, ohne das ungewöhnliche hebräische Bild ganz einzuebnen; die wörtliche Form wird in einer Fußnote genannt.
- source_word: פַח
  choice: Falle
  rationale: פח bezeichnet eine Falle oder Schlinge. „Falle“ unterscheidet den Ausdruck vom folgenden מֹקְשׁוֹת und erhält so die lexikalische Variation des Parallelismus.
- source_word: יָקְשׁוּ לִי
  choice: die sie mir gestellt haben
  rationale: Das Verb יקשׁ meint das Legen beziehungsweise Stellen einer Falle. Die deutsche Relativkonstruktion gibt den Bezug auf פח idiomatisch wieder.
- source_word: וּמֹקְשׁוֹת
  choice: und vor den Schlingen
  rationale: מֹקְשׁוֹת ist der Plural von מוֹקֵשׁ, „Schlinge/Falle“. Die Präposition „vor“ wird aus dem ersten Versglied ergänzt und macht den parallelen Satzbau im Deutschen klar.
- source_word: פֹּעֲלֵי אָוֶן
  choice: derer, die Böses tun
  rationale: Die Wendung bedeutet wörtlich etwa „Täter/Wirkende von Bösem, Unrecht oder Unheil“. „Die Böses tun“ bewahrt den handelnden und moralischen Sinn in verständlichem modernem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die ungewöhnliche hebräische Verbindung von „Händen“ und „Falle“ wird im Haupttext sinngemäß als „Gewalt der Falle“ wiedergegeben und in der Fußnote transparent gemacht. „Schlingen“ erhält die poetische Variation gegenüber „Falle“.
