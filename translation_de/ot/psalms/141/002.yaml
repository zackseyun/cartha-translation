  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: de
  text: Möge mein Gebet wie Räucherwerk vor dir stehen[a], das Erheben meiner Hände wie das Abendopfer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „fest vor dir stehen“ oder „vor dir bereitet sein“. Das Hebräische bittet darum, dass das Gebet festen Bestand in Gottes Gegenwart habe; „von dir angenommen werden“ ist im Zusammenhang möglich, aber nicht ausdrücklich gesagt.'
    reason: lexical_alternative
  - marker: b
    text: Das „Abendopfer“ ist eine am Abend dargebrachte Opfergabe. Das hebräische Wort kann genauer ein Speise- oder Getreideopfer bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: möge … bereitstehen
  rationale: Das Nifal von כון bezeichnet hier wunschhaft ein festes Aufgestellt- oder Bereitetsein vor Gott. „Bereitstehen“ ist im Deutschen natürlich und bewahrt die kultische Vorstellung, ohne die Bedeutung vorschnell auf „angenommen werden“ einzuengen.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der ersten Person Singular.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Bezeichnet das wohlriechende Räucheropfer; „Räucherwerk“ wahrt den kultischen Bezug genauer als das allgemeinere „Weihrauch“.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Gibt die räumlich-relationale Wendung knapp und idiomatisch als Gegenwart vor Gott wieder.
- source_word: מַשְׂאַת כַּפַּי
  choice: das Erheben meiner Hände
  rationale: Bewahrt das körperliche Bild der zum Gebet erhobenen Hände; „Hände“ ist im Deutschen idiomatischer als das wörtlich mögliche „Handflächen“.
- source_word: מִנְחַת עָרֶב
  choice: Abendopfer
  rationale: Gibt den kultischen Ausdruck knapp wieder. Da מִנְחָה insbesondere ein Speis- oder Getreideopfer bezeichnen kann, wird diese Nuance in der Fußnote erhalten.
theological_decisions:
- issue: Kultische Bilder für das Gebet
  choice: Gebet und erhobene Hände werden mit Räucherwerk und Abendopfer parallelgesetzt, ohne die Bildsprache als ausdrückliche Lehre vom Ersatz der Opfer auszudeuten.
  alternative: Das Gebet ausdrücklich als geistlichen Ersatz für das Opfer oder die Aussage als bloßes poetisches Bild ohne kultischen Gehalt wiedergeben.
  rationale: Der hebräische Text verwendet eindeutige Begriffe aus dem Opferkult, formuliert jedoch eine poetische Parallelsetzung. Die Übersetzung erhält diese Spannung, ohne eine weitergehende Opfertheologie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die zweimalige Verwendung von „als“ erhält die unmittelbare kultische Gegenüberstellung; die Ellipse im zweiten Halbvers folgt der hebräischen Form und bleibt gut verständlich.
