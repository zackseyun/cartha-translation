source:
  edition: WLC
  text: כִּ֤י אֵלֶ֨י/ךָ יְהֹוִ֣ה אֲדֹנָ֣/י עֵינָ֑/י בְּ/כָ֥ה חָ֝סִ֗יתִי אַל תְּעַ֥ר נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/008.yaml
  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
translation:
  language: de
  text: Denn auf dich, Jahwe, mein Herr, sind meine Augen gerichtet; bei dir habe ich Zuflucht gesucht. Gieße mein Leben[a] nicht aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Seele“ beziehungsweise „mich selbst“. Das hebräische Wort nefesch kann je nach Zusammenhang das Leben, die Person oder die Seele bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch im Sinn von „entblößen“, „leeren“ oder „schutzlos zurücklassen“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die Bitte im Zusammenhang und behält damit ihre verbindende Funktion.
- source_word: אֵלֶיךָ … עֵינַי
  choice: meine Augen sind auf dich gerichtet
  rationale: Die natürliche deutsche Wendung bewahrt das hebräische Bild eines auf Gott gerichteten Blicks und drückt Aufmerksamkeit sowie Vertrauen aus.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht mit dem unmittelbar folgenden Herrschaftstitel zusammengezogen.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die Anrede wird vom Gottesnamen unterschieden; das Possessivsuffix der ersten Person Singular bleibt ausdrücklich erhalten.
- source_word: בְּךָ חָסִיתִי
  choice: bei dir suche ich Zuflucht
  rationale: Die Wendung gibt die vertrauensvolle, im Gebet gegenwärtige Haltung idiomatisch wieder. Das Perfekt bezeichnet hier sinnvoll eine eingenommene und fortbestehende Haltung.
- source_word: אַל תְּעַר
  choice: Gieße … nicht aus
  rationale: Die konkrete Metapher des Hiphil von ערה wird bewahrt. Da das Verb auch Entblößen oder Leeren bezeichnen kann, wird die Bedeutungsbreite in einer Fußnote offengelegt.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ bezeichnet hier im Kontext der Bewahrung die bedrohte Lebenskraft beziehungsweise die Person, ohne zwingend eine vom Körper getrennte Seele zu meinen.
theological_decisions:
- issue: Wiedergabe der doppelten Gottesbezeichnung יְהֹוָה אֲדֹנָי
  choice: Jahwe, mein Herr
  alternative: HERR, mein Herr; Herr, HERR
  rationale: Eigenname und Herrschaftstitel bleiben als zwei unterschiedliche Elemente der Anrede erkennbar; zugleich wird das Suffix „mein“ nicht verdeckt.
- issue: Bedeutung von נֶפֶשׁ in der Bitte um Bewahrung
  choice: mein Leben
  alternative: meine Seele; mich selbst
  rationale: Der Zusammenhang spricht von der bedrohten Person beziehungsweise ihrem Leben. „Leben“ vermeidet es, dem hebräischen Ausdruck ohne zwingenden Grund eine engere dualistische Bedeutung zu geben.
- issue: Mehrdeutigkeit von תְּעַר
  choice: Gieße … nicht aus
  alternative: Entblöße mich nicht; lass mich nicht schutzlos zurück; gib mein Leben nicht preis
  rationale: Die Hauptfassung erhält das auffällige Bild des Ausgießens. Die Fußnote macht transparent, dass das Verb auch Entblößung, Leerung oder daraus folgende Schutzlosigkeit ausdrücken kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die konkreten hebräischen Bilder bleiben erhalten; Satzstellung und Zufluchtsformel sind zugleich natürlich deutsch formuliert. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
