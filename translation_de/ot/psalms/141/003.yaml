  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Imperative und den Parallelismus sachgerecht wieder: שִׁיתָה שָׁמְרָה („Stell eine Wache“) sowie נִצְּרָה („behüte“). „vor meinen Mund“ ist eine idiomatische deutsche Entsprechung zu לְפִי im Bild einer postierten Wache. Die Metapher דַּל שְׂפָתָי als „Tür meiner Lippen“ bleibt erhalten.'
