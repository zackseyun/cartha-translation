source:
  edition: WLC
  text: שִׁיתָ֣/ה יְ֭הוָה שָׁמְרָ֣ה לְ/פִ֑/י נִ֝צְּרָ֗/ה עַל דַּ֥ל שְׂפָתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: de
  text: Stell eine Wache vor meinen Mund, Jahwe; behüte die Tür meiner Lippen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen das Bild von der „Tür“ beziehungsweise dem „Türflügel“ der Lippen; gemeint ist die Öffnung der Lippen.
    reason: Die seltene Metapher kann ohne Erläuterung missverstanden werden.
lexical_decisions:
- source_word: שִׁיתָה
  choice: Stell
  rationale: Der Imperativ von שׁית bittet Gott, eine Wache einzusetzen; „stell“ ist im Deutschen knapp und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: שָׁמְרָה לְפִי
  choice: eine Wache vor meinen Mund
  rationale: שָׁמְרָה ist hier ein Substantiv („Wache“); die deutsche Fügung bewahrt das konkrete Bild einer eingesetzten Wache.
- source_word: נִצְּרָה
  choice: behüte
  rationale: Der Imperativ von נצר bezeichnet achtsames Bewahren und bildet die Parallele zur Wache im ersten Versglied.
- source_word: עַל דַּל שְׂפָתָי
  choice: die Tür meiner Lippen
  rationale: Die ungewöhnliche hebräische Metapher wird bewusst erhalten; דַּל bezeichnet hier wohl eine Tür beziehungsweise einen Türflügel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; seine Wiedergabe als „Jahwe“ wahrt diesen Unterschied gegenüber dem Titel „Herr“.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Der Parallelismus und das konkrete Bild einer bewachten Mundöffnung bleiben erhalten; „Jahwe“ folgt der im Ausgangsmaterial vorgegebenen Wiedergabe des Gottesnamens.
