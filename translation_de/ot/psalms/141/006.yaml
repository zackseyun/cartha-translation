  terminology: „Richter“, „Felsen“ und „Worte“ sind sachgerecht. Die Fußnote zur Topographie und zur ungewöhnlichen wörtlichen Lesart ist wichtig und bleibt erhalten. Die lexikalische Alternativangabe zu נָעֵמוּ sollte die naheliegende Nuance „süß“ nennen.
