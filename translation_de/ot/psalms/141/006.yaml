    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: werden hinabgestürzt
  rationale: Das Nifal von שׁמט bezeichnet hier wahrscheinlich ein Herabfallenlassen oder Hinabstürzen. Die passive Wiedergabe bewahrt das gewaltsame Bild, ohne den schwer bestimmbaren Zeitbezug des poetischen Perfekts unnötig festzulegen.
- source_word: בִידֵי סֶלַע
  choice: an den Seiten des Felsens
  rationale: Wörtlich ist die Verbindung ungewöhnlich („in/an den Händen eines Felsens“). Im Zusammenhang liegt eine räumliche Deutung als Seiten oder Flanken eines Felsens nahe; die echte Unsicherheit wird in der Fußnote offengelegt.
- source_word: שֹׁפְטֵיהֶם
  choice: ihre Richter
  rationale: Die substantivierte Form von שׁפט bezeichnet unmittelbar Richter, kann jedoch zugleich Herrscher meinen. „Richter“ wahrt die formale Entsprechung.
- source_word: וְשָׁמְעוּ
  choice: dann hören sie
  rationale: Das hebräische Perfekt kann in der Dichtung je nach Zusammenhang vergangene, gegenwärtige oder zukünftige Bedeutung tragen. „Dann hören sie“ stellt den wahrscheinlichen Folgezusammenhang her, ohne ihn als bereits abgeschlossen festzulegen.
- source_word: אֲמָרַי
  choice: meine Worte
  rationale: Eine direkte und im Deutschen natürliche Wiedergabe des Plurals mit Suffix der ersten Person.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ gibt die begründende oder erläuternde Funktion knapp und idiomatisch wieder.
- source_word: נָעֵמוּ
  choice: sie sind angenehm
  rationale: נעם bezeichnet Annehmlichkeit oder Lieblichkeit. „Angenehm“ bleibt nüchtern und bewahrt die positive Wertung; stärkere Nuancen stehen in der Fußnote.
theological_decisions:
- issue: Deutung der schwierigen Wendung בידי סלע
  choice: 'räumlich: „an den Seiten des Felsens“'
  alternative: 'wörtlicher: „in die Hände des Felsens“; topografisch deutlicher: „an den Felswänden hinab“'
  rationale: Syntax und Bildsprache sind unsicher. Der Haupttext verwendet die wahrscheinliche räumliche Deutung, während die Fußnote die ungewöhnliche wörtliche Form und eine idiomatischere topografische Möglichkeit bewahrt.
- issue: Zeit- und Folgeverhältnis von וְשָׁמְעוּ
  choice: „dann hören sie“
  alternative: „und sie haben gehört“ oder „und sie werden hören“
  rationale: Das poetische Perfekt erlaubt mehrere zeitliche Einordnungen. Die gewählte Form bewahrt die lebendige Folge, ohne eine abgeschlossene Vergangenheit dogmatisch festzuschreiben.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper poetischer Satzführung. Die schwer verständliche Bildsprache wird nicht geglättet; wesentliche sprachliche Alternativen werden in den Fußnoten ausgewiesen.
