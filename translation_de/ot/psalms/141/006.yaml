  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: de
  text: Ihre Richter sind an den Seiten des Felsens hinabgestürzt worden[a]; sie haben meine Worte gehört, denn sie sind angenehm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den Felswänden hinab“. Die hebräische Wendung ist schwierig; wörtlicher wurde sie auch als „in die Hände des Felsens“ verstanden.'
