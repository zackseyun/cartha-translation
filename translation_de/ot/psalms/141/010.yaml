translation:
  language: de
  text: Die Frevler sollen allesamt in seine Netze[a] fallen, bis ich vorübergehe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Frevler sollen allesamt in ihre eigenen Netze fallen.“ Das Hebräische hat „seine Netze“: Das Nomen steht im Plural, sein Suffix im Singular. Dieses kann sich kollektiv auf den einzelnen Frevler beziehungsweise auf die Frevler beziehen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „bis ich hinübergehe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּלוּ
  choice: sollen … fallen
  rationale: Das Qal-Imperfekt kann im Gebetszusammenhang jussiv verstanden werden. „Sollen … fallen“ gibt den Wunschcharakter natürlich wieder.
- source_word: בְמַכְמֹרָיו
  choice: in seine Netze
  rationale: מַכְמֹר bezeichnet ein Fangnetz; die masoretische Form trägt ein maskulines Singularsuffix („seine“) an einem pluralischen Nomen („Netze“). Diese grammatische Spannung wird im Haupttext bewahrt.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv bezeichnet schuldhaft böse Menschen. „Frevler“ ist knapp, würdig und im Psalmenstil verständlich.
- source_word: יַחַד
  choice: allesamt
  rationale: Das Adverb kann Gemeinsamkeit oder Gesamtheit ausdrücken. „Allesamt“ passt zur kollektiven Bitte und zur gehobenen poetischen Sprache.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen hebt den Sprecher hervor; der deutsche Gegensatz zu den Frevlern vermittelt diese Betonung ausreichend.
- source_word: עַד
  choice: während
  rationale: Wörtlich meist „bis“. In der knappen poetischen Konstruktion kann es die Zeitspanne bezeichnen, in der der Sprecher vorübergeht; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: אֶעֱבוֹר
  choice: vorübergehe
  rationale: עבר bedeutet „hinübergehen, vorübergehen, passieren“. „Vorübergehe“ bleibt ohne den im Hebräischen nicht ausdrücklich genannten Zusatz „unversehrt/sicher“.
