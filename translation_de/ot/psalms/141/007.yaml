  text: כְּמ֤וֹ פֹלֵ֣חַ וּ/בֹקֵ֣עַ בָּ/אָ֑רֶץ נִפְזְר֥וּ עֲ֝צָמֵ֗י/נוּ לְ/פִ֣י שְׁאֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
translation:
  language: de
  text: Wie einer den Erdboden pflügt und aufbricht,[a] so sind unsere Knochen am Mund des Scheols[b] verstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Wie einer den Boden durchfurcht und spaltet.“ Die hebräischen Partizipien schildern das Aufbrechen des Bodens lebhaft und lassen mehrere ähnliche landwirtschaftliche Verben zu.'
    reason: lexical_alternative
  - marker: b
    text: Scheol ist die hebräische Bezeichnung für den Bereich der Toten; traditionell wird das Wort auch mit „Totenreich“ oder „Grab“, in manchen Zusammenhängen weniger genau mit „Hölle“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Wie
  rationale: Leitet den Vergleich unmittelbar und natürlich ein; das ergänzte „so“ im Hauptsatz macht die Vergleichsstruktur im Deutschen klar.
- source_word: פֹלֵחַ וּבֹקֵעַ
  choice: pflügt und aufbricht
  rationale: Die beiden Partizipien schildern anschaulich das Zerteilen und Aufbrechen des Bodens. Die landwirtschaftlichen Verben geben sowohl das Bild als auch seine Härte verständlich wieder.
- source_word: בָּאָרֶץ
  choice: den Erdboden
  rationale: Gemeint ist hier die bearbeitete Erde beziehungsweise der Boden; „Erdboden“ hält den Bezug zur Erde fest und klingt im landwirtschaftlichen Zusammenhang natürlich.
- source_word: נִפְזְרוּ
  choice: sind … verstreut
  rationale: Die Nifal-Form bezeichnet einen passiven beziehungsweise resultativen Zustand. Das deutsche Perfekt bringt Ergebnis und fortbestehenden Zustand zum Ausdruck.
- source_word: עֲצָמֵינוּ
  choice: unsere Gebeine
  rationale: Die konkrete, schonungslose Bildsprache wird bewahrt. „Gebeine“ ist im Zusammenhang mit verstreuten menschlichen Knochen würdevoll und idiomatisch.
- source_word: לְפִי
  choice: am Rachen
  rationale: Wörtlich steht „am Mund“. „Rachen“ bewahrt das körperhafte, bedrohliche Bild des verschlingenden Totenreichs besser als das abstraktere „Eingang“.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Umschrift erhält den althebräischen Begriff und vermeidet eine vorschnelle Gleichsetzung mit späteren Vorstellungen von Hölle oder Grab.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab; Hölle
  rationale: „Scheol“ lässt die alttestamentliche Vorstellung vom Bereich der Toten offen. „Hölle“ würde spätere und engere theologische Assoziationen eintragen; „Grab“ könnte den umfassenderen Sinn zu stark verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Bildsprache bleibt durch „Gebeine“ und „Rachen“ erhalten; „Scheol“ wahrt die begriffliche und theologische Offenheit des Hebräischen.
