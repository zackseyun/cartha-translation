source:
  edition: WLC
  text: יֶֽהֶלְמֵֽ/נִי צַדִּ֨יק חֶ֡סֶד וְֽ/יוֹכִיחֵ֗/נִי שֶׁ֣מֶן רֹ֭אשׁ אַל יָנִ֣י רֹאשִׁ֑/י כִּי ע֥וֹד וּ֝/תְפִלָּתִ֗/י בְּ/רָעוֹתֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: de
  text: Ein Gerechter schlage mich – das ist Güte[a]; er weise mich zurecht – das ist Öl für das Haupt. Mein Haupt soll es nicht zurückweisen[b]. Denn noch richtet sich mein Gebet gegen ihre bösen Taten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Gerechter schlage mich in treuer Liebe.“ Das hebräische Wort kann stärker loyale Liebe, Barmherzigkeit oder Bundestreue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist schwierig; sinngemäß auch: „Mein Haupt soll es nicht ablehnen.“'
    reason: lexical_alternative
  - marker: c
    text: 'Die Schlussaussage ist unsicher. Möglich ist auch: „Denn noch bete ich in ihrem Unglück“, oder: „Denn selbst dann bete ich für sie in ihren Nöten.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  choice: schlage mich
  rationale: Das Verb הלם bezeichnet einen kräftigen Schlag. Die konkrete Metapher der schmerzhaften, aber heilsamen Zurechtweisung bleibt erhalten.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das maskuline Singularadjektiv ist substantiviert und bezeichnet hier repräsentativ einen gerechten Mann; „ein Gerechter“ ist im Deutschen knapp und natürlich.
- source_word: חֶסֶד
  choice: Güte
  rationale: חסד kennzeichnet den Schlag des Gerechten als wohlwollende, hilfreiche Tat. „Güte“ bewahrt zugleich die mögliche stärkere Bedeutung von loyaler Liebe beziehungsweise Barmherzigkeit.
- source_word: וְיוֹכִיחֵנִי
  choice: er weise mich zurecht
  rationale: Der Hifil von יכח bezeichnet tadelnde oder korrigierende Zurechtweisung. Die Formulierung ist klar und würdevoll, ohne die Schärfe ganz zu verlieren.
- source_word: שֶׁמֶן רֹאשׁ
  choice: Öl für das Haupt
  rationale: Die Konstruktverbindung wird bildhaft und ohne Festlegung auf eine förmliche Salbung wiedergegeben.
- source_word: אַל יָנִי רֹאשִׁי
  choice: Mein Haupt soll es nicht zurückweisen
  rationale: Die hebräische Wendung ist schwierig. Diese Wiedergabe erhält das Haupt als grammatisches Subjekt und versteht das Öl beziehungsweise die Zurechtweisung als das nicht Abzuweisende.
- source_word: כִּי עוֹד
  choice: Denn noch
  rationale: Die knappe Formulierung wahrt sowohl den begründenden Anschluss durch כִּי als auch den fortdauernden Sinn von עוֹד.
- source_word: וּתְפִלָּתִי
  choice: richtet sich mein Gebet
  rationale: Die Ergänzung „richtet sich“ ermöglicht eine natürliche deutsche Verbindung mit „gegen“, ohne den nominalen Kern „mein Gebet“ zu verändern.
- source_word: בְּרָעוֹתֵיהֶם
  choice: gegen ihre bösen Taten
  rationale: Die Präposition ב und die gesamte Schlussklausel sind mehrdeutig. Im Zusammenhang liegt ein Gebet gegen das böse Handeln der Frevler nahe; „böse Taten“ macht den wohl gemeinten moralischen Sinn von רעות verständlich, ohne die Alternativen zu verschweigen.
theological_decisions:
- issue: Geschlechtliche Wiedergabe von צַדִּיק
  choice: ein Gerechter
  alternative: eine gerechte Person; der Gerechte
  rationale: Das Hebräische steht im grammatisch maskulinen Singular. Die gewählte Form bewahrt diese Gestalt, ohne einen bestimmten, zuvor genannten Mann vorauszusetzen.
- issue: Deutung der schwierigen Schlussklausel
  choice: Denn noch richtet sich mein Gebet gegen ihre bösen Taten
  alternative: Denn auch in ihrem Unglück bete ich noch; denn selbst dann bete ich für sie in ihren Nöten
  rationale: Die Funktion von ב und die Bedeutung von רעותיהם lassen mehrere Deutungen zu. Die Hauptfassung folgt dem Kontrast zwischen gerechter Zurechtweisung und dem Bösen der Frevler; die sachlich erheblichen Alternativen werden in der Fußnote erhalten.
- issue: Bezug von „es“ in der dritten Aussage
  choice: Das Ölbild beziehungsweise die damit bezeichnete Zurechtweisung soll nicht zurückgewiesen werden
  alternative: Die Zeile kann anders vokalisiert oder lexikalisch als „mein Haupt soll es nicht ablehnen“ beziehungsweise mit einer Bedeutung wie „salben“ verstanden werden
  rationale: Der masoretische Text ist an dieser Stelle sprachlich schwierig. Die Übersetzung wahrt das Bild und vermeidet eine weitergehende dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haupt“ wurde statt „Kopf“ gewählt, weil es die poetische Wiederholung und das Bild des Hauptöls trägt; die übrige Syntax bleibt bewusst klar und gegenwärtig. Die drei Fußnotenmarker [a], [b] und [c] stehen jeweils an der einschlägigen Stelle im Haupttext.
