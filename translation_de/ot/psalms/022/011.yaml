id: PSA.22.11
reference: Psalms 22:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּרְחַ֣ק מִ֭מֶּ/נִּי כִּי צָרָ֣ה קְרוֹבָ֑ה כִּי אֵ֥ין עוֹזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: de
  text: Sei nicht fern von mir, denn die Not[a] ist nahe, denn kein Helfer ist da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bedrängnis“. Das hebräische Wort kann Not, Bedrängnis oder Unheil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: Sei nicht fern von mir
  rationale: Die Verneinung אַל mit der Verbform von רחק drückt eine dringliche Bitte aus. Die räumliche Metapher und die Beziehung zu „mir“ bleiben unmittelbar erhalten, ohne sie als Verlassenheit auszudeuten.
- source_word: כִּי
  choice: denn
  rationale: Beide Vorkommen führen jeweils einen Grund für die Bitte an. Das wiederholte „denn“ bewahrt den knappen Aufbau und den poetischen Nachdruck des Hebräischen.
- source_word: צָרָה קְרוֹבָה
  choice: die Not ist nahe
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Unheil; קְרוֹבָה ist ein prädikatives Adjektiv mit der Bedeutung „nahe“. Die Formulierung bewahrt sowohl die Breite des Nomens als auch die räumliche Bildsprache.
- source_word: אֵין עוֹזֵר
  choice: kein Helfer ist da
  rationale: אֵין verneint die Existenz, während das substantivisch gebrauchte Partizip עוֹזֵר eine helfende Person bezeichnet. „Kein Helfer ist da“ erhält beides deutlicher als das abstraktere „es gibt keine Hilfe“.
theological_decisions:
- issue: Gottes Ferne in der Klage
  choice: Die Bitte wird räumlich als „Sei nicht fern von mir“ wiedergegeben.
  alternative: Verlass mich nicht.
  rationale: Das Hebräische spricht mit רחק und מן von Ferne. „Verlass mich nicht“ würde die Aussage verstärken und die theologische Spannung der Klage vorschnell festlegen.
- issue: Persönlicher oder abstrakter Beistand
  choice: „kein Helfer ist da“
  alternative: „es gibt keine Hilfe“
  rationale: Das Partizip עוֹזֵר bezeichnet hier am ehesten einen Helfenden. Die persönliche Form wahrt die Aussage, ohne festzulegen, ob ausschließlich menschliche oder auch göttliche Hilfe gemeint ist.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit knapper, würdevoller Psalmen-Sprache. Die Wiederholung von „denn“ und die räumlichen Bilder „fern“ und „nahe“ wurden bewusst beibehalten.
