base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: de
  text: Auf dich wurde ich vom Mutterleib an geworfen; vom Schoß meiner Mutter an bist du mein Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen ohne ausgedrückte Zeitform: »Mein Gott bist du.« Gemeint sein kann sowohl das gegenwärtige Bekenntnis als auch die seit dem Mutterleib fortdauernde Beziehung.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָלֶיךָ
  choice: auf dich
  rationale: Die Präposition עַל bewahrt hier das Bild, dass der Sprecher von Anfang an auf Gott und seine Fürsorge geworfen ist.
- source_word: הָשְׁלַכְתִּי
  choice: wurde ich geworfen
  rationale: Die passive Verbform bezeichnet wörtlich ein Geworfenwerden. Die bildhafte, spannungsvolle Formulierung bleibt erhalten, ohne sie deutend zu „anvertraut“ abzumildern.
- source_word: מֵרָחֶם
  choice: vom Mutterleib an
  rationale: רֶחֶם bezeichnet den Mutterleib. Das deutsche „von … an“ gibt in diesem Zusammenhang den Ausgangspunkt der Beziehung natürlich wieder.
- source_word: מִבֶּטֶן אִמִּי
  choice: vom Leib meiner Mutter an
  rationale: בֶּטֶן kann „Bauch“ oder „Leib“ bedeuten. „Leib meiner Mutter“ ist im poetischen Register natürlich und bewahrt gegenüber „Mutterleib“ annähernd die lexikalische Variation des Hebräischen.
- source_word: אֵלִי אָתָּה
  choice: bist du mein Gott
  rationale: Die wörtlich verblos formulierte Aussage „mein Gott — du“ wird im Deutschen am unmittelbarsten mit dem Präsens wiedergegeben; der vorangehende Ausdruck „von … an“ lässt zugleich die seit der Geburt fortdauernde Beziehung erkennen.
theological_decisions:
- issue: Zeitbezug des verblosen Schlusssatzes
  choice: bist du mein Gott
  alternative: bist du für mich Gott gewesen / warst du mein Gott
  rationale: Das Hebräische legt grammatisch keine Zeitform fest. Das Präsens bewahrt die offene Form des Bekenntnisses, während der Kontext eine bis in die früheste Lebenszeit zurückreichende Beziehung erkennen lässt, ohne sie durch eine ausdrücklich ergänzte Vergangenheitsform festzulegen.
translation_notes:
  register: Moderne, würdige Psalmenpoesie. Die Wiederholung „vom … an“ bildet den hebräischen Parallelismus ab; „wurde … geworfen“ erhält bewusst das kräftige und nicht vollständig aufgelöste Bild des Ausgangstextes.
