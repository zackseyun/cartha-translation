  text: אֲסַפְּרָ֣ה שִׁמְ/ךָ֣ לְ/אֶחָ֑/י בְּ/ת֖וֹךְ קָהָ֣ל אֲהַלְלֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/022.yaml
  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: de
  text: Ich will deinen Namen meinen Brüdern[a] verkünden; mitten in der Versammlung will ich dich loben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Brüdern und Schwestern“, falls die familiäre Bezeichnung im Zusammenhang einschließend gemeint ist; wörtlich steht im Hebräischen „meinen Brüdern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: ich will … verkünden
  rationale: Das Piel von ספר bezeichnet hier ein öffentliches Erzählen oder Bekanntmachen. „Verkünden“ gibt den bezeugenden Sinn wieder und entspricht dem parallelen Lob in der zweiten Vershälfte.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die hebräische Rede vom „Namen“ bleibt erhalten; sie verweist auf Gottes offenbartes Wesen und seinen Ruf, ohne dass diese Bedeutung erklärend in den Text eingebaut wird.
- source_word: לְאֶחָי
  choice: meinen Brüdern
  rationale: Das hebräische Substantiv ist maskuliner Plural mit Suffix der ersten Person. „Meinen Brüdern“ bewahrt die sprachliche Form und den familiären Gemeinschaftsbezug.
- source_word: בְּתוֹךְ
  choice: mitten in
  rationale: Die Wendung bewahrt die räumliche Vorstellung, dass das Lob öffentlich innerhalb der versammelten Gemeinschaft erklingt, und ist zugleich natürliches modernes Deutsch.
- source_word: קָהָל
  choice: der Versammlung
  rationale: קָהָל bezeichnet eine zusammengekommene Gemeinschaft. „Versammlung“ ist verständlich und vermeidet eine unnötige Festlegung auf eine spätere kirchliche Institution.
- source_word: אֲהַלְלֶךָּ
  choice: ich will dich loben
  rationale: Das Piel von הלל bedeutet hier unmittelbar „loben“; das Objektsuffix wird mit „dich“ wiedergegeben. Eine musikalische Nuance wird nicht hinzugefügt.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung im Zusammenhang der versammelten Gemeinschaft
  choice: meinen Brüdern
  alternative: meinen Brüdern und Schwestern
  rationale: Der Haupttext folgt der ausdrücklich maskulinen Form des Hebräischen. Da die Anrede im gemeinschaftlichen Zusammenhang auch einschließend verstanden werden kann, wird diese mögliche Reichweite in einer Fußnote genannt, statt sie eindeutig in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Parallelität. Die wiederholte Willens- bzw. Zukunftsform „ich will“ bildet die beiden hebräischen Kohortative ab; „mitten in“ erhält das öffentliche und räumliche Bild.
