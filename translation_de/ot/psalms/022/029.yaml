  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: de
  text: Alle Wohlhabenden der Erde[a] werden essen und sich niederwerfen; vor ihm werden alle niederknien, die zum Staub hinabsteigen[b] – auch wer sich selbst nicht am Leben erhalten konnte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alle Fetten der Erde«. Gemeint sind wahrscheinlich die Wohlgenährten oder Wohlhabenden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »alle, die zum Staub hinabgehen«. Der Staub ist hier ein hebräisches Bild für Sterblichkeit und Tod.'
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Schlussklausel ist schwer zu deuten. Wörtlich etwa: »und sein Leben hat er nicht am Leben erhalten«; häufig wird sie auf jemanden bezogen, der sich selbst nicht am Leben erhalten konnte.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: werden essen
  rationale: Das Qal-Perfekt steht in einem poetisch-prophetischen Zusammenhang und kann hier mit Zukunftsbezug verstanden werden; die Wiedergabe fügt sich in die vorausblickende Aussage des Psalms.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: und sich niederwerfen
  rationale: Das Verb bezeichnet das körperliche Niederwerfen, häufig als Huldigung oder Anbetung. Die Formulierung bewahrt das konkrete Bild, ohne die kultische Bedeutung ausdrücklich festzulegen.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: alle Wohlhabenden der Erde
  rationale: דִּשְׁנֵי bedeutet wörtlich die »Fetten« beziehungsweise »Wohlgenährten« und bezeichnet idiomatisch Menschen in Wohlstand. »Wohlhabenden« gibt den gesellschaftlichen Sinn in natürlichem Deutsch wieder.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Knappes und idiomatisches Äquivalent der hebräischen Präpositionalwendung.
- source_word: יִכְרְעוּ
  choice: werden niederknien
  rationale: כרע bezeichnet das Beugen der Knie beziehungsweise das Niederknien und wahrt gegenüber »sich niederwerfen« die eigenständige körperliche Bildsprache.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: alle, die zum Staub hinabsteigen
  rationale: Die partizipiale Wendung wird bildnah wiedergegeben. »Staub« bewahrt das hebräische Bild für Sterblichkeit und Tod, statt es direkt als »Grab« auszulegen.
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: auch wer sich selbst nicht am Leben erhalten konnte
  rationale: Die syntaktisch schwierige Schlussklausel wird als Aussage über einen Menschen verstanden, der sein eigenes Leben nicht bewahren konnte. »Sich selbst am Leben erhalten« gibt נֶפֶשׁ hier idiomatisch als Leben beziehungsweise Person wieder; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Deutung der Schlussklausel וְנַפְשׁוֹ לֹא חִיָּה
  choice: Die Klausel bezeichnet einen Menschen, der sein eigenes Leben nicht erhalten konnte, und stellt ihn den Wohlhabenden gegenüber.
  alternative: 'Wörtlicher und syntaktisch offener: »und sein Leben hat er nicht erhalten« beziehungsweise passivisch »dessen Leben nicht erhalten wurde«.'
  rationale: Der hebräische Satz ist gedrängt und umstritten. Die gewählte Form ergibt im poetischen Zusammenhang einen verständlichen Gegensatz zwischen den Wohlhabenden und den dem Tod Nahen, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die körperlichen Bilder des Niederwerfens, Niederkniens und Hinabsteigens zum Staub bleiben erhalten; erklärungsbedürftige Idiomatik und syntaktische Unsicherheit werden in den Fußnoten kenntlich gemacht.
