base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/030.yaml
  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: de
  text: Nachkommen werden ihm dienen; vom Herrn wird man der Generation erzählen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei anderer Zuordnung der Präpositionen: „Es wird dem Herrn für eine Generation zugerechnet/berichtet werden.“ Der knappe hebräische Wortlaut lässt die syntaktischen Bezüge offen.'
    reason: Kennzeichnet die reale syntaktische Unsicherheit des zweiten Halbverses, ohne die Hauptübersetzung zu überladen oder eine alternative Deutung als eindeutig auszugeben.
lexical_decisions:
- source_word: זֶרַע
  choice: Nachkommen
  rationale: Das kollektive Singularwort bedeutet wörtlich „Same“, bezeichnet hier aber natürlich die Nachkommenschaft; „Nachkommen“ bewahrt den kollektiven Sinn in verständlichem Deutsch.
- source_word: יַעַבְדֶנּוּ
  choice: werden ihm dienen
  rationale: Das Suffix bezeichnet „ihm“; das imperfektische Verb drückt im Kontext eine künftige bzw. fortdauernde Aussage aus.
- source_word: יְסֻפַּר
  choice: wird man erzählen
  rationale: Das Pual von ספר bedeutet „erzählt/berichtet werden“. Die unpersönliche deutsche Form gibt das Passiv natürlich wieder, ohne einen Erzähler hinzuzufügen.
- source_word: לַאדֹנָי
  choice: vom Herrn
  rationale: Die Präposition ל kann beim Verb ספר den Gegenstand des Berichtens bezeichnen; daher „vom Herrn“. Die masoretische Lesung אֲדֹנָי wird traditionsgemäß als „Herr“ wiedergegeben.
- source_word: לַדּוֹר
  choice: der kommenden Generation
  rationale: Wörtlich steht „der Generation“. Im Zusammenhang mit den Nachkommen ist die gemeinte spätere Generation impliziert; die Ergänzung „kommenden“ macht diesen Bezug im Deutschen deutlich.
theological_decisions:
- issue: Bezug von לַאדֹנָי
  choice: '„vom Herrn“: Der Herr ist Gegenstand der Verkündigung.'
  alternative: '„dem Herrn“: Die Generation bzw. Nachkommenschaft wird dem Herrn berichtet oder zugerechnet.'
  rationale: Die hebräische Konstruktion ist knapp und lässt mehrere syntaktische Bezüge zu. Im Parallelismus mit Vers 31 ist die Deutung als Bericht über Gottes Handeln besonders naheliegend, soll aber als textliche Mehrdeutigkeit kenntlich bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Sinn von זֶרַע wird idiomatisch mit „Nachkommen“ wiedergegeben; die knappe poetische Struktur und die Mehrdeutigkeit des zweiten Halbverses bleiben erhalten.
