source:
  edition: WLC
  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: de
  text: Von dir kommt mein Lob in der großen Versammlung; meine Gelübde werde ich vor denen erfüllen, die ihn fürchten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „die ihn fürchten“. Manche Übersetzungen gleichen das Pronomen an die vorausgehende direkte Anrede an und schreiben „die dich fürchten“.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: Von dir kommt
  rationale: Die Präposition mit dem Suffix der 2. Person Singular bezeichnet Herkunft oder Ursprung. Das im Deutschen ergänzte „kommt“ ergibt einen natürlichen Satz und bewahrt diesen Sinn.
- source_word: תְהִלָּתִי
  choice: mein Lob
  rationale: Das Substantiv bezeichnet Lob oder Lobpreis. „Mein Lob“ ist direkt und fügt keine im Wort selbst nicht ausdrücklich enthaltene Opferbedeutung hinzu.
- source_word: בְּקָהָל רָב
  choice: in der großen Versammlung
  rationale: קָהָל bezeichnet eine versammelte Gemeinschaft; רָב beschreibt sie als groß beziehungsweise zahlreich. „Versammlung“ ist verständlich und für den gottesdienstlichen Zusammenhang angemessen.
- source_word: נְדָרַי
  choice: meine Gelübde
  rationale: Der Plural bezeichnet Gott gegebene Versprechen. „Gelübde“ gibt den religiösen und verpflichtenden Charakter präzise wieder.
- source_word: אֲשַׁלֵּם
  choice: werde ich … erfüllen
  rationale: Im Piel bedeutet שׁלם unter anderem bezahlen oder erfüllen. In Verbindung mit Gelübden ist „erfüllen“ im modernen Deutschen natürlicher als „bezahlen“ und bezeichnet die Einlösung des Versprochenen.
- source_word: נֶגֶד
  choice: vor
  rationale: Die Präposition bezeichnet Gegenwart beziehungsweise Sichtbarkeit. „Vor“ ist knapp und idiomatisch.
- source_word: יְרֵאָיו
  choice: die ihn fürchten
  rationale: Die Form bezeichnet diejenigen, die ihn fürchten, mit einem Suffix der 3. Person Maskulin Singular. „Fürchten“ bewahrt die biblische Spannung zwischen Ehrfurcht und Gottesfurcht besser als eine abschwächende Umschreibung.
theological_decisions:
- issue: Wechsel von der direkten Anrede „dir“ zum Pronomen der dritten Person in „die ihn fürchten“
  choice: 'Der masoretische Wechsel bleibt erhalten: „Von dir … die ihn fürchten“.'
  alternative: 'Angleichung an die zweite Person: „die dich fürchten“.'
  rationale: Der hebräische Text wechselt ausdrücklich von der zweiten zur dritten Person. Dieser stilistische Wechsel wird nicht stillschweigend geglättet; im Zusammenhang bleibt Gott der Bezugspunkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am hebräischen Parallelismus; „Gelübde erfüllen“ ist gegenüber dem formal möglichen „Gelübde bezahlen“ im heutigen Deutsch natürlicher. Der Fußnotenmarker steht unmittelbar nach der betreffenden Wendung.
