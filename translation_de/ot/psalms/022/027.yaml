  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: de
  text: Alle Enden der Erde werden sich erinnern und zu Jahwe zurückkehren, und alle Familien der Völker werden sich vor dir niederwerfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden dich anbeten“. Das hebräische Verb bezeichnet wörtlich das Sich-Niederwerfen, häufig als Ausdruck der Anbetung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: werden sich erinnern
  rationale: Das Qal-Imperfekt von זכר hat hier voraussagende Kraft. „Sich erinnern“ gibt den hebräischen Ausdruck direkt und natürlich wieder, ohne ein ausdrücklich genanntes Objekt zu ergänzen.
- source_word: וְיָשֻׁבוּ
  choice: und … zurückkehren
  rationale: שוב mit אֶל bezeichnet eine Rückkehr oder Hinwendung zu jemandem. „Zurückkehren“ wahrt den Grundsinn und legt den Ausdruck nicht vorschnell ausschließlich als „bereuen“ aus.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bezeichnet die Richtung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: alle Enden der Erde
  rationale: Die Wendung bezeichnet die äußersten, fernsten Gebiete der Erde und bringt den weltweiten Umfang zum Ausdruck.
- source_word: וְיִשְׁתַּחֲווּ
  choice: werden sich … niederwerfen
  rationale: Das Verb bezeichnet das körperliche Sich-Niederwerfen als Huldigung oder Anbetung. Die konkrete Handlung bleibt erhalten, während der kultische Sinn nicht eingeengt wird.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Idiomatiche Wiedergabe von wörtlich „vor deinem Angesicht“; die direkte Anrede Gottes bleibt erhalten.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: alle Völkerfamilien
  rationale: מִשְׁפְּחוֹת meint Familien- oder Sippenverbände, גּוֹיִם die Völker. Das deutsche Kompositum ist prägnant und erhält beide Bestandteile.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וְיִשְׁתַּחֲווּ
  choice: sich niederwerfen
  alternative: anbeten
  rationale: Die konkrete Gebärde der Unterwerfung und Verehrung wird beibehalten; „anbeten“ wäre möglich, würde den Ausdruck aber stärker auf seine kultische Bedeutung festlegen.
- issue: Bedeutung von וְיָשֻׁבוּ אֶל יְהוָה
  choice: zu Jahwe zurückkehren
  alternative: sich Jahwe zuwenden / zu Jahwe umkehren
  rationale: „Zurückkehren“ erhält das Bewegungsbild und die mögliche geistliche Umkehr, ohne die Spannung dadurch aufzulösen, dass den Völkern ausdrücklich eine frühere Bundesbeziehung zugeschrieben oder „bereuen“ eingesetzt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Universalität und die direkte Anrede Gottes sind bewahrt. „Völkerfamilien“ ist kompakt und verständlich; „sich niederwerfen“ erhält das körperliche Bild des Hebräischen.
