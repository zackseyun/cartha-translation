  text: לַ֭/מְנַצֵּחַ עַל אַיֶּ֥לֶת הַ/שַּׁ֗חַר מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/000.yaml
  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: de
  text: Für den Chorleiter. Nach »Die Hirschkuh der Morgenröte«[a]. Ein Psalm Davids[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Hirschkuh der Morgenröte«. Der hebräische Ausdruck bezeichnet wahrscheinlich eine Melodie oder musikalische Vorgabe.'
    reason: lexical_alternative
  - marker: b
    text: »Davids« kann Verfasserschaft, Zugehörigkeit, Zuordnung zu einer Sammlung oder Widmung bezeichnen; das Hebräische legt sich nicht genauer fest.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck den musikalischen Leiter. »Chorleiter« ist im Deutschen knapp und verständlich; »für« gibt die Zuordnung der Überschrift natürlich wieder.
- source_word: עַל
  choice: Nach
  rationale: In musikalischen Überschriften kann עַל eine Melodie, Vortragsweise oder musikalische Vorgabe einführen. »Nach« ist idiomatisch und lässt die genaue Art der Angabe offen.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: »Die Hirschkuh der Morgenröte«
  rationale: Der Ausdruck benennt wahrscheinlich eine Melodie oder musikalische Vorgabe. »Hirschkuh« bildet das feminine Singularwort präzise und in würdigem, noch verständlichem Deutsch ab; Anführungszeichen kennzeichnen den Titelcharakter.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר bezeichnet ein musikalisch vorgetragenes Lied beziehungsweise einen Psalm. Die traditionelle Wiedergabe »Psalm« ist klar und sachgerecht.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die deutsche Genitivform bewahrt die breite Zuordnung zu David, ohne ausdrücklich nur Verfasserschaft, Widmung oder Sammlungszugehörigkeit festzulegen.
theological_decisions:
- issue: Deutung von אַיֶּלֶת הַשַּׁחַר
  choice: Als Titel einer Melodie oder musikalischen Vorgabe wiedergegeben
  alternative: Als symbolische oder thematische Überschrift des Psalms verstanden
  rationale: Die durch עַל eingeleitete Wendung erfüllt im Zusammenhang der Psalmüberschriften am ehesten eine musikalische Funktion. Die Übersetzung als Titel vermeidet eine nicht ausdrücklich markierte symbolische Deutung.
- issue: Bedeutung von לְדָוִד
  choice: Breite Zuordnung durch »Davids«
  alternative: Eindeutig als Verfasserangabe »von David« oder als Widmung »für David«
  rationale: Die hebräische Präposition לְ kann in Psalmüberschriften mehrere Beziehungen ausdrücken. Der deutsche Genitiv lässt diese Spannung bestehen und behauptet keine engere Bestimmung, als der Ausgangstext erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer Psalmüberschrift bleibt erhalten. Die Titelsetzung durch deutsche Anführungszeichen macht die wahrscheinliche musikalische Bezeichnung erkennbar, während die Fußnote die verbleibende Unsicherheit offenlegt.
