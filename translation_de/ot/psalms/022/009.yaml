  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: de
  text: Denn du hast mich aus dem Mutterleib hervorgebracht und mir an der Brust meiner Mutter Geborgenheit gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du hast mich an der Brust meiner Mutter vertrauen lassen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung im Gedankengang des Psalms ein und entspricht hier natürlichem, gehobenem Deutsch.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und betont Gott als den Handelnden.
- source_word: גֹחִי
  choice: hast mich … hervorgeholt
  rationale: Das Partizip mit Objektsuffix bezeichnet im Geburtskontext den, der den Beter aus dem Mutterleib hervorkommen ließ; die verbale Wiedergabe ist im Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: מִבָּטֶן
  choice: aus dem Mutterleib
  rationale: Gibt Präposition und Substantiv im Geburtskontext präzise und idiomatisch wieder.
- source_word: מַבְטִיחִי
  choice: hast mich … geborgen sein lassen
  rationale: Die Hifil-Form von בטח kann das Verleihen von Sicherheit oder Vertrauen ausdrücken. Im Blick auf den Säugling stellt „geborgen sein lassen“ Gottes fürsorglich gewährte Sicherheit dar, ohne bewusstes Vertrauen zwingend vorauszusetzen.
- source_word: עַל שְׁדֵי אִמִּי
  choice: an der Brust meiner Mutter
  rationale: Natürliches deutsches Bild für die Situation des gestillten Säuglings; der hebräische Plural wird idiomatisch als kollektiver Singular wiedergegeben.
theological_decisions:
- issue: Ob מַבְטִיחִי ausdrückliches Vertrauen des Säuglings oder umfassendere Geborgenheit bezeichnet
  choice: du hast mich … geborgen sein lassen
  alternative: du hast mich … vertrauen lassen
  rationale: Der Kontext schildert Gottes Fürsorge von der Geburt an. „Geborgen sein lassen“ wahrt den Sicherheitsaspekt, ohne eine Aussage über bewusst vollzogenes Vertrauen im Säuglingsalter festzulegen. Die lexikalisch mögliche Vertrauensdeutung bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mutterleib“ bewahrt das konkrete Geburtsbild; „an der Brust meiner Mutter“ ist verständlich und nicht euphemistisch. Die semantische Spannung zwischen Sicherheit und Vertrauen wird durch die Hauptfassung und die Fußnote erhalten.
