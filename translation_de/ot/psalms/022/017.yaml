  text: Ich kann alle meine Knochen zählen[a]; sie blicken hin, sie sehen mich an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich zähle alle meine Knochen.“ Das hebräische Verb kann „zählen“ oder „aufzählen“ bedeuten; bei „alle meine Knochen“ liegt das Zählen der einzelnen Knochen nahe.'
    reason: lexical_alternative
  - marker: b
