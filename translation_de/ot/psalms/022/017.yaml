lexical_decisions:
- source_word: אֲסַפֵּר
  choice: Ich kann … zählen
  rationale: Das Piel von ספר kann „zählen“ oder „erzählen/aufzählen“ bedeuten. Mit „alle meine Knochen“ als Objekt liegt das einzelne Zählen nahe; „kann zählen“ gibt die idiomatische Aussage natürlicher wieder als das bloße Präsens.
- source_word: כָּל
  choice: alle
  rationale: Bewahrt die im Hebräischen ausgedrückte Gesamtheit.
- source_word: עַצְמוֹתַי
  choice: meine Knochen
  rationale: Die wörtliche, bildkräftige Wiedergabe lässt die körperliche Auszehrung oder Entblößung erkennen, ohne sie erklärend in den Text einzutragen.
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen bezeichnet betont die zuschauenden Personen. Im Deutschen genügt das ausdrücklich gesetzte Subjekt „sie“.
- source_word: יַבִּיטוּ
  choice: schauen
  rationale: Das Verb bezeichnet aufmerksames Hinblicken. „Schauen“ ist gegenwärtig und natürlich; das folgende Verb steigert die Aussage.
- source_word: יִרְאוּ
  choice: starren
  rationale: Die Paarung zweier Verben des Sehens erzeugt Nachdruck. „Starren“ bringt den anhaltenden, feindselig wirkenden Blick zum Ausdruck, ohne die Doppelung einzuebnen.
- source_word: בִי
  choice: mich an
  rationale: Bei „anschauen“ und „anstarren“ ist dies die natürliche deutsche Wiedergabe der auf den Sprecher gerichteten Wahrnehmung.
theological_decisions:
- issue: Messianische Auslegung in der christlichen Tradition
  choice: Der Vers wird nach seinem hebräischen poetischen Sinn als Klage über sichtbares körperliches Leiden und beobachtende Menschen übersetzt.
  alternative: Eine stärker traditionsgeprägte Wiedergabe könnte den christologischen Bezug durch kreuzigungsspezifische Formulierungen hervorheben.
  rationale: Psalm 22 besitzt große Bedeutung für die christliche Auslegung. Diese Zeile selbst enthält jedoch keine kreuzigungsspezifische Formulierung; mögliche kanonische und christologische Bezüge sollen aus dem Zusammenhang hervorgehen und nicht durch Zusätze in die Übersetzung gelangen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem hebräischem Parallelismus. Die Wiederholung „sie schauen, sie starren“ bildet die nachdrückliche Verbpa arung ab; die Semikolon-Gliederung erhält die zwei poetischen Aussagen.
