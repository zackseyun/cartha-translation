  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: de
  text: Denn Hunde haben mich umringt, eine Schar von Übeltätern hat mich umzingelt; wie ein Löwe – meine Hände und meine Füße.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der masoretische Text lautet hier syntaktisch schwierig: „wie ein Löwe – meine Hände und meine Füße“. Eine Schriftrolle aus der judäischen Wüste und die Septuaginta bezeugen eine abweichende Lesart, die mit „Sie haben meine Hände und meine Füße durchbohrt“ oder „durchgraben“ wiedergegeben werden kann.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet hier die Begründung beziehungsweise Erläuterung der Klage ein und bewahrt den Zusammenhang mit den vorausgehenden Versen.
- source_word: סְבָבוּנִי
  choice: haben mich umringt
  rationale: Gibt das feindliche Umschließen durch סבב natürlich wieder; das Perfekt wird mit gegenwärtiger Folgewirkung ausgedrückt.
- source_word: כְּלָבִים
  choice: Hunde
  rationale: Bewahrt das wörtliche, im Kontext bildhaft auf feindliche und verachtete Angreifer bezogene Motiv.
- source_word: עֲדַת מְרֵעִים
  choice: eine Schar von Übeltätern
  rationale: עֵדָה bezeichnet eine versammelte Gruppe; מְרֵעִים sind Menschen, die Böses tun. „Schar“ klingt im modernen Deutschen natürlich und hält das feindliche Kollektivbild fest.
- source_word: הִקִּיפוּנִי
  choice: hat mich umzingelt
  rationale: Gibt das ringsum Einschließen wieder und unterscheidet sich im Deutschen leicht vom parallelen „umringt“, ohne den Sinn zu verändern.
- source_word: כָּאֲרִי
  choice: wie ein Löwe
  rationale: Folgt dem vokalisierten masoretischen Text. Dessen elliptische und syntaktisch schwierige Formulierung wird nicht durch eine eindeutige Handlung ergänzt.
- source_word: יָדַי וְרַגְלָי
  choice: meine Hände und meine Füße
  rationale: Gibt beide Körperteile samt jeweiligem Possessivsuffix ausdrücklich wieder. Die Wiederholung von „meine“ entspricht der hebräischen Form und klingt im Deutschen würdevoll.
theological_decisions:
- issue: Textkritisch umstrittene Lesart כָּאֲרִי gegenüber einer alten Lesart mit der Bedeutung „sie gruben/durchbohrten“
  choice: Der Haupttext folgt der masoretischen Lesart „wie ein Löwe“ und lässt ihre schwierige Syntax durch den Gedankenstrich erkennbar.
  alternative: „Sie haben meine Hände und meine Füße durchbohrt“ beziehungsweise „durchgraben“.
  rationale: Die überlieferte masoretische Lesart soll nicht stillschweigend durch eine glattere, in christlicher Auslegung bedeutsame Lesart ersetzt werden. Die alte und textkritisch gewichtige Alternative wird jedoch ausdrücklich in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Tiermetapher und der Parallelismus bleiben erhalten. Der Gedankenstrich signalisiert bewusst die abrupte, syntaktisch schwierige Gestalt des masoretischen Schlussglieds, ohne ein nicht ausdrücklich vorhandenes Verb oder Subjekt einzufügen.
