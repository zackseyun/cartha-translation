source:
  edition: WLC
  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: de
  text: Doch ich bin ein Wurm und kein Mensch, von den Menschen verhöhnt und vom Volk verachtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: Doch ich
  rationale: Das betonte Pronomen אָנֹכִי wird mit „ich“ wiedergegeben; וְ markiert im Zusammenhang den scharfen Gegensatz zum zuvor ausgedrückten Vertrauen, wofür „Doch“ im Deutschen natürlich ist.
- source_word: תוֹלַעַת
  choice: ein Wurm
  rationale: Das Substantiv bezeichnet einen Wurm beziehungsweise eine Larve und dient hier als Bild äußerster Erniedrigung. „Ein Wurm“ bewahrt das Bild, ohne die Art näher zu bestimmen.
- source_word: וְ/לֹא אִישׁ
  choice: und kein Mensch
  rationale: Die Wendung bestreitet in zugespitzter Weise menschliche Würde oder Anerkennung. „Kein Mensch“ ist im Deutschen idiomatischer als „nicht ein Mann“ und bewahrt den Gegensatz zum Wurm.
- source_word: חֶרְפַּת אָדָם
  choice: von den Menschen verhöhnt
  rationale: חֶרְפָּה bezeichnet Schmach, Hohn oder einen Gegenstand des Hohns; אָדָם ist hier kollektiv zu verstehen. Die verbale Wiedergabe drückt natürlich aus, dass der Sprecher dem Hohn der Menschen ausgesetzt ist.
- source_word: וּ/בְזוּי
  choice: und … verachtet
  rationale: Das passive Partizip bezeichnet jemanden, der verachtet oder geringgeschätzt wird. „Verachtet“ ist knapp und bewahrt das emotionale Gewicht.
- source_word: עָם
  choice: vom Volk
  rationale: עָם bezeichnet ein Volk beziehungsweise die Volksgemeinschaft. Der bestimmte kollektive Ausdruck „vom Volk“ erhält den Parallelismus mit „von den Menschen“.
theological_decisions:
- issue: Messianische beziehungsweise typologische Auslegung im christlichen Kanon
  choice: Der Vers wird gemäß seinem hebräischen poetischen Sinn als Ausdruck tiefster Erniedrigung übersetzt, ohne ausdrücklich christologische Zusätze einzufügen.
  alternative: Eine interpretierende Formulierung, die eine christologische Erfüllung bereits im Wortlaut hervorhebt.
  rationale: Psalm 22 besitzt im Neuen Testament und in der christlichen Auslegung messianische Bedeutung. Der hebräische Vers selbst spricht jedoch in der Stimme des Psalmbeters und verwendet ein Bild der Erniedrigung; kanonische Bezüge sollen aus dem Zusammenhang hervorgehen und nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. „Kein Mensch“ gibt אִישׁ kontextgerecht wieder; „von den Menschen verhöhnt“ ist eine idiomatische, leicht interpretierende Entfaltung der hebräischen Konstruktverbindung חֶרְפַּת אָדָם.
