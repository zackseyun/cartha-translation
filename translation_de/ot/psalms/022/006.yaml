  source_fidelity: 'Der deutsche Text gibt die hebräischen Bilder und die poetische Aussage zuverlässig wieder: אָנֹכִי ist angemessen hervorgehoben, תוֹלַעַת als „Wurm“, die zugespitzte Negation von אִישׁ als „kein Mensch“, und die beiden Ausdrücke öffentlicher Verachtung werden ohne sachliche Erweiterung wiedergegeben. „Von den Menschen verhöhnt“ ist eine idiomatische verbale Entfaltung von חֶרְפַּת אָדָם und wahrt dessen Sinn als Hohn bzw. Schmach durch Menschen.'
  naturalness: „Doch ich bin ein Wurm und kein Mensch, von den Menschen verhöhnt und vom Volk verachtet“ ist flüssiges, würdevolles modernes Standarddeutsch. Die parallelen Passivgruppen funktionieren poetisch und sind klar verständlich.
  terminology: „Mensch“ vermeidet eine unnötig männliche Verengung von אִישׁ im vorliegenden Bildzusammenhang. „Menschen“ für אָדָם und „Volk“ für עָם erhalten die absichtliche Steigerung bzw. Parallelität der beiden hebräischen Ausdrücke. Es werden keine christologischen oder sonstigen interpretativen Zusätze in den Vers eingetragen.
