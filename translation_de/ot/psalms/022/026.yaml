source:
  edition: WLC
  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: de
  text: Die Gebeugten[a] werden essen und satt werden[b]; die ihn suchen, werden Jahwe loben. Euer Herz[c] lebe für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Demütigen«, »die Armen«, »die Elenden« oder »die Sanftmütigen«.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang des Psalms könnte das Essen auf ein gemeinschaftliches Opfer- oder Gelübdemahl anspielen; ausdrücklich gesagt wird das hier jedoch nicht.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich steht »euer Herz«: »Herz« ist Einzahl, die angesprochenen Personen sind Mehrzahl. Gemeint ist ihr inneres Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: die Gebeugten
  rationale: Der Ausdruck kann Menschen bezeichnen, die elend, arm, demütig oder bedrängt sind. »Die Gebeugten« bewahrt sowohl die Erfahrung des Erniedrigtseins als auch den möglichen Anklang von Demut, ohne den Sinn auf eine bloße innere Haltung zu verengen.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: werden essen und satt werden
  rationale: Die Imperfektformen beschreiben hier passend die erwartete Folge der Rettung. »Satt werden« gibt die leibliche Sättigung natürlich und konkret wieder.
- source_word: יְהַלְלוּ
  choice: werden … loben
  rationale: Die Piel-Form bezeichnet das ausdrückliche Loben Gottes; die Zukunftsform fügt sich in den Zusammenhang der angekündigten Antwort auf Gottes Rettung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: דֹּרְשָׁיו
  choice: die ihn suchen
  rationale: Die substantivisch gebrauchte Partizipialform bezeichnet Menschen, deren fortdauernde Ausrichtung auf Gott durch das Suchen nach ihm geprägt ist. Das Pronomen bezieht sich auf Jahwe.
- source_word: יְחִי
  choice: lebe
  rationale: Die Form ist hier am besten als Wunsch beziehungsweise Segensspruch zu verstehen. Der deutsche Konjunktiv »lebe« gibt diesen jussivischen Sinn knapp und würdig wieder.
- source_word: לְבַבְכֶם
  choice: euer Herz
  rationale: Das Substantiv »Herz« steht im Hebräischen im Singular, während das Suffix mehrere Angesprochene bezeichnet. Die kollektive Einzahl bleibt erhalten und bezeichnet ihr gemeinsames beziehungsweise je eigenes inneres Leben.
- source_word: לָעַד
  choice: für immer
  rationale: Dies ist eine klare, heutige Wiedergabe der unbegrenzten beziehungsweise dauerhaften Zeitangabe.
theological_decisions:
- issue: Bedeutung von עֲנָוִים
  choice: Die Gebeugten
  alternative: Die Demütigen; die Armen; die Elenden; die Sanftmütigen
  rationale: Der Zusammenhang führt von Leiden zu Rettung und gemeinschaftlichem Lob. »Die Gebeugten« hält die soziale und leidvolle Lage im Blick, ohne den ebenfalls möglichen Aspekt der Demut auszuschließen.
- issue: Art des Essens
  choice: Das Essen und Sattwerden wird ohne nähere Bestimmung wiedergegeben.
  alternative: Ausdrückliche Bezeichnung als Opfer- oder Gelübdemahl
  rationale: Der weitere Psalmzusammenhang kann an ein gemeinschaftliches Opfer- oder Gelübdemahl denken lassen, doch dieser Vers nennt ein solches Mahl nicht ausdrücklich.
- issue: Adressatenwechsel und kollektiver Singular im Schlusssatz
  choice: »Euer Herz lebe für immer« als direkter Segenswunsch an die zuvor genannten Gott Suchenden
  alternative: »Eure Herzen mögen für immer leben«; »Ihr Herz wird für immer leben«
  rationale: Das hebräische Suffix ist zweite Person Plural, während »Herz« im Singular steht. Die direkte Anrede und der kollektive Singular werden bewahrt; die Aussage wird als Wunsch verstanden, nicht als bloße Feststellung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallelen Zukunftsaussagen bleiben erhalten; der abschließende Segenswunsch wird mit dem knappen Konjunktiv »lebe« wiedergegeben. Der Gottesname erscheint in der im Deutschen üblichen Form »Jahwe«.
