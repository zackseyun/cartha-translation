source:
  edition: WLC
  text: סְ֭בָבוּ/נִי פָּרִ֣ים רַבִּ֑ים אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/012.yaml
  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: de
  text: Viele Stiere umringen mich[a], mächtige Stiere aus Baschan umzingeln mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baschan war eine fruchtbare Landschaft östlich des Jordan, die für kräftige, gut genährte Rinder bekannt war. Das Bild steht für mächtige und bedrohliche Gegner.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: umringen mich
  rationale: Das Verb סבב bezeichnet das Umgeben oder Umschließen. Das Präsens macht die Bedrohung im Deutschen unmittelbar; „umringen“ bewahrt zugleich das Bild des bereits Eingeschlossenseins.
- source_word: פָּרִים
  choice: Stiere
  rationale: Der Plural von פַּר bezeichnet Stiere beziehungsweise junge Stiere. „Stiere“ ist im Deutschen natürlich und erhält das bedrohliche Tierbild.
- source_word: רַבִּים
  choice: viele
  rationale: Das Adjektiv bezeichnet eine große Anzahl und wird direkt und idiomatisch mit „viele“ wiedergegeben.
- source_word: אַבִּירֵי
  choice: mächtige Stiere
  rationale: אַבִּיר bezeichnet Starke oder Mächtige und kann im Zusammenhang auch kräftige Tiere meinen. Die Wiederaufnahme von „Stiere“ hält das Rinderbild ausdrücklich fest.
- source_word: בָשָׁן
  choice: Baschan
  rationale: Der geografische Eigenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: כִּתְּרוּנִי
  choice: umzingeln mich
  rationale: Das Verb כתר bedeutet hier umgeben oder einkreisen. „Umzingeln“ wahrt den Parallelismus, ohne das erste Verb identisch zu wiederholen, und vermittelt die feindliche Bedrohung.
theological_decisions:
- issue: Tiermetapher für feindliche Gegner
  choice: Die Gegner werden im Haupttext unmittelbar als „Stiere“ bezeichnet.
  alternative: Die Metapher deutend als „Feinde“ wiederzugeben.
  rationale: Der hebräische Text lässt die Gegner in einem eindringlichen Tierbild erscheinen. Die direkte Wiedergabe erhält die poetische Kraft und legt die Deutung nicht stärker fest als der Ausgangstext.
- issue: Bezug von אַבִּירֵי בָשָׁן
  choice: „mächtige Stiere aus Baschan“
  alternative: „die Mächtigen Baschans“
  rationale: Der vorangehende Ausdruck „viele Stiere“ legt nahe, אַבִּירֵי weiterhin innerhalb desselben Tierbildes zu verstehen. Die grundsätzlich mögliche allgemeinere Bedeutung „Mächtige“ wird durch den Kontext zugunsten der bovinen Bildsprache eingegrenzt.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallelen Verben „umringen“ und „umzingeln“ geben die beiden unterschiedlichen hebräischen Verben wieder; die Wiederholung von „mich“ bewahrt den eindringlichen Parallelismus.
