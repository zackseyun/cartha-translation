  text: גֹּ֣ל אֶל יְהוָ֣ה יְפַלְּטֵ֑/הוּ יַ֝צִּילֵ֗/הוּ כִּ֘י חָ֥פֵֽץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: de
  text: „Vertrau dich Jahwe an![a] Er soll ihn retten, ihn befreien, denn er hat Gefallen an ihm!“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wälze (es) zu Jahwe!“ Das nicht genannte Objekt wird idiomatisch als die eigene Person oder Sache verstanden: Man vertraut sich selbst oder seine Sache Jahwe an.'
    reason: Die Fußnote bewahrt das konkrete Bild von גֹּל, kennzeichnet das im Hebräischen nicht ausgedrückte Objekt und erklärt die idiomatische Bedeutung.
lexical_decisions:
- source_word: גֹּל אֶל
  choice: Vertrau dich … an
  rationale: גֹּל bedeutet wörtlich „wälze“, bildet hier aber mit אֶל eine bildhafte Aufforderung, sich beziehungsweise die eigene Sache Gott anzuvertrauen. Die reflexive Form gibt den unbezeichneten Gegenstand des hebräischen Imperativs im Deutschen natürlich wieder, ohne die anschließenden Pronomen umzudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: יְפַלְּטֵהוּ
  choice: Er soll ihn retten
  rationale: Das Piel von פלט bezeichnet hier das Herbeiführen von Entrinnen, also Rettung. Die jussivische Nuance passt im spöttischen Zuruf zu „soll“.
- source_word: יַצִּילֵהוּ
  choice: ihn befreien
  rationale: Das Hiphil von נצל bedeutet herausreißen, befreien oder erretten. „Befreien“ wahrt den poetischen Parallelismus, ohne beide Verben gleich zu übersetzen.
- source_word: כִּי חָפֵץ בּוֹ
  choice: denn er hat Gefallen an ihm
  rationale: כִּי ist kausal; חפץ ב bezeichnet Wohlgefallen beziehungsweise Freude an einer Person. Die Formulierung ist im modernen Deutschen klar und würdevoll.
theological_decisions:
- issue: Wechsel von der zweiten zur dritten Person im Spottzitat
  choice: Die eröffnende Aufforderung richtet sich direkt an den Leidenden („Vertrau dich … an“); danach wird in der dritten Person über ihn gesprochen („ihn“).
  alternative: 'Den ersten Imperativ durch ein ergänztes Objekt ebenfalls in die dritte Person ziehen: „Vertraut ihn Jahwe an.“'
  rationale: גֹּל ist ein maskuliner Singularimperativ ohne ausdrückliches Objekt, während die folgenden Verben Suffixe der dritten Person Singular tragen. Der auffällige Personenwechsel gehört zum hebräischen Wortlaut und zur lebhaften Spottrede und sollte nicht durch ein unbelegtes Objekt eingeebnet werden.
- issue: Bezug von „er“ und „ihm“ im letzten Satzteil
  choice: Die Pronomen bleiben stehen; im Zusammenhang ist Jahwe das Subjekt und der Leidende das Objekt des Wohlgefallens.
  alternative: 'Explizit formulieren: „denn Jahwe hat Gefallen an ihm.“'
  rationale: Die pronominale Gestalt des hebräischen Textes wird bewahrt. Der Satzbau macht den naheliegenden Bezug hinreichend deutlich, ohne den Gottesnamen zu wiederholen.
translation_notes:
  register: Direkte, spöttische Rede in natürlichem modernem Standarddeutsch. „Jahwe“ wahrt den Gottesnamen; „hat Gefallen an“ ist würdevoll, aber allgemein verständlich. Der abrupte Wechsel von direkter Anrede zu dritter Person bleibt als rhetorisches Merkmal erhalten.
