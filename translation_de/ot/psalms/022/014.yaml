base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: de
  text: Wie Wasser bin ich ausgeschüttet, und alle meine Knochen haben sich voneinander gelöst. Mein Herz ist wie Wachs geworden und in meinem Innern zerschmolzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »inmitten meiner Eingeweide«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: wie Wasser
  rationale: Die Präposition כְּ kennzeichnet einen Vergleich; »wie Wasser« gibt das Bild unmittelbar und idiomatisch wieder.
- source_word: נִשְׁפַּכְתִּי
  choice: bin ich ausgeschüttet
  rationale: Das Nifal von שׁפך beschreibt den Sprecher als ausgegossen beziehungsweise völlig entkräftet; das Passiv bewahrt die Bildsprache.
- source_word: וְהִתְפָּרְדוּ
  choice: haben sich voneinander gelöst
  rationale: Das Hitpael von פרד bezeichnet ein Auseinandergehen oder Sich-Trennen. Die Formulierung bewahrt diese Bedeutung, ohne die im Hebräischen nicht ausdrücklich genannten Gelenke einzuführen.
- source_word: כָּל עַצְמוֹתַי
  choice: alle meine Knochen
  rationale: Die konkrete Körpermetapher und die durch כָּל ausgedrückte Gesamtheit werden direkt wiedergegeben.
- source_word: הָיָה לִבִּי
  choice: Mein Herz ist … geworden
  rationale: Die Wendung bezeichnet hier einen eingetretenen Zustand; das Perfekt klingt im Deutschen natürlich und hält den Übergang fest.
- source_word: כַּדּוֹנָג
  choice: wie Wachs
  rationale: Der direkte Vergleich wird unverändert bewahrt.
- source_word: נָמֵס
  choice: zerschmolzen
  rationale: Das Wort bezeichnet Schmelzen oder Zerfließen und führt das Bild des Wachses konsequent fort.
- source_word: בְּתוֹךְ מֵעָי
  choice: in meinem Innern
  rationale: מֵעִים bezeichnet wörtlich die inneren Organe beziehungsweise Eingeweide. »In meinem Innern« ist im modernen Deutschen natürlich, ohne die körperlich-viszerale Dimension völlig zu vergeistigen; die wörtlichere Fassung steht in der Fußnote.
theological_decisions:
- issue: Körperlicher Ausdruck innerer Not
  choice: in meinem Innern
  alternative: inmitten meiner Eingeweide
  rationale: Der Haupttext verwendet eine verständliche deutsche Wendung, während die Fußnote die konkrete anthropologische Bildsprache des Hebräischen sichtbar hält. So wird die Aussage weder rein psychologisch noch rein geistlich verengt.
translation_notes:
  register: Moderne, würdige deutsche Psalmsprache. Die parallelen körperlichen Bilder bleiben konkret; erklärende Zusätze wie »aus den Gelenken« werden vermieden, da sie den hebräischen Wortlaut stärker festlegen würden.
