base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: de
  text: 'Sie werden kommen und einem Volk, das noch geboren wird[b], seine Gerechtigkeit[a] verkünden: Er hat es getan[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Recht“. Das hebräische Wort kann Gerechtigkeit in einem umfassenden Sinn bezeichnen, einschließlich gerechten und rettenden Handelns.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „das geboren wird“. Gemeint ist im Zusammenhang eine künftige Generation.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Denn er hat es getan“. Die knappe hebräische Schlussklausel kann entweder den Inhalt der Verkündigung oder deren Grund angeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: Sie werden kommen
  rationale: Das Qal-Imperfekt 3. Person Plural von בוא weist hier auf zukünftiges Handeln; die Formulierung ist im modernen Deutsch natürlich und bewahrt den vorausblickenden Sinn.
- source_word: וְיַגִּידוּ
  choice: und … verkünden
  rationale: Das Hifil-Imperfekt von נגד bezeichnet das Bekanntmachen oder öffentliche Kundtun. „Verkünden“ entspricht dem feierlichen, zeugnishaften Ton des Psalms.
- source_word: צִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: צדקה kann sowohl Gerechtigkeit im umfassenden Sinn als auch Gottes gerechtes, rettendes Handeln bezeichnen. „Gerechtigkeit“ wahrt diese Bedeutungsbreite; „Recht“ wird als mögliche Alternative in der Fußnote genannt.
- source_word: לְעַם
  choice: einem Volk
  rationale: לְ kennzeichnet den Empfänger der Verkündigung. Da עַם ohne Artikel steht, ist die unbestimmte Wiedergabe „einem Volk“ angemessen.
- source_word: נוֹלָד
  choice: das noch geboren werden wird
  rationale: Das passive Partizip von ילד bestimmt „Volk“ näher. Im zukunftsgerichteten Zusammenhang bezeichnet es ein künftig entstehendes Volk beziehungsweise eine kommende Generation.
- source_word: כִּי
  choice: dass
  rationale: כִּי kann hier den Inhalt der Verkündigung einleiten. Die ebenfalls mögliche kausale Deutung „denn“ bleibt in einer Fußnote erhalten.
- source_word: עָשָׂה
  choice: er es getan hat
  rationale: Das Qal-Perfekt von עשה bedeutet „tun/machen“. Das Hebräische nennt kein ausdrückliches Objekt; das im Deutschen ergänzte „es“ bewahrt die knappe, abschließende Wirkung, ohne den Inhalt näher festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von צִדְקָתוֹ
  choice: Im Haupttext „seine Gerechtigkeit“
  alternative: „sein Recht“ beziehungsweise ausdrücklich „seine rettende Gerechtigkeit“
  rationale: Der Ausdruck kann Gottes Gerechtigkeit allgemein und zugleich sein gerechtes, rettendes Handeln umfassen. Der Haupttext engt diese theologische Bedeutungsbreite nicht ein.
- issue: Funktion der Schlussklausel כִּי עָשָׂה
  choice: 'Als Inhalt der Verkündigung: „dass er es getan hat“'
  alternative: 'Kausal: „denn er hat es getan“'
  rationale: Die knappe Klausel lässt sich als Inhalt dessen verstehen, was dem künftigen Volk verkündet wird; eine kausale Anknüpfung ist jedoch grammatisch möglich und wird deshalb in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt den Empfänger der Verkündigung klar heraus; der Gedankenstrich erhält die knappe, klimaktische Schlusswirkung des Hebräischen. Alle echten lexikalischen und syntaktischen Mehrdeutigkeiten werden im Haupttext beziehungsweise in den Fußnoten bewahrt.
