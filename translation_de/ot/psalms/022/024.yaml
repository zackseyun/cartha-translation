revisions:
- from: Denn er hat das Elend des Bedrängten[a] weder verachtet noch verabscheut. Er hat sein Angesicht nicht vor ihm verborgen; als er zu ihm um Hilfe schrie, hörte er.
  to: Denn er hat das Elend des Bedrängten[a] weder verachtet noch verabscheut. Er hat sein Angesicht nicht vor ihm verborgen; als der Bedrängte zu ihm schrie, hörte er ihn.
  rationale: Die Wiederholung von „der Bedrängte“ und das explizite Objekt „ihn“ beseitigen die im Deutschen störende Pronominalmehrdeutigkeit. Sie machen lediglich die im hebräischen Kontext und in der Satzstruktur vorhandenen Referenten sichtbar, ohne Gott namentlich einzusetzen oder aus „hörte“ ein stärkeres „erhörte“ zu machen. Der übrige Text und die Fußnote bleiben unverändert.
