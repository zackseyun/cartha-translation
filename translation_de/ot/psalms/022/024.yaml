    issue: Mehrdeutige Pronomina im Schlusssatz
    rationale: In „als er zu ihm um Hilfe schrie, hörte er“ kann deutschsprachig nicht ohne Weiteres erkannt werden, dass zuerst der Bedrängte ruft und anschließend Gott hört. Der hebräische Parallelismus enthält denselben Referentenwechsel, doch die deutsche Fassung kann ihn ohne Bedeutungszusatz klarer markieren.
