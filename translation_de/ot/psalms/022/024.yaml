  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: de
  text: Denn er hat das Elend des Bedrängten[a] weder verachtet noch verabscheut. Er hat sein Angesicht nicht vor ihm verborgen; als der Bedrängte zu ihm schrie, hörte er ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Not des Armen“ oder „die Erniedrigung des Bedrängten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָזָה
  choice: verachtet
  rationale: Das Verb bezeichnet geringschätzige Behandlung; „verachtet“ ist im modernen Deutschen natürlich und bildet mit dem stärkeren folgenden Verb eine passende Steigerung.
- source_word: שִׁקַּץ
  choice: verabscheut
  rationale: Das Verb ist stärker als בָזָה und bezeichnet Abscheu vor etwas als widerwärtig; „verabscheut“ bewahrt diese Intensivierung.
- source_word: עֱנוּת
  choice: Elend
  rationale: Das seltene Substantiv bezeichnet einen Zustand von Leiden, Bedrückung oder Erniedrigung. „Elend“ ist verständlich, würdig und lässt die genaue Art der Not offen.
- source_word: עָנִי
  choice: des Bedrängten
  rationale: Das Wort kann arm, elend, demütig oder bedrängt bezeichnen. Im Leidenskontext des Psalms gibt „Bedrängter“ den weiteren Sinn wieder, ohne ihn auf wirtschaftliche Armut zu beschränken.
- source_word: הִסְתִּיר פָּנָיו
  choice: sein Angesicht ... verborgen
  rationale: Die hebräische Bildrede für das Vorenthalten von Zuwendung oder Gegenwart bleibt erhalten und ist im Deutschen verständlich.
- source_word: מִמֶּנּוּ
  choice: vor ihm
  rationale: Die Präposition ist in Verbindung mit „das Angesicht verbergen“ im Deutschen idiomatisch mit „vor“ wiederzugeben; das Pronomen verweist auf den einzelnen Bedrängten zurück.
- source_word: בְשַׁוְּעוֹ
  choice: als er ... um Hilfe schrie
  rationale: Die Form bezeichnet seinen dringenden Hilferuf. Die Wiedergabe macht den Zweck des Schreiens deutlich, ohne eine göttliche Antwort zusätzlich in den Ausdruck hineinzulesen.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das Pronomen bezieht sich im Kontext auf Gott. Die Übersetzung bewahrt die pronominale Form, statt einen im Vers nicht ausdrücklich stehenden Gottesnamen einzusetzen.
- source_word: שָׁמֵעַ
  choice: hörte er
  rationale: Das Verb bedeutet grundlegend „hören“. Diese Wiedergabe vermeidet die interpretierende Erweiterung „erhörte“ oder „antwortete“.
theological_decisions:
- issue: Bezug des Bedrängten
  choice: Der Singular bezeichnet den Bedrängten und passt sowohl zur unmittelbaren Erfahrung des Psalmisten als auch zu einer allgemeineren Aussage über Gottes Zuwendung.
  alternative: Ausschließlich messianischer Bezug oder ausschließlich allgemeine Aussage über jeden Armen.
  rationale: Die Übersetzung erhält den Singular und legt den Vers weder ausschließlich messianisch noch ausschließlich allgemein aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ bewahrt bewusst die biblische Bildsprache; Satzbau und übriger Wortschatz bleiben allgemein verständlich.
