  text: פָּצ֣וּ עָלַ֣/י פִּי/הֶ֑ם אַ֝רְיֵ֗ה טֹרֵ֥ף וְ/שֹׁאֵֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/013.yaml
  text: They open their mouth against me like a tearing and roaring lion[a].
translation:
  language: de
  text: Sie reißen ihr Maul gegen mich auf wie ein Löwe, der zerreißt und brüllt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie haben ihr Maul gegen mich aufgerissen: ein Löwe, der zerreißt und brüllt.“ Das Hebräische stellt das Löwenbild knapp und ohne ein ausdrückliches „wie“ daneben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֣וּ
  choice: sie reißen … auf
  rationale: פצה bezeichnet ein weites Öffnen. Die deutsche Wendung „das Maul aufreißen“ gibt die bedrohliche, anschauliche Handlung natürlich wieder; das Präsens vergegenwärtigt das poetisch geschilderte Geschehen.
- source_word: עָלַי
  choice: gegen mich
  rationale: עַל bezeichnet hier die feindselige Ausrichtung der Handlung auf den Sprecher.
- source_word: פִּיהֶם
  choice: ihr Maul
  rationale: Der hebräische Singular mit Pluralsuffix wird als kollektiver Singular bewahrt. „Maul“ fügt sich in das unmittelbar folgende Löwenbild und vermittelt den bedrohlichen Ton, ohne dem Bild eine zusätzliche Aussage hinzuzufügen.
- source_word: אַרְיֵה
  choice: wie ein Löwe
  rationale: Im Hebräischen steht kein ausdrückliches Vergleichswort. Der kompakte Anschluss ist jedoch bildhaft-vergleichend; „wie“ macht diese Beziehung im Deutschen klar und natürlich.
- source_word: טֹרֵף
  choice: der zerreißt
  rationale: Das Qal-Partizip von טרף beschreibt das gewaltsame Reißen eines Raubtiers. „Zerreißt“ wahrt die Handlung, ohne ein im Hebräischen unausgesprochenes Objekt wie „Beute“ einzufügen.
- source_word: וְשֹׁאֵג
  choice: und brüllt
  rationale: שׁאג ist das übliche Verb für das Brüllen eines Löwen. Die finite Relativsatzform klingt im modernen Deutschen natürlicher als eine Häufung von Partizipien.
