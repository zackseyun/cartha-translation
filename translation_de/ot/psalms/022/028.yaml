id: PSA.22.28
reference: Psalms 22:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: de
  text: Denn Yahweh gehört die Königsherrschaft[a], und er herrscht über die Völker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Königtum“, „die Herrschaft“ oder „das Reich“. Das hebräische Wort kann sowohl die königliche Stellung als auch die ausgeübte Herrschaft oder den Herrschaftsbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Zusammenhang ein und bewahrt die kausale Funktion natürlich im Deutschen.
- source_word: לַיהוָה
  choice: Yahweh gehört
  rationale: Die Präposition לְ kennzeichnet hier Zugehörigkeit bzw. Besitz; die deutsche Konstruktion mit „gehört“ gibt dies idiomatisch wieder. Der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: הַמְּלוּכָה
  choice: die Königsherrschaft
  rationale: מְלוּכָה kann Königsherrschaft, Königtum, Herrschaft oder Reich bezeichnen. „Königsherrschaft“ betont die königliche Regierungsgewalt, ohne sie auf ein räumliches Reich einzuengen.
- source_word: וּמֹשֵׁל
  choice: und er herrscht
  rationale: Das Qal-Partizip von משל bezeichnet hier eine fortdauernde bzw. allgemeingültige Herrschaft; das deutsche Präsens gibt diesen Sinn angemessen wieder.
- source_word: בַּגּוֹיִם
  choice: über die Völker
  rationale: Bei משל bezeichnet בְּ die von der Herrschaft erfassten Völker; „über“ ist im Deutschen die natürliche Verbindung. גּוֹיִם meint hier allgemein die Völker.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar wiedergegeben, während die traditionelle Ersatzlesung „der HERR“ als mögliche Konvention nicht in den Haupttext übernommen wird.
- issue: Bedeutungsweite von מְלוּכָה
  choice: Königsherrschaft
  alternative: Königtum, Herrschaft oder Reich
  rationale: Der Ausdruck lässt sowohl die königliche Stellung als auch deren Ausübung anklingen. „Königsherrschaft“ bewahrt diese Spannung besser als das stärker räumlich deutbare „Reich“; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Satzstruktur. „Königsherrschaft“ ist verständlich und bildet die Bedeutungsbreite des hebräischen Abstraktnomens genauer ab als das potenziell räumliche „Königreich“.
