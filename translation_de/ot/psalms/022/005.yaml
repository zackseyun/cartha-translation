  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: de
  text: Zu dir schrien sie und wurden gerettet[a]; auf dich vertrauten sie und wurden nicht zuschanden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und entkamen“ beziehungsweise „und wurden befreit“. Das hebräische Verb kann sowohl Entkommen als auch Rettung bezeichnen; hier steht es als Ergebnis des Hilferufs zu Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und wurden nicht beschämt“, „und schämten sich nicht“ oder „und wurden nicht enttäuscht“. Der hebräische Ausdruck kann sowohl Schande als auch das Scheitern einer Hoffnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: Zu dir
  rationale: Die Präposition אֶל mit Suffix bezeichnet die Richtung des Hilferufs. „Zu dir“ ist im modernen Deutschen natürlich und genau.
- source_word: זָעֲקוּ
  choice: schrien sie
  rationale: זעק bezeichnet einen eindringlichen Hilferuf. „Schrien“ bewahrt dessen Stärke, ohne zusätzliche Inhalte einzutragen.
- source_word: וְנִמְלָטוּ
  choice: und wurden gerettet
  rationale: Der Nifal von מלט kann ein Entkommen oder ein Gerettetwerden bezeichnen. Im Zusammenhang des an Gott gerichteten Hilferufs gibt „wurden gerettet“ den Rettungsvorgang angemessen wieder, ohne die mögliche Nuance des Entkommens zu verschweigen.
- source_word: בְּךָ
  choice: auf dich
  rationale: בְּ markiert bei בטח die Person, auf die man sein Vertrauen setzt. Die deutsche Verbindung „auf jemanden vertrauen“ ist idiomatisch und bewahrt den persönlichen Bezug.
- source_word: בָטְחוּ
  choice: vertrauten sie
  rationale: בטח bedeutet vertrauen oder sich verlassen auf. Das einfache Verb ist prägnant und entspricht der parallelen Satzstruktur.
- source_word: וְלֹא בֹשׁוּ
  choice: und wurden nicht zuschanden
  rationale: בוש kann Scham, Schande oder das Scheitern einer Hoffnung bezeichnen. „Nicht zuschanden werden“ bewahrt hier besonders die öffentliche Ehrverlust- und Ergebnisnuance, statt den Ausdruck auf ein inneres Schamgefühl zu verengen.
theological_decisions:
- issue: Art der in נִמְלָטוּ bezeichneten Rettung
  choice: Rettung als Antwort auf den an Gott gerichteten Hilferuf
  alternative: bloßes Entkommen ohne erkennbare göttliche Rettungswirkung
  rationale: Die Abfolge von Hilferuf und Rettung legt Gottes rettendes Handeln nahe. Die Übersetzung macht diese Logik sichtbar, ohne Art oder Mittel der Rettung näher festzulegen.
- issue: Bedeutung von בֹשׁוּ im Zusammenhang des Vertrauens
  choice: Sie wurden nicht zuschanden
  alternative: Sie schämten sich nicht; sie wurden nicht enttäuscht
  rationale: Die gewählte Fassung erhält die Spannung zwischen Schande, enttäuschter Hoffnung und dem Ausgang des Vertrauens. Sie reduziert die Aussage weder auf ein inneres Gefühl noch ausschließlich auf subjektive Enttäuschung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Zuschanden werden“ ist leicht gehoben, im Psalmton jedoch verständlich und semantisch breiter als eine rein emotionale Wiedergabe.
