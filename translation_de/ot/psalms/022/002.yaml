  text: אֱֽלֹהַ֗/י אֶקְרָ֣א י֭וֹמָם וְ/לֹ֣א תַעֲנֶ֑ה וְ֝/לַ֗יְלָה וְֽ/לֹא דֽוּמִיָּ֥ה לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: de
  text: Mein Gott, ich rufe am Tag, doch du antwortest nicht; und in der Nacht habe ich keine Ruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und in der Nacht gibt es für mich keine Stille«; auch möglich: »und in der Nacht schweige ich nicht«.'
    reason: Die knappe hebräische Wendung kann fehlende Ruhe beziehungsweise Stille oder das fortgesetzte Rufen des Beters bezeichnen.
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mein Gott
  rationale: 'Die Form mit Suffix der 1. Person Singular bezeichnet Gott in direkter Anrede: »mein Gott«.'
- source_word: אֶקְרָא
  choice: ich rufe
  rationale: קרא bezeichnet hier im Klagegebet den dringlichen Ruf zu Gott. »Ich rufe« ist im Deutschen natürlich und lässt die Intensität aus dem Zusammenhang hervorgehen.
- source_word: יוֹמָם
  choice: am Tag
  rationale: Das adverbial gebrauchte יוֹמָם bezeichnet die Tageszeit und bildet den Gegenpol zu »in der Nacht«.
- source_word: וְלֹא תַעֲנֶה
  choice: doch du antwortest nicht
  rationale: Das deutsche »doch« gibt den im Klagezusammenhang naheliegenden Gegensatz wieder, ohne den Inhalt zu verstärken.
- source_word: וְלַיְלָה
  choice: und in der Nacht
  rationale: Die Wiedergabe wahrt die verbindende Konjunktion und den zeitlichen Parallelismus mit »am Tag«.
- source_word: וְלֹא דֽוּמִיָה לִי
  choice: finde ich keine Ruhe
  rationale: Wörtlich ist von fehlender »Stille« oder »Ruhe« für den Beter die Rede. »Ich finde keine Ruhe« ist natürliches Deutsch und passt zur nächtlichen, unablässigen Klage; die wörtliche Bildsprache und die mögliche Deutung »ich schweige nicht« werden in der Fußnote offengehalten.
theological_decisions:
- issue: Deutung der Schlusswendung וְלֹא דֽוּמִיָה לִי
  choice: Der Beter findet in der Nacht keine Ruhe.
  alternative: 'Für mich gibt es keine Stille; beziehungsweise: Ich schweige nicht.'
  rationale: דומיה kann Stille, Schweigen oder Ruhe bezeichnen. Die Hauptfassung gibt den Zusammenhang idiomatisch wieder, während die Fußnote die knappe hebräische Formulierung und ihre Mehrdeutigkeit bewahrt. Die Wendung wird nicht als ausbleibende göttliche Antwort umgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus zwischen Tag und Nacht bleibt erhalten; das Semikolon macht die beiden Zeithälften lesbar. Die Hauptfassung ist idiomatisch, während die Fußnote die echte lexikalische Mehrdeutigkeit der Schlusswendung dokumentiert.
