  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen wieder: das vorangestellte Vertrauensobjekt („Auf dich“), die zweimalige Wiederholung von בָּטְחוּ („vertrauten“), אֲבֹתֵינוּ als „unsere Väter“ und die göttliche Rettung in וַתְּפַלְּטֵמוֹ. Die Vergangenheitswiedergabe von „du hast sie gerettet“ ist für das hebräische Narrativ angemessen.'
