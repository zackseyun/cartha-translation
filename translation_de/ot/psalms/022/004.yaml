  text: בְּ֭/ךָ בָּטְח֣וּ אֲבֹתֵ֑י/נוּ בָּ֝טְח֗וּ וַֽ/תְּפַלְּטֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/004.yaml
  text: In you our fathers trusted; they trusted[a], and you delivered them.
translation:
  language: de
  text: Auf dich vertrauten unsere Väter; sie vertrauten, und du hast sie gerettet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּךָ
  choice: Auf dich
  rationale: Die Präposition ב mit בטח bezeichnet hier die Person, auf die sich das Vertrauen richtet. »Auf dich vertrauen« ist im Deutschen natürlich und fügt keine im Hebräischen nicht ausdrücklich genannte Ausschließlichkeit hinzu.
- source_word: בָּטְחוּ
  choice: vertrauten
  rationale: בטח bezeichnet sicheres Vertrauen oder Sichverlassen. Das einfache Verb ist knapp und bewahrt die Wiederholung des hebräischen Textes.
- source_word: אֲבֹתֵינוּ
  choice: unsere Väter
  rationale: Das hebräische Wort ist ausdrücklich die maskuline Pluralform von »Vater« mit dem Suffix »unser«. Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext sichtbar.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: und du hast sie gerettet
  rationale: פלט bedeutet retten, befreien oder entkommen lassen. »Gerettet« ist in modernem Deutsch klar und würdig, ohne die Art der Rettung näher festzulegen.
theological_decisions:
- issue: Historisch-repräsentative Bedeutung von אֲבֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: »Väter« bewahrt die konkrete maskuline Bezeichnung des Ausgangstextes; »Vorfahren« wäre als weiterer genealogischer Sinn möglich, würde die Form jedoch neutralisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Wiederholung von »vertrauten« wird erhalten; der Parallelismus bleibt knapp und gut verständlich.
