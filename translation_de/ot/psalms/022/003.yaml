source:
  edition: WLC
  text: וְ/אַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/003.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: de
  text: Doch du bist heilig, du thronst über den Lobgesängen Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch du bist heilig und wohnst inmitten der Lobgesänge Israels.“ Das hebräische Partizip kann „sitzen/thronen“ oder „wohnen“ bedeuten; die genaue räumliche Beziehung zu den Lobgesängen bleibt unausgesprochen.'
    reason: lexikalische Alternative und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: וְאַתָּה
  choice: Doch du
  rationale: Die Konjunktion leitet zusammen mit dem selbstständigen Pronomen einen deutlichen Gegensatz zur vorausgehenden Klage ein. „Doch du“ gibt diesen Kontrast im modernen Deutschen natürlich wieder und bewahrt die ausdrückliche Anrede.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: Das Adjektiv bezeichnet Gottes Heiligkeit in ihrem umfassenden Sinn. „Heilig“ ist die sachlich genaue und im Deutschen geläufige Wiedergabe.
- source_word: יֹשֵׁב
  choice: du thronst
  rationale: Das Partizip bedeutet wörtlich „sitzend“ und kann auch „wohnend“ ausdrücken. Auf Gott bezogen trägt es häufig königliche Thronvorstellung; die finite Form ist im Deutschen natürlich und erhält das poetische Bild.
- source_word: תְּהִלּוֹת
  choice: Lobgesängen
  rationale: Der Plural bezeichnet wiederholte oder konkrete Äußerungen des Lobes. „Lobgesänge“ bewahrt den Plural und passt als poetische deutsche Formulierung.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird gemäß der üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung von יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל
  choice: Gott wird in königlich-poetischer Bildsprache als über den Lobgesängen Israels thronend dargestellt.
  alternative: Gott wohnt inmitten der Lobgesänge Israels.
  rationale: Das hebräische Partizip kann sowohl das Sitzen beziehungsweise Thronen als auch das Wohnen bezeichnen. Die Hauptfassung erhält die königliche Bildsprache; die Fußnote wahrt die echte lexikalische und räumliche Mehrdeutigkeit, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Die Wiederholung von „du“ macht die hebräische Anrede und den Übergang zur Aussage über Gottes Thronen klar.
