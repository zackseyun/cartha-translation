source:
  edition: WLC
  text: יִרְאֵ֤י יְהוָ֨ה הַֽלְל֗וּ/הוּ כָּל זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּ/הוּ וְ/ג֥וּרוּ מִ֝מֶּ֗/נּוּ כָּל זֶ֥רַע יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: de
  text: 'Die ihr Jahwe fürchtet, lobt ihn!

    Alle Nachkommen Jakobs, ehrt ihn!

    Erschauert vor ihm[a], alle Nachkommen Israels!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Fürchtet ihn“ oder „Habt Ehrfurcht vor ihm“. Das hebräische Verb bezeichnet ein von Furcht und Ehrfurcht geprägtes Erschauern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: Die ihr Jahwe fürchtet
  rationale: Die Konstruktverbindung bezeichnet Menschen, die von der Ehrfurcht vor Jahwe geprägt sind. Der Relativsatz gibt die durch die folgenden Imperative erkennbare direkte Anrede natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: הַלְלוּהוּ
  choice: lobt ihn
  rationale: Der Pluralimperativ mit Suffix der 3. Person Singular fordert zum Lob auf; „ihn“ verweist auf Jahwe zurück.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: Alle Nachkommen Jakobs
  rationale: זֶרַע ist hier kollektiv gebraucht. „Nachkommen“ ist im heutigen Deutsch natürlich und bewahrt zusammen mit „alle“ die umfassende Anrede.
- source_word: כַּבְּדֻהוּ
  choice: ehrt ihn
  rationale: Der Piel-Imperativ von כבד fordert dazu auf, Gott die ihm gebührende Ehre zu geben. „Ehrt ihn“ ist knapp und lexikalisch nah.
- source_word: וְגוּרוּ
  choice: Erschauert
  rationale: Der Imperativ bezeichnet ein von Furcht und Ehrfurcht geprägtes Erschauern. Die Wiedergabe wahrt die stärkere, körperlich-emotionale Nuance und vermeidet eine bloße Wiederholung von „fürchtet“.
- source_word: מִמֶּנּוּ
  choice: vor ihm
  rationale: Mit גור bezeichnet die Präposition den, vor dem man erschauert oder sich fürchtet; „vor ihm“ ist die idiomatische deutsche Verbindung.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: alle Nachkommen Israels
  rationale: Die Wiedergabe entspricht der parallelen Wendung mit Jakob und erhält so Aufbau und kollektiven Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift bewahrt den Charakter als Eigenname, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutungsnuance von וְגוּרוּ מִמֶּנּוּ
  choice: Erschauert vor ihm
  alternative: Fürchtet ihn / Habt Ehrfurcht vor ihm
  rationale: גור kann hier Furcht, Scheu und ehrfürchtiges Erschauern ausdrücken. „Erschauert“ bewahrt die Spannung zwischen Gotteslob und furchtsamer Ehrfurcht, ohne die Formulierung auf bloßen Schrecken festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappen poetischen Imperativen. Die parallelen Anreden „Nachkommen Jakobs“ und „Nachkommen Israels“ bleiben sichtbar; „Erschauert“ wahrt die eindringliche Sprache des hebräischen Verses.
