id: PSA.22.19
reference: Psalms 22:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: de
  text: Du aber, Jahwe, bleib nicht fern! Meine Stärke[a], eile mir zu Hilfe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „meine Stärke“. Das Wort wird auch als „meine Hilfe“ verstanden; seinem möglichen Wortsinn nach könnte es zudem „meine Hindin/Hirschkuh“ bedeuten, was hier jedoch weniger wahrscheinlich ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen setzt einen starken Kontrast zur vorausgehenden Not; „Du aber“ gibt diesen Nachdruck im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַל־תִּרְחָק
  choice: bleib nicht fern
  rationale: רחק bezeichnet räumliche oder übertragene Ferne. Im Zusammenhang bittet der Sprecher darum, dass Jahwe nicht auf Abstand bleibt.
- source_word: אֱיָלוּתִי
  choice: meine Stärke
  rationale: Die schwierige Form wird im Kontext am besten als Bezeichnung für Kraft bzw. Stärke verstanden und als Anrede an Gott bewahrt; andere Deutungen werden in der Fußnote genannt.
- source_word: לְעֶזְרָתִי
  choice: mir zu Hilfe
  rationale: Die Präpositionalverbindung bedeutet wörtlich „zu meiner Hilfe“; die gewählte Wendung ist idiomatisches, würdevolles Deutsch.
- source_word: חוּשָׁה
  choice: eile
  rationale: Der Imperativ drückt Dringlichkeit aus. „Eile“ ist knapp, verständlich und stilistisch dem poetischen Gebet angemessen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen, statt ihn durch den Titel „HERR“ zu ersetzen.
- issue: Deutung von אֱיָלוּתִי als Anrede an Gott
  choice: meine Stärke
  alternative: meine Hilfe; meine Hindin/Hirschkuh
  rationale: „Meine Stärke“ fügt sich sinnvoll in den Hilferuf, ohne die schwierige hebräische Form zu verschweigen; die bestehende lexikalische Unsicherheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Gebetsdeutsch. Die kurzen Ausrufe und „eile“ erhalten die Dringlichkeit des hebräischen Verses; „Du aber“ markiert den starken Kontrast.
