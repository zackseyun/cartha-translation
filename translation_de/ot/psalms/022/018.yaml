base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/018.yaml
  text: They divide my garments among themselves[a], and for my clothing they cast lots.
translation:
  language: de
  text: Sie verteilen meine Kleider unter sich[a], und über mein Gewand werfen sie das Los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Zeile wird in den Berichten über die Kreuzigung Jesu aufgegriffen; vgl. Matthäus 27,35; Markus 15,24; Lukas 23,34; Johannes 19,24.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: sie teilen … auf
  rationale: Das Piel Imperfekt 3. Person Plural beschreibt anschaulich, wie die Beteiligten die Gewänder untereinander verteilen. Das deutsche Präsens entspricht der lebendigen poetischen Darstellung.
- source_word: בְגָדַי
  choice: meine Gewänder
  rationale: בגד bezeichnet Kleidung beziehungsweise einzelne Kleidungsstücke. „Gewänder“ wahrt den gehobenen, aber verständlichen Psalmton und unterscheidet den Ausdruck vom zweiten Kleidungsbegriff.
- source_word: לָהֶם
  choice: unter sich
  rationale: Wörtlich steht „für/zu ihnen“. Zusammen mit „aufteilen“ gibt „unter sich“ die gegenseitige Verteilung im Deutschen idiomatisch wieder, ohne einen zusätzlichen Sinn einzutragen.
- source_word: לְבוּשִׁי
  choice: mein Kleid
  rationale: לבוש kann Kleidung oder ein Kleidungsstück bezeichnen. Der Singular „mein Kleid“ bewahrt die formale Singularität und den poetischen Parallelismus, ohne das Stück spezifischer als der hebräische Text als „Obergewand“ oder „Robe“ festzulegen.
- source_word: יַפִּילוּ גוֹרָל
  choice: sie werfen das Los
  rationale: Das Hiphil von נפל bildet mit גורל die feste Wendung für das Loswerfen. „Das Los werfen“ ist im Deutschen idiomatisch und bewahrt den Singular des hebräischen Nomens.
theological_decisions:
- issue: Messianischer Anklang und neutestamentliche Aufnahme
  choice: Der hebräische Vers wird unmittelbar als poetische Schilderung übersetzt; die Verbindung zur Kreuzigung Jesu erscheint in einer Fußnote.
  alternative: Die Erfüllung in Jesu Kreuzigung bereits durch ausdrücklich christologische Sprache im Vers hervorheben.
  rationale: Der Wortlaut des Psalms nennt die Kreuzigung nicht ausdrücklich. Seine Aufnahme in den Passionsberichten ist im kanonischen Zusammenhang bedeutsam, soll aber die Übersetzung des hebräischen Ausgangstextes nicht verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulichem poetischem Präsens. Die beiden hebräischen Kleidungsbegriffe werden durch „Gewänder“ und „Kleid“ unterschieden; die parallele Satzstruktur bleibt erhalten.
