  text: ה֭וֹשִׁיעֵ/נִי מִ/פִּ֣י אַרְיֵ֑ה וּ/מִ/קַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: de
  text: Rette mich aus dem Rachen des Löwen und vor den Hörnern der Wildrinder[a] — du hast mir geantwortet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „wilde Stiere“ oder „Auerochsen“; das hebräische Wort bezeichnet ein mächtiges wildes Rind.
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satz kann als plötzliche Erklärung der Gebetserhörung verstanden werden: „Du hast mir geantwortet.“ Damit schlägt die Bitte unvermittelt in Zuversicht um.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von ישׁע mit Suffix der 1. Person Singular ist eine dringliche Bitte um Rettung; „Rette mich“ ist im modernen Deutsch natürlich und wahrt die Breite des Ausdrucks.
- source_word: מִפִּי
  choice: aus dem Rachen
  rationale: Wörtlich steht „aus dem Mund“. Bei einem angreifenden Löwen gibt „Rachen“ das konkrete Bild im Deutschen natürlich und treffend wieder.
- source_word: אַרְיֵה
  choice: des Löwen
  rationale: Der artikellose hebräische Singular wird in diesem poetischen Gefahrenbild im Deutschen idiomatisch mit dem bestimmten Artikel wiedergegeben.
- source_word: וּמִקַּרְנֵי
  choice: und vor den Hörnern
  rationale: „Hörner“ bewahrt das konkrete Bild. Nach „retten“ ist „vor“ im Deutschen idiomatischer als ein wiederholtes „aus“, ohne die Bedeutung der hebräischen Präposition zu verändern.
- source_word: רֵמִים
  choice: Wildrinder
  rationale: Das Wort bezeichnet mächtige wilde Rinder, wahrscheinlich Auerochsen. „Wildrinder“ ist verständlich, zoologisch vorsichtig und vermeidet die unzutreffende traditionelle Wiedergabe „Einhörner“.
- source_word: עֲנִיתָנִי
  choice: du hast mir geantwortet
  rationale: Das Qal-Perfekt der 2. Person maskulin Singular mit Suffix der 1. Person Singular bezeichnet hier am natürlichsten eine bereits erfahrene Gebetserhörung und erhält den abrupten Umschlag von der Bitte zur Zuversicht.
theological_decisions:
- issue: Ob עֲנִיתָנִי als Erklärung der Gebetserhörung oder als Fortsetzung der Bitte zu verstehen ist
  choice: 'Erklärung: „du hast mir geantwortet“'
  alternative: 'Als inhaltliche Fortsetzung der Bitte verstanden, etwa: „rette/erhöre mich vor den Hörnern der Wildrinder“'
  rationale: Die hebräische Form ist ein Perfekt und kein Imperativ. Die unvermittelte Erklärung der Erhörung passt zum literarischen Wendepunkt des Psalms und leitet den folgenden Lobpreis ein; eine Fußnote macht die Funktion dieses plötzlichen Wechsels sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Bildsprache. Der Gedankenstrich erhält den abrupten Umschlag von der Rettungsbitte zur Gewissheit der Erhörung.
