base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: de
  text: Rette mein Leben[a] vor dem Schwert, mein einziges Leben[c] aus der Gewalt des Hundes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Seele“. Das hebräische Wort נֶפֶשׁ kann je nach Zusammenhang die Seele, die Person oder das Leben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus der Hand des Hundes“; „Hand“ bezeichnet hier Macht oder Zugriff.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „meine Einzige“; auch möglich: „mein kostbares Leben“. Im Parallelismus mit „mein Leben“ kann sich das Wort auf das einzige, unersetzliche Leben des Beters beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: Rette
  rationale: Der verstärkte Imperativ von נצל formuliert einen dringenden Hilferuf. „Rette“ ist im heutigen Deutsch unmittelbar und natürlich.
- source_word: מֵחֶרֶב
  choice: vor dem Schwert
  rationale: Die Präposition מן bezeichnet hier die Gefahr, aus der Rettung erbeten wird. Im Deutschen ist „vor dem Schwert retten“ idiomatischer als „vom Schwert retten“.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נפש bezeichnet in diesem Zusammenhang den lebenden Menschen beziehungsweise sein bedrohtes Leben, nicht notwendig eine vom Körper getrennte Seele.
- source_word: מִיַּד
  choice: aus der Gewalt
  rationale: „Aus der Hand“ ist ein hebräisches Bild für die Macht oder den Zugriff eines Gegners. „Aus der Gewalt“ gibt die idiomatische Bedeutung in klarem Deutsch wieder.
- source_word: כֶּלֶב
  choice: des Hundes
  rationale: Der Singular und das eindrückliche Tierbild des Hebräischen bleiben erhalten, ohne den Hund ausdrücklich als Feind zu deuten.
- source_word: יְחִידָתִי
  choice: mein einziges Leben
  rationale: Das substantivierte feminine Adjektiv bedeutet wörtlich „meine Einzige“ und bezieht sich parallel zu נַפְשִׁי auf das eine, unersetzliche Leben des Beters. Die Ergänzung „Leben“ macht diesen Bezug im Deutschen verständlich.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשִׁי im Klagegebet
  choice: „mein Leben“
  alternative: „meine Seele“
  rationale: Angesichts der tödlichen Bedrohung bezeichnet נַפְשִׁי hier am ehesten das Leben beziehungsweise die lebende Person. Die Übersetzung vermeidet eine nicht vom Kontext geforderte Leib-Seele-Dualität.
- issue: Bezug und Bedeutung von יְחִידָתִי
  choice: „mein einziges Leben“
  alternative: „meine Einzige“ oder „mein kostbares Leben“
  rationale: Die Form bewahrt die Vorstellung des einzigen, unersetzlichen Lebens. „Meine Einzige“ wäre formal näher, könnte im Deutschen jedoch fälschlich eine andere geliebte Person bezeichnen; „kostbar“ macht eine naheliegende Wertung ausdrücklich, die im Wort nur mitschwingt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Der Parallelismus, der Singular „Hund“ und die Bildsprache bleiben erhalten; erklärungsbedürftige Mehrdeutigkeiten werden in Fußnoten offengelegt.
