  text: Alle, die mich sehen, verspotten mich; sie verziehen die Lippen[a] und schütteln den Kopf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sie öffnen/spreizen die Lippe“. Gemeint ist wahrscheinlich eine verächtliche Gesichts- oder Mundgebärde.'
