lexical_decisions:
- source_word: כָּל רֹאַי
  choice: Alle, die mich sehen
  rationale: Der substantivisch gebrauchte Qal-Partizip von ראה mit Suffix der 1. Person Singular wird im Deutschen natürlich als Relativsatz wiedergegeben; כָּל bezeichnet die Gesamtheit der Beobachtenden.
- source_word: יַלְעִגוּ לִי
  choice: verspotten mich
  rationale: לעג bezeichnet hier gegen den Sprecher gerichteten höhnischen Spott. „Verspotten“ ist klar, gegenwärtig und dem würdigen Register angemessen.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: sie reißen die Lippen auf
  rationale: Die Wendung beschreibt wahrscheinlich eine verächtliche Mund- oder Lippengebärde. Die Übersetzung bewahrt das Körperbild und lässt die genaue Art der Geste offen.
- source_word: יָנִיעוּ רֹאשׁ
  choice: schütteln den Kopf
  rationale: Die Wendung bezeichnet eine Kopfbewegung als Ausdruck des Hohns. „Den Kopf schütteln“ ist dafür im modernen Deutschen die verständlichste Entsprechung.
theological_decisions:
- issue: Messianische Aufnahme in späterer christlicher Auslegung
  choice: Der Vers wird zunächst aus seinem hebräischen Psalmzusammenhang als Rede des leidenden Psalmisten übersetzt.
  alternative: Eine ausdrücklich christologische Formulierung oder Deutung im Haupttext.
  rationale: Die Passionsberichte greifen die Gebärde später auf; diese Verbindung soll jedoch nicht in den hebräischen Wortlaut hineingetragen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem poetischem Ton. Der parallele Satzbau und die körperlichen Bilder des Hebräischen bleiben erhalten; die genaue Lippengebärde wird nicht vorschnell vereindeutigt.
