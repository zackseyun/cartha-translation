source:
  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: de
  text: Meine Kraft ist vertrocknet wie eine Tonscherbe, und meine Zunge klebt an meinen Kiefern[a]; du legst mich in den Staub des Todes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an meinem Gaumen«. Welcher Teil des Mundes mit dem hebräischen Wort genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: ist vertrocknet
  rationale: Das Verb bezeichnet Austrocknen oder Verdorren; die Zustandsformulierung bewahrt das Bild völliger körperlicher Auszehrung.
- source_word: כַּחֶרֶשׂ
  choice: wie eine Tonscherbe
  rationale: חֶרֶשׂ bezeichnet Töpferware beziehungsweise eine Scherbe; »Tonscherbe« vermittelt anschaulich Trockenheit, Sprödigkeit und Zerbrechlichkeit.
- source_word: כֹּחִי
  choice: meine Kraft
  rationale: כֹּחַ meint hier körperliche Kraft oder Lebenskraft und wird im Deutschen natürlich mit »Kraft« wiedergegeben.
- source_word: וּלְשׁוֹנִי
  choice: und meine Zunge
  rationale: Die direkte anatomische Bezeichnung bleibt ohne unnötige Umschreibung erhalten.
- source_word: מֻדְבָּק
  choice: klebt
  rationale: Das passive Partizip beschreibt das feste Anhaften; »klebt« ist im Deutschen idiomatisch und erhält das körperliche Bild.
- source_word: מַלְקוֹחָי
  choice: an meinen Kiefern
  rationale: Das seltene Substantiv bezeichnet vermutlich einen Teil des Mundraums, möglicherweise die Kiefer; wegen der lexikalischen Unsicherheit wird »Gaumen« in der Fußnote genannt.
- source_word: וְלַעֲפַר
  choice: in den Staub
  rationale: Die Präposition ל kann Zielrichtung oder Versetzung an einen Ort ausdrücken; mit »legen« ist »in den Staub« natürlich und bildkräftig.
- source_word: מָוֶת
  choice: des Todes
  rationale: Die Genitivverbindung »Staub des Todes« bewahrt die poetische Form und vermeidet die interpretierende Einengung auf das Grab.
- source_word: תִּשְׁפְּתֵנִי
  choice: du legst mich
  rationale: Die Form ist zweite Person maskulin Singular mit einem Objekt der ersten Person Singular und bezeichnet ein Setzen oder Legen.
theological_decisions:
- issue: Handelnder im letzten Satzteil
  choice: 'Direkte Anrede an Gott: »du legst mich in den Staub des Todes«'
  alternative: 'Unpersönlich beziehungsweise resultativ: »ich werde in den Staub des Todes gelegt«'
  rationale: Die hebräische Verbform spricht eindeutig ein männliches Gegenüber in der Einzahl an. Im Gebetszusammenhang ist damit Gott gemeint. Die Übersetzung erhält die Spannung, dass der Leidende seine äußerste Not Gottes Handeln zuschreibt, ohne das Verhältnis zu menschlichen Widersachern zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Das konkrete Bild der Tonscherbe und die direkte Gottesrede bleiben erhalten; die unsichere anatomische Bezeichnung wird nicht im Haupttext geglättet, sondern durch eine Fußnote kenntlich gemacht.
