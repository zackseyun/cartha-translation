  text: אֵלִ֣/י אֵ֭לִ/י לָ/מָ֣ה עֲזַבְתָּ֑/נִי רָח֥וֹק מִֽ֝/ישׁוּעָתִ֗/י דִּבְרֵ֥י שַׁאֲגָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: de
  text: Mein Gott, mein Gott, warum hast du mich verlassen? Fern von meiner Rettung[a] sind die Worte meines Schreiens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinem Heil“, „meiner Befreiung“ oder „meiner Hilfe“. Das hebräische Wort kann Rettung, Befreiung oder Hilfe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Worte meines Brüllens“. Möglich ist auch die ergänzende Deutung: „Warum bist du fern von meiner Rettung, von den Worten meines Schreiens?“ Der hebräische Satz ist stark verdichtet; diese Deutung führt die Frage und die Anrede des ersten Satzes fort.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: Mein Gott, mein Gott
  rationale: Die zweimalige direkte Anrede bewahrt sowohl das Possessivsuffix als auch die eindringliche Wiederholung des Hebräischen.
- source_word: לָמָה
  choice: warum
  rationale: Die gewöhnliche deutsche Frage nach dem Grund gibt die unmittelbare Kraft der Klage wieder.
- source_word: עֲזַבְתָּנִי
  choice: hast du mich verlassen
  rationale: Das Verb bezeichnet Verlassen oder Im-Stich-Lassen. Diese Formulierung ist genau, natürlich und bewahrt den ernsten Ton der Klage.
- source_word: רָחוֹק
  choice: Fern von
  rationale: Die vorangestellte Stellung erhält die markante, verdichtete Struktur des hebräischen zweiten Satzes.
- source_word: מִישׁוּעָתִי
  choice: meiner Rettung
  rationale: יְשׁוּעָה bezeichnet hier im unmittelbaren Klagezusammenhang konkrete Rettung oder Befreiung. „Rettung“ ist im modernen Deutsch klar, ohne den Ausdruck unnötig dogmatisch zu verengen.
- source_word: דִּבְרֵי שַׁאֲגָתִי
  choice: die Worte meines Schreiens
  rationale: „Worte“ gibt den Constructus דִּבְרֵי wieder; „Schreien“ vermittelt den lauten, qualvollen Klageruf, während die Fußnote das noch bildhaftere wörtliche „Brüllen“ festhält.
theological_decisions:
- issue: Wiedergabe von יְשׁוּעָה in einem später messianisch rezipierten Psalm
  choice: meiner Rettung
  alternative: meinem Heil; meiner Hilfe; meiner Befreiung
  rationale: Im hebräischen Klagekontext steht die erhoffte konkrete Rettung im Vordergrund. „Rettung“ lässt die weitere theologische Bedeutung offen, ohne sie dem Vers aufzuzwingen.
- issue: Verständnis des elliptischen zweiten Satzes
  choice: Fern von meiner Rettung sind die Worte meines Schreiens
  alternative: Warum bist du fern von meiner Rettung, von den Worten meines Schreiens?
  rationale: Der hebräische Wortlaut enthält im zweiten Satz weder ein ausdrückliches weiteres „warum“ noch ein „du“. Die gewählte Fassung wahrt deshalb die auffällige Ellipse und ihre Spannung; die mögliche ergänzende Deutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz ist bewusst schlicht und eindringlich. Im zweiten Satz bleibt die ungewöhnliche hebräische Wortstellung erkennbar; „Schreien“ ist im Haupttext natürlich verständlich, während „Brüllen“ als besonders kräftiges Ausgangsbild in der Fußnote erhalten bleibt.
