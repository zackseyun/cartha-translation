  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: de
  text: 'Er sagt in seinem Herzen[a]: »Gott hat vergessen, hat sein Angesicht verborgen, wird niemals sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er sagte in seinem Herzen: Gott vergisst, verbirgt sein Angesicht, sieht niemals.« Die hebräischen Perfektformen können in der Poesie gegenwärtig, vergangen oder resultativ-gegenwärtig verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Er sagt
  rationale: Das Qal Perfekt 3. Person Singular kann in hebräischer Poesie eine gegenwärtige oder allgemeingültige Aussage wiedergeben. Das Präsens passt zur fortlaufenden Schilderung des Gottlosen.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: Die wörtliche, im Deutschen verständliche Wendung bezeichnet das innere Reden oder Denken.
- source_word: שָׁכַח
  choice: hat vergessen
  rationale: Das Verb bedeutet „vergessen“. Das Perfekt gibt hier die Annahme des Gottlosen wieder, Gott habe die Sache bereits vergessen und werde deshalb nicht eingreifen.
- source_word: אֵל
  choice: Gott
  rationale: Das gewöhnliche singularische Gotteswort bezeichnet hier den wahren Gott und wird daher schlicht mit „Gott“ wiedergegeben.
- source_word: הִסְתִּיר פָּנָיו
  choice: er hat sein Angesicht verborgen
  rationale: Die konkrete hebräische Bildsprache bleibt erhalten. Das Verbergen des Angesichts bezeichnet, dass Gott vermeintlich nicht hinsieht oder sich nicht zuwendet, ohne das Bild interpretierend aufzulösen.
- source_word: בַּל ... לָנֶצַח
  choice: niemals
  rationale: Die Negation בַּל erhält zusammen mit לָנֶצַח den Sinn „nie“ oder „niemals“.
- source_word: רָאָה
  choice: sehen
  rationale: Die Grundbedeutung „sehen“ bleibt gewahrt. Im Zusammenhang ist auch das Wahrnehmen im Hinblick auf ein Eingreifen oder Gericht mitgemeint, wird aber nicht ausdrücklich in den Text eingetragen.
theological_decisions:
- issue: Anthropomorphe Rede davon, dass Gott sein Angesicht verbirgt
  choice: Das Bild „er hat sein Angesicht verborgen“ wird im Haupttext beibehalten.
  alternative: „er hat sich abgewandt“ oder „er schenkt dem keine Beachtung“
  rationale: Der hebräische Text verwendet eine konkrete anthropomorphe Wendung. Ihre Beibehaltung bewahrt die biblische Bild- und Bedeutungsspannung, statt sie auf eine einzelne Deutung zu verengen.
- issue: Nicht genanntes Objekt von „sehen“
  choice: Das im Deutschen grammatisch hilfreiche Pronomen „es“ wird verwendet, ohne seinen Bezug näher festzulegen.
  alternative: „er wird niemals hinsehen“ oder „er wird es nie bemerken“
  rationale: Im Hebräischen steht kein ausdrückliches Objekt. „Es“ ermöglicht natürliches Deutsch und lässt offen, ob sich die Aussage auf das Unrecht, das Leiden oder die gesamte Lage bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „sein Angesicht verbergen“ wurde wegen ihrer prägnanten biblischen Bildkraft beibehalten; der übrige Satzbau ist bewusst klar und allgemein verständlich.
