  text: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises the LORD.
translation:
  language: de
  text: Denn der Frevler rühmt sich seiner Begierde, und der Habgierige flucht dem HERRN und verachtet ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht „segnet“. Bei einem negativen Bezug auf Gott kann „segnen“ im Hebräischen verhüllend für „fluchen“ stehen. Die knappe Satzfügung wird auch anders gedeutet, etwa: „Der Habgierige segnet sich selbst und verachtet den HERRN.“'
    reason: Das hebräische בֵּרֵךְ bedeutet formal „segnen“, wird jedoch in einigen Kontexten als Euphemismus für „fluchen“ verstanden. Die Anmerkung dokumentiert diese wahrscheinliche Deutung und erhält die syntaktische Alternative.
lexical_decisions:
- source_word: רָשָׁע
  choice: der Frevler
  rationale: Bezeichnet hier einen schuldhaft gottwidrig handelnden Menschen; „Frevler“ ist prägnant, würdig und im Psalmenkontext verständlich.
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: seiner Begierde
  rationale: נפשׁו dient hier idiomatisch als Rückbezug auf die Person; „seiner Begierde“ gibt den Sinn natürlich wieder, ohne die im Deutschen missverständliche Wendung „Begierde seiner Seele“ zu erzwingen.
- source_word: בֹצֵעַ
  choice: der Habgierige
  rationale: Das Partizip bezeichnet wahrscheinlich jemanden, der auf unrechtmäßigen Gewinn aus ist; „Habgierige“ bewahrt den moralischen Akzent.
- source_word: בֵּרֵךְ
  choice: segnet sich selbst
  rationale: Das Verb bedeutet formal „segnen“. Das reflexive Objekt ist im Hebräischen nicht ausdrücklich genannt, ergibt sich aber als plausible Deutung aus dem Kontext und bewahrt den Parallelismus des prahlerischen Selbstlobs.
- source_word: נִאֵץ
  choice: verachtet
  rationale: Gibt die starke Geringschätzung beziehungsweise Schmähung gegenüber JHWH in verständlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wird in Kapitälchen angezeigt.
theological_decisions:
- issue: Bezug und Funktion von בֵּרֵךְ im zweiten Halbvers
  choice: „segnet sich selbst und verachtet den HERRN“
  alternative: „segnet den Habgierigen, verachtet den HERRN“ beziehungsweise „wer nach Gewinn giert, flucht und verachtet den HERRN“
  rationale: Die hebräische Syntax ist knapp und mehrdeutig. Der Haupttext folgt der plausiblen reflexiven Lesart und dem parallelen Gedanken des Selbstlobs; die alternativen Zuordnungen werden in einer Fußnote offengelegt, statt die Spannung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt knapp; „Frevler“ und „Habgierige“ bewahren den poetisch-ethischen Ton des Psalms. Der Fußnotenmarker steht unmittelbar nach dem Vers.
