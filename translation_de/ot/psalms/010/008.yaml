lexical_decisions:
- source_word: יֵשֵׁב בְּמַאְרַב
  choice: Er sitzt im Hinterhalt
  rationale: Bewahrt das konkrete Bild des Sitzens und gibt בְּמַאְרַב natürlich als verborgenen Ort beziehungsweise Zustand des Auflauerns wieder.
- source_word: חֲצֵרִים
  choice: bei den Dörfern
  rationale: חֲצֵרִים kann Dörfer, Ansiedlungen oder eingefriedete Bereiche bezeichnen. Im Bild eines Hinterhalts ist „bei den Dörfern“ im Deutschen natürlich, ohne den möglichen Siedlungsbezug aufzugeben.
- source_word: בַּמִּסְתָּרִים
  choice: in den Verstecken
  rationale: Die konkrete Mehrzahl verborgener Orte bleibt erhalten und führt das Motiv des heimlichen Auflauerns fort.
- source_word: יַהֲרֹג נָקִי
  choice: ermordet er den Unschuldigen
  rationale: Das Verb bezeichnet Töten; angesichts des unschuldigen Opfers und des vorsätzlichen Hinterhalts bringt „ermordet“ den Kontext treffend zum Ausdruck.
- source_word: עֵינָיו לְחֵלְכָה יִצְפֹּנוּ
  choice: Seine Augen lauern dem Hilflosen auf
  rationale: Die schwierige Wendung verbindet „seine Augen“ mit einem Verb aus dem Bedeutungsfeld des Verbergens. „auflauern“ bewahrt die heimliche, räuberische Beobachtung; חֵלְכָה bezeichnet hier wahrscheinlich das schwache oder unglückliche Opfer.
