- from: Jahwe, du hast das Verlangen der Demütigen[a] gehört; du wirst ihr Herz fest machen[b]; dein Ohr wird aufmerksam hinhören.
  to: Jahwe, du hast das Verlangen der Demütigen[a] gehört; du wirst ihr Herz festigen[b]; dein Ohr wird aufmerken.
  rationale: Die Revision beschränkt sich auf zwei idiomatische Verbesserungen. „Festigen“ stellt die Bedeutung von תָּכִין im Kontext klar und natürlich dar; die Fußnote bewahrt „bereiten“ und die wörtlichere Wendung „fest machen“ als Alternativen. „Aufmerken“ bewahrt das ausdrücklich genannte Ohr und vermeidet eine im Deutschen unnötig doppelte Hörformulierung.
