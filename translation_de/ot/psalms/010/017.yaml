  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: de
  text: Jahwe, du hast das Verlangen der Demütigen[a] gehört; du wirst ihr Herz festigen[b]; dein Ohr wird aufmerken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gebeugten“ oder „der Sanftmütigen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du wirst ihr Herz bereiten“ oder „fest machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Verlangen
  rationale: Das Substantiv bezeichnet Wunsch oder Sehnsucht. „Verlangen“ ist im Gebetskontext natürlich und bewahrt die innere Ausrichtung des Ausdrucks.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Das Wort kann demütige, sanftmütige oder durch Not gebeugte Menschen bezeichnen. „Die Demütigen“ wahrt den Grundsinn, ohne den im Psalm vorhandenen Bezug auf Bedrängte auszuschließen.
- source_word: שָׁמַעְתָּ
  choice: du hast … gehört
  rationale: Die hebräische Perfektform bezeichnet hier Gottes bereits erfolgtes Hören mit bleibender Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תָּכִין
  choice: du wirst … fest machen
  rationale: Der Hifil von כון kann „bereiten“, „festigen“ oder „fest machen“ bedeuten. Mit „Herz“ als Objekt bringt „fest machen“ die Vorstellung von innerer Festigkeit zum Ausdruck und bewahrt zugleich die lexikalische Breite in einer Fußnote.
- source_word: לִבָּם
  choice: ihr Herz
  rationale: Das konkrete biblische Bild des Herzens bleibt erhalten und wird nicht deutend durch „Mut“, „Sinn“ oder „Inneres“ ersetzt.
- source_word: תַּקְשִׁיב
  choice: wird aufmerksam hinhören
  rationale: Der Hifil von קשׁב bezeichnet aufmerksames Hören. „Aufmerksam hinhören“ gibt diese Nuance ausdrücklich wieder.
- source_word: אָזְנֶךָ
  choice: dein Ohr
  rationale: Das poetische, anthropomorphe Bild des hebräischen Textes wird beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt den persönlichen Gottesnamen; die Transliteration bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֲנָוִים
  choice: die Demütigen
  alternative: die Gebeugten / die Sanftmütigen
  rationale: Der Ausdruck verbindet Niedrigkeit beziehungsweise Demut mit der Erfahrung von Bedrängnis. Die Hauptfassung legt ihn nicht ausschließlich sozial oder charakterlich fest.
- issue: Bedeutung von תָּכִין in Verbindung mit „Herz“
  choice: fest machen
  alternative: bereiten / festigen
  rationale: Die Übersetzung lässt Gottes stärkendes beziehungsweise bereitendes Handeln am Inneren der Betenden erkennen, ohne eine engere dogmatische Deutung einzutragen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die Satzstellung bleibt gut verständlich, während „dein Ohr“ als bewusst beibehaltenes poetisches Bild leicht markiert klingt. Die Zukunftsformen geben die hebräischen Imperfektformen als vertrauensvolle Erwartung wieder.
