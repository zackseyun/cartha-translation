  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: de
  text: In seinem Hochmut verfolgt der Gottlose den Armen[a]; mögen sie in den Anschlägen gefangen werden, die sie ersonnen haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist stark verdichtet. Möglich ist auch die Wiedergabe: „Im Hochmut des Gottlosen wird der Arme verfolgt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder als Feststellung: „Sie werden in den Anschlägen gefangen, die sie ersonnen haben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: in seinem Hochmut
  rationale: בְּ bezeichnet hier den Hochmut als Haltung beziehungsweise Beweggrund des Handelns. Das Possessivpronomen macht im Deutschen den Bezug auf den Gottlosen natürlich deutlich.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte maskuline Singularwort bezeichnet hier einen repräsentativen gottlosen beziehungsweise frevelhaften Menschen. „Der Gottlose“ entspricht dem gehobenen, aber verständlichen Psalmregister.
- source_word: יִדְלַק
  choice: verfolgt
  rationale: דלק kann „brennen“ oder „hitzig nachsetzen/verfolgen“ bedeuten. Im Zusammenhang bezeichnet es feindselige Verfolgung; die aktive Form gibt die naheliegende Zuordnung des Gottlosen als Subjekt wieder.
- source_word: עָנִי
  choice: den Armen
  rationale: עָנִי bezeichnet einen armen, bedrängten oder elenden Menschen. „Den Armen“ bewahrt den Singular und hält wirtschaftliche Not und gesellschaftliche Bedrängnis offen.
- source_word: יִתָּפְשׂוּ
  choice: mögen sie sich … verfangen
  rationale: Der Nifal-Imperfekt wird als Wunsch beziehungsweise Gebet verstanden. „Sich verfangen“ gibt das Ergriffen- oder Gefangenwerden idiomatisch wieder und lässt die Umkehrung ihrer eigenen Anschläge hervortreten.
- source_word: בִּמְזִמּוֹת
  choice: in den Anschlägen
  rationale: מְזִמּוֹת bezeichnet hier feindselige Pläne oder Machenschaften. „Anschläge“ vermittelt den schädlichen Vorsatz und verbindet sich natürlich mit „sich verfangen“.
- source_word: זוּ חָשָׁבוּ
  choice: die sie selbst geschmiedet haben
  rationale: זוּ leitet den Relativsatz ein, und חשב bezeichnet planendes Ausdenken. „Geschmiedet“ ist im Deutschen eine natürliche Verbindung mit „Anschlägen“; „selbst“ verdeutlicht die im Satz angelegte Vergeltungsumkehr, ohne einen neuen Handelnden einzuführen.
theological_decisions:
- issue: Syntaktische Zuordnung im ersten Halbvers
  choice: 'Der Gottlose ist Subjekt und der Arme Objekt: „der Gottlose verfolgt den Armen“'
  alternative: 'Passivisch beziehungsweise unpersönlich: „Im Hochmut des Gottlosen wird der Arme verfolgt“'
  rationale: Der unmarkierte hebräische Satz ist stark verdichtet und lässt die Rollen formal nicht völlig eindeutig erkennen. Die aktive Lesart ist kontextuell naheliegend und im Deutschen klar; die echte syntaktische Unschärfe bleibt in einer Fußnote erhalten.
- issue: Aussage oder Wunsch im zweiten Halbvers
  choice: 'Wunsch/Gebet: „mögen sie sich … verfangen“'
  alternative: 'Feststellung: „Sie verfangen sich …“'
  rationale: Der hebräische Imperfekt kann hier jussiv verstanden werden und passt so zum bittenden und vergeltenden Duktus des Psalms. Da auch eine indikativische Feststellung möglich ist, wird sie in der Fußnote dokumentiert.
- issue: Numeruswechsel und Bezug von „sie“
  choice: Der Wechsel vom repräsentativen Singular „der Gottlose“ zum Plural „sie“ bleibt erhalten
  alternative: Explizite Wiederaufnahme als „die Gottlosen“
  rationale: Das Hebräische wechselt vom Singular רָשָׁע zum pluralischen יִתָּפְשׂוּ/חָשָׁבוּ. Der deutsche Text bewahrt diesen markanten Wechsel, wobei „sie“ den Gottlosen als Vertreter einer Gruppe aufnimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmtypischem Klang. „Gottlose“, „Anschläge“ und „geschmiedet“ sind allgemein verständlich, ohne umgangssprachlich zu wirken. Die semantische und syntaktische Mehrdeutigkeit des Hebräischen wird nicht verdeckt, sondern durch knappe Fußnoten bewahrt.
