  text: עַל מֶ֤ה נִאֵ֖ץ רָשָׁ֥ע אֱלֹהִ֑ים אָמַ֥ר בְּ֝/לִבּ֗/וֹ לֹ֣א תִּדְרֹֽשׁ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: de
  text: 'Warum verachtet der Gottlose Gott? Er sagt in seinem Herzen: »Du wirst keine Rechenschaft fordern.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִאֵץ
  choice: verachtet
  rationale: Das Verb bezeichnet hier eine geringschätzige, schmähende Haltung gegenüber Gott; »verachtet« ist prägnant und im Deutschen natürlich.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv bezeichnet einen Menschen, der schuldhaft und gottwidrig handelt; »der Gottlose« bewahrt hier den religiös-moralischen Bezug.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: Die traditionelle und verständliche Wiedergabe bewahrt das biblische Bild für das innere Denken und Überlegen.
- source_word: לֹא תִּדְרֹשׁ
  choice: Du wirst nicht zur Rechenschaft ziehen
  rationale: דרש kann in diesem Zusammenhang das Einfordern beziehungsweise Ahnden von Schuld bezeichnen. Die Formulierung gibt den Sinn idiomatisch wieder, ohne die Aussage auf bloßes Nachforschen zu verengen.
theological_decisions:
- issue: Gottes Einfordern von Schuld
  choice: »Du wirst nicht zur Rechenschaft ziehen«
  alternative: »Du wirst es nicht untersuchen« / »Du wirst keine Rechenschaft fordern«
  rationale: Der Kontext handelt von der vermessenen Annahme des Gottlosen, Gott werde sein Tun nicht verfolgen und ahnden. Die gewählte Formulierung erhält den gerichtlichen Ernst, ohne näher festzulegen, wie oder wann Gott eingreift.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »Du« folgt der hebräischen Verbform; das rhetorische »Warum« und das Bild des Herzens bleiben erhalten.
