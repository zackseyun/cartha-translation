source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: de
  text: Seine Wege gelingen ihm zu jeder Zeit.[a] Deine Urteile sind in der Höhe, seinem Blick entzogen; alle seine Gegner schnaubt er verächtlich an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Wege sind zu jeder Zeit fest.“ Das hebräische Verb ist schwierig und wurde auch mit einer Wortbedeutung in Verbindung gebracht, die „sich winden“ oder „Kreißwehen haben“ bezeichnet. Der Zusammenhang spricht jedoch eher für anhaltenden Erfolg oder Sicherheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er bläst/schnaubt sie an“ – ein anschauliches Bild der Verachtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: gelingen
  rationale: Die Form ist lexikalisch schwierig. Im Zusammenhang beklagt der Psalm den anhaltenden Erfolg und die Selbstsicherheit des Frevlers; „gelingen“ gibt diesen Sinn natürlich wieder, ohne die Unsicherheit zu verschweigen.
- source_word: דרכ/ו
  choice: seine Wege
  rationale: Die hebräische Wendung bezeichnet den Lebenswandel beziehungsweise das Vorgehen einer Person. „Seine Wege“ bewahrt das poetische Bild.
- source_word: בְּכָל עֵת
  choice: zu jeder Zeit
  rationale: Die Formulierung drückt Beständigkeit aus und entspricht dem gehobenen poetischen Register.
- source_word: מָרוֹם מִשְׁפָּטֶיךָ מִנֶּגְדּוֹ
  choice: Deine Urteile sind hoch über ihm, außerhalb seines Blicks
  rationale: Die räumliche Metaphorik von Höhe und mangelnder Sichtbarkeit bleibt erhalten. Dadurch wird weder ausschließlich Unkenntnis noch bewusste Missachtung festgelegt.
- source_word: כָּל צֹרְרָיו
  choice: all seine Gegner
  rationale: „Gegner“ ist im modernen Deutsch natürlich und umfasst persönliche Feinde ebenso wie andere Widersacher.
- source_word: יָפִיחַ בָּהֶם
  choice: er schnaubt sie verächtlich an
  rationale: Das körperliche Bild eines verächtlichen Ausstoßens von Atem bleibt erhalten; „verächtlich“ verdeutlicht die im Kontext erkennbare Geste.
theological_decisions:
- issue: Bedeutung von יָחִילוּ für die Lage des Frevlers
  choice: Seine Wege gelingen fortwährend.
  alternative: Seine Wege sind jederzeit fest oder sicher; wörtlichere Ableitungen im Sinn von Sich-Winden oder Kreißen sind ebenfalls diskutiert worden.
  rationale: Der Kontext beklagt den scheinbar ungebrochenen Erfolg und Hochmut des Frevlers. Die alternative lexikalische Deutung wird in der Fußnote offengehalten.
- issue: Verhältnis des Frevlers zu Gottes Urteilen
  choice: Die Urteile sind bildlich hoch über ihm und seinem Blick entzogen.
  alternative: Die Urteile sind erhaben oder liegen ihm fern, möglicherweise im Sinn bewusster Nichtbeachtung.
  rationale: Die Übersetzung wahrt die räumliche Metapher und legt nicht abschließend fest, ob Unvermögen, Entfernung oder Missachtung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Psalmenmetaphorik. Der Gedankenstrich bildet die hervorgehobene Voranstellung von „all seine Gegner“ nach und hält den poetischen Rhythmus aufrecht.
