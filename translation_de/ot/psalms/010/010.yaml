  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: de
  text: Er kauert sich nieder, er beugt sich nieder; die Hilflosen fallen durch seine Macht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut dieses Verses ist schwierig. Die Schlusswendung kann auch »durch seine Stärke« oder, näher an der Form des Hebräischen, »durch seine Mächtigen« bedeuten; bildlich wurde sie auch als »in seine starken Klauen« verstanden.
    reason: lexical_alternative
  - marker: b
    text: 'Manche verstehen das Verb als »er fällt« und beziehen es auf den Bösen. Nach der hier gewählten Deutung sind die Hilflosen das Subjekt: Sie fallen durch seine Macht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדָכָה
  choice: Er kauert sich nieder
  rationale: Die schwierige Form wird im Zusammenhang mit dem folgenden Verb als Beschreibung der geduckten, lauernden Haltung des Bösen verstanden. Diese Wiedergabe bewahrt das Jagdbild des Kontexts, ohne die unsichere Form übermäßig festzulegen.
- source_word: יָשֹׁחַ
  choice: er duckt sich
  rationale: Das Verb bezeichnet ein Sichbeugen oder Niedersinken. »Sich ducken« ist hier natürlich und führt das Bild einer niedrigen, lauernden Haltung fort.
- source_word: וְנָפַל … חֵלְכָאִים
  choice: und die Hilflosen fallen
  rationale: Obwohl das Verb in der Einzahl steht, kann bei vorangestelltem Verb ein nachfolgendes pluralisches Subjekt stehen. Im unmittelbaren Zusammenhang sind daher die Hilflosen am plausibelsten das Subjekt; die alternative Zuordnung zum Bösen bleibt in einer Fußnote erhalten.
- source_word: בַּעֲצוּמָיו
  choice: seiner Gewalt zum Opfer
  rationale: Die schwierige Pluralform kann die Macht beziehungsweise die starken Glieder oder Werkzeuge des Bösen bezeichnen. Die idiomatische Wendung gibt den wahrscheinlichen Sinn wieder, während andere Deutungen in der Fußnote genannt werden.
- source_word: חֵלְכָאִים
  choice: die Hilflosen
  rationale: Das seltene Wort bezeichnet sozial Schwache, Unglückliche oder Schutzlose. »Die Hilflosen« ist verständlich und entspricht dem Kontext, in dem der Böse verwundbaren Menschen nachstellt.
theological_decisions:
- issue: Subjekt von וְנָפַל
  choice: Die Hilflosen fallen.
  alternative: Der Böse fällt beziehungsweise wirft sich nieder.
  rationale: Die gewählte Lesart passt zum Bild des Bösen, der den Schwachen auflauert und sie in seine Gewalt bringt. Wegen der gedrängten und schwierigen Syntax wird die andere mögliche Konstruktion ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden ersten Verben bewahren die körperliche und räuberische Bildsprache; die schwer verständliche Schlusswendung wird im Haupttext idiomatisch wiedergegeben, während die echte lexikalische und syntaktische Unsicherheit in den Fußnoten sichtbar bleibt.
