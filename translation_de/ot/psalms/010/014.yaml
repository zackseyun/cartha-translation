id: PSA.10.14
reference: Psalms 10:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: de
  text: Du hast es gesehen, denn du blickst auf Leid und Kummer, um die Sache in deine Hand zu nehmen.[a] Dir vertraut sich der Hilflose an;[b] dem Vaterlosen[c] bist du ein Helfer gewesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um es in deine Hand zu geben (oder: zu legen)“; die hebräische Wendung kann bedeuten, dass Gott sich der Sache annimmt und handelt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Der Unglückliche überlässt dir seine Sache.“ Das Hebräische kann sich auf den Hilflosen selbst oder auf seine Angelegenheit beziehen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „der Waise“. Das hebräische Wort bezeichnet besonders einen Menschen, der keinen Vater hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: Du hast es gesehen
  rationale: Das Qal-Perfekt 2. Person Singular richtet sich an Gott. Das deutsche Perfekt bezeichnet natürlich Gottes bereits erwiesenes Wahrnehmen, ohne es auf einen fernen Zeitpunkt festzulegen.
- source_word: עָמָל
  choice: Leid
  rationale: Im Klagepsalm bezeichnet das Wort bedrückende Not beziehungsweise schädigendes Unrecht, nicht bloß Arbeit oder Mühe. „Leid“ passt zur Lage der Bedrängten und bleibt semantisch offen.
- source_word: כַעַס
  choice: Kummer
  rationale: Das Substantiv kann Verdruss, Kränkung oder den dadurch verursachten Kummer bezeichnen. In der Verbindung mit עָמָל gibt „Kummer“ die wahrgenommene Not wieder, ohne das Wort als Gottes Zorn zu deuten.
- source_word: תַּבִּיט
  choice: du blickst auf
  rationale: Das Hifil von נבט bezeichnet aufmerksames Hinsehen beziehungsweise Beachten. Die Formulierung bewahrt das Bild des Sehens in natürlichem Deutsch.
- source_word: לָתֵת בְּיָדֶךָ
  choice: um die Sache in deine Hand zu nehmen
  rationale: Wörtlich steht „um in deine Hand zu geben/legen“. Im Zusammenhang deutet die Wendung darauf, dass Gott sich der wahrgenommenen Not annimmt. „Die Sache“ macht den im Hebräischen unausgesprochenen Bezug verständlich, ohne die Art des Eingreifens festzulegen; die wörtlichere Möglichkeit wird in der Fußnote erhalten.
- source_word: עָלֶיךָ יַעֲזֹב
  choice: Dir vertraut sich … an
  rationale: עזב mit עַל drückt hier aus, dass der Schutzlose sich oder seine Sache Gott überlässt. „Sich anvertrauen“ vermittelt diese Abhängigkeit, ohne den negativen Beiklang von „verlassen“ einzutragen.
- source_word: חֵלֶכָה
  choice: der Hilflose
  rationale: Die seltene Bezeichnung meint einen schwachen, unglücklichen oder schutzlosen Menschen. „Der Hilflose“ entspricht der Abhängigkeit von Gottes Hilfe und der Parallele zum Vaterlosen.
- source_word: יָתוֹם
  choice: der Vaterlose
  rationale: Das Wort bezeichnet besonders ein Kind, das keinen Vater und damit keinen maßgeblichen familiären Beschützer hat. „Vaterloser“ bewahrt diese sozialrechtliche Kategorie; „Waise“ bleibt eine geläufige Alternative.
- source_word: עוֹזֵר
  choice: Helfer
  rationale: Das Partizip wird prädikativ und persönlich von Gott gebraucht. „Helfer“ ist knapp, würdig und nah an der hebräischen Form.
theological_decisions:
- issue: Bezeichnet Gottes Sehen nur Wahrnehmung oder führt es zum Eingreifen?
  choice: Gott sieht Leid und Kummer und nimmt die Sache in seine Hand.
  alternative: Gott sieht Leid und Kummer, um sie in seine Hand zu legen beziehungsweise geben zu lassen.
  rationale: Der Infinitiv לָתֵת mit בְּיָדֶךָ legt im Kontext tätiges Aufgreifen nahe, doch die ungewöhnliche Wendung lässt eine wörtlichere Auffassung zu. Der Haupttext drückt Eingreifen aus, ohne dessen Form zu bestimmen; die Fußnote bewahrt die sprachliche Mehrdeutigkeit.
- issue: Was überlässt der Hilflose Gott?
  choice: Der Hilflose vertraut sich Gott an.
  alternative: Der Hilflose überlässt Gott seine Sache.
  rationale: Das Hebräische nennt kein ausdrückliches Objekt und kann daher die Person selbst oder ihre Sache meinen. Der Haupttext gibt das persönliche Vertrauen wieder; die Fußnote hält die sachbezogene Lesart offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Psalmton. „Blickst auf“, „anvertrauen“ und „Helfer“ sind geläufig, ohne umgangssprachlich zu wirken. Die Satzstruktur folgt dem hebräischen Gedankengang, während Fußnoten echte lexikalische und syntaktische Mehrdeutigkeiten sichtbar halten.
