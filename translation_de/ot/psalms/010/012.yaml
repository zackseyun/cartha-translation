  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: de
  text: Steh auf, Jahwe! Gott, erhebe deine Hand! Vergiss die Bedrängten[a] nicht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Armen“, „die Demütigen“ oder „die Unterdrückten“. Das hebräische Wort bezeichnet Menschen, die erniedrigt, notleidend oder schutzlos sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ von קום ist ein dringender Aufruf an Gott. „Steh auf“ ist gegenwärtiges, natürliches Deutsch und bewahrt die Bildsprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵל
  choice: Gott
  rationale: אֵל steht als direkte Anrede parallel zu „Jahwe“. Im Deutschen genügt „Gott“ ohne ein zusätzliches Anredepartikel.
- source_word: נְשָׂא יָדֶךָ
  choice: erhebe deine Hand
  rationale: Die konkrete anthropomorphe Wendung bleibt erhalten; sie ruft bildhaft zu Gottes Eingreifen auf, ohne dieses näher auszudeuten.
- source_word: אַל תִּשְׁכַּח
  choice: Vergiss … nicht
  rationale: Dies entspricht der negativen Aufforderung und bewahrt das hebräische Bild des Nichtvergessens statt es als „nicht übersehen“ auszulegen.
- source_word: עניים
  choice: die Bedrängten
  rationale: Der Ausdruck bezeichnet Menschen, die erniedrigt, notleidend oder schutzlos sind. Im Zusammenhang des Psalms hebt „die Bedrängten“ ihre Lage unter gewaltsamer Unterdrückung hervor, ohne den Sinn auf wirtschaftliche Armut zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von עניים
  choice: die Bedrängten
  alternative: die Armen; die Demütigen; die Unterdrückten
  rationale: Die hebräische Form kann materielle Armut, Erniedrigung, Schutzlosigkeit oder Unterdrückung bezeichnen. Die Übersetzung wahrt den Schwerpunkt des Kontexts; eine Fußnote hält die echte Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen, dringlichen Imperativen. Die poetische Parallelität und das konkrete Bild der erhobenen Hand bleiben erhalten.
