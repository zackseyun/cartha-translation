lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: Recht zu verschaffen
  rationale: Der Infinitiv bezeichnet hier im Anschluss an den vorherigen Vers Zweck beziehungsweise Folge von Gottes Hören. Die Wendung gibt den rechtlichen Sinn von שׁפט und das Eintreten für Schutzlose im Deutschen natürlich wieder.
- source_word: יָתוֹם
  choice: dem Waisen
  rationale: יָתוֹם bezeichnet ein elternloses beziehungsweise besonders vaterloses und daher schutzbedürftiges Kind. „Waise“ ist im modernen Deutschen die natürliche Bezeichnung, ohne die soziale Schutzbedürftigkeit zu verlieren.
- source_word: דָךְ
  choice: dem Unterdrückten
  rationale: Das Wort bezeichnet einen Niedergedrückten, Zerschlagenen oder Bedrängten. „Unterdrückten“ vermittelt die soziale und existenzielle Not verständlich, ohne die Bildsprache unnötig zu verengen.
- source_word: בַּל יוֹסִיף עוֹד
  choice: damit … keinen … mehr
  rationale: 'בַּל mit יוֹסִיף עוֹד bildet eine verneinte Zweck- oder Folgekonstruktion: Das Schreckenverbreiten soll nicht länger fortgesetzt werden.'
- source_word: לַעֲרֹץ
  choice: Schrecken … verbreitet
  rationale: ערץ meint, Schrecken oder Furcht hervorzurufen. Die deutsche Wendung bewahrt diese Bedeutung deutlicher als das allgemeinere „unterdrücken“.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: אֱנוֹשׁ bezeichnet den Menschen häufig unter dem Gesichtspunkt seiner Sterblichkeit und Schwäche. Der Singular bleibt erhalten und wird durch den folgenden Ausdruck näher bestimmt.
- source_word: מִן הָאָרֶץ
  choice: von der Erde
  rationale: Die Präposition מִן wird direkt wiedergegeben. In Verbindung mit אֱנוֹשׁ unterstreicht die Formulierung den irdischen, vergänglichen Menschen im Gegensatz zu Gott.
theological_decisions:
- issue: Generischer maskuliner Singular אֱנוֹשׁ
  choice: der Mensch von der Erde
  alternative: die Sterblichen auf der Erde
  rationale: Der hebräische Text verwendet einen generischen Singular. „Der Mensch“ bewahrt diese rhetorische Form und zugleich die Spannung zwischen menschlicher Vergänglichkeit und Gottes richterlichem Handeln.
- issue: Funktion der abschließenden Negation
  choice: 'Zweck- beziehungsweise Folgesatz: „damit … keinen Schrecken mehr verbreitet“'
  alternative: 'Aussage einer feststehenden Folge: „sodass … keinen Schrecken mehr verbreiten wird“'
  rationale: Die Konstruktion lässt Zweck und erwartete Folge eng zusammenstehen. „Damit“ erhält den Anschluss an Gottes Rechtshandeln, ohne die Aussage zu einer bloßen Vorhersage zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch den vorherigen Zusammenhang fort; deshalb beginnt die Übersetzung mit „um“. Die Rechts- und Schutzsprache bleibt erhalten, während die ungewöhnliche hebräische Bezeichnung des menschlichen Bedrängers bewusst nicht geglättet wird.
