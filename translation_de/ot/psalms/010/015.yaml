base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/015.yaml
  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: de
  text: Zerbrich den Arm des Frevlers und des Übeltäters[a]; forsche seiner Bosheit nach, bis du nichts mehr davon findest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Akzentgliederung lässt auch eine Verbindung von „der Böse“ mit dem folgenden Satzteil zu. Die genaue syntaktische Zuordnung bleibt daher offen.
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: שְׁבֹר
  choice: Zerbrich
  rationale: Der Imperativ richtet eine eindringliche Bitte an Gott. „Zerbrich“ gibt die konkrete und kraftvolle Bildsprache natürlich wieder.
- source_word: זְרוֹעַ
  choice: Arm
  rationale: Das konkrete Bild des hebräischen Textes bleibt erhalten; im Zusammenhang steht der Arm zugleich für die Macht und Handlungsfähigkeit des Frevlers.
- source_word: רָשָׁע
  choice: Frevler
  rationale: Das substantivierte Adjektiv bezeichnet hier einen schuldhaft und gewalttätig handelnden Menschen. „Frevler“ bewahrt den repräsentativen Singular und den gehobenen poetischen Ton.
- source_word: וָרָע
  choice: und des Bösen
  rationale: Die Form kann als zweite substantivische Bezeichnung parallel zu רָשָׁע verstanden werden. „Des Bösen“ hält diese Parallelität fest, ohne den Ausdruck vorschnell auf eine bestimmte Art böser Tat einzuengen.
- source_word: תִּדְרוֹשׁ
  choice: forsche … nach
  rationale: דרש bezeichnet ein suchendes Erforschen oder Nachforschen und kann im Kontext zugleich den Gedanken göttlicher Rechenschaft und Ahndung tragen. Die gewählte Formulierung bleibt nahe am Suchbild.
- source_word: רִשְׁעוֹ
  choice: seiner Bosheit
  rationale: Die Wiedergabe entspricht dem Grundsinn des Nomens und erhält die Wortbeziehung zu רָשָׁע, soweit dies im Deutschen natürlich möglich ist.
- source_word: בַל תִּמְצָא
  choice: bis du nichts mehr davon findest
  rationale: Die Wendung beschreibt als erbetenes Ergebnis des göttlichen Nachforschens, dass von der Bosheit nichts mehr aufzufinden ist. „Davon“ macht den deutschen Rückbezug eindeutig, ohne die hebräische Aussage weiter zu präzisieren.
theological_decisions:
- issue: Das Bild vom Arm des Frevlers
  choice: Das konkrete Bild „Arm“ bleibt im Haupttext erhalten.
  alternative: Abstrakte Wiedergabe mit „Macht“ oder „Stärke“.
  rationale: Die Bitte zielt darauf, dass Gott die Fähigkeit des Frevlers zum Unrechttun bricht. Das poetische Körperbild vermittelt dies, ohne es auslegend zu ersetzen.
- issue: Zuordnung von וָרָע
  choice: 'Als zweite Personenbezeichnung parallel zu „Frevler“: „und des Bösen“.'
  alternative: Als abgesetzte Bezeichnung im folgenden Satzteil oder allgemeiner als „das Böse“.
  rationale: Die parallele Personenbezeichnung ergibt einen verständlichen deutschen Satz und ist grammatisch möglich; wegen der masoretischen Gliederung und der knappen hebräischen Syntax wird die alternative Auffassung in der Fußnote offengehalten.
- issue: Sinn der Schlusswendung בַל תִּמְצָא
  choice: „bis du nichts mehr davon findest“
  alternative: „sodass du nichts davon findest“ oder „auch wenn du danach suchst, wirst du nichts finden“.
  rationale: Die gewählte Fassung versteht die Wendung als gewünschtes Ergebnis vollständigen göttlichen Einschreitens. Sie wahrt die Spannung des Bildes, ohne ausdrücklich Vernichtung oder eine bestimmte Form des Gerichts zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Frevler“ ist leicht gehoben, im Psalmenkontext jedoch verständlich und prägnant. Die Semikolonstruktur bildet den zweigliedrigen Gebetsruf ab.
