base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: de
  text: 'In seinem hochmütigen Auftreten sucht der Frevler nicht; sein ganzes Denken ist: »Es gibt keinen Gott.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott kommt in all seinen Gedanken nicht vor.« Der hebräische Satz kann entweder die Leugnung Gottes als Inhalt seines Denkens ausdrücken oder besagen, dass Gott in seinem Denken keinen Platz hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: der Frevler
  rationale: Das substantivierte maskuline Singularwort zeichnet einen einzelnen, zugleich repräsentativen gottlosen Menschen. »Frevler« ist im poetischen Bibeldeutsch verständlich und gibt die moralische Dimension wieder.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: in seinem hochmütigen Auftreten
  rationale: גֹבַהּ bezeichnet Höhe oder Überheblichkeit, אַף wörtlich Nase beziehungsweise Gesicht. Die Wendung beschreibt am ehesten eine hochmütige Haltung oder Miene; die natürliche deutsche Formulierung bewahrt den Sinn des konkreten Bildes.
- source_word: בַּל יִדְרֹשׁ
  choice: fragt ... nicht nach Gott
  rationale: Die poetische Negation mit dem Imperfekt beschreibt die kennzeichnende Haltung des Frevlers. דרש kann »suchen« oder »nach jemandem fragen/sich um ihn kümmern« bedeuten. Gott ist syntaktisch nicht als Objekt ausgedrückt, wird aber aus dem Folgeglied erschlossen.
- source_word: אֵין אֱלֹהִים
  choice: Es gibt keinen Gott
  rationale: Die Existenzverneinung wird knapp und unmittelbar als Inhalt des Denkens wiedergegeben.
- source_word: כָּל מְזִמּוֹתָיו
  choice: sein ganzes Denken
  rationale: מְזִמּוֹת kann Gedanken, Pläne oder Anschläge bezeichnen. Hier meint es die gesamte Gedankenwelt; »Denken« vermeidet eine unnötige Verengung auf verbrecherische Pläne.
theological_decisions:
- issue: Syntaktisches Verhältnis des Schlussglieds
  choice: »Es gibt keinen Gott« wird als Inhalt des gesamten Denkens des Frevlers verstanden.
  alternative: »Gott kommt in all seinen Gedanken nicht vor.«
  rationale: Die hebräische Wortfolge erlaubt sowohl eine inhaltliche Aussage seines Denkens als auch die Feststellung, dass Gott darin keinen Platz hat. Die Hauptfassung folgt der pointierten Existenzverneinung; die plausible Alternative bleibt in der Fußnote erhalten.
- issue: Nicht ausdrücklich genanntes Objekt von יִדְרֹשׁ
  choice: »nach Gott fragen«
  alternative: 'objektlos: »sucht/fragt nicht«'
  rationale: Das folgende אֱלֹהִים legt Gott als sachlich gemeinten Bezug nahe. Die Ergänzung schafft idiomatisches Deutsch, ohne einen anderen theologischen Gegenstand einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Knappheit. »Hochmütiges Auftreten« überträgt das wörtliche Bild von der »Höhe seiner Nase/seines Gesichts« idiomatisch; »Frevler« hält den Psalmton, ohne altertümliche Syntax.
