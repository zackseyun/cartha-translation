base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: de
  text: 'Er sagt in seinem Herzen: »Ich werde nicht wanken[a]; von Generation zu Generation werde ich kein Unglück erleben.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde nicht erschüttert werden“ beziehungsweise „nicht ins Wanken gebracht werden“. Das hebräische Verb kann bedeuten: wanken, erschüttert werden oder bewegt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Schlusssatz ist im Hebräischen elliptisch. Wörtlicher könnte er auch verstanden werden: „von Generation zu Generation, der nicht im Unglück ist“; sinngemäß auch: „Nie werde ich Unheil erleben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: Er sagt
  rationale: Das hebräische Perfekt kann in poetischer Darstellung eine gegenwärtig bzw. anschaulich geschilderte Aussage einführen. Das Präsens passt zur fortlaufenden Charakterisierung des Frevlers.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: Die Wendung bezeichnet inneres Denken oder ein Selbstgespräch. Die deutsche Form bewahrt das hebräische Bild und ist zugleich verständlich.
- source_word: בַּל אֶמּוֹט
  choice: Ich werde nicht wanken
  rationale: Das poetische בַּל verneint, während das Nifal von מוט das Wanken, Erschüttertwerden oder Bewegtwerden bezeichnet. „Nicht wanken“ bewahrt das Bild selbstsicherer Stabilität.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die feste Wendung bezeichnet ein Fortbestehen über aufeinanderfolgende Generationen hinweg. Die gewählte Form ist im Deutschen natürlich und nah an der hebräischen Ausdrucksweise.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: werde ich kein Unglück erleben
  rationale: Die hebräische Schlussklausel ist elliptisch. רָע mit ב kann einen Zustand des Unglücks, Unheils oder der Not bezeichnen. Die Übersetzung führt die Ich-Perspektive des inneren Selbstgesprächs fort und formuliert den Sinn in natürlichem Deutsch, ohne die Unsicherheit zu verschweigen.
theological_decisions:
- issue: Elliptische Schlussklausel und Sprecherperspektive
  choice: 'Die Schlussklausel wird als fortgesetzte Selbstaussage des Frevlers wiedergegeben: „werde ich kein Unglück erleben“.'
  alternative: 'Relativische Wiedergabe: „der nicht im Unglück ist“, oder zusammenfassend: „Nie werde ich Unheil erleben.“'
  rationale: Der Zusammenhang legt eine selbstsichere Prahlerei in der ersten Person nahe. Da die hebräische Syntax jedoch verkürzt und mehrdeutig ist, wird die alternative relativische Deutung in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In seinem Herzen“ bewahrt das hebräische Bild des inneren Redens; „nicht wanken“ und „von Generation zu Generation“ halten den poetischen Ton, während die schwierige Schlussklausel verständlich formuliert und ihre echte Mehrdeutigkeit in der Fußnote offengelegt wird.
