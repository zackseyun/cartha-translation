  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: de
  text: Warum, Jahwe, stehst du in der Ferne? Warum verbirgst du dich in Zeiten der Not?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה
  choice: Warum
  rationale: Das Frageadverb eröffnet die Klage unmittelbar und bewahrt ihre emotionale Kraft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תַּעֲמֹד
  choice: stehst du
  rationale: Die Grundbedeutung »stehen« erhält das räumliche und relationale Bild des Hebräischen.
- source_word: בְּרָחוֹק
  choice: in der Ferne
  rationale: Die Formulierung gibt die empfundene Distanz Gottes in natürlichem, würdigem Deutsch wieder.
- source_word: תַּעְלִים
  choice: verbirgst du dich
  rationale: Die reflexive Wiedergabe drückt aus, dass Gott sich der Wahrnehmung entzieht, ohne den Sinn weiter auszudeuten.
- source_word: לְעִתּוֹת
  choice: in Zeiten
  rationale: Der Plural wird als natürliche deutsche Zeitangabe bewahrt.
- source_word: בַּצָּרָה
  choice: der Not
  rationale: »Not« umfasst Bedrängnis und bedrückende Lebenslagen und passt zum gehobenen, allgemein verständlichen Register des Psalms.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als persönlichen Namen.
- issue: Wiederholung der Frage im zweiten Halbvers
  choice: Das implizite »Warum« wird wiederholt.
  alternative: 'Den zweiten Halbvers als Aussage wiedergeben: »Du verbirgst dich in Zeiten der Not.«'
  rationale: Obwohl לָמָה nur zu Beginn steht, umfasst die Frage aufgrund des poetischen Parallelismus beide Halbverse. Die Wiederholung ist im Deutschen klar und erhält den Klagecharakter.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem poetischem Ton. Die räumlichen Bilder »stehen« und »in der Ferne« bleiben erhalten; die Klage wird nicht theologisch abgeschwächt oder erklärt.
