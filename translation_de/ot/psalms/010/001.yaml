  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Kola präzise wieder: לָמָה als direkte Klagefrage, יְהוָה als „Jahwe“, תעמד ברחוק mit dem räumlichen Bild „stehst du in der Ferne“ sowie תעלים לעתות בצרה als Gottes Sich-Verbergen „in Zeiten der Not“. Die im Deutschen wiederholte Fragepartikel „Warum“ ist als Wiedergabe der parallelen Frageform sinnvoll und fügt keine sachliche Aussage hinzu.'
  naturalness: „Warum, Jahwe, stehst du in der Ferne? Warum verbirgst du dich in Zeiten der Not?“ ist idiomatisches modernes Standarddeutsch und bewahrt zugleich den würdigen, klagenden Ton des Psalms.
  terminology: „Jahwe“ folgt der vorgegebenen Wiedergabe des Tetragramms. „Not“ ist eine angemessene, ausreichend weite Wiedergabe von צָרָה; „in Zeiten“ erhält den hebräischen Plural. Die Anrede und das Pronomen „du“ sind im Deutschen natürlich und registergerecht.
