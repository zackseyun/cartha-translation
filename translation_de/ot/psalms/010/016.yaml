id: PSA.10.16
reference: Psalms 10:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָ/עֶ֑ד אָבְד֥וּ ג֝וֹיִ֗ם מֵֽ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: de
  text: Jahwe ist König für immer und ewig; die Nationen sind aus seinem Land verschwunden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von seiner Erde“. Das hebräische Wort kann je nach Zusammenhang „Land“ oder „Erde“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: מֶלֶךְ
  choice: ist König
  rationale: Die nominale Aussage des Hebräischen bleibt erhalten und klingt im Deutschen natürlich.
- source_word: עוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste deutsche Wendung bewahrt die verstärkende Aussage unbegrenzter Dauer.
- source_word: אָבְדוּ
  choice: sind verschwunden
  rationale: Das Perfekt bezeichnet ein eingetretenes Ergebnis; „sind verschwunden“ gibt das mögliche Zugrundegehen beziehungsweise Nicht-mehr-Vorhandensein wieder, ohne ausdrücklich eine passive Vernichtung einzutragen.
- source_word: גּוֹיִם
  choice: die Nationen
  rationale: Gemeint sind hier Völker beziehungsweise fremde Nationen, nicht eine ausdrücklich theologische Kategorie von Nichtjuden.
- source_word: מֵאַרְצוֹ
  choice: aus seinem Land
  rationale: אֶרֶץ bezeichnet kontextuell wahrscheinlich das Land als Herrschaftsgebiet Jahwes; die ebenfalls mögliche umfassendere Bedeutung „Erde“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der im Vers stehende Eigenname wird bewahrt und nicht durch einen Herrschaftstitel ersetzt.
- issue: Bedeutungsumfang von אַרְצוֹ
  choice: seinem Land
  alternative: seiner Erde
  rationale: Der unmittelbare Zusammenhang legt die konkrete Bedeutung „Land“ nahe, während „Erde“ als universale Lesart sprachlich möglich bleibt und daher in einer Fußnote genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele, knappe Aussageform des hebräischen Verses bleibt erhalten; das Semikolon verbindet Gottes ewige Königsherrschaft mit dem Verschwinden der Nationen.
