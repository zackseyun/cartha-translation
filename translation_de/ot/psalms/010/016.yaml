  source_fidelity: Die Übersetzung gibt die nominale Königsaussage, die emphatische Zeitformel und die abgeschlossene Aussage von אָבְדוּ angemessen wieder. „Sind ... verschwunden“ bildet das Ergebnis des Zugrundegehens bzw. Nicht-mehr-Vorhandenseins im deutschen Satz mit der Ortsangabe idiomatisch ab, ohne ein im Hebräischen nicht ausgedrücktes Passiv einzutragen. „Aus seinem Land“ entspricht מֵאַרְצוֹ; die mögliche weitere Bedeutung „Erde“ ist korrekt vermerkt.
