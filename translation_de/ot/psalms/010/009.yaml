base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: de
  text: Er lauert im Versteck wie ein Löwe in seinem Unterschlupf[a]; er lauert darauf, den Armen zu packen. Er packt den Armen, indem er ihn in sein Netz zieht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seinem Dickicht«; das hebräische Wort kann eine Hütte, einen Unterschlupf oder ein schützendes Dickicht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Er packt den Armen, indem er ihn mit seinem Netz heranzieht.«'
    reason: syntactic_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: lauert
  rationale: Das Verb ארב bezeichnet das verborgene Warten auf einen Angriff. »lauert« ist im Deutschen natürlich, prägnant und bewahrt durch seine Wiederholung die poetische Wirkung.
- source_word: בַּמִּסְתָּר
  choice: im Versteck
  rationale: מִסְתָּר kann einen verborgenen Ort oder Verborgenheit bezeichnen. »im Versteck« gibt den örtlichen Sinn im Zusammenhang des Auflauerns klar wieder.
- source_word: כְּאַרְיֵה
  choice: wie ein Löwe
  rationale: Die direkte Wiedergabe erhält das Bild des gefährlichen Raubtiers.
- source_word: בְסֻכֹּה
  choice: in seinem Dickicht
  rationale: סֻכָּה kann eine Hütte, einen Unterschlupf oder ein schützendes Dickicht bezeichnen. Im Löwenvergleich passt »Dickicht« als verborgener Ort des Auflauerns, ohne das Wort auf eine eigentliche Tierhöhle festzulegen.
- source_word: לַחֲטוֹף
  choice: darauf, … zu packen
  rationale: חטף bezeichnet ein plötzliches, gewaltsames Ergreifen. »packen« ist verständlich und kraftvoll.
- source_word: עָנִי
  choice: den Armen
  rationale: עָנִי kann arm, bedrängt oder elend bezeichnen. Im Zusammenhang sozialer Unterdrückung ist »der Arme« die direkte Wiedergabe, wobei seine Schutzlosigkeit mitschwingt.
- source_word: יַחְטֹף
  choice: Er packt
  rationale: Die Wiederholung desselben deutschen Verbs bildet die hebräische Wiederholung von חטף ab.
- source_word: בְּמָשְׁכוֹ בְרִשְׁתּוֹ
  choice: und zieht ihn in sein Netz
  rationale: Die Konstruktion kann Mittel oder Begleitumstand ausdrücken. Diese Wiedergabe ergibt ein natürliches deutsches Bild des Einfangens, während die mögliche instrumentale Deutung in der Fußnote erhalten bleibt.
