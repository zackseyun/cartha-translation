  text: אָלָ֤ה פִּ֣י/הוּ מָ֭לֵא וּ/מִרְמ֣וֹת וָ/תֹ֑ךְ תַּ֥חַת לְ֝שׁוֹנ֗/וֹ עָמָ֥ל וָ/אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/007.yaml
  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: de
  text: Sein Mund ist voll Fluch[a], Täuschung und Bedrückung; unter seiner Zunge liegen Unheil und Bosheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verfluchung“; das hebräische Wort kann in anderen Zusammenhängen auch „Schwur“ bedeuten, doch hier spricht der Zusammenhang feindseliger Rede für „Fluch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mühsal und Unrecht“ statt „Unheil und Bosheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: Fluch
  rationale: Im Zusammenhang feindseliger Rede bezeichnet das Substantiv am ehesten einen Fluch; „Fluch“ bewahrt zudem die substantivische Form des Hebräischen.
- source_word: פִּיהוּ
  choice: sein Mund
  rationale: Die wörtliche Wiedergabe erhält das hebräische Bild für das Reden.
- source_word: מָלֵא
  choice: ist voll
  rationale: Natürliche deutsche Entsprechung, die das Bild der Fülle bewahrt.
- source_word: מִרְמוֹת
  choice: Täuschung
  rationale: Das Wort bezeichnet trügerisches oder treuloses Verhalten; „Täuschung“ ist hier prägnant und idiomatisch.
- source_word: תֹךְ
  choice: Bedrückung
  rationale: In diesem Zusammenhang bezeichnet das Wort schädigendes, ausbeuterisches Unrecht; „Bedrückung“ erhält dessen soziale und gewaltsame Dimension.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: unter seiner Zunge
  rationale: Die formnahe Wiedergabe bewahrt das eindrückliche Bild von verborgenem beziehungsweise bereitliegendem bösem Reden.
- source_word: עָמָל
  choice: Unheil
  rationale: Hier geht es nicht um gewöhnliche Mühe oder Arbeit, sondern um schädigendes Unheil.
- source_word: אָוֶן
  choice: Bosheit
  rationale: Das Wort bezeichnet moralisch verwerfliches Unrecht; „Bosheit“ gibt dieses Gewicht in verständlichem modernem Deutsch wieder.
