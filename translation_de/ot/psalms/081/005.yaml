  text: עֵ֤דוּת בִּֽ/יה֘וֹסֵ֤ף שָׂמ֗/וֹ בְּ֭/צֵאת/וֹ עַל אֶ֣רֶץ מִצְרָ֑יִם שְׂפַ֖ת לֹא יָדַ֣עְתִּי אֶשְׁמָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: de
  text: 'Er setzte es für Josef als Zeugnis fest[b], als er über das Land Ägypten auszog[a]. Ich hörte eine Sprache, die ich nicht kannte[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen das Land Ägypten«. Die hebräische Präposition kann hier sowohl »über« als auch »gegen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: »Josef« steht hier wahrscheinlich für das Volk Israel, besonders im Zusammenhang des Auszugs; möglicherweise sind die von Josef abstammenden Stämme besonders im Blick. Der hebräische Name bleibt im Text erhalten.
    reason: cross_reference
  - marker: c
    text: 'Oder: »Ich höre eine Sprache, die ich nicht kenne«. Die hebräische Verbform kann in diesem poetischen Zusammenhang gegenwärtig oder vergangen verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: Zeugnis
  rationale: Das Substantiv bezeichnet ein Zeugnis oder eine Bezeugung und kann im rechtlich-kultischen Zusammenhang auch eine verbindliche Bestimmung meinen. »Zeugnis« bewahrt den unmittelbaren Wortsinn und den Bezug auf Gottes Einsetzung.
- source_word: בִּיהוֹסֵף
  choice: bei Josef
  rationale: Die Präposition ב kann hier die Zuordnung zu einer Gemeinschaft ausdrücken. »Bei Josef« bleibt näher am Hebräischen als die ausdeutende Wiedergabe »für Israel« und lässt Josef als Sammelbezeichnung für das Gottesvolk stehen.
- source_word: שָׂמוֹ
  choice: Er setzte es … ein
  rationale: שׂים bedeutet »setzen, stellen, einsetzen«. Die Form enthält ein maskulines Objektpronomen; »es« nimmt die zuvor genannte Ordnung auf, ohne deren genaue Art zusätzlich festzulegen.
- source_word: בְּצֵאתוֹ
  choice: als er … auszog
  rationale: Der Infinitiv mit ב hat zeitliche Bedeutung. Das männliche Suffix wird mit »er« wiedergegeben, sodass der im Hebräischen nicht ausdrücklich bestimmte Bezug erhalten bleibt.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: über das Land Ägypten
  rationale: עַל kann »über«, »auf« oder in feindlichem Sinn »gegen« bedeuten. »Über« lässt sowohl Bewegung als auch machtvolles Handeln im ganzen Land anklingen, ohne die feindliche Bedeutung zwingend festzulegen.
- source_word: שְׂפַת
  choice: eine Sprache
  rationale: Wörtlich bedeutet das Wort »Lippe«, bezeichnet idiomatisch jedoch Sprache oder Rede. »Eine Sprache« ist im Deutschen die natürliche Wiedergabe.
- source_word: לֹא יָדַעְתִּי
  choice: die ich nicht kannte
  rationale: Das Perfekt beschreibt hier die unbekannte Sprache. Der deutsche Relativsatz gibt den Sinn natürlich wieder, ohne eine unnötig starre Vorzeitigkeit einzuführen.
- source_word: אֶשְׁמָע
  choice: hörte ich
  rationale: Der Imperfekt kann in der poetischen Erzählung vergangen verstanden werden. Die Nachstellung des Verbs erhält den hervorgehobenen Gegenstand »eine Sprache« und führt passend zur folgenden Gottesrede hin.
theological_decisions:
- issue: Bezug des Namens »Josef«
  choice: Der Name Josef bleibt im Haupttext erhalten und wird kollektiv verstanden, ohne ihn durch »Israel« zu ersetzen.
  alternative: Josef könnte enger die Nordstämme beziehungsweise Ephraim bezeichnen oder in der Übersetzung direkt als »Israel« wiedergegeben werden.
  rationale: Der hebräische Text nennt ausdrücklich Josef. Die Beibehaltung des Namens wahrt sowohl den möglichen gesamtisraelitischen als auch den engeren stammesgeschichtlichen Bezug.
- issue: Subjekt von »als er auszog«
  choice: Das Pronomen »er« bleibt ohne ausdrückliche Identifikation stehen.
  alternative: Man könnte den Ausziehenden ausdrücklich als Gott oder als Josef beziehungsweise Israel bestimmen.
  rationale: Das hebräische Suffix nennt den Bezug nicht eindeutig. Eine ausdrückliche Identifikation würde eine echte syntaktische und theologische Spannung auflösen.
- issue: Sprecherwechsel und Zeitform im letzten Satzteil
  choice: Die erste Person bleibt ohne Sprecherzusatz stehen; אֶשְׁמָע wird vergangen mit »hörte ich« wiedergegeben.
  alternative: Der Satz könnte als gegenwärtige Aussage »höre ich« verstanden oder ausdrücklich dem Psalmisten beziehungsweise Gott zugeordnet werden.
  rationale: Der Zusammenhang leitet zur göttlichen Rede über, doch der Text benennt den Sprecher an dieser Stelle nicht. Die schlichte erste Person bewahrt den poetischen Übergang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstellung. »Bei Josef« vermeidet die missverständliche Vorstellung eines räumlichen Inneren, bleibt aber bewusst näher am hebräischen ב als eine vollständige Ausdeutung zu »für Israel«. Die Abfolge »Eine Sprache … hörte ich« bewahrt die Hervorhebung und den abrupten Übergang zur folgenden Rede.
