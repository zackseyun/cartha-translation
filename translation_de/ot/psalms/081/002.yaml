  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
translation:
  language: de
  text: Stimmt ein Lied an[a] und lasst das Tamburin[b], die liebliche Leier zusammen mit der Harfe[c] erklingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erhebt ein Lied“ beziehungsweise „Hebt eine Melodie an“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort תֹף bezeichnet ein Schlaginstrument, wahrscheinlich eine Rahmentrommel; in älteren Übersetzungen wird es oft mit „Pauke“ wiedergegeben.
    reason: cultural_note
  - marker: c
    text: Die genaue Unterscheidung zwischen den hebräischen Saiteninstrumenten כִּנּוֹר („Leier“) und נָבֶל („Harfe“) ist unsicher; auch andere Zuordnungen, etwa Harfe und Laute, werden vorgeschlagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Stimmt … an
  rationale: Der pluralische Imperativ von נשׂא bedeutet hier idiomatisch, Gesang oder Musik zu erheben beziehungsweise zu beginnen. „Stimmt … an“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: זִמְרָה
  choice: ein Lied
  rationale: Das Wort bezeichnet Gesang oder Musik, besonders im Lobpreis. „Ein Lied“ ist verständlich und legt sich weniger eng fest als „Melodie“ oder „Psalm“.
- source_word: וּתְנוּ
  choice: lasst … erklingen
  rationale: Wörtlich steht „gebt“; in Verbindung mit dem Schlaginstrument ist das Hervorbringen seines Klangs gemeint. Die deutsche Wendung gibt dies idiomatisch wieder, ohne eine bestimmte Spieltechnik vorauszusetzen.
- source_word: תֹף
  choice: Tamburin
  rationale: Gemeint ist ein Rahmentrommel- beziehungsweise Tamburin-artiges Schlaginstrument. „Tamburin“ ist eine geläufige moderne Entsprechung; die historische Instrumentenform wird in einer Fußnote erläutert.
- source_word: כִּנּוֹר
  choice: Leier
  rationale: Das antike Saiteninstrument war wahrscheinlich eher leierartig als eine moderne Harfe. „Leier“ ist daher die passendste knappe deutsche Entsprechung.
- source_word: נָעִים
  choice: lieblich
  rationale: Das Adjektiv bedeutet angenehm, erfreulich oder wohltönend. „Lieblich“ passt in gehobener, aber verständlicher Sprache zum Klang eines Instruments.
- source_word: עִם
  choice: zusammen mit
  rationale: Die Präposition bezeichnet hier das gemeinsame Erklingen beziehungsweise die Begleitung der Instrumente.
- source_word: נָבֶל
  choice: Harfe
  rationale: Das Wort bezeichnet ein von כִּנּוֹר unterschiedenes Saiteninstrument. „Harfe“ schafft im Deutschen eine natürliche Unterscheidung, obwohl die genaue Bauart unsicher bleibt.
