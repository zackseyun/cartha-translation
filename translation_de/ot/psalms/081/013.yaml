  text: ל֗וּ עַ֭מִּ/י שֹׁמֵ֣עַֽ לִ֑/י יִ֝שְׂרָאֵ֗ל בִּ/דְרָכַ֥/י יְהַלֵּֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/013.yaml
  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: de
  text: Ach, wenn doch mein Volk auf mich hörte, wenn Israel auf meinen Wegen ginge!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ
  choice: Ach, wenn doch
  rationale: Die Wunschpartikel leitet hier einen klagenden, sehnsüchtigen Wunsch ein. „Ach, wenn doch“ gibt diese optative und emotionale Kraft im heutigen Deutsch natürlich wieder.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Das Substantiv mit Suffix der ersten Person Singular bezeichnet eindeutig „mein Volk“ und bewahrt den im Psalm vorausgesetzten Bundesbezug.
- source_word: שֹׁמֵעַ לִי
  choice: auf mich hörte
  rationale: שׁמע mit ל bezeichnet hier nicht bloß akustisches Hören, sondern aufmerksames Hören mit der Nuance des Befolgens. „Auf mich hören“ trifft dies idiomatisch.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form beibehalten.
- source_word: בִּדְרָכַי
  choice: auf meinen Wegen
  rationale: דֶּרֶךְ bezeichnet im Plural Lebensführung und Verhaltensweisen. Im Deutschen ist „auf meinen Wegen“ die natürliche Form und bewahrt zugleich das Wegbild.
- source_word: יְהַלֵּכוּ
  choice: ginge
  rationale: Die Verbform beschreibt die ersehnte Lebensführung Israels. Der Konjunktiv „ginge“ nimmt die durch לוּ eröffnete Wunschkonstruktion auf, ohne die Metapher aufzulösen.
theological_decisions:
- issue: Wunsch beziehungsweise Klage oder Bedingung
  choice: 'Der Vers wird als klagender Wunsch Gottes wiedergegeben: „Ach, wenn doch …“'
  alternative: „Wenn mein Volk auf mich hörte, wenn Israel auf meinen Wegen ginge …“
  rationale: לוּ kann einen Bedingungssatz einleiten, doch hier steht die sehnsüchtig-klagende Wunschbedeutung im Vordergrund. Die deutsche Fassung bewahrt diese rhetorische und emotionale Spannung, ohne daraus eine rein sachliche Bedingung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und das biblische Wegbild bleiben erhalten; „auf mich hören“ ist verständlich und umfasst sowohl Hören als auch Gehorchen.
