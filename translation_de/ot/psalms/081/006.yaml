source:
  edition: WLC
  text: הֲסִיר֣וֹתִי מִ/סֵּ֣בֶל שִׁכְמ֑/וֹ כַּ֝פָּ֗י/ו מִ/דּ֥וּד תַּעֲבֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/006.yaml
  text: I removed the burden from his shoulder[c][b][a]; his hands passed away from the basket.
translation:
  language: de
  text: Ich nahm die Last von seiner Schulter; seine Hände kamen vom Tragkorb[a] los.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Korb«, »Topf« oder »Kessel«; das hebräische Wort ist selten, und seine genaue Bedeutung an dieser Stelle ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Seine Hände gingen vom Korb weg.«'
    reason: literal_rendering
lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: ich nahm … von
  rationale: Das Hifil Perfekt 1. Person Singular bezeichnet ein Wegnehmen oder Entfernen. Die deutsche Konstruktion »die Last von seiner Schulter nehmen« gibt den gemeinten Vorgang natürlich wieder.
- source_word: מִסֵּבֶל
  choice: die Last
  rationale: סֵבֶל bezeichnet eine Last oder Bürde; im Zusammenhang mit der Schulter ist »Last« die klare und idiomatische Entsprechung.
- source_word: שִׁכְמוֹ
  choice: von seiner Schulter
  rationale: שֶׁכֶם bedeutet wörtlich »Schulter«. Der Singular des Hebräischen bleibt erhalten.
- source_word: כַּפָּיו
  choice: seine Hände
  rationale: כַּף kann »Handfläche« bedeuten, bezeichnet hier im Zusammenhang mit Zwangsarbeit jedoch idiomatisch die Hände.
- source_word: מִדּוּד
  choice: vom Tragkorb
  rationale: דּוּד ist ein seltenes und hier unsicheres Substantiv. Im Parallelismus mit Last und Schulter passt ein bei der Arbeit verwendeter Korb am besten; »Tragkorb« verdeutlicht diesen Zusammenhang, während andere lexikalische Möglichkeiten in der Fußnote genannt werden.
- source_word: תַּעֲבֹרְנָה
  choice: kamen … los
  rationale: Das Qal Imperfekt 3. Person feminin Plural von עבר stimmt mit »Hände« überein und bezeichnet hier ihr Fortkommen beziehungsweise Entferntwerden von dem Arbeitsgerät. »Kamen … los« ist im Deutschen natürlich und vermeidet eine unklare wörtliche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Halbzeile wird entsprechend dem natürlichen deutschen Sprachgebrauch formuliert; die zweite beschreibt anschaulich die Befreiung von der Zwangsarbeit. Die lexikalische Unsicherheit bei דּוּד und die wörtlichere Bedeutung von עבר bleiben durch Fußnoten sichtbar.
