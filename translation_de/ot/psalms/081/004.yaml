  text: כִּ֤י חֹ֣ק לְ/יִשְׂרָאֵ֣ל ה֑וּא מִ֝שְׁפָּ֗ט לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: de
  text: Denn dies ist eine Satzung für Israel, eine Verordnung des Gottes Jakobs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Verordnung für den Gott Jakobs“. Die hebräische Präposition kann sowohl Zugehörigkeit beziehungsweise Ursprung als auch einen Bezug im Sinn von „für“ ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung zum Festjubel; „Denn“ gibt diese erklärende Funktion natürlich wieder.
- source_word: חֹק
  choice: Satzung
  rationale: Das Wort bezeichnet eine verbindlich festgesetzte Vorschrift und bewahrt hier den rechtlich-bundestheologischen Klang.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: 'Die Präposition bezeichnet hier am natürlichsten den Geltungsbereich der Satzung: Sie gilt Israel.'
- source_word: הוּא
  choice: dies ist
  rationale: Das Pronomen verweist auf die zuvor gebotene Festbegehung; im Deutschen stellt „dies ist“ den Bezug klar und idiomatisch her.
- source_word: מִשְׁפָּט
  choice: Verordnung
  rationale: Im Parallelismus mit חֹק bezeichnet das Wort eine autoritativ festgelegte rechtliche Bestimmung, nicht ein verurteilendes Gerichtsurteil.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: des Gottes Jakobs
  rationale: Die Wiedergabe versteht ל als Ausdruck von Zugehörigkeit beziehungsweise Ursprung und bewahrt zugleich den biblischen Hoheitstitel.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Verhältnis von חֹק und מִשְׁפָּט
  choice: Die beiden Rechtsbegriffe werden unterscheidbar mit „Satzung“ und „Verordnung“ wiedergegeben.
  alternative: Beide Begriffe mit nahezu demselben Wort wiedergeben oder zu einem einzigen Rechtsbegriff zusammenziehen.
  rationale: Der hebräische Parallelismus verwendet zwei verwandte, aber unterschiedliche Begriffe. Ihre getrennte Wiedergabe bewahrt den rechtlichen und liturgischen Nachdruck, ohne eine scharfe technische Differenz zu behaupten.
- issue: Bedeutung der Präposition ל in לֵאלֹהֵי יַעֲקֹב
  choice: 'Zugehörigkeit beziehungsweise Ursprung: „des Gottes Jakobs“'
  alternative: 'Zweck- oder Bezugsangabe: „für den Gott Jakobs“'
  rationale: Im Zusammenhang liegt nahe, dass die Verordnung von Israels Gott stammt oder ihm zugehört. Da die Präposition jedoch auch „für“ bedeuten kann, wird diese echte Mehrdeutigkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. „Satzung“ und „Verordnung“ halten den rechtlichen Ton des hebräischen Verses aufrecht, ohne unnötig fachsprachlich zu wirken.
