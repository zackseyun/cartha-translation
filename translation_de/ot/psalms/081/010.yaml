id: PSA.81.10
reference: Psalms 81:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: de
  text: Ich bin Jahwe, dein Gott, der dich aus dem Land Ägypten heraufgeführt hat. Öffne deinen Mund weit, und ich werde ihn füllen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Öffne deinen Mund weit, damit ich ihn fülle.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי יְהוָה אֱלֹהֶיךָ
  choice: Ich bin Jahwe, dein Gott
  rationale: Die betonte selbstständige Form אָנֹכִי wird in der nominalen Identitätsaussage natürlich mit „Ich bin“ wiedergegeben. יְהוָה erscheint als der Eigenname „Jahwe“, אֱלֹהֶיךָ als „dein Gott“.
- source_word: הַמַּעַלְךָ
  choice: der dich … heraufgeführt hat
  rationale: Das Hifil-Partizip von עלה bezeichnet Gottes Handeln beim Exodus. „Heraufgeführt“ bewahrt die im Verb enthaltene Aufwärtsbewegung und klingt im Deutschen angemessen.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: מִן bezeichnet hier den Ausgangspunkt der Befreiung. „Aus dem Land Ägypten“ entspricht der geläufigen Exodusformel.
- source_word: הַרְחֶב פִּיךָ
  choice: Öffne deinen Mund weit
  rationale: Der Hifil-Imperativ von רחב bedeutet mit „Mund“ idiomatisch, ihn weit zu öffnen; die Anrede steht im Singular.
- source_word: וַאֲמַלְאֵהוּ
  choice: und ich werde ihn füllen
  rationale: Das Suffix bezieht sich grammatisch auf den maskulinen „Mund“. Die Form kann als zugesagte Folge des Imperativs verstanden werden; die mögliche finale Nuance bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Aufforderung und göttlichem Füllen
  choice: „und ich werde ihn füllen“ als Verheißung bzw. Folge
  alternative: „damit ich ihn fülle“ als Zweckangabe
  rationale: Die hebräische Verbindung mit וַאֲמַלְאֵהוּ lässt im Kontext sowohl eine zugesagte Folge als auch eine finale Nuance zu. Der Haupttext folgt der naheliegenden Verheißungslesart; die Alternative wird ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Aufforderung und die direkte göttliche Verheißung bleiben knapp und anschaulich; der Gottesname wird als „Jahwe“ wiedergegeben.
