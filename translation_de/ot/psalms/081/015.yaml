  source_fidelity: Die Wiedergabe erfasst die Grundbedeutung von כחשׁ als unechter bzw. erzwungener Unterwerfung und erhält die Mehrdeutigkeit von עֵת. „Unterwerfung heucheln“ ist jedoch im Deutschen weniger idiomatisch und verschiebt die direkte Beziehung zu „ihm“ leicht. Der Schluss „würde für immer bestehen“ ist semantisch möglich, klingt aber für eine Zeitangabe unnatürlich; „würde ewig währen“ gibt die zeitliche Aussage klarer wieder, ohne die Deutung auf Strafe oder Geschick einzuengen.
  naturalness: „Die Jahwe hassen“ ist verständlich, aber als substantivisches Partizip im heutigen Standarddeutsch merklich holprig. „Diejenigen, die Jahwe hassen“ ist natürlich und bewahrt den fortdauernden Charakter. „Ihm Gehorsam vortäuschen“ ist eine geläufige, klare Formulierung für die vorgetäuschte Unterwerfung.
  terminology: „Jahwe“ ist als Wiedergabe von יהוה angemessen. Die Formulierung „Gehorsam vortäuschen“ wahrt die unechte Unterordnung, ohne eine bestimmte emotionale Nuance wie bloßes Widerstreben als Hauptsinn festzulegen. „Zeit“ bleibt im Haupttext bewusst unpräzise; die Fußnote darf mögliche kontextuelle Entfaltungen nennen.
