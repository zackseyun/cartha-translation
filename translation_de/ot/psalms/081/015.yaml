  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: de
  text: Diejenigen, die Jahwe hassen, würden ihm Gehorsam vortäuschen[a], und ihre Zeit würde ewig währen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »würden sich ihm widerwillig unterwerfen«, »würden ihm Unterwerfung heucheln« oder »würden vor ihm kriechen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ihre Zeit für immer«. Gemeint sein können ihre festgesetzte Zeit, ihr Geschick oder ihre Strafzeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: Die … hassen
  rationale: Das Partizip wird substantivisch gebraucht. Die Relativkonstruktion ist im modernen Deutschen natürlich und bezeichnet die Menschen nach ihrer fortdauernden Haltung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen יהוה in einer im Deutschen geläufigen Form wieder.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: würden ihm Unterwerfung heucheln
  rationale: כחשׁ im Piel mit ל kann erzwungene, unehrliche Unterwerfung bezeichnen. Die Formulierung bewahrt ausdrücklich den Aspekt des Täuschens, ohne daraus echte Umkehr zu machen.
- source_word: וִיהִי
  choice: würde … bestehen
  rationale: Die Imperfektform in der poetischen Folge wird entsprechend dem vorausgesetzten Bedingungszusammenhang modal wiedergegeben.
- source_word: עִתָּם
  choice: ihre Zeit
  rationale: עת bedeutet zunächst „Zeit“ oder „Zeitspanne“. Die wörtliche Wiedergabe wahrt die mögliche Mehrdeutigkeit zwischen Frist, Geschick und Strafzeit.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Natürliche und prägnante Wiedergabe der zeitlich unbegrenzten Aussage.
theological_decisions:
- issue: Bedeutung von ויהי עתם לעולם
  choice: ihre Zeit würde für immer bestehen
  alternative: ihre Strafzeit würde ewig dauern; ihr Geschick wäre für immer festgelegt
  rationale: Der unmittelbare Zusammenhang legt eine negative Aussage über Jahwes Feinde nahe, doch das hebräische עִתָּם nennt nur „ihre Zeit“. Der Haupttext bewahrt diese Spannung und legt weder ausdrücklich ewige Strafe noch fortdauerndes Wohlergehen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „ihre Zeit“ bleibt bewusst stehen, da auch der hebräische Schluss knapp und mehrdeutig ist; die Fußnote erläutert die möglichen Bezüge.
