  - severity: medium
    issue: Unidiomatische Wiedergabe von יכחשו לו
    rationale: „Ihm Unterwerfung heucheln“ ist weniger geläufig als „ihm Gehorsam vortäuschen“. Letzteres bringt die vorgetäuschte Unterordnung und den Bezug auf „ihm“ klar zum Ausdruck.
  - severity: low
