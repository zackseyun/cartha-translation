lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ eröffnet einen unmittelbaren, feierlichen Aufruf. „Höre“ bewahrt zudem die Wiederholung der Wurzel שׁמע im zweiten Halbvers.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die natürliche deutsche Entsprechung bewahrt die relationale und bundesbezogene Anrede.
- source_word: וְאָעִידָה בָּךְ
  choice: ich will gegen dich Zeugnis ablegen
  rationale: Das Hifil von עוד kann bezeugen, feierlich ermahnen oder warnen bedeuten. Mit בְּ ist hier im Zusammenhang göttlicher Zurechtweisung eine gegen das Volk gerichtete, forensische Nuance gut begründet; die Fußnote wahrt andere mögliche Auffassungen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name steht als direkte Anrede; im modernen Deutschen ist dafür kein zusätzliches „O“ erforderlich.
- source_word: אִם תִּשְׁמַע לִי
  choice: wenn du doch auf mich hören würdest
  rationale: אִם kann hier einen Wunsch beziehungsweise eine sehnsüchtige Aufforderung ausdrücken. „Auf mich hören“ gibt שׁמע mit ל idiomatisch als aufmerksames Hören und Befolgen wieder.
theological_decisions:
- issue: Bezug und Richtung von וְאָעִידָה בָּךְ
  choice: „gegen dich Zeugnis ablegen“
  alternative: „dich warnen“ oder „dir Zeugnis geben“
  rationale: Die adversative Wiedergabe erhält den möglichen gerichtlichen Ernst der göttlichen Mahnung, ohne die lexikalischen Alternativen zu verschweigen.
- issue: Kraft von אִם תִּשְׁמַע לִי
  choice: 'Als sehnsüchtiger Wunsch: „wenn du doch auf mich hören würdest!“'
  alternative: 'Formal-konditional: „wenn du auf mich hörst“; expliziter Wunsch: „Ach, würdest du doch auf mich hören!“'
  rationale: Im poetischen Kontext kann אִם einen Wunsch einleiten. Die gewählte Form bewahrt sowohl das hebräische „wenn“ als auch den deutlich appellativen, sehnsüchtigen Ton.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Direktheit. Die Wiederholung „Höre … hören“ bildet die wiederholte hebräische Wurzel שׁמע ab. Der Gedankenstrich markiert den Übergang zur erneuten direkten Anrede.
