  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: de
  text: Höre, mein Volk, und ich will gegen dich Zeugnis ablegen[a] – Israel, wenn du doch auf mich hören würdest![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich will dich warnen“; auch: „ich will dir gegenüber Zeugnis ablegen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische kann auch ausdrücklich als Wunsch wiedergegeben werden: „Ach, würdest du doch auf mich hören!“'
