base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/009.yaml
  text: You must have no foreign god among you, and you must not bow down to an alien god[a].
translation:
  language: de
  text: Du sollst keinen fremden Gott in deiner Mitte haben und dich nicht vor einem Gott aus der Fremde niederwerfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen zwei eng verwandte Wörter für einen Gott, der nicht zu Israels Gottesverehrung gehört: „fremd“ und „aus der Fremde“. Der Wechsel gehört zum poetischen Parallelismus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיֶה
  choice: Du sollst keinen … haben
  rationale: Mit לֹא hat das Imperfekt im Bundeszusammenhang gebietenden Sinn. Die Formulierung gibt das Verbot in modernem Deutsch unmittelbar wieder.
- source_word: בְךָ
  choice: unter dir
  rationale: Israel wird als Gemeinschaft grammatisch im Singular angeredet. „Unter dir“ bewahrt diese Anrede und bezeichnet die Gegenwart innerhalb des Volkes.
- source_word: אֵל
  choice: Gott
  rationale: Im Zusammenhang mit kultischer Verehrung bezeichnet אֵל eine Gottheit. Die deutsche Großschreibung ist grammatisch bedingt und wertet den fremden Gott nicht als den wahren Gott.
- source_word: זָר
  choice: fremd
  rationale: Das Adjektiv bezeichnet einen Gott, der nicht zur von Israel geschuldeten Gottesverehrung gehört.
- source_word: תִשְׁתַּחֲוֶה
  choice: dich nicht … niederwerfen
  rationale: Die negative Imperfektform drückt ein Verbot aus; das reflexive „sich niederwerfen“ bezeichnet hier kultische Huldigung.
- source_word: לְאֵל
  choice: vor einem … Gott
  rationale: Bei „sich niederwerfen“ ist „vor“ im Deutschen die natürliche Wiedergabe der auf eine verehrte Gottheit gerichteten Handlung.
- source_word: נֵכָר
  choice: unbekannt
  rationale: Das Wort bezeichnet hier etwas Fremdes bzw. auswärtig Zugehöriges. „Unbekannt“ erhält die lexikalische Variation gegenüber זָר, ohne eine eigene Götterklasse zu behaupten.
theological_decisions:
- issue: Israel wird grammatisch im Singular, sachlich aber gemeinschaftlich angeredet
  choice: Singularisches „du/dir“ beibehalten, wobei der Zusammenhang Israel als Gemeinschaft bezeichnet
  alternative: Pluralisches „ihr/euch“ oder ausdrücklich „unter euch“
  rationale: Der hebräische Singular stellt Israel als eine Einheit an. Die deutsche Singularform erhält diese Spannung, ohne die Aussage auf ein isoliertes Individuum einzuengen.
- issue: Verhältnis der beiden Bezeichnungen זָר und נֵכָר
  choice: Die poetische Variation mit „fremd“ und „unbekannt“ sichtbar machen
  alternative: Beide Wörter einheitlich mit „fremd“ wiedergeben
  rationale: Die parallelen Halbverse verwenden eng verwandte, aber verschiedene Wörter. Eine variierte Wiedergabe bewahrt die poetische Form, ohne einen theologischen Bedeutungsunterschied festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direktem Gebotscharakter. Der poetische Parallelismus und die korporative Singularanrede werden bewahrt.
