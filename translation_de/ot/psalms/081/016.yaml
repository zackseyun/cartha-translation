  text: וַֽ֭/יַּאֲכִילֵ/הוּ מֵ/חֵ֣לֶב חִטָּ֑ה וּ֝/מִ/צּ֗וּר דְּבַ֣שׁ אַשְׂבִּיעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/016.yaml
  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: de
  text: Doch er würde ihn mit dem Besten des Weizens speisen[a][b], und mit Honig aus dem Felsen würde ich dich sättigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Fett des Weizens“; die hebräische Wendung meint den reichsten oder erlesensten Weizen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen wechselt die Person: „er würde ihn speisen … ich würde dich sättigen“. Die Singularformen beziehen sich wahrscheinlich auf Israel als Volk.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: er würde ihn … speisen
  rationale: Der Hifil von אכל bedeutet „zu essen geben, speisen“. Im Zusammenhang mit der nicht verwirklichten Bedingung des vorigen Verses gibt „würde“ den bedingten Sinn wieder. Das maskuline Singularobjekt „ihn“ bleibt erhalten und bezeichnet wahrscheinlich Israel als Kollektiv.
- source_word: מֵחֵלֶב חִטָּה
  choice: mit dem Besten des Weizens
  rationale: חֵלֶב bedeutet wörtlich „Fett“, bezeichnet bei Erzeugnissen aber idiomatisch den reichsten oder erlesensten Teil. „Das Beste des Weizens“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: וּמִצּוּר
  choice: und mit Honig aus dem Felsen
  rationale: צוּר bezeichnet einen Felsen oder Felsblock. Zusammen mit דְּבַשׁ bleibt das konkrete poetische Bild unerwarteter Fülle erhalten.
- source_word: דְּבַשׁ
  choice: Honig
  rationale: Die übliche und im Kontext passende Wiedergabe.
- source_word: אַשְׂבִּיעֶךָ
  choice: würde ich dich sättigen
  rationale: Der Hifil von שבע bedeutet „sättigen, bis zur Fülle versorgen“. Das ausdrücklich erste Person Singular stehende Subjekt und die Anrede in der zweiten Person Singular werden bewahrt.
theological_decisions:
- issue: Personenwechsel innerhalb des Verses
  choice: Den Wechsel von der dritten Person Singular mit Objekt „ihn“ zur ersten Person Singular mit Anrede „dich“ bewahren.
  alternative: 'Zur Einheitlichkeit glätten: „Ich würde dich speisen … und dich sättigen.“'
  rationale: Der masoretische Text enthält diesen auffälligen Wechsel. Seine Bewahrung respektiert die hebräische Gestalt und vermeidet eine nicht erforderliche Harmonisierung; die Singularformen beziehen sich wahrscheinlich kollektiv auf Israel.
- issue: Bildsprache göttlicher Versorgung
  choice: Weizen und Honig aus dem Felsen als konkrete poetische Bilder wiedergeben.
  alternative: Den Felsen im Haupttext ausdrücklich als Bild für Gott deuten.
  rationale: Die Übersetzung soll die Bildsprache erhalten, ohne eine theologische Auslegung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Speisen“ und „sättigen“ bewahren den poetischen Ton; der ungewöhnliche Personenwechsel bleibt sichtbar. Die Fußnotenmarker stehen unmittelbar nach der Wendung, auf die beide Hinweise Bezug nehmen.
