  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: de
  text: Singt Gott, unserer Stärke, voll Freude zu; jubelt laut dem Gott Jakobs zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bringt dem Gott Jakobs einen lauten Jubelruf dar.« Das Verb kann einen lauten Huldigungs- oder Jubelruf bezeichnen, der auch einem Trompetensignal ähneln kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Singt … voll Freude zu
  rationale: Der Imperativ Plural von רנן bezeichnet freudigen, jubelnden Lobgesang. Die Wiedergabe bewahrt sowohl den musikalischen als auch den freudigen Aspekt in natürlichem Deutsch.
- source_word: לֵאלֹהִים
  choice: Gott … zu
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung des Lobgesangs. אֱלֹהִים meint im Zusammenhang eindeutig den einen Gott Israels.
- source_word: עוּזֵּנוּ
  choice: unserer Stärke
  rationale: Das Substantiv עֹז/עוֹז bezeichnet Stärke oder Macht. Die direkte Wiedergabe vermeidet eine interpretierende Einengung auf »Zuflucht« oder »starker Beschützer«.
- source_word: הָרִיעוּ
  choice: jubelt laut
  rationale: Der Hifil-Imperativ Plural von רוע/ריע bezeichnet einen lauten, öffentlichen Jubel- oder Huldigungsruf. »Jubelt laut« ist verständlich und gibt den akklamatorischen Charakter wieder.
- source_word: לֵאלֹהֵי
  choice: dem Gott … zu
  rationale: Die Präposition ל markiert die Ausrichtung des Zurufs; die Konstruktverbindung bedeutet »Gott Jakobs«. Der deutsche Dativ mit »zujubeln« ist idiomatisch.
- source_word: יַעֲקֹב
  choice: Jakobs
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
theological_decisions:
- issue: Numerus und Bedeutung von אֱלֹהִים in den parallelen Vershälften
  choice: Gott / der Gott Jakobs
  alternative: Götter
  rationale: Obwohl אֱלֹהִים seiner Form nach pluralisch ist, bezeichnet es hier den Gott Israels im Singular. Die parallele Wendung »Gott Jakobs« bestätigt diesen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Aufbau der beiden Aufforderungen bleibt erhalten; die Anrede »unserer Stärke« wird als Apposition zu Gott bewahrt.
