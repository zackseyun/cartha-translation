id: PSA.81.3
reference: Psalms 81:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: de
  text: Blast am Neumond das Horn, beim Vollmond[a], am Tag unseres Festes!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim bedeckten Mond“ oder „zur festgesetzten Zeit“. Die Bedeutung des hebräischen Wortes כֵּסֶה ist umstritten. „Vollmond“ passt zum kalendarischen Gegenstück „Neumond“ und zum Zusammenhang des Festes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Blast
  rationale: Der Qal-Imperativ Plural von תקע fordert hier zum Blasen eines Signal- oder Kulthorns auf. „Blast“ ist im Deutschen die natürliche imperative Verbindung mit „Horn“.
- source_word: בַחֹדֶשׁ
  choice: am Neumond
  rationale: חֹדֶשׁ kann „Monat“ oder „Neumond“ bedeuten. Im kultischen Kalenderzusammenhang und parallel zu כֵּסֶה ist „Neumond“ am wahrscheinlichsten.
- source_word: שׁוֹפָר
  choice: das Horn
  rationale: שׁוֹפָר bezeichnet ein zum Signal und im Kult geblasenes Horn. „Horn“ ist verständlich und vermeidet sowohl die möglicherweise zu enge Festlegung auf ein Widderhorn als auch eine unnötige Transliteration.
- source_word: בַּכֵּסֶה
  choice: beim Vollmond
  rationale: כֵּסֶה ist umstritten. „Vollmond“ ergibt zusammen mit „Neumond“ einen stimmigen kalendarischen Parallelismus und passt zum genannten Festtag; andere mögliche Deutungen werden in der Fußnote bewahrt.
- source_word: לְיוֹם
  choice: am Tag
  rationale: Die Präposition לְ stellt hier den zeitlichen beziehungsweise zielgerichteten Bezug zum Festtag her. Im Deutschen gibt „am Tag“ den Zusammenhang knapp und natürlich wieder.
- source_word: חַגֵּנוּ
  choice: unseres Festes
  rationale: חַג bezeichnet ein religiöses Fest, häufig ein Wallfahrtsfest. „Fest“ ist im modernen Deutschen klar, würdig und lässt die genauere Art des Festes offen.
theological_decisions:
- issue: Bedeutung von בַּכֵּסֶה in der kalendarischen Festangabe
  choice: beim Vollmond
  alternative: beim bedeckten Mond; zur festgesetzten Zeit
  rationale: Die Entscheidung ist vor allem lexikalisch und kontextuell. „Vollmond“ passt zum Parallelismus mit „Neumond“ und zum Festkalender. Da die Bedeutung des seltenen hebräischen Ausdrucks nicht sicher ist, werden die ernsthaften Alternativen in einer Fußnote genannt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit direktem Imperativ. „Blast … das Horn“ bewahrt den poetischen Aufforderungscharakter; die knappe dreigliedrige Zeitangabe folgt der Struktur des Hebräischen.
