base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/014.yaml
  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: de
  text: In kurzer Zeit würde ich ihre Feinde unterwerfen[a] und meine Hand gegen ihre Bedränger wenden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bald würde ich ihre Feinde unterwerfen.“ Das hebräische כִּמְעַט kann zeitliche Nähe („bald“, „in kurzer Zeit“) ausdrücken, seltener auch „beinahe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „meine Hand gegen ihre Bedränger zurückwenden“; ein Bild dafür, dass Gott seine Macht zum Gericht gegen sie richtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Wie schnell
  rationale: Die Wendung bezeichnet hier am ehesten eine kurze Zeitspanne beziehungsweise das baldige Eintreten. „Wie schnell“ passt zum vorausgehenden unerfüllten Bedingungszusammenhang und bewahrt den emphatischen Ton; die mögliche Wiedergabe „Bald“ wird in der Fußnote genannt.
- source_word: אוֹיְבֵיהֶם
  choice: ihre Feinde
  rationale: „Feinde“ ist die klare und übliche Wiedergabe für Gegner in einem militärischen oder feindseligen Zusammenhang.
- source_word: אַכְנִיעַ
  choice: würde ich ... unterwerfen
  rationale: Der Hifil von כנע bezeichnet das Bezwingen oder Unterwerfen. Der Konjunktiv II gibt im Deutschen die vom vorausgehenden Kontext abhängige, nicht verwirklichte Handlung angemessen wieder.
- source_word: וְעַל
  choice: und ... gegen
  rationale: Im Zusammenhang mit dem Wenden der Hand bezeichnet die Präposition die feindliche Zielrichtung; „gegen“ ist dafür im Deutschen natürlich.
- source_word: צָרֵיהֶם
  choice: ihre Bedränger
  rationale: „Bedränger“ bewahrt die Unterscheidung zum vorausgehenden „Feinde“ und bringt die Bedeutung feindlicher, bedrängender Gegner zum Ausdruck.
- source_word: אָשִׁיב יָדִי
  choice: meine Hand ... wenden
  rationale: Die Formulierung erhält das hebräische Bild der gegen die Gegner gerichteten göttlichen Macht, ohne es durch eine bloße Deutung zu ersetzen.
theological_decisions:
- issue: Modalität des göttlichen Handelns im Zusammenhang
  choice: „würde ich ... unterwerfen“ und „würde ... wenden“
  alternative: „werde ich ... unterwerfen“ und „werde ... wenden“
  rationale: 'Die Imperfektformen stehen im Zusammenhang der vorausgehenden Bedingung: Was Gott tun würde, wenn Israel auf ihn hörte. Der Konjunktiv II macht diese Abhängigkeit im Deutschen deutlich, ohne die Aussage zu einer unbedingten Zukunftsankündigung zu machen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Begriffe „Feinde“ und „Bedränger“ bleiben unterschieden; das Bild von Gottes Hand wird bewahrt. Das Ausrufezeichen gibt den emphatischen, vom vorausgehenden Bedingungssatz abhängigen Charakter wieder.
