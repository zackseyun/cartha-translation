  text: Da überließ ich es dem Starrsinn ihres Herzens[a]; sie gingen ihren eigenen Plänen nach[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Objektssuffix lautet Singular maskulin („ihn“) und bezieht sich kollektiv auf Israel; bei „ihres Herzens“ und im folgenden Satz wechselt der Text zum Plural. „Starrsinn“ kann auch „Verstocktheit“ oder „eigenwillige Hartnäckigkeit“ bedeuten.
    reason: lexical_alternative
  - marker: b
