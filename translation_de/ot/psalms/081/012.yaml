lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: So überließ ich es
  rationale: Das Hifil von שׁלח mit Suffix der 3. Person Singular bezeichnet hier idiomatisch ein Preisgeben beziehungsweise Überlassen. Das Neutrum „es“ nimmt Israel als kollektives Volk auf und bewahrt den Numeruswechsel des Hebräischen.
- source_word: בִּשְׁרִירוּת
  choice: der Verstocktheit
  rationale: שְׁרִירוּת bezeichnet hartnäckigen Eigenwillen beziehungsweise Starrsinn. „Verstocktheit“ ist im Kontext verständlich und gibt die moralische Verhärtung prägnant wieder.
- source_word: לִבָּם
  choice: seines Herzens
  rationale: Der masoretische Text hat ein Pluralsuffix („ihres Herzens“), doch im Deutschen wird es hier auf das unmittelbar zuvor als Singular aufgefasste Kollektiv Israel bezogen. Die Fußnote macht die formale Abweichung transparent.
- source_word: יֵלְכוּ
  choice: sie gingen
  rationale: הלך kann sowohl schlichtes Gehen als auch den Lebenswandel bezeichnen. Das Präteritum fügt sich in die erzählende Folge ein und lässt die ethische Bedeutung im Kontext bestehen.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: nach ihren eigenen Plänen
  rationale: מוֹעֵצָה bezeichnet Rat, Vorhaben oder Plan. „Nach ihren eigenen Plänen“ ist natürliches modernes Deutsch und bewahrt den Gegensatz zu Gottes Weisung.
theological_decisions:
- issue: Wechsel vom singularischen Suffix zum Plural
  choice: Israel zunächst als kollektives Singular („es“), danach pluralisch („sie“) wiedergeben
  alternative: 'Den gesamten Vers zum Plural glätten: „So überließ ich sie …; sie gingen …“'
  rationale: Der hebräische Text bezeichnet Israel zunächst mit einem singularischen Objektsuffix und wechselt danach zu pluralischen Formen. Die Übersetzung bewahrt diesen Wechsel, ohne im Deutschen mit „ihn“ ein männliches Einzelwesen nahezulegen.
- issue: Gerichtlicher Sinn des göttlichen Handelns
  choice: „überließ ich es“
  alternative: „ließ ich es gehen“ oder „schickte ich es fort“
  rationale: Im Zusammenhang ist Gottes Handeln ein preisgebendes Überlassen an Israels eigenen Starrsinn. „Überließ“ wahrt diesen gerichtlichen Ernst, ohne zusätzliche dogmatische Kategorien einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der auffällige Numeruswechsel des Ausgangstextes bleibt erkennbar; eine Fußnote dokumentiert die wörtliche hebräische Form und die möglichen Bedeutungsnuancen.
