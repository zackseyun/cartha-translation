base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/011.yaml
  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: de
  text: 'Doch mein Volk hörte nicht auf meine Stimme,

    und Israel wollte mir nicht gehorchen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Israel war mir nicht zu Willen.“ Das hebräische Verb bezeichnet Bereitschaft beziehungsweise Einwilligung; „gehorchen“ macht die im Zusammenhang mit „mir“ nur angedeutete Beziehung verständlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Doch ... nicht
  rationale: Die Konjunktion steht hier im Gegensatz zum vorausgehenden göttlichen Ruf und seiner Verheißung. „Doch“ gibt diesen adversativen Zusammenhang im Deutschen natürlich wieder.
- source_word: שָׁמַע
  choice: hörte ... auf
  rationale: שׁמע kann hören, zuhören oder gehorchen bedeuten. Die deutsche Wendung „auf meine Stimme hören“ bewahrt sowohl das Bild der Stimme als auch den Sinn des Beachtens, ohne bereits ausdrücklich „gehorchen“ zu sagen.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die Konstruktion mit dem Suffix der ersten Person Singular wird direkt wiedergegeben und bewahrt die Bundesbeziehung.
- source_word: לְקוֹלִי
  choice: auf meine Stimme
  rationale: קוֹל bedeutet wörtlich „Stimme“. Die übliche deutsche Verbindung „auf eine Stimme hören“ erhält den persönlichen und relationalen Ausdruck.
- source_word: וְיִשְׂרָאֵל
  choice: und Israel
  rationale: Die Konjunktion und der Eigenname werden beibehalten, sodass der Parallelismus mit „mein Volk“ sichtbar bleibt.
- source_word: לֹא אָבָה
  choice: war ... nicht willig
  rationale: אבה bezeichnet Willigkeit oder Einwilligung. „War nicht willig“ bewahrt diesen lexikalischen Sinn und vermeidet, die Aussage vorschnell als ausdrücklichen Gehorsamsbegriff wiederzugeben.
- source_word: לִי
  choice: mir
  rationale: Das hebräische לִי ist knapp und relational. Das ebenso knappe „mir“ erhält die Ellipse und damit die echte Offenheit zwischen „mir gegenüber nicht willig“, „mir nicht zu Willen“ und „willigte mir nicht ein“.
theological_decisions:
- issue: Bundesbezogene Gleichsetzung von Gottes Volk und Israel im poetischen Parallelismus
  choice: „mein Volk“ und „Israel“ als zwei parallele Bezeichnungen beibehalten
  alternative: „Mein Volk Israel hörte nicht auf meine Stimme“
  rationale: Der hebräische Text verteilt die Bezeichnungen auf zwei Verszeilen. Ihre getrennte Wiedergabe bewahrt sowohl die poetische Form als auch die bundesbezogene Betonung.
- issue: Verhältnis von Willigkeit und Gehorsam im zweiten Halbvers
  choice: Die Formulierung „war mir nicht willig“ bewahrt die Willens- und Zustimmungskomponente
  alternative: „wollte mir nicht gehorchen“ oder „wies mich zurück“
  rationale: Der Kontext kann Gehorsam oder Zurückweisung einschließen, doch אבה bezeichnet zunächst Willigkeit beziehungsweise Zustimmung. Die Übersetzung soll diese Spannung nicht durch eine stärker auslegende Formulierung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Zweizeiligkeit und der Parallelismus bleiben erhalten. „War mir nicht willig“ ist bewusst etwas gehobener und dichterisch knapp, um die Ellipse des Hebräischen und dessen Bedeutungsbreite zu bewahren.
