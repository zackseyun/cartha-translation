source:
  edition: WLC
  text: בַּ/צָּרָ֥ה קָרָ֗אתָ וָ/אֲחַ֫לְּצֶ֥/ךָּ אֶ֭עֶנְ/ךָ בְּ/סֵ֣תֶר רַ֑עַם אֶבְחָֽנְ/ךָ֨ עַל מֵ֖י מְרִיבָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: de
  text: In der Bedrängnis riefst du, und ich rettete dich; ich antwortete dir im Verborgenen des Donners[a]. Ich prüfte dich an den Wassern von Meriba[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „aus dem Verborgenen des Donners“ oder „im Versteck des Donners“. Das hebräische Bild erinnert wahrscheinlich an Gottes verborgene Gegenwart im Gewitter.'
    reason: lexical_alternative
  - marker: b
    text: Meriba erinnert an die Ereignisse in der Wüste, bei denen Gott Israel prüfte und Israel wegen des Wassers stritt (2. Mose 17,1–7; 4. Mose 20,1–13).
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: In der Bedrängnis
  rationale: צָרָה bezeichnet Not, Bedrängnis oder schwere Bedrängung. „In der Bedrängnis“ ist prägnant, würdevoll und lässt die Art der Not offen.
- source_word: קָרָאתָ
  choice: riefst du
  rationale: קרא bedeutet hier, um Hilfe zu rufen. Die knappe Wiedergabe lässt wie das Hebräische das angerufene Gegenüber unausgesprochen.
- source_word: וָאֲחַלְּצֶךָּ
  choice: und ich rettete dich
  rationale: חלץ im Hifil bedeutet herausziehen, befreien oder retten. „rettete“ ist im Deutschen natürlich und passt zum Rückblick auf Gottes Befreiung Israels.
- source_word: אֶעֶנְךָ
  choice: ich antwortete dir
  rationale: ענה hat hier die geläufige Bedeutung „antworten“; die Wiedergabe folgt unmittelbar der hebräischen Formulierung.
- source_word: בְּסֵתֶר רַעַם
  choice: im Verborgenen des Donners
  rationale: סֵתֶר bezeichnet einen verborgenen Ort, ein Versteck oder Verborgenheit. Die Formulierung bewahrt das Bild von Gottes verhüllter Gegenwart im Gewitter und gibt בְּ zunächst lokal mit „im“ wieder, ohne den möglichen Ausgangspunkt „aus“ auszuschließen.
- source_word: אֶבְחָנְךָ
  choice: Ich prüfte dich
  rationale: בחן bedeutet prüfen oder erproben. „prüfte“ ist klar und legt nicht fest, ob die Prüfung vorwiegend erzieherisch, offenbarend oder strafend war.
- source_word: עַל מֵי מְרִיבָה
  choice: an den Wassern von Meriba
  rationale: עַל ist hier lokal zu verstehen. „an den Wassern von Meriba“ bewahrt sowohl das konkrete Wasser-Motiv als auch den überlieferten Ortsnamen.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Funktion des liturgisch-musikalischen Ausdrucks ist unsicher; daher wird er transparent transliteriert und nicht hypothetisch gedeutet.
theological_decisions:
- issue: Gottes verborgene Gegenwart im Donner
  choice: Das poetische Bild „im Verborgenen des Donners“ bleibt im Haupttext erhalten.
  alternative: „aus dem Verborgenen des Donners“ oder eine ausdrückliche Deutung als Sinaioffenbarung
  rationale: Der Wortlaut kann Gottes verborgene Gegenwart in einer Sturmtheophanie anklingen lassen, nennt aber weder den Sinai ausdrücklich noch legt die Präposition eindeutig fest, ob die Antwort im Donner oder aus ihm heraus erging.
- issue: Bedeutung der Prüfung bei Meriba
  choice: Das neutrale „Ich prüfte dich“ bewahrt die Spannung des Textes.
  alternative: Eine ausdrücklich strafende oder ausschließlich erzieherische Prüfung
  rationale: בחן bezeichnet ein Prüfen oder Erproben, ohne hier dessen theologischen Zweck abschließend zu bestimmen. Die Übersetzung fügt daher keine konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Das ungewöhnliche Bild „im Verborgenen des Donners“ wird bewusst bewahrt; erklärende historische und lexikalische Möglichkeiten stehen in den Fußnoten.
