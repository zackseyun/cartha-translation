  yaml_path: translation/ot/psalms/081/000.yaml
  text: 'For the choir director: according to the Gittith[a]. Of Asaph.'
translation:
  language: de
  text: Für den Chorleiter. Nach der Gittit[a]. Von Asaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Gittit. Wahrscheinlich bezeichnet das Wort eine musikalische Aufführungsweise, ein Instrument oder den Namen einer Melodie; seine genaue Bedeutung ist jedoch unbekannt. Möglicherweise besteht ein Zusammenhang mit der Stadt Gat.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Form mit ל bezeichnet in Psalmüberschriften wahrscheinlich den für die musikalische Aufführung Verantwortlichen. „Chorleiter“ ist im Deutschen klar, gebräuchlich und funktional passend.
- source_word: עַל
  choice: Nach
  rationale: Vor einer musikalischen Angabe kann עַל eine Melodie, ein Instrument oder eine Aufführungsweise einleiten. „Nach“ ist eine knappe, natürliche Wiedergabe, ohne die genaue Art der Angabe festzulegen.
- source_word: הַגִּתִּית
  choice: der Gittit
  rationale: Die genaue Bedeutung ist unsicher; möglicherweise handelt es sich um ein Instrument, eine Melodie oder eine mit Gat verbundene musikalische Bezeichnung. Die Transliteration vermeidet eine unbegründete Festlegung.
- source_word: לְאָסָף
  choice: Von Asaf
  rationale: ל mit einem Personennamen kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Zuordnung bezeichnen. „Von Asaf“ ist knapp und lässt diese Zuordnung hinreichend offen.
