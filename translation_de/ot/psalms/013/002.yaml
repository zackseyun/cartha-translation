  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: de
  text: Wie lange muss ich noch in mir selbst Pläne schmieden und den ganzen Tag Kummer im Herzen tragen[a]? Wie lange wird sich mein Feind über mich erheben[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie lange soll ich noch Pläne in mir selbst erwägen, Kummer im Herzen den ganzen Tag?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „Wie lange wird mein Feind über mich triumphieren?“ Das Hebräische bewahrt wörtlich das Bild, dass er sich über den Beter erhebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Wie lange
  rationale: Die idiomatische deutsche Frageform bewahrt den wiederholten Klageruf des Hebräischen.
- source_word: אָשִׁית עֵצוֹת
  choice: muss ich … Rat suchen
  rationale: Wörtlich geht es um das Setzen oder Fassen von Ratschlägen beziehungsweise Plänen. „Rat suchen“ gibt die belastende innere Beratung im Deutschen natürlich wieder; „muss ich“ bringt die rhetorische Kraft der Klage zum Ausdruck.
- source_word: בְּנַפְשִׁי
  choice: in mir selbst
  rationale: נֶפֶשׁ bezeichnet hier den inneren Menschen. „In mir selbst“ ist im heutigen Deutsch natürlicher als „in meiner Seele“, ohne den inneren Bezug aufzugeben.
- source_word: יָגוֹן בִּלְבָבִי
  choice: Kummer im Herzen tragen
  rationale: יָגוֹן bezeichnet Kummer oder Gram. Das ergänzte „tragen“ bildet zusammen mit „im Herzen“ eine natürliche deutsche Wendung und macht die knappe hebräische Reihung verständlich.
- source_word: יוֹמָם
  choice: Tag für Tag
  rationale: Das Adverb kann „am Tag“, „den ganzen Tag“ oder im Zusammenhang fortdauernd „Tag für Tag“ bedeuten. Die gewählte Fassung hebt die anhaltende Erfahrung hervor, ohne sie auf die Tagesstunden zu beschränken.
- source_word: יָרוּם … עָלָי
  choice: sich … über mich erheben
  rationale: Die Wiedergabe bewahrt das vertikale Bild des hebräischen Verbs רוּם und ist zugleich verständliches, gehobenes Deutsch.
- source_word: אֹיְבִי
  choice: mein Feind
  rationale: Direkte und übliche Wiedergabe des Singulars mit Suffix der ersten Person.
