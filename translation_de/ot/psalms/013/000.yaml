  text: For the choir director. A psalm of David[a].
translation:
  language: de
  text: Für den musikalischen Leiter. Ein Psalm Davids[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „von David“ beziehungsweise „für David“; das Hebräische kann in Psalmüberschriften Autorschaft, Zuordnung oder Widmung bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Der Ausdruck bezeichnet in Psalmüberschriften wahrscheinlich den Leiter der musikalischen Aufführung. „Musikalischer Leiter“ ist im heutigen Deutsch klar und legt sich nicht unnötig auf einen Chor fest; das vorangestellte ל wird im Überschriftenkontext mit „für“ wiedergegeben.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung für ein musikalisch vorgetragenes Lied und wird im Psalter sachgerecht mit „Psalm“ wiedergegeben.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv gibt die im Hebräischen offene Beziehung zu David knapp und natürlich wieder, ohne ausschließlich Autorschaft, Widmung oder Sammlungszugehörigkeit festzulegen.
theological_decisions:
- issue: Bedeutung von לְדָוִד in der Psalmüberschrift
  choice: Davids
  alternative: von David; für David
  rationale: Die Präposition ל kann in Psalmüberschriften Autorschaft, Zuordnung, Zugehörigkeit oder Widmung ausdrücken. Der Genitiv bewahrt diese Mehrdeutigkeit besser als eine eindeutigere Formulierung.
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Überschrift. „Musikalischer Leiter“ vermeidet das enger gefasste „Chorleiter“, während „Ein Psalm Davids“ die knappe Form des Hebräischen und seine relationale Offenheit wahrt.
