source:
  edition: WLC
  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: de
  text: Ich aber vertraue auf deine beständige Liebe; mein Herz wird über deine Rettung[a] jubeln. Ich will Jahwe ein Lied singen, denn er hat mir Gutes erwiesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Heil“. Das hebräische Wort kann sowohl die Rettung aus gegenwärtiger Not als auch Heil im umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Verbindung aus Konjunktion und betontem Pronomen setzt das Ich deutlich vom vorausgehenden Klagen ab; „Ich aber“ gibt diesen Kontrast natürlich und knapp wieder.
- source_word: בְּחַסְדְּךָ
  choice: auf deine beständige Liebe
  rationale: חֶסֶד bezeichnet verlässliche, gnädige und häufig bundestreue Liebe. „Beständige Liebe“ bewahrt sowohl ihre persönliche als auch ihre dauerhafte Seite; die Präposition wird im Deutschen idiomatisch mit „auf ... vertrauen“ wiedergegeben.
- source_word: בָטַחְתִּי
  choice: vertraue
  rationale: Das Perfekt bezeichnet hier gefestigtes Vertrauen mit gegenwärtiger Geltung. Das deutsche Präsens bringt diesen fortbestehenden Zustand natürlicher zum Ausdruck als „habe vertraut“.
- source_word: יָגֵל
  choice: wird ... jubeln
  rationale: Das Imperfekt blickt hier auf die erwartete Reaktion auf Gottes Rettung voraus. „Jubeln“ gibt die starke Freude des Verbs verständlich und würdig wieder.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Die direkte Wiedergabe bewahrt das hebräische Bild vom Herzen als innerem Menschen.
- source_word: בִּישׁוּעָתֶךָ
  choice: über deine Rettung
  rationale: יְשׁוּעָה kann konkrete Befreiung aus Not und Heil im weiteren Sinn bezeichnen. „Rettung“ passt zum unmittelbaren Klagekontext, ohne die breitere Bedeutung auszuschließen; „über“ ist bei „jubeln“ natürliches Deutsch.
- source_word: אָשִׁירָה
  choice: Ich will singen
  rationale: Der Kohortativ drückt Entschluss und Absicht aus. „Ich will singen“ bewahrt diesen willentlichen Nachdruck.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Beim deutschen Verb „singen“ bezeichnet „für“ den Adressaten idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt die Begründung des Singens ein. „Denn“ verbindet die Aussage in gehobenem, aber gegenwärtigem Deutsch.
- source_word: גָמַל עָלָי
  choice: er hat mir Gutes erwiesen
  rationale: Die Wendung bezeichnet hier Gottes wohltuendes, großzügiges Handeln am Beter. „Mir Gutes erwiesen“ ist natürlich, würdig und vermeidet den möglichen Vergeltungssinn von „vergolten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den offenbarten Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: Im Zusammenhang der Klage steht die konkrete Befreiung aus gegenwärtiger Not im Vordergrund. Da das Wort zugleich umfassenderes Heil bezeichnen kann, wird diese echte Bedeutungsweite in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Knappheit. Der Kontrast am Versanfang, die Zukunftserwartung beim Jubeln und der entschlossene Ton des Kohortativs bleiben erhalten.
