source:
  edition: WLC
  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: de
  text: Wie lange, Yahweh, willst du mich für immer vergessen? Wie lange willst du dein Angesicht vor mir verbergen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dein Angesicht“. Das Verbergen des Angesichts kann im Hebräischen den Entzug von Gegenwart oder Zuwendung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Wie lange
  rationale: Die idiomatische Dauerfrage bewahrt den wiederholten Klageruf des Hebräischen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תִּשְׁכָּחֵנִי
  choice: willst du mich vergessen
  rationale: Das Qal-Imperfekt mit Objektssuffix wird als fortdauernde, auf ihr Ende zielende Klage wiedergegeben; „vergessen“ entspricht dem unmittelbaren Wortsinn.
- source_word: נֶצַח
  choice: für immer
  rationale: Die adverbiale Bestimmung verschärft die Klage und lässt bewusst die spannungsvolle Frage stehen, ob Gottes Vergessen endlos dauern soll.
- source_word: תַּסְתִּיר
  choice: willst du … verbergen
  rationale: Das Hifil von סתר bezeichnet hier das Verbergen des Angesichts; die Formulierung ist würdig und im Deutschen natürlich.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: Die konkrete hebräische Bildsprache bleibt erhalten; „Angesicht“ passt zum poetischen Register und kann Gegenwart oder Zuwendung mitschwingen lassen.
- source_word: מִמֶּנִּי
  choice: vor mir
  rationale: Bei „das Angesicht verbergen“ ist „vor mir“ die natürliche deutsche Wiedergabe der Trennung ausdrückenden Präposition.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Yahweh“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Deutung von פָּנֶיךָ
  choice: Das konkrete Bild „dein Angesicht“ im Haupttext bewahren
  alternative: deine Gegenwart; deine Zuwendung
  rationale: Das Bild kann Gottes Gegenwart und Gunst bezeichnen, sollte aber im Haupttext nicht auf nur eine dieser Bedeutungen eingeengt werden.
- issue: Spannung zwischen „wie lange“ und „für immer“
  choice: Die spannungsvolle Formulierung wörtlich-natürlich bewahren
  alternative: Wie lange noch willst du mich vergessen? Etwa für immer?
  rationale: Die hebräische Klage verbindet Dauerfrage und „für immer“ in einer zugespitzten Frage. Eine Glättung würde ihre emotionale und theologische Spannung abschwächen.
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdige Standardsprache. „Angesicht“ erhält die konkrete Bildsprache des Psalms; die Satzstellung folgt natürlichem Deutsch. Der Fußnotenmarker steht unmittelbar nach der bildhaften Wendung, die erläutert wird.
