  text: הַבִּ֣יטָֽ/ה עֲ֭נֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י הָאִ֥ירָ/ה עֵ֝ינַ֗/י פֶּן אִישַׁ֥ן הַ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: de
  text: Blicke her und antworte mir, Jahwe, mein Gott! Lass meine Augen leuchten,[a] damit ich nicht den Todesschlaf schlafe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Erhelle meine Augen“ oder „Lass meine Augen strahlen“. Das hebräische Bild kann neue Lebenskraft, Klarheit oder Hoffnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „damit ich nicht den Tod schlafe“; die hebräische Verbindung von Schlaf und Tod ist knapp und ungewöhnlich. Auch möglich: „damit ich nicht im Tod schlafe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: Blicke her
  rationale: Der Imperativ fordert Gottes aufmerksames Hinsehen. „Blicke her“ ist direkt und bewahrt den bildhaften Charakter, ohne ein im Hebräischen unausgesprochenes Objekt einzufügen.
- source_word: עֲנֵנִי
  choice: antworte mir
  rationale: ענה bezeichnet im Gebetskontext gewöhnlich das Antworten Gottes. Die Wiedergabe bleibt persönlich und direkt, ohne bereits eine günstige Erhörung vorauszusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die Possessivform wird unmittelbar wiedergegeben und bewahrt die persönliche Anrede.
- source_word: הָאִירָה עֵינַי
  choice: Lass meine Augen leuchten
  rationale: Die Kausativform von אור bezeichnet das Leuchtenlassen beziehungsweise Erhellen. Die deutsche Formulierung erhält das körperliche Bild und legt es nicht einseitig als Kraft, Einsicht oder Hoffnung aus.
- source_word: פֶּן
  choice: damit ich nicht
  rationale: פֶּן leitet die befürchtete Folge ein. „Damit ich nicht“ gibt dies in natürlichem modernem Deutsch wieder; „sonst“ wäre ebenfalls möglich.
- source_word: אִישַׁן הַמָּוֶת
  choice: in den Tod einschlafe
  rationale: Die knappe hebräische Verbindung von Schlaf und Tod bleibt als Metapher erhalten. Die Formulierung ist im Deutschen verständlich, ohne das zusätzliche Substantiv „Todesschlaf“ in den Haupttext einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ erhält diese Eigenname-Funktion, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Bildes vom Leuchten der Augen
  choice: Das Bild wörtlich bewahren
  alternative: Gib mir neue Kraft / schenke mir Klarheit / gib mir neue Hoffnung
  rationale: Das Bild kann neue Lebenskraft, Klarheit oder Hoffnung umfassen. Da der Vers keine dieser Bedeutungen isoliert, bleibt die bildhafte Offenheit erhalten.
- issue: Verbindung von Schlaf und Tod
  choice: in den Tod einschlafen
  alternative: den Todesschlaf schlafen
  rationale: Die hebräische Wendung ist ungewöhnlich knapp. Die gewählte Fassung bewahrt den Tod-Schlaf-Zusammenhang, ohne eindeutig festzulegen, ob lediglich das Sterben oder darüber hinaus ein bestimmter Zustand nach dem Tod gemeint ist.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Imperative bleiben unmittelbar; die beiden zentralen hebräischen Bilder – leuchtende Augen und Schlaf im Verhältnis zum Tod – werden nicht in eine einzige Deutung aufgelöst.
