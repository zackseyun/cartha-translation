lexical_decisions:
- source_word: פֶּן
  choice: damit … nicht
  rationale: Leitet eine befürchtete Folge ein, deren Eintreten verhindert werden soll; im Deutschen ist die negative Zweck- beziehungsweise Folgekonstruktion natürlich und klar.
- source_word: יֹאמַר
  choice: sagt
  rationale: Gibt אמר in Verbindung mit direkter Rede schlicht und unmittelbar wieder.
- source_word: אֹיְבִי
  choice: mein Feind
  rationale: Bewahrt Numerus und Personalsuffix des hebräischen Singulars.
- source_word: יְכָלְתִּיו
  choice: Ich habe ihn überwunden
  rationale: יכל bezeichnet hier das Vermögen beziehungsweise Obsiegen über jemanden. „Überwunden“ lässt den Feind seinen vermeintlichen Sieg behaupten, ohne völlige Vernichtung auszudrücken.
- source_word: צָרַי
  choice: meine Gegner
  rationale: Der Plural mit Personalsuffix wird bewahrt; „Gegner“ unterscheidet die Gruppe sprachlich vom einzelnen „Feind“, ohne eine zusätzliche Art der Feindschaft festzulegen.
- source_word: יָגִילוּ
  choice: jubeln
  rationale: Das Verb bezeichnet freudiges, triumphierendes Frohlocken; „jubeln“ trifft hier die Schadenfreude der Gegner.
- source_word: כִּי
  choice: weil
  rationale: 'Gibt die naheliegende kausale Beziehung wieder: Das Wanken des Beters ist der Grund ihres Jubels. Die mögliche temporale Nuance wird in der Fußnote gewahrt.'
- source_word: אֶמּוֹט
  choice: ich ins Wanken gerate
  rationale: Das Nifal von מוט bezeichnet ein Erschüttertwerden, Wanken oder Straucheln. Die Formulierung drückt gefährdete Standfestigkeit aus, ohne bereits einen endgültigen Sturz vorauszusetzen.
