id: PSA.80.19
reference: Psalms 80:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: de
  text: Jahwe, Gott der Heerscharen, stelle uns wieder her[a]! Lass dein Angesicht leuchten, damit wir gerettet werden[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bring uns zurück“ beziehungsweise „Führe uns zurück“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dann werden wir gerettet.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner etablierten Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort steht als Gottesbezeichnung in Apposition zu „Jahwe“ und bildet mit צְבָאוֹת die Anrede „Gott der Heerscharen“.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die Wiedergabe bewahrt die Breite des hebräischen Ausdrucks, der geordnete Scharen beziehungsweise Heere, besonders die himmlischen, bezeichnen kann. Sie ist als Bestandteil des traditionellen Gottestitels im Deutschen verständlich.
- source_word: הֲשִׁיבֵנוּ
  choice: stelle uns wieder her
  rationale: Der Hifil-Imperativ von שוב kann ein Zurückbringen oder eine Wiederherstellung bezeichnen. Im Refrain von Psalm 80 umfasst die Bitte sowohl Umkehr beziehungsweise Rückführung als auch die erneute Aufrichtung des Volkes.
- source_word: הָאֵר
  choice: lass … leuchten
  rationale: Die Form ist ein kausativer Imperativ. „Lass dein Angesicht leuchten“ gibt diese Kraft natürlich wieder und bewahrt zugleich das konkrete Bild.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: Die konkrete Rede vom Angesicht Gottes wird erhalten; sie bezeichnet hier seine gnädige, zugewandte Gegenwart. „Angesicht“ passt zum würdevollen poetischen Register.
- source_word: וְנִוָּשֵׁעָה
  choice: damit wir gerettet werden
  rationale: Die Nifal-Kohortativform folgt auf die Bitten und lässt sich als beabsichtigte beziehungsweise erhoffte Folge verstehen. Die Übersetzung wahrt diese Gebetsbewegung.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Jahwe, Gott der Heerscharen
  alternative: Jahwe, Gott der Heere
  rationale: Der Gottesname bleibt als Eigenname erkennbar. „Heerscharen“ hält die mögliche Bezugnahme auf himmlische wie irdische Scharen offen, während „Heere“ enger militärisch wirken kann.
- issue: Bedeutungsumfang der Bitte הֲשִׁיבֵנוּ
  choice: stelle uns wieder her
  alternative: bring uns zurück
  rationale: Die gewählte Formulierung umfasst die Wiederaufrichtung des Volkes, ohne die im Verb mögliche Vorstellung des Zurückbringens zu leugnen; diese bleibt in der Fußnote sichtbar.
- issue: Verhältnis der Schlussform zu den vorangehenden Imperativen
  choice: damit wir gerettet werden
  alternative: dann werden wir gerettet
  rationale: Der Kohortativ kann Ziel oder erwartete Folge ausdrücken. Der Haupttext liest ihn als erbetene Ziel- beziehungsweise Folgewirkung; die mögliche resultative Aussage wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Gebetssprache. „Angesicht“ und „Heerscharen“ bewahren die poetische Bildwelt und den feierlichen Gottesnamen, ohne auf die heute weithin unverständliche Form „Zebaoth“ zurückzugreifen.
