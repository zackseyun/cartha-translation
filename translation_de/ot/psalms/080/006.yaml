  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: de
  text: Du machst uns zum Streitgegenstand unserer Nachbarn, und unsere Feinde verspotten sie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie“ beziehungsweise „ihnen“. Das poetische Pronomen steht in der dritten Person Plural; sein Bezug ist nicht völlig eindeutig. Sinngemäß könnte auch „uns“ gemeint sein.'
    reason: לָמוֹ ist formal ein poetisches Pronomen der dritten Person Plural. Die Anmerkung bewahrt die im Kontext mögliche Rückbeziehung auf das betende Volk, ohne die hebräische Form im Haupttext zu verändern.
lexical_decisions:
- source_word: מָדוֹן
  choice: Anlass des Streits
  rationale: Das Substantiv bezeichnet Streit oder Zwietracht. Die Wendung gibt natürlich wieder, dass das Volk für seine Nachbarn zum Gegenstand beziehungsweise Anlass von Auseinandersetzungen wird, ohne die genaue Art des Streits festzulegen.
- source_word: יִלְעֲגוּ
  choice: verspotten
  rationale: Das Verb bezeichnet höhnisches oder spöttisches Reden und wird im Deutschen prägnant mit „verspotten“ wiedergegeben.
- source_word: לָמוֹ
  choice: sie
  rationale: Die Form ist ein poetisches Pronomen der dritten Person Plural und wird entsprechend ihrem formalen Bezug mit „sie“ wiedergegeben; im unmittelbaren deutschen Satz bezieht es sich am ehesten auf die Nachbarn.
theological_decisions:
- issue: Bezug des pluralischen Pronomens לָמוֹ
  choice: „sie“ mit erläuternder Fußnote zur möglichen Beziehung auf „uns“
  alternative: „uns“
  rationale: Der masoretische Text bietet formal die dritte Person Plural, deren nächster möglicher Bezug die Nachbarn sind. Da poetischer Sprachgebrauch beziehungsweise ein gedanklicher Rückbezug auf das betende Volk nicht völlig ausgeschlossen ist, wird die Spannung nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Anlass des Streits“ vermeidet sowohl eine unnötig juristische Färbung als auch das eher umgangssprachliche Bild „Zankapfel“.
