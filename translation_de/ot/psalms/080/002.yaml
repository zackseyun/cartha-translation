  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: de
  text: Vor Ephraim, Benjamin und Manasse wecke deine Macht und komm, um uns zu retten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „und geh zu unserer Rettung“. Das hebräische Verb bedeutet „gehen“; im Zusammenhang ist es eine Bitte an Gott, zugunsten seines Volkes einzugreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: Vor
  rationale: Die räumliche Präposition zeichnet Gott als den, der vor den genannten Stämmen erscheint oder einherzieht. „Vor“ ist im Deutschen knapp und wahrt diese Bildsprache.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: Ephraim, Benjamin und Manasse
  rationale: Die Stammesnamen werden in ihren geläufigen deutschen Formen wiedergegeben; die deutsche Aufzählungsform glättet die wiederholte Konjunktion, ohne den Inhalt zu verändern.
- source_word: עוֹרְרָה
  choice: wecke
  rationale: Der Imperativ bezeichnet das Erwecken oder In-Bewegung-Setzen der göttlichen Macht. „Wecke“ erhält das hebräische Bild und klingt als dringliche Bitte natürlich.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: deine Macht
  rationale: גְּבוּרָה kann Stärke, Kraft oder Macht bezeichnen. „Macht“ ist hier würdig, verständlich und bezeichnet Gottes wirksame Stärke.
- source_word: וּלְכָה
  choice: und komm
  rationale: Obwohl הלך wörtlich „gehen“ bedeutet, ist die Bewegungsrichtung in der an Gott gerichteten Bitte kontextuell auf die Hilfesuchenden bezogen. „Komm“ gibt diesen pragmatischen Sinn natürlich wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: um uns zu retten
  rationale: Die Konstruktion bezeichnet Ziel oder Zweck der erbetenen Bewegung Gottes. „Um uns zu retten“ gibt den im Substantiv יְשׁוּעָה enthaltenen Rettungsgedanken idiomatisch wieder.
theological_decisions:
- issue: Göttliches Handeln in der Bitte
  choice: „wecke deine Macht und komm, um uns zu retten“ als unmittelbare Bitte um machtvolles Eingreifen
  alternative: „wecke deine Stärke und geh zu unserer Rettung“
  rationale: Der Vers formuliert eine dringliche Bitte, ohne die Art des Eingreifens dogmatisch näher festzulegen. Die Übersetzung bewahrt sowohl die Bildsprache der geweckten Macht als auch die Bitte um Rettung.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die knappen Imperative erhalten die Dringlichkeit des Hebräischen; unnötig altertümliche Formen werden vermieden.
