  text: לָ֭/מָּה פָּרַ֣צְתָּ גְדֵרֶ֑י/הָ וְ֝/אָר֗וּ/הָ כָּל עֹ֥בְרֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: de
  text: Warum hast du ihre Zäune niedergerissen,[a] sodass alle, die auf dem Weg vorbeikommen, sie abpflücken?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Mauern“ oder „ihre Hecken“. Das hebräische Wort bezeichnet die schützende Einfriedung eines Weinbergs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie abernten“ oder „sie leer pflücken“. Das hebräische Verb bezeichnet hier das Pflücken an der Weinrebe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Die Fragepartikel leitet eine klagende direkte Frage an Gott ein; „Warum“ ist die natürliche deutsche Entsprechung.
- source_word: פָּרַצְתָּ
  choice: hast du … niedergerissen
  rationale: פרץ bezeichnet das Durchbrechen einer Barriere. Bei der Einfriedung eines Weinbergs gibt „niedergerissen“ den Verlust des Schutzes treffend wieder.
- source_word: גְדֵרֶיהָ
  choice: ihre Schutzmauern
  rationale: גדר bezeichnet die schützende Mauer, Hecke oder Einfriedung eines Weinbergs. „Schutzmauern“ macht Funktion und Bild verständlich, ohne an eine Stadtmauer zu binden.
- source_word: וְאָרוּהָ
  choice: sodass … sie abpflücken
  rationale: ארה bedeutet hier pflücken beziehungsweise durch Pflücken abernten. Das feminine Objekt bezieht sich auf die zuvor dargestellte Weinrebe; Deutsch kann dieses Bild unmittelbar mit „sie“ bewahren.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: alle, die des Weges kommen
  rationale: Die Formulierung bewahrt den poetischen Klang und bezeichnet sämtliche Vorübergehenden auf dem Weg.
theological_decisions:
- issue: Bezug der femininen Suffixe
  choice: Die Suffixe werden auf die im Kontext dargestellte Weinrebe bezogen und mit „ihre/sie“ wiedergegeben.
  alternative: Das Bild unmittelbar auf Israel auflösen oder „ihre Früchte“ ergänzen.
  rationale: Der unmittelbare Kontext stellt Israel bildlich als eine aus Ägypten gebrachte Weinrebe dar. Die feminine Wiedergabe erhält diese Metapher und vermeidet eine unnötige Auflösung.
- issue: Verhältnis der beiden Satzhälften
  choice: וְ wird kontextuell mit „sodass“ wiedergegeben.
  alternative: Reihend mit „und“ übersetzen.
  rationale: Das Niederreißen der Einfriedung ermöglicht den Vorübergehenden das Abpflücken. „Sodass“ macht diese im Kontext naheliegende Folgebeziehung deutlich, ohne die theologische Spannung der an Gott gerichteten Frage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Färbung. „Des Weges kommen“ wahrt den Psalmton, bleibt aber allgemein verständlich. Die Weinrebenmetapher und die direkte Anklagefrage an Gott bleiben erhalten.
