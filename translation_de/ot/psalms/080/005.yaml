  text: הֶ֭אֱכַלְתָּ/ם לֶ֣חֶם דִּמְעָ֑ה וַ֝/תַּשְׁקֵ֗/מוֹ בִּ/דְמָע֥וֹת שָׁלִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/005.yaml
  text: You have fed them bread of tears[a], and given them tears to drink in full measure.
translation:
  language: de
  text: Du hast sie mit Tränenbrot gespeist[a] und ihnen Tränen in reichem Maß zu trinken gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brot der Träne“. Der letzte Ausdruck des Verses kann auch „nach dem Drittelmaß“ oder „in dreifachem Maß“ bedeuten; vermutlich ist eine große Menge gemeint, doch die genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: Du hast sie … gespeist
  rationale: Der Hifil von אכל mit Suffix der 3. Person Plural bezeichnet ein Veranlassen zum Essen beziehungsweise Speisen. Das Perfekt wird als vollendetes Handeln Gottes mit Gegenwartsbezug wiedergegeben.
- source_word: לֶחֶם דִּמְעָה
  choice: Tränenbrot
  rationale: Das natürliche deutsche Kompositum bewahrt das eindringliche Bild des hebräischen Ausdrucks und vermeidet eine erklärende Verflachung zu bloßem Leid.
- source_word: וַתַּשְׁקֵמוֹ
  choice: und ihnen … zu trinken gegeben
  rationale: Der Hifil von שקה bedeutet, jemanden trinken zu lassen beziehungsweise ihm zu trinken zu geben. Die Formulierung ist im Deutschen natürlich und erhält den Parallelismus zum Speisen.
- source_word: בִּדְמָעוֹת
  choice: Tränen
  rationale: Die Präposition ב bezeichnet hier im Zusammenhang mit dem Verb des Tränkens den Stoff, der zu trinken gegeben wird; im Deutschen steht dieser ohne Präposition.
- source_word: שָׁלִישׁ
  choice: in reichem Maß
  rationale: Das Wort bezeichnet hier vermutlich ein Maß oder eine große Menge, doch seine genaue Bedeutung ist unsicher. „In reichem Maß“ vermittelt die Fülle, ohne eine nicht gesicherte Maßeinheit festzulegen.
