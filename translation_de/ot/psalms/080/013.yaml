  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: de
  text: Ein Wildschwein aus dem Wald verwüstet ihn[a], und die wilden Tiere des Feldes weiden ihn ab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „frisst ihn kahl“; das seltene Verb beschreibt zerstörerisches Fressen oder Abstreifen.'
