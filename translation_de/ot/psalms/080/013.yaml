    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: verwüstet ihn
  rationale: Das seltene Verb כרסם bezeichnet zerstörerisches Fressen, Benagen oder Abstreifen. „Verwüstet“ gibt die dadurch angerichtete Zerstörung des Weinstocks natürlich wieder, ohne die genaue Art des Fraßes zu eng festzulegen.
- source_word: חֲזִיר
  choice: Wildschwein
  rationale: חֲזִיר kann Schwein oder Eber bezeichnen; zusammen mit „aus dem Wald“ ist „Wildschwein“ im modernen Deutschen die natürliche und eindeutige Wiedergabe.
- source_word: מִיָּעַר
  choice: aus dem Wald
  rationale: Die Präposition מן bezeichnet hier die Herkunft; „aus dem Wald“ ist idiomatisch und genau.
- source_word: זִיז שָׂדַי
  choice: die wilden Tiere des Feldes
  rationale: Das seltene זִיז bezeichnet sich regende Lebewesen, im Kontext freilebende Tiere. Die traditionelle Bildsprache „Tiere des Feldes“ bleibt erhalten; „wild“ verdeutlicht den gemeinten Gegensatz zu Haustieren.
- source_word: יִרְעֶנָּה
  choice: weiden ihn ab
  rationale: רעה bedeutet im Qal „weiden“ oder „grasen“. „Ihn abweiden“ beschreibt natürlich, wie Tiere den zuvor als Weinstock dargestellten Gegenstand fressen; das maskuline Pronomen bezieht sich im deutschen Kontext auf „Weinstock“.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Parallelstruktur. „Wildschwein“ und „wilde Tiere“ sind allgemein verständlich; „des Feldes“ bewahrt die biblische Bildsprache. Die deutschen Pronomen richten sich nach dem im Zusammenhang genannten Weinstock.
