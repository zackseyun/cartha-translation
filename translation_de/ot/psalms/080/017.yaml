  text: תְּֽהִי יָ֭דְ/ךָ עַל אִ֣ישׁ יְמִינֶ֑/ךָ עַל בֶּן אָ֝דָ֗ם אִמַּ֥צְתָּ לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: de
  text: Deine Hand sei auf dem Mann zu deiner Rechten[a], auf dem Menschensohn[b], den du für dich stark gemacht hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem Mann deiner rechten Hand“. Die hebräische Wendung kann einen Menschen bezeichnen, der besonders begünstigt oder gestützt wird oder zu Gottes Rechten steht.'
    reason: lexical_alternative
  - marker: b
    text: „Menschensohn“ kann hier einfach „Mensch“ bedeuten; im biblischen Zusammenhang kann die Bezeichnung zugleich königliche oder messianische Anklänge haben.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: sei
  rationale: Der Jussiv von היה drückt hier eine Bitte aus. „Sei“ gibt diese Gebetssprache im Deutschen knapp und würdig wieder.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Das konkrete Bild der Hand bleibt erhalten; Unterstützung, Macht und schützendes Eingreifen werden nicht ausdrücklich festgelegt.
- source_word: עַל
  choice: über
  rationale: „Über“ bewahrt die räumliche Metapher und passt zur gehobenen poetischen Gebetssprache.
- source_word: אִישׁ יְמִינֶךָ
  choice: der Mann deiner rechten Hand
  rationale: Die ungewöhnliche hebräische Verbindung wird weitgehend formal bewahrt. So bleibt offen, ob besondere Begünstigung, Unterstützung, Zugehörigkeit oder eine Stellung an Gottes rechter Seite gemeint ist.
- source_word: בֶּן אָדָם
  choice: der Menschensohn
  rationale: Die singularische, männliche Form und die literarische Wiederaufnahme bleiben erhalten. Der Ausdruck kann schlicht einen Menschen bezeichnen, ohne dass mögliche königliche oder messianische Resonanzen ausgeschlossen werden.
- source_word: אִמַּצְתָּ
  choice: den du stark gemacht hast
  rationale: Das Piel von אמץ bezeichnet das Stärken beziehungsweise Starkmachen. Die Formulierung gibt die bewirkte Stärke und den vollendeten Verbalaspekt wieder.
- source_word: לָּךְ
  choice: für dich
  rationale: Die Präposition mit Suffix bezeichnet hier Zugehörigkeit oder Zweckbestimmung, ohne stärker als nötig mit „für dich selbst“ zu deuten.
theological_decisions:
- issue: Ob „der Mann deiner rechten Hand“ beziehungsweise „der Menschensohn“ ausdrücklich messianisch zu übersetzen ist
  choice: Die poetische Personenbezeichnung bleibt ohne Großschreibung oder messianische Erläuterung im Haupttext stehen.
  alternative: Eine ausdrücklich messianische Wiedergabe oder eine ausschließlich kollektive Deutung auf Israel.
  rationale: Der hebräische Wortlaut lässt eine individuelle, königliche, kollektive oder im weiteren kanonischen Zusammenhang messianische Deutung zu. Die Übersetzung entscheidet diese Spannung nicht vorzeitig.
translation_notes:
  register: Moderne, würdige Gebetssprache mit bewusst bewahrten konkreten Bildern und poetischer Mehrdeutigkeit. Die ungewöhnliche Wendung „Mann deiner rechten Hand“ ist durch eine Fußnote abgesichert.
