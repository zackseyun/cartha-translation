source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ אֶל שֹׁשַׁנִּ֑ים עֵד֖וּת לְ/אָסָ֣ף מִזְמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/000.yaml
  text: 'For the choir director: according to “Lilies.” A testimony[b][a]. A psalm of Asaph.'
translation:
  language: de
  text: 'Für den musikalischen Leiter: Nach »Lilien«. Ein Zeugnis.[a] Ein Psalm Asafs.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise bilden »Lilien – Zeugnis« eine zusammengehörige musikalische oder liturgische Bezeichnung. Die hebräische Überschrift enthält wohl Angaben, deren genaue Bedeutung und Gliederung unklar sind.
    reason: alternative_reading
  - marker: b
    text: Die hebräische Form kann einen Psalm von Asaf, für Asaf oder aus der mit Asaf verbundenen Sammlung bezeichnen.
    reason: source_ambiguity
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die feste Überschriftsformel bezeichnet wahrscheinlich den Verantwortlichen für die musikalische Aufführung; die Wiedergabe ist modern und lässt offen, ob er einen Chor, Instrumentalisten oder beides leitete.
- source_word: אֶל
  choice: Nach
  rationale: In Psalmüberschriften leitet die Präposition vermutlich eine Melodie- oder Vortragsangabe ein. »Nach« ist im Deutschen eine natürliche, aber bewusst nicht überpräzise Wiedergabe.
- source_word: שֹׁשַׁנִּים
  choice: »Lilien«
  rationale: Wörtlich bedeutet das Wort »Lilien«; hier handelt es sich wahrscheinlich um den Namen einer Melodie oder eine andere musikalische Bezeichnung. Anführungszeichen kennzeichnen den Titelcharakter.
- source_word: עֵדוּת
  choice: Ein Zeugnis
  rationale: Die Grundbedeutung wird transparent wiedergegeben. Ob das Wort eine Gattungs-, liturgische oder musikalische Angabe ist und wie eng es zu »Lilien« gehört, bleibt im Hebräischen unsicher.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Die idiomatische deutsche Zuordnung wahrt grundsätzlich die mögliche Beziehung zu Asaf, ohne im Haupttext ausdrücklich zwischen Autorschaft, Zugehörigkeit und Sammlungseinordnung zu entscheiden.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Dies ist die übliche und sachgerechte deutsche Bezeichnung für ein zum Singen bestimmtes Lied dieser Gattung.
theological_decisions:
- issue: Art der Zuordnung zu Asaf
  choice: Ein Psalm Asafs
  alternative: Ein Psalm für Asaf / ein zu Asaf gehörender Psalm
  rationale: Das hebräische לְ kann Autorschaft, Zugehörigkeit, Widmung oder Sammlungszuordnung ausdrücken. Die traditionelle knappe Form bleibt lesbar; eine Fußnote hält die weitere Möglichkeit offen.
- issue: Beziehung von עֵדוּת zu »Lilien«
  choice: 'Als selbstständige Angabe: »Ein Zeugnis«'
  alternative: 'Als Teil eines Titels: »Lilien – ein Zeugnis«'
  rationale: Die Abfolge der Überschrift erlaubt keine sichere syntaktische Zuordnung. Die Trennung vermeidet, aus zwei möglicherweise eigenständigen Angaben ohne Not einen einzigen Titel zu machen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappen Nominalsätze entsprechen dem Charakter einer Psalmüberschrift. Die unsicheren musikalischen und liturgischen Fachangaben werden nicht spekulativ aufgelöst.
