  source_fidelity: Der Entwurf gibt die beiden femininen passivischen Partizipien שְׂרֻפָה und כְּסוּחָה knapp und bildgerecht wieder. „Vom Feuer verbrannt“ entspricht der präpositionalen Wendung בָּאֵשׁ; „abgehauen“ bewahrt das Pflanzenbild. „vor dem Schelten deines Angesichts“ bildet מִגַּעֲרַת פָּנֶיךָ ohne interpretierende Auflösung ab. Der Plural „gehen sie zugrunde“ entspricht יֹאבֵדוּ und erhält den im masoretischen Text vorhandenen Numeruswechsel.
  naturalness: Die Formulierung ist in modernem Standarddeutsch verständlich, poetisch verdichtet und dem Psalmregister angemessen. Die elliptische Reihung „Vom Feuer verbrannt, abgehauen“ ist stilistisch tragfähig. „Schelten deines Angesichts“ ist bewusst konkrete, leicht archaisch-poetische Bildsprache, jedoch weder unverständlich noch künstlich.
  terminology: „Angesicht“ ist für פָּנִים in diesem poetisch-theologischen Kontext angemessen und vermeidet eine ausdeutende Abstraktion wie „Gegenwart“ oder „Zorn“. „Zugrunde gehen“ trifft אָבַד zuverlässig. Die Übersetzung folgt auch der englischen Auditfassung in ihrer knappen, nicht harmonisierenden Syntax.
