source:
  edition: WLC
  text: שְׂרֻפָ֣ה בָ/אֵ֣שׁ כְּסוּחָ֑ה מִ/גַּעֲרַ֖ת פָּנֶ֣י/ךָ יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/016.yaml
  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: de
  text: Vom Feuer verbrannt, abgehauen – vor dem Schelten deines Angesichts gehen sie zugrunde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה
  choice: verbrannt
  rationale: Das feminine passive Partizip nimmt das Bild des Weinstocks aus dem Zusammenhang auf; die knappe partizipiale Form des Hebräischen bleibt erhalten.
- source_word: כְּסוּחָה
  choice: abgehauen
  rationale: Das Wort bezeichnet ein gewaltsames Abschneiden oder Abhauen und führt das Pflanzenbild fort.
- source_word: מִגַּעֲרַת
  choice: vor dem Schelten
  rationale: Die Präposition kann hier die Ursache beziehungsweise den Anlass des Untergangs ausdrücken; „vor“ wahrt zugleich die bildhafte Vorstellung des Zurückweichens angesichts göttlichen Scheltens.
- source_word: פָּנֶיךָ
  choice: deines Angesichts
  rationale: „Angesicht“ gibt das konkrete Bild des hebräischen Ausdrucks würdig wieder, ohne es zu „Gegenwart“ oder „Zorn“ auszudeuten.
- source_word: יֹאבֵדוּ
  choice: gehen sie zugrunde
  rationale: Die pluralische Verbform wird ausdrücklich bewahrt, auch wenn die beiden vorausgehenden Partizipien feminin singularisch sind; so bleibt der Numeruswechsel des Ausgangstextes sichtbar.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Angesicht
  choice: deines Angesichts
  alternative: deiner Gegenwart
  rationale: Die konkrete und theologisch spannungsreiche Bildsprache des Hebräischen wird nicht abstrahierend aufgelöst.
- issue: Bezug der pluralischen Verbform
  choice: gehen sie zugrunde
  alternative: geht sie zugrunde
  rationale: Der masoretische Text hat einen Plural. Die Übersetzung glättet den Wechsel vom femininen Singular zum Plural nicht und legt dessen Bezug nicht einseitig fest.
translation_notes:
  register: Knappe, poetische und würdige Sprache. Die elliptische Satzgestalt sowie der Wechsel vom femininen Singular der Partizipien zum Plural des Schlussverbs bleiben erhalten.
