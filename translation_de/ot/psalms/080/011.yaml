  text: תְּשַׁלַּ֣ח קְצִירֶ֣/הָ עַד יָ֑ם וְ/אֶל נָ֝הָ֗ר יֽוֹנְקוֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/011.yaml
  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: de
  text: Er streckte seine Zweige[a] bis zum Meer aus und seine Triebe zum Strom hin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort für „Zweige“ kann allgemeiner den ausgreifenden Wuchs des Weinstocks bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Der „Strom“ ist wahrscheinlich der Euphrat. Die Wendung erinnert an die ideale Ausdehnung des Landes Israel vom Meer bis zum Euphrat.
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: Er ließ … reichen
  rationale: Das Piel von שלח beschreibt hier, wie der zuvor genannte Weinstock seinen Wuchs ausbreitet. Die deutsche Formulierung gibt sowohl die aktive Entfaltung als auch die durch עַד bezeichnete räumliche Ausdehnung natürlich wieder.
- source_word: קְצִירֶהָ
  choice: seine Zweige
  rationale: Das hier selten und in dieser Bedeutung ungewöhnlich gebrauchte Wort bezeichnet im Bild des Weinstocks offenbar dessen ausgreifenden Wuchs. „Zweige“ passt zum Parallelismus mit „Triebe“, ohne die genaue Art des Wuchses zu eng festzulegen.
- source_word: עַד יָם
  choice: bis zum Meer
  rationale: עַד bezeichnet die erreichte Ausdehnung. „Bis zum Meer“ ist im Deutschen prägnant und entspricht der wahrscheinlich gemeinten westlichen Grenze, dem Mittelmeer.
- source_word: וְאֶל נָהָר
  choice: und … bis zum Strom
  rationale: נהר ist hier wahrscheinlich der Euphrat in der traditionellen Grenzformel. „Der Strom“ bewahrt den bestimmten, hervorgehobenen geografischen Bezug und entspricht würdigem deutschem Bibelstil.
- source_word: יוֹנְקוֹתֶיהָ
  choice: seine Triebe
  rationale: Das Wort bezeichnet junge, frisch wachsende Ausläufer oder Schösslinge. „Triebe“ ist im Deutschen natürlich und erhält das Pflanzenbild.
theological_decisions:
- issue: Geografische Deutung von יָם und נָהָר
  choice: Die Übersetzung belässt „Meer“ und „Strom“ im Vers und erläutert die wahrscheinlichen Bezüge in Fußnoten.
  alternative: Die Namen „Mittelmeer“ und „Euphrat“ unmittelbar in den Haupttext einsetzen.
  rationale: Der hebräische Text nennt keine Eigennamen. Die offene poetische Form bleibt daher im Haupttext erhalten, während der wahrscheinlich gemeinte territoriale Horizont Israels erklärt wird.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischem Ton. Das maskuline Pronomen nimmt den Weinstock aus dem Kontext auf. Der parallele Satzbau und das räumliche Bild bleiben erhalten; ungewöhnliche beziehungsweise implizite geografische Bezüge werden knapp erläutert.
