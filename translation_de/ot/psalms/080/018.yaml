id: PSA.80.18
reference: Psalms 80:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹא נָס֥וֹג מִמֶּ֑/ךָּ תְּ֝חַיֵּ֗/נוּ וּ/בְ/שִׁמְ/ךָ֥ נִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: de
  text: Dann werden wir nicht von dir zurückweichen. Schenke uns Leben[a], und wir werden deinen Namen anrufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Belebe uns“ oder „Erhalte uns am Leben“.'
    reason: Das hebräische Verb kann Lebensspende, Wiederbelebung oder Bewahrung des Lebens bezeichnen.
lexical_decisions:
- source_word: וְלֹא
  choice: Dann werden wir nicht
  rationale: Das einleitende וְ kann hier im Zusammenhang eine Folge ausdrücken. „Dann“ stellt den Bezug zur vorausgehenden Bitte her, ohne ihn stärker als nötig festzulegen.
- source_word: נָסוֹג מִמֶּךָּ
  choice: von dir zurückweichen
  rationale: סוג bezeichnet ein Zurückweichen oder Sich-Zurückziehen; die Verbindung mit מִן ist trennend. Die Wiedergabe bewahrt sowohl das Bewegungsbild als auch den Gedanken der Treue zu Gott.
- source_word: תְּחַיֵּנוּ
  choice: Schenke uns Leben
  rationale: Die Piel-Form von חיה kann bedeuten, Leben zu geben, wiederzubeleben oder am Leben zu erhalten. „Schenke uns Leben“ gibt die verursachende Bedeutung verständlich wieder und lässt den Umfang der Bitte offen.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: und wir werden deinen Namen anrufen
  rationale: קרא mit בְּשֵׁם bezeichnet hier das an Gott gerichtete Anrufen seines Namens. „Den Namen anrufen“ ist im Deutschen idiomatisch und wahrt den Gebets- und Gottesdienstbezug.
theological_decisions:
- issue: Bedeutungsumfang der Bitte um Leben
  choice: Eine offene Bitte, dass Gott Leben schenkt beziehungsweise erneuert
  alternative: Eine engere Bitte ausschließlich um geistliche Erweckung oder ausschließlich um körperliche Bewahrung
  rationale: Das hebräische חיה umfasst Wiederbelebung, Lebensspende und Erhaltung am Leben. Die Übersetzung legt nicht fest, ob nur Wiederherstellung oder Bewahrung gemeint ist.
- issue: Verhältnis zwischen Gottes Handeln und der Antwort des Volkes
  choice: Gottes Lebensgabe steht vor dem Anrufen seines Namens
  alternative: Das Anrufen als Voraussetzung für Gottes Lebensgabe zu verstehen
  rationale: Die Abfolge der hebräischen Verbformen stellt zunächst die Bitte an Gott und anschließend die Antwort des Volkes dar, ohne eine ausgearbeitete Heilsordnung daraus abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zurückweichen“ erhält das Bild des hebräischen Verbs; „Schenke uns Leben“ ist verständlich und bewahrt dessen Bedeutungsbreite.
