  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die wesentlichen Bedeutungen des Hebräischen zuverlässig wieder: Die Verneinung und das 1. Plural-Verb in „Dann werden wir nicht von dir zurückweichen“, die an Gott gerichtete Lebensbitte sowie die folgende Anrufung seines Namens. „Dann“ ist als kontextuelle Folgemarkierung im Anschluss an die vorherige Bitte vertretbar und legt keine unzulässige theologische Kausalität fest.'
