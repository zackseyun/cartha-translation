  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/015.yaml
  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
translation:
  language: de
  text: 'und den Stock[a], den deine rechte Hand gepflanzt hat,


    und den Sohn[b], den du für dich stark gemacht hast —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Schössling«, »Zweig« oder »Wurzelstock«. Das hebräische Wort ist selten und steht hier im Bild vom Weinstock.
    reason: lexical_alternative
  - marker: b
    text: 'Oder im Bild vom Weinstock: »Zweig«. Im Hebräischen steht »Sohn«; gemeint sein kann Israel als Ganzes.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  choice: Setzling
  rationale: Das seltene Substantiv steht im Bild vom Weinstock. »Setzling« bezeichnet natürlich etwas Gepflanztes, ohne es genauer als Zweig, Schössling oder Wurzelstock festzulegen.
- source_word: נָטְעָה
  choice: gepflanzt hat
  rationale: נטע bedeutet gewöhnlich »pflanzen« und bewahrt hier das durchgehende Weinberg-Bild.
- source_word: יְמִינֶךָ
  choice: deine rechte Hand
  rationale: Die konkrete Wendung bewahrt das Bild von Gottes machtvollem Handeln, statt es zum abstrakten Begriff »Macht« zu verflachen.
- source_word: וְעַל
  choice: und
  rationale: Die Präposition על markiert hier wahrscheinlich das zweite, parallel angefügte Objekt. Im Deutschen gibt die wiederholte Konjunktion die Koordination klar und natürlich wieder.
- source_word: בֵּן
  choice: Sohn
  rationale: Die gewöhnliche lexikalische Bedeutung ist »Sohn«. Diese Wiedergabe wahrt die personifizierende beziehungsweise korporative Spannung im Weinstock-Bild, statt das Wort botanisch umzudeuten.
- source_word: אִמַּצְתָּה
  choice: stark gemacht hast
  rationale: Die Piel-Form von אמץ drückt ein Stärken oder Starkmachen aus. Die Formulierung erhält diese kausative Bedeutung.
- source_word: לָּךְ
  choice: für dich
  rationale: Der Dativ bezeichnet Zugehörigkeit, Zweck oder Vorteil. »Für dich« bleibt nah am Hebräischen und legt die genaue Nuance nicht weiter fest.
theological_decisions:
- issue: Identität des »Sohnes« im Bild vom Weinstock
  choice: »Sohn« wird wörtlich innerhalb des korporativen Bildes beibehalten, ohne im Haupttext einen messianischen Bezug ausdrücklich festzulegen.
  alternative: Das Wort kann als bildlicher »Zweig« verstanden, korporativ auf Israel bezogen oder typologisch beziehungsweise messianisch gelesen werden.
  rationale: Der unmittelbare Zusammenhang stellt Israel als Weinstock dar; dennoch steht im Hebräischen ausdrücklich »Sohn«. Die Übersetzung bewahrt deshalb die Mehrdeutigkeit und löst sie weder botanisch noch christologisch auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus und das konkrete Bild der »rechten Hand« bleiben erhalten. Der Gedankenstrich zeigt wie in der Vorlage den offenen Anschluss des Verses an den folgenden Zusammenhang an.
