base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: de
  text: Du hast ihr Raum geschaffen[a]; sie schlug Wurzeln[b] und füllte das Land[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast ihr den Boden bereitet.“ Wörtlich: „Du hast vor ihr freigemacht/geräumt.“ Das hebräische Verb kann das Freimachen oder Bereiten von Raum vor der Rebe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie wurzelte ihre Wurzeln“; eine hebräische Ausdrucksweise dafür, dass sie fest Wurzeln fasste.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Erde“. Das hebräische Wort kann je nach gemeintem Umfang beides bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: Du hast vor ihr Raum geschaffen
  rationale: Das Piel von פנה mit לְפָנֶיהָ bezeichnet hier, im Bild des Weinstocks, das Freimachen oder Bereiten von Raum. Die Formulierung ist natürlich und bewahrt das feminine Pronomen, das sich auf die zuvor genannte Rebe bezieht.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: sie schlug Wurzeln
  rationale: 'Wörtlich steht eine figura etymologica: „sie wurzelte ihre Wurzeln“. „Sie schlug Wurzeln“ gibt die feste Verwurzelung idiomatisch wieder, ohne den im Hebräischen nicht ausdrücklich vorhandenen Zusatz „tief“ einzuführen.'
- source_word: וַתְּמַלֵּא
  choice: und füllte
  rationale: מלא bedeutet „füllen“. Diese Wiedergabe erhält das Bild der sich ausbreitenden Rebe und ist weniger auslegend als „bedeckte“.
- source_word: אָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Im Kontext des Weinstockbildes für Israel liegt „das Land“ nahe; die weitere Bedeutung bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Bezug und Reichweite des Weinstockbildes
  choice: Das Bild der Rebe wird im Vers beibehalten und nicht ausdrücklich als Israel aufgelöst.
  alternative: „Israel schlug Wurzeln und füllte das Land.“
  rationale: Der Zusammenhang identifiziert die Rebe mit Israel, doch der hebräische Vers selbst setzt die Metapher fort. Ihre Beibehaltung wahrt die poetische und theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Klang. Das feminine Pronomen „sie/ihr“ nimmt die im vorigen Vers genannte Rebe auf. Die Marker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
