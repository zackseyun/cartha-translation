id: PSA.80.14
reference: Psalms 80:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: de
  text: Gott der Heerscharen[a], kehre doch zurück! Schau vom Himmel herab und sieh; nimm dich dieses Weinstocks an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Gott der Heere“. Mit den „Heerscharen“ können die himmlischen Mächte gemeint sein.'
    reason: lexical_clarification
  - marker: b
    text: Das hebräische Verb kann „aufsuchen“, „nach jemandem oder etwas sehen“, „sich kümmern“ oder „prüfen“ bedeuten; hier ist ein Eingreifen zum Wohl des Weinstocks erbeten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Gott der Heerscharen
  rationale: Die etablierte Gottesbezeichnung bewahrt die militärische und kosmische Weite von צְבָאוֹת besser als das deutendere „allmächtiger Gott“. Eine Fußnote erläutert das heute weniger geläufige Wort.
- source_word: שׁוּב נָא
  choice: kehre doch zurück
  rationale: שׁוּב bezeichnet hier die erbetene Rückkehr beziehungsweise erneute Hinwendung Gottes; „doch“ gibt die bittende Partikel נָא in natürlichem Deutsch wieder.
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: Schau vom Himmel herab
  rationale: Die Wiedergabe erhält den aufmerksamen Blick und macht die räumliche Perspektive des Himmels im Deutschen natürlich deutlich.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Der einfache Imperativ bleibt als Teil der poetischen Folge erhalten, ohne ihn paraphrasierend auf „nimm wahr“ festzulegen.
- source_word: וּפְקֹד
  choice: nimm dich … an
  rationale: Im Gebetszusammenhang drückt פקד ein fürsorgliches Aufsuchen und Eingreifen aus. „Sich annehmen“ ist im heutigen Deutsch verständlich, wahrt die positive Stoßrichtung und vermeidet das meist negativ verstandene „heimsuchen“.
- source_word: גֶּפֶן זֹאת
  choice: dieses Weinstocks
  rationale: „Weinstock“ bewahrt das singularische Bild der einzelnen Rebe beziehungsweise Pflanze und macht daraus keinen Weinberg.
theological_decisions:
- issue: Wiedergabe des Gottestitels
  choice: Gott der Heerscharen
  alternative: allmächtiger Gott; Gott der Heere
  rationale: Die Übersetzung erhält das Bild Gottes als Herr über die Scharen beziehungsweise Heere und ersetzt es nicht durch den weiter gefassten Titel „der Allmächtige“.
- issue: Bedeutung von Gottes „Aufsuchen“ des Weinstocks
  choice: nimm dich dieses Weinstocks an
  alternative: suche diesen Weinstock auf; kümmere dich um diesen Weinstock; sieh nach diesem Weinstock
  rationale: Der Zusammenhang legt ein Eingreifen zum Wohl des als Weinstock dargestellten Volkes nahe. Die breite Bedeutungsweite des Verbs wird zugleich in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Imperativfolge. „Heerscharen“ bleibt wegen der geprägten Gottesbezeichnung stehen und wird erklärt; „nimm dich … an“ vermeidet das im heutigen Deutsch meist negativ gefärbte „heimsuchen“.
