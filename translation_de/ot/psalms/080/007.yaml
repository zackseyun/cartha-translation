id: PSA.80.7
reference: Psalms 80:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: de
  text: Gott der Heerscharen[b], bring uns zurück[a]; lass dein Angesicht leuchten[c], dann werden wir gerettet[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stell uns wieder her“, „führe uns zurück“ oder „kehre uns um“. Das hebräische Verb kann sowohl Rückkehr als auch Wiederherstellung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Heerscharen“ kann himmlische Heere und andere Mächte bezeichnen; der Titel stellt Gott als ihren Herrscher dar.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „dein Angesicht“. Das Bild bezeichnet Gottes gütige, zugewandte Gegenwart.'
    reason: idiom_explanation
  - marker: d
    text: 'Oder: „dann werden wir befreit“. Das hebräische Verb bezeichnet Rettung in einem weiten Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht hier als direkte Anrede an Israels Gott. Im Deutschen ist dafür weder ein zusätzliches Anredewort noch zwingend ein vorangestelltes „O“ nötig.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die feste Gottesbezeichnung bleibt in ihrer Weite erhalten und wird nicht ausschließlich auf menschliche oder ausschließlich auf himmlische Heere eingeengt.
- source_word: הֲשִׁיבֵנוּ
  choice: bring uns zurück
  rationale: Die Kausativform von שוב bedeutet, jemanden zurückzubringen bzw. wiederherzustellen. „Bring uns zurück“ gibt die Rückkehrbewegung unmittelbar wieder, ohne festzulegen, ob sie räumlich, geistlich oder bundesbezogen gemeint ist.
- source_word: וְהָאֵר
  choice: lass … leuchten
  rationale: Die Hifilform von אור ist kausativ. Mit „Angesicht“ klingt die deutsche Wendung „lass … leuchten“ natürlich und bewahrt das Bild.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: Die konkrete hebräische Metapher wird beibehalten. „Angesicht“ ist in diesem poetischen Gebet würdevoll und bezeichnet Gottes zugewandte, gütige Gegenwart.
- source_word: וְנִוָּשֵׁעָה
  choice: dann werden wir gerettet
  rationale: Die Nifalform von ישׁע bezeichnet Rettung oder Befreiung. „Gerettet“ wahrt die Bedeutungsbreite; „dann“ macht das im Satz ausgedrückte Ergebnis im Deutschen klar, ohne eine zusätzliche Bedingung einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֱלֹהִים צְבָאוֹת
  choice: Gott der Heerscharen
  alternative: Gott der Heere; Gott der himmlischen Heere
  rationale: „Heerscharen“ bewahrt die umfassende Vorstellung von Gottes Herrschaft über alle Mächte. Die Alternativen könnten den Titel auf militärische oder ausschließlich himmlische Wesen verengen.
- issue: Bedeutungsumfang von הֲשִׁיבֵנוּ
  choice: bring uns zurück
  alternative: stelle uns wieder her; kehre uns um
  rationale: Der Text lässt offen, ob Rückkehr, innere Umkehr oder umfassende Wiederherstellung im Vordergrund steht. Die Übersetzung bewahrt diese Spannung und erläutert die weiteren Möglichkeiten in der Fußnote.
- issue: Bedeutungsumfang der Rettung in וְנִוָּשֵׁעָה
  choice: dann werden wir gerettet
  alternative: dann werden wir befreit
  rationale: Das hebräische Verb kann geschichtliche Befreiung und Rettung in weiterem Sinn bezeichnen. „Gerettet“ erhält diese theologische und situative Offenheit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, poetischem Gebetsstil. „Angesicht“ und „Heerscharen“ sind bewusst als etablierte biblisch-poetische Ausdrücke erhalten; die Fußnoten erschließen sie für heutige Leser. Die Satzstruktur bleibt knapp und parallel zum hebräischen Vers.
