base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: de
  text: Jahwe, Gott der Heerscharen, wie lange noch rauchst du vor Zorn über das Gebet deines Volkes?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie lange noch zürnst du über das Gebet deines Volkes?“ Das hebräische Verb bezeichnet wörtlich ein Rauchen und zeichnet den göttlichen Zorn als aufsteigenden Rauch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Gott der Heerscharen
  rationale: Die geläufige, würdevolle Wendung bewahrt die militärische beziehungsweise kosmische Weite von צְבָאוֹת, ohne nur irdische oder nur himmlische Heere festzulegen.
- source_word: עַד מָתַי
  choice: wie lange noch
  rationale: Diese natürliche deutsche Klageformel gibt die Dringlichkeit des hebräischen Ausdrucks wieder.
- source_word: עָשַׁנְתָּ
  choice: rauchst du vor Zorn
  rationale: Die Formulierung bewahrt das konkrete Bild des Rauchens und macht zugleich dessen Bedeutung als Ausdruck göttlichen Zorns verständlich.
- source_word: בִּתְפִלַּת
  choice: gegen das Gebet
  rationale: Die Präposition ב wird im Zusammenhang mit dem zornigen Rauchen adversativ verstanden; der Zorn richtet sich hier gegen beziehungsweise auf das Gebet.
- source_word: עַמֶּךָ
  choice: deines Volkes
  rationale: Die Wendung wahrt den gemeinschaftlichen und bundestheologischen Bezug der Klage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und Titels יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Jahwe, Gott der Heerscharen
  alternative: HERR, Gott der Heerscharen
  rationale: Der persönliche Gottesname bleibt als „Jahwe“ sichtbar; „Gott der Heerscharen“ lässt offen, ob irdische oder himmlische Heere besonders gemeint sind.
- issue: Bildsprache von עָשַׁנְתָּ
  choice: rauchst du vor Zorn
  alternative: bist du zornig über
  rationale: Das ungewöhnliche Rauchbild des hebräischen Textes bleibt erhalten, während „vor Zorn“ seine Funktion verständlich macht. So wird die scharfe Spannung der Klage nicht zu einer bloßen Aussage über Ärger geglättet.
translation_notes:
  register: Poetisch und klagend, zugleich in modernem Standarddeutsch verständlich. Das bewusst starke und leicht fremdartige Rauchbild folgt der Bildsprache des hebräischen Textes.
