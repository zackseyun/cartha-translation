  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: de
  text: Einen Weinstock hast du aus Ägypten herausgeführt[a][b]; du hast Völker vertrieben und ihn gepflanzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das mit »herausgeführt« wiedergegebene hebräische Verb kann auch bedeuten: »aufbrechen lassen«, »wegnehmen« oder im Bild des Weinstocks »verpflanzen«.'
    reason: lexical_alternative
  - marker: b
    text: Der »Weinstock« ist hier ein Bild für Israel.
    reason: cross_reference
lexical_decisions:
- source_word: גֶּפֶן
  choice: einen Weinstock
  rationale: Das Substantiv bezeichnet einen Weinstock. Der unbestimmte Artikel entspricht der hebräischen Form und bewahrt das Bild für Israel, ohne es im Haupttext auszudeuten.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition bezeichnet Herkunft beziehungsweise Ausgangspunkt und lässt im Deutschen zugleich den Anklang an den Exodus erkennen.
- source_word: תַּסִּיעַ
  choice: hast du ... herausgeführt
  rationale: Der Hifil von נסע kann das Aufbrechenlassen, Fortführen oder Herausnehmen und Verpflanzen bezeichnen. »Herausgeführt« ist im Zusammenhang mit Ägypten natürlich, wahrt aber durch die Fußnote die breitere Bildsprache.
- source_word: תְּגָרֵשׁ
  choice: du hast ... vertrieben
  rationale: Der Piel von גרש bezeichnet ein energisches Vertreiben oder Ausstoßen. »Vertrieben« passt zum Zusammenhang der Völker im Land.
- source_word: גּוֹיִם
  choice: Völker
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen des Landes. »Völker« ist idiomatisch und vermeidet die später stärker religiös geprägte Wiedergabe »Heiden«.
- source_word: וַתִּטָּעֶהָ
  choice: und ihn eingepflanzt
  rationale: Das Verb bedeutet pflanzen; das Suffix bezieht sich auf den im Deutschen maskulinen »Weinstock«. »Eingepflanzt« bringt den Ortswechsel innerhalb des fortgeführten Pflanzenbildes prägnant zum Ausdruck.
theological_decisions:
- issue: Metaphorische Identität des Weinstocks
  choice: Das Bild des Weinstocks bleibt im Haupttext stehen; Israel wird nur in einer Fußnote als Bezug genannt.
  alternative: Israel direkt im Haupttext nennen.
  rationale: Der hebräische Text spricht metaphorisch. Eine ausdrückliche Ersetzung durch »Israel« würde die Auslegung an die Stelle des Bildes setzen.
- issue: Mehrdeutigkeit von תַּסִּיעַ
  choice: Im Haupttext steht »herausgeführt«; alternative Bedeutungsnuancen werden in einer Fußnote bewahrt.
  alternative: »aus Ägypten verpflanzt« oder »aus Ägypten aufbrechen lassen«.
  rationale: Das Verb verbindet im Kontext Exodus- und Pflanzenvorstellungen. Keine einzelne deutsche Formulierung bildet sämtliche Nuancen zugleich ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Voranstellung des Objekts betont den Weinstock. Das Perfekt wirkt in heutiger deutscher Bibelsprache natürlich; das Pflanzenbild und die Anrede Gottes bleiben erhalten.
