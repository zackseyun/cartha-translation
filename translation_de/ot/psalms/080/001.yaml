source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: de
  text: 'Hirte Israels, höre doch,

    der du Josef wie eine Herde führst;

    der du über den Cherubim thronst,[a]

    leuchte hervor!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der bei den Cherubim sitzt/thront“. Die Wendung ist eine feste Formel für Gottes königliche Gegenwart. Auch „der du zwischen den Cherubim thronst“ ist als kontextuelle Deutung möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה יִשְׂרָאֵל
  choice: Du Hirte Israels
  rationale: Das Partizip רֹעֵה wird als direkte Anrede und göttlicher Titel verstanden. „Hirte“ bewahrt das zentrale Bild knapp und natürlich.
- source_word: הַאֲזִינָה
  choice: höre doch
  rationale: Der Imperativ fordert zu aufmerksamem Hören auf. „Höre doch“ ist im modernen Deutsch eindringlich und würdevoll, ohne die unnatürliche Wendung „leihe dein Ohr“.
- source_word: נֹהֵג כַּצֹּאן
  choice: der du … wie eine Herde führst
  rationale: נֹהֵג bezeichnet im Hirtenbild das aktive Führen; צֹאן ist eine Kollektivbezeichnung für Kleinvieh. „Wie eine Herde“ erhält den kollektiven Vergleich.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Der Eigenname wird beibehalten, da der hebräische Text selbst „Josef“ sagt, auch wenn damit hier wahrscheinlich ein größerer Teil Israels bezeichnet wird.
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: der du über den Kerubim thronst
  rationale: יֹשֵׁב hat in dieser königlichen Heiligtumsbildsprache mehr Gewicht als bloßes „Sitzen“. „Thronst“ gibt die Königsherrschaft wieder; „über“ lässt die genaue räumliche Vorstellung hinreichend offen.
- source_word: הוֹפִיעָה
  choice: erscheine in strahlendem Glanz
  rationale: Der Hifil-Imperativ bezeichnet in theophanischen Zusammenhängen ein strahlendes Hervortreten. Die Formulierung verbindet sichtbares Erscheinen und Lichtglanz, ohne eines von beidem auszublenden.
theological_decisions:
- issue: Gottes Thronen bei den Kerubim
  choice: der du über den Kerubim thronst
  alternative: der du zwischen den Kerubim thronst; der du auf den Kerubim sitzt
  rationale: Die Wendung ruft die königliche Gegenwart Gottes im Zusammenhang mit Lade und Heiligtum auf. „Thronst“ wahrt diese theologische Bildsprache, während „über“ die im Hebräischen nicht ausdrücklich bezeichnete räumliche Beziehung weniger eng festlegt als „zwischen“.
- issue: Bezug des Namens Josef
  choice: Der Eigenname „Josef“ bleibt im Haupttext stehen
  alternative: Israel; die Stämme Josefs; das Nordreich
  rationale: Der Name kann metonymisch besonders die nördlichen Stämme oder das Volk Israel bezeichnen. Eine Ersetzung würde die im Text vorhandene geschichtliche und poetische Spannung vorschnell auflösen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die zwei parallelen Bitten werden entsprechend der masoretischen Gliederung auf zwei Zeilen verteilt. „Doch“ verstärkt die flehentliche Anrede idiomatisch, ohne zusätzlichen theologischen Inhalt einzuführen.
