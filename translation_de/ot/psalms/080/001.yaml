  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird getroffen: Gott wird als Hirte Israels angeredet, der Josef wie eine Herde führt, und als der bei den Cherubim Thronende zum Hervorleuchten aufgefordert. Die Satzstellung des Entwurfs ordnet jedoch die erste Bitte unnötig dem Relativsatz unter und bildet die zwei durch den Atnach nach „Josef“ gegliederten Bitten weniger deutlich ab. „in strahlendem Glanz“ legt den Lichtaspekt stärker aus, als der knappe Imperativ erfordert.'
  naturalness: Die Sprache ist grundsätzlich würdig und verständlich. „Hirte Israels“ ist als direkte Anrede natürlicher und näher am Hebräischen als „Du Hirte Israels“. Die parallele Gliederung mit Semikolon macht den poetischen Rhythmus im modernen Standarddeutsch klarer. „Cherubim“ ist die geläufigere heutige deutsche Schreibung.
  terminology: „Josef“ und „Hirte“ sind zutreffend. „Thronst“ gibt die königliche Konnotation angemessen wieder, sollte aber die im Hebräischen nicht ausdrücklich bestimmte räumliche Relation nicht überpräzise festlegen; „über den Cherubim“ kann mit einer sorgfältig formulierten Fußnote stehen bleiben. Die Fußnote sollte nicht „bei“ als wörtliche Option bezeichnen.
  issues:
  - severity: medium
    issue: Die beiden Bitten sind im ersten Satz syntaktisch nicht klar parallel gegliedert.
    rationale: Der masoretische Atnach nach יוֹסֵף trennt die Anrufung mit „höre“ von der zweiten Anrufung mit „leuchte hervor/erscheine“. Eine entsprechende deutsche Zeichensetzung wahrt Struktur und Lesbarkeit.
  - severity: low
    issue: „Du Hirte Israels“ fügt ein deutsches Anredepronomen hinzu.
    rationale: Das Hebräische beginnt unmittelbar mit dem Vokativ „Hirte Israels“. Ohne „Du“ ist die Anrede knapper und idiomatischer.
  - severity: low
    issue: Die Fußnote zu den Cherubim nennt „bei“ als angeblich wörtliche Wiedergabe.
    rationale: Die hebräische Konstruktion enthält keine Präposition mit der Bedeutung „bei“. Die genaue räumliche Vorstellung ist idiomatisch und kontextuell umstritten, nicht wörtlich „bei“.
  revised_text: 'Hirte Israels, höre doch,

