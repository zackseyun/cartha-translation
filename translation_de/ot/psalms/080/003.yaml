source:
  edition: WLC
  text: אֱלֹהִ֥ים הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: de
  text: Gott, bring uns zurück[a] und lass dein Angesicht leuchten[b], damit wir gerettet werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stell uns wieder her“ oder „lass uns umkehren“. Das hebräische Verb bedeutet in dieser Form, jemanden zurückzubringen beziehungsweise zur Rückkehr zu veranlassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „lass dein Angesicht leuchten“. Das Bild bezeichnet Gottes Zuwendung, Gunst und Gegenwart; vergleiche den priesterlichen Segen in 4. Mose 6,25.'
    reason: cross_reference
  - marker: c
    text: 'Oder: „dann werden wir gerettet“. Die hebräische Form kann sowohl als Bitte um dieses Ergebnis als auch als zuversichtliche Aussage über das Ergebnis verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Form bezeichnet hier Israels Gott und steht in direkter Anrede. „Gott“ gibt dies im modernen Deutschen natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „O“ hinzuzufügen.
- source_word: הֲשִׁיבֵנוּ
  choice: bring uns zurück
  rationale: Der Hifil-Imperativ von שוב bedeutet ursächlich „lass uns zurückkehren/bring uns zurück“. Die Wiedergabe bewahrt sowohl die mögliche räumliche als auch die geistliche und relationale Bedeutung und klingt im Deutschen natürlich.
- source_word: וְהָאֵר
  choice: und lass … leuchten
  rationale: Der Hifil-Imperativ von אור hat ursächlichen Sinn. „Lass dein Angesicht leuchten“ ist eine natürliche deutsche Wiedergabe, die das Bild und den Anklang an den priesterlichen Segen bewahrt.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: „Angesicht“ erhält das konkrete hebräische Bild von Gottes zugewandter Gegenwart und Gunst. Das würdige Wort ist in diesem Segensbild auch heute verständlich und weniger verflachend als die rein deutende Wiedergabe „Gegenwart“.
- source_word: וְנִוָּשֵׁעָה
  choice: damit wir gerettet werden
  rationale: Die Nifal-Form der ersten Person Plural hat hier volitiven beziehungsweise resultativen Charakter. „Damit wir gerettet werden“ stellt die Rettung als erbetene Folge von Gottes Rückführung und Zuwendung dar.
theological_decisions:
- issue: Volitive oder feststellende Nuance des Schlussverbs
  choice: damit wir gerettet werden
  alternative: und wir werden gerettet werden / dann werden wir gerettet
  rationale: Nach den Imperativen liegt es nahe, die Form als erbetenes Ziel oder Ergebnis zu verstehen. Da sie zugleich als zuversichtliche Ergebnisaussage gehört werden kann, wird diese Möglichkeit in einer Fußnote offengehalten.
- issue: Bedeutungsweite der erbetenen Rückführung
  choice: bring uns zurück
  alternative: stell uns wieder her / lass uns umkehren
  rationale: Der hebräische Kausativ kann Wiederherstellung, Heimführung oder Umkehr bezeichnen. Die Übersetzung legt nicht fest, ob vor allem äußere Wiederherstellung oder innere Umkehr gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ wird wegen des feststehenden biblischen Segensbildes beibehalten; die übrige Syntax ist bewusst schlicht und unmittelbar.
