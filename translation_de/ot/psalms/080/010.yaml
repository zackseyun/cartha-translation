  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: de
  text: Die Berge waren von ihrem Schatten bedeckt, die Zedern Gottes[a] von ihren Zweigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die mächtigen Zedern«. Die hebräische Wendung »Zedern Gottes« kann außergewöhnliche Größe oder Majestät ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּסּוּ
  choice: waren … bedeckt
  rationale: Das Qal Perfekt 3. Person Plural von כסה bezeichnet hier das Bedecken. Die deutsche Passivkonstruktion gibt die poetische Aussage natürlich wieder; im zweiten Halbvers wird das Verb entsprechend der hebräischen Ellipse mitverstanden.
- source_word: הָרִים
  choice: die Berge
  rationale: Die bestimmte Pluralform wird unmittelbar und idiomatisch wiedergegeben.
- source_word: צִלָּהּ
  choice: von seinem Schatten
  rationale: צֵל kann »Schatten« oder »Schutz/Schatten spendende Bedeckung« bezeichnen. »Schatten« bewahrt das konkrete Bild der weit ausgreifenden Rebe.
- source_word: וַעֲנָפֶיהָ
  choice: und … von seinen Zweigen
  rationale: עָנָף bezeichnet Zweige oder Äste. »Zweige« ist gegenwärtig und verständlich; das Possessivpronomen bezieht sich im Deutschen auf den Weinstock beziehungsweise die Rebe des Zusammenhangs.
- source_word: אַרְזֵי אֵל
  choice: die Zedern Gottes
  rationale: Die Constructusverbindung wird transparent bewahrt. אֵל kann hier wörtlich auf Gott verweisen oder idiomatisch die außergewöhnliche Größe und Majestät der Zedern ausdrücken.
theological_decisions:
- issue: Deutung von אֵל in אַרְזֵי אֵל
  choice: Im Haupttext steht die formnahe Wendung »Zedern Gottes«.
  alternative: »mächtige Zedern« oder »gewaltige Zedern«
  rationale: Die wörtliche Wiedergabe bewahrt sowohl den möglichen Gottesbezug als auch die mögliche superlativische Bedeutung, ohne die poetisch-theologische Spannung einseitig aufzulösen.
- issue: Syntaktische Beziehung im zweiten Halbvers
  choice: 'Das im ersten Halbvers genannte Bedecken wird elliptisch ergänzt: Die Zedern Gottes waren von den Zweigen bedeckt.'
  alternative: »seine Zweige waren wie Zedern Gottes«
  rationale: 'Im masoretischen Text fehlt eine Vergleichspartikel wie כ־. Der Parallelismus legt nahe, das Verb »bedecken« im zweiten Halbvers mitzudenken: Berge – Schatten; Zedern – Zweige.'
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten; die Verbellipse wird im Deutschen durch die gemeinsame Konstruktion mit »waren … bedeckt« natürlich abgebildet.
