  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: de
  text: Möge ihr Lager veröden[a]; in ihren Zelten wohne niemand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Wohnstätte“.'
