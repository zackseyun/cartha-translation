lexical_decisions:
- source_word: תְּהִי
  choice: soll … werden
  rationale: Die volitive Form von היה drückt hier einen Verwünschungswunsch aus. Die deutsche Konstruktion mit „soll“ bewahrt diese Kraft und passt natürlich zu „verwüstet werden“.
- source_word: טִירָתָם
  choice: ihr Lager
  rationale: טִירָה bezeichnet hier ein Lager beziehungsweise eine umschlossene Wohnstätte. „Lager“ erhält den konkreten kollektiven Sinn und bildet einen natürlichen Parallelismus zu „Zelten“.
- source_word: נְשַׁמָּה
  choice: verwüstet
  rationale: Das Wort bezeichnet einen Zustand der Verwüstung oder Verödung. „Verwüstet werden“ gibt den resultativen Sinn im modernen Deutsch prägnant wieder.
- source_word: בְּאָהֳלֵיהֶם
  choice: in ihren Zelten
  rationale: אֹהֶל bedeutet wörtlich „Zelt“. Das konkrete Bild wird beibehalten, obwohl das Wort erweitert auch Wohnstätten bezeichnen kann.
- source_word: אַל יְהִי
  choice: soll niemand
  rationale: Die negative Jussivkonstruktion formuliert einen Verwünschungswunsch. Im Deutschen gibt „soll niemand“ diesen volitiven Sinn idiomatisch wieder.
- source_word: יֹשֵׁב
  choice: wohnen
  rationale: Das Partizip von ישב bezeichnet hier jemanden, der sich niederlässt oder wohnt. Die unpersönliche Wiedergabe „niemand wohnen“ ist natürlich und erhält den verbalen Sinn.
theological_decisions:
- issue: Verwünschende Jussive in einem Klagepsalm
  choice: 'Als Wunsch beziehungsweise Bitte wiedergegeben: „soll … werden; soll niemand …“'
  alternative: 'Als bloße Zukunftsaussage: „wird verwüstet werden; wird niemand wohnen“'
  rationale: Die hebräischen Formen sind volitiv und äußern eine vor Gott vorgebrachte Verwünschung, nicht lediglich eine Vorhersage. Die Soll-Konstruktion bewahrt diese rhetorische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache von Lager und Zelten bleibt erhalten; die knappe Parallelstruktur des hebräischen Verses wird nachgebildet.
