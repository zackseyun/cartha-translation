  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי קִנְאַ֣ת בֵּיתְ/ךָ֣ אֲכָלָ֑תְ/נִי וְ/חֶרְפּ֥וֹת ח֝וֹרְפֶ֗י/ךָ נָפְל֥וּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: de
  text: Denn der Eifer für dein Haus hat mich verzehrt,[a] und die Schmähungen derer, die dich schmähen, sind auf mich gefallen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hat mich aufgezehrt« oder »hat mich gegessen«.'
    reason: lexical_alternative
  - marker: b
    text: Der erste Satz dieses Verses wird in Johannes 2,17 auf Jesus bezogen; der zweite Satz wird in Römer 15,3 angeführt.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die Lage des Psalmisten ein und bewahrt den erklärenden Sinn.
- source_word: קִנְאַת
  choice: Eifer
  rationale: Bezeichnet hier leidenschaftliche Hingabe, nicht missgünstige Eifersucht.
- source_word: בֵּיתְךָ
  choice: dein Haus
  rationale: Bewahrt die konkrete hebräische Bezeichnung, ohne sie ausdrücklich auf »Tempel« einzuengen.
- source_word: אֲכָלָתְנִי
  choice: hat mich verzehrt
  rationale: Gibt das wörtliche Bild des Essens in natürlichem Deutsch intensiv und idiomatisch wieder.
- source_word: וְחֶרְפּוֹת
  choice: und die Schmähungen
  rationale: Gibt verbale Verachtung wieder und ermöglicht die Beibehaltung der Wortstammverbindung zum folgenden Partizip.
- source_word: חֹרְפֶיךָ
  choice: derer, die dich schmähen
  rationale: Bezeichnet Personen, die Gott schmähen, und bewahrt die Verbindung mit »Schmähungen«.
- source_word: נָפְלוּ עָלַי
  choice: sind auf mich gefallen
  rationale: Folgt dem hebräischen Bild und macht deutlich, dass die gegen Gott gerichteten Schmähungen den Psalmisten treffen.
theological_decisions:
- issue: Messianische beziehungsweise kanonische Resonanz des Verses
  choice: Der Haupttext wird im unmittelbaren Sinn des Psalms übersetzt; der neutestamentliche Bezug erscheint in einer Fußnote.
  alternative: Eine ausdrücklich christologische Formulierung im Haupttext.
  rationale: Der hebräische Text spricht in der Stimme des Psalmisten. Die spätere Anwendung auf Jesus ist kanonisch bedeutsam, soll aber nicht in den Wortlaut des Psalms hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Bildsprache. Die Wiederholung desselben Wortstamms in »Schmähungen … schmähen« bildet die hebräische Wortverbindung bewusst nach.
