base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/010.yaml
  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: de
  text: Als ich weinte und fastete[a], wurde mir das zum Hohn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht nach „beim Fasten“ noch „meine Seele“. Die knappe Formulierung kann das eigene Selbst nachdrücklich bezeichnen; sie kann auch den Sinn nahelegen: „Als ich mich durch Fasten demütigte.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wurde es mir zu Schmähungen“; gemeint sein kann, dass sein Weinen und Fasten ihm Beschimpfungen einbrachte.'
    reason: formal_plural_and_idiom
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: Als ich … weinte
  rationale: 'בכה bedeutet „weinen“. Das einleitende ו wird hier im Zusammenhang mit dem folgenden Ergebnissatz temporal wiedergegeben: „Als ich … weinte“.'
- source_word: בַצּוֹם
  choice: unter Fasten
  rationale: צוֹם bezeichnet das Fasten; ב kennzeichnet hier den begleitenden Umstand. „Unter Fasten“ ist im Deutschen verständlich und hält den engen Bezug zum Weinen fest.
- source_word: נַפְשִׁי
  choice: in meiner Seele
  rationale: נֶפֶשׁ kann „Seele“, „Selbst“, „Leben“ oder kontextabhängig auch „Kehle/Appetit“ bezeichnen. Die Wiedergabe bewahrt das ausdrücklich vorhandene Wort und versteht es adverbial als den inneren Bereich des Weinens, ohne den nicht ausdrücklich genannten Begriff „demütigen“ in den Haupttext einzuführen.
- source_word: וַתְּהִי
  choice: wurde … das
  rationale: היה bezeichnet hier das Eintreten eines Ergebnisses. Das deutsche Demonstrativpronomen greift den zuvor beschriebenen Vorgang des Weinens und Fastens auf.
- source_word: לַחֲרָפוֹת
  choice: zum Hohn
  rationale: חֲרָפוֹת ist formal ein Plural und bezeichnet Schmähungen oder Beschimpfungen. Die feste deutsche Wendung „zum Hohn werden“ gibt den kollektiven bzw. abstrakten Sinn natürlich wieder.
- source_word: לִי
  choice: mir
  rationale: ל bezeichnet die betroffene Person; der deutsche Dativ in „mir zum Hohn“ entspricht dieser Funktion idiomatisch.
theological_decisions:
- issue: Bezug und Funktion von נַפְשִׁי
  choice: „in meiner Seele“ als adverbiale Bestimmung zu „weinte“
  alternative: „meine Seele fastete“ oder „ich demütigte mich durch Fasten“
  rationale: Die knappe hebräische Wortfolge lässt den syntaktischen Bezug von נַפְשִׁי nicht völlig eindeutig erkennen. Der Haupttext bewahrt „meine Seele“ ausdrücklich und vermeidet zugleich, aus einem möglichen Sinn eine eindeutige theologische Deutung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unter Fasten“ und „in meiner Seele“ erhalten den poetischen Charakter und sämtliche wesentlichen hebräischen Bestandteile; die ungewöhnliche, mehrdeutige Konstruktion wird nicht stillschweigend geglättet.
