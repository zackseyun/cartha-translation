  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: de
  text: Denn Jahwe hört den Bedürftigen zu, und seine Gefangenen[a] verachtet er nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Gefesselten“. Das hebräische Wort kann allgemein Menschen bezeichnen, die gefangen gehalten oder in ihrer Freiheit beschränkt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zum Lob ein und bewahrt die kausale Verknüpfung.
- source_word: שֹׁמֵעַ אֶל
  choice: hört auf
  rationale: Gibt die im Gebetskontext mitschwingende Bedeutung des aufmerksamen und zugewandten Hörens natürlich wieder.
- source_word: אֶבְיוֹנִים
  choice: die Bedürftigen
  rationale: Bezeichnet Menschen in Armut und Not; „Bedürftige“ ist verständlich und verengt den Ausdruck nicht ausschließlich auf wirtschaftliche Armut.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: אֲסִירָיו
  choice: seine Gefangenen
  rationale: Bewahrt sowohl die Grundbedeutung „Gefangene“ als auch das hebräische Possessivsuffix „seine“, ohne die Art der Gefangenschaft näher festzulegen.
- source_word: לֹא בָזָה
  choice: verachtet er nicht
  rationale: Das Perfekt kann hier eine allgemeine Aussage ausdrücken. Die deutsche Präsensform entspricht dem parallelen „hört“ und gibt בזה als geringschätziges Verachten wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen. Die Wiedergabe als „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Possessivsuffix in אֲסִירָיו
  choice: seine Gefangenen
  alternative: die Gefangenen
  rationale: Das Suffix wird ausdrücklich bewahrt. Dadurch bleibt die Beziehung der Gefangenen zu Jahwe erkennbar, ohne zu bestimmen, ob der Ausdruck Zugehörigkeit, Fürsorge oder eine andere Beziehung hervorhebt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetisch natürlicher Satzstellung. Die Voranstellung von „seine Gefangenen“ im zweiten Halbvers wahrt den hebräischen Nachdruck und ergibt einen ausgewogenen Parallelismus.
