base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/021.yaml
  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: de
  text: Sie gaben mir Gift als Speise[a], und für meinen Durst gaben sie mir Essig zu trinken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Galle“ beziehungsweise „etwas Bitteres“. Das hebräische Wort bezeichnet hier einen giftigen oder bitteren Stoff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sauren Wein“. Das hebräische Wort kann Essig oder sauer gewordenen Wein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Sie gaben
  rationale: Das Wayyiqtol von נתן bezeichnet hier eine vergangene Handlung; „gaben“ ist die direkte und natürliche Wiedergabe.
- source_word: בְּבָרוּתִי
  choice: als Speise
  rationale: בָּרוּת bezeichnet Nahrung oder Speise. In Verbindung mit נתן gibt „als Speise“ die Funktion der vermeintlichen Nahrung idiomatisch wieder, ohne das Präfix ב räumlich auf „in meine Speise“ festzulegen.
- source_word: רֹאשׁ
  choice: Gift
  rationale: רֹאשׁ bezeichnet hier nicht „Kopf“, sondern einen giftigen oder bitteren Stoff. „Gift“ bewahrt den starken Sinn und vermeidet die sachlich engere Vorstellung von Galle.
- source_word: וְלִצְמָאִי
  choice: und gegen meinen Durst
  rationale: לִצְמָאִי bezeichnet das, was dem Durst gegeben wird. „Gegen meinen Durst“ ist im Deutschen natürlich und erhält die parallele Beziehung zu „als Speise“.
- source_word: יַשְׁקוּנִי
  choice: ließen sie mich … trinken
  rationale: Der Hifil von שׁקה bedeutet „trinken lassen“ oder „zu trinken geben“. Die gewählte Form ist knapp, idiomatisch und bewahrt die kausative Nuance.
- source_word: חֹמֶץ
  choice: Essig
  rationale: חֹמֶץ kann Essig beziehungsweise sauer gewordenen Wein bezeichnen. „Essig“ ist die herkömmliche, prägnante Wiedergabe; die Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Anklang an die Passionsberichte der Evangelien
  choice: 'Die Begriffe werden nach ihrem Sinn im hebräischen Psalm übersetzt: „Gift“ und „Essig“.'
  alternative: „Galle“ und „saurer Wein“ verwenden, um den traditionellen beziehungsweise neutestamentlichen Wortlaut stärker anzunähern.
  rationale: Die Übersetzung folgt vorrangig dem hebräischen Text und gleicht ihn nicht stillschweigend an spätere intertextuelle Formulierungen an. Bedeutende traditionelle Alternativen bleiben durch Fußnoten sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelität. „Speise“ ist bewusst etwas gehobener als „Essen“ und passt zum Psalmenregister; „ließen sie mich … trinken“ bildet den hebräischen Kausativ natürlich ab.
