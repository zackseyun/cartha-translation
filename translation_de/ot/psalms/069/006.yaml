source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: de
  text: Lass die, die auf dich hoffen, nicht meinetwegen beschämt werden[a], Herr, Jahwe der Heerscharen[b]; lass die, die dich suchen, nicht meinetwegen gedemütigt werden, Gott Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf dich warten“. Das hebräische Partizip kann ein Warten in erwartungsvoller Hoffnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Adonai Jahwe Zebaot“; traditionell auch wiedergegeben als „Herr HERR der Heerscharen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: beschämt werden
  rationale: Das Qal von בוש bezeichnet hier das Erleiden von Scham oder Schande. Die deutsche Wendung gibt den resultativen Sinn der Bitte natürlich wieder.
- source_word: בִי
  choice: meinetwegen
  rationale: Die Präposition ב mit dem Personalpronomen bezeichnet im Zusammenhang den Psalmisten als Anlass möglicher Beschämung; „meinetwegen“ bringt diesen kausalen Sinn idiomatisch zum Ausdruck.
- source_word: קֹוֶיךָ
  choice: die, die auf dich hoffen
  rationale: Das Partizip von קוה umfasst erwartungsvolles Warten und Hoffen. „Auf dich hoffen“ wahrt die vertrauensvolle Erwartung; die Alternative wird in einer Fußnote genannt.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: Herr, Jahwe der Heerscharen
  rationale: אֲדֹנָי wird als Anrede „Herr“ und der Gottesname יְהוָה als „Jahwe“ wiedergegeben. „Der Heerscharen“ bewahrt das Bild des hebräischen Titels צְבָאוֹת.
- source_word: יִכָּלְמוּ
  choice: in Schande geraten
  rationale: כלם überschneidet sich mit בוש, hebt aber Schmach und Demütigung hervor. Die abweichende Formulierung erhält die lexikalische Abstufung im Parallelismus.
- source_word: מְבַקְשֶׁיךָ
  choice: die, die dich suchen
  rationale: Das Partizip von בקש bezeichnet fortdauerndes, aktives Suchen; diese Wendung ist im modernen Deutsch klar und natürlich.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Die Status-constructus-Verbindung benennt Israels Gott und fungiert hier als direkte Anrede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in אֲדֹנָי יְהוָה
  choice: Herr, Jahwe
  alternative: Herr HERR
  rationale: Die Übersetzung macht sowohl den Titel אֲדֹנָי als auch den Eigennamen יְהוָה sichtbar, ohne beide zu „Herr“ einzuebnen. Das Komma kennzeichnet die Apposition und vermeidet die im Deutschen missverständliche Folge „Herr Jahwe“.
- issue: Bedeutung von צְבָאוֹת im Gottestitel
  choice: der Heerscharen
  alternative: allmächtiger Herr
  rationale: Die bildhafte und potenziell mehrdeutige Bezeichnung der „Heerscharen“ wird bewahrt und nicht durch eine theologische Deutung als „allmächtig“ ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wendung „die, die …“ bildet die parallelen Partizipialgruppen des Hebräischen verständlich ab. „Meinetwegen“ wird zur Wahrung des Parallelismus wiederholt; die beiden Schamverben werden bewusst unterschiedlich formuliert.
