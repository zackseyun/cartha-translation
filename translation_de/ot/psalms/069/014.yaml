source:
  edition: WLC
  text: הַצִּילֵ֣/נִי מִ֭/טִּיט וְ/אַל אֶטְבָּ֑עָה אִנָּצְלָ֥ה מִ֝/שֹּֽׂנְאַ֗/י וּ/מִ/מַּֽעֲמַקֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: de
  text: Rette mich aus dem Schlamm; lass mich nicht versinken. Lass mich denen entkommen, die mich hassen, und den Tiefen des Wassers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von נצל mit Suffix der 1. Person Singular ist eine dringliche Bitte um aktive Rettung; „Rette mich“ ist unmittelbar, natürlich und bildkräftig.
- source_word: מִטִּיט
  choice: aus dem Schlamm
  rationale: טיט bezeichnet Schlamm, Morast oder Lehm. „Schlamm“ ist im modernen Deutsch verständlich und passt zum folgenden Versinken.
- source_word: וְאַל אֶטְבָּעָה
  choice: lass mich nicht versinken
  rationale: Die Verneinung mit der Imperfektform hat hier den Sinn einer flehentlichen Bitte. Die deutsche Formulierung gibt diese volitive Kraft idiomatisch wieder.
- source_word: אִנָּצְלָה
  choice: Lass mich gerettet werden
  rationale: Die Nifal-Kohortativform von נצל erneuert die Bitte um Rettung und wahrt zugleich den Wechsel vom aktiven zum passiven Ausdruck.
- source_word: מִשֹּׂנְאַי
  choice: vor denen, die mich hassen
  rationale: Dies entspricht transparent dem substantivierten Partizip „meine Hassenden“; „Feinde“ wäre eine mögliche, aber stärker deutende Wiedergabe.
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: und aus den Tiefen des Wassers
  rationale: Die Formulierung bildet die hebräische Genitivverbindung möglichst genau ab und bewahrt das poetische Bild bedrohlicher Wassertiefen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität der wiederholten Rettungsbitte und der Bildfolge Schlamm–Versinken–Wassertiefen bleibt erhalten; die ungewöhnlichere passive zweite Bitte wird nicht geglättet.
