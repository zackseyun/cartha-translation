source:
  edition: WLC
  text: וְ/תִיטַ֣ב לַֽ֭/יהוָה מִ/שּׁ֥וֹר פָּ֗ר מַקְרִ֥ן מַפְרִֽיס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: de
  text: Das wird Yahweh besser gefallen als ein Rind – einen Stier mit Hörnern und gespaltenen Hufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתִיטַב
  choice: Das wird … besser gefallen
  rationale: Das feminine Verb bezieht sich auf den Lobpreis beziehungsweise Dank im vorhergehenden Vers. In Verbindung mit מִן drückt יטב hier aus, dass dieser Yahweh mehr zusagt als ein Opfertier.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als „Yahweh“ wiedergegeben und dadurch als Eigenname erkennbar gehalten.
- source_word: מִשּׁוֹר
  choice: als ein Rind
  rationale: מִן kennzeichnet nach יטב den Vergleich. שׁוֹר bezeichnet ein Rind beziehungsweise Stück Rindvieh; „Rind“ erlaubt, das anschließende präzisierende פָּר als „Stier“ beizubehalten.
- source_word: פָּר
  choice: als ein Stier
  rationale: פָּר bezeichnet ein männliches Rind, hier in Apposition beziehungsweise Präzisierung zu שׁוֹר. Die Wiederholung von „als“ macht den etwas gedrängten hebräischen Ausdruck im Deutschen verständlich, ohne die beiden Tierbezeichnungen zusammenzuziehen.
- source_word: מַקְרִן
  choice: mit Hörnern
  rationale: Die Form beschreibt das Tier als gehörnt. „Mit Hörnern“ ist natürliches modernes Deutsch.
- source_word: מַפְרִיס
  choice: mit … gespaltenen Hufen
  rationale: Die Form bezeichnet das Spalten beziehungsweise Teilen des Hufs. „Gespaltene Hufe“ gibt das Merkmal eines kultisch geeigneten Rindes klar wieder.
theological_decisions:
- issue: Vergleich von Lobpreis und Tieropfer
  choice: Der vorausgehende Lobpreis wird als Yahweh wohlgefälliger als ein voll entwickeltes, opfergeeignetes Rind dargestellt.
  alternative: „Es wird besser sein vor Yahweh als ein Rind …“
  rationale: Der Vergleich wird bewahrt, ohne daraus eine allgemeine Abschaffung oder Abwertung aller Opfer abzuleiten. Der unmittelbare Zusammenhang stellt Dank und Lob einem wertvollen Tieropfer gegenüber.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Die Umschrift wahrt den Charakter des Tetragramms als Gottes Eigenname.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das“ nimmt den in Vers 31 genannten Lobpreis auf. Die appositionelle Häufung שׁוֹר פָּר bleibt durch „ein Rind, als ein Stier“ sichtbar; Hörner und gespaltene Hufe kennzeichnen das ausgewachsene, opfergeeignete Tier.
