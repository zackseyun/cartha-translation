  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: de
  text: Ich aber bin elend und leide Schmerzen. Gott, deine Rettung bringe mich an einen sicheren, hohen Ort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott, deine Rettung wird mich an einen sicheren, hohen Ort bringen.“ Die hebräische Verbform kann sowohl als Bitte als auch als Zukunftsaussage verstanden werden. Die Wendung bezeichnet, jemanden an einen hohen, geschützten Ort zu bringen, also auch zu schützen oder in Sicherheit zu bringen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Konjunktion mit dem ausdrücklich gesetzten Pronomen hebt den Gegensatz zum Vorangehenden hervor; „Ich aber“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: עָנִי
  choice: elend
  rationale: Im Zusammenhang bezeichnet das Adjektiv nicht notwendig materielle Armut, sondern einen bedrängten, leidenden Zustand. „Elend“ passt zur Verbindung mit körperlichem oder seelischem Schmerz.
- source_word: וְכוֹאֵב
  choice: und leide Schmerzen
  rationale: Das Partizip beschreibt einen andauernden Zustand des Schmerzes. Die verbale Formulierung ist in modernem Deutsch natürlicher als „schmerzerfüllt“.
- source_word: יְשׁוּעָתְךָ
  choice: deine Rettung
  rationale: „Rettung“ gibt die konkrete Bedeutung von ישועה in diesem Hilferuf natürlich wieder, ohne den umfassenderen Gedanken göttlichen Heils auszuschließen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort wird als direkte Anrede verstanden. Im modernen deutschen Gebetsstil ist „Gott“ ohne ein zusätzliches „o“ würdig und natürlich.
- source_word: תְּשַׂגְּבֵנִי
  choice: bringe mich auf sichere Höhe
  rationale: Das Piel von שׂגב bezeichnet das Versetzen an einen hohen, unzugänglichen und damit geschützten Ort. Die Wiedergabe bewahrt sowohl das Höhenbild als auch den Schutzgedanken.
theological_decisions:
- issue: Aussageweise des Imperfekts תְּשַׂגְּבֵנִי
  choice: 'Gebetsbitte: „bringe mich“'
  alternative: 'Zukunftsaussage: „wird mich auf sichere Höhe bringen“'
  rationale: Im Klage- und Bittzusammenhang liegt eine volitive, gebetsartige Lesart nahe. Da dieselbe Form jedoch auch als einfache Zukunft verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Kontrast am Versanfang bleibt knapp erhalten; das hebräische Bild eines hohen, geschützten Ortes wird nicht zu einem bloßen „beschützen“ verflacht.
