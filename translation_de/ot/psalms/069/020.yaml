base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: de
  text: Schmach hat mir das Herz gebrochen, und ich bin krank. Ich hoffte auf Mitgefühl[a], doch da war keines, und auf Tröster, doch ich fand keinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mitleid“. Das hebräische Wort bezeichnet mitfühlende Anteilnahme am Leid eines anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְפָּה
  choice: Schmach
  rationale: Das Substantiv bezeichnet sowohl den von anderen zugefügten Hohn als auch die daraus entstehende öffentliche Entehrung. „Schmach“ bewahrt beide Aspekte und entspricht dem würdevollen Klagepsalmregister.
- source_word: שָׁבְרָה לִבִּי
  choice: hat mir das Herz gebrochen
  rationale: Die idiomatische deutsche Wendung gibt das Bild des Hebräischen unmittelbar wieder und bezeichnet eine bis in die Gegenwart wirkende Verletzung des inneren Menschen.
- source_word: וָאֲנוּשָׁה
  choice: und ich bin schwer krank
  rationale: Die Form beschreibt einen schwer leidenden oder kranken Zustand. „Schwer krank“ bringt die Intensität zum Ausdruck, ohne die lexikalisch mögliche, hier aber nicht zwingende Bedeutung „unheilbar“ festzuschreiben.
- source_word: וָאֲקַוֶּה
  choice: ich hoffte auf
  rationale: Das Verb bezeichnet hoffendes oder erwartendes Warten. „Ich hoffte auf“ ist im Deutschen natürlich und wahrt stärker als „ich suchte“ die Erwartungskomponente.
- source_word: לָנוּד
  choice: Mitgefühl
  rationale: Der Infinitiv bezeichnet hier mitfühlende Anteilnahme am Leid eines anderen. „Mitgefühl“ vermeidet den möglicherweise herablassenden Beiklang von „Mitleid“ und überschneidet sich nicht mit den folgenden Tröstern.
- source_word: וָאַיִן
  choice: doch da war keines
  rationale: Die Wendung stellt knapp fest, dass die erhoffte Anteilnahme völlig fehlte. „Doch“ macht den im Zusammenhang liegenden Gegensatz natürlich sichtbar.
- source_word: וְלַמְנַחֲמִים
  choice: und auf Tröster
  rationale: Das substantivierte Partizip bezeichnet mehrere Personen, die Trost spenden sollten. „Tröster“ ist knapp, persönlich und wahrt den Parallelismus.
- source_word: וְלֹא מָצָאתִי
  choice: doch ich fand keine
  rationale: Die Formulierung gibt das erfolglose Finden schlicht wieder; das feminine Pronomen bezieht sich im Deutschen grammatisch korrekt auf die pluralischen „Tröster“ als Personenbezeichnung.
theological_decisions:
- issue: Messianische Auslegung in christlicher Tradition
  choice: Der Vers wird im Haupttext zunächst als persönliche Klage des Psalmbeters wiedergegeben.
  alternative: Den Wortlaut ausdrücklich als unmittelbare Vorhersage des Leidens des Messias formulieren.
  rationale: Psalm 69 wird im Neuen Testament auf Jesus bezogen. Der vorliegende Vers ist jedoch gemäß seinem hebräischen Wortlaut zu übersetzen, ohne diese spätere Anwendung in den Haupttext einzutragen; die Formulierung bleibt mit ihr vereinbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Parallelstruktur eines Klagepsalms. Das traditionelle, aber weiterhin verständliche „Schmach“ erhält die Verbindung von Hohn und Entehrung. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die lexikalische Alternative bezieht.
