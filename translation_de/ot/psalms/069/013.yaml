base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: de
  text: Ich aber richte mein Gebet an dich, Jahwe, zu einer Zeit der Gunst[a]. Gott, antworte mir in der Größe deiner Güte, in der Wahrheit[b] deiner Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zu einer Zeit des Wohlwollens“ oder „zu einer annehmbaren Zeit“. Gemeint ist eine Zeit, in der Gott wohlwollend hört und handelt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „in der Treue“ oder „in der Verlässlichkeit deiner Rettung“. Das hebräische Wort kann „Wahrheit“, „Treue“ oder „Verlässlichkeit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die selbstständige Pronomenform zusammen mit der Konjunktion hebt den Sprecher hervor und stellt ihn in einen Gegensatz zum vorherigen Zusammenhang.
- source_word: תְפִלָּתִי לְךָ
  choice: ich richte mein Gebet an dich
  rationale: Die nominale hebräische Wendung bezeichnet das an Gott gerichtete Gebet; die verbale deutsche Form ist natürlich und bewahrt Richtung und Inhalt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֵת רָצוֹן
  choice: zu einer Zeit des Wohlwollens
  rationale: Die Wendung bezeichnet eine Zeit göttlicher Gunst beziehungsweise Annahme; „Wohlwollen“ bewahrt diesen Sinn, ohne einen bloß praktischen günstigen Zeitpunkt nahezulegen.
- source_word: בְּרָב חַסְדֶּךָ
  choice: in der Fülle deiner treuen Liebe
  rationale: רֹב bezeichnet Fülle oder Größe; חֶסֶד umfasst beständige, loyale Liebe und Güte. „Treue Liebe“ bringt diese Verbindung in gegenwärtigem Deutsch knapp zum Ausdruck.
- source_word: עֲנֵנִי
  choice: antworte mir
  rationale: Der Imperativ bezeichnet im Gebetszusammenhang die erbetene Antwort Gottes.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: in der Treue deiner Rettung
  rationale: אֱמֶת kann Wahrheit, Treue oder Verlässlichkeit bedeuten. In Verbindung mit Gottes rettendem Handeln ist „Treue“ idiomatisch und lässt dessen Verlässlichkeit hervortreten; die formnähere Alternative „Wahrheit“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֱמֶת im Verhältnis zu Gottes Rettung
  choice: Treue
  alternative: Wahrheit
  rationale: Das hebräische Wort umfasst sowohl Wahrheit als auch Treue beziehungsweise Verlässlichkeit. Der Kontext einer Bitte um Gottes rettende Antwort legt „Treue“ nahe, doch die echte lexikalische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem hebräischen Gebetsruf nahe, wird aber durch „ich richte mein Gebet an dich“ idiomatisch formuliert. Die Wiederaufnahme der Anrede mit „Gott“ und die beiden mit „in“ eingeleiteten Wendungen erhalten den feierlichen Parallelismus.
