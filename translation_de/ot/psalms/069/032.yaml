  source_fidelity: 'Der Entwurf gibt die Abfolge des Hebräischen zutreffend wieder: vollzogene Wahrnehmung, darauf folgende Freude und anschließende direkte Anrede der Gottesuchenden. Das nicht ausgedrückte Objekt von רָאוּ wird zu Recht nicht ergänzt. Die jussivische Schlusswendung ist als Wunsch bzw. Ermutigung wiederzugeben.'
