  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: de
  text: 'Die Demütigen[a] haben gesehen und freuen sich; ihr, die ihr Gott sucht: Mögen eure Herzen aufleben![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Gebeugten“, „die Bedrängten“ oder „die Sanftmütigen“.'
