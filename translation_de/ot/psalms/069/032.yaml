  terminology: „Die Demütigen“ ist für עֲנָוִים tragfähig; die Fußnote sichert die soziale Bedeutungskomponente („Bedrängte“) sowie weitere mögliche Nuancen ab. „Gott“ ist hier korrekt. Die Fußnote zur Herz-Metaphorik ist sachlich und nicht konfessionell festgelegt.
