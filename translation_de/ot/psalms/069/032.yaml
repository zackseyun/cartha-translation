  - marker: b
    text: 'Wörtlich: „Euer Herz lebe.“ Gemeint ist neue Lebenskraft, neuer Mut oder neue Hoffnung.'
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: haben gesehen
  rationale: Das Qal-Perfekt bezeichnet einen vollzogenen Vorgang, dessen Wirkung im anschließenden Sichfreuen gegenwärtig ist. Das im Hebräischen nicht ausgedrückte Objekt wird auch im Deutschen nicht ergänzt.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Das Wort kann demütige bzw. sanftmütige Menschen bezeichnen und zugleich ihre bedrängte, niedrige Lage anklingen lassen. „Die Demütigen“ wahrt den geistlich-sozialen Bedeutungsraum; tragfähige Alternativen werden in der Fußnote genannt.
- source_word: יִשְׂמָחוּ
  choice: freuen sich
  rationale: Das Imperfekt kann hier die gegenwärtige beziehungsweise daraus folgende Reaktion lebendig ausdrücken. Die Präsensform ist im Deutschen natürlich, ohne die Aussage unnötig auf die Zukunft festzulegen.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: ihr, die ihr Gott sucht
  rationale: Die Partizipialverbindung wird wegen des folgenden Suffixes der zweiten Person Plural als direkte Anrede verstanden. Die Formulierung gibt diesen Wechsel zur Anrede klar wieder.
- source_word: וִיחִי לְבַבְכֶם
  choice: Euer Herz lebe auf
  rationale: Die Wunsch- bzw. Aufforderungsform von חיה wird mit „lebe auf“ wiedergegeben. Das kollektive Singularwort „Herz“ mit pluralischem Besitzer bleibt erhalten; „aufleben“ vermittelt zugleich die idiomatische Vorstellung neuer Lebenskraft, neuen Mutes und neuer Hoffnung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache. Die ungewöhnliche Objektlosigkeit von „haben gesehen“ bewahrt die Offenheit des hebräischen Textes, statt ein nicht genanntes „es“ einzufügen. Der Semikolon- und Doppelpunktbau bildet den poetischen Übergang von der Aussage zur direkten Ermutigung ab.
