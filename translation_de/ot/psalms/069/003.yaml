base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/003.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: de
  text: Ich bin müde vom Rufen; meine Kehle ist ausgedörrt[a]. Meine Augen versagen, während ich auf meinen Gott hoffe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Kehle ist heiser“. Das Hebräische bezeichnet eher ein Austrocknen, Erhitzen oder Brennen infolge langen Rufens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „während ich auf meinen Gott warte“. Das hebräische Verb kann sowohl Warten als auch hoffnungsvolle Erwartung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Ich bin müde
  rationale: Das Verb bezeichnet das Müde- oder Erschöpftsein; die Form beschreibt hier den durch anhaltendes Rufen erreichten Zustand.
- source_word: בְקָרְאִי
  choice: vom Rufen
  rationale: 'קרא meint hier das laute Rufen um Hilfe. Die Präposition wird im Zusammenhang kausal wiedergegeben: Das fortgesetzte Rufen hat den Beter ermüdet.'
- source_word: נִחַר
  choice: ist ausgedörrt
  rationale: Das Wort bezeichnet ein Versengt-, Erhitzt- oder Ausgetrocknetsein. „Ausgedörrt“ bewahrt das körperliche Bild deutlicher als die mögliche sinngemäße Wiedergabe „heiser“.
- source_word: גְּרוֹנִי
  choice: meine Kehle
  rationale: גרון bezeichnet hier die Kehle und passt zum körperlichen Bild der Folgen langen Rufens.
- source_word: כָּלוּ עֵינַי
  choice: Meine Augen versagen
  rationale: כלה kann das Zu-Ende-Gehen, Aufgeriebenwerden oder Versagen ausdrücken. Mit den Augen als Subjekt bezeichnet es deren Erschöpfung durch langes erwartungsvolles Ausschauen.
- source_word: מְיַחֵל
  choice: während ich … hoffe
  rationale: יחל umfasst sowohl wartendes Ausharren als auch hoffnungsvolle Erwartung. „hoffe“ macht die zu Gott gerichtete Erwartung natürlich verständlich; die Alternative „warte“ bleibt in der Fußnote erhalten.
- source_word: לֵאלֹהָי
  choice: auf meinen Gott
  rationale: Die Präposition ל markiert hier das Ziel der Hoffnung beziehungsweise des Wartens; „auf meinen Gott hoffen“ ist idiomatisches Deutsch und bewahrt den persönlichen Bezug.
theological_decisions:
- issue: Bedeutungsumfang von יחל
  choice: auf meinen Gott hoffe
  alternative: auf meinen Gott warte
  rationale: Der hebräische Ausdruck verbindet zeitliches Warten mit hoffnungsvoller Erwartung. Der Haupttext nennt die Hoffnung, ohne die zeitliche Nuance auszuschließen; die Fußnote weist ausdrücklich auf beide Möglichkeiten hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Klagesprache und bewahrter körperlicher Bildlichkeit. „Ausgedörrt“ ist stärker bildhaft als „trocken“, bleibt aber allgemein verständlich. Die Zeilenfolge und die Spannung zwischen Warten und Hoffen werden erhalten.
