  yaml_path: translation/ot/psalms/069/011.yaml
  text: I made sackcloth my clothing[b][a], and I became a byword to them.
translation:
  language: de
  text: Ich machte Sacktuch zu meinem Gewand, und ich wurde ihnen zum Spottwort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Sprichwort“; gemeint ist hier ein bekanntes Beispiel, über das man spöttisch redet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Ich machte … zu
  rationale: נתן bedeutet grundsätzlich „geben, setzen“; in der Verbindung mit „mein Gewand“ und „Sacktuch“ bezeichnet es, dass der Beter Sacktuch zu seiner Kleidung machte.
- source_word: לְבוּשִׁי
  choice: meinem Gewand
  rationale: לְבוּשׁ bezeichnet Kleidung beziehungsweise ein Gewand; der Singular „Gewand“ ist im Deutschen natürlich und bewahrt den Possivbezug.
- source_word: שָׂק
  choice: Sacktuch
  rationale: „Sacktuch“ ist die geläufige Bezeichnung für den groben Stoff, der als Zeichen von Trauer oder Demütigung getragen wurde.
- source_word: וָאֱהִי
  choice: ich wurde
  rationale: היה beschreibt hier den eingetretenen Zustand; „wurde“ gibt diese Entwicklung treffend wieder.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das relationale ל wird mit dem deutschen Dativ idiomatisch wiedergegeben.
- source_word: לְמָשָׁל
  choice: zum Spottwort
  rationale: מָשָׁל kann „Spruch, Gleichnis, Sprichwort“ bedeuten; im Klagekontext bezeichnet es einen Menschen, der zum Gegenstand spöttischen Redens wird. „Spottwort“ macht diese kontextuelle Bedeutung verständlich, ohne das Bild eines geläufigen Ausspruchs aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „Sacktuch zu meinem Gewand machen“ erhält die konkrete Bildsprache des Hebräischen; „Spottwort“ vermittelt im Haupttext die negative Bedeutung von מָשָׁל in diesem Klagekontext.
