source:
  edition: WLC
  text: יְהִֽי שֻׁלְחָנָ֣/ם לִ/פְנֵי/הֶ֣ם לְ/פָ֑ח וְ/לִ/שְׁלוֹמִ֥ים לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: de
  text: Möge ihr Tisch vor ihnen zur Falle werden und ihr Wohlergehen zur Schlinge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist mehrdeutig. Er kann „ihr Wohlergehen“ oder „ihre Sicherheit“ bedeuten; mit möglichem kultischem Anklang ist auch „ihre Friedensopfer“ möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: soll … werden
  rationale: Der Jussiv von היה formuliert hier einen Verwünschungswunsch. Die deutsche Wendung bewahrt sowohl die volitive Kraft als auch den Übergang in einen verhängnisvollen Zustand.
- source_word: שֻׁלְחָנָם
  choice: ihr Tisch
  rationale: Das konkrete Bild des Tisches bleibt erhalten; im Zusammenhang kann es zugleich für Versorgung, Mahlgemeinschaft oder Festfreude stehen.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die räumliche Formulierung gibt den hebräischen Ausdruck direkt wieder und erhält die Ironie, dass das offen vor ihnen Stehende zur Gefahr wird.
- source_word: לְפָח
  choice: zur Falle
  rationale: פַּח bezeichnet eine Falle oder Schlinge. „Falle“ ermöglicht es, den parallelen, aber eigenständigen Ausdruck מוֹקֵשׁ mit „Schlinge“ wiederzugeben.
- source_word: וְלִשְׁלוֹמִים
  choice: und was ihnen zum Wohl dient
  rationale: שְׁלוֹמִים ist an dieser Stelle mehrdeutig. Die Wiedergabe nimmt den abstrakten Sinn von Wohlergehen beziehungsweise gedeihlicher Sicherheit auf und verbindet ihn natürlich mit dem parallelen Satzbau, ohne mögliche kultische Anklänge als sicher auszugeben.
- source_word: לְמוֹקֵשׁ
  choice: zur Schlinge
  rationale: מוֹקֵשׁ bezeichnet gewöhnlich eine Schlinge oder Falle. „Schlinge“ wahrt die leichte begriffliche Variation des hebräischen Parallelismus.
theological_decisions:
- issue: Deutung von שְׁלוֹמִים innerhalb der Verwünschung
  choice: was ihnen zum Wohl dient
  alternative: ihre Friedensopfer; ihr Wohlergehen; wenn sie in Sicherheit sind
  rationale: Der hebräische Ausdruck lässt sowohl eine abstrakte Deutung auf Wohlergehen oder Sicherheit als auch einen möglichen kultischen Anklang an Friedensopfer zu. Der Haupttext bewahrt die scharfe Umkehrung von Gutem in Gericht, während die Fußnote die echte lexikalische Spannung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus und die konkrete Bildsprache des Hebräischen bleiben erhalten; die Ellipse im zweiten Halbvers wird im Deutschen bewusst nicht durch ein wiederholtes „soll werden“ beschwert.
