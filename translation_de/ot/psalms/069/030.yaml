base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: de
  text: Ich will den Namen Gottes mit einem Lied preisen und ihn mit Dank[a] hochpreisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Dankopfer“. Das hebräische Wort kann sowohl Dank beziehungsweise Danksagung als auch ein Dankopfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Ich will … preisen
  rationale: Der Kohortativ der 1. Person Singular drückt hier den entschlossenen Willen des Beters aus; „Ich will“ gibt diese volitive Nuance im Deutschen natürlich wieder.
- source_word: שֵׁם אֱלֹהִים
  choice: den Namen Gottes
  rationale: Die hebräische Genitivverbindung wird transparent und mit ihrer ehrfürchtigen Ausdruckskraft wiedergegeben.
- source_word: בְּשִׁיר
  choice: mit einem Lied
  rationale: Die Präposition ב bezeichnet Mittel oder Art und Weise. Das singularische שִׁיר wird im Deutschen natürlich als „mit einem Lied“ wiedergegeben.
- source_word: וַאֲגַדְּלֶנּוּ
  choice: und ihn … groß machen
  rationale: Das Verb גדל bezeichnet im Piel das Großmachen beziehungsweise Rühmen. Die bewusst konkrete Formulierung bewahrt das Bild des Hebräischen; das Suffix der 3. Person maskulin Singular bezieht sich auf Gott.
- source_word: בְתוֹדָה
  choice: mit Dank
  rationale: תּוֹדָה kann Dank beziehungsweise Danksagung oder ein Dankopfer bezeichnen. Im Parallelismus mit Preisen und Lied ist hier der verbale Ausdruck des Dankes am wahrscheinlichsten.
theological_decisions:
- issue: Ob תּוֹדָה verbalen Dank oder ein Dankopfer bezeichnet
  choice: verbaler Dank
  alternative: Dankopfer
  rationale: Der unmittelbare Zusammenhang beschreibt musikalisches und verbales Gotteslob. Deshalb passt „Dank“ am besten, ohne die mögliche kultische Bedeutung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus der beiden Halbverse bleibt klar; „groß machen“ bewahrt das hebräische Bild, während die Fußnote die echte Bedeutungsbreite von תּוֹדָה offenhält.
