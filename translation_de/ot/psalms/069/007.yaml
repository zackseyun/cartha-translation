    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier eine Begründung oder Erklärung ein. „Denn“ bewahrt den Zusammenhang mit dem vorangehenden Kontext und klingt im Deutschen natürlicher als eine Verbindung wie „denn weil“.
- source_word: עָלֶיךָ
  choice: deinetwegen
  rationale: עַל mit Pronominalsuffix bezeichnet hier den Grund beziehungsweise Anlass. „Deinetwegen“ ist prägnant und lässt offen, ob „um deinetwillen“ stärker die freiwillige Hingabe betonen würde.
- source_word: נָשָׂאתִי
  choice: habe ich … getragen
  rationale: נשא bedeutet grundlegend „tragen“. In Verbindung mit חֶרְפָּה erhält „Schmach tragen“ das konkrete Bild und ist im Deutschen verständlich und würdig.
- source_word: חֶרְפָּה
  choice: Schmach
  rationale: חֶרְפָּה umfasst Schmähung, öffentliche Verachtung und die daraus entstehende Entehrung. „Schmach“ bewahrt diese Spannweite und unterscheidet sich von כְלִמָּה im zweiten Halbvers.
- source_word: כִּסְּתָה
  choice: hat … bedeckt
  rationale: כסה bedeutet wörtlich „bedecken“. Das Perfekt und die Übereinstimmung mit dem femininen Subjekt כְלִמָּה werden in „Schande hat … bedeckt“ klar wiedergegeben.
- source_word: כְלִמָּה
  choice: Schande
  rationale: כְלִמָּה bezeichnet Schande, Beschämung oder Demütigung. „Schande“ bewahrt den Aspekt öffentlicher Entehrung; „Beschämung“ ist eine mögliche Alternative.
- source_word: פָנַי
  choice: mein Gesicht
  rationale: פָּנִים kann „Gesicht“ oder „Gegenwart“ bedeuten. Im Bild des Bedeckens durch Schande ist „mein Gesicht“ die naheliegende konkrete Wiedergabe.
