translation:
  language: de
  text: Denn deinetwegen habe ich Schmach getragen[a]; Schande hat mein Gesicht bedeckt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um deinetwillen habe ich Schmach getragen“.'
