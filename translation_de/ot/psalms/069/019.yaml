  text: אַתָּ֤ה יָדַ֗עְתָּ חֶרְפָּתִ֣/י וּ֭/בָשְׁתִּ/י וּ/כְלִמָּתִ֑/י נֶ֝גְדְּ/ךָ֗ כָּל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: de
  text: Du kennst meine Schmach, meine Schande und meine Demütigung; alle meine Widersacher sind vor dir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Du kennst
  rationale: Das Qal Perfekt 2. Person maskulin Singular von ידע richtet sich an Gott. Im Gebet gibt das deutsche Präsens die anhaltende, volle Kenntnis Gottes natürlich wieder.
- source_word: חֶרְפָּתִי
  choice: meine Schmach
  rationale: חֶרְפָּה bezeichnet Schmähung, Hohn oder die dadurch zugefügte Schande. „Schmach“ bewahrt sowohl den sozialen Angriff als auch den würdevollen poetischen Ton.
- source_word: בָשְׁתִּי
  choice: meine Schande
  rationale: Das Substantiv bezeichnet Scham beziehungsweise Entehrung. „Schande“ passt hier zur von außen wahrnehmbaren Erniedrigung und bleibt von den benachbarten Begriffen unterscheidbar.
- source_word: כְלִמָּתִי
  choice: meine Demütigung
  rationale: כְּלִמָּה überschneidet sich mit Schande, kann aber die öffentliche Erniedrigung betonen. „Demütigung“ erhält die rhetorische Häufung dreier verwandter, doch nicht identischer Begriffe.
- source_word: נֶגְדְּךָ
  choice: vor dir
  rationale: נֶגֶד mit Suffix bezeichnet, dass jemand sich vor einer Person beziehungsweise in ihrer Gegenwart befindet. „Vor dir“ ist knapp, idiomatisch und unterstreicht, dass Gott die Gegner sieht.
- source_word: כָּל
  choice: alle
  rationale: Der Quantor umfasst die gesamte Gruppe und wird mit dem Plural natürlich durch „alle“ wiedergegeben.
- source_word: צוֹרְרָי
  choice: meine Widersacher
  rationale: Das von צרר abgeleitete Wort bezeichnet Menschen, die dem Sprecher feindlich entgegentreten. „Widersacher“ bewahrt die aktive Gegnerschaft und den poetischen Registerton.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, poetischem Gebetston. Die dreifache Folge „Schmach, Schande und Demütigung“ bewahrt die hebräische Häufung nah verwandter Begriffe, ohne sie künstlich gleichzusetzen. Keine Fußnote nötig; die englische Fußnote scheint inhaltlich nicht an „reproach“, sondern an die Wiedergabe von צוֹרְרָי gebunden zu sein, deren Varianten im Deutschen den Sinn nicht wesentlich verändern.
