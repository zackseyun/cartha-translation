source:
  edition: WLC
  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: de
  text: Die Nachkommen seiner Diener werden sie erben[a], und die seinen Namen lieben, werden in ihr wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie“ und „ihr“ beziehen sich wahrscheinlich auf Zion, die wiederhergestellte Stadt; möglich ist auch ein weiterer Bezug auf das Land oder Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: Nachkommen
  rationale: Das kollektiv gebrauchte Singularwort bezeichnet hier die Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen natürlich und gibt den gemeinten Bezug auf spätere Generationen klar wieder.
- source_word: עֲבָדָיו
  choice: seiner Diener
  rationale: עֶבֶד kann je nach Zusammenhang „Diener“ oder „Sklave“ bedeuten. Im religiösen und bundestheologischen Kontext des Psalms ist „Diener“ angemessen, ohne die soziale Institution der Sklaverei unnötig in den Vordergrund zu rücken.
- source_word: יִנְחָלוּהָ
  choice: werden sie erben
  rationale: נחל bezeichnet den Empfang oder Besitz als Erbe. Das feminine Pronomen wird im Deutschen mit „sie“ wiedergegeben und verweist am ehesten auf Zion beziehungsweise die wiederhergestellte Stadt.
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: die seinen Namen lieben
  rationale: Die partizipiale Wendung wird natürlich wiedergegeben und bewahrt die biblische Ausdrucksweise, Gottes Namen zu lieben, statt sie zu „die ihn lieben“ zu verallgemeinern.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: werden in ihr wohnen
  rationale: שׁכן bedeutet „wohnen“, „sich niederlassen“ oder „ansässig sein“. „Wohnen“ ist würdig und zugleich gegenwärtig verständlich; „in ihr“ bewahrt den femininen Rückverweis.
theological_decisions:
- issue: Bezugswort der femininen Suffixe in „sie erben“ und „in ihr wohnen“
  choice: Die Suffixe beziehen sich auf Zion beziehungsweise die wiederhergestellte Stadt im unmittelbaren Kontext.
  alternative: Sie können weiter gefasst auf das Land oder auf Jerusalem bezogen werden.
  rationale: Der vorhergehende Vers spricht davon, dass Gott Zion rettet und die Städte Judas wieder aufbaut. Daher liegt Zion beziehungsweise die Stadt als Bezug am nächsten. Das feminine Pronomen „sie/ihr“ bewahrt den Rückverweis, ohne ihn im Haupttext ausdrücklich festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Psalmstil. Die Parallelstruktur des Hebräischen und die Zukunftsformen bleiben erhalten; die femininen Pronomen bewahren den Rückbezug und seine begrenzte Mehrdeutigkeit.
