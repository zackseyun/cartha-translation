source:
  edition: WLC
  text: הוֹשִׁיעֵ֥/נִי אֱלֹהִ֑ים כִּ֤י בָ֖אוּ מַ֣יִם עַד נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: de
  text: Rette mich, Gott, denn das Wasser reicht mir bis an die Kehle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »bis an meine Seele«; das hebräische Wort näfesch kann »Seele«, »Leben« oder »Selbst« bedeuten und in einem Zusammenhang wie diesem auch die Kehle beziehungsweise den Hals bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von ישׁע mit Suffix der 1. Person Singular ist ein unmittelbarer Hilferuf. »Rette mich« ist im modernen Deutsch natürlich und entspricht der geschilderten Lebensgefahr.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים steht hier als direkte Anrede. Im Deutschen macht das Komma den Vokativ eindeutig; ein zusätzliches »o« wäre möglich, klänge aber stärker traditionell.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet den vorausgehenden Hilferuf. »Denn« ist knapp, idiomatisch und dem würdevollen poetischen Register angemessen.
- source_word: בָאוּ מַיִם
  choice: das Wasser reicht
  rationale: Wörtlich heißt es, dass Wasser »gekommen ist«. In Verbindung mit עַד נָפֶשׁ gibt »reicht« die bedrohliche Wasserhöhe im Deutschen natürlich wieder, ohne die Bildsprache weiter auszudeuten.
- source_word: עַד נָפֶשׁ
  choice: bis an die Kehle
  rationale: נֶפֶשׁ kann Seele, Leben oder Selbst bezeichnen und auch auf Kehle beziehungsweise Hals als Ort des Atems und Lebens verweisen. Im Bild drohenden Ertrinkens vermittelt »bis an die Kehle« die konkrete Gefahr und bleibt näher an der möglichen Körperbezeichnung als das ebenfalls idiomatische »bis zum Hals«.
theological_decisions:
- issue: Wiedergabe von נֶפֶשׁ im poetischen Bild der Lebensgefahr
  choice: Konkrete körperliche Bedeutung »Kehle«
  alternative: »Seele«, »Leben« oder »Hals«
  rationale: Der Kontext beschreibt überwältigende Wasser und damit unmittelbar drohendes Ertrinken. Die Übersetzung deutet נֶפֶשׁ daher körperlich, hält aber durch die Fußnote die wörtlichere und existenzielle Bedeutungsbreite offen, ohne eine anthropologische Lehrentscheidung zu treffen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Gebetsdeutsch. Die direkte Anrede bleibt ohne das heute feierlich-archaisch wirkende »o«. Der kurze Satz bewahrt die Dringlichkeit und den poetischen Rhythmus des Hebräischen.
