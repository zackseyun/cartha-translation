  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: de
  text: Komm meiner Seele[a] nahe und erlöse sie; wegen meiner Feinde[b] befreie mich!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „meiner Seele“; das Wort kann hier auch „meinem Leben“ oder „mir“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um meiner Feinde willen“. Die hebräische Wendung kann formal auch so wiedergegeben werden; im Zusammenhang bezeichnet sie wahrscheinlich die Feinde als Anlass der erbetenen Befreiung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: Komm ... nahe
  rationale: Der Qal-Imperativ richtet eine unmittelbare Bitte um Gottes Nähe aus; die deutsche Wendung ist natürlich und wahrt die Aufforderung.
- source_word: נַפְשִׁי
  choice: meiner Seele
  rationale: נפש kann Seele, Leben oder die eigene Person bezeichnen. „Meiner Seele“ bewahrt hier das hebräische Bild und den persönlichen, eindringlichen Ton.
- source_word: גְאָלָהּ
  choice: erlöse sie
  rationale: Das feminine Suffix nimmt נַפְשִׁי auf. „Erlöse sie“ bewahrt sowohl diesen Rückbezug als auch den Sinn von גאל als befreiendes Zurückgewinnen.
- source_word: לְמַעַן
  choice: um ... willen
  rationale: למען kann Zweck oder Beweggrund ausdrücken. Die formnahe Wiedergabe lässt offen, ob die Feinde Anlass oder Bezugspunkt der Bitte sind; im Zusammenhang liegt „wegen“ nahe.
- source_word: אֹיְבַי
  choice: meiner Feinde
  rationale: Klare Wiedergabe des Plurals mit Suffix der ersten Person Singular.
- source_word: פְּדֵנִי
  choice: befreie mich
  rationale: פדה bezeichnet Loskaufen beziehungsweise Befreien. „Befreie“ unterscheidet das Verb von גאל, ohne im Deutschen zwingend eine konkrete Lösegeldzahlung anzunehmen.
theological_decisions:
- issue: Unterscheidung der beiden Erlösungsverben גאל und פדה
  choice: גאל mit „erlösen“, פדה mit „befreien“ wiedergeben
  alternative: Beide Verben mit „erlösen“ wiedergeben oder פדה mit „kaufe mich los“ übersetzen
  rationale: Die unterschiedlichen deutschen Verben erhalten die poetische Steigerung und die lexikalische Vielfalt. „Befreien“ vermeidet zugleich, eine ausgearbeitete Lösegeld- oder Sühnetheorie in die Bitte hineinzulesen.
- issue: Bedeutung von לְמַעַן אֹיְבַי
  choice: Im Text „um meiner Feinde willen“, mit kontextueller Erläuterung in der Fußnote
  alternative: „Wegen meiner Feinde“ beziehungsweise „angesichts meiner Feinde“
  rationale: Die hebräische Fügung kann formal Zweck oder Beweggrund ausdrücken. Die Hauptfassung bewahrt diese Spannung, während die Fußnote die im Kontext wahrscheinliche kausale Bedeutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Der Satzbau bleibt knapp und gebetsartig; die beiden verwandten hebräischen Rettungsverben werden differenziert wiedergegeben.
