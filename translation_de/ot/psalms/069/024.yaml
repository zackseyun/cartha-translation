base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/024.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: de
  text: Gieße deinen Grimm über sie aus, und die Glut deines Zorns soll sie einholen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und dein glühender Zorn soll sie erreichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָךְ
  choice: Gieße … aus
  rationale: Der Imperativ bezeichnet bildhaft das Ausgießen göttlichen Zorns; die deutsche Wendung ist anschaulich, idiomatisch und gegenwartssprachlich.
- source_word: עֲלֵיהֶם
  choice: über sie
  rationale: עַל mit Suffix bezeichnet hier die Zielrichtung des ausgegossenen Zorns. „Über sie ausgießen“ entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: זַעְמֶךָ
  choice: deinen Zorn
  rationale: זַעַם bezeichnet heftigen, oft göttlichen Unwillen beziehungsweise Zorn. „Zorn“ bewahrt die Stärke und Würde des Ausdrucks.
- source_word: וַחֲרוֹן אַפְּךָ
  choice: und die Glut deines Ärgers
  rationale: Die hebräische Wendung bezeichnet wörtlich die Glut beziehungsweise das Brennen der Nase und idiomatisch heftigen Zorn. „Glut deines Ärgers“ erhält das Hitzebild und vermeidet eine bloße Wiederholung von „Zorn“.
- source_word: יַשִּׂיגֵם
  choice: soll sie einholen
  rationale: Das Hifil von נשׂג bedeutet erreichen oder einholen. „Einholen“ bewahrt das Bild einer nachsetzenden Macht, die ihre Ziele erreicht.
theological_decisions:
- issue: Fluchbitte gegen Feinde
  choice: Die direkte Bitte um Gottes Strafgericht wird ungemildert wiedergegeben.
  alternative: Eine abschwächende Umschreibung wie „Zeige ihnen dein Missfallen“.
  rationale: Der hebräische Text bittet ausdrücklich darum, dass Gottes Zorn über die Gegner ausgegossen wird und sie einholt. Die theologische Spannung dieser Bitte darf nicht geglättet werden.
- issue: Verbform von יַשִּׂיגֵם
  choice: 'Als volitiver Folgesatz: „soll sie einholen“.'
  alternative: 'Als schlichte Zukunftsaussage: „wird sie einholen“.'
  rationale: Nach dem vorangehenden Imperativ kann das Präfixverb die fortgesetzte Bitte ausdrücken. Die deutsche Fassung wahrt diesen Gebetscharakter, ohne die mögliche Aussagefärbung ganz auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Bildsprache und der ungemilderte Charakter der Gerichtsb Bitte bleiben erhalten; das ungewöhnliche hebräische Hitzebild wird in verständlicher Form bewahrt.
