  terminology: Für זַעְמֶךָ ist „deinen Grimm“ eine starke, literarisch weiterhin geläufige Wiedergabe, die den Ausdruck von der anschließenden idiomatischen Zornsformel unterscheidet. חֲרוֹן אַפְּךָ wird mit „die Glut deines Zorns“ als intensive Zornsmetapher klar wiedergegeben, ohne das wörtliche hebräische Körperbild unnötig in den Text zu übertragen.
