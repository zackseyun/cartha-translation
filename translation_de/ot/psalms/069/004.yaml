base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: de
  text: Zahlreicher als die Haare auf meinem Kopf sind die, die mich ohne Grund hassen. Mächtig sind die, die mich vernichten wollen, meine trügerischen Feinde[a]. Was ich nicht geraubt habe, gebe ich dann zurück[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck kann auch bedeuten: „meine falschen Feinde“ oder „meine Feinde, die mich zu Unrecht anfeinden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Was ich nicht geraubt habe, gebe ich dann zurück.“ Gemeint sein kann, dass der Beter etwas ersetzen muss, das er gar nicht geraubt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Zahlreicher als die Haare auf meinem Kopf
  rationale: רבו bezeichnet eine große Zahl; das מן vor „Haare“ markiert den Vergleich. Die deutsche Komparativform gibt das poetische Bild natürlich und genau wieder.
- source_word: שֹׂנְאַי חִנָּם
  choice: die, die mich ohne Grund hassen
  rationale: חנם bezeichnet hier fehlenden Anlass oder fehlende Rechtfertigung; „ohne Grund“ bewahrt diesen moralisch-rechtlichen Sinn.
- source_word: עָצְמוּ
  choice: Mächtig sind
  rationale: Das Verb bezeichnet Stärke beziehungsweise Übermacht. Die vorangestellte Formulierung wahrt den poetischen Nachdruck.
- source_word: מַצְמִיתַי
  choice: die, die mich vernichten wollen
  rationale: Das Partizip bezeichnet die auf die Vernichtung des Sprechers gerichteten Gegner; „wollen“ bringt diese feindliche Absicht idiomatisch zum Ausdruck.
- source_word: אֹיְבַי שֶׁקֶר
  choice: meine Feinde mit ihren Lügen
  rationale: שקר kann die Feinde als verlogen kennzeichnen oder ihre Feindschaft als falsch und unberechtigt bestimmen. Die Formulierung ist im Deutschen natürlich, ohne die Lügen ausschließlich auf eine bestimmte Art der Falschheit festzulegen.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: Was ich nicht geraubt habe
  rationale: גזל bezeichnet gewaltsames oder räuberisches Wegnehmen; „rauben“ ist daher genauer als das allgemeinere „stehlen“.
- source_word: אָז אָשִׁיב
  choice: muss ich dennoch zurückgeben
  rationale: Wörtlich steht „dann gebe ich zurück“. Im Zusammenhang mit der beteuerten Unschuld bezeichnet die Aussage eine paradoxe beziehungsweise erzwungene Wiedergutmachung; „dennoch“ und „muss“ machen diese Implikation im Deutschen verständlich.
theological_decisions:
- issue: Deutung der Gegnerbezeichnung אֹיְבַי שֶׁקֶר
  choice: meine Feinde mit ihren Lügen
  alternative: meine falschen Feinde / die mich zu Unrecht anfeinden
  rationale: Der hebräische Ausdruck lässt offen, ob שקר den verlogenen Charakter der Feinde oder die Unrechtmäßigkeit ihrer Feindschaft bezeichnet. Der Haupttext hält die Verbindung mit Lüge fest; die Fußnote bewahrt die adverbiale Alternative.
- issue: Erzwungene Wiedergutmachung trotz Unschuld im Schlusssatz
  choice: Was ich nicht geraubt habe, muss ich dennoch zurückgeben.
  alternative: Was ich nicht geraubt habe, das gebe ich dann zurück.
  rationale: Der Kontext schildert grundlose Feindschaft und falsche Vorwürfe. Die Übersetzung macht den impliziten Zwang verständlich, während die Fußnote den knapperen hebräischen Wortlaut dokumentiert und die Spannung nicht dogmatisch auflöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. „Rauben“ wahrt die stärkere Bedeutung von גזל. Die beiden Fußnoten sichern die echte Mehrdeutigkeit von שקר und die knappe, schwierige Ausdrucksweise des letzten Satzes.
