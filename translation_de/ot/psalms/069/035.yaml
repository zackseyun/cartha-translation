id: PSA.69.35
reference: Psalms 69:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אֱלֹהִ֨ים י֘וֹשִׁ֤יעַ צִיּ֗וֹן וְ֭/יִבְנֶה עָרֵ֣י יְהוּדָ֑ה וְ/יָ֥שְׁבוּ שָׁ֝֗ם וִ/ירֵשֽׁוּ/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: de
  text: Denn Gott wird Zion retten und die Städte Judas bauen. Dort werden sie wohnen und es in Besitz nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sie in Besitz nehmen« oder »sie erben«. Die feminine Einzahl kann sich auf Zion oder auf das als Einheit gedachte Land beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. bekräftigt im Zusammenhang die vorausgehende Hoffnung; „Denn“ gibt diesen Anschluss natürlich wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Verb steht im Singular; gemeint ist daher Gott im Singular.
- source_word: יוֹשִׁיעַ
  choice: wird … retten
  rationale: Das Hifil von ישׁע bezeichnet Retten oder Befreien; das Futur passt zum Verheißungscharakter des Satzes.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird in seiner eingebürgerten deutschen Form beibehalten.
- source_word: וְיִבְנֶה
  choice: und … bauen
  rationale: בנה bedeutet „bauen“. „Wiederaufbauen“ wäre möglich im Kontext, ist aber im Verb selbst nicht ausdrücklich markiert.
- source_word: עָרֵי יְהוּדָה
  choice: die Städte Judas
  rationale: Die hebräische Genitivverbindung wird im Deutschen natürlich mit dem Genitiv des Eigennamens wiedergegeben.
- source_word: וְיָשְׁבוּ
  choice: werden sie wohnen
  rationale: ישׁב bezeichnet hier dauerhaftes Wohnen bzw. Ansiedeln; „wohnen“ ist klar und wahrt den Bezug zum Land.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf Zion und die Städte Judas.
- source_word: וִירֵשׁוּהָ
  choice: und es in Besitz nehmen
  rationale: ירשׁ kann „erben“, „besitzen“ oder „in Besitz nehmen“ bedeuten. Die feminine Singularendung wird im Deutschen mit dem grammatisch passenden Neutrum „es“ wiedergegeben, wobei der unbestimmte Bezug in der Fußnote erläutert wird.
theological_decisions:
- issue: Bezug der femininen Singularendung in וִירֵשׁוּהָ
  choice: „es in Besitz nehmen“ mit Fußnote zur wörtlichen femininen Form und zum offenen Bezug
  alternative: „sie in Besitz nehmen“, „Zion in Besitz nehmen“ oder „das Land erben“
  rationale: Die hebräische Endung ist feminin Singular, doch ihr genauer Bezug bleibt zwischen Zion und dem als Einheit gedachten Land- bzw. Stadtgebiet offen. Eine natürliche deutsche Wiedergabe soll diese Offenheit nicht durch eine ausdrücklich ergänzte Bezugsgröße auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweite Satz vermeidet eine schwer verständliche feminine Personifikation im Haupttext, hält aber die feminine Form und den offenen Bezug des Hebräischen in der Fußnote fest.
