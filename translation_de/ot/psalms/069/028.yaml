base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: de
  text: Mögen sie aus dem Buch des Lebens[a] getilgt und nicht bei den Gerechten eingeschrieben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Buch der Lebenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: sie sollen … getilgt werden
  rationale: Der Nifal weist eine passive Bedeutung auf; im Zusammenhang der Verwünschungen ist die Imperfektform jussivisch als Bitte oder Wunsch zu verstehen. „Tilgen“ bewahrt zugleich das Bild eines schriftlichen Verzeichnisses.
- source_word: מִסֵּפֶר
  choice: aus dem Buch
  rationale: סֵפֶר bezeichnet ein Buch, eine Schriftrolle oder ein schriftliches Verzeichnis. „Buch“ ist in dieser Verbindung natürlich und lässt die Bildsprache offen.
- source_word: חַיִּים
  choice: des Lebens
  rationale: חַיִּים kann hier sowohl „Leben“ als auch „Lebende“ bezeichnen. „Buch des Lebens“ bewahrt die überlieferte Metapher; die alternative Deutung wird in einer Fußnote genannt.
- source_word: וְעִם
  choice: und … bei
  rationale: עִם bedeutet wörtlich „mit“. In Verbindung mit dem Eingeschriebenwerden gibt „bei“ die Zugehörigkeit zu derselben Gruppe oder Liste idiomatisch wieder.
- source_word: צַדִּיקִים
  choice: den Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet die Gerechten, ohne die moralische beziehungsweise bundestheologische Kategorie näher festzulegen.
- source_word: אַל יִכָּתֵבוּ
  choice: nicht … eingeschrieben werden
  rationale: אַל mit der Imperfektform drückt einen negativen Wunsch aus. „Eingeschrieben werden“ gibt den passiven Sinn von כתב wieder und passt zum Bild eines Buches oder Registers.
theological_decisions:
- issue: Bedeutung des „Buches des Lebens“
  choice: Die Metapher bleibt als „Buch des Lebens“ stehen.
  alternative: „Buch der Lebenden“ beziehungsweise ein Verzeichnis der Lebenden
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob zeitliches Leben, Zugehörigkeit zum Gottesvolk oder endgültiges Heil gemeint ist. Die Übersetzung entscheidet diese Spannung nicht.
- issue: Aussagekraft der Verwünschung
  choice: 'Die Verbformen werden als Bitte beziehungsweise Wunsch wiedergegeben: „Sie sollen …“.'
  alternative: 'Eine Vorhersage: „Sie werden …“'
  rationale: Im Kontext der aufeinanderfolgenden Verwünschungen sind die Formen jussivisch und nicht als bloße Zukunftsaussage zu verstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und das Bild eines göttlichen Registers bleiben erhalten; „getilgt“ und „eingeschrieben“ greifen bewusst das Schriftmotiv auf.
