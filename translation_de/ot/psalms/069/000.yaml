  text: לַ/מְנַצֵּ֬חַ עַֽל שׁוֹשַׁנִּ֬ים לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/000.yaml
  text: 'For the choirmaster: according to Lilies[a]. Of David[b].'
translation:
  language: de
  text: Für den Chormeister. Nach »Lilien«[a]. Von David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »nach der Melodie ›Lilien‹«; die Wendung bezeichnet wohl eine Melodie oder musikalische Vortragsweise.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische »von David« kann Urheberschaft, Widmung oder eine andere Zuordnung zu David bezeichnen; die Formulierung allein entscheidet diese Frage nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chormeister
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich eine musikalische oder liturgische Anweisung an den Leiter der Aufführung. »Chormeister« ist knapp, verständlich und wahrt diese Funktion.
- source_word: עַל
  choice: Nach
  rationale: In musikalischen Überschriften kann עַל eine Melodie, Vortragsweise oder sonstige musikalische Vorgabe einführen. »Nach« lässt diese Beziehung bewusst offen.
- source_word: שׁוֹשַׁנִּים
  choice: »Lilien«
  rationale: Das Wort bedeutet wörtlich »Lilien«, wird hier aber wahrscheinlich als Name einer Melodie oder musikalischen Weise gebraucht. Anführungszeichen kennzeichnen den vermutlichen Titelcharakter, ohne ihn als sicher auszugeben.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Verbindung mit לְ kann in Psalmüberschriften Urheberschaft, Zuordnung oder Widmung ausdrücken. »Von David« ist im Deutschen natürlich, während die Fußnote die weiter reichende hebräische Mehrdeutigkeit offenlegt.
theological_decisions:
- issue: Bedeutung der Zuordnung לְדָוִד
  choice: Von David
  alternative: Für David / David zugehörig
  rationale: Der Haupttext folgt der geläufigen und knappen deutschen Überschriftenform, legt aber wegen der semantischen Breite der hebräischen Präposition keine ausschließliche Autorschaftsdeutung fest; diese Spannung wird in der Fußnote benannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Form einer Psalmüberschrift bleibt erhalten. Die wahrscheinlich titelartige musikalische Angabe steht in deutschen Anführungszeichen; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten bewahrt.
