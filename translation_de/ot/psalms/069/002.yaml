source:
  edition: WLC
  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: de
  text: Ich bin in tiefen Schlamm gesunken, wo es keinen festen Grund gibt; ich bin in tiefe Wasser geraten, und die Flut hat mich überspült.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: Ich bin … gesunken
  rationale: Das Qal Perfekt 1. Person Singular beschreibt den eingetretenen Zustand; das deutsche Perfekt gibt diesen resultativen Sinn natürlich wieder.
- source_word: בִּיוֵן מְצוּלָה
  choice: in tiefen Schlamm
  rationale: יוֵן bezeichnet Schlamm oder Morast, מְצוּלָה eine Tiefe beziehungsweise tiefe Stelle. Die Wiedergabe bewahrt sowohl das Material als auch die Tiefendimension.
- source_word: וְאֵין מָעֳמָד
  choice: wo es keinen festen Grund gibt
  rationale: מָעֳמָד bezeichnet einen Ort oder Halt zum Stehen. „Keinen festen Grund“ ist im Deutschen anschaulich und passt zum Bild des Versinkens im Schlamm.
- source_word: בָּאתִי
  choice: ich bin … geraten
  rationale: Das Qal Perfekt von בוא bedeutet wörtlich „ich bin gekommen“. In Verbindung mit gefährlichen tiefen Wassern gibt „geraten“ die Bewegung in die Notlage idiomatisch wieder, ohne das Bild aufzulösen.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: in tiefe Wasser
  rationale: Die Wendung bezeichnet die Tiefen des Wassers beziehungsweise tiefe Wasser; mit dem Bewegungsverb ist „in tiefe Wasser“ natürliches Deutsch.
- source_word: שִׁבֹּלֶת
  choice: die Flut
  rationale: Das Wort kann eine Strömung, einen Strom oder eine Flut bezeichnen. Im Zusammenhang mit den überwältigenden Wassern bringt „Flut“ die gefährliche Kraft prägnant zum Ausdruck.
- source_word: שְׁטָפָתְנִי
  choice: hat mich überspült
  rationale: שטף bezeichnet Überfluten, Überspülen oder Fortreißen. „Überspült“ hält das konkrete Wasserbild fest und lässt offen, ob ein Fortreißen mitgemeint ist.
