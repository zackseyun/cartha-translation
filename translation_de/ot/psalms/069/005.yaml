id: PSA.69.5
reference: Psalms 69:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: de
  text: Gott, du kennst meine Torheit, und meine Verfehlungen sind dir nicht verborgen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Direkte Anrede Gottes im Gebet; im modernen Deutschen ist „Gott“ ohne zusätzliches „O“ natürlich und würdig.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen hebt den Angeredeten hervor; „du“ bewahrt diese Betonung.
- source_word: יָדַעְתָּ
  choice: kennst
  rationale: Das Qal-Perfekt bezeichnet hier einen gegenwärtigen Wissenszustand; das deutsche Präsens gibt diesen stativen Sinn natürlich wieder.
- source_word: לְאִוַּלְתִּי
  choice: meine Torheit
  rationale: Der Ausdruck bezeichnet schuldhafte Torheit, nicht bloß mangelnde Intelligenz. „Torheit“ ist prägnant, verständlich und dem poetischen Register angemessen.
- source_word: וְאַשְׁמוֹתַי
  choice: meine Verfehlungen
  rationale: Der hebräische Plural bezeichnet hier konkrete schuldhafte Taten oder Verschuldungen. Der deutsche Plural bewahrt diese Form und vermeidet die unnatürliche Wiedergabe „meine Schulden“.
- source_word: מִמְּךָ
  choice: dir
  rationale: Im Deutschen verlangt die idiomatische Verbindung „jemandem nicht verborgen sein“ den Dativ; sie gibt das hebräische „vor/von dir verborgen“ sinngemäß und knapp wieder.
- source_word: לֹא נִכְחָדוּ
  choice: sind nicht verborgen
  rationale: Das Nifal-Perfekt im Plural beschreibt, dass die Verfehlungen Gottes Kenntnis nicht entzogen sind. Der deutsche Plural stimmt mit „Verfehlungen“ überein.
theological_decisions:
- issue: Das Sündenbekenntnis des Sprechers in einem Psalm, der später im Neuen Testament messianisch aufgegriffen wird
  choice: Der Vers bleibt als persönliches Eingeständnis von Torheit und Verfehlungen formuliert.
  alternative: Die Aussage ausdrücklich nur korporativ oder stellvertretend deuten.
  rationale: Der hebräische Text spricht eindeutig in der ersten Person. Die Übersetzung bewahrt diese Stimme und die daraus entstehende theologische Spannung, ohne sie durch eine spätere Harmonisierung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Torheit“ erhält den weisheitlich-moralischen Klang; „Verfehlungen“ bewahrt den konkreten hebräischen Plural.
