  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: de
  text: Füge Schuld zu ihrer Schuld hinzu[a], und lass sie nicht zu deiner Gerechtigkeit gelangen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann Verfehlung, Schuld oder die Folge der Schuld bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und lass sie nicht in deine Gerechtigkeit eingehen.“ Gottes „Gerechtigkeit“ kann hier auch sein gerechtes oder rettendes Handeln bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: Füge … hinzu
  rationale: Der Imperativ von נתן bedeutet wörtlich „gib/setze“. In der Verbindung עָוֺן עַל עֲוֺנָם gibt „füge … hinzu“ den kumulativen Sinn im Deutschen natürlich wieder.
- source_word: עָוֺן / עֲוֺנָם
  choice: Schuld / ihrer Schuld
  rationale: עָוֺן kann Verfehlung, Schuld oder deren Folge bezeichnen. „Schuld“ wahrt diese Bedeutungsbreite besser als eine Festlegung auf „Strafe“ und erhält die Wiederholung.
- source_word: עַל
  choice: zu
  rationale: Wörtlich „auf/über“; die deutsche Verbindung „etwas zu etwas hinzufügen“ entspricht hier idiomatisch der hebräischen Konstruktion.
- source_word: וְאַל יָבֹאוּ
  choice: und lass sie nicht … gelangen
  rationale: אַל mit Imperfekt drückt einen negativen Wunsch beziehungsweise Jussiv aus. „Lass sie nicht“ macht deutlich, dass die Bitte an Gott gerichtet ist; „gelangen“ bewahrt die Bewegungsmetapher von בוא.
- source_word: בְּצִדְקָתֶךָ
  choice: zu deiner Gerechtigkeit
  rationale: צְדָקָה umfasst Gerechtigkeit sowie Gottes gerechtes, rettendes oder Recht schaffendes Handeln. „Gerechtigkeit“ bewahrt diese theologische Spannung.
theological_decisions:
- issue: Bedeutung von „deiner Gerechtigkeit“ im Fluchgebet
  choice: deiner Gerechtigkeit
  alternative: deinem Recht schaffenden Handeln; deiner rettenden Gerechtigkeit
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob Gottes Gerechtigkeit als Eigenschaft, gerechtes Handeln, Rechtfertigung oder rettende Zuwendung gemeint ist. Die Hauptfassung hält diese Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung „Schuld zu ihrer Schuld“ wird beibehalten; die schwierige Wendung „zu deiner Gerechtigkeit gelangen“ wahrt bewusst die Bildsprache und theologische Offenheit des Hebräischen.
