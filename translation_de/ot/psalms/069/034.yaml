  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: de
  text: Ihn sollen Himmel[b] und Erde loben[a], die Meere und alles, was sich in ihnen regt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Himmel und Erde werden ihn loben.“ Die hebräische Verbform kann hier als Aufforderung oder als zukünftige Aussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das Hebräische verwendet hier einen Plural („Himmel“). Im Deutschen steht in der festen Paarformel „Himmel und Erde“ gewöhnlich der Singular.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „alles, was in ihnen kriecht“ beziehungsweise „wimmelt“. Das hebräische Wort kann Lebewesen bezeichnen, die sich bewegen, kriechen oder in großer Zahl auftreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: Ihn sollen … loben
  rationale: Das Piel-Imperfekt mit Objektsuffix kann hier als auffordernder Jussiv verstanden werden. Die Formulierung gibt den Aufruf wieder und bewahrt durch die Voranstellung von „Ihn“ den hebräischen Satzauftakt mit dem ausdrücklichen Objekt.
- source_word: שָׁמַיִם
  choice: Himmel
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, bezeichnet sie häufig kollektiv den Himmel. Im Deutschen ist „Himmel und Erde“ die natürliche, umfassende Paarformel.
- source_word: וָאָרֶץ
  choice: und Erde
  rationale: „Erde“ bezeichnet hier im Zusammenhang mit Himmel und Meeren die gesamte geschaffene Welt, nicht ein bestimmtes Land.
- source_word: יַמִּים
  choice: die Meere
  rationale: Der Plural wird direkt und idiomatisch mit „die Meere“ wiedergegeben.
- source_word: וְכָל רֹמֵשׂ
  choice: und alles, was sich regt
  rationale: Das Partizip von רמש kann sich auf Lebewesen beziehen, die sich bewegen, kriechen oder wimmeln. „Alles, was sich regt“ ist im Deutschen umfassend und passt zum Lebensraum der Meere.
- source_word: בָּם
  choice: in ihnen
  rationale: Das maskuline Pluralsuffix verweist am natürlichsten auf die zuvor genannten Meere; die pronominale Verknüpfung bleibt erhalten.
theological_decisions:
- issue: Aussageweise des Lobaufrufs an die Schöpfung
  choice: 'Aufforderung: „sollen … loben“'
  alternative: 'Vorhersage: „werden ihn loben“'
  rationale: Das hebräische Imperfekt lässt sich hier im poetischen Zusammenhang am besten jussiv als Aufruf verstehen. Die alternative futurische Aussage bleibt in einer Fußnote sichtbar, sodass die grammatische Spannung nicht aufgelöst wird.
- issue: Umfang der zum Lob aufgerufenen Schöpfung
  choice: Himmel, Erde, Meere und alle sich darin regenden Lebewesen
  alternative: Eine engere Beschränkung von רֹמֵשׂ auf kriechende oder wimmelnde Tiere
  rationale: Die Aufzählung umfasst poetisch die geschaffene Welt. Die breite Wiedergabe von רֹמֵשׂ vermeidet eine unbegründete Eingrenzung auf einzelne Tierarten.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die Voranstellung „Ihn sollen … loben“ bewahrt den emphatischen Beginn und bleibt zugleich verständlich. „Sich regen“ ist leicht gehoben, aber im poetischen Kontext geläufig und semantisch weit genug.
