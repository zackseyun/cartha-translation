source:
  edition: WLC
  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: de
  text: Antworte mir, Jahwe, denn deine beständige Liebe ist gut. Entsprechend deinem reichen Erbarmen wende dich mir zu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Antworte mir
  rationale: Der Imperativ von ענה bittet im Gebetszusammenhang um Gottes Antwort. „Antworte mir“ gibt den unmittelbaren persönlichen Ruf natürlich und quellennah wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Tetragramms als Eigenname bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי טוֹב חַסְדֶּךָ
  choice: denn deine beständige Liebe ist gut
  rationale: כִּי begründet die Bitte; טוֹב bleibt als „gut“ erhalten. „Beständige Liebe“ bringt bei חֶסֶד sowohl liebevolle Zuwendung als auch verlässliche Treue zum Ausdruck, ohne den Begriff auf eine einzige theologische Nuance einzuengen.
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: in deinem großen Erbarmen
  rationale: כְּרֹב bezeichnet den Maßstab beziehungsweise die große Fülle; רַחֲמִים meint tiefes, barmherziges Mitgefühl. Die idiomatische deutsche Wendung wahrt den Sinn, auch wenn der hebräische Ausdruck formal im Plural steht.
- source_word: פְּנֵה אֵלָי
  choice: Wende dich mir zu
  rationale: פנה mit אֶל bezeichnet das Sich-Hinwenden zu einer Person. „Wende dich mir zu“ bewahrt sowohl die räumliche Bildhaftigkeit als auch den relationalen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn sichtbar, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Güte
  rationale: „Beständige Liebe“ hält Zuneigung und verlässliche Treue zusammen. „Güte“ wäre knapper und idiomatischer, würde aber den Aspekt der dauerhaften Verbundenheit weniger deutlich ausdrücken.
translation_notes:
  register: Moderne, würdige Gebetssprache mit direkter Anrede. Die Satzfolge bleibt knapp und parallel zur hebräischen Bitte; „in deinem großen Erbarmen“ ist bewusst idiomatischer als eine sperrige formale Wiedergabe wie „nach der Fülle deiner Erbarmungen“.
