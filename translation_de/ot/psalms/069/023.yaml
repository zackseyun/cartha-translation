base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/023.yaml
  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: de
  text: Lass ihre Augen finster werden, sodass sie nicht sehen können,[a] und lass ihre Lenden unaufhörlich wanken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: vom Sehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: ihre Lenden ständig taumeln lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: Lass … finster werden
  rationale: Die Jussivform steht im Kontext eines Gerichtsgebets. Die Formulierung gibt sowohl den Wunschcharakter als auch den eintretenden Zustand natürlich wieder.
- source_word: עֵינֵיהֶם
  choice: ihre Augen
  rationale: Die wörtliche Wiedergabe bewahrt das körperliche Bild des hebräischen Textes.
- source_word: מֵרְאוֹת
  choice: sodass sie nicht sehen können
  rationale: Die Verbindung von מִן mit dem Infinitiv von ראה bezeichnet hier eine Verhinderung beziehungsweise Unfähigkeit. Die deutsche Zweck- oder Folgekonstruktion gibt den Sinn idiomatisch wieder.
- source_word: וּמָתְנֵיהֶם
  choice: und … ihre Hüften
  rationale: מָתְנַיִם bezeichnet die Hüft- beziehungsweise Lendengegend. „Hüften“ ist im heutigen Deutsch verständlich und bewahrt die körperliche Bildsprache.
- source_word: תָּמִיד
  choice: unaufhörlich
  rationale: Das Adverb bezeichnet eine fortdauernde Wirkung; „unaufhörlich“ passt zum gehobenen poetischen Register.
- source_word: הַמְעַד
  choice: lass … wanken
  rationale: 'Der Hifil-Imperativ von מעד hat kausative Bedeutung: Gott soll ihre körperliche Standfestigkeit ins Wanken bringen. Die Formulierung bleibt nah am Bild, ohne es als bloßes Zittern zu verengen.'
theological_decisions:
- issue: Verwünschender beziehungsweise bittender Charakter des Verses
  choice: 'Als an Gott gerichtete Bitte um Gericht wiedergegeben: „Lass …“'
  alternative: 'Als Vorhersage wiedergeben: „Ihre Augen werden finster werden …“'
  rationale: Die Verbformen erfüllen im Zusammenhang die Funktion einer Gerichtsbitte und nicht lediglich die einer Zukunftsaussage.
- issue: Körperliche Bildsprache der zweiten Vershälfte
  choice: Das Wanken der Hüften beibehalten
  alternative: Die Aussage deutend als allgemeine Schwäche oder Angst wiedergeben
  rationale: Der hebräische Text lässt offen, ob körperliche Schwäche, Furcht oder allgemeiner Verlust der Standfestigkeit im Vordergrund steht. Das konkrete Bild bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Körperbildsprache. Die doppelte Formulierung „Lass …“ macht den Gebetscharakter klar; „Hüften“ ist gegenwärtiger als „Lenden“, während die Fußnote die traditionellere Alternative dokumentiert.
