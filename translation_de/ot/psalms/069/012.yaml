  text: יָשִׂ֣יחוּ בִ֭/י יֹ֣שְׁבֵי שָׁ֑עַר וּ֝/נְגִינ֗וֹת שׁוֹתֵ֥י שֵׁכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/012.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: de
  text: Über mich reden die, die am Stadttor sitzen,[a] und ich bin das Lied derer, die Rauschtrank trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Stadttor war in einer antiken Stadt ein öffentlicher Ort des gesellschaftlichen Lebens, des Handels und der Rechtsprechung. Gemeint sind daher wohl einflussreiche Bürger, die öffentlich über den Beter reden, nicht bloß Torwächter.
    reason: cultural_note
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: Über mich reden
  rationale: שׂיח bezeichnet hier im feindseligen gesellschaftlichen Zusammenhang ein Reden oder Sich-Unterhalten; בִי markiert das Thema. „Über mich reden“ wahrt dies, ohne die Feindseligkeit ausdrücklich in die Präposition hineinzulesen.
- source_word: יֹשְׁבֵי שָׁעַר
  choice: die, die am Stadttor sitzen
  rationale: Die Formulierung bewahrt das hebräische Bild. Das Stadttor war zugleich öffentlicher Versammlungs-, Geschäfts- und Rechtsort; eine Einschränkung auf Torwächter oder Älteste wäre zu eng.
- source_word: וּנְגִינוֹת
  choice: und ich bin das Spottlied
  rationale: Das Nomen bezeichnet Lieder bzw. Musikstücke. Im Parallelismus ist erschlossen, dass der Beter zum Gegenstand ihres Singens geworden ist. „Spottlied“ macht den durch den Klagekontext nahegelegten Hohn verständlich, wird aber als kontextuelle Deutung kenntlich gemacht.
- source_word: שׁוֹתֵי שֵׁכָר
  choice: der Zecher
  rationale: שֵׁכָר ist ein berauschendes Getränk, gewöhnlich nicht Wein. „Zecher“ gibt die trinkende, spöttische Gruppe natürlich und knapp wieder, ohne zwingend eine dauerhafte Trunksucht zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stadttor“ verdeutlicht den antiken öffentlichen Ort; „Zecher“ ist knapp und literarisch, aber weiterhin allgemein verständlich. Die kontextuelle Zuspitzung „Spottlied“ wird durch eine Fußnote transparent gemacht.
