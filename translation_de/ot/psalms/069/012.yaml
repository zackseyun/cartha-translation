  terminology: „Stadttor“ ist angemessen. „Lied“ gibt die im Deutschen idiomatisch als kollektiver Ausdruck verwendete Aussage wieder, dass der Beter zum Thema ihres Singens geworden ist, ohne den Hohn ausdrücklich zu behaupten. Die kulturelle Erläuterung ist als wahrscheinlichkeitsmarkierte Kontextinformation zulässig.
