  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: de
  text: 'Meinen Brüdern bin ich fremd geworden[a],

    den Söhnen meiner Mutter ein Fremder.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meinen Brüdern war ich fremd“ beziehungsweise „Meinen Brüdern wurde ich fremd“. Das hebräische Verb kann einen vergangenen Zustand oder das Eintreten dieses Zustands ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Die Söhne meiner Mutter“ bezeichnet hier enge männliche Familienangehörige, besonders Brüder.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: fremd
  rationale: Das Partizip aus זוּר bezeichnet hier den Zustand der Entfremdung. „Fremd“ bildet mit „ein Unbekannter“ eine natürliche poetische Parallele.
- source_word: הָיִיתִי
  choice: bin ich … geworden
  rationale: Das Qatal von היה lässt sich als entstandener, bis in die Gegenwart reichender Zustand verstehen. Die Formulierung wahrt die mögliche ingressive Bedeutung.
- source_word: לְאֶחָי
  choice: meinen Brüdern
  rationale: Die ausdrücklich maskuline Verwandtschaftsbezeichnung wird beibehalten; der hebräische relationale Gebrauch der Präposition לְ wird im Deutschen durch den Dativ wiedergegeben.
- source_word: וְנָכְרִי
  choice: ein Unbekannter
  rationale: נָכְרִי bezeichnet einen Fremden beziehungsweise jemanden, der nicht als zugehörig gilt. „Ein Unbekannter“ vermeidet hier die primär nationale Bedeutung von „Ausländer“ und bringt die familiäre Entfremdung klar zum Ausdruck.
- source_word: לִבְנֵי אִמִּי
  choice: für die Söhne meiner Mutter
  rationale: Die wörtliche Verwandtschaftsformel und der poetische Parallelismus werden bewahrt. „Für“ gibt die relationale Bedeutung der Präposition לְ im natürlichen Deutschen wieder.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnungen
  choice: „Brüder“ und „Söhne meiner Mutter“ im Haupttext beibehalten
  alternative: „Geschwister“ beziehungsweise „Familie“
  rationale: Der hebräische Text verwendet ausdrücklich maskuline Verwandtschaftsbegriffe in parallelen Verszeilen. Eine Verallgemeinerung würde diese sprachliche Gestalt ohne zwingenden Kontextgrund verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener zweizeiliger Parallelstruktur. Die ungewöhnliche, aber verständliche Wendung „Söhne meiner Mutter“ bewahrt das konkrete hebräische Bild; „ein Unbekannter“ stellt die soziale und familiäre Entfremdung heraus.
