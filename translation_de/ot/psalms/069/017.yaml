  text: וְ/אַל תַּסְתֵּ֣ר פָּ֭נֶי/ךָ מֵֽ/עַבְדֶּ֑/ךָ כִּֽי צַר לִ֝֗/י מַהֵ֥ר עֲנֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: de
  text: Und verbirg dein Angesicht[a] nicht vor deinem Diener[b], denn ich bin in Not; antworte mir schnell!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „deine Gegenwart“. Wörtlich steht im Hebräischen „dein Angesicht“, eine häufige bildhafte Wendung für Zuwendung oder aufmerksame Gegenwart.
    reason: lexical_alternative
  - marker: b
    text: Oder „deinem Sklaven“. Das hebräische Wort kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל
  choice: Und … nicht
  rationale: וְ verbindet die Bitte mit den vorausgehenden Bitten; אַל mit dem Imperfekt drückt hier eine dringende verneinte Aufforderung aus.
- source_word: תַּסְתֵּר פָּנֶיךָ
  choice: verbirg dein Angesicht
  rationale: Die konkrete hebräische Metapher wird bewahrt. „Angesicht verbergen“ bezeichnet, dass Gott seine Zuwendung oder aufmerksame Gegenwart entzieht.
- source_word: מֵעַבְדֶּךָ
  choice: vor deinem Diener
  rationale: עֶבֶד kann einen Diener oder Sklaven bezeichnen. In dieser Gebetssprache steht die demütige Zugehörigkeit zu Gott im Vordergrund; deshalb ist „Diener“ kontextuell angemessen.
- source_word: כִּי צַר לִי
  choice: denn mir ist angst
  rationale: Die knappe Zustandsaussage beschreibt akute Bedrängnis. Die feste deutsche Wendung „mir ist angst“ gibt sowohl Not als auch innere Beklemmung prägnant wieder.
- source_word: מַהֵר עֲנֵנִי
  choice: antworte mir schnell
  rationale: מַהֵר vermittelt Dringlichkeit, während ענה im Gebetskontext gewöhnlich „antworten“ bedeutet. Die deutsche Wortfolge klingt natürlich und bewahrt den Nachdruck.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Angesicht
  choice: „dein Angesicht“ im Haupttext beibehalten
  alternative: „deine Gegenwart“ oder „deine Zuwendung“
  rationale: Das Bild trägt die Vorstellung von Gottes Aufmerksamkeit, Gunst und relationaler Nähe, ohne diese auf nur einen abstrakten Begriff festzulegen.
- issue: Bedeutungsumfang von עֶבֶד in der Beziehung zu Gott
  choice: „Diener“
  alternative: „Sklave“
  rationale: Das Wort umfasst beide Bedeutungen. Hier betont die Gebetssprache vor allem demütige Zugehörigkeit und Dienst; die rechtliche Dimension der Versklavung steht nicht erkennbar im Zentrum.
translation_notes:
  register: Moderne, würdige Gebetssprache mit bewahrter hebräischer Bildlichkeit. „Mir ist angst“ ist bewusst kleingeschrieben, da „angst“ hier Teil der festen verbalen Wendung ist. Der Schluss erhält durch das Ausrufezeichen die Dringlichkeit des hebräischen Imperativs.
