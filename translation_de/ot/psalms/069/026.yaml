  text: כִּֽי אַתָּ֣ה אֲשֶׁר הִכִּ֣יתָ רָדָ֑פוּ וְ/אֶל מַכְא֖וֹב חֲלָלֶ֣י/ךָ יְסַפֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/026.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: de
  text: Denn sie verfolgen den, den du geschlagen hast, und erzählen vom Schmerz deiner Verwundeten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deiner Erschlagenen“ oder „deiner Durchbohrten“. Das hebräische Wort kann Verwundete, Durchbohrte oder Erschlagene bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte um Gericht ein und bewahrt den kausalen Zusammenhang.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: den, den du geschlagen hast
  rationale: Gibt den singularischen Bezug und Gottes Handeln direkt wieder; das im Hebräischen vorausgestellte אַתָּה wird im Deutschen durch das ausdrückliche „du“ angemessen vertreten.
- source_word: רָדָפוּ
  choice: sie verfolgen
  rationale: רדף bezeichnet feindliches Nachsetzen oder Verfolgen; „verfolgen“ wahrt hier sowohl die konkrete als auch die feindselige Bedeutung.
- source_word: וְאֶל מַכְאוֹב
  choice: und erzählen vom Schmerz
  rationale: אֶל führt hier idiomatisch den Gegenstand des Redens ein. „Vom Schmerz erzählen“ ist natürliches Deutsch und erhält מַכְאוֹב als „Schmerz“.
- source_word: חֲלָלֶיךָ
  choice: deiner Verwundeten
  rationale: Das Wort kann Verwundete, Durchbohrte oder Erschlagene bezeichnen. „Verwundete“ passt unmittelbar zu ihrem Schmerz, ohne die lexikalischen Alternativen in der Fußnote zu verschweigen.
- source_word: יְסַפֵּרוּ
  choice: erzählen
  rationale: Das Piel von ספר bedeutet erzählen oder berichten. Die schlichte Wiedergabe lässt offen, ob das Reden höhnisch, ausbeuterisch oder lediglich berichtend gemeint ist.
theological_decisions:
- issue: Ob חֲלָלֶיךָ lebende Verwundete oder Erschlagene bezeichnet
  choice: deiner Verwundeten
  alternative: deiner Erschlagenen; deiner Durchbohrten
  rationale: Die Verbindung mit „Schmerz“ legt Verwundete nahe, doch die Form kann auch Erschlagene bezeichnen. Diese Spannung wird durch eine Fußnote erhalten, statt im Haupttext dogmatisch entschieden zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „den, den“ ist im Deutschen verständlich und bewahrt den singularischen Bezug des Hebräischen. Der Vers bleibt poetisch knapp; die mögliche feindselige Färbung von „erzählen“ wird nicht überexpliziert.
