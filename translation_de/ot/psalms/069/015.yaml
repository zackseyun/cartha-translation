translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Bildhaftigkeit. Die dreifache Bitte mit »nicht« bleibt erhalten; das hebräische Brunnenbild wird im Haupttext bewahrt und die kontextuell mögliche Wiedergabe »Grube« in einer Fußnote genannt.
