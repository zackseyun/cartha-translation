  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: de
  text: Lass nicht zu, dass die Wasserflut mich fortreißt[a], dass die Tiefe mich verschlingt und dass der Brunnen seinen Mund über mir schließt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wasserstrom«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Grube«. Das hebräische Wort bedeutet gewöhnlich »Brunnen«, kann im poetischen Zusammenhang aber eine tödliche Grube bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: fortreißen
  rationale: Das Verb שטף bezeichnet hier das überwältigende Mitreißen durch strömendes Wasser; »fortreißen« gibt die bedrohliche Bewegung im heutigen Deutsch natürlich wieder.
- source_word: שִׁבֹּלֶת מַיִם
  choice: Wasserflut
  rationale: Die Wortgruppe bezeichnet eine starke Strömung oder Flut. »Wasserflut« bewahrt die poetische Intensität, ohne die mögliche Bedeutung »Wasserstrom« auszuschließen.
- source_word: תִּבְלָעֵנִי
  choice: verschlingen
  rationale: בלע bedeutet wörtlich »verschlingen« und erhält die Personifikation der Tiefe.
- source_word: מְצוּלָה
  choice: Tiefe
  rationale: Das Substantiv bezeichnet die Wassertiefe bzw. tiefe Gewässer. »Tiefe« ist knapp, poetisch und passt zum vorausgehenden Wasserbild.
- source_word: תֶּאְטַר
  choice: schließen
  rationale: Das seltene Verb bezeichnet das Verschließen oder Zuschnüren; mit »Mund« ist »schließen« im Deutschen idiomatisch.
- source_word: בְּאֵר
  choice: Brunnen
  rationale: בְּאֵר bedeutet gewöhnlich »Brunnen«. Die Übersetzung bewahrt diese konkrete lexikalische Bedeutung und die Verbindung von Wasser- und Todesgefahr; »Grube« ist aufgrund des poetischen Zusammenhangs ebenfalls möglich.
- source_word: פִּיהָ
  choice: seinen Mund
  rationale: Der Brunnen wird personifiziert. Im Deutschen richtet sich das Possessivpronomen grammatisch nach dem maskulinen »Brunnen«.
- source_word: עָלַי
  choice: über mir
  rationale: Die Präposition beschreibt anschaulich, wie sich die Öffnung oberhalb des Eingeschlossenen schließt.
