id: PSA.96.10
reference: Psalms 96:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: de
  text: 'Sagt unter den Nationen: »Jahwe regiert![a] Ja, die Welt[b] steht fest; sie wird nicht wanken. Er wird die Völker gerecht richten.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Jahwe ist König« oder: »Jahwe ist König geworden.« Das Hebräische kann als Ausrufung seiner gegenwärtigen Königsherrschaft oder seiner Thronbesteigung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »die bewohnte Welt«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »mit Geradheit«; auch: »mit Rechtschaffenheit« oder »mit Gerechtigkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Sagt
  rationale: Der Pluralimperativ von אמר fordert die Angesprochenen unmittelbar dazu auf, die folgende Botschaft auszusprechen.
- source_word: בַגּוֹיִם
  choice: unter den Nationen
  rationale: Die Präposition ב bezeichnet hier den Bereich, in dem die Botschaft verkündet werden soll; גּוֹיִם wahrt den internationalen Horizont.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מָלָךְ
  choice: regiert
  rationale: Das Qatal kann in diesem Thronbesteigungspsalm als gegenwärtige, feierliche Ausrufung der Königsherrschaft verstanden werden. Die möglichen Nuancen werden in der Fußnote offengehalten.
- source_word: אַף
  choice: Ja
  rationale: Die Partikel bekräftigt die folgende Aussage und verbindet die feste Weltordnung mit Jahwes Herrschaft.
- source_word: תִּכּוֹן
  choice: steht fest
  rationale: Das Nifal von כון bezeichnet einen gefestigten, beständigen Zustand; die deutsche Wendung ist natürlich und bewahrt den resultativen Sinn.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל bezeichnet häufig die Welt als bewohnten und geordneten Lebensraum; „Welt“ ist im Haupttext knapp und idiomatisch.
- source_word: בַּל תִּמּוֹט
  choice: sie wird nicht wanken
  rationale: מוֹט bezeichnet das Schwanken oder den Verlust festen Standes; בַּל verneint dies in gehobener poetischer Sprache.
- source_word: יָדִין
  choice: Er wird … richten
  rationale: דין trägt hier im Rahmen göttlicher Königsherrschaft einen richterlichen Sinn; die Verbform wird zukunftsbezogen wiedergegeben.
- source_word: עַמִּים
  choice: die Völker
  rationale: Die Wiedergabe erhält den kollektiven Plural und unterscheidet das Wort im Deutschen angemessen von den zuvor genannten Nationen.
- source_word: בְּמֵישָׁרִים
  choice: gerecht
  rationale: מֵישָׁרִים bezeichnet Geradheit, Rechtschaffenheit und gerechtes Handeln; adverbiales „gerecht“ ist in Verbindung mit „richten“ natürlich und präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Aspekt und Bedeutung von מָלָךְ in der Thronbesteigungsproklamation
  choice: Jahwe regiert
  alternative: Jahwe ist König; Jahwe ist König geworden
  rationale: Die Form kann eine gegenwärtige Königsherrschaft oder eine Thronbesteigungsproklamation ausdrücken. Der Haupttext gibt die gebräuchliche präsentische Aussage wieder; die Fußnote bewahrt die echte Mehrdeutigkeit und vermeidet eine Festlegung darauf, wann Jahwes Königtum begonnen habe.
translation_notes:
  register: Moderne, würdige Psalmsprache mit kurzen, öffentlich ausrufbaren Sätzen. „Unter den Nationen“ bewahrt den räumlich-sozialen Sinn der Präposition; „steht fest“ und „wanken“ erhalten das poetische Bild der Stabilität. Die Fußnoten stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
