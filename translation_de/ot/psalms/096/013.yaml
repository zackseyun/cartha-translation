id: PSA.96.13
reference: Psalms 96:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: de
  text: vor Jahwe, denn er kommt, denn er kommt[a], um die Erde zu richten. Er wird den Erdkreis in Gerechtigkeit richten und die Völker[b] in seiner Treue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wiederholung „denn er kommt“ verstärkt im Hebräischen die Gewissheit und Eindringlichkeit der Ankündigung.
    reason: poetic_emphasis
  - marker: b
    text: 'Oder: „die Nationen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in seiner Wahrheit“. Das hebräische Wort kann Treue, Verlässlichkeit und Wahrheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: vor
  rationale: Die feste Verbindung mit פָּנִים bedeutet hier idiomatisch „vor“ beziehungsweise „in der Gegenwart von“. „Vor“ ist knapp, natürlich und bewahrt den räumlich-relationalen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי בָא ... כִּי בָא
  choice: denn er kommt, denn er kommt
  rationale: Das zweimalige בָא kündigt Jahwes Kommen eindringlich und als gewiss an. Das deutsche Präsens gibt diese lebendige Erwartung natürlich wieder; die Wiederholung bleibt als poetische Verstärkung erhalten.
- source_word: לִשְׁפֹּט / יִשְׁפֹּט
  choice: zu richten / wird richten
  rationale: שׁפט kann auch das Regieren bezeichnen, doch die Verbindung mit Gerechtigkeit und Treue hebt hier besonders das richterliche Handeln hervor.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Parallelismus mit תֵּבֵל ist die ganze Erde gemeint, nicht nur ein bestimmtes Land.
- source_word: תֵּבֵל
  choice: der Erdkreis
  rationale: תֵּבֵל bezeichnet die bewohnte, geordnete Welt. „Erdkreis“ wahrt diese poetische Nuance und unterscheidet den Ausdruck von הָאָרֶץ.
- source_word: בְּצֶדֶק
  choice: in Gerechtigkeit
  rationale: Die Formulierung bezeichnet die Gerechtigkeit als bestimmende Art und Norm seines Richtens.
- source_word: וְעַמִּים
  choice: die Völker
  rationale: Der Plural עַמִּים meint die verschiedenen Völker der Menschheit; „Völker“ ist im Deutschen die direkte und natürliche Entsprechung.
- source_word: בֶּאֱמוּנָתוֹ
  choice: in seiner Treue
  rationale: אֱמוּנָה bezeichnet Festigkeit, Verlässlichkeit und Treue. Die Wiedergabe macht deutlich, dass Jahwes Richten seinem verlässlichen Wesen entspricht, ohne den möglichen Aspekt der Wahrheit auszuschließen.
theological_decisions:
- issue: Charakter des göttlichen Richtens
  choice: Die Gerichtssprache wird mit „richten“ bewahrt.
  alternative: „regieren“ oder „herrschen“
  rationale: Das Verb kann königliches Regieren einschließen, doch der unmittelbare Zusammenhang mit Gerechtigkeit und Treue verlangt, den richterlichen Sinn nicht abzuschwächen. Zugleich wird der Vers nicht über seinen Wortlaut hinaus zu einer ausgearbeiteten Lehre vom Endgericht erweitert.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm als persönlichen Gottesnamen. Die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Herrschaftstitel.
- issue: Verhältnis von Gerechtigkeit und Treue beim Gericht
  choice: Beide Begriffe werden als Maß und Wesensart seines Richtens beibehalten.
  alternative: Treue interpretierend auf bloße Unparteilichkeit oder ausschließlich auf Bundeshandeln festlegen
  rationale: Der Parallelismus verbindet Gottes Gericht mit צֶדֶק und אֱמוּנָה, legt aber nicht ausdrücklich fest, auf welchen einzelnen theologischen Aspekt seiner Treue der Schwerpunkt fällt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Wiederholung. „Erdkreis“ ist leicht gehoben, aber verständlich und bildet die Unterscheidung zwischen הָאָרֶץ und תֵּבֵל ab. Der Satz beginnt kleingeschrieben, weil „vor Jahwe“ syntaktisch an den vorausgehenden Vers anschließt.
