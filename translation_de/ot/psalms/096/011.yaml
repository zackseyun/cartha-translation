  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: de
  text: Der Himmel freue sich, und die Erde juble; das Meer donnere und alles, was in ihm ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: freue sich
  rationale: Der Qal-Imperfekt steht in der poetischen Aufforderungsfolge volitiv. „Sich freuen“ gibt שׂמח natürlich und würdig wieder.
- source_word: הַשָּׁמַיִם
  choice: der Himmel
  rationale: Das hebräische Pluralwort bezeichnet hier den Himmel als Teil der kosmischen Dreiergruppe Himmel, Erde und Meer; der deutsche Singular ist idiomatisch.
- source_word: וְתָגֵל
  choice: und die Erde juble
  rationale: גיל bezeichnet freudiges Jubeln. Die Wortwahl bewahrt gegenüber שׂמח die poetische Variation und die gesteigerte Freude.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im kosmischen Zusammenhang ist „Erde“ und nicht „Land“ gemeint.
- source_word: יִרְעַם
  choice: donnere
  rationale: רעם bedeutet „donnern“ beziehungsweise laut dröhnen. „Donnere“ erhält das kraftvolle Klangbild und die Personifikation des Meeres.
- source_word: הַיָּם
  choice: das Meer
  rationale: „Meer“ ist die natürliche und kontextgerechte Entsprechung von ים.
- source_word: וּמְלֹאוֹ
  choice: und alles, was es erfüllt
  rationale: Wörtlich „und seine Fülle“; gemeint ist alles, was das Meer enthält. Die Formulierung bleibt bildhaft und zugleich verständlich.
theological_decisions:
- issue: Volitive Bedeutung der poetischen Imperfektformen
  choice: 'Die Folge wird als Aufforderung wiedergegeben: „Der Himmel freue sich … das Meer donnere“.'
  alternative: 'Prädiktive Zukunft: „Der Himmel wird sich freuen … das Meer wird donnern“.'
  rationale: Im Zusammenhang der Aufforderung an die Schöpfung zum Lob haben die Imperfektformen jussivisch-volitive Kraft. Der deutsche Konjunktiv I bildet diese gehobene Aufforderung knapp ab, ohne sie als Vorhersage festzulegen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit gut verständlichem gehobenem Konjunktiv. Die poetische Dreiergruppe Himmel, Erde und Meer sowie die unterschiedlichen Verben der Freude bleiben erhalten.
