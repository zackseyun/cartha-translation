source:
  edition: WLC
  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: de
  text: Singt Yahweh, preist seinen Namen, verkündet[a] Tag für Tag seine Rettung!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verkündet Tag für Tag die gute Nachricht von seiner Rettung.“'
    reason: 'Lexikalische Alternative: בשר trägt häufig ausdrücklich die Bedeutung, eine gute Nachricht zu verkünden.'
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der Qal-Imperativ Plural fordert unmittelbar zum Singen auf; ein zusätzliches Objekt wie „Lob“ steht nicht ausdrücklich im Hebräischen.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Die Präposition ל kennzeichnet den Adressaten des Singens. Im Deutschen genügt bei „singen“ der Dativ; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: Der Piel-Imperativ von ברך bedeutet hier, auf Gott bezogen, ihn segnend zu rühmen. „Preist“ gibt diesen idiomatischen Sinn in heutigem Deutsch natürlicher wieder als „segnet“, ohne ihn mit dem vorhergehenden „Singt“ gleichzusetzen.
- source_word: שְׁמוֹ
  choice: seinen Namen
  rationale: Die hebräische Wendung wird bewahrt; „Name“ umfasst dabei auch Gottes offenbarte Identität und seinen Ruf.
- source_word: בַּשְּׂרוּ
  choice: Verkündet
  rationale: Der Piel-Imperativ von בשר bezeichnet das Verkünden einer guten Botschaft. „Verkündet“ ist im Haupttext knapp und würdig; die ausdrücklich positive Nuance wird in der Fußnote genannt.
- source_word: מִיּוֹם לְיוֹם
  choice: Tag für Tag
  rationale: Die deutsche Wendung gibt die fortlaufende tägliche Wiederholung des hebräischen Ausdrucks natürlich und prägnant wieder.
- source_word: יְשׁוּעָתוֹ
  choice: seine Rettung
  rationale: יְשׁוּעָה kann Rettung, Befreiung oder Heil bezeichnen. „Rettung“ ist verständlich, konkret und bewahrt die Breite des Ausdrucks besser als eine stärker kirchlich geprägte Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Yahweh“ lässt den offenbarten Bundesnamen als Namen erkennbar und folgt der für diese Ausgabe vorgegebenen Wiedergabe.
- issue: Bedeutungsbreite von יְשׁוּעָה
  choice: Rettung
  alternative: Heil; Befreiung; Sieg
  rationale: Der Kontext legt Gottes rettendes Handeln nahe, bestimmt aber nicht ausschließlich dessen geistliche, politische oder militärische Gestalt. „Rettung“ hält diese Breite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelen Imperativen. „Preist seinen Namen“ ist idiomatischer als das im heutigen Deutsch missverständliche „segnet seinen Namen“; „Tag für Tag“ bewahrt den poetischen Rhythmus.
