source:
  edition: WLC
  text: הִשְׁתַּחֲו֣וּ לַ֭/יהוָה בְּ/הַדְרַת קֹ֑דֶשׁ חִ֥ילוּ מִ֝/פָּנָ֗י/ו כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: de
  text: Betet Jahwe an in heiliger Pracht[a]; erbebt vor ihm, die ganze Erde!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in heiligem Schmuck“ beziehungsweise „in heiliger Festkleidung“. Die hebräische Wendung kann sowohl die der Heiligkeit eigene Pracht als auch heiligen Schmuck oder kultische Kleidung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: Betet … an
  rationale: Das Verb bezeichnet ein ehrfürchtiges Niederwerfen und damit kultische Anbetung. „Betet … an“ gibt den religiösen Sinn in natürlichem modernem Deutsch wieder, ohne die körperliche Gebärde ausdrücklich festzulegen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: in heiliger Pracht
  rationale: Die Wendung kann die Pracht der Heiligkeit oder heiligen Schmuck beziehungsweise Festkleidung bezeichnen. Die knappe poetische Formulierung wahrt diese Bedeutungsbreite; die konkrete Alternative steht in der Fußnote.
- source_word: חִילוּ
  choice: erbebt
  rationale: Das Verb bezeichnet Zittern oder heftige Erregung. „Erbebt“ vermittelt hier die ehrfürchtige Erschütterung vor Gottes Gegenwart und bewahrt den poetischen Ton.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die wörtliche Vorstellung „vor seinem Angesicht“ bezeichnet seine unmittelbare Gegenwart. „Vor ihm“ ist idiomatisch und prägnant.
- source_word: כָּל־הָאָרֶץ
  choice: die ganze Erde
  rationale: Der universale Aufruf des Psalms richtet sich an die gesamte Erde, nicht lediglich an ein einzelnes Land.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Übersetzung bewahrt den im Ausgangstext ausdrücklich gebrauchten persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von בְּהַדְרַת קֹדֶשׁ
  choice: in heiliger Pracht
  alternative: in heiligem Schmuck / in heiliger Festkleidung
  rationale: Die hebräische Fügung lässt offen, ob die Pracht der Heiligkeit selbst oder sakraler Schmuck beziehungsweise kultische Kleidung gemeint ist. Der Haupttext bleibt poetisch mehrdeutig, die konkrete Alternative wird angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Verdichtung. Der Parallelismus der beiden Aufforderungen bleibt erhalten; „erbebt“ wahrt die starke Bildsprache des Hebräischen.
