  text: כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד נוֹרָ֥א ה֝֗וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: de
  text: Denn Jahwe ist groß und überaus lobenswert; er ist mehr zu fürchten als alle Götter.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er ist zu fürchten mehr als alle Götter“; das hebräische Wort bezeichnet jemanden, der ehrfürchtige Furcht hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: „Götter“ bezeichnet hier die Gottheiten der Völker; der folgende Vers erklärt sie zu Nichtsen beziehungsweise Götzen.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung zum Lob und zur Anbetung ein.
- source_word: גָדוֹל
  choice: groß
  rationale: Bezeichnet Jahwes Größe an Rang und Majestät, ohne den Sinn auf Macht allein einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וּמְהֻלָּל מְאֹד
  choice: und überaus lobenswert
  rationale: Das passive Partizip mit dem verstärkenden Adverb wird im Deutschen idiomatisch als Anspruch auf höchstes Lob ausgedrückt.
- source_word: נוֹרָא הוּא
  choice: Ehrfurcht gebührt ihm
  rationale: Bewahrt den Gedanken, dass Jahwe ehrfürchtige Furcht hervorruft, und formuliert ihn in natürlichem, würdigem Deutsch.
- source_word: עַל כָּל אֱלֹהִים
  choice: mehr als allen Göttern
  rationale: עַל drückt hier den Vorrang im Vergleich aus; אֱלֹהִים bleibt entsprechend dem hebräischen Wortlaut als „Götter“ stehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; seine Wiedergabe bewahrt den unmittelbaren Charakter des Gottesnamens.
- issue: Bedeutung von אֱלֹהִים im Kontext
  choice: Götter
  alternative: Götzen
  rationale: Vers 4 spricht ausdrücklich von „Göttern“; erst der folgende Vers charakterisiert die Götter der Völker als Nichtse beziehungsweise Götzen. Die Spannung bleibt daher erhalten.
- issue: Nuance von נוֹרָא
  choice: Ehrfurcht gebührt ihm
  alternative: er ist zu fürchten
  rationale: Die gewählte Formulierung bringt ehrfürchtige Gottesfurcht zum Ausdruck, ohne bloßen Schrecken nahezulegen; eine wörtlichere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Überaus lobenswert“ vermeidet eine schwerfällige wörtliche Partizipialkonstruktion. „Ehrfurcht gebührt ihm“ ist verständlich und kultisch angemessen; die wörtlichere Lesart bleibt in der Fußnote sichtbar.
