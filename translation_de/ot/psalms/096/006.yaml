  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: de
  text: Pracht und Majestät sind vor ihm; Stärke und Herrlichkeit sind in seinem Heiligtum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stärke und Schönheit sind in seinem Heiligtum.“ Das hebräische Wort תִפְאֶרֶת kann auch „Schönheit“ oder „Pracht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: Hoheit
  rationale: Das Wort bezeichnet erhabenen Glanz und würdevolle Pracht. „Hoheit“ bildet mit „Majestät“ ein natürliches poetisches Paar, ohne beide Begriffe gleich wiederzugeben.
- source_word: הָדָר
  choice: Majestät
  rationale: Im Parallelismus mit הוֹד bezeichnet das Wort majestätische Würde beziehungsweise Pracht. „Majestät“ bewahrt den königlich-erhabenen Sinn.
- source_word: לְפָנָיו
  choice: sind vor ihm
  rationale: Die Wendung bedeutet wörtlich „vor ihm“. Das ergänzte „sind“ ergibt einen vollständigen deutschen Satz und erhält das räumliche beziehungsweise gegenwärtige Bild.
- source_word: עֹז
  choice: Stärke
  rationale: עֹז bezeichnet Stärke, Macht oder Kraft. „Stärke“ ist klar und passt zum poetischen Gleichgewicht der Zeile.
- source_word: תִפְאֶרֶת
  choice: Herrlichkeit
  rationale: Das Wort kann Herrlichkeit, Pracht oder Schönheit bezeichnen. „Herrlichkeit“ ist hier würdevoll und bewahrt die Bedeutungsbreite besser als das im Deutschen enger ästhetische „Schönheit“.
- source_word: בְּמִקְדָּשׁוֹ
  choice: in seinem Heiligtum
  rationale: מִקְדָּשׁ bezeichnet einen geheiligten Ort beziehungsweise ein Heiligtum. „Heiligtum“ erhält die sakrale Raumvorstellung, ohne den Begriff vorschnell auf den Tempel einzuengen.
theological_decisions:
- issue: Bezug der pronominalen Suffixe („ihm“, „seinem“)
  choice: Die Pronomen bleiben erhalten und beziehen sich im Kontext auf den HERRN.
  alternative: 'Den Gottesnamen ausdrücklich einsetzen: „vor dem HERRN … in seinem Heiligtum“.'
  rationale: Der Zusammenhang des Psalms macht den Bezug eindeutig, während die Beibehaltung der Pronomen dem hebräischen Wortlaut und seinem poetischen Fluss entspricht.
- issue: Bedeutungsumfang von תִפְאֶרֶת
  choice: Herrlichkeit
  alternative: Schönheit oder Pracht
  rationale: Der Begriff verbindet ästhetische Pracht mit ehrfurchtgebietender Herrlichkeit. Die Übersetzung legt ihn nicht ausschließlich auf äußere Schönheit fest; die Fußnote nennt die genuine lexikalische Alternative.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelstruktur. „Hoheit und Majestät“ unterscheidet die beiden nahen Begriffe der ersten Zeile; „Heiligtum“ vermeidet eine unnötige historische Verengung auf den Tempel.
