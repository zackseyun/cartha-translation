source:
  edition: WLC
  text: שִׁ֣ירוּ לַ֭/יהוָה שִׁ֣יר חָדָ֑שׁ שִׁ֥ירוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: de
  text: Singt Jahwe ein neues Lied; singt Jahwe[a], die ganze Erde!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der Pluralimperativ von שׁיר ruft eine Mehrzahl unmittelbar zum Singen auf. „Singt“ ist im Deutschen natürlich und fügt keinen im Hebräischen unausgesprochenen Gegenstand hinzu.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet hier den Adressaten des Liedes; im Deutschen wird dies idiomatisch ohne Präposition als „Jahwe singen“ wiedergegeben. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: שִׁיר bedeutet „Lied“, חָדָשׁ „neu“. Der unbestimmte Artikel ist im Deutschen erforderlich.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: כָּל mit dem bestimmten הָאָרֶץ ergibt hier im weltweiten Lobaufruf „die ganze Erde“; „das ganze Land“ wäre im Kontext zu eng.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ lässt den persönlichen Gottesnamen im Haupttext sichtbar; die traditionelle Wiedergabe wird in der Fußnote genannt.
- issue: Adressat des zweiten Imperativs
  choice: „die ganze Erde“ als angeredetes Subjekt
  alternative: „alle Bewohner der Erde“
  rationale: Die direkte Personifikation der ganzen Erde wird bewahrt, statt sie erklärend auf ihre Bewohner einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Aufbau und die feierliche direkte Anrede bleiben erhalten; das abschließende Ausrufezeichen verdeutlicht den Imperativ, ohne den Aussagegehalt zu erweitern.
