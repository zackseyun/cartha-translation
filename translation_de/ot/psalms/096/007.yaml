source:
  edition: WLC
  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: de
  text: Gebt Jahwe[a], ihr Sippen der Völker[b], gebt Jahwe Ehre und Macht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „dem HERRN“. Der hebräische Text hat den Gottesnamen יהוה (JHWH).'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ihr Familienverbände der Völker“ bzw. „ihr Sippen der Nationen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Gebt
  rationale: Der wiederholte Imperativ wird unmittelbar mit „Gebt“ wiedergegeben. Im Zusammenhang ist kein materielles Überreichen gemeint, sondern die Aufforderung, Jahwe die ihm gebührende Ehre und Macht zuzuerkennen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet den Empfänger bzw. den, dem etwas zuerkannt wird; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: ihr Sippen der Völker
  rationale: מִשְׁפָּחוֹת bezeichnet größere Familienverbände oder Sippen, עַמִּים verschiedene Völker. Das ergänzte „ihr“ macht die Anrede im Deutschen deutlich, ohne einen neuen Sachinhalt einzuführen.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: כָּבוֹד bezeichnet hier die Gott zukommende Herrlichkeit bzw. Ehre. „Ehre geben“ ist im Deutschen idiomatisch und passt zum Imperativ הָבוּ.
- source_word: וָעֹז
  choice: und Macht
  rationale: עֹז kann Stärke, Kraft oder Macht bezeichnen. „Macht“ drückt hier die Gott eigene Wirkmächtigkeit natürlich und würdig aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen יהוה. „Jahwe“ bewahrt diesen Namen im Haupttext; die traditionelle Wiedergabe „der HERR“ wird als Alternative vermerkt.
- issue: Bedeutung von הָבוּ in der Aufforderung zum Lob
  choice: Gebt
  alternative: Erkennt … zu
  rationale: Die formnahe Wiedergabe „Gebt“ erhält die rhetorische Wiederholung. Zugleich bleibt erkennbar, dass Menschen Gott Ehre und Macht nicht verschaffen, sondern sie ihm als das ihm Zukommende zusprechen.
translation_notes:
  register: Poetisch, würdig und zugleich allgemein verständlich. Die Wiederholung von „Gebt Jahwe“ bildet den Parallelismus des hebräischen Verses nach; der Ausruf unterstreicht den feierlichen Aufruf zum Lob.
