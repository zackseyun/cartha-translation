  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: de
  text: Es juble das Feld und alles, was darin ist; dann werden alle Bäume des Waldes vor Freude singen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Jubel ausbrechen“. Das hebräische Verb kann einen weithin hörbaren Freudenruf oder freudiges Singen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: Es juble
  rationale: Die Verbform hat hier im poetischen Parallelismus auffordernden beziehungsweise wünschenden Sinn. „Es juble“ bewahrt diese Kraft und gibt die starke Freude des hebräischen Verbs natürlich und würdig wieder.
- source_word: שָׂדַי
  choice: das Feld
  rationale: Das poetische Singularwort bezeichnet das offene Feld beziehungsweise die Flur kollektiv. „Das Feld“ erhält das konkrete Schöpfungsbild.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: und alles, was darauf ist
  rationale: Bei einem Feld ist „darauf“ im Deutschen natürlicher als „darin“ und gibt zugleich den umfassenden Sinn von כָל אֲשֶׁר בּוֹ genau wieder.
- source_word: אָז
  choice: dann
  rationale: „Dann“ markiert knapp den nächsten Schritt im poetischen Ablauf.
- source_word: יְרַנְּנוּ
  choice: werden ... vor Freude singen
  rationale: Das Verb bezeichnet einen weithin hörbaren freudigen Ruf und kann auch freudiges Singen ausdrücken. Im Bild singender Bäume ist „vor Freude singen“ eine natürliche Wiedergabe; die mögliche Nuance des Jubelrufs wird in der Fußnote erhalten.
- source_word: כָּל עֲצֵי יָעַר
  choice: alle Bäume des Waldes
  rationale: Die Formulierung bewahrt sowohl die Gesamtheit, die כָל ausdrückt, als auch das anschauliche Bild des ganzen Waldes.
theological_decisions:
- issue: Personifikation der Schöpfung im Lob
  choice: Die Felder und Bäume werden unmittelbar als jubelnde beziehungsweise singende Beteiligte dargestellt.
  alternative: Das Bild als bloßen Hinweis auf Schönheit oder Fruchtbarkeit der Natur paraphrasieren.
  rationale: Der hebräische Text personifiziert die nichtmenschliche Schöpfung ausdrücklich. Die direkte Wiedergabe erhält die theologische Weite des Schöpfungslobs, ohne das Bild auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-poetischem Ton. Der Konjunktiv „Es juble“ erhält den auffordernden beziehungsweise wünschenden Charakter der ersten Verbform; die Personifikation der Schöpfung bleibt unverändert stehen.
