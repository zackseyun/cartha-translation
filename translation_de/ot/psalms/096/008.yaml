  text: הָב֣וּ לַ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ שְׂאֽוּ מִ֝נְחָ֗ה וּ/בֹ֥אוּ לְ/חַצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: de
  text: Gebt Jahwe die Ehre, die seinem Namen gebührt; bringt eine Gabe[a] und kommt in seine Vorhöfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Opfergabe«, »ein Geschenk« oder »Tribut«. Das hebräische Wort kann je nach Zusammenhang eine Gabe, einen Tribut oder eine Opfergabe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Gebt
  rationale: Der Imperativ bedeutet wörtlich »gebt«; in dieser poetischen Aufforderung geht es darum, Jahwes Ehre anzuerkennen und ihm zuzuerkennen, nicht darum, ihm etwas Fehlendes zu verschaffen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, sodass der im hebräischen Text ausdrücklich gebrauchte Bundesname erhalten bleibt.
- source_word: כְּבוֹד שְׁמוֹ
  choice: die Ehre seines Namens
  rationale: Die Genitivverbindung wird eng am Hebräischen wiedergegeben. »Ehre« bezeichnet hier die Herrlichkeit und Würde, die mit Jahwes Namen, also seiner offenbarten Person und seinem Ruf, verbunden ist.
- source_word: שְׂאוּ מִנְחָה
  choice: bringt eine Gabe
  rationale: נשׂא bedeutet mit מִנְחָה idiomatisch »bringen«. »Gabe« bewahrt die Bedeutungsbreite von מִנְחָה zwischen Geschenk, Tribut und kultischer Opfergabe.
- source_word: וּבֹאוּ לְחַצְרוֹתָיו
  choice: und kommt in seine Vorhöfe
  rationale: Die Formulierung gibt die Bewegungsrichtung in die zum Heiligtum gehörenden Hofbereiche natürlich wieder; »Vorhöfe« ist im deutschen Bibel- und Gottesdienstregister verständlich und präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den Eigennamen, während »der HERR« die traditionelle ersetzende Lesung darstellen würde.
- issue: Bezug von כְּבוֹד שְׁמוֹ
  choice: die Ehre seines Namens
  alternative: die Ehre, die seinem Namen gebührt
  rationale: Die gewählte Fassung bewahrt die knappe Genitivkonstruktion und lässt offen, ob die Ehre als dem Namen zugehörig oder ihm gebührend verstanden wird; die Alternative würde den Gedanken des Gebührens ausdrücklich ergänzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Imperativstruktur. Die beiden Aufforderungen des Hebräischen bleiben erhalten; der Gottesname wird als »Jahwe« wiedergegeben.
