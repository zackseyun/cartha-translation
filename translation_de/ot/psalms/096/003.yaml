id: PSA.96.3
reference: Psalms 96:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: de
  text: Verkündet unter den Nationen seine Herrlichkeit, unter allen Völkern seine Wundertaten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Wunder«; auch: »seine wunderbaren Werke«.'
    reason: Lexikalische Alternative für נִפְלְאוֹתָיו; das hebräische Wort kann sowohl die Wunder selbst als auch die Staunen erregenden Taten bezeichnen.
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Verkündet
  rationale: Der Piel-Imperativ Plural von ספר fordert zum öffentlichen Erzählen und Bekanntmachen auf. »Verkündet« gibt den auffordernden, feierlichen Ton natürlich wieder.
- source_word: בַגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם bezeichnet hier die Nationen bzw. Völker außerhalb Israels. »Nationen« bewahrt zusammen mit »Völkern« im zweiten Halbvers die poetische Variation; ב wird im Sinn einer Verkündigung in ihrer Mitte mit »unter« wiedergegeben.
- source_word: כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: כָּבוֹד umfasst Ehre, Hoheit und strahlenden Glanz. »Herrlichkeit« ist im Lobpreiskontext eine verständliche und theologisch unbelastete Wiedergabe.
- source_word: בְּכָל הָעַמִּים
  choice: unter allen Völkern
  rationale: עַמִּים wird zur Wahrung des Parallelismus von גּוֹיִם unterschieden. »Unter allen Völkern« erhält sowohl den umfassenden Geltungsbereich als auch die parallele Präpositionalkonstruktion.
- source_word: נִפְלְאוֹתָיו
  choice: seine Wundertaten
  rationale: Das Wort bezeichnet außergewöhnliche, Staunen hervorrufende Taten. »Wundertaten« bringt sowohl ihren wunderbaren Charakter als auch ihren Handlungsbezug knapp zum Ausdruck.
theological_decisions:
- issue: Universaler Umfang der Verkündigung
  choice: Die Herrlichkeit und die Wundertaten des HERRN sollen unter den Nationen und allen Völkern verkündet werden.
  alternative: Eine engere Beschränkung auf Israels unmittelbare Nachbarvölker.
  rationale: Die parallelen Ausdrücke גּוֹיִם und כָּל הָעַמִּים betonen einen umfassenden internationalen Horizont. Die Übersetzung wahrt diesen, ohne spätere missionstheologische Formulierungen in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. »Nationen« und »Völker« unterscheiden die beiden hebräischen Parallelbegriffe, ohne einen sachlichen Gegensatz zu behaupten.
