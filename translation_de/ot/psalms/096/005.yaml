id: PSA.96.5
reference: Psalms 96:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: de
  text: Denn alle Götter der Völker sind Götzen[a], doch Yahweh hat den Himmel gemacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nichtse« beziehungsweise »wertlose Götzen«. Das hebräische Wort kann Nichtigkeit oder Wertlosigkeit anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »die Himmel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und klingt im deutschen poetischen Zusammenhang natürlich.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: alle Götter der Völker
  rationale: Gibt die umfassende Aussage und die Konstruktverbindung direkt wieder; »Völker« bewahrt die Bedeutung des hebräischen Plurals.
- source_word: אֱלִילִים
  choice: Götzen
  rationale: Bezeichnet verehrte Götterbilder bzw. falsche Götter und lässt den polemischen Beiklang von Nichtigkeit oder Wertlosigkeit erkennen, ohne ihn ausdrücklich auszudeuten.
- source_word: וַיהוָה
  choice: doch Yahweh
  rationale: Das ו markiert hier einen starken Gegensatz; »doch« bildet ihn idiomatisch ab. Der Gottesname wird als »Yahweh« wiedergegeben.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Der morphologische Plural bezeichnet im Deutschen idiomatisch häufig den Himmel als geschaffenen Bereich; »die Himmel« bleibt als formnähere Alternative möglich.
- source_word: עָשָׂה
  choice: hat ... gemacht
  rationale: Entspricht dem allgemeinen Verb »machen«; »erschaffen« wäre kontextuell passend, aber lexikalisch spezifischer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext erkennbar bewahrt, statt ihn durch einen Titel zu ersetzen.
- issue: Status der Götter der Völker
  choice: Götzen
  alternative: Nichtse / wertlose Götzen
  rationale: Die Übersetzung wahrt die polemische Aussage des hebräischen אֱלִילִים, ohne die mögliche Nuance von Nichtigkeit als einzige Bedeutung festzulegen.
translation_notes:
  register: Moderne, würdige und gut verständliche Psalmsprache. Der knappe Gegensatz zwischen den Göttern der Völker und Yahweh als Schöpfer bleibt erhalten.
