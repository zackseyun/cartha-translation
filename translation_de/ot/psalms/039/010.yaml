  source_fidelity: Die Bitte um Entfernung der נֶגַע wird treffend wiedergegeben. In der zweiten Vershälfte bezeichnet מִן die Ursache bzw. das Mittel; „unter dem Angriff“ schwächt diese Beziehung gegenüber „durch“ ab. „Bin ich am Ende“ ist zwar idiomatisch, kann aber im heutigen Deutsch auch bloße Ratlosigkeit bedeuten und gibt das Aufgezehrtsein von כָּלִיתִי weniger präzise wieder.
  naturalness: „Nimm deine Plage von mir!“ ist natürlich und dem Klagegebet angemessen. „Durch den Angriff deiner Hand bin ich erschöpft“ ist modernes, klares Standarddeutsch und wahrt die harte Bildsprache, ohne unnötig steif zu wirken.
  terminology: „Plage“ ist für נֶגַע vertretbar; die Alternativen „Schlag“ und „Heimsuchung“ bewahren die lexikalische Offenheit. „Angriff deiner Hand“ gibt תִּגְרַת יָדְךָ als bedrängendes, feindliches Vorgehen wieder. Die Fußnote zu מֵעָלַי sollte die räumliche Nuance idiomatischer als „von mir herab“ erläutern.
  issues:
