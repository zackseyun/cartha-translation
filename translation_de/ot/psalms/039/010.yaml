  - severity: medium
    issue: „Bin ich am Ende“ ist für כָלִיתִי zu mehrdeutig.
    rationale: Die Redewendung kann heute auch Überforderung oder Ratlosigkeit ausdrücken. „Bin ich erschöpft“ bewahrt den Kontext des durch Gottes Hand verursachten Aufgeriebenseins klarer.
