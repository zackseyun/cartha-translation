lexical_decisions:
- source_word: הָסֵר
  choice: Nimm … von mir
  rationale: Der Hifil-Imperativ ist eine unmittelbare Bitte um Beseitigung. Die deutsche Fügung „etwas von jemandem nehmen“ gibt die Aufforderung natürlich und knapp wieder.
- source_word: מֵעָלַי
  choice: von mir
  rationale: Die Präposition verbindet die Vorstellungen „von“ und „auf/über mir“. „Von mir“ ist im Deutschen idiomatisch; die räumliche Nuance wird in einer Fußnote ausgewiesen.
- source_word: נִגְעֶךָ
  choice: deine Plage
  rationale: נֶגַע kann eine Plage, einen Schlag oder eine Heimsuchung bezeichnen. „Plage“ bewahrt die konkrete Schwere des von Gott kommenden Leidens, ohne es ausdrücklich als Krankheit oder Strafgericht festzulegen.
- source_word: מִתִּגְרַת
  choice: unter dem Angriff
  rationale: תִּגְרָה bezeichnet Streit, Feindseligkeit oder einen feindlichen Angriff. Mit „deiner Hand“ vermittelt „unter dem Angriff“ die auf den Beter einwirkende Gewalt, ohne das seltene Wort vorschnell auf einen einzelnen Schlag zu verengen.
- source_word: יָדְךָ
  choice: deiner Hand
  rationale: Das anthropomorphe Bild für Gottes wirksames Handeln bleibt erhalten und wird nicht abstrakt als „Macht“ wiedergegeben.
- source_word: אֲנִי כָלִיתִי
  choice: bin ich am Ende
  rationale: Das ausdrückliche Pronomen hebt den Beter hervor. Das Qal-Perfekt von כלה kann Vollendung, Aufzehrung oder Vergehen ausdrücken; „bin ich am Ende“ ist natürliches Deutsch und bezeichnet seine völlige Erschöpfung.
theological_decisions:
- issue: Art des Leidens in נִגְעֶךָ
  choice: Als unmittelbar von Gott kommende „Plage“ wiedergegeben, ohne ihre konkrete Gestalt festzulegen.
  alternative: „dein Schlag“ oder „deine Heimsuchung“
  rationale: Der Vers führt das Leiden auf Gottes Handeln zurück, bestimmt aber nicht, ob Krankheit, Strafe oder eine andere Not gemeint ist. Diese Spannung bleibt offen.
- issue: Gewaltsame Bildsprache in מִתִּגְרַת יָדְךָ
  choice: „unter dem Angriff deiner Hand“
  alternative: „durch den Schlag deiner Hand“ oder „wegen der Feindseligkeit deiner Hand“
  rationale: Die seltene Wendung stellt Gottes Hand als bedrängend und überwältigend dar. Die Übersetzung wahrt diese Härte, ohne die Aussage dogmatisch abzuschwächen oder Gottes Handeln genauer zu erklären, als der Text es tut.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klage- und Gebetston. Der Imperativ bleibt unmittelbar; die seltene und harte Bildsprache von Gottes angreifender Hand wird nicht geglättet. Die Fußnoten bewahren die wesentlichen lexikalischen Alternativen und die räumliche Nuance von מֵעָלַי.
