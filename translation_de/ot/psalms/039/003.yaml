lexical_decisions:
- source_word: חַם
  choice: wurde heiß
  rationale: Gibt die im Zusammenhang naheliegende Zustandsveränderung wieder und unterscheidet die innere Hitze vom anschließend ausdrücklich genannten Feuer.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Bewahrt das hebräische Bild für das innere Zentrum von Denken und Empfinden.
- source_word: בְּקִרְבִּי
  choice: in mir
  rationale: Ist natürliches modernes Deutsch und erhält die Betonung des inneren Geschehens.
- source_word: בַּהֲגִיגִי
  choice: während ich nachsann
  rationale: Der Ausdruck kann inneres Sinnen, Nachdenken oder Meditieren bezeichnen; die temporale Wiedergabe passt zum Verlauf des Satzes.
- source_word: תִבְעַר אֵשׁ
  choice: brannte ein Feuer
  rationale: Bewahrt das lebhafte Feuerbild, ohne den im Hebräischen nicht markierten bestimmten Artikel hinzuzufügen.
- source_word: דִּבַּרְתִּי
  choice: da redete ich
  rationale: „Da“ macht die aus dem poetischen Verlauf erkennbare Folge vom inneren Brennen zum Sprechen deutlich, ohne eine zusätzliche inhaltliche Deutung einzutragen.
- source_word: בִּלְשׁוֹנִי
  choice: mit meiner Zunge
  rationale: Bewahrt das konkrete körperliche Bild des hebräischen Ausdrucks trotz seiner im Deutschen auffälligen Redundanz.
