source:
  edition: WLC
  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: de
  text: Lass mich, Jahwe, mein Ende erkennen und welches Maß meine Tage haben, damit ich erkenne, wie vergänglich ich bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie gebrechlich ich bin“ oder „wie flüchtig mein Leben ist“. Der hebräische Ausdruck ist knapp und kann sowohl die menschliche Gebrechlichkeit als auch die Kürze des Lebens hervorheben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: Lass mich … erkennen
  rationale: Der Hifil-Imperativ von ידע mit Suffix der 1. Person Singular ist kausativ. Die deutsche Wendung gibt die Bitte natürlich wieder und bewahrt den Bezug auf das Erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קִצִּי
  choice: mein Ende
  rationale: קֵץ bezeichnet ein Ende oder eine Grenze; im Kontext ist der Endpunkt des menschlichen Lebens gemeint, ohne den stärkeren Gedanken eines Schicksals einzutragen.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: und welches Maß meine Tage haben
  rationale: Die Formulierung bewahrt das Bild des Maßes, gibt die hebräische Frage aber in natürlichem Deutsch wieder.
- source_word: אֵדְעָה
  choice: damit ich erkenne
  rationale: Der Kohortativ drückt hier am besten den beabsichtigten Zweck oder das gewünschte Ergebnis der vorausgehenden Bitte aus.
- source_word: מֶה חָדֵל אָֽנִי
  choice: wie vergänglich ich bin
  rationale: חָדֵל ist knapp und mehrdeutig. Im Zusammenhang mit dem Lebensende und dem Maß der Tage steht die Vergänglichkeit im Vordergrund; die mögliche Nuance menschlicher Gebrechlichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet unmittelbar das Tetragramm. Die Wiedergabe als Jahwe bewahrt den persönlichen Namen und ersetzt ihn nicht durch den Titel „HERR“.
- issue: Deutung von חָדֵל
  choice: vergänglich
  alternative: gebrechlich
  rationale: Der Kontext betont die Kürze und Begrenztheit des Lebens. Da der Ausdruck zugleich menschliche Schwäche bezeichnen kann, wird diese echte Bedeutungsnuance nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt der poetischen Bitte des Hebräischen nahe, ohne unnatürlich wörtlich zu wirken; die Wiederholung von „erkennen“ spiegelt ידע im Ausgangstext.
