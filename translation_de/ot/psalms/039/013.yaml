base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/013.yaml
  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: de
  text: Wende deinen Blick von mir ab[a], damit ich wieder aufatmen kann, bevor ich fortgehe und nicht mehr bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Blicke von mir weg.« Das folgende Verb kann bedeuten: wieder aufleben, Erleichterung finden oder neue Kraft gewinnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע
  choice: Blicke weg
  rationale: Der Imperativ bittet Gott im Klagezusammenhang, seinen bedrängenden Blick vom Beter abzuwenden. „Blicke weg“ ist knapp, natürlich und wahrt die Bildsprache.
- source_word: מִמֶּנִּי
  choice: von mir
  rationale: 'Die Präposition mit Suffix bezeichnet die Trennung: Gott soll seinen Blick vom Beter abwenden.'
- source_word: וְאַבְלִיגָה
  choice: damit ich wieder aufatmen kann
  rationale: Das seltene Verb בלג kann neues Aufleben, Erleichterung, Aufhellung oder Erholung der Kraft bezeichnen. „Wieder aufatmen“ gibt im Deutschen die erbetene Erleichterung natürlich wieder, ohne den Sinn auf körperliche Stärke oder ein Lächeln zu verengen.
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Der temporale Ausdruck wird im modernen Deutschen klar und unmittelbar mit „bevor“ wiedergegeben.
- source_word: אֵלֵךְ
  choice: ich fortgehe
  rationale: הלך bedeutet wörtlich „gehen“. „Fortgehen“ erhält die zurückhaltende Metapher für den Tod, ohne sie im Haupttext ausdrücklich aufzulösen.
- source_word: וְאֵינֶנִּי
  choice: und nicht mehr bin
  rationale: Die Wendung bezeichnet das Nicht-mehr-Dasein. Die Übersetzung bewahrt ihre feierliche Endgültigkeit und die knappe hebräische Form.
theological_decisions:
- issue: Ob der Hinweis auf den Tod in אֵלֵךְ וְאֵינֶנִּי ausdrücklich gemacht werden soll
  choice: Die indirekte Formulierung „bevor ich fortgehe und nicht mehr bin“ wird beibehalten.
  alternative: „bevor ich sterbe und nicht mehr da bin“
  rationale: Der Zusammenhang weist klar auf den Tod, doch der hebräische Text spricht poetisch und indirekt. Die Übersetzung bewahrt diese Zurückhaltung und macht die Aussage nicht ausdrücklicher als das Original.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bitte bleibt direkt und poetisch; „wieder aufatmen“ vermittelt die semantische Spannweite des seltenen Verbs idiomatisch, während die Fußnote wichtige Alternativen offenhält.
