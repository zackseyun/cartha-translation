  text: מִ/כָּל פְּשָׁעַ֥/י הַצִּילֵ֑/נִי חֶרְפַּ֥ת נָ֝בָ֗ל אַל תְּשִׂימֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: de
  text: Rette mich von all meinen Verfehlungen; mach mich nicht zum Gespött eines Toren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mach mich nicht zur Schande eines Toren.“ Das Hebräische kann bedeuten, dass der Beter dem Hohn eines Toren ausgesetzt wird, oder dass er zu einer als „eines Toren“ bestimmten Schande wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  choice: von all meinen Verfehlungen
  rationale: מִן mit כֹּל bezeichnet die Befreiung von der Gesamtheit der Vergehen. „Verfehlungen“ gibt פֶּשַׁע als schuldhafte Übertretungen verständlich wieder, ohne den möglichen Beiklang bewusster Auflehnung auszuschließen.
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von נצל bittet um Rettung oder Befreiung. „Rette mich“ ist im heutigen Deutsch natürlich, knapp und dem Gebetsregister angemessen.
- source_word: חֶרְפַּת
  choice: zum Gespött
  rationale: חֶרְפָּה bezeichnet Schmach, Hohn oder entehrende Verachtung. In Verbindung mit שׂים und einer Person als Objekt bringt „zum Gespött machen“ die konkrete Rolle als Ziel des Hohns idiomatisch zum Ausdruck.
- source_word: נָבָל
  choice: eines Toren
  rationale: נָבָל meint einen moralisch unverständigen, verwerflich handelnden Menschen, nicht bloß jemanden mit geringer Intelligenz. „Tor“ bewahrt diesen traditionellen ethisch-religiösen Sinn in knapper Form.
- source_word: אַל תְּשִׂימֵנִי
  choice: mach mich nicht
  rationale: שׂים kann mit persönlichem Objekt bedeuten, jemanden in einen Zustand oder eine Stellung zu versetzen. „Mach mich nicht“ ist dafür die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Sinn der Bitte um Bewahrung vor Schmach
  choice: Der Beter bittet Gott, ihn nicht zum Ziel des Hohns eines moralisch törichten Menschen werden zu lassen.
  alternative: Der Beter bittet, nicht zu einer mit einem Toren verbundenen Schande gemacht beziehungsweise nicht der Schmach eines Toren preisgegeben zu werden.
  rationale: Die Constructusverbindung חֶרְפַּת נָבָל lässt offen, ob der Tor Urheber des Hohns ist oder ob die Schmach näher als die eines Toren bestimmt wird. Der Haupttext gibt die im Zusammenhang naheliegende Zielrichtung des Hohns wieder; die Fußnote bewahrt die echte syntaktisch-lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. „Rette“ ist gegenwärtiger als „erlöse“, während „Tor“ den moralischen Gehalt von נָבָל besser wahrt als das umgangssprachlichere „Narr“. Der Fußnotenmarker steht unmittelbar nach dem mehrdeutigen zweiten Halbvers.
