  text: For the choir director; according to Jeduthun[a]. A psalm of David[b].
translation:
  language: de
  text: Für den Chorleiter; nach Jedutun[a]. Ein Psalm Davids[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „für Jedutun“ beziehungsweise „an Jedutun“; die hebräische Präposition kann in Psalmüberschriften unterschiedliche Arten der Zuordnung ausdrücken.
    reason: alternative_reading
  - marker: b
