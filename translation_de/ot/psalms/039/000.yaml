lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck herkömmlich den Leiter der musikalischen Aufführung. „Chorleiter“ ist im heutigen Deutsch klar und passt zum musikalisch-kultischen Zusammenhang.
- source_word: לִידוּתוּן
  choice: nach Jedutun
  rationale: Die Präposition ל kann verschiedene Arten der Zuordnung oder Bestimmung ausdrücken. „Nach Jedutun“ lässt eine Verbindung mit einer Person, einer musikalischen Weise oder einer Sängergruppe offen, ohne sie genauer festzulegen.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die etablierte deutsche Bezeichnung für diese Gattung eines musikalischen Liedes.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv gibt die offene Zuordnung des Hebräischen knapp wieder und legt nicht zwingend fest, ob David als Verfasser, Empfänger oder Bezugsperson gemeint ist.
