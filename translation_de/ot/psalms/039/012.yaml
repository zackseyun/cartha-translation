base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: de
  text: Höre mein Gebet, Jahwe, und vernimm meinen Hilferuf; schweige nicht angesichts meiner Tränen.[a] Denn ich bin ein Fremder bei dir, ein ansässiger Fremder wie alle meine Väter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei nicht taub für meine Tränen.“ Das hebräische Verb bedeutet vorrangig „schweigen“, kann im Zusammenhang der Bitten um Hören aber auch im Sinn von „nicht taub sein“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie alle meine Vorfahren“. Wörtlich: „wie alle meine Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Höre
  rationale: Der Qal-Imperativ richtet eine unmittelbare Bitte an Gott; „Höre“ ist im Deutschen natürlich und bewahrt den Gebetsstil.
- source_word: תְפִלָּתִי
  choice: mein Gebet
  rationale: Die übliche und direkte Wiedergabe des hebräischen Wortes für Gebet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְשַׁוְעָתִי
  choice: meinen Hilferuf
  rationale: שַׁוְעָה bezeichnet einen dringenden Ruf, häufig um Hilfe; „Hilferuf“ macht diese Bedeutung im heutigen Deutsch knapp und deutlich.
- source_word: הַאֲזִינָה
  choice: vernimm
  rationale: Der Imperativ fordert zum aufmerksamen Hören auf. „Vernimm“ wahrt die poetische Parallelität zu „Höre“, ohne dieselbe Formulierung zu wiederholen.
- source_word: אֶל דִּמְעָתִי
  choice: für meine Tränen
  rationale: Der Singular „Träne“ ist kollektiv gebraucht; im Deutschen ist der Plural idiomatisch. Die Präposition „für“ gehört zur natürlichen Wendung „taub sein für“.
- source_word: אַל תֶּחֱרַשׁ
  choice: sei nicht taub
  rationale: חרשׁ kann „taub sein“ oder „schweigen“ bedeuten. Der Zusammenhang mit „höre“ und „vernimm“ stützt hier die auditive Wiedergabe; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung der Bitte ein.
- source_word: גֵר
  choice: Fremder
  rationale: גֵר bezeichnet einen Nicht-Einheimischen, der sich unter einer Gemeinschaft aufhält, ohne deren vollen angestammten Status zu besitzen.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: „Bei dir“ gibt die räumlich-relationale Bedeutung von עִם im Deutschen natürlich wieder und lässt offen, ob besonders Gottes Gegenwart oder sein Herrschaftsbereich gemeint ist.
- source_word: תּוֹשָׁב
  choice: ansässiger Fremder
  rationale: תּוֹשָׁב bezeichnet jemanden, der an einem Ort wohnt, dort aber nicht den Status eines Einheimischen besitzt. Die Formulierung ist verständlich und hält den Begriff von גֵר unterscheidbar.
- source_word: כְּכָל אֲבוֹתָי
  choice: wie alle meine Väter
  rationale: Die Wiedergabe folgt der ausdrücklich maskulinen und konkreten Formulierung des Hebräischen; die idiomatisch weitere Bedeutung „Vorfahren“ wird in der Fußnote genannt.
theological_decisions:
- issue: Die beiden sozialen Statusbegriffe גֵר und תּוֹשָׁב
  choice: „Fremder“ und „ansässiger Fremder“ werden unterschieden.
  alternative: Beide Begriffe könnten als annähernde Synonyme wie „Gast“ und „Fremder“ wiedergegeben werden.
  rationale: Die zwei hebräischen Begriffe beschreiben verwandte, aber nicht völlig gleiche Formen nicht-angestammter Zugehörigkeit. Ihre Unterscheidung bewahrt die Spannung zwischen tatsächlichem Aufenthalt und fehlendem bleibendem Besitzrecht vor Gott.
- issue: Die Mehrdeutigkeit von אַל תֶּחֱרַשׁ
  choice: Im Haupttext steht „sei nicht taub“, passend zum vorangehenden Bitten um Hören.
  alternative: „Schweige nicht angesichts meiner Tränen.“
  rationale: Beide Bedeutungen sind lexikalisch möglich. Die auditive Lesart passt zur unmittelbaren Abfolge „Höre … vernimm“, während die Fußnote die ebenso echte Bedeutung „schweigen“ bewahrt.
- issue: Die Wiedergabe von אֲבוֹתָי
  choice: „meine Väter“
  alternative: „meine Vorfahren“
  rationale: Der Haupttext wahrt die konkrete maskuline Form des Hebräischen, ohne die weitere genealogische Bedeutung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gebetssprache. „Ansässiger Fremder“ ist bewusst etwas sachlicher, damit die beiden hebräischen Statusbegriffe nicht zu einem einzigen Begriff eingeebnet werden.
