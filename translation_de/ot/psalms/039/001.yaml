id: PSA.39.1
reference: Psalms 39:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָמַ֗רְתִּי אֶֽשְׁמְרָ֣ה דְרָכַ/י֮ מֵ/חֲט֪וֹא בִ/לְשׁ֫וֹנִ֥/י אֶשְׁמְרָ֥ה לְ/פִ֥/י מַחְס֑וֹם בְּ/עֹ֖ד רָשָׁ֣ע לְ/נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: de
  text: 'Ich sagte: »Ich will auf meine Wege achten, um nicht mit meiner Zunge zu sündigen. Ich will meinem Mund einen Maulkorb anlegen, solange der Gottlose[a] vor mir ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Gottloser« oder »ein böser Mensch«. Das Hebräische steht im maskulinen Singular, hat hier aber keinen Artikel.'
    reason: lexikalische und grammatische Alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Das Qal Perfekt 1. Person Singular von אמר führt den zuvor gefassten Vorsatz des Psalmbeters ein; die direkte Wiedergabe wahrt den Wortlaut, ohne bereits als »ich beschloss« auszulegen.
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: Ich will auf meine Wege achten
  rationale: Die Kohortativform drückt entschlossene Selbstverpflichtung aus. דרך im Plural bezeichnet hier die Lebensführung; »auf meine Wege achten« ist im Deutschen natürlich und erhält das hebräische Bild.
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: um nicht mit meiner Zunge zu sündigen
  rationale: מן mit dem Infinitiv von חטא bezeichnet das zu vermeidende Handeln; ב ist instrumental. Die Formulierung gibt Zweck und Mittel klar wieder.
- source_word: אֶשְׁמְרָה לְפִי מַחְסוֹם
  choice: Ich will meinem Mund einen Maulkorb anlegen
  rationale: מַחְסוֹם bezeichnet einen Maulkorb beziehungsweise eine konkrete Vorrichtung zur Zurückhaltung. Die deutsche Wendung bewahrt dieses kräftige Bild und gibt den beabsichtigten Zustand idiomatisch wieder.
- source_word: בְּעוֹד
  choice: solange
  rationale: Die Wendung bezeichnet die gleichzeitige Dauer. »Solange« passt zum anhaltenden Vorsatz, während der Gottlose gegenwärtig ist.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das maskuline substantivierte Adjektiv steht im Singular. »Der Gottlose« bewahrt Numerus, Genus und den traditionsreichen, weiterhin verständlichen ethischen Sinn.
- source_word: לְנֶגְדִּי
  choice: vor mir ist
  rationale: Die Präpositionalwendung bedeutet »mir gegenüber«, »vor mir« oder »in meiner Gegenwart«; das ergänzte Verb ist für einen natürlichen deutschen Satz erforderlich.
theological_decisions:
- issue: Bestimmtheit und geschlechtliche Form von רָשָׁע
  choice: der Gottlose
  alternative: ein Gottloser; ein böser Mensch
  rationale: Der hebräische Ausdruck ist maskulin singular, aber ohne Artikel. Die gewählte Form folgt dem präsentischen Gegenüber im Kontext, während die Fußnote die mögliche unbestimmte beziehungsweise beschreibende Lesart offenhält.
- issue: Art der Selbstbeschränkung
  choice: konkretes Bild eines Maulkorbs
  alternative: den Mund im Zaum halten; den Mund bewachen
  rationale: Das seltene Substantiv מַחְסוֹם bezeichnet eine konkrete Fesselung des Mundes. Das Bild wird nicht zu einer bloß abstrakten Aufforderung zur Selbstbeherrschung abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Redeform bleibt direkt und der Parallelismus der beiden Vorsätze wird gewahrt. Das anschauliche Bild des Maulkorbs bleibt erhalten; die mögliche Unbestimmtheit von רָשָׁע wird nicht stillschweigend ausgeschlossen.
