source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: de
  text: Gewiss, als Schattenbild[a] geht der Mensch umher. Gewiss, vergeblich lärmen sie[b]. Er häuft Besitz an und weiß nicht, wer ihn einsammeln wird[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Abbild«, »als bloßer Schein« oder »wie ein Phantom«. Das hebräische Wort bedeutet wörtlich »Bild« und bezeichnet hier wohl die substanzlose Erscheinung des menschlichen Daseins.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen nach dem singularischen »der Mensch« die Mehrzahl: »sie lärmen«; gemeint sind wahrscheinlich die Menschen allgemein. Das Verb kann auch ihr unruhiges, aufgeregtes Treiben bezeichnen.'
    reason: textual_ambiguity
  - marker: c
    text: 'Wörtlich: »wer sie einsammeln wird«; die Mehrzahl bezieht sich auf die angehäuften Besitztümer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: gewiss
  rationale: Die zweimalige Partikel unterstreicht die Feststellung und ihre poetische Wiederholung; »gewiss« gibt diesen bekräftigenden Ton natürlich wieder.
- source_word: בְּצֶלֶם
  choice: als Schattenbild
  rationale: צֶלֶם bedeutet wörtlich »Bild/Abbild«; im Zusammenhang bezeichnet es die schemenhafte, substanzlose Erscheinung des menschlichen Daseins. »Schattenbild« bewahrt sowohl den Bildbegriff als auch den Vergänglichkeitsklang.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: geht der Mensch umher
  rationale: Die Hitpael-Form von הלך bezeichnet ein Umhergehen. אִישׁ ist zwar morphologisch maskulin und singular, steht hier aber repräsentativ für den Menschen; das deutsche »der Mensch« bewahrt Singular und generischen Sinn.
- source_word: הֶבֶל
  choice: vergeblich
  rationale: הֶבֶל kann »Hauch«, »Nichtigkeit« oder »Vergeblichkeit« bedeuten. Hier bestimmt es die ruhevolle beziehungsweise lärmende Tätigkeit näher; »vergeblich« passt syntaktisch und lässt den Gedanken ihrer Zwecklosigkeit hervortreten.
- source_word: יֶהֱמָיוּן
  choice: lärmen sie
  rationale: המה bezeichnet Lärm, Unruhe oder aufgeregtes Treiben. Die Übersetzung wahrt bewusst die unerwartete hebräische Pluralform nach dem singularischen »Mensch«.
- source_word: יִצְבֹּר
  choice: Er häuft Besitz an
  rationale: צבר bedeutet »anhäufen/ansammeln«. Das im Hebräischen unausgesprochene Objekt wird aus dem folgenden pronominalen Rückbezug als Besitz erschlossen und für verständliches Deutsch ergänzt.
- source_word: וְלֹא יֵדַע
  choice: und weiß nicht
  rationale: Die schlichte Verbindung mit negiertem ידע wird ohne interpretierende Zuspitzung wiedergegeben.
- source_word: מִי אֹסְפָם
  choice: wer ihn einsammeln wird
  rationale: Das Suffix ist im Hebräischen pluralisch und bezieht sich auf das Angehäufte. Im Deutschen wird der ergänzte Sammelbegriff »Besitz« singularisch wieder aufgenommen; die formale Abweichung wird in der Fußnote genannt.
theological_decisions:
- issue: Repräsentativ maskuline Ausdrucksweise bei אִישׁ
  choice: der Mensch
  alternative: ein Mann
  rationale: Im Vers wird das allgemeine menschliche Dasein beschrieben. »Der Mensch« ist im modernen Deutschen ein grammatisch maskuliner, generischer Singular und gibt diesen Sinn natürlich wieder, ohne den Vers auf männliche Personen zu beschränken.
- issue: Wechsel vom Singular zum Plural
  choice: »der Mensch … sie« beibehalten
  alternative: die Pluralform als singularisches »er« glätten
  rationale: Der auffällige Numeruswechsel gehört zum hebräischen Text und kann die einzelne Gestalt unvermittelt auf die Menschen allgemein ausweiten. Da der genaue Grund unsicher ist, wird die Spannung nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Kürze. Die Wiederholung von »Gewiss« und der auffällige Wechsel zwischen Singular und Plural bleiben erhalten; ungebräuchliche oder unnötig altertümliche Wendungen werden vermieden.
