id: PSA.39.7
reference: Psalms 39:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה מַה קִּוִּ֣יתִי אֲדֹנָ֑/י תּ֝וֹחַלְתִּ֗/י לְ/ךָ֣ הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/007.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: de
  text: Und nun, Herr, worauf warte ich[a]? Auf dich setze ich meine Hoffnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: „Worauf habe ich gehofft?“ Das hebräische Verb קוה kann sowohl erwartungsvolles Warten als auch Hoffen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion וְ als auch die zeitliche Wendung עַתָּה und markiert natürlich die gegenwärtige Schlussfolgerung des Beters.
- source_word: מַה
  choice: worauf
  rationale: Im Deutschen verlangt das Verb „warten“ hier idiomatisch nach „worauf“; so wird die rhetorische Frage natürlich wiedergegeben.
- source_word: קִוִּיתִי
  choice: warte ich
  rationale: קוה umfasst erwartungsvolles Warten und Hoffen. Das Präsens passt nach „Und nun“ zur gegenwärtigen Ausrichtung des Beters; die Bedeutungsbreite wird in der Fußnote offengelegt.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der ehrerbietige Gottestitel wird als Titel übersetzt; „Herr“ ist dafür die natürliche und traditionelle deutsche Entsprechung.
- source_word: תּוֹחַלְתִּי
  choice: meine Hoffnung
  rationale: Das Substantiv bezeichnet Hoffnung beziehungsweise Erwartung; „meine Hoffnung“ ist im Zusammenhang klar und idiomatisch.
- source_word: לְךָ הִיא
  choice: Auf dich setze ich
  rationale: Die Präposition לְ bezeichnet hier die Ausrichtung der Hoffnung auf Gott. Die deutsche Formulierung gibt diese Beziehung natürlich wieder, ohne einen weiteren Gegenstand der Hoffnung einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: Herr
  alternative: mein Herr
  rationale: אֲדֹנָי dient im Hebräischen als feststehender ehrerbietiger Gottestitel. „Herr“ übersetzt diese Funktion, ohne den Ausdruck unnötig zu individualisieren.
- issue: Ausrichtung der Hoffnung in לְךָ הִיא
  choice: Auf dich setze ich meine Hoffnung
  alternative: Meine Hoffnung gilt dir
  rationale: Die gewählte Fassung macht Gott zum Ziel und Grund der Hoffnung, ohne genauer festzulegen, auf welche konkrete Hilfe der Beter hofft.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die rhetorische Frage bleibt knapp; die semantische Spannung zwischen Warten und Hoffen wird durch Haupttext und Fußnote bewahrt.
