  text: נֶ֭אֱלַמְתִּי לֹ֣א אֶפְתַּח פִּ֑/י כִּ֖י אַתָּ֣ה עָשִֽׂיתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/009.yaml
  text: I am mute[a]; I do not open my mouth[b], because you have done it.
translation:
  language: de
  text: Ich bin verstummt[a]; ich öffne meinen Mund nicht, denn du hast es getan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich wurde zum Schweigen gebracht“ oder „Ich schweige“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht wörtlich nur: „denn du hast getan“; was getan wurde, bleibt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Ich bin verstummt
  rationale: Das Nifal von אלם bezeichnet hier einen eingetretenen Zustand des Schweigens bzw. Verstummens. „Ich bin verstummt“ bewahrt sowohl den resultativen als auch den stativen Sinn, ohne ausdrücklich einen äußeren Urheber des Verstummens einzuführen.
- source_word: לֹא אֶפְתַּח פִּי
  choice: ich öffne meinen Mund nicht
  rationale: פתח mit „mein Mund“ ist eine feste Wendung für das Reden. Die deutsche Gegenwartsform gibt die gegenwärtige Haltung des Beters wieder; „Mund“ entspricht dem hebräischen Ausdruck unmittelbar.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für das Schweigen ein. „Denn“ klingt in einem würdigen poetischen Register natürlich und erhält den kausalen Zusammenhang.
- source_word: אַתָּה
  choice: du
  rationale: Das im Hebräischen ausdrücklich gesetzte Pronomen hebt den angesprochenen Gott als Handelnden hervor. Die direkte Stellung vor dem Verb wird im Deutschen durch „du hast“ bewahrt.
- source_word: עָשִׂיתָ
  choice: du hast es getan
  rationale: עשה ist ein weit gefasstes Verb für „tun/machen“. Das Objekt bleibt im Hebräischen unausgesprochen; das unbestimmte „es“ ermöglicht im Deutschen einen vollständigen Satz, ohne die gemeinte Handlung näher festzulegen.
theological_decisions:
- issue: Unausgesprochenes Objekt von עָשִׂיתָ und göttliches Handeln
  choice: „denn du hast es getan“
  alternative: „denn du hast gehandelt“ oder „denn du hast dies getan“
  rationale: Die Formulierung lässt wie der hebräische Text offen, was Gott konkret getan hat, erkennt aber sein Handeln als Grund für das Schweigen an. So bleibt die Spannung hinsichtlich Gottes Wirken im Leiden bestehen, ohne sie theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Bildsprache. „Verstummt“ erhält den poetischen und resultativen Charakter; die knappe Aussage über Gottes Handeln bleibt bewusst unbestimmt.
