  yaml_path: translation/ot/psalms/039/002.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: de
  text: Ich verstummte und blieb still; ich schwieg vom Guten[a], und mein Schmerz wurde aufgewühlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vom Guten«. Gemeint sein kann: »Ich schwieg, auch wenn ich Gutes hätte sagen können«; möglich ist auch: »Ich hielt mich vom Guten fern.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Ich verstummte
  rationale: Das Nifal von אלם bezeichnet das Stummwerden beziehungsweise das Nichtsprechen. »Ich verstummte« lässt offen, ob das Schweigen freiwillig oder erzwungen war.
- source_word: דּוּמִיָּה
  choice: und blieb still
  rationale: Das Substantiv bezeichnet Schweigen oder völlige Stille. Die koordinierte Wiedergabe ist im Deutschen natürlich und erhält die verstärkende Parallelität.
- source_word: הֶחֱשֵׁיתִי
  choice: ich schwieg
  rationale: Das Hifil von חשׁה bedeutet, still zu sein oder zu schweigen. Die schlichte Formulierung bewahrt die Wiederholung des Hebräischen.
- source_word: מִטּוֹב
  choice: sogar vom Guten
  rationale: Die knappe Verbindung aus מן und טוֹב ist mehrdeutig. »Vom Guten« hält den Bezug offen; »sogar« gibt die im Kontext naheliegende Steigerung idiomatisch wieder, ohne »Reden« ausdrücklich in den Text einzutragen.
- source_word: וּכְאֵבִי
  choice: und mein Schmerz
  rationale: כְּאֵב kann körperlichen wie seelischen Schmerz bezeichnen. »Schmerz« bewahrt diese Bedeutungsbreite.
- source_word: נֶעְכָּר
  choice: wurde aufgewühlt
  rationale: Das Nifal von עכר kann ein Aufgewühlt-, Erregt- oder Verstörtwerden ausdrücken. Die Wiedergabe erhält das Bild innerer Unruhe, ohne den Schmerz enger als Zorn oder Trauer zu bestimmen.
