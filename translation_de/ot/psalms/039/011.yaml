  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: de
  text: Durch Zurechtweisungen wegen seiner Schuld erziehst du einen Mann; wie eine Motte lässt du sein Kostbares vergehen.[a] Gewiss, ein Hauch nur ist jeder Mensch.[b] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Sein Kostbares“ kann auch enger „seine Schönheit“ oder weiter „seine Schätze“ bedeuten. Die Verbindung „wie eine Motte“ ist syntaktisch nicht ganz eindeutig: Sie kann Gottes zerstörendes Handeln mit dem einer Motte vergleichen oder das Vergehen des Kostbaren näher bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen flüchtigen Hauch und kann Vergänglichkeit oder Substanzlosigkeit ausdrücken; traditionell wird es auch mit „Nichtigkeit“ oder „Eitelkeit“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: durch Zurechtweisungen
  rationale: Der Plural bezeichnet wiederholte oder konkrete Akte des Tadelns und Korrigierens; „durch“ gibt die instrumentale Funktion der Präposition wieder.
- source_word: עַל עָוֺן
  choice: wegen seiner Schuld
  rationale: עָוֺן kann Schuld, Vergehen oder die daraus folgende Strafe bezeichnen. Hier benennt es am natürlichsten den Grund der erzieherischen Zurechtweisung; das possessive „seiner“ macht den Bezug auf den Mann im Deutschen deutlich, ohne den Sinn zu verändern.
- source_word: יִסַּרְתָּ
  choice: erziehst du
  rationale: Das Verb bezeichnet korrigierende, mitunter schmerzhafte Erziehung oder Zucht. „Erziehst“ ist gegenwärtiges, verständliches Deutsch; der vorausgehende Ausdruck „durch Zurechtweisungen“ bewahrt die strenge disziplinierende Färbung.
- source_word: אִישׁ
  choice: einen Mann
  rationale: אִישׁ ist hier ein grammatisch und lexikalisch männlicher Singular mit stellvertretender Bedeutung. „Einen Mann“ erhält diese konkrete Form.
- source_word: וַתֶּמֶס
  choice: lässt du … vergehen
  rationale: Das Verb beschreibt Auflösen, Schwinden oder Vergehenlassen. Die gewählte Form ist im Deutschen natürlich und bewahrt den allmählichen Verlust im Mottenbild.
- source_word: כָּעָשׁ
  choice: wie eine Motte
  rationale: Die Vergleichspartikel und das Substantiv ergeben das Bild einer Motte, die Wertvolles allmählich zerstört.
- source_word: חֲמוּדוֹ
  choice: sein Kostbares
  rationale: Das Wort bezeichnet das für jemanden Begehrenswerte oder Wertvolle. „Sein Kostbares“ hält den Bezug bewusst weit und legt ihn nicht ausschließlich auf Schönheit oder Besitz fest.
- source_word: אַךְ
  choice: Ja, nur
  rationale: אַךְ hat hier zugleich bekräftigende und einschränkende Kraft. „Ja, nur“ gibt die feierliche Folgerung und die Reduktion des Menschen auf vergänglichen Hauch wieder.
- source_word: הֶבֶל
  choice: Hauch
  rationale: הֶבֶל bezeichnet wörtlich einen flüchtigen Atemhauch und bildlich Vergänglichkeit oder Substanzlosigkeit. „Hauch“ bewahrt das konkrete Bild besser als „Nichtigkeit“ oder „Eitelkeit“.
- source_word: כָּל אָדָם
  choice: jeder Mensch
  rationale: אָדָם bezeichnet hier den Menschen als Angehörigen der gesamten Menschheit. „Jeder Mensch“ ist im Deutschen sachlich genau und erhält den generischen Singular.
- source_word: סֶלָה
  choice: Sela
  rationale: Da die genaue liturgische oder musikalische Funktion unsicher ist, wird der überlieferte Ausdruck transliteriert.
theological_decisions:
- issue: Göttliche Zurechtweisung als Antwort auf Schuld
  choice: Gottes Handeln wird als korrigierende Erziehung „wegen seiner Schuld“ wiedergegeben.
  alternative: Gottes Handeln als bloße Bestrafung oder als Zurechtweisung „für Sünde“ wiederzugeben.
  rationale: יסר trägt den Gedanken disziplinierender Erziehung, während עון sowohl moralische Schuld als auch deren Folgen umfassen kann. Die Übersetzung wahrt diese Spannung, ohne die Zurechtweisung auf Vergeltung zu reduzieren.
- issue: Anthropologische Aussage in אִישׁ und אָדָם
  choice: אִישׁ wird konkret mit „einen Mann“, אָדָם generisch mit „jeder Mensch“ übersetzt.
  alternative: Beide Ausdrücke einheitlich entweder männlich („Mann“) oder geschlechtsneutral („Mensch“) wiederzugeben.
  rationale: 'Die unterschiedliche deutsche Wiedergabe spiegelt die unterschiedliche lexikalische Gestalt des Hebräischen: אִישׁ ist ausdrücklich männlich, während אָדָם in der abschließenden Sentenz die gesamte Menschheit bezeichnet.'
- issue: Bedeutung von הֶבֶל
  choice: „Hauch“ als Bild für die flüchtige und substanzarme Existenz des Menschen.
  alternative: „Nichtigkeit“, „Eitelkeit“ oder „Vergänglichkeit“.
  rationale: Die konkrete Metapher lässt sowohl zeitliche Vergänglichkeit als auch mangelnde Beständigkeit anklingen und vermeidet eine einseitige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erziehst“ vermeidet das heute altertümliche oder körperlich verengte „züchtigst“, während „durch Zurechtweisungen“ die Strenge des hebräischen Ausdrucks erhält. Die knappe Schlussaussage und „Sela“ bewahren den poetisch-liturgischen Charakter.
