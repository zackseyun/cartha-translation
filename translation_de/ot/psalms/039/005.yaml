  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: de
  text: 'Sieh doch: Du hast meine Tage nur wenige Handbreit lang gemacht, und meine Lebenszeit ist wie nichts vor dir. Ja, jeder Mensch ist, selbst wenn er fest dasteht, nichts als ein Hauch.[a] Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hauch“ kann auch mit „Dunst“, „Nichtigkeit“ oder „Vergänglichkeit“ wiedergegeben werden. Das mit „fest dasteht“ übersetzte Wort kann auch einfach „dasteht“ oder „hingestellt ist“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende und emphatische Funktion wird in gehobenem, aber heutigem Deutsch bewahrt.
- source_word: טְפָחוֹת
  choice: nur wenige Handbreit
  rationale: Das konkrete Bild eines sehr kleinen Längenmaßes bleibt erhalten; „wenige“ und „nur“ verdeutlichen die Kürze, ohne das Bild aufzulösen.
- source_word: נָתַתָּה יָמַי
  choice: Du hast meine Tage … lang gemacht
  rationale: נתן bezeichnet hier das Zumessen bzw. Festsetzen der Lebensdauer; die deutsche Konstruktion verbindet das Verb natürlich mit dem Maßausdruck.
- source_word: וְחֶלְדִּי
  choice: meine Lebenszeit
  rationale: Gibt die Dauer des irdischen Lebens klar wieder und wahrt den Parallelismus zu „meine Tage“.
- source_word: כְאַיִן נֶגְדֶּךָ
  choice: ist wie nichts vor dir
  rationale: Bewahrt Vergleich, Nichtigkeit und Gottes Gegenüberstellung ohne interpretierende Erweiterung.
- source_word: אַךְ
  choice: Ja
  rationale: Markiert die nachdrückliche Schlussfolgerung natürlich und knapp.
- source_word: כָּל אָדָם
  choice: jeder Mensch
  rationale: Der generische Singular wird formgetreu und im modernen Deutschen eindeutig auf alle Menschen bezogen.
- source_word: נִצָּב
  choice: selbst wenn er fest dasteht
  rationale: Der Partizipialausdruck kann bloßes Stehen oder einen gefestigten, sicheren Zustand bezeichnen. Die konzessive Wiedergabe macht den wahrscheinlichen poetischen Gegensatz deutlich, ohne die Grundbedeutung preiszugeben.
- source_word: כָּל הֶבֶל
  choice: nichts als ein Hauch
  rationale: „Hauch“ erhält das konkrete Bild von etwas Flüchtigem und Substanzlosem; „nichts als“ gibt die totalisierende Aussage idiomatisch wieder.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift bleibt stehen, da Funktion und genaue Bedeutung des Ausdrucks unsicher sind.
theological_decisions:
- issue: Generische Aussage von כָּל אָדָם über die Menschheit
  choice: jeder Mensch
  alternative: alle Menschen / jeder Mann
  rationale: „Jeder Mensch“ entspricht dem generischen Singular und schließt im heutigen Deutsch die gesamte Menschheit unmissverständlich ein, ohne eine ausschließlich männliche Aussage nahezulegen.
- issue: Sinn von נִצָּב im Verhältnis zur Vergänglichkeit
  choice: selbst wenn er fest dasteht
  alternative: während er dasteht / in seinem besten Zustand
  rationale: Die konzessive Fassung bewahrt die Spannung, dass auch ein scheinbar sicher oder gefestigt stehender Mensch vergänglich ist. Die bloße Bedeutung „stehen“ bleibt in der Fußnote als echte Möglichkeit sichtbar.
- issue: Metapher הֶבֶל
  choice: Hauch
  alternative: Dunst / Nichtigkeit / Vergänglichkeit
  rationale: „Hauch“ hält Bild und theologische Spannung zwischen Flüchtigkeit, Substanzlosigkeit und möglicher Vergeblichkeit offen, statt sie auf einen abstrakten Begriff festzulegen.
translation_notes:
  register: Moderne, würdige Psalmenprosa mit konkretem Körpermaß und knapper Vergänglichkeitsmetapher. „Sieh doch“ vermeidet das altertümliche „Siehe“, während „Sela“ wegen seiner unsicheren Bedeutung unübersetzt bleibt.
