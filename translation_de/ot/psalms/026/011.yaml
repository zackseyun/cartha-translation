source:
  edition: WLC
  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: de
  text: Ich aber gehe meinen Weg in Lauterkeit[a]. Erlöse mich und sei mir gnädig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »in meiner Untadeligkeit« oder »in meiner Unschuld«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hab Erbarmen mit mir«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die selbstständige Form des Pronomens setzt den Beter betont und kontrastierend von den zuvor genannten Menschen ab; die deutsche Nachstellung von »aber« gibt dies natürlich wieder.
- source_word: בְּתֻמִּי
  choice: in Lauterkeit
  rationale: תֹּם/תֻּם bezeichnet Ganzheit, Rechtschaffenheit oder untadelige Haltung. »Lauterkeit« bewahrt den positiven moralischen Anspruch, ohne zwangsläufig absolute Sündlosigkeit auszudrücken; das Possessivsuffix wird im Deutschen durch die auf den Sprecher bezogene Formulierung wiedergegeben.
- source_word: אֵלֵךְ
  choice: gehe meinen Weg
  rationale: הלך kann das konkrete Gehen und bildlich die Lebensführung bezeichnen. »meinen Weg gehen« erhält das hebräische Wegmotiv in natürlichem Deutsch; das hebräische Imperfekt lässt hier gegenwärtig-fortdauernde, entschlossene oder zukünftige Ausrichtung zu.
- source_word: פְּדֵנִי
  choice: Erlöse mich
  rationale: פדה bezeichnet das Loskaufen oder Befreien aus Bedrängnis. »Erlöse mich« bewahrt sowohl den konkreten Rettungssinn als auch das theologische Gewicht des Verbs.
- source_word: וְחָנֵּנִי
  choice: und sei mir gnädig
  rationale: חנן bedeutet, jemandem Gunst oder Gnade zu erweisen. Die Formulierung ist direkt, würdig und näher an diesem Bedeutungsakzent als das ebenfalls mögliche »hab Erbarmen mit mir«.
theological_decisions:
- issue: Bedeutung des Anspruchs auf תֻם
  choice: Der Beter bekennt eine lautere, rechtschaffene Lebensausrichtung, ohne dass die Übersetzung daraus ausdrücklich einen Anspruch auf absolute Sündlosigkeit macht.
  alternative: »in meiner Untadeligkeit« oder »in meiner Unschuld«, was den Anspruch stärker als moralische Makellosigkeit beziehungsweise Unschuld formulieren kann.
  rationale: Der Kontext stellt den Lebensweg des Beters dem der Frevler gegenüber, während die Bitte um Erlösung und Gnade bestehen bleibt. »Lauterkeit« erhält diese Spannung zwischen dem positiven Selbstzeugnis und der Abhängigkeit von Gottes Gnade.
- issue: Zeit- und Aussagewert von אֵלֵךְ
  choice: »gehe meinen Weg« lässt eine fortdauernde und entschlossene Lebenshaltung anklingen.
  alternative: »werde meinen Weg gehen« hebt den Zukunftsaspekt stärker hervor; »will meinen Weg gehen« betont den Entschluss.
  rationale: Die hebräische Imperfektform kann im poetischen Zusammenhang mehrere dieser Nuancen tragen. Eine präsentische deutsche Formulierung vermeidet eine unnötig enge Festlegung und klingt idiomatisch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Meinen Weg gehen« bewahrt die hebräische Lebensweg-Metapher, ohne unnatürlich zu klingen; »Lauterkeit« ist leicht erhöht, aber allgemein verständlich und für einen Psalm angemessen.
