  to: 'Von David.[a]


    Verschaffe mir Recht, Jahwe,[b]

    denn ich bin meinen Weg in Lauterkeit gegangen[c]

    und habe auf Jahwe vertraut;

    ich werde nicht wanken.[d]'
  rationale: Eine geringfügige stilistische Umstellung verbessert die Natürlichkeit des Deutschen. Der revidierte Wortlaut bewahrt die hebräische Metapher des Gehens, die possessive Aussage von „meiner Lauterkeit“ ist im Deutschen durch „in Lauterkeit“ kontextuell hinreichend ausgedrückt, und alle Fußnotenanker bleiben am zutreffenden Bezugspunkt.
