  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: de
  text: 'Von David.[a]


    Verschaffe mir Recht, Jahwe,[b]

    denn ich bin meinen Weg in Lauterkeit gegangen[c]

    und habe auf Jahwe vertraut;

    ich werde nicht wanken.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Überschrift kann auch „Für David“ bedeuten oder allgemein eine Zugehörigkeit zu David ausdrücken.
    reason: textual_relationship
  - marker: b
    text: 'Wörtlicher: „Richte mich, Jahwe.“ Gemeint sein kann ein Urteil zugunsten des Beters.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn ich habe untadelig gelebt“. Das Hebräische spricht bildlich vom Gehen und bezeichnet Lauterkeit, Unversehrtheit oder untadelige Lebensführung.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „ich werde nicht ausgleiten“. Das hebräische Bild bezeichnet den Verlust festen Standes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Überschrift mit לְ und einem Personennamen kann Urheberschaft, Zugehörigkeit oder Widmung bezeichnen. „Von David“ folgt der geläufigen deutschen Form, ohne die genaue Beziehung im Haupttext weiter festzulegen.
- source_word: שָׁפְטֵנִי
  choice: Verschaffe mir Recht
  rationale: Das Verb שׁפט bedeutet grundsätzlich „richten“. Im Zusammenhang bittet der Sprecher um ein Urteil zu seinen Gunsten; „Verschaffe mir Recht“ gibt diesen forensischen Sinn natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתֻמִּי
  choice: in meiner Lauterkeit
  rationale: תֹּם beziehungsweise תֻּמָּה bezeichnet Unversehrtheit, Redlichkeit oder untadelige Haltung. „Lauterkeit“ bewahrt den moralischen Anspruch, ohne ausdrücklich sündlose Vollkommenheit zu behaupten.
- source_word: הָלַכְתִּי
  choice: bin … meinen Weg gegangen
  rationale: הלך verwendet das Gehen als Bild für die Lebensführung. Die deutsche Wendung bewahrt dieses Bild und bleibt verständlich.
- source_word: בָּטַחְתִּי
  choice: habe … vertraut
  rationale: בטח bezeichnet vertrauensvolle Zuversicht und verlässliches Sichstützen auf jemanden.
- source_word: לֹא אֶמְעָד
  choice: ich werde nicht wanken
  rationale: מעד beschreibt das Ausgleiten, Taumeln oder den Verlust festen Standes. „Nicht wanken“ bewahrt das körperliche Bild und drückt zugleich die zuversichtliche Zukunftsaussage aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift wahrt seinen Charakter als Eigenname.
- issue: Anspruch des Beters auf תֻם
  choice: Lauterkeit
  alternative: Untadeligkeit
  rationale: „Lauterkeit“ lässt den rechtlichen und moralischen Anspruch des Beters stehen, legt ihn aber nicht als Behauptung absoluter Sündlosigkeit aus.
- issue: Bedeutung von שׁפט in der Bitte
  choice: Verschaffe mir Recht
  alternative: Richte mich
  rationale: Der Kontext legt ein erbetenes Urteil zugunsten des Beters nahe. Die Fußnote bewahrt zugleich die allgemeinere Bedeutung „richten“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Zeilenstruktur. Der Gottesname erscheint als „Jahwe“. Das hebräische Lebensweg- und Standfestigkeitsbild bleibt erhalten; erklärungsbedürftige Mehrdeutigkeiten werden in knappen Fußnoten ausgewiesen.
