  yaml_path: translation/ot/psalms/026/010.yaml
  text: in whose hands is wickedness[a], and whose right hand is full of bribes.
translation:
  language: de
  text: in deren Händen Unrecht ist und deren rechte Hand voller Bestechungsgelder ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: in deren Händen
  rationale: Das Relativpronomen führt die Beschreibung der Männer aus dem vorherigen Vers fort; die hebräische Wendung und ihr Bild werden natürlich im Deutschen wiedergegeben.
- source_word: זִמָּה
  choice: Verbrechen
  rationale: Das Wort bezeichnet hier im Parallelismus mit Bestechung eine böse beziehungsweise verbrecherische Tat oder Absicht; »Verbrechen« wahrt die konkrete Färbung, ohne den Ausdruck auf sexuelles Fehlverhalten zu verengen.
- source_word: וִימִינָם
  choice: und deren rechte Hand
  rationale: Der kollektive Singular des Hebräischen bleibt erhalten und bewahrt das Bild der rechten Hand als Werkzeug des Handelns.
- source_word: מָלְאָה
  choice: voller … ist
  rationale: Die Form beschreibt einen bestehenden Zustand; die deutsche Konstruktion mit »voller« ist knapp und idiomatisch.
- source_word: שֹׁחַד
  choice: Bestechungsgelder
  rationale: Der morphologische Singular wird generisch gebraucht; der Plural gibt die gemeinte korrupte Praxis im Deutschen natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Hand-Metaphorik und der kollektive Singular »rechte Hand« bleiben erhalten.
