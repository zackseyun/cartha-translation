source:
  edition: WLC
  text: לֹא יָ֭שַׁבְתִּי עִם מְתֵי שָׁ֑וְא וְ/עִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: de
  text: Ich habe nicht mit verlogenen Menschen zusammengesessen und trete nicht zu denen, die sich verbergen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und schließe mich nicht denen an, die ihr wahres Wesen verbergen.“ Das Hebräische kann Menschen bezeichnen, die im Verborgenen handeln oder ihren wahren Charakter verheimlichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: habe … gesessen
  rationale: ישׁב bedeutet wörtlich „sitzen, wohnen, bleiben“. Mit עִם („bei/mit“) bezeichnet es hier zugleich den Umgang mit anderen; die Wiedergabe bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: מְתֵי שָׁוְא
  choice: verlogene Menschen
  rationale: מְתֵי bedeutet „Männer/Menschen von“, während שָׁוְא Falschheit, Täuschung oder Nichtigkeit bezeichnen kann. „Verlogene Menschen“ gibt den moralischen Sinn natürlich wieder, ohne die Aussage unnötig einzuengen.
- source_word: נַעֲלָמִים
  choice: die sich verbergen
  rationale: Die Form ist von עלם („verborgen sein, sich verbergen“) abgeleitet. Die Wiedergabe erhält das Motiv des Verbergens und legt nicht vorschnell fest, ob Heuchler, heimlich Handelnde oder Menschen gemeint sind, die ihren wahren Charakter verbergen.
- source_word: אָבוֹא
  choice: gehe … zu
  rationale: בוא kann „kommen, gehen, hineingehen“ bedeuten. Zusammen mit עִם und parallel zum Sitzen bei anderen bezeichnet es hier wahrscheinlich das Hinzutreten zu ihrer Gemeinschaft; „gehe zu“ ist natürlich und bewahrt die Bewegungsmetapher.
- source_word: וְעִם
  choice: und … zu
  rationale: Die Verbindung aus Konjunktion und Präposition verknüpft beide parallelen Aussagen. Im Deutschen verlangt „gehen“ idiomatisch „zu“, auch wenn das Hebräische wörtlich „und mit“ hat.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache „gesessen“ und „gehe“ bleibt erhalten; zugleich wird die mögliche soziale Bedeutung des Zusammenseins nicht übermäßig ausgedeutet. Das maskuline מְתֵי wird kontextgerecht und allgemein mit „Menschen“ wiedergegeben.
