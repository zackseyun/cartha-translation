  text: כִּֽי חַ֭סְדְּ/ךָ לְ/נֶ֣גֶד עֵינָ֑/י וְ֝/הִתְהַלַּ֗כְתִּי בַּ/אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/003.yaml
  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: de
  text: Denn deine beständige Liebe steht mir vor Augen[a], und ich bin in deiner Wahrheit[b] meinen Weg gegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Bundestreue“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in deiner Treue“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Aussage des Psalmisten im Zusammenhang ein und bewahrt die erklärende Funktion natürlich im Deutschen.
- source_word: חַסְדְּךָ
  choice: deine beständige Liebe
  rationale: חֶסֶד umfasst treue, verlässliche und oft bundbezogene Liebe und Güte. „Beständige Liebe“ verbindet Zuneigung mit Dauerhaftigkeit, ohne den Ausdruck auf einen einzigen theologischen Fachbegriff zu verengen.
- source_word: לְנֶגֶד עֵינַי
  choice: steht mir vor Augen
  rationale: Gibt die hebräische Wendung idiomatisch wieder und bezeichnet etwas, das der Sprecher bewusst im Blick behält.
- source_word: וְהִתְהַלַּכְתִּי
  choice: und ich bin … meinen Weg gegangen
  rationale: Bewahrt das hebräische Bild des Gehens als Lebensführung. Das Perfekt wird als bisherige, für die Gegenwart relevante Lebenspraxis ausgedrückt.
- source_word: בַּאֲמִתֶּךָ
  choice: in deiner Wahrheit
  rationale: אֱמֶת kann Wahrheit, Treue und Verlässlichkeit bezeichnen. „In deiner Wahrheit“ erhält die Breite des Ausdrucks; die mögliche Bedeutung „Treue“ wird in einer Fußnote ausgewiesen.
theological_decisions:
- issue: Bedeutungsbreite der göttlichen Beziehungsbegriffe חֶסֶד und אֱמֶת
  choice: חֶסֶד wird als „beständige Liebe“ und אֱמֶת als „Wahrheit“ wiedergegeben.
  alternative: Für חֶסֶד ist „Bundestreue“, für אֱמֶת „Treue“ möglich.
  rationale: Die Wiedergabe bewahrt die Spannung zwischen Gottes liebevoller Loyalität, Wahrheit und Verlässlichkeit, ohne den Vers auf eine bestimmte konfessionelle oder systematisch-theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Metapher des Gehens als Lebensführung bleibt erhalten; die Formulierung ist zugleich für heutige Leser verständlich.
