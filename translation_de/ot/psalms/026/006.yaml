  text: אֶרְחַ֣ץ בְּ/נִקָּי֣וֹן כַּפָּ֑/י וַ/אֲסֹבְבָ֖ה אֶת מִזְבַּחֲ/ךָ֣ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/006.yaml
  text: I wash my hands in innocence[a], and go around your altar, O Yahweh[b],
translation:
  language: de
  text: Ich wasche meine Hände in Unschuld[a] und umschreite[b] deinen Altar, Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Reinheit“ oder „in Lauterkeit“. Das hebräische Wort kann sowohl moralische Unschuld als auch Reinheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Verbform kann auch einen entschlossenen Willen ausdrücken: „und will deinen Altar umschreiten“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֶרְחַץ
  choice: Ich wasche
  rationale: Das Qal-Imperfekt der 1. Person Singular kann hier eine gegenwärtige, wiederholte oder anschaulich dargestellte Handlung bezeichnen. Das Präsens passt natürlich zur Selbstaussage des Psalmbeters, ohne den Vers unnötig auf die Zukunft festzulegen.
- source_word: בְּנִקָּיוֹן
  choice: in Unschuld
  rationale: נִקָּיוֹן umfasst Reinheit, Sauberkeit und Schuldlosigkeit. „In Unschuld“ bewahrt im Zusammenhang von Psalm 26 besonders die ethische Dimension, ohne den möglichen Reinheitsbezug auszuschließen.
- source_word: כַּפָּי
  choice: meine Hände
  rationale: כף bezeichnet wörtlich die Handflächen beziehungsweise Hände. Die deutsche Wendung „die Hände waschen“ ist hier die natürliche Entsprechung.
- source_word: וַאֲסֹבְבָה
  choice: und umschreite
  rationale: סבב bedeutet „herumgehen, umkreisen, umschreiten“. „Umschreiten“ gibt die konkrete Bewegung um den Altar knapp und in einem würdigen poetischen Register wieder. Die Kohortativform kann zusätzlich Entschlossenheit ausdrücken; diese Möglichkeit wird in einer Fußnote bewahrt.
- source_word: מִזְבַּחֲךָ
  choice: deinen Altar
  rationale: מִזְבֵּחַ mit dem Suffix der 2. Person maskulin Singular bedeutet eindeutig „dein Altar“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen Form von YHWH, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Moralische Unschuld und kultische Reinheit in בְּנִקָּיוֹן
  choice: Unschuld im Haupttext, Reinheit als Alternative in der Fußnote
  alternative: Reinheit
  rationale: Der unmittelbare Zusammenhang des Händewaschens und des Altars lässt einen Reinheitsbezug anklingen, während Psalm 26 die moralische Lauterkeit des Beters betont. Die Übersetzung bewahrt beide Dimensionen, ohne sie gleichzusetzen oder eine davon auszuschließen.
- issue: Aussage oder Entschluss in וַאֲסֹבְבָה
  choice: umschreite
  alternative: will ich deinen Altar umschreiten
  rationale: Die Kohortativform kann Willen oder Entschlossenheit signalisieren, steht hier aber in poetischer Folge zur ersten Verbform. Das Präsens liest sich als zusammenhängende Selbstaussage; die voluntative Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Umschreite“ ist leicht gehoben, aber verständlich und für die kultisch-poetische Szene präziser als das umständliche „gehe um … herum“. Der Gottesname erscheint in der im Deutschen gebräuchlichen Form „Jahwe“.
