source:
  edition: WLC
  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: de
  text: Prüfe mich, Jahwe, und erprobe mich; läutere meine Nieren[a] und mein Herz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen die „Nieren“ bildlich für das tiefste Innere des Menschen, besonders für seine Gedanken und Empfindungen.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: Prüfe mich
  rationale: בחן bezeichnet das prüfende Untersuchen oder Erweisen. „Prüfe mich“ ist im Deutschen natürlich und bewahrt den forschenden Charakter des ersten Imperativs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְנַסֵּנִי
  choice: und erprobe mich
  rationale: נסה überschneidet sich mit בחן, hebt aber das Erproben durch eine Prüfung hervor. „Erprobe“ erhält die poetische Parallelität, ohne beide Verben gleich wiederzugeben.
- source_word: צרופה
  choice: läutere
  rationale: צרף ist ein Begriff aus der Metallverarbeitung und bezeichnet das Läutern oder Reinigen. „Läutere“ bewahrt dieses Bild und passt zum gehobenen poetischen Register.
- source_word: כִלְיוֹתַי
  choice: meine Nieren
  rationale: Das Hebräische nennt wörtlich die Nieren als Bild für das tiefste Innere, besonders Gedanken und Empfindungen. Das konkrete Körperbild bleibt im Haupttext erhalten und wird in einer Fußnote erklärt.
- source_word: וְלִבִּי
  choice: und mein Herz
  rationale: לֵב bezeichnet das innere Zentrum von Denken, Wollen und Empfinden. „Herz“ ist die natürliche deutsche Entsprechung und erhält den Parallelismus mit „Nieren“.
theological_decisions:
- issue: Anthropologische Bildsprache der hebräischen Poesie
  choice: Die konkreten Körperbilder „Nieren“ und „Herz“ werden beibehalten.
  alternative: „Läutere meine Gedanken und mein Herz“ oder „Prüfe mein Innerstes und mein Herz“.
  rationale: Der Ausgangstext spricht mit körperbezogener Bildsprache vom inneren Menschen. Ihre Beibehaltung wahrt die poetische Eigenart und vermeidet, die Bedeutung im Haupttext auf eine einzige Deutung zu verengen; die idiomatische Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die Anrede „Jahwe“ bewahrt den Gottesnamen; „läutere“ erhält das metallurgische Bild. Der Semikolon gliedert die beiden parallelen Bitten.
