  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: de
  text: Von David. Schaffe mir Recht[a], Jahwe, denn ich habe in meiner Lauterkeit[b] gelebt und auf Jahwe vertraut; ich werde nicht wanken[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Richte mich“. Das hebräische Verb kann allgemein „richten“ bedeuten; hier ist wahrscheinlich ein Urteil zugunsten des Beters gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in meiner Unsträflichkeit“. Das hebräische Wort bezeichnet Lauterkeit, Unversehrtheit oder untadelige Lebensführung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ich werde nicht straucheln“ beziehungsweise „nicht ins Wanken geraten“. Das hebräische Bild handelt vom Verlust des festen Standes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe deutsche Überschrift bewahrt die mögliche Angabe von Urheberschaft oder Zugehörigkeit, ohne sie genauer festzulegen.
- source_word: שָׁפְטֵנִי
  choice: Schaffe mir Recht
  rationale: Im Kontext bittet der Sprecher nicht nur allgemein darum, gerichtet zu werden, sondern um ein Urteil, das seine Lauterkeit bestätigt. Die Formulierung gibt diese kontextuelle Bedeutung natürlich wieder.
- source_word: בְּתֻמִּי
  choice: in meiner Lauterkeit
  rationale: Der Ausdruck bezeichnet persönliche Integrität, Unversehrtheit oder untadelige Lebensführung; „Lauterkeit“ bewahrt diesen ethischen Sinn, ohne absolute Sündlosigkeit zu behaupten.
- source_word: לֹא אֶמְעָד
  choice: ich werde nicht wanken
  rationale: Das Verb beschreibt das Verlieren des festen Standes. „Wanken“ erhält das Bild und lässt sowohl standhaftes Vertrauen als auch dessen erwartete Folge anklingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und entspricht damit unmittelbar dem hebräischen Text.
theological_decisions:
- issue: Aussage über die eigene Lauterkeit
  choice: Die Formulierung „in meiner Lauterkeit“ wird ohne Abschwächung beibehalten.
  alternative: Eine Umschreibung wie „mit gutem Gewissen“ oder eine Deutung als Behauptung völliger Sündlosigkeit.
  rationale: Der hebräische Text behauptet persönliche Integrität im vorliegenden Rechts- und Gebetskontext, bestimmt aber nicht ausdrücklich deren Verhältnis zu allgemeiner menschlicher Sündhaftigkeit.
- issue: Beziehung zwischen Vertrauen und Standfestigkeit
  choice: Die beiden Aussagen werden mit einem Semikolon verbunden, ohne eine ausdrückliche Folgerung einzufügen.
  alternative: „Darum werde ich nicht wanken“ oder „ohne zu wanken“.
  rationale: Der hebräische Text enthält hier kein ausdrücklich folgerndes Bindewort; die sachliche Beziehung bleibt dadurch offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Kürze und das Bild des festen Standes bleiben erhalten; zugleich werden schwerfällige Hebraismen vermieden.
