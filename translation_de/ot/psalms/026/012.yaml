  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: de
  text: Mein Fuß steht auf ebenem Grund[a]; in den Versammlungen will ich Jahwe preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an einem ebenen Ort«; das hebräische Wort kann zugleich Geradheit oder Rechtschaffenheit anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: Mein Fuß
  rationale: Der hebräische Text hat den Singular mit Suffix der 1. Person Singular. Der Singular ist auch im Deutschen natürlich und bewahrt das Bild persönlicher Standfestigkeit.
- source_word: עָמְדָה
  choice: steht
  rationale: Das Qal-Perfekt, abgestimmt auf das feminine Singularsubjekt »Fuß«, bezeichnet hier am natürlichsten einen erreichten und fortdauernden Zustand.
- source_word: בְּמִישׁוֹר
  choice: auf ebenem Grund
  rationale: מִישׁוֹר bezeichnet ebenes Gelände beziehungsweise einen ebenen Ort. Die konkrete räumliche Metapher bleibt erhalten; ein möglicher Anklang an Geradheit oder Rechtschaffenheit wird nicht vereindeutigt.
- source_word: בְּמַקְהֵלִים
  choice: in den Versammlungen
  rationale: Der Plural von קהל bezeichnet Zusammenkünfte versammelter Menschen. »Versammlungen« erhält den Plural und vermeidet eine unnötig konfessionelle Einengung.
- source_word: אֲבָרֵךְ
  choice: will ich preisen
  rationale: Das Piel von ברך bedeutet gegenüber Gott wörtlich »segnen«, bezeichnet im Deutschen jedoch idiomatisch das Lobpreisen Gottes. »Will ich preisen« gibt den deklarativen beziehungsweise voluntativen Sinn natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im modernen Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Wiedergabe »Jahwe« bewahrt seinen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Möglicher moralischer Beiklang von מִישׁוֹר
  choice: Konkretes Bild »auf ebenem Grund« im Haupttext
  alternative: »in Rechtschaffenheit«
  rationale: Die räumliche Bedeutung ist unmittelbar und passt zum Bild des stehenden Fußes. Ein möglicher Beiklang von Geradheit oder Rechtschaffenheit wird in der Fußnote genannt, aber nicht als alleinige Deutung in den Text eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Der Singular »Fuß« und der Plural »Versammlungen« werden formal bewahrt; die Semantik von ברך wird bei Gott idiomatisch mit »preisen« wiedergegeben.
