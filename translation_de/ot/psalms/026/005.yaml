id: PSA.26.5
reference: Psalms 26:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׂ֭נֵאתִי קְהַ֣ל מְרֵעִ֑ים וְ/עִם רְ֝שָׁעִ֗ים לֹ֣א אֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/005.yaml
  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: de
  text: Ich hasse die Versammlung der Übeltäter[a] und werde nicht bei den Gottlosen sitzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe die Gemeinschaft der Übeltäter gehasst.« Das hebräische Perfekt kann vergangenheitsbezogen wiedergegeben werden; hier bezeichnet es wahrscheinlich die gefestigte Haltung des Beters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Ich hasse
  rationale: Das Qal-Perfekt in der 1. Person Singular bezeichnet hier am ehesten eine gefestigte Haltung. Das deutsche Präsens gibt diesen anhaltenden Zustand natürlich wieder; »ich habe gehasst« bleibt grammatisch möglich.
- source_word: קְהַל
  choice: Versammlung
  rationale: קהל bezeichnet eine zusammengekommene Gruppe. »Versammlung« bewahrt den kollektiven Sinn, ohne hier unnötig eine gottesdienstliche Gemeinde anzudeuten.
- source_word: מְרֵעִים
  choice: Übeltäter
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Menschen, die Böses tun. »Übeltäter« ist knapp, verständlich und erhält den charakterisierenden Sinn.
- source_word: וְעִם
  choice: und … bei
  rationale: Konjunktion und Präposition verbinden den zweiten Versabschnitt mit dem ersten. Im Deutschen wird עִם bei ישב idiomatisch mit »bei … sitzen« wiedergegeben.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch schuldige oder frevelhafte Menschen. »Gottlose« ist im Psalmenregister geläufig und steht poetisch parallel zu »Übeltäter«, ohne die mögliche Wiedergabe »Frevler« auszuschließen.
- source_word: לֹא אֵשֵׁב
  choice: werde nicht … sitzen
  rationale: Der negierte Imperfekt kann Entschlossenheit oder dauernde Weigerung ausdrücken. »Werde nicht … sitzen« erhält sowohl das Bild des Sitzens als auch den entschiedenen Zukunfts- bzw. Willensbezug.
theological_decisions:
- issue: Bedeutungsumfang von רְשָׁעִים
  choice: die Gottlosen
  alternative: die Frevler / die Schuldigen
  rationale: Der Kontext spricht von moralisch verwerflichen Menschen und ihrer Gemeinschaft. »Gottlose« entspricht dem würdevollen poetischen Register, soll aber nicht als Aussage über eine bestimmte konfessionelle oder soziale Gruppe verstanden werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. »Bei den Gottlosen sitzen« bewahrt das konkrete hebräische Bild und bezeichnet Gemeinschaft beziehungsweise bewusste Verbindung.
