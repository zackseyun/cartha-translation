base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: de
  text: 'Raffe meine Seele nicht mit den Sündern hinweg[a],

    noch mein Leben mit Menschen, die Blut vergießen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sammle meine Seele nicht mit den Sündern.“ Das Verb kann hier bedeuten, zusammen mit den Gottlosen im Gericht weggenommen zu werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Männer des Blutes“ beziehungsweise „der Bluttaten“; eine hebräische Wendung für gewalttätige oder blutschuldige Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: raffe … hinweg
  rationale: אָסַף bedeutet grundlegend „sammeln“, kann in diesem Gerichtskontext jedoch das gemeinsame Wegnehmen oder Hinwegraffen bezeichnen. Die gewählte Wendung gibt den kontextuellen Sinn natürlich wieder; die wörtlichere Bildsprache steht in der Fußnote.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. „Meine Seele“ wahrt hier den Unterschied zum parallelen חַיָּי, ohne eine technische Leib-Seele-Lehre festzulegen.
- source_word: חַטָּאִים
  choice: Sünder
  rationale: Das Substantiv bezeichnet Menschen, die durch Sünde gekennzeichnet sind; „Sünder“ ist knapp, geläufig und entspricht der moralischen Kategorie des Hebräischen.
- source_word: אַנְשֵׁי דָמִים
  choice: Menschen, die Blut vergießen
  rationale: Wörtlich „Männer des Blutes/der Bluttaten“ ist eine hebräische Wendung für gewalttätige oder blutschuldige Menschen. Die Übersetzung bewahrt das Blutmotiv, ist geschlechtsübergreifend verständlich und verengt die Aussage nicht ausschließlich auf bereits begangenen Mord.
- source_word: חַיָּי
  choice: mein Leben
  rationale: Im Parallelismus zu נַפְשִׁי bezeichnet חַיָּי natürlich das Leben des Beters und erhält die poetische Zweigliedrigkeit.
- source_word: אַל
  choice: nicht
  rationale: אַל mit Imperfekt formuliert hier eine verneinte Bitte. Im deutschen Gebetsstil gibt der Imperativ „Raffe … nicht“ diese Funktion klar wieder.
theological_decisions:
- issue: Anthropologische Nuance von נַפְשִׁי und חַיָּי
  choice: Die zwei poetisch parallelen Ausdrücke werden als „meine Seele“ und „mein Leben“ unterschieden.
  alternative: Beide Ausdrücke könnten stärker angeglichen werden, etwa als „mich“ und „mein Leben“.
  rationale: Der Vers entfaltet keine technische Anthropologie, verwendet aber bewusst zwei verwandte, nicht völlig identische Begriffe. Die Unterscheidung erhält die poetische und theologische Spannung, ohne einen Leib-Seele-Dualismus einzulesen.
- issue: Gemeinsames Geschick im Gericht
  choice: „hinwegraffen“ bringt zum Ausdruck, dass der Beter nicht zusammen mit den Sündern beseitigt werden möchte.
  alternative: „sammeln“ würde das Grundbild des Verbs unmittelbarer erhalten, ließe den Gerichtssinn im Deutschen aber undeutlich.
  rationale: Der Kontext erlaubt sowohl das Sammelbild als auch die Bedeutung des Wegnehmens im Gericht. Der Haupttext gibt den wahrscheinlichen kontextuellen Sinn wieder, während die Fußnote die genuine lexikalische Alternative bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Hinwegraffen“ ist gehoben, aber allgemein verständlich und für den Gerichtskontext treffend. Die geschlechtsübergreifende Formulierung „Menschen“ gibt die idiomatische Bedeutung von אַנְשֵׁי wieder.
