lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: hören zu lassen
  rationale: 'Der Hifil-Infinitiv von שׁמע ist kausativ: »hören lassen«. Die Formulierung bewahrt diese Bedeutung und bleibt im Deutschen verständlich.'
- source_word: בְּקוֹל תּוֹדָה
  choice: die Stimme des Dankes
  rationale: בְּקוֹל bezeichnet hier die hörbare Stimme, תּוֹדָה den ausgesprochenen oder gesungenen Dank. Im Zusammenhang mit »hören lassen« wird die Präposition בְּ im Deutschen idiomatisch nicht eigens wiedergegeben.
- source_word: וּלְסַפֵּר
  choice: und … zu erzählen
  rationale: ספר im Piel bedeutet ausführlich erzählen oder berichten; »erzählen« ist natürlich und erhält die poetische Parallelität.
- source_word: כָּל
  choice: all
  rationale: Das Wort bezeichnet umfassend die Gesamtheit.
- source_word: נִפְלְאוֹתֶיךָ
  choice: deine Wundertaten
  rationale: Der Plural bezeichnet Gottes außergewöhnliche, staunenswerten Taten; »Wundertaten« gibt den Handlungsbezug knapp und idiomatisch wieder.
