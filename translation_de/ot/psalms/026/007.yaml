  text: um den Dank laut zu verkünden[a] und all deine Wundertaten zu erzählen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um die Stimme des Dankes hören zu lassen«. Wörtlich: »um mit der Stimme des Dankes hören zu lassen«; das hebräische Verb ist kausativ.'
