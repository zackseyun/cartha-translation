  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: de
  text: Jahwe, ich liebe die Stätte deines Hauses, den Ort, an dem deine Herrlichkeit wohnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jahwe, ich habe die Wohnstätte deines Hauses geliebt und den Ort der Wohnstätte deiner Herrlichkeit.“'
    reason: Bewahrt den möglichen Perfektaspekt von אָהַבְתִּי sowie die nominale Form der zweiten Vershälfte.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָהַבְתִּי
  choice: ich liebe
  rationale: Das hebräische Perfekt bezeichnet hier im poetischen Bekenntnis eine beständige Haltung; das deutsche Präsens gibt dies natürlich wieder.
- source_word: מְעוֹן בֵּיתֶךָ
  choice: die Wohnung deines Hauses
  rationale: Die konkrete Bildsprache von מְעוֹן und בַּיִת bleibt erhalten; „Haus“ wird nicht deutend zu „Tempel“ erweitert.
- source_word: וּמְקוֹם
  choice: den Ort
  rationale: Die mit וְ angeschlossene Wendung wird im Deutschen als erklärende Apposition wiedergegeben.
- source_word: מִשְׁכַּן
  choice: an dem … wohnt
  rationale: Das Nomen „Wohnstätte“ in der hebräischen Konstruktverbindung wird für natürliches Deutsch verbal wiedergegeben.
- source_word: כְּבוֹדֶךָ
  choice: deine Herrlichkeit
  rationale: „Herrlichkeit“ entspricht dem auf Gottes offenbarte Gegenwart bezogenen כָּבוֹד.
theological_decisions:
- issue: Bezeichnung des Heiligtums
  choice: „deines Hauses“ und „der Ort, an dem deine Herrlichkeit wohnt“
  alternative: „deines Tempels“ beziehungsweise „wo deine Herrlichkeit thront“
  rationale: Die Übersetzung bewahrt die konkreten hebräischen Bilder, ohne das Haus ausdrücklich als Tempel zu bestimmen oder das Wohnen als Thronen zu interpretieren.
- issue: Gottesname
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext stehende Eigenname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewöhnliche Wendung „Wohnung deines Hauses“ erhält die verdichtete hebräische Heiligtumsbildsprache; die zweite Hälfte wird zur besseren Verständlichkeit behutsam verbalisiert.
