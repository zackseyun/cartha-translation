translation:
  language: de
  text: Denn ich vertraue[a] nicht auf meinen Bogen, und mein Schwert rettet mich nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ich werde nicht auf meinen Bogen vertrauen, und mein Schwert wird mich nicht retten.“ Die hebräischen Verbformen können auch zukunftsbezogen verstanden werden.'
    reason: lexical_alternative
  - marker: b
