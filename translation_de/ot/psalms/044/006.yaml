lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Aussage im Zusammenhang ein und wahrt den erklärenden Charakter des Verses.
- source_word: בְקַשְׁתִּי
  choice: auf meinen Bogen
  rationale: קֶשֶׁת bezeichnet den Bogen als Waffe; die Präposition ב gehört sinngemäß zu בטח und wird im Deutschen bei „vertrauen“ natürlich mit „auf“ wiedergegeben.
- source_word: אֶבְטָח
  choice: ich vertraue nicht
  rationale: בטח im Qal bedeutet „vertrauen, sich verlassen auf“. Der Imperfekt kann hier eine allgemeine gegenwärtige Haltung ausdrücken; eine zukunftsbezogene Wiedergabe bleibt möglich und wird in der Fußnote genannt.
- source_word: וְחַרְבִּי
  choice: und mein Schwert
  rationale: Direkte Wiedergabe von חֶרֶב mit Suffix der ersten Person Singular; „und“ erhält den poetischen Parallelismus zwischen Bogen und Schwert.
- source_word: תוֹשִׁיעֵנִי
  choice: rettet mich nicht
  rationale: Der Hifil von ישׁע kann „retten, befreien, den Sieg geben“ bedeuten. „Retten“ bewahrt die weitere Bedeutungsbreite, während der militärische Zusammenhang andere Nuancen zulässt.
theological_decisions:
- issue: Bedeutung der Rettungssprache im militärischen Zusammenhang
  choice: „rettet mich“
  alternative: „verschafft mir den Sieg“ oder „befreit mich“
  rationale: Der Kriegskontext macht „den Sieg verschaffen“ plausibel; „retten“ wahrt jedoch die breitere Bedeutung des hebräischen Verbs und die Spannung zwischen konkreter militärischer Hilfe und umfassender Rettung, ohne den Sinn vorschnell einzuengen.
- issue: Zeitliche Nuance der hebräischen Imperfektformen
  choice: 'allgemeine Gegenwart: „vertraue nicht“ / „rettet mich nicht“'
  alternative: 'Zukunft: „werde nicht vertrauen“ / „wird mich nicht retten“'
  rationale: Im poetischen Kontext können die Formen eine andauernde oder grundsätzliche Haltung ausdrücken. Da zugleich eine zukunftsartige Lesart grammatisch möglich ist, wird sie ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an den hebräischen Parallelismus. Die Formulierung ist verständlich und vermeidet sowohl unnötige Archaismen als auch eine konfessionelle Einengung.
