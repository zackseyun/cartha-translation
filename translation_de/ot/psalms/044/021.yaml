  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: de
  text: Würde Gott das nicht erforschen? Denn er kennt das Verborgene des Herzens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Geheimnisse des Herzens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Würde … nicht
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; die deutsche Form bewahrt sowohl den Fragecharakter als auch den würdigen Ton.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier als singularischer Gottestitel den Gott Israels.
- source_word: יַחֲקָר
  choice: ergründen
  rationale: Das Verb bezeichnet gründliches Suchen und Prüfen. „Ergründen“ gibt hier die Untersuchung verborgener Sachverhalte idiomatisch und prägnant wieder.
- source_word: זֹאת
  choice: das
  rationale: Das Demonstrativpronomen verweist knapp auf den zuvor behandelten Sachverhalt; „das“ ist im modernen Deutschen natürlicher als „dies“.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die rhetorische Frage ein.
- source_word: יֹדֵעַ
  choice: kennt
  rationale: Das Partizip beschreibt Gottes beständige Kenntnis; bei einem substantivischen Objekt ist „kennt“ im Deutschen idiomatisch.
- source_word: תַּעֲלֻמוֹת
  choice: das Verborgene
  rationale: Der Plural bezeichnet verborgene Dinge oder Geheimnisse. Der deutsche Kollektivausdruck wahrt die lexikalische Weite und klingt natürlich.
- source_word: לֵב
  choice: Herzens
  rationale: „Herz“ bewahrt die hebräische Bildsprache für das innere Leben einschließlich Denken, Wollen und Empfinden.
theological_decisions:
- issue: Anthropologischer Ausdruck לֵב
  choice: Herz
  alternative: Inneres; Denken
  rationale: Der hebräische Begriff umfasst Denken, Willen und Empfinden. „Herz“ bewahrt diese Breite und die biblische Metaphorik, ohne sie auf einen einzelnen Aspekt zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die knappe Begründungsstruktur des Hebräischen bleiben erhalten; „ergründen“ vermeidet eine umständliche Wiedergabe und trägt dem Motiv göttlicher Durchforschung Rechnung.
