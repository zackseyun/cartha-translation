  text: תְּשִׂימֵ֣/נוּ חֶ֭רְפָּה לִ/שְׁכֵנֵ֑י/נוּ לַ֥עַג וָ֝/קֶ֗לֶס לִ/סְבִיבוֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/013.yaml
  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: de
  text: Du hast uns unseren Nachbarn zum Gespött gemacht, zum Hohn und Spott für alle, die uns umgeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Du hast uns unseren Nachbarn zur Schmach gemacht, zum Hohn und Spott für die, die uns umgeben.“ Die gehäuften Begriffe betonen die öffentliche Verachtung durch die umliegenden Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Du hast uns … gemacht
  rationale: Das Qal-Perfekt von שׂים bezeichnet hier, an Gott gerichtet, das eingetretene Ergebnis; die deutsche Perfektform gibt dies natürlich wieder.
- source_word: חֶרְפָּה
  choice: zum Gespött
  rationale: חֶרְפָּה bezeichnet Schmach, Beschimpfung oder öffentlichen Spott. „Zum Gespött“ ist im Deutschen idiomatisch und bewahrt die Aussage, dass Israel anderen zum Gegenstand der Verachtung geworden ist.
- source_word: לִשְׁכֵנֵינוּ
  choice: unseren Nachbarn
  rationale: ל markiert hier die Beziehung zu den benachbarten Völkern; der Dativ nach „zum Gespött gemacht“ gibt die hebräische Wendung natürlich wieder.
- source_word: לַעַג
  choice: Hohn
  rationale: לַעַג bezeichnet höhnisches Verspotten oder spöttisches Gelächter; „Hohn“ bildet zusammen mit „Spott“ eine natürliche deutsche Paarung.
- source_word: קֶלֶס
  choice: Spott
  rationale: קֶלֶס bezeichnet verächtlichen Spott beziehungsweise Schmähung. „Spott“ wahrt die parallele Verstärkung, ohne eine künstliche Bedeutungsdifferenz zum seltenen לַעַג zu behaupten.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: für alle, die uns umgeben
  rationale: Die substantivierte Wendung meint die ringsum lebenden Gruppen oder Völker. Die Formulierung bleibt breit und ist in modernem Deutsch verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede Gottes bleibt im vertraulichen Singular „du“. Die idiomatische Wendung „zum Gespött machen“ trägt den Sinn von חֶרְפָּה im Kontext öffentlicher Schmähung; die parallelen Substantive werden knapp und klanglich angemessen als „Hohn und Spott“ wiedergegeben.
