source:
  edition: WLC
  text: תִּ֭תְּנֵ/נוּ כְּ/צֹ֣אן מַאֲכָ֑ל וּ֝/בַ/גּוֹיִ֗ם זֵרִיתָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: de
  text: Du gibst uns preis wie Schafe zum Fraß[a] und hast uns unter die Völker zerstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wie Schafe als Nahrung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: Du gibst uns preis
  rationale: נתן bedeutet grundsätzlich „geben/setzen“. Im Klagezusammenhang bezeichnet es hier das Ausliefern an ein feindliches Geschick; „preisgeben“ bringt diesen Sinn im Deutschen natürlich zum Ausdruck.
- source_word: כְּצֹאן
  choice: wie Schafe
  rationale: Die Präposition כ kennzeichnet einen Vergleich; „wie Schafe“ erhält das Bild direkt und idiomatisch.
- source_word: מַאֲכָל
  choice: zum Fraß
  rationale: Das Substantiv bezeichnet Nahrung beziehungsweise das Essen. „Zum Fraß“ gibt im Zusammenhang mit Schafen knapp und anschaulich wieder, dass das Volk wie Beute behandelt wird, ohne das nicht ausdrücklich genannte „Schlachten“ einzutragen.
- source_word: וּבַגּוֹיִם
  choice: unter die Völker
  rationale: גּוֹיִם meint hier fremde Völker. Zusammen mit dem Verb des Zerstreuens ist „unter die Völker“ im Deutschen die natürliche Richtungsangabe.
- source_word: זֵרִיתָנוּ
  choice: hast uns zerstreut
  rationale: זרה bedeutet „zerstreuen“ und kann auch das Worfeln bezeichnen. Hier ist die Zerstreuung Israels unter fremde Völker gemeint; das Perfekt wird als abgeschlossene Handlung mit gegenwärtiger Auswirkung wiedergegeben.
theological_decisions:
- issue: Bild des Volkes als Schafe, die zur Nahrung werden
  choice: Das drastische Bild bleibt als „wie Schafe zum Fraß“ erhalten.
  alternative: wie Schafe zum Schlachten; wie Schafe, die gefressen werden
  rationale: Der Vers klagt darüber, dass Gott sein Volk schutzlos preisgibt. מַאֲכָל bezeichnet Nahrung oder Essen, nicht ausdrücklich das Schlachten; daher wird das Bild weder abgeschwächt noch unnötig präzisiert.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Klagesprache. „Preisgeben“ macht die kontextuelle Kraft von נתן deutlich; die wechselnden Verbzeiten des Hebräischen werden mit Präsens und Perfekt bewahrt.
