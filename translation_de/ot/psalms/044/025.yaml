base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/025.yaml
  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: de
  text: Denn unsere Seele[a] ist in den Staub hinabgesunken[b]; unser Bauch haftet an der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder für „unsere Seele“: „unser Leben“ oder „wir selbst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat sich bis zum Staub niedergebeugt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet im Zusammenhang die Begründung für die anschließende Bitte ein; „Denn“ bewahrt diese kausale Funktion in natürlichem Deutsch.
- source_word: שָׁחָה
  choice: ist hinabgesunken
  rationale: Das Verb bezeichnet ein tiefes Sichbeugen oder Niedersinken. In Verbindung mit „in den Staub“ gibt „hinabgesunken“ das Bild der äußersten Erniedrigung anschaulich wieder.
- source_word: לֶעָפָר
  choice: in den Staub
  rationale: עָפָר bedeutet „Staub“. Das deutsche „in den Staub“ verbindet sich idiomatisch mit „hinabgesunken“ und bewahrt das Bild von Erniedrigung und Sterblichkeit.
- source_word: נַפְשֵׁנוּ
  choice: unsere Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. „Unsere Seele“ erhält die poetische und anthropologische Offenheit des Ausdrucks; eine Fußnote nennt natürliche Alternativen.
- source_word: דָּבְקָה
  choice: haftet
  rationale: Das Verb bezeichnet enges Anhaften oder Festkleben. „Haftet“ ist würdevoll und stellt die bedrängende Nähe zur Erde deutlich dar.
- source_word: לָאָרֶץ
  choice: an der Erde
  rationale: אֶרֶץ kann Erde, Land oder Boden bedeuten. Im Parallelismus mit „Staub“ bewahrt „Erde“ den poetischen Umfang des Bildes.
- source_word: בִּטְנֵנוּ
  choice: unser Bauch
  rationale: בֶּטֶן bezeichnet wörtlich den Bauch beziehungsweise den inneren Leib. „Unser Bauch“ erhält das konkrete Bild einer zu Boden gedrückten, hingestreckten Körperhaltung.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשֵׁנוּ
  choice: unsere Seele
  alternative: unser Leben; wir selbst
  rationale: Der poetische Ausdruck kann die Seele, das Leben oder die ganze Person meinen. Die Hauptübersetzung bewahrt die traditionelle Bildsprache, während die Fußnote die Bedeutungsbreite offenhält und keine bestimmte anthropologische Lehre erzwingt.
- issue: Bildgehalt von שָׁחָה
  choice: ist hinabgesunken
  alternative: hat sich niedergebeugt; ist erniedrigt worden
  rationale: „Hinabgesunken“ bewahrt das räumliche Bild und lässt zugleich offen, ob vor allem Körperhaltung, Erniedrigung oder Todesnähe gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an den hebräischen Parallelismus. Das konkrete Körperbild bleibt erhalten; die Bedeutungsbreite von נֶפֶשׁ und שָׁחָה wird nicht vorschnell eingeengt.
