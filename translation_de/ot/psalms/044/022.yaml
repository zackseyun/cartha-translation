  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: de
  text: Denn um deinetwillen[a] werden wir den ganzen Tag getötet; wir gelten als Schafe zum Schlachten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen dir“ oder „deinetwegen“. Das Hebräische kann Leiden bezeichnen, das in Beziehung zu Gott erduldet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wir werden als Schafe zum Schlachten gerechnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Klage; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: עָלֶיךָ
  choice: um deinetwillen
  rationale: Die Wendung bewahrt den Bezug des Leidens auf Gott, ohne Gott ausdrücklich als unmittelbaren Urheber des Tötens darzustellen.
- source_word: הֹרַגְנוּ
  choice: werden wir … getötet
  rationale: Das morphologische Perfekt beschreibt im poetischen Klagezusammenhang eine fortdauernde oder wiederholte Erfahrung; das deutsche Präsens Passiv entspricht diesem Sinn.
- source_word: כָל הַיּוֹם
  choice: den ganzen Tag
  rationale: Dies ist eine natürliche moderne Wiedergabe der fortdauernden Zeitangabe.
- source_word: נֶחְשַׁבְנוּ
  choice: wir gelten
  rationale: „Gelten als“ gibt den passiven wertenden Sinn von חשׁב knapp und idiomatisch wieder.
- source_word: כְּצֹאן
  choice: als Schafe
  rationale: Das vergleichende כְּ wird in der festen Verbindung „als Schafe zum Schlachten“ natürlich wiedergegeben.
- source_word: טִבְחָה
  choice: zum Schlachten
  rationale: Die Form bezeichnet das Schlachten beziehungsweise die Schlachtung; „zum Schlachten“ ist klar, würdig und idiomatisch.
theological_decisions:
- issue: Ob das Leiden von Gott verursacht oder um der Zugehörigkeit zu Gott willen erduldet wird
  choice: „um deinetwillen“
  alternative: „wegen dir“ oder „deinetwegen“
  rationale: 'Die Hauptfassung wahrt die theologische Spannung: Das Leiden geschieht in Beziehung zu Gott und möglicherweise aus Treue zu ihm, ohne die Ursache oder Schuld eindeutiger festzulegen, als es der hebräische Text tut.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klage-Ton. Die traditionelle Wendung „um deinetwillen“ bleibt verständlich und trägt die Mehrdeutigkeit besser als eine stärker kausale Formulierung.
