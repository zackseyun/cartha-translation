  text: תְּשִׁיבֵ֣/נוּ אָ֭חוֹר מִנִּי צָ֑ר וּ֝/מְשַׂנְאֵ֗י/נוּ שָׁ֣סוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/010.yaml
  text: You make us turn back from the foe[b][a], and those who hate us plunder for themselves.
translation:
  language: de
  text: Du lässt uns vor dem Bedränger zurückweichen[a], und die uns hassen, plündern für sich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du treibst uns vor dem Feind zurück.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und die uns hassen, haben Beute für sich genommen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיבֵנוּ
  choice: Du lässt uns … zurückweichen
  rationale: Der Hifil von שוב ist kausativ. Im militärischen Zusammenhang gibt „lässt uns … zurückweichen“ die erzwungene Umkehr natürlich und quellennah wieder.
- source_word: אָחוֹר
  choice: zurückweichen
  rationale: Das adverbiale „zurück“ wird im Deutschen idiomatisch mit dem militärisch passenden Verb „zurückweichen“ verbunden.
- source_word: מִנִּי צָר
  choice: vor dem Bedränger
  rationale: Die Präposition bezeichnet hier das Zurückweichen weg vom Gegner; im Deutschen drückt „vor“ bei „zurückweichen“ diese Beziehung natürlich aus. צָר wird als „Bedränger“ wiedergegeben, um die aktive Bedrohung zu bewahren.
- source_word: מְשַׂנְאֵינוּ
  choice: die uns hassen
  rationale: Die partizipiale Form wird verbal wiedergegeben. So bleibt die aktive Feindschaft erhalten, ohne sie mit dem anders bezeichneten Gegner der ersten Vershälfte gleichzusetzen.
- source_word: שָׁסוּ
  choice: plündern
  rationale: Das Verb bezeichnet das Erbeuten beziehungsweise Plündern. Das historische Präsens passt zur lebendigen Klage und klingt im modernen Deutsch natürlich.
- source_word: לָמוֹ
  choice: für sich
  rationale: 'Das Pronomen wird als Dativ des Vorteils verstanden: Die Hassenden rauben zu ihrem eigenen Nutzen. „Für sich“ gibt dies knapp wieder.'
