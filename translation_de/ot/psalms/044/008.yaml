id: PSA.44.8
reference: Psalms 44:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים הִלַּלְ֣נוּ כָל הַ/יּ֑וֹם וְ/שִׁמְ/ךָ֓ לְ/עוֹלָ֖ם נוֹדֶ֣ה סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/008.yaml
  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: de
  text: Gottes rühmen wir uns den ganzen Tag[a], und deinem Namen werden wir ewig danken[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In Gott jubeln wir den ganzen Tag“ beziehungsweise „Gott preisen wir den ganzen Tag“. Das hebräische Verb kann hier sowohl das Preisen als auch das jubelnde Sich-Rühmen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deinem Namen“. Gottes „Name“ steht in der Bibel auch für sein offenbartes Wesen und sein Ansehen.'
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Gottes
  rationale: Die Präposition ב bezeichnet hier am natürlichsten den Gegenstand bzw. Grund des Rühmens. Die idiomatische deutsche Verbindung „sich Gottes rühmen“ bewahrt diesen Sinn und klingt würdevoll.
- source_word: הִלַּלְנוּ
  choice: rühmen wir uns
  rationale: Der Piel von הלל kann „preisen“ bedeuten; mit בֵּאלֹהִים liegt jedoch die Bedeutung „sich Gottes rühmen“ bzw. „auf Gott stolz sein“ nahe. „Sich rühmen“ erhält die Spannung zwischen Lob und jubelndem Rühmen.
- source_word: כָל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung bezeichnet eine über den ganzen Tag andauernde Handlung. „Den ganzen Tag“ ist im modernen Deutsch natürlich und konkret.
- source_word: וְשִׁמְךָ
  choice: und deinem Namen
  rationale: „Deinem Namen danken“ bildet die hebräische Konstruktion angemessen ab und bewahrt den biblischen Gedanken des Namens als Ausdruck von Gottes offenbartem Wesen und Ansehen.
- source_word: לְעוֹלָם
  choice: ewig
  rationale: לְעוֹלָם bezeichnet hier unbegrenzte Dauer. „Ewig“ ist knapp, idiomatisch und kontextgerecht.
- source_word: נוֹדֶה
  choice: werden wir danken
  rationale: Der Hifil von ידה bedeutet häufig „danken“ oder „preisen“. „Danken“ erhält gegenüber dem ersten Halbvers eine eigene Nuance; die Imperfektform wird als fortdauernde bzw. in die Zukunft reichende Erklärung wiedergegeben.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des liturgischen Ausdrucks ist unsicher; deshalb wird er in der üblichen deutschen Form transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Genitivform „Gottes“ ist leicht gehoben, aber verständlich und bildet die hebräische Hervorhebung Gottes als Grund und Gegenstand des Rühmens gut ab. „Sela“ bleibt als nicht sicher deutbarer liturgischer Ausdruck unübersetzt.
