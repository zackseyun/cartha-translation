  text: כִּ֣י ה֭וֹשַׁעְתָּ/נוּ מִ/צָּרֵ֑י/נוּ וּ/מְשַׂנְאֵ֥י/נוּ הֱבִישֽׁוֹתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/007.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: de
  text: Denn du hast uns vor unseren Bedrängern gerettet und diejenigen beschämt, die uns hassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im poetischen Zusammenhang die vorherige Aussage; „Denn“ gibt diese erklärend-kausale Funktion natürlich wieder.
- source_word: הוֹשַׁעְתָּנוּ
  choice: du hast uns … gerettet
  rationale: Der Hifil von יָשַׁע bezeichnet retten oder befreien. „Gerettet“ bewahrt das unmittelbare Handeln Gottes und den vollendeten Charakter der Aussage.
- source_word: מִצָּרֵינוּ
  choice: vor unseren Bedrängern
  rationale: צַר bezeichnet feindliche Gegenspieler, die jemanden bedrängen. „Bedränger“ bewahrt diesen Aspekt deutlicher als das allgemeinere „Feinde“; die im Deutschen bei „retten“ natürliche Präposition ist „vor“.
- source_word: וּמְשַׂנְאֵינוּ
  choice: und alle …, die uns hassen
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die uns hassen. Der Relativsatz ist im modernen Deutschen natürlicher als „unsere Hasser“; „alle“ macht lediglich die substantivische Gruppe idiomatisch deutlich.
- source_word: הֱבִישׁוֹתָ
  choice: hast … beschämt
  rationale: Der Hifil von בוש bedeutet, jemanden zuschanden zu machen oder zu beschämen. „Beschämt“ gibt die kausative Wirkung knapp und würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Die beiden unterschiedlichen hebräischen Bezeichnungen für Gegner bleiben als „Bedränger“ und „die uns hassen“ erkennbar.
