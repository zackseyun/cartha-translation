  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: de
  text: All dies ist über uns gekommen, doch wir haben dich nicht vergessen und sind deinem Bund nicht untreu geworden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל זֹאת
  choice: All dies
  rationale: Die zusammenfassende Wendung verweist umfassend auf die zuvor geschilderten Leiden und klingt im Deutschen natürlich.
- source_word: בָּאַתְנוּ
  choice: ist über uns gekommen
  rationale: Bewahrt das Bild des hebräischen Verbs בוא, wonach das Unheil über die Betroffenen kommt, und gibt die vollendete Handlung angemessen wieder.
- source_word: וְלֹא
  choice: doch ... nicht
  rationale: Das adversative „doch“ macht den im Zusammenhang liegenden Gegensatz zwischen erlittenem Leid und fortdauernder Bundestreue deutlich, ohne den Sinn zu erweitern.
- source_word: שְׁכַחֲנוּךָ
  choice: wir haben dich nicht vergessen
  rationale: Gibt die direkte Anrede Gottes und die schlichte lexikalische Bedeutung genau wieder.
- source_word: שִׁקַּרְנוּ
  choice: nicht die Treue gebrochen
  rationale: Das Verb שקר bezeichnet hier falsches oder treuloses Handeln; im Zusammenhang mit einem Bund drückt diese deutsche Wendung den Sinn natürlicher aus als das engere „gelogen“.
- source_word: בִּבְרִיתֶךָ
  choice: deinem Bund
  rationale: Der Bund ist der Bezugsbereich des treulosen Handelns. Die Formulierung „deinem Bund die Treue brechen“ ist idiomatisches Deutsch und bewahrt den Bezug auf Gottes Bund.
theological_decisions:
- issue: Art des Unschuldsanspruchs Israels angesichts des Leidens
  choice: Der Vers bezeugt, dass das Volk Gott nicht vergessen und seinem Bund nicht die Treue gebrochen hat.
  alternative: Ein umfassender Anspruch völliger Sündlosigkeit vor Gott.
  rationale: Der hebräische Text nennt zwei konkrete Aspekte der Bundestreue. Die Übersetzung bewahrt diesen begrenzten Anspruch und weitet ihn nicht zu einer Aussage absoluter Sündlosigkeit aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „All dies“ fasst die vorausgehenden Leiden zusammen; „die Treue brechen“ vermittelt die bundestheologische Bedeutung von שקר klar und idiomatisch.
