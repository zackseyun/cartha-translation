  text: מִ֭/קּוֹל מְחָרֵ֣ף וּ/מְגַדֵּ֑ף מִ/פְּנֵ֥י א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/016.yaml
  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: de
  text: wegen der Stimme dessen, der verhöhnt und lästert,[a] wegen des Feindes und des Rächers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen des Rufens dessen, der schmäht und beschimpft«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »vom Angesicht des Feindes und des Rächers«; gemeint ist hier: »wegen« oder »aufgrund von«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: wegen der Stimme
  rationale: מִן bezeichnet hier im parallelen Zusammenhang den Grund oder Anlass; „Stimme“ bewahrt zugleich das konkrete Bild von קוֹל.
- source_word: מְחָרֵף
  choice: dessen, der verhöhnt
  rationale: Das Partizip bezeichnet jemanden, der Hohn und Schmach äußert. „verhöhnt“ ist natürliches heutiges Deutsch und gibt den fortdauernden personalen Charakter wieder.
- source_word: וּמְגַדֵּף
  choice: und lästert
  rationale: גדף kann beschimpfendes, besonders auch frevelhaftes Reden bezeichnen. „lästert“ erhält die mögliche religiöse Tragweite, ohne das Objekt ausdrücklich festzulegen.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Wendung bedeutet wörtlich „vom Angesicht/vor dem Angesicht“, bezeichnet hier jedoch idiomatisch den Grund oder Anlass und entspricht dem parallelen מִקּוֹל.
- source_word: אֹיֵב
  choice: des Feindes
  rationale: Der bestimmte Singular des Deutschen bewahrt die repräsentative beziehungsweise kollektive Einzahl des Hebräischen.
- source_word: וּמִתְנַקֵּם
  choice: und des Rächers
  rationale: Das Hitpael-Partizip bezeichnet einen, der Rache nimmt. „Rächer“ ist knapp und wahrt die personale sowie aktive Bedeutung.
theological_decisions:
- issue: Tragweite des feindseligen Redens in וּמְגַדֵּף
  choice: lästert
  alternative: schmäht / beschimpft
  rationale: „lästert“ lässt sowohl frevelhaftes Reden gegen Gott als auch schwere Schmähung offen. Ein ausdrückliches Objekt wie „Gott“ wird nicht ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „wegen“ bildet den Parallelismus ab; „dessen, der“ erhält die substantivischen Partizipien, ohne schwer verständlich zu werden.
