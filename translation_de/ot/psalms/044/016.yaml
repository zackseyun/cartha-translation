  source_fidelity: Die Übersetzung gibt die beiden kausalen Präpositionalwendungen מִקּוֹל und מִפְּנֵי angemessen mit „wegen“ wieder und bewahrt die Wiederholung des hebräischen Parallelismus. „Stimme dessen, der verhöhnt und lästert“ bildet die partizipialen Personenbezeichnungen sachgerecht ab. „Lästert“ wahrt bei גדף die mögliche religiös-frevlerische Nuance, ohne ein nicht ausdrücklich genanntes Objekt zu ergänzen. „Feind“ und „Rächer“ entsprechen den hebräischen Singularpartizipien bzw. der Einzahl natürlich und präzise.
