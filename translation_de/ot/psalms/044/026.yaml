  text: ק֭וּמָֽ/ה עֶזְרָ֣תָ/ה לָּ֑/נוּ וּ֝/פְדֵ֗/נוּ לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: de
  text: Steh auf, komm uns zur Hilfe[a], und erlöse[b] uns um deiner treuen Liebe[c] willen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Steh auf und hilf uns“. Wörtlich steht im Hebräischen das Substantiv „Hilfe“: „Steh auf, Hilfe für uns“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „befreie uns“ oder „kaufe uns los“. Das hebräische Verb kann Befreiung durch Loskauf oder durch entschiedenes Eingreifen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: „Treue Liebe“ gibt das hebräische Wort ḥesed wieder. Es bezeichnet häufig Gottes beständige, loyale Liebe in seiner Beziehung zu seinem Volk.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Qal-Imperativ von קום ist ein dringender Aufruf an Gott, handelnd einzugreifen. „Steh auf“ bewahrt das anschauliche Bild und klingt im heutigen Deutschen natürlich.
- source_word: עֶזְרָתָה לָנוּ
  choice: uns zur Hilfe
  rationale: עֶזְרָה ist das Substantiv „Hilfe“. Die Formulierung „uns zur Hilfe“ bewahrt diese nominale Ausdrucksweise und gibt לָנוּ als Ausrichtung zugunsten der Betenden wieder, ohne vorschnell zum bloßen Verb „hilf uns“ zu glätten.
- source_word: וּפְדֵנוּ
  choice: und erlöse uns
  rationale: Der Imperativ von פדה mit dem Objektsuffix der 1. Person Plural bezeichnet Befreiung, mitunter durch Loskauf, mitunter durch entschlossenes Eingreifen. „Erlöse uns“ wahrt die umfassende heilvolle und bundestheologische Tragweite, ohne eine konkrete Art der Befreiung festzulegen.
- source_word: לְמַעַן
  choice: um … willen
  rationale: Die Präposition bezeichnet hier den Beweggrund oder die Grundlage des erbetenen Handelns. Die feste Wendung „um deiner … willen“ gibt dies würdig und idiomatisch wieder.
- source_word: חַסְדֶּךָ
  choice: deine treue Liebe
  rationale: חֶסֶד umfasst liebevolle Zuwendung, Beständigkeit und verlässliche Loyalität, besonders im Verhältnis Gottes zu seinem Volk. „Treue Liebe“ hält Liebe und Verlässlichkeit zusammen, ohne den Ausdruck auf „Barmherzigkeit“ oder einen technischen Bundesbegriff zu verengen.
theological_decisions:
- issue: Ob פדה mit einem ausdrücklich theologischen Begriff wiederzugeben ist
  choice: erlöse uns
  alternative: befreie uns; kaufe uns los
  rationale: „Erlöse uns“ bewahrt die Tiefe des göttlichen Rettungshandelns im Psalm, legt aber weder eine Zahlung noch eine später ausformulierte Erlösungslehre in den Vers hinein.
- issue: Wie die bundestheologische Spannweite von חֶסֶד zu bewahren ist
  choice: deine treue Liebe
  alternative: deine Güte; deine Bundestreue; deine Barmherzigkeit
  rationale: „Treue Liebe“ verbindet Zuwendung und beständige Loyalität. So bleibt die Beziehungssprache des Ausdrucks erhalten, ohne ihn ausschließlich als Gefühl, Erbarmen oder formalen Bundesbegriff zu verstehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Der kurze, dringliche Imperativ bleibt erhalten; die nominale Form „Hilfe“ wird trotz ihrer im Deutschen leicht markierten Stellung nicht in eine rein verbale Paraphrase aufgelöst.
