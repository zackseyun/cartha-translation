  yaml_path: translation/ot/psalms/044/015.yaml
  text: All day long my disgrace is before me[a], and the shame of my face has covered me.
translation:
  language: de
  text: Den ganzen Tag steht meine Schmach vor mir, und die Scham meines Gesichts hat mich bedeckt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Scham in meinem Gesicht hat mich bedeckt.“ Wörtlicher: „die Scham meines Gesichts hat mich bedeckt“.'
