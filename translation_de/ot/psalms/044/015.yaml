lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Den ganzen Tag
  rationale: 'Die natürliche deutsche Zeitangabe bewahrt den durativen Sinn: den ganzen Tag hindurch.'
- source_word: כְּלִמָּתִי
  choice: meine Schmach
  rationale: „Schmach“ bezeichnet öffentliche Entehrung und hält zugleich Abstand zum folgenden בֹשֶׁת („Scham“).
- source_word: נֶגְדִּי
  choice: steht … vor mir
  rationale: Die Formulierung gibt die Vorstellung von etwas wieder, das dem Sprecher beständig vor Augen beziehungsweise gegenwärtig ist.
- source_word: וּבֹשֶׁת
  choice: und die Scham
  rationale: „Scham“ ist die direkte Wiedergabe und bildet einen sinnverwandten, aber nicht völlig deckungsgleichen Parallelbegriff zu „Schmach“.
- source_word: פָּנַי
  choice: meines Gesichts
  rationale: Der Genitiv bildet die formale Mehrdeutigkeit des Hebräischen ab, auch wenn im Deutschen „die Scham in meinem Gesicht“ oder „auf meinem Gesicht“ natürlicher wäre.
- source_word: כִּסָּתְנִי
  choice: hat mich bedeckt
  rationale: Die Wiedergabe bewahrt sowohl das Bild des Bedeckens als auch den resultativen Aspekt der hebräischen Perfektform.
