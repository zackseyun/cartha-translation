id: PSA.44.18
reference: Psalms 44:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא נָס֣וֹג אָח֣וֹר לִבֵּ֑/נוּ וַ/תֵּ֥ט אֲשֻׁרֵ֗י/נוּ מִנִּ֥י אָרְחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: de
  text: Unser Herz ist nicht zurückgewichen, und unsere Schritte sind nicht von deinem Pfad abgewichen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: ist nicht zurückgewichen
  rationale: Die Verbindung bezeichnet ein Zurückweichen oder Sich-Zurückziehen. „Zurückgewichen“ bewahrt sowohl die Bewegungsmetapher als auch den möglichen Sinn nachlassender Treue.
- source_word: לִבֵּנוּ
  choice: Unser Herz
  rationale: Der kollektive Singular bezeichnet den inneren Menschen einschließlich Wollen und Treue. Das Bild des Herzens bleibt erhalten und wird nicht auf Verstand oder Gefühl verengt.
- source_word: וַתֵּט
  choice: sind nicht … abgewichen
  rationale: נטה kann ein Neigen, Abbiegen oder Abweichen bezeichnen. Im Zusammenhang mit Schritten und Pfad ist „abweichen“ natürlich und bildgetreu. Die im Hebräischen aus dem ersten Satz fortwirkende Verneinung wird im Deutschen zur Klarheit wiederholt.
- source_word: אֲשֻׁרֵינוּ
  choice: unsere Schritte
  rationale: Das Substantiv bezeichnet Schritte beziehungsweise Tritte und führt die Wegmetapher fort.
- source_word: מִנִּי אָרְחֶךָ
  choice: von deinem Pfad
  rationale: מִנִּי markiert die Trennung, während אֹרַח einen Pfad oder Weg bezeichnet. „Pfad“ erhält das konkrete poetische Bild.
theological_decisions:
- issue: Anthropologische Metapher „Herz“
  choice: Das Bild „Herz“ wird wörtlich beibehalten.
  alternative: „Unser Inneres“ oder „unsere Treue“
  rationale: Das hebräische Herz umfasst Wollen, Denken und Loyalität. Eine ausdeutende Wiedergabe würde den Sinn unnötig verengen.
- issue: Aussage über das Abweichen vom Weg Gottes
  choice: Die parallelen Bewegungsbilder „zurückweichen“ und „vom Pfad abweichen“ werden bewahrt.
  alternative: Eine explizite Deutung als Abfall oder Untreue
  rationale: Der Vers legt eine geistliche und bundestheologische Bedeutung nahe, spricht aber poetisch in Wegbildern; die Übersetzung sollte diese Spannung nicht durch eine Lehrdeutung auflösen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit dichterischem Parallelismus. „Pfad“ ist etwas poetischer als „Weg“, bleibt aber allgemein verständlich; die Wiederholung von „abgewichen“ ist durch das unterschiedliche Präfixbild („zurück-“ / „von … ab-“) ausreichend variiert.
