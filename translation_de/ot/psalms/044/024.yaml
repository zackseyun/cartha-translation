  text: לָֽ/מָּה פָנֶ֥י/ךָ תַסְתִּ֑יר תִּשְׁכַּ֖ח עָנְיֵ֣/נוּ וְֽ/לַחֲצֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: de
  text: Warum verbirgst du dein Angesicht und vergisst unser Elend und unsere Bedrängnis?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Gegenwart“. Wörtlich steht im Hebräischen „dein Angesicht“, eine geläufige Wendung für wohlwollende Zuwendung oder Nähe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Die natürliche deutsche Frage nach dem Grund; sie bewahrt die unmittelbare Klage.
- source_word: פָנֶיךָ
  choice: dein Angesicht
  rationale: Gibt das hebräische Bild wörtlich und in würdig-poetischer Sprache wieder. Gemeint sein können Gottes Zuwendung und Nähe, ohne dass die Metapher im Haupttext aufgelöst wird.
- source_word: תַסְתִּיר
  choice: verbirgst
  rationale: Entspricht dem Hifil von סתר und verbindet sich im Deutschen natürlich mit „dein Angesicht“.
- source_word: תִּשְׁכַּח
  choice: vergisst
  rationale: Bewahrt die kühne, direkte Sprache der Klage; eine Wiedergabe mit „ignorierst“ würde die Aussage bereits auslegen.
- source_word: עָנְיֵנוּ
  choice: unser Elend
  rationale: Bezeichnet Not, Leid oder Elend. „Elend“ ist verständlich, prägnant und lässt die genaue Art des Leidens offen.
- source_word: וְלַחֲצֵנוּ
  choice: unsere Bedrängnis
  rationale: לַחַץ kann äußeren Druck, Unterdrückung oder Bedrängnis bezeichnen. „Bedrängnis“ bewahrt die Breite des Ausdrucks und passt zum poetischen Klagekontext.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes „Angesicht“
  choice: Das körperhafte Beziehungsbild wird als „dein Angesicht“ beibehalten.
  alternative: deine Gegenwart; deine Zuwendung
  rationale: Der hebräische Text spricht bildhaft von Gottes Angesicht als Ausdruck seiner Nähe und günstigen Zuwendung. Die wörtliche Wiedergabe erhält die poetische Kraft und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ ist bewusst poetisch-biblisch gewählt, um das hebräische Bild zu erhalten; die übrige Formulierung bleibt allgemein verständlich.
