id: PSA.44.9
reference: Psalms 44:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַף זָ֭נַחְתָּ וַ/תַּכְלִימֵ֑/נוּ וְ/לֹא תֵ֝צֵ֗א בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: de
  text: Doch du hast uns verworfen und beschämt, und du ziehst nicht mit unseren Heeren aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „in unseren Heeren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Doch
  rationale: Die Partikel markiert hier einen scharfen Gegensatz zu den vorausgehenden Aussagen über Gottes frühere Hilfe. „Doch“ gibt diesen Umschwung im modernen Deutschen knapp und natürlich wieder.
- source_word: זָנַחְתָּ
  choice: du hast uns verworfen
  rationale: זנח bezeichnet das Zurückweisen oder Verstoßen. „Verworfen“ bewahrt die starke relationale Aussage und ist in einem würdevollen Klagepsalm angemessen.
- source_word: וַתַּכְלִימֵנוּ
  choice: und beschämt
  rationale: Die Hifil-Form von כלם drückt aus, dass jemand in Schande gebracht wird. „Beschämt“ gibt den kausativen Sinn knapp wieder, ohne ihn stärker als nötig als öffentliche Demütigung auszulegen.
- source_word: וְלֹא
  choice: und ... nicht
  rationale: Die Verbindung fügt der Zurückweisung und Beschämung eine weitere Klage hinzu; die additive Struktur des Hebräischen bleibt erhalten.
- source_word: תֵצֵא
  choice: du ziehst ... aus
  rationale: יצא bedeutet grundsätzlich „hinausgehen“. Im militärischen Zusammenhang ist „ausziehen“ die natürliche deutsche Entsprechung und bewahrt das Bild des Aufbruchs zum Kampf.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: mit unseren Heeren
  rationale: צְבָאוֹת bezeichnet hier militärische Verbände. Die Präposition ב kann in diesem Zusammenhang begleitend als „mit“ verstanden werden; „Heere“ passt zum poetisch-militärischen Register.
theological_decisions:
- issue: Darstellung von Gottes Rückzug im Kampf
  choice: Der Vers wird als Klage wiedergegeben, dass Gott Israel verworfen hat und nicht mehr mit seinen Heeren in den Kampf zieht.
  alternative: Wörtlicher kann die Präpositionalphrase „in unseren Heeren“ lauten.
  rationale: Die Übersetzung wahrt die Spannung der Klage über Gottes erfahrbare Abwesenheit, ohne deren Ursache zu erklären oder daraus eine weitergehende dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der für einen Klagepsalm angemessenen Direktheit. „Ausziehen“ und „Heere“ bewahren den militärischen und poetischen Charakter, ohne archaisch zu wirken.
