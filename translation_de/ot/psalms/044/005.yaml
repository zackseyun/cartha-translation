  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: de
  text: Durch dich stoßen wir unsere Gegner zurück[a]; in deinem Namen[b] zertreten wir diejenigen, die sich gegen uns erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich, mit Hörnern zu stoßen oder aufzuspießen; hier ist es ein Bild für das kraftvolle Zurückdrängen von Gegnern.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „durch deinen Namen“. Gottes „Name“ bezeichnet hier seine offenbarte Identität, Vollmacht und Macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Durch dich
  rationale: Die Präposition בְּ mit Personalsuffix bezeichnet hier im Zusammenhang militärischen Sieges das Mittel beziehungsweise die entscheidende Wirkkraft. „Durch dich“ drückt natürlich aus, dass der Sieg von Gott abhängt.
- source_word: צָרֵינוּ
  choice: unsere Gegner
  rationale: צָר bezeichnet feindliche Bedränger oder Widersacher. „Gegner“ ist verständlich, knapp und passt zum poetischen Kriegskontext.
- source_word: נְנַגֵּחַ
  choice: stoßen wir … zurück
  rationale: נגח bezeichnet wörtlich das Stoßen oder Aufspießen mit Hörnern und wird hier bildlich für kraftvolles Zurückdrängen gebraucht. Die Formulierung erhält die Stoßbewegung, ohne im Haupttext ein missverständliches Tierbild zu erzwingen.
- source_word: בְּשִׁמְךָ
  choice: in deinem Namen
  rationale: Die Wendung bewahrt die geläufige hebräische Ausdrucksweise. „Name“ steht dabei für Gottes offenbarte Identität, Vollmacht und Macht; die Formulierung lässt sowohl bevollmächtigtes Handeln als auch vermittelte Wirksamkeit anklingen.
- source_word: נָבוּס
  choice: zertreten wir
  rationale: בוס bedeutet niedertreten oder zertreten. „Zertreten“ gibt das kräftige Bild des hebräischen Parallelismus unmittelbar wieder.
- source_word: קָמֵינוּ
  choice: diejenigen, die sich gegen uns erheben
  rationale: Das substantivierte Partizip von קום bezeichnet Menschen, die sich als Gegner gegen das sprechende Volk erheben. Die Relativkonstruktion bewahrt den verbalen Charakter des hebräischen Ausdrucks.
theological_decisions:
- issue: Göttliche und menschliche Beteiligung am Sieg
  choice: Gott wird als entscheidende Quelle und Wirkkraft des Sieges dargestellt, während das Volk als handelndes Subjekt erscheint.
  alternative: Entweder die menschliche Kriegshandlung in den Vordergrund zu stellen oder „dein Name“ als bloße Beschwörungsformel zu verstehen.
  rationale: Die parallelen Wendungen „durch dich“ und „in deinem Namen“ führen den Erfolg auf Gott zurück; zugleich bleiben „wir stoßen“ und „wir zertreten“ echte menschliche Handlungen. Diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftigem poetischem Parallelismus. Die konkrete Bildsprache von „zertreten“ bleibt erhalten; das seltene Hornstoßbild wird lesbar übertragen und in der Fußnote erläutert.
