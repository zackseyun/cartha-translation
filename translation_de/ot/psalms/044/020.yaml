  text: אִם שָׁ֭כַחְנוּ שֵׁ֣ם אֱלֹהֵ֑י/נוּ וַ/נִּפְרֹ֥שׂ כַּ֝פֵּ֗י/נוּ לְ/אֵ֣ל זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: de
  text: Wenn wir den Namen unseres Gottes vergessen und unsere Hände zu einem fremden Gott ausgebreitet hätten –[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem anderen Gott“. Das hebräische Adjektiv kann „fremd“ oder „seltsam“ bedeuten; hier bezeichnet es eine Gottheit außerhalb der Verehrung des Gottes Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Konditionalpartikel leitet im Zusammenhang eine hypothetische Beteuerung ein; „Wenn“ gibt die Syntax schlicht und natürlich wieder.
- source_word: שָׁכַחְנוּ
  choice: wir … vergessen … hätten
  rationale: Das Qal Perfekt 1. Person Plural steht in einem hypothetischen Bedingungssatz. Der deutsche Konjunktiv II der Vergangenheit bringt diesen rückblickend-irrealen Sinn passend zum Ausdruck.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: den Namen unseres Gottes
  rationale: Die Konstruktion wird formal und idiomatisch wiedergegeben. „Name“ bezeichnet hier Gottes angerufene Identität, ohne diese Bedeutung ausdeutend in den Haupttext einzutragen.
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: und unsere Hände … ausgebreitet hätten
  rationale: פרשׂ mit כַּפַּיִם bezeichnet das Ausbreiten der Hände als Gebets- oder Anrufungsgeste. „Hände ausbreiten“ ist im Deutschen verständlich und bewahrt das konkrete Bild.
- source_word: לְאֵל זָר
  choice: zu einem fremden Gott
  rationale: Die Präposition bezeichnet die Ausrichtung der Geste; זָר kennzeichnet eine nicht zu Israels Gottesverehrung gehörende Gottheit. „Fremd“ ist im Deutschen die natürliche, semantisch breite Entsprechung.
theological_decisions:
- issue: Gebets- oder Verehrungsgeste gegenüber einer anderen Gottheit
  choice: unsere Hände zu einem fremden Gott ausgebreitet
  alternative: einen fremden Gott angebetet
  rationale: Die konkrete hebräische Geste bleibt erhalten, statt sie ausdrücklich als „Anbetung“ auszudeuten. Zugleich ist ihre Ausrichtung auf eine fremde Gottheit klar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hypothetische Aussage wird mit dem Konjunktiv II der Vergangenheit wiedergegeben; der Gedankenstrich bewahrt den im Vers offenen Anschluss an die Fortsetzung.
