base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: de
  text: Du hast mit deiner Hand Völker vertrieben und unsere Vorfahren eingepflanzt; Völkern hast du Schaden zugefügt und sie fortgeschickt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit fortgesetztem Bezug auf Israels Vorfahren: „Du hast sie eingepflanzt; du hast Völkern Schaden zugefügt und sie sich ausbreiten lassen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: mit deiner Hand
  rationale: Die instrumentale Bedeutung wird im Deutschen ausdrücklich wiedergegeben, während das konkrete Bild der göttlichen Hand erhalten bleibt.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Gemeint sind die fremden Bevölkerungsgruppen des Landes; „Völker“ ist hier natürlicher und historisch passender als „Heiden“.
- source_word: הוֹרַשְׁתָּ
  choice: vertrieben
  rationale: Der Hifil von ירשׁ bezeichnet hier, dass die Völker ihren Besitz verlieren und aus dem Land weichen mussten. „Vertrieben“ gibt dies klar und idiomatisch wieder.
- source_word: וַתִּטָּעֵם
  choice: und unsere Vorfahren eingepflanzt
  rationale: Das Verb bewahrt das Bild des Einpflanzens und damit der dauerhaften Ansiedlung. Der pronominale Bezug auf Israels Vorfahren wird aus dem unmittelbaren Kontext von Psalm 44 ausdrücklich gemacht, damit der abrupte Bezugswechsel im Deutschen verständlich bleibt.
- source_word: תָּרַע
  choice: du hast … Unheil zugefügt
  rationale: Der Hifil von רעע bedeutet, jemandem Böses oder Schaden zuzufügen. Die Formulierung bleibt hinsichtlich der konkreten Art des Gerichts offen.
- source_word: לְאֻמִּים
  choice: Volksstämmen
  rationale: Die Wiedergabe unterscheidet den Ausdruck poetisch von גּוֹיִם, ohne einen sachlich fremden Gegensatz einzuführen.
- source_word: וַתְּשַׁלְּחֵם
  choice: und sie fortgeschickt
  rationale: „Fortgeschickt“ folgt der Grundbedeutung von שלח und gibt im Zusammenhang die Entfernung der zuvor geschädigten Völker wieder, ohne die Aussage unnötig zu verstärken.
theological_decisions:
- issue: Bezug der pronominalen Endungen bei „eingepflanzt“ und „fortgeschickt“
  choice: Die erste Endung bezieht sich auf Israels Vorfahren, die letzte auf die Völker.
  alternative: Beide Endungen können auf Israels Vorfahren bezogen werden; dann bedeutet die letzte Wendung, dass Gott sie sich ausbreiten ließ.
  rationale: Der größere Zusammenhang stellt die Vertreibung der Völker der Ansiedlung Israels gegenüber. In der zweiten Vershälfte lässt sich die letzte Endung am unmittelbar genannten „Volksstämmen“ festmachen. Da das komprimierte Hebräisch jedoch auch den fortgesetzten Bezug auf Israels Vorfahren zulässt, wird diese Deutung in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Pflanzmetapher bleibt erhalten; der Wechsel der Bezugsgrößen wird im Haupttext verständlich gemacht, während die echte Mehrdeutigkeit der letzten Endung in der Fußnote dokumentiert wird.
