source:
  edition: WLC
  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: de
  text: Gott, mit eigenen Ohren haben wir es gehört; unsere Väter haben uns erzählt, was du in ihren Tagen getan hast, in längst vergangenen Tagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Tagen der Vorzeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Anrede steht ohne eigene Vokativpartikel am Versanfang; im modernen Deutschen ist „Gott“ klar und würdig.
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: mit eigenen Ohren haben wir es gehört
  rationale: Bewahrt die körperlich-konkrete Betonung des hebräischen Ausdrucks und klingt im Deutschen natürlich; „eigenen“ verdeutlicht idiomatisch das Suffix „unsere“.
- source_word: אֲבוֹתֵינוּ
  choice: unsere Väter
  rationale: Gibt den ausdrücklich maskulinen hebräischen Verwandtschaftsbegriff formal genau wieder; je nach Kontext ist auch „unsere Vorfahren“ möglich.
- source_word: סִפְּרוּ לָנוּ
  choice: haben uns erzählt
  rationale: Das Verb bezeichnet das erzählende Weitergeben überlieferter Taten; das Perfekt entspricht natürlichem modernem Deutsch.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: was du … getan hast
  rationale: Die Relativkonstruktion gibt die figura etymologica nicht wörtlich wieder, vermittelt aber die singuläre Tat bzw. das Wirken Gottes klar und ohne unnatürliche Verdoppelung.
- source_word: בִּימֵיהֶם
  choice: in ihren Tagen
  rationale: Bewahrt den zeitlichen Ausdruck und seinen Bezug auf die Väter.
- source_word: בִּימֵי קֶדֶם
  choice: in längst vergangenen Tagen
  rationale: Gibt die ferne Vergangenheit poetisch, aber in gegenwärtigem Standarddeutsch wieder.
theological_decisions:
- issue: Form der unmittelbaren Anrede Gottes
  choice: Gott, mit eigenen Ohren haben wir es gehört
  alternative: O Gott, mit eigenen Ohren haben wir es gehört
  rationale: Das Hebräische enthält keine gesonderte Vokativpartikel. „O Gott“ wäre ein traditioneller, aber nicht erforderlicher Zusatz.
- issue: Bezeichnung der überliefernden Generation
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: „Väter“ wahrt die konkrete maskuline Form des Hebräischen; „Vorfahren“ kann die kollektive Bedeutung im Deutschen deutlicher ausdrücken, ist jedoch weniger formal.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeitangabe. Der Parallelismus wird durch das Semikolon und die wiederholte Tagesformulierung bewahrt; unnötig altertümliche Sprache wird vermieden.
