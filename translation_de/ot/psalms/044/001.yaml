  source_fidelity: Der deutsche Text gibt die direkte Anrede, das eigene Hören, die Überlieferung durch die Väter sowie Gottes vergangenes Handeln zutreffend wieder. „Mit eigenen Ohren“ ist eine natürliche deutsche Entsprechung für „mit unseren Ohren“ und bewahrt die nachdrückliche, persönliche Wahrnehmung. Die Umschreibung der figura etymologica פֹּעַל פָּעַלְתָּ durch „was du … getan hast“ ist in modernem Deutsch idiomatisch und inhaltlich vollständig. „In längst vergangenen Tagen“ trifft בִּימֵי קֶדֶם angemessen.
