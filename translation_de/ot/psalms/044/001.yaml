  terminology: „Gott“ als unmittelbare Anrede, „unsere Väter“ für אֲבוֹתֵינוּ und „Tage“ in beiden Zeitangaben sind terminologisch quellentreu. Die Fußnote bietet mit „Tagen der Vorzeit“ eine sinnvolle, gleichwertige lexikalische Alternative.
