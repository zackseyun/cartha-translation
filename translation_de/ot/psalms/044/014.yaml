source:
  edition: WLC
  text: תְּשִׂימֵ֣/נוּ מָ֭שָׁל בַּ/גּוֹיִ֑ם מְנֽוֹד רֹ֝֗אשׁ בַּל אֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/014.yaml
  text: You make us a proverb among the nations[b][a], a shaking of the head among the peoples.
translation:
  language: de
  text: 'Du machst uns zum Spottwort unter den Völkern,

    zum Kopfschütteln unter den Nationen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Schütteln des Kopfes“ – eine Geste des Spotts oder der Verachtung.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Du machst uns
  rationale: Die Form von שׂים bezeichnet hier, an Gott gerichtet, das Versetzen in einen Zustand bzw. das Machen zu etwas. Das Präsens entspricht dem poetischen Klagekontext.
- source_word: מָשָׁל
  choice: zum Spottwort
  rationale: מָשָׁל kann Sprichwort, sprichwörtliche Redensart oder Spottwort bedeuten. Im Parallelismus mit dem verächtlichen Kopfschütteln bringt „Spottwort“ die kontextuelle Nuance natürlich zum Ausdruck, ohne das Bild zu überdeuten.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם meint hier die fremden Völker allgemein. „Unter den Völkern“ ist im Deutschen idiomatisch und vermeidet eine spätere technische Bedeutung von „Heiden“.
- source_word: מְנוֹד רֹאשׁ
  choice: zum Kopfschütteln
  rationale: Die Verbindung bezeichnet das Schütteln bzw. Bewegen des Kopfes als Geste des Spotts oder der Verachtung. Das deutsche Substantiv bewahrt das konkrete Bild knapp und verständlich.
- source_word: בַּל אֻמִּים
  choice: unter den Nationen
  rationale: Die Wendung steht parallel zu בַּגּוֹיִם. „Nationen“ erhält die poetische Variation gegenüber „Völkern“; die seltene Form בַּל wird im Kontext als Präposition „unter/bei“ verstanden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. „Spottwort“ ist im heutigen Deutsch verständlicher als das wörtlich mögliche „Sprichwort“ und macht die durch die zweite Vershälfte gegebene Verachtung deutlich. Der Fußnotenmarker steht unmittelbar nach der zu erläuternden Vershälfte.
