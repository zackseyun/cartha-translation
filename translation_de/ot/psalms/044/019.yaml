  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: de
  text: Denn du hast uns zerschmettert, wo Schakale hausen,[a] und uns mit tiefer Finsternis bedeckt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an einem Ort der Schakale“. Ältere Übersetzungen geben das Tierwort mit „Drachen“ wieder.'
