  - marker: b
    text: 'Oder: „mit Todesschatten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert hier die vorausgehende Aussage; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: דִכִּיתָנוּ
  choice: du hast uns zerschmettert
  rationale: Das Verb bezeichnet ein gewaltsames Zerschlagen oder Zermalmen. „Zerschmettert“ bewahrt die starke poetische Bildsprache.
- source_word: בִּמְקוֹם תַּנִּים
  choice: wo Schakale hausen
  rationale: Wörtlich steht „an einem Ort der Schakale“. Die gewählte Formulierung klingt im Deutschen natürlich und bewahrt das Bild einer öden, unwirtlichen Gegend.
- source_word: תַּנִּים
  choice: Schakale
  rationale: Im Bild einer verwüsteten Landschaft bezeichnet das Wort wahrscheinlich Schakale; ältere Wiedergaben wie „Drachen“ beruhen auf einer traditionellen, hier weniger wahrscheinlichen Deutung.
- source_word: וַתְּכַס עָלֵינוּ
  choice: und uns … bedeckt
  rationale: Die Form setzt die direkte Anrede Gottes fort. „Bedeckt“ erhält die konkrete Metapher; das hebräische עַל ist in der deutschen Objektkonstruktion sinngemäß enthalten.
- source_word: בְצַלְמָוֶת
  choice: mit tiefster Finsternis
  rationale: Der Ausdruck kann tiefe, bedrückende Dunkelheit bezeichnen, traditionell aber auch als „Todesschatten“ verstanden werden. „Tiefste Finsternis“ ist idiomatisch und erhält die Intensität.
theological_decisions:
- issue: Wiedergabe von בְצַלְמָוֶת
  choice: mit tiefster Finsternis
  alternative: mit Todesschatten
  rationale: Die Hauptübersetzung versteht den Ausdruck als intensive Dunkelheit, ohne einen unmittelbaren Todesbezug festzulegen. Die traditionelle und theologisch gewichtige Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Psalmsprache. Die kräftige Klage bleibt erhalten; die elliptische Ortsangabe wird natürlich formuliert. Sämtliche Fußnotenmarker stehen im Haupttext.
