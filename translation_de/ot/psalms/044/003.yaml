  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: de
  text: Denn nicht mit ihrem Schwert nahmen sie das Land in Besitz, und ihr Arm rettete sie nicht, sondern durch deine rechte Hand, deinen Arm und das Licht deines Angesichts[a], weil du Gefallen an ihnen hattest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Licht deiner Gegenwart“. Wörtlich steht im Hebräischen „das Licht deines Angesichts“, ein Bild für Gottes Gunst und zugewandte Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: nahmen … in Besitz
  rationale: Das Verb bezeichnet hier im Zusammenhang der Landnahme das Erlangen des Landes; die Formulierung wahrt den aktiven historischen Sinn, ohne ihn auf bloßes Erben einzuengen.
- source_word: אָרֶץ
  choice: das Land
  rationale: Der bestimmte Ausdruck verweist im Kontext auf das verheißene und in Besitz genommene Land, nicht allgemein auf die Erde.
- source_word: זְרוֹעָם
  choice: ihr Arm
  rationale: Das körperliche Bild bleibt erhalten und bildet den poetischen Gegensatz zu Gottes Arm.
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: rettete sie nicht
  rationale: Die Wiedergabe folgt der Grundbedeutung von ישׁע und lässt den militärischen Kontext mitschwingen, ohne sie auf Sieg allein zu verengen.
- source_word: יְמִינְךָ
  choice: deine rechte Hand
  rationale: Die traditionelle Körpermetapher für Gottes wirksame Macht wird bewahrt.
- source_word: זְרוֹעֲךָ
  choice: dein Arm
  rationale: Die wörtliche Metapher erhält die Parallelität und den Kontrast zu „ihr Arm“.
- source_word: אוֹר פָּנֶיךָ
  choice: das Licht deines Angesichts
  rationale: Die bildhafte Rede von Gottes zugewandter Gegenwart und Gunst wird nicht auf eine einzige Deutung reduziert; „Angesicht“ trägt dem würdevollen poetischen Register Rechnung.
- source_word: רְצִיתָם
  choice: du Gefallen an ihnen hattest
  rationale: Die Wendung gibt Gottes Wohlgefallen beziehungsweise Gunst natürlich wieder, ohne eine weitergehende theologische Begründung einzutragen.
- source_word: כִּי ... כִּי
  choice: Denn … weil
  rationale: Das erste כִּי leitet die Begründung des vorausgehenden Gedankens ein, das letzte nennt den Grund für Gottes Handeln.
theological_decisions:
- issue: Göttliches Handeln gegenüber menschlicher militärischer Macht
  choice: Die Einnahme des Landes und die Rettung werden Gottes rechter Hand, seinem Arm und dem Licht seines Angesichts zugeschrieben, nicht Israels Waffen oder eigener Kraft.
  alternative: Eine allgemeine Aussage über menschliche Abhängigkeit von Gott.
  rationale: Der hebräische Parallelismus stellt ausdrücklich „ihr Schwert/ihr Arm“ Gottes „rechter Hand/deinem Arm/dem Licht deines Angesichts“ gegenüber; diese konkrete Spannung bleibt erhalten.
- issue: אוֹר פָּנֶיךָ als Bild für Gunst und Gegenwart
  choice: Das Bild wird im Haupttext als „das Licht deines Angesichts“ bewahrt.
  alternative: „das Licht deiner Gegenwart“ oder „deine Gunst“.
  rationale: Der Ausdruck deutet Gottes Gunst und zugewandte Gegenwart an, ist aber bildhaft und theologisch mehrschichtig; die Übersetzung legt ihn nicht auf nur eine Paraphrase fest.
- issue: Verblose positive Gegenüberstellung
  choice: Nach „sondern“ bleibt das im Hebräischen ausgesparte Prädikat auch im Deutschen sinngemäß aus dem vorigen Satzglied erschließbar.
  alternative: „sondern es waren deine rechte Hand …“ oder ein ergänztes „taten es“.
  rationale: Ein deutsches „taten es“ müsste zugleich „das Land in Besitz nehmen“ und „retten“ vertreten und wäre dadurch unbeholfen. Die koordinierte Ellipse ist verständlich und bewahrt die poetische Verdichtung.
translation_notes:
  register: Moderne, würdige Psalmsprache mit bewahrten Körper- und Lichtmetaphern. „Angesicht“ ist bewusst poetischer als „Gesicht“, bleibt aber im heutigen religiös-literarischen Deutsch verständlich. Die Satzstruktur folgt dem hebräischen Gegensatz, ohne die verblose zweite Hälfte durch ein missverständliches Ersatzverb zu überladen.
