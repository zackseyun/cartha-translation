  text: אַתָּה ה֣וּא מַלְכִּ֣/י אֱלֹהִ֑ים צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: de
  text: Du selbst bist mein König, o Gott; befiehl Siege für Jakob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befiehl Rettungen für Jakob“; auch: „ordne Befreiungstaten für Jakob an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Du selbst bist
  rationale: Die Verbindung der Pronomen ist emphatisch. „Du selbst bist“ gibt diese Hervorhebung im Deutschen natürlich und knapp wieder.
- source_word: מַלְכִּי
  choice: mein König
  rationale: Das Substantiv mit Suffix der 1. Person Singular bedeutet unmittelbar „mein König“.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort steht hier am natürlichsten als direkte Anrede; im Deutschen ist dafür kein zusätzliches „o“ erforderlich.
- source_word: צַוֵּה
  choice: befiehl
  rationale: Der Piel-Imperativ von צוה bedeutet „befehlen, anordnen“. „Befiehl“ wahrt die kräftige, unmittelbare Bitte.
- source_word: יְשׁוּעוֹת
  choice: Siege
  rationale: Der Plural bezeichnet Rettungs- oder Befreiungstaten. Im kriegerischen Zusammenhang des Psalms bringt „Siege“ deren konkrete Gestalt verständlich zum Ausdruck; die breitere Bedeutung wird in der Fußnote erhalten.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der hebräische Eigenname wird beibehalten; er bezeichnet hier poetisch das Bundesvolk, ohne ihn interpretierend durch „Israel“ zu ersetzen.
theological_decisions:
- issue: Bedeutung von יְשׁוּעוֹת im kriegerischen Kontext
  choice: Siege
  alternative: Rettungen; Befreiungstaten
  rationale: Der Kontext handelt von Feinden und Kampf, weshalb konkrete, von Gott bewirkte Siege gemeint sein können. Die zugrunde liegende Rettungsbedeutung bleibt durch die Fußnote sichtbar.
- issue: Syntaktische Funktion von אֱלֹהִים
  choice: 'Direkte Anrede: „Gott“'
  alternative: Apposition „mein König, Gott“ oder Aussage „mein König ist Gott“
  rationale: 'Der Satzbau und der Gebetscharakter sprechen am ehesten für eine Anrede: „Du selbst bist mein König, Gott.“'
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die emphatische Eröffnung wird ausdrücklich wiedergegeben; „befiehl“ bewahrt den imperativischen Nachdruck. Der Fußnotenmarker steht unmittelbar nach dem Satz, dessen zentrale lexikalische Alternative er erläutert.
