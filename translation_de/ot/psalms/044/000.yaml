  yaml_path: translation/ot/psalms/044/000.yaml
  text: For the choirmaster[a]. Of the sons of Korah[b]. A Maskil[c].
translation:
  language: de
  text: Für den Chorleiter[a]. Von den Söhnen Korachs[b]. Ein Maskil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An den Chorleiter.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Für die Söhne Korachs“ beziehungsweise „Von den Söhnen Korachs verfasst“; die hebräische Präposition kann in Psalmüberschriften unterschiedliche Arten der Zuordnung ausdrücken.'
    reason: alternative_reading
  - marker: c
    text: Maskil ist ein hebräischer Ausdruck in mehreren Psalmüberschriften und bezeichnet möglicherweise ein Lehr- oder Betrachtungslied.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den musikalischen Leiter. „Für den Chorleiter“ ist knapp und liturgisch verständlich; die Präposition kann auch mit „An“ wiedergegeben werden.
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Die hebräische Präposition ל kann in Psalmüberschriften Zugehörigkeit, Bestimmung oder Urheberschaft ausdrücken. „Von“ lässt den Bezug zu den Söhnen Korachs weitgehend offen, ohne ihre genaue Rolle festzulegen.
- source_word: קֹרַח
  choice: Korach
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form „Korach“ wiedergegeben.
- source_word: מַשְׂכִּיל
  choice: Ein Maskil
  rationale: Die genaue Bedeutung dieses Fachworts in Psalmüberschriften ist unsicher. Die Transliteration vermeidet eine unbelegte Festlegung auf eine Lehr-, Betrachtungs- oder Musikgattung.
