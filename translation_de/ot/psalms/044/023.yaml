  source_fidelity: 'Der Text gibt alle hebräischen Sinnelemente und die Abfolge treffend wieder: die beiden Weckrufe (עוּרָה; הָקִיצָה), die rhetorische Frage nach dem Schlafen, die Anrede אֲדֹנָי sowie die Bitte, nicht dauerhaft verworfen zu werden. Die anthropomorphe Bildsprache bleibt unverfälscht erhalten.'
