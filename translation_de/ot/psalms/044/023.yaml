  text: ע֤וּרָ/ה לָ֖/מָּה תִישַׁ֥ן אֲדֹנָ֑/י הָ֝קִ֗יצָ/ה אַל תִּזְנַ֥ח לָ/נֶֽצַח׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: de
  text: Wach auf! Warum schläfst du, Herr? Erwache! Verwirf uns nicht für immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוּרָה
  choice: Wach auf!
  rationale: Der Imperativ von עור ist eine direkte, eindringliche Aufforderung zum Erwachen; die natürliche deutsche Wendung bewahrt die Kühnheit der Anrede.
- source_word: לָמָּה
  choice: Warum
  rationale: Das übliche Frageadverb leitet hier die klagende Frage ein.
- source_word: תִישַׁן
  choice: schläfst du
  rationale: Das Imperfekt von ישׁן steht in einer rhetorischen Frage; das deutsche Präsens gibt das Bild unmittelbar und idiomatisch wieder.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der direkt angeredete Gottestitel wird im Deutschen natürlich mit „Herr“ wiedergegeben.
- source_word: הָקִיצָה
  choice: Erwache!
  rationale: Der Imperativ von קיץ/יקץ greift das Motiv des Erwachens parallel und verstärkend auf. „Erwache!“ wahrt die dichterische Würde und unterscheidet sich leicht vom ersten Imperativ.
- source_word: אַל תִּזְנַח
  choice: Verwirf uns nicht
  rationale: זנח bedeutet ablehnen, verwerfen oder verstoßen; „verwirf uns nicht“ ist prägnant, verständlich und entspricht dem Klagegebet.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte oder dauerhafte Zeit; „für immer“ ist modernes, idiomatisches Deutsch.
theological_decisions:
- issue: Anthropomorphe Rede vom Schlafen und Erwachen Gottes
  choice: Das unmittelbare Bild von Gottes Schlafen und Erwachen bleibt erhalten.
  alternative: 'Das Bild deutend abschwächen, etwa: „Warum scheinst du untätig zu sein?“'
  rationale: Der hebräische Text spricht Gott in der Klage bewusst kühn an. Die Übersetzung soll diese theologische Spannung bewahren und nicht im Haupttext erklären oder auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der eindringlichen Kürze und dem parallelen Aufbau des hebräischen Klagegebets. Keine Fußnote ist nötig; die angegebene englische Fußnote scheint inhaltlich nicht zum Marker nach „sleep“ zu passen und bietet vielmehr eine Alternative zu „reject us“.
