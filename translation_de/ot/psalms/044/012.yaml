source:
  edition: WLC
  text: תִּמְכֹּֽר עַמְּ/ךָ֥ בְ/לֹא ה֑וֹן וְ/לֹ֥א רִ֝בִּ֗יתָ בִּ/מְחִירֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: de
  text: Du verkaufst dein Volk ohne Gewinn, und an ihrem Preis hast du dich nicht bereichert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Du hast dein Volk ohne Gewinn verkauft und hast dich an ihrem Preis nicht bereichert.«'
    reason: Das hebräische Imperfekt in der ersten Vershälfte kann die Handlung gegenwärtig und unmittelbar darstellen, im Kontext aber auch vergangenheitsbezogen verstanden werden.
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: du verkaufst
  rationale: Das Qal-Imperfekt der 2. Person Singular richtet sich an Gott. Das Präsens bewahrt die Unmittelbarkeit der Klage; im Zusammenhang ist auch eine vergangenheitsbezogene Wiedergabe möglich.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: עַם bezeichnet hier Gottes Volk und bewahrt die relationale, bundestheologische Aussage, ohne sie konfessionell auszuweiten.
- source_word: בְלֹא הוֹן
  choice: ohne Gewinn
  rationale: הוֹן bedeutet Vermögen, Besitz oder Reichtum. Im Bild eines Verkaufs bezeichnet die Wendung das Ausbleiben eines wertvollen Ertrags; »ohne Gewinn« ist im Deutschen natürlich und sachlich präzise.
- source_word: רִבִּיתָ
  choice: wirst ... nicht reicher
  rationale: Die Piel-Form von רבה hat hier den Sinn des Mehrens beziehungsweise des Erlangens von Zuwachs. Die deutsche Formulierung erhält das Bild wirtschaftlicher Vermehrung und vermeidet das unnatürliche »du hast nicht vermehrt«.
- source_word: בִּמְחִירֵיהֶם
  choice: durch den Preis für sie
  rationale: מְחִיר bezeichnet den Kauf- oder Verkaufspreis; בְּ kann hier Mittel oder Grundlage des Zuwachses ausdrücken. Das hebräische Suffix der 3. Person Plural wird im Deutschen idiomatisch mit »für sie« wiedergegeben.
theological_decisions:
- issue: Gott wird im Klagegebet als Verkäufer seines Volkes angeredet
  choice: Das anklagende Verkaufsbild wird direkt beibehalten.
  alternative: Die Aussage als bloßes Zulassen des Verkaufs abschwächen.
  rationale: Der hebräische Text schreibt Gott grammatisch unmittelbar die Handlung zu. Die Spannung der Klage darf nicht durch eine erklärende oder dogmatisch motivierte Abschwächung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wirtschaftliche Bildsprache des hebräischen Textes bleibt erhalten; die syntaktisch parallelen Aussagen werden idiomatisch, aber ohne Auflösung ihrer bewussten Zuspitzung wiedergegeben.
