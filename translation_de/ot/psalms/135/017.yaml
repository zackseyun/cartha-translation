  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יַאֲזִ֑ינוּ אַ֝֗ף אֵין יֶשׁ ר֥וּחַ בְּ/פִי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: de
  text: Sie haben Ohren, aber sie hören nicht; ja, in ihrem Mund ist kein Atem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geist“. Das hebräische Wort רוּחַ kann „Atem“, „Geist“ oder „Wind“ bedeuten; wegen der leblosen Götzen und der Wendung „in ihrem Mund“ ist hier „Atem“ wahrscheinlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: Sie haben Ohren
  rationale: Die hebräische besitzanzeigende Nominalkonstruktion wird im Deutschen natürlich mit „haben“ wiedergegeben; „Ohren“ bewahrt das konkrete Körperbild.
- source_word: וְלֹא יַאֲזִינוּ
  choice: aber sie hören nicht
  rationale: Das Hifil von אזן bezeichnet aufmerksames Hören bzw. Hinhören. Im Zusammenhang mit den funktionslosen Sinnesorganen der Götzen ist „hören“ idiomatisch; „aber“ bringt den Gegensatz natürlich zum Ausdruck.
- source_word: אַף
  choice: ja
  rationale: Die Partikel verstärkt und steigert hier die folgende Aussage. Das knappe „ja“ bewahrt diesen emphatischen Übergang in würdigem, natürlichem Deutsch.
- source_word: אֵין יֶשׁ רוּחַ
  choice: ist kein Atem
  rationale: Die Existenzverneinung wird im Deutschen idiomatisch mit „ist kein“ wiedergegeben. רוּחַ bedeutet je nach Kontext Atem, Geist oder Wind; bei leblosen Götzen und in Verbindung mit dem Mund liegt „Atem“ nahe.
- source_word: בְּפִיהֶם
  choice: in ihrem Mund
  rationale: Das Hebräische hat beim kollektiv auf die Götzen bezogenen Körperteil den Singular mit Pluralsuffix. „In ihrem Mund“ bildet diese Form genau und natürlich ab.
theological_decisions:
- issue: Bedeutung von רוּחַ im Kontext der Götzenpolemik
  choice: Atem
  alternative: Geist
  rationale: Der Vers beschreibt nicht funktionierende Körperorgane und gipfelt in der Feststellung, dass sich in ihrem Mund kein Lebensatem befindet. „Atem“ bewahrt den konkreten Hinweis auf die Leblosigkeit der Götzen, während die mögliche Bedeutung „Geist“ in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der parallele Körperbezug und die pointierte Steigerung der hebräischen Götzenpolemik bleiben erhalten.
