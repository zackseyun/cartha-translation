  source_fidelity: 'Der Vers ist in der Übersetzung sachgerecht wiedergegeben: בֵּית הַלֵּוִי bezeichnet im Kontext der vorangehenden Gruppenanreden das »Haus Levi«, und יִרְאֵי יְהוָה kann natürlich als direkte Anrede wiedergegeben werden. »Preist Jahwe« gibt die kultisch auf Gott bezogene Imperativform בָּרֲכוּ idiomatisch wieder, auch wenn »segnet« die engere lexikalische Entsprechung wäre.'
  naturalness: Die knappe, liturgische Anrede »Haus Levi, preist Jahwe! Ihr, die ihr Jahwe fürchtet, preist Jahwe!« ist im modernen Standarddeutsch verständlich und wahrt den Parallelismus. Die Ausrufezeichen sind eine zulässige deutsche Gestaltung der Aufforderungen.
