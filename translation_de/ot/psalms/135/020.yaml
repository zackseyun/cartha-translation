  text: בֵּ֣ית הַ֭/לֵּוִי בָּרֲכ֣וּ אֶת יְהוָ֑ה יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: de
  text: Haus Levi[a], preist Jahwe! Ihr, die ihr Jahwe fürchtet[b], preist Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Haus Levi«; gemeint ist die levitische Linie oder Gemeinschaft.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »die Jahwe fürchten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: Haus Levi
  rationale: Die Konstruktverbindung bedeutet wörtlich »Haus Levi« und bezeichnet hier kollektiv die levitische Linie bzw. Gemeinschaft. Die Wiedergabe bewahrt zugleich den Parallelismus mit den zuvor angeredeten Häusern Israel und Aaron.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: ברך bedeutet grundlegend »segnen«. Wenn Menschen im Gottesdienst Gott »segnen«, ist im heutigen natürlichen Deutsch jedoch »preisen« die verständliche und sachlich entsprechende Wiedergabe; »segnet Jahwe« könnte missverständlich wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch den Titel »der HERR« ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
- source_word: יִרְאֵי יְהוָה
  choice: ihr, die ihr Jahwe fürchtet
  rationale: Die partizipiale Wendung bezeichnet Menschen, die durch ihre Ehrfurcht vor Jahwe gekennzeichnet sind. Die direkte Anrede passt zum folgenden Imperativ und klingt im modernen Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Seine Wiedergabe als »Jahwe« erhält den Charakter eines persönlichen Bundesnamens, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ברך bei auf Gott gerichteter menschlicher Rede
  choice: preist
  alternative: segnet
  rationale: Die wörtliche Vorstellung des Segnens bleibt im Hebräischen theologisch spannungsvoll; im gegenwärtigen Deutschen bezeichnet »preisen« jedoch klarer die vom Menschen an Gott gerichtete ehrende Lobpreisung. Die Alternative wird in einer Fußnote offengelegt.
translation_notes:
  register: Liturgisch, knapp und würdevoll. Die wiederholte Aufforderung wird durch Ausrufezeichen markiert. »Haus Levi« bewahrt die bündische Haushalts- und Abstammungssprache; »preist« vermeidet die im modernen Deutsch mögliche Fehlauffassung, Menschen sollten Gott Wohlergehen zusprechen.
