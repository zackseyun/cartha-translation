  text: הַ֥לְלוּ יָ֨הּ הַֽ֭לְלוּ אֶת שֵׁ֣ם יְהוָ֑ה הַֽ֝לְלוּ עַבְדֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/001.yaml
  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
translation:
  language: de
  text: Preist Jah! Preist den Namen Jahwes; preist, ihr Diener Jahwes!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְלוּ
  choice: Preist
  rationale: Der Piel-Imperativ Plural von הלל ist ein unmittelbarer Aufruf zum Lob. „Preist“ ist im Deutschen natürlich, würdig und bewahrt die wiederholte Imperativform.
- source_word: יָהּ
  choice: Jah
  rationale: Die poetische Kurzform des Gottesnamens wird als „Jah“ wiedergegeben, sodass ihr Unterschied zur Vollform יְהוָה und der Bezug zu „Halleluja“ sichtbar bleiben.
- source_word: אֶת שֵׁם יְהוָה
  choice: den Namen Jahwes
  rationale: Die Konstruktion bezeichnet ausdrücklich den göttlichen Namen als Gegenstand des Lobes. Der deutsche Genitiv ist klar und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Vollform des Tetragramms wird mit der gebräuchlichen deutschen Transkription „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַבְדֵי
  choice: Diener
  rationale: Im liturgischen Zusammenhang bezeichnet das Wort diejenigen, die Jahwe dienen. „Diener“ ist hier natürlicher als „Sklaven“, ohne das Dienstverhältnis abzuschwächen.
theological_decisions:
- issue: Wiedergabe der beiden Gottesnamensformen יָהּ und יְהוָה
  choice: יָהּ als „Jah“ und יְהוָה als „Jahwe“ wiedergeben
  alternative: Beide Formen mit „der HERR“ oder beide einheitlich als „Jahwe“ wiedergeben
  rationale: Der hebräische Vers unterscheidet bewusst zwischen der poetischen Kurzform und der Vollform. Die unterschiedliche Wiedergabe bewahrt diese sprachliche und liturgische Besonderheit, ohne sie theologisch aufzulösen.
- issue: Fehlendes ausdrückliches Objekt beim dritten הַלְלוּ
  choice: „preist“ ohne ergänztes Objekt
  alternative: „preist ihn“
  rationale: Der hebräische Text nennt beim dritten Imperativ kein Objekt, sondern schließt die Anrede „ihr Diener Jahwes“ an. Die Übersetzung fügt daher kein Pronomen hinzu.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit psalmtypischem Aufruf. Die dreifache Wiederholung von „Preist“ sowie die direkte Anrede bleiben erhalten; auf ein altertümliches „o“ wird verzichtet.
