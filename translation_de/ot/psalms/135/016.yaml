  text: פֶּֽה לָ֭/הֶם וְ/לֹ֣א יְדַבֵּ֑רוּ עֵינַ֥יִם לָ֝/הֶ֗ם וְ/לֹ֣א יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/016.yaml
  text: They have mouths[a], but do not speak; they have eyes, but do not see.
translation:
  language: de
  text: Sie haben Münder[a], doch sie reden nicht; sie haben Augen, doch sie sehen nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Mund ist ihnen … Augen sind ihnen«; der hebräische Singular »Mund« ist hier distributiv gemeint, also: »Sie haben Münder … Augen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה
  choice: einen Mund
  rationale: Das hebräische Substantiv steht im Singular und wird bei den mehreren Götzen distributiv gebraucht. Auch im Deutschen ist »sie haben einen Mund« idiomatisch und bewahrt zugleich die Form des Ausgangstextes.
- source_word: לָהֶם
  choice: sie haben
  rationale: Die Verbindung aus ל und dem pronominalen Suffix bedeutet wörtlich »ihnen ist/zu ihnen«, dient hier aber als Besitzkonstruktion. »Sie haben« gibt sie in natürlichem Deutsch wieder.
- source_word: יְדַבֵּרוּ
  choice: sie reden nicht
  rationale: דבר im Piel bedeutet »reden/sprechen«. Die einfache Verneinung wird beibehalten; eine ausdrückliche Modalität wie »können nicht reden« steht nicht im Hebräischen.
- source_word: עֵינַיִם
  choice: Augen
  rationale: Direkte und idiomatische Wiedergabe des hebräischen Plurals.
- source_word: יִרְאוּ
  choice: sie sehen nicht
  rationale: ראה im Qal bedeutet gewöhnlich »sehen«. Die Übersetzung bewahrt die einfache Verneinung, ohne sie zu »können nicht sehen« zu erweitern.
theological_decisions:
- issue: Anthropomorphe Beschreibung der Götzen
  choice: Die funktionslosen Körperteile der Götzen werden konkret beschrieben, ohne die Aussage deutend zu erweitern.
  alternative: »Sie haben einen Mund, können aber nicht reden; sie haben Augen, können aber nicht sehen.«
  rationale: Der Vers verspottet Götzen durch den Gegensatz zwischen vorhandenen Organen und ausbleibender Tätigkeit. Die schlichte Verneinung des Hebräischen wahrt diese Bildsprache und fügt keine ausdrücklich formulierte Unfähigkeit hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und der scharfe Gegensatz des Hebräischen bleiben erhalten; »doch« gibt die adversative Funktion natürlich wieder.
