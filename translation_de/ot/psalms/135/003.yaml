source:
  edition: WLC
  text: הַֽ֭לְלוּ יָהּ כִּי ט֣וֹב יְהוָ֑ה זַמְּר֥וּ לִ֝/שְׁמ֗/וֹ כִּ֣י נָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: de
  text: Lobt Jah[a], denn Jahwe ist gut; singt seinem Namen Lob[b], denn er ist schön.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Jah“, die Kurzform des Gottesnamens; sie ist von dem folgenden „Jahwe“ (JHWH) zu unterscheiden.
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt im letzten Satzglied kein ausdrückliches Subjekt. „Er“ kann sich auf den Namen beziehen; möglich ist auch ein Bezug auf Jahwe oder auf das Lobsingen.
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Lobt
  rationale: Der pluralische Imperativ von הלל ist ein unmittelbarer liturgischer Aufruf. „Lobt“ ist im heutigen Deutsch klar, knapp und würdig.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die Kurzform des Gottesnamens. „Jah“ bewahrt diese Form und unterscheidet sie vom unmittelbar folgenden יְהוָה.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier jeweils eine Begründung für die Aufforderung ein. „Denn“ entspricht dem poetischen Zusammenhang natürlich.
- source_word: טוֹב
  choice: gut
  rationale: „Gut“ gibt die breite moralische und wohltätige Bedeutung von טוֹב wieder, ohne sie unnötig einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen und hält ihn von der Kurzform „Jah“ unterscheidbar.
- source_word: זַמְּרוּ
  choice: singt … Lob
  rationale: Der Imperativ von זמר bezeichnet musikalisches, gesungenes Gotteslob. Die deutsche Wendung „jemandem Lob singen“ erfasst sowohl das Singen als auch den preisenden Charakter.
- source_word: לִשְׁמוֹ
  choice: seinem Namen
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung des Lobgesangs. „Seinem Namen“ bewahrt die hebräische Ausdrucksweise in natürlichem Deutsch.
- source_word: נָעִים
  choice: schön
  rationale: נָעִים kann „angenehm“, „lieblich“ oder „schön“ bedeuten. „Schön“ ist in diesem Lobaufruf natürlich und lässt offen, ob die Aussage das Lobsingen, den Namen oder Jahwe betrifft.
theological_decisions:
- issue: Wiedergabe von יָהּ und יְהוָה im selben Vers
  choice: Unterscheidung als „Jah“ und „Jahwe“
  alternative: Beide Formen mit „der HERR“ wiedergeben
  rationale: Der hebräische Text verwendet zwei verwandte, aber verschiedene Namensformen. Die unterschiedliche Wiedergabe erhält diese erkennbare Abstufung.
- issue: Unausgesprochenes Bezugswort von נָעִים
  choice: Im Haupttext unpersönlich mit „es ist schön“ wiedergeben und die Mehrdeutigkeit erläutern
  alternative: „Denn er ist lieblich“ auf Jahwe oder seinen Namen beziehen
  rationale: Im letzten Satzglied steht im Hebräischen kein ausdrückliches Subjekt. Der Zusammenhang erlaubt einen Bezug auf das Lobsingen, den Namen oder Jahwe; diese Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallelen Imperative bleiben erhalten; die echte Mehrdeutigkeit des letzten Satzglieds wird nicht dogmatisch vereindeutigt.
