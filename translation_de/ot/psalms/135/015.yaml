source:
  edition: WLC
  text: עֲצַבֵּ֣י הַ֭/גּוֹיִם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/015.yaml
  text: The idols of the nations are silver and gold[b][a], the work of human hands.
translation:
  language: de
  text: Die Götzen[a] der Völker sind Silber und Gold, ein Werk von Menschenhänden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götterbilder“ beziehungsweise „Bildwerke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַבֵּי
  choice: Götzen
  rationale: Das Wort bezeichnet hier im polemischen Zusammenhang nicht bloß neutrale Bilder, sondern als Götter verehrte, von Menschen hergestellte Bildwerke. „Götzen“ gibt diese Aussage im Deutschen treffend wieder; „Götterbilder“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: גּוֹיִם bezeichnet hier die Völker außerhalb Israels. „Völker“ ist im Deutschen natürlich und vermeidet die mögliche Verengung von „Heiden“.
- source_word: כֶּסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die direkte Wiedergabe bewahrt die Aussage über das Material der Götzen.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: ein Werk von Menschenhänden
  rationale: Die Formulierung bewahrt das Bild der herstellenden Hände und gibt das generisch gebrauchte אָדָם idiomatisch und geschlechtsgenau wieder.
theological_decisions:
- issue: Generischer Sinn von אָדָם
  choice: Menschenhänden
  alternative: Händen eines Menschen; Menschenwerk
  rationale: אָדָם bezeichnet hier den Menschen allgemein, nicht speziell einen Mann. „Menschenhänden“ erhält zugleich den Gegensatz zwischen menschlicher Herstellung und göttlicher Wirklichkeit.
- issue: Polemische Bedeutung von עֲצַבֵּי
  choice: Götzen
  alternative: Götterbilder; Bildwerke
  rationale: Der Kontext kritisiert Gegenstände falscher Verehrung. „Götzen“ bringt diese Wertung zum Ausdruck, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Nominalstruktur des Hebräischen bleibt erhalten; „ein Werk von Menschenhänden“ ist zugleich verständlich und bildkräftig.
