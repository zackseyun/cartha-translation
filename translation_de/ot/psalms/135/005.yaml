id: PSA.135.5
reference: Psalms 135:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אֲנִ֣י יָ֭דַעְתִּי כִּי גָד֣וֹל יְהוָ֑ה וַ֝/אֲדֹנֵ֗י/נוּ מִ/כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: de
  text: 'Denn ich weiß: Jahwe ist groß, und unser Herr steht über allen Göttern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und unser Herr ist größer als alle Götter.“ Die hebräische Wendung drückt seine Überlegenheit über sie aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die erste Konjunktion begründet im Zusammenhang den Aufruf zum Lob und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das hebräische Perfekt bezeichnet hier eine gefestigte Erkenntnis; das deutsche Präsens gibt diesen zuständlichen Sinn natürlich wieder.
- source_word: כִּי
  choice: ':'
  rationale: Die zweite Konjunktion leitet den Inhalt des Wissens ein. Ein Doppelpunkt drückt diese Funktion im Deutschen knapp und idiomatisch aus; „dass“ wäre ebenfalls möglich.
- source_word: גָדוֹל
  choice: groß
  rationale: Das Prädikatsadjektiv bezeichnet Jahwes Größe uneingeschränkt und entspricht unmittelbar dem hebräischen Wortlaut.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲדֹנֵינוּ
  choice: unser Herr
  rationale: Das Substantiv bedeutet „Herr/Gebieter“ und trägt das Suffix der ersten Person Plural. „Unser Herr“ wahrt Würde und unterscheidet den Titel vom Gottesnamen Jahwe.
- source_word: מִכָּל
  choice: über allen
  rationale: Die Präposition מִן kennzeichnet hier einen Vergleich beziehungsweise Vorrang. „Über allen“ gibt die Überlegenheit im Deutschen idiomatisch wieder.
- source_word: אֱלֹהִים
  choice: Göttern
  rationale: Der Plural bezeichnet in diesem Vergleich andere Götter beziehungsweise Gottheiten. Die direkte Wiedergabe bewahrt die polemische und theologische Spannung des Textes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ erhält die Unterscheidung zwischen diesem Namen und dem anschließenden Titel „unser Herr“.
- issue: Bedeutung von אֱלֹהִים im Schlusssatz
  choice: allen Göttern
  alternative: allen göttlichen Wesen
  rationale: „Götter“ ist die unmittelbare pluralische Wiedergabe und lässt offen, welchen ontologischen Status der Psalm den so bezeichneten Größen zuschreibt.
- issue: Verhältnis von גָדוֹל und מִכָּל אֱלֹהִים
  choice: „groß“ als absolute Aussage; „über allen Göttern“ als anschließende Aussage des Vorrangs
  alternative: „größer als alle Götter“ als zusammengezogene Vergleichsaussage
  rationale: Die gewählte Fassung folgt der Satzgliederung des Hebräischen und bewahrt zugleich den vergleichenden Sinn der Präpositionalphrase.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt vermeidet eine schwerfällige dass-Konstruktion. „Jahwe“ und „unser Herr“ bleiben deutlich voneinander unterschieden; „Götter“ wird nicht interpretierend zu „Götzen“ oder „göttlichen Wesen“ aufgelöst.
