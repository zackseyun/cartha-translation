  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: Das einleitende כִּי wird begründend mit „Denn“ erfasst, יָדַעְתִּי idiomatisch als gegenwärtig geltende Gewissheit („ich weiß“), und der zweite Satzteil wahrt die Aussage von Jahwes Vorrang gegenüber allen Göttern. „Über allen Göttern“ ist eine sachgemäße deutsche Wiedergabe der hebräischen Vergleichsfügung מִכָּל אֱלֹהִים.'
