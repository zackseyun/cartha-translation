  source_fidelity: 'Die Übersetzung gibt כֹּל אֲשֶׁר חָפֵץ יְהוָה עָשָׂה treffend als allgemeine Aussage wieder: „Alles, was Jahwe gefällt, tut er“. „Gefällt“ deckt den Kontextwert von חָפֵץ („Gefallen haben an / wünschen / wollen“) angemessen ab, und das Präsens ist für die gnomische Aussage gut vertretbar. Die Ortsangaben und die poetische kosmische Weite von Himmel, Erde, Meeren und Tiefen bleiben erhalten.'
