id: PSA.135.6
reference: Psalms 135:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֤ל אֲשֶׁר חָפֵ֥ץ יְהוָ֗ה עָ֫שָׂ֥ה בַּ/שָּׁמַ֥יִם וּ/בָ/אָ֑רֶץ בַּ֝/יַּמִּ֗ים וְ/כָל תְּהוֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: de
  text: Alles, was Jahwe gefällt, tut er im Himmel und auf der Erde, in den Meeren und in allen Tiefen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Tiefen“ sind besonders die tiefen Wasser oder Abgründe gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Alles, was
  rationale: Die Wendung bezeichnet umfassend alles, worauf sich der folgende Wille und das Handeln beziehen; „Alles, was“ ist im Deutschen natürlich und nahe an der hebräischen Form.
- source_word: חָפֵץ
  choice: gefällt
  rationale: Das Verb kann Gefallen, Begehren oder Wollen ausdrücken. „Was Jahwe gefällt“ bewahrt den Aspekt seines freien Wohlgefallens, ohne ihn auf bloßes Planen zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עָשָׂה
  choice: tut
  rationale: Obwohl die hebräische Verbform formal ein vollendetes Geschehen ausdrücken kann, steht der Satz als allgemeine Aussage über Jahwes souveränes Handeln; das deutsche Präsens gibt diesen gnomischen Sinn natürlich wieder.
- source_word: בַּשָּׁמַיִם
  choice: im Himmel
  rationale: Der formal plurale hebräische Ausdruck bildet mit „Erde“ eine kosmische Gesamtbezeichnung; „im Himmel“ ist im modernen Deutschen die natürliche kollektive Wiedergabe.
- source_word: וּבָאָרֶץ
  choice: und auf der Erde
  rationale: In der festen räumlichen Verbindung mit „Himmel“ verlangt natürliches Deutsch „auf der Erde“.
- source_word: בַּיַּמִּים
  choice: in den Meeren
  rationale: Der Plural wird bewahrt und bezeichnet umfassend die Gewässer der Welt.
- source_word: וְכָל תְּהוֹמוֹת
  choice: und in allen Tiefen
  rationale: תְּהוֹמוֹת meint tiefe Wasser beziehungsweise urtümliche oder abgründige Tiefen. Die knappe Wiedergabe bewahrt die poetische Weite; eine Fußnote klärt den möglichen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Zeitbezug von עָשָׂה
  choice: 'Präsens: „tut“'
  alternative: 'Perfekt: „hat getan“'
  rationale: Im Kontext formuliert der Vers eine allgemeine Wahrheit über Jahwes uneingeschränktes Handeln. Das Präsens vermittelt diesen Sinn, während die formal mögliche Vergangenheitslesart nicht geleugnet, aber hier nicht in den Haupttext gestellt wird.
- issue: Verhältnis von göttlichem Gefallen und Handeln
  choice: „Alles, was Jahwe gefällt, tut er“
  alternative: „Alles, was Jahwe will, führt er aus“
  rationale: „Gefällt“ bewahrt die Bedeutungsbreite von חָפֵץ zwischen Gefallen, Begehren und Wollen und vermeidet eine dogmatisch stärker zugespitzte Umschreibung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die kosmische Reihung des Hebräischen bleibt erhalten; der Gottesname wird transparent wiedergegeben.
