  text: שֶֽׁ֭/הִכָּה בְּכוֹרֵ֣י מִצְרָ֑יִם מֵ֝/אָדָ֗ם עַד בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/008.yaml
  text: who struck down the firstborn of Egypt[b][a], from man to beast.
translation:
  language: de
  text: der die Erstgeborenen Ägyptens niederschlug[a], vom Menschen bis zum Vieh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der die Erstgeborenen Ägyptens schlug“. „Niederschlug“ verdeutlicht, dass der Schlag in diesem Zusammenhang tödlich war.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Menschen bis zum Vieh“; die Wendung bezeichnet die gesamte Spanne von Menschen bis zu Tieren.'
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: der … niederschlug
  rationale: Das Relativpartikel mit dem Hifil Perfekt von נכה setzt die Beschreibung des HERRN fort. „Niederschlug“ gibt im Zusammenhang mit dem Tod der Erstgeborenen die tödliche Wirkung wieder, ohne ein zusätzliches Verb einzuführen.
- source_word: בְּכוֹרֵי
  choice: die Erstgeborenen
  rationale: Der Konstruktplural von בכור bezeichnet kollektiv diejenigen mit Erstgeburtsstatus; „die Erstgeborenen“ ist dafür im Deutschen natürlich und präzise.
- source_word: מִצְרָיִם
  choice: Ägyptens
  rationale: Der Eigenname steht als abhängige Genitivbestimmung und wird idiomatisch mit „Ägyptens“ wiedergegeben.
- source_word: מֵ/אָדָם
  choice: vom Menschen
  rationale: אָדָם steht hier im Gegensatz zum Tier und bezeichnet den Menschen als Gattung; der Singular bewahrt zugleich die Form der hebräischen Spannweitenformel.
- source_word: עַד
  choice: bis zum
  rationale: 'In der Verbindung מִן … עַד markiert עַד den Endpunkt einer umfassenden Spanne: „vom … bis zum …“.'
- source_word: בְּהֵמָה
  choice: Vieh
  rationale: בְּהֵמָה bezeichnet besonders größere Haus- und Nutztiere und passt zum Kontext der ägyptischen Erstgeburtsplage. „Vieh“ ist hier natürlicher und sachlich genauer als das altertümlich wirkende „Getier“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Relativkonstruktion bleibt erhalten, da der Vers syntaktisch an den vorhergehenden Vers anschließt. „Niederschlug“ ist klar, aber nicht unnötig drastisch; „vom Menschen bis zum Vieh“ bewahrt die hebräische Spannweitenformel.
