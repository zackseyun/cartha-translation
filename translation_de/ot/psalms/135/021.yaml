  text: בָּ֘ר֤וּךְ יְהוָ֨ה מִ/צִּיּ֗וֹן שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: de
  text: Gepriesen sei Jahwe von Zion her, der in Jerusalem wohnt. Halleluja![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Preist Jah!“ Der Ausdruck wird traditionell als „Halleluja“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip steht in einer doxologischen Segensformel. „Gepriesen sei“ gibt deren liturgischen und auffordernden Klang im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: מִצִּיּוֹן
  choice: von Zion her
  rationale: Die Präposition מִן bezeichnet hier am ehesten den Ausgangsort des Lobpreises. „Von Zion her“ bewahrt diese räumliche Richtung und klingt im Deutschen eindeutig.
- source_word: שֹׁכֵן
  choice: der … wohnt
  rationale: Das Qal-Partizip von שׁכן bezeichnet den, der an einem Ort wohnt. Der Relativsatz gibt den appositionellen Bezug auf Jahwe natürlich wieder, ohne zusätzliche Königsterminologie einzutragen.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: הַלְלוּ יָהּ
  choice: Halleluja!
  rationale: Die hebräische Aufforderung im Plural mit der Kurzform des Gottesnamens ist als liturgischer Ruf „Halleluja“ fest im Deutschen verankert; ihre wörtliche Bedeutung wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Partizips שֹׁכֵן
  choice: 'Relativsatz zu Jahwe: „der in Jerusalem wohnt“'
  alternative: „wohnend in Jerusalem“
  rationale: Der Relativsatz macht den appositionellen Bezug im Deutschen klar, ohne den knappen hebräischen Ausdruck theologisch weiter auszudeuten.
translation_notes:
  register: Dignitärer, liturgischer Stil in modernem Standarddeutsch. „Von Zion her“ wahrt die räumliche Bedeutung von מִן; „wohnt“ vermeidet die nicht ausdrücklich im Verb enthaltene Deutung „thront“.
