source:
  edition: WLC
  text: לְ/סִיח֤וֹן מֶ֤לֶךְ הָ/אֱמֹרִ֗י וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן וּ֝/לְ/כֹ֗ל מַמְלְכ֥וֹת כְּנָֽעַן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/011.yaml
  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: de
  text: Sihon, den König der Amoriter, und Og, den König von Baschan, und alle Königreiche Kanaans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Sihon
  rationale: Das vorangestellte לְ kennzeichnet im fortlaufenden Satz die von Gottes Schlagen Betroffenen. Im Deutschen wird diese Beziehung bereits durch den Akkusativ der Aufzählung natürlich ausgedrückt; ein wörtliches „gegen/zu Sihon“ wäre hier unidiomatisch.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: den König der Amoriter
  rationale: Die Status-constructus-Verbindung mit dem substantivierten Volksadjektiv bezeichnet Sihon als König des amoritischen Volkes. Der Akkusativ folgt aus dem über Vers 10 hinaus fortgesetzten Satzbau.
- source_word: וּלְעוֹג
  choice: und Og
  rationale: Die Konjunktion wird ausdrücklich wiedergegeben; das wiederholte לְ gehört zur hebräischen Reihung, wird im natürlichen deutschen Satz jedoch durch den gemeinsamen Akkusativ erfasst.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: den König von Baschan
  rationale: Die Verbindung bezeichnet Og als König des geografischen Gebiets Baschan. „von Baschan“ ist die geläufige und klare deutsche Wiedergabe.
- source_word: וּלְכֹל מַמְלְכוֹת
  choice: und alle Königreiche
  rationale: כֹל umfasst hier die Gesamtheit der kanaanäischen Königreiche; מַמְלָכוֹת bezeichnet politische Herrschaftsgebiete und wird präzise mit „Königreiche“ wiedergegeben.
- source_word: כְּנָעַן
  choice: Kanaans
  rationale: Der Genitiv gibt die Zugehörigkeit der Königreiche zum Land Kanaan knapp und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers ist ein Satzfragment, das die Aufzählung aus dem vorhergehenden Vers fortsetzt; diese syntaktische Abhängigkeit bleibt erhalten. Die dreifache hebräische Präposition לְ wird nicht mechanisch wiederholt, sondern durch die deutsche Akkusativreihe natürlich abgebildet.
