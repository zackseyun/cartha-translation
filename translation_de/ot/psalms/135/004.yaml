  text: כִּֽי יַעֲקֹ֗ב בָּחַ֣ר ל֣/וֹ יָ֑הּ יִ֝שְׂרָאֵ֗ל לִ/סְגֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/004.yaml
  text: For Yah has chosen Jacob for himself[a], Israel as his treasured possession.
translation:
  language: de
  text: Denn Jah[a] hat Jakob für sich erwählt, Israel zu seinem kostbaren Eigentum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Jah“, die Kurzform des Gottesnamens.'
    reason: Die Kurzform des Gottesnamens ist für Wortlaut und Dichtung des Verses bedeutsam.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung zum Lob und klingt im Deutschen natürlich.
- source_word: בָּחַר
  choice: hat erwählt
  rationale: Das Verb bezeichnet ein bewusstes Auswählen; das Perfekt gibt die vollzogene Wahl mit fortdauernder Bedeutung wieder.
- source_word: לּוֹ
  choice: für sich
  rationale: Die Präposition mit Suffix drückt aus, dass Jakob von Jah für sich selbst und als ihm zugehörig erwählt wurde.
- source_word: יָהּ
  choice: Jah
  rationale: Dies gibt die im hebräischen Text stehende Kurzform des Gottesnamens unmittelbar und im Deutschen gebräuchlich wieder.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Übliche deutsche Namensform; hier bezeichnet der Name parallel zu Israel das Bundesvolk.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Namensform und poetische Parallele zu Jakob.
- source_word: סְגֻלָּה
  choice: kostbares Eigentum
  rationale: Der Ausdruck bezeichnet besonders wertvollen, persönlich zugehörigen Besitz; die Formulierung bewahrt sowohl den Wert- als auch den Zugehörigkeitsaspekt.
- source_word: לִסְגֻלָּתוֹ
  choice: zu seinem kostbaren Eigentum
  rationale: Die Präposition kann hier Ziel, Ergebnis oder Bestimmung ausdrücken; die deutsche Wendung erhält diese Nuance.
theological_decisions:
- issue: Wiedergabe der Kurzform des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich die Kurzform יָהּ, nicht das volle Tetragramm. „Jah“ wahrt diese sprachliche und poetische Besonderheit, ohne sie durch einen Titel zu ersetzen.
- issue: Bedeutung von סְגֻלָּה für Israels besondere Zugehörigkeit
  choice: kostbares Eigentum
  alternative: auserwähltes Volk; besonderer Besitz
  rationale: „Kostbares Eigentum“ gibt Wert und besondere Zugehörigkeit wieder, ohne zusätzliche dogmatische Begriffe in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper psalmischer Satzführung. „Erwählt“ und „kostbares Eigentum“ sind verständlich und bewahren zugleich den feierlichen und bundestheologischen Klang.
