  text: שָׁלַ֤ח אֹת֣וֹת וּ֭/מֹפְתִים בְּ/תוֹכֵ֣/כִי מִצְרָ֑יִם בְּ֝/פַרְעֹ֗ה וּ/בְ/כָל עֲבָדָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: de
  text: Er sandte Zeichen und Wunder in deiner Mitte, Ägypten,[a] gegen den Pharao und gegen alle seine Diener.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in deiner Mitte, Ägypten“. Das Hebräische redet Ägypten mit einem femininen Singularsuffix direkt an und stellt das Land so wie eine Person dar.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „auf den Pharao und auf alle seine Diener“. Die hebräische Präposition bezeichnet hier wahrscheinlich diejenigen, gegen die sich die Zeichen und Wunder richten und an denen sie geschehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Er sandte
  rationale: Das Qal Perfekt 3. Person maskulin Singular bezeichnet hier Gottes in den vorangehenden Versen geschildertes Handeln. „Sandte“ gibt die rückblickende poetische Erzählung würdig und natürlich wieder.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: Zeichen und Wunder
  rationale: Die feste hebräische Wortverbindung wird mit der im Deutschen geläufigen Paarformel wiedergegeben, ohne מֹפְתִים enger auf „Wunderwerke“ oder „Mirakel“ festzulegen.
- source_word: בְּתוֹכֵכִי
  choice: in deine Mitte
  rationale: בְּ plus תּוֹךְ und das feminine Singularsuffix bedeutet wörtlich „in deine Mitte“. Das Suffix richtet sich personifizierend direkt an Ägypten; „in“ bewahrt zugleich die mögliche statische Lesart, während der Kontext auch eine Bewegung hinein zulässt.
- source_word: מִצְרָיִם
  choice: Ägypten
  rationale: Der Ländername steht im Zusammenhang mit dem vorausgehenden Suffix als direkte Anrede. Im Deutschen macht die Stellung nach „deine Mitte“ diese Anrede verständlich, ohne das heute feierlich-altertümliche „o“ einzufügen.
- source_word: בְּפַרְעֹה
  choice: gegen den Pharao
  rationale: Die Präposition בְּ kennzeichnet hier wahrscheinlich das Ziel beziehungsweise die feindliche Wirkung der Zeichen und Wunder. „Gegen“ ist idiomatisch; die wörtlichere räumliche Wiedergabe „an/über“ bleibt in der Fußnote sichtbar.
- source_word: וּבְכָל עֲבָדָיו
  choice: und gegen alle seine Diener
  rationale: עֲבָדִים kann Diener, Untergebene, Beamte oder Sklaven bezeichnen. „Diener“ erhält die lexikalische Breite und passt zum königlichen Umfeld, ohne den Personenkreis auf Beamte oder Sklaven einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die direkte Anrede Ägyptens und die Wiederholung von „gegen“ bleiben erhalten. „Diener“ wahrt die Bedeutungsbreite des hebräischen Ausdrucks.
