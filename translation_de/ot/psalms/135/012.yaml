  text: וְ/נָתַ֣ן אַרְצָ֣/ם נַחֲלָ֑ה נַ֝חֲלָ֗ה לְ/יִשְׂרָאֵ֥ל עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/012.yaml
  text: And he gave their land as an inheritance[a], an inheritance to Israel his people.
translation:
  language: de
  text: Und er gab ihr Land als Erbbesitz[a], als Erbbesitz für Israel, sein Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Erbteil“; das Hebräische wiederholt „Erbbesitz“ zur Hervorhebung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Und er gab
  rationale: Das Qal וְנָתַן führt die Abfolge rückblickend fort. Das im Hebräischen aus dem Zusammenhang erschlossene Subjekt wird im Deutschen mit „er“ ausgedrückt.
- source_word: אַרְצָם
  choice: ihr Land
  rationale: אֶרֶץ bezeichnet hier das Land der zuvor genannten besiegten Könige und Völker; „Land“ ist knapp und kontextgerecht.
- source_word: נַחֲלָה
  choice: als Erbbesitz
  rationale: Die erste Nennung steht prädikativ bei „gab“. „Erbbesitz“ bewahrt den Gedanken eines dauerhaft zugeteilten Besitzes und klingt im Deutschen natürlicher als „als Erbe“.
- source_word: נַחֲלָה
  choice: als Erbbesitz
  rationale: Die zweite Nennung wird wiederholt, um die bewusste poetische Hervorhebung des Hebräischen zu erhalten.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: לְ kennzeichnet hier den Empfänger beziehungsweise Begünstigten. Nach der wiederholten prädikativen Wendung ist „für Israel“ im Deutschen natürlich und eindeutig.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bezeichnet hier Israel als Gottes Volk; „sein Volk“ ist die direkte und idiomatische Wiedergabe.
theological_decisions:
- issue: Poetische Wiederholung von נַחֲלָה
  choice: Die Wiederholung wird im Haupttext als „als Erbbesitz, als Erbbesitz“ bewahrt.
  alternative: Die beiden Vorkommen zu einer einzigen, stilistisch glatteren Formulierung zusammenziehen.
  rationale: Die Wiederholung ist im Hebräischen ausdrücklich vorhanden und verleiht der Gabe des Landes Nachdruck. Ihre Bewahrung vermeidet eine interpretierende Glättung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante hebräische Wiederholung bleibt erhalten; „Erbbesitz“ vermittelt den Sinn einer zugeteilten, bleibenden Besitzgabe.
