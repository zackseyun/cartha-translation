  source_fidelity: 'Die Übersetzung gibt die Abfolge und die Bezüge des Hebräischen treffend wieder: Gott gab das Land der zuvor genannten Gegner Israel. Die zweimalige Wiederholung von נַחֲלָה wird mit „als Erbbesitz, als Erbbesitz“ ausdrücklich bewahrt; „für Israel, sein Volk“ gibt לְיִשְׂרָאֵל עַמּוֹ angemessen wieder.'
