  terminology: „Erbbesitz“ ist für נַחֲלָה in diesem Kontext eine tragfähige, verständliche Wiedergabe des zugeteilten Erb- bzw. Besitzanteils. „Sein Volk“ wahrt die knappe theologische Bezeichnung עַמּוֹ ohne zusätzliche Deutung. Die Fußnote bietet mit „Erbteil“ eine passende lexikalische Alternative.
