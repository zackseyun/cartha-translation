  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/018.yaml
  text: Those who make them will become like them[a], everyone who trusts in them.
translation:
  language: de
  text: Ihnen gleich werden ihre Hersteller, alle, die auf sie vertrauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihnen gleich werden ihre Hersteller sein, alle, die auf sie vertrauen.“ Das hebräische Verb kann hier „sein“ oder „werden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: wie sie
  rationale: Die Vergleichspartikel mit dem Suffix der 3. Person Plural bezeichnet die Ähnlichkeit mit den zuvor beschriebenen Götzen. „Wie sie“ bewahrt den knappen Vergleich.
- source_word: יִהְי֣וּ
  choice: werden … sein
  rationale: היה kann sowohl „sein“ als auch „werden“ bedeuten. Die Formulierung „werden … sein“ hält im Deutschen beide Nuancen offen, ohne die resultative Bedeutung auszuschließen.
- source_word: עֹשֵׂי/הֶם
  choice: ihre Hersteller
  rationale: Das Partizip von עשה mit Suffix bezeichnet diejenigen, die die Götzen herstellen. „Ihre Hersteller“ ist knapp, verständlich und wahrt den substantivierten Charakter.
- source_word: כֹּל אֲשֶׁר
  choice: jeder, der
  rationale: 'Die Verbindung hat umfassenden Sinn: „jeder, der“ beziehungsweise „alle, die“. Der Singular entspricht dem folgenden hebräischen Partizip und klingt im Deutschen natürlich.'
- source_word: בֹּטֵחַ בָּ/הֶם
  choice: auf sie vertraut
  rationale: בטח mit ב bezeichnet das Setzen von Vertrauen auf jemanden oder etwas. „Auf sie vertraut“ ist die idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Bedeutung der Ähnlichkeit mit den Götzen
  choice: Der Vers sagt, dass die Hersteller der Götzen und alle, die ihnen vertrauen, wie diese sein beziehungsweise werden, ohne die Art der Ähnlichkeit näher festzulegen.
  alternative: Sie werden geistlich empfindungslos, machtlos oder leblos wie die Götzen.
  rationale: Der hebräische Text behauptet die Ähnlichkeit, erklärt aber weder ihren Mechanismus noch ihre genaue Ausprägung. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst knapper, poetischer Satzstellung. Das doppelte „sie“ bleibt wie im Hebräischen auf die zuvor genannten Götzen bezogen.
