  naturalness: „Wie sie werden ihre Hersteller sein“ ist zwar als stark poetische Inversion verständlich, klingt in modernem Standarddeutsch jedoch unnatürlich. „Ihnen gleich werden ihre Hersteller“ ist idiomatischer und bewahrt die knappe poetische Struktur.
  terminology: „Hersteller“ ist als Wiedergabe von „ihre Macher“ möglich und sachlich. „Ihnen gleich“ ist in diesem Kontext klarer und stilistisch gehobener als das satzinitiale „Wie sie“.
