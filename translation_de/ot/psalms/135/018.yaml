    rationale: '„Wie sie werden ihre Hersteller sein“ ist im modernen Deutschen schwer lesbar. Zudem ist „werden ... sein“ keine gute Weise, die hebräische lexikalische Alternative zwischen „sein“ und „werden“ offen zu halten: Es bildet vor allem ein Futur von „sein“. Die resultative Lesart kann im Haupttext mit „werden“ stehen; die stative Alternative gehört in die Fußnote.'
