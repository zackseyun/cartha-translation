id: PSA.135.7
reference: Psalms 135:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: de
  text: Er lässt Wolken vom Ende der Erde aufsteigen[a], macht Blitze zum Regen[b] und holt den Wind aus seinen Vorratskammern hervor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dunst“. Das hebräische Wort kann aufsteigenden Dunst oder Dämpfe bezeichnen; im Zusammenhang mit Regen, Blitzen und Wind passt „Wolken“ am besten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Blitze für den Regen“ oder „Blitze mit dem Regen“. Der knappe hebräische Ausdruck bezeichnet die Verbindung von Blitz und Regen, ohne sie genauer zu bestimmen.'
    reason: ambiguity
  - marker: c
    text: 'Oder: „aus seinen Schatzkammern“. Das Bild stellt den Wind als von Gott verwahrt und nach seinem Willen freigegeben dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: lässt ... aufsteigen
  rationale: Das Hifil-Partizip von עלה bezeichnet ein verursachendes Handeln. „Lässt ... aufsteigen“ gibt dies natürlich und präzise wieder.
- source_word: נְשִׂאִים
  choice: Wolken
  rationale: Das Wort kann aufsteigenden Dunst oder Dämpfe bezeichnen; im Zusammenhang mit Blitz, Regen und Wind ist „Wolken“ die verständlichste meteorologische Wiedergabe.
- source_word: מִקְצֵה הָאָרֶץ
  choice: vom Ende der Erde
  rationale: Die Wiedergabe bewahrt die singularische Form des hebräischen Ausdrucks; gemeint sein können zugleich die fernsten Bereiche der Erde.
- source_word: בְּרָקִים
  choice: Blitze
  rationale: Der deutsche Plural entspricht dem hebräischen Plural und ist in diesem Wetterzusammenhang idiomatisch.
- source_word: לַמָּטָר
  choice: zum Regen
  rationale: Die Präposition ל bezeichnet hier wahrscheinlich die Zuordnung von Blitz und Regen. „Zum Regen“ wahrt die knappe, leicht offene Formulierung des Hebräischen.
- source_word: עָשָׂה
  choice: macht
  rationale: Obwohl die Verbform formal ein Qatal ist, beschreibt sie im hymnischen Zusammenhang Gottes charakteristisches Wirken und wird daher präsentisch wiedergegeben.
- source_word: מוֹצֵא
  choice: holt ... hervor
  rationale: Das Hifil-Partizip von יצא ist kausativ. „Holt ... hervor“ passt zum Bild, dass Gott den Wind aus Vorräten freigibt.
- source_word: רוּחַ
  choice: Wind
  rationale: Die Abfolge von Wolken, Blitz und Regen legt eindeutig die meteorologische Bedeutung nahe.
- source_word: מֵאֹצְרוֹתָיו
  choice: aus seinen Vorratskammern
  rationale: אֹצָר bezeichnet einen Vorratsraum oder eine Schatzkammer. „Vorratskammern“ stellt das konkrete poetische Bild verständlich dar.
theological_decisions:
- issue: Poetisches Präsens oder vergangenes Handeln Gottes
  choice: Präsens als Beschreibung von Gottes charakteristischem Wirken in der Schöpfung
  alternative: 'Vergangenheit: „machte“'
  rationale: Die Partizipien und der hymnische Kontext stellen Gottes fortdauernde Herrschaft über die Schöpfung heraus; das Präsens gibt diese allgemeingültige Aussage im Deutschen am besten wieder.
- issue: Naturbeschreibung und göttliches Handeln
  choice: Die aktiven Verben bleiben ausdrücklich auf Gott als Handelnden bezogen.
  alternative: Unpersönliche meteorologische Formulierung
  rationale: Der hebräische Vers beschreibt Wolken, Blitz und Wind bewusst als von Gott bewirkt und gelenkt; diese theologische Aussage darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Satzbewegung. Die singularische Form „vom Ende der Erde“ bleibt erhalten; die echten lexikalischen und syntaktischen Alternativen werden in Fußnoten offengelegt.
