  text: יְ֭הוָה שִׁמְ/ךָ֣ לְ/עוֹלָ֑ם יְ֝הוָ֗ה זִכְרְ/ךָ֥ לְ/דֹר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/013.yaml
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
translation:
  language: de
  text: Jahwe, dein Name bleibt für immer; Jahwe, dein Gedenken[a] bleibt von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Erinnerung“, „dein Andenken“ oder „dein Ruhm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben; die direkte poetische Anrede verlangt im Deutschen keine zusätzliche Anredepartikel.
- source_word: שִׁמְךָ
  choice: dein Name
  rationale: Die direkte Entsprechung bewahrt die Bedeutungsbreite des hebräischen Ausdrucks, der sowohl den Namen selbst als auch die damit verbundene Geltung umfassen kann.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Der hebräische Satz ist ohne ausdrückliches Verb. „Bleibt“ gibt die im zeitlichen Ausdruck liegende Fortdauer in natürlichem Deutsch wieder.
- source_word: זִכְרְךָ
  choice: dein Andenken
  rationale: „Andenken“ wahrt die Grundbedeutung des Erinnerns beziehungsweise dessen, wodurch Jahwe im Gedächtnis bleibt, und passt zum Parallelismus mit „dein Name“, ohne die Bedeutung einseitig auf „Ruhm“ festzulegen.
- source_word: לְדֹר וָדֹר
  choice: bleibt von Generation zu Generation
  rationale: Die Wiederholung von „bleibt“ macht die in der zweiten verblosen Klausel vorausgesetzte Fortdauer deutlich und erhält den poetischen Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text spricht Gott zweimal unmittelbar mit dem Tetragramm an. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bedeutung von זִכְרְךָ
  choice: dein Andenken
  alternative: dein Ruhm / dein Gedächtnis
  rationale: Der Ausdruck kann das Erinnern an Jahwe, sein bleibendes Gedenken oder seinen Ruf bezeichnen. „Andenken“ hält diese Spannung offen; die Fußnote nennt weitere mögliche Nuancen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarem poetischem Parallelismus. Die ergänzte Verbform „bleibt“ steht in beiden Halbversen und macht die zeitliche Fortdauer der hebräischen Nominalsätze verständlich.
