id: PSA.135.14
reference: Psalms 135:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי יָדִ֣ין יְהוָ֣ה עַמּ֑/וֹ וְ/עַל עֲ֝בָדָ֗י/ו יִתְנֶחָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: de
  text: Denn Jahwe wird seinem Volk Recht verschaffen[a] und sich über seine Diener erbarmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Jahwe wird sein Volk richten.“ Das hebräische Verb kann allgemein „richten“ bedeuten; hier ist wahrscheinlich ein Urteil zugunsten seines Volkes gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und wegen seiner Diener wird er einlenken.“ Das hebräische Verb kann sowohl Erbarmen als auch ein Absehen oder Einlenken ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem argumentativen Zusammenhang des Psalms.
- source_word: יָדִין
  choice: wird … Recht verschaffen
  rationale: דין kann allgemein „richten“ bedeuten, bezeichnet hier aber wahrscheinlich ein Richten zugunsten des eigenen Volkes, wie auch im engen Paralleltext Dtn 32,36.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als in modernem Deutsch geläufige Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עַמּוֹ
  choice: seinem Volk
  rationale: Natürliche Wiedergabe der kollektiven Bundesbezeichnung; der deutsche Dativ ergibt sich aus der idiomatischen Wendung „jemandem Recht verschaffen“.
- source_word: וְעַל
  choice: über
  rationale: Die Präposition עַל gehört hier zur Verbindung mit נחם und wird idiomatisch durch „sich über jemanden erbarmen“ wiedergegeben.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im Psalmenkontext bezeichnet עבד Menschen, die Jahwe angehören und ihm dienen; „Diener“ ist hier natürlicher als „Sklaven“.
- source_word: יִתְנֶחָם
  choice: wird sich … erbarmen
  rationale: Das Nifal von נחם kann ein Sich-Erbarmen beziehungsweise ein Absehen oder Einlenken ausdrücken. Im Parallelismus steht hier Gottes barmherzige Zuwendung zu seinen Dienern im Vordergrund.
theological_decisions:
- issue: Anthropopathische Rede von Gott in יִתְנֶחָם
  choice: sich über seine Diener erbarmen
  alternative: seinetwegen einlenken / sich seine Diener gereuen lassen
  rationale: Die Hauptfassung gibt die im Kontext wahrscheinliche barmherzige Zuwendung wieder, ohne den hebräischen Ausdruck als Reue über eigenes Fehlverhalten misszuverstehen. Die Fußnote bewahrt zugleich die echte Bedeutungsbreite des Verbs.
- issue: Bedeutung von יָדִין gegenüber seinem Volk
  choice: seinem Volk Recht verschaffen
  alternative: sein Volk richten
  rationale: Der Kontext und Dtn 32,36 sprechen für ein Gericht zugunsten des Volkes. Die allgemeinere, formal mögliche Bedeutung „richten“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Recht verschaffen“ ist idiomatisch und erhält den forensischen Gehalt; „sich erbarmen“ bildet die parallele barmherzige Zuwendung natürlich ab. Beide echten lexikalischen Alternativen werden durch unmittelbar gesetzte Fußnotenmarker bewahrt.
