  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: der … schlug
  rationale: שֶׁ leitet einen Relativsatz ein, der die Beschreibung des HERRN aus dem vorherigen Vers fortsetzt. נכה bedeutet hier im militärischen Zusammenhang „schlagen“; das schlichte „schlug“ bleibt nah am Hebräischen, ohne den ausdrücklich folgenden Begriff des Tötens vorwegzunehmen.
- source_word: גּוֹיִם רַבִּים
  choice: viele Völker
  rationale: גּוֹיִם bezeichnet hier politische bzw. ethnische Völker. „Völker“ ist im Deutschen in diesem poetisch-historischen Zusammenhang natürlicher als „Nationen“ und vermeidet die sachlich unpassende Wiedergabe „Heiden“.
- source_word: וְ/הָרַג
  choice: und … tötete
  rationale: הרג bedeutet eindeutig „töten“. Die moderne Formulierung ist klar und bewahrt den Parallelismus.
- source_word: מְלָכִים עֲצוּמִים
  choice: mächtige Könige
  rationale: עָצוּם bezeichnet große Stärke oder Macht. „Mächtig“ passt sowohl zur Stellung der Könige als auch zum würdevollen poetischen Register.
theological_decisions:
- issue: Fortsetzung als Relativsatz
  choice: Der Vers beginnt abhängig mit „der“ und wird mit einem Komma abgeschlossen.
  alternative: 'Ein selbstständiger Satz: „Er schlug viele Völker und tötete mächtige Könige.“'
  rationale: Das vorangestellte שֶׁ kennzeichnet im masoretischen Text einen Relativsatz und verbindet die Aussage syntaktisch mit dem vorausgehenden Lob der Taten des HERRN.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wortwahl vermeidet sowohl Archaismen wie „erschlug“ als auch zusätzliche Deutungen, die im hebräischen Text nicht ausdrücklich enthalten sind.
