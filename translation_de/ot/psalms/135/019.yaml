  text: בֵּ֣ית יִ֭שְׂרָאֵל בָּרֲכ֣וּ אֶת יְהוָ֑ה בֵּ֥ית אַ֝הֲרֹ֗ן בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/019.yaml
  text: House of Israel[a], bless Yahweh; house of Aaron, bless Yahweh.
translation:
  language: de
  text: Haus Israel, preist Jahwe; Haus Aaron, preist Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die wörtliche Konstruktverbindung bleibt erhalten. Sie bezeichnet Israel kollektiv und bewahrt den poetischen Parallelismus mit „Haus Aaron“.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: Der Pluralimperativ von ברך bedeutet hier, an Gott gerichtet, ihn segnend zu rühmen. Das natürliche deutsche „preist“ gibt diese doxologische Bedeutung klar wieder; „segnet“ wäre formnäher, klingt im heutigen Deutsch bei Gott als Objekt jedoch missverständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, sodass der im hebräischen Text ausdrücklich stehende Eigenname sichtbar bleibt.
- source_word: בֵּית אַהֲרֹן
  choice: Haus Aaron
  rationale: Die wörtliche Konstruktverbindung bezeichnet Aarons priesterliche Familie beziehungsweise Linie, ohne dies im Text erklärend einzuengen, und entspricht dem parallelen „Haus Israel“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt zweimal ausdrücklich den Gottesnamen JHWH. Die Transliteration „Jahwe“ bewahrt diesen Eigenname-Charakter; „der HERR“ ist die traditionelle Ersatzlesung.
- issue: Wiedergabe von ברך mit Gott als Objekt
  choice: preist
  alternative: segnet
  rationale: „Segnet“ bildet die hebräische Wortwahl formal enger ab, kann im modernen Deutschen aber nahelegen, Menschen verliehen Gott Segen. „Preist“ bewahrt die hier gemeinte ehrende, doxologische Handlung, ohne eine bestimmte konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die wiederholte Aufforderung und die beiden kollektiven Bezeichnungen werden formal bewahrt.
