translation:
  language: de
  text: die ihr im Haus Jahwes[a] steht, in den Vorhöfen[b] des Hauses unseres Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus Jahwes“ ist hier das Heiligtum beziehungsweise der Tempel gemeint.
