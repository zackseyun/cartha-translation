lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: die ihr … steht
  rationale: Die Relativpartikel mit Partizip führt die Anrede aus dem vorangehenden Vers weiter. Die deutsche Relativkonstruktion gibt sowohl den Bezug auf die Angeredeten als auch den andauernden bzw. kennzeichnenden Sinn wieder.
- source_word: בְּבֵית
  choice: im Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier das Heiligtum samt Tempelbereich. „Haus“ bewahrt die hebräische Ausdrucksweise und die poetische Wiederholung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּחַצְרוֹת
  choice: in den Vorhöfen
  rationale: Der Plural von חָצֵר bezeichnet hier die Höfe des Tempelbereichs. „Vorhöfe“ ist in diesem kultischen Zusammenhang natürlich und verständlich.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: des Hauses unseres Gottes
  rationale: Die Formulierung gibt die Genitivbeziehung und das gemeinschaftliche „unseres Gottes“ genau wieder; zugleich bleibt die Wiederholung von „Haus“ erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von „Haus“ im Tempelkontext
  choice: Haus, mit erläuternder Fußnote
  alternative: Tempel
  rationale: „Haus“ wahrt die Bildsprache und den Parallelismus des hebräischen Textes; die Fußnote stellt klar, dass hier das Heiligtum mit seinem Tempelbezirk gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung setzt als Versfragment die Anrede des vorangehenden Verses fort. Die Wiederholung von „Haus“ erhält den hebräischen Parallelismus.
