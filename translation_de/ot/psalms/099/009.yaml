source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: de
  text: Erhebt Jahwe, unseren Gott, und werft euch an seinem heiligen Berg nieder[a]; denn heilig ist Jahwe, unser Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und bringt ihm an seinem heiligen Berg Verehrung dar“. Das hebräische Verb kann sowohl das Niederwerfen als auch die dadurch ausgedrückte Anbetung bezeichnen; die Präposition kann örtlich als „an“ oder gerichtet als „zu … hin“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Erhebt
  rationale: Der pluralische Imperativ von רום fordert dazu auf, Jahwe groß und erhaben zu preisen. „Erhebt“ bewahrt das Höhenbild und klingt in einem poetischen Aufruf natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unseren Gott / unser Gott
  rationale: אֱלֹהִים mit dem Suffix der ersten Person Plural bedeutet unmittelbar „unser Gott“; die Kasusform richtet sich im Deutschen nach dem Satz.
- source_word: וְהִשְׁתַּחֲווּ
  choice: und werft euch nieder
  rationale: שׁחה bezeichnet das Sich-Niederwerfen und kann dadurch zugleich kultische Verehrung ausdrücken. Die konkrete Körperhaltung bleibt sichtbar, ohne den gottesdienstlichen Sinn auszuschließen.
- source_word: לְהַר קָדְשׁוֹ
  choice: zu seinem heiligen Berg hin
  rationale: לְ kann Richtung oder örtliche Beziehung bezeichnen. Die Formulierung wahrt die mögliche Ausrichtung auf den heiligen Berg, ohne zu behaupten, der Berg selbst sei Gegenstand der Verehrung.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier die Begründung für die beiden Aufforderungen ein.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: „Heilig“ ist die zentrale und sachlich genaue Wiedergabe des Prädikats in diesem Psalm.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Ob הִשְׁתַּחֲווּ ausdrücklich mit „anbeten“ wiederzugeben ist
  choice: werft euch nieder
  alternative: betet an; verneigt euch
  rationale: Das Verb umfasst die körperliche Niederwerfung und kann in diesem Zusammenhang Verehrung bezeichnen. Die konkrete Wiedergabe erhält beide Ebenen, ohne die Handlung auf einen abstrakten Kultbegriff zu verengen.
- issue: Räumlicher Sinn von לְ vor „seinem heiligen Berg“
  choice: zu seinem heiligen Berg hin
  alternative: an seinem heiligen Berg; vor seinem heiligen Berg
  rationale: Die Präposition lässt eine gerichtete wie auch eine örtlich-relationale Deutung zu. Der Haupttext gibt die Richtung wieder; die Fußnote bewahrt die andere genuine Möglichkeit.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit knappen pluralischen Imperativen. Die poetische Schlussstellung „denn heilig ist Jahwe“ erhält den Nachdruck des hebräischen Prädikats. Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ geschrieben.
