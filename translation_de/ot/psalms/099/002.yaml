base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: de
  text: Jahwe ist groß in Zion und erhaben über alle Völker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche und kirchliche Umschrift gibt den Gottesnamen als „Jahwe“ wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּצִיּוֹן
  choice: auf dem Zion
  rationale: Die Präposition בְּ bezeichnet hier den Ort. Bei einem Bergnamen ist „auf dem Zion“ im Deutschen natürlich und sachlich passend.
- source_word: גָּדוֹל
  choice: groß
  rationale: „Groß“ gibt die Grundbedeutung direkt wieder und bewahrt die offene Aussage über Jahwes Größe, ohne sie auf Macht allein einzuengen.
- source_word: וְרָם הוּא
  choice: und erhaben
  rationale: רָם bezeichnet Höhe beziehungsweise Erhabenheit. Im Deutschen trägt „erhaben“ den poetischen Gedanken von Hoheit und Vorrang; das ausdrücklich gesetzte Pronomen הוּא muss nicht mit einem schwerfälligen zusätzlichen „er ist“ wiederholt werden.
- source_word: עַל כָּל הָעַמִּים
  choice: über alle Völker
  rationale: עַל kann „über“ oder „oberhalb von“ bezeichnen; „über“ bewahrt im Deutschen sowohl das Höhenbild als auch den Gedanken der Hoheit. עַמִּים wird treffend mit „Völker“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen Gottes. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Art von Jahwes Vorrang gegenüber den Völkern
  choice: erhaben über alle Völker
  alternative: hoch über allen Völkern
  rationale: Die Formulierung bewahrt das Bild der Höhe und den damit verbundenen Vorrang, ohne genauer festzulegen, ob vor allem räumliche Höhe, königliche Hoheit oder beides gemeint ist.
translation_notes:
  register: Kurze, würdevolle poetische Standardsprache. Die parallele Struktur des Hebräischen bleibt erhalten; „über“ bewahrt die echte Bedeutungsweite von עַל ohne erklärende Fußnote.
