  terminology: „Jahwe“ gibt das Tetragramm als Eigenname konsistent wieder. „Priestern“ ist für כֹהֲנָיו sachgerecht; die partitive Formulierung vermeidet eine überzogene Festlegung hinsichtlich Moses’ kultischem Amt. „Seinen Namen anriefen“ bewahrt die explizite hebräische Namensformel.
