  source_fidelity: 'Die Übersetzung gibt die beiden parallelen Gruppenbestimmungen des Hebräischen zutreffend wieder: Mose und Aaron werden „unter seinen Priestern“, Samuel „unter denen, die seinen Namen anriefen“, eingeordnet. Die anschließende Aussage „Sie riefen zu Jahwe, und er antwortete ihnen“ entspricht קֹרִאים אֶל־יְהוָה וְהוּא יַעֲנֵם angemessen. Das deutsche Präteritum ist im rückblickenden Psalmzusammenhang gut vertretbar, ohne eine unzulässige Einzel- oder Dauerhandlung festzulegen.'
