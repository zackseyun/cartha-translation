source:
  edition: WLC
  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: de
  text: Mose und Aaron waren unter seinen Priestern, und Samuel unter denen, die seinen Namen anriefen[a]. Sie riefen zu Jahwe, und er antwortete ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter den Anrufern seines Namens«.'
    reason: Die Fußnote macht die partizipiale Gruppenbezeichnung des Hebräischen sichtbar, während der Haupttext sie in natürliches Deutsch überträgt.
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: waren unter seinen Priestern
  rationale: 'Die Präposition בְּ ist hier am natürlichsten partitiv zu verstehen: Mose und Aaron werden zur Gruppe der Priester Gottes gerechnet. Das im Hebräischen nicht ausgedrückte »waren« ist im Deutschen für einen vollständigen, natürlichen Satz erforderlich.'
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: unter denen, die seinen Namen anriefen
  rationale: Die partizipiale Wendung steht parallel zu »unter seinen Priestern« und ordnet Samuel denen zu, die Gottes Namen im Gebet und Gottesdienst anrufen. »Seinen Namen« bleibt erhalten, weil es ausdrücklich im Hebräischen steht.
- source_word: קֹרִאים אֶל
  choice: sie riefen zu
  rationale: Die Form nimmt die kennzeichnende Handlung der genannten Männer wieder auf. »Zu … rufen« gibt die Verbindung mit אֶל direkt wieder, ohne den Ruf unnötig auf eine Notsituation zu beschränken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יַעֲנֵם
  choice: er antwortete ihnen
  rationale: Das Imperfekt bezeichnet im rückblickenden Zusammenhang am ehesten Gottes wiederholtes beziehungsweise zusammenfassend dargestelltes Antworten. Der deutsche Präteritumssatz bleibt knapp und lässt offen, ob einzelne oder wiederholte Gebetserhörungen gemeint sind.
theological_decisions:
- issue: Einordnung Moses und Aarons als Priester, ohne ihre Ämter gleichzusetzen
  choice: Mose und Aaron waren unter seinen Priestern
  alternative: Mose und Aaron waren seine Priester
  rationale: Die partitive Formulierung bewahrt die Aussage des Psalms, dass beide zu Gottes Priestern gerechnet werden, ohne daraus zu folgern, Mose habe in jeder Hinsicht dasselbe kultische Amt wie Aaron ausgeübt.
- issue: Samuel als einer der Anrufer des Namens Gottes
  choice: und Samuel unter denen, die seinen Namen anriefen
  alternative: und Samuel rief seinen Namen an
  rationale: Die gewählte Fassung erhält die parallele Gruppenbezeichnung des Hebräischen und reduziert sie nicht auf eine einzelne Handlung Samuels.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die Parallelität der beiden Gruppenbezeichnungen und die Wiederaufnahme durch »Sie riefen« bleiben erhalten.
