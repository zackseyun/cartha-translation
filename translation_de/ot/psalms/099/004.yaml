  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: de
  text: Der mächtige König liebt das Recht[a]. Du hast gerechte Ordnung[b] fest gegründet; Recht und Gerechtigkeit hast du in Jakob geübt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, unter Beibehaltung der verdichteten hebräischen Formulierung: „Die Stärke des Königs besteht darin, dass er das Recht liebt.“ Der Satzanfang kann auch anders gegliedert werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Rechtschaffenheit“ oder „Billigkeit“. Das hebräische Wort bezeichnet, was gerade bzw. recht ist, besonders im Sinn gerechter Verhältnisse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֹז
  choice: die Stärke
  rationale: עֹז bezeichnet Stärke oder Macht. Die substantivische Wiedergabe bewahrt die ungewöhnlich verdichtete hebräische Formulierung, statt sie stillschweigend in ein Adjektiv umzudeuten.
- source_word: מֶלֶךְ
  choice: des Königs
  rationale: Der Genitiv gibt die naheliegende Verbindung mit עֹז wieder. Die Kleinschreibung entspricht den Regeln des Deutschen; im Kontext ist Gott als König gemeint.
- source_word: מִשְׁפָּט
  choice: das Recht / Recht
  rationale: מִשְׁפָּט meint hier die gerechte Rechtsordnung und Rechtsprechung. „Recht“ passt in beiden Vorkommen und bewahrt die Wiederholung.
- source_word: אָהֵב
  choice: liebt
  rationale: Die Qatalform beschreibt hier eine bleibende, charakteristische Eigenschaft und wird daher präsentisch wiedergegeben.
- source_word: כּוֹנַנְתָּ
  choice: hast … fest gegründet
  rationale: Das Verb bezeichnet ein festes Gründen oder Herstellen. „Fest gegründet“ bringt sowohl die Begründung als auch die Beständigkeit zum Ausdruck.
- source_word: מֵישָׁרִים
  choice: Geradheit
  rationale: Das Wort bezeichnet das Gerade, Rechte oder Ausgewogene im ethischen und rechtlichen Sinn. „Geradheit“ wahrt das hebräische Bild; „Unparteilichkeit“ ist als kontextuelle Alternative vermerkt.
- source_word: וּצְדָקָה
  choice: und Gerechtigkeit
  rationale: צְדָקָה bezeichnet normgemäßes, gerechtes Handeln. Die Wiedergabe unterscheidet den Begriff von מִשְׁפָּט und erhält das Begriffspaar.
- source_word: בְּיַעֲקֹב
  choice: in Jakob
  rationale: Die wörtliche Wiedergabe bewahrt den poetischen Bundesnamen „Jakob“ und lässt dessen kollektiven Bezug auf das Volk bestehen.
- source_word: עָשִׂיתָ
  choice: hast du … geschaffen
  rationale: עשה ist ein breites Tätigkeitsverb. Mit den abstrakten Objekten klingt „geschaffen“ im Deutschen natürlicher als „getan“ und bezeichnet Gottes Verwirklichung von Recht und Gerechtigkeit.
theological_decisions:
- issue: Deutung der syntaktisch schwierigen Anfangsformulierung וְעֹז מֶלֶךְ
  choice: Die Stärke des Königs liebt das Recht
  alternative: Der mächtige König liebt das Recht; der König liebt mit Macht das Recht
  rationale: Der hebräische Anfang ist stark verdichtet und lässt mehrere syntaktische Deutungen zu. Die Hauptfassung erhält עֹז als Substantiv und macht die Fremdheit der Formulierung sichtbar; eine idiomatischere adjectivische Deutung steht in der Fußnote, ohne die Mehrdeutigkeit zu beseitigen.
- issue: Referent von „Jakob“
  choice: Jakob
  alternative: Israel; das Volk Jakob
  rationale: Der poetische Eigenname wird nicht interpretierend ersetzt. Im Psalm bezeichnet er kollektiv das Bundesvolk, doch die Ausgangsform lässt diese Identifikation indirekt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Verdichtung. Die ungewöhnliche Personifizierung „Die Stärke … liebt“ spiegelt die schwierige hebräische Syntax; beide Fußnotenmarker stehen im Haupttext.
