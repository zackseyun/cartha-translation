id: PSA.99.1
reference: Psalms 99:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: de
  text: Jahwe ist König[a]; die Völker sollen erbeben. Er thront über den Cherubim[b]; die Erde soll beben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe ist König; die Völker erbeben … die Erde bebt.“ Die hebräischen Imperfektformen können statt auffordernd auch als Aussagen verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: „Thront über den Cherubim“ kann auch mit „thront zwischen den Cherubim“ oder „thront auf den Cherubim“ wiedergegeben werden. Der hebräische Ausdruck ist ein königlich-kultischer Hoheitstitel für Jahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche wissenschaftliche Umschrift bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: מָלָךְ
  choice: ist König
  rationale: Die poetische Königsakklamation wird gegenwärtig-deklarativ wiedergegeben. „Ist König“ ist natürliches Deutsch und vermeidet die mögliche ingressive Überdeutung „ist König geworden“.
- source_word: יִרְגְּזוּ
  choice: die Völker sollen erbeben
  rationale: Der Imperfekt kann hier als auffordernde Reaktion auf Jahwes Königtum verstanden werden. „Erbeben“ bezeichnet die erschütterte, furchtsame Reaktion und passt zur Parallelzeile.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet mehrere Volksgemeinschaften; „Völker“ ist im Deutschen genauer und natürlicher als „Nationen“.
- source_word: יֹשֵׁב כְּרוּבִים
  choice: Er thront über den Kerubim
  rationale: Das Partizip mit „Kerubim“ bildet einen königlich-kultischen Hoheitstitel. „Thront“ gibt den idiomatischen Sinn wieder; „über“ lässt die genaue räumliche Beziehung offen genug.
- source_word: כְּרוּבִים
  choice: Kerubim
  rationale: „Kerubim“ ist die etablierte deutsche Wiedergabe dieser himmlischen Wesen und bewahrt den biblischen Sprachklang.
- source_word: תָּנוּט
  choice: die Erde soll beben
  rationale: Parallel zu יִרְגְּזוּ wird der Imperfekt auffordernd wiedergegeben. „Beben“ erfasst das Schwanken oder Erschüttertwerden der Erde in natürlichem Deutsch.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der universale Zusammenhang des Königspsalms spricht für den kosmischen Sinn „Erde“ statt des territorialen „Land“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn in der üblichen deutschen Form, ohne einen Hoheitstitel einzusetzen.
- issue: Aussagewert der Imperfektformen יִרְגְּזוּ und תָּנוּט
  choice: 'auffordernd: „die Völker sollen erbeben … die Erde soll beben“'
  alternative: 'indikativisch: „die Völker erbeben … die Erde bebt“'
  rationale: Die Formen lassen im poetischen Kontext sowohl eine auffordernde als auch eine indikativische Lesart zu. Die auffordernde Fassung trägt den akklamatorischen Stil des Psalms; die ebenso mögliche indikativische Deutung bleibt in der Fußnote erhalten.
- issue: Räumliche Beziehung bei יֹשֵׁב כְּרוּבִים
  choice: „thront über den Kerubim“
  alternative: „thront zwischen den Kerubim“; „thront auf den Kerubim“
  rationale: Der Ausdruck bezeichnet Jahwe als den über den Kerubim thronenden König. Die Präposition ist im Hebräischen nicht ausdrücklich gesetzt, weshalb alternative räumliche Vorstellungen nicht dogmatisch ausgeschlossen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Jahwe“ bewahrt den Eigennamen; „Kerubim“ den etablierten biblischen Fachausdruck. Die Semikolons gliedern die beiden parallelen Akklamationen.
