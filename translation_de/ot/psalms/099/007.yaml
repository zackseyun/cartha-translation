source:
  edition: WLC
  text: בְּ/עַמּ֣וּד עָ֭נָן יְדַבֵּ֣ר אֲלֵי/הֶ֑ם שָׁמְר֥וּ עֵ֝דֹתָ֗י/ו וְ/חֹ֣ק נָֽתַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: de
  text: In einer Wolkensäule redete er zu ihnen.[a] Sie bewahrten seine Zeugnisse und die Satzung, die er ihnen gab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus einer Wolkensäule redete er zu ihnen.“ Die hebräische Präposition kann hier örtlich oder im Sinn des Ausgangspunkts verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: In einer Wolkensäule
  rationale: Die Präposition ב kann hier örtlich („in“) oder vom Ausgangspunkt her („aus“) verstanden werden. „In einer Wolkensäule“ ist im Deutschen natürlich und bewahrt das Bild; die Alternative wird in der Fußnote genannt.
- source_word: יְדַבֵּר
  choice: redete
  rationale: Das Yiqtol kann eine wiederholte oder andauernde Handlung bezeichnen. Im rückblickenden poetischen Zusammenhang gibt das deutsche Präteritum die vergangene Redehandlung angemessen wieder, ohne die aspektuelle Nuance unnötig festzulegen.
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: Die Präpositionalphrase verweist am nächsten auf Mose, Aaron und Samuel aus dem vorhergehenden Vers.
- source_word: שָׁמְרוּ
  choice: bewahrten
  rationale: שׁמר bedeutet im Bundes- und Weisungskontext „bewahren, halten, beachten“. „Bewahrten“ wahrt die Grundbedeutung und schließt gehorsames Befolgen ein.
- source_word: עֵדֹתָיו
  choice: seine Zeugnisse
  rationale: „Zeugnisse“ erhält die charakteristische rechtlich-bundestheologische Bedeutung von עֵדוֹת und unterscheidet den Ausdruck von dem folgenden חֹק.
- source_word: וְחֹק
  choice: und die Satzung
  rationale: חֹק bezeichnet eine festgesetzte Vorschrift oder Ordnung. Der Singular wird beibehalten und gegenüber „Zeugnisse“ lexikalisch unterschieden.
- source_word: נָתַן לָמוֹ
  choice: die er ihnen gab
  rationale: Die Formulierung bezieht sich am natürlichsten auf die unmittelbar vorausgehende „Satzung“. Das Präteritum gibt die vergangene Gabe knapp und idiomatisch wieder.
theological_decisions:
- issue: Bezug von „er“ und „ihnen“
  choice: „Er“ bezeichnet den HERRN; „ihnen“ bezieht sich auf Mose, Aaron und Samuel aus Vers 6.
  alternative: „Ihnen“ kann mittelbar auch Israel meinen, das durch diese Personen vertreten wird.
  rationale: Der unmittelbare Kontext nennt in Vers 6 Mose, Aaron und Samuel. Die Pronomen bleiben unaufgelöst stehen, sodass der poetische Zusammenhang und eine mögliche repräsentative Weitung gewahrt bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortwahl „Zeugnisse“ und „Satzung“ bewahrt die rechtlich-bundestheologische Unterscheidung der beiden hebräischen Begriffe. Die Syntax bleibt klar und poetisch knapp.
