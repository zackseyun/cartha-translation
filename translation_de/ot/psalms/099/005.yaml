source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: de
  text: Erhebt den HERRN, unseren Gott, und werft euch an seinem Fußschemel nieder[a]; heilig ist er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „vor seinem Fußschemel“ oder „zu seinem Fußschemel hin“. Die hebräische Präposition lässt in diesem Anbetungskontext mehrere Wiedergaben zu. Der „Fußschemel“ kann den irdischen Ort von Gottes Thronherrschaft bezeichnen, etwa die Bundeslade oder das Heiligtum; der Vers selbst erklärt das Bild nicht näher.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Erhebt
  rationale: Der Pluralimperativ von רום fordert dazu auf, Gott hoch zu erheben bzw. zu preisen. „Erhebt“ bewahrt das Bild und passt in einen würdigen, modernen Psalmstil.
- source_word: יְהוָ֤ה
  choice: den HERRN
  rationale: Der Gottesname wird nach verbreiteter deutscher Bibelkonvention ehrfurchtsvoll als „HERR“ in Kapitälchen wiedergegeben.
- source_word: אֱלֹהֵ֗ינוּ
  choice: unseren Gott
  rationale: Die Form mit Suffix der ersten Person Plural bedeutet unmittelbar „unseren Gott“ und bewahrt den gemeinschaftlichen Bezug.
- source_word: וְֽהִשְׁתַּחֲווּ
  choice: und werft euch … nieder
  rationale: שׁחה bezeichnet ein körperliches Sich-Niederwerfen und im weiteren Sinn Anbetung. Die Formulierung erhält die konkrete Gebärde, ohne sie auf einen abstrakten Kultbegriff zu reduzieren.
- source_word: לַהֲדֹ֥ם רַגְלָ֗יו
  choice: vor seinem Fußschemel
  rationale: הֲדֹם רַגְלָיו bedeutet wörtlich „Schemel seiner Füße“. Die Präposition ל kann im Anbetungskontext räumlich bzw. gerichtet verstanden werden; „vor“ ist im Deutschen natürlich und vermeidet den Eindruck, der Fußschemel selbst werde angebetet.
- source_word: קָד֥וֹשׁ הֽוּא
  choice: heilig ist er
  rationale: Die vorangestellte Prädikatsangabe wird in der markierten deutschen Wortstellung bewahrt; zugleich bleibt der Satz klar und feierlich.
theological_decisions:
- issue: Bezug von „seinem Fußschemel“
  choice: Das Bild bleibt im Haupttext unbestimmt.
  alternative: Ausdrückliche Deutung als Bundeslade, Zion, Heiligtum oder Erde.
  rationale: Der Vers nennt den irdischen Bezugspunkt von Gottes Thronherrschaft nicht ausdrücklich. Eine nähere Bestimmung würde eine mögliche Deutung in den Text eintragen.
- issue: Bezug der Heiligkeitsaussage
  choice: „Heilig ist er“ bezieht sich auf den HERRN.
  alternative: „Er ist heilig“ könnte grammatisch auch auf den Fußschemel bezogen werden.
  rationale: Das maskuline Pronomen הוּא lässt formal beide Bezüge zu, doch der unmittelbare Psalmzusammenhang und die parallele Aussage in Vers 3 sprechen deutlich für Gott. Die grammatische Möglichkeit wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die körperliche Gebärde des Niederwerfens und das unausgedeutete Bild des Fußschemels bleiben erhalten. Die markierte Wortstellung „heilig ist er“ spiegelt den hebräischen Nachdruck, ohne altertümlich zu wirken.
