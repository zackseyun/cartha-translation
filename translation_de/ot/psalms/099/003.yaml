source:
  edition: WLC
  text: יוֹד֣וּ שִׁ֭מְ/ךָ גָּד֥וֹל וְ/נוֹרָ֗א קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/003.yaml
  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
translation:
  language: de
  text: Sie sollen deinen großen und furchtgebietenden Namen preisen[a][b]; heilig ist er.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »danken«. Das hebräische Verb kann sowohl »danken« als auch »preisen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ehrfurchtgebietenden«. Gemeint ist ein Name, der Ehrfurcht und Furcht hervorruft.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische »er« kann grammatisch auf den Namen zurückweisen; im Zusammenhang bezeichnet es zugleich den HERRN.
    reason: textual_ambiguity
lexical_decisions:
- source_word: יוֹדוּ
  choice: sie sollen … preisen
  rationale: Der Hifil-Imperfekt von ידה kann »danken«, »preisen« oder »bekennen« bedeuten. Mit Gottes Namen als Objekt passt hier »preisen« am besten; die Aufforderung wird im Deutschen natürlich mit »sollen« wiedergegeben.
- source_word: שִׁמְךָ
  choice: deinen … Namen
  rationale: »Name« bewahrt die hebräische Ausdrucksweise und schließt Gottes Ansehen und offenbarten Charakter mit ein.
- source_word: גָּדוֹל
  choice: großen
  rationale: Die direkte und natürliche Entsprechung von גָּדוֹל ist »groß«.
- source_word: וְנוֹרָא
  choice: und furchtgebietenden
  rationale: נוֹרָא bezeichnet etwas, das Ehrfurcht und Furcht hervorruft. »Furchtgebietend« bewahrt diese starke Bedeutung, ohne bloßen Schrecken auszudrücken.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: »Heilig« bewahrt die feststehende theologische und liturgische Bedeutung sowie den refrainartigen Charakter in Psalm 99.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen wird ausdrücklich wiedergegeben. Die Wortstellung »heilig ist er« folgt dem knappen, hervorgehobenen Abschluss des Hebräischen und lässt dessen Bezugsspannung bestehen.
theological_decisions:
- issue: Bezug von הוּא im Schlusssatz
  choice: »heilig ist er« lässt den unmittelbaren grammatischen Bezug auf den Namen und den kontextuellen Bezug auf den HERRN nebeneinander bestehen.
  alternative: 'Eindeutig auf Gott bezogen: »er, der HERR, ist heilig«; eindeutig auf den Namen bezogen: »sein Name ist heilig«.'
  rationale: שֵׁם (»Name«) ist im Hebräischen maskulin, sodass הוּא grammatisch darauf zurückweisen kann; der Refrain des Psalms spricht zugleich von der Heiligkeit des HERRN. Eine eindeutige Auflösung würde die echte Mehrdeutigkeit des Ausgangstextes verringern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Furchtgebietend« wahrt den Ernst von נוֹרָא, während die invertierte Schlussformel »heilig ist er« den knappen, liturgischen Nachdruck und die Mehrdeutigkeit des Hebräischen erhält.
