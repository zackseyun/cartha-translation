source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: de
  text: Jahwe, unser Gott, du hast ihnen geantwortet; du warst ihnen ein vergebender Gott[a], doch einer, der wegen ihrer Taten Vergeltung übte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ein Gott, der für sie [die Schuld] trug beziehungsweise wegtrug“. Das hebräische Partizip kann Vergebung als Tragen oder Wegnehmen von Schuld ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und ein Vergelter im Blick auf ihre Taten“. Die hebräische Partizipialform kann sowohl als Bezeichnung eines Vergelters als auch stärker verbal verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Konstruktform mit dem Suffix der 1. Person Plural bedeutet im Anruf unmittelbar „unser Gott“.
- source_word: אַתָּה עֲנִיתָם
  choice: du hast ihnen geantwortet
  rationale: Das ausdrücklich gesetzte Pronomen wird zur Betonung beibehalten; ענה bezeichnet hier im Zusammenhang mit Gebet und Fürbitte Gottes Antworten.
- source_word: אֵל נֹשֵׂא
  choice: ein Gott, der vergibt
  rationale: נֹשֵׂא bedeutet wörtlich „tragend/wegtragend“, bezeichnet im Zusammenhang mit Schuld aber idiomatisch das Vergeben. Die Relativkonstruktion klingt im modernen Deutsch natürlich und bewahrt den Bezug auf Gott.
- source_word: הָיִיתָ לָהֶם
  choice: du warst für sie
  rationale: Die Konstruktion היה mit ל beschreibt, was Gott ihnen gegenüber war; „für sie“ gibt diese Beziehung knapp und idiomatisch wieder.
- source_word: וְנֹקֵם עַל עֲלִילוֹתָם
  choice: doch du hast ihre Taten geahndet
  rationale: Das Partizip von נקם beschreibt vergeltendes oder strafendes Handeln. „Ahnden“ gibt diesen Sinn würdig und verständlich wieder, ohne עֲלִילוֹתָם ausdrücklich zu „Missetaten“ zu verengen. „Doch“ macht den im Zusammenhang liegenden Gegensatz zur Vergebung sichtbar.
theological_decisions:
- issue: Göttliche Vergebung und vergeltende Gerechtigkeit
  choice: Der Vers nennt sowohl Gottes Vergebung als auch sein Ahnden ihrer Taten, ohne die Spannung aufzulösen.
  alternative: Man könnte die Vergeltung auf andere Personen beziehen oder Vergebung und Strafe zeitlich beziehungsweise sachlich vollständig voneinander trennen.
  rationale: 'Der hebräische Text stellt beide Aussagen nebeneinander: Gott antwortete ihnen und war ihnen gegenüber vergebend, ahndete aber zugleich ihre Taten. Die Übersetzung bewahrt diese theologische Spannung.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und das betonte „du“ bleiben erhalten. „Ahnden“ vermeidet eine unnötig drastische Formulierung und bewahrt zugleich den Gedanken gerechter Vergeltung.
