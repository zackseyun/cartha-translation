  variant: modern standard German
source:
  edition: WLC
  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: de
  text: Nicht so die Frevler! Vielmehr sind sie wie Spreu, die der Wind verweht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die der Wind forttreibt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Nicht so
  rationale: Die knappe, elliptische Verneinung bildet einen scharfen Gegensatz zum Bild des gedeihenden Gerechten im vorherigen Vers und wird ohne erklärende Ergänzung bewahrt.
- source_word: הָרְשָׁעִים
  choice: die Frevler
  rationale: „Frevler“ bezeichnet im deutschen Weisheitsstil Menschen, deren Lebensführung moralisch verkehrt ist, ohne den Ausdruck auf bloße rechtliche Schuld zu verengen.
- source_word: כִּי אִם
  choice: vielmehr
  rationale: Die Verbindung leitet nach der Verneinung eine starke Korrektur beziehungsweise Gegenüberstellung ein.
- source_word: כַּמֹּץ
  choice: wie Spreu
  rationale: מֹץ bezeichnet die leichte, beim Dreschen oder Worfeln vom Getreide getrennte Spreu; das landwirtschaftliche Bild bleibt unmittelbar erhalten.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das deutsche Relativpronomen stimmt mit dem femininen Singular „Spreu“ überein und gibt den hebräischen Relativanschluss natürlich wieder.
- source_word: תִּדְּפֶנּוּ
  choice: verweht
  rationale: Das Verb נדף beschreibt hier, wie Spreu vom Wind fortgetrieben beziehungsweise weggeblasen wird; „verweht“ ist knapp, bildhaft und idiomatisch.
- source_word: רוּחַ
  choice: der Wind
  rationale: Im Bild vom Worfeln ist eindeutig die konkrete Bedeutung „Wind“ gemeint; der bestimmte Artikel ist im Deutschen bei dieser allgemeinen Naturkraft natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusster Beibehaltung der abrupten hebräischen Gegenüberstellung. „Frevler“ hält den weisheitlichen Ton, während „verweht“ das vertraute Bild der leichten Spreu natürlich wiedergibt.
