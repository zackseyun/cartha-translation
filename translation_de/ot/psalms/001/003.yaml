source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: de
  text: Er ist wie ein Baum, gepflanzt an Wasserläufen, der seine Frucht zu seiner Zeit bringt und dessen Blätter nicht verwelken. Bei allem, was er tut, hat er Erfolg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles, was er tut, gelingt.“ Im Hebräischen kann „alles, was er tut“ auch als Subjekt des letzten Verbs verstanden werden.'
    reason: Alternative syntaktische Lesart des Schlusses
lexical_decisions:
- source_word: וְהָיָה
  choice: Er ist
  rationale: Das hebräische Perfekt mit וְ beschreibt hier als Folge der vorausgehenden Verse den beständigen Zustand des glücklichen Menschen. Im Deutschen wirkt das Präsens in einem allgemeinen Weisheitsspruch natürlicher als ein Futur.
- source_word: כְעֵץ שָׁתוּל
  choice: wie ein Baum, gepflanzt
  rationale: כְּ kennzeichnet den Vergleich; das passive Partizip שָׁתוּל bezeichnet einen bewusst an diesen Ort gesetzten Baum. „Gepflanzt“ ist klar und bildkräftig, ohne die stärkere Nuance „verpflanzt“ festzulegen.
- source_word: עַל פַלְגֵי מָיִם
  choice: an Wasserläufen
  rationale: פְּלָגִים sind geteilte Wasserläufe, Kanäle oder Bäche. „Wasserläufe“ bewahrt die mögliche natürliche wie künstliche Wasserzufuhr und passt idiomatisch zur Präposition עַל.
- source_word: פִּרְיוֹ יִתֵּן
  choice: seine Frucht bringt
  rationale: Wörtlich „seine Frucht gibt“; bei einem Baum ist „Frucht bringen“ im modernen Deutschen die natürliche und genaue Wendung.
- source_word: בְּעִתּוֹ
  choice: zu seiner Zeit
  rationale: Die Form bezeichnet den passenden oder bestimmten Zeitpunkt. „Zu seiner Zeit“ erhält die bewusste Offenheit zwischen Jahreszeit und rechtem Zeitpunkt.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: und dessen Blätter nicht verwelken
  rationale: Das hebräische „sein Blatt“ ist ein kollektiver Singular. Der deutsche Plural „Blätter“ gibt diesen Sinn natürlich wieder; יִבּוֹל bedeutet bei Pflanzen „verwelken“.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: Bei allem, was er tut, hat er Erfolg
  rationale: Diese syntaktisch mögliche Lesart bezieht das maskuline Verb auf den beschriebenen Menschen und hält den Fokus auf ihm. Die ebenfalls mögliche Auffassung, dass alles von ihm Getane gelingt, wird in der Fußnote bewahrt.
theological_decisions:
- issue: Subjekt des Schlussverbs יַצְלִיחַ
  choice: „Bei allem, was er tut, hat er Erfolg.“
  alternative: „Alles, was er tut, gelingt.“
  rationale: Die hebräische Syntax lässt sowohl den Menschen als fortgeführtes Subjekt als auch כֹל אֲשֶׁר יַעֲשֶׂה („alles, was er tut“) als Subjekt verstehen. Der Haupttext hält den persönlichen Fokus des Psalms fest; die plausible sachbezogene Lesart wird nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter poetischer Bildsprache. Das Präsens entspricht dem allgemeinen Charakter des Weisheitsspruchs; die Satzstruktur bleibt gut vorlesbar. Der Fußnotenmarker steht unmittelbar nach der von der Alternative betroffenen Aussage.
