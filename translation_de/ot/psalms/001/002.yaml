base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: de
  text: Sondern an der Weisung[a] Jahwes hat er Freude, und über seine Weisung sinnt er Tag und Nacht nach[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Gesetz Jahwes“. Das hebräische Wort bezeichnet Gottes Weisung und kann auch mit „Gesetz“ übersetzt werden.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch ein leises Sprechen, Murmeln oder Rezitieren beim Nachsinnen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sondern
  rationale: Nach den Verneinungen in Vers 1 führt die Wendung den positiven Gegensatz ein. „Sondern“ gibt diese ausschließende Gegenüberstellung im Deutschen präzise wieder.
- source_word: בְּתוֹרַת
  choice: an der Weisung
  rationale: תּוֹרָה bezeichnet hier die von Gott gegebene Unterweisung und kann auch mit „Gesetz“ wiedergegeben werden. „Weisung“ bewahrt die umfassendere Bedeutung und passt natürlich zu „Freude haben an“.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben; der Genitiv entspricht der hebräischen Verbindung „Weisung Jahwes“.
- source_word: חֶפְצוֹ
  choice: hat er Freude
  rationale: חֵפֶץ bezeichnet Gefallen, Freude oder Verlangen. Die verbale deutsche Wendung klingt natürlich und bewahrt die innere Zuwendung zur Weisung.
- source_word: וּבְתוֹרָתוֹ
  choice: und über seine Weisung
  rationale: Das Suffix bezieht sich am natürlichsten auf Jahwe. Die Wiederholung von „Weisung“ erhält den hebräischen Parallelismus; „über“ verbindet sich idiomatisch mit „nachsinnen“.
- source_word: יֶהְגֶּה
  choice: sinnt er … nach
  rationale: הגה kann sowohl inneres Nachsinnen als auch leises Sprechen oder Murmeln bezeichnen. „Nachsinnen“ gibt im Weisheitskontext den Hauptsinn wieder, während die lautliche Nuance in einer Fußnote erhalten bleibt.
- source_word: יוֹמָם וָלָיְלָה
  choice: Tag und Nacht
  rationale: Die direkte Wiedergabe erhält die poetische Merismusformel und bezeichnet zugleich beständige Beschäftigung.
theological_decisions:
- issue: Bedeutungsumfang von תּוֹרָה im Weisheitspsalm
  choice: Weisung
  alternative: Gesetz
  rationale: תּוֹרָה umfasst Gottes offenbarte Unterweisung und ist nicht auf einzelne Rechtsvorschriften beschränkt. „Weisung“ bewahrt diese Breite; „Gesetz“ bleibt wegen des bundesbezogenen und schriftbezogenen Gewichts eine berechtigte Alternative.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ macht dies sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Innere Meditation oder hörbares Rezitieren bei הגה
  choice: nachsinnen
  alternative: leise sprechen oder vor sich hin murmeln
  rationale: Der Kontext betont die fortwährende, betrachtende Beschäftigung mit Gottes Weisung. Da das Verb zugleich hörbares leises Rezitieren nahelegen kann, wird diese echte Bedeutungsnuance in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetisch knapper Satzführung. „Sondern“ hält den engen Gegensatz zu Vers 1 fest; „sinnt … nach“ wahrt den meditativen Ton, ohne die mögliche hörbare Rezitation zu verschweigen.
