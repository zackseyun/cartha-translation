  variant: modern standard German
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: de
  text: Wohl dem Mann[a], der nicht dem Rat der Frevler folgt, nicht auf dem Weg der Sünder steht und nicht im Kreis der Spötter sitzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „der Mann“ steht im maskulinen Singular, bezeichnet hier aber beispielhaft den gerechten Menschen und nicht nur männliche Personen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „nicht auf dem Sitz der Spötter sitzt“; das hebräische Wort kann einen Sitzplatz, eine Sitzung oder eine Versammlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Wohl dem
  rationale: Die hebräische Glücklichpreisung bezeichnet einen tief begünstigten, glücklichen Zustand. „Wohl dem“ gibt die Ausrufform knapp und würdig wieder, ohne sie auf ein bloßes Gefühl zu verengen.
- source_word: הָאִישׁ
  choice: dem Mann
  rationale: Das hebräische Substantiv steht im maskulinen Singular und zeichnet hier die beispielhafte gerechte Person. Die Fußnote erläutert seinen repräsentativen Gebrauch.
- source_word: הָלַךְ בַּעֲצַת
  choice: dem Rat … folgt
  rationale: Die wörtliche Wendung „im Rat gehen“ wäre im Deutschen unnatürlich. „Dem Rat folgen“ bewahrt den Gedanken, dass fremde Beratung und Orientierung das Verhalten lenken.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: „Frevler“ bezeichnet Menschen, deren Handeln moralisch schuldig und verwerflich ist, ohne die stärker konfessionell klingende Deutung „Gottlose“ einzutragen.
- source_word: וּבְדֶרֶךְ חַטָּאִים לֹא עָמָד
  choice: nicht auf dem Weg der Sünder stehen bleibt
  rationale: „Weg“ behält das weisheitliche Bild für Lebensführung bei. „Stehen bleibt“ gibt עמד natürlich wieder und lässt zugleich die zunehmende Verfestigung von Gehen über Stehen bis Sitzen erkennen.
- source_word: מוֹשַׁב לֵצִים
  choice: im Kreis der Spötter
  rationale: מוֹשָׁב kann Sitzplatz, Sitzung oder Versammlung bezeichnen. „Im Kreis“ ist im Deutschen natürlich und bringt die dauerhafte Gemeinschaft mit Menschen zum Ausdruck, die andere verhöhnen.
- source_word: יָשָׁב
  choice: sitzt
  rationale: Die konkrete Bildsprache bleibt erhalten und schließt die poetische Folge von Bewegung, Stillstand und festem Sitzen ab.
theological_decisions:
- issue: Repräsentatives Maskulinum in der Weisheitsdichtung
  choice: Mann
  alternative: Mensch; wer
  rationale: Der hebräische Text verwendet den maskulinen Singular הָאִישׁ. Die Übersetzung erhält diese Form, während die Fußnote klarstellt, dass die Aussage die beispielhafte gerechte Person beschreibt und nicht ausschließlich Männer meint.
- issue: Bedeutung von אַשְׁרֵי
  choice: Wohl dem
  alternative: Glücklich ist; Wie glücklich ist
  rationale: Die Form ist eine Glücklichpreisung und keine direkte Aussage über einen göttlichen Segensakt. „Wohl dem“ bewahrt diese Spannung und umfasst mehr als eine vorübergehende Emotion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobener poetischer Prägung. Die dreigliedrige Bewegung vom Folgen über das Stehenbleiben bis zum Sitzen bleibt erkennbar; unnatürliche hebräische Präpositionalwendungen werden idiomatisch wiedergegeben.
