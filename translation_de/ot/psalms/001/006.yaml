source:
  edition: WLC
  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: de
  text: Denn der HERR kennt den Weg der Gerechten,[a] doch der Weg der Gottlosen wird zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wacht über“. Das hebräische Wort für „kennen“ kann hier fürsorgliche Zuwendung und Anerkennung einschließen, nicht nur bloßes Wissen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den zuvor dargestellten Gegensatz ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: יֹדֵעַ
  choice: kennt
  rationale: Bewahrt die Grundbedeutung von ידע. Im Zusammenhang kann das Verb zugleich fürsorgliche, anerkennende Zuwendung ausdrücken, ohne dass diese Deutung im Haupttext festgeschrieben wird.
- source_word: יְהוָה
  choice: der HERR
  rationale: Gibt den Gottesnamen nach der etablierten deutschsprachigen Bibelkonvention wieder; die Kapitälchen werden in Klartext durch Großbuchstaben dargestellt.
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: Deckt sowohl die Lebensführung als auch ihren Verlauf und Ausgang ab und bewahrt die Wiederholung im poetischen Parallelismus.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet die Gruppe derjenigen, die gerecht sind; die deutsche Genitivform fügt sich natürlich in den Satz.
- source_word: וְ
  choice: doch
  rationale: Die Konjunktion ist formal additiv, hat im kontrastierenden Parallelismus jedoch adversative Funktion. „Doch“ bringt diesen Gegensatz würdig und knapp zum Ausdruck.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Bezeichnet im weisheitlichen Gegensatz Menschen, deren Leben moralisch schuldig und gottwidrig ist. „Frevler“ ist prägnant und im biblisch-literarischen Deutsch verständlich.
- source_word: תֹּאבֵד
  choice: vergeht
  rationale: Gibt die intransitive Form von אבד passend zum Subjekt „Weg“ wieder und bezeichnet dessen Untergang beziehungsweise Scheitern.
theological_decisions:
- issue: Bedeutung des göttlichen „Kennens“
  choice: Der Haupttext behält das lexikalisch unmittelbare „kennt“ bei; fürsorgliche und anerkennende Zuwendung bleibt als mitgemeinte Bedeutung offen.
  alternative: „Der HERR wacht über den Weg der Gerechten“ oder „Der HERR erkennt den Weg der Gerechten an“.
  rationale: ידע kann in relationalen Zusammenhängen mehr als bloßes Wissen ausdrücken. Eine stärker deutende Wiedergabe würde diese Nuance jedoch zur alleinigen Aussage machen und die genuine Bedeutungsweite einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper weisheitlicher Parallelstruktur. „Der HERR“ folgt der verbreiteten deutschen Wiedergabekonvention für den Gottesnamen; „Frevler“ erhält den markanten moralischen Gegensatz, ohne konfessionelle Sonderdeutung.
