id: PSA.1.5
reference: Psalms 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: de
  text: Darum werden die Gottlosen im Gericht[a] nicht bestehen und die Sünder nicht in der Versammlung der Gerechten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »bei einer gerichtlichen Entscheidung«. Das Hebräische kann allgemein eine richterliche Rechenschaft bezeichnen, sei es in der gegenwärtigen Ordnung oder im endgültigen Gericht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »in der Gemeinde der Gerechten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht die Folgerung aus der vorausgehenden Beschreibung der Gottlosen. »Darum« gibt diesen Schluss knapp und natürlich wieder.
- source_word: יָקֻמוּ
  choice: werden … nicht bestehen
  rationale: Das Verb קום bezeichnet wörtlich das Aufstehen oder Stehen. Im Zusammenhang mit Gericht und Gemeinschaft meint es, einer Prüfung nicht standhalten beziehungsweise keinen Bestand haben zu können. »Nicht bestehen« bewahrt den forensischen Sinn, ohne ihn weiter festzulegen.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Die Bezeichnung meint Menschen, deren Haltung und Handeln dem rechten Weg widersprechen. »Die Gottlosen« ist im deutschen Weisheits- und Psalmenstil verständlich und bewahrt die moralisch-religiöse Kategorie.
- source_word: בַּמִּשְׁפָּט
  choice: im Gericht
  rationale: מִשְׁפָּט kann Gericht, richterliche Entscheidung oder Recht bezeichnen. »Im Gericht« erhält die gerichtliche Szene und lässt offen, ob eine gegenwärtige oder endgültige Rechenschaft gemeint ist.
- source_word: חַטָּאִים
  choice: die Sünder
  rationale: Das Wort bezeichnet Menschen, die durch Sünde gekennzeichnet sind. »Die Sünder« ist die direkte, natürliche Entsprechung und erhält den Parallelismus zu »die Gottlosen«.
- source_word: בַּעֲדַת
  choice: in der Versammlung
  rationale: עֵדָה bezeichnet eine versammelte Gemeinschaft. »Versammlung« gibt den gemeinschaftlichen und korporativen Sinn wieder, ohne ihn institutionell zu verengen.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: »Die Gerechten« bewahrt die moralische und gemeinschaftsbezogene Kategorie des hebräischen צַדִּיקִים und ist im Deutschen klar und idiomatisch.
theological_decisions:
- issue: Reichweite von »Gericht«
  choice: »Im Gericht« bleibt allgemein formuliert und legt nicht fest, ob gegenwärtige richterliche Prüfung, das endgültige Gericht oder beides gemeint ist.
  alternative: Ausdrückliche Festlegung auf ein zeitliches Rechtsverfahren oder auf das eschatologische Endgericht.
  rationale: Der hebräische Ausdruck lässt einen weiten gerichtlichen Sinn zu. Der Vers kann sowohl gegenwärtige als auch endgültige Rechenschaft anklingen lassen; diese Spannung soll erhalten bleiben.
- issue: Bedeutung des Nichtbestehens
  choice: Die Gottlosen können im Gericht keinen Bestand haben.
  alternative: Sie dürfen bei einer Gerichtsverhandlung nicht aufstehen oder werden körperlich nicht auferstehen.
  rationale: Der Zusammenhang legt eine forensische Metapher nahe. Die Übersetzung vermeidet es, aus dem Verb eine Aussage über körperliche Auferstehung oder bloße Verfahrensordnung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus des Hebräischen bleibt durch die Auslassung des zweiten Verbs erhalten. »Gottlose«, »Sünder« und »Gerechte« bewahren die knappen personellen Kategorien des Weisheitsstils; »Versammlung« ist gegenüber »Gemeinde« weniger institutionell festgelegt.
