  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: de
  text: Wie lange wollt ihr alle einen Mann bestürmen und ihn niederbrechen[a] – wie eine sich neigende Mauer, wie ein umgestoßener Zaun?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihn ermorden“. Das Verb bedeutet gewöhnlich „morden“ oder „totschlagen“, kann hier im Zusammenhang mit Mauer und Zaun jedoch bildlich das Niederbrechen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der Vergleich kann den angegriffenen Mann als einsturzgefährdet beschreiben. Möglich ist auch, dass die Bilder auf die Angreifer bezogen sind.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד־אָ֤נָה
  choice: Wie lange
  rationale: Die feste Frageform wird direkt und idiomatisch wiedergegeben.
- source_word: תְּהֽוֹתְת֣וּ עַל־אִישׁ
  choice: einen Mann bestürmen
  rationale: Das seltene Verb bezeichnet einen heftigen, feindseligen Angriff. „Bestürmen“ bewahrt sowohl die Gewalt als auch die gegen eine einzelne männliche Person gerichtete Handlung.
- source_word: תְּרָצְּחוּ
  choice: ihn niederbrechen
  rationale: Obwohl das Verb gewöhnlich „morden“ oder „totschlagen“ bedeutet, legt das unmittelbar folgende Bild von Mauer und Zaun hier eine metaphorische Wiedergabe nahe. „Niederbrechen“ verbindet den Angriff auf den Mann mit dem Bild einstürzender Bauwerke, ohne die gewaltsame Aussage abzuschwächen; die wörtlichere Möglichkeit wird in einer Fußnote erhalten.
- source_word: כֻלְּכֶם
  choice: ihr alle
  rationale: Die ausdrückliche Gesamtheit der Angreifer wird knapp und natürlich wiedergegeben.
- source_word: כְּקִיר נָטוּי
  choice: wie eine sich neigende Mauer
  rationale: Die Formulierung bewahrt das konkrete Bild einer instabilen, dem Einsturz nahen Mauer.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: wie einen umgestoßenen Zaun
  rationale: דחה bezeichnet das Wegstoßen oder Niederdrücken. „Umgestoßen“ bleibt dem konkreten Bild näher als das stärker deutende „wankend“ und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bezug der Vergleiche auf Mann oder Angreifer
  choice: Im Haupttext beziehen sich Mauer und Zaun auf den angegriffenen Mann.
  alternative: Die Angreifer könnten als eine sich gegen ihn drängende, instabile Mauer beziehungsweise Einfriedung beschrieben sein.
  rationale: Syntax und Abfolge erlauben mehr als einen Bezug. Die Hauptfassung folgt dem naheliegenden Bild des beinahe niedergebrochenen Opfers, während die Fußnote die echte poetische Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftigen Verben und die konkreten Baubilder bewahren den poetischen Angriffston; seltene oder konfessionell geprägte Formulierungen werden vermieden.
