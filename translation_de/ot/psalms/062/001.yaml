base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: de
  text: Nur auf Gott wartet meine Seele in Stille[a]; von ihm kommt meine Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck ist elliptisch und lautet wörtlich etwa: „Nur zu Gott hin – Stille, meine Seele.“ Auch möglich: „Bei Gott allein findet meine Seele Ruhe.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nur
  rationale: Die Partikel wirkt hier vor allem einschränkend und betont die ausschließliche Ausrichtung auf Gott; „nur“ bewahrt zugleich die knappe poetische Form.
- source_word: אֶל
  choice: auf
  rationale: Die Präposition bezeichnet die Ausrichtung auf Gott. In Verbindung mit dem im Deutschen ergänzten „wartet“ ist „auf Gott“ die natürliche Formulierung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: In diesem singularischen Bezug bezeichnet das Wort den Gott Israels.
- source_word: דּוּמִיָּה
  choice: in Stille
  rationale: Das Substantiv bezeichnet Stille, Schweigen oder Ruhe. „In Stille“ erhält das zentrale Bild, ohne es ausschließlich als innere Ruhe zu deuten.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Das Wort kann die Person selbst, ihr Leben oder ihr Inneres bezeichnen. „Meine Seele“ passt zum poetischen Zusammenhang und bewahrt die traditionelle Bildsprache.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Die Präposition kennzeichnet Gott als Ursprung der Rettung.
- source_word: יְשׁוּעָתִי
  choice: meine Rettung
  rationale: Das Substantiv bezeichnet Rettung oder Befreiung. „Rettung“ ist im heutigen Deutsch klar und lässt sowohl konkrete Befreiung als auch die weitergehende theologische Bedeutung offen.
theological_decisions:
- issue: Sinn der Nominalkonstruktion דּוּמִיָּה נַפְשִׁי
  choice: Stilles Warten auf Gott
  alternative: Schweigen vor beziehungsweise zu Gott hin; Ruhe bei Gott
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb; das Substantiv kann Schweigen, Stille oder ruhiges Warten ausdrücken. Der Haupttext ergänzt für natürliches Deutsch „wartet“, behält aber mit „in Stille“ das hebräische Bild bei. Die Fußnote macht die echte Mehrdeutigkeit sichtbar.
translation_notes:
  register: Moderne, schlichte und würdevolle Psalmsprache. Die Satzstellung bewahrt die Hervorhebung Gottes am Versanfang; „Rettung“ ist gegenwärtiger als das mögliche, aber stärker traditionssprachliche „Heil“.
