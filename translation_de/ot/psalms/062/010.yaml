id: PSA.62.10
reference: Psalms 62:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: de
  text: Vertraut nicht auf Unterdrückung, und setzt keine trügerische Hoffnung auf Raub[a]. Wenn der Reichtum wächst, hängt euer Herz nicht daran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Werdet durch Raub nicht nichtig«; möglicherweise auch: »Rühmt euch nicht des Raubes.« Das hebräische Verb ist schwer zu deuten und kann ein leeres oder nichtiges Verhalten bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: vertraut
  rationale: Das Verb בטח bezeichnet Vertrauen beziehungsweise das Setzen von Zuversicht auf etwas; „vertraut“ ist im Deutschen klar und natürlich.
- source_word: בְעֹשֶׁק
  choice: auf Unterdrückung
  rationale: עֹשֶׁק umfasst Unterdrückung, Ausbeutung und Erpressung. „Unterdrückung“ bewahrt die breite ethische Bedeutung.
- source_word: בְגָזֵל
  choice: auf Raub
  rationale: גָזֵל bezeichnet Raub oder gewaltsam Weggenommenes. „Raub“ gibt den Ausdruck knapp wieder und steht passend parallel zu „Unterdrückung“.
- source_word: תֶּהְבָּלוּ
  choice: setzt keine trügerische Hoffnung
  rationale: Die schwierige Verbform von הבל kann ein leeres, nichtiges oder verblendetes Verhalten ausdrücken. Die gewählte Wiedergabe passt zum parallelen Vertrauensmotiv, während die Fußnote die formnäheren Alternativen offenhält.
- source_word: חַיִל
  choice: Reichtum
  rationale: חַיִל kann Kraft, Besitz oder Vermögen bedeuten; zusammen mit יָנוּב ist hier wachsender materieller Reichtum gemeint.
- source_word: כִּי יָנוּב
  choice: wenn der Reichtum wächst
  rationale: נוב bedeutet ursprünglich „sprossen“ und übertragen „zunehmen“. „Wenn … wächst“ erhält sowohl das Bild des Wachstums als auch die kontextuelle Bedingung.
- source_word: תָּשִׁיתוּ לֵב
  choice: hängt euer Herz nicht daran
  rationale: Die Wendung שׁית לב beschreibt das innere Ausrichten des Herzens auf etwas. Die deutsche Formulierung ist idiomatisch und bewahrt das Herzmotiv.
theological_decisions:
- issue: Sinn der Warnung im mittleren Satzglied
  choice: Der Haupttext versteht die schwierige Form als Warnung davor, auf Raub eine trügerische Hoffnung zu setzen.
  alternative: Die Form kann näher am Wortlaut auch als „werdet durch Raub nicht nichtig“ oder möglicherweise als Warnung vor dem Rühmen des Raubes verstanden werden.
  rationale: Die gewählte Lesart nimmt die Parallele zum Vertrauen im ersten Satzglied auf, ohne die lexikalische Unsicherheit zu verschweigen; die Fußnote bewahrt die anderen möglichen Deutungen.
- issue: Übergang von ungerechtem Gewinn zu Reichtum allgemein
  choice: Der letzte Satz warnt auch dann vor innerer Bindung an Reichtum, wenn dieser einfach zunimmt.
  alternative: Man könnte den Reichtum ausschließlich auf den zuvor genannten ungerechten Erwerb beziehen.
  rationale: Der unbestimmte Ausdruck חַיִל erlaubt eine allgemeine Warnung vor wachsendem Reichtum; der Zusammenhang mit Unterdrückung und Raub bleibt zugleich bestehen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem poetischem Ton. Die parallelen Warnungen bleiben knapp; das traditionelle Herzbild wird in einer natürlichen deutschen Wendung bewahrt.
