id: PSA.62.8
reference: Psalms 62:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בִּטְח֘וּ ב֤/וֹ בְ/כָל עֵ֨ת עָ֗ם שִׁפְכֽוּ לְ/פָנָ֥י/ו לְבַבְ/כֶ֑ם אֱלֹהִ֖ים מַחֲסֶה לָּ֣/נוּ סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: de
  text: Vertraut ihm zu jeder Zeit[a], Volk[b]; schüttet vor ihm eure Herzen[c] aus! Gott ist für uns eine Zuflucht. Sela[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „allezeit“; wörtlich: „zu jeder Zeit“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort steht im Singular und redet die Gemeinschaft unmittelbar als „Volk“ an.
    reason: cultural_note
  - marker: c
    text: „Das Herz ausschütten“ ist ein hebräisches Bild dafür, die eigenen inneren Gedanken, Wünsche und Nöte offen vor Gott auszudrücken.
    reason: lexical_alternative
  - marker: d
    text: „Sela“ ist vermutlich ein liturgischer oder musikalischer Ausdruck; seine genaue Bedeutung ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: Vertraut ihm
  rationale: Das Qal-Imperativ Plural von בטח bezeichnet hier das vertrauensvolle Sichverlassen auf Gott. Im Deutschen verbindet sich „vertrauen“ natürlich mit dem Dativ.
- source_word: בְכָל־עֵת
  choice: zu jeder Zeit
  rationale: Die Wendung bedeutet wörtlich „zu jeder Zeit“ und umfasst alle Lebenslagen, ohne sie stärker als ununterbrochenen Zustand auszudeuten.
- source_word: עָם
  choice: Volk
  rationale: Das singularische Kollektiv ist eine direkte Anrede an die Gemeinschaft. „Volk“ bewahrt diese Form, auch wenn die Anrede im Deutschen poetisch markiert klingt.
- source_word: שִׁפְכוּ לְפָנָיו לְבַבְכֶם
  choice: schüttet vor ihm euer Herz aus
  rationale: Die konkrete Metapher des Ausschüttens bleibt erhalten. „Vor ihm“ gibt die Gegenwart Gottes wieder; der singularische Ausdruck „euer Herz“ entspricht dem hebräischen Kollektivgebrauch und ist als deutsche Gebetswendung verständlich.
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: Gott ist für uns eine Zuflucht
  rationale: מַחֲסֶה bezeichnet einen Schutz- oder Zufluchtsort; לָנוּ wird als Dativ des Vorteils mit „für uns“ wiedergegeben.
- source_word: סֶלָה
  choice: Sela
  rationale: Der wahrscheinlich liturgische oder musikalische Ausdruck wird wegen seiner unsicheren genauen Bedeutung transkribiert statt gedeutet.
theological_decisions:
- issue: Gemeinschaftliche Anrede עָם
  choice: Die versammelte Gemeinschaft wird kollektiv als „Volk“ angeredet.
  alternative: „ihr Menschen“, „ihr Völker“ oder eine nicht als Anrede verstandene Wiedergabe
  rationale: Der Singular עָם und seine Stellung nach dem pluralischen Imperativ sprechen für eine kollektive direkte Anrede. „Völker“ wäre textlich nicht gedeckt, „Menschen“ würde den Bezug verallgemeinern.
- issue: Bild vom Ausschütten des Herzens
  choice: Die Metapher wird als „euer Herz ausschütten“ bewahrt.
  alternative: Erklärend mit „eure innersten Gedanken und Wünsche offen aussprechen“ wiedergeben
  rationale: Das Bild bezeichnet offene, rückhaltlose Hinwendung zu Gott, sollte aber im Haupttext nicht auf einen einzelnen inneren Vorgang eingeengt werden.
- issue: Bedeutung von סֶלָה
  choice: Als „Sela“ unübersetzt beibehalten.
  alternative: „Pause“, „Zwischenspiel“ oder eine andere musikalische Deutung
  rationale: Die genaue Funktion des Ausdrucks ist ungeklärt; eine konkrete Übersetzung würde größere Sicherheit vortäuschen, als die Quellenlage erlaubt.
translation_notes:
  register: Moderne, würdevolle Psalmenprosa mit bewahrter Bildsprache. Die ungewöhnlich knappe Anrede „Volk“ folgt bewusst dem singularischen hebräischen Kollektiv. „Sela“ wird in der im Deutschen üblichen Form transkribiert.
