base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: de
  text: Und dir, Herr, gehört beständige Liebe,[a] denn du vergiltst jedem nach seinem Tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und dir, Herr, [ist] beständige Liebe.“ Im Hebräischen steht ein Satz ohne ausgedrücktes Verb; das vorangestellte „dir“ betont, dass diese Liebe dem Herrn gehört beziehungsweise ihm eigen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְךָ
  choice: Und dir ... gehört
  rationale: Die vorangestellte Präpositionalphrase bezeichnet in dem verblosen Satz Zugehörigkeit und hebt hervor, dass die genannte Eigenschaft dem Herrn eigen ist.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der Gottesname steht hier als Titel und direkte Anrede; „Herr“ ist die natürliche deutsche Wiedergabe.
- source_word: חָסֶד
  choice: beständige Liebe
  rationale: Der Ausdruck umfasst Liebe, Güte und verlässliche Loyalität. „Beständige Liebe“ bewahrt sowohl die persönliche als auch die dauerhafte Dimension.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier eine Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein.
- source_word: תְשַׁלֵּם
  choice: du vergiltst
  rationale: Die Piel-Form bezeichnet, jemandem zukommen zu lassen, was seinem Handeln entspricht, und bleibt sowohl für positive als auch für negative Vergeltung offen.
- source_word: לְאִישׁ
  choice: jedem
  rationale: Das grammatisch maskuline Singularwort wird hier allgemein und distributiv gebraucht. „Jedem“ gibt diesen Sinn im modernen Deutschen natürlich wieder, ohne den Bezug auf Personen zu verwischen.
- source_word: כְּמַעֲשֵׂהוּ
  choice: nach seinem Tun
  rationale: Die Wendung bezeichnet die Entsprechung zwischen Vergeltung und dem, was die betreffende Person getan hat. „Tun“ bewahrt den singularischen, umfassenden Charakter besser als eine Beschränkung auf eine einzelne Tat.
theological_decisions:
- issue: Verhältnis von Gottes beständiger Liebe zu seiner Vergeltung
  choice: 'Beide Aussagen bleiben unverkürzt nebeneinander stehen: Gottes beständige Liebe und sein Vergelten nach dem Tun jedes Einzelnen.'
  alternative: חָסֶד ausschließlich als Erbarmen oder תְשַׁלֵּם ausschließlich als Belohnen deuten.
  rationale: Der hebräische Vers verbindet Liebe beziehungsweise loyale Güte mit gerechter Vergeltung. Die Übersetzung darf diese Spannung nicht durch eine einseitige Deutung auflösen.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Beständige Liebe“ ist verständlich und bildet die Dauerhaftigkeit von חָסֶד ab; „vergiltst“ wahrt die Offenheit für Lohn wie Gericht. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den sich die Anmerkung bezieht.
