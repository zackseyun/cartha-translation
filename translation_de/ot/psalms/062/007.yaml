id: PSA.62.7
reference: Psalms 62:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל אֱ֭לֹהִים יִשְׁעִ֣/י וּ/כְבוֹדִ֑/י צוּר עֻזִּ֥/י מַ֝חְסִ֗/י בֵּֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/007.yaml
  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: de
  text: Auf Gott ruhen meine Rettung und meine Ehre[a]; der Fels meiner Stärke, meine Zuflucht, ist in Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Herrlichkeit“. Gemeint sein können auch die Würde, das Ansehen oder die Rechtfertigung des Psalmisten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier die Grundlage, auf der Rettung und Ehre beruhen. Zusammen mit dem im Deutschen ergänzten Verb „ruhen“ bleibt das Bild der Abhängigkeit von Gott erhalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die übliche Wiedergabe, wenn אֱלֹהִים den Gott Israels bezeichnet.
- source_word: יִשְׁעִי
  choice: meine Rettung
  rationale: Das Wort bezeichnet Rettung oder Befreiung. „Rettung“ ist verständlich und bewahrt sowohl die konkrete als auch die theologische Weite.
- source_word: וּכְבוֹדִי
  choice: und meine Ehre
  rationale: כָּבוֹד kann „Herrlichkeit“ oder „Ehre“ bedeuten. Bei einer menschlichen Person bezeichnet „meine Ehre“ natürlich ihre Würde, ihr Ansehen oder ihre Rechtfertigung, ohne die Mehrdeutigkeit ganz aufzulösen.
- source_word: צוּר
  choice: der Fels
  rationale: Die konkrete Metapher für Beständigkeit und Schutz wird unverändert bewahrt.
- source_word: עֻזִּי
  choice: meiner Stärke
  rationale: עֹז bedeutet hier Stärke oder Macht. „Stärke“ ist die direkte Entsprechung und führt kein zusätzliches Festungsbild ein.
- source_word: מַחְסִי
  choice: meine Zuflucht
  rationale: Das Substantiv bezeichnet einen Zufluchts- oder Schutzort; „Zuflucht“ ist im Deutschen klar und psalmengemäß.
- source_word: בֵּאלֹהִים
  choice: ist in Gott
  rationale: Die Präposition ב bezeichnet hier den Ort oder Grund der Zuflucht. Das im Hebräischen ausgelassene Kopulaverb wird für einen natürlichen deutschen Satz ergänzt.
theological_decisions:
- issue: Beziehung der einleitenden Präpositionalphrase zu den verblosen Aussagen
  choice: Die Aussage wird als Bekenntnis wiedergegeben, dass Rettung und Ehre des Psalmisten auf Gott ruhen; abschließend wird Gott als der Ort seiner Zuflucht bezeichnet.
  alternative: 'Formaler: „Bei Gott sind meine Rettung und meine Ehre“ oder „Auf Gott sind meine Rettung und meine Ehre“.'
  rationale: Der hebräische Vers ist verblos und poetisch. „Auf Gott ruhen“ macht die Abhängigkeit deutlich, ohne die Aussage stärker dogmatisch festzulegen.
- issue: Bedeutung von כְבוֹדִי
  choice: meine Ehre
  alternative: meine Herrlichkeit
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Ehre“ ist bei der Selbstbezeichnung des Psalmisten im modernen Deutsch natürlicher und kann Würde, Ansehen oder Rechtfertigung umfassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Die verblosen hebräischen Sätze werden durch „ruhen“ und „ist“ idiomatisch erschlossen; die Wiederholung von „Gott“ und die Felsmetapher bleiben erhalten.
