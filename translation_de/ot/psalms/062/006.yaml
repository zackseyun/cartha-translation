  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹ֣א אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: de
  text: Er allein ist mein Fels und meine Rettung, meine sichere Burg; ich werde nicht wanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ich werde nicht erschüttert werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ הוּא
  choice: Er allein
  rationale: אַךְ hebt hier im Zusammenhang die Ausschließlichkeit hervor. „Er allein“ gibt diese Betonung in natürlichem modernem Deutsch wieder.
- source_word: צוּרִי
  choice: mein Fels
  rationale: צוּר bezeichnet einen Felsen und dient hier als Bild für Gottes Beständigkeit und Schutz. „Mein Fels“ bewahrt die prägnante Metapher.
- source_word: וִישׁוּעָתִי
  choice: meine Rettung
  rationale: יְשׁוּעָה kann Rettung, Befreiung oder Heil bezeichnen. „Rettung“ ist im heutigen Deutsch unmittelbar verständlich und lässt sowohl konkrete Befreiung als auch den umfassenderen Sinn offen.
- source_word: מִשְׂגַּבִּי
  choice: meine sichere Burg
  rationale: מִשְׂגָּב bezeichnet einen erhöhten, geschützten Zufluchtsort. „Sichere Burg“ vermittelt Schutz und Wehrhaftigkeit in natürlichem, poetischem Deutsch.
- source_word: לֹא אֶמּוֹט
  choice: ich werde nicht wanken
  rationale: Das Nifal von מוֹט bezeichnet das Ins-Wanken-Geraten oder Erschüttertwerden. „Nicht wanken“ bewahrt das Bild der Standfestigkeit knapp und idiomatisch.
theological_decisions:
- issue: Grad der Zuversicht im Schlusssatz
  choice: ich werde nicht wanken
  alternative: ich werde nicht erschüttert werden
  rationale: Die Aussage drückt festes Vertrauen auf Gott als sicheren Schutz aus. „Nicht wanken“ wahrt das Stabilitätsbild, ohne daraus eine allgemeine Behauptung persönlicher Unverwundbarkeit zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Die drei Schutzbilder bleiben erhalten; unnötig altertümliche Wörter werden vermieden.
