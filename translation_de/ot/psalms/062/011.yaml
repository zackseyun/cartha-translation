  text: אַחַ֤ת דִּבֶּ֬ר אֱלֹהִ֗ים שְׁתַּֽיִם ז֥וּ שָׁמָ֑עְתִּי כִּ֥י עֹ֝֗ז לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: de
  text: 'Eines hat Gott gesprochen[a], zweierlei habe ich gehört: dass Macht Gott gehört.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einmal hat Gott gesprochen; zweimal habe ich dies gehört.« Die hebräische Wendung kann adverbial (»einmal/zweimal«) oder als Zahlenspruchformel (»eines/zweierlei«) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: Eines
  rationale: Die feminine Singularzahl bedeutet wörtlich »eins«. Zusammen mit »zwei« wird sie hier am besten als Teil einer Zahlenspruchformel verstanden; »Eines« bewahrt diese rhetorische Struktur knapp und natürlich.
- source_word: דִּבֶּר
  choice: hat gesprochen
  rationale: Das Perfekt bezeichnet eine vollendete Äußerung mit fortdauernder Bedeutung. »Hat gesprochen« entspricht dem hebräischen Verb und passt zum reflektierenden Charakter des Verses.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die formal plurale Form hat hier eindeutig singularische Bedeutung und bezeichnet den Gott Israels.
- source_word: שְׁתַּיִם
  choice: zweierlei
  rationale: In Verbindung mit אַחַת setzt das Wort die Zahlenspruchformel fort. »Zweierlei« ist im Deutschen idiomatisch und signalisiert, dass zwei Aussagen gemeint sind, ohne das Wort »Dinge« ergänzen zu müssen.
- source_word: זוּ
  choice: in »zweierlei« aufgenommen
  rationale: Die hinweisende Form verweist auf den folgenden Inhalt. Im Deutschen wird ihre Funktion natürlich durch »zweierlei« und den anschließenden Inhaltssatz wiedergegeben.
- source_word: שָׁמָעְתִּי
  choice: habe ich gehört
  rationale: Das Perfekt wird als vollendetes Hören mit gegenwärtiger Relevanz wiedergegeben und bildet einen natürlichen Parallelismus zu »hat gesprochen«.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was der Psalmist gehört hat. »Dass« macht diese syntaktische Funktion im Deutschen klar.
- source_word: עֹז
  choice: Stärke
  rationale: Das Substantiv bezeichnet Stärke oder Macht. »Stärke« ist verständlich, würdig und wahrt die lexikalische Eigenart des Begriffs.
- source_word: לֵאלֹהִים
  choice: Gott gehört
  rationale: Die Präposition לְ drückt hier Besitz oder Zuordnung aus. »Gott gehört« gibt dies im Deutschen direkt und idiomatisch wieder.
theological_decisions:
- issue: Zahlenspruchformel »eins … zwei«
  choice: »Eines hat Gott gesprochen; zweierlei habe ich gehört«
  alternative: »Einmal hat Gott gesprochen; zweimal habe ich dies gehört«
  rationale: Das Hebräische lässt sowohl eine adverbiale Deutung als »einmal/zweimal« als auch eine Zahlenspruchformel zu. Die Hauptfassung folgt der Zahlenspruchformel, weil sie den rhetorischen Aufbau und den folgenden Inhaltssatz gut erklärt; die echte Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Satzstellung und der Zahlenparallelismus bleiben erhalten; die genuine Mehrdeutigkeit des hebräischen Ausdrucks wird nicht im Haupttext aufgelöst, sondern durch die Fußnote dokumentiert.
