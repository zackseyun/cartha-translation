base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/002.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: de
  text: Nur er ist mein Fels und meine Rettung, meine Festung; ich werde nicht allzu sehr wanken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: nur
  rationale: Im Zusammenhang hebt אַךְ Gott als alleinige Grundlage der Sicherheit hervor. „Nur“ gibt diese ausschließende Bedeutung knapp und natürlich wieder.
- source_word: הוּא
  choice: er
  rationale: 'Das selbstständige Pronomen verweist auf Gott und trägt zusammen mit אַךְ die Betonung: „Nur er“.'
- source_word: צוּרִי
  choice: mein Fels
  rationale: צוּר bezeichnet einen Felsen und dient hier als Bild für Beständigkeit und Schutz. „Mein Fels“ bewahrt die vertraute biblische Metapher.
- source_word: וִישׁוּעָתִי
  choice: meine Rettung
  rationale: יְשׁוּעָה kann Rettung, Heil oder Befreiung bezeichnen. „Rettung“ ist in diesem konkreten Zusammenhang verständlich und bewahrt die Aussage, dass Gott selbst die Rettung des Beters ist.
- source_word: מִשְׂגַּבִּי
  choice: meine Festung
  rationale: מִשְׂגָּב bezeichnet einen sicheren, erhöhten Zufluchtsort. „Festung“ erhält das Bild eines geschützten, schwer einnehmbaren Ortes.
- source_word: לֹא אֶמּוֹט
  choice: ich werde nicht ins Wanken geraten
  rationale: Das Nifal von מוֹט bezeichnet das Wanken, Schwanken oder Erschüttertwerden. Die deutsche Wendung ist natürlich und hält das Bild körperlicher Instabilität fest.
- source_word: רַבָּה
  choice: sehr
  rationale: רַבָּה wird hier adverbial gebraucht und bestimmt das Ausmaß des Wankens. „Sehr“ gibt diese Abschwächung gegenüber einer absoluten Aussage unmittelbar wieder.
theological_decisions:
- issue: Grad der im Schlusssatz ausgedrückten Sicherheit
  choice: ich werde nicht sehr ins Wanken geraten
  alternative: ich werde nicht ins Wanken geraten
  rationale: Das hebräische רַבָּה bezeichnet ausdrücklich einen Grad („sehr“, „stark“). Die Wiedergabe bewahrt die Spannung der Formulierung und harmonisiert sie nicht mit der stärkeren, unmodifizierten Aussage in Psalm 62,7.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauten biblischen Bildern. Der Satz bleibt knapp und parallel gebaut; die ungewöhnliche, aber bedeutungsvolle Gradangabe im Schluss wird im Haupttext bewahrt.
