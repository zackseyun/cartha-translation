  text: אַ֣ךְ לֵ֭/אלֹהִים דּ֣וֹמִּי נַפְשִׁ֑/י כִּי מִ֝מֶּ֗/נּוּ תִּקְוָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/005.yaml
  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
translation:
  language: de
  text: Bei Gott allein, meine Seele, sei still, denn von ihm kommt meine Hoffnung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לֵאלֹהִים
  choice: für Gott allein
  rationale: 'אַךְ bezeichnet hier die Ausschließlichkeit: Die innere Ausrichtung der Seele gilt Gott allein. Die Wortstellung ist im Deutschen natürlich und vermeidet das missverständliche „nur für Gott“.'
- source_word: דּוֹמִּי
  choice: sei still
  rationale: Die punktierte Form wird als feminine Aufforderung an נַפְשִׁי verstanden. „Sei still“ gibt die Grundbedeutung von דמם knapp wieder; das im Kontext mögliche ruhige Warten wird in der Fußnote genannt.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Bewahrt die hebräische Form der Selbstanrede und ist in einem Psalm auf modernem Deutsch verständlich und würdevoll.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die Aufforderung ein.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Das Pronomen verweist auf Gott zurück und bewahrt den Zusammenhang des hebräischen Satzes.
- source_word: תִּקְוָתִי
  choice: meine Hoffnung
  rationale: Die geläufige und kontextgemäße Wiedergabe von תִּקְוָה.
theological_decisions:
- issue: Aussage oder Aufforderung bei דּוֹמִּי
  choice: 'Aufforderung: „Sei still …, meine Seele“'
  alternative: 'Aussage: „Für Gott allein wartet meine Seele still“'
  rationale: Die masoretisch punktierte Form דּוֹמִּי lässt sich als feminine Imperativform verstehen, die zur direkten Anrede נַפְשִׁי passt. Da die Konsonantenform auch anders aufgefasst werden kann, bleibt die Aussage als Alternative in der Fußnote erhalten.
- issue: Bedeutungsumfang von דמם
  choice: „sei still“
  alternative: „warte still“ oder „warte schweigend“
  rationale: „Sei still“ bleibt nahe an der Grundbedeutung, ohne den aus dem Kontext erschlossenen Gedanken des Wartens in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Selbstanrede. „Für Gott allein“ erhält die ausschließliche Ausrichtung des hebräischen אַךְ, während „Sei still“ die Mehrdeutigkeit des Verbs nicht unnötig ausdeutet.
