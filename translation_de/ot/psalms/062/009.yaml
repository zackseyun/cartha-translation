  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: de
  text: Nur ein Hauch sind die Menschen, Trug sind die Männer.[a] Auf der Waage steigen sie empor; allesamt sind sie leichter als ein Hauch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutend: „Menschen niedrigen Standes“ und „Menschen hohen Standes“. Das Hebräische verwendet zwei verschiedene Ausdrücke für Menschen, wörtlich etwa „Söhne des Menschen“ und „Söhne des Mannes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Ja, nur
  rationale: Die Verbindung gibt sowohl den bekräftigenden als auch den einschränkenden Ton von אַךְ wieder und klingt im poetischen Deutschen natürlich.
- source_word: הֶבֶל
  choice: ein Hauch
  rationale: Das Bild bezeichnet etwas Flüchtiges und Substanzloses; „Hauch“ bewahrt die konkrete Metapher und wird im letzten Versglied wiederholt.
- source_word: בְּנֵי אָדָם
  choice: die Menschensöhne
  rationale: Die wörtliche, poetische Bildung hält den Unterschied zu בְּנֵי אִישׁ sichtbar, ohne ihn vorschnell als sozialen Rangunterschied auszulegen.
- source_word: כָּזָב
  choice: eine Täuschung
  rationale: Das Substantiv bezeichnet Lüge, Falschheit oder Unzuverlässigkeit. „Täuschung“ lässt offen, ob die Menschen aktiv täuschen oder sich als trügerisch und unzuverlässig erweisen.
- source_word: בְּנֵי אִישׁ
  choice: die Mannessöhne
  rationale: Die bewusst markierte Wiedergabe bewahrt die lexikalische Parallele und Differenz gegenüber „Menschensöhne“; eine soziale Deutung wird nur in der Fußnote genannt.
- source_word: בְּמֹאזְנַיִם
  choice: Auf der Waage
  rationale: Dies ist im modernen Deutschen die natürliche Bezeichnung für das im Hebräischen dual formulierte Wiegegerät.
- source_word: לַעֲלוֹת
  choice: schnellen sie empor
  rationale: Das Verb bedeutet „hinaufgehen/steigen“. Im Bild der Waage macht die Formulierung anschaulich, dass sie wegen ihres fehlenden Gewichts nach oben gehen, ohne bloß deutend „gewogen werden“ zu schreiben.
- source_word: מֵהֶבֶל
  choice: leichter als ein Hauch
  rationale: Der komparative Sinn ergibt sich aus dem Waagenbild; „leichter“ verdeutlicht den Vergleich, während „Hauch“ die Metapher des ersten Versglieds bewahrt.
- source_word: יָחַד
  choice: zusammen
  rationale: 'Das Wort bezeichnet die gemeinsame Gesamtheit: Beide genannten Menschengruppen gelten gleichermaßen als substanzlos.'
theological_decisions:
- issue: Wiedergabe von בְּנֵי אָדָם / בְּנֵי אִישׁ
  choice: Die formale Unterscheidung wird mit „Menschensöhne“ und „Mannessöhne“ im Haupttext bewahrt.
  alternative: „Menschen niedrigen Standes“ und „Menschen hohen Standes“
  rationale: Die soziale Rangdeutung ist plausibel, steht aber nicht ausdrücklich in den beiden hebräischen Ausdrücken. Der Haupttext bewahrt daher die echte Mehrdeutigkeit; die interpretierende Alternative erscheint in der Fußnote.
translation_notes:
  register: Modernes, würdiges poetisches Deutsch. Die ungewöhnlichen Zusammensetzungen „Menschensöhne“ und „Mannessöhne“ sind bewusst gewählt, um die ebenfalls markierte hebräische Parallelbildung und ihre Mehrdeutigkeit sichtbar zu halten. Der Fußnotenmarker [a] steht unmittelbar nach dem betreffenden Ausdruckspaar.
