  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: de
  text: Nur darauf sind sie bedacht, ihn von seiner Höhe zu stürzen[a]; sie haben Gefallen an der Lüge. Mit dem Mund segnen sie, doch in ihrem Innern fluchen sie[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von seiner Würde“, „von seiner Erhöhung“ oder „von seiner hohen Stellung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Mit seinem Mund segnen sie“; wahrscheinlich ist kollektiv gemeint: Nach außen segnen sie, doch innerlich fluchen sie.'
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Nur darauf
  rationale: Die Partikel schränkt hier die Absicht der Gegner ein; die Wendung gibt den restriktiven Sinn im Deutschen natürlich wieder.
- source_word: מִשְּׂאֵתוֹ
  choice: von seiner Höhe
  rationale: שְׂאֵת kann Erhebung, Hoheit, Würde oder eine erhöhte Stellung bezeichnen. „Höhe“ bewahrt die räumliche Metapher und lässt offen, ob Rang, Ansehen oder Würde im Vordergrund steht.
- source_word: יָעֲצוּ
  choice: sind sie bedacht
  rationale: Das Verb bezeichnet Beraten, Planen oder Sinnen. Im feindseligen Zusammenhang drückt „darauf bedacht sein“ die zielgerichtete Absicht idiomatisch aus.
- source_word: לְהַדִּיחַ
  choice: zu stürzen
  rationale: Der Hifil-Infinitiv von נדח bezeichnet ein Wegstoßen, Vertreiben oder Zu-Fall-Bringen. Zusammen mit „von seiner Höhe“ ist „stürzen“ prägnant und bildhaft.
- source_word: יִרְצוּ כָזָב
  choice: sie haben Gefallen an der Lüge
  rationale: רצה mit כזב bezeichnet Wohlgefallen an Falschheit oder Lüge. Die Formulierung bleibt nahe am Hebräischen und klingt zugleich natürlich.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: Mit dem Mund segnen sie
  rationale: Der überlieferte Text hat wörtlich den Singular „mit seinem Mund“, doch der Parallelismus mit „in ihrem Innern“ legt einen kollektiven Bezug auf die Gegner nahe. Der Singular „dem Mund“ bewahrt dabei die hebräische Form so weit wie im Deutschen sinnvoll.
- source_word: וּבְקִרְבָּם
  choice: in ihrem Innern
  rationale: Die Wendung bedeutet wörtlich „in ihrem Inneren/in ihrer Mitte“ und bezeichnet hier die verborgene innere Haltung im Gegensatz zum gesprochenen Segen.
- source_word: יְקַלְלוּ
  choice: fluchen sie
  rationale: Das Verb steht in scharfem Gegensatz zu „segnen“ und wird daher unmittelbar mit „fluchen“ wiedergegeben.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Funktion des liturgisch-musikalischen Ausdrucks ist unsicher; eine Transliteration vermeidet eine unbelegte Deutung.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe bei „seiner Höhe“ und dem Ziel des Stürzens
  choice: Die Gegner wollen den einzelnen, im Kontext angesprochenen Psalmisten beziehungsweise Gerechten von seiner erhöhten oder angesehenen Stellung stürzen.
  alternative: Man könnte unpersönlicher von „einem“ sprechen oder stärker die Würde beziehungsweise Ehre statt einer Stellung betonen.
  rationale: Das Hebräische markiert ein maskulines singularisches Ziel. Die Übersetzung bewahrt diesen persönlichen Bezug, ohne den Betroffenen christologisch, königlich oder anderweitig enger zu bestimmen.
- issue: Numerus in „mit seinem Mund segnen sie“
  choice: Im Haupttext wird der wahrscheinliche kollektive Sinn als „Mit dem Mund segnen sie“ wiedergegeben.
  alternative: Formal könnte man „Mit seinem Mund segnen sie“ übersetzen.
  rationale: Die Form בְּפִיו ist singularisch, steht aber neben dem eindeutigen Plural „in ihrem Innern“. Wahrscheinlich ist der Mund kollektiv oder distributiv gemeint; die Fußnote bewahrt die formale Auffälligkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von Höhe und Sturz bleibt erhalten; syntaktische Glättung dient der Verständlichkeit, ohne die Ambiguität von שְׂאֵת oder die Numerusauffälligkeit bei בְּפִיו zu verdecken.
