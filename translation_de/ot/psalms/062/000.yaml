id: PSA.62.0
reference: Psalms 62:0
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל יְדוּת֗וּן מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/000.yaml
  text: 'For the choir director: according to Jeduthun[a]. A psalm of David[b].'
translation:
  language: de
  text: Für den musikalischen Leiter. Nach Jedutun[a]. Ein Psalm Davids[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »über Jedutun« oder »für Jedutun«. Die Wendung kann eine Melodie, eine musikalische Art oder eine Aufführungsanweisung bezeichnen, die mit Jedutun verbunden ist.'
    reason: alternative_reading
  - marker: b
    text: Die Überschrift »Davids« kann Urheberschaft, Widmung oder eine andere Zuordnung zu David ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Bezeichnung meint in Psalmüberschriften wahrscheinlich den Verantwortlichen für die musikalische Aufführung. »Musikalischer Leiter« ist modern, verständlich und legt sich nicht unnötig auf einen reinen Chor fest.
- source_word: עַל
  choice: Nach
  rationale: In Verbindung mit Jedutun kann die Präposition eine Melodie, eine musikalische Art oder eine Aufführungsanweisung bezeichnen. »Nach« lässt diese Möglichkeiten offen.
- source_word: יְדוּתוּן
  choice: Jedutun
  rationale: Der Personenname wird in üblicher deutscher Form wiedergegeben. Gemeint sein kann Jedutun selbst oder eine mit ihm verbundene musikalische Vorgabe.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: »Psalm« ist die etablierte und sachlich passende deutsche Bezeichnung für diese Liedgattung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die knappe Genitivverbindung entspricht einer natürlichen deutschen Psalmüberschrift, ohne im Haupttext ausdrücklich zwischen Urheberschaft, Widmung und Zugehörigkeit zu entscheiden.
theological_decisions:
- issue: Bedeutung von לְדָוִד in der Überschrift
  choice: Ein Psalm Davids
  alternative: Ein Psalm von David; ein Psalm für David
  rationale: Die hebräische Präposition לְ kann Urheberschaft, Widmung oder allgemein eine Zuordnung ausdrücken. Die Übersetzung bewahrt diese Offenheit und erläutert sie in der Fußnote, statt eine historische Aussage festzulegen.
translation_notes:
  register: Moderne, würdige Sprache für eine liturgische Überschrift. »Musikalischer Leiter« vermeidet das altertümliche »Chormeister« und ist weiter gefasst als »Chorleiter«. Die knappe Form wahrt den Charakter des hebräischen Psalmkopfs.
