base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: de
  text: Wer untadelig lebt[a], tut, was recht ist[b], und die Wahrheit in seinem Herzen spricht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Lauterkeit lebt“ beziehungsweise „integer lebt“. Das hebräische Wort bezeichnet Ganzheit und Integrität im Lebenswandel, nicht zwingend absolute Vollkommenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „Gerechtigkeit übt“ oder „Recht tut“. Das hebräische Substantiv kann Gerechtigkeit, Recht oder das Rechte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: lebt
  rationale: Das Partizip von הלך beschreibt hier bildhaft den Lebenswandel. Im modernen Deutschen gibt „lebt“ diesen idiomatischen Sinn natürlicher wieder als das wörtliche „geht“.
- source_word: תָּמִים
  choice: untadelig
  rationale: תמים bezeichnet hier Ganzheit und Integrität des Lebenswandels, nicht notwendigerweise absolute Sündlosigkeit. „Untadelig“ bewahrt die ethische Kraft und lässt sich natürlich mit „lebt“ verbinden.
- source_word: וּפֹעֵל
  choice: tut
  rationale: Das Partizip von פעל bezeichnet tätiges Tun oder Praktizieren. „Tut“ bildet mit dem folgenden Objekt eine natürliche deutsche Wendung und erhält den verbalen Parallelismus.
- source_word: צֶדֶק
  choice: was recht ist
  rationale: צדק kann Gerechtigkeit, Recht oder das Rechte bezeichnen. „Was recht ist“ gibt in diesem ethischen Zusammenhang das konkrete richtige Handeln in verständlichem modernem Deutsch wieder.
- source_word: וְדֹבֵר
  choice: spricht
  rationale: Das Partizip von דבר bedeutet hier schlicht „spricht“ und bewahrt den Parallelismus der drei Charakterisierungen.
- source_word: אֱמֶת
  choice: die Wahrheit
  rationale: אמת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen; zusammen mit „spricht“ steht wahrhaftige Rede im Vordergrund. „Die Wahrheit“ ist prägnant und geläufig.
- source_word: בִּלְבָבוֹ
  choice: in seinem Herzen
  rationale: Die Form bedeutet wörtlich „in seinem Herzen“. Die Wiedergabe bewahrt das Herz als Sitz des inneren Menschen und die mögliche Betonung innerer Wahrhaftigkeit.
theological_decisions:
- issue: Generisches maskulines Singular
  choice: Wer ... in seinem Herzen
  alternative: Wer ... im Herzen / Diejenigen, die ... in ihrem Herzen
  rationale: Die hebräischen Partizipien und das Suffix stehen im maskulinen Singular und dienen repräsentativ. „Wer“ ist im Deutschen natürlich und allgemein verständlich; „seinem Herzen“ bewahrt dabei den grammatischen Singular, ohne den Vers unnötig auf Männer zu beschränken.
- issue: Moralische Integrität gegenüber absoluter Vollkommenheit
  choice: untadelig
  alternative: vollkommen / integer
  rationale: Der Ausdruck beschreibt einen integren, ungeteilten Lebenswandel und behauptet nicht eindeutig absolute Sündlosigkeit. „Untadelig“ bewahrt diese ethische Spannung, während „vollkommen“ leicht überdeuten und „integer“ stilistisch nüchterner wirken würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Dreierstruktur wird durch drei koordinierte Verbalformulierungen bewahrt. Das idiomatische „lebt“ erschließt die Metapher des Lebenswandels; „in seinem Herzen“ bleibt bewusst nah an der hebräischen Innenperspektive.
