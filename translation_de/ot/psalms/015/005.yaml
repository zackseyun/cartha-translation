source:
  edition: WLC
  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: de
  text: Er leiht sein Geld nicht gegen Zinsen aus[a] und nimmt kein Bestechungsgeld gegen einen Unschuldigen an. Wer so handelt, wird niemals ins Wanken geraten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu Wucherzinsen«; das hebräische Wort נֶשֶׁךְ kann Zinsen bezeichnen, die für ein Darlehen verlangt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: sein Geld
  rationale: כֶּסֶף bezeichnet wörtlich Silber, im Zusammenhang mit Darlehen und Zinsen jedoch natürlich Geld.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: gegen Zinsen ausleihen
  rationale: נֶשֶׁךְ bezeichnet Zinsen auf ein Darlehen. Die moderne Formulierung gibt den breiten Sinn wieder, ohne ihn auf überhöhte oder rechtswidrige Zinsen einzuengen.
- source_word: שֹׁחַד
  choice: Bestechungsgeld
  rationale: Der Ausdruck bezeichnet eine Bestechungsgabe; Bestechungsgeld bewahrt den rechtlich-ethischen Nachdruck.
- source_word: עַל נָקִי
  choice: gegen einen Unschuldigen
  rationale: נָקִי bezeichnet einen von Schuld Freien; mit עַל ist gemeint, dass die Bestechung zum Nachteil eines Unschuldigen angenommen wird.
- source_word: עֹשֵׂה אֵלֶּה
  choice: Wer so handelt
  rationale: Das substantivierte Partizip kennzeichnet die Person durch die zuvor genannten Handlungen. Die deutsche Wendung ist knapp und natürlich.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: wird niemals ins Wanken geraten
  rationale: מוֹט im Nifal beschreibt Erschüttertwerden oder Wanken; zusammen mit der Verneinung und לְעוֹלָם drückt es dauerhafte Standfestigkeit aus.
theological_decisions:
- issue: Ethische Reichweite des Zinsverbots
  choice: נֶשֶׁךְ wird allgemein mit „Zinsen“ wiedergegeben.
  alternative: „Wucher“
  rationale: „Wucher“ bezeichnet im heutigen Deutsch meist nur überhöhte oder sittenwidrige Zinsen und würde den möglichen Umfang des hebräischen Begriffs unbegründet verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wirtschaftliche und gerichtliche Bildwelt bleibt erhalten; die Schlussaussage wird als Metapher dauerhafter Standfestigkeit formuliert.
