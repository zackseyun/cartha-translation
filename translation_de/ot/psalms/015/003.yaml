source:
  edition: WLC
  text: לֹֽא רָגַ֨ל עַל לְשֹׁנ֗/וֹ לֹא עָשָׂ֣ה לְ/רֵעֵ֣/הוּ רָעָ֑ה וְ֝/חֶרְפָּ֗ה לֹא נָשָׂ֥א עַל קְרֹֽב/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: de
  text: Er verleumdet nicht mit seiner Zunge[a], tut seinem Nächsten nichts Böses[b] und erhebt keine Schmähung gegen einen ihm Nahestehenden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zieht nicht als Verleumder umher und redet nicht über andere«.'
    reason: lexical_alternative
  - marker: b
    text: »Nächster« kann hier auch »Freund« oder »Gefährte« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »gegen seinen Nahen«; gemeint sein kann ein Verwandter, ein enger Vertrauter oder jemand aus seinem unmittelbaren Umfeld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל
  choice: verleumdet
  rationale: Das Verb bezeichnet in der Verbindung mit »Zunge« das schädigende Reden über andere, möglicherweise auch das Umhertragen von Gerüchten. »Verleumdet« gibt die ethische Stoßrichtung knapp und in heutigem Deutsch wieder.
- source_word: עַל לְשֹׁנוֹ
  choice: mit seiner Zunge
  rationale: Die instrumentale Wiedergabe ist im Deutschen verständlich und bewahrt zugleich das konkrete Bild des hebräischen Ausdrucks.
- source_word: עָשָׂה ... רָעָה
  choice: tut ... nichts Böses
  rationale: Diese Formulierung erhält die breite moralische Bedeutung von רָעָה und verengt sie nicht auf körperlichen oder materiellen Schaden.
- source_word: לְרֵעֵהוּ
  choice: seinem Nächsten
  rationale: רֵעַ kann einen Freund, Gefährten oder Mitmenschen aus dem näheren sozialen Umfeld bezeichnen. »Nächster« wahrt diese Bedeutungsbreite und passt zum ethischen Zusammenhang.
- source_word: חֶרְפָּה
  choice: Schmähung
  rationale: Das Wort bezeichnet eine entehrende Äußerung beziehungsweise die dadurch bewirkte Schande. »Schmähung« passt zum Kontext schädigender Rede und bewahrt den sozialen Ehraspekt.
- source_word: נָשָׂא ... עַל
  choice: trägt ... gegen ... vor
  rationale: Die Formulierung hält das Bild des Tragens beziehungsweise Erhebens fest und bezeichnet zugleich verständlich das Äußern oder Weitertragen einer Schmähung gegen jemanden.
- source_word: קְרֹבוֹ
  choice: einen ihm Nahestehenden
  rationale: Das substantivierte Wort bezeichnet einen Menschen, der ihm nahe ist, möglicherweise einen Verwandten, engen Vertrauten oder räumlich beziehungsweise sozial Nahen. Die Übersetzung lässt diese Beziehung bewusst offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildsprache. Die drei parallelen Verneinungen bleiben erhalten. »Nahestehender« vermeidet eine unbegründete Festlegung von קְרֹבוֹ auf Verwandtschaft.
