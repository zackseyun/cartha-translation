source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: de
  text: 'Ein Psalm Davids.[a]


    Jahwe, wer darf in deinem Zelt[b] zu Gast sein?

    Wer darf auf deinem heiligen Berg wohnen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Präposition kann „von David“, „für David“ oder eine allgemeinere Zuordnung zu David bedeuten.
    reason: alternative_reading
  - marker: b
    text: Oder „Heiligtumszelt“; wörtlich steht hier „Zelt“, wahrscheinlich mit Bezug auf das Heiligtum als Gottes Wohnstätte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Die etablierte und sachlich passende deutsche Bezeichnung für diese Art von Lied und für die Überschrift.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv gibt die knappe Zuordnung der hebräischen Überschrift natürlich wieder, ohne im Haupttext ausdrücklich zwischen Urheberschaft, Zugehörigkeit und Widmung zu entscheiden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: יָגוּר
  choice: zu Gast sein
  rationale: Das Verb bezeichnet den Aufenthalt eines Fremden oder Gastes. Diese natürliche deutsche Wendung bewahrt den Unterschied zum folgenden שׁכן („wohnen“).
- source_word: בְּאָהֳלֶךָ
  choice: in deinem Zelt
  rationale: „Zelt“ gibt die konkrete Grundbedeutung von אֹהֶל wieder und lässt zugleich den Bezug auf Gottes Heiligtum erkennen, ohne ihn erklärend in den Haupttext einzutragen.
- source_word: יִשְׁכֹּן
  choice: wohnen
  rationale: Das Verb bezeichnet ein Bleiben oder Wohnen und bildet hier die parallele, etwas beständigere Entsprechung zum Gastaufenthalt in der ersten Frage.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: auf deinem heiligen Berg
  rationale: Die Formulierung gibt die hebräische Wendung natürlich wieder und bewahrt das Bild des heiligen Berges, das auf Zion verweist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang der Psalmüberschrift לְדָוִד
  choice: Davids, mit erklärender Fußnote
  alternative: von David; für David
  rationale: Die hebräische Präposition kann Urheberschaft, Zuordnung oder Widmung anzeigen. Der Haupttext bleibt knapp, während die Fußnote die echte Mehrdeutigkeit offenlegt.
- issue: Heiligtumsbezug des Wortes אֹהֶל
  choice: Zelt, mit lexikalischer Fußnote
  alternative: Heiligtumszelt; Stiftshütte
  rationale: Der konkrete Ausdruck „Zelt“ wahrt das Bild des Ausgangstextes. Der Zusammenhang kann auf das Heiligtum weisen, doch sollte diese Deutung nicht als einzige Bedeutung in den Haupttext aufgenommen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Fragen bleiben knapp und poetisch. „Zu Gast sein“ gibt die Nuance eines nicht dauerhaften Aufenthalts idiomatisch wieder und steht bewusst neben dem beständigeren „wohnen“.
