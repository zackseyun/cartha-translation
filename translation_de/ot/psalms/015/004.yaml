source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: de
  text: In seinen Augen ist ein Verachteter verworfen[a]; doch diejenigen, die Jahwe fürchten, ehrt er. Er schwört zu seinem eigenen Schaden und ändert es nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wer verächtlich ist, den verachtet er.“ Die hebräische Klausel ist knapp formuliert und lässt mehrere eng verwandte Wiedergaben zu.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Er schwört zum Schaden und ändert nicht.“ Gemeint ist wahrscheinlich, dass er sein Wort auch dann nicht ändert, wenn es ihm selbst schadet; das Hebräische nennt den Betroffenen jedoch nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: In seinen Augen ist ein Verachteter verworfen
  rationale: Die kompakte hebräische Klausel enthält zwei passive beziehungsweise adjektivische Formen. Die Übersetzung bewahrt diese Form und die wertende Wendung „in seinen Augen“, ohne נִבְזֶה vorschnell als eindeutiges moralisches Urteil wiederzugeben.
- source_word: יִרְאֵי יְהוָה
  choice: die, die Jahwe fürchten
  rationale: „Fürchten“ erhält den biblischen Ausdruck ehrfürchtiger Gottesfurcht, statt ihn auf bloße Verehrung abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְכַבֵּד
  choice: ehrt er
  rationale: Das Piel von כבד bezeichnet hier, jemandem Ehre und Gewicht beizumessen; „ehren“ ist im Deutschen knapp und idiomatisch.
- source_word: נִשְׁבַּע לְהָרַע
  choice: Er schwört zu seinem eigenen Schaden
  rationale: 'Die elliptische Wendung wird entsprechend dem verbreiteten kontextuellen Verständnis wiedergegeben: Er hält an seinem Schwur fest, auch wenn dieser für ihn nachteilig ist. Die wörtlichere Offenheit wird in der Fußnote genannt.'
- source_word: וְלֹא יָמִר
  choice: und ändert es nicht
  rationale: Das Hifil von מור bedeutet „ändern“ oder „austauschen“. Das sächliche Pronomen nimmt sinngemäß das Geschworene auf, dessen Objekt im Hebräischen unausgesprochen bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext gebraucht das Tetragramm als persönlichen Gottesnamen. „Jahwe“ lässt diesen Namen sichtbar, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Deutung von נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: In seinen Augen ist ein Verachteter verworfen
  alternative: Wer verächtlich ist, den verachtet er
  rationale: Die hebräische Aussage ist syntaktisch gedrängt und lässt eng verwandte Deutungen zu. Der Haupttext bewahrt möglichst weitgehend ihre passiv-adjektivische Gestalt; die geläufige moralisch aktive Deutung wird als Alternative dokumentiert.
- issue: Bezug von לְהָרַע
  choice: zu seinem eigenen Schaden
  alternative: zum Schaden / um Böses zu tun
  rationale: Im Zusammenhang der beschriebenen Treue wird die Wendung meist auf einen Schwur bezogen, der dem Schwörenden selbst Nachteile bringt. Da das Hebräische das betroffene Objekt nicht ausdrücklich nennt, hält die Fußnote die wörtlichere Offenheit fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung erhält den poetischen Kontrast zwischen dem Verworfenen und denen, die Jahwe fürchten. Die ungewöhnliche Formulierung des ersten Halbverses bleibt bewusst etwas markiert, damit die Mehrdeutigkeit des Hebräischen nicht eingeebnet wird.
