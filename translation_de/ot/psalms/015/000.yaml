  source_fidelity: Die Übersetzung gibt die Überschrift מִזְמוֹר לְדָוִד angemessen wieder und bewahrt deren Mehrdeutigkeit durch die Fußnote. Die Anrede Jahwes sowie beide שאלות sind vollständig vorhanden. „sich … aufhalten“ für יָגוּר und „wohnen“ für יִשְׁכֹּן bilden den hebräischen Parallelismus ab, ohne einen unhaltbar scharfen lexikalischen Gegensatz zu behaupten. „Zelt“ und „heiliger Berg“ entsprechen dem Wortlaut.
