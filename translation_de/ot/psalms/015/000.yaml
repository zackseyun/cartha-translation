  terminology: „Jahwe“ gibt den Gottesnamen als Eigenname wieder. Die Bezeichnung „Zelt“ bleibt konkret; die Fußnote erläutert den wahrscheinlichen Heiligtumsbezug und bietet mit „Stiftszelt“ eine vertretbare traditionelle Alternative. Die Fußnotenmarker sind korrekt an „Davids“ und „Zelt“ verankert.
