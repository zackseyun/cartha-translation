id: PSA.15.0
reference: Psalms 15:0
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: de
  text: 'Ein Psalm Davids[a].


    Jahwe, wer darf sich in deinem Zelt[b] aufhalten?

    Wer darf auf deinem heiligen Berg wohnen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »von David« beziehungsweise »für David«; die hebräische Überschrift kann Urheberschaft, Zuordnung oder Widmung ausdrücken.
    reason: alternative_reading
  - marker: b
    text: Oder »Stiftszelt«; wörtlich steht im Hebräischen »Zelt«, wahrscheinlich mit Bezug auf das Heiligtum als Gottes Wohnstätte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, entsprechend der hebräischen Vorlage und ohne ihn durch einen Titel zu ersetzen.
- source_word: יָגוּר
  choice: darf sich … aufhalten
  rationale: Das Verb bezeichnet den zeitweiligen Aufenthalt bzw. das Wohnen als Gast oder Fremder; die Formulierung wahrt den Unterschied zum parallelen יִשְׁכֹּן.
- source_word: יִשְׁכֹּן
  choice: darf … wohnen
  rationale: Das Verb bezeichnet ein Bleiben oder Wohnen und bildet die zweite, stärker auf Dauer angelegte Hälfte des Parallelismus.
- source_word: אֹהֶל
  choice: Zelt
  rationale: Die konkrete Grundbedeutung wird beibehalten; im Zusammenhang verweist das Wort wahrscheinlich auf das Heiligtum als Wohnstätte Gottes.
- source_word: הַר קָדְשֶׁךָ
  choice: deinem heiligen Berg
  rationale: Die hebräische Formulierung wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutung der Überschrift לְדָוִד
  choice: Davids
  alternative: von David / für David / David zugeordnet
  rationale: Der traditionelle deutsche Genitiv bewahrt die knappe Mehrdeutigkeit der hebräischen Zuordnungsformel; eine Fußnote nennt die wesentlichen Möglichkeiten.
- issue: Zugang zur Gegenwart Gottes
  choice: Die beiden Fragen bleiben offen formuliert
  alternative: als ausdrückliche Frage nach Zulassung zum Gottesdienst deuten
  rationale: Der Text fragt, wer sich bei Gott aufhalten und wohnen darf, legt in dieser Zeile aber noch nicht fest, ob dies ausschließlich kultisch, ethisch oder umfassender zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Zweizeiligkeit und der Parallelismus der beiden Fragen bleiben sichtbar. »Sich aufhalten« und »wohnen« unterscheiden die beiden hebräischen Verben, ohne den Gegensatz zu überzeichnen.
