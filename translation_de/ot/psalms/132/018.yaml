  yaml_path: translation/ot/psalms/132/018.yaml
  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: de
  text: Seine Feinde werde ich mit Schande bekleiden, doch auf ihm wird seine Krone erblühen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf ihm wird sein Diadem erblühen.“ Das hebräische Verb bezeichnet ein Sprießen oder Blühen; das Substantiv kann eine Krone beziehungsweise ein Diadem, aber auch Weihe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  choice: seine Feinde
  rationale: Das Substantiv im Plural mit Suffix der 3. Person Singular wird direkt und natürlich wiedergegeben.
- source_word: אַלְבִּישׁ
  choice: werde ich bekleiden
  rationale: Der Hifil von לבשׁ bezeichnet das Bekleiden; die ausdrückliche erste Person Singular und das Bild des hebräischen Textes bleiben erhalten.
- source_word: בֹּשֶׁת
  choice: mit Schande
  rationale: Das Wort bezeichnet Schande oder Beschämung. „Mit Schande bekleiden“ bewahrt die prägnante Metapher und klingt würdevoll.
- source_word: וְעָלָיו
  choice: doch auf ihm
  rationale: Das וְ wird wegen des deutlichen Gegensatzes zwischen den Feinden und dem König adversativ als „doch“ wiedergegeben; „auf ihm“ erhält das räumliche Bild.
- source_word: יָצִיץ
  choice: wird … erblühen
  rationale: Das Verb bezeichnet ein Sprießen oder Blühen. „Erblühen“ erhält dieses lebendige Pflanzenbild auch in Verbindung mit der Krone.
- source_word: נִזְרוֹ
  choice: seine Krone
  rationale: נֵזֶר kann Krone, Diadem oder Zeichen der Weihe bezeichnen. Im königlichen Zusammenhang des Psalms ist „Krone“ die natürliche Wiedergabe, ohne eine weitergehende Deutung festzuschreiben.
theological_decisions:
- issue: Königliche Bedeutung von נִזְרוֹ in einem davidisch geprägten Zionpsalm
  choice: seine Krone
  alternative: seine Weihe / sein Diadem
  rationale: Der unmittelbare Zusammenhang stützt die königliche Bildsprache. Die Übersetzung macht weder eine ausdrücklich messianische Deutung noch die abstraktere Bedeutung „Weihe“ zum Textbestandteil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Doppelmetapher von Bekleidung und erblühender Krone wird bewusst bewahrt.
