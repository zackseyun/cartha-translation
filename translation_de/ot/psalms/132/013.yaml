source:
  edition: WLC
  text: כִּֽי בָחַ֣ר יְהוָ֣ה בְּ/צִיּ֑וֹן אִ֝וָּ֗/הּ לְ/מוֹשָׁ֥ב לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/013.yaml
  text: For Yahweh has chosen Zion[a]; he has desired it for his dwelling place.
translation:
  language: de
  text: Denn Jahwe hat Zion erwählt; er hat sie zu seiner Wohnstätte begehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den Zusammenhang natürlich.
- source_word: בָחַר
  choice: hat erwählt
  rationale: Gibt das bewusste Auswählen wieder; das Perfekt bezeichnet die vollzogene Wahl mit fortdauernder Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּצִיּוֹן
  choice: Zion
  rationale: Die Präposition kennzeichnet bei בחר den Gegenstand der Wahl; idiomatisches Deutsch verlangt hier kein „in“.
- source_word: אִוָּהּ
  choice: hat sie … begehrt
  rationale: Das Verb drückt Begehren beziehungsweise sehnliches Verlangen aus. Das feminine Suffix bezieht sich auf Zion und kann im Deutschen mit „sie“ wiedergegeben werden.
- source_word: לְמוֹשָׁב לוֹ
  choice: zu seiner Wohnstätte
  rationale: Gibt sowohl den Zweck („zur Wohnstätte“) als auch den persönlichen Bezug („seiner“) knapp und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Text nennt den Gottesnamen unmittelbar; „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Wiedergabe.
- issue: Pronominaler Bezug auf Zion
  choice: sie
  alternative: es
  rationale: Das hebräische feminine Suffix wird bewahrt. Auch im Deutschen ist „Zion“ als Ortsname gewöhnlich feminin, sodass „sie“ natürlich klingt und eine mögliche Personifizierung offenhält.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Knappheit. „Wohnstätte“ wahrt den Psalmton, ohne altertümlich oder konfessionell geprägt zu wirken.
