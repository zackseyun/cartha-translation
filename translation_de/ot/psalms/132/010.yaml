id: PSA.132.10
reference: Psalms 132:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ֭/עֲבוּר דָּוִ֣ד עַבְדֶּ֑/ךָ אַל תָּ֝שֵׁ֗ב פְּנֵ֣י מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/010.yaml
  text: For the sake of David your servant[b][a], do not turn away the face of your anointed one.
translation:
  language: de
  text: Um Davids willen, deines Dieners, weise deinen Gesalbten nicht ab.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wende das Angesicht deines Gesalbten nicht ab.“ Gemeint sein kann: „Weise deinen Gesalbten nicht zurück.“'
    reason: lexical_alternative
  - marker: b
    text: „Deinen Gesalbten“ kann besonders im davidischen und gesamtbiblischen messianischen Zusammenhang auch mit „deinen Messias“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Um … willen
  rationale: Die Präposition bezeichnet hier den Grund der Bitte beziehungsweise die Berufung auf David; „um Davids willen“ ist im Deutschen natürlich und würdevoll.
- source_word: דָּוִד
  choice: David
  rationale: Der Eigenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: עַבְדֶּךָ
  choice: deines Dieners
  rationale: Im königlichen und bundestheologischen Zusammenhang gibt „Diener“ die Unterordnung angemessen wieder, ohne unnötig die Bedeutung „Sklave“ in den Vordergrund zu stellen.
- source_word: אַל
  choice: nicht
  rationale: Die Negation formuliert zusammen mit dem Verb eine flehentliche Aufforderung.
- source_word: תָּשֵׁב פְּנֵי
  choice: weise … nicht ab
  rationale: Die hebräische Wendung lautet wörtlich „wende das Angesicht … nicht ab“, bedeutet im Zusammenhang jedoch idiomatisch, jemanden nicht zurückzuweisen. Die Bildsprache bleibt in einer Fußnote erhalten.
- source_word: מְשִׁיחֶךָ
  choice: deinen Gesalbten
  rationale: „Gesalbter“ bewahrt die unmittelbare königliche Bedeutung und zugleich die mögliche messianische Tragweite, ohne diese im Haupttext festzulegen.
theological_decisions:
- issue: Ob מְשִׁיחֶךָ als ausgeprägter messianischer Titel wiederzugeben ist
  choice: deinen Gesalbten
  alternative: deinen Messias
  rationale: Im unmittelbaren Zusammenhang ist der davidische König gemeint. „Gesalbter“ erhält sowohl diesen historischen Bezug als auch den weiterführenden messianischen Resonanzraum; „Messias“ wird als mögliche Lesart in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung gibt die hebräische Wendung idiomatisch wieder; die wörtliche Bildsprache und die messianische Alternative werden in Fußnoten bewahrt.
