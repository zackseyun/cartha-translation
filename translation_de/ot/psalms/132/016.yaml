id: PSA.132.16
reference: Psalms 132:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ֭/כֹהֲנֶי/הָ אַלְבִּ֣ישׁ יֶ֑שַׁע וַ֝/חֲסִידֶ֗י/הָ רַנֵּ֥ן יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/016.yaml
  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
translation:
  language: de
  text: Und ihre Priester werde ich mit Rettung bekleiden, und ihre Getreuen werden laut jubeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verstärkt das Verb durch Wiederholung: „Sie werden jubeln, ja jubeln.“ Gemeint ist lauter, nachdrücklicher Jubel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: ihre Priester
  rationale: Das Suffix der 3. Person feminin Singular bezieht sich im Kontext auf das personifizierte Zion; im Deutschen ist daher „ihre Priester“ natürlich und präzise.
- source_word: אַלְבִּישׁ
  choice: werde ich bekleiden
  rationale: Der Hifil von לבשׁ bedeutet „bekleiden“; die Metapher und die erste Person des göttlichen Sprechers bleiben erhalten.
- source_word: יֶשַׁע
  choice: mit Rettung
  rationale: יֶשַׁע umfasst Rettung, Befreiung und siegreiche Hilfe. „Rettung“ ist im modernen Deutsch verständlich und lässt die konkrete wie auch theologische Bedeutungsweite offen.
- source_word: חֲסִידֶיהָ
  choice: ihre Getreuen
  rationale: חָסִיד bezeichnet Menschen, die durch Treue, Hingabe und Loyalität im Bund geprägt sind. „Getreue“ bewahrt diesen Sinn, ohne spätere kirchliche Nebenbedeutungen von „Heilige“ zwingend einzutragen.
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: werden laut jubeln
  rationale: Die Verbindung aus absolutem Infinitiv und finitem Verb verstärkt den Ausdruck. „Laut jubeln“ gibt sowohl die hörbare Freude als auch die Intensivierung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von חֲסִידֶיהָ im Kontext des Bundes und der Anbetung
  choice: ihre Getreuen
  alternative: ihre Heiligen / ihre Frommen
  rationale: „Getreue“ bringt die in חָסִיד enthaltene Bundestreue und Hingabe zum Ausdruck, ohne den Begriff auf einen späteren konfessionellen Heiligenbegriff festzulegen. „Fromme“ wäre ebenfalls möglich, betont jedoch eher Frömmigkeit als Loyalität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung hält den Parallelismus der beiden Vershälften sichtbar; „bekleiden“ bewahrt das poetische Bild, „laut jubeln“ gibt die hebräische Verstärkung natürlich wieder.
