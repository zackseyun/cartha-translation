  text: I will not give sleep to my eyes[a], nor slumber to my eyelids—
translation:
  language: de
  text: ich gönne meinen Augen keinen Schlaf[a] und meinen Lidern keinen Schlummer –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wenn ich meinen Augen Schlaf gebe, meinen Lidern Schlummer“ – eine Schwurformel im Sinn von: „Ich werde ihnen keinen Schlaf gönnen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: keinen … und keinen
  rationale: אִם leitet hier eine verkürzte Schwurformel ein, nicht eine gewöhnliche Bedingung. Die deutsche Verneinung gibt die Kraft des Gelübdes natürlich wieder; die wörtliche Form wird in der Fußnote bewahrt.
- source_word: אֶתֵּן
  choice: ich gönne
  rationale: נתן bedeutet grundsätzlich „geben“. In Verbindung mit Schlaf und einem Körperteil ist „gönnen“ im Deutschen idiomatisch und bewahrt den Gedanken, den Augen Schlaf zu gewähren.
- source_word: שְׁנַת
  choice: Schlaf
  rationale: Das Substantiv bezeichnet Schlaf; „Schlaf“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: לְעֵינָי
  choice: meinen Augen
  rationale: ל kennzeichnet hier das indirekte Objekt zu נתן. Im Deutschen verlangt „gönnen“ den Dativ, sodass die Bildsprache der Augen erhalten bleibt.
- source_word: לְעַפְעַפַּי
  choice: meinen Lidern
  rationale: עפעף bezeichnet das Augenlid. „Lidern“ bewahrt den körperbezogenen Parallelismus mit „Augen“.
- source_word: תְּנוּמָה
  choice: Schlummer
  rationale: „Schlummer“ unterscheidet diesen Ausdruck von שְׁנַת „Schlaf“ und erhält die poetische Variation des Parallelismus.
