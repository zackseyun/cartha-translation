source:
  edition: WLC
  text: נָב֥וֹאָה לְ/מִשְׁכְּנוֹתָ֑י/ו נִ֝שְׁתַּחֲוֶ֗ה לַ/הֲדֹ֥ם רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/007.yaml
  text: Let us go into his dwelling place[b][a]; let us bow down at his footstool.
translation:
  language: de
  text: Wir wollen zu seinen Wohnstätten gehen[a]; vor dem Schemel seiner Füße wollen wir uns niederwerfen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir wollen in seine Wohnstätten eintreten.« Im Zusammenhang kann der Plural auch zusammenfassend als »seine Wohnstätte« verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »… wollen wir anbeten.« Das Hebräische bezeichnet genauer das ehrfürchtige Sich-Niederwerfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹאָה
  choice: wir wollen gehen
  rationale: Der Qal-Kohortativ der 1. Person Plural drückt eine gemeinsame Aufforderung aus. »Wir wollen gehen« gibt diese volitive Nuance in natürlichem Deutsch wieder; »eintreten« bleibt kontextuell möglich.
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: zu seinen Wohnstätten
  rationale: Die hebräische Form steht im Plural und trägt ein Suffix der 3. Person Singular. »Wohnstätten« bewahrt den Plural und klingt würdevoller und natürlicher als »Wohnungen«; die Präposition ל wird hier als Zielangabe wiedergegeben.
- source_word: נִשְׁתַּחֲוֶה
  choice: wir wollen uns niederwerfen
  rationale: Das Verb bezeichnet das ehrfürchtige Sich-Niederwerfen. Die Übersetzung bewahrt die im Hebräischen ausgedrückte Körperhaltung, statt sie lediglich mit dem weiter gefassten »anbeten« wiederzugeben.
- source_word: לַהֲדֹם
  choice: vor dem Schemel
  rationale: הֲדֹם bedeutet »Schemel« beziehungsweise »Fußschemel«. Die Präposition ל kann in diesem Anbetungskontext räumlich oder gerichtet verstanden werden; »vor« ist im Deutschen bei »sich niederwerfen« idiomatisch.
- source_word: רַגְלָיו
  choice: seiner Füße
  rationale: Die Constructusverbindung lautet wörtlich »Schemel seiner Füße«. Anders als die mögliche Zusammenziehung zu »sein Fußschemel« bewahrt diese Form die hebräische Bildsprache.
theological_decisions:
- issue: Bezug der männlichen Possessivsuffixe
  choice: Die Pronomen werden ohne ausdrückliche Bestimmung ihres Bezugs als »seinen/seiner« wiedergegeben.
  alternative: Den Bezug ausdrücklich auf den HERRN, die Lade oder den erwählten Ruheort Davids festlegen.
  rationale: Der unmittelbare Zusammenhang verbindet die Wohnung des HERRN mit der Lade- und Zionstradition. Da der hebräische Vers den Bezug nicht eigens klärt, wahrt die Übersetzung diese literarische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Stellung von »wir wollen« bildet die beiden hebräischen Kohortative ab. Der im Hebräischen vorhandene Plural »Wohnstätten« und die konkrete Gebärde des Niederwerfens bleiben erhalten.
