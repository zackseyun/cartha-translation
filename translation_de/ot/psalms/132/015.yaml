  text: צֵ֭ידָ/הּ בָּרֵ֣ךְ אֲבָרֵ֑ךְ אֶ֝בְיוֹנֶ֗י/הָ אַשְׂבִּ֥יעַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/015.yaml
  text: I will surely bless her provisions[a]; I will satisfy her poor with bread.
translation:
  language: de
  text: Ihre Vorräte werde ich reichlich segnen; ihre Armen werde ich mit Brot sättigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵידָהּ
  choice: ihre Vorräte
  rationale: צֵיד kann Nahrung oder Versorgungsvorrat bezeichnen. Im Zusammenhang mit Zion gibt „ihre Vorräte“ den Lebensmittelvorrat der Stadt wieder, ohne den hier irreführenden Beiklang von Jagdbeute.
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: werde ich reichlich segnen
  rationale: Der absolute Infinitiv zusammen mit dem finiten Verb verstärkt die Aussage. „Reichlich segnen“ gibt die Emphase natürlich wieder und passt zugleich zur zugesagten Fülle der Versorgung.
- source_word: אֶבְיוֹנֶיהָ
  choice: ihre Armen
  rationale: אֶבְיוֹן bezeichnet Arme oder Bedürftige. „Ihre Armen“ ist knapp und bewahrt den sozialen Sinn sowie den Rückbezug auf Zion.
- source_word: אַשְׂבִּיעַ
  choice: werde ich sättigen
  rationale: Der Hifil von שׂבע bedeutet, jemanden satt beziehungsweise zufrieden zu machen. „Sättigen“ verbindet sich im Deutschen treffend mit dem ausdrücklich genannten Brot.
- source_word: לָחֶם
  choice: mit Brot
  rationale: Das konkrete Bild des hebräischen לָחֶם wird bewahrt und nicht unnötig zu „Nahrung“ verallgemeinert.
theological_decisions:
- issue: Bezug der femininen Suffixe
  choice: Die Suffixe in „ihre Vorräte“ und „ihre Armen“ beziehen sich auf Zion/Jerusalem.
  alternative: Ein allgemeinerer Bezug auf die Wohnstätte des HERRN.
  rationale: Die femininen Singularsuffixe weisen im unmittelbaren Zusammenhang von Psalm 132,13–14 am natürlichsten auf Zion zurück. Die deutsche Wiedergabe bewahrt diese poetische Personifikation, ohne weitere theologische Festlegungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die konkrete Bildsprache des Hebräischen bleiben erhalten; die emphatische Verbkonstruktion wird idiomatisch durch „reichlich“ ausgedrückt.
