  source_fidelity: 'Die Übersetzung gibt alle Elemente des Hebräischen präzise wieder: צֵידָהּ als „ihre Vorräte“, die emphatische Infinitivkonstruktion בָּרֵךְ אֲבָרֵךְ idiomatisch als „werde ich reichlich segnen“, אֶבְיוֹנֶיהָ als „ihre Armen“ und אַשְׂבִּיעַ לָחֶם als „werde ich mit Brot sättigen“. Die femininen Possessivbezüge bleiben zu Recht personifizierend und im Text nicht unnötig expliziert.'
