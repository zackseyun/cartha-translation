  text: אִם אָ֭בֹא בְּ/אֹ֣הֶל בֵּיתִ֑/י אִם אֶ֝עֱלֶ֗ה עַל עֶ֥רֶשׂ יְצוּעָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
translation:
  language: de
  text: 'Ich werde gewiss nicht das Zelt meines Hauses betreten[a],

    ich werde gewiss nicht auf das Bett meines Lagers steigen[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch verwendet hier eine Schwurformel mit wiederholtem »wenn«; wörtlich: »Wenn ich hineingehe … wenn ich hinaufsteige …«. Im Zusammenhang bedeutet dies: »Ich werde gewiss nicht …«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »auf das Bett meines Lagers«. Das Hebräische verbindet zwei eng verwandte Wörter für eine Schlaf- oder Ruhestätte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ich werde gewiss nicht
  rationale: 'Im Zusammenhang des Gelübdes leitet אִם eine verkürzte Selbstverfluchungsformel ein: Wörtlich steht »wenn ich …«, gemeint ist jedoch die feierliche Verneinung »ich werde gewiss nicht …«. Die Wiederholung wird in beiden Verszeilen bewahrt.'
- source_word: אָבֹא
  choice: ich werde … gehen
  rationale: Das Qal-Imperfekt 1. Person Singular bezeichnet hier die im Gelübde ausgeschlossene zukünftige Handlung. Mit »in« gibt »gehen« das Eintreten natürlich wieder.
- source_word: בְּאֹהֶל בֵּיתִי
  choice: in das Zelt meines Hauses
  rationale: Die konkrete und auffällige hebräische Verbindung von אֹהֶל (Zelt) und בַּיִת (Haus) bleibt erhalten, statt zu »mein Zuhause« geglättet zu werden.
- source_word: אֶעֱלֶה
  choice: ich werde … besteigen
  rationale: עלה bedeutet wörtlich »hinaufgehen«. Im Deutschen gibt »ein Lager besteigen« die gerichtete Bewegung idiomatisch und in gehoben-poetischem Register wieder.
- source_word: עֶרֶשׂ יְצוּעָי
  choice: mein Ruhelager
  rationale: Beide eng verwandten Ausdrücke bezeichnen Bett, Lager oder Liegestatt. Die kompakte deutsche Wiedergabe ist natürlich; die innere Doppelung des Hebräischen wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutung der wiederholten Bedingungspartikel אִם in der Schwurformel
  choice: 'Als feierliche Verneinung: »ich werde gewiss nicht«'
  alternative: 'Wörtlich: »Wenn ich … wenn ich …«'
  rationale: Der vorhergehende Schwurkontext liefert die ausgelassene Selbstverwünschung. Eine rein formale Wiedergabe mit »wenn« wäre im Deutschen ohne Ergänzung missverständlich; die Fußnote bewahrt die hebräische Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilenführung. Die ungewöhnliche Wendung »Zelt meines Hauses« bewahrt bewusst das hebräische Bild. »Ruhelager besteigen« hält den Bewegungssinn von עלה fest, ohne im Deutschen schwer verständlich zu werden.
