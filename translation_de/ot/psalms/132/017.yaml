source:
  edition: WLC
  text: שָׁ֤ם אַצְמִ֣יחַ קֶ֣רֶן לְ/דָוִ֑ד עָרַ֥כְתִּי נֵ֝֗ר לִ/מְשִׁיחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: de
  text: Dort lasse ich für David ein Horn hervorsprossen[a]; ich habe meinem Gesalbten eine Leuchte bereitet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ein Horn ist im Hebräischen ein Bild für Stärke und königliche Macht. Auch möglich: „Dort lasse ich für David ein Horn wachsen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „meinem Messias“. Das Hebräische lautet „meinem Gesalbten“ und bezieht sich hier zunächst auf den davidischen König; eine weitergehende messianische Bedeutung ist möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb verweist im unmittelbaren Zusammenhang auf Zion; „dort“ bewahrt den räumlichen Nachdruck natürlich.
- source_word: אַצְמִיחַ
  choice: lasse ich … hervorsprossen
  rationale: Der Hifil von צמח ist kausativ. Die Wiedergabe erhält das pflanzliche Bild, ohne es deutend zu „aufrichten“ abzuschwächen.
- source_word: קֶרֶן
  choice: Horn
  rationale: Das konkrete hebräische Bild für Stärke und königliche Macht bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: לְדָוִד
  choice: für David
  rationale: Die Präposition ל bezeichnet hier Zuordnung beziehungsweise Begünstigung. „Für David“ ist genau und ergänzt nicht ausdrücklich „Davids Haus“ oder „Nachkommenschaft“.
- source_word: עָרַכְתִּי
  choice: ich habe … bereitet
  rationale: ערך bedeutet anordnen, zurechtmachen oder bereiten. „Bereitet“ ist in Verbindung mit einer Leuchte idiomatisch und würdevoll.
- source_word: נֵר
  choice: Leuchte
  rationale: נֵר bezeichnet eine Lampe beziehungsweise Leuchte. „Leuchte“ bewahrt das konkrete Bild und klingt im poetischen deutschen Kontext natürlich.
- source_word: לִמְשִׁיחִי
  choice: meinem Gesalbten
  rationale: Die Form bedeutet wörtlich „meinem Gesalbten“. Der unmittelbare Bezug auf den davidischen König bleibt erhalten, ohne eine weitergehende messianische Deutung auszuschließen.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחִי im davidisch-königlichen Zusammenhang
  choice: meinem Gesalbten
  alternative: meinem Messias
  rationale: Im unmittelbaren Kontext bezeichnet die Wendung zunächst den von Gott gesalbten davidischen König. „Meinem Gesalbten“ übersetzt den Ausdruck, statt ihn vorschnell als feststehenden Titel zu deuten; eine breitere messianische Resonanz bleibt offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. Die Satzstellung folgt natürlichem deutschem Rhythmus; „Horn“, „hervorsprossen“ und „Leuchte“ erhalten die poetischen Metaphern.
