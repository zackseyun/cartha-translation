  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: de
  text: Dies ist meine Ruhestätte für immer; hier will ich wohnen, denn nach ihr[a] habe ich verlangt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „danach habe ich verlangt“, wenn sich das feminine Suffix auf die Ruhestätte beziehungsweise den Ort und nicht auf das personifizierte Zion bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Dies
  rationale: Das feminine Demonstrativpronomen weist auf Zion beziehungsweise den zuvor genannten Ruheort. „Dies“ bewahrt die knappe, hinweisende Form.
- source_word: מְנוּחָתִי
  choice: mein Ruheort
  rationale: מְנוּחָה kann „Ruhe“ oder „Ruheort“ bedeuten. Der anschließende Ortsbezug „hier“ spricht für die konkrete Bedeutung „Ruheort“.
- source_word: עֲדֵי עַד
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist im heutigen Deutsch natürlich und prägnant.
- source_word: פֹּה
  choice: hier
  rationale: Die unmittelbare Ortsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: אֵשֵׁב
  choice: will ich wohnen
  rationale: ישׁב bedeutet grundlegend „sitzen“, kann in diesem Zusammenhang aber dauerhaftes Wohnen oder Thronen bezeichnen. „wohnen“ passt zum göttlichen Bleiben in Zion und zum parallelen „Ruheort“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Gottes Wohnen an diesem Ort ein.
- source_word: אִוִּתִיהָ
  choice: nach ihr habe ich verlangt
  rationale: Das Verb אוה bezeichnet Begehren oder Verlangen; das feminine Suffix der dritten Person Singular verweist am ehesten auf das personifizierte Zion. „nach ihr verlangt“ bewahrt sowohl die Verbbedeutung als auch den femininen Bezug.
theological_decisions:
- issue: Bezug und Geschlecht des femininen Suffixes in אִוִּתִיהָ
  choice: „nach ihr habe ich verlangt“, mit Bezug auf das personifizierte Zion
  alternative: „danach habe ich verlangt“, mit Bezug auf den Ruheort beziehungsweise diesen Ort
  rationale: Das feminine Suffix verweist im poetischen Zusammenhang am natürlichsten auf Zion, das im Hebräischen regelmäßig feminin personifiziert wird. Die Übersetzung wahrt diese Personifikation, während die Fußnote die sachbezogene Deutung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. „Ruheort“ stellt den räumlichen Sinn heraus; „wohnen“ gibt den kontextuellen Sinn von ישׁב wieder. Die feminine Personifikation Zions bleibt im Haupttext erhalten, die echte Bezugsambiguität wird in der Fußnote dokumentiert.
