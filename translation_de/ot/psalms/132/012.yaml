base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: de
  text: Wenn deine Söhne meinen Bund und meine Zeugnisse[a] halten, über die ich sie unterweisen werde, dann werden auch ihre Söhne für immer auf deinem Thron sitzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Satzungen“; das hebräische Wort kann göttliche, den Bund bezeugende Weisungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Bewahrt die echte Bedingung des hebräischen Satzes, ohne ihre Erfüllung vorauszusetzen.
- source_word: יִשְׁמְרוּ
  choice: halten
  rationale: Bei Bund und göttlichen Weisungen bezeichnet שׁמר treue Beachtung; „halten“ ist dafür im Deutschen natürlich und etabliert.
- source_word: בָנֶיךָ
  choice: deine Söhne
  rationale: Das Hebräische ist ausdrücklich maskulin und bezeichnet im dynastischen Zusammenhang die königlichen Söhne beziehungsweise Thronfolger.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die sachlich und sprachlich übliche Wiedergabe von בְּרִית.
- source_word: וְעֵדֹתַי
  choice: und meine Zeugnisse
  rationale: „Zeugnisse“ bewahrt die Eigenart dieses Gesetzesbegriffs und unterscheidet ihn von anderen Bezeichnungen wie Satzungen oder Geboten.
- source_word: זוֹ אֲלַמְּדֵם
  choice: die ich sie lehren werde
  rationale: Das Relativpronomen bezieht sich am natürlichsten auf die Zeugnisse; der Imperfekt wird im bedingten Zusammenhang als zukünftiges Handeln wiedergegeben.
- source_word: גַּם בְּנֵיהֶם
  choice: dann werden auch ihre Söhne
  rationale: „Auch“ bewahrt die additive Aussage; „Söhne“ entspricht dem dynastischen und grammatisch maskulinen Ausdruck.
- source_word: עֲדֵי עַד
  choice: für immer
  rationale: Gibt die hebräische Wendung für fortdauernde, unbegrenzte Dauer idiomatisch wieder.
- source_word: יֵשְׁבוּ לְכִסֵּא לָךְ
  choice: auf deinem Thron sitzen
  rationale: Die natürliche deutsche Thronformel bewahrt das Bild des Sitzens und macht den Bezug auf Davids Königsthron deutlich.
theological_decisions:
- issue: Bedingtheit der davidischen Verheißung in diesem Vers
  choice: Der Fortbestand der Söhne auf Davids Thron wird ausdrücklich an ihre Bundestreue gebunden.
  alternative: Die Verheißung als praktisch unbedingt zu formulieren und die Bedingung abzuschwächen.
  rationale: Der mit אִם eingeleitete hebräische Satz formuliert eine echte Bedingung. Die Übersetzung bewahrt diese theologische Spannung, ohne sie durch Aussagen aus anderen Texten aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „den Bund halten“ bleibt wegen ihrer Klarheit und Vertrautheit erhalten. „Zeugnisse“ ist bewusst lexikalisch markanter; die Fußnote nennt eine verständlichere Alternative.
