  text: אֲשֶׁ֣ר נִ֭שְׁבַּע לַ/יהוָ֑ה נָ֝דַ֗ר לַ/אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/002.yaml
  text: who swore to Yahweh and vowed to the Mighty One of Jacob:[a]
translation:
  language: de
  text: 'der Jahwe[a] einen Eid schwor und dem Mächtigen Jakobs ein Gelübde ablegte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), der Eigenname des Gottes Israels; traditionell auch mit „der HERR“ wiedergegeben.'
    reason: Der Gottesname kann als Eigenname transliteriert oder nach der traditionellen Ersatzlesung wiedergegeben werden.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezieht sich auf David in Vers 1 und führt den dort begonnenen Satz natürlich fort.
- source_word: נִשְׁבַּע
  choice: schwor
  rationale: Der Nifal von שׁבע bezeichnet das feierliche Schwören beziehungsweise Ablegen eines Eides; „schwor“ ist knapp und idiomatisch.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet denjenigen, dem der Eid gilt. Der Gottesname יְהוָה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: נָדַר
  choice: ein Gelübde ablegte
  rationale: נדר bedeutet, ein Gelübde zu tun. Diese Formulierung ist im modernen Deutsch natürlich und wahrt den feierlichen Parallelismus zu „schwor“.
- source_word: לַאֲבִיר יַעֲקֹב
  choice: dem Mächtigen Jakobs
  rationale: אֲבִיר ist hier ein erhabener Gottestitel („der Mächtige“ bzw. „der Starke“); der Genitiv „Jakobs“ gibt die feste hebräische Titelform prägnant wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle Ersatzlesung „der HERR“ wird nicht stillschweigend in den Haupttext gesetzt.
- issue: Wiedergabe des Gottestitels אֲבִיר יַעֲקֹב
  choice: der Mächtige Jakobs
  alternative: der Starke Jakobs
  rationale: „Der Mächtige“ erhält den titularen, erhabenen Charakter, ohne den Ausdruck konfessionell auszudeuten.
translation_notes:
  register: Moderner, würdevoller Standardstil. Der Vers bleibt als Relativsatzfragment offen und endet mit einem Doppelpunkt, da der Gedanke in den folgenden Versen weitergeführt wird.
