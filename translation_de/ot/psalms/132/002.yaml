  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe von יהוה. „der Mächtige Jakobs“ ist als nominalisierter Titel grammatisch und stilistisch passend. Die Fußnote erklärt den Namen sachlich, ohne eine alternative Lesung als Teil des Textes auszugeben.
