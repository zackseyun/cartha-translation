  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: de
  text: Sieh, wir hörten von ihr in Efrata; wir fanden sie in den Feldern des Waldes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „in den Feldern des Waldes“. Die Formulierung kann auf Kirjat-Jearim („Stadt der Wälder“) anspielen.
    reason: Bewahrt den Grundsinn von יַעַר („Wald“) im Haupttext und vermerkt die mögliche Ortsanspielung, ohne sie als eindeutige Lesart festzulegen.
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und würdig wieder.
- source_word: שְׁמַעֲנוּהָ / מְצָאנוּהָ
  choice: wir hörten von ihr / wir fanden sie
  rationale: Die femininen Suffixe werden bewusst beibehalten. Der Bezug bleibt wie im Hebräischen unausgesprochen; im Kontext kann die Lade gemeint sein.
- source_word: בְאֶפְרָתָה
  choice: in Efrata
  rationale: Transkribiert den Ortsnamen in seiner geläufigen deutschen Form, ohne ihn vorschnell mit Betlehem gleichzusetzen.
- source_word: בִּשְׂדֵי־יָעַר
  choice: in den Feldern von Jaar
  rationale: Bewahrt die Ortsbezeichnung und die konstruktive Wendung des Hebräischen; eine Deutung als Kirjat-Jearim wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Bezug der femininen Suffixe
  choice: Das Pronomen „sie/ihr“ bleibt ohne ausdrückliches Bezugswort stehen.
  alternative: „die Lade“ ausdrücklich einsetzen
  rationale: Der unmittelbare hebräische Vers nennt das Bezugswort nicht. Die wahrscheinlich kontextuelle Identifikation mit der Bundeslade soll nicht stillschweigend zum Wortlaut gemacht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe poetische Parallelismus und die genuine Unbestimmtheit des hebräischen Pronominalbezugs bleiben erhalten.
