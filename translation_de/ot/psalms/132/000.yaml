review_pass:
  verdict: revise
  source_fidelity: Die Überschrift שִׁיר הַמַּעֲלוֹת kann idiomatisch als „Ein Wallfahrtslied“ wiedergegeben werden; die wörtliche und traditionelle Alternative ist sinnvoll erläutert. In V. 1 ist לְדָוִד syntaktisch und semantisch nicht völlig eindeutig. „um Davids willen“ legt jedoch stärker als nötig eine Fürbitte bzw. ein Handeln zu Davids Gunsten fest. Die im Deutschen naheliegende Fassung „denk an David, an all seine Bedrängnis“ bildet die Bitte und ihren Bezug auf David zuverlässig ab, ohne diese engere Nuance zu erzwingen. עֻנּוֹתוֹ bezeichnet hier Davids Bedrängnis bzw. sein Ergehen in Leiden und Erniedrigung; „Bedrängnis“ trifft dies präziser als „Mühsal“, das auch bloße Anstrengung oder Arbeit nahelegen kann.
  naturalness: „Ein Wallfahrtslied“ und „Jahwe, denk an David, an all seine Bedrängnis“ sind modernes, würdevolles und gut lesbares Standarddeutsch. Die Wiederholung von „an“ ist im knappen poetischen Satz natürlich und macht die Beziehung der beiden Objekte klar.
  terminology: „Jahwe“ gibt den Gottesnamen יְהוָה konsistent als Namen wieder. „Wallfahrtslied“ ist als funktionale Übersetzung angemessen, sofern die Fußnote „Lied der Aufstiege“ und „Stufenlied“ dokumentiert. „Bedrängnis“ wahrt für עֻנּוֹתוֹ die kollektive Singularform und umfasst die im Kontext mögliche Not, das Leiden und die Erniedrigung.
  issues:
  - severity: medium
    issue: „um Davids willen“ verengt die Funktion von לְדָוִד.
    rationale: Die Präposition kann eine Fürbitte zugunsten Davids ausdrücken, muss dies aber nicht. Im Haupttext sollte diese umstrittene bzw. offene Nuance nicht gegenüber dem naheliegenden Bezug „an David“ bevorzugt festgelegt werden.
  - severity: low
    issue: „Mühsal“ ist für עֻנּוֹתוֹ etwas zu arbeitsbezogen.
    rationale: Das hebräische Wortfeld betrifft primär Bedrängnis, Leiden und Erniedrigung. „Bedrängnis“ ist im Deutschen breiter und kontextnäher.
