  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/000.yaml
  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a]


    Jahwe, denk an David, an all seine Bedrängnis.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ein Lied der Aufstiege“. Gemeint ist wahrscheinlich ein Lied für die Wallfahrt hinauf nach Jerusalem; traditionell auch „Stufenlied“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier eine Präposition mit „David“. Sie kann „für David“, „zugunsten Davids“ oder allgemeiner „im Blick auf David“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „all sein Elend“, „all seine Mühsal“ oder „all seine Erniedrigung“. Das hebräische Wort kann Leiden, Bedrängnis und das Erniedrigtwerden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die traditionelle Wendung bezeichnet wahrscheinlich ein Lied für den Aufstieg nach Jerusalem; „Wallfahrtslied“ gibt diese Funktion in natürlichem Deutsch wieder, während die wörtlichere Alternative in der Fußnote erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְדָוִד
  choice: um Davids willen
  rationale: Die Präposition לְ kann hier eine Beziehung zu David oder ein Handeln zu seinen Gunsten ausdrücken. Die gewählte Formulierung ergibt einen natürlichen deutschen Satz; die offenere wörtliche Möglichkeit wird in der Fußnote genannt.
- source_word: עֻנּוֹתוֹ
  choice: seine Mühsal
  rationale: Das Substantiv bezeichnet bedrängendes Leid, Mühen oder Erniedrigung. „Mühsal“ bewahrt die kollektive Einzahl und lässt die Art des Leidens offen.
theological_decisions:
- issue: Bezug der Bitte auf David
  choice: Die Bitte wird als Gedenken zugunsten Davids formuliert.
  alternative: „Denk an David, an all seine Mühsal“ oder „Gedenke David all seine Erniedrigung“
  rationale: Der hebräische Text lässt offen, ob לְדָוִד vor allem „für/zugunsten Davids“ oder allgemeiner „im Blick auf David“ bedeutet. Die Hauptfassung folgt der wahrscheinlich fürsorglichen Nuance, ohne die Alternative zu verschweigen.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm als persönlichen Namen; die Transliteration vermeidet, es stillschweigend in einen Titel umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Überschrift bleibt als eigene Zeile stehen. „Denk“ ist gegenwärtig und verständlich; „Mühsal“ bewahrt zugleich den poetischen Ton und die semantische Weite des Hebräischen.
