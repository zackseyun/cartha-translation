base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/001.yaml
  text: A Song of Ascents[a]. Remember, O Yahweh[b], for David all his affliction.
translation:
  language: de
  text: Ein Lied der Aufstiege.[a] Jahwe, denk an David und an seine ganze Mühsal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung der Überschrift ist unsicher. Sie kann sich auf das Hinaufziehen, etwa zu einer Wallfahrt, beziehen; auch „Stufen“ wird erwogen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an all sein Leiden“, „an all seine Bedrängnis“ oder „an all seine Erniedrigung“. Das hebräische Wort kann verschiedene Formen von Not, Beschwernis und Erniedrigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Lied der Aufstiege
  rationale: Die Wiedergabe bleibt nahe bei der hebräischen Sammlungsüberschrift und legt nicht fest, ob Wallfahrten, Stufen oder eine andere Art des Hinaufziehens gemeint sind.
- source_word: זְכוֹר
  choice: Denk … an
  rationale: Der Imperativ wird in natürlichem modernem Deutsch wiedergegeben. Die im Gebetskontext vorausgesetzte Bitte um wirksames, gnädiges Erinnern wird nicht ausdrücklich ergänzt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des Gottesnamens gibt das Tetragramm als Eigennamen wieder und ersetzt es nicht durch einen Titel.
- source_word: לְדָוִד
  choice: für David
  rationale: Die knappe Präpositionalwendung bewahrt die mögliche Bedeutung ‚zugunsten Davids‘, ohne den Bezug stärker festzulegen, als es der hebräische Text tut.
- source_word: אֵת כָּל עֻנּוֹתוֹ
  choice: an all seine Mühsal
  rationale: אֵת wird in der deutschen Rektion von ‚an etwas denken‘ aufgenommen; כָּל wird mit ‚all‘ und die singularische Sammelbezeichnung עֻנּוֹתוֹ mit dem breiten Wort ‚Mühsal‘ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als ‚Jahwe‘ wahrt diese Form, statt sie durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug von לְדָוִד
  choice: für David
  alternative: David zugute / im Blick auf David
  rationale: ‚Für David‘ lässt offen, ob die Bitte ausdrücklich zu Davids Gunsten oder allgemeiner in Bezug auf ihn gesprochen wird.
- issue: Bedeutungsumfang von עֻנּוֹתוֹ
  choice: all seine Mühsal
  alternative: all sein Leiden / all seine Erniedrigung
  rationale: ‚Mühsal‘ umfasst beschwerliches Leiden und Not, ohne den Ausdruck ausschließlich als Erniedrigung oder freiwillige Selbstverleugnung auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Gebetsanrede bleibt knapp; „Denk … an“ ist gegenwärtiger als das gehobene „Gedenke“, ohne die Feierlichkeit unnötig abzuschwächen. Die ungewöhnliche Sammlungsüberschrift wird bewusst nicht zu „Wallfahrtslied“ vereindeutigt.
