id: PSA.132.5
reference: Psalms 132:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַד אֶמְצָ֣א מָ֭קוֹם לַ/יהוָ֑ה מִ֝שְׁכָּנ֗וֹת לַ/אֲבִ֥יר יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/005.yaml
  text: until I find a place for Yahweh[a], a dwelling place for the Mighty One of Jacob.
translation:
  language: de
  text: 'bis ich einen Ort für Jahwe finde,

    Wohnstätten[a] für den Mächtigen Jakobs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen der Plural „Wohnstätten“; sinngemäß kann auch eine zusammenfassende Wohnstätte gemeint sein. Traditionell wird das Wort bisweilen mit „Stiftshütten“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֶמְצָא
  choice: bis ich … finde
  rationale: עַד bezeichnet den Endpunkt des im vorherigen Kontext ausgesprochenen Gelübdes; der deutsche Präsenssatz nach „bis“ gibt das hebräische Imperfekt hier natürlich wieder.
- source_word: מָקוֹם לַיהוָה
  choice: einen Ort für Jahwe
  rationale: מָקוֹם ist allgemein „Ort“; die Präposition ל bezeichnet hier die Bestimmung für Jahwe, ohne den Ort bereits als Tempel oder Heiligtum festzulegen.
- source_word: מִשְׁכָּנוֹת
  choice: Wohnstätten
  rationale: Die Pluralform wird sichtbar bewahrt. „Wohnstätten“ ist im Deutschen verständlich und würdevoll, ohne die historisch stärker festgelegte Wiedergabe „Stiftshütten“ einzutragen.
- source_word: לַאֲבִיר יַעֲקֹב
  choice: für den Mächtigen Jakobs
  rationale: אֲבִיר ist ein Gottesepitheton mit der Bedeutung „der Mächtige/Starke“. Die knappe Genitivverbindung bewahrt die Formulierung des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Numerus von מִשְׁכָּנוֹת
  choice: 'Plural: „Wohnstätten“'
  alternative: 'Singular: „eine Wohnstätte“'
  rationale: Obwohl der Zusammenhang im Deutschen einen zusammenfassenden Singular nahelegen kann, steht im Hebräischen eine echte Pluralform. Diese wird im Haupttext bewahrt und in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Aufbau und die knappe Apposition des hebräischen Verses bleiben erhalten; „Wohnstätten“ bewahrt bewusst den hebräischen Plural.
