  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: de
  text: 'Jahwe schwor David einen verlässlichen Eid[a]; er wird ihn nicht zurücknehmen: »Einen deiner leiblichen Nachkommen[b] werde ich auf deinen Thron setzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wahrheit«. Das hebräische Wort betont, dass der Eid gewiss und verlässlich ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von der Frucht deines Leibes«. Gemeint ist einer von Davids eigenen Nachkommen. Siehe 2. Samuel 7,12 und Apostelgeschichte 2,30.'
    reason: cross_reference
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: schwor
  rationale: Das Nifal von שבע bezeichnet hier das Ablegen eines Eides; das Präteritum passt zur feierlichen poetischen Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱמֶת
  choice: einen verlässlichen Eid
  rationale: Wörtlich »Wahrheit«; in der Apposition zum Schwören unterstreicht das Wort die Gewissheit und Verbindlichkeit des Eides.
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: er wird ihn nicht zurücknehmen
  rationale: שׁוב mit מן drückt hier aus, dass Jahwe von seinem Eid nicht abrückt beziehungsweise ihn nicht widerruft; das Pronomen bezieht sich sinngemäß auf den Eid.
- source_word: מִפְּרִי בִטְנְךָ
  choice: einen von deinen leiblichen Nachkommen
  rationale: Die konkrete hebräische Wendung »von der Frucht deines Leibes« bezeichnet einen aus David selbst hervorgehenden Nachkommen. Die natürliche deutsche Wiedergabe vermittelt den Sinn ohne unpassende biologische Bildsprache.
- source_word: אָשִׁית
  choice: werde ich … setzen
  rationale: שׁית bedeutet setzen oder stellen; im Zusammenhang bezeichnet es die Einsetzung eines Nachkommen auf den Königsthron.
- source_word: לְכִסֵּא לָךְ
  choice: auf deinen Thron
  rationale: Die Verbindung von לְכִסֵּא und לָךְ bezeichnet im Kontext am natürlichsten Davids Thron, auch wenn die hebräische Konstruktion wörtlicher »auf einen Thron für dich« lauten könnte.
theological_decisions:
- issue: Messianische und bundesgeschichtliche Reichweite der Verheißung an David
  choice: Der Haupttext spricht von einem leiblichen Nachkommen Davids und macht eine messianische Erfüllung nicht ausdrücklich.
  alternative: Die Verheißung bereits im Wortlaut unmittelbar messianisch formulieren.
  rationale: Der Vers selbst formuliert zunächst die dynastische Verheißung an David. Eine spätere messianische Auslegung ist kanonisch bedeutsam, soll aber nicht in den Wortlaut hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Jahwe« bewahrt den Gottesnamen. Die idiomatische Wiedergabe »leibliche Nachkommen« vermeidet im Deutschen die missverständliche Formulierung »Frucht deines Mutterleibs« bei der Anrede eines Mannes; die konkrete hebräische Bildsprache bleibt in der Fußnote erhalten.
