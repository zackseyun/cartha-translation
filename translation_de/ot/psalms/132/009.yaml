base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/009.yaml
  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: de
  text: Mögen deine Priester mit Gerechtigkeit bekleidet sein[a], und mögen deine Getreuen jubeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Recht“. Das hebräische Wort kann sowohl sittliche Gerechtigkeit als auch Recht und gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor Freude rufen“ beziehungsweise „vor Freude singen“. Das hebräische Verb bezeichnet lauten, freudigen Jubel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: deine Priester
  rationale: כֹּהֵן bezeichnet hier eindeutig Priester; die Form bewahrt den kultischen Tempelkontext und gibt das Suffix der 2. Person Singular wieder.
- source_word: יִלְבְּשׁוּ
  choice: sollen ... bekleidet sein
  rationale: Die Wendung bewahrt das Bild des Bekleidens und gibt zugleich die volitive Kraft des Imperfekts im Gebetskontext in natürlichem Deutsch wieder.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ umfasst im Deutschen sowohl die sittliche als auch die rechtliche Dimension von צֶדֶק und passt zur bildhaften priesterlichen Bekleidung.
- source_word: וַחֲסִידֶיךָ
  choice: deine Getreuen
  rationale: חָסִיד bezeichnet Menschen, die von treuer Hingabe beziehungsweise Bundestreue geprägt sind. „Getreue“ ist knapp und vermeidet spätere kirchliche Nebenbedeutungen von „Heilige“.
- source_word: יְרַנֵּנוּ
  choice: sollen jubeln
  rationale: Das Piel von רנן bezeichnet lauten, freudigen Ausdruck. „Jubeln“ gibt diese freudige Stimmgebung natürlich wieder, ohne sie unnötig auf Singen oder Rufen festzulegen.
theological_decisions:
- issue: Volitive Bedeutung der Imperfektformen im Gebetskontext
  choice: Wiedergabe als Bitte mit „sollen“
  alternative: „Deine Priester werden mit Gerechtigkeit bekleidet sein, und deine Getreuen werden jubeln.“
  rationale: Im Zusammenhang des Psalms sind die Verbformen am besten als Bitte beziehungsweise Wunsch zu verstehen, nicht als bloße Zukunftsaussage. Das deutsche „sollen“ bewahrt diesen Gebetscharakter.
- issue: Bedeutungsumfang von חָסִיד
  choice: „Getreue“
  alternative: „Fromme“ oder „Heilige“
  rationale: Die Übersetzung betont loyale Hingabe, ohne Frömmigkeit auf Innerlichkeit zu verengen oder eine spätere dogmatische Kategorie von Heiligen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das Bild der Bekleidung bleiben erhalten; „jubeln“ bewahrt die Offenheit hinsichtlich der genauen Form des freudigen Ausrufs.
