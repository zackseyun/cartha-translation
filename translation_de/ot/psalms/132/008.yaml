id: PSA.132.8
reference: Psalms 132:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קוּמָ֣/ה יְ֭הוָה לִ/מְנוּחָתֶ֑/ךָ אַ֝תָּ֗ה וַ/אֲר֥וֹן עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: de
  text: Mach dich auf, Jahwe, zu deiner Ruhestätte[a], du und die Lade deiner Stärke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu deiner Ruhe“. Das hebräische Wort kann sowohl die Ruhe selbst als auch einen Ruheort bezeichnen; hier ist wahrscheinlich der Ort gemeint, an dem Jahwe dauerhaft gegenwärtig ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Lade deiner Macht“ beziehungsweise „die Lade, die deine Macht erkennen lässt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Mach dich auf
  rationale: Der Imperativ von קום ruft Jahwe dazu auf, sich zu erheben und seinen Platz einzunehmen. „Mach dich auf“ ist im Deutschen würdig und idiomatisch, ohne den Handlungsimpuls abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִמְנוּחָתֶךָ
  choice: zu deiner Ruhestätte
  rationale: מְנוּחָה kann sowohl „Ruhe“ als auch „Ruhestätte“ bezeichnen. Im Zusammenhang mit der Lade und dem Heiligtum bezeichnet „Ruhestätte“ wahrscheinlich den Ort der bleibenden Gegenwart Jahwes.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen wird beibehalten und mit der Lade koordiniert.
- source_word: וַאֲרוֹן
  choice: und die Lade
  rationale: אֲרוֹן bezeichnet in diesem kultischen Zusammenhang die heilige Lade; „Lade“ ist die etablierte deutsche Wiedergabe.
- source_word: עֻזֶּךָ
  choice: deiner Stärke
  rationale: עֹז bedeutet „Stärke“, „Macht“ oder „Kraft“. Die Genitivverbindung wird bewusst knapp und formal nah als „Lade deiner Stärke“ bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von „Lade deiner Stärke“
  choice: Die Genitivverbindung bleibt als „Lade deiner Stärke“ erhalten.
  alternative: die Lade deiner Macht; die Lade, die deine Macht verkörpert
  rationale: Die knappe hebräische Formulierung verbindet die Lade mit Jahwes Stärke, ohne die genaue Art dieser Beziehung ausdrücklich zu bestimmen. Die Übersetzung bewahrt diese theologische und poetische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetisch-liturgischem Klang. „Mach dich auf“ ist idiomatisch und bewahrt den auffordernden Charakter; die kompakte Wendung „Lade deiner Stärke“ erhält die Bildsprache und Mehrdeutigkeit des Hebräischen.
