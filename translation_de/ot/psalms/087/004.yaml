source:
  edition: WLC
  text: אַזְכִּ֤יר רַ֥הַב וּ/בָבֶ֗ל לְֽ/יֹ֫דְעָ֥/י הִנֵּ֤ה פְלֶ֣שֶׁת וְ/צ֣וֹר עִם כּ֑וּשׁ זֶ֝֗ה יֻלַּד שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: de
  text: 'Ich werde Rahab[a] und Babel unter denen nennen, die mich kennen[b]; siehe, Philistäa und Tyrus samt Kusch: Dieser wurde dort geboren.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab ist hier ein poetischer Name für Ägypten.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »bei denen, die mich kennen«. Die hebräische Wendung kann entweder die Einordnung unter die Menschen, die den Sprecher anerkennen, oder die Angabe derer ausdrücken, bei denen die Völker genannt werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt dem Zusammenhang des Psalms nach: in Zion, der Stadt Gottes.'
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Ich werde … nennen
  rationale: Der Hifil von זכר kann »erwähnen« oder »nennen« bedeuten. »Nennen« passt natürlich zur Aufzählung und bewahrt den deklarativen Charakter der poetischen Aussage.
- source_word: רַהַב
  choice: Rahab
  rationale: Der poetische Eigenname bleibt erhalten; hier bezeichnet er Ägypten, was eine Fußnote erklärt.
- source_word: וּבָבֶל
  choice: und Babel
  rationale: »Babel« ist die im Deutschen geläufige biblische Form des Ortsnamens.
- source_word: לְיֹדְעָי
  choice: unter denen, die mich kennen
  rationale: Die knappe Verbindung mit לְ kann hier die Einordnung in den Kreis derer ausdrücken, die den Sprecher kennen beziehungsweise anerkennen. Die mögliche direktionale Deutung wird in einer Fußnote bewahrt.
- source_word: הִנֵּה
  choice: siehe
  rationale: »Siehe« erhält die aufmerksamkeitslenkende und poetisch gehobene Funktion des hebräischen Ausdrucks.
- source_word: פְלֶשֶׁת
  choice: Philistäa
  rationale: Das Hebräische nennt das Land beziehungsweise Gebiet, nicht ausdrücklich das Volk.
- source_word: וְצוֹר
  choice: und Tyrus
  rationale: Verwendet die etablierte deutsche Form des Ortsnamens.
- source_word: עִם כּוּשׁ
  choice: samt Kusch
  rationale: »Samt« gibt die begleitende beziehungsweise gruppierende Bedeutung von עִם knapp und in einem würdigen poetischen Register wieder.
- source_word: זֶה
  choice: Dieser
  rationale: Das maskuline Demonstrativpronomen steht im Singular. »Dieser« bewahrt diese Form, ohne ausdrücklich »Mann« oder »Mensch« hinzuzufügen.
- source_word: יֻלַּד שָׁם
  choice: wurde dort geboren
  rationale: Die passive Form von ילד zusammen mit שָׁם bezeichnet unmittelbar die Geburt an jenem Ort.
theological_decisions:
- issue: Identität des Ich-Sprechers in »die mich kennen«
  choice: Die erste Person bleibt ohne ausdrückliche Identifizierung erhalten.
  alternative: Der Sprecher ist der HERR; oder Zion spricht als Person.
  rationale: Der Vers selbst nennt den Sprecher in dieser Zeile nicht ausdrücklich. Daher wird die literarisch-theologische Zuordnung nicht in den Wortlaut eingetragen.
- issue: Bezug von »dort«
  choice: Das Adverb »dort« bleibt wie im Hebräischen stehen.
  alternative: »Dort« bezeichnet ausdrücklich Zion beziehungsweise die Stadt Gottes.
  rationale: Der Zusammenhang legt Zion nahe, doch der hebräische Vers verwendet nur das Adverb. Die Fußnote erläutert den Kontext, ohne ihn in den Haupttext einzusetzen.
- issue: Zugehörigkeit der genannten Völker zu denen, die den Sprecher kennen
  choice: »unter denen« gibt die wahrscheinliche inklusive Lesart wieder.
  alternative: Die Völker werden lediglich gegenüber denen erwähnt, die den Sprecher kennen.
  rationale: Die Präposition לְ ist in der verdichteten poetischen Form mehrdeutig. Die Hauptfassung folgt der inklusiven Lesart, während die alternative syntaktische Deutung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Ton. Die Eigennamen folgen geläufigen deutschen Bibelformen; die knappe Aufzählungsstruktur und die Mehrdeutigkeiten des Hebräischen bleiben gewahrt.
