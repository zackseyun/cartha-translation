lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: Herrliches
  rationale: Die substantivisch gebrauchte feminine Pluralform von כבד bezeichnet hier Ehrenvolles, Ruhmreiches oder Gewichtiges. „Herrliches“ gibt den poetischen Lobton natürlich und würdig wieder.
- source_word: מְדֻבָּר
  choice: wird … gesagt
  rationale: Das Pual-Partizip von דבר bezeichnet das Gesagtwerden. Mit dem substantivischen Sammelbegriff „Herrliches“ ist im Deutschen der Singular „wird“ idiomatisch.
- source_word: בָּךְ
  choice: über dich
  rationale: Die Präposition ב kann in dieser Verbindung eine Rede über beziehungsweise hinsichtlich der Stadt bezeichnen; zugleich bleibt „in dir“ grammatisch möglich und wird in der Fußnote bewahrt.
- source_word: עִיר הָאֱלֹהִים
  choice: Stadt Gottes
  rationale: Die Status-constructus-Verbindung bedeutet „Stadt Gottes“. Sie steht als direkte Anrede beziehungsweise Apposition zu „dich“; ein zusätzliches „o“ ist im modernen Deutschen nicht nötig.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Funktion des vermutlich musikalischen oder liturgischen Ausdrucks ist unsicher. Er wird daher transliteriert und nicht deutend übersetzt.
