translation:
  language: de
  text: Ein Psalm der Söhne Korachs[a]; ein Lied. Sein Fundament liegt auf heiligen Bergen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ein Psalm für die Söhne Korachs“. Das hebräische ל kann Zuordnung oder Zugehörigkeit ausdrücken und legt die unmittelbare Verfasserschaft nicht eindeutig fest.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ihr Fundament liegt auf heiligen Bergen“, wenn Zion oder Jerusalem als unausgesprochener Bezug verstanden wird. Das hebräische Suffix steht in der dritten Person maskulin Singular; sein Bezug wird nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: der Söhne Korachs
  rationale: Das vorangestellte ל bezeichnet in Psalmüberschriften Zugehörigkeit oder Zuordnung und kann auch eine Verfasserschaft einschließen. „Der Söhne Korachs“ ist knapp und lässt diese Beziehung weitgehend offen.
- source_word: מִזְמוֹר שִׁיר
  choice: Ein Psalm …; ein Lied
  rationale: Beide hebräischen Gattungsbezeichnungen werden beibehalten. Das Semikolon verbindet sie als Bestandteile derselben Überschrift, ohne sie gleichzusetzen.
- source_word: יְסוּדָתוֹ
  choice: Seine Grundfeste
  rationale: „Grundfeste“ gibt das von יסד abgeleitete Substantiv als Fundament bzw. Grundlage wieder. Das Possessivpronomen bildet das maskuline Singularsuffix formal ab, während dessen ungenannter Bezug in einer Fußnote erläutert wird.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: auf heiligen Bergen
  rationale: Bei Bergen ist „auf“ im Deutschen die natürliche örtliche Wiedergabe von ב. קֹדֶשׁ beschreibt die Berge als heilig.
theological_decisions:
- issue: Bezug des Suffixes in יְסוּדָתוֹ
  choice: „Seine Grundfeste“ mit unausgesprochenem Bezug
  alternative: '„Ihre Grundfeste“, auf Zion bzw. Jerusalem bezogen; oder deutender: „Was er gegründet hat“'
  rationale: Der hebräische Text nennt keinen ausdrücklichen Bezug für das maskuline Singularsuffix. Die Übersetzung bewahrt die formale Pronominalgestalt und erklärt die mögliche Beziehung auf Zion/Jerusalem, statt sie im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Grundfeste“ ist leicht gehoben und poetisch, bleibt aber verständlich und entspricht dem Bild des Fundaments. Die Überschrift bewahrt beide Gattungsangaben des Hebräischen.
