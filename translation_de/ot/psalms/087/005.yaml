  variant: modern standard German
source:
  edition: WLC
  text: וּֽ/לֲ/צִיּ֨וֹן יֵאָמַ֗ר אִ֣ישׁ וְ֭/אִישׁ יֻלַּד בָּ֑/הּ וְ/ה֖וּא יְכוֹנְנֶ֣/הָ עֶלְיֽוֹן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: de
  text: 'Und von Zion wird man sagen[a]: »Dieser und jener wurde in ihr geboren«, und der Höchste selbst wird sie festigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mann für Mann wurde in ihr geboren.“ Im Hebräischen wird „Mann“ wiederholt, um jeden Einzelnen hervorzuheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: Und von Zion
  rationale: Das לְ führt Zion hier als Thema ein; „von Zion“ ist im Deutschen knapp und natürlich. Das vorangestellte וּ wird für den poetischen Zusammenhang mit „Und“ wiedergegeben.
- source_word: יֵאָמַר
  choice: wird man sagen
  rationale: Das Nifal Imperfekt von אמר hat unpersönlich-passiven Sinn. Die deutsche Man-Konstruktion gibt diesen idiomatisch wieder, ohne einen bestimmten Sprecher einzuführen.
- source_word: אִישׁ וְאִישׁ
  choice: Dieser und jener
  rationale: Die Wiederholung von אִישׁ wirkt distributiv und hebt einzelne Menschen hervor. „Dieser und jener“ bewahrt diese Einzelbezogenheit natürlicher als das wörtliche „Mann und Mann“.
- source_word: יֻלַּד בָּהּ
  choice: wurde in ihr geboren
  rationale: 'Die Verbform steht im Hebräischen im Singular und passt zur distributiven Auffassung: einer nach dem anderen. „In ihr“ bewahrt die weibliche Personifikation Zions.'
- source_word: וְהוּא
  choice: und … selbst
  rationale: Das selbstständige Pronomen trägt Nachdruck; im Deutschen wird dieser durch „selbst“ beim göttlichen Titel ausgedrückt.
- source_word: יְכוֹנְנֶהָ
  choice: wird sie festigen
  rationale: Die Verbform von כון bezeichnet festes Aufrichten, Sichern oder Bestätigen. „Festigen“ ist im Deutschen natürlich und lässt die Bedeutungsbreite zwischen Gründen und Sichern bestehen.
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Dies ist die geläufige und würdevolle deutsche Wiedergabe des göttlichen Titels.
theological_decisions:
- issue: Bezug des betonten Pronomens וְהוּא bei עֶלְיוֹן
  choice: „der Höchste selbst“ bezeichnet Gott als den Handelnden
  alternative: „und er, der Höchste, wird sie festigen“
  rationale: Die Formulierung erhält den Nachdruck des hebräischen Pronomens und gründet Zions Bestand in Gottes eigenem Handeln, ohne eine weitergehende dogmatische Aussage einzutragen.
- issue: Personifikation Zions
  choice: Zion wird mit den weiblichen Pronomen „ihr“ und „sie“ personifiziert
  alternative: „dort“ und „es“
  rationale: Die hebräischen Suffixe sind feminin und stellen Zion als Stadt beziehungsweise Mutter dar. Die deutsche Fassung bewahrt dieses poetische Bild.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die Satzstellung bleibt poetisch, ist aber allgemein verständlich. Die feminine Personifikation Zions und der Nachdruck auf Gottes eigenem Handeln werden bewahrt.
