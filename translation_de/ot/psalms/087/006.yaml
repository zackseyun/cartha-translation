id: PSA.87.6
reference: Psalms 87:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְֽהוָ֗ה יִ֭סְפֹּר בִּ/כְת֣וֹב עַמִּ֑ים זֶ֖ה יֻלַּד שָׁ֣ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/006.yaml
  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: de
  text: 'Jahwe wird zählen, wenn er die Völker verzeichnet: „Dieser wurde dort[a] geboren.“ Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder dem Zusammenhang entsprechend: „in ihr“, bezogen auf Zion in den umgebenden Versen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִסְפֹּר
  choice: wird zählen
  rationale: Das Qal von ספר bedeutet grundsätzlich „zählen“; der Zusammenhang des Verzeichnens wird durch den folgenden Infinitivsatz ausgedrückt.
- source_word: בִּכְתוֹב
  choice: wenn er … verzeichnet
  rationale: Die Präposition ב mit dem Infinitivus constructus ist hier temporal. „Verzeichnet“ gibt den Gedanken eines Registers in natürlichem Deutsch wieder.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet mehrere Völker beziehungsweise Volksgruppen und wird im Deutschen treffend mit „die Völker“ wiedergegeben.
- source_word: זֶה
  choice: Dieser
  rationale: Das maskuline Demonstrativpronomen verweist auf eine einzelne verzeichnete Person, ohne ausdrücklich „Mann“ zu ergänzen.
- source_word: יֻלַּד
  choice: wurde … geboren
  rationale: Die passive Form von ילד bezeichnet die Geburt; das deutsche Präteritum bildet die Feststellung im Verzeichnis klar ab.
- source_word: שָׁם
  choice: dort
  rationale: Das hebräische Adverb bedeutet wörtlich „dort“ und verweist im Kontext auf Zion, ohne den Bezug im Vers selbst ausdrücklich zu benennen.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und genaue liturgische Funktion des Ausdrucks unsicher sind, wird er traditionell transkribiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Die Transkription bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Ob שָׁם ausdrücklich als „in Zion“ beziehungsweise „in ihr“ wiederzugeben ist
  choice: dort
  alternative: in ihr / in Zion
  rationale: Der Zusammenhang weist auf Zion, doch der hebräische Text verwendet lediglich das Ortsadverb „dort“. Diese Wiedergabe bewahrt die Ausdrucksweise und lässt den Bezug so offen, wie der Vers ihn formuliert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verzeichnet“ lässt das Bild einer amtlichen Eintragung erkennen, während „wird zählen“ die Grundbedeutung von ספר bewahrt. Die knappe Einzelfeststellung „Dieser wurde dort geboren“ folgt der markanten Form des Hebräischen.
