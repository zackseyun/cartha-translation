  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/007.yaml
  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: de
  text: 'Sänger ebenso wie Tänzer[a] sagen: »Alle meine Quellen[b] sind in dir.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Flötenspieler“ statt „Tänzer“. Das hebräische Wort wird gewöhnlich auf Tanzen oder Sichdrehen bezogen; auch eine Deutung als Instrumentalisten ist vorgeschlagen worden.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Bild kann auch mit „alle meine Lebensquellen“ wiedergegeben werden. Das Verb „sagen“ steht im Hebräischen nicht ausdrücklich, sondern erschließt die knappe poetische Satzfügung.
    reason: lexical_alternative_and_textual_ellipsis
lexical_decisions:
- source_word: וְשָׁרִים
  choice: Und Sänger
  rationale: Die Form wird im Zusammenhang mit dem parallelen כְּחֹלְלִים am natürlichsten vom Verb שׁיר („singen“) her verstanden. Die mögliche Deutung als „Fürsten“ passt hier weniger gut.
- source_word: כְּחֹלְלִים
  choice: wie Tänzer
  rationale: Wahrscheinlich bezeichnet die Form Tanzende beziehungsweise sich im Tanz Drehende. Die knappe hebräische Zuordnung wird im Deutschen mit „wie“ bewahrt; die vorgeschlagene Deutung als Flötenspieler wird in einer Fußnote genannt.
- source_word: כָּל
  choice: Alle
  rationale: Gibt die umfassende Aussage des Hebräischen idiomatisch und poetisch wieder.
- source_word: מַעְיָנַי
  choice: meine Quellen
  rationale: מַעְיָן bezeichnet eine Quelle oder einen Quell. „Quellen“ bewahrt das konkrete poetische Bild und lässt zugleich seine übertragene Bedeutung offen.
- source_word: בָּךְ
  choice: sind in dir
  rationale: Die Präposition ב wird grundsätzlich mit „in“ wiedergegeben. Das feminine Singularpronomen bezieht sich auf Zion; die Kopula muss im Deutschen ergänzt werden.
theological_decisions:
- issue: Bildhafte Bedeutung der Quellen in der Anrede an Zion
  choice: Das Quellenbild bleibt ohne dogmatische Ausdeutung stehen.
  alternative: „Alle meine Lebensquellen kommen von dir“ oder „All mein Segen ist in dir“
  rationale: Der Vers stellt Zion bildhaft als Ort der Quellen dar, legt aber nicht ausdrücklich fest, ob Leben, Freude, Zugehörigkeit oder Segen gemeint ist. Eine konkretisierende Paraphrase würde die poetische und theologische Offenheit verengen.
- issue: Sprecherzuweisung der Schlussaussage
  choice: „Sänger wie Tänzer sagen“ wird als natürliche Ergänzung der elliptischen Dichtung formuliert.
  alternative: 'Ohne ergänzendes Redeverb: „Und Sänger wie Tänzer: Alle meine Quellen sind in dir.“'
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb des Sagens. Die Ergänzung macht die wahrscheinliche Satzbeziehung verständlich, wird aber als textlich ergänzte Deutung ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Bild. Die ungewöhnliche Vergleichsform „Sänger wie Tänzer“ spiegelt die knappe hebräische Konstruktion, ohne sie unnötig zu glätten.
