id: PSA.87.2
reference: Psalms 87:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹהֵ֣ב יְ֭הוָה שַׁעֲרֵ֣י צִיּ֑וֹן מִ֝/כֹּ֗ל מִשְׁכְּנ֥וֹת יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/002.yaml
  text: Yahweh loves the gates of Zion more than all the dwellings of Jacob[a].
translation:
  language: de
  text: Jahwe liebt die Tore Zions mehr als alle Wohnstätten Jakobs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe liebt die Tore Zions vor allen Wohnstätten Jakobs.“'
    reason: Lexikalisch-idiomatische Alternative für die vergleichende Wendung מִכֹּל.
lexical_decisions:
- source_word: אֹהֵב
  choice: liebt
  rationale: Das Qal-Partizip von אהב wird hier mit Jahwe als Subjekt verbal gebraucht. Das Präsens gibt die allgemeine, fortdauernde Aussage natürlich wieder, ohne die Intensität zu überzeichnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: שַׁעֲרֵי
  choice: die Tore
  rationale: Der Status constructus im Plural wird konkret als „die Tore Zions“ wiedergegeben. Eine mögliche metonymische Bedeutung für die Stadt wird nicht in den Haupttext eingetragen.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Die im Deutschen etablierte Form des Ortsnamens wird beibehalten.
- source_word: מִכֹּל
  choice: mehr als alle
  rationale: Die Präposition מִן mit כֹּל hat nach dem Verb des Vorziehens vergleichende Bedeutung. „Mehr als alle“ macht diesen Vergleich im Deutschen ausdrücklich und verständlich.
- source_word: מִשְׁכְּנוֹת
  choice: Wohnstätten
  rationale: Der Plural von מִשְׁכָּן bezeichnet hier Wohnorte oder Behausungen. „Wohnstätten“ wahrt den poetischen Ton, ohne die kultische Nebenbedeutung von „Stiftshütten“ einzutragen.
- source_word: יַעֲקֹב
  choice: Jakobs
  rationale: Der hebräische Eigenname wird bewahrt, obwohl „Jakob“ hier zugleich das Bundesvolk beziehungsweise dessen Gebiet bezeichnen kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ wahrt den Eigennamecharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Vergleichende Bedeutung von מִכֹּל
  choice: mehr als alle Wohnstätten Jakobs
  alternative: vor allen Wohnstätten Jakobs
  rationale: Der hebräische Ausdruck bezeichnet am natürlichsten eine Bevorzugung Zions gegenüber den übrigen Wohnstätten Jakobs. Die Hauptfassung macht den Gradvergleich deutlich; die Alternative bewahrt die ebenfalls mögliche idiomatische Formulierung des Vorzugs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzform. „Wohnstätten“ ist leicht gehoben, aber allgemein verständlich und entspricht dem Psalmregister.
