  text: A psalm of the sons of Korah[a]; a song[c][b]. Its foundation is in the holy mountains.
translation:
  language: de
  text: Von den Korachitern. Ein Psalm, ein Lied.[a] Sein Fundament liegt auf heiligen Bergen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für die Korachiter. Ein Psalm, ein Lied.“ Die hebräische Präposition kann Zugehörigkeit oder Widmung statt unmittelbarer Autorschaft ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Suffix nennt keinen Bezug; häufig wird Zion als der gedanklich vorausgesetzte Bezug verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: Von den Korachitern
  rationale: Die Wendung bezeichnet die Söhne beziehungsweise Nachkommen Korachs. „Korachiter“ ist im Deutschen natürlich und lässt die für ל mögliche Zuordnung offen; alternativ ist „Für die Korachiter“ möglich.
- source_word: מִזְמוֹר שִׁיר
  choice: Ein Psalm, ein Lied
  rationale: Beide Gattungsbezeichnungen werden wiedergegeben, ohne ihr genaues Verhältnis stärker festzulegen, als es der knappe hebräische Titel tut.
- source_word: יְסוּדָתוֹ
  choice: Sein Fundament
  rationale: Die maskuline Singularform des Suffixes wird formal bewahrt. Worauf „sein“ verweist, bleibt im Hebräischen unausgesprochen und wird daher nicht stillschweigend ergänzt.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: auf heiligen Bergen
  rationale: Die constructus-Verbindung kann idiomatisch als „heilige Berge“ wiedergegeben werden; ב bezeichnet hier den Ort der Gründung und wird natürlich mit „auf“ übersetzt.
theological_decisions:
- issue: Unausgesprochener Bezug von „sein Fundament“
  choice: Das maskuline Pronomen bleibt ohne ausdrücklich ergänztes Bezugswort stehen.
  alternative: „Ihr Fundament liegt auf heiligen Bergen“, mit Zion oder Jerusalem als gedanklich ergänztem Bezug.
  rationale: Der hebräische Text nennt Zion oder Jerusalem nicht ausdrücklich. Die Mehrdeutigkeit soll nicht zugunsten einer bestimmten Deutung aufgelöst werden.
- issue: Zuordnung zu den Korachitern
  choice: „Von den Korachitern“
  alternative: „Für die Korachiter“
  rationale: ל kann Autorschaft, Zugehörigkeit oder Widmung anzeigen. Die Hauptfassung folgt der üblichen Zuordnung, während die Alternative in einer Fußnote erhalten bleibt.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Die knappe Form der Überschrift wird gewahrt; „Korachiter“ ist verständlicher und natürlicher als „Söhne Korachs“. Die ungewöhnliche pronominale Offenheit des zweiten Satzes bleibt bewusst erhalten.
