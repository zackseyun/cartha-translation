  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/000.yaml
  text: For the choir director[a]. A song, a psalm. Shout joyfully to God[b], all the earth.
translation:
  language: de
  text: Für den musikalischen Leiter[a]. Ein Lied, ein Psalm. Jubelt Gott zu, die ganze Erde[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Für den Chorleiter“ oder „Für den Musikmeister“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Jauchzt Gott zu, die ganze Erde!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Wendung bezeichnet wahrscheinlich die für die musikalische Ausführung verantwortliche Person; die genaue Funktion bleibt unsicher.
- source_word: שִׁיר מִזְמוֹר
  choice: Ein Lied, ein Psalm
  rationale: Beide hebräischen Gattungsbezeichnungen werden in ihrer Reihenfolge bewahrt.
- source_word: הָרִיעוּ
  choice: Jubelt … zu
  rationale: Das Verb bezeichnet einen lauten, meist freudigen oder triumphierenden Zuruf; „jubelt … zu“ gibt dies im Deutschen natürlich wieder.
- source_word: כָּל־הָאָרֶץ
  choice: die ganze Erde
  rationale: Bewahrt die umfassende und zugleich mögliche semantische Spannung zwischen Erde und ihren Bewohnern.
theological_decisions:
- issue: Adressat und Umfang des Aufrufs
  choice: Gott … die ganze Erde
  alternative: alle Bewohner der Erde sollen Gott zujubeln
  rationale: Die knappe Personifizierung des hebräischen Textes wird bewahrt, ohne „Erde“ ausdrücklich als ihre Bewohner auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Psalmüberschrift bleibt knapp; der Imperativ ist kräftig und unmittelbar formuliert.
