  - severity: medium
    issue: Wiedergabe von בּוֹ in der Schlusszeile
    rationale: „Sich über ihn freuen“ kann Freude über eine Person oder ein Ereignis ausdrücken. „Sich an ihm freuen“ entspricht der Wendung שׂמח ב und dem gemeinten Freuen in Gott genauer.
