source:
  edition: WLC
  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: de
  text: Er machte das Meer zu trockenem Land; sie durchquerten den Fluss zu Fuß[b]. Dort freuten wir uns an ihm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dort wollen wir uns an ihm freuen.“ Die hebräische Form kann als Aufforderung statt als rückblickende Aussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Der Vers erinnert wahrscheinlich sowohl an den Durchzug durch das Meer beim Auszug aus Ägypten als auch an die Durchquerung des Jordan beim Einzug in das Land.
    reason: cross_reference
lexical_decisions:
- source_word: הָפַךְ
  choice: machte … zu
  rationale: Die Wendung gibt den konkreten Zustandswechsel natürlich wieder, ohne über das hebräische Verb hinauszugehen.
- source_word: יָם
  choice: Meer
  rationale: Die allgemeine Bezeichnung bleibt erhalten; die Anspielung auf den Meerzug wird nicht durch eine genauere Benennung in den Haupttext eingetragen.
- source_word: לְיַבָּשָׁה
  choice: zu trockenem Land
  rationale: Dies entspricht der Zielangabe mit לְ und bewahrt das Motiv des auf wunderbare Weise trockengelegten Weges.
- source_word: בַּנָּהָר
  choice: durch den Fluss
  rationale: Die Präposition bedeutet wörtlich „in/an“, bezeichnet mit dem Bewegungsverb aber idiomatisch den Weg durch den Fluss.
- source_word: יַעַבְרוּ
  choice: gingen sie
  rationale: Das Verb bezeichnet das Hinüber- oder Hindurchgehen; zusammen mit „durch den Fluss“ entsteht eine natürliche deutsche Wiedergabe.
- source_word: בְרָגֶל
  choice: zu Fuß
  rationale: Die geläufige deutsche Entsprechung betont, dass die Durchquerung gehend erfolgte.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb bleibt bewusst offen und kann auf den Ort beziehungsweise das erinnerte Rettungsgeschehen weisen.
- source_word: נִשְׂמְחָה
  choice: freuten wir uns
  rationale: Die rückblickende Wiedergabe bringt die gemeinschaftliche Identifikation der Betenden mit dem früheren Rettungsgeschehen zum Ausdruck; die mögliche auffordernde Lesart wird in einer Fußnote bewahrt.
- source_word: בּוֹ
  choice: über ihn
  rationale: Das maskuline Suffix bezieht sich im Zusammenhang am wahrscheinlichsten auf Gott. „Sich über ihn freuen“ ist natürliches modernes Deutsch und bewahrt den personalen Bezug.
theological_decisions:
- issue: Historische Anspielung und gemeinschaftliche Identifikation
  choice: Die beiden Satzhälften erinnern wahrscheinlich an den Zug durch das Meer und die Durchquerung des Jordan; die betende Gemeinschaft identifiziert sich rückblickend mit den Geretteten.
  alternative: 'Der letzte Satz kann als gegenwärtige Aufforderung verstanden werden: „Dort wollen wir uns über ihn freuen.“'
  rationale: Der Haupttext folgt dem rückblickenden Zusammenhang, während die Fußnote die grammatisch naheliegende auffordernde Deutung ausdrücklich offenhält.
- issue: Bezug des Pronomens בּוֹ
  choice: 'Das Pronomen wird personal auf Gott bezogen: „über ihn“.'
  alternative: Es könnte weniger wahrscheinlich auf den Ort oder das Geschehen bezogen werden.
  rationale: Der Kontext des Psalms stellt Gottes Taten und die Freude an ihm in den Mittelpunkt; dennoch wird keine zusätzliche Gottesbezeichnung in den Text eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. „Fluss“ ist für heutige Leser natürlicher als „Strom“; die historischen Anspielungen werden nicht in den Haupttext hineinerklärt.
