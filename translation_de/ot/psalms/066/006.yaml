  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge der hebräischen Aussagen zutreffend wieder: Gottes Verwandlung des Meeres in trockenes Land, das Überschreiten des Flusses zu Fuß und die Freude an ihm. Die kohortative Form נִשְׂמְחָה wird vertretbar retrospektiv wiedergegeben; die mögliche auffordernde Deutung ist in der Fußnote erhalten.'
  naturalness: „Durch den Fluss gingen sie zu Fuß“ ist verständlich, kann im Deutschen jedoch stärker ein Gehen innerhalb des Flusswassers nahelegen. „Sie durchquerten den Fluss zu Fuß“ ist idiomatischer und bildet die Bewegung des hebräischen Verbs klarer ab. Für die Gottesfreude ist „sich an ihm freuen“ im Deutschen genauer als „sich über ihn freuen“, weil es die im Hebräischen mit בְּ ausgedrückte Freude in Gott besser trifft.
  terminology: „Meer“, „trockenes Land“, „Fluss“ und „zu Fuß“ sind treffend und modern. „An ihm“ bewahrt den personalen Bezug des maskulinen Suffixes und die religiöse Ausdrucksweise, ohne eine zusätzliche Deutung einzutragen.
