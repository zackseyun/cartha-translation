  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/001.yaml
  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: de
  text: Für den Chorleiter[a]. Ein Lied, ein Psalm. Jauchzt Gott zu[b], alle Welt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für den Musikleiter« oder »Dem Chorleiter«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Ruft Gott laut zu« oder »Lasst für Gott Jubel erschallen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Überschrift bezeichnet wahrscheinlich den Leiter der musikalischen Aufführung. »Chorleiter« ist im heutigen Deutsch klar und bewahrt den liturgisch-musikalischen Bezug.
- source_word: שִׁיר מִזְמוֹר
  choice: Ein Lied, ein Psalm
  rationale: Beide hebräischen Gattungsbezeichnungen bleiben erhalten, ohne sie zu einer einzigen Angabe zusammenzuziehen.
- source_word: הָרִיעוּ
  choice: Jubelt … zu
  rationale: Das Verb bezeichnet einen lauten Ruf, häufig als freudigen oder triumphalen Zuruf. »Jubelt … zu« gibt im Deutschen sowohl die Lautstärke als auch den feierlichen Charakter natürlich wieder.
- source_word: לֵאלֹהִים
  choice: Gott zu
  rationale: Die Präposition kennzeichnet Gott als Adressaten des Jubelrufs; die deutsche Verbindung »jemandem zujubeln« gibt dies idiomatisch wieder.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: Im Lobkontext ist der umfassende Sinn »Erde« wahrscheinlicher als das territorial begrenzte »Land«.
theological_decisions:
- issue: Reichweite des Aufrufs in כָּל הָאָרֶץ
  choice: universaler Aufruf an die ganze Erde
  alternative: Aufruf an das ganze Land beziehungsweise den gesamten irdischen Bereich
  rationale: Der Lobaufruf des Psalms legt einen universalen Horizont nahe. »Die ganze Erde« bewahrt diese Weite, ohne den Text darüber hinaus dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form der Psalmüberschrift und beide Gattungsangaben werden bewahrt; der Hauptsatz ist als unmittelbarer, feierlicher Aufruf formuliert.
