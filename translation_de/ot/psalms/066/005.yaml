source:
  edition: WLC
  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: de
  text: Kommt und seht die Werke Gottes! Ehrfurchtgebietend ist sein Handeln an den Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Söhnen des Menschen“; die Wendung bezeichnet die Menschen insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Kommt
  rationale: Der Pluralimperativ von הלך kann in einer Einladung idiomatisch als „Kommt“ wiedergegeben werden; zusammen mit „seht“ entspricht dies natürlichem Deutsch.
- source_word: וּרְאוּ
  choice: und seht
  rationale: Der Pluralimperativ fordert dazu auf, Gottes Handeln wahrzunehmen und zu betrachten.
- source_word: מִפְעֲלוֹת
  choice: die Werke
  rationale: Das Substantiv bezeichnet das von Gott Vollbrachte; „Werke“ ist würdig und bewahrt einen gewissen lexikalischen Abstand zum folgenden עֲלִילָה.
- source_word: אֱלֹהִים
  choice: Gottes
  rationale: Der Kontext bezeichnet eindeutig den Gott Israels; der Genitiv ist im deutschen Satz idiomatisch.
- source_word: נוֹרָא
  choice: Ehrfurchtgebietend
  rationale: Das Wort bezeichnet etwas, das Furcht und ehrfürchtiges Staunen hervorruft. „Ehrfurchtgebietend“ wahrt beide Aspekte besser als das im Deutschen oft abgeschwächte „großartig“.
- source_word: עֲלִילָה
  choice: sein Tun
  rationale: Der Singular bezeichnet Gottes Handeln kollektiv oder abstrakt. „Tun“ bildet dies knapp ab und unterscheidet sich von „Werke“.
- source_word: עַל
  choice: an
  rationale: Die Präposition beschreibt hier Gottes Handeln in Bezug auf die Menschen, ohne eindeutig nur Wohltat oder Gericht festzulegen. „An“ bewahrt diese Offenheit.
- source_word: בְּנֵי אָדָם
  choice: den Menschen
  rationale: Die feste hebräische Wendung, wörtlich „Söhne Adams/des Menschen“, bezeichnet hier die Menschheit allgemein. Natürliches modernes Deutsch gibt den gemeinten Referenten mit „den Menschen“ wieder; die Bildform wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe von בְּנֵי אָדָם als allgemeine Bezeichnung der Menschheit
  choice: den Menschen
  alternative: den Söhnen Adams / den Menschenkindern
  rationale: Die hebräische maskuline Bildform ist eine konventionelle generische Bezeichnung für Menschen insgesamt. Die Hauptfassung vermittelt diesen Sinn in natürlichem Deutsch, während die Fußnote die wörtliche Form transparent macht.
- issue: Semantische Reichweite von נוֹרָא
  choice: Ehrfurchtgebietend
  alternative: furchterregend
  rationale: Der Ausdruck kann Furcht, Scheu und Staunen umfassen. „Ehrfurchtgebietend“ lässt diese Spannung bestehen, ohne Gottes Tun ausschließlich als bedrohlich zu bestimmen.
- issue: Beziehungsrichtung von עַל
  choice: an
  alternative: gegenüber / an den Menschen wirksam
  rationale: Der Kontext legt nicht allein fest, ob die Handlungen als heilsam oder richtend erscheinen. „An“ vermeidet eine einseitige theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf nach der Einladung bildet die poetische Zäsur klar ab. „Ehrfurchtgebietend“ ist bewusst gehoben, aber allgemein verständlich; „sein Tun an den Menschen“ bewahrt die knappe und in ihrer Wertung offene Aussage des Hebräischen.
