  language: de
  text: Besingt die Herrlichkeit seines Namens; macht seinen Lobpreis herrlich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Besingt
  rationale: Der Imperativ Plural von זמר fordert zu gesungenem beziehungsweise musikalischem Lob auf. „Besingt“ ist im Deutschen natürlich und lässt das folgende Objekt unmittelbar anschließen.
- source_word: כְבוֹד שְׁמוֹ
  choice: die Herrlichkeit seines Namens
  rationale: Die Genitivverbindung gibt כבוד שׁמוֹ direkt wieder und bewahrt den Nachdruck auf der Herrlichkeit, die seinem Namen zukommt, statt sie nur attributiv als „seinen herrlichen Namen“ auszudrücken.
- source_word: שִׂימוּ
  choice: macht
  rationale: שׂים bedeutet wörtlich „setzen, stellen“, wird hier aber idiomatisch mit einem ergänzenden Ausdruck gebraucht. „Macht“ bildet die Aufforderung im modernen Deutschen verständlich ab.
- source_word: כָבוֹד
  choice: herrlich
  rationale: Das hebräische Substantiv „Herrlichkeit/Ehre“ steht in einer knappen Wendung. Nach „macht“ ist die adjektivische Wiedergabe „herrlich“ im Deutschen idiomatisch und erhält die Bedeutung.
- source_word: תְּהִלָּתוֹ
  choice: seinen Lobpreis
  rationale: Das Substantiv תְּהִלָּה bezeichnet Lob beziehungsweise Lobpreis; das Suffix der 3. Person Singular wird mit „seinen“ wiedergegeben. „Lobpreis“ passt hier als das Gott geltende beziehungsweise ihm zukommende Lob.
