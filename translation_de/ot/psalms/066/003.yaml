  verdict: revise
  source_fidelity: 'Die Anrede, der Ausruf über Gottes Werke und die kausale Wendung geben den hebräischen Text zutreffend wieder. Bei יְכַחֲשׁוּ לְךָ ist jedoch „widerwillig unterwerfen“ als Haupttext zu eng: Das Piel von כחש hebt besonders ein unechtes, lügenhaftes oder geheucheltes Nachgeben hervor. Die Widerwilligkeit ist eine mögliche kontextuelle Folgerung, aber nicht die präziseste direkte Wiedergabe.'
  naturalness: Der Entwurf ist insgesamt würdiges, modernes Standarddeutsch. „Sich dir zum Schein unterwerfen“ ist idiomatischer und genauer als „sich dir widerwillig unterwerfen“ und bewahrt zugleich den poetisch knappen Satzbau.
  terminology: „Ehrfurchtgebietend“, „Werke“ und „Macht“ passen zum Psalmregister. „Große Macht“ gibt בְּרֹב עֻזֶּךָ natürlich wieder, ohne die im Deutschen etwas schwerfällige Doppelung „gewaltige Stärke“.
  issues:
  - severity: medium
    issue: Die Hauptübersetzung von יְכַחֲשׁוּ לְךָ als „unterwerfen sich dir ... widerwillig“ verschiebt den Schwerpunkt von geheuchelter bzw. täuschender Unterwerfung zu bloßer innerer Unwilligkeit.
    rationale: Die hebräische Verbwurzel כחש bezeichnet im Piel häufig Leugnen, Lügen oder ein nur vorgetäuschtes Eingeständnis. Der Kontext der überwältigenden göttlichen Macht erlaubt den Gedanken des erzwungenen Nachgebens, doch die Unaufrichtigkeit sollte im Haupttext sichtbar bleiben.
  - severity: low
    issue: „Gewaltige Stärke“ ist semantisch vertretbar, aber stilistisch weniger schlank als „große Macht“.
    rationale: רֹב bezeichnet Größe bzw. Übermaß, עֹז Macht oder Stärke. „Große Macht“ ist im modernen Psalmdeutsch eine natürliche Entsprechung.
