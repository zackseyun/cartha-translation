  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: de
  text: 'Sagt zu Gott: »Wie ehrfurchtgebietend sind deine Werke! Wegen deiner großen Macht unterwerfen sich dir deine Feinde nur zum Schein.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »heucheln dir Unterwerfung« oder: »unterwerfen sich dir widerwillig«. Das hebräische Verb kann eine erzwungene, nur vorgetäuschte Unterwerfung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Sagt
  rationale: Der Qal-Imperativ Plural richtet sich an die versammelte Gemeinschaft; „Sagt“ ist direkt und natürlich.
- source_word: לֵאלֹהִים
  choice: zu Gott
  rationale: Die Präposition ל kennzeichnet hier den Adressaten der Aufforderung.
- source_word: מַה נּוֹרָא
  choice: Wie ehrfurchtgebietend
  rationale: Die Ausrufekonstruktion mit מַה drückt Staunen aus; נוֹרָא verbindet Ehrfurcht mit einem Moment des Erschreckens.
- source_word: מַעֲשֶׂיךָ
  choice: sind deine Werke
  rationale: „Werke“ gibt מַעֲשֶׂה angemessen wieder und entspricht der gehobenen, aber verständlichen Sprache des Psalms.
- source_word: בְּרֹב עֻזֶּךָ
  choice: Wegen deiner gewaltigen Stärke
  rationale: בְּ wird kausal verstanden; רֹב bezeichnet das überwältigende Ausmaß und עֹז die Stärke oder Macht.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: unterwerfen sich dir widerwillig
  rationale: Das Piel von כחש mit ל kann erzwungene, heuchlerische oder täuschende Unterwerfung bezeichnen. Die Formulierung bewahrt den Gedanken des äußeren Nachgebens ohne aufrichtige Hingabe.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Direkte Wiedergabe des Plurals mit Suffix der zweiten Person Singular.
theological_decisions:
- issue: Art der Reaktion der Feinde auf Gott
  choice: Erzwungene oder widerwillige Unterwerfung
  alternative: Täuschend vorgetäuschte Unterwerfung beziehungsweise allgemein „sich unterwerfen“
  rationale: כחש trägt häufig einen Beiklang von Täuschung oder unaufrichtigem Nachgeben. „Widerwillig“ hält den Zwang durch Gottes Macht fest, während die Fußnote die mögliche Betonung der Verstellung sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ehrfurchtgebietend“ bewahrt die Verbindung von Staunen und Furcht; „gewaltige Stärke“ klingt natürlich und erhält die Intensität des Hebräischen.
