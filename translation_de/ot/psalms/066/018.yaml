id: PSA.66.18
reference: Psalms 66:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: de
  text: Wenn ich Unrecht in meinem Herzen gehegt hätte[a], hätte der Herr nicht gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ich Unrecht in meinem Herzen angesehen hätte, hätte der Herr nicht gehört.“'
    reason: Die Grundbedeutung des hebräischen Verbs ist „sehen“; in dieser Wendung kann es auch „ansehen“, „beachten“ oder „gelten lassen“ bedeuten.
lexical_decisions:
- source_word: אָוֶן
  choice: Unrecht
  rationale: Das Wort bezeichnet hier moralisch verwerfliches Tun bzw. Böses. „Unrecht“ ist im modernen Deutschen klar und würdig, ohne die Bedeutung auf bloßes Unglück oder Mühsal zu verengen.
- source_word: אִם
  choice: wenn
  rationale: Die Partikel leitet einen Bedingungssatz ein. Im deutschen irrealen Bedingungsgefüge ist „wenn“ die natürliche Entsprechung.
- source_word: רָאִיתִי
  choice: gehegt hätte
  rationale: Wörtlich bedeutet das Verb „sehen“. In Verbindung mit „im Herzen“ bezeichnet es hier ein inneres Ansehen, Geltenlassen oder bewusstes Festhalten. „Gehegt“ gibt diesen idiomatischen Sinn natürlich wieder.
- source_word: בְלִבִּי
  choice: in meinem Herzen
  rationale: Die Formulierung bewahrt das hebräische Bild vom Herzen als Ort des Denkens und Wollens.
- source_word: לֹא יִשְׁמַע
  choice: hätte ... nicht gehört
  rationale: שׁמע bedeutet „hören“ bzw. „zuhören“. Im Zusammenhang mit Gebet meint es ein aufmerksames, geneigtes Hören; „gehört“ bewahrt die Formulierung des Ausgangstextes, ohne ausdrücklich „erhört“ und damit „beantwortet“ zu sagen.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist hier der feststehende göttliche Titel und wird im Deutschen natürlich mit „der Herr“ wiedergegeben.
theological_decisions:
- issue: Ob die Wendung רָאִיתִי בְלִבִּי wörtlich oder idiomatisch wiederzugeben ist
  choice: „in meinem Herzen gehegt“
  alternative: „in meinem Herzen angesehen/beachtet“
  rationale: Die Wendung meint mehr als das bloße Erkennen eigenen Unrechts, lässt aber offen, wie genau sich das innere Geltenlassen äußert. „Gehegt“ vermittelt bewusstes inneres Festhalten, ohne eine spezielle Lehrdeutung einzuführen.
- issue: Ob שׁמע als „hören“, „zuhören“ oder „erhören“ wiederzugeben ist
  choice: „hören“
  alternative: „zuhören“ oder „erhören“
  rationale: „Hören“ erhält die im Hebräischen bestehende Offenheit zwischen akustischem Hören und geneigtem Zuhören. „Erhören“ könnte zu eindeutig eine ausbleibende Antwort bezeichnen, die nicht ausdrücklich genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der irreale Bedingungssatz wird mit doppeltem Konjunktiv II wiedergegeben. Das traditionelle Herzbild bleibt erhalten; die Mehrdeutigkeit von „hören“ wird nicht vorschnell zu „erhören“ aufgelöst.
