  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: de
  text: Er herrscht für immer durch seine Macht; seine Augen beobachten die Völker. Die Widerspenstigen sollen sich nicht selbst erhöhen.[a] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Widerspenstigen sollen sich nicht erheben.« Das hebräische Verb kann »erheben«, »emporheben« oder, mit rückbezüglicher Nuance, »sich selbst erhöhen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: Er herrscht
  rationale: Das Qal-Partizip beschreibt Gottes fortdauerndes Herrschen; im Deutschen gibt das finite Präsens diese Aussage natürlich wieder.
- source_word: בִּגְבוּרָתוֹ
  choice: durch seine Macht
  rationale: גְּבוּרָה bezeichnet Kraft oder Macht; בְּ ist hier am besten instrumental zu verstehen.
- source_word: עוֹלָם
  choice: für immer
  rationale: Das Wort bezeichnet hier die unbegrenzte Dauer der Herrschaft.
- source_word: עֵינָיו בַּגּוֹיִם תִּצְפֶּינָה
  choice: seine Augen wachen über die Völker
  rationale: Die Körpermetapher bleibt erhalten; צפה bezeichnet aufmerksames Beobachten, und 'über ... wachen' ist dafür natürliches Deutsch.
- source_word: הַסּוֹרְרִים
  choice: die Aufständischen
  rationale: Das Partizip bezeichnet Menschen, die sich widerspenstig gegen eine Herrschaft stellen; im Kontext passt 'Aufständische', ohne den Aspekt bloßer innerer Sturheit zu verengen.
- source_word: אַל יָרִימוּ לָמוֹ
  choice: sollen sich nicht erheben
  rationale: אַל mit Imperfekt drückt ein Verbot aus. רום im Hifil und das rückbezügliche לָמוֹ erlauben sowohl das Sich-Erheben als auch das Sich-Überheben; die Hauptfassung bewahrt diese konkrete und politische Bildlichkeit.
- source_word: סֶלָה
  choice: Sela
  rationale: Der liturgische oder musikalische Ausdruck wird traditionell transliteriert, da seine genaue Bedeutung unsicher ist.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Wahrnehmung
  choice: seine Augen wachen über die Völker
  alternative: er wacht über die Völker
  rationale: Die ausdrückliche Bildsprache des Hebräischen wird beibehalten, ohne sie als Aussage über eine körperliche Begrenzung Gottes auszulegen.
- issue: Bedeutung des Verbots gegenüber den Widerspenstigen
  choice: Die Aufständischen sollen sich nicht erheben
  alternative: Die Widerspenstigen sollen sich nicht überheben
  rationale: Die hebräische Wendung kann ein Sich-Erheben, Aufbegehren oder Sich-Überheben bezeichnen. Die Hauptfassung wahrt die Spannung zwischen Aufstand und Selbstüberhöhung; die Fußnote nennt die wichtige Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Augen-Metapher und die Mehrdeutigkeit des Sich-Erhebens werden bewahrt; 'Sela' bleibt unübersetzt.
