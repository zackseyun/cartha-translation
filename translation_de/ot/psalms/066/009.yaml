translation:
  language: de
  text: der uns am Leben erhält[a][b] und nicht zulässt, dass unsere Füße wanken[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der unser Leben unter die Lebenden setzt“. Das Partizip von שׂוּם kann „setzen“ oder „stellen“ bedeuten; in diesem Zusammenhang hat die Wendung den Sinn, Leben zu bewahren.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „unsere Seele“. Das hebräische נֶפֶשׁ kann je nach Zusammenhang die Seele, das Leben, das Selbst oder die ganze Person bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „unsere Füße nicht ausgleiten lässt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: der … erhält
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Gott als den Handelnden. שׂוּם bedeutet grundsätzlich „setzen/stellen“; zusammen mit נַפְשֵׁנוּ בַּחַיִּים ergibt sich hier jedoch der bewahrende Sinn „am Leben erhalten“.
- source_word: נַפְשֵׁנוּ
  choice: unsere Seele
  rationale: נֶפֶשׁ kann „Seele“, „Leben“, „Selbst“ oder die ganze Person bezeichnen. „Unsere Seele“ bewahrt das konkrete hebräische Ausdrucksbild; die Wendung „am Leben erhält“ macht den lebensbewahrenden Sinn deutlich.
- source_word: בַּחַיִּים
  choice: am Leben
  rationale: Die Präposition mit חַיִּים bezeichnet hier den Bereich des Lebens. Im Deutschen gibt „am Leben erhalten“ die hebräische Aussage natürlich und prägnant wieder.
- source_word: וְלֹא נָתַן
  choice: und … nicht … lässt
  rationale: נָתַן mit folgendem Infinitiv hat hier den Sinn, etwas zuzulassen. Die deutsche Konstruktion mit „lassen“ gibt dieses idiomatische Verhältnis wieder.
- source_word: לַמּוֹט
  choice: wanken
  rationale: מוֹט bezeichnet Instabilität, Schwanken oder Ausgleiten. In Verbindung mit „Füßen“ bewahrt „wanken“ das poetische Bild und klingt im Deutschen natürlich.
- source_word: רַגְלֵנוּ
  choice: unsere Füße
  rationale: Die konkrete Bedeutung „unsere Füße“ wird beibehalten; zugleich trägt das Bild den übertragenen Sinn von Standfestigkeit und Bewahrung.
