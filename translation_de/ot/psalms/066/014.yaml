  language: de
  text: die meine Lippen aussprachen und mein Mund sprach, als ich in Not war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die meine Lippen öffneten“. Im Hebräischen ist damit gemeint, dass die Lippen Worte hervorbrachten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Leitet den Relativsatz ein und bezieht sich auf die Gelübde im vorhergehenden Vers; das feminine Pluralpronomen entspricht dem deutschen Bezugswort „Gelübde“.
- source_word: פָּצוּ
  choice: aussprachen
  rationale: פצה bedeutet wörtlich „öffnen“, hier von den Lippen und idiomatisch für das Hervorbringen gesprochener Worte. „aussprachen“ gibt den Sprechakt natürlich wieder.
- source_word: שְׂפָתַי
  choice: meine Lippen
  rationale: Die konkrete Körperteilbezeichnung bleibt erhalten und bewahrt den poetischen Parallelismus.
- source_word: וְדִבֶּר
  choice: und … redete
  rationale: דבר bedeutet „reden/sprechen“. „redete“ wahrt den Parallelismus und vermeidet eine unnötige inhaltliche Präzisierung.
- source_word: פִּי
  choice: mein Mund
  rationale: Die wörtliche Wiedergabe erhält den synonymen Parallelismus „meine Lippen / mein Mund“.
- source_word: בַּצַּר לִי
  choice: als ich in Not war
  rationale: Die Wendung bezeichnet die bedrängende Lage des Sprechers und hat hier natürlichen zeitlich-umständlichen Sinn.
