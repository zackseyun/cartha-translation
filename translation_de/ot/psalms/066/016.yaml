source:
  edition: WLC
  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: de
  text: Kommt und hört, ihr alle, die ihr Gott fürchtet! Ich will erzählen, was er für meine Seele[a] getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für mein Leben“. Das hebräische Wort נֶפֶשׁ (nefesch) kann je nach Zusammenhang „Seele“, „Leben“ oder die eigene Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Kommt
  rationale: Das Verb bedeutet wörtlich „gehen“, dient hier zusammen mit dem folgenden Imperativ jedoch idiomatisch als Einladung an die Zuhörenden; „Kommt“ gibt diesen Ruf im Deutschen natürlich wieder.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Imperativ fordert zum aufmerksamen Hören auf. „Hört“ bewahrt sowohl die direkte Anrede als auch den biblischen Klang.
- source_word: וַאֲסַפְּרָה
  choice: Ich will erzählen
  rationale: Die Form drückt den entschlossenen Vorsatz des Sprechers aus, Gottes Handeln ausführlich zu berichten. „Ich will erzählen“ ist natürlich und wahrt diese voluntative Nuance.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: ihr alle, die ihr Gott fürchtet
  rationale: Die direkte Anrede bezeichnet Menschen, deren Haltung gegenüber Gott von ehrfürchtiger Furcht geprägt ist. Die Wiedergabe behält die theologisch gewichtige Spannung des Wortes „fürchten“ bei.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Text verwendet den allgemeinen Gottesbegriff אֱלֹהִים und nicht den Gottesnamen JHWH.
- source_word: אֲשֶׁר עָשָׂה
  choice: was er ... getan hat
  rationale: Die Relativkonstruktion wird im Deutschen idiomatisch mit „was“ wiedergegeben; das Perfekt bezeichnet eine vollendete Tat, die für das gegenwärtige Zeugnis bedeutsam bleibt.
- source_word: לְנַפְשִׁי
  choice: für meine Seele
  rationale: נֶפֶשׁ kann „Seele“, „Leben“ oder „Selbst/Person“ bedeuten. „Für meine Seele“ bewahrt die konkrete hebräische Ausdrucksweise und ihre persönliche Tiefe; die kontextuell mögliche Bedeutung „für mein Leben“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung der Gottesfurcht
  choice: ehrfürchtige Furcht vor Gott
  alternative: bloßer Schrecken vor Gott oder lediglich allgemeiner Respekt
  rationale: Die Formulierung bezeichnet eine Haltung ehrfürchtiger Hinwendung zu Gott. „Gott fürchten“ wahrt die biblische Spannung, ohne sie zu bloßem Respekt abzuschwächen oder auf Angst zu verengen.
- issue: Bedeutung von נֶפֶשׁ
  choice: Seele
  alternative: Leben; Person bzw. Selbst
  rationale: Das hebräische Wort hat ein breites Bedeutungsspektrum. „Seele“ erhält die persönliche und innere Dimension des Zeugnisses, während „Leben“ als echte lexikalische Alternative ausdrücklich offengehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Anrede. Die Satzteilung durch Ausrufezeichen macht den hebräischen Einladungsruf hörbar, ohne den Zusammenhang zu lösen. Der traditionelle Ausdruck „Gott fürchten“ bleibt wegen seiner theologischen und sprachlichen Tragweite erhalten.
