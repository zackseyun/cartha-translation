  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: de
  text: Du ließest einen Menschen über unsere Köpfe reiten; wir gingen durch Feuer und durch Wasser, doch du führtest uns hinaus in die Fülle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Erquickung“ bzw. „in überreiche Fülle“. Das seltene hebräische Wort bezeichnet einen Zustand reichlicher Versorgung oder Erquickung.'
    reason: Die genaue Nuance von לָרְוָיָה ist unsicher und lässt mehrere eng verwandte Wiedergaben zu.
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: einen Menschen
  rationale: Der Singular des hebräischen Textes wird bewahrt. אֱנוֹשׁ bezeichnet hier allgemein einen Menschen, oft mit dem Beiklang menschlicher Schwäche, ohne dass dieser ausdrücklich ergänzt werden muss.
- source_word: הִרְכַּבְתָּ ... לְרֹאשֵׁנוּ
  choice: Du ließest ... über unsere Köpfe hinwegfahren
  rationale: Die kausative Verbform und das Bild des Über-uns-Hinwegreitens bzw. -fahrens werden möglichst konkret wiedergegeben; „hinwegfahren“ ist im Deutschen natürlicher als „reiten lassen“, ohne das Unterwerfungsbild aufzulösen.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: wir gingen durch Feuer und durch Wasser
  rationale: Die parallele hebräische Formulierung und das Bild äußerster Bedrängnis bleiben erhalten.
- source_word: לָרְוָיָה
  choice: an einen Ort der Fülle
  rationale: Das seltene Substantiv bezeichnet Fülle bzw. reichliche Versorgung. Die örtliche Präposition wird mit „an einen Ort“ ausgedrückt; die semantische Offenheit gegenüber Erquickung und Überfluss bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Göttliche Verursachung der Erniedrigung
  choice: „Du ließest“ wird ausdrücklich beibehalten.
  alternative: Eine abschwächende Wiedergabe wie „Du erlaubtest, dass“
  rationale: Der Hifil הִרְכַּבְתָּ stellt Gott grammatisch als Veranlasser dar. Die theologische Spannung wird nicht durch eine bloße Zulassungsformel entschärft.
- issue: Singular oder kollektiver Plural bei אֱנוֹשׁ
  choice: „einen Menschen“
  alternative: „Menschen“ oder „Feinde“
  rationale: Der masoretische Text hat einen unbestimmten Singular. Eine kollektive Deutung ist möglich, soll aber nicht ohne Textsignal in den Haupttext eingetragen werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Parallelismus. Der Vers bleibt in der direkten Anrede an Gott; die harte Bildsprache von Unterwerfung, Feuer und Wasser wird nicht geglättet.
