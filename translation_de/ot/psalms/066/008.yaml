    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרְכוּ
  choice: Segnet
  rationale: Der Imperativ von ברך bedeutet zunächst »segnen«. Die im Deutschen ungewöhnlichere, aber verständliche biblische Wendung »Gott segnen« bewahrt diese direkte Aussage; im Zusammenhang überschneidet sie sich mit »preisen«.
- source_word: עַמִּים
  choice: ihr Völker
  rationale: Der Plural bezeichnet mehrere Völker beziehungsweise Volksgruppen und ist hier als direkte Anrede zu verstehen.
- source_word: אֱלֹהֵינוּ
  choice: unseren Gott
  rationale: Die Form mit dem Suffix der 1. Person Plural bezeichnet aus Sicht der betenden Gemeinschaft »unseren Gott«.
- source_word: וְהַשְׁמִיעוּ
  choice: lasst … hören
  rationale: Der Hifil-Imperativ von שמע fordert dazu auf, etwas hörbar werden zu lassen. Die Wiedergabe erhält den kausativen Sinn und bleibt im Deutschen würdevoll und verständlich.
- source_word: קוֹל
  choice: Klang
  rationale: קוֹל kann »Stimme«, »Laut« oder »Klang« bedeuten. In Verbindung mit Lob bezeichnet »Klang« passend dessen hörbaren Ausdruck.
- source_word: תְּהִלָּתוֹ
  choice: seines Lobes
  rationale: Die Wiedergabe bildet das maskuline Suffix formal als Genitiv ab, ohne festzulegen, ob damit Gottes Lobpreiswürdigkeit oder das an ihn gerichtete Lob gemeint ist.
theological_decisions:
- issue: Bedeutung von ברך bei Gott als Objekt
  choice: Segnet
  alternative: Preist
  rationale: »Segnet« bewahrt die Grundbedeutung und die biblische Spannung der Aufforderung, Gott zu segnen. »Preist« erklärt die kontextuelle Bedeutung stärker und wird deshalb als Alternative in der Fußnote genannt.
- issue: Bezug des Suffixes in תְּהִלָּתוֹ
  choice: seines Lobes
  alternative: des Lobes für ihn
  rationale: Der formale Genitiv lässt die Beziehung offen. Die alternative Deutung als an Gott gerichtetes Lob wird in einer Fußnote bewahrt, statt im Haupttext festgeschrieben zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Die direkte Anrede »ihr Völker« macht den hebräischen Vokativ deutlich; »lasst den Klang … hören« erhält den hörbaren und kausativen Charakter der zweiten Aufforderung.
