  text: בָּרְכ֖וּ עַמִּ֥ים אֱלֹהֵ֑י/נוּ וְ֝/הַשְׁמִ֗יעוּ ק֣וֹל תְּהִלָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/008.yaml
  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: de
  text: Segnet[a] unseren Gott, ihr Völker, und macht den Klang seines Lobes[b] hörbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Preist«.'
