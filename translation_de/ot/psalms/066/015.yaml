source:
  edition: WLC
  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: de
  text: 'Brandopfer von Masttieren bringe ich dir dar,

    zusammen mit dem Rauch von Widdern;

    Rinder und Ziegenböcke opfere ich.

    Sela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Sela« ist vermutlich eine musikalische oder liturgische Angabe; seine genaue Bedeutung ist unbekannt.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Der etablierte deutsche Opferbegriff bezeichnet Opfer, die auf dem Altar vollständig verbrannt wurden.
- source_word: מֵחִים
  choice: von Masttieren
  rationale: Das seltene Wort bezeichnet wohl fette beziehungsweise gut gemästete Opfertiere; »Masttiere« gibt dies knapp und verständlich wieder.
- source_word: אַעֲלֶה לָךְ
  choice: bringe ich dir dar
  rationale: Die Hifil-Form von עלה wird im Opferkontext idiomatisch mit »darbringen« wiedergegeben und bewahrt den Bezug auf Gott.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: zusammen mit dem Rauch von Widdern
  rationale: קְטֹרֶת kann hier den beim Verbrennen aufsteigenden Rauch bezeichnen. »Rauch« vermeidet den irreführenden Eindruck, die Widder seien Räucherwerk.
- source_word: אֶעֱשֶׂה
  choice: opfere ich
  rationale: Das allgemeine Verb עשה hat hier im kultischen Zusammenhang den idiomatischen Sinn, ein Opfer auszuführen beziehungsweise darzubringen.
- source_word: בָקָר
  choice: Rinder
  rationale: Das Kollektiv bezeichnet Großvieh beziehungsweise Rinder, ohne das Geschlecht so eindeutig festzulegen wie »Stiere«.
- source_word: עַתּוּדִים
  choice: Ziegenböcke
  rationale: Das Wort bezeichnet spezifisch männliche Ziegen; diese Präzision lässt sich im Deutschen natürlich im Haupttext ausdrücken.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des wohl musikalischen oder liturgischen Zeichens unsicher sind, wird es traditionsgemäß unübersetzt wiedergegeben.
theological_decisions:
- issue: Art und Umfang der genannten Opfertiere
  choice: 'Die Tierbezeichnungen bleiben allgemein beziehungsweise lexikalisch bestimmt: Masttiere, Widder, Rinder und Ziegenböcke.'
  alternative: בָקָר als »Stiere« zu spezifizieren und עַתּוּדִים nur allgemein als »Ziegen« wiederzugeben.
  rationale: Die Übersetzung wahrt die unterschiedliche Genauigkeit der hebräischen Bezeichnungen und fügt keine kultische oder theologische Spezifizierung hinzu.
translation_notes:
  register: Poetisch, würdig und gegenwartsnah. Die beiden parallelen Opferhandlungen werden in natürlicher deutscher Wortstellung wiedergegeben; das semantisch mögliche Aufsteigen bleibt durch das Bild des Rauchs erkennbar.
