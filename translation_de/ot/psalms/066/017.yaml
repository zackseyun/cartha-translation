  yaml_path: translation/ot/psalms/066/017.yaml
  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: de
  text: Zu ihm rief ich mit meinem Mund, und Lobpreis[a] war unter meiner Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und Erhöhung war unter meiner Zunge«. Das hebräische Wort kann »Erhöhung« bedeuten und bezeichnet hier wahrscheinlich gesprochenes Lob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition mit dem Suffix der 3. Person Singular verweist auf Gott im Kontext, bewahrt aber die pronominale Ausdrucksweise des Hebräischen.
- source_word: פִּי
  choice: mit meinem Mund
  rationale: Die konkrete Körpermetapher wird wörtlich und im Deutschen verständlich wiedergegeben.
- source_word: קָרָאתִי
  choice: rief ich
  rationale: קרא bezeichnet hier das an Gott gerichtete Rufen; die Wortstellung erhält den poetischen Nachdruck auf »zu ihm«.
- source_word: וְרוֹמַם
  choice: und Lobpreis
  rationale: Die schwierige Form wird am besten nominal als Erhebung beziehungsweise preisendes Erheben verstanden; »Lobpreis« ist im Deutschen natürlich und bewahrt den kultisch-poetischen Sinn.
- source_word: תַּחַת
  choice: unter
  rationale: Die räumliche Bedeutung wird bewahrt und nicht zu »auf« geglättet, sodass das ungewöhnliche hebräische Bild erhalten bleibt.
- source_word: לְשׁוֹנִי
  choice: meiner Zunge
  rationale: Die wörtliche Körpermetapher bleibt erhalten und bezeichnet zugleich das zum Aussprechen bereite Lob.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus und der bewusst ungewöhnlichen Wendung »unter meiner Zunge«.
