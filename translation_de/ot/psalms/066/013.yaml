  text: אָב֣וֹא בֵיתְ/ךָ֣ בְ/עוֹל֑וֹת אֲשַׁלֵּ֖ם לְ/ךָ֣ נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/013.yaml
  text: I will come into your house with burnt offerings[a]; I will fulfill my vows to you[c][b],
translation:
  language: de
  text: Ich werde in dein Haus kommen mit Brandopfern[a]; dir werde ich meine Gelübde erfüllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dein Haus“ bezieht sich hier wahrscheinlich auf Gottes Heiligtum oder Tempel.
    reason: cultural_note
lexical_decisions:
- source_word: אָבוֹא
  choice: Ich komme
  rationale: Das Qal-Imperfekt 1. Person Singular von בוא bezeichnet hier die beabsichtigte künftige Handlung. „Ich komme“ gibt den Grundsinn natürlich wieder; im Zusammenhang ist das Eintreten in Gottes Haus eingeschlossen.
- source_word: בֵיתְךָ
  choice: dein Haus
  rationale: Wörtlich „dein Haus“. Gemeint ist im kultischen Zusammenhang Gottes Heiligtum, doch die konkrete hebräische Ausdrucksweise bleibt im Haupttext erhalten.
- source_word: בְעוֹלוֹת
  choice: mit Brandopfern
  rationale: עוֹלָה ist die übliche Bezeichnung für ein Brandopfer; die Präposition ב bezeichnet hier die Begleitung.
- source_word: אֲשַׁלֵּם
  choice: ich erfülle
  rationale: Das Piel von שלם bedeutet in Verbindung mit Gelübden, diese einzulösen beziehungsweise zu erfüllen. „Erfüllen“ ist im modernen Deutsch klar und vermeidet einen unnötig geschäftlichen Klang.
- source_word: לְךָ
  choice: dir
  rationale: Die Präposition ל kennzeichnet hier den Empfänger; mit „erfüllen“ ist das deutsche Dativpronomen die natürliche Wiedergabe.
- source_word: נְדָרָי
  choice: meine Gelübde
  rationale: Der Plural mit Suffix der 1. Person Singular wird knapp und direkt wiedergegeben.
theological_decisions:
- issue: Ob „dein Haus“ im Haupttext ausdrücklich als Tempel oder Heiligtum zu deuten ist
  choice: „dein Haus“ im Haupttext beibehalten
  alternative: „dein Heiligtum“ oder „dein Tempel“
  rationale: Der hebräische Text sagt „dein Haus“. Der Zusammenhang mit Brandopfern weist auf Gottes Heiligtum, ohne dass die bildhafte und zugleich konkrete Formulierung im Haupttext eingeengt werden muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt knapp und poetisch; „Brandopfer“ und „Gelübde“ sind etablierte, allgemein verständliche biblisch-religiöse Begriffe.
