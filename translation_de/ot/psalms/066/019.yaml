base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/019.yaml
  text: Surely God has heard[a]; he has listened to the voice of my prayer.
translation:
  language: de
  text: Gewiss, Gott hat gehört; er hat auf die Stimme meines Gebets gehört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: Doch
  rationale: Die Partikel bekräftigt hier nach der vorausgehenden Erwägung die tatsächliche Erfahrung des Beters; „doch“ gibt diesen bestätigenden, leicht kontrastierenden Sinn im Deutschen natürlich wieder.
- source_word: שָׁמַע
  choice: hat mich erhört
  rationale: Im Zusammenhang mit Gebet bezeichnet שׁמע nicht nur akustisches Hören, sondern Gottes antwortbereites Wahrnehmen. „Hat mich erhört“ ist idiomatisches Deutsch und vermeidet zusammen mit dem folgenden Halbvers eine schwerfällige Wiederholung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Form steht mit einem Verb im Singular und bezeichnet hier Gott.
- source_word: הִקְשִׁיב
  choice: hat ... geachtet
  rationale: Der Hifil von קשׁב bezeichnet aufmerksames Hinhören beziehungsweise Beachtung; „auf ... geachtet“ bewahrt diesen nachdrücklichen Aspekt.
- source_word: בְּקוֹל
  choice: auf die Stimme
  rationale: קוֹל bedeutet „Stimme“ oder „Laut“; mit קשׁב lässt sich die Präposition בְּ im Deutschen natürlich durch „auf“ wiedergeben.
- source_word: תְּפִלָּתִי
  choice: meines Gebets
  rationale: Wörtliche und natürliche Wiedergabe des Nomens mit dem Suffix der ersten Person Singular.
theological_decisions:
- issue: Bedeutungsumfang von שָׁמַע im Gebetskontext
  choice: „hat mich erhört“
  alternative: „hat gehört“
  rationale: „Erhört“ bringt die kontextuelle Aussage zur Geltung, dass Gott das Gebet nicht bloß akustisch wahrgenommen hat. Ob und wie die Bitte erfüllt wurde, wird damit jedoch nicht näher bestimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt durch zwei unterschiedliche, semantisch eng verwandte Verben erhalten; die konkrete hebräische Wendung „Stimme meines Gebets“ wird bewusst bewahrt.
