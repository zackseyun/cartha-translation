id: PSA.66.20
reference: Psalms 66:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: de
  text: Gepriesen sei Gott, der mein Gebet nicht abgewiesen und mir seine treue Liebe nicht entzogen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der mein Gebet und seine Güte nicht von mir entfernt hat“. Das hebräische Wort חֶסֶד kann auch „Güte“, „loyale Liebe“ oder „Bundestreue“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip steht hier als doxologischer Ausruf. „Gepriesen sei“ ist im Deutschen natürlich und gibt den Lobpreischarakter wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Bezeichnung meint hier im unmittelbaren Lobpreis den Gott Israels.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen leitet einen Satz ein, der begründet bzw. beschreibt, weshalb Gott gepriesen wird.
- source_word: לֹא הֵסִיר
  choice: nicht abgewiesen … nicht entzogen
  rationale: 'Das Hifil von סור bedeutet „entfernen, wegnehmen, abwenden“. Wegen der unterschiedlichen deutschen Kollokationen der beiden Objekte wird das eine hebräische Verb differenziert wiedergegeben: Ein Gebet wird „abgewiesen“, Liebe wird „entzogen“.'
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: Direkte und geläufige Wiedergabe der an Gott gerichteten Bitte.
- source_word: וְחַסְדּוֹ
  choice: und … seine treue Liebe
  rationale: Das ו verbindet im Hebräischen beide Objekte des verneinten Verbs. חֶסֶד bezeichnet beständige, loyale und oft bundestreue Zuwendung; „treue Liebe“ wahrt sowohl den Beziehungs- als auch den Treueaspekt.
- source_word: מֵאִתִּי
  choice: mir … entzogen
  rationale: Die Trennung „von mir“ wird in natürlichem Deutsch durch die Dativkonstruktion „mir entzogen“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe von חֶסֶד
  choice: seine treue Liebe
  alternative: seine Güte; seine bundestreue Liebe; seine Loyalität
  rationale: „Treue Liebe“ hält Zuneigung und verlässliche Treue zusammen, ohne den Begriff ausschließlich auf einen ausdrücklich genannten Bund zu verengen. Die Fußnote nennt die wichtigen Bedeutungsnuancen.
- issue: Bezug der Verneinung auf beide Satzglieder
  choice: „nicht abgewiesen und … nicht entzogen“
  alternative: 'wörtlich: „mein Gebet und seine treue Liebe nicht von mir entfernt“'
  rationale: Die wiederholte deutsche Verneinung macht eindeutig, dass Gott weder das Gebet zurückgewiesen noch seine Liebe entzogen hat, ohne den Sinn des knappen Hebräisch zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doxologische Formel bleibt gehoben, während die beiden Verbalwendungen idiomatisch und allgemein verständlich sind. Der Fußnotenmarker steht im Haupttext.
