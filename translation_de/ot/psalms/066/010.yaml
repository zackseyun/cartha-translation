base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: de
  text: Denn du hast uns geprüft, Gott, du hast uns geläutert, wie man Silber läutert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild stammt aus der Metallverarbeitung: Gottes Prüfung wird mit dem Läutern von Silber verglichen. Das mit „geprüft“ übersetzte hebräische Verb kann auch das Erweisen der Echtheit betonen.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang den vorausgehenden Lobpreis; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: בְחַנְתָּנוּ
  choice: du hast uns geprüft
  rationale: בחן bezeichnet das Prüfen oder Untersuchen, oft mit Blick darauf, die Echtheit oder Bewährung sichtbar zu machen. „Geprüft“ ist verständlich und passt zum folgenden Bild der Metallläuterung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: „Gott“ steht hier als direkte Anrede. Im modernen Deutschen macht die Satzstellung den Vokativ auch ohne ein zusätzliches „o“ deutlich.
- source_word: צְרַפְתָּנוּ
  choice: du hast uns geläutert
  rationale: צרף bezeichnet die Läuterung von Metall durch Hitze. „Geläutert“ bewahrt sowohl das metallurgische Bild als auch seine übertragene Anwendung auf die Sprecher.
- source_word: כִּצְרָף
  choice: wie man … läutert
  rationale: Das Präfix כ markiert den Vergleich; die Konstruktion beschreibt den Vorgang allgemein. Die unpersönliche deutsche Formulierung gibt dies knapp und natürlich wieder.
- source_word: כָּסֶף
  choice: Silber
  rationale: Wörtliche Bezeichnung des Edelmetalls im Vergleich.
theological_decisions:
- issue: Verhältnis von Prüfung und Läuterung
  choice: Beide Verben bleiben als „geprüft“ und „geläutert“ unterscheidbar.
  alternative: Beide Vorgänge mit „gereinigt“ oder ähnlich zusammenziehen.
  rationale: Der Parallelismus verbindet Prüfung und metallurgische Läuterung, setzt sie aber nicht völlig gleich. Die Übersetzung wahrt diese Bildspannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. „Geläutert“ ist bildkräftig und im Zusammenhang verständlich; die Fußnote erläutert den metallurgischen Hintergrund.
