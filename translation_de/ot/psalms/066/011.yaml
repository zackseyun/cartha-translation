source:
  edition: WLC
  text: הֲבֵאתָ֥/נוּ בַ/מְּצוּדָ֑ה שַׂ֖מְתָּ מוּעָקָ֣ה בְ/מָתְנֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: de
  text: Du hast uns ins Fangnetz gebracht[a]; du hast eine drückende Last auf unsere Hüften gelegt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in die Falle“ oder „in die Festung“. Das hebräische Wort kann eine Fangvorrichtung oder einen befestigten Ort bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich beziehungsweise traditionell: „auf unsere Lenden“. Gemeint ist der Hüft- und Lendenbereich als der Ort, auf dem die Last liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: Du hast uns … gebracht
  rationale: Der Hifil von בוא mit Suffix der 1. Person Plural bezeichnet, dass Gott die Sprechenden hineinbrachte. Das deutsche Perfekt ist hier natürlich und bewahrt die direkte göttliche Urheberschaft.
- source_word: בַמְּצוּדָה
  choice: ins Fangnetz
  rationale: מְצוּדָה kann eine Fangvorrichtung, Falle oder auch einen befestigten Ort bezeichnen. Im Zusammenhang von Prüfung und Einengung gibt „Fangnetz“ das Bild des Gefangenseins anschaulich wieder; die Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: שַׂמְתָּ
  choice: du hast … gelegt
  rationale: שׂים bedeutet „setzen, stellen, legen“. Bei einer auf den Körper gebrachten Last ist „legen“ im Deutschen idiomatisch.
- source_word: מוּעָקָה
  choice: eine drückende Last
  rationale: Das seltene Substantiv bezeichnet Druck, Bedrängnis oder eine einengende Belastung. „Drückende Last“ verbindet die körperliche Bildsprache mit dem Gedanken des Leidens.
- source_word: בְמָתְנֵינוּ
  choice: auf unsere Hüften
  rationale: מָתְנַיִם bezeichnet den Bereich der Lenden beziehungsweise Hüften. „Hüften“ ist gegenwärtiges, verständliches Deutsch und erhält das körperliche Bild; die traditionellere Wiedergabe steht in der Fußnote.
theological_decisions:
- issue: Gottes unmittelbare Rolle in der Leiderfahrung
  choice: 'Die Verben werden in direkter Anrede aktiv auf Gott bezogen: „Du hast uns … gebracht“ und „du hast … gelegt“.'
  alternative: Eine abschwächende unpersönliche Formulierung wie „Wir gerieten ins Fangnetz“ oder „Eine Last kam auf uns“.
  rationale: Die hebräischen Verben stehen ausdrücklich in der 2. Person Singular. Die Übersetzung bewahrt daher die theologische Spannung, dass die betende Gemeinschaft Gott selbst als Handelnden in Prüfung und Bedrängnis anspricht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fangnetz“ und „drückende Last“ erhalten die konkrete Bildsprache; „Hüften“ vermeidet das heute altertümlich wirkende „Lenden“, das zugleich in der Fußnote dokumentiert wird.
