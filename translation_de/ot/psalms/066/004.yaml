id: PSA.66.4
reference: Psalms 66:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל הָ/אָ֤רֶץ יִשְׁתַּחֲו֣וּ לְ֭/ךָ וִֽ/יזַמְּרוּ לָ֑/ךְ יְזַמְּר֖וּ שִׁמְ/ךָ֣ סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: de
  text: Die ganze Erde wird sich vor dir niederwerfen und dir lobsingen; sie wird deinem Namen lobsingen. Sela[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sela“ ist vermutlich eine musikalische oder liturgische Angabe; seine genaue Bedeutung ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: Die ganze Erde
  rationale: Die Wendung bezeichnet hier umfassend die gesamte Erde; „Land“ wäre im Zusammenhang des Psalms zu örtlich begrenzt.
- source_word: יִשְׁתַּחֲווּ
  choice: wird sich vor dir niederwerfen
  rationale: Die konkrete Körperhaltung des Sich-Niederwerfens bleibt erhalten und lässt zugleich den im Kontext gegebenen Sinn der Anbetung erkennen.
- source_word: לְךָ
  choice: vor dir / dir
  rationale: Beim Niederwerfen ist „vor dir“ im Deutschen idiomatisch; beim Lobsingen gibt „dir“ die Ausrichtung auf den Angeredeten natürlich wieder.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: lobsingen
  rationale: Das Verb bezeichnet hier gesungenes Gotteslob. Die Wiederholung des hebräischen Verbs wird im Deutschen ebenfalls bewahrt.
- source_word: שִׁמְךָ
  choice: deinem Namen
  rationale: „Name“ bewahrt den biblisch gewichtigen Ausdruck und sollte nicht auf „Ruhm“ oder „Ansehen“ verengt werden.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Funktion und genaue Bedeutung des Ausdrucks unsicher sind, wird er als überlieferter Fachausdruck beibehalten.
theological_decisions:
- issue: Ob יִשְׁתַּחֲווּ abstrakt als „anbeten“ oder konkret als körperliche Handlung wiederzugeben ist
  choice: sich vor dir niederwerfen
  alternative: dich anbeten
  rationale: Die konkrete Wiedergabe bewahrt das Bild körperlicher Unterwerfung und schließt dessen kultischen Sinn nicht aus, ohne ihn durch einen abstrakteren Begriff vollständig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lobsingen“ ist leicht gehoben, aber verständlich und bildet die wiederholte musikalische Lobhandlung knapp ab. Der Singular „sie wird“ nimmt „die ganze Erde“ grammatisch auf.
