source:
  edition: WLC
  text: אֲלַמְּדָ֣ה פֹשְׁעִ֣ים דְּרָכֶ֑י/ךָ וְ֝/חַטָּאִ֗ים אֵלֶ֥י/ךָ יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: de
  text: Ich will die Übertreter deine Wege lehren, und Sünder werden zu dir umkehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden sich dir zuwenden“ oder „werden zu dir zurückkehren“. Das hebräische Verb kann sowohl Umkehr als auch Rückkehr ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: Ich will … lehren
  rationale: Der Hifil-Imperfekt/Kohortativ der 1. Person Singular drückt hier, im Anschluss an die erbetene Wiederherstellung, Absicht oder Entschlossenheit aus. „Ich will“ gibt diesen volitiven Sinn im Deutschen natürlich wieder.
- source_word: פֹשְׁעִים
  choice: die Übertreter
  rationale: Das Wort bezeichnet Menschen, die sich durch bewusste Übertretung oder Auflehnung vergehen. „Übertreter“ bewahrt den moralischen und bundestheologischen Klang und passt zum Parallelwort „Sünder“.
- source_word: דְּרָכֶיךָ
  choice: deine Wege
  rationale: Der Plural von דרך bezeichnet hier Gottes Wege, also sein Handeln und seine Weisungen. Die Bildsprache wird ohne erklärende Erweiterung bewahrt.
- source_word: חַטָּאִים
  choice: Sünder
  rationale: Die knappe, geläufige Wiedergabe erhält die moralische Bezeichnung und den Parallelismus mit „Übertreter“.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition bezeichnet die Richtung auf Gott hin. „Zu dir“ lässt dem Verb שוב seinen eigenen Bedeutungsumfang und vermeidet eine unnötige Verdoppelung.
- source_word: יָשׁוּבוּ
  choice: werden … umkehren
  rationale: שוב kann sowohl „umkehren/sich hinwenden“ als auch „zurückkehren“ bedeuten. „Umkehren“ ist in diesem Bußpsalm natürlich und bewahrt sowohl die Richtungsänderung als auch den möglichen Gedanken der Rückkehr; die Alternative wird in der Fußnote offengehalten.
theological_decisions:
- issue: Buß- und Rückkehrsprache in שוב
  choice: werden zu dir umkehren
  alternative: werden sich dir zuwenden; werden zu dir zurückkehren
  rationale: Der hebräische Ausdruck kann eine Hinwendung oder eine Rückkehr bezeichnen. Die Hauptfassung wahrt die Bußsprache, ohne eine bestimmte Lehre von Bekehrung festzulegen; die Fußnote erhält die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus und die traditionelle biblische Metaphorik „deine Wege“ bleiben erhalten; der Satzbau ist zugleich klar und für heutige Leser verständlich.
