  text: when Nathan the prophet came to him[a], after he had gone in to Bathsheba.
translation:
  language: de
  text: als der Prophet Nathan zu ihm kam, nachdem er zu Batseba hineingegangen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „zu Batseba hineingehen“ ist ein verhüllender Ausdruck für Geschlechtsverkehr.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: als … kam
  rationale: Die Präposition ב mit dem Infinitivus constructus von בוא leitet hier einen temporalen Nebensatz ein; „als … kam“ ist im Deutschen natürlich und präzise.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Gibt אֶל mit dem Suffix der 3. Person Singular maskulin in seiner gerichteten Bedeutung unmittelbar wieder.
- source_word: נָתָן
  choice: Nathan
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Bewahrt den bestimmten Artikel und Nathans Amtsbezeichnung.
- source_word: כַּאֲשֶׁר
  choice: nachdem
  rationale: Im Zusammenhang bezeichnet die Konjunktion das vorausgegangene Geschehen, das Nathans Besuch veranlasste.
- source_word: בָּא אֶל
  choice: zu … hineingegangen war
  rationale: Die relativ formnahe Wiedergabe erhält das hebräische Bild; in Verbindung mit einer Frau ist die Wendung ein verhüllender Ausdruck für Geschlechtsverkehr. Eine Fußnote erklärt dies, ohne die Bildsprache im Haupttext aufzulösen.
- source_word: בַּת שָׁבַע
  choice: Batseba
  rationale: Die im modernen deutschen Bibelgebrauch übliche Namensform.
