id: PSA.51.19
reference: Psalms 51:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: de
  text: Tu Zion Gutes nach deinem Wohlgefallen[a]; baue die Mauern Jerusalems auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deiner Gunst“ oder „nach deinem Willen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „baue“; im Sinn einer Wiederherstellung auch: „baue … wieder auf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: Tu … Gutes
  rationale: Der Hifil-Imperativ von יטב bittet Gott um wohltuendes Handeln. Die Wendung ist im Deutschen direkt, gebetsgemäß und weniger interpretierend als etwa „lass gedeihen“.
- source_word: בִרְצוֹנְךָ
  choice: nach deinem Wohlgefallen
  rationale: רָצוֹן kann Wohlgefallen, Gunst oder Willen bezeichnen. „Nach deinem Wohlgefallen“ bewahrt sowohl den Gedanken göttlicher Zuwendung als auch den seines Willens.
- source_word: אֶת צִיּוֹן
  choice: Zion
  rationale: אֶת kennzeichnet Zion als direktes Objekt des erbetenen wohltuenden Handelns; die deutsche Konstruktion „jemandem Gutes tun“ verlangt hier den Dativ.
- source_word: תִּבְנֶה
  choice: baue … auf
  rationale: Das Qal-Imperfekt steht nach dem Imperativ als Bitte beziehungsweise Wunsch. „Aufbauen“ kann sowohl Errichtung als auch Wiederherstellung ausdrücken, ohne sich eindeutig auf einen historischen Wiederaufbau festzulegen.
- source_word: חוֹמוֹת
  choice: Mauern
  rationale: Das konkrete Pluralnomen bezeichnet die Stadtmauern; „Befestigungen“ wäre weiter gefasst.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
theological_decisions:
- issue: Verhältnis von göttlichem Wohlgefallen und Wiederherstellung
  choice: Der Vers wird als Bitte wiedergegeben, dass Gottes Wohlgefallen in konkretem Gut für Zion und im Aufbau Jerusalems sichtbar wird.
  alternative: „Nach deinem Willen tu Zion Gutes“, mit stärker rein volitionalem Sinn.
  rationale: Das hebräische רָצוֹן umfasst sowohl Gunst beziehungsweise Wohlgefallen als auch Willen. Die Übersetzung bewahrt diese Spannung, ohne sie auf eine einzige Bedeutung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Gebetssprache. „Tu Zion Gutes“ ist idiomatisch und quellentreu; „Wohlgefallen“ ist leicht gehoben, aber im religiösen Kontext verständlich und erhält die Bedeutungsbreite von רָצוֹן.
