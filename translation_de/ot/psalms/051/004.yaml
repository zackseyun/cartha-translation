base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: de
  text: Denn meine Vergehen kenne ich, und meine Sünde steht mir immer vor Augen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Bitte im Zusammenhang ein und wahrt den erklärenden Charakter natürlich im Deutschen.
- source_word: פְשָׁעַי
  choice: meine Vergehen
  rationale: Gibt die pluralische Bezeichnung für schuldhafte Übertretungen beziehungsweise Auflehnung gewichtig, aber in heutigem Standarddeutsch wieder.
- source_word: אֲנִי אֵדָע
  choice: kenne ich
  rationale: ידע bezeichnet hier das persönliche Wissen und bewusste Erkennen der eigenen Schuld. Die nachgestellte Formulierung bewahrt etwas von der Betonung des ausdrücklichen Pronomens.
- source_word: וְחַטָּאתִי
  choice: und meine Sünde
  rationale: Im Bekenntniszusammenhang bezeichnet חטאת eindeutig Sünde, nicht ein Sündopfer. Der Singular bleibt erhalten.
- source_word: נֶגְדִּי תָמִיד
  choice: steht mir immer vor Augen
  rationale: Die deutsche Wendung bewahrt das Bild von etwas, das beständig vor dem Sprecher gegenwärtig ist, und klingt natürlicher als eine rein räumliche Wiedergabe.
theological_decisions:
- issue: Verhältnis von פְשָׁעַי („Vergehen“) und חַטָּאתִי („Sünde“)
  choice: Beide Begriffe werden im Deutschen unterschieden wiedergegeben.
  alternative: Beide mit demselben Wort wie „Sünden“ wiedergeben.
  rationale: Der hebräische Text verwendet zwei verwandte, aber unterschiedliche Schuldbegriffe. Ihre Unterscheidung erhält die sprachliche und theologische Dichte des Bekenntnisses.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Steht mir immer vor Augen“ ist idiomatisch und erhält zugleich die Bildlichkeit des hebräischen נֶגְדִּי.
