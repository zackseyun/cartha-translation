source:
  edition: WLC
  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: de
  text: Rette mich von Blutschuld[a], Gott, du Gott meines Heils; dann wird meine Zunge jubelnd von deiner Gerechtigkeit[b] singen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Blutvergießen“ beziehungsweise „von der Schuld an vergossenem Blut“. Wörtlich steht im Hebräischen etwa „von Bluten“; der Plural bezeichnet häufig Blutschuld.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von deinem gerechten Handeln“. Das hebräische Wort kann sowohl Gerechtigkeit als auch richterliche und rettende Gerechtigkeit bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Der Imperativ von נצל mit Suffix der 1. Person Singular bezeichnet die Bitte um Befreiung oder Rettung. „Rette mich“ ist im heutigen Deutsch natürlich und unmittelbar.
- source_word: מִדָּמִים
  choice: von Blutschuld
  rationale: Der Plural דמים bedeutet idiomatisch häufig Blutvergießen oder die daraus erwachsende Schuld. Im Bußzusammenhang gibt „Blutschuld“ die persönliche Verantwortlichkeit prägnant wieder, ohne die lexikalische Alternative „Blutvergießen“ auszuschließen.
- source_word: אֱלֹהִים אֱלֹהֵי תְּשׁוּעָתִי
  choice: Gott, du Gott meines Heils
  rationale: Die Anrede wird beibehalten, und die hebräische Genitivverbindung wird in würdigem, vertrautem Bibeldeutsch wiedergegeben. Das eingefügte „du“ macht die Apposition im Deutschen klar.
- source_word: תְּרַנֵּן
  choice: wird … jubelnd … singen
  rationale: Das Verb bezeichnet lauten, freudigen Gesang oder Jubel. Die futurische Ergebnisfolge nach der Bitte wird durch „dann wird“ verdeutlicht.
- source_word: לְשׁוֹנִי
  choice: meine Zunge
  rationale: Das konkrete poetische Bild der Zunge als Organ des Lobpreises bleibt erhalten.
- source_word: צִדְקָתֶךָ
  choice: deiner Gerechtigkeit
  rationale: צדקה umfasst Gottes Richtigkeit, Gerechtigkeit und gerechtes Handeln. „Gerechtigkeit“ wahrt diese Breite besser als eine ausdrücklich soteriologische Auslegung.
theological_decisions:
- issue: Bedeutung des hebräischen Plurals דמים im Bußgebet
  choice: Blutschuld
  alternative: Blutvergießen; vergossenes Blut
  rationale: Der Zusammenhang legt Schuld wegen vergossenen Blutes nahe. Da der Ausdruck jedoch auch das Blutvergießen selbst bezeichnen kann, wird diese echte Mehrdeutigkeit in der Fußnote bewahrt.
- issue: Bedeutungsumfang von צִדְקָתֶךָ
  choice: deiner Gerechtigkeit
  alternative: deinem gerechten Handeln; deiner rettenden Gerechtigkeit
  rationale: Der hebräische Begriff kann moralische, richterliche und rettende Aspekte verbinden. Der Haupttext belässt die theologische Spannung bei dem umfassenden Begriff „Gerechtigkeit“, statt ausschließlich Gericht oder Rettung festzulegen.
- issue: Beziehung zwischen Bitte und anschließendem Lob
  choice: dann wird meine Zunge … singen
  alternative: und meine Zunge soll … singen
  rationale: Die Verbform lässt sich im Zusammenhang als erwartete Folge der erbetenen Rettung verstehen. „Dann wird“ gibt diese resultative Beziehung natürlich wieder, ohne das Lob als Gegenleistung erscheinen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Bildsprache. „Blutschuld“ ist präzise und im religiös-literarischen Register verständlich; die möglichen Bedeutungen werden in den Fußnoten offengehalten. Die Semikolon-Struktur wahrt den poetischen Zusammenhang von Rettungsbitte und Lob.
