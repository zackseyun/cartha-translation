source:
  edition: WLC
  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: de
  text: Verwirf mich nicht aus deiner Gegenwart, und nimm deinen heiligen Geist[a] nicht von mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »den Geist deiner Heiligkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: Verwirf mich
  rationale: Das Hifil von שלך bezeichnet hier ein Wegwerfen beziehungsweise Verstoßen. „Verwirf mich nicht“ gibt die eindringliche Bitte knapp, idiomatisch und mit angemessener Gebetssprache wieder.
- source_word: מִלְּפָנֶיךָ
  choice: aus deiner Gegenwart
  rationale: Wörtlich steht eine Wendung mit „Angesicht“. Im Deutschen drückt „aus deiner Gegenwart“ den idiomatischen räumlich-relationalen Sinn natürlich aus.
- source_word: רוּחַ קָדְשְׁךָ
  choice: deinen heiligen Geist
  rationale: Die Konstruktverbindung bedeutet wörtlich „den Geist deiner Heiligkeit“ und kann idiomatisch als „deinen heiligen Geist“ wiedergegeben werden. Die Kleinschreibung von „heiligen“ bewahrt im Deutschen die grammatische Form und lässt die genaue theologische Einordnung offen.
- source_word: תִּקַּח
  choice: nimm
  rationale: לקח bedeutet grundlegend „nehmen“. „Nimm ... nicht von mir“ erhält die Direktheit und den Parallelismus der hebräischen Bitte.
- source_word: מִמֶּנִּי
  choice: von mir
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Präpositionalverbindung.
theological_decisions:
- issue: Deutung und Schreibung von רוּחַ קָדְשְׁךָ
  choice: deinen heiligen Geist
  alternative: den Geist deiner Heiligkeit
  rationale: Die Wendung bezeichnet Gottes eigenen Geist, legt aber in ihrer hebräischen Form keine spätere terminologische Ausgestaltung ausdrücklich fest. Die Hauptübersetzung ist natürlich; die wörtlichere Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Gebetssprache. Der Parallelismus der beiden mit אַל eingeleiteten Bitten bleibt erhalten; „Gegenwart“ vermeidet die im Deutschen unnatürliche wörtliche Form „von deinem Angesicht“.
