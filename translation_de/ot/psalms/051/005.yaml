base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: de
  text: Gegen dich – dich allein – habe ich gesündigt[a] und getan, was böse ist in deinen Augen, damit du im Recht bist, wenn du redest, und rein dastehst, wenn du richtest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »An dir allein habe ich gesündigt.« Der hebräische Wortlaut hebt Gott als den letztlich Betroffenen hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »damit du in deinem Reden im Recht bist und in deinem Urteil rein dastehst.«'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: Gegen dich – dich allein –
  rationale: Die Präposition לְ bezeichnet hier im Zusammenhang des Sündenbekenntnisses den Betroffenen. Die Wiederholung mit »allein« wird zur Wahrung des hebräischen Nachdrucks durch Gedankenstriche hervorgehoben.
- source_word: חָטָאתִי
  choice: habe ich gesündigt
  rationale: Das hebräische Perfekt bezeichnet die eingestandene Tat; das deutsche Perfekt klingt in einem gegenwärtigen Bekenntnis natürlich.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: und getan, was böse ist in deinen Augen
  rationale: Das substantivierte Adjektiv הָרַע wird natürlich mit »was böse ist« wiedergegeben. »In deinen Augen« bewahrt das hebräische Bild für Gottes Beurteilung.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion kann Zweck oder Folge ausdrücken. »Damit« erhält diesen Zusammenhang, ohne die Spannung des Satzes erklärend aufzulösen.
- source_word: תִּצְדַּק בְּדָבְרֶךָ
  choice: du mit deinem Wort im Recht bist
  rationale: צדק bezeichnet hier, im Recht zu sein beziehungsweise als recht erwiesen zu werden. »Mit deinem Wort« bewahrt den Singular דָּבָר und gibt die forensische Aussage in verständlichem Deutsch wieder.
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: als rein dastehst, wenn du richtest
  rationale: זכה kann »rein sein«, »schuldlos sein« oder »Recht behalten« bedeuten. Die Form שָׁפְטֶךָ wird gemäß der masoretischen Vokalisierung temporal als »wenn du richtest« verstanden; »rein dastehst« erhält den gerichtlichen und moralischen Sinn.
theological_decisions:
- issue: Davids Aussage »gegen dich – dich allein« trotz menschlicher Opfer seiner Sünde
  choice: Die uneingeschränkte, auf Gott gerichtete Formulierung bleibt stehen.
  alternative: »Vor allem gegen dich« oder »insbesondere gegen dich«
  rationale: Der hebräische Wortlaut setzt einen starken absoluten Akzent. Eine abschwächende Erklärung würde die theologische Spannung des Bekenntnisses im Übersetzungstext auflösen.
- issue: Zweck- oder Folgebeziehung von לְמַעַן
  choice: »damit«
  alternative: »sodass« oder »daher«
  rationale: »Damit« bildet die hebräische Verknüpfung formal ab, ohne zu behaupten, David habe mit der Absicht gesündigt, Gottes Recht zu erweisen. Die Spannung bleibt erhalten.
- issue: Forensische Aussage über Gottes Reden und Richten
  choice: »im Recht bist« und »als rein dastehst«
  alternative: »gerechtfertigt wirst« und »schuldlos bist«
  rationale: Die gewählte Fassung erhält den gerichtlichen Sinn, vermeidet aber im Deutschen mögliche dogmatische Nebenbedeutungen von »gerechtfertigt«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche geben den starken Nachdruck von לְךָ לְבַדְּךָ wieder. Die Bildsprache »in deinen Augen« bleibt erhalten; die Schlusszeile verwendet verständliche Rechtssprache, ohne die Mehrdeutigkeit unnötig dogmatisch festzulegen.
