  text: חָנֵּ֣/נִי אֱלֹהִ֣ים כְּ/חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ מְחֵ֣ה פְשָׁעָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: de
  text: Sei mir gnädig, Gott, nach deiner beständigen Liebe; nach der Fülle deines Erbarmens tilge meine Vergehen aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sei mir gnädig
  rationale: Der Imperativ von חנן mit Suffix der 1. Person Singular bittet um Gunst und Gnade. Die Wiedergabe unterscheidet den Ausdruck bewusst von רחמים im zweiten Halbvers.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Direkte Anrede Gottes; die natürliche standarddeutsche Entsprechung ist „Gott“.
- source_word: כְּחַסְדֶּךָ
  choice: nach deiner beständigen Liebe
  rationale: חסד bezeichnet verlässliche, loyale Güte und Liebe. „Beständige Liebe“ ist verständlich und bringt ihre dauerhafte Verlässlichkeit zum Ausdruck; „nach“ gibt den Maßstab der Präposition כְּ wieder.
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: nach der Fülle deines Erbarmens
  rationale: רֹב bezeichnet Fülle, Größe oder Vielzahl; der Plural רַחֲמִים drückt tiefes, vielfältiges Erbarmen aus. Die deutsche Kollektivformulierung ist natürlich und wahrt den Gedanken der Fülle.
- source_word: מְחֵה
  choice: tilge … aus
  rationale: מחה bedeutet abwischen, auslöschen oder tilgen. „Austilgen“ bewahrt im Bußkontext das Bild vollständiger Beseitigung.
- source_word: פְשָׁעַי
  choice: meine Vergehen
  rationale: פשע bezeichnet Auflehnung, Übertretung oder schuldhaftes Vergehen. „Vergehen“ ist gegenwärtiges, verständliches Deutsch und behält den moralisch-rechtlichen Ernst bei.
theological_decisions:
- issue: Wiedergabe der verwandten Begriffe חנן, חסד und רחמים
  choice: 'Unterschiedliche deutsche Ausdrücke: „Sei mir gnädig“, „beständige Liebe“ und „Erbarmen“.'
  alternative: Alle drei Begriffe mit Varianten von „Barmherzigkeit“ wiedergeben.
  rationale: Der hebräische Text verbindet verwandte, aber nicht identische Aussagen über Gottes Gnade, loyale Liebe und tiefes Erbarmen. Die Differenzierung bewahrt die poetische und theologische Vielschichtigkeit.
- issue: Zahlform von רַחֲמֶיךָ
  choice: Kollektivischer Singular „deines Erbarmens“ zusammen mit „Fülle“.
  alternative: Formaler Plural „deiner Erbarmungen“ oder traditionell „deiner Barmherzigkeit“.
  rationale: Das Hebräische hat eine morphologische Pluralform, doch „Erbarmungen“ wirkt im heutigen Standarddeutsch unnatürlich. „Fülle deines Erbarmens“ gibt die semantische Vielheit idiomatisch wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität der beiden mit „nach“ eingeleiteten Maßangaben bleibt erhalten; verwandte Gnadenbegriffe werden nicht eingeebnet.
