lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: Gottes Opfer
  rationale: Die hebräische Genitivverbindung wird knapp und formal bewahrt. Im Zusammenhang sind damit die Opfer gemeint, die Gott gelten beziehungsweise die er annimmt, ohne diese Deutung in den Haupttext einzutragen.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: ein zerbrochener Geist
  rationale: רוּחַ bedeutet hier »Geist«; das Partizip von שׁבר bezeichnet etwas Zerbrochenes. Die konkrete Metapher bleibt erhalten.
- source_word: לֵב נִשְׁבָּר
  choice: ein zerbrochenes Herz
  rationale: Die direkte Wiedergabe wahrt die Wiederholung von »zerbrochen« und damit die innere Parallelität des hebräischen Verses.
- source_word: וְנִדְכֶּה
  choice: und zerschlagenes
  rationale: Das Partizip von דכה bezeichnet etwas Niedergedrücktes oder Zerschlagenes. »Zerschlagen« erhält das kräftige Bild und passt idiomatisch zu »Herz«.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Standardwiedergabe sowohl in der Genitivverbindung als auch in der direkten Anrede.
- source_word: לֹא תִבְזֶה
  choice: wirst du nicht verachten
  rationale: בזה bedeutet »verachten, geringschätzen«. Das Futur gibt die hebräische Verbform im Gebetszusammenhang angemessen wieder.
theological_decisions:
- issue: Bildhafte Opfersprache im Bußzusammenhang
  choice: Der innere Zustand eines zerbrochenen Geistes und Herzens wird als Gottes Opfer bezeichnet.
  alternative: Der Vers schaffe äußere Opfer grundsätzlich ab oder bezeichne lediglich seelisches Leid ohne Bezug zur Umkehr.
  rationale: Die Übersetzung bewahrt die Gleichsetzung im hebräischen Text, ohne daraus eine weitergehende Lehraussage über das gesamte Opfersystem abzuleiten oder die Bilder ausdrücklich als Reue auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bilder »zerbrochen« und »zerschlagen« sowie die direkte Anrede »Gott« bleiben erhalten. Das etwas markante »Gottes Opfer« bewahrt die Mehrdeutigkeit der hebräischen Genitivverbindung.
