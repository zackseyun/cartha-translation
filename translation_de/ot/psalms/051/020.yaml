  text: אָ֤ז תַּחְפֹּ֣ץ זִבְחֵי צֶ֭דֶק עוֹלָ֣ה וְ/כָלִ֑יל אָ֤ז יַעֲל֖וּ עַל מִזְבַּחֲ/ךָ֣ פָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: de
  text: Dann wirst du Gefallen haben an gerechten Schlachtopfern[a], an Brandopfern und Ganzopfern[b]; dann wird man Stiere auf deinem Altar darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Opfern der Gerechtigkeit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, als eng verbundene Wendung: »an einem vollständig verbrannten Brandopfer«. Das Hebräische nennt hier »Brandopfer« und »Ganzopfer« nebeneinander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: du wirst Gefallen haben an
  rationale: חפץ bezeichnet hier Wohlgefallen bzw. Freude an etwas; die Wendung ist im Deutschen natürlich und würdig.
- source_word: זִבְחֵי צֶדֶק
  choice: gerechte Schlachtopfer
  rationale: Die Wiedergabe bewahrt sowohl den kultischen Sinn von זֶבַח als auch die moralisch-bundeshafte Bedeutung von צֶדֶק; die mögliche Genitivlesart wird in der Fußnote genannt.
- source_word: עוֹלָה
  choice: Brandopfer
  rationale: Dies ist die etablierte deutsche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: וְכָלִיל
  choice: Ganzopfer
  rationale: כָּלִיל betont die vollständige Hingabe bzw. Verbrennung. Die eigenständige Wiedergabe wahrt die formale Unterscheidung von עוֹלָה, ohne ihr Verhältnis zueinander festzulegen.
- source_word: יַעֲלוּ
  choice: wird man … darbringen
  rationale: Der Hifil von עלה bezeichnet im Opferkontext das Hinaufbringen bzw. Darbringen auf dem Altar. Das unbestimmte deutsche Subjekt gibt die nicht ausdrücklich genannte handelnde Person angemessen wieder.
- source_word: מִזְבַּחֲךָ
  choice: deinem Altar
  rationale: Direkte und übliche Wiedergabe des Altars Gottes in der Anrede.
- source_word: פָרִים
  choice: Stiere
  rationale: פָּרִים bezeichnet hier als Opfertiere bestimmte männliche Rinder.
- source_word: אָז ... אָז
  choice: Dann … dann
  rationale: Die Wiederholung bewahrt die hebräische Abfolge und Folgerungsstruktur.
theological_decisions:
- issue: Annehmbare Opfer nach der Betonung eines zerbrochenen und zerschlagenen Herzens in den vorausgehenden Versen
  choice: Die konkrete Opfersprache bleibt uneingeschränkt stehen und beschreibt wiederhergestellten, Gott wohlgefälligen Opferdienst.
  alternative: Die Opfer ausschließlich als Bild für innere Frömmigkeit zu deuten oder den Vers ausdrücklich als spätere kultische Ergänzung zu kennzeichnen.
  rationale: Der Text selbst löst die Spannung zwischen innerer Umkehr und äußerem Opfer nicht durch eine Vergeistigung oder redaktionsgeschichtliche Aussage auf. Die Übersetzung bewahrt diese Spannung.
- issue: Verhältnis von עוֹלָה und כָלִיל
  choice: Brandopfer und Ganzopfer
  alternative: ein vollständig verbranntes Brandopfer
  rationale: Die hebräische Koordination kann als zwei Bezeichnungen, als Apposition oder als eng verbundene Verstärkung verstanden werden. Die Übersetzung folgt zunächst der formalen Koordination; eine Fußnote weist auf die alternative Zusammenfassung hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schlachtopfer«, »Brandopfer«, »Ganzopfer« und »Altar« bewahren die konkrete kultische Terminologie; der zweimalige Einsatz von »dann« bildet die hebräische Struktur ab.
