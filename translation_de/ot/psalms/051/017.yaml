  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: de
  text: Denn du hast an einem Schlachtopfer keinen Gefallen – sonst würde ich es darbringen; ein Brandopfer nimmst du nicht wohlgefällig an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn du hast an einem Schlachtopfer keinen Gefallen; sonst würde ich es darbringen.“ Das Hebräische lässt eine etwas formellere Satzverknüpfung zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und wird im argumentativen Zusammenhang des Psalms natürlich mit „Denn“ wiedergegeben.
- source_word: לֹא תַחְפֹּץ
  choice: hast du kein Gefallen
  rationale: חפץ bezeichnet hier nicht bloß ein Wollen, sondern Wohlgefallen oder Freude; die Wendung ist im Deutschen natürlich und bewahrt diese affektive Nuance.
- source_word: זֶבַח
  choice: Schlachtopfer
  rationale: Der kultische Fachbegriff bezeichnet ein geschlachtetes Opfer und bleibt so vom anschließend genannten Brandopfer unterscheidbar.
- source_word: וְאֶתֵּנָה
  choice: sonst würde ich es darbringen
  rationale: 'Das ו wird im Zusammenhang folgernd beziehungsweise kontrastiv verstanden: Wenn Gott daran Gefallen hätte, würde der Beter das Opfer darbringen. Das im Hebräischen unausgesprochene Objekt wird zur Klarheit aufgenommen.'
- source_word: עוֹלָה
  choice: Brandopfer
  rationale: Dies ist die geläufige und sachlich genaue deutsche Bezeichnung für das vollständig verbrannte Opfer.
- source_word: לֹא תִרְצֶה
  choice: hast du keine Freude
  rationale: רצה bezeichnet hier Gottes wohlgefällige Annahme. „Keine Freude haben“ wahrt die Nähe zum Parallelismus, ohne beide hebräischen Verben völlig gleich wiederzugeben.
theological_decisions:
- issue: Bedeutung der Aussage über Opfer
  choice: Der Vers sagt unmittelbar, dass Gott in der beschriebenen Situation nicht am Opfer als solchem Gefallen hat.
  alternative: Eine uneingeschränkte Verwerfung jedes Opfergottesdienstes.
  rationale: Die Übersetzung verstärkt die Aussage weder zu einer Abschaffung des gesamten Opfersystems noch schwächt sie sie ab. So bleibt die Spannung zum weiteren biblischen und psalmischen Zusammenhang erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch präzisen, aber verständlichen Begriffen. Der poetische Parallelismus zwischen Schlachtopfer und Brandopfer bleibt erhalten.
