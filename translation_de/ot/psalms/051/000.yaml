lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Das Wort bezeichnet in Psalmüberschriften herkömmlich den musikalischen Leiter. „Chorleiter“ ist knapp und verständlich; die Präposition ל wird hier natürlich mit „für“ wiedergegeben, wobei auch „dem Chorleiter“ möglich ist.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung für einen Psalm, wahrscheinlich mit musikalischem Vortrag verbunden. „Psalm“ ist im Deutschen die etablierte und sachlich passende Wiedergabe.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die deutsche Genitivform bewahrt wie die hebräische Verbindung mit לְ eine gewisse Offenheit zwischen Verfasserschaft, Zugehörigkeit und Zuordnung, ohne ausschließlich „von David verfasst“ festzulegen.
theological_decisions:
- issue: Deutung der davidischen Überschrift
  choice: Davids
  alternative: von David; für David
  rationale: Die hebräische Form bestimmt die genaue Beziehung des Psalms zu David nicht eindeutig. Der Genitiv ist traditionell, natürlich und lässt Verfasserschaft ebenso zu wie eine allgemeinere Zuordnung.
translation_notes:
  register: Moderne, würdige und knappe Sprache einer Psalmüberschrift. „Chorleiter“ ist allgemein verständlich; „Ein Psalm Davids“ entspricht natürlichem Standarddeutsch und erhält die Mehrdeutigkeit der hebräischen Zuordnung.
