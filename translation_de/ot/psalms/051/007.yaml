source:
  edition: WLC
  text: הֵן אֱ֭מֶת חָפַ֣צְתָּ בַ/טֻּח֑וֹת וּ֝/בְ/סָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: de
  text: Siehe[a], an Wahrheit im Innersten[b] hast du Gefallen, und im Verborgenen lässt du mich Weisheit erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewiss“ oder „Ja“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Inneren“. Die hebräischen Ausdrücke für das Innere und Verborgene sind poetisch und in ihrer genauen Bildlichkeit nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Bewahrt den nachdrücklichen, aufmerksamkeitslenkenden Charakter der hebräischen Partikel und passt zum poetischen Stil des Psalms.
- source_word: אֱמֶת
  choice: Wahrheit
  rationale: Bezeichnet hier Wahrheit, Wahrhaftigkeit und innere Echtheit; „Wahrheit“ erhält die Bedeutungsbreite, ohne sie auf Bundestreue oder Aufrichtigkeit allein einzuengen.
- source_word: חָפַצְתָּ
  choice: hast du Gefallen
  rationale: Gibt das Verlangen beziehungsweise Wohlgefallen Gottes idiomatisch wieder und bewahrt die emotionale Nuance des Verbs.
- source_word: בַטֻּחוֹת
  choice: im Innersten
  rationale: Das seltene poetische Wort bezeichnet die inneren oder verborgenen Bereiche des Menschen. „Im Innersten“ ist im Deutschen natürlich und erhält das Bild der inneren Person.
- source_word: וּבְסָתֻם
  choice: im Verborgenen
  rationale: Bewahrt die räumliche Bildsprache des Verborgenen und den Parallelismus mit „im Innersten“, ohne den Ausdruck auf ein bloßes „heimlich“ zu reduzieren.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die direkte und kontextgerechte Wiedergabe für moralische und geistliche Einsicht.
- source_word: תוֹדִיעֵנִי
  choice: lässt du mich … erkennen
  rationale: Gibt die Kausativform von ידע („wissen/erkennen lassen“) genauer wieder als das stärker glättende „du lehrst mich“ und bleibt zugleich natürliches Deutsch.
theological_decisions:
- issue: Die von Gott gewünschte innere Wahrheit und die Vermittlung von Weisheit
  choice: Der Vers beschreibt Gottes Gefallen an Wahrheit im Inneren des Menschen und sein Erschließen von Weisheit im Verborgenen.
  alternative: „Wahrheit“ spezifisch als Bundestreue oder den Vers vorwiegend als psychologische Selbsterkenntnis deuten.
  rationale: Der hebräische Parallelismus verbindet innere Wahrheit mit von Gott erschlossener Weisheit. Die Übersetzung wahrt diese moralisch-geistliche Aussage, ohne sie in ein späteres Lehrsystem einzuordnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. „Im Innersten“ und „im Verborgenen“ bewahren den hebräischen Parallelismus; „lässt du mich Weisheit erkennen“ erhält die kausative Aussage, ohne unnötig wörtlich zu klingen.
