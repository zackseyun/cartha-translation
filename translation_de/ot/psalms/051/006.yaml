  text: Siehe[a], in Schuld wurde ich geboren[b], und in Sünde hat mich meine Mutter empfangen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Gewiss“ oder „Ja“.'
