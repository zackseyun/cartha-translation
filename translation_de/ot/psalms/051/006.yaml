    reason: lexical_alternative
  - marker: c
    text: 'Der Vers wird unterschiedlich verstanden: als Bekenntnis einer Sündhaftigkeit von der Empfängnis an, als Hinweis auf Sünde im Zusammenhang mit der Empfängnis oder als zugespitzte poetische Sprache der Buße. Der hebräische Wortlaut entscheidet diese Frage nicht vollständig.'
