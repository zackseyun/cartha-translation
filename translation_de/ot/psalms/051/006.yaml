lexical_decisions:
- source_word: הֵן
  choice: Ja
  rationale: Die Partikel leitet eine nachdrückliche Feststellung ein. „Ja“ gibt diesen bekräftigenden Ton in natürlichem, würdevollem Deutsch wieder; mögliche Alternativen werden in der Fußnote genannt.
- source_word: בְּעָוֹן
  choice: in Schuld
  rationale: עָוֹן kann sowohl sittliche Verkehrtheit als auch daraus erwachsende Schuld bezeichnen. „In Schuld“ bewahrt die Präposition und lässt die genaue Gewichtung offen.
- source_word: חוֹלָלְתִּי
  choice: wurde ich geboren
  rationale: Die passive Verbform bezeichnet hier im Zusammenhang mit Empfängnis das Hervorgebrachtwerden bei der Geburt. „Wurde ich geboren“ ist im heutigen Deutsch natürlich und hält am Geburtsbild fest.
- source_word: וּבְחֵטְא
  choice: und in Sünde
  rationale: Die direkte Wiedergabe erhält die Präposition und den poetischen Parallelismus zu „in Schuld“, ohne die Aussage dogmatisch auszuweiten.
- source_word: יֶחֱמַתְנִי
  choice: empfing mich
  rationale: Das Verb wird hier am besten auf die Empfängnis bezogen. Die Formulierung ist knapp, würdevoll und entspricht dem Parallelismus von Empfängnis und Geburt.
- source_word: אִמִּי
  choice: meine Mutter
  rationale: Direkte und eindeutige Wiedergabe des Nomens mit Possessivsuffix.
theological_decisions:
- issue: Ob der Vers die persönliche Sünde der Mutter, die Sündhaftigkeit des Psalmisten von der Empfängnis an oder eine poetische Übertreibung im Bußgebet meint
  choice: Die Beziehung von Empfängnis und Geburt zu Schuld und Sünde wird unmittelbar wiedergegeben, ohne ihren dogmatischen Mechanismus festzulegen.
  alternative: Man könnte den Vers ausdrücklich auf Erbsünde, auf eine sündige Zeugungshandlung oder ausschließlich auf poetische Übertreibung beziehen.
  rationale: Der hebräische Text verbindet die gesamte Existenz des Sprechers seit Empfängnis und Geburt mit Schuld und Sünde, erklärt aber nicht ausdrücklich, wie diese Beziehung theologisch zu bestimmen ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Ja“ vermeidet unnötig altertümlichen Ton, während „in Schuld“ und „in Sünde“ die formale und theologische Spannung des Hebräischen bewahren.
