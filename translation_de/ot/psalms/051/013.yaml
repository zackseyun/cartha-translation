  terminology: „Heil“ entspricht der weiten Bedeutung von יֵשַׁע, ohne diese auf eine bestimmte Art von Rettung zu verengen. „Williger Geist“ ist eine sachgerechte Hauptwiedergabe von נְדִיבָה; die Alternativen „freigebiger“ und „edler“ sind korrekt in den Fußnoten dokumentiert. Die Fußnote zu „Rettung“ und die Alternative „halte mich aufrecht“ erfassen die relevanten lexikalischen Spielräume.
