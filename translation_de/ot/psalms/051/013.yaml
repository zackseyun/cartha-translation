  source_fidelity: 'Die Übersetzung gibt die beiden Bitten des Hebräischen präzise wieder: Der Hifil-Imperativ הָשִׁיבָה ist mit „Gib … zurück“ angemessen erfasst, לִי mit „mir“, und die Konstruktverbindung שְׂשׂוֹן יִשְׁעֶךָ mit „die Freude über dein Heil“. „Ein williger Geist stütze mich“ bewahrt sowohl die modale, bittende Nuance von תִּסְמְכֵנִי als auch die im Hebräischen nicht weiter aufgelöste Referenz von רוּחַ.'
