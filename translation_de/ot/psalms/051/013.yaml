  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: de
  text: Gib mir die Freude über dein Heil[c] zurück, und ein williger Geist[a] stütze mich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein freigebiger Geist« oder »ein edler Geist«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »halte mich aufrecht«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »deine Rettung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: Gib … zurück
  rationale: Der Hifil-Imperativ von שוב bittet Gott, einen früheren Zustand wiederherzustellen. „Gib … zurück“ ist im modernen Deutschen natürlich und bewahrt die Bewegung des Zurückgebens.
- source_word: לִּי
  choice: mir
  rationale: Die Präposition mit Suffix bezeichnet den Empfänger dessen, was zurückgegeben werden soll.
- source_word: שְׂשׂוֹן
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude oder Frohlocken; „Freude“ ist hier prägnant und idiomatisch.
- source_word: יִשְׁעֶךָ
  choice: dein Heil
  rationale: ישע kann Rettung, Befreiung oder Heil bezeichnen. „Dein Heil“ bewahrt im Kontext des Bußpsalms die umfassende Bedeutung, ohne sie auf eine bestimmte Form der Rettung einzuengen.
- source_word: וְרוּחַ
  choice: und ein … Geist
  rationale: רוּחַ bezeichnet hier am plausibelsten „Geist“; der Ausdruck bleibt offen dafür, ob Gottes Geist oder die innere Haltung des Beters gemeint ist.
- source_word: נְדִיבָה
  choice: williger
  rationale: Das Adjektiv kann „willig“, „freigebig“ oder „edel“ bedeuten. „Willig“ passt am besten zu einer bereitwilligen, frei antwortenden Haltung, ohne die anderen Möglichkeiten auszuschließen.
- source_word: תִסְמְכֵנִי
  choice: stütze mich
  rationale: סמך bedeutet „stützen“, „aufrechterhalten“ oder „tragen“. Der Imperfekt steht hier mit aufforderndem Sinn parallel zum eröffnenden Imperativ; der deutsche Konjunktiv „stütze“ gibt die Bitte knapp und würdig wieder.
theological_decisions:
- issue: Bedeutung von יִשְׁעֶךָ im Bußpsalm
  choice: dein Heil
  alternative: deine Rettung
  rationale: „Heil“ erhält die theologische Weite von göttlicher Rettung im Zusammenhang von Schuld, Reinigung und Erneuerung, ohne spätere dogmatische Einzelheiten einzutragen.
- issue: Bezug und Bedeutung von „ein williger Geist“
  choice: ein williger Geist
  alternative: ein freigebiger Geist / ein edler Geist
  rationale: Die Formulierung legt nicht ausdrücklich fest, ob Gottes Geist oder der erneuerte innere Geist des Beters gemeint ist. Diese echte Mehrdeutigkeit bleibt erhalten.
- issue: Modale Funktion von תִסְמְכֵנִי
  choice: stütze mich
  alternative: möge mich stützen / halte mich aufrecht
  rationale: Der auffordernde beziehungsweise bittende Sinn wird durch den Konjunktiv wiedergegeben, ohne den Satz stärker auszudeuten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetston. Die Wortstellung wahrt den poetischen Parallelismus. „Heil“ ist traditionsfähig, aber weiterhin allgemein verständlich; sämtliche sachlich wichtigen lexikalischen Alternativen werden in Fußnoten erhalten.
