  text: תַּ֭שְׁמִיעֵ/נִי שָׂשׂ֣וֹן וְ/שִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: de
  text: Lass mich Jubel und Freude hören; lass die Gebeine, die du zerschlagen hast, jubeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die du zermalmt hast“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: Lass mich … hören
  rationale: Der Hifil von שׁמע mit Suffix der 1. Person Singular ist wörtlich kausativ („lass mich hören“/„bewirke, dass ich höre“). „Lass mich … hören“ gibt die Gebetsbitte natürlich und zugleich formnah wieder.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Jubel und Freude
  rationale: Die beiden nah verwandten Begriffe bezeichnen freudiges Aufjauchzen und Freude. Das Wortpaar wahrt den poetischen Parallelismus, ohne beide mit demselben deutschen Wort wiederzugeben.
- source_word: תָּגֵלְנָה
  choice: lass … jubeln
  rationale: Der Qal-Imperfekt der 3. Person feminin Plural kann im Gebetszusammenhang einen Wunsch ausdrücken. „Lass … jubeln“ bewahrt diese volitive Nuance und nimmt „Jubel“ aus der ersten Vershälfte auf.
- source_word: עֲצָמוֹת
  choice: die Gebeine
  rationale: Das Hebräische sagt ohne Possessivsuffix wörtlich „die Knochen/Gebeine“. „Die Gebeine“ erhält diese Form und klingt im poetischen Kontext würdevoll; gemeint sind dem Zusammenhang nach die Gebeine des Beters.
- source_word: דִּכִּיתָ
  choice: die du zerschlagen hast
  rationale: Das Verb דכה bezeichnet ein Zermalmen, Zerschlagen oder tiefes Niederdrücken. „Zerschlagen“ ist im Deutschen eine starke, natürliche Metapher und erhält die direkte Anrede Gottes.
theological_decisions:
- issue: Gott wird das Leiden unmittelbar zugeschrieben
  choice: „die du zerschlagen hast“
  alternative: „die zerschlagen wurden“
  rationale: Die 2. Person maskulin Singular des hebräischen Perfekts nennt Gott direkt als Handelnden. Diese theologische Spannung wird nicht durch eine passive Formulierung abgeschwächt.
- issue: Bezug der Gebeine auf den Beter
  choice: „die Gebeine“
  alternative: „meine Gebeine“
  rationale: Obwohl der Zusammenhang die eigenen Gebeine des Beters nahelegt, fehlt im Hebräischen ein Possessivsuffix. Die Übersetzung bewahrt deshalb die sprachliche Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Verdichtung. „Gebeine“ ist bewusst gehobener als „Knochen“, bleibt aber allgemein verständlich und passt zur Bildsprache des Psalms.
