id: PSA.51.3
reference: Psalms 51:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הרבה כַּבְּסֵ֣/נִי מֵ/עֲוֺנִ֑/י וּֽ/מֵ/חַטָּאתִ֥/י טַהֲרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/003.yaml
  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: de
  text: Wasche mich gründlich[a] von meiner Schuld[b] rein und reinige[c] mich von meiner Sünde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wasche mich reichlich rein« oder »Wasche mich immer wieder rein«. Das hebräische Verstärkungswort kann eine umfassende oder intensive Reinigung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: »Schuld« kann hier auch »Vergehen« oder »Unrecht« bedeuten; das hebräische Wort עָוֹן kann sowohl die schuldhafte Tat als auch die daraus erwachsende Schuld umfassen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »mache mich rein«; auch »läutere mich« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: gründlich
  rationale: Das Adverb verstärkt die folgende Aufforderung. »Gründlich« gibt im Deutschen die Intensität der erbetenen Waschung natürlich wieder, ohne ausdrücklich eine Wiederholung festzulegen.
- source_word: כַּבְּסֵנִי
  choice: wasche mich … rein
  rationale: כּבס bezeichnet besonders das Waschen von Kleidung und vermittelt das Bild einer intensiven Reinigung. »Wasche mich … rein« ist idiomatisch und bewahrt dieses Bild.
- source_word: מֵעֲוֺנִי
  choice: von meiner Schuld
  rationale: עָוֹן kann das schuldhafte Unrecht, die daraus erwachsende Schuld oder deren Folgen bezeichnen. »Schuld« lässt in diesem Bußkontext sowohl die Tat als auch das Verschulden anklingen.
- source_word: וּמֵחַטָּאתִי
  choice: und … von meiner Sünde
  rationale: חַטָּאת bezeichnet hier im Bußzusammenhang die Sünde. Die Wiedergabe unterscheidet den Ausdruck vom parallelen עָוֹן.
- source_word: טַהֲרֵנִי
  choice: reinige mich
  rationale: טהר bedeutet rein beziehungsweise rein machen und kann kultische wie moralische Reinheit bezeichnen. »Reinige mich« bewahrt diese Bedeutungsweite.
theological_decisions:
- issue: Wiedergabe der parallelen Bußbegriffe עָוֹן und חַטָּאת
  choice: Unterschiedliche Wiedergabe als »Schuld« und »Sünde«
  alternative: Beide Begriffe allgemeiner mit »Unrecht« beziehungsweise »Sünde« wiedergeben oder עָוֹן mit »Vergehen« übersetzen
  rationale: Die unterschiedlichen hebräischen Begriffe stehen poetisch parallel, sind aber nicht völlig deckungsgleich. Die Übersetzung wahrt den Unterschied, ohne daraus eine starre theologische Trennung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung »von meiner Schuld reinwaschen« ist idiomatisch und bewahrt zugleich das konkrete Waschbild des Hebräischen; »reinigen« hält die moralischen und kultischen Anklänge des zweiten Verbs offen.
