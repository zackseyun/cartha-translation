base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: de
  text: Reinige mich mit Ysop[a], so werde ich rein; wasche mich, so werde ich weißer als Schnee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb gehört zum Wortfeld von „sündigen“ und bezeichnet hier, im Zusammenhang mit Ysop, rituelles Reinigen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: Entsündige mich
  rationale: Das Piel von חטא bezeichnet hier im Zusammenhang mit Ysop das Befreien von Sünde beziehungsweise Unreinheit. „Entsündige mich“ bewahrt die ungewöhnliche, kultisch geprägte Ausdrucksweise des Hebräischen, ohne sie in eine bloß allgemeine Bitte um Vergebung aufzulösen.
- source_word: בְאֵזוֹב
  choice: mit Ysop
  rationale: Die Präposition bezeichnet das Mittel der Reinigung; Ysop erinnert ausdrücklich an die Reinigungsriten Israels.
- source_word: וְאֶטְהָר
  choice: dann werde ich rein
  rationale: טהר bezeichnet das Reinwerden in kultischem und moralischem Sinn. „Dann“ gibt die im Zusammenhang ausgedrückte Folge im natürlichen Deutschen wieder.
- source_word: תְּכַבְּסֵנִי
  choice: wasche mich
  rationale: כבס bezeichnet gewöhnlich das Waschen von Kleidern und wird hier bildhaft auf den Beter angewandt. „Wasche mich“ erhält dieses konkrete Bild.
- source_word: וּמִשֶּׁלֶג
  choice: als Schnee
  rationale: מִן hat im Kontext des Weißseins vergleichende Bedeutung und wird daher mit „als“ wiedergegeben.
- source_word: אַלְבִּין
  choice: werde ich weißer
  rationale: Das Hiphil von לבן drückt hier das Weißwerden beziehungsweise das erzielte Weißsein aus; zusammen mit dem Vergleich ergibt sich idiomatisch „weißer als Schnee“.
theological_decisions:
- issue: Kultische Reinigungsbilder für moralische Schuld
  choice: „Entsündige mich mit Ysop“ bewahrt sowohl den Bezug auf Sünde als auch das kultische Reinigungsbild.
  alternative: „Reinige mich mit Ysop“
  rationale: Die Formulierung lässt die Verbindung von Sünde und ritueller Reinigung bestehen, ohne sie auf eine allgemeine Vergebungsbitte zu reduzieren oder später entwickelte Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das seltene „entsündigen“ ist bewusst gewählt, um die markante hebräische Wortbildung und die Verbindung von Sünde und kultischer Reinigung sichtbar zu halten; die Fußnote bietet die geläufigere Alternative.
