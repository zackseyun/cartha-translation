  source_fidelity: 'Die Grundbedeutung und die Bildfolge sind zutreffend erfasst: Das Piel von חטא bezeichnet in diesem kultischen Kontext Reinigung, und die Bitten führen jeweils zur resultierenden Reinheit beziehungsweise Weiße. „Mit Ysop“ und „weißer als Schnee“ geben die hebräischen Wendungen angemessen wieder.'
  naturalness: „Entsündige mich“ ist zwar als bewusstes Wortbildungsäquivalent verständlich, aber im modernen Standarddeutsch sehr ungebräuchlich und wirkt eher technisch als poetisch. „Reinige mich“ ist idiomatisch und bewahrt zusammen mit „Ysop“ klar das rituelle Reinigungsbild. Das poetische „so werde ich“ stellt die Folgebeziehung flüssig dar.
  terminology: „Ysop“, „rein“ und „wasche mich“ sind treffend. Die Fußnote sollte die ungewöhnliche hebräische Verbindung zum Wortfeld der Sünde erläutern, ohne die seltene deutsche Neubildung zum Haupttext zu machen. Die Charakterisierung des Piel pauschal als „intensive Form“ ist semantisch zu undifferenziert.
