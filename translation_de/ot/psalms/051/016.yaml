  text: אֲ֭דֹנָ/י שְׂפָתַ֣/י תִּפְתָּ֑ח וּ֝/פִ֗/י יַגִּ֥יד תְּהִלָּתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: de
  text: Herr, öffne meine Lippen, und mein Mund wird dein Lob verkünden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die Gottesbezeichnung steht in direkter Anrede. „Herr“ ist im Deutschen die natürliche, ehrfürchtige Wiedergabe, ohne den Gottesnamen JHWH einzutragen.
- source_word: שְׂפָתַי
  choice: meine Lippen
  rationale: Die konkrete Körpermetapher des hebräischen Plurals mit Suffix der ersten Person bleibt erhalten.
- source_word: תִּפְתָּח
  choice: öffne
  rationale: Das Qal-Imperfekt von פתח hat im Gebetszusammenhang auffordernden beziehungsweise bittenden Sinn; der deutsche Imperativ gibt dies natürlich wieder.
- source_word: וּפִי
  choice: und mein Mund
  rationale: Die wörtliche Wiedergabe bewahrt den Parallelismus zu „meine Lippen“ und fügt keine ausdrücklich nicht vorhandene Folgerungspartikel ein.
- source_word: יַגִּיד
  choice: wird … verkünden
  rationale: Das Hifil-Imperfekt von נגד bezeichnet das Bekanntmachen oder Verkünden. Das Futur bringt hier die erwartete Folge der Bitte zum Ausdruck.
- source_word: תְּהִלָּתֶךָ
  choice: dein Lob
  rationale: Die knappe Formulierung bewahrt das Substantiv mit Suffix der zweiten Person und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung in direkter Anrede
  choice: Herr
  alternative: mein Herr
  rationale: אֲדֹנָי ist hier eine ehrfürchtige Gottesbezeichnung. „Herr“ wahrt die Anredeform, ohne durch „mein“ eine im deutschen Text unnötige zusätzliche Betonung zu setzen oder die Bezeichnung mit JHWH gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die knappe Parallelstruktur und die konkrete Bildsprache des Hebräischen bleiben erhalten.
