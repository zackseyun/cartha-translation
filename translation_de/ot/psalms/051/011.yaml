  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: de
  text: Erschaffe mir ein reines Herz, Gott, und erneuere in meinem Innern einen festen Geist[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen beständigen Geist“; das hebräische Wort kann etwas Festes, Gefestigtes oder recht Ausgerichtetes bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: ein reines Herz
  rationale: „Herz“ bewahrt die umfassende hebräische Vorstellung vom inneren Menschen mit Denken, Wollen und Empfinden. „Rein“ gibt sowohl die sittliche als auch die im Psalm mitschwingende kultische Bedeutung von טָהוֹר natürlich wieder.
- source_word: בְּרָא לִי
  choice: erschaffe mir
  rationale: בָּרָא bezeichnet besonders Gottes schöpferisches Handeln. „Erschaffe“ erhält diese Kraft; der Dativ „mir“ bildet לִי genauer ab als das deutende „in mir“ und ist im Deutschen idiomatisch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Anrede ist durch die Gebetsform eindeutig. Im heutigen Deutsch bringt „Gott“ ohne ein zusätzliches „o“ die direkte Anrede natürlich und würdig zum Ausdruck.
- source_word: רוּחַ נָכוֹן
  choice: einen festen Geist
  rationale: „Geist“ bewahrt die Bedeutungsbreite von רוּחַ und die Parallele zu „Herz“. „Fest“ gibt den Grundsinn von נָכוֹן als gefestigt, beständig oder zuverlässig wieder, ohne ihn ausschließlich als moralische Richtigkeit zu deuten.
- source_word: חַדֵּשׁ בְּקִרְבִּי
  choice: erneuere in meinem Innern
  rationale: „Erneuere“ drückt Wiederherstellung und Neubelebung aus. „In meinem Innern“ gibt die ausdrücklich innere Verortung von בְּקִרְבִּי klar und würdig wieder.
theological_decisions:
- issue: Bedeutung von נָכוֹן in רוּחַ נָכוֹן
  choice: einen festen Geist
  alternative: einen beständigen Geist; einen aufrichtigen Geist
  rationale: Im Zusammenhang bezeichnet נָכוֹן am ehesten Festigkeit und Beständigkeit. „Fest“ lässt zugleich offen, ob besonders innere Stabilität, Verlässlichkeit oder rechte Ausrichtung gemeint ist, und vermeidet eine konfessionelle Präzisierung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdig-poetischem Gebetsregister. Die hebräische Satzbewegung bleibt weitgehend erhalten; altertümliches „o Gott“ und unnötig psychologisierende Umschreibungen werden vermieden.
