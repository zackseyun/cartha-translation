id: PSA.51.10
reference: Psalms 51:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַסְתֵּ֣ר פָּ֭נֶי/ךָ מֵ/חֲטָאָ֑/י וְֽ/כָל עֲוֺ֖נֹתַ֣/י מְחֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/010.yaml
  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: de
  text: Verbirg dein Angesicht vor meinen Sünden und tilge[a] alle meine Verfehlungen[b] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wische … weg« oder »lösche … aus«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch die Bedeutung »Schuld« tragen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: Verbirg
  rationale: Der Hifil-Imperativ von סתר wird als direkte Bitte wiedergegeben. »Verbirg« bewahrt das konkrete Bild und die Befehlsform, ohne es deutend zu »wende dich ab« abzuschwächen.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: פנים bezeichnet wörtlich das Gesicht und steht hier bildhaft für Gottes aufmerksames Hinsehen. »Angesicht« erhält das hebräische Bild in würdigem, verständlichem Deutsch.
- source_word: מֵחֲטָאָי
  choice: vor meinen Sünden
  rationale: חטא bezeichnet Sünden oder Verfehlungen. Die Präposition מִן wird gemäß natürlichem deutschen Sprachgebrauch nach »verbergen« mit »vor« wiedergegeben.
- source_word: וְכָל
  choice: und alle
  rationale: Die Wiedergabe erhält sowohl die Verbindung der beiden Bitten als auch die umfassende Aussage von כָּל.
- source_word: עֲוֺנֹתַי
  choice: meine Verfehlungen
  rationale: עָוֹן kann sowohl schuldhaftes Unrecht als auch daraus erwachsende Schuld bezeichnen. »Verfehlungen« unterscheidet den Ausdruck von »Sünden« im ersten Halbvers, ohne eine engere dogmatische Bedeutung festzulegen.
- source_word: מְחֵה
  choice: tilge … aus
  rationale: Der Imperativ von מחה bezeichnet das Wegwischen oder vollständige Auslöschen. »Austilgen« bewahrt im Deutschen das Bild vollständiger Beseitigung und passt zum Gebetsregister des Psalms.
theological_decisions:
- issue: Unterscheidung der beiden Begriffe für Sünde
  choice: חטא wird mit »Sünden«, עָוֹן mit »Verfehlungen« wiedergegeben.
  alternative: Beide Begriffe könnten mit »Sünden« wiedergegeben werden; עָוֹן könnte auch »Schuld« heißen.
  rationale: Die unterschiedlichen hebräischen Wörter bleiben erkennbar, ohne ihnen eine starre lehrmäßige Unterscheidung aufzuerlegen. Eine Fußnote hält die mögliche Bedeutung »Schuld« ausdrücklich offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Angesicht« und »austilgen« sind leicht gehoben, bewahren aber die konkreten Bilder des hebräischen Gebets und sind allgemein verständlich.
