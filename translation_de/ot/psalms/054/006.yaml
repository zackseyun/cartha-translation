source:
  edition: WLC
  text: ישוב הָ֭/רַע לְ/שֹׁרְרָ֑/י בַּ֝/אֲמִתְּ/ךָ֗ הַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/006.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: de
  text: Das Böse kehre auf meine Widersacher zurück[a]; in deiner Treue[b] vernichte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Böse wird auf meine Widersacher zurückkehren.“ Das erste Verb kann statt als Wunsch auch als Aussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in deiner Wahrheit“. Das hebräische Wort kann Wahrheit, Verlässlichkeit oder Treue bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: kehre … zurück
  rationale: Das Qal-Imperfekt von שוב kann hier indikativisch („wird zurückkehren“) oder im Gebetszusammenhang volitiv („kehre zurück“) verstanden werden. Der folgende Imperativ spricht für die Wiedergabe als Bitte.
- source_word: הָרַע
  choice: das Böse
  rationale: רַע kann moralisches Böses, Unheil oder Schaden bezeichnen. „Das Böse“ bewahrt die knappe Formulierung und lässt sowohl die moralische als auch die vergeltende Nuance offen.
- source_word: לְשֹׁרְרָי
  choice: auf meine Widersacher
  rationale: Das Wort bezeichnet feindlich gesinnte Gegner. „Widersacher“ ist würdig und präzise, ohne den Konflikt unnötig als militärisch festzulegen.
- source_word: בַּאֲמִתְּךָ
  choice: in deiner Treue
  rationale: אֱמֶת umfasst Wahrheit, Verlässlichkeit und Treue. In der Anrede an Gott hebt „Treue“ seine Verlässlichkeit hervor; „in“ gibt die hebräische Präposition eng wieder.
- source_word: הַצְמִיתֵם
  choice: vernichte sie
  rationale: Der Hifil-Imperativ von צמת bedeutet, jemanden zu vernichten oder ihm ein Ende zu machen. „Vernichte sie“ gibt die Härte und Direktheit der Bitte unverhüllt wieder.
theological_decisions:
- issue: Verwünschender Charakter des Verses
  choice: Der Vers wird als Bitte um Gottes Gericht wiedergegeben.
  alternative: 'Das erste Verbum kann als Vorhersage verstanden werden: „Das Böse wird auf meine Widersacher zurückkehren.“'
  rationale: Der Psalm richtet sich unmittelbar an Gott, und das Schlussverb ist ein Imperativ. Die volitive Wiedergabe des ersten Verbs bewahrt die Spannung der Bitte um Vergeltung, ohne sie abzuschwächen oder zu einer bloßen Vorhersage zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Psalmton. Die knappe Parallelstruktur und die scharfe Bitte um göttliches Gericht bleiben erhalten.
