  source_fidelity: 'Die Übersetzung gibt die hebräische Struktur und die wesentlichen Bedeutungen zuverlässig wieder: Das singularische Imperfekt יָשׁוּב ist angemessen volitiv als „kehre ... zurück“ verstanden, wobei die Fußnote die mögliche indikativische Lesart offenhält. „Das Böse“ bewahrt die knappe, zugleich moralisch und als Unheil deutbare Bedeutung von הָרַע. „Vernichte sie“ gibt den Hifil-Imperativ הַצְמִיתֵם direkt und ohne Abschwächung wieder.'
