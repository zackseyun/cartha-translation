base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: de
  text: Gott, rette mich durch deinen Namen und verschaffe mir Recht durch deine Macht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „richte mich“ oder „führe meine Rechtssache“. Das hebräische Verb kann ein Richten vor Gericht bezeichnen; hier ist wahrscheinlich gemeint, dass Gott dem Beter Recht verschafft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Gebetskontext macht die direkte Anrede deutlich. „O Gott“ wäre möglich, fügte aber einen im Hebräischen nicht eigens ausgedrückten Anrufepartikel hinzu.
- source_word: בְּשִׁמְךָ
  choice: durch deinen Namen
  rationale: Das Präfix בְּ wird instrumental wiedergegeben. Gottes „Name“ steht dabei verdichtet für seine offenbarte Person, seinen Ruf und seine Identität; die knappe Formulierung bleibt erhalten.
- source_word: הוֹשִׁיעֵנִי
  choice: rette mich
  rationale: Die Hifilform von ישׁע bezeichnet hier die Bitte um Rettung. „Rette mich“ ist im modernen Deutsch direkt, verständlich und semantisch weit genug.
- source_word: וּבִגְבוּרָתְךָ
  choice: und durch deine Macht
  rationale: גְּבוּרָה bezeichnet Stärke oder wirksame Macht. „Durch deine Macht“ bewahrt ebenso wie „durch deinen Namen“ den instrumentalen Sinn der Präposition.
- source_word: תְדִינֵנִי
  choice: verschaffe mir Recht
  rationale: דִּין kann „richten“ bedeuten, bezeichnet in dieser Bitte aber wahrscheinlich ein gerichtliches Eintreten zugunsten des Beters. „Verschaffe mir Recht“ gibt diesen forensischen Sinn idiomatisch wieder, ohne die Grundbedeutung zu verdecken.
theological_decisions:
- issue: Sinn der Bitte תְדִינֵנִי im Zusammenhang mit Gottes Gerechtigkeit
  choice: verschaffe mir Recht
  alternative: richte mich; führe meine Rechtssache
  rationale: Der Beter bittet nicht lediglich um eine neutrale Beurteilung, sondern um Gottes gerechtes Eingreifen gegenüber seinen Gegnern. Die gewählte Formulierung bringt die erwartete Rechtshilfe zum Ausdruck, ohne spätere Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. Die parallelen instrumentalen Wendungen „durch deinen Namen“ und „durch deine Macht“ spiegeln den Aufbau des Hebräischen; die Fußnote bewahrt die Bedeutungsbreite des gerichtlichen Verbs.
