  text: אֱ֭לֹהִים שְׁמַ֣ע תְּפִלָּתִ֑/י הַ֝אֲזִ֗ינָ/ה לְ/אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: de
  text: Gott, höre mein Gebet; vernimm die Worte meines Mundes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede. Im modernen Deutschen ist „Gott“ ohne ein zusätzliches „O“ natürlich und würdevoll.
- source_word: שְׁמַע
  choice: höre
  rationale: Der Qal-Imperativ bezeichnet hier nicht bloß akustisches Wahrnehmen, sondern aufmerksames Hören im Gebet. „Höre“ bewahrt zugleich die knappe Gebetssprache.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: תְּפִלָּה bedeutet hier regulär „Gebet“; das Suffix der ersten Person Singular wird mit „mein“ wiedergegeben.
- source_word: הַאֲזִינָה
  choice: vernimm
  rationale: Der Hifil-Imperativ fordert zu aufmerksamem Hinhören auf. „Vernimm“ ist im Deutschen dichterisch und würdevoll, ohne die heute unnatürliche Wendung „neige dein Ohr“ einzuführen.
- source_word: לְאִמְרֵי
  choice: die Worte
  rationale: Der Konstruktplural von אֵמֶר bezeichnet die gesprochenen Worte; die vom deutschen Verb verlangte Konstruktion benötigt keine ausdrückliche Wiedergabe der Präposition ל.
- source_word: פִי
  choice: meines Mundes
  rationale: Die wörtliche körperliche Metapher wird bewahrt und bildet die hebräische Wendung „die Worte meines Mundes“ natürlich ab.
theological_decisions: []
translation_notes:
  register: Moderne standarddeutsche, knappe und würdige Gebetssprache. Der Parallelismus der beiden Imperative bleibt erhalten; „vernimm“ vermeidet eine monotone Wiederholung von „höre“, ohne den Sinn zu verändern.
