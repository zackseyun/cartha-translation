  text: בְּ/ב֣וֹא הַ֭/זִּיפִים וַ/יֹּאמְר֣וּ לְ/שָׁא֑וּל הֲ/לֹ֥א דָ֝וִ֗ד מִסְתַּתֵּ֥ר עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/001.yaml
  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: de
  text: 'Als die Sifiter kamen und zu Saul sagten: »Hält sich David nicht bei uns verborgen?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit uns«; auch möglich: »unter uns«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: Als … kamen
  rationale: Die Präposition ב mit dem Infinitivus constructus von בוא leitet einen Temporalsatz ein; »Als … kamen« gibt dies im Deutschen natürlich wieder.
- source_word: הַזִּיפִים
  choice: die Sifiter
  rationale: Der gentilizische Plural bezeichnet die Einwohner von Sif; »Sifiter« ist die gebräuchliche deutsche Namensform.
- source_word: וַיֹּאמְרוּ
  choice: und … sagten
  rationale: Die narrative Form von אמר bezeichnet die anschließende Redehandlung; die Verbendstellung ergibt sich aus dem deutschen Temporalsatz.
- source_word: לְשָׁאוּל
  choice: zu Saul
  rationale: ל kennzeichnet hier den Adressaten der Rede; »zu Saul sagen« ist idiomatisches Deutsch.
- source_word: הֲלֹא
  choice: … nicht …?
  rationale: Die Fragepartikel erwartet eine bejahende Antwort. Die deutsche verneinte Frage bewahrt den rhetorischen Charakter.
- source_word: דָוִד
  choice: David
  rationale: Gebräuchliche deutsche Form des Eigennamens.
- source_word: מִסְתַּתֵּר
  choice: hält sich … verborgen
  rationale: Das Hitpael-Partizip von סתר beschreibt ein andauerndes Sichverbergen; die Wendung ist natürlich und bewahrt den reflexiven Sinn.
- source_word: עִמָּנוּ
  choice: bei uns
  rationale: Wörtlich »mit uns«; im Zusammenhang des Verbergens bezeichnet die Form wahrscheinlich den Aufenthaltsbereich beziehungsweise die Umgebung der Sprecher. »Bei uns« wahrt die räumliche und soziale Offenheit besser als das stärker festlegende »unter uns«.
