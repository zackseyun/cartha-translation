  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: de
  text: Für den Chorleiter. Mit Saiteninstrumenten. Ein Maskil[b] Davids[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von David“ oder „für David“. Die hebräische Überschrift kann auf Urheberschaft, Widmung oder Zugehörigkeit hinweisen.'
    reason: alternative_reading
  - marker: b
    text: „Maskil“ ist ein hebräischer Fachbegriff in Psalmüberschriften. Vermutlich bezeichnet er eine Art von Dichtung oder Aufführung; seine genaue Bedeutung ist jedoch unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Bezeichnung richtet sich in Psalmüberschriften wahrscheinlich an den Verantwortlichen für die musikalische Aufführung. „Chorleiter“ ist im heutigen Deutsch verständlich und wahrt den musikalisch-liturgischen Bezug.
- source_word: בִּנְגִינֹת
  choice: Mit Saiteninstrumenten
  rationale: Das Wort bezeichnet hier wahrscheinlich die Begleitung durch Saiteninstrumente. Die Wiedergabe ist knapp, natürlich und konkret.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Es handelt sich um einen nicht sicher deutbaren Fachbegriff in Psalmüberschriften. Die Umschrift vermeidet eine vorschnelle Festlegung auf „Lehrlied“, „Kunstlied“ oder eine andere umstrittene Bedeutung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der hebräische Ausdruck kann Urheberschaft, Zugehörigkeit, Widmung oder Beziehung zu David bezeichnen. Der deutsche Genitiv bewahrt diese Mehrdeutigkeit besser als eindeutigere Formulierungen wie „von David“ oder „für David“.
theological_decisions:
- issue: Deutung der davidischen Überschrift
  choice: Davids
  alternative: von David; für David
  rationale: Die Überschrift kann Autorschaft, Zuordnung oder Widmung ausdrücken. Der Genitiv lässt diese Möglichkeiten offen und legt die historische beziehungsweise theologische Beziehung nicht genauer fest, als es der hebräische Wortlaut erlaubt.
translation_notes:
  register: Moderne, würdevolle Psalmüberschrift in knappen Nominal- und Präpositionalphrasen. Der unbekannte Fachbegriff bleibt transliteriert; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
