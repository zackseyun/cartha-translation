  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: de
  text: Denn er hat mich aus jeder Not gerettet, und mein Auge hat meine Feinde gesehen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »und mein Auge hat auf meine Feinde geblickt«. Der Zusammenhang kann andeuten, dass der Beter ihren Untergang oder seine eigene Rechtfertigung miterlebt hat; ausdrücklich gesagt wird das jedoch nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage des Lobes beziehungsweise Gelübdes und wird im Deutschen natürlich mit »Denn« wiedergegeben.
- source_word: מִכָּל צָרָה
  choice: aus jeder Not
  rationale: מִן bezeichnet hier die Rettung aus einer bedrängenden Lage; כָּל hat distributive Kraft. »Aus jeder Not« ist idiomatisch und bewahrt den umfassenden Sinn.
- source_word: הִצִּילָנִי
  choice: er hat mich … gerettet
  rationale: Der Hifil von נצל bedeutet retten oder befreien. Das Perfekt bezeichnet die erfahrene Rettung als vollzogene Tat.
- source_word: וּבְאֹיְבַי רָאֲתָה עֵינִי
  choice: und mein Auge hat meine Feinde gesehen
  rationale: Die bildhafte hebräische Wendung mit »mein Auge« als Subjekt bleibt erhalten. Das ב beim Gegenstand des Sehens lässt sich im natürlichen Deutschen nicht wörtlich nachbilden; die Wiedergabe nennt daher die Feinde als gesehenes Gegenüber, ohne Niederlage oder Triumph hinzuzufügen.
theological_decisions:
- issue: Was das Sehen der Feinde über ihr Schicksal aussagt
  choice: Die Aussage bleibt beim Sehen der Feinde, ohne ihren Untergang, eine Rachehandlung oder den Triumph des Beters ausdrücklich zu nennen.
  alternative: »Mein Auge sah den Untergang meiner Feinde« beziehungsweise »mein Auge blickte triumphierend auf meine Feinde«
  rationale: Der Zusammenhang kann die Rechtfertigung des Beters oder die Niederlage seiner Feinde nahelegen, doch der hebräische Wortlaut spricht dies nicht ausdrücklich aus. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Not« und »gerettet« sind allgemein verständlich; die ungewöhnliche, aber klare Wendung »mein Auge hat … gesehen« bewahrt die Bildhaftigkeit des Hebräischen.
