  text: בִּ/נְדָבָ֥ה אֶזְבְּחָה לָּ֑/ךְ א֤וֹדֶה שִּׁמְ/ךָ֖ יְהוָ֣ה כִּי טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: de
  text: Ich will dir ein freiwilliges Opfer darbringen[a]; deinem Namen will ich danken, Jahwe[b], denn gut ist er[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »mit einem freiwilligen Opfer«; die Wendung kann auch adverbial verstanden werden: »freiwillig will ich dir opfern«.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH, traditionell mit »der HERR« wiedergegeben; auch als »Yahweh« transkribiert.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht im Hebräischen nur: »denn gut«. Das nicht ausgedrückte Subjekt kann sich auf »deinen Namen« oder unmittelbar auf Jahwe beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: mit einer freiwilligen Gabe
  rationale: Das Substantiv נְדָבָה bezeichnet eine freiwillige Gabe beziehungsweise ein freiwilliges Opfer. Zusammen mit אֶזְבְּחָה bleibt so der kultische Sinn erhalten; zugleich wird die mögliche adverbiale Auffassung in der Fußnote genannt.
- source_word: אֶזְבְּחָה
  choice: will ich opfern
  rationale: Das Verb זבח bedeutet, ein Opfer darzubringen. Die deutsche Wendung ist knapp, natürlich und wird durch »Gabe« näher bestimmt.
- source_word: לָּךְ
  choice: dir
  rationale: Die Präposition ל kennzeichnet hier den Empfänger des Opfers; im Deutschen ist der Dativ die natürliche Form.
- source_word: אוֹדֶה
  choice: will ich danken
  rationale: ידה im Hifil kann »danken« oder »preisen« bedeuten. »Danken« bewahrt hier den Dankcharakter der angekündigten Gottesverehrung.
- source_word: שִׁמְךָ
  choice: deinem Namen
  rationale: Der hebräische Text nennt ausdrücklich Gottes Namen. Diese Wendung wird bewahrt und nicht vereinfachend durch »dir« ersetzt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, um den Eigennamen statt eines ersetzenden Titels auszudrücken.
- source_word: כִּי טוֹב
  choice: denn er ist gut
  rationale: כִּי leitet die Begründung ein. Das subjektlose טוֹב wird im Deutschen auf das unmittelbar vorausgehende maskuline »Name« bezogen; die mögliche Beziehung auf Jahwe bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. »Jahwe« wahrt diesen Eigennamen, während »der HERR« die traditionelle Ersatzlesung darstellt.
- issue: Bezug von טוֹב in כִּי טוֹב
  choice: denn er ist gut, bezogen auf den Namen
  alternative: denn er, Jahwe, ist gut
  rationale: Im Hebräischen fehlt ein ausdrückliches Subjekt. Der unmittelbar vorausgehende »Name« ist ein naheliegender Bezug, doch auch der direkte Bezug auf Jahwe ist möglich und wird deshalb nicht verschwiegen.
- issue: Nominaler oder adverbialer Sinn von בִּנְדָבָה
  choice: mit einer freiwilligen Gabe
  alternative: freiwillig
  rationale: Die nominale Wiedergabe bewahrt den Opferkontext von זבח; die Formulierung kann jedoch auch adverbial als freiwilliges Opfern verstanden werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetisch angemessener Voranstellung der Opfergabe. »Gabe« vermeidet die schwerfällige Verbindung »ein freiwilliges Opfer opfern«. Die parallelen Verbformen »will ich … opfern« und »will ich danken« geben die Entschlossenheit der hebräischen Kohortative wieder.
