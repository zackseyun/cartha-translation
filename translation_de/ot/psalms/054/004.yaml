source:
  edition: WLC
  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: de
  text: Denn Fremde haben sich gegen mich erhoben[a], und Gewalttätige haben nach meinem Leben getrachtet[b]; sie haben Gott nicht vor Augen. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Außenstehende haben sich gegen mich erhoben.“ Das hebräische Wort kann Fremde, Nichtzugehörige oder Entfremdete bezeichnen und muss nicht ethnisch „Ausländer“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie suchen meine Seele“. Das hebräische Wort נֶפֶשׁ bezeichnet hier die bedrohte Person beziehungsweise ihr Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte ein und bewahrt den kausalen Zusammenhang.
- source_word: זָרִים
  choice: Fremde
  rationale: Bezeichnet fremde, nicht zugehörige oder entfremdete Personen. „Fremde“ wahrt die lexikalische Offenheit, ohne zwingend eine andere Volkszugehörigkeit zu behaupten.
- source_word: קָמוּ עָלַי
  choice: haben sich gegen mich erhoben
  rationale: Gibt die feindselige Bewegung und Opposition des hebräischen Ausdrucks bildhaft und idiomatisch wieder.
- source_word: עָרִיצִים
  choice: Gewalttätige
  rationale: Erfasst Menschen, die rücksichtslos, gewaltsam und unterdrückerisch handeln; die substantivierte Form ist im Deutschen natürlich.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: trachten mir nach dem Leben
  rationale: נֶפֶשׁ bezeichnet hier angesichts der tödlichen Bedrohung das Leben beziehungsweise die Person. Die deutsche Wendung gibt den feindlichen Tötungswillen idiomatisch wieder.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: sie haben Gott nicht vor Augen
  rationale: Bewahrt das räumliche Bild, Gott nicht vor sich zu stellen, und drückt zugleich ihre Missachtung Gottes aus, ohne das Bild unnötig auszudeuten.
- source_word: סֶלָה
  choice: Sela
  rationale: Als überlieferter liturgischer oder musikalischer Hinweis transliteriert, da seine genaue Bedeutung unsicher ist.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ im Bedrohungskontext
  choice: Als „Leben“ wiedergegeben
  alternative: Seele
  rationale: Im Kontext suchen die Gegner den Tod des Beters. „Leben“ trifft daher die konkrete Bedeutung, ohne dem Text eine bestimmte Leib-Seele-Lehre aufzuerlegen.
- issue: Bedeutung von „Gott nicht vor sich stellen“
  choice: Bildhaft als „Gott nicht vor Augen haben“ wiedergegeben
  alternative: Gott nicht beachten
  rationale: Die gewählte Formulierung wahrt die Metapher und lässt offen, ob vor allem praktische Gottlosigkeit, moralische Missachtung oder fehlende Gottesfurcht gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. „Fremde“ erhält die Mehrdeutigkeit des Ausgangswortes; „Gewalttätige“ vermeidet eine unnötige Festlegung auf Herrscher oder Tyrannen. Das traditionelle „Sela“ bleibt unübersetzt.
