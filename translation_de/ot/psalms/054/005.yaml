  source_fidelity: 'Die Übersetzung gibt den hebräischen Text zuverlässig wieder: הִנֵּה als einleitendes „Siehe“, אֱלֹהִים עֹזֵר לִי als „Gott ist mein Helfer“ und אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי mit der im Masoretentext vorhandenen, syntaktisch schwierigen pluralischen Konstruktion. „Unter denen, die mein Leben erhalten“ bewahrt sowohl die Präposition als auch den Plural von סֹמְכֵי. Die Fußnote nennt die naheliegende glättende Alternativdeutung, ohne sie zur Hauptlesart zu machen.'
