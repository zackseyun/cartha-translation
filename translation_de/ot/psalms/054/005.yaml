source:
  edition: WLC
  text: הִנֵּ֣ה אֱ֭לֹהִים עֹזֵ֣ר לִ֑/י אֲ֝דֹנָ֗/י בְּֽ/סֹמְכֵ֥י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: de
  text: Siehe, Gott ist mein Helfer; der Herr ist unter denen, die mein Leben[b] erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Herr erhält mein Leben“ beziehungsweise „Der Herr ist es, der mein Leben erhält.“ Die hebräische Wendung „unter denen, die mein Leben erhalten“ ist syntaktisch schwierig; manche Übersetzungen verstehen den Herrn selbst als den unmittelbaren Erhalter.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort נֶפֶשׁ (nefesch) kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die aufmerksamkeitslenkende Partikel leitet eine nachdrückliche Aussage ein. „Siehe“ bewahrt den gehobenen poetischen Klang, ohne den Satz auf ein bloßes „gewiss“ festzulegen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Hier ist אֱלֹהִים die übliche Bezeichnung für Gott und steht im Singular als Subjekt zu עֹזֵר.
- source_word: עֹזֵר
  choice: Helfer
  rationale: Das Qal-Partizip von עזר wird prädikativ und substantivisch gebraucht. „Mein Helfer“ gibt den persönlichen, handelnden Beistand knapp und natürlich wieder.
- source_word: לִי
  choice: mein
  rationale: Die Präposition mit dem Suffix der ersten Person bezeichnet hier die Beziehung beziehungsweise den Vorteil für den Sprecher. Zusammen mit „Helfer“ ist der deutsche Possessivausdruck idiomatisch.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Das Wort ist hier ein göttlicher Hoheitstitel. Der bestimmte Artikel entspricht dem natürlichen deutschen Gebrauch.
- source_word: בְּסֹמְכֵי
  choice: ist unter denen, die … erhalten
  rationale: Die Verbindung der Präposition ב mit dem pluralischen Partizip im Constructus ist syntaktisch schwierig. Diese Wiedergabe versteht ב als Zugehörigkeit beziehungsweise Gemeinschaft und bewahrt ausdrücklich den Plural, ohne die Schwierigkeit unmarkiert aufzulösen.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ bezeichnet in diesem Zusammenhang die gefährdete und von Gott bewahrte Person beziehungsweise ihr Leben, nicht notwendig eine vom Körper getrennte Seele.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי als Gottesbezeichnung
  choice: der Herr
  alternative: Herr
  rationale: Der Ausdruck bezeichnet hier den göttlichen Herrn, nicht einen menschlichen Gebieter. „Der Herr“ wahrt das Gewicht des Titels und ist im Deutschen idiomatisch.
- issue: Bedeutung von נַפְשִׁי
  choice: mein Leben
  alternative: meine Seele / mich selbst
  rationale: Im Zusammenhang von Bedrohung und Bewahrung ist das Leben beziehungsweise die ganze Person gemeint. Die Übersetzung vermeidet eine unnötige Festlegung auf eine spätere Leib-Seele-Dichotomie.
- issue: Syntaktische Zuordnung von אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי
  choice: der Herr ist unter denen, die mein Leben erhalten
  alternative: der Herr erhält mein Leben / der Herr ist es, der mein Leben erhält
  rationale: Der masoretische Wortlaut enthält ein pluralisches Partizip mit ב und lässt sich schwer glätten. Die Hauptfassung erhält diese formale Spannung; die verbreitete Deutung des Herrn als unmittelbaren Erhalter wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Siehe“ trägt den poetisch-feierlichen Nachdruck; der übrige Satz bleibt klar und gegenwärtig. Die ungewöhnliche Formulierung „unter denen“ wird wegen der echten syntaktischen Spannung des Hebräischen beibehalten und durch eine Fußnote erläutert.
