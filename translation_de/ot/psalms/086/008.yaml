id: PSA.86.8
reference: Psalms 86:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵין כָּמ֖וֹ/ךָ בָ/אֱלֹהִ֥ים אֲדֹנָ֗/י וְ/אֵ֣ין כְּֽ/מַעֲשֶֽׂי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: de
  text: Keiner unter den Göttern[a] ist wie du, Herr, und keine Taten sind wie deine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter den himmlischen Wesen«. Wörtlich steht im Hebräischen »unter den Göttern«; damit wird die Unvergleichlichkeit des Herrn gegenüber allen als göttlich geltenden Mächten verkündet.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Werke« beziehungsweise »Handlungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּמוֹךָ
  choice: Keiner ist wie du
  rationale: Die existentielle Verneinung mit dem Vergleichsausdruck bezeichnet, dass niemand mit dem angesprochenen Herrn vergleichbar ist. Die deutsche Formulierung ist unmittelbar und poetisch.
- source_word: בָאֱלֹהִים
  choice: unter den Göttern
  rationale: Die Präposition ב mit dem pluralischen אֱלֹהִים bezeichnet hier den Bereich des Vergleichs. „Unter den Göttern“ bewahrt den ausdrücklichen Plural und die Aussage von Gottes Unvergleichlichkeit.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der göttliche Titel steht als Anrede. „Herr“ entspricht dem natürlichen deutschen Sprachgebrauch im Gebet, ohne die erstarrte Form durch „mein Herr“ zu überdeuten.
- source_word: וְאֵין כְמַעֲשֶׂיךָ
  choice: und keine Taten sind wie deine
  rationale: מַעֲשֶׂה kann Werk, Tat oder Handlung bezeichnen. „Taten“ ist im Lobpreis natürlich und lässt den Bezug auf Gottes machtvolles Handeln erkennen.
theological_decisions:
- issue: Bedeutung von „unter den Göttern“
  choice: Den pluralischen Ausdruck als poetische Aussage von der Unvergleichlichkeit des Herrn beibehalten.
  alternative: „unter den himmlischen Wesen“ oder geglättet „kein Gott ist wie du“
  rationale: Der hebräische Text verwendet ausdrücklich den Plural אֱלֹהִים. Die direkte Wiedergabe bewahrt die theologische Spannung, ohne damit eine bestimmte metaphysische Einordnung dieser „Götter“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Der Plural „Götter“ bleibt erhalten; die Fußnote erläutert die mögliche Sachbedeutung. Der zweite Fußnotenmarker steht unmittelbar bei dem Ausdruck, den er erklärt.
