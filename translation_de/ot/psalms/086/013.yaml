source:
  edition: WLC
  text: כִּֽי חַ֭סְדְּ/ךָ גָּד֣וֹל עָלָ֑/י וְ/הִצַּ֥לְתָּ נַ֝פְשִׁ֗/י מִ/שְּׁא֥וֹל תַּחְתִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: de
  text: Denn deine treue Liebe zu mir ist groß, und du hast meine Seele aus der tiefsten Scheol gerettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem tiefsten Totenreich« beziehungsweise »aus dem Grab tief unten«. »Scheol« ist die hebräische Bezeichnung für den Bereich der Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorausgehende Lob beziehungsweise Gebet ein und bewahrt den poetischen Zusammenhang.
- source_word: חַסְדְּךָ
  choice: deine beständige Liebe
  rationale: חֶסֶד bezeichnet verlässliche, loyale und gütige Liebe. »Beständige Liebe« gibt ihre dauerhafte relationale Kraft verständlich wieder, ohne sie auf bloßes Erbarmen zu verengen.
- source_word: גָּדוֹל עָלָי
  choice: zu mir ist groß
  rationale: גָּדוֹל bedeutet hier schlicht »groß«; עַל bezeichnet in Verbindung mit חֶסֶד die Ausrichtung dieser Liebe auf den Beter. Die deutsche Formulierung ist natürlich und inhaltlich nah am Hebräischen.
- source_word: וְהִצַּלְתָּ
  choice: und du hast … gerettet
  rationale: Das Hifil von נצל bezeichnet das Herausreißen, Retten oder Befreien. Das Perfekt wird als abgeschlossene Rettung mit gegenwärtiger Bedeutung wiedergegeben.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann die Seele, das Leben oder die ganze Person bezeichnen. »Meine Seele« bewahrt die poetische Ausdrucksweise, ohne daraus eine präzise spätere Seelenlehre abzuleiten.
- source_word: מִשְּׁאוֹל תַּחְתִּיָּה
  choice: aus der tiefsten Scheol
  rationale: שְׁאוֹל bezeichnet den Bereich der Toten; תַּחְתִּיָּה verstärkt das Bild äußerster Tiefe. »Tiefste Scheol« folgt der hebräischen Fügung enger als eine Umschreibung mit »Tiefen«.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל ohne Eintragung späterer dogmatischer Vorstellungen
  choice: Scheol
  alternative: Totenreich; Grab in der Tiefe
  rationale: Die Transliteration bewahrt die alttestamentliche Vorstellungswelt und legt den Ausdruck weder einseitig als Grab noch als eine später präzisierte Höllenvorstellung aus. Die Fußnote erklärt den Begriff.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Satzbau. Der seltene Ausdruck »Scheol« bleibt wegen seiner theologischen und bildlichen Eigenart erhalten und wird in der Fußnote erläutert.
