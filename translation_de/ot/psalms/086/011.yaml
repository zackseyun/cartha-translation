  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: de
  text: Lehre mich deinen Weg, Jahwe, damit ich in deiner Wahrheit[a] wandle. Vereine mein Herz, damit ich deinen Namen fürchte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in deiner Treue«. Das hebräische Wort kann sowohl »Wahrheit« als auch »Treue« oder »Verlässlichkeit« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gib mir ein ungeteiltes Herz«. Das hebräische Verb bedeutet »vereinigen« oder »eins machen« und kann ein Herz meinen, dessen Loyalität nicht gespalten ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Lehre mich
  rationale: Der Hifil-Imperativ von ירה mit Suffix der 1. Person Singular bedeutet »lehre/unterweise mich«. »Lehre mich« ist direkt, natürlich und bewahrt den Gebetscharakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. »Jahwe« ist die im modernen Deutschen geläufige Umschrift des Tetragramms.
- source_word: דַּרְכֶּךָ
  choice: deinen Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg und übertragen die von Gott gewiesene Lebensführung. Der Singular und das Bild des Weges bleiben erhalten.
- source_word: אֲהַלֵּךְ
  choice: damit ich … lebe
  rationale: Das Imperfekt nach der Bitte drückt hier zweck- oder folgebezogenes Handeln aus. Das hebräische Bild des Gehens bezeichnet in diesem Zusammenhang die Lebensführung; »lebe« gibt dies in natürlichem modernem Deutsch wieder.
- source_word: בַּאֲמִתֶּךָ
  choice: in deiner Wahrheit
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. »Wahrheit« ist die direkte Wiedergabe; die ebenfalls mögliche Bedeutung »Treue« wird in einer Fußnote bewahrt.
- source_word: יַחֵד
  choice: Mach … eins
  rationale: Der Piel-Imperativ von יחד bedeutet »einen/eins machen«. Die konkrete Formulierung bewahrt das hebräische Bild und lässt erkennen, dass um ein innerlich ungeteiltes Herz gebeten wird.
- source_word: לְבָבִי
  choice: mein Herz
  rationale: לֵבָב meint den inneren Menschen einschließlich Willen, Denken und Empfinden. »Herz« ist die angemessene und verständliche biblische Entsprechung.
- source_word: לְיִרְאָה
  choice: damit ich … fürchte
  rationale: Der Infinitiv mit לְ bezeichnet den Zweck. »Fürchten« bewahrt das Bedeutungsspektrum von ירא zwischen Furcht, Ehrfurcht und Scheu, ohne es auf bloße Verehrung zu verengen.
- source_word: שְׁמֶךָ
  choice: deinen Namen
  rationale: Der Name steht auch für Gottes Person und Ansehen. Die wörtliche Wendung trägt im Gebets- und Anbetungskontext besonderes theologisches Gewicht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen, nicht den Titel אֲדֹנָי. Die Umschrift bewahrt diesen Unterschied.
- issue: Bedeutung von ירא gegenüber Gottes Namen
  choice: deinen Namen fürchte
  alternative: deinen Namen ehrfürchtig verehre
  rationale: »Fürchten« erhält die Spannung von Furcht, Ehrfurcht und heiliger Scheu und vermeidet eine einengende Abschwächung.
- issue: Einheit des Herzens
  choice: Mach mein Herz eins
  alternative: Gib mir ein ungeteiltes Herz
  rationale: Die gewählte Fassung bleibt nahe am Verb יחד. Die Alternative verdeutlicht den Sinn als Freiheit von geteilter Loyalität, legt das Bild aber stärker aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung »Mach mein Herz eins« ist bewusst bildhaft und quellennah; die Fußnote erschließt die gemeinte ungeteilte Ausrichtung. Das metaphorische hebräische »gehen« wird idiomatisch mit »leben« wiedergegeben.
