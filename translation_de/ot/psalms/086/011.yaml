  to: Lehre mich deinen Weg, Jahwe, damit ich in deiner Wahrheit[a] wandle. Vereine mein Herz, damit ich deinen Namen fürchte.[b]
  rationale: Die Überarbeitung stellt das Bild des »Wandelns« wieder her und ersetzt eine im Deutschen künstliche Wendung durch »Vereine mein Herz«. Die Fußnote zu b dokumentiert nun sowohl die lexikalische Bedeutung des Verbs als auch die mögliche Sinnentfaltung. Die Ambiguität von אֱמֶת bleibt durch die Fußnote erhalten.
