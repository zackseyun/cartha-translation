  text: כִּֽי אַתָּ֣ה אֲ֭דֹנָ/י ט֣וֹב וְ/סַלָּ֑ח וְ/רַב חֶ֝֗סֶד לְ/כָל קֹרְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: de
  text: Denn du, Herr, bist gut und bereit zu vergeben, reich an treuer Liebe[a] gegenüber allen, die dich anrufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine verlässliche, treue Zuwendung; auch „beständige Liebe“, „Güte“ oder „Gnade“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet den Grund für die vorausgehende Bitte ein und bewahrt den verbindenden Charakter des hebräischen Satzes in natürlichem Deutsch.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Gibt den hier verwendeten göttlichen Titel wieder; im Hebräischen steht nicht der Gottesname JHWH.
- source_word: טוֹב
  choice: gut
  rationale: Bewahrt die breite Bedeutung des Ausdrucks, ohne Gottes Güte auf Freundlichkeit oder Wohlwollen zu verengen.
- source_word: סַלָּח
  choice: bereit zu vergeben
  rationale: Das seltene Adjektiv beschreibt Gottes vergebende Haltung. Diese Wendung ist im Deutschen natürlicher und genauer als das missverständliche „vergebend“.
- source_word: רַב חֶסֶד
  choice: reich an treuer Liebe
  rationale: „Reich“ gibt die Fülle wieder; „treue Liebe“ hält Zuwendung und verlässliche Loyalität zusammen, die in חֶסֶד anklingen.
- source_word: קֹרְאֶיךָ
  choice: die dich anrufen
  rationale: Bezeichnet Menschen, die sich betend an Gott wenden; „anrufen“ ist dafür im Deutschen prägnant und idiomatisch.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: Herr
  alternative: mein Herr; Gebieter
  rationale: Der Text verwendet den göttlichen Titel und nicht das Tetragramm. „Herr“ ist im Gebetskontext würdig und natürlich, ohne die besondere Schreibkonvention für JHWH einzuführen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Gnade; Güte; beständige Liebe
  rationale: „Treue Liebe“ bewahrt sowohl die liebevolle Zuwendung als auch die Verlässlichkeit des Ausdrucks, ohne ihn ausschließlich als Erbarmen oder als abstrakte Güte zu deuten.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die direkte Anrede und die parallelen Aussagen des hebräischen Verses bleiben erhalten; die seltene Adjektivform סַלָּח wird verständlich mit „bereit zu vergeben“ wiedergegeben.
