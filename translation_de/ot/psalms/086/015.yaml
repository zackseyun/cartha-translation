id: PSA.86.15
reference: Psalms 86:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: de
  text: Du aber, Herr, bist ein barmherziger und gnädiger Gott, langsam zum Zorn und reich an beständiger Liebe und Treue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Wahrheit“. In dieser Bundesformel bezeichnet das hebräische Wort häufig Treue oder Verlässlichkeit, nicht nur Wahrheit im abstrakten Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Du aber
  rationale: Die Konjunktion steht hier im Kontext eines Gegensatzes; die ausdrückliche Wiedergabe des Pronomens bewahrt die Betonung.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier der ehrfurchtsvolle Gottestitel und wird konventionell mit „Herr“ wiedergegeben.
- source_word: אֵל
  choice: Gott
  rationale: Das Wort bezeichnet den Herrn in der an Exodus 34,6 erinnernden Bekenntnisformel als Gott; „Gott“ gibt dies natürlich wieder, ohne eine zusätzliche Bedeutungsnuance einzutragen.
- source_word: רַחוּם
  choice: barmherzig
  rationale: „Barmherzig“ bezeichnet das tiefe Erbarmen Gottes und bildet mit „gnädig“ eine natürliche, würdevolle Wortverbindung.
- source_word: וְ/חַנּוּן
  choice: und gnädig
  rationale: חַנּוּן bezeichnet gnädige Zuwendung und das Gewähren von Gunst; „gnädig“ ist die knappe und etablierte Entsprechung.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „lang an den Nasen“ und beschreibt, dass Gott nicht schnell zornig wird. Die deutsche idiomatische Entsprechung bewahrt dieses Bild semantisch.
- source_word: וְ/רַב חֶסֶד
  choice: und reich an beständiger Liebe
  rationale: רַב bezeichnet Fülle, während חֶסֶד hier Gottes dauerhafte, loyale und erbarmende Zuwendung meint. „Beständige Liebe“ ist verständlich und wahrt die relationale Bundesdimension, ohne sie im Text erklärend zu verengen.
- source_word: וֶ/אֱמֶת
  choice: und Treue
  rationale: In der Verbindung mit חֶסֶד bezeichnet אֱמֶת besonders Verlässlichkeit und Treue. Die mögliche Grundbedeutung „Wahrheit“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe der an Exodus 34,6 erinnernden Bundesformel
  choice: „barmherzig und gnädig … reich an beständiger Liebe und Treue“
  alternative: „erbarmend und gnädig … reich an Güte und Wahrheit“
  rationale: Die gewählte Formulierung erhält den feierlichen Wiedererkennungswert der göttlichen Selbstbeschreibung, ist zugleich modernes Standarddeutsch und gibt חֶסֶד וֶאֱמֶת relational als dauerhafte Liebe und Verlässlichkeit wieder.
- issue: Bedeutung von אֱמֶת
  choice: „Treue“ im Haupttext
  alternative: „Wahrheit“
  rationale: Im formelhaften Paar mit חֶסֶד steht die Verlässlichkeit Gottes im Vordergrund. Da „Wahrheit“ lexikalisch möglich ist und eine echte Bedeutungsdimension darstellt, wird diese Alternative nicht beseitigt, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute biblische Formel bleibt erkennbar, ohne altertümliche Ausdrücke wie „langmütig“ oder „Güte und Wahrheit“ vorauszusetzen. Das großgeschriebene „Du“ markiert die direkte Anrede Gottes gemäß verbreiteter deutscher Bibel- und Frömmigkeitssprache.
