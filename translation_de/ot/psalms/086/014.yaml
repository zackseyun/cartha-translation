source:
  edition: WLC
  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: de
  text: Gott, Vermessene haben sich gegen mich erhoben, und eine Schar Gewalttätiger trachtet mir nach dem Leben[a]; sie haben dich nicht vor Augen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie suchen mein Leben“; gemeint ist, dass sie mich töten wollen.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Sie haben dich nicht vor sich gestellt“, das heißt, sie achten nicht auf Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort fungiert hier als direkte Anrede an Israels Gott. „Gott“ gibt den Vokativ natürlich wieder, ohne ein im Hebräischen nicht eigens vorhandenes „O“ hinzuzufügen.
- source_word: זֵדִים
  choice: Vermessene
  rationale: Das substantivierte Adjektiv bezeichnet stolze, überhebliche oder freche Menschen. „Vermessene“ bewahrt den moralischen Beiklang und passt zum gehobenen Gebetsstil.
- source_word: קָמוּ עָלַי
  choice: haben sich gegen mich erhoben
  rationale: Die Wendung bezeichnet feindseliges Auftreten gegen jemanden. Das Perfekt gibt die vollzogene, weiterhin bedrohliche Handlung angemessen wieder.
- source_word: וַעֲדַת עָרִיצִים
  choice: eine Rotte von Gewalttätigen
  rationale: עֵדָה bezeichnet eine versammelte Gruppe; im feindlichen Kontext vermittelt „Rotte“ den bedrohlichen Zusammenschluss. עָרִיצִים bezeichnet gewalttätige, rücksichtslose oder tyrannische Menschen, ohne zwingend politische Herrscher zu meinen.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: trachtet mir nach dem Leben
  rationale: Die deutsche feste Wendung gibt das hebräische Idiom natürlich wieder und macht dessen lebensbedrohliche Bedeutung verständlich, ohne das Objekt נֶפֶשׁ abzuschwächen.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: sie haben dich nicht vor Augen
  rationale: Die Formulierung bewahrt das räumliche Bild, Gott nicht vor sich zu stellen, und vermittelt zugleich die gemeinte Missachtung Gottes.
theological_decisions:
- issue: Ausdrücklichkeit der vokativischen Anrede
  choice: Gott
  alternative: O Gott
  rationale: Der Kontext macht die Anrede eindeutig; ein zusätzliches „O“ wäre möglich, ist aber nicht durch ein eigenes hebräisches Element gefordert.
- issue: Wiedergabe der tödlichen Absicht in בִּקְשׁוּ נַפְשִׁי
  choice: trachtet mir nach dem Leben
  alternative: sucht meine Seele / sucht mein Leben
  rationale: Die gewählte deutsche Redewendung bildet das hebräische Idiom und seine wahrscheinliche Tötungsabsicht idiomatisch ab, ohne eine konfessionelle oder weitergehende Deutung einzutragen.
- issue: Bedeutung von Gott nicht vor sich stellen
  choice: sie haben dich nicht vor Augen
  alternative: sie haben dich nicht vor sich gestellt
  rationale: Die natürliche deutsche Wendung erhält die Bildhaftigkeit und lässt sowohl fehlende Beachtung als auch bewusste Missachtung anklingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmtypischer Bildsprache. „Vermessene“ und „Rotte“ sind leicht gehoben, aber verständlich und tragen den moralisch-feindseligen Ton des Hebräischen. Alle Fußnotenmarker stehen an der jeweils erläuterten Stelle im Haupttext.
