  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: de
  text: 'Ein Gebet Davids.


    Neige dein Ohr zu mir, HERR, und antworte mir, denn ich bin arm und bedürftig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn ich bin gebeugt und bedürftig«. Das hebräische Wort kann einen armen, bedrängten oder erniedrigten Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Ein Gebet Davids
  rationale: Die Überschrift wird natürlich und zugleich formnah wiedergegeben; die hebräische Konstruktion kann Davids Autorschaft oder Zuordnung bezeichnen.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Neige dein Ohr zu mir
  rationale: Bewahrt das hebräische Bild einer aufmerksamen Zuwendung; „zu mir“ macht die im Deutschen erforderliche Richtung natürlich deutlich.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen ist würdig, geläufig und unterscheidet ihn von אֲדֹנָי; der zugrunde liegende Eigenname bleibt erkennbar markiert.
- source_word: עֲנֵנִי
  choice: antworte mir
  rationale: Direkte, formnahe Wiedergabe der Bitte.
- source_word: עָנִי וְאֶבְיוֹן
  choice: arm und bedürftig
  rationale: Gibt die naheliegende soziale Bedeutung des Wortpaars wieder, ohne die mögliche Bedeutung „gebeugt/bedrängt“ von עָנִי zu verschweigen.
theological_decisions:
- issue: Bedeutung von עָנִי
  choice: arm
  alternative: gebeugt / bedrängt / elend
  rationale: Der Parallelismus mit אֶבְיוֹן stützt „arm“, doch das Wort kann ebenso Leid, Bedrängnis oder Erniedrigung bezeichnen; diese echte Mehrdeutigkeit wird in der Fußnote erhalten.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: Die deutsche Bibeltradition kennzeichnet den Gottesnamen gewöhnlich mit „HERR“ in Kapitälchen. Diese Entscheidung folgt einer verbreiteten Übersetzungskonvention und legt keine besondere theologische Deutung des Namens fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Imperativ „Neige dein Ohr“ bewahrt das hebräische Bild, bleibt aber allgemein verständlich. Die Überschrift steht als eigene Zeile; der Fußnotenmarker folgt unmittelbar auf die mehrdeutige Wendung.
