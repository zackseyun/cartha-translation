source:
  edition: WLC
  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: de
  text: Alle Völker, die du gemacht hast, werden kommen und sich vor dir niederwerfen[a], Herr, und deinen Namen ehren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und dich anbeten“; das hebräische Verb bezeichnet ein ehrfürchtiges Sich-Niederwerfen und kann daher auch „anbeten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und deinen Namen verherrlichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Alle Völker
  rationale: Die kollektive Wendung bewahrt den umfassenden Geltungsbereich und gibt גּוֹיִם im Psalmkontext natürlich als „Völker“ wieder.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: die du gemacht hast
  rationale: „Gemacht“ entspricht dem breiten Bedeutungsfeld von עשה, lässt den Schöpfungsbezug erkennen und legt ihn nicht enger als der hebräische Wortlaut fest.
- source_word: יָבֹאוּ
  choice: werden kommen
  rationale: Das Imperfekt bezeichnet hier am natürlichsten eine erwartete zukünftige Handlung.
- source_word: וְיִשְׁתַּחֲווּ
  choice: und sich niederwerfen
  rationale: Die Formulierung bewahrt sowohl die körperliche Gebärde des Sich-Niederwerfens als auch ihren ehrfürchtigen, gottesdienstlichen Sinn.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Idiomatiche und genaue Wiedergabe der räumlich-präsentischen Wendung „vor deinem Angesicht/in deiner Gegenwart“.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Als ehrfürchtiger Gottestitel wird אֲדֹנָי im modernen deutschen Bibelregister angemessen mit „Herr“ wiedergegeben.
- source_word: וִיכַבְּדוּ לִשְׁמֶךָ
  choice: und deinen Namen ehren
  rationale: כבד im Piel bedeutet hier „ehren/verherrlichen“; „deinen Namen ehren“ ist natürliches Deutsch und wahrt den Gedanken, Gottes offenbarer Identität Ehre zu erweisen.
theological_decisions:
- issue: Umfang der Reaktion der Völker
  choice: Alle von Gott gemachten Völker werden künftig kommen und sich vor ihm niederwerfen.
  alternative: Die Aussage könnte als dichterische Verallgemeinerung über viele Völker verstanden werden.
  rationale: כָּל גּוֹיִם ist uneingeschränkt formuliert. Die Übersetzung bewahrt diesen universalen Wortlaut, ohne seine genaue heilsgeschichtliche Erfüllung auszudeuten.
- issue: Bedeutung von וְיִשְׁתַּחֲווּ
  choice: sich niederwerfen
  alternative: anbeten
  rationale: Die konkrete Gebärde kann Anbetung ausdrücken, ist aber lexikalisch weiter. Der Haupttext erhält das Bild; die Fußnote nennt die sinngemäße kultische Wiedergabe.
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: Herr
  alternative: mein Herr; Gebieter
  rationale: Im Gottesgebrauch fungiert die Form als ehrfürchtiger Titel. „Herr“ ist verständlich, würdig und konfessionell nicht verengend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Satzführung. Das konkrete Bild des Niederwerfens bleibt im Haupttext erhalten; mögliche kultische und intensivere Bedeutungsnuancen werden in den Fußnoten ausgewiesen.
