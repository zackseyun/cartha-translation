lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Am Tag meiner Not
  rationale: Gibt die Zeitangabe und die persönliche Bedrängnis knapp und idiomatisch wieder.
- source_word: אֶקְרָאֶךָּ
  choice: rufe ich zu dir
  rationale: Das Verb קרא mit Personenbezug bezeichnet hier das hilfesuchende Anrufen; „zu dir rufen“ ist im Deutschen natürlich und wahrt den Gebetscharakter.
- source_word: כִּי
  choice: denn
  rationale: Bewahrt die naheliegende begründende Funktion der Konjunktion, ohne sie stärker kausal auszudeuten.
- source_word: תַעֲנֵנִי
  choice: du antwortest mir
  rationale: Das hebräische Imperfekt kann im Kontext zuversichtliche Erwartung ausdrücken; das deutsche Präsens erhält die im Vers ausgesprochene Gewissheit.
theological_decisions:
- issue: Zeit- oder Gewissheitsnuance von תַעֲנֵנִי
  choice: du antwortest mir
  alternative: du wirst mir antworten
  rationale: Das Präsens folgt der Formulierung als begründende Glaubensgewissheit und legt den Satz nicht ausschließlich auf eine zukünftige Antwort fest.
- issue: Funktion von כִּי
  choice: denn
  alternative: weil
  rationale: „Denn“ gibt die Begründung wieder und bewahrt zugleich den feierlichen, aber modernen Gebetston.
