  text: חָנֵּ֥/נִי אֲדֹנָ֑/י כִּ֥י אֵלֶ֥י/ךָ אֶ֝קְרָ֗א כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: de
  text: Sei mir gnädig[a], Herr, denn zu dir rufe ich den ganzen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hab Erbarmen mit mir.“ Das hebräische Verb kann eine Bitte um gnädige Zuwendung oder um Erbarmen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sei mir gnädig
  rationale: Der Imperativ von חנן mit Suffix der 1. Person Singular bittet um gnädige Zuwendung. Die Wendung ist im Deutschen natürlich und würdevoll; „Hab Erbarmen mit mir“ bleibt eine mögliche kontextuelle Wiedergabe.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier der an Gott gerichtete Herrschaftstitel und wird im deutschen Gebetsstil angemessen mit „Herr“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt die Begründung der Bitte ein; „denn“ bewahrt den kausalen Zusammenhang knapp und idiomatisch.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition אֶל mit Suffix bezeichnet die Richtung auf den Angeredeten hin; zusammen mit „rufen“ ist „zu dir“ die natürliche deutsche Entsprechung.
- source_word: אֶקְרָא
  choice: rufe ich
  rationale: קרא bedeutet „rufen“ oder kontextuell „(um Hilfe) rufen“. „Rufe ich“ bildet das Verb ohne zusätzliche Intensivierung ab.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung bedeutet wörtlich „den ganzen Tag“ und bezeichnet hier das anhaltende oder wiederholte Rufen im Tagesverlauf.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: Herr
  alternative: mein Herr; Gebieter
  rationale: „Herr“ ist die übliche, kontextgerechte Übersetzung des in der Anrede Gottes gebrauchten Titels. Sie vermeidet sowohl eine unnötige Ausdeutung des formalen Elements als auch eine im Gebet unnatürliche Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Gebetssprache. Die Satzstellung bewahrt den unmittelbaren Anruf und den begründenden Anschluss des Hebräischen.
