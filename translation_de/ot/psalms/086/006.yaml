  source_fidelity: 'Die Übersetzung gibt beide hebräischen Imperative angemessen abgestuft wieder: „Neige dein Ohr … zu“ bewahrt das Bild von הַאֲזִינָה, während „achte auf“ den Aufruf zum aufmerksamen Hören in וְהַקְשִׁיבָה ausdrückt. „meinem Gebet“ entspricht תְּפִלָּתִי, und „die Stimme meines Flehens“ bewahrt die ausdrücklich genannte „Stimme“ (בְּקוֹל) sowie den inständigen Charakter von תַּחֲנוּנוֹתַי. Der deutsche Kollektivsingular „Flehen“ ist hier eine idiomatische Wiedergabe des hebräischen Plurals.'
