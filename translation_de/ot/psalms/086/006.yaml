source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה יְ֭הוָה תְּפִלָּתִ֑/י וְ֝/הַקְשִׁ֗יבָ/ה בְּ/ק֣וֹל תַּחֲנוּנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: de
  text: Neige dein Ohr, Jahwe, meinem Gebet zu, und achte auf die Stimme meines Flehens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Neige dein Ohr … zu
  rationale: Die bildhafte hebräische Aufforderung wird in einer verständlichen, würdevollen deutschen Wendung bewahrt und nicht zum allgemeineren »höre« verflacht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תְּפִלָּתִי
  choice: meinem Gebet
  rationale: Direkte und im Gebetskontext natürliche Wiedergabe des Substantivs mit Suffix der ersten Person Singular.
- source_word: וְהַקְשִׁיבָה
  choice: und achte auf
  rationale: Gibt den Aufruf zu aufmerksamem Hinhören wieder und erhält die poetische Abstufung gegenüber der ersten Aufforderung.
- source_word: בְּקוֹל
  choice: auf die Stimme
  rationale: Bewahrt das ausdrücklich genannte קוֹל und gibt die Präposition in idiomatischem Deutsch wieder.
- source_word: תַּחֲנוּנוֹתָי
  choice: meines Flehens
  rationale: »Flehen« vermittelt die eindringlichen Bitten um Gunst oder Erbarmen in natürlichem, würdigem Deutsch; der deutsche Kollektivsingular gibt den hebräischen Plural idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers redet Israels Gott mit seinem Namen an; die Transliteration bewahrt diesen Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität der beiden Aufforderungen zum Hören bleibt erhalten; die bildhafte erste Wendung ist bewusst etwas feierlicher, aber allgemein verständlich.
