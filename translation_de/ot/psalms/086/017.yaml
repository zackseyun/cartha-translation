  text: עֲשֵֽׂה עִמִּ֥/י א֗וֹת לְ/ט֫וֹבָ֥ה וְ/יִרְא֣וּ שֹׂנְאַ֣/י וְ/יֵבֹ֑שׁוּ כִּֽי אַתָּ֥ה יְ֝הוָ֗ה עֲזַרְתַּ֥/נִי וְ/נִחַמְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: de
  text: Erweise mir ein Zeichen zum Guten[a], damit die, die mich hassen, es sehen und beschämt dastehen; denn du, Jahwe, hast mir geholfen und mich getröstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erweise mir ein Zeichen deiner Gunst.“ Wörtlich: „Tu/mache mit mir ein Zeichen zum Guten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי
  choice: Tu an mir
  rationale: Die Wendung bewahrt die ungewöhnliche hebräische Konstruktion „tu/mache mit mir“, klingt im Deutschen jedoch verständlicher als „mache mit mir“. Sie lässt offen, ob das Zeichen am Beter geschieht oder ihm zugutekommt.
- source_word: אוֹת לְטוֹבָה
  choice: ein Zeichen zum Guten
  rationale: „Zeichen“ entspricht אוֹת; „zum Guten“ gibt לְטוֹבָה eng wieder und bewahrt die mögliche Bedeutung von Wohlergehen, Gunst oder einem günstigen Ausgang.
- source_word: וְיִרְאוּ
  choice: damit … es sehen
  rationale: Der mit וְ angeschlossene Imperfekt bezeichnet hier plausibel Zweck oder Folge der Bitte. Das ergänzte „es“ bezieht sich im Deutschen natürlich auf das Zeichen.
- source_word: שֹׂנְאַי
  choice: die, die mich hassen
  rationale: Die substantivierte Partizipialform bezeichnet wörtlich diejenigen, die den Beter hassen; dies ist genauer als das allgemeinere „meine Feinde“.
- source_word: וְיֵבֹשׁוּ
  choice: beschämt werden
  rationale: בוש kann Scham, öffentliches Scheitern oder enttäuschte Erwartung ausdrücken. „Beschämt werden“ bewahrt die Ergebnisnuance, ohne nur ein inneres Schamgefühl zu bezeichnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: עֲזַרְתַּנִי
  choice: hast mir geholfen
  rationale: Das Perfekt bezeichnet vollzogenes Handeln Gottes; das deutsche Perfekt ist hier natürlich und zeigt dessen gegenwärtige Bedeutung.
- source_word: וְנִחַמְתָּנִי
  choice: mich getröstet
  rationale: נחם im Piel bedeutet hier trösten oder Trost schenken; „getröstet“ ist die natürliche moderne Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Art des erbetenen Zeichens
  choice: ein Zeichen zum Guten
  alternative: ein Zeichen deiner Gunst
  rationale: Der Text nennt weder ausdrücklich ein Wunder noch definiert er das Zeichen ausschließlich als Gunstbeweis. Die engere Formulierung erhält die Bedeutungsbreite von לְטוֹבָה.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bitte „Tu an mir“ spiegelt bewusst die konkrete hebräische Wendung; die Fußnote bietet eine flüssigere, aber stärker deutende Alternative.
