  text: פְּנֵ֥ה אֵלַ֗/י וְ/חָ֫נֵּ֥/נִי תְּנָֽ/ה עֻזְּ/ךָ֥ לְ/עַבְדֶּ֑/ךָ וְ֝/הוֹשִׁ֗יעָ/ה לְ/בֶן אֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: de
  text: Wende dich mir zu und sei mir gnädig! Gib deinem Diener deine Kraft und rette den Sohn deiner Dienerin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Wende dich mir zu
  rationale: Die Wendung gibt die gerichtete Hinwendung Gottes zum Beter natürlich und zugleich nahe am hebräischen Ausdruck wieder.
- source_word: וְחָנֵּנִי
  choice: und sei mir gnädig
  rationale: חנן bezeichnet gnädige Zuwendung bzw. Gunst; „sei mir gnädig“ bewahrt diesen Akzent ohne ihn auf bloßes Mitleid zu verengen.
- source_word: תְּנָה עֻזְּךָ
  choice: Gib … deine Kraft
  rationale: Die schlichte Bitte entspricht dem Imperativ von נתן und gibt עֹז mit dem im Deutschen natürlichen „Kraft“ wieder.
- source_word: לְעַבְדֶּךָ
  choice: deinem Diener
  rationale: „Diener“ wahrt die demütige Selbstbezeichnung und passt zum Gebetston, ohne die soziale Bedeutung unnötig auf „Sklave“ festzulegen.
- source_word: וְהוֹשִׁיעָה
  choice: und rette
  rationale: „Rette“ ist die direkte und kontextgemäße Wiedergabe des Imperativs von ישׁע.
- source_word: לְבֶן אֲמָתֶךָ
  choice: den Sohn deiner Magd
  rationale: Die Formulierung bewahrt die ausdrückliche mütterliche Beziehung und unterscheidet אמה sprachlich von עבד; „Magd“ ist dichterisch knapp, aber erklärungsbedürftig.
theological_decisions:
- issue: Demütige Selbstbezeichnungen עבד und אמה
  choice: Diener / Magd
  alternative: Sklave / Sklavin; Diener / Dienerin
  rationale: Die unterschiedlichen hebräischen Bezeichnungen bleiben unterscheidbar. Zugleich wird die demütige Zugehörigkeit zu Gott ausgedrückt, ohne den Text einseitig auf den rechtlichen Sklavenstatus festzulegen.
- issue: Bedeutung der Wendung „Sohn deiner Magd“
  choice: Die konkrete familiäre Formulierung bleibt unaufgelöst stehen.
  alternative: Freie Deutung als „dein von Geburt an ergebener Diener“
  rationale: Der hebräische Text kann Zugehörigkeit von Geburt an oder eine geerbte Bindung anklingen lassen, spricht dies aber nicht ausdrücklich aus; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit knappen Imperativen. „Magd“ trägt einen leicht traditionellen poetischen Ton; die Fußnote erklärt die heute weniger geläufige Bezeichnung.
