    rationale: Die weibliche Form „Dienerin“ ist gegenwartsdeutsch, wahrt die Unterscheidung von עבד und אמה und ist im Gebetsregister idiomatisch.
  - severity: medium
    issue: Die Fußnote behauptet als mögliche Bedeutung eine Zugehörigkeit zu Gott „von Geburt an“.
    rationale: Die Formulierung kann einen solchen Hintergrund oder eine demütige Selbstbezeichnung nahelegen, sagt ihn aber nicht ausdrücklich aus. Die Fußnote lenkt daher über das lexikalisch Ausgedrückte hinaus und sollte entfallen.
