review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die vier Imperative und ihre Bezüge zutreffend wieder. Die beiden Selbstbezeichnungen bleiben als „Diener“ und die weibliche Entsprechung unterscheidbar. Die Wendung „Sohn deiner ...“ wird zu Recht nicht zu einer expliziten Aussage über eine ererbte Gottesbeziehung ausgeweitet.
  naturalness: „Wende dich mir zu“, „sei mir gnädig“, „Gib deinem Diener deine Kraft“ und „rette“ sind natürliches, würdiges modernes Gebetsdeutsch. „Magd“ ist jedoch im heutigen Standarddeutsch deutlich archaisch; „Dienerin“ ist die natürliche moderne Entsprechung und bewahrt den poetisch-demütigen Registerwert im Kontext.
  terminology: „Gnädig“, „Diener“, „Kraft“ und „rette“ treffen die hebräischen Begriffe angemessen. „Dienerin“ gibt אמה modern und ohne unnötige soziale oder konfessionelle Zuspitzung wieder.
  issues:
