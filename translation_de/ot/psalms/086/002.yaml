review_pass:
  verdict: revise
  source_fidelity: „Bewahre mein Leben“ gibt שָׁמְרָה נַפְשִׁי zutreffend als Bitte um Schutz bzw. Erhaltung wieder. „Denn ich bin dir treu“ ist eine angemessene kontextuelle Wiedergabe von כִּי חָסִיד אָנִי. „Rette deinen Diener“ entspricht dem zweiten Imperativ. Das Partizip הַבּוֹטֵחַ אֵלֶיךָ bezeichnet den betenden Diener als den auf Gott Vertrauenden.
  naturalness: Der letzte Satz der vorliegenden Fassung („… mein Gott; er vertraut auf dich“) ist zwar verständlich, trennt die partizipiale Charakterisierung unnötig vom Akkusativobjekt und erzeugt einen abrupten Wechsel zu „er“. Ein Relativsatz bei „deinen Diener“ ist im modernen Standarddeutsch natürlicher und klarer.
  terminology: „Bewahre“, „Leben“, „dir treu“, „Diener“ und „mein Gott“ sind registergerecht und theologisch nicht überdeutet. Die Fußnoten erläutern die lexikalischen Spielräume sachgerecht.
  issues:
  - severity: medium
    issue: Der Bezug von „er vertraut auf dich“ ist syntaktisch nur nachträglich erschließbar.
    rationale: Das hebräische Partizip steht als Charakterisierung des „deinen Dieners“. Deutsch sollte diesen Bezug unmittelbar markieren. Ein Relativsatz wahrt den Sinn, ohne den Beter in eine distanzierte dritte Person abzusetzen.
  revised_text: Mein Gott, bewahre mein Leben[a], denn ich bin dir treu[b]. Rette deinen Diener, der auf dich vertraut.
