revisions:
- from: Bewahre mein Leben[a], denn ich bin dir treu[b]. Rette deinen Diener, mein Gott; er vertraut auf dich.
  to: Mein Gott, bewahre mein Leben[a], denn ich bin dir treu[b]. Rette deinen Diener, der auf dich vertraut.
  rationale: Die Anrede „Mein Gott“ wird an den Satzanfang gestellt, und das hebräische Partizip wird als Relativsatz unmittelbar an „deinen Diener“ angeschlossen. Damit ist eindeutig, dass der Beter beziehungsweise Gottes Diener auf Gott vertraut. Die Änderung ist rein syntaktisch-stilistisch und bewahrt Aussage, Reihenfolge der Bitten und den würdigen Gebetsregister.
