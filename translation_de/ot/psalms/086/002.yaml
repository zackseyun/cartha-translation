source:
  edition: WLC
  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: de
  text: Mein Gott, bewahre mein Leben[a], denn ich bin dir treu[b]. Rette deinen Diener, der auf dich vertraut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Seele“; gemeint ist hier wahrscheinlich „mein Leben“ oder „mich selbst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „denn ich bin fromm“ oder „denn ich bin loyal“. Das hebräische Wort bezeichnet treue Hingabe an Gott, nicht sündlose Vollkommenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: Bewahre
  rationale: Der Imperativ von שׁמר bittet Gott um schützende Erhaltung. „Bewahre“ ist im Deutschen natürlich, prägnant und für ein Gebet angemessen.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang der Bitte um Rettung das Leben beziehungsweise die ganze Person, nicht vorrangig eine vom Körper getrennte Seele.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die vorausgehende Bitte ein; „denn“ gibt diese kausale Beziehung in gehobener, aber heutiger Gebetssprache wieder.
- source_word: חָסִיד
  choice: dir treu
  rationale: חָסִיד beschreibt hier eine von Bundestreue und Hingabe geprägte Beziehung zu Gott. Die Ergänzung „dir“ macht den relationalen Sinn im Deutschen deutlich, ohne moralische Vollkommenheit zu behaupten.
- source_word: הוֹשַׁע
  choice: Rette
  rationale: Der Imperativ von ישׁע bezeichnet die erbetene Rettung aus Gefahr und bewahrt zugleich die breitere theologische Resonanz des Verbs.
- source_word: עַבְדְּךָ
  choice: deinen Diener
  rationale: Im Gebet ist עֶבֶד eine demütige Selbstbezeichnung gegenüber Gott. „Diener“ gibt diese Beziehung natürlicher wieder als „Sklave“.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Possessivform wird direkt wiedergegeben und als Anrede verstanden.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: er vertraut auf dich
  rationale: Das Partizip bezeichnet anhaltendes Vertrauen. Ein eigener kurzer Satz macht im Deutschen klar, dass sich die Aussage auf den betenden Diener bezieht, ohne den Sinn auszuweiten.
theological_decisions:
- issue: Selbstbezeichnung des Beters als חָסִיד
  choice: „ich bin dir treu“ als Aussage loyaler, frommer Hingabe
  alternative: „ich bin fromm/heilig“ oder „ich gehöre zu deinen Getreuen“
  rationale: Der Beter beruft sich auf seine treue Beziehung zu Gott, behauptet aber weder Sündlosigkeit noch einen Verdienstanspruch. So bleibt die Spannung erhalten, dass der Treue dennoch ganz auf Gottes Rettung angewiesen ist.
- issue: Bezug von הַבּוֹטֵחַ אֵלֶיךָ
  choice: Das Partizip beschreibt den Diener beziehungsweise den Beter
  alternative: Eine formal mögliche, durch die Wortstellung begünstigte engere Verbindung der umstehenden Anredeglieder
  rationale: Inhalt und Gebetskontext sprechen dafür, dass der Beter sich als den auf Gott Vertrauenden bezeichnet. Die deutsche Satzteilung verhindert eine irreführende Zuordnung des Relativsatzes zu „mein Gott“.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die knappen Imperative bleiben erhalten; „dir treu“ stellt den relationalen Sinn von חָסִיד klar. Das Semikolon gliedert die Anrede „mein Gott“ und die anschließende Vertrauensaussage verständlich.
