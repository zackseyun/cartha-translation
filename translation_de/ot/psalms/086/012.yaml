source:
  edition: WLC
  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: de
  text: Ich will dir danken[a], Herr, mein Gott, von ganzem Herzen, und deinen Namen ewig ehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „preisen“. Das hebräische Verb kann im gottesdienstlichen Zusammenhang sowohl Danken als auch Preisen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Ich will dir danken
  rationale: ידה im Hifil kann im gottesdienstlichen Zusammenhang sowohl „danken“ als auch „preisen“ bedeuten. „Dir danken“ ist im Deutschen eine natürliche direkte Anrede und bewahrt die lexikalische Mehrdeutigkeit durch eine Fußnote. Die Kohortativ- bzw. Zukunftsnuance wird als entschlossener Vorsatz mit „ich will“ wiedergegeben.
- source_word: אֲדֹנָי אֱלֹהַי
  choice: Herr, mein Gott
  rationale: Beide Gottesbezeichnungen und das ausdrückliche Suffix der ersten Person Singular werden bewahrt. Das Komma macht die doppelte direkte Anrede im Deutschen klar.
- source_word: בְּכָל לְבָבִי
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung gibt die ungeteilte innere Hingabe natürlich wieder und bewahrt das hebräische Herzbild.
- source_word: וַאֲכַבְּדָה
  choice: und … ehren
  rationale: כבד im Piel bedeutet „ehren, verherrlichen“. In Verbindung mit „deinen Namen“ ist „ehren“ idiomatisch, würdig und vermeidet eine unnötig kirchensprachliche Verengung.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die wörtliche Metonymie des Hebräischen bleibt erhalten; der Name steht zugleich für Gottes offenbarten Charakter und Ansehen.
- source_word: לְעוֹלָם
  choice: ewig
  rationale: „Ewig“ gibt die zeitlich unbegrenzte Dauer knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von ידה im Hifil
  choice: danken
  alternative: preisen
  rationale: Beide Bedeutungen sind im Lobpreiszusammenhang möglich. Der Haupttext wählt das natürliche deutsche „danken“, während die Fußnote die echte lexikalische Alternative „preisen“ offenhält.
- issue: Wiedergabe der Anrede אֲדֹנָי אֱלֹהַי
  choice: Herr, mein Gott
  alternative: Herr, mein Gott! / Mein Herr, mein Gott
  rationale: „Herr, mein Gott“ bewahrt Titel, persönliche Beziehung und direkte Anrede, ohne ein nicht ausdrücklich vorhandenes Ausrufewort oder eine zusätzliche Possessivmarkierung bei אֲדֹנָי einzuführen.
- issue: Wiedergabe von כבד mit Gottes Namen als Objekt
  choice: deinen Namen ehren
  alternative: deinen Namen verherrlichen
  rationale: „Ehren“ entspricht dem Grundsinn und klingt in modernem Deutsch natürlich. „Verherrlichen“ ist ebenfalls möglich, kann aber stärker theologisch festgelegt wirken, als das hebräische Verb verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Vorsatzsätze bleibt erhalten; „ich will“ bringt den entschlossenen, gelöbnisartigen Charakter der hebräischen Verbformen zum Ausdruck.
