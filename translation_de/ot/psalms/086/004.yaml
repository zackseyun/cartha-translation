  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: de
  text: Erfreue die Seele deines Dieners[a], denn zu dir, Herr, erhebe ich meine Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erfreue das Leben deines Dieners“ oder „Erfreue deinen Diener“; das hebräische Wort nefesch kann je nach Zusammenhang „Seele“, „Leben“ oder „Selbst“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: Erfreue
  rationale: Der Piel-Imperativ richtet eine unmittelbare Bitte an Gott, Freude zu bewirken. „Erfreue“ ist knapp, würdig und erhält die Imperativform.
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: Seele / meine Seele
  rationale: נֶפֶשׁ bezeichnet hier die Person beziehungsweise ihr inneres Leben vor Gott. „Seele“ bewahrt den Gebetston und die bewusste Wiederholung beider Vorkommen, ohne eine technische Anthropologie festzulegen.
- source_word: עַבְדֶּךָ
  choice: deines Dieners
  rationale: Im Gebet des Psalms bezeichnet עֶבֶד den Beter in demütigem Dienst gegenüber Gott. „Diener“ trifft diesen Beziehungs- und Gebrauchsrahmen besser als „Sklave“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung der Bitte ein; „denn“ erhält den logischen Zusammenhang und passt zum gehobenen Gebetsstil.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: אֶל bezeichnet die Ausrichtung auf Gott und verbindet sich im Deutschen natürlich mit „die Seele erheben“.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der göttliche Hoheitstitel אֲדֹנָי wird in diesem Gebetszusammenhang angemessen mit „Herr“ wiedergegeben.
- source_word: אֶשָּׂא
  choice: erhebe ich
  rationale: נשׂא bildet mit נֶפֶשׁ eine bildhafte Wendung für die vertrauensvolle Hinwendung zu Gott. „Erhebe ich meine Seele“ bewahrt diese Metapher.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ in der Gebetssprache
  choice: Beide Vorkommen mit „Seele“ wiedergeben
  alternative: „Leben“, „Selbst“ oder „Inneres“
  rationale: „Seele“ erhält die geistliche und poetische Aussagekraft sowie die Wiederholung, ohne den Bedeutungsumfang von נֶפֶשׁ auf eine bestimmte anthropologische Lehre festzulegen.
- issue: עֶבֶד als Bezeichnung des Beters gegenüber Gott
  choice: „Diener“
  alternative: „Sklave“
  rationale: Hier steht die demütige Zugehörigkeit und der Dienst des Beters im Vordergrund, nicht sein gesellschaftlicher Rechtsstatus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmtypischem Gebetston. Die Wortstellung „zu dir, Herr“ betont entsprechend dem Hebräischen das Ziel der vertrauensvollen Hinwendung; die Wiederholung von „Seele“ bleibt erhalten.
