base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/010.yaml
  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: de
  text: Denn du bist groß und tust Wunder; du allein bist Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte beziehungsweise das vorausgehende Lob ein und bewahrt den verbindenden Charakter.
- source_word: גָדוֹל
  choice: groß
  rationale: Gibt die Größe an Rang und Macht direkt, natürlich und dem Lobkontext angemessen wieder.
- source_word: וְעֹשֵׂה
  choice: und tust
  rationale: Das Partizip bezeichnet Gottes charakteristisches, fortdauerndes Handeln; das deutsche Präsens gibt dies knapp und idiomatisch wieder.
- source_word: נִפְלָאוֹת
  choice: Wunder
  rationale: Bezeichnet außergewöhnliche, Staunen hervorrufende Taten Gottes; „Wunder“ ist im Deutschen prägnant und natürlich.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der morphologischen Pluralform bezeichnet das Wort hier aufgrund der direkten Anrede und der Ausschließlichkeitsaussage eindeutig den einen Gott.
- source_word: לְבַדֶּךָ
  choice: du allein
  rationale: Die Form bedeutet „du für dich allein“ beziehungsweise „du allein“; diese Wortstellung hebt die Ausschließlichkeit im Deutschen klar hervor.
theological_decisions:
- issue: Ausschließliche Aussage über Gott im Schlusssatz
  choice: du allein bist Gott
  alternative: du bist Gott, du allein
  rationale: Die gewählte Formulierung stellt die durch לְבַדֶּךָ ausgedrückte Ausschließlichkeit klar heraus, ohne die monotheistische Aussage philosophisch zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Keine Fußnote nötig, da die hebräische Aussage im Deutschen eindeutig und natürlich wiedergegeben werden kann.
