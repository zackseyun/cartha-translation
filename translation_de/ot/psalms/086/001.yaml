  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: de
  text: Ein Gebet Davids. Neige dein Ohr, Jahwe, und antworte mir, denn ich bin arm[a] und bedürftig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn ich bin bedrängt und bedürftig“. Das hebräische Wort עָנִי kann einen armen, bedrängten oder erniedrigten Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Ein Gebet
  rationale: Als Überschrift bezeichnet das alleinstehende Substantiv die Gattung des Psalms; „Ein Gebet“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der Genitiv bewahrt die in der hebräischen Überschriftsformel liegende Offenheit zwischen Urheberschaft und allgemeiner Zuordnung, ohne sie näher festzulegen.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Neige dein Ohr
  rationale: Die wörtlich-metaphorische Wendung beschreibt aufmerksames Hören und ist auch im heutigen gehobenen Deutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲנֵנִי
  choice: antworte mir
  rationale: ענה bedeutet im Gebetszusammenhang passend „antworten“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Bitte ein.
- source_word: עָנִי
  choice: arm
  rationale: Das Wort kann materielle Armut sowie Bedrängnis oder Erniedrigung bezeichnen. „Arm“ gibt den konkreten Grundsinn wieder; die weitere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: וְאֶבְיוֹן
  choice: und bedürftig
  rationale: „Bedürftig“ bildet die Hilfsbedürftigkeit des hebräischen Wortes ab und wahrt die Parallelität mit עָנִי.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zuordnung der Überschrift לְדָוִד
  choice: Davids
  alternative: von David; für David
  rationale: Die knappe deutsche Genitivform lässt wie die hebräische Formel offen, ob vor allem Urheberschaft, Zugehörigkeit oder Zuordnung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetsmetapher „Neige dein Ohr“ bleibt erhalten; Satzbau und Wortwahl sind knapp und gut verständlich.
