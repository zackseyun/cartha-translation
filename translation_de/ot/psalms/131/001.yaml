source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לְ/דָ֫וִ֥ד יְהוָ֤ה לֹא גָבַ֣הּ לִ֭בִּ/י וְ/לֹא רָמ֣וּ עֵינַ֑/י וְ/לֹֽא הִלַּ֓כְתִּי בִּ/גְדֹל֖וֹת וּ/בְ/נִפְלָא֣וֹת מִמֶּֽ/נִּי׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a] Von David.[b]


    Jahwe, mein Herz ist nicht hochmütig,

    und meine Augen sind nicht hoch erhoben.

    Ich gehe nicht mit Dingen um,

    die zu groß und zu wunderbar für mich sind.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Ein Lied der Aufstiege“. Gemeint sein kann ein Lied für den Aufstieg nach Jerusalem beziehungsweise ein Lied aus der so bezeichneten Sammlung.
    reason: lexical_alternative
  - marker: b
    text: Oder „Für David“ oder „David zugehörig“. Die hebräische Überschrift kann Verfasserschaft, Zuordnung oder Widmung ausdrücken.
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „die über mich hinausgehen“. Gemeint sind Angelegenheiten, die das angemessene Maß oder Vermögen des Sprechers übersteigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Wendung bezeichnet die Liedersammlung Psalm 120–134. „Wallfahrtslied“ ist im modernen Deutschen verständlich und gibt die wahrscheinlich gemeinte Verwendung wieder; die wörtliche Aufstiegsmetaphorik wird in der Fußnote bewahrt.
- source_word: לְדָוִד
  choice: Von David
  rationale: „Von David“ ist als deutsche Überschrift natürlich, ohne die Präposition לְ so eindeutig auf Verfasserschaft festzulegen wie „verfasst von“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: גָבַהּ לִבִּי
  choice: mein Herz ist nicht hochmütig
  rationale: Das Bild vom „hohen“ Herzen bezeichnet hier Stolz oder Hochmut. „Hochmütig“ gibt den idiomatischen Sinn klar und würdig wieder.
- source_word: רָמוּ עֵינַי
  choice: meine Augen blicken nicht überheblich
  rationale: Das Hebräische spricht wörtlich von erhobenen Augen und bezeichnet damit eine stolze, überhebliche Haltung. Die deutsche Formulierung bewahrt den Bezug zu den Augen und erschließt zugleich den Sinn.
- source_word: הִלַּכְתִּי
  choice: ich befasse mich nicht
  rationale: הלך bezeichnet hier bildhaft das Sichbewegen oder Umgehen in einem Bereich. „Ich befasse mich nicht“ ist im Deutschen natürlich und drückt aus, dass der Sprecher sich solche Angelegenheiten nicht anmaßt.
- source_word: בִּגְדֹלוֹת וּבְנִפְלָאוֹת מִמֶּנִּי
  choice: mit Dingen, die zu groß und zu wunderbar für mich sind
  rationale: Die substantivierten Pluralformen bezeichnen große und wunderbare Angelegenheiten; מִמֶּנִּי markiert, dass sie das angemessene Maß oder Vermögen des Sprechers übersteigen. Die Übersetzung erhält sowohl diese Begrenzung als auch das spannungsreiche „wunderbar“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottes persönlichen Namen. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Überschrift לְדָוִד
  choice: Von David
  alternative: Für David / David zugehörig
  rationale: Die Präposition לְ kann in Psalmüberschriften Verfasserschaft, Zuordnung oder Widmung anzeigen. Die Hauptfassung bleibt knapp; die Fußnote macht die nicht völlig auflösbare Zuordnung ausdrücklich.
- issue: Reichweite von מִמֶּנִּי
  choice: zu groß und zu wunderbar für mich
  alternative: große und wunderbare Dinge, die über mich hinausgehen
  rationale: Die Formulierung kann mangelnde Fähigkeit oder das Überschreiten des dem Sprecher angemessenen Bereichs bezeichnen. Die gewählte Fassung wahrt diese Offenheit, statt sie ausschließlich intellektuell oder sozial zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetischen Zeilen sind knapp gehalten; schwer verständliche Hebraismen werden idiomatisch wiedergegeben, während zentrale Bilder und echte Mehrdeutigkeiten in Text und Fußnoten erhalten bleiben.
