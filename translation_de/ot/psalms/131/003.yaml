  text: יַחֵ֣ל יִ֭שְׂרָאֵל אֶל יְהוָ֑ה מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
translation:
  language: de
  text: Israel hoffe auf Jahwe von nun an bis in Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als direkte Anrede: „Israel, hoffe auf Jahwe von nun an bis in Ewigkeit.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יַחֵל
  choice: hoffe
  rationale: Die Jussiv-/Imperfektform von יחל wird hier als unmittelbare Aufforderung wiedergegeben. „Hoffe“ bewahrt Erwartung und Vertrauen und ist im Deutschen natürlicher als das enger zeitliche „warte“.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Bundesvolk und wird unverändert übernommen.
- source_word: אֶל
  choice: auf
  rationale: Mit יחל bezeichnet אֶל das Ziel des Hoffens beziehungsweise Vertrauens; idiomatisches Deutsch verlangt „auf jemanden hoffen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מֵעַתָּה
  choice: von nun an
  rationale: Natürliche moderne Wiedergabe des zeitlichen Ausgangspunkts.
- source_word: וְעַד עוֹלָם
  choice: bis in Ewigkeit
  rationale: Die deutsche Wendung gibt die unbegrenzte Dauer des hebräischen Ausdrucks würdig und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe der auffordernden Verbform am Versanfang
  choice: 'Direkte Anrede: „Israel, hoffe auf Jahwe“'
  alternative: 'Jussiv in der dritten Person: „Israel hoffe auf Jahwe“'
  rationale: Die hebräische Form kann als jussivische Aufforderung oder idiomatisch als direkte Anrede wiedergegeben werden. Die direkte Anrede bildet den gemeinschaftlichen Aufruf in natürlichem Deutsch ab, ohne die Aussage theologisch zu vereindeutigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Aufforderung und der Gottesname bleiben erhalten; die Zeitformel wird idiomatisch wiedergegeben.
