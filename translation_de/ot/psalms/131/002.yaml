source:
  edition: WLC
  text: אִם לֹ֤א שִׁוִּ֨יתִי וְ/דוֹמַ֗מְתִּי נַ֫פְשִׁ֥/י כְּ֭/גָמֻל עֲלֵ֣י אִמּ֑/וֹ כַּ/גָּמֻ֖ל עָלַ֣/י נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: de
  text: Wahrlich[a], ich habe meine Seele beruhigt und still werden lassen, wie ein entwöhntes Kind bei seiner Mutter[b]; wie ein entwöhntes Kind ist meine Seele in mir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ich meine Seele nicht ausgeglichen und still gemacht habe.“ Die hebräische Eröffnung ist hier wahrscheinlich eine nachdrückliche Beteuerungsformel und wird deshalb mit „Wahrlich“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild zeigt ein Kind, das nicht mehr unruhig nach Nahrung verlangt, sondern still bei seiner Mutter bleibt.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: „Wie ein entwöhntes Kind auf mir ist meine Seele.“ Der hebräische Ausdruck ist schwierig; „in mir“ gibt den wahrscheinlichen Sinn in natürlichem Deutsch wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Ja
  rationale: Die Verbindung dient hier nicht als gewöhnlicher Bedingungssatz, sondern als nachdrückliche Beteuerung. „Ja“ gibt diese Bekräftigung in natürlichem, würdigem Deutsch wieder.
- source_word: שִׁוִּיתִי
  choice: ich habe … beruhigt
  rationale: Das Verb bezeichnet hier bildlich das Versetzen in einen ausgeglichenen, gefassten Zustand; „beruhigt“ passt zum Parallelverb und zum inneren Erleben des Beters.
- source_word: וְדוֹמַמְתִּי
  choice: und still werden lassen
  rationale: Die Form bezeichnet ein aktives Stillmachen. Die Wendung wahrt dieses bewusste Handeln und klingt im Deutschen natürlich.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Gemeint ist das innere Selbst beziehungsweise Leben des Beters. „Seele“ bewahrt die poetisch-biblische Ausdrucksweise, ohne hier eine technische Trennung von Leib und Seele festzulegen.
- source_word: כְּגָמֻל
  choice: wie ein abgestilltes Kind
  rationale: Das Partizip bezeichnet ein Kind, das entwöhnt beziehungsweise abgestillt worden ist. „Abgestilltes Kind“ macht das konkrete mütterliche Bild im heutigen Deutsch deutlich.
- source_word: עֲלֵי אִמּוֹ
  choice: bei seiner Mutter
  rationale: Die Präposition beschreibt in diesem Bild wahrscheinlich die enge, ruhige Nähe zur Mutter; „bei“ ist natürlich und legt die genaue Körperhaltung nicht unnötig fest.
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: wie ein abgestilltes Kind ist meine Seele in mir
  rationale: Die zweite Zeile wiederholt und verstärkt den Vergleich. „In mir“ gibt den wahrscheinlichen inneren Bezug verständlich wieder, während eine Fußnote die schwierigere, wörtlichere Fassung offenhält.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: „meine Seele“ als Bezeichnung des inneren Selbst
  alternative: „mein Inneres“ oder „ich selbst“
  rationale: Der Vers beschreibt die innere Haltung des Beters. Die traditionelle, poetisch passende Wiedergabe „Seele“ bleibt erhalten, ohne daraus eine bestimmte Leib-Seele-Lehre abzuleiten.
- issue: Art der Ruhe im Bild des abgestillten Kindes
  choice: Das Bild wird als ruhige Nähe zur Mutter wiedergegeben
  alternative: Das Kind liegt wörtlich „auf“ seiner Mutter
  rationale: Der hebräische Ausdruck lässt die räumliche Beziehung offen. Die Übersetzung betont daher nicht eine bestimmte Körperhaltung, sondern wahrt das Bild geborgener, nicht mehr nach dem Stillen verlangender Ruhe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. „Seele“ bewahrt den Psalmenklang; „abgestilltes Kind“ macht das konkrete Bild verständlich. Die Wiederholung des Vergleichs und seine leichte syntaktische Fremdheit bleiben erhalten, damit die hebräische Intensivierung nicht geglättet wird.
