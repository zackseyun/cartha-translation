  text: A Song of Ascents[b][a]. Of David.
translation:
  language: de
  text: 'Ein Wallfahrtslied. Von David.[a]


    HERR, mein Herz ist nicht hochmütig,

    und meine Augen blicken nicht stolz;

    ich befasse mich nicht mit großen Dingen

    und nicht mit Dingen, die zu wunderbar für mich sind.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für David« beziehungsweise »David zugeordnet«. Die hebräische Überschrift kann Autorschaft, Zuordnung oder Widmung ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »die über meine Fähigkeiten hinausgehen«. Gemeint sind Dinge, die den angemessenen Bereich oder das Vermögen des Sprechers überschreiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; im Psalter ist damit wahrscheinlich die Wallfahrt nach Jerusalem verbunden. »Wallfahrtslied« ist im Deutschen natürlich und traditionsnah.
- source_word: גָבַהּ לִבִּי
  choice: mein Herz ist nicht hochmütig
  rationale: Das Bild vom hohen Herzen bezeichnet innere Überheblichkeit; die deutsche Wiedergabe macht die Bedeutung verständlich und bewahrt den Bezug zum Herzen.
- source_word: רָמוּ עֵינַי
  choice: meine Augen blicken nicht stolz
  rationale: Die erhobenen Augen sind ein Bild für Stolz. Die verbale Formulierung klingt auf Deutsch natürlich.
- source_word: הִלַּכְתִּי בִּגְדֹלוֹת
  choice: ich befasse mich nicht mit Dingen, die zu groß für mich sind
  rationale: Wörtlich geht der Sprecher nicht in großen Dingen umher. »Sich befassen mit« gibt die idiomatische Bedeutung wieder, ohne sie auf Denken, Handeln oder Streben einzuengen.
- source_word: וּבְנִפְלָאוֹת מִמֶּנִּי
  choice: und nicht mit Wundern, die über mich hinausgehen
  rationale: נפלאות kann erstaunliche, wunderbare oder unbegreifliche Dinge bezeichnen; die Formulierung wahrt sowohl das Staunen als auch die Überschreitung der eigenen Fähigkeit oder Zuständigkeit.
theological_decisions:
- issue: Bedeutung von לְדָוִד in der Überschrift
  choice: Von David
  alternative: Für David / David zugeordnet
  rationale: Die traditionelle und grammatisch mögliche Angabe der Autorschaft steht im Haupttext; eine Fußnote erhält die echte Mehrdeutigkeit der hebräischen Präposition.
- issue: Reichweite der demütigen Selbstbegrenzung
  choice: Dinge, die zu groß für mich sind … Wunder, die über mich hinausgehen
  alternative: große und unbegreifliche Dinge, die mir nicht zustehen
  rationale: Der Text kann Fähigkeit, Erkenntnis oder angemessenen Zuständigkeitsbereich betreffen. Die Übersetzung legt sich nicht auf nur eine theologische Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname JHWH wird entsprechend verbreiteter deutscher Bibelkonvention als HERR wiedergegeben. Die poetischen Parallelismen und die Bilder von Herz und Augen bleiben erkennbar; erklärungsbedürftige Mehrdeutigkeiten stehen in den Fußnoten.
