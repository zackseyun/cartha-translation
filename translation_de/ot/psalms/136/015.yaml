  text: וְ/נִ֘עֵ֤ר פַּרְעֹ֣ה וְ/חֵיל֣/וֹ בְ/יַם ס֑וּף כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/015.yaml
  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: de
  text: und den Pharao samt seinem Heer im Schilfmeer[a] abschüttelte – denn seine treue Liebe bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Rotes Meer“. Hebräisch: „Schilfmeer“ beziehungsweise „Meer des Schilfs“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִעֵר
  choice: und … abschüttelte
  rationale: נָעַר bezeichnet ein Ausschütteln oder Abschütteln. Die deutsche Wiedergabe bewahrt das anschauliche Bild des hebräischen Verbs und lässt sich mit der Richtungsangabe „ins Schilfmeer“ natürlich verbinden.
- source_word: פַּרְעֹה
  choice: den Pharao
  rationale: „Pharao“ ist die übliche deutsche Form des ägyptischen Herrschertitels; der Akkusativ gibt die Funktion als Objekt des Verbs wieder.
- source_word: וְחֵילוֹ
  choice: samt seinem Heer
  rationale: חַיִל bezeichnet hier die Streitmacht des Pharaos. „Heer“ ist prägnant und im biblisch-historischen Zusammenhang weiterhin allgemein verständlich; „samt“ fasst Pharao und seine Streitmacht als gemeinsames Objekt zusammen.
- source_word: בְיַם סוּף
  choice: ins Schilfmeer
  rationale: יַם סוּף bedeutet seinem hebräischen Wortlaut nach „Schilfmeer“. Die Präposition wird wegen des gerichteten Vorgangs beim Abschütteln mit „ins“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den wiederkehrenden Lobpreisgrund ein. „Denn“ ist knapp, idiomatisch und für den liturgischen Kehrvers geeignet.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Die Präpositionalfügung drückt unbegrenzte Dauer aus. Im Deutschen ergänzt „bleibt“ den für einen vollständigen Satz nötigen verbalen Ausdruck.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד umfasst beständige, loyale Liebe, Güte und Zuwendung. „Treue Liebe“ hält den Beziehungs- und Beständigkeitsaspekt zusammen, ohne den Ausdruck ausschließlich auf Barmherzigkeit oder einen fachtheologischen Bundesbegriff festzulegen.
theological_decisions:
- issue: Wiedergabe von יַם סוּף
  choice: Schilfmeer im Haupttext
  alternative: Rotes Meer
  rationale: „Schilfmeer“ bildet die hebräische Bezeichnung unmittelbar ab und wahrt den Vorrang des Ausgangstextes. Die traditionsreiche Bezeichnung „Rotes Meer“ bleibt wegen ihrer Bekanntheit und möglichen geografischen Identifikation in einer Fußnote erhalten.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte; Barmherzigkeit; Bundestreue
  rationale: Der Ausdruck verbindet liebevolle Zuwendung mit Verlässlichkeit und Dauer. „Treue Liebe“ bewahrt diese Spannung, ohne eine einzelne konfessionelle oder systematisch-theologische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgisch knapper Satzführung. Das konkrete Bild von נָעַר bleibt in „abschüttelte“ erhalten; der Gedankenstrich hebt den wiederkehrenden Kehrvers ab.
