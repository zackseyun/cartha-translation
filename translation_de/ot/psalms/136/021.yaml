id: PSA.136.21
reference: Psalms 136:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַ֣ן אַרְצָ֣/ם לְ/נַחֲלָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/021.yaml
  text: and gave their land as an inheritance[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: und ihr Land als Erbbesitz gab[a], denn seine treue Liebe hört niemals auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Erbe“ oder „als bleibenden Besitz“. Das hebräische Wort bezeichnet einen zugeteilten Besitz mit Erbcharakter.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch חֶסֶד (chesed): treue, beständige Liebe und Güte; je nach Zusammenhang auch „Gnade“, „Bundestreue“ oder „Barmherzigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: und … gab
  rationale: Das Qal Perfekt 3. Person Singular mit וְ führt die Reihe der göttlichen Taten fort; im Deutschen ist die elliptische Form ohne erneut genanntes Subjekt im Psalmzusammenhang natürlich.
- source_word: אַרְצָם
  choice: ihr Land
  rationale: אֶרֶץ mit Suffix der 3. Person maskulin Plural bezeichnet hier das Land der zuvor genannten besiegten Könige beziehungsweise Völker.
- source_word: לְנַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet einen zugeteilten, bleibenden Besitz mit Erbcharakter. „Erbbesitz“ bewahrt diesen Sinn knapper und natürlicher als „als ein Erbe“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den wiederkehrenden Grund des Lobpreises ein; „denn“ erhält sowohl den kausalen Sinn als auch den liturgischen Rhythmus.
- source_word: לְעוֹלָם
  choice: hört niemals auf
  rationale: Wörtlich bezeichnet לְעוֹלָם unbegrenzte Dauer („für immer“). Zusammen mit חַסְדּוֹ gibt „hört niemals auf“ die fortdauernde Beständigkeit idiomatisch wieder.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד umfasst Liebe, Güte, Loyalität und verlässliche Verbundenheit. „Treue Liebe“ bewahrt sowohl die Zuwendung als auch die Beständigkeit, ohne einen technischen theologischen Ausdruck einzuführen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine treue Liebe hört niemals auf
  alternative: seine Güte währt ewig; seine Bundestreue bleibt für immer; seine Liebe bleibt ewig
  rationale: Die gewählte Formulierung verbindet Gottes liebevolle Zuwendung mit seiner bleibenden Treue. Sie lässt den möglichen Bundesbezug anklingen, legt den Ausdruck aber nicht ausschließlich auf diesen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Verbklammer „und ihr Land als Erbbesitz gab“ setzt syntaktisch die vorausgehenden Verse fort. Der Kehrvers ist eingängig und wahrt die Bedeutungsbreite von חֶסֶד.
