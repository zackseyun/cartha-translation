  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Sinn des Hebräischen zuverlässig wieder: וְנָתַן als fortführendes Präteritum, אַרְצָם als „ihr Land“, לְנַחֲלָה treffend als „als Erbbesitz“ und den kausalen Kehrvers mit „denn“. „Seine treue Liebe hört niemals auf“ vermittelt die unbegrenzte Dauer von לְעוֹלָם und die Beständigkeit von חַסְדּוֹ ohne unzulässige dogmatische Festlegung.'
