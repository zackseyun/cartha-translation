id: PSA.136.14
reference: Psalms 136:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּ/תוֹכ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/014.yaml
  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: und Israel mitten hindurchführte[a] – denn seine Güte währt ewig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Israel durch seine Mitte ziehen ließ“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort חֶסֶד kann je nach Zusammenhang auch „Bundestreue“, „beständige Liebe“ oder „Barmherzigkeit“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר
  choice: und … hindurchführte
  rationale: Der Hifil von עבר bezeichnet hier das Veranlassen bzw. Ermöglichen des Hindurchgehens. „hindurchführte“ gibt die verursachende Handlung idiomatisch wieder und bewahrt zusammen mit „mitten“ das Bewegungsbild.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: בְּתוֹכוֹ
  choice: mitten hindurch
  rationale: Die Wendung bedeutet wörtlich „in/durch seine Mitte“; das Suffix verweist auf das Meer im vorherigen Vers. „mitten hindurch“ bewahrt die räumliche Anschaulichkeit.
- source_word: כִּי
  choice: denn
  rationale: Im wiederkehrenden Kehrvers leitet כִּי den Grund für den Lobpreis ein. „denn“ entspricht dieser begründenden, liturgischen Funktion.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. „währt ewig“ ergänzt im Deutschen idiomatisch ein Verb und bringt die fortdauernde Beständigkeit zum Ausdruck.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חֶסֶד umfasst beständige Zuwendung, Loyalität, Güte und Erbarmen. „Güte“ ist im Deutschen knapp, würdig und für den Psalmkehrvers gut verständlich; eine Fußnote hält weitere Bedeutungsnuancen offen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine Güte währt ewig
  alternative: seine Bundestreue bleibt ewig; seine Barmherzigkeit währt ewig
  rationale: „Güte“ lässt die liebevolle und wohltätige Zuwendung Gottes hervortreten, ohne den Begriff ausschließlich auf Bundestreue oder Erbarmen festzulegen. Die Fußnote bewahrt die semantische und theologische Breite des hebräischen Ausdrucks.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, liturgisch geeignetem Klang. Die knappe Parallelstruktur und der feste Kehrvers des Psalms bleiben erhalten.
