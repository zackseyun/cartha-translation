  text: and Og king of Bashan[a], for his steadfast love endures forever.
translation:
  language: de
  text: und Og, den König von Baschan[a] — denn seine Güte währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher in Fortführung der vorangehenden Satzkonstruktion: „und Og, König von Baschan“. Das לְ bei Og führt die elliptische Aufzählung der von Gott geschlagenen Könige weiter.'
    reason: syntaktische_alternative
lexical_decisions:
- source_word: וּלְעוֹג
  choice: und Og
  rationale: Das וּ setzt die Aufzählung mit „und“ fort. Die Präposition לְ führt die vom vorherigen Satzglied übernommene indirekte Objektbeziehung weiter; im Deutschen wird sie im Haupttext durch den ergänzten Akkusativ „den König“ natürlich ausgedrückt, während die wörtlichere Fortführung in der Fußnote genannt wird.
- source_word: מֶלֶךְ
  choice: den König
  rationale: מֶלֶךְ bedeutet „König“. Der Akkusativ macht im Deutschen die aus dem vorangehenden Zusammenhang ergänzte Objektfunktion deutlich.
- source_word: הַבָּשָׁן
  choice: von Baschan
  rationale: Der geografische Eigenname wird in der im Deutschen üblichen Form „Baschan“ wiedergegeben; der hebräische Artikel wird in dieser Verbindung nicht eigens übersetzt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den wiederkehrenden begründenden Kehrvers ein; „denn“ bewahrt sowohl den liturgischen als auch den erklärenden Zusammenhang.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. Zusammen mit dem im Hebräischen unausgesprochenen Verb wird sie idiomatisch und würdig als „währt ewig“ wiedergegeben.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חֶסֶד umfasst beständige, loyale Zuwendung, Liebe und Güte. „Güte“ ist im Deutschen natürlich und liturgisch geeignet, ohne die Bedeutung ausschließlich auf Erbarmen oder ausdrücklich auf einen Bund einzuengen; das Suffix wird mit „seine“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: Güte
  alternative: beständige Liebe; Bundestreue; Gnade
  rationale: „Güte“ bewahrt die breite Bedeutung loyaler, liebevoller Zuwendung und vermeidet sowohl eine konfessionelle Verengung als auch eine im Deutschen schwerfällige Formulierung. Die Beständigkeit wird durch „währt ewig“ ausdrücklich hervorgehoben.
- issue: Syntaktische Ergänzung aus dem vorhergehenden Vers
  choice: Og als Akkusativobjekt wiedergeben
  alternative: „und dem Og, dem König von Baschan“ als wörtlichere Fortführung der hebräischen לְ-Konstruktion
  rationale: Der hebräische Wortlaut ist elliptisch und führt die Konstruktion des vorangehenden Satzes fort. Der Akkusativ ergibt im Deutschen einen selbstständig lesbaren Vers, während die Fußnote die formale Alternative bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgisch gut sprechbarem Kehrvers. Die Ellipse des hebräischen Einzelverses wird behutsam aus dem unmittelbaren Kontext ergänzt; die formalere Konstruktion bleibt in der Fußnote sichtbar.
