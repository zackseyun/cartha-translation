  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
translation:
  language: de
  text: dem, der die Erde über den Wassern ausbreitete[a], denn seine Güte währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der die Erde auf den Wassern ausspannte“. Das hebräische Verb kann auch konkret „breithämmern“ bedeuten, etwa Metall zu einer Fläche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/רֹקַע
  choice: der … ausbreitete
  rationale: Die Präposition לְ setzt die Lobpreisungsreihe des Psalms fort; das Partizip von רקע bezeichnet das Ausbreiten oder Breitschlagen einer Fläche. „Ausbreitete“ ist im Deutschen natürlich und bewahrt zugleich das bildhafte Moment.
- source_word: הָ/אָרֶץ
  choice: die Erde
  rationale: Im kosmischen Schöpfungszusammenhang bezeichnet אֶרֶץ die Erde, nicht ein bestimmtes Land.
- source_word: עַל הַ/מָּיִם
  choice: über den Wassern
  rationale: עַל kann „auf“, „über“ oder „oberhalb von“ bedeuten. „Über den Wassern“ gibt das poetische kosmologische Bild klar wieder, ohne es wissenschaftlich umzudeuten.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den wiederkehrenden Grund für das Lob ein; „denn“ entspricht dieser begründenden Funktion.
- source_word: לְ/עוֹלָם
  choice: bleibt für immer
  rationale: לְעוֹלָם bezeichnet unbegrenzte Dauer. Da der hebräische Nominalsatz kein ausdrückliches Verb enthält, ergänzt „bleibt“ im Deutschen idiomatisch den Gedanken des Fortbestehens.
- source_word: חַסְדּֽ/וֹ
  choice: seine Güte
  rationale: חֶסֶד umfasst beständige, loyale Liebe, Güte und Treue. „Güte“ ist im wiederkehrenden Psalmrefrain knapp, würdig und verständlich, ohne den Bedeutungsumfang auf bloßes Erbarmen oder eine ausdrücklich genannte Bundesbeziehung zu verengen.
theological_decisions:
- issue: Kosmologische Bildsprache der Schöpfung
  choice: Das Bild von der über den Wassern ausgebreiteten Erde bleibt erhalten.
  alternative: Die Aussage abstrakt als „der die Welt gründete“ wiederzugeben.
  rationale: Der hebräische Text verwendet poetische kosmologische Bildsprache. Die Übersetzung bewahrt dieses Bild, ohne es an moderne naturwissenschaftliche Kategorien anzugleichen oder über den Wortlaut hinaus auszulegen.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Ausbreitete“ erhält das Schöpfungsbild; „über den Wassern“ klingt natürlich und lässt die räumliche Beziehung offen. Der Refrain ist bewusst knapp und gut verständlich formuliert.
