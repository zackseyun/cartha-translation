  variant: modern standard German
source:
  edition: WLC
  text: ה֭וֹדוּ לֵֽ/אלֹהֵ֣י הָ/אֱלֹהִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: Dankt dem Gott der Götter[a], denn seine treue Liebe[b] währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Gott über allen Göttern“. Wörtlich steht im Hebräischen „Gott der Götter“, eine Wendung, die seine höchste Stellung ausdrückt.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort chesed bezeichnet beständige, loyale und oft bundbezogene Liebe; je nach Zusammenhang kann es auch mit „Güte“, „Erbarmen“ oder „Bundestreue“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der pluralische Hifil-Imperativ von ידה fordert zum Danken beziehungsweise Preisen auf. „Dankt“ gibt die Aufforderung knapp und natürlich wieder und passt zum wiederkehrenden Aufbau des Psalms.
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: dem Gott der Götter
  rationale: Die hebräische Status-constructus-Verbindung lautet wörtlich „Gott der Götter“. Die formnahe Wiedergabe bewahrt die erhabene Sprache und lässt die Aussage über Gottes höchste Stellung stehen, ohne die Existenz anderer Götter zu behaupten oder zu bestreiten.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Aufforderung zum Dank ein. „Denn“ ist in diesem poetischen Zusammenhang knapp und idiomatisch.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Die Präpositionalfügung bedeutet „für immer/in Ewigkeit“. Da der hebräische Satz kein ausdrückliches Verb enthält, ergänzt „währt“ den im Deutschen erforderlichen verbalen Sinn natürlich.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד bezeichnet beständige, loyale und oft bundbezogene Liebe, Güte oder Erbarmen. „Treue Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Verlässlichkeit; das Suffix wird mit „seine“ ausdrücklich wiedergegeben.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Wendung „Gott der Götter“
  choice: Die wörtliche Hoheitsbezeichnung „Gott der Götter“ wird beibehalten.
  alternative: „Gott über allen Göttern“
  rationale: Die hebräische Wendung drückt höchste Stellung und Unvergleichlichkeit aus. Ihre Beibehaltung bewahrt die rhetorische Spannung des Textes und entscheidet nicht zusätzlich über den ontologischen Status anderer sogenannter Götter.
translation_notes:
  register: Moderne, würdige und gut verständliche Psalmsprache. Die knappe Imperativform und die wiederkehrende Refrainformel bleiben erhalten; „währt ewig“ trägt einen leicht poetischen, aber weiterhin allgemein verständlichen Ton.
