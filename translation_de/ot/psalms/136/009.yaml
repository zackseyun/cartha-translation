translation:
  language: de
  text: den Mond und die Sterne, damit sie über die Nacht herrschen, denn seine Güte[a] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Güte“ kann je nach Zusammenhang auch „treue Liebe“, „Gnade“ oder „Bundestreue“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[Akkusativmarker, nicht übersetzt]'
  rationale: Der direkte Objektmarker führt die weiteren Objekte der vorausgehenden Satzfolge ein und hat im Deutschen keine eigene Entsprechung.
- source_word: הַיָּרֵחַ
  choice: den Mond
  rationale: יָרֵחַ bezeichnet den Mond; der bestimmte Artikel und der durch אֶת angezeigte Akkusativ werden bewahrt.
- source_word: וְכוֹכָבִים
  choice: und die Sterne
  rationale: כּוֹכָבִים bedeutet „Sterne“. Im Deutschen klingt die Wiederholung des Artikels in dieser Verbindung natürlich.
- source_word: לְמֶמְשְׁלוֹת
  choice: damit sie … herrschen
  rationale: Die Form bezeichnet Herrschaft beziehungsweise Ausübung von Herrschaft. Ein Finalsatz gibt die Funktion der Himmelskörper im Deutschen klar und natürlich wieder.
- source_word: בַּלָּיְלָה
  choice: über die Nacht
  rationale: In Verbindung mit „herrschen“ gibt „über die Nacht“ den Herrschaftsbereich wieder und bewahrt den Anklang an die Schöpfungserzählung.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den begründenden Kehrvers ein; „denn“ wahrt dessen liturgischen Klang.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Zusammen mit חַסְדּוֹ drückt die Wendung bleibende Dauer aus; „bleibt für immer“ ist verständlich und rhythmisch.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חֶסֶד umfasst beständige, loyale Liebe, Güte und Treue. „Güte“ ist im Deutschen knapp, würdig und breit genug, ohne den Begriff ausschließlich auf Erbarmen oder Bundestreue einzuengen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine Güte bleibt für immer
  alternative: seine treue Liebe bleibt für immer; seine Gnade bleibt ewig; seine Bundestreue bleibt für immer
  rationale: „Güte“ bewahrt die Weite des hebräischen Begriffs und ergibt einen einprägsamen deutschen Kehrvers. Die Fußnote macht deutlich, dass auch beständige Liebe, Gnade und Treue mitschwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgisch einprägsamem Kehrvers. Die Syntax schließt als Versfragment an den vorausgehenden Kontext an.
