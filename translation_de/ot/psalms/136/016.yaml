  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: Dem, der sein Volk durch die Wüste führte, denn seine beständige Liebe[a] währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Beständige Liebe“ gibt das hebräische Wort ḥesed wieder. Es kann je nach Zusammenhang auch mit „Bundestreue“, „Güte“ oder „Erbarmen“ übersetzt werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: der … führte
  rationale: Das Hifil-Partizip von הלך bezeichnet hier kausativ das Führen; die Präposition לְ setzt die an den vorigen Kontext anschließende Lobpreisformel fort.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bezeichnet hier Gottes Volk in seinem geschichtlich-bundeshaften Verhältnis zu ihm.
- source_word: בַּמִּדְבָּר
  choice: durch die Wüste
  rationale: בְּ bedeutet wörtlich „in“; zusammen mit „führen“ gibt „durch die Wüste“ im Deutschen den Wegcharakter natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den wiederkehrenden Grund des Lobpreises ein; „denn“ bewahrt den liturgisch-poetischen Zusammenhang.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; „währt ewig“ ergänzt im Deutschen idiomatisch das nominale Prädikat.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Verlässlichkeit und Loyalität; „beständige Liebe“ bewahrt diese Breite in verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers
  choice: seine beständige Liebe währt ewig
  alternative: seine Bundestreue bleibt ewig; sein Erbarmen währt ewig
  rationale: „Beständige Liebe“ lässt sowohl Gottes liebevolle Zuwendung als auch ihre verlässliche, bundeshafte Dauer anklingen, ohne den Ausdruck auf einen einzigen Aspekt zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Kürze. „Durch die Wüste“ ist gegenüber dem wörtlichen „in der Wüste“ idiomatischer und bringt im Zusammenhang mit dem Führen die Bewegung zum Ausdruck.
