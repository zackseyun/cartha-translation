  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch und bewahrt die hymnische Satzfragmentstruktur des Psalms. „Treue Liebe“ ist in diesem bibelsprachlichen Register verständlich; „bleibt für immer“ ist idiomatisch, wenn auch weniger traditionell als „währt ewig“.
  terminology: „Niedrigkeit“ wahrt die semantische Offenheit zwischen niedrigem Stand, Bedrängnis und Demütigung. „Treue Liebe“ ist eine angemessene moderne Wiedergabe von חסד und vermeidet eine einseitige Festlegung auf bloße Güte oder Barmherzigkeit.
