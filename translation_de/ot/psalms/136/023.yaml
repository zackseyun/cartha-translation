translation:
  language: de
  text: 'der sich in unserer Niedrigkeit[a] an uns erinnerte,


    denn seine treue Liebe bleibt für immer.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in unserer Erniedrigung“ oder „als wir erniedrigt waren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „denn seine Güte währt ewig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: der in unserer Erniedrigung
  rationale: Das Relativpräfix wird mit „der“ wiedergegeben; die Präposition und das Substantiv bezeichnen den niedrigen, bedrängten oder gedemütigten Zustand des Volkes. „Erniedrigung“ bewahrt diese Bedeutungsbreite, ohne eine bestimmte Ursache festzulegen.
- source_word: זָכַר לָנוּ
  choice: an uns dachte
  rationale: זכר bedeutet grundlegend „sich erinnern/an jemanden denken“. Die Präposition ל markiert hier idiomatisch die betroffene Person. Die Übersetzung lässt die im Kontext mitschwingende helfende Zuwendung erkennen, fügt sie aber nicht ausdrücklich in den Verbstext ein.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ gibt den begründenden Zusammenhang des wiederkehrenden Kehrverses natürlich und liturgisch passend wieder.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Der hebräische Ausdruck bezeichnet unbegrenzte Dauer. Da der hebräische Satz kein ausdrückliches Verb enthält, ergänzt die deutsche Fassung idiomatisch „bleibt“.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חסד verbindet Liebe und Güte mit Beständigkeit, Loyalität und verlässlicher Zuwendung. „Treue Liebe“ wahrt diese Spannweite in verständlichem modernem Deutsch.
theological_decisions:
- issue: Wiedergabe des Kehrverses כִּי לְעוֹלָם חַסְדּוֹ
  choice: denn seine treue Liebe bleibt für immer
  alternative: denn seine Güte währt ewig
  rationale: Die gewählte Fassung betont sowohl den liebevollen als auch den verlässlich-treuen Charakter von חסד. „Bleibt für immer“ ist eine idiomatische Ergänzung zum verblosen hebräischen Satz; die traditionellere Formulierung bleibt als sachlich mögliche Alternative erhalten.
- issue: Bedeutung von Gottes Erinnern
  choice: an uns dachte
  alternative: sich unser annahm
  rationale: Im biblischen Zusammenhang kann Gottes Erinnern sein helfendes Handeln einschließen. Die Übersetzung bewahrt jedoch das konkrete hebräische Verb und macht die Folgerung nicht ausdrücklich zum Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zeilenstruktur bewahrt den relativen Anschluss des ersten Halbverses und den liturgischen Kehrvers. Nicht unnötig archaisch; „Erniedrigung“ erhält die offene Bedeutung zwischen Bedrängnis, Niedrigkeit und Demütigung.
