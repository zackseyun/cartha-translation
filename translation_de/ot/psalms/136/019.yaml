  terminology: „Treue Liebe“ ist eine tragfähige, nicht übermäßig auslegende Wiedergabe von חֶסֶד. Die Alternative „Bundestreue“ wird zutreffend als stärker interpretierend gekennzeichnet. „Amoriter“ und „Sihon“ sind etablierte deutsche biblische Namensformen.
