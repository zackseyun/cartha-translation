id: PSA.136.19
reference: Psalms 136:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: de
  text: Sihon[a], den König der Amoriter, denn seine treue Liebe bleibt für immer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht vor „Sihon“ eine Präposition. Die Wortgruppe setzt jedoch den Satz aus dem vorhergehenden Vers fort und bezeichnet Sihon als den, den Gott schlug.
    reason: previous_rendering
  - marker: b
    text: 'Oder: „Denn seine Güte währt ewig“; auch: „Denn seine Bundestreue bleibt für immer.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Sihon
  rationale: Die Präposition לְ kennzeichnet hier im Anschluss an das Verb des vorhergehenden Verses den betroffenen Gegenstand. Im natürlichen Deutschen wird Sihon daher ohne eigene Präposition als fortgesetztes Objekt genannt.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: den König der Amoriter
  rationale: מֶלֶךְ bezeichnet den König; die formal singularische Volksbezeichnung הָאֱמֹרִי wird in der Herrscherbezeichnung idiomatisch kollektiv als „der Amoriter“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet im wiederkehrenden Kehrvers den Grund des Lobpreises ein; „denn“ bewahrt diese Funktion in gehobenem, natürlichem Deutsch.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Der hebräische Kehrvers ist ohne ausdrückliches Verb formuliert. „Bleibt für immer“ ergänzt idiomatisch ein Verb und gibt die fortdauernde Geltung wieder.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד umfasst Liebe, Güte und verlässliche Bundestreue. „Treue Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Beständigkeit, ohne den Ausdruck auf bloßes Erbarmen zu verengen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine treue Liebe bleibt für immer
  alternative: seine Güte währt ewig; seine Bundestreue bleibt für immer
  rationale: „Treue Liebe“ hält die emotionale und die verlässlich-loyale Dimension zusammen. „Güte“ ist möglich, aber weiter und weniger beziehungsbezogen; „Bundestreue“ macht einen im Begriff enthaltenen theologischen Aspekt ausdrücklich und ist daher stärker auslegend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fragmentarische poetische Fortsetzung des vorhergehenden Verses bleibt erkennbar; zugleich wird die hebräische Objektmarkierung im Deutschen idiomatisch ausgedrückt. Der Kehrvers ist bewusst schlicht und liturgisch wiederholbar formuliert.
