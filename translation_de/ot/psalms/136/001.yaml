source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: de
  text: Dankt Jahwe[a], denn er ist gut; denn seine beständige Liebe[b] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Gottesname יהוה wird hier als „Jahwe“ wiedergegeben; traditionell steht dafür „der HERR“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „seine Bundestreue“, „seine Güte“ oder „sein Erbarmen“. Das hebräische חֶסֶד bezeichnet verlässliche, bleibende Liebe und loyale Zuwendung, besonders innerhalb einer Bundesbeziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der Hifil-Imperativ im Plural von ידה fordert hier im liturgischen Zusammenhang zum Danken und Preisen auf. „Dankt“ gibt die Anrede knapp und idiomatisch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger des Dankes. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Beide Vorkommen begründen die Aufforderung zum Dank. „Denn“ bewahrt diese kausale Verknüpfung in gehobener, aber geläufiger Sprache.
- source_word: טוֹב
  choice: gut
  rationale: Das Adjektiv bezeichnet umfassend Gottes Güte; „gut“ ist die direkte und theologisch offene Wiedergabe.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unabsehbare, fortdauernde Dauer. „Für immer“ ist im modernen Deutsch natürlich.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Verlässlichkeit und bleibender Treue. „Beständige Liebe“ hält diese Bedeutungsbreite offen, ohne den Ausdruck ausschließlich auf Erbarmen oder Bundestreue einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ macht dies sichtbar, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Wiedergabe von חֶסֶד im liturgischen Kehrvers
  choice: beständige Liebe
  alternative: Bundestreue; Güte; Erbarmen
  rationale: Der Ausdruck umfasst Liebe, Loyalität, Güte und verlässliche Zuwendung. „Beständige Liebe“ bewahrt diese theologische Spannung besser als eine engere Festlegung.
- issue: Verbale Wiedergabe der nominalen Schlussklausel
  choice: bleibt für immer
  alternative: ist für immer
  rationale: Im Hebräischen steht kein ausdrückliches Verb. „Bleibt“ formuliert die fortdauernde Geltung im Deutschen natürlich, ohne eine zusätzliche inhaltliche Behauptung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgisch einprägsamem Satzbau. Das Semikolon gliedert die beiden Begründungen; die Wiederholung von „denn“ bildet die hebräische Struktur ab.
