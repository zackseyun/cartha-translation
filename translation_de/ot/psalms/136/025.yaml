translation:
  language: de
  text: der allem Fleisch Nahrung gibt[a], denn seine beständige Liebe währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der allem Fleisch Brot gibt“. „Alles Fleisch“ ist eine hebräische Wendung für alle lebenden Geschöpfe; „Brot“ kann allgemein für Nahrung stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹתֵן
  choice: der … gibt
  rationale: Das Partizip beschreibt Gottes fortdauerndes Handeln und fügt sich als Relativsatz natürlich in die litaneiartige Folge des Psalms ein.
- source_word: לֶחֶם
  choice: Nahrung
  rationale: Wörtlich bedeutet das Wort „Brot“, kann aber als Sammelbegriff für Nahrung stehen. „Nahrung“ gibt die universale Versorgung im Deutschen natürlich wieder.
- source_word: לְכָל
  choice: allem
  rationale: Die Präposition kennzeichnet die Empfänger der Gabe; in der Verbindung „allem Fleisch … gibt“ ist der Dativ im Deutschen idiomatisch.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: „Alles Fleisch“ bewahrt die hebräische Ausdrucksweise und ihre biblischen Bezüge; gemeint sind hier die lebenden Geschöpfe insgesamt.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ leitet den wiederkehrenden Lobpreisgrund ein und bewahrt den liturgischen Rhythmus.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. „Bleibt für immer“ ergänzt im Deutschen ein natürliches Verb und drückt die bleibende Dauer aus.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד bezeichnet gnädige, verlässliche und loyale Liebe. „Beständige Liebe“ ist verständlich und bewahrt sowohl Zuwendung als auch Dauerhaftigkeit, ohne den Begriff auf „Barmherzigkeit“ oder einen ausdrücklich genannten Bund zu verengen.
theological_decisions:
- issue: Umfang von „allem Fleisch“
  choice: Gottes Versorgung gilt allen lebenden Geschöpfen; die hebräische Wendung „alles Fleisch“ bleibt erhalten.
  alternative: nur die gesamte Menschheit beziehungsweise alle Menschen
  rationale: Die hebräische Wendung kann alle Lebewesen umfassen. Der Zusammenhang von Gottes umfassender Fürsorge gibt keinen Anlass, sie ohne Textgrundlage auf Menschen zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativanschluss und der wiederkehrende Denn-Refrain bewahren den liturgischen Charakter; die ungewohnte Wendung „alles Fleisch“ bleibt wegen ihrer inhaltlichen Weite und biblischen Resonanz stehen und wird in der Fußnote erklärt.
