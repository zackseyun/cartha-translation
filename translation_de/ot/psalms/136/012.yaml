id: PSA.136.12
reference: Psalms 136:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/יָ֣ד חֲ֭זָקָה וּ/בִ/זְר֣וֹעַ נְטוּיָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/012.yaml
  text: with a strong hand and an outstretched arm[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: mit starker Hand und ausgestrecktem Arm[b], denn seine treue Liebe[a] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet beständige, verlässliche Liebe und kann je nach Zusammenhang auch mit „Güte“, „Bundestreue“ oder „Erbarmen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit mächtiger Hand und ausgestrecktem Arm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Die Präposition בְּ bezeichnet hier das Mittel. „Mit starker Hand“ gibt die hebräische Wendung direkt und im Deutschen natürlich wieder; „mit mächtiger Hand“ ist ebenfalls möglich.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: und ausgestrecktem Arm
  rationale: Die konkrete Bildsprache des Hebräischen und ihr Bezug zur Exodusüberlieferung bleiben erhalten. Nach „mit“ steht im Deutschen der Dativ.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ leitet den liturgisch wiederkehrenden Grund für den Lobpreis ein und entspricht hier der begründenden Funktion von כִּי.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Wörtlich bezeichnet die Wendung unbegrenzte Dauer. Das im Hebräischen nicht ausgedrückte Verb wird für natürliches Deutsch mit „bleibt“ ergänzt.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד umfasst liebevolle Zuwendung, Verlässlichkeit und Loyalität. „Treue Liebe“ bewahrt diese Breite besser als das enger wirkende „Erbarmen“ und ist für heutige Leser verständlich.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine treue Liebe bleibt für immer
  alternative: seine Güte währt ewig; seine Bundestreue bleibt für immer; sein Erbarmen bleibt für immer
  rationale: „Treue Liebe“ hält Zuwendung und verlässliche Loyalität zusammen, ohne den Begriff ausdrücklich auf einen Bund zu verengen. Die Alternativen spiegeln jeweils echte Teilaspekte des hebräischen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und das konkrete Exodusbild bleiben erhalten; der wiederkehrende Kehrvers ist flüssig und allgemein verständlich formuliert.
