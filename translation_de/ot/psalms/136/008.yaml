  text: die Sonne zur Herrschaft am Tag[a] – denn seine Güte währt für immer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Sonne zur Herrschaft am Tag«; das Hebräische verwendet hier ein Substantiv für »Herrschaft«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort חֶסֶד kann je nach Zusammenhang auch »beständige Liebe«, »Erbarmen« oder »Bundestreue« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[Akkusativzeichen, nicht eigenständig übersetzt]'
  rationale: Kennzeichnet im Hebräischen das bestimmte direkte Objekt; im Deutschen wird dies durch den Kasus ausgedrückt.
- source_word: הַשֶּׁמֶשׁ
  choice: die Sonne
  rationale: Direkte und natürliche Wiedergabe des bestimmten Substantivs שֶׁמֶשׁ.
- source_word: לְמֶמְשֶׁלֶת
  choice: damit sie … herrscht
  rationale: Das hebräische Substantiv bezeichnet Herrschaft beziehungsweise das Ausüben von Herrschaft. Im Zusammenhang der Schöpfungswerke wird der Zweck im Deutschen natürlich mit einem Finalsatz ausgedrückt.
- source_word: בַּיּוֹם
  choice: am Tag
  rationale: Bezeichnet den zeitlichen Bereich der Herrschaft der Sonne und bildet den natürlichen Gegenpol zu »in der Nacht« im folgenden Vers.
- source_word: כִּי
  choice: denn
  rationale: Leitet den wiederkehrenden begründenden Kehrvers ein und bewahrt dessen liturgischen Klang.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Drückt unbegrenzte Dauer aus. Das im Hebräischen verblose Prädikat wird im Deutschen idiomatisch durch »bleibt« ergänzt.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חֶסֶד umfasst beständige, loyale Liebe, Güte und Erbarmen. »Güte« ist im Deutschen knapp, würdig und kontextuell offen, ohne den Begriff allein auf Gefühl oder Bundestreue zu verengen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine Güte bleibt für immer
  alternative: seine beständige Liebe währt ewig; seine Bundestreue bleibt für immer; sein Erbarmen bleibt für immer
  rationale: Der Ausdruck bezeichnet Gottes dauerhaft zugewandtes, loyales und wirksames Handeln. »Güte« bewahrt im Deutschen die semantische Breite; eine Fußnote macht die wichtigen Bedeutungsaspekte sichtbar, ohne den Haupttext konfessionell oder begrifflich zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetisch-liturgischem Ton. Der Gedankenstrich hebt den wiederkehrenden Kehrvers ab. Die Syntax ergänzt aus dem Kontext den Zweck der erschaffenen Sonne, ohne die nominale Form des Hebräischen in der Fußnote zu verschweigen.
