source:
  edition: WLC
  text: לְ/עֹשֵׂ֣ה הַ֭/שָּׁמַיִם בִּ/תְבוּנָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: Dem, der die Himmel mit Einsicht gemacht hat[a] – denn seine treue Liebe[b] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Dem, der die Himmel durch Einsicht macht.“ Das hebräische Partizip kann näher an seiner Form im Präsens wiedergegeben werden; die Präposition kann statt „mit“ auch „durch“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Treue Liebe“ gibt das hebräische חֶסֶד (chésed) wieder. Je nach Zusammenhang kann das Wort auch „Güte“, „Bundestreue“ oder „Erbarmen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Dem, der … gemacht hat
  rationale: Das vorangestellte לְ kennzeichnet innerhalb der liturgischen Reihe den Empfänger des Dankes. Das Partizip wird im Zusammenhang mit Gottes vollbrachten Schöpfungstaten natürlich mit dem deutschen Perfekt wiedergegeben.
- source_word: הַשָּׁמַיִם
  choice: die Himmel
  rationale: Der hebräische Pluralausdruck bezeichnet im Schöpfungszusammenhang die Himmel und bewahrt hier den erhabenen kosmologischen Klang.
- source_word: בִּתְבוּנָה
  choice: mit Einsicht
  rationale: תְּבוּנָה bezeichnet Einsicht, Verständnis oder Urteilsvermögen. „Mit Einsicht“ gibt sowohl den Begriff als auch die modale Bedeutung der Präposition בְּ eng wieder, ohne ihn mit חָכְמָה („Weisheit“) gleichzusetzen.
- source_word: כִּי
  choice: denn
  rationale: Im Kehrvers leitet כִּי den Grund für den Dank ein; „denn“ ist dafür im Deutschen knapp und idiomatisch.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Wörtlich steht eine Zeitbestimmung „für immer“. Das ergänzte Verb „bleibt“ bringt die im nominalen hebräischen Satz enthaltene fortdauernde Geltung natürlich zum Ausdruck.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד umfasst beständige, verlässliche Güte und loyale Liebe. „Treue Liebe“ bewahrt die persönliche und dauerhafte Dimension, ohne den Ausdruck auf Erbarmen oder einen technischen Bundesbegriff zu verengen; das Suffix wird mit „seine“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine treue Liebe bleibt für immer
  alternative: seine Güte währt ewig; seine Bundestreue bleibt für immer; sein Erbarmen bleibt für immer
  rationale: „Treue Liebe“ hält die affektive und die verlässlich-loyale Dimension des vielschichtigen Begriffs zusammen. Sie legt den Begriff weder ausschließlich auf Erbarmen noch ausdrücklich auf eine technische Bundesterminologie fest.
- issue: Zeitbezug des Partizips עֹשֵׂה
  choice: der … gemacht hat
  alternative: der … macht
  rationale: Das hebräische Partizip lässt eine gegenwärtige beziehungsweise charakterisierende Wiedergabe zu. Im Kontext der aufgezählten Schöpfungstaten ist das deutsche Perfekt natürlich, ohne Gottes bleibende Eigenschaft als Schöpfer auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Parallelstruktur des liturgischen Kehrverses. Der Dativanfang führt die in den umliegenden Versen begonnene Aufforderung zum Dank fort; der Gedankenstrich markiert den Übergang zum wiederkehrenden Begründungssatz.
