source:
  edition: WLC
  text: וַ/יִּפְרְקֵ֥/נוּ מִ/צָּרֵ֑י/נוּ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/024.yaml
  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: de
  text: und uns von unseren Bedrängern befreite[a], denn seine Güte bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und uns aus der Gewalt unserer Feinde rettete“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: und uns … befreite
  rationale: Das Verb פרק bezeichnet hier das Losreißen oder Befreien aus Bedrängnis. „Befreite“ ist im heutigen Deutsch natürlich und lässt sowohl Rettung aus Gefahr als auch Lösung aus Unterdrückung zu.
- source_word: מִצָּרֵינוּ
  choice: von unseren Bedrängern
  rationale: Die Pluralform mit Suffix bezeichnet feindlich gesinnte oder bedrängende Personen. „Bedränger“ bewahrt den Aspekt der Bedrückung; „Feinde“ ist eine ebenso mögliche, allgemeinere Wiedergabe.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier im wiederkehrenden Kehrvers den Lobpreis. „Denn“ erhält den erklärenden Zusammenhang und den liturgischen Klang.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. Mit „bleibt für immer“ wird die im Hebräischen knappe Nominalkonstruktion natürlich und dauerhaftigkeitsbetont wiedergegeben.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חֶסֶד umfasst beständige Zuwendung, Loyalität, Güte und Erbarmen. „Güte“ ist verständlich, würdig und breit genug, ohne den Begriff ausschließlich auf Mitleid oder eine ausdrücklich benannte Bundesterminologie zu verengen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine Güte bleibt für immer
  alternative: seine treue Liebe währt ewig
  rationale: „Güte“ bewahrt die Breite der verlässlichen, tätigen Zuwendung Gottes. Die Alternative hebt Liebe und Treue deutlicher hervor, legt den vielschichtigen hebräischen Begriff jedoch stärker aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem wiederkehrenden, gut sprechbaren Kehrvers „denn seine Güte bleibt für immer“. Die Satzstellung folgt der hebräischen Fortsetzung des vorherigen Verses.
