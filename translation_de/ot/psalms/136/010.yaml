  text: לְ/מַכֵּ֣ה מִ֭צְרַיִם בִּ/בְכוֹרֵי/הֶ֑ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/010.yaml
  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: de
  text: Dem, der Ägypten an seinen Erstgeborenen schlug[a] – denn seine Güte währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische sagt knapp „in/unter seinen Erstgeborenen“. Auch möglich: „in seinen Erstgeborenen“ oder, deutender, „indem er seine Erstgeborenen schlug“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Der … schlug
  rationale: Die Präposition לְ führt im litaneiartigen Zusammenhang den Empfänger des Lobpreises ein; das Partizip von נכה wird natürlich als Relativsatz wiedergegeben. „Schlug“ bewahrt die unmittelbare Härte der Aussage.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Übliche Wiedergabe des Ländernamens, der hier zugleich für das ägyptische Gemeinwesen steht.
- source_word: בִּבְכוֹרֵיהֶם
  choice: an seinen Erstgeborenen
  rationale: Die Präposition בְּ bezeichnet hier den Bereich, in dem Ägypten getroffen wurde. Das deutsche „an“ gibt diese Beziehung knapp wieder, ohne die Erstgeborenen ausdrücklich als Mittel des Schlages darzustellen. Das Suffix bezieht sich sinngemäß auf Ägypten; im Deutschen ist deshalb der Singular „seinen“ natürlich.
- source_word: כִּי
  choice: denn
  rationale: Leitet den wiederkehrenden begründenden Kehrvers ein.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Gibt die zeitliche Dauer idiomatisch und zugleich feierlich wieder.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חֶסֶד umfasst beständige, loyale und gnädige Zuwendung. „Güte“ ist im Deutschen knapp, verständlich und im Psalmenregister würdig, ohne den Begriff auf bloßes Erbarmen oder eine ausgeführte Bundesterminologie zu verengen.
theological_decisions:
- issue: Gottes Gericht an Ägyptens Erstgeborenen im Lobpreis
  choice: Die direkte Aussage, dass Gott Ägypten an seinen Erstgeborenen schlug, bleibt ungemildert stehen.
  alternative: Den Vorgang abschwächen oder im Haupttext ausdrücklich zu „indem er seine Erstgeborenen erschlug“ erweitern.
  rationale: Der hebräische Vers verbindet das Gericht ausdrücklich mit dem Lob für Gottes bleibende Güte. Die Übersetzung bewahrt diese Spannung, ohne die Härte zu mildern oder über den knappen Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Parallelstruktur des Psalms. Der Gedankenstrich markiert den wiederkehrenden Kehrvers. „Erstgeborene“ bleibt substantiviert und umfasst entsprechend dem Exodusbericht Menschen und Tiere, ohne dies im Haupttext auszudeuten.
