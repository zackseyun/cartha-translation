  text: לְ/גֹזֵ֣ר יַם ס֭וּף לִ/גְזָרִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/013.yaml
  text: to him who divided the Sea of Reeds into parts[a], for his steadfast love endures forever.
translation:
  language: de
  text: dem, der das Schilfmeer in Teile zerschnitt[a] — denn seine treue Liebe währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „das Rote Meer“. Im Hebräischen steht „Schilfmeer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/גֹזֵר
  choice: der … zerschnitt
  rationale: Das Präfix ל führt in der Litanei den Gepriesenen ein; das Partizip von גזר bezeichnet ein Zerschneiden oder Teilen. „Zerschnitt“ bewahrt das konkrete Bild und verbindet sich natürlich mit „in Teile“.
- source_word: יַם סוּף
  choice: das Schilfmeer
  rationale: „Schilfmeer“ gibt die übliche wörtliche Bedeutung von יַם סוּף wieder; die traditionelle Bezeichnung „Rotes Meer“ wird in der Fußnote genannt.
- source_word: לִ/גְזָרִים
  choice: in Teile
  rationale: גְזָרִים bezeichnet abgetrennte Teile oder Stücke. „In Teile“ ist verständlich und erhält das Bild der Teilung des Meeres.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet im Kehrvers von Psalm 136 den Grund des Lobpreises ein; „denn“ entspricht dieser Funktion idiomatisch.
- source_word: לְ/עוֹלָם
  choice: bleibt für immer
  rationale: Das Hebräische ist ein Nominalsatz ohne ausdrückliches Verb. „Bleibt für immer“ ergänzt im Deutschen ein natürliches Verb, ohne den zeitlich unbegrenzten Sinn abzuschwächen.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד umfasst treue, verlässliche und fortdauernde Zuwendung. „Beständige Liebe“ ist modernes, verständliches Deutsch und vermeidet eine Verengung auf „Barmherzigkeit“ oder eine ausdrückliche konfessionelle Deutung als „Bundesliebe“.
