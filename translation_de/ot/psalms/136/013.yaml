  source_fidelity: 'Der Entwurf gibt die zentralen Lexeme zutreffend wieder: גֹזֵר beschreibt das Teilen/Zerschneiden, יַם־סוּף ist wörtlich das Schilfmeer, und לִגְזָרִים bezeichnet getrennte Teile. Der Kehrvers mit כִּי und חַסְדּוֹ ist dem Sinn nach bewahrt. Das einleitende לְ verlangt in der deutschen Satzform jedoch ein Dativbezugwort („dem, der“), entsprechend dem liturgischen Anschluss des Verses.'
  naturalness: „Der das Schilfmeer ...“ ist als eigenständiger deutscher Versanfang grammatisch unvollständig und wirkt nicht wie ein bewusster dichterischer Ellipsengebrauch. „Dem, der“ bildet die hebräische Präposition natürlich ab. „Währt ewig“ ist für den feststehenden Kehrvers knapp, würdig und idiomatischer als „bleibt für immer“.
  terminology: „Schilfmeer“ ist sachgerecht; die Fußnote bewahrt die traditionelle Bezeichnung „Rotes Meer“. „Treue Liebe“ vermittelt bei modernem Register die Dauerhaftigkeit und Verlässlichkeit von חֶסֶד, ohne eine konfessionell festgelegte Auslegung einzutragen.
