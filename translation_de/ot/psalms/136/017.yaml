  text: לְ֭/מַכֵּה מְלָכִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: Dem, der große Könige niederschlug[a] – denn seine beständige Liebe währt ewig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dem, der große Könige schlug.“ Das hebräische Partizip mit vorangestelltem לְ setzt die im Psalm wiederkehrende Dank- und Lobformel fort.'
    reason: lexical_alternative
  - marker: b
    text: „Beständige Liebe“ gibt das hebräische Wort ḥesed wieder. Es bezeichnet verlässliche, loyale Zuwendung und kann auch mit „Güte“, „Barmherzigkeit“ oder „Bundestreue“ übersetzt werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Der … niederschlug
  rationale: Die Präposition לְ führt im liturgischen Zusammenhang den Empfänger des Dankes weiter; das Partizip von נכה ist hier verbal wiedergegeben. „Niederschlug“ bezeichnet im Kontext die entscheidende Niederlage der Könige, ohne unnötig ausdrücklich „tötete“ zu sagen.
- source_word: מְלָכִים
  choice: Könige
  rationale: Direkte Wiedergabe des hebräischen Plurals.
- source_word: גְּדֹלִים
  choice: große
  rationale: Bewahrt die Grundbedeutung des Adjektivs und kann bei Herrschern zugleich Rang und Macht bezeichnen.
- source_word: כִּי
  choice: denn
  rationale: Leitet den wiederkehrenden begründenden Kehrvers ein und wahrt einen würdigen liturgischen Klang.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Gibt die unbegrenzte Dauer idiomatisch wieder; das im Hebräischen nominal formulierte Prädikat wird im Deutschen mit „bleibt“ ergänzt.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חסד umfasst verlässliche, loyale und erbarmende Zuwendung. „Beständige Liebe“ verbindet den Beziehungscharakter mit der im Kehrvers betonten Dauer.
theological_decisions:
- issue: Wiedergabe von חסד im Kehrvers
  choice: seine beständige Liebe bleibt für immer
  alternative: seine Güte währt ewig; seine Barmherzigkeit bleibt für immer; seine Bundestreue bleibt für immer
  rationale: „Beständige Liebe“ bewahrt die Breite von חסד, ohne den Ausdruck ausschließlich auf Barmherzigkeit oder ausdrücklich auf den Bundesbegriff festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper liturgischer Satzform. Der syntaktische Anschluss an die vorausgehende Aufforderung zum Dank bleibt wie im Hebräischen vorausgesetzt; der Kehrvers ist natürlich und gut verständlich formuliert.
