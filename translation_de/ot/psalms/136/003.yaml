id: PSA.136.3
reference: Psalms 136:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֭וֹדוּ לַ/אֲדֹנֵ֣י הָ/אֲדֹנִ֑ים כִּ֖י לְ/עֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
translation:
  language: de
  text: Dankt dem Herrn der Herren, denn seine treue Liebe[a] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Bundestreue bleibt für immer“. Das hebräische חֶסֶד kann loyale, bundestreue Liebe ebenso wie Güte oder Erbarmen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der Pluralimperativ im Hifil von ידה fordert die versammelte Gemeinschaft zum Dank auf. „Dankt“ ist knapp, natürlich und passt zur wiederkehrenden liturgischen Formel des Psalms.
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: dem Herrn der Herren
  rationale: Die hebräische Genitivverbindung bezeichnet den höchsten Herrn über alle anderen Herren. Die idiomnahe Wiedergabe bewahrt den feierlichen Titel und seine Aussage von höchster Herrschaft.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die Aufforderung zum Dank ein. „Denn“ ist im Deutschen sowohl präzise als auch für poetisch-liturgische Sprache geeignet.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Wörtlich bezeichnet die Wendung eine unbegrenzte Dauer. Da der hebräische Satz kein ausgesprochenes Verb enthält, gibt „bleibt für immer“ die im Deutschen erforderliche verbale Aussage natürlich wieder.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד umfasst beständige, loyale Liebe, Güte und oft auch bundestreue Zuwendung. „Treue Liebe“ hält Liebe und Verlässlichkeit zusammen, ohne den Begriff auf bloßes Erbarmen oder eine ausdrücklich genannte Bundeskategorie zu verengen; das Suffix wird mit „seine“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנֵי הָאֲדֹנִים
  choice: der Herr der Herren
  alternative: der Herr über alle Herren
  rationale: Die gewählte Form bewahrt die hebräische Steigerungsformel und ihren Charakter als feierlichen Gottestitel. Die Alternative erklärt die gemeinte höchste Herrschaft deutlicher, ist aber stärker auslegend.
- issue: Bedeutungsbreite von חֶסֶד
  choice: treue Liebe
  alternative: Bundestreue
  rationale: „Treue Liebe“ gibt sowohl die liebevolle Zuwendung als auch deren Beständigkeit wieder. „Bundestreue“ macht einen häufig vorhandenen Bundesbezug deutlicher, würde ihn hier jedoch ausdrücklicher festlegen als der hebräische Einzelbegriff selbst.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener biblisch-poetischer Titelformel „Herr der Herren“. Die wiederkehrende Refrainstruktur bleibt knapp und gut sprechbar.
