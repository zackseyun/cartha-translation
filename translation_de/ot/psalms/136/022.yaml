source:
  edition: WLC
  text: נַ֭חֲלָה לְ/יִשְׂרָאֵ֣ל עַבְדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/022.yaml
  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: 'als Erbbesitz[a] für Israel, seinen Diener,

    denn seine treue Liebe[b] bleibt für immer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als bleibenden Besitz“ oder „als Erbteil“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Bezeichnung meint eine beständige, verlässliche Liebe und wird auch mit „Güte“, „Barmherzigkeit“ oder „Bundestreue“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: als Erbbesitz
  rationale: Das Substantiv bezeichnet erblich zugeteilten Besitz; im Zusammenhang ist das Israel gegebene Land gemeint. „Als Erbbesitz“ schließt natürlich an das Geben des vorhergehenden Verses an.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die Präposition kennzeichnet Israel als Empfänger beziehungsweise Begünstigten der Zuteilung.
- source_word: עַבְדּוֹ
  choice: seinen Diener
  rationale: „Diener“ gibt hier die Bundesbeziehung Israels zu Gott wieder, ohne den in diesem Zusammenhang nicht hervorgehobenen Aspekt erzwungener Knechtschaft in den Vordergrund zu stellen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den wiederkehrenden, begründenden Lobpreisrefrain ein.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; zusammen mit חַסְדּוֹ ergibt sich so ein natürliches deutsches Prädikat.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חסד verbindet Zuwendung mit beständiger Loyalität. „Treue Liebe“ bewahrt beide Aspekte, ohne den Ausdruck auf bloßes Erbarmen oder Gefühl zu verengen.
theological_decisions:
- issue: Israels Verhältnis zu Gott in עַבְדּוֹ
  choice: seinen Diener
  alternative: seinen Sklaven
  rationale: Israel wird als Gott zugehörig und ihm dienend bezeichnet. Da der Kontext nicht Zwang oder rechtliche Unfreiheit betont, ist „Diener“ als bundesbezogene Bezeichnung angemessener.
- issue: Wiedergabe von חַסְדּוֹ im Refrain
  choice: seine treue Liebe
  alternative: seine Güte; seine Barmherzigkeit; seine Bundestreue
  rationale: Die Formulierung hält Zuneigung und verlässliche Treue zusammen. Sie vermeidet sowohl eine Verengung auf Mitleid als auch eine ausdrückliche Einfügung des im Wort selbst nicht genannten Begriffs „Bund“.
translation_notes:
  register: Moderner, würdiger Psalmstil. Die Verszeile bleibt als syntaktische Fortsetzung des vorausgehenden Gedankens fragmentarisch; „als Erbbesitz“ macht diese Verbindung im Deutschen kenntlich. Der Refrain ist klar, rhythmisch und für wiederholten liturgischen Gebrauch geeignet.
