source:
  edition: WLC
  text: לְ/עֹ֘שֵׂ֤ה נִפְלָא֣וֹת גְּדֹל֣וֹת לְ/בַדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/004.yaml
  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: 'ihm, der allein große Wunder[a] tut,


    denn seine treue Liebe[b] währt ewig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wundertaten« oder »wunderbare Taten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort bezeichnet verlässliche, treue Liebe und Güte; auch möglich: »Güte«, »Gnade« oder »Bundestreue«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֹשֵׂה
  choice: ihm, der … tut
  rationale: Die Präposition לְ setzt die in Psalm 136 wiederholte Aufforderung zum Danken fort; das substantivisch gebrauchte Partizip wird im Deutschen natürlich mit einem Relativsatz wiedergegeben.
- source_word: נִפְלָאוֹת
  choice: Wunder
  rationale: Das Wort bezeichnet außergewöhnliche, Staunen hervorrufende Taten, besonders machtvolle Taten Gottes. „Wunder“ ist prägnant und im Deutschen gut verständlich.
- source_word: גְּדֹלוֹת
  choice: große
  rationale: Das Adjektiv beschreibt die Wunder unmittelbar und wird mit dem formnahen, idiomatischen „große“ wiedergegeben.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: '„Allein“ bewahrt die Betonung der Ausschließlichkeit: Nur Gott vollbringt diese großen Wunder.'
- source_word: כִּי
  choice: denn
  rationale: „Denn“ leitet wie im Hebräischen den Grund für den Dank ein und eignet sich für den wiederkehrenden liturgischen Kehrvers.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Der hebräische Satz enthält kein ausdrückliches Verb. „Bleibt für immer“ ergänzt im Deutschen ein passendes Verb und bringt die fortdauernde Beständigkeit zum Ausdruck.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד verbindet Liebe und Güte mit Verlässlichkeit und loyaler Verbundenheit. „Beständige Liebe“ bewahrt diese Breite in natürlichem, gegenwärtigem Deutsch.
theological_decisions:
- issue: Wiedergabe des Kehrverses חַסְדּוֹ לְעוֹלָם
  choice: denn seine beständige Liebe bleibt für immer
  alternative: denn seine Güte / Gnade / Bundestreue währt ewig
  rationale: „Beständige Liebe“ bringt sowohl liebevolle Zuwendung als auch verlässliche Treue zum Ausdruck, ohne den vielschichtigen Begriff חֶסֶד auf Barmherzigkeit oder einen ausdrücklich genannten Bund einzuengen. „Bleibt für immer“ gibt die Dauer des verblosen hebräischen Satzes verständlich wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Der Vers setzt syntaktisch die Aufforderung „Dankt …“ aus dem Kontext fort. Die Zeilenbrechung hebt den regelmäßig wiederkehrenden Kehrvers hervor.
