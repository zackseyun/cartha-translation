source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א יִ֭שְׂרָאֵל מִ/תּוֹכָ֑/ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/011.yaml
  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: und Israel aus ihrer Mitte herausführte[a], denn seine treue Liebe[b] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus ihrer Mitte herausbrachte«; auch: »aus ihrer Mitte hinausführte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »חַסְדּוֹ (sein ḥesed)«; das Wort bezeichnet auch beständige Güte, loyale Zuwendung oder, traditionell, Barmherzigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: und … herausführte
  rationale: 'Der Hifil von יצא bezeichnet ein verursachtes Herausgehen: »herausführen« bzw. »herausbringen«. »Herausführte« ist im Deutschen natürlich und bewahrt den kausativen Sinn.'
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Volk Israel und wird in der üblichen deutschen Form wiedergegeben.
- source_word: מִתּוֹכָם
  choice: aus ihrer Mitte
  rationale: Die Wendung bezeichnet das Herauskommen aus dem Inneren einer Gruppe, im Kontext aus der Mitte der Ägypter. Die Formulierung bleibt nah am Hebräischen und ist zugleich idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den wiederkehrenden begründenden Kehrvers ein. »Denn« bewahrt sowohl den kausalen Bezug als auch den liturgischen Klang.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. »Bleibt für immer« gibt die fortdauernde Beständigkeit natürlich wieder.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חסד umfasst Liebe, Güte, Loyalität und verlässliche Zuwendung. »Treue Liebe« bewahrt diese Breite besser als das enger verständliche »Barmherzigkeit« und macht den Beziehungsaspekt deutlich.
theological_decisions:
- issue: Wiedergabe von חַסְדּוֹ im Kehrvers von Psalm 136
  choice: seine treue Liebe bleibt für immer
  alternative: seine Güte währt ewig; seine Barmherzigkeit bleibt für immer
  rationale: »Treue Liebe« bringt sowohl Gottes liebevolle Zuwendung als auch deren Verlässlichkeit zum Ausdruck, ohne den Begriff ausschließlich auf Erbarmen oder auf eine bestimmte bundestheologische Deutung einzuengen. Das ergänzte Verb »bleibt« macht den verblosen hebräischen Satz im Deutschen verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt wegen des Anschlusses an den vorhergehenden Vers fragmentarisch. Der wiederkehrende Kehrvers ist klar und liturgisch sprechbar formuliert.
