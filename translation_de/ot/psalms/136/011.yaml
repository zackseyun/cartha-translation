  source_fidelity: Der Vers gibt וַיּוֹצֵא kausativ zutreffend mit „herausführte“ wieder und bewahrt mit „aus ihrer Mitte“ die räumlich-gruppenhafte Bedeutung von מִתּוֹכָם. „Denn“ gibt die begründende Funktion von כִּי im Kehrvers angemessen wieder. „Seine treue Liebe bleibt für immer“ ist eine plausible, nicht einengende Wiedergabe von לְעוֹלָם חַסְדּוֹ.
