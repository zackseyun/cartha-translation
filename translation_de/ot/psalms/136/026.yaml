translation:
  language: de
  text: Dankt dem Gott des Himmels, denn seine beständige Liebe[a] währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Bundestreue währt ewig“. Das hebräische Wort חֶסֶד bezeichnet loyale, verlässliche Liebe und Treue innerhalb einer verbindlichen Beziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der pluralische Imperativ des Hifil von ידה fordert die Gemeinschaft zum Dank auf. „Dankt“ ist im Deutschen knapp, natürlich und entspricht dem wiederkehrenden liturgischen Ruf des Psalms.
- source_word: לְאֵל
  choice: dem Gott
  rationale: אֵל kann „Gott“ oder „Mächtiger“ bedeuten. Zusammen mit „des Himmels“ ist „dem Gott“ die natürliche titelartige Wiedergabe.
- source_word: הַשָּׁמָיִם
  choice: des Himmels
  rationale: Das formal pluralische שָׁמַיִם bezeichnet hier idiomatisch den himmlischen Bereich. „Des Himmels“ ist im Deutschen geläufig und würdevoll.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den Grund für die Aufforderung zum Dank ein; „denn“ bewahrt diesen Zusammenhang in knapper poetischer Form.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Wörtlich bezeichnet der Ausdruck eine unbegrenzte Dauer. Das im Hebräischen nominal formulierte „für ewig“ wird durch „währt ewig“ natürlich und ohne inhaltliche Erweiterung wiedergegeben.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד umfasst Güte, loyale Liebe und verlässliche Bundestreue. „Beständige Liebe“ bewahrt sowohl die persönliche Zuwendung als auch deren dauerhafte Verlässlichkeit.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers von Psalm 136
  choice: seine beständige Liebe währt ewig
  alternative: seine Bundestreue währt ewig
  rationale: „Beständige Liebe“ hält die affektive und die treue, dauerhafte Dimension zusammen, ohne den Ausdruck ausschließlich auf Erbarmen oder auf eine abstrakte Vertragstreue zu verengen. Die Fußnote nennt die stärker bundestheologisch akzentuierte Alternative.
translation_notes:
  register: Moderne, würdige und gemeinschaftlich-liturgische Sprache. Die knappe Satzform wahrt den Charakter des abschließenden Kehrverses; „währt ewig“ klingt poetisch, bleibt aber allgemein verständlich.
