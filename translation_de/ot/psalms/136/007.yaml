  text: לְ֭/עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
translation:
  language: de
  text: Dem, der die großen Lichter[a] gemacht hat – denn seine beständige Liebe[b] währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Himmelslichter“. Gemeint sind die großen Lichtträger am Himmel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine treue Liebe“ oder „seine Bundestreue“. Das hebräische Wort bezeichnet beständige, verlässliche Liebe und Loyalität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Dem, der … gemacht hat
  rationale: Das vorangestellte לְ führt in der Litanei den Empfänger des Dankes ein. Das Partizip עֹשֵׂה wird im Zusammenhang mit den vollbrachten Schöpfungstaten idiomatisch als Relativsatz mit Perfekt wiedergegeben.
- source_word: אוֹרִים
  choice: Lichter
  rationale: Das Wort bezeichnet hier die himmlischen Lichtträger und greift die Schöpfungssprache aus Genesis 1 auf. „Lichter“ ist verständlich und bewahrt diese sprachliche Verbindung.
- source_word: גְּדֹלִים
  choice: großen
  rationale: „Groß“ gibt die Grundbedeutung unmittelbar wieder und passt sowohl zum gehobenen Psalmstil als auch zur Anspielung auf die großen Lichter der Schöpfung.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den wiederkehrenden begründenden Kehrvers ein; „denn“ bewahrt diese erklärende und liturgische Funktion.
- source_word: לְעוֹלָם
  choice: bleibt ewig
  rationale: Wörtlich bezeichnet die Wendung eine unbegrenzte Dauer. Da im Hebräischen kein ausdrückliches Verb steht, ergänzt „bleibt“ die Aussage im Deutschen natürlich und zurückhaltend.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד umfasst liebevolle Zuwendung, Loyalität und verlässliche Treue. „Beständige Liebe“ wahrt diese Breite, ohne den Ausdruck ausschließlich auf Barmherzigkeit oder eine juristische Bundeskategorie festzulegen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers
  choice: seine beständige Liebe bleibt ewig
  alternative: seine Bundestreue bleibt ewig; seine Güte bleibt ewig
  rationale: Der hebräische Ausdruck verbindet Liebe, Güte und dauerhafte Loyalität. Die gewählte Formulierung erhält diese theologische Spannung, während die Fußnote die stärker auf Treue ausgerichtete Wiedergabe sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgisch tragfähigem Rhythmus. Der Dativanschluss „Dem, der …“ bewahrt die Struktur der umliegenden Lobpreisformeln; der Gedankenstrich grenzt den wiederkehrenden Kehrvers klar ab.
