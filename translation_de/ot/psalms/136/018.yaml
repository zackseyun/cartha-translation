lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: und … tötete
  rationale: Das Wayyiqtol von הרג führt den geschichtlichen Rückblick in erzählender Vergangenheitsform fort. „tötete“ gibt die direkte Bedeutung in klarem, modernem Deutsch wieder.
- source_word: מְלָכִים
  choice: Könige
  rationale: Das gewöhnliche Pluralwort für „Könige“ bedarf hier keiner Erweiterung.
- source_word: אַדִּירִים
  choice: mächtige
  rationale: Das Adjektiv bezeichnet die Könige als stark oder überlegen. „mächtige“ passt zum kriegerischen Zusammenhang und vermeidet, anders als „majestätische“, eine Verengung auf königlichen Glanz.
- source_word: כִּי
  choice: denn
  rationale: Die Partikel leitet den wiederkehrenden begründenden Kehrvers ein. „denn“ bewahrt sowohl den erklärenden Sinn als auch den liturgischen Klang.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Wörtlich steht „für immer“. Das ergänzte Verb „bleibt“ ergibt im Deutschen einen natürlichen, knappen Kehrvers und drückt die Dauer aus, ohne den Sinn zu erweitern.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חסד umfasst beständige Zuwendung, Loyalität, Güte und Erbarmen. „seine Güte“ ist im Deutschen verständlich und weit genug, während eine Fußnote die Bedeutungsbreite offenlegt.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kehrvers
  choice: seine Güte bleibt für immer
  alternative: seine beständige Liebe / seine Bundestreue bleibt für immer
  rationale: „Güte“ hält Gottes wohlwollende und verlässliche Zuwendung auch im Zusammenhang mit Gericht und Befreiung zusammen, ohne den Begriff ausschließlich auf Gefühl, Erbarmen oder Bundessprache festzulegen. Die Fußnote bewahrt seine weitere Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Zeilenform. Der Satzbau schließt an den fortlaufenden geschichtlichen Lobpreis des Psalms an; der wiederkehrende Kehrvers bleibt leicht sprech- und singbar.
