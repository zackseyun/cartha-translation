source:
  edition: WLC
  text: כִּֽי רוֹצֶ֣ה יְהוָ֣ה בְּ/עַמּ֑/וֹ יְפָאֵ֥ר עֲ֝נָוִ֗ים בִּ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/004.yaml
  text: For Yahweh delights in his people[a]; he adorns the humble with salvation.
translation:
  language: de
  text: Denn Jahwe hat Freude an seinem Volk; er schmückt die Demütigen mit Rettung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Befreiung“ oder „mit Sieg“. Das hebräische Wort kann Rettung, Befreiung oder Sieg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den umgebenden Lobpreis ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: רוֹצֶה
  choice: hat Freude an
  rationale: Bezeichnet hier wohlwollendes Gefallen, nicht bloßes Wollen. Die Formulierung ist warm, verständlich und dem deutschen Ausdruck angemessen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: בְּעַמּוֹ
  choice: an seinem Volk
  rationale: Die Präposition בְּ markiert bei רצה den Gegenstand des Gefallens; idiomatisches Deutsch verlangt hier „Freude an“.
- source_word: יְפָאֵר
  choice: schmückt
  rationale: Das Piel von פאר bezeichnet das Schmücken beziehungsweise Verherrlichen. „Schmückt“ bewahrt das konkrete Bild einer verliehenen Schönheit oder Ehre.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Bezeichnet demütige, sanftmütige oder sozial geringe Menschen. „Die Demütigen“ bewahrt den ethisch-geistlichen Sinn, ohne den möglichen Beiklang der Niedrigkeit auszuschließen.
- source_word: בִּישׁוּעָה
  choice: mit Rettung
  rationale: יְשׁוּעָה kann Rettung, Befreiung oder Sieg bedeuten. „Rettung“ bewahrt die Breite des Ausdrucks und passt zugleich zum Bild des Schmückens.
theological_decisions:
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt ihn als persönlichen Namen und ist im modernen Standarddeutsch üblich.
- issue: Bedeutung von יְשׁוּעָה im Lobpsalm
  choice: Rettung
  alternative: Befreiung oder Sieg
  rationale: Der Begriff umfasst sowohl rettendes Eingreifen als auch den daraus hervorgehenden Sieg. Der Haupttext bleibt breit; die kontextuell möglichen Nuancen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildsprache. „Hat Freude an“ ist idiomatisch und zugänglich; „schmückt“ erhält die konkrete Metapher des hebräischen Textes.
