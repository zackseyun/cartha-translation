base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/008.yaml
  text: to bind their kings with chains[a], and their honored men with iron fetters,
translation:
  language: de
  text: um ihre Könige mit Ketten zu fesseln und ihre Würdenträger[a] mit eisernen Fesseln,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Angesehenen; auch: ihre Edlen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: zu fesseln
  rationale: Der Infinitivus constructus bezeichnet in Verbindung mit dem vorausgehenden Vers Zweck oder Folge. „Fesseln“ gibt die konkrete Vorstellung körperlicher Bindung natürlich wieder, ohne sie als förmliche Gefangensetzung auszudeuten.
- source_word: מַלְכֵיהֶם
  choice: ihre Könige
  rationale: מֶלֶךְ bezeichnet spezifisch einen König; die maskuline Pluralendung mit Suffix wird genau wiedergegeben.
- source_word: בְּזִקִּים
  choice: mit Ketten
  rationale: זִקִּים bezeichnet Ketten beziehungsweise Fesseln. „Mit Ketten“ ist im Deutschen konkret und verbindet sich natürlich mit „fesseln“.
- source_word: וְנִכְבְּדֵיהֶם
  choice: und ihre Würdenträger
  rationale: Das von כבד abgeleitete Wort bezeichnet angesehene oder gesellschaftlich bedeutende Männer. „Würdenträger“ vermittelt Rang und Ansehen, ohne den Begriff auf erblichen Adel zu verengen.
- source_word: בְּכַבְלֵי בַרְזֶל
  choice: mit eisernen Fesseln
  rationale: כֶּבֶל bezeichnet eine Fessel oder ein Band; zusammen mit בַרְזֶל entsteht das konkrete Bild eiserner Fesseln. Die Wortwahl bewahrt zugleich die Variation gegenüber „Ketten“.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von וְנִכְבְּדֵיהֶם
  choice: ihre Würdenträger
  alternative: ihre Angesehenen
  rationale: Die hebräische Form ist maskuliner Plural und bezeichnet hier die ranghohen Männer der Völker. „Würdenträger“ wahrt diesen Bezug und gibt ihre gesellschaftliche Stellung idiomatisch wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Variation zwischen „Ketten“ und „eisernen Fesseln“ bilden die hebräische Bildsprache ab. Das einleitende „um“ macht den vom Kontext abhängigen Zweckbezug des Infinitivs deutlich.
