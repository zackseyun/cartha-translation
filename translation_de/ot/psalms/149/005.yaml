lexical_decisions:
- source_word: יַעְלְזוּ
  choice: sollen ... jubeln
  rationale: Die poetische Imperfektform hat hier auffordernde Kraft. „Jubeln“ gibt die ausgelassene Freude natürlich und würdevoll wieder.
- source_word: חֲסִידִים
  choice: die Treuen
  rationale: Das Wort bezeichnet Menschen, die von Bundestreue und hingebungsvoller Frömmigkeit geprägt sind. „Die Treuen“ vermeidet eine spätere kirchliche Engführung von „Heilige“.
- source_word: בְּכָבוֹד
  choice: über die Ehre
  rationale: כָּבוֹד kann hier „Ehre“ oder „Herrlichkeit“ bedeuten. Bei einem Verb der Freude kann בְּ auch den Anlass bezeichnen; „über die Ehre“ ist im Deutschen idiomatisch, ohne die mögliche Bedeutung „Herrlichkeit“ auszuschließen.
- source_word: יְרַנְּנוּ
  choice: jauchzen
  rationale: רנן bezeichnet einen laut vernehmbaren, freudigen Ruf, oft auch im Gesang. „Jauchzen“ bewahrt diese klangvolle, intensive Nuance.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier unmittelbar die Lage auf den Ruheplätzen.
- source_word: מִשְׁכְּבוֹתָם
  choice: ihren Lagern
  rationale: Das Substantiv bezeichnet Orte, an denen man liegt. „Lager“ ist gegenüber „Betten“ etwas weiter und passt zum gehobenen poetischen Register.
theological_decisions:
- issue: Wiedergabe von חֲסִידִים
  choice: die Treuen
  alternative: die Frommen; die Heiligen
  rationale: Die Formulierung bezeichnet die Gott in loyaler Hingabe Zugehörigen, ohne daraus eine technische kirchliche Kategorie zu machen.
- issue: Deutung von בְּכָבוֹד
  choice: über die Ehre
  alternative: in Herrlichkeit; in Ehre
  rationale: Der hebräische Ausdruck lässt sowohl eine modale beziehungsweise sphärische Deutung als auch eine Angabe des Grundes der Freude zu. Die Fußnote bewahrt diese echte Mehrdeutigkeit.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem poetischem Klang. Der parallele Aufforderungscharakter beider Verben bleibt erhalten; „Lager“ vermeidet eine unnötige Festlegung auf moderne Betten.
