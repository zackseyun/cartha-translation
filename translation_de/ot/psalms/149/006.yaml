lexical_decisions:
- source_word: רוֹמְמוֹת
  choice: Lobpreisungen
  rationale: Das seltene Pluralwort bezeichnet erhabene Lobpreisungen oder feierliche Huldigungen. „Lobpreisungen“ bewahrt den Plural und den gehobenen poetischen Ton; die Bedeutungskomponente des Erhebens wird in einer Fußnote kenntlich gemacht.
- source_word: אֵל
  choice: Gottes
  rationale: אֵל ist hier die Gottesbezeichnung für Israels Gott. Der deutsche Genitiv entspricht der hebräischen Verbindung knapp und natürlich.
- source_word: בִּגְרוֹנָם
  choice: in ihrer Kehle
  rationale: גָּרוֹן bedeutet wörtlich „Kehle“. Die körperlich-konkrete Vorstellung, dass der Lobpreis aus ihnen hervordringt, bleibt damit erhalten.
- source_word: וְחֶרֶב
  choice: und ein … Schwert
  rationale: Die Konjunktion verbindet die parallelen Vershälften; das nicht determinierte Substantiv wird im Deutschen passend mit dem unbestimmten Artikel wiedergegeben.
- source_word: פִּיפִיּוֹת
  choice: zweischneidiges
  rationale: Der Ausdruck bezeichnet wörtlich ein Schwert mit zwei Schneiden beziehungsweise „Mündern“. „Zweischneidig“ ist im Deutschen die klare und etablierte Sachbezeichnung.
- source_word: בְּיָדָם
  choice: in ihrer Hand
  rationale: Das Hebräische hat „Hand“ im Singular mit einem pluralischen Possessivsuffix. Der kollektive Singular wird beibehalten; „in ihren Händen“ ist ebenfalls möglich.
theological_decisions:
- issue: Verbindung von Gotteslob und kriegerischer Bildsprache
  choice: Die unmittelbare Gegenüberstellung von Lobpreis und Schwert bleibt ohne Abschwächung erhalten.
  alternative: Das Schwert bereits im Haupttext metaphorisch oder geistlich deuten.
  rationale: Der hebräische Text verbindet beide Bilder unvermittelt. Die Übersetzung soll diese theologische Spannung bewahren und nicht durch eine vorweggenommene Auslegung auflösen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit bewusst bewahrter Körperlichkeit und Parallelstruktur. „Lobpreisungen“ ist leicht gehoben, gibt aber den hebräischen Plural genauer wieder als ein geglätteter Singular. Die martialische Bildsprache wird weder verstärkt noch vergeistlicht.
