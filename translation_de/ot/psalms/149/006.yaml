  text: The high praises of God are in their throat[a], and a two-edged sword is in their hand[d][c][b],
translation:
  language: de
  text: Lobpreisungen Gottes sind in ihrer Kehle[a], und ein zweischneidiges Schwert ist in ihrer Hand[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erhabene Lobpreisungen Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Schwert mit zwei Schneiden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „in ihrer Hand“; der Singular kann kollektiv gebraucht sein. Daher ist auch „in ihren Händen“ möglich.'
