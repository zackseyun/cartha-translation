id: PSA.149.7
reference: Psalms 149:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לַ/עֲשׂ֣וֹת נְ֭קָמָה בַּ/גּוֹיִ֑ם תּֽ֝וֹכֵחֹ֗ת בַּל אֻמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/007.yaml
  text: to execute vengeance on the nations[a], punishments on the peoples,
translation:
  language: de
  text: um Rache an den Nationen zu vollziehen, Strafgerichte[a] an den Völkern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zurechtweisungen« oder »Rügen«.'
    reason: Das hebräische Wort kann verbale Zurechtweisung bezeichnen; in diesem Zusammenhang und parallel zu „Rache“ liegt jedoch ein strafend-gerichtlicher Sinn nahe.
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: zu vollziehen
  rationale: Der Infinitiv mit ל bezeichnet hier den Zweck. In Verbindung mit נְקָמָה gibt „vollziehen“ die Durchführung eines Gerichtsakts natürlich und würdig wieder.
- source_word: נְקָמָה
  choice: Rache
  rationale: Das Substantiv bezeichnet Rache beziehungsweise Vergeltung. „Rache“ bewahrt die starke, spannungsreiche Gerichtssprache des hebräischen Textes, ohne sie abzuschwächen.
- source_word: בַּגּוֹיִם
  choice: an den Nationen
  rationale: Die Präposition bezeichnet hier die Nationen als Ziel des Vollzugs. „An den Nationen“ ist im Deutschen idiomatisch und erhält den Parallelismus.
- source_word: תּוֹכֵחוֹת
  choice: Strafgerichte
  rationale: Das Wort kann Zurechtweisungen oder Rügen bezeichnen, hat im parallelen militärisch-gerichtlichen Zusammenhang jedoch wahrscheinlich einen konkreten strafenden Sinn. „Strafgerichte“ wahrt zugleich den Bezug zu gerichtlicher Ahndung.
- source_word: בַּל
  choice: an
  rationale: בַּל wird hier als poetische Präpositionalform verstanden, die dem vorangehenden בַּ parallel entspricht.
- source_word: אֻמִּים
  choice: den Völkern
  rationale: „Völker“ gibt den pluralischen Kollektivbegriff natürlich wieder und unterscheidet ihn im Parallelismus von „Nationen“.
theological_decisions:
- issue: Soll die Aussage über die von Gottes Volk vollzogene Vergeltung sprachlich abgeschwächt werden?
  choice: Die starke Gerichtssprache mit „Rache“ und „Strafgerichte“ beibehalten.
  alternative: Mit milderen Begriffen wie „Gerechtigkeit“, „Zurechtweisungen“ oder „Rügen“ übersetzen.
  rationale: Der hebräische Vers steht in einem kriegerisch-gerichtlichen Zusammenhang und formuliert bewusst scharf. Eine Abschwächung würde die theologische Spannung des Textes interpretierend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivkonstruktion setzt den Satz aus dem vorhergehenden Vers fort. „Nationen“ und „Völker“ erhalten den poetischen Parallelismus; die Härte der Gerichtssprache bleibt bewusst bestehen.
