id: PSA.149.1
reference: Psalms 149:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ שִׁ֣ירוּ לַֽ֭/יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗/וֹ בִּ/קְהַ֥ל חֲסִידִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
translation:
  language: de
  text: Lobt Jah![a] Singt Jahwe ein neues Lied, sein Lob in der Versammlung der Getreuen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Hallelu-Jah“ – wörtlich: „Lobt Jah!“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „in der Versammlung der Frommen“ oder „in der Gemeinde der Heiligen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְלוּ
  choice: Lobt
  rationale: Der Pluralimperativ von הלל richtet den Aufruf an mehrere Hörende. „Lobt“ gibt ihn unmittelbar und ohne zusätzliche Verstärkung wieder.
- source_word: יָהּ
  choice: Jah
  rationale: Die Kurzform des Gottesnamens steht hier eigenständig nach dem Imperativ. „Jah“ bewahrt diese vom folgenden יהוה unterschiedene Form.
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der Pluralimperativ von שׁיר wird schlicht und direkt wiedergegeben.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Adressaten des Liedes; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: Die geläufige poetische Verbindung wird formal nah und zugleich natürlich deutsch wiedergegeben.
- source_word: תְּהִלָּתוֹ
  choice: sein Lob
  rationale: Das Substantiv mit Suffix der 3. Person Singular bedeutet wörtlich „sein Lob“. Die knappe, verblose Fortführung des Hebräischen bleibt erhalten.
- source_word: בִּקְהַל
  choice: in der Versammlung
  rationale: קהל bezeichnet eine versammelte Gemeinschaft. „Versammlung“ wahrt den gemeinschaftlichen Rahmen ohne unnötig kirchliche Einengung.
- source_word: חֲסִידִים
  choice: der Getreuen
  rationale: חסידים bezeichnet Menschen, die durch Treue und hingebungsvolle Verbundenheit gekennzeichnet sind. „Getreue“ bewahrt diesen Sinn und vermeidet spätere fachsprachliche Engführungen von „Heilige“.
theological_decisions:
- issue: Wiedergabe der Gottesnamen יָהּ und יהוה im selben Vers
  choice: Die Kurzform wird als „Jah“, יהוה als „Jahwe“ wiedergegeben.
  alternative: Beide Formen könnten mit „der HERR“ wiedergegeben werden; alternativ könnte nur יָהּ transliteriert werden.
  rationale: Der hebräische Text verwendet bewusst zwei verwandte, aber verschiedene Namensformen. Die gewählte Wiedergabe macht diesen Unterschied sichtbar und bewahrt den offen genannten Gottesnamen.
- issue: Bedeutung von חֲסִידִים
  choice: der Getreuen
  alternative: der Frommen; der Heiligen; der loyal Verbundenen
  rationale: Der Ausdruck umfasst Frömmigkeit und verlässliche, bundestreue Hingabe. „Getreue“ hält diese Bedeutungsbreite offen, ohne eine spätere konfessionelle Fachbedeutung einzutragen.
- issue: Syntaktische Funktion von תְּהִלָּתוֹ בִּקְהַל חֲסִידִים
  choice: 'Die verblose, appositionelle Fortführung bleibt erhalten: „sein Lob in der Versammlung der Getreuen“.'
  alternative: 'Explizit ergänzen: „und singt sein Lob in der Versammlung der Getreuen“.'
  rationale: Im Hebräischen steht kein zweites Verb. Die knappe deutsche Fassung bewahrt die mögliche appositionelle Beziehung zu „ein neues Lied“ und löst die Syntax nicht unnötig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter pluralischer Anrede. Die poetische Kürze und die verblose Fortführung des Hebräischen bleiben erhalten; „Versammlung“ vermeidet eine unnötig konfessionelle Färbung.
