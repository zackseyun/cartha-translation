source:
  edition: WLC
  text: יְהַֽלְל֣וּ שְׁמ֣/וֹ בְ/מָח֑וֹל בְּ/תֹ֥ף וְ֝/כִנּ֗וֹר יְזַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/003.yaml
  text: Let them praise his name with dancing[c][b][a]; let them make music to him with tambourine and lyre.
translation:
  language: de
  text: Sie sollen seinen Namen mit Tanz[a] loben; mit Tamburin und Leier[c] sollen sie ihm musizieren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei einem Tanz“. Das hebräische Wort kann sowohl das Tanzen als Tätigkeit als auch einen Tanz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sollen sie ihm Loblieder singen“. Das hebräische Verb kann sowohl gesungenes Lob als auch instrumentales Musizieren bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „Harfe“. Das hebräische Wort bezeichnet wahrscheinlich eher ein leierartiges Saiteninstrument.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַֽלְל֣וּ
  choice: sie sollen … loben
  rationale: Die poetisch auffordernde Kraft der Piel-Imperfektform wird im modernen Deutschen natürlich mit „sollen“ wiedergegeben.
- source_word: שְׁמוֹ
  choice: seinen Namen
  rationale: Die ausdrückliche Rede vom Namen bleibt erhalten und wird nicht zu „ihn“ verflacht.
- source_word: בְמָחוֹל
  choice: mit Tanz
  rationale: מָחוֹל kann die Tätigkeit des Tanzens oder einen Tanz beziehungsweise Reigen bezeichnen; „mit Tanz“ ist verständlich und lässt diese Spannweite weitgehend offen.
- source_word: בְּתֹף
  choice: mit Tamburin
  rationale: תֹף bezeichnet eine Hand- oder Rahmentrommel; „Tamburin“ ist eine geläufige moderne Entsprechung.
- source_word: וְכִנּוֹר
  choice: und Leier
  rationale: כִּנּוֹר bezeichnet wahrscheinlich ein leierartiges Saiteninstrument und nicht die moderne Harfe.
- source_word: יְזַמְּרוּ
  choice: sollen sie … musizieren
  rationale: זמר kann gesungenes Lob ebenso wie instrumentales Musizieren bezeichnen. Da Instrumente genannt werden, wahrt „musizieren“ die weitere musikalische Bedeutung.
- source_word: לוֹ
  choice: ihm
  rationale: Das ל kennzeichnet hier den Empfänger beziehungsweise das Ziel des Musizierens; der deutsche Dativ gibt dies idiomatisch wieder.
theological_decisions:
- issue: Aussage oder Aufforderung
  choice: „Sie sollen“ als poetische Aufforderung
  alternative: „Sie werden“ oder „Mögen sie“
  rationale: Im Kontext hat die Imperfektform wahrscheinlich volitiven beziehungsweise auffordernden Sinn. „Sie sollen“ drückt diesen aus, ohne einen Befehlston zu überzeichnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau bewahrt den poetischen Charakter; „musizieren“ vermeidet eine unnötige Festlegung auf Gesang oder Instrumentalspiel.
