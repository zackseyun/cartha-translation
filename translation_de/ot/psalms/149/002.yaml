  text: יִשְׂמַ֣ח יִשְׂרָאֵ֣ל בְּ/עֹשָׂ֑י/ו בְּנֵֽי צִ֝יּ֗וֹן יָגִ֥ילוּ בְ/מַלְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/002.yaml
  text: Let Israel rejoice in his Maker[b][a]; let the sons of Zion exult in their King.
translation:
  language: de
  text: Israel freue sich über seinen Schöpfer[a]; die Söhne Zions sollen über ihren König[b] jubeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »über seine Schöpfer«; die hebräische Pluralform wird hier gewöhnlich auf Gott als Israels Schöpfer bezogen.'
    reason: lexical_alternative
  - marker: b
    text: Mit »ihrem König« kann Gott gemeint sein; möglich ist auch die Beziehung auf einen irdischen König.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמַח
  choice: freue sich
  rationale: Der Qal-Imperfekt steht hier in aufforderndem Sinn; die Formulierung gibt diesen poetischen Jussiv natürlich und würdig wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Bundesvolk und wird unverändert übernommen.
- source_word: בְּעֹשָׂיו
  choice: über seinen Schöpfer
  rationale: Die Präposition ב bezeichnet hier den Gegenstand der Freude und wird im Deutschen idiomatisch mit „über“ wiedergegeben. Obwohl עֹשָׂיו formal im Plural steht, ist im Zusammenhang Gott als Israels Schöpfer gemeint; die auffällige Form wird in einer Fußnote dokumentiert.
- source_word: בְּנֵי צִיּוֹן
  choice: die Söhne Zions
  rationale: Dies entspricht der wörtlichen Bedeutung und bewahrt die maskuline, kollektiv verwendete Bezeichnung des hebräischen Textes.
- source_word: יָגִילוּ
  choice: sollen ... jubeln
  rationale: Der Qal-Imperfekt wird parallel zum ersten Halbvers auffordernd verstanden; „jubeln“ wahrt gegenüber „sich freuen“ die gesteigerte, ausgelassene Freude.
- source_word: בְמַלְכָּם
  choice: über ihren König
  rationale: Die Präposition ב bezeichnet den Gegenstand der Freude. „König“ wird großgeschrieben, weil das Wort ein Substantiv ist; anders als im Englischen signalisiert die deutsche Schreibung keine Entscheidung über den Referenten.
theological_decisions:
- issue: Referent von „ihren König“
  choice: Die Hauptzeile lässt die grammatische Bezeichnung unverändert und legt typografisch nicht fest, ob Gott oder ein irdischer König gemeint ist.
  alternative: Der König ist aufgrund des Parallelismus ausdrücklich als Gott zu verstehen; möglich ist jedoch auch ein irdischer König Israels.
  rationale: Der Parallelismus mit „Schöpfer“ spricht stark für Gott. Da die deutsche Großschreibung von „König“ obligatorisch ist und die Form selbst den Referenten nicht eindeutig nennt, wird die alternative Möglichkeit in einer Fußnote bewahrt.
- issue: Numerus von עֹשָׂיו
  choice: Singular „Schöpfer“ im Haupttext
  alternative: 'Wörtlich: „seine Schöpfer“'
  rationale: Die hebräische Form ist morphologisch pluralisch, bezeichnet hier im Zusammenhang aber gewöhnlich den einen Gott als Schöpfer Israels. Der Singular ist im Deutschen verständlich und vermeidet eine irreführende Vielgöttervorstellung; der formale Plural bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, gehobene und gut verständliche Psalmsprache. Die parallelen Aufforderungen werden mit „freue sich“ und „sollen ... jubeln“ wiedergegeben. „Söhne Zions“ bewahrt die konkrete Bildsprache des Hebräischen; „über“ ist bei deutschen Verben der Freude idiomatischer als ein formales „in“.
