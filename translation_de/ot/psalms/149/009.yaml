id: PSA.149.9
reference: Psalms 149:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לַ/עֲשׂ֤וֹת בָּ/הֶ֨ם מִשְׁפָּ֬ט כָּת֗וּב הָדָ֣ר ה֭וּא לְ/כָל חֲסִידָ֗י/ו הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/009.yaml
  text: to execute on them the written judgment[a]. This is an honor for all his faithful ones[d][c][b]. Praise Yah!
translation:
  language: de
  text: um an ihnen das aufgeschriebene Urteil zu vollstrecken[a]. Das ist eine Ehre für alle, die ihm treu sind[b]. Lobt Jah![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das schriftlich festgelegte Urteil“, also das von Gott bereits aufgezeichnete oder bestimmte Urteil.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für alle seine Getreuen“; traditionell: „für alle seine Heiligen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „Lobt Jah!“ (hallelu-jah); traditionell als „Halleluja!“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: zu vollstrecken
  rationale: In Verbindung mit מִשְׁפָּט und vor dem Hintergrund der kriegerisch-gerichtlichen Bildsprache bezeichnet das Verb die Ausführung eines Urteils, nicht bloß ein allgemeines Tun.
- source_word: בָּהֶם
  choice: an ihnen
  rationale: Die Präposition bezeichnet hier die zuvor genannten Völker und Könige als diejenigen, an denen das Urteil vollzogen wird.
- source_word: מִשְׁפָּט כָּתוּב
  choice: das aufgeschriebene Urteil
  rationale: „Urteil“ bewahrt den rechtlichen und theologischen Gehalt; „aufgeschrieben“ gibt das Partizip כָּתוּב konkret wieder, ohne die mögliche Bedeutung vorschnell auf „verordnet“ oder „vorherbestimmt“ festzulegen.
- source_word: הָדָר
  choice: eine Ehre
  rationale: Im Zusammenhang bezeichnet das Wort die den Getreuen zukommende Würde oder Auszeichnung; „eine Ehre“ ist im heutigen Deutsch natürlich und verständlich.
- source_word: חֲסִידָיו
  choice: alle, die ihm treu sind
  rationale: חָסִיד bezeichnet Menschen, die durch loyale, hingebungsvolle Treue gekennzeichnet sind. Die Umschreibung vermeidet missverständliche spätere Nebenbedeutungen von „Heilige“.
- source_word: הַלְלוּ יָהּ
  choice: Lobt Jah!
  rationale: Die Übersetzung bewahrt sowohl den Imperativ im Plural als auch die im Hebräischen tatsächlich stehende Kurzform des Gottesnamens.
theological_decisions:
- issue: Wiedergabe der Kurzform des Gottesnamens יָהּ in der Schlussformel
  choice: Jah
  alternative: der HERR; Halleluja
  rationale: Der Ausgangstext verwendet ausdrücklich יָהּ, nicht das Tetragramm. „Jah“ erhält diese Namensform und macht zugleich den Inhalt der Aufforderung transparent.
- issue: Bezug und Sinn von הָדָר הוּא
  choice: Das Vollstrecken des aufgeschriebenen Urteils ist eine Ehre für Gottes Getreue.
  alternative: Dies ist Ehre beziehungsweise Herrlichkeit, ohne ausdrückliche Zählbarkeit.
  rationale: Das Pronomen greift am natürlichsten die zuvor genannte Handlung auf. Der deutsche unbestimmte Artikel dient der idiomatischen Formulierung, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers setzt syntaktisch den vorangehenden Satz fort. „Aufgeschriebenes Urteil“ bewahrt die konkrete Schriftmetapher und die mögliche Anspielung auf ein bereits festgehaltenes göttliches Gericht; „vollstrecken“ trägt den juristischen Kontext präzise. Die Schlussformel bleibt als verständliche Aufforderung mit der Kurzform des Gottesnamens erhalten.
