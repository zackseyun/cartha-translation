base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: de
  text: Ihre Messschnur zieht sich über die ganze Erde hin[a], und ihre Worte reichen bis ans Ende der Welt. In ihnen[b] hat er für die Sonne ein Zelt aufgestellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Stimme/ihr Klang dringt über die ganze Erde.« Der hebräische Konsonantentext lautet »ihre Messschnur«; einige alte Übersetzungen und viele Ausleger verstehen an dieser Stelle im poetischen Zusammenhang jedoch »Stimme« oder »Klang«.'
    reason: alternative_reading
  - marker: b
    text: »In ihnen« bezieht sich wahrscheinlich auf die in den vorhergehenden Versen genannten Himmel.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: ihre Messschnur
  rationale: Der masoretische Konsonantentext bezeichnet eine Schnur bzw. Messschnur. Die bewusst ungewöhnliche Bildsprache bleibt im Haupttext erhalten; die kontextuell naheliegende Deutung als »Stimme« oder »Klang« wird in einer Fußnote genannt.
- source_word: יָצָא
  choice: reicht
  rationale: Wörtlich bedeutet das Verb »hinausgehen«. In Verbindung mit einer Messschnur gibt »reicht« die räumliche Ausdehnung im natürlichen modernen Deutsch wieder, ohne die Aussage auf bloßen Schall festzulegen.
- source_word: מִלֵּיהֶם
  choice: ihre Worte
  rationale: Das aramäisch gefärbte Substantiv bezeichnet Worte oder Äußerungen. »Worte« wahrt die sprachliche Bildwelt und den Parallelismus.
- source_word: תֵבֵל
  choice: Welt
  rationale: Das Wort bezeichnet häufig die bewohnte Welt. »Welt« ist hier die natürliche und poetisch passende deutsche Entsprechung.
- source_word: בָּהֶם
  choice: in ihnen
  rationale: Das Pronomen bleibt wie im Hebräischen erhalten, statt seinen wahrscheinlich vorausgehenden Bezug ausdrücklich in den Haupttext einzutragen.
- source_word: לַשֶּׁמֶשׁ
  choice: der Sonne
  rationale: Der Dativ nach »ein Zelt aufschlagen« gibt die hebräische Präposition לְ idiomatisch als Bestimmung für die Sonne wieder.
- source_word: שָׂם אֹהֶל
  choice: ein Zelt aufgeschlagen
  rationale: Wörtlich steht »ein Zelt gesetzt/hingestellt«. »Ein Zelt aufschlagen« ist die natürliche deutsche Wendung und vermeidet unangebrachte kultische Anklänge von »Stiftshütte«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die Wiederholung von »reichen« verdeutlicht die parallelen Verszeilen; die schwer deutbare Lesart »Messschnur« und der pronominale Rückbezug »in ihnen« bleiben bewusst erhalten.
