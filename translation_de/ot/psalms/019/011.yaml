  text: גַּֽם עַ֭בְדְּ/ךָ נִזְהָ֣ר בָּ/הֶ֑ם בְּ֝/שָׁמְרָ֗/ם עֵ֣קֶב רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/011.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: de
  text: Auch dein Diener wird durch sie gewarnt[a]; sie zu befolgen bringt reichen Lohn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nimmt sie sich zur Warnung«; das hebräische Verb kann sowohl ein Gewarntwerden als auch ein Beachten der Warnung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hat reichen Ertrag« oder »hat weitreichende Folgen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Bewahrt die additive Verbindung zum vorausgehenden Lob der Weisungen des HERRN.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Gibt die demütige, auf Gott bezogene Selbstbezeichnung des Psalmisten natürlich wieder, ohne hier unnötig den rechtlichen Aspekt von »Sklave« hervorzuheben.
- source_word: נִזְהָר
  choice: lässt sich warnen
  rationale: Gibt den passiven beziehungsweise aufnehmenden Sinn des Nifal wieder und klingt im modernen Deutschen natürlicher als »wird gewarnt«; die mögliche Nuance des Achtgebens bleibt in der Fußnote sichtbar.
- source_word: בָּהֶם
  choice: durch sie
  rationale: Bezieht sich auf die zuvor genannten Rechtsbestimmungen und gibt die instrumentale Bedeutung der Präposition wieder.
- source_word: בְּשָׁמְרָם
  choice: wer sie befolgt
  rationale: Überträgt die mit בְּ und Infinitiv ausgedrückte Begleitumstands- oder Mittelrelation idiomatisch; das unbestimmte Subjekt der hebräischen Infinitivkonstruktion wird mit »wer« natürlich ausgedrückt.
- source_word: עֵקֶב
  choice: belohnt
  rationale: Gibt den positiven Ertrag beziehungsweise Lohn des Befolgens kontextgemäß wieder, ohne eine bestimmte Verdienstlehre festzuschreiben.
- source_word: רָב
  choice: reich
  rationale: Drückt das große beziehungsweise reichliche Ausmaß des Lohns in einer natürlichen deutschen Verbindung aus.
theological_decisions:
- issue: Ob der Vers ein verdienstliches Erwerben vor Gott lehrt oder allgemein den guten Ertrag des Gehorsams beschreibt
  choice: Die Formulierung sagt aus, dass das Befolgen von Gottes Weisungen reichen Lohn mit sich bringt, ohne die Art oder Grundlage dieses Lohns dogmatisch festzulegen.
  alternative: »Wer sie befolgt, verdient sich großen Lohn« als ausdrücklich verdienstorientierte Deutung.
  rationale: עֵקֶב kann Lohn, Ertrag oder Folge bezeichnen. »wird reich belohnt« bewahrt die positive Lohnsprache, importiert aber keine umfassende Lehre menschlichen Verdienstes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität bleibt knapp; »lässt sich warnen« wahrt die rezeptive Nuance, während »wer sie befolgt« die hebräische Infinitivkonstruktion verständlich und idiomatisch wiedergibt.
