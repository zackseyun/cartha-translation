  text: הַֽ/נֶּחֱמָדִ֗ים מִ֭/זָּהָב וּ/מִ/פַּ֣ז רָ֑ב וּ/מְתוּקִ֥ים מִ֝/דְּבַ֗שׁ וְ/נֹ֣פֶת צוּפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: de
  text: Sie sind begehrenswerter als Gold[a], ja, als viel Feingold, und süßer als Honig und als tropfender Honig aus den Waben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sind begehrenswert … und süß, mehr als Honig und tropfender Honig aus Waben.“ Das Hebräische verwendet Partizipial- beziehungsweise Adjektivformen mit Vergleichswendungen; der letzte Ausdruck kann wörtlicher als „tropfender Honig aus Waben“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: begehrenswerter
  rationale: Das passive Partizip von חמד steht prädikativ und erhält durch das folgende מִן vergleichenden Sinn. „Begehrenswerter“ gibt dies im Deutschen natürlich wieder; das vorausgesetzte Bezugswort wird aus dem vorherigen Vers aufgenommen.
- source_word: מִזָּהָב
  choice: als Gold
  rationale: מִן kennzeichnet hier den Vergleich; nach dem Komparativ ist „als Gold“ die idiomatische deutsche Entsprechung.
- source_word: וּמִפַּז רָב
  choice: ja, als viel Feingold
  rationale: פַּז bezeichnet besonders reines oder feines Gold, während רָב die Menge hervorhebt. „Ja“ macht die steigernde Parallelität verständlich, ohne eine zusätzliche Aussage einzuführen.
- source_word: וּמְתוּקִים
  choice: und süßer
  rationale: Das Adjektiv steht parallel zu הַנֶּחֱמָדִים und wird durch das folgende vergleichende מִן ebenfalls komparativ verstanden.
- source_word: מִדְּבַשׁ
  choice: als Honig
  rationale: Die Präposition מִן dient wiederum dem Vergleich und wird im Deutschen nach „süßer“ mit „als“ wiedergegeben.
- source_word: וְנֹפֶת צוּפִים
  choice: und Honigseim aus den Waben
  rationale: נֹפֶת bezeichnet fließenden oder tropfenden Honig; צוּפִים verweist wahrscheinlich auf die Waben, aus denen er kommt. „Honigseim aus den Waben“ bewahrt das anschauliche Bild und den poetisch-gehobenen Ton.
