source:
  edition: WLC
  text: י֣וֹם לְ֭/יוֹם יַבִּ֣יעַֽ אֹ֑מֶר וְ/לַ֥יְלָה לְּ֝/לַ֗יְלָה יְחַוֶּה דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/002.yaml
  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
translation:
  language: de
  text: Ein Tag lässt dem anderen Worte hervorströmen[a], und eine Nacht gibt der anderen Erkenntnis kund[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sprudelt Worte hervor«. Das hebräische Verb beschreibt ein reichliches Hervorquellen oder Ausströmen, nicht nur das Sprechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »teilt der anderen Wissen mit«; das hebräische Verb kann »kundgeben«, »bekannt machen« oder »verkünden« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם לְיוֹם
  choice: Ein Tag … dem anderen
  rationale: Die Wiederholung mit ל bezeichnet die Weitergabe von einem Tag zum nächsten. Die Formulierung ist im Deutschen natürlich und bewahrt die poetische Beziehung zwischen den Tagen.
- source_word: יַבִּיעַ
  choice: lässt … hervorströmen
  rationale: Der Hifil von נבע zeichnet das Bild eines reichlichen Hervorquellens oder Ausströmens und sollte nicht auf bloßes Reden verflacht werden.
- source_word: אֹמֶר
  choice: Worte
  rationale: Das Substantiv bezeichnet hier sprachliche Äußerung. Der Plural »Worte« klingt im Deutschen zusammen mit »hervorströmen« natürlich, ohne den Sinn auf einzelne Wörter einzuengen.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: und eine Nacht … der anderen
  rationale: Die entsprechende Formulierung erhält den Parallelismus zur ersten Vershälfte und drückt die Weitergabe von Nacht zu Nacht idiomatisch aus.
- source_word: יְחַוֶּה
  choice: gibt … kund
  rationale: Der Piel von חוה bedeutet hier »bekannt machen« oder »verkünden«. »kundgeben« bewahrt den deklarativen Sinn, ohne eine besondere Art der Offenbarung festzulegen.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: דעת kann Wissen oder Erkenntnis bezeichnen. »Erkenntnis« ist in diesem poetischen Zusammenhang idiomatisch und wahrt die begriffliche Parallele zu den Worten.
