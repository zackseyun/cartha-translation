  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: de
  text: Die Himmel erzählen von Gottes Herrlichkeit, und die Weite des Himmels[a] verkündet das Werk seiner Hände[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Firmament“ beziehungsweise „das Himmelsgewölbe“. Das hebräische Wort רָקִיעַ bezeichnet den ausgebreiteten Himmel oder das Himmelsgewölbe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Werk“. Wörtlich: „das Werk seiner Hände“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: die Himmel
  rationale: Der Plural bewahrt den poetischen und kosmischen Umfang des hebräischen שָׁמַיִם besser als das engere deutsche „der Himmel“.
- source_word: מְסַפְּרִים
  choice: erzählen von
  rationale: Das Partizip von ספר bezeichnet fortdauerndes Erzählen oder Kundtun; „erzählen von“ ist natürlich, poetisch und wahrt die Personifikation.
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte und sachlich passende Wiedergabe von כָּבוֹד im Blick auf Gottes gewichtige, offenbar werdende Majestät.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier den Schöpfer als Gott; eine Transliteration als „El“ würde ohne zwingenden Kontext einen Eigennamenakzent setzen.
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: das Werk seiner Hände
  rationale: Die Formulierung erhält das konkrete anthropomorphe Bild des hebräischen Ausdrucks, statt es zu „sein Werk“ zu glätten.
- source_word: מַגִּיד
  choice: verkündet
  rationale: Das Hifil-Partizip von נגד bedeutet bekannt machen oder kundtun; „verkündet“ bildet eine natürliche poetische Parallele zu „erzählen von“.
- source_word: הָרָקִיעַ
  choice: die Himmelsweite
  rationale: „Himmelsweite“ gibt die Vorstellung des ausgebreiteten Himmels verständlich und würdig wieder, ohne das heute missverständliche „Firmament“ als Haupttext zu verwenden.
theological_decisions:
- issue: Wiedergabe von אֵל
  choice: Gott
  alternative: El
  rationale: Der Kontext spricht von dem Gott, dessen Herrlichkeit die Schöpfung erkennen lässt. „Gott“ vermittelt diese Bedeutung natürlich, ohne eine im Vers nicht geforderte Eigennamenlesart festzulegen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Parallelismus der beiden Halbverse sowie die fortdauernde Aussage der hebräischen Partizipien bleiben erhalten; konkrete Schöpfungsbilder werden nicht unnötig geglättet.
