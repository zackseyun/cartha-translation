id: PSA.19.14
reference: Psalms 19:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: de
  text: Die Worte meines Mundes und das Sinnen meines Herzens mögen dir gefallen[a], Yahweh, mein Fels und mein Erlöser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mögen … vor dir [oder: vor deinem Angesicht] wohlgefällig sein“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Erlöser“ bezeichnet jemanden, der auslöst, zurückfordert oder rettend eintritt; im israelitischen Recht war diese Aufgabe häufig mit der Verpflichtung eines nahen Verwandten verbunden.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: mögen … gefallen
  rationale: Der Qal-Imperfekt steht hier im Gebetskontext mit Wunsch- beziehungsweise Jussivbedeutung; die Konstruktion mit „mögen“ gibt diesen bittenden Ton natürlich wieder.
- source_word: לְרָצוֹן
  choice: dir gefallen
  rationale: Die Verbindung bezeichnet, dass etwas vor Gott wohlgefällig beziehungsweise annehmbar ist. „Dir gefallen“ ist im modernen Deutschen natürlich und bewahrt den bewertenden Sinn.
- source_word: אִמְרֵי פִי
  choice: die Worte meines Mundes
  rationale: Die konkrete hebräische Wendung wird direkt und verständlich wiedergegeben.
- source_word: הֶגְיוֹן לִבִּי
  choice: das Sinnen meines Herzens
  rationale: הֶגְיוֹן kann Nachsinnen, inneres Erwägen oder Murmeln bezeichnen. „Sinnen“ bewahrt die poetische Offenheit und bildet das innere Gegenstück zu den gesprochenen Worten.
- source_word: לְפָנֶיךָ
  choice: dir
  rationale: Wörtlich „vor deinem Angesicht/in deiner Gegenwart“. In Verbindung mit לְרָצוֹן gibt „dir gefallen“ den Sinn idiomatisch wieder; die konkretere Form wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צוּרִי
  choice: mein Fels
  rationale: Die unmittelbare Metapher für Beständigkeit und Schutz bleibt erhalten.
- source_word: וְגֹאֲלִי
  choice: und mein Erlöser
  rationale: Das Wort bezeichnet jemanden, der auslöst, zurückfordert oder rettend für einen anderen eintritt. „Erlöser“ ist knapp und lässt den rechtlich-familiären Hintergrund bestehen, ohne ihn im Haupttext zu überbestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: JHWH; der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Yahweh“ bewahrt ihn als persönlichen Namen; ein ersetzender Titel würde diese Unterscheidung verdecken.
- issue: Metaphorischer Titel צוּרִי
  choice: mein Fels
  alternative: meine Zuflucht
  rationale: Die Übersetzung erhält das Bild des Ausgangstextes, statt es auf eine einzelne Deutung wie Schutz oder Zuflucht zu verengen.
- issue: Bedeutungsumfang von גֹאֲלִי
  choice: mein Erlöser
  alternative: mein Löser; mein Befreier; mein Verwandtenlöser
  rationale: „Erlöser“ bewahrt sowohl den Rettungsaspekt als auch den Hintergrund des Auslösens. „Verwandtenlöser“ wäre hier ohne ausdrücklichen Verwandtschaftsbezug zu eng.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Parallelstruktur und Bildsprache. „Sinnen“ ist leicht poetisch, aber allgemein verständlich. Die Anrede „Yahweh“ steht ohne zusätzliches „o“, da dies im heutigen Deutschen natürlicher wirkt.
