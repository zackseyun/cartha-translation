id: PSA.19.8
reference: Psalms 19:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: de
  text: Die Weisungen Jahwes sind richtig und erfreuen das Herz; das Gebot Jahwes ist rein[a] und erleuchtet die Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: klar.'
    reason: Das hebräische Adjektiv kann Reinheit oder Lauterkeit hervorheben; im Zusammenhang mit dem anschließenden „erleuchtet die Augen“ ist auch der daraus hervorgehende Sinn „klar“ möglich.
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: Weisungen
  rationale: Das Wort bezeichnet im Zusammenhang der Tora-Begriffe verbindliche, von Gott angeordnete Richtlinien. „Weisungen“ ist im heutigen Deutsch verständlich und wahrt den Unterschied zum folgenden „Gebot“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: יְשָׁרִים
  choice: richtig
  rationale: Das Adjektiv beschreibt die Weisungen als recht und zuverlässig. „Richtig“ ist hier natürlich und vermeidet das bei Sachen weniger geläufige „aufrichtig“.
- source_word: מְשַׂמְּחֵי לֵב
  choice: erfreuen das Herz
  rationale: Die Form bezeichnet die fortdauernde Wirkung der Weisungen und gibt den kausativen Sinn des Verbs natürlich wieder.
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das konkrete poetische Bild und kann wie das hebräische Wort das innere Denken, Wollen und Empfinden umfassen.
- source_word: מִצְוַת
  choice: Gebot
  rationale: Der Singular hat hier zusammenfassenden Charakter. „Gebot“ wahrt die rechtlich-bündische Nuance und den Unterschied zu „Weisungen“.
- source_word: בָּרָה
  choice: rein
  rationale: Die Grundbedeutung bezeichnet Reinheit beziehungsweise Lauterkeit. „Klar“ bleibt wegen des anschließenden Bildes vom Erleuchten eine mögliche kontextuelle Wiedergabe und wird in der Fußnote genannt.
- source_word: מְאִירַת עֵינָיִם
  choice: erleuchtet die Augen
  rationale: Die kausative Verbform wird direkt wiedergegeben; zugleich bleibt das hebräische Bild von Licht, Wahrnehmung und Lebenskraft erhalten.
- source_word: עֵינָיִם
  choice: Augen
  rationale: Die konkrete Metapher des Hebräischen wird bewahrt und nicht vorschnell als „Verständnis“ abstrahiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen und entspricht der üblichen modernen deutschen Transkription, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Parallelismus. Die beiden Partizipialwirkungen werden durch finite Verben natürlich wiedergegeben; die konkreten Bilder „Herz“ und „Augen“ bleiben erhalten.
