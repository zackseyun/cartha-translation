source:
  edition: WLC
  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: de
  text: Vom einen Ende des Himmels geht sie hervor[a], und ihr Lauf[b] reicht bis zu seinen Enden; nichts bleibt vor ihrer Glut verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nimmt sie ihren Ausgang“. Das hebräische Wort kann sowohl das Hervorgehen der Sonne als auch ihren Ausgangspunkt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Umlauf“. Das hebräische Wort bezeichnet eine Runde, Wendung oder den durchmessenen Lauf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: vom einen Ende des Himmels
  rationale: קָצֶה bezeichnet ein Ende oder äußerstes Gebiet. Das ergänzte „einen“ macht die Gegenüberstellung zum Verlauf bis zu den Enden im Deutschen verständlich. „Himmel“ ist im Deutschen als Sammelbegriff idiomatischer als der formale Plural.
- source_word: מוֹצָאוֹ
  choice: geht sie hervor
  rationale: מוֹצָא bezeichnet das Hervorgehen oder den Ausgangspunkt. Die verbale Wiedergabe ist natürlich und lässt sowohl das Erscheinen als auch den Beginn der Sonnenbahn anklingen.
- source_word: וּתְקוּפָתוֹ
  choice: und ihr Lauf
  rationale: תְּקוּפָה kann Runde, Umlauf, Wendung oder durchmessenen Lauf bezeichnen. „Lauf“ bewahrt die Bewegungsmetapher, ohne ein modernes astronomisches Umlaufmodell aufzudrängen.
- source_word: עַל קְצוֹתָם
  choice: reicht bis zu seinen Enden
  rationale: עַל bezeichnet hier zusammen mit der Bewegungsangabe die Erstreckung der Bahn. Das Pronomen verweist im Deutschen auf „Himmel“ zurück.
- source_word: וְאֵין נִסְתָּר
  choice: nichts bleibt … verborgen
  rationale: Die Existenzverneinung mit passivem Partizip besagt, dass nichts verborgen ist. „Nichts bleibt … verborgen“ ist knapp, idiomatisch und erhält den absoluten Umfang der Aussage.
- source_word: מֵחַמָּתוֹ
  choice: vor ihrer Glut
  rationale: חַמָּה bezeichnet hier die intensive Wärme der Sonne. „Glut“ gibt die Stärke poetisch und würdig wieder; „ihrer“ folgt dem grammatischen Geschlecht von „Sonne“ im Deutschen.
theological_decisions:
- issue: Grad der Personifikation der Sonne
  choice: Die Sonne wird mit dem im Deutschen grammatisch erforderlichen femininen Pronomen „sie/ihr“ bezeichnet, ohne zusätzliche Personifikation.
  alternative: Die hebräischen maskulinen Suffixe formal mit maskulinen Pronomen wiedergeben oder die Sonne stärker als handelnde Gestalt darstellen.
  rationale: Die hebräischen Suffixe folgen dem grammatischen Geschlecht von שֶׁמֶשׁ im Kontext. Im Deutschen ist „Sonne“ feminin. Die natürliche deutsche Kongruenz bewahrt das Schöpfungsbild, ohne mythologische oder göttliche Züge einzutragen.
translation_notes:
  register: Moderne, gehobene und gut verständliche Psalmsprache. Die poetische Bewegung vom einen Ende des Himmels bis zu seinen Enden bleibt erhalten; „Glut“ vermittelt die nachdrückliche Wirkung der Sonne.
