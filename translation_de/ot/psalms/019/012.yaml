  text: שְׁגִיא֥וֹת מִֽי יָבִ֑ין מִֽ/נִּסְתָּר֥וֹת נַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/012.yaml
  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: de
  text: Wer erkennt seine Verfehlungen? Sprich mich frei von verborgenen Sünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von geheimen Sünden« oder »von verborgenen Dingen«. Das Hebräische bedeutet zunächst »verborgene Dinge« und kann sich im Zusammenhang auf Verfehlungen beziehen, die dem Beter selbst oder anderen verborgen sind, oder allgemeiner auf verborgene Dinge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: Verfehlungen
  rationale: Das Substantiv bezeichnet Irrtümer, Abwege oder aus Versehen begangene Sünden. »Verfehlungen« bewahrt im Kontext die moralische Bedeutung, ohne ausdrücklich festzulegen, dass sie unbeabsichtigt waren.
- source_word: מִי
  choice: Wer
  rationale: Das gewöhnliche deutsche Fragepronomen gibt die rhetorische Frage knapp und natürlich wieder.
- source_word: יָבִין
  choice: erkennt
  rationale: Das Verb kann »verstehen«, »wahrnehmen« oder »unterscheiden« bedeuten. »Erkennt« bringt hier die begrenzte Fähigkeit des Menschen zum Erfassen eigener Verfehlungen natürlich zum Ausdruck.
- source_word: מִנִּסְתָּרוֹת
  choice: von verborgenen Sünden
  rationale: Die Präposition מן mit der Form von סתר bedeutet »von verborgenen Dingen«. Der Parallelismus mit »Verfehlungen« legt einen moralischen Bezug nahe; »verborgene Sünden« bleibt offen dafür, ob sie dem Sprecher selbst oder anderen verborgen sind.
- source_word: נַקֵּנִי
  choice: Sprich mich frei
  rationale: Der Piel-Imperativ von נקה kann Freisprechen, für schuldlos erklären oder Reinigen von Schuld bezeichnen. »Sprich mich frei« bewahrt den forensischen Sinn, ohne den Zusammenhang unnötig ritualisierend zu deuten.
theological_decisions:
- issue: Wesen des Verborgenen
  choice: Die Wendung bezeichnet verborgene Sünden beziehungsweise Verfehlungen.
  alternative: Geheime Sünden oder allgemein verborgene Dinge.
  rationale: Der Parallelismus mit »Verfehlungen« spricht für einen moralischen Bezug. Die Übersetzung lässt jedoch offen, ob die Sünden dem Beter selbst, anderen Menschen oder allgemein verborgen sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp; »Verfehlungen« und »verborgene Sünden« machen den moralischen Zusammenhang verständlich, während die Fußnote die Mehrdeutigkeit des Hebräischen wahrt.
