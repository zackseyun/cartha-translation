  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: de
  text: Die Weisung Jahwes ist vollkommen; sie stellt die Seele wieder her[a]. Das Zeugnis Jahwes ist zuverlässig; es macht den Unerfahrenen weise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie belebt die Seele.'
    reason: Die Wendung מְשִׁיבַת נָפֶשׁ kann neben Wiederherstellung auch Belebung oder Erquickung bezeichnen.
lexical_decisions:
- source_word: תּוֹרַת
  choice: Weisung
  rationale: תּוֹרָה bezeichnet hier die offenbarte, verbindliche Unterweisung Jahwes. „Weisung“ bewahrt den weiteren Sinn des hebräischen Wortes und vermeidet eine Verengung auf Gesetzesvorschriften.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: תְּמִימָה
  choice: vollkommen
  rationale: Das Adjektiv bezeichnet Ganzheit, Unversehrtheit und Fehlerlosigkeit; „vollkommen“ gibt diese umfassende Qualität im poetischen Zusammenhang angemessen wieder.
- source_word: מְשִׁיבַת
  choice: stellt … wieder her
  rationale: Das Partizip von שׁוב drückt ein Zurückbringen beziehungsweise Wiederherstellen aus. Die Formulierung erhält diese Grundbedeutung, ohne die mögliche Nuance des Neubelebens auszuschließen.
- source_word: נָפֶשׁ
  choice: die Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Selbst oder die ganze Person bezeichnen. „Seele“ ist hier knapp und poetisch; die Fußnote weist auf die lebensbezogene Bedeutungsnuance der Gesamtwendung hin.
- source_word: עֵדוּת
  choice: Zeugnis
  rationale: Das Wort bezeichnet Jahwes bezeugte und verbindliche Offenbarung. „Zeugnis“ ist direkt, würdig und im Kontext der parallelen Bezeichnungen passend.
- source_word: נֶאֱמָנָה
  choice: zuverlässig
  rationale: Der Ausdruck bezeichnet Festigkeit und Verlässlichkeit. „Zuverlässig“ ist in modernem Deutsch klar und natürlich.
- source_word: מַחְכִּימַת
  choice: macht … weise
  rationale: Die kausative Form bedeutet, jemanden weise zu machen; die deutsche Wiedergabe bildet dies unmittelbar ab.
- source_word: פֶּתִי
  choice: den Unerfahrenen
  rationale: פֶּתִי meint einen unerfahrenen, leicht beeinflussbaren Menschen, nicht zwingend einen moralisch schlechten. „Den Unerfahrenen“ ist im heutigen Deutsch verständlicher und weniger missverständlich als „den Einfältigen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Charakter als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsweite von מְשִׁיבַת נָפֶשׁ
  choice: stellt die Seele wieder her
  alternative: belebt das Leben neu
  rationale: Die Hauptfassung bewahrt den Rückkehr- und Wiederherstellungsaspekt von שׁוב sowie die traditionelle, aber weite Wiedergabe von נֶפֶשׁ. Die Alternative hält die kontextuell plausible Bedeutung des Neubelebens fest, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelem Satzbau. Die Semikola spiegeln die poetischen Entsprechungen des Hebräischen. „Weisung“ und „Unerfahrener“ vermeiden heute missverständliche Engführungen, während „Seele“ die vertraute poetische Sprache erhält.
