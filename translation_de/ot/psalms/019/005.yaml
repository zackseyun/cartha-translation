  text: וְ/ה֗וּא כְּ֭/חָתָן יֹצֵ֣א מֵ/חֻפָּת֑/וֹ יָשִׂ֥ישׂ כְּ֝/גִבּ֗וֹר לָ/ר֥וּץ אֹֽרַח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: de
  text: Sie ist wie ein Bräutigam, der aus seinem Hochzeitsgemach[a] hervortritt; sie jubelt wie ein Held, eine Bahn zu durchlaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus seinem Baldachin“ oder „aus seinem Brautgemach“. Das hebräische Wort חֻפָּה kann einen Hochzeitsbaldachin oder ein Brautgemach bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Sie ist
  rationale: Das Pronomen bezieht sich auf die Sonne im vorherigen Vers. Im Deutschen ist „Sonne“ grammatisch feminin; daher ist „sie“ natürlich. Das hebräische וְ wird im Deutschen nicht eigens mit „und“ wiedergegeben, weil der Vers als Fortführung des vorangehenden Satzes gelesen wird.
- source_word: כְּחָתָן
  choice: wie ein Bräutigam
  rationale: חָתָן bezeichnet einen Bräutigam. Die Wiedergabe bewahrt das gehobene poetische Hochzeitsbild.
- source_word: יֹצֵא
  choice: der … hervortritt
  rationale: Das Partizip von יצא beschreibt anschaulich das Herauskommen. „Hervortritt“ klingt im Deutschen natürlich und feierlich.
- source_word: מֵחֻפָּתוֹ
  choice: aus seinem Hochzeitsgemach
  rationale: חֻפָּה kann ein Hochzeits- oder Brautgemach, aber auch einen Hochzeitsbaldachin bezeichnen. „Hochzeitsgemach“ passt zum Bild des hervortretenden Bräutigams; die lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
- source_word: יָשִׂישׂ
  choice: sie jubelt
  rationale: Das Verb bezeichnet lebhafte, ausgelassene Freude. „Jubelt“ bewahrt die Kraft des poetischen Bildes.
- source_word: כְּגִבּוֹר
  choice: wie ein Held
  rationale: גִּבּוֹר bezeichnet einen starken, mächtigen Mann und häufig einen Krieger oder Helden. „Held“ lässt sowohl Kraft als auch die hier anklingende athletische Entschlossenheit erkennen, ohne das Bild unnötig auf den Krieg festzulegen.
- source_word: לָרוּץ
  choice: zu durchlaufen
  rationale: רוץ bedeutet „laufen“. In Verbindung mit einer Bahn gibt „durchlaufen“ die zielgerichtete Bewegung idiomatisch wieder, ohne einen Wettkampf ausdrücklich hinzuzufügen.
- source_word: אֹרַח
  choice: eine Bahn
  rationale: אֹרַח bedeutet Weg oder Pfad. Für den Lauf der Sonne ist „Bahn“ im Deutschen poetisch und idiomatisch; der unbestimmte Ausdruck vermeidet einen im Hebräischen nicht vorhandenen Possessivzusatz.
theological_decisions: []
