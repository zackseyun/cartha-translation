  register: Moderne, würdige poetische Standardsprache. Das feminine Pronomen folgt dem deutschen Genus von „Sonne“, während der Vergleich mit dem männlichen „Bräutigam“ erhalten bleibt. Parallelismus und freudig-kraftvolle Bildsprache werden gewahrt.
