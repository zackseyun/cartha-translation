translation:
  language: de
  text: Für den musikalischen Leiter. Ein Psalm Davids[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von David« beziehungsweise »für David«; die hebräische Formulierung kann Verfasserschaft, Zugehörigkeit oder Widmung bezeichnen.'
