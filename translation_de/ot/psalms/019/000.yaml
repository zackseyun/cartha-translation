lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Bezeichnung in Psalmüberschriften meint wahrscheinlich die für die musikalische Aufführung verantwortliche Person. »Musikalischer Leiter« ist im Deutschen verständlich und vermeidet die nicht sicher belegte Einschränkung auf einen Chor; die Präposition ל wird als »für« wiedergegeben.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist eine Gattungsbezeichnung mit musikalischem Bezug. »Psalm« ist dafür die etablierte und präzise deutsche Wiedergabe.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv entspricht der knappen traditionellen Form der Überschrift, ohne im Haupttext ausdrücklich zwischen Verfasserschaft, Zuordnung und Widmung zu entscheiden. Eine Fußnote macht die Bedeutungsbreite der hebräischen Konstruktion sichtbar.
theological_decisions:
- issue: Bedeutung von לְדָוִד in der Überschrift
  choice: Davids
  alternative: von David; für David
  rationale: Die hebräische Präposition ל kann hier Verfasserschaft, Zugehörigkeit oder Widmung anzeigen. Der Haupttext bewahrt die knappe Zuordnung zu David; die Fußnote nennt die möglichen genaueren Beziehungen, ohne eine davon verbindlich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Überschrift bleibt knapp; »musikalischer Leiter« ist gegenüber »Chorleiter« sachlich weiter und gibt die wahrscheinliche Funktion wieder. Der Fußnotenmarker steht unmittelbar bei »Davids«, da sich die Anmerkung auf לְדָוִד bezieht.
