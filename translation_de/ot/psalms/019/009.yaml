base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: de
  text: Die Furcht vor Jahwe ist rein[a] und bleibt für immer bestehen[b]; die Urteile Jahwes sind wahr[c], allesamt gerecht[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: lauter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: steht für immer.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: sind Wahrheit beziehungsweise sind zuverlässig. Für „Urteile“ auch: Rechtsentscheide oder Satzungen.'
    reason: lexical_alternative
  - marker: d
    text: Das Hebräische betont, dass sie gemeinsam beziehungsweise ausnahmslos gerecht sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: die Furcht vor Jahwe
  rationale: Die hebräische Wendung bezeichnet ehrfürchtige, auf Jahwe gerichtete Furcht. Die wörtlich-nahe Form bewahrt sowohl Ehrfurcht als auch die mögliche metonymische Beziehung zu Frömmigkeit oder Gottesverehrung, ohne diese festzulegen.
- source_word: טְהוֹרָה
  choice: rein
  rationale: Das Adjektiv kann kultische, moralische oder qualitative Reinheit bezeichnen. „Rein“ ist im Deutschen natürlich und lässt diese Bedeutungsbreite bestehen.
- source_word: עוֹמֶדֶת לָעַד
  choice: bleibt für immer bestehen
  rationale: Wörtlich bedeutet die Wendung „steht für immer“. „Bleibt für immer bestehen“ gibt den idiomatischen Sinn dauerhaften Bestands in klarem, gegenwärtigem Deutsch wieder.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: die Rechtsentscheide Jahwes
  rationale: מִשְׁפָּט bezeichnet hier göttliche Urteile, rechtliche Entscheidungen oder Satzungen. „Rechtsentscheide“ erhält den forensischen Akzent, ohne den Ausdruck auf menschliche Gerichtsakte zu verengen.
- source_word: אֱמֶת
  choice: wahr
  rationale: Das substantivische אֱמֶת steht prädikativ und kann „Wahrheit“, „wahr“ oder im weiteren Sinn „verlässlich“ bedeuten. „Sind wahr“ ist idiomatisches Deutsch und bleibt eng an der Formulierung des Verses.
- source_word: צָדְקוּ יַחְדָּו
  choice: allesamt gerecht
  rationale: Das Verb bezeichnet ihr Gerechtsein; יַחְדָּו hebt hervor, dass dies für sie gemeinsam beziehungsweise ausnahmslos gilt. „Allesamt gerecht“ bewahrt diese kollektive Gesamtaussage knapp und würdig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen verwendete Eigenname erkennbar bleibt und nicht durch einen Titel ersetzt wird.
theological_decisions:
- issue: Bezug der „Furcht vor Jahwe“ innerhalb einer Reihe von Bezeichnungen für Gottes Offenbarung
  choice: Die hebräische Wendung „Furcht vor Jahwe“ wird unmittelbar beibehalten.
  alternative: „Verehrung Jahwes“, „Gottesdienst für Jahwe“ oder „Religion Jahwes“
  rationale: Im Zusammenhang kann die Wendung metonymisch Frömmigkeit, Gottesverehrung oder offenbarte Weisung bezeichnen. Eine deutende Ersetzung würde diese theologische Spannung vorzeitig auflösen.
- issue: Bedeutung von אֱמֶת als Aussage über Jahwes Rechtsentscheide
  choice: „sind wahr“
  alternative: „sind Wahrheit“ oder „sind zuverlässig“
  rationale: „Wahr“ bewahrt die direkte Wahrheitsaussage und lässt zugleich die im hebräischen Begriff enthaltene Nuance von Beständigkeit und Verlässlichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Bezug zur hebräischen Bildsprache. „Furcht“ wird nicht zu „Ehrfurcht“ abgeschwächt, „bleibt für immer bestehen“ gibt die hebräische Bestandsmetapher idiomatisch wieder, und „allesamt“ erhält den kollektiven Nachdruck von יַחְדָּו.
