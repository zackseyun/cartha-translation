id: PSA.19.3
reference: Psalms 19:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: de
  text: Es gibt keine Rede und keine Worte; ihre Stimme[a] wird nicht gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Klang«. Das hebräische Wort קוֹל kann »Stimme«, »Klang« oder »Laut« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: es gibt keine
  rationale: Die existentielle Verneinung wird im modernen Deutschen natürlich mit »es gibt keine« wiedergegeben und gilt parallel für »Rede« und »Worte«.
- source_word: אֹמֶר
  choice: Rede
  rationale: Bezeichnet hier allgemein eine sprachliche Äußerung; »Rede« bildet mit »Worte« eine passende poetische Parallele.
- source_word: דְּבָרִים
  choice: Worte
  rationale: Im Zusammenhang von Verkündigung und Hören ist die konkrete Bedeutung »Worte« am naheliegendsten.
- source_word: בְּלִי
  choice: nicht
  rationale: Kennzeichnet den verneinten Umstand des Hörens; die Wiedergabe »wird nicht gehört« ist klar und wahrt die hebräische Aussage.
- source_word: נִשְׁמָע
  choice: wird gehört
  rationale: Die passive Form von שׁמע wird direkt und idiomatisch wiedergegeben.
- source_word: קוֹלָם
  choice: ihre Stimme
  rationale: »Stimme« bewahrt die Personifikation der Himmel; da קוֹל auch »Klang« oder »Laut« bedeuten kann, wird die Alternative in einer Fußnote erhalten.
theological_decisions:
- issue: Das Zeugnis der Himmel als nichtsprachliche Mitteilung
  choice: 'Der Vers verneint gewöhnliche gesprochene Sprache: »Es gibt keine Rede und keine Worte; ihre Stimme wird nicht gehört.«'
  alternative: Die Zeile kann so verstanden werden, dass ihr Zeugnis ohne Rede und Worte ergeht, also lautlos und dennoch umfassend ist.
  rationale: 'Die hebräische Syntax stützt die Aussage, dass buchstäbliche Rede und hörbare Worte fehlen. Die Übersetzung wahrt damit die poetische Spannung: Die Schöpfung verkündet Gottes Herrlichkeit, jedoch nicht durch gewöhnliche menschliche Sprache.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wiederholung von »keine« macht die zweigliedrige Verneinung des Hebräischen deutlich; »Stimme« bewahrt die Personifikation, ohne die nichtsprachliche Bildaussage festzulegen.
