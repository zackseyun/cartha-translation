id: PSA.19.13
reference: Psalms 19:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: de
  text: Bewahre deinen Diener auch vor vermessenen Sünden[a]; lass sie nicht über mich herrschen. Dann werde ich untadelig[b] und frei von schwerem Vergehen[c] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den Vermessenen“ beziehungsweise „vor hochmütigen Menschen“. Das Hebräische kann sowohl Personen als auch vermessene Verfehlungen bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „lauter“, „ganz“ beziehungsweise „schuldlos“. Gemeint sein kann sittliche Integrität oder Unversehrtheit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von großer Auflehnung“. Das hebräische Wort kann eine Übertretung mit dem Beiklang bewusster Rebellion bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: Bewahrt die additive Verbindung zur Bitte um Vergebung verborgener Verfehlungen im vorhergehenden Vers.
- source_word: מִזֵּדִים
  choice: vor vermessenen Sünden
  rationale: Der Ausdruck kann hochmütige Menschen oder vermessene, vorsätzlich-überhebliche Verfehlungen bezeichnen. Der Zusammenhang mit den Verfehlungen des vorhergehenden Verses spricht hier eher für die zweite Bedeutung; die Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: חֲשֹׂךְ
  choice: bewahre
  rationale: Gibt die Bitte wieder, Gott möge den Betenden zurückhalten und vor solchen Sünden schützen; im Deutschen ist dies natürlicher als eine wörtliche Wiedergabe mit „zurückhalten“.
- source_word: עַבְדֶּךָ
  choice: deinen Diener
  rationale: Entspricht der Gebetssprache und wahrt die Haltung der Unterordnung, ohne hier unnötig den rechtlichen Status eines Sklaven hervorzuheben.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: lass sie nicht über mich herrschen
  rationale: Bewahrt das Bild einer beherrschenden Macht und den Pluralbezug auf die vermessenen Sünden.
- source_word: אָז
  choice: Dann
  rationale: Kennzeichnet knapp und klar die Folge des erbetenen göttlichen Bewahrens.
- source_word: אֵיתָם
  choice: werde ich untadelig sein
  rationale: Der Ausdruck bezeichnet Ganzheit beziehungsweise sittliche Integrität. „Untadelig“ passt zum ethischen Zusammenhang, ohne absolute Sündlosigkeit zu behaupten.
- source_word: וְנִקֵּיתִי
  choice: und frei … sein
  rationale: Das Verb bezeichnet das Freisein von Schuld beziehungsweise das Unbelastetsein durch eine Verfehlung; die deutsche Konstruktion verbindet sich natürlich mit der folgenden Präpositionalphrase.
- source_word: מִפֶּשַׁע רָב
  choice: von schwerem Vergehen
  rationale: פֶּשַׁע bezeichnet eine gewichtige Übertretung oder Auflehnung. „Schweres Vergehen“ gibt die Ernsthaftigkeit in verständlichem, gegenwärtigem Deutsch wieder.
theological_decisions:
- issue: Bezugsbedeutung von מִזֵּדִים
  choice: vermessene Sünden
  alternative: die Vermessenen / hochmütige Menschen
  rationale: Der unmittelbare Zusammenhang handelt von verborgenen Verfehlungen, und auch das folgende Bild ihrer Herrschaft lässt sich sinnvoll auf Sünden beziehen. Da die Personenlesart sprachlich möglich bleibt, wird sie ausdrücklich in der Fußnote genannt.
- issue: Bedeutungsumfang von אֵיתָם
  choice: untadelig im Sinn sittlicher Integrität
  alternative: ganz, lauter oder schuldlos
  rationale: Die Aussage beschreibt die Folge von Gottes Bewahrung vor beherrschender Sünde. Sie darf daher nicht ohne Weiteres als Behauptung absoluter Vollkommenheit verstanden werden; die lexikalische Offenheit wird in einer Fußnote kenntlich gemacht.
- issue: Bedeutung von פֶּשַׁע רָב
  choice: schweres Vergehen
  alternative: große Auflehnung
  rationale: Die Übersetzung hält den Gedanken einer gravierenden Übertretung fest, ohne die ebenfalls vorhandene Nuance bewusster Auflehnung zum alleinigen Sinn zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Gedankengang, klingt jedoch natürlich. „Vermessene Sünden“ ist bewusst etwas gehoben, weil es sowohl Vorsätzlichkeit als auch überhebliche Selbstüberschätzung ausdrückt; die echte Mehrdeutigkeit des Hebräischen wird nicht im Haupttext überladen, sondern in der Fußnote offengelegt.
