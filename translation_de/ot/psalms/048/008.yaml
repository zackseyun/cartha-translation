  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: de
  text: 'Wie wir gehört haben, so haben wir gesehen in der Stadt Jahwes der Heerscharen, in der Stadt unseres Gottes: Gott wird sie[a] für immer befestigen. Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie“ bezieht sich auf die Stadt. Das hebräische Suffix ist feminin, entsprechend dem grammatischen Geschlecht von „Stadt“.
    reason: Das feminine Suffix von יְכוֹנְנֶהָ verweist auf die Stadt; die Anmerkung klärt den Bezug, ohne die poetische Form zwingend weiter zu deuten.
lexical_decisions:
- source_word: כַּאֲשֶׁר … כֵּן
  choice: Wie … so
  rationale: Die deutsche Vergleichsformel gibt die hebräische Entsprechung unmittelbar und natürlich wieder.
- source_word: שָׁמַעְנוּ … רָאִינוּ
  choice: wir gehört haben … wir es gesehen
  rationale: Die Perfektformen bezeichnen hier erfahrene Wirklichkeit; das ergänzte „es“ ist im Deutschen idiomatisch und verweist auf den Inhalt des Gehörten.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ bewahrt die Breite des traditionellen Hoheitstitels, ohne ihn auf irdische Armeen einzuengen.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Die Konstruktform mit Suffix der ersten Person Plural wird direkt und natürlich wiedergegeben.
- source_word: יְכוֹנְנֶהָ
  choice: wird sie fest gründen
  rationale: Das Verb bezeichnet ein dauerhaftes Festgründen bzw. Sichern; das feminine Pronomen nimmt die ebenfalls feminine „Stadt“ auf.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Eine klare, moderne Wiedergabe unbegrenzter Dauer.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und liturgische Funktion des Ausdrucks unsicher sind, wird er transliteriert statt interpretierend übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text bietet den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des femininen Suffixes in יְכוֹנְנֶהָ
  choice: Gott wird sie für immer fest gründen
  alternative: Gott wird sie für immer befestigen; Gott wird die Stadt für immer fest gründen
  rationale: Das feminine Suffix bezieht sich am natürlichsten auf die feminine „Stadt“. Das Pronomen erhält die knappe poetische Rückverweisung, ohne über eine weitergehende Personifikation zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Wahrung des poetischen Parallelismus. „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt; „Jahwe der Heerscharen“ bewahrt den traditionellen Titel ohne konfessionelle Zusätze.
