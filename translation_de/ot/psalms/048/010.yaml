id: PSA.48.10
reference: Psalms 48:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: de
  text: Wie dein Name, Gott, so reicht dein Lob bis an die Enden der Erde[a]; deine rechte Hand ist voll von Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »so ist dein Lob über den Enden der Erde« oder »so erstreckt sich dein Lob über die Enden der Erde«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Recht«. Das hebräische Wort kann sowohl Gerechtigkeit als auch gerechtes richterliches Handeln bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן
  choice: Wie dein Name ... so
  rationale: Die Vergleichskonstruktion mit כְּ und כֵּן wird durch die natürliche deutsche Entsprechung »wie … so« wiedergegeben und bewahrt den poetischen Parallelismus.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Nomen steht hier als direkte Anrede; im Deutschen macht die Stellung zwischen Kommas den Vokativ ohne ein zusätzliches »o« deutlich.
- source_word: תְּהִלָּתְךָ
  choice: dein Lob
  rationale: »Lob« gibt die Grundbedeutung direkt wieder und lässt offen, ob vor allem das Gott dargebrachte Lob oder sein dadurch verbreiteter Ruhm gemeint ist.
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: bis an die Enden der Erde
  rationale: Das wörtliche עַל bedeutet »auf/über«. In Verbindung mit den Enden der Erde drückt »bis an« den räumlichen Umfang idiomatisch aus; die formalere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« deckt im Deutschen sowohl moralische Rechtschaffenheit als auch gerechtes, rechtsetzendes Handeln ab und bewahrt damit die Bedeutungsbreite des hebräischen Wortes.
- source_word: מָלְאָה יְמִינֶךָ
  choice: deine rechte Hand ist voll von
  rationale: Die feminine Verbform stimmt mit »rechte Hand« überein und beschreibt einen bestehenden Zustand. Das konkrete biblische Bild bleibt unverändert erhalten.
theological_decisions:
- issue: Bedeutungsumfang von צֶדֶק bei Gottes rechter Hand
  choice: Gerechtigkeit
  alternative: Recht; gerechtes Handeln
  rationale: Das hebräische Wort kann moralische Gerechtigkeit und richterliche Rechtsprechung bezeichnen. »Gerechtigkeit« wahrt diese Spannung weitgehend; die Fußnote nennt eine stärker forensische Wiedergabe.
translation_notes:
  register: Moderne, würdevolle Psalmenprosa mit klarer Vergleichsstruktur. »Gott« bleibt als schlichte direkte Anrede stehen; »o Gott« wurde vermieden, da es im heutigen Deutsch stärker gehoben und altertümlich wirkt.
