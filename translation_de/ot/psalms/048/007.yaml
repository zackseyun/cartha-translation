  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: de
  text: Mit einem Ostwind zerschmetterst du die Tarschisch-Schiffe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Schiffe nach Tarschisch“ oder „Tarschischschiffe“. Die Bezeichnung kann große, seetüchtige Handelsschiffe meinen, die mit Tarschisch verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּחַ קָדִים
  choice: Durch einen Ostwind
  rationale: רוּחַ bezeichnet zusammen mit קָדִים einen zerstörerischen Ostwind; die Präposition בְּ wird instrumental mit „durch“ wiedergegeben.
- source_word: תְּשַׁבֵּר
  choice: zerschmetterst du
  rationale: Der Piel von שׁבר bezeichnet ein gewaltsames Zerbrechen. Die zweite Person Singular bleibt als direkte Anrede Gottes erhalten.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: die Tarschisch-Schiffe
  rationale: Die Verbindung kann Schiffe aus oder nach Tarschisch sowie allgemein große, seetüchtige Handelsschiffe bezeichnen. Das traditionelle Kompositum bewahrt diese Mehrdeutigkeit; die Einzelheiten werden in der Fußnote erläutert.
theological_decisions:
- issue: Adressat der Verbform in der zweiten Person
  choice: direkte Anrede Gottes („zerschmetterst du“)
  alternative: unpersönliche oder verallgemeinernde Aussage
  rationale: Die maskuline Singularform der zweiten Person und der Zusammenhang des Psalms sprechen für eine direkte Anrede Gottes, ohne dass zusätzliche theologische Aussagen eingeführt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zerschmettern“ gibt die Wucht des hebräischen Piel wieder; „Tarschisch-Schiffe“ ist verständlich und bewahrt die genuine lexikalische Mehrdeutigkeit.
