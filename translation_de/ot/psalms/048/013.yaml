base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: de
  text: Richtet euer Herz auf ihren Schutzwall[a], durchschreitet ihre Paläste[b], damit ihr einer späteren Generation davon erzählt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ihre äußere Mauer“. Das hebräische Wort bezeichnet allgemein eine Befestigungsanlage einer Stadt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Zitadellen“. Das hebräische Wort kann Paläste, befestigte Residenzen oder Festungsbauten bezeichnen; der Zusammenhang lässt auch die militärische Bedeutung zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: Richtet euer Herz
  rationale: Die Verbindung bedeutet idiomatisch, die Aufmerksamkeit bewusst auf etwas zu lenken. „Herz“ bewahrt dabei das hebräische Menschenbild und die Bildsprache.
- source_word: לְחֵילָה
  choice: auf ihren Schutzwall
  rationale: חֵיל bezeichnet hier eine städtische Befestigungsanlage, wahrscheinlich einen Wall oder eine äußere Mauer. „Schutzwall“ ist im Deutschen klar und bewahrt den militärisch-topografischen Zusammenhang.
- source_word: פַּסְּגוּ
  choice: durchschreitet
  rationale: Das seltene Verb bezeichnet im Zusammenhang die erkundende Bewegung durch die Stadtanlage. „Durchschreitet“ wahrt den räumlichen Sinn, ohne das Verb rein gedanklich zu deuten.
- source_word: אַרְמְנוֹתֶיהָ
  choice: ihre Zitadellen
  rationale: אַרְמוֹן kann Paläste oder befestigte, hervorgehobene Gebäude bezeichnen. Neben dem Schutzwall passt „Zitadellen“ gut zum Zusammenhang einer Besichtigung der Befestigungen; die andere Bedeutung bleibt in der Fußnote erhalten.
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: damit ihr … davon erzählt
  rationale: לְמַעַן leitet einen Zweck ein, und das Piel von ספר bedeutet „erzählen“ oder „berichten“. Das im Hebräischen unausgesprochene Erzählte wird im Deutschen idiomatisch mit „davon“ aufgenommen.
- source_word: לְדוֹר אַחֲרוֹן
  choice: einer späteren Generation
  rationale: Die Wendung bedeutet wörtlich „einer späteren/nachfolgenden Generation“. Die unbestimmte Form bewahrt die Offenheit des Hebräischen besser als „der nächsten Generation“.
