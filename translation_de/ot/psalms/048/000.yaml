translation:
  language: de
  text: Ein Lied, ein Psalm von[a] den Söhnen Korachs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Söhne Korachs“. Die hebräische Präposition kann in Psalmüberschriften Zuordnung, Urheberschaft, Widmung oder den Aufführungskontext bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר
  choice: Lied
  rationale: Das Substantiv ist die übliche hebräische Bezeichnung für ein Lied; in einer Psalmüberschrift ist „Lied“ natürlich und präzise.
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: In Psalmüberschriften bezeichnet das Wort einen musikalisch vorzutragenden Psalm. „Psalm“ bewahrt die eigene Gattungsbezeichnung neben שִׁיר, ohne beide Begriffe zusammenzuziehen.
- source_word: לִבְנֵי
  choice: von den Söhnen
  rationale: Die Präposition ל kann in Psalmüberschriften Urheberschaft, Zuordnung, Widmung oder Aufführungskontext ausdrücken. „von“ ist im Deutschen eine knappe, herkömmliche Wiedergabe; die mögliche Bedeutung „für“ wird in der Fußnote festgehalten.
- source_word: קֹרַח
  choice: Korach
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form „Korach“ wiedergegeben.
theological_decisions:
- issue: Funktion der Wendung לִבְנֵי קֹרַח in der Psalmüberschrift
  choice: von den Söhnen Korachs
  alternative: für die Söhne Korachs
  rationale: Das hebräische ל ist semantisch weit und legt weder Urheberschaft noch Bestimmung eindeutig fest. Der Haupttext folgt der geläufigen Zuordnung mit „von“, während die Fußnote die echte Alternative nennt, ohne die Überschrift enger auszulegen als der Ausgangstext.
translation_notes:
  register: Kurze, würdige Psalmüberschrift in modernem Standarddeutsch. Die doppelte Gattungsangabe „Lied, … Psalm“ bleibt erhalten; die ungeklärte Funktion der Präposition wird nicht stillschweigend vereindeutigt.
