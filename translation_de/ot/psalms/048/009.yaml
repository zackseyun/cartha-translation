base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: de
  text: Wir haben über deine treue Liebe nachgedacht[a], Gott, mitten in deinem Tempel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir haben an deine treue Liebe gedacht“ oder „wir haben sie bedacht“. Das hebräische Verb kann ein Nachdenken, Erwägen oder betrachtendes Sinnen bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: wir haben … nachgedacht
  rationale: Das Piel Perfekt in der 1. Person Plural bezeichnet hier am ehesten ein bedächtiges Nachsinnen. Die Formulierung ist modernes, natürliches Deutsch und wahrt zugleich den rückblickenden Aspekt der hebräischen Verbform.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים ist hier als direkte Anrede verstanden. Im Deutschen macht die Kommasetzung den Vokativ deutlich; ein zusätzliches „o“ wäre möglich, klänge jedoch gehobener und weniger gegenwärtig.
- source_word: חַסְדֶּךָ
  choice: deine treue Liebe
  rationale: חֶסֶד umfasst liebevolle Zuwendung, Verlässlichkeit und Bundestreue. „Treue Liebe“ bewahrt diese Bedeutungsweite besser als das engere „Barmherzigkeit“ und ist verständlicher als ein technischer theologischer Ausdruck.
- source_word: בְּקֶרֶב
  choice: mitten in
  rationale: Die Wendung bezeichnet das Innere beziehungsweise die Mitte eines Ortes. „Mitten in“ gibt den räumlichen Sinn klar und idiomatisch wieder.
- source_word: הֵיכָלֶךָ
  choice: deinem Tempel
  rationale: הֵיכָל kann „Palast“ oder „Tempel“ bedeuten; der gottesdienstliche Zusammenhang des Psalms und die Anrede Gottes sprechen hier für „Tempel“.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד als Eigenschaft Gottes
  choice: treue Liebe
  alternative: Güte; Barmherzigkeit; Bundestreue
  rationale: „Treue Liebe“ hält Zuneigung und beständige Verlässlichkeit zusammen, ohne den Ausdruck auf Mitleid zu verengen oder ihn durch einen theologischen Fachbegriff eindeutig festzulegen.
- issue: Funktion von אֱלֹהִים
  choice: 'direkte Anrede: „Gott“'
  alternative: Aussage über Gott ohne vokativische Funktion
  rationale: Der Satz ist im Zusammenhang am natürlichsten als Gebets- beziehungsweise Liedanrede zu verstehen. Die deutsche Zeichensetzung kennzeichnet diese Lesart, ohne zusätzliche Inhalte einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Schlichtheit. Der Perfektform des Hebräischen wird entsprochen; die direkte Anrede wird ohne das im heutigen Deutsch stärker feierlich wirkende „o“ wiedergegeben.
