  text: אֱלֹהִ֥ים בְּ/אַרְמְנוֹתֶ֗י/הָ נוֹדַ֥ע לְ/מִשְׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: de
  text: In ihren Zitadellen[a] ist Gott als Schutzburg[b] bekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihren Palästen“ oder „in ihren Burgen“. Das hebräische Wort kann sowohl prächtige Wohnbauten als auch befestigte Anlagen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Zuflucht“ oder „als Festung“. Das hebräische Wort bezeichnet einen sicheren, erhöhten Ort, der Schutz bietet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier als feststehender Gottesname den Gott Israels und wird daher im Deutschen singularisch wiedergegeben.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: in ihren Zitadellen
  rationale: אַרְמוֹן kann einen Palast oder einen befestigten, repräsentativen Bau bezeichnen. Im Zusammenhang mit der Sicherheit Zions bringt „Zitadellen“ den Wehrcharakter zur Geltung, ohne die Größe und Würde der Anlagen auszublenden. Das feminine Suffix bezieht sich auf die personifizierte Stadt.
- source_word: נוֹדַע
  choice: ist … bekannt
  rationale: Der Niphal von ידע kann einen zuständlichen beziehungsweise passiven Sinn haben. „Ist … bekannt“ bewahrt die knappe Aussage, ohne ausdrücklich ein reflexives „hat sich erwiesen“ einzutragen.
- source_word: לְמִשְׂגָּב
  choice: als Schutzburg
  rationale: מִשְׂגָּב bezeichnet einen erhöhten, sicheren Zufluchtsort. „Schutzburg“ verbindet Schutz und befestigte Höhe und passt idiomatisch zur Wendung „als … bekannt“.
theological_decisions:
- issue: Bezug des femininen Suffixes in בְּאַרְמְנוֹתֶיהָ
  choice: Das Suffix bezieht sich auf Zion beziehungsweise die im Psalm gefeierte Stadt.
  alternative: Bezug auf das Land oder die Gemeinschaft im weiteren Sinn.
  rationale: Der unmittelbare Zusammenhang von Psalm 48 handelt vom Berg Zion und der Stadt Gottes; daher liegt die personifiziert feminin aufgefasste Stadt als Bezug am nächsten.
- issue: Art des Bekanntseins Gottes
  choice: Die Formulierung bleibt bei der Aussage, dass Gott als Schutzburg bekannt ist.
  alternative: „Gott hat sich als Schutzburg erwiesen“ beziehungsweise „zu erkennen gegeben“.
  rationale: Die hebräische Niphalform lässt eine stative oder passive Aussage zu. Die Übersetzung vermeidet es, die mögliche reflexive beziehungsweise ereignishafte Nuance ausdrücklich festzulegen.
translation_notes:
  register: Knappe, poetische Satzstellung in modernem, würdigem Standarddeutsch. „Zitadellen“ und „Schutzburg“ erhalten das Bild der befestigten und von Gott geschützten Stadt; die Fußnoten bewahren die wichtigsten Bedeutungsalternativen.
