  terminology: „Zitadellen“ wahrt den im Kontext naheliegenden befestigenden Aspekt von אַרְמְנוֹתֶיהָ, ohne die im Fußnotenapparat dokumentierte Alternative „Paläste“ auszuschließen. „Schutzburg“ gibt die Schutzfunktion von מִשְׂגָּב angemessen wieder; die Alternativen „Zuflucht“ und „Festung“ sind sinnvoll verankert.
