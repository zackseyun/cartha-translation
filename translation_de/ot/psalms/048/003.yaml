  source_fidelity: 'Die Übersetzung gibt die Satzglieder und die poetisch knappe Aussage des Hebräischen zuverlässig wieder: אֱלֹהִים als „Gott“, בְּאַרְמְנוֹתֶיהָ als „in ihren Zitadellen“, נוֹדַע als „ist … bekannt“ und לְמִשְׂגָּב als prädikatives „als Schutzburg“. Der Bezug von „ihren“ auf Zion bzw. die Stadt ist kontextuell gut begründet.'
