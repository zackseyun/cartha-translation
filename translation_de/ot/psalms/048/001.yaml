id: PSA.48.1
reference: Psalms 48:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: de
  text: Groß ist Jahwe und hoch zu preisen in der Stadt unseres Gottes, auf seinem heiligen Berg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּדוֹל
  choice: Groß
  rationale: Das prädikative Adjektiv steht betont am Versanfang; „Groß ist Jahwe“ bewahrt Wortfolge und umfassenden Aussagegehalt, ohne die Größe auf Macht zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּמְהֻלָּל מְאֹד
  choice: und hoch zu preisen
  rationale: Das passive Partizip von הלל bezeichnet Jahwe als jemanden, der in höchstem Maß gepriesen werden soll beziehungsweise des Lobes würdig ist. „Hoch zu preisen“ ist im Deutschen natürlich und gibt מְאֹד idiomatisch wieder.
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: in der Stadt unseres Gottes
  rationale: בְּ wird lokal wiedergegeben; die Konstruktverbindung bewahrt die Zugehörigkeit der Stadt zu „unserem Gott“.
- source_word: הַר קָדְשׁוֹ
  choice: auf seinem heiligen Berg
  rationale: Die Ortsangabe wird im Deutschen mit „auf“ natürlich an die Stadtbestimmung angeschlossen. „Sein heiliger Berg“ bezeichnet Zion, ohne diese Identifikation ausdrücklich in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch den Titel „der HERR“.
- issue: Bezug und Syntax von הַר קָדְשׁוֹ
  choice: 'als zweite, appositionelle Ortsbestimmung: „auf seinem heiligen Berg“'
  alternative: 'unmittelbare Apposition zur Stadt: „die Stadt unseres Gottes, sein heiliger Berg“'
  rationale: Der knappe poetische Nominalstil lässt die genaue syntaktische Verknüpfung offen. Die gewählte Fassung ergibt natürliches Deutsch und bewahrt die räumliche Verbindung von Gottes Stadt und heiligem Berg, ohne beides begrifflich vollständig gleichzusetzen.
translation_notes:
  register: Moderner, würdevoller poetischer Standardstil. Die Anfangsstellung „Groß ist Jahwe“ bewahrt die hebräische Hervorhebung; „hoch zu preisen“ ist verständlich und zugleich gehoben. Keine Fußnote ist nötig, da die mögliche Bedeutungsnuance des passiven Partizips im Haupttext angemessen abgedeckt wird.
