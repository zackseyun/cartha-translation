  text: כִּ֤י זֶ֨ה אֱלֹהִ֣ים אֱ֭לֹהֵי/נוּ עוֹלָ֣ם וָ/עֶ֑ד ה֖וּא יְנַהֲגֵ֣/נוּ עַל מֽוּת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/014.yaml
  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: de
  text: Denn dieser Gott ist unser Gott für immer und ewig; er wird uns bis zum Tod führen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die letzten hebräischen Wörter sind schwer zu deuten. Auch eine Deutung im Sinn von „über den Tod hinaus“ wurde vertreten. Manche verstehen die Konsonantenfolge anders oder rechnen sie zu einer musikalischen Angabe.
    reason: Die masoretische Wortfolge עַל־מוּת ist ungewöhnlich und wurde bereits in alten Überlieferungen sowie in der neueren Auslegung verschieden verstanden.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים
  choice: Denn dieser Gott
  rationale: כִּי begründet hier die vorausgehende Aufforderung; זֶה אֱלֹהִים bezeichnet nachdrücklich „diesen Gott“.
- source_word: אֱלֹהֵינוּ עוֹלָם וָעֶד
  choice: ist unser Gott für immer und ewig
  rationale: Die deutsche Nominalaussage ergänzt natürlich „ist“; die feste Wortverbindung עוֹלָם וָעֶד drückt unbegrenzte Dauer aus.
- source_word: יְנַהֲגֵנוּ
  choice: er wird uns … führen
  rationale: Das Verb נהג bezeichnet Leitung oder Führung; die Zukunftsform bleibt erhalten.
- source_word: עַל־מוּת
  choice: über den Tod hinaus
  rationale: Die masoretisch als עַל מוּת gelesene schwierige Wendung kann eine Führung über die Todesgrenze hinaus ausdrücken. Die Übersetzung wahrt diese im vorgelegten Textzusammenhang gewichtige Lesart, ohne die textliche Unsicherheit zu verschweigen.
theological_decisions:
- issue: Reichweite der göttlichen Führung angesichts des Todes
  choice: „über den Tod hinaus“
  alternative: „bis zum Tod“; außerdem wurde die Konsonantenfolge als anders abgetrennter musikalischer oder textlicher Ausdruck verstanden
  rationale: Die gewählte Fassung nimmt עַל־מוּת als Aussage an der Todesgrenze und darüber hinaus ernst, macht daraus aber keine weiter ausgeführte Lehre über das Jenseits. Wegen der ungewöhnlichen hebräischen Formulierung wird die Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelklang „für immer und ewig“ bleibt erhalten; die Schlusswendung ist verständlich formuliert und ihre echte textliche Mehrdeutigkeit wird durch die Fußnote kenntlich gemacht.
