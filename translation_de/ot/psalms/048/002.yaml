  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: de
  text: Schön erhebt sich, eine Freude der ganzen Erde, der Berg Zion, im äußersten Norden, die Stadt des großen Königs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: Schön erhebt sich
  rationale: Die schwierige Verbindung bezeichnet wahrscheinlich Zions schöne, erhabene Lage oder Erscheinung. Die deutsche Formulierung gibt sowohl Schönheit als auch Höhe natürlich und poetisch wieder, ohne eine unsichere Einzelbedeutung von נוֹף zu überpräzisieren.
- source_word: מְשׂוֹשׂ כָּל הָאָרֶץ
  choice: eine Freude für die ganze Erde
  rationale: מְשׂוֹשׂ bezeichnet Freude oder Entzücken. „Für die ganze Erde“ drückt die Beziehung im Deutschen idiomatisch aus und bewahrt die weltweite Perspektive.
- source_word: הַר צִיּוֹן
  choice: der Berg Zion
  rationale: Übliche und verständliche deutsche Wiedergabe des Gattungsnamens mit dem Ortsnamen.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: im äußersten Norden
  rationale: יַרְכְּתֵי bezeichnet entlegene Bereiche, Seiten oder äußerste Teile; צָפוֹן kann „Norden“ und möglicherweise den mythisch aufgeladenen Zafon bezeichnen. Die Hauptfassung wahrt die knappe räumliche Bildsprache, während die Mehrdeutigkeit in der Fußnote offengelegt wird.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: die Stadt des großen Königs
  rationale: Die Status-constructus-Verbindung wird als bestimmte, zu „Berg Zion“ appositionelle Bezeichnung wiedergegeben. „Des großen Königs“ bewahrt den naheliegenden Bezug auf Gott, ohne ihn im Text ausdrücklich zu ergänzen.
theological_decisions:
- issue: Deutung von יַרְכְּתֵי צָפוֹן in Bezug auf den Berg Zion
  choice: im äußersten Norden
  alternative: „an den nördlichen Hängen“ oder eine Anspielung auf den göttlichen Berg Zafon
  rationale: Die hebräische Wendung kann topografisch verstanden werden, zugleich aber an altorientalische Vorstellungen vom göttlichen Berg Zafon anklingen. Die Übersetzung entscheidet diese Spannung nicht stillschweigend, sondern nennt die möglichen Deutungen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Satzbau. Die nachgestellten Bezeichnungen „der Berg Zion“ und „die Stadt des großen Königs“ bewahren die appositionelle Struktur des Hebräischen; die sachliche und theologische Mehrdeutigkeit der Nord-Wendung bleibt sichtbar.
