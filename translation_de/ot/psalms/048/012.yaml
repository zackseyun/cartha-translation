  text: סֹ֣בּוּ צִ֭יּוֹן וְ/הַקִּיפ֑וּ/הָ סִ֝פְר֗וּ מִגְדָּלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/012.yaml
  text: Walk around Zion and go around her[a]; count her towers.
translation:
  language: de
  text: Geht um Zion herum und umkreist sie[a]; zählt ihre Türme!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geht rings um Zion und zieht um sie herum.“'
    reason: Lexikalische Alternative für die beiden räumlich ähnlichen Imperative; der zweite kann auch mit „um sie herumziehen“ wiedergegeben werden.
lexical_decisions:
- source_word: סֹבּוּ
  choice: Geht um … herum
  rationale: Der Imperativ Plural von סבב bezeichnet hier die konkrete Bewegung rings um die Stadt; die deutsche Wendung ist natürlich und wahrt das räumliche Bild.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird entsprechend dem hebräischen Text ohne den nicht ausdrücklich genannten Zusatz „Berg“ wiedergegeben.
- source_word: וְהַקִּיפוּהָ
  choice: und umkreist sie
  rationale: Der Imperativ Plural mit femininem Objektsuffix fordert zu einer Bewegung rings um Zion auf. „Umkreist sie“ bewahrt den femininen Bezug und vermeidet die möglicherweise feindliche Nebenbedeutung von „umzingelt sie“.
- source_word: סִפְרוּ
  choice: zählt
  rationale: Im Zusammenhang mit den Türmen bezeichnet ספר deren zahlenmäßiges Erfassen; „zählt“ ist direkt und idiomatisch.
- source_word: מִגְדָּלֶיהָ
  choice: ihre Türme
  rationale: Das feminine Suffix bezieht sich auf Zion als personifizierte Stadt; „ihre“ erhält diesen Bezug im Deutschen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bewegungsverben des Hebräischen bleiben unterscheidbar; die feminine Personifikation Zions wird durch „sie/ihre“ bewahrt.
