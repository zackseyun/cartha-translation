    rationale: Das hebräische Wort kann gerichtliche Entscheidungen bzw. Rechtshandeln bezeichnen, ohne ausdrücklich nur vollzogene Taten zu meinen. »Gerichte« ist näher am Ausgangstext und lässt die sachliche Nuance offen.
  - severity: low
