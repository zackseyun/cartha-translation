  text: יִשְׂמַ֤ח הַר צִיּ֗וֹן תָּ֭גֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְ֝מַ֗עַן מִשְׁפָּטֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: de
  text: Der Berg Zion freue sich, die Töchter Judas[a] mögen jubeln über deine Gerichte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Töchtern Judas« können poetisch auch die Städte oder Ortschaften Judas gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: freue sich
  rationale: Der Qal-Imperfekt kann im poetischen Zusammenhang auffordernd beziehungsweise wünschend verstanden werden; der deutsche Konjunktiv drückt dies würdig und knapp aus.
- source_word: הַר צִיּוֹן
  choice: der Berg Zion
  rationale: Die geläufige deutsche Wendung bewahrt das topografische Bild der hebräischen Verbindung.
- source_word: תָּגֵלְנָה
  choice: sollen jubeln
  rationale: Das Verb bezeichnet freudiges Jauchzen oder Jubeln. „Sollen jubeln“ gibt hier die auffordernde Nuance wieder und variiert natürlich gegenüber „freue sich“.
- source_word: בְּנוֹת יְהוּדָה
  choice: die Töchter Judas
  rationale: Die wörtliche poetische Formulierung bleibt im Haupttext erhalten; sie kann zugleich die zu Juda gehörenden Städte oder Ortschaften bezeichnen.
- source_word: לְמַעַן
  choice: über
  rationale: Im Deutschen ist „über“ bei Freude oder Jubel idiomatisch und gibt in diesem Zusammenhang den Anlass wieder.
- source_word: מִשְׁפָּטֶיךָ
  choice: deine Gerichtstaten
  rationale: Im Kontext sind wahrscheinlich Gottes richterliche Entscheidungen beziehungsweise vollzogene Gerichte gemeint. „Gerichtstaten“ wahrt den Plural und macht den ereignishaften Sinn deutlicher als das potenziell gesetzesbezogene „Rechtsbestimmungen“.
theological_decisions:
- issue: Bedeutung von מִשְׁפָּטֶיךָ im Kontext
  choice: deine Gerichtstaten
  alternative: deine Gerichte; deine Rechtsbestimmungen; deine Gerechtigkeit
  rationale: Der Psalm feiert Gottes königliches Eingreifen gegen feindliche Mächte. Daher liegt der Sinn konkreter richterlicher Taten nahe; die Wiedergabe legt jedoch nicht fest, worin diese im Einzelnen bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. Die ungewöhnliche Bildrede „Töchter Judas“ bleibt aus Gründen der Transparenz im Haupttext und wird in der Fußnote erläutert.
