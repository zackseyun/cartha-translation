  text: Dort packte sie das Zittern, Wehen wie bei einer Gebärenden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dort packte sie das Zittern, Angst wie bei einer Gebärenden.« Das hebräische חִיל kann sowohl krampfartige Schmerzen selbst als auch die dadurch ausgelöste Angst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעָדָה
  choice: das Zittern
  rationale: Das Substantiv bezeichnet Zittern oder Beben und ist Subjekt des Satzes. »Das Zittern« bewahrt das konkrete körperliche Bild.
- source_word: אֲחָזָתַם
  choice: packte sie
  rationale: Das Verb אחז bedeutet »ergreifen, festhalten«. »Packte sie« gibt die plötzlich überwältigende Wirkung natürlich und kraftvoll wieder.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird direkt mit »dort« wiedergegeben und erhält die anschauliche Verortung.
- source_word: חִיל
  choice: Wehen
  rationale: חִיל kann windende Schmerzen, Geburtswehen oder Angst bezeichnen. Im Vergleich mit einer Gebärenden lässt »Wehen« die körperliche Heftigkeit klar hervortreten, ohne die Mehrdeutigkeit unnötig zu verengen.
- source_word: כַּיּוֹלֵדָה
  choice: wie die einer Gebärenden
  rationale: Die Vergleichsphrase bezeichnet eine Frau beim Gebären. Die Formulierung ist knapp, würdevoll und bewahrt das Geburtsbild.
