lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Entfaltung der vorherigen Aussage ein.
- source_word: הִנֵּה
  choice: sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und unmittelbar wieder.
- source_word: הַמְּלָכִים נוֹעֲדוּ
  choice: Die Könige versammelten sich
  rationale: נוֹעֲדוּ bezeichnet hier das Zusammenkommen beziehungsweise Sich-Versammeln der Könige.
- source_word: עָבְרוּ יַחְדָּו
  choice: sie zogen gemeinsam heran
  rationale: עָבַר bedeutet grundsätzlich „vorüberziehen/ziehen“; im Kontext des gegen Zion anrückenden Königsbundes gibt „heranziehen“ die Bewegung natürlich wieder, ohne ihr Ergebnis vorwegzunehmen.
theological_decisions:
- issue: Richtung und Ziel der Bewegung in עָבְרוּ
  choice: sie zogen gemeinsam heran
  alternative: sie zogen gemeinsam vorüber
  rationale: Der unmittelbare Kontext schildert feindliche Könige, die sich sammeln und Zion erblicken. „Heran“ macht diesen Zusammenhang verständlich; eine Fußnote bewahrt die wörtlich mögliche, richtungsneutralere Wiedergabe.
translation_notes:
  register: Knapp, poetisch und würdevoll. Der präsentische Aufmerksamkeitsruf „sieh“ bewahrt die Anschaulichkeit des Hebräischen; die beiden kurzen Hauptsätze folgen seiner kompakten Parallelstruktur.
