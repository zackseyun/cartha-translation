  text: 'Denn siehe: Die Könige versammelten sich; gemeinsam zogen sie vorüber.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann je nach Zusammenhang „vorüberziehen“, „weiterziehen“ oder „hindurchziehen“ bedeuten.
