  text: הֵ֣מָּה רָ֭אוּ כֵּ֣ן תָּמָ֑הוּ נִבְהֲל֥וּ נֶחְפָּֽזוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/005.yaml
  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
translation:
  language: de
  text: Sie sahen es; da staunten sie, erschraken und flohen hastig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie eilten hastig davon«. Das hebräische Verb bezeichnet hastige Bewegung unter starkem Druck; im Zusammenhang kann es eine panische Flucht ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Personalpronomen der 3. Person maskulin Plural ist im Hebräischen hervorgehoben; im Deutschen genügt hier das natürliche »sie«, da der Zusammenhang die Gruppe klar bezeichnet.
- source_word: רָאוּ
  choice: sahen es
  rationale: Das Qal Perfekt von ראה bedeutet schlicht »sehen«. Das ergänzte »es« macht im Deutschen natürlich deutlich, dass sie den zuvor beschriebenen Anblick wahrnahmen, ohne den Gegenstand näher festzulegen.
- source_word: כֵּן
  choice: und
  rationale: כֵּן verbindet hier den Anblick mit der unmittelbar folgenden Reaktion. Die koordinierende Wiedergabe bewahrt den knappen, raschen Ablauf; die Folgewirkung ergibt sich aus der Satzfolge.
- source_word: תָּמָהוּ
  choice: waren wie erstarrt
  rationale: Das Qal Perfekt von תמה bezeichnet staunendes oder bestürztes Verharren. »Waren wie erstarrt« gibt in diesem bedrohlichen Zusammenhang die fassungslose Reaktion wieder, ohne sie mit dem folgenden Erschrecken gleichzusetzen.
- source_word: נִבְהֲלוּ
  choice: erschraken
  rationale: Das Nifal Perfekt von בהל bezeichnet heftiges Erschrecken, Bestürzung oder Entsetzen. »Erschraken« ist intensiv genug für die Steigerung und bleibt zugleich idiomatisch.
- source_word: נֶחְפָּזוּ
  choice: flohen in aller Eile
  rationale: Das Nifal Perfekt von חפז bezeichnet hastiges, unter Druck erfolgendes Fortbewegen. Der Kontext legt Flucht nahe; »in aller Eile« bewahrt ausdrücklich den Kern der panischen Hast.
theological_decisions: []
translation_notes:
  register: Kurzer, würdevoller und dynamischer Parallelstil. Die rasche Abfolge der Reaktionen wird durch zwei koordinierte Satzglieder bewahrt; moderne, allgemein verständliche Standardsprache ohne konfessionelle Zusätze.
