  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Mein Gott“ wahrt das Suffix. „Musizieren“ ist als gehobene, aber moderne Wiedergabe von זמר vertretbar und bewahrt die Unterscheidung zu „singen“.
