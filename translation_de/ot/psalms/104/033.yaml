base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/033.yaml
  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: de
  text: Für Jahwe will ich singen, solange ich lebe; für meinen Gott will ich musizieren, solange ich noch lebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „solange ich noch bin“ oder „solange ich noch existiere“. Die hebräische Wendung bezeichnet das Fortbestehen des Sprechers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה
  choice: Ich will singen
  rationale: Der Kohortativ der 1. Person Singular drückt hier den entschlossenen Vorsatz des Beters aus; „ich will singen“ bewahrt diesen volitiven Ton.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet den Empfänger des Gesangs; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בְּחַיָּי
  choice: solange ich lebe
  rationale: Wörtlich „in meinem Leben“; im Zusammenhang bezeichnet die Wendung idiomatisch die gesamte Lebensdauer.
- source_word: אֲזַמְּרָה
  choice: ich will musizieren
  rationale: Das Piel von זמר bezeichnet musikalisches Preisen, gegebenenfalls durch Gesang. „Musizieren“ hält den musikalischen Aspekt fest und unterscheidet das Verb vom vorhergehenden „singen“.
- source_word: לֵאלֹהַי
  choice: meinem Gott
  rationale: 'Die Präposition ל kennzeichnet den Empfänger, das Suffix der 1. Person Singular die persönliche Beziehung: „meinem Gott“.'
- source_word: בְּעוֹדִי
  choice: solange ich da bin
  rationale: עוֹד mit Suffix bezeichnet das Fortbestehen beziehungsweise die noch andauernde Existenz. Die natürliche deutsche Wendung wahrt eine leichte Variation gegenüber „solange ich lebe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Aufbau und die zwei unterschiedlichen hebräischen Verben für Singen beziehungsweise Musizieren bleiben erkennbar; „solange ich da bin“ ist bewusst alltagssprachlich verständlich, ohne den Gedanken des Fortbestehens zu verengen.
