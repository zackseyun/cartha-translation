  text: The young lions roar for prey, seeking their food from God.
translation:
  language: de
  text: Die jungen Löwen brüllen nach Beute und suchen ihre Nahrung von Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכְּפִירִים
  choice: die jungen Löwen
  rationale: כְּפִיר bezeichnet hier junge Löwen; die bestimmte Form wird mit dem bestimmten Artikel wiedergegeben.
- source_word: שֹׁאֲגִים לַטָּרֶף
  choice: brüllen nach Beute
  rationale: Die natürliche deutsche Verbindung gibt das Brüllen mit dem Ziel beziehungsweise Verlangen nach Beute knapp und anschaulich wieder.
- source_word: וּלְבַקֵּשׁ מֵאֵל אָכְלָם
  choice: und suchen ihre Nahrung bei Gott
  rationale: Die koordinierende Infinitivkonstruktion wird als fortgesetzte Tätigkeit wiedergegeben. „Bei Gott suchen“ bewahrt die Aussage, dass Gott die Quelle ihrer Nahrung ist, ohne die Formulierung unnötig kausal auszudeuten.
theological_decisions:
- issue: Gottes Fürsorge für Raubtiere
  choice: bei Gott
  alternative: von Gott erbitten
  rationale: מֵאֵל bezeichnet Gott als denjenigen, bei beziehungsweise von dem die Tiere Nahrung suchen. „Erbitten“ würde den tierischen Ruf stärker als bewusstes Gebet deuten, als der hebräische Wortlaut verlangt.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Parallelstruktur der beiden Tätigkeiten bleibt erhalten; „Nahrung“ klingt im Kontext natürlicher als das wörtlichere „Futter“.
