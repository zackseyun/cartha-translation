id: PSA.104.9
reference: Psalms 104:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: de
  text: Du hast eine Grenze[a] gesetzt, die sie nicht überschreiten[b]; sie kehren nicht zurück, um die Erde zu bedecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Begrenzung“ oder „Grenzlinie“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „sie“ sind die zuvor genannten Wasser gemeint.
    reason: referent_clarification
lexical_decisions:
- source_word: גְּבוּל
  choice: Grenze
  rationale: Das Substantiv bezeichnet eine festgesetzte Grenze oder Begrenzung. „Grenze“ ist im Deutschen natürlich und passt zu Gottes Eindämmung der Wasser.
- source_word: שַׂמְתָּ
  choice: du hast … gesetzt
  rationale: שׂוּם bedeutet hier „setzen, festlegen“. Die Verbindung „eine Grenze setzen“ ist präzise und idiomatisch.
- source_word: בַּל
  choice: nicht
  rationale: Die Negationspartikel verneint die folgenden Imperfektformen. Das schlichte „nicht“ bewahrt die Aussageform des Hebräischen, ohne sie ausdrücklich als Verbot oder bloße Möglichkeit festzulegen.
- source_word: יַעֲבֹרוּן
  choice: sie überschreiten
  rationale: עבר bedeutet „hinübergehen, überschreiten“. Bei einer Grenze ist „überschreiten“ die treffendste deutsche Entsprechung.
- source_word: יְשׁוּבוּן
  choice: sie kehren nicht zurück
  rationale: שׁוב bedeutet „zurückkehren“. Die Formulierung gibt die erneute Rückkehr der zuvor beschriebenen Wasser knapp wieder.
- source_word: לְכַסּוֹת
  choice: um … zu bedecken
  rationale: כסה bedeutet „bedecken“. Die finale Infinitivkonstruktion wird natürlich mit „um … zu“ wiedergegeben; „bedecken“ erhält das Bild des hebräischen Textes.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im kosmischen Zusammenhang des Schöpfungspsalms ist „Erde“ angemessener als das örtlichere „Land“.
theological_decisions:
- issue: Bezugswort der Pluralformen
  choice: Das Pronomen „sie“ bleibt im Vers stehen und bezieht sich aus dem Zusammenhang auf die Wasser.
  alternative: Die Wasser ausdrücklich im Haupttext nennen oder die Formen allgemeiner auf chaotische Wassermassen beziehen.
  rationale: Der unmittelbare Kontext handelt von den Wassern, doch der hebräische Vers nennt sie nicht erneut. Das Pronomen bewahrt sowohl den Textanschluss als auch dessen knappe Ausdrucksweise.
- issue: Aussageweise der verneinten Imperfektformen
  choice: „nicht überschreiten“ und „nicht zurückkehren“ als feste, von Gott gesetzte Begrenzung.
  alternative: Mit „dürfen nicht“ ausdrücklich als Verbot oder mit „werden nicht“ ausdrücklich als Zukunftsaussage wiedergeben.
  rationale: בַּל mit Imperfekt bezeichnet hier die wirksame Begrenzung der Wasser. Die einfache deutsche Verneinung lässt die Spannung zwischen göttlicher Anordnung und bleibendem Ergebnis bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, bleibt aber nahe an der knappen hebräischen Aussage. Das semantisch offene „nicht“ vermeidet eine unnötige Festlegung auf Verbot oder Zukunftsprognose.
