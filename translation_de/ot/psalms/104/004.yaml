  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: de
  text: Er macht seine Boten zu Winden[a], seine Diener zu loderndem Feuer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Engel zu Geistern«. Das hebräische Wort kann »Winde« oder »Geister« bedeuten. Hebräer 1,7 folgt dieser traditionellen Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch syntaktisch möglich: »Er macht Winde zu seinen Boten und loderndes Feuer zu seinen Dienern.«'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׂה
  choice: Er macht
  rationale: Das Partizip beschreibt im Zusammenhang Gottes charakteristisches Handeln; die finite Form ist im modernen Deutsch natürlich und bewahrt die verbale Aussage.
- source_word: מַלְאָכָיו
  choice: seine Boten
  rationale: מַלְאָך kann »Bote« oder »Engel« bedeuten. »Boten« wahrt die lexikalische Offenheit, ohne vorschnell himmlische Wesen festzulegen.
- source_word: רוּחוֹת
  choice: zu Winden
  rationale: רוּחַ kann »Wind«, »Atem« oder »Geist« bedeuten. Im Schöpfungshymnus und parallel zum Feuer liegt »Winde« nahe; die Alternative wird in der Fußnote bewahrt.
- source_word: מְשָׁרְתָיו
  choice: seine Diener
  rationale: Das Wort bezeichnet Personen oder Mächte, die Dienst verrichten. »Diener« ist im heutigen Deutsch verständlich und gibt den Dienstgedanken treffend wieder.
- source_word: אֵשׁ לֹהֵט
  choice: zu loderndem Feuer
  rationale: Die Verbindung bezeichnet brennendes, flammendes Feuer. »Loderndes Feuer« ist anschaulich, würdig und idiomatisch.
theological_decisions:
- issue: Ob der Vers von Engeln und Geistern oder von Boten und Winden als Gottes Werkzeugen spricht
  choice: Er macht seine Boten zu Winden, seine Diener zu loderndem Feuer.
  alternative: 'Er macht seine Engel zu Geistern, seine Diener zu einer Feuerflamme; syntaktisch auch: Er macht Winde zu seinen Boten und Feuerflammen zu seinen Dienern.'
  rationale: Wortbedeutung und Syntax lassen mehrere Deutungen zu. Der Haupttext folgt der im Schöpfungspsalm naheliegenden Zuordnung, wahrt aber die traditionelle, in Hebräer 1,7 aufgegriffene Wiedergabe sowie die umgekehrte syntaktische Zuordnung in den Fußnoten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. »Boten« und »Diener« sind allgemein verständlich; die echten lexikalischen und syntaktischen Mehrdeutigkeiten werden nicht im Haupttext geglättet, sondern durch markierte Fußnoten offengehalten.
