source:
  edition: WLC
  text: תְּשַׁלַּ֣ח ר֭וּחֲ/ךָ יִבָּרֵא֑וּ/ן וּ֝/תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: de
  text: Wenn du deinen Geist[a] aussendest, werden sie geschaffen[b], und du erneuerst das Antlitz des Erdbodens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Atem“ oder „deinen Wind“; das hebräische Wort רוּחַ kann alle drei Bedeutungen haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Du sendest deinen Geist aus; sie werden geschaffen.“'
    reason: syntactic_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: aussendest
  rationale: Das Piel von שׁלח bedeutet hier „senden“ beziehungsweise „aussenden“. „Aussenden“ gibt die von Gott ausgehende, zielgerichtete Handlung natürlich und präzise wieder.
- source_word: רוּחֲךָ
  choice: deinen Geist
  rationale: רוּחַ kann „Geist“, „Atem“ oder „Wind“ bedeuten. Im Zusammenhang von Schöpfung und Belebung ist „Geist“ gut begründet und bewahrt die theologische Tragweite; die anderen möglichen Sinne werden in einer Fußnote genannt.
- source_word: יִבָּרֵאוּן
  choice: werden sie geschaffen
  rationale: Das Nifal von ברא bezeichnet hier das Geschaffenwerden. Die Wiedergabe vermeidet den Zusatz „neu“, weil der Gedanke der Erneuerung erst im folgenden Verbum ausdrücklich erscheint.
- source_word: וּתְחַדֵּשׁ
  choice: und du erneuerst
  rationale: Das Piel von חדשׁ bedeutet „erneuern“ oder „neu machen“. „Erneuern“ wahrt den Gedanken der Wiederherstellung beziehungsweise Belebung, ohne einen völligen Ersatz auszudrücken.
- source_word: פְּנֵי
  choice: das Antlitz
  rationale: פָּנִים bedeutet wörtlich „Gesicht“ oder „Antlitz“ und bezeichnet in dieser Verbindung die sichtbare Oberfläche. „Antlitz“ erhält die poetische Bildsprache des Psalms.
- source_word: אֲדָמָה
  choice: des Erdbodens
  rationale: אֲדָמָה bezeichnet hier Erde, Boden oder Erdreich. „Erdboden“ grenzt den Ausdruck vom umfassenderen kosmischen Begriff אֶרֶץ ab und passt zur Erneuerung der belebten Erdoberfläche.
theological_decisions:
- issue: Wiedergabe von רוּחַ im Schöpfungszusammenhang
  choice: deinen Geist
  alternative: deinen Atem; deinen Wind
  rationale: „Geist“ bringt Gottes lebenspendendes Wirken zur Geltung, ohne außerhalb des Bedeutungsbereichs des hebräischen Wortes zu liegen. Da רוּחַ zugleich Atem und Wind bezeichnen kann und diese Bildfelder hier mitschwingen können, werden die Alternativen ausdrücklich offengehalten.
- issue: Verhältnis zwischen Aussenden und Geschaffenwerden
  choice: temporaler Bedingungssatz mit „Wenn“
  alternative: 'Parataktisch: „Du sendest deinen Geist aus; sie werden geschaffen“'
  rationale: Die Unterordnung macht den engen zeitlichen und sachlichen Zusammenhang in natürlichem Deutsch deutlich. Die hebräische Abfolge kann jedoch auch parataktisch wiedergegeben werden; diese Möglichkeit bleibt in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Antlitz des Erdbodens“ ist bewusst gehobener als Alltagssprache, bleibt jedoch verständlich und bildet die hebräische Wendung eng ab.
