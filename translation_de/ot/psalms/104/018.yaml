lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: die hohen Berge
  rationale: Die Verbindung bezeichnet hoch gelegene Berge; die schlichte Wiedergabe bewahrt das klare Naturbild und die parallele Struktur.
- source_word: לַיְּעֵלִים
  choice: gehören den Steinböcken
  rationale: יָעֵל bezeichnet den in felsigem Bergland lebenden Wild- bzw. Steinbock. „Steinböcke“ ist im Deutschen natürlich, verständlich und zoologisch hinreichend genau. Das ל wird idiomatisch als Zuordnung des Lebensraums wiedergegeben.
- source_word: סְלָעִים
  choice: die Felsen
  rationale: סֶלַע bezeichnet Felsen oder felsige Formationen. „Felsen“ ist breit genug und bildet einen natürlichen Parallelismus zu den Bergen.
- source_word: מַחְסֶה
  choice: Zuflucht
  rationale: Das Substantiv bezeichnet einen schützenden Ort. „Zuflucht“ erhält sowohl den konkreten Schutzgedanken als auch den würdigen poetischen Ton.
- source_word: לַשְׁפַנִּים
  choice: den Klippdachsen
  rationale: שָׁפָן bezeichnet hier den felsbewohnenden Schliefer. „Klippdachse“ ist eine geläufige deutsche Tierbezeichnung; die fachsprachlich genauere Alternative wird in der Fußnote genannt.
