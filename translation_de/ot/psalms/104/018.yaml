translation_notes:
  register: Moderne, würdige Psalmsprache mit klar erkennbarem Parallelismus. „Gehören“ und „bieten … Zuflucht“ geben die beiden hebräischen ל-Konstruktionen idiomatisch wieder, ohne über den Lebensraumbezug hinauszugehen.
