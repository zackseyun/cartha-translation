  text: הַ֥/מְקָרֶֽה בַ/מַּ֗יִם עֲֽלִיּ֫וֹתָ֥י/ו הַ/שָּׂם עָבִ֥ים רְכוּב֑/וֹ הַֽ֝/מְהַלֵּ֗ךְ עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/003.yaml
  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: de
  text: der die Balken seiner oberen Gemächer auf den Wassern legt, der die Wolken zu seinem Wagen macht, der auf den Flügeln des Windes[a] einhergeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den Flügeln des Geistes«, wenn רוּחַ hier als »Geist« verstanden wird; wegen der Wolken- und Wetterbilder im Zusammenhang ist »Wind« wahrscheinlicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: der die Balken … legt
  rationale: Das Partizip von קרה bezeichnet hier das Einziehen beziehungsweise Legen von Balken. Die konkrete Bau-Metapher bleibt so erhalten.
- source_word: בַמַּיִם
  choice: auf die Wasser
  rationale: Die Präposition ב wird im Zusammenhang des Bauens räumlich als »auf« wiedergegeben; der Plural »Wasser« bewahrt das kosmische Bild.
- source_word: עֲלִיּוֹתָיו
  choice: seine oberen Gemächer
  rationale: Das Substantiv bezeichnet hoch gelegene Räume oder Obergemächer. »Obere Gemächer« ist verständlich, würdevoll und weniger altertümlich als »Obergemächer«.
- source_word: הַשָּׂם
  choice: der … zu … macht
  rationale: שׂים bedeutet setzen oder stellen; in dieser prädikativen Konstruktion ist »zu seinem Wagen macht« im Deutschen natürlich.
- source_word: עָבִים
  choice: die Wolken
  rationale: Das Wort bezeichnet Wolken, möglicherweise dichte Wolkenmassen. Die schlichte Wiedergabe vermeidet eine im Kontext nicht notwendige Präzisierung.
- source_word: רְכוּבוֹ
  choice: seinen Wagen
  rationale: Gemeint ist das Gefährt, auf dem Gott fährt. »Wagen« erhält das theophanische Bild knapp und klar.
- source_word: הַמְהַלֵּךְ
  choice: der … einhergeht
  rationale: Das Partizip von הלך bezeichnet Gehen oder Sichbewegen. »Einhergeht« erhält das anschauliche poetische Bild und einen würdevollen Ton.
- source_word: כַּנְפֵי
  choice: die Flügel
  rationale: כנף kann auch Rand oder äußerstes Ende bedeuten; zusammen mit Wind ist »Flügel« jedoch das naheliegende und lebendige poetische Bild.
- source_word: רוּחַ
  choice: Wind
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Das unmittelbare Umfeld mit Wolken, Wagen und Flügeln spricht hier am stärksten für die meteorologische Bedeutung »Wind«.
theological_decisions:
- issue: Bedeutung von רוּחַ im letzten Versglied
  choice: Wind
  alternative: Geist oder Atem
  rationale: Die Mehrdeutigkeit des hebräischen Wortes wird nicht geleugnet, doch die meteorologische Bildfolge legt »Wind« nahe. Die mögliche Bedeutung »Geist« wird in der Fußnote offengehalten, ohne dem Vers eine nicht ausdrücklich geforderte dogmatische Aussage aufzuerlegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Bau-, Wagen- und Flügelmetaphorik. Der Fußnotenmarker steht bei »Wind«, da sich die Lesart auf רוּחַ bezieht.
