source:
  edition: WLC
  text: תִּתֵּ֣ן לָ֭/הֶם יִלְקֹט֑וּ/ן תִּפְתַּ֥ח יָֽ֝דְ/ךָ֗ יִשְׂבְּע֥וּ/ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: de
  text: Du gibst ihnen, und sie sammeln es; du öffnest deine Hand, und sie werden satt an Gutem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie werden mit Gutem gesättigt.“'
    reason: Lexikalische und syntaktische Alternative für יִשְׂבְּעוּן טוֹב; die hebräische Wendung kann das Sattwerden mit dem Guten ebenso als Zustand beziehungsweise Ergebnis ausdrücken.
lexical_decisions:
- source_word: תִּתֵּן
  choice: du gibst
  rationale: Das Qal-Imperfekt 2. Person maskulin Singular von נתן ist an Gott gerichtet. „Du gibst“ gibt die schlichte verbale Aussage unmittelbar wieder.
- source_word: לָהֶם
  choice: ihnen
  rationale: Die Präposition ל mit dem Suffix der 3. Person maskulin Plural bezeichnet hier am natürlichsten den indirekten Empfänger.
- source_word: יִלְקֹטוּן
  choice: sie sammeln es
  rationale: לקט bedeutet „sammeln/auflesen“. Das Pronomen „es“ nimmt sinngemäß das von Gott Gegebene auf, ohne die Aussage näher festzulegen.
- source_word: תִּפְתַּח
  choice: du öffnest
  rationale: Das Qal-Imperfekt von פתח wird schlicht mit „öffnen“ wiedergegeben; eine Verstärkung wie „weit“ steht nicht ausdrücklich im Hebräischen.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Das konkrete anthropomorphe Bild für Gottes Versorgung bleibt erhalten und wird nicht abstrahierend umschrieben.
- source_word: יִשְׂבְּעוּן
  choice: sie werden … gesättigt
  rationale: שבע bezeichnet das Sattwerden beziehungsweise Gesättigtsein. „Gesättigt“ passt zur Versorgung mit Nahrung im Kontext und bewahrt die passive Ergebnisvorstellung.
- source_word: טוֹב
  choice: mit Gutem
  rationale: טוב wird hier substantivisch gebraucht. „Mit Gutem“ bewahrt die knappe, umfassende Formulierung und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Versorgung
  choice: „du öffnest deine Hand“ wörtlich beibehalten
  alternative: „du versorgst sie reichlich“
  rationale: Das hebräische Bild stellt Gottes erhaltende Fürsorge anschaulich dar. Seine Beibehaltung bewahrt die poetische Theologie des Verses, ohne sie in eine abstrakte Aussage aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das Bild der geöffneten Hand bleiben erhalten; „mit Gutem gesättigt“ wahrt bewusst die kompakte, leicht ungewohnte Ausdrucksweise des Hebräischen.
