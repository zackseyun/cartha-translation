  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: de
  text: Er lässt Gras für das Vieh wachsen und Pflanzen zur Bearbeitung durch den Menschen, damit der Mensch Brot aus der Erde gewinnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und Pflanzen zur Arbeit des Menschen, um Brot aus der Erde hervorzubringen“. Die hebräische Wendung kann die menschliche Arbeit allgemein oder besonders die Bearbeitung bzw. den Anbau der Pflanzen bezeichnen.'
    reason: lexikalische und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: Er lässt … wachsen
  rationale: Das Hifil-Partizip von צמח bezeichnet verursachtes Wachstum. Die deutsche Formulierung bewahrt diese kausative Bedeutung und nimmt das in der Umgebung genannte göttliche Subjekt auf.
- source_word: חָצִיר
  choice: Gras
  rationale: Im Zusammenhang ist Futtervegetation für Weidetiere gemeint; „Gras“ ist präzise und allgemein verständlich.
- source_word: לַבְּהֵמָה
  choice: für das Vieh
  rationale: בְּהֵמָה bezeichnet hier kollektiv größere beziehungsweise domestizierte Tiere. „Vieh“ passt zum Bild der Versorgung durch Gras, ohne nur Rinder zu meinen.
- source_word: וְעֵשֶׂב
  choice: und Pflanzen
  rationale: עֵשֶׂב umfasst nutzbare Vegetation und ist weiter als das deutsche „Kräuter“. „Pflanzen“ gibt den Sinn natürlich und hinreichend breit wieder.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: für die Arbeit des Menschen
  rationale: Die knappe hebräische Wendung verbindet die Pflanzen mit menschlicher Arbeit, Nutzung oder Bearbeitung, ohne das Verhältnis eindeutig festzulegen. Die relativ formale Wiedergabe erhält diese Offenheit.
- source_word: הָאָדָם
  choice: des Menschen
  rationale: אָדָם ist hier generisch und bezeichnet den Menschen beziehungsweise die Menschheit. Das deutsche „des Menschen“ ist zugleich quellennah und in diesem Zusammenhang geschlechtsübergreifend verständlich.
- source_word: לְהוֹצִיא
  choice: um … hervorzubringen
  rationale: Der Infinitiv kann Zweck oder Ergebnis ausdrücken. „Um … hervorzubringen“ bewahrt die Zielrichtung und lässt das im Hebräischen nicht ausdrücklich genannte Subjekt offen.
- source_word: לֶחֶם
  choice: Brot
  rationale: „Brot“ ist die konkrete Grundbedeutung und fügt sich in das landwirtschaftliche Bild; die allgemeinere Bedeutung „Nahrung“ muss hier nicht eingesetzt werden.
- source_word: מִן הָאָרֶץ
  choice: aus der Erde
  rationale: Die Erde beziehungsweise der Erdboden erscheint als Herkunft des Ertrags. „Aus der Erde“ ist poetisch, natürlich und quellennah.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: des Menschen
  alternative: für die Menschen / der Menschheit
  rationale: Der hebräische Singular ist repräsentativ und bezeichnet nicht ausschließlich einen Mann. „Des Menschen“ erhält die singularische, quellennähere Ausdrucksweise, ohne den Sinn auf männliche Personen zu beschränken.
- issue: Bezug und Sinn von לַעֲבֹדַת הָאָדָם
  choice: für die Arbeit des Menschen
  alternative: zum Nutzen des Menschen / damit der Mensch sie anbaut
  rationale: עֲבֹדָה kann Arbeit, Dienst oder Bearbeitung bezeichnen. Die Hauptfassung vermeidet es, die Wendung ausschließlich als Nutzen oder ausschließlich als landwirtschaftlichen Anbau festzulegen.
- issue: Unausgesprochenes Subjekt von לְהוֹצִיא
  choice: um Brot aus der Erde hervorzubringen
  alternative: damit der Mensch Brot aus der Erde hervorbringt / sodass Gott Brot aus der Erde hervorbringt
  rationale: Die hebräische Infinitivkonstruktion nennt an dieser Stelle kein eigenes Subjekt. Die deutsche Infinitivkonstruktion bewahrt diese syntaktische und theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Klang. Die Wortstellung hebt parallel „Gras für das Vieh“ und „Pflanzen für die Arbeit des Menschen“ hervor; unnötig altertümliche Wörter werden vermieden.
