  text: כֻּ֭לָּ/ם אֵלֶ֣י/ךָ יְשַׂבֵּר֑וּ/ן לָ/תֵ֖ת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/027.yaml
  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: de
  text: Sie alle warten erwartungsvoll auf dich[a] und darauf, dass du ihnen ihre Nahrung zur rechten Zeit[b] gibst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „blicken erwartungsvoll auf dich“ oder „hoffen auf dich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zu seiner Zeit“; auch: „zur bestimmten Zeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Sie alle
  rationale: Die Form bezeichnet die Gesamtheit der zuvor genannten Geschöpfe und bewahrt zugleich den rückbezüglichen, distributiven Sinn.
- source_word: אֵלֶיךָ
  choice: auf dich
  rationale: Bei שׂבר bezeichnet die Präposition die Ausrichtung erwartungsvollen Wartens auf den, von dem Hilfe oder Versorgung erwartet wird; im Deutschen ist „auf dich warten“ idiomatisch.
- source_word: יְשַׂבֵּרוּן
  choice: warten
  rationale: Der Piel von שׂבר bezeichnet hier erwartungsvolles Warten oder Hoffen. „Warten“ ist natürlich und lässt die mögliche Nuance des hoffnungsvollen Ausschauhaltens durch eine Fußnote erkennen.
- source_word: לָתֵת
  choice: dass du … gibst
  rationale: Der Infinitiv bezeichnet den Inhalt beziehungsweise das Ziel ihres Wartens. Ein deutscher dass-Satz gibt die Konstruktion klar und natürlich wieder.
- source_word: אָכְלָם
  choice: ihre Nahrung
  rationale: Das Substantiv bezeichnet allgemein Nahrung oder Speise. „Nahrung“ passt zu der Vielfalt der im Kontext genannten Geschöpfe und beschränkt den Sinn nicht auf Beutetiere.
- source_word: בְּעִתּוֹ
  choice: zur rechten Zeit
  rationale: Die Wendung meint den passenden beziehungsweise bestimmten Zeitpunkt. „Zur rechten Zeit“ ist im Deutschen natürlich und bewahrt den Gedanken angemessener Versorgung, ohne ihn näher auszudeuten.
theological_decisions:
- issue: Göttliche Fürsorge für die Schöpfung
  choice: Der Vers beschreibt, dass alle Geschöpfe hinsichtlich ihrer Nahrung von Gott abhängig sind.
  alternative: Eine stärker deutende Wiedergabe, die ausdrücklich Vertrauen, Anbetung oder eine systematische Lehre von der Vorsehung nennt.
  rationale: Der hebräische Text stellt die erwartungsvolle Abhängigkeit der Geschöpfe von Gottes Versorgung dar, formuliert jedoch keine weitergehende dogmatische Erklärung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem poetischem Register. Der Satzbau bleibt nah am Hebräischen, wird aber durch einen natürlichen dass-Satz geglättet. Die Fußnoten bewahren die Bedeutungsbreite von שׂבר und die knappe Zeitangabe בְּעִתּוֹ.
