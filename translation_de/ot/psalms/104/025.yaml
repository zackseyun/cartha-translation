source:
  edition: WLC
  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: de
  text: Da ist das Meer, groß und weithin ausgedehnt[a]. Darin wimmelt es ohne Zahl von Lebewesen, kleinen wie großen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „breit an Händen“; eine hebräische Wendung für eine große Ausdehnung nach beiden Seiten.'
    reason: cultural_note
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: Da ist das Meer
  rationale: Das deiktische זֶה stellt das Meer anschaulich vor Augen. „Da ist“ gibt diese hinweisende, staunende Funktion im Deutschen natürlicher wieder als das isolierte „Dieses“.
- source_word: גָּדוֹל
  choice: groß
  rationale: „Groß“ bewahrt sowohl die räumliche Bedeutung als auch den feierlichen poetischen Klang.
- source_word: וּרְחַב יָדָיִם
  choice: und weithin ausgedehnt
  rationale: Die wörtliche Wendung „breit an Händen“ bezeichnet eine weite Ausdehnung. Die Übersetzung gibt den idiomatischen Sinn verständlich wieder; die hebräische Bildform wird in einer Fußnote dokumentiert.
- source_word: שָׁם
  choice: darin
  rationale: Das Ortsadverb verweist auf das unmittelbar zuvor genannte Meer. „Darin“ stellt diesen Bezug im Deutschen eindeutig her.
- source_word: רֶמֶשׂ
  choice: wimmelt es
  rationale: Das Kollektivwort bezeichnet sich regende beziehungsweise in Fülle auftretende Geschöpfe. Im Zusammenhang mit dem Meer bringt „wimmelt es“ Bewegung und Vielzahl natürlich zum Ausdruck.
- source_word: וְאֵין מִסְפָּר
  choice: ohne Zahl
  rationale: Die feste Wendung besagt, dass die Geschöpfe nicht zu zählen sind. „Ohne Zahl“ ist quellennah, verständlich und poetisch.
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלוֹת
  choice: Lebewesen, kleinen wie großen
  rationale: „Lebewesen“ wahrt die breite Bedeutung von חַיּוֹת. „Kleinen wie großen“ gibt die einschließende Gegenüberstellung der Größen wieder, ohne sie auf bestimmte Tierarten einzuengen.
