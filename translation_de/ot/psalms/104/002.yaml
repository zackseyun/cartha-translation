source:
  edition: WLC
  text: עֹֽטֶה א֭וֹר כַּ/שַּׂלְמָ֑ה נוֹטֶ֥ה שָׁ֝מַ֗יִם כַּ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/002.yaml
  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: de
  text: 'Du hüllst dich in Licht wie in ein Gewand,

    du spannst den Himmel aus wie eine Zeltbahn.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Stoffbahn“; das hebräische Wort bezeichnet besonders eine Bahn aus Stoff, wie sie bei einem Zelt oder beim Heiligtum verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: Du hüllst dich
  rationale: Das Qal-Partizip zeichnet Gottes Handeln anschaulich und fortdauernd. „Sich hüllen“ gibt die durch „Licht“ nahegelegte reflexive Bedeutung natürlich wieder.
- source_word: אוֹר
  choice: in Licht
  rationale: Das Substantiv bezeichnet hier Licht als das, worin Gott sich bildhaft hüllt; eine Abstraktion wie „Glanz“ ist nicht nötig.
- source_word: כַשַּׂלְמָה
  choice: wie in ein Gewand
  rationale: שַׂלְמָה bezeichnet allgemein ein Kleidungsstück oder Gewand. Die Formulierung bewahrt das Vergleichsbild, ohne eine bestimmte Art von Kleidung festzulegen.
- source_word: נוֹטֶה
  choice: du spannst ... aus
  rationale: Das Qal-Partizip von נטה kann das Ausspannen oder Ausbreiten bezeichnen. „Ausspannen“ passt im Deutschen besonders gut zum folgenden Bild einer Zeltbahn.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Der hebräische Pluralausdruck bezeichnet hier das Himmelsgewölbe. Der deutsche Singular „Himmel“ ist dafür idiomatisch und bewahrt die kosmische Weite.
- source_word: כַיְרִיעָה
  choice: wie eine Zeltbahn
  rationale: יְרִיעָה bezeichnet eine Stoffbahn, besonders bei einem Zelt oder Heiligtum. „Zeltbahn“ macht das konkrete Bild im Deutschen knapp und anschaulich; die allgemeinere Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Anthropomorphe Darstellung Gottes, der sich in Licht hüllt und den Himmel ausspannt
  choice: Die poetischen Bilder werden unmittelbar beibehalten.
  alternative: Deutende Umschreibungen wie „Licht umgibt dich“ oder „du offenbarst deinen herrlichen Glanz“.
  rationale: Der Vers beschreibt Gottes Majestät und Schöpfermacht durch konkrete poetische Bilder. Ihre direkte Wiedergabe wahrt den hebräischen Text und fügt keine lehrmäßige Erklärung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem poetischem Satzbau. Die direkte Anrede und die anschaulichen Schöpfungsbilder bleiben erhalten.
