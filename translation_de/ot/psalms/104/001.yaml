id: PSA.104.1
reference: Psalms 104:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: de
  text: Lobe Jahwe[a], meine Seele! Jahwe, mein Gott, du bist sehr groß; mit Hoheit und Pracht hast du dich bekleidet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; der Gottesname wird auch mit „der HERR“ oder „Jehova“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Lobe
  rationale: Im Deutschen bezeichnet „segnen“ normalerweise eine Zuwendung Gottes an Menschen oder einen Segenswunsch. In der an die eigene Seele gerichteten Aufforderung gibt „Lobe“ die doxologische Bedeutung von ברך natürlich und verständlich wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Bewahrt die direkte Anrede an das eigene Innerste. Anders als im Englischen ist kein zusätzliches Anredepartikel nötig.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: אֶת markiert das direkte Objekt und bleibt unübersetzt; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: יְהוָה אֱלֹהַי
  choice: Jahwe, mein Gott
  rationale: Die Zeichensetzung macht die direkte Anrede deutlich und erhält sowohl den Gottesnamen als auch die persönliche Zuordnung „mein Gott“.
- source_word: גָּדַלְתָּ מְּאֹד
  choice: du bist sehr groß
  rationale: Das Perfekt von גדל hat hier im Lobkontext stative Gegenwartsbedeutung; „sehr“ gibt den Verstärker מְאֹד idiomatisch wieder.
- source_word: הוֹד
  choice: Hoheit
  rationale: Im Parallelismus und im Bild göttlicher Kleidung bezeichnet das Wort erhabene, sichtbare Würde; „Hoheit“ bildet zusammen mit „Pracht“ ein natürliches deutsches Wortpaar.
- source_word: וְהָדָר
  choice: und Pracht
  rationale: Gibt die glanzvolle, majestätische Erscheinung wieder und ergänzt „Hoheit“ ohne die beiden nahezu synonymen Begriffe zusammenzuziehen.
- source_word: לָבָשְׁתָּ
  choice: hast du angezogen
  rationale: Bewahrt das konkrete Kleidungsbild sowie die perfektive Form. Im Deutschen ist das Reflexivpronomen hier nicht erforderlich, da Hoheit und Pracht als angezogene Gewandung erscheinen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ macht den Namen im Haupttext sichtbar; eine Fußnote nennt die hebräische Form und gebräuchliche Alternativen, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Moderne, gehobene und gut verständliche poetische Sprache. Der Selbstanruf „meine Seele“ und das Gewandbild des hebräischen Verses bleiben erhalten; auf ein altertümliches „O“ wird verzichtet.
