  text: מִן גַּעֲרָ֣תְ/ךָ֣ יְנוּס֑וּ/ן מִן ק֥וֹל רַֽ֝עַמְ/ךָ֗ יֵחָפֵזֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: de
  text: Vor deinem Schelten flohen sie[a]; vor dem Schall deines Donners eilten sie davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vor deinem Schelten wichen sie zurück; vor dem Klang deines Donners hasteten sie davon.“'
    reason: Lexikalische Alternativen für נוּס, קוֹל und חפז; die Genitivverbindung „Klang/Schall deines Donners“ entspricht קוֹל רַעַמְךָ.
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: deinem Schelten
  rationale: גְּעָרָה bezeichnet einen machtvollen Verweis oder ein gebietendes Schelten. „Schelten“ ist im Deutschen knapp, würdevoll und bewahrt hier die Wirksamkeit von Gottes Rede gegenüber der Schöpfung.
- source_word: יְנוּסוּן
  choice: flohen sie
  rationale: נוּס bedeutet „fliehen“. Das Präteritum entspricht der erzählenden Rückschau des Psalms und gibt die rasche Bewegung der Wasser prägnant wieder.
- source_word: קוֹל רַעַמְךָ
  choice: dem Donner deiner Stimme
  rationale: קוֹל kann „Stimme“, „Schall“ oder „Laut“ bedeuten, רַעַם „Donner“. Die Wendung lässt sich als „Stimme deines Donners“ oder idiomatischer als „Donner deiner Stimme“ verstehen. Letzteres bewahrt sowohl die akustische Bildsprache als auch den Charakter göttlichen Gebietens.
- source_word: יֵחָפֵזוּן
  choice: eilten sie davon
  rationale: חפז bezeichnet hastige, teils erschrockene Bewegung. „eilten ... davon“ ist modernes, natürliches Deutsch und legt die emotionale Nuance nicht unnötig auf Panik fest.
- source_word: מִן ... מִן
  choice: Vor ... vor
  rationale: מִן bezeichnet hier den auslösenden Grund beziehungsweise das, wovor die Wasser zurückweichen. Das deutsche „vor“ passt natürlich sowohl zu „Schelten“ als auch zu „Donner“ und erhält den parallelen Aufbau.
theological_decisions:
- issue: Bezug der Pluralverben „flohen“ und „eilten davon“
  choice: Das im Hebräischen unausgesprochene Subjekt bleibt als „sie“ stehen und bezieht sich aus dem Zusammenhang auf die Wasser.
  alternative: Das Subjekt ausdrücklich als „die Wasser“ wiedergeben.
  rationale: Der hebräische Vers setzt das Subjekt aus dem vorherigen Kontext voraus. „sie“ bewahrt den poetischen Zusammenhang und fügt kein im Vers selbst fehlendes Substantiv ein.
- issue: Verhältnis von Gottes Stimme und Donner
  choice: „Donner deiner Stimme“ bewahrt die mögliche Verbindung des Donners mit Gottes gebietender Rede.
  alternative: „beim Klang deines Donners“, rein akustisch verstanden.
  rationale: קוֹל kann sowohl „Stimme“ als auch „Schall“ bedeuten. Die gewählte Fassung erhält die theologische und poetische Spannung, ohne Stimme und Naturphänomen voneinander zu trennen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Parallelität. „Schelten“ ist kräftiger als „Zurechtweisung“, ohne altertümlich zu wirken; „eilten davon“ ist natürlicher als „hasteten hinweg“.
