review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die generische Aussage von אָדָם, die Bewegung von יֵצֵא, die beiden ausdrücklich parallelen Arbeitsbegriffe sowie den zeitlichen Endpunkt עֲדֵי עָרֶב im Wesentlichen zutreffend wieder. Die Reihenfolge »Werk« / »Arbeit« ist vertretbar, doch die Zielkonstruktion mit »an« ist nach »geht hinaus« weniger klar als »zu«.
  naturalness: »Der Mensch geht hinaus an sein Werk« wirkt im modernen Standarddeutsch ungewohnt. »An sein Werk gehen« ist zwar als Wendung möglich, bezeichnet aber eher das Beginnen einer Aufgabe und verbindet sich hier sperrig mit »hinausgehen«. »Zu seiner Arbeit und zu seinem Werk« ist idiomatischer und bewahrt die zwei hebräischen Präpositionalgruppen.
  terminology: »Der Mensch« ist für אָדָם als generischen Singular passend. »Arbeit« und »Werk« geben die überlappenden, aber nicht identischen Begriffe פָּעַל und עֲבֹדָה angemessen wieder, ohne den zweiten Ausdruck theologisch oder berufsspezifisch auf »Dienst« einzuengen.
