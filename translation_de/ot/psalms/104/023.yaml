revisions:
- from: Der Mensch geht hinaus an sein Werk und an seine Arbeit bis zum Abend.
  to: Der Mensch geht hinaus zu seiner Arbeit und zu seinem Werk bis zum Abend.
  rationale: Die Präpositionen wurden von »an« zu »zu« geändert, um die Bewegungsrichtung nach »geht hinaus« idiomatisch und eindeutig wiederzugeben. Die doppelte Präpositional- und Possessivfügung bleibt als Entsprechung der beiden hebräischen Nominalgruppen erhalten. Die Reihenfolge »Arbeit« und »Werk« ordnet die allgemeinere Tätigkeit dem ersten Begriff פָּעַל und das Ergebnis bzw. Arbeitswerk dem zweiten Parallelbegriff zu, ohne eine scharfe semantische Trennung zu behaupten.
