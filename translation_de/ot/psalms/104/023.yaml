  text: יֵצֵ֣א אָדָ֣ם לְ/פָעֳל֑/וֹ וְֽ/לַ/עֲבֹ֖דָת֣/וֹ עֲדֵי עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/023.yaml
  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: de
  text: Der Mensch geht hinaus zu seiner Arbeit und zu seinem Werk bis zum Abend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵצֵא
  choice: geht hinaus
  rationale: Das Qal-Imperfekt bezeichnet hier den gewöhnlichen Tagesablauf. »Geht hinaus« gibt sowohl die Bewegung als auch den wiederkehrenden Vorgang natürlich wieder.
- source_word: אָדָם
  choice: der Mensch
  rationale: Der hebräische generische Singular bezeichnet hier den Menschen stellvertretend für die Menschheit und steht im Kontrast zu den zuvor genannten Tieren. »Der Mensch« bewahrt Singular und generische Bedeutung.
- source_word: לְפָעֳלוֹ
  choice: an sein Werk
  rationale: פֹּעַל bezeichnet Werk, Arbeit oder Tätigkeit. Nach »hinausgehen« ist »an sein Werk gehen« im Deutschen idiomatisch und erhält die Ziel- beziehungsweise Zweckrichtung der Präposition לְ.
- source_word: וְלַעֲבֹדָתוֹ
  choice: und an seine Arbeit
  rationale: עֲבֹדָה kann Arbeit, Dienst oder Mühe bezeichnen. »Arbeit« ist hier neutral und kontextgerecht; die erneute Präpositional- und Possessivfügung bildet den hebräischen Parallelismus ab.
- source_word: עֲדֵי עָרֶב
  choice: bis zum Abend
  rationale: Die poetische Präposition עֲדֵי bezeichnet den zeitlichen Endpunkt. »Bis zum Abend« ist klares, natürliches Standarddeutsch.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: der Mensch
  alternative: die Menschen / die Menschheit
  rationale: Der Vers schildert die menschliche Lebensordnung innerhalb der Schöpfung. »Der Mensch« bewahrt die repräsentative Singularform des Hebräischen, ohne die Aussage auf einen bestimmten Mann zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Bau »an sein Werk und an seine Arbeit« wird trotz leichter Bedeutungsüberschneidung bewahrt, weil beide hebräischen Nominalgruppen ausdrücklich gesetzt sind.
