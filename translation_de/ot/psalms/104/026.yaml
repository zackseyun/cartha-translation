  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: de
  text: Dort fahren die Schiffe umher; den Leviatan hast du geformt, damit er darin spielt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Leviatan, den du geformt hast, um mit ihm zu spielen.“ Manche verstehen den letzten Satzteil so, dass Gott mit dem Leviatan spielt, anstatt dass der Leviatan im Meer spielt.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb verweist auf das Meer im vorhergehenden Vers; „Dort“ ist im modernen Deutsch klar und natürlich.
- source_word: אֳנִיּוֹת
  choice: die Schiffe
  rationale: Die bestimmte Form bezeichnet hier natürlich die Schiffe als Klasse, die das zuvor genannte Meer befahren.
- source_word: יְהַלֵּכוּן
  choice: fahren … umher
  rationale: Die imperfektive Form von הלך beschreibt fortgesetzte Bewegung; bei Schiffen ist „umherfahren“ idiomatisch und erhält den iterativen Sinn.
- source_word: לִוְיָתָן
  choice: der Leviatan
  rationale: Die Transliteration bewahrt die poetische und innerbiblische Bedeutung der Bezeichnung für das große Meerwesen.
- source_word: זֶה
  choice: den
  rationale: Das wörtliche Demonstrativ „dieser“ wird im Deutschen am natürlichsten durch einen Relativsatz wiedergegeben, der sich auf Leviatan bezieht.
- source_word: יָצַרְתָּ
  choice: du geformt hast
  rationale: „Formen“ bewahrt die konkrete Bedeutung von יצר besser als das allgemeinere „erschaffen“.
- source_word: לְשַׂחֶק
  choice: damit er … spielt
  rationale: Die Zweckkonstruktion gibt den Infinitiv mit לְ natürlich wieder; „spielen“ bewahrt das lebendige poetische Bild.
- source_word: בּוֹ
  choice: darin
  rationale: Das maskuline Singularsuffix bezieht sich im unmittelbaren Zusammenhang am ehesten auf das Meer; „darin“ stellt diesen Ortsbezug knapp dar.
theological_decisions:
- issue: Bezugswort und Sinn von בּוֹ nach לְשַׂחֶק
  choice: Leviatan wurde geformt, damit er im Meer spielt.
  alternative: Leviatan wurde geformt, damit Gott mit ihm spielt.
  rationale: 'Der unmittelbare Zusammenhang nennt das Meer als Ort: Dort fahren die Schiffe, und darin spielt Leviatan. Da die hebräische Form jedoch auch als „um mit ihm zu spielen“ verstanden werden kann, bleibt diese traditionsreiche alternative Deutung in der Fußnote erhalten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leviatan“ bewahrt die poetische Eigenbezeichnung; „umherfahren“ und „spielen“ sind allgemein verständlich. Die echte syntaktische Mehrdeutigkeit des Schlusses wird in einer Fußnote erhalten.
