source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: de
  text: Verbirgst du dein Angesicht[a], erschrecken sie; nimmst du ihnen den Atem[b], sterben sie und kehren zu ihrem Staub zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Gegenwart«. Das hebräische »dein Angesicht« kann die persönliche Gegenwart oder Zuwendung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihren Geist«. Das hebräische Wort רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten; hier legt der Zusammenhang von Sterben und Rückkehr zum Staub »Atem« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: verbergen
  rationale: Das Hifil von סתר bedeutet »verbergen« oder »verhüllen«. Die Formulierung bewahrt das Bild vom Entzug des göttlichen Angesichts.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: Wörtlich »dein Angesicht«. Das gehobene, aber geläufige Wort bewahrt die konkrete poetische Redeweise und kann zugleich Gottes Gegenwart oder Zuwendung bezeichnen.
- source_word: יִבָּהֵלוּן
  choice: erschrecken
  rationale: Das Nifal von בהל bezeichnet Bestürzung, Beunruhigung oder Schrecken. »Erschrecken« gibt die starke Reaktion natürlich und würdig wieder.
- source_word: תֹּסֵף
  choice: nimmst du ihnen
  rationale: אסף kann »sammeln«, »einziehen« oder »wegnehmen« bedeuten. Mit רוּחָם bezeichnet es hier den Entzug des lebenspendenden Atems; die deutsche Konstruktion macht den Bezug auf die Geschöpfe klar.
- source_word: רוּחָם
  choice: den Atem
  rationale: רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten. Im Zusammenhang mit Sterben und Rückkehr zum Staub liegt »Atem« nahe, ohne die lexikalische Mehrdeutigkeit zu leugnen.
- source_word: יִגְוָעוּן
  choice: sterben
  rationale: גוע bedeutet »verscheiden«, »verenden« oder »sterben«. »Sterben« ist im modernen Standarddeutsch klar und dem würdigen Register angemessen.
- source_word: עֲפָרָם
  choice: ihrem Staub
  rationale: Der hebräische Text enthält ausdrücklich das Possessivsuffix »ihr«. Die ungewöhnliche, aber verständliche Wendung bewahrt die Anspielung auf die Herkunft und Vergänglichkeit der Geschöpfe.
- source_word: יְשׁוּבוּן
  choice: kehren ... zurück
  rationale: שוב bedeutet »zurückkehren«. Die deutsche Verbklammer gibt die Bewegung zurück zum Staub idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von רוּחָם im Zusammenhang von Schöpfung und Tod
  choice: den Atem
  alternative: ihren Geist
  rationale: Der unmittelbare Zusammenhang beschreibt den Verlust der Lebenskraft, das Sterben und die Rückkehr zum Staub. »Atem« bildet dies am natürlichsten ab; eine Fußnote hält die echte Bedeutungsalternative »Geist« offen.
- issue: Anthropomorphe Rede von Gottes Angesicht
  choice: dein Angesicht
  alternative: deine Gegenwart
  rationale: Das konkrete hebräische Bild wird bewahrt und nicht durch eine abstrakte Deutung ersetzt. Zugleich weist die Fußnote auf die idiomatische Bedeutung von Gegenwart oder Zuwendung hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzstellung. »Angesicht« erhält das konkrete biblische Bild, während »erschrecken« und »sterben« unmittelbar verständlich bleiben. Die Wiederholung von »sie« folgt der hebräischen Abfolge und erhält den rhythmischen Parallelismus.
