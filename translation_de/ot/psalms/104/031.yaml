  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: de
  text: Die Herrlichkeit Jahwes bleibe für immer; Jahwe freue sich an seinen Werken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: bleibe
  rationale: Der Jussiv drückt einen Wunsch aus. Zusammen mit לְעוֹלָם gibt „bleibe für immer“ den Fortbestand natürlich und prägnant wieder.
- source_word: כְבוֹד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die geläufige und kontextgerechte Wiedergabe im lobpreisenden Zusammenhang des Psalms.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist modernes, natürliches Deutsch.
- source_word: יִשְׂמַח
  choice: freue sich
  rationale: Die Wunschform steht parallel zum ersten Satzteil; „freue sich“ bewahrt diesen Gebets- und Segenscharakter.
- source_word: בְּמַעֲשָׂיו
  choice: an seinen Werken
  rationale: Im Deutschen bezeichnet „sich an etwas freuen“ idiomatisch den Gegenstand der Freude. „Werke“ umfasst hier im Kontext Gottes Schöpfungswerke.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt unmittelbar das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung wäre.
translation_notes:
  register: Poetisch, würdevoll und in modernem Standarddeutsch. Die parallelen Wunschformen werden mit „bleibe“ und „freue sich“ erhalten.
