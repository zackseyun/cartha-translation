  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: de
  text: und Wein, der das Herz des Menschen erfreut[a], das Gesicht mehr glänzen lässt als Öl[b], und Brot, das das Herz des Menschen stärkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „das Herz des Menschen“; der hebräische Singular steht hier repräsentativ für Menschen allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Gesicht durch Öl glänzen zu lassen“ beziehungsweise „das Gesicht von Öl erstrahlen zu lassen“. Die hebräische Präposition kann einen Vergleich („mehr als Öl“) oder Herkunft beziehungsweise Mittel ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַיִן
  choice: und Wein
  rationale: Die Konjunktion und das Gattungswort werden direkt und im Deutschen natürlich wiedergegeben.
- source_word: יְשַׂמַּח
  choice: erfreut
  rationale: Der Piel-Stamm bezeichnet das Verursachen von Freude; „erfreut“ ist knapp, gegenwärtig und würdevoll.
- source_word: לְבַב אֱנוֹשׁ
  choice: das Herz des Menschen
  rationale: לְבַב bezeichnet hier das innere Leben; אֱנוֹשׁ ist ein repräsentativer Singular für den sterblichen Menschen beziehungsweise die Menschheit.
- source_word: לְהַצְהִיל פָּנִים
  choice: sodass sein Gesicht … erstrahlt
  rationale: Der Infinitiv bezeichnet hier plausibel Folge oder Wirkung. Das ergänzte Possessivpronomen stellt im Deutschen den natürlichen Bezug zum Menschen her.
- source_word: מִשָּׁמֶן
  choice: mehr als von Öl
  rationale: מִן wird im Haupttext komparativ verstanden. Die alternative instrumentale beziehungsweise ursächliche Lesart bleibt in der Fußnote erhalten.
- source_word: וְלֶחֶם
  choice: und Brot
  rationale: Das konkrete Grundnahrungsmittel לֶחֶם wird beibehalten und nicht zum allgemeineren „Nahrung“ erweitert.
- source_word: יִסְעָד
  choice: stärkt
  rationale: סעד bedeutet stützen, erhalten oder stärken; im Zusammenhang mit Brot ist „stärkt“ natürlich und wahrt den körperlich-inneren Sinn.
theological_decisions:
- issue: Repräsentativer Singular אֱנוֹשׁ
  choice: des Menschen
  alternative: des Sterblichen; das menschliche Herz
  rationale: Der Ausdruck meint die Menschheit allgemein, nicht ausschließlich einen männlichen Einzelnen. „des Menschen“ bewahrt den Singular und ist im Deutschen inklusiv verständlich; die Fußnote verdeutlicht dies.
- issue: Mehrdeutigkeit von מִן bei Öl
  choice: 'komparativ: „mehr als von Öl“'
  alternative: 'instrumental/ursächlich: „von Öl“ oder „mit Öl“'
  rationale: Die komparative Deutung ergibt einen sinnvollen poetischen Vergleich, doch die Präposition erlaubt auch die andere Lesart; diese Spannung wird nicht verschwiegen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit poetisch-würdigem Klang. Die beiden Relativsätze fügen sich in den fortlaufenden Satz des Psalms ein. „Erstrahlt“ gibt die Bildhaftigkeit wieder; „stärkt“ vermeidet eine unnötig technische Ausdrucksweise.
