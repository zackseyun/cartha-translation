base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: de
  text: Die Berge stiegen empor[a], die Täler sanken hinab zu dem Ort, den du für sie bestimmt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer anderen plausiblen Deutung der hebräischen Poesie, wobei die Wasser als unausgesprochenes Subjekt verstanden werden: „Sie stiegen über die Berge hinauf, sie stiegen in die Täler hinab, zu dem Ort, den du für sie bestimmt hast.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ
  choice: stiegen empor
  rationale: Das Qal Imperfekt 3. Person maskulin Plural von עלה bezeichnet eine Aufwärtsbewegung. „Stiegen empor“ gibt im Deutschen die poetische Bewegung der sich erhebenden Berge natürlich wieder.
- source_word: הָרִים
  choice: die Berge
  rationale: Der bestimmte maskuline Plural wird mit Artikel wiedergegeben und fungiert in der gewählten syntaktischen Deutung als Subjekt.
- source_word: יֵרְדוּ
  choice: sanken hinab
  rationale: Das Qal Imperfekt 3. Person maskulin Plural von ירד bezeichnet eine Abwärtsbewegung. „Sanken hinab“ bildet den poetischen Gegensatz zu den emporsteigenden Bergen und beschreibt die Absenkung des Geländes.
- source_word: בְקָעוֹת
  choice: die Täler
  rationale: Der feminine Plural bezeichnet eingeschnittene Niederungen oder Täler. Der deutsche Artikel verdeutlicht die parallele Satzstruktur mit „die Berge“.
- source_word: אֶל מְקוֹם
  choice: zu dem Ort
  rationale: Die Präposition אֶל bezeichnet die Richtung auf ein Ziel hin; „zu dem Ort“ bewahrt diese Zielbewegung und die durch den folgenden Relativsatz bestimmte Referenz.
- source_word: זֶה
  choice: den
  rationale: Das hebräische Demonstrativum wird in der natürlichen deutschen Relativkonstruktion „den du …“ aufgenommen, statt unidiomatisch als eigenständiges „diesen“ zu erscheinen.
- source_word: יָסַדְתָּ
  choice: bestimmt hattest
  rationale: יסד bedeutet grundlegen, festsetzen oder einrichten. Im Schöpfungskontext bezeichnet „bestimmt“ Gottes ordnendes Zuweisen eines festen Ortes; das Plusquamperfekt macht die Vorzeitigkeit gegenüber den geschilderten Bewegungen deutlich.
- source_word: לָהֶם
  choice: für sie
  rationale: Der maskuline Pluralsuffix wird formal als „für sie“ bewahrt, ohne seinen Bezug enger festzulegen, als es der hebräische Text erlaubt.
theological_decisions:
- issue: Subjektbezug in der poetischen Zeile
  choice: 'Berge und Täler sind die Subjekte: „Die Berge stiegen empor, die Täler sanken hinab.“'
  alternative: 'Die im Kontext genannten Wasser sind das unausgesprochene Subjekt: „Sie stiegen über die Berge hinauf und flossen in die Täler hinab.“'
  rationale: Die masoretische Akzentuierung und die unmittelbare Syntax erlauben, הָרִים und בְקָעוֹת als Subjekte ihrer jeweiligen Verben zu lesen. Da der Zusammenhang vom Zurückweichen der Wasser handelt, bleibt jedoch auch die traditionelle Deutung mit den Wassern als implizitem Subjekt plausibel und wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. „Stiegen empor“ und „sanken hinab“ bilden die gegensätzliche Geländebewegung ab; die Fußnote bewahrt die echte syntaktische Mehrdeutigkeit des Hebräischen.
