  text: Above them the birds of the heavens dwell[a]; from among the branches they give forth their voice.
translation:
  language: de
  text: Bei ihnen wohnen die Vögel des Himmels; aus dem Geäst[a] lassen sie ihre Stimme hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „aus dem Blattwerk“ oder „aus den Zweigen“. Das seltene hebräische Wort kann allgemein belaubte Äste oder Zweige bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: Über ihnen
  rationale: Die Präposition עַל mit Suffix kann hier räumlich „über/bei ihnen“ bedeuten und bezieht sich wahrscheinlich auf die Wasserläufe des vorigen Verses. „Über ihnen“ bewahrt das Bild und die räumliche Offenheit des Hebräischen.
- source_word: עוֹף הַשָּׁמַיִם
  choice: die Vögel des Himmels
  rationale: עוֹף bezeichnet kollektiv fliegende Tiere, hier natürlich Vögel. „Des Himmels“ gibt die hebräische Genitivverbindung in gehobener, aber verständlicher poetischer Sprache wieder.
- source_word: יִשְׁכּוֹן
  choice: wohnen
  rationale: שׁכן bedeutet „wohnen, sich niederlassen“. „Wohnen“ vermeidet die nicht ausdrücklich im Text enthaltene Festlegung auf Sitzen oder Nisten.
- source_word: מִבֵּין עֳפָאיִם
  choice: aus dem Geäst
  rationale: מִבֵּין bezeichnet den Ausgangspunkt aus einem dazwischenliegenden oder umgebenden Bereich. Das seltene עֳפָאיִם meint wahrscheinlich Zweige, Äste oder Blattwerk; „Geäst“ ist im Deutschen knapp, natürlich und hinreichend weit.
- source_word: יִתְּנוּ קוֹל
  choice: lassen sie ihre Stimme hören
  rationale: Die Wendung bedeutet wörtlich etwa „sie geben Stimme/Laut“. Die gewählte Form bewahrt das Bild der Stimme, klingt im Deutschen natürlich und legt den Laut nicht enger als „Gesang“ aus.
