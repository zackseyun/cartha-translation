source:
  edition: WLC
  text: תְּ֭הוֹם כַּ/לְּב֣וּשׁ כִּסִּית֑/וֹ עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: de
  text: Mit der Tiefe bedecktest du sie wie mit einem Gewand[a]; über den Bergen standen die Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Urflut“; auch: „mit der großen Tiefe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: Urflut
  rationale: תְּהוֹם bezeichnet die große, tiefe Wassermasse. „Urflut“ bewahrt hier das kosmische Schöpfungsbild, ohne es ausdrücklich mythologisch auszudeuten.
- source_word: כַּ/לְּבוּשׁ
  choice: wie mit einem Gewand
  rationale: Das Präfix כַּ markiert den Vergleich, und לְבוּשׁ bedeutet Kleidung oder Gewand. Die Formulierung fügt sich im Deutschen natürlich an „bedecktest“ an.
- source_word: כִּסִּיתוֹ
  choice: Du bedecktest sie
  rationale: Die Verbform ist zweite Person Maskulinum Singular mit einem Suffix der dritten Person Maskulinum Singular. Das Suffix nimmt die in Vers 5 genannte Erde auf; im Deutschen verlangt „Erde“ das feminine Pronomen „sie“. Die direkte Anrede Gottes bleibt erhalten.
- source_word: עַל
  choice: über
  rationale: עַל bezeichnet hier die Lage der Wasser über den Bergen; „über“ erhält die räumliche Aussage knapp und poetisch.
- source_word: הָרִים
  choice: den Bergen
  rationale: הָרִים bedeutet gewöhnlich „Berge“ und bewahrt die Größe des Schöpfungsbildes.
- source_word: יַעַמְדוּ
  choice: standen
  rationale: עמד bedeutet wörtlich „stehen“. „Standen“ erhält das anschauliche Bild, statt es durch „lagen“ oder „bedeckten“ erklärend aufzulösen.
- source_word: מָיִם
  choice: die Wasser
  rationale: Der poetische Plural „die Wasser“ entspricht dem hebräischen מָיִם und verweist auf die zuvor genannte Urflut.
theological_decisions:
- issue: Anrede und Person des Verbs
  choice: 'Direkte Anrede Gottes: „Du bedecktest sie“'
  alternative: 'Erzählende dritte Person: „Er bedeckte sie“'
  rationale: Die hebräische Verbform steht eindeutig in der zweiten Person Maskulinum Singular; der Kontext redet den HERRN direkt an. Die direkte Anrede bewahrt die Struktur des Lobpreises.
- issue: Bezug des pronominalen Suffixes
  choice: „sie“ bezieht sich auf die Erde aus Vers 5
  alternative: Unbestimmtes „es“ ohne ausdrücklich erkennbaren Rückbezug
  rationale: Das hebräische maskuline Suffix greift wahrscheinlich אֶרֶץ auf, das im Hebräischen grammatisch maskulin sein kann. Im Deutschen ist „Erde“ feminin, daher ist der sinngemäße Rückbezug „sie“.
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch. „Urflut“ hält das Schöpfungsbild prägnant fest; „die Wasser“ bewahrt den biblisch-poetischen Plural. Der Haupttext folgt der hebräischen Wortfolge weitgehend, ohne unnatürlich zu klingen.
