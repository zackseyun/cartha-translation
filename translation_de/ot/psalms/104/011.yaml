  text: יַ֭שְׁקוּ כָּל חַיְת֣/וֹ שָׂדָ֑י יִשְׁבְּר֖וּ פְרָאִ֣ים צְמָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/011.yaml
  text: All the beasts of the field drink from them[b][a]; the wild donkeys quench their thirst.
translation:
  language: de
  text: Sie tränken alle Tiere des Feldes; die Wildesel stillen ihren Durst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: Sie tränken
  rationale: Der Hifil von שׁקה bedeutet „zu trinken geben, tränken“. Das vorangestellte „Sie“ nimmt die Wasserläufe aus Vers 10 als Subjekt auf und bewahrt so die hebräische Perspektive.
- source_word: כָּל חַיְתוֹ שָׂדָי
  choice: alle Tiere des Feldes
  rationale: Die Konstruktverbindung bezeichnet die wild lebenden Tiere des offenen Landes. „Tiere des Feldes“ ist verständlich und würdevoll, ohne das altertümlichere „Getier“.
- source_word: יִשְׁבְּרוּ ... צְמָאָם
  choice: stillen ihren Durst
  rationale: שׁבר mit „Durst“ als Objekt ist idiomatisch im Sinn von „den Durst stillen“, nicht wörtlich „brechen“.
- source_word: פְרָאִים
  choice: Wildesel
  rationale: Das Wort bezeichnet Wildesel beziehungsweise Onager; „Wildesel“ ist die klare, allgemein verständliche deutsche Bezeichnung.
theological_decisions: []
