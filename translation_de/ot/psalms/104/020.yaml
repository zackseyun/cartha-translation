id: PSA.104.20
reference: Psalms 104:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תָּֽשֶׁת חֹ֭שֶׁךְ וִ֣/יהִי לָ֑יְלָה בּֽ/וֹ תִ֝רְמֹ֗שׂ כָּל חַיְת/וֹ יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: de
  text: Du setzt Finsternis, und es wird Nacht; in ihr regt sich alles Getier des Waldes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „streift alles Wild des Waldes umher“. Das hebräische Verb bezeichnet die Bewegung von Tieren und kann hier ihr nächtliches Umherziehen einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: Du setzt
  rationale: Die 2. Person Singular richtet sich unmittelbar an Gott; „setzt“ bewahrt sein aktives Handeln und entspricht der Grundbedeutung „setzen, stellen“.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Eine geläufige, im poetischen Kontext würdige Wiedergabe für die einsetzende Dunkelheit.
- source_word: וִיהִי לָיְלָה
  choice: und es wird Nacht
  rationale: 'Gibt die resultierende Zustandsänderung knapp und natürlich wieder: Gott setzt Finsternis, worauf Nacht entsteht.'
- source_word: בּוֹ
  choice: in ihr
  rationale: Das maskuline hebräische Pronomen bezieht sich sinngemäß auf לָיְלָה; im Deutschen verlangt „Nacht“ das feminine Pronomen.
- source_word: תִרְמֹשׂ
  choice: regt sich
  rationale: רמשׂ bezeichnet das Sichbewegen oder Umherkriechen von Tieren. „Regt sich“ klingt im Deutschen natürlich, bewahrt die breite Bedeutung und legt nicht einseitig räuberisches Herumstreifen nahe.
- source_word: כָּל חַיְתוֹ יָעַר
  choice: alles Getier des Waldes
  rationale: „Getier“ gibt die kollektive Gesamtheit der Waldtiere in einem natürlichen, poetisch gehobenen Register wieder; כָּל wird durch „alles“ ausdrücklich bewahrt.
theological_decisions:
- issue: Göttliches Handeln in der Ordnung der Schöpfung
  choice: Gott setzt aktiv die Finsternis, und Nacht entsteht.
  alternative: Gott lässt Finsternis und Nacht lediglich zu.
  rationale: Die Verbform in der 2. Person Singular schreibt Gott die Handlung unmittelbar zu, ohne weitergehende philosophische Aussagen über Kausalität einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem poetischem Klang. „Getier des Waldes“ ist kollektiv und leicht gehoben; „regt sich“ vermeidet sowohl das unnatürlich wirkende „kriecht umher“ für sämtliche Waldtiere als auch die zu stark auf Beutesuche festgelegte Wiedergabe „streift auf der Jagd umher“.
