  source_fidelity: Der Entwurf gibt יָסַד mit »gegründet«, אֶרֶץ im Schöpfungskontext mit »Erde«, מְכוֹנֶיהָ mit »Grundfesten« und בַּל תִּמּוֹט mit »nicht wanken« sachgerecht wieder. Die poetisch-architektonische Weltdarstellung und die emphatische Dauerformel עוֹלָם וָעֶד bleiben erhalten, ohne modernisierend umgedeutet zu werden.
