  variant: modern standard German
source:
  edition: WLC
  text: יָֽסַד אֶ֭רֶץ עַל מְכוֹנֶ֑י/הָ בַּל תִּ֝מּ֗וֹט עוֹלָ֥ם וָ/עֶֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: de
  text: Er hat die Erde auf ihre Grundfesten gegründet[a]; sie wird für immer und ewig nicht wanken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf ihren Sockeln fest gegründet«; das Hebräische gebraucht architektonische Bildsprache für die Beständigkeit der Erde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: gegründet
  rationale: Das Verb bezeichnet das Gründen oder feste Errichten, besonders im Bild des Fundamentlegens. »Gegründet« bewahrt diese architektonische Bildsprache.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Im Zusammenhang dieses Schöpfungslieds ist die ganze Erde gemeint, nicht ein begrenztes Land.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier im architektonischen Bild die Grundlage beziehungsweise tragende Basis.
- source_word: מְכוֹנֶיהָ
  choice: ihre Grundfesten
  rationale: Das Substantiv kann feste Stätten, Sockel oder Fundamente bezeichnen. »Grundfesten« ist im Deutschen eine natürliche poetische Wiedergabe und erhält das Bild stabiler tragender Grundlagen.
- source_word: בַּל תִּמּוֹט
  choice: sie wird … nicht wanken
  rationale: Die Wendung verneint ein Wanken oder Instabilwerden. »Nicht wanken« gibt das Stabilitätsbild prägnant und in gehobener, aber verständlicher Sprache wieder.
- source_word: עוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die gekoppelte Zeitformel verstärkt die unbegrenzte Dauer; die deutsche Wendung erhält diesen Nachdruck.
theological_decisions:
- issue: Kosmologische Sprache in poetischer Schöpfungsbildlichkeit
  choice: Die architektonische Bildsprache von Grundfesten und dauerhaftem Nichtwanken bleibt erhalten.
  alternative: Er stellte die Erde sicher hin, sodass sie sich niemals bewegt.
  rationale: Der Vers beschreibt die von Gott gewährte Beständigkeit der Erde poetisch. Eine Übertragung in moderne naturwissenschaftliche Kategorien würde das Bild verflachen und eine nicht ausgesprochene Deutung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst poetischer Diktion. »Grundfesten« ist leicht gehoben, aber allgemein verständlich und trägt die architektonische Metapher; »nicht wanken« entspricht dem Stil der hebräischen Poesie ohne unnötigen Archaismus.
