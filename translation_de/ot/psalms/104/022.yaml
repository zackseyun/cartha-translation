  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
translation:
  language: de
  text: Geht die Sonne auf, ziehen sie sich in ihre Höhlen zurück[a] und legen sich dort nieder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie werden gesammelt“ oder „sie sammeln sich“. Das hebräische Verb kann passiv („gesammelt werden“) oder reflexiv beziehungsweise intransitiv („sich sammeln, sich zurückziehen“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lagerstätten“ oder „Behausungen“. Das hebräische Wort bezeichnet einen Wohn- oder Aufenthaltsort; im Zusammenhang mit Tieren liegt „Höhlen“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: geht … auf
  rationale: Das Qal Imperfekt von זרח bezeichnet mit der Sonne als Subjekt ihr Aufgehen; die deutsche Wendung „die Sonne geht auf“ ist natürlich und präzise.
- source_word: הַשֶּׁמֶשׁ
  choice: die Sonne
  rationale: Das bestimmte Substantiv wird im Deutschen entsprechend mit bestimmtem Artikel wiedergegeben.
- source_word: יֵאָסֵפוּן
  choice: ziehen sie sich zurück
  rationale: Das Nifal von אסף kann passiv „gesammelt werden“ oder reflexiv/intransitiv „sich sammeln, sich zurückziehen“ bedeuten. Im Zusammenhang mit den nachtaktiven Löwen gibt „sich zurückziehen“ den Sinn natürlich wieder, ohne einen äußeren Handelnden vorauszusetzen.
- source_word: וְאֶל
  choice: und … in
  rationale: Die Zielrichtung von אֶל wird durch „sich zurückziehen“ bereits ausgedrückt; mit dem anschließenden Niederlegen ist „in ihren Höhlen“ im Deutschen idiomatisch.
- source_word: מְעוֹנֹתָם
  choice: ihren Höhlen
  rationale: מָעוֹן bezeichnet eine Wohn- oder Aufenthaltsstätte. Im Tierkontext ist „Höhlen“ eine natürliche, anschauliche Wiedergabe; allgemeiner wären „Lager“ oder „Behausungen“.
- source_word: יִרְבָּצוּן
  choice: legen sich … nieder
  rationale: Das Qal von רבץ beschreibt häufig Tiere, die sich hinlegen oder lagern. „Sich niederlegen“ wahrt das Bild und klingt in modernem Deutsch natürlich.
