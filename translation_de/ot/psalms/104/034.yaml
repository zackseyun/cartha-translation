  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: de
  text: Möge mein Sinnen ihm gefallen[a]; ich will mich an Jahwe freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Möge mein Sinnen ihm angenehm sein“; auch: „ihm willkommen sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: gefallen
  rationale: Das Qal von ערב bezeichnet hier, dass etwas angenehm, wohlgefällig oder willkommen ist. „Gefallen“ gibt den Gebetswunsch im Deutschen natürlich und prägnant wieder.
- source_word: עָלָיו
  choice: ihm
  rationale: In Verbindung mit ערב bezeichnet על mit Suffix denjenigen, dem etwas angenehm ist. Das deutsche Dativpronomen „ihm“ gibt diese Beziehung idiomatisch wieder; gemeint ist Gott.
- source_word: שִׂיחִי
  choice: mein Nachsinnen
  rationale: שִׂיחַ kann Nachsinnen, Sinnen oder Äußerung bezeichnen. Im lobpreisenden Zusammenhang passt „Nachsinnen“, ohne die mögliche Nähe zu innerem Reden völlig auszublenden.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen setzt einen gewissen Nachdruck. Die Stellung „ich will“ trägt diesen im natürlichen deutschen Satz ausreichend.
- source_word: אֶשְׂמַח
  choice: will mich freuen
  rationale: Das Imperfekt kann Entschluss oder fortdauernde Haltung ausdrücken. „Will mich freuen“ bewahrt hier den entschlossenen Klang.
- source_word: בַּיהוָה
  choice: an Jahwe
  rationale: ב markiert den Bezug beziehungsweise Grund der Freude. „Sich an Jahwe freuen“ ist im Deutschen natürlich und bewahrt den Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Nachsinnen“ ist verständlich und poetisch, während „ich will mich an Jahwe freuen“ den entschlossenen Charakter der zweiten Zeile erhält.
