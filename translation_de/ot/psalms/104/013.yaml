source:
  edition: WLC
  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: de
  text: Er tränkt die Berge aus seinen oberen Gemächern; von der Frucht deiner Werke wird die Erde satt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Durch die Frucht deiner Werke wird die Erde satt.« Die hebräische Präposition kann sowohl den Ursprung als auch das Mittel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: Er tränkt
  rationale: Das Hifil-Partizip von שׁקה bezeichnet ein Tränken beziehungsweise Zu-trinken-Geben. Im fortlaufenden Lobpreis wird es natürlich als finites Verb wiedergegeben; das aus dem Kontext erschlossene Subjekt ist Gott.
- source_word: הָרִים
  choice: die Berge
  rationale: Die gewöhnliche Bedeutung von הַר im Plural mit Artikel ist hier »die Berge«.
- source_word: מֵעֲלִיּוֹתָיו
  choice: aus seinen Obergemächern
  rationale: עֲלִיּוֹת bezeichnet obere Räume oder Gemächer. »Obergemächer« bewahrt das architektonische Bild des Psalms und gibt das Possessivsuffix wieder.
- source_word: מִפְּרִי
  choice: von der Frucht
  rationale: מִן kann hier den Ursprung oder das Mittel bezeichnen. »Von der Frucht« ist idiomatisch und lässt die Erde als Empfängerin der von Gottes Wirken hervorgebrachten Fülle erscheinen; die instrumentale Möglichkeit wird in der Fußnote genannt.
- source_word: מַעֲשֶׂיךָ
  choice: deiner Werke
  rationale: »Werke« gibt den weiten Bedeutungsumfang von מַעֲשִׂים wieder und kann im Kontext sowohl Gottes Schaffen als auch sein fortdauerndes Wirken bezeichnen.
- source_word: תִּשְׂבַּע
  choice: wird … satt
  rationale: Das Qal-Imperfekt von שׂבע bezeichnet das Erreichen von Sättigung oder Fülle. Die deutsche Wendung ist natürlich und erhält den anschaulichen Ausdruck.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Schöpfungskontext von Psalm 104 ist die umfassende Bedeutung »Erde« gegenüber dem örtlicheren »Land« vorzuziehen.
theological_decisions:
- issue: Unausgesprochenes göttliches Subjekt
  choice: Er tränkt die Berge
  alternative: Die Berge tränkend
  rationale: Im Hebräischen steht ein Partizip ohne ausdrücklich genanntes Subjekt; der Zusammenhang bezeichnet jedoch Gott. Das deutsche Pronomen macht diese syntaktische Beziehung lesbar, ohne eine zusätzliche theologische Aussage einzuführen.
- issue: Wechsel von der dritten zur zweiten Person
  choice: seinen Obergemächern … deiner Werke
  alternative: deinen Obergemächern … deiner Werke
  rationale: Der auffällige Wechsel entspricht den hebräischen Suffixen der dritten Person in מֵעֲלִיּוֹתָיו und der zweiten Person in מַעֲשֶׂיךָ. Er wird nicht geglättet, damit die sprachliche Spannung des Ausgangstextes erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Obergemächer« erhält bewusst das kosmische Hausbild; »wird satt« ist zugleich allgemein verständlich und bildkräftig. Der Personenwechsel des Hebräischen bleibt erhalten.
