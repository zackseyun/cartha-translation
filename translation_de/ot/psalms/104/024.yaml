base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: de
  text: Wie zahlreich sind deine Werke, Jahwe! Du hast sie alle in Weisheit geschaffen; die Erde ist voll von dem, was dir gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von deinen Geschöpfen“; wörtlicher auch: „von deinem Besitz“. Das hebräische Wort kann bezeichnen, was jemand erworben hat oder besitzt; hier sind wohl umfassend die von Gott geschaffenen Dinge und Lebewesen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: Wie zahlreich sind
  rationale: Die hebräische Ausrufformel betont die große Zahl und Vielfalt der Werke. „Wie zahlreich“ gibt dies im Deutschen natürlich und würdig wieder.
- source_word: מַעֲשֶׂיךָ
  choice: deine Werke
  rationale: „Werke“ entspricht dem Ausdruck direkt und passt zum Schöpfungszusammenhang besser als das stärker ereignisbezogene „Taten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: כֻּלָּם בְּחָכְמָה עָשִׂיתָ
  choice: Du hast sie alle in Weisheit geschaffen
  rationale: „Sie alle“ bewahrt den umfassenden Rückbezug auf die Werke; „in Weisheit“ erhält das hebräische Substantiv und dessen poetisch-theologisches Gewicht. „Geschaffen“ macht im Kontext deutlich, dass es um Gottes Schöpfungswerke geht.
- source_word: מָלְאָה הָאָרֶץ
  choice: die Erde ist voll von
  rationale: Das hebräische Perfekt bezeichnet hier den gegenwärtigen Ergebniszustand. Im Schöpfungspsalm ist „Erde“ gegenüber „Land“ angemessen.
- source_word: קִנְיָנֶךָ
  choice: dem, was dir gehört
  rationale: Der Ausdruck bezeichnet Besitz beziehungsweise Erworbenes. Die offene Formulierung bewahrt den Besitzaspekt, ohne den Begriff ausschließlich auf „Geschöpfe“ zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von קִנְיָנֶךָ
  choice: dem, was dir gehört
  alternative: deinen Geschöpfen
  rationale: Im Schöpfungskontext sind wahrscheinlich die von Gott hervorgebrachten und ihm gehörenden Wesen und Dinge gemeint. Die Hauptfassung bewahrt jedoch die lexikalische Spannung zwischen Besitz, Erworbenem und Geschaffenem; die kontextuell engere Lesart steht in der Fußnote.
translation_notes:
  register: Moderne, allgemein verständliche und zugleich poetisch-würdige Standardsprache. Die Ausrufstruktur und der Parallelismus bleiben erhalten; die strittige Bedeutung des Schlusswortes wird in der Hauptfassung nicht vorschnell aufgelöst.
