  text: עָשָׂ֣ה יָ֭רֵחַ לְ/מוֹעֲדִ֑ים שֶׁ֝֗מֶשׁ יָדַ֥ע מְבוֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/019.yaml
  text: He made the moon for appointed times[a]; the sun knows its setting.
translation:
  language: de
  text: Er machte den Mond für festgesetzte Zeiten[a]; die Sonne kennt ihren Untergang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Jahreszeiten“ oder „für die Festzeiten“; das hebräische Wort kann festgesetzte Zeiten bezeichnen, darunter auch Festtermine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: machte
  rationale: Das Qal von עשה bedeutet gewöhnlich „machen, schaffen, tun“. „Machte“ gibt die Aussage mit Gott als dem aus dem Zusammenhang erschlossenen Subjekt unmittelbar wieder, ohne zusätzlich den Gedanken des Einsetzens in das Verb zu verlagern.
- source_word: יָרֵחַ
  choice: Mond
  rationale: Direkte und im Deutschen natürliche Bezeichnung des Himmelskörpers.
- source_word: לְמוֹעֲדִים
  choice: zur Bestimmung der festgesetzten Zeiten
  rationale: מוֹעֵד bezeichnet eine festgesetzte oder bestimmte Zeit und kann Jahreszeiten sowie Festzeiten einschließen. Die Formulierung bewahrt diese Breite und bringt zugleich die Zweckfunktion des Mondes verständlich zum Ausdruck.
- source_word: שֶׁמֶשׁ
  choice: Sonne
  rationale: Die übliche und eindeutige deutsche Entsprechung.
- source_word: יָדַע
  choice: kennt
  rationale: Die wörtliche Wiedergabe bewahrt die poetische Personifikation der Sonne und vermeidet eine sachlich glättende Umschreibung.
- source_word: מְבוֹאוֹ
  choice: ihren Untergang
  rationale: מָבוֹא bezeichnet ein Hineingehen beziehungsweise einen Eingang; in Verbindung mit der Sonne ist idiomatisch ihr Untergang gemeint. Das feminine Pronomen richtet sich im Deutschen nach „Sonne“.
theological_decisions:
- issue: Bedeutungsumfang von מוֹעֲדִים im Schöpfungszusammenhang
  choice: breit als „festgesetzte Zeiten“
  alternative: „Jahreszeiten“ oder ausdrücklich „Festzeiten/Feste“
  rationale: Der Vers beschreibt Gottes Ordnung der Himmelskörper. Der Mond markiert bestimmte Zeiten, darunter möglicherweise Jahres- und Festzeiten. Die breite Wiedergabe vermeidet eine unbegründete Beschränkung auf klimatische oder kultische Termine.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Personifikation. „Zur Bestimmung der festgesetzten Zeiten“ ist etwas erklärender als eine streng formale Wiedergabe, macht aber die Zweckbeziehung der Präposition לְ im Deutschen klar.
