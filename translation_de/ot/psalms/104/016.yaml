  text: Die Bäume Jahwes sind satt[a], die Zedern des Libanon, die er gepflanzt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben genug“ oder „sind reichlich versorgt“. Das hebräische Verb bezeichnet, dass sie vollständig gesättigt beziehungsweise reichlich versorgt sind.'
