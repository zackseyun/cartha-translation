lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: werden reichlich gesättigt
  rationale: Das Qal-Imperfekt von שבע bezeichnet, dass die Bäume durch Gottes Wasserversorgung ganz und reichlich versorgt werden. Die Formulierung bewahrt den Gedanken der Sättigung, ohne den Bäumen unnötig menschliches Empfinden zuzuschreiben.
- source_word: עֲצֵי יְהוָה
  choice: die Bäume Jahwes
  rationale: Die Constructusverbindung wird formal und natürlich wiedergegeben; sie kann Zugehörigkeit beziehungsweise besondere Größe und Erhabenheit ausdrücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַרְזֵי לְבָנוֹן
  choice: die Zedern des Libanon
  rationale: Die zweite Vershälfte erläutert appositionell, welche Bäume gemeint sind; die geografische Constructusverbindung bleibt erhalten.
- source_word: אֲשֶׁר נָטָע
  choice: die er gepflanzt hat
  rationale: Das Relativpronomen bezieht sich auf die Zedern; das hebräische Perfekt bezeichnet Gottes vollzogene Pflanzung. Das im Hebräischen implizite männliche Subjekt wird im Deutschen als „er“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; die Transliteration wahrt diese Unterscheidung gegenüber dem Titel אֲדֹנָי.
- issue: Bedeutung von „Bäume Jahwes“
  choice: wörtliche Genitivverbindung ohne erklärenden Zusatz
  alternative: mächtige Bäume / von Jahwe gepflanzte Bäume
  rationale: Die Verbindung kann Zugehörigkeit, göttliche Versorgung oder besondere Erhabenheit andeuten. Die Übersetzung legt diese offene Beziehung nicht einseitig fest.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. „Reichlich gesättigt“ verbindet die bildhafte Aussage des Hebräischen mit dem Kontext der göttlichen Wasserversorgung. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
