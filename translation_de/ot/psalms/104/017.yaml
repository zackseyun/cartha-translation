  text: where the birds make their nests[a]; the stork has its home in the cypresses.
translation:
  language: de
  text: Darin nisten die Vögel; der Storch hat sein Zuhause in den Zypressen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tannen“, „Wacholder“ oder eine andere Nadelbaumart; welche Art das hebräische Wort genau bezeichnet, ist ungewiss.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: Darin
  rationale: Die Verbindung leitet einen örtlichen Relativsatz ein und verweist auf die Bäume des vorigen Verses. „Darin“ gibt diesen Rückbezug im Deutschen knapp und natürlich wieder.
- source_word: צִפֳּרִים
  choice: die Vögel
  rationale: Der allgemeine Ausdruck bezeichnet Vögel als Gattung; der bestimmte Artikel ist im Deutschen in diesem Zusammenhang idiomatisch.
- source_word: יְקַנֵּנוּ
  choice: nisten
  rationale: Das Verb קנן bedeutet „nisten“ beziehungsweise „ein Nest bauen“. „Nisten“ ist präzise, natürlich und bewahrt die verbale Aussage.
- source_word: חֲסִידָה
  choice: der Storch
  rationale: Das Substantiv bezeichnet gewöhnlich den Storch. Der Singular wird als repräsentative Gattungsbezeichnung beibehalten.
- source_word: בְּרוֹשִׁים
  choice: in den Zypressen
  rationale: Das hebräische Wort bezeichnet wahrscheinlich eine Art Nadelbaum, doch die genaue Baumart ist unsicher. „Zypressen“ ist eine verbreitete und im Kontext passende Wiedergabe; Alternativen werden in der Fußnote genannt.
- source_word: בֵּיתָהּ
  choice: hat sein Zuhause
  rationale: Wörtlich steht „ihr Haus“. Bezogen auf ein Tier gibt „hat sein Zuhause“ den Sinn im modernen Deutschen natürlich wieder; das deutsche Pronomen richtet sich grammatisch nach „Storch“.
theological_decisions: []
