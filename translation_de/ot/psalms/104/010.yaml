id: PSA.104.10
reference: Psalms 104:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַֽ/מְשַׁלֵּ֣חַ מַ֭עְיָנִים בַּ/נְּחָלִ֑ים בֵּ֥ין הָ֝רִ֗ים יְהַלֵּכֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
translation:
  language: de
  text: Er lässt Quellen in den Tälern[a] entspringen; zwischen den Bergen fließen sie dahin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Wadis“ bzw. „in den Schluchten“. Das hebräische Wort kann zeitweise wasserführende Bachbetten oder die mit ihnen verbundenen Täler bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: Er lässt … entspringen
  rationale: Das substantivierte Hifil-Partizip beschreibt Gottes fortdauerndes Wirken. Die finite deutsche Form ist natürlich; zusammen mit „Quellen“ gibt „lässt … entspringen“ das Aussenden bzw. Hervorbringen von Wasser idiomatisch wieder.
- source_word: מַעְיָנִים
  choice: Quellen
  rationale: מַעְיָן bezeichnet eine natürliche Quelle oder einen Wasserursprung. „Quellen“ ist im modernen Deutschen klar und passt zur Schöpfungsszene.
- source_word: בַּנְּחָלִים
  choice: in den Tälern
  rationale: נַחַל kann Täler, Schluchten, Bachläufe oder zeitweise wasserführende Wadis bezeichnen. „Täler“ vermittelt die topografische Szene allgemeinverständlich, während die Fußnote die engere geografische Bedeutung bewahrt.
- source_word: בֵּין הָרִים
  choice: zwischen den Bergen
  rationale: Die Präposition bezeichnet hier die Lage bzw. Bewegung im Raum zwischen Bergen; die direkte Wiedergabe ist im Deutschen natürlich.
- source_word: יְהַלֵּכוּן
  choice: fließen sie dahin
  rationale: הלך bedeutet wörtlich „gehen“. Auf das Wasser der Quellen bezogen ist „fließen“ die idiomatische deutsche Entsprechung; „dahin“ bewahrt zusätzlich den Gedanken fortschreitender Bewegung.
theological_decisions:
- issue: Bezugsgröße des substantivierten Partizips
  choice: „Er“ bezieht sich auf Gott
  alternative: „Der Quellen entsendet“ als substantivische bzw. partizipiale Form
  rationale: Der Zusammenhang des Psalms beschreibt Gottes ordnendes und fürsorgliches Handeln in der Schöpfung. Die finite Form mit „Er“ stellt diesen kontextuellen Bezug im Deutschen klar her, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, verständliches und zugleich poetisch-würdevolles Standarddeutsch. Die Wortstellung im zweiten Halbvers bewahrt den parallelen, bildhaften Charakter der hebräischen Zeile.
