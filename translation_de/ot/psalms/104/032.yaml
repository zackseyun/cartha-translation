lexical_decisions:
- source_word: הַמַּבִּיט
  choice: Er blickt auf
  rationale: Das Hifil-Partizip von נבט bezeichnet hier substantivisch beziehungsweise relativisch Gott als den, der hinschaut. Die finite Wiedergabe ist im Deutschen natürlich und bewahrt die lebendige Gegenwartswirkung.
- source_word: לָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten; im kosmischen Schöpfungszusammenhang von Psalm 104 ist „Erde“ sachlich angemessen.
- source_word: וַתִּרְעָד
  choice: und sie bebt
  rationale: רעד bezeichnet Zittern oder Beben. „Bebt“ gibt die Reaktion der Erde knapp und poetisch wieder.
- source_word: יִגַּע
  choice: er berührt
  rationale: נגע bedeutet gewöhnlich „berühren“ beziehungsweise „anrühren“. Die schlichte Formulierung unterstreicht, wie mühelos Gottes Macht wirkt.
- source_word: בֶּהָרִים
  choice: die Berge
  rationale: הָרִים bezeichnet hier Berge; diese Wiedergabe erhält die Größe und Kraft des Bildes.
- source_word: וְיֶעֱשָׁנוּ
  choice: und sie rauchen
  rationale: Das Verb עשׁן bedeutet „rauchen“. Seine Pluralform bezieht sich auf die Berge; die knappe Wiedergabe bewahrt die unmittelbare Bildsprache.
theological_decisions:
- issue: Göttliches Subjekt der Partizipialkonstruktion
  choice: Das im Kontext eindeutig auf Gott bezogene Subjekt wird mit „Er“ wiedergegeben.
  alternative: 'Formnäher: „der auf die Erde blickt, sodass sie bebt; der die Berge berührt, sodass sie rauchen.“'
  rationale: Der Zusammenhang des Psalms macht Gott zum Handelnden. Das Pronomen ergibt natürliches modernes Deutsch, ohne eine zusätzliche theologische Aussage einzutragen; die formnähere Konstruktion wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Blickt“ wirkt etwas gehobener als „schaut“, bleibt aber allgemein verständlich. Die kausal-folgende Nuance der hebräischen Satzfolge wird im Haupttext nicht überbestimmt; die formnähere Alternative steht in der Fußnote.
