  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: de
  text: Er blickt auf die Erde[a], und sie bebt; er berührt die Berge, und sie rauchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formnäher: „Der auf die Erde blickt, und sie bebt; er berührt die Berge, und sie rauchen.“'
