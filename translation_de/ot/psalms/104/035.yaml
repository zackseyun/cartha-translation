  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: de
  text: Mögen die Sünder von der Erde verschwinden[a], und die Gottlosen nicht mehr sein. Preise Jahwe, meine Seele! Halleluja![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Mögen die Sünder von der Erde ein Ende nehmen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Preist Jah!“ „Jah“ ist eine Kurzform des Namens Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: sollen … verschwinden
  rationale: Das Qal-Imperfekt von תמם bezeichnet hier, dass Personen zu einem Ende kommen beziehungsweise nicht länger vorhanden sind. In Verbindung mit „von der Erde“ gibt „verschwinden“ die erbetene Entfernung natürlich wieder, ohne ausdrücklich eine bestimmte Art der Vernichtung festzulegen; „sollen“ bewahrt den Wunschcharakter.
- source_word: חַטָּאִים
  choice: die Sünder
  rationale: Das substantivisch gebrauchte Pluralwort bezeichnet Menschen, die durch Sünde gekennzeichnet sind; „die Sünder“ ist prägnant und lässt die persönliche, nicht abstrakte Aussage bestehen.
- source_word: מִן הָאָרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der kosmische Schöpfungsrahmen von Psalm 104 spricht hier für „Erde“.
- source_word: וּרְשָׁעִים
  choice: und die Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch schuldige oder böse Menschen. „die Gottlosen“ entspricht dem gehobenen poetischen Register und bildet die traditionelle Gegenkategorie zu den Gerechten ab, ohne die Wendung zu umschreiben.
- source_word: עוֹד אֵינָם
  choice: sollen nicht mehr sein
  rationale: Die Wendung bezeichnet das Ende ihres Vorhandenseins. „nicht mehr sein“ wahrt die knappe poetische Form und die inhaltliche Härte.
- source_word: בָּרֲכִי נַפְשִׁי אֶת יְהוָה
  choice: Preise Jahwe, meine Seele!
  rationale: ברך bedeutet bei Gott als Objekt wörtlich „segnen“, hat hier jedoch den Sinn lobpreisender Verehrung. „Preise“ ist im heutigen Deutsch für die Selbstaufforderung natürlich und verständlich; „meine Seele“ erhält die poetische Selbstanrede. Der Gottesname wird direkt als „Jahwe“ wiedergegeben.
- source_word: הַלְלוּ יָהּ
  choice: Halleluja!
  rationale: Die feststehende liturgische Wendung ist im Deutschen als „Halleluja“ geläufig. Ihre wörtliche Bedeutung wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Ob der Vers das Ende der Sünde oder das Verschwinden sündiger Menschen erbittet
  choice: Der Text spricht davon, dass die Sünder von der Erde verschwinden und die Gottlosen nicht mehr sind.
  alternative: Die Sünden sollen von der Erde verschwinden.
  rationale: חַטָּאִים und רְשָׁעִים bezeichnen hier Personen, nicht abstrakt Sünde oder Bosheit. Die Übersetzung mildert die Spannung des Wunsches daher nicht zu einer bloßen Bitte um das Ende der Sünde ab.
- issue: Wie der Wunschcharakter der ersten Vershälfte wiederzugeben ist
  choice: „sollen … verschwinden“ und „sollen nicht mehr sein“
  alternative: 'Indikativisch: „Die Sünder werden verschwinden“; imperativisch: „Die Sünder müssen verschwinden“'
  rationale: Die hebräischen Imperfektformen haben im Kontext einen volitiven, jussivähnlichen Sinn. Die deutsche Konstruktion mit „sollen“ bringt einen Wunsch beziehungsweise eine Bitte zum Ausdruck, ohne daraus eine bloße Zukunftsaussage oder einen direkten Befehl zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Jahwe“ gibt den Gottesnamen wieder; „Halleluja“ bleibt als vertrauter liturgischer Ausdruck erhalten. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Formulierung.
