  source_fidelity: 'Die Personenbezeichnungen „Sünder“ und „Gottlose“ sowie der kosmische Bezug „Erde“ sind zutreffend. „verschwinden“ ist als idiomatische Wiedergabe von יִתַּמּוּ im Zusammenhang mit „von der Erde“ vertretbar. Das deutsche Modalverb „sollen“ ist jedoch mehrdeutig: Es kann einen Befehl oder eine normative Forderung ausdrücken, während der hebräische Imperfekt hier einen Wunsch ausdrückt. „Mögen“ bildet diesen Wunschcharakter klarer ab.'
