  text: הַֽלְל֣וּ אֶת יְ֭הוָה כָּל גּוֹיִ֑ם שַׁ֝בְּח֗וּ/הוּ כָּל הָ/אֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/001.yaml
  text: Praise Yahweh[a], all nations; extol him, all peoples.
translation:
  language: de
  text: Preist Jahwe, alle Nationen; rühmt ihn, alle Völker!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Preist
  rationale: Der Piel-Imperativ Plural von הלל ist ein unmittelbarer Aufruf zum Lob. „Preist“ ist im Deutschen natürlich, würdig und bewahrt die direkte Anrede.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: Die Akkusativpartikel אֶת kennzeichnet den Gottesnamen יהוה als direktes Objekt. „Jahwe“ gibt den Eigennamen wieder; eine Fußnote nennt die traditionelle Wiedergabe „der HERR“.
- source_word: כָּל גּוֹיִם
  choice: ihr Völker alle
  rationale: גּוֹיִם bezeichnet hier sämtliche Völker beziehungsweise Nationen. Die Anrede mit „ihr“ macht den hebräischen Vokativcharakter im Deutschen deutlich.
- source_word: שַׁבְּחוּהוּ
  choice: rühmt ihn
  rationale: Der Piel-Imperativ Plural von שבח mit Suffix der 3. Person Singular fordert dazu auf, ihn lobend zu rühmen. „Rühmt“ unterscheidet den Ausdruck vom ersten Verb und erhält den poetischen Parallelismus.
- source_word: כָּל הָאֻמִּים
  choice: ihr Nationen alle
  rationale: אֻמִּים bezeichnet Volksgemeinschaften oder Nationen. „Nationen“ bewahrt eine leichte lexikalische Abwechslung gegenüber גּוֹיִם, ohne einen sachlich scharfen Unterschied zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ macht den Namen im Haupttext sichtbar; die traditionelle ehrfürchtige Ersatzlesung „der HERR“ wird in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweigliedrige poetische Aufforderung und die leichte Variation der beiden hebräischen Ausdrücke für Völkergruppen werden bewahrt.
