  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: de
  text: Denn mächtig über uns ist seine beständige Liebe, und Jahwes Treue[a] währt ewig. Lobt Jah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wahrheit.'
    reason: lexikalische Alternative für אֱמֶת
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den Aufruf zum Lob in Vers 1 ein und wahrt den poetischen Zusammenhang.
- source_word: גָבַר עָלֵינוּ
  choice: hat sich an uns mächtig erwiesen
  rationale: Bewahrt die verbale Vorstellung von Stärke und Überlegenheit, klingt im Deutschen jedoch natürlicher als eine wörtliche Formulierung mit „über uns“.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: Gibt sowohl die liebevolle Zuwendung als auch die verlässliche, dauerhafte Bindung von חֶסֶד wieder.
- source_word: וֶאֱמֶת
  choice: und Jahwes Treue
  rationale: אֱמֶת bezeichnet Wahrheit, Verlässlichkeit oder Treue; in der Verbindung mit חֶסֶד steht hier die verlässliche Treue im Vordergrund. Die Alternative „Wahrheit“ bleibt in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Drückt die unbegrenzte Dauer idiomatisch aus und macht im Deutschen das Fortbestehen der Treue deutlich.
- source_word: הַלְלוּ יָהּ
  choice: Lobt Jah!
  rationale: Übersetzt den Imperativ und bewahrt zugleich die Kurzform des Gottesnamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als persönlichen Namen.
- issue: Bedeutungsbreite von אֱמֶת neben חֶסֶד
  choice: Treue
  alternative: Wahrheit
  rationale: Im Kontext bezeichnet אֱמֶת besonders Gottes Verlässlichkeit und Treue. Da „Wahrheit“ lexikalisch ebenfalls möglich ist, wird diese Lesart nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Bildhafte Kraft von גָבַר עַל
  choice: hat sich an uns mächtig erwiesen
  alternative: ist mächtig über uns
  rationale: Die gewählte Form bewahrt das Motiv überwältigender Stärke, ohne im Deutschen fälschlich den Eindruck feindlicher Herrschaft über die Angesprochenen zu erwecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Beständige Liebe“ erschließt den Beziehungs- und Verlässlichkeitsgehalt von חֶסֶד; „Lobt Jah!“ bewahrt die direkte Aufforderung und die Kurzform des Gottesnamens.
