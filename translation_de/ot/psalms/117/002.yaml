  - severity: low
    issue: „bleibt für immer“ ist etwas prosaisch und fügt eine Fortbestandsnuance hinzu.
    rationale: Der hebräische Nominalsatz verbindet Jahwes אֱמֶת unmittelbar mit לְעוֹלָם. „Währt ewig“ bildet dies idiomatisch und knapp ab.
