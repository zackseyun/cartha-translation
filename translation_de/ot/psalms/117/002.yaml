  source_fidelity: 'Die Wiedergabe von כִּי, חַסְדּוֹ, אֱמֶת, dem Gottesnamen und dem Schlussimperativ ist im Wesentlichen zutreffend. Bei גָבַר עָלֵינוּ schwächt „hat sich an uns mächtig erwiesen“ jedoch die präpositionale und bildhafte Aussage ab: Gottes חסד erweist sich als mächtig „über/gegenüber“ seinem Volk. Eine knappe poetische Wortstellung kann dies im Deutschen ohne den Anschein feindlicher Herrschaft bewahren.'
  naturalness: „Denn mächtig über uns ist seine beständige Liebe“ ist modernes, würdiges und poetisch knappes Standarddeutsch. „Jahwes Treue währt ewig“ klingt natürlicher und näher an der nominalen hebräischen Aussage als „bleibt für immer“.
  terminology: „Beständige Liebe“ ist für חֶסֶד vertretbar; „Treue“ gibt אֱמֶת in der Verbindung mit חֶסֶד kontextgerecht wieder. Die Fußnote erhält mit „Wahrheit“ die reale lexikalische Alternative. „Jahwe“ und die Kurzform „Jah“ sind im Text konsequent unterschieden.
