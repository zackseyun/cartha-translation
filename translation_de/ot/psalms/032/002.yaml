  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: de
  text: Glücklich ist der Mensch, dem der HERR keine Schuld anrechnet[a] und in dessen Geist kein Trug ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Vergehen“ beziehungsweise „keine Sünde“. Das hebräische Wort kann sowohl die schuldhafte Tat als auch die daraus entstehende Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Ausrufform leitet eine Seligpreisung ein. „Glücklich ist“ ist heute verständlich und bezeichnet hier nicht bloß ein momentanes Gefühl, sondern den begünstigten Zustand des Menschen.
- source_word: אָדָם
  choice: der Mensch
  rationale: אָדָם steht im Singular, ist hier jedoch allgemein auf einen einzelnen Menschen bezogen. „Der Mensch“ bewahrt sowohl den Singular als auch die generische Bedeutung.
- source_word: לֹא יַחְשֹׁב ... לוֹ
  choice: dem ... nicht anrechnet
  rationale: חשב mit indirektem Objekt vermittelt eine Rechnungs- beziehungsweise Zurechnungsmetapher. „Anrechnen“ gibt diese forensische Nuance verständlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die Kapitälchenschreibung folgt der im Deutschen etablierten ehrfürchtigen Wiedergabe des Gottesnamens und macht kenntlich, dass im Hebräischen das Tetragramm steht.
- source_word: עָוֹן
  choice: Schuld
  rationale: Das Wort kann das Vergehen, die daraus erwachsende Schuld oder deren Folge bezeichnen. Im Zusammenhang mit dem Nichtanrechnen bringt „Schuld“ die Zurechnungsdimension besonders klar zum Ausdruck, ohne die moralische Bedeutung auszublenden.
- source_word: וְאֵין
  choice: und ... kein ... ist
  rationale: Die hebräische Existenzverneinung wird als natürliche deutsche Nominalkonstruktion wiedergegeben.
- source_word: בְּרוּחוֹ
  choice: in dessen Geist
  rationale: Die Formulierung bewahrt das innere, dispositionale Moment von רוּחַ und nimmt den generischen Singular wieder auf.
- source_word: רְמִיָּה
  choice: Trug
  rationale: „Trug“ bezeichnet Täuschung und innere Falschheit knapp und würdevoll; es passt zum Gegensatz zwischen ehrlicher Haltung und verschleierter Schuld.
theological_decisions:
- issue: Generische Personenbezeichnung
  choice: der Mensch
  alternative: der Mann
  rationale: Das maskuline Singularwort אָדָם bezeichnet hier repräsentativ einen Menschen, nicht ausschließlich eine männliche Person. Die Übersetzung erhält Numerus und Allgemeingültigkeit, ohne den Sinn unnötig auf Männer zu begrenzen.
- issue: Metapher der göttlichen Nichtanrechnung
  choice: dem der HERR keine Schuld anrechnet
  alternative: dem der HERR kein Vergehen zurechnet
  rationale: Die Rechnungsmetapher bleibt erhalten, wird aber nicht durch spätere systematisch-theologische Fachsprache überbestimmt.
- issue: Bedeutungsspanne von עָוֹן
  choice: Schuld
  alternative: Sünde / Vergehen
  rationale: Der Kontext erlaubt sowohl die schuldhafte Tat als auch den daraus folgenden Schuldzustand. Der Haupttext wählt „Schuld“, während die Fußnote die echte lexikalische Spannung sichtbar hält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten; „Trug“ ist leicht gehoben, aber weiterhin geläufig.
