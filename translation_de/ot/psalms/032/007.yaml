id: PSA.32.7
reference: Psalms 32:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: de
  text: Du bist mein Versteck; vor Bedrängnis bewahrst du mich. Mit Jubelrufen der Rettung[a] umgibst du mich. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Rettungslieder“ oder „klingende Rettungsrufe“.'
    reason: lexical_alternative
  - marker: b
    text: „Sela“ ist wahrscheinlich eine musikalische oder liturgische Angabe; die genaue Bedeutung ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: Versteck
  rationale: Das Substantiv bezeichnet einen Ort des Verbergens und damit zugleich des Schutzes. „Versteck“ bewahrt das konkrete Bild des Hebräischen.
- source_word: מִצַּר
  choice: vor Bedrängnis
  rationale: צַר kann Bedrängnis, Not oder eine bedrängende Lage bezeichnen. „Vor Bedrängnis“ bleibt allgemein und legt keinen persönlichen Gegner fest.
- source_word: תִּצְּרֵנִי
  choice: bewahrst du mich
  rationale: נצר bedeutet bewahren, behüten oder schützen. „Bewahren“ passt natürlich zur Aussage von Gottes Schutz.
- source_word: רָנֵּי פַלֵּט
  choice: Jubelrufe der Rettung
  rationale: רָנֵּי bezeichnet klingende, meist freudige Rufe; פַלֵּט bezeichnet Rettung oder Entrinnen. Die kompakte Genitivverbindung erhält die poetische Offenheit des Hebräischen.
- source_word: תְּסוֹבְבֵנִי
  choice: umgibst du mich
  rationale: Die Form von סבב bezeichnet ein Umgeben oder Umschließen und wird direkt und bildhaft wiedergegeben.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks nicht sicher geklärt sind, wird er transliteriert statt gedeutet.
theological_decisions:
- issue: Ursprung und Art der „Jubelrufe der Rettung“
  choice: Die Rufe umgeben den Beter, ohne dass festgelegt wird, wer sie ausstößt oder ob sie Rettung verkünden beziehungsweise besingen.
  alternative: Sie ausdrücklich als von Gott, vom Beter oder von der Gottesdienstgemeinde gesungene Siegeslieder bestimmen.
  rationale: Die hebräische Wendung רָנֵּי פַלֵּט ist knapp und mehrdeutig. Die Übersetzung bewahrt diese Offenheit und vermeidet eine nicht im Text ausgesprochene Zuordnung.
translation_notes:
  register: Modernes, klares und zugleich poetisch-würdevolles Standarddeutsch. Die direkte Anrede und die Schutzbilder bleiben erhalten; die Satzglieder folgen dem hebräischen Aufbau, ohne im Deutschen unnatürlich zu wirken.
