  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: de
  text: Darum soll jeder Fromme zu dir beten, solange du dich finden lässt.[a] Gewiss, bei einer Flut großer Wassermassen werden sie ihn nicht erreichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dir beten zur Zeit des Findens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bei der Flut vieler Wasser“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Darum
  rationale: Die Wendung stellt einen folgernden Bezug zum vorausgehenden Bekenntnis und zur Vergebung her.
- source_word: יִתְפַּלֵּל
  choice: soll ... beten
  rationale: Das Imperfekt hat hier im Kontext auffordernden Sinn.
- source_word: כָּל חָסִיד
  choice: jeder Fromme
  rationale: חָסִיד bezeichnet einen Menschen, der von Treue und Gottesverbundenheit geprägt ist; „Fromme“ ist im Psalmenregister würdig und verständlich, ohne den kirchlich stärker geprägten Ausdruck „Heilige“ einzuführen.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Bewahrt die Gebetsrichtung, ohne einen im Hebräischen nicht ausdrücklich genannten Gottesnamen zu ergänzen.
- source_word: לְעֵת מְצֹא
  choice: solange du dich finden lässt
  rationale: Gibt die idiomatisch wohl passive beziehungsweise reflexive Deutung wieder und bewahrt zugleich die zeitliche Dringlichkeit.
- source_word: רַק
  choice: gewiss
  rationale: Die Partikel wirkt hier bekräftigend, nicht bloß einschränkend.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: Wenn mächtige Wasser hereinbrechen
  rationale: Gibt das Bild einer überwältigenden Wasserflut in natürlichem Deutsch wieder; die wörtlichere Form bleibt in der Fußnote erhalten.
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: werden sie ihn ... nicht erreichen
  rationale: Das maskuline Singularpronomen bezieht sich syntaktisch am ehesten auf den Frommen; „erreichen“ wahrt das Bild, ohne dessen Folgen auszudeuten.
theological_decisions:
- issue: Bedeutung der mächtigen Wasser
  choice: Das poetische Bild bleibt unaufgelöst und kann überwältigende Not oder Gericht bezeichnen.
  alternative: Eine Aussage ausschließlich über den Schutz vor einer buchstäblichen Flut.
  rationale: Der Psalm verwendet Bildsprache; eine engere dogmatische Festlegung wäre vom Vers nicht erzwungen.
- issue: Bezugswort des Schutzversprechens
  choice: „ihn“ bezieht sich auf den betenden Frommen.
  alternative: Die Wasser erreichen Gott nicht.
  rationale: Numerus, Satzfolge und Sinnzusammenhang sprechen für den Frommen als Bezugspunkt von אֵלָיו.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildkraft. Die Anrede bleibt im vertraulichen Singular. Beide Fußnotenmarker erscheinen unmittelbar an den zugehörigen Formulierungen.
