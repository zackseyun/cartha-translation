lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem erklärenden Zusammenhang.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Bewahrt die geläufige Zeitformel für eine ununterbrochene Dauer in natürlichem Deutsch.
- source_word: תִּכְבַּד ... יָדֶךָ עָלַי
  choice: lag deine Hand schwer auf mir
  rationale: Erhält das konkrete hebräische Bild des drückenden Gewichts der göttlichen Hand, ohne dessen theologische Bedeutung weiter auszudeuten.
- source_word: נֶהְפַּךְ
  choice: trocknete aus
  rationale: Das Verb bedeutet wörtlich „wurde verwandelt/verändert“; zusammen mit Lebenskraft und Sommerdürre bezeichnet es hier bildhaft das Schwinden beziehungsweise Austrocknen der Vitalität. Die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: לְשַׁדִּי
  choice: meine Lebenskraft
  rationale: Das seltene Substantiv bezeichnet wohl Saft oder Feuchtigkeit und im Bild die körperliche Vitalität. „Lebenskraft“ gibt den Sinn verständlich wieder; die konkretere Lesart bleibt in der Fußnote sichtbar.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: wie in der Dürre des Sommers
  rationale: חרבון bezeichnet austrocknende Hitze oder Dürre. Die Formulierung verbindet das Bild natürlich mit dem Austrocknen der Lebenskraft, während eine alternative Deutung in der Fußnote genannt wird.
- source_word: סֶלָה
  choice: Sela
  rationale: Der hebräische liturgische oder musikalische Hinweis wird wegen seiner unsicheren genauen Bedeutung unübersetzt beibehalten.
theological_decisions:
- issue: Göttliches Handeln im Leiden
  choice: Gottes Hand liegt schwer auf dem Beter.
  alternative: Das Leiden nur allgemein oder ausdrücklich als strafendes Gericht zu beschreiben.
  rationale: Der hebräische Text schreibt Gott mit „deine Hand“ ausdrücklich eine wirksame Rolle zu, bestimmt aber an dieser Stelle weder den genauen Vorgang noch eine umfassende Lehre von Strafe. Das konkrete Bild wird daher ohne zusätzliche dogmatische Festlegung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das anschauliche Bild der schweren Hand bleibt erhalten; die schwer wörtlich wiederzugebende Verbindung von Verwandlung, Lebenssaft und Sommerdürre wird im Haupttext verständlich formuliert und in den Fußnoten transparent gemacht.
