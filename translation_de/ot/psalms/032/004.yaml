  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: de
  text: Denn Tag und Nacht lag deine Hand schwer auf mir; meine Lebenskraft[a] verdorrte in der Sommerdürre.[b] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Lebenssaft“ beziehungsweise „meine Feuchtigkeit“.'
