source:
  edition: WLC
  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: de
  text: 'Ich machte dir meine Sünde bekannt, meine Schuld verdeckte ich nicht. Ich sagte: »Ich will Jahwe meine Vergehen bekennen.« Und du vergabst die Schuld meiner Sünde.[a] Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich »heben« oder »tragen«; mit »Schuld« als Objekt bezeichnet es hier Vergebung.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: meine Sünde
  rationale: Die direkte und natürliche Wiedergabe bewahrt die Unterscheidung zu עָוֹן und פֶּשַׁע.
- source_word: אוֹדִיעֲךָ
  choice: machte ich dir bekannt
  rationale: Bewahrt den kausativen Sinn des Hifil von ידע und bleibt im Deutschen verständlich.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עָוֹן kann sowohl Verfehlung als auch daraus erwachsende Schuld bezeichnen; »Schuld« passt hier natürlich und bleibt von »Sünde« und »Vergehen« unterschieden.
- source_word: כִסִּיתִי
  choice: verdeckte ich nicht
  rationale: Bewahrt die konkrete Metapher von כסה und damit den Gegensatz zwischen menschlichem Verdecken und Gottes Wegnahme der Schuld.
- source_word: אוֹדֶה
  choice: ich will ... bekennen
  rationale: Im Zusammenhang mit פְשָׁעַי bezeichnet das Hifil von ידה ein Sündenbekenntnis.
- source_word: עֲלֵי פְשָׁעַי
  choice: meine Vergehen
  rationale: עַל markiert hier den Gegenstand des Bekennens; im natürlichen Deutschen wird dieser als direktes Objekt ausgedrückt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: נָשָׂאתָ
  choice: hast ... vergeben
  rationale: נשא bedeutet wörtlich »heben/tragen«, bezeichnet mit Schuld als Objekt aber idiomatisch das Vergeben; das zugrunde liegende Bild wird in der Fußnote genannt.
- source_word: עֲוֺן חַטָּאתִי
  choice: die Schuld meiner Sünde
  rationale: Die Genitivverbindung bildet die geschichtete hebräische Formulierung ab, ohne sie zu glätten.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Funktion und genaue Bedeutung unsicher sind, wird der Ausdruck transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar bewahrt und nicht durch einen Titel ersetzt.
- issue: Wörtliches Bild oder idiomatischer Sinn von נָשָׂאתָ עֲוֺן
  choice: hast die Schuld ... vergeben
  alternative: hast die Schuld ... weggehoben/getragen
  rationale: Die Hauptzeile gibt den im Kontext klaren Sinn natürlichen Deutsch wieder; die belastungsbezogene Bildsprache des Verbs bleibt in der Fußnote zugänglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei hebräischen Begriffe für Sünde werden mit »Sünde«, »Schuld« und »Vergehen« unterschieden. Die Wortstellung im ersten Satz ist leicht gehoben, bleibt aber klar und spiegelt den poetischen Parallelismus.
