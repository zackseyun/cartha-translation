  yaml_path: translation/ot/psalms/032/008.yaml
  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: de
  text: Ich will dir Einsicht geben und dich lehren, welchen Weg du gehen sollst[a]. Ich will dir raten; mein Auge ist auf dich gerichtet[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »auf dem Weg, den du gehen wirst« oder »auf diesem Weg wirst du gehen«. Der hebräische Wortlaut lässt einen wörtlicheren Zukunftssinn zu; der Zusammenhang der Unterweisung spricht jedoch für »gehen sollst«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mein Auge auf dir«. Das Bild kann wachsame Führung oder aufmerksame Fürsorge ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: Der Sprecher kann als der HERR oder als der Psalmist verstanden werden; der hebräische Wortlaut dieses Verses bestimmt ihn nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: Ich will dir Einsicht geben
  rationale: Der Hifil von שׂכל bezeichnet hier das Vermitteln von Einsicht oder Verständnis. Die Wiedergabe erhält den kausativen Sinn und passt zum parallelen Lehren.
- source_word: וְאוֹרְךָ
  choice: und dich lehren
  rationale: Der Hifil von ירה kann lehren, unterweisen oder den Weg weisen bedeuten. »Lehren« bewahrt den unterweisenden Schwerpunkt; der folgende Weg-Ausdruck trägt zugleich den Gedanken der Führung.
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: welchen Weg du gehen sollst
  rationale: Die hebräische Formulierung lässt wörtlich auch einen zukünftigen Sinn zu. Im Zusammenhang der Unterweisung gibt »gehen sollst« die beabsichtigte Wegweisung natürlich wieder, ohne die Alternative zu verschweigen.
- source_word: אִיעֲצָה
  choice: Ich will dir raten
  rationale: יעץ bedeutet beraten oder Rat geben. »Dir raten« ist im modernen Deutschen natürlich und behält den Weisheits- und Beratungssinn.
- source_word: עָלֶיךָ עֵינִי
  choice: mein Auge ist auf dich gerichtet
  rationale: Die bildhafte Rede vom Auge bleibt erhalten und vermittelt aufmerksame, persönliche Begleitung, ohne sie abstrakt auszudeuten.
theological_decisions:
- issue: Identität des Sprechers in Psalm 32,8
  choice: Die erste Person bleibt ohne ausdrückliche Benennung des Sprechers stehen.
  alternative: Den Sprecher ausdrücklich als den HERRN oder als den Psalmisten bestimmen.
  rationale: Der hebräische Vers selbst nennt den Sprecher nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Unterweisungssprache und das Bild des auf den Angesprochenen gerichteten Auges bleiben erhalten; echte lexikalische und sprecherbezogene Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
