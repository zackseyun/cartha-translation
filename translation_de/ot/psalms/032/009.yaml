source:
  edition: WLC
  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: de
  text: Seid nicht wie Pferd und Maultier ohne Verstand. Mit Gebiss und Zaum muss man sie bändigen, sonst kommen sie dir nicht nahe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit sie dir nicht zu nahe kommen«. Der hebräische Schlusssatz ist schwierig. Gemeint sein kann, dass die Tiere nur unter Zwang näher kommen, oder dass man sie bändigen muss, damit sie nicht heranstürmen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Seid nicht
  rationale: אַל mit der Imperfektform von היה drückt hier ein Verbot aus; der deutsche Plural entspricht der hebräischen Anrede.
- source_word: כְּסוּס כְּפֶרֶד
  choice: wie ein Pferd oder wie ein Maultier
  rationale: Die beiden Vergleiche werden in natürlichem Deutsch koordiniert; die singularische Tierdarstellung bleibt erhalten.
- source_word: אֵין הָבִין
  choice: die keinen Verstand haben
  rationale: Gibt den Mangel an Einsicht verständlich und ohne unnötige moralische Präzisierung wieder.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: mit Zaum und Zügel
  rationale: Bezeichnet das Geschirr, mit dem das Tier gelenkt und gebändigt wird; die geläufige deutsche Wortverbindung vermittelt das Bild klar.
- source_word: עֶדְיוֹ לִבְלֹם
  choice: muss man sie bändigen
  rationale: עֶדְיוֹ ist im Kontext schwierig und bezeichnet wohl die angelegte Ausrüstung; die Übersetzung integriert diese in das vorangehende Paar und gibt לבלם als Zweck des Bändigens wieder.
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: sonst kommen sie dir nicht nahe
  rationale: Folgt einer möglichen syntaktischen Deutung der schwierigen Schlussklausel. Der Plural nimmt im Deutschen Pferd und Maultier gemeinsam auf; die alternative Zweckdeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bezug und Sinn der Schlussklausel
  choice: Das Tier kommt ohne Zwangsmittel nicht nahe.
  alternative: Das Tier wird gebändigt, damit es dir nicht zu nahe kommt.
  rationale: Der hebräische Wortlaut ist syntaktisch mehrdeutig. Der Haupttext folgt der negativen Aussage בַּל קְרֹב; die ebenfalls mögliche finale Deutung wird nicht dogmatisch ausgeschlossen, sondern als Variante angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Metapher bleibt konkret; die schwierige hebräische Schlussklausel wird im Haupttext lesbar wiedergegeben und ihre echte Mehrdeutigkeit in der Fußnote offengehalten.
