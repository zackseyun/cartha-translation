  terminology: „Gebiss und Zaum“ ist für die im Hebräischen genannten Zäumungsteile präziser als „Zaum und Zügel“. „Verstand“ und „bändigen“ sind im Register des Psalms angemessen. Die Fußnote kennzeichnet die sachlich begründete syntaktische Unsicherheit, ohne eine Deutung festzulegen.
