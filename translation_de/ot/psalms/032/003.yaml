  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: de
  text: Denn als ich schwieg, verfielen meine Gebeine unter meinem Stöhnen[a] den ganzen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter meinem Brüllen“ beziehungsweise „Schreien“. Das hebräische Wort kann einen lauten, dem Brüllen vergleichbaren Klageruf bezeichnen; im Zusammenhang lässt es sich als qualvolles Stöhnen verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn als
  rationale: כִּי führt hier den erklärenden Rückblick ein; zusammen mit dem Perfekt gibt „Denn als“ den Zusammenhang im Deutschen natürlich wieder.
- source_word: הֶחֱרַשְׁתִּי
  choice: ich schwieg
  rationale: Das Verb bedeutet hier „schweigen“. Der Gegenstand des Schweigens – im Kontext die Sünde – bleibt wie im Hebräischen unausgesprochen.
- source_word: בָּלוּ
  choice: zerfielen
  rationale: בלה bezeichnet das Verfallen, Sich-Abnutzen oder Dahinschwinden. „Zerfielen“ bewahrt das eindringliche körperliche Bild in idiomatischem Deutsch.
- source_word: עֲצָמָי
  choice: meine Gebeine
  rationale: Die konkrete Körpermetaphorik des Hebräischen wird bewahrt; „Gebeine“ trägt dem würdevoll-poetischen Register des Psalms Rechnung.
- source_word: בְּשַׁאֲגָתִי
  choice: unter meinem Stöhnen
  rationale: שׁאגה kann ein lautes Brüllen oder Schreien bezeichnen; hier passt „Stöhnen“ als Ausdruck qualvoller Klage. Die Präposition ב wird als begleitender Umstand beziehungsweise Ursache mit „unter“ wiedergegeben.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Natürliche moderne deutsche Wiedergabe der ununterbrochenen Dauer.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass sich das Schweigen auf nicht bekannte Sünde bezieht
  choice: Im Haupttext unausgesprochen gelassen
  alternative: Denn als ich über meine Sünde schwieg ...
  rationale: Der Kontext legt diesen Bezug nahe, doch der hebräische Vers nennt kein Objekt. Die knappe Offenheit des Ausgangstextes bleibt daher erhalten.
translation_notes:
  register: Modernes, würdevolles Psalmendeutsch. Die konkrete Körperbildlichkeit bleibt erhalten; „Gebeine“ ist poetisch, aber allgemein verständlich. Der Fußnotenmarker steht unmittelbar nach dem Vers.
