  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: de
  text: Von David. Ein Maskil[a]. Glücklich ist, wessen Übertretung vergeben, wessen Sünde bedeckt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Maskil, eine Überschrift, deren genaue Bedeutung unsicher ist; möglicherweise bezeichnet sie ein Lehr- oder Betrachtungslied.
    reason: cultural_note
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Das ל in Psalmüberschriften kann Urheberschaft, Zugehörigkeit oder Widmung bezeichnen. „Von David“ ist natürlich und lässt einen gewissen Spielraum, ohne die Beziehung näher festzulegen.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Die genaue Bedeutung und Funktion dieser Gattungs- oder Vortragsangabe ist unsicher. Die Transliteration vermeidet eine unbelegte Festlegung; mögliche Bedeutungen werden in der Fußnote genannt.
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die idiomatische Ausrufform bezeichnet den beneidenswert guten, begünstigten Zustand eines Menschen. „Glücklich ist“ klingt im modernen Deutschen natürlich und setzt nicht voraus, dass im Hebräischen ausdrücklich ein Segensakt genannt wird.
- source_word: נְשׂוּי
  choice: vergeben
  rationale: Das Partizip von נשׂא bedeutet wörtlich „gehoben/getragen“, bezeichnet in Verbindung mit Schuld jedoch idiomatisch deren Vergebung. Die Bildsprache bleibt in einer Fußnote sichtbar.
- source_word: פֶּשַׁע
  choice: Auflehnung
  rationale: Das Wort bezeichnet einen bewussten Bruch beziehungsweise rebellisches Vergehen. „Auflehnung“ bewahrt diesen kräftigen Bedeutungsanteil und unterscheidet den Ausdruck vom parallelen „Sünde“.
- source_word: כְּסוּי
  choice: zugedeckt
  rationale: Die passive Form von כסה wird bildhaft und parallel zu „vergeben“ wiedergegeben. „Zugedeckt“ bewahrt das konkrete Bild deutlicher als eine rein abstrakte Umschreibung.
- source_word: חֲטָאָה
  choice: Sünde
  rationale: Im Parallelismus mit פֶּשַׁע bezeichnet das Wort moralische Verfehlung, nicht ein Sündopfer.
theological_decisions:
- issue: Form der Seligpreisung und generischer Singular
  choice: Glücklich ist, wem ...
  alternative: Selig ist der Mensch, dessen ... / Glücklich sind alle, denen ...
  rationale: Die Formulierung bewahrt den repräsentativen Singular, bleibt geschlechtsübergreifend und gibt אַשְׁרֵי als Zustandsaussage wieder, ohne einen ausdrücklichen göttlichen Segensakt in den Wortlaut einzutragen.
- issue: Deutung von מַשְׂכִּיל
  choice: Als „Maskil“ transliterieren
  alternative: Lehrgedicht / Betrachtungslied
  rationale: Da die genaue Bedeutung der Überschriftsangabe umstritten ist, bleibt die Unsicherheit im Haupttext erhalten und wird in der Fußnote transparent erläutert.
- issue: Verhältnis von Vergebung und Bedecken
  choice: Die beiden unterschiedlichen hebräischen Bilder als „vergeben“ und „zugedeckt“ bewahren
  alternative: Beide Glieder abstrakt als Vergebung ausdrücken
  rationale: Der poetische Parallelismus verbindet zwei Bilder, ohne sie völlig gleichzusetzen. Die Übersetzung wahrt diese Spannung und fügt keine konfessionelle Deutung des Bedeckens hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Wem ... wem ...“ vermeidet unnötige Geschlechtsmarkierung. Die Überschrift steht getrennt vom Verssatz; der ungeklärte Fachausdruck „Maskil“ bleibt erhalten.
