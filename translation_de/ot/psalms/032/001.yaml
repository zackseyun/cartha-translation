    issue: „Auflehnung“ für פֶּשַׁע
    rationale: Das Wort kann Rebellion bezeichnen, wirkt hier im Singular aber weniger idiomatisch als „Übertretung“ und verschiebt den Schwerpunkt stärker auf eine Haltung als auf das konkrete schuldhafte Vergehen.
  - severity: low
    issue: „zugedeckt“ für כְּסוּי
    rationale: Die Vorsilbe „zu-“ ist im Hebräischen nicht ausgedrückt. „bedeckt“ bewahrt die Metapher präzise und klingt im Parallelismus natürlicher.
  - severity: low
    issue: Lexikalische Formulierung der Fußnote zu נְשׂוּי
    rationale: Die passive Partizipform bezeichnet wörtlich etwas „Getragenes“; „gehoben“ ist möglich, aber weniger unmittelbar. „getragen“/„hinweggetragen“ erklärt das Bild klarer.
