  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: de
  text: 'Von David. Ein Maskil[a].


    Glücklich ist, wem das Vergehen vergeben ist, wem die Sünde zugedeckt ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Maskil, eine Psalmüberschrift, deren genaue Bedeutung unsicher ist; möglicherweise bezeichnet sie ein Lehr- oder Betrachtungslied.
    reason: cultural_note
lexical_decisions:
- source_word: מַשְׂכִּיל (maskil)
  choice: Maskil
  rationale: Die genaue Bedeutung dieser Gattungs- oder Vortragsangabe ist unsicher. Die Umschrift bewahrt diese Unsicherheit, statt sie durch eine nicht gesicherte Deutung aufzulösen.
- source_word: אַשְׁרֵי (aschre)
  choice: Glücklich ist
  rationale: Gibt die Seligpreisungsformel in natürlichem, heutigem Deutsch wieder; gemeint ist ein begünstigter, von Gott gesegneter Zustand.
- source_word: נְשׂוּי (nessui)
  choice: vergeben
  rationale: Im Zusammenhang mit einem Vergehen bezeichnet das wörtliche Bild des Aufhebens oder Wegtragens die Vergebung. Eine Fußnote erhält das konkrete hebräische Bild.
- source_word: פֶּשַׁע (pescha)
  choice: Vergehen
  rationale: Bezeichnet schuldhafte Auflehnung beziehungsweise Übertretung; „Vergehen“ ist hier verständlich und bewahrt den moralischen Ernst.
- source_word: כְּסוּי (kessui)
  choice: zugedeckt
  rationale: Bewahrt das Bild des Bedeckens der Sünde und die Parallelität zur aufgehobenen beziehungsweise weggetragenen Schuld.
- source_word: חֲטָאָה (chata'a)
  choice: Sünde
  rationale: Die übliche und sachlich genaue Wiedergabe für moralische Verfehlung in diesem Kontext.
theological_decisions:
- issue: Verhältnis von Vergebung und Bedeckung der Sünde
  choice: Beide parallelen Bilder werden beibehalten, ohne ihre genaue Beziehung dogmatisch zu erklären.
  alternative: „dessen Schuld vollständig beseitigt ist“
  rationale: Der hebräische Parallelismus spricht sowohl vom aufgehobenen Vergehen als auch von der zugedeckten Sünde. Eine zusammenfassende Paraphrase würde die Bildspannung einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Überschrift bleibt erhalten; „Maskil“ wird wegen der unsicheren Bedeutung nicht interpretierend übersetzt. Die Seligpreisung ist in einer natürlichen deutschen Wem-Konstruktion formuliert.
