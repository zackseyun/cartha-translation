  naturalness: Die Wem-Konstruktion ist würdig und im Deutschen verständlich. Im ersten Parallelglied fehlt jedoch das für die prädikative deutsche Konstruktion erforderliche bzw. deutlich erwartbare „ist“. Die Ergänzung macht den Satz vollständig und erhält die knappe Parallelität.
