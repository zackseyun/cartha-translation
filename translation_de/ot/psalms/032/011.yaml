id: PSA.32.11
reference: Psalms 32:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: de
  text: Freut euch an Jahwe und jubelt, ihr Gerechten! Brecht in Jubel aus[a], ihr alle, die ihr aufrichtigen Herzens seid!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Singt vor Freude“ beziehungsweise „Jauchzt“. Das hebräische Verb bezeichnet einen hellen Jubelruf, der gerufen oder gesungen werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Freut euch
  rationale: Der pluralische Imperativ von שׂמח fordert zu Freude auf; „Freut euch“ ist natürlich und bewahrt den Aufforderungscharakter.
- source_word: בַיהוָה
  choice: an Jahwe
  rationale: Die Präposition ב bezeichnet hier den Bezug beziehungsweise Grund der Freude. Im Deutschen ist „sich an jemandem freuen“ idiomatischer als „sich in jemandem freuen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְגִילוּ
  choice: und jubelt
  rationale: גיל bezeichnet lebhafte, ausgelassene Freude. „Jubelt“ hebt diese gegenüber dem vorhergehenden „Freut euch“ ab.
- source_word: צַדִּיקִים
  choice: ihr Gerechten
  rationale: Das Substantiv steht als direkte Anrede und wird im Deutschen entsprechend mit „ihr“ kenntlich gemacht.
- source_word: וְהַרְנִינוּ
  choice: Brecht in Jubel aus
  rationale: Der Hifil-Imperativ von רנן bezeichnet einen hörbaren Jubelruf, der gerufen oder gesungen sein kann. Die Formulierung hält diese Ausdrucksweise offen.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: ihr alle, die ihr aufrichtigen Herzens seid
  rationale: Die Wendung bezeichnet alle Menschen mit innerer moralischer Geradheit. „Aufrichtigen Herzens“ bewahrt das Herzmotiv und klingt im Deutschen würdig und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von יִשְׁרֵי לֵב
  choice: die aufrichtigen Herzens sind
  alternative: die ein gerades Herz haben
  rationale: Die idiomatische Wiedergabe bezeichnet innere Lauterkeit, ohne die bildhafte Bezugnahme auf das Herz aufzugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelen Imperativen. Die poetische Steigerung von Freude über Jubel bis zum hörbaren Jubelausbruch bleibt erhalten.
