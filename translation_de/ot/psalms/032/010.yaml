  text: רַבִּ֥ים מַכְאוֹבִ֗ים לָ/רָ֫שָׁ֥ע וְ/הַ/בּוֹטֵ֥חַ בַּ/יהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: de
  text: Viele Schmerzen[a] hat der Frevler; doch wer auf Jahwe vertraut, den umgibt treue Liebe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann körperliche Schmerzen, seelische Leiden oder Bedrängnisse bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische חֶסֶד bezeichnet beständige, verlässliche Zuwendung und kann je nach Zusammenhang auch mit „Güte“, „Gnade“ oder „Barmherzigkeit“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים מַכְאוֹבִים
  choice: Viele Schmerzen
  rationale: Die vorangestellte Mengenangabe bleibt erhalten. מַכְאוֹבִים kann körperliche Schmerzen ebenso wie seelisches Leid und Bedrängnisse bezeichnen.
- source_word: לָרָשָׁע
  choice: hat der Frevler
  rationale: 'Die Präposition ל bezeichnet hier eine Zuordnung: Dem Frevler sind viele Schmerzen eigen. Die deutsche Haben-Konstruktion gibt dies natürlich wieder, ohne ausdrücklich eine Ursache oder zeitliche Folge zu behaupten.'
- source_word: וְהַבּוֹטֵחַ
  choice: doch wer … vertraut
  rationale: Das substantivierte Partizip bezeichnet allgemein den Menschen, der vertraut. „Doch“ macht den im Kontext klaren Gegensatz zum Frevler sichtbar.
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: בטח mit ב bezeichnet das Setzen von Vertrauen auf jemanden. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: חֶסֶד
  choice: Güte
  rationale: Das Wort umfasst beständige, verlässliche Zuwendung, Liebe, Gnade und Barmherzigkeit. „Güte“ ist im Deutschen knapp, würdevoll und kontextgemäß, ohne den vielschichtigen Begriff auf einen einzelnen Aspekt zu verengen.
- source_word: יְסוֹבְבֶנּוּ
  choice: den umgibt
  rationale: Das Verb bezeichnet ein Umgeben oder Umschließen. Das männliche Singularsuffix bezieht sich auf den zuvor genannten Vertrauenden und wird mit dem rückbezüglichen „den“ natürlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Generischer Singular bei רָשָׁע und הַבּוֹטֵחַ
  choice: der Frevler / wer vertraut
  alternative: der böse Mann / der Vertrauende
  rationale: רָשָׁע steht im repräsentativen Singular und bezeichnet nicht ausschließlich eine bestimmte männliche Person. „Wer … vertraut“ gibt die allgemeine Aussage idiomatisch wieder; „der Frevler“ bewahrt die knappe Gegenfigur des hebräischen Textes.
- issue: Bezug von חֶסֶד
  choice: Güte ohne ergänztes Possessivpronomen
  alternative: seine Güte
  rationale: Im Zusammenhang ist Jahwes Güte naheliegend, doch der hebräische Satz setzt kein ausdrückliches Possessivpronomen. Die Übersetzung wahrt diese formale Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Frevler“ ist bewusst gehoben, aber weiterhin allgemein verständlich; Satzbau und Gegensatz entsprechen dem Charakter eines Psalmenverses.
