  text: I am for peace[a]; but when I speak[b], they are for war.
translation:
  language: de
  text: Ich bin für den Frieden[a]; doch wenn ich rede[b], sind sie für den Krieg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Hebräischen: »Ich — Frieden«; die Übersetzung gibt die Wendung mit »Ich bin für den Frieden« wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und wenn ich rede«; die hebräische Verknüpfung kann einfacher verstanden werden, doch der Zusammenhang legt einen Gegensatz nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und trägt den Nachdruck des hebräischen Gegensatzes.
- source_word: שָׁלוֹם
  choice: für Frieden
  rationale: Der verblosen Wendung »ich — Frieden« entspricht im Deutschen idiomatisch »ich bin für Frieden«; so wird die friedliche Ausrichtung ausgedrückt, ohne die Aussage ontologisch als »Ich bin Frieden« misszuverstehen.
- source_word: וְכִי
  choice: doch wenn
  rationale: Die Verbindung kann schlicht »und wenn« bedeuten; im Kontext hebt sie jedoch den Gegensatz zwischen der Friedenshaltung des Sprechers und der Kriegshaltung der anderen hervor.
- source_word: אֲדַבֵּר
  choice: ich rede
  rationale: Das Piel-Imperfekt der ersten Person Singular wird in dieser poetischen Aussage natürlich als Präsens wiedergegeben. »Ich rede vom Frieden« würde einen im Hebräischen nicht ausdrücklich genannten Inhalt ergänzen.
- source_word: הֵמָּה
  choice: sie
  rationale: Das betonte maskuline Pluralpronomen verweist auf die Gegner; der Nachdruck ergibt sich im Deutschen aus der Gegenüberstellung von »ich« und »sie«.
- source_word: לַמִּלְחָמָה
  choice: für Krieg
  rationale: Die Präposition bezeichnet hier Ausrichtung oder Haltung. »Für Krieg« bewahrt knapp die Parallele zu »für Frieden«.
