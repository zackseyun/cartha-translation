lexical_decisions:
- source_word: חִצֵּי גִבּוֹר
  choice: Pfeile eines Kriegers
  rationale: Die Status-constructus-Verbindung bezeichnet die Pfeile eines גִבּוֹר. »Krieger« gibt den militärischen Sinn im Bild des Gerichts natürlich wieder.
- source_word: שְׁנוּנִים
  choice: geschärfte
  rationale: Das Wort bezeichnet geschärfte beziehungsweise scharfe Pfeile. »Geschärfte« bewahrt die passive Bedeutung der hebräischen Form.
- source_word: עִם
  choice: dazu
  rationale: Die Präposition verbindet die beiden Gerichtsbilder. »Dazu« ist im Deutschen poetisch und natürlich; wörtlicher wäre »mit«.
- source_word: גַּחֲלֵי
  choice: Kohlen
  rationale: Das Substantiv bedeutet Glut- oder Holzkohlen. Ein Zusatz wie »glühend« oder »brennend« steht nicht ausdrücklich im Ausgangstext.
- source_word: רְתָמִים
  choice: Ginster
  rationale: רְתָמִים bezeichnet den in der Wüste wachsenden Retamstrauch, gewöhnlich als Ginster wiedergegeben; seine Holzkohle war für lang anhaltende Hitze bekannt.
