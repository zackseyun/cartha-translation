  language: de
  text: Geschärfte Pfeile eines Kriegers, mit Kohlen vom Ginster[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier gemeinte Retam ist ein Wüstenstrauch, dessen Holzkohle lange heiß bleibt.
