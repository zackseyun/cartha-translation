  text: מַה יִּתֵּ֣ן לְ֭/ךָ וּ/מַה יֹּסִ֥יף לָ֗/ךְ לָשׁ֥וֹן רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
translation:
  language: de
  text: Was wird er dir geben,[a] und was wird er dir noch hinzufügen, du trügerische Zunge?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was wird er dir antun, und was wird er dir noch antun, du trügerische Zunge?“ Das unausgesprochene Subjekt kann allgemein verstanden werden; viele beziehen es im Zusammenhang auf Gottes Gericht.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: Was
  rationale: Das Fragepronomen leitet eine rhetorische Frage ein; „Was“ bewahrt die Direktheit des Hebräischen.
- source_word: יִתֵּן
  choice: wird er geben
  rationale: Das Qal-Imperfekt 3. Person Maskulin Singular von נתן wird zukunftsbezogen wiedergegeben. Das im Hebräischen unausgesprochene Subjekt bleibt als „er“ unbestimmt.
- source_word: לְךָ
  choice: dir
  rationale: Die Präposition ל mit Suffix der 2. Person wird im Deutschen natürlich mit dem Dativ „dir“ ausgedrückt.
- source_word: וּמַה
  choice: und was … noch
  rationale: Die Konjunktion führt die parallele Frage fort; „noch“ nimmt die weiterführende beziehungsweise additive Bedeutung des folgenden Verbs auf.
- source_word: יֹסִיף
  choice: wird … hinzufügen
  rationale: Das Hifil-Imperfekt von יסף bedeutet hier „hinzufügen“ beziehungsweise „weiteres tun“. „Hinzufügen“ erhält die lexikalische und poetische Parallelität zu „geben“.
- source_word: לָךְ
  choice: dir
  rationale: Erneut wird ל mit Suffix als Dativ wiedergegeben. Die feminine Form des Suffixes entspricht der Anrede an die feminine „Zunge“.
- source_word: לָשׁוֹן
  choice: Zunge
  rationale: Die wörtliche Wiedergabe bewahrt die anschauliche Personifikation und den metonymischen Bezug auf die Rede.
- source_word: רְמִיָּה
  choice: trügerische
  rationale: Das Wort bezeichnet Täuschung oder Falschheit. „Trügerisch“ verbindet sich idiomatisch mit „Zunge“ und bewahrt die moralische Aussage.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: Das Subjekt bleibt mit „er“ unbestimmt.
  alternative: 'Ausdrückliche Deutung als Gott: „Was wird Gott dir geben …?“'
  rationale: Der hebräische Vers nennt das Subjekt nicht. Obwohl der Kontext an Gottes Gericht denken lassen kann, soll diese Deutung nicht stillschweigend in den Haupttext aufgenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Wahrung des hebräischen Parallelismus und der personifizierenden Anrede. Die etwas markante Verbindung „geben … hinzufügen“ bleibt bewusst erhalten; die Fußnote nennt die idiomatischere mögliche Sinnwiedergabe.
