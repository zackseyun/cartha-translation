base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/000.yaml
  text: A Song of Ascents. To Yahweh in my distress I called[a], and he answered me.
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a]


    Zum HERRN rief ich in meiner Not, und er antwortete mir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Lied der Aufstiege“. Dies ist die traditionelle Überschrift der Psalmen 120–134; sie kann sich auf Wallfahrten hinauf nach Jerusalem beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die traditionelle Überschrift der Psalmen 120–134 bezeichnet wahrscheinlich ein Lied für den Aufstieg beziehungsweise die Wallfahrt nach Jerusalem. „Wallfahrtslied“ ist im Deutschen natürlich und bewahrt den kultisch-räumlichen Sinn.
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname JHWH wird gemäß verbreiteter deutscher Bibeltradition mit „HERR“ in Kapitälchenschreibung wiedergegeben.
- source_word: בַּצָּרָתָה לִּי
  choice: in meiner Not
  rationale: Die Wendung bezeichnet persönliche Bedrängnis oder Not; die idiomatische deutsche Form gibt den Sinn prägnant wieder.
- source_word: קָרָאתִי ... וַיַּעֲנֵנִי
  choice: rief ich ... und er antwortete mir
  rationale: Die Verbfolge und die rückblickende Aussage des Hebräischen werden formal klar und natürlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: HERR
  alternative: Jahwe
  rationale: „HERR“ folgt der etablierten jüdischen Lesetradition und der weithin vertrauten deutschen Bibelsprache, ohne eine bestimmte Rekonstruktion der Aussprache in den Haupttext zu setzen.
- issue: Zeitlicher beziehungsweise aussagehafter Bezug von וַיַּעֲנֵנִי
  choice: „und er antwortete mir“ als berichtete Erhörung
  alternative: „und er erhört mich“ als gegenwärtige oder allgemeine Aussage
  rationale: Die hebräische Verbform setzt die Erzählfolge des vorausgehenden Perfekts fort und spricht am ehesten von bereits erfahrener Antwort, ohne deren konkrete Gestalt auszudeuten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die traditionelle Gattungsbezeichnung „Wallfahrtslied“ ist verständlich; die Fußnote bewahrt die wörtliche räumliche Bildsprache und deren mögliche Deutung.
