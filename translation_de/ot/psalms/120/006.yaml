base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/006.yaml
  text: My soul has long dwelt with one who hates peace[a].
translation:
  language: de
  text: Schon lange wohnt meine Seele bei dem, der den Frieden hasst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zu lange wohnt meine Seele bei dem, der den Frieden hasst.“ Der hebräische Versanfang betont die lange Dauer und kann zugleich andeuten, dass sie übermäßig lang ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: schon lange
  rationale: Die adverbial gebrauchte Form bezeichnet zusammen mit dem folgenden Verb eine lange Dauer. „Schon lange“ gibt dies im Deutschen natürlich wieder, ohne die mögliche Wertung „zu lange“ zwingend in den Haupttext einzutragen.
- source_word: שָׁכְנָה
  choice: wohnt
  rationale: Das Verb שכן bedeutet „wohnen, sich aufhalten“. Das Präsens mit „schon lange“ bringt im Deutschen den fortdauernden Zustand idiomatisch zum Ausdruck.
- source_word: לָּהּ
  choice: nicht gesondert wiedergegeben
  rationale: Das feminine Suffix ist syntaktisch schwierig und wird am ehesten als auf נַפְשִׁי zurückweisend beziehungsweise pleonastisch verstanden. Eine separate Wiedergabe wäre im Deutschen missverständlich oder unnatürlich.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die wörtliche, poetische Wendung bewahrt die Ausdrucksweise des Psalms und bezeichnet hier das eigene innere Selbst beziehungsweise die ganze Person.
- source_word: עִם
  choice: bei
  rationale: Im Zusammenhang mit „wohnen“ bezeichnet עִם das Zusammenleben beziehungsweise den Aufenthalt in Gesellschaft einer Person. „Bei“ ist dafür im Deutschen natürlicher als „mit“.
- source_word: שׂוֹנֵא
  choice: dem, der … hasst
  rationale: Das Partizip beschreibt eine Person durch ihre anhaltende Haltung. Die Relativkonstruktion erhält den verbalen Charakter.
- source_word: שָׁלוֹם
  choice: den Frieden
  rationale: Im Kontext des Gegensatzes zwischen friedlicher Absicht und Feindseligkeit ist „Frieden“ die klare und angemessene Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Rede von „meiner Seele“. Die Stellung „Schon lange“ hebt wie das Hebräische die Dauer hervor.
