  text: אֽוֹיָה לִ֭/י כִּי גַ֣רְתִּי מֶ֑שֶׁךְ שָׁ֝כַ֗נְתִּי עִֽם אָהֳלֵ֥י קֵדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: de
  text: Weh mir, denn ich habe als Fremder in Meschech[a] gelebt; ich habe unter den Zelten Kedars gewohnt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meschech und Kedar können hier poetisch für ferne, feindselige Völker stehen; der Vers muss nicht besagen, dass der Beter buchstäblich an beiden Orten zugleich lebte.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „mit den Zelten Kedars“; möglich ist auch: „bei den Zelten Kedars“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: Weh mir
  rationale: Die knappe deutsche Klageformel gibt den persönlichen Ausdruck von Not und Bedrängnis natürlich und gewichtig wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier den Grund der Klage ein; „denn“ wahrt den kausalen und poetischen Zusammenhang.
- source_word: גַרְתִּי
  choice: ich lebe als Fremder
  rationale: גור bezeichnet den Aufenthalt als Fremder beziehungsweise Schutzbürger. Die Formulierung bewahrt diese Außenseiterstellung verständlicher als das heute ungebräuchliche „ich weile als Gast“.
- source_word: מֶשֶׁךְ
  choice: Meschech
  rationale: Der Eigenname wird transliteriert und nicht durch eine Deutung ersetzt.
- source_word: שָׁכַנְתִּי
  choice: ich wohne
  rationale: שכן bezeichnet das Wohnen oder Verweilen; „wohne“ ist gegenwärtiges, würdiges Deutsch und unterscheidet sich hinreichend von der spezifischeren Fremdlingsaussage im ersten Halbvers.
- source_word: עִם
  choice: bei
  rationale: Das hebräische עִם bedeutet wörtlich „mit“. Im Deutschen drückt „bei den Zelten“ den Aufenthalt in ihrer Nähe beziehungsweise Gemeinschaft natürlich aus, ohne die Bildsprache aufzulösen.
- source_word: אָהֳלֵי קֵדָר
  choice: den Zelten Kedars
  rationale: Die konkrete Zeltmetapher und der Eigenname Kedar bleiben erhalten; die Wendung kann zugleich metonymisch die zu Kedar gehörenden Menschen bezeichnen.
theological_decisions:
- issue: Sind Meschech und Kedar wörtliche Aufenthaltsorte oder poetische Bezeichnungen ferner, feindlicher Völker?
  choice: Beide Eigennamen bleiben im Haupttext unverändert erhalten.
  alternative: Die Namen im Haupttext verallgemeinernd als ferne oder feindliche Völker wiedergeben.
  rationale: Der hebräische Text nennt beide ausdrücklich. Da ihre Verbindung geografisch auffällig ist, wird die mögliche poetische Funktion in einer Fußnote erläutert, ohne die Spannung im Haupttext aufzulösen.
- issue: Wie ist עִם אָהֳלֵי קֵדָר räumlich zu verstehen?
  choice: „bei den Zelten Kedars“
  alternative: „mit den Zelten Kedars“ oder idiomatisch „unter den Zelten Kedars“
  rationale: „Bei“ ist im Deutschen eine natürliche Wiedergabe für den Aufenthalt bei einer Personengruppe oder ihren Wohnstätten und bewahrt zugleich die Nähe zum wörtlichen „mit“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Klagesprache. „Weh mir“ bewahrt den poetischen Ernst; „ich lebe als Fremder“ macht die besondere Bedeutung von גור transparent. Die Parallelstruktur und die konkreten Eigennamen bleiben erhalten.
