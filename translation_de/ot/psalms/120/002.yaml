  text: יְֽהוָ֗ה הַצִּ֣ילָ/ה נַ֭פְשִׁ/י מִ/שְּׂפַת שֶׁ֑קֶר מִ/לָּשׁ֥וֹן רְמִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/002.yaml
  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
translation:
  language: de
  text: Jahwe, rette meine Seele[a] vor lügnerischen Lippen, vor einer trügerischen Zunge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „meine Seele“ kann hier auch „mich“ oder „mein Leben“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „vor einer Lippe der Lüge, vor einer Zunge des Trugs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: הַצִּילָה
  choice: rette
  rationale: Der Imperativ von נצל bezeichnet hier die inständige Bitte um Befreiung aus der Bedrohung durch falsche Rede; „rette“ ist klar, natürlich und gebetsgemäß.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש kann die Seele, das Leben oder die ganze Person meinen. „Meine Seele“ bewahrt die hebräische Ausdrucksweise und den poetischen Klang, ohne die Bedeutungsweite zu verbergen.
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: vor lügnerischen Lippen
  rationale: שׂפה („Lippe“) steht metonymisch für Rede; שׁקר bezeichnet Lüge oder Falschheit. Die Pluralform klingt im Deutschen idiomatisch und erhält das poetische Bild.
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: vor einer trügerischen Zunge
  rationale: לשון wird wörtlich als „Zunge“ wiedergegeben, um den Parallelismus mit „Lippen“ zu bewahren. רמיה kann Täuschung oder Trug bezeichnen; „trügerisch“ gibt den moralischen Charakter dieser Rede prägnant wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration bewahrt den persönlichen Gottesnamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von נַפְשִׁי
  choice: meine Seele
  alternative: mich / mein Leben
  rationale: Die traditionelle und poetische Formulierung bleibt im Haupttext erhalten; eine Fußnote weist darauf hin, dass hier auch die ganze Person oder das Leben gemeint sein kann.
translation_notes:
  register: Moderne, würdige Gebetssprache mit bewahrtem hebräischem Parallelismus. „Lippen“ und „Zunge“ bleiben als poetische Bilder erhalten; die Satzstellung ist im Deutschen natürlich und gut verständlich.
