    text: 'Hebräische Überschrift: „Ein Lied der Aufstiege“; auch „Ein Lied der Stufen“ ist möglich. „Wallfahrtslied“ ist die traditionelle Bezeichnung für die Psalmen 120–134.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Lied
  rationale: Das Substantiv bezeichnet unmittelbar ein Lied; „Psalm“ wäre stärker deutend.
- source_word: הַמַּעֲלוֹת
  choice: Wallfahrtslied (in der Gesamtwendung שִׁיר הַמַּעֲלוֹת)
  rationale: Die feste Überschrift der Psalmen 120–134 wird im Deutschen natürlich als „Wallfahrtslied“ wiedergegeben. Die Fußnote bewahrt die wörtliche Bedeutung des Hinaufgehens.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die Richtung des Rufens auf Jahwe hin; „zu“ ist dafür die natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname bewahrt das Tetragramm, statt es durch einen Titel zu ersetzen; „Jahwe“ ist die geläufige deutsche Form.
- source_word: בַּצָּרָתָה לִּי
  choice: In meiner Not
  rationale: Die hebräische Wendung bedeutet idiomatisch „in meiner Bedrängnis/Not“. „Not“ ist knapp, verständlich und dem Psalmstil angemessen.
- source_word: קָרָאתִי
  choice: rief ich
  rationale: Das Verb bedeutet „rufen“. Der Zusammenhang enthält bereits die Notlage, sodass die stärkere Ausdeutung „schrie ich“ nicht nötig ist.
- source_word: וַיַּעֲנֵנִי
  choice: und er antwortete mir
  rationale: Die Form führt die Handlung weiter; das unausgesprochene Subjekt bezieht sich auf Jahwe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ erhält diesen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Zeitlicher beziehungsweise aspektueller Bezug von קָרָאתִי וַיַּעֲנֵנִי
  choice: 'Vergangene Erfahrung: „rief ich … antwortete er“'
  alternative: Gegenwartsnahe oder generalisierende Wiedergabe
  rationale: Die Verbformen stellen den Ruf und die Antwort als zusammengehörige, abgeschlossene Erfahrung dar, ohne darüber hinaus eine bestimmte historische Situation festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle deutsche Gattungsbezeichnung „Wallfahrtslied“ steht im Haupttext; die wörtlichere und bewusst mehrdeutige Bedeutung der Überschrift wird in der Fußnote erhalten.
