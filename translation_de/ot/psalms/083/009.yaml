translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Struktur des Hebräischen wird weitgehend bewahrt; »Mach es mit ihnen« ist verständlich, ohne den Vergleich durch zusätzliche Aussagen auszulegen.
