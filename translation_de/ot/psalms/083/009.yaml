base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/009.yaml
  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: de
  text: Verfahre mit ihnen wie mit Midian[a], wie mit Sisera, wie mit Jabin am Bach Kischon[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Verfahre an ihnen wie Midian, wie Sisera, wie Jabin am Bach Kischon.« Die Wiederholung von »mit« im deutschen Haupttext verdeutlicht die im Hebräischen knappen Vergleichsformulierungen.'
    reason: lexical_alternative
  - marker: b
    text: Siehe Richter 4,7.13; 5,21 zur Niederlage Siseras und Jabins am Kischon.
