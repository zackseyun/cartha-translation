lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: Mach es mit ihnen
  rationale: Die Wendung bewahrt den direkten Imperativ und lässt den feindlichen Charakter des erbetenen Handelns aus den folgenden geschichtlichen Vergleichen hervorgehen, ohne לָהֶם ausdrücklich als »gegen sie« auszudeuten.
- source_word: כְּמִדְיָן
  choice: wie mit Midian
  rationale: Das vergleichende כְּ wird knapp wiedergegeben; »mit« macht im Deutschen die elliptische Beziehung zu »Mach es« verständlich, ohne ein im Hebräischen unausgesprochenes »du getan hast« in den Haupttext einzufügen.
- source_word: כְּסִיסְרָא כְיָבִין
  choice: wie mit Sisera, wie mit Jabin
  rationale: Die parallelen Vergleichsformulierungen und die Eigennamen bleiben erhalten.
- source_word: בְּנַחַל קִישׁוֹן
  choice: am Bach Kischon
  rationale: נַחַל bezeichnet hier den benannten Wasserlauf; »Bach« ist natürlich und entspricht dem geschichtlichen Schauplatz, während בְּ lokal mit »am« wiedergegeben wird.
