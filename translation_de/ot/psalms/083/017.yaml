  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: de
  text: Sie sollen zuschanden werden und für immer bestürzt sein[a]; sie sollen gedemütigt werden und zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sollen sich schämen und für immer bestürzt sein“; im Hebräischen stehen zwei eng verwandte Wörter für Scham bzw. Beschämung (בוש und חפר), deren Bedeutungen sich teilweise überschneiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sie sollen zuschanden werden
  rationale: Das Qal-Imperfekt 3. Person Plural von בוש steht hier in einer Wunsch- bzw. Fluchbittenfolge. „Zuschanden werden“ gibt den resultativen Sinn und die gehobene, aber verständliche Sprache des Psalms wieder.
- source_word: וְיִבָּהֲלוּ
  choice: und für immer erschrecken
  rationale: Das Nifal-Imperfekt von בהל bezeichnet heftiges Erschrecken, Bestürzung oder Entsetzen. „Erschrecken“ wahrt die Intensität, ohne den Grad unnötig festzulegen.
- source_word: עֲדֵי עַד
  choice: für immer
  rationale: Die verstärkte Zeitangabe bezeichnet unbegrenzte Dauer; „für immer“ ist die natürliche moderne Wiedergabe.
- source_word: וְיַחְפְּרוּ
  choice: sie sollen gedemütigt werden
  rationale: חפר überschneidet sich mit בוש im Bedeutungsfeld Scham, hebt aber stärker Beschämung bzw. Erniedrigung hervor. „Gedemütigt werden“ hält beide Ausdrücke unterscheidbar.
- source_word: וְיֹאבֵדוּ
  choice: und zugrunde gehen
  rationale: אבד bedeutet hier „vergehen, zugrunde gehen“. Die Formulierung bewahrt den weiten Sinn, ohne eine bestimmte Art der Vernichtung einzutragen.
theological_decisions:
- issue: Kraft der Imperfektformen in der Fluchbitte
  choice: Wiedergabe als Wunsch mit „sie sollen“
  alternative: 'Aussage über die Zukunft: „Sie werden …“'
  rationale: Im Zusammenhang fungieren die Imperfektformen als Bitten bzw. Wünsche gegen die Feinde Gottes, nicht bloß als Vorhersagen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem Satzbau. „Zuschanden werden“ ist leicht gehoben, aber in poetisch-biblischer Sprache weiterhin verständlich; die Fußnote erhält die Überschneidung der beiden hebräischen Schambegriffe.
