base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/004.yaml
  text: They say[a], “Come, let us wipe them out as a nation, so that the name of Israel will be remembered no more.”
translation:
  language: de
  text: 'Sie sagen: „Kommt, lasst uns sie als Volk auslöschen, damit man sich an den Namen Israels nicht mehr erinnert.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְרוּ
  choice: Sie sagen
  rationale: Das Qal-Perfekt kann vergangen wiedergegeben werden; im poetischen Zusammenhang vergegenwärtigt das Präsens jedoch die fortdauernde feindliche Absicht.
- source_word: לְכוּ
  choice: Kommt
  rationale: Der Pluralimperativ von הלך dient hier idiomatisch als Aufforderung zu einem gemeinsamen Vorhaben; „Kommt“ ist im Deutschen natürlich.
- source_word: וְנַכְחִידֵם
  choice: wir wollen sie auslöschen
  rationale: Die Form bezeichnet das beabsichtigte vollständige Beseitigen. „Auslöschen“ bewahrt die starke, umfassende Aussage und verbindet sich natürlich mit der vorausgehenden Aufforderung.
- source_word: מִגּוֹי
  choice: als Volk
  rationale: Die Verbindung mit מן bezeichnet hier die Beseitigung aus dem Dasein als eigenständiges Volk, nicht lediglich die Entfernung aus einer Gruppe von Nationen.
- source_word: וְלֹא יִזָּכֵר
  choice: damit man sich nicht mehr … erinnert
  rationale: Das Nifal von זכר kann „erinnert werden“ bedeuten. Die unpersönliche deutsche Konstruktion gibt den Sinn natürlich wieder; „damit“ verdeutlicht die im Zusammenhang erkennbare Zielsetzung.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: den Namen Israel
  rationale: Die Konstruktkette wird als biblisch geprägte Wendung bewahrt; „Name“ umfasst hier Identität und Fortbestand Israels.
- source_word: עוֹד
  choice: nicht mehr
  rationale: Im verneinten Satz bedeutet עוד idiomatisch „nicht länger“ beziehungsweise „nicht mehr“.
