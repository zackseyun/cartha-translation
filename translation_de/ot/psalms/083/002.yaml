  text: 'Denn sieh: Deine Feinde lärmen, und die dich hassen, erheben das Haupt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn sieh
  rationale: כִּי begründet den vorausgehenden Ruf, während הִנֵּה die Aufmerksamkeit auf die akute Bedrohung lenkt.
- source_word: יֶהֱמָיוּן
  choice: lärmen
  rationale: Das Verb bezeichnet ein lautes Tosen oder aufrührerisches Getöse; „lärmen“ ist prägnant und bewahrt das hörbare Bild.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: erheben das Haupt
  rationale: Die hebräische Wendung beschreibt selbstbewusstes oder trotziges Auftreten. Die bildhafte Form bleibt erhalten, ohne die genaue Haltung interpretierend festzulegen.
theological_decisions:
- issue: Bedeutung von נָשְׂאוּ רֹאשׁ
  choice: Bildhaft als „erheben das Haupt“ wiedergegeben
  alternative: „treten dreist auf“ oder „lehnen sich auf“
  rationale: Der Ausgangstext lässt offen, ob vor allem Stolz, Trotz, Selbstbewusstsein oder offene Auflehnung gemeint ist; die wörtliche Bildsprache bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „sieh“ gibt die hinweisende Funktion von הִנֵּה natürlich wieder; die parallele Satzstruktur des Hebräischen bleibt erkennbar.
