id: PSA.83.12
reference: Psalms 83:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁ֣ר אָ֭מְרוּ נִ֣ירֲשָׁה לָּ֑/נוּ אֵ֝֗ת נְא֣וֹת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/012.yaml
  text: who said[a], “Let us take possession for ourselves of the pastures of God.”
translation:
  language: de
  text: 'die sagten: »Lasst uns die Weideplätze[a] Gottes für uns in Besitz nehmen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wohnstätten Gottes« beziehungsweise »Wohnorte Gottes«.'
    reason: Das hebräische נְאוֹת kann sowohl Weideplätze als auch Wohnstätten oder Wohnorte bezeichnen.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen knüpft an die im vorausgehenden Zusammenhang genannten Feinde an; im Deutschen ist „die“ hier der natürliche Anschluss.
- source_word: אָמְרוּ
  choice: sagten
  rationale: Das Qal Perfekt, 3. Person Plural, leitet die wiedergegebene Rede mit einer schlichten Vergangenheitsform ein.
- source_word: נִירֲשָׁה
  choice: Lasst uns … in Besitz nehmen
  rationale: Die Kohortativform von ירשׁ bezeichnet hier im feindlichen Zusammenhang die beabsichtigte Besitzergreifung. „Erben“ würde den gewaltsamen Kontext zu wenig erkennen lassen.
- source_word: לָּנוּ
  choice: für uns
  rationale: Die Präposition mit dem Pronomen der 1. Person Plural bringt den eigenen Vorteil und den angestrebten Besitz zum Ausdruck.
- source_word: אֵת
  choice: —
  rationale: Der direkte Objektmarker wird im Deutschen nicht eigens wiedergegeben; seine Funktion zeigt sich am Akkusativobjekt.
- source_word: נְאוֹת
  choice: Weideplätze
  rationale: Das Wort kann Weideplätze, Auen oder Wohnstätten bezeichnen. „Weideplätze“ bewahrt das konkrete Bild und lässt zugleich an begehrtes, besiedelbares Land denken; die Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: אֱלֹהִים
  choice: Gottes
  rationale: Im Zusammenhang des Psalms ist eindeutig der Gott Israels gemeint; der deutsche Singular ist daher angemessen.
theological_decisions:
- issue: Bedeutung von נְאוֹת אֱלֹהִים
  choice: die Weideplätze Gottes
  alternative: die Wohnstätten Gottes / die Wohnorte Gottes
  rationale: Die Wendung kann Gottes Land in einem anschaulichen Weidebild oder seine Wohnstätten beziehungsweise die ihm gehörenden Wohnorte bezeichnen. Die Hauptübersetzung wahrt das konkrete Bild, ohne die Aussage auf den Tempel einzuengen; die Alternativen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Der auffordernde Kohortativ wird mit „Lasst uns“ wiedergegeben; die Wortstellung bleibt natürlich und poetisch knapp.
