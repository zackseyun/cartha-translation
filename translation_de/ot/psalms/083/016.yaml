  text: מַלֵּ֣א פְנֵי/הֶ֣ם קָל֑וֹן וִֽ/יבַקְשׁ֖וּ שִׁמְ/ךָ֣ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/016.yaml
  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: de
  text: Fülle ihre Gesichter mit Schande[a], damit sie deinen Namen suchen, Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie sollen deinen Namen suchen“; das hebräische Verb kann als einfache Fortführung verstanden werden, bezeichnet hier aber wahrscheinlich Zweck oder Folge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Fülle
  rationale: Der Piel-Imperativ 2. Person Maskulin Singular richtet sich an Gott. „Fülle“ gibt das Verb direkt wieder und bewahrt das hebräische Bild.
- source_word: פְנֵיהֶם
  choice: ihr Gesicht
  rationale: Das Hebräische verwendet zwar eine morphologische Pluralform, doch „ihr Gesicht“ ist im Deutschen bei einer Gruppe idiomatischer und bewahrt die konkrete Bildsprache.
- source_word: קָלוֹן
  choice: Schande
  rationale: „Schande“ umfasst öffentliche Entehrung und beschämende Erniedrigung und passt natürlich zur Wendung „das Gesicht mit Schande füllen“.
- source_word: וִיבַקְשׁוּ
  choice: damit sie … suchen
  rationale: Das mit waw verbundene Imperfekt nach einem Imperativ kann Zweck oder Folge ausdrücken. „Damit“ gibt hier die wahrscheinliche Zweckbedeutung wieder, ohne sie in der Fußnote als einzig mögliche Lesart auszugeben.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die wörtliche Wiedergabe bewahrt das biblische Bedeutungsspektrum des Namens als Ausdruck von Gottes offenbarter Identität und Ansehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Zweck des göttlichen Gerichts
  choice: Die erbetene Beschämung wird als auf das Suchen nach Jahwes Namen zielend wiedergegeben.
  alternative: „… und sie sollen deinen Namen suchen“ beziehungsweise „… und sie werden deinen Namen suchen“.
  rationale: Das Imperfekt mit waw nach dem Imperativ lässt eine Zweck- oder Folgebedeutung zu. Im Zusammenhang liegt „damit“ nahe; die alternative koordinierende Lesart bleibt durch die Fußnote sichtbar. So bleibt die Spannung zwischen Gericht und möglicher Hinwendung zu Gott erhalten.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die markante hebräische Bildsprache wird bewahrt; der Zweckzusammenhang wird im Haupttext natürlich ausgedrückt und die syntaktische Alternative in der Fußnote dokumentiert.
