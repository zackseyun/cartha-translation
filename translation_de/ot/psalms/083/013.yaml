  text: אֱֽלֹהַ֗/י שִׁיתֵ֥/מוֹ כַ/גַּלְגַּ֑ל כְּ֝/קַ֗שׁ לִ/פְנֵי רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/013.yaml
  text: My God[a], make them like whirling dust[b], like chaff before the wind.
translation:
  language: de
  text: Mein Gott, mach sie wie einen Wirbel[a], wie Stroh[b] vor dem Wind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Rad“ beziehungsweise „wie etwas Rollendes“. Das hebräische Wort גַּלְגַּל kann ein Rad, etwas Rollendes oder einen Wirbel bezeichnen. Die Bedeutung des Bildes ist nicht eindeutig; im Zusammenhang mit dem vom Wind getriebenen Stroh liegt ein wirbelndes, leichtes Gebilde nahe.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische קַשׁ bezeichnet Stroh oder Stoppeln. Gemeint ist trockenes, leichtes Pflanzenmaterial, das der Wind forttreibt.
    reason: lexical_clarification
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mein Gott
  rationale: Die Anrede mit Suffix der 1. Person Singular wird direkt und natürlich wiedergegeben.
- source_word: שִׁיתֵמוֹ
  choice: mach sie
  rationale: Im Zusammenhang mit den folgenden Vergleichen bezeichnet das Verb, dass Gott sie in den genannten Zustand versetzen soll; „mach sie“ ist im Deutschen klar und gebetsgemäß.
- source_word: כַגַּלְגַּל
  choice: wie wirbelnden Staub
  rationale: גַּלְגַּל kann ein Rad oder etwas Rollendes beziehungsweise Wirbelndes bezeichnen. Der Parallelismus mit vom Wind fortgetriebenem Stroh spricht hier für leichtes, wirbelndes Material; die bildhafte Deutung bleibt in der Fußnote als nicht eindeutig gekennzeichnet.
- source_word: כְּקַשׁ
  choice: wie Stroh
  rationale: קַשׁ bezeichnet gewöhnlich Stroh oder Stoppeln. „Stroh“ bleibt näher am hebräischen Ausdruck als „Spreu“ und ist zusammen mit „vor dem Wind“ im Deutschen verständlich.
- source_word: לִפְנֵי רוּחַ
  choice: vor dem Wind
  rationale: Die knappe deutsche Wendung bewahrt das Bild von Material, das vom Wind vor sich hergetrieben wird.
