base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/001.yaml
  text: O God[a], do not be silent; do not be still[b], O God.
translation:
  language: de
  text: Gott[a], schweige nicht; verstumme nicht und halte nicht still, Gott!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen in diesem Vers zwei verschiedene Gottesbezeichnungen: אֱלֹהִים (’elohim) und אֵל (’el; möglicherweise auch „Mächtiger“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Anrede wird im Deutschen ohne das heute gehoben oder altertümlich wirkende „o“ natürlich und würdig wiedergegeben.
- source_word: אַל דֳּמִי לָךְ
  choice: schweige nicht
  rationale: Die Wendung bittet Gott eindringlich, nicht schweigend und damit scheinbar untätig zu bleiben. Die knappe Form wahrt den poetischen Auftakt.
- source_word: אַל תֶּחֱרַשׁ
  choice: Bleib nicht stumm
  rationale: חרשׁ kann hier Schweigen beziehungsweise Stummbleiben bezeichnen und möglicherweise auch den Gedanken anklingen lassen, sich taub zu stellen. „Bleib nicht stumm“ erhält die Nähe zum Schweigen, ohne die mögliche Nuance zur Gewissheit zu machen.
- source_word: וְאַל תִּשְׁקֹט
  choice: und halte nicht still
  rationale: שׁקט bezeichnet Ruhe, Stille oder ungestörtes Verharren. Im Zusammenhang ist Gottes ausbleibendes Eingreifen gemeint; „halte nicht still“ bewahrt sowohl die Bildlichkeit als auch den Handlungsbezug.
- source_word: אֵל
  choice: Gott
  rationale: Der zweite Gottesname wird als abschließende Anrede natürlich mit „Gott“ wiedergegeben; die Abweichung vom ersten hebräischen Titel wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe der beiden Gottesbezeichnungen אֱלֹהִים und אֵל
  choice: Beide werden im Vers mit „Gott“ wiedergegeben.
  alternative: אֵל als „Mächtiger“ wiedergeben.
  rationale: Beide Wörter dienen hier als direkte Gottes Anrede. „Mächtiger“ würde eine mögliche Bedeutungsnuance ausdrücklich festlegen und klänge in diesem Gebet weniger natürlich. Die echte lexikalische Unterscheidung bleibt durch Fußnote [a] sichtbar.
- issue: Mehrdeutigkeit von תֶּחֱרַשׁ
  choice: „Bleib nicht stumm“ im Haupttext, mit Hinweis auf „stell dich nicht taub“ in der Fußnote.
  alternative: „Stell dich nicht taub“ im Haupttext.
  rationale: Der Kontext stützt vor allem das Schweigen, doch der Wortstamm kann auch mit Taubheit verbunden werden. Die Übersetzung legt die mögliche Doppelbedeutung nicht stillschweigend auf nur eine theologische Deutung fest.
translation_notes:
  register: Moderne, würdige Gebetssprache mit knappen parallelen Bitten. Die drei hebräischen Aufforderungen bleiben jeweils erkennbar; auf das altertümlich wirkende „o Gott“ wird verzichtet.
