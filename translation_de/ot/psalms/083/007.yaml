base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/007.yaml
  text: Gebal[a], Ammon, and Amalek[b]; Philistia with the inhabitants of Tyre.
translation:
  language: de
  text: Gebal[b] und Ammon und Amalek, das Philisterland[a] samt den Bewohnern von Tyrus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Philister«, wenn der Gebietsname stellvertretend für seine Bevölkerung steht.'
    reason: lexical_alternative
  - marker: b
    text: Gebal kann die phönizische Stadt bezeichnen, die als Byblos bekannt ist.
    reason: cultural_note
lexical_decisions:
- source_word: גְּבָל
  choice: Gebal
  rationale: Der hebräische Ortsname wird in seiner biblisch etablierten Form transliteriert; eine Gleichsetzung mit Byblos bleibt als historische Möglichkeit in der Fußnote erhalten.
- source_word: וְעַמּוֹן
  choice: und Ammon
  rationale: Wiedergabe des Namens in der im Deutschen üblichen biblischen Form; die Konjunktion der hebräischen Aufzählung bleibt erhalten.
- source_word: וַעֲמָלֵק
  choice: und Amalek
  rationale: Wiedergabe des Volks- beziehungsweise Gebietnamens in der etablierten deutschen Form; das wiederholte »und« bildet die hebräische Reihung ab.
- source_word: פְּלֶשֶׁת
  choice: das Philisterland
  rationale: Die Form bezeichnet primär das Land oder Gebiet der Philister. »Philisterland« ist verständliches Deutsch und bewahrt diese Bedeutung genauer als die metonymische Wiedergabe »die Philister«.
- source_word: עִם
  choice: samt
  rationale: »Samt« verbindet den letzten Bestandteil knapp und natürlich mit der Aufzählung und entspricht dem Sinn von »mit/zusammen mit«.
- source_word: יֹשְׁבֵי צֽוֹר
  choice: den Bewohnern von Tyrus
  rationale: Die Konstruktverbindung bedeutet wörtlich die Bewohner von Tyrus; die gewählte Form ist modern, klar und nah am Hebräischen.
- source_word: צֽוֹר
  choice: Tyrus
  rationale: »Tyrus« ist die etablierte deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die polysyndetische Reihung »und Ammon und Amalek« bewahrt die Form des hebräischen Textes, während »samt« den Schluss der Liste im Deutschen flüssig anschließt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
