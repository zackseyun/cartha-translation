  yaml_path: translation/ot/psalms/083/003.yaml
  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: de
  text: Gegen dein Volk schmieden sie listige Pläne, und gegen deine Verborgenen beraten sie sich gemeinsam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »deine Verborgenen«. Das hebräische Wort kann Menschen bezeichnen, die verborgen gehalten oder sicher verwahrt werden; möglicherweise schwingt auch der Gedanke des Kostbaren mit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: schmieden sie listige Pläne
  rationale: Das Hifil von ערם bezeichnet hier listiges oder verschlagenes Handeln; סוֹד kann vertrauliche Beratung oder einen geheimen Plan bezeichnen. Die deutsche Wendung gibt das feindselige Planen natürlich wieder, ohne den Ausdruck unnötig zu „Verschwörung“ zu verschärfen.
- source_word: וְיִתְיָעֲצוּ
  choice: beraten sie sich miteinander
  rationale: Das Hitpael von יעץ drückt wechselseitige Beratung aus. Die Wiedergabe bewahrt diesen reziproken Sinn.
- source_word: צְפוּנֶיךָ
  choice: die von dir Geborgenen
  rationale: Die Bildung von צפן kann Menschen bezeichnen, die verborgen gehalten, sicher verwahrt oder als kostbar aufbewahrt werden. „Die von dir Geborgenen“ hält den Schutzgedanken fest und lässt die zugrunde liegende Bedeutungsbreite offen.
- source_word: עַל עַמְּךָ
  choice: gegen dein Volk
  rationale: Im feindseligen Kontext bezeichnet עַל die gegen Gottes Volk gerichtete Handlung.
theological_decisions:
- issue: Bedeutungsnuance von צְפוּנֶיךָ für Gottes Volk
  choice: die von dir Geborgenen
  alternative: deine Verborgenen; die dir Kostbaren
  rationale: Der hebräische Ausdruck kann das Verborgensein beziehungsweise sichere Verwahrtsein und möglicherweise auch die Kostbarkeit der Betroffenen hervorheben. Die Hauptfassung wahrt den Schutzaspekt; die Fußnote nennt die formalere Alternative, ohne eine einzelne theologische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur mit zweimaligem „gegen“ bildet die hebräische Zeile nach; „schmieden“ ist eine geläufige Verbindung mit feindseligen Plänen.
