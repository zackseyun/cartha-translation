  text: the tents of Edom and the Ishmaelites[a], Moab and the Hagrites.
translation:
  language: de
  text: die Zelte Edoms und der Ismaeliter, Moab und der Hagariter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hagriter«.'
    reason: Lexikalische Alternative für הַגְרִים; neben der geläufigen deutschen Form »Hagariter« kommt auch die formnähere Schreibung »Hagriter« vor.
lexical_decisions:
- source_word: אָהֳלֵי
  choice: die Zelte
  rationale: Der hebräische Status-constructus-Plural bedeutet wörtlich »die Zelte von«. Die konkrete poetische Bildsprache bleibt erhalten, auch wenn damit zugleich die zugehörigen Stämme oder Gruppen gemeint sein können.
- source_word: אֱדוֹם
  choice: Edoms
  rationale: Der Eigenname bezeichnet Land beziehungsweise Volk. Der deutsche Genitiv verbindet ihn natürlich mit »die Zelte« und bewahrt die Form des hebräischen Eigennamens.
- source_word: יִשְׁמְעֵאלִים
  choice: der Ismaeliter
  rationale: Die pluralische Volksbezeichnung wird mit der im Deutschen geläufigen Form »Ismaeliter« wiedergegeben; der Genitiv setzt die Konstruktion »die Zelte ...« fort.
- source_word: מוֹאָב
  choice: Moab
  rationale: Der hebräische Text verwendet den Eigennamen und nicht ausdrücklich die Volksbezeichnung »Moabiter«. Die knappe Namensreihe wird daher beibehalten.
- source_word: הַגְרִים
  choice: der Hagriter
  rationale: Die Volksbezeichnung wird mit »Hagriter« wiedergegeben, einer formnahen und in deutschen Bibelübersetzungen belegten Bildung. Die mögliche Beziehung zum Namen Hagar wird in einer Fußnote sichtbar gemacht.
theological_decisions: []
translation_notes:
  register: 'Moderner, würdevoller poetischer Listenstil. Die Ellipse des Hebräischen wird bewahrt: »die Zelte« ist sinngemäß auch auf die Ismaeliter bezogen, während Moab und die Hagriter als weitere Glieder der Koalition knapp angeschlossen werden.'
