source:
  edition: WLC
  text: וְֽ/יֵדְע֗וּ כִּֽי אַתָּ֬ה שִׁמְ/ךָ֣ יְהוָ֣ה לְ/בַדֶּ֑/ךָ עֶ֝לְי֗וֹן עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: de
  text: Sie sollen erkennen, dass du, dessen Name Jahwe ist, allein der Höchste über die ganze Erde bist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Sie sollen erkennen
  rationale: Das Präfixverb steht im Gebets- und Wunschzusammenhang der vorangehenden Verse. Die deutsche Soll-Form gibt diesen volitiven Sinn natürlich wieder.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was die Gegner erkennen sollen.
- source_word: שִׁמְךָ יְהוָה
  choice: dein Name ist Jahwe
  rationale: Die knappe hebräische Apposition wird als eingeschobener Identifikationssatz wiedergegeben; so bleibt der Gottesname ausdrücklich als Name erkennbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen verbreitete wissenschaftliche Wiedergabe des Tetragramms bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: לְבַדֶּךָ
  choice: allein
  rationale: Das Wort betont die Ausschließlichkeit des Angeredeten. Seine Stellung vor dem Prädikat wahrt, dass allein dieser Gott der Höchste ist.
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Der substantivisch gebrauchte göttliche Hoheitstitel wird mit seiner etablierten deutschen Entsprechung wiedergegeben.
- source_word: עַל כָּל הָאָרֶץ
  choice: über die ganze Erde
  rationale: עַל bezeichnet hier Herrschaft beziehungsweise Vorrang; הָאָרֶץ ist angesichts des universalen Zusammenhangs als die gesamte Erde zu verstehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich als Gottes Namen. „Jahwe“ erhält diese Namensfunktion, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bezug von לְבַדֶּךָ („allein“)
  choice: allein der Höchste
  alternative: du allein, dessen Name Jahwe ist
  rationale: Die Wortstellung lässt „allein“ besonders die Aussage betreffen, dass der Angeredete der Höchste ist. Die deutsche Fassung erhält diese Aussage, ohne die enge Verbindung zum Subjekt „du“ aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche bilden die knappe hebräische Namensapposition ab, ohne sie zu einer erklärenden Nebenbemerkung auszubauen.
