  text: כִּ֤י נוֹעֲצ֣וּ לֵ֣ב יַחְדָּ֑ו עָ֝לֶ֗י/ךָ בְּרִ֣ית יִכְרֹֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/005.yaml
  text: For they have conspired together with one heart[b][a]; against you they make a covenant.
translation:
  language: de
  text: Denn sie beraten sich einmütig[b]; gegen dich schließen sie einen Bund[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gegen dich schneiden sie einen Bund«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie verschwören sich mit vereintem Herzen«.'
    reason: alternative_rendering
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Hilferuf ein und gibt die erklärende Funktion natürlich wieder.
- source_word: נוֹעֲצוּ
  choice: sie beraten sich
  rationale: Der Nifal von יעץ bezeichnet hier gemeinsames Beraten beziehungsweise Planen. Die Wiedergabe wahrt den Grundsinn, ohne die im Kontext erkennbare feindliche Absicht bereits vollständig in das Verb hineinzulegen.
- source_word: לֵב יַחְדָּו
  choice: einmütig
  rationale: Die Verbindung von »Herz« und »gemeinsam« bezeichnet eine gemeinsame innere Ausrichtung. »Einmütig« gibt diese hebräische Wendung knapp und idiomatisch wieder; die bildhaftere Möglichkeit wird in der Fußnote bewahrt.
- source_word: עָלֶיךָ
  choice: gegen dich
  rationale: Im Zusammenhang mit den feindlichen Beratungen und dem Bund hat עַל adversative Bedeutung.
- source_word: בְּרִית יִכְרֹתוּ
  choice: sie schließen einen Bund
  rationale: Die feste hebräische Wendung lautet wörtlich »einen Bund schneiden«. Im Deutschen ist »einen Bund schließen« die natürliche und zugleich sachlich genaue Entsprechung.
theological_decisions:
- issue: Charakter des gegen Gott gerichteten gemeinsamen Vorhabens
  choice: gegen dich schließen sie einen Bund
  alternative: gegen dich bilden sie ein Bündnis
  rationale: »Bund« bewahrt das Gewicht und die formale Verbindlichkeit von בְּרִית. Die Stellung von »gegen dich« am Anfang des zweiten Satzteils erhält die Betonung der Opposition gegen Gott.
- issue: Stärke der Wiedergabe von נוֹעֲצוּ
  choice: sie beraten sich
  alternative: sie verschwören sich
  rationale: Das Verb selbst bezeichnet zunächst gemeinsames Beraten; der feindliche, verschwörerische Charakter ergibt sich deutlich aus dem Kontext und dem gegen Gott geschlossenen Bund. So wird die mögliche Bedeutungsbreite nicht unnötig verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Einmütig« verdichtet die hebräische Herzensmetapher idiomatisch; die Fußnote erhält sowohl die bildhafte Form als auch die im Kontext mögliche stärkere Bedeutung »sich verschwören«.
