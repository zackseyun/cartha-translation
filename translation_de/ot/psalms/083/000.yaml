lexical_decisions:
- source_word: שִׁיר
  choice: Lied
  rationale: Das Substantiv bezeichnet ein Lied beziehungsweise eine zum Singen bestimmte Komposition. „Lied“ ist im Deutschen die natürliche und etablierte Wiedergabe in einer Psalmüberschrift.
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Der technische Gattungsbegriff in Psalmüberschriften wird mit dem im Deutschen fest etablierten Wort „Psalm“ wiedergegeben.
- source_word: לְ/אָסָף
  choice: Asafs
  rationale: Der deutsche Genitiv gibt die Zuordnung zu Asaf knapp und idiomatisch wieder, ohne eindeutig festzulegen, ob Autorschaft, Zugehörigkeit oder Widmung gemeint ist.
theological_decisions:
- issue: Bedeutung der Präposition לְ bei Asaf
  choice: Asafs
  alternative: für Asaf
  rationale: Die hebräische Präposition kann in Psalmüberschriften Autorschaft, Zuordnung oder Widmung ausdrücken. Der Genitiv bewahrt diese Offenheit weitgehend; die mögliche Wiedergabe als Widmung wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache; die knappe Form und die zwei Gattungsbezeichnungen der hebräischen Psalmüberschrift bleiben erhalten.
