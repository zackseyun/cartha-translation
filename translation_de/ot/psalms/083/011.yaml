  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: de
  text: Mache ihre Edlen wie Oreb und Seeb und alle ihre Fürsten wie Sebach und Zalmunna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: Mach ihre
  rationale: Der Imperativ richtet sich im Gebet an Gott. Zusammen mit den folgenden Vergleichsgruppen gibt „Mach ihre … wie …“ den Sinn natürlich und knapp wieder.
- source_word: נְדִיבֵמוֹ
  choice: ihre Edlen
  rationale: נָדִיב bezeichnet vornehme oder führende Männer. „Edle“ wahrt die gehobene Bedeutung und unterscheidet den Ausdruck vom parallelen נְסִיכֵמוֹ.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: wie Oreb und Seeb
  rationale: Die Eigennamen verweisen auf die in Richter 7,25 besiegten midianitischen Anführer. Das gemeinsame „wie“ gilt im Deutschen natürlich für beide Namen.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: wie Sebach und Zalmunna
  rationale: Die Eigennamen verweisen auf die midianitischen Könige aus Richter 8. Die im Deutschen üblichen biblischen Namensformen werden verwendet.
- source_word: כָּל נְסִיכֵמוֹ
  choice: all ihre Fürsten
  rationale: „All“ gibt כָּל ausdrücklich wieder; „Fürsten“ bewahrt den politischen Rang von נָסִיךְ und den Parallelismus zu „Edlen“.
theological_decisions:
- issue: Historische Anspielung in der Bitte um Gericht
  choice: Die Namen bleiben als konkrete historische Bezugspunkte für Gottes früheres Gericht über midianitische Führer erhalten.
  alternative: Die Namen lediglich als allgemeine Beispiele besiegter Feinde verstehen oder deutend umschreiben.
  rationale: Oreb, Seeb, Sebach und Zalmunna sind bestimmte Gestalten aus Richter 7–8. Die unveränderte Nennung wahrt den Rückbezug auf frühere göttliche Rettung, ohne die Bitte im Haupttext auszulegen oder abzumildern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe imperativische Gebetssprache und der Parallelismus des Hebräischen bleiben erhalten; die Eigennamen folgen geläufigen deutschen Bibelformen.
