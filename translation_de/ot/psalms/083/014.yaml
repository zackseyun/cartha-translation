  yaml_path: translation/ot/psalms/083/014.yaml
  text: As fire burns a forest[a], and as a flame sets the mountains ablaze,
translation:
  language: de
  text: Wie Feuer einen Wald verbrennt und wie eine Flamme die Berge in Brand setzt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אֵשׁ
  choice: wie Feuer
  rationale: Das präfigierte כ kennzeichnet einen Vergleich; „wie Feuer“ ist im Deutschen die natürliche und poetisch passende Wiedergabe.
- source_word: תִּבְעַר
  choice: verbrennt
  rationale: Das Qal von בער beschreibt hier die Wirkung des Feuers auf den Wald. „Verbrennt“ gibt den Vorgang direkt wieder und lässt im Zusammenhang auch die verzehrende Wirkung erkennen.
- source_word: יָעַר
  choice: einen Wald
  rationale: Das Substantiv bezeichnet einen Wald oder ein Waldgebiet. Im allgemeinen Vergleich klingt der unbestimmte Artikel im Deutschen natürlich.
- source_word: וּכְ/לֶהָבָה
  choice: und wie eine Flamme
  rationale: Die Konjunktion mit vergleichendem כ leitet den parallelen Vergleich ein; „Flamme“ bewahrt die poetische Entsprechung zu „Feuer“.
- source_word: תְּלַהֵט
  choice: in Brand setzt
  rationale: Das Piel von להט bezeichnet ein intensives Entflammen oder Brennen. „In Brand setzt“ gibt diese kräftige, hier sinnvoll als bewirkend verstandene Handlung idiomatisch wieder.
- source_word: הָרִים
  choice: die Berge
  rationale: „Berge“ entspricht dem Substantiv הָרִים; der bestimmte Artikel des Hebräischen wird mit „die“ bewahrt.
