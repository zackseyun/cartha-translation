  text: נִשְׁמְד֥וּ בְֽ/עֵין דֹּ֑אר הָ֥יוּ דֹּ֝֗מֶן לָ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/010.yaml
  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
translation:
  language: de
  text: Sie wurden bei En-Dor[a] vernichtet; sie wurden zu Mist für den Erdboden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in En-Dor“ oder „an En-Dor“. Die hebräische Präposition lässt mehrere örtliche Wiedergaben zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie waren Mist auf dem Erdboden“. Wörtlich steht im Hebräischen: „Sie wurden zu Mist für den Erdboden“ – ein drastisches Bild für Leichen, die wie Abfall oder Dünger auf dem Boden liegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: wurden vernichtet
  rationale: Das Nifal Perfekt von שׁמד bezeichnet, dass sie vernichtet beziehungsweise ausgelöscht wurden. Die passive, resultative Aussage bleibt erhalten, ohne sie unnötig zu verstärken.
- source_word: בְּעֵין דֹּאר
  choice: bei En-Dor
  rationale: Die Präposition בְּ ist hier lokativ. „Bei En-Dor“ eignet sich natürlich für einen Ort des Geschehens und lässt offen, ob genau im Ort oder in dessen Nähe gemeint ist.
- source_word: הָיוּ
  choice: sie wurden
  rationale: היה mit einem Prädikatsnomen kann den Eintritt in einen Zustand ausdrücken. „Sie wurden zu“ gibt diesen resultativen Übergang im Deutschen idiomatisch wieder.
- source_word: דֹּמֶן
  choice: Mist
  rationale: דֹּמֶן bezeichnet Mist oder Dung. „Mist“ ist im heutigen Standarddeutsch direkt, anschaulich und für das Bild von Erniedrigung und verwesenden Leichen passend.
- source_word: לָאֲדָמָה
  choice: für den Erdboden
  rationale: אֲדָמָה bezeichnet hier Boden oder Erdreich. Das לְ wird mit „für“ formal bewahrt; „Erdboden“ verdeutlicht, dass nicht das politische Land gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst drastischer Bildsprache. Die Parallelität der beiden Verbalsätze und die ungewöhnliche hebräische Wendung „Mist für den Erdboden“ bleiben erhalten.
