lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: גַּם hebt hervor, dass Assyrien ebenfalls zu dem zuvor genannten Bündnis gehört. Im Deutschen vermittelt „Auch“ diese einschließende Betonung natürlich.
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Im Zusammenhang bezeichnet der Name das Reich beziehungsweise Volk; „Assyrien“ ist dafür die übliche deutsche Wiedergabe.
- source_word: נִלְוָה עִמָּם
  choice: schloss sich ihnen an
  rationale: Der Niphal von לוה bezeichnet hier das Sich-Anschließen an eine Gruppe. Die aktive deutsche Form ist idiomatisch und bewahrt den Sinn eines Bündnisbeitritts.
- source_word: הָיוּ זְרוֹעַ
  choice: sie wurden … zum starken Arm
  rationale: Die Wendung bewahrt das hebräische Bild des Arms als militärischer Stärke oder Unterstützung. „wurden“ ist im Kontext möglich; „starken“ verdeutlicht die metaphorische Funktion, ohne sie durch „Hilfe“ zu ersetzen.
- source_word: לִבְנֵי לוֹט
  choice: den Söhnen Lots
  rationale: Die direkte familiäre Ausdrucksweise des Hebräischen bleibt erhalten; gemeint sind die von Lot abstammenden Völker.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks unsicher sind, wird er entsprechend deutscher Bibeltradition transliteriert statt gedeutet.
theological_decisions:
- issue: Identität der „Söhne Lots“
  choice: Die angestammte Bezeichnung bleibt im Haupttext erhalten.
  alternative: „Lots Nachkommen“, insbesondere Moab und Ammon
  rationale: Die direkte Wiedergabe bewahrt den geschichtlichen und poetischen Ausdruck; die wahrscheinlich gemeinten Völker werden in der Fußnote erläutert, ohne die Referenz im Haupttext einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung hält das poetische Bild vom Arm fest und erklärt dessen Sinn in der Fußnote. Alle Fußnotenmarker stehen im Haupttext.
