  language: de
  text: Auch Assyrien schloss sich ihnen an; sie wurden den Söhnen Lots zum Arm.[a] Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie wurden den Söhnen Lots zum Arm“. Der Arm steht bildlich für Stärke oder militärische Unterstützung. „Söhne Lots“ bezeichnet Lots Nachkommen, hier besonders Moab und Ammon.'
