source:
  edition: WLC
  text: כֵּ֭ן תִּרְדְּפֵ֣/ם בְּ/סַעֲרֶ֑/ךָ וּ/בְ/סוּפָתְ/ךָ֥ תְבַהֲלֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/015.yaml
  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: de
  text: So verfolge sie mit deinem Sturm und versetze sie mit deinem Unwetter in Schrecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf diese Weise verfolge sie mit deinem Sturm, und mit deinem Wirbelsturm versetze sie in Schrecken.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Knüpft knapp an das vorausgehende Bild an und bezeichnet die gewünschte Art und Weise; im Deutschen ist „So“ natürlich und poetisch angemessen.
- source_word: תִּרְדְּפֵם
  choice: verfolge sie
  rationale: רדף bedeutet gewöhnlich „verfolgen, nachjagen“. „Verfolge sie“ bewahrt den kriegerischen und poetischen Sinn, ohne die engere moderne Bedeutung von „verfolgen“ im Sinn religiöser oder politischer Unterdrückung festzulegen.
- source_word: בְּסַעֲרֶךָ
  choice: mit deinem Sturm
  rationale: סער bezeichnet stürmisches Wetter und kann sich mit der Vorstellung eines Wirbelsturms überschneiden. „Mit deinem Sturm“ gibt das instrumentale בְּ im Zusammenhang gut wieder.
- source_word: וּבְסוּפָתְךָ
  choice: mit deinem Unwetter
  rationale: סוּפָה bezeichnet einen heftigen Sturm oder Wirbelsturm. „Unwetter“ erhält gegenüber „Sturm“ eine poetische Steigerung, ohne die beiden hebräischen Begriffe gleich wiederzugeben.
- source_word: תְבַהֲלֵם
  choice: versetze sie in Schrecken
  rationale: בהל im Piel bedeutet, jemanden in Bestürzung, Panik oder Schrecken zu versetzen. Die Wendung gibt die kausative Intensität in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Göttliches Handeln in einem Rache- beziehungsweise Gerichtspsalm
  choice: Die unmittelbare Bitte an Gott, die Feinde zu verfolgen und in Schrecken zu versetzen, bleibt erhalten.
  alternative: „So mögest du sie mit deinem Sturm verfolgen und sie mit deinem Unwetter in Schrecken versetzen.“
  rationale: Die hebräischen Imperfektformen haben im Gebetszusammenhang eine jussivische Funktion. Der deutsche Imperativ gibt die direkte Bitte natürlich wieder und bewahrt die Spannung des Gebets um Gottes Gericht, ohne sie abzuschwächen oder als bloße Vorhersage darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. „Unwetter“ unterscheidet die beiden verwandten Wetterbegriffe hörbar; die Fußnote bewahrt die mögliche Wiedergabe von סוּפָה als „Wirbelsturm“ und von כֵּן als „Auf diese Weise“.
