  text: הָרִ֣יעוּ לַֽ֭/יהוָה כָּל הָ/אָ֑רֶץ פִּצְח֖וּ וְ/רַנְּנ֣וּ וְ/זַמֵּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: de
  text: Jauchzt Yahweh zu, ganze Erde! Brecht in Jubel aus, jubelt und macht Musik!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִיעוּ
  choice: Jubelt … zu
  rationale: Der Hifil-Imperativ von רוע bezeichnet hier einen lauten, freudigen Jubelruf. „Jubelt … zu“ ist im heutigen Deutsch natürlich und bewahrt den Aufforderungscharakter.
- source_word: לַיהוָה
  choice: Yahweh zu
  rationale: Die Präposition ל bezeichnet die Ausrichtung des Jubels; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: כָּל הָאָרֶץ
  choice: ihr Menschen auf der ganzen Erde
  rationale: Im universalen Horizont des Psalms ist ארץ global zu verstehen. Die Anrede mit „ihr Menschen“ macht im Deutschen deutlich, dass die Bewohner der Erde zum Lob aufgefordert werden, ohne den Umfang einzuschränken.
- source_word: פִּצְחוּ
  choice: brecht … aus
  rationale: פצח vermittelt das bildhafte plötzliche Ausbrechen in hörbaren Jubel oder Gesang; „brecht in Jubel aus“ gibt dies idiomatisch wieder.
- source_word: וְרַנְּנוּ
  choice: singt vor Freude
  rationale: Der Piel von רנן kann jubelndes Rufen oder Singen bezeichnen. „Singt vor Freude“ passt zum poetischen Zusammenhang und unterscheidet sich vom ersten Jubelruf.
- source_word: וְזַמֵּרוּ
  choice: macht Musik
  rationale: זמר bezeichnet im Lobkontext musikalisches Loben, häufig durch Gesang und möglicherweise mit Instrumenten. „Macht Musik“ hält diese Breite offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Yahweh“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. Die vier Imperative und die Steigerung vom Jubelruf über freudigen Gesang bis zum Musizieren bleiben erhalten.
