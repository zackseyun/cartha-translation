review_pass:
  verdict: revise
  source_fidelity: Die Anrede „ihr Menschen auf der ganzen Erde“ legt die Aufforderung auf menschliche Bewohner aus. Im Hebräischen ist jedoch „die ganze Erde“ selbst die umfassende poetische Anrede (כָּל־הָאָרֶץ); die Personifizierung sollte nicht durch eine zusätzliche Menschengruppe ersetzt werden. Die vier Imperative und ihre Abfolge sind sonst im Entwurf grundsätzlich erfasst.
  naturalness: „Jubelt Yahweh zu“ ist möglich; „Jauchzt Yahweh zu“ gibt den lauten Jubelruf von הָרִיעוּ prägnant und in würdigem modernen Psalmstil wieder. Die direkte Anrede „ganze Erde“ ist poetisch, aber im Kontext klar und natürlicher als die erklärende Hinzufügung „ihr Menschen“.
  terminology: „Yahweh“ entspricht der vorgegebenen Wiedergabe von יהוה. „Brecht in Jubel aus“ bildet פִּצְחוּ idiomatisch ab; „jubelt“ wahrt für וְרַנְּנוּ die mögliche Weite zwischen Jubelruf und freudigem Singen, und „macht Musik“ ist für וְזַמֵּרוּ ausreichend weit.
  issues:
  - severity: medium
    issue: „ihr Menschen auf der ganzen Erde“ ergänzt „Menschen“ und ersetzt die poetische Anrede der ganzen Erde.
    rationale: כָּל הָאָרֶץ bedeutet hier im universalen Lobaufruf „ganze Erde“. Zwar sind Menschen als tatsächliche Ausführende mitgemeint, doch der hebräische Text benennt sie nicht; die kosmisch-poetische Formulierung ist beizubehalten.
  revised_text: Jauchzt Yahweh zu, ganze Erde! Brecht in Jubel aus, jubelt und macht Musik!
