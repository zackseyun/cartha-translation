  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: de
  text: Mit Trompeten und dem Klang des Horns[a] jubelt vor dem König, Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Widderhorns“. Das hebräische שׁוֹפָר bezeichnet ein Horninstrument, häufig ein Widderhorn, das von den zuvor genannten Trompeten unterschieden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: Mit Trompeten
  rationale: חֲצֹצְרוֹת bezeichnet Trompeten, wahrscheinlich gerade Metallinstrumente, die vom שׁוֹפָר unterschieden sind. Die Präposition ב wird instrumental mit „mit“ wiedergegeben; „silbern“ wird nicht ergänzt, da es im Vers nicht ausdrücklich steht.
- source_word: וְקוֹל שׁוֹפָר
  choice: und dem Klang des Horns
  rationale: קוֹל bedeutet hier „Klang“ und שׁוֹפָר ein Blasinstrument aus Horn, häufig ein Widderhorn. „Horn“ bewahrt im Haupttext die Unterscheidung von den zuvor genannten Trompeten; die mögliche genauere Bezeichnung wird in der Fußnote genannt.
- source_word: הָרִיעוּ
  choice: jubelt
  rationale: Der Hifil-Imperativ Plural von רוע fordert zu einem lauten festlichen Zuruf oder Jubel auf. „Jubelt“ ist im Deutschen knapp, natürlich und im Zusammenhang des Psalms angemessen, ohne die Äußerung auf einen bloßen Instrumentenstoß zu verengen.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bezeichnet hier das Handeln vor beziehungsweise in der Gegenwart des Königs; „vor“ ist die direkte und idiomatische Wiedergabe.
- source_word: הַמֶּלֶךְ
  choice: dem König
  rationale: Der bestimmte Titel wird als „dem König“ wiedergegeben; der folgende Gottesname identifiziert, wer dieser König ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von „dem König“ und „Jahwe“
  choice: 'appositionell: „vor dem König, Jahwe“'
  alternative: „vor Jahwe, dem König“
  rationale: Die hebräische Wortfolge הַמֶּלֶךְ יְהוָה bezeichnet Jahwe als den König. Die gewählte Reihenfolge folgt dem Ausgangstext und bewahrt diese Identifikation, ohne daraus eine Anrede zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der kurze Imperativ erhält den festlichen, liturgischen Charakter des Verses. „Horn“ bleibt im Haupttext allgemein, während die Fußnote die mögliche genauere Instrumentenbezeichnung erläutert.
