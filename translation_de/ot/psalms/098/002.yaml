source:
  edition: WLC
  text: הוֹדִ֣יעַ יְ֭הוָה יְשׁוּעָת֑/וֹ לְ/עֵינֵ֥י הַ֝/גּוֹיִ֗ם גִּלָּ֥ה צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: de
  text: Jahwe hat sein Heil bekannt gemacht; vor den Augen der Völker[a] hat er seine Gerechtigkeit[b] offenbart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor den Augen der Nationen«; auch: »im Angesicht der Völker«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »seine Rechtserweisung«. Das hebräische Wort kann je nach Zusammenhang Gerechtigkeit, gerechtes Handeln oder Rechtserweisung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: הוֹדִיעַ
  choice: hat bekannt gemacht
  rationale: Die Hifil-Form von ידע bedeutet hier »bekannt machen«; die Wiedergabe ist im Deutschen natürlich und bewahrt den kausativen Sinn.
- source_word: יְשׁוּעָתוֹ
  choice: sein Heil
  rationale: יְשׁוּעָה kann Heil, Rettung oder Sieg bezeichnen. »Sein Heil« ist im poetischen Kontext prägnant und hält den umfassenden sowie den konkreten rettenden Sinn offen.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die bildhafte hebräische Wendung wird nahezu wörtlich und zugleich idiomatisch wiedergegeben.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: גּוֹיִם bezeichnet hier die Nationen beziehungsweise Völker außerhalb Israels; »Völker« ist im deutschen Psalmstil natürlich und vermeidet eine unnötige Verengung auf »Heiden«.
- source_word: גִּלָּה
  choice: hat offenbart
  rationale: Das Piel von גלה bezeichnet hier das Enthüllen oder Offenbaren und entspricht dem parallelen »bekannt gemacht«.
- source_word: צִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: צְדָקָה umfasst Gerechtigkeit, gerechtes Handeln und rettende Rechtserweisung. »Gerechtigkeit« bewahrt diese theologische Weite; eine mögliche Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Göttliche Gerechtigkeit im Zusammenhang mit dem Heil
  choice: seine Gerechtigkeit
  alternative: sein gerechtes Handeln; seine Rechtserweisung
  rationale: Das rettende Handeln Jahwes und seine צְדָקָה stehen parallel. »Gerechtigkeit« wahrt den moralischen, heilvollen und rechtsschaffenden Bedeutungsraum, ohne ihn auf strafende Justiz oder ausschließlich auf Rettung einzuengen.
translation_notes:
  register: Moderner, würdiger Psalmstil mit klarer Parallelstruktur. »Jahwe« bewahrt den Gottesnamen; »Heil« ist knapp und poetisch, ohne altertümlich zu wirken. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
