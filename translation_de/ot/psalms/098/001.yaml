id: PSA.98.1
reference: Psalms 98:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: de
  text: Ein Psalm. Singt Jahwe ein neues Lied, denn er hat Wunder getan! Seine rechte Hand und sein heiliger Arm haben ihm Rettung verschafft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben ihn gerettet“ beziehungsweise „haben ihm den Sieg errungen“. Der hebräische Ausdruck besagt, dass Jahwes eigene Macht Rettung oder Sieg bewirkt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Die Überschrift bezeichnet die Gattung; „Psalm“ ist im Deutschen der klare und eingebürgerte Ausdruck.
- source_word: שִׁירוּ לַיהוָה
  choice: Singt Jahwe
  rationale: Der Imperativ Plural wird direkt wiedergegeben; die Präposition ל bezeichnet hier den Adressaten des Liedes. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: Die geläufige poetische Wendung lässt sich formal und idiomatisch so wiedergeben.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: er hat Wunder getan
  rationale: „Wunder“ bezeichnet hier staunenerregende Machttaten; das Perfekt wird wegen der fortdauernden Bedeutung mit dem deutschen Perfekt wiedergegeben.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: haben ihm Rettung verschafft
  rationale: Die Form bedeutet wörtlich etwa „hat ihm Rettung bewirkt/verschafft“. Die Übersetzung bewahrt die ungewöhnliche Aussage, dass Jahwes eigene Macht für ihn Rettung beziehungsweise Sieg errungen hat, ohne sie auf nur eine mögliche Deutung zu verengen.
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: Seine rechte Hand und sein heiliger Arm
  rationale: Die anthropomorphen, parallelen Bilder für Jahwes eigene wirksame Macht werden wörtlich bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ gibt den Eigennamen erkennbar wieder und folgt der vorgegebenen Projektentscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Sinn von הוֹשִׁיעָה לּוֹ
  choice: haben ihm Rettung verschafft
  alternative: haben ihn gerettet; haben ihm den Sieg errungen
  rationale: Der hebräische Ausdruck ist ungewohnt und kann als Rettung oder im Kontext als Sieg verstanden werden. Die Hauptübersetzung bleibt näher an der lexikalischen Bedeutung und bewahrt die theologische Spannung, dass Gottes eigene Hand und sein Arm für ihn Rettung bewirken; die Alternativen werden in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Psalmsprache mit direktem Pluralimperativ. Die Bildsprache des Hebräischen bleibt erhalten; die ungewöhnliche Schlussaussage wird nicht vorschnell geglättet.
