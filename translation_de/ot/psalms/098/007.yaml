  language: en
  yaml_path: translation/ot/psalms/098/007.yaml
  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: de
  text: Das Meer soll brausen und alles, was in ihm ist, die Welt und alle, die in ihr wohnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: soll brausen
  rationale: Das Verb רעם bezeichnet ein lautes Dröhnen, Tosen oder Donnern. Im poetischen Lobaufruf gibt „soll brausen“ die auffordernde Bedeutung des Imperfekts natürlich wieder.
- source_word: הַיָּם
  choice: das Meer
  rationale: „Meer“ ist die übliche und im poetischen Zusammenhang angemessene Wiedergabe von יָם.
- source_word: וּמְלֹאוֹ
  choice: und alles, was es erfüllt
  rationale: מְלֹא mit Suffix bedeutet wörtlich „seine Fülle“. Die gewählte Formulierung bewahrt den Sinn und bezieht das Suffix klar auf das Meer.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל bezeichnet häufig die geordnete beziehungsweise bewohnte Welt. „Die Welt“ ist knapp und natürlich; der folgende Ausdruck hebt ihre Bewohner eigens hervor.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: und alle, die in ihr wohnen
  rationale: Die partizipiale Wendung bedeutet wörtlich „und die in ihr Wohnenden“. Diese Wiedergabe bewahrt den verbalen Charakter und klingt in modernem Deutsch natürlich.
