source:
  edition: WLC
  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: de
  text: Er hat an seine beständige Liebe und seine Treue zum Haus Israel gedacht; alle Enden der Erde haben die Rettung unseres Gottes gesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Befreiung unseres Gottes“; im Zusammenhang des Psalms kann das hebräische Wort auch Gottes siegreiches Rettungshandeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: hat … gedacht
  rationale: Das Qal-Perfekt bezeichnet Gottes vollzogene, wirksame Zuwendung. Die idiomatische Wendung „an … gedacht“ bewahrt den hebräischen Grundsinn, ohne bloßes Erinnern nach vorherigem Vergessen anzudeuten.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד bezeichnet hier Gottes verlässliche, dauerhaft loyale Liebe. „Beständige Liebe“ ist verständlich und bewahrt die bundesbezogene Färbung, ohne sie ausdrücklich in den Text einzutragen.
- source_word: וֶאֱמוּנָתוֹ
  choice: und seine Treue
  rationale: אֱמוּנָה bezeichnet in der Parallele zu חֶסֶד Gottes Verlässlichkeit und Treue.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: zum Haus Israel
  rationale: Die Präposition לְ lässt eine relationale beziehungsweise gerichtete Bedeutung zu. „Zum Haus Israel“ wahrt diese Offenheit und klingt im Deutschen natürlich.
- source_word: רָאוּ
  choice: haben … gesehen
  rationale: Das Qal-Perfekt wird mit dem deutschen Perfekt wiedergegeben und stellt die bereits geschehene Rettungstat als gegenwärtigen Grund des Lobes dar.
- source_word: כָל אַפְסֵי אָרֶץ
  choice: alle Enden der Erde
  rationale: Die feste poetische Wendung bezeichnet sämtliche fernsten Regionen der Welt; die traditionelle deutsche Form ist verständlich und bildkräftig.
- source_word: אֵת
  choice: '[Akkusativzeichen, nicht eigens wiedergegeben]'
  rationale: Das hebräische direkte Objekt wird durch den deutschen Akkusativ syntaktisch ausgedrückt.
- source_word: יְשׁוּעַת
  choice: die Rettung
  rationale: יְשׁוּעָה umfasst Rettung, Befreiung und im Psalm auch siegreiches Heilshandeln. „Rettung“ ist im heutigen Deutsch konkret und bewahrt die semantische Breite; die mögliche Siegesnuance wird in der Fußnote genannt.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Der deutsche Genitiv bildet die hebräische Status-constructus-Verbindung formal und natürlich ab, ohne die Beziehung unnötig auf Herkunft oder Urheberschaft festzulegen.
theological_decisions:
- issue: Bundesbezogene Nuance von חֶסֶד und אֱמוּנָה
  choice: „beständige Liebe“ und „Treue“
  alternative: „Gnade“ und „Wahrheit“ oder „Bundesliebe“ und „Treue“
  rationale: Das gewählte Wortpaar stellt Gottes verlässliche Zuwendung zu Israel heraus, ohne den möglichen Bundesbezug zu verbergen oder durch das ausdrücklichere „Bundesliebe“ stärker festzulegen, als es das Einzelwort verlangt.
- issue: Bedeutungsumfang von יְשׁוּעַת אֱלֹהֵינוּ
  choice: „die Rettung unseres Gottes“
  alternative: „das Heil unseres Gottes“, „die Befreiung unseres Gottes“ oder „den Sieg unseres Gottes“
  rationale: „Rettung“ wahrt den umfassenden Sinn göttlichen rettenden Handelns. Der Kontext kann einen siegreichen Unterton tragen, verlangt aber keine Verengung auf einen militärischen Sieg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzführung. „Haus Israel“ und „Enden der Erde“ bewahren die biblisch-poetischen Bilder; ungebräuchliche Archaismen werden vermieden. Der Fußnotenmarker steht unmittelbar nach der betroffenen Aussage.
