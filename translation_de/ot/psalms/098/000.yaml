base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: de
  text: 'Ein Psalm.


    Singt Jahwe ein neues Lied, denn er hat Wunderbares getan. Seine rechte Hand und sein heiliger Arm haben ihm Rettung verschafft.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »haben ihn gerettet« oder »haben ihm den Sieg verschafft«. Die hebräische Wendung besagt, dass Jahwes eigene Macht Rettung beziehungsweise Sieg für ihn bewirkt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Gibt die knappe Gattungsangabe der Überschrift direkt und im Deutschen idiomatisch wieder.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: Entspricht der geläufigen und zugleich genauen Wiedergabe der hebräischen Wortgruppe.
- source_word: נִפְלָאוֹת
  choice: Wunderbares
  rationale: Bewahrt den Sinn außergewöhnlicher, staunenswerter Taten, ohne ihn auf Wunder im engeren Sinn zu beschränken.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: haben ihm den Sieg errungen
  rationale: Die Wendung bezeichnet, dass Jahwes eigene Macht Rettung beziehungsweise Sieg für ihn bewirkt hat; die deutsche Formulierung klingt natürlich und erhält das rückbezügliche »ihm«.
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: seine rechte Hand und sein heiliger Arm
  rationale: Übernimmt die poetischen Bilder für Jahwes wirksame Macht eng am hebräischen Text.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname steht ausdrücklich im Ausgangstext; »Jahwe« gibt ihn transparent wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הוֹשִׁיעָה לּוֹ
  choice: ihm den Sieg errungen
  alternative: ihm Rettung verschafft / ihn gerettet
  rationale: Die hebräische Konstruktion lässt Rettung, Befreiung und siegreiches Eingreifen anklingen. Im Kontext von Gottes eigener rechter Hand bezeichnet »Sieg erringen« am natürlichsten den Erfolg seines machtvollen Handelns, während die Fußnote die semantische Breite offenhält.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Rhythmus. Der Ausruf nach dem Begründungssatz unterstreicht den hymnischen Ton, ohne dem Inhalt etwas hinzuzufügen. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Schlusswendung.
