lexical_decisions:
- source_word: נְהָרוֹת
  choice: die Flüsse
  rationale: Der Plural bezeichnet Flüsse und bewahrt das Bild der gesamten Schöpfung, die Gott lobt.
- source_word: יִמְחֲאוּ כָף
  choice: sollen in die Hände klatschen
  rationale: Die Verbindung bezeichnet das Händeklatschen. Der deutsche Plural „Hände“ ist idiomatisch; „sollen“ gibt im poetischen Zusammenhang den auffordernden Charakter wieder.
- source_word: יַחַד
  choice: miteinander
  rationale: Das Adverb bezeichnet gemeinsames, vereintes Handeln und bezieht sich hier auf den Jubel der Berge.
- source_word: הָרִים
  choice: die Berge
  rationale: Die direkte Wiedergabe erhält die Größe und Kraft der poetischen Schöpfungsbilder.
- source_word: יְרַנֵּנוּ
  choice: sollen … vor Freude singen
  rationale: Das Verb kann sowohl freudiges Singen als auch einen jubelnden Ruf ausdrücken. Die Hauptfassung ist natürlich und passt zum poetischen Parallelismus; die Bedeutungsbreite wird in der Fußnote bewahrt.
theological_decisions:
- issue: Poetische Personifikation der Schöpfung im Gotteslob
  choice: Die Flüsse klatschen in die Hände, und die Berge singen vor Freude.
  alternative: Das Bild abstrakt auf menschlichen Lobpreis angesichts der Schöpfung beziehen.
  rationale: Der hebräische Text stellt Flüsse und Berge unmittelbar als Teilnehmer am gemeinsamen Lob dar. Die direkte Wiedergabe bewahrt dieses poetische Bild, ohne es theologisch auszudeuten.
translation_notes:
