id: PSA.98.9
reference: Psalms 98:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: de
  text: vor Jahwe[a]; denn er kommt[b], um die Erde zu richten. Er wird den Erdkreis[c] in Gerechtigkeit[d] richten und die Völker, wie es recht ist[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „JHWH“, hier als „Jahwe“ wiedergegeben. Die traditionelle Wiedergabe lautet „der HERR“. „Vor Jahwe“ kann auch „in der Gegenwart Jahwes“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „denn er ist im Kommen“ oder „denn er wird gewiss kommen“. Die hebräische Form kann im poetischen Zusammenhang ein unmittelbar bevorstehendes oder als sicher dargestelltes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist die bewohnte Welt.
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „gerecht“ oder „nach dem Recht“.'
    reason: lexical_alternative
  - marker: e
    text: 'Wörtlicher: „in Geradheit“; sinngemäß auch „unparteiisch“ oder „mit Fairness“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: vor
  rationale: Die feste Verbindung mit פָּנִים bedeutet hier „vor“ beziehungsweise „in der Gegenwart von“. „Vor“ ist knapp, natürlich und bewahrt den räumlich-relationalen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי בָא
  choice: denn er kommt
  rationale: כִּי begründet den vorangehenden Jubel; בָא schildert Gottes Kommen poetisch als gegenwärtig, unmittelbar bevorstehend oder gewiss.
- source_word: לִשְׁפֹּט הָאָרֶץ
  choice: um die Erde zu richten
  rationale: שׁפט bezeichnet hier das richterliche Handeln Gottes; im Parallelismus mit Erdkreis und Völkern ist אֶרֶץ global als „Erde“ zu verstehen.
- source_word: תֵּבֵל
  choice: Erdkreis
  rationale: תֵּבֵל bezeichnet die bewohnte Welt. „Erdkreis“ ist im Deutschen verständlich, poetisch und unterscheidet den Ausdruck von „Erde“ im vorhergehenden Satzglied.
- source_word: בְּצֶדֶק
  choice: in Gerechtigkeit
  rationale: Die Präposition bezeichnet die Art und Weise des Richtens. „In Gerechtigkeit“ bewahrt das Substantiv צֶדֶק und seine moralisch-rechtliche Weite.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet verschiedene Menschengruppen beziehungsweise Völker und entspricht dem globalen Horizont des Verses.
- source_word: בְּמֵישָׁרִים
  choice: wie es recht ist
  rationale: מֵישָׁרִים bezeichnet Geradheit, Redlichkeit oder gerechtes, unparteiisches Handeln. Die idiomatische Wendung gibt den Sinn im richterlichen Zusammenhang wieder, ohne ihn auf bloße Gleichbehandlung zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. Die Transliteration wahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote kenntlich gemacht.
- issue: Bedeutungsweite des göttlichen Richtens שׁפט
  choice: richten
  alternative: herrschen oder Recht schaffen
  rationale: „Richten“ bewahrt die Spannung zwischen Beurteilung, Rechenschaft, Rechtsschaffung und gerechter Ordnung, ohne das Handeln einseitig auf Verurteilung oder Regierung festzulegen.
- issue: Zeitlicher Aspekt von בָא
  choice: er kommt
  alternative: er ist im Kommen / er wird kommen
  rationale: Die poetische Perfektform kann ein unmittelbar bevorstehendes oder als gewiss dargestelltes Handeln ausdrücken. Das Präsens hält diese zeitliche Offenheit am besten fest.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit klarer Syntax. „Erdkreis“ erhält den poetischen Parallelismus und unterscheidet תֵּבֵל von „Erde“, ohne altertümlich zu wirken. Der Vers beginnt bewusst kleingeschrieben, da er syntaktisch an den vorhergehenden Vers anschließt.
