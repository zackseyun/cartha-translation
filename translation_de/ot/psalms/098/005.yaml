base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/005.yaml
  text: Sing praises to Yahweh with the lyre[b][a], with the lyre and the sound of song.
translation:
  language: de
  text: Lobsingt Yahweh mit der Leier, mit der Leier und mit Gesangsklang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und mit dem Klang eines Liedes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Spielt
  rationale: Der Piel-Imperativ von זמר fordert hier zu musikalischem Lob auf. In Verbindung mit dem Instrument ist „spielt“ im Deutschen natürlich, ohne die musikalische Bedeutung auf Gesang zu verengen.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Die Präposition ל bezeichnet den Adressaten; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: בְּכִנּוֹר
  choice: auf der Leier
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument, am ehesten eine Leier. Das instrumentale ב lässt sich im Deutschen bei einem Instrument idiomatisch mit „auf“ wiedergeben.
- source_word: בְּכִנּוֹר
  choice: auf der Leier
  rationale: Die Wiederholung wird beibehalten, da sie den poetischen Parallelismus und die rhythmische Hervorhebung des Hebräischen trägt.
- source_word: וְקוֹל זִמְרָה
  choice: und zum Klang des Gesangs
  rationale: קוֹל bedeutet „Stimme/Klang“, זִמְרָה „Gesang/Lied/Melodie“. „Klang des Gesangs“ bewahrt das konkrete Hörbild; „zum“ verbindet die Wendung im Deutschen natürlich mit der Aufforderung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Yahweh“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „auf der Leier“ bleibt als poetisches Stilmittel erhalten; „Leier“ ist historisch genauer als das traditionelle „Harfe“.
