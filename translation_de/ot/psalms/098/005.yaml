    rationale: Sie ersetzt lediglich „Gesang“ durch „Melodie“, behält aber die im Haupttext problematische Konstruktion „zum Klang“ bei.
  revised_text: Lobsingt Yahweh mit der Leier, mit der Leier und mit Gesangsklang.[a]
