revisions:
- from: Spielt Yahweh auf der Leier, auf der Leier und zum Klang des Gesangs.[a]
  to: Lobsingt Yahweh mit der Leier, mit der Leier und mit Gesangsklang.[a]
  rationale: Die Revision beseitigt die Mehrdeutigkeit von „Spielt Yahweh“ und gibt den musikalischen Lobaufruf von זמר durch „Lobsingt“ wieder. Sie macht die instrumentale Funktion des wiederholten ב durchgehend mit „mit“ sichtbar, bewahrt die emphatische Wiederholung von „der Leier“ und hält die knappe, poetische Konstruktion von קוֹל זִמְרָה als „Gesangsklang“ aufrecht.
