id: PSA.63.11
reference: Psalms 63:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: de
  text: Doch der König wird sich über Gott freuen; jeder, der bei ihm schwört, wird sich rühmen[a], denn der Mund derer, die Lügen reden, wird verschlossen werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird frohlocken«. Das hebräische Verb kann ein ehrendes Sich-Rühmen oder triumphierendes Frohlocken bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »denn der Mund derer, die Falschheit reden, wird verschlossen werden«.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Doch der König
  rationale: Das וְ kann schlicht »und« bedeuten; im Zusammenhang hebt es jedoch den Gegensatz zum Schicksal der Gegner im vorherigen Vers hervor. »Doch« gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: wird sich über Gott freuen
  rationale: שׂמח mit ב bezeichnet hier den Gegenstand beziehungsweise Grund der Freude. »Sich über Gott freuen« ist gegenwärtiges, verständliches Deutsch und vermeidet das weniger natürliche »sich in Gott freuen«.
- source_word: יִתְהַלֵּל
  choice: wird sich rühmen
  rationale: Der Hitpael von הלל bezeichnet ein Sich-Rühmen oder Sich-Preisen. »Sich rühmen« bewahrt die aktive Bedeutung und den würdevollen Ton.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: jeder, der bei ihm schwört
  rationale: Die Konstruktion bezeichnet jeden, der die genannte Person im Eid anruft. »Bei ihm schwören« ist die übliche deutsche Wendung; das Pronomen bleibt wie im Hebräischen stehen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die vorherige Aussage ein.
- source_word: יִסָּכֵר פִּי
  choice: der Mund … wird verschlossen werden
  rationale: Das Nifal von סכר bedeutet »verschlossen werden«. Der Singular »Mund« bewahrt das hebräische Kollektivbild.
- source_word: דֹבְרֵי שָׁקֶר
  choice: derer, die Lügen reden
  rationale: Die partizipiale Form beschreibt Menschen durch ihr fortgesetztes Reden von Falschem. Die verbale Wendung ist genauer als die bloße Bezeichnung »Lügner«.
theological_decisions:
- issue: Identität des Königs
  choice: Die Bezeichnung »der König« bleibt ohne interpretierende Ergänzung stehen.
  alternative: David ausdrücklich nennen oder den König ausdrücklich messianisch deuten.
  rationale: Der Vers selbst nennt nur »den König«. Eine nähere Identifizierung würde über den Wortlaut hinausgehen.
- issue: Bezug des Pronomens in »bei ihm schwört«
  choice: Das Pronomen wird im Haupttext bewahrt und aufgrund des Zusammenhangs auf Gott bezogen.
  alternative: Das Pronomen auf den König beziehen.
  rationale: Gott ist der naheliegende Bezugsgegenstand, und das Schwören bei Gott ist eine geläufige biblische Ausdrucksweise. Da die pronominale Form des Hebräischen formal stehen bleibt, wird keine unnötige Namenswiederholung in den Text eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und das hebräische Bild vom verschlossenen Mund bleiben erhalten; die Satzstellung ist zugleich für heutige Leser gut verständlich.
