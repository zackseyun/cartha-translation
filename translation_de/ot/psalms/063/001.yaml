  variant: modern standard German
source:
  edition: WLC
  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: de
  text: Gott, du bist mein Gott; dich suche ich beim Morgengrauen.[a] Meine Seele dürstet nach dir, mein Fleisch sehnt sich nach dir[b] – in einem dürren und erschöpften Land ohne Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich suche ich früh“, „dich suche ich eifrig“ beziehungsweise sinngemäß „dich suche ich ernstlich“. Das hebräische Verb weckt wörtlich das Bild des Suchens bei Tagesanbruch.'
    reason: lexical_alternative
  - marker: b
    text: 'Die folgende Ortsangabe kann auch enger nur auf diesen Satzteil bezogen werden: „Mein Fleisch sehnt sich nach dir in einem dürren und erschöpften Land ohne Wasser.“'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים אֵלִי אַתָּה
  choice: Gott, du bist mein Gott
  rationale: Die direkte Anrede und die Betonung durch das selbstständige Pronomen werden in natürlichem Deutsch bewahrt. אֵלִי ist hier die Gottesbezeichnung „mein Gott“, nicht „mein mächtiger Gott“.
- source_word: אֲשַׁחֲרֶךָּ
  choice: dich suche ich beim Morgengrauen
  rationale: Das Piel von שׁחר ruft wörtlich das Suchen in der Frühe beziehungsweise bei Tagesanbruch auf. Die Übersetzung erhält dieses konkrete Zeitbild, ohne es vorschnell als bloße Eifrigkeit zu deuten.
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: Meine Seele dürstet nach dir
  rationale: נפשׁ bezeichnet hier im poetischen Gegenüber zu „Fleisch“ die innere beziehungsweise lebendige Person. „Seele“ bewahrt die Bildsprache, ohne eine starre anthropologische Zweiteilung festzulegen.
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: mein Fleisch sehnt sich nach dir
  rationale: כמה bezeichnet starkes Verlangen oder Schmachten. „Sehnt sich“ ist gegenwärtiges, würdiges Deutsch; „Fleisch“ erhält die körperliche Bildhälfte des hebräischen Parallelismus.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: in einem dürren und erschöpften Land
  rationale: צִיָּה bezeichnet Dürre, עָיֵף Erschöpfung oder Müdigkeit. Die ungewöhnliche Personifikation des Landes wird erhalten statt durch eine glattere Deutung wie „lechzend“ ersetzt zu werden.
- source_word: בְּלִי מָיִם
  choice: ohne Wasser
  rationale: Die knappe privative Wendung wird ebenso knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Anthropologische Sprache im Parallelismus נפשׁ / בשר
  choice: „meine Seele“ und „mein Fleisch“ als zwei poetische Perspektiven auf die ganze Person beibehalten
  alternative: „mein ganzes Wesen“ und „mein Körper“
  rationale: Die hebräische Dichtung stellt inneres und leibliches Verlangen nebeneinander. Die wörtlicheren Begriffe bewahren diese Spannung, ohne einen dogmatischen Leib-Seele-Dualismus zu behaupten.
- issue: Bezug der Ortsangabe „in einem dürren und erschöpften Land“
  choice: Durch Gedankenstrich als Rahmen für beide parallelen Aussagen über Durst und Sehnsucht kenntlich machen
  alternative: Die Ortsangabe ausschließlich mit „mein Fleisch sehnt sich nach dir“ verbinden
  rationale: Die hebräische Wortstellung lässt den unmittelbaren Anschluss an die zweite Aussage zu, doch die Ortsangabe kann zugleich die gesamte vorangehende Sehnsuchtsszene rahmen. Die Fußnote hält die engere syntaktische Zuordnung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter poetischer Körper- und Landschaftssprache. „Beim Morgengrauen“ ist anschaulich und allgemein verständlich; „Fleisch“ und die Personifikation des „erschöpften Landes“ bleiben wegen ihrer literarischen und theologischen Textur erhalten.
