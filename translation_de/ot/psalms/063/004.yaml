  text: כֵּ֣ן אֲבָרֶכְ/ךָ֣ בְ/חַיָּ֑/י בְּ֝/שִׁמְ/ךָ אֶשָּׂ֥א כַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: de
  text: So will ich dich mein Leben lang segnen[a]; in deinem Namen will ich meine Hände erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „preisen“. Wörtlicher heißt es im Hebräischen: „segnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Das adverbiale כֵּן knüpft folgernd an den vorausgehenden Gedanken an. „So“ bewahrt diesen Zusammenhang knapp und natürlich.
- source_word: אֲבָרֶכְךָ
  choice: will ich dich … segnen
  rationale: Das Piel von ברך bedeutet hier wörtlich „segnen“. Obwohl bei einer an Gott gerichteten Aussage auch „preisen“ idiomatisch möglich ist, bleibt „segnen“ näher am hebräischen Wortlaut und ist im Deutschen als Sprache der Anbetung verständlich.
- source_word: בְחַיָּי
  choice: mein Leben lang
  rationale: Wörtlich „in meinem Leben“; im Kontext bezeichnet die Wendung die gesamte Lebensdauer. „Mein Leben lang“ gibt diesen durativen Sinn idiomatisch wieder.
- source_word: בְּשִׁמְךָ
  choice: in deinem Namen
  rationale: Die Präposition ב kann hier Bereich, Grundlage oder Anrufung bezeichnen. „In deinem Namen“ ist natürlich und lässt diese Bedeutungsbreite weitgehend bestehen.
- source_word: אֶשָּׂא
  choice: will ich … erheben
  rationale: נשא bedeutet „heben, erheben, tragen“. Zusammen mit den Händen bezeichnet es die Gebärde des Gebets oder Lobpreises; „erheben“ ist präzise und würdig.
- source_word: כַפָּי
  choice: meine Hände
  rationale: כף kann genauer die Handfläche meinen, steht hier aber in der festen Gebärde des Erhebens der Hände. „Hände“ ist im Deutschen die natürliche Entsprechung.
theological_decisions:
- issue: An Gott gerichtetes ברך als Sprache der Anbetung
  choice: „segnen“ im Haupttext beibehalten
  alternative: „preisen“
  rationale: Der hebräische Text verwendet ausdrücklich ברך. „Preisen“ erklärt den gemeinten Vollzug leichter, würde die eigenständige Bild- und Beziehungssprache des Originals jedoch einebnen. Daher steht die wörtlichere Wiedergabe im Text und die idiomatische Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt den poetischen Parallelismus; „mein Leben lang“ vermeidet die unnatürliche wörtliche Form „in meinem Leben“.
