  text: דָּבְקָ֣ה נַפְשִׁ֣/י אַחֲרֶ֑י/ךָ בִּ֝֗/י תָּמְכָ֥ה יְמִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/008.yaml
  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: de
  text: Meine Seele hängt an dir[a]; deine rechte Hand stützt mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Seele folgt dir dicht nach.“ Das Hebräische verbindet „haften“ mit „nach/hinter dir“ und kann sowohl enge Verbundenheit als auch dichtes Nachfolgen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: hängt
  rationale: דבק bezeichnet festes Haften oder enge Verbundenheit. „hängt an“ ist im Deutschen natürlich, bewahrt die Intensität des Bildes und gibt das hebräische Perfekt als gegenwärtigen Zustand wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפשׁ kann Seele, Leben oder die ganze Person bezeichnen. „meine Seele“ erhält den poetischen und persönlichen Klang, ohne eine bestimmte anthropologische Lehre festzulegen.
- source_word: אַחֲרֶיךָ
  choice: an dir
  rationale: אַחֲרֵי bedeutet wörtlich „hinter/nach“. In Verbindung mit דבק beschreibt es hier ein enges Sich-Anschließen; idiomatisches Deutsch verlangt „an dir“. Die räumliche beziehungsweise nachfolgende Bildkomponente wird in der Fußnote kenntlich gemacht.
- source_word: בִּי
  choice: mich
  rationale: 'Die Präposition ב mit Suffix ergänzt hier das folgende תמך idiomatisch als persönliches Objekt: Gottes rechte Hand hält „mich“.'
- source_word: תָּמְכָה
  choice: hält … aufrecht
  rationale: תמך bedeutet stützen, halten oder aufrechterhalten. „hält mich aufrecht“ ist natürliches, bildkräftiges Deutsch und bewahrt den gegenwärtigen Zustandswert des Perfekts.
- source_word: יְמִינֶךָ
  choice: deine rechte Hand
  rationale: Die konkrete biblische Metapher wird wörtlich bewahrt und nicht zu „Kraft“ oder „Macht“ abstrahiert.
theological_decisions:
- issue: Anthropologische Bedeutungsbreite von נַפְשִׁי
  choice: meine Seele
  alternative: ich / mein Leben / mein ganzes Wesen
  rationale: „Meine Seele“ wahrt die poetische und geistliche Tiefe, ohne נפשׁ auf einen technischen Begriff eines vom Körper getrennten Seelenteils festzulegen.
- issue: Anthropomorphe Rede von Gottes rechter Hand
  choice: deine rechte Hand
  alternative: deine Kraft / deine Macht
  rationale: Das konkrete hebräische Bild bleibt stehen; seine Bedeutung wird nicht durch eine abstrakte Deutung ersetzt.
- issue: Verhältnis von Haften und Nachfolgen in דבק אחרי
  choice: hängt an dir
  alternative: folgt dir dicht / hält sich dicht hinter dir
  rationale: Die Hauptfassung gibt das enge Haften idiomatisch wieder. Die Fußnote bewahrt die echte Bildnuance von אַחֲרֵי („hinter/nach“), ohne sie im Haupttext überzubetonen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. „Meine Seele“ und „deine rechte Hand“ bewahren die konkrete poetische Bildwelt; „hängt an dir“ und „hält mich aufrecht“ sind gegenwärtiges, natürliches Standarddeutsch.
