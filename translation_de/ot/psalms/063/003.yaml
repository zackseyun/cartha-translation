  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: de
  text: Denn deine beständige Liebe ist besser als das Leben[a]; meine Lippen werden dich preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „treue Liebe“, „Güte“ oder „Bundesliebe“. Das hebräische Wort חֶסֶד bezeichnet verlässliche, beständige Liebe und Güte, oft im Rahmen einer Bundesbeziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet den Grund für das folgende Lob ein und bewahrt den kausalen Zusammenhang in natürlichem Deutsch.
- source_word: טוֹב ... מֵחַיִּים
  choice: ist besser als das Leben
  rationale: Mit der Vergleichspräposition מִן hat טוֹב hier komparative Bedeutung. Das morphologisch plurale חַיִּים bezeichnet idiomatisch das Leben.
- source_word: חַסְדְּךָ
  choice: deine beständige Liebe
  rationale: חֶסֶד verbindet Liebe und Güte mit Verlässlichkeit und Treue. „Beständige Liebe“ ist gegenwärtig, verständlich und lässt den möglichen Bundesbezug offen.
- source_word: שְׂפָתַי
  choice: meine Lippen
  rationale: Bewahrt das konkrete poetische Körperbild des Hebräischen.
- source_word: יְשַׁבְּחוּנְךָ
  choice: werden dich preisen
  rationale: Gibt das Piel von שׁבח klar und natürlich wieder und wahrt die zukunftsgerichtete Aussage.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Lobpreis
  choice: beständige Liebe
  alternative: Güte; treue Liebe; Bundesliebe
  rationale: Die Formulierung bewahrt Zuneigung, Verlässlichkeit und Treue, ohne den Ausdruck auf einen ausdrücklich genannten Bund einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das konkrete Bild der Lippen bleiben erhalten; das Semikolon bildet den engen Zusammenhang zwischen Begründung und Lob ab.
