translation:
  language: de
  text: Doch sie, die mein Leben zu vernichten suchen, werden in die Tiefen der Erde gelangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in die unteren Bereiche der Erde«; möglicherweise ist damit der Bereich der Toten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Doch sie
  rationale: Das betonte Pronomen und die Konjunktion markieren hier den Gegensatz zur Zuversicht des Psalmisten im vorhergehenden Vers.
- source_word: לְשׁוֹאָה
  choice: um mich ins Verderben zu stürzen
  rationale: שׁוֹאָה bezeichnet Verderben, Verwüstung oder Untergang. Die finale Wiedergabe macht die feindliche Absicht idiomatisch deutlich, ohne die Art des Verderbens näher festzulegen.
- source_word: יְבַקְשׁוּ נַפְשִׁי
  choice: die mir nach dem Leben trachten
  rationale: נֶפֶשׁ meint hier das Leben des Psalmisten. Die deutsche Wendung bezeichnet verständlich eine tödliche Verfolgung.
- source_word: יָבֹאוּ
  choice: werden … hinabfahren
  rationale: Das Verb bedeutet formal „kommen/gelangen“. In Verbindung mit den Tiefen der Erde gibt „hinabfahren“ die gerichtete Bewegung im Deutschen natürlich und bildhaft wieder.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: in die Tiefen der Erde
  rationale: Die Formulierung bewahrt das räumliche Bild der unteren beziehungsweise tiefen Bereiche der Erde, ohne es ausdrücklich als Unterwelt oder Scheol auszudeuten.
theological_decisions:
- issue: Bedeutung des Hinabfahrens in die Tiefen der Erde
  choice: Das poetische Bild bleibt als Abstieg in Tod, Grab oder Gericht offen.
  alternative: Ausdrückliche Deutung als Unterwelt beziehungsweise Scheol oder rein räumlich als die untersten Bereiche der Erde.
  rationale: Der hebräische Ausdruck kann den Bereich der Toten oder bildhaft tiefsten Untergang bezeichnen. Eine technisch-dogmatische Festlegung würde die genuine Mehrdeutigkeit einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nach dem Leben trachten“ ist eine geläufige Wendung für tödliche Verfolgung; „hinabfahren“ erhält das poetische Abstiegsbild. Der Fußnotenmarker steht unmittelbar nach dem zugehörigen Satz.
