  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: de
  text: Meine Seele wird satt wie von Fett und reichhaltiger Speise[a], und mit jubelnden Lippen[b] lobt dich mein Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie von Fett und Fettigkeit/Üppigkeit“; die Wendung bezeichnet bildhaft reiche, erlesene Nahrung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Lippen des Jubels“; möglich sind auch Jubelrufe oder Freudengesang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: wie von
  rationale: Leitet den Vergleich ein und verbindet sich im Deutschen idiomatisch mit der Vorstellung, von reichhaltiger Speise satt zu werden.
- source_word: חֵלֶב וָדֶשֶׁן
  choice: Fett und Fülle
  rationale: „Fett“ bewahrt das konkrete Bild erlesener, reichhaltiger Speise; „Fülle“ gibt den überlappenden Sinn von Üppigkeit und Wohlstand wieder, ohne die Doppelung „Fett und Fettigkeit“.
- source_word: תִּשְׂבַּע
  choice: wird … satt
  rationale: Der hebräische Imperfekt lässt hier sowohl gegenwärtig-habituelle als auch zukünftige Auffassung zu. Das deutsche Präsens „wird satt“ kann einen gegenwärtigen Vorgang ausdrücken und wahrt zugleich eine gewisse Offenheit.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Bewahrt im poetischen Kontext die innere und personale Bedeutung von נֶפֶשׁ, ohne sie auf bloßes körperliches Sattwerden zu reduzieren.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: mit jubelnden Lippen
  rationale: Gibt die wörtliche Vorstellung von „Lippen des Jubels“ natürlich und bildhaft wieder; der mögliche Akzent auf Jubelrufen oder Freudengesang wird in einer Fußnote erläutert.
- source_word: יְהַלֶּל
  choice: lobt dich
  rationale: Das direkte Objekt fehlt im Hebräischen, ist jedoch aus der unmittelbaren Anrede Gottes klar erschließbar. „dich“ macht den deutschen Satz vollständig.
- source_word: פִּי
  choice: mein Mund
  rationale: Erhält das konkrete Körperbild und den poetischen Parallelismus mit den Lippen.
theological_decisions:
- issue: Unausgesprochenes Objekt des Lobens
  choice: „dich“ wird als aus dem Kontext erschlossenes Objekt ergänzt
  alternative: „mein Mund lobt“ ohne ausdrücklich genanntes Objekt
  rationale: Der Psalm richtet sich direkt an Gott. Die Ergänzung macht den deutschen Satz idiomatisch, ohne einen neuen theologischen Gedanken einzuführen.
- issue: Zeitbezug der poetischen Imperfektformen
  choice: 'Gegenwartsnahe Wiedergabe: „wird … satt“ und „lobt“'
  alternative: 'Zukunft: „wird … satt werden“ und „wird … loben“'
  rationale: Die hebräischen Formen können in der Poesie gegenwärtige, wiederholte oder zukünftige Vorgänge bezeichnen. Der Kontext erlaubt eine gegenwärtige Erfahrung; die Fußnote bewahrt die mögliche Zukunftslesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Körper- und Speisebildlichkeit. „Fett“ ist hier positiv im alttestamentlichen Sinn als Bild für erlesene, reichhaltige Nahrung gebraucht. Die Marker stehen jeweils bei der Textstelle, auf die sich die Anmerkung bezieht.
