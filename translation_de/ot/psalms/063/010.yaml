  text: יַגִּירֻ֥/הוּ עַל יְדֵי חָ֑רֶב מְנָ֖ת שֻׁעָלִ֣ים יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/010.yaml
  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: de
  text: Sie werden in die Gewalt des Schwertes preisgegeben[a]; sie werden den Füchsen[b] zum Anteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: „Sie werden ihn in die Gewalt des Schwertes ausgießen.“ Im ersten Satzteil steht ein männliches Singularobjekt („ihn“), während der zweite Satzteil mit „sie“ im Plural fortfährt.'
    reason: textual_grammatical_ambiguity
  - marker: b
    text: 'Oder: „Schakalen“. Das hebräische Wort kann Füchse bezeichnen; in einem Zusammenhang von Tod und Verwüstung wird es teils als Bezeichnung für Schakale verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: sie werden … preisgegeben
  rationale: Die Hifil-Form von נגר mit dem Suffix der 3. Person Singular bezeichnet wörtlich ein Ausgießen beziehungsweise Wegfließenlassen. Im Zusammenhang gewaltsamen Todes gibt die passive Wendung „preisgegeben“ den Sinn natürlich wieder und verhindert, dass die im nächsten Satzteil genannten „sie“ fälschlich als Täter verstanden werden. Die auffällige Singular-Plural-Spannung des Hebräischen wird in einer Fußnote erhalten.
- source_word: עַל יְדֵי חָרֶב
  choice: der Gewalt des Schwertes
  rationale: Die Verbindung bezeichnet die Wirkmacht beziehungsweise Vermittlung des Schwertes. „Der Gewalt des Schwertes“ ist im Deutschen idiomatisch und bewahrt das Bild.
- source_word: מְנָת
  choice: zum Anteil
  rationale: מְנָת bezeichnet einen zugewiesenen Anteil oder Teil. „Zum Anteil“ erhält das poetische Bild, ohne es durch „zum Fraß“ erklärend einzuengen.
- source_word: שֻׁעָלִים
  choice: Füchsen
  rationale: שׁוּעָלִים bezeichnet gewöhnlich Füchse, kann hier jedoch nach manchen Auffassungen Schakale oder allgemeiner wild lebende Hundeartige meinen; diese Alternative wird in einer Fußnote genannt.
- source_word: יִהְיוּ
  choice: sie werden … zum Anteil
  rationale: היה kann „sein“ oder „werden“ bedeuten. Hier bezeichnet es den eintretenden Zustand nach dem Tod; die deutsche Konstruktion „zum Anteil werden“ gibt dies knapp wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. „Preisgegeben“ vermittelt die gewaltsame Auslieferung natürlich; „zum Anteil“ bewahrt die knappe Bildsprache des Hebräischen. Beide Fußnotenmarker stehen unmittelbar bei den betreffenden Wendungen.
