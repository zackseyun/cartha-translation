  text: מִזְמ֥וֹר לְ/דָוִ֑ד בִּ֝/הְיוֹת֗/וֹ בְּ/מִדְבַּ֥ר יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/000.yaml
  text: A psalm of David[a], when he was in the wilderness[b] of Judah.
translation:
  language: de
  text: Ein Psalm Davids[a], als er in der Wildnis Juda[b] war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von David« oder »für David«. Die hebräische Überschrift kann Urheberschaft, Widmung oder Zugehörigkeit bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Wüste«. Das hebräische Wort kann allgemein Wildnis-, Steppen- oder Wüstenland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Der Gattungsbegriff der Überschrift wird traditionell und sachgerecht mit »Psalm« wiedergegeben.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv bewahrt ähnlich wie das hebräische לְ die mögliche Bedeutung von Urheberschaft, Zugehörigkeit oder Zuordnung, ohne sie auf »von David verfasst« festzulegen.
- source_word: בִּהְיוֹתוֹ
  choice: als er … war
  rationale: Die Verbindung aus בְּ und dem Infinitiv von היה mit Suffix bildet einen temporalen Nebensatz; »als er … war« ist natürliches Deutsch.
- source_word: בְּמִדְבַּר
  choice: in der Wildnis
  rationale: מִדְבָּר kann Wildnis, Steppe oder Wüste bezeichnen. »Wildnis« wahrt den breiteren Geländebegriff; »Wüste« bleibt als Alternative in der Fußnote erhalten.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der etablierte deutsche Name des Gebiets beziehungsweise Stammes wird verwendet.
theological_decisions:
- issue: Bedeutung der davidischen Psalmüberschrift
  choice: »Davids« als mehrdeutige Zuordnung
  alternative: »von David« oder »für David«
  rationale: Die hebräische Präposition kann in Psalmüberschriften Urheberschaft, Besitz, Widmung oder allgemeine Zuordnung ausdrücken. Der Genitiv legt keine dieser Möglichkeiten ausdrücklich fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe Form einer Psalmüberschrift bleibt erhalten; die Wiederholung von »war« ist im Deutschen vermieden, ohne den zeitlichen Sinn zu verändern.
