  text: כִּֽי הָיִ֣יתָ עֶזְרָ֣תָ/ה לִּ֑/י וּ/בְ/צֵ֖ל כְּנָפֶ֣י/ךָ אֲרַנֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: de
  text: Denn du bist mir eine Hilfe gewesen, und im Schatten deiner Flügel juble ich[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lasse ich Jubel erschallen“. Das hebräische Verb kann sowohl freudiges Singen als auch einen lauten Jubelruf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Reaktion des Beters im Zusammenhang ein und bewahrt den kausalen Anschluss natürlich.
- source_word: הָיִיתָ
  choice: du bist … gewesen
  rationale: Das Qatal bezeichnet Gottes bereits erwiesene Hilfe mit fortdauernder Bedeutung; das Perfekt gibt dies im modernen Deutschen angemessen wieder.
- source_word: עֶזְרָתָה לִּי
  choice: du bist mir eine Hilfe gewesen
  rationale: Gibt die Verbindung aus Hilfsnomen und לִי unmittelbar wieder, ohne die Aussage unnötig zu verdichten.
- source_word: וּבְצֵל
  choice: und im Schatten
  rationale: Bewahrt das konkrete poetische Schutzbild; בְּ wird idiomatisch mit „im“ wiedergegeben.
- source_word: כְּנָפֶיךָ
  choice: deiner Flügel
  rationale: Erhält die vertraute Metapher der schützenden Flügel Gottes in klarer, würdiger Sprache.
- source_word: אֲרַנֵּן
  choice: juble ich
  rationale: Das Piel von רנן bezeichnet einen hellen, freudigen Laut und kann sowohl Jubelruf als auch Jubelgesang meinen. „jubeln“ bewahrt diese Mehrdeutigkeit besser als eine Festlegung auf Singen oder Rufen.
theological_decisions:
- issue: Metapher des göttlichen Schutzes
  choice: „im Schatten deiner Flügel“ wörtlich beibehalten
  alternative: 'Deutend: „unter deinem Schutz“'
  rationale: Das konkrete Bild trägt die poetische und theologische Aussage des Verses. Eine Auflösung in einen abstrakten Schutzbegriff würde das Bild verengen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, poetischem Klang. Die Satzstellung hält den kausalen Zusammenhang und parallelisiert Gottes erwiesene Hilfe mit dem gegenwärtigen Jubel. Die Formulierung „eine Hilfe“ bleibt quellennah; „mein Helfer“ wäre idiomatischer, würde aber das Nomen anders personalisieren.
