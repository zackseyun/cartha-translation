  yaml_path: translation/ot/psalms/063/006.yaml
  text: When I remember you on my bed, I meditate on you in the night watches.
translation:
  language: de
  text: Wenn ich mich auf meinem Lager an dich erinnere, sinne ich in den Nachtwachen über dich nach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die konditionale Form des Hebräischen bleibt gewahrt; im poetischen Zusammenhang kann sie zugleich wiederholtes nächtliches Erinnern ausdrücken.
- source_word: יְצוּעָי
  choice: meinem Lager
  rationale: „Lager“ gibt die Schlafstätte würdevoll und näher am hebräischen Ausdruck wieder als das alltäglichere „Bett“.
- source_word: בְּאַשְׁמֻרוֹת
  choice: in den Nachtwachen
  rationale: Der Ausdruck bezeichnet die Abschnitte, in die die Nacht als Wachzeiten gegliedert war, und bewahrt das Bild nächtlichen Wachseins.
- source_word: אֶהְגֶּה
  choice: sinne … nach
  rationale: Das Verb bezeichnet ein inneres Bewegen oder meditatives Nachdenken; „nachsinnen“ ist im Deutschen natürlich und dem Kontext angemessen.
theological_decisions:
- issue: Beziehung zwischen Erinnern und Nachsinnen
  choice: Die beiden parallelen Aussagen werden ohne zusätzliche kausale Verknüpfung wiedergegeben.
  alternative: „… dann sinne ich …“
  rationale: Der hebräische Text setzt die Aussagen poetisch nebeneinander; ein ausdrücklich eingefügtes „dann“ würde die logische Beziehung stärker festlegen als der Ausgangstext.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die Formulierung bleibt verständlich, ohne das poetische Bild der Nachtwachen zu verflachen.
