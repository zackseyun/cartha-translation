  yaml_path: translation/ot/psalms/063/002.yaml
  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: de
  text: So habe ich dich im Heiligtum geschaut, um deine Macht und deine Herrlichkeit zu sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So habe ich dich an heiliger Stätte geschaut, um deine Macht und deine Herrlichkeit zu sehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Das adverbiale כֵּן verbindet die gegenwärtige Sehnsucht des Psalmisten mit seiner Erfahrung im Heiligtum, ohne die genaue logische Beziehung stärker festzulegen.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: קֹדֶשׁ bezeichnet mit der Präposition בְּ in diesem gottesdienstlichen Zusammenhang am ehesten den heiligen Ort beziehungsweise das Heiligtum.
- source_word: חֲזִיתִיךָ
  choice: habe ich dich … geschaut
  rationale: חזה bezeichnet ein wahrnehmendes oder betrachtendes Sehen. „Geschaut“ bewahrt die poetische und kontemplative Färbung und bleibt im Deutschen verständlich.
- source_word: לִרְאוֹת
  choice: um … zu sehen
  rationale: Der Infinitiv mit לְ kann hier den Zweck des Schauens ausdrücken; die Wiedergabe lässt zugleich die enge Verbindung zwischen dem Schauen Gottes und dem Sehen seiner Macht und Herrlichkeit bestehen.
- source_word: עֻזְּךָ
  choice: deine Macht
  rationale: עֹז kann Stärke, Macht oder Kraft bedeuten. „Macht“ bezeichnet hier klar Gottes wirksame Stärke und verbindet sich natürlich mit „Herrlichkeit“.
- source_word: וּכְבוֹדֶךָ
  choice: und deine Herrlichkeit
  rationale: כָּבוֹד bezeichnet bei Gott seine gewichtige, offenbar werdende Majestät; „Herrlichkeit“ ist dafür die treffende und geläufige deutsche Entsprechung.
theological_decisions:
- issue: Art des Schauens Gottes im Heiligtum
  choice: Die direkte Aussage „dich … geschaut“ bleibt erhalten, ohne die Art dieser Gotteswahrnehmung näher zu bestimmen.
  alternative: Die Formulierung ausdrücklich als bloße Erinnerung an gottesdienstliche Wahrnehmung oder als mystische Vision erklären.
  rationale: Der hebräische Text spricht unmittelbar vom Schauen Gottes und vom Sehen seiner Macht und Herrlichkeit. Die Übersetzung bewahrt diese poetisch-theologische Spannung, ohne eine unvermittelte Schau des göttlichen Wesens zu behaupten oder auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischem Klang. „Geschaut“ gibt die kontemplative Nuance von חזה wieder; die Alternative in der Fußnote bewahrt die mögliche allgemeinere Bedeutung von בַּקֹּדֶשׁ als „an heiliger Stätte“.
