  terminology: „König“ mit Kleinschreibung ist quellentreu und vermeidet interpretative Kapitalisierung. „eingesetzt“ ist modernes, angemessen würdiges Standarddeutsch und gibt den Einsetzungs-/Inthronisierungssinn ohne eine rituale Salbung zu behaupten wieder. „heiliger Berg“ ist die direkte und natürliche Wiedergabe von הַר קָדְשִׁי.
