  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: de
  text: Ich aber habe meinen König auf Zion, meinem heiligen Berg, eingesetzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe meinen König auf Zion gesetzt“; manche verstehen das Verb im Sinn von: „Ich habe meinen König gesalbt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Verbindung aus Konjunktion und selbstständigem Pronomen setzt Gottes Handeln betont dem Aufbegehren der Völker und Herrscher entgegen. „Ich aber“ gibt Kontrast und Nachdruck natürlich wieder.
- source_word: נָסַכְתִּי
  choice: habe … eingesetzt
  rationale: Im Zusammenhang bezeichnet das Verb wahrscheinlich die Einsetzung eines Königs. „Eingesetzt“ vermittelt die königliche Bestimmung, ohne den Begriff auf eine rituelle Salbung festzulegen.
- source_word: מַלְכִּי
  choice: meinen König
  rationale: Das Substantiv mit Suffix der ersten Person Singular bedeutet „meinen König“. Die Kleinschreibung vermeidet eine zusätzliche, im hebräischen Schriftbild nicht markierte Deutung.
- source_word: עַל
  choice: auf
  rationale: Mit dem Ortsnamen bezeichnet die Präposition hier am natürlichsten den Ort der Einsetzung und nicht den Herrschaftsbereich.
- source_word: צִיּוֹן
  choice: Zion
  rationale: „Zion“ ist die übliche deutsche Wiedergabe des Ortsnamens.
- source_word: הַר קָדְשִׁי
  choice: meinem heiligen Berg
  rationale: 'Die Wendung wird idiomatisch als „mein heiliger Berg“ wiedergegeben. Durch die Apposition nach „Zion“ steht sie im Deutschen im Dativ: „meinem heiligen Berg“.'
theological_decisions:
- issue: Ob נָסַכְתִּי eine rituelle Salbung oder die königliche Einsetzung bezeichnet
  choice: königliche Einsetzung („habe … eingesetzt“)
  alternative: „habe … gesalbt“ oder „habe … hingestellt“
  rationale: Der unmittelbare Zusammenhang stellt Gottes König den rebellierenden irdischen Königen gegenüber. „Eingesetzt“ wahrt den Gedanken königlicher Ernennung beziehungsweise Inthronisierung, ohne das Verb mit dem sonst üblichen hebräischen Wort für „salben“ gleichzusetzen. Eine weiterführende messianische Lesart wird dadurch weder erzwungen noch ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstellung erhält den göttlichen Nachdruck. „Berg“ gibt הַר direkter wieder als das traditionell mögliche „Hügel“.
