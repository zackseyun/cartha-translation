  source_fidelity: 'Der Entwurf gibt die Abfolge und beide Verben des Hebräischen zuverlässig wieder: אָז als „Dann“, יְדַבֵּר als folgende göttliche Rede, אֵלֵימוֹ als „zu ihnen“ sowie יְבַהֲלֵמוֹ als kausatives „sie ... erschrecken“. Die doppelte Zornsformulierung (אַף / חָרוֹן) und die Steigerung im zweiten Halbvers bleiben erhalten.'
