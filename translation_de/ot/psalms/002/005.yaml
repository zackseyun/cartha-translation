  text: אָ֤ז יְדַבֵּ֣ר אֵלֵ֣י/מוֹ בְ/אַפּ֑/וֹ וּֽ/בַ/חֲרוֹנ֥/וֹ יְבַהֲלֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: de
  text: Dann wird er in seinem Zorn zu ihnen reden und sie in seinem glühenden Grimm erschrecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Temporaladverb führt Gottes nun folgende Reaktion ein und wahrt knapp den Fortgang des Psalms.
- source_word: יְדַבֵּר
  choice: wird er … reden
  rationale: Das Piel-Imperfekt bezeichnet hier die auf das Aufbegehren folgende Handlung; die Zukunftsform passt zum Kontext.
- source_word: אֵלֵימוֹ
  choice: zu ihnen
  rationale: Die Präposition mit Suffix verweist auf die zuvor genannten Könige und Herrscher.
- source_word: בְאַפּוֹ
  choice: in seinem Zorn
  rationale: אַף bezeichnet wörtlich die Nase, idiomatisch jedoch den Zorn; die deutsche Wendung gibt den Sinn natürlich wieder.
- source_word: וּבַחֲרוֹנוֹ
  choice: in seinem glühenden Grimm
  rationale: חָרוֹן trägt das Bild aufflammender Hitze und steigert den zuvor genannten Zorn. „Glühender Grimm“ bewahrt Bildkraft und Intensität.
- source_word: יְבַהֲלֵמוֹ
  choice: sie … erschrecken
  rationale: Das Piel von בהל bezeichnet das Versetzen in plötzlichen Schrecken oder Bestürzung. „Erschrecken“ ist kräftig, natürlich und lässt sowohl Furcht als auch Bestürzung anklingen.
theological_decisions:
- issue: Anthropopathische Rede von Gottes Zorn
  choice: Die ausdrückliche Rede von Gottes Zorn und glühendem Grimm bleibt ungemildert erhalten.
  alternative: Die Aussage als bloßes Missfallen oder abstraktes Gericht wiederzugeben.
  rationale: Der hebräische Text schildert Gottes persönliche, nachdrückliche Antwort auf die Rebellion. Die Übersetzung wahrt dieses theologische Gewicht, ohne die Bildsprache weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur der beiden Halbverse und die Steigerung von „Zorn“ zu „glühendem Grimm“ werden gewahrt; die Wortstellung bleibt gut verständlich und zugleich psalmistisch geprägt.
