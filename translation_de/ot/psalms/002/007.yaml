  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲסַפְּרָ֗ה אֶֽ֫ל חֹ֥ק יְֽהוָ֗ה אָמַ֘ר אֵלַ֥/י בְּנִ֥/י אַ֑תָּה אֲ֝נִ֗י הַ/יּ֥וֹם יְלִדְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: de
  text: 'Ich will den Beschluss verkünden: Jahwe sagte zu mir: »Du bist mein Sohn[a]; heute habe ich dich gezeugt[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage gilt im unmittelbaren Zusammenhang dem von Gott eingesetzten König und erhält in der späteren biblischen Verwendung messianische Bedeutung.
    reason: contextual_ambiguity
  - marker: b
    text: 'Auch möglich: „Heute bin ich dein Vater geworden.“ Der hebräische Wortlaut verwendet wörtlich Zeugungssprache und kann im Zusammenhang der Königseinsetzung eine königliche Vater-Sohn-Beziehung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Ich will … verkünden
  rationale: Die Form leitet eine feierliche Bekanntmachung ein. „Verkünden“ entspricht dem königlichen, öffentlichen Ton besser als das neutralere „erzählen“.
- source_word: אֶל חֹק
  choice: den Beschluss
  rationale: חֹק bezeichnet hier im Zusammenhang der Königseinsetzung eine verbindliche Festsetzung bzw. einen Erlass. Die Verbindung mit ספר wird im Deutschen natürlich als „den Beschluss verkünden“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlichen Umschrift.
- source_word: אָמַר אֵלַי
  choice: sagte zu mir
  rationale: Das Subjekt ist Jahwe aus dem unmittelbar vorausgehenden Satzglied. Die direkte Wiederaufnahme ergibt im Deutschen eine klare, natürliche Einleitung der Gottesrede.
- source_word: בְּנִי אַתָּה
  choice: Du bist mein Sohn
  rationale: Die Voranstellung des Prädikats in der deutschen Aussage entspricht dem natürlichen Sprachgebrauch und bewahrt die Aussage königlicher Sohnschaft. Da deutsche Substantive immer großgeschrieben werden, lässt sich eine christologische Großschreibung nicht eigens markieren.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die geläufige moderne Entsprechung bewahrt die zeitliche Hervorhebung des hebräischen Textes.
- source_word: יְלִדְתִּיךָ
  choice: habe ich dich gezeugt
  rationale: Das Verb ילד verwendet hier Zeugungs- bzw. Geburtssprache. „Gezeugt“ gibt diese Bildwelt genauer wieder als eine deutende Umschreibung wie „bin ich dein Vater geworden“.
theological_decisions:
- issue: Königliche und messianische Sohnschaft
  choice: „Du bist mein Sohn“ ohne zusätzliche dogmatische Präzisierung
  alternative: Die Aussage ausschließlich auf den historischen davidischen König oder ausschließlich auf den Messias beziehen
  rationale: Im unmittelbaren Zusammenhang spricht der eingesetzte König; in der späteren kanonischen Rezeption wird der Vers messianisch verstanden. Die Übersetzung bewahrt die Formulierung, sodass beide Kontexte erkennbar bleiben, ohne die Aussage einseitig festzulegen.
- issue: Bedeutung von „heute habe ich dich gezeugt“
  choice: Die Zeugungssprache wörtlich bewahren
  alternative: „Heute bin ich dein Vater geworden“
  rationale: Der hebräische Wortlaut kann im Kontext der Königseinsetzung Aufnahme-, Einsetzungs- oder Vater-Sohn-Bildsprache anklingen lassen, legt diese aber nicht ausdrücklich aus. Die Hauptfassung bewahrt deshalb die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Verkündigungscharakter. Die Syntax bleibt knapp und mündlich verständlich. Der Gottesname erscheint als „Jahwe“; altertümliche Formen wie „kundtun“ oder „an diesem Tage“ werden vermieden.
