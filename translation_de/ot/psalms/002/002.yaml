id: PSA.2.2
reference: Psalms 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: de
  text: Die Könige der Erde stellen sich auf, und die Herrscher verbünden sich gegen Jahwe und gegen seinen Gesalbten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Messias“. Das hebräische Wort bedeutet wörtlich „seinen Gesalbten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: stellen sich auf
  rationale: Der Hitpael von יצב bezeichnet ein bewusstes Positionieren; im feindlichen Zusammenhang gibt „stellen sich auf“ die gezielte oppositionelle Haltung natürlich wieder.
- source_word: מַלְכֵי אֶרֶץ
  choice: die Könige der Erde
  rationale: Die Konstruktverbindung hat hier einen universalen politischen Bezug; „Erde“ ist daher gegenüber „Land“ vorzuziehen.
- source_word: רוֹזְנִים
  choice: die Herrscher
  rationale: Das Wort bezeichnet hochrangige politische Machthaber; „Herrscher“ ist gegenwärtig, verständlich und hinreichend weit.
- source_word: נוֹסְדוּ יָחַד
  choice: verbünden sich
  rationale: Die Wendung beschreibt ein abgestimmtes gemeinsames Vorgehen. „Verbünden sich“ bringt die vereinte oppositionelle Handlung knapp zum Ausdruck, ohne ausdrücklich eine geheime Verschwörung zu behaupten.
- source_word: עַל
  choice: gegen
  rationale: Im feindlichen Kontext bezeichnet die Präposition die Ausrichtung des Widerstands.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מְשִׁיחוֹ
  choice: seinen Gesalbten
  rationale: Die Wiedergabe bewahrt die Grundbedeutung „sein Gesalbter“ und lässt sowohl den unmittelbaren königlichen Bezug als auch die weiterführende messianische Bedeutung offen.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחוֹ im königlichen und messianisch rezipierten Psalm 2
  choice: seinen Gesalbten
  alternative: seinen Messias
  rationale: „Gesalbten“ entspricht dem hebräischen Ausdruck unmittelbar und legt den Vers nicht ausschließlich auf die spätere titularische Verwendung „Messias“ fest. So bleiben der historische Bezug auf den davidischen König und die messianische Tragweite erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt klar erkennbar; die koordinierte Gegnerschaft wird natürlich ausgedrückt, ohne die mögliche Nuance einer Beratung oder Verschwörung unnötig zu verstärken.
