  text: יוֹשֵׁ֣ב בַּ/שָּׁמַ֣יִם יִשְׂחָ֑ק אֲ֝דֹנָ֗/י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: de
  text: Der im Himmel thront, lacht; der Herr verspottet sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der im Himmel sitzt, lacht; der Herr spottet über sie.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: der … thront
  rationale: Das Partizip bedeutet wörtlich „sitzend“ beziehungsweise „der sitzt“. Im königlichen Zusammenhang des Psalms gibt „thront“ die naheliegende Herrschaftsnuance natürlich und knapp wieder.
- source_word: בַּשָּׁמַיִם
  choice: im Himmel
  rationale: Das morphologisch plurale שָׁמַיִם bezeichnet im Deutschen idiomatisch den Himmel als Gottes Bereich. „In den Himmeln“ wäre formnäher, klingt im modernen Standarddeutsch hier jedoch weniger natürlich.
- source_word: יִשְׂחָק
  choice: lacht
  rationale: Das Yiqtol kann in dieser poetischen Aussage präsentisch wiedergegeben werden. „Lacht“ bewahrt das anschauliche Bild; sein spöttischer Zug wird durch den Parallelismus verdeutlicht.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Hier steht der göttliche Titel אֲדֹנָי und nicht der Gottesname JHWH. „Der Herr“ ist dafür die geläufige, würdevolle deutsche Wiedergabe.
- source_word: יִלְעַג
  choice: verspottet
  rationale: לעג bezeichnet Spott oder Hohn. „Verspottet“ ist klar, gegenwärtig und gibt den transitiven Bezug auf die Aufständischen gut wieder.
- source_word: לָמוֹ
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannten aufständischen Völker und Herrscher. Bei „verspotten“ steht es im Deutschen natürlich als direktes Objekt.
theological_decisions:
- issue: Königliche und anthropomorphe Darstellung Gottes
  choice: Die königliche Nuance wird mit „thront“ ausgedrückt; „lacht“ und „verspottet“ bleiben als anschauliche Aussagen stehen.
  alternative: „Der im Himmel sitzt, lacht; der Herr spottet über sie.“
  rationale: Der Zusammenhang stellt die souveräne Überlegenheit Gottes gegenüber rebellierenden Herrschern dar. Die Übersetzung bewahrt sowohl das Herrschaftsbild als auch die bewusst anthropomorphe, spannungsvolle Sprache, ohne sie abstrakt umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Kürze. Die Einzahl „Himmel“ entspricht dem üblichen deutschen Sprachgebrauch, während „thront“ die im Kontext erkennbare königliche Bildsprache aufnimmt.
