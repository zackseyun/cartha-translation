base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/003.yaml
  text: Let us tear off their chains and cast their ropes from us[a][b][c].
translation:
  language: de
  text: »Lasst uns ihre Fesseln[a] zerreißen und ihre Stricke[b] von uns werfen!«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Bande«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihre Seile«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְנַתְּקָה
  choice: Lasst uns … zerreißen
  rationale: Der Kohortativ der ersten Person Plural drückt gemeinsamen Entschluss beziehungsweise Aufforderung aus. »Zerreißen« gibt das gewaltsame Lösen der Fesseln anschaulich und idiomatisch wieder.
- source_word: מוֹסְרוֹתֵימוֹ
  choice: ihre Fesseln
  rationale: Das Substantiv bezeichnet bindende Vorrichtungen oder Bande. »Fesseln« bewahrt das konkrete Bild der auferlegten Einschränkung, ohne das Material unnötig auf metallene Ketten festzulegen.
- source_word: וְנַשְׁלִיכָה
  choice: und … werfen
  rationale: Auch hier steht ein Kohortativ der ersten Person Plural. Zusammen mit מִמֶּנּוּ bezeichnet das Verb das entschlossene Wegschleudern beziehungsweise Entfernen.
- source_word: מִמֶּנּוּ
  choice: von uns
  rationale: Die Präposition mit dem Suffix der ersten Person Plural bezeichnet die Entfernung weg von den Sprechern und bewahrt ihre Perspektive.
- source_word: עֲבֹתֵימוֹ
  choice: ihre Stricke
  rationale: Das Wort bezeichnet starke Schnüre, Seile oder Stricke. »Stricke« ist im Deutschen konkret, poetisch tragfähig und bildet eine passende Parallele zu »Fesseln«.
theological_decisions:
- issue: Bild göttlicher beziehungsweise königlicher Bindung
  choice: Die Einschränkung wird konkret als »Fesseln« und »Stricke« wiedergegeben, ohne sie in der Übersetzung ausdrücklich als Unterdrückung oder als legitime Herrschaft zu deuten.
  alternative: Abstraktere Wiedergabe mit »Banden« und »Bindungen« oder interpretierende Benennung als »Joch« beziehungsweise »Unterdrückung«.
  rationale: Im Zusammenhang lehnen die Völker den HERRN und seinen Gesalbten ab; der Vers selbst gibt jedoch ihre metaphorische Rede wieder. Die konkrete Bildsprache erhält die theologische Spannung, ohne die Bewertung der Sprecher in den Wortlaut einzutragen.
translation_notes:
  register: Moderne, würdige und unmittelbar verständliche poetische Rede. Die zweimalige Aufforderungsform »Lasst uns« wird im Deutschen beim zweiten Verb nicht wiederholt, bleibt syntaktisch aber wirksam. Die Anführungszeichen kennzeichnen die in Psalm 2,3 fortgesetzte Rede der Könige und Herrscher.
