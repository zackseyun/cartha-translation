source:
  edition: WLC
  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: de
  text: Du wirst sie mit einem eisernen Zepter[b] zerbrechen[a]; wie ein Töpfergefäß wirst du sie zerschmettern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer anderen Textüberlieferung, die sich in einigen alten Übersetzungen und in der Offenbarung widerspiegelt: „Du wirst sie mit einem eisernen Zepter weiden“ oder „Du wirst sie mit einem eisernen Zepter regieren.“'
    reason: alternative_reading
  - marker: b
    text: „Zepter“ kann auch mit „Stab“ oder „Rute“ wiedergegeben werden; das hebräische Wort kann ein Zeichen der Herrschaft oder ein Werkzeug der Züchtigung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: du wirst sie … zerbrechen
  rationale: Die masoretische Punktierung und der Parallelismus mit תְּנַפְּצֵם sprechen hier für zerstörerisches Zerbrechen. Die in alten Überlieferungen bezeugte Deutung als „weiden“ oder „regieren“ bleibt in Fußnote [a] erhalten.
- source_word: בְּשֵׁבֶט
  choice: mit einem … Zepter
  rationale: שֵׁבֶט kann Stab, Rute oder Zepter bedeuten. Im königlichen Zusammenhang von Psalm 2 bringt „Zepter“ die Herrschaftsgewalt am besten zum Ausdruck, ohne den Gerichtscharakter auszublenden.
- source_word: בַּרְזֶל
  choice: eisernen
  rationale: Die Materialangabe „Eisen“ betont Stärke und unerbittliche Gewalt.
- source_word: כִּכְלִי יוֹצֵר
  choice: wie das Gefäß eines Töpfers
  rationale: כְּלִי bezeichnet allgemein ein Gefäß oder einen Gegenstand; zusammen mit יוֹצֵר ist ein vom Töpfer gefertigtes Tongefäß gemeint. Die Formulierung bleibt nah am Hebräischen und ist im Deutschen natürlich.
- source_word: תְּנַפְּצֵם
  choice: du wirst sie zerschmettern
  rationale: Das Verb bezeichnet gewaltsames Zerschlagen. „Zerschmettern“ gibt die Intensität wieder und passt zur Vorstellung eines zerbrechenden Töpfergefäßes.
theological_decisions:
- issue: Bezeichnet das erste Verb königliches Regieren oder zerstörerisches Gericht?
  choice: 'Zerstörerisches Gericht: „du wirst sie … zerbrechen“'
  alternative: 'Königliches Weiden oder Regieren: „du wirst sie … weiden/regieren“'
  rationale: Die masoretische Vokalisierung und der synonyme Parallelismus mit „zerschmettern“ stützen die Gerichtsaussage. Da einige alte Übersetzungen und die Aufnahme in der Offenbarung die andere Lesart widerspiegeln, wird diese nicht beseitigt, sondern in Fußnote [a] dokumentiert.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer, kraftvoller Gerichtssprache. Die Stellung der Fußnotenmarker ordnet [b] dem Substantiv „Zepter“ und [a] dem Verb „zerbrechen“ eindeutig zu.
