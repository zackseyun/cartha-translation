source:
  edition: WLC
  text: לָ֭/מָּה רָגְשׁ֣וּ גוֹיִ֑ם וּ֝/לְאֻמִּ֗ים יֶהְגּוּ רִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/001.yaml
  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: de
  text: Warum sind die Völker in Aufruhr, und warum sinnen die Nationen auf Nichtiges[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „murmeln Nichtiges“, „denken über Leeres nach“ oder dem Sinn nach: „schmieden vergebliche Pläne“. Das hebräische Verb kann Murmeln, Nachsinnen oder Planen bezeichnen; das Substantiv meint Leeres, Nichtiges oder Vergebliches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Das gewöhnliche deutsche Fragewort gibt die rhetorische Frage klar und natürlich wieder; das einmalige hebräische Fragewort gilt sinngemäß für beide parallelen Satzglieder.
- source_word: רָגְשׁוּ
  choice: sind ... in Aufruhr
  rationale: Das Verb bezeichnet unruhige, lärmende Erregung einer Menge. „In Aufruhr sein“ bewahrt diesen Grundsinn, ohne die kontextuell mögliche Bedeutung „sich zusammenrotten“ zur alleinigen Deutung zu machen.
- source_word: גוֹיִם
  choice: die Völker
  rationale: Gemeint sind politische beziehungsweise ethnische Völker; „Heiden“ würde einen späteren religiösen Gegensatz eintragen.
- source_word: לְאֻמִּים
  choice: die Nationen
  rationale: Die Wiedergabe erhält die poetische Parallelität mit גוֹיִם und unterscheidet zugleich die beiden nahezu synonymen Begriffe.
- source_word: יֶהְגּוּ
  choice: sinnen ... auf
  rationale: Das Verb kann leises Murmeln, Nachsinnen oder planendes Überlegen bezeichnen. „Auf etwas sinnen“ ist im Deutschen würdevoll und lässt die Spannung zwischen innerem Erwägen und feindlichem Planen bestehen.
- source_word: רִיק
  choice: Nichtiges
  rationale: Das Substantiv bezeichnet Leeres, Nichtiges oder Vergebliches und steht als Gegenstand des Sinnens; „Nichtiges“ erhält diese substantivische Form besser als das adverbiale „vergeblich“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität bleibt durch „Völker“ und „Nationen“ erhalten; die lexikalische Mehrdeutigkeit der zweiten Vershälfte wird im Haupttext nicht auf eine ausschließlich politische Verschwörung verengt und in der Fußnote erläutert.
