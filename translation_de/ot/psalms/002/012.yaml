source:
  edition: WLC
  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: de
  text: Küsst den Sohn[a], damit er nicht zornig wird und ihr auf dem Weg umkommt; denn sein Zorn entbrennt schnell[b]. Glücklich sind alle, die bei ihm Zuflucht suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erweist dem Sohn eure Huldigung.“ Das Verb bedeutet wörtlich „küssen“ und kann im königlichen Zusammenhang eine Geste der Unterwerfung oder Huldigung bezeichnen. Das hier verwendete aramäische Wort bar ist ungewöhnlich; meist wird es als „Sohn“ verstanden, passend zu Vers 7. Vorgeschlagen wurden jedoch auch Deutungen wie „Reinheit“ oder „rein“.'
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: 'Oder: „denn schon bald entbrennt sein Zorn“ beziehungsweise „denn sein Zorn ist nur ein wenig entbrannt“. Die knappe hebräische Wendung kann Plötzlichkeit, eine kurze Zeitspanne oder ein geringes Maß hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: Küsst
  rationale: Der Imperativ von נשׁק bedeutet wörtlich „küssen“. Im königlichen Zusammenhang kann der Kuss Unterwerfung oder Huldigung ausdrücken; das konkrete Bild bleibt im Haupttext erhalten.
- source_word: בַר
  choice: den Sohn
  rationale: בַר ist an dieser Stelle ungewöhnlich und umstritten. „Sohn“ passt jedoch zum königlichen Zusammenhang und zu Vers 7; andere Deutungen werden in der Fußnote genannt.
- source_word: פֶּן יֶאֱנַף
  choice: damit er nicht zornig wird
  rationale: פֶּן leitet nach dem Imperativ eine abgewendete Folge ein; אנף bezeichnet das Zornigwerden. Die Formulierung ist in modernem Deutsch klar und bewahrt den persönlichen Bezug.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: und ihr auf dem Weg umkommt
  rationale: אבד bezeichnet hier das Umkommen. Das präpositionslose דֶרֶךְ ist poetisch verdichtet; „auf dem Weg“ gibt den wahrscheinlichen Sinn wieder, ohne die Art des Untergangs näher festzulegen.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: denn sein Zorn entbrennt schnell
  rationale: בער bewahrt das Bild des Entbrennens; כמעט kann Kürze, geringe Zeitspanne oder Plötzlichkeit bezeichnen. „schnell“ vermittelt die drohende Unmittelbarkeit, während die Mehrdeutigkeit in der Fußnote erläutert wird.
- source_word: אַשְׁרֵי
  choice: Glücklich sind
  rationale: אַשְׁרֵי ist eine Glückpreisungsformel. „Glücklich sind“ ist natürliches, verständliches modernes Deutsch und bezeichnet den begünstigten Zustand, nicht bloß ein momentanes Gefühl.
- source_word: כָּל חֹסֵי בוֹ
  choice: alle, die bei ihm Zuflucht suchen
  rationale: חסה bezeichnet das Suchen von Schutz und Zuflucht. „bei ihm Zuflucht suchen“ erhält dieses Schutzbild und den männlichen Singularbezug.
theological_decisions:
- issue: Deutung von בַר in Psalm 2,12
  choice: „den Sohn“ als königlich-filialer Bezug in Verbindung mit Psalm 2,7
  alternative: Deutungen als „Reinheit“, „rein“ oder als ungelöste textliche beziehungsweise sprachliche Schwierigkeit
  rationale: Der unmittelbare literarische Zusammenhang begünstigt einen königlichen Sohn-Bezug. Die Übersetzung legt damit keine weitergehende konfessionelle Christologie in den Vers hinein; konkurrierende sprachliche Deutungen bleiben in der Fußnote sichtbar.
- issue: Bezug der Pronomen in Warnung und Zufluchtsaussage
  choice: Die maskulinen Singularformen werden durchgehend mit „er/sein/ihm“ wiedergegeben, ohne den Referenten zusätzlich zu benennen.
  alternative: Die Pronomen ausdrücklich auf den Sohn oder auf Gott beziehen
  rationale: Der hebräische Text lässt den genauen Bezug im Zusammenhang erschließen. Eine ausdrückliche Benennung würde eine vorhandene Spannung stärker auflösen als der Ausgangstext.
translation_notes:
  register: Moderne, würdige Psalmsprache mit konkretem Bild („Küsst“) und verständlicher Warnformulierung. „Glücklich sind“ gibt die hebräische Glückpreisung natürlich wieder. Die ungewöhnliche Lesart בַר und die Mehrdeutigkeit von כִּמְעַט werden nicht im Haupttext überladen, sondern transparent in den Fußnoten bewahrt.
