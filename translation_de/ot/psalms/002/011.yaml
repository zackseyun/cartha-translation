  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: de
  text: Dient Jahwe mit Furcht[a] und jubelt[b] mit Zittern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Ehrfurcht“; das hebräische Wort kann sowohl Furcht als auch ehrfürchtige Scheu vor Gott bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jauchzt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Dient
  rationale: Der pluralische Imperativ von עבד bezeichnet hier den Dienst in treuer Unterordnung gegenüber Jahwe. „Dient“ bewahrt die umfassende Bedeutung und verengt sie nicht auf kultische Anbetung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: בְּיִרְאָה
  choice: mit Furcht
  rationale: יִרְאָה kann Furcht, Ehrfurcht oder Scheu bezeichnen. „Mit Furcht“ gibt die starke Sprache unmittelbar wieder und lässt die ehrfürchtige Bedeutung offen.
- source_word: וְגִילוּ
  choice: und jubelt
  rationale: גיל bezeichnet freudiges Jauchzen oder Jubeln. „Jubelt“ bewahrt die kräftige emotionale Aussage und bildet einen deutlichen Kontrast zu „mit Zittern“.
- source_word: בִּרְעָדָה
  choice: mit Zittern
  rationale: רְעָדָה bezeichnet Zittern oder Beben, besonders angesichts von Furcht oder überwältigender Ehrfurcht. „Mit Zittern“ ist direkt und natürlich.
theological_decisions:
- issue: Verbindung von freudigem Jubel und furchtsamer Unterordnung
  choice: 'Beide Aufforderungen bleiben in ihrer Spannung stehen: „Dient Jahwe mit Furcht und jubelt mit Zittern.“'
  alternative: Die Spannung durch „Dient Jahwe in Ehrfurcht und freut euch in heiliger Scheu“ abschwächen.
  rationale: Der hebräische Text stellt Furcht und Jubel sowie Freude und Zittern bewusst nebeneinander, ohne den Gegensatz aufzulösen. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die paradoxe Verbindung von Jubel und Zittern bleiben erhalten.
