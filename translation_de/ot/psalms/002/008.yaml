id: PSA.2.8
reference: Psalms 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׁאַ֤ל מִמֶּ֗/נִּי וְ/אֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑/ךָ וַ֝/אֲחֻזָּתְ/ךָ֗ אַפְסֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: de
  text: Bitte mich, dann gebe ich dir die Völker zum Erbe und die Enden der Erde zum Besitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die fernsten Bereiche der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל
  choice: Bitte
  rationale: Der Imperativ fordert den angesprochenen König unmittelbar auf, eine Bitte zu äußern; „Bitte mich“ ist im modernen Deutschen natürlich und bewahrt den gehobenen Ton.
- source_word: מִמֶּנִּי
  choice: mich
  rationale: Nach שאל bezeichnet מן mit Suffix die Person, an die sich die Bitte richtet. Im Deutschen wird dies idiomatisch durch den Akkusativ nach „bitten“ wiedergegeben.
- source_word: וְאֶתְּנָה
  choice: dann gebe ich
  rationale: Die Kohortativform nach dem Imperativ drückt hier die zugesagte Reaktion aus. „Dann gebe ich“ macht den Zusammenhang im Deutschen klar, ohne die Verheißung abzuschwächen.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: גוים bezeichnet hier Völker beziehungsweise Nationen. „Die Völker“ wahrt den weltweiten Horizont und trägt keinen späteren Gegensatz von Juden und Nichtjuden ein.
- source_word: נַחֲלָתֶךָ
  choice: dir … zum Erbe
  rationale: נחלה bezeichnet ein zugeteiltes oder ererbtes Gut. Die deutsche Fügung „jemandem etwas zum Erbe geben“ gibt die prädikative Beziehung prägnant wieder.
- source_word: וַאֲחֻזָּתְךָ
  choice: zum Besitz
  rationale: אֲחֻזָּה meint Besitz oder Eigentum. „Zum Besitz“ erhält den Parallelismus zu „zum Erbe“, ohne beide Begriffe gleichzusetzen.
- source_word: אַפְסֵי אָרֶץ
  choice: die Enden der Erde
  rationale: Die Wendung bezeichnet die äußersten oder fernsten Bereiche der Erde. „Die Enden der Erde“ ist genau, verständlich und traditionssprachlich vertraut.
theological_decisions:
- issue: Königliche beziehungsweise messianische Tragweite der Verheißung
  choice: Der Vers wird als unmittelbare göttliche Zusage an den angesprochenen König beziehungsweise Sohn übersetzt, ohne ihn im Wortlaut ausdrücklich messianisch zu kennzeichnen.
  alternative: Eine ausdrücklich auf den Messias oder Christus bezogene Paraphrase.
  rationale: Der hebräische Vers verheißt dem Angesprochenen weltweite Herrschaft, legt aber innerhalb dieses Satzes die spätere kanonische Identifikation nicht ausdrücklich fest. Die Übersetzung lässt diese theologische Offenheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Bitte mich“ ist idiomatischer als das steife „Fordere von mir“. Der Fußnotenmarker steht nach der gesamten Wendung, auf die sich die Alternative bezieht.
