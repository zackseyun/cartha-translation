  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: de
  text: Und nun, ihr Könige, handelt einsichtig; lasst euch zurechtweisen[a], ihr Richter der Erde!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst euch warnen“, „nehmt Unterweisung an“. Das hebräische Verb kann Zurechtweisung, Unterweisung oder warnende Ermahnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Darum
  rationale: Die Verbindung leitet aus dem zuvor Gesagten eine folgernde Ermahnung ab. „Darum“ gibt diese argumentative Funktion im Deutschen natürlich wieder; der zeitliche Anklang von עַתָּה tritt dabei zurück.
- source_word: מְלָכִים
  choice: ihr Könige
  rationale: Der hebräische Plural steht als direkte Anrede. „Ihr Könige“ kennzeichnet den Vokativ in modernem, würdigem Deutsch ohne das altertümliche „o“.
- source_word: הַשְׂכִּילוּ
  choice: handelt einsichtig
  rationale: Der Hifil-Imperativ von שכל fordert zu verständigem, klugem Verhalten auf. „Handelt einsichtig“ bewahrt sowohl Erkenntnis als auch deren praktische Umsetzung.
- source_word: הִוָּסְרוּ
  choice: lasst euch zurechtweisen
  rationale: Der Nifal-Imperativ von יסר bezeichnet das Annehmen von Unterweisung, Zucht oder Korrektur. Die reflexiv-passive Formulierung bildet die Verbform ab, ohne sie auf eine bloße Warnung einzuengen.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: ihr Richter der Erde
  rationale: שֹׁפְטֵי bezeichnet richtende Amtsträger; angesichts des weltweiten Horizonts von Psalm 2 ist „Erde“ gegenüber „Land“ vorzuziehen.
