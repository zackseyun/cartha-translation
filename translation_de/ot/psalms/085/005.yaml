id: PSA.85.5
reference: Psalms 85:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/לְ/עוֹלָ֥ם תֶּֽאֱנַף בָּ֑/נוּ תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: de
  text: Willst du für immer auf uns zornig sein? Willst du deinen Zorn von Generation zu Generation hinziehen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deinen Zorn ziehen« oder »langziehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: für immer
  rationale: Die Fragepartikel הַ zusammen mit לְעוֹלָם ergibt eine rhetorische Frage nach unbegrenzter Dauer; »für immer« ist im modernen Deutschen natürlich und prägnant.
- source_word: תֶּאֱנַף
  choice: willst du … zornig sein
  rationale: Das Verb אנף bezeichnet Zornigsein. Die Wiedergabe bewahrt die direkte Rede von Gottes Zorn, ohne dessen Stärke zu überzeichnen oder abzuschwächen.
- source_word: בָּנוּ
  choice: auf uns
  rationale: Die Präposition בְּ bei אנף bezeichnet die Personen, denen der Zorn gilt. Im Deutschen ist »auf jemanden zornig sein« die natürliche idiomatische Verbindung.
- source_word: תִּמְשֹׁךְ
  choice: willst du … hinziehen
  rationale: משך bedeutet wörtlich »ziehen, langziehen« und bezeichnet hier das zeitliche Fortdauern des Zorns. »Hinziehen« erhält das Bild des Hebräischen und bleibt verständlich.
- source_word: אַפְּךָ
  choice: deinen Zorn
  rationale: אַף bedeutet wörtlich »Nase« und idiomatisch »Zorn«. Im Kontext ist die übertragene Bedeutung eindeutig; »Zorn« gibt sie direkt und würdig wieder.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die hebräische Wendung bezeichnet eine Fortdauer über aufeinanderfolgende Generationen hinweg. Die gewählte deutsche Form ist geläufig und bewahrt diese zeitliche Staffelung.
theological_decisions:
- issue: Anthropopathische Rede von Gottes Zorn
  choice: Die Rede von Gottes Zorn wird ausdrücklich beibehalten.
  alternative: »Willst du für immer über uns ungehalten sein?« oder eine Umschreibung als bloßer Widerstand.
  rationale: Der hebräische Text spricht ausdrücklich von Zorn und lässt die Spannung der Klage bestehen. Eine Abschwächung zu bloßem Missfallen würde diese theologische und emotionale Aussage glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen rhetorischen Fragen bleiben erhalten. »Hinziehen« bewahrt in der zweiten Zeile bewusst das konkrete Bild des hebräischen Verbs; die Fußnote erläutert die wörtliche Ausdrucksweise.
