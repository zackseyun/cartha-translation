lexical_decisions:
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד bezeichnet häufig loyale, verlässliche und besonders im Bundeszusammenhang erwiesene Liebe. „Beständige Liebe“ ist modern und verständlich, ohne die Bedeutung auf bloßes Erbarmen oder einen ausdrücklich technischen Bundesbegriff einzuengen.
- source_word: אֱמֶת
  choice: Treue
  rationale: אֱמֶת kann Wahrheit, Treue oder Verlässlichkeit bedeuten. In der Verbindung mit חֶסֶד ist „Treue“ idiomatisch und bewahrt den relationalen Klang; „Wahrheit“ bleibt als echte Alternative in einer Fußnote erhalten.
- source_word: נִפְגָּשׁוּ
  choice: begegnen einander
  rationale: Der Nifal Perfekt Plural von פגש bezeichnet ein Zusammentreffen. Das deutsche Präsens eignet sich für die anschauliche poetische Aussage; „einander“ verdeutlicht natürlich die wechselseitige Begegnung der personifizierten Größen.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: צֶדֶק umfasst sowohl Richtigkeit beziehungsweise Rechtschaffenheit als auch Gerechtigkeit. „Gerechtigkeit“ ist im Deutschen die natürliche Bezeichnung für die personifizierte moralische Größe; „Rechtschaffenheit“ wird als mögliche Alternative vermerkt.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם kann Frieden, Wohlergehen und Ganzheit bezeichnen. „Frieden“ ist hier die geläufigste Wiedergabe und lässt im poetischen Zusammenhang die umfassendere hebräische Bedeutung mitschwingen.
- source_word: נָשָׁקוּ
  choice: küssen sich
  rationale: Der Qal Perfekt Plural von נשק bedeutet „küssen“. Die wörtliche, wechselseitige Formulierung bewahrt die starke Personifikation und vermeidet eine abschwächende Deutung wie „vereinen sich“.
theological_decisions:
- issue: Personifikation relationaler und moralischer Größen
  choice: Die poetische Personifikation wird mit „begegnen einander“ und „küssen sich“ unmittelbar bewahrt.
  alternative: Deutende Umschreibung wie „kommen harmonisch zusammen“ oder „werden versöhnt“.
  rationale: Der hebräische Text lässt die Eigenschaften als handelnde Größen auftreten. Die bildhafte Sprache bewahrt die theologische Spannung der Wiederherstellung, ohne eine bestimmte dogmatische Synthese in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Die personifizierenden Verben bleiben konkret; die beiden Halbverse sind rhythmisch knapp und verständlich formuliert.
