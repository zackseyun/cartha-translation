  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: de
  text: Beständige Liebe und Treue begegnen einander[a]; Gerechtigkeit[b] und Frieden küssen sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
