base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: de
  text: Stelle uns wieder her[a], Gott unseres Heils, und lass deinen Zorn von uns weichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Führe uns zurück.“ Das hebräische Verb kann wörtlicher bedeuten: „Bewirke, dass wir zurückkehren.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: Stell uns wieder her
  rationale: Der Hifil-Imperativ von שוב mit Suffix der 1. Person Plural bedeutet wörtlich, dass Gott sein Volk zurückkehren lässt. Im Zusammenhang mit erneuter Gunst nach dem Zorn gibt „stell uns wieder her“ den Sinn natürlich wieder, ohne die mögliche Bedeutung „führ uns zurück“ auszuschließen.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Gott unseres Heils
  rationale: Die Genitivverbindung wird nah am Hebräischen bewahrt. „Heil“ umfasst Rettung und Wiederherstellung und entspricht dem würdevollen Sprachregister der Psalmen.
- source_word: וְהָפֵר
  choice: lass … aufhören
  rationale: Der Hifil-Imperativ von פרר kann „aufheben“, „zunichtemachen“ oder „beenden“ bedeuten. In Verbindung mit Gottes Zorn bezeichnet er die Bitte, diesen aufhören zu lassen.
- source_word: כַּעַסְךָ
  choice: deinen Zorn
  rationale: כעס bezeichnet hier Gottes Zorn beziehungsweise Unwillen. „Zorn“ ist im Deutschen klar, natürlich und dem poetisch-theologischen Kontext angemessen.
- source_word: עִמָּנוּ
  choice: gegen uns
  rationale: עם bedeutet gewöhnlich „mit“. Nach der Bitte, den Zorn zu beenden, gibt „gegen uns“ die relationale Bedeutung im Deutschen idiomatisch wieder, während die wörtlichere Form in der Fußnote dokumentiert wird.
theological_decisions:
- issue: Ob die erste Bitte als innere Umkehr oder als Wiederherstellung des Volkes zu verstehen ist
  choice: Stell uns wieder her
  alternative: Führe uns zurück
  rationale: Der Kontext des Psalms spricht von erneuter göttlicher Gunst nach dem Zorn. „Stell uns wieder her“ erfasst diese umfassende Erneuerung und bewahrt durch die Fußnote zugleich den Gedanken, dass Gott selbst die Rückkehr bewirkt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Psalmton. Die Anrede steht ohne zusätzliches „o“. Die Formulierung wahrt die göttliche Initiative und macht die Mehrdeutigkeit von שוב durch eine Fußnote sichtbar.
