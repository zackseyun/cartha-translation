lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck herkömmlich die für die musikalische Aufführung oder Leitung zuständige Person. Die Wiedergabe ist modern und verständlich; das vorangestellte ל wird mit „für“ wiedergegeben.
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Die Präposition ל kann Zugehörigkeit, Urheberschaft, Verbindung oder Bestimmung ausdrücken. „Von den Söhnen“ ist im Deutschen natürlich, während eine Fußnote die echte Mehrdeutigkeit offenhält.
- source_word: קֹרַח
  choice: Korachs
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben und wegen der Konstruktion mit „Söhnen“ in den Genitiv gesetzt.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist eine übliche Gattungsbezeichnung für ein musikalisch vorgetragenes Lied beziehungsweise einen Psalm. „Ein Psalm“ entspricht dem deutschen Sprachgebrauch.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Psalmüberschrift in knappem Nominalstil. „Musikalischer Leiter“ vermeidet eine unnötige Festlegung darauf, dass ausschließlich ein Chor gemeint ist; die Fußnoten bewahren die Mehrdeutigkeit der beiden ל-Präpositionen.
