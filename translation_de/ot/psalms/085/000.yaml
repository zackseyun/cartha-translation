  language: de
  text: Für den musikalischen Leiter[a]. Von den Söhnen Korachs[b]. Ein Psalm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Für den Musikleiter“, „Für den leitenden Musiker“ oder „Dem Chorleiter“.'
