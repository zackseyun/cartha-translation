  variant: modern standard German
source:
  edition: WLC
  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: de
  text: Du hast deinen ganzen Zorn zurückgenommen; du hast dich von deiner Zornesglut abgewandt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du hast deinen ganzen Zorn zurückgenommen; du hast von deiner glühenden Wut abgelassen.«'
    reason: Lexikalische Alternative für die beiden parallelen Wendungen über das Zurücknehmen und Abwenden des Zorns.
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: zurückgenommen
  rationale: אסף bedeutet grundsätzlich »sammeln« und kann im Kontext des Zorns dessen Einziehen oder Wegnehmen bezeichnen. »zurückgenommen« gibt diesen Sinn natürlich wieder, ohne das Bild durch eine rein emotionale Umschreibung zu ersetzen.
- source_word: כָל
  choice: ganzen
  rationale: Die Wendung »deinen ganzen Zorn« bewahrt die umfassende Aussage des hebräischen Quantors.
- source_word: עֶבְרָתֶךָ
  choice: deinen ganzen Zorn
  rationale: עֶבְרָה bezeichnet heftigen Zorn oder Grimm. »Zorn« ist würdig, verständlich und im Deutschen idiomatisch.
- source_word: הֱשִׁיבוֹתָ
  choice: du hast dich … abgewandt
  rationale: Der Hifil von שוב mit מן bezeichnet hier ein Zurückwenden beziehungsweise Abwenden von etwas. Die reflexive deutsche Form gibt die idiomatische Bedeutung verständlich wieder.
- source_word: מֵחֲרוֹן אַפֶּךָ
  choice: von deiner Zornesglut
  rationale: חָרוֹן bezeichnet die brennende Hitze des Zorns, während אַף idiomatisch »Zorn« bedeutet. »Zornesglut« erhält das thermische Bild knapp und natürlich.
theological_decisions:
- issue: Bildhafte Rede vom Zorn Gottes
  choice: Die Vorstellung von brennendem göttlichem Zorn bleibt in »Zornesglut« erhalten.
  alternative: du hast dich von deinem heftigen Zorn abgewandt
  rationale: Der hebräische Text verwendet eine konkrete Hitze-Metaphorik. Sie wird weder dogmatisch abgeschwächt noch durch eine wörtliche, im Deutschen missverständliche Wiedergabe von אַף als »Nase« verfremdet.
- issue: Bedeutungsnuance von הֱשִׁיבוֹתָ
  choice: du hast dich … abgewandt
  alternative: du hast … zurückgewandt / du hast abgelassen von
  rationale: Die gewählte Form lässt die Handlung Gottes ausdrücklich stehen und vermeidet die zusätzliche Deutung eines inneren Sinneswandels, die »du hast es bereut« nahelegen könnte.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Parallelstruktur. »Zornesglut« bewahrt die poetische Hitze-Metaphorik, ohne altertümlich oder unverständlich zu wirken.
