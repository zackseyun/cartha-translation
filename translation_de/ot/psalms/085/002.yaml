  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: de
  text: Du hast die Schuld deines Volkes vergeben[a], du hast ihre ganze Sünde bedeckt[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Du hast die Schuld deines Volkes getragen“ oder „weggetragen“. Die hebräische Wendung drückt Vergebung mit dem Bild des Hebens oder Wegtragens von Schuld aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle ihre Sünden“. Im Hebräischen steht ein Singular mit einem Pluralsuffix; er kann kollektiv als „ihre ganze Sünde“ oder distributiv als „ihre Sünden“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: hast … vergeben
  rationale: נשׂא bedeutet wörtlich „heben, tragen“; mit עָוֹן bezeichnet die Wendung das Wegnehmen beziehungsweise Vergeben von Schuld. „Vergeben“ gibt den idiomatischen Sinn in natürlichem Deutsch wieder, während die Fußnote das Bild des Tragens bewahrt.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folge bezeichnen. „Schuld“ passt zur Vergebungswendung und bewahrt das moralische Gewicht, ohne das Wort mit der folgenden „Sünde“ gleichzusetzen.
- source_word: עַמֶּךָ
  choice: deines Volkes
  rationale: עַם bezeichnet hier Gottes Volk in seiner gemeinschaftlichen und relationalen Zugehörigkeit.
- source_word: כִּסִּיתָ
  choice: zugedeckt
  rationale: כסה bedeutet „bedecken, zudecken“. „Zugedeckt“ erhält das hebräische Bild und ist im Zusammenhang als Aussage über Vergebung verständlich.
- source_word: כָל
  choice: all
  rationale: כָל bezeichnet die Gesamtheit; „all“ verbindet sich natürlich mit dem kollektiv gebrauchten Singular „Sünde“.
- source_word: חַטָּאתָם
  choice: ihre Sünde
  rationale: חַטָּאת steht formal im Singular und trägt ein Pluralsuffix. Hier bezeichnet es wegen des Parallelismus mit עָוֹן nicht ein Sündopfer, sondern kollektiv die Sünde des Volkes; distributiv ist auch „ihre Sünden“ möglich.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung von סֶלָה ist unsicher. Die Transliteration vermeidet eine unbelegte Festlegung auf „Pause“ oder „Zwischenspiel“.
theological_decisions:
- issue: Wiedergabe der Wendung נשׂא עון
  choice: Du hast die Schuld deines Volkes vergeben
  alternative: Du hast die Schuld deines Volkes getragen / weggetragen
  rationale: Die Wendung bezeichnet hier göttliche Vergebung beziehungsweise die Beseitigung von Schuld. Die Hauptfassung vermittelt den idiomatischen Sinn klar; die Fußnote bewahrt die wörtliche Bildsprache und deren mögliche theologische Spannung.
- issue: Singular oder Plural bei חטאתם
  choice: all ihre Sünde
  alternative: alle ihre Sünden
  rationale: Der hebräische Singular mit Pluralsuffix kann kollektiv oder distributiv verstanden werden. Der kollektive Singular wahrt die Form und den poetischen Parallelismus; der deutsche Plural bleibt eine legitime Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt. Die beiden parallelen Verben werden semantisch klar, aber mit Erhalt der Bildsprache wiedergegeben.
