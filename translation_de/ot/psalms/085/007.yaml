  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: de
  text: Zeige uns[a] deine beständige Liebe, Jahwe, und schenke uns deine Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Lass uns deine beständige Liebe sehen, Jahwe, und gib uns deine Rettung.“'
    reason: 'Lexikalische Alternative: הַרְאֵנוּ bedeutet wörtlich „lass uns sehen“ beziehungsweise idiomatisch „zeige uns“; תִּתֶּן לָנוּ „gib uns“.'
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: Lass uns … sehen
  rationale: Der Hifil-Imperativ von ראה mit Suffix der 1. Person Plural bedeutet wörtlich „lass uns sehen“ bzw. „zeige uns“. Die gewählte Form bewahrt die kausative Nuance und klingt als Bitte natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: חַסְדֶּךָ
  choice: deine beständige Liebe
  rationale: חסד bezeichnet verlässliche, loyale Güte und Liebe. „Beständige Liebe“ wahrt sowohl die persönliche Zuwendung als auch ihre Dauerhaftigkeit, ohne die Bedeutung ausschließlich auf einen Bundesbegriff festzulegen.
- source_word: וְיֶשְׁעֲךָ
  choice: und deine Rettung
  rationale: יֶשַׁע kann Rettung, Befreiung oder Heil bezeichnen. „Rettung“ ist im heutigen Deutsch klar und bewahrt den konkreten Charakter göttlichen Eingreifens.
- source_word: תִּתֶּן לָנוּ
  choice: schenke uns
  rationale: Wörtlich steht „gib uns“. „Schenke uns“ gibt die erbetene Gewährung in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Gnade; Bundestreue; Güte
  rationale: Die Formulierung hält Liebe, Verlässlichkeit und loyale Güte zusammen, ohne eine ausschließlich bundestheologische Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Wortstellung bleibt nah am hebräischen Parallelismus; „Jahwe“ steht als direkte Anrede.
