  naturalness: Der Satz ist insgesamt verständlich und gebetssprachlich angemessen. „Willst du nicht“ ist als rhetorische Bitte im Deutschen natürlich. „Zurückkehren“ und „sich an dir freuen“ sind im vorliegenden Kontext präziser und stilistisch ebenso flüssig.
