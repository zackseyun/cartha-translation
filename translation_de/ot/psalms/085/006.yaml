base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: de
  text: Willst du nicht zurückkehren[a] und uns neu beleben[b], damit dein Volk sich an dir freut?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wiederkehren“ oder „sich erneut zuwenden“. Das hebräische Verb kann „zurückkehren“ oder „sich wieder zuwenden“ bedeuten; hier ist wahrscheinlich Gottes erneute Zuwendung zu seinem Volk gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „uns wieder Leben geben“ oder „uns wieder lebendig machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Willst du nicht
  rationale: Bewahrt die rhetorische Frage, die eine positive Antwort erwartet, und zugleich den hoffnungsvollen, bittenden Ton.
- source_word: תָּשׁוּב
  choice: wiederkommen
  rationale: שוב bezeichnet ein Zurückkehren oder erneutes Sich-Zuwenden. „Wiederkommen“ ist im Deutschen natürlich und lässt offen, wie genau Gottes erneute Zuwendung zu verstehen ist.
- source_word: תְּחַיֵּנוּ
  choice: uns neu beleben
  rationale: Das Piel von חיה bedeutet Leben geben beziehungsweise wieder lebendig machen. „Neu beleben“ wahrt die umfassende Wiederherstellungsmetaphorik, ohne sie nur körperlich oder nur geistlich zu verstehen.
- source_word: וְעַמְּךָ
  choice: sodass dein Volk
  rationale: Das וְ verbindet hier sinnvoll mit der Folge beziehungsweise dem Ziel der Bitte. „Sodass“ gibt diesen Zusammenhang in natürlichem Deutsch wieder; „dein Volk“ bewahrt die Bundes- und Zugehörigkeitssprache.
- source_word: יִשְׂמְחוּ
  choice: sich ... freut
  rationale: Der Imperfekt bezeichnet im Zusammenhang der Bitte die erhoffte Folge. Das deutsche Präsens nach „sodass“ gibt dies idiomatisch wieder.
- source_word: בָךְ
  choice: über dich
  rationale: ב bei einem Verb der Freude bezeichnet hier den Gegenstand beziehungsweise Grund der Freude. „Sich über dich freuen“ ist natürliches modernes Deutsch und richtet die Freude unmittelbar auf Gott.
theological_decisions:
- issue: Ob Gottes Rückkehr ausdrücklich als erneute gnädige Zuwendung zu seinem Volk erklärt werden soll
  choice: Die weitere Formulierung „wiederkommen“ bleibt im Haupttext stehen.
  alternative: dich uns wieder zuwenden; uns wieder Gunst erweisen
  rationale: Der Kontext legt eine erneute Zuwendung in Gnade nahe, doch der hebräische Text nennt weder „zu uns“ noch „in Gunst“ ausdrücklich. Die Übersetzung erhält daher das Bild und seine Offenheit.
- issue: Ob das Beleben ausschließlich geistliche Erneuerung oder die umfassende Wiederherstellung des Volkes meint
  choice: „uns neu beleben“ ohne nähere Eingrenzung
  alternative: uns geistlich erneuern; unser Volk wiederherstellen
  rationale: Die Bitte steht im Zusammenhang gemeinschaftlicher Wiederherstellung nach Gericht, bleibt sprachlich aber breit. Die Übersetzung beschränkt sie weder auf eine rein geistliche noch auf eine rein politische Bedeutung.
- issue: Wie בָךְ bei der Freude wiederzugeben ist
  choice: „sich über dich freut“
  alternative: „sich an dir freut“; „in dir jubelt“
  rationale: „Über dich“ ist im heutigen Standarddeutsch die natürliche Verbindung und lässt Gott selbst als Gegenstand und Grund der Freude hervortreten, ohne zusätzliche dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der Gebetston bleiben erhalten. „Wiederkommen“ und „neu beleben“ bewahren die metaphorische Weite des Hebräischen; „sodass“ macht den Folge- beziehungsweise Zielzusammenhang idiomatisch deutlich.
