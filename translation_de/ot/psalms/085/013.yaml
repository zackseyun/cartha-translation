lexical_decisions:
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Die übliche und kontextuell passende Wiedergabe; der Begriff kann hier personifiziert als Vorläufer Gottes erscheinen.
- source_word: לְפָנָיו יְהַלֵּךְ
  choice: wird vor ihm hergehen
  rationale: Gibt die räumliche Bedeutung von לְפָנָיו und die fortschreitende Bewegung des Verbs natürlich wieder.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: und seinen Schritten den Weg bereiten
  rationale: Bewahrt das Bild eines Weges für seine Schritte und ergibt idiomatisches Deutsch, ohne die syntaktische Schwierigkeit des Hebräischen vorschnell zu verengen.
theological_decisions:
- issue: Bezug des Suffixes in פְּעָמָיו
  choice: „seinen Schritten“ bezieht sich auf den zuvor mit „ihm“ bezeichneten Gott
  alternative: Die Schritte könnten sich auf die personifizierte Gerechtigkeit beziehen.
  rationale: Der Psalmzusammenhang spricht unmittelbar zuvor von Gottes Kommen und Herrlichkeit; zugleich wird die grammatisch mögliche alternative Zuordnung in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Zeilenfall. „Vor ihm hergehen“ und „den Weg bereiten“ sind allgemein verständlich und erhalten das Bewegungsbild des hebräischen Verses.
