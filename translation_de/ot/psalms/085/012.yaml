  source_fidelity: Der Entwurf gibt die bekräftigende Partikel גַּם angemessen mit „Ja“ wieder und bewahrt den Zukunftsbezug der beiden Imperfekta. „Jahwe wird geben, was gut ist“ entspricht dem weiten, artikulierten הַטּוֹב, ohne es auf materielle Gaben zu verengen. „Unser Land wird seinen Ertrag geben“ gibt אַרְצֵנוּ und יְבוּלָהּ sachgerecht wieder.
