id: PSA.85.12
reference: Psalms 85:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: de
  text: Ja, Jahwe wird geben, was gut ist[a], und unser Land wird seinen Ertrag geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gute“ oder „Gutes“. Der hebräische Ausdruck ist weit gefasst und kann hier sowohl das Gute allgemein als auch gute Gaben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Ja
  rationale: Die Partikel kann additiv („auch“) oder bekräftigend gebraucht werden. Hier führt „Ja“ die zugesagte Heilsperspektive bekräftigend fort, ohne den Zusammenhang nur additiv zu lesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִתֵּן
  choice: wird geben
  rationale: Das Imperfekt bezeichnet im Zusammenhang die erwartete künftige Zuwendung Jahwes.
- source_word: הַטּוֹב
  choice: was gut ist
  rationale: Die substantivierte Form mit Artikel bleibt bewusst weit und kann sowohl das Gute als auch gute Gaben bezeichnen.
- source_word: וְאַרְצֵנוּ
  choice: und unser Land
  rationale: אֶרֶץ bezeichnet hier im landwirtschaftlichen Zusammenhang das Land des Volkes.
- source_word: תִּתֵּן
  choice: wird ... geben
  rationale: Die Wiederholung desselben hebräischen Verbs wie im ersten Versglied wird im Deutschen bewahrt; bei einem Land ist „Ertrag geben“ verständlich und würdevoll.
- source_word: יְבוּלָהּ
  choice: seinen Ertrag
  rationale: יְבוּל bezeichnet den landwirtschaftlichen Ertrag beziehungsweise das Hervorgebrachte des Landes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von הַטּוֹב
  choice: was gut ist
  alternative: das Gute / gute Gaben
  rationale: Die Übersetzung lässt offen, ob vor allem materieller Segen oder das Gute in einem umfassenderen Sinn gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdig-poetischem Ton. Die parallele Wiederholung von „geben“ wurde bewusst erhalten; „Ertrag geben“ ist idiomatisch genug und bildet die hebräische Struktur genauer ab als „hervorbringen“ oder „tragen“.
