id: PSA.85.11
reference: Psalms 85:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: de
  text: Wahrheit[a] wird aus der Erde sprießen, und Gerechtigkeit[b] wird vom Himmel herabschauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Treue“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Recht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: Wahrheit
  rationale: אֱמֶת bezeichnet Wahrheit, Wahrhaftigkeit oder Treue. „Wahrheit“ bewahrt hier die abstrakte Tugend im poetischen Gegenüber zu צֶדֶק; die mögliche Bedeutung „Treue“ wird in einer Fußnote erhalten.
- source_word: מֵאֶרֶץ
  choice: aus der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der vertikale Gegensatz zu „vom Himmel“ spricht hier für „Erde“ und bewahrt die kosmische Bildstruktur.
- source_word: תִּצְמָח
  choice: wird … sprießen
  rationale: צמח bezeichnet das Hervorsprossen oder Wachsen, besonders von Pflanzen. „sprießen“ erhält das anschauliche Wachstumsbild und klingt im Deutschen natürlich-poetisch.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: צֶדֶק umfasst Gerechtigkeit, Recht und rechtschaffene Ordnung. „Gerechtigkeit“ ist im Deutschen weit genug, um sowohl die moralische als auch die rechtliche Dimension anzudeuten; „Recht“ bleibt als mögliche Alternative in der Fußnote.
- source_word: מִשָּׁמַיִם
  choice: vom Himmel
  rationale: שָׁמַיִם kann „Himmel“ oder „Himmelssphäre“ bezeichnen. Der deutsche Singular ist in diesem poetischen Gegensatz zu „Erde“ idiomatisch und bewahrt die theologisch-poetische Resonanz.
- source_word: נִשְׁקָף
  choice: wird … herabschauen
  rationale: Der Niphal von שׁקף bezeichnet häufig das Schauen von einem erhöhten Ort aus. „herabschauen“ gibt sowohl den Blick als auch seine Richtung wieder und erhält die Personifikation.
theological_decisions:
- issue: Bedeutungsumfang von אֱמֶת
  choice: Wahrheit
  alternative: Treue
  rationale: Beide Bedeutungen sind im Hebräischen möglich. Im Haupttext steht „Wahrheit“, weil das Wort hier als personifizierte abstrakte Tugend neben „Gerechtigkeit“ erscheint; die bündnisbezogene Nuance „Treue“ wird nicht ausgeschlossen, sondern in der Fußnote bewahrt.
- issue: Bedeutungsumfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht
  rationale: Der Begriff kann moralische Richtigkeit ebenso wie gerechte Rechtsordnung bezeichnen. „Gerechtigkeit“ hält diesen Bedeutungsraum im Haupttext am ehesten offen; „Recht“ wird als knapperes, stärker rechtlich gefärbtes Verständnis vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die Personifikation und die vertikale Bewegung von Erde und Himmel bleiben erhalten.
