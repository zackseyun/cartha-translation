source:
  edition: WLC
  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: de
  text: Du hast deinem Land Gunst erwiesen, Jahwe; du hast Jakobs Geschick wiederhergestellt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du hast die Gefangenschaft Jakobs gewendet“ beziehungsweise „du hast Jakobs Gefangene zurückgebracht“. Die hebräische Wendung kann die Rückkehr aus dem Exil oder allgemeiner die Wiederherstellung des Wohlergehens bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: hast … Gunst erwiesen
  rationale: Das Qal von רצה bezeichnet hier, dass Jahwe seinem Land wohlwollend begegnet. „Gunst erwiesen“ ist natürliches, würdiges Deutsch und bewahrt den aktiven Wohltatssinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַרְצֶךָ
  choice: deinem Land
  rationale: אֶרֶץ meint hier das Jahwe zugehörige Land, im Zusammenhang wohl Israel. „Land“ wahrt die räumliche und bundestheologische Weite besser als das modern-politische „Staat“.
- source_word: שַׁבְתָּ
  choice: hast … gewendet
  rationale: Mit dem folgenden שְׁבוּת bildet שוב eine feste Wendung für die Wiederherstellung beziehungsweise Umkehr einer bedrängten Lage. Die deutsche Formulierung „das Geschick wenden“ gibt das Idiom natürlich wieder.
- source_word: שבות
  choice: das Geschick
  rationale: שבות kann im Idiom eine umfassende Wiederherstellung des Ergehens bezeichnen, zugleich aber Gefangenschaft oder Verbannung anklingen lassen. „Geschick“ wahrt den breiten Hauptsinn; die engere mögliche Lesart steht in der Fußnote.
- source_word: יַעֲקֹב
  choice: Jakobs
  rationale: Der poetische Bundesname „Jakob“ wird beibehalten; er bezeichnet hier kollektiv das Volk Israel.
theological_decisions:
- issue: Bedeutung der Wendung שׁוּב שְׁבוּת יַעֲקֹב
  choice: du hast das Geschick Jakobs gewendet
  alternative: du hast die Gefangenschaft Jakobs beendet / du hast die Gefangenen Jakobs zurückgebracht
  rationale: Die hebräische Wendung kann eine allgemeine Wiederherstellung bezeichnen, aber auch konkret die Rückkehr aus Gefangenschaft oder Exil. Der Haupttext bleibt weit genug für beide Horizonte; die konkretere Exilslesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Kürze. Die direkte Anrede „Jahwe“ bleibt ohne zusätzliches „o“, da dies im heutigen Deutschen natürlicher klingt. Die idiomatische Wendung „das Geschick wenden“ bewahrt sowohl Würde als auch Bedeutungsweite.
