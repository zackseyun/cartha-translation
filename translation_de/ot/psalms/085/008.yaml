  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: de
  text: Ich will hören, was Gott, Jahwe, sagen wird; denn er wird seinem Volk und seinen Getreuen[a] Frieden zusagen. Doch sie sollen nicht zur Torheit[b] zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Frommen“ beziehungsweise „seinen loyal Verbundenen“.'
    reason: lexikalische Alternative zu חֲסִידָיו
  - marker: b
    text: 'Oder: „zur Dummheit“. Weniger wahrscheinlich wird das hebräische Wort hier im Sinn von „Zuversicht“ verstanden.'
    reason: lexikalische Alternative zu לְכִסְלָה
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: Ich will hören
  rationale: Die Kohortativform drückt hier den entschlossenen Vorsatz des Sprechers aus. „Ich will hören“ bewahrt diese Willensnuance und klingt im Deutschen natürlich.
- source_word: מַה יְדַבֵּר
  choice: was … sagen wird
  rationale: Das Imperfekt blickt auf das erwartete Reden Gottes. „Sagen wird“ gibt dies idiomatisch wieder, ohne den Inhalt vorwegzunehmen.
- source_word: הָאֵל יְהוָה
  choice: Gott, Jahwe
  rationale: Die Wiedergabe erhält sowohl אֵל als Gottesbezeichnung als auch den Gottesnamen יהוה; das Komma kennzeichnet die Apposition.
- source_word: כִּי יְדַבֵּר שָׁלוֹם
  choice: Denn er wird … Frieden verkünden
  rationale: כִּי begründet die Erwartung des Sprechers. „Frieden verkünden“ gibt die hebräische Wendung „Frieden reden“ in natürlichem Deutsch wieder und bewahrt Frieden als Inhalt der göttlichen Zusage.
- source_word: עַמּוֹ
  choice: seinem Volk
  rationale: Direkte und natürliche Wiedergabe der Possessivverbindung.
- source_word: חֲסִידָיו
  choice: seinen Getreuen
  rationale: חסיד bezeichnet Menschen, die von loyaler, gottesfürchtiger Verbundenheit geprägt sind. „Getreue“ wahrt diese Beziehungsdimension, ohne einen späteren kirchlichen Fachbegriff einzutragen.
- source_word: וְאַל יָשׁוּבוּ
  choice: Doch sie sollen nicht … zurückkehren
  rationale: אַל mit Imperfekt hat prohibitive beziehungsweise jussive Kraft. „Doch“ macht den warnenden Gegensatz zur Friedenszusage deutlich.
- source_word: לְכִסְלָה
  choice: zur Torheit
  rationale: Die übliche Bedeutung des Nomens ist „Torheit“ oder „törichtes Verhalten“. „Zur Torheit zurückkehren“ erhält das Bild eines Rückfalls.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass sein Charakter als Gottesname sichtbar bleibt; eine Umschreibung durch einen Titel wird vermieden.
- issue: Bedeutung von חֲסִידָיו
  choice: seinen Getreuen
  alternative: seinen Frommen; seinen Heiligen
  rationale: „Getreue“ betont Loyalität und Verbundenheit, ohne חסיד auf eine spätere technische Vorstellung von „Heiligen“ festzulegen.
- issue: Aussagekraft des Schlussglieds
  choice: 'Warnung beziehungsweise Mahnung: „Doch sie sollen nicht … zurückkehren“'
  alternative: 'Vorhersage: „und sie werden nicht … zurückkehren“'
  rationale: Die Verbindung אַל mit dem Imperfekt spricht deutlich für eine negative Aufforderung. So bleibt die Spannung zwischen Gottes Friedenszusage und der Verantwortung des Volkes erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht die Bewegung von Vorsatz über Begründung zur abschließenden Mahnung klar. „Frieden verkünden“ ist eine natürliche deutsche Wiedergabe der hebräischen Wendung „Frieden reden“; „Getreue“ hält die bundesorientierte Loyalitätsnuance offen.
