  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: de
  text: Gewiss ist seine Rettung denen nahe, die ihn fürchten, damit Herrlichkeit[a] in unserem Land wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Herrlichkeit“ kann Gottes sichtbar erfahrbare Gegenwart oder die dem Land wiedergegebene Ehre bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt hier die Aussage. „Ja“ gibt diese emphatische Funktion in natürlichem, würdigem Deutsch wieder, ohne eine ausschließende Bedeutung („nur“) einzutragen.
- source_word: קָרוֹב
  choice: ist … nahe
  rationale: Das Adjektiv bezeichnet räumliche oder übertragene Nähe; die deutsche Wendung „jemandem nahe sein“ entspricht dem hebräischen Dativanschluss mit ל.
- source_word: לִירֵאָיו
  choice: denen, die ihn fürchten
  rationale: Die Form bezeichnet Menschen, die Gott fürchten. „Fürchten“ bewahrt den religiös-bundestheologischen Bedeutungsumfang und schwächt ihn nicht auf bloße Achtung ab.
- source_word: יִשְׁעוֹ
  choice: seine Rettung
  rationale: יֵשַׁע bezeichnet Rettung, Befreiung oder Heil. „Rettung“ ist unmittelbar verständlich und bewahrt den possessiven Bezug auf Gott.
- source_word: לִשְׁכֹּן
  choice: damit … wohnt
  rationale: Der Infinitiv mit ל kann hier Zweck oder Folge ausdrücken. „Damit“ bildet diesen Zusammenhang ab, ohne ihn unnötig näher festzulegen.
- source_word: כָּבוֹד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ erhält das poetische und theologische Gewicht des hebräischen Wortes und lässt offen, ob besonders Gottes gegenwärtige Herrlichkeit oder wiederhergestellte Ehre gemeint ist.
- source_word: בְּאַרְצֵנוּ
  choice: in unserem Land
  rationale: אֶרֶץ bezeichnet im Kontext das Land des Volkes; „unser Land“ ist die natürliche und sachgerechte Wiedergabe.
theological_decisions:
- issue: Bezug von כָּבוֹד („Herrlichkeit“)
  choice: Im Haupttext steht allgemein „Herrlichkeit“, ohne den Bezug ausdrücklich festzulegen.
  alternative: Ausdrücklich „Gottes Herrlichkeit/Gegenwart“ oder „wiederhergestellte Ehre des Landes“.
  rationale: Das Hebräische nennt keinen ausdrücklichen Besitzer und bleibt poetisch offen. Die Übersetzung bewahrt diese Mehrdeutigkeit.
- issue: Bedeutung von יִשְׁעוֹ
  choice: „seine Rettung“
  alternative: „sein Heil“ oder „seine Befreiung“
  rationale: „Rettung“ hält Gottes rettendes Handeln konkret und verständlich fest; „Heil“ wäre theologisch traditionsreicher, könnte den Bedeutungsumfang aber stärker dogmatisch prägen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, poetischem Klang. Die Satzstellung stellt die Gottesfürchtigen hervor und lässt zugleich „seine Rettung“ als Subjekt klar erkennbar. Die Mehrdeutigkeit von „Herrlichkeit“ bleibt erhalten.
