source:
  edition: WLC
  text: יְהַלְל֤וּ אֶת שֵׁ֬ם יְהוָ֗ה כִּֽי נִשְׂגָּ֣ב שְׁמ֣/וֹ לְ/בַדּ֑/וֹ ה֝וֹד֗/וֹ עַל אֶ֥רֶץ וְ/שָׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/013.yaml
  text: Let them praise the name of Yahweh[a], for his name alone is exalted; his majesty is above earth and heaven.
translation:
  language: de
  text: Sie sollen den Namen Jahwes[a] loben, denn allein sein Name ist erhaben; seine Majestät steht über Erde und Himmel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt hier den Gottesnamen Jahwe.
    reason: divine_name
  - marker: b
    text: 'Für „Majestät“ auch: „Glanz“ oder „Herrlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Sie sollen … loben
  rationale: Der Imperfekt Plural hat im hymnischen Zusammenhang auffordernde, jussivische Kraft. „Sie sollen … loben“ gibt dies in natürlichem Deutsch wieder.
- source_word: שֵׁם
  choice: Name
  rationale: Die konkrete und theologisch bedeutsame hebräische Wendung wird wörtlich bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen wissenschaftlichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für den Aufruf zum Lob ein.
- source_word: נִשְׂגָּב
  choice: ist erhaben
  rationale: Das Wort bezeichnet hier erhöhte, unvergleichliche Hoheit; „erhaben“ passt zum poetischen Lobpreis.
- source_word: שְׁמוֹ לְבַדּוֹ
  choice: allein sein Name
  rationale: Die Exklusivität von לְבַדּוֹ und der ausdrückliche Bezug auf den Namen bleiben erhalten.
- source_word: הוֹדוֹ
  choice: seine Majestät
  rationale: הוֹד kann Majestät, Glanz oder Herrlichkeit bezeichnen. „Majestät“ vermittelt die königliche Hoheit in verständlichem, würdigem Deutsch.
- source_word: עַל
  choice: steht über
  rationale: Die Präposition drückt hier poetisch Erhöhung und Überlegenheit aus. Das ergänzte Verb ergibt einen natürlichen deutschen Satz.
- source_word: אֶרֶץ וְשָׁמַיִם
  choice: Erde und Himmel
  rationale: Die hebräische Reihenfolge und das umfassende Begriffspaar für die geschaffene Welt werden bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutungsbreite von הוֹד
  choice: Majestät
  alternative: Glanz oder Herrlichkeit
  rationale: Der Kontext betont Gottes erhabene Hoheit. Da das hebräische Wort mehrere eng verwandte Bedeutungen zulässt, werden die wichtigsten Alternativen in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Klang. Die Satzstruktur folgt dem hebräischen Gedankengang, bleibt aber für heutige Leser natürlich verständlich.
