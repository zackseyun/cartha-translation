  text: mountains and all hills[a], fruit trees and all cedars,
translation:
  language: de
  text: die Berge und alle Hügel, Obstbäume[a] und alle Zedern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fruchttragende Bäume“. Wörtlich steht im Hebräischen „Baum der Frucht“; die Wendung wird hier kollektiv gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: die Berge
  rationale: Das Substantiv bezeichnet Berge; der hebräische Artikel wird im Deutschen natürlich mit „die“ wiedergegeben.
- source_word: וְכָל גְּבָעוֹת
  choice: und alle Hügel
  rationale: כָּל mit der Konjunktion bedeutet hier in der poetischen Aufzählung „und alle“; גְּבָעוֹת bezeichnet kleinere Erhebungen und steht im Gegensatz zu den Bergen.
- source_word: עֵץ פְּרִי
  choice: Obstbäume
  rationale: Die wörtliche Konstruktion „Baum der Frucht“ wird kollektiv gebraucht. „Obstbäume“ ist die knappe, natürliche deutsche Bezeichnung der gemeinten Baumart.
- source_word: וְכָל אֲרָזִים
  choice: und alle Zedern
  rationale: אֲרָזִים bezeichnet Zedern; „alle“ bewahrt die Reichweite von כָּל, ohne das im Deutschen entbehrliche Wort „Bäume“ zu ergänzen.
