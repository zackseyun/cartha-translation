source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְל֣וּ אֶת יְ֭הוָה מִן הַ/שָּׁמַ֑יִם הַֽ֝לְל֗וּ/הוּ בַּ/מְּרוֹמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/001.yaml
  text: Praise Yah! Praise Yahweh from the heavens[a]; praise him in the heights.
translation:
  language: de
  text: Lobt Jah[a]! Lobt Jahwe von den Himmeln her; lobt ihn in den Höhen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch hallelu-jah; daher das vertraute „Halleluja“. Wörtlich: „Lobt Jah“.'
    reason: Die Fußnote erklärt die hebräische Wendung und ihre geläufige liturgische Übertragung.
lexical_decisions:
- source_word: הַלְלוּ
  choice: Lobt
  rationale: Der Piel-Imperativ im Plural ist eine unmittelbare Aufforderung an mehrere Angesprochene. „Lobt“ ist im Deutschen klar, natürlich und formgetreu.
- source_word: יָהּ
  choice: Jah
  rationale: Die poetische Kurzform des Gottesnamens wird als „Jah“ wiedergegeben. So bleibt ihr Unterschied zum unmittelbar folgenden יְהוָה erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der volle Gottesname wird mit „Jahwe“ wiedergegeben, sodass die bewusste Abfolge der Kurzform „Jah“ und des vollen Namens im Hebräischen sichtbar bleibt.
- source_word: מִן הַשָּׁמַיִם
  choice: von den Himmeln her
  rationale: מִן bezeichnet den Ausgangspunkt, und שָׁמַיִם steht formal im Plural. „Von den Himmeln her“ bewahrt beides und passt zum kosmischen Aufruf des Psalms.
- source_word: הַלְלוּהוּ
  choice: lobt ihn
  rationale: Das Verb trägt ein maskulines Objektsuffix der dritten Person Singular. „Ihn“ nimmt den zuvor genannten Jahwe auf, ohne den Namen unnötig zu wiederholen.
- source_word: בַּמְּרוֹמִים
  choice: in den Höhen
  rationale: מְרוֹמִים bezeichnet erhöhte Bereiche oder Höhen. Die Wiedergabe bewahrt das räumliche Bild, ohne es enger als „höchste Himmel“ auszulegen.
theological_decisions:
- issue: Wiedergabe von יָהּ und יְהוָה im selben Vers
  choice: יָהּ als „Jah“ und יְהוָה als „Jahwe“ wiedergeben
  alternative: Beide Formen mit „der HERR“ wiedergeben oder den Unterschied durch „Halleluja“ und „der HERR“ weniger direkt sichtbar machen
  rationale: Der hebräische Text setzt die poetische Kurzform und den vollen Gottesnamen bewusst nebeneinander. Die unterschiedliche Wiedergabe erhält diese sprachliche und theologische Unterscheidung, ohne zusätzliche Deutung einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit der rhythmischen Wiederholung des hebräischen Aufrufs. Der ungewöhnlichere Plural „Himmel“ wird als „von den Himmeln her“ bewahrt; das abschließende Ausrufezeichen unterstreicht den fortgesetzten Imperativ.
