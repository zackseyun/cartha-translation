  source_fidelity: 'Die Übersetzung gibt die vier im Hebräischen genannten, männlich bzw. weiblich markierten Altersgruppen zuverlässig wieder: junge Männer, junge Frauen, alte Männer und Jungen. Die Paarung von זְקֵנִים mit נְעָרִים durch „zusammen mit“ entspricht עִם. Die mögliche spezifischere Bedeutung von בְּתוּלוֹת als „Jungfrauen“ sowie die weitere Altersspanne von נְעָרִים sind angemessen in Fußnoten gesichert.'
  naturalness: „junge Männer und junge Frauen, alte Männer zusammen mit Jungen“ ist klares, modernes Standarddeutsch und bewahrt die knappe Reihung des poetischen Ausgangstextes. „Zusammen mit“ ist etwas ausführlicher als bloßes „mit“, aber idiomatisch und ohne Bedeutungsverschiebung.
  terminology: Die Begriffe sind alters- und geschlechtsspezifisch, ohne unangebrachte kirchliche oder soziale Konnotationen. „Junge Frauen“ ist im Kontext der Aufzählung eine gut vertretbare Hauptlesart für בְּתוּלוֹת; die Fußnote wahrt die lexikalische Spannung. Die Fußnotenmarker stehen jeweils bei dem erläuterten Ausdruck.
