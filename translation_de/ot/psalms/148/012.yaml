  variant: modern standard German
source:
  edition: WLC
  text: בַּחוּרִ֥ים וְ/גַם בְּתוּל֑וֹת זְ֝קֵנִ֗ים עִם נְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/012.yaml
  text: young men and young women[a], old men with boys[b].
translation:
  language: de
  text: junge Männer und junge Frauen[a], alte Männer zusammen mit Jungen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jungfrauen“. Das hebräische Wort kann insbesondere Jungfrauen oder unverheiratete junge Frauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „männliche Jugendliche“. Das hebräische Wort kann jüngere männliche Personen in einem weiteren Altersbereich bezeichnen als das deutsche „Jungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: junge Männer
  rationale: Das Substantiv bezeichnet junge erwachsene Männer, oft mit dem Beiklang von Kraft und bestem Alter. „Junge Männer“ ist im modernen Deutsch natürlich und wahrt den männlichen Bezug.
- source_word: וְגַם
  choice: und
  rationale: In der knappen poetischen Aufzählung gibt „und“ die Verbindung samt additivem Sinn natürlich wieder.
- source_word: בְּתוּלוֹת
  choice: junge Frauen
  rationale: Das hebräische Wort kann ausdrücklich Jungfrauen beziehungsweise unverheiratete junge Frauen bezeichnen. Hier steht jedoch wahrscheinlich die Alters- und Geschlechtsgruppe im Vordergrund; die engere Bedeutung bleibt in der Fußnote erhalten.
- source_word: זְקֵנִים
  choice: alte Männer
  rationale: Im Rahmen der nach Alter und Geschlecht geordneten Gruppen bezeichnet das Wort eher ältere Männer als Amtsträger oder Älteste.
- source_word: עִם
  choice: zusammen mit
  rationale: Die Wendung verbindet die alten Männer mit den Jungen und bildet einen verständlichen poetischen Parallelismus zur ersten Gruppe.
- source_word: נְעָרִים
  choice: Jungen
  rationale: Das Wort bezeichnet hier jüngere männliche Personen und steht im Kontrast zu den zuvor genannten jungen erwachsenen Männern. Der mögliche weitere Altersbereich wird in der Fußnote ausgewiesen.
theological_decisions: []
