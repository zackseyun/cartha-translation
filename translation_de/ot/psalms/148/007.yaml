id: PSA.148.7
reference: Psalms 148:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַֽלְל֣וּ אֶת יְ֭הוָה מִן הָ/אָ֑רֶץ תַּ֝נִּינִ֗ים וְ/כָל תְּהֹמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/007.yaml
  text: Praise Yahweh from the earth[b][a], sea creatures and all deeps.
translation:
  language: de
  text: Lobt Jahwe von der Erde her, ihr Meeresungeheuer[a] und all ihr Wassertiefen[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „große Meerestiere“, „Drachen“ beziehungsweise „Schlangenwesen“. Das hebräische Wort תַּנִּינִים kann verschiedene große oder bedrohlich vorgestellte Wesen bezeichnen, hier im Zusammenhang mit dem Meer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Tiefen“ beziehungsweise „Urfluten“. Gemeint sind tiefe Wassermassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְל֣וּ
  choice: Lobt
  rationale: Der pluralische Imperativ von הלל ist im Deutschen als direkte Aufforderung „Lobt“ natürlich und entspricht dem hymnischen Stil des Psalms.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: מִן הָאָרֶץ
  choice: von der Erde her
  rationale: Im kosmischen Aufbau von Psalm 148 bezeichnet אֶרֶץ den irdischen Bereich im Gegenüber zum Himmel; „her“ macht den Ausgangspunkt des Lobes im Deutschen deutlich.
- source_word: תַּנִּינִים
  choice: Meeresungeheuer
  rationale: Das Wort bezeichnet große, teils schlangenartig oder monströs vorgestellte Wesen und ist hier durch die benachbarten Wassertiefen maritim geprägt. Die Wiedergabe bewahrt diese Bildkraft, ohne ein nicht ausdrücklich vorhandenes Adjektiv wie „groß“ einzufügen.
- source_word: תְּהֹמוֹת
  choice: Wassertiefen
  rationale: Der Plural von תהום meint tiefe Wassermassen beziehungsweise Tiefen des Urmeers. „Wassertiefen“ ist verständlich und erhält das kosmische Wasserbild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Transliteration bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Mythologische oder zoologische Färbung von תַּנִּינִים
  choice: Meeresungeheuer
  alternative: Meerestiere
  rationale: „Meeresungeheuer“ erhält die ungewöhnliche und möglicherweise kosmisch-monströse Bildwelt des hebräischen Begriffs, ohne die Wesen auf gewöhnliche Meerestiere festzulegen. Die lexikalische Spannweite wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Psalmdeutsch. Die Anrede „ihr …“ verdeutlicht, dass die folgenden Geschöpfe zum Lob aufgerufen werden. Das Ausrufezeichen gibt den Aufforderungscharakter wieder.
