  text: יְֽ֭הַֽלְלוּ אֶת שֵׁ֣ם יְהוָ֑ה כִּ֤י ה֭וּא צִוָּ֣ה וְ/נִבְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/005.yaml
  text: Let them praise the name of Yahweh[a], for he commanded, and they were created.
translation:
  language: de
  text: Loben sollen sie den Namen Jahwes[a], denn er gebot, und sie wurden geschaffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“. Der Gottesname wird traditionell mit „der HERR“ wiedergegeben; hier „Jahwe“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Sie sollen … loben
  rationale: Der Piel-Imperfekt/Jussiv 3. Person Plural hat hier auffordernden Sinn. „Sie sollen … loben“ gibt diesen im Deutschen natürlich und würdig wieder.
- source_word: אֶת שֵׁם
  choice: den Namen
  rationale: Die Wendung bezeichnet Gottes offenbare Identität und seinen Ruf; das biblische Bild des Namens bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die Aufforderung zum Lob ein.
- source_word: הוּא
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen verweist auf Jahwe; eine Verstärkung durch „selbst“ wäre unnötig.
- source_word: צִוָּה
  choice: gebot
  rationale: Das Verb bezeichnet das Erteilen eines Befehls. „Gebot“ ist prägnant und passt zum gehobenen poetischen Register.
- source_word: וְנִבְרָאוּ
  choice: und sie wurden geschaffen
  rationale: Der Nifal Perfekt Plural wird passiv wiedergegeben und bewahrt den ausdrücklichen Schöpfungsbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen direkt. „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Ersatzwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Prägnanz. Die koordinierte Satzstruktur des Hebräischen und der passive Schöpfungsausdruck bleiben erhalten.
