id: PSA.148.14
reference: Psalms 148:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
translation:
  language: de
  text: Er hat für sein Volk ein Horn erhoben[a] – Ruhm für all seine Getreuen[b], für die Söhne Israels[c], das Volk, das ihm nahe ist. Preist Jah![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Horn“ ist ein hebräisches Bild für Kraft, Würde oder erhöhte Macht.
    reason: cultural_note
  - marker: b
    text: 'Die hebräische Satzfügung ist stark verdichtet. Möglich ist auch: „zum Ruhm all seiner Getreuen“ oder „ein Lobpreis für all seine Getreuen“.'
    reason: alternative_reading
  - marker: c
    text: 'Auch: „für die Kinder Israels“. „Söhne Israels“ ist hier eine gemeinschaftliche Herkunftsbezeichnung.'
    reason: lexical_alternative
  - marker: d
    text: „Preist Jah“ gibt die Bedeutung des liturgischen Ausdrucks „Halleluja“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: Er hat … erhoben
  rationale: Das Hifil von רום bezeichnet das Erhöhen oder Emporheben. Das deutsche Perfekt gibt hier die vollendete Heilstat in einem natürlichen, feierlichen Erzählton wieder.
- source_word: קֶרֶן
  choice: Horn
  rationale: Das konkrete poetische Bild bleibt erhalten. Das Horn steht im Hebräischen sinnbildlich für Kraft, Würde oder erhöhte Macht, ohne dass der Text nur eine dieser Bedeutungen festlegt.
- source_word: לְעַמּוֹ
  choice: für sein Volk
  rationale: Die Präposition לְ wird unmittelbar wiedergegeben; „Volk“ bewahrt den gemeinschaftlichen und relationalen Sinn von עַם.
- source_word: תְּהִלָּה
  choice: Ruhm
  rationale: תְּהִלָּה kann Lob beziehungsweise Ruhm bezeichnen. „Ruhm“ fügt sich im Deutschen natürlich als knappe Apposition beziehungsweise Folge des erhobenen Horns ein, ohne die verdichtete Syntax vollständig aufzulösen.
- source_word: לְכָל חֲסִידָיו
  choice: für all seine Getreuen
  rationale: חֲסִידִים bezeichnet Menschen, die durch Treue und hingebungsvolle Verbundenheit geprägt sind. „Getreue“ ist würdig und vermeidet die möglichen späteren kirchlichen Nebenbedeutungen von „Heilige“.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Die Formulierung folgt der grammatisch männlichen Pluralform בְּנֵי und bewahrt die traditionelle korporative Bezeichnung möglichst genau.
- source_word: עַם קְרֹבוֹ
  choice: das Volk, das ihm nahe ist
  rationale: Die relationale Metapher der Nähe zu Gott bleibt bestehen und wird nicht vorschnell als „erwählt“ oder „geliebt“ ausgelegt.
- source_word: הַלְלוּ יָהּ
  choice: Preist Jah!
  rationale: Der Imperativ und die Kurzform des Gottesnamens werden transparent übersetzt. Damit bleibt sowohl die Bedeutung als auch die besondere Form von יָהּ sichtbar.
theological_decisions:
- issue: Bedeutung des erhobenen Horns
  choice: Das Bild „Horn“ bleibt im Haupttext stehen.
  alternative: „Kraft“, „Macht“ oder „Stärke“
  rationale: Das poetische Bild umfasst Kraft, Würde und Erhöhung. Eine abstrakte Wiedergabe würde die Mehrdeutigkeit unnötig auf eine einzelne Deutung verengen.
- issue: Verhältnis von תְּהִלָּה zum vorausgehenden Satzteil
  choice: „Ruhm“ steht als verdichtete Apposition beziehungsweise Folge nach einem Gedankenstrich.
  alternative: „ein Lobpreis für all seine Getreuen“ oder „zum Ruhm all seiner Getreuen“
  rationale: Die hebräische Syntax ist knapp und lässt das genaue Verhältnis offen. Die Übersetzung erhält diese Verdichtung; eine Fußnote nennt die wesentlichen syntaktischen Möglichkeiten.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: „die Söhne Israels“
  alternative: „die Kinder Israels“ oder „die Israeliten“
  rationale: Die konkrete hebräische Form wird bewahrt. Zugleich zeigt die Fußnote, dass es sich um eine korporative Herkunftsbezeichnung handelt und nicht ausschließlich um männliche Einzelpersonen.
- issue: Wiedergabe der Gottesnamensform יָהּ
  choice: „Jah“
  alternative: „der HERR“ oder die unübersetzte Form „Halleluja“
  rationale: Der Vers verwendet ausdrücklich die Kurzform יָהּ. „Jah“ bewahrt diese Form, während „Preist“ die Bedeutung des Imperativs הַלְלוּ offenlegt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewahrter hebräischer Bildlichkeit. Der Gedankenstrich spiegelt die knappe poetische Apposition. „Getreue“ ist bewusst würdig, aber ohne konfessionell festgelegte Terminologie; „Jah“ erhält die im Ausgangstext verwendete Kurzform des Gottesnamens.
