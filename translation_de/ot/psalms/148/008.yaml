lexical_decisions:
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die direkte und natürliche deutsche Entsprechung in der Aufzählung von Naturerscheinungen.
- source_word: וּבָרָד
  choice: und Hagel
  rationale: בָּרָד bezeichnet eindeutig Hagel; die Konjunktion wird wiedergegeben.
- source_word: שֶׁלֶג
  choice: Schnee
  rationale: Die übliche deutsche Entsprechung in diesem meteorologischen Zusammenhang.
- source_word: וְקִיטוֹר
  choice: und Dunst
  rationale: קִיטוֹר kann Dunst, Rauch oder aufsteigenden Dampf bezeichnen. »Dunst« bleibt im meteorologischen Zusammenhang natürlich und legt sich nicht unnötig auf Rauch oder Wasserdampf fest.
- source_word: רוּחַ סְעָרָה
  choice: Sturmwind
  rationale: Die kompakte deutsche Zusammensetzung gibt einen von Sturm gekennzeichneten Wind idiomatisch wieder.
- source_word: עֹשָׂה
  choice: der … ausführt
  rationale: Das Partizip beschreibt fortdauernd bzw. charakteristisch das Vollziehen dessen, was Gott spricht. »Ausführen« ist im Deutschen natürlicher als die wörtliche Wendung »sein Wort tun«.
- source_word: דְבָרוֹ
  choice: sein Wort
  rationale: דָּבָר bedeutet grundsätzlich »Wort«, kann hier aber funktional einen Befehl oder eine Weisung bezeichnen. Der Haupttext bewahrt die lexikalische Offenheit.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in דְבָרוֹ
  choice: »sein Wort«, auf Gott bezogen
  alternative: »seinen Befehl«
  rationale: Im Zusammenhang des Psalms werden die geschaffenen Dinge zum Lob Gottes aufgerufen; der Sturmwind vollzieht daher Gottes Wort. Die Kleinschreibung des Pronomens entspricht der modernen deutschen Standardschreibung und entscheidet keine theologische Frage.
- issue: Verhältnis des Sturmwinds zum göttlichen Wort
  choice: »der sein Wort ausführt«
  alternative: »der seinen Befehl erfüllt«
  rationale: Die Wiedergabe drückt den Gehorsam der Schöpfung gegenüber Gottes Äußerung aus, ohne דָּבָר im Haupttext ausdrücklich auf »Befehl« einzuengen.
translation_notes:
  register: Poetisch, knapp und würdig. Die asyndetische Reihung des Hebräischen bleibt weitgehend erhalten. »Sturmwind« ist heutiges Standarddeutsch; »sein Wort ausführt« vermeidet einen unnatürlichen Hebraismus, bewahrt aber »Wort« als zentrale lexikalische Entsprechung.
