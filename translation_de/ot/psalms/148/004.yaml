  language: en
  yaml_path: translation/ot/psalms/148/004.yaml
  text: Praise him[a], highest heavens[c][b], and waters above the heavens.
translation:
  language: de
  text: Lobt ihn, ihr höchsten Himmel, und ihr Wasser über den Himmeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Himmel der Himmel“ und „die Wasser, die über den Himmeln sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Lobt ihn
  rationale: Der maskuline Pluralimperativ von הלל mit Suffix der 3. Person Singular ruft mehrere Angesprochene unmittelbar dazu auf, Gott zu loben.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: ihr höchsten Himmel
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich „Himmel der Himmel“ und dient hier als intensive beziehungsweise superlativische Wendung. „Höchste Himmel“ gibt den Sinn in natürlichem Deutsch wieder; „ihr“ macht die Anrede deutlich.
- source_word: וְהַמַּיִם
  choice: und ihr Wasser
  rationale: Das bestimmte Substantiv ist als zweites, koordiniertes Glied ebenfalls angeredet. Das ergänzte „ihr“ verdeutlicht im Deutschen den Vokativ, ohne den Sinn zu verändern.
- source_word: אֲשֶׁר מֵעַל הַשָּׁמָיִם
  choice: über den Himmeln
  rationale: 'Die verkürzte Relativkonstruktion gibt idiomatisch wieder: „die über den Himmeln sind“. Der Plural „Himmeln“ bewahrt die Form des hebräischen Ausdrucks.'
theological_decisions:
- issue: Kosmologische Rede vom Wasser über den Himmeln
  choice: Das alte kosmologische Bild wird unverändert als „Wasser über den Himmeln“ wiedergegeben.
  alternative: Die Wendung als atmosphärisches Wasser zu modernisieren oder ausdrücklich metaphorisch zu deuten.
  rationale: Der Psalm ruft poetisch alle Bereiche der Schöpfung zum Lob auf. Die Übersetzung bewahrt die Vorstellungswelt des Ausgangstextes, ohne sie an moderne naturwissenschaftliche Kategorien anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Anrede mit „ihr“ macht die beiden koordinierten Vokative klar und erhält den poetischen Aufrufcharakter.
