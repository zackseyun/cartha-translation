base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/003.yaml
  text: Praise him[a], sun and moon; praise him, all shining stars.
translation:
  language: de
  text: Lobt ihn, Sonne und Mond; lobt ihn, all ihr leuchtenden Sterne![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: alle Sterne des Lichts.'
    reason: Die Fußnote bewahrt die formale hebräische Genitivverbindung כּוֹכְבֵי אוֹר neben der natürlicheren Wiedergabe „leuchtenden Sterne“.
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Lobt ihn
  rationale: Der Pluralimperativ von הלל mit Suffix der 3. Person Singular richtet sich unmittelbar an die Himmelskörper. „Lobt ihn“ gibt Form, Bezug und poetische Wiederholung klar wieder.
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: Sonne und Mond
  rationale: Die üblichen deutschen Entsprechungen bewahren die direkte Anrede der beiden Himmelskörper.
- source_word: כָּל כּוֹכְבֵי אוֹר
  choice: all ihr leuchtenden Sterne
  rationale: „All ihr“ macht die direkte Anrede im Deutschen natürlich; „leuchtenden Sterne“ gibt die hebräische Genitivverbindung „Sterne des Lichts“ idiomatisch wieder, ohne ihren Bildgehalt zu verlieren.
theological_decisions:
- issue: Personifizierung der Himmelskörper im Lob Gottes
  choice: Die unmittelbare Aufforderung an Sonne, Mond und Sterne bleibt erhalten.
  alternative: Den Vers als erklärende Aussage darüber wiederzugeben, dass die Schöpfung Gottes Lob verkündet.
  rationale: Der hebräische Text verwendet wiederholt einen Imperativ im Plural und ruft die Himmelskörper direkt zum Lob auf. Diese poetische Spannung soll nicht durch eine erklärende Paraphrase aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Aufforderung „Lobt ihn“ bildet den hebräischen Parallelismus ab; „all ihr“ kennzeichnet die direkte poetische Anrede natürlich und verständlich.
