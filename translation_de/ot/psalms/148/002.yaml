id: PSA.148.2
reference: Psalms 148:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַֽלְל֥וּ/הוּ כָל מַלְאָכָ֑י/ו הַֽ֝לְל֗וּ/הוּ כָּל צבא/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/002.yaml
  text: Praise him[a], all his angels; praise him, all his hosts.
translation:
  language: de
  text: Lobt ihn, alle seine Engel! Lobt ihn, sein ganzes Heer![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine Heerscharen«; auch: »sein ganzes himmlisches Heer«.'
    reason: Lexikalische Alternativen für צְבָאוֹ; der Ausdruck kann Heer, Heerschar(en) oder im Kontext das himmlische Heer bezeichnen.
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Lobt ihn
  rationale: Der pluralische Imperativ von הלל mit Suffix der 3. Person Singular wird als direkte Aufforderung an mehrere himmlische Wesen wiedergegeben. „Lobt ihn“ ist natürlich, gegenwärtig und bewahrt die Befehlsform.
- source_word: כָל
  choice: alle / ganzes
  rationale: כָל bezeichnet jeweils die Gesamtheit. Vor dem Plural „Engel“ ist „alle“, vor dem singularischen Kollektiv „Heer“ idiomatisch „sein ganzes“.
- source_word: מַלְאָכָיו
  choice: seine Engel
  rationale: Im Zusammenhang des himmlischen Lobaufrufs sind mit מַלְאָכִים himmlische Wesen gemeint, nicht menschliche Boten. „Engel“ ist hier die klare Standardwiedergabe.
- source_word: צְבָאוֹ
  choice: sein ganzes Heer
  rationale: צָבָא kann ein Heer, eine Heerschar oder eine geordnete Schar bezeichnen. Parallel zu „seine Engel“ meint es hier Gottes himmlisches Heer; „Heer“ bewahrt zugleich die knappe militärisch-kosmische Bildsprache.
theological_decisions:
- issue: Bezug der pronominalen Suffixe („ihn“, „seine“, „sein“)
  choice: Die Pronomen beziehen sich auf den HERRN, zu dessen Lob der Psalm aufruft.
  alternative: Den Gottesnamen im Vers ausdrücklich wiederholen.
  rationale: Vers 1 nennt den HERRN als Gegenstand des Lobes; Vers 2 führt den Aufruf mit Pronomen fort. Die Pronomen werden entsprechend dem Hebräischen bewahrt, ohne den Vers erklärend zu erweitern.
- issue: Identität von צְבָאוֹ
  choice: Gottes himmlisches Heer als kollektive Größe, parallel zu seinen Engeln.
  alternative: „alle seine Heerscharen“ oder allgemeiner „alle seine Scharen“.
  rationale: Der kosmische Kontext und der Parallelismus mit den Engeln sprechen für himmlische Wesen. Die Wiedergabe lässt offen, ob der zweite Ausdruck dieselbe Gruppe neu bezeichnet oder einen umfassenderen himmlischen Verband meint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Parallelismus. Die wiederholte Imperativform des Hebräischen bleibt erhalten; Ausrufezeichen verdeutlichen den Lobaufruf. „Heer“ ist verständlicher als das gehobenere „Heerscharen“, während die Fußnote die traditionelle und die kontextuell explizite Alternative bewahrt.
