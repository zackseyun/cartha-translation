source:
  edition: WLC
  text: וַ/יַּעֲמִידֵ֣/ם לָ/עַ֣ד לְ/עוֹלָ֑ם חָק נָ֝תַ֗ן וְ/לֹ֣א יַעֲבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
translation:
  language: de
  text: Er ließ sie für immer und ewig bestehen; er gab eine Ordnung[a], und sie wird nicht vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er gab eine Ordnung, die sie nicht überschreiten«, oder: »die niemand überschreitet«. Der letzte Satzteil ist im Hebräischen mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  choice: er gab ihnen festen Bestand
  rationale: Der Hifil von עמד mit Suffix bedeutet, dass Gott sie bestehen lässt bzw. fest bestehen macht. Die deutsche Wendung ist natürlich und gibt im kosmischen Zusammenhang die Beständigkeit der geschaffenen Dinge wieder.
- source_word: לָעַד לְעוֹלָם
  choice: für immer und ewig
  rationale: Die beiden Ausdrücke verstärken einander und bezeichnen unaufhörliche Dauer; die geläufige deutsche Paarformel bewahrt diese Intensivierung.
- source_word: חָק
  choice: eine Ordnung
  rationale: חֹק kann eine Satzung, gesetzte Grenze oder festgelegte Ordnung bezeichnen. Im Schöpfungszusammenhang vermittelt »Ordnung« den Gedanken einer von Gott bestimmten Regelmäßigkeit, ohne den Ausdruck unnötig auf Rechtssprache zu verengen.
- source_word: נָתַן
  choice: er gab
  rationale: Die Grundbedeutung von נתן ist »geben«. Auch die Verbindung »eine Ordnung geben« ist im Deutschen verständlich und bleibt nahe an der hebräischen Formulierung.
- source_word: וְלֹא יַעֲבוֹר
  choice: und sie wird nicht vergehen
  rationale: עבר kann »vorübergehen«, »überschreiten« oder »übertreten« bedeuten. Die Wiedergabe bezieht das maskuline Singularverb auf חֹק und betont die bleibende Geltung der gesetzten Ordnung; die anderen syntaktisch möglichen Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Subjekt und Bedeutung von וְלֹא יַעֲבוֹר
  choice: Die Ordnung selbst vergeht nicht.
  alternative: 'Die geschaffenen Dinge überschreiten die Ordnung nicht; oder: Niemand überschreitet sie.'
  rationale: Das hebräische Singularverb und das fehlende ausdrückliche Objekt lassen mehrere Deutungen zu. Der Haupttext folgt dem naheliegenden Bezug auf חֹק als bleibende göttliche Ordnung, ohne die echten Alternativen zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Festen Bestand geben« vermeidet die missverständliche räumliche Bedeutung von »hinstellen«; »Ordnung« passt zum Schöpfungskontext. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Ausdruck.
