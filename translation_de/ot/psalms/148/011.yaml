lexical_decisions:
- source_word: מַלְכֵי אֶרֶץ
  choice: ihr Könige der Erde
  rationale: Der hebräische Konstruktplural bezeichnet die Könige der Erde. Im Deutschen macht die Anrede mit „ihr“ den in Psalm 148 fortgeführten Aufruf zum Lob natürlich und eindeutig.
- source_word: וְכָל לְאֻמִּים
  choice: und alle Völker
  rationale: לְאֻמִּים bezeichnet Völker beziehungsweise Nationen. „Völker“ wahrt den umfassenden Sinn, ohne moderne Nationalstaaten vorauszusetzen.
- source_word: שָׂרִים
  choice: ihr Fürsten
  rationale: שָׂרִים bezeichnet hochrangige Herrscher oder Amtsträger. „Fürsten“ bewahrt den gehobenen poetischen Ton; das wiederholte „ihr“ gliedert die deutsche Aufzählung.
- source_word: וְכָל שֹׁפְטֵי אָרֶץ
  choice: und alle Richter der Erde
  rationale: שֹׁפְטֵי ist die substantivische Form zu שׁפט und wird unmittelbar mit „Richter“ wiedergegeben. Der universale Zusammenhang des Psalms spricht bei אָרֶץ für „Erde“.
theological_decisions:
- issue: Reichweite von אֶרֶץ im Lobaufruf
  choice: Erde
  alternative: Land
  rationale: Psalm 148 ruft die gesamte Schöpfung zum Lob auf. Daher ist hier der universale Sinn „Erde“ wahrscheinlicher; die lokalere Bedeutung „Land“ bleibt lexikalisch möglich und wird in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Anredepartikel „ihr“ wird zur natürlichen Einbindung in den fortlaufenden Lobaufruf ergänzt; die parallele Struktur und die umfassende Aufzählung bleiben erhalten.
