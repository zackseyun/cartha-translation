translation:
  language: de
  text: ihr wilden Tiere und alles Vieh, ihr Kriechtiere und geflügelte Vögel,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחַיָּה
  choice: wilden Tiere
  rationale: חַיָּה bezeichnet hier im Gegensatz zu בְּהֵמָה die wild lebenden Tiere. »Wilde Tiere« ist im modernen Deutsch klar und nicht altertümlich.
- source_word: וְכָל בְּהֵמָה
  choice: und alles Vieh
  rationale: בְּהֵמָה meint hier die domestizierten Tiere; »Vieh« bewahrt den Gegensatz zu den wilden Tieren. »Alles« gibt כָּל wieder.
- source_word: רֶמֶשׂ
  choice: Kriechtiere
  rationale: רֶמֶשׂ ist eine Sammelbezeichnung für kleine Tiere, die sich kriechend oder krabbelnd fortbewegen. »Kriechtiere« ist knapp und verständlich, ohne einzelne Arten festzulegen.
- source_word: וְצִפּוֹר כָּנָף
  choice: und geflügelten Vögel
  rationale: Die Verbindung bedeutet wörtlich etwa »Flügelvogel«. »Geflügelte Vögel« erhält das hebräische Flügelmotiv und klingt im poetischen Aufruf würdevoll.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller poetischer Aufruf. Das vorangestellte »ihr« macht die im Zusammenhang angesprochene Reihe der zum Lob aufgerufenen Geschöpfe im Deutschen natürlich; es ist aus dem syntaktischen Kontext ergänzt. Die Paarung »wilde Tiere / Vieh« erhält den Gegensatz zwischen wild lebenden und domestizierten Tieren.
