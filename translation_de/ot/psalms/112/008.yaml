source:
  edition: WLC
  text: סָמ֣וּךְ לִ֭בּ/וֹ לֹ֣א יִירָ֑א עַ֖ד אֲשֶׁר יִרְאֶ֣ה בְ/צָרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/008.yaml
  text: His heart is steadfast[b][a]; he will not fear until he looks on his adversaries.
translation:
  language: de
  text: Sein Herz ist fest; er fürchtet sich nicht, bis er auf seine Gegner blickt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis er auf seine Gegner blickt“. Die hebräische Wendung kann im Zusammenhang ein Schauen auf einen für die Gegner nachteiligen Ausgang einschließen, ohne diesen Ausgang ausdrücklich zu benennen.'
    reason: Die knappe Formulierung wird im Haupttext bewahrt; die mögliche kontextuelle Nuance wird erläutert, ohne „Niederlage“ oder „Triumph“ als ausdrücklichen Textinhalt festzulegen.
lexical_decisions:
- source_word: סָמוּךְ
  choice: fest
  rationale: Das passive Partizip bezeichnet etwas Gestütztes, Gefestigtes oder Sicheres. Bezogen auf das Herz gibt „fest“ die innere Beständigkeit knapp und natürlich wieder.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: לֵב bezeichnet hier den inneren Menschen, besonders Denken, Willen und Entschlossenheit. „Herz“ bewahrt die geläufige Bildsprache des Psalms.
- source_word: לֹא יִירָא
  choice: er fürchtet sich nicht
  rationale: Das Imperfekt kann eine anhaltende oder zukünftige Haltung ausdrücken. Das deutsche Präsens bezeichnet hier passend seine dauerhafte Furchtlosigkeit.
- source_word: עַד אֲשֶׁר
  choice: bis
  rationale: Die Verbindung leitet einen zeitlichen Zielpunkt ein. „Bis“ bewahrt diese Struktur, ohne den Zeitpunkt als Ende seiner Zuversicht verstehen zu müssen.
- source_word: יִרְאֶה בְצָרָיו
  choice: er sieht, was mit seinen Gegnern geschieht
  rationale: ראה mit ב und einem feindlichen Gegenüber kann in diesem Zusammenhang das Erleben oder Anschauen des Ausgangs für die Gegner bezeichnen. Die Formulierung vermeidet das irreführende Verständnis, seine Furchtlosigkeit ende, sobald er die Gegner erblickt, ohne ausdrücklich „Triumph“ oder „Sturz“ in den Haupttext einzutragen.
- source_word: צָרָיו
  choice: seine Gegner
  rationale: צַר bezeichnet einen Feind, Widersacher oder feindseligen Gegner. „Gegner“ ist im heutigen Deutsch natürlich und lässt die genaue Art der Feindschaft offen.
theological_decisions:
- issue: Bedeutung des Schauens auf die Gegner
  choice: Als Erleben des Ausgangs für die Gegner wiedergegeben
  alternative: „bis er auf seine Gegner blickt“ beziehungsweise deutender „bis er triumphierend auf seine Gegner blickt“
  rationale: Die knappe hebräische Wendung lässt den erwarteten Ausgang unausgesprochen. Eine rein wörtliche Wiedergabe könnte fälschlich bedeuten, dass die Furcht beim Anblick der Gegner einsetzt; „triumphierend“ würde dagegen die implizierte Genugtuung ausdrücklich auslegen. Der Haupttext wahrt den eschatologisch oder zeitgeschichtlich offenen Ausgang.
translation_notes:
  register: Knappe, würdevolle Psalmsprache in modernem Standarddeutsch. Der Parallelismus bleibt durch zwei kurze Hauptsätze erhalten; die Schlusswendung wird behutsam verdeutlicht, um ein sachlich gegenteiliges Missverständnis zu vermeiden.
