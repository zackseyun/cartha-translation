  text: מִ/שְּׁמוּעָ֣ה רָ֭עָה לֹ֣א יִירָ֑א נָכ֥וֹן לִ֝בּ֗/וֹ בָּטֻ֥חַ בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/007.yaml
  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: de
  text: Vor schlechter Nachricht fürchtet er sich nicht[a]; sein Herz ist fest[b] und vertraut auf Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vor einer schlimmen Meldung hat er keine Angst.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Herz ist gefestigt“ beziehungsweise „sein Herz steht fest“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: vor schlechter Nachricht
  rationale: Die Verbindung bezeichnet eine schlimme oder beunruhigende Nachricht. Die Präposition מִן wird zusammen mit dem Verb des Fürchtens im Deutschen natürlich mit „vor“ wiedergegeben.
- source_word: לֹא יִירָא
  choice: fürchtet er sich nicht
  rationale: Das Imperfekt beschreibt im Weisheitspsalm ein kennzeichnendes Verhalten; das deutsche Präsens drückt diesen allgemeinen Sachverhalt natürlich aus.
- source_word: נָכוֹן
  choice: fest
  rationale: Das Wort beschreibt das Herz als gefestigt, beständig oder sicher gegründet. „Fest“ ist knapp, natürlich und bewahrt die Bildsprache.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: „Herz“ bezeichnet hier den inneren Menschen, besonders Haltung, Willen und Zuversicht.
- source_word: בָּטֻחַ
  choice: vertraut
  rationale: Die Form bezeichnet einen Zustand vertrauensvoller Sicherheit. Mit der folgenden Präpositionalphrase ergibt „vertraut auf“ eine natürliche deutsche Wiedergabe.
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: Die Präposition bezeichnet hier die Person, auf die sich das Vertrauen richtet; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den Gottesnamen direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von festem Herzen und Vertrauen
  choice: sein Herz ist fest und vertraut auf Jahwe
  alternative: sein Herz ist fest, weil es auf Jahwe vertraut
  rationale: Der hebräische Text stellt beide Aussagen nebeneinander, ohne die logische Beziehung ausdrücklich als Begründung zu markieren. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist knapp und folgt dem parallelen Aufbau des hebräischen Verses; „Nachricht“ ist gegenwärtiger als „Kunde“, während „Herz“ die biblische Bildsprache erhält.
