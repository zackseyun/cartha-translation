source:
  edition: WLC
  text: זָ֘רַ֤ח בַּ/חֹ֣שֶׁךְ א֭וֹר לַ/יְשָׁרִ֑ים חַנּ֖וּן וְ/רַח֣וּם וְ/צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/004.yaml
  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: de
  text: In der Dunkelheit geht den Aufrichtigen ein Licht auf[a]; er ist gnädig, barmherzig und gerecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »In der Dunkelheit geht den Aufrichtigen ein Licht auf – gnädig, barmherzig und gerecht.« Die letzten drei Eigenschaftswörter können dabei zugleich an den Charakter des HERRN in Psalm 111,4 erinnern.'
    reason: Alternative syntaktische Zuordnung und intertextueller Bezug.
lexical_decisions:
- source_word: זָרַח
  choice: geht … auf
  rationale: Das Verb bezeichnet das Aufgehen oder Hervorstrahlen von Licht. Die deutsche Wendung »ein Licht geht auf« ist natürlich, poetisch und bewahrt hier den bildhaften Sinn des hebräischen Perfekts als allgemeine beziehungsweise verlässlich eintretende Wirklichkeit.
- source_word: בַּחֹשֶׁךְ
  choice: in der Dunkelheit
  rationale: Die Präposition mit bestimmtem Artikel wird direkt wiedergegeben. »Dunkelheit« lässt sowohl den konkreten als auch den übertragenen Sinn offen.
- source_word: אוֹר
  choice: ein Licht
  rationale: אוֹר ist das Subjekt des ersten Satzteils. Der unbestimmte Artikel ist im Deutschen für die idiomatische Verbindung »ein Licht geht auf« erforderlich, ohne dass damit die Aussage unnötig eingeengt wird.
- source_word: לַיְשָׁרִים
  choice: den Aufrichtigen
  rationale: Die Bezeichnung meint Menschen von moralischer Geradheit. »Aufrichtigen« wahrt die lexikalische Unterscheidung zu צַדִּיק am Versende.
- source_word: חַנּוּן
  choice: gnädig
  rationale: Das Adjektiv bezeichnet jemanden, der Gunst und Gnade erweist. »Gnädig« entspricht dem etablierten biblischen Sprachgebrauch und bleibt verständlich.
- source_word: רַחוּם
  choice: barmherzig
  rationale: Das Wort hebt mitfühlendes Erbarmen hervor. »Barmherzig« ist im Deutschen natürlich und unterscheidet den Begriff von »gnädig«.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Adjektiv bezeichnet moralische beziehungsweise gemeinschaftstreue Gerechtigkeit. »Gerecht« passt zur Charakterbeschreibung und unterscheidet sich von »aufrichtig«.
theological_decisions:
- issue: Bezug der drei Schlussadjektive חַנּוּן וְרַחוּם וְצַדִּיק
  choice: Im Haupttext beziehen sie sich durch das ergänzte »er ist« auf den einzelnen gerechten Menschen, der den Psalm im unmittelbaren Zusammenhang prägt.
  alternative: Die Adjektive können enger mit dem vorausgehenden »Licht« verbunden gelesen werden oder durch ihre Anlehnung an Psalm 111,4 auf den HERRN und seinen Charakter verweisen.
  rationale: Die Adjektive stehen im Singular, während »die Aufrichtigen« Plural ist. Der weitere Kontext von Psalm 112 spricht jedoch wiederholt im Singular vom gottesfürchtigen und gerechten Menschen. Zugleich wiederholt die Formulierung Eigenschaften des HERRN aus Psalm 111,4. Die Fußnote bewahrt diese grammatische und theologische Spannung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Wendung »ein Licht geht auf« vermittelt das poetische Bild natürlich. Der Hauptsatz bleibt knapp; die Fußnote macht die echte syntaktische und theologische Mehrdeutigkeit sichtbar.
