  source_fidelity: 'Der Haupttext gibt die hebräischen Elemente treffend wieder: זרח als »geht ... auf«, בַּחֹשֶׁךְ als »in der Dunkelheit«, אוֹר als Subjekt und לישרים als »den Aufrichtigen«. Die Trias חנון ורחום וצדיק ist mit »gnädig, barmherzig und gerecht« differenziert und sachgerecht wiedergegeben. Das ergänzte »er ist« entscheidet sich im Haupttext plausibel für den im Psalmkontext präsenten einzelnen Frommen, während die Fußnote die tatsächlich bestehende Zuordnungs- und Anspielungsfrage wahrt.'
