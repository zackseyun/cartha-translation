id: PSA.112.2
reference: Psalms 112:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גִּבּ֣וֹר בָּ֭/אָרֶץ יִהְיֶ֣ה זַרְע֑/וֹ דּ֭וֹר יְשָׁרִ֣ים יְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: de
  text: Seine Nachkommen werden mächtig sein im Land[a]; das Geschlecht der Aufrichtigen wird gesegnet sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der Erde«; das hebräische Wort אֶרֶץ kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: mächtig
  rationale: Das Wort bezeichnet hier prädikativ Stärke oder Einfluss der Nachkommen, ohne sie ausdrücklich als Krieger zu bestimmen. »Mächtig« bewahrt den gehobenen und zugleich weiten Sinn.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Im gesellschaftlichen und weisheitlichen Zusammenhang des Psalms ist »im Land« naheliegend; die echte lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: יִהְיֶה
  choice: werden … sein
  rationale: Die deutsche Futurform gibt die Aussage als erwartete Folge beziehungsweise Segenszusage natürlich wieder.
- source_word: זַרְעוֹ
  choice: seine Nachkommen
  rationale: זֶרַע bezeichnet hier kollektiv die Nachkommenschaft. »Nachkommen« ist im modernen Deutsch natürlich und erfasst diesen kollektiven Familiensinn.
- source_word: דּוֹר
  choice: das Geschlecht
  rationale: Im Konstrukt mit יְשָׁרִים bezeichnet דּוֹר die Generation beziehungsweise Nachkommenschaft der Aufrichtigen. »Geschlecht« vermeidet hier die mögliche zeitgeschichtliche Verengung von »Generation«.
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: »Aufrichtige« bewahrt die Vorstellung moralischer Geradheit und unterscheidet das Wort von צַדִּיק, »gerecht«, das ebenfalls im Psalm vorkommt.
- source_word: יְבֹרָךְ
  choice: wird gesegnet sein
  rationale: Die passive Segenssprache von ברך bleibt ausdrücklich erhalten und wird nicht auf materielles Wohlergehen reduziert.
theological_decisions:
- issue: Reichweite der Segensaussage in einem Weisheitspsalm
  choice: Die umfassende Aussage über Stärke und Segen der Nachkommen bleibt ohne nähere Eingrenzung stehen.
  alternative: Den Segen ausschließlich als materiellen Wohlstand oder als garantierte Errettung der Nachkommen verstehen.
  rationale: Der hebräische Text spricht in breiten weisheitlichen und gemeinschaftsbezogenen Begriffen. Die Übersetzung soll weder eine rein materielle noch eine ausschließlich heilsgeschichtliche Deutung festschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des hebräischen Verses wird bewahrt. »Nachkommen« gibt den kollektiven Sinn natürlich wieder; »Geschlecht« trägt im zweiten Halbvers die Vorstellung einer zusammengehörigen Generation beziehungsweise Nachkommenschaft.
