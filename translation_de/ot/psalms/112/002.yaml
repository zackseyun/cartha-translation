  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Nominalsätze beziehungsweise Zukunftsaussagen sachgerecht wieder: זַרְעוֹ als kollektive „Nachkommen“, גִּבּוֹר als „mächtig“, בָּאָרֶץ als „im Land“ und יְבֹרָךְ als ausdrücklich passive Segensaussage. Die offene Bedeutung von אֶרֶץ wird zutreffend in der Fußnote kenntlich gemacht. Die generische Aussage über „das Geschlecht der Aufrichtigen“ bleibt erhalten, ohne den Segen inhaltlich einzuengen.'
  naturalness: „Seine Nachkommen werden mächtig sein im Land; das Geschlecht der Aufrichtigen wird gesegnet sein“ ist verständliches, würdiges modernes Standarddeutsch. Die leicht gehobene Wendung „das Geschlecht der Aufrichtigen“ passt zum poetisch-weisheitlichen Register und bewahrt die parallele Struktur des Verses.
  terminology: „Aufrichtige“ bildet יְשָׁרִים angemessen ab und wahrt die begriffliche Unterscheidung zu „Gerechte“. „Gesegnet“ erhält die religiös-theologische Sprache von ברך, ohne eine bestimmte Deutung des Segens vorzuschreiben. Namen oder sonstige terminologische Fragen sind nicht betroffen.
